<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

kplace Well-Being in Uzbekistan: The Mediating Role of Behaviour-Related Stress in TALIS 2024", "url": "https://doi.org/10.21203/rs.3.rs-10734945/v1", "authors": "Feruza Shakirova ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "theme": "職場AI・組織行動", "theme_no": 7}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "複雑な仕事ほど若手をAIに置き換えにくい", "title": "Will AI Replace Juniors? How Task Complexity Reduces Automation Risk", "url": "https://arxiv.org/abs/2611.34099", "authors": "Vincent Rost ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "ドイツの情報経済と製造業の1,435社の管理職を対象にした事前登録の調査実験。追加の人手が必要な業務を、定型的な業務か、専門的な判断と文脈の知識が要る複雑な業務かに無作為に割り当てた。複雑な業務では、新人を雇う代わりにAIを使う意向が5段階で0.54点下がり、人による監督の重要度が0.15点上がった。AIが若手の仕事を奪うかどうかは業務の複雑さに左右されることを、企業の判断の側から示した。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "回路をトークンごとに組み替える注意機構", "title": "Rewirable Circuits in Transformers with Loom Attention", "url": "https://arxiv.org/abs/2611.30634", "authors": "Da Xiao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "why": "ヘッドが先行するヘッドの出力に向ける縦の注意と、トークンに向ける横の注意を織り合わせる「ルーム注意」を提案した。圧縮したヘッド出力を持つ行列の記憶を第2の残差流として使う。言語モデルの学習と下流課題で、3倍超の計算量で学習したTransformerに並び、同じ3,000億トークン・FLOPs2%増の条件で既存の残差流の改良より高い下流性能を得たと報告する。Hugging Faceで投票数92。"}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "模擬課題から推論の規則そのものを学習する", "title": "Learning to Infer: Statistical Inference through Meta Learning", "url": "https://arxiv.org/abs/2611.33742", "authors": "Xiaolu Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "ニューラルネットワークが模擬データの課題から統計的推論の規則を学び、新しいデータにパラメータ更新なしで適用するメタ学習を、統計的決定理論で定式化した。学習目的の最小解がベイズ規則になるよう設計し、推定の漸近有効性、モデル選択の一致性、高次元回帰の変数選択の保証を示す。順序に依存しない集約と残差更新を繰り返す構造を提案する。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "企業間取引網での位置が衝撃の伝わり方を決める", "title": "Beyond Firm Size: Network Position and Shock Transmission in Firm-to-Firm Production Networks Across Five Economies", "url": "https://doi.org/10.2139/ssrn.7749842", "authors": "Glenn Magerman ほか", "venue": "SSRN", "date": "2026-11-25", "why": "ベルギー・エストニア・ハンガリー・イタリア・ポルトガルの付加価値税の行政記録から、企業間の生産ネットワークを同じ基準で構築した。企業規模と中心性は集計への一次の影響を要約するが、生産連鎖の上下の位置は規模と直交し、衝撃の伝わり方を左右する。産業内の規模のばらつきの約半分は、生産性ではなく顧客数を反映するという。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "証拠が足りないのに答えるAIの「怠け」を矯正", "title": "Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe", "url": "https://arxiv.org/abs/2611.32884", "authors": "Richmond Sin Jing Xuan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "why": "長い課題でエージェントが、自分の表明した信念がまだ複数の答えを残している段階で回答を確定してしまう現象を示した。学習時にシミュレータが答えの正確な事後分布を計算できることを使い、事後分布がまだ複数の答えを許す間は調査を続け、証拠が足りたら確定することに報酬を与える強化学習を提案する。審査用のモデルや報酬モデルは要らない。Hugging Faceで投票数98。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "分布やネットワークが結果でも効果の異質性を推定", "title": "Geodesic Causal Forests: Learning Heterogeneous Treatment Effects for Random Objects", "url": "https://arxiv.org/abs/2611.33350", "authors": "Yidong Zhou", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "結果が構成比・共分散行列・分布・ネットワークのように線形構造のない距離空間の対象であるときの、条件つきの処置効果を推定する因果フォレストを提案した。測地線に沿う輸送で個人間の効果を比較可能にし、足し引きができない代わりに二乗距離の損失を補正する。ユークリッド空間では二重頑健な学習に一致し、一致性と収束率を示す。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "賃金交渉が採用で不利になる水準は女性で低い", "title": "When Does Negotiation Backfire? Gender, Job Levels, and Wage Demand Levels", "url": "https://doi.org/10.31235/osf.io/wn8p9", "authors": "Yuriko Morikawa ほか", "venue": "SocArXiv", "date": "2026-11-25", "why": "日本企業の採用担当者967人への要因配置型の調査実験で、応募者の性別、応募する職位、自社の賃金水準に対する要求額を変え、交渉しない場合と採用の見込みを比べた。要求額が上がると交渉は不利に働き、その不利は管理職で非管理職より低い要求水準から現れ、同じ職位では女性で男性より低い水準から現れた。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "FOMCの議論の不一致が成長リスクの予測を改善", "title": "Reading the Room with AI: FOMC Deliberation and Growth-at-Risk", "url": "https://arxiv.org/abs/2611.34423", "authors": "Alvaro Ortiz (BBVA Research) ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "会合の3週間後に公開されるFOMCの議事要旨から熟議の特徴を取り出し、FRED-MDの123系列による成長率の分位点モデルに加えた。投票には現れないが議論の中にある不一致だけが、標本外の損失を4〜6%下げ、専門家・スタッフ・委員会の予測を超える情報を持っていた。委員会が明示するリスク評価より、記録された議論そのものに情報があることを示す。"}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "登録簿だけの国勢調査は照合誤りが大きな壁", "title": "The Illusion of an Automated German Census: Assessing the Feasibility of the 2031 Register-Based Census via Simulation", "url": "https://arxiv.org/abs/2611.33949", "authors": "R. Schnell (University of Duisburg-Essen) ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "ドイツが2031年に予定する、行政の登録簿だけによる初の国勢調査の実現可能性を、約8,021万人の合成人口で検証した。氏名や生年月日などの準識別子で登録簿を照合する際の品質を1,458の条件で変えると結果は大きく振れ、現実的な想定でも登録簿1つにつき50万〜100万件の照合漏れが生じうる。自動化だけでは難しく、手作業の後処理が要ると示唆する。"}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "粗い予報と疎な観測から高解像度の解析場を生成", "title": "BridgeSRDA: Efficient Probabilistic Super-Resolution Data Assimilation with Forecast-Informed Stochastic Interpolants", "url": "https://arxiv.org/abs/2611.33720", "authors": "Aditya Sai Pranith Ayapilla ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "低解像度の数値予報と、疎でノイズのある観測を組み合わせて高解像度の解析場を生成する、確率的な超解像データ同化の枠組みを示した。予報の情報を取り込んだ確率的な輸送をニューラルネットワークが学び、アンサンブルを生成する。学習時と異なる3次元準地衡流で評価し、高解像度の局所アンサンブル変換カルマンフィルタに近い精度を得たと報告する。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "負債の重い企業は排出枠の引き締めに反応しない", "title": "Leverage and the Low-Carbon Transition in Europe", "url": "https://doi.org/10.2139/ssrn.7753344", "authors": "Katia Vozian ほか", "venue": "SSRN", "date": "2026-11-25", "why": "EU排出量取引制度の2,421社の検証済み排出量を使い、2015年の制度の引き締めを利用して企業のレバレッジと排出削減の関係を調べた。排出枠が不足する企業は余剰のある企業より排出効率を10〜15%改善したが、それは負債比率が約40%未満の企業に限られ、負債の重い企業は反応しなかった。排出量取引の効果が企業の財務状態に依存することを示す。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "RI-CLPMが識別できる条件を厳密に導く", "title": "The Random Intercept Cross-Lagged Panel Model as a Statistical Model: Identification, Estimation, and Model Comparison", "url": "https://arxiv.org/abs/2611.34663", "authors": "Zihao Cao", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "個人間の安定した差と個人内の時間差の関連を分けるランダム切片交差遅延パネルモデルの統計的な性質を、行列表現で調べた。遷移行列と誤差共分散が時点ごとに変わる場合の大域的な識別の必要十分条件を導き、遷移が一定なら3時点で足りる条件を示す。従来の交差遅延モデルの係数がどれだけずれるかの式も与える。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "現実から模擬環境を作る手法を共通の土台で評価", "title": "Real2SimLab: A Unified Platform for Real-to-Simulation Transfer", "url": "https://arxiv.org/abs/2611.34849", "authors": "Yongchang Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "why": "映像などの実世界の観測からシミュレーションのプログラムを生成する研究で、ベンチマークごとに入力・成果物・採点が異なる問題に対し、手法が書いたプログラムを実行して各ベンチマーク本来の採点器で評価する統一基盤を示した。学習データと報酬の注釈を作るパイプラインも提供し、評価用の映像との重複を除く。Hugging Faceで投票数100。"}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "長時間働くCEOほど部下の評価を受けたがらない", "title": "The CEOs Who Won't Be Measured: Access, Self-Other Gaps and Working Hours in a Preregistered CEO-Team Study", "url": "https://doi.org/10.31234/osf.io/3jwg6", "authors": "Bill Gallagher", "venue": "PsyArXiv", "date": "2026-11-25", "why": "CEOの労働時間とリーダーシップの関係を部下の評価で調べる事前登録研究。推定6万人以上に依頼して回答したCEOは90人、条件を満たす49人のうち必要な3人以上の部下評価が得られたのは15人だった。部下の名簿を出さなかったCEOは週に約8時間長く働いていた（p=.09）。CEOは自分の強みと弱みの順位を部下と同じように認識するが、自己評価は高めだった。"}, {"id": "pn15", "rank": 15, "field": "環境・気候政策", "headline": "陸面モデルCLM5を微分可能にしてGPUで動かす", "title": "CLM-JAX v3.2.46: a differentiable, GPU-accelerated land surface model numerically indistinguishable from the Community Land Model 5.0", "url": "https://arxiv.org/abs/2611.34574", "authors": "Shijin Yuan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "FortranのCommunity Land Model 5.0をPython（JAX）で実装し直し、エネルギー・水・炭素・窒素・作物の過程の結合を保ったままGPUで動き、多段階の時間積分を通して勾配を逆伝播できるようにした。2019〜2023年の全球5年間・32変数で、元のモデル自身の微小な摂動によるばらつき以内に誤差が収まることを確かめた。"}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "主層の無視可能性が破れたときの鋭い感度分析", "title": "Sharp sensitivity bounds and maximin policy learning under violations of principal ignorability", "url": "https://arxiv.org/abs/2611.33585", "authors": "Sihyung Park ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "遵守者での割り当て効果の識別に使う主層の無視可能性は検証できない。平均と範囲だけに基づく従来の感度分析は観測データと両立しない分布を許してしまうため、観測された結果の分布と遵守者の割合を保つ分布的な感度モデルを作り、効果と方策の価値の鋭い境界を導いた。二重頑健な推定と、最悪の場合に備える方策学習も示す。"}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "言語モデルと画像モデルの内部は回転でほぼ重なる", "title": "The Platonic Representation Hypothesis in Jacobian-Space: Language and Vision Models Agree Approximately Up to a Rotation", "url": "https://arxiv.org/abs/2611.33304", "authors": "Ross Murphy ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "異なる種類のデータで学習したモデルが共通の表現に収束するという仮説を、活性化ではなく、内部表現が出力に与える影響を表すヤコビアンの空間で調べた。語彙や分類クラスごとのベクトルが作る空間が言語モデルと画像モデルの間で対応し、その対応はほぼ1つの回転で表せるという証拠を示す。"}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "自動化は労働課税に頼る国の財政を圧迫する", "title": "AI, Automation, and Fiscal Pressure", "url": "https://arxiv.org/abs/2611.34234", "authors": "Spencer Bastani ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "労働を資本より重く課税し、医療や教育を税で賄う国で自動化が財政に与える影響を、タスク単位の自動化を入れた2部門の一般均衡モデルで調べた。自動化は所得を課税の軽い資本へ移す。EU27か国に合わせた基準シナリオでは、自動化で経済が12%成長する一方、財政赤字が付加価値の約1ポイント増える。"}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "模擬器の誤りによる系統誤差を影響マップで測る", "title": "When precision exceeds fidelity: systematic error quantification for inference with misspecified simulators", "url": "https://arxiv.org/abs/2611.33282", "authors": "M. J. Yantovski-Barth ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "データの精度が上がると、パラメータ推論の不確かさは測定ノイズよりシミュレータ自体の系統誤差で決まる。誤特定のもとではベイズの証拠が最も近いモデルに集中し、モデル平均が系統誤差を過小評価しうる。データの摂動に対する推定値の局所的な応答（影響マップ）を既存の事後標本から推定し、食い違いの残差を伝播させて系統誤差の源を切り分ける方法を示す。"}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "気候への関心が高い地域ほど保険料がリスクを反映", "title": "Who Pays for Climate Risk? Household Attention, Insurance Markets, and Regulation", "url": "https://doi.org/10.2139/ssrn.7727383", "authors": "Lin Peng ほか", "venue": "SSRN", "date": "2026-11-25", "why": "米国の郡単位のデータで、住民の気候への関心が災害リスクと住宅保険料・住宅価格の関係をどう変えるかを調べた。関心が1標準偏差高いと、保険料のリスクへの反応が16.7%強まる。操作変数と不動産サイトの気候リスク表示の導入も因果的な解釈を支持する。保険料の規制が厳しい州では保険料の反応が弱く、住宅価格の割引が大きい。"}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "低賃金企業は離職先が失業であることが多い", "title": "The Churn Ladder", "url": "https://doi.org/10.2139/ssrn.7753820", "authors": "Lawrence Warren ほか", "venue": "SSRN", "date": "2026-11-25", "why": "労働者が低賃金・高離職の企業から高賃金・低離職の企業へ移る「離職のはしご」を実測した。標準的なジョブラダーモデルは引き抜きだけでは企業間の離職率の差を再現できず、低賃金企業ほど非就業への離職が多いことが差を広げている。企業と労働者の両方の離職率の異質性を入れ、賃金と離職の同時分布を再現する。"}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "AIで失う知識職の雇用は総需要しだいで補われる", "title": "When AI Automates Knowledge Work: Aggregate Demand and Occupational Adjustment", "url": "https://doi.org/10.2139/ssrn.7727199", "authors": "Baris Soybilgen", "venue": "SSRN", "date": "2026-11-25", "why": "AIが担える知識労働のタスクの割合が6年で5%から35%に上がるとき、知識職の人が手作業の職で補える雇用の割合を米国の労働市場モデルで調べた。雇用を左右するのは職の適性より、AIが生む所得がどれだけ支出されるかだった。資本所有者が増えた所得の半分を支出する基本ケースでは、20年で知識職の雇用減の40%が手作業の職で補われる。"}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "遠隔交渉は合意しやすいが分け前が不平等になる", "title": "Does Physical Presence Matter? Efficiency and Inequality in Remote Negotiations&nbsp;", "url": "https://doi.org/10.2139/ssrn.7727184", "authors": "Faeze Heydari ほか", "venue": "SSRN", "date": "2026-11-25", "why": "事前登録の実験室実験で、対面とビデオ通話の交渉を最後通牒ゲームで比べた。遠隔では全組が合意し、対面は92%だった。資源が乏しいとき、対面では均等な分配に収束するが、遠隔でははるかに不平等になる。虚偽の申告や疑いの多さでは説明できず、会話と表情の分析は、対面でないと均等分配が共通の基準点として働きにくいことを示唆する。"}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "予測市場に載った言葉が政治家の発言に増える", "title": "How Prediction Markets Affect Political Speech", "url": "https://doi.org/10.31235/osf.io/n6zxw", "authors": "Jonathan Elkobi ほか", "venue": "SocArXiv", "date": "2026-11-25", "why": "政治家が特定の言葉を口にするかに賭ける予測市場が、政治的な発言そのものに影響する可能性を調べた。市場に載った言葉は、開設後の数日間にトランプ氏の発言に現れやすくなり、取引量が多い市場ほど効果が大きい。連邦準備制度理事会議長の記者会見では同様の効果は見られなかった。"}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "実験の偽陽性が成果連動の報酬をゆがめる", "title": "False Positives and Innovation Incentives: Contracting for Noisy Experimentation", "url": "https://arxiv.org/abs/2611.33916", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "製品の変更がノイズのあるオンライン実験を通過して初めて採用され、報酬が採用に連動する組織を、プリンシパル・エージェントモデルで分析した。価値の低い機能も偶然通過するため、採用連動の賞与は余剰を減らす実験を促す。採用時の賞与と長期の価値の分配を組み合わせた契約を、情報の非対称性のもとで保証できる利得の割合で評価する。"}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "無作為化実験のROC曲線をモデルなしで推測", "title": "Design-based causal inference for ROC curves", "url": "https://arxiv.org/abs/2611.34057", "authors": "Bufan Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "無作為化実験で処置群と対照群の結果の分布を比べるROC曲線について、結果のモデルを置かない設計に基づく推測を示した。順位だけに依存する推定量の漸近正規性と保守的な分散推定を導き、共変量調整で分散が増えないことを示す。同時信頼帯と上側の裾での推測も扱う。"}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "学習した重みつきFDR制御の妥当性を事前に認証", "title": "Certifying a Sufficient Gaussian Dependence Regime for Learned Weighted FDR Control", "url": "https://arxiv.org/abs/2611.33892", "authors": "Soyeong Oh", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "補助データから仮説の重みを学習する多重検定で、重みつきBH法の妥当性は検定間の依存の形に左右される。参照データで片側ガウス検定の十分な依存条件を認証し、認証できなければ調整した水準の代替手順に切り替えることでFDRを制御する方法を示した。一様な認証の障害と、必要な標本数のミニマックスの限界も導く。"}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "低次数の困難性は固有ベクトル検定までは排除しない", "title": "Low-degree hardness rules out eigenvalue tests but not eigenvector tests", "url": "https://arxiv.org/abs/2611.34728", "authors": "Xuan Chen ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "低次数多項式による検出の困難性が、固有値や固有ベクトルに基づく検定に何を意味するかを調べた。一定量のガウスノイズを加えると、低次数の優位が消える問題では固有値に基づくどの検定も働かない。一方、固有値の分布は帰無仮説と完全に同じなのに固有ベクトルで区別できる分布を構成し、固有ベクトル検定は排除されないことを示す。"}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "カウントのネットワーク回帰に使える並べ替え検定", "title": "Permutation tests for Poisson network regression: Double semi-partialling, studentized statistics and actor effects", "url": "https://arxiv.org/abs/2611.34219", "authors": "David Dekker ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "二者間データの推測に使われるMRQAPを、結果がカウントのポアソン回帰に拡張した。二重の部分残差化が必要とするフリッシュ・ウォー・ロベルの定理の不変性が、対数リンクのもとでも成り立つことを証明し、並べ替えの方法と基準化した統計量が検定の水準をどう保つかを示す。"}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "LLM評価の精度は問題数より出典の数で決まる", "title": "How Many Sources, Not Just How Many Problems: Planning the Precision of LLM Evaluations from Earlier Results", "url": "https://arxiv.org/abs/2611.33622", "authors": "Guang Qiu", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "ベンチマークの問題が同じ雛形やリポジトリに由来するとき、評価の予算は問題数だけでなく出典の数も決める必要がある。級内相関による設計効果を使い、出典を減らしたときの得点の標準偏差の増え方を事前のデータから予測できることを示した。GSM-Symbolicでは10雛形×10変種の標準偏差が9.2ポイント、100雛形では2.7ポイントだった。"}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "微調整による忘却は挙動が先で表現は後から変わる", "title": "Two Timescales of Forgetting in Fine-tuning of Language Models: Fast Behavioral Suppression and Slow Representational Drift", "url": "https://arxiv.org/abs/2611.33302", "authors": "Yilin Luo ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "階層的な潜在構造をもつ人工の文法で事前学習したTransformerを、規則の一部だけで微調整して忘却の過程を調べた。表面の挙動の抑制と、それを支える潜在表現の消去が同時に起きるのかを問い、事前学習とは異なる経過をたどることを示す。題名は、挙動の速い抑制と表現の遅い変化という2つの時間スケールを挙げている。"}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "ループ間の受け渡しを再設計したTransformer", "title": "Mixture-of-Loops Transformer", "url": "https://arxiv.org/abs/2611.34923", "authors": "Lianghui Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "why": "同じ層を繰り返し使うループ型Transformerで、ループ間に何を渡すかを見直した。キーと値を記憶として深さとループをまたいで選択的に再利用する注意機構を導入し、残差流を保つ型と、埋め込みからやり直して前のループの記憶を読む型を示す。後者は並列学習と、学習時より長いループでの1回の走査の復号を可能にする。Hugging Faceで投票数56。"}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "PC操作エージェントの評価環境を自動で進化させる", "title": "Self-Evolving Evaluation Environments for Computer-Use Agents", "url": "https://arxiv.org/abs/2611.30962", "authors": "Wenhao Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "why": "コンピュータ操作エージェントの評価が固定的で、難度の上限と粗い総合点が識別力を弱めている問題に対し、実行の記録から課題と実行可能な検証器を一緒に進化させる閉ループの評価環境を示した。評価範囲の拡大、エージェントごとの能力の境界の診断、検証器の精度の向上という3つの目的を分けて扱う。Hugging Faceで投票数51。"}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "鏡を置くだけでロボットの方策は大きく崩れる", "title": "Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies", "url": "https://arxiv.org/abs/2611.33010", "authors": "Xuanchen Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "why": "場面に鏡を置いたときにロボットの操作方策が正しく働くかを調べるベンチマークを作った。課題と成功基準を保ったまま、鏡1枚・2枚・鏡面の卓の条件を比べると、5つの方策すべてで成功率が下がり、低下は平均で10.8〜56.7ポイント、鏡面の卓では最大62.5ポイントだった。同じ形の反射しない板と比べ、鏡に固有の失敗を切り分けている。"}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "物理現象の無次元数をAIエージェントが見つける", "title": "AI Buckingham: Agentic Discovery of Dimensionless Scaling Laws Across Physical Regimes", "url": "https://arxiv.org/abs/2611.33961", "authors": "Ao Cheng ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "次元解析は許される無次元数を定めるが、どの組み合わせが支配的かは決めない。物理問題の記述と観測データから、言語モデルの推論と記号・数値のツールを組み合わせて支配的な無次元数を自律的に見つける枠組みを示した。勾配に基づくクラスタリングで物理領域を分け、相互情報量で支配的な群を選ぶ。流体や熱対流など10の系を扱う。"}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "世界モデルが読めるなら強化学習は要らないか", "title": "Do We Still Need Reinforcement Learning When We Can Read the World Model?", "url": "https://arxiv.org/abs/2611.34656", "authors": "Mingchao Zhang ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "環境のソースコードとして読める世界モデルがあるとき、言語モデルのコーディングエージェントがそれを読んで制御の方策を直接書く方法を調べた。方策はオンラインの結果やオフラインのデータで反復的に改良し、課題ごとの強化学習は行わない。複数のベンチマークで、従来の強化学習と同等以上の成績をはるかに少ない経験で得たと報告する。"}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "分類器なし誘導で生成が偏る仕組みを解析的に説明", "title": "Understanding Mode Collapse in Diffusion Models under Classifier-Free Guidance", "url": "https://arxiv.org/abs/2611.33719", "authors": "Daniel Pfrommer ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "拡散モデルの分類器なし誘導の効果が、条件つき分布と無条件分布の表現力の食い違いから生じると捉えた。条件つき分布を楕円体上に平均をもつガウス混合、無条件分布をその混合を近似する単一のガウス分布とする解析モデルを提案し、誘導のもとでの流れを解析的に扱えるようにして、モード崩壊の理解を目指す。"}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "時系列基盤モデルは未知の施策の予測に弱いか", "title": "CovNovBench: A Benchmark for Evaluating Time Series Foundation Models under Covariate Novelty", "url": "https://arxiv.org/abs/2611.33732", "authors": "Wenhao Pan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "共変量を入力できる時系列の基盤モデルは、価格政策や治療計画のような計画された行動のもとでの予測に使われる。将来の共変量が過去の範囲を外れる状況を「共変量の新規性」と定義し、これを体系的に含むベンチマークを作って、既存モデルの挙動を評価する。"}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "連続処置の効果曲線に形状制約つきの信頼帯", "title": "Adaptive confidence bands for a continuous treatment effect curve under shape constraints", "url": "https://arxiv.org/abs/2611.33440", "authors": "Charles R. Doss ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "観測データで処置が連続のとき、効果の曲線全体に対する同時信頼帯を、単調性または凹性の形状制約のもとで構成した。2つの局外関数の誤差の積が十分小さければ漸近的に妥当で、曲線の平坦さや滑らかさが未知でも最適な収束率を達成する適応性をもつ。"}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "因果効果の境界が線形計画1つで求まる条件", "title": "A Graphical Criterion for Linear Causal Bounds", "url": "https://arxiv.org/abs/2611.33950", "authors": "Alexis Bellot", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "未観測の交絡があると因果効果や反実仮想の値は部分的にしか識別できない。離散変数で、交絡を受ける成分ごとの隠れた原因が2つ以下の因果図について、鋭い境界が1つの線形計画の最適値に一致するための必要十分条件をグラフの基準として与えた。仮定・問い・データを組み合わせて境界を計算するPythonパッケージも公開する。"}, {"id": "pn41", "rank": 41, "field": "工学", "headline": "建物台帳の違いが地域の地震リスク評価を左右する", "title": "Exposure Uncertainty and its Impact on Regional Seismic Risk Assessment", "url": "https://doi.org/10.21203/rs.3.rs-11865927/v1", "authors": "AnnaElisa Huynh ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "why": "地域の地震リスク評価の土台になる建物の台帳（曝露モデル）は、属性の欠損や情報源の食い違いを含む。妥当な複数の候補の台帳の間で生じる不確かさが、想定地震のもとでのリスク指標にどれだけ影響するかを調べる原稿である（抄録の冒頭の範囲）。"}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "連続地震で損傷が積み重なる過程を実建物で追う", "title": "Impact of Successive Earthquakes on Incremental Structural Damage during the 2025 Sındırgı, Türkiye Earthquake Doublets", "url": "https://doi.org/10.21203/rs.3.rs-11609916/v1", "authors": "Hasan Hüseyin Aydogdu ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "why": "2025年8月と10月にトルコのスンドゥルグで続けて起きた同程度の強さの2つの地震について、1回目で大きく損傷した隣り合う2棟の鉄筋コンクリート建物を、現地調査・材料試験・数値解析で比べた。既存の損傷が次の揺れへの脆弱性をどう高めるかを実例で追っている。"}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "衛星重力でカムチャツカ地震の断層モデルを採点", "title": "Assessment of Published Finite-Fault Models for the 2025 Kamchatka Earthquake by Comparison with Satellite Gravity Observations", "url": "https://doi.org/10.21203/rs.3.rs-11655298/v1", "authors": "Yusaku Tanaka", "venue": "Research Square (In Review)", "date": "2026-11-26", "why": "2025年のMw8.8カムチャツカ地震について、GRACE-FOの観測から地震時の重力変化（最大+3.2、最小−4.3マイクロガル）を推定し、公表されている8つの有限断層モデルの予測と、パラメータを調整せずに比べた。観測との空間相関はモデルにより大きく異なり、上位は0.93、0.91、0.89だった。"}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "かんらん石の破壊を高速X線と音響で捉える", "title": "High-spatiotemporal-resolution stress and acoustic emission monitoring across the brittle–plastic transition in olivine under true triaxial compression", "url": "https://doi.org/10.21203/rs.3.rs-11479232/v1", "authors": "Rikuto Honda ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "why": "SPring-8の高フラックスの100keVのX線を使い、最大5GPaの真三軸圧縮下のかんらん石で、応力と変形を高い時間・空間分解能で測る手法を開発した。アコースティックエミッションの計測と組み合わせ、0.3〜0.6秒の間に起きる応力降下を、脆性から塑性への遷移をまたいで検出した。"}, {"id": "pn45", "rank": 45, "field": "環境・気候政策", "headline": "海洋の熱塩循環の急変を輸送の収支で統一的に説明", "title": "Basin-Scale Nonlinear Dynamics of Thermohaline Ocean Circulation. Part I: Theory", "url": "https://arxiv.org/abs/2611.33383", "authors": "Conner W. Lester ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "熱塩循環が複数の平衡と急な遷移をもつことを、トレーサーの保存から導く枠組みで説明した。表面のフラックスを散逸と移流による輸送とつり合わせ、大規模な勾配と輸送効率で表す。3次元の海盆モデルでは、循環の崩壊のしきい値を非線形の塩分移流が、回復のしきい値を線形の散逸が支配する。"}, {"id": "pn46", "rank": 46, "field": "環境・気候政策", "headline": "排出量取引のもとでの企業の信用リスクを構造モデルで", "title": "Modelling and Calibration of Climate-Related Credit Risk Under the Emissions Trading System", "url": "https://arxiv.org/abs/2611.34771", "authors": "Ying Liao ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "排出枠の上限が社債の満期内にゼロへ向かう状況で、企業が予想される炭素価格のもとで排出を選び、炭素価格が市場の需給で決まる構造モデルを作った。均衡価格の存在と上限が拘束する条件、各企業の最適な排出を導き、線形化した場合には倒産確率が明示的に得られる。EU排出量取引制度のもとの欧州の発電35社に合わせて較正した。"}, {"id": "pn47", "rank": 47, "field": "環境・気候政策", "headline": "風のずれから仕事を取り出して気球の高度を操る", "title": "Skysail: Altitude Control of Long-Duration Weather Balloons by Extracting Work from Wind Shear", "url": "https://arxiv.org/abs/2611.33882", "authors": "Michal Adamkiewicz ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "長時間飛ぶ気象観測気球は、ガスの放出とバラストの投下で高度を変えるため観測回数に限りがある。気球の450m下に吊るした小さな翼が、2つの高度の風速差から空気力を得て上昇・下降する方式を開発した。43時間でガスもバラストも使わずに11回の鉛直観測（計53kmの上下動）を行い、別の8日間の飛行では24回の観測を行った。"}, {"id": "pn48", "rank": 48, "field": "環境・気候政策", "headline": "暑さの影響はインドの製造業企業の規模で異なる", "title": "Limits to adaptation: distributional impacts of climate change on manufacturing firms in India", "url": "https://econpapers.repec.org/RePEc:unu:wpaper:wp-2026-124", "authors": "Garima Jasuja", "venue": "RePEc NEP", "date": "2026-11-23", "why": "インドの製造業の年次調査の大規模な企業パネルを使い、気温が企業の生産の分布全体に与える影響を、再中心化影響関数（RIF）回帰で推定した。平均ではなく分布の各位置での影響を見ることで、暑さへの適応の限界が企業によって異なることを調べている（抄録の範囲）。"}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "オープンバンキングはフィンテックの利用を押し上げる", "title": "Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps&nbsp;", "url": "https://doi.org/10.2139/ssrn.7727118", "authors": "Xinchen Ma", "venue": "SSRN", "date": "2026-11-25", "why": "フィンテックのアプリのソースコードから独自のデータを作り、同じアプリの中で国によってオープンバンキングが使えるかどうかの違いを利用して効果を調べた。オープンバンキングはアプリの利用と成績を高め、データを多く使うアプリと新興企業で効果が大きい。影響を受けた既存銀行は貸出と収入が減る一方、手数料の比重を高めて対応する。"}, {"id": "pn50", "rank": 50, "field": "経営学", "headline": "労組が弱まると従業員持株制度も減る", "title": "When Strikes Meet Stocks: Organized Labor and the Politics of Employee Ownership", "url": "https://doi.org/10.31235/osf.io/mbj96", "authors": "Lydia Camp", "venue": "SocArXiv", "date": "2026-11-25", "why": "米国の従業員持株制度（ESOP）の採用が労働組合の力に左右されるかを、2000〜2024年の年金報告書と、州ごとに時期の異なる労働権法の導入を使って調べた。労働権法は組合の組織率を下げ、その後に稼働中のESOPが減る。この効果は組織率を考慮すると弱まり、従業員持株が労使の対立への経営側の対応でもあることを示唆する。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "車両通過の振動から橋の「指紋」を見分ける", "title": "Wavelet-Augmented Feature-Based Machine Learning: Application to the Fingerprinting of Civil Engineering Structures f ": "What consumers rate highly and what stays open: Sensory experience and business continuity in Seoul's commercial districts", "url": "https://doi.org/10.1016/j.cities.2026.107842", "authors": "Juhyeon Park ほか", "venue": "Cities", "date": "2026-11-25", "sjr": 1.772, "citescore": 11.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr49", "rank": 49, "headline": "DDAとMPMの連成で水の衝撃を受けるダムを解く", "title": "Validation of a 3D DDA-MPM-Based Fluid–Structure Interaction Method and Its Application to Hydraulic Impact on Dam Structures", "url": "https://doi.org/10.1007/s00603-026-06139-x", "authors": "Hongyun Fan ほか", "venue": "Rock Mechanics and Rock Engineering", "date": "2026-11-26", "sjr": 1.803, "citescore": 11.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr50", "rank": 50, "headline": "固化した粒状土のDEMモデルをベイズで較正", "title": "Physics-guided Bayesian calibration of a hydration-driven bonded-particle DEM model for lightly cement-stabilised granular soils", "url": "https://doi.org/10.1016/j.powtec.2026.123541", "authors": "Nazanin Mahbubi Motlagh ほか", "venue": "Powder Technology", "date": "2026-11-26", "sjr": 0.953, "citescore": 9.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "生成AIの解禁で画像市場は拡大し人の作品は減る", "title": "Generative AI And Creative Goods: Market Expansion, Crowd-Out, and Copyright", "url": "https://doi.org/10.1093/qje/qjag058", "authors": "Samuel G Goldberg ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-24", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "大手の素材画像の市場が2022年12月に生成AIによる画像の販売を認めた際、表示の義務と一部市場での禁止という条件の違いを使って差分の差分で効果を推定した。画像の生産は136%、活動する作者は47%増え、生成AIでない画像の生産は15%、作者は29%減った。総販売は82%増えたが、生成AIでない画像の販売は28%減った。生成AIの画像は特徴の空間で集中し、人の作品はすき間へ差別化する。"}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "生成AIは討論の実力差をむしろ広げる", "title": "When GenAI Increases Inequality: Evidence from a University Debating Competition", "url": "https://doi.org/10.1287/mnsc.2025.01063", "authors": "Antonio Roldán-Monés", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "大学の競技ディベートで、参加者に生成AIの利用を無作為に割り当てた実験。書く作業ではなく、複雑な考えを自分のものにして口頭で説明する知識集約的な活動を対象にした。判断の比重が高い部分では能力の高い参加者ほど生成AIから大きな利得を得て、能力の低い参加者は生成AIで代替できる部分でしか成績が上がらず、成績の格差が広がった。"}, {"id": "jn03", "rank": 3, "field": "環境・気候政策", "headline": "55の行動介入でも炭素価格への支持は微増", "title": "Fifty-five crowdsourced designs assessing carbon pricing support in the USA", "url": "https://doi.org/10.1038/s41562-026-02629-8", "authors": "Armando Holzknecht ほか", "venue": "Nature Human Behaviour", "date": "2026-11-25", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "国際的な研究チームが別々に考案した55の行動介入を、米国の約2万人に同時に試した事前登録の共同研究。実際の支持を表す指標への効果はごく小さいが有意で（Cohenのd=0.06）、表明された支持も5指標中4つで1.7〜2.4ポイント増にとどまった。研究チームは自分や他のチームの介入の効果を大きく見積もりすぎており、研究者集団の期待のずれも明らかになった。"}, {"id": "jn04", "rank": 4, "field": "政治学", "headline": "多数決が個人に勝つのは考え方が十分に多様なとき", "title": "Cognitive diversity and majority rule", "url": "https://doi.org/10.1073/pnas.2608826123", "authors": "Lu Hong ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "集団の多数決が個人より正確になる理由を、独立な信号を前提とするコンドルセの陪審定理ではなく、同じ世界の状態を人が異なるモデルで分類するという「解釈された信号」の枠組みで説明した。集団の正確さは個人の平均的な正確さと対ごとの多様性で特徴づけられ、多数決が構成員を確実に上回るのは多様性が高いときに限られる。複数の実データとシミュレーションがこの枠組みを支持する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "広く使われる過信の指標は能力と区別できていない", "title": "Widely Used Measures of Overconfidence Are Confounded with Ability", "url": "https://doi.org/10.1287/mnsc.2024.05184", "authors": "Stephen A. Spiller", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "過信の測定によく使われる複数の方法が、能力と交絡していることを解析的に示した。成績は能力の不完全な指標であり、自己評価は成績だけでなく能力についての事前の信念も反映するためである。公表済みのデータの再分析では、過信の指標がその後の成績を予測し、過信の指標が能力の信号になっていることと整合した。"}, {"id": "jn06", "rank": 6, "field": "心理学・認知科学", "headline": "漁撈の文化は絆の強さとよそ者への開放性を併せ持つ", "title": "Sea-fishing cultures show rare blend of tight social ties and openness to strangers", "url": "https://doi.org/10.1073/pnas.2536327123", "authors": "An Huang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "海の漁業を生業としてきた地域の文化を、日本の近接する地域の1,010人の比較、現代の150か国、世界の1,265の民族集団の歴史記録で調べた。漁業地域の人は包括的に考え、身近な関係での責任を重んじる（文化水準の効果量d=0.91）一方、内集団への忠誠と外集団への差別は弱い（d=1.37）。個人主義と集団主義の二分法に収まらない型を示す。"}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "輸入依存の非対称が国家間の「力」になる", "title": "International Power", "url": "https://doi.org/10.1093/qje/qjag061", "authors": "Ernest Liu ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-23", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "貿易から生じる国家間の力を、二国間の輸入依存の非対称を産業の貿易弾力性の逆数で重みづけた指標として、過去20年の国の組について作った。この力が高まると、貿易を止めるという脅しの信頼性が上がり、二国間の関与と交渉が増える。地政学的な関係が悪化すると、将来の紛争を見越して貿易を調整し、力を高める動きが見られる。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "調査実験の標本抽出と割り当てを細かく層別する", "title": "Fine Stratification of Survey Experiments", "url": "https://doi.org/10.1093/restud/rdag131", "authors": "Max Cytrynbaum", "venue": "Review of Economic Studies", "date": "2026-11-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "対象者の集団から代表的な参加者を抽出し、次に処置を割り当てる2段階の実験で、両方の段階にk個組のマッチングによる無作為化を使う設計を調べた。任意のkと共変量の次元でk個組を作る高速なアルゴリズムを開発し、最近の実験論文200本の約48%で多変量の細かい層別が新たに可能になると見積もる。両段階の効率の向上を反映した推測の方法も示す。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "指数を売るESG評価会社は株価の良い企業に甘い", "title": "Environmental, Social, and Governance Ratings of Environmental, Social, and Governance Index Providers", "url": "https://doi.org/10.2308/tar-2023-0522", "authors": "Sonakshi Agrawal ほか", "venue": "The Accounting Review", "date": "2026-11-24", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "ESG評価会社が評価を出すだけでなく、ESG指数を作って販売していることに注目した。同じ企業に対する評価会社間の評価を比べることで、実際のESGの成果を統制している。指数の使用料の誘因が強い評価会社は、株価の成績が良い企業に高い評価を付ける傾向があり、この関連は指数の対象になりうる企業に集中していた。"}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "皆が苦しい超インフレ下では困窮しても努力が続く", "title": "Maintaining Effort Amid Shared Adversity: How Hyperinflation Alters the Motivational Influence of Economic Hardship", "url": "https://doi.org/10.1111/peps.70049", "authors": "John M. Schaubroeck ほか", "venue": "Personnel Psychology", "date": "2026-11-26", "sjr": 5.41, "citescore": 14.8, "citescore_year": "2025", "why": "経済的な困窮は仕事の努力を下げるとされるが、社会全体で共有される超インフレのもとでは努力が維持されると論じた。トルコの医療機関での9週間の調査と2つの実験で、超インフレの条件では困窮の悪化が努力を下げず、視点取得の高い人は努力を増やした。超インフレでない条件では困窮が努力を損なった。"}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "従業員代表のいる企業ほど管理職を内部から登用", "title": "Democratic Organizing and Contemporary Managerial Talent Markets: Internal Promotion or External Hiring?", "url": "https://doi.org/10.1287/orsc.2024.19538", "authors": "Aleksandra Gregoric ほか", "venue": "Organization Science", "date": "2026-11-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "デンマークの2001〜2017年の雇用主と従業員を結んだ縦断データで、取締役会に従業員代表がいる企業は、そうでない企業より管理職を外部採用ではなく内部昇進で埋める傾向が強いことを示した。この関連は、従業員代表が社内の経験が広く昇進に関わる情報を持つ場合などで強い。"}, {"id": "jn12", "rank": 12, "field": "地球科学", "headline": "地震の破壊は「禁じられた」速度域を通過できる", "title": "Breakdown of the classical rupture theory and earthquake propagation in the “forbidden” super-Rayleigh range", "url": "https://doi.org/10.1073/pnas.2631141123", "authors": "Anna Pomyalov ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-25", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "せん断波より速く伝わる地震は、レイリー波速度以下の領域から超せん断の領域へ不連続に飛ぶと考えられ、その間の速度域は古典的な破壊理論で禁じられてきた。断層の摩擦がすべり速度に依存することを取り入れた破壊理論を作り、数値計算と照合した。レイリー波速度のごく近くでは摩擦の速度依存の非線形性により、破壊が禁じられた速度域を連続的に通って超せん断へ移ることを示す。"}, {"id": "jn13", "rank": 13, "field": "機械学習", "headline": "強化学習で拡散モデルを目的の材料へ導く", "title": "Accelerating inverse materials design using generative diffusion models with reinforcement learning", "url": "https://doi.org/10.1038/s42256-026-01334-5", "authors": "Junwu Chen ほか", "venue": "Nature Machine Intelligence", "date": "2026-11-26", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "why": "結晶構造を生成する拡散モデルを、目的の物性に向けて強化学習で最適化する手法を示した。ノイズ除去を多段階の意思決定とみなし、報酬で重みづけたKL正則化つきの方策勾配、経験の再利用、多様性のフィルタを使う。単一の目的では60回の反復（約1,000回の物性評価）以内に目標値へ収束し、供給リスクの低い磁石など相反する性質の設計にも成功した。"}, {"id": "jn14", "rank": 14, "field": "工学", "headline": "順位づけは完璧でも警報は1件も鳴らない検知器", "title": "Perfect Ranking, Missed Alarms: Calibrating a Leakage‐Resistant Autoencoder for Multifrequency Guided‐Wave Corrosion Monitoring", "url": "https://doi.org/10.1155/stc/6837078", "authors": "Ebtisam Abdullah Alabdulqader ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-26", "citescore": 10.3, "citescore_year": "2025", "why": "超音波ガイド波による腐食の監視で、検知器の得点が健全と損傷を分ける能力と、事前に固定したしきい値で警報を出す能力が一致するかを、公開の配管データ（236回の計測）を時系列順に分けて調べた。健全データだけで学習した自己符号化器は順位づけが完璧（ROC-AUC=1.000）だったが、検証データで決めたしきい値では損傷を1件も検出できなかった。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "金融引き締めは労働供給を増やし雇用減を和らげる", "title": "The Labor Demand and Labor Supply Channels of Monetary Policy", "url": "https://doi.org/10.1093/restud/rdag132", "authors": "Sebastian Graves ほか", "venue": "Review of Economic Studies", "date": "2026-11-24", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "FOMCの発表や議長の講演の前後の金利の変化を使い、金融政策への労働市場のフローの反応を推定した。引き締めの衝撃のあと、労働者は職を辞めて非就業になる率を下げ、非就業の人は求職を増やす。この供給側の反応がなければ、雇用の減少は2倍になっていた。摩擦のある労働市場をもつ異質な個人のモデルで、この結果を説明する。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "犯罪統計の操作を難しくすると虚偽報告が増えうる", "title": "Juking the Stats: Policing, Misreporting, and Policy Evaluation", "url": "https://doi.org/10.1093/restud/rdag130", "authors": "Michael Gibilisco ほか", "venue": "Review of Economic Studies", "date": "2026-11-25", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "犯罪と犯罪の報告をゲーム理論でモデル化し、犯罪統計の質を分析した。取り締まる側は評判を気にして結果を偽って報告しうる。複数の均衡が存在し、過少報告と過大報告が起きる条件を示す。データ操作の費用を上げると、かえって虚偽報告が増える場合がある。政策の効果は、報告された統計と真の統計で一致しない。"}, {"id": "jn17", "rank": 17, "field": "心理学・認知科学", "headline": "人間関係の勘違いは将来の関係を言い当てている", "title": "Errors in social network knowledge predict how ties evolve in the future", "url": "https://doi.org/10.1126/sciadv.aeh9321", "authors": "Alice Xia ほか", "venue": "Science Advances", "date": "2026-11-25", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "誰と誰が友人かについての人の誤りは、認知の限界ではなく、ネットワークの将来を見越す予測の表れであることを示した。196人の実際の社会ネットワークを1年間追跡すると、その時点では誤りだった判断が、6か月後までに生じる関係や消える関係を当てていた。誤りは関係の形成を偶然の約3倍、消滅を1.2倍超の水準で予測した。"}, {"id": "jn18", "rank": 18, "field": "地球科学", "headline": "山火事が頻繁すぎると土石流はむしろ小さくなる", "title": "Historical evidence that wildfire frequency modulates debris-flow hazards through sediment-supply limitation", "url": "https://doi.org/10.1126/sciadv.aei6617", "authors": "Emily C. Geyman ほか", "venue": "Science Advances", "date": "2026-11-25", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "南カリフォルニアの砂防施設の長期の堆積記録から、山火事の頻度と火災後の侵食の関係を調べた。急な流域では火災後3年間の侵食が平常の約17倍に達するが、火災がこの1世紀に典型的だった約30年の間隔より頻繁に起きると、土石流の量は減っていた。運ばれる土砂の供給が追いつかなくなるためと解釈される。"}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "少数派の性で入職した新人は負の出来事が増えていく", "title": "Breaking Gender Norms: A Dynamic Perspective on Entering Gender-Atypical Occupations", "url": "https://doi.org/10.1177/01492063261506258", "authors": "Sophie Schellhammer ほか", "venue": "Journal of Management", "date": "2026-11-25", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "88職種の新人673人を入職後12週間にわたって繰り返し調べた。自分の性が少数派である職種に入った新人は、否定的な職場の出来事を経験する頻度が時間とともに増え、その傾向は女性の多い職種に入った男性で、男性の多い職種に入った女性より強かった。出来事の増え方が急なほど、仕事の習熟が低く離職意向が高い。"}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "冷房のない刑務所では夏に新人刑務官の離職が増える", "title": "Excessive Heat and Correctional Officer Turnover: Evidence From Texas", "url": "https://doi.org/10.1111/puar.70233", "authors": "Benjamin Goehring ほか", "venue": "Public Administration Review", "date": "2026-11-25", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "why": "テキサス州の刑務所68か所・約6万人の職員の2010〜2023年の人事記録で、冷房のない職場で夏に働くことが離職に与える影響を調べた。経験の浅い現場職員では、冷房の有無による離職確率の差が最も暑い月に0.33ポイント大きく、基準の離職率の約12%に当たる。冷房の設置は、人手不足への対策として賃上げと同程度の費用だと試算する。"}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "説明のつかない株価変動が投資家の情報収集を呼ぶ", "title": "Rational Information Acquisition Screens", "url": "https://doi.org/10.2308/tar-2024-0799", "authors": "Paul E. Fischer ほか", "venue": "The Accounting Review", "date": "2026-11-24", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "投資家は私的情報を集める前に、その見返りが分からない。過去の株価を含む公開情報を、情報収集の見返りを見積もるふるいとして使うというモデルを作り、説明のつかない価格変動が大きいほど私的情報の収集、将来の価格変動、取引量が増えると予測した。EDGARとBloombergでの情報の取得を測った細かいデータが予測を支持する。"}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "価値観が似ると集団の規範を守りやすくなる", "title": "Determinants of Norm Compliance: Moral Similarity and Group Identification", "url": "https://doi.org/10.1287/mnsc.2024.08000", "authors": "Alexander Schneeberger ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "個人と集団の成員の価値観の類似を実験で操作し、集団への同一視と規則の順守を測った。進歩主義についての道徳的な類似は集団への同一視を高め、同一視は集団の規則の順守を高めうる。条件間で社会規範そのものは変わらない設計のため、行動の変化は規範への感度の変化によると解釈できる。ただし、この関係は崩れることもある。"}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "価格弾力性を1分以内に更新して即時の価格決定へ", "title": "Scalable Just-in-Time Price Elasticity Estimation", "url": "https://doi.org/10.1287/mnsc.2024.04791", "authors": "Jingbo Wang ほか", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "価格の内生性を補正しつつ、点ごとの価格弾力性をノンパラメトリックに推定する方法を示した。制御関数で因果的な弾力性の識別を一連の予測課題に分解し、閉じた形をもつバギングした最近傍法で実装する。ニューヨーク市の配車市場に適用し、時間と場所による弾力性の違いを捉え、市全体の推定を1分以内に更新した。"}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "大規模な資産の共分散行列を要素ごとに学習する", "title": "Machine Learning Vast Dynamic Conditional Covariance Matrices: The Spirit of “Divide and Conquer”", "url": "https://doi.org/10.1287/mnsc.2024.08930", "authors": "Zhoufan Zhu ほか", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "多数の資産の動的な条件つき共分散行列を、分割統治の考え方で推定する方法を提案した。資産の特徴からグラフに基づく深層学習で収益の条件つき分位点を学び、そこから分散と共分散を要素ごとに求め、射影で半正定値にする。中国の株式市場で、既存の方法より良い接点ポートフォリオが得られたと報告する。"}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "環境の変化が急か緩やかかで起業家の期待が変わる", "title": "External Enablement Across Types of Environmental Change: Experimental Evidence on Onset Variance Effects", "url": "https://doi.org/10.1177/10422587261496319", "authors": "Jiyoung Kim ほか", "venue": "Entrepreneurship Theory and Practice", "date": "2026-11-26", "sjr": 5.67, "citescore": 21.9, "citescore_year": "2025", "why": "マクロ環境の変化が起業を後押しするという枠組みについて、被験者間実験と発話思考法を組み合わせて検証した。変化が徐々に起きるか急激に起きるかという違いが、後押しへの期待に影響し、その影響は変化の種類をまたいで同様だった。"}, {"id": "jn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "旧技術の取引網での仲介がEV参入を助ける", "title": "Embedded in Two Worlds: How Incumbents’ Brokerage Affects Adaptation When Old and New Supply Networks Coexist", "url": "https://doi.org/10.1287/orsc.2024.18580", "authors": "Jongyoun Baek ほか", "venue": "Organization Science", "date": "2026-11-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "既存企業が新技術の市場に入るとき、旧技術と新技術の2つの供給網に同時に埋め込まれる。2012〜2022年の米国の自動車産業で、旧技術の供給網で仲介の位置にある企業ほど、電気自動車のモデル数と成績で見た新技術への参入に成功していた。意外にも、旧技術の網での仲介のほうが新技術の網での仲介より効果が強かった。"}, {"id": "jn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "仕事での近しさが育つ条件を理論化", "title": "Interaction zones theory: How social proximity emerges and shapes thriving at work", "url": "https://doi.org/10.1177/00187267261506540", "authors": "Tom L. Junker ほか", "venue": "Human Relations", "date": "2026-11-25", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "仕事のデジタル化が人どうしの近しさを損なう懸念を背景に、職場のやり取りから親密さが生まれる仕組みを説明する理論を提案した。関係上の重みと、やり取りのしやすさという2つの次元の交点を「社会的近接の領域」と呼び、そこでの共有された繰り返しのやり取りが個人とチームの活力につながると論じる。文献の検討に基づく理論論文である。"}, {"id": "jn28", "rank": 28, "field": "オペレーションズ・リサーチ", "headline": "広告の予算調整の均衡は入札方式で解きやすさが違う", "title": "Throttling Equilibria in Auction Markets", "url": "https://doi.org/10.1287/opre.2023.0008", "authors": "Xi Chen ほか", "venue": "Operations Research", "date": "2026-11-26", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "ネット広告の競売で、広告主の参加確率を調整して予算を均等に使わせる方式を、全員が同時に使う場合の均衡を分析した。第一価格の競売では均衡が一意で、分散的な調整で効率よく計算できる。第二価格では均衡は存在するが、近似的な均衡を求めることもPPAD完全で、収入を最大にする均衡を見つけるのはNP困難である。"}, {"id": "jn29", "rank": 29, "field": "オペレーションズ・リサーチ", "headline": "処理能力に上限のある資源への逐次割り当て", "title": "Online Allocation of Throughput-Constrained Resources Using Proxy Assignments", "url": "https://doi.org/10.1287/msom.2025.0811", "authors": "Chamsi Hssaine ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-26", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "到着する仕事を複数の資源に順に割り当てる問題で、資源が予算ではなく時間とともに変わる処理能力の目標に縛られる場合を扱った。従来の予算制約向けの算法を素直に拡張すると大きく失敗することを示し、現在の到着を使って割り当てを模擬する主双対の算法を提案する。"}, {"id": "jn30", "rank": 30, "field": "オペレーションズ・リサーチ", "headline": "寄付の税優遇は中途半端だと消費者の得を減らす", "title": "Tax-induced Corporate In-kind Donations: Equilibrium Analysis and Policy Design", "url": "https://doi.org/10.1287/msom.2025.0617", "authors": "Lusheng Shao ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-26", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "食品企業の現物寄付を促す税制優遇が、企業の生産と寄付、利益、消費者余剰に与える影響を解析モデルで調べた。優遇率がしきい値を超えると企業は寄付を始める。企業は優遇が手厚いほど得をするが、消費者余剰は優遇率に対してU字型で、中程度の優遇は消費者余剰を下げうる。"}, {"id": "jn31", "rank": 31, "field": "オペレーションズ・リサーチ", "headline": "LLMが書いた文章をマハラノビス距離で見分ける", "title": "Efficient and Flexible Large Language Model–Generated Content Detection", "url": "https://doi.org/10.1287/ijoc.2024.0877", "authors": "Wan Tian ほか", "venue": "INFORMS Journal on Computing", "date": "2026-11-24", "sjr": 1.974, "citescore": 6.6, "citescore_year": "2025", "why": "LLMが生成した文章の検出に、マハラノビス距離に基づく信頼度の得点を判別の特徴として使う方法を提案した。複数の分割に対応する精度行列を正則化つきで同時に推定し、推定量のスパース性と一致性、検出問題の超過リスクの最適な上界を示す。人とChatGPTの文章を比べた公開コーパスで有効性を確かめた。"}, {"id": "jn32", "rank": 32, "field": "心理学・認知科学", "headline": "気分の揺れを短い雑音と長い変動に分けて測る", "title": "Evaluating the Ecological Validity and Mechanism of a Generative Model-Based Decomposition of Affective Variability", "url": "https://doi.org/10.1177/09567976261496284", "authors": "Ryan Yan Yan ほか", "venue": "Psychological Science", "date": "2026-11-24", "sjr": 2.309, "citescore": 9.9, "citescore_year": "2025", "why": "感情の変動を、短命な「雑音」と長く続く「変動性」に、ベイズフィルタで分解した。強化学習の課題と日常の経験サンプリングを332人で組み合わせると、課題での雑音は直近の結果に、変動性はより前の結果に左右された。課題で測った2つの成分は、日常のデータの対応する成分とそれぞれ選択的に対応した。"}, {"id": "jn33", "rank": 33, "field": "心理学・認知科学", "headline": "映画の内容からファンの性格が予測できる", "title": "Movies’ Content Features Predict the Personalities of Their Fans", "url": "https://doi.org/10.1177/09567976261498023", "authors": "Gideon Nave ほか", "venue": "Psychological Science", "date": "2026-11-24", "sjr": 2.309, "citescore": 9.9, "citescore_year": "2025", "why": "映画に「いいね」を付けたソーシャルメディア利用者の集計されたビッグファイブ性格と、映画の特徴・内容を結びつけた。キーワードで捉えた内容は、ジャンルや人口統計、質や人気を超えて観客の性格を予測した。1,018人の実験で、この予測が新しい映画と参加者についての選択と評価に関係することも確かめた。"}, {"id": "jn34", "rank": 34, "field": "工学", "headline": "き裂に平行な引張が編物複合材の破壊を変える", "title": "Gap test–inspired crack-parallel tension tests of fracture of soft-knitted polymer composites simulated by microplane triads", "url": "https://doi.org/10.1073/pnas.2620941123", "authors": "Xiaoxiao Ding ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "ウェアラブルやソフトロボットに使われる編物の柔らかい複合材で、き裂に平行な応力が開口型の破壊に与える影響を測る試験法を、ギャップ試験にならって導入した。糸のループの特徴点に配置した微小面の三つ組で、非線形の挙動と進行する損傷を表す連続体モデルを作り、実験で検証した。"}, {"id": "jn35", "rank": 35, "field": "工学", "headline": "ラム波の損傷検知を別の構造へ転移学習で広げる", "title": "Cross‐Structure Damage Detection Method Using Lamb Waves With Semisupervised Deep Transfer Learning", "url": "https://doi.org/10.1155/stc/7164544", "authors": "Li Wang ほか       b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
