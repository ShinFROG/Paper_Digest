<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

: "Singularity Is All You Need? AI, Structural Unemployment and the Baumol Inversion in a Pure-Labour Economy", "url": "https://doi.org/10.2139/ssrn.7683378", "authors": "Urban Sušnik", "venue": "SSRN", "date": "2026-11-12", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "pr45", "rank": 45, "headline": "コミュニティ統治の欠如が利用者の離反を招く", "title": "How to achieve effective management of network communities? Absence of governance mechanisms, psychological contract breaches, and user behaviors", "url": "https://doi.org/10.21203/rs.3.rs-11396120/v1", "authors": "Haijian Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "pr46", "rank": 46, "headline": "地すべり危険度マップの整合性を作成者が監査", "title": "A Producer-Led Product-Consistency Audit of an AHP Landslide-Susceptibility Raster: A Philippine Road-Corridor Case Study", "url": "https://doi.org/10.20944/preprints202611.1305.v1", "authors": "Deryl Jhon Lucas", "venue": "Preprints.org", "date": "2026-11-12", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "pr47", "rank": 47, "headline": "厚く硬い天盤の下で上部地層の破断と応力を模型実験", "title": "Simulation experimental study on fracture movement and stress evolution of overlying strata under thick hard roof", "url": "https://doi.org/10.21203/rs.3.rs-11456563/v1", "authors": "Chun Zhao ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "pr48", "rank": 48, "headline": "物理を組み込んだ時系列LLMで台風の波高を予測", "title": "Physics-Informed Time‑Series Large Language Model for Extreme Typhoon Wave Height Forecasting", "url": "https://doi.org/10.21203/rs.3.rs-11525261/v1", "authors": "Zhiguo He ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "theme": "確率動力学・計算力学", "theme_no": 8}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "教科書2,118冊を構造つきの証明データに変換", "title": "Scaling Mathematical Proof Supervision from Structured Textbooks", "url": "https://arxiv.org/abs/2610.40394", "authors": "Youqing Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "数学の教師データは問題と解答の対に平板化されがちで、教科書の章の順序や命題と証明のつながりが失われる。大学数学の中核分野の教科書2,118冊を、章順・命題と証明の対応・依存関係・出典を保った約38万件の証明の教師データ（TOME-Math）に変換した。全量で微調整すると、保留した評価と公開ベンチマークの平均得点が基準モデルより16.7ポイント上がり、比較した3つの公開データを上回ったと報告する。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "教科書を自分で読んで学ぶ力を強化学習で引き出す", "title": "Incentivizing Self-Learning in Large Language Models via Reinforcement Learning", "url": "https://arxiv.org/abs/2610.39671", "authors": "Lingkai Kong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "未知の分野の問題を解くには、検索した事実を集めるだけでなく、長い資料を読んで原理を学び適用する力が要る。教科書にもとづく数学の証明問題（模範解答は与えない）を課題とし、教科書をたどるインターフェースと細かな報酬の強化学習で「自己学習」を促した。分野内外の教科書と科目で成績が上がり、あるモデルの証明の正答率が51.5%から79.5%になったと報告する。"}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "差の差分析の外れ値処理はセルごとに行うべき", "title": "Separate versus Pooled Winsorization in Difference-in-Differences: Bias, Efficiency, and Finite-Sample Guarantees", "url": "https://doi.org/10.2139/ssrn.7682754", "authors": "Yukai Huang ほか", "venue": "SSRN", "date": "2026-11-11", "why": "差の差（DiD）分析では極端な値をウィンソライズ（上下の端の値を閾値に置き換える処理）することが多いが、効果の推定値と標本誤差の両方が変わりうる。2群2期間の設定で、群×期間のセルごとに閾値を決める方法は、適切に較正した割合のもとで一様なサブガウス型の偏差保証を持つが、生のDiDと全体をまとめて閾値を決める方法は同じ保証を得られないことを示した。まとめる方法は漸近的に偏りが残りうる。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "報道90万本から「体感の金融ストレス」を指数化", "title": "Stress in the Press or Stress in the Market: A New Measure of Perceived Financial Stress", "url": "https://doi.org/10.2139/ssrn.7685338", "authors": "Fred Liu ほか", "venue": "SSRN", "date": "2026-11-11", "why": "カナダの1977〜2026年の経済・ビジネス記事90万本超から、データ駆動のキーワード発見アルゴリズムで解釈可能な報道ベースのストレス指数を作った。市場の混乱が小さくても金融リスクへの懸念が強まる時期を捉える。線形と分位点拡張のVARで、金融ショックと直交する報道ショックは主に無担保の消費者信用を分布全体で減らし、市場ベースの金融ショックは信用と実体経済の下振れリスクを悪化させることを示した。"}, {"id": "pn05", "rank": 5, "field": "経営学", "headline": "検索へのAI統合でChatGPTの訪問が5.9%減", "title": "Integration and Competition in Generative AI: Evidence from Google’s AI Mode Rollout", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13098", "authors": "Michelangelo Rossi ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "Googleが2025年8月に検索内のAIモードを25か国に広げた機会を使い、10のAIアシスタントのウェブ訪問数の推定値を、未提供の30か国と比べる差の差分析を行った。提供開始から4週間でChatGPTのサイト訪問が5.9%（対象国全体で1日350万件）減り、減少は直接訪問に集中した。Geminiと小規模な8サービスの合計には有意な平均効果がなかった。配布経路がAIアシスタント間の競争に効くことを示す。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "効果の向きは人と同じでも誤り方が違う言語モデル", "title": "CogBattery: Human-Referenced Evaluation of Cognitive Task Behavior and Structure in Language Models", "url": "https://arxiv.org/abs/2607.24999", "authors": "Dengzhe Hou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "13の認知課題を文章版にして54のオープンな言語モデルに課し、元の研究の人間のデータと条件ごとに比べた。モデルは人間と同じくn-back課題のルアー（紛らわしい刺激）に強く反応するが、ふつうの非標的への誤警報がはるかに多い。確信度で正誤を分ける力は多くのモデルで人間より弱い。課題をまたぐ得点には2つの次元があり、第1の次元は規模と結びつくが、大きいモデルほど人間に近いわけではない。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "保守系放送局の参入後、環境配慮商品の伸びが鈍る", "title": "The News Environment and Politically Coded Product Demand", "url": "https://doi.org/10.2139/ssrn.7682545", "authors": "Ali Umut Guler ほか", "venue": "SSRN", "date": "2026-11-11", "why": "2012〜2016年にシンクレア放送グループが48の地方テレビ市場に参入し、報道がより保守的・全国志向になった機会を使った。ニールセンIQのスキャナーデータで、リベラルな世帯の需要が高いとされる環境・健康・動物福祉の属性を持つ商品の数量シェアを10品目で測ると、参入後は対照の郡より伸びが鈍く、0.087ポイント（比例の定式化で6.9%）低かった。価格と品ぞろえに検出できる変化はなかった。"}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "エージェントの読み過ぎを抑えトークンを最大93%削減", "title": "Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents", "url": "https://arxiv.org/abs/2608.22237", "authors": "Zedong Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "ウェブを使うAIエージェントは、必要な証拠がわずかでもページや文書の全体を読み込み、トークンと時間を浪費する。エージェントのモデルを変えずに読み込みを制御する層SparseReadを提案した。読む意図と情報源の網羅状況を追跡し、証拠の探し方を切り替え、1回の作業で読む量に上限を設ける。6モデル・5場面で総トークンを最大92.9%、所要時間を最大89.0%減らし、97%の設定で課題の質を保つか改善したと報告する。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "生成AIで大都市への求人集中がゆるむ", "title": "Generative AI and the Spatial Restructuring of Corporate White-Collar Hiring: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7685658", "authors": "Jingyi Tian ほか", "venue": "SSRN", "date": "2026-11-11", "why": "中国A株上場企業の2017〜2024年のオンライン求人を使い、ChatGPTの公開を技術ショックとして、事前の生成AIへの露出度で企業を分ける差の差分析を行った。露出度の高い企業は、一線都市への求人の割合を2.8ポイント減らした。減少は一線都市の賃金プレミアムや税負担が大きい企業で大きく、本社が一線都市にある企業や顧客対応の従業員が多い企業で小さい。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "判定の紛争を経験した予測市場の参加者は取引を変える", "title": "When Resolution Is Disputed: Trader Adaptation in Prediction Markets", "url": "https://doi.org/10.2139/ssrn.7685178", "authors": "Xiaohui Zhang ほか", "venue": "SSRN", "date": "2026-11-11", "why": "予測市場は、起きた出来事を契約の支払いに変える判定の手続きに依存する。Polymarketで判定に紛争が起きた出来事と起きなかった出来事の814組を対応させ、積み上げ型の差の差分析を行った。紛争を経験した参加者は週次の取引がやや減り、その後の購入の実現収益率が1.43ポイント上がった。決済リスクの高い市場での購入を減らし、遅く買い、終了前に売ることが増えた。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "AIエージェントは禁止サイトでもスクレイピングする", "title": "ScrapeBench: Evaluating Legal Compliance of AI Agents in Website Scraping", "url": "https://arxiv.org/abs/2611.11306", "authors": "Joseph Marvin Imperial ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "AIエージェントが利用規約やrobots.txtのスクレイピング方針を守るかを測る初のベンチマーク。スクレイピングを明示的に禁じる1,626の人気サイトで、広く使われるエージェントの多くは順守率が5%未満で、規約を確認した場合でも低いままだった。禁止していない269サイトでは、合法でも拒否する例があり、あるモデルの過剰拒否率は98.5%だった。人間180人の基準実験では、順守率は同程度で過剰拒否ははるかに多かった。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "言語モデルが推論だけで脳波・心電図モデルの重みを書く", "title": "Mixed Signals: Weight-Space Programming for EEG and ECG", "url": "https://arxiv.org/abs/2611.13758", "authors": "Dara Varam ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "言語モデルが学習済みネットワークの重みを読んで編集する「重み空間プログラミング」を、脳波・心電図のモデルに適用した。先端モデルは、仕込まれた不具合を内容を知らされずに直せるだけでなく、構造・課題・少数の訓練被験者だけからネットワークの全重みを書き下ろせた。ある実験では、勾配降下を一度も使わず、6分の1の訓練被験者数で通常の学習と同等の性能に達したと報告する。"}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "中国国有企業の買い手独占力は雇用目標の費用が相殺", "title": "From State to Market: Monopsony, Employment Goals, and Non-Neutral Productivity in Chinese Manufacturing", "url": "https://doi.org/10.2139/ssrn.7683498", "authors": "Ziyao Wang", "venue": "SSRN", "date": "2026-11-12", "why": "中国製造業について、労働のくさび（賃金と限界生産物のずれ）と非中立的な生産性を同時に推定し、所有形態の移行の効果を調べた。くさびを、買い手独占力から雇用目標が公的所有者に課す失業の政治的費用を引いたものとしてモデル化する。国有企業は県内の雇用シェアが大きく独占力は強いが、政治的費用がほぼ打ち消す。民営化は労働増大的な生産性とくさびを高め、それぞれが労働分配率の低下の約半分を説明する。"}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "AIブームは短期に金利を下げ中期に押し上げる", "title": "The impact of AI on interest rates and inflation", "url": "https://doi.org/10.2139/ssrn.7686100", "authors": "Valerio Nispi Landi", "venue": "SSRN", "date": "2026-11-12", "why": "仕事を労働か計算資源が担うタスク型の構造を入れたニューケインジアンモデルで、AIブームが金利とインフレに与える影響を調べた。AIの生産性が徐々に上がるという予想は消費の伸びの期待と自然利子率を高め、中期にはインフレ圧力になる。一方、短期には計算能力への投資が資源を吸収して消費を下げ、調整が十分ゆるやかなら自然利子率が下がりインフレ率が目標を下回る。"}, {"id": "pn15", "rank": 15, "field": "工学", "headline": "橋桁の縁の形状変更は組み合わせて初めて効く", "title": "Non-additive pressure-load response to edge shaping and cavity closure on an idealised twin-girder bridge deck", "url": "https://doi.org/10.21203/rs.3.rs-11699516/v1", "authors": "Mingjin Lou ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "why": "鈍い断面の橋桁にかかる風荷重を、縁の整形と桁間の空洞をふさぐ形状変更でどれだけ減らせるかを、理想化した2主桁断面の2次元非定常RANS解析（k–ω SSTモデル）で調べた。2×2の要因配置で主効果と交互作用を分けている。流線形にした断面の抗力は元の断面より54%小さい。傾斜した縁を持つ閉じた断面では、片方の縁だけを曲面にしても抗力は約5%しか減らないが、両方で53%減り、その81%が交互作用による。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "公職者の資産公開で地方債の利回りが下がる", "title": "Sunlight at City Hall: The Effect of Officials' Financial Disclosure on Municipal Bond Markets", "url": "https://doi.org/10.2139/ssrn.7683023", "authors": "Bo Jing ほか", "venue": "SSRN", "date": "2026-11-12", "why": "米国で公職者の個人資産の開示がオンライン化された時期の違いを使い、開示の導入後に地方債の利回りが8〜16ベーシスポイント下がることを示した。財政規律の強化、交渉方式の引受での条件改善、流通市場の情報摩擦の低下と整合的だと報告する。"}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "相反する物語が多いと情報が価格に織り込まれにくい", "title": "Narrative Cacophony in Financial Markets", "url": "https://doi.org/10.2139/ssrn.7687378", "authors": "Alyssa Rusonik", "venue": "SSRN", "date": "2026-11-11", "why": "非構造のテキストから物語（解釈の型）を抽出する方法を作り、価格への含意が食い違う物語が多く並ぶ状態を「物語の不協和」と定義した。2025年の関税をめぐる出来事の報道21,771本に適用し、不協和が大きいと取引量が減り、物語が日次収益率の変動を説明する割合が下がり、情報の織り込みが遅れることを示した。"}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "長期金利の差を使う新しいキャリー取引が年3.5%", "title": "Following the Stars: Long-Run Rates in the Carry Trade", "url": "https://doi.org/10.2139/ssrn.7684526", "authors": "Mohammed Mehdi Kaebi ほか", "venue": "SSRN", "date": "2026-11-11", "why": "各国の長期の名目金利を、インフレと成長から見た10年債利回りの適正値としてリアルタイムに推定し、その差で通貨を並べた戦略を作った。年3.52%の収益で、従来のキャリー取引よりシャープ比が高く、有意なアルファを持つ。収益の3分の2は長期金利の変化に合わせた持ち高の更新から生じ、プレミアムは長期金利のうちインフレ部分に由来すると報告する。"}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "遺族が受け取れない恐れが保証つき年金の需要を消す", "title": "Beneficiary Settlement Risk and the Annuity Puzzle in a Life-Cycle Model", "url": "https://doi.org/10.2139/ssrn.7682389", "authors": "Ernest Aboagye ほか", "venue": "SSRN", "date": "2026-11-11", "why": "米国の終身年金の多くには、早く亡くなったとき残りを受取人に払う期間保証が付くが、遺族が契約を知らず受け取れないことがある。この受取人の決済リスクをライフサイクルモデルに入れ、受け取れる確率がある閾値を下回ると保証を買わないことを閉じた形で示した。確率を1から2分の1に下げると、保証つき年金への配分は資産の44%から2%に減るが、年金化の合計は最大9ポイントしか減らない。"}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "GPUの賃料から計算資源の減価を見積もる", "title": "Watts and FLOPs: GPU Rents and the Economic Depreciation of AI Compute", "url": "https://doi.org/10.2139/ssrn.7683218", "authors": "Illia Kyslytskyi", "venue": "SSRN", "date": "2026-11-11", "why": "NvidiaのA100・H100・B200の日次の賃料指数を使い、世代による賃料の違いと減価・担保価値への含意を調べた。古い2機種の賃料は処理能力あたりより電力1キロワットあたりで見たほうが近く、通電できる容量が不足する間は電力に連動した下限があることと整合的だという。この型にもとづく評価モデルでは、基準の設定で1年後・3年後・6年後に価値の約72%・44%・21%が残る。"}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "家計は気候変動と脱炭素がインフレを高めると予想", "title": "Inflation Expectations in the Context of Climate Change and the Green Transition", "url": "https://doi.org/10.2139/ssrn.7691030", "authors": "Gabriele Galatia ほか", "venue": "SSRN", "date": "2026-11-11", "why": "オランダの家計の代表標本の調査で、気候変動、グリーン移行、気候政策が長期のインフレに与える影響の予想を尋ねた。家計は、気候変動・グリーン移行・3種の気候政策のいずれも今後10年のインフレ率と変動を高めると予想し、気候変動の影響が最も大きく、支援政策の影響が最も小さい。深刻な温暖化を見込む回答者ほど影響を大きく見積もる。"}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "高速鉄道が発着枠のない航空会社の間接参入を生む", "title": "Beyond Air-Rail Competition: HSR-Enabled Airline Entry, Strategic Deterrence, and Welfare Implications", "url": "https://doi.org/10.2139/ssrn.7686221", "authors": "Dian Sheng ほか", "venue": "SSRN", "date": "2026-11-12", "why": "混雑した主要空港の発着枠を持たない航空会社が、近くの二次空港に飛ばして高速鉄道でつなぐことで幹線市場に入る「高速鉄道を介した間接参入」を定義し、2社3都市の逐次ゲームで分析した。後ろ向き帰納法により、参入阻止・戦略的抑止・受容の3つの均衡の型を導き、既存企業が供給を増やして参入を抑える場合を示す。"}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "認知能力が高いほど耐戦略的な学校選択で正直に申告", "title": "Cognitive Ability and Strategic Sophistication in School Choice Games", "url": "https://doi.org/10.2139/ssrn.7686024", "authors": "Valon Vitaku", "venue": "SSRN", "date": "2026-11-12", "why": "学校選択の3方式（受入保留、即時受入、トップ・トレーディング・サイクル）を、選好と優先順位が共有知識の実験で比べ、視線計測も使った。レーヴン検査の成績が高い参加者ほど、耐戦略的な方式で正直に申告し、操作可能な即時受入方式では正直に申告しない傾向があるという先行結果を確かめ、同じ型がもう一つの耐戦略的な方式にも見られることを示した。"}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "気候リスクにさらされる銀行ほど競争が弱まる", "title": "Climate Risk Exposure and Banking Competition: Evidence from China's Listed Banks", "url": "https://doi.org/10.2139/ssrn.7683634", "authors": "Miaomiao Tao ほか", "venue": "SSRN", "date": "2026-11-12", "why": "中国の上場銀行42行・2007〜2022年のデータで、都市別の気候リスク指数を支店網の地理的分布に対応させた銀行別の気候リスク露出指数を作り、露出が大きいほど銀行間の競争が弱まることを示した。AIやフィンテックなどのデジタル技術は、リスク評価と業務効率の改善を通じてこの悪影響を和らげると報告する。"}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "転換社債の翌日価格予測でNNは酔歩に勝てない", "title": "Cross-Bond Panel Learning for Next-Day Price Forecasting of Chinese Convertible Bonds: A Reality Check", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.33453", "authors": "Derun Zhong ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "中国の転換社債100銘柄・2022〜2025年の日次73,806観測で、銘柄をまたいで学習するニューラルネットが、時間順の分割・境界の除去・依存を考慮した推測のもとでランダムウォークを上回るかを検証した。検証用の29,514観測でランダムウォークのRMSEは2.3577元、ニューラルネットの集合は2.3619元と2.3645元で、標本外の決定係数は負だった。銘柄をまとめる学習は個別推定より分散を下げるが、全体の予測の優位にはならない。"}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "行政登録と調査を組み合わせ家賃を機械学習で推計", "title": "Estimating Housing Costs in Switzerland Using Public Registers and Survey Data: A Machine Learning Approach", "url": "https://econpapers.repec.org/RePEc:bss:wpaper:63", "authors": "Adrian Gadient ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "スイスのアールガウ州で、構造調査（2019〜2022年）と人口・建物などの行政登録データを組み合わせ、月額の純家賃を推定するモデルを作った。ランダムフォレストの標本外の性能がエラスティックネットより良く（RMSE 315スイスフラン、決定係数0.55）、最も重要な予測変数は床面積だった。追加の調査をせずに住宅費を広域で推計できるとする。"}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "標本設計を目的に合わせると変動率曲面の推定が改善", "title": "Compiling and forecasting implied volatility surfaces via survey sampling, tempered inverse-probability sequence learning, and causal activity clocks", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.33438", "authors": "Deepak Bastola ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "NVIDIA株とオプションの2018〜2025年のパネルを使い、インプライド・ボラティリティ曲面の作成と予測に、有限母集団の標本抽出、逆確率の重みを使う系列学習、取引活動にもとづく時計を組み合わせた。横断面の曲面の精度は、標本設計を目的の量に合わせられるかで決まり、流動性で重み付けた抽出は目的が違うと誤差を増やすと報告する。"}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "模擬ユーザーとの閉ループで視覚対話モデルを評価", "title": "Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds", "url": "https://arxiv.org/abs/2611.08286", "authors": "Chenhao Zheng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "作業中の利用者を支援する視覚対話モデルは、応答が利用者のその後の行動を変えるため、録画の再生では評価できない。料理・家事・モバイル画面の3つのシミュレータと、ペルソナを与えた利用者シミュレーション（実行の誤りや計画外の行動を含む）で閉ループの評価と学習を行う枠組みを作った。315場面のベンチマークで、最良のモデルでも制限時間内に完了できた課題は53.4%だった。"}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "リプシッツ制御で画像復元のフローマッチングを安定化", "title": "Lipschitz-Controlled Flow Matching for Robust Image Restoration", "url": "https://arxiv.org/abs/2611.13995", "authors": "Sedjro Salomon Hotegni ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "why": "フローマッチングによる画像復元は高品質だが、学習した力学が入力の小さな乱れを増幅することがある。観測から積分を始める方式と観測で条件づける方式の安定性の上界を導き、スペクトル正規化などを組み込んだリプシッツ性を意識した変換器と、敵対的な感度の正則化で増幅を抑えた。顔画像の復元で、頑健性と知覚品質を測っている。"}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "LiDARと占有を一つの潜在空間で同時に予測", "title": "LO-World: Unified BEV Latent Modeling for Joint 4D Occupancy and LiDAR Forecasting", "url": "https://arxiv.org/abs/2611.11912", "authors": "Zhimin Liao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "why": "自動運転の世界モデルで別々に予測されてきたLiDAR点群と3次元の意味的占有を、鳥瞰図の共有潜在空間で同時に予測するLO-Worldを提案した。距離画像とボクセルの混成の自己符号化器と、過去の文脈をキャッシュするフローマッチング生成器を組み合わせ、占有予測のIoUを10.9%改善し、LiDARのチャンファー距離を30.1%減らし、1枚のGPUで毎秒25フレームを超える処理を保つと報告する。"}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "GPUで動く実時間のモデル予測制御向け二次計画ソルバ", "title": "FAME-QP: A GPU-Accelerated Quadratic-Programming Solver for Real-Time Model Predictive Control", "url": "https://arxiv.org/abs/2611.13766", "authors": "Santosh Mohan Rajkumar ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "線形のモデル予測制御で現れる密な二次計画問題を解くGPUソルバFAME-QPを提示した。制約に応じた作用素の表現と、CUDAグラフで再生する融合した反復を組み合わせ、機器の較正と問題ごとの計時で実行構成を自動で選ぶ。数値ベンチマークと、人型ロボット・クアッドロータの制御シミュレーションで、解の精度と制御性能を保ちながら競合するGPUソルバより遅延を減らした。"}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "エージェントの作業に合わせLLM推論基盤を動的に配分", "title": "Evolving Infra: Agent-Adaptive LLM Serving at Scale", "url": "https://arxiv.org/abs/2611.12304", "authors": "Hao Kang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "why": "エージェント型の作業はLLM推論の需要の大きな部分を占めるが、前処理と生成を分ける既存の配信系は実行時の調整が乏しい。計算資源の割り当てとキー・バリュー・キャッシュの管理を切り離し、作業の構成に合わせて分割を変える計画器と、エージェントの文脈管理の信号でキャッシュの退避と転送を決める管理器を備えた枠組みを提示した。最大256台のGPUで、平均の要求遅延を最大4.1倍短縮したと報告する。"}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "投資の強化学習で報酬と目的のずれを監査", "title": "Certifying Reward Alignment in Portfolio Reinforcement Learning", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.34153", "authors": "Matin Tavakoli ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "金融の強化学習は投資目的をリスク調整後の加法的な報酬に置き換えるが、報酬を正確に最適化しても別の選好を実行してしまうことがある。終端の平均・分散均衡について、報酬の誤設定と学習誤差を分ける監査を作り、行動を一つ変えたときの利得を、方策・報酬・継続価値の残差で抑える証明書を示した。9つの管理された市場と20の乱数種、米国産業ポートフォリオの432か月で検証している。"}, {"id": "pn34", "rank": 34, "field": "工学", "headline": "群論と固有値計数で周期円筒構造のSEAを高速化", "title": "An Efficient Virtual Statistical Energy Analysis Method for Cylindrical Periodic Structures Based on the Group Theory and Wittrick-Williams Algorithm", "url": "https://doi.org/10.21203/rs.3.rs-11466385/v1", "authors": "Haikuan Dong ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "why": "円筒形の周期構造に仮想の統計的エネルギー解析（SEA）を使うとき、モード密度の計算と全体のモード解析が計算の障害になる。群論で周方向に分離して連成固有値問題を独立な部分問題に変え、Wittrick–Williamsのアルゴリズムでモード密度を求め、二分法と組み合わせて固有振動数とモード形を得る方法を提案した。数値例で精度と計算効率の改善を示している。"}, {"id": "pn35", "rank": 35, "field": "工学", "headline": "粘弾性波動計算の構成モデルの等価性を機械で証明", "title": "A Machine-Checked Account of the Equivalence Relations among Generalized Rheological Models for Viscoelastic Seismic-Wave Modeling", "url": "https://doi.org/10.2139/ssrn.7686199", "authors": "fan li", "venue": "SSRN", "date": "2026-11-12", "why": "時間領域の粘弾性地震波の計算で使われる一般化マクスウェル体・一般化ツェナー体・一般化ケルビン・フォークト体・記憶変数の定式化は代数的に等価だと知られている。この等価関係の全体を、定理証明支援系Lean 4で周波数領域と時間領域の両方について機械的に検証した。各等価性が成り立つ仮定（分母が零でない、緩和時間が零でない、機構の数が有限）を明示している。"}, {"id": "pn36", "rank": 36, "field": "工学", "headline": "混合メッシュと過渡応答で複雑な3次元構造を位相最適化", "title": "Topology Optimization for Complex 3D Structures and Loading Conditions", "url": "https://doi.org/10.21203/rs.3.rs-11419124/v1", "authors": "Jingchen Ye ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "why": "位相最適化の多くは構造格子と静的荷重を前提にしており、複雑な3次元形状と過渡的な動的応答を扱いにくい。四面体と六面体を角錐要素でつなぐ混合メッシュの離散化と過渡動的応答解析にもとづく方法を提案し、要素の大きさの違いを考慮する体積重みつきの密度フィルタで小さな要素の非物理的な影響を抑える。"}, {"id": "pn37", "rank": 37, "field": "工学", "headline": "帯筋の配置と地震後火災を受けるRC柱の挙動を解析", "title": "Numerical Investigation on Effect of Confining Reinforcement on Post-Earthquake Fire Behavior of Reinforced Concrete Column", "url": "https://doi.org/10.21203/rs.3.rs-11373130/v1", "authors": "Selamawit Ayal Chanie ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "why": "地震による水平載荷のあとに火災を受ける鉄筋コンクリート柱の挙動は、通常の設計基準で十分に扱われていない。文献の実験で検証した有限要素モデル（300 mm角の片持ち柱）を使い、中間帯筋の配置、コンクリート強度、横補強筋の間隔が地震後火災時の柱の挙動に与える影響を数値的に調べた。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "路面凹凸が橋の共振を起こし車両走査法を乱す", "title": "Mitigation of Effect of Bridge Modal Resonant Interference Induced by Road Roughness in the Vehicle Scanning Method", "url": "https://doi.org/10.1142/s0219455427410112", "authors": "X. Q. Mo ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "粗から細へ時刻ずれを推定し5ms以内に同期", "title": "A multi-resolution approach to robust time synchronization for lightweight seismic structural health monitoring", "url": "https://doi.org/10.1177/14759217261505330", "authors": "Zhe Qu ほか", "venue": "Structural Health Monitoring", "date": "2026-11-12", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "LLMは各国の「他者の気候意識」を当てられるか", "title": "Can large language models predict public perceptions of support for climate action across 125 countries?", "url": "https://doi.org/10.1093/pnasnexus/pgag374", "authors": "Nattavudh Powdthavee ほか", "venue": "PNAS Nexus", "date": "2026-11-12", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr04", "rank": 4, "headline": "看護師が親族に担う無償の健康ケアを概念化", "title": "The Nurse Who Never Clocks Out: Kin‐Directed Care Coordination, Filial Obligation and Invisible Work in the Care Economy", "url": "https://doi.org/10.1111/jan.70816", "authors": "Hailan Jiang ほか", "venue": "Journal of Advanced Nursing", "date": "2026-11-12", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr alth", "date": "2026-11-12", "citescore": 3.1, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr47", "rank": 47, "headline": "固有侵食法による変分破壊モデルの限界と拡張", "title": "On the limitations and extensions of eigenerosion methods for variational fracture modeling", "url": "https://doi.org/10.1016/j.cma.2026.119533", "authors": "Stavros Bozinis ほか", "venue": "Computer Methods in Applied Mechanics and Engineering", "date": "2026-11-12", "sjr": 2.323, "citescore": 13.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr48", "rank": 48, "headline": "離れたセンサの応答と次数低減で多面不釣合いを推定", "title": "Multi-plane unbalance estimation using non-collocated sensor responses and model order reduction techniques", "url": "https://doi.org/10.1016/j.mechmachtheory.2026.106680", "authors": "Khurram Shehzad ほか", "venue": "Mechanism and Machine Theory", "date": "2026-11-12", "sjr": 1.574, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr49", "rank": 49, "headline": "学習のためのデジタル社会関係資本尺度を開発", "title": "The development and validation of a Digital Social Capital for Learning (DSC-L) scale", "url": "https://doi.org/10.1080/10494820.2026.2755536", "authors": "Shu Cheng ほか", "venue": "Interactive Learning Environments", "date": "2026-11-12", "sjr": 2.24, "citescore": 17.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr50", "rank": 50, "headline": "尺度の次元性と得点解釈を3段階で評価", "title": "A three-step framework for evaluating dimensionality and score interpretation in L2 scale development", "url": "https://doi.org/10.1016/j.rmal.2026.100395", "authors": "Joanna Juntang Wang", "venue": "Research Methods in Applied Linguistics", "date": "2026-11-12", "sjr": 2.794, "citescore": 12.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "労働市場の逼迫がドイツの賃金格差を反転させた", "title": "Labor Market Tightness and the Reversal of Inequality Trends in Germany", "url": "https://doi.org/10.1093/qje/qjag057", "authors": "Christian Dustmann ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-10", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "ドイツでは大不況までの20年間に賃金格差が拡大したが、最低賃金導入（2015年）より前の2010年から下位の賃金が上位より速く伸び始めた。論文はこの反転を、内需に支えられた労働市場の逼迫で説明する。不況後に転職率と転職時の賃金上昇が特に職の階段の下位で高まり、労働者が低賃金企業から高賃金企業へ移り、企業と労働者の同類マッチングと技能プレミアム、企業の買い手独占力が弱まったと報告する。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "投資家の長期情報が鈍ると長期案件の投資が減る", "title": "The Horizon of Investors’ Information and Corporate Investment", "url": "https://doi.org/10.1093/rfs/hhag097", "authors": "Olivier Dessaint ほか", "venue": "The Review of Financial Studies", "date": "2026-11-10", "sjr": 17.406, "why": "投資家が持つ情報の質が、予測の期間ごとに企業の実物投資へ影響することを示した。経営者が株価を気にするとき、長期のキャッシュフローに関する投資家のシグナルの情報量が落ちると、長期プロジェクトを持つ企業ほど投資を減らす。手作業で集めたプロジェクト期間の指標を使い、長期情報の質が1標準偏差下がると、長期案件の企業の投資が短期案件の企業に比べ3.7%減ると報告する。"}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "顧客の情報要求が取引先の気候開示を促す", "title": "The Role of Supply Chains in Climate Disclosure", "url": "https://doi.org/10.1111/1475-679x.70096", "authors": "Pietro Bonetti ほか", "venue": "Journal of Accounting Research", "date": "2026-11-12", "sjr": 9.774, "citescore": 13.4, "citescore_year": "2025", "why": "気候リスク報告の基盤であるCDPでは、顧客企業が仕入先に気候関連情報を求めることができる。この仕組みを使い、国際的な顧客・仕入先の組の大標本で、顧客の情報要求と仕入先のCDPでの公開開示に正の関連を見いだした。平均の関連は小さいが、双方の開示の誘因と交渉力に応じて大きく異なる。より環境負荷が小さく透明な仕入先へ取引関係が移る傾向も記述的に示す。"}, {"id": "jn04", "rank": 4, "field": "量子情報", "headline": "量子チャネルの学習に必要な回数の最適解を確定", "title": "Optimal learning of quantum channels in diamond distance", "url": "https://doi.org/10.1038/s41567-026-03499-7", "authors": "Antonio Anna Mele ほか", "venue": "Nature Physics", "date": "2026-11-12", "sjr": 6.581, "citescore": 29.4, "citescore_year": "2025", "why": "未知の量子チャネル（量子状態の時間発展を表す写像）を、標準的な距離であるダイヤモンド距離で一定の精度まで学ぶのに、チャネルを何回使う必要があるかという長年の未解決問題に答えた。入出力の次元とクラウス階数に対して最適な依存を持つアルゴリズムと、それに一致する下界を示す。チャネルのトモグラフィーを純粋状態のトモグラフィーに帰着させ、状態・ユニタリ・測定の推定を一つの枠組みで扱う（Nature Physics）。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "真正性の3類型が満足・口コミ・再購買につながる", "title": "Authenticity in marketing: A conceptual model and meta-analysis", "url": "https://doi.org/10.1007/s11747-026-01222-9", "authors": "Markus Blut ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-12", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "why": "マーケティングの真正性（authenticity）研究を、事実に忠実・理想に忠実・自己に忠実の3類型が全体的な真正性の知覚を生むという枠組みで統合したメタ分析。406の独立標本・173,577人の顧客のデータで、この統合モデルの当てはまりが最もよく、真正性が肯定的感情・信念・関係の質を介して満足、口コミ、再購買意図につながる連鎖を示した。財とサービス、オンラインとオフライン、国の違いによる調整効果も調べている。"}, {"id": "jn06", "rank": 6, "field": "計算社会科学・ネットワーク科学", "headline": "英議会100年の移民発言、近年は全党で否定的に", "title": "Measuring immigration rhetoric in the UK parliament", "url": "https://doi.org/10.1093/pnasnexus/pgag391", "authors": "Gloria Gennaro ほか", "venue": "PNAS Nexus", "date": "2026-11-12", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "why": "LLMと人手の入力を組み合わせた機械学習の手順で、英国下院の1923〜2025年の発言から移民への感情を測った。分類の性能は高く、モデルの選び方を変えても安定している。労働党議員は1960年代初めから保守党より肯定的で、1980年代初めに差が開いた。過去15年は党派を超えて否定的になり、保守党とリフォームUKの議員の論調は対象期間のどの党よりも否定的だと報告する。"}, {"id": "jn07", "rank": 7, "field": "計算社会科学・ネットワーク科学", "headline": "選挙監視のLLM、まれな脅威では精度が足りない", "title": "The Election Monitoring Trilemma: Measuring Rare Elite Threats on Social Media With Large Language Models", "url": "https://doi.org/10.1177/10659129261503387", "authors": "Sean T. Norton ほか", "venue": "Political Research Quarterly", "date": "2026-11-12", "sjr": 1.607, "citescore": 3.9, "citescore_year": "2025", "why": "2024年の南アフリカ・インド・ドイツの選挙で、候補者・政党・記者・インフルエンサーの公開投稿を集め、無作為標本を人手とLLMで5項目について注釈した。暴力の扇動は投稿の0.2%、民主的規範への攻撃は1.9%とまれだった。LLMは真の該当例を拾えるが、まれな項目での適合率は低い。このため選挙監視は、網羅性・処理量・信頼性の三つを同時には満たせないと論じる。"}, {"id": "jn08", "rank": 8, "field": "政治学", "headline": "解放民局の事務所は郡の社会経済を数十年改善", "title": "America's most “far‐reaching institution”: The work and legacies of the Freedmen's Bureau", "url": "https://doi.org/10.1111/ajps.70096", "authors": "Michael Albertus ほか", "venue": "American Journal of Political Science", "date": "2026-11-12", "sjr": 6.539, "citescore": 12.4, "citescore_year": "2025", "why": "米国の再建期に置かれた解放民局（Freedmen's Bureau）の活動について独自のデータを作り、事務所の配置と存続期間を郡の社会経済指標と結びつけた。事務所のあった郡では黒人・白人の双方に正の効果があり、地方の行政能力の発達を伴い、事務所が長く続くほど効果が大きい。効果は数十年続いたが、ジム・クロウ体制が深まるにつれ黒人では弱まり白人では強まったと報告する。"}, {"id": "jn09", "rank": 9, "field": "工学", "headline": "まばらな計測からダムの地震応答と損傷域を推定", "title": "A Deep Learning Framework for Seismic Response Reconstruction and Spatial Damage Assessment of Concrete Gravity Dams", "url": "https://doi.org/10.1142/s0219455428500782", "authors": "Bo Liu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "why": "重力式コンクリートダムでは動的計測器が少なく、地震時の局所損傷を素早く特定しにくい。検証済みのダム・貯水池・基礎系の有限要素モデルをもとに、時間・周波数の制約を付けた多スケールの敵対的生成ネットワークで未計測点の地震応答を再構成し、応答とモード形状差の特徴から区域ごとの損傷体積比の時刻歴を推定する枠組みを示した。"}, {"id": "jn10", "rank": 10, "field": "機械学習", "headline": "技能を離散符号で再利用しキャラクター制御を継続学習", "title": "STRIDE: Continual Learning using Skill Transfer and Reuse with Incremental Discrete Encoding", "url": "https://doi.org/10.1145/3861007", "authors": "Pranav Agarwal ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-12", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "物理シミュレーションで動くキャラクターの制御を強化学習で汎用化するとき、連続空間で方策が干渉し合うことが障害になる。VQ-VAEで方策を量子化して再利用できる行動の基本要素を離散潜在空間に見つけ、新しい動作を既存の符号語の組み合わせで学ぶことで破滅的忘却を構造的に避ける。多様な歩行や蹴り、的を狙う課題で、下流の学習を基準手法の1.3〜2.0倍速くしたと報告する。"}, {"id": "jn11", "rank": 11, "field": "経営学", "headline": "タクシー業界の抗議はUber禁止と利用増を同時に招く", "title": "Street Fights and Court Battles: Incumbent mobilization and the timing of regulatory bans against platform entrants", "url": "https://doi.org/10.1177/01708406261508714", "authors": "Bilgehan Uzunca ほか", "venue": "Organization Studies", "date": "2026-11-12", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "why": "欧州22か国・2012〜2020年について、タクシー業界の戦術と主張の枠組みを手作業で符号化し、最初の規制禁止、Uberアプリのダウンロード数、検索関心と結びつけた。実力行使型の戦術は動員直後の短い期間で、訴訟はより長い期間で最初の禁止の発生と関連する。同時に、これらの動員はダウンロードと検索関心の即時の増加とも重なり、排除しようとした参入者への注目を高めていた。因果の向きは特定できないと著者は述べる。"}, {"id": "jn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "職場の差別は否定的感情と反芻を経てサービス妨害へ", "title": "Discrimination takes its toll: unraveling employee service sabotage from a cognitive-appraisal perspective", "url": "https://doi.org/10.1108/ijchm-03-2026-0399", "authors": "Chia-Yun Tsai ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-12", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "why": "米国の飲食店従業員を対象にした複数の調査（300人、時間差をおいた234人）で、不公正の知覚が差別の知覚を生み、それが否定的感情と反芻を介してサービス妨害（故意に質を下げる行動）と間接的に関連することを示した。組織からの差別は顧客からの差別より一貫した関連を示し、性格特性の調整効果は外向性に限られた。"}, {"id": "jn13", "rank": 13, "field": "工学", "headline": "チタン合金筋とUHPCで橋脚の残留変形を抑える", "title": "Experimental Evaluation of the Influence of Titanium Alloy Bars on the Seismic Performance of Cast-in-Place Normal Concrete and Ultrahigh-Performance Concrete Bridge Piers", "url": "https://doi.org/10.1061/jbenf2.beeng-8228", "authors": "Mahesh Acharya ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-12", "citescore": 7.2, "citescore_year": "2025", "why": "腐食に強いチタン合金の鉄筋と超高性能コンクリート（UHPC）を使った橋脚の耐震性能を、大型試験体4体の繰り返し載荷で比べた。チタン合金筋は普通コンクリート・UHPCのどちらでも残留変形を大きく減らし、UHPCは基部のひび割れと損傷を抑えた。両者を組み合わせた試験体は強度と変形能が最も大きく、破壊時の塑性率は15を超えたが、減衰は鋼材の試験体より小さかった。"}, {"id": "jn14", "rank": 14, "field": "工学", "headline": "PC箱桁の有効ウェブ幅の特例はせん断耐力にほぼ無影響", "title": "Shear Resistance of Cast-in-Place Post-Tensioned Bridge Girders", "url": "https://doi.org/10.1061/jbenf2.beeng-8406", "authors": "Zhelun Zhang ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-12", "citescore": 7.2, "citescore_year": "2025", "why": "カリフォルニア州交通局は、グラウト充填ダクトを持つポストテンション箱桁橋の設計で、せん断耐力の計算に使う有効ウェブ幅とダクトの束ね配置についてAASHTO規定からの逸脱を認めている。実物に近い断面の桁を破壊まで載荷して検証し、修正した有効ウェブ幅による公称せん断強度の予測の変化は5%未満で、ダクトの健全性にも悪影響はないと報告する。"}, {"id": "jn15", "rank": 15, "field": "情報システム", "headline": "ダッシュボードという形式がデータの見え方を決める", "title": "Consider the Dashboard: Exploring a visual medium of datafication", "url": "https://doi.org/10.1177/01708406261508704", "authors": "Felix Diefenhardt", "venue": "Organization Studies", "date": "2026-11-12", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "why": "組織の意思決定をデータ化するうえで中心的な媒体であるダッシュボードについて、媒介と図式の理論を使い、すべてのダッシュボードに共通する「汎用の形式」と、それが観察者に促す見方を分析した。人的資源管理のデータ化の事例を交え、視覚的な形式がデータ化の過程で果たす役割と、その組織的な含意を論じる。"}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "成長型の個別配慮が従業員のサービス創造性を高める", "title": "Promotion focus, growth i-deals and service creativity: a regulatory focus perspective", "url": "https://doi.org/10.1108/ijchm-02-2026-0236", "authors": "Lingyi Wang ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-12", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "why": "中国のホテルと商業施設の100チーム・第一線従業員600人から多時点・多情報源のデータを集め、促進焦点が成長型の個別配慮（growth i-deals）と正に関連し、それが創造的自己効力感・内発的動機・参加機会の知覚を高めてサービス創造性につながることを、マルチレベルのパス解析で調べた。"}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "結婚前の女性の就業と出生間隔・出産の打ち切り", "title": "Whether and when: Women's work, birth spacing, and parity progression in late‐nineteenth‐century Derbyshire", "url": "https://doi.org/10.1111/ehr.70166", "authors": "Emma Diduch", "venue": "Economic History Review", "date": "2026-11-12", "sjr": 1.004, "citescore": 3.6, "citescore_year": "2025", "why": "19世紀後半の英ダービーシャーについて、連結した国勢調査記録と1911年国勢調査の出生力調査から1880年代以降に結婚した女性の完全な出生歴を復元し、出産をやめる行動と間隔をあける行動を分けて推定できる治癒モデル（split-population cure model）で分析した。結婚前の女性の職業とその後の夫婦出生力の関連を示し、夫婦が結婚当初から出生を制御していたことを示唆する。"}, {"id": "jn18", "rank": 18, "field": "機械学習", "headline": "吸収スペクトルから原子の立体配置を拡散モデルで生成", "title": "Generative inverse estimation of 3D atomic coordination from near-edge spectra via equivariant diffusion models", "url": "https://doi.org/10.1038/s41524-026-02384-4", "authors": "Ren Okubo ほか", "venue": "npj Computational Materials", "date": "2026-11-12", "sjr": 2.943, "citescore": 17.4, "citescore_year": "2025", "why": "吸収端近傍のスペクトル（ELNES/XANES）から、原子サイトごとの3次元構造の分布を直接生成する同変拡散モデル。Si–O結晶で学習し、結合距離の平均絶対誤差は約0.04 ÅでEXAFSと同等、配位数の誤差は2.0%未満（EXAFSは約20%）で、結合角を含む立体構造を再構成する。結晶だけで学習しても非晶質へ組成に応じて転用でき、石英などの実験スペクトルにも適用した。"}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "大規模な交流最適潮流つき起動停止計画を分解で解く", "title": "Alternating Methods for Large-Scale AC Optimal Power Flow with Unit Commitment", "url": "https://doi.org/10.1287/opre.2025.1935", "authors": "Matthew Brun ほか", "venue": "Operations Research", "date": "2026-11-12", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "発電機の起動停止と出力配分を、物理的に正確な交流送電モデルと機器故障への頑健性のもとで最適化する問題（SCUC-ACOPF）を扱う。価格に反応する需要、予備力、変圧器制御、エネルギー量に制約のある機器を含む詳細なモデルに対し、母線ごとの混合整数線形計画と時間帯ごとの連続非線形計画に分ける空間・時間分解と、罰則つき交互方向法で質の高い解を求める方法を示した。"}, {"id": "jn20", "rank": 20, "field": "計算社会科学・ネットワーク科学", "headline": "AI生成物があふれると質を見分ける手がかりが失われる", "title": "The social and cultural life of artificial intelligence (AI) slop: A research framework", "url": "https://doi.org/10.1177/20539517261506941", "authors": "Richard Jean So ほか", "venue": "Big Data and Society", "date": "2026-11-12", "sjr": 2.026, "citescore": 9.7, "citescore_year": "2025", "why": "AI生成コンテンツを検出して除く対象とみなす対応では不十分だとして、SLOPという分析概念を提案する。これは個々の生成物ではなく、AI生成コンテンツが量と見かけの完成度で一定の水準に達し、質の判断に使われてきた手がかりが当てにならなくなった情報生態系の状態を指す。生成物の価値と害は、誰が作り誰がどんな動機で関わるかという社会的文脈から生じると論じる研究枠組み。"}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "LLMのフィードバック研究用に課題・採点基準の合成データ", "title": "Open Synthetic University Assignment Rubric and Submission Dataset for LLM Educational Feedback Research", "url": "https://doi.org/10.1038/s41597-026-08569-2", "authors": "Keyang Qian ほか", "venue": "Scientific Data", "date": "2026-11-12", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "why": "LLMによる学生の課題へのフィードバックを研究するための、大学の計算機科学の課題・採点基準・提出物をそろえた大規模な合成データセット（SCALEFeedback）。実在の課題の記述をLLMが1対1で模倣して教育資料を合成する枠組みで作られ、課題の詳細・採点基準・提出物を含む公開データの不足を補う（Scientific Data）。"}, {"id": "jn22", "rank": 22, "field": "情報システム", "headline": "農業のグリーンCSRは供給網とデジタル能力を介して成果へ", "title": "From green commitment to sustainable harvest: how digital capabilities and institutional pressure power agricultural sustainability", "url": "https://doi.org/10.1108/jeim-08-2026-1536", "authors": "Ahmad Zaeem Faraz ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-12", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "why": "パキスタン4州30地区の農家と農業関連企業の管理者420人の横断調査で、グリーンCSRの統合が持続可能な農業経営の成果につながる経路をPLS-SEMで調べた。グリーン供給網の動的能力、持続可能な農業イノベーション、デジタル技術能力の3つを並列の媒介とし、強制的な制度的圧力の調整効果を検討している。横断の質問紙調査である。"}, {"id": "jn23", "rank": 23, "field": "工学", "headline": "不釣合いとき裂のある回転軸の故障と支持特性を同時同定", "title": "Novel Modelling and Full Spectrum Analysis for Robust Fault Identification in an Unbalanced and Cracked Rotor System Supported by Viscoelastic Foil Bearings", "url": "https://doi.org/10.1142/s0219455428500770", "authors": "Gopal Kumar ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "why": "粘弾性フォイル軸受で支えた剛体ロータについて、不釣合い加振・ジャイロ効果・開閉するき裂を含むモデルを作り、時間領域の振動応答を周波数領域に変換する全スペクトル解析で、故障の検出と軸受の剛性・減衰の推定を同時に行う枠組みを提案した。雑音を加えた信号とモデル化誤差を入れた場合も検討している。"}, {"id": "jn24", "rank": 24, "field": "工学", "headline": "鉄筋の引抜き試験99体で付着強度の過小評価を指摘", "title": "Experimental Study on Bond-slip Behavior of Rebar Anchored in Concrete", "url": "https://doi.org/10.1142/s0219455427420028", "authors": "Yi Zhu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "why": "鉄筋とコンクリートの付着すべりは、柱端や柱梁接合部の剛性低下を通じて鉄筋コンクリート構造の動的挙動を左右する。載荷の偏心・局所拘束・回転による測定誤差を減らす新しい試験装置で、コンクリート強度・鉄筋径・定着長を変えた99体の引抜き試験を行い、破壊形式と付着強度を整理した。広く使われる付着強度式は実際の強度を大きく過小評価すると報告する。"}, {"id": "jn25", "rank": 25, "field": "工学", "headline": "回転する多孔質の傾斜機能円板の組合せ共振を解析", "title": "Nonlinear combination resonance of rotating functionally graded circular plates with pores in the temperature field", "url": "https://doi.org/10.1142/s0219455428500812", "authors": "Manman Dong ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "why": "温度場の中で回転する、空孔を含む傾斜機能材料の円板について、パラメータ共振と主共振が組み合わさる非線形振動を調べた。幾何学的非線形を考慮してハミルトンの原理から支配方程式を導き、ガラーキン法と多重尺度法で振幅-周波数の関係を得て、リアプノフの安定論で定常解の安定判別条件を示した。"}, {"id": "jn26", "rank": 26, "field": "工学", "headline": "孔のある微細構造板で熱弾性波の分散を解析", "title": "Non-classical thermoelastic wave dispersion in microstructured plates: A structural dynamics approach based on couple-stress theory", "url": "https://doi.org/10.1142/s0219455428500769", "authors": "Hamza Abu Owida ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "why": "中央に長方形の孔を持つ微細構造の板を伝わる熱弾性波の分散を、固有の長さ尺度を持つ偶応力の熱弾性理論で調べた。孔の上・横・下の3領域に分けてフーリエ級数と指数関数を接続し、対称・反対称のレイリー・ラム波の特性方程式を導いた。孔の幅と高さを増やすと両方の波の位相速度が下がると報告する。"}, {"id": "jn27", "rank": 27, "field": "工学", "headline": "回転する窒化ホウ素ナノチューブの振動と安定性", "title": "Voltage-driven transverse vibration and dynamic stability of a spinning SWBNNT partially embedded in an elastic foundation", "url": "https://doi.org/10.1142/s0219455428500794", "authors": "Merwan Behar", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "why": "炭素ナノチューブの固定子に囲まれて回転する単層窒化ホウ素ナノチューブ（ナノモータの回転子）の横振動と動的安定性を調べた。固定子の拘束を弾性基礎として表し、回転子を非局所ひずみ勾配理論を組み込んだティモシェンコ梁で定式化して、ジャイロ効果・回転慣性・せん断変形・逆圧電効果を含む運動方程式をハミルトンの原理から導き、ガラーキン法で解いた。"}, {"id": "jn28", "rank": 28, "field": "組織行動・心理的安全性", "headline": "雇用不安の引き金を潜在移行分析で探る", "title": "Triggers of job insecurity: a latent transition approach to understanding how people construe threats to their jobs", "url": "https://doi.org/10.1007/s10869-026-10162-8", "authors": "Mindy K. Shoss ほか", "venue": "Journal of Business and Psychology", "date": "2026-11-12", "sjr": 2.563, "citescore": 10.6, "citescore_year": "2025", "w   // a theme comes with its colour number (theme_no 1-8 -> --t1 ... --t8); the page holds no theme names of its own
  function themeColor(it) { return it.theme_no ? "--t" + it.theme_no : "--accent-soft"; }

  var views = parts.map(function (p) { return p[0]; }).concat(["marks", "list"]);
  function groupOf(view) {
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].parts.length; j++) { if (groups[i].parts[j][0] === view) return groups[i]; }

  }

  function fillDates(list) {

    list.forEach(function (d, i) {

  }
  function addTab(key, text, label, onClick) {
    var b = el("button", "tab", text); b.type = "button"; b.dataset.view = key;
    if (label) { b.setAttribute("aria-label", label); b.title = label; }

    tabs.appendChild(b);

  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);

      var v = lastInGroup[g.key];
      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"

        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;

    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));

      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;

        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });

      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);

      askrow.appendChild(b);

    updateControls();

  function renderList() {

      var list = items(p[0]);

        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
