<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

 Viewpoints Reorganizes Representations in LLMs", "url": "https://arxiv.org/abs/2611.06848", "authors": "Austin C. Kozlowski ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Kozlowski, A. C., Mintz, A., & Lee, M. (2026). Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06848", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "政治的なペルソナを演じさせるとLLM内部の単語表現の幾何が組み替わり、ペルソナなしで作った真偽・道徳の判定器が偏った結果を出すことを示した（抄録）。", "p3": "リベラル・保守のペルソナと2つの中立条件で、9,000語以上の単語と33の意味軸の表現を取り出し、軸への射影と軸どうしの配置を比べた。線形プローブ、SAEに基づく分類器、手で選んだ単語表現の分類器も当てはめた（抄録）。", "p5": "ペルソナ条件は指定したイデオロギーの方向に射影と軸の配置を系統的に変え、ペルソナなしで学習した分類器は論争的な文の真偽と道徳の評価を政治的に偏らせた（抄録）。", "fun": "AIに「保守派の人として考えて」と頼むと、出力の言い回しだけでなく、内部で言葉どうしがどう並んでいるかまで変わる、という発見です。そのため、AIの中身を調べる道具を同じように当てても、演じている立場によって「本当か」「正しいか」の判定がずれてしまいます。点検の道具そのものを見直す必要を示した点が面白いところです。", "unverified": "使ったモデルの種類と規模、偏りの大きさの数値は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AIとの対話で陰謀論が減るのは事実の提示による", "title": "Just the Facts: How Dialogues with AI Reduce Conspiracy Beliefs", "url": "https://arxiv.org/abs/2611.05572", "authors": "Thomas H. Costello ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Costello, T. H., Pennycook, G., & Rand, D. G. (2026). Just the Facts: How Dialogues with AI Reduce Conspiracy Beliefs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05572", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIとの個別対話が陰謀論への信念を減らす主な理由は、親しみや共感ではなく、関連する事実と論拠の提示であることを示した（抄録）。", "p3": "米国の成人計2,193人の2つの実験で、説得目的の開示、討論形式、説明だけの指示、応答の半減、測定方法の変更、単一の個別メッセージへの置換など、考えられる原因を1つずつ取り除いた（抄録）。", "p5": "効果はこれらの操作のほとんどで保たれ、事実や論拠を使わずに説得するよう指示したときだけ大きく弱まった。AIの出力と参加者の説明の内容分析でも、信念の低下は事実に基づく論証と結びついていた（抄録）。", "fun": "陰謀論を信じる人をAIとの会話で説得できる、という先行の結果がありました。では、AIの何が効いたのか。親しげな語り口か、寄り添う姿勢か。条件を一つずつ外していくと、残った決め手は「関連する証拠をきちんと示すこと」でした。人間でも同じ証拠を示せれば同じように効くかもしれない、という示唆も面白い点です。", "unverified": "信念の低下幅（効果量）の数値は抄録では未確認。"}}, {"id": "pr19", "rank": 19, "headline": "予測の多重性の下で頑健な救済策を最適化", "title": "Optimizing Recourse Under Predictive Multiplicity", "url": "https://arxiv.org/abs/2611.05774", "authors": "Shahin Jabbari", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jabbari, S. (2026). Optimizing Recourse Under Predictive Multiplicity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05774", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "性能が同程度の複数のモデルで予測が食い違うときにも有効な救済策（不利な予測を好ましい側に変える入力の変更）を、最悪の場合の失敗を最小にする問題として解く方法を示した（抄録）。", "p3": "線形・ニューラル・混合・決定木のモデルからなる競合集合について、予算制約付きの最悪ケースの有効性損失の最小化として定式化し、オラクル効率的なアルゴリズムORPMと収束の十分条件を示した。合成データ1つと実データ5つで評価した（抄録）。", "p5": "最適化ギャップの上界が減少し、多くの設定で高い有効性と、特定のモデル種類向けの比較手法に対する良好な性能を示した。全モデルに共通の行動を求めたときの成功率の変化と、人口集団間の差も調べた（抄録）。", "fun": "たとえば審査で不利な判定が出た人に「この項目がもう少し良ければ通る」と助言しても、判定に使うAIが入れ替われば通らないかもしれません。同じくらい賢いAIでも、一人ひとりへの判定は意外と食い違うからです。どのAIでも通用する助言を、使える手間の範囲で探すという問題設定が面白いところです。", "unverified": "実データの名称と、集団間の差の大きさは抄録では未確認。"}}, {"id": "pr20", "rank": 20, "headline": "内力を自由度に含むTimoshenko梁の新要素", "title": "A novel mixed-variable beam element and its application on the free vibration of Timoshenko beam", "url": "https://doi.org/10.21203/rs.3.rs-11226309/v1", "authors": "Lv Ding ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Ding, L., Xia, X., Bao, S., & Wang, S. D. (2026). A novel mixed-variable beam element and its application on the free vibration of Timoshenko beam. https://doi.org/10.21203/rs.3.rs-11226309/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "せん断力と曲げモーメントも節点の自由度に含めた2節点8自由度のTimoshenko梁要素を提案し、固有振動数と内力を高い精度で求められることを示した（抄録）。", "p3": "混合変数の有限要素法の枠組みで、たわみ・断面回転・せん断力・曲げモーメントを節点自由度とし、3次のHermite補間関数に基づく2つの変位場から剛性行列と質量行列を導いた。3種類の典型的な境界条件と異なるメッシュで自由振動を解析した（抄録）。", "p5": "既往の結果との比較で、同じ補間次数の従来のTimoshenko梁要素に比べて誤差がおおむね半分以下になった。節点の内力が変位と同時に得られ、せん断力と曲げモーメントの分布は解析解と一致した（抄録）。", "fun": "梁（はり）をコンピュータで計算するとき、ふつうは「どれだけ曲がるか」を先に求め、「どれだけ力がかかっているか」は後から計算します。この研究は、力そのものも最初から計算の主役に入れる要素を作り、同じ細かさの分割でも誤差をおおむね半分以下にしました。発想を少し変えるだけで精度が上がる例として面白い研究です。", "unverified": "比較した既往の結果の出典と、計算コストの比較は抄録では未確認。"}}, {"id": "pr21", "rank": 21, "headline": "検証の関門を通った層だけ使うデジタルツイン", "title": "Evidence-gated digital twins for energy systems: field-validated heat-pump flexibility with online conformal bounds", "url": "https://doi.org/10.5281/zenodo.23965941", "authors": "Razmjoo, Armin", "venue": "Zenodo", "date": "2026-11-04", "apa": "Razmjoo, A. (2026). Evidence-gated digital twins for energy systems: field-validated heat-pump flexibility with online conformal bounds. Zenodo. https://doi.org/10.5281/ZENODO.23965941", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "各層が事前に決めた検証を通過したときだけ使う関門つきのデジタルツインで、ヒートポンプの需要シフトの申し出が守られるかを、英国66世帯の実データで検証した（抄録）。", "p3": "2026年1〜10月の公開1分値データの全対象世帯に、新しい世帯へモデルを当てはめる前に固定した選定規則と分析計画を適用した。1時間先のヒートポンプ電力の層、1節点の貯湯槽ツイン、温度の下限を与える分割・適応的コンフォーマル区間を検証した（抄録）。", "p5": "制約のない勾配ブースティングの層は検証できた61世帯すべてで関門を通らず、物理制約を入れた層は63世帯中45世帯で通過した（事後）。分割コンフォーマルの下限が名目水準の±2ポイント以内だった世帯は28%、適応的な下限では94%だった（抄録）。", "fun": "「この時間はお湯をわかすのを後回しにします」と申し出ても、守れなければ価値がありません。この研究は、AIの予測をそのまま信じるのではなく、各段階が事前に決めた試験に合格したときだけ使う仕組みを試しました。物理の制約を入れない機械学習は試験にまったく通らなかった、という結果が象徴的です。", "unverified": "未査読のプレプリント（Nature Communicationsに投稿中と記載）。各層のモデル構造と試験の基準の詳細は抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "グラフ基盤モデルで多変量時系列の異常検知", "title": "Graph Foundation Models Can Become Effective Multivariate Time Series Anomaly Detectors", "url": "https://arxiv.org/abs/2611.06441", "authors": "Zhuangyan Hu ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Hu, Z., Liang, Z., Li, W., Jia, X., Youssef, M., & Helal, S. (2026). Graph Foundation Models Can Become Effective Multivariate Time Series Anomaly Detectors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06441", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前学習済みのグラフ基盤モデル（GFM）を多変量時系列の異常検知に転用する枠組みGfm4Mtsadを提案した（抄録）。", "p3": "連続時系列をGFMの表現空間につなぐ整合モジュール（SICA）、正常の境界近くの難しい疑似異常を選ぶ教師なし学習の戦略（MAPS）、ノードから時間窓への集約の歪みを除く較正（TGEC）の3つを組み合わせた（抄録）。", "p5": "2つのGFMを基盤とした広範な評価で、既存の手法を上回る検出性能を示したと述べる（抄録）。", "fun": "多数のセンサの記録から「いつもと違う」瞬間を見つけるには、時間の流れとセンサ同士のつながりの両方を見る必要があります。この研究は、大量のグラフで事前に学習したAIの「つながりを見る目」を借りてくる発想です。ただし抄録には具体的な数値がなく、どれだけ良くなったかは本文で確かめる必要があります。", "unverified": "評価に使ったデータセットの名称と性能の数値は抄録では未確認。"}}, {"id": "pr23", "rank": 23, "headline": "アルゴリズム管理が配達労働の不平等を生む仕組み", "title": "Algorithmic Management and Inequality in the Gig Economy: A Conceptual Framework for Mechanism-Targeted Governance in Bogotá", "url": "https://doi.org/10.21203/rs.3.rs-11350563/v1", "authors": "Shruthaalaxmi . ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "., S., Radhakrishnan, M., & Devesh, S. (2026). Algorithmic Management and Inequality in the Gig Economy: A Conceptual Framework for Mechanism-Targeted Governance in Bogotá. https://doi.org/10.21203/rs.3.rs-11350563/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "配達プラットフォームのアルゴリズム管理が、労働者の不利な境遇をデータとして取り込み、配分や制裁の判断を通じて将来の機会に変換する仕組みを概念的に整理した（抄録）。", "p3": "プラットフォーム資本主義やアルゴリズムによる統制の研究、Fairwork Colombiaの評価、ボゴタの研究を解釈的に統合し、Kelloggらの「6つのR」の管理機能と、自動化の程度・適応的な個別化・不透明性の3つの性質で枠組みを作った（抄録）。", "p5": "非正規性・移民資格・周縁部の居住などの構造的な不利が文脈を無視した評価指標に符号化されると論じ、管理機能と介入点を結ぶ7つの検証可能な命題を示した。実証研究ではない（抄録）。", "fun": "配達アプリの評価の点数は公平な物差しに見えます。でも、住んでいる地区などの境遇が低い評価につながり、それが仕事の割り当てを減らすなら、過去の不利が未来の不利を生む循環になります。この研究は、その循環がどの段階で起きるかを分解し、ルールで止められる場所を探そうとしています。", "unverified": "7つの命題の具体的な内容は抄録では未確認。実証データによる検証は行っていない。"}}, {"id": "pr24", "rank": 24, "headline": "NHS精神保健サービスのハイブリッド勤務の実態", "title": "Understanding Hybrid Working in NHS Mental Health Services: Implications for Productivity, Wellbeing and Workforce Sustainability", "url": "https://doi.org/10.21203/rs.3.rs-11268314/v1", "authors": "Sai-Bo Cheung ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Cheung, S.-B., Nilforooshan, R., & Cropley, M. (2026). Understanding Hybrid Working in NHS Mental Health Services: Implications for Productivity, Wellbeing and Workforce Sustainability. https://doi.org/10.21203/rs.3.rs-11268314/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "英国NHSの精神保健サービスで、ハイブリッド勤務が職員のwell-being・働き方・定着にどう影響するかを質的に明らかにした（抄録）。", "p3": "イングランドの11の精神保健サービスの臨床・非臨床の職員21人に、2024年12月〜2025年2月に遠隔で半構造化面接を行い、再帰的テーマ分析をした（抄録）。", "p5": "「柔軟性・信頼・組織文化」と「生産性・well-being・定着」の2つのテーマが得られた。在宅は集中作業、職場は協働に向き、在宅は感情的に負担の大きい仕事からの休息になる一方、境界のあいまいさと連続するオンライン会議が過重労働の危険を生んだ（抄録）。", "fun": "在宅勤務は「サボりやすい」と思われがちですが、心のケアの現場で働く人にとっては、つらい話を聞き続ける仕事からひと息つける場所でもありました。一方で、家と職場の境目が消えると働きすぎにつながります。柔軟な働き方が上司からの信頼の表れとして受け止められ、ルールの運用が人によって違うと信頼が損なわれる、という点も身近な発見です。", "unverified": "抄録の事前登録番号は伏せ字（XXXXXX）で、登録内容は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "変則交差点を運転者参加型のデジタルツインで評価", "title": "InterSim: Innovative Intersection Digital Twins for Human-in-the-Loop Driving Simulation", "url": "https://arxiv.org/abs/2611.05968", "authors": "Luyang Jiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jiang, L., Wei, C., Li, Y., Wang, S., Zhou, Y., Yun, H., Liao, X., Pitts, B., & Wang, Z. (2026). InterSim: Innovative Intersection Digital Twins for Human-in-the-Loop Driving Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05968", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Unityのゲームエンジンで変則的な交差点のデジタルツインを作り、人の運転者や自動運転アルゴリズムを同じ条件で走らせて評価できるシミュレータInterSimを示した（抄録）。", "p3": "道路管理者の設計・交通データから交差点のツインを作り結果を返すデジタルツインの循環と、人または自動運転が自車を操作する人間参加型の循環の2つを結んだ（抄録）。", "p5": "事例として、交錯を減らす交差点と標準の交差点の侵入後時間（PET）の分布を交通量別に比べる代理安全性の研究と、路車間情報を使うルールベースのエージェントと人のエコドライブを比べる研究を示し、排出と運転行動の違いを見いだした（抄録）。", "fun": "見慣れない形の交差点は、安全で効率的でも、最初は運転者が戸惑うかもしれません。実際に作って試すのは高くつくので、ゲームエンジンの中にそっくりの交差点を作り、人に運転してもらって確かめる、という発想です。人と自動運転を同じ条件で走らせて比べられる点も面白いところです。", "unverified": "事例研究の具体的な数値（PETの差や排出量）は抄録では未確認。"}}, {"id": "pr26", "rank": 26, "headline": "議員の株取引に委員会情報の優位はない", "title": "The Illusion of Informed Congressional Trading: Evidence from Committee Networks and Hearings", "url": "https://doi.org/10.2139/ssrn.7679885", "authors": "Yuan Zhou", "venue": "SSRN", "date": "2026-11-05", "apa": "Zhou, Y. (2026). The Illusion of Informed Congressional Trading: Evidence from Committee Networks and Hearings. https://doi.org/10.2139/ssrn.7679885", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "米議会議員が担当委員会に近い企業の株取引で超過収益を得ている証拠は見当たらないことを、LLMで企業と委員会の対応を測って示した（抄録）。", "p3": "LLMで企業の10-Kの事業概要を議会委員会の管轄に対応づけ、企業と議員の情報の近さを連続的な指標にした。公聴会の後の取引、委員会をまたぐ波及、コロナ禍のオンライン公聴会への移行（対面の情報共有への外生的ショック）も調べた（抄録）。", "p5": "担当分野に近い銘柄の取引でも超過収益はなく、公聴会の後も成績は改善せず、取引規模や報告の遅れを変えても同じだった。オンライン化の前後でも取引の成果に系統的な変化はなかった（抄録）。", "fun": "議員は法律づくりの過程で企業の事情に触れるので、株でもうけているのでは、という疑いはよく話題になります。この研究は、AIに企業の事業説明を読ませて「どの委員会と関係が深い会社か」を数値にし、その疑いを確かめました。少なくとも日常的な議会活動からは、もうけの証拠は出てこなかったという結果です。", "unverified": "標本期間と取引件数、LLMによる対応づけの精度は抄録では未確認。"}}, {"id": "pr27", "rank": 27, "headline": "小標本の表データをコピュラとVAEで合成", "title": "Copula and mixture prior variational autoencoders for small sample blasting fragmentation modelling", "url": "https://doi.org/10.31224/8715", "authors": "Paulo Lopes", "venue": "engrXiv", "date": "2026-11-05", "apa": "Lopes, P. (2026). Copula and mixture prior variational autoencoders for small sample blasting fragmentation modelling. https://doi.org/10.31224/8715", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "engrXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "観測の少ない発破破砕のデータで、コピュラと3種類の表データVAEによる合成データを比べ、混合事前分布のVAEが最も高い予測効用を示した（抄録）。", "p3": "3つの文献から集めた262件の破砕ベンチマークで、ガウス・t・クレイトンのコピュラと、標準・KLアニーリング・ガウス混合事前分布のVAEを比べた。生成器の学習前に実データの検証用を分け、尤度、MMD、埋め込み距離、合成で学習し実データで試す効用を組み合わせた（抄録）。", "p5": "混合事前分布のモデルが最も高く、R²は約0.736、RMSEは約1.698（破砕指標の単位）だった。アニーリングは標準モデルより効用を改善し、コピュラ由来の入力はおおむね性能を下げた。実データだけの予測器に対する上積みや未知の鉱山への移転は示していない（抄録）。", "fun": "データが少ない分野では「本物そっくりの偽データを作って増やせばよいのでは」と考えたくなります。この研究は、偽データが本物に似ているかと、偽データで学んだ予測が本物に通用するかは別の問いだ、と分けて確かめています。著者が自分の結果の限界まで細かく書いている点も誠実で面白いところです。", "unverified": "6変数の効用の枠組みとコピュラの8次元の食い違いは著者も限界として挙げており未解消。シードごとの結果は不完全と記載。"}}, {"id": "pr28", "rank": 28, "headline": "小規模事業の会計と税務で生成AIが失敗する点", "title": "Keeping the Human in the Loop: Failure Points of Generative AI in Small-Business Accounting and Tax Compliance", "url": "https://doi.org/10.37497/opsbrazil.51", "authors": "Edson Teles Victor", "venue": "Editora Alumniin", "date": "2026-11-05", "apa": "Victor, E. T. (2026). Keeping the Human in the Loop: Failure Points of Generative AI in Small-Business Accounting and Tax Compliance. https://doi.org/10.37497/opsbrazil.51", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "Editora Alumniinの記録で、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、小規模事業の会計と税務申告で生成AIが失敗しやすい点を整理し、人が判断に関わり続ける必要を論じる研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名が問うのは、会計や税金の書類づくりに生成AIを使ったとき、どこで失敗しやすく、どこに人の目が欠かせないかという点です。計算が得意なはずのコンピュータに任せても人の確認がいる場面があるのか、という問いそのものが身近で面白いところです。", "unverified": "内容は題名からの推測で、手法・結果・掲載形態（論文か書籍の章か）は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "マグマ貫入による火山体斜面の不安定化を数値解析", "title": "Numerical Modeling of Volcanic Flank Instabilities Induced by Magmatic Intrusions", "url": "https://theses.hal.science/tel-05852863v1", "authors": "Michael Galarraga", "venue": "HAL", "date": "2026-11-05", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された博士論文の抄録を使用", "preprint": true, "short": true, "p1": "マグマの貫入が火山体の斜面をどう変形させるかを個別要素法（DEM）で再現し、メラピ火山の2020年の危機とセントヘレンズ山の1980年の崩壊の変形の特徴を説明した（抄録）。", "p3": "メラピではマグマで満たされた割れ目と溶岩ドーム、セントヘレンズでは潜在ドームを与えたDEMモデルを作り、変形の速さと動き方を観測と比べた（抄録）。", "p5": "メラピでは山頂から深さ約500 mまでの北西斜面の非弾性変形を再現し、すべりが止まって新たな安定状態に達する様子も示した。セントヘレンズでは北傾斜の主要なせん断断層、斜めのマグマの押しによる北斜面の膨らみ、山頂の地溝の形成を再現した（抄録）。", "fun": "火山の斜面は、内部にマグマが入り込むと押し出されるように動きます。メラピ火山では斜面が大きく動いたのに崩れず、セントヘレンズ山では山腹が丸ごと崩れました。粒の集まりとして山を計算すると、その違いを再現できるという点が面白く、斜面が大きく変形しても必ず崩れるとは限らないことも示しています。", "unverified": "博士論文で、モデルの粒子数や物性の設定は抄録では未確認。"}}, {"id": "pr30", "rank": 30, "headline": "地すべりの種類を自動分類するPythonソフト", "title": "Brief communication: Landsifier 2 – Python-based Software for Automated Landslide Type Classification", "url": "https://doi.org/10.5194/egusphere-2026-6509", "authors": "Nico Schlauf ほか", "venue": "EGUsphere", "date": "2026-11-05", "apa": "Schlauf, N., Bhuyan, K., Kapoor, M., Nava, L., Rana, K., Aral, A., & Ozturk, U. (2026). Brief communication: Landsifier 2 – Python-based Software for Automated Landslide Type Classification. https://doi.org/10.5194/egusphere-2026-6509", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地すべり台帳の多角形データに移動形態と誘因の推定を加えるオープンソースのPythonライブラリLandsifier 2を公開した（抄録）。", "p3": "3次元の形状、位相的な記述子、設定できる分類器を使い、既存の誘因判定に移動形態の予測、利用者が定める分類、クラス確率付きの空間出力を加えた（抄録）。", "p5": "独立にラベル付けされた台帳と未記載の台帳への適用で柔軟性を示したと述べるが、分類精度の数値は抄録にない（抄録）。", "fun": "地すべりの地図には「どこで起きたか」は載っていても、「どう動いたか」「何が引き金か」が書かれていないことが多いそうです。この道具は、地すべりの形の立体的な特徴から、その種類を推定して地図に書き足します。形から過去の動きを推理する、という発想が面白いところです。", "unverified": "分類の正答率などの数値は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "先行降雨と被災状況から見る地すべり死者", "title": "Antecedent rainfall patterns and situational vulnerability of victims of rainfall-induced fatal landslides in Pakistan", "url": "https://doi.org/10.5194/egusphere-2026-6563", "authors": "Shibiao Bai ほか", "venue": "EGUsphere", "date": "2026-11-05", "apa": "Bai, S., Zhu, W., Wang, X., & Zhou, P. (2026). Antecedent rainfall patterns and situational vulnerability of victims of rainfall-induced fatal landslides in Pakistan. https://doi.org/10.5194/egusphere-2026-6563", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "パキスタンの降雨による死者を伴う地すべりで、雨の指標は事象ごとの死者数を説明せず、死者は夜間・屋内に集中していたことを示した（抄録）。", "p3": "2004〜2024年の台帳で位置精度I〜IIの250件中213件をCHIRPSの日雨量（0.05°）と照合し、2018〜2024年の死者309人の個人属性を集めた。当日と7日間の先行雨量で4つの類型に分けた（抄録）。", "p5": "53.5%の事象はCHIRPSで当日雨量がゼロで、当日雨量の少ない類型CとDが86.4%を占めた。雨の指標は事象ごとの死者数と有意に相関しなかった。場所の分かる死者の66.0%は屋内、時刻の分かる死者の74.5%は夜間だった（抄録）。", "fun": "大雨の日に地すべりが起きる、と考えがちですが、この台帳では半数以上の事例で、推定された当日の雨量はゼロでした。それより前に降った雨の積み重ねが効いていたことになります。さらに、亡くなった人の多くは夜に家の中にいました。警報は雨の量だけでなく「夜に家にいる人をどう逃がすか」まで考える必要がある、という点が身近な発見です。", "unverified": "台帳は死者数の下限推定（複合災害で地すべりによる死者が埋もれる）と著者が注記。CHIRPSによる雨量の過小評価の程度は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "テンソルネットワークで計算力学の境界値問題を解く", "title": "A Tensor-Network Chebyshev-Galerkin Method for Boundary-Value Problems in Computational Mechanics", "url": "https://arxiv.org/abs/2611.06552", "authors": "Juan Jos\\'e Rodr\\'iguez-Aldavero ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Rodríguez-Aldavero, J. J., Velasco, Á. de la R., & García-Ripoll, J. J. (2026). A Tensor-Network Chebyshev--Galerkin Method for Boundary-Value Problems in Computational Mechanics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06552", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "圧縮したテンソルトレイン（QTT）の形のままでChebyshev-Galerkin法の大域スペクトル系を組み立てて解く方法を示し、パラメータ空間全体の解を1回の計算で得られるようにした（抄録）。", "p3": "弱形式から出発し、変数係数の連成楕円型系、滑らかに写像した形状、DirichletとRobinの混合境界条件を扱い、テンソルネットワークの変分ソルバーに適した対称正定値系を得る。パラメータや確率的な入力は追加の座標として入れる（抄録）。", "p5": "線形弾性の3次元ベンチマークで誤差10^-8未満に達し、試した範囲でQTT差分法やFEniCSxのQ2/Q4有限要素を上回った。1.7×10^7通りの6パラメータの片持ち梁の設計検討を92秒の1回の計算で解き、確率座標10個の問題を全係数配列の2.4×10^6分の1のメモリで表した（抄録）。", "fun": "変数がとても多い問題は、ふつうはコンピュータのメモリに入りきりません。この研究は、データをぎゅっと圧縮した形のまま計算を進める工夫で、一千万通りを超える設計案を1回の計算でまとめて解きました。量子コンピュータの考え方を借りた計算法が、普通のコンピュータで構造の問題に役立つという点が面白いところです。", "unverified": "テンソルのランクや計算機環境の詳細は抄録では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "適応的な領域分割でPINNの精度を上げる", "title": "Adaptive Domain Decomposition for Finite Basis Physics-Informed Neural Networks", "url": "https://arxiv.org/abs/2611.05659", "authors": "Sarah Helfert ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Helfert, S., Chen, W., Howard, A. A., Stinis, P., & Heinlein, A. (2026). Adaptive Domain Decomposition for Finite Basis Physics-Informed Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05659", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "解の特徴に合わせて計算領域の分け方を自動で学ぶことで、有限基底の物理情報ニューラルネット（FBPINN）の精度を上げる方法ADD-FBPINNを示した（抄録）。", "p3": "領域の分割をデータから学ぶPartition of Unity Network（POUNet）の分離可能な版を、利用者が分割を決めるFBPINNに組み合わせ、安定で幾何的に解釈できる分割を自動で得る（抄録）。", "p5": "2次元のHelmholtz方程式、多重スケールの特徴を持つ2次元のPoisson方程式、粘性Burgers方程式で、分割を固定したFBPINNより精度が改善したと述べる（抄録）。", "fun": "ニューラルネットで物理の方程式を解くとき、全体を一つで解くより、場所ごとに担当を分けた方がうまくいくことがあります。問題は「どこで区切るか」を人が決めていたことでした。この研究は、解の形を見ながら区切り方そのものをAIに学ばせる、という一段上の自動化が面白いところです。", "unverified": "精度の改善幅の数値と計算時間の比較は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "ドリフト拡散で重い裾のPearson IV型分布を導く", "title": "A Drift-Diffusion Approach for Pearson Type IV Heavy-Tail Distributions", "url": "https://arxiv.org/abs/2611.06749", "authors": "Daniele Belardinelli ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Belardinelli, D., Benella, S., Stumpo, M., & Consolini, G. (2026). A Drift-Diffusion Approach for Pearson Type IV Heavy-Tail Distributions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06749", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形のドリフトと2次の拡散を持つ標準化したフォッカー・プランク方程式の定常解としてPearson IV型分布を導き、重い裾と非対称性の起源を分けて示した（抄録）。", "p3": "この分布が現れる必要十分条件を示し、線形-2次の構造は十分だが必要ではないことを示した。累積分布関数、モーメントの漸化式、歪度、尖度、最頻値の閉じた式も与えた（抄録）。", "p5": "重い裾は状態に依存する拡散の局所的な非線形の曲率から、非対称性はその勾配から生じ、対称な線形の復元ドリフトでも非対称な定常揺らぎが現れうることを示した。宇宙プラズマの乱流などを対象に挙げる（抄録）。", "fun": "ばねに引き戻されながら揺れる粒を考えると、ふつうは左右対称の釣鐘型の分布に落ち着きます。ところが、揺さぶられ方の強さが場所によって変わると、分布の片側が長く伸びたり、裾が重くなったりします。そのどちらがどの性質から生まれるのかを式で切り分けた点が面白いところです。", "unverified": "観測データへの当てはめの結果は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "体積を保存する非線形自由表面波の有限要素法", "title": "A volume-conserving ALE continuous Galerkin method with residual-based Dirichlet--Neumann fluxes for nonlinear free-surface waves", "url": "https://arxiv.org/abs/2611.06408", "authors": "Fan Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, F., Xia, Y., & Xu, Y. (2026). A volume-conserving ALE continuous Galerkin method with residual-based Dirichlet--Neumann fluxes for nonlinear free-surface waves (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06408", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "2次元の完全非線形の自由表面ポテンシャル流れを、離散的な流体体積を保存するALE連続ガラーキン有限要素法で解く方法を示した（抄録）。", "p3": "現在の流体領域でアイソパラメトリック有限要素法により内部のポテンシャルを求め、残差に基づくDirichlet-Neumannフラックスで表面を発展させる。適合するメッシュ移動・表面射影・数値積分と組み合わせ、6次の表面散逸（任意）と4次のRunge-Kutta法を使う（抄録）。", "p5": "線形の自由表面波で期待どおりの空間収束を確かめ、平坦・湾曲した底面上の非線形波でメッシュへの依存性が小さいことを示した。回転する造波機の例で動く固体境界の扱いも示した（抄録）。", "fun": "水の表面の波を計算するとき、方法によっては誤差が積み重なって、いつの間にか水の量が増えたり減ったりしてしまうことがあります。この研究は、計算の仕組みそのものに「水の量は変わらない」というきまりを組み込みました。保存則を数値計算でも守らせる工夫が面白いところです。", "unverified": "誤差や収束次数の具体的な数値は抄録では未確認。"}}, {"id": "pr36", "rank": 36, "headline": "高コントラスト多孔質流れの粗空間を学習", "title": "Learning Coarse Spaces for Two-Grid Methods from Smoothed Errors with Applications to High-Contrast Porous Media Flow", "url": "https://arxiv.org/abs/2611.05837", "authors": "Chenglong Bao ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Bao, C., Cui, C., & Li, R. (2026). Learning Coarse Spaces for Two-Grid Methods from Smoothed Errors with Applications to High-Contrast Porous Media Flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05837", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "加法シュワルツ平滑化の有限ステップの誤差から二格子法の粗空間を学習し、パラメータが変わる高コントラストの多孔質流れでも粗空間を作り直す手間を減らす方法を示した（抄録）。", "p3": "訓練パラメータごとに平滑化後の誤差のスナップショットを離散エネルギー内積でPODして基準の粗空間を作り、基底に依存しない白色化した部分空間の損失で連続座標のニューラル生成器を学習する。粗空間のずれと二格子作用素の関係の摂動評価も示した（抄録）。", "p5": "高コントラストの界面問題、界面が動くDarcy流れ、非線形のForchheimer流れで有効な性能を示した。訓練格子の約264倍の自由度を持つ最も細かい試験格子で、FGMRESの反復回数はパラメータ別のPOD基準に近く、GenEOの空間と同程度だった（抄録）。", "fun": "地下の地層は場所によって水の通りやすさが大きく違い、流れの計算がとても遅くなることがあります。速く解くための「粗い近似の空間」を毎回作り直すのは大変なので、作り方をAIに学ばせ、見たことのない細かい格子にも使い回せるようにしました。学習に使った格子より約264倍細かい問題でも通用した点が面白いところです。", "unverified": "計算時間の削減の具体的な数値は抄録では未確認。"}}, {"id": "pr37", "rank": 37, "headline": "顧客対応LLMを既知の正解で出荷前に検査", "title": "QuasiPersona: behavioral release testing of LLM assistants on known-truth material from a business domain — method and a worked example", "url": "https://doi.org/10.5281/zenodo.23963747", "authors": "Terribile, Marco", "venue": "Zenodo", "date": "2026-11-04", "apa": "Terribile, M. (2026). QuasiPersona: behavioral release testing of LLM assistants on known-truth material from a business domain — method and a worked example (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.23963747", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "顧客対応に組み込まれたLLM助手を、依頼者の業務資料に基づく正解つきの問題で出荷前に検査する手法QuasiPersonaを示した（抄録）。", "p3": "6つの構成層×10の逸脱ガイドワード（HAZOP由来）の網羅行列、4つの妥当性尺度と14特性の行動的な性格検査、名前をつけた失敗キャラクター、検査に基づく指示の書き換え（療法）、未処置の複製に同じ質問票を与える双子対照を組み合わせた（抄録）。", "p5": "9つの欠陥を仕込んだ保険の助手で1,213回実行し、7つの欠陥と8つ目の一部を検出した（9つ目は一度も起動されなかった）。双子対照により、6特性の見かけの変化の多くは質問票の効果だと分かった（抄録）。", "fun": "AIの性格テストは、ふつうAIのモデルだけを相手に行います。でも実際の窓口のAIは、指示書や検索の仕組みと一体になって動いています。この研究は製品として組み上がった姿を丸ごと試験し、さらに「治療」の効果と「同じ質問に慣れた効果」を、手を加えない双子と比べて見分けました。発達心理学の双子の考え方を借りた点が面白いところです。", "unverified": "Zenodo上の未査読の文書。例は構成した保険の助手で、実際の運用データでの検証は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "ペルソナ付きの対話でコーディングエージェントを評価", "title": "PersonaCodeBench: Evaluating Coding Agents in Persona-driven Human-Interactive Sessions", "url": "https://arxiv.org/abs/2611.05739", "authors": "Haixin Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, H., Hou, J., Shen, H., Fan, W., Huang, W.-C., Zhu, Q., Li, W., Li, T., Yao, Y., Wang, R., Peng, Z., Jiang, W., Chen, Y., Liang, S., Li, H., Cao, D., Hu, X., Wu, S., Yang, C., … Li, X. (2026). PersonaCodeBench: Evaluating Coding Agents in Persona-driven Human-Interactive Sessions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05739", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者の特性を検証できる義務に変え、ペルソナに基づく多ターンの対話でコーディングエージェントが個別の要求を満たせるかを評価するベンチマークを作った（抄録）。", "p3": "役割・技術力・対話の好み・実務上の制約からなるペルソナで、実装・権限・テスト・説明・納品の要求が段階的に現れる。制御器が利用者シミュレータの応答と要求の開示を管理し、完了の検証器とペルソナ充足の検証器が別々に評価する（抄録）。", "p5": "主要な最先端のエージェントをすべて評価して順位表を作り、詳細な実験分析で有効性を確かめたと述べる（抄録）。", "fun": "同じプログラムを頼むにしても、初心者と熟練者では欲しい説明の量も、任せてよい範囲も違います。この評価は、相手の人柄や事情に合わせた仕事ができるかを、正しく動くかとは別に採点します。AIに「相手を見て働く力」を求める点が面白いところです。", "unverified": "各エージェントの成績の数値は抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "道徳的選好に合わせたAI助言の効果", "title": "Strategically (Im)moral: Stated Preferences in Personalized AI Advice", "url": "https://doi.org/10.2139/ssrn.7679999", "authors": "Julia Elisabeth Rose", "venue": "SSRN", "date": "2026-11-05", "apa": "Rose, J. E. (2026). Strategically (Im)moral: Stated Preferences in Personalized AI Advice. https://doi.org/10.2139/ssrn.7679999", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "表明した道徳的選好に基づく個別化AI助言は、判断をAIに任せたときの道徳的な選択の減少を補えず、人は助言を自分に都合よくするために選好を弱めて答えることを示した（抄録）。", "p3": "事前登録した実験で1,250人が、寄付なしで利益を最大にする選択肢とUNICEFに寄付する費用の高い選択肢から、自分で選ぶか、利益最大化または寄付最大化のアルゴリズムに任せた。構造化質問と自由記述で選好を聞く個別化助言を比べた（抄録）。", "p5": "委任は道徳的な選択を約13ポイント減らし、個別化助言はこの減少を相殺しなかった。回答が助言に使われると知ると構造化質問での道徳的選好は弱まり、知らせないと道徳的な選択は委任なしの水準近くに戻った（抄録）。", "fun": "「あなたの価値観に合った助言をします」と言われると、人は自分に都合のよい助言が出るように、答えを少し曲げてしまうようです。しかも本人は自分の価値観に従っているつもりのまま。助言の仕組みを正直に知らせるほど入力がゆがむ、という板挟みが面白いところです。", "unverified": "SSRNの未査読論文。選好の弱まりの大きさの数値は抄録では未確認。"}}, {"id": "pr40", "rank": 40, "headline": "社会関係資本と信仰がメコンの気候適応を支える", "title": "Assessing social capital, religious beliefs, and climate resilience among rural coastal households in the Vietnamese Mekong Delta", "url": "https://doi.org/10.21203/rs.3.rs-11121634/v1", "authors": "Duong Hoang Loc ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Loc, D. H., Duy, D. T., & Da, C. T. (2026). Assessing social capital, religious beliefs, and climate resilience among rural coastal households in the Vietnamese Mekong Delta. https://doi.org/10.21203/rs.3.rs-11121634/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ベトナム・メコンデルタの沿岸農家で、社会関係資本が宗教的信念を通じて宗教的実践と気候変動への適応を高めるという関係を示した（抄録）。", "p3": "沿岸の農家335世帯の調査データにAMOS 20の構造方程式モデリングを当てはめ、構造的・関係的・認知的な社会関係資本、宗教的信念、宗教的実践、適応の関係を検証した（抄録）。", "p5": "仮説としたすべての関係が統計的に有意で、社会関係資本は宗教的信念を高め、信念は宗教的実践と気候変動への適応を高めた（抄録）。", "fun": "地域で気候の変化に備えるとき、役所の計画だけでなく、人と人のつながりや信仰の場も支えになりえます。この研究は、近所づきあいや信頼が信仰を強め、それが適応の行動につながるという道筋を数字で確かめようとしました。宗教のネットワークを地域づくりの資源とみる視点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。各経路の係数の大きさは抄録では未確認。"}}, {"id": "pr41", "rank": 41, "headline": "認知機能が低下した高齢者の介護者のストレス", "title": "Title of the article: Perceived Stress, Coping Mechanisms, and Associated Factors Among Caregivers of Cognitively Impaired Elderly Attending a Rural Secondary Care Facility in Eastern India: A Mixed-Methods Study", "url": "https://doi.org/10.21203/rs.3.rs-11377226/v1", "authors": "Abhisek Mishra ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Mishra, A., Tripathy, D., S, R. A., Parida, S., & Singh, A. (2026). Title of the article: Perceived Stress, Coping Mechanisms, and Associated Factors Among Caregivers of Cognitively Impaired Elderly Attending a Rural Secondary Care Facility in Eastern India: A Mixed-Methods Study. https://doi.org/10.21203/rs.3.rs-11377226/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インド東部の農村の二次医療施設で、認知機能が低下した高齢者の介護者の54.3%が高い知覚ストレスを抱え、介護の自己効力感の低さが唯一の独立した予測因子だったことを示した（抄録）。", "p3": "高齢者クリニックで81人を連続的に募り、PSS-10、CSES-8、Lawton-BrodyのIADL尺度で測って多変量ロジスティック回帰を行い、6人の介護者への詳細面接（現象学的研究）と三角測量した（抄録）。", "p5": "高いストレスは自己効力感の欠如（中央値7）より無力感（中央値10）が主で、自己効力感の低さは高ストレスの可能性を大きく高めた（調整オッズ比14.71、95%CI 4.06–52.63）（抄録）。", "fun": "家族を介護する人のストレスは、介護の量の多さで決まると思いがちです。この調査では、「自分ならうまくやれる」という手応え（自己効力感）が低い人ほど、強いストレスを感じていました。介護の負担を減らすだけでなく、介護する人の自信を支えることも大切だ、という視点が面白いところです。", "unverified": "抄録はp値の途中で切れており、質的分析の結果は未確認。単一施設の小標本の結果。"}}, {"id": "pr42", "rank": 42, "headline": "地域の保健ボランティアが家族と保健をつなぐ", "title": "Community Health Cadres as Community Mediators in Supporting Families at Risk of Stunting: A Qualitative Study within Maternal and Child Health Services in Indonesia", "url": "https://doi.org/10.21203/rs.3.rs-10959086/v1", "authors": "Nintinjri Husnida ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドネシアの地域保健ボランティア（カデル）が、発育阻害のリスクがある家族と地域・母子保健サービスを文化に合わせてつなぐ媒介役を果たしていることを質的に示した（抄録）。", "p3": "バンテン州ルバック県の保健センターの管内で、カデル、親、医療従事者、地域の指導者、行政の代表を目的的に選び、詳細面接、フォーカスグループ、参与観察、フィールドノートをテーマ分析した（抄録）。", "p5": "家族への伴走に対する地域の認識と関与、媒介者としてのカデル、伴走の実践に影響する要因の3つのテーマが得られた。カデルは信頼される媒介者として意思疎通を助け、健康のメッセージを地域の文化に合わせて伝えていた（抄録）。", "fun": "子どもの成長を見守るとき、専門家より顔なじみの近所の人の言葉の方が届くことがあります。この研究のカデルはまさにその役回りで、家族と保健サービスの間を行き来しながら、健康の話を地域の習慣に合わせて伝えていました。制度のすきまを人のつながりが埋めている点が面白いところです。", "unverified": "参加者の内訳と、伴走の効果の量的な評価は抄録では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "AIは社会科学の新しい実証基盤になる", "title": "AI for Society: A Selective Overview and Future Prospects", "url": "https://doi.org/10.2139/ssrn.7679985", "authors": "Jianqing Fan ほか", "venue": "SSRN", "date": "2026-11-05", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIが社会・経済の研究の新しい実証基盤になるという立場から、測定・予測・因果推論・政策学習に使う枠組みを選択的に概観した（抄録）。", "p3": "異質な記録を分析できる証拠に変える枠組み、潜在的な状態の高解像度の指標と代理変数の構築、予測シグナルの抽出、要因の帰属・因果推論・政策学習の支援を整理した（抄録）。", "p5": "応用として都市開発、金融の感情分析と不正検知、資産価格、経済予測、企業報告の監査を挙げ、転移学習、生成・エージェント型のシステム、AIが生む証拠の信頼性を今後の課題とした（抄録）。", "fun": "AIは社会を変える技術であると同時に、社会を調べる道具にもなります。画像や文章、プログラムなど、これまで数字にしにくかったものを測れるようにするからです。この論文は「調べる道具」としてのAIに絞って全体像を描いており、社会科学の研究のやり方そのものが変わりつつあることが分かります。", "unverified": "概観の対象とした文献の範囲と件数は抄録では未確認。"}}, {"id": "pr44", "rank": 44, "headline": "LLMで動くゲームNPCの研究を体系的に整理", "title": "LLM-based NPCs in Video Games: A Systematic Mapping Study", "url": "https://arxiv.org/abs/2611.05427", "authors": "Dilan Mian ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMで動くゲームのNPC（プレイヤー以外のキャラクター）の研究を体系的にマッピングし、記憶の仕組みや応答時間など実装の現状を定量的に示した（抄録）。", "p3": "学術文献の377本から42本を選び、主な研究課題と10の下位課題、4つの主題軸で分析した（抄録）。", "p5": "短期記憶と世界状態への接地はそれぞれ60%と69%でほぼ標準だが、長期記憶（31%）、振り返り（38%）、検索拡張生成（14%）はまだ少なく、応答時間は2.6〜15秒だった。商用化の6つの構造的な障壁も挙げた（抄録）。", "fun": "ゲームの村人は、昔は決まったせりふしか言いませんでした。LLMを使えば自由に会話できますが、前に話したことを覚えている村人はまだ少数派で、返事に数秒から十数秒かかることもあります。夢の技術の「今の実力」を数字で示した点が面白いところです。", "unverified": "選定基準の詳細と、6つの障壁の具体的な内容は抄録では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "計算社会科学・ネットワーク科学", "headline": "AIデータセンターの仮設タービンが州境を越える汚染", "title": "Temporary gas turbines powering a US AI data center created a cross-state air pollution hotspot", "url": "https://arxiv.org/abs       if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
