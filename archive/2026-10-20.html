元不均質斜面の破壊確率を高速推定", "title": "Powering Three-dimensional Heterogeneous Slope Failure Predictions and Risk Assessment with Deep Learning", "url": "https://doi.org/10.1139/cgj-2026-0302", "authors": "Chongzhi Wu ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-19", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr13", "rank": 13, "headline": "在宅勤務ショックの影響は男女で違った", "title": "Gendered Effects of a Crisis-induced Work-from-Home Shock: A Time-Motion Study Using Digital Footprints", "url": "https://doi.org/10.1287/msom.2025.0059", "authors": "Kamalini Ramdas ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-10-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr14", "rank": 14, "headline": "文献スクリーニングでのLLMとプロンプトの相性", "title": "Evaluating prompting strategies and large language models in systematic literature review screening: Relevance and task-stage classification", "url": "https://doi.org/10.1017/rsm.2026.10110", "authors": "Binglan Han ほか", "venue": "Research Synthesis Methods", "date": "2026-10-19", "sjr": 3.143, "citescore": 12.1, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr15", "rank": 15, "headline": "都市再生の期待は完成前から住宅価格に織り込まれる", "title": "Anticipatory Effect and Heterogeneity of Urban Renewal on Housing Prices: Evidence from Future Community Projects in Hangzhou", "url": "https://doi.org/10.3390/buildings16204118", "authors": "Haizhen Wen ほか", "venue": "Buildings", "date": "2026-10-19", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr16", "rank": 16, "headline": "LLMの文脈選択をブラックウェル順序で整理", "title": "Context Selection as a Partial Order: A Blackwell Framework and Verified LLM Evidence", "url": "https://doi.org/10.3390/make8100336", "authors": "Andriy Bilous ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-10-19", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "LLMに与える文脈（情報源）の選択を、情報源の情報量の順序（ブラックウェル順序）とモデル固有の性能の順序に分ける枠組みを示し、両者のずれを統計的に検証可能にした（抄録）。", "p3": "最適な意思決定規則のもとでのブラックウェル順序とモデル固有の性能順序を区別し、情報源比較の有限標本の証明書を与えた。比較不能な情報源の間ですべての選好を保つ課題非依存の単一指標は存在しないことを示した（抄録）。", "p5": "6つのLLMで2組の情報源について双方向のLe Cam欠損の正の下界を95%同時信頼で得た。正しい情報を加えると成績が下がる例も検証された。HotpotQAとMuSiQueでは提案のリスト型再順位付けが完全な証拠を82%と80%の問題で取得し、比較手法の23〜47%と7〜32%を上回った（抄録）。", "fun": "「情報は多いほど良い」と思いがちですが、AIに正しい情報を追加したのに成績が下がることがあります。この論文は、情報源そのものの良さと、そのAIが使いこなせる良さは別物だと数学的に整理しました。どの資料が一番良いかを一つの点数で決めることは原理的にできない、という結論も興味深いところです。", "unverified": "6つのLLMの具体名は抄録からは確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "湿地公園の冷却効果と体感のずれをAIで測る", "title": "Decoding urban thermal well-being: bridging the gap between physical cooling and social perception in wetlands via AI-enhanced sensing", "url": "https://doi.org/10.1057/s41599-026-09466-0", "authors": "Guanwei Zhao ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-19", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "深圳の都市湿地公園で、衛星による物理的な冷却指標とLLMで読み取った来訪者の口コミの体感を結び、両者のずれを調べた（抄録）。", "p3": "Landsat由来の環境データと11,109件のオンライン口コミを組み合わせ、LLMで現地の暑さ・涼しさの感情を抽出して、景観指標との関係を分析した（抄録）。", "p5": "体感は物理指標に対して非線形で、景観の多様さ（PRD）は冷却効率と強く関連した。不透水面のパッチ密度が中程度だと「涼しい」知覚が高い「アクセスの逆説」があり、転換点は約32.3 n/ha、快適の転換点は地表面温度約28.8 °Cだった（抄録）。", "fun": "公園の涼しさは温度計で測れますが、人が感じる涼しさは別物です。この研究は口コミをAIで読み解き、舗装を少なくするほど良いという常識に反して、ほどよく道が通っている方が「涼しい」と感じられることを見つけました。涼しい場所までたどり着けることも、体感の一部だというわけです。", "unverified": "転換点の推定方法と頑健性は抄録からは確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "廃棄物リサイクルと租税回避の関係", "title": "Does Waste Recycling Affect Tax Avoidance? The Moderating Role of Executive Committee Gender Diversity", "url": "https://doi.org/10.1002/csr.71093", "authors": "Bilel Bzeouich ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-19", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "廃棄物リサイクルに取り組む企業ほど租税回避が少なく、その関係は経営委員会の性別多様性が高いと強まることを示した（抄録）。", "p3": "10か国921社の2010〜2024年の13,815企業年のパネルデータで、リサイクルと租税回避の関係と、経営委員会の性別多様性による調整効果を分析した（抄録）。", "p5": "リサイクルは租税回避と負に関連し、正統性理論と整合した。性別多様性が高いほどこの負の関係は強かった。ESG成績の高い企業ほど環境行動と攻撃的な税務を組み合わせにくかった（抄録）。", "fun": "環境に良いことをしている会社は、税金の面でもまじめなのでしょうか。それとも、環境活動で評判を稼ぎつつ、裏で節税に励んでいるのでしょうか。この研究は前者の傾向を見つけ、さらに経営陣に女性が多いほどその傾向が強いことを示しました。社会からの信頼を守ろうとする行動の一貫性が見えてきます。", "unverified": "因果関係の識別の工夫は抄録からは確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "LLMごとに倫理判断の推奨がばらつく", "title": "Variation in Medical Ethics Recommendations Across Large Language Models: Case-Based Audit Study", "url": "https://doi.org/10.2196/102713", "authors": "Yasuhito Mitsuyama ほか", "venue": "JMIR AI", "date": "2026-10-19", "sjr": 1.189, "citescore": 5.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "60の医療倫理のジレンマで5つのLLMの推奨の向き・確信度・安定性・一致度を監査し、モデル間で推奨がばらつくことを定量化した（抄録）。", "p3": "4領域60の独自の事例を作り、GPT-5、Claude Sonnet 4.5、Gemini 2.5 Pro、DeepSeek-R1、Llama-3-8Bに温度0で各3回答えさせ、事例でクラスタ化した一般化推定方程式で比べた（抄録）。", "p5": "900件中897件（99.7%）が有効な二値回答だった。「はい」の割合はDeepSeek-R1 44.4%、Claude 42.4%、GPT-5とGemini 38.9%、Llama-3-8B 16.7%で、全体のモデル効果は有意だった（P<.001）が、Holm補正後に有意なのはLlama-3-8Bを含む比較だけだった（抄録）。", "fun": "同じ難しい倫理的な相談を、違うAIにしたら違う答えが返ってくるかもしれません。この研究では、大手のAIどうしの差は意外に小さく、小さなモデルだけが「いいえ」と答えがちでした。どのAIに聞くかで医療現場の判断が変わりうるという問題を、数字で見える形にした点に意義があります。", "unverified": "モデル間一致度と再現の安定性の数値は抄録の途中までしか確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "重力ダムのSHMとデジタルツインを統合", "title": "An Integrated Structural Health Monitoring and Digital Twin Framework for Condition Assessment of Gravity Dams", "url": "https://doi.org/10.3390/vibration9040071", "authors": "Javier Maldonado ほか", "venue": "Vibration", "date": "2026-10-19", "citescore": 3.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "既設のコンクリート重力ダムについて、分散計測・信号処理・有限要素モデルの較正・劣化感度解析・可視化を一体化したデジタルツイン型のSHMの枠組みを示した（抄録）。", "p3": "ダムに沿って慣性センサを配置し、毎時の記録からFFT・パワースペクトル密度・ピークピッキングで固有振動数を同定した。ANSYSの3次元モデルを有効ヤング率と密度の反復更新で、振動数の相対誤差5%未満まで較正した（抄録）。", "p5": "傾斜計測による独立の検証では相対差0.74〜4.92%だった。較正済みのツインで剛性劣化を模擬して劣化・モード特性・変形の関係を作り、自動の状態評価と異常検知のしきい値に組み込んだ（抄録）。", "fun": "巨大なダムの「健康診断」を、振動のリズムから行う研究です。実際に測った揺れの周期と、コンピュータ上のダムの揺れが一致するように材料の硬さを調整すれば、そのコンピュータの中のダムで「もし劣化したら」を試せます。現物の双子をデジタルで作り、将来の異変に備えるという考え方です。", "unverified": "同定した固有振動数の値は抄録からは確認できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "分解と機械学習で橋の沈下を予測", "title": "Structural Health Inspection of Bridges Based on Optimal Decomposition and Machine Learning", "url": "https://doi.org/10.3390/buildings16204145", "authors": "Dawei Yin ほか", "venue": "Buildings", "date": "2026-10-19", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "橋の沈下の監視データを最適化した変分モード分解で成分に分け、成分ごとに最適な機械学習モデルで予測して足し合わせる枠組みを示した（抄録）。", "p3": "クジラ最適化アルゴリズムでVMDのパラメータを調整し（EVMD）、各固有モード関数にGRU、LSTM、BP、AdaBoost、KRR、SVRの中から最良の予測器を選んで、再構成した（抄録）。", "p5": "中国貴州省の蓮花橋の沈下監視データで決定係数R2 0.963を達成し、EMD、EEMD、通常のVMDに基づく枠組みを上回った（抄録）。", "fun": "橋の沈み込みのデータには、ゆっくりした傾向、季節の波、細かな揺らぎが混ざっています。この研究は、それを音を高音と低音に分けるように成分に分解し、それぞれに得意な予測方法を当てはめました。混ざった信号は分けてから考えるという、信号処理の基本の応用です。", "unverified": "予測期間と検証データの分け方は抄録からは確認できなかった。"}}, {"id": "jr22", "rank": 22, "headline": "温湿度の確率変動下のPC箱桁橋の応答", "title": "Probabilistic Response of Prestressed Concrete Box Girder Bridges under Stochastic Temperature–Humidity Environmental Conditions", "url": "https://doi.org/10.1061/jbenf2.beeng-8272", "authors": "Qingling Meng ほか", "venue": "Journal of Bridge Engineering", "date": "2026-10-19", "citescore": 7.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "確率的に変動する温度・湿度のもとで、張出し架設中のPC箱桁橋の力学的挙動がどう変化するかを解析する手法を示した（抄録）。", "p3": "コンクリート内部の温湿度連成解析と、温度応力・乾燥収縮・クリープ・弾性係数の感度を考える構成則を統合し、中国江西省の遠和大橋の架設過程に適用した（抄録）。", "p5": "約20年分の日次気象データから、温度・湿度・風速の分布が正規分布に従うことを確認し、確率的な環境要因がキャンバー、せん断遅れ、プレストレス損失に与える統計的影響を明らかにした（抄録）。", "fun": "橋を空中に少しずつ伸ばしていく工事では、気温や湿度でコンクリートが伸び縮みし、橋の高さがずれてしまいます。天気は毎日違うので、この研究は20年分の気象記録から天気を確率として扱い、橋の形がどれくらいばらつくかを予測しました。工事の精度を天気予報の考え方で守るという発想です。", "unverified": "影響の大きさの具体的な数値は抄録からは確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "セジェスタ神殿の振動を実測と数値で解析", "title": "An integrated experimental and numeric approach to investigate the structural dynamics of the Segesta Temple, Sicily", "url": "https://doi.org/10.1038/s40494-026-03028-y", "authors": "Arnaud Montabert ほか", "venue": "npj Heritage Science", "date": "2026-10-19", "sjr": 0.842, "citescore": 5.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "シチリアのセジェスタ神殿の動特性を、レーザースキャンと常時微動計測、有限要素モデルの較正で明らかにした（抄録）。", "p3": "予備的な数値モデルでセンサ配置を決め、12台の3成分地震計を63か所に移動して常時微動を計測し、運用モード解析（OMA）を行った（抄録）。", "p5": "12の全体モードと複数の局所モードを同定し、有限要素モデルを較正した結果、劣化と過去の補強による弾性特性の変化が明らかになった。遠地地震の記録で較正モデルを検証した（抄録）。", "fun": "2000年以上前の神殿を壊さずに調べるには、風や交通などで常に生じているごく小さな揺れを使います。揺れ方のパターンから、石材の硬さや過去の補修の影響まで読み取れるのです。遠くで起きた地震の揺れが、モデルの正しさを確かめる試験になったというのも面白い点です。", "unverified": "同定した振動数の値は抄録からは確認できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "非比例減衰構造の応答解析法を比較", "title": "A Comparative Study on Dynamic Response Analysis Methods for Seismically Isolated Structures with Non-Proportional Damping", "url": "https://doi.org/10.3390/buildings16204144", "authors": "Changsheng Wang ほか", "venue": "Buildings", "date": "2026-10-19", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "非比例減衰を持つ免震構造について5つの応答解析法を精度と計算効率で比較し、厳密な複素モード法が最も正確かつ効率的なことを示した（抄録）。", "p3": "2自由度の免震構造で、実空間の厳密分離、片方向連成のモード重ね合わせ、強制分離、1次摂動補正、複素モード法で地震応答の解析解を導き、自由度数を変えて計算時間を測った（抄録）。", "p5": "MATLAB環境の線形解析では複素モード法が精度と効率の両方で最良だった。実空間の厳密分離は約170自由度で強制分離と効率が逆転し、近似法の精度は免震層の減衰比とともに下がり、1次摂動補正が全範囲で最も精度が高かった（抄録）。", "fun": "計算を速くするには近似すればよい、と考えがちです。ところがこの研究では、厳密な方法の方が近似法より速いという意外な結果が出ました。計算時間を決めるのは式の簡単さではなく、関数を何回呼び出すかだったのです。道具の良し悪しは、実際に使う環境で測ってみないと分からないという教訓です。", "unverified": "効率の差の具体的な時間は抄録からは確認できなかった。"}}, {"id": "jr25", "rank": 25, "headline": "ベイズNNで波動データから損傷場を推定", "title": "Learning structural damage fields from time-domain wave propagation data with Bayesian neural networks", "url": "https://hal.science/hal-05805109v1", "authors": "Bernardo Feijo Junqueira ほか", "venue": "HAL (ART) Journal of the Brazilian Society of Mechanical Sciences and Engineering", "date": "2026-10-19", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "時間領域の波動伝播データから、ベイズニューラルネットワークで構造の損傷パラメータを不確実性つきで推定できることを示した（抄録）。", "p3": "スペクトル有限要素法で1次元弾性棒の波動を少数のセンサで模擬し、矩形の損傷場（位置・幅・大きさ）を推定する逆問題をベイズの枠組みで定式化した。検証・試験データには棒の物性の不確実性を入れ、モデル誤差を模擬した（抄録）。", "p5": "ベイズNNが損傷特性評価の代理逆モデルとして有効で、不確実性下での信頼できる損傷評価の可能性を示したとしている（抄録）。", "fun": "棒の一端をたたいて伝わる波を測れば、途中の傷の場所や大きさが分かるかもしれません。この研究のAIは、答えを一つだけ出すのではなく「傷はこのあたりに、この程度の確からしさで」と幅を持って答えます。材料の性質がよく分からないときでも、自信の度合いを示せるのが強みです。", "unverified": "推定誤差の数値は抄録からは確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "常時微動とベイズ最適化で橋梁モデルを更新", "title": "Sensitivity-driven model updating for bridge structures using operational modal analysis and enhanced batched Thompson sampling-based Bayesian optimization", "url": "https://doi.org/10.1016/j.ymssp.2026.115071", "authors": "Van Thu Huynh ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-10-19", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、運用モード解析で得た橋梁の振動特性を使い、感度に基づいてパラメータを絞り、改良したバッチ型トンプソン・サンプリングのベイズ最適化でモデルを更新する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「実際に揺れている橋の測定データに、コンピュータの橋のモデルをどう効率よく合わせるか」です。調整すべき値が多いと試行錯誤が膨大になるため、効きやすい値に絞り、賢く当たりをつけながら探す工夫が必要になります。", "unverified": "手法の詳細と検証対象の橋は確認できなかった。"}}, {"id": "jr27", "rank": 27, "headline": "Transformerで映像の微小振動を拡大し監視", "title": "Transformer-based video motion magnification for vision-driven structural health monitoring: Experimental validation on lab and full-scale structures", "url": "https://doi.org/10.1016/j.engstruct.2026.123958", "authors": "Marco A. Pérez ほか", "venue": "Engineering Structures", "date": "2026-10-19", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、Transformerによる映像の動き拡大を構造ヘルスモニタリングに使い、実験室と実構造物で検証した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「ビデオに映った目に見えないほど小さな揺れを、AIで拡大して構造物の振動を測れるか」です。センサを取り付けずにカメラだけで橋や建物の揺れを調べられれば、点検の手間を大きく減らせます。実物大の構造物で確かめたという点が題名から分かります。", "unverified": "拡大の手法、検証対象、精度は確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "時系列とグラフで製造業の財務困窮を早期警戒", "title": "A Temporal–Graph Fusion Framework for Financial Distress Early Warning in Advanced Manufacturing Enterprises", "url": "https://doi.org/10.68304/as/76416", "authors": "Siwei Wang", "venue": "Archives des sciences a multidisciplinary journal", "date": "2026-10-18", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "先端製造業の財務困窮を、財務指標の時間変化と企業間関係のネットワークを融合した深層学習で早期警戒する枠組みを提案した（抄録）。", "p3": "財務報告指標とリスク管理情報の2系統を入力とし、ゲート付き時間畳み込みで企業ごとの変化を、動的グラフ畳み込みで企業間のリスク伝播経路を表す。マクロ変数と環境間の正則化で分布のずれに対処し、SHAPで寄与を解釈した（抄録）。", "p5": "評価した比較モデルに対して、判別力、早期警戒性能、安定性で良好な結果を報告している（抄録）。", "fun": "会社の経営危機は、その会社の数字だけを見ていても見逃すことがあります。取引先が倒れれば、連鎖的に自分も危うくなるからです。この研究は、財務の時間変化と会社同士のつながりを同時に見ることで、危機の芽を早く見つけようとしています。", "unverified": "データの対象企業数と具体的な性能指標は抄録からは確認できなかった。掲載誌の性格も確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "ESG開示研究の内容分析を体系的に整理", "title": "Employing Content Analysis in ESG Research: A Systematic Review and Future Research Agenda", "url": "https://doi.org/10.1002/bse.71679", "authors": "Hamed Mohammad Esmail Mohammad ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-19", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "ESG開示研究での内容分析の使われ方を体系的にレビューし、方法論の枠組みと研究課題を示した（抄録）。", "p3": "PRISMAに沿ってABS 3・4・4*誌の査読論文170本を選び、計量書誌学的分析と主題分析で出版動向、方法、開示経路、新しい方向を整理した（抄録）。", "p5": "研究は増え方法も多様化した一方、計算的手法、開示経路、方法の標準化に重要な隙間があった。存在論-認識論-方法論（OEM）の統合枠組みと、TCCMに基づく8つの研究課題を示した（抄録）。", "fun": "企業の環境・社会への取り組みの報告書を、研究者は「何がどれだけ書かれているか」を数えて分析してきました。ところが数え方は研究ごとにばらばらで、結果を比べにくいのが実情です。このレビューは、数え方の選び方そのものが結論を左右することを整理し、AIなど計算的な読み方がまだ十分使われていないことも指摘しています。", "unverified": "8つの研究課題の内容は抄録からは確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "遠隔医療の提供形態と受診・遵守の関係", "title": "Technology-Mediated Services in Health Care: Evaluating Telehealth Delivery Models for Underserved Populations", "url": "https://doi.org/10.1287/isre.2024.1104", "authors": "Kyuyeon (Jenny) Rhee ほか", "venue": "Information Systems Research", "date": "2026-10-19", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "遠隔医療は単一の介入ではなく提供形態ごとに異なる経済的摩擦を取り除くとし、形態ごとに受診と手順遵守への効果が違うことを示した（抄録）。", "p3": "デジタル経済学の枠組みで、専門家仲介型と遠隔型の遠隔医療がそれぞれ探索・確認、交通、追跡、準備のどの費用を下げるかを理論化し、米国の地域保健センターの精神保健サービスのパネルデータで検証した（抄録）。", "p5": "専門家仲介型は特に臨床的な必要の大きい地域で受診を増やした。遠隔型は平均では受診を増やさないが、うつ病スクリーニングと追跡の手順遵守を高めた。効果は地域の費用環境で異なった（抄録）。", "fun": "オンライン診療は効く、効かないと研究結果が割れていました。この論文は、その理由を「オンライン診療と一口に言っても形がいろいろあるから」と説明します。専門家につなぐ形は病院探しの手間を減らし、自宅からつなぐ形は記録や手順を整える、というように、取り除く障害が違うのです。", "unverified": "効果の大きさの数値は抄録からは確認できなかった。"}}, {"id": "jr31", "rank": 31, "headline": "まとめ買い行動をイジングモデルで品揃え最適化", "title": "EXPRESS: Assortment Optimization Given Basket Shopping Behavior Using the Ising Model", "url": "https://doi.org/10.1177/10591478261502217", "authors": "Andrey Vasilyev ほか", "venue": "Production and Operations Management", "date": "2026-10-19", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "顧客がまとめ買いをする市場で、商品間の補完関係をイジングモデルで表し、品揃えを最適化する枠組みを示した（抄録）。", "p3": "購入バスケットに商品が入るかを二値変数とするイジングモデル（マルコフ確率場の特殊例）で、各商品の魅力と2商品間の需要の依存を表した。スピン形式の推定法を使い二値形式に変換した（抄録）。", "p5": "イジングモデルのもとの品揃え最適化はNP困難であることを示し、ヒューリスティックを提案した。焼きなまし法は全商品を並べる場合より期待利益を15%、売上順のヒューリスティックより約5%高めた（抄録）。", "fun": "磁石の小さな向きの並び方を説明する物理のモデルが、スーパーの品揃えに使われています。パンとバターのように一緒に買われる商品は、磁石が隣と同じ向きにそろうのに似ています。片方を棚から外すと、もう片方も売れなくなるかもしれない、という関係を物理の言葉で計算した点が面白いところです。", "unverified": "推定に使った実データの有無は抄録からは確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "SNSと通販サイトで口コミの感情が違う", "title": "Cross-media affective differences in online reviews: aspect-level evidence and a dual-pathway mechanism", "url": "https://doi.org/10.1108/apjml-03-2026-0567", "authors": "Lifeng Chen ほか", "venue": "Asia Pacific Journal of Marketing and Logistics", "date": "2026-10-18", "citescore": 9.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "SNSと通販サイトで口コミの感情が属性の水準で異なること、その背後に2つの動機の経路があることを示した（抄録）。", "p3": "LLMによる属性別の感情分析でTikTok、Bilibili、京東、蘇寧のスマートフォンの口コミ65,493件を数量化し、利用と満足の理論に基づく2×2の被験者間実験で仕組みを検証した（抄録）。", "p5": "SNSはより否定的で不均一、通販サイトは圧倒的に肯定的だった。SNSは自己高揚の動機で否定的な体験を否定的な口コミに変えやすく、通販サイトは経済的な動機で肯定的な体験を肯定的な口コミに変えやすかった（抄録）。", "fun": "同じスマホの感想でも、SNSでは辛口、通販サイトでは甘口になりがちです。SNSでは「鋭い批評をする自分」を見せたい気持ちが、通販サイトではポイントやお得の気持ちが働くからだ、とこの研究は説明します。口コミは製品の評価であると同時に、書く場所に合わせた自己表現でもあるのです。", "unverified": "実験の参加者数は抄録からは確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "解釈レベルの一致で貯蓄メッセージが効く", "title": "Matching Minds and Messages: The “Why” and “How” of Boosting Savings Through Construal Alignment", "url": "https://doi.org/10.1002/cb.70260", "authors": "Tathagata Ghosh ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-18", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "貯蓄を勧めるメッセージは、受け手の貯蓄志向と解釈レベル（「なぜ」か「どうやって」か）が合うと効果が高まることを示した（抄録）。", "p3": "解釈レベル理論にもとづき、貯蓄志向の高い人には具体的な「どうやって貯めるか」、低い人には抽象的な「なぜ貯めるか」が効くと仮説を立て、シナリオと実際の金融広告を使った3つの実験で検証した（抄録）。", "p5": "仮説は3つの実験で一貫して支持され、一致はメッセージの関連性、目標の重要性を順に高めて貯蓄意欲を上げた（抄録）。", "fun": "すでに貯金が習慣の人に「将来のために貯めよう」と言っても響きませんが、「この方法なら簡単」と言えば役立ちます。逆に、貯金に関心がない人にはまず「なぜ」を伝える方が効きます。同じ広告を全員に見せるより、相手に合わせて言い方を変える方がよいという、説得の基本を確かめた研究です。", "unverified": "各実験の効果の大きさは抄録からは確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "東京五輪で周辺農村は統治から取り残された", "title": "Mega-event governance beyond the host city: social capital and rural inclusion during the Tokyo 2020 Olympics", "url": "https://doi.org/10.1108/ijefm-08-2025-0129", "authors": "David N. Nguyen ほか", "venue": "International Journal of Event and Festival Management", "date": "2026-10-19", "citescore": 4.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "東京2020大会の会場近くにある東北の2つの温泉町を比較し、地理的に近くても大会の統治から取り残される「関係的な周縁化」を示した（抄録）。", "p3": "地元事業者と公的部門の関係者への22の半構造化インタビューによる比較埋め込み事例研究で、結束型・橋渡し型・連結型の関係と大会の統治構造の相互作用を分析し、コロナ禍を統治関係の負荷試験とみなした（抄録）。", "p5": "大会への近さは意味のある均等な参加を生まず、多くの関係者は計画への関与が限られ、制度へのアクセスは宿泊業など一部に集中した。コロナで機会が消えると事業者は個別に対応し、地域全体の協調した対応にはつながらなかった（抄録）。", "fun": "オリンピックの会場のすぐ近くに住んでいれば、何かしらの恩恵がありそうです。ところがこの研究では、地元の多くの人は計画に関われず、限られた人だけが行政とつながっていました。距離が近いことと、つながっていることは別だという指摘は、地域づくりのあり方を考えるヒントになります。", "unverified": "2つの町の名前と比較の詳細は抄録からは確認できなかった。"}}, {"id": "jr35", "rank": 35, "headline": "社会的つながりの変化で誰の食事が悪化するか", "title": "Whose Diet Suffers When Social Ties Change? Inter-Related Socioeconomic and Gender Inequalities in the Canadian Longitudinal Study on Aging Cohort", "url": "https://doi.org/10.3390/nu18203416", "authors": "Sanaz Mehranfar ほか", "venue": "Nutrients", "date": "2026-10-19", "sjr": 1.499, "citescore": 10.2, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "中高年の社会的つながりの変化と果物・野菜の摂取の関係が、社会経済的地位と性別でどう異なるかをカナダの縦断データで調べた（抄録）。", "p3": "カナダ加齢縦断研究の3波、45歳以上11,900人で、第1・2波の社会的孤立と社会参加の多様性の変化と、第1・3波の毎日の果物・野菜摂取を、性別・社会経済的地位別のランダム係数ロジスティック回帰で分析した（抄録）。", "p5": "所得による群差は女性の果物摂取の減少でのみ見られた。社会参加の多様性が低いままの高所得女性は野菜摂取が減るオッズが43%高く、高学歴の女性と男性ではそれぞれ31%と26%高かった（抄録）。", "fun": "人付き合いが減ると、食事も乱れがちになります。この研究は、その影響が誰に強く出るのかを調べ、意外にも所得や学歴の高い人で野菜を食べなくなる傾向が目立つ場面があることを示しました。人とのつながりが健康を支える仕組みは、経済的な豊かさだけでは補えないのかもしれません。", "unverified": "孤立の変化の効果の詳細は抄録の途中までしか確認できなかった。"}}, {"id": "jr36", "rank": 36, "headline": "近隣環境の認識と高齢者の身体活動", "title": "Perceived neighbourhood environment and accelerometer-measured moderate-to-vigorous physical activity among community-dwelling older adults in Hong Kong: a cross-sectional study", "url": "https://doi.org/10.1186/s12877-026-08517-0", "authors": "Alison Y T Ou ほか", "venue": "BMC Geriatrics", "date": "2026-10-17", "citescore": 6.7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "香港の地域在住高齢者で、近隣環境の認識と加速度計で測った中高強度の身体活動（MVPA）の関係を調べた（抄録）。", "p3": "2024年に60〜80歳の410人を割当抽出し、7領域の近隣環境の認識を聞き取り、ActiGraphで4日間の活動を測定して、対数リンクのガンマ一般化線形モデルで分析した（抄録）。", "p5": "平均年齢67.5歳、女性80.2%、MVPAの中央値は週283.5分。社会的結束（β=0.40）、景観の美しさ（0.32）、安全（0.30）、歩行環境の質（0.24）の認識が高いほどMVPAが多く（いずれもp<0.001）、健康的な食品の入手しやすさ、暴力、近所付き合いは有意でなかった（抄録）。", "fun": "高齢者がよく体を動かすかどうかは、本人のやる気だけでなく、住んでいる街の雰囲気にも左右されます。この研究では、近所の人とのまとまりや街並みの美しさ、安全さを感じている人ほど、実際によく動いていました。腕時計のような機器で活動量を客観的に測っている点が信頼性を高めています。", "unverified": "横断研究のため因果の向きは確定できない（抄録の範囲）。"}}, {"id": "jr37", "rank": 37, "headline": "社会関係資本と脆弱性が地域の回復力を決める", "title": "Social Capital and Vulnerability as Determinants of Social Resources in Community Resilience and Crisis Management: A Cross-Sectional Survey of Riyadh Residents, Saudi Arabia", "url": "https://doi.org/10.3390/su182010562", "authors": "Mohsen Alattas ほか", "venue": "Sustainability", "date": "2026-10-19", "citescore": 8.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "リヤドの住民調査で、結束型・橋渡し型の社会関係資本と社会的脆弱性が、地域の回復力の社会資源の次元と関連することを示した（抄録）。", "p3": "社会関係資本の理論とCutterらの社会的脆弱性の考え方を組み合わせ、リヤドの5地区405人の調査データを分析した（抄録）。", "p5": "結束型と橋渡し型の社会関係資本はいずれも回復力の社会資源の次元と関連し、脆弱性の指標によって回復力の水準が異なった（抄録）。", "fun": "災害や感染症などの危機を乗り越える力は、建物や制度だけでなく、人と人とのつながりにも宿っています。この研究は、仲間内の結びつきと、異なる集団をつなぐ橋渡しの両方が、地域の立ち直る力に関係していることを示しました。多様な部族が暮らす急成長都市での調査という点も興味深いところです。", "unverified": "関連の大きさの数値は抄録からは確認できなかった。"}}, {"id": "jr38", "rank": 38, "headline": "根拠のある合成ペルソナで小型LMを微調整", "title": "Grounded Synthetic Persona Conditioning for Fine-Tuning a Small Korean Language Model: A Preregistered Controlled Comparison with No-Persona and Ad Hoc Persona Data", "url": "https://doi.org/10.17548/ksaf.2026.09.30.193", "authors": "Howard Kim ほか", "venue": "The Korean Society of Science & Art", "date": "2026-10-19", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、根拠に基づいて作った合成ペルソナで韓国語の小型言語モデルを微調整し、ペルソナなし・場当たり的なペルソナのデータと事前登録の統制比較を行った研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「AIに人物像（ペルソナ）を与えて作った練習データは、根拠のある人物像にするとより良くなるのか」です。でたらめに作った人物像と、実在の分布などに基づく人物像で、学習したAIの質が変わるかを、あらかじめ計画を登録したうえで比べている点が題名から分かります。", "unverified": "ペルソナの作り方と評価結果は確認できなかった。"}}, {"id": "jr39", "rank": 39, "headline": "人が介在するLLM主題分析の再現可能な手順", "title": "Human-in-the-loop LLM-assisted thematic analysis: A validated, reproducible tutorial for large-scale qualitative research", "url": "https://doi.org/10.3758/s13428-026-03207-6", "authors": "Mandana Jafarian", "venue": "Behavior Research Methods", "date": "2026-10-19", "sjr": 2.382, "citescore": 8.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、人が介在するLLM支援の主題分析について、検証済みで再現可能な大規模質的研究の手順書（チュートリアル）を示す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「インタビューや自由記述を大量に読む質的研究を、AIに手伝わせても信頼できる結果を出せるか」です。AIに任せきりにせず、人が途中で確かめる仕組みを入れ、他の研究者が同じ手順でやり直せるようにする点が、題名の「検証済み」「再現可能」に表れています。", "unverified": "手順の内容と検証の方法は確認できなかった。"}}, {"id": "jr40", "rank": 40, "headline": "タンザニアのスマートシティは人間中心を掲げ技術主導", "title": "People-Centered Aspirations, Technocratic Implementation: Smart City Governance in Tanzania", "url": "https://doi.org/10.3390/smartcities9100178", "authors": "Gabriel Leopold Moshi ほか", "venue": "Smart Cities", "date": "2026-10-19", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "タンザニアのスマートシティの政策文書は人間中心の理念を掲げる一方、実施の仕組みは技術官僚主導であるという「統治の逆説」を示した（抄録）。", "p3": "国の政策、法令、地域・国際の枠組みを体系的スコーピングレビューと質的政策分析で調べ、技術官僚型、データ駆動型、協働型、人間中心型の4つの統治の型で優先事項、実施方法、政策の隙間を整理した（抄録）。", "p5": "文書は包摂、エンパワーメント、市民福祉など人間中心の目標を掲げるが、定める実施体制は主に技術官僚的で、協働型とデータ駆動型の手法は相対的に未発達だった（抄録）。", "fun": "「市民のための街づくり」をうたう計画でも、実際の進め方が専門家や役所だけで決まる仕組みなら、市民の声は届きません。この研究は、タンザニアの政策文書を丁寧に読み、目標と手段のずれを見つけました。立派な理念と実際の仕組みを分けて点検するという方法は、どの国の政策にも使えそうです。", "unverified": "分析した文書の数は抄録からは確認できなかった。"}}, {"id": "jr41", "rank": 41, "headline": "光ファイバ音響センシングで歩行者・自転車・車を識別", "title": "Physically Interpretable Spectral Features for Urban Mobility Classification Using Distributed Acoustic Sensing", "url": "https://doi.org/10.3390/smartcities9100176", "authors": "Haritz Iribas ほか", "venue": "Smart Cities", "date": "2026-10-19", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "歩道や道路の下にある既設の通信用光ファイバを分散音響センサとして使い、歩行者・自転車・自動車を物理的に解釈できる特徴で識別する枠組みを示した（抄録）。", "p3": "パルス圧縮を加えたコヒーレント光時間領域反射計で移動による振動を検出し、軌跡を自動抽出して、空間周波数領域の解析から荷重の周期性など4つの性質に基づく7つの特徴を作り、SVMで分類した（抄録）。", "p5": "実際の都市の既設ファイバでの計測で、手作業で確認した自転車・自動車・歩行者の軌跡に限ると、平衡正解率98.3%を達成した（抄録）。", "fun": "地面の下に埋まったインターネット用の光ファイバが、上を通る人や車の振動を「聞く」マイクになります。歩く人は一定の歩幅で地面をたたき、車はタイヤの回転で違うリズムを生むので、その違いから何が通ったかを見分けられるのです。新たにセンサを埋めずに街の動きを測れるという発想が面白いところです。", "unverified": "手作業で確認していない軌跡での性能は抄録からは確認できなかった。"}}, {"id": "jr42", "rank": 42, "headline": "AI書記の継続利用で記録負担と収益はどう変わるか", "title": "Longitudinal effects of ambient artificial intelligence scribe use on documentation burden and financial productivity in primary care: a quasi-experimental study", "url": "https://doi.org/10.1093/jamia/ocag151", "authors": "R J Waken ほか", "venue": "Journal of the American Medical Informatics Association", "date": "2026-10-18", "sjr": 1.87, "citescore": 11.7, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "プライマリケアでの環境型AI書記（診察の会話から記録を作るAI）の利用が、記録時間・時間外労働・診療報酬の生産性に与える長期的な効果を推定した（抄録）。", "p3": "36診療所の臨床医220人、314,845件の診察について、初回利用日の前後150日を比べる分断時系列の準実験設計で分析した（抄録）。", "p5": "記録時間は初日に7%減り、150日目には16%減った。150日目には夜間の作業時間が19%、時間外が13%減り、生産性（wRVU）は2%増えた。記録の長さは変わらなかった（抄録）。", "fun": "医師は診察よりも、そのあとの記録づくりに追われていると言われます。診察の会話を聞いてAIが記録を下書きすると、使い始めより半年後の方が効果が大きくなっていました。新しい道具は、使う人が仕事の流れの中で使い方を工夫するにつれて、本当の力を発揮するということが分かります。", "unverified": "比較対照群の有無は抄録からは確認できなかった。"}}, {"id": "jr43", "rank": 43, "headline": "つながらない権利法は従業員の声と幸福を高めるか", "title": "From Formal Rights to Capabilities: Employee Voice and Well-being under Right-to-Disconnect Legislation", "url": "https://doi.org/10.1177/00197939261491892", "authors": "Cherise Regier", "venue": "ILR Review", "date": "2026-10-19", "citescore": 7.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "欧州の「つながらない権利」法の導入後のwell-being改善が、職場で声を上げられる従業員に集中していたことを示した（抄録）。", "p3": "従業員の声を、形式上の権利を時間の実際の管理に変える「ケイパビリティ」として概念化し、テレワーク可能でつながらない権利の影響が大きい職業の欧州の労働者について差の差の設計で分析した（抄録）。", "p5": "法の導入後のwell-beingの改善は、従業員の声が大きい労働者に集中していた（抄録）。", "fun": "勤務時間外にメールに返事をしなくてよい、という権利が法律で認められても、職場でそれを言い出せなければ意味がありません。この研究は、法の効果が「声を上げられる人」にだけ届いていたことを示しました。ルールを作るだけでなく、それを使える力を誰が持っているかが大事だということです。", "unverified": "対象国、データ、効果の大きさは抄録からは確認できなかった。"}}, {"id": "jr44", "rank": 44, "headline": "職場の孤独がすべて有害とは限らない", "title": "Not all workplace loneliness is harmful: the mediating roles of wellbeing and job crafting in the relationship with employee performance", "url": "https://doi.org/10.3389/forgp.2026.1876048", "authors": "Orhan Balıkçı ほか", "venue": "Frontiers in Organizational Psychology", "date": "2026-10-19", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "職場の孤独を感情的孤独と社会的孤独に分け、前者は成果を下げるが後者はむしろ成果と正に関連することを示した（抄録）。", "p3": "会計・財務の専門職756人のデータで、2種類の孤独と成果の関係と、well-beingとジョブ・クラフティングの媒介を調べた（抄録）。", "p5": "感情的孤独は成果に有意な負の効果を持ち、well-beingとジョブ・クラフティングが完全に媒介した。社会的孤独は成果と正に関連し、両者が部分的に媒介した（抄録）。", "fun": "職場で孤独を感じるのは悪いこと、と思われがちです。でもこの研究は、心が通う相手がいない「感情的な孤独」と、単に人と話す機会が少ない「社会的な孤独」を分けました。後者はむしろ仕事に集中できて成果が上がる場合があるという結果は、孤独にも種類があることを教えてくれます。", "unverified": "調査の設計（横断か縦断か）は抄録からは確認できなかった。"}}, {"id": "jr45", "rank": 45, "headline": "DEMで生物固化砂のセメント構造の効果を比較", "title": "Effects of Cementation Fabric on the Mechanical Behaviour of Bio‐Cemented Sands: Two Cementing Approaches in DEM Simulations", "url": "https://doi.org/10.1002/nag.70462", "authors": "Aoxi Zhang ほか", "venue": "International Journal for Numerical and Analytical Methods in Geomechanics", "date": "2026-10-19", "sjr": 0.995, "citescore": 5.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "微生物による固化砂のセメント結合の向きの分布（セメンテーション・ファブリック）が力学挙動に与える影響を、個別要素法で体系的に調べた（抄録）。", "p3": "仮想結合法と粘着性細粒子法という2つのDEMのセメント化手法を同じ枠組みで初めて定量比較し、同じセメント量で4つの主方向を持つ供試体を作って載荷した（抄録）。", "p5": "セメントの主方向が載荷方向に垂直だと強度増加が最大、平行だと最小だった。2手法は巨視的な挙動では一致したが、配位数やファブリック異方性などの微視的変数は大きく異なった（抄録）。", "fun": "微生物の力で砂粒どうしを石灰で固める技術があります。この研究は、粒と粒をつなぐ「のり」の向きが、押す方向とどう交わるかで砂の強さが変わることをコンピュータで確かめました。さらに、全体の強さは同じでも、粒の世界の見え方は計算方法によって違うという点は、模型の選び方への注意を促しています。", "unverified": "強度増加の数値は抄録からは確認できなかった。"}}, {"id": "jr46", "rank": 46, "headline": "位相空間での半古典的確率動力学の理論", "title": "Random theory for a guiding center gas: Semiclassical stochastic dynamics in phase space and non-Hermitian many-body problem", "url": "https://doi.org/10.1103/9bdt-k13z", "authors": "Hiroshi Kuratsuji ほか", "venue": "Physical Review E", "date": "2026-10-19", "citescore": 4.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、案内中心の気体（磁場中の荷電粒子の旋回中心の集団）について、位相空間での半古典的な確率動力学と非エルミートな多体問題として扱う乱雑理論を示す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「たくさんの粒子の位置と速さの分布が時間とともにどう変わるかを、確率の言葉でどう書くか」です。粒子一つ一つを追う代わりに、位置と速度の空間（位相空間）の中の分布の動きとして扱う考え方は、物理の多くの分野で使われる強力な見方です。", "unverified": "モデルの内容と結果は確認できなかった。"}}, {"id": "jr47", "rank": 47, "headline": "希薄粒状気体のリーマン問題の保存的解析解", "title": "A conservative analytical solution of the shock–contact–shock Riemann problem for dilute granular gas", "url": "https://doi.org/10.1016/j.ijmultiphaseflow.2026.105953", "authors": "Yahia M. Fouda", "venue": "International Journal of Multiphase Flow", "date": "2026-10-19", "citescore": 7.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、希薄な粒状気体について、衝撃波-接触不連続-衝撃波の構造を持つリーマン問題の保存的な解析解を導く論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「まばらに飛び交う砂粒の集まりを気体のように扱ったとき、二つの状態がぶつかった瞬間からどんな波が生まれるか」です。粒どうしの衝突でエネルギーが失われる点が普通の気体と違い、その中でも保存則を守る厳密な答えを求めることが、数値計算の検証の基準になります。", "unverified": "解の導出方法と結果は確認できなかった。"}}, {"id": "jr48", "rank": 48, "headline": "移流支配問題の学習型縮約モデルは正則化が鍵", "title": "Regularization Matters for the Stability of Learning-Based Projection Methods in Reduced-Order Models for Advection-Dominated Problems", "url": "https://doi.org/10.1016/j.jcp.2026.115496", "authors": "Ali Pirmohammadi ほか", "venue": "Journal of Computational Physics", "date": "2026-10-19", "sjr": 1.552, "citescore": 7.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "移流が支配的なPDEの射影型縮約モデル（ROM）で、ニューラルネットで学習する局所基底を正則化してほぼ正規直交に保ち、安定性と精度を保証する方法Reg-LPを提案した（抄録）。", "p3": "時間とパラメータに依存する局所基底をニューラルネットで学習し、正則化した損失関数で基底がほぼ正規直交になるよう訓練する。これがオンライン計算の精度と安定性を保証することを解析的に示した（抄録）。", "p5": "非粘性バーガース方程式で、ほぼ振動のない解を得て、最近の学習型射影法より少なくとも1桁精度が改善し、訓練で見ていない空間離散化でも頑健だった（抄録）。", "fun": "波が形を保ったまま流れていくような現象は、少数の固定した型の重ね合わせで表すのが苦手で、縮めたモデルが不安定になりがちです。この研究は、時間とともに変わる型をAIに学ばせ、その型がお互いに重ならないよう「しつけ」をすることで、計算を安定させました。", "unverified": "他の方程式への適用は抄録からは確認できなかった。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "統計学", "headline": "100万件の集合予測は概ね較正されていた", "title": "Calibration, accuracy, and domain variation across one million collective forecasts from prediction platforms", "url": "https://doi.org/10.1073/pnas.2615627123", "authors": "Justin Dickerson ほか", "venue": "Proceedings of the National Academy 6-02605-2", "authors": "Yue Xu ほか", "venue": "Nature Human Behaviour", "date": "2026-10-19", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "研究者が与える形容詞に頼らない課題で、人が顔から読み取る特性判断の構造を調べ直した。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "条件付き承認と寛容な承認の経済学", "title": "Conditional and Lenient Drug Approvals", "url": "https://doi.org/10.1287/mnsc.2025.03836", "authors": "Chenxi Xu ほか", "venue": "Management Science", "date": "2026-10-19", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "予備的な有効性の証拠で販売を認め確認試験を条件とする承認制度の性質を理論的に特徴づけた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "予備的な有効性の証拠で販売を認め確認試験を条件とする医薬品承認の最適な制度を、企業の誘因を考慮して理論的に特徴づけた（抄録）。", "p3": "企業が試験費用について私的情報を持ち、政府の利得が薬の期待有効性に依存するモデルで、消費者厚生を最大化する承認政策を導き、較正した（抄録）。", "p5": "最適政策には、期待有効性の低い薬への部分的な条件付き承認と、従来の基準を下回る場合の寛容な最終承認が含まれうる。較正によれば、これらの手段は年間数億ドルの社会的価値を生みうる（抄録）。", "fun": "新しい薬を早く患者に届けたい一方で、効かない薬を承認するのは避けたいものです。この論文は、「とりあえず条件付きで認め、後で確かめる」や「基準に少し届かなくても認める」といった柔軟な制度が、うまく設計すれば社会全体の得になることを示しました。厳格さと柔軟さのバランスを数学で探る研究です。", "unverified": "較正に用いたデータの詳細は抄録からは確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "総合誌の成果", "headline": "既存の送電網を活かして再エネと蓄電を急拡大", "title": "Leveraging existing grid infrastructure for rapid US renewable and storage deployment", "url": "https://doi.org/10.1073/pnas.2603919123", "authors": "Emilia Chojkiewicz ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "系統接続の遅れと供給制約のもとで、既存の電力網インフラを使った再エネ・蓄電の迅速な導入の可能性を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "既存の発電所の余った系統接続容量を使い、同じ場所に再エネと蓄電を追加して急速に導入する戦略の潜在量を米国全体で評価した（抄録）。", "p3": "衛星画像で米国の化石燃料と再エネの発電所3,890か所の周辺の太陽光・風力の潜在量を評価し、各地点の既存の接続容量を超えない範囲で経済性を検討した（抄録）。", "p5": "2030年までに既存の化石燃料発電所に最大597 GWの経済的な太陽光・風力を、既存の再エネ発電所に蓄電と組み合わせた260 GWの確実な容量を追加できる。実現には規制改革と運用制約の調整が必要とする（抄録）。", "fun": "新しい発電所を作っても、送電網につなぐ順番待ちで何年も動かせないことがあります。そこで、すでに送電網につながっている発電所の「空き容量」に目をつけ、その敷地の近くに太陽光や風力を足すという発想です。新しい道路を作る代わりに、空いている車線を使うような知恵です。", "unverified": "経済性の判定条件は抄録からは確認できなかった。"}}, {"id": "jn18", "rank": 18, "field": "総合誌の成果", "headline": "国境をまたぐ帯水層の地下水利用と枯渇の地理", "title": "Geography of groundwater use and depletion in internationally shared aquifers", "url": "https://doi.org/10.1073/pnas.2619357123", "authors": "Marc F. Müller ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "国際共有帯水層での地下水利用と枯渇の分布を示し、協調の枠組みが乏しい現状を明らかにした。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "国境をまたぐ帯水層で、地下水の利用と枯渇が国境の近くに集中していることを、世界の全426の共有帯水層で示した（抄録）。", "p3": "約116,000本の井戸の観測と全球の灌漑データを組み合わせ、共有帯水層と国内の同様の帯水層を比べ、国境からの距離に対する分布を分析した（抄録）。", "p5": "共有帯水層で平均的に枯渇が大きい証拠はなかったが、枯渇は国境に向かって強く集中し、帯水層ごとの差も大きかった。灌漑も国境寄りで集約的で、国境河川を考慮しても地下水による灌漑は国境に近かった（抄録）。", "fun": "地下水は国境を気にせず流れています。もし国境のすぐそばで汲み上げれば、隣の国の水も減らしてしまうかもしれません。この研究は、世界の国際共有の地下水で、まさに国境付近に汲み上げが集中していることを示しました。見えない水をめぐる国際協力の必要性が、データで浮かび上がります。", "unverified": "類型ごとの具体例は抄録の途中までしか確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "総合誌の成果", "headline": "スマート農業の世界的な潜在効果をモデル化", "title": "Modeling the global potential of smart farming innovations", "url": "https://doi.org/10.1073/pnas.2530081123", "authors": "Shahrear Roman ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "スマート農業技術の生産性・環境面の効果を導入条件とあわせて世界規模でモデル化した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "スマート農業技術の収益性を約5 kmの解像度で全球的に評価し、普及の可能性と環境問題との重なりを地図化した（抄録）。", "p3": "精密農業の施用マップ、自動施用、自律除草機、GPS操舵補助、自律灌漑について、調査（2,677件）とメタ分析（1,745件）から計4,422の導入地点のデータを作り、リモートセンシングと統計データで5種類の地理空間機械学習モデルのアンサンブルを訓練した（抄録）。", "p5": "各技術の収益性の世界分布と、技術が緩和しうる主要な環境問題との重なりを示した（抄録）。", "fun": "ドローンや自動運転トラクターなどのスマート農業は、どこでも儲かるわけではありません。農家にとって割に合わなければ広まらないからです。この研究は、世界中の畑のどこで、どの技術が採算に合うかを地図にしました。技術の良し悪しだけでなく、使う人の損得から普及を考える視点が大切です。", "unverified": "シミュレーション部分の結果は抄録の途中までしか確認できなかった。"}}, {"id": "jn20", "rank": 20, "field": "ヒューマンコンピュータインタラクション", "headline": "摩擦発電の電子皮膚で声を出さない発話を読み取る", "title": "Triboelectric E-Skin Patch Decoding Silent Speech for Advanced Human–Machine Interaction and Augmented Virtual Communication", "url": "https://doi.org/10.1007/s40820-026-02346-x", "authors": "Ziwei Huo ほか", "venue": "Nano-Micro Letters", "date": "2026-10-19", "sjr": 8.402, "citescore": 58.9, "citescore_year": "2025", "why": "摩擦帯電式の皮膚パッチで無声発話を解読し、人と機械の新しい対話手段を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "自己発電で安価な摩擦帯電式の電子皮膚パッチとCNNで、声を出さない発話（読唇）を解読するシステムを作った（抄録）。", "p3": "電子皮膚パッチの構造原理と電気特性を評価し、発声時と無声時の唇の動きの時間周波数特性の一致を確認したうえで、15の語彙カテゴリ（各200サンプル）で多層CNNを訓練した（抄録）。", "p5": "正解率98.75%を達成し、リアルタイムの読唇の可視化、口の動きで操作するゲーム、アバターと対話するVRコミュニケーション基盤の3つの応用を作った（抄録）。", "fun": "声を出せない人でも、口を動かすだけで言葉が伝わればコミュニケーションの幅が大きく広がります。この研究は、肌に貼るシールのような薄い装置が、口の動きでこすれて生じる静電気を電源兼センサとして使う点が面白いところです。冬に服がパチパチするのと同じ原理が、新しい会話の道具になっています。", "unverified": "語彙が15カテゴリに限られ、より大きな語彙での性能は確認できなかった。"}}, {"id": "jn21", "rank": 21, "field": "交通・都市計画", "headline": "電化鉄道を機械式の蓄電設備に転用する", "title": "Transforming electrified railway into mechanical energy storage for electricity system decarbonization", "url": "https://doi.org/10.1038/s41467-026-78711-6", "authors": "Can Wan ほか", "venue": "Nature Communications", "date": "2026-10-19", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "why": "既存の電化鉄道を大規模な機械的エネルギー貯蔵として使う構想を評価し、専用蓄電設備の建設負担を減らす道を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "列車の運行を調整することで、電化鉄道を機械的なエネルギー貯蔵として使えることを示し、その世界的な潜在量と価値を推定した（抄録）。", "p3": "326,034回の駅間の列車運行を分析し、牽引と回生ブレーキによる電力系統とのエネルギーのやりとりを貯蔵として使う方式を評価し、中国・欧州・インドの容量拡張モデルに組み込んだ（抄録）。", "p5": "世界の潜在量は2025年に190 GW、2050年に315〜579 GW。従来の蓄電への投資を11.9〜20.0%減らし、世界で年146億〜351億ドルの価値に相当し、総費用を増やさずに運用CO2を年9,430万〜2億5,890万トン減らしうる（抄録）。", "fun": "電車は坂を上るときに電気を使い、ブレーキをかけるときに電気を作ります。つまり、走る電車そのものが巨大な電池のように振る舞えるのです。この研究は、ダイヤを少し工夫するだけで、新しい蓄電設備を作らずに再エネの電気をためられることを示しました。既存のインフラに新しい役割を見つける発想が見事です。", "unverified": "運行の調整が乗客サービスに与える影響は抄録からは確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "農業販売協同組合の市場と厚生への効果", "title": "Market and welfare effects of marketing cooperatives in spatial procurement markets", "url": "https://doi.org/10.1002/ajae.70102", "authors": "Alecia Evans ほか", "venue": "American Journal of Agricultural Economics", "date": "2026-10-19", "sjr": 2.087, "citescore": 9.8, "citescore_year": "2025", "why": "空間的な調達市場での農業協同組合の市場効果と厚生効果を分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "空間的な農産物の調達市場で、農業販売協同組合の参入の厚生効果が、競合企業の戦略的な柔軟性によって弱まることを示した（抄録）。", "p3": "空間的な価格差別と立地の内生的な選択という2つの戦略的余地の有無で4つの環境を定め、投資家所有企業だけの市場と協同組合が混在する市場を反実仮想の枠組みで比較した（抄録）。", "p5": "戦略的柔軟性は特に輸送費が低〜中程度のとき協同組合の参入による厚生の改善を弱めた。柔軟性が企業だけの市場の効率を高め、協同組合の改善の余地を減らすためで、両者は部分的に代替的な仕組みだった（抄録）。", "fun": "農家が少数の買い手に安く買いたたかれないよう、協同組合を作って対抗するのはよく知られた方法です。ところがこの研究は、買い手の企業が場所や価格を柔軟に変えられる場合、市場はすでにそこそこ効率的になっていて、協同組合の出番が減ることを示しました。制度の効果は周りのプレーヤーの動き方次第です。", "unverified": "モデルの較正対象の作物・地域は抄録からは確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "リスクを上に伝えると責められる：公共事業の管理", "title": "Balancing risk communication and accountability concerns in risk management: A study of major public project investments", "url": "https://doi.org/10.1093/jopart/muag031", "authors": "Sof Thrane ほか", "venue": "Journal of Public Administration Research and Theory", "date": "2026-10-19", "sjr": 3.301, "citescore": 11.0, "citescore_year": "2025", "why": "公共事業の管理者がリスクの伝達と非難回避の間で板挟みになる過程を調べた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "公共事業の管理者がリスクの報告と非難の回避の間で板挟みになる過程を、デンマーク国防の大規模事業のリスク報告から動的モデルとして示した（抄録）。", "p3": "2つの大規模な調達・保守事業に関する7年間の130件のリスク報告を、アブダクティブな質的手法で分析した（抄録）。", "p5": "リスク管理は、業務上の懸念、組織の問題化、非難と責任の割り当て、緩和と対応の4段階からなり、リスクと説明責任の伝達は相互依存していた。現場は本当に必要なときだけ報告する圧力を受け、上位の管理者は政治的な露出を避けて対応を遅らせがちだった（抄録）。", "fun": "現場が早めに「危ないかもしれません」と報告すれば、問題は小さいうちに対処できます。でも報告すると「なぜ防げなかったのか」と責められるかもしれません。この研究は、その恐れが報告を遅らせ、上の人も政治的な批判を恐れて動かない悪循環を、実際の報告書から描き出しました。", "unverified": "事業の具体的な成果への影響は抄録の途中までしか確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "経済学", "headline": "メキシコから米国への移民の20年の変化", "title": "Two Decades of Change in Mexico–U.S. Migration, 2005–2025", "url": "https://doi.org/10.1111/padr.70093", "authors": "Andrés Villarreal", "venue": "Population and Development Review", "date": "2026-10-19", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "最大規模だったメキシコ-米国移民の2005〜2025年の劇的な変化を整理した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "2005〜2025年のメキシコと米国の間の双方向の移民の流れを、人口学的な下位集団別に更新した（抄録）。", "p3": "メキシコの四半期の雇用調査のデータを使い、米国への移住とメキシコへの帰還の率を推計した（抄録）。", "p5": "2000年代後半の急減の後、米国への移住は10年以上低く、近年わずかに増えただけだった。帰還移住の率も2010年代半ばまで急減して低いままで、帰還の減少が長く続いたため2010年以降は純流出が増えた。最近の変化は、以前の減少を米国の移民労働需要の低下に帰す説明と整合しない（抄録）。", "fun": "かつて世界最大の人の流れだったメキシコから米国への移住は、ここ20年で大きく様変わりしました。行く人が減っただけでなく、帰る人も減ったため、差し引きではむしろ流出が増えていたという結果は意外です。移民を「出ていく人」だけでなく「戻る人」と合わせて見ることの大切さが分かります。", "unverified": "下位集団ごとの違いの詳細は抄録からは確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "政治学", "headline": "誰を黒人とみなすかは政治的手がかりで変わる", "title": "The Politics of Black Classification: Sociopolitical Cues and Racial Perception", "url": "https://doi.org/10.1017/s1537592726105787", "authors": "Lauren D. Davenport ほか", "venue": "Perspectives on Politics", "date": "2026-10-19", "sjr": 2.923, "citescore": 9.4, "citescore_year": "2025", "why": "政治的・社会的な手がかりが人種の知覚と分類に影響することを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "米国で人を「黒人」とみなす判断に、親や肌の色だけでなく、支持政党や住む地域などの社会政治的な手がかりも影響することを示した（抄録）。", "p3": "黒人、白人、黒人と白人の混血を含む人種的に多様な標本でコンジョイント実験を行い、生得的な特徴と後天的な特徴が黒人らしさの知覚に与える影響を評価した（抄録）。", "p5": "親と肌の色が最も強い決定要因だったが、党派性、近隣の文脈、配偶者の人種も分類に影響した。人々は二値ではなく程度として黒人らしさを判断していた（抄録）。", "fun": "人種は生まれつき決まっている、と多くの人は考えます。ところがこの実験では、同じ見た目でも、どの政党を支持しているか、どこに住んでいるか、誰と結婚しているかで「どれくらい黒人か」の判断が変わりました。人種が社会の中で作られる部分を持つことを、数字で示した研究です。", "unverified": "回答者の人種による判断の違いの詳細は抄録の途中までしか確認できなかった。"}}, {"id": "jn26", "rank": 26, "field": "総合誌の成果", "headline": "地下水貯留変動を1kmの解像度に高精細化", "title": "High-resolution global groundwater storage anomalies: a 1 km downscaled dataset", "url": "https://doi.org/10.5194/essd-18-7593-2026", "authors": "Chen Zhang ほか", "venue": "Earth System Science Data", "date": "2026-10-19", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "GRACE観測の粗い地下水貯留異常を1km解像度に降尺した全球データセットを公開した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "GRACE衛星の粗い地下水貯留量の異常を、機械学習で1 km・月次の全球データセット（2002年4月〜2020年12月）に高解像度化した（抄録）。", "p3": "特異スペクトル解析で時間の欠測を補い、19の高解像度の水文気候・地球物理の説明変数を使って、帯水層で層別した機械学習（XGBoostとDNNを比較しXGBoostを採用）で降尺した（抄録）。", "p5": "GRACEの元の尺度に集計すると元のデータとよく一致した（R2=0.972、RMSE=2.10 cm）。世界の152,069本の観測井と1度ブロックの較正・検証の設計で独立に評価した（抄録）。", "fun": "地下水の量は、重力のわずかな変化を測る衛星で宇宙から推定できますが、その解像度は数百kmと粗く、町単位の様子は分かりません。この研究は、地形や気候の細かなデータを手がかりに、AIでその絵を1 kmまで細かく描き直しました。ぼやけた写真を、他の情報を使って鮮明にするような作業です。", "unverified": "観測井との比較の精度の数値は抄録の途中までしか確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "黒人会計学教員は制度の壁をどう乗り越えるか", "title": "How Black Accounting Faculty Exercise Agency to Navigate Career Advancement within Institutional Structures", "url": "https://doi.org/10.2308/tar-2024-0836", "authors": "Michelle K. Harding ほか", "venue": "The Accounting Review", "date": "2026-10-19", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "終身在職権を得た黒人会計学教員の経験を質的に調べ、制度構造の中での主体的な昇進の戦略を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "終身在職権を得た黒人会計学教員が、制度構造の中での周縁化と社会的アイデンティティへの脅威にどう対処し、昇進を進めているかを質的に明らかにした（抄録）。", "p3": "質的な手法で、黒人会計学教員の経験と、組織構造に埋め込まれた周縁化への対処を分析した（抄録）。", "p5": "教員は主体的で自己防衛的な対処でアイデンティティを確かめ昇進を交渉するが、こうした対処は個人には有効でも制度構造を変えず、反発を招いて周縁化を再生産しうる。客観性と中立性のもとで努力が昇進を生むという前提に疑問を投げかけた（抄録）。", "fun": "大学の昇進は、論文や授業の成果で公平に決まるはずだと考えられています。しかしこの研究は、黒人の会計学教員が、見えにくい壁や余分な苦労を抱えながら道を切り開いていることを描きました。個人の工夫だけでは仕組みは変わらないという指摘は、組織のあり方を問い直すものです。", "unverified": "調査対象者の人数と方法の詳細は抄録からは確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "経済学", "headline": "投票権法の弱体化と住宅ローン市場への参加", "title": "Political Voice and (Mortgage) Market Participation: Evidence from the dilution of Voting Rights Act", "url": "https://doi.org/10.1016/j.jfineco.2026.104387", "authors": "Seongjin Park ほか", "venue": "Journal of Financial Economics", "date": "2026-10-19", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "投票権法による保護の弱まりという政治的発言力の変化が、住宅ローン市場への参加に与えた影響を扱う。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "投票権法の保護を弱めた最高裁判決（Shelby v. Holder）を外生的なショックとして、政治的発言力の低下が黒人の住宅購入を減らしたことを示した（抄録）。", "p3": "判決で投票権が実質的に弱められた対象郡の黒人を対象に、住宅ローンの申請の変化を分析し、個人レベルの調査データで政府と金融機関への信頼の役割を調べた（抄録）。", "p5": "事実上の選挙権の弱体化の後、住宅ローン申請が減り住宅を買う黒人が減った。申請者の間では黒人系の貸し手への移行が見られ、政府と金融機関への信頼がこれらの効果を動かしていた（抄録）。", "fun": "選挙で声を上げにくくなることが、家を買うかどうかという暮らしの決断にまで影響していました。政治への信頼が失われると、銀行など社会の仕組み全体への信頼も揺らぎ、大きな買い物を控えるようになるのかもしれません。投票権が経済活動の土台でもあることを示す研究です。", "unverified": "効果の大きさの数値は抄録からは確認できなかった。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "推論型LLMの理解と監視可能性に向けて", "title": "Towards understanding and monitorability of reasoning LLMs", "url": "https://doi.org/10.1038/s42256-026-01333-6", "venue": "Nature Machine Intelligence", "date": "2026-10-19", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "why": "推論型の大規模言語モデルの内部の理解と監視可能性という、安全性の中心課題を扱う。", "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、推論型の大規模言語モデルの内部の理解と、その推論過程を監視できるかどうか（監視可能性）を扱う論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「答えを出す前に長く『考える』AIの、その考えの中身を人間が読み取り、危ない方向に進んでいないか見張ることができるか」です。AIが賢くなるほど、結果だけでなく考える過程を確かめる仕組みが安全のために重要になります。", "unverified": "論文の種類（研究論文か展望か）と内容は確認できなかった。"}}, {"id": "jn30", "rank": 30, "field": "機械学習", "headline": "スコア関数でGANの勾配の教師信号を補正", "title": "Rectifying GAN Gradient Supervision Via Score Functions", "url": "https://doi.org/10.1109/tpami.2026.3744834", "authors": "Mengfei Xia ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-19", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "生成モデルの学習で、スコア関数を用いてGANの勾配の教師信号を修正する方法を扱う。", "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、敵対的生成ネットワーク（GAN）の生成器に与える勾配の教師信号を、スコア関数（確率密度の対数の勾配）を使って補正する方法を示す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「偽物を作るAIと見破るAIを競わせる学習で、作る側への『こう直せ』という指示をもっと正確にできないか」です。拡散モデルで使われるスコア関数の考え方をGANに持ち込む点が、二つの生成モデルの流れをつなぐ発想として読み取れます。", "unverified": "手法と実験結果は確認できなかった。"}}, {"id": "jn31", "rank": 31, "field": "機械学習", "headline": "条件付き潜在表現の生成的参照による画像圧縮", "title": "Learned Image Coding With Generative Reference of Conditional Latents", "url": "https://doi.org/10.1109/tpami.2026.3744812", "authors": "Siqi Wu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-19", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "学習型画像符号化に生成的な参照を組み込む方法を扱う。", "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、学習型の画像圧縮で、条件付き潜在表現の生成的な参照を用いて符号化の効率を高める方法を示す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「画像を小さなデータに圧縮するとき、AIが『だいたいこんな画像だろう』と予想できる部分を参照に使えば、送る情報を減らせるのではないか」です。予想できる部分は送らず、予想と違う部分だけ送るのは、圧縮の基本的な考え方の延長です。", "unverified": "手法と実験結果は確認できなかった。"}}, {"id": "jn32", "rank": 32, "field": "機械学習", "headline": "多様な動的表現で指示された複数物体を追跡", "title": "Referring Multi-Object Tracking with Diverse Dynamic Expressions", "url": "https://doi.org/10.1109/tpami.2026.3745142", "authors": "Yani Zhang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-19", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "自然言語の指示で対象を指定する複数物体追跡を、動的な表現まで扱えるよう拡張する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を読んだ", "preprint": false, "short": true, "p1": "自然言語の指示で対象を指定して複数物体を追跡するタスクを、物体の数や時間的な状態の変化まで表現できるよう拡張し、ベンチマークと手法を示した（抄録）。", "p3": "半自動のラベリングで9,758の言語プロンプトを持つベンチマークRefer-KITTI-V2を作り、各物体をTransformerのクエリとして表し過去フレームや他の物体との長期の時空間相互作用で更新する時間強化モジュールを持つTempRMOTを提案した（抄録）。", "p5": "TempRMOTはRefer-KITTIとRefer-KITTI-V2の両方で最高性能を達成したとしている（抄録）。", "fun": "「左から来て止まった赤い車を全部追って」のように、言葉で指示して動画の中の物を追いかけるAIの研究です。数や時間とともに変わる様子まで言葉で指定できるようにした点が新しく、ラベル付けの手間を減らす工夫で大量の例文を用意しました。言葉と映像をつなぐ技術の一歩です。", "unverified": "性能指標の具体的な数値は抄録からは確認できなかった。"}}, {"id": "jn33", "rank": 33, "field": "交通・都市計画", "headline": "複合災害に備える地域横断の交通緊急ネットワーク", "title": "Cross-regional coordination of comprehensive transportation emergency networks: A multi-disaster perspective", "url": "https://doi.org/10.1016/j.tra.2026.105315", "authors": "Cuiping Ren ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-15", "citescore": 12.1, "citescore_year": "2025", "why": "複数の災害を想定した総合交通の緊急ネットワークの地域間協調を扱う。", "explain": {"basis": "題名", "basis_note": "抄録・本文は入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、複数の災害を想定して、総合交通の緊急ネットワークを地域間でどう協調させるかを扱う論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「地震や洪水などが重なって起きたとき、県や地域をまたいで道路・鉄道・空路をどう組み合わせて救援を届けるか」です。一つの災害だけを想定した計画では、別の災害で通れない道が出てきます。複数の災害を同時に考える点が題名から分かります。", "unverified": "モデルと分析対象の地域は確認できなかった。"}}, {"id": "jn34", "rank": 34, "field": "交通・都市計画", "headline": "協調知覚下の自転車安全を遮蔽モデルで政策評価", "title": "Simulation-based policy evaluation for bicycle safety under cooperative perception: Linking occlusion modeling to detection performance", "url": "https://doi.org/10.1016/j.tra.2026.105314", "authors": "Mario Ilic ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-16", "citescore": 1     stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
