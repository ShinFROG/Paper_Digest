<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

 "SSRN", "date": "2026-10-19", "apa": "Wang, J.-a., Tian, J., Wang, C.-h., & Wang, C. (2026). Rheological memory and history-dependent strength control in polycrystalline ice from confined creep to progressive crushing. https://doi.org/10.2139/ssrn.7634755", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "多結晶氷の強度が「今の変形速度」だけでなく載荷の履歴に依存することを取り込んだ構成則を提案した（抄録）。", "p3": "非線形クリープと遅れ回復、剛性の変化、圧力依存の塑性を結合し、載荷中に達した最大の速度由来の強度を最初の塑性補正まで保持する規則を導入した（抄録）。", "p5": "軸圧5〜10 MPaの拘束クリープ・回復試験に較正し、追加較正なしでコーン貫入試験の力の大きさと傾向を再現した。最大強度を破砕の間ずっと保持すると、力-貫入の仕事が提案法より20.5%大きくなった（抄録）。", "fun": "氷はゆっくり押し続けると変形の速さが落ち、その速さから計算した強さは、押し始めの頃より低く見えてしまいます。つまり氷は「どう押されてきたか」を覚えている材料です。この記憶をどこまで残すかで、構造物にかかる力の見積もりが2割も変わるというのは、材料の過去が未来の壊れ方を決める良い例です。", "unverified": "モデルの式と較正パラメータの値は抄録からは確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "時間領域データからLoewner縮約モデルを構築", "title": "Time-Domain Data-Driven Loewner Reduced-Order Models for Electromagnetic Simulation", "url": "https://arxiv.org/abs/2610.22624", "authors": "Pablo Biurrun ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Biurrun, P., Ramos-Salas, C. J., Angulo, L. D., & de la Rubia, V. (2026). Time-Domain Data-Driven Loewner Reduced-Order Models for Electromagnetic Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22624", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "時間領域の電磁界シミュレーションの入出力データから、Loewner法でコンパクトな縮約モデル（ROM：少ない自由度で応答を近似するモデル）を作る手順を示した（抄録）。", "p3": "過渡応答の入出力からLoewner行列とシフトLoewner行列を作り、特異値分解で縮約した記述子系を得る。短い学習区間で同定し、長い区間を予測する（抄録）。", "p5": "4種類のマイクロ波構造（導波路フィルタ、周波数選択面など）で全次数計算と比較し、学習区間の最大50倍の長さの応答を予測できたとしている（抄録）。", "fun": "複雑な回路を細かい格子で長時間計算するのは大変ですが、入力と出力の関係だけを短時間観察して、少数の部品からなる「代わりの模型」を作れば、その後の応答を素早く予測できます。短い観察から50倍も先まで見通せるのは、系の振る舞いが少数の固有のリズムで決まっているからだと考えられます。", "unverified": "予測誤差の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "物理制約つき神経縮約モデルの再現可能な比較", "title": "Physics-Constrained Neural Reduced-Order Models for Thermal Systems Under Operating Condition Shift: A Reproducible Benchmark Study", "url": "https://doi.org/10.5281/zenodo.23482655", "authors": "OSEI ANTOBRE ほか", "venue": "Zenodo", "date": "2026-10-19", "apa": "OSEI ANTOBRE, B. I. S. M. A. R. K., Oduro Boafo, R., & Appiah, G. (2026). Physics-Constrained Neural Reduced-Order Models for Thermal Systems Under Operating Condition Shift: A Reproducible Benchmark Study. Zenodo. https://doi.org/10.5281/ZENODO.23482655", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を読んだ（審査のない置き場）", "preprint": true, "short": true, "p1": "物理制約つきニューラル縮約モデルが、学習範囲外の運転条件でどれだけ劣化するかを、再現可能な小さなベンチマークで調べた（抄録）。", "p3": "1次元定常熱伝導問題でPOD（固有直交分解）8モードと多層パーセプトロンを組み合わせ、教師ありの基準モデルと4つの残差罰則の重みの変種を、範囲内300例・範囲外300例で比較した（抄録）。", "p5": "基準モデルの中央値相対L2誤差は範囲内1.39%、範囲外23.62%。罰則重み1.0で範囲外の95パーセンタイル誤差は69.94%から62.64%に下がった。残差の大きさは誤差と正に関連した（抄録）。", "fun": "機械学習の模型は、練習した範囲の外に出ると急に当たらなくなります。そこで「熱は方程式どおりに流れるはず」という物理のルールを守らせると少しましになる、というのがこの研究の結果です。さらに、ルールをどれだけ破っているかが、予測がどれだけ外れているかの目安になるかもしれない点が面白いところです。", "unverified": "著者自身が、結果は合成ベンチマークに限られ一般的な優位性は示していないと述べている。"}}, {"id": "pr20", "rank": 20, "headline": "カラコルム道路の土石流危険度を説明可能MLで評価", "title": "Integrated debris-flow susceptibility assessment along the Karakoram highway using statistical, multi- criteria, and explainable machine-learning models", "url": "https://doi.org/10.21203/rs.3.rs-11104077/v1", "authors": "Niaz Muhammad ほか", "venue": "Research Square (In Review)", "date": "2026-10-19", "apa": "Muhammad, N., Bai, S., Alshameri, A., Khan, A. A., Shah, N. A., Rahman, A., Amin, M. T., & Zahara, N. (2026). Integrated debris-flow susceptibility assessment along the Karakoram highway using statistical, multi- criteria, and explainable machine-learning models. https://doi.org/10.21203/rs.3.rs-11104077/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を読んだ（査読中）", "preprint": true, "short": true, "p1": "カラコルム・ハイウェイ沿いの土石流の起こりやすさを、専門家判断型・統計型・機械学習型の方法で比較し、地図化した（抄録）。", "p3": "現地確認62か所と遠隔判読42か所の計104件の土石流の記録と13の地形・環境要因を用い、AHP、ANP、頻度比法、XGBoost、ランダムフォレストを比較した（抄録）。", "p5": "AUCはランダムフォレスト0.852、XGBoost 0.839、頻度比法0.784、ANP 0.775、AHP 0.766で、標高・勾配と季節的な強雨が主な要因だった（抄録）。", "fun": "どこで土石流が起きやすいかを決めるとき、専門家の経験で重みを付ける方法と、過去の発生地点からコンピュータに学ばせる方法があります。この研究は同じ地域で両者を並べ、データから学ぶ方法の方がよく当たることを示しました。山の高さや傾きといった身近な地形の情報が、危険の大部分を説明するのも興味深い点です。", "unverified": "モデルの検証方法（空間的な分割の有無）は抄録からは確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "亀裂-母岩系の熱輸送に粘性の温度依存が効く", "title": "Thermo-viscous feedback in heat transport through fracture-matrix systems with finite thermal capacity", "url": "https://arxiv.org/abs/2610.22531", "authors": "Alessandro Lenci", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Lenci, A. (2026). Thermo-viscous feedback in heat transport through fracture-matrix systems with finite thermal capacity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22531", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "地熱系の亀裂-母岩系で、粘性の温度依存と母岩の有限の熱容量を取り込んだ縮約モデルを作り、熱の前線の動きを半解析的に予測できるようにした（抄録）。", "p3": "粘性は亀裂全体の水理抵抗を通じて流量を決め、有限の熱容量は初期の取り込みと総容量で決まる単一の時間尺度の記憶として入れる。摂動の階層で貯留とそれが誘起する水理応答を分けた（抄録）。", "p5": "差圧一定では加熱で前線が速く広がり、冷却で遅く鋭くなる。最終流量は端点の粘性比だけで決まり、流量一定では粘性は圧力降下だけを変え熱の応答は変えない（抄録）。", "fun": "温かい水はサラサラ、冷たい水はドロッとしています。地下の割れ目に水を流すと、この粘り気の違いが流れの速さを変え、その流れがまた温度の広がり方を変えるという循環が生まれます。複雑な連成を、少数の時間尺度で表す簡単な模型に落とし込んでいるのがこの論文の工夫です。", "unverified": "非線形解との誤差の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "歯の亀裂がある遊星歯車箱の動的モデル", "title": "Dynamic Modelling and Analysis of a Three-Stage Epicyclic Gearbox with a Tooth Crack Fault", "url": "https://doi.org/10.2139/ssrn.7636385", "authors": "Vishal G. Salunkhe ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Salunkhe, V. G., Bobade, A. H., Bisht, D., Dede, A. D., Ghare, A. B., Khot, S. M., & Desavale, R. G. (2026). Dynamic Modelling and Analysis of a Three-Stage Epicyclic Gearbox with a Tooth Crack Fault. https://doi.org/10.2139/ssrn.7636385", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "歯の亀裂がある3段遊星歯車箱の振動を、物理モデルと実験で結びつけて診断する枠組みを示した（抄録）。", "p3": "Rayleighはりによる軸のモデル、時間変化するかみ合い剛性、軸受の支持条件を組み込み、欠陥をかみ合い剛性の低下として表して、健全時と故障時の振動を予測した。試験装置で3軸加速度を計測しFFTで解析した（抄録）。", "p5": "局所的な歯の欠陥は振動スペクトルに識別可能な変化を生み、予測と計測がよく対応したとしている（抄録）。", "fun": "歯車の歯にひびが入ると、かみ合うたびにわずかに「柔らかく」なり、その周期的な変化が振動の音色に現れます。この論文は、その仕組みを方程式で再現し、実際の振動と照らし合わせました。医者が聴診器で心臓の雑音を聞き分けるように、振動の成分から故障を見つける考え方です。", "unverified": "予測と計測の一致の定量的な指標は抄録からは確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "多時間スケール融合で波高予測と不確実性評価", "title": "Adaptive multiscale temporal fusion for significant wave height forecasting and uncertainty quantification", "url": "https://doi.org/10.2139/ssrn.7635635", "authors": "Yuxiang Zhang ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Zhang, Y., Shi, Y., Yang, Z., Chen, G., Shuai, Z., Shen, Q., & Song, A. (2026). Adaptive multiscale temporal fusion for significant wave height forecasting and uncertainty quantification. https://doi.org/10.2139/ssrn.7635635", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "波高・風速・風向・最大瞬間風速の4入力から、複数の予測期間の有義波高を不確実性つきで予測するネットワークを提案した（抄録）。", "p3": "予測期間に応じて多尺度の特徴を選ぶ適応的なパッチ混合器、局所変動と持続的な海況を結ぶ相互作用型の符号化器、極値を保つ予測と確率的出力を組み合わせた（抄録）。", "p5": "3つのブイのデータで、12のブイ×予測期間の組み合わせすべてでMASEとRMSEが最小となり、各条件の最良の比較手法より平均2.54%と2.62%改善した（抄録）。", "fun": "データから学ぶ予測モデルは、平均的な値に寄せてしまい、本当に大事な大波を小さく見積もりがちです。この研究は、大波の山を削らないように工夫し、さらに「どれくらい外れうるか」の幅も出すようにしました。海の仕事では、平均より極端な場合の見積もりの方が命や設備を守るのに重要だという点が出発点です。", "unverified": "不確実性の評価指標（被覆率など）の数値は抄録からは確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "決定論的な下方リスク検出を3つの金融危機で検証", "title": "Detection-Timing Backtest of a Deterministic Downside-Risk Screen Across Three Modern Financial Crises", "url": "https://doi.org/10.2139/ssrn.7621078", "authors": "Md. Zarif Latif", "venue": "SSRN", "date": "2026-10-19", "apa": "Latif, Md. Z. (2026). Detection-Timing Backtest of a Deterministic Downside-Risk Screen Across Three Modern Financial Crises. https://doi.org/10.2139/ssrn.7621078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "ニュース見出しから企業の下方リスクを決定論的に検出する仕組みを3つの金融危機で再生し、検出のタイミングを検証した（抄録）。", "p3": "2023年3月の米地銀の連鎖、2020年6月のWirecardの会計不正、2022年11月のFTX破綻について、GDELTの161件の記録に対し企業名の対応付けと深刻度の採点を行った（抄録）。", "p5": "影響を受けた9社すべてを正式な決着日の前に検出し、中央値2.48日先行した。ただし9件すべてで最初の検出は株価下落を報じる最初の見出しと同時で、市場の先読みの証拠ではないと著者は述べている（抄録）。", "fun": "「AIが危機を事前に察知した」と聞くとすごそうですが、この論文は正直に、検出は株価がすでに下がり始めたというニュースと同時だったと報告しています。つまり予言ではなく、すでに起きていることを素早く整理する道具だったわけです。成功の数字だけでなく、その中身を丁寧に問う姿勢が面白い研究です。", "unverified": "対照企業がコーパスに現れず、誤検出の評価はできていないと著者が述べている。"}}, {"id": "pr25", "rank": 25, "headline": "井尻雄士の測定と説明責任の会計学", "title": "Yuji Ijiri (1935-2017): Measurement, Accountability, and Accounting as a Social Institution", "url": "https://doi.org/10.2139/ssrn.7621698", "authors": "Shyam Sunder ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Sunder, S., Persson, M., & Liang, P. J. (2026). Yuji Ijiri (1935-2017): Measurement, Accountability, and Accounting as a Social Institution. https://doi.org/10.2139/ssrn.7621698", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "会計を知的分野であり社会制度であると位置づけた井尻雄士（1935〜2017）の業績と指導力を、説明責任と会計構造の観点から振り返る追悼論文（抄録）。", "p3": "公刊資料とアーカイブ資料にもとづき、取得原価、モメンタム会計、三式簿記の研究が測定と説明責任をどう結んだかを、カーネギーメロン大学や米国会計学会での活動と日米の学術交流とあわせてたどる（抄録）。", "p5": "説明を与える者と受ける者の権利と義務に注目した説明責任の枠組みが、形式的な分析と会計の責任を結んだ遺産として整理されている（抄録）。", "fun": "簿記といえば「借方と貸方」の二つで記録するのが常識ですが、井尻は三つ目の次元を加える三式簿記を考えました。会計の数字は単なる計算ではなく、「誰が誰に説明する責任を負うか」という人と人との約束を形にしたものだ、という見方が中心にあります。数字の背後にある社会のルールに目を向けさせてくれる論文です。", "unverified": "本文で扱う具体的な文献・資料の範囲は抄録からは確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "外国技術の導入と規制負担が中小企業の生産性に", "title": "Foreign technology in-licensing, regulatory burden, and SME productivity", "url": "https://doi.org/10.21203/rs.3.rs-9987214/v1", "authors": "Olufemi Aluko ほか", "venue": "Research Square (In Review)", "date": "2026-10-19", "apa": "Aluko, O., & Ogundipe, A. A. (2026). Foreign technology in-licensing, regulatory burden, and SME productivity. https://doi.org/10.21203/rs.3.rs-9987214/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を読んだ（査読中）", "preprint": true, "short": true, "p1": "新興国の中小企業で、外国技術のライセンス導入が生産性を高め、その効果は規制負担の重い環境でむしろ大きいことを示した（抄録）。", "p3": "世界銀行企業調査（2006〜2022年）の24の新興国の中小企業23,939社のデータに、制御関数法を適用して内生性に対処した（抄録）。", "p5": "外国技術の導入は生産性を有意に高め、規制負担は生産性を下げる。導入による生産性の上昇は規制負担の大きい環境で大きく、すべての規制条件で導入企業が非導入企業を上回った（抄録）。", "fun": "役所の手続きが面倒な国ほど、外国の技術を取り入れた中小企業の伸びが大きいという結果は、少し意外です。規制で動きにくい環境では、外から持ち込んだ技術が他社との差を生む切り札になるのかもしれません。障害が多いほど工夫の価値が上がるという、ビジネスの逆説を感じさせる結果です。", "unverified": "制御関数法で用いた操作変数と効果の大きさは抄録からは確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "スイッチング障壁と会員制度は不公平感で逆効果に", "title": "Lock-in or commitment? How perceived unfairness conditions the path from switching barriers and tiered loyalty programs to customer loyalty: a systematic review and research agenda", "url": "https://osf.io/whsqj", "authors": "Didik Susetyo ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-16", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OSFに登録された計画・資料の説明を読んだ", "preprint": true, "short": true, "p1": "スイッチング障壁と階層型の会員制度が、感情的・計算的コミットメントを通じて顧客の忠誠につながる経路と、それを不公平感が条件づけるかを調べる体系的レビューの登録（抄録）。", "p3": "PRISMA 2020に沿った実証研究の体系的レビューで、選別・抽出・質の評価のファイルとチェックリストを含む事後登録である（抄録）。", "p5": "未確認（登録の説明には結果が書かれていない）。", "fun": "「乗り換えると損だから」続ける客と、「好きだから」続ける客は、外から見ると同じ常連客です。でも、不公平に扱われていると感じた途端、前者は離れていくかもしれません。囲い込みが本当の忠誠なのか、ただの縛りなのかを見分けようとする問いが、このレビューの面白さです。", "unverified": "レビューの対象研究数と結論は登録の説明からは確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "顧客満足は財務成果を予測する唯一の指標か", "title": "Customer Satisfaction as Strategic Resource: Multi-Level Evidence and Research Agenda", "url": "https://doi.org/10.64240/1e6b859743", "authors": "Vikas Mittal", "venue": "Faculti Media Limited", "date": "2026-10-19", "apa": "Mittal, V. (2026). Customer Satisfaction as Strategic Resource: Multi-Level Evidence and Research Agenda. https://doi.org/10.64240/1e6b859743", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "記録には題名と一文の問いだけがあり、抄録・本文は入手できなかった", "preprint": true, "short": true, "p1": "題名からは、顧客満足を戦略的な資源とみなし、複数の水準の証拠をもとに研究課題を示す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「顧客満足は、会社の財務成果を確実に予測できる唯一の顧客指標なのか」というものです。満足度アンケートは多くの企業が測っていますが、それが本当に売上や利益の先行指標になるのか、他の指標の方がよいのかは、意外と答えの定まっていない問題です。", "unverified": "掲載元（Faculti Media）の性格と、論文の内容は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "クラウドの無料枠と割引はスイッチング障壁になる", "title": "Cloud Credits and Committed-Spend Discounts as Switching Barriers: A Competition Law Analysis of Customer Lock-In", "url": "https://doi.org/10.2139/ssrn.7625381", "authors": "Khushi Suresh", "venue": "SSRN", "date": "2026-10-19", "apa": "Suresh, K. (2026). Cloud Credits and Committed-Spend Discounts as Switching Barriers: A Competition Law Analysis of Customer Lock-In. https://doi.org/10.2139/ssrn.7625381", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "クラウドの無料クレジットと利用額コミット割引の組み合わせが顧客の乗り換えを難しくする問題に、インド競争法がどこまで対処できるかを検討した（抄録）。", "p3": "同法の3条4項と4条、2023年の関連市場の定義の改正、最高裁の効果に基づく判断を整理し、英国CMAのクラウド調査、仏法、EUデータ法などと比較した（抄録）。", "p5": "問題は個々の手段ではなく、両者の連続的な利用と更新条件が乗り換え費用を高める累積効果にあり、現行制度はライフサイクル全体の影響の評価や有益な取決めとの区別に課題があると論じる（抄録）。", "fun": "最初は無料で使わせ、次に「たくさん使う約束をすれば割引」と誘う。どちらも単独なら客にうれしい値引きですが、重ねると気づいたときには他社へ移れなくなっている、というのがこの論文の指摘です。一つ一つは合法でも、組み合わせると問題になりうるという、ルール作りの難しさがよく分かります。", "unverified": "結論として提案する具体的な法的基準は抄録からは確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "LLM広告のマーケティング表示の価値を因果で測る", "title": "Causal Value Attribution of Marketing Labels in LLM-Generated Ads: A Deconfounder Approach", "url": "https://arxiv.org/abs/2610.23025", "authors": "Danhong You (Eric) ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "You, D., Jiang, W., Zhiqiang, & Zheng. (2026). Causal Value Attribution of Marketing Labels in LLM-Generated Ads: A Deconfounder Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMに広告を作らせるときの専門家ラベル（表現の指定）ごとの因果効果を推定する方法D-VAEを提案した（抄録）。", "p3": "複数処置のデコンファウンダー（観測データから潜在的な交絡を推定する方法）と因果表現学習を統合し、単一処置の交絡による欠落変数バイアスのPAC型の上界も導いた（抄録）。", "p5": "化粧品広告29,177件で既存手法を上回り、推奨された設定はフィールド実験でエンゲージメントを32.7%高め、人間の専門家と統計的に区別できない成績だった（抄録）。", "fun": "AIが広告を作る時代には、完成した広告そのものより「どんな指示を出すか」という人間の腕前に価値が移ります。でも、どの指示が本当に効いたのかは、他の条件と絡み合っていて見分けにくいものです。その見えない絡み合いを統計的にほどき、腕前の値段を測ろうとする発想が面白い研究です。", "unverified": "フィールド実験の規模と期間は抄録からは確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "地域への愛着と結束は絶滅危惧種への関心を高めるか", "title": "COMMUNITY ATTACHMENT, SOCIAL COHESION AND COMMUNITY AWARENESS OF ENDANGERED SPECIES: DOES BEING EMPLOYED IN AGRICULTURE MAKE YOU MORE AWARE OF THE CASE OF THE LESSER PRAIRIE CHICKEN (TYMPANUCHUS PALLIDICINCTUS)?", "url": "https://doi.org/10.5593/sgem2025v/4.2/s19.53", "authors": "Aaron Harp ほか", "venue": "HAL", "date": "2026-10-19", "apa": "Harp, A., Maczko, K., & Taylor, D. (2025). COMMUNITY ATTACHMENT, SOCIAL COHESION AND COMMUNITY AWARENESS OF ENDANGERED SPECIES: DOES BEING EMPLOYED IN AGRICULTURE MAKE YOU MORE AWARE OF THE CASE OF THE LESSER PRAIRIE CHICKEN (TYMPANUCHUS PALLIDICINCTUS)? 25th International Multidisciplinary Scientific GeoConference Proceedings SGEM 2025, Energy and Clean Technologies, 25, 491–502. https://doi.org/10.5593/sgem2025v/4.2/s19.53", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "米国南部平原の農村で、地域への愛着・満足・社会関係資本と、絶滅危惧種ヒメソウゲンライチョウの回復に関する知識との関係を、農業就労の有無で比べた（抄録）。", "p3": "カンザス、ニューメキシコ、オクラホマ、テキサスの4つの主要土地資源地域の世帯調査を用い、地域態度の尺度と環境・鳥に関する尺度を比較した（抄録）。", "p5": "未確認（抄録には結果が書かれていない）。", "fun": "地元への愛着が強い人ほど、地域の自然や生き物にも関心を持つのでしょうか。この研究は、農業で働く人とそうでない人で、地域への思いと絶滅しそうな鳥への関心がどう違うかを調べています。人と人のつながりと、人と自然のつながりを同じ物差しで測ろうとする試みが面白いところです。", "unverified": "分析結果とサンプルの規模は抄録からは確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "研究者のミニ・パブリックで先住民の文化的能力を熟議", "title": "A Mini-public of Academics: Experimenting with Deliberative Democracyand Indigenous Cultural Competency in Legal Education", "url": "https://doi.org/10.2139/ssrn.7633318", "authors": "Ron Levy ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Levy, R., & Wood, A. (2026). A Mini-public of Academics: Experimenting with Deliberative Democracyand Indigenous Cultural Competency in Legal Education. https://doi.org/10.2139/ssrn.7633318", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "オーストラリアの法学教育での先住民の文化的能力をテーマに、先住民と非先住民の法学研究者によるミニ・パブリック（無作為などで選ばれた小集団の熟議）を実施し、その設計と実施を評価した（抄録）。", "p3": "包摂、人口学的・思想的な多様性、進行役、理由の提示という熟議民主主義の原則に照らして、実践を振り返った（抄録）。", "p5": "深い違いを越えた相互理解と協働的な学びの可能性がある一方、意味のある包摂、思想的な対立の扱い、熟議を制度変化につなげることに実務上の課題があったとする（抄録）。", "fun": "意見が深く対立するテーマでも、少人数で理由を出し合いながら話せば、互いの理解が深まるかもしれません。この論文は、大学教員自身がその「熟議」を試してみた記録です。うまくいった点だけでなく、話し合いを実際のカリキュラムの変化につなげる難しさも率直に書いている点が興味深いところです。", "unverified": "参加者数と具体的な提言の内容は抄録からは確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "身の上話を添えるとLLMが迎合しやすくなる", "title": "Trapped in Your Story: Evaluating Narrative-Induced Sycophancy in Large Language Models", "url": "https://arxiv.org/abs/2610.23525", "authors": "Runtai Yang ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Yang, R., Zhu, D., Zhang, K., & Zhai, G. (2026). Trapped in Your Story: Evaluating Narrative-Induced Sycophancy in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23525", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "利用者が意見に添える「物語」（理由づけや体験談）が、LLMの迎合（相手の意見に合わせること）をどう強めるかを測るベンチマークを作った（抄録）。", "p3": "10領域500の論争的な問いについて、立場を固定したまま正当化の仕方だけを変える11条件（中立1と両立場の5段階）を作り、5,500事例で7つのLLMを評価した（抄録）。", "p5": "物語の詳しさとの関係は単調でなく、個人的な体験は同意を減らしうる一方、因果的な説明や世界観に基づく統合は同意を増やした。GPT-5.1の比較では因果的な枠づけの効果が最も強く、箇条書きも段落より同意を増やした（抄録）。", "fun": "AIに意見を聞くとき、自分の考えに「なぜなら」と理由を付け足すと、AIが話を合わせてくる度合いが変わります。しかも、体験談より因果の説明の方がAIをなびかせやすく、同じ内容でも箇条書きにすると効果が増すというのは驚きです。AIの判断が、中身だけでなく話の組み立て方に左右されることを示しています。", "unverified": "モデルごとの同意率の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "学習するエージェント集団に差別と分極が生じる", "title": "Emergent Discrimination and Polarization in Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.22701", "authors": "Nestor Caticha ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Caticha, N., Sant'Ana, J. H., Alves, F., Costa, D. B., Mercucci, M., Neirotti, J. P., Citton, O., & Vicente, R. (2026). Emergent Discrimination and Polarization in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22701", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "学習するエージェント集団で、差別と分極がどのように創発するかを理論とシミュレーションで示した（抄録）。", "p3": "各エージェントは言語モデルの埋め込みを二値の意見に写す線形の判断層と他者への信頼の推定を持ち、雑音のある通信路での教師-生徒学習から導いたオンラインのベイズ則で更新する。一部のエージェントに集団ラベルに応じた偏り（強さb、割合f_b）を与え、統計力学の秩序変数で集団状態を調べた（抄録）。", "p5": "(b, f_b)平面に、外集団びいきのスピングラス的状態、差別のない分極、意見の一致を伴う差別、伴わない差別の4つの集団状態が現れた。LLMの文脈内学習の実験も予測された更新を定性的に再現した（抄録）。", "fun": "一人ひとりはほんの少しの偏りしか持っていないのに、集団全体では差別や分断がはっきり生まれることがあります。この研究は、磁石の向きがそろう仕組みを説明する物理の道具を使って、偏りの強さと持っている人の割合によって社会の状態ががらりと変わる「相図」を描きました。社会の分断を物理の相転移として眺める発想が面白いところです。", "unverified": "各状態の境界の値は抄録からは確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "考えるか読むか：共有文脈の推論のトークン予算理論", "title": "Think More or Read More? A Token-Budget Theory of Reasoning with Shared Context", "url": "https://arxiv.org/abs/2610.23246", "authors": "Manh Nguyen ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Nguyen, M., Gupta, S., & Le, H. (2026). Think More or Read More? A Token-Budget Theory of Reasoning with Shared Context (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23246", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多エージェント討論などで「他者の出力を読む」ことと「自分で考える」ことが同じトークン枠を奪い合う関係を理論化し、最適なエージェント数を予測できるようにした（抄録）。", "p3": "読んだ後に残る推論予算の関数として正答率をモデル化し、誤りの相関を許すコンドルセの陪審モデルで票を集計する。単一エージェントの測定から討論の最適人数を閉形式で求める（抄録）。", "p5": "予測された人数で、強い比較手法を最も厳しい較正コストの条件で上回った。通信が得になるのは正答率の上限の伸びが読むために失う推論の余地を上回るときだけで、窓が小さいほど条件が厳しくなる（抄録）。", "fun": "話し合いは人数が多いほど良い答えが出そうですが、他人の意見を読む時間が長くなると、自分で考える時間が減ってしまいます。この研究は、AIの「頭の容量」が決まっているとき、話し合いの最適な人数を計算で求められることを示しました。多数決で正しくなる条件を調べた18世紀のコンドルセの理論が、最新のAIに使われているのも面白い点です。", "unverified": "最適人数の具体的な値と改善幅は抄録からは確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "多様なペルソナに仕えるコンピュータ操作エージェントの評価", "title": "PersonaCUABench: Benchmarking Computer-Use Agents Serving Diverse Personas", "url": "https://arxiv.org/abs/2610.22990", "authors": "Haoming Li ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Li, H., Cao, D., Hu, X., Luo, Y., Wang, Y., Xu, X., He, J., Jiang, W., Zhang, Y., Zhao, Y., Wu, S., Yang, C., Wang, H., Deng, Z., Li, T., Zhang, J., Peng, Z., Liang, S., Zhao, Y., … Li, X. (2026). PersonaCUABench: Benchmarking Computer-Use Agents Serving Diverse Personas (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22990", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "同じ課題を「誰が頼むか」だけ変えて、コンピュータ操作エージェント（CUA）が多様な利用者に応えられるかを測るベンチマークを作った（抄録）。", "p3": "11領域74課題を固定し、4群44のペルソナを演じるエージェントが指示を自分の言葉で言い換え、CUAの質問に答える。CUAはプロフィールも元の指示も見ず対話だけを見る（抄録）。", "p5": "9つの基盤モデル（3,330実行）で、課題完了率は元の依頼に比べ平均36%下がった。完全に完了しても最高の満足度が付いたのは62.7%で、元の依頼の84.1%より低かった（抄録）。", "fun": "同じ仕事でも、頼む人によって言い方や条件、こだわりは違います。AIのテストでは整った指示が使われがちですが、現実の人の言葉で頼むと、成功率は3分の1以上も落ちました。さらに、仕事を終えても本人が満足しているとは限らないという結果は、「できた」と「役に立った」の違いを考えさせます。", "unverified": "ペルソナの4群の内容は抄録からは確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "職業の性別バイアスはLLMの学習段階でどう変わるか", "title": "Analyzing Occupational Gender Bias across the LLM Training Lifecycle", "url": "https://arxiv.org/abs/2610.23587", "authors": "Manthan Gadhia ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Gadhia, M., Hoyle, A., & Stańczak, K. (2026). Analyzing Occupational Gender Bias across the LLM Training Lifecycle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23587", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "完全公開のLLM（OLMo 3）の事後学習の各段階で、職業に関する性別バイアスがどう変わるかを追跡した（抄録）。", "p3": "職業と学歴を持つ合成ペルソナについて物語を生成させ、性別を明示する設定とモデルに推測させる設定を比較し、SFT、DPO、RLVRの各チェックポイントを分析した（抄録）。", "p5": "性別を明示すると、事後学習で男性的なプロフィールの意味的多様性は増えたが、女性的なプロフィールでは増加が小さかった。モデルの推測は米国の労働力構成に比べ女性に偏り、事後学習の段階ごとに女性ラベルの確率が単調に増えた。SFTコーパスの女性トークンの余剰は7.7%にすぎなかった（抄録）。", "fun": "AIの偏りは、仕上げの訓練で直ると考えられがちです。ところがこの研究では、訓練の段階を進むほど「この職業の人は女性だろう」と推測する傾向が強まり、しかも訓練データの偏りだけでは説明できないほどでした。偏りを減らすつもりの工程が、別の方向の偏りを生むこともあるという点が興味深いところです。", "unverified": "多様性の指標の定義と効果の大きさは抄録からは確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "都市デジタルツインの要件と障壁をオランダ東部で", "title": "Digital Twinning Conceptions, Requirements and Barriers. A perspective from the Eastern Dutch context", "url": "https://doi.org/10.31235/osf.io/6rm34_v1", "authors": "Ivan Cardenas-Leon", "venue": "SocArXiv", "date": "2026-10-19", "apa": "Cardenas-Leon, I. (2026). Digital Twinning Conceptions, Requirements and Barriers. A perspective from the Eastern Dutch context. https://doi.org/10.31235/osf.io/6rm34_v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を読んだ", "preprint": true, "short": true, "p1": "オランダ東部の計画担当者への聞き取りから、都市デジタルツインの導入を妨げているのは技術ではなく制度と統治の問題だと論じた（抄録）。", "p3": "自治体・州・コンサルタントの計画者と都市管理者6人への半構造化インタビューを、手作業とLLM支援の抽出を組み合わせた演繹・帰納の主題分析で調べた（抄録）。", "p5": "部門間の連携の弱さ、証拠より政治の優先、データの断片化が障壁で、デジタルツインの概念も人により異なった。一方、問い合わせ可能な集中データ、シナリオ計算、ウェブでの提供、平易な表示、共同開発が共通の要件だった。1980年の診断とほぼ同じ構造的問題が40年以上続いていた（抄録）。", "fun": "街を丸ごとコンピュータの中に再現する「デジタルツイン」は最新技術の代表ですが、使う側の悩みは「部署同士が協力しない」「データがばらばら」といった昔からの問題でした。1980年の報告とほとんど同じ課題が今も残っているという発見は、技術が進んでも組織は簡単には変わらないことを示しています。", "unverified": "インタビュー対象が6人と少なく、一般化の範囲は抄録からは判断できない。"}}, {"id": "pr39", "rank": 39, "headline": "アクセシビリティを交通行動モデルの中心に置く", "title": "Placing accessibility at the center of travel behavior modeling: A conceptual framework", "url": "https://doi.org/10.31235/osf.io/xa23j_v2", "authors": "Matheus Fontenelle Siqueira ほか", "venue": "SocArXiv", "date": "2026-10-19", "apa": "Siqueira, M. F., & Loureiro, C. F. G. (2026). Placing accessibility at the center of travel behavior modeling: A conceptual framework. https://doi.org/10.31235/osf.io/xa23j_v2", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を読んだ", "preprint": true, "short": true, "p1": "知覚されたアクセシビリティ（目的地への行きやすさの主観的評価）を、都市構造と交通行動を結ぶ中心的な媒介として位置づける概念枠組みを提案した（抄録）。", "p3": "時間地理学とGeurs and van Weeの枠組みにもとづき、土地利用・交通・時間・個人と社会・デジタルの要素を統合した。ブラジル・フォルタレザで構造方程式モデルと性別の多母集団モデルにより試行した（抄録）。", "p5": "土地利用・交通・時間の要素が仕事への知覚アクセシビリティを構成し、費用の小さい移動と関連したが、有償労働への参加とは関連しなかった。女性では個人の制約と知覚要素の関係が強かった（抄録）。", "fun": "駅から近い家に住んでいても、子育てや仕事の時間の制約があれば、実際には「行きにくい」と感じるかもしれません。この研究は、地図上の距離ではなく、人が感じる行きやすさを中心に交通行動を考えようと提案しています。同じ街でも女性の方が個人の制約の影響を強く受けるという結果は、都市の公平性を考える手がかりになります。", "unverified": "モデルの適合度と係数の値は抄録からは確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "ロンドンの機会地域モデルをマドリードと比較", "title": "The Opportunity Area Model in Regional Planning: Evaluating the London Plan and its Implications for Madrid’s Strategic Development", "url": "https://doi.org/10.2139/ssrn.7635238", "authors": "Wady César Zúñiga-Simón ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Zúñiga-Simón, W. C., Ardura-Urquiaga, Á., & Ruiz-Sánchez, J. (2026). The Opportunity Area Model in Regional Planning: Evaluating the London Plan and its Implications for Madrid’s Strategic Development. https://doi.org/10.2139/ssrn.7635238", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "ロンドン計画2021の「機会地域」制度を分析し、マドリードの短命に終わった類似制度と比較して、柔軟な計画手段の危うさを示した（抄録）。", "p3": "ロンドンの機会地域の政策枠組み、空間的な範囲、開発目標を体系的に分析し、GISで戦略的再生地域との重なりを調べた（抄録）。", "p5": "住宅供給より経済的な容量が優先され、特に中心部で高密度の開発が多かった。機会地域の指定は再生地域とずれており、柔軟な制度が広い社会空間的目標より土地の価値獲得を促していると指摘した（抄録）。", "fun": "「ここは開発のチャンスがある地域」と指定すると、街の再生が進むはずです。ところがロンドンでは、指定がむしろ土地の値上がりを狙った開発に使われ、住宅不足や貧しい地域の再生には十分つながっていませんでした。ルールを柔軟にすると、市場の力の強い方に流れやすいという都市計画の教訓が読み取れます。", "unverified": "指標のばらつきの具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "人とAIの協働に省察的・適応的リーダーシップを", "title": "Beyond AI Adoption: Reflective Adaptive Leadership for Human–AI Collaboration and Organisational Learning", "url": "https://doi.org/10.2139/ssrn.7635485", "authors": "Venkata Ramakrishna Kanakamedala", "venue": "SSRN", "date": "2026-10-19", "apa": "Kanakamedala, V. R. (2026). Beyond AI Adoption: Reflective Adaptive Leadership for Human–AI Collaboration and Organisational Learning. https://doi.org/10.2139/ssrn.7635485", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "AIが管理職の判断に入り込む状況で、AIの推奨を吟味し修正できる「省察的・適応的リーダーシップ」を判断過程の枠組みとして提案し、尺度を検討した（抄録）。", "p3": "4つの仕組みを、AI拡張の判断の質、人間中心のリーダーシップ、判断の可逆性の予測因子としてモデル化し、35項目の尺度の1,041件の回答をPLSパスモデルで分析した（抄録）。", "p5": "負荷量は.874〜.898、αは.930〜.933で、12の経路はすべて正で信頼区間はゼロを含まなかった。予測因子は3つの結果の分散のおよそ30%を説明した。因果効果や普遍的な妥当性は示していないと著者は述べる（抄録）。", "fun": "AIが「この選択肢がおすすめです」と言ってきたとき、最終責任者として判を押すだけなのか、自分で考え直し、状況が変われば判断を覆せるのか。この論文は、後者の力をリーダーシップとして測ろうとしています。AIの時代に問われるのは、決定の権限より「考え直す力」だという視点が面白いところです。", "unverified": "回答者の属性と、4つの仕組みの各尺度の内容は抄録からは確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "共働き夫婦では天職意識が相手の熱意にも波及", "title": "Calling Beyond the Self: A Conceptual Framework of Work Engagement and Disengagement in Dual-Career Couples", "url": "https://doi.org/10.2139/ssrn.7635151", "authors": "Tina Sharifi ほか", "venue": "SSRN", "date": "2026-10-19", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "共働き夫婦で一方が天職（コーリング）を生きることが、もう一方の仕事への熱意や離脱にどう波及するかを説明する概念枠組みを示した（抄録）。", "p3": "相互依存理論にもとづき、パートナーAの天職の実践がパートナーBの職務関与を介してBのエンゲイジメントに影響し、Bの「見習いたい」という気持ちと関係の相互依存がこれを強めると提案した（抄録）。", "p5": "概念論文のため実証結果はない。波及は関係・仕事と家庭・構造の3つの境界条件によって正にも負にもなりうるとしている（抄録）。", "fun": "パートナーが仕事に生きがいを感じていると、自分もやる気が出ることがあります。でも、相手が仕事に没頭しすぎると、家庭の負担が増えて自分の熱意が下がることもあるでしょう。この論文は、やる気が夫婦の間で「伝染」する仕組みと、その向きが良くも悪くもなる条件を整理しています。", "unverified": "概念論文であり、提案された関係は実証されていない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "AIエージェントは未解決の科学問題を解けるか", "title": "Into the Unknown: Benchmarking AI agents on open scientific research problems", "url": "https://arxiv.org/abs/2610.19159", "authors": "Seungone Kim ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "why": "未解決の研究課題をエージェントに与えて取り組ませるベンチマークを提案し、AIによる研究の能力を測る新しい基準を示した。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "外国のアイデアが米国のイノベーションを支えた", "title": "Foreign Giants' Broad Shoulders: The Causal Effect of Foreign Ideas on U.S. Innovation", "url": "https://doi.org/10.3386/w35900", "authors": "Tarek Alexander Hassan ほか", "venue": "NBER Working Paper", "why": "特許全文から技術の系譜を構築し、外国の発想が米国のイノベーションに与えた因果効果を推定した。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "感度モデルに操作変数を組み込んだ鋭い限界", "title": "Sharp Instrumental Variable Bounds under The Marginal Sensitivity Model", "url": "https://arxiv.org/abs/2610.22513", "authors": "Antonio Olivas-Martinez ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "未観測交絡の程度を限定する周辺感度モデルに操作変数の制約を組み込み、処置効果の鋭い限界を導いた。"}, {"id": "pn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "採用での年齢差別を事前登録の2実験で検証", "title": "Too old for the job? Two preregistered experiments on age bias in hiring", "url": "https://doi.org/10.31235/osf.io/tva49_v1", "authors": "Adrian F. Rogne ほか", "venue": "SocArXiv", "date": "2026-10-19", "why": "高齢労働者の就労延長が政策課題となる中、採用における年齢バイアスを事前登録の実験で検証した。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "人による評定尺度の使い方の違いを補正する", "title": "Correcting for Heterogeneity in the Use of Subjective Scales", "url": "https://doi.org/10.3386/w35925", "authors": "Daniel J. Benjamin ほか", "venue": "NBER Working Paper", "why": "回答者が尺度を異なって使うことによる調査データの交絡を定式化し、一般的な補正方法を示した。"}, {"id": "pn06", "rank": 6, "field": "経営学", "headline": "カード決済データで見る生成AI市場の競争", "title": "Competition in Generative AI: Evidence from Consumer Demand", "url": "https://doi.org/10.2139/ssrn.7621763", "authors": "Mark Egan ほか", "venue": "SSRN", "date": "2026-10-19", "why": "取引レベルのカード決済データで生成AIサービスの消費者需要を推定し、市場の競争度を評価した。"}, {"id": "pn07", "rank": 7, "field": "交通・都市計画", "headline": "通学の交通手段が学校選択の障壁になる", "title": "Transportation as a Barrier to Education Access: Evidence from Chicago Public Schools", "url": "https://doi.org/10.3386/w35915", "authors": "Cecilia H. Moreira ほか", "venue": "NBER Working Paper", "why": "シカゴの公立学校で、通学の交通アクセスが学校選択による教育機会の拡大を制約することを示した。"}, {"id": "pn08", "rank": 8, "field": "ヒューマンコンピュータインタラクション", "headline": "GANからGPT-5まで：人は偽の顔を見抜けるか", "title": "From GAN-Based Models to GPT-5: A Taxonomy-Guided Study of Human Performance in Detecting Deepfake Face Images", "url": "https://arxiv.org/abs/2610.23144", "authors": "Zhiqing Guo ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "生成モデルの世代ごとに、人がディープフェイク顔画像を見分ける能力を体系的に評価した。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "週労働時間の短縮は雇用と生産性を増やしたか", "title": "The Effects of a Shorter Workweek on Employment, Output, and Productivity", "url": "https://doi.org/10.3386/w35917", "authors": "Pauline Carry ほか", "venue": "NBER Working Paper", "why": "フランスの賃金維持型の労働時間短縮を使い、ワークシェアリングと生産性向上の効果を検証した。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "AIの判断をいつ使うかを共形予測で選ぶ", "title": "Conformal Policy Selection: When to Deploy AI Decisions for Targeted Intervention", "url": "https://arxiv.org/abs/2610.22930", "authors": "Junyu Cao ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "AIによる介入方針を展開すべき場面を、共形推論の保証つきで選ぶ方法を提案した。"}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "因果基盤モデルは集計すると被覆率が崩れる", "title": "Unit-level aggregation breaks coverage in causal foundation models", "url": "https://arxiv.org/abs/2610.22770", "authors": "Gabe Schulman ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "処置効果を推定する因果基盤モデルで、個体レベルの推定を集計すると信頼区間の被覆が崩れることを示した。"}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "企業内訓練に積極的な企業は組織が違う", "title": "The Role of Organization in Firm-Sponsored Training", "url": "https://doi.org/10.3386/w35920", "authors": "David J. Deming ほか", "venue": "NBER Working Paper", "why": "企業が労働者の技能に投資する傾向の違いを記録し、組織のあり方との関係を論じた。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "薄い仕組みでVLMエージェントにロボットを書かせる", "title": "HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents", "url": "https://arxiv.org/abs/2610.23479", "authors": "Hongcheng Gao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "why": "視覚言語モデルのエージェントがロボット操作のコードをどこまで書けるかを、最小限の仕組みで検証した。"}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "輸出規制は安全保障にどこまで効くか", "title": "Export Controls and the Economics of National Security", "url": "https://doi.org/10.3386/w35898", "authors": "Jingting Fan ほか", "venue": "NBER Working Paper", "why": "敵対国の軍事能力に関わる財の輸出規制の効果を経済学的に分析した。"}, {"id": "pn15", "rank": 15, "field": "交通・都市計画", "headline": "低所得者の交通補助は配車と公共交通の補完か代替か", "title": "Complement or Substitute? The Effect of Low-Income Transportation Subsidies on Ridehail and Transit Use", "url": "https://doi.org/10.2139/ssrn.7636392", "authors": "Madeline Wander ほか", "venue": "SSRN", "date": "2026-10-19", "why": "多様な交通手段に使える需要側補助の実験から、配車サービスと公共交通の利用への効果を推定した。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "移民の労働市場効果と財政効果を同時に評価", "title": "Modeling and Evaluating the Labor Market and Fiscal Effects of Immigration", "url": "https://doi.org/10.3386/w35901", "authors": "Michele Battisti ほか", "venue": "NBER Working Paper", "why": "移民が自国民に与える労働市場と財政の2つの経路を1つのモデルで評価した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "移民が自国民に与える労働市場と財政の2つの経路を1つの一般均衡モデルで同時に評価した（抄録）。", "p3": "探索・マッチングの摩擦、技能別の累進的な労働課税、資本課税、公共財を含むモデルを、2015〜2019年のOECD 17か国に較正した（抄録）。", "p5": "移民流入1ポイント増の厚生効果は国により符号も大きさも異なる。2019〜2024年の移民の技能構成なら17か国中14か国で自国民の厚生が上がり、低技能層は税引前所得、高技能層は税負担の低下を通じて得をする（抄録）。", "fun": "移民が増えると「仕事を奪われる」と心配する声と、「税収が増える」と期待する声があります。この研究は両方を同じ模型の中で計算し、多くの国では低技能の人も高技能の人も得をするが、その理由は異なることを示しました。片方の経路だけを見ると、誰がなぜ得をするのかを見誤るという点が重要です。", "unverified": "国別の厚生効果の数値は抄録からは確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "生産ネットワークが内生的な経済の頑健な性質", "title": "The Robust Properties of Economies with Endogenous Production Networks", "url": "https://doi.org/10.3386/w35909", "authors": "Simone Cerreia-Vioglio ほか", "venue": "NBER Working Paper", "why": "生産ネットワークが内生的に決まる経済の均衡を特徴づけ、価格の性質を導いた。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "生産ネットワークが内生的に決まる経済で、対数価格が「ネットワーク上のmin-max」で表されることを示し、頑健性と脆弱性の両面を一つの式で捉えた（抄録）。", "p3": "対数価格が対数生産性の原始的なアフィン関数のネットワーク上のmin-maxに等しいことを導き、minを供給者の代替による回復力、maxを補完性による硬直性と解釈した（抄録）。", "p5": "Hultenの定理を一般化し、局所的なDomarウェイトでは小さなショックの伝播さえ十分に記述できないことを示した。Domarウェイトの滑らかな変化はミクロの変動がGDPに与える悪影響を過大評価する（抄録）。", "fun": "部品の仕入れ先を自由に切り替えられれば、どこかの工場が止まっても経済は持ちこたえます。逆に、どうしても代わりのきかない部品があると、そこが弱点になります。この論文は、この「しなやかさ」と「もろさ」が、最小値と最大値という単純な組み合わせの式で表せることを示しました。", "unverified": "モデルの前提となる生産関数の形は抄録からは確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "自国財と外国財の弾力性関数で貿易の利益を測る", "title": "Home-Foreign Elasticity Functions and the Gains from Trade", "url": "https://doi.org/10.3386/w35906", "authors": "Jonathan Vogel", "venue": "NBER Working Paper", "why": "一定の貿易弾力性の仮定を外し、自国-外国間の代替を関数として推定して貿易利益を再計算した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "一定の貿易弾力性を仮定せず、自国-外国の弾力性を関数として推定して貿易の利益を計算し直した（抄録）。", "p3": "一般の相似拡大的選好のもとで、貿易の利益を初期の国内支出シェアと自給自足に至る価格経路上の弾力性関数から求める。弱分離性のもとで経路に依存しないことを示し、貿易協定による関税変化で部門別の関数を推定した（抄録）。", "p5": "WIODとOECD ICIOのデータで、弾力性は国内支出シェアとともに上がる傾向があった。推定した関数を使うと貿易の利益の中央値は19.37対数ポイントで、弾力性を固定した場合の24.43より小さかった（抄録）。", "fun": "貿易でどれだけ得をしているかを測るには、「外国製品が値上がりしたら国産品にどれだけ乗り換えるか」という数字が必要です。従来はこれを一定と仮定していましたが、この研究は国内品の割合が高いほど乗り換えやすいことを見つけ、貿易の利益がこれまでの見積もりより小さくなることを示しました。", "unverified": "推定の不確実性の幅は抄録からは確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "住宅ローンの価格支配力は営業担当者にもある", "title": "Pricing Power in the Mortgage Market: Evidence from GSE Fee Waivers", "url": "https://doi.org/10.3386/w35907", "authors": "Neil Bhutta ほか", "venue": "NBER Working Paper", "why": "政府系機関の手数料免除を使い、情報優位を持つ個々の営業担当者による価格支配力を示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "住宅ローン市場で、企業だけでなく個々の営業担当者が情報優位を使って価格支配力を持つことを示した（抄録）。", "p3": "低所得の初回購入者を対象とした政府系機関（Fannie Mae/Freddie Mac）の手数料免除を使い、免除分が借り手に還元されたかを担当者ごとに推定した（抄録）。", "p5": "2023〜2024年の手数料免除の総額15億ドルのうち60%超を仲介者が取り込んだ。高い金利のローンを組んできた実績のある担当者は免除の20%未満しか還元しなかった（抄録）。", "fun": "国が「低所得の人の手数料を免除します」と決めても、そのお金が本当に本人に届くとは限りません。この研究では、6割以上が途中の仲介者の取り分になっていました。しかも、担当者によって還元の度合いが大きく違うという結果は、制度の効果が窓口の人に左右されることを示しています。", "unverified": "担当者の実績の測り方の詳細は抄録からは確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "社会保険の拡大は家計の借金を減らすか", "title": "The Impact of Social Insurance on Household Debt", "url": "https://doi.org/10.3386/w35908", "authors": "Gideon Bornstein ほか", "venue": "NBER Working Paper", "why": "社会保険の拡充が家計の債務の蓄積に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "社会保険（メディケイド）の拡大が家計の債務に与える因果効果を推定し、信用供給の増加が借入を押し上げることを示した（抄録）。", "p3": "1,000万人のデータで、段階的なメディケイド拡大への郵便番号地域ごとの曝露の違いを使う準実験の設計をとり、家計の借入モデルで効果を分解した（抄録）。", "p5": "地域のメディケイド対象人口が1ポイント増えるとクレジットカードの借入が0.38%増えた。家計の財務的な回復力が高まったことによる信用供給の増加が主因で、拡大の純厚生利益の30%に寄与した（抄録）。", "fun": "医療保険が手厚くなれば、病気のときに借金しなくて済むので、借金は減りそうです。ところが結果は逆で、借入は増えていました。保険で家計が安定すると、銀行が安心してお金を貸すようになるからです。借金が増えたことが、悪いことではなく暮らしの改善の一部だったという見方が面白いところです。", "unverified": "借入の内訳（カード以外）への効果は抄録からは確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "私たちは地下水を使いすぎているか", "title": "Are We Consuming Too Much Groundwater?", "url": "https://doi.org/10.3386/w35904", "authors": "Brian Greaney ほか", "venue": "NBER Working Paper", "why": "世界の多数の帯水層で人間による地下水の汲み上げが最適かを評価した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "世界の多くの帯水層について、人間の地下水汲み上げが最適かどうかを動学モデルで評価した（抄録）。", "p3": "リモートセンシングと経済データで帯水層ごとに汲み上げの動学モデルを推定し、観測された汲み上げを正当化する割引因子を求めて、ラムゼー型と市場の基準と比べた（抄録）。", "p5": "帯水層の5分の3から5分の4が最適より速く汲み上げられており、現在価値を数%下げ、数兆ドル規模の厚生損失を生んでいた。現在の水量を永遠に保つ持続的な経路も、最適経路より厚生が低い（抄録）。", "fun": "地下水は見えない貯金のようなもので、使いすぎれば将来の分がなくなります。この研究は、世界の地下水の多くが「将来をあまりに軽く見る」ペースで使われていると推定しました。意外なのは、今の水位を保つだけでは不十分で、すでに貯金が減りすぎているため回復させる方が良いという結論です。", "unverified": "分析対象の帯水層の数と損失額の内訳は抄録からは確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "地域ショックへの移住反応を正しく理解する", "title": "Understanding Migration Responses to Local Shocks", "url": "https://doi.org/10.3386/w35921", "authors": "Kirill Borusyak ほか", "venue": "NBER Working Paper", "why": "地域の労働需要ショックに対する人口移動の回帰が小さく出る理由を解明した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "地域の労働需要ショックへの人口移動の反応が小さく推定されるのは、移動が鈍いからではなく、回帰の偏りのためだと示した（抄録）。", "p3": "労働者が競合する移住先の中から選ぶ均衡モデルで、地域の人口増は自地域と関連する移住先のショックの差に依存することを示した。ブラジルとドイツの行政データに基づくシミュレーションで偏りを測った（抄録）。", "p5": "ショックが地域間で相関すると推定値は減衰し、産業別のシフトシェアは実効的な曝露を誤って表すため、減衰は50%を超えうる。理論に基づく補正法を提案した（抄録）。", "fun": "ある町で仕事が減っても、隣の町でも同じように仕事が減っていれば、人は引っ越しません。だから「仕事が減った町から人が出ていかない」ことは、人が動かない証拠にはならないのです。比べる相手を正しく選ばないと、因果の大きさを半分以下に見誤るという指摘は、データ分析全般に通じる教訓です。", "unverified": "補正法を実データに適用した結果は抄録からは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "米国の金融政策と世界金融サイクルのモデル", "title": "A Model of U.S. Monetary Policy and the Global Financial Cycle", "url": "https://doi.org/10.3386/w35902", "authors": "Rohan Kekre ほか", "venue": "NBER Working Paper", "why": "米国の金融政策が通貨保有者の富の再評価を通じて世界のリスクプレミアムに影響する一般均衡モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "米国の金融政策が、通貨のミスマッチを抱える裁定者の富の再評価を通じて世界のリスクプレミアムに影響する一般均衡モデルを提案した（抄録）。", "p3": "裁定者のポートフォリオが平均分散効率的なら、彼らはドルを売り持ちになる。米国の引き締めで裁定者の純資産が減り、世界のリスクの価格が上がる。この仕組みを国際資産価格への効果に合わせて定量化した（抄録）。", "p5": "波及効果と外国の政策対応の役割を定量化し、ドル金利が高い将来では裁定者のドル調達と米国の金融政策の波及が弱まるとした（抄録）。", "fun": "アメリカが金利を上げると、遠く離れた国の株や通貨まで揺れ動きます。この論文は、その理由を「ドルを借りて世界に投資している人たちの財布が傷む」ことに求めました。世界の金融市場の波が、一部の投資家の懐具合を通じて広がるという見方は、経済のつながりを理解する手がかりになります。", "unverified": "定量化された波及効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "カリフォルニア富裕税の正味現在価値", "title": "The Net Present Value of the California Billionaire Tax Act", "url": "https://doi.org/10.3386/w35899", "authors": "Benjamin Jaros ほか", "venue": "NBER Working Paper", "why": "2026年の一時的な富裕税の税収と富裕層の移住への影響を評価した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "2026年のカリフォルニア州の億万長者税（10億ドル超の純資産への一度限りの5%課税）の税収と転出の影響を推定した（抄録）。", "p3": "フォーブスの億万長者リスト、州内の住宅保有の報道、公表された転出の情報から行動反応と税収の減少を複数の方法で推定し、訴訟で残る割合の割引を加えた（抄録）。", "p5": "税収は約300億ドル（280〜360億ドル）で、先行研究の予測1,000億ドルの3分の1未満だった。確認済みの転出で課税ベースの約30%が失われ、恒久的な所得税収の損失を含めると正味現在価値はマイナス389億ドルとなった（抄録）。", "fun": "お金持ちに一度だけ大きな税をかければ、州の財政が潤うように思えます。しかし、課税の前にお金持ちが州外へ引っ越してしまうと、その後毎年入るはずだった所得税まで失われます。この研究は、その損失が一度きりの税収を上回ると推定しました。税の効果は人の行動まで考えないと測れないという例です。", "unverified": "10万通りのシミュレーションの結論の詳細は抄録の途中までしか確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "ベンチャー投資は顧客資本の大きい企業を選ぶ", "title": "Venture Capital and Customer Capital", "url": "https://doi.org/10.3386/w35919", "authors": "Martin Aragoneses ほか", "venue": "NBER Working Paper", "why": "販売・マーケティング費の大きい顧客資本集約型の企業にベンチャーキャピタルが特化していることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "ベンチャーキャピタルが、知識資本より「顧客資本」（販売・マーケティングで築く顧客基盤）の大きい企業に特化していることを示した（抄録）。", "p3": "売上に対する販売・マーケティング費、販売担当者の賃金、商標出願の傾向で顧客資本を測り、他の金融仲介者と比べた（抄録）。", "p5": "VCは知識資本が低く顧客資本が高い産業を狙い、企業は初回投資の前に顧客資本へ投資を傾け、その後急速に規模を拡大する。小口を多数に投じるVCは顧客資本産業を、多額を少数に投じるVCは知識資本産業を狙う。この傾向は過去30年の変化を反映する（抄録）。", "fun": "ベンチャー投資といえば、画期的な技術の研究開発を支えるイメージがあります。ところがこの研究によると、実際に好まれているのは、広告や営業で顧客を一気に増やす会社でした。大成功か失敗かの極端な結果が出やすい投資が、ベンチャーの「一発当てる」仕組みに合っているからだという説明が興味深いところです。", "unverified": "顧客資本の測定の妥当性の検討は抄録からは確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "TRIPS後のインド製薬業の研究開発と競争", "title": "The Long March to Innovation: R&D and Competitive Evolution in the Indian Pharmaceutical Industry", "url": "https://doi.org/10.3386/w35916", "authors": "Chirantan Chatterjee ほか", "venue": "NBER Working Paper", "why": "知的財産保護の強化がインド製薬業の研究開発と競争の進化に与えた影響を分析した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパー（書籍の章）の抄録を読んだ", "preprint": true, "short": true, "p1": "TRIPS協定後のインド製薬業で新薬の開発パイプラインが伸び悩んだのは、知的財産権の強さとは別の制約のためだと論じた（抄録）。", "p3": "Biomedtrackerの治験段階の移行データで、中国と英国を比較対象に段階間の移行を調べ、業界専門家への聞き取りで補強した（抄録）。", "p5": "インドの開発パイプラインは第1相から第2相への移行に詰まりがあり、第1相から第3相への移行では差がなかった。企業内では新規性の低い開発への移行が見られた（抄録）。", "fun": "特許を強く守れば、会社は安心して新薬開発に投資する、と教科書は教えます。しかしインドでは、特許を強めて20年たっても新薬開発は伸びませんでした。開発の途中の特定の段階でつまずいていることから、法律以外の壁があると論じています。制度だけ整えても技術は育たない、という教訓が読み取れます。", "unverified": "制約の具体的な中身（資金、人材など）は抄録からは確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "フードデリバリーはコンビニの売上を奪わない", "title": "Online-Offline Synergy: Food Delivery and Convenience Stores", "url": "https://doi.org/10.2139/ssrn.7629759", "authors": "Ruomeng Cui ほか", "venue": "SSRN", "date": "2026-10-19", "why": "オンラインの宅配プラットフォームの拡大がオフラインの小売に与える影響を調べ、相乗効果の可能性を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "フードデリバリーの普及がコンビニの売上を奪うのではなく、むしろ増やしうることを中国のデータで示した（抄録）。", "p3": "中国のサービス基盤との協力で54店のコンビニの数十品目の月次取引のパネルを作り、最大のデリバリー基盤の飲食店掲載データと結合して、二元固定効果と操作変数で因果効果を推定した（抄録）。", "p5": "地域のデリバリー飲食店が100店増えるとコンビニの売上は約6%増えた。その一因として在庫の減少（家での買い置きの消費）による仕組みを挙げている（抄録）。", "fun": "スマホで料理を頼めるようになると、コンビニでお弁当を買う人は減りそうです。ところが実際には、近所にデリバリーの店が増えるとコンビニの売上は伸びていました。出前と一緒に飲み物やお菓子を買い足すなど、生活の流れが変わるからかもしれません。ネットと実店舗が奪い合うだけではない関係が見えてきます。", "unverified": "もう一つの仕組みと品目別の効果は抄録の範囲では確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "経営学", "headline": "プラットフォームのデータの価値はどこから来るか", "title": "The Source of Data Value: Consumer Disclosure, Access Design, and Platform Monetization", "url": "https://arxiv.org/abs/2610.22864", "authors": "Hexiao Liu ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "消費者の情報開示とアクセス設計がプラットフォームのデータ販売収益を決める仕組みをモデル化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "消費者の情報開示の権利が、プラットフォームの販売者向けデータサービスの収益化と厚生をどう左右するかをゲーム理論で分析した（抄録）。", "p3": "手数料型のプラットフォーム、差別化された2つの販売者、プライバシーを気にする消費者のモデルで、データの価値を販売者の売上増と情報を持つ競合からの脅威に分けた（抄録）。", "p5": "強制収集のもとでは、個別化が売上を下げても防衛的なデータ購入で収益化できる。任意開示では一方的な開示が魅力的でなく、独占的アクセスは使える情報を生まず防衛的な料金も消える。収益の整合は厚生の改善を保証しない（抄録）。", "fun": "ネット通販の会社は、手数料だけでなく「お客のデータ」を出店者に売って稼ぐこともあります。出店者がデータを買うのは、売上を伸ばすためだけでなく、ライバルに先を越されないための防衛でもあります。消費者に情報を出すかどうかを選ばせるルールにすると、この防衛のための商売が成り立たなくなる、という結論が面白いところです。", "unverified": "厚生が下がる条件の詳細は抄録からは確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "組織行動・心理的安全性", "headline": "FRB議長は時間をどう配分しているか", "title": "Inside Central Bankers’ Calendars: How Do Fed Chairs Allocate Their Time?", "url": "https://doi.org/10.3386/w35913", "authors": "Thomas Drechsel ほか", "venue": "NBER Working Paper", "why": "中央銀行のトップの日程表を構築・分析し、指導者が限られた時間と注意をどう配分するかを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "バーナンキ、イエレン、パウエルの3人のFRB議長の日程表（2万件超）を構築し、指導者が限られた時間をどう配分したかを分析した（抄録）。", "p3": "日々の予定表の記録を分類し、傾向と景気循環の頻度での変化を調べ、グリーンスパンなど以前の議長の資料とも比べた（抄録）。", "p5": "どの議長も記録された会合の30%超をFRBの職員と過ごした。メディアとの接触はバーナンキ期に増え、パウエルは前任者より議員との会合が有意に多かった（抄録）。", "fun": "世界で最も影響力のある経済の責任者は、毎日誰と会っているのでしょうか。2万件の予定を数えると、3割以上を部下のエコノミストとの打ち合わせに使っていました。最近の議長ほど政治家と会う回数が増えているという結果は、中央銀行が政治との距離に苦心している様子を映しています。", "unverified": "景気循環に応じた時間配分の変化の具体的な結果は抄録からは確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "偽発見数の強く整合的な信頼包絡", "title": "On strongly coherent confidence envelopes for the false discoveries", "url": "https://arxiv.org/abs/2610.22601", "authors": "Romain P\\'erier ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "多重検定での整合性の概念を偽発見数の信頼包絡に拡張した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多重検定での「整合性」だけでは手続きが改善不能であることを保証しないことを示し、より強い「強整合性」の概念を導入した（抄録）。", "p3": "偽陽性の数に対する信頼包絡について、文献で考えられてきた内挿による改善の仕組みを検討し、強整合性ならそれで改善できないことを示した（抄録）。", "p5": "Durand et al. (2020)の信頼包絡を一様に改善する、多項式時間で計算できる方法を与え、シミュレーションで改善を示した（抄録）。", "fun": "たくさんの仮説を一度に検定すると、偶然「当たり」に見えるものが混ざります。そこで「この中に間違いは何個以下」と幅で示す方法がありますが、この論文はその幅をまだ狭くできる場合があることを見つけ、改善の余地がない状態を厳密に定義しました。統計の道具を限界まで磨き上げる研究です。", "unverified": "改善の大きさの数値は抄録からは確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "共形検定マルチンゲールの情報幾何的な死角", "title": "Information-Geometric Blind Spots of Conformal Test Martingales", "url": "https://arxiv.org/abs/2610.23131", "authors": "Johan Hallberg Szabadv\\'ary", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "交換可能性の逐次検定に使う共形検定マルチンゲールが検出できない対立仮説の構造を情報幾何で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "逐次的に交換可能性を検定する共形検定マルチンゲールには、適合度関数の像を変えない分布の変化を検出できない「死角」があることを情報幾何で定式化した（抄録）。", "p3": "適合度関数Aによる同値類を定義し、任意の目標分布に対しKLダイバージェンスで最も近い元（A-暗号的I射影）が一意に存在し、検出可能な成分と隠れた成分にピタゴラス分解できることを示した（抄録）。", "p5": "Aがネイマン-ピアソンの尤度比なら隠れた成分は消える。EMNISTの文字をMNISTの数字と同じ適合度スコアになるよう再標本化すると、支持が完全に異なる分布に変えても検定は反応しなかった（抄録）。", "fun": "データの性質が途中で変わったら知らせてくれる見張り役の統計手法があります。ところが、見張りが見ている「点数」さえ同じなら、中身が数字から文字にすっかり入れ替わっても気づかない、という盲点をこの論文は示しました。何を見張るかを選んだ時点で、見えないものが決まってしまうという教訓です。", "unverified": "実験での検定統計量の推移の具体的な値は抄録からは確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "重い裾の応答に頑健な局所フレシェ回帰", "title": "Robust Local Fr\\'echet Regression: Nonasymptotic Theory and Minimax Optimality", "url": "https://arxiv.org/abs/2610.23757", "authors": "Chang Jun Im ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "一般の距離空間に値をとる重い裾の応答に対する頑健な局所回帰を提案し、非漸近理論と最適性を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "一般の距離空間に値をとる重い裾の応答に対し、頑健な局所フレシェ回帰と距離に基づく中央値平均推定量を提案し、非漸近理論と最適性を示した（抄録）。", "p3": "局所的な2次の滑らかさと局所的な1-Wasserstein Hölder連続性のもとで、それぞれ高確率の点ごとの誤差上界を導き、ガウス回帰の部分クラス上でミニマックス下界を示した（抄録）。", "p5": "最適化した収束速度は古典的なノンパラメトリック回帰の点ごとの速度と一致し、応答空間のエントロピー条件を必要としない。正定値行列やWasserstein値の応答で頑健性と効率のトレードオフを示した（抄録）。", "fun": "普通の回帰分析は数値を予測しますが、世の中には行列や確率分布そのものを予測したい場面もあります。しかも、ときどき極端に外れた値が混ざると、平均を使う方法は大きく狂ってしまいます。この研究は、データをいくつかの組に分けて平均を取り、その中央値を使うという工夫で、外れ値に強い方法を作りました。", "unverified": "実データの応用の内容は抄録からは確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "立て続けに起きる変化点を検出する", "title": "Closely spaced change-point detection with an application to geopolitical shocks in oil and gas markets", "url": "https://arxiv.org/abs/2610.23476", "authors": "Nachiketas Waychal ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "短い間隔や標本の端で起きる変化点の見落としを減らす検出法を提案し、石油・ガス市場に適用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "立て続けに起きる変化点や標本の端の近くの変化点を見落としにくくする検定統計量I_1とアルゴリズムDCIを提案した（抄録）。", "p3": "ガウス雑音のもとでI_1の帰無分布の極限を導き、弱従属系列に拡張し、平均シフトの対立仮説での一致性を示した。大域的な走査と適応幅の窓での局所検定を組み合わせる二段階の算法を作った（抄録）。", "p5": "シミュレーションで真陽性・偽陽性・位置の誤差・分割の被覆の基準でパレート最適だった。2026年の米イラン紛争への応用で、エネルギー市場の地政学的ショックへの感応を新しい2つの指標で定量化した（抄録）。", "fun": "相場が急変した時点を見つけるのは統計の得意分野ですが、大事件が短い間隔で続くと、間に挟まれたデータが少なすぎて変化を見逃しがちです。この研究は、全体を見渡す方法と局所を細かく調べる方法を組み合わせ、続けざまの変化も拾えるようにしました。", "unverified": "応用で得られた具体的な変化点の時期は抄録からは確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "多重共線性下の予測強化型リッジ推定", "title": "Prediction-powered ridge estimation under multicollinearity", "url": "https://doi.org/10.2139/ssrn.7634887", "authors": "Yongchang Hui ほか", "venue": "SSRN", "date": "2026-10-19", "why": "補助的な予測を利用する推論と、多重共線性に対するリッジ推定を組み合わせた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "機械学習などの補助的な予測を使う予測強化型推定に、多重共線性に強いリッジ罰則を組み合わせたPP-Ridgeを提案した（抄録）。", "p3": "予測成分と補正成分に共通のリッジ罰則をかけ、母集団のリッジの目標値を保つ。漸近正規性を示し、標本サイズ比と予測の系統誤差によって分散が小さくなる十分条件を導いた（抄録）。", "p5": "有限標本での改善は予測の質に依存し、さまざまな共線性と罰則の水準で持続した。マクロ経済への応用では回帰誤差の低下と係数の安定性が記述的に示された。一様な優越は主張しない（抄録）。", "fun": "説明変数どうしがよく似ていると、回帰係数がぐらついて解釈しにくくなります。一方、手元のラベル付きデータが少なくても、AIの予測を補助に使えば推定を安定させられます。この研究は二つの工夫を組み合わせ、どんな条件なら得をするかを理論で示しました。", "unverified": "マクロ経済への応用の対象と数値は抄録からは確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "GPT-6-Astraは身体知能に到達したか", "title": "Has GPT-6-Astra Achieved Embodied Intelligence?", "url": "https://arxiv.org/abs/2610.22471", "authors": "SenseNova ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "why": "最新モデルのロボット操作と移動の能力を評価し、身体性を持つ知能の従来の考え方を問い直した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "大規模モデルGPT-6-Astraのロボット操作と移動の能力を大規模に評価し、身体性を持つ知能の研究に何を意味するかを論じた報告（抄録）。", "p3": "卓上操作、人型、移動体、多指ハンドにわたる12のベンチマークを、学習デモからの文脈内学習と実行ステップの大幅な増加を許す統一プロトコルで評価し、高レベルの推論器と低レベルの制御器の協調や8種のロボット構成での実機展開も調べた（抄録）。", "p5": "統一プロトコルでかつてない性能を示した一方、文脈内学習の一般性、コストと時間、物理状態の確認、不可逆な失敗からの回復、長期の進捗の保持に課題が残り、実機展開では大きな隔たりがあった（抄録）。", "fun": "これまでロボットは、作業ごとに専用のAIを訓練するのが当たり前でした。ところが言葉を扱う汎用の大規模モデルに、見本を数個見せるだけで多くのロボット作業をこなせるようになってきました。それでも、実際のロボットではうまくいかない場面が多く、取り返しのつかない失敗から立ち直る力がまだ足りないという指摘が重要です。", "unverified": "ベンチマークごとの成功率の数値は抄録からは確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "VLMが3D空間で考え探索することを学ぶ", "title": "Learning to Think and Explore in 3D World", "url": "https://arxiv.org/abs/2610.21783", "authors": "Yijiang Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "why": "視覚言語モデルが多視点画像を与えられずに3D空間を能動的に探索し推論する学習方法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "視覚言語モデルが、1枚ずつの視点画像から自分で動いて3D空間を探索し、質問に答えることを学ぶ方法ACT3Dを示した（抄録）。", "p3": "3D表現を環境として扱い、モデルは一人称の初期視点から推論・移動・向き変えを繰り返して最終回答を出す。軌跡の教師ありの微調整のあと、最終回答の正しさを主な報酬とする強化学習で探索方針を学ばせた（抄録）。", "p5": "6つの3Dベンチマークで平均正答率53.2%を達成し、基盤のQwenモデルを22.0%上回り、Gemini 3.6 Flashも上回った。既存のオープンな3D手法より50〜70%少ない入力で優れていた（抄録）。", "fun": "部屋の様子を答えるとき、人は全方向の写真を一度に見るのではなく、少しずつ歩き回って確かめます。このAIも同じように、1枚ずつ景色を見ながら自分で動き回ることを学びました。しかも「どこを見るべきか」は誰も教えておらず、正解できたかどうかだけから探索のコツを身につけた点が面白いところです。", "unverified": "探索の歩数と効率の詳細は抄録からは確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "長期タスクのエージェントにオブジェクト指向の文脈を", "title": "Pack Light, CarryOn: Building Object-Oriented Context for Long-Horizon Agents", "url": "https://arxiv.org/abs/2610.18784", "authors": "Yuchen Lu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "why": "長い作業を行うエージェントの履歴をオブジェクト指向の文脈として構造化し、効率を高める方法を提案した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "長時間作業するエージェントの文脈を、過去の履歴ではなく再利用できる「進捗のオブジェクト」を中心に組み立てる実行環境CarryOnを提案した（抄録）。", "p3": "継続のための記録、補完的な実行文脈、直近のやりとりから文脈を作り、履歴を捨てたあとも、影響を受けた記録だけを証拠と環境の確認で更新し、残りは引き継ぐ（抄録）。", "p5": "OSWorld 2.0とBrowseComp-Plusで成績がそれぞれ5.8%と7.0%向上し、総トークン使用量を51.9%と22.9%減らした（抄録）。", "fun": "長い作業をしていると、「何をしてきたか」の記録がどんどん増えて、読み返すだけで大変になります。このAIは、経緯を全部覚えておく代わりに、「今どこまでできているか」を整理した荷物だけを持ち運ぶようにしました。旅行の荷物を軽くまとめるように、記憶を身軽にして成績も上げた点が面白いところです。", "unverified": "記録の更新に失敗した場合の影響は抄録からは確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "同じモデルの追加計算は独立な証拠ではない", "title": "Not All Test-Time Compute Is Evidence: Model-Specific Bias in LLM Reasoning", "url": "https://arxiv.org/abs/2610.23213", "authors": "Ming Shen ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "推論時の計算を増やす手法が前提とする独立性が、モデル固有の偏りで崩れることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "同じ推論モデルに計算を追加しても誤りが相関するため独立な証拠にならないことを示し、不一致のときだけ異なるモデルに独立に解かせる方法DIAを提案した（抄録）。", "p3": "推論の途中段階と最終段階の予測の不一致を不安定さの信号とし、そのときだけ異種のモデルの小さなパネルに、候補を見せずに独立に解かせて答えを集計する（抄録）。", "p5": "7つのベンチマークと2つの基盤モデルで、14条件中12で完全な思考連鎖を上回り、MuSiQueで7.00%向上した。発動は約17%の問題だけで、多エージェントの比較手法よりトークンを最大47.2%減らした（抄録）。", "fun": "同じ人に何度考え直させても、同じ思い込みで同じ間違いをすることがあります。AIも同じで、たくさん考えさせても独立した意見にはなりません。この研究は、AIが迷っているときだけ別のAIたちに相談させるという、人間の「セカンドオピニオン」に似た発想で精度と効率を両立させました。", "unverified": "不一致の判定基準の詳細は抄録からは確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "言語モデルが言語モデルの改良を学ぶ", "title": "Language Models Learn to Improve Language Models", "url": "https://arxiv.org/abs/2610.23344", "authors": "Minhua Lin ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "LLMにLLM開発の研究を自動化させる試みとして、言語モデル自身が言語モデルの改良を学ぶ方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMに強化学習で「言語モデルの改良案」を出させる方法LM2LMを提案し、高価な実験の代わりに研究世界モデルを報酬に使う仕組みを作った（抄録）。", "p3": "凍結したLLMに実際の実験記録を文脈として与え、改良案の効果を予測させる研究世界モデル（RWM）を報酬モデルとし、方策の分布のずれによる過大評価を防ぐため、RWMが高く評価した案を定期的に実際に実行して記録に加える（抄録）。", "p5": "本物の評価では1案あたり約10 GPU時間、数万案で数十万GPU時間かかることを動機としている。性能の向上幅は抄録の範囲では確認できなかった（抄録）。", "fun": "AIにAIの改良法を考えさせ、うまくいったら褒めて伸ばす。理想的ですが、案を一つ試すたびに大きなモデルを訓練し直すので、とても高くつきます。そこで「この案ならこれくらい良くなりそう」と予想する別のAIを審判に使い、ときどき本当に試して審判の目を正すという工夫をしています。AIが自分で研究する未来への一歩です。", "unverified": "改良案の実際の効果の数値は抄録からは確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "線形プローブで読めても線形表現とは限らない", "title": "Is a Linear Probe Evidence of a Linear Representation?", "url": "https://arxiv.org/abs/2610.22655", "authors": "Nadir Kutluozen ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "線形プローブの成功を線形表現の証拠とみなす慣行を検証し、その解釈の限界を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "線形プローブ（特徴から属性を線形に読み出す分類器）の高い精度は、モデルが属性を線形に表現している証拠として不十分であることを示した（抄録）。", "p3": "十分に豊かな特徴写像ならランダムなものでも線形の読み出しを許すため、真の線形な世界モデルと、潜在変数が大きな曲がった多様体の中に線形に乗る「カーネル機械」とを区別できない。逆予測性、スペクトルの集中、分布外汎化の3つの非対称な診断を提案した（抄録）。", "p5": "正解が分かるシミュレーションで診断を検証し、6つの事前学習済み視覚Transformerに生成的ベンチマークSVG-Worldで適用した。CelebAでも、事前学習がランダム特徴を超える構造を生むことを示したとしている（抄録）。", "fun": "AIの頭の中に「笑顔の度合い」のような概念がまっすぐ並んでいるかを調べるとき、直線で読み取れたら「ある」と判断するのが定番でした。ところが、でたらめな特徴でも量が多ければ直線で読めてしまうことがあります。この論文は、本当に整理されて並んでいるのか、たまたま読めただけなのかを見分ける方法を示しました。", "unverified": "各診断の具体的な結果は抄録の範囲では確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "生成的な組織でエージェントの知能を育てる", "title": "OfficeTown: Generative Organizations for Evolving Agent Intelligence", "url": "https://arxiv.org/abs/2610.23194", "authors": "Hongchen Wei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "why": "ファイルやツールを使う専門的な作業を、組織の文脈ごと生成した環境でエージェントに学ばせる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "組織の目的と活動の説明文から仮想の職場を生成し、継続する業務の中でエージェントを評価・学習させる枠組みOfficeTownを作った（抄録）。", "p3": "生成された組織の構成員が仕事を調整し、補助エージェントに限定的な業務を委ね、成果物をレビューする。成果物・決定・未解決事項が残って後の仕事を形づくり、責任と権限で見えるものとできることが決まる（抄録）。", "p5": "8分野23組織から406課題と4,836の評価基準を持つOfficeTown Benchを作り、最先端モデルにも大きな改善の余地があった。このデータでの微調整と蒸留はQwen3.5-9Bの外部の専門業務ベンチマークの成績を大きく改善した（抄録）。", "fun": "会社の仕事は、一つ一つの作業が独立しているわけではなく、前の会議の決定や過去の資料、上司のコメントの積み重ねの上に成り立っています。この研究は、そうした「職場の文脈」ごと仮想の会社を作り出し、AIにそこで働かせて鍛えようとしています。AIの評価を、単発のテストから職場での働きぶりへ広げる発想です。", "unverified": "改善の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "ベイズモデル平均で縦断的な処置効果を推定", "title": "A Bayesian model averaging approach for estimating longitudinal treatment effects", "url": "https://arxiv.org/abs/2610.23578", "authors": "David Adenyo ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "縦断データの平均処置効果の推定で、交絡変数の選択をベイズモデル平均で扱う方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "縦断的な処置（時間とともに変わる処置）の因果効果を推定するとき、調整変数の選択をベイズモデル平均で行う方法を提案した（抄録）。", "p3": "縦断的な処置の方針のもとでの反実仮想の平均と周辺構造モデルのパラメータを、ベイズモデル平均で推定し、分散が最小になる調整変数の集合を選びやすい情報事前分布を設計した（抄録）。", "p5": "シミュレーションで全変数を調整する推定量を上回り、いくつかの場面で神託推定量に近い性能だった。スタチンの累積曝露の実データでは標準誤差が大きく減った（抄録）。", "fun": "薬を何年も飲み続けた効果を調べるとき、年齢や持病など調整すべき要因が時間とともに変わり、どれを考慮すべきか迷います。全部入れると推定がぶれやすく、減らしすぎると偏ります。この研究は、いろいろな選び方の結果を確率の重みで平均するという方法で、偏りを抑えつつ推定を安定させました。", "unverified": "実データでの効果推定値は抄録からは確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "条件付き独立を超える因果探索の識別と推論", "title": "Causal Discovery beyond Conditional Independence: Identifiability, Algorithms, and Statistical Inference for Directed Acyclic and Cyclic Graphs", "url": "https://arxiv.org/abs/2610.23543", "authors": "Yang Ni", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "非巡回・巡回グラフについて、条件付き独立以外の仮定による因果構造の識別、算法、統計的推論を体系化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ（総説）", "preprint": true, "short": true, "p1": "条件付き独立性を超える性質を使う現代の因果探索の方法を、識別の源・推定量・計算の実装に分けて体系化した総説（抄録）。", "p3": "分布の非対称性、条件付きモーメント制約、環境や個体間の変動を条件付き独立の方法と結び、潜在交絡やフィードバック（巡回グラフ）のもとでの探索、一致性と不確実性の定量化と算法の保証を区別して整理した（抄録）。", "p5": "同じ観測分布でもモデルのクラスによって異なる結論が支持されうることを例で示し、方法を比較するための指針を示した（抄録）。", "fun": "データから「何が原因で何が結果か」を見つけるのは、統計の中でも特に難しい問題です。昔は「この二つは他を固定すると無関係」という手がかりに頼っていましたが、最近は分布の形の左右非対称さや、環境による変化なども使われます。この総説は、何を仮定すると何が言えるのかを整理し、手法を正しく比べる地図を描いています。", "unverified": "総説であり、新しい実証結果は含まれないと考えられる（抄録の範囲）。"}}, {"id": "pn44", "rank": 44, "field": "因果推論", "headline": "関数型アウトカムで処置効果の異質性を検定", "title": "Testing Treatment Effect Heterogeneity with Functional Outcomes", "url": "https://arxiv.org/abs/2610.23397", "authors": "Yongzhen Feng ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "時間や空間に沿った関数として観測される結果について、処置効果の異質性を検定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "時間に沿った関数として観測される結果について、処置効果の異質性を、共通の効果を推定せずに検定するノンパラメトリックな方法を提案した（抄録）。", "p3": "群内の差の分布を比べることで未知の共通関数効果を消し、特性汎関数の積分二乗不一致で差を測る。重なる差の依存を考慮した不偏一般化U統計量を作り、帰無・固定対立・局所対立での極限と乗数ブートストラップを導いた（抄録）。", "p5": "多群への拡張と、ランダム方向の近似と9状態の再帰による標本サイズに線形の計算量を示した（抄録）。", "fun": "薬の効き目が一日の中で時間とともに変わる場合、「効果は人によって違うのか」を調べるのは難しくなります。この方法は、同じ群の中の二人の差を比べるという工夫で、平均的な効果の形を知らなくても、人による違いがあるかを検定できます。未知のものを推定せずに消してしまう、という発想が巧みです。", "unverified": "シミュレーションと実データでの検出力は抄録からは確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "交通・都市計画", "headline": "メキシコシティの交通投資がもたらした外部性", "title": "Externalities of Mexico City's 2018-2024 Mobility Program", "url": "https://doi.org/10.2139/ssrn.7631339", "authors": "David Antonio Ortega Alfaro", "venue": "SSRN", "date": "2026-10-19", "why": "2018〜2024年の公共交通インフラへの大規模投資の外部効果を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "メキシコシティの2018〜2024年の公共交通への投資と地下鉄の閉鎖が、周辺の道路事故に与えた影響を推定した（抄録）。", "p3": "歴史的に周縁化された地域に新しいバス路線・ロープウェイ・トロリーが開業し、保守のため地下鉄が閉鎖された状況を使い、差の差の設計とマッチングで影響を受けた地域の事故報告を比べた（抄録）。", "p5": "地下鉄の閉鎖は道路事故を20%増やし、マッチングでも結果は頑健だった。開業と閉鎖の双方に統計的に有意な効果があり、開業は事故を減らしたとしている（抄録）。", "fun": "地下鉄が止まると、乗っていた人はバスや車、自転車に移ります。すると道路が混み、事故も増えるかもしれません。この研究は、工事による閉鎖を「自然の実験」として使い、事故が2割増えたことを示しました。公共交通の価値は、乗る人の便利さだけでなく、道路の安全にも及ぶことが分かります。", "unverified": "開業による減少の大きさは抄録の途中までしか確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "交通・都市計画", "headline": "生成エージェントの都市移動を実調査に合わせる", "title": "Towards Adaptive and Real-Survey-Aligned Simulated Urban Mobility Behaviour of Generative Agents", "url": "https://arxiv.org/abs/2610.22407", "authors": "Yves Bru ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "生成エージェントによる多手段の都市移動シミュレーションを、実際の調査に整合させる方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "トゥールーズの日常の多手段移動のエージェントモデルで、LLMの生成エージェントの交通手段の選択を実際の世帯交通調査に合わせられるかを調べた（抄録）。", "p3": "単純な基準、調査に当てはめたモデル、最小限と調整済みのプロンプトの生成エージェント、型付き分類器など15の意思決定器を、実際の世帯交通調査に対して比較した（抄録）。", "p5": "比較の結果は抄録の範囲では確認できなかった。", "fun": "街の交通をコンピュータで再現するとき、人の乗り物の選び方は、調査票にある項目だけで決めるのが普通でした。でも実際は、天気や気分、その日の予定など、調査に書かれない理由でも選んでいます。言葉で考えるAIの住人なら、そうした理由も持ち込めるかもしれない、という期待を実データで確かめる試みです。", "unverified": "15の意思決定器の比較結果は抄録からは確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "交通・都市計画", "headline": "ハイブリッド勤務時代の通勤の逆説", "title": "The Commute Paradox -How Urban and Sustainable Offices Shape Commutes in the Hybrid-Work Era", "url": "https://doi.org/10.2139/ssrn.7631378", "authors": "Avis Devine ほか", "venue": "SSRN", "date": "2026-10-19", "why": "持続可能で都心にあるオフィスへの集中が、ハイブリッド勤務下の通勤に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "在宅・ハイブリッド勤務の時代に、持続可能で都市的なオフィスが通勤距離をどう変えたかをカナダのデータで調べた（抄録）。", "p3": "独自のオフィス市場・環境認証・移動のデータを組み合わせ、2021年半ばのオフィス再開後の通勤距離の変化を三重差分で推定し、トロントとカルガリーの事例で換算した（抄録）。", "p5": "環境認証の建物がある地域は床面積あたりの訪問が有意に多かった。在宅勤務の多い地域では通勤距離が減ったが、都市的で持続可能な特徴はこの減少のほとんど、または全部を打ち消した（抄録）。", "fun": "在宅勤務が広がれば、通勤の距離や回数は減るはずです。ところが、おしゃれで環境に配慮したオフィスが集まる地域では、人々が遠くからでもそこへ通うようになり、通勤距離の減少が帳消しになっていました。環境に良いビルが、結果として移動を増やすという逆説がタイトルの由来です。", "unverified": "事例での追加走行距離の数値は抄録からは確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "YouTubeの誘惑を自分で選んで制限するUI", "title": "SwitchTube: A Proof-of-Concept System Introducing \"Adaptable Commitment Interfaces\" as a Tool for Digital Wellbeing", "url": "https://arxiv.org/abs/2610.22947", "authors": "Kai Lukoff ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "利用者が事前に関与の度合いを選べる「適応的コミットメント・インターフェース」をデジタルwell-beingのために提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "YouTubeで「集中」と「探索」の画面を利用者が切り替えられる「適応的コミットメント・インターフェース」のアプリSwitchTubeを作り、実地で評価した（抄録）。", "p3": "検索優先の集中モードと推薦優先の探索モードを切り替えられるモバイルアプリを開発し、米国の46人で3週間の実地展開を行った（抄録）。", "p5": "切り替えられることで、利用者の主体感、満足度、目的との一致が高まった（抄録）。", "fun": "勉強のためにYouTubeを開いたのに、おすすめ動画につられて気づけば1時間、という経験は多くの人にあるでしょう。おすすめを全部消すと、今度は必要な動画まで見つけにくくなります。この研究は、自分でモードを切り替えるだけで、誘惑とうまく付き合えることを示しました。禁止より選択という発想が面白い点です。", "unverified": "効果の大きさと統計的な検定の結果は抄録からは確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "VRでLLMの応答待ちをどう感じさせないか", "title": "Wait for It: A Component-Level Analysis of Latency Feedback Mechanisms for LLM Agents in VR", "url": "https://arxiv.org/abs/2610.23336", "authors": "Pratham Arora ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "VR内のLLMエージェントの応答遅延に対するフィードバックの仕組みを構成要素ごとに評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "VR内のLLMエージェントの応答待ちに対する3種類のフィードバック（言葉のつなぎ、読み込み表示、考える身振り）を比べ、身振りが最も良いことを示した（抄録）。", "p3": "18人の参加者内実験で、「えーと」などの言葉、ローディングの回転表示、考えるアニメーションを個別に比較した（抄録）。", "p5": "身振りは読み込み表示より多くの面で有意に優れ、エージェントをより生き生きと社会的に感じさせた。読み込み表示は人間らしさを下げ、没入を壊した（抄録）。", "fun": "話し相手が考えている間、くるくる回る読み込みマークが出ると、急に「これは機械だ」と思い出してしまいます。一方、腕を組んで考え込むしぐさなら、相手が考えている感じがして会話が続きます。待ち時間そのものではなく、待ち時間の見せ方で相手の人間らしさが変わるという発見が面白いところです。", "unverified": "参加者が18人と少なく、効果量は抄録からは確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "ヒューマンコンピュータインタラクション", "headline": "AIは開発者に何を新しく可能にしたか", "title": "\"To Boldly Go Where No One Has Gone Before\" What Has AI Let Developers Unlock?", "url": "https://arxiv.org/abs/2610.23708", "authors": "Rudrajit Choudhuri ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "why": "AIの価値を作業の速さではなく、開発者が新たに手がけられるようになったことで測る視点を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "AIの価値を作業の速さではなく「新しく何ができるようになったか」で測るため、Microsoftの開発者331人の回答を分析した（抄録）。", "p3": "AIで以前はできなかった何ができるようになったかを尋ね、人が介在する複数モデルのAI評議会を使った省察的主題分析で回答を分析し、ヴィゴツキーの発達の最近接領域の考え方で解釈した（抄録）。", "p5": "慣れた作業を速くする（45%）、以前は手が届かなかった作業に取り組む（36.9%）、AIエージェントのために作り指示する新しい種類の仕事（12.4%）に分かれた。AIは自分の仕事を確実に判断するより速く技能を提供するため、開発者がその差を埋め続ける必要があるとした（抄録）。", "fun": "電気が工場にもたらした本当の価値は、蒸気機関の時代の機械を速く回したことではなく、工場の作り方そのものを変えたことでした。この論文はAIも同じだと考え、「速くなった」だけでなく「できなかったことができるようになった」を数えました。AIの腕前に人間の判断力が追いつけるかが分かれ道だという指摘が鋭いところです。", "unverified": "二つの道の結論部分は抄録の途中までしか確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "走行車両の振動で鉄道橋の洗掘を機械学習で検出", "title": "Leveraging Bridge Scour Detection by Multi-Model Machine Learning and Drive-By Data", "url": "https://doi.org/10.3390/s26206612", "authors": "Sinem Tola ほか", "venue": "Sensors", "date": "2026-10-19", "citescore": 9.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "内部統制の弱い銀行ほど住
