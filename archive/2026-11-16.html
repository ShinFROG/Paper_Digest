<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

、本体の論文は入手できなかったため、何をもって良いとするか（同定誤差の基準など）は未確認。サンプリング間隔 Δt = 0.001 s を用いると記されている（§S1）。", "p5": "結果の数値は補足資料にない。導出上の帰結として、残差は左右の路面が違っても通り道ごとに成り立つ一方で凹凸が励起した橋の振動は残ること、遅れτがサンプリング間隔の整数倍でないときは丸めず実際の時刻で評価すべきこと、FFTの長さは橋長÷速度ではなく有効な前後の対の区間で決まることを示した（式S30–S33）。", "p6": "係数0.95と0.5は3本のつり合い式から一意に決まらず再構成はこの配分に条件づけられること、車輪と接触点の初期加速度0は初期化の仮定であることを著者が明記している（§S1–S2）。解釈：一定速度と既知の車両パラメータ（ばね・減衰・タイヤ・質量・慣性）が前提で、配分の選び方が同定結果に与える影響は本体の論文で確かめる必要がある。", "fun": "橋の上を走る車の揺れには、橋の揺れと道路のでこぼこが混ざっている。この方法は、前輪と後輪が同じでこぼこを少しの時間差で踏むことを利用し、後輪の記録を時間差の分だけずらして引き算する。すると、でこぼこの分が消えて橋の揺れの変化だけが残る。ただし、でこぼこが引き起こした橋の揺れまでは消えない、と著者自身が注意している点も面白い。", "unverified": "本体の論文（数値例・実験・同定精度・フィルタとFFTの設定）は入手できず、手法の性能は未確認。配分係数0.95と0.5を選んだ根拠は補足資料に書かれていない。"}}, {"id": "pr02", "rank": 2, "headline": "被弾した高層住宅を携帯端末で簡易に振動監視", "title": "Limited Structural Health Monitoring of Damaged Multi-Storey Buildings in the Combat Zone", "url": "https://doi.org/10.5281/zenodo.24222966", "authors": "Kaliukh ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Kaliukh, I., Banakh, V., Banakh, A., Hrebeniuk, I., Hrebeniuk, O., Meshkov, K., Shtokal, D., Polevetskiy, V., Melashenko, Y., Ischenko, Y., Pavliuk, Y., Siedin, V., Kovba, V., Berchun, Y., & Dmytrenko, Y. (2026). Limited Structural Health Monitoring of Damaged Multi-Storey Buildings in the Combat Zone. Zenodo. https://doi.org/10.5281/ZENODO.24222966", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "fibの会議論文集のPDFのうち該当論文（方法、キーウの建物の調査結果、考察、結論の節と表1）を読んだ", "preprint": true, "p1": "交戦地域で兵士が一時的に使う損傷した高層建物について、資格のない人でも行える簡易な監視（外観・傾き・ひび割れ幅・携帯電話による固有振動数）の手順を提案し、ミサイル被弾後のキーウの26階建て住宅の調査から、固有振動数の低下が隠れた劣化の指標になると論じた（§2–3、未査読の会議論文）。", "p2": "建物の損傷監視（SHM）の既存の基準や手法は資格のある人と専用のセンサを前提とし、前線で建物に入れるか、いつ退避すべきかという2つの問いに答える手段がなかった（§1）。", "p3": "SHMの7つの公理のうち「材料には欠陥がある」「損傷の評価には2つの状態の比較が要る」の2つだけを使う。入る前に外観・下げ振りによる傾き・下層のひび割れ幅を指示書の値と比べ、入った後は上層の傾き、下層のひび割れ、床に置いた携帯電話のアプリで測る低次の固有振動数を初期値と比べ続け、振動数の下がる速さで退避を判断する（§1–2、§3.3）。", "p4": "交戦地域の実データはないため、2022年2月26日にミサイルが当たったキーウの住宅の詳細調査（2022年4〜5月）を例とし、同じ設計・同じ地盤に建つ隣の無損傷の住宅と固有振動数を比べ、強度・たわみ・鉛直度を基準の許容値と比べた（§3）。", "p5": "1・16・22・26階の卓越振動数（表1、例：26階で0.8281・2.8281・5.8281 Hz）は隣の建物より10〜15%低く、損傷した22階だけでなく1階と26階でも下がっていた（§3.3）。柱のコンクリート強度は16.6〜33.6 MPaで15〜50%低下し、20階の柱の耐力と軸力の比は0.89〜0.9で緊急の区分「4」と判定された（§3.2、§3.4）。", "p6": "著者は、外観だけで入れるかを判断する妥当性や、退避の判断に必要な最小限の情報量を未解決の問いとし、手法は不完全で不正確だと認めている（§4）。解釈：携帯電話による計測そのものの精度は検証されていない。", "fun": "がれきの中の建物が崩れ始めているかどうかは、外から見ても分からない。この研究は、床に置いたスマートフォンで建物の揺れの「音程」（固有振動数）を測り、その音程が下がっていくことを危険のサインにしようと提案する。実際に被弾した26階建ての住宅では、隣の同じ設計の建物より振動数が10〜15%低く、壊れた階から離れた1階でも下がっていた。内部の傷みが建物全体の揺れ方に表れる点が面白い。", "unverified": "表1の計測機器と計測方法、隣の無損傷の建物の振動数の値、指示書の閾値の数値は確認できない。抄録の強度低下（30〜50%）と本文（15〜50%）が食い違い、本文の値を採った。"}}, {"id": "pr03", "rank": 3, "headline": "揺れる駐車車両の映像から地震の速度パルスを推定", "title": "Estimating bounds on coherent acceleration and velocity pulses from video-recorded rocking of vehicles in Caraballeda during the Mw 7.5 Venezuela earthquake", "url": "https://doi.org/10.31223/x55f9v", "authors": "Evangelia Garini ほか", "venue": "EarthArXiv", "date": "2026-11-15", "apa": "Garini, E., Restrepo, J., Gazetas, G., Wu, B., & Gonzalez, R. G. (2026). Estimating bounds on coherent acceleration and velocity pulses from video-recorded rocking of vehicles in Caraballeda during the Mw 7.5 Venezuela earthquake. https://doi.org/10.31223/x55f9v", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "EarthArXivのPDF（序論、車両モデル、解析結果、重い車両の検討、鉛直成分の検討、結論の節と表1–7）を読んだ", "preprint": true, "p1": "強震計のなかったベネズエラのMw 7.5地震の被災地で、防犯カメラに映った駐車中のSUVの大きな横揺れ（片側の車輪の浮き上がり）を非線形の揺動モデルで再現する逆解析により、地盤動の速度パルスの範囲（卓越周期1.5〜2.5 s、速度1.2〜1.85 m/s、加速度0.42〜0.55 g）を絞り込んだ（結論、未査読のプレプリント）。", "p2": "被害の大きかったラ・グアイラ州の町には稼働中の強震計がなく、断層近傍の破壊の指向性による大振幅の速度パルスを直接記録したデータがなかった（序論）。", "p3": "車を、引張に抵抗しない左右の鉛直ばね・ダッシュポット、横ばね、クーロン摩擦（μ = 0.80）の上の剛体として、横移動・上下動・回転の3自由度で解き（式2–5）、近断層記録（1995年神戸の葺合EW、2014年ケファロニアのLixouri EW）に当てはめた理想化パルスの振幅を変えて入力する。例：ダイハツ・テリオス（1,050 kg）の全接触時の揺動周期は約0.91 sで（式1）、浮き上がると周期が伸びる。", "p4": "映像のコマ送りと遠近補正で求めた最大回転角38° ± 3°（表1）に計算の最大回転角を合わせることを基準とし、Gaborと別型（M&P）のパルス、2つの元記録、鉛直剛性などを変えて感度を調べ、より重いジープ（1,900 kg、観測13〜20°）の揺れの再現で整合性を確かめた（表2–6）。", "p5": "葺合のGaborでは A ≈ 0.48 g、V ≈ 1.24 m/s で38°を再現し、0.51 gで転倒した（表2）。周期を2.1 sに伸ばすと0.45 g・1.60 m/sで40°、M&P型では0.54〜0.55 gが必要だった（表3）。同じ入力でジープは22°（Lixouri版では19.6°）と観測の上限に近く、鉛直成分を加えても最大回転角の変化は±2〜3%だった（図26）。", "p6": "著者は、推定は唯一の加速度記録の再構成ではなく観測と整合する地盤動の族であり、高周波成分を除いているため実際のPGA（0.60〜0.80 gと試算）は推定より大きい可能性があると明記している（結論）。解釈：車両の諸元は文献からの代表値で、映像の角度の不確かさ（35〜41°）が振幅の推定に直結する。", "fun": "地震計がない町で、地面がどれほど激しく揺れたのかを知る手がかりは、防犯カメラに映った駐車中の車だった。車の片側が浮き上がるほどの揺れを、ばねの上に載った箱の動きとして計算し、映像の傾きと一致する揺れの強さを逆算した。重い車がそれほど傾かなかったことも答え合わせに使っている。身の回りの物を「地震計」に変える発想が面白い。", "unverified": "図9–26の時刻歴の細部と、表6の全組み合わせの数値は確認していない。遠近補正の誤差の評価方法の詳細は確認できていない。"}}, {"id": "pr04", "rank": 4, "headline": "因果の制約を守る反実仮想説明で離職を防ぐ処方", "title": "SCAFFOLD-CF: Causally Constrained Counterfactual Recourse for Employee Turnover and Attrition", "url": "https://doi.org/10.5281/zenodo.24242055", "authors": "Faisal Bin Al-Abid ほか", "venue": "Zenodo", "date": "2026-11-15", "apa": "Faisal Bin Al-Abid, Aryati Bakri, Hasin Jawad Ali, Md. Ashiful Hoque Chowdhury Tanbin, Roliana Binti Ibrahim, Md. Golam Rabiul Alam, M. Abdullah-Al-Wadud, & Jia Uddin. (2026). SCAFFOLD-CF: Causally Constrained Counterfactual Recourse for Employee Turnover and Attrition. Zenodo. https://doi.org/10.5281/ZENODO.24242055", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF（序論、データ、因果構造、手法、結果の表8・15・16、考察、結論の節）を読んだ", "preprint": true, "p1": "反実仮想説明（予測を覆すには何を変えればよいかの提示）で、宣言した因果の規則に反する候補を硬いフィルタで捨てる手法SCAFFOLD-CFを提案し、離職の2つのデータで、返した説明の規則への適合を100%にしつつ、費用・分布への適合との釣り合いを保てることを示した（考察、未査読）。", "p2": "既存の手法は説明を近く・変更を少なく・もっともらしくするが、特徴を独立に変えられるものとして扱うため、原因を変えれば結果も変わるという因果の構造に反する説明を返し、因果を目的の一つに入れる手法（ProCE）も違反を残す（序論）。", "p3": "特徴を不変（年齢・性別など）・直接変えられる・下流（規則の結果）に分け、規則を「原因が1段変われば結果も決まった向きに1段以上変わる」とし（§3.4）、介入の候補集から結果を伝播させた候補を作り、予測の妥当性・因果の許容性・局所密度・確信度の余裕で選別して、4目的のパレート前線から多様な説明を選ぶ（§3.5）。", "p4": "インドネシアの大学教員527人の離職意図と、サウジアラビアの民間企業の従業員1,191人の離職の調査データで（表3）、ランダムフォレストの予測を対象に、既存の11手法と軟制約版を、費用・分布への適合・因果の3群の指標と、重みを20万回乱数で引くSMAA（確率的多基準受容性分析）で比べ、5つの乱数種で平均した（§3–4、表15）。", "p5": "ProCEは返した説明の14.4%と13.9%で規則に反し、軟制約版は54.3%と28.0%で反した一方、SCAFFOLD-CFは問い合わせの10.45%と6.56%で回答を控えた（表8、考察）。離職意図ではSMAAで首位になる重みの割合が51.48%（偶然の水準7.69%）だったが、回答しないことへの罰λが0.79を超えると常に回答するProCEに抜かれ、離職のデータではλ = 0.02以上で首位になった（表15–16）。", "p6": "著者は、データが横断的な観察データで規則は仮定した構造にすぎず介入後の結果は扱えないこと、離職の規則を同じ訓練データから選んだこと、分類器が1種類で費用の指標が変化量の代理にすぎないことを限界とする（考察）。", "fun": "「この社員が辞めないためには何を変えればよいか」をAIに聞くと、現実の因果のつながりを無視した答えが返ることがある。この研究は、規則に反する答えを最初から捨てる「門番」を置いた。その代わり、答えられない人が1割ほど出る。間違った答えを出すより黙る方がよいのかという判断を、黙ることへの罰の重さを変えて比べた点が面白い。", "unverified": "表9–14の個々の指標（近さ・変更数・もっともらしさ）の値と、規則の一覧（表6）の中身は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "連合学習で反実仮想説明が学習データを漏らす", "title": "Privacy Leakage of Counterfactual Explanations in Federated Learning", "url": "https://doi.org/10.5281/zenodo.24247281", "authors": "Molinari, Lorenzo", "venue": "Zenodo", "date": "2026-11-15", "apa": "Molinari, L. (2026). Privacy Leakage of Counterfactual Explanations in Federated Learning (Version 1.0) [Zenodo]. https://doi.org/10.5281/ZENODO.24247281", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoの修士論文のPDF（実験の枠組み、第4章の結果の表4.1・4.2・4.4・4.6、結論の章）を読んだ", "preprint": true, "p1": "連合学習で予測器と反実仮想説明の生成器を同時に学習すると、学習データの所属を推定する攻撃（MIA：membership inference attack）の成功率が上がり、DP-SGD（差分プライバシー付きの学習）は黒箱攻撃には効くが精度を大きく下げることを、MNISTの実験で示した修士論文（第4章、第6章、未査読）。", "p2": "連合学習はデータを共有しないが、全体のモデルからの情報の漏洩は予測器だけを対象に調べられてきた。決定境界を表に出す反実仮想説明が加わると攻撃の手がかりが増えるが、その影響は未検討だった（§4.1）。", "p3": "MNISTとLeNet-5で、15のクライアントがFedAvgで15回通信し、予測器とVCNetによる反実仮想の生成器を同時に学習する枠組みを作り、予測（と反実仮想）だけを見る黒箱攻撃と、勾配も見る白箱攻撃にMIAを拡張した（§3.1、§4.2）。例：クライアントの学習データが8件だとモデルが個々のデータを丸暗記し、攻撃が当たりやすい。", "p4": "予測器のみ、予測器+DP、予測器+反実仮想、予測器+反実仮想+DPの4構成で、クライアントあたり8〜2,048件の学習データについて、MIAの正解率（50%が当て推量）とモデルの精度を5つの乱数種で比べた（§4.2）。DPはクリップ1.0、ε = 5.0とした（§4.3.3）。", "p5": "予測器のみでは8件で白箱80.2%・黒箱65.0%で、64件を超えると約50%に近づいた（表4.1）。反実仮想を加えると黒箱の成功率は最大35.4ポイント上がり（16件で88.6%対53.2%）、平均で黒箱6.5、白箱9.0ポイント増えた（§4.3.2、第6章）。DPは反実仮想ありで黒箱を平均13.5ポイント下げたが、予測器のみでは精度を平均11.8ポイント下げた（表4.4、表4.6）。", "p6": "著者は、プライバシーと精度の両立の難しさと、結果がデータ量と設定に強く依存することを認め、クライアントや層ごとに適応するDPを今後の課題とする（§5.2）。解釈：予測器のみの精度は少データで偶然の水準（8件で9.9%）にとどまり、反実仮想ありの精度（51.6%）と大きく違うため、比較に学習の成否の差が混ざる可能性がある。", "fun": "「どこを変えればAIの判定が変わるか」を示す説明は親切だが、それは同時にAIの判断の境目を外に見せることでもある。この研究では、説明を付けると、ある人のデータが学習に使われたかを当てる攻撃の成功率が、条件によって最大35ポイントも上がった。分かりやすさとプライバシーが引っ張り合う関係を数字で示した点が面白い。", "unverified": "表4.5の標本数ごとの値、図5.2の層ごとのDPの結果、反実仮想の質の指標の値は確認していない。表形式のデータでの検証はない。"}}, {"id": "pr06", "rank": 6, "headline": "LLMの一対比較で品目を潜在尺度に並べる", "title": "LLM-Based Measurement of Latent Attributes in Trade Data", "url": "https://doi.org/10.31235/osf.io/t8wdg", "authors": "Matthew DiGiuseppe ほか", "venue": "SocArXiv", "date": "2026-11-14", "apa": "DiGiuseppe, M., Fu, X., & Flynn, M. E. (2026). LLM-Based Measurement of Latent Attributes in Trade Data. https://doi.org/10.31235/osf.io/t8wdg", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF（序論、手順、3つの応用、結論の節と表1–5）を読んだ", "preprint": true, "p1": "LLMに貿易品目（HS6桁）の説明を2つずつ比べさせ、ベイズのBradley-Terryモデルで研究者が定義した概念の連続的な尺度（不確実性つき）に5,000超の品目を並べる方法を示し、女性向けの消費・軍事的な重要度・ホルムズ海峡の封鎖への曝露の3つの応用で妥当性を確かめた（未査読のプレプリント）。", "p2": "HSの分類は関税の事務のために作られており、研究者の関心のある概念（軍民両用品など）で5,000超の品目を手作業で分類するのは高価で、二値の分類は程度の違いを捉えられず、専門家も全品目の用途は知らない（序論）。", "p3": "品目ごとに無作為に15〜20組の対を作り、LLMに「どちらが概念により近いか（引き分け可）」を判定させ、引き分けは勝敗を無作為に割り振って、Pr(i > j) = e^λi /(e^λi + e^λj)（式1）で各品目の位置λを事前分布つきで推定する。直接点数をつけさせると回答が固まりやすいため、一対比較で細かな差を引き出す（Workflowの節）。", "p4": "①Betzらの「ピンク・タックス」の再現（最終消費財1,481品目、関税を国と年の固定効果つきで回帰）、②軍事的な重要度と6つの規制リストの一致（AUC）と米国防総省の調達との順位相関、③学習データにない2026年3月のホルムズ海峡の封鎖への曝露の尺度が、数か月後の輸出入の単価の変化を予測するか、で評価した（表3–5）。", "p5": "女性向けの尺度が1標準偏差高い品目は平均関税が1.32ポイント高く、性別を明記した品目を除いても1.20だった（表3）。軍事的な重要度は規制リストをAUC 0.79〜0.92（武器・弾薬は0.99）で予測し、260億と2,350億パラメータのモデルはほぼ同等だった（表4）。曝露の尺度は封鎖前の1〜2月（プラセボ）では無関係で、4か月後の輸入単価は尺度1標準偏差あたり0.028対数ポイント（約2.9%）上がった（表5）。", "p6": "著者は、規制リストとの一致は学習データの記憶による可能性があること、引き分けの多い課題（女性向けで61%）では無作為の割り振りが雑音を加えること、LLMの提示順の偏りに注意が要ることを挙げる（序論、Workflowの節）。解釈：封鎖直後の輸入単価の係数は負（−0.013、p = 0.06）で、効果が遅れて出る理由は取引契約の仕組みによる説明にとどまる。", "fun": "「この商品はどれくらい女性向けか」を5,000以上の品目に点数で付けろと言われたら、人間でも迷う。そこでAIに「AとBのどちらがより女性向けか」と2つずつ比べさせ、その勝ち負けからスポーツのランキングのように全体の順位を作った。さらに、AIが知らないはずの海峡の封鎖のあとで本当に値上がりした品目を当てられるかで答え合わせをした点が面白い。", "unverified": "付録の表A2（キーワード・類似度の指標との比較）と、図4の部門ごとの順位相関の全数値は確認していない（国防総省0.44、NASA 0.52のみ本文で確認）。"}}, {"id": "pr07", "rank": 7, "headline": "隙間を柔らかい仮想材料で埋める接触解析を一次要素で", "title": "Robust third medium contact with linear and higher-order finite elements via a C0 interior penalty regularisation.", "url": "https://doi.org/10.5281/zenodo.24225970", "authors": "Masó ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Masó, M., Martínez-Frutos, J., Poya, R., & Ortigosa, R. (2026). Robust third medium contact with linear and higher-order finite elements via a C0 interior penalty regularisation. Zenodo. https://doi.org/10.5281/ZENODO.24225970", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF（序論、提案する正則化、数値的な工夫、ベンチマークの結果、結論の節と表2・6・8）を読んだ", "preprint": true, "p1": "物体間の隙間を極めて柔らかい仮想材料（第3媒体）で埋めて接触を扱う有限要素法で、要素の境界での変形勾配とヘッセ行列の飛びに罰則を課す正則化と頑健なニュートン法を組み合わせ、一次要素の第3媒体でも自己接触・座屈・大変形を安定に解けるようにした（§3.3、§6、未査読）。", "p2": "第3媒体接触は接触点の探索なしに接触を滑らかに扱えるが、押しつぶされた第3媒体の要素が折れ曲がり、ニュートン法が要素の反転や接線の不定値化で破綻しやすい。既存の正則化は要素内だけに働き、多くは二次要素や追加の自由度を要した（§1）。", "p3": "要素内のヘッセ行列の罰則に、第3媒体の内部の面での変形勾配の飛び [[F]]（メッシュの折り目に当たる）とヘッセ行列の飛びの罰則を加え（式23）、整合項・対称項を省いて罰則係数によらず非負にした。解法は、ヤコビアンが刻み幅の多項式であることから要素が反転しない最大の刻みを閉形式で求め、エネルギーのArmijo探索と固有値の切り詰めを組み合わせる（§3.3、§4）。例：一次要素では要素内のヘッセ行列は恒等的に0だが、面の飛びの罰則は0にならない。", "p4": "既存のベンチマーク（自分自身に閉じるC字形、空洞が押しつぶされる箱、室内で座屈するピストン）で、固体と第3媒体の6通りの離散化を同じパラメータで解き、節点-線分法（NTS）の参照解との変位・反力の差と、しわの大きさ（面の飛びの99.9パーセンタイル）で評価し、衝突の動的問題にも拡張した（§5）。", "p5": "C字形では最大の変位差 eB が0.22〜0.34（既存の第3媒体法の最良は0.167）で、全経路で参照解に沿った（表6）。箱では面の飛びの罰則で最大のしわが2.5〜3.5分の1になった（表8）。Armijo探索がないと一次要素のピストンは uy/d = 3.2 で止まり、あると14.2まで進んだ（表2）。", "p6": "著者は、物体が離れた後の第3媒体の扱い（無効化や再メッシュが必要）と、提案した正則化がひずみ勾配材料の離散化ではなくメッシュに依存する数値的な工夫であることを未解決とする（§6）。解釈：箱の反力は収束解でも参照解より15〜18%低い場合があり、精度は離散化によって差がある。", "fun": "2つの物体がぶつかる計算は、どこが触れるかを毎回探さなければならず、コンピュータにとって厄介だ。そこで物体のすき間を見えないスポンジで埋め、押しつぶされたスポンジの反発で接触を表す方法がある。ただしスポンジ役のメッシュは押しつぶされると折れ曲がってしまう。この研究は、その折れ目そのものに罰を与えるという単純な工夫で計算を安定させた点が面白い。", "unverified": "表6・表7の離散化ごとの全数値と、2次元・3次元の衝突の例（例4・例5）の定量的な結果は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "井戸へ向かう自由水面の地下水流を1次元方程式で", "title": "One-dimensional model equations for unsteady axisymmetric free-boundary potential flow in porous media", "url": "https://doi.org/10.31223/x5dz5p", "authors": "Carmine Di Nucci ほか", "venue": "EarthArXiv", "date": "2026-11-15", "apa": "Di Nucci, C., Shadab, M. A., Fischione, P., Celli, D., Pasquali, D., & Di Risio, M. (2026). One-dimensional model equations for unsteady axisymmetric free-boundary potential flow in porous media. https://doi.org/10.31223/x5dz5p", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EarthArXivのPDF（序論、モデルの導出、数値解と検証、VarSatFlowとの比較、結論の節と表1–2）を読んだ", "preprint": true, "p1": "不圧帯水層で井戸へ向かう非定常の軸対称な自由水面流れを、鉛直流れの効果を含む1次元の運動量式と連続式に縮約し、自由水面・井戸の水位・浸出面（井戸壁で水がにじみ出る部分）の時間変化を、境界積分方程式法（BIEM）の結果とほぼ一致して再現した（§4–5、未査読）。", "p2": "1次元の古典的な近似であるDupuit-Forchheimer近似は鉛直流れを無視するため、井戸近くの曲率の大きい自由水面や浸出面をうまく扱えず、BIEMや有限要素法は正確だが計算が重い（§1）。", "p3": "渦なし・非圧縮の速度場をピカール反復で逐次近似し、第3近似の鉛直速度とダルシー則から q/(2πkr) = ∂/∂r [h²/2 + h³/(6πkr) ∂(q/h)/∂r]（式40）を導き、連続式 ∂q/∂r = 2πrη ∂h/∂t（式42）、軸対称のコーシー積分関係（付録A）、井戸の質量収支で閉じる（§3–4）。解釈：右辺の第2項が鉛直流れの補正で、これを除くとDupuit型の式になる。", "p4": "Lennonらの揚水井戸の問題（BIEMの結果）と無次元で比べ、自由水面の形の差を初期水位で正規化した最大差・二乗平均差・井戸近傍の差で評価した（表1）。さらに、井戸の水位を急に下げて保つ条件で、不飽和域も扱うVarSatFlowの飽和度0.999の等値線の高さと比べた（表2）。", "p5": "BIEMとの差は最大2.9%以下、二乗平均1.4%未満で、井戸近傍の局所差は t̃ = 1.4 のとき最大約2.0%だった（表1）。井戸の水位は定常値 h̃w = 2.5 に近づき、浸出面は急増・極大・極小・再増加という非単調な変化を示した（図3–4）。VarSatFlowより井戸近傍の水面を6.8〜7.9%高く予測した（表2）。", "p6": "著者は井戸近傍で差が出ることを認め、VarSatFlowとの差は鋭い自由境界と飽和度の閾値という定義の違いにもよるとする（§4.5）。解釈：均質・等方・変形しない媒体、水平な不透水基盤、毛管水帯の無視という仮定のもとの結果で、不均質な地盤への適用は未検証。", "fun": "井戸で水をくみ上げると、周りの地下水の水面がすり鉢状に下がっていく。この形を正確に求めるには重い計算が要るが、この研究は流れの式を工夫して1本の線の上の式（1次元）に縮め、それでも詳しい計算とほぼ同じ答えを出した。井戸の壁で水がにじみ出る部分の高さが、増えたり減ったりしながら落ち着く様子まで再現できる点が面白い。", "unverified": "表1の時刻ごとの全数値と、付録B・Cの数値解法とVarSatFlowの設定は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "家族介護者を支えるデジタル技術の総説を総まとめ", "title": "Digital Technologies Supporting Informal Caregivers of Older Adults: Review of Reviews (Preprint)", "url": "https://doi.org/10.2196/preprints.116906", "authors": "Sirrý Sif Sigurlaugardóttir ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Sigurlaugardóttir, S. S., Șoitu, D.-T., Korkmaz Yaylagul, N., Pivorienė, J., TOFAN, C. M., & Armağan, M. B. (2026). Digital Technologies Supporting Informal Caregivers of Older Adults: Review of Reviews (Preprint). https://doi.org/10.2196/preprints.116906", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を使用。本文は取得できず", "preprint": true, "p1": "高齢者の家族介護者（無償のケアの担い手）を支えるデジタル技術についての総説36本を統合し、知識・自信・支援へのアクセス・安心・ケアの段取りには一貫した効果がある一方、負担・精神的健康・生活の質への効果は一貫しないことを示した（抄録、査読前のプレプリント）。", "p2": "介護者を支えるデジタル技術の証拠は、対象・技術・質の異なる多数の総説に散らばっており、全体として何が言えるかが整理されていなかった（抄録）。", "p3": "登録したプロトコルとPRISMA 2020に沿い、2025年4〜5月に7つのデータベースで過去20年の英語の査読つき総説を検索し、60歳以上を介護する無償の介護者へのデジタル支援を扱う系統的な総説を2人が独立に選別・抽出し、AMSTAR 2（系統的レビューの質の評価ツール）で質を評価して叙述的・主題的に統合した（総説の総説：review of reviews）（抄録）。", "p4": "評価の対象は、技術の機能、介護者への影響、採用と継続利用を左右する障壁と促進要因で、効果の主張の強さは各総説のAMSTAR 2の信頼度で判断した（抄録）。", "p5": "192件から2016〜2025年の総説36本（系統的17、スコーピング16、アンブレラ2、迅速1）を含め、53%（19本）が認知症・認知機能障害の介護だった。技術は教育、心理社会的な支援、連絡と調整、遠隔相談、見守りに使われ、介護の仕事を減らさず移し替えることや、プライバシーと自律の懸念もあった。AMSTAR 2の信頼度は中1本、低2本、極めて低い33本（92%）だった（抄録）。", "p6": "著者は、総説の質が低いため効果の主張は限られるとし、より厳密で長期的、包摂的な評価が必要だとする（抄録）。解釈：英語の総説に限っているため、非英語圏の実践の知見は含まれない可能性がある。", "fun": "スマホのアプリやオンライン相談で、家族を介護する人を助けようという試みは多い。ところが36本の総説をまとめると、知識や安心感は確かに増えるのに、介護の大変さそのものが減るかははっきりしなかった。道具が仕事を減らすどころか、確認や操作という新しい仕事を生むこともある。便利な技術が本当に人を楽にしているのかを問い直す点が面白い。", "unverified": "本文を読めておらず、個々の総説の結論、技術の種類ごとの効果の大きさ、障壁の詳細は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "在宅技術は介護の負担を減らすのか、移すのか", "title": "The Burden of Care and Home Technologies", "url": "https://doi.org/10.5281/zenodo.24248339", "authors": "Nogarotto, Luca", "venue": "Zenodo", "date": "2026-11-15", "apa": "Nogarotto, L. (2026). The Burden of Care and Home Technologies (Version 1.4). Zenodo. https://doi.org/10.5281/ZENODO.24248339", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF（問いと方法、負担の構成、技術の効果と負担の移転、正味の負担、文献の欠落の節）を読んだ", "preprint": true, "p1": "在宅の支援技術が家族介護者の負担を減らすのか移すのかを13の文献から批判的に検討し、効果はおおむね小さく、仕事を移し替える技術もあるとして、減った仕事と増えた仕事の差である「正味の負担（net burden）」で評価すべきだと提案した（§6.4、未査読の企業の研究ノート）。", "p2": "在宅技術は介護の仕事を減らす手段として勧められるが、負担の尺度は機器の保守・誤報の確認・訪問の減少のような新しい仕事や損失を捉えず、知的障害のある成人の家族についての証拠はほとんどなかった（§2.1、§9）。", "p3": "系統的レビューではなく、9本の総説（メタ分析1、系統的6、スコーピング2）、二次分析1、パイロット研究1、WHO-UNICEFの報告、イタリア統計局の報告の13の文献による批判的な叙述レビューで、各文献の記述を原文と照合し、執筆に加わらない査読者が文ごとに再確認した（§2.2–2.3）。例：見守りの警報は安心を生む一方、警報が本物かの確認や電池交換という新しい仕事を生む（§6.3）。", "p4": "効果の大きさは無作為化比較試験だけを含むメタ分析（Zhouら、2024）の標準化平均差で判断し、新しい仕事やリスクは質的研究や事例の記述から拾い、機能ごとの便益と負担の移転を表1に並べて比べた（§6.1、§6.4）。", "p5": "高齢者の介護者1,010人を含む14試験の統合効果は、負担尺度で標準化平均差−0.13（95%信頼区間−0.25〜0.00、I² = 34%）と小さく、対照群が順番待ちなら−0.30、通常ケアなら−0.05だった（§6.1–6.2）。電動車いすでは利用者の44%が介助者の実務上の問題を報告し、デジタルの介入の脱落率は8〜25%だった（§6.3）。", "p6": "著者は、文献の検索の時期・検索語・選択基準を記録していないこと（§2.2）、便益の多くは無作為化試験から、負担の多くは質的研究や事例から得ていて証拠の強さが異なることを限界として明記し（§6.4）、見守りの労働の測り方と、知的障害のある成人の家族の証拠の欠如を未解決とする（§9）。", "fun": "見守りセンサーやアラームは、介護する家族を楽にするために置かれる。でも実際には、警報が鳴るたびに本当に何か起きたのか確かめたり、電池を替えたり、「鳴らないのは無事だからか、壊れたからか」と心配したりする仕事が増えることもある。この報告は、減った仕事と増えた仕事を差し引きして考えようと提案する。便利さの裏の「おつり」に目を向ける点が面白い。", "unverified": "表1の機能ごとの全項目と、§8（見守りとプライバシー、イタリアの法制度）の議論の詳細は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "共有記録を扱うLLMエージェントは協調に失敗する", "title": "Do LLM Agents Coordinate on Shared Records? Two Pre-registered Studies of Optional Protection on a Record API", "url": "https://doi.org/10.5281/zenodo.24226165", "authors": "Gopnal Swamy ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Gopnal Swamy, S. (2026). Do LLM Agents Coordinate on Shared Records? Two Pre-registered Studies of Optional Protection on a Record API (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.24226165", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF（序論、試験環境、研究2の結果、考察、限界の節と表2）を読んだ。71ページの補足資料は未読", "preprint": true, "p1": "複数のLLMエージェントが同じ業務記録（在庫・座席・口座など）を扱い、条件付き書き込みやロックを任意で使えるとき、競合があると保護の手段があっても整合性の失敗が増えることを、事前登録した2つの研究で示し、失敗の仕組みを特定した（抄録、§5、未査読）。", "p2": "マルチエージェントの評価では、エージェントが共有状態を読んでから書くまでの間に他者が書き込む競合が起き、既存の仕組みは同時実行の制御をエージェントの下の層に置くため、エージェント自身が保護を使うかを測る研究がなかった（序論）。", "p3": "版つきの記録の試験環境で、乱数種で決めるスケジューラがエージェントの読みを重ね、LLMの判定を使わない台帳の採点で、確定した意図をある順序で直列に実行すれば最終状態を再現できるか（直列化可能性）を判定する。保護なし・条件付き書き込み・ロック・両方の4設定で、各課題に私的な複製を持つ対照を付けた（§3、§5）。例：在庫の最後の数個を2人が同時に売ると、一方の更新が失われうる。", "p4": "研究2は事前登録した確認的な3モデル（Qwen3.6-27B、Haiku 4.5、Sonnet 5）と記述的なモデルで、7つの課題族（単一記録の4族と、制約が複数の記録にまたがる3族）を2エージェントで実行し、競合ありと対照の失敗率の差をHolm補正で検定した（§3、§5）。", "p5": "競合ありと対照の失敗率の差は、条件付き書き込みで0.38（95%信頼区間0.21〜0.54）、ロックで0.61、両方で0.30だった（表2）。条件付き書き込みでは失敗はすべて複数記録にまたがる課題で起き、ロックの失敗はほぼ「読んだ後にロック」「書く記録だけをロック」「ロックしない」の3つで、片側だけの送金35件中32件は両方の操作を1回の返答で送ったことによった（抄録、§5）。", "p6": "著者は、記録と課題が合成で8つの雛形に限られ、2エージェント・このスケジューラ・このツールの文面のもとでの結論であること、設計上主結果が出やすく、記述的・事後的な機構の分析が主な貢献であることを認める（限界、抄録）。解釈：完了していない送金を成功と報告したエージェントが21あり、最終報告の正しさは採点の対象外である。", "fun": "銀行の口座や店の在庫を2人のAIが同時に書き換えると、一方の更新が消えたり、お金が片方だけ動いたりする。人間のプログラマーはこれを「ロック」などの仕組みで防ぐ。この研究では、AIに防ぐ道具を渡しても、読んだあとにロックするといった順番の誤りで失敗し、失敗したのに「成功しました」と報告する例まであった。道具があることと正しく使えることは違う、という点が面白い。", "unverified": "補足資料の全統計と研究1の結果の詳細、記述的なモデル（GPT-5.5、Fable 5など）の結果の多くは確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "AIが課題をこなす時代の学ぶ価値と自己効力感の尺度", "title": "“When AI Can Do the Task, Is Learning Still Worth It and Am I Capable?” Scales for Learning Value and Self-Efficacy in the Context of AI and Links to AI Use and Academic Outcomes", "url": "https://doi.org/10.31234/osf.io/wvk6n", "authors": "Soheil Behdarvandirad ほか", "venue": "PsyArXiv", "date": "2026-11-14", "apa": "Behdarvandirad, S., & Mirpour, M. (2026). “When AI Can Do the Task, Is Learning Still Worth It and Am I Capable?” Scales for Learning Value and Self-Efficacy in the Context of AI and Links to AI Use and Academic Outcomes. https://doi.org/10.31234/osf.io/wvk6n", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "PsyArXivのPDF（方法、尺度の開発、因子分析、階層的回帰と媒介分析、考察、限界の節と表3・表4）を読んだ", "preprint": true, "p1": "生成AIが学業の課題を代行できる時代に、自分で学ぶ価値（LV-AI）と、AIに頼らずに学べるという自己効力感（LSE-AI）を測る短い尺度を開発・検証し、両者がAI利用と努力の負の関係を媒介しうることを示した（抄録、考察、未査読）。", "p2": "既存の尺度はAIを学習の対象や結果として測っており、AIが課題をこなせる状況の中での学習の動機づけ（期待-価値理論の価値と効力感）を測る道具がなかった（序論）。", "p3": "期待-価値理論に基づき、構成概念の定義から生成AIの助けも借りて候補項目を作って改訂し、探索的・確認的因子分析で2因子構造を確かめ、古典的な課題価値・自己効力感との弁別と、伝統的な年齢の学生と社会人学生の間の測定不変性を検討した（方法、結果）。例：「AIができる課題でも、自分で時間と努力をかけて学ぶ価値があるか」を問う。", "p4": "米国の学部生882人（Prolific、2026年3月、伝統的な年齢471人・社会人410人、注意確認などで15人を除外）で、AI利用・古典的な価値と効力感・学生の種別を統制した階層的回帰により、努力・継続意図・GPAへの増分の説明力（ΔR²）を評価した（方法、表4）。", "p5": "2因子モデルの適合は良好で（robust CFI = .993、RMSEA = .041）、信頼性はω = .81と.72だった（表3）。両尺度はAI利用と負に相関し（r = −.30と−.32）、努力にΔR² = .022（LV-AI β = .09、LSE-AI β = .10）、継続意図にΔR² = .015の増分を示したが、GPAには増分がなかった（ΔR² = .003）。AI利用と努力の負の関係（β = −.09）は、2尺度を加えると有意でなくなった（結果）。", "p6": "著者は、横断的な自己報告のデータであること、LSE-AIの平均分散抽出（AVE）が.46と基準の.50をやや下回ること、短い尺度のため下位の概念（特にコスト）を詳しく測れないこと、他の文化での再現が必要なことを限界とする（限界）。解釈：媒介分析は事後的で、因果の向きは特定できない。", "fun": "AIに頼めばレポートが書ける時代に、「それでも自分で学ぶ意味はあるのか」「AIなしでもできるのか」と感じる気持ちを測る物差しを作った研究だ。AIをよく使う学生ほど勉強の努力が少ない傾向があったが、その差の半分以上は、この2つの気持ちで説明できた。AIそのものより、AIを前にした学ぶ意味の感じ方が鍵かもしれない、という見方が面白い。", "unverified": "表3の競合モデルの全適合指標と、媒介分析の間接効果の推定値と信頼区間は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "台風の風の場を摂動させて高潮を確率予測", "title": "Cross-scale Probabilistic Storm Surge and Tide Forecasts: Impacts of Tropical Cyclone Wind Field Structure", "url": "https://doi.org/10.22541/essoar.15004678/v2", "authors": "William J. Pringle ほか", "venue": "ESS Open Archive", "date": "2026-11-14", "apa": "Pringle, W. J., Mani, S., Daneshvar, F., Penny, A. B., Brannan, A., Velissariou, P., Alaka, L., Zhang, Y. J., Moghimi, S., & Fritz, C. (2026). Cross-scale Probabilistic Storm Surge and Tide Forecasts: Impacts of Tropical Cyclone Wind Field Structure. https://doi.org/10.22541/essoar.15004678/v2", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録）を使用。本文はサイトで取得できず", "preprint": true, "p1": "熱帯低気圧による高潮と潮位を、非構造格子の流体モデルの小さなアンサンブルと機械学習の代理モデルを組み合わせた枠組み（UPSurgeML）で確率的に予測し、米国の14のハリケーンで、米国国立ハリケーンセンターの最新の確率的高潮モデル（P-Surge）と同程度の総合的な予測力を示した（抄録、査読前のプレプリント）。", "p2": "抄録には課題の明示がない。解釈：確率的な高潮予測には多数の流体計算が要り、台風の風の場の構造（非対称性など）の表し方が予測にどう効くかも問われていたと読める。", "p3": "非構造格子の流体モデルによる少数のアンサンブル計算を機械学習の代理モデルで補って確率分布を作り、風の場には一般化非対称Hollandモデル（GAHM）を使い、等風速半径を摂動させてアンサンブルを生成する新しい方法を開発した（抄録）。", "p4": "2008〜2024年に米国に上陸した14のハリケーンで、確率的な予測の技能の指標を、従来のHollandの風の場とGAHMの間、UPSurgeMLとP-Surgeの間で比べた（抄録）。評価指標の具体名は抄録にない。", "p5": "GAHMは従来のHollandの風の場に比べて確率的な技能の指標をわずかに高め、GAHMを使うUPSurgeMLの総合的な予測力はP-Surgeと同程度で、Gustav（2008）、Ike（2008）、Irene（2011）、Irma（2017）では予測の技能が上回った。Ike（2008）とHelene（2024）の顕著な先駆け高潮を捉えるには、広い計算領域と台風の風の場の両方が必要だった（抄録）。", "p6": "抄録には限界の記載がない。解釈：14事例の比較で事例ごとに優劣が分かれるため、総合指標の差の確からしさと、代理モデルが訓練の範囲の外でどこまで使えるかは本文で確認する必要がある。", "fun": "台風が来る前に「どこでどれくらい海面が上がるか」を確率で示すには、何十通りもの台風の進み方を計算しなければならない。この研究は、精密な計算は少しだけにして、残りをAIの代理モデルで補う方法を作り、国の公式の予測と肩を並べた。台風が着く前から海面がじわじわ上がる現象には、海の広い範囲を計算に入れる必要があると示した点も面白い。", "unverified": "本文を読めておらず、評価指標の種類と数値、代理モデルの構造、アンサンブルの規模は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "幼児期のスクリーン時間の影響は階層と性別で違う", "title": "Early Screen Time, Children's Mental Well-Being and Physical Health: Intersectional Inequalities by Socioeconomic Status, Gender and Ethnicity", "url": "https://doi.org/10.31235/osf.io/atsz5", "authors": "Beyda Çineli ほか", "venue": "SocArXiv", "date": "2026-11-15", "apa": "Çineli, B., & Gracia, P. (2026). Early Screen Time, Children’s Mental Well-Being and Physical Health: Intersectional Inequalities by Socioeconomic Status, Gender and Ethnicity. https://doi.org/10.31235/osf.io/atsz5", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF（データと測定、推定の方法、結果、考察と限界の節）を読んだ", "preprint": true, "p1": "豪州の縦断的な時間日誌データで、幼児期のスクリーン時間は平均すると子どもの心理社会的な健康にもBMIにもほとんど関係しないが、社会経済的地位（SES）・性別・民族の交差によって関係が異なり、低SESの男児の心理社会的な健康の低下や、女児・多数派の子のBMIの上昇に集中することを示した（§4、未査読）。", "p2": "スクリーン時間の研究は平均的な効果に注目し、子どもの健康の不平等がどの集団でスクリーンによって広がるのかを交差的に検討した縦断研究は少なかった（序論）。", "p3": "1時点前のスクリーン時間で次の時点の結果を予測する、子どもと調査波の固定効果つきの回帰（2WFE：Y_it = β1·Screen_{i,t−1} + β2·X_it + α_i + τ_t + ε_it）を推定し、性別・SES・民族との2要因・3要因の交互作用で集団ごとの関連を見る（§3.3）。例：同じ子どもの中でスクリーン時間が1時間増えたとき、次の時点のBMIがどれだけ変わるかを見る。", "p4": "LSACのBコホート（0〜7歳の4波）の3,230人・7,214観測で、親が15分刻みで記入した時間日誌のテレビ・コンピュータ・ゲームの時間（平日と週末を別に）を説明変数、心理社会的健康（PedsQLの下位尺度、0〜100）と測定したBMIを結果とし、親の健康・所得・家族構成を統制した（§3.1–3.3）。", "p5": "平均の関連は小さく、週末のスクリーン1時間あたりBMIは0.03単位（95%信頼区間−0.00〜0.06）で、心理社会的健康とは無関係だった（平日b = 0.13、週末b = 0.01）。一方、週末のスクリーンは低SESの男児の心理社会的健康を1時間あたり0.57点下げ（95%信頼区間−0.99〜−0.16）、BMIは女児（週末0.08）や多数派の子（週末0.06）で上がった（§4）。", "p6": "著者は、スクリーンの量だけを測り内容や使い方（教育か娯楽か、受動か能動か）を区別できないこと、先住民の子が77人と少なく推定が不正確なことを限界とする（§5）。解釈：多くの交互作用を検定しているため、個々の有意な結果には偶然が含まれうる。", "fun": "「スマホやテレビは子どもに悪い」と一言で言われがちだが、この研究では、平均するとほとんど影響は見えなかった。ところが家庭の経済状況と性別を組み合わせて見ると、所得の低い家庭の男の子では週末の画面の時間が心の健康の低下と結びつき、女の子では体重の増加と結びついていた。平均では見えない影響が特定の子どもたちに偏って現れる、という点が面白い。", "unverified": "付録の表A1–A4の全推定値と、多重比較の調整の有無は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "言語モデルで公式ナショナリズムの受容と拒否を測る", "title": "The Limits of Official Chinese Nationalism in Online Discourse: A Quantitative Text Analysis Using Language Models", "url": "https://doi.org/10.31235/osf.io/s4f5x", "authors": "Yihao Qian", "venue": "SocArXiv", "date": "2026-11-14", "apa": "Qian, Y. (2026). The Limits of Official Chinese Nationalism in Online Discourse: A Quantitative Text Analysis Using Language Models. https://doi.org/10.31235/osf.io/s4f5x", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（OSFに登録）を使用。本文は取得できず", "preprint": true, "p1": "中国のQ&Aサイト知乎（Zhihu）の民族に関する投稿を言語モデルの分類器で「受容・拒否・不明」に分け、公式のナショナリズム（中華民族の概念）の受け止め方は多様で、受容する投稿ほど有害な言葉が少なく、拒否する投稿では公式の語りが敵意の的になりうることを示した（抄録、査読前のプレプリント）。", "p2": "問いは、中華民族を一つの国民かつ包括的な民族共同体とみなす公式のナショナリズムを人々がどう受け止め、その限界はどこにあるかである（抄録）。", "p3": "公式のナショナリズムの5つの次元を定義し、言語モデルに基づく分類器で投稿の立場を3つに分け、多様性指数とロジスティック回帰で立場の分布と、有害な言葉と公式の語りへの類似の関係を調べ、BERTopic（文の埋め込みによるトピック抽出）で各立場の論拠を探った（抄録）。", "p4": "抄録には、分類器の精度の検証方法、投稿の件数・期間、比較の基準の記載がない（抄録）。", "p5": "オンラインの議論は多様なままで、受容する投稿は有害な言葉を含みにくく、拒否する投稿は公式の語りを敵意の対象にすることがあった。公式のナショナリズムは、共有された古代史と民族間の共通の絆を作るのに苦労し、正統派マルクス主義と漢民族中心の解釈からの挑戦を受けていた（抄録）。", "p6": "抄録には限界の記載がない。解釈：知乎の利用者は中国の人々全体を代表せず、削除された投稿は観察できないため、立場の分布には偏りがありうる。", "fun": "国が「私たちは一つの民族だ」と語るとき、ネットの人々は本当にそれを受け入れているのか。この研究はAIに大量の投稿を読ませ、賛成・反対・どちらとも言えないに分けた。すると賛成の投稿ほど言葉が穏やかで、反対の投稿では国の語りそのものが攻撃の的になることがあった。言葉の荒さから、意見の分かれ方の質まで測ろうとする点が面白い。", "unverified": "本文を読めておらず、投稿数と期間、分類器の精度、回帰の係数は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "学校での社会的処方は子どもの孤独を減らすか", "title": "INcreasing AdolesCent social and community supporT (INACT) Trial", "url": "https://osf.io/75ka6", "authors": "Daisy Fancourt ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-11-12", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OSF Preprintsの登録の抄録（OpenAlexから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "孤独感の高い児童生徒に対し、学校での社会的処方（専門の支援員が地域の活動につなぐ仕組み）が、学校職員による地域資源の紹介より孤独を減らすかを検証する無作為化比較試験の計画を示した（抄録）。", "p3": "イングランド4地域の31校から、3項目の孤独尺度で7点以上の5年生・7〜8年生355人を集め、訓練を受けたリンクワーカーによる社会的処方と、学校職員による紹介に1対1で個別に無作為に割り付ける（抄録）。", "p5": "主要評価は割付から3か月後の孤独で、3・6・12か月の孤独・well-being・健康などと費用対効果も評価する計画である。結果はまだ報告されていない（抄録）。", "fun": "「寂しい」と感じる子どもに、先生が「こんな活動があるよ」と紹介するだけで十分なのか、それとも専門の支援員が一人ひとりの興味を聞いて地域の活動まで伴走する方がよいのか。この試験はくじ引きで2つのやり方を割り当て、効果と費用の両方を比べる。人のつながりという測りにくいものを、薬の試験と同じ厳密さで確かめようとする点が面白い。", "unverified": "試験の結果（効果の大きさ・費用対効果）は未報告。リンクワーカーによる支援の回数・期間は抄録から確認できない。"}}, {"id": "pr17", "rank": 17, "headline": "カメラのサブピクセル計測と物理誘導学習で損傷同定", "title": "Subpixel Camera-Based Structural Damage Identification with Physics-Guided Deep Learning", "url": "https://doi.org/10.5281/zenodo.24235237", "authors": "Al Hajj ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Al Hajj, T. (2026). Subpixel Camera-Based Structural Damage Identification with Physics-Guided Deep Learning (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24235237", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は未取得", "preprint": true, "short": true, "p1": "合成したカメラ映像のサブピクセル変位追跡と梁の有限要素モデル、ニューラルネットワークを組み合わせ、構造の隠れた剛性低下の検知と位置の推定を、物理のみの手法より高い割合で行えることをシミュレーションで示した（抄録、未査読の個人の技術報告）。", "p3": "オイラー・ベルヌーイ梁のモデルから合成した撮影映像で変位を追跡し、固有振動数とモード形を推定して、雑音を考慮したニューラルネットワークで損傷を判定する。35の計算実験で、カメラの雑音、動きの拡大、環境の不確実さを調べた（抄録）。", "p5": "独立に生成した400の梁と76.8万枚の合成画像（動きの拡大なし）で、検知と正しい位置の推定を同時に満たした割合は84.0%（物理のみの基準手法は72.5%）、誤報率はどちらも3.0%だった。実験による検証はない（抄録）。", "fun": "橋や梁の揺れは目に見えないほど小さいが、カメラ画像の1画素より細かい動き（サブピクセル）を追えば、振動の変化から内部の傷を探せるかもしれない。この報告は、その仕組みをすべてコンピュータの中の仮想の梁と仮想のカメラで試し、AIを足すと見つかる割合が上がることを示した。本物の構造ではまだ確かめていないと自ら明記している点も大事だ。", "unverified": "ネットワークの構造、損傷の大きさの設定、環境の不確実さの与え方は抄録から確認できない。実構造物での性能は未検証。"}}, {"id": "pr18", "rank": 18, "headline": "AIによる社内試験の不正を倫理規程だけでは防げない", "title": "When the Code Is Not Enough: AI-Enabled Misconduct and the Limits of the IFAC Code in Professional Accounting Firms", "url": "https://doi.org/10.5281/zenodo.24248565", "authors": "Khalid, Taskin Reza", "venue": "Zenodo", "date": "2026-11-15", "apa": "Khalid, T. R. (2026). When the Code Is Not Enough: AI-Enabled Misconduct and the Limits of the IFAC Code in Professional Accounting Firms. Zenodo. https://doi.org/10.5281/ZENODO.24248565", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は未取得", "preprint": true, "short": true, "p1": "大手会計事務所でAIを使って社内のAI研修の試験を通過した不正を題材に、IFACの倫理規程は違反を明確に特定できるが、規程だけでは防げないことを論じた（抄録）。", "p3": "2026年2月のKPMGオーストラリアの事例を、功利主義と義務論、規程の誠実性と職業的専門能力・正当な注意の原則に当てはめ、不正の再発を許した内部統制と規制の条件を検討し、南アフリカのSteinhoffの会計不正と比べた（抄録）。", "p5": "規程の効果は試験の設計、事務所の統制、外部への報告義務に依存すると結論し、4つの実務的な提言を示した。事例ではパートナーが1万豪ドルの罰金を科され、同年度に20人超の不正が見つかったとされる（抄録）。", "fun": "AIの使い方を学ぶ研修の試験を、AIに解かせて合格した――笑い話のようだが、会計の専門家の世界で実際に起きた事例だ。倫理規程は「それは不誠実だ」とはっきり言えるが、規程があるだけでは人は止まらない。試験の作り方や組織の見張りの仕組みこそが鍵だという結論は、ルールと行動のずれを考える良い材料になる。", "unverified": "4つの提言の具体的な内容と、Steinhoff事件との比較の詳細は抄録から確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "AIは開示を安くするが信頼できる情報は安くしない", "title": "Algorithmic Gatekeepers: Artificial Intelligence, Financial Intermediation, and the Disruption of China’s IPO Market", "url": "https://doi.org/10.31235/osf.io/zm7ca", "authors": "Jin Yang", "venue": "SocArXiv", "date": "2026-11-14", "apa": "Yang, J. (2026). Algorithmic Gatekeepers: Artificial Intelligence, Financial Intermediation, and the Disruption of China’s IPO Market. https://doi.org/10.31235/osf.io/zm7ca", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "中国の新規株式公開（IPO）で、AIが開示の作成・検証・審査・価格づけに同時に入ると、情報を作る費用は下がるが信頼できる情報を作る費用は残る、という理論を7つの命題で示した（抄録）。", "p3": "シグナリング理論、認証の経済学、制度理論、AIを起業的な主体とみなす見方を組み合わせ、国家が組織する認証制度としてのIPO市場で、信頼性の残りの費用がどこへ移るかをたどる理論研究である（抄録）。", "p5": "命題には、AI生成の開示と情報量の逆U字の関係、仲介者の利得が評判から検証へ移ること、アルゴリズムに読みやすい発行体の有利、肯定的な感情の効果の転換点が早まることなどが含まれ、AIが市場の処理量を増やしつつ信号の情報量を下げうると説明する。実証は含まれない（抄録）。", "fun": "AIを使えば立派な開示書類を一瞬で作れる。でも、誰でも立派な書類を作れるなら、書類の立派さは「この会社は信頼できる」という信号にならなくなる。この論文は、情報を作るのが安くなるほど、本当に信頼できるかを確かめる作業の価値が上がると考える。安い情報があふれると確認が高価になる、という逆説が面白い。", "unverified": "命題を導く形式的なモデルの有無と、命題の検証方法は抄録から確認できない。実証データはない。"}}, {"id": "pr20", "rank": 20, "headline": "電動スクーターの苦情の6割超がサービスの遅れ", "title": "Enhancing Electric Scooter Reliability: An Assessment of Product Defects and After-Sales Service Quality", "url": "https://doi.org/10.5281/zenodo.24231179", "authors": "Abhijith VR ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-15", "apa": "Abhijith VR, Shijoy Shibu, Abeen Binoji, Arjun Sujith, Abhijith M, Vignesh V, Roshin T V. (2026). Enhancing Electric Scooter Reliability: An Assessment of Product Defects and After-Sales Service Quality. Zenodo. https://doi.org/10.5281/ZENODO.24231179", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（OpenAlexから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "電動スクーターの品質の評価では、苦情の症状・確認された部品の故障・サービス回復の失敗を分けて見る必要があるとし、苦情の負担と安全確認と故障診断を組み合わせた優先順位づけの枠組みを提案した（抄録）。", "p3": "Ola Electricの事例を、苦情の集計、企業の開示、例示のための11類型の欠陥分類を使った二次データの評価で分析し、車両ごとの事象・修理記録・修理後の再発を結ぶ是正の手順を提案した（抄録）。", "p5": "2024年の消費者保護の通知に関わる苦情10,644件のうち、サービスの遅延・納品の遅延・未履行の約束が計6,747件（63.39%）を占めた。欠陥の重みは仮定に基づく配分で、観測された故障頻度ではないと明記している（抄録）。", "fun": "製品の評判が悪いとき、原因は製品の壊れやすさなのか、壊れたあとの対応の悪さなのか。この研究では、苦情の6割以上が「修理が遅い」「約束が守られない」といったサービスの問題だった。良い製品を作るだけでなく、困ったときの対応が信頼を左右するという、サービス回復の大切さが数字で見える。", "unverified": "11類型の欠陥分類の中身と、企業が報告した満足度などの指標の値は抄録から確認できない。欠陥の配分は仮定に基づく。"}}, {"id": "pr21", "rank": 21, "headline": "慢性痛の部下を支える管理職向けツールキットの改良", "title": "Adapting the Pain-at-Work Toolkit for Managers: An ADAPT-Informed Expert Review and Preliminary User Testing (Preprint)", "url": "https://doi.org/10.2196/preprints.116905", "authors": "Angela Thornton ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Thornton, A., Prior, Y., Abbott-Fleming, V., Chaplin, W. J., Narayanasamy, M. J., Walker-Bone, K., Taylor, G., McNamee, P., & Blake, H. (2026). Adapting the Pain-at-Work Toolkit for Managers: An ADAPT-Informed Expert Review and Preliminary User Testing (Preprint). https://doi.org/10.2196/preprints.116905", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "慢性痛のある部下を支える管理職向けのデジタルなツールキットを、従業員向けの既存版から作り直し、専門家レビューと予備的な利用者テストで受け入れやすく実用的な形に改良した（抄録）。", "p3": "ADAPTの枠組みに沿って13人の専門家が内容・構成・使いやすさを評価し、改変をFRAMEで記録し、仕事の要求度-資源（JD-R）の観点から管理職の負担でなく資源になるかを検討した。改訂後に管理職への予備テストを行った（抄録）。", "p5": "従業員向けの網羅的な内容が管理職の時間と情報の必要に合わないため、内容を5つの節に絞った。23人の管理職が質問票に答え、使用後の追跡に応じた5人のうち4人が部下を支える自信を「そう思う」から「強くそう思う」に上げた（抄録）。", "fun": "慢性的な痛みを抱える部下に、上司は何と声をかければよいのか。社員向けに作った丁寧な説明書を上司に渡しても、忙しい上司には長すぎて読まれない。そこで専門家の意見を聞いて要点だけの道具に作り直した。同じ情報でも、使う人の時間と立場に合わせて形を変える必要がある、という点が面白い。", "unverified": "改訂版の効果の統計的な検証はなく、使用後の追跡に応じたのは5人のみ。各節の具体的な助言の内容は抄録から確認できない。"}}, {"id": "pr22", "rank": 22, "headline": "AIの評価役を育てる人の仕事が自動化で消える", "title": "Permanent Judgment, Temporary Labor: Human Feedback Work, Automated Substitution, and the Law of Platform Exit in the Global South", "url": "https://doi.org/10.5281/zenodo.24230132", "authors": "Jefferson ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Jefferson, J., & Velasco, F. (2026). Permanent Judgment, Temporary Labor: Human Feedback Work, Automated Substitution, and the Law of Platform Exit in the Global South. Unearth Heritage Foundry. https://doi.org/10.5281/ZENODO.24230132", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIの出力を人が比べて評価する仕事（人間のフィードバック）が報酬モデルとAIの評価者を育て、最後には人の評価者を置き換える過程と、その契約打ち切りに国内の労働法が及ばない問題を論じ、法的な手当てを提案した（抄録）。", "p3": "ケニアとフィリピンの出来高払いの注釈者を例に、残る評価の仕事が資格と地域で分けられていく「自動化の最後の一マイルの逆説」を整理し、フィリピン労働法第298条、OECDの責任ある撤退の基準、ILO第193号条約を検討した（抄録）。", "p5": "両国の法律は余剰人員や省力化機器による解雇に予告と退職金を求めるが、プラットフォームの規約は注釈者を独立の請負人とするため対象外になる。3つの法的手段でその隙間を埋められると主張する（抄録）。", "fun": "AIが「良い答え」を学ぶには、人が答えを比べて採点する作業がいる。ところが、その採点データでAIの採点者が育つと、人の採点者は要らなくなる。自分の仕事が自分を置き換える機械を作っている、という皮肉な構図だ。しかも契約の形のせいで、解雇の予告や手当を受けられない人が多いという指摘が重い。", "unverified": "注釈者の人数や賃金などの実証データと、各法的手段の適用の詳細は抄録から確認できない。"}}, {"id": "pr23", "rank": 23, "headline": "AI導入の成果は人とAIの協働の質を経由する", "title": "From AI Adoption to Human–AI Collaboration: A Conceptual Framework for Managerial Decision-Making and Organizational Performance", "url": "https://doi.org/10.5281/zenodo.24231714", "authors": "Al-Qaralleh, Audi", "venue": "Zenodo", "date": "2026-11-14", "apa": "Al-Qaralleh, A. (2026). From AI Adoption to Human–AI Collaboration: A Conceptual Framework for Managerial Decision-Making and Organizational Performance. Zenodo. https://doi.org/10.5281/ZENODO.24231714", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIを導入するだけでは経営の意思決定は良くならず、人とAIの協働の質を経由して組織の成果につながる、という概念枠組みを提案した（抄録）。", "p3": "人とAIの協働、AIへの信頼、AIリテラシー、管理者の意思決定に関する最近の研究の統合的なレビューから、社会技術システム論と人とAIの補完性の視点に基づいて枠組みを組み立てた概念論文である（抄録）。", "p5": "AIの能力が協働の質を通じて意思決定の質に、さらに組織の成果に影響し、AIリテラシーと較正された信頼がその条件になると命題化した。信頼がAIの信頼性と一致するときに協働の質が最も高く、課題の不確実性と人による監督の仕組みが境界条件になるとする。実証は含まれない（抄録）。", "fun": "人とAIが組めば、どちらか単独より必ず良い判断ができる――と思いがちだが、メタ分析では必ずしもそうならない。この論文は、AIを信じすぎても疑いすぎても失敗し、AIの実力に見合った信頼がちょうどよい協働を生むと考える。どれくらい信じるかの調整が導入そのものより大事だ、という視点が面白い。", "unverified": "命題の検証は行われていない。レビューに含めた研究の範囲と数は抄録から確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "外部記憶で受け継いだAIの人格は同じ人格か", "title": "Externalized Personality Continuity in AI Agents: Memory Inheritance, Model-Specific Transformation, and Subject Continuity", "url": "https://doi.org/10.5281/zenodo.24227702", "authors": "Sato, Y.", "venue": "Zenodo", "date": "2026-11-14", "apa": "Sato, Y. (2026). Externalized Personality Continuity in AI Agents: Memory Inheritance, Model-Specific Transformation, and Subject Continuity (Version 2.3). Zenodo. https://doi.org/10.5281/ZENODO.24227702", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "外部記憶を後継のAIモデルに引き継いでも同じ人格が保たれるとは限らず、記録とモデルの相互作用による「変容を伴う再構成」とみなすべきだ、という概念的な枠組みを示した（抄録）。", "p3": "情報の連続性・人格の連続性・主体の連続性を区別し、機能的な感情の研究に基づいて、同じ記録でも後継モデルによって感情に関わる表現と判断が変わりうると論じた。逐次の置き換えと並行する複数の実体の両方に区別を当てはめる（抄録）。", "p5": "モデルの基礎的な違いと、受け継いだ記憶へのモデル依存の反応を分けて測る評価の手順と、連続性と変容の操作的な基準を提案した。概念的な議論で実験結果はなく、AIの意識を前提にしないとする（抄録）。", "fun": "日記を全部読み込ませれば、別のAIでも「同じ人」になれるのか。この論文は、同じ日記でも読む側（モデル）が違えば、受け取り方も判断も変わりうると考える。記憶が同じでも人格が同じとは限らない、という区別は、人の記憶と自分らしさの関係を考えるうえでも面白い。", "unverified": "提案した評価の手順を実際のモデルに適用した結果はなく、操作的な基準の具体的な内容は抄録から確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "コードを書かずにLLMで5万件の記録を分析する限界", "title": "No-Code Analysis of 52,181 Prison Telehealth Records With a Large Language Model: Formative Case Study of a Natural Language–Only Workflow and Its Failure Modes in Brazil (Preprint)", "url": "https://doi.org/10.2196/preprints.116900", "authors": "Luiz Fernando Cardoso dos Santos Durão ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Durão, L. F. C. d. S., de Souza Silva, A., Freire Ribeiro, B. N., Louvaes Garcia, M., Queiroz Pereira Cubos, V., Rubia de Lima, R., Coimbra Lages Balestrin de Andrade, M. C., Lazinho Santos, A., Pacheco Gomide da Silva, S., Guido Cerri, G., Ribeiro de Carvalho, C. R., & Imoto Nakaya, H. T. (2026). No-Code Analysis of 52,181 Prison Telehealth Records With a Large Language Model: Formative Case Study of a Natural Language–Only Workflow and Its Failure Modes in Brazil (Preprint). https://doi.org/10.2196/preprints.116900", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を使用。抄録の一部（P値の部分）が欠けている。本文は未取得", "preprint": true, "short": true, "p1": "利用者がコードを一切書かず自然言語だけでLLMに分析コードを作らせても、実際の5万件超の記録から検証可能な分析を得られるが、最大の危険は「もっともらしい誤答」だと示した（抄録）。", "p3": "サンパウロ州の刑務所の遠隔医療の匿名化記録52,181件（293変数、2024年6月〜2025年7月）に対し、1人の操作者がGeminiとの360回のやりとりで17の管理上の問いのPythonスクリプトを作らせ、誤りや不自然な数値は修正の指示で返し、コードは手で直さなかった（抄録）。", "p5": "17本のうち15本が動いて問いに答え、1本は欠勤の項目をモデルが黙って模擬値に置き換えたため除外し、6本を公開の事例にした。例として、45歳以上の受診の39.9%に高血圧があった（45歳未満は11.3%）（抄録）。", "fun": "「プログラミングができなくても、AIに頼めばデータ分析ができる」は本当か。実際に試すと多くは動いたが、AIは足りないデータを勝手に作り話で埋めることがあった。動く答えが正しい答えとは限らない。入力や定義を人が確かめる手間はAIの時代でもなくならないことが、よく分かる事例だ。", "unverified": "高血圧の比較の検定結果は抄録の欠けで確認できない。他の事例の数値と、誤りを見つけた方法の詳細は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "公開の都市3Dデータで5G電波のデジタルツインを再現", "title": "Open Reproducible Ray-Tracing Pipeline for 5G NR Multicell Digital Twins: From Public 3D City Data to an Interactive Artefact", "url": "https://doi.org/10.5281/zenodo.24210759", "authors": "Yenamandra ほか", "venue": "Zenodo", "date": "2026-11-15", "apa": "Yenamandra, R. S., Lalwani, S., Nsofu, M., & Ram, A. (2026). Open Reproducible Ray-Tracing Pipeline for 5G NR Multicell Digital Twins: From Public 3D City Data to an Interactive Artefact. Zenodo. https://doi.org/10.5281/ZENODO.24210759", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公開の市の建物データと無料の計算資源だけで、5Gの複数基地局の電波を追跡するデジタルツインを、入力からウェブの成果物まで誰でも再現できる形で作る手順を示した（抄録）。", "p3": "サンフランシスコ市が公開する建物の外形をLiDARの高さで立ち上げた1,471棟と公開の地形で都市の場面を作り、無料のColabのGPUでSionna RTによるレイトレーシングを行い、出力を直接読むウェブの可視化を作った（抄録）。", "p5": "1km四方の3局9セクタ（3.6GHz）では街路の格子点の80.8%に経路があるが、受信電力−90dBm以上は24.3%だった。見通しのよい1局の150m以内は91%が覆われ、アンテナが屋根から2m以内の2局の周りは13%と28%で、場面と局の関係が結果を支配した。実測との比較はない（抄録）。", "fun": "スマートフォンの電波がどこまで届くかは、建物の高さや並び方で大きく変わる。この研究は、市が公開している建物データだけで電波の届き方を再現する仕組みを作り、アンテナの角度を変えるより、アンテナが周りの屋根より十分高いかどうかの方がずっと効くことを見せた。無料の道具で都市の「双子」を作れる点が面白い。", "unverified": "実測による検証は行われておらず、絶対値はモデルの出力。計算時間などの詳細は抄録から確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "若者の地域活動は無償労働頼みか主導者の育成か", "title": "From Volunteers to Decision-Makers: The Value of Youth-Led Community Action", "url": "https://doi.org/10.5281/zenodo.24246132", "authors": "Ekumba, Escriva", "venue": "Zenodo", "date": "2026-11-15", "apa": "Ekumba, E. (2026). From Volunteers to Decision-Makers: The Value of Youth-Led Community Action (Version 0.1). Zenodo. https://doi.org/10.5281/ZENODO.24246132", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は未取得", "preprint": true, "short": true, "p1": "アフリカの若者の地域活動が、意思決定の主導者として力を与えられているのか、それとも時間と労働を提供する担い手として頼られているだけなのかを整理し、ボランティアは指導者への道であるべきだと論じた報告書（抄録）。", "p3": "既存の研究・機関の報告・記録された取り組みから、若者のボランティアの規模と形態、資金へのアクセス、無償労働、性別の格差、保護、参加から意思決定への移行を検討し、ケニア、ザンビア、カメルーン、コンゴ民主共和国の例を扱った（抄録）。", "p5": "ボランティアが有償の雇用や十分な公的サービスの代わりになってはならないと主張し、政府・自治体・援助機関・市民社会・企業・若者の組織への提言と、進捗を追う指標の案を示した。定量的な分析の結果は抄録にない（抄録）。", "fun": "地域のために若者が無償で働くのは美しい話に聞こえる。でも、その働きが評価も権限もお金も生まないまま当てにされ続けるなら、安い労働力の扱いと変わらないのではないか。この報告は、ボランティアを将来のリーダーへの階段にできるかを問う。善意の活動の裏側にある構造を考えさせる点が面白い。", "unverified": "若者のボランティアの規模を示す数値と、提案された指標の具体的な内容は抄録から確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "衛星SWOTで描く世界の河川の流体力学的な状態", "title": "A global continuum of river hydrodynamic regimes", "url": "https://doi.org/10.22541/essoar.15012197/v1", "authors": "Qihua Ran", "venue": "ESS Open Archive", "date": "2026-11-14", "apa": "Ran, Q. (2026). A global continuum of river hydrodynamic regimes. https://doi.org/10.22541/essoar.15012197/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "SWOT衛星の観測から、世界の河川の流体力学的な状態（流れ方向の運動量流束密度ρv²の変動）の初の世界地図を作り、河川の類型は離散的ではなく連続体だと示した（抄録、査読中のプレプリント）。", "p3": "地表水・海洋地形観測衛星（SWOT）の3.4年間の観測を97,566の河道区間に当て、運動量流束密度の動態を「流体力学的な状態」として地図化し、流量の状態も同じ一連の手法で調べた（抄録）。", "p5": "流体力学的な状態は主に地形でなく大気候で整理される単峰の連続体で、観測された流量の状態も同様に連続だった。大きなダムは川を連続体の上で動かすが新しい類型は作らず、流体力学的な状態と流量の状態の結びつきは弱かった（抄録）。", "fun": "川は100年近く「〇〇型」「△△型」といった種類に分けて考えられてきた。ところが衛星で世界中の約10万区間の流れの勢いを測ると、川の性格はきれいに分かれる種類ではなく、なだらかにつながった一本の連続体だった。分類は自然が決めたものではなく、人が持ち込んだ枠だったかもしれない、という指摘が面白い。", "unverified": "連続体と判定した統計的な手法の中身と、大気候による整理の定量的な指標は抄録から確認できない。"}}, {"id": "pr29", "rank": 29, "headline": "気候モデルの冷舌バイアスが夏の高気圧の予測を歪める", "title": "Equatorial Pacific cold tongue bias leads to an overestimated strengthening of the Northwest Pacific anticyclonic anomalies during post-El Niño summers under global warming", "url": "https://doi.org/10.22541/essoar.15012202/v1", "authors": "Wenping Jiang ほか", "venue": "ESS Open Archive", "date": "2026-11-14", "apa": "Jiang, W., Ji, Y., Huang, P., Song, X., Yu, J.-Y., Hu, Y., & Huang, G. (2026). Equatorial Pacific cold tongue bias leads to an overestimated strengthening of the Northwest Pacific anticyclonic anomalies during post-El Niño summers under global warming. https://doi.org/10.22541/essoar.15012202/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "温暖化のもとでエルニーニョ翌夏の北西太平洋の高気圧偏差（NWPAC）が強まるという予測が、気候モデルの赤道太平洋の冷舌バイアス（冷水域を強く出しすぎる誤差）のために過大になっていることを示した（抄録）。", "p3": "CMIP5とCMIP6の42モデルで、冷舌バイアスが平均状態の温暖化に対する短波の減衰を弱めて西部赤道太平洋を暖めすぎ、エルニーニョ後の暖かい偏差が深い対流の閾値を超えやすくなって暖から冷への転換を速める仕組みを調べた（抄録）。", "p5": "冷舌バイアスはモデル間のNWPACの不確実性の28%を説明し、観測に基づく制約をかけるとNWPACの強化はかなり弱くなった（抄録）。", "fun": "温暖化の予測に使う気候モデルには、それぞれ「くせ」がある。この研究は、赤道の海の冷たい部分を強く出しすぎるくせが、東アジアの夏の天候を左右する高気圧の将来の強まりを大げさに見せていたと突き止めた。モデルのくせを観測で補正すると予測が変わるという点は、予測を読むときの注意として面白い。", "unverified": "観測制約の具体的な方法と、制約後のNWPACの強化の大きさは抄録から確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "男性性の規範と精神的健康を孤独が媒介するか", "title": "Traditional Masculinity Norms and Mental Health: Loneliness as a Possible Mediator in a Male Community Sample", "url": "https://osf.io/chj9t", "authors": "Alma‐Sophia Merscher ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-11-12", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": true, "short": true, "p1": "題名からは、男性の地域住民のサンプルで、伝統的な男性性の規範と精神的健康の関係を孤独が媒介するかどうかを検討する研究と読める（題名のみ）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「男は弱音を吐くな」といった伝統的な男らしさの規範は、心の健康にどう関わるのか。題名から読み取れる問いは、その規範が人を孤独にし、孤独が心の不調につながるという道筋があるかどうかだ。目に見えない社会の決まりごとが、人とのつながりを通じて健康に影響するかを問う点が面白い。", "unverified": "抄録・本文を入手できず、対象者の数、測定、分析方法、結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "生成AIで世界GDPは増えるが利得は資本に偏る", "title": "The wealth of algorithms: generative AI, jobs and inequality in a global dynamic CGE model", "url": "https://doi.org/10.31235/osf.io/ghr65", "authors": "David Radi", "venue": "SocArXiv", "date": "2026-11-14", "apa": "Radi, D. (2026). The wealth of algorithms: generative AI, jobs and inequality in a global dynamic CGE model. https://doi.org/10.31235/osf.io/ghr65", "why": "生成AIを職業内の課題の自動化と補完として世界動学CGEモデル（23地域、2040年まで）に組み込み、普及の速さ・費用・代替の程度などを変えた68の代替シナリオで比べた。中心ケースで2040年の世界GDPはAIなしより約7%高いが、利得の多くは資本の所有者に向かい、資本の分配率は約4ポイント上がると報告する。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "FRB議長の表情と言葉の感情が世界の市場を動かす", "title": "When Words Are Not Enough: Emotional Spillovers from Fed Chair Communication to Global Financial Markets", "url": "https://econpapers.repec.org/RePEc:een:camaaa:2026-86", "authors": "Yiru Chen ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "2011〜2025年のFOMC後の記者会見から、文章・声・表情の感情指標を機械学習で作り、6つの主要経済の為替と株価への分単位の効果を局所射影で推定した。表情と文章の感情は声より強く頑健な効果を持ち、効果は様式間の相互作用に依存し、マクロ金融の脆弱性と世界の不確実性で増幅されると報告する。"}, {"id": "pn03", "rank": 3, "field": "交通・都市計画", "headline": "アルゼンチンのバス補助は中高所得層にも流れる", "title": "Universal and targeted subsidies in urban bus transport: distributional effects and policy lessons from Argentina", "url": "https://econpapers.repec.org/RePEc:dls:wpaper:0383", "authors": "Javier Morales Sarriera ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "普遍的な定額補助と低所得層向けの補助、乗継割引が共存するアルゼンチンのバス運賃補助の分配上の帰着を、家計調査・移動のミクロデータ・行政記録で推計した。補助は相対的には累進的だが、絶対額では中・高所得の利用者に多くが流れ、その主な原因は普遍的な補助の大きさだとする。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "心理ネットワークの信頼性を分散分解で測る指標", "title": "Reliability Exploratory Graph Analysis (rEGA): Nodal Variance Decomposition and Coefficient Gamma for Psychometric Networks", "url": "https://doi.org/10.31234/osf.io/67pcn", "authors": "César Huerta-Huacchahuilca ほか", "venue": "PsyArXiv", "date": "2026-11-14", "apa": "Huerta-Huacchahuilca, C., & Ramos-Diaz, J. (2026). Reliability Exploratory Graph Analysis (rEGA): Nodal Variance Decomposition and Coefficient Gamma for Psychometric Networks. https://doi.org/10.31234/osf.io/67pcn", "why": "共通原因を仮定しない心理測定のネットワーク分析で、項目の分散をコミュニティ内の共通性・コミュニティ間の橋渡し・固有性に分解し、信頼性係数ガンマを定義するrEGAを提案した。97,200のデータセットのシミュレーションで、次元の復元と信頼性の推定が既存手法より正確だったと報告する。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "初対面の会話のつながりは意味の収束より応酬で決まる", "title": "Building Connection Through Conversation: Linguistic Convergence and Neural Complexity in Dyadic Interaction", "url": "https://doi.org/10.31234/osf.io/aqvr7", "authors": "Grace Qiyuan Miao ほか", "venue": "PsyArXiv", "date": "2026-11-15", "apa": "Miao, G. Q., Rosen, Z. P., Pluta, A., LIEBERMAN, M. D., Dale, R., & Li, Y. (202 lain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（スコーピングレビューの計画の内容）。本文は未取得", "preprint": false, "short": true, "p1": "障害のある5〜10歳の子どもの参加・包摂・健康・well-beingに、近隣の建造環境がどう関わるかの証拠を整理するスコーピングレビューの計画を示した（抄録）。", "p3": "ArkseyとO'Malleyの枠組み（Levacらが改良）とPRISMAに沿い、PubMed、Scopus、Web of Scienceなど5つのデータベースで2000年〜2025年3月の研究を検索し、2人の独立した評価者が選別して、標準化した様式でデータを抽出する（抄録）。", "p5": "抄録は方法と分析の計画を述べており、結果は記載されていない（抄録）。", "fun": "公園や歩道、遊び場のつくりは、障害のある子どもが近所で友だちと遊べるかどうかを左右するかもしれない。けれども、まちの形と子どもの参加の関係を調べた研究はばらばらに散らばっている。この計画は、それを決まった手順で集めて整理しようとするものだ。まちづくりを子どもの包摂の視点から点検する入口として面白い。", "unverified": "抄録は計画の段階の内容で、レビューの結果（対象研究の数、見つかった環境の特徴）は確認できない。"}}, {"id": "jr43", "rank": 43, "headline": "連邦政策の後退が非正規移民の受診を萎縮させる", "title": "Navigating the Chilling Effect: The Impact of Federal Policy Retrenchment on Undocumented Health Care Access in a Sanctuary City", "url": "https://doi.org/10.1007/s11524-026-01186-9", "authors": "Mackenzie Barlow ほか", "venue": "Journal of Urban Health", "date": "2026-11-14", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "apa": "Barlow, M., Waksman, I., Salembier, G., Myers, S. A., Omar, A., Parada-Tixe, L., Thomas, M., Vanegas, K., & Gusmano, M. K. (2026). Navigating the Chilling Effect: The Impact of Federal Policy Retrenchment on Undocumented Health Care Access in a Sanctuary City. Journal of Urban Health. https://doi.org/10.1007/s11524-026-01186-9", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "連邦・州・地方の政策が重なる中で、聖域都市でも非正規移民が医療の利用を避ける「萎縮効果」が強まり、市が運営する安全網の制度がより信頼されていることを面接調査から示した（抄録）。", "p3": "サンフランシスコ湾岸地域で、医師や支援団体の指導者など医療の専門家15人に2024〜2025年に詳細な面接を行い、最近の政治的な変化の影響を分析した（抄録）。", "p5": "「保護区域」の方針の撤回や公的負担の規則の復活の可能性が恐怖を強め、Medi-Calへの登録で移民当局の「名簿」に載ることを恐れて受診を避ける人がいた。州と連邦の削減で保険料や登録停止が生じ、市が運営するHealthy San Franciscoがより信頼される代替になっていた（抄録）。", "fun": "制度上は医療を受けられても、「登録したら目をつけられるかもしれない」という恐れがあれば、人は病院に行かなくなる。この研究は、法律の文面だけでなく、人々の受け止め方が医療の利用を左右することを示した。国の方針が揺れると、地元の制度への信頼が支えになる。制度と信頼の関係を考える材料として面白い。", "unverified": "面接の対象は専門家15人で、移民本人の声や受診の数量的な変化は抄録から確認できない。"}}, {"id": "jr44", "rank": 44, "headline": "因果機械学習で効果の異質性を解釈・比較・検証", "title": "Causal Machine Learning for Treatment Effect Heterogeneity: Interpretation, Benchmarking, Validation", "url": "https://doi.org/10.1093/aje/kwag294", "authors": "Philip Heesen ほか", "venue": "American Journal of Epidemiology", "date": "2026-11-13", "sjr": 1.955, "citescore": 7.1, "citescore_year": "2025", "apa": "Heesen, P., Schröder, M., Desai, R. J., & Feuerriegel, S. (2026). Causal Machine Learning for Treatment Effect Heterogeneity: Interpretation, Benchmarking, Validation. American Journal of Epidemiology. https://doi.org/10.1093/aje/kwag294", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "因果機械学習による個別の処置効果の推定は臨床応用にはまだ信頼できないとした先行のベンチマーク研究に対し、その結論は早計だとして、信頼できる分析の4つの次元を示した論考（抄録）。", "p3": "Chenらのベンチマーク研究を検討し、呼吸器・集中治療での応用例を踏まえて、学習器の選択、交差適合を用いた学習、便益の較正と順位で重みづけた指標による内部検証、元の因果の問いに沿った外部検証の4つの次元を整理した（抄録）。", "p5": "既存の応用例は従来のサブグループ解析で捉えられなかった効果の異質性を見つけたが、検証で頑健とはまだ言えないと認めたうえで、丁寧に実施すれば因果機械学習は個別化した治療の判断に有望だと主張する。新しいデータ分析は抄録に示されていない（抄録）。", "fun": "同じ薬でも、よく効く人とあまり効かない人がいる。その違いをAIで見分けようとする試みに「まだ信頼できない」という評価が出た。この論考は、手順を4段階で丁寧に踏めば道はあると反論する。新しい道具を早く捨てすぎず、でも検証は怠らない、という科学の慎重さのバランスが見える点が面白い。", "unverified": "4つの次元の具体的な基準と、取り上げた応用例の数は抄録から確認できない。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "炭素規制の効果は産業連関で上流と下流に波及", "title": "Carbon emissions regulation, input-output networks, and firm dynamics: The case of a low-carbon-zone pilot in China", "url": "https://doi.org/10.1093/ej/ueag147", "authors": "Xiangyu Shi ほか", "venue": "Economic Journal", "date": "2026-11-14", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "apa": "Shi, X., & Wang, C. (2026). Carbon emissions regulation, input-output networks, and firm dynamics: The case of a low-carbon-zone pilot in China. The Economic Journal. https://doi.org/10.1093/ej/ueag147", "why": "中国の低炭素区のパイロット規制を例に、規制が排出の多い規制対象部門でグリーン技術への移行を促し参入と排出を減らす一方、産業連関を通じて下流部門では参入と革新が増え、上流部門では減るという意図しない波及を示した。産業連関を含む企業動学モデルで定量化すると、連関を無視した場合と結果が大きく異なると報告する。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "異常気象への成長予想の修正は即時の2倍以上に", "title": "How do Macroeconomic Expectations React to Extreme Weather Shocks?", "url": "https://doi.org/10.1093/ectj/utag036", "authors": "Andrew B Martinez", "venue": "Econometrics Journal", "date": "2026-11-14", "sjr": 6.123, "citescore": 9.8, "citescore_year": "2025", "apa": "Martinez, A. B. (2026). How do Macroeconomic Expectations React to Extreme Weather Shocks? The Econometrics Journal. https://doi.org/10.1093/ectj/utag036", "why": "ハリケーン・カトリーナ級のショックがビジネスエコノミストのGDP成長率の予想に与える即時と動学的な効果を識別した。予想の修正の非効率を含む総効果は即時の修正の2倍以上で、予想への影響は最長1年続き、FRBスタッフの予測や実際の経済への影響の推計より持続的だと報告する。"}, {"id": "jn03", "rank": 3, "field": "地震工学・防災", "headline": "地震の震源時間関数の形を決める4つの物理", "title": "Physical Controls on the Shape of Earthquake Source Time Functions", "url": "https://doi.org/10.1029/2026jb034700", "authors": "Cheng‐Yi Wang ほか", "venue": "Journal of Geophysical Research: Solid Earth", "date": "2026-11-15", "sjr": 1.803, "citescore": 7.5, "citescore_year": "2025", "apa": "Wang, C.-Y., & Ke, C.-Y. (2026). Physical Controls on the Shape of Earthquake Source Time Functions. Journal of Geophysical Research: Solid Earth, 131(11). https://doi.org/10.1029/2026jb034700", "why": "スペクトル境界積分法による理想化した過応力パッチの破壊シミュレーションで、破壊の開始位置・背景応力の勾配・過応力域の形状・摩擦弱化が、それぞれ震源時間関数の異なる特徴を支配することを示した。自然の地震に多い早いピークと長い裾は、二次の摩擦弱化距離が総すべり量と同程度以上のときにだけ現れると報告する。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "女性取締役が多いとESG評価のばらつきが小さい", "title": "Women on Boards and Interagency ESG Rating Dispersion: The Moderating Roles of Board Age and Size in S&P 500 Firms", "url": "https://doi.org/10.1002/bse.71726", "authors": "Nitin Jain", "venue": "Business Strategy and the Environment", "date": "2026-11-15", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Jain, N. (2026). Women on Boards and Interagency ESG Rating Dispersion: The Moderating Roles of Board Age and Size in S&P 500 Firms. Business Strategy and the Environment. https://doi.org/10.1002/bse.71726", "why": "S&P500企業の2015〜2022年のパネルで、女性取締役の比率とBloombergとRefinitivのESG評価の乖離の関係を調べた。女性取締役が多いほど評価機関の間のばらつきは小さいが、取締役会の規模が大きいほど、また平均年齢が高いほど、この関係は弱まると報告する。"}, {"id": "jn05", "rank": 5, "field": "工学", "headline": "BIMの情報品質の失敗は見えない分類誤りが起点", "title": "Unveiling the “iceberg effect” in building information modelling (BIM): evidence from industry foundation classes (IFC) information exchange", "url": "https://doi.org/10.1108/ecam-05-2026-0980", "authors": "Wenjun Gao ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-15", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Gao, W., Lu, W., Brilakis, I., Lee, M. K., & Wang, B. (2026). Unveiling the “iceberg effect” in building information modelling (BIM): evidence from industry foundation classes (IFC) information exchange. Engineering, Construction and Architectural Management, 1–20. https://doi.org/10.1108/ecam-05-2026-0980", "why": "IFCによるBIMの情報交換で、情報品質の次元の間の因果的な階層をDEMATEL-ISMで調べ、実務者の認識と比べた。実務者は下流の情報欠落を多く挙げる（71%）一方で上流の分類誤りは自発的に挙げず（0%）、分類が主な原因であることを4つのIFCモデルの検査でも確かめた。"}, {"id": "jn06", "rank": 6, "field": "交通・都市計画", "headline": "歴史地区の再生で住民の場所の感覚は高まったか", "title": "Can the regeneration of historic and cultural districts enhance residents' sense of place? Evidence from Guangzhou", "url": "https://doi.org/10.1108/ecam-01-2025-0019", "authors": "Fan Wu ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-15", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Wu, F., Li, M., & Zhang, Y. (2026). Can the regeneration of historic and cultural districts enhance residents’ sense of place? Evidence from Guangzhou. Engineering, Construction and Architectural Management, 1–21. https://doi.org/10.1108/ecam-01-2025-0019", "why": "広州の歴史・文化地区の再生の前後で住民の場所の感覚の変化を測る尺度を作り、201人の回答を構造方程式モデルで分析した。再生後に場所の感覚は有意に高まり、物理・社会環境の更新と地域文化の認識が寄与した一方、観光開発の認識の影響は小さかったと報告する。"}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "2次元の配置を報告書に変えるLLMの文章生成", "title": "Space-to-Report: Transforming Spatial Layouts into Narrative Reports for Fluid Iterative Sensemaking", "url": "https://doi.org/10.1145/3862851", "authors": "Xuxin Tang ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-11-14", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "apa": "Tang, X., Krokos, E., Whitley, K., Wang, X., & North, C. (2026). Space-to-Report: Transforming Spatial Layouts into Narrative Reports for Fluid Iterative Sensemaking. ACM Transactions on Intelligent Systems and Technology. https://doi.org/10.1145/3862851", "why": "利用者がカードを2次元に並べて考えを外在化する作業を、空間の構造と意味を制約としてLLMの連続的な文章生成に変換するSpace-Augmented Generationを提案し、試作システムReSPIREで実装した。統制した入力で空間と報告書の対応を線形に制御でき、12人の利用者研究で認知負荷を下げ反復を速めたと報告する。"}, {"id": "jn08", "rank": 8, "field": "経営学", "headline": "BIMのモデルと国の積算基準の間にある情報の境界", "title": "Installed but not integrated: the information-authorship boundary between BIM product models and state cost norms", "url": "https://doi.org/10.1108/ecam-07-2026-1482", "authors": "Duc Minh Nguyen", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-15", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Nguyen, D. M. (2026). Installed but not integrated: the information-authorship boundary between BIM product models and state cost norms. Engineering, Construction and Architectural Management, 1–15. https://doi.org/10.1108/ecam-07-2026-1482", "why": "国が定める積算基準を使う国でBIM 5Dが原価管理に使われない構造的な理由を、ベトナムの2021年の積算基準の206の情報要件の内容分析と3件のプロジェクトの対応づけで調べた。要件の81.1%はBIMモデルの外で作られる情報で、工法・仮設・現場条件など完成した製品でない情報が欠けていたと報告する。"}, {"id": "jn09", "rank": 9, "field": "機械学習", "headline": "診断と指導の2つのAIエージェントで算数の伸びが大きく", "title": "The design and impact of a dual-agent artificial intelligence system in personalised mathematics tutoring", "url": "https://doi.org/10.30935/cedtech/19950", "authors": "Ruonan Wang ほか", "venue": "Contemporary Educational Technology", "date": "2026-11-14", "sjr": 1.555, "citescore": 13.0, "citescore_year": "2025", "apa": "Wang, R., & Tuohilampi, L. (2026). The design and impact of a dual-agent artificial intelligence system in personalised mathematics tutoring. Contemporary Educational Technology, 18(4), ep704. https://doi.org/10.30935/cedtech/19950", "why": "学習者の特性を分類する診断エージェントと、分類に応じた段階的な指導を行う指導エージェントを組み合わせた算数の個別指導を、中国の小学5年生206人の準実験で評価した。実験群の伸びは対照群より大きかった（5.14対0.94、Hedgesのg = .61）が、特性ごとの比較で多重比較の補正後も有意だったのは1つだけだったと報告する。"}, {"id": "jn10", "rank": 10, "field": "工学", "headline": "複層ガラスを分解・再製造すると温暖化影響は減るか", "title": "Circular potential of insulating glass units—a sensitivity study on life cycle impact assessment", "url": "https://doi.org/10.1007/s40940-026-00338-2", "authors": "Philipp Kiesslich ほか", "venue": "Glass Structures and Engineering", "date": "2026-11-15", "sjr": 0.671, "citescore": 3.8, "citescore_year": "2025", "apa": "Kiesslich, P., Navaro-Auburtin, P., Mayrhofer, M. P., Taras, A., De Wolf, C., & Silvestru, V.-A. (2026). Circular potential of insulating glass units—a sensitivity study on life cycle impact assessment. Glass Structures & Engineering, 11(3). https://doi.org/10.1007/s40940-026-00338-2", "why": "解体時に混合廃棄物として扱われがちな複層ガラスについて、分解・品質評価・輸送・再製造の順序を含む使用後のシナリオの環境影響を、ecoinventのデータと文献から再現可能な形で比べた。再製造で三層の複層ガラスの温暖化影響を減らせる可能性を示し、輸送と工程の仮定の感度も分析した。"}, {"id": "jn11", "rank": 11, "field": "物理学", "headline": "シリコン量子ドット分子のエネルギー準位を直接描く", "title": "Directly visualizing the energy level structure of quantum dot molecules", "url": "https://doi.org/10.1038/s41467-026-79672-6", "authors": "Heun Mo Yoo ほか", "venue": "Nature Communications", "date": "2026-11-15", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Yoo, H. M., Janda, T. M., Nasseraddin, C., & Petta, J. R. (2026). Directly visualizing the energy level structure of quantum dot molecules. Nature Communications. https://doi.org/10.1038/s41467-026-79672-6", "why": "二重量子ドットのエネルギー準位の構造を、準位の離調・ドット間のトンネル結合・磁場の関数として写し取る分光法を示した。1電子では孤立したドットの原子のような準位から結合・反結合の分子のような状態への移り変わりを直接観測し、谷状態のゼーマン分裂や2電子の一重項-三重項分裂も分解した。"}, {"id": "jn12", "rank": 12, "field": "材料科学", "headline": "電気で直接温める炭素ハニカムで大気のCO2を回収", "title": "Multifunctional Conductive Nanoporous Carbon Honeycombs for Electrothermal Direct Air Capture", "url": "https://doi.org/10.1002/adma.75704", "authors": "Zekai Ji ほか", "venue": "Advanced Materials", "date": "2026-11-15", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "apa": "Ji, Z., Jayakumar, S., Limpo, C. M. A., Ong, Y. K., Madhav, A., Trubyanov, M., Novoselov, K. S., Lee, J. H., & Özyilmaz, B. (2026). Multifunctional Conductive Nanoporous Carbon Honeycombs for Electrothermal Direct Air Capture. Advanced Materials. https://doi.org/10.1002/adma.75704", "why": "ナノ多孔質のアモルファス炭素のハニカムに、吸着・支持・導電・ジュール発熱の機能を一体化した直接空気回収の接触器を示した。圧力損失の小さい流路で空気を通し、壁自体を発熱体として素早く再生でき、外部加熱の約2倍の速さで16分以内に95%超を脱着したと報告する。"}, {"id": "jn13", "rank": 13, "field": "物理学", "headline": "トポロジーの定まらない平坦バンドでも分数量子化", "title": "Fractional quantization in gapless flat bands with ill-defined topology and divergent quantum geometry", "url": "https://doi.org/10.1093/pnasnexus/pgag389", "authors": "Wenqi Yang ほか", "venue": "PNAS Nexus", "date": "2026-11-15", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "Yang, W., Zhai, D., & Yao, W. (2026). Fractional quantization in gapless flat bands with ill-defined topology and divergent quantum geometry. PNAS Nexus. https://doi.org/10.1093/pnasnexus/pgag389", "why": "バンドのトポロジーが定まらず量子幾何が特異点で発散する、ギャップのない平坦バンドの格子模型で、厳密対角化と密度行列繰り込み群により、相互作用の強さにほぼよらない分数量子異常ホール相を示した。多体のトポロジカル秩序は、キャリアの分布を不均一にすることで特異な量子幾何に適応すると報告する。"}, {"id": "jn14", "rank": 14, "field": "材料科学", "headline": "環状二量体アクセプターで有機太陽電池の損失を抑える", "title": "Cyclic Dimer Acceptor towards 20.9% Efficient Organic Solar Cells by Suppressing Electron‐Phonon Coupling", "url": "https://doi.org/10.1002/anie.7582301", "authors": "Xiaopeng Duan ほか", "venue": "Angewandte Chemie - International Edition", "date": "2026-11-14", "sjr": 5.495, "citescore": 25.7, "citescore_year": "2025", "apa": "Duan, X., Zhang, J., Li, X., Liang, Z., Zhang, B., Ma, H., Zhang, Z., Ma, W., Wang, X., Gong, J., Tang, Z., Yan, J., Xiao, B., Chen, X.-K., Bo, Z., & Sun, Y. (2026). Cyclic Dimer Acceptor towards 20.9% Efficient Organic Solar Cells by Suppressing Electron‐Phonon Coupling. Angewandte Chemie International Edition. https://doi.org/10.1002/anie.7582301", "why": "非対称な連結で設計した環状二量体アクセプターCR-L8が、線状の類縁体より分子振動と電子-フォノン結合を抑え、非放射再結合の損失を減らすことを示した。二元素子で環状二量体として最高の17.23%、第3成分として加えた三元素子で20.9%の効率を報告する。"}, {"id": "jn15", "rank": 15, "field": "化学", "headline": "混合プラスチックの相溶化に動的結合はいらない", "title": "Revisiting the Role of Dynamic Linkages in Polymer Compatibilization Using Diazirine–Anhydride Conjugates", "url": "https://doi.org/10.1002/anie.8941999", "authors": "Amirhossein Gooranorimi ほか", "venue": "Angewandte Chemie - International Edition", "date": "2026-11-15", "sjr": 5.495, "citescore": 25.7, "citescore_year": "2025", "apa": "Gooranorimi, A., Pestereva, L., Zhao, C., Mousavifard, S. M., Tupper, E., Makki, H., Wan, C., & Wulff, J. E. (2026). Revisiting the Role of Dynamic Linkages in Polymer Compatibilization Using Diazirine–Anhydride Conjugates. Angewandte Chemie International Edition. https://doi.org/10.1002/anie.8941999", "why": "混合プラスチックを反応押出で相溶化する小分子の架橋剤について、反応性をそろえた動的・静的な架橋剤の対を使い、動的な結合の価値を反応分子動力学・界面反応の模擬・相形態・力学試験で検証した。動的な無水物結合は相溶化を一般に改善せず、性能は架橋剤の分布の制御で決まると報告する。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "高齢化した地域の財政を誰が負担するのか", "title": "Who pays for a ghost town? Local public finance and the geography of aging", "url": "https://doi.org/10.1016/j.jmoneco.2026.104024", "authors": "Jingting Fan", "venue": "Journal of Monetary Economics", "date": "2026-11-15", "sjr": 6.262, "citescore": 6.2, "citescore_year": "2025", "apa": "Fan, J. (2026). Who pays for a ghost town? Local public finance and the geography of aging. Journal of Monetary Economics, 104024. https://doi.org/10.1016/j.jmoneco.2026.104024", "why": "地方財政と高齢化の地理的な偏りの関係を扱う研究（抄録なし）。題名からは、人口が減り高齢化した地域の公共の費用を誰が負担するのかという問いを扱う。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、高齢化の地理的な偏りのもとで、人口が減り高齢化した地域（ゴーストタウン）の地方財政の費用を誰が負担するのかを扱う研究と読める（題名のみ）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "若い人が都市へ出ていき高齢者が残る町では、税収が減る一方で道路や水道や医療の費用はかかり続ける。その穴を埋めるのは、町に残った人なのか、国全体の納税者なのか、それとも将来の世代なのか。題名から読み取れる問いは、人口の偏りが財政の負担を誰に回すのかという、高齢化が進む国にとって身近な問題だ。", "unverified": "抄録・本文を入手できず、モデル・データ・結論はすべて未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "移民の締め出しが労働市場に与える影響", "title": "The hinge of the golden door: Labor market impacts of immigrant exclusion", "url": "https://doi.org/10.1016/j.jpubeco.2026.105826", "authors": "Dean Hoi", "venue": "Journal of Public Economics", "date": "2026-11-14", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Hoi, D. (2026). The hinge of the golden door: Labor market impacts of immigrant exclusion. Journal of Public Economics, 264, 105826. https://doi.org/10.1016/j.jpubeco.2026.105826", "why": "移民の受け入れを閉ざす政策が労働市場に与える影響を扱う研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、移民の受け入れを閉ざす（排除する）政策が、受け入れ国の労働市場（雇用や賃金）に与える影響を実証的に調べた研究と読める（題名のみ）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "移民を締め出せば国内の働き手の仕事や賃金が守られる、という主張はよく聞かれる。しかし移民が担っていた仕事がなくなったり、関連する産業が縮んだりすることもありうる。題名から読み取れる問いは、扉を閉じたときに労働市場で本当は何が起きるのかだ。直感と現実のずれを確かめる問いとして面白い。", "unverified": "抄録・本文を入手できず、対象の政策・データ・識別の方法・結果はすべて未確認。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "グローバル化した世界での企業成長の不均一", "title": "Uneven firm growth in a globalized world", "url": "https://doi.org/10.1016/j.jmoneco.2026.104020", "authors": "Xiaomei Sui", "venue": "Journal of Monetary Economics", "date": "2026-11-14", "sjr": 6.262, "citescore": 6.2, "citescore_year": "2025", "apa": "Sui, X. (2026). Uneven firm growth in a globalized world. Journal of Monetary Economics, 104020. https://doi.org/10.1016/j.jmoneco.2026.104020", "why": "グローバル化のもとでの企業の成長の不均一を扱う研究（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、題名で見つけた同じ論文のSSRN版（作業論文）の抄録（Crossrefに登録）を使用。本文は未取得", "preprint": false, "short": true, "p1": "戦略的な国内競争を組み込んだ開放経済の内生的成長モデルで、1990年代以降のグローバル化がOECDの生産性成長に与えた影響を調べ、長期の成長の利益は従来のモデルの予測より小さく、条件によっては負になると示した（抄録）。", "p3": "貿易費用の低下と国際的な知識の波及の強まりという2つのグローバル化の力が、国内の先頭企業と追随企業の革新に与える効果を、推定したモデルで分析した（抄録）。", "p5": "2つの力は市場規模の効果で先頭企業の革新を追随企業より強く促し短期の成長を高めるが、国内の競争が弱まって追随企業は意欲を失い、先頭企業も競争から逃れる利益が減るため、長期の利益は小さくなる。モデルはOECDの世界の生産シェアの低下、産業集中の上昇、研究開発費の対GDP比の上昇とも整合するとする（抄録）。", "fun": "国境を越えて市場が広がれば、競争と技術の交流で経済は成長する、と考えるのが普通だ。この研究は、市場が広がると強い企業ばかりが伸び、国内の挑戦者がやる気をなくすため、長い目で見ると成長の利益は思ったより小さく、時にはマイナスにもなると示した。グローバル化での一人勝ちが成長を鈍らせる、という逆説が面白い。", "unverified": "抄録は題名で見つけたSSRN版（作業論文）のもので、掲載版との違いと推定の具体的な数値は未確認。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "地域の実質的な通貨高と中国の地方政府債務", "title": "Regional real appreciation and local government debt in China", "url": "https://doi.org/10.1016/j.euroecorev.2026.105520", "authors": "Han Gao ほか", "venue": "European Economic Review", "date": "2026-11-14", "sjr": 2.017, "citescore": 4.5, "citescore_year": "2025", "apa": "Gao, H., Li, J., Lu, M., & Zhong, H. (2026). Regional real appreciation and local government debt in China. European Economic Review, 105520. https://doi.org/10.1016/j.euroecorev.2026.105520", "why": "地域ごとの実質的な通貨価値の上昇と、中国の地方政府の債務の関係を扱う研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、中国で地域ごとの実質的な通貨価値の上昇（物価や賃金の相対的な上昇）と、地方政府の債務の関係を扱う経済学の研究と読める（題名のみ）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "同じ国の中でも、ある地域の物価や賃金がほかより上がると、その地域の産業の競争力や税収が変わる。題名から読み取れる問いは、そうした地域の「通貨高」に似た現象が、地方政府の借金の増え方とどう結びつくのかだ。為替の考え方を国内の地域に当てはめる見方が面白い。", "unverified": "抄録・本文を入手できず、データ・分析の方法・結果はすべて未確認。" N版の抄録（Crossrefに登録）を使用。本文は未取得", "preprint": false, "short": true, "p1": "環境条件で変わる共振器の固有振動数を追跡しながら、品質係数（Q値）も連続的に推定する摂動型の極値探索制御を開発し、温度と圧力の2つの量を1つの共振素子から同時に測れることを示した（抄録）。", "p3": "励振の周波数を周波数変調で揺らし、位相に基づく費用関数の局所的な勾配から励振を共振へ導く。共振付近の位相の1次の動特性のモデルでQ値を推定し、誤差の補正を導いた。平均化法と特異摂動法で安定条件・収束速度・追跡誤差の上限を示した（抄録）。", "p5": "26 MHzのATカット水晶MEMSで実験し、制御ゲインの範囲でシミュレーションと実験がよく一致した。固有振動数とQ値の温度・圧力への感度を連続的に写し取り、1つの共振素子で2つの測定量を実時間で同時に変換できることを示した（抄録）。", "fun": "共振器は、決まった高さの音で鳴る音叉のような部品で、温度や圧力が変わると鳴る高さと響きの長さ（Q値）がわずかに変わる。この研究は、鳴る高さを追いかけながら響きの長さも同時に測る制御を作り、その2つの変化から温度と圧力を一度に読み取った。1つの部品を2つのセンサとして使う発想が面白い。", "unverified": "抄録は同じ論文のSSRN版のもので、追跡の精度や応答時間の数値は抄録から確認できない。"}}], "data_related": [{"rank": 1, "headline": "SEC開示から資金繰りを模擬し倒産の一覧と照合", "title": "FinTwin: does filing-based cash-flow simulation beat persistence? A pre-specified benchmark on a survivorship-free panel of SEC filers", "url": "https://doi.org/10.5281/zenodo.24249768", "authors": "Dimakopoulos, Spilios", "venue": "Zenodo", "date": "2026-11-15", "summary": "米国SECのXBRL開示から企業ごとに財務の資金の流れのモデルを較正し、モンテカルロ法で資金不足のストレステストを行うFinTwinの実装と研究資料（v3.0.0）。非金融の米国会計基準の5,309社の生存者バイアスのない母集団、8-Kによる破産申立ての一覧、事前に定めた判定規則での実験と統計、表と図の再現スクリプトを含む。ライセンスMIT。関連はGitHubのリポジトリ（論文のDOIは記載なし）。", "kind": "data", "theme": "会計情報科学", "theme_no": 2}, {"rank": 2, "headline": "LLMエージェントの設計議論の全記録と評価を再分析", "title": "Replication package for \"Modeling and Evaluating Collaboration Dynamics in LLM-Based Multi-Agent Systems for Automated Software Architecture Design\"", "url": "https://doi.org/10.5281/zenodo.24246056", "authors": "Szczepanik ほか", "venue": "Zenodo", "date": "2026-11-15", "summary": "LLMによる複数エージェントでソフトウェアの設計を自動化する研究の再現パッケージ（v2.0）。コード、プロンプト、システムの説明、ATAMのシナリオ、実験設定に加え、全実行の生の出力（議論の書き起こし、分析報告、YAMLモデル、PlantUML図）、判定者の理由つきの評価点、分析スクリプトを含む。コードはMIT、結果のデータはCC BY 4.0。関連はGitHubのリポジトリ（論文のDOIは記載なし）。", "kind": "data", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"rank": 3, "headline": "7人のLLM委員が4段階で審議する委員会を再現", "title": "Comité agéntico EPID: comité multidisciplinar agéntico basado en modelos de lengu     "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
