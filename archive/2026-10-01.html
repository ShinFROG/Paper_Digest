数値の検証は未確認。"}, "citescore": 9.8, "citescore_year": "2025"}, {"rank": 38, "theme": "LLM熟議・ペルソナ", "headline": "LLMで利用者と商品の相互作用を模擬し推薦の冷え込みを解消", "title": "Turning Cold Entities Warm: LLM-Based User and Item Interaction Simulation for Recommendations", "url": "https://doi.org/10.1145/3848638", "authors": "Hao Chen ほか", "venue": "ACM Transactions on Information Systems", "date": "2026-09-30", "sjr": 1.932, "id": "jr38", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "相互作用のない、または少ない利用者・商品の推薦（コールドスタート）を、LLMによる相互作用の模擬として捉え直す枠組み（ProbLLM）を提案した（抄録）。", "p3": "LLMによる内容の検索で候補を絞り、確率の形のプロンプトで各組の確信度を出させ、選んだ擬似的な相互作用を確信度で重み付けして表現学習に使う（抄録）。", "p5": "評価した設定と推薦モデルの骨格で、対応する基準手法より高い性能を得た（抄録）。", "fun": "新しい商品や新しい利用者には、まだ「誰が何を買ったか」の記録がないので、おすすめが難しい。そこでAIに「この人ならこれを買いそうか」を確率で予想させ、その予想を仮の記録として使う。確信度の低い予想は軽く扱うのが工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 17.9, "citescore_year": "2025"}, {"rank": 39, "theme": "LLM熟議・ペルソナ", "headline": "LLMが合成した推薦データを影響関数で選別", "title": "Filtering LLM-Synthesized Data for Cold-Start Recommendation: A Progressive Influence Function Approach", "url": "https://doi.org/10.1145/3849805", "authors": "Tianhao Shi ほか", "venue": "ACM Transactions on Information Systems", "date": "2026-09-30", "sjr": 1.932, "id": "jr39", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "LLMが合成した推薦用のデータから有害なものを除くため、影響関数を段階的に更新するデータ選別の方法（PIF）を提案した（抄録）。", "p3": "少数のとくに有害なデータを見つける目的なら、偏った参照モデルでも最も有害な点は捉えられるという理論的な分析に基づき、有害なデータを除いては参照モデルを学習し直して影響を再評価し、各段階の推定を統合する（抄録）。", "p5": "大規模な実験で有効性を確かめたとしている（抄録）。具体的な数値は抄録には示されていない。", "fun": "AIに作らせた練習データには、役に立たないどころか害になるものが混じる。どのデータが悪さをしているかを測るには正しい基準が要るが、その基準もデータに汚されている。そこで一番悪いものから少しずつ取り除き、基準をきれいにしていく。泥水を少しずつ澄ませるような発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 17.9, "citescore_year": "2025"}, {"rank": 40, "theme": "都市・インフラ政策", "headline": "東南アジアで都市をつくる王室", "title": "Neo-royal urbanisms: Royal agency in contemporary city building in Southeast Asia", "url": "https://doi.org/10.1177/00420980261460325", "authors": "Jane M. Jacobs ほか", "venue": "Urban Studies", "date": "2026-09-30", "sjr": 1.809, "id": "jr40", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ブルネイ・カンボジア・インドネシア・タイで、王室が現代の都市づくりを通じて権力を実現・表現していることを「新王室都市主義」として捉えた特集の序論（抄録）。", "p3": "批判的な比較の枠組みで、王室が都市開発で権力を示し、王室以外の主体も王室の後ろ盾を開発に利用する関係を整理し、閉ざされた権力の研究の方法上の難しさも論じた（抄録）。", "p5": "建造環境そのものが王室の主体性をたどる重要な証拠であり、都市は背景ではなく王室の権力が組み立てられ争われる主要な媒体だと論じた（抄録）。", "fun": "王様や王族は昔の制度と思われがちだが、東南アジアでは今も都市づくりに大きな力を持っている。巨大な開発や記念の建物に、その力が形として現れる。取材しにくい権力を、建物という「動かない証拠」から読み解く発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 9.9, "citescore_year": "2025"}, {"rank": 41, "theme": "都市・インフラ政策", "headline": "地下水回復で都市の地盤が断層に沿って急に隆起", "title": "Rapid urban land uplift enhanced by crustal faults during groundwater recovery", "url": "https://doi.org/10.1038/s43247-026-03915-z", "authors": "Saho Fukunishi ほか", "venue": "Communications Earth and Environment", "date": "2026-09-30", "sjr": 3.168, "id": "jr41", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "大阪都市圏で、地下水の回復にともなう地盤の隆起が断層で区切られた領域ごとに大きく異なることを、衛星測地と数十年の地下水観測で示した（抄録）。", "p3": "衛星測地で鉛直の地盤変動を測り、深さ600mまでの井戸の地下水位の上昇と比べ、変形のモデルで隆起の源の深さを推定した（抄録）。", "p5": "最大で年12mmの隆起が広がり、隆起速度は既知の断層と一致する境界で急に変わった（抄録）。断層のない所の急な変化は未知の伏在断層を示唆し、主な隆起源は500mより浅かった。断層は横方向の地下水の流れの遮水壁として働くと解釈している。", "fun": "昔、地下水をくみ上げすぎて沈んだ大阪の地面が、今は水位の回復で少しずつ持ち上がっている。ところが、その持ち上がり方は地下の断層を境にくっきり変わっていた。断層が地下水の流れをせき止める壁になっているらしい。見えない断層の手がかりにもなる発見だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 11.3, "citescore_year": "2025"}, {"rank": 42, "theme": "都市・インフラ政策", "headline": "画像による歩きやすさ指標の最適な範囲", "title": "Spatial reach of visual information: Optimizing buffer distances for computer vision–based measures of microscale walkability and visual quality", "url": "https://doi.org/10.1177/23998083261488638", "authors": "Bon Woo Koo ほか", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-09-30", "sjr": 1.018, "id": "jr42", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "街路画像から歩きやすさを測るとき、どの範囲（バッファ距離）の視覚情報が歩行者の満足を最もよく説明するかを、ソウルの調査で調べた（抄録）。", "p3": "歩行者への街頭調査で歩行環境の満足を5段階で測り、画像に基づく微視的な特徴と視覚的な質の指標について、説明力が最大になるバッファ距離を比べた（抄録）。", "p5": "画像に基づく微視的な特徴の最適な距離はおおむね100〜400m、視覚的な質の指標はほとんどの集団で200m以下で、GISに基づく巨視的な要因の1,000〜1,400mより大幅に小さかった（抄録）。移動の目的と土地への慣れで最適な距離が変わった。", "fun": "「歩きやすい町」を写真で評価するとき、どのくらいの範囲の景色が人の感じ方に効いているのか。調べると、目に入る景色の効き目は200m以内ほどと、地図の上の条件よりずっと狭かった。人は目の前の風景で歩き心地を判断しているようだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 7.5, "citescore_year": "2025"}, {"rank": 43, "theme": "都市・インフラ政策", "headline": "緑道がつくる地代の差：シカゴ606の住宅価格への影響", "title": "Making green rent gaps: Housing price impacts of the 606/Bloomingdale Trail in Chicago", "url": "https://doi.org/10.1016/j.cities.2026.107626", "authors": "Matthew D. Wilson ほか", "venue": "Cities", "date": "2026-09-30", "sjr": 1.772, "id": "jr43", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文を入手できず）", "preprint": false, "short": true, "p1": "題名から、シカゴの緑道「606（Bloomingdale Trail）」が周辺の住宅価格に与えた影響を、「緑の地代格差」という観点で扱う研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、廃線跡を緑道にすると周りの家の値段が上がり、もともと住んでいた人が住みにくくなる（緑のジェントリフィケーション）のかということだ。良い公共事業が思わぬ格差を生むかどうかは、都市政策の大事な論点だ。", "unverified": "抄録・本文を入手できず、方法と結果は確認できなかった。"}, "citescore": 11.5, "citescore_year": "2025"}, {"rank": 44, "theme": "都市・インフラ政策", "headline": "自転車インフラは通勤手段を変えるか：準実験", "title": "The effect of cycling infrastructure on commuting mode choice: a quasi-experimental evidence", "url": "https://doi.org/10.1016/j.jtrangeo.2026.104858", "authors": "Fatima Ravazdezh ほか", "venue": "Journal of Transport Geography", "date": "2026-09-30", "sjr": 1.688, "id": "jr44", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文を入手できず）", "preprint": false, "short": true, "p1": "題名から、自転車インフラの整備が通勤の交通手段の選択に与える効果を、準実験の方法で推定した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、自転車レーンを作ると本当に自転車で通勤する人が増えるのかということだ。整備した場所としない場所を比べる準実験で、「もともと自転車好きの人が多い所に作っただけ」ではない効果を見ようとしている点が気になる。", "unverified": "抄録・本文を入手できず、方法と結果は確認できなかった。"}, "citescore": 10.0, "citescore_year": "2025"}, {"rank": 45, "theme": "職場AI・組織行動", "headline": "逆説的リーダーシップと環境への主体的行動", "title": "Leading for Sustainability in Uncertain Times: How Paradoxical Leadership, Green Proactive Behaviour and Employee Ambidexterity Shape Sustainability Performance", "url": "https://doi.org/10.1002/csr.71015", "authors": "Islam Bourini ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-09-30", "sjr": 2.147, "id": "jr45", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "アブダビとドバイの民間企業で、逆説的リーダーシップ、環境への主体的な行動、従業員の両利き性が、持続可能性の成果にどう結びつくかを調べた（抄録）。", "p3": "エネルギー・建設・物流の民間企業の従業員201人の調査データで、知覚された環境の不確実性を含む統合モデルを検証した（抄録）。", "p5": "逆説的リーダーシップは環境への主体的な行動と持続可能性の成果の両方と正に関連し、環境の不確実性は主体的な行動を弱めたが、両利き性（探索と既存の実践の実行の両立）がその負の関係を和らげた（抄録）。", "fun": "先行きが不安なとき、社員は環境のための新しい取り組みに手を出しにくくなる。ところが、新しいことを試す力と、いつもの仕事をきちんとこなす力を両方持つ人は、不安の中でも取り組みを続けていた。矛盾をうまく扱うリーダーと社員が、持続可能な会社を支えている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 14.5, "citescore_year": "2025"}, {"rank": 46, "theme": "職場AI・組織行動", "headline": "活力を自ら管理する行動の日単位と個人単位の先行要因", "title": "Daily and person-level antecedents of proactive vitality management: the role of positive affect and proactive personality", "url": "https://doi.org/10.1108/cdi-10-2025-0621", "authors": "Delia Vîrgă ほか", "venue": "Career Development International", "date": "2026-09-30", "sjr": 1.386, "id": "jr46", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "従業員が仕事に合わせて自分の心身の活力を高める行動（主体的な活力管理）の先行要因を、個人の特性と日々の状態の両方の水準で調べた（抄録）。", "p3": "204人の従業員に12営業日連続で日誌式の質問票に答えてもらい（2,171日分の観測）、多層の構造方程式モデルで分析した（抄録）。", "p5": "主体的な性格は活力管理を直接には予測しなかったが、ポジティブな感情を媒介すると間接効果が現れ、ポジティブな感情は個人と日の両方の水準で活力管理と正に関連した（抄録）。日をまたぐ好循環の仮説は支持されなかった。", "fun": "疲れる前に休憩を取ったり、軽く体を動かしたりして自分の元気を保つ工夫は、どんな人がどんな日にするのか。前向きな性格そのものより、その日の気分の良さが決め手だった。気分が良い日ほど元気を保つ工夫をする、という身近な発見だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 7.7, "citescore_year": "2025"}, {"rank": 47, "theme": "職場AI・組織行動", "headline": "生成AIの多エージェントとの協働は学習と批判的思考を高めるか", "title": "Many hands make light work? Individual and collaborative interaction with a GenAI ‐powered multi‐agent system: Effects on learning performance and critical thinking", "url": "https://doi.org/10.1111/bjet.70089", "authors": "Xiaoyan Chu ほか", "venue": "British Journal of Educational Technology", "date": "2026-09-30", "sjr": 3.83, "id": "jr47", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "生成AIの多エージェント・システムを、個人で使うか仲間と協働で使うかによって、学習成果と批判的思考がどう変わるかを準実験で調べた（抄録）。", "p3": "教授設計の授業の大学生87人を、AIなしの仲間との協働、個人での多エージェントとの対話、協働での多エージェントとの対話の3条件に分け、知識テスト、設計課題、質問紙、系列分析と認識ネットワーク分析で評価した（抄録）。", "p5": "協働での多エージェントとの対話は課題の成績の高さと、個人での対話は批判的思考の意識の伸びの大きさと対応し、条件ごとに異なる思考の軌跡が見られた（抄録）。", "fun": "複数のAIがそれぞれ違う意見を出す相手なら、一つのAIより偏りの少ない考え方ができるかもしれない。仲間と一緒にAIと話すと作品の出来が良くなり、一人でAIと向き合うと「よく考えよう」という意識が伸びた。使い方で育つ力が違うのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 23.1, "citescore_year": "2025"}, {"rank": 48, "theme": "職場AI・組織行動", "headline": "AI化したBPO企業のテクノストレスと生産性", "title": "Primary Technostress Factors and Employee Productivity in AI Business Process Outsourcing: Evidence from Kenya", "url": "https://doi.org/10.59413/ajocs/v7.i5.19", "authors": "Fredrick Ogore ほか", "venue": "African Journal of Commercial Studies", "date": "2026-09-29", "id": "jr48", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ケニアの業務委託（BPO）企業で、AI化によるテクノストレスの3つの要因（技術・組織・個人の対処）が従業員の生産性に与える影響を混合研究法で調べた（抄録）。", "p3": "ナイロビの14社の368人の質問紙を重回帰で、15〜20人の面接とグループ討議を主題分析で分析した（抄録）。", "p5": "3要因の説明力は生産性の分散の4.5%（R²=.045）で、組織要因（β=0.137）と個人の対処要因（β=0.172）は有意な正の予測因子だったが、技術要因単独は有意でなかった（抄録）。面接では、訓練・技術支援・関与の有無が影響を左右すると語られた。", "fun": "AIやシステムが急に変わると働く人はストレスを感じるが、生産性を左右したのは技術そのものより、会社の支えや本人の対処のしかただった。新しい道具を入れるだけでなく、使い方を教え、相談できる体制を整えることが大事だと分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 49, "theme": "職場AI・組織行動", "headline": "包摂的リーダーシップと上司からの圧力が革新行動に与える影響", "title": "When inclusive leadership meets supervisory interaction pressure: explaining innovative behavior among public employees", "url": "https://doi.org/10.3389/fpsyg.2026.1960198", "authors": "Xiaoting Zhong ほか", "venue": "Frontiers in Psychology", "date": "2026-09-29", "id": "jr49", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の税務職員4,511人で、包摂的リーダーシップが革新的な行動と結びつく関係と、上司との関わりの圧力がそれを弱める条件を調べた（抄録）。", "p3": "横断的な調査データを確証的因子分析と調整つきの逐次媒介分析で分析し、心理的契約と公共奉仕の動機づけを媒介とした（抄録）。", "p5": "包摂的リーダーシップは革新的な行動と直接に正に関連し、上司との関わりの圧力は包摂的リーダーシップと心理的契約・革新的な行動の正の関係を弱めたが、その利点を消すことはなかった（抄録）。", "fun": "部下の意見を受け入れる上司のもとでは、改善のアイデアが出やすい。ただ、その上司が評価者として細かく口を出しすぎると、効果は弱まる。支えと評価を同じ上司が担う公務の職場ならではの難しさを示している。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 7.0, "citescore_year": "2025"}, {"rank": 50, "theme": "職場AI・組織行動", "headline": "AIへの懸念はジョブ・クラフティングにどう影響するか", "title": "How do individuals’ concerns about artificial intelligence affect their job crafting? Evidence from the Chinese hospitality sector", "url": "https://doi.org/10.1016/j.jik.2026.101167", "authors": "Qingjin Lin ほか", "venue": "Journal of Innovation and Knowledge", "date": "2026-09-30", "sjr": 2.96, "id": "jr50", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文を入手できず）", "preprint": false, "short": true, "p1": "題名から、中国の接客業で、AIへの懸念が従業員のジョブ・クラフティング（仕事を自分なりに作り変える行動）にどう影響するかを扱った研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「AIに仕事を奪われるかも」という不安が、人を萎縮させるのか、それとも自分の仕事を工夫して作り変える方向に動かすのかということだ。不安が行動をどちらに向けるかは、職場のAI導入を考えるうえで大切だ。", "unverified": "抄録・本文を入手できず、方法と結果は確認できなかった。"}, "citescore": 24.7, "citescore_year": "2025"}], "jnl_notable": [{"rank": 1, "field": "経済学", "headline": "リスクは企業の選択から内生的に生まれる", "title": "The Origin of Risk", "url": "https://doi.org/10.1093/qje/qjag048", "authors": "Alexandr Kopytov ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-09-30", "sjr": 33.069, "why": "企業が生産性の平均・分散・他社との共変動を選ぶ扱いやすいモデルで、ミクロとマクロのリスクがインセンティブから生じることを示した。", "id": "jn01", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "企業が自らの生産性の平均・分散・他社との共変動を選ぶ扱いやすいモデルを作り、ミクロとマクロのリスクがインセンティブによって内生的に生まれることを示した（抄録）。", "p2": "マクロ経済のリスク（GDPの変動）は外から与えられるショックとして扱われることが多い（抄録）。企業がどんなリスクを取るかという選択から、集計的なリスクがどう生まれるかは十分に説明されていなかった。", "p3": "各企業は生産性の過程の平均と分散、さらに他社の生産性との共変動を選ぶ（抄録）。企業どうしが互いに相関した生産性の過程を選ぶと、集計的なリスクが生じる。税やマークアップ（価格の上乗せ）などの歪みは、企業のリスクの取り方を通じて均衡のGDPの変動を変える。", "p4": "理論が予測する企業の規模・マークアップと変動・集計生産性との相関の関係をデータで確かめ、モデルを較正して歪みを取り除いた場合のGDPの変動を計算する（抄録）。データの種類と較正の詳細は未確認（本文を入手できず）。", "p5": "理論は、規模が大きくマークアップの低い企業ほど変動が小さく、集計生産性との相関も低いと予測し、データはこれを支持した（抄録）。較正したモデルでは、歪みを取り除くとGDPの変動が大きく下がった。", "p6": "未確認（本文を入手できず）。解釈：GDPの変動がどれだけ下がるかは較正の設定に依存し、具体的な大きさは本文で確認する必要がある。", "fun": "景気の波は、外からやってくる嵐のようなものと考えられがちだ。この論文は、企業一つひとつが「どれくらい冒険するか」「他社と同じ方向に賭けるか」を選んだ結果として、国全体の揺れが生まれると考えた。税などのゆがみが企業の賭け方を変え、国の景気まで揺らすという発想が面白い。", "unverified": "データの出所、較正の手順、GDPの変動の減少幅の数値は確認できなかった。"}, "citescore": 23.8, "citescore_year": "2025"}, {"rank": 2, "field": "組織行動・心理的安全性", "headline": "実験の外に現れる「幻のネットワーク」と主体性", "title": "Phantom Networks: Window on Agency in Social Mechanisms", "url": "https://doi.org/10.1287/orsc.2024.19305", "authors": "Ronald Burt ほか", "venue": "Organization Science", "date": "2026-09-30", "sjr": 7.929, "why": "実験で割り当てたネットワークを超えて生まれる行動上のネットワークが、社会的メカニズムの中の主体性を映すことを示した。", "id": "jn02", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "実験で割り当てたネットワークを超えて参加者が自ら作る関係（幻のネットワーク）が、社会的メカニズムの中の主体性（エージェンシー）を直接観察する窓になることを、3つの例で概念実証した（抄録）。", "p2": "主体性の証拠の多くは、人が何を思い出すか、他者がどう帰属するか、誰が行動したと見えるか、という「観客」の影響と絡み合っている（抄録）。主体性そのものを行動から直接観察する方法が限られていた。", "p3": "実験で割り当てた処置のネットワークと、参加者が実際に作った結びつきの差（行動上の逸脱）に注目する（抄録）。この逸脱を誤差ではなく「動いている構造」として扱い、主体性の行動上の痕跡とみなす。", "p4": "男女による仲介、競合する仲介、構造の再生産という3つの事例（展示）で、行動上の逸脱が何を示すかを見る（抄録）。実験の規模と分析方法の詳細は未確認（本文を入手できず）。", "p5": "3つの事例を通じ、行動上の逸脱はチームが「どれだけうまく」働くかではなく「どのように」働くかを、ときに意外な形で示した（抄録）。チームの成果は理論どおりだったが、その成果を生んだ行動は逸脱を見ることでより明らかになった。", "p6": "未確認（本文を入手できず）。著者は概念実証と位置づけ、今後の研究の方向を論じている（抄録）。", "fun": "実験で「あなたはこの人たちと組んで」と決めても、人は勝手に別の人ともつながる。これまでは実験の「はみ出し」として無視されがちだったこの行動を、その人の意思（主体性）が見える窓として使おうという提案だ。決められた枠からどうはみ出すかに、その人らしさが表れるという見方が面白い。", "unverified": "3つの事例の実験の設計、参加者数、具体的な結果は確認できなかった。"}, "citescore": 12.8, "citescore_year": "2025"}, {"rank": 3, "field": "機械学習", "headline": "不完全情報ゲームで規模の大きい意思決定を実現", "title": "Scalable decision-making for games of imperfect information", "url": "https://doi.org/10.1038/s41586-026-11036-y", "authors": "Samuel Sokota ほか", "venue": "Nature", "date": "2026-09-30", "sjr": 19.713, "why": "隠れた情報が多い状況で従来の強化学習が破綻する問題に対し、大規模に意思決定できる手法を示した。", "id": "jn03", "explain": {"basis": "本文", "basis_note": "出版社（Nature）のHTML本文（本論、Ataraxosの概要、評価、他のゲームへの適用、結論、方法の学習情報）を読んだ", "preprint": false, "p1": "駒の正体が互いに隠されたボードゲーム「ストラテゴ」で、史上最多の実績をもつ人間の名人に20戦で15勝1敗4分と大差で勝つAI（Ataraxos）を作り、隠れた情報が膨大な状況でも強化学習と探索が有効に働く設計の型を示した。", "p2": "チェスや囲碁のような完全情報ゲームと違い、不完全情報ゲームでは、ある判断の価値が、その前後にとった（あるいはとりえた）方策に依存する（本論、図1）。既存の最良の手法は公開情報に基づく変換を使うが、その費用は隠れた情報の量とともに増え、駒の配置が10の33乗通りを超えるストラテゴでは、数百万ドル規模の研究でも人間の頂点に届いていなかった。", "p3": "ゼロからの自己対戦による強化学習、隠れた情報を推定する信念ネットワーク、試合中の探索を組み合わせる（Overview）。強化学習では、学習の初期に強い正則化と大きな方策更新、後期に弱い正則化と小さな更新をとり、不完全情報で起きやすい循環や発散を抑える。探索では、信念ネットワークで相手の駒の正体の候補を生成し、各候補で候補手を試して価値を見積もり、その推定を自己対戦の結果とみなして現在の判断だけ1回更新する。ストラテゴでは、駒の初期配置と駒の動かし方を別々のネットワークで学ぶ。", "p4": "世界選手権4回優勝などの実績をもつPim Niemeijer氏と3週間にわたる20戦を行い、引き分けを半勝とする実効勝率で評価した（Evaluation）。さらに同じ手法を、駒の少ない変種Barrage Stratego（トップ3人と50戦×4）、協力型カードゲームHanabi、中国のトランプゲーム斗地主に適用し、人間の上位者や既存の最良のAIと比べた。", "p5": "Ataraxosは名人に15勝1敗4分（実効勝率85%）で勝ち、2025年の世界選手権の会場でのデモでも40戦で38勝2敗だった（Evaluation、図3）。Barrage Strategoでは4つの50戦すべてに勝ち、Hanabiでは2〜5人のすべての人数で最高記録を統計的に有意に更新し、斗地主では既存の最良のAIに有意に勝った。学習はH100 GPU 16台で1週間、費用は数千ドルで、先行研究と比べて計算費用は約500分の1、自己対戦の試合数は約30分の1だった（Training information）。", "p6": "著者は、名人との対戦は名人が適応できる一方でAIは適応しない非対称な設定で、試合の結果は独立同一分布ではないと認めている（Evaluation）。結論では、高速で正確な模擬器を作れる問題に適用範囲があるとしている。解釈：現実の意思決定では、模擬器の正確さ自体が最大の課題になりうる。", "fun": "ストラテゴは、自分の駒の正体（大将かスパイか爆弾か）を相手に隠したまま戦う軍人将棋のようなゲームだ。相手の配置は10の33乗通り以上あり、これまで巨額をかけたAIでも人間の名人に勝てなかった。この研究は、相手の駒を「たぶんこうだろう」と想像するAIと、想像の上で手を試すAIを組み合わせ、数千ドルの計算で名人を圧倒した。はったりや読み合いにもAIが強くなってきたことを示している。", "unverified": "探索の更新式の詳細（Methods）と、HanabiとDou Dizhuの具体的な得点の数値は確認していない。"}, "citescore": 77.7, "citescore_year": "2025"}, {"rank": 4, "field": "経済学", "headline": "家計アプリをスマホで見られると支出は変わるか", "title": "Mind the App: Mobile Access to Financial Information and Consumer Behavior", "url": "https://doi.org/10.1111/jofi.70087", "authors": "YARON LEVI ほか", "venue": "The Journal of Finance", "date": "2026-09-30", "sjr": 22.27, "why": "口座集約サービスの取引データで、PCからスマホアプリに移った利用者の支出の変化を調べた。", "id": "jn04", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "口座集約サービスの取引データで、同じサービスをPCで数か月使った後にスマホアプリを入れた利用者の支出を調べ、家計を手軽に確認できるようになると裁量的な支出が減ることを示した（抄録）。", "p2": "家計の状態を監視しやすくすることが消費支出に影響するかは、はっきり分かっていなかった（抄録）。アプリを入れる人は選択されているため、因果効果を識別する工夫が要る。", "p3": "iPhone、iPad、Androidでアプリの公開時期がずれたことを利用し、アプリを採用した人に条件づけた因果効果を識別する（抄録）。", "p4": "口座集約会社の取引データで、アプリの導入前後の裁量的な支出を比べ、時間帯や自制心の代理指標による違いも調べる（抄録）。", "p5": "アプリの導入後、利用者は裁量的な支出を減らした（抄録）。減少は夜の時間帯と、自制心の代理指標が低い人で大きく、監視による自己規制の経路や、自制にコストがかかるとする標準的なモデルと整合した。", "p6": "未確認（本文を入手できず）。解釈：効果はアプリを採用した人に条件づけたもので、採用しない人に同じ効果があるとは限らない。", "fun": "スマホで家計簿をいつでも見られるようになると、人はお金を使わなくなるのか。PCで家計管理をしていた人がスマホアプリを入れた後、ぜいたくな出費が減っていた。特に夜や、自分を抑えるのが苦手そうな人で減り方が大きい。「見える化」が衝動買いのブレーキになるという、身近で面白い結果だ。", "unverified": "支出の減少幅の数値と、自制心の代理指標の定義は確認できなかった。"}, "citescore": 16.8, "citescore_year": "2025"}, {"rank": 5, "field": "経営学", "headline": "規制当局の同業比較で銀行は自己資本比率を揃える", "title": "Mimicking Regulatory Peers", "url": "https://doi.org/10.1111/1475-679x.70086", "authors": "MINJAE KIM", "venue": "Journal of Accounting Research", "date": "2026-09-30", "sjr": 9.774, "why": "規制当局が同業者の情報を評価に使い公表することが、銀行の自己資本比率の群集行動を生むかを検証した。", "id": "jn05", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "銀行規制当局が同業他行（ピア）の情報を評価に使い公表することが、銀行の自己資本比率の「群れ行動」を招くことを、2004年のピアグループ改革を使って示した（抄録）。", "p2": "規制当局は銀行の評価にピアの情報を使い、それを公表している（抄録）。この規制上の利用と開示が、銀行の自己資本比率を同業者にそろえる行動を生むかは調べられていなかった。", "p3": "2004年の改革で、新設銀行は同じ時期に設立された銀行だけとピアグループを組むようになり、既存銀行は引き続き同規模の銀行と比べられた（抄録）。この改革の前後で、新設銀行の自己資本比率がピアの平均にどう反応するかを比べる。", "p4": "改革後の自己資本比率の群れ行動、資本の位置による反応の違い、資本不足の銀行の貸出の調整、その後の貸出の質、金融危機での破綻率、持株会社レベルのシステミック・リスクへの寄与を調べる（抄録）。", "p5": "改革後、銀行の自己資本比率の群れ行動が強まり、資本の相対的な位置によって、ピアの平均の変化に敏感になるか、平均に収束した（抄録）。資本の不足する銀行は貸出の構成を調整して比率を管理し、この差を埋める行動は、その後の貸出の質の悪化、金融危機での高い破綻率、持株会社レベルでのより大きなシステミック・リスクへの寄与と関連した。", "p6": "未確認（本文を入手できず）。解釈：改革の影響を受けたのは新設銀行で、既存銀行への一般化には注意が要る。", "fun": "「同業者の平均はこれくらい」と当局が公表すると、銀行はその平均に合わせようとする。テストの平均点が分かると、それに合わせて勉強を調整するのに似ている。ところが、平均に追いつくために無理な貸し方をした銀行は、後の金融危機で破綻しやすかった。情報を公開することの思わぬ副作用を示している。", "unverified": "効果の大きさ、使ったデータの期間と銀行数は確認できなかった。"}, "citescore": 13.4, "citescore_year": "2025"}, {"rank": 6, "field": "因果推論", "headline": "インフルエンザ予防接種の無料化は接種率を上げるか", "title": "The impact of free influenza vaccination schemes on vaccine uptake among older adults in Europe, 2019-2020", "url": "https://doi.org/10.1007/s10198-026-01983-8", "authors": "Arthur Juet", "venue": "European Journal of Health Economics", "date": "2026-09-30", "sjr": 1.062, "why": "欧州25か国の50歳以上で、予防接種の無料化制度が接種率に与える因果効果を推定した。", "id": "jn06", "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（実証戦略、データ、結果、仕組み、考察と結論の節）を読んだ。付録の表は読んでいない", "preprint": false, "p1": "欧州25か国の50歳以上で、インフルエンザ予防接種を無料にする制度が、年齢の区切りでの接種率を約6ポイント押し上げることを、国ごとの制度の違いと年齢の境界を組み合わせた「差の不連続」設計で示した。", "p2": "欧州の国々は毎年、高齢者向けの情報キャンペーンを行うが、無料接種の有無と対象年齢は国で異なる（要旨）。先行研究の年齢の境界での接種率の跳ね上がり（7〜10ポイント）は、情報提供と無料化の効果が混ざっていた（§Results）。", "p3": "年齢（月単位）を実行変数とする回帰不連続（RDD）の推定量を、無料接種のある国とない国で引き算する「差の不連続（difference-in-discontinuities）」で、情報提供だけに対する無料化の上乗せ効果を識別する（§Empirical strategy、式(1)）。まず全国をまとめたRDDを、国の固定効果、三角カーネル、データ駆動の帯域幅（69か月）で推定し、次に無料化との交互作用を入れる。", "p4": "欧州の高齢者パネル調査SHAREの第8波（2019年10月〜2020年3月）の横断データを使う（§Data）。コロナ禍の影響を避けるため、以後の波は使わない。頑健性として、帯域幅や標本の制限、仕様の変更、WHO推奨の65歳の採用、薬局での接種、医療費の自己負担、所得、前季の流行の強さ、政府への信頼との交互作用を確かめる（§Robustness checks）。", "p5": "全国をまとめたRDDでは、境界での接種率の上昇は約2ポイントで弱い有意性にとどまった（p=0.102、統制ありで0.089）（§RDD results）。差の不連続では、無料接種のある国で境界での接種率が約6ポイント有意に上がり（p<0.05）、情報提供だけの国では不連続は見られなかった（表4）。効果に世帯所得による有意な差はなく、無料化は金銭的な障壁の除去だけでなく、手間や意思決定の摩擦を減らす働きもすると解釈している（§Mechanisms）。", "p6": "著者は、制度を国単位で測っており国内の実施の違いは観測していないこと、推定は現在の年齢の境界付近に限られ若い層への拡大には一般化できないこと、2019〜2020年の季節の環境を反映しておりコロナ禍後に効果が変わった可能性があることを挙げている（§Discussion and conclusion）。", "fun": "「お知らせ」だけでも予防接種は増えるのか、それとも「無料」が決め手なのか。国によって無料になる年齢が違うことを利用し、その年齢の前後で接種率がどれだけ跳ねるかを国どうしで比べると、無料の国だけ6ポイントほど上がっていた。しかもお金持ちでも同じだけ増えたので、「無料」は財布の問題だけでなく、背中を押す合図として働いているらしい。", "unverified": "表3・表4の係数と標準誤差の正確な値、付録の頑健性の表は確認していない。"}, "citescore": 6.9, "citescore_year": "2025"}, {"rank": 7, "field": "人口学", "headline": "ノルウェーの胎児・乳児死亡は一定の割合で減り続けている", "title": "Fetal and infant mortality in Norway: A steady rate of decline over time", "url": "https://doi.org/10.1097/ede.0000000000002055", "authors": "Allen J Wilcox ほか", "venue": "Epidemiology", "date": "2026-09-30", "why": "ノルウェーの出生登録で、胎児・乳児の死亡率の低下が頭打ちか、相対的には一定の割合で続いているかを調べた。", "id": "jn07", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ノルウェーの出生登録の約60年分（1967〜2025年）で、死産と新生児死亡が頭打ちにならず一定の割合で減り続けていることを示し、その基準線から、うつぶせ寝の推奨による乳児の死亡を推計した（抄録）。", "p2": "胎児・乳児の死亡率は世界的に大きく下がったが、絶対的なリスクで見ると減り方は小さくなり、頭打ちも懸念されている（抄録）。", "p3": "ノルウェーの全国出生登録（Medical Birth Registry）で、死産と乳児死亡の減少率を記述する（抄録）。一定の割合で減る基準線を推定し、それを超える死亡を過剰とみなす。", "p4": "死産、新生児死亡（生後28日未満）、新生児期後の死亡（28日〜1歳）に分けて、年あたりの減少率を比べる（抄録）。", "p5": "死産は年約2.8%、新生児死亡は年3.7%の割合で約60年間減り続け、減速の兆しはなかった（抄録）。新生児期後の死亡は年3.5%で減っていたが、1973〜2000年に乳幼児突然死症候群（SIDS）の流行と重なる過剰死亡で中断した。この流行は乳児をうつぶせで寝かせる臨床上の推奨によるもので、1990年代初めに推奨が改められると元の減少の基準線に速やかに戻った。基準線から、うつぶせ寝の推奨で1,367人の乳児が亡くなったと推計した。", "p6": "未確認（本文を入手できず）。解釈：基準線を一定の減少率とみなす仮定に依存しており、過剰死亡の推計はその仮定の妥当性に左右される。", "fun": "ノルウェーでは約60年間、赤ちゃんの死亡が毎年ほぼ同じ割合で減り続けていた。ところが一時期だけその流れが崩れ、原因は「赤ちゃんはうつぶせで寝かせよう」という当時の医学の推奨だった。推奨をやめるとすぐ元の流れに戻った。いつもの減り方を「物差し」にすると、良かれと思った対策の害まで見えるという点が印象的だ。", "unverified": "減少率の推定方法と、1,367人の推計の信頼区間は確認できなかった。"}, "citescore": 6.8, "citescore_year": "2025"}, {"rank": 8, "field": "経済学", "headline": "山火事復興のクラウドファンディングは誰に届くか", "title": "Money to Burn: Crowdfunding Wildfire Recovery", "url": "https://doi.org/10.1111/jofi.70094", "authors": "J. ANTHONY COOKSON ほか", "venue": "The Journal of Finance", "date": "2026-09-30", "sjr": 22.27, "why": "大規模山火事のGoFundMeの募金を不動産・信用記録と結びつけ、募金が高所得世帯に偏ることを示した。", "id": "jn08", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "大規模な山火事の被災者によるGoFundMeの募金を、不動産の被害と世帯の信用記録に結びつけ、同じ被害でも所得の高い世帯ほど募金を立ち上げやすく、多く集めることを示した（抄録）。", "p2": "個人から個人へのクラウドファンディングは災害救援の重要な形になりつつあるが、その資金が誰に届くかはよく分かっていなかった（抄録）。", "p3": "大規模な山火事に関するGoFundMeの募金を、不動産の記録と世帯の信用記録に結びつける（抄録）。不動産の損失を一定としたうえで、所得による募金の有無と集まった額の違いを比べ、寄付者の広がり、地域外とのつながり、友人による呼びかけ、寄付者の気前のよさを調べる。", "p4": "比較は、不動産の損失を統制した所得層間の差である（抄録）。データの規模や推定モデルの詳細は未確認（本文を入手できず）。", "p5": "所得の高い世帯は、不動産の損失が同じでも、募金を立ち上げる確率が12ポイント高く、集める額が25%以上多かった（抄録）。この差は社会関係資本へのアクセスの不平等を反映しており、寄付者の層が広い、地域外のつながりが多い、友人の呼びかけが多い、寄付者が気前よい、という形で現れた。寄付者はオンラインの社会的な圧力にも影響されているようで、同じ仕組みは全国のパターンにも見られた。", "p6": "未確認（本文を入手できず）。解釈：1つの山火事の事例に基づくため、災害の種類や地域の違いによる一般化には追加の検証が要る。", "fun": "災害のとき、ネットで募金を呼びかける人が増えている。ところが山火事の被災者を調べると、同じだけ家を失っても、お金持ちの家庭ほど募金を始めやすく、たくさん集めていた。理由は、遠くの知り合いや声をかけてくれる友人が多いこと。助け合いの仕組みが、かえって格差を広げうるという指摘が考えさせられる。", "unverified": "対象の山火事の名前、世帯数、推定の詳細は確認できなかった。"}, "citescore": 16.8, "citescore_year": "2025"}, {"rank": 9, "field": "経営学", "headline": "個別株の保有は消費・投資・顧客の忠誠を変える", "title": "The Effects of Stock Ownership on Individual Spending, Investments, and Loyalty", "url": "https://doi.org/10.1287/mnsc.2024.05567", "authors": "Paolina C. Medina ほか", "venue": "Management Science", "date": "2026-09-30", "sjr": 6.428, "why": "市場全体でなく特定の株を買う行動バイアスが、生涯の消費・貯蓄・株式市場参加と企業への忠誠に与える影響を分析した。", "id": "jn09", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "市場全体ではなく特定の企業の株を持ちたがる投資の偏りが、生涯の消費・貯蓄・株式市場への参加に与える影響を分析し、特定の株を受け取ると、その企業の店での支出が増えることなどを示した（抄録）。", "p2": "市場ポートフォリオを持たず特定の銘柄を選ぶことは、投資の最も基本的な行動バイアスの一つだが、それが消費や長期の投資行動にどう影響するかは十分に分かっていなかった（抄録）。", "p3": "個人に証券口座が時期をずらして割り当てられたことと、準無作為に配られた株式の付与を使って、因果効果を識別する（抄録）。", "p4": "特定企業の株を受け取った後の、その企業の店での支出、総支出、長期の株式投資を比べる（抄録）。データの出所と規模の詳細は未確認（本文を入手できず）。", "p5": "特定企業の株を受け取ると、その企業の店での支出が増えた（抄録）。特定の株の保有は短期的には総支出を増やしたが、長期的には個人の株式市場への投資全体が増えた。", "p6": "未確認（本文を入手できず）。解釈：準無作為な株の付与という特殊な制度に基づく結果で、自ら銘柄を選ぶ通常の投資家にそのまま当てはまるかは慎重に考える必要がある。", "fun": "ある会社の株をもらうと、人はその会社のお店でたくさん買い物をするようになった。株主になると、その会社を応援したくなる「ファン」の気持ちが生まれるのかもしれない。しかも、最初は出費が増えても、長い目で見ると株式への投資そのものが増えていた。株を持つことが、人の消費と投資の習慣を変えるという面白い結果だ。", "unverified": "効果の大きさの数値と、準無作為な株の付与の制度の具体的な内容は確認できなかった。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 10, "field": "統計学", "headline": "ロジスティック対数尤度の最適で計算しやすい下界", "title": "Optimal and computationally tractable lower bounds for logistic log-likelihoods", "url": "https://doi.org/10.1093/biomet/asag060", "authors": "Niccoló Anceschi ほか", "venue": "Biometrika", "date": "2026-09-29", "sjr": 3.4, "why": "ロジットを含む最適化問題に、最適かつ計算しやすい下界を与えた計算統計の成果。", "id": "jn10", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "p1": "ロジスティック回帰などの対数尤度に対し、どの接する二次の下界よりも一様に鋭い「区分的二次の下界」を作り、最適化とベイズ推論を速く正確にできることを示した（抄録）。", "p2": "ロジット変換は二値データの回帰や分類で最もよく使われるが、その目的関数の最適化には解析解がない（抄録）。扱いやすい接する下界（minorizer）で近似し、MMアルゴリズムや変分ベイズに使う研究が進んできたが、二次の下界より鋭い下界を、扱いやすさを損なわずに作れるかは分かっていなかった。", "p3": "新しい区分的二次の下界を設計し、最も鋭いものを含むあらゆる接する二次の下界を一様に改善することを示す（抄録）。この下界は、古典的な一般化lasso問題として直接解釈できる。", "p4": "現実的な実証研究で、罰則つき最尤推定のMMアルゴリズムの収束の速さと、変分ベイズ近似の精度を、よく使われる二次の下界と比べる（抄録）。", "p5": "鋭い下界は、一般的なMMアルゴリズムの収束を速め、変分ベイズでよく使われる二次の下界よりも精度の高い、扱いやすい近似を与えた（抄録）。", "p6": "未確認（本文を入手できず）。解釈：区分的な下界は計算の手間が二次の下界より増える可能性があり、その費用と精度の釣り合いは本文で確認する必要がある。", "fun": "曲がった山の頂上を探すとき、山の下に、山にぴったり触れる「なだらかな丘」を置いて、その丘の頂上へ登ることを繰り返す方法がある。これまでは丘の形を放物線に限っていたが、この論文は、いくつかの放物線をつないだ形のほうが山に沿い、しかも扱いやすいことを示した。統計の計算を速くする、地味だが効き目のある工夫だ。", "unverified": "収束の速さと精度の改善の具体的な数値と、使ったデータは確認できなかった。"}, "citescore": 5.4, "citescore_year": "2025"}, {"rank": 11, "field": "因果推論", "headline": "PrEP開始後の性感染症の増加は検査の増加によるか", "title": "Enhanced screening and bacterial sexually-transmitted infection diagnoses after HIV pre-exposure prophylaxis initiation", "url": "https://doi.org/10.1097/ede.0000000000002052", "authors": "Anna M. Parker ほか", "venue": "Epidemiology", "date": "2026-09-30", "why": "HIV予防内服を始めた人の性感染症診断の増加が、感染の増加か検査の強化によるものかを因果推論で切り分けた。", "id": "jn11", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "HIVの曝露前予防内服（PrEP）を始めた人で淋菌・クラミジアの診断が増える現象の大部分（80〜81%）が、行動の変化ではなく無症状の検査の増加で説明できることを、自己対照症例シリーズと数理モデルで示した（抄録）。", "p2": "PrEPの利用者は非利用者より淋菌とクラミジアの診断率が高いが、それがPrEP開始による感染リスクの増加（行動の「リスク補償」）なのか、利用者が頻繁に検査を受けることによる診断の偏りなのかは不明だった（抄録）。", "p3": "同じ人のPrEP開始前後の診断率を比べる自己対照症例シリーズを使う（抄録）。開始前後の発生率比（IRR）を、感染リスクが変わらないという帰無仮説のもとでの期待値と比べ、その期待値は、PrEP開始後の検査の変化を反映した数理モデルをベイズの枠組みで推定して求める。", "p4": "2016〜2019年の米国の民間保険加入の男性のデータ（MarketScan）を使い、淋菌とクラミジア、感染部位（泌尿生殖器と性器外）ごとに比べる（抄録）。", "p5": "PrEP開始後、淋菌（IRR=3.47、95%CI 2.57〜4.72）とクラミジア（IRR=3.59）の診断率が上がり、性器外の診断（IRR=5.98）で大きく、泌尿生殖器（IRR=1.23）では小さかった（抄録）。検査の増加を考慮すると、診断率は「感染リスクは変わらない」場合の期待をわずかに（8〜14%）上回るだけで、診断の増加の80〜81%は無症状の検査の増加に帰属した。", "p6": "未確認（本文を入手できず）。解釈：民間保険加入の男性のデータに限られ、公的保険や女性などへの一般化には注意が要る。", "fun": "HIVの予防薬を飲み始めた人は、ほかの性感染症と診断されることが増える。これは「安心して行動が大胆になったから」とよく言われてきた。ところが同じ人の前後を比べ、検査の回数が増えた分を差し引くと、増加の約8割は「よく検査するから見つかるようになった」だけだった。見つかる数と実際の数は違う、という統計の落とし穴を示す好例だ。", "unverified": "数理モデルの具体的な構造と、対象者数は確認できなかった。"}, "citescore": 6.8, "citescore_year": "2025"}, {"rank": 12, "field": "機械学習", "headline": "ニュートリノ検出器の自己教師あり事前学習", "title": "Towards foundation-style models for energy-frontier heterogeneous neutrino detectors via self-supervised pretraining", "url": "https://doi.org/10.1038/s42256-026-01309-6", "authors": "Saúl Alonso-Monsalve ほか", "venue": "Nature Machine Intelligence", "date": "2026-09-30", "sjr": 6.902, "why": "高エネルギーのニュートリノ検出器の密な信号を、自己教師あり事前学習による基盤モデル型の手法で解釈した。", "id": "jn12", "explain": {"basis": "本文", "basis_note": "出版社（Nature Machine Intelligence）のHTML本文（結果：事前学習、データ効率、生成器の頑健性と領域間の転移、考察）を読んだ。方法の節は概要のみ", "preprint": false, "p1": "テラ電子ボルト級のニュートリノ反応が作る密で重なった検出器の信号を、自己教師あり事前学習した疎なVision Transformerで表現学習し、少ないラベルでもニュートリノの種類の識別や運動量の推定がよくなり、別の種類の検出器にも転移できることを示した。", "p2": "加速器ニュートリノ物理はエネルギーの最前線に入り、反応が非常に密で重なった信号を作るため、従来の再構成では解釈が難しく、ゼロから学習する教師ありモデルもラベルが少ないと苦しい（要旨）。", "p3": "検出器の各部分のデータを疎な3次元の区画（パッチ）として扱うVision Transformerを使う（要旨）。事前学習では、区画の75%を隠して復元させる課題（マスク自己符号化、MAE）と、区画ごとに幽霊信号（真の粒子に対応しない信号）・親子関係・粒子の種類を当てる関係課題を組み合わせ、その後、分類と回帰の課題を同時に微調整する（Results）。", "p4": "FASER実験で提案されている熱量計（FASERCAL）の模擬事象で、ゼロから学習（Scratch）、MAEのみ、MAE＋関係課題の3通りの初期化を同じ構造で比べる（Results）。ラベル数を100〜10万事象で変えたデータ効率の比較、別の事象生成器（NuWro）での評価、プラスチックシンチレータと液体アルゴンの公開ベンチマークへの転移も調べる（図4、表1）。", "p5": "ラベル10^3事象で、ニュートリノの種類のmacro-AUROCはScratchの0.736に対し、MAE＋関係課題で0.818となり、10^4事象で学習したScratch（0.807）を上回った（図4）。主要な反応点の誤差も239mmから100mmに減った。別の生成器では種類の識別はほぼ安定（0.932→0.928）したが、チャームの識別は0.864から0.721に下がった（表1a）。液体アルゴンの多粒子課題では、公表された最良値をわずかに上回った（表1c）。", "p6": "著者は、研究が模擬データに基づき事前学習の証拠は主に定性的であること、関係課題が模擬の正解に依存し生成器や検出器モデルの仮定を受け継ぎうること、チャームの識別が生成器に敏感であること、実験データでの検証がまだないこと、汎用の検出器基盤モデルを達成したとは主張しないことを明記している（Discussion）。", "fun": "高エネルギーのニュートリノがぶつかると、検出器の中は無数の粒子の跡が重なり合った「ぐちゃぐちゃの絵」になる。この研究は、まず絵の一部を隠して残りから推測させる練習を大量にさせてから、本番の課題を教えた。すると、正解つきの例が10分の1でも同じくらい見分けられるようになった。穴埋め問題で基礎力をつけるのは、人の勉強にも通じる。", "unverified": "図2の分類・回帰の全数値と、検出器の部分を外したときの結果（図3）の詳細は確認していない。"}, "citescore": 40.9, "citescore_year": "2025"}, {"rank": 13, "field": "組織行動・心理的安全性", "headline": "持続可能性研究の上下の動きを組織行動から捉え直す", "title": "Reframing Top‐Down and Bottom‐Up Dynamics in Sustainability Research: A Multilevel Framework for OB / HRM Scholars", "url": "https://doi.org/10.1111/joms.70169", "authors": "Chidiebere Ogbonnaya ほか", "venue": "Journal of Management Studies", "date": "2026-09-30", "sjr": 5.178, "why": "組織の持続可能性をめぐる上意下達と現場発の動きを、組織行動・人的資源管理の多層的な枠組みで整理した。", "id": "jn13", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "組織の持続可能性を、組織・部門・個人の各レベルの上からと下からの動きが作用し合う多層の過程として捉える枠組みを示し、Journal of Management Studiesの2010〜2026年の論文を4つの研究群に整理した特集の序論（抄録）。", "p2": "持続可能性の研究は、CSRやESGへの組織の取り組みといったマクロの論点に偏り、組織の中の人々の経験にあまり注目してこなかった（抄録）。", "p3": "持続可能性を、組織が社会・経済・環境の目標を釣り合わせながら、現在と将来の利害関係者のために長期的な価値を生む継続的な過程と定義する（抄録）。そのうえで、マクロ・メゾ・ミクロの組織の動きの相互作用を、人を中心に据えた多層の視点から整理する。", "p4": "同誌に2010〜2026年に掲載された論文から選んだものを特集として集め、研究の群を特定する（抄録）。選定基準の詳細は未確認（本文を入手できず）。", "p5": "特集の論文は4つの研究群に分かれ、正式な持続可能性の取り組みが、組織の各レベルの社会的な過程と個人の経験によって形づくられることを示していた（抄録）。持続可能性の目標が組織の行動に移されるうえで、人の管理の過程が中心的な役割を果たすと結論し、上からと下からの動きの相互作用を調べる今後の研究の方向を示した。", "p6": "未確認（本文を入手できず）。解釈：1誌の論文に基づく整理であり、他誌の研究を含めた体系的なレビューではない。", "fun": "会社の「環境に優しい宣言」は、社長が決めるだけでは実現しない。現場の一人ひとりがどう感じ、どう動くかで、宣言が本物になるかが決まる。この序論は、上からの方針と下からの動きが組み合わさって持続可能性が進むと整理し、人の働き方の研究がその鍵だと主張している。", "unverified": "4つの研究群の名前と、各群に含まれる論文は確認できなかった。"}, "citescore": 14.7, "citescore_year": "2025"}, {"rank": 14, "field": "統計学", "headline": "猛暑の経済効果の推定で空間・時間の依存を補正", "title": "Correcting for spatial and temporal dependence in estimating the economic effect of extreme heat", "url": "https://doi.org/10.1126/sciadv.aeg1967", "authors": "Abraham J. Wyner ほか", "venue": "Science Advances", "date": "2026-09-30", "sjr": 4.534, "why": "猛暑が地域の経済成長を下げるという先行研究の推定を、空間・時間の依存を補正して再検討した。", "id": "jn14", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "猛暑（年最大の5日平均気温）が地域の1人あたりGDPの成長を精度よく下げるという先行研究の主張を再検討し、データの空間・時間の依存やモデル選択を適切に扱うと、その精度が保たれないことを示した（抄録）。", "p2": "CallahanとMankinは、猛暑が地域の経済成長に精度の高い、経済的に意味のある効果をもつと主張した（抄録）。しかし、その推定がデータの空間的・時間的な依存を考慮した方法でも成り立つかは確かめられていなかった。", "p3": "国の構造を保った並べ替え（パーミュテーション）と、選択後の推論の補正で限界効果の区間を求め直す（抄録）。影響の大きい国や年を除く感度分析と、国の中の地域の構造と年効果のAR(1)をもつ階層ベイズモデルを使い、ローリングの予測検証も行う。", "p4": "元の推定の区間の幅、特定の国・年を除いたときの推定の変化、階層ベイズでの効果の縮小と信用区間、気候変数を加えたときの予測の改善を評価する（抄録）。", "p5": "並べ替えと選択後の補正で、限界効果の区間は大きく広がった（抄録）。推定は影響の大きい国と年に敏感で、除外すると効果が消えたり符号が逆転したりした。階層ベイズモデルでは不確実性がはるかに大きくなり、推定効果は67〜90%縮み、信用区間は0をまたいだ。ローリングの予測検証では、極端な気候の変数を加えても予測は改善しなかった。", "p6": "未確認（本文を入手できず）。解釈：効果が「ない」ことを示したのではなく、先行研究が主張した精度が支持されないという結論である。", "fun": "「猛暑の日が増えると地域の経済成長が落ちる」という話は、とても確からしく報告されていた。ところが、近くの地域や続く年のデータは似通っている（独立ではない）ことを考えて計算し直すと、その確からしさは大きく崩れた。データ同士のつながりを無視すると、結果を実際より確かに見せてしまう、という統計の教訓になっている。", "unverified": "使ったデータの期間と地域数、各手法の区間の具体的な値は確認できなかった。"}, "citescore": 19.0, "citescore_year": "2025"}, {"rank": 15, "field": "人口学", "headline": "国際移住と為替ショックは教育投資をどう変えるか", "title": "International Migration, Exchange Rate Shocks, and Education Investment", "url": "https://doi.org/10.1093/ej/ueag122", "authors": "Masyhur Hilmy", "venue": "Economic Journal", "date": "2026-09-29", "sjr": 5.181, "why": "インドネシアの帰国移民のデータと移住先の為替変動を使い、移住が故郷の教育投資に与える影響を調べた。", "id": "jn15", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "インドネシアの帰国移民のデータと、地域ごとの移住先の違いと為替ショックを使い、海外からの所得ショックが家計の教育投資を増やし、それに応じて政府も公立学校を増やすことを示した（抄録）。", "p2": "国際移民は海外から資源を送るが、それによって国が故郷への公共投資を減らすなら、開発に悪影響を及ぼしうる（抄録）。移民の送金と公共投資の関係は明らかではなかった。", "p3": "郡ごとの移民の移住先の違いと、移住先の国の為替の変動を組み合わせ、海外所得のショックの大きさを郡ごとに作る（抄録）。そのショックが家計の就学と、政府の学校や他の公共財の供給に与える効果を推定する。", "p4": "ショックの大きい郡と小さい郡で、就学、公立学校の数、その他の公共財を比べ、課税、選挙、行政区の分割といった経路を調べる（抄録）。", "p5": "ショックの大きい郡の家計はより多くの子どもを学校に通わせ、それを受けて政府は公立学校を増やした（抄録）。国は家計の投資を補う他の公共財も提供した。こうした反応は課税や選挙によるものではなく、説明責任の経路を強める行政区の分割によるものだった。", "p6": "未確認（本文を入手できず）。解釈：インドネシアの制度（行政区の分割）に依存した仕組みで、他国への一般化には注意が要る。", "fun": "出稼ぎに行った家族からの仕送りが増えると、国は「家庭がお金を出すなら」と学校への投資を減らすのでは、という心配があった。インドネシアでは逆に、仕送りで子どもを学校に通わせる家庭が増えると、政府も学校を増やしていた。家族の努力と政府の投資が支え合う関係になりうることを示している。", "unverified": "効果の大きさの数値と、データの期間・郡の数は確認できなかった。"}, "citescore": 7.2, "citescore_year": "2025"}, {"rank": 16, "field": "経済学", "headline": "金融政策の非中立性とヒステリシスで最適インフレ率は上がる", "title": "Monetary Policy Invariance, Hysteresis, and Optimal Inflation", "url": "https://doi.org/10.1093/restud/rdag104", "authors": "Mirko Abbritti ほか", "venue": "Review of Economic Studies", "date": "2026-09-26", "sjr": 23.622, "why": "内生的な生産性と名目賃金の下方硬直性をもつニューケインジアン・モデルで、最適なインフレ目標を再検討した。", "id": "jn16", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "内生的な生産性と名目賃金の下方硬直性をもつニューケインジアン・モデルで、失業と研究開発に非対称なヒステリシスが生じ、最適なインフレ率が2%を上回ることを示した（抄録）。", "p3": "内生的成長と名目賃金の下方硬直性の相互作用を組み込んだモデルで、長期のフィリップス曲線と、価格の歪みと産出のヒステリシスのトレードオフを分析した（抄録）。", "p5": "長期のフィリップス曲線は垂直でなくなり、厚生を最大にするインフレ率は2%を上回り、最適な目標からの逸脱の厚生費用は従来モデルの数倍だった（抄録）。失業率に反応するテイラー則が非対称なヒステリシスによりよく対処した。", "fun": "不況で失業が増えると、研究開発も減って、景気が戻っても経済の実力が元に戻らない「傷跡」が残る。この傷跡を考えると、インフレ率はやや高め（2%超）を目指したほうがよいという結論になる。中央銀行の目標の常識に一石を投じる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 15.7, "citescore_year": "2025"}, {"rank": 17, "field": "経済学", "headline": "債券と株式の相関の謎を実体経済から説明", "title": "The Real Channel for Nominal Bond‐Stock Puzzles", "url": "https://doi.org/10.1111/jofi.70092", "authors": "MIKHAIL CHERNOV ほか", "venue": "The Journal of Finance", "date": "2026-09-30", "sjr": 22.27, "why": "債券と株式の相関の符号が変わるとき消費の動きの性質も変わることを、逐次学習の枠組みで示した。", "id": "jn17", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "株式と債券の相関の符号が変わるとき、集計的な消費の動きの性質も変わることを示し、実質消費の面から債券・株式の謎を説明した（抄録）。", "p3": "リアルタイムの逐次学習の枠組みで、恒久的な消費ショックが優勢な状態、一時的なショックが優勢な状態、主に一時的な災害の状態の3つのレジームを識別した（抄録）。", "p5": "1990年代後半の第2から第1のレジームへの移行で、株式と実質債券の相関がデータどおり正から負に変わり、国際的にも同様の結果が得られた（抄録）。", "fun": "株と債券は、ある時期には一緒に上がり下がりし、別の時期には逆に動く。その切り替わりを、人々の消費の揺れ方が「長く続く変化」か「すぐ戻る変化」かの違いで説明した。金融市場の謎を実体経済から読み解いている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 16.8, "citescore_year": "2025"}, {"rank": 18, "field": "経済学", "headline": "超国家的な銀行監督は信用供給を増やしリスクを抑える", "title": "Supranational Banking Supervision, Credit Supply, and Risk‐Taking: European Evidence from Multi‐Country Credit Registers", "url": "https://doi.org/10.1111/jofi.70091", "authors": "CARLO ALTAVILLA ほか", "venue": "The Journal of Finance", "date": "2026-09-30", "sjr": 22.27, "why": "複数国の信用登録データで、欧州の銀行監督の一元化が貸出とリスクテイクに与えた影響を推定した。", "id": "jn18", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "複数国の信用登録データと、国ごとから超国家的な銀行監督への制度変更を使い、欧州の一元的な監督が信用供給を増やしつつ過度なリスクテイクを抑えたことを示した（抄録）。", "p3": "監督の一元化の前後で、金融ストレスのある国とない国、リスクの高い（ゾンビ）企業への貸出を比べ、その背景となる各国の制度・監督の能力・倒産法の違いを調べた（抄録）。", "p5": "超国家的な監督は、金融ストレスのある国でのみ信用供給を増やし、最もリスクの高い企業への貸出を減らし、ストレスのない国の貸出は減らさなかった（抄録）。", "fun": "銀行の監督を各国任せからヨーロッパ全体でまとめて行うようにしたら、危ない会社への貸し出しは減り、困っている国の健全な会社にはお金が回りやすくなった。監督する人が「地元のしがらみ」から離れることの効果が見えて面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 16.8, "citescore_year": "2025"}, {"rank": 19, "field": "経済学", "headline": "農業の労働集約度と個人主義・集団主義の起源", "title": "Agrarian Origins of Individualism and Collectivism", "url": "https://doi.org/10.1093/ej/ueag125", "authors": "Martin Fiszbein ほか", "venue": "Economic Journal", "date": "2026-09-30", "sjr": 5.181, "why": "米国の郡ごとの作物構成から過去の農業の労働集約度を測り、個人主義の地域差との関係を調べた。", "id": "jn19", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の郡について、1900年ごろの農業の労働集約度が高い地域ほど個人主義が弱いことを示し、その影響が今も残ることを示した（抄録）。", "p3": "作物ごとの必要労働と郡の作物構成から歴史的な労働集約度を測り、気候による作物構成の変動で内生性に対処し、子どもの珍しい名前の割合で個人主義を測った（抄録）。", "p5": "労働集約度が1標準偏差高いと個人主義は0.2〜0.3標準偏差低く、機械化や害虫ワタミハナゾウムシの被害による労働集約度の変化とともに個人主義も変わった（抄録）。現在の検索やSNSの言葉にも影響が残っていた。", "fun": "みんなで力を合わせないとできない農業をしていた地域では、子どもにありふれた名前をつける傾向、つまり「周りと同じ」を大切にする文化が育った。1900年ごろの畑仕事のやり方が、今のSNSの言葉づかいにまで影響しているというのが驚きだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 7.2, "citescore_year": "2025"}, {"rank": 20, "field": "経済学", "headline": "国内競争は企業の海外展開をどう変えるか", "title": "How Does Domestic Competition Affect Firms’ Foreign Market Expansion?", "url": "https://doi.org/10.1017/s0022109026103354", "authors": "Tiago Loncan ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-09-30", "sjr": 4.404, "why": "米国上場企業の文章に基づく指標で、国内の製品市場競争が生産の海外移転を促すことを示した。", "id": "jn20", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の上場企業で、国内の製品市場の競争が強まるほど海外での販売活動が増えることを、文章に基づく指標で示した（抄録）。", "p3": "1997〜2017年の米国上場企業のパネルと、生産の海外移転の文章に基づく指標を使い、内在的な開示の法理（転職時の秘密保持に関する判例）の段階的な否定による競争の変化で内生性に対処した（抄録）。", "p5": "国内の競争が強まると海外での販売活動が増え、その効果は無形資産と組織の能力が高く利益率の高い企業で主に見られた（抄録）。", "fun": "国内でライバルとの競争が激しくなると、会社は海外に打って出る。とくに、ブランドやノウハウなど目に見えない強みを持つ会社がそうしていた。国内の厳しさが、世界への挑戦を後押しするという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 7.1, "citescore_year": "2025"}, {"rank": 21, "field": "経済学", "headline": "石油供給ニュースショックの再検証", "title": "Revisiting Oil Supply News Shocks: Proxy vs. Non‐Gaussian Structural Vector Autoregressions", "url": "https://doi.org/10.1002/jae.70092", "authors": "Helmut Lütkepohl ほか", "venue": "Journal of Applied Econometrics", "date": "2026-09-30", "sjr": 3.547, "why": "石油供給の見通しショックの影響を、代理変数VARと非ガウスの構造VARで追試・比較した。", "id": "jn21", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "OPECの発表から作った代理変数で石油供給のニュースショックを識別した先行研究を追試し、非ガウス性と独立性による識別でも同じ特徴のショックが得られることを示した（抄録）。", "p3": "Känzig（2021）の構造VARの研究を再現し、代理変数の代わりにショックの非ガウス性と独立性を使う構造VARで識別を行った（抄録）。", "p5": "識別したショックの一つがKänzigの石油供給のニュースショックとよく対応し、同じ特徴のショックを得るのに代理変数は必ずしも必要ないことを示した（抄録）。", "fun": "「OPECの発表」という手がかりを使わなくても、データの揺れ方の「形」（正規分布からのずれ）だけで、石油のニュースの影響を取り出せた。別の道から同じ答えにたどり着いたことで、元の研究の結論がより確かになった追試の好例だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 5.4, "citescore_year": "2025"}, {"rank": 22, "field": "経営学", "headline": "ブランドを押し出さないコンテンツ・マーケティングと検索での目立ち方", "title": "Brand-Neutral Content Marketing and Endogenous Search Prominence", "url": "https://doi.org/10.1287/mksc.2023.0558", "authors": "Michelle Y. Lu", "venue": "Marketing Science", "date": "2026-09-30", "sjr": 8.324, "why": "ブランド中立の情報発信で消費者の最初の相談先になっても、競合に利用されうることを理論的に分析した。", "id": "jn22", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ブランドを直接宣伝しない「ブランド中立」のコンテンツ・マーケティングが、消費者の最初の相談先としての目立ち（検索の優位）を生むときの競争を、ゲーム理論で分析した（抄録）。", "p3": "消費者の検索の情報構造が価格づけの誘因をどう変えるかを分析し、目立つ「門番」と目立たない「追随者」の間の利益配分を調べた（抄録）。", "p5": "コンテンツ・マーケティングはライバルの価格づけの誘因に影響して逆説的な競争上の優位を与え、価格を信頼できる形で約束できないときは唯一の均衡戦略になった（抄録）。ブランドの強さと訴求の幅が、どちらの企業が採用するかを決めた。", "fun": "「宣伝しないお役立ち情報」を発信する会社は、お客さんが最初に訪れる場所になれる。ただ、自社製品が合うかまでは分からないので、ライバルに付け入る隙も生まれる。それでも有利になる条件を数学で解き明かしている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 9.3, "citescore_year": "2025"}, {"rank": 23, "field": "経営学", "headline": "多方向の動的マッチングで後悔を一定に抑える方策", "title": "Constant Regret Primal-Dual Policy for Multiway Dynamic Matching", "url": "https://doi.org/10.1287/mnsc.2023.01668", "authors": "Yehua Wei ほか", "venue": "Management Science", "date": "2026-09-30", "sjr": 6.428, "why": "到着が確率的な複数タイプの主体を組み合わせる動的マッチングで、パラメータを知らずに済む主双対方策を示した。", "id": "jn23", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "確率的に到着する複数タイプの主体を組み合わせる動的な多方向マッチングで、到着率を知らなくても常に後悔を一定に抑える主双対方策を提案した（抄録）。", "p3": "双対解の推定量に基づいて将来の到着に対するマッチングを計画し、最適基底の中のマッチングに限定しない（抄録）。", "p5": "到着率が未知でもあらゆる時点で一定の後悔を達成する初めての方策で、到着率が既知なら最適な尺度を達成し、数値シミュレーションで他の方策を大きく上回った（抄録）。", "fun": "腎臓の交換移植やライドシェアのように、次々に来る人を組み合わせる問題では、待たせすぎず無駄なく組むことが大切だ。来る人の多さを知らなくても、損失をずっと一定以内に抑えられる方法を示した。未来を知らずに賢く待つ技術だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 24, "field": "経営学", "headline": "文脈つきロバスト最適化で在庫と価格を決める", "title": "Managing Inventory and Pricing with Contextual Robust Optimization", "url": "https://doi.org/10.1287/mnsc.2024.06402", "authors": "Xun Zhang ほか", "venue": "Management Science", "date": "2026-09-30", "sjr": 6.428, "why": "需要モデルを正確に推定できない前提で、文脈情報を使ったロバスト最適化により在庫と価格を同時に決める方法。", "id": "jn24", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "需要モデルのパラメータの不確実性、誤差分布のあいまいさ、価格が需要に与える内生的な影響を同時に扱う、文脈つきロバスト最適化で在庫と価格を決めるモデルを示した（抄録）。", "p3": "有限標本での性能保証をもち、強化したアフィン型の対応で計算困難を解消し、より広い文脈つきの意思決定問題にも拡張できる（抄録）。", "p5": "数値研究で、推定してから最適化する従来法や、パラメータの不確実性を考えない残差ベースのロバスト最適化より、とくにデータが少ないときに優れ、文脈情報を使わない場合にも頑健だった（抄録）。", "fun": "売れ行きの予想は外れるものだし、値段を変えると売れ行き自体が変わる。そこで「予想が外れても大損しない」ように在庫と値段を同時に決める。データが少ない新商品ほど、この慎重な決め方が効くという結果が実務的だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 25, "field": "経営学", "headline": "兼業起業は移行経路か最適な状態か", "title": "Transitional Path or Optimal State? Hybrid Entrepreneurship and the Decisions to Enter and Exit Entrepreneurship", "url": "https://doi.org/10.1177/10422587261485972", "authors": "Sandra Graf ほか", "venue": "Entrepreneurship Theory and Practice", "date": "2026-09-30", "sjr": 5.67, "why": "兼業での起業が本格的な起業への通過点か、それ自体が最適な状態かを、参入と退出の決定から検証した。", "id": "jn25", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "会社勤めと起業を両立する兼業起業が、本格的な起業への通過点か、それ自体が最適な状態かを、大規模な米国データで検証した（抄録）。", "p3": "兼業起業が、切り替えの費用が本格的な起業への参入と起業からの撤退に与える影響をどう変えるかを調べ、「移行」と「状態」の2つの見方の予測を比べた（抄録）。", "p5": "結果は、兼業起業をそれ自体が最適な状態とみなす見方とより整合した（抄録）。", "fun": "会社員をしながら副業で起業する人は、いずれ独立するための準備段階だと思われがちだ。ところがデータは、多くの人にとって兼業そのものがちょうどよい働き方であることを示していた。「いつか独立」ではなく「ずっと二刀流」という生き方もあるのだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 21.9, "citescore_year": "2025"}, {"rank": 26, "field": "組織行動・心理的安全性", "headline": "ブリコラージュをレヴィ＝ストロースに戻って捉え直す", "title": "Reframing Bricolage as a Way of Inhabiting the World: Beyond Scarcity and Innovation with Lévi‐Strauss", "url": "https://doi.org/10.1111/joms.70168", "authors": "Raffi Duymedjian ほか", "venue": "Journal of Management Studies", "date": "2026-09-30", "sjr": 5.178, "why": "起業研究でのブリコラージュ概念を、原典に戻って系統的レビューで再 Applied Psychological Measurement", "date": "2026-09-30", "sjr": 1.287, "why": "尺度開発で、全標本・ブートストラップ・分割標本のどれで探索的・確証的因子分析をすべきかをシミュレーションで比べた。", "id": "jn28", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "尺度開発で、探索的・確証的因子分析を全標本、ブートストラップ、分割標本のどれで行うべきかを、8つの標本サイズのシミュレーションで比べた（抄録）。", "p3": "合成データと再標本化で、モデルの適合、信頼性、因子構造の再現性への影響を評価した（抄録）。", "p5": "分割した各半分が十分な条件を満たすときに分割標本の検証が最も妥当で、そうでなければ全標本と再標本化による安定性の確認がより一貫した証拠を与え、最低でも200件、項目の10倍以上の標本を推奨した（抄録）。", "fun": "アンケートの物差しを作るとき、データを半分に分けて「作る用」と「確かめる用」にするのが丁寧だとされる。でもデータが少ないと、分けたせいでどちらも不安定になる。何件あれば分けてよいかの目安（200件以上など）を示した実用的な研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 2.8, "citescore_year": "2025"}, {"rank": 29, "field": "機械学習", "headline": "AIが設計したタンパク質に機能を損なわない透かし", "title": "Function-preserving watermarking of AI-generated proteins", "url": "https://doi.org/10.1038/s41586-026-10965-y", "authors": "David Stutz ほか", "venue": "Nature", "date": "2026-09-30", "sjr": 19.713, "why": "生成AIで設計したタンパク質の出所を追跡できるよう、機能を保ったまま透かしを埋め込む手法。", "id": "jn29", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "AIで設計したタンパク質の配列と構造に、機能を損なわずに透かしを埋め込み、出所を確認できるようにする手法群（SynthIDBio）を示した（抄録）。", "p3": "配列版は機能を保ちながら配列に透かしを埋め込み、構造版は微調整したAlphaFold3で生体分子の構造に知覚できない透かしを埋め込む（抄録）。", "p5": "透かし入りの設計タンパク質の結合体は、透かしなしと同等の結合親和性を保ち、透かしの検出精度はほぼ完全だった（抄録）。", "fun": "AIが新しいタンパク質を次々に設計できる時代には、「これはAIが作ったもの」と見分ける目印が必要になる。写真の電子透かしのように、タンパク質の設計図にも見えない目印を入れ、しかも働きは変えない。生物の安全を守る新しい道具になりうる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 77.7, "citescore_year": "2025"}, {"rank": 30, "field": "機械学習", "headline": "数学の発見と探索を大規模に行う", "title": "Mathematical discovery and exploration can be done at scale", "url": "https://doi.org/10.1073/pnas.2536158123", "authors": "Bogdan Georgiev ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-09-30", "sjr": 3.283, "why": "LLMと自動評価を組み合わせた進化的コーディングエージェントAlphaEvolveを、多数の数学問題に大規模に適用した。", "id": "jn30", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "LLMと自動評価を組み合わせた進化的コーディングエージェントAlphaEvolveを、解析・組合せ論・幾何・数論の67問に適用し、数学の発見に使えることを示した（抄録）。", "p3": "解を提案・試験・改良する循環で数学的な構成を探索し、証明を生成するシステム（Deep Think、AlphaProof）とも組み合わせた（抄録）。", "p5": "多くの問題で既知の最良の解を再発見し、いくつかでは改善し、有限個の入力に対する結果を全入力に成り立つ式に一般化した例もあった（抄録）。", "fun": "AIが「こうしたらどうか」と数式やプログラムを次々に提案し、コンピュータがその良し悪しを採点する。この繰り返しで、数学者が長年挑んできた問題の記録をいくつか更新した。人間のひらめきを補う、新しい数学の相棒の姿が見えてくる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 14.7, "citescore_year": "2025"}, {"rank": 31, "field": "機械学習", "headline": "推薦システムの説明の特徴はその効果を左右する", "title": "The Impact of Explanation Characteristics on the Effects of Recommender Systems Explanations", "url": "https://doi.org/10.1145/3856207", "authors": "Kathrin Wardatzky ほか", "venue": "ACM Computing Surveys", "date": "2026-09-30", "sjr": 5.985, "why": "推薦システムの説明が信頼や透明性に与える効果が、説明のどの特徴で変わるかを整理した。", "id": "jn31", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "推薦システムの説明の特徴（形式や内容）が、信頼や透明性などの効果にどう影響するかを、180本の論文の系統的な調査で整理した（抄録）。", "p3": "6つの文献データベースを定めた語で検索し、採否の基準で選んだ論文から、説明の特徴と利用者評価で測られた効果を抽出・分類して組み合わせた（抄録）。", "p5": "説明の効果について一般的な結論は出せず、効果は文脈や、別の説明と比べたか説明なしのシステムと比べたかによって変わった（抄録）。", "fun": "「おすすめの理由」を表示すると、利用者はシステムを信頼するのか。180本の研究を集めると、答えは「場合による」だった。何と比べたかで結果が変わるという指摘は、研究の比較のしかたそのものを見直す手がかりになる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 65.2, "citescore_year": "2025"}, {"rank": 32, "field": "因果推論", "headline": "職業上の死亡を捉えるデータ体系の感度", "title": "Occupational Fatality Data Systems: A Sensitivity Analysis of North Carolina Data Systems for Occupational Fatality from 1992-2017", "url": "https://doi.org/10.1097/ede.0000000000002053", "authors": "Catherine S Wolff ほか", "venue": "Epidemiology", "date": "2026-09-30", "why": "ノースカロライナ州で1992〜2017年の職業上の死亡を、複数のデータ体系がどれだけ捉えているかを推定した。", "id": "jn32", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ノースカロライナ州の1992〜2017年の職業上の死亡について、検死官事務所のデータと死亡診断書がどれだけ職業上の死亡を捉えているか（感度）を推定した（抄録）。", "p3": "非職業上の死亡の5%を抽出して判定し直し、抽出率の逆数で誤分類を推定して、意図・手段・人種別の感度を計算した（抄録）。", "p5": "誤分類された職業上の死亡は推定1,520件で、全体の感度は67.8%だった（抄録）。感度は意図しない運転中の死亡で62.1%、意図的な死亡で61.3%と低く、黒人の死亡者で63.2%と白人の66.9%より低かった。", "fun": "仕事中の事故で亡くなった人の記録を調べ直すと、3分の1ほどが「仕事と関係ない死」として扱われていた。とくに運転中の事故や黒人の死亡で見落としが多い。統計に載らない犠牲は対策からも漏れてしまうので、数え方の正しさは命に関わる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 6.8, "citescore_year": "2025"}, {"rank": 33, "field": "因果推論", "headline": "高齢者の子宮体がん治療の指針遵守を監視するデータ源", "title": "Evaluating Data Sources for Monitoring Guideline-Concordant Endometrial Cancer Treatment Among Older Adults", "url": "https://doi.org/10.1097/ede.0000000000002051", "authors": "Caitlin E. Meade ほか", "venue": "Epidemiology", "date": "2026-09-30", "why": "がん登録などのデータ源で、指針に沿った治療かどうかの判定がどれだけ正確かを評価した。", "id": "jn33", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "高齢の子宮体がん患者で、がん登録（SEER）だけで判定した「指針に沿った治療」の割合が、治療の適切さを含むメディケア請求データでの判定より高く出ることを示した（抄録）。", "p3": "2000〜2019年に診断された高齢患者をSEER-メディケア連結データから特定し、請求データでは時期・化学療法の回数・放射線の分割数などの適切さを含めて、SEERでは治療の有無だけで、NCCNの推奨との一致を判定して比べた（抄録）。", "p5": "手術で29,209人、補助療法で14,372人のうち、指針に沿った治療の割合はSEERで高く（手術88.2%対79.8%、補助療法85.4%対71.6%）、一致度は中程度（κ=0.46、0.47）だった（抄録）。", "fun": "がん登録には「手術を受けたか」は記録されても、「適切な時期に十分な量の治療を受けたか」までは記録されない。そのため、登録だけで見ると指針どおりの治療が実際より多く見えていた。データが何を記録しているかで、医療の質の見え方が変わるという好例だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 6.8, "citescore_year": "2025"}, {"rank": 34, "field": "公衆衛生・疫学", "headline": "インフレ抑制法の前後で新薬の上市価格はどう変わったか", "title": "Prescription Drug Launch Price Trends Before and After the Inflation Reduction Act", "url": "https://doi.org/10.1001/jama.2026.17742", "authors": "Hariharan Shanmugam ほか", "venue": "JAMA", "date": "2026-09-30", "why": "過去20年の処方薬の上市価格の推移と、インフレ抑制法の開始後の変化を調べた。", "id": "jn34", "explain": {"basis": "題名", "basis_note": "抄録はなく、Crossrefには1文の研究の要約だけが登録されている。本文は取得できず", "preprint": false, "short": true, "p1": "要約から、過去二十年の処方薬の上市価格の推移と、米国のインフレ抑制法（IRA）の開始後の変化を調べた研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、薬の値段を抑える法律ができると、製薬会社は新薬の最初の値段を高めにつけて対抗するのかということだ。規制と企業の値付けのいたちごっこは、医療費を考えるうえで身近な問題だ。", "unverified": "抄録・本文を入手できず、方法と結果は確認できなかった。"}, "citescore": 26.0, "citescore_year": "2025"}, {"rank": 35, "field": "公衆衛生・疫学", "headline": "スリランカで心不全のポリピルを導入", "title": "Heart Failure With Reduced Ejection Fraction Polypill Implementation Strategy in Sri Lanka", "url": "https://doi.org/10.1001/jamacardio.2026.3719", "authors": "Anubha Agarwal ほか", "venue": "JAMA Cardiology", "date": "2026-09-30", "sjr": 6.028, "why": "駆出率の低下した心不全の固定用量配合剤について、実行可能性・服薬遵守・安全性を通常治療と比べた。", "id": "jn35", "explain": {"basis": "抄録", "basis_note": "抄録は1文の研究の要約のみ（Crossref）。本文は取得できず", "preprint": false, "short": true, "p1": "スリランカで、駆出率の低下した心不全の新しい固定用量配合剤（ポリピル）について、実行可能性・服薬遵守への効果・安全性を通常治療と比べた（抄録）。", "p3": "未確認（抄録は1文の要約のみで、設計の詳細は記載されていない）。", "p5": "未確認（抄録は1文の要約のみで、結果は記載されていない）。", "fun": "心不全の薬は何種類も飲む必要があり、飲み忘れが治療の妨げになる。何種類もの薬を1錠にまとめると、きちんと飲み続けられるのか。医療資源の限られた国で、簡単な工夫が命を守れるかを試す研究だ。", "unverified": "抄録が1文の要約のみで、研究の設計と結果は確認できなかった。"}, "citescore": 22.4, "citescore_year": "2025"}, {"rank": 36, "field": "公衆衛生・疫学", "headline": "やせ型の代謝異常関連脂肪肝の組織像と転帰", "title": "Histologic Features and Clinical Outcomes of Lean Metabolic Dysfunction–Associated Steatotic Liver Disease", "url": "https://doi.org/10.1001/jama.2026.18491", "authors": "Leyla de Avila ほか", "venue": "JAMA", "date": "2026-09-30", "why": "標準体重の人の代謝異常関連脂肪性肝疾患について、臨床・組織学的特徴と転帰を調べた。", "id": "jn36", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "41か国の生検で確定した代謝異常関連脂肪性肝疾患（MASLD）18,326人で、標準体重（やせ型）の患者の組織像・転帰と非侵襲検査の性能を調べた（抄録）。", "p3": "多国籍の後ろ向き観察研究で、BMIと腹囲でやせ型と過体重・肥満型を分け、全死亡と肝臓の臨床イベント、線維化の重症度、FIB-4と肝硬度測定（LSM）の性能を比べた（抄録）。", "p5": "やせ型はBMIで6.7%で、糖尿病（38.2%対48.3%）と進行した線維化（29.3%対37.2%）が少なかったが、全死亡（調整ハザード比0.90）や臨床イベントとは独立に関連せず、予後に関連したのは体型ではなく線維化の程度だった（抄録）。LSMはやせ型でも信頼できた。", "fun": "脂肪肝は太った人の病気と思われがちだが、やせた人にも起こる。やせ型の患者は肝臓の傷み方は軽めでも、その後の経過は太った人と変わらなかった。見た目の体型ではなく、肝臓の硬さ（線維化）を調べることが大切だという結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 26.0, "citescore_year": "2025"}, {"rank": 37, "field": "公衆衛生・疫学", "headline": "Y染色体の喪失と腹部大動脈瘤のリスク", "title": "Loss of Chromosome Y and Risk of Abdominal Aortic Aneurysm", "url": "https://doi.org/10.1001/jamacardio.2026.3981", "authors": "Taylor Nordan ほか", "venue": "JAMA Cardiology", "date": "2026-09-30", "sjr": 6.028, "why": "Y染色体の喪失と、部位別の大動脈瘤の発生との関連をコホートで調べた。", "id": "jn37", "explain": {"basis": "題名", "basis_note": "抄録はなく、Crossrefには1文の研究の要約だけが登録されている。本文は取得できず", "preprint": false, "short": true, "p1": "要約から、Y染色体の喪失（加齢とともに血液細胞で起きる変化）と、部位別の大動脈瘤の発生との関連を調べたコホート研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、年を取った男性の血液の細胞からY染色体が失われる現象が、お腹の大動脈がこぶのように膨らむ病気と関係するのかということだ。男性に大動脈瘤が多い理由の手がかりになるかもしれない。", "unverified": "抄録・本文を入手できず、方法と結果は確認できなかった。"}, "citescore": 22.4, "citescore_year": "2025"}, {"rank": 38, "field": "公衆衛生・疫学", "headline": "COMT遺伝子型とMIND食・認知機能低下・認知症", "title": "Interaction Between COMT Genotype and MIND Diet, Cognitive Decline, and Incident Dementia: A Prospective Cohort Study", "url": "https://doi.org/10.3390/nu18193232", "authors": "Marilyn C. Cornelis ほか", "venue": "Nutrients", "date": "2026-09-30", "sjr": 1.499, "why": "COMT遺伝子型によってMIND食と認知機能低下・認知症の関係が変わるかを前向きコホートで調べた。", "id": "jn38", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "地域の高齢者745人の前向きコホートで、COMT遺伝子型によって、MIND食（地中海食とDASH食を組み合わせた食事）と認知機能の低下・認知症の関係が変わることを示した（抄録）。", "p3": "Rush記憶と加齢プロジェクトの平均80.0歳の高齢者で、食物摂取頻度調査でMIND食の遵守度（0〜15点）を測り、線形混合モデルとCox比例ハザードモデルで遺伝子型との交互作用を調べた（抄録）。", "p5": "COMTとMIND食の交互作用はアルツハイマー型（p=0.003）と全認知症（p=0.004）で有意で、MIND食の1点あたりのアルツハイマー型認知症のハザード比はMet/Met型で0.82、Met/Val型で1.00、Val/Val型で1.05と、COMTの活性の低い人でMIND食の利益が大きかった（抄録）。", "fun": "体に良い食事が脳を守る効き目は、人によって違うかもしれない。ある遺伝子の型の人では、ベリーや緑の野菜の多い食事が認知症のリスクをはっきり下げていたが、別の型の人ではそうでもなかった。自分の体質に合った食事を選ぶ時代の手がかりになる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 10.2, "citescore_year": "2025"}, {"rank": 39, "field": "総合誌の成果", "headline": "蝶の翅の模様は飛翔中に強い錯覚の動きを生む", "title": "Butterfly wing patterns in flight create powerful illusory motion cues", "url": "https://doi.org/10.1038/s41586-026-11062-w", "authors": "George R. A. Hancock ほか", "venue": "Nature", "date": "2026-09-30", "sjr": 19.713, "why": "蝶の翅の高コントラストの模様が、飛んでいるときに捕食者の動きの知覚を惑わせる手がかりになることを示した。", "id": "jn39", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "蝶の翅の高コントラストの模様が、飛翔の動きと組み合わさって捕食者を惑わす錯覚の動きの手がかりを生むことを、複数の方法で示した（抄録）。", "p3": "蝶の離陸の高速撮影、系統を考慮した比較解析、生物に着想を得たモデルでの計算機上の進化実験、行動実験を組み合わせた（抄録）。", "p5": "高速撮影は誤解を招く動きの手がかりの発生を示し、比較解析はこれが進化的に広く見られる戦略であることを示し、計算機上の進化は独立に蝶に似た高コントラストの模様に収束し、行動実験がモデルの予測を確かめた（抄録）。", "fun": "シマウマやヘビのしま模様は、敵の目をくらますためと言われてきたが、証拠は乏しかった。蝶の場合、はばたく動きと翅の模様が組み合わさって、実際とは違う方向に動いているように見せる錯覚を生んでいた。動く動物ならではの目くらましの戦略だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 77.7, "citescore_year": "2025"}, {"rank": 40, "field": "総合誌の成果", "headline": "開けた海岸のマングローブの分布は波が決める", "title": "Global mangrove distribution on the open coast is controlled by waves", "url": "https://doi.org/10.1038/s41586-026-11089-z", "authors": "Sarah Wells ほか", "venue": "Nature", "date": "2026-09-30", "sjr": 19.713, "why": "世界のマングローブが開けた海岸のどこに生えるかを、波の条件が支配していることを示した。", "id": "jn40", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "開けた海岸で世界のマングローブがどこに生えるかは、波が主に決めていることを示した（抄録）。", "p3": "世界400地点の20年分の波の再解析データ（3つのうねりの成分を含む）を使い、波の力が弱い時期を「定着の好機」とする過程に基づくマングローブの有無のモデルを作った（抄録）。", "p5": "この機構的なモデルは78.2%の精度でマングローブの有無を当て、波の力のわずかな増減で生育の適否が変わることから、将来の地域ごとの波の気候の変化が分布を動かしうると示した（抄録）。", "fun": "マングローブの苗は、波にさらわれない「凪の時期」が続かないと根づけない。世界中の海岸 3, "field": "総合誌の成果", "headline": "アスガルド古細菌は突起を動かして這う", "title": "Dynamic protrusions mediate crawling motility in Asgard archaea", "url": "https://doi.org/10.1038/s41586-026-11063-9", "authors": "Philipp Radler ほか", "venue": "Nature", "date": "2026-09-30", "sjr": 19.713, "why": "真核生物に最も近い原核生物とされるアスガルド古細菌が、動的な突起で這って移動することを示した。", "id": "jn43", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "真核生物に最も近い原核生物とされるアスガルド古細菌が、アクチンに依存した突起を動かして這うように移動することを、生細胞の観察で示した（抄録）。", "p3": "Lokiarchaea系統とHodarchaea系統の2種を生細胞顕微鏡で観察し、アクチンの阻害剤を加えたときの変化も調べた（抄録）。", "p5": "細胞は分の単位で形を大きく変え、突起を毎分1.5〜4.8µmの速さで伸縮させ、ガラス面に接着して能動的に這った（抄録）。アクチン阻害剤を加えると動きが止まり、アクチンが中心的な役割を担っていることが示唆された。", "fun": "私たちの体の細胞（真核細胞）の祖先は、ある古細菌と細菌が合体して生まれたと考えられている。その候補のアスガルド古細菌が、アメーバのように手足を伸ばして這い回ることが分かった。細菌の仲間では珍しいこの能力が、進化の大事件のカギだったのかもしれない。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 77.7, "citescore_year": "2025"}, {"rank": 44, "field": "経済学", "headline": "包括的な患者契約で医療の質を高める", "title": "In sickness and in health: Motivating improved healthcare using holistic patient contracts", "url": "https://doi.org/10.1016/j.jpubeco.2026.105663", "authors": "Kevin Croke ほか", "venue": "Journal of Public Economics", "date": "2026-09-30", "sjr": 3.601, "why": "患者全体を対象にした契約で医療の改善を動機づける仕組みを扱っている（題名から判断）。", "id": "jn44", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は取得できず", "preprint": false, "short": true, "p1": "家庭医が高リスクの患者と全人的な「ケア契約」を結ぶ介入が、慢性疾患の検査・診断・治療を増やし、入院と死亡を減らしうることを示した（抄録）。", "p3": "介入は、単発の治療中心の関係から患者の福祉の全体計画へ関係を移すよう設計され、患者の全記録で受診・診断・処方・入院・死亡を追跡した実験である（抄録）。", "p5": "慢性疾患の検査・診断・治療がおよそ10%増え、入院が8%減った示唆的な証拠があり、軽度リスクの患者では探索的な事前指定の分析で全死亡が年20%減った（抄録）。", "fun": "かかりつけ医と患者が「病気になったら治す」ではなく「一緒に健康を守る」約束を交わすと、隠れた慢性病が早く見つかり、入院も減った。医者と患者の関係の結び方を変えるだけで医療の成果が変わりうる、という点が興味深い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 5.6, "citescore_year": "2025"}, {"rank": 45, "field": "経営学", "headline": "研究開発税制の恩恵を受けるのはどの企業か", "title": "Who rece     set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var groups = GROUPS.map(function (g) {
    return { key: g.key, label: g.label, parts: g.parts.filter(function (p) { return (REPORT[p[0]] || []).length > 0; }) };
  }).filter(function (g) { return g.parts.length > 0; });
  var parts = [].concat.apply([], groups.map(function (g) { return g.parts; }));
  var views = parts.map(function (p) { return p[0]; }).concat(["marks", "list"]);
  function groupOf(view) {
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].parts.length; j++) { if (groups[i].parts[j][0] === view) return groups[i]; }
    }
    return null;
  }
  var lastInGroup = store.get("pd-sub-v1", {});
  var marks = store.get("pd-marks-v1", {});
  var saved = store.get("pd-pos-" + REPORT.date, { view: views[0], index: 0 });
  var start = { part1: "related", part2: "notable" }[saved.view] || saved.view;
  var state = { view: views.indexOf(start) >= 0 ? start : views[0], index: saved.index || 0 };
  var stage = document.getElementById("stage");
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  // date selector
  document.getElementById("daylabel").textContent = " " + REPORT.date;
  var sel = document.getElementById("datesel");
  ARCHIVE.forEach(function (d, i) {
    var o = el("option", null, d + (i === 0 ? "（最新）" : ""));
    o.value = d; if (d === REPORT.date) o.selected = true; sel.appendChild(o);
  });
  sel.addEventListener("change", function () {
    var d = sel.value, latest = ARCHIVE[0];
    var href = META.kind === "archive" ? (d === latest ? "../index.html" : d + ".html") : (d === latest ? "index.html" : "archive/" + d + ".html");
    location.href = href;
  });

  // tabs: 最新 / Top誌 / ★ / 一覧, and under a source the 関連 / 注目 sub-tabs
  var tabs = document.getElementById("tabs"), subtabs = document.getElementById("subtabs");
  function select(view) {
    stopSpeech(false);
    state.view = view; if (view !== "list") { state.index = 0; }
    var g = groupOf(view);
    if (g) { lastInGroup[g.key] = view; store.set("pd-sub-v1", lastInGroup); }
    render(); window.scrollTo(0, 0);
  }
  function addTab(key, text, label, onClick) {
    var b = el("button", "tab", text); b.type = "button"; b.dataset.view = key;
    if (label) { b.setAttribute("aria-label", label); b.title = label; }
    b.addEventListener("click", onClick);
    tabs.appendChild(b);
  }
  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);
    addTab("group:" + g.key, g.label + " " + n, null, function () {
      var v = lastInGroup[g.key];
      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + (THEME_CLASS[it.theme] || "--accent-soft") + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
