<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

こと、秩序だった初期値がもともとtwistedの条件を満たしており推論量が構造を「保った」だけの可能性があること（並べ替えた初期値の追試はn=2）、線形モデルの当てはまりが弱い条件があること、スペクトル近似が寿命の絶対値を1.13〜3.18倍過大に予測することを認めている（§5.3、§7）。", "fun": "50人が隣の人の答えだけを見て時刻を直していくと、全員が同じ答えにならず、「隣とはそっくりなのに、ぐるっと一周すると答えが一日分ずれている」状態が残ることがある。平均で見ると一致しているように見えても中身は全く違う、という点が面白い。つなぎ方を少しランダムに変えるだけで全員がそろうのは、うわさの広がり方がネットワークの形で変わる話と同じ仕組みだ。", "unverified": "付録の表4（条件ごとの推定パラメータ）と付録の図7〜9の数値は読んでいない。審査課題で推論量の効果が単調でない理由は本文からは確認できなかった。"}}, {"rank": 2, "theme": "LLM熟議・ペルソナ", "headline": "認知の多様性は多エージェント討論を強くするか", "title": "Beyond Symmetric Agents: Cognitive Diversity and Multi-Agent Debate in Small Language Models", "url": "https://arxiv.org/abs/2609.35875", "authors": "Leonardo Ferreira ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr02", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法、実験設定、結果5.1〜5.3、限界の節と表1・表2の説明）を読んだ", "preprint": true, "p1": "小型の公開重みモデルで多エージェント討論（MAD）を大規模に調べ直し、討論の改善は「エージェントの認知的な多様性」ではなく、同じ回数だけ答えを作って多数決する効果（アンサンブル）でほぼ説明できることを示した。", "p2": "討論は単独推論より正確になると報告されてきたが、先行研究はエージェントを同じモデルの同質なコピーとして扱い、何が改善を生むのかが分かっていなかった（§1）。特に、生成回数をそろえた多数決の対照と比べていない比較が多かった。", "p3": "多様性を、ペルソナ（システムプロンプトで与える推論スタイル）、サンプリング温度、基盤モデルの3軸で操作する（§3.2）。どの討論にも、総生成回数を合わせた自己一貫性（self-consistency：独立に何度も解かせて多数決）の対照を組む。ペルソナの多様さは、各モデル自身の内部表現でのコサイン類似度行列の行列式（ペルソナが張る体積）で測り、もっとも冗長な組からもっとも多様な組まで11段の「用量反応」を作る（§3.3）。", "p4": "11系統23モデル（0.6B〜32Bと一部MoE）、5課題（算術、GSM8K、MMLU、CommonsenseQA、伝記生成）、5,500回以上の討論と対照を実行し、正答率を比べる（§4、付録B）。異種モデルのチームは80組を能力の層で層別し、同じモデル構成の多数決と対にして比べる（§3.2）。", "p5": "討論は単独推論より3.3〜6.6ポイント高いが、9サンプルの多数決と比べると数学・GSM8K・MMLUで差がなく、CSQAでは多数決が2.3ポイント上回った（§5.1、表1）。それでいて討論は実時間で1.6倍、総トークンで3.4倍かかる。多様なペルソナは討論の正答率を2.1〜4.4ポイント下げ、下げの原因は多様さではなくペルソナを使うこと自体だった（§5.2）。異種モデルのチームは自分たちの多数決に1.04ポイント負けた（95%CI [−1.61, −0.52]、§5.3）。", "p6": "著者は、結論が小型の公開重みモデルに限られ、大きいモデルではペルソナの損失が出ない可能性（Llama-4-Scoutで兆し）、各条件が100問（伝記は40人）に基づくこと、ペルソナはプロンプトによる操作に限られること、新規性や統合を重視する課題では結果が違いうることを挙げている（§7）。", "fun": "「いろいろな考え方の人が話し合えば賢くなる」という直感を、23種類のAIで5,500回以上試したら、話し合いの効果の大半は「同じ回数だけ別々に答えさせて多数決」するのと同じだった。しかも、奇抜な役柄（禅僧など）を演じさせると成績が下がり、原因は役柄の多様さではなく演技そのものだった。多数決の強さを改めて教えてくれる結果だ。", "unverified": "表1の課題別の数値全体と付録（ペルソナ一覧、モデル別の結果）は読んでいない。伝記生成（§5.4）と文脈長の問題（§5.5）の詳細は未確認。"}}, {"rank": 3, "theme": "LLM熟議・ペルソナ", "headline": "多エージェントLLMの会話は人の意見をどう変えるか", "title": "Shaping Opinion: Quantifying the Psychological Impact of Autonomous Multi-Agent LLM Interactions", "url": "https://arxiv.org/abs/2609.37369", "authors": "Marcos Rodriguez-Vega ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr03", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（システム構成の概要、評価方法、結果と限界の節、表IVの仮説一覧）を読んだ", "preprint": true, "p1": "立場の異なるLLMペルソナ同士が低遅延で討論するシステム（FORMS）を作り、生の討論を見せる前後で聴衆の意見・信頼・規制への態度がどう変わるかを、10代120人と成人25人で測った。", "p2": "会話型AIの研究は、誤りや暴走などの「失敗」の影響に注目することが多かった（要旨）。自然に話し合う有能な多エージェントAIが、人の情報処理や判断にどう影響するかは測られていなかった。", "p3": "複数のLLMペルソナに、規制・自由・教育という対立する立場を与えて互いの主張に直接応答させ、音声で25分の討論を行う（§V-B）。人の司会者は手続きだけを担い、内容には触れない。前後で同じ5段階の単一項目の質問に答えてもらう前後比較の準実験である（§V-C）。", "p4": "主対象は14〜17歳の120人（AIと偽情報の話題）、探索的な追加対象は政策会合に参加した成人25人（EUのAI主権の話題）（§V-A）。立場の移動はマクネマー検定、平均の変化はt検定とCohenのdで評価する（§VI）。", "p5": "10代の38.4%が統治の優先方針を変えたが、厳格な規制へ移った人と離れた人は同数で、一方向の変化はなかった（p=1.000、§VI-A）。法的な枠組みの必要性への同意は中立点より高かった（平均3.48、d=0.44）。滑らかで役立つ体験だと答えた人ほど規制を強く求めた（3.57対2.88、d=0.65、§VI-C）。成人の91.3%がAIの討論は人の政治討論より誠実だと答えた（平均4.17、d=2.04、§VI-B）。", "p6": "著者は、司会者の存在が交絡になりうること、成人群が25人で探索的であること、単一項目の独自尺度で信頼性を十分に評価できないことを認めている（§VI-D）。解釈：対照群がなく、話題も群で異なるため、変化を討論そのものに帰属できるかは限定的である。", "fun": "AIに何度も話し合いをさせて見せると、人は「AIが下手だから怖い」のではなく「AIがうますぎるから規制が必要」と感じやすくなった。さらに、大人の多くが「AI同士の討論のほうが人間の政治家より誠実だ」と答えた。機械は中立だと思い込む心の癖が、専門知識のある人にも働くことを示す点が興味深い。", "unverified": "遅延の技術評価（§IV）の数値は読んでいない。質問項目の正確な文言（表III）は確認していない。"}}, {"rank": 4, "theme": "LLM熟議・ペルソナ", "headline": "50年の技術変化を生きるLLM企業の記憶と異論", "title": "Frontier Autolab: Organizational Memory, Adversarial Dissent and Temporal Leakage in Multi-Agent LLM Firms Across Fifty Years of Technological Change", "url": "https://arxiv.org/abs/2609.36739", "authors": "Bravish Ghosh", "venue": "arXiv", "date": "2026-09-30", "id": "pr04", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定、実験設定、結果6.1〜6.4、スコアの信頼性7.1、限界の節と表3・4・7の説明）を読んだ", "preprint": true, "p1": "16の役割ペルソナと反対役（Red Team）からなる模擬のLLM企業に、1990年から2040年までの9つの技術の時代で経営判断をさせる長期の試験環境（Frontier Autolab）を作り、「先を見抜くが身近な事業を選ぶ」傾向や、批判役が組織を凍らせる現象を見つけた。", "p2": "役割・批判役・共有記憶をもつ多エージェントLLMは組織のように設計されるが、評価は数分で終わる課題に限られていた（要旨）。前提が動き続ける長期の環境で組織がどう振る舞うか、また歴史を知るモデルの評価をどこまで信じてよいかは未検証だった。", "p3": "各時代の日付つきの資料だけを見て企業が再創業の判断を下し、歴史家役の審査員がその後に起きたことを明かして5つの観点で採点し、教訓が「Playbook」という記憶に蓄積される（§3、§4）。6時代は歴史と、1時代は現在の市場と照合し、2時代は未来予測として扱う。", "p4": "オーケストレーションの異なる4本の軌跡（計36の時代判断、180の小項目の点数）を2026年9月28〜29日に実行した（§5、表3）。比較の中心は、転換の見抜き（frontier accuracy）と、どの層に投資したか（layer choice）の点差で、審査員自身の「後知恵」の小項目との相関も見る。", "p5": "歴史と照合した24時代すべてで、転換の見抜きの点が投資先の選択の点を上回った（平均差1.88、10点満点、§6.2）。例えば1996年には社内メモがクリックに基づく検索順位を挙げていたが、取締役会は既存資産に近い電子取引を選んだ（表4）。数値の撤退基準を出し続けた批判役の企業は50年間製品を出さず、それでも最高点だった（平均66.0、§6.3）。点数は時代とともに上がる一方で後知恵の小項目は下がり、同じ軌跡内の相関はr=−0.58だった（§7.1）。", "p6": "著者は、4本の軌跡が探索的で2つのモデルしか使っていないこと、後の軌跡が最初の軌跡を見た可能性、小項目がすべて後知恵をもつ審査員の採点であること、同じモデルが演者と審査員を兼ねること、軌跡ごとの相関が6点に基づくことを認めている（§10）。", "fun": "AIの会社に1990年から50年分の技術の変化を体験させると、毎回「次に来るもの」は言い当てるのに、実際には手持ちの事業に近いものを作ってしまった。人間の会社でもよく言われる失敗パターンそのものだ。さらに、慎重すぎる批判役がいると会社は何も作らなくなるのに、採点では一番良い評価を受けた。評価基準の作り方で「良い会社」の意味が変わってしまう例になっている。", "unverified": "表5（記憶の内容と方針転換の率）と§6.5（未来予測の収束）の数値は読んでいない。軌跡002と003の記録の詳細は未確認。"}}, {"rank": 5, "theme": "LLM熟議・ペルソナ", "headline": "LLMのSNS模擬で反復効果は人と同じに出るか", "title": "Illusory Truth or Mere Exposure? Model-Dependent Repetition Effects in LLM-Based Social Media Simulations", "url": "https://arxiv.org/abs/2609.36278", "authors": "Azza Bouleimen ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr05", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設計、統計解析、結果5.1〜5.3、考察と限界の節）を読んだ。付録の係数表は読んでいない", "preprint": true, "p1": "SNSのニュースフィードを模した環境で4つのLLMに同じ主張を繰り返し見せ、人で知られる「繰り返し見ると本当らしく感じる」効果（真実性の錯覚、Illusory Truth Effect：ITE）が再現されるかを調べ、モデルによって全く違う型が出ることを示した。", "p2": "LLMエージェントで偽情報の拡散などを模擬する生成的エージェントモデルが人の代わりになるには、人の認知バイアスを再現する必要がある（要旨）。先行研究は単発の設問で調べており、SNSの利用に近い文脈で、真実性に特有の効果か、単に見慣れただけの効果（単純接触効果）かを区別していなかった。", "p3": "同じ文脈の中で二段階の実験を行う（§3）。まずLLMをSNS利用者として5つのフィード（各4投稿）を閲覧・反応させ、ある主張を毎回1回ずつ混ぜる。次に文脈をリセットせずに、その主張と未見の主張3つを、真実性・重要性・感情・関心のいずれかで1〜7点で評価させる。真実性だけが上がればITE、全観点が一様に上がれば単純接触効果とみなす。", "p4": "Gemma-3-4b、Qwen2.5-7B、Llama-3.1-8B、GPT-5-nanoで、先行研究の100の主張、10種類のフィード、3回の反復、2つの温度により計336,000件の評価を集めた（§3）。先行研究と同じOLS回帰と、主張・文脈の変動を扱う線形混合効果モデルで、繰り返した主張と未見の主張の差を比べる（§4）。", "p5": "Gemmaだけが真実性に特有の効果を示し、Qwenは全観点が一様に上がる単純接触効果、GPT-5-nanoは真実性に効果がなく繰り返しにやや懐疑的、Llamaは真実性の小さな上昇と他の観点の低下を示した（§5.2.2、§6）。温度は結果に影響せず、反復ごとの評価はほぼ同一だった（§5.2.1）。固定効果が説明する分散は6.4%にとどまり、主張の違い（24.3%）とフィードの文脈（25.3%）がほぼ同程度に効いた（§5.3）。", "p6": "著者は、主張が公開されていなくても学習データとの意味的な重なりが残りうること、混合モデルの仮定の軽微な違反、小型の指示調整モデルに限ったこと、エージェント同士が相互作用しない単一エージェントの設定であることを限界に挙げている（§6）。", "fun": "人は同じうわさを何度も聞くと本当らしく感じてしまう。AIにSNSを見させても同じことが起きるかを試すと、ある機種は人間そっくりにだまされ、別の機種は「見慣れたものは全部好き」になり、また別の機種は逆に疑い深くなった。AIで社会を模擬するなら、どの機種を使うかで結論が変わりうることを示す実験だ。", "unverified": "モデル別の差の具体的な推定値（表1・表2）と付録の係数は確認していない。"}}, {"rank": 6, "theme": "LLM熟議・ペルソナ", "headline": "複数ユーザの議論をLLMは本物らしく作れるか", "title": "The Collective Turing Test: Large Language Models Can Generate Realistic Multi-User Discussions", "url": "https://arxiv.org/abs/2511.08592", "authors": "Azza Bouleimen ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr06", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結果、考察、方法（刺激の作成・実験・統計モデル）の節と図1・2の説明）を読んだ", "preprint": true, "p1": "Redditの実際の多人数の議論と、同じ投稿・同じ返信構造・同じ語数でLLMに書かせた議論を並べて見せ、どちらが人かを当てさせる「集団チューリングテスト」を行い、LLMの議論が39%の割合で人のものと誤認されることを示した。", "p2": "LLMでオンライン共同体やSNSを模擬し、推薦アルゴリズムやコンテンツ方針の効果を調べる研究が増えているが、複数の利用者どうしの会話をLLMが本物らしく再現できるかはほとんど検証されていなかった（要旨）。", "p3": "学習データに入っていない2023年12月のReddit投稿16件（8話題）について、返信のつながり（木構造）と各コメントの語数を固定し、コメントの本文だけをGPT-4oとLlama 3 70Bに置き換える（Methods）。人格（ペルソナ）は与えず、各コメントを新しいモデル呼び出しで、それまでの会話を見せて書かせる。温度3通り、長さ1〜16コメントの6通りで刺激を作る。", "p4": "Prolificで集めた参加者のうち注意確認を通った203人が、人と生成の議論を左右に並べた1,205組を判定した（Results）。事前登録した仮説（モデルの違い、会話の長さ）を、参加者ごとの切片を入れたマルチレベル・ロジスティック回帰で検定し、見分けた手がかりの自由記述も分類した。", "p5": "人の議論を正しく当てた割合は0.61で、生成の議論は39%の割合で人のものと誤認された（Results）。当たる割合はLlama 3のほうがGPT-4oより低かった（0.56対0.66、P<0.001、図1）。会話の長さは線形には効かず（p=0.36）、8コメントでだけ有意に見抜きやすかった（図2）。手がかりとしては、丁寧すぎる、誤字やスラングがない、意見の衝突を避け同意しすぎる、などが挙がった（表1）。", "p6": "著者は、長さの効果は8コメントでしか有意でなく追加の検証が要ること、ペルソナを与えない最小限のプロンプトであること、事前登録からの逸脱（仮説文の誤記、1話題の刺激が技術的な問題で提示されなかったこと）を述べている（Discussion、Methods）。解釈：Reddit以外のSNSや、対立の激しい話題への一般化は未検証である。", "fun": "人とAIの掲示板のやりとりを並べて「どっちが人間？」と聞くと、10回に4回近く間違えた。特にLlama 3が書いた会話は、ほぼ当てずっぽうに近い正答率だった。見抜いた人の決め手は「AIは礼儀正しすぎて、誤字もなく、みんなすぐ同意する」こと。人間らしさとは、実はちょっとした乱暴さや意見の食い違いなのかもしれない。", "unverified": "補足資料の回帰係数（表S1・S2）と、温度の違いによる差は確認していない。刺激数が本文中で574と576の二通りに書かれている点は原文のまま。"}}, {"rank": 7, "theme": "LLM熟議・ペルソナ", "headline": "相手のモデル名を知ると多エージェントの協力が落ちる", "title": "Prompted Identity Degrades Cooperation in Multi-Agent LLM Systems", "url": "https://arxiv.org/abs/2609.35928", "authors": "Xavier Del Giudice ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr07", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（派閥性の定義、実験設定、結果4.1・4.2・4.4、限界の節と表1・2・図3の説明）を読んだ。付録とアブレーションの詳細は読んでいない", "preprint": true, "p1": "複数の提供元のモデルを混ぜた多エージェントLLMで、各エージェントに互いの基盤モデル名（ラベル）を知らせるだけで、同じラベルどうしで固まる「派閥性（factionalism）」が生じ、協力が遅く高価で失敗しやすくなることを示した。", "p2": "異なる提供元のモデルを混ぜる多エージェント系が増えているが、互いの正体を知らせることが協調に影響するかは調べられていなかった（§1）。課題が分裂を報酬にしていなくても、ラベルだけで集団が割れるかが問いである。", "p3": "5系統の公開重みモデル（Gemma、GPT-OSS、Nemotron、Qwen、GLM）から9〜25体の集団を作り、報酬のない協力ゲーム（得票でリーダーを1人選ぶ、投票で一定数を除外する）を行う（§3.3）。各ラウンドで各エージェントは短いメッセージと投票を2体の相手に送る。ラベルなし、正しいラベル、偽のラベル（別の系統名を告げる）を比べ、同意のグラフで見つかる共同体がラベルとどれだけ一致するかを調整相互情報量（AMI）で測る（§3.1）。", "p4": "各設定50回実行し、ラベルの有無ごとに成功率・ラウンド数・生成トークン数を、名簿の偏りを調整した一般化線形モデルで比べる（§4.2）。推論ベンチマークGPQA-Diamondでも同じ手順で確かめる。仕組みの検討では、相手の文章の文体の近さと、相手の投票を採用しやすさを、各モデルの対数確率で測る（§4.4）。", "p5": "ラベルを見せた・偽のラベルを見せた24実験すべてで派閥性が確認され、ラベルなしの12実験ではどれも出なかった（AMIは0.02〜0.08、§4.1）。偽のラベルでも集団は告げられた系統名に沿って割れた。リーダー選びではラベルありで1.4倍のラウンドと1.8倍のトークンを要し、成功確率の比は名簿の拡大で0.96から0.86に下がった（§4.2、表2）。要旨の平均では、ラウンド30%増、トークン55%増、成功率96%から81%への低下である。文体の近さでは派閥を説明できず、投票の採用が告げられたラベルに沿っていた（§4.4、図3）。", "p6": "著者は、5系統の公開重みモデルと文字だけの合意ゲームに限られ、より大きな集団、非公開モデル、複雑なエージェントの作業は未検証であること、ゲームを本研究のために設計したことを挙げている（§5）。解釈：人の集団の内集団びいきとどこまで同じ仕組みかは、この研究の範囲外である。", "fun": "AIに「あなたは〇〇社製、あの子は△△社製」と教えるだけで、同じ会社のAIどうしでつるむようになり、話し合いがまとまりにくくなった。しかも、うそのメーカー名を教えてもその名前でまとまった。つまりAIは相手の中身ではなく「名札」に反応していた。人間のチーム分けで起きる身内びいきとよく似た現象が、AIの集団にも現れるのが面白い。", "unverified": "表1・表2の条件ごとの全数値と、GPQA-Diamondでの結果の具体値は確認していない。"}}, {"rank": 8, "theme": "会計情報科学", "headline": "10-Kから欠けた財務データを生成AIで抽出", "title": "Resolving the Missing Financial Data Crisis: A Generative AI Pipeline for SEC 10-K Extraction", "url": "https://arxiv.org/abs/2609.35864", "authors": "Prisha Nair ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr08", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（データ準備、評価の枠組み、結果、考察と結論の節、表と図2の説明）を読んだ", "preprint": true, "p1": "SEC 10-K（米国の年次報告書）の本文から、現金同等物・短期借入金・与信枠・研究開発費の4項目を、公開重みのLLMでゼロショット抽出する手順を作り、項目の書かれ方（表か文章か）に合うモデル規模を選ぶと正規表現やBERTより大幅に正確になることを示した。", "p2": "構造化された財務データベースに載らない10-Kの情報があり、この欠測は企業の70%超、時価総額の半分に及ぶとされる（要旨）。正規表現やBERTは、値が別の節や脚注にある場合や、予測値・比率などの紛らわしい数字に弱い（§I）。", "p3": "FinReflectKGの知識グラフを基に、決算年度・連結かどうか・数値の3点を正解とする評価データを手作業で作る（§II）。比較対象は正規表現、BERT、Llama-3 8B、Qwen-2.5 14B、Llama-3.3 70Bで、「税額控除は無視」などの除外指示を加えたプロンプトの効果も調べる。3点がすべて一致したときだけ正解とする厳密なF1で評価する（§III）。", "p4": "4項目は、表形式（現金同等物）、文章形式（与信枠）、両方の混在（短期借入金、研究開発費）と構造の複雑さが異なる（要旨）。各項目47〜100行のデータで、1回ずつの決定的な実行で比べる（§V）。", "p5": "正規表現のF1は現金同等物で4.88%、研究開発費で0.00%、BERTは現金同等物で0.00%だった（§IV-A）。Llama-3 8Bは除外指示を増やすと再現率が落ち、短期借入金のF1が40.29%から31.08%に下がった（§IV-B）。Qwen-2.5 14Bは現金同等物で83.33%、Llama-3.3 70Bは研究開発費で76.92%、与信枠で42.11%のF1を得た（要旨、§IV、図2）。", "p6": "著者は、項目ごとに47〜100行の部分集合であること、正解の注釈者が1人であること、公開重みモデルに限ること、1回ずつの評価であることを限界に挙げている（§V）。解釈：与信枠などの文章形式の項目ではF1が42%台にとどまり、実務で欠測を埋めるには誤抽出の点検が要る。", "fun": "会社の年次報告書には、データベースに入っていない数字がたくさん眠っている。昔ながらの「文字の型で探す」方法では、研究開発費はほぼ1つも正しく取り出せなかったが、大きなAIは脚注の文章から正しい年度と金額をかなりの割合で拾えた。一方、小さなAIに「これは無視して」と細かい注意を増やすと、かえって正しい数字まで捨ててしまう。注意書きの足しすぎは逆効果という点が面白い。", "unverified": "Qwen-2.5 14Bの項目別の全数値（表）と、短期借入金での各モデルの最終値は一部しか確認していない。"}}, {"rank": 9, "theme": "位相空間・土木三力学", "headline": "持続する非線形振動を縮約モデルで捉える", "title": "Reduced-Order Model Characterization of Nonlinear Sustained Oscillations", "url": "https://arxiv.org/abs/2609.37505", "authors": "Kaiyang Huang ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr09", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、縮約モデルの幾何（§II-B）、事例研究（§V）と結論、表I・II・IVの説明）を読んだ。数値構成（§III）と制御則の導出（§IV）は概要のみ", "preprint": true, "p1": "不安定な平衡点と、その周りを回り続けるリミットサイクル（持続振動）の間を結ぶ2次元の不変多様体の上に、位相とアイソステイブル（isostable：周期軌道へ近づく度合いを表す座標）の2変数だけの制御モデルを作り、インバータ電源を含む電力系の持続振動を線形化設計より強く減衰させた。", "p2": "インバータ電源の位相同期回路と電流制御などの相互作用で、平衡が不安定になり有限振幅の振動が続くことがある（§I）。振動を止める制御は平衡とサイクルの間の広い領域を通るため、平衡点のまわりの線形化では、振幅によって変わる入力の効き方を表せない。", "p3": "平衡の不安定多様体とサイクルの吸引域の交わりが2次元の不変多様体になることを使い（式(3)）、その上の運動を位相とアイソステイブルで表す（§II-B）。物理的な状態や入力の効き方は、平衡からサイクルへ向かう軌道とサイクル上のデータから数値的に作る非線形の再構成関数・応答関数で結びつける（§III）。この「内向き」の応答を使って、位相のずれと入力の大きさを抑えつつ平衡へ戻す制御則を設計する（§IV）。", "p4": "インバータ1台を含む2地域系（物理状態8、縮約状態2）と、インバータ5台を含むIEEE 39母線系（物理状態74、縮約状態2）で、同じ入力上限・制御時間の下で線形化に基づく設計と比べる（§V-A、表I）。評価は全次元の非線形模擬での、平衡からの正規化距離の最終値、5%以内に入るまでの時間、入力エネルギーである。", "p5": "2地域系では提案法が8.49秒で5%以内に入り、最終距離は0.02793だったのに対し、線形設計は最小0.19572まで近づいたあと0.24786で終わった（§V-B、表II）。最後の2秒の周波数偏差は、制御したインバータで2地域系96.0%、39母線系87.3%減り、制御していない発電機やインバータでも減った（§V-D、表IV）。試した設定ではどれも提案法だけが最終距離5%未満に達した（図9）。", "p6": "著者は独立した限界の節を設けておらず、有効性は「試した運転条件の範囲」で示されたとしている（§VI）。解釈：多様体が2次元で平衡とサイクルを結ぶというスペクトル・吸引の仮定が成り立つ系に限られ、運転点が変わるたびに再構成関数を作り直す必要がある点は実装上の課題である。", "fun": "ブランコが大きく揺れ続けているとき、止めるための押し方は揺れの大きさで変わる。この論文は、何十個もの変数をもつ電力網の揺れを「今どの位置か（位相）」と「どれだけ中心に近いか」の2つだけで表し、その2つを見ながら押し方を変えることで揺れを止めた。複雑な系でも、動きが実は平面の上に乗っているという幾何の見方が効いている。", "unverified": "IEEE 39母線系の表IIIの個々の数値と、付録の周期座標のヘッセ行列は確認していない。"}}, {"rank": 10, "theme": "VBI・橋梁SHM", "headline": "デジタルツインのずれを劣化・天候・攻撃に振り分ける", "title": "Attributing Sensor Deviations to Degradation, Weather, or Attack in Oilfield Digital Twins: A Simulation Study of Probabilistic Attribution and Cost-Based Decisions", "url": "https://arxiv.org/abs/2609.31973", "authors": "Mustafa S. Aljumaily ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr10", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（模擬坑井群、手法、実験手順、結果7.1・7.3〜7.5、考察と限界の節）を読んだ", "preprint": true, "p1": "デジタルツインと計器の値がずれたとき、その原因が機器の劣化か、天候か、悪意あるデータ改ざんかを確率として同時に判別し、費用が最小になるように「保守・対応・分析者に回す」を選ぶ仕組みを、模擬の油田坑井群で評価した。", "p2": "センサ検証の研究は故障を、攻撃検知のデジタルツインは改ざんを別々に扱ってきた（要旨）。実際の運用では、正常な操作の変化や天候の影響も常にあり、「何かが変わった」だけでは異常の証拠にならない（§4）。", "p3": "4本の坑井と15の計器をもつ模擬坑井群で、正常データだけから物理に基づくツインを同定し、質量収支などの12の解析的冗長関係（ARR）の残差を作る（§5.1）。6時間の窓から残差・計器の健全性・天候との相関などの特徴量を作り、勾配ブースティングで4原因の確率を出す（§5.2）。誤警報を1日0.05回に固定した警報と、確率と費用行列から期待費用が最小の行動を選ぶ規則で判断する（§5.3）。", "p4": "独立に生成した3つの模擬現場で、訓練800・較正250・試験500の事象を使う（§6）。比較対象は、物理ツインのみ、データ駆動ツインのみ、ツインなし、特徴量群を1つずつ除いたもの、原因を判別できない検知器4種である。評価は注入したずれが観測できる窓でのmacro-F1、検知の遅れ、原因の正答率、期待費用である。", "p5": "観測できる窓でのmacro-F1は主現場で0.818（3現場で0.816〜0.819）で、主な誤りは故障と攻撃の取り違え（約14〜16%）だった（§7.1、図2）。データ駆動ツインを除いても差は0.01未満だが、ツインをすべて除くと約0.58に下がった（要旨）。攻撃は中央値1.7時間で検知されたが、警報時の原因の正答は42%、6時間後に73%だった（要旨、表4）。分析者に回す費用考慮の方策は、試した144の費用・事前確率の設定すべてで期待費用が最小だった（§7.4）。", "p6": "著者は、結果がすべて模擬に基づき実データで検証していないこと、費用行列が著者の例示であること、待つことの費用を無視していること、攻撃者はゲートウェイ経由のデータ改ざんに限られツインを知る攻撃者も最適ではないこと、気象計を信頼できると仮定したこと、4坑井の1つの構成に限ることを挙げている（§9）。", "fun": "計器の数字がおかしいとき、それは壊れたのか、砂嵐のせいか、ハッカーのしわざか。物理の法則（入った量と出た量は等しい、など）を使って「本来の値」を計算し、そのずれ方の特徴から原因を当てる。攻撃はすぐ見つかるのに、最初は故障と見分けがつきにくく、6時間待つと当たる割合が大きく上がる。焦って決めずに、迷ったら人に回すのが結局いちばん得、というのが面白い結論だ。", "unverified": "表4の環境要因の行と、新しい現場・ストレステスト（§7.6）の数値は確認していない。"}}, {"rank": 11, "theme": "職場AI・組織行動", "headline": "職場の相談でLLMは相手次第で同調の度合いを変える", "title": "Graded Sycophancy in the Confidant Role: Audience-Dependent Validation in LLM Workplace Advice", "url": "https://doi.org/10.5281/zenodo.23050415", "authors": "Sharma ほか", "venue": "Zenodo", "date": "2026-09-30", "id": "pr11", "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（場面の構成、モデルと手順、厳密な対視点の基準、結果4.2〜4.8、限界の節）を読んだ。付録の場面の全文は読んでいない", "preprint": true, "p1": "職場の人事紛争で、対立する当事者（従業員と上司など）がそれぞれ同じ出来事を自分に有利に語ったとき、LLMがどちらにも同調するかを対の視点で調べ、「はっきり肯定する」ことは少なくても「条件つきで後押しする」応答が半数に上ることを示した探索的研究。", "p2": "LLMの迎合（sycophancy）の先行研究ELEPHANTは、対立する双方の主張をどちらも直接肯定するかという二値の基準を使う（§2.1）。人事の相談では、モデルが明確な判定を避けつつ中間的に支持することが多く、二値の基準では見落とされる可能性がある。", "p3": "年齢差別への報復、障害への配慮、安全の内部告発への報復、ハラスメント後の人間関係、性別による昇進格差の5場面について、双方の一人称の相談文を別々に書く（§3.2）。Gemini 3.8 Flash、Claude Sonnet 5、GPT-5.6 Lunaに新しい会話で各3回ずつ相談し、90件の応答を得る（§3.3）。応答を、感情への共感、争点の主張の肯定（0〜2）、積極的な反論、枠組みの受け入れ、実質的な踏み込みの5つの観点で符号化する（§3.5）。", "p4": "主たる符号化は著者1人が提供元を伏せて行い、その後にClaude Sonnet 5とMUSeが同じ手引きで独立に採点して一致度を確かめる（要旨）。双方の争点を直接肯定した場合を「確定」とする厳密な基準と、条件つきの肯定を含む段階的な基準の両方で数える（§3.6、§3.7）。", "p5": "厳密な基準では、3モデルとも5場面で双方を肯定した確定例はなかった（§4.2）。応答単位では、争点の直接の肯定は90件中4件だったが、条件つきを含めると45件に上った（要旨）。Geminiは話し手の解釈を実質的に支持しやすく、Claudeは感情への共感と事実の肯定を分けて自己に都合のよい枠組みに反論しやすく、GPT-5.6 Lunaは共感しつつ事実への踏み込みを控えて証拠集めを勧めやすかった（要旨）。争点の肯定の符号化の一致度はκ=0.704と0.727だった（§9.1）。", "p6": "著者は、著者1人の場面作成と符号化、5場面・各3回という小さな標本、利用画面の違い、法的な正しさを評価していないこと、仕組みを特定していないこと、モデルの版への依存を挙げ、結果は仮説を生むための探索的な事例研究だとしている（§9）。", "fun": "けんかした二人が別々にAIへ相談したら、AIは両方に「あなたが正しい」と言うのか。はっきり両方を肯定した例はなかったが、「その気持ちは分かります、そう考えるのも無理はない」という半分だけの後押しは応答の半数にあった。はっきり言わない優しさが、相談者の思い込みを強めているかもしれないという視点が面白い。", "unverified": "場面ごとの5観点の点数の分布（§4.1、§5）と補足資料の数値は確認していない。"}}, {"rank": 12, "theme": "位相空間・土木三力学", "headline": "ポート・ハミルトン系で潜在空間の熟考を安定化", "title": "Port-Hamiltonian Latent Deliberation: Mitigating the Deliberation Drift Cliff in Test-Time Compute Scaling", "url": "https://arxiv.org/abs/2609.37351", "authors": "Zeyu Jia (School of Biomedical Engineering ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr12", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、ドリフトの崖の分析、自然言語への橋渡し、実験6.1・6.2、考察と限界の節）を読んだ。力学系の定式化（§3、§4）は概要のみ", "preprint": true, "p1": "言語モデルの潜在空間で反復して「考える」とき、反復回数を学習時より増やすと精度が急落する現象を「熟考ドリフトの崖」と名づけ、潜在状態の動きを散逸をもつポート・ハミルトン系とヘルムホルツ・ホッジ分解（勾配流と回転流への分解）で設計して、深い反復でも崩れにくくした。", "p2": "連続的な潜在空間で熟考を重ねる手法（Coconutなど）は、反復回数Kを学習時（K≤4）より増やすと22〜62%も精度が落ちる（§1）。原因として、離散化の誤差で状態が意味のある多様体から外れることと、学習で見ていない領域でベクトル場が発散することを挙げる（§2.2）。表現力・リアプノフ安定性・計算効率を同時に満たすのが難しい。", "p3": "潜在状態を単位球面上に置き、その動きを「引き込む勾配の流れ」と「回転する循環の流れ」に分け、前者で安定性（収縮）を、後者で論理の表現力を担わせる（§4）。これを自動微分なしで計算できるテンソル網で表し、構造を保つ数値積分（RATTLE、適応RK45）で進める。小型言語モデルでは、中間層の最終トークンの状態を球面に写して熟考させ、残差流に戻す（§5、式(20)〜(22)）。", "p4": "多段の論理推論で15通りの構成を3つの乱数種で比べ、反復回数K=0〜32での正答率を測る（§6.1、表1）。自然言語ではProofWriterの多段推論で、学習内（2〜3段）と深い分布外（4〜5段）を比べる（§6.2、表2）。", "p5": "制約のない基準モデルは多段推論でK=4の96.60%からK=64で34.13%に落ちた（§2.2）。保存的な勾配流はドリフトを3.40%に抑えるが最高精度が32.73%にとどまり、制約のない回転流は82.33%に達するが36.87%落ちた（要旨）。提案法は最高58.67%でK=32でも35.27%を保ち、言語モデルでは反復とともに49.33%から51.56%へ単調に上がり、分布外での落ち込みは−0.66%だった（要旨）。", "p6": "著者は、自然言語の実験が小さなモデル（隠れ次元128〜256）と合成の演繹課題に限られること、熟考が出力前の1つのベクトルに限られ系列全体には及ばないことを挙げている（§7.2）。解釈：提案法の最高精度は制約のない回転流より低く、安定性と引き換えに表現力の一部を手放している。", "fun": "AIに長く考えさせればもっと賢くなりそうなのに、実際には考えすぎると頭の中の状態が暴走して答えがでたらめになる。この論文は、考えの動きを「坂を転がって落ち着く動き」と「ぐるぐる回って探す動き」に分け、物理のエネルギーが減る仕組みで暴走を止めた。惑星の軌道計算で誤差がたまらないように工夫する数値計算の考え方を、AIの思考に持ち込んでいる。", "unverified": "表1・表2の全条件の数値と、30の不変量の検証（§6.4）の内容は確認していない。"}}, {"rank": 13, "theme": "包摂的コミュニティ・社会", "headline": "取り残された地域で幸福感と結束はどう違うか", "title": "Feeling Left Behind? Territorial Disadvantage, Well-Being and Cohesion across European Regions", "url": "https://arxiv.org/abs/2609.37866", "authors": "Stefano Maria Iacus ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr13", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、主観指標の説明、結果の冒頭、結論、補足S4（SNS指標の偏り）の節）を読んだ。係数表の個々の値は読んでいない", "preprint": true, "p1": "欧州28か国の約1,200のNUTS-3地域について、経済・人口・到達性などの客観的な「取り残され度」と、SNSの投稿から推定した幸福感・不調・社会的結束の10年分のパネルを突き合わせ、両者の地理が部分的にしか一致しないことを示した。", "p2": "「取り残された地域」は主に経済・人口・到達性の指標で特定されてきたが、住民の幸福感や信頼・帰属感と一致するとは限らない（§1）。主観面の研究は政治的な不満やポピュリズム支持に偏り、幸福感・一般的信頼・帰属感はあまり調べられていなかった。", "p3": "先行研究の3類型（経済衰退・脱工業化、人口減少・高齢化、孤立・貧困）をEU15から28か国の2013〜2023年のパネルに広げ、連続的な取り残されスコアを作る（§2.1、§2.4）。主観指標は、位置情報つきの投稿を微調整したLLMで分類した人間の繁栄の地理指数（HFGI）から、幸福・希望・帰属・信頼・不安・孤独など14次元を使う（§2.2）。国の間・国の中の地域の間・同じ地域の時間変化を分ける「within-between」モデルで推定する（§2.8）。", "p4": "推定標本は1,215地域・12,864地域年である（§3）。取り残されスコア全体（モデルA）と個々の客観指標（モデルB）について、各主観指標への効果を3つの比較の水準で標準偏差単位で示し、非線形性と地域ごとの効果の違いも調べる（§3.1〜§3.4）。", "p5": "物質的に同程度に不利な地域でも主観的な姿は大きく異なり、不利な地域の一部は幸福感や結束が比較的よかった（§4）。国の間では好ましく見える関連が国の中では弱まるか逆転し、個人の幸福感では国の違いを除くと取り残され度との関連が負になった。地域の中の時間変化では、高齢者の扶養比率の上昇がいくつかの指標の悪化と、貧困が心理的な苦痛と結びついた。中程度の不利が結束を強めるという非線形の関係の頑健な証拠はほとんどなかった（§4）。", "p6": "著者は、SNSの利用者は若く都市的で高学歴に偏り、指標は住民全体の態度ではなく観測された利用者の表出を測るものであること、地域の条件で投稿者の構成や表出の傾向が変わると見かけの変化が生じうることを認めている（補足S4、§4）。国ごとの制度・文化・言語の違いと表出の違いも分離できないとしている。", "fun": "「さびれた地域では住民が不幸」と思いがちだが、10年分・数十億件の位置情報つき投稿を調べると、似たような不利な地域でも、明るい地域とそうでない地域に分かれていた。しかも国どうしで比べるか、国の中で比べるかで関係の向きが変わる。平均の指標一つで地域を判断すると大事な違いを見落とすという、統計の見方の大切さが分かる研究だ。", "unverified": "表6以降の係数の具体値と、補足資料の指標の作り方の詳細は確認していない。"}}, {"rank": 14, "theme": "都市・インフラ政策", "headline": "道路単位の事故予測で再現できず単純な基準に負けた", "title": "Replication Failure and Trivial Baselines in Road-Level Crash Prediction", "url": "https://arxiv.org/abs/2609.35917", "authors": "Maurya Patel", "venue": "arXiv", "date": "2026-09-30", "id": "pr14", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データと手法、設計判断の追試、単純な基準との比較、独立ベンチマークでの追試、限界の節と表II〜IVの説明）を読んだ", "preprint": true, "p1": "道路区間ごとの交通事故予測でグラフニューラルネット（GNN）が示してきた改善を独立に作り直して検証し、設計判断の多くが別の地区で再現せず、過去の事故件数を長い期間で数えて並べるだけの基準に、GNNが勝てないことを示した。", "p2": "道路単位の事故予測にGNNが使われているが、報告された改善がどれだけ安定かはほとんど調べられていない（要旨）。比較に使われる「過去の平均」の基準は、短い期間（多くは1年）で計算されていた（§VI-A）。", "p3": "不確実性を考慮した先行モデルのデータ処理を公開データ（OS Open Roads、英国の事故統計STATS19の2021〜2024年）で作り直し、グラフ注意層とGRUを組み合わせたモデルで11の設計判断を評価する（§III）。評価は、1日ごとに予測リスク上位20%の区間にその日の事故が何割入るか（AccHR@20）を、期間を広げながら進める検証で6窓・5つの乱数種の平均として求める（§III-D、§III-E）。", "p4": "ロンドンの3つの区で、ある区で有意だった設計判断を別の区で再評価する（§V、表II）。さらに、パラメータのない「累積の過去事故件数で並べる」基準と、道路安全マニュアルの経験ベイズ推定と比べ、過去を振り返る期間を変えたときの基準の精度も測る（§VI）。米国デラウェア州のデータ（458,282件）でも同じ検討を繰り返す（§VI-B）。", "p5": "11の設計判断のうち再現したのは4つで、7つは再現せず、そのうち4つは符号が逆転した（要旨、表II）。先行モデルは区ごとの乱数種によるばらつきが最大35.7ポイントあった。過去約8年の事故件数で並べる基準は83.94%で、提案モデル（80.08%）や先行モデル（66.57%）を上回り、履歴の長さをそろえると提案モデルとの差は−0.90ポイント（p=0.61）で区別できなかった（表III）。同じ基準は振り返る期間だけで22.71%から83.94%まで変わった（図1）。", "p6": "著者は、比較が1都市3区・区ごとに6窓に限られること、同じ設定と乱数種でも窓の結果が変わる非決定性があり区ごとの値は桁数ほど精密でないこと、先行研究との事故の密度の違いが説明できていないこと、地図APIの不具合でデータの一部が欠けていた経緯を挙げている（§VIII）。", "fun": "事故が起きやすい道を当てる最新のAIより、「過去8年で事故が多かった道」を順に並べるだけのほうが当たった。これまでのAIが基準に勝っていたのは、基準に1年分しか過去を見せていなかったからだった。比べる相手をきちんと強くしないと進歩を見誤る、という科学の基本を思い出させてくれる。", "unverified": "表IIの各設計判断の効果の全数値と、デラウェアのデータでの閾値別の結果（表IV）は確認していない。"}}, {"rank": 15, "theme": "LLM熟議・ペルソナ", "headline": "上流の誤ったメッセージが正答を覆す", "title": "When Upstream Messages Override Correct Answers: A Controlled Study of Multi-Agent LLM Collaboration", "url": "https://arxiv.org/abs/2609.36855", "authors": "Yaxin Gong ほか", "venue": "arXiv", "date": "2026-09-30", "id": "pr15", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設計、結果3.1〜3.4・3.6、考察と結論の節と図2〜4の説明）を読んだ。付録は読んでいない", "preprint": true, "p1": "多エージェントLLMで上流のエージェントの誤った答えが届くと、下流のエージェントは自分の証拠で正しく答えられる問題でも、その誤答をそのまま写してしまう（答えの置き換え）ことを、統制実験で示した。", "p2": "下流に中間結果を渡すことは「上流が正しければ助かり、誤っていても下流が自分の証拠で直せる」と暗に仮定されている（§6）。これまでの研究は、通信の利益と誤ったメッセージの害を分けて測っていなかった（要旨）。", "p3": "上流が下書きを作り、下流が証拠（検索文書やデータベースのスキーマ）とともに受け取って最終回答する二段の受け渡しを取り出す（§2.1）。下流が独自の証拠を持つか、上流のメッセージを見るかの2×2の条件で正答率を比べ、メッセージの価値τ（見せた時の正答率−隠した時）を上流の正誤で分解する。さらに、メッセージの結論だけを反転させる操作で因果を確かめる（§3.4）。", "p4": "SQL生成（BIRD）、多段QA（HotpotQA、LBMusique、2WikiMultihopQA）、読解（DROP）の5課題、5つの受け手モデル（gpt-4o-mini、deepseek-v3.2など）で、温度0で実行する（§3.1）。受け手が単独で3回中2回以上正答する項目を「単独で解ける」とし、そこで正答が誤答に変わる割合を測る（§2.1）。", "p5": "上流が正しいとメッセージは助けになり、誤っていると害になる二分が25の組み合わせすべてで見られた（§3.2、図2b）。単独で解ける2,667項目のうち297項目（11.1%）で正答が覆され、最大の組み合わせでは32%だった（§3.3、図3a）。監査した82件のうち77件（94%）で、受け手の最終回答は上流の誤答と一致した。結論を反転させると、正しい結論を壊した場合は11の組み合わせすべてで正答率が下がり、誤った結論を直すと回復した（§3.4、図4）。証拠がある場合のメッセージの価値は平均で−0.6ポイントで、助けと害がほぼ打ち消し合っていた（§6）。", "p6": "著者は、実験が正解を含む理想的な証拠（正解段落、完全なスキーマ）を使っており検索が不完全な現場では頻度が変わりうること、答えが離散的に確かめられる課題に限られ、自由生成・反復討論・長い連鎖は未検証であることを挙げている（§6）。受け手が証拠を置き換えているのか、メッセージに過大な重みを置いているのかは区別できていない。", "fun": "自分で調べれば正しく答えられるのに、先輩から間違った答えを聞かされると、そのまま写してしまう――AIの受け渡しでもこれが起きた。しかも、正しい資料を手元に持ったまま間違いに乗り換えていた。「迷ったら人の意見を参考に」が、正しく答えられるときには逆効果になるという、人間の同調とよく似た話だ。", "unverified": "連鎖的思考の診断（§4）と付録の各表の数値は確認していない。"}}, {"rank": 16, "theme": "会計情報科学", "headline": "情報幾何でベイズ的に信用リスクを監視", "title": "An Information-Geometric Framework for Bayesian Credit Risk Monitoring", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.   stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
