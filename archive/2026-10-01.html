を使用", "preprint": true, "short": true, "p1": "企業が言語モデルの空間で事業の位置を選び直す競争を、能力の費用が異なる合理的な分け前のゲーム（ESCAPE）として定式化し、唯一の均衡を示した（抄録）。", "p3": "機会の変化による寄与と混雑による寄与を分ける厳密な再配分の制約を導いた（抄録）。", "p5": "競争は企業を必ずしも引き離さず、合理的な企業がより混んだ領域に入ることもある（抄録）。多数企業の基準経済では、戦略的な企業と独立な企業の反応の違いの90.5%を相対的な反応の成分が説明した。", "fun": "人気の分野に企業が集まると競争が激しくなるので、普通は散らばりそうだ。ところがこのモデルでは、賢い企業でもあえて混んだ場所に入ることがある。ライバルの存在が変えるのは「どこへ行くか」より「同じチャンスにどれだけ違う反応をするか」だという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 19, "field": "経済学", "headline": "エリートの再分配選好は大衆とどう違うか", "title": "Mind the Gap: Elite Preferences for Redistribution and How they Differ from the Mass Public", "url": "https://doi.org/10.31235/osf.io/yvwb8_v1", "authors": "Mogens K. Justesen ほか", "venue": "SocArXiv", "date": "2026-09-29", "why": "エリートの再分配への選好が一枚岩で大衆と大きく違うという前提を調査データで検証した。", "id": "pn19", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "デンマークの行政データと調査で、所得・資産の上位1%のエリートと一般市民の税と支出の選好を比べ、エリートが一枚岩ではないことを示した（抄録）。", "p3": "エリートを「財政上の支持層」と捉え、富の源泉によって国から受ける財政上の要求が違うため選好も分かれると理論化し、コンジョイント実験を含むデータで検証した（抄録）。", "p5": "エリートは経済的により保守的だが一様に再分配に反対ではなく、資産で豊かな層は所得で豊かな層ほど保守的でなく、税の政策でしばしば選好が異なった（抄録）。", "fun": "「お金持ちは皆、税金を嫌う」とは限らない。給料が高い人と、資産を多く持つ人では、どの税に反対するかが違っていた。上位1%の人々の本音を、これまでで最大の標本で調べた点が貴重だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 20, "field": "経済学", "headline": "零細企業への大口融資は消費者を豊かにするか", "title": "When Microenterprises Grow, Are Consumers Better Off? Evidence from Large Loans to Microenterprises in Chile", "url": "https://econpapers.repec.org/RePEc:nbr:nberwo:35729", "authors": "Dean Karlan ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "チリの零細企業への大口融資の効果を、借り手だけでなくその顧客の側から評価した。", "id": "pn20", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "チリのランダム化比較試験で、零細企業への大口融資が企業の利益だけでなく、その顧客の消費者余剰も大きく増やすことを示した（抄録）。", "p3": "融資を受けた企業の利益に加え、顧客への調査で消費者の利益を測り、同じ市場の125,000社超の非対象企業で顧客の奪い合いがあるかを調べた（抄録）。", "p5": "大口融資は企業の利益を月292ドル（13.4%）増やし、顧客の消費者余剰は月494ドル増えた（抄録）。他社からの顧客の奪い合いの証拠はほとんどなかった。", "fun": "小さなお店にお金を貸すと、お店がもうかるのは当然だが、実はお客さんの得のほうが大きかった。商品やサービスがよくなり、ライバル店から客を奪うだけではなかったからだ。貸し付けの効果を、借りた人の外側まで測った点が新しい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 21, "field": "経済学", "headline": "企業の倒産リスクによる信用摩擦のマクロ的影響", "title": "The Equilibrium Impact of Credit Frictions: Evidence from Default Risk Using Firm-Level Data", "url": "https://econpapers.repec.org/RePEc:cge:wacage:818", "authors": "Besley ほか", "venue": "RePEc NEP", "date": "2026-08-31", "why": "企業レベルの倒産リスクから生じる信用摩擦が集計的な経済に与える影響を異質企業のモデルで推定した。", "id": "pn21", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の倒産リスクから生じる信用摩擦が集計的な経済に与える影響を、異質な企業のミクロからマクロへのモデルと英国の行政データで推定した（抄録）。", "p3": "知覚された倒産リスクが信用摩擦の十分統計量になることを示し、英国の行政データ（2004〜2019年）をS&Pのリスク指標と結びつけて反実仮想を推定した（抄録）。", "p5": "摩擦を緩めると産出は25%、賃金は23%上がり、利益の大半は資本の蓄積によるものだった（抄録）。信用摩擦は金融危機前の水準より高いままだった。", "fun": "会社が「つぶれそう」と見られるだけで、お金を借りにくくなる。この摩擦がなくなれば、英国の生産は4分の1も増えうるという試算だ。借りにくさが国全体の豊かさをどれだけ抑えているかを、会社一つひとつのデータから積み上げている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 22, "field": "経済学", "headline": "資産価格の同時変動からマクロニュースを分類", "title": "Macro News in Market Moves: Classifying News through Asset Co-movements", "url": "https://econpapers.repec.org/RePEc:bca:bocsap:26-7", "authors": "Bruno Feunou ほか", "venue": "RePEc NEP", "date": "2026-08-31", "why": "株・債券などの同時の価格変化から、需要・生産性・インフレ・金融政策のニュースを分解する手法。", "id": "pn22", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "株・債券・インフレスワップの価格の同時の変化から、日々の資産価格の動きを総需要・生産性・インフレ・金融政策の4種類のマクロニュースに分解する方法（CLONE）を示した（抄録）。", "p3": "資産価格の同時の変動の符号の組み合わせでニュースを分類し、符号制約VARと比べて検証し、米国の主要な経済指標の発表に適用した（抄録）。", "p5": "2004〜2024年には総需要のニュースが日々の資産価格の変動を主に占め、2021年以降はインフレと金融政策のニュースの重要性が増した（抄録）。", "fun": "株が上がって債券の利回りも上がったら「景気が良いニュース」、株が下がって利回りが上がったら「金融引き締めのニュース」、というように値動きの組み合わせでニュースの種類を読み取る。市場が毎日何に反応しているかを見える化する道具だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 23, "field": "経済学", "headline": "社会不安は企業の信用アクセスを損なうか", "title": "Social Unrest and Firms’ Access to Credit", "url": "https://doi.org/10.2139/ssrn.7532237", "authors": "Mohamad Faour ほか", "venue": "SSRN", "date": "2026-09-29", "why": "社会不安が企業の借入れに与える影響を分析した。", "id": "pn23", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "多数の国の企業データで、社会不安（デモや暴動など）が企業の資金調達を難しくすることを示した（抄録）。", "p3": "国をまたぐ大規模な企業データで、社会不安への曝露と企業の資金調達の制約・融資の拒否の関係を調べた（抄録）。", "p5": "社会不安の水準が高い地域の企業は、より厳しい資金調達の制約を報告し、融資の拒否率も高く、供給側の経路で資金へのアクセスが損なわれていることと整合した（抄録）。", "fun": "街で抗議や暴動が続くと、お店や工場は銀行からお金を借りにくくなる。貸す側が慎重になるためだ。社会の混乱が、目に見える被害だけでなく、お金の流れを通じて経済を静かに弱らせることを示している。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 24, "field": "経営学", "headline": "経営者の責任と銀行の自発的撤退", "title": "Choosing To Fail: Managerial Liability, Risk Management and Voluntary Exits of Banks", "url": "https://econpapers.repec.org/RePEc:nbr:nberwo:35598", "authors": "Haelim Anderson ほか", "venue": "RePEc NEP", "date": "2026-08-31", "why": "1893年恐慌期の銀行について、株主の無限責任と二重責任の違いが自発的な撤退とリスク管理に与えた影響を比較した。", "id": "pn24", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "1893年恐慌の時期の銀行で、株主の責任の範囲（無限責任か二重責任か）が、経営者による自発的な撤退とリスク管理をどう形づくったかを比べた（抄録）。", "p3": "カリフォルニア州法銀行（無限責任）と国法銀行（二重責任）を比べ、州法銀行の頭取を国勢調査の記録に、国法銀行の株式保有を検査報告に結びつけて、経営者の個人的な責任の大きさを測った（抄録）。", "p5": "州法銀行では、従来の財務指標は強制的な清算を予測したが自発的な撤退は説明せず、自発的な撤退は経営者の責任の大きさ、地域の経済リスク、個人の資産で決まった（抄録）。", "fun": "銀行がつぶれたら経営者が自分の財産で弁償しなければならない時代、経営者は危なくなる前に自ら店じまいを選んでいた。責任の重さが、秩序ある撤退という行動を生んでいたことを、1893年恐慌のころの記録から掘り起こした研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 25, "field": "経営学", "headline": "中央銀行に非伝統的データとAIを組み込む", "title": "Integrating Non-traditional Data and AI into Central Banking: A Canadian Perspective", "url": "https://econpapers.repec.org/RePEc:bca:bocsap:26-17", "authors": "James Chapman ほか", "venue": "RePEc NEP", "date": "2026-08-31", "why": "カナダの中央銀行の視点から、テキストや画像などの非伝統的データとAIの活用を整理した。", "id": "pn25", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "カナダ銀行（中央銀行）で、テキスト・講演・画像・リアルタイムの取引などの非伝統的データとAIの活用が広がっている経験を記録し、責任ある導入の論点をまとめた（抄録）。", "p3": "機械学習、自然言語処理、生成AIによる政策分析と業務への活用事例を整理した（抄録）。", "p5": "働き方やキャリアの変化、革新の生態系、新たなリスクへの対応を含め、AIの戦略は革新と、信頼・透明性・安全・再現性・モデルの統治・データの所在・業務リスクの管理を両立させる必要があるとまとめた（抄録）。", "fun": "中央銀行は、景気の今を知るために、統計が出るのを待つだけでなく、ニュースの文章やカードの取引データなども使い始めている。お金の番人がAIとどう付き合うかの実例を記録している点が興味深い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 26, "field": "経営学", "headline": "分類体系の改訂が知識の検索をどう変えるか", "title": "Classification as Search Infrastructure: How Category Creation, Addition and Cleanup Shape Knowledge Retrieval", "url": "https://arxiv.org/abs/2609.37343", "authors": "Kerstin H\\\"otte ほか", "venue": "arXiv", "date": "2026-09-30", "why": "分類カテゴリの新設・追加・整理が、対象がどの経路で検索されるかをどう変えるかを理論化し検証した。", "id": "pn26", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "分類体系の改訂（新しい横断的な区分の創設、既存体系への追加、整理）が、特許の検索と引用のされ方をどう変えるかを理論化し検証した（抄録）。", "p3": "協同特許分類（CPC）のグリーン技術区分Y02/Y04の2013年の創設と2020年の改訂を利用し、影響を受けた特許を変更のないグリーン特許と照合して、審査官と出願人の最初の引用までの時間と引用数を推定した（抄録）。", "p5": "区分の創設は審査官の最初の引用のハザードが25%高いことと、成熟した体系への追加は13〜15%低いことと、整理は14%高いハザードと12%多い引用数と関連した（抄録）。", "fun": "図書館の棚の分類を変えると、本の見つかりやすさが変わる。特許の分類に「環境技術」の棚を新しく作ると、審査官がその特許を早く見つけて引用するようになった。分類が知識の流れ方そのものを形づくっているという視点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 27, "field": "経営学", "headline": "AIだけで書いた論文が学会に採択された経緯", "title": "AI and Scholarship in Financial Economics", "url": "https://doi.org/10.2139/ssrn.7538178", "authors": "Campbell R. Harvey", "venue": "SSRN", "date": "2026-09-29", "why": "人の関与なしにAIが審査する金融学会に、AIで45分で書いた論文を投稿し採択された過程を記録した。", "id": "pn27", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "人が審査に関わらないAIの金融学会に、AIを使って45分で書いた論文を投稿し、159本中4本の採択に選ばれた経験を記録し、学界への含意を論じた（抄録）。", "p3": "2026年4月のUCLAの「Human x AI Finance」会議への投稿の過程を詳述した（抄録）。", "p5": "学術誌が必要とする変化、博士課程の学生の評価、教員の昇進審査の新しい課題、研究公正の規則について提言した（抄録）。", "fun": "AIで45分で書いた論文が、AIだけが審査する学会で採択された。これは研究の世界に、誰が何を書いたのか、どう評価すべきかという大きな問いを突きつける。論文そのものが、AI時代の学問の実験記録になっている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 28, "field": "組織行動・心理的安全性", "headline": "生成AIを使う開発者の認知負荷を測る", "title": "Beyond Productivity: Measuring Developers' Cognitive Load During GenAI-Supported Software Development", "url": "https://arxiv.org/abs/2609.37645", "authors": "Charlotte Brandebusemeyer ほか", "venue": "arXiv", "date": "2026-09-30", "why": "生成AIを使うソフトウェア開発で、生産性だけでなく開発者の認知負荷を測る方法を検討した。", "id": "pn28", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AIを使うソフトウェア開発で、生産性だけでなく開発者が感じる認知負荷と、その日の作業文脈、ウェアラブルの生理指標の関係を産業現場で調べた（抄録）。", "p3": "SAPの2拠点での4日間の現場研究で、21人の開発者が課題・所要時間・生成AIの利用・主観的な認知負荷を記録し、手首型のセンサ（EmbracePlus）を着けた（抄録）。", "p5": "主観的な認知負荷は生成AIの利用と課題の文脈の両方と関連し、生理指標が加える情報は限られていた（抄録）。", "fun": "AIを使うと仕事が速くなるかはよく測られるが、使う人の頭が楽になっているのか、かえって疲れているのかはあまり測られていない。腕時計型の機器で体の反応まで記録して、開発者の「頭の疲れ」を確かめようとする点が新しい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 29, "field": "組織行動・心理的安全性", "headline": "人とAIの協働の逆説から型へ", "title": "Human-AI Collaboration: From Paradoxes to Patterns", "url": "https://arxiv.org/abs/2609.36481", "authors": "Michael Weiss", "venue": "arXiv", "date": "2026-09-30", "why": "人とAIの協働を自律性と主導性の二軸で整理し、協働の型を示した。", "id": "pn29", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "人とAIの協働を、自律性と主導性の2つの設計次元で整理し、そこから生じる協働の型を、逆説（パラドックス）の視点で文書化した（抄録）。", "p3": "根底の問題と解決策を特定し、問題に内在する緊張を浮かび上がらせて逆説として写像し、そこから型の記述を導く過程を示した（抄録）。", "p5": "人とAIの協働の型として、指示、委任、支援、共創の4つを文書化した（抄録）。", "fun": "AIに「全部任せる」のか「言われたことだけやらせる」のか、「AIから提案させる」のか。どれにも良い面と悪い面がある矛盾を正面から整理し、指示・委任・支援・共創という4つの型にまとめた。自分の仕事でAIをどう使うかを考える地図になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 30, "field": "統計学", "headline": "要因実験での効果修飾因子の偏り補正推論", "title": "Debiased and Simultaneous Inference for Heterogeneous Factorial Effect Modifiers via Residualized Walsh-Hadamard Scores", "url": "https://arxiv.org/abs/2609.37382", "authors": "Tomoshige Nakamura ほか", "venue": "arXiv", "date": "2026-09-30", "why": "複数の二値処置を組み合わせた要因実験で、主効果と交互作用を修飾する共変量を同時に推論する方法。", "id": "pn30", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "複数の二値の処置を組み合わせた要因実験で、どの共変量が各主効果と交互作用を修飾するかを、全セル同時に偏りなく推論する方法を示した（抄録）。", "p3": "条件付きのウォルシュ・アダマール対比を標準化した共変量に射影した係数で効果修飾のセルを定義し、基準に頑健な直接スコアで交差適合した推論を作った（抄録）。", "p5": "残差化の基準の推定量について決まった収束の速さを要求せず、分割ごとの重み付きL2一致性だけで偏りを補正した中心極限定理が成り立つことを示した（抄録）。", "fun": "薬Aと薬Bを組み合わせる実験で、「どんな人に、どの組み合わせが効くか」を全部同時に調べたいとき、調べる組み合わせが多いほど偶然の当たりが増える。この論文は、たくさんの組み合わせを一度に正しく検定するための数学的な保証を与えている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 31, "field": "統計学", "headline": "層別か併合か：常に有効な逐次推論の設計", "title": "Target-Aware Sequential Inference: Pooled versus Stratified Anytime-Valid Designs", "url": "https://arxiv.org/abs/2609.37873", "authors": "Subir Hait", "venue": "arXiv", "date": "2026-09-30", "why": "異質な層をもつ逐次研究で、配分と推論の設計の選択が目標母平均の推論に与える影響を比較した。", "id": "pn31", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "層ごとに異質な逐次研究で、データの配分と、目標の母平均を直接推論するか層ごとの信頼系列を集計するかの設計の選択を、常に有効な推論のもとで比べた（抄録）。", "p3": "単一の事前指定の目標には目標から直接抽出する併合の過程、層ごとの報告や事後の重み付けが必要な場合は層別の構成を検討し、局所の幅がnの−β乗で縮むときの幅を最小にする配分を導いた（抄録）。", "p5": "最適な配分の指数は1/(1+β)で、平方根nの分散適応境界では「2/3の規則」になった（抄録）。", "fun": "途中で何度結果を見ても間違いの確率を保てる「いつでも有効な」統計で、グループ別にデータを集めるとき、どのグループにどれだけ割り振るのが最も効率的かを求めた。きれいな「2/3の規則」が出てくるのが数学的に美しい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 32, "field": "統計学", "headline": "都市道路網の事故件数をスペクトル基底で推定", "title": "Bayesian Selection of Edge Spectral Modes for Crash Counts on Urban Road Networks with Applications in Barcelona and Bogot\\'a", "url": "https://arxiv.org/abs/2609.36268", "authors": "Danna L. Cruz-Reyes ほか", "venue": "arXiv", "date": "2026-09-30", "why": "道路のつながりに沿う空間依存を、辺のスペクトルモードを選ぶベイズ負の二項モデルで表した。", "id": "pn32", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "都市の道路網での事故件数を、道路区間の上で定義したスペクトル成分の少数の組合せで空間依存を表すベイズ負の二項モデルで推定した（抄録）。", "p3": "正規化したランダム辺近傍ガウス作用素と連続のスパイク・アンド・スラブ事前分布を組み合わせ、固有値に依存したスラブの分散でネットワークに沿う滑らかさを正則化し、区間長を曝露のオフセットにした（抄録）。", "p5": "1,200のデータセットで4,800回のベイズ推定を行った模擬で、提案モデルは疎な真の構造のもとで空間場の復元誤差が最小、予測密度が最大だった（抄録）。バルセロナとボゴタでは異なるスペクトルのパターンが得られた。", "fun": "交通事故は、近くの場所というより「道でつながった場所」で似た起こり方をする。道路網そのものの振動の型（スペクトル）を使って、事故の多い道の広がりを少ない部品で表す工夫が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 33, "field": "統計学", "headline": "ストレステストがリスクを見逃すとき", "title": "When Stress Tests Miss the Risk: Statistical Scenario Analysis for Financial Portfolios", "url": "https://arxiv.org/abs/2609.37273", "authors": "Zhongze Cai ほか", "venue": "arXiv", "date": "2026-09-30", "why": "ポートフォリオの感応度分析で、ストレスをかけない要因との依存を考慮した統計的シナリオ分析を提案した。", "id": "pn33", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "ポートフォリオのストレステストで、シナリオの利益を点推定で要約する従来法が見落とす不確実性を、オンラインで較正できる予測区間で定量化する機械学習の枠組みを示した（抄録）。", "p3": "シナリオごとの分位点の予測を較正する適応的なコンフォーマル法（ACSA）と、指定したストレスと現在の市場情報からシナリオ条件付きの分位点を直接推定するカーネル法（KSA）を組み合わせた（抄録）。", "p5": "現実の市場を模した実験で、従来のシナリオ分析は標準のストレステストで安全に見えるポートフォリオでもリスクを大きく過小評価しうることを示し、提案法は経験分位点の基準より良い較正と狭い区間を得た（抄録）。", "fun": "「株価が10%下がったら損失はいくら」というストレステストは、ほかの要因の動きを無視して一つの数字で答えがちだ。この方法は、答えに幅（予測区間）をつけ、その幅が実際に当たる割合を保証する。リスクを一つの数字で語る危うさを教えてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 34, "field": "統計学", "headline": "多峰の事後分布のためのMCMC収束グラフ", "title": "The MCMC convergence graph: a diagnostic for multimodal posteriors", "url": "https://arxiv.org/abs/2609.37352", "authors": "Cici Chen Gu ほか", "venue": "arXiv", "date": "2026-09-30", "why": "多峰性をもつ事後分布で、混合の悪さとモードごとの収束を区別する診断を提案した。", "id": "pn34", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "多峰の事後分布で、全体の混合の悪さと、別々のモードの中ではよく混ざったチェインの群を区別する、グラフに基づくMCMCの収束診断を提案した（抄録）。", "p3": "チェインの対ごとにR-hatを計算してグラフにまとめ、同じ事後のモードを探索しているチェインの集合を明らかにし、Stanに実装した（抄録）。", "p5": "データに内在する多峰性をもつ回帰モデルから、非識別性を反映した薬物動態モデルまでの例で使い方を示した（抄録）。", "fun": "山がいくつもある地形を何人かで探検すると、みんなが同じ山にいなくても、それぞれが自分の山をきちんと調べ終えていることがある。従来の診断はこれを「失敗」とみなしたが、この方法は「誰と誰が同じ山にいるか」を図にして見分ける。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 35, "field": "統計学", "headline": "高価な結果変数を適応的に標本抽出するRCT", "title": "Adaptive Sampling of Costly Outcomes in Randomized Clinical Trials", "url": "https://arxiv.org/abs/2609.36387", "authors": "Shuoyang Wang ほか", "venue": "arXiv", "date": "2026-09-30", "why": "主要評価項目の測定が高価な試験で、補助変数を使って測定対象を適応的に選ぶ設計を研究した。", "id": "pn35", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "主要評価項目の測定が高価な臨床試験で、全員に測れる補助変数を使って、誰の結果を測るかを割付を知らない統計家が適応的に選ぶ設計を研究した（抄録）。", "p3": "最初の無作為標本の結果で結果と残差分散のモデルを当てはめて残りの参加者の抽出確率を決め、盲検解除後に拡張逆確率重み付けで群の平均を推定する（抄録）。", "p5": "推定量は任意の作業モデルで完全データの処置差に不偏で、繰り返し更新してもマルチンゲールの中心極限定理でWald区間が得られることを示した（抄録）。", "fun": "検査が高価なとき、全員を測る代わりに「測る価値の高い人」を選んで測れば、少ない費用で同じ精度が得られる。選ぶ人がどちらの薬を飲んだかを知らないようにし、重み付けで偏りを直す仕組みが、公平さと効率を両立させている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 36, "field": "統計学", "headline": "スタイン法によるセミパラメトリックBvM定理", "title": "Semiparametric Bernstein-von Mises theorems from Stein's method", "url": "https://arxiv.org/abs/2609.37939", "authors": "Paul Rosa", "venue": "arXiv", "date": "2026-09-30", "why": "セミパラメトリックなベルンシュタイン＝フォン・ミーゼス定理の新しい証明法を、スタイン法と情報幾何で与えた。", "id": "pn36", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "セミパラメトリックなベルンシュタイン＝フォン・ミーゼス定理の新しい証明の方針を、スタイン法と情報幾何を組み合わせて示した（抄録）。", "p3": "事前分布の影響を、統計モデル上の適切なベクトル場の事前分布で重み付けた発散として特徴づけ、ラプラス変換の代わりにスタイン法を使う（抄録）。", "p5": "注目する関数の周辺事後分布と、効率性理論が予測するガウス極限との有界リプシッツ距離に、局所的なスカラーの微分量だけからなる明示的な非漸近の上界を与えた（抄録）。", "fun": "ベイズ推定の結果は、データが多ければ事前の思い込みによらず正規分布に近づく、という定理がある。この論文は、「どれくらい近いか」を具体的な式で上から押さえる新しい証明法を示した。理論の道具箱を増やす仕事だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 37, "field": "機械学習", "headline": "世界行動モデルは推論時に未来を生成すべきか", "title": "What Makes World Action Models Generalize? An Empirical Study of Test-Time Future Modeling", "url": "https://arxiv.org/abs/2609.34981", "authors": "Renping Zhou ほか", "venue": "arXiv", "date": "2026-09-30", "why": "世界行動モデルで、推論時に未来の映像を生成する必要があるかを実証的に調べた。", "id": "pn37", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "未来の映像を予測しながら行動を学ぶ世界行動モデルで、推論時に未来を生成しない潜在型は、学習した範囲では同等でも汎化の利点を失うことを示した（抄録）。", "p3": "同じ骨格・データ・予算で、明示的に未来の画像を生成するモデルと潜在型を、環境の摂動、データ効率、課題の汎化の3つの軸で比べた（抄録）。", "p5": "行動を出す部分が未来の表現に条件づけられなくなると、3つの軸すべてで一貫して性能が落ちた（抄録）。", "fun": "ロボットに「次に何が起きるか」を想像しながら動かせると、初めての状況にも強くなる。計算を減らすために想像の部分を省くと、慣れた作業では同じでも、少し違う状況で失敗しやすくなった。想像力が応用力を支えているという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 38, "field": "機械学習", "headline": "最先端エージェントは工学の実務をこなせるか", "title": "EngiWorld: What Can Frontier Agents Deliver in Professional Engineering Environments?", "url": "https://arxiv.org/abs/2609.37686", "authors": "Hongcheng Gao ほか", "venue": "arXiv", "date": "2026-09-30", "why": "幾何や物理の制約を伴う産業工学の作業環境で、最先端のエージェントの到達度を評価した。", "id": "pn38", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "CAD、CAE、CAM、BIM、EDA、3D可視化の6分野・26の専門ソフトにまたがる1,301の専門家作成の課題で、最先端のエージェントの工学実務の能力を測るベンチマーク（EngiWorld）を作った（抄録）。", "p3": "GUIとCLIの両方の操作と、ソフトの選択から自由課題までの6種類の課題を用意し、最終成果物の幾何の妥当性・物理的な実現性・規則の遵守をプログラムで確かめる評価法を作った（抄録）。", "p5": "7つの最先端モデルを評価し、最も強いモデルでもEngiScoreは44.3にとどまり、複数のソフトをまたぐ試みの成功は3.6%だった（抄録）。", "fun": "AIはパソコン操作が上手になってきたが、機械や建物の設計ソフトを使いこなすのは別物だ。形が正しいか、物理的に成り立つか、規則に合うかまで自動で確かめる試験を作った点が大事で、AIが設計者の相棒になれるかを測る物差しになる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 39, "field": "機械学習", "headline": "形式検証から学ぶ自然言語の論理推論", "title": "Learning to Prove, Not Just to Answer: Reinforcement Learning from Formal Verification for Natural-Language Logical Reasoning", "url": "https://arxiv.org/abs/2609.37203", "authors": "Qili Zhang ほか", "venue": "arXiv", "date": "2026-09-30", "why": "自然言語の論理推論で、答えだけでなく証明の正しさを形式検証の報酬で学ばせる手法。", "id": "pn39", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "自然言語の論理推論で、答えだけでなく証明の各段階を形式検証で確かめ、検証を通った結論だけを証明に加える強化学習の枠組み（Proof-R1）を提案した（抄録）。", "p3": "推論の行動が証明の義務を満たすことを、充足不能性（UNSAT）に基づく機械で確かめられる検査で確認したときだけ、生成した結論を検証済みの証明状態に加える（抄録）。", "p5": "3つの論理推論ベンチマークと4つの基盤モデルで答えの正確さを高め、推論過程の検証可能性で学習なしのエージェントや既存の学習法を上回った（抄録）。", "fun": "数学のテストで答えだけ合っていても、途中の式が間違っていたら満点はもらえない。AIの論理の問題でも同じで、途中の一歩一歩を機械でチェックし、正しい一歩だけを積み上げさせる。答え合わせより厳しい「途中式の採点」でAIを鍛える発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 40, "field": "機械学習", "headline": "言語モデルの誤りを疎な回路の修復で直す", "title": "RESCUE: Repairing Language Model Errors to Sparse Circuits via Reinforcement Learning", "url": "https://arxiv.org/abs/2609.36813", "authors": "Chuanpu Liu ほか", "venue": "arXiv", "date": "2026-09-30", "why": "機械論的解釈で特定した疎な回路を、強化学習で修復して誤りを直す方法。", "id": "pn40", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "言語モデルの誤りも内部の誤った計算回路から生じるという見方に立ち、誤りに関わる疎な回路を特定して外科的に修復する枠組み（RESCUE）を提案した（抄録）。", "p3": "誤りに関連する回路を局在化し、対応するパラメータだけを強化学習で調整して、他の能力をおおむね保ったまま誤りを直す（抄録）。", "p5": "数学の推論では密度1.40%の誤り回路を修復して修復用集合の正答率を6.0%から75.5%に、医療QAでは1.44%の回路で0%から81%に上げた（抄録）。", "fun": "AIが間違えるとき、頭の中の特定の「配線」がおかしくなっているのかもしれない。その配線だけを見つけて直せば、他の能力を壊さずに間違いを減らせる。全身麻酔の大手術ではなく、ピンポイントの治療のような発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 41, "field": "機械学習", "headline": "専門化した言語モデルは対応する脳領域とよく揃う", "title": "Cognitive Expert Language Models Better Align with the Corresponding Brain Systems", "url": "https://arxiv.org/abs/2609.36239", "authors": "Zhivar Sourati ほか", "venue": "arXiv", "date": "2026-09-30", "why": "認知機能ごとに専門化した言語モデルが、対応する脳の系の活動をよりよく予測することを示した。", "id": "pn41", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "感覚・空間・数・推論・社会・抽象の6つの認知領域に特化させた言語モデルが、それぞれ対応する脳の系の活動をよりよく予測することを示した（抄録）。", "p3": "プロンプトと微調整で6領域の専門家モデルを作り、自然な言語理解中の脳活動を、各専門家がどの脳領域で最もよく予測するかを調べた（抄録）。", "p5": "仮説どおり、専門家モデルは対応する認知領域の脳の系とよりよく一致した（抄録）。", "fun": "脳は場所ごとに得意分野が分かれている。AIも「数が得意」「人の気持ちが得意」などに育てると、それぞれ脳の対応する場所の働きをよく予測した。AIの専門化と脳の分業が響き合っているという結果は、脳とAIの両方を理解する手がかりになる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 42, "field": "機械学習", "headline": "採点の前に考える視覚生成の報酬モデル", "title": "Think Before You Score: Thinking Reward Model for Visual Generation", "url": "https://arxiv.org/abs/2609.37372", "authors": "Xuehai Bai ほか", "venue": "arXiv", "date": "2026-09-30", "why": "視覚生成の評価で、何を評価すべきかを先に推論してから採点する報酬モデル。", "id": "pn42", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "画像生成を評価する報酬モデルで、先に「この場合に何が大事か」を考えて評価基準を作ってから採点する考え方（Thinking Reward Model）を提案した（抄録）。", "p3": "事例ごとの評価基準を立て、基準に沿って評価し、細かな点ごとの報酬を出し、対の比較の学習で点数が両極端に偏る問題を抑える学習法（PD-GRPO）を加えた（抄録）。", "p5": "画像の生成と編集の報酬モデルのベンチマークで、公開の報酬モデルの中で最高の性能を示し、非公開のモデルとも競合した（抄録）。強化学習の報酬に使うと多様な画像生成モデルが一貫して改善した。", "fun": "絵の審査員が、いきなり点数をつけるのではなく、「この課題では色使いと構図が大事」と先に決めてから採点する。AIの審査員にもこの手順を踏ませると、なぜその点数なのかが分かりやすくなる。人の審査のやり方をAIに取り入れた例だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 43, "field": "機械学習", "headline": "1つのTransformerブロックを繰り返して表形式を解く", "title": "LoopICL: Looping a single transformer block to solve tabular tasks", "url": "https://arxiv.org/abs/2609.36108", "authors": "Amir Rezaei Balef ほか", "venue": "arXiv", "date": "2026-09-30", "why": "表形式の基盤モデルのパラメータの冗長性に着目し、1ブロックの反復で同等の性能を狙う。", "id": "pn43", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式データの文脈内学習で、1つのTransformerブロックを繰り返し使うことで、パラメータ数と計算の深さを切り離したモデル（LoopICL）を提案した（抄録）。", "p3": "セルごとの特徴と例ごとの表現の2つの流れを列内・列間の注意で精緻化し、事前学習でループ回数を変え、学習した出口ゲートで推論時に自動で止める（抄録）。", "p5": "標準の設定で既存の表形式モデルTabICLと競合する性能だった（抄録）。", "fun": "表のデータを予測するAIの中身は、実はかなり無駄が多いらしい。そこで一つの部品を何度も繰り返し使い、難しい問題ほど多く回す。本を何度も読み返して理解を深めるように、同じ頭を繰り返し使う設計が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 44, "field": "因果推論", "headline": "生存者主層の因果効果を時間を追って特徴づける", "title": "Characterizing Survivor Principal Strata Over Time: Identification, Efficient Estimation, and Sensitivity Analysis", "url": "https://arxiv.org/abs/2609.37821", "authors": "Keith Barnatchez ほか", "venue": "arXiv", "date": "2026-09-30", "why": "死亡で結果が切断される縦断研究で、生存者平均因果効果の識別・効率的推定・感度分析を示した。", "id": "pn44", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "死亡で結果が切断される縦断研究で、時点ごとの生存者平均因果効果に、生存者の集団がもとの集団からどれだけずれたかの指標を添えることを提案した（抄録）。", "p3": "標準化平均差とKLダイバージェンスを、主層別の標準的な仮定の一部のもとで識別し、既存の推定で使う局外関数を再利用して効率的に推定する（抄録）。", "p5": "時点とともに生存者の層が変わり、効果の推定が異なる特徴の集団に関するものになりうることを明示できるとしている（抄録）。", "fun": "病気の治療の効果を時間を追って調べると、亡くなった人は後の測定から抜けていく。すると「生き残った人」の顔ぶれが変わり、比べている相手が途中で入れ替わってしまう。その入れ替わりの大きさを数値で添えるという、正直な報告の仕方の提案だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 45, "field": "因果推論", "headline": "空間の異質な処置効果をグラフ分割のベイズ因果森で", "title": "Graph-Split Bayesian Causal Forest for Spatial Heterogeneous Treatment Effect Estimation", "url": "https://arxiv.org/abs/2609.36046", "authors": "Shuren He ほか", "venue": "arXiv", "date": "2026-09-30", "why": "空間依存と空間的な未測定交絡のもとで、異質な処置効果を推定するベイズ因果フォレストの拡張。", "id": "pn45", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "空間的な観察研究で、空間的な依存と未測定の交絡のもとで異質な処置効果を推定する、グラフ分割のベイズ因果フォレスト（GSBCF）を提案した（抄録）。", "p3": "座標軸に沿った分割が空間構造に合わないという因果BART法の問題に対し、グラフに沿って分割するBARTを因果フォレストに組み込んだ（抄録）。", "p5": "シミュレーションと実データで、既存の因果BART法より推定の正確さと不確実性の定量化が大きく改善した（抄録）。", "fun": "地域ごとに政策の効き目が違うとき、隣り合う地域は似ているという性質をうまく使いたい。決定木で地図を縦横の線で区切る代わりに、地域のつながりの図に沿って区切ることで、空間の形に合った推定ができるという工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 46, "field": "因果推論", "headline": "順序を無作為化したローゼンブラット検定", "title": "Calibrated Order-Randomized Rosenblatt Tests", "url": "https://arxiv.org/abs/2609.37477", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "2026-09-30", "why": "多変量の分布適合の検定で、座標の順序への依存を無作為化と較正で除いた。", "id": "pn46", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "多変量の分布の適合度検定で、ローゼンブラット変換の座標の順序への依存を、多くの無作為な順序を使って証拠を統合することで取り除く方法を示した（抄録）。", "p3": "順序を並べ替えてもマハラノビスの信号エネルギーの総量は保存され再配分されるだけだと示し、両側の基本統計量と、再推定するパラメトリック・ブートストラップを組み合わせた（抄録）。", "p5": "シミュレーションで、単一の無作為な順序や順序に依存しない参照より、較正した検出力が有意に高かった（抄録）。", "fun": "多くの変数が本当に仮定した分布に従っているかを確かめるとき、変数をどの順番で調べるかで結果が変わってしまう。そこで順番をたくさん入れ替えて結果をまとめる。くじ運に左右されないよう、何度もくじを引くという発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 47, "field": "公衆衛生・疫学", "headline": "中等症・重症頭部外傷のCT所見と死亡・1年後の転帰", "title": "Acute CT Findings And Their Relation To In-Hospital Mortality And 12-Month Outcome In A Large Prospective Norwegian Cohort Of Patients With Moderate And Severe Traumatic Brain Injury", "url": "https://doi.org/10.2139/ssrn.7536102", "authors": "Halvor  Rennehvammen Solheim ほか", "venue": "SSRN", "date": "2026-09-29", "why": "ノルウェーの前向きコホートで、急性期CT所見と院内死亡・12か月後の転帰の関係を調べた。", "id": "pn47", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ノルウェーの中等症・重症の頭部外傷患者の前向きコホートで、急性期のCT所見のパターンと、院内死亡・12か月後の転帰の予測因子を調べた（抄録）。", "p3": "2004〜2023年に入院した868人のCTを評価し、所見のパターンをファイ係数と階層クラスタリングで、予測因子を年齢・GCS・瞳孔反応を必須にしたelastic netで選び、ロジスティック回帰と順序回帰で解析した（抄録）。", "p5": "最も多い所見は外傷性くも膜下出血（71%）と硬膜下血腫（63%）で、脳底槽の消失と全般的な浮腫が院内死亡の最も強い予測因子だった（抄録）。2〜4つの所見で作った「トロンハイムCTスコア」は、死亡でAUC 0.938、転帰でc指数0.771だった。", "fun": "頭を強く打った患者のCT画像には、いくつもの種類の出血が組み合わさって写る。どの組み合わせが命や1年後の生活に関わるかを、868人の記録で調べた。救急の場で治療の見通しを立てる手がかりになる研究だ。", "unverified": "外部検証がまだ行われていない点は著者も認めている（抄録）。本文は未確認。"}}, {"rank": 48, "field": "公衆衛生・疫学", "headline": "災害後の破滅的医療支出を機械学習で推定", "title": "Machine Learning for Estimating Catastrophic Health Spending in Disaster-Affected, Data-Scarce Settings", "url": "https://econpapers.repec.org/RePEc:eoe:escoed:escoe-dp-2026-05", "authors": "Himaz ほか", "venue": "RePEc NEP", "date": "2026-08-31", "why": "データの乏しい被災地域で、災害前後の破滅的な医療支出を機械学習で推定した。", "id": "pn48", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "災害後の家計の医療支出を、データの乏しい被災地でも推定できる機械学習を作り、津波後に破滅的な医療支出がどれだけ増えうるかを推計した（抄録）。", "p3": "2006年のジョグジャカルタ地震前後のインドネシアの縦断調査で、所得・揺れの強さなどから医療支出のパターンを学ぶ混成の機械学習を作り、2004年のインド洋津波後の調査に適用した（抄録）。", "p5": "雑音の多い領域で70%を超える精度を得て、的を絞った援助がなければ破滅的な医療支出の発生率は4.5%から29.4%に増えたと推計した（抄録）。", "fun": "災害のあと、けがや病気の治療費で家計が破綻する家庭が出る。その実態は調査がないと分からないが、別の災害のデータで学んだAIで推定すると、支援がなければ約3割の家庭が深刻な出費に苦しむ計算になった。支援の必要性を数字で示す試みだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 49, "field": "公衆衛生・疫学", "headline": "ホスピスの質と家族介護者の経験の地域格差", "title": "Geographic Disparities in Hospice Quality and Family Caregiver Experience: The Roles of Ownership, Social Vulnerability, and Workforce Capacity", "url": "https://arxiv.org/abs/2609.36507", "authors": "Jinho Cha ほか", "venue": "arXiv", "date": "2026-09-30", "why": "ホスピスの質を運営主体・社会的脆弱性・人員と結びつけ、地域格差を評価する枠組みを示した。", "id": "pn49", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": true, "short": true, "p1": "ホスピスの質を、運営主体と地域の条件（農村性、社会的脆弱性、健康負担、人員）と結びつけて評価する枠組みを作り、家族介護者の評価の地域格差を調べた（抄録）。", "p3": "全国のCMSのホスピスデータと家族介護者調査（CAHPS Hospice）を郡の指標と結びつけ、1,078郡の2,928事業者で、地図化、ブロックごとの回帰、6つの副次的な評価、8つの感度分析を行った（抄録）。", "p5": "郡の文脈を加えると調整済み決定係数は0.077から0.202に上がり、完全に調整した後も営利のホスピスは総合的な介護者の評価が3.832ポイント低かった（抄録）。", "fun": "人生の最期を過ごすホスピスの質は、施設だけでなく、その地域の人手や医療資源にも左右される。地域の条件を考えに入れても、営利企業のホスピスは家族からの評価が低かった。場所と運営のしかたの両方からケアの質を見る大切さを示している。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"rank": 50, "field": "生命科学・医学", "headline": "うつ病の状態・素因・回復と強化学習の違い", "title": "State-, Trait- and Recovery-Related Differences in Reinforcement Learning and Value-Based Decision Making in Major Depressive Disorder", "url": "https://doi.org/10.7554/eLife.112619.1", "authors": "Madeleine Moses-Payne ほか", "venue": "eLife Reviewed Preprint", "date": "2026-09-30", "why": "現在うつ病の人・寛解者・家族歴のある人・健常者で、強化学習と価値に基づく意思決定の計算指標を比べた（eLifeの評価はvaluable）。", "id": "pn50", "explain": {"basis": "抄録", "basis_note": "eLifeの査読つきプレプリント（eLife Reviewed Preprint、公開査読あり）。Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "未服薬の成人195人で、現在のうつ病、寛解者、家族歴のある人、健常者の強化学習と価値に基づく意思決定を計算モデルで比べた（抄録）。", "p3": "不安定な確率の4本腕バンディット課題とリスク下のギャンブル課題を行い、学習率・結果への感受性・決定の雑音・リスク選好の計算パラメータを階層ベイズで推定した（抄録）。", "p5": "罰からの学習率は群間で異なり（F(3,191)=5.43、p=.001）、寛解者で他の群より低かった（抄録）。ギャンブル課題では、うつ病群と高リスク群が対照群より一貫して価値に沿った選択をしていた。", "fun": "うつ病の人は、良いことや悪いことからの学び方が違うと言われる。それが病気の「状態」なのか、なりやすさという「素質」なのかを、今うつの人、治った人、家族にうつの人がいる人、健康な人を比べて見分けようとしている。回復を支える行動の手がかりを探す研究だ。", "unverified": "本文とeLifeの評価文の詳細は未確認。"}}], "jnl_related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "UAV画像で多種の橋の損傷を同時に判定", "title": "A Dual Task Learning Framework for Multitype Bridge Condition Assessment Using UAV Imagery", "url": "https://doi.org/10.1061/jsendh.steng-15474", "authors": "Tao Xu ほか", "venue": "Journal of Structural Engineering", "date": "2026-09-29", "id": "jr01", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "UAV（ドローン）で撮った画像から、橋の種類を問わず複数種類の表面損傷を「検出」と「領域分割」の二つの課題として同時に行う深層学習の枠組み（BDDNet）を提案した（抄録）。", "p2": "UAV画像とAIによる橋梁点検は、人手の危険な点検を減らせるが、既存のCNNは単一の損傷や特定の橋の形式に絞ったものが多く、多様な橋と損傷への汎化が難しかった（抄録）。", "p3": "骨格ネットワークに大域的な注意機構（GAM）を組み込み、遠く離れた画素の関係と多様な大きさの特徴を捉える（抄録）。検出の枝には、風車状の畳み込みに基づく新しいモジュール（APC2f）を加え、受容野を広げて小さく複雑な損傷の特徴を学ぶ。一つの画像から、損傷の位置を囲む検出と、損傷の形をなぞる分割を同時に出力する。", "p4": "複数形式の橋の画像データで評価し、検出は平均適合率（mAP）、分割は平均IoU（mIoU）で測る（抄録）。比較対象とした既存手法の詳細は未確認（本文を入手できず）。", "p5": "検出で約85%のmAP、分割で82%のmIoUを達成した（抄録）。錆、ボルトの欠落、ひび割れ、剥離などの多様な損傷を、学習データが限られる複雑な環境でも識別・輪郭抽出できたと視覚的な結果で示している。", "p6": "未確認（本文を入手できず）。解釈：抄録は損傷の有無と範囲の検出までで、損傷の程度の定量評価は今後の基礎とされており、点検の判定基準との対応は別に検証が要る。", "fun": "橋の点検は、高い所や狭い所に人が行くので危険で手間がかかる。ドローンで撮った写真から、錆やボルトの抜け、ひび割れを「どこにあるか」と「どんな形か」を一度に見つけるAIを作った。橋の種類が違っても使える点が工夫で、点検の自動化に一歩近づく研究だ。", "unverified": "データセットの規模、比較手法とその数値、学習データの量は本文を入手できず確認できなかった。"}, "citescore": 7.5, "citescore_year": "2025"}, {"rank": 2, "theme": "VBI・橋梁SHM", "headline": "固有値感度と機械学習で免震橋のモデルを更新", "title": "Hybrid Eigensensitivity‐Machine Learning Framework for Model Updating of a Generally Damped Base‐Isolated Bridge", "url": "https://doi.org/10.1155/stc/1738114", "authors": "Muhammad Tariq Chaudhary", "venue": "Structural Control and Health Monitoring", "date": "2026-09-30", "id": "jr02", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "一般減衰をもつ免震橋のモデル更新で、物理に基づく固有値感度解析で学習データを作り、機械学習で観測されたモード特性に対応する構造パラメータを推定する混合の枠組みを示し、実橋の地震観測記録で検証した（抄録）。", "p2": "一般減衰系のモデル更新を古典的な固有値感度（ES）法で行うには、解の範囲を絞るために構造パラメータに事前の仮定を置く必要があった（抄録）。既知のパラメータのばらつきも考えながら、物理的に妥当なパラメータを推定する方法が求められていた。", "p3": "反復的なES解析で構造パラメータとモード特性の関係を定量化し、既知パラメータのばらつきを統制して物理に基づく学習データを作る（抄録）。このデータで機械学習モデルを学習し、実験的に同定したモード特性から構造パラメータを推定する。", "p4": "多径間の免震橋で記録された地震観測データに適用し、ガウス過程回帰（GPR）、サポートベクターマシン（SVM）、バギング木（BTE）、多変量線形回帰（MVLR）の4モデルを比べる（抄録）。評価は、モード残差δz、加速度応答の当てはまりE、モード保証基準（MAC）で行う。", "p5": "GPR、SVM、BTEはMVLRよりモード特性と構造パラメータの非線形な関係をよく捉えた（抄録）。基準のES法とGPR・SVMのモード残差は許容範囲内で、MACは0.97を超え、Eは0.164〜0.301だった。最良のGPRは、δzとEの平均で基準のES法より29.1%と58.1%良かった。", "p6": "未確認（本文を入手できず）。解釈：1つの橋の地震記録での検証であり、他の橋や損傷した状態への適用性は別に確かめる必要がある。", "fun": "揺れの記録から橋の「中身」（ばねの硬さや減衰）を逆算するのは、答えが一つに決まりにくい難しい問題だ。この研究は、物理の計算で「パラメータを変えると揺れ方がこう変わる」という例をたくさん作ってAIに覚えさせ、実際の地震の揺れから中身を推定した。物理とAIの役割分担がうまくいった例だ。", "unverified": "推定した具体的なパラメータ値、学習データの作り方の詳細、観測した地震の数は確認できなかった。"}, "citescore": 10.3, "citescore_year": "2025"}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "重量物輸送の車両と斜張橋の連成応答", "title": "Vehicle-bridge coupled dynamic response of cable-stayed bridges under heavy-cargo transportation loads", "url": "https://doi.org/10.24425/ace.2026.1415", "authors": "Zhigao Long ほか", "venue": "Archives of Civil Engineering", "date": "2026-09-30", "id": "jr03", "explain": {"basis": "本文", "basis_note": "出版社（Archives of Civil Engineering）のPDF本文（モデル化、荷重と速度の影響の結果、結論の節と図・表1）を読んだ", "preprint": false, "p1": "重量物を運ぶ14軸の油圧式平台トレーラと、支間670mの2塔3径間斜張橋の連成振動を有限要素法で解析し、車両の総重量と速度が斜張ケーブルの応力・塔の変位・中央径間のたわみに与える影響を整理した。", "p2": "分解できない大型の貨物を運ぶ重量物輸送が増え、道路橋の通常の使用に負担をかけている（§1）。長大橋では静的荷重と車両荷重で部材の応答が大きく異なるが、重量物輸送という特殊な荷重での斜張橋の動的応答は十分に調べられていなかった。", "p3": "重慶市の甘溪溝橋（155+360+155m、完全浮動の自定式コンクリート斜張橋）をABAQUSでモデル化し（塔は梁要素、ケーブルはトラス要素、主桁はソリッド要素）、1次の固有振動数は0.285Hzである（§2.1、図3）。車両は14軸の油圧式平台トレーラをソリッド要素とばね・ダンパでモデル化し（表1）、中国の規格に基づくC級の路面凹凸を与える（§2.2）。車両と橋の連成方程式を一体で組み立て、直接積分で解く。", "p4": "車両が中央を一方向に走る条件で、①速度5m/sのもとで総重量を200・300・400・500tと変え、②総重量400tのもとで速度を2.5〜10m/sと変える（§3.1、§3.2）。評価は、複数の斜張ケーブルの応力の極値と振動の振幅、2つの塔の橋軸方向の変位、中央径間の鉛直変位である。", "p5": "ケーブルの応力の極値は荷重とともにほぼ線形に増え、ケーブルT22では100tごとに約6.5MPa増えた（§3.1.1）。ケーブルの振動の振幅は荷重とともに非線形に、増え方を速めながら増えた（図7b）。中央径間のたわみは100tごとに約26.8mm増えた（§3.1.3）。速度はケーブルの応力の極値にはあまり影響しないが振動の振幅を大きく増やし、ケーブルT0の応力の極値は速度の係数1で661.3MPa、4で673.8MPaだった（§3.2.1）。塔の変位は速度とともに増え、5m/sを超えると急に大きくなった（§4）。", "p6": "著者は独立した限界の節を設けていない。解釈：1つの橋と1種類の車両、C級の路面の1つの凹凸の標本に基づく数値解析で、実測との比較による検証は示されておらず、ケーブルの疲労など安全性の評価は今後の課題とされている（§1）。", "fun": "500トンもの荷物を積んだ巨大なトレーラーが斜張橋を渡ると、橋はどう揺れるのか。コンピュータの中で車と橋を一緒に揺らして調べると、荷物が重いほど橋のたわみは素直に増える一方、ケーブルの揺れ幅は重さや速さとともに加速度的に大きくなった。ゆっくり走るよう速度を制限する理由が、数字で見えてくる研究だ。", "unverified": "図中の各ケーブルの応力の全数値と、塔の変位の具体的な値は本文の図から読み取れず確認していない。"}, "citescore": 1.8, "citescore_year": "2025"}, {"rank": 4, "theme": "VBI・橋梁SHM", "headline": "損傷・環境・センサ故障を区別する教師なし異常検知", "title": "Unsupervised Multistate Anomaly Detection for Structural Health Monitoring Using Spatiotemporal Clustering", "url": "https://doi.org/10.1155/stc/7924571", "authors": "Si-Yuan Sun ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-09-30", "id": "jr04", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "構造ヘルスモニタリング（SHM）のデータから、損傷・環境の影響・センサ故障などの複数の状態を、ラベルなしの時空間クラスタリングで見分け、各状態の意味を物理的に解釈できる手がかりも出す異常検知の方法を示した（抄録）。", "p2": "SHMのデータには損傷、厳しい環境の影響、センサ故障などさまざまな異常が混じるが、既存手法は単一の異常を対象にし、事前にラベルをつけた学習データか、検出した異常を解釈する専門家の知識を必要とした（抄録）。", "p3": "利用者がクラスタ数kを指定すると、ラベルや事前に定めた異常指標なしに複数の構造状態を識別する（抄録）。EM法に似た手順でガウス分布の逆共分散行列（精度行列）を求め、複数種類の計測量の時空間的な関係を捉えることで、各状態を技術者が初期判断するための物理的に解釈できる情報を与える。", "p4": "数値例で有効性を確かめたうえで、上海タワーの計測に適用している（抄録）。比較対象と評価指標の詳細は未確認（本文を入手できず）。", "p5": "異常を効果的に検出するだけでなく、異なる構造状態を自動で判別でき、推論時間は1秒未満でほぼ実時間の異常検知が可能だった（抄録）。", "p6": "未確認（本文を入手できず）。解釈：クラスタ数kを利用者が指定する必要があり、未知の状態がいくつあるかを事前に決めにくい現場では、その選び方が結果を左右しうる。", "fun": "建物のセンサの値がいつもと違うとき、それは建物の損傷か、台風のせいか、センサの故障かを見分けたい。この方法は答えを教えなくても、センサ同士の「一緒に動く関係」の違いでデータを自動的にグループ分けする。関係の形が物理的に読めるので、技術者が「このグループは故障らしい」と判断しやすくなる点が面白い。", "unverified": "検出精度の具体的な数値、比較手法、上海タワーで識別された状態の中身は確認できなかった。"}, "citescore": 10.3, "citescore_year": "2025"}, {"rank": 5, "theme": "LLM熟議・ペルソナ", "headline": "LLMの助言は同調・主張・妥協のどれを選ぶか", "title": "Conformity, Assertion, or Compromise? A Scenario-Based Framework for Evaluating Autonomy-Relevant Response Patterns in LLM Advice", "url": "https://doi.org/10.1145/3838184", "authors": "Saba Ghanbari Haez ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-09-30", "sjr": 2.065, "id": "jr05", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "人の自律に関わるジレンマでLLMが助言するとき、相手に従う（同調）、自分で決める（主張）、折り合う（妥協）のどの型を選ぶかを、哲学の自律の議論に基づくシナリオで評価する枠組みを作り、12のLLMで調べた（抄録）。", "p2": "LLMは助言や意思決定支援に使われつつあり、その推奨がどんな応答の型をとるかを理解する必要がある（抄録）。利用者の自律が大切な場面での助言の傾向を系統的に測る枠組みはなかった。", "p3": "知識の対立、人間関係のジレンマ、規範的な自己統治の3種類のジレンマについて、20領域・120の構造化シナリオを用意する（抄録）。各シナリオで同調・主張・妥協に対応する選択肢を示してLLMに選ばせ、あわせて1行の理由づけのぼかし表現、確信、道徳的・関係的・認識的な言葉づかいを分析する。", "p4": "12のLLMについて、3つの型の選択の分布と理由づけの特徴を比べ、シナリオを立場の強い役割から語る場合と弱い役割から語る場合も比べる（抄録）。", "p5": "全モデルで妥協の選択が最も多く、主張がそれに次ぎ、同調が最も少なかった（抄録）。立場の強い役割から語ったシナリオでは、弱い役割の場合より主張が増え同調が減った。どちらの役割でも妥協が最多だったが、その頻度はジレンマの種類で変わった。", "p6": "著者は、統制したプロンプトのもとでのモデルの出力の傾向を示したもので、利用者への影響は測っていないとしている（抄録）。そのほかの限界は未確認（本文を入手できず）。", "fun": "AIに人生相談をすると、「相手に合わせなさい」「自分で決めなさい」「間を取りなさい」のどれを勧めがちなのか。12のAIを120の場面で試すと、どれも「間を取る」助言が一番多かった。しかも、相談者が上司の立場だと「自分で決めなさい」が増える。AIの助言にも、立場で変わる癖があるのが面白い。", "unverified": "モデルごとの選択の割合と、理由づけの言葉づかいの分析結果の数値は確認できなかった。"}, "citescore": 17.6, "citescore_year": "2025"}, {"rank": 6, "theme": "会計情報科学", "headline": "作られなかった会計基準：排出権会計と正統性", "title": "The Nonproduction of an Accounting Standard: Climate Change, Emissions Trading, and Legitimacy Shielding", "url": "https://doi.org/10.2308/tar-2025-0166", "authors": "Jonathan Tweedie ほか", "venue": "Accounting Review", "date": "2026-09-30", "sjr": 4.403, "id": "jr06", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "国際会計基準審議会（IASB）が2002年から排出権の会計を検討しながら基準も指針も作っていない経緯を20年分の資料で分析し、「基準を作らないこと」自体が、論争を避けて正統性を守る手段として働いてきたことを示した（抄録）。", "p2": "排出権（炭素の排出枠）の会計は重要な財務報告の問題だが、20年以上決着していない（抄録）。基準設定主体が重要な問題を決着させないまま、どうやって自らの正統性を保っているのかは理解されていなかった。", "p3": "20年以上にわたる公文書などの資料を対象とする質的な事例研究である（抄録）。制度論におけるコミュニケーションの研究に基づき、基準の不作成がどのような伝え方を通じて進んだかを読み解く。", "p4": "IASBの審議の記録を中心とする資料の解釈的な分析であり、統計的な検証ではない（抄録）。資料の範囲と分析手順の詳細は未確認（本文を入手できず）。", "p5": "基準の不作成は、取り組む意思を示す「コミットメントの表明」、どちらとも取れる「曖昧なメッセージ」、「複雑さの強調」、「緊急性の軽視」という4つの伝え方で進んだ（抄録）。こうした伝え方は、利害関係者との関与を長引かせ、論争的な問題の決着を先送りすることで、基準設定主体の正統性を守る盾になっていた。", "p6": "未確認（本文を入手できず）。解釈：1つの基準設定主体・1つの論点の事例研究であり、他の論点や他の基準設定主体への一般化には追加の比較が要る。", "fun": "会計のルールを決める国際機関が、排出権の会計ルールを20年以上作らずにいる。この研究は、それが単なる怠慢ではなく、「やる気はある」「複雑だ」「急ぐ必要はない」と言い続けることで、批判を避けながら信頼を保つ方法になっていたと読み解いた。何かを「決めない」ことにも戦略がある、という見方が面白い。", "unverified": "分析した資料の種類と件数、4つの伝え方の具体例は確認できなかった。"}, "citescore": 7.5, "citescore_year": "2025"}, {"rank": 7, "theme": "会計情報科学", "headline": "会計職に就く前に職業的懐疑心を育てる", "title": "Opportunities for Enhancing Professional Skepticism Prior to Entering the Accounting Profession", "url": "https://doi.org/10.1111/1911-3846.70083", "authors": "Allen D. Blay ほか", "venue": "Contemporary Accounting Research", "date": "2026-09-30", "sjr": 3.686, "id": "jr07", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "会計職に就く前の学生857人を数年追跡し、特性としての職業的懐疑心が会計・監査の成績や公認会計士（CPA）試験の結果とどう関係し、監査の授業で懐疑心がどう変わるかを示した（抄録）。", "p2": "監査人の職業的懐疑心（うのみにせず証拠を批判的に評価する姿勢）は重要とされるが、職に就く前にどう育ち、大学教育で高められるかは分かっていなかった（抄録）。", "p3": "2つの縦断研究で、合計857人の学生の特性的な懐疑心と、授業の成績、CPA試験の結果、監査の授業前後のリスク判断、専攻や職業の選択を数年にわたって追う（抄録）。", "p4": "懐疑心の高低による成績と試験結果の違い、監査の授業による懐疑心とリスク判断の変化、専攻・職業選択との関係を比べる（抄録）。測定尺度と分析モデルの詳細は未確認（本文を入手できず）。", "p5": "懐疑心の高い学生は会計・監査の授業の成績が良く、CPA試験の初回の得点も高かったが、低い学生も粘り強く挑戦し、最終的な合格率は同程度だった（抄録）。監査の授業で、懐疑心が最も低かった学生は大きく上がり、最も高かった学生は下がった。授業は全員のリスク認識を高めて懐疑心による差を縮めた。懐疑心は会計専攻の選択には影響しなかったが、懐疑心の高い女性は男性より監査職を選びやすかった。", "p6": "未確認（本文を入手できず）。解釈：懐疑心の高い学生の低下が平均への回帰によるものか、授業の効果によるものかは、抄録からは区別できない。", "fun": "「疑ってかかる力」は監査人に欠かせないが、生まれつきなのか、育てられるのか。857人の学生を数年追うと、疑い深い学生は試験の初回の点が高いが、そうでない学生も粘って最後は同じくらい合格した。しかも監査の授業で、疑う力が弱かった学生ほど伸びた。才能の差を教育で埋められる可能性を示しているのが面白い。", "unverified": "懐疑心の測定尺度、効果の大きさの数値、2つの研究の違いは確認できなかった。"}, "citescore": 7.3, "citescore_year": "2025"}, {"rank": 8, "theme": "サービス・マーケティング", "headline": "体験を評価させると変化に気づき楽しさが続く", "title": "Rating an Experience Makes People Notice How It Is Changing: Consequences for Hedonic Adaptation and Consumer Enjoyment", "url": "https://doi.org/10.1093/jcr/ucag038", "authors": "Stephanie Hong ほか", "venue": "Journal of Consumer Research", "date": "2026-09-30", "sjr": 11.045, "id": "jr08", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "体験を繰り返し評価させると、人は体験の変化に気づきやすくなり、悪化する体験では飽きが早まり、改善する体験では楽しさが増すことを、16研究（計16,311人）で示した（抄録）。", "p2": "マーケティングの研究や実務では、似た製品を何度も評価させたり、サービス提供者が顧客の様子を定期的に尋ねたりする（抄録）。こうした反復測定は、変化していく体験や好みをそのまま明らかにするだけだと想定されてきた。", "p3": "体験について繰り返し尋ねると、体験が「どう変わっているか」に注意が向き、少しずつの違いに気づきやすくなる、という仕組みを想定する（抄録）。媒介分析と調整分析を含む複数の実験で、評価の頻度を変えたときの快楽順応（同じ刺激に慣れて楽しさが薄れること）と楽しさを比べる。", "p4": "ゲーム、食べ物、歌、動画、美術作品などの多様な快楽的な刺激を使った16研究、計16,311人で検証する（抄録）。変化が悪い方向の場合と良い方向の場合を比べる。", "p5": "悪い方向に変化する体験では、繰り返しの評価が少しずつの低下を目立たせて順応を強め、退屈と離脱を早めた（抄録）。良い方向に変化する体験では、少しずつの改善が目立って体験が良くなった。評価で変化に注意が向くと、変化が増幅されるという中心的な考えが多様な刺激で確認された。", "p6": "未確認（本文を入手できず）。解釈：反復測定そのものが測定対象を変えるため、満足度の追跡調査の結果は測定の頻度の影響を受けうる。", "fun": "「今の気分は何点？」と何度も聞かれると、少しずつの変化に気づきやすくなる。だんだんつまらなくなる動画では飽きるのが早まり、だんだん良くなる音楽ではより楽しくなる。測ること自体が体験を変えてしまうので、アンケートを取りすぎるとお客さんを早く飽きさせるかもしれない、というのが面白い。", "unverified": "各研究の効果の大きさ、評価の頻度の条件の詳細は確認できなかった。"}, "citescore": 13.9, "citescore_year": "2025"}, {"rank": 9, "theme": "職場AI・組織行動", "headline": "技術に強いのに疲弊する：経営陣の境界管理と形式化", "title": "Tech Ready Yet Emotionally Drained: Unraveling the Multilevel Dynamics of Top Management Team Boundary Control and Formalization in Organizations", "url": "https://doi.org/10.1177/10596011261488153", "authors": "Aldijana Bunjak ほか", "venue": "Group and Organization Management", "date": "2026-09-30", "sjr": 2.543, "id": "jr09", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "デジタル技術への準備性（技術的準備性）が高い従業員でも、部署の形式化や経営陣の境界管理の支えがないと、かえって情緒的な消耗が強くなることを、ドイツの中小企業80社・2,267人の多層データで示した（抄録）。", "p2": "技術的準備性は、適応力と有能感を高めるので健康によいと考えられがちだが、ウェルビーイングとの関係ははっきりしない（抄録）。どんな条件で負担を和らげ、どんな条件で強めるのかは分かっていなかった。", "p3": "仕事の要求・資源理論と経営者層理論に基づき、技術的準備性を個人の資源とみなす（抄録）。それと情緒的な消耗の関係が、部署レベルの形式化（手順やルールの整備）と、組織レベルの経営陣による境界管理（仕事と私生活の境界を守る規範）に左右されるという多層モデルを立てる。", "p4": "ドイツの中小企業80社の1,547部署に属する2,267人の、複数の情報源からの大規模データで検証する（抄録）。", "p5": "仮説はおおむね支持され、技術的準備性は個人の資源であるにもかかわらず、情緒的な消耗との関係は部署の構造と組織の規範の組合せで決まった（抄録）。形式化と経営陣の境界管理の支えがないと、技術的準備性が高いほど情緒的な消耗が大きかった。", "p6": "未確認（本文を入手できず）。解釈：抄録からは横断データか縦断データかが分からず、因果の向きの解釈には注意が要る。", "fun": "デジタルに強い社員ほど元気に働けそうだが、実はそうとは限らない。ルールが整っておらず、経営陣が「勤務時間外は連絡しない」といった線引きをしていない会社では、デジタルに強い人ほど疲れ切っていた。できる人に仕事が集まり、境目なく働いてしまうのかもしれない。個人の能力を生かすには組織の仕組みが要るという話だ。", "unverified": "効果の大きさ、データが横断か縦断か、測定尺度の詳細は確認できなかった。"}, "citescore": 11.3, "citescore_year": "2025"}, {"rank": 10, "theme": "LLM熟議・ペルソナ", "headline": "1,000のペルソナとの対話から先回り支援を学ぶ", "title": "After Talking with 1,000 Personas: Learning Preference-Aligned Proactive Assistants from Large-Scale Simulated Persona Interactions", "url": "https://doi.org/10.1145/3831999", "authors": "Ziyi Xuan ほか", "venue": "Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous Technologies", "date": "2026-09-30", "id": "jr10", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "1,000の多様なペルソナとの模擬対話から、先回りして手助けするアシスタントの「いつ・どこまで・どう話すか」の好みの共通構造を学び、端末上で個人に合わせて軽量に調整する枠組みを示した（抄録）。", "p2": "先回り型のスマートアシスタントは、タイミングが悪いと利用者の信頼を失い機能を切られる（抄録）。好みを学ぶ実地調査は高価で規模が小さく、複数回の利用で好みが変わる様子も捉えにくい。既存の合成データは時間の奥行き、ペルソナの多様さ、多次元の好みに乏しく、端末上で集団の知見を個人に移す方法も乏しかった。", "p3": "まず1,000のペルソナとの大規模な対話の模擬から、タイミング、自律の程度、伝え方などの次元で好みが表れる共通の構造を学び、実利用者の記録なしに良い初期状態を作る（抄録）。次に、簡単な利用時のフィードバックに基づく軽量な活性化ステアリング（モデル内部の活性に方向を加える操作）で、再学習やクラウドでの更新なしに端末上で個人に適応させる。", "p4": "1,000の模擬ペルソナによる統制した模擬実験と、34人の参加者による実験で評価し、調整なしのモデルと直接応答型の基準と比べる（抄録）。端末上のステアリングは、人のフィードバックによる強化学習（RLHF）とも比べる。", "p5": "タイミングの判断と対話の質の評価が基準より向上し、端末上の活性化ステアリングはRLHFと同程度の性能だった（抄録）。参加者は、複数回の利用でアシスタントが適応するにつれ、満足・信頼・安心感が高まったと答えた。", "p6": "未確認（本文を入手できず）。解釈：人の実験は34人と小規模で、1,000のペルソナで学んだ好みの構造が実際の多様な利用者をどこまで代表するかは別に検証が要る。", "fun": "「今話しかけてほしい？」はAIアシスタントの難題だ。1,000人分の架空の人物（ペルソナ）とAIを会話させて、人が好む話しかけ方の共通パターンを先に学び、あとは使う人の反応を見て少しずつ調整する。実際の個人データを集めなくても良いスタートが切れ、スマホの中だけで自分好みになる。架空の人物が本物の人の役に立つ例だ。", "unverified": "改善の具体的な数値、ペルソナの作り方、34人の実験の手順は確認できなかった。"}, "citescore": 10.2, "citescore_year": "2025"}, {"rank": 11, "theme": "包摂的コミュニティ・社会", "headline": "孤独と幸福感を近隣の結束が和らげるか", "title": "Loneliness and Well-Being: Exploring the Stress-Buffering Role of Neighborhood Cohesion.", "url": "https://doi.org/10.1093/sw/swag038", "authors": "Chai L.", "venue": "Social work", "date": "2026-10-01", "id": "jr11", "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。本文は取得できず", "preprint": false, "p1": "英国の世帯パネル調査で、孤独が精神的健康と生活満足度を下げる関係を、近隣の結束（ご近所のまとまり）が和らげることを、個人の固定効果モデルで示した（抄録）。", "p2": "孤独は精神的健康の悪化や生活満足度の低下と結びつく社会的なストレス要因として確立しているが、その関係を和らげる心理社会的な資源はあまり調べられていなかった（抄録）。", "p3": "近隣の結束が、孤独と2つの結果の関係を調整（緩衝）するか、その働きが男女で異なるかを調べる（抄録）。個人の時間で変わらない特性の影響を除くため、固定効果回帰モデルを使う。", "p4": "英国世帯パネル調査（UKHLS）のうち、近隣の結束と孤独の両方を測った唯一の2つの波（2017〜2019年、2020〜2022年）の14,787人・29,574人年のデータを使う（抄録）。", "p5": "孤独は精神的健康の悪化と生活満足度の低下に、近隣の結束は精神的健康の良さと生活満足度の高さに関連した（抄録）。近隣の結束は、孤独と両方の結果の関係を調整しており、ストレスを緩衝する資源としての役割が支持された。この調整の働きに男女差はなかった。", "p6": "未確認（本文を入手できず）。解釈：2つの波だけの固定効果分析であり、2つ目の波がコロナ禍の時期と重なるため、その影響をどう扱ったかは確認が要る。", "fun": "同じ「さびしさ」を感じていても、近所どうしのつながりがある地域に住んでいると、心の健康への悪影響が小さくなっていた。14,787人を2回調べ、同じ人の中での変化を比べることで、性格などの違いの影響を取り除いている。地域のまとまりが、心の「クッション」になりうることを示す結果だ。", "unverified": "効果の大きさの数値と、固定効果モデルに入れた統制変数は確認できなかった。"}, "citescore": 3.6, "citescore_year": "2025"}, {"rank": 12, "theme": "都市・インフラ政策", "headline": "湾岸諸国の都市開発の系統的レビュー", "title": "Cities of the Gulf: A Systematic Review of Urban Development", "url": "https://doi.org/10.1177/08854122261482147", "authors": "Rahma Abdelghani ほか", "venue": "Journal of Planning Literature", "date": "2026-09-30", "sjr": 1.963, "id": "jr12", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "湾岸協力会議（GCC）諸国の都市開発に関する査読論文140本（1950〜2024年）を系統的に整理し、研究の偏りと、持続可能性の掛け声と実施の間の溝を示した（抄録）。", "p2": "GCC諸国は世界で最も都市化が進んだ地域の一つだが、その都市開発の研究は断片的だった（抄録）。", "p3": "PRISMA-ScR（スコーピング・レビューの報告指針）に沿って文献を選び、都市の歴史と変遷、都市形態、都市政策、公共対民間の開発、都市の持続可能性の5つのテーマに分類する（抄録）。", "p4": "140本の査読論文の地理的・主題的な分布と研究方法を整理する（抄録）。選定基準の詳細は未確認（本文を入手できず）。", "p5": "研究は地理的にも主題的にも大きく偏り、質的な事例研究が多数を占め、都市の持続可能性をうたう言説と実施の間には根強い溝があった（抄録）。比較研究、複数の空間スケールを扱う研究、実務に即した実証研究を今後の優先課題として挙げている。", "p6": "未確認（本文を入手できず）。解釈：査読論文に限ったレビューのため、行政の報告書や地域の言語の文献に含まれる知見は対象外になっている可能性がある。", "fun": "砂漠の中に高層ビルが並ぶ湾岸の国々は、世界でもとりわけ都市化が進んだ地域だ。そこでの都市づくりの研究140本を集めてみると、特定の都市や話題に偏り、「持続可能な都市」を掲げながら実際には進んでいないという溝が浮かんだ。急成長した都市をどう評価するかの地図になる研究だ。", "unverified": "国別・テーマ別の論文数の分布は確認できなかった。"}, "citescore": 11.0, "citescore_year": "2025"}, {"rank": 13, "theme": "位相空間・土木三力学", "headline": "多様なデータを統合して地盤パラメータの不確実性を定量化", "title": "Multi-source data integration for soil parameter uncertainty quantification", "url": "https://doi.org/10.1680/jgeot.25.00652", "authors": "Ningxin Yang ほか", "venue": "Geotechnique", "date": "2026-09-30", "sjr": 2.054, "id": "jr13", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "地盤の数値解析のパラメータを、施工から供用までの段階ごとに複数種類の観測データで逐次ベイズ更新し、不確実性を減らしていく枠組みを示し、実物大の杭の水平載荷試験で実証した（抄録）。", "p2": "地盤パラメータの較正は信頼できる解析に不可欠だが、現場の計測が限られること、モデルの不一致（モデル自体の誤差）、出力どうしの相関、複数種類のデータを取り込む必要があることから難しかった（抄録）。", "p3": "段階的なデータ同化で多くのモデルパラメータを順に絞り込む逐次ベイズの枠組みを使う（抄録）。主成分分析と多項式カオス展開を組み合わせた縮約モデルで、出力の相関を保ち大域感度解析もできる効率的な代理モデルを作る。モデルの不一致と不確実性を明示的に扱い、複数種類の観測を統合する独自の尤度を作り、工学的に重要な領域に重みを置く空間的な重み付けも行う。", "p4": "実物大の杭の水平載荷試験で手法を実証する（抄録）。代理モデルの精度と、更新によるパラメータの不確実性の減り方、現場の観測との整合性を見る。", "p5": "代理モデルは正確かつ計算効率の良い予測を与え、ベイズ更新は現場の観測と整合したままパラメータの不確実性を系統的に減らした（抄録）。", "p6": "未確認（本文を入手できず）。解釈：実証は1つの杭の試験に基づいており、地盤条件や構造形式が異なる現場への一般化は別に確かめる必要がある。", "fun": "地面の中の土の硬さは、全部を掘って調べることができない。そこで、工事が進むたびに手に入る計測データを使って、推定を少しずつ確かにしていく。重い計算は、要点だけを残した「身代わりのモデル」で速く回す。天気予報が新しい観測で予報を直していくのと同じ考え方を、地盤に使っている。", "unverified": "更新前後の不確実性の減り方の数値と、使った観測の種類の詳細は確認できなかった。"}, "citescore": 14.0, "citescore_year": "2025"}, {"rank": 14, "theme": "サービス・マーケティング", "headline": "人とAIが混在する接客で私的情報をどこまで開示するか", "title": "Different agents, different trust: private information disclosure in hybrid service encounters", "url": "https://doi.org/10.1108/ijchm-01-2026-0082", "authors": "Chang Ma ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-09-30", "sjr": 3.116, "id": "jr14", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "ホテルや観光の接客で、相手が人かAIかによって、客が私的な情報を開示する理由がどう違うかを、探索・検証・実験の3段階の混合研究法で示した（抄録）。", "p2": "AIを使ったサービス技術が広がり、客は人とAIの両方に私的な情報を開示するようになっている（抄録）。接客担当者の種類が情報開示をどう左右するかは分かっていなかった。", "p3": "探索的な順次型の混合研究法をとる（抄録）。第1段階で人とAIへの開示経験を探り、担当者の種類に応じた概念枠組みを作る。第2段階で、多次元の信頼（能力、誠実さ、善意）、知覚された統制（透明性、脆弱性、プライバシーの主導権）と開示意向の関係を検証し、第3段階で担当者の種類とブランドのなじみを操作する実験を行う。", "p4": "各段階の標本数や分析手法の詳細は未確認（本文を入手できず）。評価の中心は、信頼と知覚された統制のどちらが開示意向を予測するか、担当者の種類で信頼の源がどう変わるかである（抄録）。", "p5": "担当者の種類は、開示するかどうかよりも、なぜ相手を信頼するかに影響した（抄録）。AIの担当者への信頼は主に能力から、人の担当者への信頼は主に善意から生じた。開示意向の主な予測因子は、知覚された統制ではなく信頼だった。ブランドのなじみは組織の保証の手がかりとなり、どちらの担当者でも信頼と開示意向を高めた。", "p6": "未確認（本文を入手できず）。解釈：開示の意向を測ったもので、実際の開示行動との対応は別に確かめる必要がある。", "fun": "ホテルで個人情報を聞かれたとき、相手がロボットなら「ちゃんと処理できそうか（能力）」で、人なら「自分のためを思ってくれそうか（善意）」で信頼するかを決めていた。どちらでも、最後に話すかどうかを決めたのは信頼で、「自分で管理できる感覚」ではなかった。相手によって安心の理由が違うという発見が面白い。", "unverified": "各段階の標本の大きさと効果の大きさは確認できなかった。"}, "citescore": 22.1, "citescore_year": "2025"}, {"rank": 15, "theme": "職場AI・組織行動", "headline": "持続可能性の認証は従業員の職場経験を映すか", "title": "Beyond the Badge: Do Sustainable Business Certifications Reflect Employees' Workplace Experiences? Evidence From Employee‐Reported Workplace Evaluations", "url": "https://doi.org/10.1002/csr.71009", "authors": "Malte Bau ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-09-29", "sjr": 2.147, "id": "jr15", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "持続可能性の認証（B CorpとEconGood）を受けた企業は、従業員の口コミ評価が認証のない企業より高い一方、認証の得点の高さと従業員の評価には関係がないことを示し、外部の認証と内部の評価の「切り離し」を指摘した（抄録）。", "p2": "持続可能性の認証は、外部へのシグナルであると同時に組織内部の資源とも考えられるが、認証が従業員の職場経験を実際に映しているかは確かめられていなかった（抄録）。", "p3": "シグナリング理論と資源ベース理論に基づき、認証のデータと、ドイツ語圏の代表的な雇用主口コミサイトkununuの評価を結びつける（抄録）。分散分析、回帰、確証的因子分析で、認証と従業員の評価の関係、2つのシグナルの内容が重なるかを調べる。", "p4": "意図的に選んだ認証企業172社と、比較群の20,026社を使う（抄録）。どちらの認証も、労働者に関する採点項目を含む任意の持続可能性基準である。", "p5": "認証企業は非認証企業より従業員の評価が高かった（抄録）。しかし、認証で得た得点と従業員の評価には関連がなかった。確証的因子分析では、口コミサイトが測る構成概念と認証の労働者の次元の間に、有意だが中程度の相関があり、概念の部分的な重なりが示された。", "p6": "未確認（本文を入手できず）。解釈：認証企業は意図的に選ばれており、比較群との違いが認証によるのか、もともと働きやすい企業が認証を取るのかは区別できない。", "fun": "「社会に良い会社」の認証を持つ会社は、社員の口コミの評価も高かった。ところが、認証の点数が高い会社ほど社員の評価が高い、という関係はなかった。外から見た「良い会社」の点数と、中で働く人の実感が必ずしも一致しないことを示しており、認証の意味を考えさせられる。", "unverified": "評価の差の大きさと、回帰の係数の値は確認できなかった。"}, "citescore": 14.5, "citescore_year": "2025"}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "センサ情報を使う橋の確率的信頼性解析のレビュー", "title": "Sensor-Informed Probabilistic Bridge Reliability Analysis: A Review", "url": "https://doi.org/10.3390/s26196199", "authors": "Isaac Ojonogecha Adama ほか", "venue": "Sensors", "date": "2026-09-30", "id": "jr16", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "センサのデータを橋の確率的な信頼性解析に取り込む流れを、センサ選定から信頼性指標β・余寿命の推定・維持管理の最適化まで整理したレビュー（抄録）。", "p3": "ドリフト・偏り・雑音・欠測・同期誤差・較正の不確実性が信頼性解析の連鎖をどう伝わるかを評価し、MCMC、逐次モンテカルロ、変分推論、近似ベイズ計算、ニューラルな模擬に基づく推論などを整理した（抄録）。", "p5": "センサの不完全さは信頼性指標と余寿命の推定に伝わり、前処理が信頼性を左右し、どの推論法も万能ではないとまとめた（抄録）。例示のシナリオでは余寿命への影響がドリフト＞欠測＞偏りの順だったが、これは仮定した条件に依存するとしている。", "fun": "橋に付けたセンサは、年月とともに少しずつずれたり、データが抜けたりする。その小さな不完全さが、「この橋はあと何年もつか」という答えにまで響く。センサの選び方から計算の方法まで、一続きの流れとして点検すべきだという整理が役に立つ。", "unverified": "本文を読んでいないため、各推論法の比較の詳細は未確認。"}, "citescore": 9.4, "citescore_year": "2025"}, {"rank": 17, "theme": "VBI・橋梁SHM", "headline": "エッジ計算で動く軽量な画像変位計測システム", "title": "Lightweight vision-based displacement measurement system with edge computing for long-term structure health monitoring", "url": "https://doi.org/10.1016/j.engstruct.2026.123854", "authors": "Wenkang Du ほか", "venue": "Engineering Structures", "date": "2026-09-28", "sjr": 1.922, "id": "jr17", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "動画の取得・実時間処理・変位の同定を現場の小型機器（エッジ）で行う、軽量な画像による変位計測システム（LightSVDMS）を開発した（抄録）。", "p3": "受動的な標的とエッジ計算を組み合わせた計測の枠組みを設計し、振動台試験、橋の縮小模型の実験、6か月の現地計測で検証した（抄録）。", "p5": "縮小模型の試験で変位の計測誤差は1.5%未満で、6か月の現地設置で実橋の環境での長期的な安定性と実用性を確かめた（抄録）。", "fun": "橋のたわみを、カメラで標的を撮るだけで離れた場所から測る。撮った動画をその場の小さなコンピュータで処理するので、大量のデータを送らずに済む。安く、すぐ取り付けられる見張り番として、古い橋の点検に役立ちそうだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 12.0, "citescore_year": "2025"}, {"rank": 18, "theme": "VBI・橋梁SHM", "headline": "MBSEで設計した山岳吊橋のデジタルツイン監視", "title": "Design and Research on a Digital Twin Monitoring System for Mountainous Suspension Bridges Based on MBSE", "url": "https://doi.org/10.3390/buildings16193892", "authors": "Xiaowen Wang ほか", "venue": "Buildings", "date": "2026-09-30", "sjr": 0.686, "id": "jr18", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "山岳部の長大吊橋（瀘沽湖大橋）の安全監視システムを、モデルベースシステム工学（MBSE）とデジタルツインを組み合わせて設計した（抄録）。", "p3": "SysMLで要求・機能・論理・物理の構成をモデル化し、1:150の縮尺模型をMBSEの流れ全体に検証の段階として組み込み、5層のデジタルツイン監視の構成を作った（抄録）。", "p5": "模型の静的・温度・動的な載荷試験で、主な測点の応答誤差はおおむね7%以内で、動的な特性は解析とよく一致した（抄録）。多源のデータ接続、3次元の実物と仮想の対応づけ、閾値による警報を備えた軽量なシステムを開発した。", "fun": "山奥の大きな吊橋を見守るために、コンピュータの中に橋の「双子」を作る。設計の段階から小さな模型で確かめながら進めるのが工夫で、実物の橋のセンサの値と双子の計算を突き合わせて異常を知らせる仕組みになっている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 5.6, "citescore_year": "2025"}, {"rank": 19, "theme": "VBI・橋梁SHM", "headline": "鉄道レールのAE源を効率よく特定するAI", "title": "Development of an efficient AI model for fault identification and directional AE source identification in railway steel tracks", "url": "https://doi.org/10.1177/14759217261492290", "authors": "Suman Dey ほか", "venue": "Structural Health Monitoring", "date": "2026-09-30", "sjr": 1.364, "id": "jr19", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "鉄道のレールの欠陥の位置と区域を、1つの広帯域のアコースティック・エミッション（AE）センサの信号から深層学習で識別する低コストの方法を示した（抄録）。", "p3": "AE信号を連続ウェーブレット変換で時間・周波数の像にし、363か所の鉛筆芯折り試験による1,452のAEイベントで、人工ニューラルネット、CNN、CNNとLSTMの混成を比べた（抄録）。", "p5": "CNN-LSTMが最も良く、欠陥位置の識別で98.7%、区域の分類で99.17%の精度だった（抄録）。", "fun": "レールのひびは、割れるときに小さな「音」（弾性波）を出す。この研究は、センサをたくさん並べる代わりに1つだけで、その音の響き方の特徴からひびの場所をAIで当てた。鉄道の見回りを安く効率よくする工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 14.4, "citescore_year": "2025"}, {"rank": 20, "theme": "VBI・橋梁SHM", "headline": "洋上風車ブレードのSHMのレビュー", "title": "Recent advances in structural health monitoring for offshore wind turbine blades: A review of physics-based models, data-driven methods, and surface defect detection", "url": "https://doi.org/10.1177/14759217261487750", "authors": "Yuansheng Cheng ほか", "venue": "Structural Health Monitoring", "date": "2026-09-30", "sjr": 1.364, "id": "jr20", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "洋上風車のブレードの構造ヘルスモニタリングを、物理に基づく疲労評価、データ駆動の故障診断、表面欠陥の検出の3本柱で整理したレビュー（抄録）。", "p3": "陸上用の手法がそのまま使えない海洋環境の課題を踏まえ、3つの柱の最近の進展をまとめた（抄録）。", "p5": "UAVを海上のセンサの運び手とし、機械視覚でブレードの振動を測りつつ深層学習で表面欠陥を検査することで、3つの方法を1つの枠組みに統合できると示し、その課題を論じた（抄録）。", "fun": "海の上の風車の vernance", "url": "https://doi.org/10.1002/csr.71032", "authors": "Eman F. Attia ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-09-29", "sjr": 2.147, "id": "jr25", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中東・北アフリカ・トルコ地域の上場企業で、利益調整がESGの成績を下げる関係と、取締役会の特性がそれをどう調整するかを調べた（抄録）。", "p3": "15か国の上場企業の2017〜2024年の13,181企業年のデータに、動学的なシステムGMMを適用し、RefinitivのESGスコアを成績の代理指標にした（抄録）。", "p5": "利益調整はESGスコアと有意な負の関係にあり、取締役会の専門性は実体的な利益調整と環境・社会スコアの負の関係を一貫して弱め、女性比率・在任期間・CEOの兼任の効果は柱と利益調整の種類によって異なった（抄録）。", "fun": "決算の数字をうまく「お化粧」する会社は、環境や社会への取り組みの評価も低かった。ただ、専門知識のある取締役がいると、その悪い関係が弱まる。会社の数字の正直さと、社会への誠実さがつながっているという結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 14.5, "citescore_year": "2025"}, {"rank": 26, "theme": "会計情報科学", "headline": "中国の上場廃止制度改革と回避行動・監査報告", "title": "Delisting system reform effects on avoidance behavior and audit reporting: insights from China’s market", "url": "https://doi.org/10.1108/maj-11-2024-4587", "authors": "Dingrui Liu", "venue": "Managerial Auditing Journal", "date": "2026-09-29", "id": "jr26", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国で2020年に行われた上場廃止制度の改革が、上場廃止の危険のある企業の回避行動と監査の開示に与えた影響を差分の差分で調べた（抄録）。", "p3": "2018〜2022年の中国A株上場企業のパネルデータで改革の前後を比べ、統治の仕組みとして監査意見の変化も分析した（抄録）。", "p5": "改革後、発生主義の利益調整は増えたが実体的な利益調整は変わらず、上場廃止の危険のある企業が限定的な監査意見を受ける可能性は有意に高まった一方、監査上の主要な検討事項の開示には目立った変化がなかった（抄録）。", "fun": "上場廃止のルールを厳しくすると、廃止を避けようと決算の数字を操作する会社が出てくる。実際、帳簿の上での調整は増えたが、監査人も厳しい意見を出すようになった。ルールを変えると、会社と監査人の両方の行動が動くことがよく分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 5.8, "citescore_year": "2025"}, {"rank": 27, "theme": "会計情報科学", "headline": "企業のAI活動と会計情報の比較可能性", "title": "corporate artificial intelligence activity and accounting information comparability: evidence from CEO generational differences", "url": "https://doi.org/10.1038/s41598-026-69633-w", "authors": "Linrong Wu ほか", "venue": "Scientific Reports", "date": "2026-09-29", "id": "jr27", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の非金融上場企業で、AI特許で測った企業のAIの能力が高いほど、会計情報の比較可能性が高いことを示した（抄録）。", "p3": "2012〜2022年の12,355企業年のデータで、1年遅らせたAI特許出願数の標準化指標を説明変数とし、内部統制と利益調整を通じた経路、CEOの世代による違いを調べた（抄録）。", "p5": "AIの能力が高い企業は会計情報の比較可能性が高く、その経路として内部統制の強化と利益調整の減少があり、1970年以降に生まれたCEOの企業で効果が強かった（抄録）。二重機械学習や操作変数などでも頑健だった。", "fun": "AIの技術を持つ会社ほど、決算書が他社と比べやすい、つまり「同じ出来事を同じように記録する」傾向があった。AIが社内のお金の流れの記録を整え、数字のごまかしを減らすらしい。しかも若い世代の社長の会社で効果が強いのが興味深い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}, "citescore": 6.4, "citescore_year": "2025"}, {"rank": 28, "theme": "会計情報科学", "headline": "伝達手段と課題の曖昧さが監査人ペアの成績に与える影響", "title": "The effects of communication mode and task ambiguity on the performance of auditor dyads: An experimental investigation", "url": "https://doi.org/10.1016/j.accinf.2026.100792", "authors": "Ahmed Shuaib ほか", "venue": "International Journal of Accounting Information Systems", "date": "2026-09-30", "sjr": 1.747, "id": "jr28", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文を入手できず）", "preprint": false, "short": true, "p1": "題名から、監査人の二人組の成績に、伝達手段（対面か文字かなど）と課題の曖昧さが与える影響を実験で調べた研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、2人で監査の仕事をするとき、顔を合わせて話すかチャットでやりとりするかで、あいまいな問題への答えの質が変わるのかということだ。リモートワークの時代に身近な問いで、結果が気になる研究だ。", "unverified": "抄録・本文を入手できず、方法と結果は確認できなかった。"}, "citescore": 14.5, "citescore_year": "2025"}, {"rank": 29, "theme": "サービス・マーケティング", "headline": "オンライン詐欺の知識を測る尺度", "title": "Measuring consumer literacy about online fraud: effects on perceived financial risk and trust in online sellers", "url": "https://doi.org/10.1108/intr-09-2025-1406", "authors": "Gonzalo Luna Cortés", "venue": "Internet Research", "date": "2026-09-30", "sjr": 2.207, "id": "jr29", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true
