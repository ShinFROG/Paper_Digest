<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

ほぼ融和した社会に変わったという結果は、シミュレーションの結論が設定の書き方で簡単に動くことを示しています。", "unverified": "他のLLM（gpt-5.4-miniなど）での結果の数値は付録にあり、本文の範囲では確認できなかった。"}}, {"id": "pr02", "rank": 2, "headline": "LLMの合成回答者は確からしいが妥当でない", "title": "Probable but Not Valid: A Psychometric Audit of Decision Models as Synthetic Survey Respondents", "url": "https://arxiv.org/abs/2610.14912", "authors": "Mantas Lukauskas ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Lukauskas, M., & Šarkauskaitė, V. (2026). Probable but Not Valid: A Psychometric Audit of Decision Models as Synthetic Survey Respondents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14912", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ・評価法の§3–4、結果の§5.1と§5.12、考察・限界・結論の§6–8）を読んだ", "preprint": true, "p1": "評定尺度の各段階に確率を返す新しい「意思決定モデル」14種と生成型LLM 47種を、実在の心理測定調査と照合し、どちらも人の回答者の代わりにはならないことを示した（§8）。", "p2": "LLMで作る合成回答者（シリコン・サンプル）の利用が広がるが、先行監査で生成型LLMは代替にならないとされた。確率を直接返す意思決定モデルや新しい版で改善するかは未検証だった（§1、§3）。", "p3": "リトアニアの組織心理学の公開調査（263人、68項目、12下位尺度）で、人の属性11項目のプロフィールを与えて100人分を回答させた（§3）。意思決定モデルは確率ベクトルを返し、丸めた期待値・抽出などの読み出し方で1つの回答にする（§4）。", "p4": "心理測定的類似度PSS＝0.25×項目分布の近さ＋0.25×項目間相関の型の一致＋0.20×信頼性＋0.20×媒介効果＋0.10×属性差の符号一致で評価し（式1）、ガウスコピュラなどの統計的基準と2つ目の人のサンプルと比べた（§3–4）。", "p5": "最良の生成型（MiniMax M3）のPSSは0.813で、他の回答者だけに当てはめたコピュラ（0.824）と同水準だった（抄録）。丸めた読み出しでは意思決定モデル14種中13種が基準のgpt-5.4-miniを下回り、相関の型では生成型47種中33種がどの意思決定モデルより良かった（抄録、§5.12）。確率ベクトルは平均すると人の項目分布に近いが、個人の回答の予測では他の回答者の頻度に負けた。プロフィールによる回帰は頻度を1.0%改善するだけだった（§6）。新しい版は10系列中8系列で旧版を下回った（§6）。", "p6": "1か国・1言語・1調査の100人で、PSSは最良のモデルと実在の人を順位づけできない（§7）。人の参照は非確率のオンライン標本である（§6）。解釈：属性だけのプロフィールでは個人を再現できず、目標は標本レベルの忠実さに置くべきという結論は、合成回答者の設計に広く効く。", "fun": "性別・年齢・職位などを教えれば、AIはその人の答えを当てられるでしょうか。実は、同じ情報を使った統計の回帰でもほとんど当たりません。人の答えの違いは、こうした属性の外にあるからです。さらに、新しいAIほど「無難な中間の答え」に寄って、本物のアンケートらしさが減っていたという結果は、AIの改良が必ずしも調査の代わりとしての改良ではないことを示しています。", "unverified": "表1の各モデルの成分ごとの数値と、2つ目の人のサンプルのPSSの具体的な値は確認できなかった。"}}, {"id": "pr03", "rank": 3, "headline": "スタンフォードのオンライン熟議基盤の設計", "title": "Technology-Supported Moderation in Online Deliberation", "url": "https://arxiv.org/abs/2610.18187", "authors": "Lodewijk L. Gelauff ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Gelauff, L. L., Goel, A., & Sakshuwong, S. (2026). Technology-Supported Moderation in Online Deliberation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18187", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（先行研究、プラットフォームの設計の§3、考察の§4）を読んだ。§2の熟議一覧表の中身は抽出テキストに含まれず未読", "preprint": true, "p1": "人の進行役なしで少人数の熟議を運営するスタンフォード・オンライン熟議プラットフォームの設計を、運用実績とともに体系的に記録した（§2–3）。", "p2": "熟議型世論調査などのミニ・パブリックは代表標本を対面で集めるのに費用と手間がかかり、進行役の訓練も必要で、規模と頻度が限られてきた（§1.1）。", "p3": "1部屋8〜15人の小集団で、発言要求の待ち行列（既定45秒）、割り込み（15秒）、議題の段階表示、質問の提出・編集・投票による成果づくりを自動化した（§3.1、§3.3）。沈黙が20秒続くと全員に、180秒程度話していない人には個別に発言を促す「ナッジ」を送り、最も議論されていない論点を文面に入れる（§3.3.3）。AIは字幕、有害発言・関連性の推定、論点の追跡に使い、会話への介入には人を介在させる（§3.2）。", "p4": "設計記録であり、新たな比較実験はない。妥当性の根拠として、対面と同程度の満足度を示した先行研究や、フィンランドで対面・人の進行役つきオンライン・本基盤の3条件の意見変化が同程度だったRCTを引用している（§1.2.2）。", "p5": "2018年から2025年までに3万人超が参加し、100人以上の熟議は2025年12月までに54件記録された（抄録、§2）。有害発言は自動検出と参加者の投票を経て人の監督者に旗が上がる（§3.4.1）。各部屋の質問は「スーパー質問生成」で代表的な一組に集約され、数分で専門家パネルに渡せる（§3.4.3）。", "p6": "本稿自体は効果を検証していない。ナッジは無作為に省略して効果を推定できる設計だが、その結果は示されていない（§3.3.3）。解釈：意見変化の因果的な要因を個々のやりとりから分けることは今後の課題とされ（§4）、ログの活用はこれからである。", "fun": "話し合いの司会者がいないと、声の大きい人ばかりが話しそうです。この仕組みでは、順番待ちの列、持ち時間のタイマー、黙っている人への「あなたはどう思いますか」という声かけを画面が自動で行います。司会をAIの人格に任せるのではなく、ルールと小さな後押しで参加者自身に話し合いを任せるという設計思想が面白い点です。", "unverified": "54件の大規模熟議の内訳（国・言語・テーマ）は表として抽出されておらず確認できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "部分観測から物理・ニューラル動力学を高速同定", "title": "Scalable Identification of Physics-Based and Neural Dynamics from Partial Measurements", "url": "https://arxiv.org/abs/2610.16559", "authors": "Yibo Zhou ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Zhou, Y., & Köhler, J. (2026). Scalable Identification of Physics-Based and Neural Dynamics from Partial Measurements (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16559", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定・手法の§2–3、実験の§4と表1・2、結論）を読んだ。超勾配の導出の細部（式11–15）は概略のみ", "preprint": true, "p1": "状態の一部しか測れない非線形系で、物理モデル・ニューラルネット・両者を足したグレーボックスのいずれのパラメータも、状態推定と結合したまま大規模に同定できるようにした（§3、§5）。", "p2": "予測誤差法（PEM）と移動ホライズン推定（MHE）を入れ子にした既存の枠組みは偏りの少ない推定ができるが、パラメータ数が増えると感度行列が巨大になり、ニューラルネットには使えなかった（§1、§3.2）。", "p3": "内側でMHEが各データ窓の状態軌跡を推定し、外側で窓の最後の1ステップ先予測の誤差を最小にする2段の最適化を、内側のKKT条件で1段に緩和する（式5、式8）。外側の勾配（超勾配）を、パラメータ全体の感度行列を作らず随伴法とベクトル・ヤコビアン積で時間方向の疎性を使って計算する（§3.2）。例：レーシングカーの単一トラックモデルで、縦速度とヨーレートだけを測り、横速度とタイヤ力（Pacejka式16パラメータ）を推定する（§4.1）。", "p4": "計算時間の比較（ニューラルネットのパラメータ数を変える）、BayesRaceの模擬データでの1ステップ予測誤差と物理パラメータの相対誤差、実車データ（IAC）での予測誤差を、SUBNET、Joint-MHE、EKF→PEM（適応型を含む）と比べた（§4.2–4.4）。", "p5": "超勾配の計算は422万パラメータで215倍速く、結果の相対誤差は最大9.80×10⁻⁷だった（図2）。模擬データでは検証誤差が他手法より80倍以上小さく、物理パラメータの平均相対誤差は7.50%と最小だった（表1）。実車ではニューラル残差を加えたグレーボックスで学習・検証誤差が約31%下がったが、時変パラメータを許す適応型EKF→PEMにわずかに及ばなかった（表2）。", "p6": "パラメータは時不変と仮定しており、実データの時変性に弱い（§4.4）。学習時間は物理モデルで4時間41分、実車のグレーボックスで23時間40分と重い（表1・2）。漸近一致性の十分条件も未解決とされる（§5）。", "fun": "車の横すべりの速さは直接測りにくいのに、タイヤの性質を知るにはそれが必要です。この方法は、見えない状態を推定する計算と、モデルの性質を合わせ込む計算を一つの最適化にまとめ、その「勾配」を賢く計算して200倍以上速くしました。物理の式で骨格を作り、足りない部分だけをAIで補うと、意味の分かるパラメータを保ったまま予測が良くなるのが面白い点です。", "unverified": "表1でのPEM-MHE以外の物理パラメータ誤差の詳細（初期値の設定条件）は一部しか確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "センサ数・方向・故障に強いSHMセンサ配置", "title": "Physically Informed Sensor Array Design for CNN-based Structural Health Monitoring – With Example Application on Offshore Wind Turbine Blades", "url": "https://doi.org/10.2139/ssrn.7607761", "authors": "Pawel Klis ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Klis, P., Xing, Y., & Sui, D. (2026). Physically Informed Sensor Array Design for CNN-based Structural Health Monitoring – With Example Application on Offshore Wind Turbine Blades. https://doi.org/10.2139/ssrn.7607761", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず（403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "振動によるSHMで、センサの数・計測方向・センサ故障への備えをどう設計すべきかを、洋上風車ブレードのき裂検出を例に具体的な指針として示した（抄録）。", "p2": "振動ベースのSHMは盛んに研究されているが、何個のセンサを置くか、どの方向を測るか、モデルの選び方が診断にどう効くかという実務上の設計問題ははっきりしていなかった（抄録）。", "p3": "モノパイル上の15 MW基準風車を、乱流の風と不規則波の複合荷重で模擬し、ブレードの振動のスペクトログラムから畳み込みニューラルネット（CNN）でき裂を検出・位置特定した。き裂はフラップ方向・エッジ方向・断面全体の3種類、センサ構成は3〜51個とした（抄録）。", "p4": "未確認（抄録には評価指標と比較の詳細が書かれていない）。抄録からは、センサ構成ごとの検出・位置特定の成否と、センサ1個の故障時の性能が評価の軸と読める。", "p5": "1方向だけのセンサは、向きの分からないき裂に対して死角をもち、両方向を記録すると、わずかな追加費用で死角がなくなった。全センサ構成で学習したモデルはセンサが1個壊れると失敗したが、学習時にセンサをランダムに欠落させると、ほぼ費用なしで性能が戻った（抄録）。", "p6": "未確認（抄録・本文を入手できず）。抄録の範囲では、結果は模擬データに基づき、実測での検証の有無は書かれていない。", "fun": "揺れでブレードのひびを見つけるとき、センサが一方向しか測らないと、ある向きのひびがまったく見えない「死角」ができました。両方向を測るだけでその死角が消えます。また、全部のセンサがそろった状態だけで練習したAIは、1個壊れただけで役に立たなくなりますが、練習中にわざとセンサを抜いておくと平気になる、というのは人間の訓練にも通じる発見です。", "unverified": "検出精度の具体的な数値、比較したモデル、実測データでの検証の有無は確認できなかった。"}}, {"id": "pr06", "rank": 6, "headline": "ゲージ結合したフォッカー・プランク方程式の数値解法", "title": "A Gauge-Inspired Coupled Fokker--Planck System for Multistate Stochastic Dynamics: Formalism and 1-D Numerical Implementation", "url": "https://arxiv.org/abs/2610.14052", "authors": "Francesco Pio De Cosmo ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "De Cosmo, F. P., Di Natale, G., & Cieri, L. (2026). A Gauge-Inspired Coupled Fokker--Planck System for Multistate Stochastic Dynamics: Formalism and 1-D Numerical Implementation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14052", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（1次元への縮約の§2.2、数値解法の§3、結果の§4と図1〜6の説明、結論）を読んだ。§2.1の一般形の導出は未読", "preprint": true, "p1": "非可換なゲージ群SU(2)で結合した3つの確率密度のフォッカー・プランク方程式を、(1+1)次元で初めて数値的に解く手順を示した（§3、§5）。", "p2": "複数の状態をもつ確率過程をゲージ場で結合する理論的枠組みはあったが、非局所な積分項と非可換な自己相互作用のため、数値予測に落とし込む方法がなかった（§1、§2.2）。動機は巻雲の氷晶の形（晶癖）の発達のモデル化である。", "p3": "各状態の密度P_aは、ドリフトと拡散による流れJ_aの発散に加え、結合定数gに比例する項（他の2状態の密度と流れの空間積分・時間積分、レヴィ＝チヴィタ記号で巡回的に結合）とg²の項で変化する（式14–15）。解法は、結合源と拡散を先に進め、移流を非振動型のMPDATAで解く演算子分割で、毎時刻に全確率を再規格化する（§3.2、式31–32）。", "p4": "まず結合なしのオルンシュタイン・ウーレンベック過程の厳密解と比べて解法を検証し（図1、図2の格子収束）、次に結合なし（g=0）と結合あり（g=0.2）を、同一のガウス、離れたガウス、ガンマ分布の初期条件で比べ、gを0.01・0.1・1.0と変えた（§4）。", "p5": "格子収束は分割スキームの散逸のため1次精度に落ちた（図2）。結合を入れると、拡散を強めなくても状態間で確率が交換されてピークが平らになり、境界でゼロに減衰せず一定の背景が残った（図3）。長時間ではg=0.2で原点に局在せず平坦な分布に落ち着いた（図5）。g=0.01と0.1では線形版と2次項を含む版が重なり、g=1.0で分かれた（図6）。", "p6": "g≫1では非物理的な振動が生じて発散する（§4.2）。確率保存は毎時刻の再規格化で担保されており、スキーム自体の保存性とは別である（§3.2）。解釈：氷晶への応用や高次元化は今後の課題で、物理的な妥当性の検証はまだない。", "fun": "サイコロの目の出方のような「確率の分布」が、時間とともに流れて広がる様子を表すのがフォッカー・プランク方程式です。この研究では、3種類の状態の分布が素粒子物理の数学（ゲージ理論）の形で互いに確率をやりとりするようにしました。すると、どの状態も一か所に集まれず、全体が平らにならされていくという、単独では起きない振る舞いが現れました。", "unverified": "ゲージ結合のもとで確率保存がスキーム自体でどこまで成り立つか（再規格化前の誤差の大きさ）は確認できなかった。"}}, {"id": "pr07", "rank": 7, "headline": "量子古典リウヴィル方程式のガウス・エルミート厳密閉包", "title": "Exact Gaussian--Hermite closure of the mapping quantum--classical Liouville equation", "url": "https://arxiv.org/abs/2610.16864", "authors": "Sahand Nikzat Ali Nassimi ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Nassimi, S. N. A., & Parai, R. M. (2026). Exact Gaussian--Hermite closure of the mapping quantum--classical Liouville equation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16864", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、結果の§IV.1–IV.3と表2、考察の§V）を読んだ。理論の導出（§II）と補足資料は要点のみ", "preprint": true, "p1": "写像表現の量子古典リウヴィル方程式（QCLE）の位相空間密度をエルミート関数で展開すると、厳密な動力学が有限で疎な方程式系に閉じることを示した（抄録、§V）。", "p2": "QCLEは小さな量子系と大きな古典的環境を扱うが解くのが難しい。写像表現で余剰の結合項を落としたポアソン括弧写像方程式（PBME）は独立な軌道で解けるが、負の占有数などの非物理的な結果が知られていた（§I）。", "p3": "すべての物理的な写像密度に共通するガウス因子のまわりで、写像変数への依存をエルミート関数で展開した。逆反作用の力は写像変数の2次式なので密度のエルミート次数を上げるが、余剰結合項はこの基底では純粋な上昇演算子として働き、力による上昇分をちょうど打ち消す（§V）。そのため厳密な動力学は初期より高い次数を生まない。", "p4": "Tullyの二重回避交差モデルを、入射運動量P₀の6つの領域で、係数方程式の直接伝播、部分系QCLEの4場ソルバー（RK4）とStrang分割、完全量子の参照解、PBMEの軌道計算で解き、状態2の最終占有と運動量分布を比べた（§III、表2）。", "p5": "4次の成分は全時刻で厳密にゼロのままで、物理的部分空間の残差は3.3×10⁻¹⁰以下だった（§IV.1）。係数伝播とRK4の解は最終占有で7.4×10⁻¹⁰以内で一致した（§IV.2）。QCLEの量子からの誤差はP₀=20で最大0.0054、P₀=100で7.3×10⁻⁶だった（§IV.3）。PBMEの誤差はQCLEの誤差の9.5〜73倍（表2の示された行）で、運動量分布もすべての領域で歪んだ（§V）。", "p6": "物理的な初期値からの厳密な動力学では、係数方程式は部分系QCLEに新しい内容を加えず計算も重い（§V）。検証は1つのモデル系に限られる。P₀=20では占有の誤差が小さくても運動量分布は質的に誤っており、占有だけの比較は誤差を隠しうると著者は指摘する（§V）。", "fun": "量子の世界と古典の世界をつなぐ方程式には、無視されがちな「おまけの項」があります。この研究は、うまい関数の組（エルミート関数）で書き直すと、その項が「複雑さを1段上げる力」をぴったり打ち消す役割をしていることを見つけました。おまけを捨てた近似ではこの打ち消しが起きず、複雑さがどんどん増えて誤差が膨らむのです。", "unverified": "表2のP₀=40・70・100の行の誤差比と、運動量分布の距離の全領域の値は一部しか確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "生成AI後に欧州のAI失業不安は下がった", "title": "Less Afraid, Still Wary: Europeans’ Fear of AI-Driven Job Loss Before and After Generative AI", "url": "https://doi.org/10.21203/rs.3.rs-11310378/v1", "authors": "Amit Vishwakarma ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Vishwakarma, A., & GUNEJA, R. K. (2026). Less Afraid, Still Wary: Europeans’ Fear of AI-Driven Job Loss Before and After Generative AI. https://doi.org/10.21203/rs.3.rs-11310378/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（データ・測定・分析手順の§3、結果の§4.3–4.6と表6・7、限界と結論の§5.6）を読んだ", "preprint": true, "p1": "生成AIの登場後、EU27か国でAIによる失業への不安はむしろ下がり、職場では不安より「便益の実感」がAIの受容を左右していることを、2時点の大規模調査で示した（§4.3、§4.5）。", "p2": "生成AIが仕事に入り込んだことで失業不安が強まったかは不明で、デジタルスキルや雇用主の実践（研修・透明性）が不安と受容にどう関わるかも、生成AI前後で比べた研究がなかった（§2.6）。", "p3": "ユーロバロメーターの2017年（26,555人）と2024年（26,404人）の確率標本を用い、脅威（2項目）・デジタル技術の評価・スキル・便益・職場ルールへの支持を順序尺度のCFAで測り、年間の測定不変性を確認したうえで構造方程式モデル、国の固定効果回帰、人工ニューラルネットで分析した（§3.2–3.4）。", "p4": "年の差は潜在的な脅威の標準偏差単位で表し、国内の変化は固定効果で比べ、失業率の寄与を推定した。従業員モデルで6つの仮説（スキル→脅威、透明性→脅威、研修→受容、便益→受容、脅威→受容、脅威→ルール支持）を検定した（§4.3–4.5）。", "p5": "潜在的な脅威は2024年に0.28 SD低く（95%信頼区間−0.31〜−0.24）、EUの失業率低下2.3ポイントが説明するのは約8分の1だった（§4.3）。スキルと脅威の直接の関係は2017年β=−0.09から2024年β=0.06へ反転した（表6）。従業員では透明性が脅威を下げ（β=−0.205）、便益（β=0.636）が受容を最も強く高め、脅威はルール支持を高めた（β=0.332）（表7）。ANNでも脅威の予測は難しかった（検定R²=0.05）（§4.6）。", "p6": "2時点の横断データで、不安が下がった理由も生成AIの効果も分離できない（§5.6）。研修・透明性は単一項目で、同じ面接での回答による共通方法分散の恐れがある（§5.6）。解釈：スキルと脅威の正の関係は抑制効果によるもので、職業別のAI曝露との結合での確認が必要とされる。", "fun": "ChatGPTが登場して「仕事を奪われる」という不安は強まったと思いがちですが、ヨーロッパではむしろ和らいでいました。面白いのは、デジタルに強い人ほど以前は安心していたのに、今は少し不安を感じていることです。AIで何ができるかがよく見える人ほど、身構えるのかもしれません。会社がAIの使い方を正直に説明するだけで不安が下がる、というのも実務的な発見です。", "unverified": "各国別の変化の大きさと、付録の表S3〜S6の数値は確認できなかった。"}}, {"id": "pr09", "rank": 9, "headline": "米国の複雑性辞書は英国の年次報告書に通用するか", "title": "Jurisdictional Portability of Text-Based Firm Complexity Measures: Evidence from UK Annual Reports", "url": "https://doi.org/10.2139/ssrn.7607636", "authors": "Ekaete Efretuei ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Efretuei, E., Zhang, F., Healy, J., Zhao, Y., & Gregoriou, A. (2026). Jurisdictional Portability of Text-Based Firm Complexity Measures: Evidence from UK Annual Reports. https://doi.org/10.2139/ssrn.7607636", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず（403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の開示書類で作られた企業の複雑性の辞書（Loughran & McDonald）が、英国の年次報告書でもそのまま使えるかを検討し、英国向けに較正した探索的な辞書を示した（抄録）。", "p2": "ある報告制度で作ったテキスト指標は、企業そのものの性質だけでなく、その国の書き方の慣習も反映しうる。そのため国をまたぐ研究や規制監視に使えるかは確かめられていなかった（抄録）。", "p3": "2017〜2024年の英国の1,805報告書年で、米国の53語の辞書の使用状況を先行研究の米国の基準値と比べた。さらに米国の語を種に、ブートストラップで選択頻度を数えるLASSOで、英国向けの40語の辞書を導いた（抄録）。", "p4": "選択段階で使った3つの結果変数（監査報酬、予期せぬ利益の絶対値、決算発表後のリターンの変動性）で、年固定効果と企業クラスタの標準誤差つき回帰により、2つの辞書を同じ標本で比べた（抄録）。", "p5": "米国の53語のうち英国版に入ったのは16語だけだった。英国の標本では両方の指標が監査報酬と正に関連したが、リターンの変動性との関連は統制後に弱まり、予期せぬ利益とはどちらも頑健に関連しなかった（抄録）。", "p6": "米国の書類単位のデータと先行分析は再現しておらず、期間（米国1996〜2021年）も異なるため、国間の比較は記述的にとどまる。英国の辞書は結果変数を使って作り同じ標本で評価しているので、独立・標本外の検証ではないと著者自身が明記している（抄録）。", "fun": "「複雑な会社ほど報告書に難しい言葉が多い」という考えで作った単語リストは、国が変わると通用しないかもしれません。英国の報告書で試すと、米国の53語のうち残ったのは16語だけでした。言葉の使い方には国ごとのくせがあり、それを企業の性質と取り違えないよう注意が要る、という教訓が面白い点です。", "unverified": "回帰係数の大きさ、英国版の40語の具体的な中身、使用状況の比較の数値は確認できなかった。"}}, {"id": "pr10", "rank": 10, "headline": "検証の単位が異常会計発生高の基準を変える", "title": "When Validation Defines Abnormality: Prediction Targets in Bayesian Accrual Measurement", "url": "https://doi.org/10.21203/rs.3.rs-10834137/v1", "authors": "Quan Pham", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Pham, Q. (2026). When Validation Defines Abnormality: Prediction Targets in Bayesian Accrual Measurement. https://doi.org/10.21203/rs.3.rs-10834137/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（データ・推定の§3、結果の§4.2–4.3、考察の§5と表3・4の説明）を読んだ。§2の理論整理は要点のみ", "preprint": true, "p1": "「正常な会計発生高」をベイズ・スタッキングで選ぶとき、交差検証で何を取り除くか（企業年か企業ごとか）だけで基準モデルが変わり、異常発生高の上位の顔ぶれまで変わることを示した（§4、§5）。", "p2": "異常発生高は「正常なふるまい」の推定からの残差として測られるが、同じ企業が何年も現れるデータでは、予測の検証方法そのものが測定の基準を決めてしまう可能性が見過ごされてきた（§1、§2）。", "p3": "ベトナムのHOSE・HNX上場企業（568社、2017〜2024年、主分析4,494企業年）で、ジョーンズ型・修正ジョーンズ・Dechow-Dichev型など複数の会計的な基準モデルを、企業の変量切片あり・なしの両方でStudent-t尤度のベイズ推定し（式3）、正確なK分割交差検証の重みでスタッキングした（§3.1–3.2）。モデル空間・推定・採点規則は固定し、保留単位だけを「企業年」と「企業ごと」で変える。", "p4": "基準モデルへの重みの配分、異常発生高の順位相関、上位5%の集合の重なり（ジャカード係数）、不確実性で割った版、フォールド内前処理での頑健性、上位に入れ替わった企業年のその後の業績を比べた（§3.3–3.4、§4）。", "p5": "企業年単位の検証は企業変量効果のモデルに重み0.5927を与え、企業単位の検証では0.0368だった（表3）。順位相関は0.83前後と高いが、上位5%の225件のうち共通は184件（ジャカード0.6917）で、不確実性で割ると133件（0.4196）まで下がった（表4、§4.2）。企業単位の検証だけで上位に入る企業年は、その後のROAが高かった（係数0.0396）（§4.3）。", "p6": "どちらの検証が普遍的に正しいとは主張しておらず、異常発生高が経営者の意図を直接示すわけでもない（§5）。データはベトナム市場に限られ、ライセンスのため再配布できない（§3.1）。解釈：異常投資など他の残差型の指標にも同じ問題が及ぶという指摘（§5）は広く重要である。", "fun": "「普通はこれくらい」という基準を決めて、そこから外れたものを「異常」と呼ぶやり方は、会計不正の発見などでよく使われます。この研究は、その基準を選ぶときの「テストの仕方」を少し変えるだけで、異常と判定される会社がかなり入れ替わることを示しました。全体の順位はほぼ同じなのに、いちばん怪しい上位だけが大きく変わるのが落とし穴です。", "unverified": "シミュレーションと制限モデルによる機構の確認（§3.4）の具体的な結果は確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "ARMAスペクトル密度をピークごとに厳密分解", "title": "Decomposing the spectral density function of an ARMA process", "url": "https://arxiv.org/abs/2610.14384", "authors": "Darlin Soto-V\\'asquez ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Soto-Vásquez, D., Cuevas-Pacheco, F., Motta, G., & Sobolewska, M. (2026). Decomposing the spectral density function of an ARMA process (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14384", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、分解の§3の命題の要点、数値実験の§5の設定と要約、応用の§6と表8）を読んだ。付録の証明は未読", "preprint": true, "p1": "測定誤差つきのARMA過程のスペクトル密度を、自己回帰根の共役類ごとの実数値の成分に厳密に分解し、各ピークの位置・高さ・幅・非対称性を閉形式で与えた（§1、§3）。", "p2": "準周期振動の解析では、ピリオドグラムを推定してからローレンツ関数を当てはめる2段階法が標準だが、推定とモデル化が分離して効率を失い、不確実性の扱いも一貫せず、測定誤差も入れにくい（§1）。既存の離散時間の分解はp>qに限られ、複素数のままでピークの記述量もなかった（§1）。", "p3": "ARMA(p,q)のスペクトル密度を、実根ごとのラップド・コーシー核（ポアソン核）と、複素共役対ごとのラップド・コーシー核＋反対称な共役ポアソン項、q≥pのときの多項式項に分ける（命題1）。共役ポアソン項がピークを傾けるので、最大点は根の偏角α/(2πΔ)からずれる。そのずれ・半値幅・非対称度を閉形式で求め（命題2–3）、分散も項ごとに分解する。推定はカルマンフィルタによる最尤法で、記述量は差し込みで得る（§4）。", "p4": "鋭い根・広い根・実根を含む3つのモデル（M1：AR(2)、M2：AR(4)、M3：ARMA(3,2)）のシミュレーションで、閉形式のピーク位置を、根の偏角による「名目の中心」と数値的な最大化、2段階法と比べた（§5）。応用はX線連星XTE J1550-564の光度曲線（n=1000）である（§6）。", "p5": "閉形式は名目の中心より真のピーク位置に近く、その割合はM1で90.5%、M3で99.8%、M2の2つの類で70.1%と73.4%だった（§5）。名目の中心からのずれは鋭い類で10⁻³程度、広い類で10⁻²程度だった（表3の説明）。応用ではARMA(3,2)が約2.816 Hzの主要な準周期振動を再現し、全パラメータの95%信頼区間が0を含まなかった（表8）。", "p6": "AICとBICの上位モデルは主要なピークを再現できず、ピークを再現する最小のモデルを選んでいる（§6）。単純根の仮定（命題1）や等間隔標本の前提がある。解釈：減衰の大きい広いピークほど根の偏角で読む誤差が大きいという結果は、振動数の推定一般に注意を促す。", "fun": "揺れのデータから「どの周波数で振動しているか」を知るには、スペクトルという山並みの図を描き、山の頂上の位置を読みます。この研究は、統計モデルの係数から山の形を数式で正確に描けることを示しました。すると、これまで山頂だと思っていた位置（根の角度）が、なだらかな山ほど実際の頂上からずれていることが分かったのです。", "unverified": "2段階法との比較の全条件の数値と、応用での各成分の分散の内訳は確認できなかった。"}}, {"id": "pr12", "rank": 12, "headline": "モデル誤差に強い無香料PrOカルマンフィルタ", "title": "An Unscented PrO Kalman Filter", "url": "https://arxiv.org/abs/2610.14773", "authors": "Dan Kean ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Kean, D., Shen, Z., & Oates, C. J. (2026). An Unscented PrO Kalman Filter (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14773", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（背景の§2、手法の§3、実験の§4、考察の§5）を読んだ。付録の実験条件の詳細は未読", "preprint": true, "p1": "モデルが誤っていても過信しない「予測志向（PrO）フィルタ」を、無香料変換（シグマ点）で非線形系に広げ、強い非線形性の下でも較正された推定を保てるようにした（§3、§4.2.3）。", "p2": "ベイズ型のフィルタはモデルが誤っているとき過度に自信のある推定を出す。PrOフィルタはこれを防ぐが、既存の非線形版（EKF-PrO）は1点でのヤコビアンによる線形化に頼り、非線形性が強いと失敗する（§2.2、§2.4）。", "p3": "PrOの損失は、ベイズの「対数尤度の期待値」と逆に「予測分布の尤度の対数」を取る（式6）。これは予測分布と真のデータ分布のKLダイバージェンスを最小にすることに当たる（式7）。予測ステップだけをシグマ点で計算する版（UKF-PrO、立方体則の特別な場合がCKF-PrO）と、更新ステップもシグマ点で計算する版（UKF-PrO+、平均と共分散の同時最適化が必要）を作った（§3.2–3.3）。", "p4": "60次元のローレンツ96モデルで、真の系は隠れたマルコフ連鎖で強制項が切り替わる（フィルタはそれを知らない）という誤指定を与え、標準・高雑音・強非線形（2sin(10x)を追加）の3条件を各100シードで試した。指標はフィルタ平均の二乗誤差（MSE）と、過信を強く罰する真の状態の負の対数尤度（NLL、主指標）である（§4.1–4.2）。", "p5": "どの条件でもPrO系は従来のEKF・UKF・CKFより大きく改善した（§4.2.1–4.2.2）。強非線形では、EKF-PrOのMSEはCKF-PrOの約3.3倍、NLLは約27倍で、100シードすべてでCKF-PrOが勝った（§4.2.3）。既定パラメータのUKF-PrOはNLLが最小だがMSEはCKF-PrOの約3.9倍だった（図2）。更新ステップまで変えたCKF-PrO+は改善せず（MSE 1038.8対825.6）、計算は約7倍かかった（表4）。", "p6": "観測関数の非線形性が強い場合はまだ調べていない（§4.3）。シグマ点の広がりのパラメータで結果が大きく変わるため、選び方が重要である（§5）。解釈：粒子フィルタなど高次元に弱い手法との比較は省かれている（§4.1）。", "fun": "天気予報のような計算で、モデルが現実と少し違っていると、従来の方法は「自信満々に外す」ことがあります。この方法は、予測の当たり具合そのものを最適化することで、自信の大きさを現実に合わせます。さらに、1点で傾きを測る代わりに、分布の広がりの何点かで実際に計算してみる工夫で、曲がりくねった系でも破綻しにくくなりました。", "unverified": "条件1・2での各手法のMSE・NLLの具体的な数値（図3・4）は確認できなかった。"}}, {"id": "pr13", "rank": 13, "headline": "社会力学に導かれたLLMチームのペルソナ再配役", "title": "Agent Sociodrama: Social-Dynamics-Guided Persona Recasting for LLM Agent Teams", "url": "https://arxiv.org/abs/2610.15788", "authors": "Yirui Qi ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Qi, Y., Zhang, X., & Yoon, J. (2026). Agent Sociodrama: Social-Dynamics-Guided Persona Recasting for LLM Agent Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15788", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（枠組みの§3、配役制御器の§4、実験の§5.2–5.3と表1・3・4の説明、図7の事例）を読んだ。付録の全結果表は未読", "preprint": true, "p1": "LLMエージェントのチームで、感情と相手への関係（好意度・同盟/敵対）の変化を毎ラウンド記録する「Agent Sociodrama」を作り、その軌跡からチームの失敗を診断して性格（ペルソナ）を配役し直すと協働の成績が上がることを示した（§3–4、§5.3）。", "p2": "LLMエージェントのチームは、情報をもつ者が黙る、声の大きい者が誤答に引っ張る、規範違反が罰されないといった「社会的な」失敗をするが、既存の多エージェント研究は関係を固定するか明示的に扱っていなかった（§1、§3）。", "p3": "各エージェントは固定のペルソナ、感情価S∈[0,1]、他者ごとの有向の関係（好意度fav∈[−1,1]、中立・同盟・ライバル・敵の状態、記憶）をもち、見えた出来事から外部のLLM審査役が毎ラウンド更新する（式1–2）。配役制御器は、バランス型・支配型・分析型・協調型・控えめ型の5類型から、成績・発話記録・SとRの軌跡をLLMが診断し、多数決で最大3回まで配役を変える（§4）。", "p4": "6つのLLMで5つの社会的場面を各5回走らせ、終盤の好意度・E-I指数・構造的均衡・修復率・相互性の一貫性と、人の評定者13人との一致を見た（§5.2）。協働課題は隠れたプロフィール課題、NASA月面サバイバル、Lost at Sea、太陽光発電所の交渉の4つで、SOTOPIA・AgentVerseと比べ、SとRの更新を除いた版とも比べた（§5.3）。", "p5": "対立の強い場面ほど終盤の好意度は0.75から0.23に下がり、修復率は58.5%から18.9%に落ちた（§5.2）。人の多数（13人中7人以上）が一致した項目では、LLM審査役の判定が関係の更新の76.2%、感情の更新の88.2%と一致した（§5.2）。配役し直しで、GPT-5-miniの隠れたプロフィール課題の正答率は16.7%から100.0%に上がった（§4、§5.3）。交渉ではSとRの更新を除くとパレート効率的な合意率が48.6%から27.8%に下がった（§5.3）。", "p6": "人どうしの一致も低く（関係でFleissのκ=0.288）、社会的な変化の判定はそもそも曖昧である（§5.2）。状態の更新も診断もLLMに依存している。解釈：類型は5つに限られ、配役の探索は最大3回なので、最適な配役の保証はない。", "fun": "会議がうまくいかないとき、原因は個人の能力より「誰が黙り、誰が場を支配したか」という人間関係にあることが多いものです。この研究はAIのチームでも同じことが起きると見て、AIたちの気分や相手への好き嫌いの変化を記録し、それをもとに配役を変えました。同じAIでも性格の割り当てを変えるだけで、正答率が16.7%から100%になったのは驚きです。", "unverified": "表3の課題・モデルごとの全結果と、最大の改善幅83.3ポイントが出た条件の詳細は確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "出会いを再現する都市スケールの人流生成", "title": "Encounter-Driven City-Scale Human Mobility Generation with Large Language Models", "url": "https://arxiv.org/abs/2610.17672", "authors": "Chao Li ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Li, C., Jiang, R., Xiao, C., & Wang, J. (2026). Encounter-Driven City-Scale Human Mobility Generation with Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17672", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定・評価法の§3–4、手法の§5、実験の§6.1–6.3、結論）を読んだ。表2・3の数値表と付録は未読", "preprint": true, "p1": "LLMで都市の人の1日の移動を生成するとき、個人の移動の自然さだけでなく、「誰と誰が、いつ、どこで居合わせるか（出会い）」の構造まで再現できるようにした（§3、§5）。", "p2": "既存のLLMによる移動生成は住民ごとの日課を作ることに集中しており、個々の軌跡が自然でも、それらが重なって生まれる出会いの構造は再現されない（§1、§4）。", "p3": "EncounterMobは2段階からなる。まず過去の出会いと住民の行動プロフィールから、当日の出会いの量と時間帯・施設種別の分布（都市の出会いのリズム）をLLMが推定し、具体的な参加者・時刻・施設の組に落とす（§5.1）。次に、住民ごとに独立に作った軌跡から実際に生じる出会いと提案を比べ、LLMの批評役が過去の証拠に基づいて軌跡と提案の両方を最大K回修正する（§5.2）。", "p4": "Foursquareのチェックインから作った日本（1,049人）とニューヨーク（226人）のデータで、出会いの7指標（参加者集団・時刻・施設とその組合せの分布）と個人移動の6指標を、いずれもJensen-Shannonダイバージェンス（小さいほど良い）で、LSTM・拡散モデル・LLMob・ELLMobなどと比べた（§4、§6.1）。", "p5": "出会い7指標・個人6指標のすべてで外部の比較手法を上回った（§6.2）。ELLMobに比べ、参加者集団の分布の誤差を日本で46.2%、NYCで66.2%、参加者・時刻・施設の同時分布の誤差を40.4%・41.7%減らし、個人6指標の平均誤差も58.8%・32.7%減らした（§6.2）。反復結合を外すと個人指標の平均誤差が日本で53.1%悪化した（§6.2のアブレーション）。", "p6": "データはチェックインに基づく固定の住民集団で、実際の人流全体を表すわけではない（§6.1）。解釈：生成した出会いが現実の接触（感染や交流）をどこまで表すかは未検証で、より多様な移動環境への拡張は今後の課題とされる（§7）。", "fun": "街の人の動きを1人ずつそれらしく作っても、「同じカフェに同じ時間に誰がいるか」までは合いません。この研究は、先に「朝の駅、昼の食堂で人が集まる」という街全体のリズムを決め、それに合わせて一人ひとりの予定を調整しました。出会いをきちんと作ると、個人の動きまで自然になったという相乗効果が面白い点です。", "unverified": "表2・3の各指標の具体的なJSDの値と、使用したLLMの名称は確認できなかった。"}}, {"id": "pr15", "rank": 15, "headline": "気候災害が重なる農村の精神的健康の因果ループ", "title": "Under Pressure: Systems Modelling of Mental Health and Wellbeing in Rural Australia Amid Compounding Climate Hazards", "url": "https://doi.org/10.2139/ssrn.7604219", "authors": "Eryn Wright ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Wright, E., Jacobson, C., Richards, R., Hulme, A., Osborne, N. J., Henderson-Wilson, C., Patrick, R., & Charlson, F. (2026). Under Pressure: Systems Modelling of Mental Health and Wellbeing in Rural Australia Amid Compounding Climate Hazards. https://doi.org/10.2139/ssrn.7604219", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず（403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "干ばつや洪水などの気候災害が繰り返すオーストラリアの農村で、精神的健康を左右する仕組みを因果ループ図として描き、政策の介入点を示した（抄録）。", "p2": "繰り返す気候災害は農村の精神的健康に積み重なる負担をかけ、その影響は社会・経済・サービスの要因が絡み合って生じるのに、政策対応は分断的で短期的になりがちだった（抄録）。", "p3": "関係者への面接とグループ・モデル・ビルディング（参加者が一緒に因果関係の図を作る手法）を組み合わせた質的なシステム・アプローチで、気候ストレスから精神的健康までの部門横断の関係を因果ループ図（CLD）に表した。参加者は住民、サービス提供者、地域の関係者である（抄録）。", "p4": "未確認（抄録には参加者数や図の検証方法が書かれていない）。質的研究であり、数量的な比較や評価指標はない。", "p5": "社会的孤立、心理的苦痛、援助要請の減少を結ぶ自己強化型のフィードバック・ループが見いだされた。主な駆動要因は農業生産性の低下、経済的ストレス、人手不足、短期の資金によるサービスの中断で、文化的な障壁も利用を妨げていた。社会的結束と地域のリーダーシップは影響を和らげ、サービスと制度への信頼が関与と回復の重要な媒介となっていた（抄録）。", "p6": "未確認（抄録・本文を入手できず）。抄録の範囲では、1つの地域社会の事例であり、因果ループ図の関係は参加者の認識に基づくため、量的な強さは示されていない。", "fun": "「災害で落ち込む→人に会わなくなる→相談しなくなる→さらに落ち込む」という悪循環は、一つ一つの原因を見ていても気づきにくいものです。この研究は、住民や支援者が一緒に矢印の図を描くことで、その悪循環と、それを断ち切れそうな場所（地域のつながりや、制度への信頼）を見つけようとしました。", "unverified": "参加者数、ループの数、図の検証の方法は確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "多人数の話し合いを導くLLM進行役の自己学習", "title": "Learning to GUIDE the Group: Self-Learning LLM Facilitation Across Multi-Party Tasks", "url": "https://arxiv.org/abs/2610.16231", "authors": "Ziyi Liu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Liu, Z., Kuo, T.-S., Liu, J., Fu, D., Thain, N., & Qian, C. (2026). Learning to GUIDE the Group: Self-Learning LLM Facilitation Across Multi-Party Tasks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16231", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMの進行役が、課題ごとの専門プロンプトなしに、多様な話し合いを導く汎用の進め方を自分で学べることを示した（抄録）。", "p3": "専門家用LLM進行役で導いた人の話し合い432件から、LLMが戦略の手引きを作り、人の判断に合わせたLLM審査役（人の注釈者20名で較正）の評価で手引きを改良した。", "p5": "保留した会話で3つの専門進行役に対し61.4%の勝率を得た。実時間のオンライン実験では、成果を保ちつつ発言のしやすさを高め、対人摩擦を減らし、発話数を24.7%、語数を29.0%減らした（抄録）。", "fun": "会議の司会がうまい人は、場の空気を読みながら話を振ります。この研究では、AIが過去の話し合いの記録を読んで「司会のコツ集」を自分で書き、それを改良していきました。人が手作りした指示と同じくらい上手に、しかも短い言葉で場を回せたのが面白い点です。", "unverified": "心理的安全性の測り方と、実時間実験の参加者数・統計的検定の詳細は抄録からは確認できない。"}}, {"id": "pr17", "rank": 17, "headline": "多エージェント熟議を適応的に制御する", "title": "Learning Adaptive Deliberation Control for Reliable Recognition with Multi-Agent Language Models", "url": "https://arxiv.org/abs/2610.17840", "authors": "Yuan Liu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Liu, Y., Peng, H., Hu, F., Huang, L., & Cai, W. (2026). Learning Adaptive Deliberation Control for Reliable Recognition with Multi-Agent Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17840", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "複数のLLMが提案・反論・裁定を行う熟議の進め方を、状況に応じて切り替える制御器ADMAを学習させた（抄録）。", "p3": "課題モデル自体は固定し、品質・合意度・進捗を表す特徴から、提案・異議・裁定・調整の連続的な方策を学ぶ。法律・金融の推論で学習し、方策を更新せずに4つのテキスト・マルチモーダルの課題へ移した。", "p5": "Qwen3.5固定で、直接回答より6.2〜14.2ポイント、固定制御より2.8〜3.0ポイント正答率が上がった。ただしトークン量は中央値で14.3〜18.7倍、遅延は7.8〜16.5倍だった（抄録）。", "fun": "話し合いは長ければ良いわけではなく、意見が割れているときだけ議論を深めるのが賢いやり方です。この研究はAI同士の議論で「いつ反論し、いつまとめるか」を学ばせました。精度は上がる一方で、計算量が十数倍に増えるという代償もはっきり示しているのが誠実なところです。", "unverified": "Qwen3.6への移行で効果が課題依存になる点の詳細は抄録からは確認できない。"}}, {"id": "pr18", "rank": 18, "headline": "多エージェント討論で相手を選んで関与する", "title": "Beyond Answer Sharing: TrueMAD for Targeted Peer Engagement in Multi-Agent Debate", "url": "https://arxiv.org/abs/2610.18240", "authors": "Dezheng Bao ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Bao, D., Du, S., Huang, R., Yuan, Z., Sun, Y., & Yang, Y. (2026). Beyond Answer Sharing: TrueMAD for Targeted Peer Engagement in Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18240", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多エージェント討論（MAD）で、他者の答えを見せるだけでなく、特定の相手の推論に一対一で助言させる仕組みTrueMADを提案した（抄録）。", "p3": "答えの共有と自己修正の間に、支持・反論・改良・質問のいずれかで相手の推論に応じる段階を加える。パラメータ更新は不要で、既存の討論法に追加できる。", "p5": "AIME、GPQA-Diamond、TruthfulQAでQwen3-30B-A3Bを使い、通常の討論に比べエージェント単位で平均3.62ポイント、厳密な多数決で3.52ポイント精度が上がった（抄録）。", "fun": "クラスの話し合いで全員の答えを黒板に並べるだけだと、多数派に流されがちです。この研究は「あなたのこの部分はこう考えたら？」と一対一で返事をさせる仕組みを入れました。誰かに直接向き合うことで、正しい少数意見が埋もれにくくなるのが面白い点です。", "unverified": "改善の統計的な有意性の評価方法は抄録からは確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "証拠に応じて熟議の手順を切り替える", "title": "ECMR: Evidence-Aware Deliberation Control for Multi-Agent LLM Reasoning", "url": "https://arxiv.org/abs/2610.17869", "authors": "Yuan Liu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Liu, Y., Peng, H., Hu, F., Huang, L., & Cai, W. (2026). ECMR: Evidence-Aware Deliberation Control for Multi-Agent LLM Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17869", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "複数LLMの熟議で、同じ根拠の繰り返しを独立した確認と取り違える「意味的な偽の合意」を減らす制御器ECMRを提案した（抄録）。", "p3": "各段階で答えの集中度、根拠の多様性・独立性、矛盾、検証履歴、残り予算を要約し、提案・異議・検証・裁定・多様化・停止のどれを行うかを、予算つきの有限期間制御として選ぶ。", "p5": "MedQA、CaseHOLD、FinQAの9,000件で、正答率が62.1%から84.9%に、偽の合意率が40.7%から17.0%に下がり、根拠支持率が58.0%から88.7%に上がった（抄録）。", "fun": "5人が同じ意見でも、全員が同じネット記事を読んだだけなら証拠は1つです。この研究は、AI同士の議論で「みんな賛成」が本当に独立した確認かどうかを見分けようとします。多数決の落とし穴を数字で示した点が面白いところです。", "unverified": "トークン効率の比較の詳細と、医療分野の課題を含む評価の内訳は抄録からは確認できない。"}}, {"id": "pr20", "rank": 20, "headline": "ネパールの移民言説で人間に基づくペルソナ注釈", "title": "NepPlural: A Human-Anchored Benchmark for Persona Annotation in Nepali Migration Discourse", "url": "https://arxiv.org/abs/2610.15732", "authors": "Jinu Nyachhyon ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Nyachhyon, J., Khatiwada, A., & Timilsina, B. (2026). NepPlural: A Human-Anchored Benchmark for Persona Annotation in Nepali Migration Discourse (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15732", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "ネパールの若者の海外流出をめぐるYouTubeコメントで、社会文化的なペルソナを人が注釈した基準データNepPluralを作り、LLM注釈の信頼性を監査した（抄録）。", "p3": "2,148件のコメントを意図・動機・価値志向・感情の4軸と「ペルソナなし」で注釈し、母語話者3名による300件の基準集合（Fleissのκ≈0.55）でLLMの注釈を評価した。", "p5": "一括注釈ではモデル間一致がκ≈0.17、1件ずつではκ≈0.72に上がったが、母語話者がペルソナなしとした39%のコメントにもモデルは同じペルソナを付けた。棄権を許すと「ペルソナなし」のF1が0.79〜0.87に回復した（抄録）。", "fun": "AI同士の意見がそろっても、それが正しいとは限りません。この研究では、人が「特に意見はない」と判断したコメントにも、AIたちは仲良く同じ人物像を当てはめていました。「分からない」と言える選択肢を与えるだけで改善するのが、人間の調査票づくりとも通じる発見です。", "unverified": "4軸それぞれの一致度の内訳は抄録からは確認できない。"}}, {"id": "pr21", "rank": 21, "headline": "LLMは各国の時間の価値をどう見積もるか", "title": "A Global View of How LLMs Value Human Time", "url": "https://arxiv.org/abs/2610.18515", "authors": "Yifan He ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "He, Y., Goethals, S., Reusens, M., & Martens, D. (2026). A Global View of How LLMs Value Human Time (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18515", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "利用者の国だけを変えて、60分の約束の遅れにいくら補償すべきかを5つのLLMに尋ね、LLMが各国の人の時間をどう評価するかを193か国で比べた（抄録）。", "p3": "LLMの回答を、購買力平価の1人当たりGDP、平均所得、文献に基づく忍耐度指標と比較し、プロンプトの変化への頑健性も調べた。", "p5": "LLMは欧州に最も高い補償を、アフリカにはおおむね最も低い補償を勧め、GDPに照らすとアジアと南米の人の時間を過小評価していた（抄録）。", "fun": "「待たされた1時間の価値」は国によって違うのでしょうか。AIに国名だけを変えて聞くと、答える金額が地域ごとに大きく変わりました。AIが世界の格差の見方をそのまま覚えていて、代理人として行動するときに人を違う扱いにするかもしれない、という問いが面白い点です。", "unverified": "使用した5つのLLMの名称と補償額の具体的な数値は抄録からは確認できない。"}}, {"id": "pr22", "rank": 22, "headline": "機械ラベルの感情比較にプラットフォーム差は入るか", "title": "Is the Platform Part of the Measurement? A Protocol and Simulation Study for Cross-Platform Equivalence of Machine-Labelled Policy Sentiment", "url": "https://arxiv.org/abs/2610.16757", "authors": "Asad Ikram ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Ikram, A., & Haig, E. (2026). Is the Platform Part of the Measurement? A Protocol and Simulation Study for Cross-Platform Equivalence of Machine-Labelled Policy Sentiment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16757", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "SNSの感情分類の結果をプラットフォーム間で比べる前に、分類器が各プラットフォームで同じものを測っているかを検証する6段階の手順を示した（抄録）。", "p3": "心理測定の等価性の道具（一般化可能性理論、測定不変性、DIF、得点のリンキング）を、プラットフォームを調査モードとみなして機械ラベルに当てはめ、正解の分かるシミュレーションで検証した。", "p5": "500回の反復で、各プラットフォームの得点をそのまま合算した指標は約4分の1の日で集計感情の符号を誤り、測定関数で調整した指標では平均で60日に1日未満だった（抄録）。", "fun": "同じ体重計でも、床が柔らかいと値が変わります。SNSの「世論の感情」も、XとRedditで分類AIの測り方が違えば単純に比べられません。心理学のテスト理論を使って、その「床の違い」を補正しようという発想が面白いところです。", "unverified": "4プラットフォームでの本格的な適用は後続研究とされ、実データでの効果は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "確率的物理情報NNで確率境界値問題を解く", "title": "Physics-informed random neural architectures on compact boundaryless multiply connected manifolds for random-operator models in machine learning and uncertainty quantification", "url": "https://arxiv.org/abs/2610.14844", "authors": "Christian Soize", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Soize, C. (2026). Physics-informed random neural architectures on compact boundaryless multiply connected manifolds for random-operator models in machine learning and uncertainty quantification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14844", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "ランダムな作用素をもつ確率的境界値問題に対し、物理と共通の確率的な種で結ばれた確率的ニューラルネット（SPINN）を提案した（抄録）。", "p3": "コンパクトで境界のない多重連結多様体上のガウス場とポアソン点過程でニューロンの位置と疎な結合を作り、問題の確率的作用素と同じガウスの種で駆動する。PDE残差の損失は使わず、観測空間で負の対数尤度と分布の整合項を組み合わせて学習する。", "p5": "周期的な円筒面上の確率的楕円型問題で、モデルとデータが整合する場合と誤指定の場合を例示した（抄録）。", "fun": "材料の強さや地盤の固さは場所ごとにばらつき、方程式そのものがランダムになります。この研究は、ニューロンの配置や結合までランダムに作ったネットワークを、問題と同じ「サイコロ」で動かすという大胆な発想です。答えを一つでなく確率分布として出せるのが特徴です。", "unverified": "数値例での精度の具体的な数値は抄録からは確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "点教師の画像学習でGNSS測定品質を評価", "title": "Point-Supervised Visual Learning for GNSS Measurement Quality Assessment", "url": "https://arxiv.org/abs/2610.14822", "authors": "Weiwei Zhai ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Zhai, W., Yan, P., Wang, L., & Hsu, L.-T. (2026). Point-Supervised Visual Learning for GNSS Measurement Quality Assessment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14822", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "魚眼カメラの空の画像から、各衛星のGNSS観測が誤りかどうかを予測し、都市部の測位精度を上げる枠組みを示した（抄録）。", "p3": "差分GNSSの二重差分擬似距離残差から衛星の投影位置に自動で誤りラベルと重みを作り、点だけの教師で画像ネットワークを学習する。予測した誤り確率で重み付き最小二乗測位を行う。", "p5": "学習とは別の日の都市走行データで、4つのモデルとも二値の空の分割に比べ水平RMSEを29.51〜36.07%減らし、U-Netが最小の0.78 mだった（抄録）。", "fun": "ビルの谷間ではGPSの電波が壁に反射して、位置が数十メートルずれることがあります。この研究は、空を見上げるカメラ画像から「この衛星の信号は怪しい」とAIに見抜かせました。人が1枚ずつ塗り分けなくても、GNSS自身の誤差から教師データを作れるのが巧みな点です。", "unverified": "走行データの距離・時間と使用した受信機は抄録からは確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "フローマッチングで物理的にあり得る初期摂動を作る", "title": "Flow Matching for Physically Plausible Initial-State Perturbations in Dynamical Systems for Uncertainty Quantification", "url": "https://doi.org/10.2139/ssrn.7607514", "authors": "SIDDHARTH ROUT ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "ROUT, S., Haber, E., & Gaudreault, S. (2026). Flow Matching for Physically Plausible Initial-State Perturbations in Dynamical Systems for Uncertainty Quantification. https://doi.org/10.2139/ssrn.7607514", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "カオス的な力学系の予報で、物理的にもっともらしい初期値のばらつきを作る決定論的な2段階の枠組みを示した（抄録）。", "p3": "フローマッチングで学習した可逆なODE輸送写像でデータ分布をガウス潜在空間に写し、観測状態の潜在表現を摂動して物理空間に戻す。得られたアンサンブルを決定論的な予報モデルで伝播する。", "p5": "調和振動子、ロトカ・ヴォルテラ、ローレンツ63、浅水方程式、低解像度WeatherBenchで、確率的な比較手法と同等以上のCRPSを得た（抄録）。", "fun": "天気予報では、最初の状態を少しずつ変えて何通りも計算し、予報の幅を見ます。しかし適当に乱数を足すと、現実にはあり得ない大気の状態ができてしまいます。この研究は「ありそうな状態の地図」を学習してから、その上でずらすという工夫をしました。", "unverified": "各系でのCRPSの具体的な数値は抄録からは確認できない。"}}, {"id": "pr26", "rank": 26, "headline": "生成的動力学でデータ同化のモデル誤差を扱う", "title": "Accounting for model error in ensemble variational data assimilation through learned generative dynamics", "url": "https://arxiv.org/abs/2610.17333", "authors": "Marc Bocquet ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Bocquet, M., Finn, T. S., & Cheng, S. (2026). Accounting for model error in ensemble variational data assimilation through learned generative dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17333", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "データ同化で、モデル誤差を加法的なガウス雑音とみなす代わりに、学習した生成的な確率予報で表す反復アンサンブルカルマンフィルタIEnKF-Gを提案した（抄録）。", "p3": "次の状態の条件付き分布を近似する生成モデルを、弱拘束4D-Varの1ステップ版に組み込み、アンサンブル変分法として実装した。複数時刻の窓をもつ平滑化版と簡略版も示した。", "p5": "確率的ローレンツ63と多重スケールのローレンツ96で、適応型EnKFやIEnKF-Qより概して精度が高く、部分観測でモデル誤差が大きいときに改善が大きかった（抄録）。", "fun": "天気予報のモデルは、雲の細かい動きなどを表せず、どうしても誤差が出ます。従来はその誤差を「ただのランダムなずれ」とみなしてきました。この研究はAIにその誤差のくせを学ばせ、観測と組み合わせました。見えない小さなスケールの影響を補う発想が面白い点です。", "unverified": "改善幅の具体的な数値は抄録からは確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "接触がスナップスルーに履歴依存性を生む", "title": "Contact-mediated asymmetric delay and rate memory in snapping beam pairs", "url": "https://arxiv.org/abs/2610.15119", "authors": "Gavin Linton ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Linton, G., Mahmoudirad, S., Pashine, N., & Pandey, A. (2026). Contact-mediated asymmetric delay and rate memory in snapping beam pairs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15119", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "接触する2本の細長い梁では、飛び移り座屈（スナップスルー）が載荷の速さと履歴に依存することを示した（抄録）。", "p3": "梁の対を繰り返し圧縮し、載荷・除荷の速度を変えて、接触中に一方が他方の上を滑らずに転がってから滑り、飛び移る挙動を観察した。", "p5": "速度によって載荷時に飛ぶ、除荷時に飛ぶ、詰まったままの3通りが選ばれ、除荷側は載荷速度の記憶をもった。ある圧縮量を超えると、圧縮を止めても飛び移り、その時間は閾値で発散した。最速の載荷で戻りを遅くすると1サイクルの散逸エネルギーが4倍に増えた（抄録）。", "fun": "ヘアピンをゆっくり押すか速く押すかで、パチンと跳ねるタイミングが変わる、というような現象です。2本の梁が触れ合うと、転がりと滑りの切り替わりが「どれだけ速く押されたか」を覚えてしまいます。単純な部品が記憶を持つように振る舞うのが面白い点です。", "unverified": "実験の梁の材料や寸法は抄録からは確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "表面粒状流の2つの例の理論", "title": "Surface Granular flows: Two Related Examples", "url": "https://arxiv.org/abs/2610.14592", "authors": "Devang V. Khakhar ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Khakhar, D. V., & Orpe, A. V. (2026). Surface Granular flows: Two Related Examples (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14592", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ（短い抄録）", "preprint": true, "short": true, "p1": "表面を流れる粒状体について、一点から注いでできる山と回転円筒の2つの代表的な系を比べた（抄録）。", "p3": "これらの流れを解析する連続体モデルを概観し、準2次元の系での実験結果を示した。", "p5": "両方の系の実験結果は連続体モデルでよく説明された（抄録）。", "fun": "砂を一点に注ぐと山ができ、表面を薄い層が流れ落ちます。砂時計やセメントミキサーでも同じような表面の流れが起きます。粒の集まりなのに、水のような連続した流れとして式で書けるのかという問いが、この分野の面白さです。", "unverified": "抄録が短く、比較したモデルの種類や実験条件は確認できない。"}}, {"id": "pr29", "rank": 29, "headline": "剛体球ボルツマン衝突階層を一つの頂点から導く", "title": "One vertex generates the hard-sphere Boltzmann collision hierarchy", "url": "https://arxiv.org/abs/2610.17123", "authors": "I. Karlin", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Karlin, I. (2026). One vertex generates the hard-sphere Boltzmann collision hierarchy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17123", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "剛体球のボルツマン方程式の衝突項を表す無限の係数テンソルが、ただ一つの基本法則（2階の応力生成頂点S）から生成されることを証明した（抄録）。", "p3": "あらゆる多項式の衝突頂点が、Sから普遍的な微分とテンソル演算の有限回の操作で得られ、従来の衝突括弧も微分で導かれることを示した。", "p5": "マッハ5の衝撃波での8次の盲検試験が、独立な衝突サンプリングと一致した（抄録）。", "fun": "気体分子のぶつかり合いを記述する式には、次数ごとに新しい係数が無限に現れると考えられてきました。この研究は、それらがすべて一つの基本的な規則から機械的に作れることを示しました。複雑に見えたものの中に、ただ一つの種が隠れていたという発見が面白い点です。", "unverified": "証明の前提条件と計算コストの比較は抄録からは確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "双曲幾何を使ったH2最適な縮約モデル", "title": "$H_2$-optimal model order reduction using hyperbolic geometry", "url": "https://arxiv.org/abs/2610.16249", "authors": "Andrea Angino ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Angino, A., Dózsa, T., & Voigt, M. (2026). $H_2$-optimal model order reduction using hyperbolic geometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16249", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "線形時不変系の縮約モデルを、安定性を保ったままH2最適に求める方法を双曲幾何を使って示した（抄録）。", "p3": "H2空間のマルムクィスト・タケナカ直交展開と双曲幾何の関係から平衡関数を作り、その零点が最適な縮約モデルの極になることを示した。ポアンカレ円板の積の上で、双曲測地線に沿ったニュートン法で解く。", "p5": "離散・連続時間のベンチマークで、広く使われるIRKAが不安定な縮約モデルを出す例でも、提案法は反復中ずっと安定性を保った（抄録）。", "fun": "大きな機械や建物の振動モデルを、小さなモデルに縮める技術があります。よく使われる方法は、縮めた結果が勝手に暴走する（不安定になる）ことがありました。この研究は、円の中に描く非ユークリッド幾何を使って、計算の途中でも安定性を保証しました。", "unverified": "単入力単出力の系に限られ、多入出力系への拡張は抄録からは確認できない。"}}, {"id": "pr31", "rank": 31, "headline": "POD加速の高次マルチスケール法", "title": "POD-accelerated high-order multiscale method with corrected-basis reconstruction for transient multi-continuum problems", "url": "https://arxiv.org/abs/2610.17758", "authors": "Jiayuan Peng ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Peng, J., Dong, H., & Linghu, J. (2026). POD-accelerated high-order multiscale method with corrected-basis reconstruction for transient multi-continuum problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17758", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "き裂や不均質な多孔質体の過渡流れを表す多連続体モデルで、高次マルチスケール法を固有直交分解（POD）で加速した（抄録）。", "p3": "結合した均質化解のスナップショットからベクトル値のPOD空間を作り、ブロック系を射影する。2つの再構成法のうち一方は、修正基底をオフラインで準備し、オンラインでは線形結合だけで解を求める。誤差評価も導いた。", "p5": "2・3次元の不均質な例で、縮約解は元の高次マルチスケール解の精度と局所的な振動を保ちつつ、計算コストを大きく下げた（抄録）。", "fun": "岩盤の割れ目の中の水と岩の中の水は、違う速さで動きながら互いにやり取りします。細かい構造を全部計算すると時間がかかりすぎます。この研究は、よく現れる流れのパターンだけを残して計算を軽くし、それでも細かい揺らぎを再現しました。", "unverified": "計算時間の削減率の具体的な数値は抄録からは確認できない。"}}, {"id": "pr32", "rank": 32, "headline": "多孔質弾性体中を進む半無限水圧破砕", "title": "A semi-infinite hydraulic fracture propagating in a poroelastic medium", "url": "https://arxiv.org/abs/2610.14049", "authors": "Evgenii Kanin ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Kanin, E., Möri, A., Garagash, D., & Lecampion, B. (2026). A semi-infinite hydraulic fracture propagating in a poroelastic medium (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14049", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "透水性のある多孔質弾性体を進む水圧破砕の先端付近の連成問題を、一定速度で動く半無限き裂として解いた（抄録）。", "p3": "線形多孔質弾性、線形弾性破壊力学、き裂内の潤滑理論を連成し、き裂開口と流体変位関数を未知数とする非線形系を解いた。無次元透水係数、有効拘束応力など4つの無次元量で整理した。", "p5": "解は先端近くの排水・靭性支配の漸近解から、遠方の非排水・貯留粘性支配の漸近解へ移る。単純化モデルとの比較から、多孔質弾性の効果が無視できる領域から完全連成が必要な領域まで4つの領域を区分した（抄録）。", "fun": "岩に水を押し込んで割るとき、水は割れ目の中だけでなく周りの岩にも染み込み、岩自体を押し返します。この研究は、その押し合いをすべて連成させて解き、どんな条件で簡単な計算では足りなくなるかを地図のように示しました。", "unverified": "各領域の境界の具体的な数値は抄録からは確認できない。"}}, {"id": "pr33", "rank": 33, "headline": "米国でインフレ会計が消えて40年の影響", "title": "Forty Years Without Inflation Accounting in the United States: Effects on Equity, Leverage, Depreciation and Intangibles", "url": "https://doi.org/10.5281/zenodo.23370492", "authors": "Freitas, Ruben Xavier de", "venue": "Zenodo", "date": "2026-10-14", "apa": "Freitas, R. X. de. (2026). Forty Years Without Inflation Accounting in the United States: Effects on Equity, Leverage, Depreciation and Intangibles. Zenodo. https://doi.org/10.5281/ZENODO.23370492", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoのワーキングペーパーの抄録を読んだ（未査読）", "preprint": true, "short": true, "p1": "米国でインフレ会計の開示が任意化されてから約40年、物価上昇が財務諸表のどこに隠れているかを測った（抄録）。", "p3": "BEAの固定資産勘定で現在原価と歴史的原価の減価償却を比べ、2009〜2025年のSEC XBRL開示で企業ごとの自己資本の修正係数を推計した。", "p5": "現在原価の減価償却は2025年に16%上回り、1986年以降の累計差は5.3兆ドル。非金融企業の自己資本修正係数の中央値は1.52で、修正後の負債資本比率の中央値は0.48から0.31に下がった（抄録）。", "fun": "40年前に買った機械を当時の値段で帳簿に載せ続けると、物価が約3倍になった今では、会社の本当の元手が小さく見えてしまいます。この研究は、帳簿に表れないインフレの影響を国全体と個々の企業で計算しました。「無形資産の価値」とされるものの一部が、実はただの物価のずれだという指摘が刺激的です。", "unverified": "審査を経ていない置き場の文書で、推計の前提の妥当性は抄録からは確認できない。"}}, {"id": "pr34", "rank": 34, "headline": "スタートアップが財務諸表を出すコスト", "title": "The Cost of Financial Disclosure for Start-Up Firms", "url": "https://doi.org/10.2139/ssrn.7607702", "authors": "Gregory Burke ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Burke, G., & League, R. (2026). The Cost of Financial Disclosure for Start-Up Firms. https://doi.org/10.2139/ssrn.7607702", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "スタートアップが財務諸表の開示を避けるために、資金調達をどれだけ早く打ち切るかから、財務開示の直接コストを推計した（抄録）。", "p3": "米国のクラウドファンディング規制（Regulation Crowdfunding）の募集で、更新財務諸表の提出期限直前に募集終了が急増することを示し、起業家の終了判断のモデルから開示コストの分布を推定した。", "p5": "開示義務は募集期間を合計で6.1%短くし、投資を約5,300万ドル減らした。発行者の70%は少なくとも6週間、18%は少なくとも20週間早く募集を閉じてでも開示を避けようとしていた（抄録）。", "fun": "お金を集めている途中でも、決算書を出す締め切りが近づくと募集をやめてしまう起業家が大勢いました。その行動の「やめ方」から、決算書を作って見せることがどれほど嫌なのか（コストなのか）を逆算したのが巧みな点です。", "unverified": "推定モデルの具体的な仮定とサンプル数は抄録からは確認できない。"}}, {"id": "pr35", "rank": 35, "headline": "監査上の主要な検討事項は投資家にリスクを伝えるか", "title": "Do Critical Audit Matters Provide Risk-emphasizing Information to Investors?", "url": "https://doi.org/10.2139/ssrn.7607861", "authors": "Hyunkwon Cho ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Cho, H., Choi, A., Kwon, S. Y., & Sonu, C. H. (2026). Do Critical Audit Matters Provide Risk-emphasizing Information to Investors? https://doi.org/10.2139/ssrn.7607861", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "拡張された監査報告書の「監査上の主要な検討事項（CAM）」で、監査リスクをどれだけ強調して書くかが株式市場の反応に関係することを示した（抄録）。", "p3": "自然言語処理でCAMの記述における監査リスクの顕著さを得点化し、10-K提出前後の市場反応や投資家のリスク認知との関係を調べた。", "p5": "リスクを強調したCAMほど市場の反応が強く、株価の変動性と出来高が下がり、投資家のリスク認知が低かった。追加分析は監査努力と財務報告の質の向上と整合的だった（抄録）。", "fun": "監査人が「ここが要注意でした」と書くと、投資家は不安になりそうです。ところが、リスクをはっきり書いた報告ほど、かえって株価の揺れは小さくなっていました。きちんと調べたことが伝わると安心につながる、という逆説的な結果が面白い点です。", "unverified": "サンプルの期間・企業数と効果の大きさは抄録からは確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "LLMで気候シナリオの財務影響開示を抽出し価格を検証", "title": "Mind the Gap: LLM Extraction of Climate Scenario Financial-Impact Disclosures and Their Pricing in Hong Kong Equity and Credit Markets", "url": "https://doi.org/10.2139/ssrn.7608119", "authors": "Fuli Yang", "venue": "SSRN", "date": "2026-10-13", "apa": "Yang, F. (2026). Mind the Gap: LLM Extraction of Climate Scenario Financial-Impact Disclosures and Their Pricing in Hong Kong Equity and Credit Markets. https://doi.org/10.2139/ssrn.7608119", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "香港の大企業140社の気候関連報告書から、気候シナリオの財務影響の数値をLLMで抽出し、市場が開示の差を価格に反映しているかを調べた（抄録）。", "p3": "ページの引用と型制約つきのLLM抽出で、2024〜2025年度の267報告書・42,192ページを数値データ化し、各ラベルを原ページと規則で照合した。株式と社債の市場反応を比べた。", "p5": "広い定義での定量開示は13.8%から34.3%に増えたが、厳密な定義では1.5%から6.6%にとどまった。シナリオに結びついた絶対額は267件中9件だけで、株式の反応に開示水準による差は見られなかった（抄録）。", "fun": "新しい規則で「気候変動でいくら損するか」を書くよう求められても、実際に数字で書いた会社はごくわずかでした。数万ページの報告書をAIに読ませ、その数字を一つずつ原文で確認した点が力技です。比べられる数字がないと、市場も反応しようがないという結論も示唆的です。", "unverified": "社債の分析は標本が小さく、効果を分離できないと著者自身が述べている。"}}, {"id": "pr37", "rank": 37, "headline": "モーメント変換による高次元混合データの異常検知", "title": "Moment-Based Anomaly Detection in High-Dimensional Mixed Data", "url": "https://arxiv.org/abs/2610.16285", "authors": "Davide Ferrari ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Ferrari, D., & Nicolodi, A. (2026). Moment-Based Anomaly Detection in High-Dimensional Mixed Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16285", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "数値とカテゴリが混ざった高次元データで、特徴量ごとに解釈できる異常度を出し、それをまとめる異常検知法MDIを提案した（抄録）。", "p3": "異なる型の特徴量を標準化したモーメント変換で共通の尺度にそろえ、特徴量間の相関を考慮して集約する。高次モーメントを使うため、平均のずれだけでなくばらつきや歪みの変化も捉える。", "p5": "シミュレーションと、マルチオミクスとESGの実データ2例で、有限標本の較正、検出性能、特徴量ごとの解釈性を評価した（抄録）。", "fun": "「怪しいデータ」は、値が極端なものだけではありません。ばらつき方や偏り方がふだんと違うだけの場合もあります。この方法は平均だけでなく分布の形の変化も見て、しかも「どの項目が怪しいのか」を説明できるのが便利な点です。", "unverified": "既存手法との性能比較の具体的な数値は抄録からは確認できない。"}}, {"id": "pr38", "rank": 38, "headline": "信用スコアで非線形モデルは割に合うか", "title": "Does Nonlinearity Pay off? An Out-of-Sample Validation of the Flat Maximum Eect in Credit Scoring", "url": "https://doi.org/10.2139/ssrn.7607979", "authors": "Jacopo Giacomelli", "venue": "SSRN", "date": "2026-10-14", "apa": "Giacomelli, J. (2026). Does Nonlinearity Pay off? An Out-of-Sample Validation of the Flat Maximum Eect in Credit Scoring. https://doi.org/10.2139/ssrn.7607979", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "信用スコアリングで、多項式の交互作用や比率を大量に作る非線形モデルが、単純な線形モデルより本当に良いのかを8つのデータで検証した（抄録）。", "p3": "総当たりの特徴量拡張、二重のトーナメント式モデル選択、変数を15個に制限するPost-LASSOを組み合わせ、相関するROC曲線のDeLong検定で標本外予測を比べた。", "p5": "特徴量の整っていない小口の債権データでは拡張で改善したが、会計データに基づく企業のデータでは性能が下がることもあった。15変数の制約を課すと、非線形モデルの性能は単純な線形の主効果モデルに近づいた（抄録）。", "fun": "複雑なAIほど当たる、とは限りません。統計の世界には「いくつかの良い変数があれば、モデルの細かな形はあまり関係ない」という平らな最大値の効果が知られています。この研究はそれが成り立つ条件を、データの成熟度で切り分けたのが面白い点です。", "unverified": "8つのデータの具体名とAUCの差の大きさは抄録からは確認できない。"}}, {"id": "pr39", "rank": 39, "headline": "産業グラフを使った住宅ローン信用リスクの生存分析", "title": "Discrete-Time Survival Modelling with Dynamic Industrial Graphs for Mortgage Credit Risk", "url": "https://arxiv.org/abs/2610.18795", "authors": "Shiqi Fang", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Fang, S. (2026). Discrete-Time Survival Modelling with Dynamic Industrial Graphs for Mortgage Credit Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18795", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "地理的に遠くても産業構成が似た地域どうしの住宅ローン延滞リスクのつながりを、毎年変わるグラフで表す離散時間生存モデルを提案した（抄録）。", "p3": "地域の産業構成の類似度で毎年グラフを作り直し、条件付き自己回帰過程と1次の自己回帰過程を組み合わせて、地域間の依存と時間的な持続を同時に表した。INLAで推定し、米国のローン単位データで評価した。", "p5": "動的なグラフのモデルは静的なグラフより標本内の当てはまりと標本外の判別力が良く、グラフによる地域間依存と時間的な持続が大きいことが推定された（抄録）。", "fun": "隣の町より、遠くても同じ産業で暮らす町のほうが、景気の波を一緒にかぶることがあります。この研究は「似た産業の町」を線で結んだ地図を毎年描き直し、ローンが返せなくなるリスクの広がりを捉えました。距離ではなく経済でつながる近所という見方が新鮮です。", "unverified": "判別力の改善幅の具体的な数値は抄録からは確認できない。"}}, {"id": "pr40", "rank": 40, "headline": "監査人の創造性は非定型の監査業務に役立つか", "title": "Creativity in Unstructured Audit Tasks: Benefit or Burden?", "url": "https://doi.org/10.2139/ssrn.7602078", "authors": "Martin Schmidt ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Schmidt, M., & Bonk, K. (2026). Creativity in Unstructured Audit Tasks: Benefit or Burden? https://doi.org/10.2139/ssrn.7602078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "ドイツのBig4監査法人の監査人70人の実験で、生まれつきの創造性と促された創造性が、定型でない監査課題の成績にどう影響するかを調べた（抄録）。", "p3": "架空の顧客の継続企業の可能性を評価する情報探索の事例を課し、創造的性格尺度で特性創造性を測り、逆説的な枠付けのプロンプトで状態創造性を刺激した。", "p5": "予想に反して特性創造性が高いほど成績は低かった。予想どおり、創造性の刺激は特性創造性が高い監査人の成績を上げ、低い監査人の成績を下げた（抄録）。", "fun": "「創造的な人ほど良い監査をする」と思いがちですが、結果は逆でした。そして、発想を促す声かけは、もともと創造的な人には効き、そうでない人にはかえって逆効果でした。同じ働きかけが人によって正反対に作用するのが面白い点です。", "unverified": "成績の測り方と効果の大きさは抄録からは確認できない。"}}, {"id": "pr41", "rank": 41, "headline": "企業のAI導入：文献とドイツのイノベーション調査", "title": "AI Adoption by Firms: Insights from the Literature and the German Innovation Survey", "url": "https://doi.org/10.2139/ssrn.7609621", "authors": "Gastón P. Fernández ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Fernández, G. P., Rammer, C., & Czarnitzki, D. (2026). AI Adoption by Firms: Insights from the Literature and the German Innovation Survey. https://doi.org/10.2139/ssrn.7609621", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "企業のAI導入に関する文献を概観し、ドイツのイノベーション調査の企業データで導入の特徴を調べた（抄録）。", "p3": "AI導入の要因、世界的な普及の傾向、自社開発と外部調達の違い、一般のAIと生成AIの違い、生産性への効果の研究を整理し、企業規模・年齢・研究開発集約度・人的資本・立地・戦略志向と導入段階・類型の関係を分析した。", "p5": "抄録には具体的な分析結果の数値は示されていない（抄録）。", "fun": "AIを使う会社と使わない会社の違いはどこにあるのでしょうか。大きさ、若さ、研究への投資、人材などで比べると、導入の段階や種類によって違いの出方が変わります。生成AIとそれ以前のAIで導入する会社の顔ぶれが違うのか、という問いが面白い点です。", "unverified": "ドイツ調査の分析結果の具体的な内容は抄録からは確認できない。"}}, {"id": "pr42", "rank": 42, "headline": "創業者の準備度と制度が中小企業の生成AI導入を左右", "title": "Founder Readiness and Institutional Fit: A Leadership-Contingent Model of Generative AI Adoption in Founder-Led SMEs in Switzerland and the United Kingdom", "url": "https://doi.org/10.20944/preprints202610.1325.v1", "authors": "Valeriia Yevsiukova", "venue": "Preprints.org", "date": "2026-10-14", "apa": "Yevsiukova, V. (2026). Founder Readiness and Institutional Fit: A Leadership-Contingent Model of Generative AI Adoption in Founder-Led SMEs in Switzerland and the United Kingdom. https://doi.org/10.20944/preprints202610.1325.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "創業者が経営する中小企業の生成AI導入を、創業者の準備度と国の制度の適合で説明する概念モデルを示した（抄録）。", "p3": "構造的・心理的な準備度と、外部専門知識の市場の厚さ、社内の権限委譲の規範、規制の明確さの3つの国の要因を組み合わせ、スイスと英国の4つの典型的な創業者像に当てはめた例示分析を行った。", "p5": "心理的準備度は乗数として働き、創業者の型によって有利な国が逆転した。規制差を除くと、学習志向と自己像の柔軟さの比が4対3を超えると英国が有利という閾値が導かれた（抄録）。", "fun": "同じ社長でも、国が違えばAI導入の得意不得意が入れ替わる、という主張です。外の専門家を雇いやすい国と、社内で任せる文化のある国では、合う社長のタイプが違うというのです。ただし実データではなく考え方の模型で、これから確かめる段階です。", "unverified": "実データによる検証はなく、4対3の閾値はモデルの仮定に依存する。"}}, {"id": "pr43", "rank": 43, "headline": "メール・チャット・通知の過多と認知的成果", "title": "Email, Instant Messaging, and Notification Overload: Assessing Their Effects on Workplace Cognitive Performance", "url": "https://doi.org/10.2139/ssrn.7601440", "authors": "Julius Berger ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Berger, J., & olalekan, j. (2026). Email, Instant Messaging, and Notification Overload: Assessing Their Effects on Workplace Cognitive Performance. https://doi.org/10.2139/ssrn.7601440", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ（叙述的レビュー）", "preprint": true, "short": true, "p1": "メール、チャット、通知の多さが職場での認知的な成果に与える影響を、認知心理学・HCI・組織行動の研究から叙述的に整理した（抄録）。", "p3": "注意の奪取、課題切り替え、注意の残り、中断からの回復、認知負荷、ストレスという仕組みに沿って研究を統合した。", "p5": "頻繁なメール確認はストレスを高めうる、チャットは課題の完了時間を延ばしうる、通知は操作しなくても注意を損ないうる、という知見をまとめ、まとめ送り・通知管理・集中時間の確保などを勧めた。研究の標本が小さく期間が短いことを限界とした（抄録）。", "fun": "スマホの通知は、見なくても鳴るだけで集中を乱すことがあるそうです。一方で、メールやチャットがなければ離れた人との仕事は回りません。悪者扱いするのではなく、どう付き合えば集中も協力も両立できるかを考える点が現実的です。", "unverified": "叙述的レビューで、効果量の統合的な推定は行われていない。"}}, {"id": "pr44", "rank": 44, "headline": "障害者包摂的な人事施策と職務well-being", "title": "Igniting the Light of Hope: How Disability-Inclusive HR Practices Enhance the Job Well-Being of Employees with Disabilities", "url": "https://doi.org/10.21203/rs.3.rs-10835607/v1", "authors": "Zonghua Liu ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Liu, Z., Li, S., Wu, L., Tu, T., Wang, K., & Wang, H. (2026). Igniting the Light of Hope: How Disability-Inclusive HR Practices Enhance the Job Well-Being of Employees with Disabilities. https://doi.org/10.21203/rs.3.rs-10835607/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "障害者を包摂する人事施策が、障害のある従業員の職務well-beingを高める経路を検証した（抄録）。", "p3": "資源保存理論に基づき、仕事での活力（thriving）を媒介、組織的支援の知覚を調整とするモデルを、2時点の対応づけた調査（267人）で検証した。", "p5": "包摂的な人事施策は仕事での活力を通じて職務well-beingを高め、組織的支援の知覚がその関係と間接効果を強めた（抄録）。", "fun": "障害のある人が働きやすい制度を作っても、それだけで幸福感が上がるとは限りません。この研究は、制度が「仕事で伸びている実感」を生み、それが幸福感につながる道筋を示しました。会社が支えてくれていると感じられるかどうかで効き目が変わるのが要点です。", "unverified": "調査対象の国・業種と効果の大きさは抄録からは確認できない。"}}, {"id": "pr45", "rank": 45, "headline": "がん介護者の情報負担と精神的健康", "title": "Cancer Information Burden and Mental Health Among U.S. Cancer Caregivers: Evidence from the Health Information National Trends Survey", "url": "https://doi.org/10.20944/preprints202610.1242.v1", "authors": "Jingjing Gao", "venue": "Preprints.org", "date": "2026-10-14", "apa": "Gao, J. (2026). Cancer Information Burden and Mental Health Among U.S. Cancer Caregivers: Evidence from the Health Information National Trends Survey. https://doi.org/10.20944/preprints202610.1242.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ", "preprint": true, "short": true, "p1": "米国のがん患者の介護者で、がん情報を得て理解することの負担が精神的苦痛と関係することを全国調査で示した（抄録）。", "p3": "米国立がん研究所のHINTS第6・7回を統合し、情報の入手の手間・理解の難しさ・探索中の不満・質への懸念の4項目で負担を測り、PHQ-4の苦痛との関係を調査重み付き回帰で分析した。", "p5": "241人ががん介護者と特定され、完全な共変量の分析には124人が含まれた。未調整の分析で負担が高いほど苦痛が大きく（β=1.57、95%信頼区間0.17〜2.98）、調整後も統計的に有意だった（抄録）。", "fun": "家族ががんになると、治療や副作用について調べることが山ほど出てきます。情報を集めて理解するのが大変だと感じる人ほど、気持ちが落ち込みやすいという結果です。病気そのものだけでなく、「調べる苦労」も介護の負担の一部だという視点が大切です。", "unverified": "調整後の係数の値は抄録の取得範囲が途中で切れており確認できない。"}}, {"id": "pr46", "rank": 46, "headline": "タイの高齢うつ病者と家族介護者のケア経路", "title": "Navigating the Depression Care Network in Primary Health Care: A Qualitative Study of Older Adults with Depression and Family Caregivers in Thailand", "url": "https://doi.org/10.20944/preprints202610.1237.v1", "authors": "Sumuttana Kaewma ほか", "venue": "Preprints.org", "date": "2026-10-14", "apa": "Kaewma, S., Muangnang, R., Khamwong, W., Pusopa, C., Sitthisongkram, S., Boonyaporn, T., Sukolpuk, M., Ubolyaem, D., Intasavas, T., & Plianbumroong, D. (2026). Navigating the Depression Care Network in Primary Health Care: A Qualitative Study of Older Adults with Depression and Family Caregivers in Thailand. https://doi.org/10.20944/preprints202610.1237.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ", "preprint": true, "short": true, "p1": "タイのうつ病の高齢者と家族介護者が、プライマリ・ヘルスケアのうつ病監視網をどうたどるかを質的に描いた（抄録）。", "p3": "タイの6地域で、うつ病と診断された高齢者60人と家族介護者12人（計72人）に半構造化面接を行い、質的内容分析で整理した。", "p5": "高齢者は症状を体の不調や老化とみなし、介護者は引きこもりや機能低下で気づいた。村の保健ボランティアと看護師の検診で入口はできるが、相談時間の短さ・偏見・連絡の分断が壁となり、紹介の断絶で治療継続の負担が介護者に移っていた（抄録）。", "fun": "お年寄りが「最近元気がない」のを、本人は年のせいだと思い、家族は様子の変化で気づきます。村のボランティアの検診で入口はできても、病院どうしのつながりが切れると、結局は家族が支え続けることになります。制度の隙間を家族が埋めている構図がよく見えます。", "unverified": "地域による違いの詳細は抄録からは確認できない。"}}, {"id": "pr47", "rank": 47, "headline": "スマートシティ影響指数で都市成長要因を評価", "title": "Empirical assessment of urban growth factors associated with smart city development using a smart city impact index", "url": "https://doi.org/10.21203/rs.3.rs-11014259/v1", "authors": "Nenavath Madhu Naik ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Naik, N. M., & Sahoo, M. M. (2026). Empirical assessment of urban growth factors associated with smart city development using a smart city impact index. https://doi.org/10.21203/rs.3.rs-11014259/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "インドのスマートシティ開発の良い影響と悪い影響を、環境・社会・ガバナンス・技術の指標からなる影響指数で評価した（抄録）。", "p3": "スマートシティの第1波（インフラ・治安・交通重視）、第2波（総合的な都市成長・管理）、非スマートシティの3群に指数を当てはめ、2022年と2023年の得点を比べた。", "p5": "第2波の都市が両年で最も高い順位だったが、第1波・第2波とも環境・社会・経済の次元では得点が低かった。平等と市民参加は向上した一方、透明性とプライバシーには否定的な認識が伴った（抄録）。", "fun": "「スマートシティ」と名乗れば暮らしが良くなるのでしょうか。インドの都市を比べると、総合的に進めた都市は評価が高い一方、環境や社会の面では課題が残りました。便利さと引き換えにプライバシーの不安が生まれる点は、どの国にも通じる問いです。", "unverified": "指数の重み付けと対象都市の数は抄録からは確認できない。"}}, {"id": "pr48", "rank": 48, "headline": "リアルタイム都市交通デジタルツインの通信", "title": "Semantic Edge-Cloud Communication for Real-Time Urban Traffic Digital Twins", "url": "https://arxiv.org/abs/2610.14187", "authors": "Murat Arda Onsu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Onsu, M. A., Dogru, A., Lohan, P., Kantarci, B., & Syed, A. (2026). Semantic Edge-Cloud Communication for Real-Time Urban Traffic Digital Twins (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14187", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "監視カメラの映像をそのまま送らず、車の軌跡などの意味情報だけを送ることで、都市交通のデジタルツインを実時間で同期させる仕組みを示した（抄録）。", "p3": "エッジ側のAIで課題に必要な交通情報を抽出し、クラウドに送ってデジタルツインを再構成する意味的通信の枠組みを作った。", "p5": "伝送量を99%以上削減し、軌跡の再構成誤差は平均0.12 mだった（抄録）。", "fun": "街中のカメラの映像を全部送ると、回線がパンクしてしまいます。そこで「どの車がどこをどの速さで走ったか」だけを送れば、仮想の街をほぼ同じように動かせます。映像ではなく意味を送るという発想で、通信量を100分の1以下にしたのが面白い点です。", "unverified": "評価に使った交通場面の規模とカメラ台数は抄録からは確認できない。"}}, {"id": "pr49", "rank": 49, "headline": "AI対応の決済サービスの体験と顧客ロイヤルティ", "title": "Digital Payment Experience and Customer Loyalty Toward AI-Enabled Mastercard Services in Bangladesh", "url": "https://doi.org/10.20944/preprints202610.1296.v1", "authors": "Nusrat Jahan Mim ほか", "venue": "Preprints.org", "date": "2026-10-14", "apa": "Mim, N. J., & Mannan, K. A. (2026). Digital Payment Experience and Customer Loyalty Toward AI-Enabled Mastercard Services in Bangladesh. https://doi.org/10.20944/preprints202610.1296.v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ", "preprint": true, "short": true, "p1": "バングラデシュのMastercard対応のAI決済サービスで、利用体験が顧客ロイヤルティにつながる経路を期待確認モデルで調べた（抄録）。", "p3": "385件の質問紙回答で、相対的優位性・期待される性能・取引の安全性・信頼から、満足と関係の質を経てロイヤルティに至るモデルを重回帰とブートストラップで検証した。", "p5": "体験の変数はロイヤルティの分散の21.1%を説明し、満足と関係の質を加えると24.7%になった。期待される性能が最も強い予測子（β=.207）だった。ただし3項目尺度の内的一貫性は.375〜.512と低く、著者も探索的な結果と位置づけている（抄録）。", "fun": "支払いアプリを使い続けるかどうかは、最初に選んだ理由より、使ってみて期待どおりだったかで決まる、という考え方です。この研究は、測定の物差しの信頼性が低いことを自ら認め、結果を控えめに扱っています。結果の弱さを隠さない姿勢も参考になります。", "unverified": "尺度の信頼性が低く、結果の妥当性は確認できない。"}}, {"id": "pr50", "rank": 50, "headline": "LLMはファイナンス・会計の査読をどこまでできるか", "title": "How Well Do LLMs Perform in Peer Review? Evidence from Finance and Accounting", "url": "https://arxiv.org/abs/2610.18435", "authors": "Hai Lu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Lu, H., Luo, Y., & Yu, L. (2026). How Well Do LLMs Perform in Peer Review? Evidence from Finance and Accounting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18435", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMが論文の査読のどの部分をこなせるかを、ファイナンスの学会報告論文のその後の掲載結果で検証した（抄録）。", "p3": "学習データが2024年の学会シーズン前で終わるGPT-4oに、2024年のAFAとNBERのファイナンス会合の論文を査読させ、その後2年間の上位3誌への掲載と比べた。", "p5": "モデルの評価が1標準偏差高い論文は、著者の評判を考慮しても掲載確率が44%高かった。情報は正しさと説明の判断から来ており、独創性と重要性の判断は情報を持たなかった。この区別は会計論文とGPT-5でも成り立った（抄録）。", "fun": "AIは論文が「正しく書けているか」は見抜けても、「大事な発見か」は判断できないという結果です。将来の掲載結果をAIが知らないことを確かめたうえでの検証なので説得力があります。技術的な確認はAIに、価値の判断は人に、という分担の提案が分かりやすい点です。", "unverified": "査読に使ったプロンプトの詳細と論文数は抄録からは確認できない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "拡散言語モデルの事前学習は思ったより安い", "title": "Revisiting the 16x Pretraining Compute Gap between Diffusion and Autoregressive Language Models", "url": "https://arxiv.org/abs/2610.17590", "authors": "Guanghan Wang ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Wang, G., He, B., Shi, Z., Dumoulin, B., Lu, H., & Kuleshov, V. (2026). Revisiting the 16x Pretraining Compute Gap between Diffusion and Autoregressive Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17590", "why": "広く引用された16倍の計算量差を、評価法と学習法の見直しで大きく縮めた。約1,700モデルの系統的な実験で、拡散型言語モデルの実用性の前提を変えうる。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "連続処置の差の差分法で利得による選別を測る", "title": "Measuring Selection on Gains in Difference-in-Differences with a Continuous Treatment", "url": "https://doi.org/10.2139/ssrn.7609700", "authors": "Parush Arora", "venue": "SSRN", "date": "2026-10-14", "apa": "Arora, P. (2026). Measuring Selection on Gains in Difference-in-Differences with a Continuous Treatment. https://doi.org/10.2139/ssrn.7609700", "why": "連続的な処置量の差の差分法で、傾向の差と利得による選別を分けて境界を与える。チャイナショックへの適用で、標準的な推定の解釈を見直す道具になる。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "繰り返し横断データでのイベントスタディの基礎", "title": "Pseudo-Panel Event Studies: Econometric Foundations for Credible Applications", "url": "https://arxiv.org/abs/2610.16754", "authors": "Dongwoo Kim", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Kim, D. (2026). Pseudo-Panel Event Studies: Econometric Foundations for Credible Applications (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16754", "why": "擬似パネルのイベントスタディの識別条件と推論を整備した。実パネルとの比較で妥当性を示し、横断調査しかない政策評価の標準手法になりうる。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIが労働者として応募・採用される労働市場", "title": "Displacement Is Endogenous: AI Workers in a Search-and-Matching Labor Market", "url": "https://arxiv.org/abs/2610.14850", "authors": "Ibrahim Denis Fofanah (Pace University ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Fofanah, I. D. (2026). Displacement Is Endogenous: AI Workers in a Search-and-Matching Labor Market (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14850", "why": "AIを求職者としてサーチ・マッチングモデルに入れ、解雇と採用減の経路を分けた。価格差が大きいほど企業拡大で失業が減るという非自明な結果を示す。"}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "上司の残業要求スタイルは部下に受け継がれる", "title": "The Reproduction of Managerial Styles in an Internal Labor Market", "url": "https://doi.org/10.2139/ssrn.7608640", "authors": "Yusuke Makino ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Makino, Y., & Yamaguchi, S. (2026). The Reproduction of Managerial Styles in an Internal Labor Market. https://doi.org/10.2139/ssrn.7608640", "why": "日本の大企業の人事記録で、管理職の残業要求の型が元上司から学ばれ、配置で固定されることを示した。組織文化の再生産を実データで捉えた。"}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "再現性を一つのベイズ枠組みで定量化する", "title": "The Quantification of Replicability", "url": "https://arxiv.org/abs/2610.14407", "authors": "Ester Alongi ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Alongi, E., Altoè, G., & Parmigiani, G. (2026). The Quantification of Replicability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14407", "why": "成功・失敗の二値判定に代わり、研究間の一致や共通効果との整合を事後確率で測る枠組み。再現性研究の評価基準を統一しうる。"}, {"id": "pn07", "rank": 7, "field": "統計学", "headline": "高次元線形モデルで制約数に適応する正直な検定", "title": "Honest Inference for High-Dimensional Linear Models", "url": "https://arxiv.org/abs/2610.16503", "authors": "Dennis Lim ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Lim, D., Min, P., Tan, J. H. W., & Wei, J. (2026). Honest Inference for High-Dimensional Linear Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16503", "why": "制約の数が固定でも発散してもよい頑健な検定を提案した。脱スパース化LASSOに基づき、高次元回帰での多重制約検定のサイズを改善する。"}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "自己蒸留の推論改善は本物か", "title": "Does self-distillation improve reasoning?", "url": "https://arxiv.org/abs/2610.18613", "authors": "Jason Ken Adhinarta ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Adhinarta, J. K., Wu, R., Sharma, A., Balakrishnan, A., Panda, R., Golland, P., Kim, Y., & Hong, Z.-W. (2026). Does self-distillation improve reasoning? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18613", "why": "話題の自己蒸留法の利得が未知問題に一般化せず、過学習などで説明されることを示した。手法の評価の見直しを迫る重要な追試。"}, {"id": "pn09", "rank": 9, "field": "教育", "headline": "エリート理系入試の男女差は受験準備環境で生じる", "title": "Gender Gap in High-stakes Exams: What Role for Exam Preparation?&nbsp;", "url": "https://doi.org/10.2139/ssrn.7606381", "authors": "Cecile Bonneau ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Bonneau, C., & Dousset, L. (2026). Gender Gap in High-stakes Exams: What Role for Exam Preparation?&nbsp; https://doi.org/10.2139/ssrn.7606381", "why": "フランスのエリート理系課程のデータで、選抜性の高い準備課程ほど男性が伸びることを準実験的に示した。上位職の男女格差の源を探る。"}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "社会的つながりが交絡するネットワークでの処置効果", "title": "Identification and Estimation of Treatment Effects from Network Data with Confounded Social Links", "url": "https://arxiv.org/abs/2610.14527", "authors": "Licheng Liu", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Liu, L. (2026). Identification and Estimation of Treatment Effects from Network Data with Confounded Social Links (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14527", "why": "処置採用とつながり形成が同じ要因に依存する場合の一般化傾向スコアを提案。ネットワークを周辺化した推定対象を定義し直した。"}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "予測市場の保有ポジション開示は影響力を生むが情報は増えない", "title": "Show Me Your Bet: Position Disclosure, Market Influence, and Strategic Communication", "url": "https://doi.org/10.2139/ssrn.7604779", "authors": "Yilan Li ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Li, Y., Markov, S., Wu, F., & Xu, Z. (2026). Show Me Your Bet: Position Disclosure, Market Influence, and Strategic Communication. https://doi.org/10.2139/ssrn.7604779", "why": "Polymarketの規則変更を使い、ポジション開示が大口の発言の影響力を高める一方で予測精度は上げないことを示した。透明性規制の副作用を示す。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "多数の同時決定における不確実性の定量化", "title": "Uncertainty in Compound Decisions", "url": "https://arxiv.org/abs/2610.15672", "authors": "Andreas Petrou-Zeniou", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Petrou-Zeniou, A. (2026). Uncertainty in Compound Decisions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15672", "why": "経験ベイズ的な多数単位の決定で、効果分布が未知であることの不確実性を扱う推論を提案した。政策の対象選定などに広く関わる。"}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "側情報で較正するコンフォーマル予測", "title": "Moment-Calibrated Conformal Prediction with Side Information", "url": "https://arxiv.org/abs/2610.15268", "authors": "Guanghui Wang ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Wang, G., Peng, L., Liu, L., & Zou, C. (2026). Moment-Calibrated Conformal Prediction with Side Information (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15268", "why": "モーメント制約を経験尤度の重みで課し、分割コンフォーマル予測のばらつきを減らす。有限標本の被覆保証つきで実務に使いやすい。"}, {"id": "pn14", "rank": 14, "field": "政治学", "headline": "インドネシア1965年の政変は次世代の身長に影を残す", "title": "The long shadow of Indonesia’s 1965–66 political upheaval: Maternal early-life exposure and child height a generation later", "url": "https://doi.org/10.2139/ssrn.7610857", "authors": "Muhammad Roby Setiawan ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Setiawan, M. R., Sahadewo, G. A., & Sanjaya, M. R. (2026). The long shadow of Indonesia’s 1965–66 political upheaval: Maternal early-life exposure and child height a generation later. https://doi.org/10.2139/ssrn.7610857", "why": "政変期に生まれた母親の子どもの身長が低いことを、差の不連続デザインで示した。政治暴力の世代を超える影響を定量化した。"}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "記録の結合が曖昧でも無作為化実験の効果は推定できる", "title": "Randomized Experiments with Ambiguous Record Linkage", "url": "https://arxiv.org/abs/2610.15063", "authors": "Bruno Ferman ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Ferman, B., & Finamor, L. (2026). Randomized Experiments with Ambiguous Record Linkage (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15063", "why": "行政データとの結合で候補が複数ある場合でも不偏推定が可能な条件を示した。行政データ連結の実験評価に広く使える。"}, {"id": "pn16", "rank": 16, "field": "機械学習（Hugging Face）", "headline": "意思決定問題の構造を尊重するSystem One模型", "title": "Jeva: System One Models from First Principles", "url": "https://arxiv.org/abs/2610.18773", "authors": "Qi Li ほか", "venue": "Hugging Face Dail
