y Papers", "date": "2026-10-14", "apa": "Li, Q., & Wang, X. (2026). Jeva: System One Models from First Principles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18773", "why": "低遅延の直接的意思決定模型を第一原理から設計し直す提案。Hugging Faceで高い注目を集めた。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由でarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "即答型（System One）のモデルを、意思決定問題の構造に合わせて設計し直したアーキテクチャJevaを提案した（抄録）。", "p3": "「答えなし」の区別、選択肢の並べ替えへの不変性、候補数の拡張性、候補表現の再利用（キャッシュ）の4要件を掲げ、要求と各選択肢を独立に符号化し、選択肢の記憶に対して要求の状態だけを更新する決定層と、対称な集約で確率を出す構造にした。", "p5": "型付きの決定課題で強い性能を示し、「答えなし」の検出はほぼ完全で、試した並べ替えで判断が変わることはなかった。数千の候補にも拡張でき、要求間の再利用で遅延を大きく減らした（抄録）。", "fun": "AIに「AとBとCのどれ？」と聞くと、選択肢の並び順を変えただけで答えが変わることがあります。人間なら並べ方で好みは変わりません。この研究は、選択肢の順番に左右されず、「どれでもない」と言える仕組みを最初から組み込みました。", "unverified": "比較した基準モデルと具体的な性能・速度の数値は抄録からは確認できない。"}}, {"id": "pn17", "rank": 17, "field": "機械学習（Hugging Face）", "headline": "言語エージェントに内省的に行動させる", "title": "Agent-Reflex: Teaching Language Agents to Act Reflectively", "url": "https://arxiv.org/abs/2610.17953", "authors": "Guanting Dong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-14", "apa": "Dong, G., Yang, X., Jin, J., Hu, Y., Song, X., Chen, Y., Li, X., Tan, J., Zhu, Y., Chua, T.-S., Wen, J.-R., & Dou, Z. (2026). Agent-Reflex: Teaching Language Agents to Act Reflectively (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17953", "why": "ノイズのあるツール応答や利用者の誤りに対し、立ち止まって考えるエージェントの学習法。実運用の頑健性に関わる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由でarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "ツールの応答に雑音があったり利用者が介入したりする実運用で、言語エージェントが自ら振り返って立て直すように学習させる枠組みAgent-Reflexを提案した（抄録）。", "p3": "環境にツール応答の摂動を入れて成功と失敗の対から振り返りのメタ技能を抽出し（RSD）、それを教師データにした微調整（ReSFT）と、雑音下の強化学習と方策上の蒸留を組み合わせた最適化（ORPO）の3段階で学習する。", "p5": "Qwen3-8Bを基に、5つの長期ツール利用ベンチマークで総合58.6、AgentNoiseBenchで29.1を達成し、強い比較手法を上回った（抄録）。", "fun": "道具を使って長い作業をするAIは、途中で道具がおかしな答えを返すと、そのまま突き進んでしまいがちです。この研究は「あれ、おかしいぞ」と立ち止まる癖を、成功例と失敗例の比較から学ばせました。人間の「振り返り」の習慣をAIに教える試みです。", "unverified": "比較手法の得点と改善幅の内訳は抄録からは確認できない。"}}, {"id": "pn18", "rank": 18, "field": "機械学習（Hugging Face）", "headline": "映像を即時の意思決定に変えるVideoJev", "title": "VideoJev: System One Model for Video Understanding and Interaction", "url": "https://arxiv.org/abs/2610.18615", "authors": "Yuhan Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-14", "apa": "Zhu, Y., Zeng, X., Si, Q., Yang, C., Li, Y., Qin, L., Zhou, J., Yao, D., Zhang, J., Qin, C., Zhang, Z., Yang, Y., Xu, Y., Zhang, T., Guo, H., Wang, J., Duan, N., & Wang, L. (2026). VideoJev: System One Model for Video Understanding and Interaction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18615", "why": "映像観察から進捗を追い次の行動を選ぶ視覚エージェントのモデル群。この日のHugging Faceで最多の票を集めた。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由でarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "動画理解と対話を、文章を生成せずに時間区間や選択肢に得点を付ける構造化された決定として扱うモデル群VideoJevを示した（抄録）。", "p3": "事前学習済みのマルチモーダルLLMの自己回帰的な回答生成を、動画の証拠に照らして時間区間と選択肢を採点する共有ヘッドに置き換えた。同じ映像に対する複数の問いで視覚計算を再利用する。", "p5": "3つの時間的定位ベンチマークで、4Bと35B-A3Bのモデルは平均mIoUを元のモデルよりそれぞれ6.7、10.8ポイント上げ、推論は2.8〜3.1倍速かった。4つの動画QAでは元モデルの思考モードと同等の性能で100倍超の高速化を示した（抄録）。", "fun": "動画を見て「いつ何が起きたか」を答えるのに、AIは長い文章を考えてから答えることが多く、時間がかかります。この研究は、答えを文章で書く代わりに候補に点数を付けるだけにしました。同じ映像を何度も見直さずに済む工夫で、100倍以上速くなったのが驚きです。", "unverified": "動画QAの具体的な得点は抄録からは確認できない。"}}, {"id": "pn19", "rank": 19, "field": "機械学習（Hugging Face）", "headline": "JEPAで世界モデルと行動を一体で学習", "title": "LeWAM: End-to-End World and Action Modeling with JEPAs", "url": "https://arxiv.org/abs/2610.12818", "authors": "Minghao Fu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-14", "apa": "Fu, M., Siebert, T., Halicki, E., & Balestriero, R. (2026). LeWAM: End-to-End World and Action Modeling with JEPAs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12818", "why": "画素再構成なしの潜在世界モデルと行動予測を端から端まで学習する。ロボット学習の世界モデルの設計を簡素化しうる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由でarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "画素を再構成しない潜在世界モデル（JEPA）で、世界の予測と行動の生成を端から端まで一体で学ぶLeWAMを提案した（抄録）。", "p3": "次の潜在状態の予測と行動のフローマッチングを同時に学習し、潜在状態に等方的なガウス分布の制約を課した。これにより1つのモデルで方策の直接実行と、行動候補を潜在ダイナミクスで評価する計画の両方ができる。", "p5": "従来のJEPAに比べ、接触の多い課題で成功率を28.6%から89.7%、長期課題で10.9%から46.2%に上げ、計画は32.3倍速かった。シミュレーションと実機の模倣学習でも既存手法と競える性能だった（抄録）。", "fun": "ロボットが物を押すとき、頭の中で「こう動かしたらどうなるか」を予想できると上手に動けます。この研究は、映像を細部まで描き直さず、要点だけの頭の中の地図で予想し、行動まで一緒に学ばせました。成功率が3倍近くに上がったのが印象的です。", "unverified": "実機実験の課題の種類と回数は抄録からは確認できない。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "スパイキング言語モデルの計算最適なスケーリング則", "title": "Compute-Optimal Scaling Laws for Spiking Language Models", "url": "https://arxiv.org/abs/2610.15146", "authors": "Dan Saunders ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Saunders, D., Ren, B., & He, C. (2026). Compute-Optimal Scaling Laws for Spiking Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15146", "why": "省電力のスパイキング言語モデルの効率と精度の関係を大規模に特徴づけた。新しい計算基盤の評価の基準になる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "省電力を狙うスパイキング言語モデルについて、計算量に対して最適なモデルの大きさを決める初のChinchilla型スケーリング研究を行った（抄録）。", "p3": "RWKVを骨格とするSpikeGPT系のモデルを幅384〜1536、計算量3×10^17〜10^19 FLOPsで、FineWeb-EDU上で掃引した。", "p5": "最適なパラメータ数は計算量の0.56乗に比例し、密なTransformerの0.50に近かった。非スパイキングのモデルとの損失差は、計算量によらない骨格の差約0.16 natsと、0.34から約0.23 natsに下がって横ばいになるスパイキングの差に分かれた（抄録）。", "fun": "脳の神経のように、0か1かの信号（スパイク）だけで動くAIは、電気をあまり使わずに済むと期待されています。この研究は、その方式でも「モデルの大きさとデータ量の最適な配分」は普通のAIとほぼ同じだと示しました。省エネの代わりに失う精度の量を測ったのが貴重です。", "unverified": "エネルギー消費の実測値は抄録からは確認できない。"}}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "最適輸送で重なりの弱い因果推定を安定化", "title": "Stable Causal Estimation with Optimal Transport", "url": "https://arxiv.org/abs/2610.15212", "authors": "Yidan Xu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Xu, Y., Wang, Y., & Nguyen, X. L. (2026). Stable Causal Estimation with Optimal Transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15212", "why": "傾向スコアの重なりが乏しいときの不安定さを最適輸送で抑える推定法。観察研究の実務的な課題に応える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "処置群と対照群の共変量の重なりが弱い観察研究で、逆確率重み付けの代わりに最適輸送写像で平均因果効果を安定して推定する方法STEを提案した（抄録）。", "p3": "重み付けの代わりに幾何を考慮した輸送写像で反実仮想の比較を作るため、分散に密度比の因子が現れず、密度推定や傾向スコアのモデルも不要になる。重なりが部分的な場合は線形補間の写像で外挿する。", "p5": "一致性、漸近正規性、分散の特徴づけを示し、合成データと実データで既存の推定量より頑健で偏りが小さく、分散が安定することを示した（抄録）。", "fun": "薬を飲んだ人と飲まなかった人を比べるとき、似た人どうしがほとんどいないと、少数の人に極端に大きな重みがかかって推定がぶれます。この研究は、重みを付ける代わりに、一方の集団をもう一方へ「運ぶ」地図を作って比べる発想です。", "unverified": "実データの内容と比較の数値は抄録からは確認できない。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "ランダム化試験どうしの結果を比べる因果的枠組み", "title": "Comparing randomized trials", "url": "https://arxiv.org/abs/2610.14895", "authors": "Yu-Han Chiu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Chiu, Y.-H., & Dahabreh, I. J. (2026). Comparing randomized trials (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14895", "why": "同じ問いの試験が食い違うときに、何が違うのかを因果的に比較する枠組みを示した。証拠統合の考え方を整理する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "同じ因果的な問いを扱うランダム化試験どうしの結果が食い違うとき、それを比較するための因果的な枠組みを示した（抄録）。", "p3": "処置の割り付けと試験に関わる行為（試験への参加の効果）を同時に介入した反実仮想の結果を定義し、各試験本来の効果と、別の試験の母集団へ移した効果を共通の対象集団で比べた。", "p5": "試験間で効果を移す標準的な条件だけでは、移した効果と本来の効果の一致は保証されないことを示した。一致には、試験参加の効果がないか、試験間で等しいか、処置と相互作用しないといった追加条件が必要である（抄録）。", "fun": "同じ薬を調べた2つの実験で結果が違うと、どちらかが間違っていると考えがちです。でも「実験に参加していること」自体が人の行動を変え、その影響が実験ごとに違うのかもしれません。食い違いの理由を整理するための考え方の地図を作った研究です。", "unverified": "具体的な適用例は抄録からは確認できない。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "有限母集団の漸近論でGMMを扱う", "title": "GMM under finite-population asymptotics: instrumental variables and regression adjustment", "url": "https://arxiv.org/abs/2610.15168", "authors": "Haruo Kakehi ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Kakehi, H., Matsushita, Y., & Otsu, T. (2026). GMM under finite-population asymptotics: instrumental variables and regression adjustment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15168", "why": "Abadieらの有限母集団の枠組みをGMMに拡張し、操作変数と回帰調整の推論を整えた。全数データの分析で標準誤差の考え方を変える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "有限母集団の漸近論（Abadieらの枠組み）を一般化モーメント法（GMM）に広げ、操作変数回帰やランダム化試験の回帰調整の推論を整えた（抄録）。", "p3": "GMM推定量の一致性と漸近正規性を示し、保守的な分散推定量を提案した。重み付け、誤指定、過剰識別検定も有限母集団の下で調べた。", "p5": "有限母集団では最適重みのGMMは実行できないが、ランダム化試験の回帰調整推定量はそれと漸近的に同等であることを示した。シミュレーションと実データで有用性を例示した（抄録）。", "fun": "全国の全市町村のように、データが「母集団そのもの」のとき、標準誤差は何の不確かさを表すのでしょうか。この研究は、その考え方を広く使われる推定法に拡張しました。実験でよく使う回帰調整が、実は理論上最も効率の良い方法と同じだという発見が面白い点です。", "unverified": "実データの応用例の内容は抄録からは確認できない。"}}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "事前学習埋め込みを代替指標に適応させる処置効果推定", "title": "SIRNET: Causal Adaptation of Pretrained Embeddings for Semiparametric Treatment-Effect Estimation Under Surrogacy", "url": "https://arxiv.org/abs/2610.14011", "authors": "Lei Shi ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Shi, L., & Lyu, Q. (2026). SIRNET: Causal Adaptation of Pretrained Embeddings for Semiparametric Treatment-Effect Estimation Under Surrogacy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14011", "why": "テキストや画像などの事後処置データを代替指標として使う半パラメトリック推定。実験の遅い成果の早期評価に役立つ。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "テキスト・画像・動画のような処置後の非構造化データを長期成果の代替指標として使い、処置効果を効率よく推定する枠組みSIRNETを提案した（抄録）。", "p3": "事前学習済みの埋め込みから出発し、成果予測・傾向スコア・群ごとの代替指標の周辺化を同時に学ぶ共有アダプタを学習する。交差適合した直交スコアで効果と信頼区間を求める。", "p5": "合成・半合成実験と、脳MRIの埋め込みを長期成果の代替指標としたアルツハイマー病予防試験（A4試験）で性能を検証した（抄録）。", "fun": "新しい教育法の効果が分かるのは何年も先です。でも途中で書かせた作文などに、早い兆しが表れているかもしれません。この研究は、AIが作った作文や画像の要約を、因果効果の推定にきちんと使えるよう調整する方法です。", "unverified": "推定精度の改善幅は抄録からは確認できない。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "裾の重いデータの平均の信頼区間の限界", "title": "Sub-Gaussian Confidence Intervals for Heavy-Tailed Data: Characterizing the Limits of Inference", "url": "https://arxiv.org/abs/2610.15799", "authors": "Ilyes Hammouda ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Hammouda, I., Minsker, S., & Ndaoud, M. (2026). Sub-Gaussian Confidence Intervals for Heavy-Tailed Data: Characterizing the Limits of Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15799", "why": "サブガウス型の信頼区間がどこまで可能かを特徴づけた。頑健推定の理論的な限界を明らかにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "裾の重いデータの平均推定で、データから計算でき長さが最適な信頼区間を作れる条件を、「有効標本サイズ」を表すパラメータで特徴づけた（抄録）。", "p3": "強い偏差保証をもつ推定量はあっても、その誤差のデータ依存の非漸近的な上界は一般になかった。有効標本サイズのパラメータで、サブガウス型の信頼区間が作れる場合と不可能な場合を橋渡しした。", "p5": "未知の分散に完全に適応する最適な長さの信頼区間を設計し、数値実験で、非対称や裾の重い場合でも既存手法と違って名目の被覆率を保った（抄録）。", "fun": "所得のように、ごく一部に極端に大きな値が混ざるデータでは、平均の信頼区間が当てになりません。この研究は「このデータからどこまで言えるか」の限界そのものを測る物差しを作りました。できないことの境界をはっきりさせるのも、統計学の大事な仕事です。", "unverified": "数値実験の設定と比較手法は抄録からは確認できない。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "小地域推定を学習器に依存しない枠組みに", "title": "Small area learning", "url": "https://arxiv.org/abs/2610.15953", "authors": "Katarzyna Reluga ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Reluga, K., Salvati, N., Ranjbar, S., Tzavidis, N., & van der Laan, M. (2026). Small area learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15953", "why": "小地域推定を任意の機械学習器で行える枠組みとして定式化した。公的統計の推定方法を広げる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "小地域推定を、任意の学習器を使える多目的の半教師あり学習として定式化する枠組み「小地域学習（SAL）」を提案した（抄録）。", "p3": "成果予測を局外課題とみなし、地域間の共変量シフトと構造的な条件付きシフトを許して、共通部分と地域固有部分で情報を共有する。標準と交差適合の推定量を作り、合成推定・モデルベース推定・残差補正推定を統一した。", "p5": "地域平均の一致性と漸近正規性を示した。シミュレーションでは直接推定に比べRMSEを34〜49%減らした。収縮推定は強い仮定の下で楽観的すぎる信頼区間を生みうることも示した（抄録）。", "fun": "全国調査では、小さな町のサンプルは数人しかいないことがあります。そこで他の町の情報を借りて推定するのが小地域推定です。この研究は、その借り方を機械学習の道具で柔軟にし、しかも信頼区間がきちんと成り立つようにしました。", "unverified": "実データの応用の内容は抄録からは確認できない。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "弱いシャドウ変数での欠測非無視の推論", "title": "The price of a weak shadow variable: inference under nonignorable missingness as relevance vanishes", "url": "https://arxiv.org/abs/2610.14695", "authors": "Michael B\\\"ucker", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Bücker, M. (2026). The price of a weak shadow variable: inference under nonignorable missingness as relevance vanishes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14695", "why": "シャドウ変数の関連が弱まるときの推論の代償を明らかにした。調査データの欠測処理の実務に関わる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "欠測が無視できない場合に識別を回復するシャドウ変数について、その関連の強さが弱まるときの推論の代償を連続的に特徴づけた（抄録）。", "p3": "関連の強さを、モーメント条件へのシャドウ変数の寄与全体を縮める1つのスカラーで表し、それが0に近づくときを調べた。逆重みの1つの汎関数が有効標本サイズを決めることを示した。", "p5": "その汎関数が飽和するか発散するかは、結果が有界かではなく、傾き変数がその本質的上限に原子をもつかで決まる（二値の結果は飽和し、一様分布は飽和しない）。探索範囲は標本サイズの対数の平方根でしか広がらない（抄録）。", "fun": "アンケートで答えたくない人ほど答えない、という欠測はやっかいです。その偏りを補正する「影の変数」は、結果と関係が強いほど役に立ちます。この研究は、関係が弱くなると推定がどれだけ苦しくなるかを正確に測り、データを1,000倍にしても得られるものはわずかだと示しました。", "unverified": "実データでの例示は抄録からは確認できない。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "ブリッジサンプリングの有限標本理論", "title": "Overlap, Not Moments: Finite-Sample Theory for Bridge Sampling", "url": "https://arxiv.org/abs/2610.17403", "authors": "Giorgio Micaletto", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Micaletto, G. (2026). Overlap, Not Moments: Finite-Sample Theory for Bridge Sampling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17403", "why": "周辺尤度推定の誤差を有限標本で保証する理論で、重なりが鍵であることを示した。ベイズモデル比較の信頼性を高める。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "周辺尤度を推定するブリッジサンプリングについて、計算がどれだけ長ければ推定値とその標準誤差を信頼できるかを有限標本で答えた（抄録）。", "p3": "最適なブリッジ推定量は事後分布と提案分布の標本を分けるロジスティック回帰に当たり、その精度は両者の重なり（分類のベイズ誤差の2倍以内）で決まることを示した。有界な項の和なのでモーメント条件は要らない。", "p5": "重なりに反比例する標本数で十分で、最悪の場合には必要でもある。明示的な定数つきのBerry-Esseen限界が成り立ち、マルコフ連鎖では必要な標本数が緩和時間に比例して増えることを示した（抄録）。", "fun": "2つのモデルのどちらがデータに合うかを比べる計算は、どれだけ回せば十分か分かりにくいものでした。この研究は、それが「2つの分布をどれだけ見分けにくいか」で決まると示しました。見分けにくいほど計算が楽になる、という一見逆の関係が面白い点です。", "unverified": "数値例の内容は抄録からは確認できない。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "構造方程式モデルの適合度指標の偏りを補正", "title": "Reference-State Bootstrap Correction and Kernel Characterization of Residual-Based Fit Indices in Structural Equation Models", "url": "https://arxiv.org/abs/2610.13968", "authors": "Eunjeong Song ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Song, E., & Hong, S. (2026). Reference-State Bootstrap Correction and Kernel Characterization of Residual-Based Fit Indices in Structural Equation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13968", "why": "CFIなどの残差型指標の標本誤差を基準状態のブートストラップで補正する。心理・組織研究の適合度判断に直結する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "構造方程式モデルの残差型の適合度指標（CFIなど）の標本誤差による偏りを、基準状態のブートストラップで補正する方法を示した（抄録）。", "p3": "重みなしCFIが二次カーネルの最大平均差に基づくことを示し、ガウスカーネル版KCFIを導入した。標本を当てはめた相関行列を再現するよう変換してから再標本化・再推定し、完全適合の下での標本誤差を推定する。", "p5": "18の確認的因子分析の条件で、補正は両指標のRMSEを62〜87%減らした。正規性の下では解析的推定量と.0001以内で一致し、29の非正規条件すべてで補正したKCFIはCFIより誤差が小さかった。ただし裾の重い小標本の6条件では解析的推定量のほうが正確だった（抄録）。", "fun": "心理尺度の分析では「モデルの当てはまりが良いか」をCFIという数値で判断します。でも標本が小さいと、この数値自体が偏ってしまいます。この研究は、データを「当てはまりが完璧な状態」に作り変えてから揺らすという工夫で、その偏りを測って取り除きました。", "unverified": "実データへの適用例は抄録からは確認できない。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "固定効果つき動的パネル多項ロジットのモーメント条件", "title": "Dynamic Panel Multinomial Logit Models", "url": "https://arxiv.org/abs/2610.17104", "authors": "Kevin Dano ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Dano, K., Honoré, B. E., & Weidner, M. (2026). Dynamic Panel Multinomial Logit Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17104", "why": "固定効果に依存しないモーメント条件を導き、動的な選択行動の推定を可能にした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "個人の固定効果をもつ動的な多項ロジットのパネルモデルで、固定効果に依存しないモーメント条件を導き、GMM推定を可能にした（抄録）。", "p3": "結果を時点間で並べ替えた変換モデルを作り、巡回置換で得た変換モデルと真のモデルの確率比が固定効果を含まないことを使って、関心のあるパラメータへの制約を導いた。", "p5": "代表的な場合の識別の十分条件を示し、家計の清涼飲料の購買データに応用した。この構成は、静的版が対称な十分統計量をもつ任意の動的パネルモデルに使える（抄録）。", "fun": "いつも同じ炭酸飲料を買う人は、その銘柄が好きなのか、前回買った習慣なのか、区別が難しい問題です。この研究は、買った順番を入れ替えて比べるという巧みな数学的工夫で、個人の好みを消して習慣の効果だけを取り出しました。", "unverified": "応用で得た推定値は抄録からは確認できない。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "早すぎる脱工業化と農業生産性格差", "title": "Premature Deindustrialization and the Agricultural Productivity Gap", "url": "https://doi.org/10.2139/ssrn.7608560", "authors": "Tim Cejka ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Cejka, T., & O’Neil, F. (2026). Premature Deindustrialization and the Agricultural Productivity Gap. https://doi.org/10.2139/ssrn.7608560", "why": "新興国で製造業雇用が先進国の半分で頭打ちになる理由を、構造変化を含む貿易モデルで分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "新興国の製造業雇用が先進国の半分程度で頭打ちになる「早すぎる脱工業化」の原因を、農村と都市の労働市場の壁に求めた（抄録）。", "p3": "構造変化と農村から都市への移動を含む定量的な貿易モデルで、賃金格差と移動の流れから労働市場の壁を推定した。", "p5": "壁がなければ、中央の新興国は早すぎる脱工業化を起こさず、製造業雇用のピークがデータより約10ポイント高くなる。中国の台頭の寄与は小さかった。ブラジルで省力的な農業技術は、若く移動しやすい人口の自治体でだけ工業化を進めた（抄録）。", "fun": "貧しい国は工場で働く人が増えて豊かになる、というのが昔の道筋でした。ところが今の新興国は、工業化が途中で止まってしまいます。その原因は中国との競争ではなく、農村の人が都市の仕事に移りにくいことにあった、という結論が意外です。", "unverified": "推定したモデルの対象国数は抄録からは確認できない。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "AIの情報統合がかえって分極を生む", "title": "AI Information Synthesis and Content Polarization", "url": "https://arxiv.org/abs/2610.17674", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Liu, C., & Zhu, Y. (2026). AI Information Synthesis and Content Polarization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17674", "why": "AIが散らばった情報をまとめても、内容の分極が強まりうることを理論的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "AIがバランスの取れた情報をまとめて提供すると、コンテンツ制作者の戦略的な反応によって、かえって内容の分極が進みうることを理論的に示した（抄録）。", "p3": "消費者が意思決定のために情報を得て、制作者が限られた能力を広く役立つ情報と差別化された情報に配分し、AIが要約情報の代替源となるゲーム理論モデルを作った。", "p5": "AIの信頼性が低いと影響はなく、中程度では価格を抑えるだけで、十分に高くなると消費者がAIに移り、残った視聴者に合わせて制作者が差別化された内容に偏ることで分極が強まる。この効果は制作者間の競争が強いと弱まる（抄録）。", "fun": "AIが中立的なまとめを出してくれれば、世の中の偏りは減りそうです。ところが、中立な情報を求める人がAIに流れると、残った熱心なファンだけに向けて発信者が尖った内容を作るようになります。良い技術が回り回って逆の結果を招く仕組みが面白い点です。", "unverified": "理論モデルで、実証的な検証は抄録からは確認できない。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "管理貿易の意図せぬ環境影響", "title": "The Unintended Environmental Consequences of Managed Trade Policies: Evidence from the U.S.--Mexico Sugar Suspension Agreement", "url": "https://doi.org/10.2139/ssrn.7607544", "authors": "Yetian Cai ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Cai, Y., Weng, W., & Wang, L. (2026). The Unintended Environmental Consequences of Managed Trade Policies: Evidence from the U.S.--Mexico Sugar Suspension Agreement. https://doi.org/10.2139/ssrn.7607544", "why": "米墨砂糖協定を使い、管理貿易が環境に与えた影響を実証した。保護主義の新たな費用を示す。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "2014年の米墨砂糖協定という管理貿易が、メキシコで農地の野焼きを増やすという意図しない環境被害を生んだことを示した（抄録）。", "p3": "米国市場へのメキシコ産砂糖を制限し、70%の関税に相当する価格上昇をもたらした協定について、衛星の農業火災・土地利用データと製糖工場の位置を組み合わせた空間的な差の差分法で効果を推定した。", "p5": "貿易ショックの3年後に農業火災が約15%増え、既存の産地ではなく栽培の最前線に集中した。煙の害が大きい初冬に焼却が移り、死亡と生態系サービスの損失は控えめに見ても年約2億3,800万ドルに上った（抄録）。", "fun": "砂糖の貿易ルールを変えただけで、遠く離れた畑で煙が増えるというつながりを、人工衛星の火災データで突き止めました。値段が上がると、これまで使っていなかった土地までサトウキビ畑にして焼くようになったのです。経済政策の思わぬ環境コストを示す好例です。", "unverified": "労働市場の反応の具体的な数値は抄録からは確認できない。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "米国家庭向けエネルギー料金の非効率と電化", "title": "The Social Welfare and Electrification Implications of Inefficient Pricing in U.S. Residential Energy Markets", "url": "https://doi.org/10.2139/ssrn.7607547", "authors": "Alexander Hill", "venue": "SSRN", "date": "2026-10-13", "apa": "Hill, A. (2026). The Social Welfare and Electrification Implications of Inefficient Pricing in U.S. Residential Energy Markets. https://doi.org/10.2139/ssrn.7607547", "why": "限界費用を超える料金設定が厚生と電化に与える影響を推計した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "米国の家庭向けエネルギー料金が限界費用を上回っていることが、家計の機器選択と電化を歪めていることを、郡単位の新しいデータで示した（抄録）。", "p3": "家庭が直面する単位当たりのエネルギー価格と限界費用の郡単位データセットを作り、2013〜2050年の家庭のエネルギー機器と消費の選択モデルに用いた。", "p5": "家庭のエネルギー価格を社会的限界費用に合わせると、2050年までに暖房と給湯の電化がそれぞれ25、22ポイント進み、死荷重損失が年340億ドル減ると推計された（抄録）。", "fun": "電気代に、送電網の固定費などが上乗せされて割高になっていると、家庭はガス給湯器を選びがちになります。この研究は、料金を「本当のコスト」に合わせるだけで電化が大きく進むと試算しました。脱炭素の近道が、新技術ではなく料金の付け方にあるかもしれない点が面白いです。", "unverified": "社会的限界費用の算定方法の詳細は抄録からは確認できない。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "企業参入が地域経済に与える集計的効果", "title": "Today's Firms, Tomorrow's Workers: The Aggregate Local Effects of Firm Entry", "url": "https://doi.org/10.2139/ssrn.7593355", "authors": "Nathaniel Pinhas", "venue": "SSRN", "date": "2026-10-14", "apa": "Pinhas, N. (2026). Today’s Firms, Tomorrow’s Workers: The Aggregate Local Effects of Firm Entry. https://doi.org/10.2139/ssrn.7593355", "why": "企業参入の地域への波及を、貿易財・非貿易財部門で分けて分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ（結果の記載のない抄録）", "preprint": true, "short": true, "p1": "貿易財部門と非貿易財部門への企業参入が、都市の1人当たり所得、失業率、総雇用に与える効果の違いを、短期から長期にわたり調べる研究である（抄録）。", "p3": "抄録は先行研究の整理と研究目的の説明が中心で、使用データや推定方法の詳細は書かれていない（抄録）。", "p5": "未確認（抄録に結果の記載がない）。", "fun": "新しい工場ができると、その町に飲食店や美容院も増えます。でも、遠くへ製品を売る工場と、地元の客相手の店とでは、町の経済への波及は違うはずです。この研究は、どちらの参入が町を豊かにするのかという身近な問いを立てています。", "unverified": "データ、推定方法、結果のいずれも抄録からは確認できない。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "プラットフォームの中核革新と補完者の適応", "title": "A Platform for Change? Core Component Innovations, Complementor Adaptation, and Multihoming in Platform-Based Ecosystems", "url": "https://doi.org/10.2139/ssrn.7598825", "authors": "Ram Ranganathan", "venue": "SSRN", "date": "2026-10-14", "apa": "Ranganathan, R. (2026). A Platform for Change? Core Component Innovations, Complementor Adaptation, and Multihoming in Platform-Based Ecosystems. https://doi.org/10.2139/ssrn.7598825", "why": "中核部品の革新とインターフェースの変化に補完者がどう適応し複数参加するかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "AppleのiOSの大型更新のあと、アプリ開発者がiOS向けの共同革新を増やすと同時に競合プラットフォームにも手を広げることを示した（抄録）。", "p3": "iOSの5回の主要リリースに関する詳細なデータで、中核部品の革新後のアプリ開発者の反応をアブダクティブに分析した。", "p5": "リリース後、補完者はiOSでの共同革新を増やしつつ、競合プラットフォームへの複数参加も増やした。プラットフォーム横断の標準化は両方を促し、プラットフォーム固有の差別化は分散を抑えた（抄録）。", "fun": "iPhoneの仕組みが新しくなると、アプリ開発者はそれに合わせて新機能を作ります。ところが同時に、Androidにも手を広げる傾向がありました。共通の規格に寄せた変更ほど他社にも移りやすくなる、というプラットフォームのジレンマが面白い点です。", "unverified": "データの期間とアプリ数は抄録からは確認できない。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "柔軟性と可視性の制約下の商品ランキング管理", "title": "The Impact of Flexibility and Visibility Constraints on Product Ranking Management", "url": "https://doi.org/10.2139/ssrn.7607058", "authors": "Wentao Lu ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Lu, W., Sahin, O., & Wang, R. (2026). The Impact of Flexibility and Visibility Constraints on Product Ranking Management. https://doi.org/10.2139/ssrn.7607058", "why": "プラットフォーム規制を念頭に、ランキングと品揃えの最適化を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "プラットフォームの規制や長期的な市場運営を念頭に、表示の可視性や市場成果の制約の下で、商品の並び順と品揃えを最適化する問題を解いた（抄録）。", "p3": "消費者が商品を順に見て最初に満足したものを買うカスケード選択モデルで、並び順も選べる場合と品揃えだけを選べる場合に分け、最小市場シェアや上位k件の可視性などの制約の下での最適方策の構造を調べた。", "p5": "並び順を選べる場合は品揃えの最適化が不要になり、上位k件の可視性制約には定数倍近似と完全多項式時間近似スキームを示した。並び順が固定なら、最小表示確率の制約で入れ子構造をもつ確率的な品揃えが最適になる（抄録）。", "fun": "通販サイトの検索結果の並び順は、売上を大きく左右します。でも規制当局は、小さな店の商品も一定の割合で見せるよう求めるかもしれません。この研究は、そうした「公平さの条件」を守りながら売上を最大にする並べ方を、数学的に効率よく求められることを示しました。", "unverified": "数値実験の結果は抄録からは確認できない。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "法律サービス規制改革から5年のデータ", "title": "Legal Innovation After Reform: Five Years of Data on Regulatory Change", "url": "https://doi.org/10.2139/ssrn.7602220", "authors": "David Freeman Engstrom ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Engstrom, D. F., Knowlton, N., & Ricca, L. (2026). Legal Innovation After Reform: Five Years of Data on Regulatory Change. https://doi.org/10.2139/ssrn.7602220", "why": "アリゾナ州とユタ州の規制緩和後の法律サービスの変化を記録した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "2020年に法律サービスの規制を緩和した米アリゾナ州とユタ州の5年後の状況を、実証データで追跡した（抄録）。", "p3": "2022年の実証研究を5年目の時点で再調査し、認可事業体の数、革新の形態、消費者苦情・懲戒処分の公開情報を調べた。", "p5": "ユタ州は規制のサンドボックスを大きく縮め、事業体は2022年6月の39から2025年4月の11に減った。アリゾナ州は非弁護士所有の事業体を19から136に増やした。両州とも消費者被害の証拠はほとんど見られなかった（抄録）。", "fun": "弁護士でない人や会社が法律サービスを提供してよいかは、長く禁止されてきました。2つの州が同時に規制を緩めたのに、5年後には片方は縮小、もう片方は7倍に拡大と、正反対の道をたどりました。同じ改革でも運用次第で結果が大きく変わる好例です。", "unverified": "低所得者への効果の具体的な証拠は抄録からは確認できない。"}}, {"id": "pn39", "rank": 39, "field": "組織行動・心理的安全性", "headline": "リモートワークが賃金の基準を崩す", "title": "Remote Work and the Erosion of Wage Anchors in the Digital Era", "url": "https://doi.org/10.2139/ssrn.7601278", "authors": "Shufeng Cong", "venue": "SSRN", "date": "2026-10-14", "apa": "Cong, S. (2026). Remote Work and the Erosion of Wage Anchors in the Digital Era. https://doi.org/10.2139/ssrn.7601278", "why": "生産性が見えにくい環境で、遠隔勤務が社内の賃金決定の基準をどう変えるかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "リモートワークが、企業が賃金を地域の業界水準に合わせる「賃金の錨」を弱めることを、理論と中国の企業データで示した（抄録）。", "p3": "労働市場の統合と業績情報の摩擦という2つの経路をもつ賃金決定の枠組みを作り、2014〜2024年の中国の求人サイトの募集と上場企業を結びつけてリモートワークの強度を測った。", "p5": "リモートワークの強度が高い企業ほど、労働費用が業界の基準賃金から大きく外れ、それは主に基準を上回る上乗せによるものだった。デジタル能力や革新性が高い企業、普及の初期で関係が強かった（抄録）。", "fun": "これまで給料は「この地域のこの業界ならこれくらい」という相場で決まりがちでした。リモートワークで遠くの人も雇えるようになると、その相場が効かなくなります。特に、デジタルに強い人材に相場より高い給料を払う形でずれが生まれていたのが興味深い点です。", "unverified": "効果の大きさの具体的な数値は抄録からは確認できない。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "職場いじめを挑戦・阻害ストレッサー枠組みに組み込む", "title": "Psychosocial Job Demands, Workplace Bullying and Occupational Safety: Extending the Challenge–Hindrance Stressor Framework through Norm Violation Theory", "url": "https://doi.org/10.2139/ssrn.7607879", "authors": "Stephen Teo ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Teo, S., Nguyen, D., & Rodwell, J. (2026). Psychosocial Job Demands, Workplace Bullying and Occupational Safety: Extending the Challenge–Hindrance Stressor Framework through Norm Violation Theory. https://doi.org/10.2139/ssrn.7607879", "why": "職場いじめを規範違反として理論化し、安全への影響を説明する枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "職場いじめを、仕事の要求と労働災害をつなぐ対人的な過程として捉え、挑戦・阻害ストレッサーの枠組みを規範違反理論で拡張した（抄録）。", "p3": "オーストラリアの看護師287人を対象に、6週間の時間差をおいた2時点の調査で、挑戦・阻害ストレッサー、いじめ・ハラスメント、心理的苦痛、仕事上の負傷・害、上司の倫理的リーダーシップを測った。", "p5": "阻害ストレッサーはいじめの増加と、挑戦ストレッサーはいじめの減少と関連した。いじめは心理的苦痛と負傷・害の増加と関連し、倫理的リーダーシップはいじめを減らさなかったが、いじめと負傷・害の関係を強めた（抄録）。", "fun": "仕事の負担には、やりがいにつながる「挑戦」と、ただ邪魔になる「阻害」があります。邪魔な負担が多い職場ではいじめが増え、それがけがにまでつながっていました。倫理的な上司がいじめを減らすわけではなかった、という意外な結果も目を引きます。", "unverified": "効果の大きさの数値は抄録からは確認できない。"}}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "組織的支援と心理的安全性が革新行動に与える影響", "title": "A Study of The Impact of Perceived Organizational Support and Psychological Safety on Innovative Work Behaviour:A Mediating and Moderating Analysis&nbsp;", "url": "https://doi.org/10.2139/ssrn.7606180", "authors": "Upasana Pareek ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Pareek, U., & Jain, S. (2026). A Study of The Impact of Perceived Organizational Support and Psychological Safety on Innovative Work Behaviour:A Mediating and Moderating Analysis&nbsp; https://doi.org/10.2139/ssrn.7606180", "why": "心理的安全性と知覚された組織的支援の媒介・調整モデルを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "インドの印刷業の従業員200人の調査で、組織的支援の知覚と心理的安全性が革新的な仕事行動に与える影響を、媒介と調整を含めて調べた（抄録）。", "p3": "便宜的標本の5件法の質問紙をPLS-SEMで分析し、創造性・心理的エンパワーメント・ワークエンゲージメントを媒介、革新的組織文化と変革型リーダーシップを調整として検証した。", "p5": "心理的安全性（β=0.660）と組織的支援の知覚（β=0.373）はともに革新行動と正の関係があった。ワークエンゲージメントは心理的安全性の効果を媒介し、変革型リーダーシップは心理的安全性と革新行動の関係を強めた（抄録）。", "fun": "「失敗しても責められない」と感じられる職場では、新しいことに挑戦しやすくなります。この調査では、その安心感が、仕事への熱意を通じて工夫や提案につながっていました。ただし1回きりの質問紙で同じ人に尋ねているので、因果関係までは言えない点に注意が要ります。", "unverified": "便宜的標本の横断調査で、因果関係と一般化可能性は確認できない。"}}, {"id": "pn42", "rank": 42, "field": "教育", "headline": "イタリアのオンライン大学に誰が進み、どう成果を出すか", "title": "Who Goes Online? Selection and Performance in Italian Higher Education", "url": "https://doi.org/10.2139/ssrn.7610840", "authors": "Elena Lazzaro ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Lazzaro, E., Frattola, E., Bronzini, R., & De Benedictis, L. (2026). Who Goes Online? Selection and Performance in Italian Higher Education. https://doi.org/10.2139/ssrn.7610840", "why": "行政データと標準テストを結合し、オンライン大学の選抜と成果を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "イタリアでオンライン大学に進む学生の特徴と成果を、行政データと大学入学前の標準テストを結合して調べた（抄録）。", "p3": "オンライン大学と従来型大学の学生の属性、成績、中退率、標準修業年限での卒業率を比較し、入学前の不利を統制した。", "p5": "オンライン学生は年齢が高く、技術・職業系の出身が多く、高校の成績とテスト得点が低かった。それを統制すると学士課程の中退率は低く、期限内卒業率は高かったが、従来型の修士課程に移ると成績が下がった。入学の伸びは高等教育進学率が低かった県に集中していた（抄録）。", "fun": "オンライン大学は「楽に卒業できる」と見られがちです。実際、条件をそろえると卒業率は高いのですが、普通の大学院に進むと苦戦していました。一方で、これまで大学に行かなかった地域や人に学ぶ道を開いているという、光と影の両面が見えます。", "unverified": "効果の大きさの具体的な数値は抄録からは確認できない。"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "数学の知識追跡に必要な履歴の複雑さ", "title": "Compressing student history in mathematics knowledge tracing", "url": "https://doi.org/10.35542/osf.io/z2s8n_v1", "authors": "Oskari Lahtinen ほか", "venue": "EdArXiv", "date": "2026-10-13", "apa": "Lahtinen, O., & McMullen, J. (2026). Compressing student history in mathematics knowledge tracing. https://doi.org/10.35542/osf.io/z2s8n_v1", "why": "約190万件の解答データで、生徒の過去の成績表現をどこまで圧縮できるかを調べた。", "explain": {"basis": "抄録", "basis_note": "EdArXiv（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "生徒の過去の解答履歴をどこまで単純にまとめても、次の解答を予測できるかを、フィンランドの大規模な数学データで調べた（抄録）。", "p3": "8,996人の生徒の1,927,265件の数学の解答を用い、モデル推定に使わなかった生徒で評価した。問題の識別だけ、最近の成績の動的な指標1つ、50次元の状態、Transformerを比べた。", "p5": "問題の識別だけでAUC .8362、最近の成績の指標を1つ加えると.8669となり、問い条件付きTransformer（.8690）との差の93.5%を回収した。50次元に増やすと97.1%になった（抄録）。", "fun": "生徒が次の問題を解けるかを当てるのに、最新のAIを使っても、「最近どれくらい解けているか」という1つの数字でほぼ同じ精度が出ました。複雑なモデルを作る前に、単純な指標でどこまで行けるかを確かめる大切さを教えてくれる研究です。", "unverified": "対象学年や教材の詳細は抄録からは確認できない。"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "AI生成情報を評価する学習機会の社会経済格差", "title": "Evaluating AI or Evaluating Information? Socioeconomic Stratification of Opportunities to Learn to Evaluate AI-Generated Information Across 78 Education Systems", "url": "https://doi.org/10.2139/ssrn.7598980", "authors": "Yichao Sun ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Sun, Y., & Zhao, P. (2026). Evaluating AI or Evaluating Information? Socioeconomic Stratification of Opportunities to Learn to Evaluate AI-Generated Information Across 78 Education Systems. https://doi.org/10.2139/ssrn.7598980", "why": "78教育制度のデータで、AI情報の評価を学ぶ機会が階層化していることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "PISA 2025の78教育制度のデータで、AIが生成した情報を評価する学習機会に、ネット情報の評価以上の社会経済的な格差があることを示した（抄録）。", "p3": "AI生成情報とネット情報を評価する機会を比べ、AI固有の格差を学校間と学校内に分解し、制度ごとの推定をランダム効果メタ分析で統合した。", "p5": "学校平均の社会経済指標1単位あたり、学校間で3.70ポイント、学校内で1.51ポイントの追加の格差があり、制度の中央値で約3分の2が学校間だった。格差は機会の頻度ではなく、そもそも機会があるかどうかに集中していた（抄録）。", "fun": "AIの答えをうのみにしない力は、これからの必須スキルです。ところが、その練習の機会があるかどうかは、通う学校の豊かさで大きく違いました。同じ学校の中より学校どうしの差が大きいという結果は、学校の選び方が新しい格差を生むことを示しています。", "unverified": "機会の測定に使った質問項目の詳細は抄録からは確認できない。"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "志望順位で優先度が変わる学校選択の誘因", "title": "Incentives in School Choice with Rank-Dependent Priorities", "url": "https://doi.org/10.2139/ssrn.7605560", "authors": "Yusuke Iwase", "venue": "SSRN", "date": "2026-10-13", "apa": "Iwase, Y. (2026). Incentives in School Choice with Rank-Dependent Priorities . https://doi.org/10.2139/ssrn.7605560", "why": "志望順位に依存する優先度の下での最適な出願戦略を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "志望順位が高い生徒ほど優先度が上がる学校選択制度で、生徒の最適な出願戦略と、受入保留方式が戦略的操作に強くなる条件を示した（抄録）。", "p3": "優先度構造の「非巡回性」という条件を導入し、受入保留方式、即時受入方式、トップトレーディングサイクル方式でのナッシュ均衡を分析した。", "p5": "受入保留方式が戦略的操作に頑健になるのは優先度構造が非巡回的なときに限られ、第1志望の生徒を優先する一般的な制度ではこれが成り立たない。即時受入方式のナッシュ均衡の結果はすべて安定だった（抄録）。", "fun": "「第1志望にしてくれた生徒を優先する」学校があると、正直に志望を書くと損をする場合があります。この研究は、どんな優先の付け方なら正直者が損をしないかを数学的に特定しました。善意のルールが受験生に駆け引きを強いるという点が面白いところです。", "unverified": "実際の制度データによる検証は抄録からは確認できない。"}}, {"id": "pn46", "rank": 46, "field": "教育", "headline": "ナイジェリアの燃料補助金撤廃と子どもの通学", "title": "Fuel Subsidy Removal and Children’s School Attendance in Nigeria: Evidence from Household Exposure", "url": "https://doi.org/10.2139/ssrn.7610839", "authors": "Julia Nabasu ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Nabasu, J., & Musa, D. (2026). Fuel Subsidy Removal and Children’s School Attendance in Nigeria: Evidence from Household Exposure. https://doi.org/10.2139/ssrn.7610839", "why": "補助金撤廃前の家計の依存度の差を使い、就学への影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "ナイジェリアの2023年5月のガソリン補助金撤廃が、ガソリンへの依存度の高い家計の子どもの通学を追加的に減らしたかを調べた（抄録）。", "p3": "全国世帯パネル調査で、改革の5年前に測った家計のガソリン依存度の差を使い、改革後1年間の出席率の変化を比べた。", "p5": "依存度の高い家計の子どもに統計的に意味のある追加の減少は見られず、依存度1標準偏差の増加で出席率は0.2ポイント下がるだけだった。一方で消費の伸びが鈍り、私立から公立への移動の兆しがあった（抄録）。", "fun": "燃料代が急に上がると、通学費を払えずに子どもが学校を休むのでは、と心配されます。調べてみると、出席率はほとんど下がっていませんでした。家族は食費など別のところを切り詰めたり、学費の安い学校に移したりして、子どもの学校を守っていたようです。", "unverified": "改革全体の教育への影響は扱っていないと著者が述べている。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "教育者が政治家になると何が起きるか", "title": "When Educators Become Politicians", "url": "https://doi.org/10.2139/ssrn.7608061", "authors": "Gabriel de Campos", "venue": "SSRN", "date": "2026-10-13", "apa": "de Campos, G. (2026). When Educators Become Politicians. https://doi.org/10.2139/ssrn.7608061", "why": "教育の専門知識をもつ公職者が学校の質に与える影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "教育関係者が市長に当選すると生徒の学力が上がるかを、ブラジルの2004〜2016年の市長選挙の回帰不連続デザインで調べた（抄録）。", "p3": "教育関係の候補がわずかな差で勝った自治体と負けた自治体を比べ、学力、教員給与、教育支出、学校人事への影響を推定した。", "p5": "任期中の学力の伸びは0.005〜0.068標準偏差と小さく不正確だったが、選挙の5年後に0.16標準偏差上がった。教員給与と教育支出には効果がなく、校長の安定と経験の向上が主な経路と考えられた（抄録）。", "fun": "先生だった人が市長になると、学校は良くなるのでしょうか。お金を増やしたわけではなく、校長先生をころころ替えないようにしたことが効いていたようです。しかも効果がはっきり出たのは、その市長の任期が終わった後でした。", "unverified": "校長人事の経路の検証方法の詳細は抄録からは確認できない。"}}, {"id": "pn48", "rank": 48, "field": "政治学", "headline": "中央銀行の独立性への脅威と民主主義の後退", "title": "\"Advancing Autocracy with Monetary Manipulation: Do Threats to Central Bank Independence Enable Democratic Erosion?\"", "url": "https://doi.org/10.2139/ssrn.7599058", "authors": "Carl LeVan ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "LeVan, C., & Assenov, A. (2026). “Advancing Autocracy with Monetary Manipulation: Do Threats to Central Bank Independence Enable Democratic Erosion?”. https://doi.org/10.2139/ssrn.7599058", "why": "中央銀行への政治介入が民主的後退を助けるかを検討した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "中央銀行の独立性への政治的な介入が、民主主義の後退を見分ける試金石になるという理論を示し、統計で検討した（抄録）。", "p3": "中央銀行の独立性の利点と独裁者の手法に関する文献を整理し、独立性と民主主義の相関、動的モデル、民主主義の頂点後に区切ったモデルで検証した。", "p5": "中央銀行の独立性と民主主義には強い相関があったが、動的モデルではその関係はほぼ消え、民主主義の頂点後の年に区切った場合にだけ残った。中央銀行には民主的後退に対する一定の耐性があると示唆された（抄録）。", "fun": "指導者が権力を強めようとするとき、中央銀行を言いなりにして景気をよく見せようとすることがあります。この研究は、中央銀行への介入は、報道の自由を奪うなどの後の「最後の段階」に起きると主張します。中央銀行の独立性が民主主義の健康診断になるという発想です。", "unverified": "統計分析の対象国数と期間は抄録からは確認できない。"}}, {"id": "pn49", "rank": 49, "field": "経済学", "headline": "技術革新の利益に配分効率の変化は含まれない", "title": "Allocative Efficiency and the Returns to Innovation", "url": "https://arxiv.org/abs/2610.14969", "authors": "Koki Okumura", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Okumura, K. (2026). Allocative Efficiency and the Returns to Innovation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14969", "why": "生産ネットワークで数量競争する場合、革新者の利潤には自らが起こす配分効率の変化が含まれないことを示した。革新の私的収益と社会的価値のずれを理論化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "生産ネットワークで数量競争するとき、革新者の利潤には自らの革新が起こす配分効率の変化がまったく含まれないことを示し、研究開発の社会的収益を測り直した（抄録）。", "p3": "革新者の選択が最適であれば他の効果は移転にすぎないという理論を示し、2015年の米国上場企業のデータと、研究開発のマルコフゲームで推計した。", "p5": "工程革新者は費用削減の14〜26%に当たるマークアップを取り逃し、売上の68%を占める革新者では配分効率の変化が私的収益の1割を超えた。研究開発の社会的収益は私的収益の5.39倍で、従来の産出ベースの計算（2.53倍）を上回った（抄録）。", "fun": "新しい技術で会社がもうける額は、社会全体が得する額よりずっと小さい、という話です。この研究は、その差がライバルの売上を奪う分ではなく、経済全体の資源の配り方が良くなる分から生じることを示しました。研究開発に補助金を出す理由を数字で裏付けています。", "unverified": "推計の前提となるネットワーク構造のデータの詳細は抄録からは確認できない。"}}, {"id": "pn50", "rank": 50, "field": "機械学習", "headline": "大規模言語モデル間の表現の一致の規模と限界", "title": "Scale, Drivers, and Limits of Representational Alignment Across Large Language Models", "url": "https://arxiv.org/abs/2610.14476", "authors": "Jialin Wu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Wu, J., & Khosla, M. (2026). Scale, Drivers, and Limits of Representational Alignment Across Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14476", "why": "多数のLLMの内部表現の一致が、領域や層でどう変わるかを詳しく測った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多数の大規模言語モデルの内部表現がどの尺度で一致し、どんな言語的性質がその一致を支えるかを測る2つの方法を示した（抄録）。", "p3": "表現空間での近さで刺激の対に重みを付ける近傍重み付きRSA（NW-RSA）と、一方のモデルの表現を他方の言語的な摂動の下の表現と比べる反実仮想RSA（CF-RSA）を導入した。", "p5": "モデル間で大まかな表現の幾何はよく一致したが、局所的な近傍では大きく食い違った。論理的なスコープの変化は、階層的な統語や事象の役割、談話構造の変化より一致を大きく下げた（抄録）。", "fun": "違う会社が作ったAIでも、言葉の意味を似たように整理しているのでしょうか。調べると、大きな地図はよく似ているのに、近所の細かい配置はかなり違っていました。「すべて」「いくつか」のような論理の言葉の扱いに、モデルの違いが特に表れるのが面白い点です。", "unverified": "比較したモデルの数と種類は抄録からは確認できない。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "分布型光ファイバのひずみで疲労き裂を特定", "title": "Fatigue crack identification for steel structures based on distributed fiber optic sensing in a hybrid Digital Twin framework", "url": "https://doi.org/10.1177/14759217261492247", "authors": "Christoph Brenner ほか", "venue": "Structural Health Monitoring", "date": "2026-10-13", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Brenner, C., Vogts, S., Müggenburg, M., Thiele, K., & Unglaub, J. rnments and Real Estate Developers in China", "url": "https://doi.org/10.1111/1468-2427.70150", "authors": "Ang Liu", "venue": "International Journal of Urban and Regional Research", "date": "2026-10-14", "sjr": 1.104, "citescore": 4.7, "citescore_year": "2025", "apa": "Liu, A. (2026). GOVERNING OR MANIPULATING LEVERAGE TO BUILD MORE CITIES? Borrowing in the Shadows by Local Governments and Real Estate Developers in China. International Journal of Urban and Regional Research. https://doi.org/10.1111/1468-2427.70150", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr14", "rank": 14, "headline": "競争が電動スクーターの供給過剰を生む", "title": "Competition for Customer Attention is Creating Oversupply Pockets in US Micromobility", "url": "https://doi.org/10.1287/opre.2023.0305", "authors": "Hale Erkan ほか", "venue": "Operations Research", "date": "2026-10-14", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Erkan, H., Agarwal, A., Muthuraman, K., & Stamatopoulos, I. (2026). Competition for Customer Attention is Creating Oversupply Pockets in US Micromobility. Operations Research. https://doi.org/10.1287/opre.2023.0305", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr15", "rank": 15, "headline": "CDP気候スコア上昇は企業内改善と参入で相殺", "title": "The Hidden Arithmetic of Climate Disclosure: How a Decade of CDP Climate Scores Masks a Large Within‐Firm Rise and an Equally Large Composition Drag", "url": "https://doi.org/10.1002/csr.71080", "authors": "Alexander Ryota Keeley ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-14", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Keeley, A. R., Xie, J., Fujii, H., & Managi, S. (2026). The Hidden Arithmetic of Climate Disclosure: How a Decade of CDP Climate Scores Masks a Large Within‐Firm Rise and an Equally Large Composition Drag. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71080", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr16", "rank": 16, "headline": "たわみ計測で鉄筋腐食を追う適応的計測計画", "title": "Adaptive Measurement Scheduling for Deflection-Based Corrosion Monitoring of Reinforced-Concrete Structures", "url": "https://doi.org/10.3390/buildings16204057", "authors": "Faustyn Recha ほか", "venue": "Buildings", "date": "2026-10-14", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Recha, F., & Tang, Y. (2026). Adaptive Measurement Scheduling for Deflection-Based Corrosion Monitoring of Reinforced-Concrete Structures. Buildings, 16(20), 4057. https://doi.org/10.3390/buildings16204057", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "鉄筋コンクリートのたわみから鉄筋腐食を推定する計測で、劣化の進み具合に合わせて次の計測時期を決める誤差制御型の計画法を示した（抄録）。", "p3": "推定した腐食電流密度の1次と2次の外挿の食い違いから局所予測誤差を見積もって次の間隔を制限し、実際の予測誤差から比例積分制御で間隔を調整する。すべての計画は同じ月次の数値参照軌跡から標本を取る。", "p5": "基準の梁で、適応的な計画は6・12か月の固定間隔を上回り、許容誤差0.5〜2%で等間隔の計画より最大誤差を2.4〜3.2分の1にし、月次計測の5分の1未満で基準の電流密度を0.21%以内で再現した。効果は劣化が不均一なときに生じ、実験による検証は今後の課題とされた（抄録）。", "fun": "健康診断を毎月受けるのは大変ですが、年1回では急な変化を見逃します。この研究は、コンクリートの中の鉄筋のさびを、進み方が速いときは頻繁に、遅いときはまばらに測る「賢い予定表」を作りました。測る回数を5分の1以下に減らしても精度を保てたのがポイントです。", "unverified": "数値実験のみで、実構造物での検証は行われていない。"}}, {"id": "jr17", "rank": 17, "headline": "多源監視データ融合でアーチダムのリスク識別", "title": "Risk identification of the high arch dam in strong seismic regions using multisource monitoring data fusion", "url": "https://doi.org/10.1177/14759217261493457", "authors": "Ke Ma ほか", "venue": "Structural Health Monitoring", "date": "2026-10-13", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Ma, K., Zhang, Y., Yuan, Z., & Ren, F. (2026). Risk identification of the high arch dam in strong seismic regions using multisource monitoring data fusion. Structural Health Monitoring. https://doi.org/10.1177/14759217261493457", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "地震の多い地域の高アーチダムで、微小地震とプラムライン変位の2種類の監視データを融合し、正常・軽微な異常・顕著な異常の3状態でリスクを識別する枠組みを示した（抄録）。", "p3": "微小地震はb値の変化の有意性（宇津検定）とエネルギーの再現期間で、変位はSTL分解の残差の孤立森による異常検知で証拠を作り、深層ニューラルネットで状態確率に変換してデンプスター・シェーファーの証拠理論で融合した。", "p5": "2022年9月5日の瀘定地震（Ms 6.8）時の大崗山ダムに適用し、地震後の高エネルギーの微小地震の集中と変位残差のピークを捉えた。ダム基礎のリスクが最も高く持続し、融合で地震前の誤警報が減った（抄録）。", "fun": "巨大なダムが地震で傷んでいないかは、一つのセンサだけでは判断が難しいものです。この研究は、岩のきしみ（微小地震）とダム本体のわずかな動きという性質の違う2つの証拠を、確率の理論で組み合わせました。一方だけなら誤報になるものを抑えられたのが利点です。", "unverified": "誤警報の減少量の具体的な数値は抄録からは確認できない。"}}, {"id": "jr18", "rank": 18, "headline": "全周波数製品でマルチGNSS PPP-ARを評価", "title": "Assessing multi-GNSS PPP-AR using IGS all-frequency products and machine-learning-driven attribution analysis", "url": "https://doi.org/10.1186/s43020-026-00223-x", "authors": "Jihang Lin ほか", "venue": "Satellite Navigation", "date": "2026-10-14", "sjr": 3.423, "citescore": 19.9, "citescore_year": "2025", "apa": "Lin, J., Bisnath, S., & Yi, D. (2026). Assessing multi-GNSS PPP-AR using IGS all-frequency products and machine-learning-driven attribution analysis. Satellite Navigation, 7(1). https://doi.org/10.1186/s43020-026-00223-x", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "IGSの全周波数補正製品を使ったマルチGNSSの精密単独測位・整数アンビギュイティ決定（PPP-AR）の性能を評価し、性能を左右する観測要因を機械学習で特定した（抄録）。", "p3": "2025年の28日間、440のIGS観測局のGPS・Galileo・BDS-3の観測を非結合の分離時計モデルで処理し、ランダムフォレストとXGBoostで収束時間と測位精度に効く要因を調べた。", "p5": "武漢大学の全周波数製品で、98%の解が水平2.5 cmの精度に瞬時に収束し、収束後のRMS誤差は水平0.8 cm、鉛直2.0 cmだった。水平精度には天空図のエントロピー、鉛直精度にはPDOPと平均衛星仰角が最も効いた（抄録）。", "fun": "GPSなどの衛星測位で、1台の受信機だけでセンチメートル級の位置がほぼ一瞬で分かるようになってきました。この研究は、世界中の観測局のデータから、精度を左右するのは「空のどの方向に衛星が散らばっているか」だと突き止めました。", "unverified": "製品間の差の具体的な数値は抄録からは確認できない。"}}, {"id": "jr19", "rank": 19, "headline": "系同定のための最適な摂動入力の設計", "title": "Designing optimal perturbation inputs for system identification in neuroscience", "url": "https://doi.org/10.7554/elife.110030.3", "authors": "Mikito Ogino ほか", "venue": "eLife", "date": "2026-10-13", "sjr": 3.395, "citescore": 12.9, "citescore_year": "2023", "apa": "Ogino, M., Sekizawa, D., Kitazono, J., & Oizumi, M. (2026). Designing optimal perturbation inputs for system identification in neuroscience. eLife, 15. https://doi.org/10.7554/elife.110030.3", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "神経回路の結合を推定するために、どんな刺激（摂動入力）を与えれば推定誤差が最小になるかを、制御理論に基づいて設計する枠組みを示した（抄録）。", "p3": "神経モデルを制御系として定式化し、受動的な自発活動だけでは潜在的な情報が足りず系同定に失敗するという洞察から、推定誤差を最小にする摂動入力の最適化の理論的基礎を導いた。周波数・インパルス・ステップ入力との関係も調べた。", "p5": "実験パラダイムに基づくシミュレーション（神経状態の分類、神経状態の最適制御）で枠組みの有効性を示した（抄録）。", "fun": "機械の中身を知りたいとき、ただ眺めるより、たたいて響きを聞くほうが分かることがあります。脳の回路も同じで、刺激を与えると隠れた性質が現れます。この研究は、「どんなたたき方が一番よく分かるか」を数学的に決めようという試みです。", "unverified": "シミュレーションでの推定誤差の改善幅は抄録からは確認できない。"}}, {"id": "jr20", "rank": 20, "headline": "生物多様性開示でアナリスト予測が正確に", "title": "Biodiversity Disclosure and Analyst Forecast Accuracy: Evidence From Chinese A‐Share Firms", "url": "https://doi.org/10.1002/csr.71056", "authors": "Han Sun ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-14", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Sun, H., Kang, H.-G., Lee, J., & Ryu, D. (2026). Biodiversity Disclosure and Analyst Forecast Accuracy: Evidence From Chinese A‐Share Firms. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71056", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "中国A株企業の年次報告書で生物多様性に関する開示が多いほど、アナリストの利益予想の誤差が小さくなることを示した（抄録）。", "p3": "2011〜2023年の20,038企業年の観測で、手作業の符号化と照合した辞書ベースの開示指標を作り、ESGやテキスト報告の特性を統制した。企業単位で分けた交差適合推定も行った。", "p5": "開示の強度が高いほどその後の予想誤差が小さく、年次報告書の公表から30日以内の予想でも明らかだった。予想のばらつきについての証拠は弱かった（抄録）。", "fun": "会社が「生き物や自然への影響」をきちんと書くことが、利益の予想にまで役立つという結果です。一見お金と関係なさそうな情報でも、会社の経営の見通しを知る手がかりになっているのかもしれません。", "unverified": "効果の大きさの具体的な数値は抄録からは確認できない。"}}, {"id": "jr21", "rank": 21, "headline": "機械学習とテキスト分析で持続可能性開示を可視化", "title": "An Application of Machine Learning and Textual Analytics for Visualisation and Enhanced Interpretation of Sustainability Disclosure", "url": "https://doi.org/10.1002/bse.71658", "authors": "Tarek Rana ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-14", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "地方自治体の持続可能性開示を、機械学習によるテキスト分析で収集・分析・可視化する方法を示した（抄録）。", "p3": "豪ビクトリア州の79自治体の2015〜2017年の年次報告書237件に、VADERの感情分析、LDAのトピックモデル、Doc2Vecの埋め込みとコサイン類似度を組み合わせて開示の包括性を評価した。", "p5": "開示は主に肯定的から中立的な感情で、財政と環境の課題が主要なテーマだった。報告書は包括性の3段階に分類され、多くは中程度だった（抄録）。", "fun": "役所の年次報告書は分厚く、人が全部読んで比べるのは大変です。この研究は、AIに「どんな話題を、どんな調子で、どれだけ網羅的に書いているか」を測らせ、自治体どうしを比べられるようにしました。", "unverified": "時系列の分析結果の具体的な内容は抄録からは確認できない。"}}, {"id": "jr22", "rank": 22, "headline": "時系列異常検知の方法論上の課題を整理", "title": "Addressing Methodological Challenges in Time Series Anomaly Detection", "url": "https://doi.org/10.1007/s10994-026-07183-y", "authors": "Nancy Xu ほか", "venue": "Machine Learning", "date": "2026-10-13", "citescore": 7.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "深層学習による時系列異常検知の影響力ある18論文を検討し、データ漏洩や比較基準の不明確さなど、結果を疑わしくする方法論上の問題を示した（抄録）。", "p3": "18論文をレビューし、漏洩、改変されたデータセット、不明確な比較基準という繰り返し現れる問題を整理し、新しい実証で古典的手法と深層学習の相対性能の再現を試みた。", "p5": "報告された相対性能の再現は容易でなく、古い手法は最適化していない実装でもしばしば論文より良い性能を示した。標準ベンチマークで古い手法と最新の深層学習の性能が同等という仮説は棄却できなかった（抄録）。", "fun": "新しいAIの論文では、古い方法が「負け役」として登場しがちです。この研究が古い方法を素直に作り直すと、論文に書かれたほど弱くはありませんでした。新技術の優位を主張する前に、比べ方が公平かを確かめる大切さを示しています。", "unverified": "検討した18論文の一覧は抄録からは確認できない。"}}, {"id": "jr23", "rank": 23, "headline": "スペインの介護補助で健康と幸福は改善するか", "title": "Returns to Caring? Health and Well‐Being Effects of Subsidized Long‐Term Care", "url": "https://doi.org/10.1002/pam.70136", "authors": "Joan Costa‐Font ほか", "venue": "Journal of Policy Analysis and Management", "date": "2026-10-14", "sjr": 1.741, "citescore": 4.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "スペインの2007年の公的介護制度（SAAD）が、介護を受ける人の健康とwell-beingを改善し、費用対効果も高いことを示した（抄録）。", "p3": "制度の段階的な実施とその後の改革による地域・個人の受給の外生的な差を、20年分の行政データと調査データで利用した。", "p5": "給付の利用で受け手のうつ症状が約10ポイント減り、生存確率が2.6〜3ポイント上がり、生活満足度が0.24〜0.50ポイント上がった。質調整生存年当たりの費用は欧州で一般に受け入れられる基準を下回った（抄録）。", "fun": "介護保険のような制度にお金を使う価値はあるのでしょうか。スペインでは地域ごとに制度が始まる時期がずれていたので、その差を自然な実験として使えました。うつが減るだけでなく、長生きにもつながっていたという結果は政策的に重い意味を持ちます。", "unverified": "介護者側への効果は抄録からは確認できない。"}}, {"id": "jr24", "rank": 24, "headline": "認知症介護者への低強度の資源紹介RCT", "title": "Low‐Intensity Social Care for Dementia Caregivers: A Randomized Trial", "url": "https://doi.org/10.1111/jgs.70684", "authors": "Jennifer A. Makelarski ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-10-14", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "認知症の介護者に地域資源の情報と案内支援を届ける低強度の介入（CommunityRx-Dementia）を、単盲検のランダム化比較試験で評価した（抄録）。", "p3": "都市の大学病院周辺の62郵便番号地域に住む介護者を、通常ケア群と通常ケアに介入を加えた群に割り付け、12か月後の自己効力感（主要評価項目）、孤独、支援の必要、入院・救急受診を比べた。", "p5": "健康関連の社会的リスクがある介護者（133人）で、自己効力感は差がなかった（オッズ比0.80）が、救急受診は少なかった（0.3対0.7、IRR 0.41、95%信頼区間0.19〜0.90）。リスクのない介護者（210人）では支援を要するオッズが0.31だった（抄録）。", "fun": "認知症の家族を介護する人に「近くにこんな支援がありますよ」と知らせるだけの軽い支援で、何が変わるかを調べました。介護者の自信は変わりませんでしたが、生活に困りごとを抱える人では救急外来に行く回数が減りました。小さな情報提供の思わぬ効果です。", "unverified": "事後分析の結果は探索的な位置づけと考えられる。"}}, {"id": "jr25", "rank": 25, "headline": "地域の公共空間と高齢者の精神的健康", "title": "Pathways Linking Perceived Environmental Attributes of Community Public Spaces and Older Adults’ Mental Well-Being: A Parallel Mediation Analysis of Physical Activity and Social Participation", "url": "https://doi.org/10.3390/buildings16204042", "authors": "Xin He ほか", "venue": "Buildings", "date": "2026-10-14", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "地域の公共空間の環境をどう感じるかが、屋外での身体活動と社会参加を通じて高齢者の精神的well-beingにつながる経路を示した（抄録）。", "p3": "中国瀋陽の15地域の60歳以上842人の横断調査で、機能的な支援性・回復感・交流の支援の3つの環境属性、2つの並列の媒介、WHO-5の精神的well-beingを構造方程式モデルで分析した。", "p5": "3つの属性はすべて地域活動とwell-beingに正に関連し、両方の活動経路で有意な間接効果があった。回復感は屋外の身体活動とwell-beingに、交流の支援は社会参加に最も強く関連した（抄録）。", "fun": "近所の公園が「ほっとできる場所」だと感じる高齢者ほど外で体を動かし、「人と話しやすい場所」だと感じるほど地域の集まりに参加していました。同じ公共空間でも、どんな性質が何に効くかが違うのが面白い点です。", "unverified": "横断調査のため因果関係は確認できない。"}}, {"id": "jr26", "rank": 26, "headline": "文化活動参加と高齢者の病院治療の精神疾患", "title": "Cultural Engagement and Hospital-Treated Mental Disorders in Older Adults", "url": "https://doi.org/10.1001/jamanetworkopen.2026.39041", "authors": "Pei Qin ほか", "venue": "JAMA Network Open", "date": "2026-10-14", "sjr": 3.507, "citescore": 14.3, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "英国の50歳以上の全国コホートで、芸術・文化の鑑賞に頻繁に参加する人は、病院で治療される精神疾患の発症リスクが低いことを示した（抄録）。", "p3": "英国高齢者縦断研究の8,274人を病院記録と死亡記録に最長20年結びつけ、文化参加の頻度と精神疾患の発症をCox回帰で分析した。眼疾患・耳疾患・外傷性脳損傷を負の対照アウトカムとした。", "p5": "頻繁な文化参加は精神疾患全体（HR 0.71、95%信頼区間0.62〜0.82）、認知症（HR 0.71）、物質乱用（HR 0.75）、気分障害（HR 0.73）のリスク低下と関連し、神経症性障害とは関連しなかった。負の対照アウトカムとは関連しなかった（抄録）。", "fun": "美術館や演劇に出かける高齢者は、心の病気で入院することが少なかったという結果です。「元気な人が出かけるだけでは？」という疑問に対し、関係のないはずの目や耳の病気とは関連がないことを確かめて、見かけの関係でない可能性を高めた工夫が光ります。", "unverified": "観察研究であり、因果関係の確定には至らない。"}}, {"id": "jr27", "rank": 27, "headline": "生成AIは関係の互酬性を代替できない", "title": "The illusion of algorithmic belonging: why generative AI cannot substitute for relational reciprocity in mental health social inclusion", "url": "https://doi.org/10.1108/mhsi-09-2026-0360", "authors": "Sakshi Sharma ほか", "venue": "Mental Health and Social Inclusion", "date": "2026-10-14", "citescore": 2.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "生成AIの話し相手は孤独への解決策として広がっているが、関係の互酬性を欠くため、本当の社会的包摂を損ないうると論じた（抄録）。", "p3": "関係社会学、障害の社会モデル、批判的デジタル研究、精神科リハビリテーションの文献を統合する学際的な視点から論じ、主要な会話AIを比較した。独自の実証データはない。", "p5": "生成AIは身近な感情の受け止めを提供するが、互酬性・道徳的主体性・共有された弱さを欠く。地域の市民的基盤をAIで置き換えると、恵まれた人には人間中心のケア、周縁化された人には自動化された対応という二層の精神保健体制が生まれうると指摘した（抄録）。", "fun": "AIは夜中でも話を聞いてくれますが、こちらがAIを助けることはできません。この論文は、支え合いのない一方通行の関係は本当のつながりではないと主張します。安上がりなAIが弱い立場の人だけに回される未来への警告が鋭い点です。", "unverified": "実証データを含まない論考で、主張の実証的な裏付けは確認できない。"}}, {"id": "jr28", "rank": 28, "headline": "AI推奨は環境配慮製品を売りにくいか", "title": "Are AI Recommendations Less Green? The Effects of AI Recommendation Sources and Green Product Attribute Framing on Consumer Responses", "url": "https://doi.org/10.1002/cb.70253", "authors": "Ayong Li ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-13", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "AIの推奨源（人の代わりに決めるAIか、人を補助するAIか）と、環境配慮製品の訴求の仕方（実利か持続可能性か）の組み合わせで、推奨の効果が変わることを示した（抄録）。", "p3": "自己決定理論に基づき、製品選択、選好評価、購買意図、支払意思額を測る4つのシナリオ実験（計1,114人）を行った。", "p5": "代替型AIは実利で訴求した製品で、補助型AIは持続可能性で訴求した製品でより効果的だった。消費者の統制感が媒介し、属性に基づく事後説明を加えると代替型AIの不利が解消された（抄録）。", "fun": "AIに「これを買いなさい」と言われると、人は自分で決めた感覚を失います。環境にやさしい買い物は「自分の意思で選びたい」ものなので、AIが決めてしまうと逆効果になりがちです。理由をきちんと説明すれば、その壁を越えられるというのが面白い点です。", "unverified": "効果の大きさの具体的な数値は抄録からは確認できない。"}}, {"id": "jr29", "rank": 29, "headline": "AIバーチャルインフルエンサーへの信頼と責任", "title": "How Consumers Negotiate Trust and Responsibility Towards AI ‐Generated Virtual Influencers?", "url": "https://doi.org/10.1002/cb.70266", "authors": "Tilen Pigac ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-13", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "AIが生成したバーチャルインフルエンサーに対して、消費者が信頼と責任をどう折り合わせているかを混合研究法で調べた（抄録）。", "p3": "真正性、透明性、プライバシーの懸念が、信頼、受容、責任の帰属とどう関係するかを、量的・質的な方法を組み合わせて分析した。", "p5": "消費者の反応は信頼形成だけには還元できず、人工的な主体の下で関与が許容できるかを評価していた。真正性は信頼を支え、透明性とプライバシーの懸念は統制とリスクに関する競合する解釈をもたらした。プライバシーの懸念はブランドと開発者への責任帰属を強めた（抄録）。", "fun": "実在しないAIのインフルエンサーが商品を勧めたとき、問題があったら誰の責任でしょうか。消費者は、AIそのものより、それを作ったブランドや開発者に責任を求める傾向がありました。人ではない「話し手」をどう扱うかという新しい問いです。", "unverified": "調査の対象者数と分析方法の詳細は抄録からは確認できない。"}}, {"id": "jr30", "rank": 30, "headline": "ネガティブなブランド関与と他人の不幸を喜ぶ心理", "title": "When your loss feels like my win: how negative online brand engagement and schadenfreude impact digital brand advocacy", "url": "https://doi.org/10.1108/jpbm-02-2025-5798", "authors": "Dewan Mehrab Ashrafi", "venue": "Journal of Product and Brand Management", "date": "2026-10-13", "sjr": 2.139, "citescore": 13.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "オンラインでのブランドへの否定的な関与がブランド信頼と擁護を損なう効果を、他者の不幸を喜ぶ感情（シャーデンフロイデ）が和らげるかを調べた（抄録）。", "p3": "目的的標本の314人の5件法質問紙をPLS-SEMで分析した。", "p5": "否定的な関与はブランド信頼とデジタルでのブランド擁護を下げた。シャーデンフロイデは擁護への負の効果を弱めたが、信頼への効果や信頼から擁護への関係は調整しなかった（抄録）。", "fun": "好きなブランドの悪い評判をネットで見ても、ライバル社の失敗を見て「ざまあみろ」と思うと、応援する気持ちは保たれることがあるそうです。ただし信頼そのものは回復しません。人のちょっと意地悪な感情が、ブランドへの忠誠を支えるという視点が面白い点です。", "unverified": "調査対象の国・ブランドは抄録からは確認できない。"}}, {"id": "jr31", "rank": 31, "headline": "オムニチャネル小売のサービス品質と顧客関係", "title": "Strengthening customer relationships in omni-channel retail: omni-channel service quality", "url": "https://doi.org/10.1108/k-12-2024-3350", "authors": "Mengjia Gao ほか", "venue": "Kybernetes", "date": "2026-10-13", "citescore": 7.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "オムニチャネル小売のサービス品質を、チャネル統合・実店舗・オンライン店舗の3要素に分け、顧客エンゲージメントとロイヤルティへの効果の違いを調べた（抄録）。", "p3": "精緻化見込みモデルに基づき、中国の大手小売2社の顧客のオンライン調査で、測定不変性を確認したうえで統合した310件をPLS-SEMで分析した。", "p5": "チャネル統合の品質はエンゲージメントを介してロイヤルティに間接効果をもった。実店舗とオンライン店舗の品質はエンゲージメントには効かなかったが、ロイヤルティを直接高めた（抄録）。", "fun": "お店とネット通販の両方を使う客にとって、「店で見てネットで買う」ことがスムーズかどうかは大事です。この研究では、その連携の良さが客を「ファン」にし、店やサイト単体の良さは「また買う」につながるという、役割の違いが見えました。", "unverified": "効果の大きさの具体的な数値は抄録からは確認できない。"}}, {"id": "jr32", "rank": 32, "headline": "AI推奨の視覚的文脈が消費者評価を変える", "title": "Visual Context in AI Recommendations: Implications for Consumer Evaluation and Choice", "url": "https://doi.org/10.1111/ijcs.70267", "authors": "Mingzhu Li ほか", "venue": "International Journal of Consumer Studies", "date": "2026-10-14", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "高齢者向け家具のAI推奨で、商品だけ・家庭の場面・高齢者の使用場面の3つの見せ方への反応が、高齢の本人と代わりに買う成人の子で違うかを調べた（抄録）。", "p3": "専門家7人のフォーカスグループで刺激を作り、60〜75歳の本人165人と40〜59歳の代理購入者165人の2×3の参加者間実験を行い、分散分析、構造方程式モデル、ロジスティック回帰で分析した。", "p5": "高齢の本人では、家庭の場面の提示が商品だけの提示に比べ、温かみ、家との調和、信頼、年齢の意識と正に関連した。高齢者の使用場面は家との調和と年齢の意識に関連した（抄録）。", "fun": "お年寄り向けの椅子の広告で、お年寄りが座っている写真を見せるのは良いことでしょうか。本人は「年寄り扱いされた」と感じるかもしれません。買う本人と、親のために買う子どもとで受け止め方が違うという点に目を付けた研究です。", "unverified": "代理購入者の結果と購入行動の結果は抄録からは確認できない。"}}, {"id": "jr33", "rank": 33, "headline": "医学部教員のwell-beingを多施設データで改善", "title": "Multi-Institutional Data for Faculty Well-Being Improvements Within and Across Medical Schools", "url": "https://doi.org/10.1001/jamanetworkopen.2026.39005", "authors": "Robert G. Badgett ほか", "venue": "JAMA Network Open", "date": "2026-10-14", "sjr": 3.507, "citescore": 14.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "米国の医学部28校の教員調査で、燃え尽き・エンゲージメント・満足の率と組織要因を測り、学校間・学校内の大きなばらつきと好事例の部門を示した（抄録）。", "p3": "2021〜2024年に28,919人の対象者のうち16,994人（58.8%）が回答した。I²統計量でばらつきを定量化し、平均と異なる好事例の学校・部門を特定して回帰分析した。", "p5": "燃え尽きの統合率は32%で、学校間で13〜41%（I²=75%）とばらついた。502部門のうちコミットメントと燃え尽きの両方が良好なのは67部門（13.3%）だった。部門の燃え尽き率のばらつきの32%は、学校と専門分野の率、自律・目的・所属感の率、性別・年齢で説明された（抄録）。", "fun": "同じ医学部の先生でも、どの学校・どの科にいるかで燃え尽きる割合がまったく違いました。そこで、うまくいっている「明るい場所」を見つけて、その工夫をまねしようという発想です。問題探しではなく成功例探しから組織を良くする考え方が面白い点です。", "unverified": "好事例の成功要因の具体的な内容は抄録からは確認できない。"}}, {"id": "jr34", "rank": 34, "headline": "リーダー行動と価値観の一致が医師の離職を予測", "title": "Leadership Behavior, Values Alignment, and Future Objective Turnover Among Physicians", "url": "https://doi.org/10.1001/jamanetworkopen.2026.38946", "authors": "Tait D. Shanafelt ほか", "venue": "JAMA Network Open", "date": "2026-10-14", "sjr": 3.507, "citescore": 14.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "大規模な大学医療センターの医師で、直属の上司のリーダー行動の評価が高いほど、その後2年間の実際の離職が少ないことを示した（抄録）。", "p3": "2016〜2024年の5回の組織調査（3,124人、7,351回答）を人事記録の離職と結びつけ、Mayoのリーダーシップ影響指標と価値観の一致尺度を、燃え尽きや職業的充実などを調整したCox回帰で分析した。", "p5": "リーダー行動の得点1点ごとに2年離職のハザードが下がり（HR 0.89）、調整後も残った（HR 0.88）。価値観の一致の関連（HR 0.90）は調整後には消えた。連続回答者で得点が上がると離職が減った（リーダー行動HR 0.82）（抄録）。", "fun": "「人は会社を辞めるのではなく、上司を辞める」とよく言われます。この研究は、医師が名指しで評価した上司の点数が1点上がるごとに、実際の退職が約1割減ることを人事記録で確かめました。本人の「辞めたい気持ち」ではなく実際の退職で測った点が強みです。", "unverified": "単一の医療センターのデータで、他施設への一般化は確認できない。"}}, {"id": "jr35", "rank": 35, "headline": "看護師のAI態度と仕事への関与", "title": "Artificial intelligence attitudes, presenteeism, and work engagement among nurses: a structural equation modeling approach", "url": "https://doi.org/10.3389/fpsyg.2026.1902196", "authors": "Darelglal Ahmed Gassmelseed Abdallah ほか", "venue": "Frontiers in Psychology", "date": "2026-10-14", "citescore": 7.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "サウジアラビアとエジプトの病院看護師で、AIへの肯定的な態度がプレゼンティーイズム（体調不良での出勤による生産性低下）を減らし、ワークエンゲージメントを高める関連を示した（抄録）。", "p3": "仕事の要求度-資源モデルに基づく横断調査（最終802人）を、構造方程式モデルとブートストラップの媒介分析、多母集団の不変性分析で分析した。", "p5": "AI態度はプレゼンティーイズムと負（β=−0.366）、エンゲージメントと正（β=0.436）に関連し、プレゼンティーイズムが部分的に媒介した（間接効果β=0.092）。モデルはエンゲージメントの分散の約33.2%を説明した（抄録）。", "fun": "AIを前向きに受け止める看護師ほど、無理して働いて効率が落ちることが少なく、仕事に打ち込めていました。ただし同じ時点の質問紙なので、「元気な人ほどAIに前向き」という逆向きの説明も否定できません。著者も関連にとどまると述べています。", "unverified": "横断調査のため因果の方向は確認できない。"}}, {"id": "jr36", "rank": 36, "headline": "AIニュースの受容と記者代替への支持", "title": "The impact of artificial intelligence on journalism: How media trust and attitudes toward journalists shape acceptance, trust, willingness to pay for AI news, and support for replacing journalists", "url": "https://doi.org/10.1177/14648849261496571", "authors": "Manuel Goyanes ほか", "venue": "Journalism", "date": "2026-10-14", "sjr": 2.087, "citescore": 8.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "スペインとドイツの市民調査で、報道へのAI利用に対する受容、信頼、支払意思、記者の代替への支持はいずれも中程度から低いことを示した（抄録）。", "p3": "スペイン（2,337人）とドイツ（2,213人）の横断調査で、メディアへの信頼と記者への態度が、AIニュースへの態度にどう影響するかを分析した。", "p5": "記者への好意的な態度はAI報道への見方を良くし、メディアへの信頼の効果は混在した。全体として、AI報道への態度はAI一般への見方とそろい、メディアや記者への意見より個人のAI観が強く効いた（抄録）。", "fun": "AIが書いたニュースにお金を払いますか？2つの国の人々の答えは、どちらも慎重でした。面白いのは、記者を好きな人ほどAI報道にも好意的だったことです。AI対人間という対立より、ニュースそのものへの関心が鍵なのかもしれません。", "unverified": "効果の大きさの具体的な数値は抄録からは確認できない。"}}, {"id": "jr37", "rank": 37, "headline": "沿岸都市の夜間光害対策への住民の支持", "title": "Public perceptions and (lack of) support for mitigation of artificial light at night in coastal cities", "url": "https://doi.org/10.1007/s13280-026-02478-9", "authors": "Olivia Raquel Rendon Thompson ほか", "venue": "Ambio", "date": "2026-10-13", "sjr": 1.904, "citescore": 13.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "チリの沿岸2都市の住民が夜間の人工光（光害）をどう認識し、対策をどれだけ支持するかを調べた（抄録）。", "p3": "住民調査で、人工光の社会的便益と生態系への影響の認識、対策への支持、環境リテラシーの関係を分析した。", "p5": "住民は照明の社会的便益を認める一方、沿岸・海洋生態系への影響の認識は限られていた。対策への支持は社会的便益が保たれるかどうかに左右され、環境リテラシーが高いほど対策を受け入れた（抄録）。", "fun": "街灯は夜の安心に欠かせませんが、海辺の生き物には迷惑なこともあります。住民は明かりの便利さはよく分かっていても、海への影響はあまり知りませんでした。光の問題を技術だけでなく、人々の合意づくりの問題として捉えた点が新鮮です。", "unverified": "調査の対象者数は抄録からは確認できない。"}}, {"id": "jr38", "rank": 38, "headline": "インフラ格差と見た目の豊かさ・犯罪", "title": "Seeing prosperity, confronting crime: Infrastructure inequality and perceived wealth in Chinese cities", "url": "https://doi.org/10.1016/j.landusepol.2026.108373", "authors": "Ziwen He ほか", "venue": "Land Use Policy", "date": "2026-10-13", "sjr": 1.686, "citescore": 14.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、中国の都市でインフラの格差が、人々の感じる豊かさや犯罪とどう関係するかを扱う研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「街のインフラの見た目の違いが、その地域が豊かか危ないかという印象を左右するのか」というものです。目に見える道路や設備の差が、人の心の地図を作るのかという問いは身近で興味深いものです。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr39", "rank": 39, "headline": "空飛ぶクルマの離着陸場配置の空間・所得公平性", "title": "Who benefits from Urban Air Mobility? Spatial and income equity in multi-phased vertiport deployment", "url": "https://doi.org/10.1016/j.urbmob.2026.100304", "authors": "Shahriar Iqbal Zame ほか", "venue": "Journal of Urban Mobility", "date": "2026-10-14", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、空飛ぶクルマ（都市航空交通）の離着陸場を段階的に整備するとき、その恩恵が空間的・所得的に公平に行き渡るかを評価する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「新しい乗り物の駅をどこに作るかで、得をする人と取り残される人が分かれるのではないか」というものです。新技術の恩恵が誰に届くのかを最初から考えるという視点が大切です。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr40", "rank": 40, "headline": "一般化確率密度発展方程式で空中投下を計画", "title": "Ballistic Airdrop Mission Planning using Generalized Probability Density Evolution Equation", "url": "https://doi.org/10.1016/j.ast.2026.114052", "authors": "Guobin Zhang ほか", "venue": "Aerospace Science and Technology", "date": "2026-10-13", "sjr": 1.391, "citescore": 10.3, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、一般化確率密度発展方程式を使って、弾道的な空中投下の任務を計画する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「風などで揺れる投下物の落下地点を、一つの点ではなく確率の広がりとして計算し、計画に生かせるか」というものです。不確かさそのものを方程式で運ぶ発想が面白い点です。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr41", "rank": 41, "headline": "μ(I)レオロジーとB-spline MPMで粒状流の堆積と衝撃", "title": "Predicting three-dimensional granular-flow deposition and barrier impact loads using μ(I) rheology and B-spline MPM", "url": "https://doi.org/10.1007/s10035-026-01711-2", "authors": "Renrong Lin ほか", "venue": "Granular Matter", "date": "2026-10-13", "citescore": 5.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、μ(I)レオロジーとB-スプライン物質点法（MPM）で、3次元の粒状流の堆積と防護柵への衝撃荷重を予測する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「土砂や岩くずの流れを砂粒の集まりとして計算し、どこに積もり、防護柵をどれだけ強く押すかを予測できるか」というものです。粒の集まりを流体のように扱う工夫がこの分野の面白さです。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr42", "rank": 42, "headline": "水理-力学連成DEMで地震時の岩盤破壊", "title": "Effect of Pre-Existing Crack or Mineral Vein on Dynamic Fracturing Behavior of Water-Resisting Rock Mass in a Tunnel Under Seismicity: Insights from the Coupled Hydro-Mechanical Discrete Element Method", "url": "https://doi.org/10.3390/su182010473", "authors": "Fanmeng Kong ほか", "venue": "Sustainability", "date": "2026-10-14", "citescore": 8.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "活断層を横切るトンネルで、既存のき裂や石英脈が地震時の止水岩盤の破壊にどう影響するかを、水理-力学連成の個別要素法で調べた（抄録）。", "p3": "川蔵鉄道の康定第2トンネルを背景に、傾き0°・30°・60°・90°のき裂と石英脈のモデルに、主応力23.7・12.7 MPa、地下水圧3.33 MPa、水平0.8 g・5 Hzを含む地震動を与えた。", "p5": "き裂の先端が破壊の起点となり、石英脈は破断するまで進展を妨げた。全ケースでせん断破壊が支配的で、引張破壊の割合はき裂モデルで7.90〜13.15%（30°で最大）、脈モデルで7.01〜7.84%だった（抄録）。", "fun": "トンネルの周りの岩に、もともと入っているひびや石英の筋が、地震のときに水と泥の噴き出しを招くかどうかを、岩を粒の集まりとして計算しました。ひびは割れの出発点に、石英の筋は壁になるという、正反対の役割が見えたのが面白い点です。", "unverified": "実測との比較による検証は抄録からは確認できない。"}}, {"id": "jr43", "rank": 43, "headline": "静的載荷試験による複合地盤のパラメータ同定と不確実性", "title": "Parameter Identification and Uncertainty Analysis of Stone‐Column‐Reinforced Composite Foundations Constrained by Static Load Tests", "url": "https://doi.org/10.1002/nag.70458", "authors": "Fei Wang ほか", "venue": "International Journal for Numerical and Analytical Methods in Geomechanics", "date": "2026-10-14", "sjr": 0.995, "citescore": 5.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "砕石杭で改良した複合地盤のダンカン・チャン模型のパラメータを、静的載荷試験から代理模型を使って効率よく同定し、不確実性も評価した（抄録）。", "p3": "ルワンダで計画中の粘土コアロックフィルダムの地盤で、段階載荷の有限要素解析から応答標本を作り、代理模型を逆解析の反復に組み込んだ。複数の荷重段階の沈下を同時に較正し、代表的な杭でパラメータの事後分布と予測区間を求めた。", "p5": "同定したパラメータは静的載荷試験の荷重-沈下応答をよく再現し、計算コストを大幅に減らした。有限要素の逆解析とダム規模の沈下予測でも検証した（抄録）。", "fun": "地盤の固さを表す数値は、直接測るのが難しいので、試験の結果から逆算します。ただ、そのたびに重い計算を何百回も回すのは大変です。この研究は、計算の「早見表」を学習させて逆算を速くし、答えの不確かさの幅まで示しました。", "unverified": "計算時間の削減率は抄録からは確認できない。"}}, {"id": "jr44", "rank": 44, "headline": "ChatGPTのフィードバックの信頼性と学びの実感", "title": "ChatGPT’s feedback credibility and students’ perceived learning: the role of agent-related social perceptions", "url": "https://doi.org/10.1186/s41239-026-00629-2", "authors": "Raúl Pérez-López ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-10-14", "sjr": 7.947, "citescore": 48.4, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "学生がChatGPTに有能さや人間らしい共感を感じるほど、そのフィードバックを信頼し、学んだ実感が高まることを示した（抄録）。", "p3": "社会的知覚理論に基づくモデルを、学術的な作文課題を行った学生230人のデータで構造方程式モデルにより検証した。", "p5": "知覚された有能さと共感はフィードバックの信頼性と正に関連し、信頼性は学びの実感と関連した。成績という報酬に敏感な学生ほど、信頼性と学びの実感の関係は弱かった（抄録）。", "fun": "AIの添削を信じるかどうかは、内容の正しさだけでなく、AIを「賢くて思いやりがある相手」と感じるかで変わっていました。一方で、点数ばかり気にする学生は、信頼しても学んだ実感にはつながりにくいという結果も興味深い点です。", "unverified": "対象の学校・国は抄録からは確認できない。"}}, {"id": "jr45", "rank": 45, "headline": "LLMで移動目的を推定するテキスト表現と微調整", "title": "Adapting large language models for urban trip purpose inference: A domain-informed textual representation and fine-tuning framework", "url": "https://doi.org/10.1016/j.cities.2026.107680", "authors": "Chengzhi Zhang ほか", "venue": "Cities", "date": "2026-10-14", "sjr": 1.772, "citescore": 11.5, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、都市の移動の目的を推定するために、分野の知識を反映したテキスト表現と微調整で大規模言語モデルを適応させる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「スマホの位置の記録を文章に置き換えてAIに読ませれば、その人が通勤なのか買い物なのかを当てられるか」というものです。数字の記録を言葉に翻訳して言語AIに考えさせる発想が面白い点です。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr46", "rank": 46, "headline": "ペルソナを意識したLLMによるシミュレーション環境生成", "title": "Simulation Environment Generation Using a Persona-aware LLM", "url": "https://doi.org/10.5302/j.icros.2026.26.0184", "authors": "Sihyun Kim ほか", "venue": "Journal of Institute of Control, Robotics and Systems", "date": "2026-10-14", "citescore": 1.4, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、ペルソナを意識した大規模言語モデルを使ってシミュレーション環境を生成する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「AIに特定の人物像を演じさせることで、ロボットや制御の試験に使う多様な場面を自動で作れるか」というものです。登場人物の性格づけを環境づくりに使う発想が面白い点です。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr47", "rank": 47, "headline": "視覚教師付き学習でSHMセンサ網から交通監視", "title": "Automating traffic monitoring with SHM sensor networks via vision-supervised deep learning", "url": "https://doi.org/10.1016/j.measurement.2026.123364", "authors": "Hanshuo Wu ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-13", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "橋に設置した加速度計とひずみ計のSHMセンサ網だけで、画像に頼らずに通過車両を自動で分類する交通監視の手順を示した（抄録）。", "p3": "カメラ画像の解析結果から高解像度の学習データを自動生成し、センサの空間構造と相互依存をグラフニューラルネットで捉えて教師あり学習する。画像の知識をSHMセンサに移す。", "p5": "実橋の事例研究で、軽車両99%、重車両94%の分類精度を達成した（抄録）。", "fun": "橋を通る車の種類を数えるのに、普通はカメラを使います。でもカメラは夜や雨に弱く、プライバシーの問題もあります。この研究は、最初だけカメラを「先生」にして、橋の揺れや伸びのセンサに車の見分け方を教え込みました。", "unverified": "対象橋梁の形式と計測期間は抄録からは確認できない。"}}, {"id": "jr48", "rank": 48, "headline": "単眼カメラで橋の3次元振動変位を計測", "title": "A three-dimensional vibration displacement measurement method for bridges based on monocular vision", "url": "https://doi.org/10.1016/j.measurement.2026.123416", "authors": "Jiayi Xu ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-14", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を題名で探して読んだ", "preprint": false, "short": true, "p1": "橋の表面に付けたレーザー標識を1台のカメラで撮影し、面内と面外の3次元の振動変位を同時に測る方法を示した（抄録）。", "p3": "面外変位には方向認識と多尺度の文脈を高めるHBA構造とピークを重視する時間損失を、面内変位にはダウンサンプリングでの情報損失を抑える構造と空間注意、Wing損失を導入した。", "p5": "自作の橋梁振動データセットで、小振幅の条件でも3次元の振動変位を時間・周波数の両領域で高い一致度と精度で捉えた（抄録）。", "fun": "カメラ1台では、奥行き方向の動きを測るのが苦手です。この研究は、橋にレーザーで印を付け、その見え方の変化から手前・奥の揺れまで読み取りました。高価な機器を何台も並べずに、橋の立体的な揺れを測れるのが利点です。", "unverified": "誤差の具体的な数値は抄録からは確認できない。"}}, {"id": "jr49", "rank": 49, "headline": "物理情報ベイズ推定で梁の剛性分布を同定", "title": "Physics-informed Bayesian identification of spatial stiffness fields in functionally graded beams from large-deflection responses", "url": "https://doi.org/10.1016/j.compstruc.2026.108488", "authors": "Zhang-Sheng Pan ほか", "venue": "Computers and Structures", "date": "2026-10-13", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、傾斜機能材料の梁の大たわみ応答から、空間的に変化する剛性分布を物理情報つきのベイズ推定で同定する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「場所によって固さが変わる梁を大きく曲げたときの形から、どこがどれだけ固いかを確率的に逆算できるか」というものです。曲がり方という結果から中身を推理する逆問題の面白さがあります。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jr50", "rank": 50, "headline": "コピュラ付きVAEで逆動力学の不確実性定量化", "title": "A copula-based variational autoencoder for uncertainty quantification in inverse structural dynamics: Application to damage identification in an offshore wind turbine", "url": "https://doi.org/10.1016/j.probengmech.2026.104054", "authors": "Ana Fernandez-Navamuel ほか", "venue": "Probabilistic Engineering Mechanics", "date": "2026-10-13", "citescore": 6.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに題名で見つけた抄録を読んだ", "preprint": false, "short": true, "p1": "浮体式洋上風車の係留系の損傷を、少ないセンサの応答から同定する逆問題で、コピュラを使った変分オートエンコーダ（VAE）により不確実性を表す方法を示した（抄録）。", "p3": "エンコーダが応答から状態への逆演算子を、デコーダが状態と励振から応答への順演算子を近似し、周辺分布と依存構造を分けるガウスコピュラで相関した事後分布を表した。浮体の回転運動の統計量から、アンカーと生物付着の2種類の損傷の程度を推定した。", "p5": "高忠実度の合成データで、対角・全共分散のガウス分布や混合ガウス分布と比べ、ガウスコピュラVAEが扱いやすく有望な解であることを示した（抄録）。", "fun": "同じ揺れ方でも、原因となる傷み方が何通りも考えられることがあります。この研究は、答えを一つに決めつけず「この傷み方とあの傷み方がこれくらいの確率」と、互いの関係も含めて示せるAIを作りました。",
