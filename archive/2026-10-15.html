s://doi.org/10.1002/sd.71687", "authors": "Ece Avinç", "venue": "Sustainable Development", "date": "2026-10-14", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "why": "教員養成課程の学生の持続可能性への同一化の変化を縦断的に追った。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "教員を目指す学生の持続可能性（SDGs）へのアイデンティティが、教職課程の4年間でどう発達するかを4時点の縦断データで追った（抄録）。", "p3": "社会的包摂、環境保護、経済成長、正義と制度、地球的連帯の5次元からなるGlobal Goals Identity Scaleを701人で開発・検証し、650人を4年間追跡した。", "p5": "社会的包摂、経済成長、正義と制度、地球的連帯は1回目から2回目にかけて伸び、その後は横ばいだった。環境保護はほとんど変化しなかった。社会的包摂が構造モデルの中心的な位置を占めた（抄録）。", "fun": "未来の先生たちの「社会を良くしたい」という意識は、入学してすぐの時期に伸び、その後は落ち着いていました。意外にも、環境を守る意識はほとんど変わりませんでした。どの時期に何を教えるのが効果的かを考えるヒントになります。", "unverified": "調査の実施国は抄録からは確認できない。"}}, {"id": "jn18", "rank": 18, "field": "政治学", "headline": "敵対的性差別がオンライン議論を通じて男性権利運動を促す", "title": "From misogyny to mobilization: Hostile sexism and conflictual online discussions indirectly predict men's rights activism via heightened identification as a men's rights supporter", "url": "https://doi.org/10.1111/pops.70192", "authors": "Morgana Lizzio‐Wilson ほか", "venue": "Political Psychology", "date": "2026-10-14", "sjr": 1.938, "citescore": 7.6, "citescore_year": "2025", "why": "オンラインでの対立的な議論が運動への同一化を介して活動につながる過程を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "敵対的な性差別意識をもつ男性が、オンラインでの対立的な話し合いを通じて「男性の権利の支持者」としての集団同一化を強め、反動的な行動の意図につながる過程を示した（抄録）。", "p3": "2つの研究（443人、755人）で、男性が性差別尺度に答え、フェミニズムの影響についての文章を読んだ後、オンラインのチャットで集団で議論するか、一人で考えるかに割り付けた。", "p5": "敵対的性差別は支持者としての同一化を予測し、集団での議論でその関係が強かった。同一化は反動的な行動意図を予測した。意外にも効果は議論後に集団の意見が定まらなかった男性にだけ現れ、会話の分析から合意ではなく対立の中で同一化が生じていた（抄録）。", "fun": "考えの似た人と話すと意見が固まる、と思いがちです。ところがこの実験では、仲間内で意見がぶつかり合ったときにこそ、運動への帰属意識が強まっていました。対立が結束を生むという逆説が、ネット上の運動の広がり方を考えるうえで示唆的です。", "unverified": "事後の内容分析による解釈で、因果的な検証ではない。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "未来の現象を理論化する経営研究", "title": "Theorizing future phenomena: Metaverse, wearables, and humanoids", "url": "https://doi.org/10.1002/sej.70059", "authors": "Andy Wu ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-10-14", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "メタバース・ウェアラブル・人型ロボットを例に、まだ起きていない現象の理論構築を提案した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "起業と戦略の研究が、過去の現象の説明だけでなく、まだ起きていない未来の現象についても理論を作れると主張し、その方法を示した（抄録）。", "p3": "技術の趨勢から外挿する、起業家やSF作家も使う手法で、AIの進歩を前提に、メタバースでの希少性の統治、ウェアラブル機器による常時監視を前提にした組織設計、人型ロボットの知的財産権の配分の3つの現象を理論化した。", "p5": "未来に向けた理論を取り入れることで、経営研究の実務的・教育的な関連性を高められると論じた（抄録）。", "fun": "研究は普通、すでに起きたことを調べます。でもこの論文は、SF作家のように技術の行き先を想像して、まだない会社の問題を先回りして考えようと提案します。たとえば人型ロボットが発明をしたら、その特許は誰のものか、という問いです。", "unverified": "論考で、実証的な検証は含まれない。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "周囲の混雑がスマホ投資の行動を変える", "title": "Crowded Decisions: How Environmental Density Shapes Mobile Investment Behavior", "url": "https://doi.org/10.1002/mar.70286", "authors": "Pauline Engel ほか", "venue": "Psychology and Marketing", "date": "2026-10-14", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "why": "環境の密度がネオブローカーでの個人投資行動に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "スマホで株取引する個人投資家は、周囲が混雑しているほど投資する確率と金額が下がることを3つの研究で示した（抄録）。", "p3": "潜在的な投資家の周囲の混雑度が、投資の確率と金額に与える影響を3つの研究で調べ、快感と支配感の媒介を検証した。", "p5": "混雑は投資確率と投資額の低さと関連した。この効果は快感が媒介し、投資額には支配感も影響した（抄録）。", "fun": "満員電車の中でスマホの株アプリを開くと、なんとなく投資を控えたくなるようです。お金の判断は冷静に行うものと思われがちですが、周りの環境が生む気分に左右されているという結果です。", "unverified": "3つの研究の参加者数と設計は抄録からは確認できない。"}}, {"id": "jn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "グリーン技術職の男性と安全文化の変化", "title": "Workplace Health and Safety in Teal‐Collar Jobs: How Blue‐Collar Men Working With Green Technology Embrace a Shifting Culture of Masculinity", "url": "https://doi.org/10.1111/gwao.70277", "authors": "Jen Kostuchuk ほか", "venue": "Gender, Work and Organization", "date": "2026-10-14", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "why": "ブルーカラー男性が環境技術職で男らしさの文化を変えていく過程を描いた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "グリーン技術を扱うブルーカラーの男性（著者のいう「ティールカラー」職）が、健康と安全を重んじる新しい男らしさの職場文化を受け入れていることを示した（抄録）。", "p3": "ブルーカラーとグリーンカラーの仕事を組み合わせた職を「ティールカラー職」と名付け、その男性労働者の視点と労働安全衛生のリスクを調べた。", "p5": "労働者は健康と安全への敬意、仲間意識、家族に感情的に寄り添いたいという願いを特徴とする職場文化を受け入れていた。一方、熱心な環境主義は男らしさの表現の中で目立たなかった（抄録）。", "fun": "太陽光パネルの設置などで働く男性は、昔ながらの「強がる男」のイメージとは違い、安全や家族を大切にしていました。ただし、環境のために働いているという意識は強くありませんでした。脱炭素の仕事が男らしさの形を少しずつ変えている様子が見えます。", "unverified": "調査方法と対象者数は抄録からは確認できない。"}}, {"id": "jn22", "rank": 22, "field": "教育", "headline": "南アフリカの就学前児の実行機能を支える要因", "title": "Exploring a Range of Potential Factors Promoting and Constraining EF in South African Preschoolers", "url": "https://doi.org/10.1111/desc.70289", "authors": "Johanna Beukes ほか", "venue": "Developmental Science", "date": "2026-10-14", "sjr": 1.643, "citescore": 7.0, "citescore_year": "2025", "why": "低所得環境の子どもの実行機能を促進・制約する要因を幅広く検討した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "南アフリカの不利な地域の就学前児で、実行機能（作業記憶・抑制・切り替え）を予測する変えられる要因を調べた（抄録）。", "p3": "ケープタウンの15の保育施設の3〜5歳児125人にタブレットの実行機能課題を行い、養育者に家計資産・睡眠・画面時間・暴力への曝露・養育について尋ね、重回帰で分析した。22人の部分標本で毛髪コルチゾールも測った。", "p5": "年齢（β=0.37）、養育者の中等教育（β=0.22）、睡眠の問題の少なさ（β=−0.45）が実行機能の高さを予測し、合わせて分散の25%を説明した。家計資産・画面時間・暴力への曝露・養育は有意でなかった。部分標本では毛髪コルチゾールが実行機能と正に相関した（ρ=0.55）（抄録）。", "fun": "貧しい地域の子どもでも、よく眠れている子は考える力の発達が良好でした。一方で、テレビやスマホを見る時間は関係がありませんでした。ストレスホルモンが多い子ほど成績が良いという意外な結果は、厳しい環境への適応かもしれないと著者は考えています。", "unverified": "標本が小さく、コルチゾールの分析は22人の探索的なものである。"}}, {"id": "jn23", "rank": 23, "field": "物理学", "headline": "非線形円二色性で局所ベリー曲率を読む", "title": "Nonlinear circular dichroism reveals the local Berry curvature", "url": "https://doi.org/10.1038/s41566-026-02025-8", "authors": "Nele Tornow ほか", "venue": "Nature Photonics", "date": "2026-10-13", "sjr": 12.491, "citescore": 51.9, "citescore_year": "2025", "why": "光と結晶の角運動量のやり取りを、局所的なベリー曲率から説明する新しい見方を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "高調波発生で光のスピン角運動量が変わる量（非線形円二色性）が、単一の光学共鳴での局所ベリー曲率に比例することを示し、非線形光学と電子状態の量子幾何を結びつけた（抄録）。", "p3": "単層WSe2の第2高調波発生で、円偏光で時間反転対称性を破り谷の縮退を解き、第2高調波の円二色性を測った。", "p5": "第2高調波の円二色性は円偏光の強度とヘリシティで制御でき、光で調べたベリー曲率の制御と読み出しの方法を与えた（抄録）。", "fun": "光が結晶とやりとりするとき、角運動量の受け渡しは結晶の形の対称性で説明されてきました。この研究は、それが電子の状態の「曲がり具合」（ベリー曲率という量子の幾何）を直接映していることを示しました。光で量子の世界の形を読み取れるのが面白い点です。", "unverified": "定量的な比例関係の精度は抄録からは確認できない。"}}, {"id": "jn24", "rank": 24, "field": "材料科学", "headline": "自動実験室で水電解触媒の性能と費用の両立", "title": "Overcoming the Trade-off Between the Activity, Stability, and Cost of OER Catalysts for Proton Exchange Membrane Water Electrolysis in a Self-Driving Laboratory", "url": "https://doi.org/10.1021/acsenergylett.6c02486", "authors": "Daeho Kim ほか", "venue": "ACS Energy Letters", "date": "2026-10-14", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "why": "自律実験でPEM水電解用触媒の活性・安定性・費用のトレードオフを克服した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "自動合成・電気化学試験・AIによる意思決定を統合した自律実験室で、PEM水電解の酸素発生触媒の活性・安定性・原料費用を同時に最適化した（抄録）。", "p3": "組成を制約した設計空間、クラスタリングによるバッチ選択、緩和したパーセンタイルのパレート選別で、Ir–Ru–X（X=Ni, Co, Fe）の三元系を各24回の実験で探索した。", "p5": "Ir10Ru65Ni25/Cをパレート的にバランスの良い組成として見いだし、10 mA cm⁻²で過電圧211.8 mV、加速耐久試験後の劣化が小さく、イリジウム量を減らした。PEM水電解では1.8 Vで3.90 A cm⁻²、1.0 A cm⁻²で1,000時間安定に動いた（抄録）。", "fun": "高価で希少なイリジウムをできるだけ使わずに、水から水素を作る触媒を、ロボットとAIが自分で実験を計画して探しました。わずか24回ずつの実験で、性能・寿命・値段のバランスが良い組み合わせにたどり着いたのが驚きです。", "unverified": "手作業による探索との比較は抄録からは確認できない。"}}, {"id": "jn25", "rank": 25, "field": "統計学", "headline": "時間をまたぐ状態による量子最適輸送", "title": "Approach to optimal quantum transport via states over time", "url": "https://doi.org/10.22331/q-2026-10-14-2236", "authors": "Matt Hoogsteder-Riera ほか", "venue": "Quantum", "date": "2026-10-14", "sjr": 2.068, "citescore": 8.9, "citescore_year": "2025", "why": "古典的なモンジュの輸送理論の量子版を新しい角度から構成した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "古典的なモンジュの最適輸送理論の量子版を、密度行列と量子チャネルのジョルダン積（「時間をまたぐ状態」）を使って新しい角度から構成した（抄録）。", "p3": "質量分布を密度行列に、輸送計画を完全正値トレース保存写像に一般化し、両者を統合した「時間をまたぐ状態」に輸送費用が線形に依存すると仮定した。ユニタリ不変な費用の場合を詳しく解析した。", "p5": "多くの費用を解析的に計算でき、この量子輸送費用は古典的なモンジュの輸送と質的に異なることが示唆された（抄録）。", "fun": "砂山を別の形に移すのに、最も手間の少ない運び方を考えるのが最適輸送です。この考え方は今やAIや統計で大活躍しています。この研究は、それを量子の世界に持ち込むと、古典とはまったく違う性質が現れることを示しました。", "unverified": "応用上の含意は抄録からは確認できない。"}}, {"id": "jn26", "rank": 26, "field": "教育", "headline": "教育リーダーシップ研究の科学マッピング", "title": "The adaptive evolution of instructional leadership: A science mapping analysis of research on educational leadership and student learning outcomes", "url": "https://doi.org/10.1177/17411432261498387", "authors": "Haim Shaked ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-14", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "why": "教育リーダーシップと学習成果の研究の変遷を計量書誌学的に整理した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ（計量書誌学的研究）", "preprint": false, "short": true, "p1": "1974〜2025年の教育リーダーシップと学習成果の研究420本を科学マッピングで分析し、教授的リーダーシップが概念の適応性によって中心的な位置を保ってきたことを示した（抄録）。", "p3": "3つの発展期間に分けた縦断的な科学マッピングで、リーダーシップ関連のテーマの構造的な統合と置き換わりを調べた。", "p5": "テーマは置き換わるのではなく構造的に統合が進み、変革型・分散型などのテーマは、教員の力量・専門的学習・信頼・組織風土といった媒介要因の周りで重なりを強めた。教授的リーダーシップは効果量の大きさではなく概念の適応性で中心性を保った（抄録）。", "fun": "校長のリーダーシップには「変革型」「分散型」など次々と新しい名前が付けられてきました。50年分の論文を地図にすると、それらは別々に生まれては消えるのではなく、一つの考え方の周りに寄り集まっていました。学問の流行の移り変わりを見る面白さがあります。", "unverified": "計量書誌学的分析で、教育効果そのものの検証ではない。"}}, {"id": "jn27", "rank": 27, "field": "教育", "headline": "ノルウェーの教室での個人化と集団性", "title": "Enacting Multiple Childhoods: Micro‐Politics of Individualization and Collectivity in Norwegian Classrooms", "url": "https://doi.org/10.1111/josi.70086", "authors": "Ingvild Kvale Sørenssen ほか", "venue": "Journal of Social Issues", "date": "2026-10-14", "sjr": 1.309, "citescore": 9.6, "citescore_year": "2025", "why": "デジタル化が進む学校で、子ども期のあり方がどう形作られるかを分析した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "ノルウェーの5年生の教室で、デジタル技術や座席配置などが、自律的な個人と協働する参加者という2つの学習者像を同時に作り出していることを示した（抄録）。", "p3": "関係論的な存在論に立つ焦点化エスノグラフィーとして、2日分の授業の録画と、教員・生徒への4回のフォーカスグループ面接を分析した。", "p5": "学習者は自己調整で進む自律的な個人と、集団の実践に加わる協働的な参加者として、絡み合いながら形作られていた。デジタル技術・学習計画・座席配置は個別学習を促し、友だちとのやりとりや空間配置が共同の関与の瞬間を生んでいた（抄録）。", "fun": "タブレットで一人ずつ自分のペースで学ぶ授業と、みんなで話し合う授業。ノルウェーの教室では、その両方が同じ時間の中で入り混じっていました。机の並べ方や道具が、子どもの「あるべき姿」をどう形作るかに目を向けたのが面白い点です。", "unverified": "1つの教室の事例研究で、一般化は確認できない。"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "近似保証つきの不完全多重カーネルクラスタリング", "title": "Efficient Incomplete Multiple Kernel Clustering With Approximation Theoretical Guarantees", "url": "https://doi.org/10.1109/tpami.2026.3742483", "authors": "Weixuan Liang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-13", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "欠測のある多視点データのクラスタリングを近似理論の保証つきで効率化した。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、欠測のある多視点データに対する多重カーネルクラスタリングを、近似理論の保証つきで効率化する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「いくつもの角度から集めたデータの一部が欠けていても、似たもの同士のグループ分けを速く、しかも理論的な保証つきで行えるか」というものです。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "勾配の周波数の均衡がアルゴリズム推論を助ける", "title": "Balancing Gradient Frequencies Facilitates Inductive Inference in Algorithmic Reasoning", "url": "https://doi.org/10.1109/tpami.2026.3742445", "authors": "Bong Gyun Kang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-13", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "勾配の周波数成分の偏りを正すことで帰納的推論を改善する。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、学習時の勾配の周波数成分を均衡させることで、アルゴリズム的な推論の帰納的推論を改善する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「ニューラルネットが計算の手順そのものを覚え、より長い問題にも通用させるには、学習の信号のどの『音の高さ』を整えればよいか」というものです。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jn30", "rank": 30, "field": "機械学習", "headline": "ハイパーグラフU-Netでハイパーグラフ学習を拡張", "title": "Beyond Convolution: Advancing Hypergraph Neural Networks with Hypergraph U-Nets", "url": "https://doi.org/10.1109/tpami.2026.3743238", "authors": "Fuli Wang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-13", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "畳み込みを超えたハイパーグラフニューラルネットの構造を提案した。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "多者間の関係を表すハイパーグラフに、画像処理で成功したU-Net構造を初めて本格的に導入した（抄録）。", "p3": "階層的クラスタリングの樹形図を異なる粒度で切ることで、プーリングとアンプーリングの演算子を一度にまとめて作る並列階層プーリング（PHPool）と、その逆演算のPHUnpoolを提案した。", "p5": "ハイパーグラフの再構成シミュレーション、ハイパーグラフ分類、ノード単位の異常検知で、既存の最先端のグラフ・ハイパーグラフ深層学習法を上回った（抄録）。", "fun": "「3人以上で同時につながる関係」（共同研究のチームなど）を扱うのがハイパーグラフです。画像では、いったん縮めてから元に戻すU字型の構造がよく効きます。この研究は、関係の網目を壊さずに縮めて戻す方法を工夫しました。", "unverified": "性能差の具体的な数値は抄録からは確認できない。"}}, {"id": "jn31", "rank": 31, "field": "機械学習", "headline": "複数経路の学習で検出Transformerを改善", "title": "Mr. DETR++: Instructive Multi-Route Training for Detection Transformers with Mixture-of-Experts", "url": "https://doi.org/10.1109/tpami.2026.3743281", "authors": "Chang-Bin Zhang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-13", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "専門家混合を使う複数経路の学習で検出Transformerを強化した。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "物体検出のTransformerを、一対一と一対多の予測を同時に行う多課題の枠組みとみなし、学習時だけ使う複数経路の学習法を提案した（抄録）。", "p3": "デコーダの各要素が両方の目標を学べることを示し、主経路と2つの補助経路を設けた。第1補助経路に物体クエリを導く自己注意を、第2補助経路に経路を意識した専門家混合を導入し、補助経路は推論 結果のいずれも確認できない。"}}, {"id": "jn34", "rank": 34, "field": "統計学", "headline": "多因子資産価格モデルのGMM推定の効率と価格精度", "title": "The Efficiency vs. Pricing Accuracy Trade-Off in GMM Estimation of Multifactor Linear Asset Pricing Models", "url": "https://doi.org/10.1080/07350015.2026.2743244", "authors": "Juan Arismendi-Zambrano ほか", "venue": "Journal of Business & Economic Statistics", "date": "2026-10-14", "sjr": 3.508, "citescore": 5.9, "citescore_year": "2025", "why": "GMM推定における効率性と価格付け精度のトレードオフを分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を題名で探して読んだ", "preprint": false, "short": true, "p1": "多因子の線形資産価格モデルをGMMで推定するとき、ベータ表現と確率的割引因子（SDF）表現では、推定の効率と価格付けの精度にトレードオフがあることを示した（抄録）。", "p3": "ブートストラップ・シミュレーションと解析的近似で、同値な2つの表現でのGMM推定量の分散を比べて検定した。", "p5": "SDF表現は効率が低いが価格付けはより正確だった。このトレードオフは因子の高次モーメントが主に生み、標本外ではベータ表現のリスクプレミアム推定の効率が勝り、取引の演習で標本外のシャープレシオが上がった（抄録）。", "fun": "同じ理論を2通りの式で書くと、数学的には同じなのに、データから推定すると結果の質が変わります。一方はぶれが小さく、もう一方は値付けが正確でした。どちらの書き方を選ぶかで投資の成績まで変わるという点が面白いところです。", "unverified": "使用したデータの期間と資産は抄録からは確認できない。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "大規模言語モデルのゼロショット事後量子化", "title": "Efficient Zero-Shot Post-Training Quantization of Large Language Models", "url": "https://doi.org/10.1016/j.neunet.2026.109750", "authors": "Sami Ul Haq ほか", "venue": "Neural Networks", "date": "2026-10-13", "sjr": 1.545, "citescore": 10.9, "citescore_year": "2025", "why": "追加データなしでLLMを効率的に量子化する方法を提案した。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、追加データなしで大規模言語モデルを学習後に効率よく量子化（数値の桁数を減らして軽量化）する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「巨大なAIの中の数値を粗く丸めて小さなパソコンでも動くようにするとき、手本となるデータなしでも賢さを保てるか」というものです。", "unverified": "データ、方法、結果のいずれも確認できない。"}}, {"id": "jn36", "rank": 36, "field": "統計学", "headline": "応用言語学の質問紙データの心理測定ネットワーク分析", "title": "Psychometric network analysis of questionnaire data in applied linguistics", "url": "https://doi.org/10.1016/j.rmal.2026.100384",     "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
