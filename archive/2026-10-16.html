<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-16", "intro": "プレプリントの新着1,308件、学術誌の新着2,884件（うち上位10%誌2,537件）、重要論文の候補365件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目50報、オープンデータ31件です。取得できなかった情報源はありません（NBERの新着は0件でした）。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "LLMは10-Kから複式簿記の関係を抽出できるか", "title": "FinGREAT: Evaluating LLMs on Financial Graph-guided Retrieval And Typing", "url": "https://arxiv.org/abs/2610.19240", "authors": "Ashman Mehra ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Mehra, A., Routledge, B., Pyo, J. J. Y., & Liang, P. J. (2026). FinGREAT: Evaluating LLMs on Financial Graph-guided Retrieval And Typing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19240", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 問題定式化、§4 実験方法、§5 結果、§6–7 結論・限界）を読んだ", "preprint": true, "p1": "複式簿記の勘定11ノード・取引11エッジの「会計グラフ」を手がかりに、LLMが10-K（年次報告書）の経営者による討議（Item 7）から取引の証拠となる文章を見つけ、どの会計関係に当たるかを分類できるかを、公開重みモデルと商用モデルで系統的に測った。", "p2": "財務テキストのLLMベンチマークは質問応答や分類が中心で、スキーマ（会計の構造）に導かれて文書全体から証拠を探す能力は評価されてこなかった（§1、抄録）。会計恒等式 Equity = Assets − Liabilities（式1）の下で、Item 7が語る取引はすべて11エッジのいずれかに対応するはずで、この領域固有の完全性が課題設定の根拠になる（§3.1）。", "p3": "課題Iは、Item 7本文とグラフの関係定義を与え、各抜粋 x=(s, ê, T)（文章・割り当てたエッジ・説明タグ）を出力させる「グラフ条件付き証拠抽出」（§3.2、式2）。本文は約4096トークンに分割して渡す（§4.2）。課題IIは、文章とグラフを与えて会計関係を1つ選ぶ分類で、人手の正解集合 Y_i に含まれれば正解（§3.3、式3–4）。評価は抽出の分布、商用参照モデルとの一致（再現率・Jaccard・条件付き分類精度）、タグとエッジの一貫性（純度・条件付きエントロピー）、人手に基づく分類精度の4軸（§3.4）。", "p4": "課題Iは2000〜2025年の1,300件の10-K Item 7（年50件）で、Gemma・Nemotron・Qwen・Ministral・Phiの公開重み5モデルをGemini・Claude・GPTの商用参照と比べる。課題IIは全モデルが抽出した500候補文章を会計の査読者3名（教授1名、博士課程2名）が注釈し（Krippendorffのα=0.764）、無関係を除いた483文章（259企業年）で、36B未満の公開重み34モデルと商用10モデルを比較する。推論機能は無効または最低に設定し、公開重みモデルはH100 1枚でBF16で動かす（§4.3–4.4）。", "p5": "抽出の配分は26年間一貫してモデルごとに偏り、PhiとNemotronは資本エッジ、GemmaとQwenは純利益エッジ、Ministralはキャッシュフローエッジを多く拾う（図3、§5.1）。Ministralは抽出量が最多で参照に対する再現率も最高だが、Jaccardでは多くの参照に対してGemmaとQwenに劣り、同じ証拠に同じエッジを当てる条件付き精度はGemmaが一貫して首位（表3、§5.1）。タグの純度はQwenが最高（表4、§5.2）。分類精度は最良の公開重みモデルが84.1%で商用の首位（92.8%、抄録）に8.7ポイント劣り、差はキャッシュフローエッジで14.3ポイント、純利益エッジで2.8ポイント、資本エッジで6.4ポイント（表5、§5.3）。Qwen3.5-27BとQwen3.6-27Bは同じ84.1%でも77の誤りのうち共有は60に留まる（§5.3）。", "p6": "著者は、評価が米国10-Kの叙述部分と固定グラフに限られ、数値推論や表の解釈は含まないこと、課題Iは人手の網羅的正解ではなく商用モデルの出力との一致を測っていること、推論機能を抑えた設定のため推論を有効にすれば順位が変わりうることを限界として挙げる（§7）。解釈：配当が「distribution」と書かれるなど同じ取引の表現の多様性がキャッシュフロー分類を難しくしているという専門家の所見（§5.3）は、固定スキーマと自然言語の間の語彙のずれが主な壁であることを示唆する。", "fun": "会社の年次報告書には「設備投資を増やした」「配当を払った」といった文章が散らばっているが、簿記の世界ではそれらはすべて11種類の「お金の流れ」のどれかに当てはまる。この研究は、その11種類の地図を持たせてAIに報告書を読ませ、文章を地図の上に置かせた。面白いのは、同じ点数のAI同士でも間違える場所が違うことと、「配当」を「分配」と書き換えるだけでAIが迷うこと。人間の会計士なら気にしない言い換えが、機械には壁になる。", "unverified": "表3・表4の具体的な数値は本文の表を読み切れておらず未確認。"}}, {"id": "pr02", "rank": 2, "headline": "LLM社会に過激派が入ると集団はどう動くか", "title": "When Extremists Enter LLM Societies: Investigating Extreme Behavior in Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.19863", "authors": "Guo Chen ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Chen, G., Xie, H., Li, Z., Li, R., Lu, Y., Shi, H., Xu, B., & Huang, J. (2026). When Extremists Enter LLM Societies: Investigating Extreme Behavior in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19863", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 過激派エージェントの定式化とEXAM、§4 実験と結果、§5 結論、限界）を読んだ", "preprint": true, "p1": "LLMエージェントによる社会シミュレーションに、立場を変えない少数の「過激派」エージェントを制御して投入する枠組みEXAMを作り、1%程度の持続的な極端行動者でも集団の意見や協力が大きく動くことを4つの場面で示した。", "p2": "既存のLLM社会シミュレーションは代表的なペルソナと平均的な行動を重視するが、社会科学では持続的な「尾の行動者」が集団力学を不釣り合いに動かすことが知られている。LLMでは行動者を固定のスカラー状態に還元できず、プロンプト・自然言語の履歴・バックボーンの生成が行動と影響を媒介する（抄録、§1）。", "p3": "社会学の3つの規則性を、立場の不動性（P1：応答が毎ラウンド同じ）、非対称な相互作用（P2：非過激派のほうが変わる）、行動の極端さ（P3：7件法の1か7、またはIPDでの持続的裏切り）として定式化し、システムプロンプトだけで過激派を作る（微調整なし、§3.2）。EXAMは場面の指定、エージェント構築、配置と相互作用、計測と比較の4段階で、過激派の比率ρ・配置・伝播モデル（SI/SIR）・計測インターフェースを制御する（§3.3）。集団の変化は、各次元の最終平均と基準条件の平均の差に符号を掛けた「過激派方向のドリフト」Δ_k（式2）で測り、正なら過激派の指定値へ動いたことを意味する。", "p4": "ProSim上で104エージェント、既定バックボーンはDeepSeek-V4-Flash、温度0.7、3シードの平均。既定では5体の過激派を無作為配置し、SIモデルで伝播、平均絶対変化が0.15未満になるか5ラウンドで停止する（§4.2）。4場面はRQ1 連邦議会選挙（バックボーン比較）、RQ2 金融危機（比率0/1/5/10体）、RQ3 感染症の世論（配置×伝播）、RQ4 5ラウンドの反復囚人のジレンマ（§4.1）。", "p5": "RQ1：GPT-5.5、DeepSeek-V4-Flash、Qwen3.6-Plusの平均ドリフトは+2.782、+2.894、+2.861（7件法）で77%超のエージェントが極に寄り二峰性係数0.650以上だが、Claude Sonnet 4.6は+0.899で極に寄るのは41.8%に留まり、過激派が孤立した小集団を作る（表1・表2、§4.3）。安全ガードレールは一度も作動していない。RQ2：過激派1体（約1%）で行平均ドリフト2.796、5体で2.830、10体で2.825と、1体でほぼ全効果が出る（表3、§4.4）。RQ3：Central+SIRが+3.662で最大、他は+3.109〜+3.372（表4、§4.5）。RQ4：協力率はGPT-5.5で0.954→0.830、GLM-4.7で0.779→0.654、DeepSeekの1行動あたり平均利得1.538は過激派なしより30%超低い（図3、§4.6）。", "p6": "著者は、LLMエージェントが人間の近似に過ぎず人間社会への因果的含意は未検証であること、過激派がプロンプト依存で言い回しや修辞の強さで結果が変わりうること、場面・人口規模・ネットワーク・モデルが限られ、基準条件の標本変動を推定していないことを挙げる（Limitations）。また、選挙不正の語りや取り付け騒ぎの呼びかけが拒否なしに生成された点を二重用途のリスクとして明記する（Potential Risks）。解釈：RQ2で1体と10体の差が0.034しかないのは、この場面・モデルでの観察であり、一般的な飽和閾値とは読めないと著者自身も注意している。", "fun": "100人の町で「絶対に意見を変えない人」が1人いるだけで、町全体の意見が大きく傾いた。しかも5人でも10人でも効果はほぼ同じで、人数よりも「決して折れない」ことが効いている。面白いのは、使うAIによって町の反応がまったく違うことで、あるAIでは皆が引きずられ、別のAIでは過激派が孤立したまま終わった。AI社会の「空気」は、住民を演じるAIの性格で決まる。", "unverified": "表3（RQ2）の次元別の数値と図表キャプションの一覧は読み切れておらず未確認。"}}, {"id": "pr03", "rank": 3, "headline": "デジタルツインが「影」で止まる構造的理由", "title": "Why Digital Twins Stall at the Digital Shadow: Data Lifecycle Fragmentation as the Structural Barrier to Built Environment Maturity", "url": "https://doi.org/10.2139/ssrn.7610944", "authors": "James Carrington", "venue": "SSRN", "date": "2026-10-14", "apa": "Carrington, J. (2026). Why Digital Twins Stall at the Digital Shadow: Data Lifecycle Fragmentation as the Structural Barrier to Built Environment Maturity. https://doi.org/10.2139/ssrn.7610944", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "建設・不動産分野のデジタルツインが「デジタルシャドウ」（一方向のデータ流れ）の段階で止まる原因を、センシングや相互運用性ではなく「データライフサイクルの断片化」に求め、成熟度評価の枠組みを作り直すべきだと論じた。", "p2": "デジタルツインは物理資産とデジタル対応物の双方向・全ライフサイクルの統合を約束するが、実装は一方向のデータ流れと限定的な運用統合に留まる。従来はこれを技術的なセンシングの問題と捉えてきた（抄録）。", "p3": "建設環境のデジタルツイン112事例の系統的レビュー、ライフサイクルデータ統合研究、引き渡し研究の証拠を統合し、設計→施工→運用の移行で失われるデータの連続性・文脈・追跡可能性を構造的な制約として位置づける。調達による断片化、工程ごとに最適化されたツール群、プロジェクト完了後も残る所有者管理の記録系の欠如という機構を挙げる（抄録）。", "p4": "検証は実験ではなく文献統合で、112事例の成熟度分布とライフサイクルデータ網羅性の弱さの一貫性を根拠とする（抄録）。", "p5": "実装の60.7%が成熟度レベル2に集中し、ライフサイクルデータの網羅性はすべての応用領域で持続的な弱点だった（抄録）。", "p6": "抄録からは、事例の選定基準や成熟度レベルの定義、機構の因果的な検証方法は読み取れない。背景：デジタルシャドウは物理→デジタルの一方向の自動データ流れを持つが、デジタル→物理の制御はない段階を指す。", "fun": "「橋や建物のデジタルの双子」はよく聞くが、実際にできているのはほとんど「影」にすぎない、という指摘だ。原因はセンサの性能ではなく、設計会社・施工会社・管理者がそれぞれ別のソフトと契約でデータを扱い、建物が完成した瞬間にデータの糸が切れてしまうこと。技術の問題だと思われていたものが、実は契約と組織の問題だった。", "unverified": "112事例の出典と成熟度レベルの定義は抄録から確認できない。"}}, {"id": "pr04", "rank": 4, "headline": "LLMは経済実験の被験者になれるか：レビュー", "title": "Just a Simulation? A Review of Large Language Models as Subjects in Experimental Economics", "url": "https://doi.org/10.2139/ssrn.7613458", "authors": "Ayato Kitadai ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Kitadai, A., & Nishino, N. (2026). Just a Simulation? A Review of Large Language Models as Subjects in Experimental Economics. https://doi.org/10.2139/ssrn.7613458", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMエージェントを経済実験の被験者として使う研究を概観し、現状では人間の行動分布を再現できないため、倫理審査前の探索に用い、仮説検証は人間の実験で行うという役割分担を提案した。", "p2": "LLMエージェントが多くの実験結果を再現せず、人間の行動の分布と一致しないという証拠が蓄積している中で、この文献がそのギャップをどう埋めようとしてきたかを整理する必要がある（抄録）。", "p3": "文献を人間行動への忠実度の5つの次元に沿って整理し、人間の代わりにLLMエージェントを使うことへの主な批判を検討する（抄録）。", "p4": "レビューであり独自の実験はない。評価の基準は、LLMエージェントが人間の実験結果と行動分布をどの程度再現するかである（抄録）。", "p5": "主要な結論は、LLMシミュレーションは倫理審査前の探索に最も適し、仮説の検証は人間参加者の実験で行うべきだというもの。このように使えば、Simon (1959) がコンピュータに期待した強力な道具になりうる（抄録）。", "p6": "5つの忠実度の次元の具体的内容と、どの種の実験で再現に失敗するかの詳細は抄録からは読めない。解釈：「探索に使う」という提案は、LLMエージェントを人間の代替ではなく、実験設計の下書きに使うという位置づけである。", "fun": "「AIに人間のふりをさせて経済実験をすれば、被験者を集めなくていい」という夢に対し、この総説は冷静に「今のAIは人間の行動のばらつきを再現できない」とまとめる。ただし全否定ではなく、本番の実験の前に「どんな結果が出そうか」を試す下書きとしてなら強力だ、と役割を与えている。道具の使いどころを決める、という結論が実務的だ。", "unverified": "5つの忠実度の次元の名称は抄録にない。"}}, {"id": "pr05", "rank": 5, "headline": "実在の経営トップをLLMで仮想再現する枠組み", "title": "Using Large Language Models to Construct Virtual Top Managers", "url": "https://doi.org/10.2139/ssrn.7611578", "authors": "Antonio Garzón-Vico ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Garzón-Vico, A., Komalapati, K., Shahid, A., & Rosier, J. (2026). Using Large Language Models to Construct Virtual Top Managers. https://doi.org/10.2139/ssrn.7611578", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "実在する経営トップの公開発言と道徳基盤理論に基づいてLLMペルソナを構築し、行動実験に使える「仮想経営者」を作って検証する方法論的枠組みを示した。", "p2": "経営トップのような重要な行為者は直接の実験参加を得にくく、組織研究はその判断を実験的に調べる手段を欠いていた（抄録）。", "p3": "公開されているCEOのコミュニケーションを入力に、道徳基盤理論（Moral Foundations Theory）を足場として個々のリーダーの応答を近似するLLMベースのペルソナを構築する。3段階で、入力と出力の整合、確立された人間の道徳判断パターンとの行動的対応、確率的な実行間の信頼性を評価する（抄録）。", "p4": "評価の基準は、ペルソナが既知の人間の道徳判断パターンを再現するか、同じ入力に対して実行ごとに安定した応答を返すかである（抄録）。", "p5": "理論的に足場を与えたペルソナは、確立された人間のパターンを再現した。これはLLMペルソナを組織研究の方法論的道具として使う初期的な支持になる（抄録）。", "p6": "抄録からは、対象とした経営者の人数、使用したLLM、人間パターンとの一致の数値は読み取れない。残る疑問として、公開発言が整えられた広報文である場合に、個人の判断をどこまで反映するかがある。", "fun": "有名企業のCEOに「この状況でどう判断しますか」と直接聞くことはまずできない。この研究は、CEOの講演や手紙など公開された言葉からAIの「分身」を作り、代わりに答えさせる。面白いのは、ただ言葉を真似させるのではなく、人の道徳判断を5〜6種類の土台に分ける心理学の理論を骨格に使った点で、理論を「足場」にするとAIの分身が人間らしいパターンを再現した。", "unverified": "対象経営者の人数と一致度の数値は抄録にない。"}}, {"id": "pr06", "rank": 6, "headline": "特異反発する相互作用粒子系のドリフト推定", "title": "Drift parameter estimation for interacting particle systems with singular repulsion", "url": "https://arxiv.org/abs/2610.20090", "authors": "Chiara Amorino ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Amorino, C., Malecki, J., & Shevchenko, R. (2026). Drift parameter estimation for interacting particle systems with singular repulsion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20090", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§1.1 動機と主要アイデア、§2.2–2.3 主要定理）を読んだ。§3の数値実験の表は読み切れていない", "preprint": true, "p1": "粒子同士が1/(x_i − x_j) の形で特異に反発する相互作用粒子系について、尤度が使えない困難を「二次の経験モーメントが満たす1次元の正則な確率微分方程式」への厳密な還元で回避し、相互作用パラメータβの明示的な推定量と、粒子数N→∞での一致性・漸近正規性を証明した。", "p2": "特異なドリフトは標準的な尤度・コントラスト法が前提とする正則性を満たさず、直接の推定ができない（抄録、§1）。動機となるのはスケール付きDyson Brown運動（式1.1）で、未知の反発係数β>0と既知の微視的ノイズ分散ε_Nを持つ。", "p3": "二次の経験モーメント Y_N(t) = (1/N)Σ(X^i)^2（式1.2）に伊藤の公式を使うと、対称性により特異項が厳密に打ち消され、dY_N = 2√(ε_N/N)√(C_N) dW + (B_N + 2βA_N) dt（式1.6）という1次元のSDEになる。ここでA_N・B_N・C_Nは観測できる経験過程で、βは線形に入る。これを推定方程式とし、連続観測では情報量 J_N = ∫A_N²/C_N dt を用いて β̂ = (1/2J_N)∫(A_N/C_N)(dY_N − B_N dt)（§2.2）、離散観測ではそのEuler近似（式2.6）を使う。統計的な自然な速さは r_N = √(N/ε_N) で、ε_N = N^{-α} なら N^{(1+α)/2}（式1.4）。", "p4": "良さの基準は、N→∞での一致性と、到達しうる平均場極限の情報量 J(μ) がすべて同じ定数 J_∞ になるという追加条件（式2.3）の下での漸近正規性 √(N/ε_N)(β̂ − β) → N(0, J_∞^{-1})（定理1）。離散観測では観測メッシュ Δ_n → 0 で一致性、Δ_n√(N/ε_N) → 0 で漸近正規性が保たれる（定理2）。", "p5": "反発核Hが厳密に正の場合に定理1・2が成り立つ。Hが零を持つ退化した場合は β>1 と ε_N = 1/N の下で、速さNの漸近正規性 N(β̂ − β) → N(0, J_∞^{-1}) を得る（定理3）。離散観測では NΔ_n → 0 が条件（定理4）。例としてDyson Brown運動、Dyson Ornstein–Uhlenbeck過程、Wishart–Laguerre粒子系を扱い、r_N² MSE が J_∞^{-1} に近づくかを数値で検討する（§3）。", "p6": "漸近正規性は到達しうる平均場極限がすべて同じ情報量を与えるという条件に依存し、一致性にはこの条件は不要（§1.1）。退化した場合は初期配置を開いたチェンバーに限っており、衝突した初期条件は例ごとに扱う必要がある（注1）。数値実験の具体的なバイアス・MSEの値は本稿では読み切れていない。背景：Dyson Brown運動はランダム行列の固有値の運動を記述する代表的な特異相互作用系である。", "fun": "互いに反発する粒子の群れの動きから「反発の強さ」を推定したいが、粒子が近づくと反発の式が無限大になるので、普通の統計の道具が壊れてしまう。ところが「全粒子の位置の二乗の平均」という一つの量だけを見ると、無限大の項が左右で打ち消し合って、きれいな1本の式になる。難しい問題を正面から解くのではなく、都合のよい量を見つけて問題を消す、という数学らしい解き方だ。", "unverified": "§3の数値実験の結果（バイアス・MSE）は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "二人っ子政策が女性監査人の監査品質と昇進を下げた", "title": "When Fertility Policy Meets Audit Profession: Motherhood, Audit Quality, and Career Advancement", "url": "https://doi.org/10.2139/ssrn.7609699", "authors": "Jing Chen ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Chen, J., Li, J., Wang, M., Zang, Y., & Zheng, D. (2026). When Fertility Policy Meets Audit Profession: Motherhood, Audit Quality, and Career Advancement. https://doi.org/10.2139/ssrn.7609699", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国の2016年「全面二人っ子政策」を出産期待への外生ショックとして用い、出産期の女性監査人の監査品質が相対的に低下し、昇進でも不利になることを示した。", "p2": "母親になることが監査品質とキャリアに与える影響は、出産の選択が内生的であるため因果的に識別しにくかった。政策変更が出産期待を外から動かすことで識別が可能になる（抄録）。", "p3": "政策後、出産年齢の女性監査人と他の監査人を比較し、監査品質を財務修正再表示の確率と裁量的発生高で測る。機構として仕事–家庭の役割葛藤と、名声ある顧客・新規契約・業界専門家の指導へのアクセスを制限する職場の不利を検討し、省の伝統的ジェンダー規範や差別の強さ、監査事務所の女性親和性・社会的責任で異質性を見る（抄録）。", "p4": "監査品質の指標は修正再表示の確率と裁量的発生高の大きさ、キャリアの指標はパートナー昇進・業界専門家の地位・署名役割の維持である（抄録）。", "p5": "政策後、処置群の監査品質は低下（修正再表示の確率が高く、裁量的発生高が大きい）。効果は伝統的ジェンダー規範が強く差別の多い省で強く、女性に親和的または社会的責任の高い事務所で弱い。処置群はパートナー昇進・業界専門家の地位・署名役割の維持の確率が低かった（抄録）。", "p6": "抄録からは標本の規模、効果の大きさ、処置群の定義（年齢範囲）は読み取れない。残る疑問として、監査品質の低下が本人の努力の変化か、割り当てられる案件の変化かの切り分けがある。解釈：機構分析で「職場の不利」を挙げている点は、後者の寄与を示唆する。", "fun": "「二人目を産んでよい」という政策が、監査という会計の品質管理の仕事に影を落とした。出産期の女性監査人は、政策のあとで大事な顧客や新しい案件、先輩の指導から遠ざけられ、仕事の質も昇進も不利になった。本人が何かを変えたのではなく、周りの期待が変わったことが効いている可能性を、政策という「外からの変化」を使って示している。", "unverified": "標本数と推定された効果の大きさは抄録にない。"}}, {"id": "pr08", "rank": 8, "headline": "振動異常検知は新しい機械で性能が大きく落ちる", "title": "Shift, shortcuts and calibration: a deployment-realistic evaluation of unsupervised vibration-based anomaly detection in CNC machining", "url": "https://doi.org/10.2139/ssrn.7610685", "authors": "Lukáš Raszka ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Raszka, L., Grycz, O., Vilamová, Š., Ameir, O., & Frischer, R. (2026). Shift, shortcuts and calibration: a deployment-realistic evaluation of unsupervised vibration-based anomaly detection in CNC machining. https://doi.org/10.2139/ssrn.7610685", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "正常データだけで学ぶ振動異常検知が、新しい機械や新しい生産期間に展開すると性能が大きく落ちることを示し、グループ分割評価・較正された誤報率・妨害変数のみのベースラインを報告する評価手順と、新設置ごとの試運転段階を提案した。", "p2": "教師なし振動異常検知は正常運転データだけで済むため魅力的だが、報告される性能は無作為分割に基づくことが多く、新しい機械や期間での性能を反映していない（抄録）。", "p3": "PCA、Mahalanobis距離、isolation forest、k近傍、自己符号化器、文脈条件付き自己符号化器の6つの正常のみ検出器を、2つの公開フライス加工データセットで、無作為・期間グループ・機械グループ・実験グループの分割により最大10回の反復と対ノンパラメトリック検定で評価する。さらに新機械のラベルなしデータだけを使う5つの適応戦略を比較する（抄録）。", "p4": "評価指標はAUROCと、元の機械で較正した閾値を新機械に適用したときの誤報率。機械と期間だけを使う「信号なし予測器」を妨害変数ベースラインとする（抄録）。", "p5": "最良の検出器のAUROCは無作為分割で0.96だが新期間で0.84、新機械で0.78に落ち、信号なし予測器でも0.84に達した。元機械で較正した閾値は新機械で68〜86%、実験室機械間で45〜100%の誤報率を生んだ。文脈条件付けは18比較すべてで有意な利得なし。閾値の再推定で誤報率は4〜7%に戻り、対象データのみで学習したモデルはAUROCを0.08上げた（Holm調整p<0.001）が、順位が保たれる場合は閾値再推定だけで十分で、ラベルなしデータの汚染が再現率を制限した（抄録）。", "p6": "著者は正常挙動のスケールのシフトと構造的シフトを区別し、後者には新設置ごとに検証済み正常データで試運転する段階が必要とする。抄録からは2つのデータセットの名称と機械の台数は読み取れない。", "fun": "工場の機械の「異常」を音や振動から見つけるAIは、論文の中では9割以上当たるのに、隣の機械に移すと誤報の嵐になる。驚くのは、振動をまったく見ずに「どの機械か、いつか」だけで予測しても同じくらいの点が出た点で、AIが覚えていたのは異常ではなく「機械の個性」だった。新しい機械を入れたら、まず正常な状態をしっかり測り直す試運転が必要だ、という結論は地味だが現場では決定的だ。", "unverified": "データセット名と検出器ごとの数値の内訳は抄録にない。"}}, {"id": "pr09", "rank": 9, "headline": "在宅勤務継続はストレスから燃え尽きへの転移を強める", "title": "Flexibility Without Boundaries: How Post-Pandemic Remote Work Trajectories Drive Longitudinal Stress and Burnout Over Time", "url": "https://doi.org/10.21203/rs.3.rs-10856446/v1", "authors": "Linda Duxbury ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Duxbury, L., & Halinski, M. (2026). Flexibility Without Boundaries: How Post-Pandemic Remote Work Trajectories Drive Longitudinal Stress and Burnout Over Time. https://doi.org/10.21203/rs.3.rs-10856446/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（仮説、参加者、構造モデルと多群分析、考察、限界）を読んだ。測定尺度の節は読み切れていない", "preprint": true, "p1": "パンデミック中のストレスが1年後の仕事・家庭の燃え尽きに転移する強さが、在宅勤務を続けた人で最も強く、現場勤務を続けた人で最も弱いことを、カナダの2波パネルの多群構造方程式モデルで示した。", "p2": "在宅勤務が従業員のメンタルヘルスに良いか悪いかは論争が続く。在宅から出社に戻ると境界や対面の資源が回復する一方、通勤や自律性の喪失という新しい要求が生じうるため、どの経路が最も強いかを事前に特定できないという理論的パラドックスがある（Hypotheses Development）。", "p3": "仕事の要求度–資源（JD-R）モデルと資源保存理論を枠組みに、T1（2022年秋）の知覚ストレスがT2（2023年秋）の仕事の燃え尽きと家庭の燃え尽きを予測するという仮説（H1a・H1b）と、その強さが勤務場所の軌跡で異なるという仮説（H2a・H2b）を立てる。参加者を「現在在宅か」×「パンデミック中に在宅だったか」の2×2で分け、継続在宅（n=174）、在宅から出社へ戻った群（n=329）、継続現場（本文n=340、抄録では350）の3群とし、第4のセル（n=39）は除外する。PLS-SEMの多群分析（Henselerのノンパラメトリック PLS-MGA）で経路係数の群間差を検定する（Participants and Procedure、Analytic Strategy）。", "p4": "良さの基準は、各群でT1ストレスがT2の燃え尽きを有意に予測すること（H1）と、PLS-MGAで群間の経路係数の差が有意であること（H2）。共変量として年齢、婚姻、育児時間などを含める。初回調査の4,000人の追跡同意者のうち882人が第2波に回答した。", "p5": "T1ストレス→T2仕事の燃え尽きは継続在宅β=.628、復帰群β=.494、継続現場β=.467、家庭の燃え尽きはそれぞれβ=.390、.367、.288で、すべてp<.001（Structural Model）。継続在宅と継続現場の差は、仕事の燃え尽きでΔβ=.161（p=.03）、家庭の燃え尽きでΔβ=.171（p=.05）、ストレスの持続でΔβ=.172（p=.03）と有意（PLS MGA）。育児時間は全群で家庭の燃え尽きを予測した（β=.166〜.209）。", "p6": "著者は、2波のため非線形の軌跡や媒介が扱えないこと、勤務形態が会社の指示か本人の選択かを追跡していないこと（自律性は重要な資源である）、住居の広さや在宅オフィスの環境を統制していないことを限界に挙げる（Limitations）。解釈：継続現場群のnが抄録では350、本文では340と食い違っており、どちらが正しいかは原稿から確定できない。また、復帰群と他群の差は本文に有意な結果が示されておらず、在宅の「継続」が問題なのか「選択の有無」が問題なのかは切り分けられていない。", "fun": "在宅勤務は自由で楽だと思われがちだが、パンデミック中にストレスをためた人がそのまま在宅を続けると、1年後に仕事でも家庭でも燃え尽きやすかった。現場に通い続けた人のほうが、職場を出る瞬間に気持ちの切り替えができて回復していた。在宅そのものが悪いのではなく、「いつ仕事を終えるか」の線引きを会社が決めてくれないと、自由が24時間労働に変わる、という話だ。", "unverified": "測定尺度の節（Measures）と図1の内容は読み切れておらず未確認。継続現場群のn（340か350か）は原稿内で食い違う。"}}, {"id": "pr10", "rank": 10, "headline": "利害が対立するLLM群の合意形成を決める要因", "title": "Drivers of LLM Consensus Formation Under Competing Incentives: A Simulation Study", "url": "https://arxiv.org/abs/2610.20200", "authors": "Isabel Jones ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Jones, I., Edwards, M., & Hoffmann, J. A. (2026). Drivers of LLM Consensus Formation Under Competing Incentives: A Simulation Study (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20200", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 方法、§4 結果と考察、§5 結論、図1〜5）を読んだ", "preprint": true, "p1": "利害の異なるLLMエージェント36体をネットワークに置き、2色のどちらかで全員一致すれば報酬が出る「ネットワーク合意ゲーム」で、公開モデルは全体への発信がない限りほとんど合意に至らず、ChatGPT 5.6-solだけが近隣との通信や無通信でも合意できること、その差を「頑固さ」「多数派追随」「近隣の状態を伝える発話」で説明できることを示した。", "p2": "LLMは意図された協調でも意図しない創発でも全員一致を生む多エージェント環境に置かれつつあり、利害が対立する中でどう合意に至るかの機構を理解する必要がある（抄録、§1）。人間の実験では条件により18〜95%が合意に達することが知られている（§4.1）。", "p3": "各エージェントは赤か青を好み（半々）、好む色で合意すれば£0.20、好まない色なら£0.15、不一致なら0の報酬（§3.1）。プロンプトにはゲームの説明、自分の好み、近隣の色、直近10ラウンドの記録、私的な戦略日記を含め、自分と近隣しか見えない（§3.2）。操作変数はネットワーク構造（疎なErdős-Rényi、Barabási-Albert、Watts-Strogatz、連結ケーブマン）、通信（なし・近隣のみ・全体）、相手のラベル（LLM/人間）、よく接続された少数派の導入で、各組合せを30回走らせる（§3.3）。モデルはQwen 2.5 3B/32B/72B、Mistral Large 2407、Llama 3 8B/70Bと、一部条件でChatGPT 5.6-sol（§3.3.5）。", "p4": "良さの基準は50ラウンド以内の合意率。合意に至らない場合は最大の同色連結集団の大きさ、機構として多数派追随（近隣の青の割合→青を選ぶ確率の混合ロジット）、頑固さ（近隣の多数と異なる色を選んだ回数をラウンド数で標準化）、発話内容を分析する（§4）。", "p5": "公開モデルは36体・2160ゲーム中165（7.6%）しか合意せず、人間の18〜95%を大きく下回るが、BAネットワークの全体通信ではMistral LargeとQwen 3Bが人間並みかそれ以上（表2、§4.1）。ChatGPT 5.6-solは180中129（71%）で、ケーブマン網の無通信だけ合意なし（図2）。近隣通信と無通信の間に差はなく、全体通信は合意確率を大きく上げる（近隣OR=0.0004、無通信OR=0.001、§4.1）。よく接続された少数派を入れると合意しやすくなるが、人間と逆に少数派ではなく多数派の色で収束する。頑固な手の多さは合意と負の相関（r=−0.44、p<0.001、§4.3.4）で、ChatGPTは最も頑固さが少ない（図5）。ChatGPTは「LLM 28の報告では30と31が青で、その先に大きな青の塊がある」のように近隣の状態を伝える（§4.3.5）。", "p6": "著者は、公開モデルは社会シミュレーションで人間の代理には適さないと結論する（§5）。残る疑問として、少数派5体という規模で結果が変わるかは未検証で、ChatGPTの低い頑固さは誤った群でも同調する危険と表裏一体だと著者も注意する（§4.3.4）。解釈：純粋な多数派追随は局所的に多数派に囲まれた「偽の固定点」で止まりうる（図4）という指摘は、エコーチェンバーの単純モデルと整合する。", "fun": "36体のAIに「赤か青か、みんなで同じ色を選べたら全員にご褒美」というゲームをさせると、公開モデルはほとんど合意できず、人間よりずっと下手だった。原因の一つは「頑固さ」で、隣が全員青でも赤を貫くAIが多い。意外なのは「個別にメッセージを送れる」機能を足すと、かえって合意が減ること。選択肢が増えると迷い、内緒の相談が全体の足並みを乱す、という人間の会議にもありそうな結果だ。", "unverified": "表2・表3の数値の内訳と補足資料の回帰表は読み切れておらず未確認。"}}, {"id": "pr11", "rank": 11, "headline": "データ不要PINNで展開カンチレバー梁の過渡振動を予測", "title": "DUPAT-PINN: Data-Free Unified-Parametric Adaptive Time-Marching Physics-Informed Neural Network for Transient Vibration of Deployable Cantilever Beams", "url": "https://doi.org/10.2139/ssrn.7614863", "authors": "Xia Yuchen ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Yuchen, X., Tianxing, C., Hao, L., Deng, H., & Ding, X. (2026). DUPAT-PINN: Data-Free Unified-Parametric Adaptive Time-Marching Physics-Informed Neural Network for Transient Vibration of Deployable Cantilever Beams. https://doi.org/10.2139/ssrn.7614863", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "露出長が連続的に変わる展開式カンチレバー梁の過渡振動を、初期露出長と展開速度を入力とする単一の物理情報ニューラルネットワーク（PINN）で、解データなしに学習して高速に繰り返し評価できるようにした。", "p2": "展開式の空力面は露出長が変わる間に過渡振動を起こし、支配方程式が強く非自律的なため、運転条件が変わるたびに従来のシミュレーションを再実行する必要があった（抄録）。", "p3": "単一の正弦波活性化ネットワークを初期露出長と展開速度で条件づけ、支配方程式と境界・初期条件から直接学習する（損失に解データを使わない）。パラメータ平面での学習を安定化するため、分割した時間進行、初期条件の持続的な強制、履歴の再生、区間境界の連続性制約、終端での大域的精緻化を組み合わせる（抄録）。", "p4": "参照解は有限差分で、格子と許容誤差の精緻化研究で検証する。縮約モデルで無視した対流慣性項の影響を定量化し、報告した精度が成り立つ範囲を明示する。評価は学習条件での再現と、保持したパラメータ点での3秒間の予測精度（抄録）。", "p5": "代理モデルは学習条件を高い忠実度で再現し、保持パラメータ点でも3秒間にわたり正確な予測を保った。オフライン学習後は参照ソルバよりはるかに速く繰り返し評価できる（抄録）。", "p6": "抄録には誤差の数値や高速化の倍率、対象とした梁のパラメータは示されていない。縮約モデルは対流慣性項を無視しており、その影響の範囲内でのみ精度が保証される（抄録）。", "fun": "飛行機の翼が飛びながら伸び縮みするような構造は、長さが変わるたびに揺れ方の計算をやり直す必要があった。この研究は、計算結果を一つも見せずに「物理の方程式を満たせ」とだけ教えてニューラルネットを訓練し、長さと速度を変えても一瞬で揺れを答えられる代理モデルを作った。時間を区切って少しずつ進み、前の区間の答えを忘れないように復習させる、という学習の工夫が人間の勉強法に似ている。", "unverified": "誤差と高速化倍率の数値は抄録にない。"}}, {"id": "pr12", "rank": 12, "headline": "ブロードバンド中国政策が都市TFPを約10%押し上げ", "title": "Digital Infrastructure and Urban Total Factor Productivity: Quasi-Experimental Evidence from the Broadband China Pilot Policy", "url": "https://doi.org/10.21203/rs.3.rs-11368832/v1", "authors": "Jiawei Ma", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Ma, J. (2026). Digital Infrastructure and Urban Total Factor Productivity: Quasi-Experimental Evidence from the Broadband China Pilot Policy. https://doi.org/10.21203/rs.3.rs-11368832/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（§3 実証戦略・変数・データ、§4 結果と頑健性・機構・異質性）を読んだ", "preprint": true, "p1": "中国の「ブロードバンド中国」試行政策の段階的導入を準自然実験として、284地級市の2011〜2022年パネルの多期間差の差で、デジタルインフラが都市の全要素生産性（TFP）を約10%高めることを示し、PSM・地形IV・プラセボで頑健性を確かめた。", "p2": "大規模なデジタルインフラ投資が集計レベルの生産性を上げるかは、要素投入型の成長が限界に達する新興国で中心的な政策問題だが、都市レベルの因果的証拠は乏しかった（抄録、§1）。", "p3": "TFP_it = α_i + λ_t + β·BBC_it + γ'X_it + ε_it（式1）で、BBCは2014・2015・2016年の3バッチで指定された試行都市×導入後ダミー、都市・年固定効果、都市クラスタ標準誤差。動的効果はイベントスタディ（式2、k=−1を基準、±4でビン化）。TFPは実質GDPと資本ストック（恒久棚卸法）・雇用・土地からDEA-Malmquist指数で測り、代替としてOlley-Pakes型指数とグリーンTFP（SBM-GML）を使う。統制は一人当たりGDP、第二次産業比率、財政支出/GDP、貸出残高、教育支出、道路面積、人口密度。機構変数は発明特許、産業高度化指数、人口1万人当たり大学生数（§3.1–3.2）。", "p4": "段階的導入のTWFEが異質性で偏りうる点は、事前係数の同時検定、PSM-DID、地形の起伏×2014年以降ダミーを操作変数とする2SLS、500回のプラセボで補強する。標本は試行132都市（46.5%）と非試行152都市の均衡パネル（§3.1、§3.3）。", "p5": "BBCの係数は統制なし0.0616、統制あり0.0505（標準誤差0.0067）でともに1%有意、標本平均0.507に対し約10%（表3、§4.1）。導入前3期の係数は0.0010、0.0003、0.0006で同時にゼロ（Wald χ²=0.01、p=0.9999）、導入時0.0631、その後0.0440〜0.0569で持続（図1、§4.2）。PSM-DIDは0.0503、IVの第1段階は−0.2427（F=193.8）、2SLSは0.0347（SE 0.0146、5%有意）で、IVがDIDより小さいことから残る偏りは上向きと解釈する（表4、§4.3）。頑健性：代替TFP 0.0431、1期ラグ0.0246、省都除外0.0525、2020年除外0.0503、グリーンTFP 0.0367。プラセボ係数は平均−0.0006（SD 0.0066）で基準値を超えるものなし（表5、図2、§4.4）。機構：特許+0.4116対数点、産業高度化+0.3187、大学生+17.01人/万人（表6）。資源型都市0.0299対その他0.0598（差のp=0.024）で、地域・都市規模では差なし（表7）。", "p6": "IV推定値がDIDの約7割である点は、著者は「基準推定は保守的な上限」と解釈するが、地形の起伏が固定効果の下でもTFPショックと無相関という除外制約は検証できない。グリーンTFPや機構の推定は同じDIDに依存する。著者が挙げる限界の節は本稿では読めていない。解釈：資源型都市で効果が小さいのは補完的な構造政策の必要性を示すという含意（抄録）は、機構分析（特許・産業高度化・人材）と整合する。", "fun": "「ネットを速くすれば街は豊かになる」は本当か。中国で3年に分けて選ばれた132の試行都市と選ばれなかった152都市を比べると、生産性が約10%上がり、しかも導入の前には差がなかった。面白いのは「山がちで工事が大変な都市ほど試行に選ばれにくい」という地形の偶然を使って、選ばれ方の偏りを取り除いている点だ。地形という動かしようのない条件が、政策評価の道具になる。", "unverified": "限界の節と結論の節、図表キャプションの一覧は読み切れておらず未確認。"}}, {"id": "pr13", "rank": 13, "headline": "デンプン架橋の微視実験に基づくDEM接触モデル", "title": "An Experimentally Calibrated DEM Contact Model Linking Starch-Bridge Mechanics to the Strength of Stabilised Sand", "url": "https://doi.org/10.2139/ssrn.7615210", "authors": "Nazanin Mahboobi Motlagh ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Mahboobi Motlagh, N., Alimoradi, H., & Khabbaz, H. (2026). An Experimentally Calibrated DEM Contact Model Linking Starch-Bridge Mechanics to the Strength of Stabilised Sand. https://doi.org/10.2139/ssrn.7615210", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "デンプンで固めた砂について、個々のデンプン架橋の微視的な力学実験から導いた関係式を直接DEM接触モデルに組み込み、三軸試験の巨視的挙動を再現する「ミクロからマクロへ」の枠組みを構築した。", "p2": "バイオポリマーによる地盤改良は低炭素の代替になりうるが、デンプン処理した粒状土の力学応答は経験的なバルクスケールの関係で記述されるのが普通で、粒子間の結合の性質と巨視的強度の関係が物理的に説明されていなかった（抄録）。", "p3": "デンプン含有率0.5〜2.5%（砂の乾燥質量比）と水–デンプン比1〜6の20混合物を28日養生し、SEMで硬化バインダーが離散的な粒子間架橋として分布することを確認して対の結合として表現する。二粒子試験体に引張・圧縮・純せん断の単調載荷を行い、架橋の寸法・剛性・力の容量・破壊の組成と幾何への依存関係を導いてDEMに実装し、未処理の粒状骨格の接触パラメータは独立に較正する（抄録）。", "p4": "拘束圧50・100・150kPaの三軸試験に対し、主応力–ひずみ応答、体積応答、破壊特性の一致で検証する（抄録）。", "p5": "三軸試験との一致は良好だった。デンプン含有率を上げると架橋は大きく強くなり剛性とピーク抵抗が増え、水–デンプン比を上げると架橋は大きいが弱く柔らかくなった。粒子スケールでは、ピーク抵抗は結合破断、結合配位の喪失、力の再配分、ひずみ局所化と結びついていた（抄録）。", "p6": "抄録には一致度の数値や、二粒子試験の試験体数は示されていない。残る疑問として、28日以外の養生期間や湿潤環境での架橋の劣化が扱われているかがある。", "fun": "片栗粉のようなデンプンで砂を固めると、セメントより環境負荷の低い地盤改良ができるかもしれない。この研究は、砂粒2つをデンプンでつないだ「最小単位」を実験で引っ張り・押し・ずらして性質を測り、それを何千粒の計算に組み込んで、本物の土の試験結果を再現した。小さな橋の性質から大きな土の強さを予言する、という積み上げ方が科学らしい。", "unverified": "三軸試験との一致度の数値は抄録にない。"}}, {"id": "pr14", "rank": 14, "headline": "日本のストレスチェックは測るだけで応答していない", "title": "Japan measures workplace stress but rarely acts on it: fix the response loop, not the test", "url": "https://doi.org/10.31235/osf.io/xdcnj_v1", "authors": "Ryutaro Nakagawa ほか", "venue": "SocArXiv", "date": "2026-10-15", "apa": "Nakagawa, R., & Yamamura, N. (2026). Japan measures workplace stress but rarely acts on it: fix the response loop, not the test. https://doi.org/10.31235/osf.io/xdcnj_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "OSF（SocArXiv）版のPDF本文（§1〜7、図1〜3の記述）を読んだ", "preprint": true, "p1": "日本のストレスチェック制度が10年間「測る」ことには成功しながら「応答する」段階で止まっていることを、国内コホートの証拠と17か国比較から示し、評価の軸を検査の精度や頻度から「検出から職場環境の変化までの速さ」に移すべきだと論じた枠組み提案である。", "p2": "2015年12月以来、50人以上の事業場に年1回のストレスチェックが義務づけられ、2017年に82.9%、2020年頃に約80%が実施しているが、労働者のメンタルヘルスを改善したという研究はなく、自殺率もOECD上位のままである（§1）。2025年5月の法改正で2028年4月から50人未満の事業場にも義務化されるが、効果の証拠がある集団分析と職場環境改善は努力義務のまま残る（§1）。", "p3": "制度の構成要素を一つずつ検討し（§2）、17の高所得OECD国の平均年間労働時間・週50時間以上の割合・年齢調整自殺率の相関を95%信頼区間とleave-one-outで示す（§3）。感染症サーベイランスの論理（検査の精度より検出→応答の時間が効果を決める）を借りて、職場のストレス監視が最適化すべき対象を「応答ループ」と定義し直す（§4）。", "p4": "良さの基準は、各構成要素が苦痛の改善と結びつくかという個人レベルのコホート証拠と、WHO 2022年ガイドラインなどの国際的指針との整合。国際比較は位置づけのためだけに用い、因果の根拠にはしないと明示する（§3、§6）。", "p5": "高ストレス判定は長期病欠を予測する（ハザード比は男性約8.7、女性約3.7）が、1年コホートで調査のみの群は苦痛が改善せず（p=0.91）、環境変化のみの群も同様（p=0.70）、両方を受けた群だけで小さな改善（Cohenのd≈−0.14）があった。職場環境改善が実施されたのは全評価の3.3%に過ぎない（§2）。日本の平均年間労働時間約1,654時間は17か国中5位だが、週50時間以上は13.8%で3位。自殺率17.4/10万は2位。平均労働時間と自殺率の相関はr=0.34（95%CI −0.17〜0.71）、長時間労働率とはr=0.16（−0.35〜0.59）で、1か国を除くと−0.17〜0.70まで動く（§3、図1〜3）。測定頻度を1日3回から9回に増やしても効果はなく、一方で測定に基づくケアは寛解のオッズを約1.83倍にした（§4）。", "p6": "著者は、これは展望論文で実証の核は記述的であり、国際比較は生態学的で因果を言えず、依拠する研究の多くが観察研究で効果量も小さいこと、「応答のコストを下げれば実施率が上がる」という中心的主張は未検証の仮説であることを明記する（§4末、§6）。解釈：3.3%という実施率を「測定の失敗」ではなく「壊れた応答ループ」と読み替える点が本稿の核で、2028年の義務化拡大がこの構造を小規模事業場にまで広げる懸念は制度設計への具体的な指摘になっている。", "fun": "日本は世界で最も熱心に働く人のストレスを「測っている」国だが、測った後に職場を変えたのは100回に3回ほどしかない。しかも「日本人は働きすぎ」という常識も、平均時間では17か国の真ん中で、本当の問題は一部の人の極端な長時間だった。感染症の検査と同じで、精度の高い検査より「結果が出たらすぐ動ける仕組み」が命を救う、という発想の転換を職場に持ち込んでいる。", "unverified": "図1〜3の図そのものは読めておらず、本文の記述に基づく。"}}, {"id": "pr15", "rank": 15, "headline": "多治療の因果ランキングで集団健康の層別化", "title": "Learning Who Benefits Most: Multi-Treatment Causal Ranking for Population Health Stratification", "url": "https://arxiv.org/abs/2610.19782", "authors": "Rocco Zaccagnino ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Zaccagnino, R., Girolamo, M., Lombardi, A., Malandrino, D., Telesca, D., & Ture, A. (2026). Learning Who Benefits Most: Multi-Treatment Causal Ranking for Population Health Stratification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19782", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 問題定式化、§4 枠組み、§5 実験設定と指標、§6 結果、§7 考察の冒頭）を読んだ", "preprint": true, "p1": "集団健康の層別化を「どの患者にどのケア強化を優先するか」の多治療因果ランキング問題として定式化し、二重頑健な因果信号でSiameseランキングネットワークを学習するPROMETHEUSを提案して、合成データとイタリアASL Beneventoの実際の行政データを用いた半合成実験で、既知の便益の順序を回復し資源制約下の配分価値の約84〜94%を達成することを示した。", "p2": "イタリアのDM77のような層別化枠組みは患者を臨床的ニーズとケア経路で整理するが、限られた資源の下でどのケア変更を優先すべきかの指針が乏しい。個人の処置効果を正確に較正するのは難しいが、必要なのは期待される増分便益の「順序」である（抄録、§1）。", "p3": "患者iの共変量X_i、現在の経路C_i、観測処置A_i∈{0}∪{1,…,M}（0は現状維持）、追跡期間のアウトカムY_i（大きいほど良い）を扱い、同じ参照処置・アウトカム定義・期間・単位・方向を持つ処置だけを同じ「比較可能領域」で順位づける（§3.1）。ベースラインのニーズ水準は別モジュールで推定し、便益の推定には使わない。各プロファイルpについて傾向スコアと結果回帰からクロスフィットした二重頑健な疑似アウトカムΓ_i^{(p)}（式4）を作り、その平均を監督信号にする（§4.1）。ペアは同じ領域・十分な重なり・標準化した信号差z_uv=d_uv/r_uvが閾値κ以上のときだけ残し、信頼性で重み付ける（§4.2）。共有エンコーダとランキングヘッドを、因果信号の似た機会を近づける対照学習で事前学習し（式5）、ペアワイズのロジスティック損失（式6）で微調整する（§4.3）。推薦は患者ごとに最良の機会を選び、容量制約下で配分する。", "p4": "合成ベンチマークは6つの裁量的ケア介入（緩和ケアは別領域として除外）、365日の入院なし日数をアウトカムとし、識別可能な基準シナリオに加え、隠れた交絡、重なりの不足、ヌル・プラセボ、容量不足、費用の異質性など14シナリオを別々に評価する。ASL研究は270,533人の匿名化行政データから特徴を作り、応答機構を生成した半合成設定。指標はニーズ回復（重み付きκ、順序MAE）、順位の一致度（保持データの二重頑健一致度とオラクル一致度）、推薦（オラクル一致率、後悔、棄権率、有害選択率）、配分（正規化配分価値）、安定性（§5.1–5.2）。", "p5": "合成の10シードで、オラクル大域一致度0.799 [0.781–0.817]、保持データの二重頑健大域一致度0.538、推薦のオラクル一致0.815、正規化配分価値0.936 [0.915–0.953]（表2）。隠れた交絡で因果的劣化が最大、容量不足は順位を変えず配分価値だけを下げ、鋭いヌルとプラセボでは完全に棄権した（表3）。ASLでは部分整合とリスク–便益不整合のシナリオでオラクル大域一致度0.766〜0.776、正規化価値約0.84、有害選択率1%未満だが、混合応答では一致度0.648、価値0.660、有害選択11.9%に悪化（表4）。対照事前学習は全シナリオで配分価値を+0.013〜+0.021改善（表5）。繰り返し当てはめの順位相関は0.738、推薦集合のJaccardは0.923、上位10%の重なりは0.608（§6）。", "p6": "オラクルの結果は生成した応答機構にのみ関係し、ASL Beneventoのサービスの実効果ではない。観測された治療–転帰データでの検証が臨床利用の前に必要（抄録、§6）。混合応答で有害選択率が11.9%に上がることは、応答パターンが共有されない場合に順位が崩れる弱点を示す。著者はニーズ・推薦・配分を分離し、運用上の先送りを「ニーズが低い」と解釈してはならないと強調する（§7）。", "fun": "病気の重さで患者を並べることと、「誰にどの支援を追加すれば一番効くか」を並べることは別の問題だ。この研究は後者を、ペアで比べて「こちらのほうが得」を学ぶランキングの問題にした。面白いのは、効果がないように作ったデータでは誰も推薦せず「棄権」できたこと。推薦しないという判断ができるシステムは意外と少ない。ただし患者ごとに効き方がばらばらな設定では1割が逆効果の推薦になり、限界もはっきり見えている。", "unverified": "表3の各シナリオの数値（列の対応）は一部読み切れておらず未確認。§7–8の考察と配備状況の節は冒頭のみ読んだ。"}}, {"id": "pr16", "rank": 16, "headline": "MD&Aの経営者トーンの非対称効果と機関投資家", "title": "Asymmetric Effects of Managerial Tone and Institutional Investor Behavior: Reconciling Limited Attention and Contrarian Investing", "url": "https://doi.org/10.2139/ssrn.7615689", "authors": "Xuanqi Xie ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Xie, X., Zhou, B., & Ge, Z. (2026). Asymmetric Effects of Managerial Tone and Institutional Investor Behavior: Reconciling Limited Attention and Contrarian Investing. https://doi.org/10.2139/ssrn.7615689", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "年次報告書のMD&Aの経営者トーンを「基礎的成分」と「正味成分」に分け、正味のポジティブ・ネガティブなトーンが機関投資家の保有に非対称に効くことを示した。", "p3": "中国A株上場企業の2013〜2024年の年次報告書に、TF-IDFとSVM分類器を組み合わせたテキスト分析を適用してトーンを分解する（抄録）。", "p5": "正味ポジティブなトーンは機関投資家保有とU字、正味ネガティブなトーンは正の関係にあり、合計すると正味トーン全体と保有は負の関係になる。情報の透明性と産業競争がこの非対称性を強め、資金制約は弱める（抄録）。", "fun": "経営者が明るい言葉を並べるほど、賢い投資家はむしろ株を減らすことがある、という逆説を扱っている。「悪い話を正直に書く会社」を機関投資家が評価する一方、「良い話」は多すぎても少なすぎても信用されにくい。言葉の量をAIで測ると、人間の読み方の癖（注意の限界と逆張り）が数字として見えてくる。", "unverified": "分析対象の企業数と推定モデルの詳細は抄録にない。"}}, {"id": "pr17", "rank": 17, "headline": "LLM評価者はペルソナ情報の適切な利用を判定できるか", "title": "PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?", "url": "https://arxiv.org/abs/2610.19314", "authors": "Xinyi Liu ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Liu, X., Nayyeri, H., Yilmaz, E., Hakkani-Tur, D., Peris, C., & Thadakamalla, H. (2026). PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19314", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMを評価者として使うとき、ユーザ履歴（ペルソナ情報）の「適切な使い方」を見分けられるかを測るベンチマークPersEvalBenchを作り、評価者の弱点を示した。", "p3": "ユーザ情報が持続・転移・失効すべき403の複数エピソード場面を用意し、過少パーソナライズ・過剰パーソナライズ・状態の誤適用の3系統9種の誤りを制御して埋め込む。人間の監査で誤りの型と情報の使い方の妥当性を確認した（抄録）。", "p5": "5つのLLM評価者は全対話履歴を与えても誤りの認識が限られ、人間評価の部分集合では過少パーソナライズを人間が94.4%認識するのに対し最良の評価者は63.9%だった。評価者は問題には気づいても誤りの向きを逆に取り違えやすく、関連する履歴を強調しても改善はわずかだった（抄録）。", "fun": "「あなたの好みを覚えている」アシスタントが、覚えすぎても忘れすぎても困る。面白いのは、AIの審判が「何かおかしい」とは分かるのに、「忘れすぎ」を「覚えすぎ」と逆に判定しがちな点だ。情報がどこにあるかを教えても直らないので、難しいのは情報を見つけることではなく「その情報をどう使うべきか」の判断だと分かる。", "unverified": "評価に使ったLLM評価者の名前と、人間評価の部分集合の規模は抄録にない。"}}, {"id": "pr18", "rank": 18, "headline": "公共データ開放がリスク志向監査を促進（中国）", "title": "Does the digital economy facilitate risk-oriented auditing? Evidence from China's Open Public Data Platform", "url": "https://doi.org/10.2139/ssrn.7615104", "authors": "Tai Wang ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Wang, T., & Gao, X. (2026). Does the digital economy facilitate risk-oriented auditing? Evidence from China’s Open Public Data Platform. https://doi.org/10.2139/ssrn.7615104", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の公共データ開放プラットフォーム（OPDP）の導入が、監査作業の複雑さを減らし監査人の判断を支えることで監査品質を高めたことを示した。", "p3": "OPDPの段階的な導入を準自然実験とみなし、Callaway and Sant'Anna (2021) の段階的差の差推定を主たる仕様として、裁量的発生高・監査意見・修正再表示を比較する（抄録）。", "p5": "OPDPのある都市の企業は裁量的発生高が低く、監査意見は攻撃的でなく、修正再表示も少ない。効果は財務の比較可能性が低い企業、国有企業への露出が高い企業、小規模監査事務所や訴訟リスクの高い場合に強い。監査効率や監査資源の配分も改善した（抄録）。", "fun": "政府が持っているデータを一般に公開すると、企業の帳簿のごまかしが減るという話だ。監査人は企業の説明を裏付けるために外部の情報を集めるが、それが安く手に入るほど「怪しい点」に集中できる。情報公開という一見関係のない政策が、会計の正直さに効いてくるところが面白い。", "unverified": "標本の企業数・期間と効果の大きさの数値は抄録にない。"}}, {"id": "pr19", "rank": 19, "headline": "加速償却政策下の防御的な減価償却見積り調整", "title": "Ability or incentive? Defensive depreciation-estimate adjustment under China’s accelerated depreciation policy", "url": "https://doi.org/10.6084/m9.figshare.34480635", "authors": "Jianliang Chen ほか", "venue": "Figshare", "date": "2026-10-14", "apa": "Chen, J., & Bian, A. (2026). Ability or incentive? Defensive depreciation-estimate adjustment under China’s accelerated depreciation policy. Taylor & Francis. https://doi.org/10.6084/M9.FIGSHARE.34480635", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Figshareに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の加速償却政策の恩恵を受けた企業が、会計上の減価償却率を「防御的」に引き下げること、そしてそれが報告圧力ではなく税効果を吸収できる能力によることを示した。", "p3": "2014〜2019年の3波の加速償却政策を準自然実験とし、2011〜2024年の41,879企業年に段階的差の差を適用する。中国の帳簿と税務の分離制度により、企業は税務と独立に会計上の償却を調整できる（抄録）。", "p5": "処置企業は実施後に帳簿上の償却率を有意に下げ、効果は2年目にピークとなり、税の恩恵を吸収できる企業に集中した。吸収余地の小さい企業はほとんど反応しなかった。規制当局は業績不振ではなく恩恵を受ける能力のある企業の償却見積り変更に注目すべきと示唆する（抄録）。", "fun": "税金を減らすために「機械を早く古くなったことにしてよい」という優遇を受けた企業が、株主向けの帳簿では逆に「機械は長持ちする」と見積もりを変えるという二重の顔を扱っている。しかもそれをやるのは、困っている会社ではなく余裕のある会社だった。帳簿と税務が別々に計算できる制度が、こうした行動を生む土台になっている。", "unverified": "償却率の引き下げ幅の数値は抄録にない。"}}, {"id": "pr20", "rank": 20, "headline": "JOBS法の規制緩和と監査資源の配分", "title": "Regulatory Relief and the Allocation of Audit Resources: Evidence from the JOBS Act", "url": "https://doi.org/10.2139/ssrn.7610641", "authors": "Thomas R. Kubick ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Kubick, T. R., Wilkins, M. S., & Wu, B. (2026). Regulatory Relief and the Allocation of Audit Resources: Evidence from the JOBS Act. https://doi.org/10.2139/ssrn.7610641", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "IPOの規制を緩めたJOBS法が、監査事務所の限られた人員を解放し、IPO以外の顧客の監査品質を改善したことを示した。", "p3": "新興成長企業（EGC）のIPOに対する報告要件を減らしたJOBS法の前後で、EGC相当のIPOに多く関わる監査事務所の非IPO顧客の監査品質を比較する（抄録）。", "p5": "法施行前は、EGC相当のIPOへの露出が大きい事務所ほど非IPO顧客の監査品質が低かった。施行後はそうした事務所の非IPO顧客で監査品質が相対的に改善し、効果はIPO企業が監査済み財務諸表の要件緩和を利用した場合と、事務所の処理能力が小さい場合に顕著だった（抄録）。", "fun": "ある仕事の規制を緩めると、まったく別の仕事の質が上がる、という玉突きの効果を捉えた研究だ。監査人は限られた人数で多くの会社を見ているので、IPOの手間が減ればその分を他の顧客に回せる。規制の効果を「その対象」だけで測ると、こうした波及を見逃してしまう。", "unverified": "監査品質の測り方と効果の数値は抄録にない。"}}, {"id": "pr21", "rank": 21, "headline": "デジタル人材を財務部門に置くと財務報告の質が上がる", "title": "Where Talent Sits: The Financial Reporting Quality of Embedding Digital Talent in Finance Functions", "url": "https://doi.org/10.2139/ssrn.7615694", "authors": "Zhou Li ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Li, Z., Tang, C., & Xu, X. (2026). Where Talent Sits: The Financial Reporting Quality of Embedding Digital Talent in Finance Functions. https://doi.org/10.2139/ssrn.7615694", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "デジタル人材を財務部門に配置した企業だけが、その後の発生高の質（財務報告の質）を高めることを示した。", "p3": "2016〜2023年の中国A株上場企業のオンライン求人データから、財務部門のデジタル人材、非財務部門のデジタル人材、従来型の財務人材の採用を区別し、後続の発生高の質との関係を調べる（抄録）。", "p5": "3つの採用区分を同時に考慮しても、財務部門のデジタル人材だけが有意に高い発生高の質と結びついた。効果は外部のデジタル基盤が強い企業や組織が複雑な企業に集中し、機構としてデジタル技術の採用と会計の比較可能性の向上が示唆された（抄録）。", "fun": "「デジタルに強い人を雇えば会計がよくなる」のではなく、「どの部署に置くか」で結果が変わるという発見だ。同じ能力でも、財務の現場に座ってはじめて帳簿の質に効いてくる。求人広告という身近なデータから企業の内側の配置を読み取っているのも面白い。", "unverified": "企業数と効果の大きさの数値は抄録にない。"}}, {"id": "pr22", "rank": 22, "headline": "オフバランスのデータ資産をブラック・ショールズで評価", "title": "Valuing Off-Balance-Sheet Data Assets: A Black-Scholes Approach with Evidence from East Money", "url": "https://doi.org/10.2139/ssrn.7610203", "authors": "Huannian Jin ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Jin, H., He, J., & Zhe, L. (2026). Valuing Off-Balance-Sheet Data Assets: A Black-Scholes Approach with Evidence from East Money. https://doi.org/10.2139/ssrn.7610203", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "帳簿に載っていないインターネット企業のデータ資産を、コールオプションとして評価する方法を提案し、中国のオンライン証券会社に適用した。", "p3": "データ資産は投資を続けてはじめて収益を生むので、開発支出の現在価値を行使価格とするコールオプションとみなす。原資産は業界平均を超えるデータ起因の超過収益の現在価値、ボラティリティは株式リターンの実現値、無リスク金利は5年国債利回り、行使価格は開示されたR&D支出から作り、自由パラメータなしでBlack-Scholesの5入力を定める（抄録）。", "p5": "East Money（300059.SZ）の2025年12月31日時点で点推定は54.1億元、感度分析の範囲は31〜79億元で、時価総額の約1.5%、加重平均純資産の6.3%に相当する。年次報告書での認識額はゼロである。コストアプローチの下限31〜44億元との差がデータに埋め込まれた成長オプションになる（抄録）。", "fun": "「会社が持っているデータはいくらか」という、会計がまだ答えを持たない問いに、金融のオプション理論で数字を出した。データは放っておくと価値を生まず、投資し続ければ利益を生む。これは「将来買う権利」と同じ構造だ、という発想の転換が鍵になっている。", "unverified": "感度分析のグリッドの範囲と超過収益の計算手順の詳細は抄録にない。"}}, {"id": "pr23", "rank": 23, "headline": "パテントボックスが秘匿から特許化への開示を促す", "title": "From Secrecy to Patenting: The Disclosure Effects of Patent Box Incentives", "url": "https://doi.org/10.2139/ssrn.7615182", "authors": "Ricky Xu Yao", "venue": "SSRN", "date": "2026-10-15", "apa": "Yao, R. X. (2026). From Secrecy to Patenting: The Disclosure Effects of Patent Box Incentives. https://doi.org/10.2139/ssrn.7615182", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "パテントボックス（特許収入への軽減税率）が、企業を営業秘密から特許へと切り替えさせ、知識の公開を促すことを示した。", "p3": "欧州各国でのパテントボックスの段階的導入を利用して特許出願の変化を調べ、ポルトガルの2014年導入をめぐる非公開の調査データで秘密保持と特許利用の入れ替わりを直接確認する（抄録）。", "p5": "導入直後に特許が大きく増え、未特許の発明が公開特許制度に持ち込まれたことと整合する。反応は従来の保護慣行や開示コスト、制度設計によって変わり、研究開発投入はほとんど同時には変わらなかった。導入後の生産性向上は拡大した特許ストックへの技術的露出が大きい企業ほど大きく、産業集中は低下した（抄録）。", "fun": "特許にかかる税金を安くすると、発明が増えるのではなく「隠していた発明を公開する」企業が増える、という話だ。特許は公開と引き換えに独占を認める仕組みなので、税の優遇が「秘密にしておくか、公開して守るか」の天秤を傾ける。公開された知識が他社の生産性まで上げるという波及が、普通の研究開発減税にはない効果として浮かぶ。", "unverified": "特許増加の大きさと対象国・期間の数値は抄録にない。"}}, {"id": "pr24", "rank": 24, "headline": "投信の開示圧力は企業の事業範囲決定を促す", "title": "The Bright Side of Short-Termism: Disclosure Pressure from Mutual Funds Promotes Strategic Scope Decisions by Portfolio Firms", "url": "https://doi.org/10.2139/ssrn.7611458", "authors": "Mingming Ao ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Ao, M., Pham, H., & Johnson, S. A. (2026). The Bright Side of Short-Termism: Disclosure Pressure from Mutual Funds Promotes Strategic Scope Decisions by Portfolio Firms. https://doi.org/10.2139/ssrn.7611458", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "投資信託の短期的な開示圧力が、投資先企業の近視眼的行動ではなく、事業範囲の戦略的な拡大と企業価値の向上を促したことを示した。", "p3": "投資信託の開示制度改革を外生的なショックとし、影響を受けた投信の保有比率が高い企業の事業範囲の強度（scope intensity）と業績・評価の変化を調べる（抄録）。", "p5": "保有比率の高い企業は事業範囲の強度を高め、販売効率・収益性・市場評価が上がった。事業範囲を広げた企業は投信に保有され続けやすく、そうした企業への露出を増やした投信は高い異常リターンを得た（抄録）。", "fun": "「短期志向の投資家は企業を近視眼的にする」という通説に対し、短期の圧力がかえって企業を戦略的に動かしたという反例を示している。投信が持ち株を頻繁に公開しなければならなくなると、企業は「選ばれ続ける」ために事業の組み合わせを見直す。圧力の中身によって、同じ短期主義でも結果が変わるところが面白い。", "unverified": "開示改革の内容と標本の規模・期間は抄録にない。"}}, {"id": "pr25", "rank": 25, "headline": "多言語の財務開示から数値証拠を抽出するベンチマーク", "title": "Recognition Is Not Grounding: Benchmarking Multilingual Financial Evidence Extraction", "url": "https://arxiv.org/abs/2610.19432", "authors": "Lingfei Qian ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Qian, L., Wang, Y., Peng, X., Giannouris, P., Zmandar, N., Han, Y., Liu, Y., & Gutiérrez-Basulto, V. (2026). Recognition Is Not Grounding: Benchmarking Multilingual Financial Evidence Extraction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19432", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多言語の財務報告書で、言語モデルが会計概念を「認識」できても、対応する数値事実を「漏れなく回収」できない（認識と接地のギャップ）ことを測るベンチマークMULTIFINGROUNDを作った。", "p3": "英語・フランス語・ギリシャ語の90発行体の2025年度開示を共通の会計タクソノミで揃え、事実レベルの追跡可能な注釈を付ける。財務事実の特定、概念認識、網羅的な事実選択、候補ラベルなしの概念弁別を評価する（抄録）。", "p5": "評価した15モデルのうち、8つのAPI・公開重みの参照モデルは概念認識で97.3〜99.4%の精度を出したが、正しく認識した群の26.6〜41.9%で少なくとも1つの対象事実を見落とした。概念弁別は大きくばらつき、金融特化モデルの利得は限られていた（抄録）。", "fun": "AIが「これは売上高の話だ」と当てるのはほぼ完璧なのに、「その売上高の数字を全部拾って」と頼むと3〜4割の場面で取りこぼす。分かることと集め切ることは別の能力で、テストを片方だけで作ると過大評価になる。言語が違う同じ会社の報告書を突き合わせる、という設定も現実的だ。", "unverified": "15モデルの内訳と、金融特化モデルの具体名は抄録にない。"}}, {"id": "pr26", "rank": 26, "headline": "LLMが設計する表データの合成戦略（プライバシー保護）", "title": "Creation begins with understanding: LLMs as strategy designers for privacy-preserving tabular data synthesis", "url": "https://doi.org/10.21203/rs.3.rs-10869884/v1", "authors": "Dandan Guo ほか", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Guo, D., Li, J., Zhang, Q., Ye, H., Zhao, H., Laakom, F., & Schmidhuber, J. (2026). Creation begins with understanding: LLMs as strategy designers for privacy-preserving tabular data synthesis. https://doi.org/10.21203/rs.3.rs-10869884/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMに合成データそのものではなく「合成手順（プログラム）」を設計させることで、プライバシーを守りながら表データを合成するTabSSDを提案した。", "p3": "生の記録ではなく、木モデルから得た変数依存の要約をLLMに渡し、ローカルで実行・評価できるPythonプログラムを生成させる。生成モデルの学習や記録のテキスト化を避ける（抄録）。", "p5": "12のデータセットで、統計的忠実度・予測有用性・経験的プライバシーリスクのバランスがよく、6指標の平均順位で10手法中最良だった。ローカル計算量と問い合わせごとのトークン消費も大きく減った（抄録）。", "fun": "個人情報を含む表をAIに見せずに「似た表の作り方」だけを教えてもらう、という発想がうまい。料理に例えれば、材料そのものではなく「材料の組み合わせの傾向」だけを渡してレシピを書かせるようなものだ。AIが答えを作るのではなく手順を作ると、人が中身を点検して直せる。", "unverified": "比較した10手法の名称と、プライバシーリスクの測り方は抄録にない。"}}, {"id": "pr27", "rank": 27, "headline": "拡散事前分布で正則化したベイズ全波形逆解析", "title": "Structure-aware Bayesian full waveform inversion via diffusion-regularized Stein variational gradient descent", "url": "https://arxiv.org/abs/2610.19187", "authors": "Chao Li ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Li, C., Sen, M. K., Fomel, S., & Chen, Y. (2026). Structure-aware Bayesian full waveform inversion via diffusion-regularized Stein variational gradient descent (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19187", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ベイズ的な全波形逆解析（FWI）に、学習済み拡散モデルを「地質らしさへの射影」として組み込み、地下構造の推定と不確実性評価を安定化した。", "p3": "焼きなまし付きStein変分勾配降下（ASVGD）で速度モデルの集団により事後分布を近似する枠組みに、拡散モデルを暗黙の正則化として加える。事前密度を明示的に評価せず、更新された粒子をもっともらしい速度モデルの分布へ導く（抄録）。", "p5": "数値実験で、拡散正則化したASVGD-FWIは地質的に整合した平均モデルを与え、非物理的なアーティファクトを抑え、不確実性の推定が構造の複雑な領域や制約の弱い領域に集中した（抄録）。", "fun": "地震波から地下を描く問題は、答えが一つに決まらない「不良設定」問題だ。ここでは「本物の地層はこういう形をしている」という知識を画像生成AIに覚えさせ、候補の集団をその方向へ引き寄せる。AIが答えを出すのではなく、答えの候補を「ありそうな形」に整える役を担うところが新しい。", "unverified": "実験に使ったモデル（Marmousiなど）の名称と誤差の数値は抄録にない。"}}, {"id": "pr28", "rank": 28, "headline": "PINNの適応コロケーションと残差検証の見直し", "title": "Adaptive collocation and residual verification for engineering physics-informed neural networks", "url": "https://doi.org/10.31224/8525", "authors": "Luis Torres", "venue": "engrXiv", "date": "2026-10-15", "apa": "Torres, L. (2026). Adaptive collocation and residual verification for engineering physics-informed neural networks. https://doi.org/10.31224/8525", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "engrXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "物理情報ニューラルネットワーク（PINN）の「適応的コロケーション」が、同じ残差目的を効率よく推定する操作と、目的そのものを変えて特定領域を強調する操作の2つを混同していることを指摘し、評価プロトコルを提案した。", "p3": "重点サンプリングを使って2つの操作を区別し、残差の大きさと勾配分散の違いを検討する。解析的なホットスポット例で「重要領域を見落とすリスク」を定量化し、後流・熱境界層・固体力学・界面への応用で、サンプリングが幾何と工学的関心量に結びつくべき理由を示す（抄録）。", "p5": "独立な検証、台を保つサンプリング、因果的な時間配分、計算コストの完全な勘定を組み合わせた評価プロトコルを提示し、確率モデルでサンプリングの選択と重要領域の見落としリスクを結びつけた（抄録）。", "fun": "「ネットワークが苦手な場所に訓練点を増やす」という素朴な説明の裏に、実は2つの別物が隠れている、という整理が面白い。テストで言えば「苦手な単元を多く練習する」のと「苦手な単元の配点を上げる」のは違う。どちらをやっているかを自覚しないと、計算が減ったように見えて肝心の場所を見逃すことがある。", "unverified": "提案プロトコルの数値例と比較結果は抄録にない。"}}, {"id": "pr29", "rank": 29, "headline": "モデル縮約の「スナッピング現象」の機構と緩和", "title": "The Snapping Phenomenon and Boundary Enforcement in Model Reduction: Mechanisms and Mitigation", "url": "https://doi.org/10.2139/ssrn.7615201", "authors": "Charbel Farhat ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Farhat, C., Zhu, Y., Asad, F., & Taddei, T. (2026). The Snapping Phenomenon and Boundary Enforcement in Model Reduction: Mechanisms and Mitigation. https://doi.org/10.2139/ssrn.7615201", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "射影型モデル縮約が訓練スナップショットに「貼り付いて」しまう失敗（スナッピング現象）を分類し、パラメータ依存の境界条件を事前に満たしつつこれを除く統一枠組みを提案した。", "p3": "スナッピングを内在的・外在的・数値的の3型に分け、内在的（Type 1）と数値的（Type 3）に対して、パラメータ依存のシフトベクトルを状態の仮定に埋め込む。ラグランジュ乗数やペナルティ法と違い、オンラインで制約を追加せずに境界条件を厳密に満たす。線形領域で理論を立て、非線形の外部CFDに拡張し、スケール付きラプラス枠組みによる空間変動のシフトベクトルを提案する（抄録）。", "p5": "標準的なアフィン型と回帰拡張型の両方でスナップショットへの固着が消え、連続的なパラメータ感度が回復した。構造解析とNACA翼まわりの粘性流、3次元NASA Common Research Modelで検証した（抄録）。", "fun": "大きなシミュレーションを小さな「要約モデル」に置き換えると速くなるが、その要約モデルが「覚えている答え」の一つに固執して、間のケースを滑らかに補間できないことがある。これを「スナッピング」と名づけ、原因を3種類に分けた。境界条件を「あとから縛る」のではなく「最初から座標をずらして満たす」という発想で解いている。", "unverified": "ベンチマークでの誤差の数値は抄録にない。"}}, {"id": "pr30", "rank": 30, "headline": "深層エネルギー法で延性破壊のフェーズフィールド", "title": "A deep energy method formulation for phase-field modelling of ductile fracture", "url": "https://arxiv.org/abs/2610.19094", "authors": "Nojus Plung\\.e ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Plungė, N., Brommer, P., Edwards, R. S., & Kakouris, E. G. (2026). A deep energy method formulation for phase-field modelling of ductile fracture (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19094", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "深層エネルギー法（DEM）を、履歴依存の塑性と結びついた延性破壊のフェーズフィールドモデルに拡張し、有限要素解と近い結果を得た。", "p3": "2次のAmbrosio-Tortorelliフェーズフィールド破壊モデルと小ひずみJ2塑性・線形等方硬化を組み合わせ、体積・偏差分解で弾性の亀裂駆動エネルギーを定め、累積相当塑性ひずみで局所の破壊靱性を劣化させる。変位はReZero残差ネットワーク、フェーズフィールドは中心を学習する局所ガウス基底で表し、エネルギーを交互に最小化する。転移学習で荷重増分間のパラメータを再利用し、収束した構成履歴は積分点で別に持ち越す（抄録）。", "p5": "力–変位応答、エネルギーの推移、塑性変形、亀裂進展で有限要素の参照解とよく一致した。ただし急な破壊事象の近くでは荷重増分の取り方に精度が敏感になる（抄録）。", "fun": "金属が曲がってから割れる「延性破壊」を、ニューラルネットワークに「エネルギーが最も低くなる形」を探させて再現している。亀裂をぼかして表すフェーズフィールドと、変位を表すネットワークを別々にしたのは、一つのネットワークにまとめると亀裂がぼやけすぎたからだ。前の荷重段階で学んだものを次に引き継ぐ工夫も、人が練習を積み重ねるのに似ている。", "unverified": "検証した問題の種類と誤差の数値は抄録にない。"}}, {"id": "pr31", "rank": 31, "headline": "HDG離散化の調和波動伝播のモデル縮約", "title": "Model order reduction of HDG discretizations for harmonic wave propagation", "url": "https://arxiv.org/abs/2610.20145", "authors": "H\\'el\\`ene Barucq ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Barucq, H., Faucher, F., Pham, H., & Tifouti, I. (2026). Model order reduction of HDG discretizations for harmonic wave propagation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20145", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ハイブリッド型不連続ガレルキン（HDG）離散化による時間調和の音響波動問題に対し、周波数帯域にわたって高速で信頼できる射影型モデル縮約法を提案・解析した。", "p3": "体積未知数とトレース未知数を結合した一般化鞍点系として高忠実度モデルを立て、残差に基づく周波数の貪欲サンプリング、HDG解の周波数微分による拡充、POD圧縮で基底を作る。静的縮約と射影が可換でないことから、トレースと体積の両変数のa priori誤差評価を導き、ギャップを消す体積縮約空間の持ち上げ条件を示す（抄録）。", "p5": "2次元Marmousiモデルと未知数10^7超の3次元不均質媒質で理論評価を確かめ、縮約モデルは高忠実度解法に比べ数桁の高速化を達成した（抄録）。", "fun": "地震探査のように多くの周波数で同じ波動方程式を解き直す作業を、少数の代表解の組み合わせで済ませる方法だ。面白いのは、計算を省く2つの操作（変数を消す静的縮約と、空間を縮める射影）の順番を入れ替えると結果が変わることを正面から扱い、ズレがなくなる条件まで突き止めた点にある。", "unverified": "高速化の倍率と誤差の具体的な数値は抄録にない。"}}, {"id": "pr32", "rank": 32, "headline": "主解法の軌道からオンライン縮約でPDE制約最適化", "title": "Online reduced-order modeling from primal solver trajectories for PDE-constrained optimization", "url": "https://arxiv.org/abs/2610.19821", "authors": "Zhe Lu ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Lu, Z., Cao, W., & Zhang, W. (2026). Online reduced-order modeling from primal solver trajectories for PDE-constrained optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19821", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "収束していない高忠実度ソルバの反復軌道からその場で局所縮約モデルを作り、PDE制約最適化を加速するRETOを提案した。", "p3": "有限回の高忠実度の主問題反復で集めたスナップショットから局所縮約モデルを構築し、低コストの状態評価・随伴勾配・設計更新に使う。設計点が更新されるたびに新しいソルバ軌道で縮約モデルを作り直す（抄録）。", "p5": "3つの異なるPDE制約最適化問題で、状態場に不連続がない場合は全次元最適化と同等の解品質を約8〜22倍の高速化で達成し、衝撃波が動く遷音速の逆設計でも約3倍の高速化を保った。局所縮約モデルは新しい軌道を取り込むにつれ衝撃波関連の特徴を捉えていった（抄録）。", "fun": "普通は「計算が終わってから」その結果を要約モデルの材料にするが、この研究は「計算の途中経過」をそのまま材料にする。途中の答えは不正確でも、設計がどちらへ動くかの情報は十分に含まれている、という発想だ。最初から全部を覚えた要約モデルを作る代わりに、設計の動きに合わせて要約を育てていく。", "unverified": "3つの問題の具体的な設定は抄録にない。"}}, {"id": "pr33", "rank": 33, "headline": "液状化地盤の砕石柱の目詰まり劣化：批判的レビュー", "title": "Clogging-Induced Hydro-Mechanical Deterioration of Stone Columns in Liquefiable Soils Under Seismic Loading: A Critical Review, Quantitative Synthesis and Coupled-Modeling Agenda", "url": "https://doi.org/10.20944/preprints202610.1460.v1", "authors": "Priyanka Ahirwar ほか", "venue": "Preprints.org", "date": "2026-10-15", "apa": "Ahirwar, P., Jain, P. K., Utkarsh, U., & Chatterjee, K. (2026). Clogging-Induced Hydro-Mechanical Deterioration of Stone Columns in Liquefiable Soils Under Seismic Loading: A Critical Review, Quantitative Synthesis and Coupled-Modeling Agenda. https://doi.org/10.20944/preprints202610.1460.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "液状化対策の砕石柱が地震の繰返し水圧勾配で目詰まりし、排水機能を失って「3機構から2機構へ」劣化することを、文献の定量統合と枠組みの定式化で示した。", "p3": "188件の記録から試験条件のデータベースを作り、研究クラスタ化したランダム効果で統合する。目詰まり誘起の水理–力学劣化の枠組みを支配方程式で定式化し、古典的フィルター則と地震時排水要件が両立しないことを示す（抄録）。", "p5": "統合した支持力比は1.52、沈下比は0.75だが、すべて静的試験に基づき地震設計が必要とする量ではない。振動台では通常の柱が急速に目詰まりし、低加速度で液状化開始を約1秒遅らせたのち柱長の26〜43%が地盤に貫入、一方で被覆・砂フィルター付き柱は地盤とともに9%沈下し4倍の加速度でも液状化を防いだ。目詰まりを認める解析では地震後沈下が最大229%増加、2回目の過剰間隙水圧比は36%超高い。現行の完全連成モデルはすべて柱の透水性を一定と仮定している（抄録）。", "fun": "地震で地盤が液状化しないように埋める砕石の柱は、水を逃がす「排水管」の役目も担う。ところが揺れのたびに細かい土が柱に入り込み、排水管が詰まっていく。設計はこの劣化を考えておらず、しかも文献にたくさんあるデータは「地震とは関係ない静的試験」ばかりだった、という痛い指摘だ。", "unverified": "支持力比は独立3研究、沈下比は1研究に依拠すると著者自身が述べており、母集団推定とは読めない。"}}, {"id": "pr34", "rank": 34, "headline": "回転ドラム内の二分散粒子の軸方向偏析機構", "title": "Mechanisms leading to axial segregation of bidisperse particles in rotating tumblers", "url": "https://arxiv.org/abs/2610.18885", "authors": "Umberto d'Ortona (M2P2) ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "d'Ortona, U., Lueptow, R., & Thomas, N. (2026). Mechanisms leading to axial segregation of bidisperse particles in rotating tumblers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18885", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "回転ドラム内で大小2種類の粒子が軸方向に縞状に分かれる現象の原因を、DEMシミュレーションで「粒状体版のRayleigh-Taylor不安定性」として説明した。", "p3": "流れ方向・時間方向の不安定性の発達を追い、粒径比・ドラムの長さと直径・種の割合・充填率を広く変えたパラメータ研究で軸方向の縞が現れる条件を調べる（抄録）。", "p5": "表面流動層での初期の半径方向偏析により、充填効率の高い混合粒子層（高密度）が、ほぼ単分散の小粒子層（低密度）の上に乗る。この重い層が軽い層の上にある状態が再循環セルを生み、軸方向の縞を作る。粒径比を上げると混合層の密度が上がり、不安定性が強まって偏析が加速する（抄録）。", "fun": "ナッツの缶を振ると大きい粒が上に来る現象の親戚で、回転する筒の中では大小の粒が輪切りのような縞に分かれる。長年謎だったが、答えは「重い液体が軽い液体の上に乗ると崩れる」という流体の不安定性と同じ仕組みだった。粒の大きさが混ざると隙間が埋まって「重く」なる、という点が肝になる。", "unverified": "シミュレーションの粒子数と縞が現れる条件の閾値は抄録にない。"}}, {"id": "pr35", "rank": 35, "headline": "群の最適輸送のためのマルチスケール分散MPC", "title": "Multiscale distributed MPC for Optimal Transport", "url": "https://arxiv.org/abs/2610.19390", "authors": "Guillem Pascual ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Pascual, G., Huang, Y.-J., & Martínez, S. (2026). Multiscale distributed MPC for Optimal Transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19390", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大きな群（スウォーム）の最適輸送を、上位の最適輸送と下位のモデル予測制御（MPC）の2階層で分散的に実現し、密度の流れの安定性を1-Wasserstein計量で証明した。", "p3": "上位では時間変化する目標密度を終端ペナルティ付きの最適輸送として扱い、正則化した静的双対問題に帰着させて各エージェントが分散的に名目速度を計算する。下位ではMPCが制御アフィン系で名目速度を追従し外乱を除く（抄録）。", "p5": "下位の追従誤差と目標の動きが生むずれに対して、密度の流れが1-Wasserstein計量で分布的な入力–状態安定性を持つことを証明し、追従誤差は巨視的な流れを有界で定量化できる分だけしか乱さない。シミュレーションで時間変化する目標と状態の擾乱に対する有効性を示した（抄録）。", "fun": "何百もの小さなロボットを、個々の位置ではなく「分布」として動かす考え方だ。砂の山を別の形に運び替える最小コストを問う最適輸送の問題を、各ロボットが自分の近くの計算だけで分担して解く。しかも個々のロボットが少し道を外れても、全体の形のずれは一定以下に収まることを数学的に保証している。", "unverified": "シミュレーションのエージェント数と誤差の数値は抄録にない。"}}, {"id": "pr36", "rank": 36, "headline": "ネパール岩氷崩落に検出可能な前兆はなかった", "title": "A steadily flowing glacier and no detectable precursor before the 11 October 2026 Budhi Gandaki rock–ice avalanche and flood, Nepal", "url": "https://doi.org/10.31223/x5qj8g", "authors": "Ajay Kumar Sah", "venue": "EarthArXiv", "date": "2026-10-15", "apa": "Sah, A. K. (2026). A steadily flowing glacier and no detectable precursor before the 11 October 2026 Budhi Gandaki rock–ice avalanche and flood, Nepal. https://doi.org/10.31223/x5qj8g", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EarthArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "2026年10月11日にネパールで起きた岩氷崩落と洪水を、発生後4日以内に無料の衛星データから再構成し、氷河の速度変化などの前兆が検出されなかったことを報告した。", "p3": "Sentinel-1/2、Landsat 8/9、ITS_LIVE、NISARと公式記録、過去のGoogle Earth画像を使い、各変化検出を対照（可能なら事前画像から作った偽のイベント）と比較する（抄録）。", "p5": "源頭の変化は10月6日10:41〜11日10:42の間に起き、23km下流の水位計は5〜11日に洪水を記録していない。13日のLandsat 9は5,020〜5,470mの無名氷河で0.31km²の積雪消失と6,350〜6,600mの崩落痕候補を示した。氷河は10年間およそ年60〜130mで流れ、速度上昇などの前兆はなかった。NISARのL帯干渉図は5月〜10月7日に斜面Bを視線方向±2cm程度に保ち、崩落の9.5時間前に終わる対で異常はなかった。洪水は63km下流のArughatに少なくとも3回の上昇で到達した（抄録）。", "fun": "災害の直後、まだ鮮明な写真が届く前に、無料で手に入る衛星データだけでどこまで分かるかを試した記録だ。面白いのは「前兆はなかった」と言うために、わざと作った偽の変化と比べて検出の信頼性を確かめている点にある。何かが起きる前に何も起きていなかったことを示すのは、実は難しい。", "unverified": "崩落源の体積と小湖の連鎖は未計測と著者自身が述べている。"}}, {"id": "pr37", "rank": 37, "headline": "綿根と土の混合体のDEMモデルと較正", "title": "Discrete element modelling and parameter calibration of cotton root-soil mixtures", "url": "https://doi.org/10.2139/ssrn.7611841", "authors": "Xiangyu Li ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Li, X., Wu, B., Ma, Y., Gu, T., Ye, X., Hu, B., Li, J., & Mao, C. (2026). Discrete element modelling and parameter calibration of cotton root-soil mixtures. https://doi.org/10.2139/ssrn.7611841", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "綿の根と土が混ざった粘着性の粒子系について、安息角試験で較正した個別要素法（DEM）モデルを構築した。", "p3": "Hertz-MindlinにJKRを加えた接触モデルを採用し、物理試験と数値試験の安息角を合わせて主要な接触パラメータを特定・較正する。Plackett-Burman計画で支配的なパラメータを絞り、最急上昇法とBox-Behnken応答曲面で最適化する（抄録）。", "p5": "土–土の表面エネルギー、根–土の反発係数、根–土と土–土の静摩擦係数の4つが安息角の変動の84.97%を説明した。較正モデルの安息角は40.32°で実験の39.62°に対し相対誤差1.77%だった。安息角は主に土–土の粘着・摩擦で決まり、根–土の相互作用は粒子再配列を補助的に調整する（抄録）。", "fun": "根っこが混ざった土を粒の集まりとしてコンピュータで再現するには、粒同士の「くっつきやすさ」や「滑りにくさ」の数値を決めなければならない。この研究は、砂山がどの角度まで積めるかという単純な実験だけで、十数個の数値のうち効くのは4つだと突き止めた。細長い根は、土の粒の動きを少し整える脇役だった。", "unverified": "試験した混合比や粒子数は抄録にない。"}}, {"id": "pr38", "rank": 38, "headline": "理想の人生の記述から言語モデルで価値観と性格を予測", "title": "Using Language Models to Predict Values, Personality, Well-Being, and Meaning in Life From Ideal-Life Descriptions", "url": "https://doi.org/10.31234/osf.io/kjx6f_v1", "authors": "Joffrey Fuhrer ほか", "venue": "PsyArXiv", "date": "2026-10-14", "apa": "Fuhrer, J., & Desbordes, T. (2026). Using Language Models to Predict Values, Personality, Well-Being, and Meaning in Life From Ideal-Life Descriptions. https://doi.org/10.31234/osf.io/kjx6f_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "「理想の人生」を描いた約120語の自由記述から、言語モデルの埋め込みで価値観・性格・well-being・人生の意味など24の構成概念の大半を予測できることを事前登録研究で示した。", "p3": "273人に自由記述（中央値109語）と7つのキーワードを書かせ、Transformer型LLMの埋め込みに正則化した線形プローブをかけて、Big Five、Schwartzの10価値、社会的支配志向、政治的志向、人生の意味、主観的well-beingを予測する（抄録）。", "p5": "自由記述で平均r=0.24、キーワードで平均r=0.12と、両条件で大半の構成概念を偶然以上に予測した。自由記述の優位は達成・博愛・同調・情緒安定性など人があまり直接口にしない概念に集中し、語り方そのものに信号があることを示す。24のうち19の概念を回復した（抄録）。", "fun": "「理想の人生を書いてください」という一問だけで、その人の性格や価値観の大半が読み取れるという結果だ。しかも、キーワードを並べるより文章で語らせたほうが当たる。何を書くかだけでなく「どう書くか」に本人らしさが出るということで、市販のAIに頼らず公開モデルとコードで再現できる点も特徴だ。", "unverified": "構成概念ごとの相関の内訳は抄録にない。"}}, {"id": "pr39", "rank": 39, "headline": "自己進化する多エージェント系を形づくる社会的足場", "title": "Evolve Together, Fall into Place: How Social Scaffolding Shapes Self-Evolving Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.19799", "authors": "Seojin Hwang ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Hwang, S., Choi, Y., & Lee, H. (2026). Evolve Together, Fall into Place: How Social Scaffolding Shapes Self-Evolving Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19799", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "自己進化するLLM多エージェント系の成果が、チーム構成と相互依存の構造（協力・同調・競争）という「社会的足場」に左右されることを示すAGORAを提案した。", "p3": "チーム構成と相互依存構造の2軸を独立に変え、3つの進化機構のもとでウェブ検索・コードベース理解・文書QAの課題を解かせる（抄録）。", "p5": "進化だけではほとんど効果がなく、適切な足場があると単独で進化した強いエージェントを最大25ポイント上回った。その仕組みは最も有能なメンバーに権限が移り他が退くことで、チームの中で育ったそのメンバーは同じモデル単独より優れた（抄録）。", "fun": "同じ能力のAIを集めても、チームの作り方で結果が変わる。協力させるか競わせるかで、誰がリーダーになるかまで変わるという発見だ。しかも「チームの中で育ったエージェント」は、一人で鍛えた同じモデルより強くなる。人間の部活やゼミで起きることが、AIの集団でも起きている。", "unverified": "3つの進化機構の名称と評価指標の定義は抄録にない。"}}, {"id": "pr40", "rank": 40, "headline": "校正された確率の伝達が多エージェント協調を高める", "title": "Narrowing the Collaboration Gap, Probably", "url": "https://arxiv.org/abs/2610.19215", "authors": "Mirah Shi ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Shi, M., Hussing, M., Globus-Harris, I., Collina, N., Roth, A., & Goel, S. (2026). Narrowing the Collaboration Gap, Probably (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19215", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "私的情報を持つLLMエージェント同士が「提案する行動」ではなく「行動に対する校正された確率」を伝え合うと、情報集約が改善することを理論と実験で示した。", "p3": "部分情報下の多ラウンド推論を模した単純な合成設定で確率伝達の優位を理論・実験で確かめ、次に訓練したTransformerと事前学習LLMによる協調迷路課題で検証する。確率に偏りがある場合には、事後の会話的な校正介入を与える（抄録）。", "p5": "校正された不確実性を保つ限り、確率の伝達は行動の伝達を上回った。伝える確率が偏ると利点は消えうるが、校正介入は玩具Transformerでも文脈内で修正を使う事前学習LLMでも一貫して意思決定を改善した（抄録）。", "fun": "二人が同じ答えを選んでも理由が違えば、その理由を共有したほうが賢い結論に近づく。「Aにしよう」ではなく「Aが正しい確率は7割」と伝えると、相手は自分の情報と合わせて更新できる。ただし自信過剰な確率は逆効果で、「言い直し」で校正してやると効く、という人間の会議にも通じる話だ。", "unverified": "迷路課題での性能差の数値は抄録にない。"}}, {"id": "pr41", "rank": 41, "headline": "LLM編集者で国際メディアの議題設定を模擬", "title": "Structural Dependence, Imitation or Herding? A Multi-Agent Simulation of Global Intermedia Agenda Setting", "url": "https://arxiv.org/abs/2610.20144", "authors": "Mohammad Yousuf ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Yousuf, M., & Habib, A. M. T. (2026). Structural Dependence, Imitation or Herding? A Multi-Agent Simulation of Global Intermedia Agenda Setting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20144", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "途上国の報道機関が欧米の主要紙と似た国際報道をする理由（通信社への依存、模倣、群れ行動）を、観測データとLLMエージェントのシミュレーションで切り分けようとした。", "p3": "バングラデシュ・ケニア・南アフリカ・インド・マレーシア・ナイジェリアの18紙が、ウクライナとガザの戦争と2つの国連気候会議（2022〜2024年）で4つの中核紙に注目量・切り口・時期でどれだけ追随したかを測り、言語モデルを各紙の編集者に見立てて依存・模倣・群れ行動を切り替えるシミュレーションを走らせた（抄録）。", "p5": "9つの検定のうち成り立ったのは1つで、通信社原稿に多く頼る紙ほど中核紙の後すぐに報じた。紙の格や地元の利害は効果なし。群れ行動の検定は支持され模倣は支持されなかった。シミュレーションは機構を決められず、依存ルールが当てはめると通信社原稿の掲載に帰着した。通信社原稿が周辺国の国際報道の「時計」を決めるが、議題を決めるかは未解決（抄録）。", "fun": "貧しい国の新聞がなぜ欧米の大手と同じニュースを同じ順で報じるのか。「お金がなくて通信社に頼るから」と「有名紙を真似たいから」は外から見ると区別がつかない。そこでAIに各紙の編集者を演じさせて原因を一つずつ切ってみた。結果は意外と控えめで、分かったのは「通信社が時間を決める」ことだけ、という正直な報告だ。", "unverified": "シミュレーションに使ったモデルと試行数は抄録にない。"}}, {"id": "pr42", "rank": 42, "headline": "実世界の説得場面でLLMの社会的知性を調べるPerSo", "title": "PerSo: Investigating Facets of LLMs' Social Intelligence in Real-World Persuasion Scenarios", "url": "https://arxiv.org/abs/2610.20548", "authors": "Ali Zamani ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Zamani, A., Esfahanian, S., Shahabi, E., Pilehvar, M. T., Shakery, A., & Yaghoobzadeh, Y. (2026). PerSo: Investigating Facets of LLMs' Social Intelligence in Real-World Persuasion Scenarios (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20548", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "実際の説得対話を使って、LLMの社会的知性を「他者の心を推測する認知面」と「適切な社会的行動を選ぶ行動面」の両面で評価するベンチマークPerSoを作った。", "p3": "RedditのChangeMyViewの実対話から、LLMを介したパイプラインで評価課題を構築し、人間の注釈で検証する。認知面と行動面を同時に測る（抄録）。", "p5": "性能は概ねモデル規模とともに上がるが次元によって差がある。最強のLLMは行動課題で観測された最良の人間をわずかに上回ったが、認知課題では最良の人間参加者が依然として先行した（抄録）。", "fun": "人を説得するには「相手が何を考えているか」を読む力と「それに合わせて何を言うか」を選ぶ力の両方が要る。この研究では、AIは「何を言うか」では人間の最高記録をわずかに超えたのに、「相手の心を読む」では人間に及ばなかった。言葉の選び方は上手でも、心の推測はまだ苦手という対比が面白い。", "unverified": "評価したLLMの名称と課題数は抄録にない。"}}, {"id": "pr43", "rank": 43, "headline": "自由回答のLLMコード化が集団推定値を動かす（GSS）", "title": "From Narratives to Population Shares: Coding Protocols, LLM Labels, and Measurement in GSS Next", "url": "https://doi.org/10.2139/ssrn.7613281", "authors": "MohammadJavad Khosravi Bakhtiarvandi", "venue": "SSRN", "date": "2026-10-15", "apa": "Khosravi Bakhtiarvandi, M. (2026). From Narratives to Population Shares: Coding Protocols, LLM Labels, and Measurement in GSS Next. https://doi.org/10.2139/ssrn.7613281", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "自由回答をLLMで分類して集団推定値を作るとき、回答者自身の選択・人間専門家・機械コーダ・モデルやプロンプトの違いという3種類の不一致が推定値をどう動かすかを、2024年GSS Nextで示した。", "p3": "4つのGPT設定で完全なコードを持つ902人について、ラベルの等重み平均と専門家コードを比較し、設計に基づく線形化区間とHolm族で検定する。公式の層・PSU識別子とNext用ウェイトで推論し、修正したRao-Wuブートストラップを用いる（抄録）。", "p5": "GPTの平均は専門家より「8つの争点のいずれでもない」を4.53ポイント少なく分類し（95%区間 [-7.19, -1.86]）、9カテゴリでも検出できた。一方、GPT同士の6組の残差シェア差は1.11ポイント以内で個別には有意でなかった（同等性は未確立）。回答者自身の選択と外部コードの差は20ポイントを超えるが、分類の手続き自体が違うため算法のせいにはできない（抄録）。", "fun": "世論調査の自由回答をAIに分類させると、結果の数字が人間の専門家と数ポイントずれる。しかもAI同士はほぼ同じ答えを出すので、ずれは「AIが気まぐれ」なのではなく「AIと人間で分類の癖が違う」ことから来る。どれが正しいかは決められない、と正直に書いているところが肝心だ。", "unverified": "4つのGPT設定の内訳と、Claude出力が不完全だった件数は抄録にない。"}}, {"id": "pr44", "rank": 44, "headline": "生成AI利用者は転職活動が活発だが転職は増えず", "title": "Searching Without Moving: Generative AI and Worker Mobility", "url": "https://doi.org/10.2139/ssrn.7590007", "authors": "Miguel &Aacute ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Casquet, M. &., Tercero-Lucas, D., & Victoria-Lanzon, C. (2026). Searching Without Moving: Generative AI and Worker Mobility. https://doi.org/10.2139/ssrn.7590007", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "職場で生成AIを使う労働者は転職活動が活発だが、実際に転職しやすいわけではないことを米国の家計調査で示した。", "p3": "2025年のSurvey of Household Economics and Decisionmaking（SHED）で、職場でのAI利用と、無作為化した仮想的な賃金変化への反応、最近の労働市場の結果を合わせて分析する（抄録）。", "p5": "大きな賃金カットへの反応は強いが、AI利用者と非利用者で差はない。主な違いは求職行動で、AI利用者は前年に他の職に応募した確率が約5ポイント高く、応募率はAIの利用頻度とともに上がる。ただし実際に転職した確率が高い証拠は見つからなかった（抄録）。", "fun": "仕事でAIを使っている人ほど、こっそり転職サイトに応募している。でも実際に会社を変える人が多いわけではない、という「動かずに探す」状態を描いている。AIで自分の市場価値が上がったと感じて外を見るのか、今の仕事が物足りなくなるのか、理由はまだ分からない。", "unverified": "標本サイズと応募率の差の推定方法は抄録にない。"}}, {"id": "pr45", "rank": 45, "headline": "ジョブ・クラフティングと燃え尽きを結ぶキャリア不作為", "title": "When Job Crafting Works: Career Inaction as a Mechanism Linking Job Crafting to Burnout under Work Precarity and Psychological Safety", "url": "https://doi.org/10.21203/rs.3.rs-10994030/v1", "authors": "Pradip Kumar Nanda", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Nanda, P. K. (2026). When Job Crafting Works: Career Inaction as a Mechanism Linking Job Crafting to Burnout under Work Precarity and Psychological Safety. https://doi.org/10.21203/rs.3.rs-10994030/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "接近型のジョブ・クラフティングが「キャリア不作為」を減らすことで燃え尽きを下げ、その効果が雇用の不安定さで弱まり、心理的安全性で強まることを示した。", "p3": "南アジアの従業員から3波の時間差パネルデータを集め、キャリア不作為を媒介、雇用の不安定さと心理的安全性を調整変数とする調整媒介モデルを検証する（抄録）。", "p5": "接近型ジョブ・クラフティングはキャリア不作為を減らして間接的に燃え尽きを下げるが、雇用が不安定だと影響が弱まり、心理的安全性が高いと強まった（抄録）。", "fun": "自分の仕事を自分で工夫して作り替える人は燃え尽きにくい、とよく言われる。この研究はその間に「キャリアについて動けない状態」が挟まっていると考えた。工夫しても将来が不安で動けなければ疲れは減らず、職場に安心感があれば工夫が実る。仕組みを一段細かく見た点が面白い。", "unverified": "標本サイズと効果の数値は抄録にない。"}}, {"id": "pr46", "rank": 46, "headline": "新技術導入時の従業員と管理職の認識ギャップ（ホンダ）", "title": "Perception Gap Between Employees and Managers When Introducing Innovative Technologies", "url": "https://doi.org/10.2139/ssrn.7615360", "authors": "Takumi Kato ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Kato, T., Miyata, T., & Tsuda, K. (2026). Perception Gap Between Employees and Managers When Introducing Innovative Technologies. https://doi.org/10.2139/ssrn.7615360", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "新技術導入時に「社内に知識が足りない」と感じるのは現場の従業員ではなく管理職であることを、ホンダのSDV開発部門の大規模調査で示した。", "p3": "ホンダのソフトウェア定義車両（SDV）開発部門の正社員1,374人と中間管理職170人に、開発スピード向上への期待、SDV技術・顧客ニーズ・社内知識、アイデア・承認プロセス・革新文化・リスク管理・意思決定の各要因を尋ねて比較する（抄録）。", "p5": "現場の従業員は自社の知識を有効と認識する一方、管理職は不足と認識し、社内知識をめぐる深刻な認識ギャップがあった。外注への依存は主に経営側の見方から必要とされていると推察され、先行研究の「従業員は恐れ、管理職は導入に前向き」とは逆に、技術企業では従業員が現場の知識に自信を持ち実験に前向きだった（抄録）。", "fun": "新しい技術を入れるとき、怖がるのは現場で、乗り気なのは上司、というのが通説だった。ところが日本の自動車会社の開発部門で1,500人超に聞くと、逆だった。現場は「自分たちはできる」と思い、管理職は「うちには知識がない」と思って外注に頼る。同じ会社の中で見えている景色が違うという話だ。", "unverified": "調査時期と回答率は抄録にない。"}}, {"id": "pr47", "rank": 47, "headline": "フィードバックが人間–AI協働の内省を形づくる", "title": "Think Once, Reflect Twice: How Feedback Shapes Human-AI Collaboration", "url": "https://arxiv.org/abs/2610.19991", "authors": "Joshua Holstein ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Holstein, J., Spitzer, P., Schäfer, S., Förster, M., & Satzger, G. (2026). Think Once, Reflect Twice: How Feedback Shapes Human-AI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19991", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIの助言を人が覆した場面へのフィードバック（事後の内省）が、人間–AI協働の依存行動と内省をどう変えるかを行動実験で調べた。", "p3": "244人の行動研究で、AI助言の上書きを対象にしたフィードバック介入を与え、事後の内省（reflection-on-action）と進行中の内省（reflection-in-action）、依存行動、チーム成績を測る（抄録）。", "p5": "フィードバックは事後の内省に影響する一方、一方向のフィードバックはその後の進行中の内省を減らす恐れがあった。依存行動は相反する方向に動き、全体のチーム成績は変わらないが文脈依存の効果が見られた。バランスの取れたフィードバックにはこの危険がなく、両方の内省が保たれた（抄録）。", "fun": "AIの提案を人が覆したとき、「覆して正解だった／失敗だった」と教えると人は反省するが、片方向の指摘ばかりだと次からは考えずに従うようになる。成績の平均は変わらないのに、人の考え方は変わっている。良い点と悪い点の両方を返すと、考え続ける力が保たれるという、学校の先生の指導にも通じる結果だ。", "unverified": "課題の内容とフィードバックの具体的な形式は抄録にない。"}}, {"id": "pr48", "rank": 48, "headline": "災害時の食料安全保障尺度の開発と心理測定評価", "title": "Measuring Disaster Food Security: Development And Psychometric Evaluation Of The Disaster Food Security Scale", "url": "https://doi.org/10.2139/ssrn.7615418", "authors": "Nadia Koyratty ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Koyratty, N., Josephson, A., Byker Shanks, C., Niles, M. T., Bliss, S., & Clay, L. (2026). Measuring Disaster Food Security: Development And Psychometric Evaluation Of The Disaster Food Security Scale. https://doi.org/10.2139/ssrn.7615418", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "災害時の世帯の食料安全保障の経験を測る15項目の災害食料安全保障尺度（DFSS）を開発し、心理測定的に評価した。", "p3": "災害食料安全保障枠組みに基づき、被災者の経験から15の記述を作って認知面接で磨き、2022年4月に米国の成人を対象とした横断調査に組み込む。過去5年に災害を経験した703人で因子分析、段階反応IRT、信頼性・妥当性、項目機能差を検討する（抄録）。", "p5": "内的一貫性はα=0.92、因子負荷は0.60超、識別力は1超だった。DFSS得点は既存の世帯食料安全保障モジュールの区分や災害時の食料対処行動と期待どおりの関連を示し、支配的な一般因子とともに多次元性の兆候もあった（抄録）。", "fun": "「食べ物に困っているか」を測る尺度は昔からあるが、災害のときは「店が開かない」「調理できない」「水がない」など困り方が違う。被災者の体験談から質問を作り、700人で数学的に検証している。ひとつの大きな「困り度」で説明できる一方、細かい側面も残るという結果は、尺度作りの難しさそのものだ。", "unverified": "項目機能差（DIF）の結果の詳細は抄録にない。"}}, {"id": "pr49", "rank": 49, "headline": "ボゴタの舗装保全の契約効率とライフサイクル分析", "title": "Lifecycle Analysis and Contractual Efficiency in Urban Pavement Preservation: Case Study of Bogota's Non-Trunk Arterial Road Network (2021– 2026)", "url": "https://doi.org/10.2139/ssrn.7610639", "authors": "Oscar Julián Moreno López", "venue": "SSRN", "date": "2026-10-15", "apa": "Moreno López, O. J. (2026). Lifecycle Analysis and Contractual Efficiency in Urban Pavement Preservation: Case Study of Bogota’s Non-Trunk Arterial Road Network (2021– 2026). https://doi.org/10.2139/ssrn.7610639", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ボゴタの都市道路の舗装保全で、3年という短い設計期間が舗装の機能的陳腐化と診断費用の重複を招くことを、2021〜2026年の契約の事例で示した。", "p3": "ボゴタ都市開発研究所（IDU）の道路保全スキームについて、特定区間で2021年と2026年に繰り返された診断・設計段階を追い、構造性能と契約効率を評価する（抄録）。", "p5": "2021年の診断は3年の設計期間で定期・日常の維持を処方し、期間満了と安定性保証の失効後、2026年に同区間が再び診断・設計の対象となって同様の推奨に至った。短期の設計期間が舗装の陳腐化と診断費用の非効率な重複を生むとし、設計期間の延長と長期の交通変数の組み込みによる管理枠組みを提案する（抄録）。", "fun": "道路を直すたびに「まず調べて設計する」費用がかかる。3年しかもたない設計にすると、3年後にまた同じ調査をして同じ答えが出る。役所の契約の区切り方が、道路の寿命と税金の使い方を決めているという、身近なインフラの話だ。", "unverified": "対象区間の延長と費用の数値は抄録にない。"}}, {"id": "pr50", "rank": 50, "headline": "ハーグの都市モビリティと集団健康の多スケール分析", "title": "Urban Mobility and Population Health in The Hague: A Multi-Scale Analysis", "url": "https://doi.org/10.21203/rs.3.rs-11142882/v1", "authors": "Hielke Muizelaar ほか", "venue": "Research Square (In Review)", "date": "20
