tification using a test vehicle: theoretical and experimental validation. Structures, 94, 113298. https://doi.org/10.1016/j.istruc.2026.113298", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "試験車両で橋梁の固有振動数を同定する際に、同時に橋を走る一般車両（social vehicle）がどう影響するかを理論と実験で検証した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋の「声」を聞くのに、橋に機械を付ける代わりに、センサを積んだ車で渡るだけで済ませたい。でも実際の橋には他の車も走っていて、その重さや振動が測定を乱す。「邪魔な車」をどう扱えば正しい振動数が取れるのか、という現場で避けて通れない問いを扱っている（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "LLMペルソナのシリコン標本は選挙世論調査を模倣できるか", "title": "Polling Without People: Can Silicon Samples of CASM-Inspired LLM Personae Mimic Human Respondents in Pre-Election Polling?", "url": "https://doi.org/10.1017/s1049096526103084", "authors": "Danielius Jonaitis ほか", "venue": "PS Political Science & Politics", "date": "2026-10-15", "citescore": 2.9, "citescore_year": "2025", "apa": "Jonaitis, D., Corcoran, B., Poudyal, B., Roskam, A., Ali, A. A., Agrawal, S., Duch, R., & Cerina, R. (2026). Polling Without People: Can Silicon Samples of CASM-Inspired LLM Personae Mimic Human Respondents in Pre-Election Polling? PS: Political Science & Politics, 1–18. https://doi.org/10.1017/s1049096526103084", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "CASMに着想を得たLLMペルソナの「シリコン標本」が、選挙前の世論調査で人間の回答者を模倣できるかを検証した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "人に聞かずにAIに「有権者のふり」をさせて世論調査ができたら、安く速く調査できる。しかし本当に人間と同じ答えを返すのか。「人のいない世論調査」という題名そのものが、合成回答者の可能性と危うさを一言で言い表している（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "疎なひずみ計測の逆FEMで梁状構造の変形を再構成", "title": "Sparse strain-based inverse finite element method for deformation reconstruction of beam-like structures: Theoretical study and experimental validation", "url": "https://doi.org/10.1016/j.istruc.2026.113270", "authors": "Yuanju Wang ほか", "venue": "Structures", "date": "2026-10-15", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Wang, Y., You, R., Ren, L., Feng, X., Feng, T., & Cui, J. (2026). Sparse strain-based inverse finite element method for deformation reconstruction of beam-like structures: Theoretical study and experimental validation. Structures, 94, 113270. https://doi.org/10.1016/j.istruc.2026.113270", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "疎なひずみ計測から梁状構造の変形を再構成する逆有限要素法（iFEM）を理論的に検討し、実験で検証した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物の形がどう変わったかを知りたいが、センサは数か所にしか付けられない。少ない点の「伸び縮み」の情報から全体の曲がり方を逆算するのが逆有限要素法だ。センサを減らしてどこまで形を復元できるかは、監視コストに直結する問いになる（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "RAG多エージェントLLM/VLMで歴史的組積造を監視", "title": "A RAG-enhanced multi-agent LLM/VLM framework for auditable and region-aware structural health monitoring of a historic masonry structure", "url": "https://doi.org/10.1038/s41598-026-57424-2", "authors": "Kemal Hacıefendioğlu ほか", "venue": "Scientific Reports", "date": "2026-10-15", "citescore": 6.4, "citescore_year": "2025", "apa": "Hacıefendioğlu, K., Kahya, V., & Aslan, T. (2026). A RAG-enhanced multi-agent LLM/VLM framework for auditable and region-aware structural health monitoring of a historic masonry structure. Scientific Reports, 16(1). https://doi.org/10.1038/s41598-026-57424-2", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "歴史的組積造のミナレット1基について、振動信号の異常検知・画像解析・検索拡張（RAG）された構造メモリを3つのLLM/VLMエージェントで統合し、追跡可能な多エージェント構造ヘルスモニタリングの概念実証を示した。", "p3": "4センサの振動データを洗浄・PSDによる基準化・適応窓・頑健正規化し、健全データ（計測1〜12）で学習した1次元畳み込み自己符号化器で計測13〜20を検査する。センサ対の関係型自己符号化器で局所化し、VLMが点検画像を解析、形状・材料・基準動特性・FEノート・点検手順を集めた構造メモリをRAGで参照する。Agent A（LLM+RAG）、B（VLM+RAG）、C（融合+RAG）が信号と画像の証拠の一致と矛盾を調停する（抄録）。", "p5": "RAGあり・なしの解析モードを単一の配備内で比較し、JSON成果物、画像ごとの所見、センサごとの要約、報告文、リスクマップなど構造化され追跡可能な出力を報告した（抄録）。", "fun": "古い石造りの塔の健康診断を、「振動を聞く係」「写真を見る係」「両方の意見をまとめる係」の3つのAIに分担させた。さらに塔の図面や過去の点検記録を「記憶」として持たせ、判断の根拠をあとから辿れるようにしている。人間の点検チームの会議をAIで再現したような設計だ。", "unverified": "異常検知の精度などの数値は抄録にない。"}}, {"id": "jr20", "rank": 20, "headline": "物理モデルと深層学習の統合で斜張橋ケーブル損傷を同定", "title": "Intelligent Damage Identification of Stay Cables for Long‐Span Cable‐Stayed Bridges by Integration of Physical Modeling and Deep Learning", "url": "https://doi.org/10.1155/adce/6132916", "authors": "Yichao Xu ほか", "venue": "Advances in Civil Engineering", "date": "2026-10-15", "citescore": 4.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "蘇通長江大橋を対象に、ベイズ最適化で更新した高忠実度FEモデルで136のケーブル破断シナリオを模擬し、1D-CNNでケーブル群の破断を同定する物理–データ融合の枠組みを示した。", "p3": "OpenSeesでFEモデルを構築し、ベイズ最適化によるモデル更新で実測モード特性に合わせる。更新モデルで単一ケーブル破断136ケースの主桁変位とケーブル張力の静的応答を模擬し、損傷–たわみのデータセットで最適化した1D-CNNを学習する。時間領域・周波数領域・時間–周波数領域の特徴を比較する（抄録）。", "p5": "モデル更新後の最大振動数誤差は2.4%未満で、長いケーブルが全体性能に強く影響した。時間領域データが最も高い分類精度88.78%を示した（抄録）。", "fun": "全長1kmを超える橋のケーブルが切れたとき、どのケーブルかを橋のたわみ方から当てる。実物を壊すわけにはいかないので、実測に合わせて調整したコンピュータ模型で136通りの「切れ方」を作り、AIに学ばせた。信号を「時間の波形のまま」見せるのが一番当たった、という結果が実務的だ。", "unverified": "学習データの分割と誤判定の内訳は抄録にない。"}}, {"id": "jr21", "rank": 21, "headline": "統合報告425件のトピックモデルで「統合」の弱さを示す", "title": "Mapping the Landscape of Integrated Reporting: Cross‐Industry Insights and Global Perspectives From a Topic Modeling Approach", "url": "https://doi.org/10.1002/csr.71069", "authors": "Francesca Culasso ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-15", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "統合報告（IR）の模範例425件をトピックモデルで分析し、業種差を超えて財務中心の言説が支配的で、IRが約束する「情報の結合性」が実証的に弱いことを示した。", "p3": "対話的会計の観点からIRを独白的開示と対話的説明責任の連続体と捉え、Corporate RegisterとIFRSの統合報告事例データベースの425報告書にLDAトピックモデル・多次元尺度法・ANOVAを適用する（抄録）。", "p5": "業種間の差は大きいが、模範例でも財務中心の言説が構造的に支配的で、サステナビリティの言説は区画化され、サステナビリティと財務業績のトピックの距離が持続して結合性は弱かった（抄録）。", "fun": "「財務も環境も社会も一つにつなげて語る」のが統合報告の売りだが、模範例とされる425冊を機械で読むと、お金の話と環境の話は別々の部屋に置かれたままだった。良い報告書の見本でさえそうなら、制度の理想と現実の差はかなり大きい。", "unverified": "トピック数と業種分類の詳細は抄録にない。"}}, {"id": "jr22", "rank": 22, "headline": "がん患者の非公式介護者は精神的苦痛日数が多い", "title": "Poor mental health days and depressive disorders comparing non-caregivers, informal non-cancer caregivers, and informal caregivers of cancer patients: BRFSS 2022–23", "url": "https://doi.org/10.1007/s00520-026-11337-y", "authors": "Jeanne M. Ward ほか", "venue": "Supportive Care in Cancer", "date": "2026-10-15", "sjr": 1.03, "citescore": 5.3, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国BRFSS 2022〜23年の約20万人で、がん患者の非公式介護者は頻繁な精神的苦痛、非がんの介護者は生涯うつ病診断と強く結びつくことを示した。", "p3": "介護モジュールを実施した24州の非介護者157,539人、非がん介護者39,047人、がん介護者3,078人について、頻繁な精神的苦痛日数（30日中6日以上）と生涯うつ病診断をロジスティック回帰で分析し、身体的健康・運動・人口学的属性・地域・年を調整する（抄録）。", "p5": "調整後、がん介護者は非介護者より頻繁な精神的苦痛のオッズが有意に高く（aOR=1.89、95%CI 1.58〜2.26）、非がん介護者は生涯うつ病診断のオッズが高かった（aOR=1.44、95%CI 1.36〜1.52）。がん介護は生涯うつ病より頻繁な苦痛と強く関連した（抄録）。", "fun": "家族の看病をしている人の心の負担は、看病の種類で現れ方が違う。がんの家族を支える人は「ここ1か月つらい日が多い」と答えやすく、それ以外の長期の介護をする人は「うつ病と診断されたことがある」と答えやすい。短い激しい負担と、長く続く負担の違いが数字に出ている。", "unverified": "介護の期間や時間など負担の量は抄録にない。"}}, {"id": "jr23", "rank": 23, "headline": "英国ロックダウン下の社会的孤立と高齢者の精神健康", "title": "The Effect of Social Isolation on the Mental Health of Older Adults: Evidence from the UK COVID-19 Lockdown", "url": "https://doi.org/10.1016/j.ssmph.2026.101987", "authors": "Cecilia Rodríguez Ingold ほか", "venue": "SSM - : "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "韓国72自治体の保健担当者への調査から、スマートヘルシーシティが環境・技術主導ではなく健康の公平性を進める手段として捉えられつつある一方、リテラシー・脆弱層・サービス統合が一貫して軽視されていることを示した。", "p3": "2023年の韓国ヘルシーシティ会議でMentimeterによるリアルタイム調査を行い、現在の課題、スマートな手法で解けそうな課題、将来の優先価値の3問の自由回答を16テーマ43指標にコード化してWHOコペンハーゲン合意の6P（People、Place、Participation、Prosperity、Peace、Planet）に対応づけ、分割表・χ²・対応分析で比べる（抄録）。", "p5": "482件の言及のうち、現在の課題はPlanet 25.9%とParticipation 27.6%に集中したが、スマートで解ける課題と将来の価値ではPeopleが23.0%→41.4%→46.6%と増え、3問の分布は有意に異なった（χ²[10]=79.50、P<.001、Cramer's V=0.29）。デジタル・健康リテラシー、脆弱層、サービス統合は一貫して少なかった（抄録）。", "fun": "「スマートシティ」と聞くとセンサや交通の話を想像するが、韓国の自治体の保健担当者が将来に望むのは「人（健康の公平）」だった。ところが、その公平を実現するのに必要な「デジタルを使えない人への配慮」は、回答の中でほとんど出てこない。理想と実装の間の抜け落ちが見える。", "unverified": "回答者数（72自治体の担当者の人数）は抄録にない。"}}, {"id": "jr26", "rank": 26, "headline": "ベトナム新地下鉄はTODか富裕層の飛び地か", "title": "New metro lines in Vietnam: transit-oriented development or elite-oriented enclaves? A synthesis of thematic analysis and the push-pull-mooring framework", "url": "https://doi.org/10.1016/j.rtbm.2026.101910", "authors": "Thanh Thi My Truong", "venue": "Research in Transportation Business and Management", "date": "2026-10-14", "sjr": 1.014, "citescore": 8.7, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "ベトナムの新しい地下鉄路線が、公共交通指向型開発（TOD）になっているのか富裕層向けの飛び地を生んでいるのかを、テーマ分析とプッシュ・プル・ムアリング枠組みで検討した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "新しい地下鉄ができると駅の周りが発展する。それは「みんなが車なしで暮らせる街」になるのか、それとも「お金持ちだけが住める高級エリア」になるのか。同じ投資でも、誰が恩恵を受けるかで評価が逆転する。発展途上の大都市で今まさに起きている問いだ（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "自動化は社会福祉職の関係性を損なうがwell-beingは不変", "title": "How is automation related to work characteristics and employee well-being? A work design perspective", "url": "https://doi.org/10.1177/10519815261488811", "authors": "Susanne Tafvelin ほか", "venue": "Work", "date": "2026-10-13", "citescore": 2.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "スウェーデンの社会福祉職1,428人の全国調査で、自動化（ロボット化・AI）は受益者との接触や社会的支援を減らし負荷と役割葛藤を増やすが、燃え尽きや活力には差がないことを示した。", "p3": "横断調査で、生活保護の自動意思決定支援などの自動化技術と働く人と、そうでない人の作業特性とwell-beingを比較する（抄録）。", "p5": "自動化は関係的側面（受益者接触・社会的支援）と負に関連し、知覚負荷と役割葛藤を増やしたが、意思決定の自律性・役割明確性・技能多様性に差はなく、燃え尽きや活力などのwell-beingにも有意差はなかった（抄録）。", "fun": "役所でAIが申請の審査を手伝うようになると、職員は「人と向き合う時間」が減り、仕事の量と板挟みは増えた。ところが疲れ具合や元気さは変わっていなかった。仕事の中身は確かに変わったのに、心の健康には（まだ）出ていない、という中間的な結果が、自動化の影響の測りにくさを物語る。", "unverified": "自動化群と非自動化群の人数の内訳は抄録にない。"}}, {"id": "jr28", "rank": 28, "headline": "マレーシア報道機関のAI導入と記者の認識", "title": "Do Malaysian Newsrooms Jump on the AI Bandwagon? Empirical Evidence From Journalists’ Perspectives", "url": "https://doi.org/10.17645/mac.12492", "authors": "Jiankun Gong ほか", "venue": "Media and Communication", "date": "2026-10-15", "sjr": 1.089, "citescore": 6.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "マレーシアの報道機関6社の記者20人への面接から、AI導入が一様ではなく選択的で、「慎重な最小主義者」「実験的な実用主義者」「人が門番を務める採用者」という3類型で進んでいることを示した。", "p3": "半構造化面接で、国のAIガバナンスの合図がどう編集室の規範に翻訳されるか、組織資源と経営の優先順位が導入をどう形づくるか、AIが取材・編集・検証にどう組み込まれるかを調べる（抄録）。", "p5": "国レベルの機運は編集室のガバナンスを生んでおらず、実践は限られた明文規則・選択的開示・強い人的責任で形づくられる。組織の能力はまちまちで、AIは文字起こし・翻訳・要約・見出し生成など限定的な補助業務に使われ、検証の労力は減るのではなく再配分されていた（抄録）。", "fun": "「ニュースの現場はAIに飛びついている」という見方に対し、マレーシアの記者たちは意外と慎重で、使うのは文字起こしや翻訳のような地味な作業に限られていた。しかも事実確認の手間は減らず、担当が移っただけ。AIで楽になる仕事と、むしろ人が見張る必要が増す仕事が分かれている。", "unverified": "3類型それぞれの組織数は抄録にない。"}}, {"id": "jr29", "rank": 29, "headline": "中国看護師の没入プロファイルとJD-R・実践環境", "title": "Profiles of Work Immersion among Chinese nurses and their relationships with Job Demands-Resources, Practice Environment, and Perceived Professional Benefits: A latent profile analysis", "url": "https://doi.org/10.1186/s12912-026-05486-y", "authors": "Xiaoyu Pan ほか", "venue": "BMC Nursing", "date": "2026-10-15", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "中国の看護師の仕事への没入（work immersion）のプロファイルを潜在プロファイル分析で分け、仕事の要求度–資源、実践環境、知覚された職業的便益との関係を調べた論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "同じ職場でも、仕事に深く入り込む人とそうでない人がいる。平均ではなく「どんなタイプの人がいるか」を統計で見つけ、タイプごとに職場の負担や支えとの関係を見るのが潜在プロファイル分析だ。看護師という負担の大きい職業で、没入が良いことなのか負担なのかを問うている（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "土石混合体のせん断モードが力学挙動に与える影響", "title": "Numerical Investigation of Shear Mode Effects on the Mechanical Behavior of Soil–Rock Mixtures", "url": "https://doi.org/10.1002/nag.70452", "authors": "Longzhen Zhao ほか", "venue": "International Journal for Numerical and Analytical Methods in Geomechanics", "date": "2026-10-15", "sjr": 0.995, "citescore": 5.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "土石混合体（SRM）のせん断挙動を直接せん断と単純せん断の2つのモードでDEM解析し、応力–変形・配位数・エネルギー散逸・力の鎖の違いを示した。", "p3": "個別要素法で、体積ブロック率（VBP）と垂直応力を変えて直接せん断と単純せん断を模擬する（抄録）。", "p5": "直接せん断はせん断応力が低くピーク後にひずみ軟化を示し、単純せん断は連続的に変形して高垂直応力で応力変動が強い。配位数の変動は直接せん断で頻繁で、転がりエネルギー散逸の増え方は2モードで異なる。高VBPでは直接せん断がせん断面近くに力の鎖を集中させ、単純せん断はより空間的に分散した力の鎖とせん断帯を示した（抄録）。", "fun": "大きな石と土が混ざった地盤を「ずらす」とき、箱を上下にずらす試験と、平行四辺形に歪ませる試験では、同じ材料でも違う強さが出る。粒を一つずつ追う計算で中を覗くと、力を伝える「粒の鎖」がどこに集まるかが試験の仕方で変わっていた。どの試験が自然の斜面に近いか、という問いにつながる。", "unverified": "粒子数とVBPの具体値は抄録にない。"}}, {"id": "jr31", "rank": 31, "headline": "初期静的せん断が超軟弱粘土の繰返し軟化に及ぼす影響", "title": "Effect of Initial Static Shear on Cyclic Softening Behavior of Very Soft Clay", "url": "https://doi.org/10.1061/jggefk.gteng-15119", "authors": "Shrweta Dutta ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-15", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "超軟弱粘土の繰返し軟化に初期静的せん断が与える影響を、ひずみ制御非排水繰返し単純せん断試験の2系列で調べ、間隙水圧発生の経験モデルと設計チャートを示した。", "p3": "有効応力または間隙水圧に基づく基準で繰返し軟化を解釈し、ひずみに基づく経験モデルで静的–繰返し載荷下の繰返し間隙水圧の発生を推定して文献の軟弱粘土で検証する。初期静的せん断と上載圧の複合効果はべき乗則で特徴づける（抄録）。", "p5": "初期静的せん断は繰返し載荷下の軟化を増幅し、各ひずみ振幅・上載圧で剛性を下げたが、静的せん断がない場合に剛性低下が最大で総せん断応力の動員が最小だった。ひずみ依存の設計チャートで沿岸・洋上基礎の繰返し軟化の可能性を評価できる（抄録）。", "fun": "柔らかい粘土の上に建つ基礎は、波や地震で何度も揺すられると「へたって」いく。最初からある程度力がかかっている（傾いた斜面や片寄った荷重）と、へたり方が変わる。意外なのは、最初の力があると剛性は下がるのに、力がまったくない場合のほうが剛性の落ち込みが最大だった点だ。", "unverified": "試験の本数と粘土の物性値は抄録にない。"}}, {"id": "jr32", "rank": 32, "headline": "BPM–PRM混成モデルでバラスト劣化を二重スケール再現", "title": "Hybrid BPM-PRM Model for Dual-scale Degradation of Ballast", "url": "https://doi.org/10.1139/cgj-2026-0137", "authors": "Jirayut Sudsamerjai ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-14", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "バラスト（線路の砕石）の割れと摩耗という二重スケールの劣化を、結合粒子モデル（BPM）と粒子置換モデル（PRM）を統合したDEM枠組みで再現した。", "p3": "BPMは形状と破砕を表せるが摩耗による細粒生成が苦手、PRMはその逆という弱点を補うため両者を統合する。単粒子圧縮試験とtn族値分析で各成分を独立に検証し、ロサンゼルス摩耗試験の初期回転で検証する（抄録）。", "p5": "混成モデルは分裂や角の破砕といった大きな破壊と、摩耗による細粒生成という小さな劣化の多モードの挙動を再現した（抄録）。", "fun": "線路の下の砕石は、列車の重みでパキッと割れることもあれば、こすれて粉になることもある。コンピュータの粒子モデルは、割れ方が得意なものと粉の出方が得意なものに分かれていて、両方を一度に扱えなかった。二つを組み合わせて「割れて、こすれて、粉がたまる」までを一つの計算で追えるようにした。", "unverified": "摩耗試験との定量的な一致度は抄録にない。"}}, {"id": "jr33", "rank": 33, "headline": "SPDEの粒子表現：Kurtzの遺産を概観", "title": "A survey of particle representations for stochastic partial differential equations: The legacy of Thomas G. Kurtz", "url": "https://doi.org/10.1214/26-aop1857", "authors": "Jie Xiong", "venue": "Annals of Probability", "date": "2026-10-15", "sjr": 2.849, "citescore": 4.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "確率偏微分方程式（SPDE）の発展と3つの基本的アプローチを概観し、Kurtzが始めた粒子表現を代替アプローチとして紹介して応用を示す総説である。", "p3": "SPDEの発展の短い概観、Kurtzによる粒子表現の導入、いくつかの応用の提示という構成（抄録）。", "p5": "総説のため主要な結果は示されず、粒子表現がSPDEの代替アプローチになることを述べる（抄録）。", "fun": "ランダムに揺れる場（たとえば騒音の中で広がる熱）を記述する方程式は難しいが、「たくさんの粒子の動きの平均」として見ると、扱いやすくなることがある。この総説は、その見方を切り開いた数学者Kurtzの仕事を振り返る。方程式を粒に分解するという発想の系譜を知る入口になる。", "unverified": "抄録が短く、取り上げられた応用の内容は不明。"}}, {"id": "jr34", "rank": 34, "headline": "粒状体の代表体積要素条件と柱状荷重伝達構造", "title": "Micromechanical signature of representative volume conditions in granular materials: Particle-shape effects and column-like load-bearing structures", "url": "https://doi.org/10.1016/j.compgeo.2026.108734", "authors": "Jitinun Prommarin ほか", "venue": "Computers and Geotechnics", "date": "2026-10-15", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "粒状体で代表体積要素（RVE）の条件が満たされるかを微視力学的な特徴から判定し、粒子形状の効果と柱状の荷重支持構造を論じた論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "砂のような粒の集まりを「連続した物体」として扱ってよいのは、十分大きな塊を見たときだけだ。どれだけ大きければよいかは粒の形で変わり、しかも力は粒の中を柱のように細い道で伝わっている。「どこまで小さく切っても砂は砂か」という問いを、粒の中の力の通り道から考えている（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "斜面安定のための個別要素法の概観", "title": "An overview of discrete element modeling for slope stability", "url": "https://doi.org/10.1007/s43939-026-00998-5", "authors": "Marwane Hammouti ほか", "venue": "Discover Materials", "date": "2026-10-14", "citescore": 4.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "斜面安定への個別要素法（DEM）の応用を、接触構成則・ミクロ–マクロ較正・せん断強度低減法のミクロ版・GPUとマルチスケール実装・機械学習代理モデルの5点で批判的に概観し、7つの未解決課題を挙げた。", "p3": "砂・膠結岩・粘性土に適用できるモデルを体系的に比較し、Hertz–MindlinからParallel Bond Model、Modified Cam-Clayまでの較正戦略を整理する。Boltonに基づくミクロ–マクロ写像で、接触摩擦の比例的低減が巨視的強度の同じ比例低減を一般に生まないことを示し、結合体には損傷依存の枠組みを導入する（抄録）。", "p5": "ミクロとマクロの安全率の差の符号は状態依存で普遍ではない。粘性土のMCCベースDEM較正の標準手順の欠如、途上国の実地すべりに対するDEM逆解析の不足、過渡的間隙水圧下の水理–力学連成枠組みの必要性などの課題を挙げ、モロッコ北部の地すべりの逆解析で可能性と限界を例示した（抄録）。", "fun": "斜面が崩れる計算は、土を「連続した塊」として扱う方法と「粒の集まり」として扱う方法がある。粒で計算すれば、粒同士の結合が切れていく様子まで見える。ただし「粒の摩擦を2割減らせば斜面の強さも2割減る」とは限らない、と指摘しているのが面白い。小さな世界の操作が大きな世界に同じ割合で伝わらない。", "unverified": "総説のため個別の数値結果はなく、モロッコの事例の詳細も抄録にない。"}}, {"id": "jr36", "rank": 36, "headline": "金平の高位長距離地すべりの破壊機構と動的過程", "title": "Failure mechanism and dynamic process of the Jinping high-position and long-runout landslide in the Wumeng mountainous area, China, on 8th February 2025", "url": "https://doi.org/10.1080/19475705.2026.2746178", "authors": "Sainan Zhu ほか", "venue": "Geomatics Natural Hazards and Risk", "date": "2026-10-13", "citescore": 7.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "2025年2月8日に中国・烏蒙山地で起きた金平の高位長距離地すべりを、現地調査・リモートセンシング・InSAR・室内試験・数値解析で統合解析し、地質的要因と降雨の誘因、約50秒の運動過程を明らかにした。", "p3": "変形の推移、成因機構、運動過程を複数手法で復元し、制御要因を地質レベルと降雨レベルに分けて整理する（抄録）。", "p5": "硬軟互層の反傾斜破砕岩体が不安定化の内的要因、上部急・下部緩の地形が土石流化の前提で、連続的な浸透が引き金だった。初期変形は2014年に現れ2020年以降加速して崩壊に至り、後方崖には不安定岩体が残る。模擬では全過程約50秒、最大速度48m/s、最大堆積厚23mで、岩体が進行的に破砕した（抄録）。", "fun": "山の高いところで崩れた土砂が遠くまで走る「高位長距離地すべり」は、わずか50秒で時速170km超に達していた。注目すべきは、衛星のレーダーで見ると崩れる10年前から斜面がじわじわ動いていた点だ。静かな前兆と突然の崩壊の両方が一つの事例に収まっている。", "unverified": "地すべりの体積と被害の規模は抄録にない。"}}, {"id": "jr37", "rank": 37, "headline": "サービス品質はロイヤルティ経由で銀行成果に効く", "title": "Service quality improves perceived bank performance through customer loyalty in Indian small finance banks", "url": "https://doi.org/10.1007/s44282-026-00622-0", "authors": "Sandeep Raghuwanshi ほか", "venue": "Discover Global Society", "date": "2026-10-14", "citescore": 1.2, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "北インドの小規模金融銀行3行の顧客380人で、サービス品質が顧客ロイヤルティを介して知覚された銀行成果に効き、スイッチングコストの調整効果はごく弱いことを、PLS-SEM・必要条件分析（NCA）・重要度–成果マップ（IPMA）で示した。", "p3": "サービス品質を有形性・信頼性・応答性・確実性・共感の2次構成概念とし、PLS-SEMで媒介と調整を検定、NCAで最低閾値条件、IPMAで経営上の優先順位を求める（抄録）。", "p5": "サービス品質はロイヤルティ（β=0.340）と知覚成果（β=0.231）に正に関連し、ロイヤルティが媒介した（β=0.178）。スイッチングコストの調整効果はβ=0.073、p<0.10で95%CIがゼロを含み、暫定的な信号に留まる。NCAでは信頼性（d=0.347）と共感（d=0.273）が最も強い必要条件で、IPMAでは共感の総効果が最大、ロイヤルティ指標に最大の重要度–成果ギャップがあった（抄録）。", "fun": "銀行のサービスがよいと客はファンになり、ファンが増えれば銀行は儲かる、という当たり前を確かめただけでは終わらない。「乗り換えが面倒だから残る」という縛りの効果はほとんどなく、著者自身が「結論には使えない弱い信号」と正直に書いている。さらに「これがないと話にならない」最低条件は、信頼性と共感だった。", "unverified": "調査時期と回答率は抄録にない。"}}, {"id": "jr38", "rank": 38, "headline": "公的医療のサービス回復は多主体の資源再構成", "title": "Negotiated resource reconfiguration and co-restoration in public healthcare service recovery: An SDL-grounded mid-range theory", "url": "https://doi.org/10.71085/rjhsa.04.04.148", "authors": "Zahid Iqbal ほか", "venue": "Research Journal of Human and Social Aspects", "date": "2026-10-14", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "パキスタンの公的医療機関の関係者28人への面接から、公的医療のサービス回復が謝罪や返金ではなく、家族介護者を含む多主体の資源再構成として交渉的に行われることを示す中範囲理論を構築した。", "p3": "サービス・ドミナント・ロジック（SDL）と構成主義的グラウンデッド・セオリー（Charmaz, 2014）に基づき、Mansehra地区の一次・二次公的医療機関の主要情報提供者28人への理論的サンプリングによる深層面接から、8段階の資源再編成プロセスモデルと8つの命題（P1〜P8）を導く（抄録）。", "p5": "公的医療の回復は、制度の硬直性・規範・資源制約・行政の慣性で正式な回復が妨げられる中、家族介護者などの非公式な主体が回復の担い手として価値共創を再生・回復する、高度に交渉された多主体の実践だった（抄録）。", "fun": "レストランで失敗があれば店が謝って割引する。でも公立病院で何かがうまくいかなかったとき、そんな「回復」は起きにくい。代わりに患者の家族が薬を探し、順番を交渉し、看護を補って穴を埋めている。サービスの立て直しを「店の仕事」ではなく「みんなの仕事」として捉え直す視点だ。", "unverified": "8段階の内容と命題の具体的な文言は抄録にない。"}}, {"id": "jr39", "rank": 39, "headline": "インフルエンサーの休止は関係の中断としてフォロワーに作用", "title": "Influencer Breaks as Relational Interruptions: The Roles of Attribution, Disappointment, and Emotional Attachment", "url": "https://doi.org/10.1002/mar.70282", "authors": "Mithila Mehta ほか", "venue": "Psychology and Marketing", "date": "2026-10-15", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インフルエンサーの活動休止を「関係の中断」と捉え、休止が本人の制御可能だと受け取られるほど失望とフォロー解除意図が高まり、感情的愛着がその反応を増幅することを示した。", "p3": "帰属理論と関係研究に基づき、パイロットのフィールド研究と3つの実験で、休止の制御可能性の知覚が失望とフォロー解除意図に与える影響と、感情的愛着の条件付け効果を調べる（抄録）。", "p5": "制御可能と知覚された休止は、そうでない休止より大きな失望と強いフォロー解除意図を生み、失望がその関係を媒介した。感情的に愛着のあるフォロワーは一般にフォローを外しにくいが、愛着は制御可能性の手がかりへの感情反応を増幅し、間接効果を強めた（抄録）。", "fun": "好きな配信者が「しばらく休みます」と言ったとき、「病気なら仕方ない」と思うか「サボりだ」と思うかで、フォローを外すかが変わる。しかも熱心なファンほど離れにくい一方で、「サボりだ」と感じたときの失望も大きい。愛着は守りにも裏切られた感情にもなる、という二面性が見えている。", "unverified": "各実験の参加者数は抄録にない。"}}, {"id": "jr40", "rank": 40, "headline": "顧客志向の波及効果と最前線従業員のwell-being", "title": "The ripple effects of customer orientation: Personal, vicarious, and temporal pathways to frontline employee well-being", "url": "https://doi.org/10.1007/s11747-026-01218-5", "authors": "Siddeeq M. Shabazz ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-10-15", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "顧客志向が最前線従業員のwell-beingに、個人・代理・時間という3つの経路で波及することを示した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「お客様第一」は客のためのものだが、題名は、それが働く人自身の幸福にも波紋のように広がると示唆する。自分の姿勢（個人）、同僚の姿勢を見ること（代理）、そして時間をかけて効いてくる経路の3つを分けている。客を大切にすることが従業員を消耗させるのか、むしろ満たすのか、という問いだ（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "挑戦ストレッサーは最前線従業員の非倫理行動を減らす", "title": "Can Stress Curb Unethical Employee Behavior? Evidence From Frontline Contexts", "url": "https://doi.org/10.1002/mar.70295", "authors": "Abbie Iveson ほか", "venue": "Psychology and Marketing", "date": "2026-10-15", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "最前線のサービス従業員708人の3研究で、挑戦ストレッサー（達成の機会）は非倫理的行動を減らし、妨害ストレッサー（成長の障壁）は増やすこと、自己効力感がその機構であることを示した。", "p3": "挑戦–妨害ストレッサー枠組みと取引的ストレス理論に基づき、ストレッサーの型が非倫理的従業員行動に与える影響と、自己主導・仲間主導の2つの能力開発の調整効果を検証する（抄録）。", "p5": "挑戦ストレッサーは自己効力感を高めて非倫理的行動を減らし、妨害ストレッサーは自己効力感を下げて増やした。自己主導の能力開発は両方のストレッサー型を調整し、仲間主導の能力開発は挑戦ストレッサーのみに効いた（抄録）。", "fun": "「ストレスがあると人はズルをする」と言われるが、ストレスの種類で逆になる。難しいが成長できる課題は「自分はできる」という感覚を育て、ズルを減らす。一方、邪魔ばかりの環境はその感覚を削り、ズルを増やす。同じ「大変さ」でも中身が違えば正反対に効く、という発見だ。", "unverified": "3研究それぞれの設計と効果量は抄録にない。"}}, {"id": "jr42", "rank": 42, "headline": "認知概念図に基づく多エージェントでCBT対話を生成", "title": "CCD-MAF: A Cognitive Conceptualization Diagram-driven Multi-Agent Framework for structured CBT dialogue generation", "url": "https://doi.org/10.1016/j.ipm.2026.105230", "authors": "Zepeng Li ほか", "venue": "Information Processing & Management", "date": "2026-10-13", "sjr": 1.845, "citescore": 16.8, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "認知行動療法（CBT）の4段階を網羅する1,314対話のデータセットCCD-CBTを構築し、認知概念図（CCD）で導かれる階層的多エージェント枠組みCCD-MAFで構造化されたCBT対話を生成した。", "p3": "教科書の専門知識とHaodf Onlineなどの実際の医師–患者相互作用を統合し、平均132.12ターン（患者発話61.34字、治療者発話97.05字）の対話を作る。CCD-MAFはマクロの段階計画、メゾの状態追跡、ミクロの技法実行に分解し、Qwen2.5-7Bを治療者部品として微調整して単一・複数ターンの臨床模擬を行う。システム間比較と、同じ枠組み内での治療者部品の置換比較を区別する（抄録）。", "p5": "認知療法尺度（CTS）に基づく模擬評価でCCD-MAFは強い性能を示し、部品置換設定では微調整した治療者部品が最良だった。アブレーションで多エージェント機構の寄与が支持された。評価は模擬カウンセリングに限る（抄録）。", "fun": "心の相談にAIを使う試みは多いが、たいていは「共感的な返事」を返すだけで、治療の手順を踏まない。この研究は、カウンセリングを「全体の計画」「今どの段階か」「今使う技法」の3層に分け、それぞれ別のAIに担当させた。人間の治療者が頭の中でやっている段取りを、分業として形にしたところが面白い。", "unverified": "CTS得点の数値と比較したシステムの名称は抄録にない。"}}, {"id": "jr43", "rank": 43, "headline": "ペルソナ駆動の異質性をもつネットワーク型ABM", "title": "Beyond Hyper-Rationality: Persona-Driven Heterogeneity in Networked Agent-Based Systems", "url": "https://doi.org/10.1109/tnse.2026.3742449", "authors": "Shunya Hirashima ほか", "venue": "IEEE Transactions on Network Science and Engineering", "date": "2026-10-14", "sjr": 1.875, "citescore": 14.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "ネットワーク化されたエージェントベースシステムで、超合理的な均一エージェントを超えて、ペルソナ駆動の異質性を導入した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "社会のシミュレーションでは、登場人物全員が「完璧に合理的で同じ性格」と仮定されがちだ。しかし現実の人は性格も判断の癖も違う。題名は、エージェントに「人格」を持たせて多様にしたとき、ネットワーク全体の振る舞いがどう変わるかを問う。均一な世界と多様な世界の違いを測る試みだ（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "IRT・IRTreeで回答スタイルを補正するRチュートリアル", "title": "Accounting for response styles in rating data using IRT and IRTree models: A tutorial in R with applications to self-reported metacognitive competence", "url": "https://doi.org/10.3758/s13428-026-03181-z", "authors": "Thorsten Meiser ほか", "venue": "Behavior Research Methods", "date": "2026-10-15", "sjr": 2.382, "citescore": 8.7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "評定尺度データの回答スタイル（中点や極端な選択肢を好む・避ける傾向）をIRTとIRTreeモデルで分離し、潜在特性の推定値を補正する手順をRで示したチュートリアルである。", "p3": "回答スタイル因子を含むIRTとIRTreeモデルの概要を示し、自己報告のメタ認知能力の実データ（Double, 2025）でモデルの実装・推定・解釈の流れを例示する。モデルは標準的なツールで指定し、多次元IRTの共通枠組みでパッケージにより推定する（抄録）。", "p5": "両モデルクラスとも実質的な特性と回答スタイルを分離でき、特性次元間と回答スタイル因子間には顕著な相関がある一方、特性と回答スタイルの相関は小さかった。中点・極端回答スタイルを補正すると、特性推定値は期待どおりの増幅と縮小のパターンを示した（抄録）。", "fun": "アンケートで「どちらでもない」ばかり選ぶ人と、「非常にそう思う」ばかり選ぶ人がいる。質問の中身と関係ない「答え方の癖」だ。この癖を無視すると、本当の性格や能力を測り間違える。癖を別の変数として同時に推定し、本体の点数から差し引くやり方を、実際のコードつきで手ほどきしている。", "unverified": "データの人数と項目数は抄録にない。"}}, {"id": "jr45", "rank": 45, "headline": "公共料金滞納と賭博の行動シグナルで信用リスクを説明", "title": "Behavioral Financial Signals and Explainable AI in Credit Risk Assessment: Evidence from Utility Arrears and Gambling Activity", "url": "https://doi.org/10.3390/jrfm19100818", "authors": "Shynara Sarkambayeva ほか", "venue": "Journal of Risk and Financial Management", "date": "2026-10-15", "citescore": 5.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "カザフスタンの消費者信用で、デジタル賭博への参加と公共料金の滞納を行動的リスク指標として組み込み、木ベースのアンサンブル（XGBoost）が従来のロジスティック回帰を大きく上回る予備的証拠を示した。", "p3": "調査由来のデータ（回答者41人から最終的に233人の借り手コホート）で、ロジスティック回帰・決定木・ANN・ランダムフォレスト・XGBoostを層化5分割交差検証で調整し、SMOTEで均衡化した評価プール（N=473）と30%の経験的ホールドアウト（N≈70）で評価する（抄録）。", "p5": "経験的コホートの88.84%がデフォルトまたは遅延で、ロジスティック回帰は精度83.1%・AUROC 0.854で最低、XGBoostは均衡プールでAUROC 0.976、特異度97.4%、感度96.2%だった。著者はデータ規模から決定的結論は得られないと述べている（抄録）。", "fun": "「ギャンブルをするか」「電気代を払い忘れるか」という日常の行動から、お金を返せるかを予測する。銀行が持つ年収や職業より、こうした行動のほうが変化を早く映す、という発想だ。ただし元の調査は41人と小さく、著者自身も「決定的な結論は出せない」と念押ししている。", "unverified": "41人の回答者から233人の借り手コホートがどう構成されたかは抄録から読み取れない。"}}, {"id": "jr46", "rank": 46, "headline": "高潮洗掘を受ける橋脚の地震脆弱性を統合評価", "title": "Seismic Fragility Assessment of Shallow‐Foundation‐Supported Bridge Piers Subjected to Surge Wave‐Induced Scour", "url": "https://doi.org/10.1002/eqe.70314", "authors": "S. M. Hadi Moosavian ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-15", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "高潮の洗掘を受けた直接基礎の橋脚について、3次元水理解析と非線形FEを結合した地震脆弱性評価の枠組みを示し、損傷機構が地盤–基礎相互作用のモードに強く依存することを明らかにした。", "p3": "洗掘の発達を3次元水理模擬で求め、連続体地盤と地盤–構造相互作用を含む橋脚–基礎–地盤系の非線形FEと結合する。浮き上がり支配型と沈下支配型の2つの直接基礎について静的と動的解析を行い、プッシュオーバー・プッシュダウンから損傷状態の閾値を定め、45の規準適合地震動で時刻歴解析を行う（抄録）。", "p5": "洗掘は両系の横方向耐力と剛性を下げ、劣化は沈下支配型で大きく、鉛直耐力の損失は浮き上がり支配型で顕著だった。沈下に基づく脆弱性では洗掘は浮き上がり型にほぼ無影響だが沈下型の脆弱性を大きく増し、ドリフトに基づく脆弱性曲線は洗掘後に低いスペクトル加速度へ大きく移った（抄録）。", "fun": "洪水で橋脚の足元の土が削られた後に地震が来たらどうなるか。この研究は、水の流れの計算と地震の計算をつないで答えを出した。面白いのは、同じ「洗掘」でも基礎が「浮き上がる型」か「沈む型」かで弱り方がまったく違う点だ。災害は単独ではなく重なって来る、という前提の設計だ。", "unverified": "脆弱性曲線の数値（中央値など）は抄録にない。"}}, {"id": "jr47", "rank": 47, "headline": "中国高齢夫婦のスマホ行動と孤独のAPIM分析", "title": "Smartphone behavior and loneliness among older couples in China: Actor-partner interdependence modeling", "url": "https://doi.org/10.1371/journal.pone.0359013", "authors": "Siqi Huang ほか", "venue": "PLoS ONE", "date": "2026-10-14", "citescore": 4.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "成都の高齢夫婦202組で、スマートフォンの行動と孤独の関係を行為者–パートナー相互依存モデル（APIM）で分析し、本人効果に加えて夫の利用が妻の孤独を下げるパートナー効果を示した。", "p3": "2022年10月〜2023年5月に2つの地域医療センターで横断調査を行い、スマホ習熟度・利用時間・用途・総合スコアと孤独の相互依存効果をAPIMで調べる（抄録）。", "p5": "夫の習熟度・時間・用途・総合スコアはいずれも自身の孤独と負に関連し、妻は習熟度・時間・総合スコアで同様だが用途には有意な本人効果がなかった。パートナー効果では、夫の長い利用時間と高い総合スコアが妻の孤独の低さと有意に関連した（抄録）。", "fun": "高齢者がスマホを使いこなすと孤独が減る、というだけでなく、夫がスマホをよく使うと妻の孤独まで減っていた。逆（妻の利用が夫に効く）は見つからなかった。夫婦を一人ずつではなく「ペア」として分析したからこそ見えた非対称で、孤独対策は個人より夫婦単位で考えるべきだと示唆する。", "unverified": "横断研究のため因果の向きは確定できない。"}}, {"id": "jr48", "rank": 48, "headline": "ポルトガルの家族介護者の予期悲嘆と関連要因", "title": "Anticipatory Grief and Associated Factors Among Family Caregivers of Patients with Palliative Needs in Portugal: A Community-Based Cross-Sectional Study", "url": "https://doi.org/10.3390/healthcare14203435", "authors": "Gisele Silvani Reami ほか", "venue": "Healthcare", "date": "2026-10-14", "citescore": 5.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ポルトガルで在宅の緩和ケアを要する人の家族介護者351人を調査し、予期悲嘆が介護負担・感情症状・満たされない家族ニーズと結びつき、回帰モデルで分散の55.2%を説明できることを示した。", "p3": "電子調査で、Marwit-Meuser介護者悲嘆目録短縮版、Zarit負担面接、家族ニーズ目録、Edmonton症状評価尺度、緩和パフォーマンス尺度を収集し、記述統計・相関・重回帰で分析する。STROBEチェックリストに従う（抄録）。", "p5": "予期悲嘆の平均は56.90±13.84で、約55.3%が重度の負担を示した。悲嘆は要介護者の機能状態の低さ、介護負担、感情症状の強さ、家族ニーズの充足の低さと関連し、調整モデルでは介護の影響と介護への期待が最大の標準化係数を示した（R²=0.552）（抄録）。", "fun": "大切な人を看取る前から始まる悲しみを「予期悲嘆」と呼ぶ。この研究では、家族介護者の半数以上が重い負担を抱え、悲しみの強さは本人の病状よりも「介護が自分の生活に与える影響」と「介護に何を期待していたか」で説明された。悲しみは病気の重さだけでなく、介護の状況からも生まれる。", "unverified": "調査の実施時期と募集方法は抄録にない。"}}, {"id": "jr49", "rank": 49, "headline": "香港の家族介護の経済的評価手法を比較", "title": "Comparing economic approaches to family caregiving valuation in Hong Kong China", "url": "https://doi.org/10.1038/s41514-026-00530-2", "authors": "Xingnan Yi ほか", "venue": "npj Aging", "date": "2026-10-14", "sjr": 3.126, "citescore": 7.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "香港における家族介護の経済的価値を評価する複数の手法を比較した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "家族が無償で行う介護は、お金で測られないために政策から見えにくい。「もし外部に頼んだらいくらか」「本人が働けたらいくら稼げたか」など、測り方で値段は大きく変わる。どの測り方を選ぶかが、介護者への支援額を左右するという意味で、計算方法そのものが政治的な問いになる（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jr50", "rank": 50, "headline": "都市環境でのGNSS/INS密結合の確率モデル最適化", "title": "Refined multipath-error-aided stochastic model optimization for GNSS/INS tightly coupled integration in complex urban environments", "url": "https://doi.org/10.1016/j.measurement.2026.123574", "authors": "Yi Li ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-14", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "prepri での確率的勾配降下法（SGD）について、オンラインの重複バッチ平均共分散推定量の収束率を示し、i.i.d.の場合の最良率と一致することを証明した。", "p3": "状態依存と状態独立のマルコフ標本の下で、それぞれO(√d n^{-1/8}(log n)^{1/4})とO(√d n^{-1/8})の収束率を確立する（dは次元、nは観測数またはSGD反復数）。状態依存マルコフデータ下のSGD誤差のℓ2ノルムの最初の4次モーメントの収束率も示す（抄録）。", "p5": "マルコフ標本による追加誤差項とバッチ平均のブロック間の複雑な依存を克服し、線形・ロジスティック回帰でのSGDの信頼区間を数値例で示した。敵対者が訓練中に特徴を適応的に変える戦略的分類にも適用した（抄録）。", "fun": "データを少しずつ読みながら学習するSGDは速いが、「答えの誤差はどれくらいか」を同時に知るのは難しい。しかも現実のデータは前後がつながっていて独立ではない。この研究は、つながりのあるデータでも、独立なデータのときと同じ速さで誤差の幅を見積もれることを証明した。", "unverified": "数値例の設定の詳細は抄録にない。"}}, {"id": "jn17", "rank": 17, "field": "因果推論", "headline": "潜在アウトカムの処置効果を因果機械学習で推定", "title": "Structural-before/after-measurement approaches for estimating treatment effects in latent outcomes with causal machine learning.", "url": "https://doi.org/10.1037/met0000878", "authors": "Amota Ataneka ほか", "venue": "Psychological Methods", "date": "2026-10-15", "sjr": 4.769, "citescore": 23.4, "citescore_year": "2025", "why": "測定モデルを前後に置く構造的アプローチで、潜在変数アウトカムに対する処置効果を因果機械学習で推定する方法を提案する。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、題名検索で見つかったのは付随するRコードの説明のみで抄録は入手できず", "preprint": false, "short": true, "p1": "潜在変数として測られるアウトカム（尺度得点など）に対する処置効果を、測定モデルを構造モデルの前または後に置く方式で因果機械学習と組み合わせて推定する方法を提案した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「幸福度」や「学力」のように直接は測れず質問項目から推定するものに、ある介入が効いたかを調べたい。測定の推定を先にやるか、因果の推定と一緒にやるかで答えが変わりうる。機械学習で柔軟に調整しつつ測定誤差も扱う、という2つの難しさを同時に引き受けた問いだ（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "裁判官の金融保有と判決結果", "title": "Judge financial holdings and case outcomes: Evidence from judge financial disclosures", "url": "https://doi.org/10.1016/j.jacceco.2026.101949", "authors": "Tuhin Harit ほか", "venue": "Journal of Accounting and Economics", "date": "2026-10-14", "citescore": 11.7, "citescore_year": "2025", "why": "裁判官の金融開示データを用いて、保有資産と担当事件の結果の関係を実証する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、題名検索で見つかったSSRN版の抄録を使用", "preprint": false, "short": true, "p1": "米国の連邦地裁裁判官の金融開示と公開企業の民事事件を結び、裁判官が保有株の企業の事件で忌避せず、そうした事件でより有利に長く裁く傾向と、市場がその結果に好意的に驚くことを示した。", "p3": "2000〜2021年の裁判官の金融開示データと、全米の地方裁判所における公開企業の民事事件情報を結合し、保有株と判決結果・審理期間・株価反応の関係を調べる（抄録）。", "p5": "裁判官が普通株を保有する事件で忌避しない事例を複数確認し、利益相反のある事件では相反のない事件より有利に裁き時間がかかる頑健な証拠を得た。判決への株価反応は投資家が好意的に驚いたことを示す。裁判官の金融保有と判決の関係に関する初の大規模証拠（抄録）。", "fun": "裁判官が自分の持っている株の会社の裁判を担当したらどうなるか。本来は辞退すべきだが、辞退しない例が多数あり、そうした裁判では会社に有利な判決が出やすく、株価も上がっていた。裁判官の資産公開という地味な書類と裁判記録を突き合わせることで、見えにくい利益相反を数字にした。", "unverified": "事件数と効果の大きさは抄録にない。学術誌版の抄録は未確認。"}}, {"id": "jn19", "rank": 19, "field": "総合誌", "headline": "AI支援で請願の文体は変わるが成果は改善せず", "title": "Petition style changes with AI writing support but outcomes do not improve", "url": "https://doi.org/10.1038/s41562-026-02579-1", "venue": "Nature Human Behaviour", "date": "2026-10-14", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "AIライティング支援の普及で請願の文体は変化したが、請願の成果は改善しなかったことを大規模データで示す。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "AIの文章支援によって請願の文体は変わったが、請願の成果は改善しなかったことを示した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIに文章を手伝ってもらえば、誰でも整った請願文を書ける。ならば請願は通りやすくなるはずだが、題名は「文体は変わっても結果は変わらない」と言う。きれいな文章と説得力は別物なのか、全員が上手くなれば差がつかないのか。AI時代の「書く力」の意味を問う結果だ（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn20", "rank": 20, "field": "総合誌", "headline": "教育介入が村の社会ネットワークを組み替える", "title": "Educational intervention can rewire village social networks", "url": "https://doi.org/10.1038/s41586-026-11154-7", "authors": "Marios Papamichalis ほか", "venue": "Nature", "date": "2026-10-15", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "教育介入が村落の社会ネットワーク構造そのものを変えることを示す。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、題名検索で見つかったのは解析コードのREADMEのみで抄録は入手できず", "preprint": false, "short": true, "p1": "教育的介入が村落の社会ネットワークの構造を組み替えうることを示した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "村で誰が誰と友達か、誰に金を借りるかというつながりは、簡単には を理論の単位にする見方そのものが面白い（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、内容は未確認。"}}, {"id": "jn23", "rank": 23, "field": "環境・気候政策", "headline": "VIIRSで火災排出をほぼリアルタイム推定するGFED5NRT", "title": "Tracking recent extremes and interannual variability of global fire emissions using a near-real-time extension to the Global Fire Emissions Database", "url": "https://doi.org/10.5194/essd-18-7535-2026", "authors": "Yang Chen ほか", "venue": "Earth System Science Data", "date": "2026-10-15", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "MODISの退役に備え、VIIRSの活動火災観測からGFED5と整合する燃焼面積・排出量を日次でほぼリアルタイムに推定するデータセットを公開した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "MODISの退役に備え、VIIRSの活動火災観測からGFED5と整合する燃焼面積と排出量を日次でほぼリアルタイムに推定するGFED5NRTを公開した。", "p3": "VIIRS観測と標準GFED5データから導いたバイオーム・地域別の有効火災面積と燃料消費のルックアップテーブルを使い、VIIRSの活動火災カウントから燃焼面積と排出量をGFED5の時系列と整合する形で推定する（抄録）。", "p5": "GFED5と独立データセットとの比較で、火災活動の空間パターン・季節サイクル・年々変動が強く一致した。最近の大規模火災の極端事象を捉え、複数の微量気体とエアロゾルの排出量を日次で全球に提供する。データはZenodoで公開（抄録）。", "fun": "世界の森林火災がどれだけ二酸化炭素を出しているかを数える基盤データは、20年以上働いた衛星センサに頼ってきた。その衛星が引退する前に、別の衛星の観測で同じ尺度の数字を毎日出せる仕組みを作った。長い記録を途切れさせずに、しかも「今日の火災」も数えられるようにした。", "unverified": "独立データセットとの一致度の数値は抄録にない。"}}, {"id": "jn24", "rank": 24, "field": "環境・気候政策", "headline": "ブラジル農業前線で保全政策の効果は執行が左右", "title": "Enforcement drives conservation policy impacts at the Brazilian agricultural frontier", "url": "https://doi.org/10.1016/j.gloenvcha.2026.103239", "authors": "Javier Miranda ほか", "venue": "Global Environmental Change", "date": "2026-10-14", "citescore": 19.2, "citescore_year": "2025", "why": "ブラジルの農業前線での保全政策の効果が執行の強さに依存することを示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ブラジルのアマゾン–セラード境界での政策の不連続を利用し、命令統制型の森林規制に重ねた補完的な保全政策が森林減少を抑える効果は、環境法の執行の強さに依存することを示した。", "p3": "バイオームに基づく政策割当ルールが公式のアマゾン–セラード境界に沿って生む政策の不連続を利用し、森林減少と牧草地から耕地への転換（土地利用集約化）への効果を推定する（抄録）。", "p5": "アマゾン特有のガバナンス革新は森林減少の削減と結びつくが、土地利用集約化への効果は弱く体系的でない。効果は環境当局が現場で森林法をどれだけ執行するかで変わり、補完的手段は「犯罪のすぐ後に罰が続く」ときに最もよく機能した（抄録）。", "fun": "同じ国の同じ農業地帯でも、地図上の線の向こうとこちらで適用される政策が違う。その「線」を利用して政策の効果を測った。結論は単純で、どんなに立派な保全プログラムを重ねても、違反をすぐ罰する役所が機能していなければ効かない。法律の文面より、現場の執行が決め手だった。", "unverified": "森林減少の削減幅の数値は抄録にない。"}}, {"id": "jn25", "rank": 25, "field": "環境・気候政策", "headline": "中国の純炭素排出勘定1980–2020と要因・緩和策", "title": "Net carbon emission accounts, drivers, and mitigation measures in China, 1980–2020", "url": "https://doi.org/10.1016/j.gloenvcha.2026.103244", "authors": "Dongzhe Liang ほか", "venue": "Global Environmental Change", "date": "2026-10-15", "citescore": 19.2, "citescore_year": "2025", "why": "中国の40年にわたる純炭素排出を勘定し、その駆動要因と緩和策を整理する。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "中国の1980〜2020年の純炭素排出を勘定し、その駆動要因と緩和策を整理した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「排出量」だけでなく森林などが吸収する分を差し引いた「純排出」を、40年分さかのぼって数える。中国は世界最大の排出国であると同時に大規模な植林国でもあり、差し引きの推移がどう動いたかは地球全体の帳簿に直結する（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn26", "rank": 26, "field": "環境・気候政策", "headline": "制度体制の実現可能性でグリーン成長と脱成長を評価", "title": "Assessing green-growth and degrowth pathways through institutional regime feasibility", "url": "https://doi.org/10.1038/s41893-026-01951-3", "authors": "Ingo Pies ほか", "venue": "Nature Sustainability", "date": "2026-10-14", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "why": "グリーン成長と脱成長の経路を、制度体制の実現可能性という観点から比較評価する。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "グリーン成長と脱成長という2つの経路を、制度体制の実現可能性という観点から評価した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "気候対策には「技術で経済成長と環境を両立させる」派と「そもそも成長をやめる」派がある。どちらが正しいかの論争は多いが、「今の政治や経済の制度で実際にやれるのか」という視点で比べるのは珍しい。理想の経路でも制度が受け付けなければ絵に描いた餅になる（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn27", "rank": 27, "field": "社会学", "headline": "親の子どもへの投資の所得格差が45年で拡大", "title": "Even More Unequal Childhoods: 45 Years of Widening Income Gaps in Parental Investments in the United States", "url": "https://doi.org/10.15195/v13.a45", "authors": "Orestes Hastings", "venue": "Sociological Science", "date": "2026-10-13", "sjr": 1.434, "citescore": 3.1, "citescore_year": "2025", "why": "米国で45年にわたり親の子どもへの投資の所得階層間格差が広がり続けたことを示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、題名検索で見つかったSocArXiv版の抄録を使用", "preprint": false, "short": true, "p1": "米国の1980〜2024年の消費者支出調査で、保育・教育・課外活動への親の支出の所得階層間格差が45年間広がり続け、上位10%と下位25%の子ども一人当たり支出の比が約3倍から13倍超になったことを示した。", "p3": "1980〜2024年のConsumer Expenditure Surveyから、保育・教育・課外活動への親の金銭的投資の所得階層別の推移を、支出額、家計総予算に占める割合、支出の有無と額の寄与に分けて記述する（抄録）。", "p5": "上位10%の子ども一人当たり支出は実質で約4倍になり、下位25%は2024年のほうが1980年よりわずかに低い。格差の拡大は3カテゴリすべてと家計予算の配分にも現れ、「支出するか」より「いくら支出するか」の差で主に生じた（抄録）。", "fun": "裕福な家庭は子どもの習い事や教育に、45年前の4倍（物価調整後）を使うようになった。一方で貧しい家庭の支出はむしろ少し減っている。かつては3倍だった差が今は13倍以上。学校で何が起きるかの前に、家庭の財布の段階で子ども時代の不平等が大きく開いている。", "unverified": "学術誌版の抄録は未確認で、SocArXiv版を使用。"}}, {"id": "jn28", "rank": 28, "field": "社会学", "headline": "米国公共圏の政治化を1980–2024年で追跡", "title": "Tracing Politicization in the U.S. Public Sphere, 1980–2024", "url": "https://doi.org/10.15195/v13.a46", "authors": "Terrence Chen", "venue": "Sociological Science", "date": "2026-10-13", "sjr": 1.434, "citescore": 3.1, "citescore_year": "2025", "why": "米国の公共圏における政治化の進行を40年以上にわたり追跡する。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "米国の公共圏における政治化の進行を1980〜2024年にわたって追跡した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "スポーツも食べ物も映画も、あらゆる話題が「政治的に」語られるようになったと感じる人は多い。題名は、その感覚を40年以上のデータで検証しようとしている。何が、いつから、どれだけ政治の話になったのかを測れれば、分断の歴史を言葉で追えるようになる（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn29", "rank": 29, "field": "社会学", "headline": "職場の心理社会的危害を不平等体制として読む", "title": "Psychosocial Harm as an Inequality Regime at Work: Intersectional Accounts From Portugal", "url": "https://doi.org/10.1111/gwao.70279", "authors": "Iara Teixeira ほか", "venue": "Gender, Work and Organization", "date": "2026-10-14", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "why": "ポルトガルの労働者60人の面接から、過重労働や不安定雇用による心理社会的危害が、ジェンダー・人種・移民に関わる権力関係を通じて不均等に生産されることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ポルトガルの労働者60人への深層面接から、過重労働・不安定雇用・仕事–家庭葛藤・不十分なリーダーシップ・弱い通報制度による心理社会的危害が、ジェンダー・異性愛規範・人種・移民に関わる権力関係を通じて不均等に生産されることを示した。", "p3": "Ackerの不平等体制の概念にマイノリティ・ストレスと交差性を組み合わせ、再帰的テーマ分析で「負荷・不安定さ・リーダーシップによる危害の組織化」「承認・正当性・差異のコスト」「救済・非公式ネットワーク・複合的排除による条件付きの帰属」の3テーマを導く（抄録）。", "p5": "単一カテゴリで組織された多様性施策は、複数の次元で周縁化された労働者に構造的な空白を残した。危害は労働過程の強化、不平等な正当性、条件付きの帰属、対処の個人化を通じて生産され、多様性やwell-beingの施策は負荷の規制・責任ある管理・信頼できる救済機構がなければ保護の効果が限られた（抄録）。", "fun": "職場のストレスを「個人のメンタルの問題」ではなく「不平等の仕組み」として読む。同じ過重労働でも、女性で移民で性的少数者である人には、負担も、訴えたときに信じてもらえる度合いも、助け合いの網も違って配られている。会社の「多様性推進」が一つの属性ずつしか見ないと、重なった人がこぼれ落ちる。", "unverified": "面接対象者の属性の内訳は抄録にない。"}}, {"id": "jn30", "rank": 30, "field": "社会学", "headline": "学校の欠席を数えるデジタル閾値と分類", "title": "Counting absence, accounting care: Digital thresholds and the classification of absence in schools", "url": "https://doi.org/10.1177/20539517261498676", "authors": "Svea Kiesewetter ほか", "venue": "Big Data and Society", "date": "2026-10-14", "sjr": 2.026, "citescore": 9.7, "citescore_year": "2025", "why": "デジタルプラットフォームが学校の欠席をどう分類・閾値化するかを検討し、福祉国家の公共部門でのアルゴリズム的分類の作用を論じる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "スウェーデンの義務教育のエスノグラフィから、出席データによる「持続的欠席者」という分類が、プラットフォームの価値と制度の論理に構造化された社会技術的カテゴリとして生産され、ケアと統制の両方として機能することを示した。", "p3": "福祉国家の公共部門でデータ駆動の分類がどう作られるかを、Fourcadeの分類的判断の議論に基づき、日常のデータ実践の民族誌的観察から分析する（抄録）。", "p5": "ケアは統制として機能し、統制はケアの形で行使されうる。誰のニーズが可視化され、誰が脆弱にされ、誰が取り残されるかを問い、カテゴリがどう行為可能にされるかが正義・包摂・福祉の意味に帰結すると論じる（抄録）。", "fun": "学校の「欠席日数」は単なる数字に見えるが、ある閾値を超えると「要注意の子」というラベルになり、支援（ケア）と監視（統制）が同時に始まる。その閾値は誰がどう決めたのか。数字で判断しているつもりが、数字の作り方の中に価値判断が埋め込まれている、という指摘だ。", "unverified": "観察した学校数と期間は抄録にない。"}}, {"id": "jn31", "rank": 31, "field": "社会学", "headline": "都市革命のネットワーク構造", "title": "The network structure of the urban revolution", "url": "https://doi.org/10.1126/sciadv.aee5162", "authors": "Giacomo Benati ほか", "venue": "Science Advances", "date": "2026-10-14", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "初期都市が前例のない規模の長距離相互作用ネットワークをどう維持したかを、ネットワーク分析で明らかにする。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "メソポタミアのウルク拡大期（紀元前3900〜3000年頃）の最大の空間データセットから3段階の輸送ネットワークを復元し、河川沿いの樹状構造が地域クラスタを経て、選択的な長距離ショートカットで結ばれたスモールワールド的構造へ変化したことを示した。", "p3": "3つの連続する時期について輸送ネットワークを再構成し、ネットワーク分析で構造の変化を追う（抄録）。", "p5": "初期の樹状で河川ベースの系はモジュール的な地域クラスタに進化し、最終的に選択的な長距離ショートカットで結ばれたより統合的な構造になった。この変化は主要な仲介者への依存を減らし、強い局所的結束と効率的な全系的到達を兼ねるスモールワールド的パターンを生んだ。移動する仲介者共同体に支えられた分散的な相互作用過程が初期都市の接続性を支えた（抄録）。", "fun": "5000年以上前、国家も市場もない時代に、最初の都市群はどうやって遠くの街とつながり続けたのか。遺跡の分布から道の網を復元すると、川沿いの一本道から、地域のまとまりへ、そして遠くへの「近道」を持つ網へと進化していた。今のSNSの友人関係にも現れる「スモールワールド」の形が、最古の都市にもあった。", "unverified": "データセットの遺跡数は抄録にない。"}}, {"id": "jn32", "rank": 32, "field": "経済学", "headline": "非居住者への課税が地方政府の説明責任を薄める", "title": "When Geography Dilutes Accountability: Managerial Discretion and Fiscal Expansion in Local Government", "url": "https://doi.org/10.1177/02750740261498897", "authors": "Edmund Poku Adu ほか", "venue": "American Review of Public Administration", "date": "2026-10-15", "sjr": 1.221, "citescore": 4.7, "citescore_year": "2025", "why": "テキサスの20年の自治体データと一般化合成コントロールで、費用を非投票者に転嫁できる都市ほど地方売上税導入後に住民の財政負担を増やすことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "テキサス州の自治体の2000〜2019年のデータで、費用を非居住者（通過車両・通勤者・買い物客）に転嫁できる都市ほど、地方売上税の導入後に住民の財政負担をかえって増やすという、説明責任の空白を示した。", "p3": "二元固定効果と一般化合成コントロールで、専用の地方売上税を採用した都市の住民の財政的露出の変化を、非投票者へ費用を転嫁できる立地条件で比較する（抄録）。", "p5": "大都市圏や幹線道路に近い都市で効果が最も強く、住民がほぼ全費用を負う孤立した都市では変化が小さかった。古典的な税の輸出理論が予測する住民の負担軽減とは逆で、裁量的な財政拡大を賄う説明責任の空白が生じるが、6〜13年で財政結果は収斂した（抄録）。", "fun": "町を通り過ぎる旅行者や隣町から来る買い物客は、その町の売上税を払うが選挙では投票できない。すると町の役所は「文句を言えない人」から集めた金で支出を増やし、結局住民の負担も増えていた。「よそ者に払わせれば住民は楽になる」という古い理論の逆だ。地理が民主主義の効き目を変える。", "unverified": "対象都市数と効果の大きさは抄録にない。"}}, {"id": "jn33", "rank": 33, "field": "因果推論", "headline": "AI政策が工業用地の集約利用を高める準自然実験", "title": "Artificial intelligence policy, digital industry agglomeration, and industrial land intensive use: evidence from a quasi-natural experiment in China", "url": "https://doi.org/10.3389/fsufs.2026.1858439", "authors": "Ning Wang ほか", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-10-15", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "why": "中国のAI政策を準自然実験として、デジタル産業集積を通じて工業用地の集約利用が高まる経路を推定する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の国家次世代AI革新発展試験区を準自然実験として、AI政策がデジタル産業の集積を介して工業用地の集約利用を高め、公共データ開放政策と組み合わせると効果が増幅することを示した。", "p3": "2010〜2023年の271の地級市以上の都市のパネルに、重なり合う差の差モデルを適用し、影響・伝達機構・政策の相乗効果を評価する（抄録）。", "p5": "AI政策は試験区の工業用地の集約利用を有意に高め、頑健性検定に耐えた。デジタル産業の集積が部分媒介し、「AI政策→デジタル産業集積→工業用地集約」の経路が示された。AI政策と公共データ開放政策の併用は、単独より集約と集積の両方に大きな効果を持ち、「1+1>2」の増幅が見られた（抄録）。", "fun": "AIを推進する政策が「土地の使い方」を変えるという、一見遠い因果をたどっている。AI企業が集まる街ではデジタル産業が密集し、工場用地が無駄なく使われるようになる。さらに政府がデータを公開する政策を重ねると効果が足し算以上になる、という組み合わせの発見が政策担当者向けだ。", "unverified": "効果の大きさの数値は抄録にない。"}}, {"id": "jn34", "rank": 34, "field": "因果推論", "headline": "デジタル・実体統合は都市スプロールを抑えるか：DML", "title": "Can digital-real integration effectively curb urban sprawl? Evidence from China using double/debiased machine learning", "url": "https://doi.org/10.1016/j.landusepol.2026.108376", "authors": "Chunjie Hu ほか", "venue": "Land Use Policy", "date": "2026-10-15", "sjr": 1.686, "citescore": 14.0, "citescore_year": "2025", "why": "二重/脱バイアス機械学習を用いて、中国でデジタルと実体経済の統合が都市スプロールを抑制するかを推定する。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "中国で、デジタル経済と実体経済の統合が都市スプロールを抑制するかを、二重/脱バイアス機械学習（DML）で推定した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "街が郊外へだらだら広がる「スプロール」は、通勤を長くし環境負荷を増やす。デジタル技術が工場や物流と結びつくと、土地を効率よく使えて広がりが止まるのか。因果を推定するのに機械学習で交絡を柔軟に調整する新しめの手法を使っているところが、都市研究と統計手法の接点になる（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn35", "rank": 35, "field": "因果推論", "headline": "トラッキングと仲間構成の効果を構造モデルで分離", "title": "Disentangling the effects of tracking and peer-group composition on academic and motivational development: A structural modeling approach.", "url": "https://doi.org/10.1037/edu0001079", "authors": "Jürgen Baumert ほか", "venue": "Journal of Educational Psychology", "date": "2026-10-15", "sjr": 2.643, "citescore": 13.6, "citescore_year": "2025", "why": "習熟度別編成と仲間集団構成が学業・動機づけに与える効果を構造モデルで切り分ける。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "習熟度別のクラス編成（トラッキング）の効果と、仲間集団の構成の効果を、学業と動機づけの発達について構造モデルで切り分けた論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "成績でクラスを分けると、「上のクラスに入ったこと」自体の効果と「周りに優秀な子が多いこと」の効果が混ざってしまう。前者は制度の効果、後者は仲間の効果で、政策的な意味がまったく違う。この2つを統計モデルで分離しようという試みで、長年の教育論争の核心に触れる（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn36", "rank": 36, "field": "組織行動・心理的安全性", "headline": "搾取的リーダーシップが静かな退職を誘発（年齢差）", "title": "EXPRESS: How Exploitative Leadership Triggers Quiet Quitting and Subsequent Withdrawal Behaviors in the Hotel Industry: A Multi-Group Analysis by Age", "url": "https://doi.org/10.1177/10963480261499368", "authors": "Hoyeol Jeong ほか", "venue": "Journal of Hospitality and Tourism Research", "date": "2026-10-15", "sjr": 1.953, "citescore": 14.3, "citescore_year": "2025", "why": "ホテル業界で搾取的リーダーシップが静かな退職とその後の離脱行動を引き起こす経路を、年齢群別の多群分析で示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ホテル従業員400人で、搾取的リーダーシップが組織的シニシズムを介して「静かな退職」を促し、さらに沈黙行動と反生産的行動に至る経路を示し、年齢群で影響の強さが異なることを明らかにした。", "p3": "構造方程式モデルと多群分析で、搾取的リーダーシップ→組織的シニシズム→静かな退職→沈黙・反生産的行動の経路を検証し、年齢群で比較する（抄録）。", "p5": "40歳以上の従業員は搾取的リーダーシップと組織的シニシズムの影響をより強く受け、20〜30代は離脱と沈黙行動の結びつきが強かった（抄録）。", "fun": "上司が部下を自分の利益のために使う「搾取的リーダーシップ」の下では、従業員はまず会社に冷めて（シニシズム）、言われたこと以上はやらない「静かな退職」に入り、やがて意見を言わなくなったり手を抜いたりする。面白いのは年齢差で、ベテランほど上司に傷つき、若手ほど冷めたら黙る。", "unverified": "各経路の係数は抄録にない。"}}, {"id": "jn37", "rank": 37, "field": "組織行動・心理的安全性", "headline": "他者優先：向社会性と業績のモデルを検証", "title": "Putting others first: testing a model of prosociality and performance", "url": "https://doi.org/10.1007/s10869-026-10160-w", "authors": "Anna Viragos ほか", "venue": "Journal of Business and Psychology", "date": "2026-10-15", "sjr": 2.563, "citescore": 10.6, "citescore_year": "2025", "why": "自己主導の職務再設計と役割内の向社会行動を統合した向社会的クラフティングの概念を提案し、業績との関係を検証する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "他者の利益のために自分の仕事の境界を作り替える「向社会的ジョブ・クラフティング（PSJC）」の概念と尺度を開発し、課題PSJCだけが業績を予測することを示した。", "p3": "研究1で米国の従業員500人のデータから課題・関係・認知の3次元のPSJC尺度を開発・検証し、研究2でハンガリーの大学図書館職員262人と直属上司8人の業績評価を結合してモデルを検証する。知覚された向社会的影響、向社会的動機、向社会的行動の3次元に結びつける（抄録）。", "p5": "知覚された向社会的影響は3形態すべてのPSJCを予測したが、業績を正に予測したのは課題PSJCのみだった。PSJCは一様な現象ではなく次元ごとに行動的含意が異なり、ジョブ・クラフティングが自己のためだけではないことを示した（抄録）。", "fun": "自分の仕事を自分なりに作り替える「ジョブ・クラフティング」は、ふつう「自分が楽しく働くため」と考えられてきた。この研究は「人の役に立つため」に仕事を作り替える人がいることを尺度で捉えた。ただし評価につながるのは「作業内容」を変えた場合だけで、人間関係や考え方を変えても上司の評価には出なかった。", "unverified": "尺度の項目数と信頼性係数は抄録にない。"}}, {"id": "jn38", "rank": 38, "field": "組織行動・心理的安全性", "headline": "部下の感情労働が上司のエンパワーメント行動を変える", "title": "Heart work for empowerment: how subordinate emotional labor influences leader empowering behavior", "url": "https://doi.org/10.1108/ijchm-10-2025-1458", "authors": "Xin Liu ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-10-15", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "why": "部下の深層演技と表層演技が上司のエンパワーメント行動に与える影響を、上司–部下交換関係を介して検証する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "部下が上司に向けて行う感情労働のうち、深層演技は上司のエンパワーメント行動を増やし表層演技は減らすこと、LMXが部分媒介し上司の感情知能が両効果を強めることを、実験と2波のフィールド調査で示した。", "p3": "研究1はホテル・レストランの管理者222人のシナリオ実験で因果関係を確立し、研究2はホテル・レストランの上司–部下229組の2波・多情報源調査で媒介と調整を検証する（抄録）。", "p5": "深層演技（期待される感情を本当に経験する）はエンパワーメント行動を増やし、表層演技（感情を装う）は減らした。上司–部下交換関係（LMX）が両関係を部分媒介し、上司の感情知能が両効果を強めた（抄録）。", "fun": "部下に権限を与えるかどうかは上司が決めると思われがちだが、部下の「感情の見せ方」が上司の判断を動かしていた。心から前向きな部下は任され、笑顔を作っているだけの部下は任されない。しかも感情を読むのが上手な上司ほどその差を大きくつける。権限委譲は上司と部下の相互作用で決まる。", "unverified": "効果量と調査間隔は抄録にない。"}}, {"id": "jn39", "rank": 39, "field": "組織行動・心理的安全性", "headline": "従業員のESG認識と革新的職務行動", "title": "How Employee Perceptions of Environmental, Social, and Governance Practices Relate to Innovative Work Behaviour", "url": "https://doi.org/10.1002/csr.71027", "authors": "Ming Xumin Zhang", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-15", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "企業のESG実践に対する従業員の認識が革新的職務行動にどう結びつくかを実証する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の新エネルギー車産業の従業員509人の3波調査で、従業員が知覚するESG実践が革新的職務行動と正に関連し、創造的自己効力感と心理的安全性が間接経路となる一方、ジョブ・クラフティングは経路にならないことを示した。", "p3": "刺激–有機体–反応枠組みと仕事の要求度–資源理論に基づき、3波の時間差調査にPLS-SEMを適用して、創造的自己効力感・心理的安全性・ジョブ・クラフティングの3つの内面化機構を検証する（抄録）。", "p5": "知覚されたESG実践は革新的職務行動と正に関連し、創造的自己効力感と心理的安全性は有意な間接経路だったがジョブ・クラフティングは有意でなかった。ESG認識は認知的・社会感情的な異なる経路で従業員の革新に結びつく（抄録）。", "fun": "会社が環境や社会に配慮していると感じる社員は、新しい提案をしやすくなる。その理由は「自分は創造的だと思える」ことと「失敗しても大丈夫だと感じる」ことで、「自分で仕事を工夫する」ことは理由にならなかった。会社の姿勢が社員の自信と安心を通じて行動に変わる、という経路の絞り込みだ。", "unverified": "調査の間隔と効果量は抄録にない。"}}, {"id": "jn40", "rank": 40, "field": "経営学", "headline": "CEOと取締役会議長のナルシシズムとESG業績", "title": "The Dual Narcissists: Disentangling the Distinct Impacts of CEO and Board Chair Narcissism on Corporate ESG Performance", "url": "https://doi.org/10.1002/csr.71073", "authors": "Ali E. Akgün ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-15", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "CEOだけでなく取締役会議長のナルシシズムを区別し、両者がESG業績に与える異なる影響を示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "上場企業255社の2018〜2023年について、統合報告の語りから測ったCEOと取締役会議長のナルシシズムがESGの3つの柱に異なる向きで関連することを示した。", "p3": "統合報告書の語りから役員のナルシシズム状態を測り、Refinitiv EikonのESGスコアと結びつけて、CEOと取締役会議長それぞれの効果を環境・社会・ガバナンスの柱ごとに推定する（抄録）。", "p5": "取締役会議長のナルシシズムは環境・社会の業績と正、ガバナンスと負に関連し、CEOのナルシシズムは環境・ガバナンスと正、社会と負に関連した。ナルシシズム的リーダーシップの効果は役員の役割とステークホルダー領域で異なる（抄録）。", "fun": "自己愛の強いトップは企業の環境・社会への取り組みを良くするのか悪くするのか。答えは「誰が」「どの分野で」による。議長の自己愛は環境と社会には良いが統治には悪く、CEOの自己愛は環境と統治には良いが社会には悪かった。性格の良し悪しが一律でないことを、報告書の言葉遣いから読み取っている。", "unverified": "ナルシシズム指標の構成と企業の国・業種は抄録にない。"}}, {"id": "jn41", "rank": 41, "field": "経営学", "headline": "戦略に関与する中間管理職とグリーン成果", "title": "The Impact of Strategically Involved Middle Managers on Green Outcomes", "url": "https://doi.org/10.1002/bse.71677", "authors": "Thu Anh Le Dang ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-15", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "戦略形成に関与する中間管理職が組織のグリーン成果に与える影響を実証する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "戦略に関与する中間管理職（MMIS）がグリーンイノベーションに直接効き、環境パフォーマンスには緑の動的能力を介して効くことを、中間管理職107人の調査で示した。", "p3": "オンラインの横断調査で有効回答107件を集め、階層的線形回帰とブートストラップでモデルを検定する。規制面のステークホルダー圧力を調整変数とする（抄録）。", "p5": "MMISはグリーンイノベーションに有意に影響し、環境パフォーマンスへは緑の動的能力が媒介した。規制圧力はMMISとグリーンイノベーションの関係を調整したが、環境パフォーマンスとの関係は調整しなかった。中間管理職は短期的な成果には直接効くが、長期的な成果には組織能力の育成が要る（抄録）。", "fun": "企業の環境対策というと経営トップの決断が語られるが、現場と経営をつなぐ中間管理職が戦略に関わると、新しい環境技術の導入が進んでいた。ただし「実際に環境がよくなる」までには組織の力を育てる段階が必要で、管理職の熱意だけでは届かない。「緑のチャンピオン」の限界も描いている。", "unverified": "回答者の業種と国は抄録にない。標本は107件と小さい。"}}, {"id": "jn42", "rank": 42, "field": "機械学習", "headline": "細粒度の欠陥特定に基づくレビューコメント生成", "title": "DefectReviewer: Towards Generating Defect-Focused Review Comment Based on Fine-Grained Defect Localization", "url": "https://doi.org/10.1145/3848515", "authors": "Yuan Huang ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-10-14", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "why": "コードレビューを汎用生成でなく欠陥検出課題として扱い、細粒度の欠陥位置特定に基づいてレビューコメントを生成する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "コードレビューのコメント生成を「欠陥検出」に特化させ、欠陥行の細粒度の特定信号で生成を接地するDefectReviewerを提案し、BLEUとROUGE-Lで最先端を17.0%・24.2%上回った。", "p3": "課題特化の微調整を基盤に、Just-In-Timeの欠陥特定ツールで欠陥行を特定し、構造化プロンプトと微調整でコメント生成を接地する。汎用レビュアーを補完する選択的な部品として設計する（抄録）。", "p5": "大規模な実データで6つの代表的ベースラインを一貫して上回り、LLM審判と人間専門家の二重の意味評価で欠陥との関連性と読みやすさが高いと確認された。異なる生成アーキテクチャに適用でき、入力する欠陥行数に対する性能変化は緩やかだがアーキテクチャで傾向が異なる（抄録）。", "fun": "AIにプログラムのレビューをさせると、「変数名を直そう」のような当たり障りのない指摘ばかりになりがちだ。この研究は「どこが怪しいか」を先に別のツールで突き止めてからAIに渡す。場所が分かれば「何が悪いか」を考える範囲が狭まる、という人間のレビュアーと同じ手順だ。", "unverified": "データセットの規模と6つのベースラインの名称は抄録にない。"}}, {"id": "jn43", "rank": 43, "field": "機械学習", "headline": "LLMで系統的レビューの文献スクリーニングを自動化", "title": "MechaScreener: Large language model-based automated screening for systematic reviews and research", "url": "https://doi.org/10.1017/rsm.2026.10124", "authors": "Connor Forbes ほか", "venue": "Research Synthesis Methods", "date": "2026-10-15", "sjr": 3.143, "citescore": 12.1, "citescore_year": "2025", "why": "数千件の題名・抄録スクリーニングというボトルネックをLLMで自動化するMechaScreenerを提案し、既存ツールとの比較を示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "訓練データなしでLLMが文献の関連度を1〜5で順位づけするMechaScreenerを開発し、Cochraneレビュー10件・58,000件超の参照で再現率1.00、特異度約0.61を達成した。", "p3": "ユーザが与えるPICOや採択・除外基準を直接適用して各参照に順序尺度の関連度を付ける。開発段階で5つの参照ライブラリでプロンプトを最適化し、独立評価段階でRCTと非RCTを含む10のCochraneレビューライブラリで評価する（抄録）。", "p5": "評価データで10レビューすべてで再現率1.00（統合レコードレベル95%CI 0.98〜1.00）、マクロ平均特異度0.61（クラスタブートストラップ95%CI 0.46〜0.75）。特異度は広い公衆衛生主題の0.21から精密な薬理介入の0.91まで変動した。再現率を損なわず無関係文献の6割超を初期段階で除ける（抄録）。", "fun": "系統的レビューでは、数千本の論文の題名と要旨を人が読んで選別する。AIに任せると「見落とし」が怖いが、このツールは10件の検証すべてで関連論文を1本も落とさず、無関係なものを6割減らした。迷ったら残す「臆病な」設計にしたから見落としが出ない、という割り切りが実務的だ。", "unverified": "使用したLLMの名称は抄録にない。"}}, {"id": "jn44", "rank": 44, "field": "機械学習", "headline": "LLMを用いた構造化目標誘導強化学習", "title": "Structured Goal-Guided Reinforcement Learning with Large Language Models", "url": "https://doi.org/10.1016/j.neunet.2026.109769", "authors": "Yajie Qi ほか", "venue": "Neural Networks", "date": "2026-10-15", "sjr": 1.545, "citescore": 10.9, "citescore_year": "2025", "why": "大規模言語モデルが生成する構造化目標で強化学習を誘導する手法を提案する。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録なし", "preprint": false, "short": true, "p1": "大規模言語モデルが生成する構造化された目標で強化学習を誘導する手法を提案した論文（題名より）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "強化学習は「報酬」だけを手がかりに試行錯誤するので、ゴールが遠いと迷子になる。言葉で「まずこれ、次にこれ」と段取りを示せれば近道になる。題名は、言語モデルにその段取りを構造化して書かせ、学習の道しるべにするという組み合わせを示している（題名から読み取れる範囲）。", "unverified": "抄録・本文を入手できず、手法と結果は未確認。"}}, {"id": "jn45", "rank": 45, "field": "機械学習", "headline": "圧力認識時空間グラフでスポーツの逐次意思決定を予測", "title": "Pressure-aware spatiotemporal graph networks: a dynamic edge weighting framework for sequential decision prediction in multi-agent sports systems", "url": "https://doi.org/10.1007/s44443-026-01021-w", "authors": "Haitao Zhan", "venue": "Journal of King Saud University - Computer and Information Sciences", "date": "2026-10-15", "sjr": 1.434, "citescore": 20.4, "citescore_year": "2025", "why": "敵対的多エージェント環境での逐次意思決定予測に、相手の圧力を動的エッジ重みで表す時空間グラフネットワークを提案する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "敵対的な多エージェント環境（サッカー）での逐次意思決定予測に、相手の圧力を動的なエッジ重みで表す時空間グラフネットワークPA-STGNを提案し、183万の意思決定系列で89.3%の予測精度を得た。", "p3": "空間的近接・速度の整合・数的優位から敵対的圧力を定量化してエッジ重みを変える動的グラフ構築、個人・集団・全体の多スケール相互作用を捉える階層的時空間注意、潜在表現から解釈可能な戦略行動を見つける教師なしパターン発見の3つを組み合わせる（抄録）。", "p5": "StatsBomb 2015〜2023の1,941場面・183万系列で89.3%の精度を達成し、静的グラフを9.2%、最先端の時空間モデルを5.6%上回った。圧力認識モジュールの寄与は3.2%。教師なしクラスタリングで12の行動パターンをF1 84.7%で発見し成果指標と相関（r=0.76）、推論は1フレーム18msで、8領域へのゼロショット転移は81〜88%だった（抄録）。", "fun": "サッカー選手が次に何をするかを予測するとき、味方と相手を「点と線」で結んだ図で考えるのが流行りだが、線の太さはたいてい固定だった。この研究は、相手が迫ってくる「圧力」で線の太さを刻々と変える。プレッシャーが判断を変えるという当たり前を数式に入れただけで、予測の精度が上がった。", "unverified": "比較した最先端モデルの名称は抄録にない。"}}, {"id": "jn46", "rank": 46, "field": "環境・気候政策", "headline": "将来の世界的豪雨洪水リスクの時空間非対称性", "title": "Significant Spatiotemporal Asymmetry in Future Global Rainstorm Flood Risk", "url": "https://doi.org/10.1029/2025ef007148", "authors": "Lixiang Zhao ほか", "venue": "Earth's Future", "date": "2026-10-15", "sjr": 3.116, "citescore": 13.2, "citescore_year": "2025", "why": "降水指標でなく流出深を用いて将来の世界の豪雨洪水リスクを評価し、顕著な時空間的非対称性を示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "降水指標だけでなく流出深を含む14の指標で1991〜2100年の世界の豪雨洪水リスクを4つのSSPシナリオで評価し、流出深を省くと高リスク域を系統的に過大評価すること、2100年には世界人口の半数が最高リスクに直面しうることを示した。", "p3": "ハザード・曝露・脆弱性の相互作用を含む14の多次元サブ指標を統合し、SSP1-2.6、2-4.5、3-7.0、5-8.5のもとで比較実験を行う（抄録）。", "p5": "世界のリスクは持続的に増え、SSP5-8.5で2100年の上昇が最大。高リスク域は南北アメリカ、アフリカ、南アジア、東アジア、東南アジアに集中し、曝露がリスクを支配する。2100年までに世界人口の半数（SSP3-7.0で最大60億人）と世界GDPの半数（SSP5-8.5）が最高リスク水準に直面し、その半分を南・東アジアが占める（抄録）。", "fun": "洪水の危険を「どれだけ雨が降るか」で測ると、地面に吸い込まれる分を無視して危険を大きく見積もりすぎる。実際に地表を流れる水の量で測り直すと地図が変わった。それでも結論は重く、今世紀末には世界の半分の人が最高レベルの洪水リスクの中で暮らすと予測し、特に人口の密な南・東アジアが中心になる。", "unverified": "14指標の内訳と「最高リスク水準」の定義は抄録にない。"}}, {"id": "jn47", "rank": 47, "field": "環境・気候政策", "headline": "批判的思考の限界：気候懐疑論と信頼を支える理解", "title": "The limits of critical thinking: climate skepticism, epistemic trespassing, and the understanding that grounds trust", "url": "https://doi.org/10.1007/s13194-026-00796-z", "authors": "Tadej Todorović ほか", "venue": "European Journal for Philosophy of Science", "date": "2026-10-15", "sjr": 1.074, "citescore": 3.2, "citescore_year": "2025", "why": "公衆が気候変動について何を理解すべきかを問い、専門領域の越境と信頼の基盤となる理解を哲学的に論じる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "気候変動について公衆が理解すべきなのは気候科学の一次的証拠ではなく、科学的合意がどう形成されなぜ信頼できるかという科学の社会認識論だと論じ、主流の批判的思考や論理ベースの予防接種戦略が「認識的越境」を招くことを示した。", "p3": "洗練され資格を持つ論者による気候変動への反論に、論理ベースの予防接種手続きを適用し、非専門家に一次的前提と科学的主張の評価を促すと認識的越境が起きることを示す。高次の批判的評価の過程、それが与える理解、それが正当化する較正された敬意を区別する（抄録）。", "p5": "公衆に必要なのは一次的能力ではなく、合意形成の過程がなぜ代替案より信頼できるかという、より控えめで到達可能な理解であり、それが盲目的依存を合理的に保証された信頼に変える。批判的思考を放棄するのではなく向け直す枠組みを提示する（抄録）。", "fun": "「自分の頭で考えろ、証拠を自分で確かめろ」は正しそうに聞こえるが、気候科学の一次データを素人が評価しようとすると、かえって巧妙な反論に騙される。本当に必要なのは「科学者たちがどうやって合意に達し、なぜそれが信頼に値するか」を理解することだ、という主張は、批判的思考の教え方への挑戦だ。", "unverified": "例として用いた反論の出典は抄録にない。"}}, {"id": "jn48", "rank": 48, "field": "社会学", "headline": "留学・海外就労・残留の選択と社会経済的地位", "title": "Choosing to Study Abroad, Work Abroad, or Stay Home: Do Socioeconomic Status, International Posture, and Language Proficiency Make a Difference?", "url": "https://doi.org/10.1111/modl.70093", "authors": "Yunjung (Yunie) Ku ほか", "venue": "Modern Language Journal", "date": "2026-10-15", "sjr": 2.095, "citescore": 8.4, "citescore_year": "2025", "why": "社会経済的地位・国際志向・言語能力が、留学・海外就労・残留の選択にどう影響するかを検証する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "韓国の学習者207人（留学者・ワーキングホリデー参加者・国内学習者）で、知覚された社会経済的地位、初期の言語能力、国際志向が学習文脈の選択を集合的に予測することを混合法で示した。", "p3": "Douglas Fir Groupの3水準枠組みを用い、調査・誘発模倣課題・面接でデータを集め、多項ロジスティック回帰とテーマ分析で分析する（抄録）。", "p5": "知覚された社会経済的地位、初期能力、国際志向がミクロ・メゾ・マクロの各水準で学習者の選択を予測し、個人差変数がメゾ水準の構造やマクロ水準の社会文化的イデオロギーと相互作用して意思決定と学習軌道を形づくることを示した（抄録）。", "fun": "留学するか、海外で働きながら学ぶか、国内に留まるか。本人の英語力や「世界とつながりたい」という気持ちだけでなく、「自分の家は裕福だと思うか」が選択を分けていた。韓国の「英語格差」と呼ばれる現象が、個人の選択の段階からすでに始まっていることを示している。", "unverified": "3群の人数の内訳は抄録にない。"}}, {"id": "jn49", "rank": 49, "field": "社会学", "headline": "SESと達成動機のPISA 20年IPDメタ分析", "title": "The association between socioeconomic status and students’ achievement motivation in secondary school: An individual participant data meta-analysis spanning two decades of PISA data.", "url": "https://doi.org/10.1037/edu0001083", "authors": "Sara     "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
