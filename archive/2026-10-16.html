<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

, 15 Oct 2026", "apa": "Liu, X., Nayyeri, H., Yilmaz, E., Hakkani-Tur, D., Peris, C., & Thadakamalla, H. (2026). PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19314", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMを評価者として使うとき、ユーザ履歴（ペルソナ情報）の「適切な使い方」を見分けられるかを測るベンチマークPersEvalBenchを作り、評価者の弱点を示した。", "p3": "ユーザ情報が持続・転移・失効すべき403の複数エピソード場面を用意し、過少パーソナライズ・過剰パーソナライズ・状態の誤適用の3系統9種の誤りを制御して埋め込む。人間の監査で誤りの型と情報の使い方の妥当性を確認した（抄録）。", "p5": "5つのLLM評価者は全対話履歴を与えても誤りの認識が限られ、人間評価の部分集合では過少パーソナライズを人間が94.4%認識するのに対し最良の評価者は63.9%だった。評価者は問題には気づいても誤りの向きを逆に取り違えやすく、関連する履歴を強調しても改善はわずかだった（抄録）。", "fun": "「あなたの好みを覚えている」アシスタントが、覚えすぎても忘れすぎても困る。面白いのは、AIの審判が「何かおかしい」とは分かるのに、「忘れすぎ」を「覚えすぎ」と逆に判定しがちな点だ。情報がどこにあるかを教えても直らないので、難しいのは情報を見つけることではなく「その情報をどう使うべきか」の判断だと分かる。", "unverified": "評価に使ったLLM評価者の名前と、人間評価の部分集合の規模は抄録にない。"}}, {"id": "pr18", "rank": 18, "headline": "公共データ開放がリスク志向監査を促進（中国）", "title": "Does the digital economy facilitate risk-oriented auditing? Evidence from China's Open Public Data Platform", "url": "https://doi.org/10.2139/ssrn.7615104", "authors": "Tai Wang ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Wang, T., & Gao, X. (2026). Does the digital economy facilitate risk-oriented auditing? Evidence from China’s Open Public Data Platform. https://doi.org/10.2139/ssrn.7615104", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の公共データ開放プラットフォーム（OPDP）の導入が、監査作業の複雑さを減らし監査人の判断を支えることで監査品質を高めたことを示した。", "p3": "OPDPの段階的な導入を準自然実験とみなし、Callaway and Sant'Anna (2021) の段階的差の差推定を主たる仕様として、裁量的発生高・監査意見・修正再表示を比較する（抄録）。", "p5": "OPDPのある都市の企業は裁量的発生高が低く、監査意見は攻撃的でなく、修正再表示も少ない。効果は財務の比較可能性が低い企業、国有企業への露出が高い企業、小規模監査事務所や訴訟リスクの高い場合に強い。監査効率や監査資源の配分も改善した（抄録）。", "fun": "政府が持っているデータを一般に公開すると、企業の帳簿のごまかしが減るという話だ。監査人は企業の説明を裏付けるために外部の情報を集めるが、それが安く手に入るほど「怪しい点」に集中できる。情報公開という一見関係のない政策が、会計の正直さに効いてくるところが面白い。", "unverified": "標本の企業数・期間と効果の大きさの数値は抄録にない。"}}, {"id": "pr19", "rank": 19, "headline": "加速償却政策下の防御的な減価償却見積り調整", "title": "Ability or incentive? Defensive depreciation-estimate adjustment under China’s accelerated depreciation policy", "url": "https://doi.org/10.6084/m9.figshare.34480635", "authors": "Jianliang Chen ほか", "venue": "Figshare", "date": "2026-10-14", "apa": "Chen, J., & Bian, A. (2026). Ability or incentive? Defensive depreciation-estimate adjustment under China’s accelerated depreciation policy. Taylor & Francis. https://doi.org/10.6084/M9.FIGSHARE.34480635", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Figshareに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の加速償却政策の恩恵を受けた企業が、会計上の減価償却率を「防御的」に引き下げること、そしてそれが報告圧力ではなく税効果を吸収できる能力によることを示した。", "p3": "2014〜2019年の3波の加速償却政策を準自然実験とし、2011〜2024年の41,879企業年に段階的差の差を適用する。中国の帳簿と税務の分離制度により、企業は税務と独立に会計上の償却を調整できる（抄録）。", "p5": "処置企業は実施後に帳簿上の償却率を有意に下げ、効果は2年目にピークとなり、税の恩恵を吸収できる企業に集中した。吸収余地の小さい企業はほとんど反応しなかった。規制当局は業績不振ではなく恩恵を受ける能力のある企業の償却見積り変更に注目すべきと示唆する（抄録）。", "fun": "税金を減らすために「機械を早く古くなったことにしてよい」という優遇を受けた企業が、株主向けの帳簿では逆に「機械は長持ちする」と見積もりを変えるという二重の顔を扱っている。しかもそれをやるのは、困っている会社ではなく余裕のある会社だった。帳簿と税務が別々に計算できる制度が、こうした行動を生む土台になっている。", "unverified": "償却率の引き下げ幅の数値は抄録にない。"}}, {"id": "pr20", "rank": 20, "headline": "JOBS法の規制緩和と監査資源の配分", "title": "Regulatory Relief and the Allocation of Audit Resources: Evidence from the JOBS Act", "url": "https://doi.org/10.2139/ssrn.7610641", "authors": "Thomas R. Kubick ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Kubick, T. R., Wilkins, M. S., & Wu, B. (2026). Regulatory Relief and the Allocation of Audit Resources: Evidence from the JOBS Act. https://doi.org/10.2139/ssrn.7610641", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "IPOの規制を緩めたJOBS法が、監査事務所の限られた人員を解放し、IPO以外の顧客の監査品質を改善したことを示した。", "p3": "新興成長企業（EGC）のIPOに対する報告要件を減らしたJOBS法の前後で、EGC相当のIPOに多く関わる監査事務所の非IPO顧客の監査品質を比較する（抄録）。", "p5": "法施行前は、EGC相当のIPOへの露出が大きい事務所ほど非IPO顧客の監査品質が低かった。施行後はそうした事務所の非IPO顧客で監査品質が相対的に改善し、効果はIPO企業が監査済み財務諸表の要件緩和を利用した場合と、事務所の処理能力が小さい場合に顕著だった（抄録）。", "fun": "ある仕事の規制を緩めると、まったく別の仕事の質が上がる、という玉突きの効果を捉えた研究だ。監査人は限られた人数で多くの会社を見ているので、IPOの手間が減ればその分を他の顧客に回せる。規制の効果を「その対象」だけで測ると、こうした波及を見逃してしまう。", "unverified": "監査品質の測り方と効果の数値は抄録にない。"}}, {"id": "pr21", "rank": 21, "headline": "デジタル人材を財務部門に置くと財務報告の質が上がる", "title": "Where Talent Sits: The Financial Reporting Quality of Embedding Digital Talent in Finance Functions", "url": "https://doi.org/10.2139/ssrn.7615694", "authors": "Zhou Li ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Li, Z., Tang, C., & Xu, X. (2026). Where Talent Sits: The Financial Reporting Quality of Embedding Digital Talent in Finance Functions. https://doi.org/10.2139/ssrn.7615694", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "デジタル人材を財務部門に配置した企業だけが、その後の発生高の質（財務報告の質）を高めることを示した。", "p3": "2016〜2023年の中国A株上場企業のオンライン求人データから、財務部門のデジタル人材、非財務部門のデジタル人材、従来型の財務人材の採用を区別し、後続の発生高の質との関係を調べる（抄録）。", "p5": "3つの採用区分を同時に考慮しても、財務部門のデジタル人材だけが有意に高い発生高の質と結びついた。効果は外部のデジタル基盤が強い企業や組織が複雑な企業に集中し、機構としてデジタル技術の採用と会計の比較可能性の向上が示唆された（抄録）。", "fun": "「デジタルに強い人を雇えば会計がよくなる」のではなく、「どの部署に置くか」で結果が変わるという発見だ。同じ能力でも、財務の現場に座ってはじめて帳簿の質に効いてくる。求人広告という身近なデータから企業の内側の配置を読み取っているのも面白い。", "unverified": "企業数と効果の大きさの数値は抄録にない。"}}, {"id": "pr22", "rank": 22, "headline": "オフバランスのデータ資産をブラック・ショールズで評価", "title": "Valuing Off-Balance-Sheet Data Assets: A Black-Scholes Approach with Evidence from East Money", "url": "https://doi.org/10.2139/ssrn.7610203", "authors": "Huannian Jin ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Jin, H., He, J., & Zhe, L. (2026). Valuing Off-Balance-Sheet Data Assets: A Black-Scholes Approach with Evidence from East Money. https://doi.org/10.2139/ssrn.7610203", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "帳簿に載っていないインターネット企業のデータ資産を、コールオプションとして評価する方法を提案し、中国のオンライン証券会社に適用した。", "p3": "データ資産は投資を続けてはじめて収益を生むので、開発支出の現在価値を行使価格とするコールオプションとみなす。原資産は業界平均を超えるデータ起因の超過収益の現在価値、ボラティリティは株式リターンの実現値、無リスク金利は5年国債利回り、行使価格は開示されたR&D支出から作り、自由パラメータなしでBlack-Scholesの5入力を定める（抄録）。", "p5": "East Money（300059.SZ）の2025年12月31日時点で点推定は54.1億元、感度分析の範囲は31〜79億元で、時価総額の約1.5%、加重平均純資産の6.3%に相当する。年次報告書での認識額はゼロである。コストアプローチの下限31〜44億元との差がデータに埋め込まれた成長オプションになる（抄録）。", "fun": "「会社が持っているデータはいくらか」という、会計がまだ答えを持たない問いに、金融のオプション理論で数字を出した。データは放っておくと価値を生まず、投資し続ければ利益を生む。これは「将来買う権利」と同じ構造だ、という発想の転換が鍵になっている。", "unverified": "感度分析のグリッドの範囲と超過収益の計算手順の詳細は抄録にない。"}}, {"id": "pr23", "rank": 23, "headline": "パテントボックスが秘匿から特許化への開示を促す", "title": "From Secrecy to Patenting: The Disclosure Effects of Patent Box Incentives", "url": "https://doi.org/10.2139/ssrn.7615182", "authors": "Ricky Xu Yao", "venue": "SSRN", "date": "2026-10-15", "apa": "Yao, R. X. (2026). From Secrecy to Patenting: The Disclosure Effects of Patent Box Incentives. https://doi.org/10.2139/ssrn.7615182", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "パテントボックス（特許収入への軽減税率）が、企業を営業秘密から特許へと切り替えさせ、知識の公開を促すことを示した。", "p3": "欧州各国でのパテントボックスの段階的導入を利用して特許出願の変化を調べ、ポルトガルの2014年導入をめぐる非公開の調査データで秘密保持と特許利用の入れ替わりを直接確認する（抄録）。", "p5": "導入直後に特許が大きく増え、未特許の発明が公開特許制度に持ち込まれたことと整合する。反応は従来の保護慣行や開示コスト、制度設計によって変わり、研究開発投入はほとんど同時には変わらなかった。導入後の生産性向上は拡大した特許ストックへの技術的露出が大きい企業ほど大きく、産業集中は低下した（抄録）。", "fun": "特許にかかる税金を安くすると、発明が増えるのではなく「隠していた発明を公開する」企業が増える、という話だ。特許は公開と引き換えに独占を認める仕組みなので、税の優遇が「秘密にしておくか、公開して守るか」の天秤を傾ける。公開された知識が他社の生産性まで上げるという波及が、普通の研究開発減税にはない効果として浮かぶ。", "unverified": "特許増加の大きさと対象国・期間の数値は抄録にない。"}}, {"id": "pr24", "rank": 24, "headline": "投信の開示圧力は企業の事業範囲決定を促す", "title": "The Bright Side of Short-Termism: Disclosure Pressure from Mutual Funds Promotes Strategic Scope Decisions by Portfolio Firms", "url": "https://doi.org/10.2139/ssrn.7611458", "authors": "Mingming Ao ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Ao, M., Pham, H., & Johnson, S. A. (2026). The Bright Side of Short-Termism: Disclosure Pressure from Mutual Funds Promotes Strategic Scope Decisions by Portfolio Firms. https://doi.org/10.2139/ssrn.7611458", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "投資信託の短期的な開示圧力が、投資先企業の近視眼的行動ではなく、事業範囲の戦略的な拡大と企業価値の向上を促したことを示した。", "p3": "投資信託の開示制度改革を外生的なショックとし、影響を受けた投信の保有比率が高い企業の事業範囲の強度（scope intensity）と業績・評価の変化を調べる（抄録）。", "p5": "保有比率の高い企業は事業範囲の強度を高め、販売効率・収益性・市場評価が上がった。事業範囲を広げた企業は投信に保有され続けやすく、そうした企業への露出を増やした投信は高い異常リターンを得た（抄録）。", "fun": "「短期志向の投資家は企業を近視眼的にする」という通説に対し、短期の圧力がかえって企業を戦略的に動かしたという反例を示している。投信が持ち株を頻繁に公開しなければならなくなると、企業は「選ばれ続ける」ために事業の組み合わせを見直す。圧力の中身によって、同じ短期主義でも結果が変わるところが面白い。", "unverified": "開示改革の内容と標本の規模・期間は抄録にない。"}}, {"id": "pr25", "rank": 25, "headline": "多言語の財務開示から数値証拠を抽出するベンチマーク", "title": "Recognition Is Not Grounding: Benchmarking Multilingual Financial Evidence Extraction", "url": "https://arxiv.org/abs/2610.19432", "authors": "Lingfei Qian ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Qian, L., Wang, Y., Peng, X., Giannouris, P., Zmandar, N., Han, Y., Liu, Y., & Gutiérrez-Basulto, V. (2026). Recognition Is Not Grounding: Benchmarking Multilingual Financial Evidence Extraction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19432", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多言語の財務報告書で、言語モデルが会計概念を「認識」できても、対応する数値事実を「漏れなく回収」できない（認識と接地のギャップ）ことを測るベンチマークMULTIFINGROUNDを作った。", "p3": "英語・フランス語・ギリシャ語の90発行体の2025年度開示を共通の会計タクソノミで揃え、事実レベルの追跡可能な注釈を付ける。財務事実の特定、概念認識、網羅的な事実選択、候補ラベルなしの概念弁別を評価する（抄録）。", "p5": "評価した15モデルのうち、8つのAPI・公開重みの参照モデルは概念認識で97.3〜99.4%の精度を出したが、正しく認識した群の26.6〜41.9%で少なくとも1つの対象事実を見落とした。概念弁別は大きくばらつき、金融特化モデルの利得は限られていた（抄録）。", "fun": "AIが「これは売上高の話だ」と当てるのはほぼ完璧なのに、「その売上高の数字を全部拾って」と頼むと3〜4割の場面で取りこぼす。分かることと集め切ることは別の能力で、テストを片方だけで作ると過大評価になる。言語が違う同じ会社の報告書を突き合わせる、という設定も現実的だ。", "unverified": "15モデルの内訳と、金融特化モデルの具体名は抄録にない。"}}, {"id": "pr26", "rank": 26, "headline": "LLMが設計する表データの合成戦略（プライバシー保護）", "title": "Creation begins with understanding: LLMs as strategy designers for privacy-preserving tabular data synthesis", "url": "https://doi.org/10.21203/rs.3.rs-10869884/v1", "authors": "Dandan Guo ほか", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Guo, D., Li, J., Zhang, Q., Ye, H., Zhao, H., Laakom, F., & Schmidhuber, J. (2026). Creation begins with understanding: LLMs as strategy designers for privacy-preserving tabular data synthesis. https://doi.org/10.21203/rs.3.rs-10869884/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMに合成データそのものではなく「合成手順（プログラム）」を設計させることで、プライバシーを守りながら表データを合成するTabSSDを提案した。", "p3": "生の記録ではなく、木モデルから得た変数依存の要約をLLMに渡し、ローカルで実行・評価できるPythonプログラムを生成させる。生成モデルの学習や記録のテキスト化を避ける（抄録）。", "p5": "12のデータセットで、統計的忠実度・予測有用性・経験的プライバシーリスクのバランスがよく、6指標の平均順位で10手法中最良だった。ローカル計算量と問い合わせごとのトークン消費も大きく減った（抄録）。", "fun": "個人情報を含む表をAIに見せずに「似た表の作り方」だけを教えてもらう、という発想がうまい。料理に例えれば、材料そのものではなく「材料の組み合わせの傾向」だけを渡してレシピを書かせるようなものだ。AIが答えを作るのではなく手順を作ると、人が中身を点検して直せる。", "unverified": "比較した10手法の名称と、プライバシーリスクの測り方は抄録にない。"}}, {"id": "pr27", "rank": 27, "headline": "拡散事前分布で正則化したベイズ全波形逆解析", "title": "Structure-aware Bayesian full waveform inversion via diffusion-regularized Stein variational gradient descent", "url": "https://arxiv.org/abs/2610.19187", "authors": "Chao Li ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Li, C., Sen, M. K., Fomel, S., & Chen, Y. (2026). Structure-aware Bayesian full waveform inversion via diffusion-regularized Stein variational gradient descent (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19187", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ベイズ的な全波形逆解析（FWI）に、学習済み拡散モデルを「地質らしさへの射影」として組み込み、地下構造の推定と不確実性評価を安定化した。", "p3": "焼きなまし付きStein変分勾配降下（ASVGD）で速度モデルの集団により事後分布を近似する枠組みに、拡散モデルを暗黙の正則化として加える。事前密度を明示的に評価せず、更新された粒子をもっともらしい速度モデルの分布へ導く（抄録）。", "p5": "数値実験で、拡散正則化したASVGD-FWIは地質的に整合した平均モデルを与え、非物理的なアーティファクトを抑え、不確実性の推定が構造の複雑な領域や制約の弱い領域に集中した（抄録）。", "fun": "地震波から地下を描く問題は、答えが一つに決まらない「不良設定」問題だ。ここでは「本物の地層はこういう形をしている」という知識を画像生成AIに覚えさせ、候補の集団をその方向へ引き寄せる。AIが答えを出すのではなく、答えの候補を「ありそうな形」に整える役を担うところが新しい。", "unverified": "実験に使ったモデル（Marmousiなど）の名称と誤差の数値は抄録にない。"}}, {"id": "pr28", "rank": 28, "headline": "PINNの適応コロケーションと残差検証の見直し", "title": "Adaptive collocation and residual verification for engineering physics-informed neural networks", "url": "https://doi.org/10.31224/8525", "authors": "Luis Torres", "venue": "engrXiv", "date": "2026-10-15", "apa": "Torres, L. (2026). Adaptive collocation and residual verification for engineering physics-informed neural networks. https://doi.org/10.31224/8525", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "engrXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "物理情報ニューラルネットワーク（PINN）の「適応的コロケーション」が、同じ残差目的を効率よく推定する操作と、目的そのものを変えて特定領域を強調する操作の2つを混同していることを指摘し、評価プロトコルを提案した。", "p3": "重点サンプリングを使って2つの操作を区別し、残差の大きさと勾配分散の違いを検討する。解析的なホットスポット例で「重要領域を見落とすリスク」を定量化し、後流・熱境界層・固体力学・界面への応用で、サンプリングが幾何と工学的関心量に結びつくべき理由を示す（抄録）。", "p5": "独立な検証、台を保つサンプリング、因果的な時間配分、計算コストの完全な勘定を組み合わせた評価プロトコルを提示し、確率モデルでサンプリングの選択と重要領域の見落としリスクを結びつけた（抄録）。", "fun": "「ネットワークが苦手な場所に訓練点を増やす」という素朴な説明の裏に、実は2つの別物が隠れている、という整理が面白い。テストで言えば「苦手な単元を多く練習する」のと「苦手な単元の配点を上げる」のは違う。どちらをやっているかを自覚しないと、計算が減ったように見えて肝心の場所を見逃すことがある。", "unverified": "提案プロトコルの数値例と比較結果は抄録にない。"}}, {"id": "pr29", "rank": 29, "headline": "モデル縮約の「スナッピング現象」の機構と緩和", "title": "The Snapping Phenomenon and Boundary Enforcement in Model Reduction: Mechanisms and Mitigation", "url": "https://doi.org/10.2139/ssrn.7615201", "authors": "Charbel Farhat ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Farhat, C., Zhu, Y., Asad, F., & Taddei, T. (2026). The Snapping Phenomenon and Boundary Enforcement in Model Reduction: Mechanisms and Mitigation. https://doi.org/10.2139/ssrn.7615201", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "射影型モデル縮約が訓練スナップショットに「貼り付いて」しまう失敗（スナッピング現象）を分類し、パラメータ依存の境界条件を事前に満たしつつこれを除く統一枠組みを提案した。", "p3": "スナッピングを内在的・外在的・数値的の3型に分け、内在的（Type 1）と数値的（Type 3）に対して、パラメータ依存のシフトベクトルを状態の仮定に埋め込む。ラグランジュ乗数やペナルティ法と違い、オンラインで制約を追加せずに境界条件を厳密に満たす。線形領域で理論を立て、非線形の外部CFDに拡張し、スケール付きラプラス枠組みによる空間変動のシフトベクトルを提案する（抄録）。", "p5": "標準的なアフィン型と回帰拡張型の両方でスナップショットへの固着が消え、連続的なパラメータ感度が回復した。構造解析とNACA翼まわりの粘性流、3次元NASA Common Research Modelで検証した（抄録）。", "fun": "大きなシミュレーションを小さな「要約モデル」に置き換えると速くなるが、その要約モデルが「覚えている答え」の一つに固執して、間のケースを滑らかに補間できないことがある。これを「スナッピング」と名づけ、原因を3種類に分けた。境界条件を「あとから縛る」のではなく「最初から座標をずらして満たす」という発想で解いている。", "unverified": "ベンチマークでの誤差の数値は抄録にない。"}}, {"id": "pr30", "rank": 30, "headline": "深層エネルギー法で延性破壊のフェーズフィールド", "title": "A deep energy method formulation for phase-field modelling of ductile fracture", "url": "https://arxiv.org/abs/2610.19094", "authors": "Nojus Plung\\.e ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Plungė, N., Brommer, P., Edwards, R. S., & Kakouris, E. G. (2026). A deep energy method formulation for phase-field modelling of ductile fracture (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19094", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "深層エネルギー法（DEM）を、履歴依存の塑性と結びついた延性破壊のフェーズフィールドモデルに拡張し、有限要素解と近い結果を得た。", "p3": "2次のAmbrosio-Tortorelliフェーズフィールド破壊モデルと小ひずみJ2塑性・線形等方硬化を組み合わせ、体積・偏差分解で弾性の亀裂駆動エネルギーを定め、累積相当塑性ひずみで局所の破壊靱性を劣化させる。変位はReZero残差ネットワーク、フェーズフィールドは中心を学習する局所ガウス基底で表し、エネルギーを交互に最小化する。転移学習で荷重増分間のパラメータを再利用し、収束した構成履歴は積分点で別に持ち越す（抄録）。", "p5": "力–変位応答、エネルギーの推移、塑性変形、亀裂進展で有限要素の参照解とよく一致した。ただし急な破壊事象の近くでは荷重増分の取り方に精度が敏感になる（抄録）。", "fun": "金属が曲がってから割れる「延性破壊」を、ニューラルネットワークに「エネルギーが最も低くなる形」を探させて再現している。亀裂をぼかして表すフェーズフィールドと、変位を表すネットワークを別々にしたのは、一つのネットワークにまとめると亀裂がぼやけすぎたからだ。前の荷重段階で学んだものを次に引き継ぐ工夫も、人が練習を積み重ねるのに似ている。", "unverified": "検証した問題の種類と誤差の数値は抄録にない。"}}, {"id": "pr31", "rank": 31, "headline": "HDG離散化の調和波動伝播のモデル縮約", "title": "Model order reduction of HDG discretizations for harmonic wave propagation", "url": "https://arxiv.org/abs/2610.20145", "authors": "H\\'el\\`ene Barucq ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Barucq, H., Faucher, F., Pham, H., & Tifouti, I. (2026). Model order reduction of HDG discretizations for harmonic wave propagation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20145", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ハイブリッド型不連続ガレルキン（HDG）離散化による時間調和の音響波動問題に対し、周波数帯域にわたって高速で信頼できる射影型モデル縮約法を提案・解析した。", "p3": "体積未知数とトレース未知数を結合した一般化鞍点系として高忠実度モデルを立て、残差に基づく周波数の貪欲サンプリング、HDG解の周波数微分による拡充、POD圧縮で基底を作る。静的縮約と射影が可換でないことから、トレースと体積の両変数のa priori誤差評価を導き、ギャップを消す体積縮約空間の持ち上げ条件を示す（抄録）。", "p5": "2次元Marmousiモデルと未知数10^7超の3次元不均質媒質で理論評価を確かめ、縮約モデルは高忠実度解法に比べ数桁の高速化を達成した（抄録）。", "fun": "地震探査のように多くの周波数で同じ波動方程式を解き直す作業を、少数の代表解の組み合わせで済ませる方法だ。面白いのは、計算を省く2つの操作（変数を消す静的縮約と、空間を縮める射影）の順番を入れ替えると結果が変わることを正面から扱い、ズレがなくなる条件まで突き止めた点にある。", "unverified": "高速化の倍率と誤差の具体的な数値は抄録にない。"}}, {"id": "pr32", "rank": 32, "headline": "主解法の軌道からオンライン縮約でPDE制約最適化", "title": "Online reduced-order modeling from primal solver trajectories for PDE-constrained optimization", "url": "https://arxiv.org/abs/2610.19821", "authors": "Zhe Lu ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Lu, Z., Cao, W., & Zhang, W. (2026). Online reduced-order modeling from primal solver trajectories for PDE-constrained optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19821", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "収束していない高忠実度ソルバの反復軌道からその場で局所縮約モデルを作り、PDE制約最適化を加速するRETOを提案した。", "p3": "有限回の高忠実度の主問題反復で集めたスナップショットから局所縮約モデルを構築し、低コストの状態評価・随伴勾配・設計更新に使う。設計点が更新されるたびに新しいソルバ軌道で縮約モデルを作り直す（抄録）。", "p5": "3つの異なるPDE制約最適化問題で、状態場に不連続がない場合は全次元最適化と同等の解品質を約8〜22倍の高速化で達成し、衝撃波が動く遷音速の逆設計でも約3倍の高速化を保った。局所縮約モデルは新しい軌道を取り込むにつれ衝撃波関連の特徴を捉えていった（抄録）。", "fun": "普通は「計算が終わってから」その結果を要約モデルの材料にするが、この研究は「計算の途中経過」をそのまま材料にする。途中の答えは不正確でも、設計がどちらへ動くかの情報は十分に含まれている、という発想だ。最初から全部を覚えた要約モデルを作る代わりに、設計の動きに合わせて要約を育てていく。", "unverified": "3つの問題の具体的な設定は抄録にない。"}}, {"id": "pr33", "rank": 33, "headline": "液状化地盤の砕石柱の目詰まり劣化：批判的レビュー", "title": "Clogging-Induced Hydro-Mechanical Deterioration of Stone Columns in Liquefiable Soils Under Seismic Loading: A Critical Review, Quantitative Synthesis and Coupled-Modeling Agenda", "url": "https://doi.org/10.20944/preprints202610.1460.v1", "authors": "Priyanka Ahirwar ほか", "venue": "Preprints.org", "date": "2026-10-15", "apa": "Ahirwar, P., Jain, P. K., Utkarsh, U., & Chatterjee, K. (2026). Clogging-Induced Hydro-Mechanical Deterioration of Stone Columns in Liquefiable Soils Under Seismic Loading: A Critical Review, Quantitative Synthesis and Coupled-Modeling Agenda. https://doi.org/10.20944/preprints202610.1460.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "液状化対策の砕石柱が地震の繰返し水圧勾配で目詰まりし、排水機能を失って「3機構から2機構へ」劣化することを、文献の定量統合と枠組みの定式化で示した。", "p3": "188件の記録から試験条件のデータベースを作り、研究クラスタ化したランダム効果で統合する。目詰まり誘起の水理–力学劣化の枠組みを支配方程式で定式化し、古典的フィルター則と地震時排水要件が両立しないことを示す（抄録）。", "p5": "統合した支持力比は1.52、沈下比は0.75だが、すべて静的試験に基づき地震設計が必要とする量ではない。振動台では通常の柱が急速に目詰まりし、低加速度で液状化開始を約1秒遅らせたのち柱長の26〜43%が地盤に貫入、一方で被覆・砂フィルター付き柱は地盤とともに9%沈下し4倍の加速度でも液状化を防いだ。目詰まりを認める解析では地震後沈下が最大229%増加、2回目の過剰間隙水圧比は36%超高い。現行の完全連成モデルはすべて柱の透水性を一定と仮定している（抄録）。", "fun": "地震で地盤が液状化しないように埋める砕石の柱は、水を逃がす「排水管」の役目も担う。ところが揺れのたびに細かい土が柱に入り込み、排水管が詰まっていく。設計はこの劣化を考えておらず、しかも文献にたくさんあるデータは「地震とは関係ない静的試験」ばかりだった、という痛い指摘だ。", "unverified": "支持力比は独立3研究、沈下比は1研究に依拠すると著者自身が述べており、母集団推定とは読めない。"}}, {"id": "pr34", "rank": 34, "headline": "回転ドラム内の二分散粒子の軸方向偏析機構", "title": "Mechanisms leading to axial segregation of bidisperse particles in rotating tumblers", "url": "https://arxiv.org/abs/2610.18885", "authors": "Umberto d'Ortona (M2P2) ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "d'Ortona, U., Lueptow, R., & Thomas, N. (2026). Mechanisms leading to axial segregation of bidisperse particles in rotating tumblers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18885", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "回転ドラム内で大小2種類の粒子が軸方向に縞状に分かれる現象の原因を、DEMシミュレーションで「粒状体版のRayleigh-Taylor不安定性」として説明した。", "p3": "流れ方向・時間方向の不安定性の発達を追い、粒径比・ドラムの長さと直径・種の割合・充填率を広く変えたパラメータ研究で軸方向の縞が現れる条件を調べる（抄録）。", "p5": "表面流動層での初期の半径方向偏析により、充填効率の高い混合粒子層（高密度）が、ほぼ単分散の小粒子層（低密度）の上に乗る。この重い層が軽い層の上にある状態が再循環セルを生み、軸方向の縞を作る。粒径比を上げると混合層の密度が上がり、不安定性が強まって偏析が加速する（抄録）。", "fun": "ナッツの缶を振ると大きい粒が上に来る現象の親戚で、回転する筒の中では大小の粒が輪切りのような縞に分かれる。長年謎だったが、答えは「重い液体が軽い液体の上に乗ると崩れる」という流体の不安定性と同じ仕組みだった。粒の大きさが混ざると隙間が埋まって「重く」なる、という点が肝になる。", "unverified": "シミュレーションの粒子数と縞が現れる条件の閾値は抄録にない。"}}, {"id": "pr35", "rank": 35, "headline": "群の最適輸送のためのマルチスケール分散MPC", "title": "Multiscale distributed MPC for Optimal Transport", "url": "https://arxiv.org/abs/2610.19390", "authors": "Guillem Pascual ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Pascual, G., Huang, Y.-J., & Martínez, S. (2026). Multiscale distributed MPC for Optimal Transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19390", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大きな群（スウォーム）の最適輸送を、上位の最適輸送と下位のモデル予測制御（MPC）の2階層で分散的に実現し、密度の流れの安定性を1-Wasserstein計量で証明した。", "p3": "上位では時間変化する目標密度を終端ペナルティ付きの最適輸送として扱い、正則化した静的双対問題に帰着させて各エージェントが分散的に名目速度を計算する。下位ではMPCが制御アフィン系で名目速度を追従し外乱を除く（抄録）。", "p5": "下位の追従誤差と目標の動きが生むずれに対して、密度の流れが1-Wasserstein計量で分布的な入力–状態安定性を持つことを証明し、追従誤差は巨視的な流れを有界で定量化できる分だけしか乱さない。シミュレーションで時間変化する目標と状態の擾乱に対する有効性を示した（抄録）。", "fun": "何百もの小さなロボットを、個々の位置ではなく「分布」として動かす考え方だ。砂の山を別の形に運び替える最小コストを問う最適輸送の問題を、各ロボットが自分の近くの計算だけで分担して解く。しかも個々のロボットが少し道を外れても、全体の形のずれは一定以下に収まることを数学的に保証している。", "unverified": "シミュレーションのエージェント数と誤差の数値は抄録にない。"}}, {"id": "pr36", "rank": 36, "headline": "ネパール岩氷崩落に検出可能な前兆はなかった", "title": "A steadily flowing glacier and no detectable precursor before the 11 October 2026 Budhi Gandaki rock–ice avalanche and flood, Nepal", "url": "https://doi.org/10.31223/x5qj8g", "authors": "Ajay Kumar Sah", "venue": "EarthArXiv", "date": "2026-10-15", "apa": "Sah, A. K. (2026). A steadily flowing glacier and no detectable precursor before the 11 October 2026 Budhi Gandaki rock–ice avalanche and flood, Nepal. https://doi.org/10.31223/x5qj8g", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EarthArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "2026年10月11日にネパールで起きた岩氷崩落と洪水を、発生後4日以内に無料の衛星データから再構成し、氷河の速度変化などの前兆が検出されなかったことを報告した。", "p3": "Sentinel-1/2、Landsat 8/9、ITS_LIVE、NISARと公式記録、過去のGoogle Earth画像を使い、各変化検出を対照（可能なら事前画像から作った偽のイベント）と比較する（抄録）。", "p5": "源頭の変化は10月6日10:41〜11日10:42の間に起き、23km下流の水位計は5〜11日に洪水を記録していない。13日のLandsat 9は5,020〜5,470mの無名氷河で0.31km²の積雪消失と6,350〜6,600mの崩落痕候補を示した。氷河は10年間およそ年60〜130mで流れ、速度上昇などの前兆はなかった。NISARのL帯干渉図は5月〜10月7日に斜面Bを視線方向±2cm程度に保ち、崩落の9.5時間前に終わる対で異常はなかった。洪水は63km下流のArughatに少なくとも3回の上昇で到達した（抄録）。", "fun": "災害の直後、まだ鮮明な写真が届く前に、無料で手に入る衛星データだけでどこまで分かるかを試した記録だ。面白いのは「前兆はなかった」と言うために、わざと作った偽の変化と比べて検出の信頼性を確かめている点にある。何かが起きる前に何も起きていなかったことを示すのは、実は難しい。", "unverified": "崩落源の体積と小湖の連鎖は未計測と著者自身が述べている。"}}, {"id": "pr37", "rank": 37, "headline": "綿根と土の混合体のDEMモデルと較正", "title": "Discrete element modelling and parameter calibration of cotton root-soil mixtures", "url": "https://doi.org/10.2139/ssrn.7611841", "authors": "Xiangyu Li ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Li, X., Wu, B., Ma, Y., Gu, T., Ye, X., Hu, B., Li, J., & Mao, C. (2026). Discrete element modelling and parameter calibration of cotton root-soil mixtures. https://doi.org/10.2139/ssrn.7611841", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "綿の根と土が混ざった粘着性の粒子系について、安息角試験で較正した個別要素法（DEM）モデルを構築した。", "p3": "Hertz-MindlinにJKRを加えた接触モデルを採用し、物理試験と数値試験の安息角を合わせて主要な接触パラメータを特定・較正する。Plackett-Burman計画で支配的なパラメータを絞り、最急上昇法とBox-Behnken応答曲面で最適化する（抄録）。", "p5": "土–土の表面エネルギー、根–土の反発係数、根–土と土–土の静摩擦係数の4つが安息角の変動の84.97%を説明した。較正モデルの安息角は40.32°で実験の39.62°に対し相対誤差1.77%だった。安息角は主に土–土の粘着・摩擦で決まり、根–土の相互作用は粒子再配列を補助的に調整する（抄録）。", "fun": "根っこが混ざった土を粒の集まりとしてコンピュータで再現するには、粒同士の「くっつきやすさ」や「滑りにくさ」の数値を決めなければならない。この研究は、砂山がどの角度まで積めるかという単純な実験だけで、十数個の数値のうち効くのは4つだと突き止めた。細長い根は、土の粒の動きを少し整える脇役だった。", "unverified": "試験した混合比や粒子数は抄録にない。"}}, {"id": "pr38", "rank": 38, "headline": "理想の人生の記述から言語モデルで価値観と性格を予測", "title": "Using Language Models to Predict Values, Personality, Well-Being, and Meaning in Life From Ideal-Life Descriptions", "url": "https://doi.org/10.31234/osf.io/kjx6f_v1", "authors": "Joffrey Fuhrer ほか", "venue": "PsyArXiv", "date": "2026-10-14", "apa": "Fuhrer, J., & Desbordes, T. (2026). Using Language Models to Predict Values, Personality, Well-Being, and Meaning in Life From Ideal-Life Descriptions. https://doi.org/10.31234/osf.io/kjx6f_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "「理想の人生」を描いた約120語の自由記述から、言語モデルの埋め込みで価値観・性格・well-being・人生の意味など24の構成概念の大半を予測できることを事前登録研究で示した。", "p3": "273人に自由記述（中央値109語）と7つのキーワードを書かせ、Transformer型LLMの埋め込みに正則化した線形プローブをかけて、Big Five、Schwartzの10価値、社会的支配志向、政治的志向、人生の意味、主観的well-beingを予測する（抄録）。", "p5": "自由記述で平均r=0.24、キーワードで平均r=0.12と、両条件で大半の構成概念を偶然以上に予測した。自由記述の優位は達成・博愛・同調・情緒安定性など人があまり直接口にしない概念に集中し、語り方そのものに信号があることを示す。24のうち19の概念を回復した（抄録）。", "fun": "「理想の人生を書いてください」という一問だけで、その人の性格や価値観の大半が読み取れるという結果だ。しかも、キーワードを並べるより文章で語らせたほうが当たる。何を書くかだけでなく「どう書くか」に本人らしさが出るということで、市販のAIに頼らず公開モデルとコードで再現できる点も特徴だ。", "unverified": "構成概念ごとの相関の内訳は抄録にない。"}}, {"id": "pr39", "rank": 39, "headline": "自己進化する多エージェント系を形づくる社会的足場", "title": "Evolve Together, Fall into Place: How Social Scaffolding Shapes Self-Evolving Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.19799", "authors": "Seojin Hwang ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Hwang, S., Choi, Y., & Lee, H. (2026). Evolve Together, Fall into Place: How Social Scaffolding Shapes Self-Evolving Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19799", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "自己進化するLLM多エージェント系の成果が、チーム構成と相互依存の構造（協力・同調・競争）という「社会的足場」に左右されることを示すAGORAを提案した。", "p3": "チーム構成と相互依存構造の2軸を独立に変え、3つの進化機構のもとでウェブ検索・コードベース理解・文書QAの課題を解かせる（抄録）。", "p5": "進化だけではほとんど効果がなく、適切な足場があると単独で進化した強いエージェントを最大25ポイント上回った。その仕組みは最も有能なメンバーに権限が移り他が退くことで、チームの中で育ったそのメンバーは同じモデル単独より優れた（抄録）。", "fun": "同じ能力のAIを集めても、チームの作り方で結果が変わる。協力させるか競わせるかで、誰がリーダーになるかまで変わるという発見だ。しかも「チームの中で育ったエージェント」は、一人で鍛えた同じモデルより強くなる。人間の部活やゼミで起きることが、AIの集団でも起きている。", "unverified": "3つの進化機構の名称と評価指標の定義は抄録にない。"}}, {"id": "pr40", "rank": 40, "headline": "校正された確率の伝達が多エージェント協調を高める", "title": "Narrowing the Collaboration Gap, Probably", "url": "https://arxiv.org/abs/2610.19215", "authors": "Mirah Shi ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Shi, M., Hussing, M., Globus-Harris, I., Collina, N., Roth, A., & Goel, S. (2026). Narrowing the Collaboration Gap, Probably (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19215", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "私的情報を持つLLMエージェント同士が「提案する行動」ではなく「行動に対する校正された確率」を伝え合うと、情報集約が改善することを理論と実験で示した。", "p3": "部分情報下の多ラウンド推論を模した単純な合成設定で確率伝達の優位を理論・実験で確かめ、次に訓練したTransformerと事前学習LLMによる協調迷路課題で検証する。確率に偏りがある場合には、事後の会話的な校正介入を与える（抄録）。", "p5": "校正された不確実性を保つ限り、確率の伝達は行動の伝達を上回った。伝える確率が偏ると利点は消えうるが、校正介入は玩具Transformerでも文脈内で修正を使う事前学習LLMでも一貫して意思決定を改善した（抄録）。", "fun": "二人が同じ答えを選んでも理由が違えば、その理由を共有したほうが賢い結論に近づく。「Aにしよう」ではなく「Aが正しい確率は7割」と伝えると、相手は自分の情報と合わせて更新できる。ただし自信過剰な確率は逆効果で、「言い直し」で校正してやると効く、という人間の会議にも通じる話だ。", "unverified": "迷路課題での性能差の数値は抄録にない。"}}, {"id": "pr41", "rank": 41, "headline": "LLM編集者で国際メディアの議題設定を模擬", "title": "Structural Dependence, Imitation or Herding? A Multi-Agent Simulation of Global Intermedia Agenda Setting", "url": "https://arxiv.org/abs/2610.20144", "authors": "Mohammad Yousuf ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Yousuf, M., & Habib, A. M. T. (2026). Structural Dependence, Imitation or Herding? A Multi-Agent Simulation of Global Intermedia Agenda Setting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20144", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "途上国の報道機関が欧米の主要紙と似た国際報道をする理由（通信社への依存、模倣、群れ行動）を、観測データとLLMエージェントのシミュレーションで切り分けようとした。", "p3": "バングラデシュ・ケニア・南アフリカ・インド・マレーシア・ナイジェリアの18紙が、ウクライナとガザの戦争と2つの国連気候会議（2022〜2024年）で4つの中核紙に注目量・切り口・時期でどれだけ追随したかを測り、言語モデルを各紙の編集者に見立てて依存・模倣・群れ行動を切り替えるシミュレーションを走らせた（抄録）。", "p5": "9つの検定のうち成り立ったのは1つで、通信社原稿に多く頼る紙ほど中核紙の後すぐに報じた。紙の格や地元の利害は効果なし。群れ行動の検定は支持され模倣は支持されなかった。シミュレーションは機構を決められず、依存ルールが当てはめると通信社原稿の掲載に帰着した。通信社原稿が周辺国の国際報道の「時計」を決めるが、議題を決めるかは未解決（抄録）。", "fun": "貧しい国の新聞がなぜ欧米の大手と同じニュースを同じ順で報じるのか。「お金がなくて通信社に頼るから」と「有名紙を真似たいから」は外から見ると区別がつかない。そこでAIに各紙の編集者を演じさせて原因を一つずつ切ってみた。結果は意外と控えめで、分かったのは「通信社が時間を決める」ことだけ、という正直な報告だ。", "unverified": "シミュレーションに使ったモデルと試行数は抄録にない。"}}, {"id": "pr42", "rank": 42, "headline": "実世界の説得場面でLLMの社会的知性を調べるPerSo", "title": "PerSo: Investigating Facets of LLMs' Social Intelligence in Real-World Persuasion Scenarios", "url": "https://arxiv.org/abs/2610.20548", "authors": "Ali Zamani ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Zamani, A., Esfahanian, S., Shahabi, E., Pilehvar, M. T., Shakery, A., & Yaghoobzadeh, Y. (2026). PerSo: Investigating Facets of LLMs' Social Intelligence in Real-World Persuasion Scenarios (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20548", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "実際の説得対話を使って、LLMの社会的知性を「他者の心を推測する認知面」と「適切な社会的行動を選ぶ行動面」の両面で評価するベンチマークPerSoを作った。", "p3": "RedditのChangeMyViewの実対話から、LLMを介したパイプラインで評価課題を構築し、人間の注釈で検証する。認知面と行動面を同時に測る（抄録）。", "p5": "性能は概ねモデル規模とともに上がるが次元によって差がある。最強のLLMは行動課題で観測された最良の人間をわずかに上回ったが、認知課題では最良の人間参加者が依然として先行した（抄録）。", "fun": "人を説得するには「相手が何を考えているか」を読む力と「それに合わせて何を言うか」を選ぶ力の両方が要る。この研究では、AIは「何を言うか」では人間の最高記録をわずかに超えたのに、「相手の心を読む」では人間に及ばなかった。言葉の選び方は上手でも、心の推測はまだ苦手という対比が面白い。", "unverified": "評価したLLMの名称と課題数は抄録にない。"}}, {"id": "pr43", "rank": 43, "headline": "自由回答のLLMコード化が集団推定値を動かす（GSS）", "title": "From Narratives to Population Shares: Coding Protocols, LLM Labels, and Measurement in GSS Next", "url": "https://doi.org/10.2139/ssrn.7613281", "authors": "MohammadJavad Khosravi Bakhtiarvandi", "venue": "SSRN", "date": "2026-10-15", "apa": "Khosravi Bakhtiarvandi, M. (2026). From Narratives to Population Shares: Coding Protocols, LLM Labels, and Measurement in GSS Next. https://doi.org/10.2139/ssrn.7613281", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "自由回答をLLMで分類して集団推定値を作るとき、回答者自身の選択・人間専門家・機械コーダ・モデルやプロンプトの違いという3種類の不一致が推定値をどう動かすかを、2024年GSS Nextで示した。", "p3": "4つのGPT設定で完全なコードを持つ902人について、ラベルの等重み平均と専門家コードを比較し、設計に基づく線形化区間とHolm族で検定する。公式の層・PSU識別子とNext用ウェイトで推論し、修正したRao-Wuブートストラップを用いる（抄録）。", "p5": "GPTの平均は専門家より「8つの争点のいずれでもない」を4.53ポイント少なく分類し（95%区間 [-7.19, -1.86]）、9カテゴリでも検出できた。一方、GPT同士の6組の残差シェア差は1.11ポイント以内で個別には有意でなかった（同等性は未確立）。回答者自身の選択と外部コードの差は20ポイントを超えるが、分類の手続き自体が違うため算法のせいにはできない（抄録）。", "fun": "世論調査の自由回答をAIに分類させると、結果の数字が人間の専門家と数ポイントずれる。しかもAI同士はほぼ同じ答えを出すので、ずれは「AIが気まぐれ」なのではなく「AIと人間で分類の癖が違う」ことから来る。どれが正しいかは決められない、と正直に書いているところが肝心だ。", "unverified": "4つのGPT設定の内訳と、Claude出力が不完全だった件数は抄録にない。"}}, {"id": "pr44", "rank": 44, "headline": "生成AI利用者は転職活動が活発だが転職は増えず", "title": "Searching Without Moving: Generative AI and Worker Mobility", "url": "https://doi.org/10.2139/ssrn.7590007", "authors": "Miguel &Aacute ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Casquet, M. &., Tercero-Lucas, D., & Victoria-Lanzon, C. (2026). Searching Without Moving: Generative AI and Worker Mobility. https://doi.org/10.2139/ssrn.7590007", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "職場で生成AIを使う労働者は転職活動が活発だが、実際に転職しやすいわけではないことを米国の家計調査で示した。", "p3": "2025年のSurvey of Household Economics and Decisionmaking（SHED）で、職場でのAI利用と、無作為化した仮想的な賃金変化への反応、最近の労働市場の結果を合わせて分析する（抄録）。", "p5": "大きな賃金カットへの反応は強いが、AI利用者と非利用者で差はない。主な違いは求職行動で、AI利用者は前年に他の職に応募した確率が約5ポイント高く、応募率はAIの利用頻度とともに上がる。ただし実際に転職した確率が高い証拠は見つからなかった（抄録）。", "fun": "仕事でAIを使っている人ほど、こっそり転職サイトに応募している。でも実際に会社を変える人が多いわけではない、という「動かずに探す」状態を描いている。AIで自分の市場価値が上がったと感じて外を見るのか、今の仕事が物足りなくなるのか、理由はまだ分からない。", "unverified": "標本サイズと応募率の差の推定方法は抄録にない。"}}, {"id": "pr45", "rank": 45, "headline": "ジョブ・クラフティングと燃え尽きを結ぶキャリア不作為", "title": "When Job Crafting Works: Career Inaction as a Mechanism Linking Job Crafting to Burnout under Work Precarity and Psychological Safety", "url": "https://doi.org/10.21203/rs.3.rs-10994030/v1", "authors": "Pradip Kumar Nanda", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Nanda, P. K. (2026). When Job Crafting Works: Career Inaction as a Mechanism Linking Job Crafting to Burnout under Work Precarity and Psychological Safety. https://doi.org/10.21203/rs.3.rs-10994030/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "接近型のジョブ・クラフティングが「キャリア不作為」を減らすことで燃え尽きを下げ、その効果が雇用の不安定さで弱まり、心理的安全性で強まることを示した。", "p3": "南アジアの従業員から3波の時間差パネルデータを集め、キャリア不作為を媒介、雇用の不安定さと心理的安全性を調整変数とする調整媒介モデルを検証する（抄録）。", "p5": "接近型ジョブ・クラフティングはキャリア不作為を減らして間接的に燃え尽きを下げるが、雇用が不安定だと影響が弱まり、心理的安全性が高いと強まった（抄録）。", "fun": "自分の仕事を自分で工夫して作り替える人は燃え尽きにくい、とよく言われる。この研究はその間に「キャリアについて動けない状態」が挟まっていると考えた。工夫しても将来が不安で動けなければ疲れは減らず、職場に安心感があれば工夫が実る。仕組みを一段細かく見た点が面白い。", "unverified": "標本サイズと効果の数値は抄録にない。"}}, {"id": "pr46", "rank": 46, "headline": "新技術導入時の従業員と管理職の認識ギャップ（ホンダ）", "title": "Perception Gap Between Employees and Managers When Introducing Innovative Technologies", "url": "https://doi.org/10.2139/ssrn.7615360", "authors": "Takumi Kato ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Kato, T., Miyata, T., & Tsuda, K. (2026). Perception Gap Between Employees and Managers When Introducing Innovative Technologies. https://doi.org/10.2139/ssrn.7615360", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "新技術導入時に「社内に知識が足りない」と感じるのは現場の従業員ではなく管理職であることを、ホンダのSDV開発部門の大規模調査で示した。", "p3": "ホンダのソフトウェア定義車両（SDV）開発部門の正社員1,374人と中間管理職170人に、開発スピード向上への期待、SDV技術・顧客ニーズ・社内知識、アイデア・承認プロセス・革新文化・リスク管理・意思決定の各要因を尋ねて比較する（抄録）。", "p5": "現場の従業員は自社の知識を有効と認識する一方、管理職は不足と認識し、社内知識をめぐる深刻な認識ギャップがあった。外注への依存は主に経営側の見方から必要とされていると推察され、先行研究の「従業員は恐れ、管理職は導入に前向き」とは逆に、技術企業では従業員が現場の知識に自信を持ち実験に前向きだった（抄録）。", "fun": "新しい技術を入れるとき、怖がるのは現場で、乗り気なのは上司、というのが通説だった。ところが日本の自動車会社の開発部門で1,500人超に聞くと、逆だった。現場は「自分たちはできる」と思い、管理職は「うちには知識がない」と思って外注に頼る。同じ会社の中で見えている景色が違うという話だ。", "unverified": "調査時期と回答率は抄録にない。"}}, {"id": "pr47", "rank": 47, "headline": "フィードバックが人間–AI協働の内省を形づくる", "title": "Think Once, Reflect Twice: How Feedback Shapes Human-AI Collaboration", "url": "https://arxiv.org/abs/2610.19991", "authors": "Joshua Holstein ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Holstein, J., Spitzer, P., Schäfer, S., Förster, M., & Satzger, G. (2026). Think Once, Reflect Twice: How Feedback Shapes Human-AI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19991", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIの助言を人が覆した場面へのフィードバック（事後の内省）が、人間–AI協働の依存行動と内省をどう変えるかを行動実験で調べた。", "p3": "244人の行動研究で、AI助言の上書きを対象にしたフィードバック介入を与え、事後の内省（reflection-on-action）と進行中の内省（reflection-in-action）、依存行動、チーム成績を測る（抄録）。", "p5": "フィードバックは事後の内省に影響する一方、一方向のフィードバックはその後の進行中の内省を減らす恐れがあった。依存行動は相反する方向に動き、全体のチーム成績は変わらないが文脈依存の効果が見られた。バランスの取れたフィードバックにはこの危険がなく、両方の内省が保たれた（抄録）。", "fun": "AIの提案を人が覆したとき、「覆して正解だった／失敗だった」と教えると人は反省するが、片方向の指摘ばかりだと次からは考えずに従うようになる。成績の平均は変わらないのに、人の考え方は変わっている。良い点と悪い点の両方を返すと、考え続ける力が保たれるという、学校の先生の指導にも通じる結果だ。", "unverified": "課題の内容とフィードバックの具体的な形式は抄録にない。"}}, {"id": "pr48", "rank": 48, "headline": "災害時の食料安全保障尺度の開発と心理測定評価", "title": "Measuring Disaster Food Security: Development And Psychometric Evaluation Of The Disaster Food Security Scale", "url": "https://doi.org/10.2139/ssrn.7615418", "authors": "Nadia Koyratty ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Koyratty, N., Josephson, A., Byker Shanks, C., Niles, M. T., Bliss, S., & Clay, L. (2026). Measuring Disaster Food Security: Development And Psychometric Evaluation Of The Disaster Food Security Scale. https://doi.org/10.2139/ssrn.7615418", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "災害時の世帯の食料安全保障の経験を測る15項目の災害食料安全保障尺度（DFSS）を開発し、心理測定的に評価した。", "p3": "災害食料安全保障枠組みに基づき、被災者の経験から15の記述を作って認知面接で磨き、2022年4月に米国の成人を対象とした横断調査に組み込む。過去5年に災害を経験した703人で因子分析、段階反応IRT、信頼性・妥当性、項目機能差を検討する（抄録）。", "p5": "内的一貫性はα=0.92、因子負荷は0.60超、識別力は1超だった。DFSS得点は既存の世帯食料安全保障モジュールの区分や災害時の食料対処行動と期待どおりの関連を示し、支配的な一般因子とともに多次元性の兆候もあった（抄録）。", "fun": "「食べ物に困っているか」を測る尺度は昔からあるが、災害のときは「店が開かない」「調理できない」「水がない」など困り方が違う。被災者の体験談から質問を作り、700人で数学的に検証している。ひとつの大きな「困り度」で説明できる一方、細かい側面も残るという結果は、尺度作りの難しさそのものだ。", "unverified": "項目機能差（DIF）の結果の詳細は抄録にない。"}}, {"id": "pr49", "rank": 49, "headline": "ボゴタの舗装保全の契約効率とライフサイクル分析", "title": "Lifecycle Analysis and Contractual Efficiency in Urban Pavement Preservation: Case Study of Bogota's Non-Trunk Arterial Road Network (2021– 2026)", "url": "https://doi.org/10.2139/ssrn.7610639", "authors": "Oscar Julián Moreno López", "venue": "SSRN", "date": "2026-10-15", "apa": "Moreno López, O. J. (2026). Lifecycle Analysis and Contractual Efficiency in Urban Pavement Preservation: Case Study of Bogota’s Non-Trunk Arterial Road Network (2021– 2026). https://doi.org/10.2139/ssrn.7610639", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ボゴタの都市道路の舗装保全で、3年という短い設計期間が舗装の機能的陳腐化と診断費用の重複を招くことを、2021〜2026年の契約の事例で示した。", "p3": "ボゴタ都市開発研究所（IDU）の道路保全スキームについて、特定区間で2021年と2026年に繰り返された診断・設計段階を追い、構造性能と契約効率を評価する（抄録）。", "p5": "2021年の診断は3年の設計期間で定期・日常の維持を処方し、期間満了と安定性保証の失効後、2026年に同区間が再び診断・設計の対象となって同様の推奨に至った。短期の設計期間が舗装の陳腐化と診断費用の非効率な重複を生むとし、設計期間の延長と長期の交通変数の組み込みによる管理枠組みを提案する（抄録）。", "fun": "道路を直すたびに「まず調べて設計する」費用がかかる。3年しかもたない設計にすると、3年後にまた同じ調査をして同じ答えが出る。役所の契約の区切り方が、道路の寿命と税金の使い方を決めているという、身近なインフラの話だ。", "unverified": "対象区間の延長と費用の数値は抄録にない。"}}, {"id": "pr50", "rank": 50, "headline": "ハーグの都市モビリティと集団健康の多スケール分析", "title": "Urban Mobility and Population Health in The Hague: A Multi-Scale Analysis", "url": "https://doi.org/10.21203/rs.3.rs-11142882/v1", "authors": "Hielke Muizelaar ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "apa": "Muizelaar, H., Haas, M., Vos, R., Vaartjes, I., de Jonge, E., Stergioulas, L., Jong, J. K.-d., & Spruit, M. (2026). Urban Mobility and Population Health in The Hague: A Multi-Scale Analysis. https://doi.org/10.21203/rs.3.rs-11142882/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "携帯電話由来の移動データと集団の健康指標の関係をハーグで調べ、集計した移動量は健康の独立した指標というより、都市の接続性と人口構成の文脈に埋め込まれた指標だと結論した。", "p3": "2019年1〜7月のハーグで、8地域の平均外出距離を移動の指標とし、44の近隣地区で利用できる文脈・健康指標（心血管代謝薬の使用、多剤併用、シンデミックに基づく疾病負荷）と結びつける。残差に基づく調整枠組みで移動と健康を同じ文脈領域で別々にモデル化し、残差の相関を見る（抄録）。", "p5": "地域レベルでは文脈調整後に期待より高い移動が低い疾病負荷と重なった（ρ=−0.26〜−0.48）が、近隣地区との交差スケール分析では相関がかなり弱く（ρ=−0.11〜0.10）、クラスタ・ブートストラップの95%区間はすべてゼロを含んだ（抄録）。", "fun": "「よく動き回る地域は健康」という単純な話は、地図の区切り方を変えると消えてしまう。8つの大きな区域で見ると関係があるように見えるのに、44の小さな地区で見るとほぼゼロになる。スマホの移動データが語っているのは健康そのものより、その街がどうつながっているかだった。", "unverified": "移動データの提供元と人数は抄録にない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "MCMCの収束は有限の診断では証明できない", "title": "MCMC Can See Can't See", "url": "https://arxiv.org/abs/2610.20020", "authors": "Daniel Matsui Smola", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Smola, D. M. (2026). MCMC Can See Can't See (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20020", "why": "どんな有限個の収束診断をすべて通過しても非収束を見逃しうることを不可能性定理として証明し、診断を増やしたときの最悪ケースの減衰率と最適な診断の選び方、残る偏りの任意時刻有効な上界まで与えた。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "ランダム特徴バイグラムモデルの厳密なスケーリング則", "title": "Exact Scaling Laws for a Random-Features Bigram Model", "url": "https://arxiv.org/abs/2610.19281", "authors": "Julian Enoch ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Enoch, J., & Dohmatob, E. (2026). Exact Scaling Laws for a Random-Features Bigram Model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19281", "why": "Zipf則に従うトークン統計と固定ランダム埋め込みのボトルネックをもつ玩具モデルで、幅・語彙サイズ・Zipf指数の関数として予測後悔のスケーリング則を厳密に導き、実データの曲線と一致させた。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "自己回帰的操作変数をもつ短パネルの動的因果効果を無作為化推論", "title": "Randomization Inference for Dynamic Causal Effects in Short Panels with Autoregressive Instruments", "url": "https://arxiv.org/abs/2610.19075", "authors": "Pedro Picchetti", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Picchetti, P. (2026). Randomization Inference for Dynamic Causal Effects in Short Panels with Autoregressive Instruments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19075", "why": "操作変数の割当が未知の持続性をもつAR(1)の革新を通じてのみ無作為である短パネルで、持続性を推定せずに有限標本で水準を保つ無作為化検定を構成した。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "生成AI導入産業で若年高技能労働者は代替から守られない", "title": "Amdahl at Work", "url": "https://doi.org/10.2139/ssrn.7613578", "authors": "Benjamin Verschuere ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Verschuere, B., & Cameron, A. (2026). Amdahl at Work. https://doi.org/10.2139/ssrn.7613578", "why": "CPSの1,230万人月で、生成AIは低技能タスクを年齢を問わず代替し、高技能職では35〜49歳が守られる一方22〜25歳は守られないことを示し、仕事内のAmdahlの法則として説明した。"}, {"id": "pn05", "rank": 5, "field": "機械学習（Hugging Face）", "headline": "世界状態中心の枠組みで長編エージェント動画を生成", "title": "Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation", "url": "https://arxiv.org/abs/2610.20571", "authors": "Weijie Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "apa": "Wang, W., Zhang, H., Li, Y., Liu, A., Zhang, Z., Zhao, H., He, Y., Chen, D. Y., Chen, F., & Zhuang, B. (2026). Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20571", "why": "脚本を場所・カメラ・事象時刻つきのショット要求に変換し、シーン記憶と事象記憶から証拠を取り出してから生成するATASが、4つの生成器すべてでショット間の一貫性を改善した。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "テキスト共変量のモデル不確実性をSSGAMで扱う", "title": "Which Text Matters: Handling Model Uncertainty in Text-as-Data Regressions, with an Application to Central Bank Communication", "url": "https://arxiv.org/abs/2610.19720", "authors": "Martin Feldkircher ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Feldkircher, M., Prostmaier, B., Hofmarcher, P., & Siklos, P. (2026). Which Text Matters: Handling Model Uncertainty in Text-as-Data Regressions, with an Application to Central Bank Communication (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19720", "why": "テキストから作った共変量のどれをどの関数形で入れるかをモデル不確実性と捉え、スパイク・スラブ一般化加法モデルで変数選択と非線形性の判定を同時に行い、ECB記者会見45指標に適用した。"}, {"id": "pn07", "rank": 7, "field": "統計学", "headline": "不良設定逆問題の汎関数の局所推論の限界", "title": "On Local Inference for Functionals of Ill-Posed Inverse Problems", "url": "https://arxiv.org/abs/2610.19350", "authors": "Ellen Graham ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Graham, E., & Rotnitzky, A. (2026). On Local Inference for Functionals of Ill-Posed Inverse Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19350", "why": "ノンパラメトリック操作変数や近接因果推論の汎関数は、点ごとにルートn推論できても局所一様には不可能になりうることを示し、ソース条件などで回復する体制を整理した。"}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "文脈内学習はコピーから合成へ発達する", "title": "From Copying to Composition: How Language Models Develop In-Context Learning", "url": "https://arxiv.org/abs/2610.19113", "authors": "Minglai Yang ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Yang, M., Guo, X., Wang, R., Hou, S., Zhang, D. Y., & He, Y. (2026). From Copying to Composition: How Language Models Develop In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19113", "why": "近くの例をコピーするか文脈全体の規則を合成するかを分ける診断を17モデルに適用し、学習の途中で規則優先が精度向上より先に現れることを示した。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "出産前後の労働市場フローで子供ペナルティを分解", "title": "Labour Market Flows and the Child Penalty: Evidence from Spanish Administrative Records", "url": "https://doi.org/10.2139/ssrn.7590006", "authors": "Amaia Ayala-García ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Ayala-García, A., Lado, S., Silva, J. I., & Serra, L. (2026). Labour Market Flows and the Child Penalty: Evidence from Spanish Administrative Records. https://doi.org/10.2139/ssrn.7590006", "why": "スペインの行政記録で母親79,515人・父親129,669人の月次状態遷移を時変マルコフ連鎖でモデル化し、動的シャープレイ値で性差の7割が常勤への「入職」の差に由来することを示した。"}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "欠測データでの因果探索の識別可能性を一般化", "title": "Generalizing Identifiability Results in Causal Discovery from Complete Data to Missing Data Settings", "url": "https://arxiv.org/abs/2610.19211", "authors": "Matteo Ceriscioli ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "MNARを含む欠測機構の下でも因果グラフが識別可能になる一般的十分条件を与え、完全データ用アルゴリズムの正しさを欠測設定へ拡張する枠組みと2つの漸近的に正しいアルゴリズムを示した。"}, {"id": "pn11", "rank": 11, "field": "環境・気候政策", "headline": "拡散モデルで月次気候場を日次高解像度に同時ダウンスケール", "title": "Generative modelling for multivariate spatio-temporal downscaling of monthly climate fields", "url": "https://arxiv.org/abs/2610.19885", "authors": "Yu Huang ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "1度の月平均気温・降水から0.25度の日次場を、事前学習済み拡散モデルに条件付きガイダンスを加えるだけで再学習なしに生成し、極端事象統計と時空間整合性を保った。"}, {"id": "pn12", "rank": 12, "field": "機械学習（Hugging Face）", "headline": "多教師オンポリシー蒸留の教師間ガード", "title": "Beyond Domain-Routed Supervision: Cross-Teacher Guarding for Multi-Teacher On-Policy Distillation", "url": "https://arxiv.org/abs/2610.13521", "authors": "Shi-Yu Tian ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "why": "領域ごとに教師を割り当てる蒸留で生じる勾配衝突を、非担当教師を批評者として使うトークン単位の信用配分と勾配射影で抑え、高衝突設定で5ポイント超の改善を得た。"}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "戦略的率直さ：ESGの欠点を先に開示する印象管理", "title": "Taking a Step Back to Move Forward: Strategic Candor as an Anticipatory Impression Management Strategy", "url": "https://doi.org/10.2139/ssrn.7615881", "authors": "Xiaojie Wu ほか", "venue": "SSRN", "date": "2026-10-15", "why": "否定的報道より前に自社のESGの欠点を自発的に開示する「戦略的率直さ」を予期的印象管理として概念化し、中国企業3,453企業年で先行開示がESG格付けと結びつくことを示した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "生成モデルを使った条件付き分布の同等性検定", "title": "Testing Conditional Distribution Equality Using Generative Models", "url": "https://arxiv.org/abs/2610.20447", "authors": "Zekai Jin ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "高次元の条件付け変数で検出力が落ちる問題に対し、学習した生成モデルの合成サンプルと観測データを併用する検定を提案し、帰無分布の漸近正規性と局所検出力を示した。"}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "パネルデータと因果推論：TWFEの失敗とその後", "title": "Panel Data and Causal Inference: Review and Practical Considerations", "url": "https://doi.org/10.2139/ssrn.7605798", "authors": "Weijia Wang", "venue": "SSRN", "date": "2026-10-15", "why": "処置時期と効果の異質性の下で二元固定効果が負の重みを持つ理由と、異質性頑健DID・感度分析・因子モデル反事実への移行を整理し、8つのモンテカルロで事前トレンド検定の条件付けが偏りを増やすことを示した。"}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "創業者の自己同一性が戦略刷新を阻む過程理論", "title": "The Genesis-Nemesis Effect: An Identity-Based Process Theory of Founder-Leaders’ Resistance to Strategic Renewal", "url": "https://doi.org/10.2139/ssrn.7611580", "authors": "G. Yoganandan ほか", "venue": "SSRN", "date": "2026-10-14", "why": "市場での承認が創業概念を創業者の自己同一性に組み込み、反証が自己への脅威として処理されて刷新への抵抗を生む過程を、5段階8命題で理論化した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベンチャーを築いた創業者の確信が、後に必要な戦略刷新を妨げる「Genesis-Nemesis効果」を、自己同一性の過程として理論化した。", "p3": "アイデンティティ制御理論に基づき、市場での承認が創業概念を創業者の自己同一性の基準に組み込み、概念への反証が自己への脅威として処理される過程を描く。5段階・8命題と米国・インドの例示事例で、創業者のリーダーシップが資産から障壁に変わる条件を特定する（抄録）。", "p5": "創業者はまず認識的閉鎖で応じ、次に概念に関する決定を標的にした刷新抵抗を示し、肯定的な役員の登用や追随者の集合的同一性の定義で自己検証構造を作る。創業者の権力がこれを創業者主導の刷新・交渉による刷新・強制的な創業者交代・固着の4つの結果に変換する（抄録）。", "fun": "会社を立ち上げた人ほど、その会社を変えられなくなることがある。自分が考えたアイデアが「自分そのもの」になると、アイデアへの批判が人格攻撃に聞こえてしまうからだ。周りを賛成派で固める、社員の「らしさ」をそのアイデアで定義する、といった行動で自分を守る過程を段階的に描いている。", "unverified": "理論論文であり、実証データによる検証は抄録に記載がない。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "制度の不十分さがカリスマ的リーダー需要を生む理論モデル", "title": "The Institutional Dynamics of Charismatic Leadership Demand: A Theoretical Model", "url": "https://doi.org/10.2139/ssrn.7611579", "authors": "Muhsin Halis ほか", "venue": "SSRN", "date": "2026-10-14", "why": "制度の能力不足と問題の要求の差を「制度的不十分さギャップ」と定義し、危機が制度の負荷試験として働き分極化が機能不全を代表性の欠如と解釈させる機構を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "市民が「並外れた個人のリーダーシップが必要だ」と感じる条件を、制度の能力不足の認識（制度的不十分さギャップ）から説明する理論モデルII-CLDMを提案した。", "p3": "問題に必要とされる能力と既存の政治制度に帰属される問題解決・代表能力との認識上の差を中心概念とし、カリスマ的リーダーシップを強いリーダー選好・ポピュリズム・権威主義支持・個人化から区別する。危機は制度能力の負荷試験として働き、分極化が機能不全を代表性の不足に読み替えさせ、制度のレジリエンスが緩衝するとする（抄録）。", "p5": "理論提案であり、測定・弁別妥当性・因果の順序・反証可能性に焦点を当てた実証の研究課題を示している（抄録）。", "fun": "「困ったときに強い指導者を求める」のはなぜかを、指導者の魅力ではなく「制度が頼りにならないという感覚」から説明する。危機そのものがカリスマを生むのではなく、危機が制度のテストになり、落第と感じた人が救世主を探す。分極化が「うまくいかない」を「自分たちが代表されていない」に変えるという指摘も鋭い。", "unverified": "モデルの実証的検証はまだ行われていない（抄録の研究課題より）。"}}, {"id": "pn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "TMTの両利き性がデジタル成熟度を高める（スペイン中小企業）", "title": "The Digital Catalyst: How Top Management Teams Transform Ambidexterity into Digital Maturity", "url": "https://doi.org/10.2139/ssrn.7611581", "authors": "David Neira-Fernández ほか", "venue": "SSRN", "date": "2026-10-14", "why": "207社のPLS-SEMで、経営陣の両利き性がIT への態度を介してデジタル成熟度を高めることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "経営陣（TMT）の両利き性が、ITに対する経営陣の態度を介して企業のデジタル成熟度を高めることをスペインの中小企業で示した。", "p3": "上層部理論と組織の両利き性の文献に基づく媒介モデルを、スペインの中小企業207社の調査データにPLS-SEMで当てはめる（抄録）。", "p5": "TMTの両利き性はITへの態度とデジタル成熟度の両方と正に関連し、ITへの態度はデジタル成熟度と正に関連して両者の関係を部分的に媒介した（抄録）。", "fun": "デジタル化が進む会社と進まない会社の差は、機械やソフトへの投資額ではなく「経営陣が今の事業を守りつつ新しいことも試せるか」という姿勢にあった、という話だ。経営陣がITを好きかどうかが、その姿勢と成果の間をつないでいる。", "unverified": "係数の大きさと測定尺度の内容は抄録にない。"}}, {"id": "pn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "女性の昇進を阻む相互に結びついた障壁の枠組み", "title": "Beyond Representation: Understanding the Interconnected Barriers to Women's Advancement in Organisations", "url": "https://doi.org/10.2139/ssrn.7607362", "authors": "Sangeeta Relan", "venue": "SSRN", "date": "2026-10-15", "why": "個人特性・家族・組織慣行・社会的期待という障壁を別個でなく相互連関として捉える概念枠組みを提案する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "女性のキャリア前進を妨げる個人特性・家族の義務・組織慣行・社会的期待という障壁を、別々ではなく相互に結びついたものとして捉える概念枠組みを提案した。", "p3": "既存文献が特定した障壁の相互連関と、それらが女性のキャリアに累積的に与える影響を検討する概念的な枠組みを構築する（抄録）。", "p5": "焦点を「代表性（人数）」から「組織内での前進」に移し、複数のレベルにまたがる相互に結びついた障壁に対処する施策の必要性を論じる（抄録）。", "fun": "女性管理職の「人数」を増やす政策は増えたが、人数が増えても昇進が進むとは限らない。家庭、職場の慣行、社会の期待といった壁は一つずつ別に語られがちだが、実際は絡み合って効いている。壁を一枚ずつ見るのではなく、網として見ようという提案だ。", "unverified": "概念論文であり、データによる検証は抄録に記載がない。"}}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "バズった都市の経済効果：スピルオーバー頑健な識別", "title": "Viral Cities and Spatial Reallocation: Short-Video Attention Shocks, Spillover-Robust Identification, and National Gains in a Quantitative Model of Chinese Prefectures", "url": "https://doi.org/10.2139/ssrn.7612122", "authors": "Zhihao Yang", "venue": "SSRN", "date": "2026-10-14", "why": "297都市の定量空間モデルで真の効果が既知の擬似パネルを作り、Callaway–Sant'Anna推定が真値に近い一方TWFEが偏ること、局所推定の外挿が全国効果を88%過大評価することを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ショート動画で突然人気になった中国の都市の経済効果について、真の効果が既知のシミュレーション都市パネルを使い、どの推定法が正しく、局所効果の外挿がどれだけ全国効果を過大評価するかを示した。", "p3": "実地理・重力型の観光と移住・戸籍摩擦・土地市場を持つ297の地級市の定量空間モデルで2013〜2024年の都市パネルを模擬し、全国のショート動画到達度と都市の適性指数の交互作用で段階的なバズを発生させる。差の差とシフトシェア操作変数の両方で推定する（抄録）。", "p5": "回帰調整したCallaway–Sant'Anna推定は一人当たり所得の真の2.4%上昇に対し2.1%を回復したが、無条件とTWFEの推定は観光集約都市の全国観光循環への露出差で偏った。人口は0.5%、観光客は30%増える。波及は拡散的で所得の局所推定はほぼ偏らないが、近隣の対照を除かないと人口推定は約25%膨らみ、局所所得増の43%と人口増のすべては他所で相殺され、局所推定の外挿は全国所得増を88%過大評価する（抄録）。", "fun": "ある街がSNSでバズって観光客が押し寄せると、その街は豊かになる。でも隣の街から客が移っただけなら、国全体では増えていない。本物のデータでは「本当の答え」が分からないので、答えを知っている模擬の中国を作って推定法を試した。結果、よく使う方法の一つは偏っていて、街の効果を国に当てはめると9割近く過大になる。", "unverified": "シミュレーションのパラメータの出所は抄録にない。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "転職による賃金成長が企業のキャッシュフローと株式リターンに現れる", "title": "Borrowed Growth: Employer-to-Employer Mobility, Corporate Cash Flows, and Stock Returns", "url": "https://doi.org/10.2139/ssrn.7614778", "authors": "Yunlong Chen ほか", "venue": "SSRN", "date": "2026-10-15", "why": "労働者の企業間移動が賃金とラボアシェアを押し上げる経路が、企業のキャッシュフローと株式リターンにどう映るかを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "労働者の転職が活発な時期には賃金と労働分配率が上がる代わりに企業利益が遅れて減り、株価はその減益が報告されてから反応することを示した。", "p3": "1995〜2025年の修正済み月次の雇用主間転職率を用い、転職率の変動がその後の利益成長・配当成長・賃金・生産性・株式リターンをどう予測するかを調べる。引き抜きが賃金コストを積み上げて遅れて利益に届き、配当平滑化がさらに株主への到達を遅らせるモデルを、リターンデータを使わずに較正する（抄録）。", "p5": "転職率の1標準偏差の上昇は翌年の利益成長を10.9ポイント下げ、配当成長は数年にわたり低下し、賃金・労働分配率・生産性は上がる。株式リターンは翌年に月0.4ポイント低く、予測はサンプル外で過去平均を上回り、減益は負のキャッシュフロー・ニュースとして株価に届く（抄録）。", "fun": "転職が盛んな「熱い労働市場」では、会社は人を引き留めるために給料を上げる。その分の利益の減少はすぐには決算に出ず、株式市場も転職が増えた時点では気づかず、減益が発表されてから株価が下がる。好景気の利益は「未来から借りてきた成長」だという見方だ。", "unverified": "転職率の修正方法の詳細は抄録にない。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "同僚ネットワークが住宅購入に与える影響", "title": "From Firms to Homes: Coworker Networks, Firm Exposure, and Housing Purchases", "url": "https://doi.org/10.2139/ssrn.7613022", "authors": "Chuxuan Fan ほか", "venue": "SSRN", "date": "2026-10-15", "why": "マサチューセッツの雇用主–従業員–住居–住宅取引を連結したパネルで、職場ネットワークが住宅市場に与える影響を推定する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "同じ事業所の同僚が家を買うと自分も買いやすくなるという職場ネットワークの効果を、LinkedInの職歴と不動産取引を結んだパネルで示し、企業の業績信号が住宅市場に伝わる経路を明らかにした。", "p3": "マサチューセッツ州の2006〜2023年について、雇用主の事業所–従業員–居住地–住宅取引を結合したパネルを作り、職業×年と企業×年の固定効果で選別と企業ショックを制御する。2019年以降の在宅勤務への移行を使って社会的相互作用の機構を検証する（抄録）。", "p5": "直近3年に同僚が1人家を買うと、従業員の購入確率は標本平均の20%超上がる。在宅に適した職業ではパンデミック後に同僚効果が有意に減った。元同僚の購入も予測力を持ち、雇用主が拡大すると多く、リスクが上がると少なく買う。企業業績から導いた信号の不一致が大きいほど将来の取引量が増え、複数企業の混ざった信号への露出は取引量を減らす（抄録）。", "fun": "隣の席の同僚がマイホームを買うと、自分も買いたくなる。これが単なる噂ではなく、会社の景気を映す情報として伝わっていることを、転職サイトの履歴と登記のデータを突き合わせて示した。コロナで在宅勤務になった職種ではこの効果が弱まったので、やはり職場での会話が鍵だったと分かる。", "unverified": "標本の従業員数と企業数は抄録にない。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "異質企業の合理的無関心と金融政策の伝達", "title": "Heterogeneous Firms, Rational Inattention, and Monetary Policy", "url": "https://doi.org/10.2139/ssrn.7613379", "authors": "Shengliang Ou ほか", "venue": "SSRN", "date": "2026-10-15", "why": "企業の異質性が注意の配分を決め、金融政策の伝達を形づくる合理的無関心の枠組みを構築する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の規模が価格設定への「注意」の配分を決め、それが金融政策の伝達を左右する、異質企業の合理的無関心モデルを構築した。", "p3": "企業規模と注意の同時分布を内生化する枠組みを作る。大企業は誤った価格の影響が売上に大きく及ぶ一方、需要弾力性と望ましいパススルーが低く、誤価格の損失と名目ショックへの感応度が小さい。需要の曲率がどちらが支配するかを決める（抄録）。", "p5": "注意は規模に対して増加・減少・山形のいずれにもなりうるが、実証的には山形だった。この分布が金融政策の企業横断的な異質効果と、名目ショックが測定TFPを上げるか下げるかを決める（抄録）。", "fun": "中央銀行が金利を動かしたとき、企業がどれだけ素早く値段を見直すかは「どれだけ気にしているか」で決まる。大企業は売上が大きいから気にしそうだが、客が離れにくいから気にしなくてもよい面もある。結果、中くらいの企業が一番気にしているという山形の形になり、それが金融政策の効き方を変える。", "unverified": "実証に用いたデータの種類と国は抄録にない。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "配当のない資産のバブルを支えるスキン・イン・ザ・ゲーム", "title": "Who Keeps a Bubble Alive? Skin in the Game and the Survival of Rational Bubbles", "url": "https://arxiv.org/abs/2610.19496", "authors": "Feng Dong ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "保有を続けるスポンサーの隠れた維持努力が、転売目的でのみ保有される資産の価値を支える理論を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "配当を生まず転売のためだけに保有される資産（トークンなど）の価値が、スポンサーの保有継続（skin in the game）によって支えられる条件を理論的に示した。", "p3": "スポンサーが市場の存続を決める隠れた維持努力を選び、その費用を全額負担しつつ便益は保有トークン分しか得られないモデルで、正の定常均衡の存在条件を調べる（抄録）。", "p5": "正の定常均衡は保有が内生的な最小値を満たすとき、かつそのときに限り存在し、曲率条件の下では閾値以上の保有が2つの正の定常均衡を支える。存続を条件とすると上側均衡より低い価格は下側に収束し、保有が増えると実現可能な価格区間が広がる。将来の保有が最小値を下回るという信頼できるニュースは、逆向きの解きほぐしで即座の崩壊を招く（抄録）。", "fun": "利益を生まないのに値段がつく資産は「次に高く買う人がいる」限り生きている。この論文は、仕掛け人が自分の分を手放さずに持ち続けることが、その市場を生かす「約束」になると説明する。逆に「仕掛け人がそのうち売る」と皆が信じた瞬間に、総供給が変わらなくても価格は崩れる。", "unverified": "理論論文であり、データによる検証は抄録に記載がない。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "分散型A/Bテストでノイズに報酬を与えてしまう誘因", "title": "Rewarding Noise: Incentives in Decentralized A/B Testing", "url": "https://arxiv.org/abs/2610.19512", "authors": "Ryan Kessler", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "検出力の低いA/Bテストが分散組織でノイズ駆動の意思決定を生む誘因構造を分析する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "分散型組織のA/Bテストで検出力が低くなるのは誘因のずれのせいであり、生の効果推定値で評価するとノイズに報酬を与えてしまうことを、理論とAmazonのデータで示した。", "p3": "製品チームが私的報酬を最大化するためにテストの対象と方法を選び、体験のオーナーが評価規則と公開基準を決める、というプリンシパル・エージェントモデルを定式化する。Amazonで実施されたA/Bテストのデータでモデルの予測を検証する（抄録）。", "p5": "正しく較正した事後平均による評価はノイズへの報酬を取り除き、より野心的なアイデアを少数の精密なテストで検証する誘因を局所的に生む。2024年にAmazonのある体験が事後平均に基づく評価へ移行した後、テスト数は減り、精度と真の効果のばらつきは増え、信号対雑音比は2倍超になった（抄録）。", "fun": "「効果があった」と見えたテストだけが評価されるなら、たくさん小さなテストをしてまぐれ当たりを狙うのが得になる。評価の計算を「ノイズを割り引いた推定値」に変えただけで、チームは少数の大胆なテストを選ぶようになった。測り方が、何を試すかまで変えるという実例だ。", "unverified": "対象となったAmazonの体験の内容とテスト件数は抄録にない。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "越境介護労働ショックと台湾・日本の介護体制の違い", "title": "Cross-Border Labor Shocks, Long-Term Care Regimes, and Intra-Household Resource Allocation: Evidence from Taiwan and Japan", "url": "https://doi.org/10.2139/ssrn.7614340", "authors": "HUNG YU HUANG ほか", "venue": "SSRN", "date": "2026-10-15", "why": "2020年の移民労働供給の途絶を準自然実験とし、PSFDとJHPSの10年パネルで台湾は金銭移転、日本は介護時間が急増するという体制の違いを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "2020年の越境移民労働の途絶を準自然実験として、市場型の移民介護に頼る台湾と公的保険の日本で、世帯内の資源配分が対照的に変化したことを示した。", "p3": "台湾の家族動態パネル（PSFD）と日本家計パネル調査（JHPS）の2012〜2022年を調和させ、イベントスタディと差の差で「介護のクラウディングアウト効果」を検証する（抄録）。", "p5": "台湾の世帯では親への金銭移転が急増し介護時間は安定した一方、日本では介護時間が急増し金銭移転は増えなかった。要介護の親がいる世帯では現金支援が所得比で4.37ポイント減り、配給された公的サービスを家族の時間で代替したことを示す。性別格差は広がらず息子と娘の貢献は収斂し、台湾では流動性制約が男性介護者の主観的well-beingを日本より下げた（抄録）。", "fun": "コロナで外国人介護労働者が来られなくなったとき、台湾の家族は「お金」で、日本の家族は「時間」で穴を埋めた。公的介護保険がある日本では、サービスが足りない分を家族が自分の時間で補うしかなかった。介護制度の違いが、ショックのときに何が家族に押しつけられるかを決めている。", "unverified": "両パネルの標本サイズは抄録にない。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "階層ガウス過程による調査ウェイトの局所等価ウェイト", "title": "Hierarchical Gaussian Processes for Survey Weighting: Local Equivalent Weights in Structured Populations", "url": "https://arxiv.org/abs/2610.20321", "authors": "Seonghun Lee", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "回帰ベースの調査ウェイティングで、非線形モデルの局所等価ウェイトを階層ガウス過程で構造化母集団に適用する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "階層ガウス過程回帰に基づく調査ウェイティングの枠組みを作り、非線形モデルでも事後層化推定量の感度から「局所等価ウェイト」を構成できるようにした。", "p3": "構造化された集団レベルの効果とカーネル平滑化を組み合わせて疎な事後層化セル間で情報を共有し、構造化共分散を利用した事後予測公式で計算を減らす。事後予測平均の一様収束を示し、プラグイン事後層化推定量の1次感度を当てはめ応答平均の加重平均の感度に一致させて局所等価ウェイトを作る（抄録）。", "p5": "シミュレーションでは、ノンパラメトリックな構造の下でHGPが集団加重の予測誤差を下げ、正しいパラメトリック指定の下ではロジスティック回帰がよく機能した。Future of Families and Child Wellbeing Studyへの適用例を示す（抄録）。", "fun": "世論調査で「若い男性が少なすぎる」といった偏りを直すのがウェイト付けだ。細かい属性で分けると人数がほとんどいないマスができてしまうが、似た属性どうしで情報を貸し借りすれば埋められる。この研究は、その貸し借りをガウス過程という滑らかな関数で行い、しかも結果を「各回答者の重み」として読めるようにしている。", "unverified": "シミュレーションの設定と誤差の数値は抄録にない。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "ネットワーク未知の固定効果パネルで仲間効果を検定", "title": "Testing for Peer Effects in Heteroskedastic Fixed-Effects Panels", "url": "https://arxiv.org/abs/2610.20045", "authors": "Leheng Cai ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "相互作用ネットワークを指定せずに、個体・時間固定効果パネルで仲間効果の有無を二次形式検定で調べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "相互作用ネットワークを指定せずに、個体・時間固定効果パネルで仲間効果の有無を検定する二次形式検定を提案し、条件付き不均一分散の下でも中心化を回復するレバレッジ調整を導入した。", "p3": "残差化した仲間共変量のグラム行列に基づく二次形式検定を用いる。固定効果の除去と撹乱推定が従来の対角除外型統計量の中心化を壊すため、レバレッジ調整で厳密な条件付き中心化を取り戻し、残差に基づく分散推定と組み合わせる（抄録）。", "p5": "スチューデント化統計量は両方のパネル次元が発散するとき、相対的な増加率に制約なく漸近的に標準正規になり、追加条件の下で対立仮説に対し一致する。時間方向に弱従属な共変量にも拡張でき、長期分散の推定は不要。モンテカルロで既存のベンチマーク検定より良好で、州の租税競争とOECD諸国の成長波及に応用した（抄録）。", "fun": "「隣の州が税金を下げたら自分の州も下げる」のような仲間効果を調べるには、普通は「誰が誰の仲間か」の地図が要る。この研究は地図なしで「仲間効果がそもそもあるか」を検定できる。個人差や時代差を取り除く操作が検定の土台を崩すという落とし穴を、幾何的な補正で直している。", "unverified": "検定の検出力の数値は抄録にない。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "多変量Hawkes過程の共通信号と見かけの相互励起", "title": "Common Signals, Spurious Cross-Excitation, and Identification in Multivariate Hawkes Processes", "url": "https://arxiv.org/abs/2610.19428", "authors": "Jiwon Jung ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "潜在的な共通信号が構造的相互作用なしに見かけの励起を生むことを特徴づけ、識別の条件を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多変量Hawkes過程で、潜在的な共通信号が構造的相互作用なしに「見かけの相互励起」を生むことを示し、2次統計量では識別できないが3次キュムラントで局所識別できることを明らかにした。", "p3": "共通信号モデルと同じ平均強度とBartlettスペクトルを持ちながら励起機構が異なる、安定で非負のHawkes過程を構成する。Cox型の移入を持つHawkes過程の積分3次キュムラントを導き、2・3次元系で正規化構造パラメータの一般的な局所識別を示す。制限されたパラメトリック族にはビン化カウントからのWhittle推定を開発し、一致性・漸近正規性・サンドイッチ標準誤差を与える（抄録）。", "p5": "厳密同値のモンテカルロで3次情報が同じ2次構造の機構を区別できることを示す一方、弱い信号では有限標本の限界が大きい。暗号資産取引への応用で、推定された励起がモデル指定に敏感で、スペクトルの当てはまりだけでは構造的解釈に限界があることを示した（抄録）。", "fun": "「Aの取引が起きるとBの取引が誘発される」ように見えても、実は両方が同じニュースに反応しているだけかもしれない。驚くのは、平均や相関（2次の統計）を完全に一致させた「偽物」の因果モデルを作れること。3つ組の統計まで見ないと本物と偽物が区別できないのに、データが弱いと3つ組でも見分けにくい。", "unverified": "暗号資産データの期間と銘柄は抄録にない。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "再利用可能な局所事後分布による半償却ベイズ推論", "title": "Semi-Amortized Bayesian Inference with Reusable Local Posteriors", "url": "https://arxiv.org/abs/2610.18945", "authors": "Niek Stevenson ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "高次元で結合事後分布を一括学習する難しさに対し、局所事後分布を再利用する半償却推論を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高次元のベイズモデルで、パラメータをブロックに分け、条件付き独立性を使って各ブロックの完全条件付き事後分布をニューラル推定器で近似し、マルコフ連鎖に組み込む半償却推論を提案した。", "p3": "事後更新が計算的に高価または頻繁に繰り返されるブロックに対し、関連するモデル成分のシミュレーションから推定器を学習する。マルコフ連鎖はこれらの推定器からの直接サンプリングと残りの変数の従来の更新を交互に行い、尤度評価も採択棄却も不要。同じ条件付き構造が繰り返されるところでは、一つの推定器をブロックとデータセットをまたいで再利用できる（抄録）。", "p5": "高次元で計算コストの高い階層モデルと時空間モデルで手法を例示した（抄録）。", "fun": "シミュレーションから「データを見たらパラメータはこう」と答える機械を学習しておくのが償却推論だが、全部を一度に学ぶのは無理がある。そこで問題を部品に分け、よく使う部品だけ機械に覚えさせ、残りは従来の手計算で回す。同じ形の部品なら一度覚えた機械を使い回せる、という分業の発想だ。", "unverified": "例示したモデルでの精度と計算時間の数値は抄録にない。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "入れ子多変量多忠実度制御変量の最適標本配分", "title": "Analytically Optimal Sample Allocations for Nested Multivariate Multifidelity Control Variate Estimators", "url": "https://arxiv.org/abs/2610.19371", "authors": "Atticus Rex ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "計算資源が限られたモンテカルロ推定で、多忠実度制御変量の標本配分を解析的に最適化する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "入れ子型の多変量多忠実度制御変量推定量について、限られた計算予算をモデル間にどう配分すべきかの閉形式の最適解を導いた。", "p3": "高忠実度モデルが低忠実度モデルの入力の部分集合で評価される入れ子構造を扱い、入れ子MLBLUEをMFMC推定量の拡張として再定式化して最適な分数的標本配分を閉形式で求める。整数予算配分には組合せ最適化の貪欲法を、制御変量係数には少数のパイロット標本からの頑健な近似を提案する（抄録）。", "p5": "2つの数値例で理論を確かめ、拡張MFMC定式化が既存推定量より精度を高めることを示した。従来は数値最適化に頼り、閉形式は最適でない推定量にしか知られていなかった（抄録）。", "fun": "精密だが高価なシミュレーションを数回と、粗いが安いシミュレーションを多数回組み合わせると、同じ予算で誤差を減らせる。問題は「どれを何回回すか」で、これまではコンピュータで試行錯誤していた。この研究はその最適な配分を紙と鉛筆で解ける式にした。", "unverified": "数値例の問題設定と精度の改善幅は抄録にない。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "3トークン1層のTransformerでも収束しないことがある", "title": "Asymptotic Behavior of Transformers", "url": "https://arxiv.org/abs/2610.19358", "authors": "Katy Blumer ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "長時間テキストを生成するTransformerの漸近挙動を調べ、極めて単純なモデルでも収束に失敗しうることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "長時間テキストを生成するTransformerの漸近挙動を調べ、3トークン・1層の注意のみのモデルでも収束しないことがある一方、softmax温度が閾値を超えればキャッシュの経験分布が初期条件によらず一意の極限に収束することを示した。", "p3": "任意の有限深さ、層正規化、MLP、RoPE符号化、局所層と大域層の任意の混合を持つ豊かなTransformerのクラスを扱い、各モデルに温度閾値が存在することを示す（抄録）。", "p5": "各Transformerに閾値はあるが、その上限は無限大なので、すべてのTransformerを収束させる大域的な最小温度は存在しない（抄録）。", "fun": "文章生成AIを延々と走らせると、最終的に「落ち着く」のか「ぐるぐる回り続ける」のか。答えは「温度（ランダムさ）を上げれば落ち着くが、どこまで上げれば十分かはモデルごとに違い、全部に効く値はない」。たった3つの単語と1層のモデルでも落ち着かない例が作れる、というのが意外だ。", "unverified": "収束しない3トークンの例の構成は抄録にない。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "文脈内強化学習のTransformer文脈圧縮を証明", "title": "Provable Transformer Context Compression for In-Context Reinforcement Learning", "url": "https://arxiv.org/abs/2610.20004", "authors": "Yajie Zhao ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "文脈サイズがサンプル数とともに増える既存構成に対し、Transformerが文脈を圧縮して文脈内強化学習を行えることを理論的に示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Transformerが文脈内で強化学習（固定方策のTD評価）を行うのに本質的に必要な文脈の大きさを、Krylov次元として特徴づけ、文脈を圧縮したときの最適な近似誤差を示した。", "p3": "共有線形デコーダの下で最初のL回のTD反復を厳密に再現する最小文脈次元がサンプル遷移の誘導するKrylov次元であることを示し、文脈次元mがそれを下回る場合の最適近似誤差をΘ(γ^m max{1, 1/(m(1−γ))})と特徴づける。保持メモリの最適値をΘ(n k_L)とし、タスク多様性の下で補助目的の大域収束を証明して事前学習による学習可能性を示す（抄録）。", "p5": "厳密階数は満だが数値階数が小さい課題で、精度10^-2の文脈はTDの疎な十分統計量より88.7%小さかった。多様なTD評価問題でパラメータ回復と文脈–精度のトレードオフを確認した（抄録）。", "fun": "AIが「過去の経験を文脈に入れるだけで学習する」とき、経験を全部入れないと駄目なのか、要約で済むのか。答えは線形代数のKrylov次元で決まり、必要な大きさを下回ると誤差は割引率のべきで減る。実験では、必要な情報を9割近く削っても精度が保たれた。", "unverified": "実験に使ったTransformerの規模は抄録にない。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "機構的解釈可能性のための疎Transformerテストベッド", "title": "Sparse Transformer: a Controlled Testbed for Mechanistic Interpretability", "url": "https://arxiv.org/abs/2610.19907", "authors": "Anton Korznikov ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "評価の基準となる真の特徴単位がない問題に対し、既知の特徴をもつ制御されたTransformerを用意して解釈手法を検証できるようにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ニューロンが特化するよう強制した5層の疎Transformer（ST）を作り、機構的解釈可能性の手法を「正解のある基準」で評価できるテストベッドにした。", "p3": "TinyStoriesで訓練した5層言語モデルの広いMLPにTopK疎性を課してニューロンを特化させ、損失を揃えた密なTransformerと解釈可能性を比べる。Transcoder（MLPの入出力写像を近似）とSparse Autoencoder（出力のみ再構成）でSTのニューロンベクトルの回復を比較し、疎MLPを密に蒸留して多義性の発生を調べる（抄録）。", "p5": "STのニューロンはAutoInterpで密モデルを43%上回り、中央値12ニューロンの回路で個々の予測を再現できた。TranscoderはSparse Autoencoderより52.6%高いコサイン類似度でニューロンベクトルを回復し、密への蒸留で圧縮が特徴の重ね合わせを生む過程が見えた（抄録）。", "fun": "AIの中身を解読する研究は「正解が分からない」ことが最大の壁だった。この研究は、最初から1つのニューロンが1つの役割を持つように作った小さなモデルを用意し、解読法の答え合わせができるようにした。それを普通のモデルに圧縮すると、1つのニューロンが複数の意味を持つようになる様子まで観察できる。", "unverified": "モデルのパラメータ数は抄録にない。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "答えのみのデータから事後学習する逆推論モデル", "title": "Inverse Reasoning Models for Efficient Post-Training and Verification from Answer-Only Data", "url": "https://arxiv.org/abs/2610.18878", "authors": "Eric O. Korman", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "推論過程の教師データを要する教師あり微調整の非効率に対し、答えのみから事後学習と検証を行う逆推論モデルを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "答えだけのデータから推論過程を潜在変数として扱い、答えから推論過程を生成する「逆推論LLM」で自己蒸留する手法を提案し、検証器としても使えることを示した。", "p3": "元のモデルの推論過程を答えに条件づけて生成する逆モデルを一度訓練し、以後の答えのみデータのバッチに再利用する。生成はすべてオフラインで事前に行う。Qwen3-0.6BでCountdownとGSM8Kを用い、GRPO訓練が飽和した後に逆モデルからの1回のオフライン蒸留を行う（抄録）。", "p5": "難しいプロンプトでpass@1がおよそ2倍になり、Countdownでは棄却サンプリング自己蒸留をすべての難問指標・混合比で上回った（GSM8Kでは小さめ）。新データでGRPOを続けると難問のpass@1では優位だがpass@8・32では蒸留に劣る。逆モデルをbest-of-n選択の検証器に使うと、Countdownの選択精度が多数決の0.753から0.969に上がった（抄録）。", "fun": "答えだけが分かっていて途中式がない問題集から、AIに途中式を学ばせる方法だ。コツは「答えを見て途中式を書く」別のAIを作ること。カンニングのようだが、モデル自身が一度も解けない問題でも学習の手がかりが得られる。しかもその「答えから逆算するAI」は、答えの正しさを判定する審判としても優秀だった。", "unverified": "難問の定義と混合比の設定は抄録にない。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "関係深層学習の単純ベースラインを見直す", "title": "Revisiting Simple Baselines for Relational Deep Learning", "url": "https://arxiv.org/abs/2610.20534", "authors": "Viet The Nguyen ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "関係データベースを時間異質グラフとして学習する最近の手法に対し、単純なベースラインの性能を再検証する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "関係データベース上の深層学習（RDL）で、固定の低域特徴伝播とMLP、履歴ラベルのCorrect-and-Smoothという単純なベースラインが、異質GNNの性能のかなりの部分を回復することを示した。", "p3": "予測信号が対象属性・関係属性・履歴ラベルから生じるという観察に基づき、固定の低域特徴伝播を関係エンティティグラフに適応してMLPを訓練し、対象エンティティを結ぶ課題固有のメタグラフ上でCorrect-and-Smoothにより履歴ラベルを取り込む（抄録）。", "p5": "RelBenchの分類・回帰課題で、近傍フィルタした特徴で訓練したMLPは対象属性のみのMLPを大半の課題で上回り、異質GNNの性能の相当部分を回復した。Correct-and-Smoothは履歴ラベルからさらに利得を与えたが、対象エンティティ間の接続が関係グラフに直接指定されないため、別途メタグラフを構築する必要があった（抄録）。", "fun": "顧客・注文・商品のような複数の表がつながったデータベースから予測するのに、最近は複雑なグラフニューラルネットが使われる。この研究は「隣の表の情報を平均して足す」程度の単純な方法でもかなり近い精度が出ると示した。複雑さの何割が本当に必要なのかを測る物差しになる。", "unverified": "課題ごとの精度の数値は抄録にない。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "表データ文脈内学習のMoE基盤モデルOrionMoE", "title": "OrionMoE-v1.0: A Mixture-of-Experts Foundation Model for Tabular In-Context Learning", "url": "https://arxiv.org/abs/2610.20418", "authors": "Mohamed Bouadi ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "ラベル付きサポート表から未知の観測を予測する表データ基盤モデルに、専門家混合を導入する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "特徴軸に沿って専門家を選択的に活性化する疎な専門家混合（MoE）を持つ小型の表データ基盤モデルOrionMoE-Smallを提案し、合成課題のみの事前学習で大型モデルに匹敵する性能を示した。", "p3": "二軸Transformerの上で、個々の特徴表現とデータセット全体の文脈の両方に基づくルーティングで特徴軸の専門家を選び、分布を意識した表現と組み合わせる。構造化された因果事前分布から生成した合成分類課題のみで事前学習し、勾配更新なしで下流予測を行う（抄録）。", "p5": "複数の表データベンチマークで、かなり大きな基盤モデルと競合する性能を示し、特に小さな文脈と高次元のデータセットで強かった。クラス不均衡下でも相対的に良好で、特徴の構成の重要性が示された（抄録）。", "fun": "表データ（エクセルのような形）を一度も見たことのない実データで学習せず、コンピュータが作った架空の表だけで学んだモデルが、実際の表でも当てる。さらに、列ごとに「担当の専門家」を切り替える仕組みで、ずっと大きなモデルと互角になった。列の性質が違えば扱いも変える、という当たり前を実装した形だ。", "unverified": "比較した基盤モデルの名称と性能差の数値は抄録にない。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "評価法が分からないときに信頼できる評価設定を選ぶ", "title": "How to Evaluate When You Don't Know How to Evaluate? Choosing Reliable Setups for Base Language Model Benchmarking", "url": "https://arxiv.org/abs/2610.19185", "authors": "Shenbin Qian ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "単調性・非
