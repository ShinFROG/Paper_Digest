ランダム性・順位一貫性を規範的メタ尺度として、26の2Bモデル・4言語80課題で評価設定8側面を比較し、複数プロンプトの使用など具体的な推奨を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの評価設定（課題の定式化や文脈内例の数など8側面）を、途中チェックポイント間の単調性・非ランダム性・順位一貫性という3つの規範的メタ尺度で比較し、信頼できる設定の選び方を示した。", "p3": "事前学習初期の場面で、異なる種類のデータで訓練した26の単言語2Bパラメータモデルを4言語80課題で評価し、同じ4言語で7B以上の3モデルでも設定を検討して規模による変化を調べる（抄録）。", "p5": "複数プロンプトの使用のように一貫して有用な選択がある一方、課題の定式化のようにモデル規模に依存する選択もあった。この枠組みは新しい場面で評価設定を選ぶレシピとして使える（抄録）。", "fun": "AIの成績は「どう出題するか」で大きく変わるのに、出題法の決め方に根拠がなかった。この研究は「学習が進めば点が上がるはず」「でたらめではないはず」「順位が安定するはず」という当たり前の性質を物差しにして、出題法そのものを採点した。テストのテストをする、という発想だ。", "unverified": "8側面の内訳と推奨の具体的な内容は抄録にない。"}}, {"id": "pn39", "rank": 39, "field": "機械学習（Hugging Face）", "headline": "合成経験からゲーム操作を学ぶPlayer-1", "title": "Player-1: Learning to Play from Synthetic Experience", "url": "https://arxiv.org/abs/2610.20584", "authors": "Mingyu Ouyang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "why": "6,044のプレイ軌跡で初期化し、16の合成環境で検証可能報酬のPPOを行う事後学習で、MineDojo-300の成功率をSFTから27.8ポイント引き上げた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "コンピュータ操作エージェントに、実演データを超えて合成環境での経験からゲーム操作を学ばせる事後学習枠組みPlayer-1を提案した。", "p3": "行動空間に相対ポインタ移動・押し続け・複合操作を加え、6,044の厳選したプレイ軌跡で教師あり初期化を行う。ゲームに共通する制御要求に基づく16の合成2D・3D環境Player-1-Gymを作り、プログラムで検証可能な報酬とランダム化した観測・制御で多環境PPO強化学習を行う（抄録）。", "p5": "Player-1-9Bと35B-A3BはMineDojo-300の成功率をSFT方策からそれぞれ27.8と17.7ポイント改善し、9Bは38.33%で最強ベースラインの12.63%を上回った。ViZDoom-10とGameWorldでも改善し、合成環境の幅が転移を高め、強化学習中に複合操作の使用が増えた（抄録）。", "fun": "AIにゲームを教えるのに、人間のプレイ動画だけでは「見たことのない場面」に弱い。そこで本物のゲームではなく「ゲームに共通する動き」だけを抽出した練習用の仮想環境を16個作り、そこで試行錯誤させた。練習問題で鍛えたほうが本番に強くなった、という結果だ。", "unverified": "ベースラインのモデル名は抄録にない。"}}, {"id": "pn40", "rank": 40, "field": "機械学習（Hugging Face）", "headline": "コード用エージェントのハーネス工学を評価", "title": "Doc2Harness: Benchmarking LLMs on Long-Horizon Harness Engineering of Coding Agents", "url": "https://arxiv.org/abs/2610.20344", "authors": "Yuyao Ge ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "why": "長期タスクのエージェントの性能がモデルと同じくらい周囲のハーネスに依存することに着目し、ハーネス構築能力を測るベンチマークを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "LLMエージェントの性能がモデルと同じくらい周囲の「ハーネス」に依存することに着目し、長期のハーネス工学そのものを決定論的に評価する2段階ベンチマークDoc2Harnessを提案した。", "p3": "第1段階でビルドモデルがインターフェースのみの契約骨格と12の最先端ハーネスの振る舞いをまとめた開発文書を受け取り、隔離コンテナで完全なハーネスを構築する。第2段階で凍結したハーネスをテストごとに別コンテナで走らせ、スクリプト化した模擬モデルで駆動し、モデルへの要求・ディスク上のファイル・終了コード・コマンド出力の4チャネルで採点する（抄録）。", "p5": "19の最先端モデルを各3回の独立ビルド・328テストで評価し、GPT-6 Astraが最高の53.05%、最弱モデルは27.44%で約26ポイントの差。最強モデルでもほぼ半分のテストに失敗し、失敗は横断的機能をモジュールにどう分割するかに集中した（抄録）。", "fun": "AIエージェントの出来は、頭脳（モデル）だけでなく手足や道具箱（ハーネス）で決まる。では、その道具箱をAI自身に設計させたらどうなるか。最高のモデルでも半分しか合格できず、つまずくのは「機能をどう部品に分けるか」という設計の基本だった。", "unverified": "19モデルの内訳は抄録にない。"}}, {"id": "pn41", "rank": 41, "field": "機械学習（Hugging Face）", "headline": "エージェント強化学習の自己蒸留の現実確認", "title": "More Methods, Better Agents? A Reality Check on Self-Distillation in Agentic Reinforcement Learning", "url": "https://arxiv.org/abs/2610.19789", "authors": "Linhao Zhong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "why": "公表ベースラインの条件が揃わないまま比較されてきた自己蒸留手法を、統一条件で再評価する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "エージェント強化学習の自己蒸留手法10種をGRPOと統一条件で比較し、どの手法も一貫してGRPOを上回らないこと、最終性能が不安定な訓練を隠しうること、追加の計算コストが性能に結びつかないことを示した。", "p3": "ALFWorld・ScienceWorld・Search-QA・WebShopで3つのモデル規模について、132回の訓練と計12,124.4 H800 GPU時間を記録し、事前学習バックボーンと11手法すべてを8つのロールアウトシードで繰り返し評価する。最終性能に加え訓練の進行・安定性・計測した計算コストを調べる（抄録）。", "p5": "GRPOに対する利得は範囲が限られ、全設定で一貫して上回る手法はなかった。強い最終性能が不安定な訓練を隠すことがあり、追加の訓練コストは一貫して性能向上に結びつかなかった（抄録）。", "fun": "新しい手法の論文は、以前の論文の数字をそのまま比較に使うことが多い。でも条件が違えば比較にならない。この研究は1万GPU時間以上をかけて10の手法を同じ土俵で走らせ、「基本の手法にはっきり勝てるものはなかった」と報告した。派手さはないが、こうした「現実確認」が分野を前に進める。", "unverified": "3つのモデル規模の具体値は抄録にない。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "忍耐の異なる顧客への動的サービス配分（二面市場）", "title": "Dynamic Service Allocation for Customers with Heterogeneous Patience in Two-Sided Platforms", "url": "https://doi.org/10.2139/ssrn.7607242", "authors": "Yuting Liu ほか", "venue": "SSRN", "date": "2026-10-15", "why": "待ってもよい割引顧客と即時顧客への配分をMDPで定式化し、待ち時間に応じた閾値方策が市場規模nに対しO(1/n)の損失で漸近最適であることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "通常サービスと割引の「待って節約」サービスを提供するオンデマンド型二面プラットフォームで、待ち時間に応じた閾値方策が漸近最適であることを示した。", "p3": "最大待ち時間保証と期限切れ時の補償を持つ待ち節約サービスと、待っている間に離脱しうる顧客を、無限期間の長期平均報酬MDPで定式化する。次元の呪いを避けるため離散時間の流体近似を作り、顧客の待ち年齢が臨界閾値に達するまで待ち節約需要の充足を戦略的に遅らせる年齢依存の閾値方策を導く（抄録）。", "p5": "供給が潤沢なときは通常顧客を優先し、供給不足時には閾値を超えて待った節約顧客が優先されるという優先順位の逆転構造が現れる。年齢依存閾値方策は市場規模nに対しO(1/n)の損失比で漸近最適で、静的配分や状態依存配分より良い。連続時間への拡張では、問題が待ち節約の配車年齢閾値の最適化に帰着する（抄録）。", "fun": "配車アプリで「少し待てば安くなる」を選んだ客を、いつ乗せるべきか。答えは「車が余っているときは急ぎの客を優先し、足りないときは長く待った安い客を優先する」という逆転だった。待ち時間という一つの数字を見張るだけで、ほぼ最適になるというのが面白い。", "unverified": "数値実験での損失の大きさは抄録にない。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "量と質を一つにまとめる評価指標Perf", "title": "Perf as a Single Metric of Volume and Quality for Business and Marketing Evaluation", "url": "https://doi.org/10.2139/ssrn.7614661", "authors": "T. T. Eapen", "venue": "SSRN", "date": "2026-10-15", "why": "総量と平均の積を単一指標とし、評価の基準点・品質プレミアム・証拠加重NPS・不確実性帯の拡張を提案する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "量（総数）と質（平均）の両方で異なる単位を比較するための単一指標Perf（総数×平均）を提案し、ビジネスデータ向けの拡張を示した。", "p3": "研究評価でPrathapが開発したエクセルギー指標と同じ式を、レビュー数と評価、口座数と価値などの比較に用いる。評価の基準点、1つの質問で較正する品質プレミアム、証拠加重のNet Promoter Score、企業評価のための顧客ベースPerf、不確実性帯を拡張として提案する（抄録）。", "p5": "提案と研究課題の提示であり、実証結果は抄録に記載がない（抄録）。", "fun": "レビューが1,000件で星3.9の商品と、50件で星4.8の商品はどちらが良いか。この論文は「件数×平均」というたった一つの掛け算で比べようと提案する。研究者の評価に使われていた式をそのまま商品や営業担当に転用し、星の基準点や自信の幅まで扱えるよう手を加えている。", "unverified": "提案指標の実データでの検証は抄録に記載がない。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "製造中小企業のデジタル変革と組織レジリエンス", "title": "Digital Transformation and Organizational Resilience in Manufacturing SMEs: The Role of an Innovation-Supportive Mechanism and the Boundary Condition of Organizational Readiness", "url": "https://doi.org/10.2139/ssrn.7611892", "authors": "Nguyen Minh Ha ほか", "venue": "SSRN", "date": "2026-10-14", "why": "動的能力理論に基づき、イノベーション支援機構と組織準備性を境界条件として、デジタル変革と組織レジリエンスの関係を検証する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベトナムの製造業中小企業で、デジタル変革が組織レジリエンスを高める経路がイノベーション文化によって媒介され、その経路が組織準備性の高いときにのみ有意になることを示した。", "p3": "動的能力理論に基づき、イノベーション文化を媒介、組織準備性を調整変数とするモデルを、製造業中小企業の経営者・管理者336人の調査データにPLS-SEMで当てはめる（抄録）。", "p5": "デジタル変革と組織レジリエンスには正の直接関係とイノベーション文化を通じた有意な媒介があり、組織準備性はデジタル変革–イノベーション文化の関係を正に調整した。調整媒介指標は有意で、準備性が高いほど間接効果が強まり、低い準備性では文化の経路が有意でなくなった（抄録）。", "fun": "デジタル化すれば会社は打たれ強くなる、とは限らない。この研究では、デジタル化が「新しいことを試す文化」を育て、その文化が打たれ強さを生むが、受け入れる準備ができていない会社ではその経路が消えてしまう。道具を入れる前に土台を整えないと効かない、という順番の話だ。", "unverified": "係数の大きさと調査時期は抄録にない。"}}, {"id": "pn45", "rank": 45, "field": "環境・気候政策", "headline": "数値気象モデルの相殺誤差をプロセス加算型NNで解きほぐす", "title": "Unmasking Compensating Errors in Numerical Weather Models: A Process-Additive Neural Network Approach", "url": "https://arxiv.org/abs/2610.19772", "authors": "Yuiko Ichikawa ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "異なる物理過程の誤差が互いに打ち消し合う問題に対し、過程ごとの加算型ニューラルネットワークで補償バイアスを分離する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大気モデルで異なる物理過程の誤差が互いに打ち消し合って原因が見えなくなる問題に対し、過程ごとの枝を持つプロセス加算型ニューラルネットワーク（PANN）で誤差を過程別に帰属する枠組みを提案した。", "p3": "単一カラムモデルを用い、PANNの各枝が別々の物理過程に伴う傾向誤差を表し、枝の出力の和が参照傾向に対する全誤差を近似する。訓練後の枝出力が過程レベルの誤差帰属と、平均すれば過程レベルのバイアス推定を与える。OpenIFSの単一カラムモデルの事例で、雲と対流の傾向が強く結合した雲関連過程に焦点を当てる（抄録）。", "p5": "初期実験の段階で、人間の物理過程の解釈を置き換えるのではなく、モデルの複雑さと過程の相互作用で直接診断が難しい領域へ拡張することを狙う。物理的に構造化された機械学習の解釈可能性として、補償誤差の理解と物理的に整合した天気・気候モデルの開発を支える（抄録）。", "fun": "天気予報モデルでは、雲の計算が少し間違っていても対流の計算が逆方向に間違っていれば、合計では合ってしまうことがある。合っているように見えるので直せない。この研究は、ニューラルネットに「雲の枝」「対流の枝」と分担させて、それぞれの誤りを別々に炙り出す。足し算の内訳を分解する発想だ。", "unverified": "帰属の精度を示す数値は抄録にない。"}}, {"id": "pn46", "rank": 46, "field": "環境・気候政策", "headline": "NN深層対流スキームで気候モデルの降水変動性を改善", "title": "Improved Precipitation Variability in the Community Atmosphere Model through Implementation of a Neural-Network Deep Convection Scheme", "url": "https://arxiv.org/abs/2610.20405", "authors": "Xavier J. Levine ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "why": "不確実性の主因である深層対流スキームをデータ駆動のニューラルネットワークに置き換え、物理的整合性を保ちつつ降水変動性を改善する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "気候モデルCAM6の深層対流スキーム（Zhang-McFarlane）を、嵐を解像する全球モデルから学習した全結合ニューラルネットワークに置き換え、10年以上安定に走らせて降水のバイアスを減らした。", "p3": "全球の嵐解像モデルgSAMの出力を粗視化してサブグリッドの対流フラックスと傾向を導き、ネットワークを訓練してCAM6に移植する。放射・乱流・他の雲過程は変えない（抄録）。", "p5": "10年以上安定に走り、エネルギーと水分を保存し、残りのパラメータ化を再調整せずに概ね現実的な気候を再現した。既定のZMスキームに比べ、弱い降水と極端な降水のバイアスが著しく減り、熱帯陸域の降水の日変化が多くの地域で誤った正午のピークから観測どおりの午後遅くのピークに移った（抄録）。", "fun": "気候モデルで最も不確かな「積乱雲をどう扱うか」の部分だけをニューラルネットに入れ替えた。心配されるのは計算が暴走することだが、10年分走っても壊れず、長年直らなかった「熱帯の雨が昼に降りすぎる」癖が観測どおり夕方に直った。全部をAIにするのではなく、一番苦手な部品だけ替える戦略が効いた。", "unverified": "バイアス減少の数値は抄録にない。"}}, {"id": "pn47", "rank": 47, "field": "環境・気候政策", "headline": "炭素ロックインを均衡選択問題として定式化", "title": "Carbon Lock-In as an Equilibrium Selection Problem: Returns to Scale, Returns to Adoption, and the Distribution of Consumer Preferences", "url": "https://doi.org/10.2139/ssrn.7613899", "authors": "Rolan Dahlan ほか", "venue": "SSRN", "date": "2026-10-15", "why": "広く使われながら形式化の薄かった炭素ロックインを、規模の収穫・採用の収穫・消費者選好の分布から均衡選択問題として定式化する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "化石燃料技術が長く居座る「炭素ロックイン」を、供給側の規模の収穫逓増・需要側の採用の収穫逓増・消費者選好の分布が決める均衡選択問題として定式化し、政策の分類を導いた。", "p3": "炭素ベースの既存技術と緑の挑戦者の競争について、簡潔な動的モデルで均衡の構造を調べる。Unruh (2000) の「収穫逓増と採用障壁の引っ張り合い」という本来の機構を扱う（抄録）。", "p5": "両側とも収穫一定なら均衡は一意でロックインは起きない。中程度の収穫逓増では選好が技術間でほぼ中立なときにのみ複数均衡が生じ、選好形成が政策の決定的な余地になる。収穫逓増が強いと市場シェアの軌跡が平らになり、どんな選好分布も3回交わるため多重性は市場の構造的性質となり、歴史が均衡を選び、一時的介入は内部の転換閾値を超えない限り消え、多数派が私的に嫌う高排出均衡に留まりうる。弱い収穫逓増では選好側の手段で足り、強い場合は価格差と採用外部性の両方に閾値を越える協調介入が要る（抄録）。", "fun": "みんなが本当は電気自動車のほうがいいと思っていても、ガソリン車の社会から抜け出せないことがある。理由は「使う人が多いほど便利になる」効果が強すぎると、どちらが好きかに関係なく「先に広まった方」が勝つからだ。好みを変えるキャンペーンだけでは足りず、閾値を越えるまで一気に押す必要がある、という結論は政策の順序を変える。", "unverified": "モデルのパラメータの具体値は抄録にない。"}}, {"id": "pn48", "rank": 48, "field": "環境・気候政策", "headline": "ドイツ住民の炭素足跡の不平等は移動が8割を占める", "title": "Inequality of CO₂ Emissions. Carbon Footprint, Socioeconomic Correlates, and Adoption of E-Technology", "url": "https://doi.org/10.31235/osf.io/td4c3_v1", "authors": "Andreas Diekmann ほか", "venue": "SocArXiv", "date": "2026-10-15", "why": "登録ベース確率標本GLENで個人の炭素足跡を推定し、平均8.6トン、90パーセンタイルは10パーセンタイルの3倍で、不平等の約8割が移動（特に航空）に由来することを示した。", "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ドイツの住民の炭素足跡を登録ベースの確率標本で個人単位に推定し、排出の不平等のほぼ8割が移動（特に航空）に由来することを示した。", "p3": "German Longitudinal Environmental Study（GLEN）の第1波で、住居・移動・食事・消費を個人レベルで測る包括的なモジュールから炭素足跡を推定し、源泉分解で不平等の寄与を分ける（抄録）。", "p5": "排出は強く右に歪み、一人当たり平均8.6トンCO₂換算（公共インフラ込みで9.7）、約3分の2の人が平均未満で、90パーセンタイルの人は10パーセンタイルの3倍排出する。部門別は移動3.6、住居2.2、食事1.6、消費1.2トンで、移動は排出の4割超だが不平等の8割近くを占める。排出は所得（弾力性0.22）と教育で増え、環境意識と緑の党支持は低い足跡と関連し、ヒートポンプ・太陽光・電気自動車の採用は所得とともに増え持ち家層に偏る（抄録）。", "fun": "「平均的なドイツ人」の排出量を聞いても実態は分からない。3人に2人は平均より少なく、少数の人がたくさん出している。その差を生むのはほとんど移動、とりわけ飛行機だった。炭素税を考えるとき、誰が払うことになるかは「何をどれだけ使うか」の分布で決まる、ということがはっきり見える。", "unverified": "標本サイズと調査年は抄録にない。"}}, {"id": "pn49", "rank": 49, "field": "環境・気候政策", "headline": "ナッジと炭素価格：エコラベルへの消費者反応を測る", "title": "Policy Nudges vs. Carbon Pricing: Measuring Consumer Responsiveness to Eco-Labels and Food Sustainability Attributes", "url": "https://doi.org/10.2139/ssrn.7615688", "authors": "Ai Lin", "venue": "SSRN", "date": "2026-10-15", "why": "農業由来排出の削減で、上流の炭素価格とエコラベルなどのナッジに対する消費者の反応性を比較する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "食品の炭素税とエコラベルという2つの政策に対する消費者の反応を誘因整合的な離散選択実験で測り、両者が補完的（超モジュラー）であることを示した。", "p3": "都市・周縁の食品市場で2,480人の成人消費者に37,200の意思決定場面を提示し、スケールと選好の異質性を許す一般化多項ロジット（G-MNL）とWTP空間で導いたランダムパラメータロジットで価格プレミアムとWTPを推定する。知覚された気候リスクと第三者認証機関への信頼を区別する（抄録）。", "p5": "炭素税だけでも価格は炭素集約的な食品から速やかに離れるが、低所得者は逆進的な厚生損失を被る。信号機型のエコラベルは大きな価値プレミアムを生むが、効果は強く非線形で制度依存であり、制度への信頼が薄れると反応は統計的に有意でなくなる。小さな炭素税と信頼できるラベルを組み合わせると、削減弾力性は個々の和を大きく超える（抄録）。", "fun": "食べ物に炭素税をかければ効くが、貧しい人ほど痛い。ラベルで知らせる方法は痛みが少ないが、ラベルを出す機関を信じていない人には効かない。面白いのは、小さな税と信頼できるラベルを組み合わせると、それぞれの効果を足したよりずっと大きく効くという発見だ。1+1が3になる政策の組み合わせがある。", "unverified": "実験の国と地域、WTPの数値は抄録にない。"}}, {"id": "pn50", "rank": 50, "field": "環境・気候政策", "headline": "山火事早期対応の回避排出を評価：FireSatの事例", "title": "Valuing Avoided Emissions from Early Wildfire Attack: A FireSat Case Study in the Permafrost-Rich Boreal", "url": "https://doi.org/10.2139/ssrn.7611362", "authors": "Alejandro López-Aguilar ほか", "venue": "SSRN", "date": "2026-10-14", "why": "放置されがちな北方林の火災に対し、衛星による早期検知と初期攻撃が回避する炭素排出の価値を評価する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "北方林の遠隔地で、衛星による早期検知で山火事を逃げる前に叩くことが回避する炭素排出の価値を、FireSat衛星群を事例として推定し、費用対効果の高い気候介入になりうると示した。", "p3": "NASA ABoVE火災排出データベースの19年分の火災・炭素データに情報価値と費用プラス純価値変化の枠組みを組み合わせ、アラスカとユーコンの永久凍土の多い生態域で、早期検知が回避する排出を炭素の社会的費用で評価する。衛星の資本費用、追加の消火支出、直接の燃焼排出のみを数え、固定投資や火災の生態的便益、永久凍土融解の排出、健康の共便益などは除く（抄録）。", "p5": "この範囲で早期対応は1トンCO₂あたり約2.80〜9.08ドルで排出を回避し、管理の空白をどれだけ埋めるかに応じて便益費用比は20〜66倍になる。中心的な仮定ではどの炭素の社会的費用でも比は1を超え、185ドルではどの火災が逃げるか区別できなくても1を超える（抄録）。", "fun": "人がいない森の火事は「守るものがない」として放置されがちだが、燃えれば大量の二酸化炭素が出る。衛星で早く見つけて小さいうちに消せば、1トン減らすのに数ドルで済むという計算だ。排出を減らす方法としては驚くほど安いが、数えていない費用と便益が多いことも正直に列挙している。", "unverified": "省略した費用・便益の正味の方向は不明と著者自身が述べている。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "廉価GNSSとMEMS加速度計の融合で1mm振動を再捕捉", "title": "Feasibility of recapturing millimeter-level vibrations by fusing mass-market GNSS and MEMS accelerometer", "url": "https://doi.org/10.1007/s10291-026-02161-2", "authors": "Jacek Paziewski ほか", "venue": "GPS Solutions", "date": "2026-10-15", "sjr": 1.451, "citescore": 8.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1},     var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
