26-10-14", "apa": "Muizelaar, H., Haas, M., Vos, R., Vaartjes, I., de Jonge, E., Stergioulas, L., Jong, J. K.-d., & Spruit, M. (2026). Urban Mobility and Population Health in The Hague: A Multi-Scale Analysis. https://doi.org/10.21203/rs.3.rs-11142882/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "携帯電話由来の移動データと集団の健康指標の関係をハーグで調べ、集計した移動量は健康の独立した指標というより、都市の接続性と人口構成の文脈に埋め込まれた指標だと結論した。", "p3": "2019年1〜7月のハーグで、8地域の平均外出距離を移動の指標とし、44の近隣地区で利用できる文脈・健康指標（心血管代謝薬の使用、多剤併用、シンデミックに基づく疾病負荷）と結びつける。残差に基づく調整枠組みで移動と健康を同じ文脈領域で別々にモデル化し、残差の相関を見る（抄録）。", "p5": "地域レベルでは文脈調整後に期待より高い移動が低い疾病負荷と重なった（ρ=−0.26〜−0.48）が、近隣地区との交差スケール分析では相関がかなり弱く（ρ=−0.11〜0.10）、クラスタ・ブートストラップの95%区間はすべてゼロを含んだ（抄録）。", "fun": "「よく動き回る地域は健康」という単純な話は、地図の区切り方を変えると消えてしまう。8つの大きな区域で見ると関係があるように見えるのに、44の小さな地区で見るとほぼゼロになる。スマホの移動データが語っているのは健康そのものより、その街がどうつながっているかだった。", "unverified": "移動データの提供元と人数は抄録にない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "MCMCの収束は有限の診断では証明できない", "title": "MCMC Can See Can't See", "url": "https://arxiv.org/abs/2610.20020", "authors": "Daniel Matsui Smola", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Smola, D. M. (2026). MCMC Can See Can't See (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20020", "why": "どんな有限個の収束診断をすべて通過しても非収束を見逃しうることを不可能性定理として証明し、診断を増やしたときの最悪ケースの減衰率と最適な診断の選び方、残る偏りの任意時刻有効な上界まで与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 証明不可能性、§4.2 遅いモード、§5 逃げ道なし、§8 実験、§9 考察）を読んだ", "preprint": true, "p1": "MCMCの収束を有限個の診断の合格で証明することは原理的に不可能であることを、再生核ヒルベルト空間（RKHS）での埋め込みを使って定理として示し、診断を増やしたときに残りうる最悪の不一致の減り方、最適な診断の選び方（遅い混合モード）、任意時刻で有効な上界まで与えた。", "p2": "「収束診断を通っても収束したとは限らない」は統計の民間伝承だったが、その限界が定量的にどこまで及び、どの診断を使えばよいかは示されていなかった（抄録、§1）。", "p3": "目標分布πと時刻tの連鎖の分布π_tの差をRKHSの平均埋め込みの差δ_tで表し、各診断を方向v_iとの内積と見なす。定理1：どんな有限のチェックリストに対しても、すべての内積が0（診断が全部合格）なのにδ_t≠0であるエルゴード的な連鎖が存在する（§3.1、式3）。見落としを検出する方向はMMDの証人関数δ_t/‖δ_t‖である。定理2.1：ソース条件δ_t=Σ^r uの下で、最適なm個の診断（共分散作用素Σの上位固有方向）を満たしても残る最悪の不一致はRλ_{m+1}^rで、固有値が多項式的に減るならΘ(Rm^{−αr})（§3.2）。定理4：可逆なサンプラーでは、遷移作用素の最も遅いm個のモードを埋め込んだ方向が、十分遅い時刻で最適な診断に漸近する（§4.2、式10–11）。", "p4": "良さの基準は、監視されていない成分‖P_{V⊥}δ_t‖の大きさ。複数の連鎖を走らせても共有の不一致は見えない（式13）、非線形の診断もvon Mises展開で有限個のモーメント比較に帰着する、標本を増やしても推定誤差が減るだけで定理1の不可能性は残る、と3つの逃げ道を順に閉じる（§5）。実験は合成の円と5つの実データの回帰事後分布で、診断を200個まで増やしたときの残差、最適方向と遅いモードの角度、任意時刻上界の被覆を確かめる（§8、図2）。", "p5": "診断を増やすと未監視の不一致は減り、最悪ケースの残差を下回って、合成の円では漸近的にm^{−1}で減る（図2A）。最適な診断の張る空間は標本が進むにつれ遅いモードの空間に近づき、角度は理論の上界以下（図2B）。任意時刻上界は、共分散が与えられればサンプラーの情報で引き締まるが、共分散を推定するとその不確実性が利得を消しうる（図2C、表3）。", "p6": "著者は、有用な上界には「チェックリストが測らない不一致」についての証拠（正当化されたソース類）が要るが、チェックリストの合格ではその類を検証できないこと、一領域に限ったパイロット実行では別領域に関わる遅いモードが見えないこと、共分散推定の不確実性が小さな不一致でも上界を支配しうることを課題として挙げる（§9）。解釈：この結果は診断を無意味とするのではなく、「合格＝収束」ではなく「監視した方向では不一致がない」と読むべきだと再定義するものである。", "fun": "コンピュータでランダムに点を打って確率を計算する手法（MCMC）では、「もう十分に混ざったか」を調べる検査を何種類も使う。この論文は、どんなに検査を増やしても、全部合格なのに実はまだ混ざっていない例が必ず作れることを証明した。鏡を何枚置いても死角が残るようなものだ。ただし救いもあり、「一番ゆっくり動く方向」を見張れば、見逃しは最小に近くなる。", "unverified": "表3の数値と5つの実データセットの名称は読み切れておらず未確認。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "ランダム特徴バイグラムモデルの厳密なスケーリング則", "title": "Exact Scaling Laws for a Random-Features Bigram Model", "url": "https://arxiv.org/abs/2610.19281", "authors": "Julian Enoch ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Enoch, J., & Dohmatob, E. (2026). Exact Scaling Laws for a Random-Features Bigram Model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19281", "why": "Zipf則に従うトークン統計と固定ランダム埋め込みのボトルネックをもつ玩具モデルで、幅・語彙サイズ・Zipf指数の関数として予測後悔のスケーリング則を厳密に導き、実データの曲線と一致させた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§1.1 貢献、§2.2 容量制約モデル、§3 主要結果、§4 実証、§5 結論）を読んだ", "preprint": true, "p1": "Zipf則に従う語彙と固定ランダム埋め込みによる幅Nのボトルネックを持つバイグラム（2語連鎖）モデルについて、予測の後悔（regret）がモデル幅・語彙サイズ・標本数・Zipf指数の関数としてどう減るかの厳密なスケーリング則を導き、WikiText-2とOpenWebText2で曲線が一致することを示した。", "p2": "ニューラルスケーリング則は実務上重要だが第一原理の説明は単純な設定でも限られており、既存の理論（Kunstner and Bach, 2025）は最適化のステップ数による説明で、表現容量による説明を切り離していなかった（§1、§1.1）。無制約バイグラムはd²の学習パラメータを持ち、大語彙では非現実的（§2.2）。", "p3": "重み行列をW=ΩΘ（Ωはd×Nの固定ランダム埋め込み、Θは学習するN×d）と分解して学習パラメータをNdに減らす（式5–6）。経験的最適解に対する正規化後悔 r_{n,d}(N) を解析する（式7）。命題1：語彙の出現回数cを条件づけると、後悔は偏り B=ANν と分散 V=(1−A)(S−N)₊/n に分解され、νは固定点方程式 N=Σ p̂_k/(p̂_k+ν) の唯一の正解（式10–11）。Sは観測された語彙数で、N≥Sなら両項とも消える（厳密補間）。定理2：n≫d^α H_{d,α}のとき、Zipf指数αが1未満（サブ臨界）・1（臨界）・1超（超臨界）で偏りの形が変わり、超臨界ではB≃C_α N^{−(α−1)}でCabannes et al. (2024) の連想記憶の則を回復する（§3.3、式13–18）。N=γd^βの正準スケーリングでβ<1とβ=1の体制を分ける（§3.4）。", "p4": "良さの基準は、理論曲線と、固定ランダム射影で階数Nに制限した線形バイグラムを収束まで最適化した経験的な正規化後悔の一致。データは合成Zipfデータ、WikiText-2、OpenWebText2で、Zipf指数は対数–対数回帰で推定する（§4.1–4.2、表1）。", "p5": "WikiText-2（d=10³, n=10⁵とd=10⁴, n=10⁶）でγとβを振った曲線は定理2の予測と「excellent match」し、線形体制β=1ではγ=1で後悔がゼロに達し、サブ線形β<1では非ゼロの下限が残る（図1、§4.3）。OpenWebText2でもウェブ規模の雑音にもかかわらず予測は正確で、β=1でγを上げると後悔は急減し、β<1では曲線が平らになって分散支配（d/nの有限標本項）に移る（図2）。", "p6": "著者は、固定ランダム埋め込みを学習表現に置き換えること、高次の文脈依存や異質な遷移分布への拡張を今後の課題とする（§5）。解釈：この結果は「幅を増やすこと」と「語彙を増やして問題自体を大きくすること」を区別して扱う点に価値があり、臨界指数α=1付近で語彙依存の正規化が効くという指摘は、自然言語（表1でα<1）に近い体制でKaplan et al. (2020) の経験則と整合する形を与える。", "fun": "言語モデルを大きくすると性能が滑らかに上がる「スケーリング則」は、実験で見つかった法則で理由はよく分かっていない。この研究は、前の単語から次の単語を当てるだけの最小のモデルに「単語の使われ方は少数の単語に偏る（Zipfの法則）」という性質を入れ、紙と鉛筆で誤差の減り方を導いた。すると本物の英語テキストでの実験曲線とぴたりと重なった。複雑なAIの謎の一部が、単純なおもちゃで再現できる。", "unverified": "表1のZipf指数の具体値と図1・図2の軸の数値は読み切れておらず未確認。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "自己回帰的操作変数をもつ短パネルの動的因果効果を無作為化推論", "title": "Randomization Inference for Dynamic Causal Effects in Short Panels with Autoregressive Instruments", "url": "https://arxiv.org/abs/2610.19075", "authors": "Pedro Picchetti", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Picchetti, P. (2026). Randomization Inference for Dynamic Causal Effects in Short Panels with Autoregressive Instruments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19075", "why": "操作変数の割当が未知の持続性をもつAR(1)の革新を通じてのみ無作為である短パネルで、持続性を推定せずに有限標本で水準を保つ無作為化検定を構成した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2.2 割当機構、§3 推定対象、§4.1–4.2 無作為化推論、§5 モンテカルロ、§6 応用、§7 結論）を読んだ", "preprint": true, "p1": "多数の個体と少数の期間からなるパネルで、操作変数がAR(1)の革新を通じてのみ無作為であるとき、未知の持続性ρを推定せずに、候補値ごとに革新を復元して再無作為化し、p値の上限をとる検定を提案し、有限標本で正確な水準（単位根を含む）を保つことを示した。", "p2": "持続性ρは2重の撹乱パラメータで、局所射影の推定対象がどの因果効果の加重平均になるかを決め（命題1–2）、操作変数から作るどんな統計量の無作為化分布も支配する。命題1：系列相関のある操作変数の下でLP-IV推定対象は、水平hの効果の凸結合と、他の水平の効果の線形結合の和になり、後者の係数は操作変数の自己相関に依存する（式2）。革新で置き換えても将来の処置を通じた項は残り（命題2、式3）、ρ_0がなければ解釈できない（§3）。", "p3": "Z_{i,t}=ρ_0 Z_{i,t−1}+ε_{i,t}で、革新εは過去と潜在量に対し平均独立（仮定5）。候補ρごとにε(ρ)=Z_t−ρZ_{t−1}を作り、期間内で個体を並べ替える群（横断群）など革新の同時分布を不変に保つ群で再無作為化する。鋭い帰無仮説（共通の線形インパルス応答b）の下で調整済み結果W(b)は非確率的になり（式4）、統計量S(ρ;U)（式5、各水平のスチューデント化した相関の最大）の無作為化p値p_M(ρ)を計算し、報告するp値は全候補にわたる上限p^sup、またはρの正確な信頼集合C_{1−γ}上の上限にγを足したBerger–Boos型p^BB（式6）。Wald統計量は第1段階が未知のため再無作為化できず、縮約形統計量で弱い第1段階にも頑健（§4.2）。", "p4": "良さの基準は、鋭い帰無の下で任意のρ（単位根を含む）に対し有限標本で水準α以下であること、弱い帰無（異質性で重み付けた推定対象）の下でスチューデント化版が一様に漸近有効であること。モンテカルロは個体効果を持つ短パネル（N=150または500、400反復）で、オラクルp_M(ρ)、p^sup、p^BB、Nickell偏りを持つ個体内推定量ρ̂を使うARとWaldの棄却率を比較する（§5、表1）。", "p5": "応用はAssunção et al. (2023) のブラジル・アマゾンの衛星監視（DETER）と罰金による法執行の森林減少への効果で、雲の被覆を操作変数とする。公表の係数−0.050（SE 0.024）、再現の2SLSは−0.050（0.027）、Han–Phillipsのρ̂=0.33（0.03）でのフィルタ済みLP-IVは−0.036（0.015）。p^BBはθ_0=0を棄却（0.014）し95%集合は[−0.069, −0.019]、プラグインWald区間[−0.065, −0.007]もゼロを除くが、全グリッドの上限p^supは0.35で棄却しない（表3）。水平1でも棄却され、2年前までの罰金の動的効果を示唆し、より長い水平では有意でない（図2、§6）。", "p6": "表1の数値は読み切れていない。p^supはρの全範囲で最悪ケースをとるため保守的で、応用では棄却できず、ρの信頼集合を使うp^BBで初めて棄却できる点は、手法の検出力がρの情報に依存することを示す。解釈：固定効果を含む応用では操作変数の個体内変換が初期条件のためにρ^t Z_{i,0}の形で期間とともに変わり無害でない（注1）という指摘は、短パネルのLP-IVの実務に直接関わる。", "fun": "「去年の罰金が今年の森林伐採を減らしたか」を調べるとき、罰金の量を外から動かす「雲の量」を使う。問題は、雲の量が毎年どれだけ引きずるか（持続性）が分からず、それを推定すると検定が狂うことだ。この論文は持続性を「推定しない」。考えうるすべての値で検定をやり直し、一番厳しい結果を報告する。推定を諦めることで正しさを買う、という逆転の発想だ。", "unverified": "表1（モンテカルロの棄却率）の数値は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "生成AI導入産業で若年高技能労働者は代替から守られない", "title": "Amdahl at Work", "url": "https://doi.org/10.2139/ssrn.7613578", "authors": "Benjamin Verschuere ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Verschuere, B., & Cameron, A. (2026). Amdahl at Work. https://doi.org/10.2139/ssrn.7613578", "why": "CPSの1,230万人月で、生成AIは低技能タスクを年齢を問わず代替し、高技能職では35〜49歳が守られる一方22〜25歳は守られないことを示し、仕事内のAmdahlの法則として説明した。", "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国のCPS（人口動態調査）1,230万人月で、生成AIを導入した産業では低技能タスクが年齢を問わず代替される一方、高技能の仕事では35〜49歳が代替から守られ22〜25歳は守られないことを示し、その機構を仕事内のAmdahlの法則として説明した。", "p2": "生成AIの産業横断的な普及で、労働市場の調整の影響を誰が受けるかが問われている（抄録）。背景：Amdahlの法則は並列化で高速化できる部分を加速しても、できない部分が全体の速さを縛るという計算機科学の法則である。", "p3": "2015〜2026年のCPSデータに、Verschuere and Cameron (2026) のタスクベースの「コード化可能な代替」の分解を適用し、生成AIを導入した産業の部分集合と23産業の全パネルで、タスクの位置・学歴・職業賃金別に代替への露出を調べる。低AI産業をプラセボとして2024〜26年の一般的な雇用動向を除く（抄録）。", "p4": "良さの基準は、年齢差が生成AI導入産業にのみ現れ、低AI産業のプラセボでは現れないこと（抄録）。", "p5": "低技能タスクの代替は年齢に関係なく起き、高技能の仕事では年齢と学歴が35〜49歳の労働者を代替から守るが、同じ職位の22〜25歳は守られない。年齢による保護の勾配はタスク位置・学歴・職業賃金を通じて現れ、タスク階層内では判断の要素が大きい職業に集中する。低AI産業のプラセボでは年齢差はなかった（抄録）。", "p6": "抄録からは、効果の大きさや「代替への露出」の定義、生成AIを導入した産業の特定方法は読み取れない。解釈：「補完の割合が縛る」という機構は、AIが代替できる部分を加速するほど、経験や判断という代替できない部分の価値が相対的に上がることを意味するが、若年層がなぜその部分を持てないかは抄録からは分からない。", "fun": "AIが仕事を奪うなら、誰から奪うのか。この研究の答えは「単純作業は年齢に関係なく、難しい仕事では若い人から」だ。同じ職位でも、経験を積んだ35〜49歳は「判断」という代替しにくい部分を持っているので守られ、22〜25歳はそれを持っていない。コンピュータの並列計算の法則（速くできる部分を速くしても、できない部分がボトルネックになる）が、仕事の中でも起きている。", "unverified": "効果の大きさと代替露出の測り方は抄録にない。"}}, {"id": "pn05", "rank": 5, "field": "機械学習（Hugging Face）", "headline": "世界状態中心の枠組みで長編エージェント動画を生成", "title": "Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation", "url": "https://arxiv.org/abs/2610.20571", "authors": "Weijie Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "apa": "Wang, W., Zhang, H., Li, Y., Liu, A., Zhang, Z., Zhao, H., He, Y., Chen, D. Y., Chen, F., & Zhuang, B. (2026). Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20571", "why": "脚本を場所・カメラ・事象時刻つきのショット要求に変換し、シーン記憶と事象記憶から証拠を取り出してから生成するATASが、4つの生成器すべてでショット間の一貫性を改善した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（Method、Experimental Setup、Main Results、Ablation、表4–5）を読んだ", "preprint": true, "p1": "脚本から長編の動画を生成するとき、場所・カメラ・事象時刻を明示したショット要求にコンパイルし、登録済みの静的形状（シーン記憶）と時刻付きの動的観測（イベント記憶）から証拠を取り出してから生成し、検証を通った観測だけで記憶を更新するATASで、4つの動画生成器すべてでショット間の一貫性を改善した。", "p2": "プロンプトや直前のフレームをショット間で受け渡すだけでは、以前の場所に戻るための共有の空間座標や、以前の事象を再演するための時刻付きの記録が得られない（抄録、Introduction）。", "p3": "世界状態W_t=(S_t, E_t)はシーン記憶（受理した静的点群）とイベント記憶（シーン・事象・時刻で索引づけた動的観測）の対（式1）。脚本uを再帰的に分割して、説明・シーン・空間アンカー・カメラ・時間区間・任意の事象IDからなる要求q_{t,k}（式3）の列にする。生成前にシーン記憶を要求カメラでレンダリングし（式5）、事象参照があればイベント記憶から取得して（式7）、文脈依存プロンプトとして生成器Gに渡す（式8）。生成後に再構成・登録し、フィルム審査f_t、登録r_t、状態更新チェックa_tの3つがすべて1のときだけ状態を更新する（式9–11）。フィルムの納品と状態への採用は独立で、登録に失敗したクリップも作品には残る。", "p4": "VBench、ST-Bench（C-All・C-Top10によるショット間一貫性）、ViStory-Self/Crossで、同じ生成器・プロンプト・時間予算の下でI2V Extension、VGoT、Mora、MovieAgent、ReCAと比較する。空間的な再訪は共通可視マスク下のPSNR_C・SSIM_C・LPIPS_Cで目標画像と比べ、事象の再演はソース接地のVLM審判で事象の同一性・行動と状態・時間順序・人物と物の一貫性・視点の実現を採点する。人間評価は6手法を6基準の5段階で比べる（Experimental Setup）。", "p5": "MiniMax-H3、Wan 3.0、HappyHorse 1.0で報告された集計指標すべてで首位、Wan 2.7ではVBenchで劣るがST-BenchとViStoryでは首位（表1）。空間再訪はPSNR_C 15.968、SSIM_C 0.385、LPIPS_C 0.284で比較手法を上回り（表2）、事象再演では同一性0.750、時間順序0.688、視点0.650で首位、人物と物の一貫性はReCAと同点0.917、行動と状態は0.688対0.700でやや劣る（表3）。人間評価は脚本忠実度4.40、人物一貫性4.22、視覚的魅力4.10が高く、背景一貫性3.62と物語の一貫性3.77は低い（図5）。記憶によりショットあたりの再試行は1.00から0.54に減り再試行込みの納品時間は359秒から339秒に縮むが、ストーリーあたりの実行時間は51.9分から64.9分に増える（図6）。アブレーションではC-Top10が0.536→0.719、事象スコアが0.452→0.739、LPIPS_Cが0.341→0.284（表5）。", "p6": "残る難しさは要求した事象や視点の取り出しではなく、行動と状態の正確な再現である（Main Results）。利点は再試行の減少であり総計算量の削減ではない。記憶の採用判定が厳しいため、採用されないクリップは後続の証拠にならないという設計上の制約がある。解釈：背景一貫性と物語の一貫性の人間評価が低い点は、シーン単位の記憶が「環境全体」や「筋」のレベルの整合性までは保証しないことを示す。", "fun": "AIに映画を作らせると、登場人物が同じ部屋に戻ってきたときに家具の配置が変わっていたり、さっき起きた出来事をもう一度映すと別の出来事になったりする。この研究は、映画の世界を「地図（どこに何があるか）」と「日記（いつ何が起きたか）」の2冊の記憶として持ち、撮る前に必ず見返す仕組みを作った。しかも記憶に書き込む前に「本当に辻褄が合うか」を検査して、合わないものは作品には残しても記憶には入れない。", "unverified": "表1〜3の他手法の具体的な数値は読み切れておらず未確認。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "テキスト共変量のモデル不確実性をSSGAMで扱う", "title": "Which Text Matters: Handling Model Uncertainty in Text-as-Data Regressions, with an Application to Central Bank Communication", "url": "https://arxiv.org/abs/2610.19720", "authors": "Martin Feldkircher ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Feldkircher, M., Prostmaier, B., Hofmarcher, P., & Siklos, P. (2026). Which Text Matters: Handling Model Uncertainty in Text-as-Data Regressions, with an Application to Central Bank Communication (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19720", "why": "テキストから作った共変量のどれをどの関数形で入れるかをモデル不確実性と捉え、スパイク・スラブ一般化加法モデルで変数選択と非線形性の判定を同時に行い、ECB記者会見45指標に適用した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 SSGAM、§4.2–4.3 データと仕様、§5 結果、§5.1–5.2、§6 実践への含意、§7 結論）を読んだ", "preprint": true, "p1": "テキストから作った共変量のどれを、線形か非線形かどの関数形で回帰に入れるかを「モデル不確実性」として扱い、スパイク・スラブ一般化加法モデル（SSGAM）で変数選択と関数形の選択を一つの事後分布で同時に行う方法を提案し、ECB記者会見のテキスト指標45本のうち2本だけが専門家のインフレ期待を追跡し、非線形効果はどれも支持されないことを示した。", "p2": "テキストを話題シェア・理想点・センチメントなどの共変量に変換して回帰に入れる2段階設計は便利だが、どの指標を構築し含めるかを理論が教えてくれず、同じ構成概念の競合する操作化が異なる結論を支えうる（抄録、§2）。", "p3": "加法モデル y_i=α+Σ_k f_k(x_ik)+ε_i（式1）で、各平滑関数をペナルティ付きB-スプラインで表し、Scheipl et al. (2012) に従って厳密に線形な部分x_kβ_kと直交する非線形の偏差Z_kθ_kに分解する（式2–3）。線形部と非線形部が別々の包含指標を持つため、各共変量について除外・線形包含・非線形包含の3つの体制を事後分布が区別する（§3.1）。選択はpeNMIG事前分布で、ブロック分散τ²_kにスパイク（v_0=2.5×10⁻⁴）とスラブ（IG(5,25)）の混合、包含確率wはBeta(1,1)で事前の包含率は50%（式4、§3.2）。事後要約は周辺の事後包含確率（PIP）と項の重要度（§3.3）。", "p4": "データは2002年12月〜2025年6月の224回分のECB金融政策記者会見の書き起こしと、Consensus Economicsの1年先CPIインフレ予測（1か月先行の基準仕様）。45のテキスト指標すべてを線形項と非線形平滑項で、総裁と危機の指標を因子項で入れ、連続共変量は1・99パーセンタイルでウィンザー化する。候補にマクロ変数は含めず、撹乱項は独立と扱うため、PIPは正確な誤り率を持つ検定ではなく系統的な共変動の記述的な尺度と読む（§4.2–4.3）。", "p5": "予測水準に対して包含閾値0.5を超えたのは、Picault–Renaultの金融政策スコア（PIP=0.841、事後オッズ5.3）とSyuzhetのセンチメントスコア（PIP=0.660、事後オッズ1.9）の2本だけで、ともに台本の導入声明から計算され線形に入る。予測の分散（意見の不一致）に対してはどの指標も閾値を超えず、非線形効果はどれも支持されない（§5、§5.1）。タカ派的な導入声明ほど専門家のインフレ期待は高く、楽観的な言葉ほど低い。単一指標の設計ではLoughran–McDonaldやFinBERTが2変量では有意（−0.799、−0.967）でも統制を入れると消え（−0.134、0.268）、結論が辞書の選び方で逆転する（表2、§5.2）。", "p6": "著者は、因果識別は与えないこと、時系列の撹乱を独立と扱っており系列相関の拡張が自然な次の一歩であること、事前包含確率（0.5）への感度を調べるべきことを限界に挙げる（§6）。解釈：「選ばれなかったものを事前分布と対照して報告する」という第3の教訓は、PIPが0.5付近なら「更新なし」であり中程度の証拠ではないという読みを含み、ファイルドロワー問題への対処として具体的である。", "fun": "中央銀行総裁の記者会見の「言葉の調子」を数値化する方法は何十通りもあり、どれを使うかで「言葉は市場を動かす」とも「動かさない」とも言えてしまう。この研究は45通り全部を同時にモデルに入れて、データに選ばせた。生き残ったのはたった2つで、しかも「直線的な関係」だけ。よく使われる辞書のいくつかは何の情報も足していなかった。選ぶ前に全部見せる、という潔い手続きだ。", "unverified": "表1のPIPと係数の全項目は読み切れておらず未確認。"}}, {"id": "pn07", "rank": 7, "field": "統計学", "headline": "不良設定逆問題の汎関数の局所推論の限界", "title": "On Local Inference for Functionals of Ill-Posed Inverse Problems", "url": "https://arxiv.org/abs/2610.19350", "authors": "Ellen Graham ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Graham, E., & Rotnitzky, A. (2026). On Local Inference for Functionals of Ill-Posed Inverse Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19350", "why": "ノンパラメトリック操作変数や近接因果推論の汎関数は、点ごとにルートn推論できても局所一様には不可能になりうることを示し、ソース条件などで回復する体制を整理した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§1 序論、§7 反例とシミュレーション、§8 考察）を読んだ。§3–6の定理の本体と証明は読み切れていない", "preprint": true, "p1": "ノンパラメトリック操作変数（NPIV）・近接因果推論・影変数モデルに現れる「不良設定逆問題の解の連続線形汎関数」について、点ごとのルートn推論が可能でも局所一様な推論は不可能になりうることを示し、Hellinger連続性と経路微分可能性が回復する条件（最小ノルム解の一様な有界性と一意性、β-ソース条件）を整理して、線形IVの弱い・強い操作変数の体制と対応づけた。", "p2": "これらの汎関数の推定には、不良設定解の1次誤差に鈍感なNeyman直交推定方程式でルートn漸近線形推定量が得られる。しかし固定した法P_0での点ごとの保証は、標本数nで区別できないほど近い法P_nでの挙動を保証しない。Hellinger距離で小さく動かしただけで目標が大きく変わるなら、どんな推論手続きも近傍で一様には機能せず、局所的に正直な信頼区間の期待直径は無限大になる（§1）。", "p3": "目標φ(P)の安定性を、(i) Hellinger連続性、(ii) 2乗平均微分可能（QMD）な部分モデルに沿った経路微分可能性の2段階で検討する。基準モデル（Neyman直交推定方程式の存在に十分な最小条件）では、両方の逆問題が不良設定のとき（X, Zが連続なら典型的）φはHellinger不連続で、最大接空間は局所ノンパラメトリックモデルと等しい。一方の最小ノルム解に一様なノルム上界を課すと連続性は回復するが、両逆問題が不良設定でP_0において解が一意でなければ経路微分可能性は失敗し、すべての漸近線形推定量はある局所対立仮説の下で消えないルートn偏りを持ちWald区間は被覆不足になる。解が一意なら、または解のβ-ソース表現子の一様ノルム上界（β>0）の下では、一意性に関わらず経路微分可能性が回復する（§1、§8）。", "p4": "反例は W, X, Z が{1,2,3}を取る有限離散のNPIVで、条件付き期待作用素を3×3行列として、P_0に至る経路に沿って目標が無限大に発散する構成（例5、§7）と、ノルム上界のあるモデル内に留まる別の経路を与え、選んだ局所対立の下でノンパラメトリック推定量の挙動を見る。経路微分可能性の失敗の証明では、作用素の特異値の一つがルートnの速さで0に向かう部分モデルを構成し、これを線形IVの弱い操作変数の漸近論（Staiger and Stock, 1997）と結びつける（§1、§5）。", "p5": "主要な結論は、基準モデルでは局所一様な推論が有限標本でも不可能で、どんなnでもHellinger近傍で一様に有限の精度を達成する推定量はなく、名目被覆を局所一様に保つ信頼区間は期待直径が無限大になること。ノルム上界の下では連続性が戻るが、解が非一意なら漸近線形推定量は不正則で、§7のシミュレーションでは影響関数から作ったWald区間が局所対立の下で「潜在的にかなり深刻に」被覆不足になる（§8）。基準モデルの結果は無制約の線形IVの不可能性（Gleser and Hwang, 1987; Dufour, 1997）に、ノルム上界で非一意の場合は弱い操作変数の枠組みに、β-ソース条件は強い操作変数の仮定に対応する（§8）。", "p6": "著者は、一様なノルム上界が得られるかは実質的な問題次第で、影変数モデルでは密度比の有界性（重なりの条件）から、正しく定式化された加法NPIVでは反事実結果の有界性から従うが、除外制約が少しでも破れると正当化できず、近接因果推論では未解決と述べる。β-ソース表現子の一様上界を導く実質的な仮定は知られていない（§8）。§7のシミュレーションの数値は読めていない。", "fun": "「この推定法は標本が増えればちゃんと正解に近づく」という証明があっても、現実のデータが「正解の世界」からほんの少しずれているだけで、推定も信頼区間も壊れることがある。この論文は、操作変数を使って因果を測る高度な手法群で、まさにその壊れ方が起きうることを数学的に示した。しかも壊れる条件は、昔から知られていた「弱い操作変数」の問題の、より一般的な姿だった。古い問題が新しい衣装で戻ってくる。", "unverified": "§3–6の定理の正確な条件と§7のシミュレーションの数値は未確認。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "文脈内学習はコピーから合成へ発達する", "title": "From Copying to Composition: How Language Models Develop In-Context Learning", "url": "https://arxiv.org/abs/2610.19113", "authors": "Minglai Yang ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Yang, M., Guo, X., Wang, R., Hou, S., Zhang, D. Y., & He, Y. (2026). From Copying to Composition: How Language Models Develop In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19113", "why": "近くの例をコピーするか文脈全体の規則を合成するかを分ける診断を17モデルに適用し、学習の途中で規則優先が精度向上より先に現れることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 課題と測定、§4–6 結果、§7–8 考察・結論、Limitations）を読んだ", "preprint": true, "p1": "「近くの例をコピーする」か「プロンプトで定義された規則を合成する」かを分ける診断課題で17モデルを調べ、文脈内学習（ICL）が単一の能力ではなく、プロンプトのどの手がかりが答えを制御するかの切り替え→候補の選好の反転→候補なしの生成→転移という別々の時間割で発達することを示し、合成文書での「練習」だけが制御を反転させることを訓練実験で示した。", "p2": "ICLはプロンプトの指示と例示からモデルの振る舞いを変えるが、正答率だけでは文脈の情報がどう予測を制御しているかが分からない（抄録、§1）。", "p3": "各プロンプトは4つの特徴値に新しい語尾を割り当て、4通りの組合せのうち3つを示し、新しい語幹で欠けた組合せを問う。規則どおりならf_φ(s,u,v)=s‖φ(u)‖φ(v)（式1）、最も近い例をコピーすると別の語尾になる（式2）。両候補の対数確率差m=log p_r−log p_cとP(copy)=σ(−m)で競合を測る（式3）。答えの位置から「最も近い例の衝突する語尾」と「要求された値」への注意をブロックし、どちらを遮ると答えが動くかの差D_τで制御の所在を測り（式4）、チェックポイント間でDが正から負に変わる区間を「制御の切り替え」と定義する。活性化パッチで要求値の表現を別のプロンプトのものに置き換える検査も行う（§3）。", "p4": "17モデル（Pythia、OLMo、Qwen、Gemma）の最終版と、公開された訓練途中のチェックポイント（OLMo-2-7Bなど16系列）、SmolLM2-360M/1.7Bでの継続事前学習、5つの7〜8BベースへのLoRA、Pythia-1.4Bの直接微調整で検証する。良さの基準はP(copy)、4択精度、候補なしの厳密生成、ブロック効果の差D、保持課題への転移（§3、§6）。", "p5": "17モデルのうち6つはコピー候補に0.70以上、8つは0.30以下の確率を与え、分かれ方はサイズでは説明できない（Pythia-12Bはコピーし、Qwen3-1.7BとGemma-3-4Bは合成する）（図2）。高コピー群では近い語尾のブロック効果が要求値の約2倍、低コピー群では逆に要求値の効果が数倍（図3）。OLMo-2-7Bでは制御の切り替えが336B〜630Bトークンで起き、4択精度が偶然を超えるのは約1.5T（再テストで1.8T）、厳密生成は約3.6Tトークンと順に遅れる（図6、表1）。継続事前学習の3%を合成文書に置き換えると、SmolLM2-1.7Bは50MトークンでP(copy)が0.82からほぼ0に落ち厳密生成が0.56に上がり、最終的にほぼ上限に達する一方、定義を含む自然文の通読やコピー寄りヘッドへのペナルティでは変わらない（図7、図15–16、§6.1–6.2）。欠けた組合せを一度も練習しない「全提示」条件でも同じ切り替えが起きる。定義演習の微調整は、でっち上げたラベルでの分類精度をTRECで17.6、DBpediaで17.2、Yahooで3.7ポイント上げるが、形態論の診断は動かさない（図1c、§6.3）。", "p6": "著者は、診断が単一の制御課題であること、訓練実験が8Bまでで合成文書が診断と同形式のため転移は形式に縛られること、選んだ注意ヘッドは振る舞いの一部しか担わず局所化はプロンプト範囲への介入に依存することを限界に挙げる（Limitations）。解釈：「正答率は4つの出来事を1つに圧縮している」（図9）という主張は、誤答のチェックポイントでも制御が切り替わっていれば実質的な移行であり、4択で正解しても生成できなければ構成の証拠にならない、という評価設計の指針になる。", "fun": "AIに「big=wug、many=or、one=um」のような作りたての規則を見せて、まだ見せていない組合せを答えさせると、賢そうなモデルでも「一番似ている例をそのまま写す」ことがある。面白いのは訓練の記録を追うと、正解できるようになるずっと前に、モデルの「注目先」が例のコピーから規則へ切り替わっている点だ。正解率という一つの数字の裏で、4つの出来事が別々の時期に起きていた。しかも、規則を「読む」だけでは直らず、「使う練習」をしたときだけ変わる。", "unverified": "表1・表6の各系列の切り替え時点の数値は読み切れておらず未確認。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "出産前後の労働市場フローで子供ペナルティを分解", "title": "Labour Market Flows and the Child Penalty: Evidence from Spanish Administrative Records", "url": "https://doi.org/10.2139/ssrn.7590006", "authors": "Amaia Ayala-García ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Ayala-García, A., Lado, S., Silva, J. I., & Serra, L. (2026). Labour Market Flows and the Child Penalty: Evidence from Spanish Administrative Records. https://doi.org/10.2139/ssrn.7590006", "why": "スペインの行政記録で母親79,515人・父親129,669人の月次状態遷移を時変マルコフ連鎖でモデル化し、動的シャープレイ値で性差の7割が常勤への「入職」の差に由来することを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "スペインの行政記録で、第1子出産前後10年の労働市場の状態遷移を時変マルコフ連鎖でモデル化し、動的シャープレイ値で性別格差を20種の遷移に分解して、常勤雇用への「入職」の差が中長期の常勤格差の約3分の2を占めることを示した。", "p2": "出産をめぐって開く男女の格差（子供ペナルティ）がどの労働市場フローから生じるのかは、状態の分布だけを見ても分からない（抄録）。", "p3": "母親79,515人、父親129,669人の月次行政記録で、個人を行政的に定義された5つの状態に分類し、その移動を時変マルコフ連鎖でモデル化する。状態のシェアは月次フローの全履歴から生成されるので、各イベント月の性別格差を初期分布と20種の遷移タイプの寄与に動的シャープレイ値で分解する（抄録）。", "p4": "良さの基準は、観測された常勤雇用の性別格差が、入職と離職のどの遷移の寄与として説明されるかの分解の整合性（抄録）。", "p5": "行政的な未加入・失業・パートタイムから常勤への入職の性別差が、中期で67%、長期で68%の常勤格差を説明し、常勤からの離職は30%と23%に留まる。出産は受胎前からすでに存在する非対称を増幅する（抄録）。", "p6": "抄録からは5つの状態の定義、中期・長期の具体的な期間、スペイン以外への一般化可能性は読み取れない。解釈：「出産後に辞める」より「出産後に常勤に戻れない」ことが格差の主因だという結果は、復職支援の設計に含意を持つが、本稿の政策的議論は抄録にない。", "fun": "「子どもが生まれると母親は仕事を辞める」が男女格差の原因だと思われがちだが、スペインの約21万人の記録を月ごとに追うと、格差の3分の2は「辞めること」ではなく「常勤の仕事に入れないこと」から生じていた。しかも差は妊娠前からすでにあり、出産はそれを大きくしただけだった。格差を「出口」ではなく「入口」で見ると、対策の方向が変わる。", "unverified": "5状態の定義と期間の区切りは抄録にない。"}}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "欠測データでの因果探索の識別可能性を一般化", "title": "Generalizing Identifiability Results in Causal Discovery from Complete Data to Missing Data Settings", "url": "https://arxiv.org/abs/2610.19211", "authors": "Matteo Ceriscioli ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Ceriscioli, M., Shimizu, S., Gupta, M., & Mohan, K. (2026). Generalizing Identifiability Results in Causal Discovery from Complete Data to Missing Data Settings (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19211", "why": "MNARを含む欠測機構の下でも因果グラフが識別可能になる一般的十分条件を与え、完全データ用アルゴリズムの正しさを欠測設定へ拡張する枠組みと2つの漸近的に正しいアルゴリズムを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 欠測下の識別可能性、§4 アルゴリズム、§5 実験、§6 関連研究、§7 結論）を読んだ", "preprint": true, "p1": "完全データで識別可能な因果グラフが、MNARを含む欠測の下でも識別可能なままでいる一般的な十分条件を「回復可能性」の問題として定式化し、その条件に基づいてLiNGAMとRESITを欠測データ用に拡張したm-LiNGAMとm-RESITを提案して漸近的な正しさを示した。", "p2": "完全データの因果探索は成熟したが、欠測値を扱うアルゴリズムは限られ、特にMNAR（欠測がそれ自体に依存する）の場合の保証が乏しかった（抄録、§1）。", "p3": "識別可能性を「モデルの類ごとに誘導される分布の集合が互いに素」と定義し（定義5）、欠測のあるm-graphでは部分観測変数の代理変数V*と欠測機構Rしか観測できないが、完全分布P(V_o, V_m)が回復可能なら部分グラフの識別可能性は欠測分布に移る（命題1）。逆に完全データで識別不能なら欠測データでも識別不能（命題2）。回復可能性の関数形はふつう構造に依存するため、構造を知らずに使える条件として、(1) 欠測機構同士の因果的相互作用がない（仮定1）、(2) 自己マスキングがない（変数が自分の欠測機構の直接の親でない、仮定2）、(3) 観測されない交絡がない（仮定3）を置けば部分グラフは識別可能（命題3）。欠測機構自体の識別には、機構の忠実性か一般化線形モデルに従うことを加える（§3.2、定理1）。m-LiNGAMとm-RESITは、Rの親を複数のロジスティック回帰で推定するアルゴリズムAと、関数的因果モデルから導いた手順で構造を学ぶ（§4）。", "p4": "Erdős–Rényiグラフ（疎性0.2）上のLiNGAMと非線形ANMから合成データを生成し、5ノード（部分観測1変数、30%のMAR欠測）と10ノード（部分観測3変数、欠測20〜60%、75%がMNAR）で各100グラフ。比較はPC、MV-PC、NOTEARS、DirectLiNGAM、RESIT、MissDAG、LCS-MDで、完全データが要る手法は欠測行を除いて適用する。指標は構造ハミング距離（SHD）と構造介入距離（SID）（§5）。", "p5": "m-LiNGAMは線形設定で両指標とも小標本から競合的で、DirectLiNGAMを一貫して上回る。m-RESITはRESITより両体制でSHDが有意に低くSIDは同程度で、大標本では小さなグラフの非線形実験で最良。RESITは葉ノード選択の誤りが伝播する既知のスケーラビリティの問題を大きなグラフで示す。MissDAGとLCS-MDは全体に良好で、大きなグラフの非線形実験の大標本ではMissDAG-Gaussianが最良（§5、図2）。", "p6": "著者は、命題1がどの回復可能性手法にも成り立つため、回復可能性のアプローチを変えれば別の仮定（別の欠測の種類）の下での識別可能性が得られ、ポスト非線形モデルなど未探索の族にも適用できると述べる（§7）。本稿の仮定3（交絡なし）は強い制約で、欠測機構が互いに影響しない仮定1も実データで常に成り立つとは限らない。解釈：本手法は条件付き独立性検定とEMを避け、関数的モデルから直接学ぶ点で、一致性の保証がEMの正確な最大化に依存するMissNODAGと対照的である。", "fun": "「どちらが原因でどちらが結果か」をデータだけから推定する因果探索は、データが全部そろっていることを前提にしていた。実際のデータには空欄があり、しかも「体調が悪い人ほど体重を記入しない」のように空欄の出方自体が値に依存することがある。この論文は、空欄の出方について3つの条件（空欄同士が影響し合わない、自分の値が直接自分の空欄を決めない、隠れた共通原因がない）が成り立てば、完全データ用の理論と手法をそのまま持ち込めることを示した。", "unverified": "図2の各手法のSHD・SIDの数値は読み切れておらず未確認。"}}, {"id": "pn11", "rank": 11, "field": "環境・気候政策", "headline": "拡散モデルで月次気候場を日次高解像度に同時ダウンスケール", "title": "Generative modelling for multivariate spatio-temporal downscaling of monthly climate fields", "url": "https://arxiv.org/abs/2610.19885", "authors": "Yu Huang ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Huang, Y., Yang, S., Bathiany, S., Aich, M., Hess, P., & Boers, N. (2026). Generative modelling for multivariate spatio-temporal downscaling of monthly climate fields (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19885", "why": "1度の月平均気温・降水から0.25度の日次場を、事前学習済み拡散モデルに条件付きガイダンスを加えるだけで再学習なしに生成し、極端事象統計と時空間整合性を保った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2 方法、§3 結果、§4 要約と考察）を読んだ", "preprint": true, "p1": "1度格子の月平均の気温と降水から、0.25度格子の日次の気温と降水を同時に生成する拡散モデルによる時空間ダウンスケーリングを提案し、事前学習済みモデルに条件付きガイダンスを加えるだけで再学習なしに、ERA5の確率分布・極値・空間コヒーレンス・時間持続性・変数間共分散を再現することを示した。", "p2": "気候影響評価には高い時空間解像度の場が要るが、保存容量・計算効率・解像度要件のトレードオフで月平均・粗格子でしか得られないことが多く、空間ダウンスケーリングは多いが時空間の同時ダウンスケーリングは少なかった。極端事象の統計と時空間の整合性を保つのが難しい（抄録、§1）。", "p3": "ERA5の1979〜2023年の日次2m気温と日降水（0.25度）を学習し、降水はlog10(pr+1)変換後に[−1,1]へ正規化する。日次場X_dと30日平均X_mを結合した状態Xについて、前2日の日次場を条件とする分布P(X_d, X_m | Z, X_{d−1}, X_{d−2})（式1）をスコアベースの拡散モデルで学習する（式2–3、U-Net、v-prediction、2000ステップ訓練、推論は2次の確率流ODEで200ステップ）。日降水は月降水に対する偏差として表す。推論では、1度の月平均場を双線形・線形補間で0.25度日次の次元に合わせ、線形条件付きガイダンスの項s_gを逆時間SDEに加えて（式4）、生成した日次場を次の日の条件に回す自己回帰で30日のスピンアップ後に走らせる（§2.1–2.3）。", "p4": "2015〜2023年の月平均場を条件に生成した日次場を、同期間の0.25度ERA5日次データと要約統計で比べる。評価は確率分布（特に降水の重い裾）、格子点ごとの標準偏差、空間パワースペクトル密度（PSD）、ラグ1自己相関、気温–降水のPearson相関と相互情報量。天気予報と違い同じ日の場との一致は期待せず、統計的性質の一致を基準とする（§3.1–3.2）。", "p5": "生成した日次場は寒波・熱波・豪雨などを表し、北半球中緯度のHovmöller図で東進する波状パターンを再現する（図2–3）。全球平均の長期傾向と月平均は気温でほぼ一致、降水も高い一致だが完全には重ならない（図4）。確率分布は降水の重い裾まで再現（図5a–b）。標準偏差は全球で整合するが、中高緯度の陸域で気温が約−0.5℃、熱帯と中緯度海洋で降水が約5%過小（図6）。PSDは有効波長を222kmから62kmに拡張し広い波長で一致（図5c–d）。ラグ1自己相関の偏りは0.1未満（図7）。気温–降水相関の絶対偏差はすべて0.1未満（図8）。", "p6": "著者は、粗視化で失われた降水の高周波構造は確率的にしか再構成できず月平均が完全には一致しないこと（将来は損失関数や出力層に硬い制約を入れうる）、ERA5自体が衛星・現地観測に対して無視できない偏りを持つことを述べる（§3.1、§4）。解釈：「同じ月の実際の天気」ではなく「その月にありえた天気の一つ」を生成する確率的な枠組みであるため、特定事象の再現には使えず、統計的な影響評価向けである。", "fun": "「1月の平均気温は3度」という月の数字だけから、その月の毎日の気温と雨の地図を描けるか。この研究は、画像生成に使われる拡散モデルに「月の平均と毎日の天気はこういう関係」を覚えさせ、月の数字をヒントにして30日分の天気を「ありえた形」で描かせた。本物の1月15日と同じ日の天気にはならないが、寒波の頻度や大雨の強さ、気温と雨の関係といった統計はほぼ一致する。しかも一度学習したモデルを作り直さずに済む。", "unverified": "20の実現の間のばらつきの大きさは図4からの読み取りで、本文に数値はない。"}}, {"id": "pn12", "rank": 12, "field": "機械学習（Hugging Face）", "headline": "多教師オンポリシー蒸留の教師間ガード", "title": "Beyond Domain-Routed Supervision: Cross-Teacher Guarding for Multi-Teacher On-Policy Distillation", "url": "https://arxiv.org/abs/2610.13521", "authors": "Shi-Yu Tian ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "apa": "Tian, S.-Y., Liu, Y., Liu, X., Zhu, T., Bai, S., Yang, X., Liu, R., Yu, K.-Y., Yang, M., Zhou, Z., Li, Y.-F., Sun, Y., & Simiu, G. (2026). Beyond Domain-Routed Supervision: Cross-Teacher Guarding for Multi-Teacher On-Policy Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13521", "why": "領域ごとに教師を割り当てる蒸留で生じる勾配衝突を、非担当教師を批評者として使うトークン単位の信用配分と勾配射影で抑え、高衝突設定で5ポイント超の改善を得た。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3 方法、§4.1 実験設定、§4.2 主要結果の一部、§5 結論、付録D 限界）を読んだ。表2–3の数値は一部しか読めていない", "preprint": true, "p1": "領域ごとに専門教師を割り当てる多教師オンポリシー蒸留（MOPD）で、共有パラメータへの更新が衝突して能力が劣化する問題に対し、担当外の教師を同じ生徒の軌道の「批評者」として使うトークン単位の信用配分と、予防的な勾配射影を組み合わせたRoad MOPDを提案し、高衝突設定で5ポイント超の改善を得た。", "p2": "MOPDは各プロンプトを領域の教師に振り分けて、生徒自身の生成に対するトークン単位の密な監督を与えるが、振り分けは監督の出所を分けるだけで、更新はすべて同じパラメータに作用する。教師の応答様式や専門性が大きく異なると、単独では有効な監督でも持続的な勾配衝突と能力劣化を招く（抄録、§1）。", "p3": "OPDは生徒π_θと教師π_Tの系列レベルの逆KL（式1）を、凍結した参照π_refに対する相対報酬λ log(π_T/π_ref)の最大化とKLペナルティとして書き直せる（式2）。Road MOPDは、担当教師と補助教師の参照に対する対数確率差をtanhで圧縮して掛け合わせた一致度s_t∈[−1,1]（式4）で、トークンごとの報酬スケールλ_t=clip(1+ρ_g s_t, λ_min, λ_max)（式5）を決め、両教師が同じ方向を支持するトークンを強め、対立するトークンを弱める。補助教師は対象領域の課題を解く監督者ではなく、能力の互換性の信号としてのみ使う（§3.2）。さらに、補助教師で置き換えた損失の勾配との衝突を、対象勾配のノルムの最小割合を保ちながら最小化する制約付き最適化として射影し（§3.3）、射影済みの対象領域の勾配だけを平均してAdamWで更新する（式10–11、§3.4）。", "p4": "生徒はQwen3-4BとQwen3-1.7B（思考無効）、教師は数学・コードの専門Qwen3-4Bと医療のII-Medical-8B。各領域1万プロンプト。評価はコード（HumanEval+、MBPP+、LiveCodeBench、Avg@4）、数学（AIME 2024/2025、HMMT 2025、Avg@32）、医療（MedQA、MedXpertQA、MedMCQA、SuperGPQA-Med、Avg@1）の11ベンチマークで、Vanilla MOPD、ExOPD、CaMOPD、Open-MOPD、PCGradと比較する（§4.1）。", "p5": "低衝突の数学×コード設定（Qwen3-4B）では、生徒15.37/52.97、単一OPD 44.27/60.91、Vanilla MOPD 46.12/61.24、ExOPD 48.28/61.82、Open-MOPD 44.32/59.82、CaMOPD 46.30/60.37に対し、提案法は数学47.73（表2、以降の列は未読）。抄録と結論によれば、高衝突設定で不利な領域の劣化を抑えて5ポイント超改善し、低衝突設定と3領域設定でも全体性能を改善して、3領域の共同訓練では各領域で最良の蒸留平均を達成した（§5）。", "p6": "著者は、補助教師のスコアリングと勾配処理による訓練コストの増加（軌道の再利用で追加のロールアウトは避ける）と、評価が数学・コード・医療の3領域までに限られることを限界に挙げる（§5、付録D）。表2の提案法のコードと全体の数値、表3の3領域の数値、高衝突設定の具体的な領域の組は読めておらず未確認。解釈：低衝突設定ではExOPDが数学で提案法を上回っており、利点は衝突の強い設定に集中する可能性がある。", "fun": "数学の先生、プログラミングの先生、医学の先生から同時に学ぶ生徒AIを作ると、先生ごとに「話し方」が違うので、ある教科を覚えると別の教科が下手になることがある。この研究のアイデアは、数学の問題を解いているときも医学の先生に答案を見せて、「この書き方はどの先生も良いと言うか」を確かめること。先生全員が頷く部分を強く学び、意見が割れる部分は控えめに学ぶ。さらに、脳の同じ場所を奪い合わないよう更新の向きも調整する。", "unverified": "表2・表3の提案法の数値の大半と高衝突設定の定義は未確認。"}}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "戦略的率直さ：ESGの欠点を先に開示する印象管理", "title": "Taking a Step Back to Move Forward: Strategic Candor as an Anticipatory Impression Management Strategy", "url": "https://doi.org/10.2139/ssrn.7615881", "authors": "Xiaojie Wu ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Wu, X., Li, P., Zhao, X., & Hui, Q. (2026). Taking a Step Back to Move Forward: Strategic Candor as an Anticipatory Impression Management Strategy. https://doi.org/10.2139/ssrn.7615881", "why": "否定的報道より前に自社のESGの欠点を自発的に開示する「戦略的率直さ」を予期的印象管理として概念化し、中国企業3,453企業年で先行開示がESG格付けと結びつくことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "否定的な報道が出る前に自社のESGの欠点を自発的に開示する「戦略的率直さ」を予期的な印象管理として概念化し、中国上場企業229社の3,453企業年で、その早さが分析家の注目・収益性の改善・取締役会議長の株式保有で促され、第三者のESG格付けの高さと結びつくことを示した。", "p2": "ESG情報の開示に熱心な企業がなぜ自らの欠点まで開示するのかは、事後的な修復や曖昧化の戦略では説明できなかった（抄録）。", "p3": "期待違反理論に基づき、否定的情報の開示の「タイミング」を通じて作用する戦略と位置づける。動機–機会–能力（MOA）枠組みから、分析家のESG注目（機会）、収益性の改善（動機）、取締役会議長の株式保有（能力）が早期の率直さを促すと予測する（抄録）。", "p4": "自発的な欠点開示と否定的報道の両方を経験した229社の3,453企業年の観測で、早期の率直さの先行要因と、同時期の第三者ESG格付けとの関係を検証する（抄録）。", "p5": "結果は予測と整合し、分析家の注目・収益性の改善・議長の株式保有が早期の率直さを促し、早期の率直さは高い同時期のESG格付けと関連した（抄録）。", "p6": "抄録からは推定方法、効果の大きさ、内生性への対処（格付けの高い企業が率直になりやすい逆の因果）は読み取れない。残る疑問として、「欠点」の開示をどう測定したか、報道との時間差をどう定義したかがある。", "fun": "悪いニュースが出る前に自分から「うちにはこんな弱点があります」と言う会社がある。言い訳でも隠蔽でもなく、先に言うことで相手の期待を下げておき、後で「裏切られた」と思われないようにする戦略だ。面白いのは、そうした会社のほうが外部の評価機関から高いESG点をもらっていること。正直さが先回りの戦術として機能している。", "unverified": "推定方法と係数の大きさは抄録にない。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "生成モデルを使った条件付き分布の同等性検定", "title": "Testing Conditional Distribution Equality Using Generative Models", "url": "https://arxiv.org/abs/2610.20447", "authors": "Zekai Jin ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Jin, Z., Zhang, Y., Yang, Y., & Shao, X. (2026). Testing Conditional Distribution Equality Using Generative Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20447", "why": "高次元の条件付け変数で検出力が落ちる問題に対し、学習した生成モデルの合成サンプルと観測データを併用する検定を提案し、帰無分布の漸近正規性と局所検出力を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2.1–2.3 測度と検定手続き、§3 シミュレーション設定、§4 画像データ応用、§5 結論）を読んだ", "preprint": true, "p1": "条件付き分布P_{X|Z}とP_{Y|Z}の同等性を、高次元のZに対しても検出力を失わずに検定するために、学習した条件付き生成モデルからのサンプリングで条件付き平均埋め込みを推定し、標本分割とスチューデント化で漸近正規な統計量を作る検定を提案した。", "p2": "結合分布のMMD²(P_{XZ}, P_{YZ})に基づく検定は、Zの次元が発散すると（補題2.1）f(a)·MMD²(P_X, P_Y)に収束し、周辺分布の比較に退化して条件付きの違いを見逃す。最近傍やカーネル平滑による条件付き埋め込みの推定も高次元では不正確で計算も重い（§2.1–2.2）。", "p3": "母集団の測度として期待条件付きMMD（ECMMD²＝E‖E[K(X,·)|Z]−E[K(Y,·)|Z]‖²）を採用し、ECMMD²=0がP_{X|Z}=P_{Y|Z}と同値であることを使う。条件付き平均埋め込みg_X(z)、g_Y(z)との内積の形（式2.2）に書き直し、ノイズ外部化補題に基づきG_X(κ, Z)|Z〜P_{X|Z}となる生成器（条件付き拡散モデル、Engression、MDN）を学習して、M個の合成サンプルの平均で埋め込みを推定する。2n個のデータを2つの折に分け、各折の生成器は他方で学習し（交差適合）、S_i=K(X_i,X̂_i)+K(Y_i,Ŷ_i)−K(X_i,Ŷ_i)−K(X̂_i,Y_i)の平均（式2.3）をスチューデント化して、2折の平均T̂_nが帰無の下でN(0,1/2)に収束することを使って棄却する（§2.2）。", "p4": "良さの基準は、帰無での正確なサイズと、多項式速度で帰無に近づく局所対立に対する検出力。帰無と固定対立の理論は学習した条件付き分布の一致性だけを要し、収束率は不要（§2.3、§5）。例1はX, Yが1変量でZの次元p∈{1,10,200,2000}、例2はX, Yがs∈{7,14,21}次元でp=200、n=800、500反復、水準5%。比較はChatterjee et al. (2024) の最近傍法（NN15）、Gretton et al. (2012) の置換MMD、Yan et al. (2025)、Moskvichev et al. (2026)（§3）。", "p5": "シミュレーションの表の数値は読めていないが、結論では高次元設定で正確なサイズと強い検出力を示したとする。応用はUTKFaceの顔画像（20〜59歳、16,425件）でResNet-18の512次元特徴から年齢の条件付き分布をEngressionで学習し、真の年齢と生成年齢の混合率p_flipで帰無からの逸脱を制御する。提案法（M=100）はp_flip≥0.25で最近傍法NNl（l=5〜100）より大幅に高い棄却率、p_flip=0では両者とも5%付近、最近傍法はlの選択に敏感だった（図1a–b）。生成器の比較ではMDNよりEngressionのほうが真の分布を捉え、訓練標本n_Tが500から3000に増えると棄却率は下がる（図1c、§4）。", "p6": "著者は、検定がO(n^{−1/4})で縮む対立に対して非自明な検出力を保つこと、帰無と固定対立では条件付き分布の推定に収束率が不要であることを強調するが、条件付き生成器がZの低次元・疎な構造を活用できる場合に経験的に有効だとも述べる（§5）。局所対立下の理論の仮定2.3の内容は読めていない。解釈：この検定は条件付き生成モデル自体の良さの比較（図1c）にも使えるため、生成モデルの評価ツールとしての用途が示されている。", "fun": "「同じ条件の人同士で比べて、結果の分布が違うか」を調べたいが、条件（顔画像の特徴など）が何百次元もあると、普通の方法は条件を無視した比較と同じになってしまう。この研究は、条件から結果を「生成する」AIを2つ学習し、本物と生成物を突き合わせて違いを測る。面白いのは、顔写真から年齢を当てるモデルの「良さ」を、この検定で比べられること。検定が、生成AIの採点道具にもなっている。", "unverified": "§3の表1・表2の数値と仮定2.3の内容は未確認。"}}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "パネルデータと因果推論：TWFEの失敗とその後", "title": "Panel Data and Causal Inference: Review and Practical Considerations", "url": "https://doi.org/10.2139/ssrn.7605798", "authors": "Weijia Wang", "venue": "SSRN", "date": "2026-10-15", "apa": "Wang, W. (2026). Panel Data and Causal Inference: Review and Practical Considerations. https://doi.org/10.2139/ssrn.7605798", "why": "処置時期と効果の異質性の下で二元固定効果が負の重みを持つ理由と、異質性頑健DID・感度分析・因子モデル反事実への移行を整理し、8つのモンテカルロで事前トレンド検定の条件付けが偏りを増やすことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "パネルデータの既定推定量である二元固定効果（TWFE）が、処置時期の違いと効果の異質性の下でなぜ失敗するかを整理し、異質性頑健なDID・感度分析・因子モデルや行列補完による反事実への移行を8つのモンテカルロ実験で定量化したレビューである。", "p2": "パネルデータは観測されない交絡に対する実証経済学の主な防御であり、TWFEが長く既定だったが、処置時期が異なり効果が異質なとき、TWFE係数は重みが正とは限らない因果対比の加重平均になり、推定対象が集計する効果の範囲の外に出うる（抄録）。", "p3": "異質性頑健なDID推定量は集計を修復するが識別には触れず、平行トレンドへの疑いには事前トレンド検定ではなく感度分析で応じるべきとする。トレンドが平行でないときは因子モデルと行列補完の反事実が必要で、それらは処置前の期間の長さに決定的に依存する（抄録）。", "p4": "8つのモンテカルロ実験で、負の重み、加法性を課すコスト、連続的・切り替わる処置の下でのTWFEの失敗、事前トレンド検定を通過した場合に条件づけると偏りが大きくなることを定量化する（抄録）。", "p5": "主要な主張は、(a) TWFEの負の重み、(b) 異質性頑健推定量は集計のみを修復、(c) 事前トレンド検定の通過を条件とすると偏りは小さくなるどころか大きくなる、(d) 因子モデル反事実は処置前の窓の長さに依存する、の4点（抄録）。", "p6": "レビューであり、各手法の推奨の根拠となる実験設定（効果の異質性の程度、期間数）は抄録からは読めない。解釈：「事前トレンド検定を通ったものだけ分析する」という慣行が偏りを増やすという指摘は、検定の合格が平行トレンドの証拠ではなく選択バイアスの源になることを意味する。", "fun": "「政策の前後で、政策を受けた地域と受けなかった地域を比べる」という経済学の定番の手法が、政策の導入時期がずれていると、どの地域の効果も表さない変な平均を出すことがある。さらに意外なのは、「政策前に差がなかった」ことを検定で確認してから分析すると、かえって結果が偏るという指摘だ。安心のための手続きが、むしろ罠になる。", "unverified": "8つの実験の具体的な設定と数値は抄録にない。"}}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "創業者の自己同一性が戦略刷新を阻む過程理論", "title": "The Genesis-Nemesis Effect: An Identity-Based Process Theory of Founder-Leaders’ Resistance to Strategic Renewal", "url": "https://doi.org/10.2139/ssrn.7611580", "authors": "G. Yoganandan ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Yoganandan, G., & Monisha, S. R. (2026). The Genesis-Nemesis Effect: An Identity-Based Process Theory of Founder-Leaders’ Resistance to Strategic Renewal. https://doi.org/10.2139/ssrn.7611580", "why": "市場での承認が創業概念を創業者の自己同一性に組み込み、反証が自己への脅威として処理されて刷新への抵抗を生む過程を、5段階8命題で理論化した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベンチャーを築いた創業者の確信が、後に必要な戦略刷新を妨げる「Genesis-Nemesis効果」を、自己同一性の過程として理論化した。", "p3": "アイデンティティ制御理論に基づき、市場での承認が創業概念を創業者の自己同一性の基準に組み込み、概念への反証が自己への脅威として処理される過程を描く。5段階・8命題と米国・インドの例示事例で、創業者のリーダーシップが資産から障壁に変わる条件を特定する（抄録）。", "p5": "創業者はまず認識的閉鎖で応じ、次に概念に関する決定を標的にした刷新抵抗を示し、肯定的な役員の登用や追随者の集合的同一性の定義で自己検証構造を作る。創業者の権力がこれを創業者主導の刷新・交渉による刷新・強制的な創業者交代・固着の4つの結果に変換する（抄録）。", "fun": "会社を立ち上げた人ほど、その会社を変えられなくなることがある。自分が考えたアイデアが「自分そのもの」になると、アイデアへの批判が人格攻撃に聞こえてしまうからだ。周りを賛成派で固める、社員の「らしさ」をそのアイデアで定義する、といった行動で自分を守る過程を段階的に描いている。", "unverified": "理論論文であり、実証データによる検証は抄録に記載がない。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "制度の不十分さがカリスマ的リーダー需要を生む理論モデル", "title": "The Institutional Dynamics of Charismatic Leadership Demand: A Theoretical Model", "url": "https://doi.org/10.2139/ssrn.7611579", "authors": "Muhsin Halis ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Halis, M., Akbıyık, İ., & SAV, D. (2026). The Institutional Dynamics of Charismatic Leadership Demand: A Theoretical Model. https://doi.org/10.2139/ssrn.7611579", "why": "制度の能力不足と問題の要求の差を「制度的不十分さギャップ」と定義し、危機が制度の負荷試験として働き分極化が機能不全を代表性の欠如と解釈させる機構を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "市民が「並外れた個人のリーダーシップが必要だ」と感じる条件を、制度の能力不足の認識（制度的不十分さギャップ）から説明する理論モデルII-CLDMを提案した。", "p3": "問題に必要とされる能力と既存の政治制度に帰属される問題解決・代表能力との認識上の差を中心概念とし、カリスマ的リーダーシップを強いリーダー選好・ポピュリズム・権威主義支持・個人化から区別する。危機は制度能力の負荷試験として働き、分極化が機能不全を代表性の不足に読み替えさせ、制度のレジリエンスが緩衝するとする（抄録）。", "p5": "理論提案であり、測定・弁別妥当性・因果の順序・反証可能性に焦点を当てた実証の研究課題を示している（抄録）。", "fun": "「困ったときに強い指導者を求める」のはなぜかを、指導者の魅力ではなく「制度が頼りにならないという感覚」から説明する。危機そのものがカリスマを生むのではなく、危機が制度のテストになり、落第と感じた人が救世主を探す。分極化が「うまくいかない」を「自分たちが代表されていない」に変えるという指摘も鋭い。", "unverified": "モデルの実証的検証はまだ行われていない（抄録の研究課題より）。"}}, {"id": "pn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "TMTの両利き性がデジタル成熟度を高める（スペイン中小企業）", "title": "The Digital Catalyst: How Top Management Teams Transform Ambidexterity into Digital Maturity", "url": "https://doi.org/10.2139/ssrn.7611581", "authors": "David Neira-Fernández ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Neira-Fernández, D., Fernández-Mesa, A., & Ferreras-Mendez, J. L. (2026). The Digital Catalyst: How Top Management Teams Transform Ambidexterity into Digital Maturity. https://doi.org/10.2139/ssrn.7611581", "why": "207社のPLS-SEMで、経営陣の両利き性がIT への態度を介してデジタル成熟度を高めることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "経営陣（TMT）の両利き性が、ITに対する経営陣の態度を介して企業のデジタル成熟度を高めることをスペインの中小企業で示した。", "p3": "上層部理論と組織の両利き性の文献に基づく媒介モデルを、スペインの中小企業207社の調査データにPLS-SEMで当てはめる（抄録）。", "p5": "TMTの両利き性はITへの態度とデジタル成熟度の両方と正に関連し、ITへの態度はデジタル成熟度と正に関連して両者の関係を部分的に媒介した（抄録）。", "fun": "デジタル化が進む会社と進まない会社の差は、機械やソフトへの投資額ではなく「経営陣が今の事業を守りつつ新しいことも試せるか」という姿勢にあった、という話だ。経営陣がITを好きかどうかが、その姿勢と成果の間をつないでいる。", "unverified": "係数の大きさと測定尺度の内容は抄録にない。"}}, {"id": "pn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "女性の昇進を阻む相互に結びついた障壁の枠組み", "title": "Beyond Representation: Understanding the Interconnected Barriers to Women's Advancement in Organisations", "url": "https://doi.org/10.2139/ssrn.7607362", "authors": "Sangeeta Relan", "venue": "SSRN", "date": "2026-10-15", "apa": "Relan, S. (2026). Beyond Representation: Understanding the Interconnected Barriers to Women’s Advancement in Organisations. https://doi.org/10.2139/ssrn.7607362", "why": "個人特性・家族・組織慣行・社会的期待という障壁を別個でなく相互連関として捉える概念枠組みを提案する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "女性のキャリア前進を妨げる個人特性・家族の義務・組織慣行・社会的期待という障壁を、別々ではなく相互に結びついたものとして捉える概念枠組みを提案した。", "p3": "既存文献が特定した障壁の相互連関と、それらが女性のキャリアに累積的に与える影響を検討する概念的な枠組みを構築する（抄録）。", "p5": "焦点を「代表性（人数）」から「組織内での前進」に移し、複数のレベルにまたがる相互に結びついた障壁に対処する施策の必要性を論じる（抄録）。", "fun": "女性管理職の「人数」を増やす政策は増えたが、人数が増えても昇進が進むとは限らない。家庭、職場の慣行、社会の期待といった壁は一つずつ別に語られがちだが、実際は絡み合って効いている。壁を一枚ずつ見るのではなく、網として見ようという提案だ。", "unverified": "概念論文であり、データによる検証は抄録に記載がない。"}}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "バズった都市の経済効果：スピルオーバー頑健な識別", "title": "Viral Cities and Spatial Reallocation: Short-Video Attention Shocks, Spillover-Robust Identification, and National Gains in a Quantitative Model of Chinese Prefectures", "url": "https://doi.org/10.2139/ssrn.7612122", "authors": "Zhihao Yang", "venue": "SSRN", "date": "2026-10-14", "apa": "Yang, Z. (2026). Viral Cities and Spatial Reallocation: Short-Video Attention Shocks, Spillover-Robust Identification, and National Gains in a Quantitative Model of Chinese Prefectures. https://doi.org/10.2139/ssrn.7612122", "why": "297都市の定量空間モデルで真の効果が既知の擬似パネルを作り、Callaway–Sant'Anna推定が真値に近い一方TWFEが偏ること、局所推定の外挿が全国効果を88%過大評価することを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ショート動画で突然人気になった中国の都市の経済効果について、真の効果が既知のシミュレーション都市パネルを使い、どの推定法が正しく、局所効果の外挿がどれだけ全国効果を過大評価するかを示した。", "p3": "実地理・重力型の観光と移住・戸籍摩擦・土地市場を持つ297の地級市の定量空間モデルで2013〜2024年の都市パネルを模擬し、全国のショート動画到達度と都市の適性指数の交互作用で段階的なバズを発生させる。差の差とシフトシェア操作変数の両方で推定する（抄録）。", "p5": "回帰調整したCallaway–Sant'Anna推定は一人当たり所得の真の2.4%上昇に対し2.1%を回復したが、無条件とTWFEの推定は観光集約都市の全国観光循環への露出差で偏った。人口は0.5%、観光客は30%増える。波及は拡散的で所得の局所推定はほぼ偏らないが、近隣の対照を除かないと人口推定は約25%膨らみ、局所所得増の43%と人口増のすべては他所で相殺され、局所推定の外挿は全国所得増を88%過大評価する（抄録）。", "fun": "ある街がSNSでバズって観光客が押し寄せると、その街は豊かになる。でも隣の街から客が移っただけなら、国全体では増えていない。本物のデータでは「本当の答え」が分からないので、答えを知っている模擬の中国を作って推定法を試した。結果、よく使う方法の一つは偏っていて、街の効果を国に当てはめると9割近く過大になる。", "unverified": "シミュレーションのパラメータの出所は抄録にない。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "転職による賃金成長が企業のキャッシュフローと株式リターンに現れる", "title": "Borrowed Growth: Employer-to-Employer Mobility, Corporate Cash Flows, and Stock Returns", "url": "https://doi.org/10.2139/ssrn.7614778", "authors": "Yunlong Chen ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Chen, Y., Huang, D., Li, Y., Sun, Y., & Zhang, B. (2026). Borrowed Growth: Employer-to-Employer Mobility, Corporate Cash Flows, and Stock Returns. https://doi.org/10.2139/ssrn.7614778", "why": "労働者の企業間移動が賃金とラボアシェアを押し上げる経路が、企業のキャッシュフローと株式リターンにどう映るかを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "労働者の転職が活発な時期には賃金と労働分配率が上がる代わりに企業利益が遅れて減り、株価はその減益が報告されてから反応することを示した。", "p3": "1995〜2025年の修正済み月次の雇用主間転職率を用い、転職率の変動がその後の利益成長・配当成長・賃金・生産性・株式リターンをどう予測するかを調べる。引き抜きが賃金コストを積み上げて遅れて利益に届き、配当平滑化がさらに株主への到達を遅らせるモデルを、リターンデータを使わずに較正する（抄録）。", "p5": "転職率の1標準偏差の上昇は翌年の利益成長を10.9ポイント下げ、配当成長は数年にわたり低下し、賃金・労働分配率・生産性は上がる。株式リターンは翌年に月0.4ポイント低く、予測はサンプル外で過去平均を上回り、減益は負のキャッシュフロー・ニュースとして株価に届く（抄録）。", "fun": "転職が盛んな「熱い労働市場」では、会社は人を引き留めるために給料を上げる。その分の利益の減少はすぐには決算に出ず、株式市場も転職が増えた時点では気づかず、減益が発表されてから株価が下がる。好景気の利益は「未来から借りてきた成長」だという見方だ。", "unverified": "転職率の修正方法の詳細は抄録にない。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "同僚ネットワークが住宅購入に与える影響", "title": "From Firms to Homes: Coworker Networks, Firm Exposure, and Housing Purchases", "url": "https://doi.org/10.2139/ssrn.7613022", "authors": "Chuxuan Fan ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Fan, C., Lu, G., & Yang, W. (2026). From Firms to Homes: Coworker Networks, Firm Exposure, and Housing Purchases. https://doi.org/10.2139/ssrn.7613022", "why": "マサチューセッツの雇用主–従業員–住居–住宅取引を連結したパネルで、職場ネットワークが住宅市場に与える影響を推定する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "同じ事業所の同僚が家を買うと自分も買いやすくなるという職場ネットワークの効果を、LinkedInの職歴と不動産取引を結んだパネルで示し、企業の業績信号が住宅市場に伝わる経路を明らかにした。", "p3": "マサチューセッツ州の2006〜2023年について、雇用主の事業所–従業員–居住地–住宅取引を結合したパネルを作り、職業×年と企業×年の固定効果で選別と企業ショックを制御する。2019年以降の在宅勤務への移行を使って社会的相互作用の機構を検証する（抄録）。", "p5": "直近3年に同僚が1人家を買うと、従業員の購入確率は標本平均の20%超上がる。在宅に適した職業ではパンデミック後に同僚効果が有意に減った。元同僚の購入も予測力を持ち、雇用主が拡大すると多く、リスクが上がると少なく買う。企業業績から導いた信号の不一致が大きいほど将来の取引量が増え、複数企業の混ざった信号への露出は取引量を減らす（抄録）。", "fun": "隣の席の同僚がマイホームを買うと、自分も買いたくなる。これが単なる噂ではなく、会社の景気を映す情報として伝わっていることを、転職サイトの履歴と登記のデータを突き合わせて示した。コロナで在宅勤務になった職種ではこの効果が弱まったので、やはり職場での会話が鍵だったと分かる。", "unverified": "標本の従業員数と企業数は抄録にない。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "異質企業の合理的無関心と金融政策の伝達", "title": "Heterogeneous Firms, Rational Inattention, and Monetary Policy", "url": "https://doi.org/10.2139/ssrn.7613379", "authors": "Shengliang Ou ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Ou, S., Zhang, D., & Zhang, R. (2026). Heterogeneous Firms, Rational Inattention, and Monetary Policy. https://doi.org/10.2139/ssrn.7613379", "why": "企業の異質性が注意の配分を決め、金融政策の伝達を形づくる合理的無関心の枠組みを構築する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の規模が価格設定への「注意」の配分を決め、それが金融政策の伝達を左右する、異質企業の合理的無関心モデルを構築した。", "p3": "企業規模と注意の同時分布を内生化する枠組みを作る。大企業は誤った価格の影響が売上に大きく及ぶ一方、需要弾力性と望ましいパススルーが低く、誤価格の損失と名目ショックへの感応度が小さい。需要の曲率がどちらが支配するかを決める（抄録）。", "p5": "注意は規模に対して増加・減少・山形のいずれにもなりうるが、実証的には山形だった。この分布が金融政策の企業横断的な異質効果と、名目ショックが測定TFPを上げるか下げるかを決める（抄録）。", "fun": "中央銀行が金利を動かしたとき、企業がどれだけ素早く値段を見直すかは「どれだけ気にしているか」で決まる。大企業は売上が大きいから気にしそうだが、客が離れにくいから気にしなくてもよい面もある。結果、中くらいの企業が一番気にしているという山形の形になり、それが金融政策の効き方を変える。", "unverified": "実証に用いたデータの種類と国は抄録にない。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "配当のない資産のバブルを支えるスキン・イン・ザ・ゲーム", "title": "Who Keeps a Bubble Alive? Skin in the Game and the Survival of Rational Bubbles", "url": "https://arxiv.org/abs/2610.19496", "authors": "Feng Dong ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Dong, F., Wang, S., & Wu, F. (2026). Who Keeps a Bubble Alive? Skin in the Game and the Survival of Rational Bubbles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19496", "why": "保有を続けるスポンサーの隠れた維持努力が、転売目的でのみ保有される資産の価値を支える理論を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "配当を生まず転売のためだけに保有される資産（トークンなど）の価値が、スポンサーの保有継続（skin in the game）によって支えられる条件を理論的に示した。", "p3": "スポンサーが市場の存続を決める隠れた維持努力を選び、その費用を全額負担しつつ便益は保有トークン分しか得られないモデルで、正の定常均衡の存在条件を調べる（抄録）。", "p5": "正の定常均衡は保有が内生的な最小値を満たすとき、かつそのときに限り存在し、曲率条件の下では閾値以上の保有が2つの正の定常均衡を支える。存続を条件とすると上側均衡より低い価格は下側に収束し、保有が増えると実現可能な価格区間が広がる。将来の保有が最小値を下回るという信頼できるニュースは、逆向きの解きほぐしで即座の崩壊を招く（抄録）。", "fun": "利益を生まないのに値段がつく資産は「次に高く買う人がいる」限り生きている。この論文は、仕掛け人が自分の分を手放さずに持ち続けることが、その市場を生かす「約束」になると説明する。逆に「仕掛け人がそのうち売る」と皆が信じた瞬間に、総供給が変わらなくても価格は崩れる。", "unverified": "理論論文であり、データによる検証は抄録に記載がない。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "分散型A/Bテストでノイズに報酬を与えてしまう誘因", "title": "Rewarding Noise: Incentives in Decentralized A/B Testing", "url": "https://arxiv.org/abs/2610.19512", "authors": "Ryan Kessler", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Kessler, R. (2026). Rewarding Noise: Incentives in Decentralized A/B Testing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19512", "why": "検出力の低いA/Bテストが分散組織でノイズ駆動の意思決定を生む誘因構造を分析する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "分散型組織のA/Bテストで検出力が低くなるのは誘因のずれのせいであり、生の効果推定値で評価するとノイズに報酬を与えてしまうことを、理論とAmazonのデータで示した。", "p3": "製品チームが私的報酬を最大化するためにテストの対象と方法を選び、体験のオーナーが評価規則と公開基準を決める、というプリンシパル・エージェントモデルを定式化する。Amazonで実施されたA/Bテストのデータでモデルの予測を検証する（抄録）。", "p5": "正しく較正した事後平均による評価はノイズへの報酬を取り除き、より野心的なアイデアを少数の精密なテストで検証する誘因を局所的に生む。2024年にAmazonのある体験が事後平均に基づく評価へ移行した後、テスト数は減り、精度と真の効果のばらつきは増え、信号対雑音比は2倍超になった（抄録）。", "fun": "「効果があった」と見えたテストだけが評価されるなら、たくさん小さなテストをしてまぐれ当たりを狙うのが得になる。評価の計算を「ノイズを割り引いた推定値」に変えただけで、チームは少数の大胆なテストを選ぶようになった。測り方が、何を試すかまで変えるという実例だ。", "unverified": "対象となったAmazonの体験の内容とテスト件数は抄録にない。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "越境介護労働ショックと台湾・日本の介護体制の違い", "title": "Cross-Border Labor Shocks, Long-Term Care Regimes, and Intra-Household Resource Allocation: Evidence from Taiwan and Japan", "url": "https://doi.org/10.2139/ssrn.7614340", "authors": "HUNG YU HUANG ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "HUANG, H. Y., & Lee, M.-H. (2026). Cross-Border Labor Shocks, Long-Term Care Regimes, and Intra-Household Resource Allocation: Evidence from Taiwan and Japan. https://doi.org/10.2139/ssrn.7614340", "why": "2020年の移民労働供給の途絶を準自然実験とし、PSFDとJHPSの10年パネルで台湾は金銭移転、日本は介護時間が急増するという体制の違いを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "2020年の越境移民労働の途絶を準自然実験として、市場型の移民介護に頼る台湾と公的保険の日本で、世帯内の資源配分が対照的に変化したことを示した。", "p3": "台湾の家族動態パネル（PSFD）と日本家計パネル調査（JHPS）の2012〜2022年を調和させ、イベントスタディと差の差で「介護のクラウディングアウト効果」を検証する（抄録）。", "p5": "台湾の世帯では親への金銭移転が急増し介護時間は安定した一方、日本では介護時間が急増し金銭移転は増えなかった。要介護の親がいる世帯では現金支援が所得比で4.37ポイント減り、配給された公的サービスを家族の時間で代替したことを示す。性別格差は広がらず息子と娘の貢献は収斂し、台湾では流動性制約が男性介護者の主観的well-beingを日本より下げた（抄録）。", "fun": "コロナで外国人介護労働者が来られなくなったとき、台湾の家族は「お金」で、日本の家族は「時間」で穴を埋めた。公的介護保険がある日本では、サービスが足りない分を家族が自分の時間で補うしかなかった。介護制度の違いが、ショックのときに何が家族に押しつけられるかを決めている。", "unverified": "両パネルの標本サイズは抄録にない。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "階層ガウス過程による調査ウェイトの局所等価ウェイト", "title": "Hierarchical Gaussian Processes for Survey Weighting: Local Equivalent Weights in Structured Populations", "url": "https://arxiv.org/abs/2610.20321", "authors": "Seonghun Lee", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Lee, S. (2026). Hierarchical Gaussian Processes for Survey Weighting: Local Equivalent Weights in Structured Populations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20321", "why": "回帰ベースの調査ウェイティングで、非線形モデルの局所等価ウェイトを階層ガウス過程で構造化母集団に適用する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "階層ガウス過程回帰に基づく調査ウェイティングの枠組みを作り、非線形モデルでも事後層化推定量の感度から「局所等価ウェイト」を構成できるようにした。", "p3": "構造化された集団レベルの効果とカーネル平滑化を組み合わせて疎な事後層化セル間で情報を共有し、構造化共分散を利用した事後予測公式で計算を減らす。事後予測平均の一様収束を示し、プラグイン事後層化推定量の1次感度を当てはめ応答平均の加重平均の感度に一致させて局所等価ウェイトを作る（抄録）。", "p5": "シミュレーションでは、ノンパラメトリックな構造の下でHGPが集団加重の予測誤差を下げ、正しいパラメトリック指定の下ではロジスティック回帰がよく機能した。Future of Families and Child Wellbeing Studyへの適用例を示す（抄録）。", "fun": "世論調査で「若い男性が少なすぎる」といった偏りを直すのがウェイト付けだ。細かい属性で分けると人数がほとんどいないマスができてしまうが、似た属性どうしで情報を貸し借りすれば埋められる。この研究は、その貸し借りをガウス過程という滑らかな関数で行い、しかも結果を「各回答者の重み」として読めるようにしている。", "unverified": "シミュレーションの設定と誤差の数値は抄録にない。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "ネットワーク未知の固定効果パネルで仲間効果を検定", "title": "Testing for Peer Effects in Heteroskedastic Fixed-Effects Panels", "url": "https://arxiv.org/abs/2610.20045", "authors": "Leheng Cai ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Cai, L., Li, W., & Guo, X. (2026). Testing for Peer Effects in Heteroskedastic Fixed-Effects Panels (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20045", "why": "相互作用ネットワークを指定せずに、個体・時間固定効果パネルで仲間効果の有無を二次形式検定で調べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "相互作用ネットワークを指定せずに、個体・時間固定効果パネルで仲間効果の有無を検定する二次形式検定を提案し、条件付き不均一分散の下でも中心化を回復するレバレッジ調整を導入した。", "p3": "残差化した仲間共変量のグラム行列に基づく二次形式検定を用いる。固定効果の除去と撹乱推定が従来の対角除外型統計量の中心化を壊すため、レバレッジ調整で厳密な条件付き中心化を取り戻し、残差に基づく分散推定と組み合わせる（抄録）。", "p5": "スチューデント化統計量は両方のパネル次元が発散するとき、相対的な増加率に制約なく漸近的に標準正規になり、追加条件の下で対立仮説に対し一致する。時間方向に弱従属な共変量にも拡張でき、長期分散の推定は不要。モンテカルロで既存のベンチマーク検定より良好で、州の租税競争とOECD諸国の成長波及に応用した（抄録）。", "fun": "「隣の州が税金を下げたら自分の州も下げる」のような仲間効果を調べるには、普通は「誰が誰の仲間か」の地図が要る。この研究は地図なしで「仲間効果がそもそもあるか」を検定できる。個人差や時代差を取り除く操作が検定の土台を崩すという落とし穴を、幾何的な補正で直している。", "unverified": "検定の検出力の数値は抄録にない。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "多変量Hawkes過程の共通信号と見かけの相互励起", "title": "Common Signals, Spurious Cross-Excitation, and Identification in Multivariate Hawkes Processes", "url": "https://arxiv.org/abs/2610.19428", "authors": "Jiwon Jung ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Jung, J., & Lee, K. (2026). Common Signals, Spurious Cross-Excitation, and Identification in Multivariate Hawkes Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19428", "why": "潜在的な共通信号が構造的相互作用なしに見かけの励起を生むことを特徴づけ、識別の条件を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多変量Hawkes過程で、潜在的な共通信号が構造的相互作用なしに「見かけの相互励起」を生むことを示し、2次統計量では識別できないが3次キュムラントで局所識別できることを明らかにした。", "p3": "共通信号モデルと同じ平均強度とBartlettスペクトルを持ちながら励起機構が異なる、安定で非負のHawkes過程を構成する。Cox型の移入を持つHawkes過程の積分3次キュムラントを導き、2・3次元系で正規化構造パラメータの一般的な局所識別を示す。制限されたパラメトリック族にはビン化カウントからのWhittle推定を開発し、一致性・漸近正規性・サンドイッチ標準誤差を与える（抄録）。", "p5": "厳密同値のモンテカルロで3次情報が同じ2次構造の機構を区別できることを示す一方、弱い信号では有限標本の限界が大きい。暗号資産取引への応用で、推定された励起がモデル指定に敏感で、スペクトルの当てはまりだけでは構造的解釈に限界があることを示した（抄録）。", "fun": "「Aの取引が起きるとBの取引が誘発される」ように見えても、実は両方が同じニュースに反応しているだけかもしれない。驚くのは、平均や相関（2次の統計）を完全に一致させた「偽物」の因果モデルを作れること。3つ組の統計まで見ないと本物と偽物が区別できないのに、データが弱いと3つ組でも見分けにくい。", "unverified": "暗号資産データの期間と銘柄は抄録にない。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "再利用可能な局所事後分布による半償却ベイズ推論", "title": "Semi-Amortized Bayesian Inference with Reusable Local Posteriors", "url": "https://arxiv.org/abs/2610.18945", "authors": "Niek Stevenson ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Stevenson, N., Bürkner, P.-C., Heathcote, A., & Radev, S. T. (2026). Semi-Amortized Bayesian Inference with Reusable Local Posteriors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18945", "why": "高次元で結合事後分布を一括学習する難しさに対し、局所事後分布を再利用する半償却推論を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高次元のベイズモデルで、パラメータをブロックに分け、条件付き独立性を使って各ブロックの完全条件付き事後分布をニューラル推定器で近似し、マルコフ連鎖に組み込む半償却推論を提案した。", "p3": "事後更新が計算的に高価または頻繁に繰り返されるブロックに対し、関連するモデル成分のシミュレーションから推定器を学習する。マルコフ連鎖はこれらの推定器からの直接サンプリングと残りの変数の従来の更新を交互に行い、尤度評価も採択棄却も不要。同じ条件付き構造が繰り返されるところでは、一つの推定器をブロックとデータセットをまたいで再利用できる（抄録）。", "p5": "高次元で計算コストの高い階層モデルと時空間モデルで手法を例示した（抄録）。", "fun": "シミュレーションから「データを見たらパラメータはこう」と答える機械を学習しておくのが償却推論だが、全部を一度に学ぶのは無理がある。そこで問題を部品に分け、よく使う部品だけ機械に覚えさせ、残りは従来の手計算で回す。同じ形の部品なら一度覚えた機械を使い回せる、という分業の発想だ。", "unverified": "例示したモデルでの精度と計算時間の数値は抄録にない。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "入れ子多変量多忠実度制御変量の最適標本配分", "title": "Analytically Optimal Sample Allocations for Nested Multivariate Multifidelity Control Variate Estimators", "url": "https://arxiv.org/abs/2610.19371", "authors": "Atticus Rex ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Rex, A., & Qian, E. (2026). Analytically Optimal Sample Allocations for Nested Multivariate Multifidelity Control Variate Estimators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19371", "why": "計算資源が限られたモンテカルロ推定で、多忠実度制御変量の標本配分を解析的に最適化する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "入れ子型の多変量多忠実度制御変量推定量について、限られた計算予算をモデル間にどう配分すべきかの閉形式の最適解を導いた。", "p3": "高忠実度モデルが低忠実度モデルの入力の部分集合で評価される入れ子構造を扱い、入れ子MLBLUEをMFMC推定量の拡張として再定式化して最適な分数的標本配分を閉形式で求める。整数予算配分には組合せ最適化の貪欲法を、制御変量係数には少数のパイロット標本からの頑健な近似を提案する（抄録）。", "p5": "2つの数値例で理論を確かめ、拡張MFMC定式化が既存推定量より精度を高めることを示した。従来は数値最適化に頼り、閉形式は最適でない推定量にしか知られていなかった（抄録）。", "fun": "精密だが高価なシミュレーションを数回と、粗いが安いシミュレーションを多数回組み合わせると、同じ予算で誤差を減らせる。問題は「どれを何回回すか」で、これまではコンピュータで試行錯誤していた。この研究はその最適な配分を紙と鉛筆で解ける式にした。", "unverified": "数値例の問題設定と精度の改善幅は抄録にない。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "3トークン1層のTransformerでも収束しないことがある", "title": "Asymptotic Behavior of Transformers", "url": "https://arxiv.org/abs/2610.19358", "authors": "Katy Blumer ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Blumer, K., Juan, D.-C., Kleinberg, J., Kumar, R., Rashtchian, C., & Tomkins, A. (2026). Asymptotic Behavior of Transformers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19358", "why": "長時間テキストを生成するTransformerの漸近挙動を調べ、極めて単純なモデルでも収束に失敗しうることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "長時間テキストを生成するTransformerの漸近挙動を調べ、3トークン・1層の注意のみのモデルでも収束しないことがある一方、softmax温度が閾値を超えればキャッシュの経験分布が初期条件によらず一意の極限に収束することを示した。", "p3": "任意の有限深さ、層正規化、MLP、RoPE符号化、局所層と大域層の任意の混合を持つ豊かなTransformerのクラスを扱い、各モデルに温度閾値が存在することを示す（抄録）。", "p5": "各Transformerに閾値はあるが、その上限は無限大なので、すべてのTransformerを収束させる大域的な最小温度は存在しない（抄録）。", "fun": "文章生成AIを延々と走らせると、最終的に「落ち着く」のか「ぐるぐる回り続ける」のか。答えは「温度（ランダムさ）を上げれば落ち着くが、どこまで上げれば十分かはモデルごとに違い、全部に効く値はない」。たった3つの単語と1層のモデルでも落ち着かない例が作れる、というのが意外だ。", "unverified": "収束しない3トークンの例の構成は抄録にない。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "文脈内強化学習のTransformer文脈圧縮を証明", "title": "Provable Transformer Context Compression for In-Context Reinforcement Learning", "url": "https://arxiv.org/abs/2610.20004", "authors": "Yajie Zhao ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Zhao, Y., Mo, Y., Wang, Z., Tang, B., Xu, C., & Kong, F. (2026). Provable Transformer Context Compression for In-Context Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20004", "why": "文脈サイズがサンプル数とともに増える既存構成に対し、Transformerが文脈を圧縮して文脈内強化学習を行えることを理論的に示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Transformerが文脈内で強化学習（固定方策のTD評価）を行うのに本質的に必要な文脈の大きさを、Krylov次元として特徴づけ、文脈を圧縮したときの最適な近似誤差を示した。", "p3": "共有線形デコーダの下で最初のL回のTD反復を厳密に再現する最小文脈次元がサンプル遷移の誘導するKrylov次元であることを示し、文脈次元mがそれを下回る場合の最適近似誤差をΘ(γ^m max{1, 1/(m(1−γ))})と特徴づける。保持メモリの最適値をΘ(n k_L)とし、タスク多様性の下で補助目的の大域収束を証明して事前学習による学習可能性を示す（抄録）。", "p5": "厳密階数は満だが数値階数が小さい課題で、精度10^-2の文脈はTDの疎な十分統計量より88.7%小さかった。多様なTD評価問題でパラメータ回復と文脈–精度のトレードオフを確認した（抄録）。", "fun": "AIが「過去の経験を文脈に入れるだけで学習する」とき、経験を全部入れないと駄目なのか、要約で済むのか。答えは線形代数のKrylov次元で決まり、必要な大きさを下回ると誤差は割引率のべきで減る。実験では、必要な情報を9割近く削っても精度が保たれた。", "unverified": "実験に使ったTransformerの規模は抄録にない。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "機構的解釈可能性のための疎Transformerテストベッド", "title": "Sparse Transformer: a Controlled Testbed for Mechanistic Interpretability", "url": "https://arxiv.org/abs/2610.19907", "authors": "Anton Korznikov ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Korznikov, A., Dontsov, A., & Tutubalina, E. (2026). Sparse Transformer: a Controlled Testbed for Mechanistic Interpretability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19907", "why": "評価の基準となる真の特徴単位がない問題に対し、既知の特徴をもつ制御されたTransformerを用意して解釈手法を検証できるようにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ニューロンが特化するよう強制した5層の疎Transformer（ST）を作り、機構的解釈可能性の手法を「正解のある基準」で評価できるテストベッドにした。", "p3": "TinyStoriesで訓練した5層言語モデルの広いMLPにTopK疎性を課してニューロンを特化させ、損失を揃えた密なTransformerと解釈可能性を比べる。Transcoder（MLPの入出力写像を近似）とSparse Autoencoder（出力のみ再構成）でSTのニューロンベクトルの回復を比較し、疎MLPを密に蒸留して多義性の発生を調べる（抄録）。", "p5": "STのニューロンはAutoInterpで密モデルを43%上回り、中央値12ニューロンの回路で個々の予測を再現できた。TranscoderはSparse Autoencoderより52.6%高いコサイン類似度でニューロンベクトルを回復し、密への蒸留で圧縮が特徴の重ね合わせを生む過程が見えた（抄録）。", "fun": "AIの中身を解読する研究は「正解が分からない」ことが最大の壁だった。この研究は、最初から1つのニューロンが1つの役割を持つように作った小さなモデルを用意し、解読法の答え合わせができるようにした。それを普通のモデルに圧縮すると、1つのニューロンが複数の意味を持つようになる様子まで観察できる。", "unverified": "モデルのパラメータ数は抄録にない。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "答えのみのデータから事後学習する逆推論モデル", "title": "Inverse Reasoning Models for Efficient Post-Training and Verification from Answer-Only Data", "url": "https://arxiv.org/abs/2610.18878", "authors": "Eric O. Korman", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Korman, E. O. (2026). Inverse Reasoning Models for Efficient Post-Training and Verification from Answer-Only Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18878", "why": "推論過程の教師データを要する教師あり微調整の非効率に対し、答えのみから事後学習と検証を行う逆推論モデルを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "答えだけのデータから推論過程を潜在変数として扱い、答えから推論過程を生成する「逆推論LLM」で自己蒸留する手法を提案し、検証器としても使えることを示した。", "p3": "元のモデルの推論過程を答えに条件づけて生成する逆モデルを一度訓練し、以後の答えのみデータのバッチに再利用する。生成はすべてオフラインで事前に行う。Qwen3-0.6BでCountdownとGSM8Kを用い、GRPO訓練が飽和した後に逆モデルからの1回のオフライン蒸留を行う（抄録）。", "p5": "難しいプロンプトでpass@1がおよそ2倍になり、Countdownでは棄却サンプリング自己蒸留をすべての難問指標・混合比で上回った（GSM8Kでは小さめ）。新データでGRPOを続けると難問のpass@1では優位だがpass@8・32では蒸留に劣る。逆モデルをbest-of-n選択の検証器に使うと、Countdownの選択精度が多数決の0.753から0.969に上がった（抄録）。", "fun": "答えだけが分かっていて途中式がない問題集から、AIに途中式を学ばせる方法だ。コツは「答えを見て途中式を書く」別のAIを作ること。カンニングのようだが、モデル自身が一度も解けない問題でも学習の手がかりが得られる。しかもその「答えから逆算するAI」は、答えの正しさを判定する審判としても優秀だった。", "unverified": "難問の定義と混合比の設定は抄録にない。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "関係深層学習の単純ベースラインを見直す", "title": "Revisiting Simple Baselines for Relational Deep Learning", "url": "https://arxiv.org/abs/2610.20534", "authors": "Viet The Nguyen ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Nguyen, V. T., Dwivedi, V. P., & Gust, G. (2026). Revisiting Simple Baselines for Relational Deep Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20534", "why": "関係データベースを時間異質グラフとして学習する最近の手法に対し、単純なベースラインの性能を再検証する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "関係データベース上の深層学習（RDL）で、固定の低域特徴伝播とMLP、履歴ラベルのCorrect-and-Smoothという単純なベースラインが、異質GNNの性能のかなりの部分を回復することを示した。", "p3": "予測信号が対象属性・関係属性・履歴ラベルから生じるという観察に基づき、固定の低域特徴伝播を関係エンティティグラフに適応してMLPを訓練し、対象エンティティを結ぶ課題固有のメタグラフ上でCorrect-and-Smoothにより履歴ラベルを取り込む（抄録）。", "p5": "RelBenchの分類・回帰課題で、近傍フィルタした特徴で訓練したMLPは対象属性のみのMLPを大半の課題で上回り、異質GNNの性能の相当部分を回復した。Correct-and-Smoothは履歴ラベルからさらに利得を与えたが、対象エンティティ間の接続が関係グラフに直接指定されないため、別途メタグラフを構築する必要があった（抄録）。", "fun": "顧客・注文・商品のような複数の表がつながったデータベースから予測するのに、最近は複雑なグラフニューラルネットが使われる。この研究は「隣の表の情報を平均して足す」程度の単純な方法でもかなり近い精度が出ると示した。複雑さの何割が本当に必要なのかを測る物差しになる。", "unverified": "課題ごとの精度の数値は抄録にない。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "表データ文脈内学習のMoE基盤モデルOrionMoE", "title": "OrionMoE-v1.0: A Mixture-of-Experts Foundation Model for Tabular In-Context Learning", "url": "https://arxiv.org/abs/2610.20418", "authors": "Mohamed Bouadi ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Bouadi, M., Bouarour, N., Tanna, A., & Sankarapu, V. K. (2026). OrionMoE-v1.0: A Mixture-of-Experts Foundation Model for Tabular In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20418", "why": "ラベル付きサポート表から未知の観測を予測する表データ基盤モデルに、専門家混合を導入する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "特徴軸に沿って専門家を選択的に活性化する疎な専門家混合（MoE）を持つ小型の表データ基盤モデルOrionMoE-Smallを提案し、合成課題のみの事前学習で大型モデルに匹敵する性能を示した。", "p3": "二軸Transformerの上で、個々の特徴表現とデータセット全体の文脈の両方に基づくルーティングで特徴軸の専門家を選び、分布を意識した表現と組み合わせる。構造化された因果事前分布から生成した合成分類課題のみで事前学習し、勾配更新なしで下流予測を行う（抄録）。", "p5": "複数の表データベンチマークで、かなり大きな基盤モデルと競合する性能を示し、特に小さな文脈と高次元のデータセットで強かった。クラス不均衡下でも相対的に良好で、特徴の構成の重要性が示された（抄録）。", "fun": "表データ（エクセルのような形）を一度も見たことのない実データで学習せず、コンピュータが作った架空の表だけで学んだモデルが、実際の表でも当てる。さらに、列ごとに「担当の専門家」を切り替える仕組みで、ずっと大きなモデルと互角になった。列の性質が違えば扱いも変える、という当たり前を実装した形だ。", "unverified": "比較した基盤モデルの名称と性能差の数値は抄録にない。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "評価法が分からないときに信頼できる評価設定を選ぶ", "title": "How to Evaluate When You Don't Know How to Evaluate? Choosing Reliable Setups for Base Language Model Benchmarking", "url": "https://arxiv.org/abs/2610.19185", "authors": "Shenbin Qian ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Qian, S., Samuel, D., Helcl, J., Kutuzov, A., & Oepen, S. (2026). How to Evaluate When You Don't Know How to Evaluate? Choosing Reliable Setups for Base Language Model Benchmarking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19185", "why": "単調性・非ランダム性・順位一貫性を規範的メタ尺度として、26の2Bモデル・4言語80課題で評価設定8側面を比較し、複数プロンプトの使用など具体的な推奨を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの評価設定（課題の定式化や文脈内例の数など8側面）を、途中チェックポイント間の単調性・非ランダム性・順位一貫性という3つの規範的メタ尺度で比較し、信頼できる設定の選び方を示した。", "p3": "事前学習初期の場面で、異なる種類のデータで訓練した26の単言語2Bパラメータモデルを4言語80課題で評価し、同じ4言語で7B以上の3モデルでも設定を検討して規模による変化を調べる（抄録）。", "p5": "複数プロンプトの使用のように一貫して有用な選択がある一方、課題の定式化のようにモデル規模に依存する選択もあった。この枠組みは新しい場面で評価設定を選ぶレシピとして使える（抄録）。", "fun": "AIの成績は「どう出題するか」で大きく変わるのに、出題法の決め方に根拠がなかった。この研究は「学習が進めば点が上がるはず」「でたらめではないはず」「順位が安定するはず」という当たり前の性質を物差しにして、出題法そのものを採点した。テストのテストをする、という発想だ。", "unverified": "8側面の内訳と推奨の具体的な内容は抄録にない。"}}, {"id": "pn39", "rank": 39, "field": "機械学習（Hugging Face）", "headline": "合成経験からゲーム操作を学ぶPlayer-1", "title": "Player-1: Learning to Play from Synthetic Experience", "url": "https://arxiv.org/abs/2610.20584", "authors": "Mingyu Ouyang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "apa": "Ouyang, M., Wang, Y., Hu, S., Yin, X., Sun, H., Wang, G., Pu, J., Cheng, C., Chen, H., Shan, Y., Shou, M. Z., & Ng, H. T. (2026). Player-1: Learning to Play from Synthetic Experience (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20584", "why": "6,044のプレイ軌跡で初期化し、16の合成環境で検証可能報酬のPPOを行う事後学習で、MineDojo-300の成功率をSFTから27.8ポイント引き上げた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "コンピュータ操作エージェントに、実演データを超えて合成環境での経験からゲーム操作を学ばせる事後学習枠組みPlayer-1を提案した。", "p3": "行動空間に相対ポインタ移動・押し続け・複合操作を加え、6,044の厳選したプレイ軌跡で教師あり初期化を行う。ゲームに共通する制御要求に基づく16の合成2D・3D環境Player-1-Gymを作り、プログラムで検証可能な報酬とランダム化した観測・制御で多環境PPO強化学習を行う（抄録）。", "p5": "Player-1-9Bと35B-A3BはMineDojo-300の成功率をSFT方策からそれぞれ27.8と17.7ポイント改善し、9Bは38.33%で最強ベースラインの12.63%を上回った。ViZDoom-10とGameWorldでも改善し、合成環境の幅が転移を高め、強化学習中に複合操作の使用が増えた（抄録）。", "fun": "AIにゲームを教えるのに、人間のプレイ動画だけでは「見たことのない場面」に弱い。そこで本物のゲームではなく「ゲームに共通する動き」だけを抽出した練習用の仮想環境を16個作り、そこで試行錯誤させた。練習問題で鍛えたほうが本番に強くなった、という結果だ。", "unverified": "ベースラインのモデル名は抄録にない。"}}, {"id": "pn40", "rank": 40, "field": "機械学習（Hugging Face）", "headline": "コード用エージェントのハーネス工学を評価", "title": "Doc2Harness: Benchmarking LLMs on Long-Horizon Harness Engineering of Coding Agents", "url": "https://arxiv.org/abs/2610.20344", "authors": "Yuyao Ge ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "apa": "Ge, Y., Liu, S., Gao, P., Ge, C., Liu, C., Wang, Y., Mei, L., Bi, B., Yao, J., Guo, J., & Cheng, X. (2026). Doc2Harness: Benchmarking LLMs on Long-Horizon Harness Engineering of Coding Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20344", "why": "長期タスクのエージェントの性能がモデルと同じくらい周囲のハーネスに依存することに着目し、ハーネス構築能力を測るベンチマークを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "LLMエージェントの性能がモデルと同じくらい周囲の「ハーネス」に依存することに着目し、長期のハーネス工学そのものを決定論的に評価する2段階ベンチマークDoc2Harnessを提案した。", "p3": "第1段階でビルドモデルがインターフェースのみの契約骨格と12の最先端ハーネスの振る舞いをまとめた開発文書を受け取り、隔離コンテナで完全なハーネスを構築する。第2段階で凍結したハーネスをテストごとに別コンテナで走らせ、スクリプト化した模擬モデルで駆動し、モデルへの要求・ディスク上のファイル・終了コード・コマンド出力の4チャネルで採点する（抄録）。", "p5": "19の最先端モデルを各3回の独立ビルド・328テストで評価し、GPT-6 Astraが最高の53.05%、最弱モデルは27.44%で約26ポイントの差。最強モデルでもほぼ半分のテストに失敗し、失敗は横断的機能をモジュールにどう分割するかに集中した（抄録）。", "fun": "AIエージェントの出来は、頭脳（モデル）だけでなく手足や道具箱（ハーネス）で決まる。では、その道具箱をAI自身に設計させたらどうなるか。最高のモデルでも半分しか合格できず、つまずくのは「機能をどう部品に分けるか」という設計の基本だった。", "unverified": "19モデルの内訳は抄録にない。"}}, {"id": "pn41", "rank": 41, "field": "機械学習（Hugging Face）", "headline": "エージェント強化学習の自己蒸留の現実確認", "title": "More Methods, Better Agents? A Reality Check on Self-Distillation in Agentic Reinforcement Learning", "url": "https://arxiv.org/abs/2610.19789", "authors": "Linhao Zhong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-15", "apa": "Zhong, L., Fang, B., Wang, X., Shi, D., Luo, Z., Yao, G., Yuan, Y., Chen, H., Chen, J., & Shen, C. (2026). More Methods, Better Agents? A Reality Check on Self-Distillation in Agentic Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19789", "why": "公表ベースラインの条件が揃わないまま比較されてきた自己蒸留手法を、統一条件で再評価する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "エージェント強化学習の自己蒸留手法10種をGRPOと統一条件で比較し、どの手法も一貫してGRPOを上回らないこと、最終性能が不安定な訓練を隠しうること、追加の計算コストが性能に結びつかないことを示した。", "p3": "ALFWorld・ScienceWorld・Search-QA・WebShopで3つのモデル規模について、132回の訓練と計12,124.4 H800 GPU時間を記録し、事前学習バックボーンと11手法すべてを8つのロールアウトシードで繰り返し評価する。最終性能に加え訓練の進行・安定性・計測した計算コストを調べる（抄録）。", "p5": "GRPOに対する利得は範囲が限られ、全設定で一貫して上回る手法はなかった。強い最終性能が不安定な訓練を隠すことがあり、追加の訓練コストは一貫して性能向上に結びつかなかった（抄録）。", "fun": "新しい手法の論文は、以前の論文の数字をそのまま比較に使うことが多い。でも条件が違えば比較にならない。この研究は1万GPU時間以上をかけて10の手法を同じ土俵で走らせ、「基本の手法にはっきり勝てるものはなかった」と報告した。派手さはないが、こうした「現実確認」が分野を前に進める。", "unverified": "3つのモデル規模の具体値は抄録にない。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "忍耐の異なる顧客への動的サービス配分（二面市場）", "title": "Dynamic Service Allocation for Customers with Heterogeneous Patience in Two-Sided Platforms", "url": "https://doi.org/10.2139/ssrn.7607242", "authors": "Yuting Liu ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Liu, Y., Cao, Y., & Chen, F. (2026). Dynamic Service Allocation for Customers with Heterogeneous Patience in Two-Sided Platforms. https://doi.org/10.2139/ssrn.7607242", "why": "待ってもよい割引顧客と即時顧客への配分をMDPで定式化し、待ち時間に応じた閾値方策が市場規模nに対しO(1/n)の損失で漸近最適であることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "通常サービスと割引の「待って節約」サービスを提供するオンデマンド型二面プラットフォームで、待ち時間に応じた閾値方策が漸近最適であることを示した。", "p3": "最大待ち時間保証と期限切れ時の補償を持つ待ち節約サービスと、待っている間に離脱しうる顧客を、無限期間の長期平均報酬MDPで定式化する。次元の呪いを避けるため離散時間の流体近似を作り、顧客の待ち年齢が臨界閾値に達するまで待ち節約需要の充足を戦略的に遅らせる年齢依存の閾値方策を導く（抄録）。", "p5": "供給が潤沢なときは通常顧客を優先し、供給不足時には閾値を超えて待った節約顧客が優先されるという優先順位の逆転構造が現れる。年齢依存閾値方策は市場規模nに対しO(1/n)の損失比で漸近最適で、静的配分や状態依存配分より良い。連続時間への拡張では、問題が待ち節約の配車年齢閾値の最適化に帰着する（抄録）。", "fun": "配車アプリで「少し待てば安くなる」を選んだ客を、いつ乗せるべきか。答えは「車が余っているときは急ぎの客を優先し、足りないときは長く待った安い客を優先する」という逆転だった。待ち時間という一つの数字を見張るだけで、ほぼ最適になるというのが面白い。", "unverified": "数値実験での損失の大きさは抄録にない。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "量と質を一つにまとめる評価指標Perf", "title": "Perf as a Single Metric of Volume and Quality for Business and Marketing Evaluation", "url": "https://doi.org/10.2139/ssrn.7614661", "authors": "T. T. Eapen", "venue": "SSRN", "date": "2026-10-15", "apa": "Eapen, T. T. (2026). Perf as a Single Metric of Volume and Quality for Business and Marketing Evaluation. https://doi.org/10.2139/ssrn.7614661", "why": "総量と平均の積を単一指標とし、評価の基準点・品質プレミアム・証拠加重NPS・不確実性帯の拡張を提案する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "量（総数）と質（平均）の両方で異なる単位を比較するための単一指標Perf（総数×平均）を提案し、ビジネスデータ向けの拡張を示した。", "p3": "研究評価でPrathapが開発したエクセルギー指標と同じ式を、レビュー数と評価、口座数と価値などの比較に用いる。評価の基準点、1つの質問で較正する品質プレミアム、証拠加重のNet Promoter Score、企業評価のための顧客ベースPerf、不確実性帯を拡張として提案する（抄録）。", "p5": "提案と研究課題の提示であり、実証結果は抄録に記載がない（抄録）。", "fun": "レビューが1,000件で星3.9の商品と、50件で星4.8の商品はどちらが良いか。この論文は「件数×平均」というたった一つの掛け算で比べようと提案する。研究者の評価に使われていた式をそのまま商品や営業担当に転用し、星の基準点や自信の幅まで扱えるよう手を加えている。", "unverified": "提案指標の実データでの検証は抄録に記載がない。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "製造中小企業のデジタル変革と組織レジリエンス", "title": "Digital Transformation and Organizational Resilience in Manufacturing SMEs: The Role of an Innovation-Supportive Mechanism and the Boundary Condition of Organizational Readiness", "url": "https://doi.org/10.2139/ssrn.7611892", "authors": "Nguyen Minh Ha ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Ha, N. M., & Phan Thang, D. (2026). Digital Transformation and Organizational Resilience in Manufacturing SMEs: The Role of an Innovation-Supportive Mechanism and the Boundary Condition of Organizational Readiness. https://doi.org/10.2139/ssrn.7611892", "why": "動的能力理論に基づき、イノベーション支援機構と組織準備性を境界条件として、デジタル変革と組織レジリエンスの関係を検証する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベトナムの製造業中小企業で、デジタル変革が組織レジリエンスを高める経路がイノベーション文化によって媒介され、その経路が組織準備性の高いときにのみ有意になることを示した。", "p3": "動的能力理論に基づき、イノベーション文化を媒介、組織準備性を調整変数とするモデルを、製造業中小企業の経営者・管理者336人の調査データにPLS-SEMで当てはめる（抄録）。", "p5": "デジタル変革と組織レジリエンスには正の直接関係とイノベーション文化を通じた有意な媒介があり、組織準備性はデジタル変革–イノベーション文化の関係を正に調整した。調整媒介指標は有意で、準備性が高いほど間接効果が強まり、低い準備性では文化の経路が有意でなくなった（抄録）。", "fun": "デジタル化すれば会社は打たれ強くなる、とは限らない。この研究では、デジタル化が「新しいことを試す文化」を育て、その文化が打たれ強さを生むが、受け入れる準備ができていない会社ではその経路が消えてしまう。道具を入れる前に土台を整えないと効かない、という順番の話だ。", "unverified": "係数の大きさと調査時期は抄録にない。"}}, {"id": "pn45", "rank": 45, "field": "環境・気候政策", "headline": "数値気象モデルの相殺誤差をプロセス加算型NNで解きほぐす", "title": "Unmasking Compensating Errors in Numerical Weather Models: A Process-Additive Neural Network Approach", "url": "https://arxiv.org/abs/2610.19772", "authors": "Yuiko Ichikawa ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Ichikawa, Y., Groot, E., & Atkinson, J. (2026). Unmasking Compensating Errors in Numerical Weather Models: A Process-Additive Neural Network Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19772", "why": "異なる物理過程の誤差が互いに打ち消し合う問題に対し、過程ごとの加算型ニューラルネットワークで補償バイアスを分離する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大気モデルで異なる物理過程の誤差が互いに打ち消し合って原因が見えなくなる問題に対し、過程ごとの枝を持つプロセス加算型ニューラルネットワーク（PANN）で誤差を過程別に帰属する枠組みを提案した。", "p3": "単一カラムモデルを用い、PANNの各枝が別々の物理過程に伴う傾向誤差を表し、枝の出力の和が参照傾向に対する全誤差を近似する。訓練後の枝出力が過程レベルの誤差帰属と、平均すれば過程レベルのバイアス推定を与える。OpenIFSの単一カラムモデルの事例で、雲と対流の傾向が強く結合した雲関連過程に焦点を当てる（抄録）。", "p5": "初期実験の段階で、人間の物理過程の解釈を置き換えるのではなく、モデルの複雑さと過程の相互作用で直接診断が難しい領域へ拡張することを狙う。物理的に構造化された機械学習の解釈可能性として、補償誤差の理解と物理的に整合した天気・気候モデルの開発を支える（抄録）。", "fun": "天気予報モデルでは、雲の計算が少し間違っていても対流の計算が逆方向に間違っていれば、合計では合ってしまうことがある。合っているように見えるので直せない。この研究は、ニューラルネットに「雲の枝」「対流の枝」と分担させて、それぞれの誤りを別々に炙り出す。足し算の内訳を分解する発想だ。", "unverified": "帰属の精度を示す数値は抄録にない。"}}, {"id": "pn46", "rank": 46, "field": "環境・気候政策", "headline": "NN深層対流スキームで気候モデルの降水変動性を改善", "title": "Improved Precipitation Variability in the Community Atmosphere Model through Implementation of a Neural-Network Deep Convection Scheme", "url": "https://arxiv.org/abs/2610.20405", "authors": "Xavier J. Levine ほか", "venue": "arXiv", "date": "Thu, 15 Oct 2026", "apa": "Levine, X. J., Mooers, G., Atkinson, J. W., Khairoutdinov, M. F., Yuval, J., Orchard, D., & O'Gorman, P. A. (2026). Improved Precipitation Variability in the Community Atmosphere Model through Implementation of a Neural-Network Deep Convection Scheme (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20405", "why": "不確実性の主因である深層対流スキームをデータ駆動のニューラルネットワークに置き換え、物理的整合性を保ちつつ降水変動性を改善する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "気候モデルCAM6の深層対流スキーム（Zhang-McFarlane）を、嵐を解像する全球モデルから学習した全結合ニューラルネットワークに置き換え、10年以上安定に走らせて降水のバイアスを減らした。", "p3": "全球の嵐解像モデルgSAMの出力を粗視化してサブグリッドの対流フラックスと傾向を導き、ネットワークを訓練してCAM6に移植する。放射・乱流・他の雲過程は変えない（抄録）。", "p5": "10年以上安定に走り、エネルギーと水分を保存し、残りのパラメータ化を再調整せずに概ね現実的な気候を再現した。既定のZMスキームに比べ、弱い降水と極端な降水のバイアスが著しく減り、熱帯陸域の降水の日変化が多くの地域で誤った正午のピークから観測どおりの午後遅くのピークに移った（抄録）。", "fun": "気候モデルで最も不確かな「積乱雲をどう扱うか」の部分だけをニューラルネットに入れ替えた。心配されるのは計算が暴走することだが、10年分走っても壊れず、長年直らなかった「熱帯の雨が昼に降りすぎる」癖が観測どおり夕方に直った。全部をAIにするのではなく、一番苦手な部品だけ替える戦略が効いた。", "unverified": "バイアス減少の数値は抄録にない。"}}, {"id": "pn47", "rank": 47, "field": "環境・気候政策", "headline": "炭素ロックインを均衡選択問題として定式化", "title": "Carbon Lock-In as an Equilibrium Selection Problem: Returns to Scale, Returns to Adoption, and the Distribution of Consumer Preferences", "url": "https://doi.org/10.2139/ssrn.7613899", "authors": "Rolan Dahlan ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Dahlan, R., Yudha, G., Nugraha, A., Zulkarnain, I., & Prayoga, A. (2026). Carbon Lock-In as an Equilibrium Selection Problem: Returns to Scale, Returns to Adoption, and the Distribution of Consumer Preferences. https://doi.org/10.2139/ssrn.7613899", "why": "広く使われながら形式化の薄かった炭素ロックインを、規模の収穫・採用の収穫・消費者選好の分布から均衡選択問題として定式化する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "化石燃料技術が長く居座る「炭素ロックイン」を、供給側の規模の収穫逓増・需要側の採用の収穫逓増・消費者選好の分布が決める均衡選択問題として定式化し、政策の分類を導いた。", "p3": "炭素ベースの既存技術と緑の挑戦者の競争について、簡潔な動的モデルで均衡の構造を調べる。Unruh (2000) の「収穫逓増と採用障壁の引っ張り合い」という本来の機構を扱う（抄録）。", "p5": "両側とも収穫一定なら均衡は一意でロックインは起きない。中程度の収穫逓増では選好が技術間でほぼ中立なときにのみ複数均衡が生じ、選好形成が政策の決定的な余地になる。収穫逓増が強いと市場シェアの軌跡が平らになり、どんな選好分布も3回交わるため多重性は市場の構造的性質となり、歴史が均衡を選び、一時的介入は内部の転換閾値を超えない限り消え、多数派が私的に嫌う高排出均衡に留まりうる。弱い収穫逓増では選好側の手段で足り、強い場合は価格差と採用外部性の両方に閾値を越える協調介入が要る（抄録）。", "fun": "みんなが本当は電気自動車のほうがいいと思っていても、ガソリン車の社会から抜け出せないことがある。理由は「使う人が多いほど便利になる」効果が強すぎると、どちらが好きかに関係なく「先に広まった方」が勝つからだ。好みを変えるキャンペーンだけでは足りず、閾値を越えるまで一気に押す必要がある、という結論は政策の順序を変える。", "unverified": "モデルのパラメータの具体値は抄録にない。"}}, {"id": "pn48", "rank": 48, "field": "環境・気候政策", "headline": "ドイツ住民の炭素足跡の不平等は移動が8割を占める", "title": "Inequality of CO₂ Emissions. Carbon Footprint, Socioeconomic Correlates, and Adoption of E-Technology", "url": "https://doi.org/10.31235/osf.io/td4c3_v1", "authors": "Andreas Diekmann ほか", "venue": "SocArXiv", "date": "2026-10-15", "apa": "Diekmann, A., Ries, F., & Behringer, T. (2026). Inequality of CO₂ Emissions. Carbon Footprint, Socioeconomic Correlates, and Adoption of E-Technology. https://doi.org/10.31235/osf.io/td4c3_v1", "why": "登録ベース確率標本GLENで個人の炭素足跡を推定し、平均8.6トン、90パーセンタイルは10パーセンタイルの3倍で、不平等の約8割が移動（特に航空）に由来することを示した。", "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ドイツの住民の炭素足跡を登録ベースの確率標本で個人単位に推定し、排出の不平等のほぼ8割が移動（特に航空）に由来することを示した。", "p3": "German Longitudinal Environmental Study（GLEN）の第1波で、住居・移動・食事・消費を個人レベルで測る包括的なモジュールから炭素足跡を推定し、源泉分解で不平等の寄与を分ける（抄録）。", "p5": "排出は強く右に歪み、一人当たり平均8.6トンCO₂換算（公共インフラ込みで9.7）、約3分の2の人が平均未満で、90パーセンタイルの人は10パーセンタイルの3倍排出する。部門別は移動3.6、住居2.2、食事1.6、消費1.2トンで、移動は排出の4割超だが不平等の8割近くを占める。排出は所得（弾力性0.22）と教育で増え、環境意識と緑の党支持は低い足跡と関連し、ヒートポンプ・太陽光・電気自動車の採用は所得とともに増え持ち家層に偏る（抄録）。", "fun": "「平均的なドイツ人」の排出量を聞いても実態は分からない。3人に2人は平均より少なく、少数の人がたくさん出している。その差を生むのはほとんど移動、とりわけ飛行機だった。炭素税を考えるとき、誰が払うことになるかは「何をどれだけ使うか」の分布で決まる、ということがはっきり見える。", "unverified": "標本サイズと調査年は抄録にない。"}}, {"id": "pn49", "rank": 49, "field": "環境・気候政策", "headline": "ナッジと炭素価格：エコラベルへの消費者反応を測る", "title": "Policy Nudges vs. Carbon Pricing: Measuring Consumer Responsiveness to Eco-Labels and Food Sustainability Attributes", "url": "https://doi.org/10.2139/ssrn.7615688", "authors": "Ai Lin", "venue": "SSRN", "date": "2026-10-15", "apa": "Lin, A. (2026). Policy Nudges vs. Carbon Pricing: Measuring Consumer Responsiveness to Eco-Labels and Food Sustainability Attributes. https://doi.org/10.2139/ssrn.7615688", "why": "農業由来排出の削減で、上流の炭素価格とエコラベルなどのナッジに対する消費者の反応性を比較する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "食品の炭素税とエコラベルという2つの政策に対する消費者の反応を誘因整合的な離散選択実験で測り、両者が補完的（超モジュラー）であることを示した。", "p3": "都市・周縁の食品市場で2,480人の成人消費者に37,200の意思決定場面を提示し、スケールと選好の異質性を許す一般化多項ロジット（G-MNL）とWTP空間で導いたランダムパラメータロジットで価格プレミアムとWTPを推定する。知覚された気候リスクと第三者認証機関への信頼を区別する（抄録）。", "p5": "炭素税だけでも価格は炭素集約的な食品から速やかに離れるが、低所得者は逆進的な厚生損失を被る。信号機型のエコラベルは大きな価値プレミアムを生むが、効果は強く非線形で制度依存であり、制度への信頼が薄れると反応は統計的に有意でなくなる。小さな炭素税と信頼できるラベルを組み合わせると、削減弾力性は個々の和を大きく超える（抄録）。", "fun": "食べ物に炭素税をかければ効くが、貧しい人ほど痛い。ラベルで知らせる方法は痛みが少ないが、ラベルを出す機関を信じていない人には効かない。面白いのは、小さな税と信頼できるラベルを組み合わせると、それぞれの効果を足したよりずっと大きく効くという発見だ。1+1が3になる政策の組み合わせがある。", "unverified": "実験の国と地域、WTPの数値は抄録にない。"}}, {"id": "pn50", "rank": 50, "field": "環境・気候政策", "headline": "山火事早期対応の回避排出を評価：FireSatの事例", "title": "Valuing Avoided Emissions from Early Wildfire Attack: A FireSat Case Study in the Permafrost-Rich Boreal", "url": "https://doi.org/10.2139/ssrn.7611362", "authors": "Alejandro López-Aguilar ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "López-Aguilar, A., Fernández Intriago, L., & Kuwayama, Y. (2026). Valuing Avoided Emissions from Early Wildfire Attack: A FireSat Case Study in the Permafrost-Rich Boreal. https://doi.org/10.2139/ssrn.7611362", "why": "放置されがちな北方林の火災に対し、衛星による早期検知と初期攻撃が回避する炭素排出の価値を評価する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "北方林の遠隔地で、衛星による早期検知で山火事を逃げる前に叩くことが回避する炭素排出の価値を、FireSat衛星群を事例として推定し、費用対効果の高い気候介入になりうると示した。", "p3": "NASA ABoVE火災排出データベースの19年分の火災・炭素データに情報価値と費用プラス純価値変化の枠組みを組み合わせ、アラスカとユーコンの永久凍土の多い生態域で、早期検知が回避する排出を炭素の社会的費用で評価する。衛星の資本費用、追加の消火支出、直接の燃焼排出のみを数え、固定投資や火災の生態的便益、永久凍土融解の排出、健康の共便益などは除く（抄録）。", "p5": "この範囲で早期対応は1トンCO₂あたり約2.80〜9.08ドルで排出を回避し、管理の空白をどれだけ埋めるかに応じて便益費用比は20〜66倍になる。中心的な仮定ではどの炭素の社会的費用でも比は1を超え、185ドルではどの火災が逃げるか区別できなくても1を超える（抄録）。", "fun": "人がいない森の火事は「守るものがない」として放置されがちだが、燃えれば大量の二酸化炭素が出る。衛星で早く見つけて小さいうちに消せば、1トン減らすのに数ドルで済むという計算だ。排出を減らす方法としては驚くほど安いが、数えていない費用と便益が多いことも正直に列挙している。", "unverified": "省略した費用・便益の正味の方向は不明と著者自身が述べている。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "廉価GNSSとMEMS加速度計の融合で1mm振動を再捕捉", "title": "Feasibility of recapturing millimeter-level vibrations by fusing mass-market GNSS and MEMS accelerometer", "url": "https://doi.org/10.1007/s10291-026-02161-2", "authors": "Jacek Paziewski ほか", "venue": "GPS Solutions", "date": "2026-10-15", "sjr": 1.451, "citescore": 8.6, "citescore_year": "2025", "apa": "Paziewski, J., Wang, P., Sieradzki, R., Szczepanik, H., Fu, H., Geng, J., & Li, G. (2026). Feasibility of recapturing millimeter-level vibrations by fusing mass-market GNSS and MEMS accelerometer. GPS Solutions, 31(1). https://doi.org/10.1007/s10291-
