は、元のAIには手を付けず、横にそっと「目印を読む係」を付けて分割を実現する発想が面白い。", "unverified": "本文を入手できず、使ったデータセット・比較した手法・性能の数値は未確認。"}}, {"id": "jn20", "rank": 20, "field": "機械学習", "headline": "LLMと形式手法を組み合わせた神経記号推論", "title": "Synergizing LLMs and Formal Methods for Neural-Symbolic Reasoning", "url": "https://doi.org/10.1145/3812808", "authors": "Jin-Song Dong ほか", "venue": "Communications of the ACM", "date": "2026-11-10", "sjr": 1.54, "citescore": 14.1, "citescore_year": "2025", "apa": "Dong, J.-S., Cai, Y., Hou, Z., Sun, J., Wang, H., Zhang, Y., & Zuo, X. (2026). Synergizing LLMs and Formal Methods for Neural-Symbolic Reasoning. Communications of the ACM. https://doi.org/10.1145/3812808", "why": "LLMの出力は確率的で誤りやすく、形式手法は厳密だが使いにくい。両者を統合する神経記号的な枠組みを論じ、LLMが形式手法の敷居を下げ、形式手法が信頼性・解釈可能性・保証を与える事例を示す。", "explain": {"basis": "抄録", "basis_note": "Top10%誌（Communications of the ACM）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "LLMと形式手法を組み合わせた神経記号的な枠組みで、信頼できるAIを作る方向を論じた。", "p3": "LLMが形式手法の使いにくさを下げ、形式手法がLLMに信頼性・解釈可能性・保証を与える、という補い合いを、事例で示す論考。", "p5": "実証の数値はなく、LLMと形式手法の統合が、強力で、かつ作りによって信頼できるAIを作る有望な方向だと論じる（抄録）。", "fun": "文章を書くのが得意だがうっかり間違えるAIと、間違えないが使いにくい数学的な証明の道具を組み合わせて、得意と不得意を補い合う発想が面白い。AIが書いた答えを、数学の道具で自動的に確かめるような使い方になる。", "unverified": "本文を入手できず、取り上げる事例の中身は未確認。論考・解説の記事で、実験の数値はない。"}}, {"id": "jn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "取締役会と経営陣の緑のR&D経験の一致が革新を促す", "title": "Green Research and Development Experience Congruence at the Apex of the Firm: Boards of Directors, Top Management Teams and Green Innovation", "url": "https://doi.org/10.1002/bse.71845", "authors": "Penghui Dai ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-11", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Dai, P., & Morais, F. (2026). Green Research and Development Experience Congruence at the Apex of the Firm: Boards of Directors, Top Management Teams and Green Innovation. Business Strategy and the Environment. https://doi.org/10.1002/bse.71845", "why": "中国の上場企業のパネルデ   ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
