2.19%（§4.3）。", "p6": "実験はおもに合成の表と実共変量の再標本化に限り、ソースの変化・小標本・重い裾では被覆率が下がる（§4.3）。事前分布の拡張、より広い分布のずれでの不確実性の評価、媒介変数と結果の未測定交絡への感度分析は今後の課題（§5）。", "fun": "天気予報の「予測の幅」を、新しいデータごとに計算し直さずに、あらかじめ学習した「幅の予測器」で出す発想が面白い。基盤モデルの予測が持つ誤差の癖を、たくさんの人工のデータで学んでおき、信頼区間として返す。小さなデータでは少し自信過剰になる、という限界も示している。", "unverified": "付録（実装の詳細、実データ、追加の結果）と、被覆率の保証（§3.3の定理）の証明は読んでいない。数値の一部は表の記述から確認した。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "処置クラスターの操作変数は何を識別するか", "title": "Instrumental variables with treatment clusters", "url": "https://arxiv.org/abs/2611.13313", "authors": "Didier Nibbering ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Nibbering, D., Oosterveen, M., & Silva, P. L. (2026). Instrumental variables with treatment clusters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13313", "why": "複数の順序なしの処置をクラスターにまとめて操作変数法を使うと、元の処置のレベルの仮定のもとで局所平均処置効果の加重平均が識別されることを示した。元の処置選択のデータがあれば因果解釈の必要条件を検定でき、専攻分野（STEMと非STEM）の効果で例示する。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1、§4、§6.2.1の結果、§7の結論）を読んだ。付録の証明と§5のファジーRDDは読んでいない", "preprint": true, "p1": "複数の順序なしの処置をクラスターにまとめて操作変数法を使うと、元の処置のレベルの仮定のもとで、クラスター間の局所平均処置効果（LATE）の加重平均が識別されることを示した（要旨、§3）。", "p2": "STEMと非STEMのように処置をまとめて2値の処置とし、操作変数の仮定をクラスター水準で置くと、クラスター内の処置選択の変化が見えず、仮定の違反が見逃されうる。何が識別されるかも不明だった（§1）。", "p3": "処置・操作変数がともに多値で順序のないとき、仮定を元の処置の水準で置き、クラスターごとの推定量が、2つのクラスターの全処置の組と全操作変数の組のLATEの加重平均になることを示す（定理2）。元の処置の選択データがあれば、因果解釈の必要条件を検定でき、Holm補正つきで共同検定する（§4）。", "p4": "ポルトガルの公的高等教育の4コホートの行政データで、入試の合格点の境界を使うファジー回帰不連続デザインにより、学問分野のクラスターが修得単位数（2年目のECTS）に及ぼす効果を推定した。STEMと非STEM、ISCEDの8つの広い分野の2通りでクラスターを作った（§6）。", "p5": "STEM志望の学生で、STEM入学は2年目の修得単位を平均3.15単位減らし（約88時間分の学習負荷）、非STEM志望の学生で非STEM入学は1.33単位増やす（約37時間分）（表5）。この効果には、8×14×8×14=12,544個のLATEが含まれる。合格オファーで、STEM入学は88ポイント、非STEM入学は82ポイント上がる。Holm補正後、必要条件の有意な違反はなかった（§6.2.1）。", "p6": "必要条件を棄却できなくても、十分条件ではない（§4）。元の処置のデータがないときは検定できず、結果は1つの国の入試制度の応用にもとづく。", "fun": "「理系に進むと、2年目に取れる単位が3.15単位少ない」という結果の裏で、理系の中の8つの専攻と文系の14の専攻の、12,544通りの組み合わせの効果の平均になっている、という数の多さが面白い。ひとまとめにして楽をしても、中身をどう平均しているかは意識すべき、という教訓になる。", "unverified": "付録の証明、他の識別条件（部分識別・応答型の制限）、頑健性の検討（付録C）は読んでいない。"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "波及があっても予測ベースの反事実で効果を識別", "title": "Causal Inference under Interference with Forecast-Based Counterfactuals", "url": "https://doi.org/10.2139/ssrn.7682605", "authors": "Viviana Celli ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Celli, V., Cerqua, A., & Pellegrini, G. (2026). Causal Inference under Interference with Forecast-Based Counterfactuals. https://doi.org/10.2139/ssrn.7682605", "why": "処置の波及があり汚染されていない対照がない場合に、予測にもとづく反事実の方法が平均処置効果と波及効果を識別・推定できる条件を、潜在結果の枠組みで初めて形式的に分析した。シミュレーションと実証で、対照ベースの方法との長所と限界を比べる。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった（出版社は403）", "preprint": true, "p1": "処置の波及（干渉）が広くあるときでも、予測にもとづく反事実の方法（FBCM）が、全体の平均処置効果と波及効果を識別・推定できることを示した（抄録）。", "p2": "処置が他の単位の結果に及ぶと、干渉なしの仮定が破れる。既存の部分的干渉・曝露写像・空間・ネットワーク・構造の枠組みは、相互作用の構造への強い仮定や、汚染されていない対照単位を要する（抄録）。", "p3": "潜在結果の枠組みで、予測にもとづく反事実の方法（FBCM）が、平均処置効果と波及効果を識別・推定する条件を、初めて形式的に分析した（抄録）。", "p4": "シミュレーションと実証の応用で、FBCMの長所と限界を、最も広く使われる対照ベースの反事実の方法と比べた（抄録）。実証の対象と標本の規模は抄録に記載がなく、未確認。", "p5": "FBCMは、波及が広がっているとき、または曝露写像が未知のときでも、主要な集計的因果効果を識別できる（抄録）。具体的な数値は抄録にない。", "p6": "著者は、新しい方法の長所とともに限界も示すと述べるが、抄録には限界の中身がない。解釈：処置前の動きから作る反事実の予測が外れる場合には、効果の推定も外れうると考えられる。", "fun": "地域の政策のように、ある町の対策が隣の町にも影響する（波及する）と、「対策のない町」を比べ相手にできなくなる。この研究は、比べ相手に頼らず、対策前の動きから「何もしなかった場合の予測」を作って差を取る発想で、波及の効果まで測れる条件を整理した点が面白い。", "unverified": "本文を入手できず、抄録の範囲の解説。識別の仮定・シミュレーションの設計・実証の内容と数値は未確認。ワーキングペーパーで査読前。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "部分的な因果構造でも最小介入集合を求める", "title": "Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals", "url": "https://arxiv.org/abs/2611.14066", "authors": "Min Woo Park ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Park, M. W., & Lee, S. (2026). Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14066", "why": "構造的因果バンディットを、因果構造が部分的にしか分からない場合・他環境の情報・実現可能な反事実的行動へ拡張した。マルコフ同値のもとでの最小介入集合の図的な基準と探索アルゴリズム、部分的な移送可能性による報酬の上下界、後悔の保証を示す。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1、§4.3・§5.7・§6.6の実験、§7の結論）を読んだ。定義・定理・付録の証明は読んでいない", "preprint": true, "p1": "因果構造が部分的にしか分からない場合・他環境の情報がある場合・反事実的な行動が実現可能な場合へ、構造的因果バンディット（SCB）での、探索すべき行動の削減を拡張した（要旨、§1）。", "p2": "SCBは因果図を使って、最適な行動を残したまま行動の空間を減らすが、観測データだけでは因果図が1つに決まらず、他環境の情報の使い方や、反事実的な行動を実験できるときの扱いが不足していた（§1）。", "p3": "(1) マルコフ同値類（部分祖先グラフ、PAG）のもとで、最小介入集合と、最適でありうる最小介入集合（POMIS）の図的基準と探索アルゴリズム（§4）。(2) 操作できない変数と部分的な移送可能性により、他環境の情報から報酬の上下界を導き、支配関係で行動を刈り込み、上限を使うUCB（trUCB）で学習する（§5）。(3) 実現可能な反事実的行動を含む反事実のSCB（CTF-POMIS）（§6）。", "p4": "検証は、固定した有限のSCMでの数値実験。マルコフ同値は6課題（PAGは神託）、移送可能性は3つの2値SCM、反事実は4課題で、Thompson samplingとKL-UCBを組み合わせ、累積の擬似後悔を比べた（§4.3、§5.7、§6.6）。", "p5": "マルコフ同値では、6課題・2解法の12通りの比較すべてで、POMISの和集合が最も低い平均累積後悔だった。課題3では、全探索の19,683腕を54腕に減らした（§4.3）。移送可能性では、課題1でUCBの平均後悔247.1が、poUCBで94.8、trUCBで13.0に下がった（§5.7）。反事実では、CTF-POMISがCTF-MISより8通りすべてで後悔が小さく、課題1では37.7%と37.5%だった（§6.6）。", "p6": "保証の範囲は入力と仮定で決まり、実験は神託のPAG・正しい構造情報・有限の内生領域・固定した有限のSCMに限る。行動の削減は削減した空間の構築費用をなくさず、候補の列挙や構造の探索は指数的に増えうる（§7）。DMISの図的基準と判定の計算量は未解決（§7）。", "fun": "「どの手を試す価値があるか」を、試す前に因果の地図だけで絞り込む発想が面白い。たとえば薬の組み合わせのような全部の手を、19,683通りから54通りまで減らしても、最適な手は残る。因果の知識は、データの代わりにもなる、ということだ。", "unverified": "付録の証明と、定義・定理の詳細（§4.1、§5.3〜§5.5、§6.3〜§6.5）は読んでいない。実験は固定した小さなSCMに限り、一般的な性能は示されていない。"}}, {"id": "pn09", "rank": 9, "field": "経営学", "headline": "2つの差の差分析が同じ企業の同時調整かを診断", "title": "From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research", "url": "https://doi.org/10.2139/ssrn.7682778", "authors": "Josh Feng ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Feng, J., & Mahalingam, A. (2026). From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research. https://doi.org/10.2139/ssrn.7682778", "why": "環境の変化に企業が複数の選択を一緒に調整するかは、2つの差の差分析の平均効果だけでは分からない。独立な反応・意思決定の依存・共通の企業要因が同じ効果の組を生むことを示し、超過同時反応（EJR）の統計量を提案して4つの事例で適用した。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は取得できなかった", "preprint": true, "p1": "環境が変わると企業は相互依存する選択を一緒に調整する、という戦略経営の理論を、同じ企業が両方を変えたかで見る統計量（EJR）を提案する（抄録）。", "p2": "二つの選択に別々の差分の差分（DiD）を当てても、平均の反応が分かるだけで、同じ企業が両方を変えたかは分からない。独立した反応・意思決定の依存・企業に共通する要因は、同じ平均効果の組を生みうる（抄録）。", "p3": "超過同時反応（EJR）は、二つの選択を両方変えた処置企業の割合から、二つの反応が独立なら期待される割合を引いたもの。連続の結果変数と処置時期がずれる場合の版、異質性・依存の変化・時間順序を調べる三つの拡張もある（抄録）。", "p4": "手法の提案に加え、発明者の移動と特許取得、特許訴訟、環境規制、医薬品の買収の四つの場面に適用して、使い方を例示する（抄録）。", "p5": "抄録には、四つの適用の数値や、どの理論が支持されたかは書かれていない。推論の改善に役立つことの例示、と述べるにとどまる（抄録）。", "p6": "限界は抄録に書かれていない。解釈：EJRは「分離を助ける」ものと書かれており、依存と共通の企業要因の区別は、EJRだけでは決まらず追加の仮定が要る可能性がある。", "fun": "平均の効果が同じでも、同じ会社が両方を変えたのか、別々の会社が別々に変えたのかで、経営の意味はまるで違う。その差を「両方変えた割合から、独立なら期待される割合を引く」という引き算で見る発想が面白い。", "unverified": "本文を読んでいないため、EJRの定義式・仮定・拡張の中身・四つの適用の結果は確認できていない。共通の企業要因との分離がどこまで可能かも分からない。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "若年失業者への集中的な就職支援で就業確率が約10%上昇", "title": "Active Labor Market Policy for Unemployed Youths", "url": "https://doi.org/10.2139/ssrn.7690604", "authors": "Jeremy Hervelin ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hervelin, J., Villedieu, P., & Terriau, A. (2026). Active Labor Market Policy for Unemployed Youths. https://doi.org/10.2139/ssrn.7690604", "why": "フランスの大規模プログラムPACEAを、担当者へのほぼランダムな割当と担当者ごとの参加させやすさを使う操作変数法で評価した。完了後の就業確率が約10%上がるが、効果は就業の有無の面に限られ、賃金・契約の安定・職業の向上は伴わない。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は取得できなかった", "preprint": true, "p1": "フランスの大規模な若年失業者支援（PACEA。集中的な求職支援と職業訓練への斡旋）の因果効果を、四年間にわたって推定した（抄録）。", "p2": "参加の因果効果の識別が課題で、若者が担当相談員へ準ランダムに割り当てられることを使う。分析は、求職とマッチングの理論モデルに沿って進める（抄録）。", "p3": "詳細な行政データと、相談員への準ランダムな割り当て、および相談員ごとに若者を参加させやすい度合いが異なることを使う操作変数法で、四年間の因果効果を識別する（抄録）。", "p4": "対象は失業中の若者、データは行政データ。雇用確率に加え、賃金・契約の安定・職業の上昇を結果に見る。さらに、モデルをデータに当てはめて、非参加者への波及を調べる（抄録）。", "p5": "完了後の雇用確率は約10%上がるが、効果は就業するかどうかの面だけで、賃金・契約の安定・職業の上昇は伴わない。機序は、相談員との接触の強化、求職過程の構造化、短い職業訓練。非参加者への負の波及も確認した（抄録）。", "p6": "労働需要とプログラムの設計が、全体の雇用増加と費用対効果を左右する、と抄録は述べる。限界は書かれていない。解釈：負の波及があれば、全体の雇用増加は参加者への約10%より小さくなりうる。", "fun": "就業確率は上がるのに、賃金も契約の安定も職業の上昇も伴わない、という結果が面白い。参加者の得が非参加者の損で一部相殺されているなら（抄録は負の波及を報告）、個人への効果と社会全体の効果は別物になる。", "unverified": "本文を読んでいないため、操作変数の妥当性の検査、効果の標準誤差、波及の大きさ、費用対効果の数値は確認できていない。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "2025年の関税は売上と売上原価を3四半期で約1.2%減らした", "title": "Trade Wars on the Income Statement: The Effects of Tariffs on Firms", "url": "https://doi.org/10.2139/ssrn.7683087", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Barbiero, O., Sheremirov, V., Silva, A., & Stein, H. (2026). Trade Wars on the Income Statement: The Effects of Tariffs on Firms. https://doi.org/10.2139/ssrn.7683087", "why": "2018年と2025年の米国の関税への企業の曝露を、自社の輸入・仕入先の輸入・外国の報復で作り、四半期の財務諸表で効果を推定した。2025年は直接の輸入企業で売上と売上原価が3四半期内に約1.2%、仕入先経由で約0.5%減り、価格への一部転嫁と生産の縮小が見られ、報復は粗利益率を圧縮した。2018年の効果は小さい。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は取得できなかった", "preprint": true, "p1": "2018年と2025年の米国の関税が、企業の四半期の財務諸表にどう表れたかを、自社の輸入・仕入先の輸入・外国の報復の三つの曝露で推定した（抄録）。", "p2": "関税の影響は、自社で輸入しない企業にもサプライチェーンを通じて及ぶ。自社の輸入、仕入先経由、外国の報復を分けて、同時に測る必要がある（抄録）。", "p3": "企業ごとに三つの曝露指標を作り、四半期の財務諸表で、それらの効果を同時に推定する（抄録）。", "p4": "対象は2018年と2025年の米国の関税。データは四半期の財務諸表で、売上、売上原価、粗利益率などを見る。価格と生産への影響も、財務諸表から読む（抄録）。", "p5": "2025年は、費用の曝露が三四半期以内に売上と売上原価を同じだけ減らし、直接輸入する平均的な企業で約1.2%、仕入先経由で約0.5%だった。企業は関税を少なくとも一部は価格に転嫁し、利益率を削らず生産を縮めた。報復は粗利益率を圧縮した。2018年の効果は小さい（抄録）。", "p6": "限界は抄録に書かれていない。解釈：2025年の効果は三四半期以内の短期の推定で、その後の調整や長期の影響は抄録から分からない。", "fun": "関税は、自分で輸入しない会社にも仕入先経由で届く。直接の輸入企業の約1.2%と、仕入先経由の約0.5%を並べて見られる点が面白い。報復は価格や生産でなく粗利益率に効く、という経路ごとの違いも分かる。", "unverified": "本文を読んでいないため、曝露指標の作り方、推定式、標準誤差、価格への転嫁の程度、2018年の効果の大きさは確認できていない。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "有限予算ではスケーリング則が対数の直線からずれる", "title": "Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws", "url": "https://arxiv.org/abs/2611.13534", "authors": "Tianyu Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhao, T., & Ren, Z. (2026). Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13534", "why": "従来のスケーリング則は誤差を容量とデータ量の分離したべき乗則で表すが、有限予算では学習曲線と計算最適な配分がその直線から外れる。スペクトルとドメインの不均質性が外れを決めることを、Mellin–Barnes解析と水充填で理論的に示し、Aitken差分で損失の下限を除く初期化法を与える。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（要旨、§1、§2.3、§6の数値検証と公開ベンチマークの評価、§7）を読んだ。§3〜§5の導出と付録A〜Dの証明は読んでいない", "preprint": true, "p1": "ニューラルのスケーリング則が、有限の予算で対数対数の直線からずれる仕組みと、ずれを使った外挿・データ配分・計算配分の方法を、スペクトルとドメインの異質性から示した（要旨、§1）。", "p2": "古典則は超過リスクを、容量Nとデータ量Dの分離したべき乗で表す。有限予算では学習曲線も計算最適な配分もこの直線から外れ、最適配分の指数の報告は0.73から0.50まで食い違う（§1）。", "p3": "容量は、Mellin–Barnes解析の三項展開と、Aitken差分で損失の下限を消して得る初期値（§3）。データは、KKT双対性による水位注入と逐次サンプリング（§4）。計算は、等計算線C=6NDでの最適配分指数の変化が、指数の分散に比例することの証明（§5）。", "p4": "45個のスペクトルの数値検証と、公開のPythia（70M〜12B）、Chinchilla（245回の学習）、RegMix（17領域）で、小さな規模の予備実験から大きな規模を予測して検証した（§6）。", "p5": "Pythiaの検証誤差（MAPE）は、二パラメータの21.98%から三パラメータの5.89%へ（Deduped：22.13%→10.22%）（§6.4）。Chinchillaで高損失の学習を除くと配分指数は0.6712→0.5569、二次曲面で0.5288となり、後悔は最大76.4%減った（§6.4）。RegMixでは領域平均RMSEを最大59.4%減らした（§6.4）。", "p6": "Chinchillaは学習率の記録がなく、L≤3.15の閾値で学習を絞った（§6.4）。誤差は容量の誤差と標本の誤差の和とみなす（§2.3）。§7に限界の項は見当たらない。", "fun": "予備実験の点を狭い範囲に密に並べても、予測は良くならない。当てはめ誤差は4.7%→2.7%→2.1%と下がるのに、検証誤差はU字になる（§6.4）。大事なのは点を増やすことでなく、最小と最大のモデルの比を広げることだ（§7）。", "unverified": "付録A〜Dの証明と、定理の厳密な条件は読んでいない。検証は公開の記録に基づき、新しい大規模学習は本文から確認できなかった。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "文脈内学習に特徴学習は要らない", "title": "You Don't Need Feature Learning to Do In-Context Learning", "url": "https://arxiv.org/abs/2611.13431", "authors": "Joseph Turnbull ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Turnbull, J., & Simon, J. (2026). You Don't Need Feature Learning to Do In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13431", "why": "回転不変なカーネル機械で文脈内学習の線形回帰課題を調べ、サンプル数が増えると記憶する解の高次の成分を順に学ぶことを固有基底で示した。汎化する解は記憶解の低次の切り捨てで、学習はまず汎化し、のちに記憶へ劣化する。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（要旨、§1、§7〜§9と図1・3・4・5の説明）を読んだ。§4〜§6の導出と付録A〜Hは読んでいない", "preprint": true, "p1": "文脈内学習（ICL）で汎化と記憶がなぜ・いつ起きるかを、回転不変なカーネル機械で解析した。汎化解は記憶解を低い次数で打ち切ったもので、特徴学習は要らない、と結論する（要旨、§1）。", "p2": "ICLの学習目的のベイズ最適解は、新しい文脈も訓練タスクのどれかとみなして適用する記憶解で、未知のタスクへ汎化するのは逆説的に見える（§1）。この逆説を解く。", "p3": "Raventósらの線形回帰のICLで、カーネルの固有分解を得て、標本数が増えるほど記憶解の次数の低い成分から順に学ぶ姿を導く。第1段階は平均の訓練タスク、第2段階は次数3の汎化解、第3段階が記憶（§1、図1）。", "p4": "線形回帰のICL（図1はd=5、L=7、T=16）で、カーネル回帰の理論と実験を比べる。ランダム特徴のSGD学習（§7）と、12層のGPT-2型トランスフォーマー（T=256、d=8、L=16）（§8）でも確かめる。", "p5": "ランダム特徴のモデルは、タスクが4個しかなくても、約10^6標本で第2段階に入り、10^9標本まで記憶せずに汎化した（図3）。トランスフォーマーでは、尖度をなくした訓練タスクの集団は訓練を通じて汎化を保ち、尖度を一部だけ残すと通常より長く汎化を保った（§8、図5）。", "p6": "解析は、ガウス入力の線形回帰のICLに限る。非線形なICLと自然言語の影響は将来の課題（§9）。特徴学習のない模型は、記憶の段階に達しにくい（§9）。", "fun": "ICLの汎化は、記憶を学ぶ途中の「学習不足」にすぎない、という見方が面白い。汎化解は記憶解の次数3の打ち切りで、学習が進むほど汎化が崩れ、記憶に変わる。タスクを増やして効くのは、数でなく、ガウスに近づくからだ（要旨、§7.3）。", "unverified": "付録の導出（部分カーネル展開など）と定理1の証明は読んでいない。解析は線形回帰とガウス入力に限り、実際の言語モデルのICLに当てはまるかは確認できていない。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "事前学習・SFT・RLの計算配分を解析モデルで考える", "title": "An Analytical Model of Compute-limited Multistage Training Pipelines", "url": "https://arxiv.org/abs/2611.13276", "authors": "Nishil Patel ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Patel, N., Lee, J. H., Confavreux, B., & Saxe, A. (2026). An Analytical Model of Compute-limited Multistage Training Pipelines (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13276", "why": "線形オートエンコーダの事前学習、ノイズのある段階ラベルのSFT、まばらな報酬のRLを一つの高次元モデルにして、ランダム行列理論で学習の動力学を近似した。有限の事前学習データが表現に依存する性能の上限を課すことなどを示し、段階間の計算配分を考える土台を与える。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（要旨、§1、§5、§6）を読んだ。付録A〜Lの導出と実験の詳細は読んでいない", "preprint": true, "p1": "事前学習・教師あり微調整（SFT）・強化学習（RL）の多段階の学習で、段階の相互作用と、限られた計算量の配分を、解析できる高次元モデルで調べた（要旨、§1）。", "p2": "基盤モデルは多段階で学習されるが、段階の相互作用は十分に分かっていない。実験は計算と人手の注釈が高価で、仮説を試せる範囲が狭い（§1）。データが豊富で計算が限られる今は、収束まで学習せず、計算量の配分が性能を決める（§1）。", "p3": "線形オートエンコーダの事前学習、ノイズのある段階ごとのラベルでのSFT、まれなエピソード報酬のRLを持つ統計物理型のモデルを作る。ランダム行列理論と作用素射影の閉じ方で、近似的な低次元の微分方程式を導く（要旨、§1）。", "p4": "方程式をシミュレーションと比べ（図2）、実際のモデルではOLMo-2 1BをGSM8Kで学習し、3つのシードで、SFT後のRLとRLのみの学習曲線を比べた（図4b、付録J）。計算量の配分は数値最適化で求めた（§5.1）。", "p5": "事前学習のデータ比αに対しベイズ分類誤差はα^(-1/2)で減り、漸近のSFTとRLの誤差も同じ指数で減る（§5）。SFTはRLの初期の停滞を短くし、OLMo-2 1BでもSFT初期化の学習は報酬が速く上がり、RLのみは初め0付近だった（図4b）。RLの最適な計算の割合は、総予算とともに増えてから減る（図5a）。RLは課題に関係するスキルを強め、使われないスキルは大きく失われない（§5.2）。", "p6": "モデルは単層ネットワークの簡略化で、エピソード内の観測の独立を仮定する。SFTのラベルを集める費用は配分に含めず、符号化の重みは固定した（§6）。", "fun": "計算を増やしても、RLの最適な割合は単調に増えず、増えてから減る（図5a）。解釈：予算が増えたらRLに回す、という単純な方針では最適にならない。RLだけでは報酬がまれで長く停滞し、先にSFTを入れると停滞が短くなる点も面白い（図4）。", "unverified": "付録のODEの導出、ランダム行列の定数、報酬の厳しさの実験は読んでいない。解析は単層の簡略モデルで、実際の大規模なモデルの配分に当てはまるかは、OLMo-2 1Bの一例以外では確認できない。"}}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "選択後の推論の計算を擬似周辺MCMCで高速化", "title": "Pseudo-marginal Sampling for Selective Inference", "url": "https://arxiv.org/abs/2611.13492", "authors": "Jiali He ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "He, J., & Liu, S. (2026). Pseudo-marginal Sampling for Selective Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13492", "why": "適応的な選択のあとの推論は選択事象で条件づけるが、複雑な手順では分布が扱えず、棄却サンプリングは事象がまれだと高価になる。擬似周辺MCMCでこの条件つき分布を標本化し、弱ポアンカレ不等式で効率を解析して、古典的なファイル引き出し問題で両方法の計算量を導いた。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（要旨、§1、§5の数値実験、§6）を読んだ。§2〜§4の導出と付録A〜Cの証明は読んでいない", "preprint": true, "p1": "選択後の推論（適応的な選択の後で、選択の偏りを補正する推論）で、選択を条件にした分布から標本を取る計算を、疑似周辺MCMCで速くする手法を提案する（要旨、§1）。", "p2": "選択された事象を条件にする方法は、複雑な選択手続きでは条件付き分布が解析的に扱えず、標本抽出が要る。棄却サンプリングは、選択を再現した標本だけを残すため、選択がまれだと非常に高価になる（要旨、§1）。", "p3": "現在の状態の近くに提案を出し、選択手続きを走らせ直して観測された選択が再現されるかを調べ、Metropolis–Hastingsの採択で選択の分布を定常分布にする（§1）。弱いPoincaré不等式で、棄却サンプリングより効率が上がる条件を導く（§1、§4）。", "p4": "ファイルドロワー（出版バイアス）の問題で、PM・相関PM・棄却サンプリングの計算量を比べる（§1）。数値実験は、交差検証つきのラッソ（n=200、p=100）と変化点検出で、PM・相関PM（CPM、ρ=0.8）・棄却サンプリングを比べる（§5）。", "p5": "ラッソでは、PMとCPMの効率は棄却サンプリングの67.5倍と177.9倍、変化点検出では459.5倍と594.3倍（§5.2、§5.3、表1・2）。帰無のもとで、提案法のp値はほぼ一様だが、λを固定した方法は名目0.05に対し約0.2、素朴な方法は約1の棄却率だった（§5.2）。検出力はデータ分割より高い（§5.2、§5.3）。", "p6": "提案分布は、事前選択の共分散で尺度を決めたガウスのランダムウォークで、選択領域が分離すると動きにくい可能性がある。各反復の補助シミュレーションは1回（B=1）。扱うのは1つの仮説の検定で、信頼集合は重要度重みで作れると述べるにとどまる（§6）。", "fun": "棄却サンプリングで選択が再現される確率は4.3×10^-5と低いのに、PMの提案は約30%が選択を再現した（§5.2）。効率を決めるのは、選択のまれさそのものでなく、選択の確率が状態空間でどう変わるかだ、という分析が面白い（§1）。", "unverified": "付録A〜Cの証明（定理3.1、4.1〜4.3）と追加の数値結果は読んでいない。結果は二つの模擬データの設定で、実データでの検証は本文から確認できなかった。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "AIの読み手が割れても金額の合計を推定する", "title": "Counting Under Disagreement: Dollar-Weighted Measurement, Selective Machine Labelling and Budgeted Human Review from Disagreeing AI Readers of Administrative Text", "url": "https://arxiv.org/abs/2611.13215", "authors": "George Koomullil (Ascendr ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Koomullil, G. (2026). Counting Under Disagreement: Dollar-Weighted Measurement, Selective Machine Labelling and Budgeted Human Review from Disagreeing AI Readers of Administrative Text (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13215", "why": "1つの文面ラベルが多数の行政記録に当たり、目標が金額の合計で、人の読みも割れる設定を扱った。米国の税申告の助成目的の文面12万1,070件（79万9,675件・1,264億ドル）を規則分類器と3つの言語モデルでラベル付けし、651件を3人が読んで基準とした。固定予測器と交差適合の予測器の差推定量の条件を示し、8つの予測器の合計が補正後0.4億ドル以内で一致した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AIの読み手の判断が割れても、行政記録の金額の合計を、機械のラベルと限られた人手の確認で推定する方法を示した。", "p3": "米国の税申告の助成目的の文面121,070件（799,675件の記録・126.4Bドル）を、規則分類器と3つの言語モデルでラベル付けし、651件を3人が1つのコードブックで独立に読んだ。固定予測器の差推定量と、交差適合の予測器について、ポアソン抽出のもとでの正確な条件を示した。", "p5": "8つの予測器の合計は、補正後に0.4Bドル以内で一致した（もとの合計は11.2〜15.0Bドル）。予算100件の2段階の見直しの方針で、金額比例の抽出に対し合計のRMSEを28%減らした。独立な読み手によって推定の合計が3.93Bドル動き、これは読み手内の標本区間の2.2倍だった（抄録）。", "fun": "ある助成金の用途が「教育」か「医療」かは、人でも判断が割れる。そのとき、AIに全部読ませたうえで人が確かめるべき少数だけを賢く選ぶと、同じ予算で合計の誤差を28%減らせる点が面白い。ただし、読み手が変わるだけで合計が大きく動く、という注意も示している。", "unverified": "本文を入手できず、共形検定の誤り制御が運用で成り立つかは著者も未確立としており、個々の数値の導出は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "行列・テンソルのデータで構造的自己回帰を識別", "title": "Identification, estimation, and robust inference of structural autoregressions for multidimensional data", "url": "https://arxiv.org/abs/2611.13169", "authors": "Bernhard van der Sluis", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "van der Sluis, B. (2026). Identification, estimation, and robust inference of structural autoregressions for multidimensional data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13169", "why": "国別パネルのような行列・テンソル構造のデータで、係数にクロネッカー構造を仮定して構造的自己回帰の大域的な識別と扱いやすさを確保した。最小距離推定量の漸近分布と、近似的な分離可能性の誤りに頑健な構造的インパルス応答の信頼区間を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "国別パネルのような行列・テンソルのデータで、構造的自己回帰のショックを識別する方法を示した。", "p3": "係数にクロネッカー構造を仮定して、扱いやすさと大域的な識別を確保し、最小距離推定量とその漸近分布を導く。近似的な分離可能性の誤りに頑健な、構造的インパルス応答の信頼区間も示す。", "p5": "モンテカルロ・シミュレーションで、漸近近似と、推定量・（頑健な）信頼区間の有限標本の性能が良いことを示し、国のパネルデータで、米国の金融政策ショックの動学と波及効果を分析した（抄録）。", "fun": "国ごと・変数ごとに表になったデータをそのまま扱うと、必要なパラメータの数が爆発する。そこで、行の構造と列の構造の掛け算になっていると仮定して、数を減らす発想が面白い。米国の金利の動きが他の国にどう波及するかを、一度に分析できる。", "unverified": "本文を入手できず、識別の条件・シミュレーションの数値・実データの結果の大きさは未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "プライバシーを守った対比較から順位を推論", "title": "Differentially Private Statistical Inference for Rankings from Pairwise Comparisons", "url": "https://arxiv.org/abs/2611.13485", "authors": "Xintao Xia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Xia, X., & Gu, J. (2026). Differentially Private Statistical Inference for Rankings from Pairwise Comparisons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13485", "why": "LLMの順位づけに使う人の対比較の記録を守るため、Bradley–Terryモデルでエッジ差分プライバシーのもとでの得点と順位の推論を開発した。目的摂動推定量の有限標本の誤差界と、漸近的に妥当な信頼区間を導く。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "個人の好みの記録のプライバシーを守ったまま、人の対比較から得点と順位の推論をする方法を示した。", "p3": "Bradley–Terryモデルで、エッジ差分プライバシーのもとでの得点と順位の推論を作り、目的摂動推定量の有限標本の誤差界と、正則化バイアスの補正とGaussian-Laplace較正を組み合わせた信頼区間、順位の同時推論のブートストラップを導く。", "p5": "十分に密な比較グラフでは、より小さなプライバシー予算にも誤差界が拡張できる。比較の確率が公開で既知なら、提案した推論の手続きは追加のプライバシー予算を要しない。シミュレーションと、LLMの創作の順位づけへの適用で性能を評価した（抄録）。", "fun": "AIの強さのランキングは、人の「こっちのほうが良い」という投票でできているが、その投票を出した人のプライバシーを守ると、順位は不確かになる。この研究は、不確かさの幅を正しく見積もったうえで「本当に2位か」を言える信頼区間を出す点が面白い。", "unverified": "本文を入手できず、誤差界の具体的な値・実データの順位の結果は未確認。"}}, {"id": "pn19", "rank": 19, "field": "因果推論", "headline": "媒介確率の比による重みづけで直接・間接効果を推定", "title": "Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance", "url": "https://arxiv.org/abs/2611.13206", "authors": "Ariel Linden", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Linden, A. (2026). Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13206", "why": "結果モデルを立てずに媒介変数の分布を処置条件間で再重みづけして自然な直接効果と間接効果を推定するRMPWの既存の方法を、共通の枠組みにまとめた。連続媒介変数の異分散正規モデルを加え、複数の重み成分への2段階の分散推定を拡張し、全国健康調査と福祉就労の無作為化実験で例示する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "媒介確率の比による重みづけ（RMPW）の方法を共通の枠組みにまとめ、実践の指針とStataの実装を示した。", "p3": "結果モデルを立てず、媒介変数の分布を処置条件間で再重みづけして自然な直接効果と間接効果を推定する。既存の方法を統合し、連続の媒介変数の異分散正規モデルを加え、複数の重み成分への2段階の分散推定を拡張した。", "p5": "全国健康調査で性的少数者による喫煙の格差を分解し、福祉就労の無作為化実験で、プログラムから就業を経て母親の抑うつへの経路を調べた。シミュレーションでは、モデルが適切で重みが安定なときパラメトリックRMPWはよく働くが、正しい特定だけでは、集中した重みによる不安定な推定は防げない。推定した重みを固定として扱う標準誤差は信頼できず、2段階の推論とブートストラップは適切な条件で良好だった（抄録）。", "fun": "「どのくらいが直接の効果で、どのくらいが間に挟まる要因を通った効果か」を分ける道具は、政策の効果を理解する鍵になる。この論文は、結果の式を立てずに重みを付け替えるだけで分ける手法の、落とし穴（重みの偏り）まで丁寧に示している点が面白い。", "unverified": "本文を入手できず、シミュレーションの設定・実データの推定値は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "SGDの尾部平均の誤差界の隙間を埋める", "title": "Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression", "url": "https://arxiv.org/abs/2611.13383", "authors": "Qingyue Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhao, Q., Li, X., & Gu, Q. (2026). Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13383", "why": "高次元線形回帰で一定ステップ幅のオンライン確率的勾配降下法を尾部平均したときの過剰リスクに、初期化を明示した一致する上界と下界を示した。従来の上界は初期誤差の寄与を減衰させず、下界は初期化由来の分散を落としており、両方がゆるいことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "高次元の線形回帰での尾部平均つきSGDの過剰リスクに、初期化を明示した一致する上界と下界を示した。", "p3": "母集団の共分散のスペクトルと初期化を使った、軌跡のスペクトルのフィードバック条件のもとで、従来の上界と下界がどちらもゆるいことを示し、2つの具体的な一定ステップ幅の領域でその条件が満たされることを証明した。", "p5": "既存の上界は初期誤差の寄与を減衰させず、下界は初期化由来の分散を落としていた。頭の初期化に由来する速い成分の分散は、初期（バーンイン）の間に指数的に減衰するが、遅い成分に散らばる4次モーメントのエネルギーは平均化の窓まで残る。1次元・2次元の構成で、従来の下界の指数対多項式の隔たりを証明した（抄録）。", "fun": "「最初の数歩はあとで平均を取るから関係ない」と思いがちだが、最初の誤差が形を変えてあとまで残る道筋を、数学で突き止めた点が面白い。残る部分と消える部分を見分けると、これまでの理論が実は少しゆるかったことが分かる。", "unverified": "本文を入手できず、定理の仮定の細部と証明の中身は未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "ガウスカーネルの長さスケール推定の理論", "title": "Lengthscale Estimation for the Gaussian Kernel and Deterministic Response Functions", "url": "https://arxiv.org/abs/2611.13930", "authors": "Subhendu Pramanick ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Pramanick, S., & Karvonen, T. (2026). Lengthscale Estimation for the Gaussian Kernel and Deterministic Response Functions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13930", "why": "無限回微分可能なガウスカーネルの長さスケールの最尤推定量と交差検証推定量を、観測が固定の応答関数から出る固定領域漸近で調べ、この設定で初めて理論的な結果を示した。応答関数の正則性（フーリエ変換の減衰）に依存する下界を証明した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ガウスカーネルの長さスケールの最尤推定量と交差検証推定量が、データが増えるとどう振る舞うかの理論を、この設定で初めて示した。", "p3": "観測が固定の1次元の応答関数から出る場合の固定領域漸近を調べ、応答関数の正則性（フーリエ変換の減衰の速さ）に依存する、長さスケールの推定量の下界を証明した。", "p5": "帯域制限された関数と、フーリエ変換が指数的に減衰する関数について、推定量がデータ数nに対して少なくとも(log n)^((γ−2)/(2γ))と同じ速さで発散することを示した。細かく滑らかなマターンカーネルの結果と違い、観測点の幾何に仮定を置かない。数値実験で例示した（抄録）。", "fun": "ガウス過程は、関数がどのくらいなめらかかを表す「長さスケール」というつまみを持つが、関数が滑らかすぎると、データを増やすほどつまみがどんどん大きくなる、という不思議な振る舞いを証明している。モデルの「不確かさの見積もり」に注意が必要な理由が分かる。", "unverified": "本文を入手できず、証明の仮定と数値実験の結果の詳細は未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "ガウス過程のハイパーパラメータの変化で変化点を検出", "title": "Time Series Change Point Detection with Gaussian Processes", "url": "https://arxiv.org/abs/2611.13295", "authors": "Olga Isupova ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Isupova, O., Kuzin, D., Gustafsson, F., & Mihaylova, L. (2026). Time Series Change Point Detection with Gaussian Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13295", "why": "時系列の変化をガウス過程の事前分布のハイパーパラメータの変化と定義し、統計的仮説検定として定式化した。変化の前後の関数形を詳しく指定せずにオフラインとオンラインで複数の変化点を検出でき、理論的な保証と合成・実データでの評価を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "時系列の変化を、ガウス過程の事前分布のハイパーパラメータの変化として扱い、変化点を検出する枠組みを示した。", "p3": "変化を統計的仮説検定として定式化し、オフラインとオンラインの両方で複数の変化点を検出する。変化の前後の関数形を詳しく指定せずに、ハイパーパラメータの値をデータから学ぶ。", "p5": "理論的な保証を示し、合成データと実データで包括的に評価して効率を示した（抄録）。具体的な数値は抄録にない。", "fun": "「何がどう変わったか」を事前に決めずに、データの手触り（どのくらいなめらかか、どのくらいゆらぐか）の変化だけで、切り替わりの瞬間を見つける発想が面白い。センサの時系列などの切り替わりの検出に広く使える形になっている。", "unverified": "本文を入手できず、理論保証の条件・データセット・他の手法との比較結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "AI利用は同僚の評価と行動をどう変えるか（総説）", "title": "Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another", "url": "https://doi.org/10.31234/osf.io/ehbjv_v2", "authors": "Maxine Parker ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Parker, M., Huang, C., & Krastev, S. (2026). Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another. https://doi.org/10.31234/osf.io/ehbjv_v2", "why": "個人のAI利用が他者からの見られ方と行動をどう変えるかを、帰属理論や社会的交換理論などで説明した総説。観察者はAI利用を能力・意欲・温かさ・本物らしさの低さとみなし、開示しても信頼は回復せず、同僚の返報・知識共有・向社会的行動が減る一方、条件しだいで孤立を減らし調整を改善するとまとめる。未査読のプレプリント。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "個人のAI利用が、周りの人からの見られ方と同僚の行動をどう変えるかの研究を、人間どうしの理論で説明して整理した総説。", "p3": "帰属理論・社会的行為者としてのコンピュータ・組織的信頼の統合モデル・社会的交換理論・資源ベースの理論で、AI利用の影響を説明する。", "p5": "観察者はAI利用を、能力・意欲・温かさ・本物らしさの低さのしるしと読み、開示しても失った信頼は回復しない。同僚の返報・知識共有・向社会的行動も減る。ただし影響は条件つきで、孤立を減らし調整を改善する面や、上司・チームの支えで費用を和らげる面もある。費用は技術そのものより間接的な経路で生じるとまとめる（抄録）。", "fun": "「AIを使って書いた」と知ると、人はなぜかその人を「怠けている」と見てしまうことがある。この総説は、その見方が新しい現象ではなく、昔から知られている人間どうしの心理のルールで説明できることを示している点が面白い。", "unverified": "本文を入手できず、取り上げた研究の件数・個々の効果の大きさは未確認。未査読のプレプリントで、総説である点に注意。"}}, {"id": "pn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "公式リーダーとピアリーダーの役割の分類を作る", "title": "Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles.", "url": "https://doi.org/10.31234/osf.io/5b9sy", "authors": "Charlotte Marie Edelmann ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Edelmann, C. M., Boen, F., Stouten, J., & Fransen, K. (2026). Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles. https://doi.org/10.31234/osf.io/5b9sy", "why": "公式リーダーとピア（非公式）リーダーの行動を階層をまたいで捉える実証的な分類がないという課題に対し、文献統合と従業員35人への質的インタビューから、リーダーシップ機能の分類を帰納的に作った。未査読のプレプリント。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "公式リーダーとピアリーダーの行動を階層をまたいで捉える、実証にもとづくリーダーシップの役割の分類を作った。", "p3": "階層・学歴・業種・性別が異なる従業員35人への質的インタビューの内容分析でリーダーシップの機能を抽出し、参加者が個人とグループのカードソートで機能を高次の役割にまとめた。", "p5": "分類は公式リーダーの10役割とピアリーダーの10役割になり、既存の枠組みとの比較で、先行研究と一致する点と、拡張する点が示された（抄録）。", "fun": "リーダーとは役職のある人だけではなく、同僚のあいだで自然に舵を取る人もいる。この研究は、その両方のリーダーが実際にしていることを、働く人35人の話とカードの仕分けから、10個ずつの役割として整理した点が面白い。", "unverified": "本文を入手できず、各役割の中身・カードソートの手順の詳細は未確認。未査読のプレプリント。"}}, {"id": "pn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "チーム固有の技能への動学的投資を理論と実験で調べる", "title": "Dynamic investment and coordination in teams: Theory and experimental evidence", "url": "https://arxiv.org/abs/2611.13230", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gill, D., Prowse, V., & Reddinger, J. L. (2026). Dynamic investment and coordination in teams: Theory and experimental evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13230", "why": "チーム固有の技能への投資は持続的な利益を生むが、調整の成否に左右される危険な投資である。動学ゲームの理論枠組みを作り、実験室で投資に影響する要因を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "チーム固有の技能への動学的な投資を、理論と実験室の実験で調べ、効率的な水準より投資が少ないことを示した。", "p3": "チーム固有の技能への投資が、持続的な利益を生む一方で、チームの調整の成否に左右されて危険であることを、動学ゲームの理論枠組みにした。実験室の実験で、投資に影響する要因を調べた。", "p5": "効率的な基準より投資が少ないが、投資は誘因に強く反応し、理論が予測する特定の型と合う。事前登録した特性（心の理論と協調しやすさ）が、投資とチームの効率を予測した（抄録）。", "fun": "チームで仕事に慣れるには、特定の相手と息が合うまでの時間が必要で、その間は「無駄になるかも」という怖さがある。この実験は、その怖さのために人が投資を控えてしまうこと、相手の気持ちを読む力が高い人ほど投資することを確かめた点が面白い。", "unverified": "本文を入手できず、実験の規模・投資の水準の数値・誘因の設計は未確認。"}}, {"id": "pn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "ソフトウェア組織の11チームでAI利用は偏る", "title": "Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization", "url": "https://arxiv.org/abs/2611.14154", "authors": "Daniele Veri'", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Veri', D. (2026). Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14154", "why": "ソフトウェア組織の11チーム98件の構造化インタビューの記録で、標準化した質問で測った65人のうち55.4%がAI利用の頻度を4か5と答え、チーム別では20.0%から71.4%と差が大きかった。組織のAI方針の認識が限られる点も見られた。単一事例の記述的研究。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ソフトウェア組織の11チームで、AIの利用頻度が偏っていることと、組織のAI方針の認識が低いことを、記述的に示した。", "p3": "11チームの98件の構造化インタビューの記録を使った。標準化した10のチーム単位の質問（n = 65）と、回答の選択肢が別の1つの質問（n = 33）で測り、標準化した質問の結果を主な参照にした。", "p5": "標準化した質問の65人のうち36人（55.4%）が、AI利用の頻度を5段階の4か5と答え、チーム別では20.0%（1/5）から71.4%（5/7）まで差があった。方針の認識がないか細部が不確かな人は、頻度4〜5の群の86.1%（31/36）、0〜3の群の96.6%（28/29）だった。別の質問の群では33人のうち31人（93.9%）が4か5で、全体では68.4%（67/98）だが比較は限られる（抄録）。", "fun": "AIをよく使っていると答える人は多いが、会社のAIのルールを知っている人はほとんどいない、というずれが面白い。しかも使う頻度はチームによって20.0%から71.4%まで幅がある。ただし1つの会社の自己申告にとどまり、会社全体の話には広げない、と著者自身が限界をはっきり書いている。", "unverified": "本文を入手できず、インタビュー記録の内容と質問の項目は未確認。単一の組織の自己申告で、一般化はできない。"}}, {"id": "pn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "裁判所長の交代で倒産手続の長期化が鈍る", "title": "Judicial Performance, Bank Lending and Firms' Investments: Evidence from Court Leadership Turnover", "url": "https://doi.org/10.2139/ssrn.7683845", "authors": "Davide Moretti ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Moretti, D., Fiordelisi, F., Ruggiero, N., & Baltas, K. (2026). Judicial Performance, Bank Lending and Firms’ Investments: Evidence from Court Leadership Turnover. https://doi.org/10.2139/ssrn.7683845", "why": "イタリアの裁判所長の任命の外生的な変動を使い、交代が倒産手続の期間の伸びを遅くすることを示した。効果は新任が若い・管理経験がある・地元出身のとき大きい。司法の効率化で債権者の権利が強まり、銀行貸出が増え延滞が減り、大企業は無形資産へ投資を移す。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "裁判所長の交代が、破産手続の長期化を遅らせ、銀行貸出と企業投資にも波及することを示した。", "p3": "イタリアの裁判所長の任命のほぼ外生的な変動を使い、交代と破産手続の期間の伸び、銀行貸出・延滞・企業の投資との関係を調べた。", "p5": "交代は破産手続の期間の伸びを遅くする。効果は新任が若い・管理経験がある・地元に根ざしているとき大きく、キャリアの関心と組織的な学習が働くことを示唆する。司法の効率化で債権者の権利が強まり、銀行貸出が増え、延滞が減り、大企業は無形資産へ投資を移す（抄録）。", "fun": "裁判所のトップが替わるだけで、倒産の手続きが長引くスピードが変わり、その先で銀行の貸し出しや会社の投資の仕方まで変わる、という連鎖が面白い。「リーダーの交代」を、ほぼ偶然の出来事として使う工夫もある。", "unverified": "本文を入手できず、標本・推定の手法の詳細・効果の大きさは未確認。ワーキングペーパーで査読前。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "関税の発表は事前の信念に応じて期待インフレを上げる", "title": "Tariff News and Household Inflation Expectations: The Role of Prior Beliefs", "url": "https://doi.org/10.2139/ssrn.7683852", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-10", "apa": "Ramakrishnan, V. (2026). Tariff News and Household Inflation Expectations: The Role of Prior Beliefs. https://doi.org/10.2139/ssrn.7683852", "why": "2018〜2025年の米国の7つの関税の局面で、検索関心のピークの前後の個人内の1年先の期待インフレの改訂を、ニューヨーク連銀の消費者期待調査の面接日で比べた。2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の復活で1.72ポイント有意に上がった。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "関税の発表が、事前の信念に応じて家計の期待インフレを上げることを、2018〜2025年の7つの局面で調べた。", "p3": "Google Trendsで検索関心のピークを見つけ、ニューヨーク連銀の消費者期待調査の面接日を使って、ピークの前後の個人内の期待インフレの改訂を比べた。", "p5": "1年先の期待は、2018年の鉄鋼・アルミ関税の前後で1.18ポイント、2025年7月の相互関税の再開で1.72ポイント有意に上がった。ミシガンの別のパネルは、2025年4月のLiberation Dayで大きな改訂を示す。正の2局面では、それまでの期待が固まっていない世帯で改訂が大きい。金融リテラシーが低いと反応が大きい局面が複数あるが、消費・住宅・地域の関税の曝露は系統的に予測しなかった（抄録）。", "fun": "同じニュースを聞いても、「前から物価が上がると思っていた人」と「そうでない人」で、反応が違う。ニュースの中身より、聞く人の頭の中の準備が、物価の予想を動かすという見立てが面白い。検索の増えた日を目印にして、同じ人の前後を比べる工夫もある。", "unverified": "本文を入手できず、標本の規模・頑健性の確認・Liberation Dayの数値は未確認。ワーキングペーパーで査読前。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "評価の公表が後の戦略的コミュニケーションを損なう", "title": "Feedback Design in the Shadow of Strategic Communication", "url": "https://arxiv.org/abs/2611.13450", "authors": "Daiki Kishishita ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Kishishita, D., & Tsujita, T. (2026). Feedback Design in the Shadow of Strategic Communication (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13450", "why": "企業が従業員の潜在力の評価を公表したあと、従業員が個別の事情を上司に伝える組織で、最適なフィードバックを特徴づけた。情報量の多い評価は意思決定を助けるが、選好の対立を強めて後の伝達の信頼性を損ねうる。全面開示は、すべての事前信念で最適かすべてで最適でないかのどちらかになる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "従業員の評価を公表すると、後の戦略的なコミュニケーションが損なわれうる組織で、最適なフィードバックの方針を特徴づけた。", "p3": "企業が従業員の潜在力の公開の評価を設計し、そのあと従業員がプロジェクトごとの私的な事情を上司に伝えるゲームを作った。", "p5": "第1に、全面開示は、すべての事前信念で最適か、すべてで最適でないかのどちらかで、選好の対立が十分小さいか十分大きいときに最適。第2に、全面開示が最適でないとき、ある事前信念では無開示が最適で、均衡の伝達のメッセージ数が事後の信念で変わるときに限り、ある事前信念では部分開示が厳密に最適。第3に、最適な部分開示は、高い潜在力がまれなら低潜在力の従業員を、一般的なら高潜在力の従業員を確定的に特定できる（抄録）。", "fun": "「あなたは有望です」と評価を全部見せたほうが良さそうだが、評価が先に伝わると、上司と部下の意見の食い違いがはっきりして、あとの相談が信用されにくくなる場合がある。見せない・半分だけ見せるほうがうまくいく場合がある、という逆説が面白い。", "unverified": "本文を入手できず、モデルの仮定・証明・具体的な数値例は未確認。理論の論文で、実証はない。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "貧しい人が借りられないとき資本規制はなぜ弱いか", "title": "Macroprudential Policy When the Poor Cannot Borrow", "url": "https://doi.org/10.2139/ssrn.7682498", "authors": "Fernando Arce ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Arce, F., Levin, Y., & Tran-Xuan, M. (2026). Macroprudential Policy When the Poor Cannot Borrow. https://doi.org/10.2139/ssrn.7682498", "why": "不平等の大きい新興国で資本規制が少ない傾向を、実質為替レートを通じた分配の外部性で説明した。非ホモセティックな選好・担保制約に直面する高所得の借り手・手元の資金で暮らす低所得世帯の小国開放経済モデルで、最適な借入税をフィッシャー的な項と分配的な項に分解する。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "不平等の大きい新興国で資本規制が少ない傾向を、実質為替レートを通じた分配の外部性で説明した。", "p3": "非ホモセティックな選好、断続的に効く担保制約のある高所得の借り手、手元の収入で暮らす低所得世帯をもつ小国開放経済モデルで、最適な借入税をフィッシャー的な項と分配的な項に分解する。生産のある経済にも拡張した。", "p5": "不平等を取り入れると、平均の最適なマクロプルーデンス税が大幅に下がり、補助金に転じることもある。賃金が柔軟な限り、この機構は量的に重要なままである（抄録）。", "fun": "借金をする人が増えると、為替レートが動いて貧しい人の暮らしにも影響する。その「巻き添え」を考えると、借入に税をかけるのが良いとは限らず、むしろ補助が良いこともあるという逆の結論が面白い。", "unverified": "本文を入手できず、校正した数値・補助金に転じる条件の詳細は未確認。理論モデルで、ワーキングペーパーで査読前。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "長く知られた地震リスクが顕在化すると売却価格が下がり賃料が上がる", "title": "Environmental Risk Salience and Real Estate Markets", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13073", "authors": "Marco Letta ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "既知の環境リスクが破壊を伴わずに顕著になった場合の市場の反応を、イタリアの地震活動の再燃を自然実験として調べた。最も曝露した持ち家市場では売却価格が下がり、賃料は上がって、世帯は保有形態と空間で調整した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "長く知られていた環境リスクが顕著になると、被害の前でも、売却価格が下がり賃料が上がることを、イタリアの自然実験で示した。", "p3": "地震活動の再燃が、広い破壊・死者・公式のリスクの再分類なしに、公衆の注意を高めたイタリアの自然実験を使い、価格・賃料の反応と、競合する出来事の高頻度の混雑検定を調べた。", "p5": "最も曝露した持ち家市場で売却価格が下がり、賃料が上がって、世帯は保有形態と空間で調整した。無関係な出来事が注意を取り合うと、地震の信号への反応は弱まる。顕著さは、既知のリスクが決定に関わるものになり、被害の前に価格に織り込まれる過程の重要な一部である（抄録）。", "fun": "「そこは地震が起きる場所」とは前から知っていても、価格に表れるのは、ニュースで騒がれて注意が集まったときだった、という点が面白い。同じ時期に別の事件が起きると反応が弱まる、という、人の注意の限りも数字に出る。", "unverified": "本文を入手できず、価格・賃料の変化の大きさと推定の詳細は未確認。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "フィギュアの審判は自国選手に加点しライバルに減点する", "title": "Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging", "url": "https://arxiv.org/abs/2611.13194", "authors": "Jialin Liu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Liu, J., & Shen, S. (2026). Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13194", "why": "専門家の審査員の自国びいきを嗜好や情報の差と区別するため、フィギュアスケートの詳細なデータを使った。自国選手への戦略的な加点と、その近いライバルへの狙った減点を見いだし、加点は無作為な滑走順に沿って下がる。反実仮想の分析で、接戦の結果を左右しうると示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "フィギュアスケートの審判の自国びいきが、単なる好みでなく、近いライバルへの狙った減点を含む戦略であることを示した。", "p3": "詳細なフィギュアスケートのデータで、自国の審判による加点（自国プレミアム）と、その近いライバルへの減点を、無作為に決まる滑走順なども使って調べた。反実仮想の分析も行う。", "p5": "自国プレミアムは無作為な滑走順に沿って下がり、2022/23年より前は、近いライバルに自分の審判がいるときに上がる。減点は自国選手の順位の見込みとともに大きくなり、順位争いから外れると薄れる。この偏りは接戦の結果を左右しうる（抄録）。", "fun": "審判が自国の選手に甘いのは想像できるが、この研究は、それが「好み」でなく、ライバルの点を下げる作戦になっていることをデータで見分けた点が面白い。滑走順がくじ引きで決まることを、うまく実験の道具に使っている。", "unverified": "本文を入手できず、加点・減点の大きさと標本の期間は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "認知能力と自信過剰が課題の複雑さの選択を決める", "title": "Choosing Complexity: Cognitive Ability, Overconfidence, and Task Choice", "url": "https://arxiv.org/abs/2611.13259", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gill, D., & Qiao, Z. (2026). Choosing Complexity: Cognitive Ability, Overconfidence, and Task Choice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13259", "why": "成功報酬の取引条件の違う複雑な課題の選択を、理論と実験で調べた。認知能力の高い人は複雑な課題を選び、能力を一定にしても自信過剰な人は複雑な課題を選ぶ。約75%の判断で利得を最大にする課題を選んだ。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "認知能力と自信過剰が、成功報酬と取引条件の違う複雑な課題の選択をどう決めるかを、理論と実験で示した。", "p3": "複雑な課題の選択を、理論モデルと実験の両方で調べた。", "p5": "認知能力の高い人ほど複雑な課題を選び、能力を一定にしても、自信過剰な人ほど複雑な課題を選ぶ。約75%の判断で利得を最大にする課題を選ぶが、誤りは一方に偏り、最適に選べない人は複雑すぎる課題を選ぶ。組織は、複雑な課題への誘因に、能力と成功の見込みを評価できる情報とフィードバックを組み合わせるのがよい（抄録）。", "fun": "「難しい仕事に挑戦する人」は優秀な人だけでなく、自分の力を高く見積もりすぎる人でもある。間違えるときは、いつも背伸びしすぎる側に偏る、という点が面白い。挑戦を促すだけでなく、自分の力を知らせる情報を一緒に渡すとよい、という結論も身近。", "unverified": "本文を入手できず、実験の規模・モデルの式・効果の大きさは未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "不完全なデータで自治体別の多次元貧困を区間で推定", "title": "Estimating multidimensional poverty under incomplete data in North Macedonia", "url": "https://arxiv.org/abs/2611.14146", "authors": "Maja Gerovska Mitev ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Mitev, M. G., & Stojkoski, V. (2026). Estimating multidimensional poverty under incomplete data in North Macedonia (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14146", "why": "多次元貧困指数は国・地域より細かい水準では得にくい。センサスと地理空間データの世帯レベルの結合ができない状況で、独立性にもとづく点推定と、データと整合するすべての同時分布にわたる鋭い上下界を組み合わせて、北マケドニアの地域の貧困を推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "世帯ごとのデータをつなげない状況でも、自治体別の多次元貧困を、点推定と鋭い上下界で測る方法を示した。", "p3": "集落単位のサービスへのアクセスと自治体の国勢調査を組み合わせ、独立性にもとづく点推定と、データと整合するすべての同時分布にわたる鋭い上下界を組み合わせた。北マケドニアで適用した。", "p5": "全国で5.01%の世帯が多次元的に貧しく、上下界は2.01〜17.44%。貧困は小さな農村の自治体に集中し、どの依存構造でも、首都のほぼすべての自治体より貧しい。公的統計・Global MPI・現地調査の剥奪指標との照合で、指標の社会経済の部分は外部の指標と整合し、地理の部分は別の次元（へき地性）を捉える（抄録）。", "fun": "世帯ごとの情報がなくても、「貧困の重なり方」がどんな組み合わせでも成り立つ範囲を計算して、最悪でも最良でもこの範囲に入る、と言える工夫が面白い。点の推定だけでなく「どこまで言えるか」を同時に示すので、データが足りない国でも使える。", "unverified": "本文を入手できず、剥奪の指標の定義・上下界の計算の詳細・外部の指標との相関の数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "特許の保護が弱まると決算説明会の開示が増える", "title": "Patent Protection and Disclosure", "url": "https://doi.org/10.2139/ssrn.7690238", "authors": "Nemit Shroff ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Shroff, N., Xie, Y., Yoon, R., & Zhang, B. (2026). Patent Protection and Disclosure. https://doi.org/10.2139/ssrn.7690238", "why": "特許保護の弱まりが担保価値を下げ無担保債務への依存を高めて、債権者が将来のキャッシュフローの情報を重視するため開示が増えるという仮説を、2014年の米国最高裁のAlice判決を使って検証した。Alice判決の影響を受けた企業ほど決算説明会で情報を多く出した。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "特許の保護が弱まると、企業が決算説明会でより多くの情報を出すようになることを、2014年のAlice判決を使って示した。", "p3": "特許保護の弱まりが担保価値を下げ、担保つき債務を無担保債務に置き換えさせ、無担保の債権者が将来のキャッシュフローの情報を重視するため、開示の誘因が上がるという仮説を、2014年の米国最高裁のAlice判決で検証した。", "p5": "Alice判決の影響を受けた企業ほど、決算説明会で情報を多く出した。効果は、負債に関わる財務制約のある企業・以前に特許を担保にした企業・転用しやすい特許を持つ企業で強く、小企業と製品市場の競争が激しい企業で弱まった。影響を受けた特許は担保にされにくくなり、受けた企業は担保つき債務への依存を減らした（抄録）。", "fun": "特許が守られにくくなると、お金を借りるときの「担保」としての力が落ちて、その代わりに「情報を出して信用してもらう」しかなくなる、という因果の連鎖が面白い。最高裁の判決という、企業が選べない出来事を使って、原因と結果を見分けている。", "unverified": "本文を入手できず、効果の大きさ・標本・検定の詳細は未確認。ワーキングペーパーで査読前。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "ブラウザ選択画面でSafariからChromeへ移る", "title": "The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones", "url": "https://doi.org/10.2139/ssrn.7682467", "authors": "Leon Knoke ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Knoke, L., & Peukert, C. (2026). The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones. https://doi.org/10.2139/ssrn.7682467", "why": "EUのデジタル市場法で2024年に導入された、既定のブラウザを選ばせる画面の効果を、EUと非EUの国でブラウザと検索の市場シェアの前後比較で調べた。SafariからGoogle Chromeへ大きなシェア移動があり、他のブラウザの絶対的な増加は小さい。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "EUのデジタル市場法のブラウザ選択画面は、SafariからChromeへのシェア移動を生んだが、検索市場への効果は小さいことを示した。", "p3": "2024年にiPhoneで導入された、既定のブラウザを選ばせる画面の効果を、EUと非EUの国のブラウザと検索の市場シェアの、導入前後の比較で調べた。", "p5": "SafariからGoogle Chromeへ大きなシェア移動があり、他のブラウザの絶対的な増加は小さい。効果は導入前のエコシステムの存在で変わり、デスクトップのSafari利用が多い国ではSafariの損失が小さく、Googleのエコシステムが確立している国ではChromeの増加が大きい。検索市場では、両方のブラウザで既定がGoogleのため、Googleのシェアへの効果は無視できる程度だった（抄録）。", "fun": "「ブラウザを選んでください」という画面を出させても、結局、使い慣れた会社のサービスの連携の中に戻ってしまう、という現実が面白い。ブラウザの勝ち負けが変わっても、そこから生まれる検索のお金の流れは変わらない。規制のねらいどおりにならない理由が、エコシステムの結びつきにある。", "unverified": "本文を入手できず、シェアの変化の大きさ・推定の設計の詳細は未確認。ワーキングペーパーで査読前。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "レストランのカロリー表示は食料品の購買に及ぶか", "title": "Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases", "url": "https://doi.org/10.2139/ssrn.7682397", "authors": "Ali Umut Guler", "venue": "SSRN", "date": "2026-11-11", "apa": "Guler, A. U. (2026). Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases. https://doi.org/10.2139/ssrn.7682397", "why": "6つの地域の義務化とNielsenIQ Homescanのデータを使った積み上げ型の差の差分析と、593人の無作為化実験を組み合わせて、レストランのカロリー表示が世帯の食料品の購入に及ぶかを調べた。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "レストランのカロリー表示が、食料品店での購入にも波及することを、小売データと実験で調べた。", "p3": "6つの地域の義務化の周りで、NielsenIQ Homescanのデータを使った積み上げ型の差の差分析で、表示が実際に始まった地域と、同様の要件を採用したが持続しなかった地域を比べた。593人の無作為化実験で、食料品のカロリーの初期の過小評価と、メニューのカロリー情報がそれを減らすかを測った。", "p5": "情報の移転は、初期の過小評価が多く、食料品とメニューの品目を直接結びつけられるところで最も明確。この両方が当てはまるベーカリー品では、食料品店で買うカロリーが1人1日あたり2.31カロリー（18.7%、p = 0.012）減った。実験で更新が小さい品目では同様の減少がない。全乳から低脂肪乳への移行も見られた（抄録）。", "fun": "レストランのメニューでカロリーを見て、「パンはこんなに高カロリーなのか」と知ると、スーパーでも買うパンが変わる、という「情報の持ち越し」が面白い。表示の義務のないお店にも影響が出るので、レストランの売上だけを見ていると、効果の一部を見落とす。", "unverified": "本文を入手できず、標本の規模・頑健性の確認・実験の詳細は未確認。ワーキングペーパーで査読前。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "LLMの集約サービスは補完でもあり競合でもある", "title": "LLM Competition and the Aggregator Economy", "url": "https://doi.org/10.2139/ssrn.7683780", "authors": "Fupeng Sun ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Sun, F., Liu, Z., & Wiesemann, W. (2026). LLM Competition and the Aggregator Economy. https://doi.org/10.2139/ssrn.7683780", "why": "PoeやChatHubのように競合するLLMをまとめて売る集約サービスは、提供者にとって卸売のAPI収益を生む補完であると同時に、直販の購読を食う競合でもある。2つの提供者と選好の異なる利用者のゲーム理論モデルで、この二面性を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "競合するLLMをまとめて売る集約サービスが、提供者にとって補完でもあり競合でもあることを、ゲーム理論で分析した。", "p3": "2つのLLM提供者（それぞれ2つの機能の一方に強い）と、機能の好みが異なる利用者が、直接購読・集約サービスの購読・加入しないのどれかを選ぶゲーム理論の枠組みを作った。", "p5": "集約サービスは好みが均衡した利用者に使われる。市場が飽和していないと、カバー範囲を広げるが購読の共食いで提供者の収益を減らしうる。飽和した市場では既存の購読者の配分を変えるだけで、APIの価格が十分高いときだけ提供者に利益になる。使用量の違いがあると、使用量に応じた段階は、定額の直接購読を重い利用者にとって相対的に魅力的にする（抄録）。", "fun": "複数のAIをまとめて使える1つの契約は、利用者には便利だが、AIを作る会社にとっては「客を増やす窓口」であり「自社の客を奪う相手」でもある。強い機能を磨くべきか弱い機能を直すべきかで、集約サービスとの関係が変わる、という筋書きが面白い。", "unverified": "本文を入手できず、均衡の条件・数値例は未確認。理論モデルで、ワーキングペーパーで査読前。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "トランスフォーマーが構文の内外計算を段階的に獲得する", "title": "Stagewise and interpretable emergence of inside-outside computation in Transformer-based language models", "url": "https://arxiv.org/abs/2611.14221", "authors": "Jack T. Parley", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Parley, J. T. (2026). Stagewise and interpretable emergence of inside-outside computation in Transformer-based language models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14221", "why": "文脈自由文法の合成データで、トランスフォーマーが構文解析の内外アルゴリズムを学ぶ過程の学習動力学を調べ、損失の各段階が解釈可能に計算できることを示した。学習済みモデルが解析アルゴリズムを近似するという従来の事後的な研究に対し、獲得の過程を理論的に扱う第一歩となる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "トランスフォーマーが構文解析の内外アルゴリズムを学ぶ過程が、段階的で解釈できることを、合成の文脈自由文法で示した。", "p3": "木構造の形が変わる合成の文脈自由文法で、学習の動力学を調べた。表現を探って、内外計算の出現を、深さと訓練の進行に沿って可視化した。", "p5": "学習曲線の各段階が解析的に計算でき、隠れた潜在の木の変数の表現に結びつけられる。初期は局所（バイグラム・トライグラム）の情報を少数の初期層で使い、やがて、最も抽象的な潜在情報を中間層に符号化し、後半の層で最終の予測を精緻化するエンコーダ・デコーダ型の構造が育つ（抄録）。", "fun": "AIが文の構造を読み解く力を、いつ・どの層で身につけるのかを、段階ごとに数式で追える点が面白い。実際の大きなAIで見つかっている「中間層で抽象的な情報を作る」という組織が、人工的な簡単な文法でも自然に現れる。", "unverified": "本文を入手できず、解析の仮定・各段階の損失の式は未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "LLMの記号的な機構はどんな要因で現れるか", "title": "What drives the emergence of symbolic mechanisms in large language models?", "url": "https://arxiv.org/abs/2611.13270", "authors": "Melody Zixuan Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Li, M. Z., & Webb, T. (2026). What drives the emergence of symbolic mechanisms in large language models? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13270", "why": "抽象的な系列課題でニューラルネットをゼロから訓練し、アーキテクチャとデータ分布の要因を変えて記号的な機構の出現を調べた。表現・注意・因果媒介の分析で、トランスフォーマーが記号的な機構を獲得することを確認し、その要因を探る。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMの記号的な機構の出現は、アーキテクチャでなくデータの多様性が主な要因であることを、ゼロから訓練した実験で示した。", "p3": "抽象的な系列課題でニューラルネットをゼロから訓練し、アーキテクチャとデータ分布の要因を変えて、表現・注意・因果媒介の分析で記号的な機構の出現を調べた。", "p5": "トランスフォーマーが記号的な機構を獲得することを確認し、データの多様性のどの軸でも、多様性が高いほど記号的な特徴が強く出た。改変したトランスフォーマーや多層パーセプトロンでも同じ特徴が現れ、アーキテクチャの帰納バイアスは必要でない。実体と属性の結びつけの課題でも一貫した型が見られた（抄録）。", "fun": "AIが「ルールで考える」ような力を身につけるのは、特別な設計のおかげだと思われがちだが、実は、いろいろな種類のデータで鍛えたかどうかが決め手、という結果が面白い。単純な多層のネットワークでも同じことが起きる。", "unverified": "本文を入手できず、課題の設定・指標の定義・各条件の数値は未確認。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "概念による説明の因果効果を訓練の目的にする", "title": "Causal Concept Explanations for Deep Neural Models", "url": "https://arxiv.org/abs/2611.14407", "authors": "Josh Rountree ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Rountree, J., Verma, P., So, O., Fan, C., & Shah, J. A. (2026). Causal Concept Explanations for Deep Neural Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14407", "why": "概念にもとづく説明は相関的で、出力に必要でも十分でもないのに正しく見えて誤解を招きうる。経済学や疫学の介入媒介分析を訓練目的に使い、概念の説明の因果効果をそろえるCCW-Netを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "概念にもとづく説明が、モデルの出力に因果的に必要で十分になるように、介入媒介分析を訓練の目的にする方法（CCW-Net）を示した。", "p3": "経済学や疫学の介入媒介分析を訓練目的に使い、反事実の概念表現で、必要性・十分性・独立性の3つの因果の整合基準を定める。必要性は無関係な概念の効果をゼロに近づけ、十分性は関連する概念の表現が出力を完全に再現できるようにし、独立性は全体の効果が概念ごとに線形に分解することを求める。", "p5": "航空機の制御・運転・画像分類で評価した。概念の説明が、解釈できるだけでなく、定量的に因果であるものになるための一歩になる（抄録）。具体的な数値は抄録にない。", "fun": "AIが「これは犬の耳があるから犬だ」と説明しても、その説明が本当に判断の原因かは分からない。この研究は、その説明を外したら判断がどれだけ変わるかを数えて、因果として正しい説明になるよう学習させる点が面白い。", "unverified": "本文を入手できず、定量的な結果と比較した基準手法は未確認。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "実演から別の世界へ文脈内学習でロボット操作を移す", "title": "World In-Context Learning for Agentic Robot Manipulation", "url": "https://arxiv.org/abs/2611.12885", "authors": "Heng Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Fang, H., Guo, Z., Zhang, Y., Du, M., Liang, D., & Bai, X. (2026). World In-Context Learning for Agentic Robot Manipulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12885", "why": "文脈内学習は、別の場面で記録した実演に現在の世界からのフィードバックがないため、訓練した方策に及ばなかった。文脈内で学ぶのは見た目でなくタスクの手順と物体の役割という意味であることに着目し、固定したモデルが実演から始めて現在の世界で学び直すWICLを提案した（Hugging Faceの票52）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersで注目されたarXiv論文の抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "実演を1つ見たあと、シミュレーションで練習して得た知識を、重みでなく文脈に書き込む「世界での文脈内学習」（WICL）で、ロボット操作を学ぶ枠組みを示した。", "p3": "固定した基盤モデルが、実演から始め、シミュレーションなどの世界で課題を練習し、そのフィードバックを文脈に書き込む。RoboScriptは、課題ごとに学んだ知識を「課題の記憶」として固定し、新しい場面で、実機で得られる入力だけを使って展開する。", "p5": "RoboTwin 2.0の全50課題で、1課題1回の実演・勾配更新なしで、きれいな設定とランダム化した設定の平均成功率が83.4%で、最強の訓練した行動方策を20ポイント超上回った。視覚分布をまたいで一般化し、実機の2腕ロボットにも記憶の適応で移せた（抄録）。", "fun": "ロボットに新しい作業を覚えさせるには、普通は大量のデータで脳（重み）を鍛え直す。この研究は、頭の中は変えずに、仮想の世界で練習して得た「メモ」を手元に持たせるだけで、鍛えたロボット以上の成績になる点が面白い。", "unverified": "本文を入手できず、基準手法の種類・実機での成績の数値は未確認。"}}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "エージェントの記憶は根拠をたどれてこそ役立つ", "title": "Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents", "url": "https://arxiv.org/abs/2611.14320", "authors": "Yukyeong Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Lee, Y., Choi, Y., Baek, J., & Hwang, S. J. (2026). Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14320", "why": "外部記憶は過去の軌跡から作る教訓でエージェントを助けるが、元の軌跡と切り離されると、誤った教訓や誤用で、記憶なしなら解ける課題で失敗する。教訓を根拠の軌跡にひも付けて確かめられるWikiTraceを提案し、記憶による劣化を減らす（Hugging Faceの票41）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersで注目されたarXiv論文の抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントの外部記憶を、教訓と元の軌跡のつながり（根拠）ごと保存し、教訓を元の軌跡で確かめられるようにするWikiTraceを示した。", "p3": "各教訓を、簡潔な洞察として、その軌跡が成功・失敗した理由の要約と元の軌跡そのものにひも付けて保存する。新しい課題では、洞察が細部を欠く・矛盾する・失敗した課題由来のとき、リンクをたどって、端末ツールで細部を補うか洞察を直してから動く。", "p5": "5つのエージェントのベンチマークで、既存の記憶の方法と、同じ洞察だけを与えた基準を一貫して上回り、記憶による劣化も減らした（抄録）。具体的な数値は抄録にない。", "fun": "AIが過去の経験から学んだ「教訓」を覚えるとき、元の出来事を捨ててしまうと、教訓が間違っていても確かめられない。人間のノートでも、結論だけメモして根拠を残さないと、あとで間違いに気づけないのと同じで、根拠をたどれる形にしたのが面白い。", "unverified": "本文を入手できず、5つのベンチマークの名称・改善の大きさは未確認。"}}, {"id": "pn44", "rank": 44, "field": "計算社会科学・ネットワーク科学", "headline": "情報の発信源を早期にベイズ推論で特定", "title": "EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks", "url": "https://arxiv.org/abs/2611.13919", "authors": "Tao Wen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wen, T., Chen, Y.-wang, Zhao, J., Pan, C., Syed, T. A., Ahn, Y.-Y., & Cheong, K. H. (2026). EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13919", "why": "情報の氾濫の中で発信源をすばやく特定するため、進化計算でまばらな観測者を配置し、信頼性の異なる観測を一般化ベイズ推論で集約するEAGLEを提案した。人の観測者への依存を限り、観測の信頼度の違いを明示的に組み込む。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "大規模なソーシャルネットワークで、情報の発信源を、まばらな観測者から早い段階で特定する枠組み（EAGLE）を示した。", "p3": "進化計算でまばらな観測者を配置し、信頼性の異なる観測を一般化ベイズ推論で集約する。人の観測者への依存を少なくし、データの不確かさと雑音を明示的に取り込む。", "p5": "多様なネットワークと伝播の場面で、最先端のモデルを一貫して上回り、伝播の特徴やユーザの属性についての仮定に依存しなかった。Twitterの実際の伝播経路の実データで、少数の観測者から大規模ネットワークの発信源の候補を特定できる（抄録）。具体的な数値は抄録にない。", "fun": "デマや噂がどこから始まったかを、ネットワークのごく一部の観測者の報告だけから突き止める発想が面白い。観測者の報告の信頼度がまちまちでも、その不確かさを計算に入れて足し合わせる。", "unverified": "本文を入手できず、精度の数値・比較した手法・観測者の数は未確認。"}}, {"id": "pn45", "rank": 45, "field": "計算社会科学・ネットワーク科学", "headline": "二段階の伝染は人口の入れ替わりで振動する", "title": "Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity", "url": "https://arxiv.org/abs/2611.12920", "authors": "Francisco J. Mu\\~noz ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Muñoz, F. J., Nuño, J. C., Meacci, L., & Primicerio, M. (2026). Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12920", "why": "意見や技術の採用のように2回接触して初めて採用する二段階の伝染で、人口の入れ替わりがあると採用と放棄の波が生じる。平均場では超臨界のホップ分岐で振動が生まれ、1回目の接触の採用確率が低い、二段階が中心の伝染が必要になる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "意見や技術の採用のように2回接触して初めて採用する二段階の伝染で、人口の入れ替わりがあると採用と放棄の波が起きることを、解析とシミュレーションで示した。", "p3": "不活性な個人の貯蔵庫を通じた入れ替わりと、小さな自発的活性化率をもつ二段階伝染モデルを、平均場・線形雑音近似・対近似・シミュレーションで調べた。", "p5": "平均場では、振動は超臨界のホップ分岐で生まれ、1回目の接触の採用確率がQ ≲ 0.17と二段階が中心で、入れ替わりが遅いことが必要で、自発的な活性化は振動を壊す。有限の人口では、人口の雑音がこの範囲の外でも準周期を保つ。ネットワークの接続が少ないと振動が弱まり、対近似は持続する周期が臨界の平均次数より下で消えることを予測し、最大3.2×10^5ノードのシミュレーションで確認した。不規則な動きはカオスでなく雑音由来の準周期（抄録）。", "fun": "流行や考えの広がりが、増えたり減ったりする波になる仕組みを、数式で示している点が面白い。人の入れ替わりがあると、「1回聞いただけでは広まらない」流行が、周期的に盛り上がっては冷める。ネットワークがまばらだと、その波が弱まって、二段階の性質が見えなくなる。", "unverified": "本文を入手できず、各近似の導出と数値シミュレーションの詳細は未確認。"}}, {"id": "pn46", "rank": 46, "field": "計算社会科学・ネットワーク科学", "headline": "AIは研究助手として中国と米国のどちらかに偏るか", "title": "Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US", "url": "https://arxiv.org/abs/2611.14288", "authors": "Yuan Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, Y., Bertaglia, T., & Schroeder, R. (2026). Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14288", "why": "LLMが社会科学の研究助手として使われるとき、開発国の国々や学術の伝統に偏るかを、中国と米国に関する研究の質問で監査した。正解のない問いが多いため、国やそれに結びつく社会理論を有利に扱うかを調べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AIが研究助手として、開発国やその国の学術の伝統に偏るかを、中国と米国についての社会科学の小論文で監査した。", "p3": "米国・中国・一般の社会科学の質問に答える短い小論文をAIに書かせ、質問の種類（国際比較・国別・一般）、モデル（米国製2・中国製2・欧州製1）、依頼の様式（基本・研究者・米国の研究者・中国の研究者）の3条件を変えた。回答を、2人の研究者が偏りと出典の使い方で手作業で注釈した。", "p5": "全体としては、米国のモデルも中国のモデルも欧州のモデルも政治的な偏りはないが、引用する出典が違う。それでも、いくつかの比較の質問は一方の国を有利に扱い、その傾向は特定の質問で強い。研究者や学生は、社会科学でAIを使う際に注意すべきという結論（抄録）。", "fun": "「中国のモデルは中国びいき、米国のモデルは米国びいき」と想像しがちだが、答えそのものには大きな偏りがなく、むしろ「どんな資料を引用するか」に違いが出た、という結果が面白い。AIが研究の入り口になる時代の、地味だが大事な点検になる。", "unverified": "本文を入手できず、質問数・注釈の一致度・具体的な出典の違いは未確認。"}}, {"id": "pn47", "rank": 47, "field": "計算社会科学・ネットワーク科学", "headline": "判断の確信度の表示が情報源の選び方を変える", "title": "Displayed judgment certainty reorganizes source selection in self-formed networks", "url": "https://doi.org/10.31234/osf.io/fja3d_v5", "authors": "Gaël Carniel ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Carniel, G., Guigon, V., Moisan, F., Barrat, A., & Dreher, J.-C. (2026). Displayed judgment certainty reorganizes source selection in self-formed networks. https://doi.org/10.31234/osf.io/fja3d_v5", "why": "オンライン実験8セッションの273人が14の真偽のニュース見出しを評価し、費用をかけて観測ネットワークを作り、5回信念を更新した。判断の確信度（私的な確率判断の極端さ）の見え方を操作し、情報源の選択と後の正確さへの影響を調べた。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "判断の確信度を見せると、人が選ぶ情報源のネットワークは変わるが、正確さの平均的な向上は見られなかった。", "p3": "オンライン実験8セッションの273人が、14の真偽のニュース見出しを評価し、費用をかけて観測ネットワークを作り、5回信念を更新した。情報源の私的な確率判断の極端さである確信度の見え方を操作した。", "p5": "確信度を見せると、ネットワークが密になり、より確信度の高い情報源へのリンクが増えた。確信度は高いが誤った判断への曝露が増え、選ばれた情報源の相対的な正確さに明確な改善はなかった。正確さは繰り返しで上がったが、確信度の表示はこの向上を有意に増やさず、課題の報酬のもとで再構成した純スコアを下げた（抄録）。", "fun": "「自信満々に言う人」は目を引くが、自信があることと正しいことは別、という日常の経験を、実験で確かめている点が面白い。確信度を見せると、人は自信の高い人の意見に寄っていくが、正しい情報を選べるようにはならなかった。", "unverified": "本文を入手できず、予測モデルの比較の詳細・効果の大きさは未確認。未査読のプレプリント。"}}, {"id": "pn48", "rank": 48, "field": "計算社会科学・ネットワーク科学", "headline": "集計データから都市の移動を微視的に再現", "title": "Spatial patterns of transportation choice in Niter\\'oi", "url": "https://arxiv.org/abs/2611.14499", "authors": "Sandro Martinelli Reia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Reia, S. M., Anderson, T., & Pfoser, D. (2026). Spatial patterns of transportation choice in Niterói (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14499", "why": "安価な集計の静的な都市データから、微視的で動的な空間的に詳しい都市移動を作る枠組みを示した。合成人口・建造環境・交通網で日々のトリップを作り、徒歩・車・公共交通を割り当て、ブラジルのニテロイ約47.5万人の合成住民に適用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "集計された静的な都市のデータから、徒歩・車・公共交通の選択を含む微視的な移動を再現する枠組みを示した。", "p3": "既存の活動シミュレータを土台に、合成人口・建造環境・交通網を組み合わせて日々のトリップを作り、徒歩・車・公共交通を割り当てる。ブラジルのニテロイの約475,000人の合成住民に適用した。", "p5": "近隣ごとの公共交通の模擬の型は、実際の活動の代理指標と強く関連した（Pearson r=0.885）。徒歩は密な中心部で多く、車は周辺に向かって増え、公共交通はバスの回廊沿いで比較的高い。バス停への徒歩時間を30%減らすと、公共交通対車の比が11.3%増え、周辺のいくつかの地域でシェアの伸びが大きい（抄録）。", "fun": "都市の人の動きを細かく知るには高価なデータが要るが、人口や道路などの粗い統計だけから「仮想の住民」を作って動かす発想が面白い。バス停までの歩く時間を3割縮めると、車に乗る人が公共交通へ動くかを、仮想の街で試せる。", "unverified": "本文を入手できず、活動の代理指標の中身・合成人口の作り方・感度の分析は未確認。"}}, {"id": "pn49", "rank": 49, "field": "計算社会科学・ネットワーク科学", "headline": "携帯・路側・GPSの各データが交通シミュレーションに足す価値", "title": "Data-driven regional traffic simulation from heterogeneous mobility sources", "url": "https://arxiv.org/abs/2611.13947", "authors": "Federico Bellisardi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bellisardi, F., Mizzi, C., Fabbri, A., Micheli, D., Vannelli, A., & Bazzani, A. (2026). Data-driven regional traffic simulation from heterogeneous mobility sources (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13947", "why": "携帯電話データがトリップとその時刻を、路側センサーの半数が交通量の水準を、全センサーが局所の補正を、GPS軌跡が経路選択を決める、エミリア＝ロマーニャ州の日々の交通のエージェント・ベース・シミュレータを作り、各データの寄与を測った。評価は完全に独立ではない。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "携帯電話・路側センサー・GPSの各データが、地域の交通シミュレーションに何を足すかを測る枠組みを示した。", "p3": "エミリア＝ロマーニャ州の日々の交通のエージェント・ベース・シミュレータで、携帯のデータがトリップとその時刻、路側センサーの半数が交通量の水準、全センサーが局所の補正、GPS軌跡が経路選択を決める。シミュレーションなしの予測器との比較で、各データの寄与を測った。", "p5": "総交通量は冬に観測の1%以内、夏に10%以内。道路の順位づけは、道路種別の予測器より良い（冬のSpearman 0.67〜0.68対0.41〜0.48）。GPSは順位づけを、センサーは局所の推定を改善し、時刻は主に需要から来る。個々の道路の誤差は単純な予測器と同程度で、特定のOD対の検定は検出力不足で決着しなかった。評価は完全に独立ではない（抄録）。", "fun": "「データを増やせばよくなる」と思いがちだが、どのデータがどの部分の精度に効いているかを分けて測ると、役割がはっきり分かれる、という点が面白い。経路はGPS、量はセンサー、時刻は携帯の人の流れ、という分担になる。", "unverified": "本文を入手できず、評価の設計の細部・各データの寄与の数値は未確認。著者が評価は完全に独立でないと認めている。"}}, {"id": "pn50", "rank": 50, "field": "人口学", "headline": "国の富を人口と国土から測り直す", "title": "The Wealth of Nations According to Adam Population, Territory, and Welfare", "url": "https://doi.org/10.2139/ssrn.7685298", "authors": "Juan Carlos Cordoba", "venue": "SSRN", "date": "2026-11-11", "apa": "Cordoba, J. C. (2026). The Wealth of Nations According to Adam Population, Territory, and Welfare. https://doi.org/10.2139/ssrn.7685298", "why": "アダム・スミスの区別（一人当たりの繁栄と国の富）を、Barro–Becker型の王朝的選好で測る。国の富は統計的生命の価値に単位土地あたりの有効な生命の数を掛けたもので、87か国で米国は富で19位だが福祉で48位、中国の富は米国の45%（一人当たりでは14%）。1500年以降の世界の富は約173倍に増えた。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "国の富を、人口と国土の観点から、統計的生命の価値に単位土地あたりの有効な生命の数を掛けて測り直した。", "p3": "アダム・スミスの、一人当たりの繁栄と国の富の区別を、Barro–Becker型の王朝的選好で測る。各創始者の厚生が、別の人口の履歴を評価する。国の富は、統計的生命の価値に単位土地あたりの有効な生命の数を掛けたもので、消費換算でなく財で評価する。", "p5": "87か国で、米国は富で十九位だが、ストックの消費換算の厚生では四十八位。中国の富は米国の45%（一人当たりでは14%）。1500年以降、代表的な世界の集計の富は約173倍になり、ABJKの消費換算の尺度では3,714倍だった（抄録）。", "fun": "国のゆたかさを、一人あたりのお金でなく、「その国の土地で暮らせる人の数と命の価値」で測り直すと、順位が大きく入れ替わる点が面白い。人口の大きな国は、一人当たりが低くても、国の富としては大きく出る。", "unverified": "本文を入手できず、有効な生命の数の計算の仕方と、ABJKの尺度の定義は未確認。理論と推計の論文で、査読前。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "エッジ上でセンサ故障の診断と説明の一致を評価", "title": "Edge-based explainable multisensor fault diagnosis for structural health monitoring", "url": "https://doi.org/10.1177/14759217261504351", "authors": "Heba Al-Nasser ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Al-Nasser, H., Dragos, K., & Smarsly, K. (2026). Edge-based explainable multisensor fault diagnosis for structural health monitoring. Structural Health Monitoring. https://doi.org/10.1177/14759217261504351", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "構造ヘルスモニタリング（SHM）のセンサ故障診断を、エッジで動くGRU分類器と説明可能なAI（XAI）で評価する方法を提案する。予測と説明の一致を、課題に合わせて定量評価する（抄録）。", "p2": "SHMはセンサ測定の信頼性に依存し、センサ故障の診断はデータ品質の維持に欠かせない。エッジのSHM研究の多くは予測性能と計算の実現性に注目し、予測と説明の一致は十分に調べられていない（抄録）。", "p3": "故障したセンサと故障の種類を組み合わせたセンサ故障クラスを作り、検出・分離・同定を一つの分類課題で行う。既存のGRUベースの系列→ラベル分類器で多センサの時系列の窓を分類し、勾配×入力の寄与をセンサごとに集約する。最も寄与の大きいセンサが、予測クラスの示すセンサと一致するかを定量評価する（抄録）。", "p4": "独立に学習したエッジ配備を、集中型の配備と比べる。予測性能・説明の忠実度・センサごとの予測と説明の一致を評価する。集中型では、説明の安定性・寄与手法への依存・時間的な応答部分の影響も調べ、計算の実現性はエッジのみで評価する（抄録）。", "p5": "予測性能とセンサごとの寄与の傾向は、二つの配備でおおむね同程度だが、どちらも予測と説明の完全な一致には至らない。局所の忠実度は中程度、寄与分布の安定性は高いが、最も寄与するセンサの選択は手法で変わり、特定の故障クラスでは分類性能が応答の時間的な部分に左右される。エッジノード（NUC）で、予測と説明が窓の更新間隔内に平均で終わる（抄録）。", "p6": "概念実証の段階。より大きなセンサ網、別の構造、運用や環境条件の変化は今後の課題（抄録）。", "fun": "予測が当たっても、理由として示されたセンサが、予測した故障のセンサと一致するとは限らない。「当たったか」だけでなく「理由が合っているか」を、センサごとの一致として測る発想が面白い。しかも、一致は完全にはならない（抄録）。", "unverified": "本文を読んでいないため、データが実測か模擬か、センサ数、故障クラス数、予測性能・一致度・実行時間の数値は確認できていない。"}}, {"id": "jr02", "rank": 2, "headline": "複数橋の亀裂幅データを共通尺度にそろえて損傷を評価", "title": "A Data‐Driven Framework for Assessing Damage Development in Coupling Joints of Prestressed Concrete Bridges", "url": "https://doi.org/10.1155/stc/3195765", "authors": "Yasser Alqasem ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-11", "citescore": 10.3, "citescore_year": "2025", "apa": "Alqasem, Y., & Puttkamer, L. (2026). A Data‐Driven Framework for Assessing Damage Development in Coupling Joints of Prestressed Concrete Bridges. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/3195765", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "プレストレストコンクリート橋のカップリングジョイント（継手）の損傷の進みを、ひび割れ幅の変化の監視データから、橋をまたいで評価する機械学習の枠組みを作った（抄録）。", "p2": "継手は疲労に対して重要な部位で、静的解析では不備が出やすい。コンクリートがひび割れない間（状態I）は付着による疲労の危険が小さいが、ひび割れた状態（状態II）では応力を主にPC鋼材が受ける。ひび割れ幅の連続監視で状態を評価できる（抄録）。", "p3": "橋ごとに異なる監視データを共通の尺度に正規化して、比較できるデータベースを作る。正規化したデータを教師なし学習で状態別のクラスタに分け、フィードフォワードのニューラルネットワーク（ANN）で、回帰による状態評価を行う（抄録）。", "p4": "対象は三つの橋で、継手と基準断面を積分型の変位計で測ったひび割れ幅の変化（CWC）を使う。ANNは橋単位の交差検証で評価する（抄録）。", "p5": "正規化により、形状・支間長・構造系が違っても、損傷状態の水準で橋を比べられた。ANNは未知の橋でもCWC変動の傾向を捉えたが、CWCの絶対値の予測には差があり、予測の水準の橋間の転用には限りがある（抄録）。", "p6": "検討した橋は三つに限る。クラスタ分けは、構造特性が近い橋の間での評価の可能性を示すにとどまる。より広いSHMへの方法論的な基礎になりうる、と述べる（抄録）。", "fun": "形も支間も違う橋のデータを、共通の尺度に正規化して、損傷状態で橋どうしを比べられた点が面白い。一方で、ひび割れ幅の絶対値の予測は橋をまたぐと外れ、傾向は捉えても水準は転用できない（抄録）。", "unverified": "本文を読んでいないため、正規化の方法、クラスタの数と意味、ANNの入力と誤差の数値、三つの橋の詳細は確認できていない。"}}, {"id": "jr03", "rank": 3, "headline": "データが少ないときのベイズ更新の4つの戦略を総説", "title": "Bayesian Updating for Safety-Critical Structures under Limited Data", "url": "https://doi.org/10.1061/ajrua6.rueng-2074", "authors": "Xin Gu ほか", "venue": "ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems Part A Civil Engineering", "date": "2026-11-10", "citescore": 4.7, "citescore_year": "2025", "apa": "Gu, X., Li, Y., Zhao, Z., & Zhang, W. (2027). Bayesian Updating for Safety-Critical Structures under Limited Data. ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems, Part A: Civil Engineering, 13(1). https://doi.org/10.1061/ajrua6.rueng-2074", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "データが乏しい安全性重視の構造物で、ベイズ更新が信頼性評価に使えるよう、限られたデータへの対処法をレビューとして整理した（抄録）。", "p2": "ベイズ更新は事前知識と現場の観測を融合できるが、実務の監視データはきわめて少ない。尤度が不良設定になる、事前分布への感度が高い、次元の呪い、尤度の誤指定といった基本的な困難が生じる（抄録）。", "p3": "四つの先進的な手法を体系的にレビューする。効率的な標本抽出と近似、代理モデルを使う更新、多忠実度・多情報源のデータ融合、物理を組み込んだベイズ機械学習（抄録）。", "p4": "応用は、橋梁工学、地盤工学、洋上プラットフォームの基礎を要約する（抄録）。文献の検索範囲や選び方は、抄録に書かれていない。", "p5": "抄録に数値の結果はない。進歩は大きいが、デジタルツインでのリアルタイム更新、不正確な確率論の統合、時間変化する劣化モデル、水理特性と構造の相互作用の考慮が、研究の余地として残る、とまとめる（抄録）。", "p6": "疎なデータでも頑健にベイズの信頼性更新を行うための包括的な参照を目指す（抄録）。文献選択の偏りなどの限界は、抄録に書かれていない。", "fun": "データが少ないと、尤度が決まらない・事前分布で結果が変わるなど、ベイズの苦手な場面が一度に出る。それを、近似・代理モデル・多情報源・物理の四本立てで整理している点が面白い（抄録）。", "unverified": "本文を読んでいないため、文献の選び方、各手法の比較の中身、適用例の結果は確認できていない。"}}, {"id": "jr04", "rank": 4, "headline": "変分データ同化で縮約空間を作りオンライン推定を軽く", "title": "Online-efficient data assimilation informed reduced order modeling using offline PBDW", "url": "https://doi.org/10.1051/m2an/2026088", "authors": "Amina Benaceur", "venue": "ESAIM Mathematical Modelling and Numerical Analysis", "date": "2026-11-10", "citescore": 3.0, "citescore_year": "2025", "apa": "Benaceur, A. (2026). Online-efficient data assimilation informed reduced order modeling using offline PBDW. ESAIM: Mathematical Modelling and Numerical Analysis. https://doi.org/10.1051/m2an/2026088", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "疎なセンサ観測から実時間で状態を推定するための、新しい縮約モデルの方法を提案する。変分データ同化をオフラインで行い、オンラインでは観測だけで低次元の状態推定をする（抄録）。", "p2": "実時間の状態推定には、疎なセンサ観測と支配方程式を組み合わせる必要がある。標準のParameterized-Background Data-Weak（PBDW）を使いながら、計算を大きく節約することが狙い（抄録）。", "p3": "オフラインでは、訓練用のパラメータ集合について、高忠実度の偏微分方程式（PDE）と、縮約したPDE制約付き最適化問題を解く。データ同化で補正した解から、支配方程式と観測の構造を含む縮約近似空間を作る。オンラインは低次元の最小二乗系を解いて状態を再構成する（抄録）。", "p4": "数学的な定式化とPBDWとの構造の違いを導き、適切性・誤差推定・連続性に関する理論結果を論じる。二次元と三次元の数値例で性能を示す（抄録）。", "p5": "抄録に数値の結果は書かれていない。標準のPBDWと比べて計算を大きく節約できると述べ、数値例で性能を示す（抄録）。", "p6": "限界は抄録に書かれていない。", "fun": "重いデータ同化と高忠実度の計算をオフラインに寄せ、オンラインは低次元の最小二乗だけにする分業が面白い。観測の構造まで近似空間に組み込む点も特徴だ。標準のPBDWを土台にしつつ、計算を大きく節約するという位置づけも読み取れる（抄録）。", "unverified": "本文を読んでいないため、計算の節約の程度、誤差の理論の条件、二次元・三次元の例の詳細は確認できていない。"}}, {"id": "jr05", "rank": 5, "headline": "表形式データの合成の手法・評価・比較を総説", "title": "A Survey on Tabular Data Synthesis: Generation, Evaluation, and Benchmarking", "url": "https://doi.org/10.1002/wics.70078", "authors": "Suyeong Kim ほか", "venue": "Wiley Interdisciplinary Reviews: Computational Statistics", "date": "2026-11-11", "sjr": 1.486, "citescore": 9.0, "citescore_year": "2025", "apa": "Kim, S., Jeong, D., Lee, H., Kim, J. H. T., Kim, Y. M., & Im, J. (2026). A Survey on Tabular Data Synthesis: Generation, Evaluation, and Benchmarking. WIREs Computational Statistics, 18(4). https://doi.org/10.1002/wics.70078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "表形式データの合成（データ不足への対処、共有、解析用の拡張）について、古典的な統計手法・深層生成モデル・大規模言語モデル（LLM）を使う手法を横断してレビューした（抄録）。", "p2": "生成モデルの進歩を受けて、新しい合成手法が確立した統計的手法とどう関係するか、出力をどう評価するかを、更新して整理する必要がある（抄録）。", "p3": "古典的な統計手法、深層生成モデル、LLMを使う最近の手法を集め、生成の仕組み・モデルの仮定・限界を調べる。評価は三つの視点で論じる。分布の類似、下流での有用性、プライバシー（抄録）。", "p4": "補足として、六つのデータセットで十二の生成器の設定を比べる例示的なベンチマークを行い、報告した実験手順のもとで、データセットと指標による違いを調べる（抄録）。", "p5": "比較から、類似度と有用性のスコアは、プライバシー関連の診断と計算量とあわせて解釈する必要がある、と分かる。混在するデータ型、まれな観測、再現性、責任ある展開の課題も論じる。LLMを直接の生成器または補助として使うのが有用なのはいつか、が未解決の問い（抄録）。", "p6": "ベンチマークは例示的で、報告した実験手順のもとでの結果に限る（抄録）。", "fun": "合成データは、類似度や有用性のスコアだけでなく、プライバシーの診断と計算量とあわせて読むべき、という指摘が面白い（抄録）。背景：類似度が高いほど、元のデータを写している疑いも高まるため。", "unverified": "本文を読んでいないため、十二の生成器の名前、六つのデータセット、各指標の数値、LLMが有用な場面の具体的な結論は確認できていない。"}}, {"id": "jr06", "rank": 6, "headline": "外国の税務当局の閲覧が所得移転を抑えるか", "title": "The Effect of Non‐US Tax Authority Monitoring on Income Shifting by Affiliates of US Multinationals: Evidence From EDGAR Search Activity", "url": "https://doi.org/10.1111/1911-3846.70101", "authors": "Sabrina Chi ほか", "venue": "Contemporary Accounting Research", "date": "2026-11-11", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Chi, S., Persson, A. V., Shevlin, T., & Urcan, O. (2026). The Effect of Non‐US Tax Authority Monitoring on Income Shifting by Affiliates of US Multinationals: Evidence From EDGAR Search Activity. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70101", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "米国の多国籍企業（MNE）の子会社による所得移転が、外国の税務当局（FTA）の監視で抑えられるかを、EDGARのダウンロード記録から測った監視の強さで調べた（抄録）。", "p2": "各国政府は、MNEが国境をまたいで利益を移し、税を避けることを懸念する。本国の税務執行が租税回避を減らすことは知られているが、外国の税務当局が子会社の所得移転を抑えられるかは、ほとんど分かっていない（抄録）。", "p3": "FTAによる、SECに提出された米国MNEの年次報告書のダウンロードで、FTAの監視を測る。子会社の所得移転と、地元のFTAの監視・MNEグループ全体の監視との関係を分析する（抄録）。", "p4": "対象は米国MNEの子会社で、監視の測定はEDGARのダウンロード記録による。結果は、所得移転、その後の租税回避、課税の和解（抄録）。", "p5": "FTAの監視は、税率が高く、MNEの存在が大きい国で強い。地元のFTAの監視は所得移転を系統的には減らさないが、MNEグループ全体の監視は、地元のFTAが監視していない子会社にも関係し、監視の波及効果と整合する。関連は、情報交換条約があるとき、開示が詳しいとき、執行能力が高いときに強い（抄録）。", "p6": "ダウンロードが実際の調査を意味するかなど、測定の限界は抄録に書かれていない。解釈：ダウンロードは監視の代理で、調査や課税を直接観測するものではない。", "fun": "地元の当局が見ていなくても、他国の当局がグループ全体を見ていれば、その子会社に影響が及ぶ、という波及が面白い。税の監視は、国ごとに閉じた活動ではないことになる（抄録）。", "unverified": "本文を読んでいないため、所得移転の測り方、標本の大きさ、効果の大きさ、因果の識別の工夫は確認できていない。全体の監視とその後の租税回避・課税の和解の正の関連は、指標の向きが抄録から分からない。"}}, {"id": "jr07", "rank": 7, "headline": "開示イベントの並びで財務困窮がAUC0.9で予測できる", "title": "Regulatory Disclosure Sequences and Corporate Distress Risk: Evidence from Korean DART Filings", "url": "https://doi.org/10.1007/s10690-026-09651-w", "authors": "Yuyong Kim", "venue": "Asia-Pacific Financial Markets", "date": "2026-11-11", "citescore": 5.8, "citescore_year": "2025", "apa": "Kim, Y. (2026). Regulatory Disclosure Sequences and Corporate Distress Risk: Evidence from Korean DART Filings. Asia-Pacific Financial Markets. https://doi.org/10.1007/s10690-026-09651-w", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社HTML版の本文（要旨、§1、§3、§4.1〜§4.3、§5.1〜§5.3・§5.7・§5.8、§6〜§8）を読んだ。§4.4〜§4.10と§5.4〜§5.6・§5.9〜§5.11の詳細、表は読んでいない", "preprint": false, "p1": "開示される規制イベントの順序（系列）が、会計の基礎的な指標と市場の価格信号に加えて、将来の企業の財務困難について追加の情報を持つかを、韓国の資本市場で調べた（要旨、§1）。", "p2": "企業の財務困難は、財務比率・市場価格・信用事象・遅れて出る会計信号で監視される。単独の開示は曖昧でも、順序のある開示は、困難が表に出る前の高まる圧力を示しうる（§1）。", "p3": "韓国のDARTの主要事象の開示を、六つの規制分類に写し、時間を守った系列特徴量（累積・窓ごとの件数、最後の事象からの日数など）を作る。企業・年のアンカーから365日と730日以内の困難を、ロジスティック回帰とランダムフォレストで予測する（§3、§4）。", "p4": "2015〜2024年のDART開示、2025年までの結果で、19,924件・2,798社の企業年パネルを作る。検証は時間外（2021年までのアンカーで学習、2022年以降で検証）。困難の結果が少ない（365日で7,612件中55件）ため、ROC AUCに加え、平均適合率、リフトを使う（§3、§4.3）。", "p5": "開示系列の特徴量は、財務のみの基準を上回り、組み合わせたモデルで順位付けが大きく改善した。市場を除く365日の最良モデルはROC AUC 0.906、上位10%のリフト6.90で、ALTMAN型の部分的な指標のAUC 0.728とリフト3.85を上回る（要旨、§5.7）。市場価格の変数を加えた較正済みランダムフォレストでは、365日のAUC 0.9082、リフト7.08（要旨）。弱い結果の代理を除いても、730日のAUC 0.895が保たれた（§5.3）。", "p6": "結果の定義は、更生・解散・債務不履行・上場状況の代理を一つにまとめたもので、合併による上場廃止なども含みうる（§3.1、§7）。財務の基準は完全なAltmanやOhlsonの得点でなく、利用できる成分による代理で、差の大きさは過大に読めない（§5.7）。LLMによる検討は30件のみで、量的な主張はできない（§7）。", "fun": "単独では曖昧な開示でも、順序が揃うと困難の前兆になる、という点が面白い。強い使い道は、0.5の閾値の二値判定でなく、上位10%を重点的に見る監視リスト（ウォッチリスト）にある、と論文は述べる（§6）。", "unverified": "表の個別の数値（表2〜表4）と、§4.4〜§4.10・§5.4〜§5.6・§5.9〜§5.11の詳細は読んでいない。結果はパネルが一つの国に限り、困難の定義が混在する。LLMの検討は30件で、因果の主張でもない（§7）。"}}, {"id": "jr08", "rank": 8, "headline": "非公開企業の開示が公開企業の銀行借入依存を下げる", "title": "Private Firm Disclosures and Public Firms' Debt Choice", "url": "https://doi.org/10.2308/tar-2024-0646", "authors": "Fengqin Chen ほか", "venue": "Accounting Review", "date": "2026-11-10", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Chen, F., Pittman, J., & Saffar, W. (2026). Private Firm Disclosures and Public Firms’ Debt Choice. The Accounting Review, 1–30. https://doi.org/10.2308/tar-2024-0646", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "非公開企業の開示の透明性が、上場企業の銀行借入への依存を下げるかを、国をまたぐ標本で調べた（抄録）。", "p2": "非公開企業の開示が情報の非対称性を狭め、同業の上場企業に正の外部性を及ぼす、という見方を検証する（抄録）。", "p3": "経路は、監視需要・借入費用・信用格付けの質で検定する。横断面では、上場企業の不透明性が大きいとき、非公開企業の開示が同業にとって重要なとき、債券市場が発達しているときに効果が大きいかを見る。内生性には、電子的な商業登記の段階的な導入を外生的な衝撃として使い、模擬した開示の範囲を操作変数にする（抄録）。", "p4": "対象は国をまたぐ上場企業の標本で、データは公開された情報源から得ている（抄録）。", "p5": "非公開企業の開示が透明なほど、上場企業の銀行借入への依存は低い。経路は、監視需要の低下、借入費用の低下、信用格付けの質の向上に見られる。効果は、上場企業の不透明性が大きいとき、非公開企業の開示がより重要なとき、債券市場がより発達しているときに大きい。商業登記の段階的な導入と操作変数でも、結論は変わらない（抄録）。", "p6": "限界は抄録に書かれていない。操作変数の妥当性の検査と、標本の国の範囲は、抄録から分からない。", "fun": "隣の非公開企業が情報を開示すると、上場企業が銀行に頼らなくなる、という外部性が面白い。自社が何も変えなくても、周囲の開示が資金調達の選び方を変える。電子的な商業登記の段階的な導入という、開示の外生的な変化を使って確かめている点も特徴だ（抄録）。", "unverified": "本文を読んでいないため、標本の国数と企業数、効果の大きさ、操作変数の第一段階の強さ、各経路の検定の数値は確認できていない。"}}, {"id": "jr09", "rank": 9, "headline": "監査完了前の決算発表は監査報酬が平均10.8%高い", "title": "Does Releasing Earnings When the Audit Is Less Complete Increase Audit Costs?", "url": "https://doi.org/10.2308/ajpt-2024-102", "authors": "Ashleigh Bakke ほか", "venue": "Auditing", "date": "2026-11-10", "sjr": 2.32, "citescore": 5.3, "citescore_year": "2025", "apa": "Bakke, A., Bronson, S. N., Masli, A. N. S., & Schroeder, J. H. (2026). Does Releasing Earnings When the Audit Is Less Complete Increase Audit Costs? Auditing: A Journal of Practice & Theory, 1–28. https://doi.org/10.2308/ajpt-2024-102", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "年次の決算発表を監査の完了前に行う会社が、監査報酬を多く払うかを調べた（抄録）。", "p2": "決算発表は資本市場の参加者にとって重要な情報源で、価値は早さが左右するため、多くの会社が年次監査の完了前に発表する。完了前の発表がリスクの増加と関連するという先行結果を踏まえて、監査報酬との関連を調べる（抄録）。", "p3": "早期の決算発表と監査報酬の関連を推定し、発表日と監査報告日の間の日数で効果が変わるか、監査人と契約の特性にわたって一般的かを見る。さらに、顧客が早期発表に移った前後の変化分析で、報酬の増加の持続を見る（抄録）。", "p4": "データは本文中に示された公開の情報源による（抄録）。標本の大きさと期間は、抄録に書かれていない。", "p5": "監査の完了前に決算を発表する会社は、平均で10.8%高い報酬を払う。上乗せは、発表日と監査報告日の間の日数が長いほど大きく、監査人と契約の多くの特性にわたって見られる。早期発表に移った後も、報酬の増加は少なくとも二年続く（抄録）。", "p6": "決算を、監査人が年度末の作業を終える前に出すことの、直接の財務的な費用を示す証拠と位置づける（抄録）。早期発表が原因か、リスクの高い会社が選ぶだけかは、抄録から分からない。", "fun": "決算を早く出すと、投資家には役に立つが、監査人には費用になる、という点が面白い。平均10.8%の上乗せは、日数が長いほど大きく、早期発表に移った後も少なくとも二年続く（抄録）。", "unverified": "本文を読んでいないため、標本の大きさ、変数の定義、因果の識別の工夫、10.8%の標準誤差は確認できていない。"}}, {"id": "jr10", "rank": 10, "headline": "A/Bテストに合わせたLLMでメール件名のクリック率が32%上昇", "title": "EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests", "url": "https://doi.org/10.1177/00222437261510017", "authors": "Panagiotis Angelopoulos ほか", "venue": "Journal of Marketing Research", "date": "2026-11-11", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Angelopoulos, P., Lee, K., & Misra, S. (2026). EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests. Journal of Marketing Research. https://doi.org/10.1177/00222437261510017", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "A/Bテストの因果的な信号に言語モデルを合わせて、マーケティングの文面の効果を高める枠組みを作った（抄録）。", "p2": "無作為化実験は、どの内容が最良かだけでなく、改善の方向も示す。その方向を、生成モデルへの教師信号に使う（抄録）。", "p3": "実験内の比較を使って言語モデルを微調整し、成績の低い内容を高い内容へ変える改善器を作る。人間の専門家など任意の基準の判断者と組み合わせて、新しい内容への改善を提案できる（抄録）。", "p4": "検証は、メールマーケティングの大規模な現場実験で、36の新しいキャンペーンと283 million回の表示を使う（抄録）。", "p5": "整合したモデルで改善した件名のクリック率は、支援のない人間の専門家の件名より32%高い。パラメータが30倍多い汎用の言語モデルは、結果を改善しなかった。実験データへの整合が、モデルの能力だけを超える価値を加える、と示唆する（抄録）。", "p6": "限界は抄録に書かれていない。現場実験は電子メールの件名で、他の媒体や業種に広げられるかは、抄録から分からない。", "fun": "A/Bテストは、どちらが勝ったかだけでなく、どちらへ直せば良いかという向きも教えている、という見方が面白い。パラメータが30倍の汎用モデルより、実験で整合した小さなモデルの方が効いた（抄録）。", "unverified": "本文を読んでいないため、微調整の方法、32%の信頼区間、比較の統計的な有意性、実験が一つの企業・媒体に限るかは確認できていない。"}}, {"id": "jr11", "rank": 11, "headline": "定型の返信は返信率を上げるが満足度は下げる", "title": "EXPRESS: The Implications of Generic Responses in Online Customer Service Operations", "url": "https://doi.org/10.1177/10591478261508621", "authors": "Jitsama Tanlamai ほか", "venue": "Production and Operations Management", "date": "2026-11-11", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Tanlamai, J., Kar, W., Khern-am-nuai, W., & Adulyasak, Y. (2026). EXPRESS: The Implications of Generic Responses in Online Customer Service Operations. Production and Operations Management. https://doi.org/10.1177/10591478261508621", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "ソーシャルメディアの顧客対応で広がる、定型の（汎用的な）返信が、顧客の反応と満足度に与える影響を調べた（抄録）。", "p2": "企業はオンライン顧客対応に様々な戦略を使い、ソーシャルメディアは人気の場になっている。問い合わせに汎用的な返信で応じる実務が増えているが、顧客のエンゲージメントと満足度への影響は分かっていない（抄録）。", "p3": "米国の最大級の銀行の一つのソーシャルメディアのデータを分析し、機械学習で文章から必要な情報を抽出する。顧客の問い合わせへの汎用的な返信を処置とみなす、準実験的な設定を使う（抄録）。", "p4": "対象は米国の大手銀行の一つのソーシャルメディア上の問い合わせと返信。結果は、顧客が銀行へ返信するか、返信した顧客の満足度（抄録）。", "p5": "汎用的な返信は、顧客が銀行へ返信する確率を高める。返信した顧客の間では、汎用的な返信は満足度の低さと関連する。ただし、ある条件のもとで戦略的に使った汎用的な返信は、満足度の高さと関連する（抄録）。", "p6": "標本は一つの銀行に限る（抄録）。満足度が高まる条件の中身と、準実験の識別戦略は、抄録から分からない。", "fun": "定型の返信は、顧客が返信してくる確率を上げるのに、返信した顧客の満足度は下げる。この二つが同時に起きる点が面白い。使い方によっては満足度が上がる条件もある、と述べる（抄録）。", "unverified": "本文を読んでいないため、準実験の識別の方法、効果の大きさ、満足度の測り方、満足度が高まる条件の中身は確認できていない。標本は一つの銀行に限る。"}}, {"id": "jr12", "rank": 12, "headline": "ML型のAIサービスの公正・説明責任・透明性の尺度を開発", "title": "Perceived fairness, accountability and transparency toward ML-based AI service delivery: conceptualization and measurement", "url": "https://doi.org/10.1108/josm-11-2025-0609", "authors": "Oscar (Hengxuan) Chi ほか", "venue": "Journal of Service Management", "date": "2026-11-11", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Chi, O. (., Jia, S., Jo, E. H., & Chu, H. C. (2026). Perceived fairness, accountability and transparency toward ML-based AI service delivery: conceptualization and measurement. Journal of Service Management, 1–27. https://doi.org/10.1108/josm-11-2025-0609", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "機械学習（ML）ベースのAIサービスについて、消費者が感じる公平性・説明責任・透明性（FAT）の多次元の枠組みを概念化し、尺度として検証した（抄録）。", "p2": "FATの概念化が一貫せず、サービス向けの尺度が限られている。FATの知覚が、目標設定・コーディングと開発・実装の段階でどう生じるかを調べる（抄録）。", "p3": "多段階の尺度開発。項目は文献レビューと20件のインタビューで作り、専門家のフォーカスグループで表面的妥当性を確認した。二つの調査（n=448、n=535）で探索的因子分析・確認的因子分析・PLS-SEMにより、反映的・形成的なFAT構造を検証した（抄録）。", "p4": "三つ目の調査（n=455）で、既存のFAT尺度・信頼・利用意図との収束的・法則的妥当性を調べる。尺度は形成的で、信頼と利用意図への予測的妥当性を検証する（抄録）。", "p5": "FATは、目標設定・コーディングと開発・実装の段階にまたがって形づくられる多次元の構成概念として確認された。九つの一次因子はすべて、三つの高次のFAT次元を有意に形成する。尺度の信頼性と妥当性は高く、公平性と透明性が、信頼と利用意図に最も強く効く（抄録）。", "p6": "限界は抄録に書かれていない。解釈：測るのは消費者の知覚で、実際のAIの公平性や透明性そのものではない。", "fun": "AIへの倫理的な評価は、出来上がりだけでなく、目標設定・コーディング・実装という段階ごとに形づくられる、という段階の見方が面白い。信頼と利用意図に最も効くのは、公平性と透明性だった（抄録）。", "unverified": "本文を読んでいないため、九つの一次因子の中身、三つの高次の次元の名前、効果の大きさ、各調査の対象者は確認できていない。"}}, {"id": "jr13", "rank": 13, "headline": "孤独・つながり・感情的つながりは別の構成概念か", "title": "An Examination of the Empirical Distinctions Between Loneliness, Social Connectedness, and Affective Social Connection", "url": "https://doi.org/10.1007/s11205-026-03965-y", "authors": "Jayme Verhagen ほか", "venue": "Social Indicators Research", "date": "2026-11-11", "sjr": 0.918, "citescore": 6.4, "citescore_year": "2025", "apa": "Verhagen, J., Karg, A., Sivasubramaniam, D., Yeomans, C., & Farmer, J. (2026). An Examination of the Empirical Distinctions Between Loneliness, Social Connectedness, and Affective Social Connection. Social Indicators Research, 185(2). https://doi.org/10.1007/s11205-026-03965-y", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "出版社HTML版の本文（要旨、§1、§2、§3、§4冒頭、§4.5、§5）を読んだ。§4.1〜§4.4の考察の細部、表1・2、補足資料は読んでいない", "preprint": false, "p1": "孤独、主観的な社会的つながり、認知的な社会的つながり、社会的つながりの感情的な側面が、経験的に別の構成概念かを調べ、個人のウェルビーイングを最もよく説明するものを特定した（要旨、§1）。", "p2": "孤独やつながりの定義が複数あり、関連の結果も一貫せず、別の概念が混同される。重なりと違いを直接調べた研究は少ない（§1）。", "p3": "確認的因子分析（CFA）と構造方程式モデリング（SEM）。孤独はUCLA孤独感尺度（10項目の2因子版）、感情的な側面はADS（16項目）、認知的なつながりはSCS（8項目）、ウェルビーイングはPWI-A（7項目）で測る（§2.2、§3.1）。単独のモデルを先に推定し、統合モデルで固有の寄与を調べる（§2.3）。", "p4": "オーストラリアの成人398人（女性39%、男性60%）。オンラインパネルのクォータ標本で、年齢の分布を合わせるため40人を除いた（§2.1）。横断データで、構造の経路は因果を意味しない（§2.3）。", "p5": "主観的なつながりと感情的な側面は、弁別妥当性を確立できず（r=.85）、重なる。孤独・感情的な側面・認知的なつながりは区別される（§3.2）。単独のモデルでウェルビーイングの分散を説明する割合は、感情的な側面が54%、主観的なつながりが49%、孤独が44%、認知的なつながりが27%（§3.3）。統合モデルでは孤独の係数が最大（β=-0.43）で、認知的なつながりは負（β=-0.23）に転じ、抑制効果の可能性がある（§3.3）。", "p6": "横断の自己報告で因果は言えず、標本は男性に偏り、オーストラリアに限る。ADSは項目が多く冗長で、高く見えうる。単独のR²は他の構成概念と共有する分散を含む上限の推定（§4.5）。尺度は欧米圏で作られ、文化間の測定不変性は検定していない（§2.2）。", "fun": "孤独が減ることは、つながりが増えることと同じではない、という点が面白い。孤独尺度の肯定項目と否定項目は別の構成概念を測っており、孤独を一次元の指標とみなすべきでない、と論文は述べる（§5）。", "unverified": "表1・表2の数値と補足資料の不変性の結果、§4.1〜§4.4の考察の細部は読んでいない。横断データの自己報告で、因果は言えない（§4.5）。"}}, {"id": "jr14", "rank": 14, "headline": "自閉症の意味ある包摂への態度を測るMAIA尺度", "title": "Community Attitudes Toward Meaningful Autism Inclusion", "url": "https://doi.org/10.1177/13623613261498495", "authors": "Nicole L. Matthews ほか", "venue": "Autism", "
