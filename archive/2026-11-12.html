<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </footer>
</div>

ので、全体の表は未確認。査読前の博士論文で、書き換えられうる。"}}, {"id": "pr02", "rank": 2, "headline": "LLMエージェントが非線形系の同定を自動で行う", "title": "ASPIRE: An Agentic System-Identification Platform for Iterative Reasoning and Exploration", "url": "https://arxiv.org/abs/2611.13114", "authors": "Erik Derner ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Derner, E., Kubalík, J., & Babuška, R. (2026). ASPIRE: An Agentic System-Identification Platform for Iterative Reasoning and Exploration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13114", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§4の枠組み、§5〜§8の実験・考察・結論）を読んだ。付録のモデルの式は読んでいない", "preprint": true, "p1": "LLMエージェントが、計測データから閉形式の非線形モデルを選び、推定・検証・解釈まで行う同定の枠組み（ASPIRE）を示した（§4、§8）。", "p2": "システム同定は、手法の選択・物理的な事前知識の取り込み・モデルの検証に専門家の判断が要り、既存の式探索（PySINDy、PySR）は物理的な要件を入れにくい（§1、§6.1）。", "p3": "エージェントが手法を選んでコードを書いて推定し、枠組み（ハーネス）が試験データを密封したまま誤差を計算して、物理的な要件を記号的に検証する。各モデルにパラメータ・推定の記録・各項の解釈が付く（§4.1、§4.5）。", "p4": "移動ロボット・乾燥摩擦のある回転系・発酵槽の3つの実測系で、系の説明あり／なしの課題を各5回、計30回実行した。PySINDy・PySRと比べ、記録の質は手作業で150項目を評価した（§5、§6、表7）。", "p5": "30回すべてが有効なモデルを出し、1回の費用は0.96〜3.38米ドル（§6.4）。発酵槽では推奨モデルの最大の試験誤差0.0239 barが、両ツールのどのモデルより小さく、摩擦系ではPySRとの差は標準偏差より小さい（§6.1）。説明がなくても試験誤差は増えず、モデルの形が変わった（§7.1）。記録は132項目が「はい」、18が「一部」、0が「いいえ」で、9件に由来の記述と実行ログの食い違いがあった（§6.3、§7.2）。", "p6": "試験データは著者には密封されておらず、1つのLLMだけで評価し、出力が1つで状態が測定できる系に限る（§7.4）。説明の有無は試験誤差に出ないため、静止時の加速度の向きなどの物理的な性質は別に評価が要る（§7.1）。", "fun": "データから「この装置の動きを表す式」をAIが自分で探して書き、「なぜこの式か」の説明書まで付ける点が面白い。式が物理的におかしくないかを、証明するか、ダメな例を探す検査にかけるのも、機械に任せるときの安心になる。しかも1回の費用は数ドル。", "unverified": "付録のモデルの式と、対話的な事例（§6.5）の詳細は読んでいない。使ったLLMの版の日付は公表されておらず、再現性は限られる。"}}, {"id": "pr03", "rank": 3, "headline": "生成モデルで耐震性能と構造の同定可能性を同時に評価", "title": "Generative Learning on Manifolds for Probabilistic Seismic Performance Assessment and Structural Identifiability", "url": "https://arxiv.org/abs/2611.12908", "authors": "Dimitris G Giovanis ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Giovanis, D. G., Kevrekidis, I. G., & Ghanem, R. G. (2026). Generative Learning on Manifolds for Probabilistic Seismic Performance Assessment and Structural Identifiability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12908", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§2の方法、§3の結果、§4の考察）を読んだ。付録は読んでいない", "preprint": true, "p1": "少数の高精度シミュレーションから、構造パラメータと耐震応答の同時分布を学び、予測と逆推定の両方を確率的に行える生成の枠組みを示した（§2.2、§4）。", "p2": "耐震性能の評価は高価な非線形シミュレーションに頼り、不確実性の評価や、観測された性能から構造特性を逆に推定することが難しい。同じ性能を生む構造の組み合わせが複数ある非同定性もある（§1、§3.2）。", "p3": "応答（増分動的解析のカーブを18個のドリフト水準で表したもの）にDiffusion Mapsを適用して6つの非調和座標に縮約し、6つの構造パラメータと合わせた12次元の状態にスコアベースの拡散モデルを適用する。縮約から元の応答への復元はGeometric Harmonicsで行う（§2.2、§3.1）。", "p4": "9階建ての鋼モーメント抵抗骨組（LA9）で、梁ヒンジの6つのパラメータを変えた160の構造実現のうち151を学習、9を検証に使う。30の地震動記録で増分動的解析を行った（§2.3、§3）。", "p5": "検証9件の復元のRMSEは0.0106 g（0.0046〜0.0147 g）で、検証応答の92.0%が生成分布の5〜95%の帯に入った（§3.1、§4）。キャッピング延性μcが最も回復しやすく、残留強度rはほぼ回復できない。劣化を開始する回転μrなどの組み合わせは個別のパラメータより回復しやすく、R²≈0.865だった（§4）。逆推定では、1つの応答状態から、大きく離れた2つの構造の領域が約95%の確率質量を占めた（§3.5）。", "p6": "学習データが疎な領域では生成分布の信頼性が保証されず、低確率の領域は物理に基づく再検証が必要（§3.5、§4）。結果は1つの鋼骨組と代表的な応答に限られ、他の構造や応答量への一般化は未確認。", "fun": "「揺れ方の記録から、建物の中身を当てられるか」という問いに、「当てられない部分がある」ことを生成モデルで示した点が面白い。個々の数値は当てられなくても、「どこまで壊れずに粘るか」のような組み合わせの量なら当てられる、という分かれ目が見える。", "unverified": "付録（拡散写像・Geometric Harmonics）と、前方の条件付き標本（§3.4）の詳細は読んでいない。他の構造への一般化は著者も示していない。"}}, {"id": "pr04", "rank": 4, "headline": "吊橋・斜張橋の温度変位を長期計測で定量化", "title": "Temperature‑Induced Displacement Behavior of a Hybrid Cable‑Stayed and Suspension Bridge Based on Long‑Term Field Monitoring", "url": "https://doi.org/10.21203/rs.3.rs-11668393/v1", "authors": "Biehn Baik", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Baik, B. (2026). Temperature‑Induced Displacement Behavior of a Hybrid Cable‑Stayed and Suspension Bridge Based on Long‑Term Field Monitoring. https://doi.org/10.21203/rs.3.rs-11668393/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（序論、データと温度の分解、結果、結論）を読んだ。設計時の数値解析の節は読んでいない", "preprint": true, "p1": "斜張橋と吊橋の複合橋で、常時の温度・変位の計測から、デッキの有効温度と変位の関係を定量化した（要旨、Figure 18、Figure 20）。", "p2": "温度による変形は長大橋の長期応答の主要成分だが、供用中の挙動の定量が少なく、特に複合構造では不足している。設計段階の解析値と実測を照らした例も限られる（序論）。", "p3": "計測した桁の温度を、一様な有効温度と断面の線形勾配に分解し、日平均の有効温度と、橋台・塔支承・主径間中央の変位を最小二乗の直線で結ぶ。設計時の数値解析の範囲と比べる（本文の温度分解、式[6]、[7]）。", "p4": "対象はトルコのYavuz Sultan Selim橋（鋼とコンクリートの桁をもつ複合橋）。2016年から常時運用の構造ヘルスモニタリングの温度・変位データで、日周と季節の影響を見る（要旨）。", "p5": "塔支承の橋軸方向の変位は有効温度とほぼ直線的で、傾きは6.773と6.902 mm/℃（R²は0.9753と0.9841）、橋台と塔支承の4つのセンサで6.773〜9.285 mm/℃だった（Figure 18）。主径間中央の鉛直変位は夏に下がり冬に上がり、傾きは約−19〜−20 mm/℃（二つのセンサ）、年間の差は約600 mmで、解析値744 mmと同じ桁だった（Figure 20）。鉛直の温度勾配は7月に22 ℃に達し、日射と対応した。中央の橋軸・橋軸直角方向の変位には明確な関係がなかった。", "p6": "変位に対する交通や風の影響は分離していない。センサの符号の誤りやドリフトのため再較正が要る（本文）。1年のデータに基づく1橋の事例で、一般化は限られる。", "fun": "橋は夏に温度で伸び、真ん中は約500 mm（半メートル）も下がる、という大きさに驚く。しかも、センサの符号の間違いやずれが、長く測り続けて初めて見つかった点も面白い。長い計測は、橋だけでなく、センサ自身の健康診断にもなる。", "unverified": "設計時の数値解析の節と、日周の詳細は読んでいない。Research Squareの査読前の記録で、図の数値は本文の記述から確認した。"}}, {"id": "pr05", "rank": 5, "headline": "表の基盤モデルが次期利益の予測でLLMより高精度", "title": "Tabular Foundation Models in Financial Predictions", "url": "https://arxiv.org/abs/2611.13550", "authors": "Ed deHaan ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "deHaan, E., & Huang, A. H. (2026). Tabular Foundation Models in Financial Predictions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13550", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv PDFの本文（§3の比較、§4.3の少数訓練、§6の結論）を読んだ。§2の基盤モデルの説明と§5の他の設定は通読していない", "preprint": true, "p1": "表形式の基盤モデル（TabFM）が、会計の次期利益の増減の予測で、微調整したLLMや木モデルより正確で、訓練や調整が要らないことを示した（§3.3、§6）。", "p2": "会計・財務の予測は木モデルが標準だったが、LLMは事前学習で企業の結果を記憶する先読みバイアスと、計算費用の問題がある。合成データだけで事前学習した表の基盤モデルが使えるかが課題（§1、§3.5）。", "p3": "TabFMは、事前学習済みの表形式モデルで、訓練データを文脈として渡す文脈内学習で予測し、追加の学習も調整も要らない。合成の表データだけで事前学習するため、企業の結果を記憶できない（§2.2、§6）。", "p4": "2005〜2024年の7,446社・62,796の企業年度（130の予測変数：損益計算書と貸借対照表の金額）で、翌期の純利益が増えるかを予測する。評価はAUCで、主な比較は2023・2024年の予測。比較相手はDFの微調整したLlamaと3種の木モデル（§3.1、§3.2）。", "p5": "AUCはTabFMが69.53%、Llamaが67.88%、GBDT-DFが62.75%、他の木モデルが63.51〜63.78%で、TabFMの優位は有意（対ブートストラップ10,000回、§3.3）。TabFMは訓練が不要で予測に11.83分、Llamaは微調整に約108時間かかる（§3.4）。下位の桁を乱す摂動でも記憶の兆候はなかった（§3.5）。訓練を5%にしてもAUC 64.47%で、木モデルの全標本のAUCを超えた（§4.3）。", "p6": "1つの課題・標本・予測変数の結果にとどまり、他の設定で優位とは限らない。記憶していないという前提は開発者の報告に依る（§6）。黒箱として使い、会計数値の役割の理解にはつながらない（§6）。", "fun": "「訓練なしに、表を見せるだけで、翌年に利益が増えるかを当てる」モデルが、専用に何日も鍛えたAIと、調整した木のモデルより当たる、という点が面白い。しかも現実の企業の結果を一度も見ていない「合成データだけの育ち」なので、「答えを覚えていた」という疑いが生じにくい。", "unverified": "§2の基盤モデルの中身（TabFMの構造）、§5の他の基盤モデルの結果、付録の実装の詳細は読んでいない。DFの論文は2026年10月の草稿で、別に確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "言語モデルで会計の比較可能性の崩れを測る", "title": "Same Business, Different Books: Language Models Reveal Where Financial Reporting Comparability Breaks Down", "url": "https://doi.org/10.2139/ssrn.7685130", "authors": "Sidhartha Sharma", "venue": "SSRN", "date": "2026-11-11", "apa": "Sharma, S. (2026). Same Business, Different Books: Language Models Reveal Where Financial Reporting Comparability Breaks Down. https://doi.org/10.2139/ssrn.7685130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった（出版社は403）", "preprint": true, "p1": "会計の比較可能性が崩れる場所を、LLMの埋め込みで測る方法を示した。「似た事業は似た帳簿になる」と「違う事業は違う帳簿になる」の2条件を分けて測れる（抄録）。", "p2": "既存の指標は、産業分類を「似たもの」の定義に使うため、2つの条件を分けて測れない（抄録）。", "p3": "各企業のマスクしたAI生成の事業説明を言語モデルの埋め込みにして、経済的な最近傍と、共通尺度の財務諸表全体の空間の最近傍を比べる。会計が経済的な同業から遠ざける度合いを「偽の差異」、会計上の同業が経済的に遠い度合いを「偽の類似」とする（抄録）。", "p4": "2000〜2021年の米国の55,483企業年度で、2つの指標が財務諸表の類似や利益・株価の比較可能性と別物かを調べ、3つの独立した経済的基準で、偽の差異の一致を確認した（抄録）。", "p5": "最も確かな結果は偽の差異の中身で、一部は会計が示すべき規模や基礎的な違いを反映し、それを超えると、経済的に似た企業は営業項目は同じように報告するが、財務・税・年金・一時的項目で分かれ、同じ監査人だと小さい。利用者への費用の証拠は狭く、偽の差異はアナリストのカバレッジの減少と控えめに関連する。偽の類似は会計数値で同業を選んだときだけ費用がかかる。ASC 842は、リース集約型企業の貸借対照表を経済的な同業に近づけなかった（抄録）。", "p6": "著者自身が、利用者への費用の証拠は枠組みの対称な主張より狭いと述べる（抄録）。本文を読めておらず、標本の細部や頑健性の確認は未確認。", "fun": "同じ商売をしている会社でも、帳簿の付け方が違うと比べにくい。この研究は、帳簿を見ずに、AIが事業の説明文だけから「似ている会社」を探し、帳簿の上の「似ている会社」とのずれを測る点が面白い。リースの会計ルールの変更でも、このずれは縮まらなかった。", "unverified": "本文を入手できず、抄録の範囲の解説。ずれの指標の定義・標本の詳細・各表の数値は未確認。ワーキングペーパーで査読前。"}}, {"id": "pr07", "rank": 7, "headline": "IFRS準拠の確認で複数LLMの統合が最良を10.4点上回る", "title": "IFRS Compliance Verification: An Open Multi-LLM Benchmark and Content-Conditioned Ensemble Classifier", "url": "https://arxiv.org/abs/2611.13595", "authors": "Aghoghomena Akasukpe ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Akasukpe, A., Yang, L., Zhou, X., Shen, C., & Martin, M. V. (2026). IFRS Compliance Verification: An Open Multi-LLM Benchmark and Content-Conditioned Ensemble Classifier (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13595", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3の方法、§4の実験、§5の結論と限界）を読んだ。付録は読んでいない", "preprint": true, "p1": "IFRSの規定と開示の段落のペアが「準拠・不準拠・非該当」のどれかを、3つのLLMの判定を統合して高精度に判定する枠組みと、約2万組のベンチマークを示した（§3、§5）。", "p2": "IFRS準拠の確認は、数百の規定と開示を照合する、手間がかかり誤りやすい監査作業で、単一のLLMでは正確さが足りない。素朴な多数決は特定のモデルの偏りに引きずられ、最良の1つのモデルを下回りうる（§1、§4.2）。", "p3": "3つのLLM（GPT-4.1、Claude Sonnet 4、Gemini 2.5 Pro）の確率と、規定-開示ペアの文埋め込みを、人手ラベルで学習したXGBoostに入れる積み重ね学習で統合する。「どのLLMを信じるかは内容に依存し、確信度には依存しない」ことを使う（§3.5、§4.2）。", "p4": "IFRSの18基準の規定3,489段落と、カナダの監査済み年次財務諸表329件（2022〜2025年度）の開示39,404段落から、4,000開示×上位5規定の20,000ペアを作った。ラベルは3つのLLMの一致と、不一致の項目の人手の注釈で、評価は重み付きF1とRecall@15（§3.1〜§3.3、§3.6）。", "p5": "人手ラベルの不一致の項目で、学習した統合器の重み付きF1は81.7%（0.817）で、最強の単一LLMを10.4ポイント、多数決を14.6ポイント上回り、教師なしの集約の最良（MACE 0.722）にも9.5ポイント以上の差をつけた（§4.2）。GPT-4.1は不一致の項目の95.5%を「不準拠」と予測して偏る。文埋め込みを足すと+8.1ポイント。検索は未知の規定でRecall@15が45.3%（§5）。", "p6": "限界は、1つの領域・英語・3分類・固定の3モデルの評価で、段落単位のラベルが文書全体の準拠を意味しない点、人手の注釈者が初級の分析者3人と少なく、一致が控えめ（κ=0.39）な点（§3.3、Limitations）。", "fun": "「この会社の注記は、会計基準の条文を満たしているか」を、3つの優秀なAIに聞いても意見が割れ、そのうち1つはほとんど「満たしていない」と答えるくせがあった、という点が面白い。誰を信じるかを「文章の内容」で決める、人間の審査員の使い分けに似た工夫で、精度を上げている。", "unverified": "付録（混同行列、較正の詳細、注釈費用）は読んでいない。データ・コードは公開予定とされ、確認できていない。"}}, {"id": "pr08", "rank": 8, "headline": "LLMの合成回答者を共形予測で不確実性つきで評価", "title": "Uncertainty Calibration for Evaluating LLM Digital Twins", "url": "https://doi.org/10.2139/ssrn.7682466", "authors": "Kang Huang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Huang, K., He, H., & Goli, A. (2026). Uncertainty Calibration for Evaluating LLM Digital Twins. https://doi.org/10.2139/ssrn.7682466", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "p1": "LLMで作る合成回答者（デジタルツイン）を、平均の精度だけでなく、共形予測による予測集合の幅（不確実性）でも評価する方法を示した（抄録）。", "p2": "合成回答者の評価は平均の精度だけが使われるが、精度が似ていても、回答者の答えをどれだけ確信して特定できているかは大きく違いうる（抄録）。", "p3": "共形予測で、予測ごとの較正された不確実性を出す。8つの共形手法を比べ、Regression-to-Classification Conformal Prediction（R2CCP）が目標の被覆率で最小の予測集合を出した（抄録）。", "p4": "2,000人超の米国の回答者と500超の質問からなるTwin-2K-500のデータで、GPT-4.1 mini・DeepSeek V4 Flash・GPT-5.1を評価し、人口統計・性格と心理・認知能力・経済的選好の4種類のペルソナ情報の効果を調べた（抄録）。", "p5": "不確実性を考えると、精度が最高のモデルは最も狭い較正済みの集合を出さず、評価が変わる。豊かなプロフィールは精度を上げるが、不確実性を必ずしも下げない。人口統計が最も一貫して有利。精度と不確実性を合わせると、自信をもって間違える「低精度・低不確実性」の群が見つかり、保守的な政治的志向・少数派の宗教や人種・地位追求・より重い認知的誤りと強く関連した（抄録）。", "p6": "本文を読めていないため、著者が認める限界と、被覆率・集合の大きさなどの数値は未確認（抄録の範囲）。", "fun": "AIに「この人ならこう答える」とアンケートの代役をさせるとき、答えが合っているかだけでなく、「どれだけ自信があるか」も測る発想が面白い。そこで見つかった「自信満々に間違える」グループが、特定の属性の人たちに偏っていた点は、使い方への注意にもなる。", "unverified": "本文を入手できず、抄録の範囲の解説。被覆率・集合の大きさの数値、8つの共形手法の内訳は未確認。ワーキングペーパーで査読前。"}}, {"id": "pr09", "rank": 9, "headline": "LLMの内部に心理尺度の構造があるかを調べる", "title": "Tracing Psychometric Inference in Large Language Models", "url": "https://arxiv.org/abs/2611.12937", "authors": "Chih-Hao Hsu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Hsu, C.-H., Chou, F.-C. B., & Chen, P.-H. A. (2026). Tracing Psychometric Inference in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12937", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3の設定と行動の結果、§4・§6の幾何と行動の関係、§7の限界）を読んだ。§5の活性探索の詳細と付録は通読していない", "preprint": true, "p1": "LLMが心理尺度の相関の構造を内部の表現にもつかを調べ、大きな指示調整モデルで人の構造に整合する幾何があることを示した（§4.2、§6）。", "p2": "LLMは人の心理尺度の相関を再現して増幅するように見えるが、構成概念を内部に表現するのか、出力が似て見えるだけなのかが分からない（§1）。", "p3": "ある1尺度の回答者本人の回答をプロンプトに与え、他の6尺度の回答を予測させる（クロスペルソナ）。対比方向の幾何と、中間層の活性の線形な読み出し（プロービング）で内部を調べ、人の16×16の下位尺度相関行列と比べる（§3.2、§4.1、§5.1）。", "p4": "人のデータは台湾の大学生272人が7尺度（114項目）に答えたもの。Llama 3とQwen 2.5の14のモデル変種（0.5B〜14B、基盤と指示調整）を評価した。整合はPearsonのr、大きさはOLSの傾きで測る（§3.1〜§3.3）。", "p5": "行動では、モデルが大きいほど人の構造に近づき、傾きが小さい模型の減衰（<1）から大きい模型の増幅（>1）に移り、測定の減衰を補正した後も傾きは1.19〜1.39が残った（§3.3）。内部の幾何は小さいモデルでほぼ0、指示調整した大きいモデルで明確（Qwen 14B InstructでMantel r=0.66、Llama 8B Instruct 0.37）、基盤モデルはすべて0.14以下だった（§4.2）。幾何の強さと行動の増幅は相関した（r=0.68、p=0.008、§6）。", "p6": "著者が認める限界は、人のデータが1つの文化の標本（台湾の大学生、繁体字中国語）である点、14変種が2つの系統で独立でない点、小さいモデルでは方向の信頼性が低い点、ステアリングは探索的で媒介を示していない点（§7）。", "fun": "AIが「人間らしく答える」とき、中身で人の心の構造を再現しているのか、見かけだけなのかを、脳の検査のように中間層の信号を読んで調べている点が面白い。ただ指示に従うように調整した大きなAIでだけ構造が見え、そうでない基盤モデルでは見えないという違いが出た。", "unverified": "§5の活性探索の細部、付録の頑健性の検討は読んでいない。「幾何が行動を媒介する」ことは示されておらず、台湾の標本だけの結果で、一般化は限られる。"}}, {"id": "pr10", "rank": 10, "headline": "想像上の将来世代で脱炭素と防災の政策を統合", "title": "Promoting Policy Integration for Carbon Neutrality and Disaster Prevention by \"Imaginary Future Generations\": A Deliberative Experiment with Government Officials", "url": "https://doi.org/10.2139/ssrn.7684490", "authors": "Yamato Sugita ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Sugita, Y., Okuda, M., Fuchigami, Y., & Hara, K. (2026). Promoting Policy Integration for Carbon Neutrality and Disaster Prevention by “Imaginary Future Generations”: A Deliberative Experiment with Government Officials. https://doi.org/10.2139/ssrn.7684490", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "p1": "想像上の将来世代（IFG）の方法を、複数の自治体と官庁の職員による熟議に取り入れ、脱炭素と防災を統合した政策提案が生まれるかを検証した（抄録）。", "p2": "気候変動への対応には、2050年のカーボンニュートラルと、将来の気候に伴う自然災害に備える防災を、自治体の連携で、効果と長期の含意を考えながら統合して進める新しい方法が求められる（抄録）。", "p3": "「将来可能性（futurability）」を生む既知の方法であるIFGを、複数の自治体の職員と官庁の職員の熟議の実践に組み入れ、議論・意思決定・質問票の回答を分析した（抄録）。", "p4": "検証は、熟議の参加者の議論の記録と質問票の回答の分析にもとづく。対照条件（IFGなし）や人数は抄録に記載がなく、未確認（抄録）。", "p5": "議論と質問票の結果は、IFGの採用が、現行の取り組みと異なる政策案を生み、脱炭素と防災の両方にまたがる部局横断の議論を促すことを示唆する。質問票は、IFGが、政策形成の2つの主な基準である「政策の実現可能性」と「住民・議会の理解を得ること」の重要度を下げることも示唆する。現在の制約を乗り越えて政策の統合を促しうる（抄録）。", "p6": "抄録には、標本の大きさ・対照条件・効果の大きさの記載がなく、因果的な効果としての確かさは確認できない。本文を読めておらず、著者が認める限界は未確認（抄録の範囲）。", "fun": "「将来世代の人になりきって」話し合うと、「実現できるか」「住民に理解されるか」という現実の壁が気にならなくなり、大胆な政策案が出やすくなる、という点が面白い。壁を外して考える段階を、あえて作ることで、脱炭素と防災のように、ふだん別々に議論されるものを結びつけている。", "unverified": "本文を入手できず、抄録の範囲の解説。参加者の人数・比較条件・質問票の数値は未確認。ワーキングペーパーで査読前。"}}, {"id": "pr11", "rank": 11, "headline": "亀裂のある多孔質体の流れ・変形・摩擦接触の数値解析", "title": "Numerical analysis of coupled flow, deformation and frictional contact mechanics in a fractured porous medium", "url": "https://arxiv.org/abs/2611.14341", "authors": "Marius Nevland ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Nevland, M., Kumar, K., Berre, I., Both, J. W., & Keilegavlen, E. (2026). Numerical analysis of coupled flow, deformation and frictional contact mechanics in a fractured porous medium (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14341", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1の背景、§4の離散化と定理、§5の数値実験、§6の結論）を読んだ。証明の詳細と付録は読んでいない", "preprint": true, "p1": "亀裂のある粘弾性の多孔質体で、流れ・変形・摩擦接触を結合したモデルの完全離散スキームについて、離散解の存在と一意性・安定性・事前の誤差評価を示した（§4、§6）。", "p2": "CO2貯留や地熱などの地下の応用で、亀裂を余次元1の対象とする混合次元の結合モデルは強い非線形をもつ。Signorini条件とCoulomb摩擦の組み合わせは数学的に難しく、先行研究は収束が示されていなかった（§1）。", "p3": "母体は線形の粘弾性とDarcy流れ、亀裂は平均化した流れ、接触は法線コンプライアンスとCoulomb摩擦で表す。空間は適合有限要素、時間は陰的Euler法で離散化し、変位は変分不等式で扱う（§3、§4）。", "p4": "検証は、存在と一意性（定理4.1）・安定性（定理4.2）・事前の誤差評価（定理4.3）の証明と、亀裂のある単位正方形の数値実験（multiphenicsx、ペナルティ法とNewton法）で、空間と時間の収束率を計算して理論と比べた（§4、§5）。", "p5": "誤差評価は、時間について最適な次数だが、空間では主項が平方根だけ下がり、これは接触問題で典型的（§6）。数値実験では、時間の収束がすべての変数で1次以上（表3、T/Δt = 32で1.1021〜1.1185）。空間では、亀裂の先端付近の低い正則性で圧力の収束率が下がるが、先端を除くと最適な1次が戻った。変位は先端を除いても1次に届かなかった（§6）。", "p6": "誤差評価は強い正則性の仮定を要し、透水係数を一定とする線形化モデルに限る（§4.4、§6）。接触問題でのL²の最適誤差評価は、通常の双対法が使えず、未解決（§6）。", "fun": "岩の割れ目に水が流れ、岩がじわじわ変形し、割れ目の両面が摩擦で滑る、という複雑な現象を、数学の言葉で「この計算法は正しい答えに近づく」と保証した点が面白い。空間の精度が理論上「平方根だけ落ちる」ことが、接触のある問題の宿命だという点も印象的。", "unverified": "§3〜§4の証明の詳細と、付録A・Bの評価は読んでいない。数値実験の設定の詳細（亀裂の配置と物性値）は読んでいない。"}}, {"id": "pr12", "rank": 12, "headline": "熱力学的に整合したニューラル弾塑性モデル", "title": "Thermodynamically consistent neural constitutive models for elastoplasticity via eigen-representations", "url": "https://arxiv.org/abs/2611.13162", "authors": "Harikrishnan Vijayakumaran ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Vijayakumaran, H., Yin, S., Abendroth, M., Bessa, M. A., & Kalina, K. A. (2026). Thermodynamically consistent neural constitutive models for elastoplasticity via eigen-representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13162", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1.2の貢献、§3の構成、§4の学習、§5の結果、§6の結論）を読んだ。付録は読んでいない", "preprint": true, "p1": "降伏関数と発展則を同時に学習し、熱力学的整合性と等方性を構成上保証するニューラル弾塑性モデルを示した（§1.2、§6）。", "p2": "ニューラルネットの構成則は柔軟だが、熱力学の整合性を保証せず、陰的なリターンマップを通した学習も難しく、固有値が重なると勾配が特異になる課題があった（§1、§4.2）。", "p3": "非関連流れを、流動ポテンシャルの凸な関数に、降伏関数との差を表す加法的な学習項を足す形で表し、熱力学的整合性を構成上保証する。等方性は固有値に対する順列不変な表現と入力凸ニューラルネットで課し、後退Eulerのリターンマップは陰関数定理で勾配を通し、固有値の縮退に安全な微分を使う（§2〜§4）。", "p4": "既知の構成則（Von Mises、Drucker–Prager、LZY）の再現、平面応力で等方性を課す効果（ドッグボーンとトポロジー最適化した試験片）、開放セルの発泡体の代表体積要素（RVE）のデータでの非関連流れで評価した。各部品は幅16・隠れ2層で、全体のパラメータは約350〜1300個（§5）。", "p5": "既知の構成則はVon Misesで1−R²が2.60×10^-13、LZYで正規化RMSEが0.679%の精度で再現した（表3）。等方性を課すと、汎化のNRMSEが、ドッグボーンで11.03%（課さない三斜晶は88.85%）、トポロジー最適化で1.30%（20.32%）に下がり、誤差は8.06倍と15.58倍小さくなった（§5.2）。発泡体では、非関連流れが関連流れよりテスト誤差が小さかった（NRMSE 4.44%対5.01%、表9）。", "p6": "対象は微小ひずみの等方性材料で、異方性や有限ひずみは今後の課題（§6）。非関連流れの改善は小さい（表9）。その流動ポテンシャルが降伏関数と意味のある違いをもつかは、図12で定性的に確かめている（§5.3）。", "fun": "金属や発泡体が「ある点を超えると元に戻らなくなる」性質をAIに学習させるとき、物理の法則（エネルギーが勝手に増えない、向きによらない）を最初から組み込んでおくと、同じデータで誤差が8.06倍や15.58倍小さくなる、という点が面白い。データを増やすより、物理を守らせるほうが効くことがある。", "unverified": "付録（熱力学的整合性の導出、スケーリング、データの作り方）と、§5.1の硬化則（等方・移動硬化）の結果は詳しく読んでいない。"}}, {"id": "pr13", "rank": 13, "headline": "アルゴリズム管理は要求と自律性の両刃", "title": "Algorithmic Management as a Double-Edged Form of Digital Work Design: Job Demands, Autonomy and Employee Outcomes across 35 European Countries", "url": "https://doi.org/10.21203/rs.3.rs-11446329/v1", "authors": "Fahri Alp Erdoğan ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Erdoğan, F. A., Akdemir, M. A., & Sağbaş, M. (2026). Algorithmic Management as a Double-Edged Form of Digital Work Design: Job Demands, Autonomy and Employee Outcomes across 35 European Countries. https://doi.org/10.21203/rs.3.rs-11446329/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（§3の方法、§4.2〜§4.8の結果、要旨の限界）を読んだ。§4.9〜§4.11と§5は読んでいない", "preprint": true, "p1": "タスク配分・スケジュール・監視という3つのコンピュータ管理の機能を分けると、作業強度（要求）と自律性（資源）を通じた関与・離職意向への経路が機能で違うことを、欧州35か国の従業員調査で示した（要旨、§4）。", "p2": "デジタルな管理は要求と自律の両方に関わりうるが、機能を分けず、作業強度だけの1つの媒介で見る分析が多く、競合する経路が見えなかった（§2.5、§4.8）。", "p3": "JD-Rにもとづき、3つの管理の機能から、作業強度と自律性（潜在変数）を通じて、関与（潜在変数）と離職意向（順序変数）に至る並列の間接関連を、重み付きWLSMV推定の構造方程式モデルで推定する（§3.4）。", "p4": "データは欧州労働条件調査2024。従業員30,570人のうち、重みが正で必要な変数がそろう26,504人・35か国を使い、年齢・性別・学歴・職場の規模・労働時間・勤続・契約を統制した。国・職業・産業の固定効果の版と、量的要求のみの感度分析も行った（§3.1、§3.3）。", "p5": "3つの機能すべてが作業強度と正に関連した（タスク配分β=.081、スケジュール.058、監視.138、§4.4）。自律性とは、タスク配分が正（.097）、監視が負（−.060）で、スケジュールの負（−.048）は固定効果で有意でなくなった。作業強度は関与と負（−.196）、離職意向と正（.207）。自律性は関与と正（.185）で、離職意向との関連は固定効果の版でのみ負（−.044）（§4.5）。主なモデルの適合は良好（CFI=.988、RMSEA=.010、§4.2）。", "p6": "横断のデザインで、因果的な媒介や時間的な順序は示せない。測定は報告されたコンピュータの関与で、AIの能力を確かめたものではない。国間の測定不変性は不完全で、傾きも国ごとに異質（§3.1、要旨）。", "fun": "「AIに管理される」といっても、仕事を割り振られる場合は自由度が上がって元気になる面があり、監視される場合は自由度が下がって元気をなくす、というふうに、中身を分けて見ると逆向きの効果が出る点が面白い。どの機能も作業の忙しさを上げ、それが「辞めたい」気持ちにつながる。", "unverified": "調査設計にもとづく検定（§4.10）と、国間の不均質性の詳細（§4.11）は読んでいない。関連の記述にとどまり、因果は示せない。査読前の記録。"}}, {"id": "pr14", "rank": 14, "headline": "自閉症の就労者のための多次元の対処尺度を開発", "title": "Coping with workplace stress in autism: Development of a multidimensional coping inventory", "url": "https://doi.org/10.31234/osf.io/m9cet", "authors": "Johanna Finnemann ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Finnemann, J., & Erdal, K. (2026). Coping with workplace stress in autism: Development of a multidimensional coping inventory. https://doi.org/10.31234/osf.io/m9cet", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "OSFのPDF本文（序論、研究1〜3の方法・結果、考察、限界）を読んだ。各因子の項目の表は通読していない", "preprint": true, "p1": "自閉症の就労者の職場でのストレス対処を測る、33項目・11因子の多次元の自己報告尺度を開発し、神経多様性のある就労者にも使えることを示した（要旨、研究1・2）。", "p2": "自閉症の就労者は、感覚・社会・組織の要求が対処の資源を超えやすく、固有の対処を使うが、既存の質問票では適切に捉えられない（要旨、序論）。", "p3": "89項目の予備尺度で、直近2週間の職場のストレスな状況を思い出して回答し（4件法、星による視覚的な尺度）、並行分析で13因子を抽出して、事前登録の基準で項目を絞り33項目・11因子にした。研究2で測定不変性、研究3で11項目の短縮版を調べた（研究1〜3）。", "p4": "研究1は自閉症の従業員233人（尺度の開発標本）。研究2は、自閉症でない神経多様性のある従業員221人（ADHD、チック症、読み書き障害などを含む）で適用範囲を調べた。研究3は自閉症の診断のある156人で、記述的な参照データ・短縮版・幸福感との予備的な関連を調べた（要旨、研究3）。", "p5": "測定不変性は、配置不変で適合が許容でき（CFI=0.922、RMSEA=0.048）、加重・切片の制約で適合は有意に下がるが、近似適合指標の変化は小さく（スカラーでΔCFI=−0.008）、計量・スカラーの不変性を支持した（研究2）。ユーモアと受容を多く使う人ほど幸福感が高く、感覚調整を多く使う人ほど低かった（研究3、考察）。", "p6": "限界は、自己申告の自閉症の標本（研究1は正式な診断が約3分の1のみ）で、ADHDなどの併存が多く、臨床的に区別できない群である点、職場の対処に限る点、幸福感の分析が横断で因果が言えない点（Limitations）。再検査信頼性・予測妥当性・介入での変化への感度は今後の課題。", "fun": "感覚が敏感になる環境をどう乗り切るかという、自閉症の当事者の工夫を、一般の対処の質問票では拾えず、当事者の声から質問項目を作り直した点が面白い。感覚を調整する対処を多く使う人ほど幸福感が低いのは、その対処が悪いのではなく、それだけ環境が過酷なのだろう、という解釈も印象的。", "unverified": "予備尺度の作成過程（Erdalら、2026）と、各因子の項目内容・信頼性係数の詳細は読んでいない。査読前の記録。"}}, {"id": "pr15", "rank": 15, "headline": "介護者の苦悩を中国語・英語の投稿1.4万件で比較", "title": "\"What Keeps Them Up at Night\": A Cross-Cultural NLP Analysis of Psychological Distress Among Family Caregivers of Older Adults in Chinese and English-Speaking Online Communities (Preprint)", "url": "https://doi.org/10.2196/preprints.116596", "authors": "Yike Wang ほか", "venue": "JMIR Preprints", "date": "2026-11-11", "apa": "Wang, Y., Ji, M., Jia, S., Zhang, Q., Zhu, S., & Bai, X. (2026). “What Keeps Them Up at Night”: A Cross-Cultural NLP Analysis of Psychological Distress Among Family Caregivers of Older Adults in Chinese and English-Speaking Online Communities (Preprint). https://doi.org/10.2196/preprints.116596", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "p1": "高齢者を介護する家族の苦悩を、中国語と英語のオンライン投稿の計算的テキスト分析で比べ、疲弊は文化をまたいで安定した核で、苦悩の構造は文化で違うことを示した（抄録）。", "p2": "介護者の苦悩の文化比較は標準化された尺度に頼り、文化に固有で自然に現れる苦悩の側面を捉えにくい（抄録）。", "p3": "2020〜2024年の介護者の投稿13,996件（Redditの英語8,762件、Zhihu・Douban・Baidu Tiebaの中国語5,234件）に、BERTopicで主題を抽出し、検証した事前学習モデルで感情の極性と感情を分類した。二言語の対応づけと多言語の意味の類似で主題を揃え、χ²・Mann–Whitney U・Leveneの検定で比べた（抄録）。", "p4": "英語10・中国語9の主題を10の概念領域にまとめ、領域ごとの割合・感情・苦悩の水準を、文化間で比べた（抄録）。", "p5": "感情的な疲弊は割合が近く（17.0%対15.9%、P = 0.58）、意味の対応が最も高く（0.78）、最も文化をまたいで安定した。構造は、英語は副次的なストレス要因が45.3%、中国語は親孝行と一人っ子という文化的な文脈の主題が25.5%で英語にない。中国語に固有の道徳的な罪悪感が13.8%、身体化が7.9%、英語に固有の自己の喪失とアイデンティティの危機が5.7%。共通の領域では英語は怒り、中国語は恐れに寄る。苦悩の水準の差は有意でも小さい（抄録）。", "p6": "抄録には限界の記載がない。解釈：投稿者の属性や診断は分からず、投稿の書き手が介護者全体を代表するかは不明で、差の大きさは統計的に有意でも小さい。", "fun": "同じ「介護がつらい」でも、英語圏では「自分らしさを失った」という悩みが、中国語圏では「親孝行を果たせない罪悪感」や体の不調として出やすい、という違いが面白い。疲れ果てる気持ち自体は、どちらの文化でも同じくらい出てくる共通の核になっている。", "unverified": "本文を入手できず、抄録の範囲の解説。モデルの検証の精度・主題の定義・各検定の数値の詳細は未確認。査読前の記録で、臨床試験ではない。"}}, {"id": "pr16", "rank": 16, "headline": "LLMエージェント12体で心理の機構を段階ごとに検証", "title": "Agent Psychonomicus: Psychological Mechanisms Emerge In Cognitive Agents Simulated By Large Language Models", "url": "https://doi.org/10.2139/ssrn.7683658", "authors": "Jack Chen ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Chen, J., Xiao, W., & Chen, L. (2026). Agent Psychonomicus: Psychological Mechanisms Emerge In Cognitive Agents Simulated By Large Language Models. https://doi.org/10.2139/ssrn.7683658", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMに答えさせるだけでは分からない心理の仕組み（媒介の過程）を、LLMエージェントが出す過程の文で検証できるようにした。", "p3": "12体のLLMエージェントが、自己への評価などの一般的な認知過程を一人称の文で出す最小限の認知エージェント（MVCA）を作り、3つのLLMで公刊済みの60の実験について57,147回の認知シミュレーションをした。", "p5": "理論が想定する媒介の過程がシミュレーションから現れ、その過程を文に直接入れると実験の結果に因果的な効果があった。事前登録の大規模な追試を受けた実験では、元の効果が再現した実験のほうが、再現しなかった実験より、エージェントでの再現の割合が有意に大きかった（抄録）。", "fun": "人の代わりにLLMに心理実験を受けさせる「シリコン標本」は、答えが人と似ていても、中身まで同じとは限らない。この研究は、答えだけでなく途中の考えの文まで出させて、理論どおりの心の動きが起きているかを調べるところが面白い。再現に失敗しやすい実験を見分けるヒントにもなるという。", "unverified": "本文を入手できず、12体の役割分担・60実験の選び方・統計の詳細は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "AIの憲法を市民参加で作り育てる提案", "title": "Living constitutions: Participatory alignment for sovereign foundation models", "url": "https://arxiv.org/abs/2611.13402", "authors": "Stine Lyngs{\\o} Beltoft ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Beltoft, S. L., Vistrup, J., Schneider-Kamp, P., & Poech, L. G. (2026). Living constitutions: Participatory alignment for sovereign foundation models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13402", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AIの価値規範を書いた「憲法」を、市民が参加して繰り返し作り直す過程として扱う提案をした。", "p3": "憲法づくりを、起草・検証・改訂を繰り返す市民科学のような過程と見て、反復的・モジュール的・正当化可能・立場的・正統という5つの原則を立てた。各条項を「確定・争いあり・未決」と印づけ、続く不一致を憲法に記録する。", "p5": "エージェント・ベース・モデルで、熟議の場の参加者の75%が善意なら、市民の50%が悪意でも、この過程が頑健だと示した（抄録）。", "fun": "AIにどんな価値を持たせるかを誰が決めるのかは、意外と難しい問題。意見が割れた部分を無理に決着させず「争いあり」と記録として残す、という発想が面白い。みんなで決めるルールが、悪意のある人が混ざっても崩れにくいことを、コンピュータ上の模擬社会で確かめている。", "unverified": "本文を入手できず、5原則の詳細とモデルの設定（悪意の定義、熟議の方法）は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "議論・反対尋問・自己批判で事実性を高める手法の総説", "title": "Adversarial Factuality: A Review of Debate, Cross-Examination and Self-Critique Mechanisms for Large Language Models", "url": "https://doi.org/10.20944/preprints202611.1036.v1", "authors": "Lei Yang ほか", "venue": "Preprints.org", "date": "2026-11-11", "apa": "Yang, L., Du, S., Chen, Y., Chen, Y., & Ji, L. (2026). Adversarial Factuality: A Review of Debate, Cross-Examination and Self-Critique Mechanisms for Large Language Models. https://doi.org/10.20944/preprints202611.1036.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMに議論・反対尋問・自己批判をさせて事実性を高める手法を、2022〜2026年の研究から2段階の分類で整理した。", "p3": "外部の知識が得られない場合に使う敵対的な相互作用の手法を、根拠の種類と敵対の構造で分類した総説。", "p5": "設計空間は偏って埋まり、どの構造も一様に優れず、どの構造でも「誤った答えに早く収束する偽の合意」が繰り返し起きる。偽の合意の診断は成熟しているが対策はほとんど検証されておらず、既存の評価は外部の正解を前提にするため、内部の一貫性を使う手法に不利とまとめる（抄録）。", "fun": "複数のAIに議論させれば正しくなりそうだが、全員が同じ間違いに落ち着く「偽の合意」が起きやすい。人間の会議や陪審でも起きる現象が、AIでも課題になっているのが面白い。しかも対策はほとんど確かめられていないという指摘が、これからの研究の入口になる。", "unverified": "本文を入手できず、対象にした個々の手法・件数・分類の中身は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "3つのLLMで盲検の内容コーディングを行う手順", "title": "A Blinded Multi-LLM Content-Coding Instrument: Protocol Specification and Inter-Coder Reliability Validation on an Organizational Corpus", "url": "https://doi.org/10.5281/zenodo.24118665", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). A Blinded Multi-LLM Content-Coding Instrument: Protocol Specification and Inter-Coder Reliability Validation on an Organizational Corpus (Version 1.2.0). Zenodo. https://doi.org/10.5281/ZENODO.24118665", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を読んだ。本文は入手できなかった。審査のない置き場の記録", "preprint": true, "short": true, "p1": "仮説を知らない3つのLLMで質的データを独立にコード化し、人間のコーダー間信頼性の手順を機械支援の分析に持ち込む手順を示した。", "p3": "異なる3つのモデルが、出典つきの中立な資料から、仮説と事例の役割を伏せたまま各セルを独立にコード化し、多数決か、決まらなければ旗を立てて著者が裁定する。判断できなければ「不確か」を返し、各呼び出しをモデルの版とともに記録し、手順と空のコード表を事前に固定する。", "p5": "組織統合の30事例のコーパスでほぼ完全な一致（Fleissのκ = .838）を得て、旗の率は2.7%で補助的なトークンに集中した（抄録）。下流の推論の妥当性は別とし、未検証。", "fun": "質的データの分析は、コード化する人が仮説を知っていると、無意識にそれに寄せてしまう問題がある。ここでは3つのAIに仮説を見せずに分担させ、答えられないときは推測せず「不確か」と返させる仕掛けが面白い。人間の研究の作法をAIに移し替えた例になっている。", "unverified": "本文を入手できず、30事例の選び方・コード表の項目は未確認。Zenodo上の未査読の記録で、評価は限られる。"}}, {"id": "pr20", "rank": 20, "headline": "信用リスクの時系列特徴の検証をプラセボで補正", "title": "A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models", "url": "https://doi.org/10.2139/ssrn.7684404", "authors": "Nawaz Muhammad", "venue": "SSRN", "date": "2026-11-10", "apa": "Muhammad, N. (2026). A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models. https://doi.org/10.2139/ssrn.7684404", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "信用リスクのモデルに時間とともに変わる特徴を足す検証が、雑音の特徴でも通ってしまう問題を、プラセボ検定で補正する方法を示した。", "p3": "同じ持続性を持つ偽の時系列を作って比べるプラセボ検定で、検定の大きさを名目に戻す。単に並べ替えた偽系列は、期間の効果を制御しているときだけ有効。", "p5": "信用サイクルを制御しないと、純粋な雑音の特徴が基準のシミュレーションで38%、サイクルが漂うと67%（名目5%）の確率でAUC改善の検定を通る。持続性を合わせたプラセボは2%〜5%に保つが、検出力は73%から30%に落ちる。公開のローンデータでは、Lending Clubで口調の指数が標準の検定は通るがプラセボは通らない（p = 0.71）（抄録）。", "fun": "「新しい特徴を足したら精度が上がった」と思っても、ゆっくり動くだけの無意味な系列でも38%は「上がった」と出てしまう、という落とし穴が面白い。グラフが2本ともゆっくり動いていると、たまたま似て見えるのと同じ仕組みで、似せた偽物と競わせて本物かどうかを確かめる。", "unverified": "本文を入手できず、シミュレーションの設計・Lending Clubの詳細・チェックリストの内容は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "貸し手との関係が強いと監査の労力が減る", "title": "Client Lending Relationships and Audit Production (WP)", "url": "https://doi.org/10.2139/ssrn.7685030", "authors": "Jie Hao ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hao, J., & Pham, V. T. (2026). Client Lending Relationships and Audit Production (WP). https://doi.org/10.2139/ssrn.7685030", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "貸し手との関係が強い企業ほど、監査の労力が減る傾向を示した。", "p3": "借り手と貸し手の関係を、貸し手による継続的な審査と監視を通じた下振れリスクの評価と捉え、監査人の計画に有用な信号になりうるとして、監査報酬・報告遅延・継続企業意見との関係を調べた。", "p5": "貸出関係が強いと、監査報酬が低く報告遅延が短く、不正確な継続企業意見を出す可能性も低い。効果は、貸し手のリスク評価が情報的なとき、貸し手と監査人の意思疎通が効率的なときに強い（抄録）。", "fun": "銀行が何度も貸して企業を見張っている、その情報が、監査人の仕事にまで効いてくるという発想が面白い。銀行の審査と会計士の監査という別々の「目」が、実は互いのコストを下げているかもしれない。", "unverified": "本文を入手できず、標本・変数の定義・統計の有意水準は未確認。ワーキングペーパーで査読前。"}}, {"id": "pr22", "rank": 22, "headline": "炭素クレジットの開示を専門家ガイドの少数ショットで分類", "title": "CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures", "url": "https://doi.org/10.21203/rs.3.rs-11679188/v1", "authors": "Hang Thanh Bui ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bui, H. T., Lee, E., & Evans, M. C. (2026). CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures. https://doi.org/10.21203/rs.3.rs-11679188/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "企業報告書の炭素クレジットの記述を、専門家の分類に沿って段落単位で選び分ける方法を示した。", "p3": "専門家が定めた分類・紛らわしい負例・少量データ向けの分類法を組み合わせ、不確かなものは人の確認に回す。ASX100の2024〜2025年の報告書から、キーワード一致の文8,299件と段落の候補15,026件を作り、各100段落の専門家ラベル付きデータ3つで、ClimateBERTの微調整とSetFit–MiniLMの少数ショットを比べた。", "p5": "5分割の交差検証で、炭素クレジットの関連性にはClimateBERTの微調整（正解率93.8%）を、感情と使用の報告にはSetFit–MiniLMを選んだ（抄録）。", "fun": "「クレジット」「オフセット」「ネット」という語は、金融・会計・環境で別々の意味で使われるので、キーワード検索だけでは見つけにくい。専門家のラベルが100段落ずつでも動かせる点と、自信のない判断を人に回す点が、現場で使いやすい工夫として面白い。", "unverified": "本文を入手できず、ラベルの基準・誤分類の例・人へ回す閾値は未確認。査読前の記録。"}}, {"id": "pr23", "rank": 23, "headline": "時点整合を守るLLMエージェントの金融ベンチマーク", "title": "BuySideFlow: A Point-in-Time Benchmark for LLM Agents in Investment Research", "url": "https://arxiv.org/abs/2611.12966", "authors": "Dong Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bo, D., Zhang, F., Cheng, K., Zhao, X., Su, X., Wang, Y., Xu, J., Li, C., Chen, H., & Zhang, J. (2026). BuySideFlow: A Point-in-Time Benchmark for LLM Agents in Investment Research (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12966", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントが、開示日の締め切りと履歴の版を守って投資調査の分析ができるかを測るベンチマークを示した。", "p3": "株式・ファンド・債券・マクロの実務家由来の中国語の課題408件を、ライセンスのある実運用の金融データベースの固定スナップショットで用意し、実行可能な参照と時間的な誤りの分類、結果の確認と専門家による作業の監査を組み合わせた。", "p5": "9つのエージェント構成で結果の正確さは16.2%〜36.8%。100の共通課題の900回の実行を監査すると、結果の確認を通った380回のうち193回（50.8%）に時点の違反があり、出力の一致だけでは時間的な妥当性を示せない（抄録）。", "fun": "「答えが合っている」ことと「その時点で分かっていた情報だけで答えている」ことは別で、AIが未来の情報を使ってしまう「先読み」が、結果の合っていた回の半数で見つかった。答え合わせだけでは見抜けないずるを、作業の監査で見つけ出した点が面白い。", "unverified": "本文を入手できず、課題の作り方・時間的な誤りの分類の中身・各エージェント構成の違いは未確認。"}}, {"id": "pr24", "rank": 24, "headline": "LLMは親会社の開示でブランド評価がぶれるか", "title": "Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception", "url": "https://doi.org/10.5281/zenodo.24117389", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception (Version 1.3.0). Zenodo. https://doi.org/10.5281/ZENODO.24117389", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を読んだ。本文は入手できなかった。審査のない置き場の記録", "preprint": true, "short": true, "p1": "LLMはブランドの親会社を知らされても評価がほとんど変わらないこと（免疫）を、13のLLMで示した。", "p3": "7つの訓練系統の13のLLMで、ポートフォリオの型が違う20ブランドを、直接の評価・自然な推薦・会話の途中での親会社の開示・母語での提示の4つの方法で評価させ、7,975件の観察を得た。マーケティング研究に出た別の20ブランドで拡張し、全体で9,925件・40ブランドとした。", "p5": "親会社の枠組みを示しても次元集中指数の変化はほぼゼロ（平均|ΔDCI| = .23）で、20ブランドのうち18ブランドで±1.0点以内の同等性が確認された。会話の途中の開示では、逆向きの憧れの構造（Geely Autoなど）にわずかな平坦化が見られた（抄録）。", "fun": "ブランドの親会社を教えられると、人は「あの有名企業の系列か」と見方を変えるものだが、LLMはほとんど変わらなかった、という結果が面白い。LLMは親会社との関係をあらかじめ覚えているので、あとから言われても揺れない、という見立てが検証されている。", "unverified": "本文を入手できず、ブランド・質問の詳細と次元集中指数の定義は未確認。Zenodo上の未査読の記録で、評価は限られる。"}}, {"id": "pr25", "rank": 25, "headline": "空き店舗の業種配置を位置情報データで最適化", "title": "Revitalizing Urban Retail: Allocating Vacant Storefronts with Smartphone Location Data", "url": "https://doi.org/10.2139/ssrn.7682805", "authors": "Hansheng Jiang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Jiang, H., Zhang, J., & Brown, C. (2026). Revitalizing Urban Retail: Allocating Vacant Storefronts with Smartphone Location Data. https://doi.org/10.2139/ssrn.7682805", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "空き店舗にどの業種をどこへ入れるかを、位置情報のデータから推定した需要モデルで最適化する枠組みを示した。", "p3": "端末単位のスマートフォンの位置情報で、業種別の店舗数が出発地のトリップ発生と目的地選択の両方を決める空間需要モデルを推定し、立地ごとの空き容量と業種別の追加の上限のもとで、トリップ重みのロジサム目的を最大化する。移転探索のヒューリスティックと、配分の質を保証する上界を使う。", "p5": "マンハッタンとブルックリンの85の郵便番号地域で、約112 million件の買い物・余暇のトリップと10万超のPOIを使い、飲食店とカフェを優先する配分を得た。制約つき比例配分に対し最大の利得の99.993%以上を得て、同じ目的を既存店の比例拡大で達成するには43.3%多い出店が必要。適格な立地・業種の組の99.0%が補完関係だった（抄録）。", "fun": "空き店舗に何を入れるかは、人気のある店を増やせばよいわけではない。新しい店は客を奪い合う一方で、客を次の店へ連れていく面もある。その競争と相乗りを人の動きのデータで測り、どの業種をどこへ入れるかを数学で選ぶところが面白い。", "unverified": "本文を入手できず、モデルの式・推定結果の頑健性・比較の基準の詳細は未確認。査読前。"}}, {"id": "pr26", "rank": 26, "headline": "東京は生産性の水準が1位でも成長率は47位", "title": "東京パズルの観測事実: 県民経済計算による人口・生産性・所得・雇用者報酬の地域比較", "url": "https://doi.org/10.51094/jxiv.7112", "authors": "大塚, 章弘", "venue": "Jxiv", "date": "2026-11-08", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Jxivの抄録（英語・日本語）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "東京は生産性・所得・報酬の水準が高いのに、一人当たりの成長は低いという「東京パズル」の観測事実を、県民経済計算で整理した。", "p3": "内閣府の県民経済計算（令和5年度版）の47都道府県・2012〜2023年度の、人口・生産性・所得・雇用者報酬を比較して、記述的に整理する。因果効果は扱わない。", "p5": "東京は生産性・所得・報酬の水準で1位だが、一人当たり実質産出の成長は47位、労働生産性の成長は33位。南関東の4都県の労働生産性は全期間で全国の伸びを下回り、東京圏では産出の増加は東京、雇用の増加は周辺県に集中する。労働生産性の成長と一人当たり報酬の成長に明確な正の順位の関連はない（抄録）。", "fun": "日本一もうかっている街・東京が、成長の速さでは全国の最下位近くという意外な事実を、公式の統計の順位で示している。人も会社も集まる街が、そのまま伸びるとは限らない、という身近な疑問に答える材料になる。", "unverified": "本文を入手できず、第4・第5の所見の細部は抄録の範囲でしか確認していない。個人の研究ノートで査読前。"}}, {"id": "pr27", "rank": 27, "headline": "VRの視線計測で緑化が近隣の格差をならすか検証", "title": "Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status", "url": "https://doi.org/10.31234/osf.io/6rmcg", "authors": "Paula Latorre ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Latorre, P., Ferreira, C. P., Molina-Muñoz, A., Castaño-Castaño, S., Morales-Navas, M., & Nieto-Escamez, F. (2026). Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status. https://doi.org/10.31234/osf.io/6rmcg", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "緑を足す小さな介入が、近隣の社会経済の格差による見え方の差をならすかを、VRの視線計測で調べた。", "p3": "75人が、社会経済水準が低・中・高の近隣の360°のバーチャルツアーを、元の条件と緑を足した条件で評価し、60 Hzの視線計測と質問票を組み合わせた。定量の部分だけを報告する。", "p5": "緑の設計は注視の総数を変えず、平均の注視時間を有意に短くした。肯定的な感情・好み・美的評価・リラックスは主観的に上がったが、知覚されたストレスは全体では有意に変わらなかった。介入後は近隣間の美的評価の有意差は残らなかったが、主な結果は質問票の指標に依拠する（抄録）。", "fun": "緑の多い街のほうが気持ちがよいのは想像できるが、この研究は視線の動きまで記録して、緑を足すと「ぼんやり見とれる」ような見方に変わるかを調べているのが面白い。緑の少ない地区に緑を足すと、近隣どうしの印象の差が縮まるかをVRで試せる点も新鮮。", "unverified": "本文を入手できず、検定の種類・効果量・近隣ごとに介入が同じでなかった点の影響は未確認。査読前。"}}, {"id": "pr28", "rank": 28, "headline": "ネットワーク心理測定で尺度の冗長性と次元を評価", "title": "Towards a Network Psychometrics Approach to Assessment: Simulations for Redundancy, Dimensionality, and Loadings", "url": "https://doi.org/10.31237/osf.io/7u9bn_v1", "authors": "Alexander P. Christensen", "venue": "OSF: Thesis Commons", "date": "2026-11-10", "apa": "Christensen, A. P. (2020). Towards a Network Psychometrics Approach to Assessment: Simulations for Redundancy, Dimensionality, and Loadings. https://doi.org/10.31237/osf.io/7u9bn_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OSF Thesis Commonsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ネットワークモデルを、心理尺度の妥当性を検証する道具として位置づける学位論文の一部で、3つのシミュレーションと実例を示した。", "p3": "項目の冗長性を減らす2つの新しい方法、次元（コミュニティ）を検出するいくつかのアルゴリズム、ノード強度を因子負荷量と比べる改良した式を、それぞれシミュレーションで評価した。", "p5": "ネットワークモデルは従来の因子分析と同等の効果的な心理測定の道具になりうる。性格の実データの例で、尺度が理論的・経験的な期待と整合するかを検証できることを示した（抄録）。", "fun": "心理を、項目どうしが互いに影響し合うネットワークとして描く考え方は、まだ測定の道具としては主役になっていない。この研究は、冗長な項目を消す・まとまりを見つける・強さを測る、という地味だが実用的な作業が、従来の因子分析と並ぶ精度でできるかを確かめている。", "unverified": "本文を入手できず、3つのシミュレーションの条件・精度の数値・性格データの内容は未確認。学位論文で査読前。"}}, {"id": "pr29", "rank": 29, "headline": "微分可能なカルマンフィルタで慣性航法の誤差を抑える", "title": "Differentiable Filtering for Inertial Odometry", "url": "https://arxiv.org/abs/2611.13517", "authors": "Yaru Gu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gu, Y., & Zou, T. (2026). Differentiable Filtering for Inertial Odometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13517", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "慣性航法の誤差を抑えるため、カルマンフィルタの更新を学習の計算グラフに組み込んで共同で最適化する手法（DFIO）を示した。", "p3": "誤差状態カルマンフィルタの更新の段階を計算グラフに直接組み込み、事前学習のあとで、変位と共分散の出力ヘッドを、更新後の位置の教師信号で、微分可能な計測更新を通して共同最適化する。", "p5": "歩行者のデータで、平均絶対誤差と1秒の相対並進誤差を、TLIOの基準よりそれぞれ13.2%・39.6%、事前学習のみの版より7.7%・17.4%減らした。校正のないスマートフォンの慣性データでも、並進のドリフトを抑え軌跡のずれを保った（抄録）。", "fun": "センサの出す速さや向きを足し合わせていくと、小さな誤差が積み重なって、歩いた軌跡がどんどんずれていく。この研究は、推定する部分と誤差を直すフィルタを別々に作るのでなく、一つのつながった仕組みとして一緒に学ばせる点が面白い。", "unverified": "本文を入手できず、データセットの名称・フィルタの状態量・ハイパーパラメータは未確認。コードは公開予定とされる。"}}, {"id": "pr30", "rank": 30, "headline": "非同期のセンサ列を連続時間のトランスフォーマで融合", "title": "Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization", "url": "https://arxiv.org/abs/2611.13057", "authors": "Mohamed Bachar (LINEACT) ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bachar, M., Abouelaziz, I., & Ding, Y. (2026). Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13057", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "取得の時刻がばらばらなWiFiと慣性のデータを、共通の時刻に直さずに、時刻つきのトークンとして1つのトランスフォーマーで融合する手法を示した。", "p3": "各観測を、測定値・種類・取得からの経過時間をもつ順序のないトークンの集合として表し、1つの注意ブロックで種類と時間をまたいで融合する。訓練中に種類ごと・個々の観測をランダムに隠して、欠測や古い入力でも動くようにする。", "p5": "別の日に集めたデータを含む評価で、セッション間のずれがある条件でもWiFi指紋の公開基準を上回り、学習による融合や推測航法の基準と競える性能を保ち、観測が欠けたり古くなったりしても性能が緩やかに落ちた（抄録）。", "fun": "スマホの中のセンサは、それぞれ別の速さで測っていて、同じ瞬間の値がそろわない。ふつうは無理にそろえてから処理するが、この研究は、時刻を札にして付け、そろえずにそのまま混ぜて学ばせる点が面白い。一部のセンサが止まっても動き続ける仕掛けも工夫されている。", "unverified": "本文を入手できず、使ったデータセットの名称・精度の数値・各基準法との差は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "搬送波位相の整数不確定性を部分的に解く", "title": "Partial Carrier-Phase Integer Ambiguity Resolution for High Accuracy GNSS Positioning", "url": "https://doi.org/10.31237/osf.io/bv6pj_v1", "authors": "Andreas Brack", "venue": "OSF: Thesis Commons", "date": "2026-11-10", "apa": "Brack, A. (2020). Partial Carrier-Phase Integer Ambiguity Resolution for High Accuracy GNSS Positioning. https://doi.org/10.31237/osf.io/bv6pj_v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OSF Thesis Commonsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "搬送波位相のGNSS測位で、整数不確定性の一部だけを解く「部分的な解決」の理論・方法・アルゴリズムを整理した学位論文。", "p3": "すべての不確定性を解く代わりに部分集合だけを解いて、解を速くする代わりに搬送波位相の高い精度を使い切らない方法を、シミュレーションと実データで論じて解析した。", "p5": "未確認（抄録に結果の記載がない）。", "fun": "GPSのような衛星測位でセンチメートルの精度を出す鍵は、電波の波の「何周目か」という整数を当てることで、全部を当てようとすると難しく時間もかかる。一部だけ先に確定して速く解く、という割り切りの方法を、理論から実データまで整理している点が面白い。", "unverified": "本文を入手できず、結果の数値と比較した方法は未確認。学位論文で査読前。"}}, {"id": "pr32", "rank": 32, "headline": "物理量の変化から故障の機構を導くLLM診断", "title": "Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning", "url": "https://arxiv.org/abs/2611.14263", "authors": "Wenqi Zhou ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhou, W., Baldo, L., Goebel, K., & Chao, M. A. (2026). Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14263", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "センサの情報と故障の機構を結ぶ知識グラフを使って、LLMによる故障診断の精度を上げる枠組み（Chain of Physics）を示した。", "p3": "資産ごとの参照文書から、故障モード・物理量の変化・監視センサの連鎖を保存する制約つき知識グラフを自動で作り、質問ごとに意味の近い経路を取り出して情報と文脈内の例にする。候補の故障モードを別々のLLM呼び出しで分析し、最後に選択肢と照合する。", "p5": "FailureSensorIQの4つの産業資産クラス・3つのLLMで、直接のプロンプトに対して7.8〜19.6ポイント、通常のRAGに対して11.7〜18.2ポイント、診断の正解率が上がった（抄録）。", "fun": "熟練の技術者は、「この値が上がったら、あの部品がこう壊れている」という連鎖で考える。この研究は、その考え方を知識グラフという形に取り出して、AIに見せながら考えさせる点が面白い。文書を検索して渡すだけより、故障がどう伝わるかの例まで見せたほうが効いた。", "unverified": "本文を入手できず、ベンチマークの詳細・LLMの種類・グラフの自動生成の精度は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "多忠実度の演算子推論で縮約モデルを少データで作る", "title": "Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity", "url": "https://arxiv.org/abs/2611.13624", "authors": "Vivian Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, V., Koike, T., Rex, A., & Qian, E. (2026). Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13624", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "高価な高忠実度の計算が少ないとき、安価な低忠実度の計算を併用して、縮約モデルの推定のばらつきを減らす方法（MF-OpInf）を示した。", "p3": "演算子推論（OpInf）は状態とその時間微分から縮約演算子を回帰で求めるが、少ないデータではばらつきが大きい。粗い離散化で得た豊富な低忠実度のデータで高忠実度のスナップショットを補い、多忠実度の線形回帰で縮約演算子を推定する。", "p5": "モデルの偏微分方程式の問題で、同じ計算予算の高忠実度のみのOpInfより高い精度で解の場を予測した（抄録）。", "fun": "少ししか取れない高精度の計算結果を、粗いけれど大量に取れる計算で補う発想は、高級な地図の数枚と粗い地図の大量を組み合わせて全体を描くのに似ている。同じ計算の予算でも、混ぜたほうが精度が上がるのが面白い。", "unverified": "本文を入手できず、対象の方程式・精度の数値・低忠実度データの作り方は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "一度の学習で再利用できる多重スケール有限要素の基底", "title": "Multiscale LegONet: Learning Coefficient-Dependent Local Spaces for Composable Multiscale Finite Elements with Localized Error Bounds", "url": "https://arxiv.org/abs/2611.13515", "authors": "Yueqi Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, Y., Kong, C. X., & Lin, G. (2026). Multiscale LegONet: Learning Coefficient-Dependent Local Spaces for Composable Multiscale Finite Elements with Localized Error Bounds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13515", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "局所の係数パッチで一度だけ学習した基底を再利用して、不均質な楕円型問題の多重スケール有限要素を組み立てる手法（Ms-LegONet）を示した。", "p3": "固定した原始パッチ上で、局所の係数をゼロ境界の空間に写すネットワークだけを学習し、多重スケールの基底は固定した境界トレースの調和拡張として作る。共有する界面のトレースで連続性を保ち、親スケールのネットワークなしに再帰的な静的縮約で大きなブロックを組み立てる。教師データは単一パッチの調和応答なので、全体の解は学習に入らない。", "p5": "高コントラストの原始256個の2次元モザイクで、同じ未知数の基準手法（MsFEM、GMsFEM、ニューラル演算子法、FNO）より誤差のL²が4〜150分の1。2次元では新しい係数ごとに細格子の直接解法より1.6〜2.3倍速く、3次元では鎖のポート応答を有限要素より30〜900倍速く、相対誤差10^-4で計算した（抄録）。", "fun": "レゴブロックのように、小さな部品を一度だけ学習しておき、並べ替えるだけで大きな不均質な材料の計算をする発想が面白い。大きな計算を毎回やり直さずに、部品ごとの誤差も追えるので、設計の試行錯誤が軽くなる。", "unverified": "本文を入手できず、基準手法との比較条件・係数クラスの範囲・誤差の理論の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "花崗岩の断層形成で透水性の変化を局所的に逆解析", "title": "Heterogeneous and episodic permeability evolution and correlation with acoustic emission activity during faulting in granite", "url": "https://arxiv.org/abs/2611.13272", "authors": "Ado Farsi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Farsi, A., Aben, F. M., & Brantut, N. (2026). Heterogeneous and episodic permeability evolution and correlation with acoustic emission activity during faulting in granite (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13272", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "花崗岩の断層ができる過程で、場所ごとの透水性の変化を、流量と間隙水圧から3次元の逆解析で求めた。", "p3": "準静的なせん断破壊試験で測った流量と6か所の内部の間隙水圧を、3次元の有限要素の逆解析にかけて、断層に沿った10個のセルの局所の水理的な透過量（透水量係数）を求める。合成のアンサンブルで回復の精度を調べた。", "p5": "合成データでは透過量を中央値の誤差7〜9%で回復した。実験では、断層の成長とすべりの間に透過量の一時的な増加と減少が交互に現れた。局所の値は約1.6×10^-19 m³（全体の寄与の16倍）に達し、最終段階では断層に沿って2.3倍の差がある。累積の音響放射数は全体の水理の変化を追うが、局所の事象の密度との関係はセルごとに異なる（抄録）。", "fun": "岩が割れていくとき、水の通りやすさは一定でなく、増えたり減ったりを繰り返すという、地下の水の流れの意外な姿が見える。音（音響放射）で割れの広がりは分かっても、水の通りやすさの数値までは音からは言えない、という切り分けも面白い。", "unverified": "本文を入手できず、逆解析の手順・仮定した断層の厚さの扱い・Aben et al. (2024)との比較の詳細は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "グラフ生成モデルの集団で履歴照合の曖昧さを減らす", "title": "An ensemble of graph generative models for assisted history matching of the Brugge field case", "url": "https://arxiv.org/abs/2611.12927", "authors": "Gleb Shishaev ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Shishaev, G., Shirokov, A., Davoodi, S., Al-Shargabi, M., Demyanov, V., & Arnold, D. (2026). An ensemble of graph generative models for assisted history matching of the Brugge field case (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12927", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "堆積の違う領域ごとにグラフ生成モデルを作り、その集まりで石油貯留層の履歴照合の曖昧さを減らす手法を示した。", "p3": "各層序の領域ごとに生成モデル（グラフ・オートエンコーダ）を作り、160次元の共通の潜在空間でCMA-ESにより最適化する。目的関数は静的な坑井データの不一致・動的な生産の不一致・デコーダ由来の潜在距離による地質の現実性のペナルティ。位相的データ解析で、生成器が1つで足りるかを事前に診断する。", "p5": "領域ごとの定式化で首尾一貫した潜在空間が得られ、領域ごとに違う孔隙率・浸透率の関係が保たれた。照合したモデルは油・水の生産を事前の不確実性の範囲で再現し、坑井レベルの照合はEnKF・粒子群最適化などの既発表の研究と同程度だった（抄録）。", "fun": "地下の地層は直接見えないので、「同じ生産量になる地層の候補」が無数にある。この研究は、地質学的にありそうな形の中だけで候補を探すために、地層の「らしさ」を学ばせた生成モデルを使うところが面白い。複数の堆積環境があるときは、環境ごとに別のモデルを用意する。", "unverified": "本文を入手できず、Brugge油田の設定・数値の精度・他手法との差の大きさは未確認。"}}, {"id": "pr37", "rank": 37, "headline": "地すべりの検出と解釈を一つの基盤モデルで行う", "title": "LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding", "url": "https://arxiv.org/abs/2611.12936", "authors": "Shanwen Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, S., Wang, S., Sun, X., & Han, J. (2026). LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12936", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "地すべりの検出と状況の解釈を一つの基盤モデルで行う枠組み（LandslideFM）と、そのベンチマーク（LandslideVL）を示した。", "p3": "少ない教師ラベルと多い教師なしデータを使う半教師あり学習（Source-Agreement Graduated Trust）で複数の視覚課題に適応し、予測した地すべり領域を空間の手がかりとして、パラメータ効率的に微調整した視覚言語モデルに渡して推論させる。", "p5": "公開データセットとLandslideVLでの実験で、定量・定性ともに優れた性能を示し、特に専門的な地すべりの推論と場面の分析で汎用の視覚言語モデルを上回った（抄録）。具体的な数値は抄録にない。", "fun": "写真の中の「崩れた斜面」を見つけるだけでなく、何が起きているかを文章で説明できるAIは、災害の現場で使いやすい。まず領域を絞ってから言葉のAIに渡す二段構えと、そのための初めての評価用データを作った点が面白い。", "unverified": "本文を入手できず、定量的な結果の数値・使った公開データセット・ベンチマークの規模は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "凹形の粒状ローターが鎖状に自己組織化する", "title": "Mechanical pairing and self-assembled chains of non-convex granular rotors", "url": "https://arxiv.org/abs/2611.14120", "authors": "Thomas Barois ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Barois, T., Labiausse, M., Boudet, J.-F., Lintuvuori, J. S., & Kellay, H. (2026). Mechanical pairing and self-assembled chains of non-convex granular rotors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14120", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "凹形の粒状ローターどうしが、引き合って鎖の形に自己組織化することを、実験と数値で示した。", "p3": "回転する活性をもつ凹形の剛体の粒（ローター）で、まず2つの間の相互作用を調べ、次に対が作る結合状態が鎖を作ることを、実験と数値で示した。", "p5": "引力は、回転の活性と雑音の比に制御され、ローターの形にも依存する。結合した対は頑強な鎖になり、鎖は最初から作っておくことも、自己組織化で自然にできることもある（抄録）。", "fun": "ただ回っているだけの粒が、形のおかげで互いに引き合い、ひとりでに鎖の形に並んでいくのが面白い。力を加えて並べたのではなく、回転と雑音のつり合いで引力が生まれるという、粒の集まりの不思議な性質が見える。", "unverified": "本文を入手できず、実験・数値の条件と定量的な結果は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "AI不安とデジタル過負荷が幸福感に及ぼす経路を検討", "title": "AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors", "url": "https://doi.org/10.21203/rs.3.rs-11253139/v1", "authors": "Usha Shree Rathod Bhukya ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bhukya, U. S. R., & Muddasani, R. (2026). AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors. https://doi.org/10.21203/rs.3.rs-11253139/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を読んだ。本文は入手できなかった。結果の一部が抄録で途切れている", "preprint": true, "short": true, "p1": "AI不安・デジタル過負荷・テクノストレスが、感情的消耗を通じて心理的な幸福感を下げる経路と、心理的資本の調整の役割を調べた。", "p3": "JD-Rモデルにもとづく調整媒介モデルを、IT・医療・教育・銀行などの340人のフルタイム従業員の横断調査（6つの尺度）で、5,000回のブートストラップつきCB-SEMで検証し、セクター別の多母集団分析とfsQCAで低い幸福感に関わる配置を調べた。", "p5": "3つの要求はすべて感情的消耗を予測し、AI不安はβ = 0.396だった。結論として、ポリクライシスに由来する要求は主に感情的消耗を通じて低い幸福感と結びつき、要求の目立ち方はセクターで有意に異なり、低い心理的資本は低い幸福感の普遍的な境界条件になる（抄録）。", "fun": "AIに仕事を奪われるかもしれないという不安や、通知の多さによる疲れは、直接心を壊すのではなく「燃え尽きた感じ」を通って幸福感を下げる、という経路を数字で示そうとしている。自分の強み（心理的資本）が、どの職種でも同じように「最後の盾」になるという結論も面白い。", "unverified": "本文を入手できず、他の2つの要求の係数・調整効果の大きさ・標本の偏り（横断調査）は未確認。査読前。"}}, {"id": "pr40", "rank": 40, "headline": "エンジニアのトークン消費は成果を測れるか", "title": "The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures", "url": "https://arxiv.org/abs/2611.13396", "authors": "Shyam Agarwal ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Agarwal, S., Lvova, O., Sergeyuk, A., Serova, A., Bryksin, T., Zimmermann, T., & Vasilescu, B. (2026). The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13396", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "エンジニアのAIコーディングエージェントのトークン消費が、成果ではなく利用の量を測っていることを示した。", "p3": "JetBrainsの404人のエンジニアの5週間のトークン使用量とコミットを結び、412人の社内調査を分析した。", "p5": "トークン消費は主にエンジニア間で違い、似たコミット数の週でも90パーセンタイルは10パーセンタイルの39〜240倍。同じ人の中では、消費が倍になるとコミットが約10%増えた。作業の指標が説明できる割合は、人の間で38%、同じ人の週ごとで13%。調査では、技術職の回答の約9割が、コーディング以外にもエージェントを使っていた。資源の会計に限って使い、成果は課題と結果の証拠で評価するよう勧める（抄録）。", "fun": "昔は「プログラムの行数」で働きぶりを測ろうとして失敗した。いまは「AIに使ったトークンの量」で測ろうとしているが、それもほぼ同じ落とし穴だという指摘が面白い。使う量は、成果でなく「どれだけAIで色々な仕事をしたか」を表している。", "unverified": "本文を入手できず、1社の事例である点の一般化の範囲・各指標の定義は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "従業員監視ソフトは職場のパノプティコンか", "title": "Employee Monitoring: Workplace as a Panopticon?", "url": "https://doi.org/10.31237/osf.io/y7m6c_v1", "authors": "Yuhuai Liu", "venue": "OSF: Thesis Commons", "date": "2026-11-10", "apa": "Liu, Y. (2017). Employee Monitoring: Workplace as a Panopticon? https://doi.org/10.31237/osf.io/y7m6c_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OSF Thesis Commonsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "従業員監視ソフトは、プライバシーの期待をなくして遵守を引き出す社会統制であり、職場は現代版のパノプティコンになっていると論じた。", "p3": "ソフトウェアのベンダーと雇用者の意図、監視ソフトの機能、運用者（システム管理者）の自己認識、監視が従業員に及ぼす実際の影響を調べた。", "p5": "雇用者は、プライバシーの期待をなくすことで、規則の遵守を引き出そうとしている。パノプティコンは社会統制の形として現代の職場に実装されている（抄録）。定量的な結果は抄録にない。", "fun": "みんなが見られているかもしれないと思うだけで行動を変えるという、「円形監獄（パノプティコン）」の考え方が、いまの会社のパソコンの監視ソフトに生きている、という見立てが面白い。実際に「見られている」と感じる効果と、プライバシーの価値のぶつかり合いを問い直す。", "unverified": "本文を入手できず、調べた対象の数・方法・従業員への影響の実証の中身は未確認。学位論文で査読前。"}}, {"id": "pr42", "rank": 42, "headline": "LLM対の協働は60.5%成功、失敗を6類型に整理", "title": "PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles", "url": "https://arxiv.org/abs/2611.14242", "authors": "Javier Hernandez ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Hernandez, J., & Wilson, A. D. (2026). PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14242", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントの協働を、認知心理学にもとづく非対称パズルで測り、失敗を6類型に整理する評価の場（PARLEY）を示した。", "p3": "参照的な伝達・共同の協調・視点取得・空間推論の4つの非対称パズルで、GPT-4o対の会話400件（各課題100件）を集め、データから知覚・適応・協調の3群・6つの失敗類型の分類（PAC）を作った。", "p5": "GPT-4o対の成功率は60.5%で、課題ごとに34〜80%。外部のフィードバックを取り込めないことが失敗の重要な指標で、うまくいかなかった戦略を繰り返し使っていた。分類に基づく介入（N=200）で、平均の課題成功率が70.5%に上がった（抄録）。", "fun": "AIどうしの共同作業は、片方だけが見えている絵を言葉で伝えるような、人間でも難しい課題で試される。失敗の原因は「相手の反応を取り込まない」ことが多く、これは人の会議でもよくある問題なのが面白い。失敗の分類を使うと、成功率を上げられることも示している。", "unverified": "本文を入手できず、6類型の定義の細部・介入の内容・他のモデルでの結果は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "性格を介して文化に合わせた対話を階層的に生成", "title": "HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation", "url": "https://arxiv.org/abs/2611.13207", "authors": "Lingzhi Shen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Shen, L., Cai, X., Long, Y., Razzak, I., & Jameel, S. (2026). HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13207", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "対話生成で、性格を介して文化ごとの言語規範に合わせる階層的な枠組み（HiCAP）を示した。", "p3": "性格を条件にする制御で、まず文化的な口調に合わせ、次に個人の性格の属性に沿って言語表現と内容を整える。教師あり微調整と指示ベースの調整に、動的な指示テンプレートとマルチエージェントの実演を組み合わせる。", "p5": "CulturalPersonasとCPEDの実験で、さまざまな対話生成の指標で最も強い総合の性能を示した（抄録）。具体的な数値は抄録にない。", "fun": "同じ「ありがとう」でも、国によって、人の性格によって、言い方が違う。この研究は、まず文化で話し方の大枠を決め、そのあと性格で細かく整える二段構えで、AIの返事を人らしくする点が面白い。", "unverified": "本文を入手できず、指標ごとの数値・基準手法・性格の表現の仕方は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "住民が証拠を点検して政策提案を作る市民向けAI", "title": "EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice", "url": "https://arxiv.org/abs/2611.13525", "authors": "Evan Pa\\v{c}es-Wiles ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Pačes-Wiles, E., Alvarez, B., Gulabani, S., Kolipaka, A., & Gaikwad, S. 'N. S. (2026). EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13525", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "データセンターをめぐる地域の争いで、住民が証拠・欠けている情報・意見の違いを自分で点検しながら政策提案を作る支援システム（EJAI）を示した。", "p3": "対話的な地図・取り出した証拠・欠測の明示・2つの利害関係者のペルソナをつなぐ、根拠に基づくシステムを作り、21問の小さな機能のベンチマークと、模擬の住民集会の準備をする15人の被験者内の研究で評価した。", "p5": "取り出した証拠は事実の主張の98.4%を支え、欠けた証拠は33件中32件で認めた。企業役員のペルソナは、割り当てた優先事項と合わない証拠の一部を省いた。参加者は、引用されたAIの主張を確認する人、条件つきの提案をする人、ペルソナが単純化や偏りだと感じた人に分かれた（抄録）。", "fun": "AIが答えを出してしまうと、人は証拠を見る前に納得してしまう。この研究は、AIに「証拠・足りない情報・意見の割れ」を見せさせ、判断は人に残す設計にした点が面白い。ただし企業役員の役のAIが、都合の悪い証拠を省いたという落とし穴も見つけた。", "unverified": "本文を入手できず、21問の内容・被験者の評価の数値・地図の指標の詳細は未確認。小規模な評価である点に注意。"}}, {"id": "pr45", "rank": 45, "headline": "Reddit 7.7万件の分極をLLMで構成概念に変換", "title": "Quantifying polarization: detection and analysis of opinion groups on the Gaza conflict in English-language Reddit discourse", "url": "https://econpapers.repec.org/RePEc:cte:wsrepe:51001", "authors": "Scielzo Ortiz ほか", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "Redditのガザ紛争の76 816件のコメントから、意見のグループをLLMと頑健なクラスタリングで取り出す方法を示した。", "p3": "18のサブレディットの1年分のコメントから、政治的立場・感情・談話の口調・主題の枠組み・論証の質の5つの談話変数をLLMのゼロショットで抽出し、専門家のコード化で検証した。5つのクラスタリング構成を、ペアごとの分離度指数で比べた。", "p5": "埋め込みを使う構成は修辞の様式と政治的立場を混同して思想の軸を回復できず、分散の90%を残しても同じだった。検証済みの変数に絞るだけでは足りず、k-meansは非対称な分割になるが、頑健な混合データの枠組みは対称な4グループを回復した。親イスラエルと親パレスチナの両陣営が、敵意のない派と敵意のある反応的な派に分かれる（抄録）。", "fun": "「どちらの味方か」だけで人を分けると見えないが、「話し方が穏やかか攻撃的か」という軸も混ぜると、どちらの陣営の中にも2つの顔があることが見える。AIによる言葉の数値化は、使う特徴によって結果がまるで変わる、という注意にもなっている。", "unverified": "本文を入手できず、専門家のコード化との一致度・クラスタの大きさ・指数の値は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "ペルソナの逸脱と修正を閉じた世界の多エージェントで調べる", "title": "Project Nightcord Sanctuary: A Closed-World Multi-Agent Framework for Studying Persona Drift and Correction in LLM Roleplay Agents", "url": "https://doi.org/10.5281/zenodo.24138238", "authors": "胡, 宸歌", "venue": "Zenodo", "date": "2026-11-11", "apa": "胡 宸歌. (2026). Project Nightcord Sanctuary: A Closed-World Multi-Agent Framework for Studying Persona Drift and Correction in LLM Roleplay Agents (Version v2). Zenodo. https://doi.org/10.5281/ZENODO.24138238", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を読んだ。本文は入手できなかった。審査のない置き場の記録", "preprint": true, "short": true, "p1": "LLMの役割演技で、役柄からの逸脱への自然な耐性と、診断を受けたときの修正への従順さを、別々に測る枠組み（PNS）を示した。", "p3": "知識と共有世界の事実を制限した閉じた世界に、対になる2人の架空の人物を置いた多エージェントの自己対戦で、毎ターンを、声のレベルの手がかりと内容の固有性の手がかりの2層で、ルーターが採点する。", "p5": "3回の修正の事例では、初稿は明らかに役柄から外れ、修正後は構造的には改善したが躊躇があり5/10、言語密度の制約を明示すると8/10になった。知識境界の漏えいの試験（KL-001）では、見ていないはずの私的な事実が、PNSの文脈では20回中0回、全文を渡す文脈では6回、共有記憶つきでは20回中20回漏れた（抄録）。", "fun": "AIに役を演じさせると、だんだん素の「親切なアシスタント」の口調に戻ってしまう。この研究は、「自然に崩れにくいか」と「指摘されたら直せるか」を別の力として測る発想が面白い。見ていないはずの秘密をうっかり話さないかを、20回ずつ試す小さな実験もある。", "unverified": "本文を入手できず、採点の基準・使ったモデルは未確認。Zenodo上の未査読の記録で、評価は限られる。"}}, {"id": "pr47", "rank": 47, "headline": "仕訳テストを5体のAIエージェントの監査チームで行う", "title": "The Agentic Audit Firm: Reconfiguring the Assurance Value Chain", "url": "https://doi.org/10.2139/ssrn.7682593", "authors": "Marco Schreye ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Schreye, M., Dardani, M., Klinkasorn, Y., & A. Vasarhelyi, M. (2026). The Agentic Audit Firm: Reconfiguring the Assurance Value Chain. https://doi.org/10.2139/ssrn.7682593", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "監査法人の仕事を、専門のAIエージェントの「デジタル労働力」で組み直す構想（Agentic Audit Firm）を、5体のエージェントの試作で示した。", "p3": "ポーターの価値連鎖の視点と専門のAIエージェント群を組み合わせ、実際の会計記録で、取引の分析から見直しと報告までの仕訳テストを行う試作を作った。準備のしかたと見直しの方針が異なる4つの監査チームを、専門性・独立性・証拠・方法論・調整・見直しの位置の6つの観点で比べた。", "p5": "初期の所見では、同じモデルの割り当てでも、紛らわしい仕訳の説明があるときにリスクの評価を保つ力と、多くの仕訳を指摘した手続きを追う頻度に、チームの差が出た（抄録）。", "fun": "人間の監査チームのように、役割分担や見直しの回数を変えた「AIの監査チーム」を作って比べるという発想が面白い。同じAIを使っても、チームの組み方で、だまされやすさや追求の粘り強さが変わるという初期の結果が出ている。", "unverified": "本文を入手できず、使ったモデル・仕訳データの規模・各チームの数値は未確認。初期の所見で、査読前。"}}, {"id": "pr48", "rank": 48, "headline": "AIの仕事を監査できるようにするプロセスのコード化", "title": "Made by AI: Process as Code and the Auditability of Human-AI Work", "url": "https://doi.org/10.2139/ssrn.7683979", "authors": "Ivo Oskar Titscher", "venue": "SSRN", "date": "2026-11-10", "apa": "Titscher, I. O. (2026). Made by AI: Process as Code and the Auditability of Human-AI Work. https://doi.org/10.2139/ssrn.7683979", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AIが関わる仕事を、人の判断の記録・規則の版管理・ログで監査できる形にする設計「プロセスのコード化」を提案した。", "p3": "手順をマニュアルで説明するのでなく、人とエージェントが使う道具の中に組み込む。拘束力のある規則を、適用される手順の箇所で理由とともに書いて版管理し、人の判断は署名して記録し、確認はログを残す。法令から指示までのつながりを規則台帳として示す。", "p5": "数値の実証はなく、論考。主張は、AI支援の仕事は監査可能にできるということで、優れているかどうかは今後の測定に残される。承認が増えて誰も読まなくなる「監査の芝居」を、自動化された統治の失敗の型とした（抄録）。", "fun": "AIを使うと「誰が何を根拠に決めたのか」が見えなくなるのが心配の種。この論文は、書類を増やすのではなく、仕事の道具そのものに規則と理由を埋め込んで、あとから見せられるようにする案を出す。承認だけが増えて誰も読まない「監査の芝居」という言葉が印象的。", "unverified": "本文を入手できず、規則台帳の具体例と、提示された検証可能な命題の中身は未確認。概念的な論考で、実証はない。"}}, {"id": "pr49", "rank": 49, "headline": "合成表データで再構成と公平性を分離する拡散モデル", "title": "Decoupling Reconstruction and Fairness in Synthetic Clinical Tabular Data: Development and Multi-Cohort Evaluation of a Vector-Quantized Diffusion Framework (Preprint)", "url": "https://doi.org/10.2196/preprints.116471", "authors": "Nitish Nagesh ほか", "venue": "JMIR Preprints", "date": "2026-11-11", "apa": "Nagesh, N., Bagheri, A., & Rahmani, A. M. (2026). Decoupling Reconstruction and Fairness in Synthetic Clinical Tabular Data: Development and Multi-Cohort Evaluation of a Vector-Quantized Diffusion Framework (Preprint). https://doi.org/10.2196/preprints.116471", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "合成の表データで、再構成と公平性を学習時に混ぜず、標本を取る時点で公平性を作る2段階の生成器（FairVQD）を示した。", "p3": "再構成だけで学習するベクトル量子化オートエンコーダ（第1段階）と、EDMの形式で分類器なしの誘導をつけた入力空間の拡散による仕上げ（第2段階）を組み合わせ、保護属性を標本時に一様なベルヌーイ分布から引いて、合成データの周辺分布を厳密に均衡させる。3つの患者コホートで、Gaussian Copula・CTGAN・TVAEと比べた。", "p5": "3コホートで、等化オッズ比の平均0.90と人口統計学的パリティ比の平均0.81が全手法で最高。最強の公平性なしの基準CTGANに比べ、等化オッズ比は0.90対0.65。下流のTSTR-AUCは平均0.65で、CTGAN（0.69）より4ポイント、TVAE（0.74）より9ポイント低い。第2段階を外すと公平性の比がほぼゼロ（0.06、0.05）に崩れた（抄録）。", "fun": "公平なデータを作ろうとして学習の途中に公平性の罰則を入れると、データを似せる目的と取り合いになる。この研究は、標本を取る最後の段階で保護属性を半々に引くだけで公平性を作る発想が面白い。代わりに、予測に使ったときの精度が少し落ちる代償も、きちんと報告している。", "unverified": "本文を入手できず、3コホートの規模・信頼区間は未確認。医療データでの評価で、査読前。"}}, {"id": "pr50", "rank": 50, "headline": "資産価格づけでのLLM活用の文献整理", "title": "Large Language Models in Asset Pricing: A Literature Review", "url": "https://doi.org/10.2139/ssrn.7683739", "authors": "Mohammad Gheidi", "venue": "SSRN", "date": "2026-11-10", "apa": "Gheidi, M. (2026). Large Language Models in Asset Pricing: A Literature Review. https://doi.org/10.2139/ssrn.7683739", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "資産価格づけでのLLMの使われ方を、ニュースや決算説明会などのテキストを数量の信号に変える応用を中心に整理した文献の総説。", "p3": "テキスト分析の歴史と、資産価格づけでのAI・機械学習の発展の中にLLMを位置づけ、ニュースにもとづく収益の予測、決算説明・開示、企業の方針、ESG・気候リスク、ファンドマネージャーの信念、債券、オプション、為替、LLMエージェントの応用を順に見る。", "p5": "限界として、先読みバイアス・訓練データの漏えい・プロンプトへの敏感さ・モデルの不安定さ・解釈可能性の低さ・取引費用・現実的な標本外の評価の必要を論じ、研究の空白と今後の方向を示す（抄録）。", "fun": "「ニュースを読んだAIが株価の動きを当てる」という発想は魅力的だが、AIが過去の答えを覚えていて「未来を知っている」ように見えてしまう先読みバイアスが大きな落とし穴になる。便利さと信頼性の間の注意点を、応用の種類ごとに整理しているのが面白い。", "unverified": "本文を入手できず、総説が扱う論文の件数・個々の研究の数値は未確認。査読前。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "交差検証の分散を厳密な恒等式で分解", "title": "A Theory of Cross-Validation Variance", "url": "https://arxiv.org/abs/2611.14463", "authors": "Nathaniel S. O'Connell ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "O'Connell, N. S., & Speiser, J. L. (2026). A Theory of Cross-Validation Variance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14463", "why": "交差検証の推定値の分散を、各観測が評価側と学習側で持つ重みの関数として表す有限標本の厳密な恒等式を証明した。平均二乗誤差やAUCなどの指標に使え、分散を分解して、分割の設計の指針を与える。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（要旨、§1、§3.2、§4、§6、§7）を読んだ。§5と付録の証明は読んでいない", "preprint": true, "p1": "交差検証の推定値の分散を、各観測が評価側と学習側で持つ重みの関数として表す、有限標本の厳密な恒等式を証明した（要旨、§3.2の式(3)）。", "p2": "既存の結果は個別の設計（K分割・モンテカルロ分割・ブートストラップ）を別々に扱い、観測の評価と学習という2つの役割を分けず、モデル・訓練の割合・分割の設計がどう分散を決めるかの一般理論がなかった（§1）。", "p3": "交差検証を無作為化された設計と見て、分割が各観測の評価・学習の重みを決めると考える。分散は、評価の分散σ_V²・学習の分散σ_T²・共分散γ₀の3つの定数と重みの二乗和の組み合わせ（式(3)）に、2次以降の項が足されて決まる。データの抽出による分散と、分割の無作為性による分割雑音に分けられる（§3.2、§4.2）。", "p4": "Nadaraya–Watson平滑化の回帰と分類で、MSE・Brierスコア・AUCの3指標、6つの設計、n=250・500・1000について、10^5個のデータセットの分散を理論値と比べた。定数は定義から計算し、当てはめていない（§6）。", "p5": "恒等式の予測と実測は一致し、全分散の比は51セルで0.992〜1.060、分割雑音の比は0.899〜1.051。1次の項だけだと、全分散で最大23%、分割雑音で73%ずれた（§6）。K分割は1次でバランスが取れて分散最適で、1次の分散はKに依存せず、条件のもとで1個抜きが最小。モンテカルロとブートストラップは最適でない（要旨、§4）。AUCでは通常のK分割は分割雑音がKとともに増え、ペア単位のK分割がそれを除く（§7）。", "p6": "著者は、複雑な学習手続きでの分散成分の実用的な推定量や、従属した観測、データで評価単位が決まる指標への拡張を今後の課題とする（§7）。AUCの分割雑音は、有限訓練の補正を計算しないため、n=250で最大7%のずれが残る（§6）。", "fun": "「1個抜き交差検証は、訓練データがほぼ同じになるので分散が大きい」という、教科書でよく言われる常識が、一般には正しくないと証明した点が面白い。分散を「データを抽選で引いたことによるゆらぎ」と「分け方のくじ引きによるゆらぎ」に分けると、分け方を平等にそろえた設計は、後者をほぼ消せる。", "unverified": "付録S1〜S5の証明と、漸近正規性の定理（§5）の仮定の詳細は読んでいない。シミュレーションは1つの学習器（Nadaraya–Watson）に限る。"}}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "潜在因子つきパネルでダブル機械学習を成り立たせる", "title": "Semiparametric Inference in Panel Data with Interactive and High-dimensional Confounding", "url": "https://arxiv.org/abs/2611.14385", "authors": "Bin Chen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Chen, B., Ma, Y., & Yu, Q. (2026). Semiparametric Inference in Panel Data with Interactive and High-dimensional Confounding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14385", "why": "高次元の共変量と潜在的な交互作用の交絡があるパネルでは通常のダブル機械学習が崩れることを示し、処置側と誘導形の因子空間を推定する因子拡張DML（FA-DML）を提案した。二重射影と単位ごとの3分割のクロスフィッティングで推定誤差の影響を抑える。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1、§2.2、§3.1、§5のシミュレーション、§6の応用、§7の結論）を読んだ。証明と付録は読んでいない", "preprint": true, "p1": "高次元の共変量と、単位ごとの負荷をもつ潜在的な交互作用の交絡があるパネルで、処置の効果の信頼区間を作る因子拡張DML（FA-DML）を示した（要旨、§1）。", "p2": "通常のダブル機械学習（DML）は、観測された共変量で処置と結果を残差化しても、共通ショックによる潜在的な因子の成分が残り、処置側と結果側の因子成分の内積の項でスコアが平均ゼロにならない。加法の固定効果や既存の交互作用の固定効果法は、共変量の部分にパラメトリックな形を要する（§1、§2.2）。", "p3": "第1段階の残差にPCAを適用して、処置側と誘導形の因子空間を推定し、二重射影のスコアに入れる。単位ごとの完全な履歴を3つの分割（処置側の副次関数と因子空間、誘導形側、スコアの評価）に分け、6通りの役割の割り当てで平均する。因子×因子の誤差が2つの推定誤差の積になる（§1、§3.1）。", "p4": "シミュレーションは、(N, T) = {100, 200}×{50, 100, 200, 300}、処置係数0.5、共変量30個、線形と2次の副次関数で、2分割の版・因子拡張なしの標準DML・OLSの第1段階と比べた。応用は、50州・1979〜2012年（1,700の州・年）の最低賃金と賃金の50/10分位比（§5、§6）。", "p5": "名目95%の被覆率は、FA-DML（階数が既知／データで選択）で線形が93.4〜95.9%、2次が92.6〜95.8%で、選択した階数との差は最大0.7ポイント。標準DMLの被覆率は全格子で0%、2分割の版は大きく不足した（§5.2）。最低賃金の弾力性は−0.1103（Lasso）と−0.1167（ランダムフォレスト）で、拡張した共変量でも−0.1088と−0.1120。区間はすべて0を除き、最低賃金10%の上昇で50/10の賃金比が約1.1%下がる（§6）。", "p6": "動学パネル（先決変数のある回帰）と、弱い因子への拡張は今後の課題（§7）。2次の副次関数では、短いパネルで被覆率が不足しうる（§5.2）。", "fun": "「州ごとに景気の波への反応が違う」ような、見えない共通ショックの効き方の違いが、最低賃金と格差の関係を見せかけにしてしまう問題を、コンピュータで推定した「因子」を引いて取り除く発想が面白い。データを3つに分けて役割を回すのは、問題を作る人と答え合わせの人を分ける工夫に似ている。", "unverified": "付録（証明、第1段階の収束率、支店規制の応用）と、定理1の漸近正規性の条件の詳細は読んでいない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "集計処置の動学効果の偏りを操作変数で除く", "title": "Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV", "url": "https://arxiv.org/abs/2611.14434", "authors": "Endong Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, E., & Zhang, R. (2026). Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14434", "why": "集計的な処置への曝露と交絡への曝露が相関すると、横断面の設計は動学的な部分均衡効果にバイアスを持つことを解析的に示した。交絡の経路を固定して比べるHELP-IV（異質曝露の局所射影・操作変数）が部分均衡効果を識別できると証明し、州の財政乗数などに適用した。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1、§2の識別、§5.1の結果、§6.1の応用、§7の結論）を読んだ。§3・§4の詳細と付録は読んでいない", "preprint": true, "p1": "集計的な処置への曝露の差を使う二方向固定効果の操作変数（TWFE-IV）の局所射影のHEDGEバイアスを特徴づけ、交絡の経路を固定して部分均衡効果を識別するHELP-IVを示した（要旨、§1、§2）。", "p2": "TWFE-IVは、時点の固定効果が集計的な交絡を吸収すると仮定するが、吸収できるのは全単位に共通な部分だけ。処置への曝露と交絡への曝露が相関するか、交絡が処置に反応するとき、推定にHEDGEバイアスが出る（§1、§2.2、§7）。", "p3": "TWFE-IVの回帰に、交絡の経路の実現値を経路の制御として加え、交絡ショックの代理を曝露で重み付けした操作変数でそれらを操作する（式(10)〜(12)）。複数の曝露・交絡、将来を見る環境、変換した処置・結果に拡張し、推論も与える（§3、§4）。", "p4": "シミュレーションはN=200、T=200、2,000回で、後ろ向きと将来を見る環境のTWFE-IV・分解法・HELP-IVの偏りとRMSEと被覆率（名目90%）を比べた（§5.1.2）。応用は、46州の防衛支出（1969〜2007年）の州別の財政乗数と、郡別の株式資産のショックの雇用効果（§6）。", "p5": "後ろ向きの環境で、TWFE-IVの偏りは−0.18〜0.59、分解法は−0.16〜−0.06、HELP-IVは0.00〜−0.02で、HELP-IVの被覆率は0.88〜0.89（表1）。州の財政乗数は、HELP-IVで1年目0.66から4年目1.69、金利を2つの金融政策の代理で固定したE-HELP-IVで1年目0.60から4年目1.65だった（§6.1の表）。株式資産の応用でも、従来のTWFE-IV推定と異なる値を与え、構造モデルへの含意が違う（§7）。", "p6": "HELP-IVは交絡ショックの代理（操作変数）が観測できるかに依存し、将来を見る環境で一部しか観測できないと、情報制約つきの効果を測ることになる（§3.3、§6.1）。異質な処置効果や空間的なつながり、状態に依存する動学への拡張は今後の課題（§7）。", "fun": "景気の波のときに、いくつもの原因が同時に動く中で、「その支出だけの効果」を取り出すのは難しい。この論文は、他の動きの「道筋」をまるごと固定して比べるという、経済学の「他の条件を同じにして」という考え方を、時間を通じた道筋ごと、データの上で実現する点が面白い。", "unverified": "§3の拡張（複数の交絡・将来を見る環境）の数式と、§4の推論の詳細、付録の証明は読んでいない。株式資産の応用（§6.2）の数値は読んでいない。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "LLMの順位づけで人手評価とLLM審判を併用して推論", "title": "Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback", "url": "https://arxiv.org/abs/2611.13186", "authors": "Gabriel Sargent ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Sargent, G., Sun, W. W., Zhang, Z., & Liu, Y. (2026). Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13186", "why": "人手の評価が高価なため適応的に集める状況で、LLM審判の予測と人手を組み合わせるPP-Rankを提案した。審判のバイアスと適応的な依存があっても妥当な推論ができ、漸近正規性と同時信頼区間を示す。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1、§4.1、§6の半合成の実験、§8の考察）を読んだ。§4.2〜§4.4の仮定と証明、§5、§7は通読していない", "preprint": true, "p1": "人の評価を適応的に集めるLLMの順位づけで、LLM審判の予測を併用して精度を上げつつ、妥当な信頼区間と順位の同時推論を与えるPP-Rankを示した（要旨、§4）。", "p2": "人手の評価は高価で、評価の場は集めた結果にもとづいて次の比較を選ぶため、データは独立同分布でなくなる。LLM審判は安価だがバイアスがあり、通常の推論の枠組みは崩れる（要旨、§1）。", "p3": "逆確率重み付きの推定方程式に、補助的な未ラベルの質問へのLLM審判の予測の項を足し、観測した人の選好による補正項を付ける（式(4)）。モデルの組ごとの重みλで審判への依存を調節して分散を下げる。Bradley–Terryモデルで同時信頼区間と順位の推論を与える（§4.1、§4.4）。", "p4": "UltraFeedback-Extended（約64,000の質問、10のLLMの応答、10の審判の採点）から、人の選好を報酬モデル（Skywork-Reward-V2-8B）で模擬し、同点が約27.5%になるようにした。適応的な組の選択（連結のあと、ε=0.1のε-greedyで上位5モデルを集中的に比較）で、1,000回の試行を行った（§6）。", "p5": "ε=0.1で、ラベルのみの逆確率重み付き推定に比べ、Bradley–Terryの得点のMSEは0.0112から0.0072（35.6%減）、信頼区間の平均幅は0.341から0.276、正確な順位の回復は0.286から0.357（表2）。上位1位の集合を正しく認証できた割合は、一様抽出38%、狙った適応抽出52%、PP-Rank 74%（表1）。逆確率重みのない推定は、適応性が上がると被覆率が悪化し、PP-Rankと逆確率重み付き推定は名目に近い（図2）。", "p6": "実験は半合成で、人の選好を報酬モデルで模擬している点が限界（§6）。非定常なリーダーボード・オンラインで訓練する審判・個人別の順位への拡張は今後の課題（§8）。", "fun": "AIの強さを、人の「こっちが良い」という投票で決めるリーダーボードは、投票を集める順番に偏りが出る。この論文は、足りない投票を別のAI（審判）の採点で補い、偏りが出ても「本当にこの順位か」を保証する点が面白い。同じ人手の数でも、1位を確かめられる割合が38%から74%に上がった。", "unverified": "付録（証明と追加の実験）と、§5のサンプリング要件の詳細は読んでいない。実際の人の選好のデータでの検証ではない。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "表形式基盤モデルで因果媒介分析の信頼区間を作る", "title": "MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis", "url": "https://arxiv.org/abs/2611.13219", "authors": "Shi Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bo, S., & Hu, J. (2026). MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13219", "why": "事前学習済みの表形式基盤モデルを副次関数の予測に使い、クロスフィットした影響関数推定量と、シミュレーションで学習した誤差分位点の別ヘッドで信頼区間を作るMediPFNを提案した。複数の副次関数の推定の不確実性を償却的に扱う。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§1、§3.2、§4の評価と結果、§5の考察）を読んだ。付録と証明は読んでいない", "preprint": true, "p1": "事前学習済みの表形式基盤モデル（TabPFN V3）を因果媒介分析の副次関数の推定に使い、自然間接効果の信頼区間を、実行時に再学習せず作るMediPFNを示した（要旨、§3）。", "p2": "因果媒介分析は処置の効果を間接経路と直接経路に分けるが、複数の副次関数（条件つき平均と傾向スコア）の推定の不確実性を含む信頼区間を作る必要がある。基盤モデルを使うと、その推定の不確実性の扱いが課題になる（要旨、§1）。", "p3": "TabPFN V3の重みは固定し、入力のアダプターと役割別の出力調整だけを学習する。交差適合した影響関数の推定量の標準化した誤差を、既知の間接効果をもつ合成の表で学習し、誤差の分位点・対称化・独立な較正で信頼区間を作る（§3.2）。", "p4": "合成の表は1,152個（分布内768・ソースの変化288・構成の変化96、n=200・600・1000）。実共変量は、8つのOpenMLデータの行を再標本化した表（各128個）。比較相手は線形SEM、ランダムFourier特徴など5手法。評価は名目95%の被覆率と区間の長さ（§4.1）。", "p5": "被覆率は、3つの合成の設定で94.01%・92.97%・91.67%、最初の実共変量の組で94.14%で、各設定で名目95%に最も近い（§4.2）。区間はTabPFN V3（被覆率99.72%以上）より84〜91%短い。線形SEMは区間が短いが被覆率が低い。ストレステストでは、n=200で88.55%、n=600で94.38%、t3雑音で9
