<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

実験の選び方・統計の詳細は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "AIの憲法を市民参加で作り育てる提案", "title": "Living constitutions: Participatory alignment for sovereign foundation models", "url": "https://arxiv.org/abs/2611.13402", "authors": "Stine Lyngs{\\o} Beltoft ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Beltoft, S. L., Vistrup, J., Schneider-Kamp, P., & Poech, L. G. (2026). Living constitutions: Participatory alignment for sovereign foundation models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13402", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AIの価値規範を書いた「憲法」を、市民が参加して繰り返し作り直す過程として扱う提案をした。", "p3": "憲法づくりを、起草・検証・改訂を繰り返す市民科学のような過程と見て、反復的・モジュール的・正当化可能・立場的・正統という5つの原則を立てた。各条項を「確定・争いあり・未決」と印づけ、続く不一致を憲法に記録する。", "p5": "エージェント・ベース・モデルで、熟議の場の参加者の75%が善意なら、市民の50%が悪意でも、この過程が頑健だと示した（抄録）。", "fun": "AIにどんな価値を持たせるかを誰が決めるのかは、意外と難しい問題。意見が割れた部分を無理に決着させず「争いあり」と記録として残す、という発想が面白い。みんなで決めるルールが、悪意のある人が混ざっても崩れにくいことを、コンピュータ上の模擬社会で確かめている。", "unverified": "本文を入手できず、5原則の詳細とモデルの設定（悪意の定義、熟議の方法）は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "議論・反対尋問・自己批判で事実性を高める手法の総説", "title": "Adversarial Factuality: A Review of Debate, Cross-Examination and Self-Critique Mechanisms for Large Language Models", "url": "https://doi.org/10.20944/preprints202611.1036.v1", "authors": "Lei Yang ほか", "venue": "Preprints.org", "date": "2026-11-11", "apa": "Yang, L., Du, S., Chen, Y., Chen, Y., & Ji, L. (2026). Adversarial Factuality: A Review of Debate, Cross-Examination and Self-Critique Mechanisms for Large Language Models. https://doi.org/10.20944/preprints202611.1036.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMに議論・反対尋問・自己批判をさせて事実性を高める手法を、2022〜2026年の研究から2段階の分類で整理した。", "p3": "外部の知識が得られない場合に使う敵対的な相互作用の手法を、根拠の種類と敵対の構造で分類した総説。", "p5": "設計空間は偏って埋まり、どの構造も一様に優れず、どの構造でも「誤った答えに早く収束する偽の合意」が繰り返し起きる。偽の合意の診断は成熟しているが対策はほとんど検証されておらず、既存の評価は外部の正解を前提にするため、内部の一貫性を使う手法に不利とまとめる（抄録）。", "fun": "複数のAIに議論させれば正しくなりそうだが、全員が同じ間違いに落ち着く「偽の合意」が起きやすい。人間の会議や陪審でも起きる現象が、AIでも課題になっているのが面白い。しかも対策はほとんど確かめられていないという指摘が、これからの研究の入口になる。", "unverified": "本文を入手できず、対象にした個々の手法・件数・分類の中身は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "3つのLLMで盲検の内容コーディングを行う手順", "title": "A Blinded Multi-LLM Content-Coding Instrument: Protocol Specification and Inter-Coder Reliability Validation on an Organizational Corpus", "url": "https://doi.org/10.5281/zenodo.24118665", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). A Blinded Multi-LLM Content-Coding Instrument: Protocol Specification and Inter-Coder Reliability Validation on an Organizational Corpus (Version 1.2.0). Zenodo. https://doi.org/10.5281/ZENODO.24118665", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を読んだ。本文は入手できなかった。審査のない置き場の記録", "preprint": true, "short": true, "p1": "仮説を知らない3つのLLMで質的データを独立にコード化し、人間のコーダー間信頼性の手順を機械支援の分析に持ち込む手順を示した。", "p3": "異なる3つのモデルが、出典つきの中立な資料から、仮説と事例の役割を伏せたまま各セルを独立にコード化し、多数決か、決まらなければ旗を立てて著者が裁定する。判断できなければ「不確か」を返し、各呼び出しをモデルの版とともに記録し、手順と空のコード表を事前に固定する。", "p5": "組織統合の30事例のコーパスでほぼ完全な一致（Fleissのκ = .838）を得て、旗の率は2.7%で補助的なトークンに集中した（抄録）。下流の推論の妥当性は別とし、未検証。", "fun": "質的データの分析は、コード化する人が仮説を知っていると、無意識にそれに寄せてしまう問題がある。ここでは3つのAIに仮説を見せずに分担させ、答えられないときは推測せず「不確か」と返させる仕掛けが面白い。人間の研究の作法をAIに移し替えた例になっている。", "unverified": "本文を入手できず、30事例の選び方・コード表の項目は未確認。Zenodo上の未査読の記録で、評価は限られる。"}}, {"id": "pr20", "rank": 20, "headline": "信用リスクの時系列特徴の検証をプラセボで補正", "title": "A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models", "url": "https://doi.org/10.2139/ssrn.7684404", "authors": "Nawaz Muhammad", "venue": "SSRN", "date": "2026-11-10", "apa": "Muhammad, N. (2026). A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models. https://doi.org/10.2139/ssrn.7684404", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "信用リスクのモデルに時間とともに変わる特徴を足す検証が、雑音の特徴でも通ってしまう問題を、プラセボ検定で補正する方法を示した。", "p3": "同じ持続性を持つ偽の時系列を作って比べるプラセボ検定で、検定の大きさを名目に戻す。単に並べ替えた偽系列は、期間の効果を制御しているときだけ有効。", "p5": "信用サイクルを制御しないと、純粋な雑音の特徴が基準のシミュレーションで38%、サイクルが漂うと67%（名目5%）の確率でAUC改善の検定を通る。持続性を合わせたプラセボは2%〜5%に保つが、検出力は73%から30%に落ちる。公開のローンデータでは、Lending Clubで口調の指数が標準の検定は通るがプラセボは通らない（p = 0.71）（抄録）。", "fun": "「新しい特徴を足したら精度が上がった」と思っても、ゆっくり動くだけの無意味な系列でも38%は「上がった」と出てしまう、という落とし穴が面白い。グラフが2本ともゆっくり動いていると、たまたま似て見えるのと同じ仕組みで、似せた偽物と競わせて本物かどうかを確かめる。", "unverified": "本文を入手できず、シミュレーションの設計・Lending Clubの詳細・チェックリストの内容は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "貸し手との関係が強いと監査の労力が減る", "title": "Client Lending Relationships and Audit Production (WP)", "url": "https://doi.org/10.2139/ssrn.7685030", "authors": "Jie Hao ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hao, J., & Pham, V. T. (2026). Client Lending Relationships and Audit Production (WP). https://doi.org/10.2139/ssrn.7685030", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "貸し手との関係が強い企業ほど、監査の労力が減る傾向を示した。", "p3": "借り手と貸し手の関係を、貸し手による継続的な審査と監視を通じた下振れリスクの評価と捉え、監査人の計画に有用な信号になりうるとして、監査報酬・報告遅延・継続企業意見との関係を調べた。", "p5": "貸出関係が強いと、監査報酬が低く報告遅延が短く、不正確な継続企業意見を出す可能性も低い。効果は、貸し手のリスク評価が情報的なとき、貸し手と監査人の意思疎通が効率的なときに強い（抄録）。", "fun": "銀行が何度も貸して企業を見張っている、その情報が、監査人の仕事にまで効いてくるという発想が面白い。銀行の審査と会計士の監査という別々の「目」が、実は互いのコストを下げているかもしれない。", "unverified": "本文を入手できず、標本・変数の定義・統計の有意水準は未確認。ワーキングペーパーで査読前。"}}, {"id": "pr22", "rank": 22, "headline": "炭素クレジットの開示を専門家ガイドの少数ショットで分類", "title": "CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures", "url": "https://doi.org/10.21203/rs.3.rs-11679188/v1", "authors": "Hang Thanh Bui ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bui, H. T., Lee, E., & Evans, M. C. (2026). CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures. https://doi.org/10.21203/rs.3.rs-11679188/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "企業報告書の炭素クレジットの記述を、専門家の分類に沿って段落単位で選び分ける方法を示した。", "p3": "専門家が定めた分類・紛らわしい負例・少量データ向けの分類法を組み合わせ、不確かなものは人の確認に回す。ASX100の2024〜2025年の報告書から、キーワード一致の文8,299件と段落の候補15,026件を作り、各100段落の専門家ラベル付きデータ3つで、ClimateBERTの微調整とSetFit–MiniLMの少数ショットを比べた。", "p5": "5分割の交差検証で、炭素クレジットの関連性にはClimateBERTの微調整（正解率93.8%）を、感情と使用の報告にはSetFit–MiniLMを選んだ（抄録）。", "fun": "「クレジット」「オフセット」「ネット」という語は、金融・会計・環境で別々の意味で使われるので、キーワード検索だけでは見つけにくい。専門家のラベルが100段落ずつでも動かせる点と、自信のない判断を人に回す点が、現場で使いやすい工夫として面白い。", "unverified": "本文を入手できず、ラベルの基準・誤分類の例・人へ回す閾値は未確認。査読前の記録。"}}, {"id": "pr23", "rank": 23, "headline": "時点整合を守るLLMエージェントの金融ベンチマーク", "title": "BuySideFlow: A Point-in-Time Benchmark for LLM Agents in Investment Research", "url": "https://arxiv.org/abs/2611.12966", "authors": "Dong Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bo, D., Zhang, F., Cheng, K., Zhao, X., Su, X., Wang, Y., Xu, J., Li, C., Chen, H., & Zhang, J. (2026). BuySideFlow: A Point-in-Time Benchmark for LLM Agents in Investment Research (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12966", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントが、開示日の締め切りと履歴の版を守って投資調査の分析ができるかを測るベンチマークを示した。", "p3": "株式・ファンド・債券・マクロの実務家由来の中国語の課題408件を、ライセンスのある実運用の金融データベースの固定スナップショットで用意し、実行可能な参照と時間的な誤りの分類、結果の確認と専門家による作業の監査を組み合わせた。", "p5": "9つのエージェント構成で結果の正確さは16.2%〜36.8%。100の共通課題の900回の実行を監査すると、結果の確認を通った380回のうち193回（50.8%）に時点の違反があり、出力の一致だけでは時間的な妥当性を示せない（抄録）。", "fun": "「答えが合っている」ことと「その時点で分かっていた情報だけで答えている」ことは別で、AIが未来の情報を使ってしまう「先読み」が、結果の合っていた回の半数で見つかった。答え合わせだけでは見抜けないずるを、作業の監査で見つけ出した点が面白い。", "unverified": "本文を入手できず、課題の作り方・時間的な誤りの分類の中身・各エージェント構成の違いは未確認。"}}, {"id": "pr24", "rank": 24, "headline": "LLMは親会社の開示でブランド評価がぶれるか", "title": "Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception", "url": "https://doi.org/10.5281/zenodo.24117389", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception (Version 1.3.0). Zenodo. https://doi.org/10.5281/ZENODO.24117389", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を読んだ。本文は入手できなかった。審査のない置き場の記録", "preprint": true, "short": true, "p1": "LLMはブランドの親会社を知らされても評価がほとんど変わらないこと（免疫）を、13のLLMで示した。", "p3": "7つの訓練系統の13のLLMで、ポートフォリオの型が違う20ブランドを、直接の評価・自然な推薦・会話の途中での親会社の開示・母語での提示の4つの方法で評価させ、7,975件の観察を得た。マーケティング研究に出た別の20ブランドで拡張し、全体で9,925件・40ブランドとした。", "p5": "親会社の枠組みを示しても次元集中指数の変化はほぼゼロ（平均|ΔDCI| = .23）で、20ブランドのうち18ブランドで±1.0点以内の同等性が確認された。会話の途中の開示では、逆向きの憧れの構造（Geely Autoなど）にわずかな平坦化が見られた（抄録）。", "fun": "ブランドの親会社を教えられると、人は「あの有名企業の系列か」と見方を変えるものだが、LLMはほとんど変わらなかった、という結果が面白い。LLMは親会社との関係をあらかじめ覚えているので、あとから言われても揺れない、という見立てが検証されている。", "unverified": "本文を入手できず、ブランド・質問の詳細と次元集中指数の定義は未確認。Zenodo上の未査読の記録で、評価は限られる。"}}, {"id": "pr25", "rank": 25, "headline": "空き店舗の業種配置を位置情報データで最適化", "title": "Revitalizing Urban Retail: Allocating Vacant Storefronts with Smartphone Location Data", "url": "https://doi.org/10.2139/ssrn.7682805", "authors": "Hansheng Jiang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Jiang, H., Zhang, J., & Brown, C. (2026). Revitalizing Urban Retail: Allocating Vacant Storefronts with Smartphone Location Data. https://doi.org/10.2139/ssrn.7682805", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "空き店舗にどの業種をどこへ入れるかを、位置情報のデータから推定した需要モデルで最適化する枠組みを示した。", "p3": "端末単位のスマートフォンの位置情報で、業種別の店舗数が出発地のトリップ発生と目的地選択の両方を決める空間需要モデルを推定し、立地ごとの空き容量と業種別の追加の上限のもとで、トリップ重みのロジサム目的を最大化する。移転探索のヒューリスティックと、配分の質を保証する上界を使う。", "p5": "マンハッタンとブルックリンの85の郵便番号地域で、約112 million件の買い物・余暇のトリップと10万超のPOIを使い、飲食店とカフェを優先する配分を得た。制約つき比例配分に対し最大の利得の99.993%以上を得て、同じ目的を既存店の比例拡大で達成するには43.3%多い出店が必要。適格な立地・業種の組の99.0%が補完関係だった（抄録）。", "fun": "空き店舗に何を入れるかは、人気のある店を増やせばよいわけではない。新しい店は客を奪い合う一方で、客を次の店へ連れていく面もある。その競争と相乗りを人の動きのデータで測り、どの業種をどこへ入れるかを数学で選ぶところが面白い。", "unverified": "本文を入手できず、モデルの式・推定結果の頑健性・比較の基準の詳細は未確認。査読前。"}}, {"id": "pr26", "rank": 26, "headline": "東京は生産性の水準が1位でも成長率は47位", "title": "東京パズルの観測事実: 県民経済計算による人口・生産性・所得・雇用者報酬の地域比較", "url": "https://doi.org/10.51094/jxiv.7112", "authors": "大塚, 章弘", "venue": "Jxiv", "date": "2026-11-08", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Jxivの抄録（英語・日本語）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "東京は生産性・所得・報酬の水準が高いのに、一人当たりの成長は低いという「東京パズル」の観測事実を、県民経済計算で整理した。", "p3": "内閣府の県民経済計算（令和5年度版）の47都道府県・2012〜2023年度の、人口・生産性・所得・雇用者報酬を比較して、記述的に整理する。因果効果は扱わない。", "p5": "東京は生産性・所得・報酬の水準で1位だが、一人当たり実質産出の成長は47位、労働生産性の成長は33位。南関東の4都県の労働生産性は全期間で全国の伸びを下回り、東京圏では産出の増加は東京、雇用の増加は周辺県に集中する。労働生産性の成長と一人当たり報酬の成長に明確な正の順位の関連はない（抄録）。", "fun": "日本一もうかっている街・東京が、成長の速さでは全国の最下位近くという意外な事実を、公式の統計の順位で示している。人も会社も集まる街が、そのまま伸びるとは限らない、という身近な疑問に答える材料になる。", "unverified": "本文を入手できず、第4・第5の所見の細部は抄録の範囲でしか確認していない。個人の研究ノートで査読前。"}}, {"id": "pr27", "rank": 27, "headline": "VRの視線計測で緑化が近隣の格差をならすか検証", "title": "Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status", "url": "https://doi.org/10.31234/osf.io/6rmcg", "authors": "Paula Latorre ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Latorre, P., Ferreira, C. P., Molina-Muñoz, A., Castaño-Castaño, S., Morales-Navas, M., & Nieto-Escamez, F. (2026). Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status. https://doi.org/10.31234/osf.io/6rmcg", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "緑を足す小さな介入が、近隣の社会経済の格差による見え方の差をならすかを、VRの視線計測で調べた。", "p3": "75人が、社会経済水準が低・中・高の近隣の360°のバーチャルツアーを、元の条件と緑を足した条件で評価し、60 Hzの視線計測と質問票を組み合わせた。定量の部分だけを報告する。", "p5": "緑の設計は注視の総数を変えず、平均の注視時間を有意に短くした。肯定的な感情・好み・美的評価・リラックスは主観的に上がったが、知覚されたストレスは全体では有意に変わらなかった。介入後は近隣間の美的評価の有意差は残らなかったが、主な結果は質問票の指標に依拠する（抄録）。", "fun": "緑の多い街のほうが気持ちがよいのは想像できるが、この研究は視線の動きまで記録して、緑を足すと「ぼんやり見とれる」ような見方に変わるかを調べているのが面白い。緑の少ない地区に緑を足すと、近隣どうしの印象の差が縮まるかをVRで試せる点も新鮮。", "unverified": "本文を入手できず、検定の種類・効果量・近隣ごとに介入が同じでなかった点の影響は未確認。査読前。"}}, {"id": "pr28", "rank": 28, "headline": "ネットワーク心理測定で尺度の冗長性と次元を評価", "title": "Towards a Network Psychometrics Approach to Assessment: Simulations for Redundancy, Dimensionality, and Loadings", "url": "https://doi.org/10.31237/osf.io/7u9bn_v1", "authors": "Alexander P. Christensen", "venue": "OSF: Thesis Commons", "date": "2026-11-10", "apa": "Christensen, A. P. (2020). Towards a Network Psychometrics Approach to Assessment: Simulations for Redundancy, Dimensionality, and Loadings. https://doi.org/10.31237/osf.io/7u9bn_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OSF Thesis Commonsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ネットワークモデルを、心理尺度の妥当性を検証する道具として位置づける学位論文の一部で、3つのシミュレーションと実例を示した。", "p3": "項目の冗長性を減らす2つの新しい方法、次元（コミュニティ）を検出するいくつかのアルゴリズム、ノード強度を因子負荷量と比べる改良した式を、それぞれシミュレーションで評価した。", "p5": "ネットワークモデルは従来の因子分析と同等の効果的な心理測定の道具になりうる。性格の実データの例で、尺度が理論的・経験的な期待と整合するかを検証できることを示した（抄録）。", "fun": "心理を、項目どうしが互いに影響し合うネットワークとして描く考え方は、まだ測定の道具としては主役になっていない。この研究は、冗長な項目を消す・まとまりを見つける・強さを測る、という地味だが実用的な作業が、従来の因子分析と並ぶ精度でできるかを確かめている。", "unverified": "本文を入手できず、3つのシミュレーションの条件・精度の数値・性格データの内容は未確認。学位論文で査読前。"}}, {"id": "pr29", "rank": 29, "headline": "微分可能なカルマンフィルタで慣性航法の誤差を抑える", "title": "Differentiable Filtering for Inertial Odometry", "url": "https://arxiv.org/abs/2611.13517", "authors": "Yaru Gu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gu, Y., & Zou, T. (2026). Differentiable Filtering for Inertial Odometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13517", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "慣性航法の誤差を抑えるため、カルマンフィルタの更新を学習の計算グラフに組み込んで共同で最適化する手法（DFIO）を示した。", "p3": "誤差状態カルマンフィルタの更新の段階を計算グラフに直接組み込み、事前学習のあとで、変位と共分散の出力ヘッドを、更新後の位置の教師信号で、微分可能な計測更新を通して共同最適化する。", "p5": "歩行者のデータで、平均絶対誤差と1秒の相対並進誤差を、TLIOの基準よりそれぞれ13.2%・39.6%、事前学習のみの版より7.7%・17.4%減らした。校正のないスマートフォンの慣性データでも、並進のドリフトを抑え軌跡のずれを保った（抄録）。", "fun": "センサの出す速さや向きを足し合わせていくと、小さな誤差が積み重なって、歩いた軌跡がどんどんずれていく。この研究は、推定する部分と誤差を直すフィルタを別々に作るのでなく、一つのつながった仕組みとして一緒に学ばせる点が面白い。", "unverified": "本文を入手できず、データセットの名称・フィルタの状態量・ハイパーパラメータは未確認。コードは公開予定とされる。"}}, {"id": "pr30", "rank": 30, "headline": "非同期のセンサ列を連続時間のトランスフォーマで融合", "title": "Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization", "url": "https://arxiv.org/abs/2611.13057", "authors": "Mohamed Bachar (LINEACT) ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bachar, M., Abouelaziz, I., & Ding, Y. (2026). Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13057", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "取得の時刻がばらばらなWiFiと慣性のデータを、共通の時刻に直さずに、時刻つきのトークンとして1つのトランスフォーマーで融合する手法を示した。", "p3": "各観測を、測定値・種類・取得からの経過時間をもつ順序のないトークンの集合として表し、1つの注意ブロックで種類と時間をまたいで融合する。訓練中に種類ごと・個々の観測をランダムに隠して、欠測や古い入力でも動くようにする。", "p5": "別の日に集めたデータを含む評価で、セッション間のずれがある条件でもWiFi指紋の公開基準を上回り、学習による融合や推測航法の基準と競える性能を保ち、観測が欠けたり古くなったりしても性能が緩やかに落ちた（抄録）。", "fun": "スマホの中のセンサは、それぞれ別の速さで測っていて、同じ瞬間の値がそろわない。ふつうは無理にそろえてから処理するが、この研究は、時刻を札にして付け、そろえずにそのまま混ぜて学ばせる点が面白い。一部のセンサが止まっても動き続ける仕掛けも工夫されている。", "unverified": "本文を入手できず、使ったデータセットの名称・精度の数値・各基準法との差は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "搬送波位相の整数不確定性を部分的に解く", "title": "Partial Carrier-Phase Integer Ambiguity Resolution for High Accuracy GNSS Positioning", "url": "https://doi.org/10.31237/osf.io/bv6pj_v1", "authors": "Andreas Brack", "venue": "OSF: Thesis Commons", "date": "2026-11-10", "apa": "Brack, A. (2020). Partial Carrier-Phase Integer Ambiguity Resolution for High Accuracy GNSS Positioning. https://doi.org/10.31237/osf.io/bv6pj_v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OSF Thesis Commonsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "搬送波位相のGNSS測位で、整数不確定性の一部だけを解く「部分的な解決」の理論・方法・アルゴリズムを整理した学位論文。", "p3": "すべての不確定性を解く代わりに部分集合だけを解いて、解を速くする代わりに搬送波位相の高い精度を使い切らない方法を、シミュレーションと実データで論じて解析した。", "p5": "未確認（抄録に結果の記載がない）。", "fun": "GPSのような衛星測位でセンチメートルの精度を出す鍵は、電波の波の「何周目か」という整数を当てることで、全部を当てようとすると難しく時間もかかる。一部だけ先に確定して速く解く、という割り切りの方法を、理論から実データまで整理している点が面白い。", "unverified": "本文を入手できず、結果の数値と比較した方法は未確認。学位論文で査読前。"}}, {"id": "pr32", "rank": 32, "headline": "物理量の変化から故障の機構を導くLLM診断", "title": "Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning", "url": "https://arxiv.org/abs/2611.14263", "authors": "Wenqi Zhou ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhou, W., Baldo, L., Goebel, K., & Chao, M. A. (2026). Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14263", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "センサの情報と故障の機構を結ぶ知識グラフを使って、LLMによる故障診断の精度を上げる枠組み（Chain of Physics）を示した。", "p3": "資産ごとの参照文書から、故障モード・物理量の変化・監視センサの連鎖を保存する制約つき知識グラフを自動で作り、質問ごとに意味の近い経路を取り出して情報と文脈内の例にする。候補の故障モードを別々のLLM呼び出しで分析し、最後に選択肢と照合する。", "p5": "FailureSensorIQの4つの産業資産クラス・3つのLLMで、直接のプロンプトに対して7.8〜19.6ポイント、通常のRAGに対して11.7〜18.2ポイント、診断の正解率が上がった（抄録）。", "fun": "熟練の技術者は、「この値が上がったら、あの部品がこう壊れている」という連鎖で考える。この研究は、その考え方を知識グラフという形に取り出して、AIに見せながら考えさせる点が面白い。文書を検索して渡すだけより、故障がどう伝わるかの例まで見せたほうが効いた。", "unverified": "本文を入手できず、ベンチマークの詳細・LLMの種類・グラフの自動生成の精度は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "多忠実度の演算子推論で縮約モデルを少データで作る", "title": "Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity", "url": "https://arxiv.org/abs/2611.13624", "authors": "Vivian Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, V., Koike, T., Rex, A., & Qian, E. (2026). Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13624", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "高価な高忠実度の計算が少ないとき、安価な低忠実度の計算を併用して、縮約モデルの推定のばらつきを減らす方法（MF-OpInf）を示した。", "p3": "演算子推論（OpInf）は状態とその時間微分から縮約演算子を回帰で求めるが、少ないデータではばらつきが大きい。粗い離散化で得た豊富な低忠実度のデータで高忠実度のスナップショットを補い、多忠実度の線形回帰で縮約演算子を推定する。", "p5": "モデルの偏微分方程式の問題で、同じ計算予算の高忠実度のみのOpInfより高い精度で解の場を予測した（抄録）。", "fun": "少ししか取れない高精度の計算結果を、粗いけれど大量に取れる計算で補う発想は、高級な地図の数枚と粗い地図の大量を組み合わせて全体を描くのに似ている。同じ計算の予算でも、混ぜたほうが精度が上がるのが面白い。", "unverified": "本文を入手できず、対象の方程式・精度の数値・低忠実度データの作り方は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "一度の学習で再利用できる多重スケール有限要素の基底", "title": "Multiscale LegONet: Learning Coefficient-Dependent Local Spaces for Composable Multiscale Finite Elements with Localized Error Bounds", "url": "https://arxiv.org/abs/2611.13515", "authors": "Yueqi Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, Y., Kong, C. X., & Lin, G. (2026). Multiscale LegONet: Learning Coefficient-Dependent Local Spaces for Composable Multiscale Finite Elements with Localized Error Bounds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13515", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "局所の係数パッチで一度だけ学習した基底を再利用して、不均質な楕円型問題の多重スケール有限要素を組み立てる手法（Ms-LegONet）を示した。", "p3": "固定した原始パッチ上で、局所の係数をゼロ境界の空間に写すネットワークだけを学習し、多重スケールの基底は固定した境界トレースの調和拡張として作る。共有する界面のトレースで連続性を保ち、親スケールのネットワークなしに再帰的な静的縮約で大きなブロックを組み立てる。教師データは単一パッチの調和応答なので、全体の解は学習に入らない。", "p5": "高コントラストの原始256個の2次元モザイクで、同じ未知数の基準手法（MsFEM、GMsFEM、ニューラル演算子法、FNO）より誤差のL²が4〜150分の1。2次元では新しい係数ごとに細格子の直接解法より1.6〜2.3倍速く、3次元では鎖のポート応答を有限要素より30〜900倍速く、相対誤差10^-4で計算した（抄録）。", "fun": "レゴブロックのように、小さな部品を一度だけ学習しておき、並べ替えるだけで大きな不均質な材料の計算をする発想が面白い。大きな計算を毎回やり直さずに、部品ごとの誤差も追えるので、設計の試行錯誤が軽くなる。", "unverified": "本文を入手できず、基準手法との比較条件・係数クラスの範囲・誤差の理論の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "花崗岩の断層形成で透水性の変化を局所的に逆解析", "title": "Heterogeneous and episodic permeability evolution and correlation with acoustic emission activity during faulting in granite", "url": "https://arxiv.org/abs/2611.13272", "authors": "Ado Farsi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Farsi, A., Aben, F. M., & Brantut, N. (2026). Heterogeneous and episodic permeability evolution and correlation with acoustic emission activity during faulting in granite (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13272", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "花崗岩の断層ができる過程で、場所ごとの透水性の変化を、流量と間隙水圧から3次元の逆解析で求めた。", "p3": "準静的なせん断破壊試験で測った流量と6か所の内部の間隙水圧を、3次元の有限要素の逆解析にかけて、断層に沿った10個のセルの局所の水理的な透過量（透水量係数）を求める。合成のアンサンブルで回復の精度を調べた。", "p5": "合成データでは透過量を中央値の誤差7〜9%で回復した。実験では、断層の成長とすべりの間に透過量の一時的な増加と減少が交互に現れた。局所の値は約1.6×10^-19 m³（全体の寄与の16倍）に達し、最終段階では断層に沿って2.3倍の差がある。累積の音響放射数は全体の水理の変化を追うが、局所の事象の密度との関係はセルごとに異なる（抄録）。", "fun": "岩が割れていくとき、水の通りやすさは一定でなく、増えたり減ったりを繰り返すという、地下の水の流れの意外な姿が見える。音（音響放射）で割れの広がりは分かっても、水の通りやすさの数値までは音からは言えない、という切り分けも面白い。", "unverified": "本文を入手できず、逆解析の手順・仮定した断層の厚さの扱い・Aben et al. (2024)との比較の詳細は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "グラフ生成モデルの集団で履歴照合の曖昧さを減らす", "title": "An ensemble of graph generative models for assisted history matching of the Brugge field case", "url": "https://arxiv.org/abs/2611.12927", "authors": "Gleb Shishaev ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Shishaev, G., Shirokov, A., Davoodi, S., Al-Shargabi, M., Demyanov, V., & Arnold, D. (2026). An ensemble of graph generative models for assisted history matching of the Brugge field case (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12927", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "堆積の違う領域ごとにグラフ生成モデルを作り、その集まりで石油貯留層の履歴照合の曖昧さを減らす手法を示した。", "p3": "各層序の領域ごとに生成モデル（グラフ・オートエンコーダ）を作り、160次元の共通の潜在空間でCMA-ESにより最適化する。目的関数は静的な坑井データの不一致・動的な生産の不一致・デコーダ由来の潜在距離による地質の現実性のペナルティ。位相的データ解析で、生成器が1つで足りるかを事前に診断する。", "p5": "領域ごとの定式化で首尾一貫した潜在空間が得られ、領域ごとに違う孔隙率・浸透率の関係が保たれた。照合したモデルは油・水の生産を事前の不確実性の範囲で再現し、坑井レベルの照合はEnKF・粒子群最適化などの既発表の研究と同程度だった（抄録）。", "fun": "地下の地層は直接見えないので、「同じ生産量になる地層の候補」が無数にある。この研究は、地質学的にありそうな形の中だけで候補を探すために、地層の「らしさ」を学ばせた生成モデルを使うところが面白い。複数の堆積環境があるときは、環境ごとに別のモデルを用意する。", "unverified": "本文を入手できず、Brugge油田の設定・数値の精度・他手法との差の大きさは未確認。"}}, {"id": "pr37", "rank": 37, "headline": "地すべりの検出と解釈を一つの基盤モデルで行う", "title": "LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding", "url": "https://arxiv.org/abs/2611.12936", "authors": "Shanwen Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, S., Wang, S., Sun, X., & Han, J. (2026). LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12936", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "地すべりの検出と状況の解釈を一つの基盤モデルで行う枠組み（LandslideFM）と、そのベンチマーク（LandslideVL）を示した。", "p3": "少ない教師ラベルと多い教師なしデータを使う半教師あり学習（Source-Agreement Graduated Trust）で複数の視覚課題に適応し、予測した地すべり領域を空間の手がかりとして、パラメータ効率的に微調整した視覚言語モデルに渡して推論させる。", "p5": "公開データセットとLandslideVLでの実験で、定量・定性ともに優れた性能を示し、特に専門的な地すべりの推論と場面の分析で汎用の視覚言語モデルを上回った（抄録）。具体的な数値は抄録にない。", "fun": "写真の中の「崩れた斜面」を見つけるだけでなく、何が起きているかを文章で説明できるAIは、災害の現場で使いやすい。まず領域を絞ってから言葉のAIに渡す二段構えと、そのための初めての評価用データを作った点が面白い。", "unverified": "本文を入手できず、定量的な結果の数値・使った公開データセット・ベンチマークの規模は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "凹形の粒状ローターが鎖状に自己組織化する", "title": "Mechanical pairing and self-assembled chains of non-convex granular rotors", "url": "https://arxiv.org/abs/2611.14120", "authors": "Thomas Barois ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Barois, T., Labiausse, M., Boudet, J.-F., Lintuvuori, J. S., & Kellay, H. (2026). Mechanical pairing and self-assembled chains of non-convex granular rotors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14120", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "凹形の粒状ローターどうしが、引き合って鎖の形に自己組織化することを、実験と数値で示した。", "p3": "回転する活性をもつ凹形の剛体の粒（ローター）で、まず2つの間の相互作用を調べ、次に対が作る結合状態が鎖を作ることを、実験と数値で示した。", "p5": "引力は、回転の活性と雑音の比に制御され、ローターの形にも依存する。結合した対は頑強な鎖になり、鎖は最初から作っておくことも、自己組織化で自然にできることもある（抄録）。", "fun": "ただ回っているだけの粒が、形のおかげで互いに引き合い、ひとりでに鎖の形に並んでいくのが面白い。力を加えて並べたのではなく、回転と雑音のつり合いで引力が生まれるという、粒の集まりの不思議な性質が見える。", "unverified": "本文を入手できず、実験・数値の条件と定量的な結果は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "AI不安とデジタル過負荷が幸福感に及ぼす経路を検討", "title": "AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors", "url": "https://doi.org/10.21203/rs.3.rs-11253139/v1", "authors": "Usha Shree Rathod Bhukya ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bhukya, U. S. R., & Muddasani, R. (2026). AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors. https://doi.org/10.21203/rs.3.rs-11253139/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を読んだ。本文は入手できなかった。結果の一部が抄録で途切れている", "preprint": true, "short": true, "p1": "AI不安・デジタル過負荷・テクノストレスが、感情的消耗を通じて心理的な幸福感を下げる経路と、心理的資本の調整の役割を調べた。", "p3": "JD-Rモデルにもとづく調整媒介モデルを、IT・医療・教育・銀行などの340人のフルタイム従業員の横断調査（6つの尺度）で、5,000回のブートストラップつきCB-SEMで検証し、セクター別の多母集団分析とfsQCAで低い幸福感に関わる配置を調べた。", "p5": "3つの要求はすべて感情的消耗を予測し、AI不安はβ = 0.396だった。結論として、ポリクライシスに由来する要求は主に感情的消耗を通じて低い幸福感と結びつき、要求の目立ち方はセクターで有意に異なり、低い心理的資本は低い幸福感の普遍的な境界条件になる（抄録）。", "fun": "AIに仕事を奪われるかもしれないという不安や、通知の多さによる疲れは、直接心を壊すのではなく「燃え尽きた感じ」を通って幸福感を下げる、という経路を数字で示そうとしている。自分の強み（心理的資本）が、どの職種でも同じように「最後の盾」になるという結論も面白い。", "unverified": "本文を入手できず、他の2つの要求の係数・調整効果の大きさ・標本の偏り（横断調査）は未確認。査読前。"}}, {"id": "pr40", "rank": 40, "headline": "エンジニアのトークン消費は成果を測れるか", "title": "The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures", "url": "https://arxiv.org/abs/2611.13396", "authors": "Shyam Agarwal ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Agarwal, S., Lvova, O., Sergeyuk, A., Serova, A., Bryksin, T., Zimmermann, T., & Vasilescu, B. (2026). The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13396", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "エンジニアのAIコーディングエージェントのトークン消費が、成果ではなく利用の量を測っていることを示した。", "p3": "JetBrainsの404人のエンジニアの5週間のトークン使用量とコミットを結び、412人の社内調査を分析した。", "p5": "トークン消費は主にエンジニア間で違い、似たコミット数の週でも90パーセンタイルは10パーセンタイルの39〜240倍。同じ人の中では、消費が倍になるとコミットが約10%増えた。作業の指標が説明できる割合は、人の間で38%、同じ人の週ごとで13%。調査では、技術職の回答の約9割が、コーディング以外にもエージェントを使っていた。資源の会計に限って使い、成果は課題と結果の証拠で評価するよう勧める（抄録）。", "fun": "昔は「プログラムの行数」で働きぶりを測ろうとして失敗した。いまは「AIに使ったトークンの量」で測ろうとしているが、それもほぼ同じ落とし穴だという指摘が面白い。使う量は、成果でなく「どれだけAIで色々な仕事をしたか」を表している。", "unverified": "本文を入手できず、1社の事例である点の一般化の範囲・各指標の定義は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "従業員監視ソフトは職場のパノプティコンか", "title": "Employee Monitoring: Workplace as a Panopticon?", "url": "https://doi.org/10.31237/osf.io/y7m6c_v1", "authors": "Yuhuai Liu", "venue": "OSF: Thesis Commons", "date": "2026-11-10", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OSF Thesis Commonsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "従業員監視ソフトは、プライバシーの期待をなくして遵守を引き出す社会統制であり、職場は現代版のパノプティコンになっていると論じた。", "p3": "ソフトウェアのベンダーと雇用者の意図、監視ソフトの機能、運用者（システム管理者）の自己認識、監視が従業員に及ぼす実際の影響を調べた。", "p5": "雇用者は、プライバシーの期待をなくすことで、規則の遵守を引き出そうとしている。パノプティコンは社会統制の形として現代の職場に実装されている（抄録）。定量的な結果は抄録にない。", "fun": "みんなが見られているかもしれないと思うだけで行動を変えるという、18世紀の「円形監獄」の考え方が、いまの会社のパソコンの監視ソフトに生きている、という見立てが面白い。実際に「見られている」と感じる効果と、プライバシーの価値のぶつかり合いを問い直す。", "unverified": "本文を入手できず、調べた対象の数・方法・従業員への影響の実証の中身は未確認。学位論文で査読前。"}}, {"id": "pr42", "rank": 42, "headline": "LLM対の協働は60.5%成功、失敗を6類型に整理", "title": "PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles", "url": "https://arxiv.org/abs/2611.14242", "authors": "Javier Hernandez ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントの協働を、認知心理学にもとづく非対称パズルで測り、失敗を6類型に整理する評価の場（PARLEY）を示した。", "p3": "参照的な伝達・共同の協調・視点取得・空間推論の4つの非対称パズルで、GPT-4o対の会話400件（各課題100件）を集め、データから知覚・適応・協調の3群・6つの失敗類型の分類（PAC）を作った。", "p5": "GPT-4o対の成功率は60.5%で、課題ごとに34〜80%。外部のフィードバックを取り込めないことが失敗の重要な指標で、うまくいかなかった戦略を繰り返し使っていた。分類に基づく介入（N=200）で、平均の課題成功率が70.5%に上がった（抄録）。", "fun": "AIどうしの共同作業は、片方だけが見えている絵を言葉で伝えるような、人間でも難しい課題で試される。失敗の原因は「相手の反応を取り込まない」ことが多く、これは人の会議でもよくある問題なのが面白い。失敗の分類を使うと、成功率を上げられることも示している。", "unverified": "本文を入手できず、6類型の定義の細部・介入の内容・他のモデルでの結果は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "性格を介して文化に合わせた対話を階層的に生成", "title": "HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation", "url": "https://arxiv.org/abs/2611.13207", "authors": "Lingzhi Shen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "対話生成で、性格を介して文化ごとの言語規範に合わせる階層的な枠組み（HiCAP）を示した。", "p3": "性格を条件にする制御で、まず文化的な口調に合わせ、次に個人の性格の属性に沿って言語表現と内容を整える。教師あり微調整と指示ベースの調整に、動的な指示テンプレートとマルチエージェントの実演を組み合わせる。", "p5": "CulturalPersonasとCPEDの実験で、さまざまな対話生成の指標で最も強い総合の性能を示した（抄録）。具体的な数値は抄録にない。", "fun": "同じ「ありがとう」でも、国によって、人の性格によって、言い方が違う。この研究は、まず文化で話し方の大枠を決め、そのあと性格で細かく整える二段構えで、AIの返事を人らしくする点が面白い。", "unverified": "本文を入手できず、指標ごとの数値・基準手法・性格の表現の仕方は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "住民が証拠を点検して政策提案を作る市民向けAI", "title": "EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice", "url": "https://arxiv.org/abs/2611.13525", "authors": "Evan Pa\\v{c}es-Wiles ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "データセンターをめぐる地域の争いで、住民が証拠・欠けている情報・意見の違いを自分で点検しながら政策提案を作る支援システム（EJAI）を示した。", "p3": "対話的な地図・取り出した証拠・欠測の明示・2つの利害関係者のペルソナをつなぐ、根拠に基づくシステムを作り、21問の小さな機能のベンチマークと、模擬の住民集会の準備をする15人の被験者内の研究で評価した。", "p5": "取り出した証拠は事実の主張の98.4%を支え、欠けた証拠は33件中32件で認めた。企業役員のペルソナは、割り当てた優先事項と合わない証拠の一部を省いた。参加者は、引用されたAIの主張を確認する人、条件つきの提案をする人、ペルソナが単純化や偏りだと感じた人に分かれた（抄録）。", "fun": "AIが答えを出してしまうと、人は証拠を見る前に納得してしまう。この研究は、AIに「証拠・足りない情報・意見の割れ」を見せさせ、判断は人に残す設計にした点が面白い。ただし企業役員の役のAIが、都合の悪い証拠を省いたという落とし穴も見つけた。", "unverified": "本文を入手できず、21問の内容・被験者の評価の数値・地図の指標の詳細は未確認。小規模な評価である点に注意。"}}, {"id": "pr45", "rank": 45, "headline": "Reddit 7.7万件の分極をLLMで構成概念に変換", "title": "Quantifying polarization: detection and analysis of opinion groups on the Gaza conflict in English-language Reddit discourse", "url": "https://econpapers.repec.org/RePEc:cte:wsrepe:51001", "authors": "Scielzo Ortiz ほか", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "Redditのガザ紛争の76,816件のコメントから、意見のグループをLLMと頑健なクラスタリングで取り出す方法を示した。", "p3": "18のサブレディットの1年分のコメントから、政治的立場・感情・談話の口調・主題の枠組み・論証の質の5つの談話変数をLLMのゼロショットで抽出し、専門家のコード化で検証した。5つのクラスタリング構成を、ペアごとの分離度指数で比べた。", "p5": "埋め込みを使う構成は修辞の様式と政治的立場を混同して思想の軸を回復できず、分散の90%を残しても同じだった。検証済みの変数に絞るだけでは足りず、k-meansは非対称な分割になるが、頑健な混合データの枠組みは対称な4グループを回復した。親イスラエルと親パレスチナの両陣営が、敵意のない派と敵意のある反応的な派に分かれる（抄録）。", "fun": "「どちらの味方か」だけで人を分けると見えないが、「話し方が穏やかか攻撃的か」という軸も混ぜると、どちらの陣営の中にも2つの顔があることが見える。AIによる言葉の数値化は、使う特徴によって結果がまるで変わる、という注意にもなっている。", "unverified": "本文を入手できず、専門家のコード化との一致度・クラスタの大きさ・指数の値は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "ペルソナの逸脱と修正を閉じた世界の多エージェントで調べる", "title": "Project Nightcord Sanctuary: A Closed-World Multi-Agent Framework for Studying Persona Drift and Correction in LLM Roleplay Agents", "url": "https://doi.org/10.5281/zenodo.24138238", "authors": "胡, 宸歌", "venue": "Zenodo", "date": "2026-11-11", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を読んだ。本文は入手できなかった。審査のない置き場の記録", "preprint": true, "short": true, "p1": "LLMの役割演技で、役柄からの逸脱への自然な耐性と、診断を受けたときの修正への従順さを、別々に測る枠組み（PNS）を示した。", "p3": "知識と共有世界の事実を制限した閉じた世界に、対になる2人の架空の人物を置いた多エージェントの自己対戦で、毎ターンを、声のレベルの手がかりと内容の固有性の手がかりの2層で、ルーターが採点する。", "p5": "3回の修正の事例では、初稿は明らかに役柄から外れ、修正後は構造的には改善したが躊躇があり5/10、言語密度の制約を明示すると8/10になった。知識境界の漏えいの試験（KL-001）では、見ていないはずの私的な事実が、PNSの文脈では20回中0回、全文を渡す文脈では6回、共有記憶つきでは20回中20回漏れた（抄録）。", "fun": "AIに役を演じさせると、だんだん素の「親切なアシスタント」の口調に戻ってしまう。この研究は、「自然に崩れにくいか」と「指摘されたら直せるか」を別の力として測る発想が面白い。見ていないはずの秘密をうっかり話さないかを、20回ずつ試す小さな実験もある。", "unverified": "本文を入手できず、採点の基準・使ったモデルは未確認。Zenodo上の未査読の記録で、評価は限られる。"}}, {"id": "pr47", "rank": 47, "headline": "仕訳テストを5体のAIエージェントの監査チームで行う", "title": "The Agentic Audit Firm: Reconfiguring the Assurance Value Chain", "url": "https://doi.org/10.2139/ssrn.7682593", "authors": "Marco Schreye ほか", "venue": "SSRN", "date": "2026-11-11", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "監査法人の仕事を、専門のAIエージェントの「デジタル労働力」で組み直す構想（Agentic Audit Firm）を、5体のエージェントの試作で示した。", "p3": "ポーターの価値連鎖の視点と専門のAIエージェント群を組み合わせ、実際の会計記録で、取引の分析から見直しと報告までの仕訳テストを行う試作を作った。準備のしかたと見直しの方針が異なる4つの監査チームを、専門性・独立性・証拠・方法論・調整・見直しの位置の6つの観点で比べた。", "p5": "初期の所見では、同じモデルの割り当てでも、紛らわしい仕訳の説明があるときにリスクの評価を保つ力と、多くの仕訳を指摘した手続きを追う頻度に、チームの差が出た（抄録）。", "fun": "人間の監査チームのように、役割分担や見直しの回数を変えた「AIの監査チーム」を作って比べるという発想が面白い。同じAIを使っても、チームの組み方で、だまされやすさや追求の粘り強さが変わるという初期の結果が出ている。", "unverified": "本文を入手できず、使ったモデル・仕訳データの規模・各チームの数値は未確認。初期の所見で、査読前。"}}, {"id": "pr48", "rank": 48, "headline": "AIの仕事を監査できるようにするプロセスのコード化", "title": "Made by AI: Process as Code and the Auditability of Human-AI Work", "url": "https://doi.org/10.2139/ssrn.7683979", "authors": "Ivo Oskar Titscher", "venue": "SSRN", "date": "2026-11-10", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AIが関わる仕事を、人の判断の記録・規則の版管理・ログで監査できる形にする設計「プロセスのコード化」を提案した。", "p3": "手順をマニュアルで説明するのでなく、人とエージェントが使う道具の中に組み込む。拘束力のある規則を、適用される手順の箇所で理由とともに書いて版管理し、人の判断は署名して記録し、確認はログを残す。法令から指示までのつながりを規則台帳として示す。", "p5": "数値の実証はなく、論考。主張は、AI支援の仕事は監査可能にできるということで、優れているかどうかは今後の測定に残される。承認が増えて誰も読まなくなる「監査の芝居」を、自動化された統治の失敗の型とした（抄録）。", "fun": "AIを使うと「誰が何を根拠に決めたのか」が見えなくなるのが心配の種。この論文は、書類を増やすのではなく、仕事の道具そのものに規則と理由を埋め込んで、あとから見せられるようにする案を出す。承認だけが増えて誰も読まない「監査の芝居」という言葉が印象的。", "unverified": "本文を入手できず、規則台帳の具体例と、提示された検証可能な命題の中身は未確認。概念的な論考で、実証はない。"}}, {"id": "pr49", "rank": 49, "headline": "合成表データで再構成と公平性を分離する拡散モデル", "title": "Decoupling Reconstruction and Fairness in Synthetic Clinical Tabular Data: Development and Multi-Cohort Evaluation of a Vector-Quantized Diffusion Framework (Preprint)", "url": "https://doi.org/10.2196/preprints.116471", "authors": "Nitish Nagesh ほか", "venue": "JMIR Preprints", "date": "2026-11-11", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "合成の表データで、再構成と公平性を学習時に混ぜず、標本を取る時点で公平性を作る2段階の生成器（FairVQD）を示した。", "p3": "再構成だけで学習するベクトル量子化オートエンコーダ（第1段階）と、EDMの形式で分類器なしの誘導をつけた入力空間の拡散による仕上げ（第2段階）を組み合わせ、保護属性を標本時に一様なベルヌーイ分布から引いて、合成データの周辺分布を厳密に均衡させる。3つの患者コホートで、Gaussian Copula・CTGAN・TVAEと比べた。", "p5": "3コホートで、等化オッズ比の平均0.90と人口統計学的パリティ比の平均0.81が全手法で最高。最強の公平性なしの基準CTGANに比べ、等化オッズ比は0.90対0.65。下流のTSTR-AUCは平均0.65で、CTGAN（0.69）より4ポイント、TVAE（0.74）より9ポイント低い。第2段階を外すと公平性の比がほぼゼロ（0.06、0.05）に崩れた（抄録）。", "fun": "公平なデータを作ろうとして学習の途中に公平性の罰則を入れると、データを似せる目的と取り合いになる。この研究は、標本を取る最後の段階で保護属性を半々に引くだけで公平性を作る発想が面白い。代わりに、予測に使ったときの精度が少し落ちる代償も、きちんと報告している。", "unverified": "本文を入手できず、3コホートの規模・信頼区間は未確認。医療データでの評価で、査読前。"}}, {"id": "pr50", "rank": 50, "headline": "資産価格づけでのLLM活用の文献整理", "title": "Large Language Models in Asset Pricing: A Literature Review", "url": "https://doi.org/10.2139/ssrn.7683739", "authors": "Mohammad Gheidi", "venue": "SSRN", "date": "2026-11-10", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（Crossrefに登録）を読んだ。本文は入手できなかった", "preprint": true, "short": true, "p1": "資産価格づけでのLLMの使われ方を、ニュースや決算説明会などのテキストを数量の信号に変える応用を中心に整理した文献の総説。", "p3": "テキスト分析の歴史と、資産価格づけでのAI・機械学習の発展の中にLLMを位置づけ、ニュースにもとづく収益の予測、決算説明・開示、企業の方針、ESG・気候リスク、ファンドマネージャーの信念、債券、オプション、為替、LLMエージェントの応用を順に見る。", "p5": "限界として、先読みバイアス・訓練データの漏えい・プロンプトへの敏感さ・モデルの不安定さ・解釈可能性の低さ・取引費用・現実的な標本外の評価の必要を論じ、研究の空白と今後の方向を示す（抄録）。", "fun": "「ニュースを読んだAIが株価の動きを当てる」という発想は魅力的だが、AIが過去の答えを覚えていて「未来を知っている」ように見えてしまう先読みバイアスが大きな落とし穴になる。便利さと信頼性の間の注意点を、応用の種類ごとに整理しているのが面白い。", "unverified": "本文を入手できず、総説が扱う論文の件数・個々の研究の数値は未確認。査読前。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "交差検証の分散を厳密な恒等式で分解", "title": "A Theory of Cross-Validation Variance", "url": "https://arxiv.org/abs/2611.14463", "authors": "Nathaniel S. O'Connell ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "交差検証の推定値の分散を、各観測が評価側と学習側で持つ重みの関数として表す有限標本の厳密な恒等式を証明した。平均二乗誤差やAUCなどの指標に使え、分散を分解して、分割の設計の指針を与える。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "潜在因子つきパネルでダブル機械学習を成り立たせる", "title": "Semiparametric Inference in Panel Data with Interactive and High-dimensional Confounding", "url": "https://arxiv.org/abs/2611.14385", "authors": "Bin Chen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "高次元の共変量と潜在的な交互作用の交絡があるパネルでは通常のダブル機械学習が崩れることを示し、処置側と誘導形の因子空間を推定する因子拡張DML（FA-DML）を提案した。二重射影と単位ごとの3分割のクロスフィッティングで推定誤差の影響を抑える。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "集計処置の動学効果の偏りを操作変数で除く", "title": "Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV", "url": "https://arxiv.org/abs/2611.14434", "authors": "Endong Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "集計的な処置への曝露と交絡への曝露が相関すると、横断面の設計は動学的な部分均衡効果にバイアスを持つことを解析的に示した。交絡の経路を固定して比べるHELP-IV（異質曝露の局所射影・操作変数）が部分均衡効果を識別できると証明し、州の財政乗数などに適用した。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "LLMの順位づけで人手評価とLLM審判を併用して推論", "title": "Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback", "url": "https://arxiv.org/abs/2611.13186", "authors": "Gabriel Sargent ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "人手の評価が高価なため適応的に集める状況で、LLM審判の予測と人手を組み合わせるPP-Rankを提案した。審判のバイアスと適応的な依存があっても妥当な推論ができ、漸近正規性と同時信頼区間を示す。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "表形式基盤モデルで因果媒介分析の信頼区間を作る", "title": "MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis", "url": "https://arxiv.org/abs/2611.13219", "authors": "Shi Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "事前学習済みの表形式基盤モデルを副次関数の予測に使い、クロスフィットした影響関数推定量と、シミュレーションで学習した誤差分位点の別ヘッドで信頼区間を作るMediPFNを提案した。複数の副次関数の推定の不確実性を償却的に扱う。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "処置クラスターの操作変数は何を識別するか", "title": "Instrumental variables with treatment clusters", "url": "https://arxiv.org/abs/2611.13313", "authors": "Didier Nibbering ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "複数の順序なしの処置をクラスターにまとめて操作変数法を使うと、元の処置のレベルの仮定のもとで局所平均処置効果の加重平均が識別されることを示した。元の処置選択のデータがあれば因果解釈の必要条件を検定でき、専攻分野（STEMと非STEM）の効果で例示する。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "波及があっても予測ベースの反事実で効果を識別", "title": "Causal Inference under Interference with Forecast-Based Counterfactuals", "url": "https://doi.org/10.2139/ssrn.7682605", "authors": "Viviana Celli ほか", "venue": "SSRN", "date": "2026-11-11", "why": "処置の波及があり汚染されていない対照がない場合に、予測にもとづく反事実の方法が平均処置効果と波及効果を識別・推定できる条件を、潜在結果の枠組みで初めて形式的に分析した。シミュレーションと実証で、対照ベースの方法との長所と限界を比べる。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "部分的な因果構造でも最小介入集合を求める", "title": "Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals", "url": "https://arxiv.org/abs/2611.14066", "authors": "Min Woo Park ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "構造的因果バンディットを、因果構造が部分的にしか分からない場合・他環境の情報・実現可能な反事実的行動へ拡張した。マルコフ同値のもとでの最小介入集合の図的な基準と探索アルゴリズム、部分的な移送可能性による報酬の上下界、後悔の保証を示す。"}, {"id": "pn09", "rank": 9, "field": "経営学", "headline": "2つの差の差分析が同じ企業の同時調整かを診断", "title": "From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research", "url": "https://doi.org/10.2139/ssrn.7682778", "authors": "Josh Feng ほか", "venue": "SSRN", "date": "2026-11-11", "why": "環境の変化に企業が複数の選択を一緒に調整するかは、2つの差の差分析の平均効果だけでは分からない。独立な反応・意思決定の依存・共通の企業要因が同じ効果の組を生むことを示し、超過同時反応（EJR）の統計量を提案して4つの事例で適用した。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "若年失業者への集中的な就職支援で就業確率が約10%上昇", "title": "Active Labor Market Policy for Unemployed Youths", "url": "https://doi.org/10.2139/ssrn.7690604", "authors": "Jeremy Hervelin ほか", "venue": "SSRN", "date": "2026-11-11", "why": "フランスの大規模プログラムPACEAを、担当者へのほぼランダムな割当と担当者ごとの参加させやすさを使う操作変数法で評価した。完了後の就業確率が約10%上がるが、効果は就業の有無の面に限られ、賃金・契約の安定・職業の向上は伴わない。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "2025年の関税は売上と売上原価を3四半期で約1.2%減らした", "title": "Trade Wars on the Income Statement: The Effects of Tariffs on Firms", "url": "https://doi.org/10.2139/ssrn.7683087", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-11-11", "why": "2018年と2025年の米国の関税への企業の曝露を、自社の輸入・仕入先の輸入・外国の報復で作り、四半期の財務諸表で効果を推定した。2025年は直接の輸入企業で売上と売上原価が3四半期内に約1.2%、仕入先経由で約0.5%減り、価格への一部転嫁と生産の縮小が見られ、報復は粗利益率を圧縮した。2018年の効果は小さい。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "有限予算ではスケーリング則が対数の直線からずれる", "title": "Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws", "url": "https://arxiv.org/abs/2611.13534", "authors": "Tianyu Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "従来のスケーリング則は誤差を容量とデータ量の分離したべき乗則で表すが、有限予算では学習曲線と計算最適な配分がその直線から外れる。スペクトルとドメインの不均質性が外れを決めることを、Mellin–Barnes解析と水充填で理論的に示し、Aitken差分で損失の下限を除く初期化法を与える。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "文脈内学習に特徴学習は要らない", "title": "You Don't Need Feature Learning to Do In-Context Learning", "url": "https://arxiv.org/abs/2611.13431", "authors": "Joseph Turnbull ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "回転不変なカーネル機械で文脈内学習の線形回帰課題を調べ、サンプル数が増えると記憶する解の高次の成分を順に学ぶことを固有基底で示した。汎化する解は記憶解の低次の切り捨てで、学習はまず汎化し、のちに記憶へ劣化する。"}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "事前学習・SFT・RLの計算配分を解析モデルで考える", "title": "An Analytical Model of Compute-limited Multistage Training Pipelines", "url": "https://arxiv.org/abs/2611.13276", "authors": "Nishil Patel ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "線形オートエンコーダの事前学習、ノイズのある段階ラベルのSFT、まばらな報酬のRLを一つの高次元モデルにして、ランダム行列理論で学習の動力学を近似した。有限の事前学習データが表現に依存する性能の上限を課すことなどを示し、段階間の計算配分を考える土台を与える。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "選択後の推論の計算を擬似周辺MCMCで高速化", "title": "Pseudo-marginal Sampling for Selective Inference", "url": "https://arxiv.org/abs/2611.13492", "authors": "Jiali He ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "適応的な選択のあとの推論は選択事象で条件づけるが、複雑な手順では分布が扱えず、棄却サンプリングは事象がまれだと高価になる。擬似周辺MCMCでこの条件つき分布を標本化し、弱ポアンカレ不等式で効率を解析して、古典的なファイル引き出し問題で両方法の計算量を導いた。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "AIの読み手が割れても金額の合計を推定する", "title": "Counting Under Disagreement: Dollar-Weighted Measurement, Selective Machine Labelling and Budgeted Human Review from Disagreeing AI Readers of Administrative Text", "url": "https://arxiv.org/abs/2611.13215", "authors": "George Koomullil (Ascendr ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "1つの文面ラベルが多数の行政記録に当たり、目標が金額の合計で、人の読みも割れる設定を扱った。米国の税申告の助成目的の文面12万1,070件（79万9,675件・1,264億ドル）を規則分類器と3つの言語モデルでラベル付けし、651件を3人が読んで基準とした。固定予測器と交差適合の予測器の差推定量の条件を示し、8つの予測器の合計が補正後0.4億ドル以内で一致した。"}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "行列・テンソルのデータで構造的自己回帰を識別", "title": "Identification, estimation, and robust inference of structural autoregressions for multidimensional data", "url": "https://arxiv.org/abs/2611.13169", "authors": "Bernhard van der Sluis", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "国別パネルのような行列・テンソル構造のデータで、係数にクロネッカー構造を仮定して構造的自己回帰の大域的な識別と扱いやすさを確保した。最小距離推定量の漸近分布と、近似的な分離可能性の誤りに頑健な構造的インパルス応答の信頼区間を示す。"}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "プライバシーを守った対比較から順位を推論", "title": "Differentially Private Statistical Inference for Rankings from Pairwise Comparisons", "url": "https://arxiv.org/abs/2611.13485", "authors": "Xintao Xia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "LLMの順位づけに使う人の対比較の記録を守るため、Bradley–Terryモデルでエッジ差分プライバシーのもとでの得点と順位の推論を開発した。目的摂動推定量の有限標本の誤差界と、漸近的に妥当な信頼区間を導く。"}, {"id": "pn19", "rank": 19, "field": "因果推論", "headline": "媒介確率の比による重みづけで直接・間接効果を推定", "title": "Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance", "url": "https://arxiv.org/abs/2611.13206", "authors": "Ariel Linden", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "結果モデルを立てずに媒介変数の分布を処置条件間で再重みづけして自然な直接効果と間接効果を推定するRMPWの既存の方法を、共通の枠組みにまとめた。連続媒介変数の異分散正規モデルを加え、複数の重み成分への2段階の分散推定を拡張し、全国健康調査と福祉就労の無作為化実験で例示する。"}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "SGDの尾部平均の誤差界の隙間を埋める", "title": "Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression", "url": "https://arxiv.org/abs/2611.13383", "authors": "Qingyue Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "高次元線形回帰で一定ステップ幅のオンライン確率的勾配降下法を尾部平均したときの過剰リスクに、初期化を明示した一致する上界と下界を示した。従来の上界は初期誤差の寄与を減衰させず、下界は初期化由来の分散を落としており、両方がゆるいことを示す。"}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "ガウスカーネルの長さスケール推定の理論", "title": "Lengthscale Estimation for the Gaussian Kernel and Deterministic Response Functions", "url": "https://arxiv.org/abs/2611.13930", "authors": "Subhendu Pramanick ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "無限回微分可能なガウスカーネルの長さスケールの最尤推定量と交差検証推定量を、観測が固定の応答関数から出る固定領域漸近で調べ、この設定で初めて理論的な結果を示した。応答関数の正則性（フーリエ変換の減衰）に依存する下界を証明した。"}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "ガウス過程のハイパーパラメータの変化で変化点を検出", "title": "Time Series Change Point Detection with Gaussian Processes", "url": "https://arxiv.org/abs/2611.13295", "authors": "Olga Isupova ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "時系列の変化をガウス過程の事前分布のハイパーパラメータの変化と定義し、統計的仮説検定として定式化した。変化の前後の関数形を詳しく指定せずにオフラインとオンラインで複数の変化点を検出でき、理論的な保証と合成・実データでの評価を示す。"}, {"id": "pn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "AI利用は同僚の評価と行動をどう変えるか（総説）", "title": "Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another", "url": "https://doi.org/10.31234/osf.io/ehbjv_v2", "authors": "Maxine Parker ほか", "venue": "PsyArXiv", "date": "2026-11-10", "why": "個人のAI利用が他者からの見られ方と行動をどう変えるかを、帰属理論や社会的交換理論などで説明した総説。観察者はAI利用を能力・意欲・温かさ・本物らしさの低さとみなし、開示しても信頼は回復せず、同僚の返報・知識共有・向社会的行動が減る一方、条件しだいで孤立を減らし調整を改善するとまとめる。未査読のプレプリント。"}, {"id": "pn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "公式リーダーとピアリーダーの役割の分類を作る", "title": "Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles.", "url": "https://doi.org/10.31234/osf.io/5b9sy", "authors": "Charlotte Marie Edelmann ほか", "venue": "PsyArXiv", "date": "2026-11-10", "why": "公式リーダーとピア（非公式）リーダーの行動を階層をまたいで捉える実証的な分類がないという課題に対し、文献統合と従業員35人への質的インタビューから、リーダーシップ機能の分類を帰納的に作った。未査読のプレプリント。"}, {"id": "pn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "チーム固有の技能への動学的投資を理論と実験で調べる", "title": "Dynamic investment and coordination in teams: Theory and experimental evidence", "url": "https://arxiv.org/abs/2611.13230", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "チーム固有の技能への投資は持続的な利益を生むが、調整の成否に左右される危険な投資である。動学ゲームの理論枠組みを作り、実験室で投資に影響する要因を調べた。"}, {"id": "pn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "ソフトウェア組織の11チームでAI利用は偏る", "title": "Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization", "url": "https://arxiv.org/abs/2611.14154", "authors": "Daniele Veri'", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "ソフトウェア組織の11チーム98件の構造化インタビューの記録で、標準化した質問で測った65人のうち55.4%がAI利用の頻度を4か5と答え、チーム別では20.0%から71.4%と差が大きかった。組織のAI方針の認識が限られる点も見られた。単一事例の記述的研究。"}, {"id": "pn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "裁判所長の交代で倒産手続の長期化が鈍る", "title": "Judicial Performance, Bank Lending and Firms' Investments: Evidence from Court Leadership Turnover", "url": "https://doi.org/10.2139/ssrn.7683845", "authors": "Davide Moretti ほか", "venue": "SSRN", "date": "2026-11-10", "why": "イタリアの裁判所長の任命の外生的な変動を使い、交代が倒産手続の期間の伸びを遅くすることを示した。効果は新任が若い・管理経験がある・地元出身のとき大きい。司法の効率化で債権者の権利が強まり、銀行貸出が増え延滞が減り、大企業は無形資産へ投資を移す。"}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "関税の発表は事前の信念に応じて期待インフレを上げる", "title": "Tariff News and Household Inflation Expectations: The Role of Prior Beliefs", "url": "https://doi.org/10.2139/ssrn.7683852", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-10", "why": "2018〜2025年の米国の7つの関税の局面で、検索関心のピークの前後の個人内の1年先の期待インフレの改訂を、ニューヨーク連銀の消費者期待調査の面接日で比べた。2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の復活で1.72ポイント有意に上がった。"}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "評価の公表が後の戦略的コミュニケーションを損なう", "title": "Feedback Design in the Shadow of Strategic Communication", "url": "https://arxiv.org/abs/2611.13450", "authors": "Daiki Kishishita ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "企業が従業員の潜在力の評価を公表したあと、従業員が個別の事情を上司に伝える組織で、最適なフィードバックを特徴づけた。情報量の多い評価は意思決定を助けるが、選好の対立を強めて後の伝達の信頼性を損ねうる。全面開示は、すべての事前信念で最適かすべてで最適でないかのどちらかになる。"}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "貧しい人が借りられないとき資本規制はなぜ弱いか", "title": "Macroprudential Policy When the Poor Cannot Borrow", "url": "https://doi.org/10.2139/ssrn.7682498", "authors": "Fernando Arce ほか", "venue": "SSRN", "date": "2026-11-11", "why": "不平等の大きい新興国で資本規制が少ない傾向を、実質為替レートを通じた分配の外部性で説明した。非ホモセティックな選好・担保制約に直面する高所得の借り手・手元の資金で暮らす低所得世帯の小国開放経済モデルで、最適な借入税をフィッシャー的な項と分配的な項に分解する。"}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "長く知られた地震リスクが顕在化すると売却価格が下がり賃料が上がる", "title": "Environmental Risk Salience and Real Estate Markets", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13073", "authors": "Marco Letta ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "既知の環境リスクが破壊を伴わずに顕著になった場合の市場の反応を、イタリアの地震活動の再燃を自然実験として調べた。最も曝露した持ち家市場では売却価格が下がり、賃料は上がって、世帯は保有形態と空間で調整した。"}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "フィギュアの審判は自国選手に加点しライバルに減点する", "title": "Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging", "url": "https://arxiv.org/abs/2611.13194", "authors": "Jialin Liu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "専門家の審査員の自国びいきを嗜好や情報の差と区別するため、フィギュアスケートの詳細なデータを使った。自国選手への戦略的な加点と、その近いライバルへの狙った減点を見いだし、加点は無作為な滑走順に沿って下がる。反実仮想の分析で、接戦の結果を左右しうると示す。"}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "認知能力と自信過剰が課題の複雑さの選択を決める", "title": "Choosing Complexity: Cognitive Ability, Overconfidence, and Task Choice", "url": "https://arxiv.org/abs/2611.13259", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "成功報酬の取引条件の違う複雑な課題の選択を、理論と実験で調べた。認知能力の高い人は複雑な課題を選び、能力を一定にしても自信過剰な人は複雑な課題を選ぶ。約75%の判断で利得を最大にする課題を選んだ。"}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "不完全なデータで自治体別の多次元貧困を区間で推定", "title": "Estimating multidimensional poverty under incomplete data in North Macedonia", "url": "https://arxiv.org/abs/2611.14146", "authors": "Maja Gerovska Mitev ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "多次元貧困指数は国・地域より細かい水準では得にくい。センサスと地理空間データの世帯レベルの結合ができない状況で、独立性にもとづく点推定と、データと整合するすべての同時分布にわたる鋭い上下界を組み合わせて、北マケドニアの地域の貧困を推定する方法を示した。"}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "特許の保護が弱まると決算説明会の開示が増える", "title": "Patent Protection and Disclosure", "url": "https://doi.org/10.2139/ssrn.7690238", "authors": "Nemit Shroff ほか", "venue": "SSRN", "date": "2026-11-11", "why": "特許保護の弱まりが担保価値を下げ無担保債務への依存を高めて、債権者が将来のキャッシュフローの情報を重視するため開示が増えるという仮説を、2014年の米国最高裁のAlice判決を使って検証した。Alice判決の影響を受けた企業ほど決算説明会で情報を多く出した。"}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "ブラウザ選択画面でSafariからChromeへ移る", "title": "The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones", "url": "https://doi.org/10.2139/ssrn.7682467", "authors": "Leon Knoke ほか", "venue": "SSRN", "date": "2026-11-11", "why": "EUのデジタル市場法で2024年に導入された、既定のブラウザを選ばせる画面の効果を、EUと非EUの国でブラウザと検索の市場シェアの前後比較で調べた。SafariからGoogle Chromeへ大きなシェア移動があり、他のブラウザの絶対的な増加は小さい。"}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "レストランのカロリー表示は食料品の購買に及ぶか", "title": "Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases", "url": "https://doi.org/10.2139/ssrn.7682397", "authors": "Ali Umut Guler", "venue": "SSRN", "date": "2026-11-11", "why": "6つの地域の義務化とNielsenIQ Homescanのデータを使った積み上げ型の差の差分析と、593人の無作為化実験を組み合わせて、レストランのカロリー表示が世帯の食料品の購入に及ぶかを調べた。"}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "LLMの集約サービスは補完でもあり競合でもある", "title": "LLM Competition and the Aggregator Economy", "url": "https://doi.org/10.2139/ssrn.7683780", "authors": "Fupeng Sun ほか", "venue": "SSRN", "date": "2026-11-10", "why": "PoeやChatHubのように競合するLLMをまとめて売る集約サービスは、提供者にとって卸売のAPI収益を生む補完であると同時に、直販の購読を食う競合でもある。2つの提供者と選好の異なる利用者のゲーム理論モデルで、この二面性を分析した。"}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "トランスフォーマーが構文の内外計算を段階的に獲得する", "title": "Stagewise and interpretable emergence of inside-outside computation in Transformer-based language models", "url": "https://arxiv.org/abs/2611.14221", "authors": "Jack T. Parley", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "文脈自由文法の合成データで、トランスフォーマーが構文解析の内外アルゴリズムを学ぶ過程の学習動力学を調べ、損失の各段階が解釈可能に計算できることを示した。学習済みモデルが解析アルゴリズムを近似するという従来の事後的な研究に対し、獲得の過程を理論的に扱う第一歩となる。"}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "LLMの記号的な機構はどんな要因で現れるか", "title": "What drives the emergence of symbolic mechanisms in large language models?", "url": "https://arxiv.org/abs/2611.13270", "authors": "Melody Zixuan Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "抽象的な系列課題でニューラルネットをゼロから訓練し、アーキテクチャとデータ分布の要因を変えて記号的な機構の出現を調べた。表現・注意・因果媒介の分析で、トランスフォーマーが記号的な機構を獲得することを確認し、その要因を探る。"}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "概念による説明の因果効果を訓練の目的にする", "title": "Causal Concept Explanations for Deep Neural Models", "url": "https://arxiv.org/abs/2611.14407", "authors": "Josh Rountree ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "概念にもとづく説明は相関的で、出力に必要でも十分でもないのに正しく見えて誤解を招きうる。経済学や疫学の介入媒介分析を訓練目的に使い、概念の説明の因果効果をそろえるCCW-Netを提案した。"}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "実演から別の世界へ文脈内学習でロボット操作を移す", "title": "World In-Context Learning for Agentic Robot Manipulation", "url": "https://arxiv.org/abs/2611.12885", "authors": "Heng Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "why": "文脈内学習は、別の場面で記録した実演に現在の世界からのフィードバックがないため、訓練した方策に及ばなかった。文脈内で学ぶのは見た目でなくタスクの手順と物体の役割という意味であることに着目し、固定したモデルが実演から始めて現在の世界で学び直すWICLを提案した（Hugging Faceの票52）。"}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "エージェントの記憶は根拠をたどれてこそ役立つ", "title": "Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents", "url": "https://arxiv.org/abs/2611.14320", "authors": "Yukyeong Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "why": "外部記憶は過去の軌跡から作る教訓でエージェントを助けるが、元の軌跡と切り離されると、誤った教訓や誤用で、記憶なしなら解ける課題で失敗する。教訓を根拠の軌跡にひも付けて確かめられるWikiTraceを提案し、記憶による劣化を減らす（Hugging Faceの票41）。"}, {"id": "pn44", "rank": 44, "field": "計算社会科学・ネットワーク科学", "headline": "情報の発信源を早期にベイズ推論で特定", "title": "EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks", "url": "https://arxiv.org/abs/2611.13919", "authors": "Tao Wen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "情報の氾濫の中で発信源をすばやく特定するため、進化計算でまばらな観測者を配置し、信頼性の異なる観測を一般化ベイズ推論で集約するEAGLEを提案した。人の観測者への依存を限り、観測の信頼度の違いを明示的に組み込む。"}, {"id": "pn45", "rank": 45, "field": "計算社会科学・ネットワーク科学", "headline": "二段階の伝染は人口の入れ替わりで振動する", "title": "Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity", "url": "https://arxiv.org/abs/2611.12920", "authors": "Francisco J. Mu\\~noz ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "意見や技術の採用のように2回接触して初めて採用する二段階の伝染で、人口の入れ替わりがあると採用と放棄の波が生じる。平均場では超臨界のホップ分岐で振動が生まれ、1回目の接触の採用確率が低い、二段階が中心の伝染が必要になる。"}, {"id": "pn46", "rank": 46, "field": "計算社会科学・ネットワーク科学", "headline": "AIは研究助手として中国と米国のどちらかに偏るか", "title": "Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US", "url": "https://arxiv.org/abs/2611.14288", "authors": "Yuan Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "LLMが社会科学の研究助手として使われるとき、開発国の国々や学術の伝統に偏るかを、中国と米国に関する研究の質問で監査した。正解のない問いが多いため、国やそれに結びつく社会理論を有利に扱うかを調べる。"}, {"id": "pn47", "rank": 47, "field": "計算社会科学・ネットワーク科学", "headline": "判断の確信度の表示が情報源の選び方を変える", "title": "Displayed judgment certainty reorganizes source selection in self-formed networks", "url": "https://doi.org/10.31234/osf.io/fja3d_v5", "authors": "Gaël Carniel ほか", "venue": "PsyArXiv", "date": "2026-11-10", "why": "オンライン実験8セッションの273人が14の真偽のニュース見出しを評価し、費用をかけて観測ネットワークを作り、5回信念を更新した。判断の確信度（私的な確率判断の極端さ）の見え方を操作し、情報源の選択と後の正確さへの影響を調べた。"}, {"id": "pn48", "rank": 48, "field": "計算社会科学・ネットワーク科学", "headline": "集計データから都市の移動を微視的に再現", "title": "Spatial patterns of transportation choice in Niter\\'oi", "url": "https://arxiv.org/abs/2611.14499", "authors": "Sandro Martinelli Reia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "安価な集計の静的な都市データから、微視的で動的な空間的に詳しい都市移動を作る枠組みを示した。合成人口・建造環境・交通網で日々のトリップを作り、徒歩・車・公共交通を割り当て、ブラジルのニテロイ約47.5万人の合成住民に適用した。"}, {"id": "pn49", "rank": 49, "field": "計算社会科学・ネットワーク科学", "headline": "携帯・路側・GPSの各データが交通シミュレーションに足す価値", "title": "Data-driven regional traffic simulation from heterogeneous mobility sources", "url": "https://arxiv.org/abs/2611.13947", "authors": "Federico Bellisardi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "携帯電話データがトリップとその時刻を、路側センサーの半数が交通量の水準を、全センサーが局所の補正を、GPS軌跡が経路選択を決める、エミリア＝ロマーニャ州の日々の交通のエージェント・ベース・シミュレータを作り、各データの寄与を測った。評価は完全に独立ではない。"}, {"id": "pn50", "rank": 50, "field": "人口学", "headline": "国の富を人口と国土から測り直す", "title": "The Wealth of Nations According to Adam Population, Territory, and Welfare", "url": "https://doi.org/10.2139/ssrn.7685298", "authors": "Juan Carlos Cordoba", "venue": "SSRN", "date": "2026-11-11", "why": "アダム・スミスの区別（一人当たりの繁栄と国の富）を、Barro–Becker型の王朝的選好で測る。国の富は統計的生命の価値に単位土地あたりの有効な生命の数を掛けたもので、87か国で米国は富で19位だが福祉で48位、中国の富は米国の45%（一人当たりでは14%）。1500年以降の世界の富は約173倍に増えた。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "エッジ上でセンサ故障の診断と説明の一致を評価", "title": "Edge-based explainable multisensor fault diagnosis for structural health monitoring", "url": "https://doi.org/10.1177/14759217261504351", "authors": "Heba Al-Nasser ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "複数橋の亀裂幅データを共通尺度にそろえて損傷を評価", "title": "A Data‐Driven Framework for Assessing Damage Development in Coupling Joints of Prestressed Concrete Bridges", "url": "https://doi.org/10.1155/stc/3195765", "authors": "Yasser Alqasem ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-11", "citescore": 10.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "データが少ないときのベイズ更新の4つの戦略を総説", "title": "Bayesian Updating for Safety-Critical Structures under Limited Data", "url": "https://doi.org/10.1061/ajrua6.rueng-2074", "authors": "Xin Gu ほか", "venue": "ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems Part A Civil Engineering", "date": "2026-11-10", "citescore": 4.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr04", "rank": 4, "headline" en dan Bisnis", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "脆弱な保険会社の破綻が住宅ローンの延滞を増やす", "title": "When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets", "url": "https://doi.org/10.1093/qje/qjag053", "authors": "Parinitha Sastry ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-07", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "気候リスクの住宅ローンと損害保険での過小評価が、納税者の大きな負担と危険地域への過剰な信用供給を生むことを、複数の自然実験で示した。政府支援企業（GSE）の保険会社の評価方針が過小評価の主因で、フロリダ州の新規データで、資本不足の保険会社の破綻が災害後の住宅ローンの延滞を因果的に増やす。GSEの期待損失の約25%が保険の脆弱性による。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "誤った信念が直らないのは注意の向け方による", "title": "Channeled Attention and Stable Errors", "url": "https://doi.org/10.1093/qje/qjag055", "authors": "Tristan Gagnon-Bartsch ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-09", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "データが豊富で学習の機会が繰り返しあっても人が誤った信念を保つ理由を、誤っているかもしれない自分のモデルを通して注意を向けるという枠組みで説明した。変数が効かない・区別がないと誤って排除するモデルは、反証となるデータから注意をそらすため安定しやすい。どの誤りが見つかるかは意思決定の構造に依存し、害の大きさとは緊密に結びつかない。"}, {"id": "jn03", "rank": 3, "field": "因果推論", "headline": "エボラの恐怖で黒人申請者の住宅ローン拒否率が3.8ポイント上昇", "title": "Deadly Disease, Fear, and Ostracism in the Credit Market", "url": "https://doi.org/10.1287/mnsc.2025.01919", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "2014年の米国のエボラ流行を自然実験として、恐怖が住宅ローンの与信を歪めるかを調べた。感染リスクはほぼないのに、流行中の黒人申請者の拒否率が3.8ポイント上がった。承認された黒人の借り手は信用状態が良く延滞が少ないが、延滞時の条件変更を受けにくい。FinTechのアルゴリズム融資ではこの影響がなく、流行後に素早く戻り、統計的差別とは合わない。"}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "リスクと信念の個人差を同時に測り意思決定を推定", "title": "Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty", "url": "https://doi.org/10.1287/mnsc.2024.06232", "authors": "Adeline Delavande ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "一般の人を対象に、リスクとあいまいさへの態度（個人別の確率加重と損失回避）と、意思決定に関わる事象の主観的確率を集める調査実験を行った。態度も信念も非常に異質で、プロスペクト理論に情報源依存の確率加重を組み合わせたモデルが、主観的期待効用より当てはまりが良い、または同等だった。信念が極端な値に集中するときに特によく当てはまる。"}, {"id": "jn05", "rank": 5, "field": "計算社会科学・ネットワーク科学", "headline": "150年のドイツ議会の移民討論をLLMで注釈し反連帯の増加を示す", "title": "LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade", "url": "https://doi.org/10.1162/coli.a.666", "authors": "Aida Kostikova ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "why": "ドイツの議会討論（1867〜2025年）の移民への連帯・反連帯を、理論に基づく注釈の枠組みでLLMに注釈させ、人間どうしの一致度に匹敵するマクロF1を得た。系統的な誤りが下流の結果を偏らせるため、ソフトラベルと設計ベースの教師あり学習（DSL）を組み合わせて長期の傾向の偏りを減らした。戦後の連帯の高さと、2015年以降の反連帯の顕著な増加を見いだした。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "プライバシー保護の下でのレコメンダ設計", "title": "Recommender Systems Under Privacy Protection", "url": "https://doi.org/10.1287/mnsc.2024.05007", "authors": "Can Küçükgül ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "利益を求めるプラットフォームが、プライバシー保護の制度の違いのもとでレコメンデーションの方針を設計する様子を分析した。オプトアウト保護と無保護が機能的に同等であることを示し、消費者が個人データを偽る自由があるとプラットフォームが推薦を歪め、双方に害が及びうる。推薦が製品への接近を制御する配分の役割を持つと、アルゴリズムによる差別で不利な少数派が機会を失いうる。"}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "環境への取り組みが強い企業ほど決算説明会で語らない", "title": "CEO environmental communication, speech acts, and firm value", "url": "https://doi.org/10.1007/s11747-026-01221-w", "authors": "Hai-Anh Tran ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-11", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "why": "364社・1万4,523件の決算説明会の質疑で、環境への取り組みについてCEOが語る量とその意図（発話行為）を、MSCIの環境スコア・Compustat・微調整したDeBERTaで測った。取り組みが強い企業ほど語る量は少なく、語りが企業価値と正に関連するかは意図による。断定的・指示的な発話は正の関連を保ち、表出的・約束的な発話は負の関連を持つ。"}, {"id": "jn08", "rank": 8, "field": "人口学", "headline": "共同の土地登記は夫婦の絆と協力の力を強める", "title": "Joint Land Titling and the Marital Bond in Southwestern Uganda", "url": "https://doi.org/10.1111/padr.70103", "authors": "Michelle Poulin ほか", "venue": "Population and Development Review", "date": "2026-11-11", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "ウガンダ南西部の無作為化介入で全額補助の土地登記を提供したところ、多くの夫が妻の名を登記に加えた。民族誌的な手法で、共同の登記が女性の交渉力を高めるだけでなく、夫の婚姻へのコミットメントの象徴となり、婚姻の絆を強めて夫婦の協力的な力を促す経路を見いだした。数値の結果に質的な探究を組み合わせて意味を探る。"}, {"id": "jn09", "rank": 9, "field": "気候科学", "headline": "農業・林業・土地利用の削減なしでは1.5℃は実現しない", "title": "Cost-effective climate change mitigation through land sector contributions", "url": "https://doi.org/10.1038/s41893-026-01977-7", "authors": "Leon Merfort ほか", "venue": "Nature Sustainability", "date": "2026-11-11", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "why": "統合評価モデルREMIND–MAgPIEで、農業・林業・その他の土地利用（AFOLU）の緩和政策の組み合わせ別に将来の経路を導いた。AFOLUの貢献がなければ21世紀中の1.5℃は達成できず、ピークを1.7℃未満に抑える消費損失は現行政策比で1.3%から3.5%に増える。バイオエネルギーを年100EJに限り、CH4とN2Oの価格を1トンCO2換算で75ドルに抑えるなどの政策で、食料価格の上昇などの圧力を和らげられる。"}, {"id": "jn10", "rank": 10, "field": "計算社会科学・ネットワーク科学", "headline": "48のLLMが書く求人票で性別の偏りを監査", "title": "Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models", "url": "https://doi.org/10.1111/gwao.70291", "authors": "Jennifer M. Krebsbach ほか", "venue": "Gender, Work and Organization", "date": "2026-11-11", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "why": "48のLLMで、32の職種を女性的・男性的・中立の職名で作った4,608件の求人票を生成し、給与の差・比較評価・性役割の語りの型を測るアルゴリズム監査を行った。ホワイトカラーの職種では男性的な職名の求人票に高い給与が割り当てられたが、頑健ではなかった。簡単なプロンプトの修正で偏りの一部は減るが、職種に根ざした性別の型は残る。"}, {"id": "jn11", "rank": 11, "field": "計算社会科学・ネットワーク科学", "headline": "流行の話題への便乗は投稿の反応を120.8%増やす", "title": "EXPRESS: From Trends to Tweets: The Impact of Trendjacking on Consumer Engagement on Social Media", "url": "https://doi.org/10.1177/10949968261508771", "authors": "Fatemeh Vafaeesefat ほか", "venue": "Journal of Interactive Marketing", "date": "2026-11-11", "sjr": 3.125, "citescore": 12.1, "citescore_year": "2025", "why": "356社の66万件超の投稿（2018〜2022年）とXの話題データを組み合わせ、流行の話題への便乗（トレンドジャッキング）がエンゲージメントを120.8%高めることを示した。効果は投稿のタイミング・話題の種類・ブランドの個性で変わり、2つの統制実験でも一貫した証拠を得た。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "変革的サービスが消費者の脆弱性を再生産する逆説", "title": "The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives", "url": "https://doi.org/10.1177/10946705261502647", "authors": "Shuai Qin ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "why": "難民の起業を支援する変革的サービスが消費者の脆弱性を減らしながら害を再生産しうる逆説を、33の事業の管理者42人へのインタビューと3年のエスノグラフィで調べた。資源へのアクセスと利用の統制の組み合わせで3つのサービスモデルを分け、それぞれが特有の脆弱性の型を生みやすいことを示す。"}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "女性が率いる企業は女性を多く雇い支援も手厚い", "title": "Female Managers, Women's Employment, and Gendered Laws", "url": "https://doi.org/10.1111/gwao.70276", "authors": "Hiep Manh Nguyen ほか", "venue": "Gender, Work and Organization", "date": "2026-11-10", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "why": "世界銀行の企業調査の国際データで、女性のトップを持つ企業ほど女性を雇用し、研修・育児支援・出産の福利厚生を提供し、イスラム圏では性別の差別が低い。この効果は法的な性別平等が弱い国・企業支援の限られる国で強く、男性中心の業種で弱い。女性従業員の比率が、女性のリーダーシップと生産性の負の関連を媒介する。"}, {"id": "jn14", "rank": 14, "field": "経営学", "headline": "サービスのエコシステムを共同で設計する「つながった摩擦」", "title": "Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations", "url": "https://doi.org/10.1177/10946705261492132", "authors": "Audun Formo Hay ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "why": "サービスのエコシステムの設計に必要な再帰性を、個人の能力でなく関係から生まれるものとして捉え直した。ノルウェーの児童福祉での2年間の協同的な探究から、「つながった摩擦」を中核の弁証法的な動態として示し、均一性と断絶が妨げる動態であること、4つの状況条件を明らかにした。"}, {"id": "jn15", "rank": 15, "field": "数学", "headline": "希薄なフェルミ気体のHuang–Yang予想を証明", "title": "The Huang–Yang conjecture for the low-density Fermi gas", "url": "https://doi.org/10.1007/s00222-026-01459-9", "authors": "Emanuela L. Giacomelli ほか", "venue": "Inventiones Mathematicae", "date": "2026-11-11", "sjr": 5.202, "citescore": 6.6, "citescore_year": "2025", "why": "斥力の短距離相互作用をもつスピン1/2のフェルミ粒子の希薄な気体の基底状態エネルギーの3項の漸近展開を確立し、1957年にHuangとYangが予測した式を検証した。公式は散乱長のみに依存する普遍的な形で、下界の証明が、先に得ていた上界と合わせて完成する。"}, {"id": "jn16", "rank": 16, "field": "工学", "headline": "植物の成長に学ぶ4D印刷で多安定構造を設計", "title": "Programmable multistable structures via bioinspired, mechanically guided 4D printing", "url": "https://doi.org/10.1073/pnas.2614289123", "authors": "Yan Zhao ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-10", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "植物の葉や果実の成長による変形を模した、力学的に導く4D印刷で、八安定と二安定の単位を設計・作製した。安定性の地形は無次元の幾何パラメータで調整でき座屈解析で検証され、八安定ユニットの組み合わせで10億超・4垓超の安定状態の構成空間をもつ帯とメタ表面を示した。液滴の誘導・可変スイッチ・把持などの応用を実演した。"}, {"id": "jn17", "rank": 17, "field": "因果推論", "headline": "エネルギー費の上昇は民主主義への満足度を下げる", "title": "Energy Burden and Satisfaction With Democracy: The Political Consequences of Market Risk in Germany", "url": "https://doi.org/10.1177/00104140261500761", "authors": "Laura Kettel ほか", "venue": "Comparative Political Studies", "date": "2026-11-10", "sjr": 3.796, "citescore": 8.6, "citescore_year": "2025", "why": "ドイツの郵便番号別のエネルギー価格・世帯支出・個人の政治的態度のデータで、操作変数の設計により、エネルギー費の上昇が民主主義への満足度を下げるという因果的な証拠を示した。効果は家計への打撃を通じた経路で説明される。"}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "エピジェネティックな生物学的年齢をマーケティングに取り入れる", "title": "EXPRESS: Biological Age and its Value to Marketing Theory and Practice", "url": "https://doi.org/10.1177/00222429261508777", "authors": "Steven D. Shaw ほか", "venue": "Journal of Marketing", "date": "2026-11-11", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "why": "加齢を暦年齢だけで扱うマーケティングを超え、エピジェネティックなデータから生物学的年齢（BioAge）の指標を導いて消費者行動の理論に統合する枠組みを示した。米国の健康と退職の調査のデータで、BioAgeが暦年齢に表れない加齢の側面を捉えることを示す。"}, {"id": "jn19", "rank": 19, "fiel   var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
