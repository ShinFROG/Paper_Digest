date": "2026-11-11", "sjr": 1.935, "citescore": 9.7, "citescore_year": "2025", "apa": "Matthews, N. L., Honda, H., O’Rourke, H., Southard, C., Verbeke, M., Schimmel, K., Babendure, J., Koke, J., & Smith, C. J. (2026). Community Attitudes Toward Meaningful Autism Inclusion. Autism. https://doi.org/10.1177/13623613261498495", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "抄録（Lay Abstractを含む）のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "自閉症の人の意味のある包摂（受容を超えて、価値を認め、投資に意味があると考えること）に対する地域の態度を測るMAIA尺度を、自閉症の当事者の自己権利擁護者の意見を入れて開発・検証した（抄録）。", "p2": "地域の態度を測る既存の尺度は、否定的な態度（スティグマ）や中立的な態度（受容）に注目し、意味のある包摂についての考えを測る項目を持たなかった（抄録）。", "p3": "25項目のMAIAと、神経多様性への一般的な態度を測る公刊尺度（NDAQ、28項目）を実施し、探索的構造方程式モデリングで因子を同定する。居住州、自閉症との個人的な接触、人口統計学的変数で態度が違うかを調べる（抄録）。", "p4": "対象は、米国の四州（アリゾナ、フロリダ、ミズーリ、オクラホマ）の772人（抄録）。", "p5": "MAIAは四因子（能力、対人関係、影響、包摂的な地域づくり）で、内的整合性は許容から良好、NDAQの尺度との収束妥当性もある。自閉症の人や他の精神的な状態の人との接触は、二因子（能力、影響）を正に予測した。友人・親族・知人としての接触など、一部の接触は対人関係の因子を負に予測した。アリゾナの参加者は、対人的な包摂について、他の三州より肯定的だった（抄録）。", "p6": "再現されれば、修正可能な要因が示唆される、と条件つきで述べる（抄録）。標本が四州の772人で、全国を代表するかは、抄録から分からない。", "fun": "自閉症の人と身近に接している人ほど、能力や影響には肯定的なのに、対人関係の包摂には慎重になる、という違いが面白い。受容か否かの一軸でなく、意味のある包摂を四つの側面に分けて測る点も特徴だ（抄録）。", "unverified": "本文を読んでいないため、因子負荷量、信頼性係数、効果の大きさ、標本の抽出方法、四州の選び方は確認できていない。"}}, {"id": "jr15", "rank": 15, "headline": "浅い地すべりの発生位置を深層学習と水文・力学で説明", "title": "Deep Learning and Mechanistic Framework Reveal Key Controls on Upper‐Slope Initiation of Rainfall‐Induced Shallow Landslides", "url": "https://doi.org/10.1029/2026jf009303", "authors": "Junyu Wu ほか", "venue": "Journal of Geophysical Research: Earth Surface", "date": "2026-11-10", "sjr": 1.437, "citescore": 6.6, "citescore_year": "2025", "apa": "Wu, J., Lü, Q., Liao, Z., Yu, Y., Song, J., & Wang, L. (2026). Deep Learning and Mechanistic Framework Reveal Key Controls on Upper‐Slope Initiation of Rainfall‐Induced Shallow Landslides. Journal of Geophysical Research: Earth Surface, 131(11). https://doi.org/10.1029/2026jf009303", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "降雨による浅い斜面崩壊が、斜面の上部の特定の位置で始まる理由を、深層学習と、水文・力学の物理モデルで調べた（抄録）。", "p2": "崩壊は尾根の近くで始まりやすいが、同じ斜面の他の位置でなく、なぜその位置に局在するかは未解明。地形の形状・土層の厚さ・一時的な間隙水圧が制御要因と知られるが、連続する斜面の断面に沿った空間的な相互作用が開始位置をどう制約するかは、十分に定量化されていない（抄録）。", "p3": "連続した地形と土層厚を解析して、崩壊の開始位置を予測する深層学習の方法を作る。従来のセルごとの方法が無視する空間的な依存を捉える。さらに、時間変化する水文モデルと三次元の斜面安定モデルを結合して、物理に基づく解釈を与える（抄録）。", "p4": "中国のZhujiの崩壊の目録で訓練・検証する。水文モデルは、観測されている斜面の現地観測で較正し、地域の局在は、553本の断面の地図化された開始位置で評価する（抄録）。", "p5": "深層学習の平均の正規化位置誤差（MNPE）は9%未満。寄与の順位は、土層の厚さ、平面曲率、斜面角度の順で、寄与は断面に沿って系統的に変わる。物理モデルでは、時間変化する飽和度が地図化された開始地点の85.0%で臨界閾値を超え、水文・力学から推定した開始位置のMNPEは14.9%だった（抄録）。", "p6": "Zhujiの条件で、急速な飽和の進展と相対的に低い力学的抵抗が重なる所に斜面上部の崩壊が集中する、という地形に条件づけられた水文・力学的な説明を支持する、にとどまる（抄録）。他の地域への一般性は、抄録に書かれていない。", "fun": "斜面の「どこで」崩れるかを、セルごとでなく断面全体を見て当てる発想が面白い。深層学習の誤差は9%未満、物理モデルは14.9%と、数字は学習の方が小さいが、物理モデルは「なぜそこか」を、飽和が早く進み抵抗が低い所だと説明する（抄録）。", "unverified": "本文を読んでいないため、深層学習の構造、寄与の分析法、水文モデルの較正の詳細、553本の断面の選び方は確認できていない。結果はZhujiの目録に限る。"}}, {"id": "jr16", "rank": 16, "headline": "車両-橋梁相互作用の応答でアーチ橋のハンガー損傷を同定", "title": "Multi-head-attention locally fused GAN for few-shot hanger damage identification in arch bridges using vehicle-bridge interaction responses", "url": "https://doi.org/10.1016/j.oceaneng.2026.129376", "authors": "Longde Su ほか", "venue": "Ocean Engineering", "date": "2026-11-11", "sjr": 1.524, "citescore": 10.2, "citescore_year": "2025", "apa": "Su, L., Su, J., Cheng, L., & Ouyang, T. (2027). Multi-head-attention locally fused GAN for few-shot hanger damage identification in arch bridges using vehicle-bridge interaction responses. Ocean Engineering, 371, 129376. https://doi.org/10.1016/j.oceaneng.2026.129376", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できなかった（Ocean Engineering掲載）", "preprint": false, "short": true, "p1": "車両が橋を走るときの応答（車両-橋梁相互作用）から、アーチ橋のハンガー（つり材）の損傷を、少数のデータで同定する、多頭注意の局所融合GANの手法を扱う論文（題名による）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さだけを書く。走る車両の振動から、橋の目に見えない部分（つり材）の傷を見つけ、しかも傷のデータが少ない状況でも使えるようにしようとする問いが面白い。走るだけで橋を診断する、という発想になる。", "unverified": "抄録・本文を入手できず、手法の構成・データ・結果はすべて未確認。"}}, {"id": "jr17", "rank": 17, "headline": "橋の定着部の応力を接触力学と超音波の非線形性で評価", "title": "A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity", "url": "https://doi.org/10.1177/14759217261501265", "authors": "Linqiang Zhou ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Zhou, L., Qian, J., & Guo, C. (2026). A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity. Structural Health Monitoring. https://doi.org/10.1177/14759217261501265", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Structural Health Monitoring）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "橋の定着部の接触界面の応力を、接触力学と超音波の非線形性を組み合わせた理論で、壊さずに評価するモデルを示した。", "p3": "一次元の縦波の散乱理論から、第1・第2次の界面剛性K1・K2を含む反射非線形係数γRの解析式を導き、粗さの形状と材料から作る楕円体の突起の多段接触モデルを、べき乗則モデルの物理的な補完として導入した。室内の単線の定着具の段階的な緊張と超音波の試験、現場の多線の定着具の緊張と超音波の試験で検証した。", "p5": "反射非線形係数γRは接触応力Pとともに単調に増える（界面の圧密と剛性の増加）。室内の単線の試験で、接触モデルによる音響の特性モデルの決定係数は0.9460。現場の多線の試験で、予測と実測の接触応力の相対誤差は8.49%だった（抄録）。", "fun": "橋のケーブルの端がどれだけ強く押さえられているかを、壊さずに知りたい。この研究は、音（超音波）が接触面を通るときの「ゆがみ」の大きさが、押す力が強いほど大きくなることを使って、力を逆算する。ざらざらした表面の形から理論で出せるので、あてはめの手間が少ない。", "unverified": "本文を入手できず、モデルの導出と図表は未確認。べき乗則モデルとの比較の数値は抄録にない。"}}, {"id": "jr18", "rank": 18, "headline": "交通を止めずに中空床版橋のヒンジ継手の損傷を評価", "title": "Traffic-undisrupted assessment of hinge joint damage in hollow slab bridges using computer vision and LDIL inversion", "url": "https://doi.org/10.1016/j.istruc.2026.113508", "authors": "Haozhe Jiang ほか", "venue": "Structures", "date": "2026-11-10", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Jiang, H., Yuan, L., Zhuge, P., & Jie, Z. (2026). Traffic-undisrupted assessment of hinge joint damage in hollow slab bridges using computer vision and LDIL inversion. Structures, 94, 113508. https://doi.org/10.1016/j.istruc.2026.113508", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できなかった（Structures掲載）", "preprint": false, "short": true, "p1": "交通を止めずに、中空床版橋のヒンジ継手の損傷を、コンピュータビジョンとLDIL逆解析で評価する手法を扱う論文（題名による）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さだけを書く。橋の上を車が走っているままで、画像から継手の傷みを推定する、という問いが面白い。通行止めにせずに点検できれば、道路を使いながら橋を守れる。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "ボルト締結部の締付けトルクの低下を確率的機械学習で検出", "title": "Probabilistic machine learning for detection of tightening torque in bolted joints", "url": "https://doi.org/10.1177/14759217211054150", "authors": "Luccas Pereira Miguel ほか", "venue": "HAL (ART) Structural Health Monitoring", "date": "2026-11-09", "citescore": 14.4, "citescore_year": "2025", "apa": "Miguel, L. P., Teloli, R. d. O., da Silva, S., & Chevallier, G. (2022). Probabilistic machine learning for detection of tightening torque in bolted joints. Structural Health Monitoring, 21(5), 2136–2151. https://doi.org/10.1177/14759217211054150", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HAL（Structural Health Monitoring掲載の記録）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "ボルト締結部の締付けトルクの低下を、トルクセンサなしに、固有振動数から確率的機械学習で検出・推定する方法を示した。", "p3": "安全な状態の締付けトルクでの推定固有振動数で混合ガウスモデル（GMM）を学び、未知の状態で損傷指標を計算する。トルクと損傷指標の組でガウス過程回帰（GPR）を学び、学習に使わなかった条件のトルクを補間して推定する。", "p5": "ラップ継手のオリオン梁（学術規模の試験体）で、制御したRMSのランダム振動と複数の締付けトルクの条件のもと、少ない誤診で、各ボルトにトルクセンサなしに、振動の間接的な測定から実際のトルクの状態を適切に検出できた（抄録）。数値は抄録にない。", "fun": "ボルトが少し緩んだだけでも、構造全体の「揺れ方の音程」（固有振動数）がわずかに変わる。その変化を手がかりに、センサをボルトごとに付けなくても、どれだけ緩んだかを確率つきで推定する発想が面白い。", "unverified": "本文を入手できず、誤診の率などの数値と、実験の条件の詳細は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "橋梁点検報告書の大規模な質問応答を視覚RAGで行う", "title": "Visual RAG for automated question answering over large-scale bridge inspection reports", "url": "https://doi.org/10.1016/j.autcon.2026.107372", "authors": "Chaemin Lee ほか", "venue": "Automation in Construction", "date": "2026-11-11", "sjr": 2.917, "citescore": 22.7, "citescore_year": "2025", "apa": "Lee, C., Choi, Y., & Kong, J. (2027). Visual RAG for automated question answering over large-scale bridge inspection reports. Automation in Construction, 193, 107372. https://doi.org/10.1016/j.autcon.2026.107372", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "同じ論文のSSRN版の抄録（Crossrefの題名検索）を読んだ。出版社サイトは取得できなかった", "preprint": false, "short": true, "p1": "橋梁の定期点検報告書の大量の表の中から、視覚的な回答生成を使って質問に答えるRAGシステムを示した。", "p3": "表中心で、情報が階層的な章に散らばる半構造の報告書に対し、レイアウトを意識した文書の解析・構造化した分割・章で絞るハイブリッド検索・視覚的な回答生成を組み合わせた。", "p5": "2つの主要な橋の評価で、ボンフェローニ補正後も基準のRAGより有意に改善した。文書全体を取り込む長文脈の言語モデルとは有意差がなく、提案システムは回答生成の費用が7〜9倍低かった。コードを変えずに未知の橋の報告書にも一般化し、誤りの主因は幻覚でなく「抜け」だった（抄録）。", "fun": "橋の点検報告書は表だらけで、必要な情報があちこちの章に散らばっている。文章にするとレイアウトが壊れて意味が失われるので、「画像のまま」見せて答えさせる発想が面白い。間違いの多くが「作り話」でなく「見落とし」だったことも、現場では大事な情報になる。", "unverified": "本文を入手できず、評価の質問の数・正確さの数値・使ったモデルは未確認。"}}, {"id": "jr21", "rank": 21, "headline": "物質点法を空間・時間の重なり合う細分化で効率化", "title": "An overlapping Schwarz space-time refinement framework for multi-resolution material point method", "url": "https://doi.org/10.1007/s00466-026-02884-6", "authors": "Zhaofeng Luo ほか", "venue": "Computational Mechanics", "date": "2026-11-11", "sjr": 1.223, "citescore": 7.7, "citescore_year": "2025", "apa": "Luo, Z., Li, M., & Jiang, Y. (2026). An overlapping Schwarz space-time refinement framework for multi-resolution material point method. Computational Mechanics. https://doi.org/10.1007/s00466-026-02884-6", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Computational Mechanics）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "強い局所化・接触・大変形のある問題で、物質点法の空間・時間の解像度を領域ごとに変えて効率を上げる、重なり合うSchwarz反復の枠組み（OS-MPM）を示した。", "p3": "領域を重なる粗い領域と細かい領域に分け、各領域では標準のMPMの離散化を保ち、質量重みの空間伝達と時間補間による副サイクルを組み合わせたSchwarz反復で結合する。結合の複雑さは、不整合格子の界面の演算に移す。", "p5": "重力で撓む片持ち梁・Hertz接触・弾性介在物の3つのベンチマークで、解析解や細かい解像度の基準解を良い精度で再現した。介在物の問題では、最も細かい解像度で単一領域の細かい計算と同程度の応力誤差になり、一様な細格子MPMより4.3〜9.1倍速い。3次元の折りたたみ例で一般性も示した（抄録）。", "fun": "砂や雪のように大きく崩れる物体を計算するとき、全部を細かく計算すると重すぎる。変形が集中するところだけ細かく・短い時間刻みで、ほかは粗く、と使い分けて、境目をうまくつなぐ工夫が面白い。", "unverified": "本文を入手できず、反復の収束条件・各ベンチマークの誤差の数値・計算機の条件は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "FEM援用のDEMで不飽和砂の非排水応答と静的液状化を解析", "title": "FEM enhanced DEM modeling on the undrained response of imperfectly saturated sand: numerical algorithm and its application in static liquefaction", "url": "https://doi.org/10.1016/j.compgeo.2026.108820", "authors": "Teng Zhao ほか", "venue": "Computers and Geotechnics", "date": "2026-11-10", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Zhao, T., Xie, X., Ye, J., & Yang, Z. (2027). FEM enhanced DEM modeling on the undrained response of imperfectly saturated sand: numerical algorithm and its application in static liquefaction. Computers and Geotechnics, 203, 108820. https://doi.org/10.1016/j.compgeo.2026.108820", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できなかった（Computers and Geotechnics掲載）", "preprint": false, "short": true, "p1": "不完全に飽和した砂の非排水応答を、有限要素法で補強した個別要素法で解く数値アルゴリズムと、静的な液状化への適用を扱う論文（題名による）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さだけを書く。砂のつぶ1つ1つの動きを計算する個別要素法に、水の流れを扱う有限要素法を組み合わせて、地面が液体のようになる液状化を調べるという問いが面白い。地震でなく、ゆっくりした荷重で起きる「静的液状化」を扱う。", "unverified": "抄録・本文を入手できず、手法・数値例・結果はすべて未確認。"}}, {"id": "jr23", "rank": 23, "headline": "観測のない流域の洪水・土石流の危険度図を歴史的な事象で検証", "title": "An Integrated Methodological Framework with Historical Validation for Flood and Debris-Flow Hazard Zoning in Ungauged Andean Catchments", "url": "https://doi.org/10.3390/urbansci10110651", "authors": "Luis Antonio Yataco Pastor ほか", "venue": "Urban Science", "date": "2026-11-10", "citescore": 3.7, "citescore_year": "2025", "apa": "Yataco Pastor, L. A., Ybaceta-Valdivia, A. C., Álvarez-Alvarado, J. M., Castillo Alvarez, Y., Jiménez Borges, R., Carrera, L. A. I., Olivares-Ramírez, J. M., & Rodríguez-Reséndiz, J. (2026). An Integrated Methodological Framework with Historical Validation for Flood and Debris-Flow Hazard Zoning in Ungauged Andean Catchments. Urban Science, 10(11), 651. https://doi.org/10.3390/urbansci10110651", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Urban Science掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "観測のない流域の洪水・土石流の危険度図を、過去の観測事象で検証してから公開する6段階の枠組み（OF-VAL）を示した。", "p3": "オープンデータだけで作る枠組みで、記録のある過去の事象を再現して、観測された被害範囲をあらかじめ決めた閾値（F≥0.50）以上で再現できたときだけ、危険度の成果物を出す「検証の関門」が特徴。ペルーのクスコの19.41 km2の流域で、2018年12月21日の土石流を基準にした。", "p5": "基準の事象の降雨の4つのオープンデータの推定（1日あたり6.3・9.7・7.5・18.2 mm）は発生閾値より1桁小さく、降雨由来でなく天然ダムの決壊と判断され、検証の関門は実行不能と宣言された。修正後の設計降雨（再現期間25〜140年）では、61〜76 mmの雨量のうち過剰流出は3.3〜6.9 mmで、最悪のシナリオで8.6 haが浸水した（抄録）。", "fun": "危険度の地図は、「本当に当たっているか」を確かめないまま配られることが多い。この研究は、過去の事象を再現できなければ地図を出さないという「関門」を作った。検証に使った事象が雨でなく天然ダムの決壊だと分かり、「検証できなかった」と正直に報告している点も面白い。", "unverified": "本文を入手できず、F値の計算・各段階のパラメータは未確認。成果物は検証されていない診断用の位置づけ。"}}, {"id": "jr24", "rank": 24, "headline": "生成AIは中小企業のサステナビリティ報告をどう変えるか", "title": "How generative AI reshapes sustainability reporting: Insights from an action design research study", "url": "https://doi.org/10.1007/s12525-026-00943-7", "authors": "Niclas Brune ほか", "venue": "Electronic Markets", "date": "2026-11-10", "sjr": 2.143, "citescore": 16.8, "citescore_year": "2025", "apa": "Brune, N., Gräf, M., Walter, P., & Buxmann, P. (2026). How generative AI reshapes sustainability reporting: Insights from an action design research study. Electronic Markets, 36(1). https://doi.org/10.1007/s12525-026-00943-7", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Electronic Markets）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "生成AIが、中小企業のサステナビリティ報告の意味づけ（センスメイキング）をどう支え、どう変えるかを、アクション・デザイン研究で調べた。", "p3": "生成AIを使ったサステナビリティ報告の支援ツールを作って繰り返し改良し、複数の組織の事例で評価した。", "p5": "生成AIは、情報の構造化・文脈に応じた手引き・認知的な障壁の低下で従来の意味づけを支え、新しい視点の提示・内省の促し・人とAIの共同の解釈で意味づけを引き起こす。同時に、AIの出力は利用者の関与の深さを下げ、どのサステナビリティの枠組みが優勢になるかを形づくりうる（抄録）。", "fun": "AIに報告書を手伝ってもらうと、書くのは楽になるが、自分で考える深さが浅くなるかもしれない。この研究は、AIが「考えるきっかけを与える」面と「考えを一方向に寄せる」面の両方を、実際の会社の事例で確かめた点が面白い。", "unverified": "本文を入手できず、事例の数・評価の方法・導いた設計原則の中身は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "アルゴリズムの介在で財務報告の信頼性はどう変わるか（総説）", "title": "Credibility displacement in algorithmic financial reporting: a critical review of AI, disclosure credibility and capital-market consequences", "url": "https://doi.org/10.1108/jal-06-2026-0363", "authors": "Hyder Ali", "venue": "Journal of Accounting Literature", "date": "2026-11-10", "citescore": 4.8, "citescore_year": "2025", "apa": "Ali, H. (2026). Credibility displacement in algorithmic financial reporting: a critical review of AI, disclosure credibility and capital-market consequences. Journal of Accounting Literature, 1–21. https://doi.org/10.1108/jal-06-2026-0363", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Journal of Accounting Literature掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "AI・機械学習・LLM・XBRL分析が財務報告の連鎖に入ると、報告の信頼性がどう変わるかを、「信頼性の置き換え」という概念で整理した総説。", "p3": "PRISMAに沿った検索と選別に、概念中心の統合を組み合わせた。根拠は226本の精選した中核と、144本の詳細な統合の部分集合で、感度分析で39件の掲載先の境界と統合の閾値を再検討した。", "p5": "根拠は、テキストの開示とNLP・監査分析と保証・XBRLの構造化報告・市場の解釈・会計情報システムの導入・AIガバナンスに散らばる。アルゴリズムは報告の過程を良くしうるが、報告の主張が受け入れられる根拠も変えうる。この可能性を、モデルの出力・出所・検証が、主張そのものの吟味や専門家・制度の保護の一部を置き換える「信頼性の置き換え」と呼ぶ（抄録）。", "fun": "「AIがチェックしたから大丈夫」と、人が本来の確認をやめてしまうのは、会計に限らない身近な落とし穴。この総説は、その仕組みを「信頼性の置き換え」と名づけ、準備・保証・機械可読な提示・アルゴリズムによる解釈の4つの場面に分けて整理しているのが面白い。", "unverified": "本文を入手できず、226本の中身・4つの場面の詳しい整理は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "監査の評価でLLMは学生と比べてどうか", "title": "Large Language Models In Auditing Assessments: Comparisons Between Human Learners, Model Scale, and Enhancement Techniques", "url": "https://doi.org/10.22146/abis.v14i4.125774", "authors": "Arizona Mustikarini", "venue": "ABIS: Accounting and Business Information Systems Journal", "date": "2026-11-11", "apa": "Mustikarini, A. (2026). Large Language Models In Auditing Assessments: Comparisons Between Human Learners, Model Scale, and Enhancement Techniques. ABIS: Accounting and Business Information Systems Journal, 14(4), 301. https://doi.org/10.22146/abis.v14i4.125774", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（ABIS: Accounting and Business Information Systems Journal掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "LLMが監査の知識問題では学生より高い点を取るが、データ分析の実務では配点の半分も取れない、「知っていても、できない」差を示した。", "p3": "宣言的知識と手続的知識の区別にもとづき、7つの公開LLMを、学生352人が受けた4つの学部の監査試験（知識の評価）と、売上の実在性と支出の網羅性をSQLで検証する計画・実行（データ分析の事例）の2形式で評価した。自己省察とエージェント型のワークフローの2つの強化法も試した。", "p5": "知識の評価では、大きいLLMは学生の78〜98パーセンタイルに入り、小さいLLMより上。データ分析の事例では、どのLLMも配点の上限の50%を超えず、大小の差は有意でない。自己省察とエージェント型は改善しなかった（抄録）。", "fun": "試験の問題には答えられるAIが、実際の帳簿をSQLで調べる仕事になると、半分も点が取れない、というのが面白い。「知っている」ことと「やれる」ことの差が、会計監査でもはっきり出る。自分で見直すだけでは、知識の間違いは直らない。", "unverified": "本文を入手できず、7つのLLMの名前・採点の基準・各条件の数値は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "LLMで企業の誠実性の文脈的な指標を作る", "title": "Developing a Contextual Corporate Integrity Measure Using Large Language Models", "url": "https://doi.org/10.1007/s10796-026-10822-3", "authors": "Ashok Kumar ほか", "venue": "Information Systems Frontiers", "date": "2026-11-11", "sjr": 2.549, "citescore": 26.4, "citescore_year": "2025", "apa": "Kumar, A., & Dutta, S. (2026). Developing a Contextual Corporate Integrity Measure Using Large Language Models. Information Systems Frontiers. https://doi.org/10.1007/s10796-026-10822-3", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できなかった（Information Systems Frontiers掲載）", "preprint": false, "short": true, "p1": "LLMを使って、企業の誠実性（インテグリティ）を文脈に応じて測る指標を作る論文（題名による）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さだけを書く。「誠実な会社」を測る物差しを、文章を読むAIで作るという問いが面白い。数字では見えにくい企業の姿勢を、言葉から読み取れるかが焦点になる。", "unverified": "抄録・本文を入手できず、指標の作り方・データ・結果はすべて未確認。"}}, {"id": "jr28", "rank": 28, "headline": "消費者が感じる人工的共感の6次元の尺度", "title": "Measuring Consumer‐Perceived Artificial Empathy: Development and Validation of a Six‐Dimensional Scale", "url": "https://doi.org/10.1111/ijcs.70280", "authors": "Heng Chu ほか", "venue": "International Journal of Consumer Studies", "date": "2026-11-11", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "apa": "Chu, H., Ji, C., Li, M., & Prentice, C. (2026). Measuring Consumer‐Perceived Artificial Empathy: Development and Validation of a Six‐Dimensional Scale. International Journal of Consumer Studies, 50(6). https://doi.org/10.1111/ijcs.70280", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Top10%誌（International Journal of Consumer Studies）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "AIの対応を消費者がどう「共感的」と感じるかを測る、24項目・6次元の尺度を作り、検証した。", "p3": "文献レビューと質的インタビューから項目を作り、専門家評価で表面・内容の妥当性を確認した。3つの独立した標本で、探索的因子分析（N = 413）、確認的因子分析（N = 476）、部分最小二乗の構造方程式モデル（N = 537）による予測妥当性の検証を行った。", "p5": "24項目で、知覚の鋭さ・注意深さ・包括性・適応性・本物らしさ・敬意の6次元の尺度になる。消費者が人でない存在からどのように心理的な支えを感じるかを示し、AIが共感的なサービス体験を生む機構を明らかにする（抄録）。", "fun": "AIが「わかってくれている」と感じるかは、返事の速さや丁寧さだけでなく、「本物らしさ」や「敬意」のような6つの感覚の組み合わせで決まるらしい、という整理が面白い。コールセンターのAIなどの良し悪しを、数字で診断できる道具になる。", "unverified": "本文を入手できず、各次元の項目の中身・信頼性係数・予測妥当性の効果の大きさは未確認。"}}, {"id": "jr29", "rank": 29, "headline": "ブーマーからZ世代まで口コミの動機と使う場が違う", "title": "Why, where, and how generations from Baby Boomers to GenZ share eWOM: fresh insights from generational cohort theory", "url": "https://doi.org/10.1080/02508281.2025.2528225", "authors": "Kristína Pompurová ほか", "venue": "HAL (ART) Tourism Recreation Research", "date": "2026-11-09", "citescore": 11.3, "citescore_year": "2025", "apa": "Pompurová, K., Filieri, R., & Medeková, K. (2025). Why, where, and how generations from Baby Boomers to GenZ share eWOM: fresh insights from generational cohort theory. Tourism Recreation Research, 51(5), 2014–2038. https://doi.org/10.1080/02508281.2025.2528225", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "HAL（Tourism Recreation Research掲載の記録）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "ベビーブーマーからZ世代まで、観光地の口コミ（eWOM）を共有する動機と使う場が世代で違うことを、代表標本で示した。", "p3": "チェコとスロバキアの代表標本のデータで、世代コホート理論にもとづき、4つの世代（ベビーブーマー・X・Y・Z）のeWOMの関与・動機・プラットフォームの好みを、幅広いプラットフォームで比べた。", "p5": "Z世代とY世代は視覚的なプラットフォームを好み、自己高揚や外的報酬で動く。年長の世代は利他的な動機が強く、制度的なプラットフォームを好む。肯定的なeWOMがどの世代でも優勢で、世代の境界は固くないとして、個人レベルの調整変数を統合することを支持する（抄録）。", "fun": "同じ「おすすめの観光地」でも、若い人は映える写真を載せたい気持ちが強く、年長の人は「ほかの人の役に立ちたい」気持ちが強い、という違いが面白い。世代でひとくくりにはできない、という結論も、身近な実感に近い。", "unverified": "本文を入手できず、標本の大きさ・各差の検定結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "動画配信の乗り換え意向を信頼とスイッチングバリアで説明", "title": "Platform Dissatisfaction to Switching Intention: The Roles of Trust, Switching Barriers, and Alternative Attractiveness in Video Streaming Services", "url": "https://doi.org/10.12688/f1000research.189722.1", "authors": "Rafael Latif ほか", "venue": "F1000Research", "date": "2026-11-11", "citescore": 2.9, "citescore_year": "2025", "apa": "Latif, R., Ferrencya, F., Amalia, A., Silvia, D., & Arianto, R. (2026). Platform Dissatisfaction to Switching Intention: The Roles of Trust, Switching Barriers, and Alternative Attractiveness in Video Streaming Services. F1000Research, 15, 1767. https://doi.org/10.12688/f1000research.189722.1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（F1000Research掲載）を読んだ。抄録が途中で途切れており、本文は入手できなかった", "preprint": false, "short": true, "p1": "動画配信サービスの乗り換えの意向を、信頼・スイッチングバリア・代替の魅力でどう説明できるかを、インドネシアの利用者の調査で調べた。", "p3": "Push–Pull–Mooringの枠組みで、複数のサービスを使った経験のある417人の有効回答を、SmartPLS 4.0の部分最小二乗の構造方程式モデル（ブートストラップ5,000回）で分析した。", "p5": "13の仮説のうち11が支持された。乗り換えの意向の有意な予測要因のうち、サービス品質への不満が最も強い正の効果（β = 0.183）だった（抄録）。抄録は途中で途切れており、他の結果は確認できなかった。", "fun": "「不満だから乗り換える」だけでなく、「ほかにもっと良いところがあるか」「乗り換えに手間や費用がかかるか」「そのサービスを信頼しているか」が絡み合う、という整理が面白い。サブスクをやめる・移るときの気持ちを、3種類の力で見る。", "unverified": "本文を入手できず、抄録が途切れているため、不満以外の予測要因と、信頼・スイッチングバリアの効果の大きさは未確認。"}}, {"id": "jr31", "rank": 31, "headline": "バンコクの商業施設の外観が来訪意向に及ぼす効果", "title": "Contemporary Urban Commercial Complexes as Urban Architectural Interfaces: Exterior Architectural Qualities, Positive Affect, and Visitation Intention in Bangkok", "url": "https://doi.org/10.3390/buildings16224499", "authors": "Taksaporn Petlai ほか", "venue": "Buildings", "date": "2026-11-11", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Petlai, T., Wongvorachan, T., Ratanapong, N., Sirirat, S., Thampanichwat, C., Bunyarittikit, S., & Pongsermpol, C. (2026). Contemporary Urban Commercial Complexes as Urban Architectural Interfaces: Exterior Architectural Qualities, Positive Affect, and Visitation Intention in Bangkok. Buildings, 16(22), 4499. https://doi.org/10.3390/buildings16224499", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Buildings）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "バンコクの3つの商業施設の外観が、利用者の肯定的な感情と来訪の意向にどう結びつくかを、レビューの内容分析で調べた。", "p3": "刺激-有機体-反応の枠組みで、外観の建築的な質を知覚された刺激、肯定的な感情を内的な反応、来訪に関わる表現をレビューにもとづく指標とし、Googleマップの匿名化したレビュー149件を質的・量的に内容分析した。", "p5": "利用者は外観を、設計・現代性・空間・配置・独自性・美しさといった建築的・体験的な語で述べた。空間の質や設計全般の属性は、特に印象の鮮やかさ・感覚への刺激・安全性を通じて、肯定的な感情と関連した。肯定的な感情は、来訪・探索・滞在・推薦・再訪の表現とも関連した（抄録）。", "fun": "デパートや大型の商業施設に行きたくなる理由は、中の店だけでなく、外から見たときの「かっこよさ」や「安心感」にもある、という点が面白い。星の数でなく口コミの言葉を数えて、建物の印象と来たい気持ちのつながりを見ている。", "unverified": "本文を入手できず、149件の分類の基準・関連の強さの数値は未確認。小規模な内容分析である点に注意。"}}, {"id": "jr32", "rank": 32, "headline": "市場の公正の規範は40年でどう変わったか（1986年研究の追試）", "title": "Evolving Norms of Market Fairness: Stable Mechanisms and Shifting Standards in a Contemporary Replication of Kahneman et al. (1986)", "url": "https://doi.org/10.1177/01461672261495988", "authors": "William Rose ほか", "venue": "Personality and Social Psychology Bulletin", "date": "2026-11-11", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "apa": "Rose, W., & Gladstone, J. J. (2026). Evolving Norms of Market Fairness: Stable Mechanisms and Shifting Standards in a Contemporary Replication of Kahneman et al. (1986). Personality and Social Psychology Bulletin. https://doi.org/10.1177/01461672261495988", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Personality and Social Psychology Bulletin）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "1986年のKahnemanらの市場の公正の研究を追試し、公正の認知の仕組みはほぼ変わらないが、公正の規範は変わったことを示した。", "p3": "元のシナリオと現代化したシナリオで、クラウドワーカーと一般住民の標本を使い、4つの追試（N = 1,016）を行った。", "p5": "参加者は、既存の価格や賃金を当然の権利として扱い、賃上げの保留より賃下げを厳しく判断し、市場支配力を使う企業を非難した。一方、規範は市場領域で違う方向に変わり、1986年に比べ価格の値上げへの反対のオッズはどの標本でも約40〜55%下がった。雇用主の行為により強く反対したのは若いクラウドワーカーだけで、一般住民のパネルにこの変化はなかった（抄録）。", "fun": "「値上げは不公平」「賃下げはひどい」という感覚は40年たっても同じだが、何を不公平と感じる水準は、時代とともに動いていた、という点が面白い。公平さの感覚は、変わらない仕組みと、経済に合わせて動く基準の組み合わせでできている。", "unverified": "本文を入手できず、使った状況の中身・各標本の効果の大きさは未確認。"}}, {"id": "jr33", "rank": 33, "headline": "日常の活動空間の資源ブローカーとリアルタイムの感情", "title": "Activity spaces, community resource brokers, and real-time stress and affect: Evidence from the Boston Activity Space and Health Study", "url": "https://doi.org/10.1177/00420980261500260", "authors": "Gregory Sharp ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Sharp, G., & Walton, E. (2026). Activity spaces, community resource brokers, and real-time stress and affect: Evidence from the Boston Activity Space and Health Study. Urban Studies. https://doi.org/10.1177/00420980261500260", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Urban Studies）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "日々の活動空間にある地域の資源ブローカー（職場・礼拝所・運動・食料品店など）を実際に利用することが、その場での気分とストレスを和らげることを示した。", "p3": "ボストンの成人のスマートフォンによるGPS位置と生態学的瞬間評価（BASHS）を7日間集め、資源ブローカーへのアクセスとリアルタイムのストレス・感情の関係を、利用の有無による条件づけも含めて、変量効果モデルで推定した。", "p5": "日常的にアクセスできるだけでなく、日常的に利用することが、その場での感情的・生理的な苦痛を和らげるのに効く、という結果（抄録）。数値は抄録にない。", "fun": "近所に使える場所があるだけでなく、実際によく使うことが、その瞬間の気持ちを軽くする、という点が面白い。1週間ずっと位置と気分を記録して、場所と気分を結ぶ方法が、都市と暮らしの研究の新しい道具になる。", "unverified": "本文を入手できず、「資源ブローカー」の定義・効果の大きさ・標本の規模は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "単一項目の尺度で何が示せるかを心理測定で整理", "title": "A Psychometric Evaluation of Single‐Item Measures", "url": "https://doi.org/10.1111/1748-8583.70071", "authors": "Justin A. DeSimone", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "DeSimone, J. A. (2026). A Psychometric Evaluation of Single‐Item Measures. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70071", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Human Resource Management Journal）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "人事管理研究で増えている単一項目の尺度が、何を示せて何を示せないかを、心理測定の理論で整理した。", "p3": "古典的テスト理論・項目反応理論・一般化可能性理論にもとづき、論理・数学・先行の心理測定研究から、因子構造・信頼性・妥当性の評価の仮定と得失を整理した。", "p5": "単一項目の尺度は、潜在的な因子構造や内的一貫性を経験的に示せず、よくある回避策は検証できない仮定に頼る。一方、時間的一貫性や評価者間の信頼性、基準関連妥当性や構成概念妥当性の一部は、概念的にも数学的にも適切に評価できる。単一項目の使用が正当化される場面を判断するチェックリストを示す（抄録）。", "fun": "アンケートの質問を1つに減らすと、回答は楽になるが、「この質問は本当に測りたいものを測っているか」を確かめにくくなる。この論文は、1項目でできる確認と、できない確認をはっきり分けて、迷ったときのチェックリストを付けた点が実用的で面白い。", "unverified": "本文を入手できず、チェックリストの項目・数式の詳細は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "相互ケアを心理社会的実践として捉える関係モデル", "title": "Reciprocal care as a psychosocial practice: a relational model of interdependence, agency, and community well-being", "url": "https://doi.org/10.3389/fpsyg.2026.2020169", "authors": "José Antonio Younis Hernández ほか", "venue": "Frontiers in Psychology", "date": "2026-11-11", "citescore": 7.0, "citescore_year": "2025", "apa": "Younis Hernández, J. A., Etopa Bitata, M. d. P., Morales Almeida, P., & Morata Sampaio, L. (2026). Reciprocal care as a psychosocial practice: a relational model of interdependence, agency, and community well-being. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.2020169", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Frontiers in Psychology掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "ケアを、依存への対応としてではなく、脆弱性が相互依存と承認を通じて関係的な主体性と共同体の幸福に変わる心理社会的な過程として捉える概念モデルを示した。", "p3": "社会心理学・承認理論・フェミニストのケアの倫理・社会問題の社会学を組み合わせ、脆弱性は人間の人類学的な条件で、相互依存はその社会的な現れであり、承認が、共有された脆弱性を関係的な主体性の源にする中心的な機構だと論じる概念論文。", "p5": "実証の結果はなく、概念の枠組みの提示。相互ケアは、信頼・互恵・責任・社会参加を育てる生成的な過程で、共同体の幸福は、相互の承認と共有された責任を支える関係の系の創発的な性質として捉え直される（抄録）。", "fun": "「弱さ」は欠点ではなく、人間に共通の条件で、お互いに気づいて認め合うことで、かえって人を動かす力になる、という考え方が面白い。ケアする側・される側を分けず、お互いに支え合う関係の網として地域を見る。", "unverified": "本文を入手できず、モデルの図と各概念の定義の詳細は未確認。概念論文で、実証はない。"}}, {"id": "jr36", "rank": 36, "headline": "支える側にも支えが要る：高齢の保健ボランティア", "title": "When the Caregiver Needs Care: Mental Health Experiences of Elderly Health Cadres with Hypertension Living Alone in Rural Indonesia", "url": "https://jurnal.unitri.ac.id/index.php/care/article/view/8776", "authors": "Retno Lestari ほか", "venue": "Care Jurnal Ilmiah Ilmu Kesehatan", "date": "2026-11-08", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Care: Jurnal Ilmiah Ilmu Kesehatan掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "独居で高血圧をもつ高齢女性の保健ボランティアが、他の人を支えながら自分は支えを得にくいという、心の健康の体験を示した。", "p3": "インドネシアの東ジャワの農村の、60〜67歳の高齢女性のボランティア7人を目的的に選び、Zoomで半構造化インタビューを行い、記述的現象学の方法とBraunとClarkeの6段階の主題分析で分析した。", "p5": "6つの主題（高血圧への心理社会的な反応、対処とレジリエンス、独居、保健サービスの障壁、仲間の支え、多疾患）を見いだした。最も多い懸念は恐れ・不安・孤独で、宗教的な信念とケアの役割が回復力を支えた。孤独で孤立していると感じ、専門的な支えを必要としつつ、愛する人のケアを続けていた（抄録）。", "fun": "地域の健康を支えているボランティア自身が、ひとりで暮らして病気も抱え、孤独を感じている、という「支える側の支えられなさ」が面白い。それでも他の人のケアをやめず、信仰や仲間が支えになっている。見えにくい地域の担い手を、制度がどう支えるかが問われる。", "unverified": "本文を入手できず、各主題の引用・インタビューの詳細は未確認。7人の小規模な質的研究で、一般化はできない。"}}, {"id": "jr37", "rank": 37, "headline": "日本の中年会社員の孤独予防の意図をWOOPで高める", "title": "Testing a WOOP-SET intervention to promote loneliness-prevention intentions and examine ageism among middle-aged Japanese regular employees", "url": "https://doi.org/10.3389/frsps.2026.1978965", "authors": "Yuho Shimizu", "venue": "Frontiers in Social Psychology", "date": "2026-11-11", "citescore": 1.6, "citescore_year": "2025", "apa": "Shimizu, Y. (2026). Testing a WOOP-SET intervention to promote loneliness-prevention intentions and examine ageism among middle-aged Japanese regular employees. Frontiers in Social Psychology, 4. https://doi.org/10.3389/frsps.2026.1978965", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Frontiers in Social Psychology掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "日本の中年の正社員に、孤独の予防の行動意図を高める短いオンライン介入（WOOP-SET）の効果を示した。", "p3": "WOOP（願い・結果・障害・計画）の演習に、将来の高齢の自分との連続性を強調するメッセージを組み合わせた介入を、40〜64歳の日本の正社員で2つの調査で調べた。研究1は事前事後の単一群（N = 200）、研究2は関係のない課題を対照とする、より大きな準無作為化比較（N = 759）。", "p5": "研究1で、介入後に孤独予防の行動意図が上がり、エイジズムが下がった。研究2で、介入条件は対照より孤独予防の意図が有意に大きく上がったが、エイジズムへの条件間の有意な効果はなかった。退職後のつながりへの準備の意図は上がるが、エイジズムへの効果は不確か（抄録）。", "fun": "退職後に孤独にならないための「準備の気持ち」を、短いオンラインの練習で高められる、という点が面白い。「未来の自分」とのつながりを意識させると、人は動きやすくなる。ただし、年齢への偏見（エイジズム）は、そう簡単には変わらなかった。", "unverified": "本文を入手できず、効果の大きさと、実際の行動の変化は未確認。意図の自己申告で、行動は測っていない。"}}, {"id": "jr38", "rank": 38, "headline": "水辺の再開発で孤立を防ぐ都市デザイン（パース）", "title": "Designing against isolation: urban planning, public space, and social connection at Elizabeth Quay, Perth, Australia", "url": "https://doi.org/10.1186/s44147-026-01313-y", "authors": "Katherine Vernot-Jonas ほか", "venue": "Journal of Engineering and Applied Science", "date": "2026-11-11", "citescore": 5.2, "citescore_year": "2025", "apa": "Vernot-Jonas, K., & Szabo, M. (2026). Designing against isolation: urban planning, public space, and social connection at Elizabeth Quay, Perth, Australia. Journal of Engineering and Applied Science, 73(1). https://doi.org/10.1186/s44147-026-01313-y", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Journal of Engineering and Applied Science掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "水辺の再開発が、都市のデザインとして、社会的孤立を防ぐ社会的インフラになりうるかを、パースのElizabeth Quayの事例で調べた。", "p3": "10回の現地訪問と7か所の観察点にもとづく定量的な観察と空間分析で、官民の連携・複合利用・歩きやすさ・文化プログラム・パブリックアート・緑と青のインフラ・世代間の活動などの設計・計画の特徴が、社会的な交流の機会をどう形づくるかを調べた。", "p5": "これらの要素は、社会的結束・安全感・より包摂的な公共生活に寄与しうる。成功した公共空間は、見た目の質だけでなく、移動・遊び・身体活動・非公式な交流の機会を支える力で決まる。観察した空間・行動のパターンと、より広い社会的な成果は区別して扱う（抄録）。", "fun": "広場や水辺は「きれい」なだけではなく、人が偶然出会い、何度も来たくなる仕掛けがあるかどうかで、孤立を防ぐ「予防の社会インフラ」になる、という見方が面白い。10回の観察という小さな調査でも、設計のどの要素が効くかを具体的に挙げている。", "unverified": "本文を入手できず、観察の指標の定義・数値は未確認。1つの場所の事例研究で、因果は示せない。"}}, {"id": "jr39", "rank": 39, "headline": "生成AIの性格を測る：LLMの性格の安定性と信頼性", "title": "Personality without a person: measuring personality in generative AI", "url": "https://doi.org/10.3389/fcomp.2026.1940035", "authors": "Jason L. Harman ほか", "venue": "Frontiers in Computer Science", "date": "2026-11-10", "citescore": 6.2, "citescore_year": "2025", "apa": "Harman, J. L., Scheuerman, J., & Loganathan, N. R. K. (2026). Personality without a person: measuring personality in generative AI. Frontiers in Computer Science, 8. https://doi.org/10.3389/fcomp.2026.1940035", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Frontiers in Computer Science掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "LLMが、そのままでも性格を持つといえるかを、自己報告と新しいゲーム形式の行動測定で調べ、高い再検査信頼性を示した。", "p3": "4つのLLMを、既定の条件と3つのプロンプトによる人格設定（ペルソナ）の条件で、自己報告と新しいゲーム形式の行動による性格の測定で評価した。", "p5": "従来の研究に反して、LLMは非常に高い再検査信頼性を示した。性格の得点はペルソナの指示に応じて予想どおりに変わり、測定の種類どうしの一致はモデルとペルソナの条件で変わった（抄録）。", "fun": "「AIに性格はあるのか」という問いを、人に使う性格検査をそのまま当てて確かめている。同じ質問を何度しても同じ答えが返る（再検査信頼性が高い）という点では、人より「ぶれない」かもしれないのが面白い。", "unverified": "本文を入手できず、4つのLLMの名前・信頼性の数値・測定の種類どうしの一致の度合いは未確認。"}}, {"id": "jr40", "rank": 40, "headline": "マルチエージェントLLMで都市排水モデルを較正", "title": "Call my agents – multi-agent LLM-based calibration of urban drainage models: performance and reliability across model scales", "url": "https://doi.org/10.2166/wst.2026.365", "authors": "Katharina Teuber", "venue": "Water Science & Technology", "date": "2026-11-11", "citescore": 6.1, "citescore_year": "2025", "apa": "Teuber, K. (2026). Call my agents – multi-agent LLM-based calibration of urban drainage models: performance and reliability across model scales. Water Science & Technology. https://doi.org/10.2166/wst.2026.365", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Water Science & Technology掲載。図の要旨の文章を含む）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "監督役と3つの専門のエージェントのLLMで、都市の排水モデルの較正を行う、ローカルに配置できる枠組みを示した。", "p3": "監督エージェントの下に、モデル・較正・分析の3つの専門エージェントを置き、モデルの準備・較正・評価の作業を自律的に実行させる、ローカルに配置できるマルチエージェントLLMの枠組みを評価した。", "p5": "図の要旨では、12時間の流出ハイドログラフで観測と最良のシミュレーションがNSE = 0.97で、パラメータの不確実性の帯はNSE > 0.50。性能は自動較正（NSE ≈ 0.97〜0.98）に匹敵するが、モデルの大きさに強く依存する。大きいLLMは高精度だが計算費用が大きく、小さいLLMは速いが不安定とまとめる（図の要旨）。", "fun": "水の流れのシミュレーションの「つまみ調整」は、専門知識と手間が要る作業だったが、役割分担したAIのチームに任せると、自動の方法に並ぶ精度になる、という点が面白い。大きなAIは正確だが重く、小さなAIは速いが不安定、というトレードオフも示している。", "unverified": "本文を入手できず、取得した抄録は図の要旨の文章が中心で、使った具体的なモデルや実験の数値の裏づけは確認できなかった。"}}, {"id": "jr41", "rank": 41, "headline": "公共部門でのLLM導入の証拠地図", "title": "Mapping the Ecosystem of Large Language Models’ Implementation in the Public Sector: A Systematic Evidence Map", "url": "https://doi.org/10.3390/ai7110471", "authors": "Liah Shonhe ほか", "venue": "AI", "date": "2026-11-10", "citescore": 7.3, "citescore_year": "2025", "apa": "Shonhe, L., Svärd, P., Shabou, B. M., Nicolet, A., Chaterera-Zambuko, F., Kabata, V., Masuku, M., Mutsagondo, S., & Bade, A. O. (2026). Mapping the Ecosystem of Large Language Models’ Implementation in the Public Sector: A Systematic Evidence Map. Ai, 7(11), 471. https://doi.org/10.3390/ai7110471", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（AI誌掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "公共部門でのLLMの導入に関する26件の研究を整理し、用途・構成・ガバナンス・阻害要因の4つの主題と、段階的な導入の枠組みを示した。", "p3": "PRISMAに沿って学術データベースから26件の研究を選び、質的な統合の主題分析と、傾向をみる記述統計で分析した。", "p5": "4つの主題（政府の機能にわたる応用、導入を支える構成、実装を形づくるガバナンスの仕組み、採用を妨げる課題）が出た。研究は市民向けと政策の分野に集中し、運用面は手薄。分野は探索段階で、一般のGenAI/LLMの研究が多い。主権と公平への懸念は、動機としては少ないが、実践では障壁として繰り返し現れる。構成が複雑なほど採用が少ない（抄録）。", "fun": "役所でAIを使う研究の多くは、「正確さ」の課題に関心が向くが、「国の主権」や「公平さ」の心配は、最初の動機には少ないのに、実際に導入しようとすると障壁として出てくる、という食い違いが面白い。複雑な仕組みほど広まらない、という現実も見える。", "unverified": "本文を入手できず、26件の内訳と、提案された段階的な枠組みの中身は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "LLMの幻覚と相関する変数を回帰で調べる", "title": "Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective", "url": "https://doi.org/10.1162/coli.a.665", "authors": "Vicente Ivan Sanchez Carmona ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Carmona, V. I. S., Jiang, S., & Dong, B. (2026). Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective. Computational Linguistics, 1–12. https://doi.org/10.1162/coli.a.665", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Computational Linguistics）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "LLMの幻覚と相関する変数を、30のLLMと15の変数で回帰分析し、幻覚が従来の想定より複雑であることを示した。", "p3": "9つの幻覚データセットの質問を使い、30のLLMについて15の変数と幻覚の関連を調べた。", "p5": "7つの変数が幻覚と関連した。最も重要な発見は、一部の変数がLLMをまたいで系統的な効果を持つだけでなく、LLMや入力の質問ごとに異なる効果や、2変数の交互作用も持つことで、幻覚の生まれ方は複雑な姿になる（抄録）。", "fun": "AIの「もっともらしい嘘」（幻覚）は、1つの原因で決まるわけではなく、質問の性質・モデルの種類・その組み合わせで、効き方が変わる、という点が面白い。30個ものAIを横並びに調べて、「どんな条件で嘘をつきやすいか」を統計で見つけようとしている。", "unverified": "本文を入手できず、7つの変数の名前・効果の大きさ・交互作用の中身は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "パドヴァとヴェネツィアの製造業の空間と循環型の都市代謝", "title": "Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy", "url": "https://doi.org/10.1177/00420980261499471", "authors": "Claudia Faraone ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Faraone, C., Gambarotto, F., Nicoletto, L., & Pedrini, G. (2026). Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy. Urban Studies. https://doi.org/10.1177/00420980261499471", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Urban Studies）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "イタリアのパドヴァとヴェネツィアの製造業の空間分布が、循環型の都市の代謝にどう結びつくかと、計画政策がそれを助けるか妨げるかを調べた。", "p3": "形態・空間分析、都市計画の評価、労働と廃棄物の定量データを組み合わせた混合法で、「トランセクト」の尺度の製造業の空間分布の最近の動きを調べた。", "p5": "技術的な製造業は、技術的なスキルとグリーン・ジョブに支えられ、廃棄物の予防と再生で循環の成果を押し上げる。産業の多様化と企業の関連性は、共生的な物質の流れを促す。ただし両市とも、新しい循環の動きと既存のゾーニングの不整合が続き、計画の戦略は断片的で受け身（抄録）。", "fun": "ごみを減らす「循環型」の街づくりは、リサイクル工場を作るだけでなく、どんな技能を持つ人がどこにいて、どんな工場が近くに集まっているか、という「街の形」と深く関わる、という点が面白い。街の土地利用のルールが、実は新しい産業の動きに追いついていない。", "unverified": "本文を入手できず、データの出典・「トランセクト」の定義・定量分析の数値は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "OECDの緑・デジタル化とPM2.5の分布的関係", "title": "SDG 11‐Aligned Sustainable Cities Under Environmental Pressure: Distributional Evidence on Green, Digital and Policy Transitions in OECD Countries", "url": "https://doi.org/10.1002/sd.71922", "authors": "Busra Agan Celik", "venue": "Sustainable Development", "date": "2026-11-11", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "apa": "Celik, B. A. (2026). SDG 11‐Aligned Sustainable Cities Under Environmental Pressure: Distributional Evidence on Green, Digital and Policy Transitions in OECD Countries. Sustainable Development. https://doi.org/10.1002/sd.71922", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Sustainable Development）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "OECD30か国で、緑の技術・再生可能エネルギー・デジタル化・環境政策がPM2.5の濃度と、分布の位置によって違う関連を持つことを示した。", "p3": "2000〜2023年の30のOECD諸国で、国の固定効果つきのモーメント法分位点回帰（MMQR）を使い、Driscoll–Kraay標準誤差の二元固定効果と、Dumitrescu–Hurlinのパネルのグレンジャー因果性検定で補った。", "p5": "再生可能エネルギーの消費は、すべての条件つき汚染の分位で一貫して有意な負の関連を示し、デジタル化は主に高い分位で負の関連。特許による緑の技術の普及と環境政策の厳しさは、分布の異なる部分で正の関連を示した。所得とガバナンスの効果には分位ごとの有意な関連がない。一部の関連は、モデルの設定で変わる（抄録）。", "fun": "「環境政策を強めれば空気はきれいになる」と単純に言えず、汚染の程度が軽い国と重い国で、効き方が違って見える、という点が面白い。平均だけでなく、分布のいろいろな位置を見るのが、この分位点回帰の工夫になる。", "unverified": "本文を入手できず、係数の大きさと頑健性の検討の詳細は未確認。観察データの関連で、因果は示せないと著者も述べている。"}}, {"id": "jr45", "rank": 45, "headline": "スマートシティの包摂的イノベーションの概念の断片を整理", "title": "Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps", "url": "https://doi.org/10.3389/frsc.2026.1983822", "authors": "Seyedeh Sedigheh Ghorashi ほか", "venue": "Frontiers in Sustainable Cities", "date": "2026-11-09", "citescore": 5.1, "citescore_year": "2025", "apa": "Ghorashi, S. S., Karvonen, A., Mobini Dehkordi, A., & Yadollahi Farsi, J. (2026). Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps. Frontiers in Sustainable Cities, 8. https://doi.org/10.3389/frsc.2026.1983822", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Frontiers in Sustainable Cities掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "スマートシティでの「包摂的イノベーション」の概念が断片的に使われていることを、116件の文献レビューで整理した。", "p3": "ScopusとWeb of Scienceの116件の査読済み論文を、PRISMAに沿って選び、VOSviewerによる共起語の書誌分析と、アブダクション的な主題の統合を組み合わせた。", "p5": "5つの主題の群（スマートガバナンスと市民参加、デジタル包摂とインフラ、公平・正義と社会的イノベーション、環境の持続可能性とレジリエンス、知識の共同生産とアーバン・イノベーション・ラボ）を見いだした。包摂的イノベーションは、技術へのアクセスを超えて、市民の主体性・分配的・手続き的な正義・参加型の知識生産へ広がる多次元の構成概念で、力の非対称性・交差的な排除・草の根とグローバル・サウスのイノベーションなどで断片化が続く（抄録）。", "fun": "「スマートシティ」は便利なだけでなく、誰が置き去りにされるか、誰が決めるか、という公平さの問題でもある、という見方が面白い。「包摂」という言葉が、機器を使えるかだけでなく、市民が声を上げる力まで含む幅広い概念として整理されている。", "unverified": "本文を入手できず、5つの群の論文の件数・各主題の詳しい内容は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "ハイデラバードの都市土地価値を成長分析で可視化", "title": "Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India", "url": "https://doi.org/10.1061/jupddm.upeng-6450", "authors": "D. Shivaram Reddy ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-11", "citescore": 3.9, "citescore_year": "2025", "apa": "Shivaram Reddy, D., & Onkar, P. S. (2027). Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India. Journal of Urban Planning and Development, 153(1). https://doi.org/10.1061/jupddm.upeng-6450", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Journal of Urban Planning and Development掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "インドのハイデラバード都市圏で、都市の物理的な成長の型と土地の価値の関係を、空間データの可視化で調べた。", "p3": "都市の物理的な成長のパターンを、土地の需要が高い地域と結びつけ、成長の変化と土地価値を技術的に関連づけて、空間データの可視化で分析した。", "p5": "未確認（抄録に具体的な結果・数値の記載がない）。", "fun": "地図の上で、街が広がる方向と土地の値段の高い場所を重ねて見ると、街がどこへ向かって伸びているかが見えてくる、という点が面白い。土地は限られた資源なので、どこが今後値上がりしそうかを、地図で示そうとしている。", "unverified": "本文を入手できず、使ったデータ・可視化の方法・結果は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "オーストリアの農村・郊外の交通の不利益とケア労働", "title": "Transport disadvantage and care work: An exploratory study of gendered mobility patterns and acceptability of sustainable transport alternatives in rural and peri-urban Austria", "url": "https://doi.org/10.1016/j.urbmob.2026.100314", "authors": "Linda Dörrzapf ほか", "venue": "Journal of Urban Mobility", "date": "2026-11-10", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "apa": "Dörrzapf, L., Fleischmann, C., Gabriel, V., & Stark, M. (2026). Transport disadvantage and care work: An exploratory study of gendered mobility patterns and acceptability of sustainable transport alternatives in rural and peri-urban Austria. Journal of Urban Mobility, 10, 100314. https://doi.org/10.1016/j.urbmob.2026.100314", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できなかった（Journal of Urban Mobility掲載）", "preprint": false, "short": true, "p1": "オーストリアの農村・郊外で、交通の不利益とケア労働、性別による移動の型、持続可能な交通の代替手段の受け入れやすさを探索的に調べた論文（題名による）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さだけを書く。家事や介護などのケアの仕事を多く担う人ほど、細かく寄り道する移動が必要になり、車のない暮らしが難しくなる、という問いが面白い。交通の不便が、ケアの負担と性別の差にどう結びつくかを探る。", "unverified": "抄録・本文を入手できず、調査の方法・標本・結果はすべて未確認。"}}, {"id": "jr48", "rank": 48, "headline": "SNSの職場利用がJD-Rと仕事・生活の境界をどう変えるか", "title": "Job Demands‐Resources, Well‐Being and Work‐Life Boundaries: The Pervasiveness of Social Networking Platforms", "url": "https://doi.org/10.1111/1748-8583.70074", "authors": "Severina Cartwright ほか", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "Cartwright, S., Hughes, E., Davies, I., & Harris, L. C. (2026). Job Demands‐Resources, Well‐Being and Work‐Life Boundaries: The Pervasiveness of Social Networking Platforms. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70074", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Top10%誌（Human Resource Management Journal）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "仕事のSNS利用が、仕事の要求度・資源・仕事と生活の境界・幸福感にどう影響するかを、JD-Rと境界理論を統合して調べた。", "p3": "管理職67人への質的なインタビューにもとづき、仕事の要求度-資源理論と境界理論を統合した。", "p5": "仕事のSNSの文脈で、仕事と生活の境界のあいまい化が3つの次元（職業的-私的、アクセスできる-できない、統制-自律）で生じることを示した。SNSの慣行・幸福の方針・非公式な文化的規範をそろえる実務的な提言も導いた（抄録）。", "fun": "仕事の連絡がSNSに入り込むと、「会社の人」と「私の友だち」が同じ画面に並び、いつでも連絡がつく状態が当たり前になる。この研究は、その境目のあいまいさを、「公私」「いつでも連絡できるか」「自分で決められるか」の3つの軸で整理している点が面白い。", "unverified": "本文を入手できず、インタビューの引用・標本の特徴は未確認。管理職67人の質的研究で、一般化はできない。"}}, {"id": "jr49", "rank": 49, "headline": "AI導入と従業員の幸福感・業績：3波の時間差調査", "title": "AI Adoption, Employee Well-being and Job Performance", "url": "https://doi.org/10.68379/sbzf3x83", "authors": "Mehreen Aslam", "venue": "Dyal Singh Journal of Humanities & Social Sciences", "date": "2026-11-11", "apa": "Aslam, M. (2026). AI Adoption, Employee Well-being and Job Performance. Dyal Singh Journal of Humanities & Social Sciences, 4(1), 117–149. https://doi.org/10.68379/sbzf3x83", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Dyal Singh Journal of Humanities & Social Sciences掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "AI導入と業績の関連を、幸福感が媒介し、AI不安が調整するかを検証したが、提案した媒介・調整は支持されなかった。", "p3": "JD-RとCORにもとづき、従業員の報告と上司評価の業績を組み合わせた、3波の時間差のある調査（N = 400の完全に対応するケース）を、回帰・ブートストラップの条件つき間接効果・確認的因子分析で分析した。", "p5": "幸福感は後の業績と正に関連した（b = 0.24）。AI導入は平均的な不安のもとで、幸福感との調整後の有意な関連を示さず（b = 0.03、p = .50）、条件つき間接効果も交互作用も有意でなかった。AI導入は業績と直接に正の関連（b = 0.23）で、AI不安は幸福感と業績の両方と負の関連だった。AI不安の4次元は標本で分離できなかった（抄録）。", "fun": "「AIを入れると社員が元気になって成績が上がる」という筋書きは、データでは確かめられず、AI導入は成績に直接つながり、AI不安は元気も成績も下げる、という別々の効果が出た。仮説が外れた結果を正直に報告している点も面白い。", "unverified": "本文を入手できず、非線形（逆U字）の探索の詳細と測定の項目は未確認。観察のデザインで因果は示せない。"}}, {"id": "jr50", "rank": 50, "headline": "活動基準原価計算で製造原価の算定の正確さを高められるか", "title": "Analysis of The Implementation of Activity-Based Costing (ABC) In Improving The Accuracy of Cost of Goods Sold Calculations In Manufacturing Companies", "url": "https://doi.org/10.60023/g2tp6429", "authors": "Ardin Dolok Saribu ほか", "venue": "Jurnal Ilmiah Ekonomi, Manajemen dan Bisnis", "date": "2026-11-09", "apa": "Saribu, A. D., Panjaitan, U., Situmorang, N. S. R., Hura, E., Nainggolan, M., Hutahaean, C., & Sigalingging, Y. O. (2026). Analysis of The Implementation of Activity-Based Costing (ABC) In Improving The Accuracy of Cost of Goods Sold Calculations In Manufacturing Companies. Jurnal Ilmiah Ekonomi Manajemen & Bisnis, 3(4), 210–221. https://doi.org/10.60023/g2tp6429", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Jurnal Ilmiah Ekonomi, Manajemen dan Bisnis掲載）を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "活動基準原価計算（ABC）が、従来の方法より製造原価を正確に求められるかを、中規模の製造企業の事例で調べた。", "p3": "記述的な質的研究で、中規模の製造企業の事例をインタビュー・観察・資料・研究対象の経験で調べ、生産の活動を特定して原価の配賦基準を決めた。", "p5": "ABCは従来より正確なデータを提供し、企業の原価管理の有効性と経営の意思決定の改善に役立った（抄録）。具体的な数値は抄録にない。", "fun": "製品の原価を、機械の稼働時間などの1つの基準だけで割ると、手間のかかる製品と、そうでない製品の差が見えなくなる。ABCは「どんな作業にどれだけ資源を使ったか」で原価を割り振り、本当のコストを見えやすくする、という考え方が分かる事例になっている。", "unverified": "本文を入手できず、企業・製品の数字と、従来の方法との数値の比較は未確認。1社の質的な事例で、一般化はできない。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "脆弱な保険会社の破綻が住宅ローンの延滞を増やす", "title": "When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets", "url": "https://doi.org/10.1093/qje/qjag053", "authors": "Parinitha Sastry ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-07", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Sastry, P., Sen, I., & Tenekedjieva, A.-M. (2026). When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag053", "why": "気候リスクの住宅ローンと損害保険での過小評価が、納税者の大きな負担と危険地域への過剰な信用供給を生むことを、複数の自然実験で示した。政府支援企業（GSE）の保険会社の評価方針が過小評価の主因で、フロリダ州の新規データで、資本不足の保険会社の破綻が災害後の住宅ローンの延滞を因果的に増やす。GSEの期待損失の約25%が保険の脆弱性による。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "住宅ローンと損害保険での気候リスクの誤った価格付けが、納税者の大きな負担と、危険な地域への過剰な信用の流れを生むことを、複数の自然実験で示した（抄録）。", "p2": "中心の発見は、政府支援企業（GSE）が保険会社を評価する方針が、この誤った価格付けの重要な源になっていること（抄録）。", "p3": "フロリダの2009〜2018年の、住宅ローンと保険の包括的な新データを作る。資本が小さく分散も乏しい新しい保険会社が市場を占め、その倒産が自然災害後のローンの債務不履行を因果的に増やすことを示す。GSEは第三者の格付けに頼り、倒産リスクの高い保険会社の保険を、価格に反映せず受け入れる（抄録）。", "p4": "対象はフロリダの2009〜2018年。貸し手が保有するジャンボローンと、GSEに売る適合ローンで、拒否率が保険の質にどれだけ敏感かを比べる（抄録）。", "p5": "GSEの期待損失の推定の25%が、保険の脆弱性から来る。民間の貸し手は戦略的に反応し、ジャンボでは拒否率が保険の質に敏感だが、GSEに売る適合ローンでは敏感でない。貸し手がジャンボと同じように保険の脆弱性を審査していれば、他の条件が同じなら、適合ローンの組成は減っていた（抄録）。", "p6": "対象はフロリダの2009〜2018年に限る（抄録）。他の州や時期への一般性は、抄録から分からない。", "fun": "自分でリスクを持つジャンボローンでは保険会社の質を見て拒否するのに、GSEに売る適合ローンでは見ない、という貸し手の使い分けが面白い。誰がリスクを負うかで審査が変わることを、はっきり示している（抄録）。", "unverified": "本文を読んでいないため、自然実験の具体的な設計、データの出所、25%の推定の前提と信頼区間は確認できていない。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "誤った信念が直らないのは注意の向け方による", "title": "Channeled Attention and Stable Errors", "url": "https://doi.org/10.1093/qje/qjag055", "authors": "Tristan Gagnon-Bartsch ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-09", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Gagnon-Bartsch, T., Rabin, M., & Schwartzstein, J. (2026). Channeled Attention and Stable Errors. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag055", "why": "データが豊富で学習の機会が繰り返しあっても人が誤った信念を保つ理由を、誤っているかもしれない自分のモデルを通して注意を向けるという枠組みで説明した。変数が効かない・区別がないと誤って排除するモデルは、反証となるデータから注意をそらすため安定しやすい。どの誤りが見つかるかは意思決定の構造に依存し、害の大きさとは緊密に結びつかない。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "人々が、高い賭け金・豊富なデータ・繰り返しの学習機会があっても誤った信念を持ち続ける理由を、注意に基づく枠組みで説明する（抄録）。", "p2": "標準的な議論では、そうした状況で人は誤りを正すはずだが、現実には誤りが続く（抄録）。", "p3": "人は、誤って指定されたかもしれない自分のモデルのレンズを通して注意を向けるため、データに触れることと、モデルが誤りだと分かる統計量を追うことは同じでない。長期的に、人が関連すると考えるデータがモデルを不自然に見せないとき、モデルは注意的に安定とする（抄録）。", "p4": "理論の枠組みの分析。心理的な偏りと経験的な誤解の安定性、新しい目が誤りを見つける理由、粗すぎる分類が選ばれる理由、他人の誤りは見えるのに自分の誤りは見えない理由に、枠組みを適用する（抄録）。", "p5": "誤って「関係ない」「区別がない」と排除するモデルは、反証するデータから注意をそらすため、安定しやすく、誤って含めるモデルは安定しにくい。誤りが見つかるかは意思決定問題の構造に依存し、害の大きさとは強く結びつかない。ただし、決定環境の変化と注意を広げる衝撃の両方に頑健な誤りはなく、どの誤りも、いずれかの摂動で露呈する（抄録）。", "p6": "実証による検証は、抄録に書かれていない。解釈：理論の予測であり、どの偏りが実際に注意的に安定かは、別の実証が要る。", "fun": "「関係ない」と思い込む誤りは、その誤りを暴くデータから目を逸らさせるため、自分で守られる。しかも、大損する誤りが残り、安上がりな誤りが見つかることもあり、誤りが続くかは害の大きさと強く結びつかない（抄録）。", "unverified": "本文を読んでいないため、形式的な定義、定理、例の中身、実証との接続は確認できていない。"}}, {"id": "jn03", "rank": 3, "field": "因果推論", "headline": "エボラの恐怖で黒人申請者の住宅ローン拒否率が3.8ポイント上昇", "title": "Deadly Disease, Fear, and Ostracism in the Credit Market", "url": "https://doi.org/10.1287/mnsc.2025.01919", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Agarwal, S., Lin, P., Lin, Y., Lu, R., & Zhang, X. (2026). Deadly Disease, Fear, and Ostracism in the Credit Market. Management Science. https://doi.org/10.1287/mnsc.2025.01919", "why": "2014年の米国のエボラ流行を自然実験として、恐怖が住宅ローンの与信を歪めるかを調べた。感染リスクはほぼないのに、流行中の黒人申請者の拒否率が3.8ポイント上がった。承認された黒人の借り手は信用状態が良く延滞が少ないが、延滞時の条件変更を受けにくい。FinTechのアルゴリズム融資ではこの影響がなく、流行後に素早く戻り、統計的差別とは合わない。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "2014年の米国のエボラ流行を自然実験として、恐怖が住宅ローンの与信配分をどうゆがめるかを調べた（抄録）。", "p2": "感染リスクはごくわずかだったのに、恐怖が与信をゆがめたかを調べる。観察されるパターンは、統計的差別と合わない（抄録）。", "p3": "流行中の黒人の申請者の住宅ローン拒否率の変化を測り、承認された借り手の信用の質・債務不履行率・条件変更の受けやすさを比べる。アルゴリズム主導のフィンテックの貸し出しや、流行後の戻りの速さも見る。政治周期・労働市場への影響・申請者の構成の変化・銀行の財務状態は、頑健性検定で除く（抄録）。", "p4": "対象は2014年の米国のエボラ流行と、住宅ローンの申請。診断的期待の理論に沿って、COVID-19の期間に学習効果があったかも調べる（抄録）。", "p5": "流行中に、黒人の申請者のローン拒否率が3.8パーセントポイント上がった。承認された黒人の借り手は、信用の質が高く債務不履行率も低いのに、延滞時に条件変更を受けにくい。これらの効果はアルゴリズム主導のフィンテックにはなく、流行後に速く戻る。エボラの恐怖への曝露が高くても、COVID-19の期間に有意な学習効果は見られない（抄録）。", "p6": "代替説明は頑健性検定で除くと述べる（抄録）。恐怖の曝露の測り方と、差別の意図の有無は、抄録から分からない。", "fun": "感染のリスクがほとんどない相手に、恐怖が拒否率を3.8パーセントポイント押し上げ、承認された黒人の借り手の方が信用の質が高い、という結果が重い。アルゴリズムには起きず、流行後に速く戻る点が、統計的差別と合わない（抄録）。", "unverified": "本文を読んでいないため、恐怖の曝露の測り方、標本の大きさ、各検定の数値、COVID-19の期間の検定の詳細は確認できていない。"}}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "リスクと信念の個人差を同時に測り意思決定を推定", "title": "Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty", "url": "https://doi.org/10.1287/mnsc.2024.06232", "authors": "Adeline Delavande ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Delavande, A., Ganguli, J., & Mengel, F. (2026). Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty. Management Science. https://doi.org/10.1287/mnsc.2024.06232", "why": "一般の人を対象に、リスクとあいまいさへの態度（個人別の確率加重と損失回避）と、意思決定に関わる事象の主観的確率を集める調査実験を行った。態度も信念も非常に異質で、プロスペクト理論に情報源依存の確率加重を組み合わせたモデルが、主観的期待効用より当てはまりが良い、または同等だった。信念が極端な値に集中するときに特によく当てはまる。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "不確実性への態度と主観的な信念について、新しい調査実験のデータを集め、不確実性下の意思決定の構造モデルを推定した（抄録）。", "p2": "リスクと曖昧さへの個人の態度と、決定に関わる事象の確率的な信念を、同じ個人で同時に得ることで、パラメータの異質性と相互相関を調べ、主観的期待効用を超える構造モデルを推定できる（抄録）。", "p3": "個人ごとのリスクと曖昧さへの態度（確率加重と損失回避を含む）と、決定に関わる事象についての個人の確率的な信念を集める。主観的期待効用と、情報源に依存する確率加重を伴うプロスペクト理論を比べる（抄録）。", "p4": "対象は一般の人々で、健康と金融の決定に注目した調査実験（抄録）。", "p5": "選好も信念も大きく異質だった。主観的期待効用と比べ、情報源に依存する確率加重を伴うプロスペクト理論は、ある文脈ではデータにより良く当てはまり、他の文脈では同程度だった。信念の分布が極端な値に集中しているときに、プロスペクト理論はとくに良く当てはまる（抄録）。", "p6": "限界は抄録に書かれていない。標本の大きさと調査の国は、抄録から分からない。", "fun": "同じ人から、どれくらいリスクや曖昧さを嫌うかと、その事象がどれくらい起きると思うかの両方を聞くことで、選好と信念を切り分けて決定を説明できる点が面白い。信念が極端に偏るほど、プロスペクト理論が効く（抄録）。", "unverified": "本文を読んでいないため、標本の大きさと国、各モデルの当てはまりの数値、確率加重の関数形、健康と金融の具体的な事象は確認できていない。"}}, {"id": "jn05", "rank": 5, "field": "計算社会科学・ネットワーク科学", "headline": "150年のドイツ議会の移民討論をLLMで注釈し反連帯の増加を示す", "title": "LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade", "url": "https://doi.org/10.1162/coli.a.666", "authors": "Aida Kostikova ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Kostikova, A., Pütz, O., Eger, S., Sabelfeld, O., & Paassen, B. (2026). LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade. Computational Linguistics, 1–94. https://doi.org/10.1162/coli.a.666", "why": "ドイツの議会討論（1867〜2025年）の移民への連帯・反連帯を、理論に基づく注釈の枠組みでLLMに注釈させ、人間どうしの一致度に匹敵するマクロF1を得た。系統的な誤りが下流の結果を偏らせるため、ソフトラベルと設計ベースの教師あり学習（DSL）を組み合わせて長期の傾向の偏りを減らした。戦後の連帯の高さと、2015年以降の反連帯の顕著な増加を見いだした。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "ドイツ議会の150年以上の移民をめぐる議論に、大規模言語モデル（LLM）で連帯と反連帯の下位類型を注釈し、その妥当性と長期の傾向を調べた（抄録）。", "p2": "政治的な議論の大規模な分析は、従来は大量の手作業の注釈を要し、対象が限られた。LLMは拡張しやすい代替だが、注釈が妥当な下流の推論を支えるかが問われる（抄録）。", "p3": "理論に基づく注釈の枠組みで、複数のLLMを、モデルの大きさ・プロンプトの方法・微調整・歴史と現代のデータ・系統的な誤りの面から評価する。系統的な誤りが推定を偏らせるため、ソフトラベルの出力にデザインに基づく教師あり学習（DSL）を組み合わせ、長期の傾向の偏りを減らす（抄録）。", "p4": "対象は、帝国議会（1867–1933）、西ドイツ連邦議会（1949–1990）、再統一後の連邦議会（1990–2025）のコーパスで、とくに戦後（1949–1957）と現代（2009–2025）を詳しく分析する（抄録）。", "p5": "最も強いモデル（とくにGPT-5とgpt-oss-120B）のmacro-F1は人間どうしの一致に匹敵するが、系統的な誤りが下流の結果を偏らせうる。戦後は、集団に基づく共感的な形を中心に連帯が比較的高く、2015年以降に反連帯が著しく増えた（抄録）。", "p6": "LLMの出力は厳密な検証が必要で、系統的な誤りがあれば統計的な補正が要る、と結論する（抄録）。対象はドイツ議会の議論に限る。", "fun": "LLMは人間どうしの一致に並ぶ精度でも、間違い方に偏りがあると、長期の傾向が歪む。そこで、ソフトラベルとDSLで偏りを補正してから、戦後の連帯と2015年以降の反連帯を読む、という手順が面白い（抄録）。", "unverified": "本文を読んでいないため、macro-F1の数値、注釈の枠組みの類型、DSLの補正の大きさ、傾向の具体的な値は確認できていない。"}}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "プライバシー保護の下でのレコメンダ設計", "title": "Recommender Systems Under Privacy Protection", "url": "https://doi.org/10.1287/mnsc.2024.05007", "authors": "Can Küçükgül ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Küçükgül, C., Özer, Ö., & Wang, S. (2026). Recommender Systems Under Privacy Protection. Management Science. https://doi.org/10.1287/mnsc.2024.05007", "why": "利益を求めるプラットフォームが、プライバシー保護の制度の違いのもとでレコメンデーションの方針を設計する様子を分析した。オプトアウト保護と無保護が機能的に同等であることを示し、消費者が個人データを偽る自由があるとプラットフォームが推薦を歪め、双方に害が及びうる。推薦が製品への接近を制御する配分の役割を持つと、アルゴリズムによる差別で不利な少数派が機会を失いうる。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "利益を追う推薦プラットフォームが、プライバシー保護の制度に応じて推薦の方針をどう設計するかを、理論モデルで調べた（抄録）。", "p2": "オプトアウト型の保護と無保護が機能的に同値であることを示す。消費者が個人データを偽る自由を持つと、プラットフォームは推薦を歪めざるをえず、双方を損なう（抄録）。", "p3": "プライバシー保護の制度ごとに、プラットフォームの推薦方針の設計を比べる理論分析。推薦が純粋に情報を伝える場合と、商品へのアクセスを制御する配分の役割も持つ場合に分ける（抄録）。", "p4": "理論の分析で、内生的な利益率を許しても結果は頑健（抄録）。実データの分析は、抄録に書かれていない。", "p5": "推薦が純粋に情報を伝える場合、こうしたプライバシーの制御は、個人向けの推薦を完全に妨げうる。推薦が配分の役割も持つ場合は、アルゴリズムによる差別が生じ、不利な少数派が価値ある機会から排除される（抄録）。", "p6": "結果は内生的な利益率でも頑健と述べる（抄録）。実データでの検証と、モデルの仮定の現実性は、抄録から分からない。", "fun": "消費者に個人データを偽る自由を与える保護が、プラットフォームに推薦を歪めさせ、双方を損なう、という逆説が面白い。推薦が配分の役割を持つ場合には、アルゴリズムによる差別も生じる（抄録）。", "unverified": "本文を読んでいないため、モデルの設定、均衡の条件、定理の厳密な主張は確認できていない。実データでの検証は、抄録に書かれていない。"}}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "環境への取り組みが強い企業ほど決算説明会で語らない", "title": "CEO environmental communication, speech acts, and firm value", "url": "https://doi.org/10.1007/s11747-026-01221-w", "authors": "Hai-Anh Tran ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-11", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Tran, H.-A., Ludwig, S., Nguyen, B., Noble, C. H., & Grewal, D. (2026). CEO environmental communication, speech acts, and firm value. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01221-w", "why": "364社・1万4,523件の決算説明会の質疑で、環境への取り組みについてCEOが語る量とその意図（発話行為）を、MSCIの環境スコア・Compustat・微調整したDeBERTaで測った。取り組みが強い企業ほど語る量は少なく、語りが企業価値と正に関連するかは意図による。断定的・指示的な発話は正の関連を保ち、表出的・約束的な発話は負の関連を持つ。", "explain": {"basis": "本文", "basis_note": "出版社HTML版の本文（要旨、仮説H3、Preliminary study、Main studyのSample・Measures・Estimation、Results、Discussion冒頭、Limitations and further research）を読んだ。頑健性の検定と理論的・実務的含意の節、表は読んでいない", "preprint": false, "p1": "環境への取り組みが強い企業のCEOが、決算説明会の質疑でその取り組みをどれだけ語るか、語り方（意図）が企業価値とどう関係するかを調べた（要旨）。", "p2": "シグナリング理論は、CEOの発信が観察できる環境への取り組みを補い、情報の非対称性を減らすと予測する。取り組みの強い企業がより多く語るのか、それが企業価値にどう関わるかは不明だった（要旨）。", "p3": "MSCIの環境ピラースコア、Compustat、微調整したDeBERTaモデルを組み合わせ、質疑でのCEOの環境の発言の割合と、発言の意図（断定・指示・表出・約束の言語行為）を測る。1期遅れの環境スコアと企業の固定効果で推定する（Measures、Estimation）。", "p4": "2007〜2022年の364社、14,523件の企業・四半期の決算説明会の質疑。CEOの回答の文のうち環境の文は2.6%。企業価値は1期遅れの四半期のTotal Q（Sample、Measures）。", "p5": "環境への取り組みが強い企業ほど、質疑での環境の発言は少ない（β=-0.011、p=.029。スコア1点で約1.1%減）。環境の発言の割合は企業価値と正に関連する（β=0.001、p<.01。割合が1ポイント増えるとTotal Qが約0.1%高い）。意図別では、断定と指示は正、表出と約束は負に関連する（β=0.101、0.005、-0.006、-0.006）（Results）。", "p6": "断定と指示のp値は.059と.064で、5%水準では有意でない（Results）。操作変数（Lewbel型）の第一段階のFが10未満で弱い操作変数の可能性があり、発言の係数の推定値は固定効果0.001、Lewbel 0.005、仲間の操作変数0.070とばらつく。強い因果の結論は避けている（Limitations）。", "fun": "環境に熱心な会社ほど、質疑で環境を語らない、という逆の関係が面白い。論文は、実績が観察できれば語る必要が小さいのかもしれない、と推測する（Limitations）。語るなら、断定と指示は企業価値と正、感情の表出と約束は負に関連した（Results）。", "unverified": "表4〜表8の数値、頑健性の検定、理論的・実務的含意の節は読んでいない。因果の識別は弱く、結果は関連にとどまる。"}}, {"id": "jn08", "rank": 8, "field": "人口学", "headline": "共同の土地登記は夫婦の絆と協力の力を強める", "title": "Joint Land Titling and the Marital Bond in Southwestern Uganda", "url": "https://doi.org/10.1111/padr.70103", "authors": "Michelle Poulin ほか", "venue": "Population and Development Review", "date": "2026-11-11", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "apa": "Poulin, M., & Pierotti, R. S. (2026). Joint Land Titling and the Marital Bond in Southwestern Uganda. Population and Development Review. https://doi.org/10.1111/padr.70103", "why": "ウガンダ南西部の無作為化介入で全額補助の土地登記を提供したところ、多くの夫が妻の名を登記に加えた。民族誌的な手法で、共同の登記が女性の交渉力を高めるだけでなく、夫の婚姻へのコミットメントの象徴となり、婚姻の絆を強めて夫婦の協力的な力を促す経路を見いだした。数値の結果に質的な探究を組み合わせて意味を探る。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "ウガンダ南西部で、土地の権原を夫婦の共有名義にすることが、夫婦にとって実際に何を意味し、女性が意図どおり利益を得るかを、エスノグラフィー的な方法で調べた（抄録）。", "p2": "無作為化の介入で、農家に土地の権原を全額補助して提供すると、夫の多数が妻の名前を権原に加えた。アフリカでは土地の所有に性別の非対称が根強いため、この結果は目を引く。その背景にある社会的な動きを調べる（抄録）。", "p3": "現地での観察、選ばれた夫婦への会話形式のインタビュー、地域の指導者へのインタビューを使う。数値の結果にエスノグラフィー的な方法を当てる（抄録）。", "p4": "対象はウガンダ南西部の農家の夫婦で、質的な調査（抄録）。", "p5": "女性の夫婦間の交渉力が高まり、世帯内の交渉モデルと整合する。さらに、共有名義は夫の配偶者と結婚への関与を象徴する、という経路を確認した。婚姻が不安定だと女性の財産権は脅かされるため、この象徴性は重要。共有名義は、交渉力の強化だけでなく、結婚への投資を促す強い婚姻の絆（論文が協力的な力と呼ぶもの）も生む（抄録）。", "p6": "質的な調査で、選ばれた夫婦に限る。一般化の範囲と効果の大きさは、抄録に書かれていない。", "fun": "権原の共有名義は、財産の権利の書き換えであるだけでなく、夫がこの結婚に本気だという象徴にもなる、という指摘が面白い。数字の結果の裏にある意味を、質的な調査で掘る点も特徴だ（抄録）。", "unverified": "本文を読んでいないため、調べた夫婦の数、選び方、インタビューの具体的な語り、無作為化の介入との対応は確認できていない。"}}, {"id": "jn09", "rank": 9, "field": "気候科学", "headline": "農業・林業・土地利用の削減なしでは1.5℃は実現しない", "title": "Cost-effective climate change mitigation through land sector contributions", "url": "https://doi.org/10.1038/s41893-026-01977-7", "authors": "Leon Merfort ほか", "venue": "Nature Sustainability", "date": "2026-11-11", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "apa": "Merfort, L., Popp, A., Bauer, N., Humpenöder, F., Abrahão, G., Bodirsky, B. L., Chen, D. M.-C., Köhler-Schindler, L., Luderer, G., Mandaroux, R., Merfort, A., Strefler, J., & Kriegler, E. (2026). Cost-effective climate change mitigation through land sector contributions. Nature Sustainability. https://doi.org/10.1038/s41893-026-01977-7", "why": "統合評価モデルREMIND–MAgPIEで、農業・林業・その他の土地利用（AFOLU）の緩和政策の組み合わせ別に将来の経路を導いた。AFOLUの貢献がなければ21世紀中の1.5℃は達成できず、ピークを1.7℃未満に抑える消費損失は現行政策比で1.3%から3.5%に増える。バイオエネルギーを年100EJに限り、CH4とN2Oの価格を1トンCO2換算で75ドルに抑えるなどの政策で、食料価格の上昇などの圧力を和らげられる。", "explain": {"basis": "本文", "basis_note": "出版社HTML版の本文（要旨、Main、Varying AFOLU contributions、Varying policy ambition、Increased economic losses、Single option contributions、Trade-offs、Discussion）を読んだ。Methodsと補足資料は読んでいない", "preprint": false, "p1": "農業・林業・その他土地利用（AFOLU）部門が気候緩和に寄与しない場合の、エネルギー部門の転換と気候目標の達成可能性への影響を、統合評価モデルREMIND–MAgPIEで調べた（要旨、Main）。", "p2": "AFOLUの緩和は持続可能性のリスクが大きく、実施も難しい。しかし、その可能性を逃した場合の、エネルギー部門の転換と気候目標の達成可能性への影響は、よく分かっていなかった（要旨、Main）。", "p3": "バイオエネルギー、生態系の保護と回復、農業の非CO2の緩和の三つの政策を組み合わせた12の政策ポートフォリオと、9本の温室効果ガス価格の経路で、計108のシナリオを作る。排出経路は簡易気候モデルMAGICCに渡して、気温の応答を得る（Varying AFOLU contributions、Varying policy ambition）。", "p4": "世界全体の統合評価モデルによる探索的なシナリオ分析。気候被害は含めず、緩和の費用だけを見る（Varying policy ambition、Discussion）。", "p5": "AFOLUの寄与がないと、21世紀内に1.5℃は達成できず、ピーク気温を1.7℃未満に抑える消費損失は、現行政策の基準比で1.3%から3.5%に増える（要旨）。1.7℃のとき、エネルギーの最終価格の上昇は、全AFOLU活用で46%、なしで103%（Trade-offs）。バイオエネルギーを100 EJ/年、CH4・N2Oの価格を1トンCO2換算75米ドルに抑えると、食料価格への圧力を抑えられる（要旨）。", "p6": "均衡モデルの様式化された価格で、市場の不完全性は含めず、食料の消費は外生的で価格に応じた代替がない。収量が研究開発投資で内生的に上がる前提は楽観的かもしれず、気候被害と、CDR技術の種類も限られる。バイオエネルギーが食料価格にほとんど影響しない結果は、他のモデルで検証が要る（Discussion）。", "fun": "土地の部門を使わないと、エネルギー部門だけで補うことになり、最終エネルギー価格が103%上がる。農業の非CO2に価格を付けると、エネルギー価格の上昇を最も抑える一方、食料価格への影響が最も大きい、という両面の関係が面白い（Trade-offs）。", "unverified": "Methodsと補足資料（モデルの詳細、各図の数値）は読んでいない。単一のモデルの結果で、複数モデルの比較は将来の課題と述べられている（Discussion）。"}}, {"id": "jn10", "rank": 10, "field": "計算社会科学・ネットワーク科学", "headline": "48のLLMが書く求人票で性別の偏りを監査", "title": "Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models", "url": "https://doi.org/10.1111/gwao.70291", "authors": "Jennifer M. Krebsbach ほか", "venue": "Gender, Work and Organization", "date": "2026-11-11", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Krebsbach, J. M., Lee, J. E., Zeck, S., Thakur, A., & Hilbert, M. (2026). Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models. Gender, Work & Organization. https://doi.org/10.1111/gwao.70291", "why": "48のLLMで、32の職種を女性的・男性的・中立の職名で作った4,608件の求人票を生成し、給与の差・比較評価・性役割の語りの型を測るアルゴリズム監査を行った。ホワイトカラーの職種では男性的な職名の求人票に高い給与が割り当てられたが、頑健ではなかった。簡単なプロンプトの修正で偏りの一部は減るが、職種に根ざした性別の型は残る。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "人事担当が職名だけから求人票を作らせる大規模言語モデル（LLM）で、性別を含む職名と中立な職名とで出力に違いが出るかを、48のLLMで監査した（抄録）。", "p2": "人事・事務の担当者は競合する業務が積み重なり、効率化のためにLLMで求人票を作ることがある。この慣行が、応募者の集団と採用結果に、性別の面でどう影響しうるかを調べる（抄録）。", "p3": "アルゴリズム監査。32の職種について、女性コード・男性コード・性別中立の三種の職名（firewoman、fireman、firefighterなど）を作り、計4608件の求人票を調べる。給与の差、マスクしない比較的な物語の評価、BSRIに基づく言説のパターンを測る（抄録）。", "p4": "対象は、48のLLMが作った求人票4608件（抄録）。", "p5": "ホワイトカラーの職名では、男性コードの求人票の給与が高かったが、すべての分析で頑健ではなかった。職種全体で、性別コードの職名から作った求人票は、性別中立の職名から作った対応する求人票より、LLMによる比較評価が高く、女性コードが最も高かった。最小限の最適化は評価を大きく下げ、最大限の最適化と同程度だったが、どちらも中立の職名から始めた場合の低い評価には届かなかった（抄録）。", "p6": "単純なプロンプトの修正は、測った性別の差をある程度和らげるが、完全には消せず、職業に沿った深い性別のパターンは消えない（抄録）。LLMによる評価の妥当性は、抄録から分からない。", "fun": "職名に性別を匂わせるだけで、LLMが書く求人票の評価が変わり、ホワイトカラーでは給与の差も出た（ただし頑健ではない）。プロンプトを工夫しても、中立の職名から始めたときの水準には届かない点が面白い。48ものLLMを同じ手続きで監査している点も特徴だ（抄録）。", "unverified": "本文を読んでいないため、48のLLMの内訳、給与差の大きさ、評価の基準、BSRIに基づく測定の詳細は確認できていない。"}}, {"id": "jn11", "rank": 11, "field": "計算社会科学・ネットワーク科学", "headline": "流行の話題への便乗は投稿の反応を120.8%増やす", "title": "EXPRESS: From Trends to Tweets: The Impact of Trendjacking on Consumer Engagement on Social Media", "url": "https://doi.org/10.1177/10949968261508771", "authors": "Fatemeh Vafaeesefat ほか", "venue": "Journal of Interactive Marketing", "date": "2026-11-11", "sjr": 3.125, "citescore": 12.1, "citescore_year": "2025", "apa": "Vafaeesefat, F., Mahmood, A., Chen, S., Moorhouse, M., & Rawal, S. M. (2026). EXPRESS: From Trends to Tweets: The Impact of Trendjacking on Consumer Engagement on Social Media. Journal of Interactive Marketing. https://doi.org/10.1177/10949968261508771", "why": "356社の66万件超の投稿（2018〜2022年）とXの話題データを組み合わせ、流行の話題への便乗（トレンドジャッキング）がエンゲージメントを120.8%高めることを示した。効果は投稿のタイミング・話題の種類・ブランドの個性で変わり、2つの統制実験でも一貫した証拠を得た。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "ブランドが話題のトレンドに便乗して投稿するトレンドジャッキングが、ソーシャルメディアでの消費者のエンゲージメントを高めるかを調べた（抄録）。", "p2": "トレンドジャッキングは広がっているが、効果の証拠は一貫しない（抄録）。", "p3": "2018〜2022年のフォーチュン誌掲載企業356社の66万件を超える投稿を、Xのトレンドトピックのデータと組み合わせ、エンゲージメントへの効果を推定する。効果が、タイミング・トレンドの種類・ブランドの性格で変わるかを見る。さらに、異なる製品カテゴリーで、投稿とトピックの特性を統制した二つの統制実験を行う（抄録）。", "p4": "データは、356社の66万件を超える投稿（2018〜2022年）とXのトレンド。実験は二つ（抄録）。", "p5": "トレンドジャッキングは、エンゲージメントを120.8%高める。効果は、トレンドがXの上位5位に初めて入った日とその翌日の投稿で最も高い。トレンドの種類ではポップカルチャーが最も効き、ブランドの性格では、刺激的なブランドはポップカルチャー、タフ（rugged）なブランドは政治のトレンドで効果が高い。二つの実験でも、エンゲージメントが増えるという一貫した証拠が得られた（抄録）。", "p6": "限界は抄録に書かれていない。解釈：観察データでは、便乗する投稿とそうでない投稿が系統的に違う可能性があり、投稿とトピックの特性を統制した実験で補っていると読める。", "fun": "トレンドに乗るとエンゲージメントが120.8%上がるが、効き方は、いつ乗るか、どの話題か、ブランドの性格で大きく変わる。刺激的なブランドはポップカルチャー、タフなブランドは政治、と相性が分かれる点が面白い（抄録）。", "unverified": "本文を読んでいないため、エンゲージメントの定義、120.8%の推定方法（比較の相手）、二つの実験の設計と効果の大きさは確認できていない。"}}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "変革的サービスが消費者の脆弱性を再生産する逆説", "title": "The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives", "url": "https://doi.org/10.1177/10946705261502647", "authors": "Shuai Qin ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Qin, S., & Chen, X. (2026). The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives. Journal of Service Research. https://doi.org/10.1177/10946705261502647", "why": "難民の起業を支援する変革的サービスが消費者の脆弱性を減らしながら害を再生産しうる逆説を、33の事業の管理者42人へのインタビューと3年のエスノグラフィで調べた。資源へのアクセスと利用の統制の組み合わせで3つのサービスモデルを分け、それぞれが特有の脆弱性の型を生みやすいことを示す。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "難民の起業を支援する変革的サービスの取り組み（TSI）が、消費者の脆弱性を減らすはずなのに同じ害を再生産する逆説を、サービスモデルと消費者の位置づけから説明した（抄録）。", "p2": "TSIは消費者の脆弱性（CV）を減らすことを目指すが、避けようとする害を再生産しうる。この逆説を、難民への起業支援のTSIで調べる（抄録）。", "p3": "調査1は、33のTSIの42人の管理者へのインタビューから、サービスモデルの三類型（アクセス優位、バランス制約、統制優位）を同定する。調査2は、TSIの提供者の三年間のエスノグラフィー（70件のインタビュー、144回の観察）で、消費者が割り当てられた位置を、サービス関係の中で争う様子を調べる（抄録）。", "p4": "対象は難民の起業を支援するTSI。調査1は管理者42人（33のTSI）、調査2は一つの提供者の三年間の観察（抄録）。", "p5": "各モデルは消費者を、受け身の受け手、条件つきの主体、自律した努力家として位置づけ、位置づけを保つほど、特有の脆弱性のパターン（制約された主体性、または満たされない必要）が生じやすい。消費者は、証言による再位置づけ（参加の実際の費用を見せる）と、予示的な再位置づけ（より多くの資源があれば可能になることを示す）で位置づけを争い、これが特定の組織・制度の条件のもとでのサービスモデルの再編に寄与した（抄録）。", "p6": "質的な研究で、一つの提供者の事例と管理者の標本に基づく。他の文脈への一般化の範囲は、抄録に書かれていない。", "fun": "支援する側の設計（資源へのアクセスと使い方の統制）が、受け手の立場を決め、その立場が特有の脆弱性を生む、という見方が面白い。しかも受け手は黙っておらず、費用を見せたり、可能性を示したりして、サービスモデルの再編に働きかける（抄録）。", "unverified": "本文を読んでいないため、三類型の詳細な区別、再編が起きた具体的な条件、データの分析の手続きは確認できていない。"}}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "女性が率いる企業は女性を多く雇い支援も手厚い", "title": "Female Managers, Women's Employment, and Gendered Laws", "url": "https://doi.org/10.1111/gwao.70276", "authors": "Hiep Manh Nguyen ほか", "venue": "Gender, Work and Organization", "date": "2026-11-10", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Nguyen, H. M., & Nguyen, H. T. (2026). Female Managers, Women’s Employment, and Gendered Laws. Gender, Work & Organization. https://doi.org/10.1111/gwao.70276", "why": "世界銀行の企業調査の国際データで、女性のトップを持つ企業ほど女性を雇用し、研修・育児支援・出産の福利厚生を提供し、イスラム圏では性別の差別が低い。この効果は法的な性別平等が弱い国・企業支援の限られる国で強く、男性中心の業種で弱い。女性従業員の比率が、女性のリーダーシップと生産性の負の関連を媒介する。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "女性が最高経営層にいる企業が、女性の雇用や職場の待遇にどう影響するか、その効果が国の法制度と産業でどう変わるかを、世界銀行の企業調査の国際データで調べた（抄録）。", "p2": "女性の経営者が、女性の雇用を増やすか、企業の生産性にどう関わるかを、国ごとの法的な性の平等や制度の支援の違いも含めて調べる（抄録）。", "p3": "世界銀行のEnterprise Surveyの大規模な国際データで、女性の最高経営者がいる企業を、そうでない企業と比べる。女性従業員の割合が果たす媒介の役割も調べる（抄録）。", "p4": "データはWorld Bank Enterprise Surveyの国際データ（抄録）。標本の企業数・国数・年次は、抄録に書かれていない。", "p5": "女性の最高経営者がいる企業は、女性を多く雇い、女性従業員に研修・育児支援・出産給付を提供しやすく、イスラム圏の文脈では性差別が少ない。効果は、法的な性の平等が弱い国や、企業での女性への制度的な支援が乏しい国で強く、男性中心の産業では弱い。女性従業員の割合は、女性のリーダーシップと生産性の負の関連を媒介する。それでも、女性従業員の割合が同程度の男性率いる企業より、女性率いる企業の成績は低い（抄録）。", "p6": "企業成績の性差は、従業員の性別構成以外の経営上の要因が生んでいる、と示唆する（抄録）。因果の識別の工夫は、抄録に書かれていない。", "fun": "女性が経営者の企業は、女性を多く雇い、育児支援なども手厚い。効果は、法的な性の平等が弱い国ほど強い、という点が面白い。ただし、女性従業員の割合が同じでも、女性率いる企業の成績は低く、その理由は従業員の性別構成では説明できない（抄録）。", "unverified": "本文を読んでいないため、標本の企業数・国数、効果の大きさ、生産性の測り方、媒介分析の手法は確認できていない。"}}, {"id": "jn14", "rank": 14, "field": "経営学", "headline": "サービスのエコシステムを共同で設計する「つながった摩擦」", "title": "Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations", "url": "https://doi.org/10.1177/10946705261492132", "authors": "Audun Formo Hay ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Hay, A. F., Vink, J., Thøgersen, D. M., Ness, O., von Heimburg, D., & Sangiorgi, D. (2026). Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations. Journal of Service Research. https://doi.org/10.1177/10946705261492132", "why": "サービスのエコシステムの設計に必要な再帰性を、個人の能力でなく関係から生まれるものとして捉え直した。ノルウェーの児童福祉での2年間の協同的な探究から、「つながった摩擦」を中核の弁証法的な動態として示し、均一性と断絶が妨げる動態であること、4つの状況条件を明らかにした。", "explain": {"basis": "抄録", "basis_note": "抄録のみを読んだ。本文は入手できなかった", "preprint": false, "p1": "サービス・エコシステムを集団で設計するとき、異なる立場の行為者の間の再帰的な関係をどう育てるかを、ノルウェーの児童福祉で調べた（抄録）。", "p2": "サービス・エコシステムの設計は、相互依存する行為者が価値共創を調整する社会構造を意図的に組み替える集団の営みだが、構造の経験が違うため、組み替え方で意見が割れる。再帰性は個人の能力として扱われてきたが、再帰的な個人だけに導かれる変革は、他者への意図しない結果と、価値共創が依存する関係の断絶を招く危険がある（抄録）。", "p3": "再帰的な関係を、立場の異なる行為者が、価値共創を調整する制度化された社会構造を、観察でき、争え、組み替えに開かれたものにする相互作用の形と定義する。ノルウェーの児童福祉で、二年間の協働的な探究を行う（抄録）。", "p4": "対象はノルウェーの児童福祉で、二年間の協働的な探究（抄録）。参加者の数は、抄録に書かれていない。", "p5": "再帰的な関係が生まれる中核の弁証法的な動きとして、つながった摩擦（connected friction）を明らかにし、均一化と断絶は妨げる動きとして示す。実践で継続的な調整が要る四つの状況の条件（実践的な距離、行為者の視点、感情的な努力、制度的な正当性）も特定する。再帰性を行為者の関係の中で生まれるものと捉え直し、対立する相互依存を、設計の生成的な資源にできると示す（抄録）。", "p6": "一つの国・分野（児童福祉）の協働的な探究。他の文脈への一般化の範囲は、抄録に書かれていない。", "fun": "意見の対立（摩擦）をなくすのでも、決裂させるのでもなく、つながった摩擦として保つことが、集団での設計を可能にする、という発想が面白い。均一化と断絶を、どちらも妨げる動きとして並べる点も特徴だ（抄録）。", "unverified": "本文を読んでいないため、探究の参加者と手続き、四つの条件の具体的な内容、つながった摩擦が生じた場面の記述は確認できていない。"}}, {"id": "jn15", "rank": 15, "field": "数学", "headline": "希薄なフェルミ気体のHuang–Yang予想を証明", "title": "The Huang–Yang conjecture for the low-density Fermi gas", "url": "https://doi.org/10.1007/s00222-026-01459-9", "authors": "Emanuela L. Giacomelli ほか", "venue": "Inventiones Mathematicae", "date": "2026-11-11", "sjr": 5.202, "citescore": 6.6, "citescore_year": "2025", "apa": "Giacomelli, E. L., Hainzl, C., Nam, P. T., & Seiringer, R. (2026). The Huang–Yang conjecture for the low-density Fermi gas. Inventiones Mathematicae. https://doi.org/10.1007/s00222-026-01459-9", "why": "斥力の短距離相互作用をもつスピン1/2のフェルミ粒子の希薄な気体の基底状態エネルギーの3項の漸近展開を確立し、1957年にHuangとYangが予測した式を検証した。公式は散乱長のみに依存する普遍的な形で、下界の証明が、先に得ていた上界と合わせて完成する。", "explain": {"basis": "本文", "basis_note": "出版社HTML版の本文（要旨、§1の主結果、§2の証明の戦略・主命題・定理1.2の証明の骨子）を読んだ。§3〜§6の補題・命題の証明は読んでいない", "preprint": false, "p1": "低密度のスピン1/2のフェルミ気体の基底状態エネルギーについて、三項の漸近展開を厳密に証明し、1957年にHuangとYangが予測した公式（Huang–Yang予想）を確かめた（要旨、§1）。", "p2": "この公式は、相互作用ポテンシャルの散乱長だけに依存する普遍性を持つと予想されたが、量子力学の第一原理から証明するのは数理物理の大きな難題だった。最初の二項は先行研究で示され、著者らの先行研究が三項目の上界を示したので、一致する下界が残っていた（要旨、§1）。", "p3": "下界は、平方完成の方法で示す。ハミルトニアンを、A*Aの形の非負の項と、定数項と、制御できる誤差に分け、非負の項を落とす（§1、§2.2）。上界で使った準ボソン的なボゴリューボフ変換の対角化は、下界では使えない。基底状態への事前評価では、ρNの形の誤差がO(L³ρ^(7/3))までしか抑えられず、三次項Q3も誤差として扱えないため（§2.2）。", "p4": "周期境界条件の箱の中のN個のスピン1/2のフェルミ粒子で、熱力学極限の基底状態エネルギー密度を扱う。相互作用はL²に属し、非負・動径対称・コンパクト台（仮定1.1）。上向きと下向きの密度の比は、定数で上下から押さえる（定理1.2、§1）。", "p5": "定理1.2：低密度の極限で、エネルギー密度は、自由フェルミ気体の運動エネルギーの項、8πaρ↑ρ↓、a²ρ↑^(7/3)F(ρ↓/ρ↑)の和に、誤差O(ρ^(7/3+1/120))を加えたものに等しい。ρ↑=ρ↓=ρ/2のとき、三項目の係数が(11−2 log 2)を含むHuang–Yangの公式になる（(1.1)、(1.12)、定理1.2）。", "p6": "成り立つのは、仮定1.1（L²・非負・動径対称・コンパクト台）と、二つのスピンの密度が同程度の場合に限る（定理1.2）。誤差の指数1/120は、上界の1/9より小さい（(1.3)、(1.12)）。扱うのはゼロ温度の基底状態で、有限温度は別の研究が扱う（§1）。", "fun": "第三項の係数に(11−2 log 2)という数が現れ、しかも相互作用の細部によらず散乱長だけで決まる、という普遍性が面白い。1957年の物理の予測を、「平方完成」という古典的な手で下から押さえて確定させた（§1、§2.2）。", "unverified": "§3〜§6の補題・命題の証明（命題2.4、2.9、2.10）は読んでいない。証明の正しさの検証はしていない。仮定と密度比の外で成り立つかは確認できない。"}}, {"id": "jn16", "rank": 16, "field": "工学", "headline": "植物の成長に学ぶ4D印刷で多安定構造を設計", "title": "Programmable multistable structures via bioinspired, mechanically guided 4D printing", "url": "https://doi.org/10.1073/pnas.2614289123", "authors": "Yan Zhao ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-10", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Zhao, Y., Zhu, H., He, Y., Zhang, Y., Ye, X., Lv, R., Tian, Y., Wang, Z., Xiang, J., Zhao, S., Zhou, K., & Jiang, C. (2026). Programmable multistable structures via bioinspired, mechanically guided 4D printing. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2614289123", "why": "植物の葉や果実の成長による変形を模した、力学的に導く4D印刷で、八安定と二安定の単位を設計・作製した。安定性の地形は無次元の幾何パラメータで調整でき座屈解析で検証され、八安定ユニットの組み合わせで10億超・4垓超の安定状態の構成空間をもつ帯とメタ表面を示した。液滴の誘導・可変スイッチ・把持などの応用を実演した。", "explain": {"basis": "抄録", "basis_note": "Top journals（PNAS）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "植物の葉や果実の成長による変形を模した、力学的に導く4D印刷で、形を安定に切り替えられる八安定・二安定の構造を設計・作製した。", "p3": "安定性の地形を無次元の幾何パラメータで調整し、座屈解析で検証した。八安定の単位を組み合わせて、10 cm規模の帯と、形を変えるメタ表面を作った。", "p5": "帯とメタ表面の構成空間は、one billion超とfour sextillion超の安定状態。多ユニットの幾何パラメータを調整して、曲げから折りたたみへの遷移を見いだし、二安定のヒンジを作れた。液滴の誘導と混合・電気スイッチの再構成・不規則な物体の把持・機械的な表示を実演した（抄録）。", "fun": "紙の折り方や植物の葉の開き方のように、ひとつの形が「パチン」と別の形に切り替わる仕組みを、設計図のように自由に組めるようにした点が面白い。部品を並べるだけで、安定な形の組み合わせがone billionを超える、という数の増え方も印象的。", "unverified": "本文を入手できず、材料・印刷条件・座屈解析の詳細は未確認。"}}, {"id": "jn17", "rank": 17, "field": "因果推論", "headline": "エネルギー費の上昇は民主主義への満足度を下げる", "title": "Energy Burden and Satisfaction With Democracy: The Political Consequences of Market Risk in Germany", "url": "https://doi.org/10.1177/00104140261500761", "authors": "Laura Kettel ほか", "venue": "Comparative Political Studies", "date": "2026-11-10", "sjr": 3.796, "citescore": 8.6, "citescore_year": "2025", "apa": "Kettel, L., & Wang, J. S. (2026). Energy Burden and Satisfaction With Democracy: The Political Consequences of Market Risk in Germany. Comparative Political Studies. https://doi.org/10.1177/00104140261500761", "why": "ドイツの郵便番号別のエネルギー価格・世帯支出・個人の政治的態度のデータで、操作変数の設計により、エネルギー費の上昇が民主主義への満足度を下げるという因果的な証拠を示した。効果は家計への打撃を通じた経路で説明される。", "explain": {"basis": "抄録", "basis_note": "Top10%誌（Comparative Political Studies）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "エネルギー費の上昇が民主主義への満足度を下げるという因果的な証拠を、ドイツの郵便番号別のデータと操作変数の設計で示した。", "p3": "郵便番号レベルのエネルギー価格・世帯支出・個人の政治的態度のデータを使い、操作変数の設計で因果効果を推定した。", "p5": "エネルギー費の上昇は民主主義への満足度を下げる。効果は、家計への打撃（pocketbook）の機構で説明される（抄録）。数値は抄録にない。", "fun": "光熱費が上がると、人は「政府はうまくやっていない」と感じやすくなる、という日常の実感を、データで因果として確かめようとしている点が面白い。エネルギー転換の政策が不公平だと受け取られると、民主主義への信頼まで揺らぎうる。", "unverified": "本文を入手できず、操作変数の中身・効果の大きさ・頑健性の検討は未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "エピジェネティックな生物学的年齢をマーケティングに取り入れる", "title": "EXPRESS: Biological Age and its Value to Marketing Theory and Practice", "url": "https://doi.org/10.1177/00222429261508777", "authors": "Steven D. Shaw ほか", "venue": "Journal of Marketing", "date": "2026-11-11", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "apa": "Shaw, S. D., Daviet, R., & Nave, G. (2026). EXPRESS: Biological Age and its Value to Marketing Theory and Practice. Journal of Marketing. https://doi.org/10.1177/00222429261508777", "why": "加齢を暦年齢だけで扱うマーケティングを超え、エピジェネティックなデータから生物学的年齢（BioAge）の指標を導いて消費者行動の理論に統合する枠組みを示した。米国の健康と退職の調査のデータで、BioAgeが暦年齢に表れない加齢の側面を捉えることを示す。", "explain": {"basis": "抄録", "basis_note": "Top10%誌（Journal of Marketing）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "エピジェネティックなデータから作る生物学的年齢（BioAge）を、マーケティングに取り入れ、暦年齢では見えない消費行動の違いを捉えられることを示した。", "p3": "加齢を暦年齢だけで扱う従来の見方を超え、生物学的な加齢を消費者行動の理論に統合する枠組みを示し、米国の健康と退職の調査（Health and Retirement Study）のデータで分析した。", "p5": "BioAgeは暦年齢に表れない加齢の側面を捉え、消費活動と支出の予測を改善する。機能的な能力・エネルギー・認知・健康上の制約が関与を決める領域（技術の利用・社会的・身体的な活動・裁量的な娯楽の支出）で最も役立ち、日常的・必需的な領域では限られる。BioAgeは、主観的な健康の認識でなく、慢性疾患・認知機能・身体の活力という客観的な生理的経路を通じて、時間が消費行動に及ぼす影響を媒介する（抄録）。", "fun": "同じ暦年齢でも、体の年齢は人によって違い、お金の使い方も違う、という日常の感覚を、血液などの生物学的な指標で数値にした点が面白い。スマホなどの技術の使い方や娯楽の支出には、暦年齢より「体の年齢」のほうが効く一方で、食料品のような必需品では差が出にくい。", "unverified": "本文を入手できず、BioAgeの計算方法・予測の改善の大きさ・倫理上の議論の中身は未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "MLLMに画素レベルの能力を足しても基礎能力を失わない", "title": "Robust Reasoning Segmentation for Open-World MLLMs without Catastrophic Forgetting", "url": "https://doi.org/10.1007/s11263-026-03118-1", "authors": "Jiazhen Liu ほか", "venue": "International Journal of Computer Vision", "date": "2026-11-10", "sjr": 3.103, "citescore": 17.8, "citescore_year": "2025", "apa": "Liu, J., & Chen, L. (2026). Robust Reasoning Segmentation for Open-World MLLMs without Catastrophic Forgetting. International Journal of Computer Vision, 134(12). https://doi.org/10.1007/s11263-026-03118-1", "why": "マルチモーダルLLMに分割の能力を足すとき、侵襲的な微調整が破滅的忘却を招く問題に対し、キーポイントを使って基礎の能力を損なわずに画素レベルの能力を与えるプラグアンドプレイのLENSを提案した。", "explain": {"basis": "抄録", "basis_note": "Top10%誌（International Journal of Computer Vision）の抄録を読んだ。本文は入手できなかった", "preprint": false, "short": true, "p1": "マルチモーダルLLMに、基礎の能力を壊さずに、画素レベルの分割能力を足すプラグアンドプレイの手法（LENS）を示した。", "p3": "完全に固定したMLLMに軽量なヘッドをつなぎ、注意マップに埋め込まれた空間の手がかりを読んで、キーポイントを取り出し、マスクデコーダ向けの特徴に変換する。生成と分割を切り離す。", "p5": "再学習ベースの方法に並ぶ分割性能を達成しつつ、微調整した方法で見られる劣化を避けて、オープンワールドの一般化をほぼ保つ（抄録）。具体的な数値は抄録にない。", "fun": "AIに新しい技を覚えさせると、前から得意だったことを忘れてしまう「破滅的忘却」が起きる。この研究
