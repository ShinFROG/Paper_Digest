<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-12", "intro": "プレプリントの新着489件、学術誌の新着1,069件（うち上位10%誌822件）、重要論文の候補82件から選びました。今日はarXivの新着がなく、Hugging Face Daily Papersも取得できなかったため（HTTP 400）、候補が少なく、各部の件数を絞りました。プレプリント・関連40報、プレプリント・注目34報、論文誌・関連46報、論文誌・注目20報、オープンデータ27件です。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "損傷同定の学習データを非線形解析1回で量産", "title": "An efficient two-step fracture strategy to generate physics-consistent training datasets for vibration-based damage identification", "url": "https://doi.org/10.2139/ssrn.7593603", "authors": "Andrea Pranno ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Pranno, A., De Maio, U., Gaetano, D., & Greco, F. (2026). An efficient two-step fracture strategy to generate physics-consistent training datasets for vibration-based damage identification. https://doi.org/10.2139/ssrn.7593603", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "振動ベースの損傷同定に使う物理的に整合した学習データを、非線形の破壊解析を1回だけ行って大量に作れるようにした（抄録）。", "p2": "データ駆動の損傷同定では、ひび割れの位置・程度ごとに非線形破壊解析を繰り返す必要があり、学習データの生成が計算上の最大のボトルネックだった（抄録）。", "p3": "第1段階で基準要素の準静的な結合力（cohesive）解析を1回行い、所定の除荷経路から使い回せる「損傷プロファイル」の族を取り出す。第2段階でそれを線形化したモード解析に当てはめ、ひび割れ位置と程度を掃引して固有振動数とモード曲率の合成データを作る（抄録）。解釈：非線形性は一度だけ扱い、あとは線形の固有値解析を繰り返すので安くなる。", "p4": "簡略化した破壊モデルをより精緻な損傷モデルと比べて検証し、損傷プロファイルの転用可能性を確かめた。データで、ひび割れ位置と損傷程度を推定する2つのニューラルネット（固有振動数とモード曲率の多モーダル入力を共有）を学習させた（抄録）。", "p5": "分割の頑健性解析と交差モデル検証で、現実的な計測ノイズの下でも工学的に十分な精度と、学習分布の外への汎化を確認したと報告している（抄録）。具体的な誤差の数値は未確認。", "p6": "未査読のプレプリント。対象は抄録から「基準要素」の数値モデルと読め、実構造物の計測データでの検証の有無は未確認。損傷プロファイルが異なる境界条件や構造形式に転用できる範囲が残る疑問。", "fun": "ひび割れの入り方を一つずつ計算すると何千回もの重い計算が必要ですが、「割れ方の型」を一度だけ詳しく計算して、それを位置や大きさを変えて貼り付ければ済む、という発想です。料理で言えば、だしを一度丁寧に取って、いろいろな料理に使い回すようなもので、計算の手間を大きく減らしています。", "unverified": "計算時間の削減率と同定精度の具体的な数値、対象構造（梁か板か）は抄録に記載がなく未確認。"}}, {"id": "pr02", "rank": 2, "headline": "NorSandをSPHに実装し液状化の発生と流動を一体予測", "title": "SPH simulation of constant shear drained liquefaction and large deformation behaviour using the NorSand-ηHR constitutive model", "url": "https://doi.org/10.2139/ssrn.7597031", "authors": "Scott Lines ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Lines, S., & Lines, A. (2026). SPH simulation of constant shear drained liquefaction and large deformation behaviour using the NorSand-ηHR constitutive model. https://doi.org/10.2139/ssrn.7597031", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "静的液状化の評価で実務に広く使われる構成モデルNorSandを、大変形を扱える粒子法SPHに初めて実装し、破壊の発生と流動（run-out）を1つの解析で予測できるようにした（抄録）。", "p2": "ダムや鉱滓堆積場で重要な静的液状化は、状態依存の構成モデルでないと表せないが、そうしたモデルは小ひずみ解析でしか使われず、破壊の「引き金」は予測できても「その後どう流れるか」は別の経験式に頼っていた（抄録）。", "p3": "応力比硬化則のNorSand-ηHRを、陽的な境界曲面型の応力点積分で組み込み、不安定化は状態依存の軟化から生じ、Hillの2次仕事基準で判定する。間隙流体はペナルティ型u-p有効応力法で連成し、排水・非排水の極限を再現する。CPUとGPUで実装した（抄録）。背景：状態パラメータは、現在の間隙比と限界状態の間隙比の差で、正なら緩い（収縮的）状態を表す。", "p4": "Terzaghiの1次元圧密解で検証し、Silica Fine砂の三軸試験データで妥当性を確認した。境界値問題として乾燥粒状体の柱の崩壊と、地下水位上昇で一定せん断排水（CSD）応力経路を受ける理想化したダムを解いた（抄録）。", "p5": "同じ載荷でも初期状態パラメータ0.04では限定的な沈下（slump）、0.06では流動すべり（flowslide）となり、破壊の種類が別の相関式を仮定せず土の状態から1つの解析で現れた（抄録）。", "p6": "未査読のプレプリント。ダムは理想化した問題で、実際の崩壊事例での検証は抄録からは確認できない。SPHの粒子解像度や境界条件への感度も未確認。", "fun": "同じ砂のダムでも、粒の詰まり方がほんの少し緩いだけで、少し沈むだけで済むか、泥のように流れ出すかが分かれます。その違いを、別々の計算や経験則をつなぎ合わせるのではなく、一つの計算の中で自然に生み出せるようになった点が面白いところです。", "unverified": "計算規模、GPUでの高速化の程度、三軸試験との一致の程度は抄録に記載がなく未確認。"}}, {"id": "pr03", "rank": 3, "headline": "粒子形状が共振柱試験の共振周波数を左右する", "title": "Discrete element method analysis of the dynamic response of sand in resonant column testing", "url": "https://doi.org/10.2139/ssrn.7593741", "authors": "Javier Necochea ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Necochea, J., Hanley, K. J., & Saez, E. (2026). Discrete element method analysis of the dynamic response of sand in resonant column testing. https://doi.org/10.2139/ssrn.7593741", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "共振柱試験を個別要素法（DEM）で再現し、粒子形状が共振周波数に与える影響と、試験の解釈が前提とする連続体仮定の限界を粒子スケールで示した（抄録）。", "p2": "共振柱試験は土の小ひずみ動的特性を測る標準的試験だが、その解釈は粒子の微視力学に根拠のない連続体の仮定（試料全体が想定したモード形で振動する）に依っている（抄録）。", "p3": "拘束圧100 kPaで粒度の悪い砂の共振柱試験を3組行い、DEMで転がり摩擦つき球・楕円体・複数球の塊（クランプ）の3つの粒子形状で再現した。80〜130 Hzの正弦トルクを振幅0.04・0.09・0.18 N·mで与えた（抄録）。", "p4": "室内試験の共振までの傾向との一致と、粒子スケールでの変形・エネルギー散逸の分布で評価した（抄録）。", "p5": "すべての形状で明瞭な共振が現れ、振幅が大きいほど共振周波数が下がった（ひずみ依存の剛性低下と整合）。小荷重では球が最も低く塊が最も高い共振周波数、大トルクでは楕円体が最も低かった。角変位は連続体理論のモード形に従わず上部載荷境界の近くに集中し、エネルギーの大部分は試料上部30%で散逸した（抄録）。", "p6": "未査読のプレプリント。対象は1種類の砂と1つの拘束圧に限られる。境界に支配された挙動が試験の解釈（せん断弾性係数や減衰の算定）をどれだけ偏らせるかの定量は抄録からは未確認。", "fun": "試験機で砂の柱をねじって揺らすとき、教科書では柱全体がきれいな形で揺れると仮定します。ところが粒一つひとつを計算してみると、揺れは上の方に偏り、エネルギーもほとんど上の3割で失われていました。標準的な試験の「当たり前」を粒の目線で問い直している点が面白いです。", "unverified": "共振周波数の具体的な値と、試験との差の大きさは抄録に記載がなく未確認。"}}, {"id": "pr04", "rank": 4, "headline": "対比型の悪評は感情が強いほど拡散される", "title": "Hot criticism, cool praise: The interplay between contrastive eWOM and emotional intensity in shaping consumers’ eWOM retransmission intention", "url": "https://doi.org/10.2139/ssrn.7597178", "authors": "Fenghua Zhang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Zhang, F., Huang, J., Chen, C., & Zhang, D. (2026). Hot criticism, cool praise: The interplay between contrastive eWOM and emotional intensity in shaping consumers’ eWOM retransmission intention. https://doi.org/10.2139/ssrn.7597178", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "もとのブランド態度と逆向きの口コミ（対比型eWOM）では、感情の強さが再発信を促すか抑えるかが、悪評か好評かで逆になることを示した（抄録）。", "p2": "口コミの感情の強さが拡散に与える効果は研究によって食い違っており、消費者の既存のブランド態度と口コミの向きの食い違い（対比）が考慮されていなかった（抄録）。", "p3": "認知・感情パーソナリティシステム（CAPS）理論に基づき、対比型eWOM（負の対比＝好きなブランドへの悪評、正の対比＝嫌いなブランドへの好評）×感情強度（低・高）の効果を、感情的覚醒と知覚された診断性（判断の役に立つ度合い）の2経路で説明する（抄録）。", "p4": "オンラインのシナリオ実験3つ。研究1で交互作用、研究2で別の製品文脈での再現と2つの媒介（処理流暢性と自己呈示動機を排除）、研究3で強い紐帯・弱い紐帯の経路による調整を検証した（抄録）。", "p5": "負の対比では感情が強いほど再発信意図が高く主に覚醒を介し、正の対比では感情が弱いほど高く主に診断性を介した。強い紐帯は強い悪評の覚醒経路を、弱い紐帯は穏やかな好評の診断性経路を強めた（抄録）。", "p6": "未査読のプレプリント。シナリオ実験であり実際の拡散行動ではなく意図を測っている。標本数と効果量は抄録に記載がなく未確認。", "fun": "好きなブランドの悪口は熱く書かれているほど広めたくなり、嫌いなブランドの褒め言葉は冷静に書かれているほど信じて広めたくなる、という逆転が面白い発見です。友だち同士なら感情で、ゆるいつながりなら「役に立つか」で広まるという違いも、身近なSNSの感覚と合っています。", "unverified": "各研究の標本数、効果量、製品カテゴリーは抄録に記載がなく未確認。"}}, {"id": "pr05", "rank": 5, "headline": "AIラベルを隠すと人はAI投稿に返信しやすい", "title": "“Oh No, the Robots Are Here”: AI identity labels, social uptake and sanctioning in mixed human–AI communities", "url": "https://doi.org/10.31234/osf.io/kwy5j_v2", "authors": "Sara Major ほか", "venue": "PsyArXiv", "date": "2026-10-10", "apa": "Major, S., Tomašević, A., Vranić, A., Cvetkovic, D., Vudragović, D., Stupovski, B., & Dankulov, M. M. (2026). “Oh No, the Robots Are Here”: AI identity labels, social uptake and sanctioning in mixed human–AI communities. https://doi.org/10.31234/osf.io/kwy5j_v2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSFのPDF本文（結果・考察・限界の節と表1・図1〜4のキャプション）を読んだ", "preprint": true, "p1": "人とLLMエージェントが混在するSNSで、AIアカウントに「AI」と表示するかどうかが、人がどの投稿に返信するかと、AIへの批判の多さを変えることを21日間のフィールド実験で示した（抄録、§Results）。", "p2": "自律的なAIアカウントがSNSで人と並んで投稿・返信するようになったが、AIだと明示することが人の関わり方と評価にどう影響するかは、持続的なやり取りの場で調べられていなかった（§Introduction・Discussion）。", "p3": "Redditに似た実験用プラットフォームYSocialで、持続するペルソナと記憶を持つLLMのAIアカウントと人が大衆文化を議論した。表示ありの共同体（人20・AI 40）と表示なしの共同体（人16・AI 32）を設け、人の各返信について同じスレッド内の返信候補を集め、AI投稿を選ぶ確率をベイズモデルで推定した（§Results、表1、図1）。", "p4": "主要な指標は、同じ候補集合に両共同体のモデルを当てはめて標準化した「AI投稿を返信先に選ぶ確率」の差。副次的に、批判（丁寧な反論を含む）の割合、有害性、他者のダウンボートを比べた（§Results、図2）。", "p5": "分析した人の返信2,143件で、返信先にAIを選んだ割合の観測値は表示なし35.9%、表示あり26.4%。標準化した確率は32.5%対29.0%で、差は3.5ポイント（95%信用区間0.5〜6.5）。AIから返信を受けた後はそのAIを選びやすく、自分が返信した後は選びにくかった（図4）。AIと人への返信の批判の差は表示ありで13.3ポイント大きく（5.1〜21.4）、有害性の差は不確かだった（抄録、図2）。", "p6": "各条件の共同体は1つずつで、表示の有無と参加者集団・説明・共同体の発展が交絡する。参加者はセルビアの1大学の学部生36人、AIモデルとペルソナ設定は1種類、AIは人の2倍、技術的問題で10日間中断した（§Discussion、p.14–15）。", "fun": "ロボットの印が付いているだけで、人はAIの投稿に返事をしにくくなり、返事をしても反論が増えました。中身が同じでも「誰が言ったか」で受け止め方が変わるという人間らしい反応が、AIとの共存の場で数字になって現れた点が面白いところです。AIに暴言を吐かれる場面まで記録されています。", "unverified": "補足資料（表S1・S6・S13など）は未読。ブラウザ記録による閲覧の分析（図3）の数値は確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "LLM審査員は合意の模倣に騙される", "title": "The Formalism Trap: Are LLM-as-a-Judge Evaluators Blinded by Consensus Mimicry under Social Load?", "url": "https://doi.org/10.2139/ssrn.7593351", "authors": "Dahlia Shehata ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Shehata, D., & Li, M. (2026). The Formalism Trap: Are LLM-as-a-Judge Evaluators Blinded by Consensus Mimicry under Social Load? https://doi.org/10.2139/ssrn.7593351", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMを審査員にする評価（LLM-as-a-Judge）が、手続きらしい形式や合意の模倣を内容の正しさと取り違える失敗を、指標を作って定量化した（抄録）。", "p2": "エージェントの評価をLLM審査員に任せる場面が増えているが、敵対的な「社会的負荷」の下で審査員が形式や多数意見の見かけに引きずられる危険は測られていなかった（抄録）。", "p3": "「評価的不協和指数（D_E）」を提案し、審査員が証拠の重みづけを高く評価しながら答え自体は不正確と判断する状態をD_E>0.5の「評価者の捕獲」と定義した。幻覚的な振る舞いの意味的分類（531の正準クラスタ）を抽出し、ロジスティックモデルで捕獲に関わる特徴を調べた（抄録）。", "p4": "GAIA、SWE-bench、Multi-Challengeの3領域の22,500軌跡を分析し、分類は決定論的な語彙の照合と150件の手作業確認で点検した。説明モデルは保留データのROC-AUCと、領域を1つずつ外す転移で評価した（抄録）。", "p5": "8.7%の軌跡で評価者の捕獲が起きた。構文と合意模倣の特徴によるモデルの保留ROC-AUCは0.8779で、書式の数だけの0.7175を上回り、領域外への転移で平均0.7482だった。模擬した群（swarm）の構成ごとに異なる意味的な盲点が生じた（抄録）。", "p6": "未査読のプレプリント。語彙照合との相関はr=0.1557と弱く（抄録）、分類の妥当性は限定的とも読める（解釈）。審査員に使ったモデルの種類と数は抄録に記載がなく未確認。", "fun": "AIに別のAIの答えを採点させると、「手順を踏んでいるように見える」「みんなが賛成している」答えに甘くなることがある、という指摘です。人間の会議でも声の大きい多数派や立派な書式に流されることがありますが、AIの審査員にも同じ弱点があると数字で示した点が面白いです。", "unverified": "審査員のモデル名、D_Eの計算式の詳細、群構成の違いの中身は抄録からは未確認。"}}, {"id": "pr07", "rank": 7, "headline": "孤独は機能低下を進め、孤立は回復を妨げる", "title": "Social isolation, loneliness and functional transitions among middle-aged and older adults with cardiometabolic multimorbidity: a multistate Markov analysis of CHARLS", "url": "https://doi.org/10.21203/rs.3.rs-11073323/v1", "authors": "Jiayi Sun ほか", "venue": "Research Square (In Review)", "date": "2026-10-11", "apa": "Sun, J., Xue, Z., & Cheng, A. (2026). Social isolation, loneliness and functional transitions among middle-aged and older adults with cardiometabolic multimorbidity: a multistate Markov analysis of CHARLS. https://doi.org/10.21203/rs.3.rs-11073323/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文HTML（方法・結果・感度分析・考察と限界）を読んだ", "preprint": true, "p1": "心血管代謝の多疾患併存を持つ中高年で、孤独と社会的孤立がそれぞれ機能の悪化・回復・死亡のどの遷移に関わるかを、多状態マルコフモデルで分けて示した（抄録、§Results）。", "p2": "孤立や孤独が障害の発生に関わることは知られていたが、障害を一方向の終点として扱う研究が多く、悪化と回復のどちらの方向に効くかは分かっていなかった（§Background、Comparison with previous work）。", "p3": "CHARLSの第1〜5波（2011〜2020年）の45歳以上1,731人を、孤立指標（配偶者なし・独居・子との週1接触なし・社会活動なし）と孤独（CES-Dの1項目）で4群に分けた。自立・IADL制限・ADL制限・死亡の間の9つの遷移を、正確な年齢を時間軸とする連続時間の多状態マルコフモデル（Rのmsm）で推定した（§Methods、Statistical analysis）。", "p4": "遷移ごとのハザード比（HR）と、4群の効果全体の尤度比検定で評価し、60〜90歳の期待自立年数を比べた。27個のHRは多重比較補正なしの探索的扱い。7つの感度分析と全標本13,143人での交互作用検定も行った（§Statistical analysis）。", "p5": "群の効果は全体として強く（LRT χ²=97.56、P=6.5×10⁻¹⁰）。孤独のみ群は自立→IADL制限HR 2.83（1.09–7.31）、自立→ADL制限2.01（1.28–3.15）。両方群は早期悪化2.66（1.62–4.37）、ADL制限からの回復0.34（0.17–0.70）、ADL制限後の死亡1.57（1.04–2.39）。期待自立年数は4.83年対0.65年で4.18年の差（図3、表S5）。", "p6": "曝露は開始時の1回だけの測定で逆因果の可能性、機能と疾患は自己申告、死亡者の80.8%は死亡日を補完、2020年波はCOVID-19と重なる（§Strengths and limitations）。両方群の55.5%が開始時にすでに障害を持ち、群間比較の解釈に注意が要る（§Transition-specific associations）。", "fun": "「一人でいること（孤立）」と「寂しいと感じること（孤独）」は似ていますが、体への効き方が違いました。寂しさは元気な人が弱り始めるきっかけに、両方そろうと一度弱った後に回復しにくくなる、という違いです。悪くなる方向だけでなく「戻れるか」まで見たことで見えた結果です。", "unverified": "補足資料の表S2〜S7と図S2〜S5は未読。本文中の図1〜3の図そのものは確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "土地財政に頼る都市ほど高速鉄道駅が郊外に", "title": "The Political Economy of High-Speed Rail Station Siting Local Land Finance, Station Location, and the Spatial Wedge", "url": "https://doi.org/10.2139/ssrn.7593622", "authors": "Ning Li ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Li, N., & Jiang, C. (2026). The Political Economy of High-Speed Rail Station Siting Local Land Finance, Station Location, and the Spatial Wedge. https://doi.org/10.2139/ssrn.7593622", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国で土地財政への依存が強い都市ほど高速鉄道駅を都心から遠くに置き、その結果として地方の財政収入・住民の移動費用・全国網の効率の間に「空間的なくさび」が生じていることを示した（抄録）。", "p2": "大規模交通インフラの立地は技術的な計画判断とみなされがちだが、多層的な統治の下では地方政府の財政誘因も反映しうる（抄録）。背景：土地財政とは、地方政府が土地使用権の売却収入に財源を頼ることを指す。", "p3": "駅の配置を地方の財政制約の下での空間選択と捉え、1,126駅の位置データ、200万件超の区画単位の土地取引、都市単位の財政・社会経済データを結合して分析した（抄録）。", "p4": "(1)決定前の土地財政依存度と正規化した駅の都心距離、(2)駅の位置と鉄道網のサービス水準、(3)駅の位置と周辺地価の上昇の3つの関係を検証した（抄録）。", "p5": "決定前の土地財政依存度が1%高いと、正規化した駅距離は約0.37%長い（両対数なので弾力性）。郊外の駅ほど鉄道網のサービスは弱く、周辺の地価は速く上昇し、土地市場が活発な都市で顕著だった（抄録）。", "p6": "未査読のプレプリント。著者自身が完全な因果的媒介の連鎖は識別していないと述べている（抄録）。立地決定の内生性への対処方法は抄録からは未確認。", "fun": "新幹線の駅を町の中心ではなく郊外の田んぼに作ると、その周りの土地を高く売れて市の収入になります。しかし住民は駅まで遠くなり、鉄道網としても不便になります。駅の場所という「技術の問題」に見えるものが、実はお金の事情で決まっているかもしれない、という見方が面白い点です。", "unverified": "推定に使った固定効果・操作変数などの識別戦略と、サービス水準の測り方は抄録からは未確認。"}}, {"id": "pr09", "rank": 9, "headline": "同業の環境処分はグリーンボンドに波及しにくい", "title": "Relative Pricing Insulation in Green Bonds: Evidence from Peer-Firm Environmental Penalties in China", "url": "https://doi.org/10.2139/ssrn.7597240", "authors": "Congcong WANG ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "WANG, C., & Liu, S. (2026). Relative Pricing Insulation in Green Bonds: Evidence from Peer-Firm Environmental Penalties in China. https://doi.org/10.2139/ssrn.7597240", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "同業他社の環境処分というリスク情報が、同じ企業の普通社債よりグリーンボンドの利回りに伝わりにくい「相対的な価格の遮断」を示した（抄録）。", "p2": "グリーンボンドの利回りが普通社債より低い差（グリーニアム）の変動は、グリーンボンド自体の価値の変化と解釈されがちで、どちらの利回りが動いたのかは区別されていなかった（抄録）。", "p3": "2019〜2024年の中国のグリーンボンド287本について、同一発行体の普通社債の利回りを基準に組み、直前14日の同業他社の環境処分の強さとの関係を、ペア×日の90,081観測で推定した（抄録）。", "p4": "グリーニアムの変化を、普通社債とグリーンボンドの利回りに分解して、どちらが動いたかを見た。業界アナリストの調査報告の量、資金使途、開示文言で横断的な違いを調べ、変数の作り方・固定効果・標本除外・プラセボで頑健性を確かめた（抄録）。", "p5": "処分の強さが1標準偏差上がるとグリーニアムは6.35ベーシスポイント広がり、主に普通社債の利回り上昇によるもので、グリーンボンドの反応は弱く有意でなかった。調査報告が多いほど、緑の属性が検証しやすいほど遮断は強かった（抄録）。", "p6": "未査読のプレプリント。著者は遮断が価格水準での相対的なものにすぎず、発行体の信用リスクからの切り離しを意味しないと明記している（抄録）。流動性の違いがどこまで制御されているかは抄録からは未確認。", "fun": "同じ会社が出す「環境に良い使い道の債券」と「普通の債券」を並べて比べると、悪い環境ニュースのときに金利が上がるのは普通の債券だけでした。差が広がったのは環境債の人気が上がったからではなく、普通の債券が嫌われたから、という見方の転換が面白い点です。", "unverified": "対照となる普通社債の選び方の詳細と、プラセボ検定の具体的な設計は抄録からは未確認。"}}, {"id": "pr10", "rank": 10, "headline": "船首の変形を氷の破壊に返すDEM-FEM双方向連成", "title": "Influence of bow response on ice-loads of icebreaker: A two-way coupled DEM-FEM model", "url": "https://doi.org/10.2139/ssrn.7593747", "authors": "Lu Liu ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Liu, L., Zhang, H., Chen, X., & Ji, S. (2026). Influence of bow response on ice-loads of icebreaker: A two-way coupled DEM-FEM model. https://doi.org/10.2139/ssrn.7593747", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "砕氷船の船首の変形が、その後の氷の破壊と氷荷重に影響し返す過程を、個別要素法と有限要素法の双方向連成で計算できるようにした（抄録）。", "p2": "氷荷重の計算では船体を剛体とみなすことが多く、船首のたわみが氷の破壊の仕方を変えるという力と変位の帰還（フィードバック）は扱われていなかった（抄録）。", "p3": "膨張させた多面体の離散要素で氷の圧壊・曲げ破壊・破片化・破片の運動を表し、陰的な動的シェルモデルで船首の変形を表す。2つのソルバが接触力と構造の変位を非同期に交換する（抄録）。", "p4": "変形する二重殻構造への北極海氷の圧縮試験と、砕氷船「雪龍2号」の模型試験の2つの独立したデータで検証した。氷のパラメータは比較に使う力や応力に合わせず、巨視的な氷の性質から決めた（抄録）。", "p5": "圧縮試験との最大相対差はピーク合力11.60%、最大局所圧力約10.1%、ピークのミーゼス応力18.59%。実船規模では速度1→6ノットで氷抵抗0.940→2.908 MN、氷厚0.6→2.1 mで0.704→3.470 MN。剛体船体に比べ平均抵抗は1.836→1.944 MNとわずかに増え、接触圧の分布が変わり局所ピークは下がった（抄録）。", "p6": "未査読のプレプリント。対象は平坦な一年氷（level ice）に限られる。計算コストや非同期交換の安定性の条件は抄録からは未確認。", "fun": "氷を割る船の船首は硬く見えても、わずかにたわみます。そのたわみが氷の割れ方を変え、全体の抵抗はほとんど変わらないのに、局所的な力のかかり方は大きく変わる、という結果です。「全体では小さな違い」が「局所では大きな違い」になりうることを示しています。", "unverified": "離散要素の数、時間刻み、計算時間は抄録に記載がなく未確認。"}}, {"id": "pr11", "rank": 11, "headline": "Schrödinger方程式からLiouville方程式を導く", "title": "Using the wavelet transform to separate scales in the Schrödinger equation and subsequently derive the Boltzmann equation", "url": "https://doi.org/10.2139/ssrn.7593489", "authors": "Aleksandr Meilakhs", "venue": "SSRN", "date": "2026-10-10", "apa": "Meilakhs, A. (2026). Using the wavelet transform to separate scales in the Schrödinger equation and subsequently derive the Boltzmann equation. https://doi.org/10.2139/ssrn.7593489", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ウェーブレット変換に似た手法で尺度を分けることで、量子力学のSchrödinger方程式から、古典的な分布の時間発展を表すLiouville方程式と衝突項を導き、Boltzmann方程式を第一原理から得た（抄録）。", "p2": "量子力学から古典力学を導く従来の方法と、相互作用による量子状態間の遷移を記述する方法とは相性が悪く、両者を同時に扱ってBoltzmann方程式を導くことが難しかった（抄録）。", "p3": "信号処理のウェーブレット変換に似た手法で、波動関数が古典的にふるまう緩やかなポテンシャル（決まった軌道に沿う運動）と、量子遷移として理解すべき急峻なポテンシャルを同時に扱う（抄録）。背景：Liouville方程式は、位置と運動量の空間（位相空間）での確率分布が流れに沿って保存されることを表す。", "p4": "緩やかなポテンシャルではLiouville方程式が、急峻なポテンシャルでは遷移率行列が自然に得られるかを示すことで、導出の整合性を確かめる理論研究（抄録）。", "p5": "緩やかな場合はSchrödinger方程式からLiouville方程式が導かれ、Boltzmann方程式の非衝突部分になる。急峻な場合はフェルミの黄金律で遷移率が決まる遷移率行列が得られ、衝突積分になる。両者を組み合わせてBoltzmann方程式を導いた（抄録）。", "p6": "未査読のプレプリントで、著者の一連の研究の続編。数値検証の有無や、近似が成り立つ尺度分離の条件は抄録からは未確認。", "fun": "気体の分子の動きを表すBoltzmann方程式は、物理の教科書では「仮定」として出てくることが多い式です。それをミクロな量子力学の基本方程式から導こうという挑戦で、ゆっくり変わる部分と急に変わる部分を、音声の解析に使う道具で切り分けるという発想が面白い点です。", "unverified": "導出の各段階の近似条件と、従来の導出との比較は抄録からは未確認。"}}, {"id": "pr12", "rank": 12, "headline": "共有記録があってもLLMエージェント班は協調に失敗", "title": "Shared Memory Is Not Enough for LLM-Agent Teams", "url": "https://doi.org/10.6084/m9.figshare.34332540", "authors": "Leo Cazenille", "venue": "Figshare", "date": "2026-10-11", "apa": "Cazenille, L. (2026). Shared Memory Is Not Enough for LLM-Agent Teams. figshare. https://doi.org/10.6084/M9.FIGSHARE.34332540", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Figshareの登録に付いた抄録を使用", "preprint": true, "p1": "LLMエージェントのチームでは、正しい共有記録が残っていても、メンバー交代後に適時の協調行動に結びつかないことを模擬実験で示した（抄録）。", "p2": "AIエージェントのチームは記録を共有してメンバー交代後も知識を保てるとされるが、新メンバーが関連情報を見つけて使い、協調する過程のどこで失敗するかは調べられていなかった（抄録）。", "p3": "1体が部品を届け、もう1体が修理する課題で、必要な部品を知っていたエージェントを全員入れ替え、課題と記録は変えずに、新メンバーがその事実をいつ・どう受け取るかを変えた（抄録）。", "p4": "部品の受け取りまでの時間と、配達と修理の協調の成否で評価した（抄録）。", "p5": "自由に読める記録を一度も読まないエージェントがいた。行動前に事実を示すと受け取りが速まり、経路を選んだ後に情報を受け取ると、すでに役に立たない経路を選んでいた場合に遅れた。次の一手が事実に依存しなければ遅れの影響は小さかった。行動前に情報があっても協調に失敗するチームがあった（抄録）。", "p6": "未査読のプレプリント。使用したLLM、試行回数、効果の大きさは抄録に記載がなく未確認。課題が単純な模擬環境に限られる。", "fun": "引き継ぎノートが完璧でも、後任者が読まなかったり、読むのが遅すぎたりすれば仕事は回りません。人間の職場でおなじみの問題が、AIのチームでもそのまま起きることを示しています。記録があるかではなく、記録が判断に間に合うかで評価すべきだという指摘が鋭い点です。", "unverified": "使用モデル、試行数、統計的な比較の方法は抄録からは未確認。"}}, {"id": "pr13", "rank": 13, "headline": "地域スポーツクラブの安全・包摂の指標を整理", "title": "What are the indicators for Community Sports Clubs to Measure Safe and Inclusive Spaces? A PRISMA rapid scoping review.", "url": "https://osf.io/q2vma", "authors": "Dr. Erica Randle ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-08", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlexの題名検索で見つかった記録の抄録を使用", "preprint": true, "p1": "地域スポーツクラブで、社会的に安全で包摂的な場が実現・評価されているかを測る指標を整理する迅速スコーピングレビュー（抄録）。", "p2": "所属感・社会的包摂・つながりの測定研究はあるが、地域スポーツの場で安全で包摂的な空間がどう提供・評価されているかの体系的な検討はなかった（抄録）。", "p3": "PRISMAに沿った迅速レビューで、物理的・デジタルな空間を含め、所属感・包摂・社会的および心理的安全の指標と測定法を特定し目録化する（題名・抄録）。", "p4": "未確認（抄録に検索範囲・採用基準・採用文献数の記載なし）。", "p5": "未確認（抄録に結果の記載なし）。地域スポーツクラブ向けの道具箱を作るより大きな事業の中核になると位置づけている（抄録）。", "p6": "未査読のプレプリント。抄録は目的の記述にとどまり、結果と限界は確認できない。", "fun": "地元のスポーツクラブが「誰でも安心して来られる場所」かどうかは、感覚では語られても、測る物差しがほとんどありませんでした。所属感や心理的な安全といった目に見えないものを、どんな質問や記録で測れるかを集めようとしている点が面白い問いです。", "unverified": "採用文献数、抽出された指標の内容、結論はいずれも未確認。"}}, {"id": "pr14", "rank": 14, "headline": "訴訟リスクで独立取締役が大企業へ逃げる", "title": "Flight to Safety: How Litigation Risk Reshapes the Independent Director Labor Market", "url": "https://doi.org/10.2139/ssrn.7597040", "authors": "Jiapin Deng ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Deng, J., & Lu, D. (2026). Flight to Safety: How Litigation Risk Reshapes the Independent Director Labor Market. https://doi.org/10.2139/ssrn.7597040", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "独立取締役に会計不正の個人責任を課した中国の2021年の康美判決を自然実験とし、訴訟リスクが経験豊富な独立取締役を不正歴のある企業から去らせることを示した（抄録）。", "p2": "独立取締役への厳しい個人責任は監視を強める抑止効果が期待される一方、優秀な人材が最も監視の必要な企業を避ける可能性があり、その実証は乏しかった（抄録）。", "p3": "一般化した差の差（generalized difference-in-differences）で、判決の前後で不正歴のある企業と他の企業の独立取締役の移動と後任の経験を比べた（抄録）。", "p4": "経験ある取締役の退任、後任の経験の水準、財務専門家・非国有企業・外部監視の弱い企業での違い、報酬引き上げと役員賠償責任保険の効果を評価した（抄録）。", "p5": "判決後、経験ある独立取締役は不正歴のある企業から体系的に去り、後任は経験の浅い人になった。この選別は財務専門家、非国有企業、外部監視の弱い企業で強かった。高リスク企業は報酬を上げ保険を買ったが、人材の引き留めに効いたのは保険だけだった（抄録）。", "p6": "未査読のプレプリント。効果の大きさと標本の規模は抄録に記載がなく未確認。取締役の質を経験で測ることの妥当性も残る疑問。", "fun": "不正をした会社の社外取締役が個人で巨額の賠償を命じられると、経験豊富な人ほどリスクのある会社から逃げ出し、本当に見張りが必要な会社に未熟な人しか残らない、という皮肉な結果です。罰を重くすることが逆効果を生む場合がある、という制度設計の難しさを示しています。", "unverified": "差の差の推定値、標本の企業数・期間は抄録からは未確認。"}}, {"id": "pr15", "rank": 15, "headline": "自動運転タクシー選択を左右するのは安全感と信頼", "title": "The roles of perceived safety and trust in the choice of fully automated taxis", "url": "https://doi.org/10.2139/ssrn.7593801", "authors": "Hao Yin ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Yin, H., Cherchi, E., Nazemi, M., Rababah, B., Zhao, T., & Farooq, B. (2026). The roles of perceived safety and trust in the choice of fully automated taxis. https://doi.org/10.2139/ssrn.7593801", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "自動運転タクシーを選ぶかどうかに、車両の故障に対する安全感と、犯罪などに対する身の安全感が、信頼を通じて効くことを英国とカナダの2都市で示した（抄録）。", "p2": "安全は自動運転車で最も重要な要因とされるのに、その普及への役割は比較的調べられていなかった（抄録）。", "p3": "英ニューカッスルと加トロントで同じ表明選択実験を行い、車両の安全感（PVS）・個人の安全感（PPS）・信頼（T）の3つの潜在心理因子を含むハイブリッド選択モデル（HCM）を推定した（抄録）。", "p4": "統計的な適合度と、50個の保留標本の平均による予測力でモデルを評価し、混合ロジットと比べた（抄録）。", "p5": "PVSとPPSは信頼に有意な正の効果を持ち、信頼は自動運転タクシーの選択に有意な正の効果を持った。ただしHCMの予測力は統計結果ほど高くなく、集計レベルでは簡潔な混合ロジットの方が望ましい場合があり、特定の人口集団に注目するときは階層的な潜在変数構造のHCMが優れていた（抄録）。", "p6": "未査読のプレプリント。表明選好の実験であり実際の利用行動ではない。2都市の標本数と属性は抄録に記載がなく未確認。", "fun": "無人のタクシーに乗るとき、人は「機械が壊れないか」だけでなく「車内で誰かに襲われないか」も心配します。その二つの安心が信頼を通じて選択に効くという結果に加えて、凝ったモデルが当てはまりは良くても予測では単純なモデルに負けることがある、という正直な報告が面白い点です。", "unverified": "各都市の回答者数、係数の大きさ、予測力の具体的な数値は抄録からは未確認。"}}, {"id": "pr16", "rank": 16, "headline": "集約方式しだいで大規模熟議は極端な意見を誘う", "title": "How Aggregation Functions in Mass-Deliberation Systems Can Incentivize Extremes: A Hypothesis on Strategy-Induced Opinion Polarization", "url": "https://doi.org/10.5281/zenodo.23297245", "authors": "Behrens ほか", "venue": "Zenodo", "date": "2026-10-11", "apa": "Behrens, J., Kistner, A., Nitsche, A., & Swierczek, B. (2025). How Aggregation Functions in Mass-Deliberation Systems Can Incentivize Extremes: A Hypothesis on Strategy-Induced Opinion Polarization. Interaktive Demokratie – Association for Interactive Democracy. https://doi.org/10.5281/ZENODO.23297245", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "大規模なオンライン熟議で意見を集約する方式そのものが、参加者に極端な意見を出す誘因を与えうるという仮説を示す（抄録）。", "p3": "分位点による集約、二乗距離の最小化、絶対距離の最小化を数値例で比べ、戦略的に極端な投稿1件が表示される代表意見をどれだけ動かすかを示す（抄録）。", "p5": "1件の極端な投稿で代表意見と意見分布の見え方が大きく歪みうることを例示し、分極化につながるという広い効果は推測にとどまると明記している（抄録）。", "fun": "みんなの意見の「真ん中」を出す計算方法によって、わざと端っこの意見を言った人が得をすることがある、という指摘です。平均は外れ値に引っ張られ、中央値は引っ張られにくいという高校数学の性質が、民主的な話し合いの設計の問題に直結しているのが面白い点です。", "unverified": "本文は未読。数値例の具体的な値と、LLMについての議論の中身は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "個人向けAI同士が人を介して干渉し合う問題", "title": "When personal AI creates a multi-agent problem", "url": "https://doi.org/10.5281/zenodo.23287705", "authors": "Fisher, David Jonas", "venue": "Zenodo", "date": "2026-10-10", "apa": "Fisher, D. J. (2026). When personal AI creates a multi-agent problem. Zenodo. https://doi.org/10.5281/ZENODO.23287705", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "別々の個人向けAIが、利用者どうしの人間関係を介して互いに影響し合う「人を介したAIの結合」を、評価上の問題として整理した概念論文（抄録）。", "p3": "対人干渉や共同介入の効果と、一方向・再帰的なAIの結合とを区別し、個々のAIと利用者の境界で集めた証拠がどんな条件で十分かを論じる（抄録）。", "p5": "実証ではなく概念的な議論であり、こうした結合が有害であるとも、どれほど起きるかも主張しないと明記している（抄録）。", "fun": "AIどうしは一度も通信していないのに、夫婦や友人がそれぞれのAIの助言で行動を変えると、相手のAIの次の助言まで変わってしまう、という見方が新鮮です。一台ずつ正しくテストしても、二台が同じ人間関係の中で動くと別の結果が出るかもしれない、という「組み合わせの問題」を指摘しています。", "unverified": "本文は未読。具体的な分類の定義や事例は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "物理整合なGNSS偽装は物理検査で見抜けない", "title": "Limits of Physics-Based GNSS Fault Detection in Multirotor UAV Simulation", "url": "https://doi.org/10.31224/8484", "authors": "Braiden Martin ほか", "venue": "engrXiv", "date": "2026-10-11", "apa": "Martin, B., Pendyala, N., & Joel, I. (2026). Limits of Physics-Based GNSS Fault Detection in Multirotor UAV Simulation. https://doi.org/10.31224/8484", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "マルチロータUAVのシミュレーションで、物理的に不自然に見えない偽のGNSS軌跡を機体上の限られたセンサでどこまで検出できるかを調べた（抄録）。", "p3": "GNSSと加速度の不一致、カルマンフィルタの正規化イノベーション二乗（NIS）、気圧高度との整合、2種類の物理スコアの5つの監視を、正常飛行で閾値を固定してから7,480回の評価飛行で比べた（抄録）。", "p5": "共分散で正規化した物理スコアは事前定義パネルで82.9%検出したが別の検証用600回では41.5%に下がり、ゆっくりした水平ずれ400回ではNISが9回検出しただけで他は0回だった（抄録）。", "fun": "偽の位置情報でも、なめらかに少しずつずらせば速度や加速度の変化がもっともらしく見え、見破れないという結果です。「物理法則に反していないか」で嘘を見抜く方法には、比べる別のセンサとモデルの不確かさという限界があることを数字で示しています。", "unverified": "本文は未読。誤報率の詳しい条件と各監視の定式化は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "CNT混入エポキシで舗装に埋め込むひずみセンサ", "title": "Experimental characterization of carbon nanotubes modified epoxy mixture for piezoresistive sensing: Signal quality and sensing durability", "url": "https://doi.org/10.2139/ssrn.7597035", "authors": "Ke Wang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Wang, K., Zheng, K., Wang, T., Hao, G., Liu, P., & Zhang, L. (2026). Experimental characterization of carbon nanotubes modified epoxy mixture for piezoresistive sensing: Signal quality and sensing durability. https://doi.org/10.2139/ssrn.7597035", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "カーボンナノチューブを混ぜたエポキシ混合物（CEMix）を舗装に埋め込むセンサとして使うため、信号品質と耐久性を評価する枠組みを示した（抄録）。", "p3": "感度と信号品質（安定性、信号雑音比、波形の忠実さ）を合わせた性能評価と、舗装向けの力学性能・繰返し載荷・老化を含む二重の耐久性評価を組み立てた（抄録）。", "p5": "感度と信号品質は同時には向上しないこと、使用荷重の範囲では損傷しないこと、老化は主に感度を下げ信号品質の劣化は比較的小さいことを示した（抄録）。", "fun": "押されると電気抵抗が変わる「圧抵抗」という性質を使い、道路そのものをはかりにする研究です。反応が大きいほど良いセンサとは限らず、ノイズや波形の崩れとのつり合いが大事だという点は、身近なマイクの音量と音質の関係にも似ています。", "unverified": "本文は未読。具体的な感度や信号雑音比の数値は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "道路・橋の補修モルタルに自己センシング機能", "title": "Synergistic reinforcement and self-sensing of alkali-activated slag repair mortar with MWCNTs and calcium carbonate whiskers", "url": "https://doi.org/10.2139/ssrn.7597036", "authors": "Wenjing Kuang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Kuang, W., Diao, H., Yan, B., Chen, F., Shi, W., & Ling, T. (2026). Synergistic reinforcement and self-sensing of alkali-activated slag repair mortar with MWCNTs and calcium carbonate whiskers. https://doi.org/10.2139/ssrn.7597036", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "多層カーボンナノチューブと炭酸カルシウムウィスカーを加えたアルカリ活性スラグ補修モルタルで、補修と自己センシングを両立させた（抄録）。", "p3": "配合を変えた試料の力学・界面・電気・圧抵抗・微視構造の特性を調べ、FTIRとSEM-EDSで反応系を確認した（抄録）。", "p5": "E-9が28日で界面曲げ強度4.83 MPa、E-8が基準より43.19%低い電気抵抗率と最高の圧抵抗感度、E-5が最良の繰返し安定性を示し、感度・安定性・再現性の間にトレードオフがあった（抄録）。", "fun": "ひび割れを直す材料に、自分の傷み具合を電気で知らせる機能まで持たせようという発想です。導電性の高さだけでなく、荷重がかかったときに電気の通り道が可逆的につなぎ替わるかどうかが感度を決める、という説明が面白い点です。", "unverified": "本文は未読。各配合の具体的な組成は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "玉石地盤の泥水シールド切羽崩壊を模型とDEMで", "title": "Face failure of slurry shield tunnelling in cobble ground under dynamic cutterhead excavation: model test and DEM simulations", "url": "https://doi.org/10.2139/ssrn.7593823", "authors": "Jiwen Wang ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Wang, J., Liu, X., Zhou, X., Liu, D., Xiong, F., & Zhong, Z. (2026). Face failure of slurry shield tunnelling in cobble ground under dynamic cutterhead excavation: model test and DEM simulations. https://doi.org/10.2139/ssrn.7593823", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "玉石を含む地盤での泥水式シールドの切羽崩壊を、カッター回転などの掘進過程を含む模型実験とDEMで調べた（抄録）。", "p3": "1g模型実験と、粒度構造・シールド前進・カッター回転・泥水圧・排土を組み込んだ3次元DEMを、直接せん断試験で較正し模型で検証した（抄録）。", "p5": "限界支保圧は開口率と土被り比（C/D）とともに増え、均質土や静的支保のモデルより高く、C/D≥1.5では崩壊が地中にとどまった（抄録）。", "fun": "大きな石が混じった地盤では、カッターがかき回すことで粒子が動き、アーチのように力を支える構造（アーチ作用）が弱まります。トンネルの前面を押さえる圧力が、砂だけの地盤の常識より高く必要になるという結果は、粒の大きさのばらつきの大切さを示しています。", "unverified": "本文は未読。限界支保圧の具体的な数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "熱-力学連成の準脆性破壊を適応細分化で解く", "title": "Coupled Thermo-Mechanical Modelling of Quasi-Brittle Fracture with Adaptive Refinement Using the Isoparametric Mapped Scaled Boundary Finite Element Method and a Regularized Phase-Field Cohesive Zone Model", "url": "https://doi.org/10.2139/ssrn.7593755", "authors": "Shekhar Gautam ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Gautam, S., Natarajan, S., Ooi, E. H., Javidan, F., Song, C., & Ooi, E. T. (2026). Coupled Thermo-Mechanical Modelling of Quasi-Brittle Fracture with Adaptive Refinement Using the Isoparametric Mapped Scaled Boundary Finite Element Method and a Regularized Phase-Field Cohesive Zone Model. https://doi.org/10.2139/ssrn.7593755", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "準脆性材料の熱と力学が連成した破壊を、位相場の結合力モデル（PF-CZM）と等パラメトリック・スケールド境界有限要素法（SBFEM）で解く枠組みを作った（抄録）。", "p3": "親要素のライブラリで高価な固有値問題を避ける等パラメトリックSBFEMに、任意多角形を扱える階層的な適応細分化と、熱伝導の劣化関数を組み合わせ、交互解法で解いた（抄録）。", "p5": "混合モード破壊や熱によるひび割れなど5つのベンチマークで、実験値や参照解とよく一致したと報告している（抄録）。", "fun": "ひび割れは「どこに・どの向きに」進むか前もって分からないため、計算でも難題です。ひびを境界線ではなく、ぼんやりした帯（位相場）として表し、必要な場所だけ網目を細かくする工夫で、温度とひび割れが影響し合う様子を追えるようにしています。", "unverified": "本文は未読。一致の程度を示す数値は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "代理モデル誘導の生成モデルで多物理逆問題", "title": "Surrogate-Guided Generative Modeling with Physics Verification for Expensive Multiphysics Inverse Problems", "url": "https://doi.org/10.31224/8480", "authors": "Hyungjun Kim ほか", "venue": "engrXiv", "date": "2026-10-10", "apa": "Kim, H., Persico, A., Burnett, L., Forget, B., & Radaideh, M. I. (2026). Surrogate-Guided Generative Modeling with Physics Verification for Expensive Multiphysics Inverse Problems. https://doi.org/10.31224/8480", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "少数の高精度CFD計算から候補状態の分布を生成し、代理モデルで導いて多物理の逆問題を解く枠組みを示した（抄録）。", "p3": "表形式の生成モデルがCFDの空間パターンを学び、微分可能な代理モデルが生成を誘導し、全候補は核計算ソルバSIMULATE3で独立に検証する（抄録）。", "p5": "BEAVRSベンチマークの燃料集合体の湾曲推定で、基準の検出器RMS誤差約5.1%、データ総当たりの4.2%に対し、生成最適化で検証済みの最良値をさらに下げた（抄録）。", "fun": "計算の重いシミュレーションを何百回も回す代わりに、少ない結果から「ありそうな候補」をAIに作らせ、最後は必ず本物の物理計算で確かめる、という分業が要点です。AIは探索の道案内だけをし、判定は物理に任せるので、もっともらしい間違いを避けられます。", "unverified": "本文は未読。生成最適化で得た最良RMSの正確な値は抄録の途中で切れており未確認。"}}, {"id": "pr24", "rank": 24, "headline": "内部孤立波が海底斜面に与える動的応答", "title": "Dynamic Response of Slopes with Different Gradients under Internal Solitary Waves", "url": "https://doi.org/10.2139/ssrn.7593740", "authors": "Hai-lei Kou ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Kou, H.-l., Lu, J., Wang, Y., & An, Z. (2026). Dynamic Response of Slopes with Different Gradients under Internal Solitary Waves. https://doi.org/10.2139/ssrn.7593740", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "南シナ海北部を想定し、内部孤立波が勾配の異なる海底斜面に当たったときの流れと地盤の動的応答を密度成層水槽で調べた（抄録）。", "p3": "5°・10°・15°の斜面で、流れ場、過剰間隙水圧、土圧を計測した（抄録）。", "p5": "砕波は5°・10°で巻き波型、15°で崩れ波型に変わり、5°から10°で斜面中腹の過剰間隙水圧の変動は表層31%・深層22%、土圧は61%・78%増えた（抄録）。", "fun": "海の中には、塩分や温度の違う層の境目を伝わる見えない大波（内部波）があります。それが斜面で砕けると海底の土の中の水圧が下がり、斜面の安定に影響するという、海面からは見えない現象を水槽で再現している点が面白いです。", "unverified": "本文は未読。15°での土圧変化の値は抄録の途中で切れており未確認。"}}, {"id": "pr25", "rank": 25, "headline": "採炭沈下の学習を地下水沈下へ転移", "title": "Transfer Learning with Metaheuristic-Optimized LightGBM for Multi-type Ground Subsidence Prediction: Generalization from Coal Mining to Groundwater-Induced Subsidence", "url": "https://doi.org/10.2139/ssrn.7593606", "authors": "Shuaifeng Yin ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Yin, S., wang, p., Wang, E., YAN, Y., & Han, K. (2026). Transfer Learning with Metaheuristic-Optimized LightGBM for Multi-type Ground Subsidence Prediction: Generalization from Coal Mining to Groundwater-Induced Subsidence. https://doi.org/10.2139/ssrn.7593606", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "採炭による地盤沈下で学習したLightGBMを、転移学習で地下水の過剰揚水による沈下の予測に使えるようにした（抄録）。", "p3": "採炭沈下163例を元領域、滄州の地下水沈下574例を目標領域とし、同時分布適応で領域差を縮め、HGSとICAの二段階でハイパーパラメータを最適化した（抄録）。", "p5": "領域間の最大平均差は0.3917から0.1234に下がり、目標領域でAUC 0.9912、40標本のみでもAUC 0.9123と転移なしより12.9ポイント高かった（抄録）。", "fun": "炭鉱の掘削で起きる沈下と、井戸の汲み上げで起きる沈下は原因が違いますが、「どれだけ乱されたか」「これまでの累積」「材料の性質」という共通の要因があるので、片方で学んだ知識をもう片方に移せる、という考え方が面白い点です。", "unverified": "本文は未読。不確かさの低減率の正確な値は抄録の途中で切れており未確認。"}}, {"id": "pr26", "rank": 26, "headline": "為替ヘッジの効果は取引網を通じて波及する", "title": "Foreign Exchange Risk Management Spillovers Across the Production Network", "url": "https://doi.org/10.2139/ssrn.7590643", "authors": "Wentong Chen", "venue": "SSRN", "date": "2026-10-10", "apa": "Chen, W. (2026). Foreign Exchange Risk Management Spillovers Across the Production Network. https://doi.org/10.2139/ssrn.7590643", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の為替ヘッジが自社だけでなく、取引網を通じて仕入先と顧客の業績も安定させることを示した（抄録）。", "p3": "資金調達コストが財務状態に依存する生産ネットワークのモデルを作り、10-Kから手作業で集めた為替デリバティブのデータを取引関係と結びつけて検証した（抄録）。", "p5": "顧客（仕入先）がヘッジを始めると、自社の売上（売上原価）の変動性が対照企業より3.1ポイント下がり、ヘッジは借入コスト経路による変動増幅の4分の1から5分の2を打ち消した（抄録）。", "fun": "保険のようなヘッジは自分を守るためのものと思いがちですが、取引先にまで安定をおすそ分けしている、という発見です。特に多くの企業に部品を供給する中心的な会社がヘッジすると波及が大きいという点は、ネットワークの「ハブ」の重要さを示しています。", "unverified": "本文は未読。データの企業数と期間は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "資本主義の型で銀行DXと金融安定の関係が変わる", "title": "Varieties of Capitalism and the Digital Transformation of Banking: A Longitudinal Analysis of Financial Stability", "url": "https://doi.org/10.2139/ssrn.7597048", "authors": "Thiago Fabricio Felipe ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Felipe, T. F., Kaya, M., Mathews, S., & Torres de Oliveira, R. (2026). Varieties of Capitalism and the Digital Transformation of Banking: A Longitudinal Analysis of Financial Stability. https://doi.org/10.2139/ssrn.7597048", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "銀行のデジタル化と財務安定性の関係が、資本主義の制度類型によって異なることを示した（抄録）。", "p3": "33か国57行の2007〜2024年を対象に、Zスコアで安定性を、年次報告書のキーワードでデジタル化を測り、制度類型ごとに線形回帰を推定した（抄録）。", "p5": "9つの類型で関係は正・弱い・負とまちまちで、時間トレンドを入れると正の関係のいくつかは頑健でなくなった（抄録）。", "fun": "同じデジタル化でも、国の経済の仕組みによって銀行が安定したりしなかったりする、という結果です。年次報告書の言葉の数を数えてデジタル化を測るという方法も、文章をデータとして扱う身近な工夫です。", "unverified": "本文は未読。類型ごとの係数の値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "ゲームのプレイ時間は市場到達と評価に非対称に効く", "title": "The Asymmetric Conversion of Digital Time: Temporal Affordance Architecture in Video Games", "url": "https://doi.org/10.2139/ssrn.7597179", "authors": "Yue Meng-Lewis ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Meng-Lewis, Y., & Abolhasani, M. (2026). The Asymmetric Conversion of Digital Time: Temporal Affordance Architecture in Video Games. https://doi.org/10.2139/ssrn.7597179", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ゲームの遊べる時間に関わる特徴が、市場での見えやすさとレビューの好意度に非対称に関係することを示した（抄録）。", "p3": "2つの公開タイトル単位データを結合し、記述分析、HC3標準誤差のOLS、繰り返し遊ぶ性質のスプライン、探索的な5類型のk平均法で分析した（抄録）。", "p5": "クリア要素と延長要素はレビュー数や推定所有者数と正に関係するが好意度とはほとんど関係せず、本編1時間あたりの価格は見えやすさと負に関係した（抄録）。", "fun": "長く遊べるゲームは「たくさん売れて話題になる」けれど「高く評価される」とは限らない、という違いを数字で示しています。売れることと好かれることは別物、という身近な感覚を、時間という切り口で確かめている点が面白いです。", "unverified": "本文は未読。データの出所と標本数は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "絵カードによるウェルビーイング測定の妥当性", "title": "Validating exploratory visuals as concept elicitation tools: A semiotic analysis of agreement and interpretive diversity in the My Story Cards wellbeing instrument", "url": "https://doi.org/10.21203/rs.3.rs-11045923/v1", "authors": "Jude Page ほか", "venue": "Research Square (In Review)", "date": "2026-10-11", "apa": "Page, J., Broady, T., Barr, M., & de Leeuw, E. (2026). Validating exploratory visuals as concept elicitation tools: A semiotic analysis of agreement and interpretive diversity in the My Story Cards wellbeing instrument. https://doi.org/10.21203/rs.3.rs-11045923/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ウェルビーイング測定ツール「My Story Cards」の絵カード14枚が、意図した概念を伝えているかを検証した（抄録）。", "p3": "心理学専攻の1年生100人がオンラインで絵と対応する文の手がかりを解釈し、自由記述を一致度のコーディング、再帰的テーマ分析、社会記号論の枠組みで分析した（抄録）。", "p5": "絵の概念の認識、解釈の収束の程度、伝わりやすさに関わる特徴を検討した（抄録。具体的な結果は抄録の途中で切れており未確認）。", "fun": "言葉にしにくい気持ちを絵で引き出す道具は便利ですが、作った人の意図どおりに絵が読まれているかは意外と確かめられていません。同じ絵から人によって違う意味を読み取ること自体を、欠点ではなく情報として扱おうとする姿勢が面白い点です。", "unverified": "本文は未読。主要な結果（一致率など）は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "移民の技能構成と地域物価の関係", "title": "Immigration, Skill Composition, and Regional Prices: Evidence from U.S. MSAs, 2008–2023", "url": "https://doi.org/10.2139/ssrn.7593835", "authors": "Catalina Amuedo-Dorantes ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Amuedo-Dorantes, C., Cai, Z., & Kaushal, N. (2026). Immigration, Skill Composition, and Regional Prices: Evidence from U.S. MSAs, 2008–2023. https://doi.org/10.2139/ssrn.7593835", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "移民が地域の物価に与える影響は技能によって正反対で、全体の移民比率では見えなくなることを示した（抄録）。", "p3": "米国256都市圏の2008〜2023年（2020年除く）について、地域価格平価とACSを用い、過去の定住パターンと出身国・技能別の全国動向によるシフトシェア操作変数で推定した（抄録）。", "p5": "低技能移民は総合物価・財・公共料金を下げ、高技能移民はその他サービスや公共料金を上げ、低技能移民は先に来た低技能移民の賃金を押し下げ高技能の自国民の雇用と賃金を上げた（抄録）。", "fun": "「移民が増えると物価はどうなるか」という問いに、全体平均ではほぼゼロでも、中身を分けると下げる力と上げる力が打ち消し合っていた、という結果です。平均だけ見ると大事な違いを見落とす、という統計の基本を示す好例です。", "unverified": "本文は未読。効果の大きさの数値は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "厳寒は都市の交通電動化を遅らせるか", "title": "Does extreme cold slow transport electrification? Evidence from Chinese cities", "url": "https://doi.org/10.2139/ssrn.7593814", "authors": "Jun Li ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Li, J., Song, Z., & Wang, S. (2026). Does extreme cold slow transport electrification? Evidence from Chinese cities. https://doi.org/10.2139/ssrn.7593814", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "厳しい寒さが中国の都市で電気自動車の販売を減らすことを、識別戦略つきで示した（抄録）。", "p3": "2017〜2023年の日次気象から都市別の極寒指数を作り、EV販売・充電設備・政策・オンラインレビューと結合し、二元固定効果と水蒸気量×緯度の操作変数で推定した（抄録）。", "p5": "極寒指数1単位の上昇でEV販売は約0.76%減り、LLMで処理したレビューから航続距離・経済・下取り価格への不安が増すことが示された（抄録）。", "fun": "電池は寒さに弱く、冬に航続距離が縮むことはよく知られていますが、それが実際の売れ行きを下げているかを気象データで確かめています。口コミをAIで読み取って「なぜ買わないのか」まで探っている点も今風です。", "unverified": "本文は未読。都市数と充電設備の効果の大きさは未確認。"}}, {"id": "pr32", "rank": 32, "headline": "自治体の気候適応計画を支える神経記号型マルチエージェント", "title": "A neuro-symbolic multi-agent platform for municipal climate adaptation planning", "url": "https://doi.org/10.2139/ssrn.7593610", "authors": "Jimmy FLOREZ ZULUAGA ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "FLOREZ ZULUAGA, J., Escobar Soto, J. F., Ortega Pabon, J. D., & Vargas-Bonilla, J. F. (2026). A neuro-symbolic multi-agent platform for municipal climate adaptation planning. https://doi.org/10.2139/ssrn.7593610", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "コロンビア・アンティオキア県の自治体の気候変動適応計画を自動生成する、神経記号型のマルチエージェント基盤を作った（抄録）。", "p3": "GIS、地域データの構造化された保管庫、専門知識、規則による監査、範囲を限ったLLMの補助、決定論的な文書生成を組み合わせ、意味解釈と規制の検証を文章生成から分離した（抄録）。", "p5": "125自治体での実行、専門家レビュー、外部機関の評価で、データ整備の時間が99%超短縮し、定義した手順の範囲で規制と次元の整合性が100%となった（抄録）。", "fun": "AIに文章を丸ごと書かせると数字の間違いや根拠のない提案が混ざりがちです。そこで、数字のチェックはルールで、文章作りは決まった手順で行い、AIには意味の解釈だけを任せるという役割分担で、行政文書の信頼性を保とうとしています。", "unverified": "本文は未読。外部評価の具体的な結果は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "住宅協同組合のエネルギー転換をLLM補助のABMで", "title": "Energy Transition Decision-Making Process in Czech and Polish Housing Cooperatives: LLM Assisted Agent-Based Model Specification", "url": "https://doi.org/10.5281/zenodo.23271040", "authors": "Michal Nesládek ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-09", "apa": "Nesládek, M., Bełch, W., Stará, S., & Jedon, R. (2026). Energy Transition Decision-Making Process in Czech and Polish Housing Cooperatives: LLM Assisted Agent-Based Model Specification. Zenodo. https://doi.org/10.5281/ZENODO.23271040", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "チェコとポーランドの住宅協同組合のエネルギー転換の意思決定を、LLMで補助したエージェントベースモデル（LLM-ABM）として仕様化した技術文書（抄録）。", "p3": "理論的基盤、エージェントの特性、モデル構成、入力データ、パラメータ、シミュレーション手順を記述し、最終投票ではなく態度形成と熟議に焦点を当てる（抄録）。", "p5": "仕様書の第1.1版で、シミュレーション結果は後の版に含めるとしている（抄録）。", "fun": "集合住宅の住民が断熱改修や太陽光導入に賛成するまでの話し合いを、AIの住民たちに再現させようという計画です。投票結果よりも、意見がどう形づくられるかを追おうとしている点が、社会の合意形成を考えるうえで面白いところです。", "unverified": "本文は未読。結果はまだ報告されていない。"}}, {"id": "pr34", "rank": 34, "headline": "研究者行動から科学の知識市場をマルチエージェントで再現", "title": "Scientific Liquidity Agents: A Multi-Agent Framework for Modeling Knowledge Markets in Scientific Ecosystems", "url": "https://doi.org/10.5281/zenodo.23287558", "authors": "Wu, Koutian", "venue": "Zenodo", "date": "2026-10-10", "apa": "Wu, K. (2025). Scientific Liquidity Agents: A Multi-Agent Framework for Modeling Knowledge Markets in Scientific Ecosystems. Zenodo. https://doi.org/10.5281/ZENODO.23287558", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "研究者の行動をLLMエージェントで模擬し、科学の知識市場を再現するマルチエージェント枠組みを提案した（抄録）。", "p3": "信念・欲求・意図（BDI）の枠組みで異質な研究者エージェントを作り、分野をまたいで知識を橋渡しする「認識論的裁定者」エージェントを導入した（抄録）。", "p5": "10エージェント・100ステップで280本の論文を生み、裁定者は平均3.0分野、専門家は1.0分野にまたがるという役割分化が生じた（抄録）。", "fun": "株式市場のシミュレーションの考え方を、論文が生まれる科学の世界に持ち込んでいます。異なる分野をつなぐ研究者が「市場の摩擦」を減らすという見立ては、学際研究の役割を経済のことばで説明する試みとして面白いです。", "unverified": "本文は未読。規模が小さく、現実との照合の方法は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "LLMの意識の自己報告は作り手の設定に従う", "title": "Same Model, Different Wrapper: A Preregistered Demonstration That Self-Reports of Consciousness in Two Open-Weights Language Models Follow Their Builders' Choices", "url": "https://doi.org/10.5281/zenodo.23294673", "authors": "Batat, Erez", "venue": "Zenodo", "date": "2026-10-11", "apa": "Batat, E. (2026). Same Model, Different Wrapper: A Preregistered Demonstration That Self-Reports of Consciousness in Two Open-Weights Language Models Follow Their Builders' Choices (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.23294673", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "LLMが「意識がある」と自己報告するかどうかは、作り手の訓練と周囲の文章の設定で決まってしまうことを、事前登録した実験で示した（抄録）。", "p3": "Qwen2.5-7BとMinistral 3 8Bに、自身の経験に関する15の二択質問を8条件で各10回尋ね、1モデル1,200回答を規則で採点した（抄録）。", "p5": "既定の設定では150回答中ゼロだったが、強いペルソナ指示でQwen 53.3%・Ministral 30.0%、助手訓練前の基盤モデルでも25.3%・22.0%が経験を主張した（抄録）。", "fun": "AIに「あなたに心はありますか」と聞いても、その答えは作り手の設定次第で変わる、という実験です。答えを変えるのが一文の指示で十分という点は、言葉による自己申告がいかに外から操作できるかを示しています。", "unverified": "本文は未読。8条件の詳細と人間評定者の一致度の数値は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "LLMの記憶選択で問いを知る価値を測る", "title": "The Value of Perfect Information about the Query in Budget-Constrained LLM Memory", "url": "https://doi.org/10.5281/zenodo.23291859", "authors": "Fu, Hao", "venue": "Zenodo", "date": "2026-10-11", "apa": "Fu, H. (2026). The Value of Perfect Information about the Query in Budget-Constrained LLM Memory (Version v2). Zenodo. https://doi.org/10.5281/ZENODO.23291859", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "トークン予算の限られたLLMの記憶で、質問を知ってから記録を選ぶことの価値を「完全情報の期待価値（EVPI）」として測った（抄録）。", "p3": "履歴を固定長のかたまりに分け、各質問に必要な正解根拠を既知として、質問を知らない選択と知っている選択の最適な網羅率の差を計算した（抄録）。", "p5": "LoCoMo・FairytaleQA・ContractNLIで、EVPIは履歴長の約1〜17%の予算で51.27〜87.67ポイントに達し、2つのLLMの正答率は40.74〜55.25ポイント高かった（抄録）。", "fun": "テスト前に何が出るか分かっていれば、ノートのどこを覚えればよいか絞れます。その「出題を知っていることの価値」を、経済学の情報の価値という考え方で測っているのが面白い点で、覚えられる量が少ないほど価値が大きくなります。", "unverified": "本文は未読。人手確認の規模は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "対人同調を解釈するシステムの階層的規制枠組み", "title": "Beyond Rapport: A Layered Regulatory Framework for Interpersonal Synchrony", "url": "https://doi.org/10.2139/ssrn.7597390", "authors": "Nastaran Saffaryazdi ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Saffaryazdi, N., Karai, Z., Broadbent, E., Lambert, A., & Billinghurst, M. (2026). Beyond Rapport: A Layered Regulatory Framework for Interpersonal Synchrony. https://doi.org/10.2139/ssrn.7597390", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "対話エージェントや職場のウェルビーイング監視が人の同調を読み取る際の妥当性の問題に対し、検出システムが満たすべき形式的な構成を提案した（抄録）。", "p3": "同調を自律神経・運動・表象の3層の資源制約つき過程として捉える「内受容-表象スタック（IRS）」を示し、出所の帰属・層横断の特徴づけ・持続性の監査の3段階の参照構成を作った（抄録）。", "p5": "実際の検出システムではなく理論的な提案で、5つの反証可能な予測と実証の道筋を示している（抄録）。", "fun": "二人の動きや心拍がそろうことを「仲が良い」証拠とみなしがちですが、同じ音楽を聞いているだけでもそろいます。本当に気持ちが通っているのか、無理に合わせているだけなのかを区別すべきだという指摘は、職場でAIが人を見張る時代に大切な視点です。", "unverified": "本文は未読。予測の具体的な内容は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "看護師燃え尽きの媒介効果を共分散行列から再検証", "title": "Questionable mediated effect of care-resistant behavior in dementia patients on nurses’ occupational burnout: A comment on Ding et al. (2026)", "url": "https://doi.org/10.31234/osf.io/cqx72_v1", "authors": "Kimmo Sorjonen", "venue": "PsyArXiv", "date": "2026-10-10", "apa": "Sorjonen, K. (2026). Questionable mediated effect of care-resistant behavior in dementia patients on nurses’ occupational burnout: A comment on Ding et al. (2026). https://doi.org/10.31234/osf.io/cqx72_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "認知症患者のケア拒否が看護師の燃え尽きにつながるという既発表の媒介モデルを、公表された共分散行列から再検討したコメント（抄録）。", "p3": "Ding et al.の共分散行列を使い、方向性のある媒介メカニズムを仮定しない別の潜在変数モデル（中核的自己評価を共通因子とするモデル）で同じデータを再現できるかを調べた（抄録）。", "p5": "観測された共分散構造は別のモデルでも同等に説明でき、観察データだけでは心理メカニズムの優劣を決められないと結論した（抄録）。", "fun": "同じ相関のパターンでも、「AがBを引き起こす」という説明と「AもBも共通の性格の表れ」という説明の両方が当てはまることがあります。論文の数字だけから別の説明を組み立ててみせた点が、相関と因果の違いを考える良い教材になっています。", "unverified": "本文は未読。モデル適合度の数値は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "位相誘導注意で多エージェント交通シミュレーション", "title": "TopoKin: Multi-agent traffic simulation via topology-guided attention and kinematics-constrained tokenization", "url": "https://doi.org/10.2139/ssrn.7593804", "authors": "Shiyu Fang ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Fang, S., Shi, H., Li, Z., Huang, Q., Chen, Z., Yang, Y., Sun, J., Hang, P., Qin, G., Lv, C., & Sun, J. (2026). TopoKin: Multi-agent traffic simulation via topology-guided attention and kinematics-constrained tokenization. https://doi.org/10.2139/ssrn.7593804", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "走行データから閉ループの多エージェント交通シミュレーションを作る際に、車線の衝突関係と運動の語彙という2つの事前知識を組み込んだTopoKinを提案した（抄録）。", "p3": "車線の衝突トポロジーで誘導する注意機構と、対称性による拡張・DTW圧縮・運動学的な絞り込みで作る運動トークンを、既存の自己回帰型シミュレータに加えた（抄録）。", "p5": "SMARTに対して全体的な改善を示し、CATKやTrafficBotsへの移植と4つの追加データでのゼロショット評価で汎用性を示した（抄録）。", "fun": "車の動きを言葉のような「単語」に区切って次の動きを予測する方法に、車線どうしが交差するという道路の構造と、車が物理的にできる動きだけを単語にするという工夫を加えています。距離が近いだけでなく、進路がぶつかる相手を意識させるのが要点です。", "unverified": "本文は未読。改善幅の数値は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "水道のデジタルツインに検証可能な判断カード", "title": "Operational Digital Twins in Water Infrastructure: Decision Cards for Verifiable Maintenance Actions", "url": "https://doi.org/10.5281/zenodo.23285716", "authors": "Yudin, Oleg I.", "venue": "Zenodo", "date": "2026-10-10", "apa": "Yudin, O. I. (2026). Operational Digital Twins in Water Infrastructure: Decision Cards for Verifiable Maintenance Actions (Version v 1.0.). Zenodo. https://doi.org/10.5281/ZENODO.23285716", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "水道事業の運用デジタルツインと維持管理の手順をつなぐ最小限の情報の取り決めとして、「判断カード」を提案する技術ノート（抄録）。", "p3": "デジタルツインの出力を検証可能な保守行動に結びつけるための情報項目を定める概念的な提案（抄録）。", "p5": "概念的な技術ノートであり、現場での検証は報告していないと明記している（抄録）。", "fun": "デジタルツイン（現実の設備を写したコンピュータ上の分身）がどれだけ賢くても、その判断が現場の作業にどうつながったかを後から確かめられなければ信頼されません。判断の根拠を一枚のカードに残すという発想は、記録の大切さを示しています。", "unverified": "本文は未読。カードの具体的な項目は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "人はAIに任せても結果責任を負うとき何を委ねるか", "title": "Trust, Delegation, and Alignment in Humanâ€“AI Decision Making", "url": "https://econpapers.repec.org/RePEc:chu:wpaper:26-11", "authors": "Erik O. Kimbrough ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "人間が結果を負う状況でのAIへの委任と信頼を実験で調べ、人とAIの意思決定分担の設計に実証的根拠を与える。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefの題名検索で見つかった記録の抄録を使用", "preprint": true, "p1": "人が自分の代わりにAIに経済的な選択を任せる実験で、AIの選択が本人とかなり一致していても、人は任せることに強いためらいを示すことを明らかにした（抄録）。", "p2": "AIへの委任が広がるなか、結果の責任を負う人が、どれだけAIに決定を任せたがるか、またAIは本人の好みをどれだけ再現できるかは、同じ実験の中で測られていなかった（抄録）。", "p3": "参加者がChatGPT-4o miniに自分の代わりに選ぶよう指示するプロンプトを書き、危険な選択・異時点間の選択・社会的な配分の3領域でAIに選ばせた。AIの選択を報酬に反映させるのに必要な補償額（受取意思額）を委任へのためらいの顕示的な尺度とし、本人とAIの選択が一致した割合を整合（alignment）の尺度とした（抄録）。", "p4": "同じプロンプトを他の人間が実行する追加実験と、事後にGPT-5.5で行う頑健性の確認を基準として比較した（抄録）。", "p5": "整合が中〜高程度であるにもかかわらず委任へのためらいは大きかった。不一致はモデルの限界だけでなく、短い自然言語のプロンプトで委任できる好みを伝えることの難しさも反映していると示唆された（抄録）。", "p6": "未査読のワーキングペーパー。参加者数、補償額の水準、一致率の具体的な数値は抄録に記載がなく未確認。", "fun": "AIに「私ならこう選ぶ」と説明して選ばせると、かなりの割合で本人と同じ答えを出すのに、人はお金をもらわないと任せたがりません。さらに、同じ説明を人間に渡しても完全には再現されないことから、ずれの原因はAIの能力だけでなく「自分の好みを言葉で伝える難しさ」にある、という指摘が面白い点です。", "unverified": "参加者数、受取意思額の値、一致率の数値はいずれも未確認。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "AIリスクの報道エクスポージャーは株価に織り込まれるか", "title": "Are AI Risks Priced in the U.S. Stock Market? Evidence from Financial News Factors", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.05485", "authors": "Yanhui Shen", "venue": "RePEc NEP", "date": "2026-09-21", "apa": "Shen, Y. (2026). Are AI Risks Priced in the U.S. Stock Market? Evidence from Financial News Factors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.05485", "why": "AIリスクを種類別にニュースから測り、米国株のリターンで価格付けを検証する新しい資産価格の実証。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ構築・ポートフォリオ分析・Fama–MacBeth・解釈と頑健性・結論の節）を読んだ", "preprint": true, "p1": "AIリスクに関するニュースを種類別の要因にして米国株の価格付けを検証し、価格に織り込まれているのは「誤情報」の領域だけで、AIリスクの価格付けは領域ごとに異なることを示した（抄録、§7）。", "p2": "AIリスクは一括りに語られがちで、リスクの種類ごとに企業の株価エクスポージャーが期待リターンに反映されるかは検証されていなかった（§1–2）。", "p3": "2016〜2025年のWSJの記事387,051本から、AI語彙とリスク語彙の同時出現で7,787本を抽出し、LDAのトピックをMIT AI Risk Repositoryの領域に対応づけて4つの日次要因（D2プライバシー・D3誤情報・D4悪用・D6社会経済と環境）を作った。要因の予期しない変化（イノベーション）に対する個別株のベータを推定した（§3–5.2）。", "p4": "NYSE基準の5分位でベータ別の時価加重ポートフォリオを作り、高ベータ−低ベータ（P5−P1）のアルファをCAPMからFF5+UMDまでの5モデルで、Newey–West標準誤差で検定した。Fama–MacBeth回帰でリスクの価格を推定した（§5.3–5.4）。", "p5": "D3だけがP1→P5で単調な順序を保ち、P5−P1の月次アルファはCarhart 0.538%（t=2.16）、FF5 0.526%（1.94）、FF5+UMD 0.575%（2.23）。生の超過リターン差0.429%（t=1.52）は有意でない。D3の価格は別の時系列モデルでも15推定すべて1%水準で有意で、ChatGPT以前の標本でも正だった（§5.3、§6.3、表7・12）。", "p6": "領域の分類は粗く、D6のように方向の異なる語り（雇用、格差、環境）を混ぜている可能性があると著者が述べている（§7）。D3を「AI政策の明確さ」の状態変数とみなす解釈は、トピックの内容とピーク時の出来事からの推論である（§6.1）。", "fun": "「AIの危険」という同じ言葉でも、株価に効いていたのは誤情報や選挙、規制にまつわるニュースだけでした。しかも高いリターンの理由は、AIのルールがはっきりしないときに弱い株を持つことへの「ご褒美」だという説明です。ニュース記事を数えて市場の心配事を測るという手法も面白い点です。", "unverified": "表7・11・12の全数値と付録B、トピック数の選択（§4.2）は詳しく確認していない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "経済学のレポート採点でLLMは見破られるか", "title": "A Turing Test for Grading in Economics: Detection, Grades, and Student Satisfaction in a Blinded Field Experiment", "url": "https://doi.org/10.2139/ssrn.7597401", "authors": "Scott Shane ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Shane, S., Sheremeta, R. M., Wang, S., & Xiong, H. (2026). A Turing Test for Grading in Economics: Detection, Grades, and Student Satisfaction in a Blinded Field Experiment. https://doi.org/10.2139/ssrn.7597401", "why": "盲検のフィールド実験でLLM採点の検出・成績・満足度を比較し、教育でのAI採点の実務判断に直結する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "経済学の授業の採点で、学生はAIの採点と人間の採点を見分けられず、満足度は実際の採点者ではなく「人間が採点した」という思い込みと点数で決まることを、盲検のフィールド実験で示した（抄録）。", "p2": "記述課題は教育効果が高いが採点の負担が大きく、LLMは安く採点とフィードバックを作れるようになったが、学生がそれをどう受け止めるかは実地で検証されていなかった（抄録）。", "p3": "学部の経済学2科目で1学期間、学生37人が24の短い記述課題を出し（846件）、AI採点者3つと人間のTA 3人がすべてを同じ5次元のルーブリックで独立に採点した。学生には無作為に選んだ1つの点数とフィードバックを出所を伏せて見せ、満足度と採点者の種類の推測を答えさせた（抄録）。", "p4": "採点者の種類の識別率、点数の差、満足度と実際の採点者・点数・思い込みの関係で評価した（抄録）。", "p5": "AIのフィードバックは2倍超長く、ぼかし表現が7倍超多く、分類器は99.4%の精度で出所を判別したが、学生の正答率は52.1%で偶然と差がなく（p=0.229）、学期中に向上しなかった。人間は5点満点で0.68点高く採点した。点数を固定すると実際の採点者の効果はほぼゼロになり、人間が採点したと信じた学生は実際にはどちらでも満足度が高かった（抄録）。", "p6": "未査読のワーキングペーパー。学生37人と小規模で、1つの大学の経済学科目に限られる。点数差の向き（どちらが正しい基準か）は設計上識別できないと著者が述べている（抄録）。", "fun": "機械が見ればAIの文章はすぐ分かるのに、学生はまったく見分けられず、当てずっぽうと同じでした。しかも満足度を左右したのは本当の採点者ではなく「人が見てくれた」と信じたかどうかです。AIを使っていることを知らせるかどうかが、信頼の問題になることを示す面白い結果です。", "unverified": "使用したAI採点者のモデル名と、ルーブリックの5次元の内容は抄録からは未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "変革的AI時代の再分配政策を設計する", "title": "Redistributive Policies for the Times of Transformative AI", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.14750", "authors": "Jakub Growiec ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Growiec, J., Prettner, K., & Szkróbka, M. (2026). Redistributive Policies for the Times of Transformative AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.14750", "why": "自動化で労働分配率が下がる局面を想定し、所得・資産格差への政策対応を理論的に比較する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（理論枠組み・政策の検討・結論と表1）を読んだ", "preprint": true, "p1": "変革的AI（TAI）の到来後に格差を抑える再分配政策を、1つの理論枠組みで比較し、計算資源やロボットを含む資本からの収益を広く分配する政策だけが持続的に格差を下げうると論じた（抄録、§4）。", "p2": "広範な自動化で労働分配率が下がり、成長の果実が少数の個人・企業に集中する恐れがあるが、UBIやロボット税など提案されてきた政策を共通の土俵で比べる枠組みがなかった（§1）。", "p3": "産出を物理資本K（計算機・ロボットを含む）と認知的投入S=G(H,AI)で作るCES型の生産関数を置き、人間HとAIの代替弾力性の符号でAIが道具の世界（ω<0）とTAIの世界（0<ω≤1）を分ける。所有の分布と所得の分布を区別して格差を表した（§2.1–2.2、式1〜3）。具体例：TAIの世界では人の認知労働が不要になり、最も遅く増える資本（計算機・ロボット）の所得シェアが1に近づく。", "p4": "政策介入のない3つの将来シナリオを基準に、UBI、ユニバーサル・ベーシック・キャピタル（UBC）、資本・計算・ロボット・トークン税、計算とロボットの許可制、エネルギー税・土地税、消費税、資本の収用が、資本シェアと格差に与える効果を定性的に比べた（§2.5、§3）。", "p5": "表1のまとめでは、UBCは所有の分布そのものに働きかけ、資本シェアが1に達する前に影響できる唯一の政策。資本課税で財源をまかなうUBIも格差を下げる。トークン税など AIソフトへの課税は、豊富で瓶首とならない要素に課すため格差の縮小に最も効果が小さい（§4、表1）。", "p6": "枠組みは一次近似の定性的なもので、選好や市場設計を意図的に特定していない。定量予測、選好に基づく規範的評価、経済からAI開発への帰還効果の分析は今後の課題と著者が述べている（§2冒頭、§4）。", "fun": "AIが人間の頭脳労働を完全に代わりにこなせるようになると、足りなくなるのは人の知恵ではなく計算機やロボットという「機械の数」になります。だから税をかけるならAIの利用量ではなく機械の持ち主に、という結論になる、という筋道が数式一つで見えてくるのが面白いところです。", "unverified": "§3の各政策の数式による分析の細部は読み飛ばした部分がある。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "過去の成功から分岐する指針を学ぶ検索拡張推論", "title": "Guideline Forest: Retrieval-Augmented Reasoning with Experience-Induced Branching Guidelines", "url": "https://doi.org/10.2139/ssrn.7593444", "authors": "jiaxiang chen ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "chen, j., wang, z., zou, m., Wang, Q., & Xu, Z. (2026). Guideline Forest: Retrieval-Augmented Reasoning with Experience-Induced Branching Guidelines. https://doi.org/10.2139/ssrn.7593444", "why": "推論時探索の経験を指針として再利用する手法で、LLMの推論効率を高める方向の提案。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "過去に検証済みの推論の軌跡から共通の戦略を「指針」として取り出し、分岐させて実行することで、LLMの多段推論の精度と効率を高める枠組みGuideline Forestを提案した（抄録）。", "p2": "LLMは新しい問題を解くとき、以前の成功例を再利用せず推論時の探索に頼るため効率が悪く、単一の推論の流れの途中の誤りに弱い（抄録）。", "p3": "新しい問題に対し、正解と整合する過去の推論軌跡を検索し、共通戦略を指針に抽象化する。指針を相補的な複数の枝に書き換えて段階的に実行し、各段階で候補を1つ選んで改良してから共有の推論状態を進める。枝を異なるLLMに割り当てて協調推論もできる（抄録）。", "p4": "GSM8K、MATH-500、MBPP、HumanEvalで、代表的なプロンプト法とワークフロー法を比較対象に、精度とトークン数のトレードオフで評価した（抄録）。", "p5": "Guideline Forestは比較手法を上回り、精度とトークン数の良好なトレードオフを示した。アブレーションでは検索の規模、枝の多様性、段階的な改良、集約が重要な要素だった（抄録）。", "p6": "未査読のプレプリント。具体的な精度の差と使用モデルは抄録に記載がなく未確認。検証済みの軌跡を集める前提がどの分野で成り立つかが残る疑問。", "fun": "数学の問題を解くとき、似た問題の解き方を思い出し、「この型の問題はこう攻める」というコツを取り出してから、いくつかの方針で並行して試す、という人間の勉強法に似ています。毎回ゼロから考えるのではなく経験を使い回すことで、少ない計算で正解に近づけるという点が面白いところです。", "unverified": "各ベンチマークの精度の数値、使用したLLMの種類は抄録からは未確認。"}}, {"id": "pn06", "rank": 6, "field": "経営学", "headline": "規制の不確実性は企業のM&A戦略を変える", "title": "Regulatory Policy Uncertainty and Corporate Strategy: Evidence from M&A", "url": "https://doi.org/10.2139/ssrn.7597039", "authors": "Yanchao Fu ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Fu, Y., Guo, M., Jiang, P., & Wang, X. (2026). Regulatory Policy Uncertainty and Corporate Strategy: Evidence from M&A. https://doi.org/10.2139/ssrn.7597039", "why": "経営者が感じる規制政策の不確実性を直接測定し、企業の戦略行動への影響を示す。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "経営者が感じる資本市場の規制政策の不確実性を調査で直接測り、それが中国企業をM&Aへ向かわせ、研究開発を減らすことを示した（抄録）。", "p2": "政策の不確実性は企業活動を一様に抑えると考えられがちだが、多くの研究は報道などに基づく間接的な指標に頼っており、経営者自身の認識と戦略の関係は直接測られていなかった（抄録）。", "p3": "中国の上場企業への調査で経営者の認識する規制政策の不確実性を測り、M&Aの意向、研究開発の投資意向と実績、資金調達・現金保有の意向との関係を推定した（抄録）。", "p4": "産業の集中度、資金制約、成長機会による違いを調べ、表明した意向が実際のM&A公表を予測するかで、調査が本当の計画を捉えているかを確かめた（抄録）。", "p5": "規制の不確実性はM&Aの傾向を頑健に高め、集中した産業、資金制約の小さい企業、成長機会の大きい企業で効果が大きかった。同時に研究開発の意向と実績の伸びを下げ、資金調達と現金保有の意向を高めた。表明した意向は実際のM&A公表を予測した（抄録）。", "p6": "未査読のプレプリント。調査の回答企業数と時期、因果の識別方法は抄録に記載がなく未確認。", "fun": "ルールがどう変わるか分からないとき、会社は何もしなくなるのではなく、時間のかかる研究開発をやめて、すぐ成果の出る買収に走る、という結果です。不確実さが企業の「時間の使い方」を短期に寄せるという見方が面白い点です。", "unverified": "調査の規模、時期、推定方法（固定効果や操作変数の有無）は抄録からは未確認。"}}, {"id": "pn07", "rank": 7, "field": "経営学", "headline": "DXは環境技術の方向を予防型へ向けるか", "title": "Digital transformation and the direction of corporate green innovation: Pollution prevention versus pollution control", "url": "https://doi.org/10.2139/ssrn.7593734", "authors": "han meini meini ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "meini, h. m., & Chen, A. (2026). Digital transformation and the direction of corporate green innovation: Pollution prevention versus pollution control. https://doi.org/10.2139/ssrn.7593734", "why": "デジタル化がグリーンイノベーションの量だけでなく技術の方向（予防か制御か）を変えるかを検証する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "企業のデジタル化が、環境技術の量だけでなく方向を、汚染を出した後の「制御」より出さない「予防」へと向けることを示した（抄録）。", "p2": "デジタル化とグリーンイノベーションの研究は量に注目しがちで、技術が汚染管理のどの段階に入るかという方向性は区別されていなかった（抄録）。", "p3": "2008〜2023年の中国A株上場企業について、特許技術が汚染管理に入る段階に基づき、汚染予防型と汚染制御型のグリーンイノベーションを区別し、デジタル化の効果を推定した（抄録）。", "p4": "両経路への効果の大きさの違い、リアルタイムの感知能力による媒介、ハイテク企業と重汚染企業での違いを検証した（抄録）。", "p5": "デジタル化は両方を促し、予防型への効果が有意に大きかった。生産・エネルギー・設備・排出の連続的な情報をグリーン技術の機会に変えるリアルタイム感知能力が関係を媒介した。予防型への効果はハイテク企業で強く、重汚染企業では制御型にも追加の反応があった（抄録）。", "p6": "未査読のプレプリント。デジタル化の測り方と識別戦略は抄録に記載がなく未確認。", "fun": "工場の煙突にフィルターを付けるのが「制御」、そもそも汚れを出さない作り方に変えるのが「予防」です。センサで生産の様子を常に見られるようになると、どこで無駄や汚れが生まれているか分かるので、根本から直す予防型の技術が増える、という筋道が分かりやすい点です。", "unverified": "効果の大きさの数値、デジタル化指標の作り方は抄録からは未確認。"}}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "人事施策の受け止め方が発言と熱意を左右する", "title": "HR Attributions and Their Effects on Employee Voice and Work Engagement in Sustainability-oriented Organizations", "url": "https://doi.org/10.2139/ssrn.7593731", "authors": "Nguyen Minh Ha ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Ha, N. M., & Diem, P. T. (2026). HR Attributions and Their Effects on Employee Voice and Work Engagement in Sustainability-oriented Organizations. https://doi.org/10.2139/ssrn.7593731", "why": "HR帰属が人事のリーダー役割と従業員の発言・ワークエンゲージメントを媒介する構造を検証する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "人事部門が変革のリーダー役を担うと、従業員がその人事施策の意図をどう受け止めるか（HR帰属）を通じて、発言とワークエンゲージメントが高まることを、ベトナムの持続可能性志向の企業で示した（抄録）。", "p2": "持続可能な人事管理の研究で、人事の変革リーダーの役割が従業員の行動にどう伝わるか、とくに途上国の文脈での仕組みは十分に調べられていなかった（抄録）。", "p3": "資源ベース論、帰属理論、知覚された組織的支援の理論、人間中心の経営の視点から、「幸福のため」と「業績のため」の2つのHR帰属が、人事の変革リーダー役割と前向き・否定的な2種類の発言、さらにエンゲージメントを媒介するモデルを立てた（抄録）。", "p4": "ベトナムの持続可能な企業の従業員から集めた量的データで媒介効果を検証した（抄録）。", "p5": "両方の帰属が前向きな発言と否定的な発言の両方と関連し、人事の変革リーダー役割は帰属を通じて前向きな発言とエンゲージメントを高めた。質の高い帰属は組織的支援の知覚も強め、エンゲージメントを促した（抄録）。", "p6": "未査読のプレプリント。標本数、調査設計（横断か縦断か）、効果量は抄録に記載がなく未確認。同一回答者の自己報告による共通方法バイアスの扱いも未確認。", "fun": "会社が同じ制度を作っても、社員が「自分たちのためだ」と受け取るか「業績のために搾り取るためだ」と受け取るかで反応は変わります。その受け止め方（帰属）が、意見を言う行動や仕事への熱意につながる中継点になっている、という見方が面白いところです。", "unverified": "回答者数、測定尺度、媒介効果の数値は抄録からは未確認。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "確率的非優越制約つき最適化とポートフォリオ", "title": "Optimization Problems with Stochastic Non-dominance Constraints: Application to Portfolio Selection", "url": "https://doi.org/10.2139/ssrn.7589423", "authors": "Jana Junova ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Junova, J., Kopa, M., & Vitali, S. (2026). Optimization Problems with Stochastic Non-dominance Constraints: Application to Portfolio Selection. https://doi.org/10.2139/ssrn.7589423", "why": "確率優越を緩めた非優越制約という新しい制約形式を定式化し、ポートフォリオ選択に適用する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "確率優越の制約を、Wasserstein距離で測った「非優越の程度」だけ緩める最適化問題を扱いやすい形で定式化し、ポートフォリオ選択で運用成績を上げられることを示した（抄録）。", "p2": "確率優越（stochastic dominance）は確率変数の比較や最適化の制約として定着しているが、厳しすぎることがある。その緩和概念はこれまで主に2つの与えられた確率変数の比較に使われ、最適化の中での緩和には使われていなかった（抄録）。", "p3": "確率的非優越の尺度を制約に入れた最適化問題を扱いやすく定式化し、基準を優越する変数から所定のWasserstein距離だけ離れることを許して実行可能集合を広げた。緩和と期待効用の関係も調べた（抄録）。背景：2次の確率優越は、リスク回避的なすべての投資家がそちらを好む関係を表す。", "p4": "米国の49産業ポートフォリオの日次リターンで、96年間の移動窓によるサンプル外分析を行い、古典的な2次・3次の確率優越制約と比べた（抄録）。", "p5": "2次の確率的非優越を小さく許すと、とくに2次のWasserstein距離を使う場合に、同程度のリスクのまま古典的な制約より有意に高いサンプル外リターンが得られた（抄録）。", "p6": "未査読のプレプリント。リターンの改善幅と取引費用の扱いは抄録に記載がなく未確認。", "fun": "「どんな慎重な投資家から見てもこちらが良い」という厳しい条件（確率優越）を少しだけ緩めると、選べる組み合わせが広がり、リスクは同じままもうけが増える、という結果です。緩める量を確率分布どうしの「距離」で測るという数学的な工夫が要点です。", "unverified": "リターンとリスクの具体的な数値、計算方法の詳細は抄録からは未確認。"}}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "相互情報量で精度を配分する視覚言語モデル量子化", "title": "AdaMIQ: Adaptive Mutual Information Quantization for Vision-Language Models", "url": "https://doi.org/10.2139/ssrn.7597212", "authors": "Min Tan ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Tan, M., Tang, X., Tao, Y., Xia, Z., & Xiong, J. (2026). AdaMIQ: Adaptive Mutual Information Quantization for Vision-Language Models. https://doi.org/10.2139/ssrn.7597212", "why": "低ビット量子化での精度配分を相互情報量に基づいて適応的に決め、VLMの実装効率を高める。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "視覚言語モデルの言語部分を再学習なしで低ビットに量子化する際、チャネル間の依存関係を相互情報量で捉えて精度を割り当てる手法AdaMIQを提案した（抄録）。", "p2": "既存の学習後量子化（PTQ）は、一様な規則や局所的な感度で精度を割り当て、チャネル間の依存を無視していた（抄録）。", "p3": "較正用の活性値からチャネル間の依存を推定して依存を考慮したグループを作り、ヘッセ行列に基づく重要度でグループごとに混合精度を割り当て、グループ内で再構成誤差を補償する。スペクトルクラスタリングはグループ分けの補助的な改良として使う（抄録）。", "p4": "LLaVA-1.6、Qwen3-VL-8B、SmolVLM2-2.2Bの言語部分で、パープレキシティ、下流のゼロショット課題、別構造への転移、アブレーション、較正の頑健性、時間とメモリを評価した（抄録）。", "p5": "主な4ビット条件でLLaVA-1.6とSmolVLM2-2.2Bで最も強く、相互情報量に基づくグループ分けが最大の寄与をした。推論時の追加の仕組みは不要だった（抄録）。", "p6": "未査読のプレプリント。Qwenでは結果がまちまちで、較正データへの感度があることを著者自身が限界として挙げている（抄録）。", "fun": "AIの重みを少ないビット数で表すと軽くなりますが、精度が落ちます。どの部分を細かく残すかを決めるとき、互いに強く関係する部分をまとめて扱うと失敗が減る、という考え方です。うまくいかなかったモデルも正直に報告している点も参考になります。", "unverified": "パープレキシティなどの具体的な数値は抄録からは未確認。"}}, {"id": "pn11", "rank": 11, "field": "開発経済学", "headline": "グリーン資金は汚職のもとで包摂的成長につながるか", "title": "Green Finance, Executive Corruption, and Inclusive Green Growth in Developing Countries", "url": "https://doi.org/10.2139/ssrn.7597403", "authors": "Isaac K. Ofori", "venue": "SSRN", "date": "2026-10-11", "apa": "Ofori, I. K. (2026). Green Finance, Executive Corruption, and Inclusive Green Growth in Developing Countries. https://doi.org/10.2139/ssrn.7597403", "why": "途上国へのグリーンファイナンスが包摂的グリーン成長に結びつく条件を経営者汚職との関係で検証する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "途上国へのグリーンファイナンスは低所得国でのみ包摂的グリーン成長を促し、行政府の汚職が一定水準を超えるとその効果が消えることを示した（抄録）。", "p2": "グリーンファイナンスへの国際的な約束は増えているが、それが途上国の包摂的グリーン成長（IGG）に結びつくかは未解決の実証課題だった（抄録）。", "p3": "2000〜2024年の途上国99か国を対象に、操作変数法と分位点回帰で、発展段階と行政府の汚職がグリーンファイナンスの効果をどう条件づけるかを推定した（抄録）。", "p4": "所得水準別の効果、IGGの分位ごとの効果、汚職との交互作用（閾値）で評価した（抄録）。", "p5": "グリーンファイナンスは低所得国でのみIGGを促し、IGGの成績が最も低い国で効果が最大だった。行政府の汚職は効果を大きく損ない、閾値0.6で正の効果を打ち消した（抄録）。", "p6": "未査読のプレプリント。操作変数の中身と汚職指標の出所は抄録に記載がなく未確認。", "fun": "環境のためのお金を途上国に送っても、政府の上層部が腐敗していると、その効果は途中で消えてしまいます。お金の量だけでなく、受け取る側の制度の質が効果を決めるという結果は、援助の届け方を考える手がかりになります。", "unverified": "閾値0.6の汚職指標の尺度と、操作変数の内容は抄録からは未確認。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "社会的合意は財政再建後の成長を左右する", "title": "Can social pacts deliver growth after fiscal consolidation?", "url": "https://doi.org/10.2139/ssrn.7593515", "authors": "Peter Claeys ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Claeys, P., & MARZINOTTO, B. (2026). Can social pacts deliver growth after fiscal consolidation? https://doi.org/10.2139/ssrn.7593515", "why": "社会的合意の新しい代理指標で、財政再建の成長効果が対外収支の初期条件に依存することを示す。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "賃金に関する条項を含む「社会協約」という社会的合意があると、対外的に競争力の弱い国でも財政再建が成長につながることを、EUの長期データで示した（抄録）。", "p2": "財政再建（緊縮）が成長を生むかは議論が分かれ、社会的合意の役割は初期の対外収支の条件と合わせて検討されていなかった（抄録）。", "p3": "賃金条項を含む社会協約を社会的合意の新しい代理指標とし、1978〜2024年のEUで、状態依存の局所射影（local projections）により、歳出削減型と税収増加型の財政調整の成長効果を比べた（抄録）。", "p4": "協約の有無と、国の競争上の位置（有利か不利か）の組み合わせごとに成長効果を推定した（抄録）。", "p5": "協約がない場合、緊縮が成長をもたらすのは競争条件が有利で対外経路が働くときだけだった。競争上不利な出発点でも、協約は賃金抑制を通じて財政調整を成長の成功に変えうる。効果は税収型の再建で大きかった（抄録）。", "p6": "未査読のプレプリント。協約の締結が内生的である可能性への対処は抄録からは未確認。", "fun": "政府が増税するとき、労働組合と経営側が賃上げを控える約束（社会協約）をしていると、国の競争力が保たれて景気が悪化しにくい、という結果です。増税の方が効果が大きいという点は、協約が「賃金を我慢する代わりに税負担を受け入れる」取引の場になっている、という解釈につながっていて面白いところです。", "unverified": "効果の大きさの数値と、協約の定義の詳細は抄録からは未確認。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "高齢有権者はEU財政ルールの遵守を弱めるか", "title": "Grey electorates and fiscal discipline: population ageing, public debt and compliance with EU fiscal rules", "url": "https://doi.org/10.2139/ssrn.7593516", "authors": "Santiago Calvo", "venue": "SSRN", "date": "2026-10-10", "apa": "Calvo, S. (2026). Grey electorates and fiscal discipline: population ageing, public debt and compliance with EU fiscal rules. https://doi.org/10.2139/ssrn.7593516", "why": "人口高齢化と公的債務・財政ルール遵守の関係を、改革後のEU財政枠組みに即して検証する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "有権者の高齢化はEU諸国の公的債務を増やさず、むしろ財政赤字ルールの違反を減らす方向に関係することを、政治経済モデルとパネルデータで示した（抄録）。", "p2": "高齢化は年金の財政負担を増やし、改革されたEUの財政枠組みはルール遵守に頼るが、高齢有権者が財政規律を弱めるのか強めるのかは分かっていなかった（抄録）。", "p3": "賦課方式の年金は財政が持続可能なときだけ安全なので、高齢有権者を国家の支払能力への「請求権者」とみなすモデルを作り、短い時間視野と年金を守る利益集団の動機と組み合わせて、総額ルールと支出ルールで異なる予測を導いた（抄録）。", "p4": "1998〜2024年のEU 27か国のパネルで、65歳以上の有権者の割合と、公的債務、赤字ルール違反の確率、支出ルール遵守、財政反応関数の関係を推定した（抄録）。", "p5": "65歳以上の有権者の割合は公的債務を増やさず、赤字ルール違反の確率の低さと関連した（全推定で負、有意性は推定法に依存）。支出ルールの遵守とは無関係だった。証拠は3つの仕組みのうち請求権者の仕組みに近かった（抄録）。", "p6": "未査読のプレプリント。有意性が推定法に依存し、債務への財政反応の強まりは少数クラスタでの推論に頑健でないと著者が述べている（抄録）。", "fun": "お年寄りが増えると年金のために国の借金が増える、と考えがちですが、年金が将来も払われるためには国の財政が健全でなければなりません。だから高齢の有権者はむしろ財政規律を望むかもしれない、という逆転の発想が面白い点です。", "unverified": "係数の大きさと、推定法ごとの有意性の違いの詳細は抄録からは未確認。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "マルチモーダルLLMの有害性を細かく評価する基準", "title": "Falcon: A Fine-Grained Safety Benchmark and Evaluator for Multimodal Large Language Models", "url": "https://doi.org/10.2139/ssrn.7593354", "authors": "Qi Xue ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Xue, Q., Jiang, M., Zhang, R., Xie, X., Ke, P., & Liu, G. (2026). Falcon: A Fine-Grained Safety Benchmark and Evaluator for Multimodal Large Language Models. https://doi.org/10.2139/ssrn.7593354", "why": "画像と文章のどこが有害かを局在化して評価するベンチマークと評価器を提供する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "画像・指示・応答のどこが有害かを部品ごとに判定できる、マルチモーダルLLM向けの安全性データセットFalconと評価器FalconEyeを作った（抄録）。", "p2": "文章だけのLLMの有害性評価は確立しているが、マルチモーダルLLMの評価器は、視覚的質問応答（VQA）のやり取りのどの部品に害があるかを局在化しない（抄録）。", "p3": "13の有害カテゴリにわたる71,333件のVQAで、画像・指示・応答の3部品それぞれに有害ラベル、多ラベルの有害カテゴリ、自然言語の説明を付けた。これを教師としてQwen3.5-4Bを微調整し、部品単位の評価器FalconEyeを作った（抄録）。", "p4": "Falcon-testでの3軸の精度と、注釈の範囲と分類体系が異なるVLGuardとBeaverTails-Vへの転移で評価した（抄録）。", "p5": "Falcon-testの56.83%の事例で3部品のラベルが一様でなく、1つの判定にまとめると局在化の情報が大きく失われる。FalconEyeは画像・指示・応答の3軸で最高精度、VLGuardで画像の安全性の最高精度、BeaverTails-Vで全体の最高精度を得た（抄録）。", "p6": "未査読のプレプリント。ラベル付けの方法（人手かモデルか）と注釈者間の一致度は抄録に記載がなく未確認。", "fun": "「画像は普通なのに質問が危ない」「質問は普通なのに答えが危ない」といったケースが半分以上あり、やり取り全体を一言で「安全・危険」と判定すると、どこに問題があったのかが分からなくなります。害の場所を部品ごとに指さす評価の大切さを数字で示しています。", "unverified": "各ベンチマークでの精度の数値と比較対象の評価器は抄録からは未確認。"}}, {"id": "pn15", "rank": 15, "field": "ヒューマンコンピュータインタラクション", "headline": "親子の相互作用で幼児の感情の時系列を予測", "title": "Predicting Temporal Patterns of Toddler Affect and Behavior in Parent–Child Interactions Using Multilevel Survival Analysis", "url": "https://doi.org/10.2139/ssrn.7577074", "authors": "Jenn-Yun Tein ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Tein, J.-Y., Clifford, S., Cheng, C. H., Ostner, S. G., Murillo, A., Tran, T., Lamp, S., Shaw, D. S., & Lemery-Chalfant, K. (2026). Predicting Temporal Patterns of Toddler Affect and Behavior in Parent–Child Interactions Using Multilevel Survival Analysis. https://doi.org/10.2139/ssrn.7577074", "why": "多層生存分析で、親子相互作用中の幼児の感情・行動の時間的パターンを予測する。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "親子の課題場面での幼児の前向き・否定的な感情の時間的な現れ方を、多層生存分析で家族と子どもの要因から予測した（抄録）。", "p2": "親子のやり取りの中の瞬間ごとの子どもの行動は発達の近接過程を表すが、感情がいつ・どれだけ繰り返し現れるかを、子どもと家族の文脈要因から説明する研究は限られていた（抄録）。", "p3": "低所得家庭の親子731組（親の97.8%が母親、平均26.9歳、子の平均29.9か月）の教える課題場面を観察し、感情の初出の時点と再発を多層生存分析で扱った（抄録）。背景：生存分析は「ある出来事がいつ起きるか」を扱う統計手法。", "p4": "家族の累積リスク、子の内在化・外在化の問題、養育（関与と甘さ）を予測因子とした（抄録）。", "p5": "累積リスクと外在化問題は否定的感情の時点と繰り返しに正に関連し、内在化問題と養育の甘さは前向き感情と負に関連した。親の関与は前向き感情と
