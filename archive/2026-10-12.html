<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

うしの人間関係を介して互いに影響し合う「人を介したAIの結合」を、評価上の問題として整理した概念論文（抄録）。", "p3": "対人干渉や共同介入の効果と、一方向・再帰的なAIの結合とを区別し、個々のAIと利用者の境界で集めた証拠がどんな条件で十分かを論じる（抄録）。", "p5": "実証ではなく概念的な議論であり、こうした結合が有害であるとも、どれほど起きるかも主張しないと明記している（抄録）。", "fun": "AIどうしは一度も通信していないのに、夫婦や友人がそれぞれのAIの助言で行動を変えると、相手のAIの次の助言まで変わってしまう、という見方が新鮮です。一台ずつ正しくテストしても、二台が同じ人間関係の中で動くと別の結果が出るかもしれない、という「組み合わせの問題」を指摘しています。", "unverified": "本文は未読。具体的な分類の定義や事例は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "物理整合なGNSS偽装は物理検査で見抜けない", "title": "Limits of Physics-Based GNSS Fault Detection in Multirotor UAV Simulation", "url": "https://doi.org/10.31224/8484", "authors": "Braiden Martin ほか", "venue": "engrXiv", "date": "2026-10-11", "apa": "Martin, B., Pendyala, N., & Joel, I. (2026). Limits of Physics-Based GNSS Fault Detection in Multirotor UAV Simulation. https://doi.org/10.31224/8484", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "マルチロータUAVのシミュレーションで、物理的に不自然に見えない偽のGNSS軌跡を機体上の限られたセンサでどこまで検出できるかを調べた（抄録）。", "p3": "GNSSと加速度の不一致、カルマンフィルタの正規化イノベーション二乗（NIS）、気圧高度との整合、2種類の物理スコアの5つの監視を、正常飛行で閾値を固定してから7,480回の評価飛行で比べた（抄録）。", "p5": "共分散で正規化した物理スコアは事前定義パネルで82.9%検出したが別の検証用600回では41.5%に下がり、ゆっくりした水平ずれ400回ではNISが9回検出しただけで他は0回だった（抄録）。", "fun": "偽の位置情報でも、なめらかに少しずつずらせば速度や加速度の変化がもっともらしく見え、見破れないという結果です。「物理法則に反していないか」で嘘を見抜く方法には、比べる別のセンサとモデルの不確かさという限界があることを数字で示しています。", "unverified": "本文は未読。誤報率の詳しい条件と各監視の定式化は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "CNT混入エポキシで舗装に埋め込むひずみセンサ", "title": "Experimental characterization of carbon nanotubes modified epoxy mixture for piezoresistive sensing: Signal quality and sensing durability", "url": "https://doi.org/10.2139/ssrn.7597035", "authors": "Ke Wang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Wang, K., Zheng, K., Wang, T., Hao, G., Liu, P., & Zhang, L. (2026). Experimental characterization of carbon nanotubes modified epoxy mixture for piezoresistive sensing: Signal quality and sensing durability. https://doi.org/10.2139/ssrn.7597035", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "カーボンナノチューブを混ぜたエポキシ混合物（CEMix）を舗装に埋め込むセンサとして使うため、信号品質と耐久性を評価する枠組みを示した（抄録）。", "p3": "感度と信号品質（安定性、信号雑音比、波形の忠実さ）を合わせた性能評価と、舗装向けの力学性能・繰返し載荷・老化を含む二重の耐久性評価を組み立てた（抄録）。", "p5": "感度と信号品質は同時には向上しないこと、使用荷重の範囲では損傷しないこと、老化は主に感度を下げ信号品質の劣化は比較的小さいことを示した（抄録）。", "fun": "押されると電気抵抗が変わる「圧抵抗」という性質を使い、道路そのものをはかりにする研究です。反応が大きいほど良いセンサとは限らず、ノイズや波形の崩れとのつり合いが大事だという点は、身近なマイクの音量と音質の関係にも似ています。", "unverified": "本文は未読。具体的な感度や信号雑音比の数値は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "道路・橋の補修モルタルに自己センシング機能", "title": "Synergistic reinforcement and self-sensing of alkali-activated slag repair mortar with MWCNTs and calcium carbonate whiskers", "url": "https://doi.org/10.2139/ssrn.7597036", "authors": "Wenjing Kuang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Kuang, W., Diao, H., Yan, B., Chen, F., Shi, W., & Ling, T. (2026). Synergistic reinforcement and self-sensing of alkali-activated slag repair mortar with MWCNTs and calcium carbonate whiskers. https://doi.org/10.2139/ssrn.7597036", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "多層カーボンナノチューブと炭酸カルシウムウィスカーを加えたアルカリ活性スラグ補修モルタルで、補修と自己センシングを両立させた（抄録）。", "p3": "配合を変えた試料の力学・界面・電気・圧抵抗・微視構造の特性を調べ、FTIRとSEM-EDSで反応系を確認した（抄録）。", "p5": "E-9が28日で界面曲げ強度4.83 MPa、E-8が基準より43.19%低い電気抵抗率と最高の圧抵抗感度、E-5が最良の繰返し安定性を示し、感度・安定性・再現性の間にトレードオフがあった（抄録）。", "fun": "ひび割れを直す材料に、自分の傷み具合を電気で知らせる機能まで持たせようという発想です。導電性の高さだけでなく、荷重がかかったときに電気の通り道が可逆的につなぎ替わるかどうかが感度を決める、という説明が面白い点です。", "unverified": "本文は未読。各配合の具体的な組成は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "玉石地盤の泥水シールド切羽崩壊を模型とDEMで", "title": "Face failure of slurry shield tunnelling in cobble ground under dynamic cutterhead excavation: model test and DEM simulations", "url": "https://doi.org/10.2139/ssrn.7593823", "authors": "Jiwen Wang ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Wang, J., Liu, X., Zhou, X., Liu, D., Xiong, F., & Zhong, Z. (2026). Face failure of slurry shield tunnelling in cobble ground under dynamic cutterhead excavation: model test and DEM simulations. https://doi.org/10.2139/ssrn.7593823", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "玉石を含む地盤での泥水式シールドの切羽崩壊を、カッター回転などの掘進過程を含む模型実験とDEMで調べた（抄録）。", "p3": "1g模型実験と、粒度構造・シールド前進・カッター回転・泥水圧・排土を組み込んだ3次元DEMを、直接せん断試験で較正し模型で検証した（抄録）。", "p5": "限界支保圧は開口率と土被り比（C/D）とともに増え、均質土や静的支保のモデルより高く、C/D≥1.5では崩壊が地中にとどまった（抄録）。", "fun": "大きな石が混じった地盤では、カッターがかき回すことで粒子が動き、アーチのように力を支える構造（アーチ作用）が弱まります。トンネルの前面を押さえる圧力が、砂だけの地盤の常識より高く必要になるという結果は、粒の大きさのばらつきの大切さを示しています。", "unverified": "本文は未読。限界支保圧の具体的な数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "熱-力学連成の準脆性破壊を適応細分化で解く", "title": "Coupled Thermo-Mechanical Modelling of Quasi-Brittle Fracture with Adaptive Refinement Using the Isoparametric Mapped Scaled Boundary Finite Element Method and a Regularized Phase-Field Cohesive Zone Model", "url": "https://doi.org/10.2139/ssrn.7593755", "authors": "Shekhar Gautam ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Gautam, S., Natarajan, S., Ooi, E. H., Javidan, F., Song, C., & Ooi, E. T. (2026). Coupled Thermo-Mechanical Modelling of Quasi-Brittle Fracture with Adaptive Refinement Using the Isoparametric Mapped Scaled Boundary Finite Element Method and a Regularized Phase-Field Cohesive Zone Model. https://doi.org/10.2139/ssrn.7593755", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "準脆性材料の熱と力学が連成した破壊を、位相場の結合力モデル（PF-CZM）と等パラメトリック・スケールド境界有限要素法（SBFEM）で解く枠組みを作った（抄録）。", "p3": "親要素のライブラリで高価な固有値問題を避ける等パラメトリックSBFEMに、任意多角形を扱える階層的な適応細分化と、熱伝導の劣化関数を組み合わせ、交互解法で解いた（抄録）。", "p5": "混合モード破壊や熱によるひび割れなど5つのベンチマークで、実験値や参照解とよく一致したと報告している（抄録）。", "fun": "ひび割れは「どこに・どの向きに」進むか前もって分からないため、計算でも難題です。ひびを境界線ではなく、ぼんやりした帯（位相場）として表し、必要な場所だけ網目を細かくする工夫で、温度とひび割れが影響し合う様子を追えるようにしています。", "unverified": "本文は未読。一致の程度を示す数値は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "代理モデル誘導の生成モデルで多物理逆問題", "title": "Surrogate-Guided Generative Modeling with Physics Verification for Expensive Multiphysics Inverse Problems", "url": "https://doi.org/10.31224/8480", "authors": "Hyungjun Kim ほか", "venue": "engrXiv", "date": "2026-10-10", "apa": "Kim, H., Persico, A., Burnett, L., Forget, B., & Radaideh, M. I. (2026). Surrogate-Guided Generative Modeling with Physics Verification for Expensive Multiphysics Inverse Problems. https://doi.org/10.31224/8480", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "少数の高精度CFD計算から候補状態の分布を生成し、代理モデルで導いて多物理の逆問題を解く枠組みを示した（抄録）。", "p3": "表形式の生成モデルがCFDの空間パターンを学び、微分可能な代理モデルが生成を誘導し、全候補は核計算ソルバSIMULATE3で独立に検証する（抄録）。", "p5": "BEAVRSベンチマークの燃料集合体の湾曲推定で、基準の検出器RMS誤差約5.1%、データ総当たりの4.2%に対し、生成最適化で検証済みの最良値をさらに下げた（抄録）。", "fun": "計算の重いシミュレーションを何百回も回す代わりに、少ない結果から「ありそうな候補」をAIに作らせ、最後は必ず本物の物理計算で確かめる、という分業が要点です。AIは探索の道案内だけをし、判定は物理に任せるので、もっともらしい間違いを避けられます。", "unverified": "本文は未読。生成最適化で得た最良RMSの正確な値は抄録の途中で切れており未確認。"}}, {"id": "pr24", "rank": 24, "headline": "内部孤立波が海底斜面に与える動的応答", "title": "Dynamic Response of Slopes with Different Gradients under Internal Solitary Waves", "url": "https://doi.org/10.2139/ssrn.7593740", "authors": "Hai-lei Kou ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Kou, H.-l., Lu, J., Wang, Y., & An, Z. (2026). Dynamic Response of Slopes with Different Gradients under Internal Solitary Waves. https://doi.org/10.2139/ssrn.7593740", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "南シナ海北部を想定し、内部孤立波が勾配の異なる海底斜面に当たったときの流れと地盤の動的応答を密度成層水槽で調べた（抄録）。", "p3": "5°・10°・15°の斜面で、流れ場、過剰間隙水圧、土圧を計測した（抄録）。", "p5": "砕波は5°・10°で巻き波型、15°で崩れ波型に変わり、5°から10°で斜面中腹の過剰間隙水圧の変動は表層31%・深層22%、土圧は61%・78%増えた（抄録）。", "fun": "海の中には、塩分や温度の違う層の境目を伝わる見えない大波（内部波）があります。それが斜面で砕けると海底の土の中の水圧が下がり、斜面の安定に影響するという、海面からは見えない現象を水槽で再現している点が面白いです。", "unverified": "本文は未読。15°での土圧変化の値は抄録の途中で切れており未確認。"}}, {"id": "pr25", "rank": 25, "headline": "採炭沈下の学習を地下水沈下へ転移", "title": "Transfer Learning with Metaheuristic-Optimized LightGBM for Multi-type Ground Subsidence Prediction: Generalization from Coal Mining to Groundwater-Induced Subsidence", "url": "https://doi.org/10.2139/ssrn.7593606", "authors": "Shuaifeng Yin ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Yin, S., wang, p., Wang, E., YAN, Y., & Han, K. (2026). Transfer Learning with Metaheuristic-Optimized LightGBM for Multi-type Ground Subsidence Prediction: Generalization from Coal Mining to Groundwater-Induced Subsidence. https://doi.org/10.2139/ssrn.7593606", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "採炭による地盤沈下で学習したLightGBMを、転移学習で地下水の過剰揚水による沈下の予測に使えるようにした（抄録）。", "p3": "採炭沈下163例を元領域、滄州の地下水沈下574例を目標領域とし、同時分布適応で領域差を縮め、HGSとICAの二段階でハイパーパラメータを最適化した（抄録）。", "p5": "領域間の最大平均差は0.3917から0.1234に下がり、目標領域でAUC 0.9912、40標本のみでもAUC 0.9123と転移なしより12.9ポイント高かった（抄録）。", "fun": "炭鉱の掘削で起きる沈下と、井戸の汲み上げで起きる沈下は原因が違いますが、「どれだけ乱されたか」「これまでの累積」「材料の性質」という共通の要因があるので、片方で学んだ知識をもう片方に移せる、という考え方が面白い点です。", "unverified": "本文は未読。不確かさの低減率の正確な値は抄録の途中で切れており未確認。"}}, {"id": "pr26", "rank": 26, "headline": "為替ヘッジの効果は取引網を通じて波及する", "title": "Foreign Exchange Risk Management Spillovers Across the Production Network", "url": "https://doi.org/10.2139/ssrn.7590643", "authors": "Wentong Chen", "venue": "SSRN", "date": "2026-10-10", "apa": "Chen, W. (2026). Foreign Exchange Risk Management Spillovers Across the Production Network. https://doi.org/10.2139/ssrn.7590643", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の為替ヘッジが自社だけでなく、取引網を通じて仕入先と顧客の業績も安定させることを示した（抄録）。", "p3": "資金調達コストが財務状態に依存する生産ネットワークのモデルを作り、10-Kから手作業で集めた為替デリバティブのデータを取引関係と結びつけて検証した（抄録）。", "p5": "顧客（仕入先）がヘッジを始めると、自社の売上（売上原価）の変動性が対照企業より3.1ポイント下がり、ヘッジは借入コスト経路による変動増幅の4分の1から5分の2を打ち消した（抄録）。", "fun": "保険のようなヘッジは自分を守るためのものと思いがちですが、取引先にまで安定をおすそ分けしている、という発見です。特に多くの企業に部品を供給する中心的な会社がヘッジすると波及が大きいという点は、ネットワークの「ハブ」の重要さを示しています。", "unverified": "本文は未読。データの企業数と期間は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "資本主義の型で銀行DXと金融安定の関係が変わる", "title": "Varieties of Capitalism and the Digital Transformation of Banking: A Longitudinal Analysis of Financial Stability", "url": "https://doi.org/10.2139/ssrn.7597048", "authors": "Thiago Fabricio Felipe ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Felipe, T. F., Kaya, M., Mathews, S., & Torres de Oliveira, R. (2026). Varieties of Capitalism and the Digital Transformation of Banking: A Longitudinal Analysis of Financial Stability. https://doi.org/10.2139/ssrn.7597048", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "銀行のデジタル化と財務安定性の関係が、資本主義の制度類型によって異なることを示した（抄録）。", "p3": "33か国57行の2007〜2024年を対象に、Zスコアで安定性を、年次報告書のキーワードでデジタル化を測り、制度類型ごとに線形回帰を推定した（抄録）。", "p5": "9つの類型で関係は正・弱い・負とまちまちで、時間トレンドを入れると正の関係のいくつかは頑健でなくなった（抄録）。", "fun": "同じデジタル化でも、国の経済の仕組みによって銀行が安定したりしなかったりする、という結果です。年次報告書の言葉の数を数えてデジタル化を測るという方法も、文章をデータとして扱う身近な工夫です。", "unverified": "本文は未読。類型ごとの係数の値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "ゲームのプレイ時間は市場到達と評価に非対称に効く", "title": "The Asymmetric Conversion of Digital Time: Temporal Affordance Architecture in Video Games", "url": "https://doi.org/10.2139/ssrn.7597179", "authors": "Yue Meng-Lewis ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Meng-Lewis, Y., & Abolhasani, M. (2026). The Asymmetric Conversion of Digital Time: Temporal Affordance Architecture in Video Games. https://doi.org/10.2139/ssrn.7597179", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ゲームの遊べる時間に関わる特徴が、市場での見えやすさとレビューの好意度に非対称に関係することを示した（抄録）。", "p3": "2つの公開タイトル単位データを結合し、記述分析、HC3標準誤差のOLS、繰り返し遊ぶ性質のスプライン、探索的な5類型のk平均法で分析した（抄録）。", "p5": "クリア要素と延長要素はレビュー数や推定所有者数と正に関係するが好意度とはほとんど関係せず、本編1時間あたりの価格は見えやすさと負に関係した（抄録）。", "fun": "長く遊べるゲームは「たくさん売れて話題になる」けれど「高く評価される」とは限らない、という違いを数字で示しています。売れることと好かれることは別物、という身近な感覚を、時間という切り口で確かめている点が面白いです。", "unverified": "本文は未読。データの出所と標本数は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "絵カードによるウェルビーイング測定の妥当性", "title": "Validating exploratory visuals as concept elicitation tools: A semiotic analysis of agreement and interpretive diversity in the My Story Cards wellbeing instrument", "url": "https://doi.org/10.21203/rs.3.rs-11045923/v1", "authors": "Jude Page ほか", "venue": "Research Square (In Review)", "date": "2026-10-11", "apa": "Page, J., Broady, T., Barr, M., & de Leeuw, E. (2026). Validating exploratory visuals as concept elicitation tools: A semiotic analysis of agreement and interpretive diversity in the My Story Cards wellbeing instrument. https://doi.org/10.21203/rs.3.rs-11045923/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ウェルビーイング測定ツール「My Story Cards」の絵カード14枚が、意図した概念を伝えているかを検証した（抄録）。", "p3": "心理学専攻の1年生100人がオンラインで絵と対応する文の手がかりを解釈し、自由記述を一致度のコーディング、再帰的テーマ分析、社会記号論の枠組みで分析した（抄録）。", "p5": "絵の概念の認識、解釈の収束の程度、伝わりやすさに関わる特徴を検討した（抄録。具体的な結果は抄録の途中で切れており未確認）。", "fun": "言葉にしにくい気持ちを絵で引き出す道具は便利ですが、作った人の意図どおりに絵が読まれているかは意外と確かめられていません。同じ絵から人によって違う意味を読み取ること自体を、欠点ではなく情報として扱おうとする姿勢が面白い点です。", "unverified": "本文は未読。主要な結果（一致率など）は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "移民の技能構成と地域物価の関係", "title": "Immigration, Skill Composition, and Regional Prices: Evidence from U.S. MSAs, 2008–2023", "url": "https://doi.org/10.2139/ssrn.7593835", "authors": "Catalina Amuedo-Dorantes ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Amuedo-Dorantes, C., Cai, Z., & Kaushal, N. (2026). Immigration, Skill Composition, and Regional Prices: Evidence from U.S. MSAs, 2008–2023. https://doi.org/10.2139/ssrn.7593835", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "移民が地域の物価に与える影響は技能によって正反対で、全体の移民比率では見えなくなることを示した（抄録）。", "p3": "米国256都市圏の2008〜2023年（2020年除く）について、地域価格平価とACSを用い、過去の定住パターンと出身国・技能別の全国動向によるシフトシェア操作変数で推定した（抄録）。", "p5": "低技能移民は総合物価・財・公共料金を下げ、高技能移民はその他サービスや公共料金を上げ、低技能移民は先に来た低技能移民の賃金を押し下げ高技能の自国民の雇用と賃金を上げた（抄録）。", "fun": "「移民が増えると物価はどうなるか」という問いに、全体平均ではほぼゼロでも、中身を分けると下げる力と上げる力が打ち消し合っていた、という結果です。平均だけ見ると大事な違いを見落とす、という統計の基本を示す好例です。", "unverified": "本文は未読。効果の大きさの数値は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "厳寒は都市の交通電動化を遅らせるか", "title": "Does extreme cold slow transport electrification? Evidence from Chinese cities", "url": "https://doi.org/10.2139/ssrn.7593814", "authors": "Jun Li ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Li, J., Song, Z., & Wang, S. (2026). Does extreme cold slow transport electrification? Evidence from Chinese cities. https://doi.org/10.2139/ssrn.7593814", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "厳しい寒さが中国の都市で電気自動車の販売を減らすことを、識別戦略つきで示した（抄録）。", "p3": "2017〜2023年の日次気象から都市別の極寒指数を作り、EV販売・充電設備・政策・オンラインレビューと結合し、二元固定効果と水蒸気量×緯度の操作変数で推定した（抄録）。", "p5": "極寒指数1単位の上昇でEV販売は約0.76%減り、LLMで処理したレビューから航続距離・経済・下取り価格への不安が増すことが示された（抄録）。", "fun": "電池は寒さに弱く、冬に航続距離が縮むことはよく知られていますが、それが実際の売れ行きを下げているかを気象データで確かめています。口コミをAIで読み取って「なぜ買わないのか」まで探っている点も今風です。", "unverified": "本文は未読。都市数と充電設備の効果の大きさは未確認。"}}, {"id": "pr32", "rank": 32, "headline": "自治体の気候適応計画を支える神経記号型マルチエージェント", "title": "A neuro-symbolic multi-agent platform for municipal climate adaptation planning", "url": "https://doi.org/10.2139/ssrn.7593610", "authors": "Jimmy FLOREZ ZULUAGA ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "FLOREZ ZULUAGA, J., Escobar Soto, J. F., Ortega Pabon, J. D., & Vargas-Bonilla, J. F. (2026). A neuro-symbolic multi-agent platform for municipal climate adaptation planning. https://doi.org/10.2139/ssrn.7593610", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "コロンビア・アンティオキア県の自治体の気候変動適応計画を自動生成する、神経記号型のマルチエージェント基盤を作った（抄録）。", "p3": "GIS、地域データの構造化された保管庫、専門知識、規則による監査、範囲を限ったLLMの補助、決定論的な文書生成を組み合わせ、意味解釈と規制の検証を文章生成から分離した（抄録）。", "p5": "125自治体での実行、専門家レビュー、外部機関の評価で、データ整備の時間が99%超短縮し、定義した手順の範囲で規制と次元の整合性が100%となった（抄録）。", "fun": "AIに文章を丸ごと書かせると数字の間違いや根拠のない提案が混ざりがちです。そこで、数字のチェックはルールで、文章作りは決まった手順で行い、AIには意味の解釈だけを任せるという役割分担で、行政文書の信頼性を保とうとしています。", "unverified": "本文は未読。外部評価の具体的な結果は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "住宅協同組合のエネルギー転換をLLM補助のABMで", "title": "Energy Transition Decision-Making Process in Czech and Polish Housing Cooperatives: LLM Assisted Agent-Based Model Specification", "url": "https://doi.org/10.5281/zenodo.23271040", "authors": "Michal Nesládek ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-09", "apa": "Nesládek, M., Bełch, W., Stará, S., & Jedon, R. (2026). Energy Transition Decision-Making Process in Czech and Polish Housing Cooperatives: LLM Assisted Agent-Based Model Specification. Zenodo. https://doi.org/10.5281/ZENODO.23271040", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "チェコとポーランドの住宅協同組合のエネルギー転換の意思決定を、LLMで補助したエージェントベースモデル（LLM-ABM）として仕様化した技術文書（抄録）。", "p3": "理論的基盤、エージェントの特性、モデル構成、入力データ、パラメータ、シミュレーション手順を記述し、最終投票ではなく態度形成と熟議に焦点を当てる（抄録）。", "p5": "仕様書の第1.1版で、シミュレーション結果は後の版に含めるとしている（抄録）。", "fun": "集合住宅の住民が断熱改修や太陽光導入に賛成するまでの話し合いを、AIの住民たちに再現させようという計画です。投票結果よりも、意見がどう形づくられるかを追おうとしている点が、社会の合意形成を考えるうえで面白いところです。", "unverified": "本文は未読。結果はまだ報告されていない。"}}, {"id": "pr34", "rank": 34, "headline": "研究者行動から科学の知識市場をマルチエージェントで再現", "title": "Scientific Liquidity Agents: A Multi-Agent Framework for Modeling Knowledge Markets in Scientific Ecosystems", "url": "https://doi.org/10.5281/zenodo.23287558", "authors": "Wu, Koutian", "venue": "Zenodo", "date": "2026-10-10", "apa": "Wu, K. (2025). Scientific Liquidity Agents: A Multi-Agent Framework for Modeling Knowledge Markets in Scientific Ecosystems. Zenodo. https://doi.org/10.5281/ZENODO.23287558", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "研究者の行動をLLMエージェントで模擬し、科学の知識市場を再現するマルチエージェント枠組みを提案した（抄録）。", "p3": "信念・欲求・意図（BDI）の枠組みで異質な研究者エージェントを作り、分野をまたいで知識を橋渡しする「認識論的裁定者」エージェントを導入した（抄録）。", "p5": "10エージェント・100ステップで280本の論文を生み、裁定者は平均3.0分野、専門家は1.0分野にまたがるという役割分化が生じた（抄録）。", "fun": "株式市場のシミュレーションの考え方を、論文が生まれる科学の世界に持ち込んでいます。異なる分野をつなぐ研究者が「市場の摩擦」を減らすという見立ては、学際研究の役割を経済のことばで説明する試みとして面白いです。", "unverified": "本文は未読。規模が小さく、現実との照合の方法は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "LLMの意識の自己報告は作り手の設定に従う", "title": "Same Model, Different Wrapper: A Preregistered Demonstration That Self-Reports of Consciousness in Two Open-Weights Language Models Follow Their Builders' Choices", "url": "https://doi.org/10.5281/zenodo.23294673", "authors": "Batat, Erez", "venue": "Zenodo", "date": "2026-10-11", "apa": "Batat, E. (2026). Same Model, Different Wrapper: A Preregistered Demonstration That Self-Reports of Consciousness in Two Open-Weights Language Models Follow Their Builders' Choices (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.23294673", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "LLMが「意識がある」と自己報告するかどうかは、作り手の訓練と周囲の文章の設定で決まってしまうことを、事前登録した実験で示した（抄録）。", "p3": "Qwen2.5-7BとMinistral 3 8Bに、自身の経験に関する15の二択質問を8条件で各10回尋ね、1モデル1,200回答を規則で採点した（抄録）。", "p5": "既定の設定では150回答中ゼロだったが、強いペルソナ指示でQwen 53.3%・Ministral 30.0%、助手訓練前の基盤モデルでも25.3%・22.0%が経験を主張した（抄録）。", "fun": "AIに「あなたに心はありますか」と聞いても、その答えは作り手の設定次第で変わる、という実験です。答えを変えるのが一文の指示で十分という点は、言葉による自己申告がいかに外から操作できるかを示しています。", "unverified": "本文は未読。8条件の詳細と人間評定者の一致度の数値は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "LLMの記憶選択で問いを知る価値を測る", "title": "The Value of Perfect Information about the Query in Budget-Constrained LLM Memory", "url": "https://doi.org/10.5281/zenodo.23291859", "authors": "Fu, Hao", "venue": "Zenodo", "date": "2026-10-11", "apa": "Fu, H. (2026). The Value of Perfect Information about the Query in Budget-Constrained LLM Memory (Version v2). Zenodo. https://doi.org/10.5281/ZENODO.23291859", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "トークン予算の限られたLLMの記憶で、質問を知ってから記録を選ぶことの価値を「完全情報の期待価値（EVPI）」として測った（抄録）。", "p3": "履歴を固定長のかたまりに分け、各質問に必要な正解根拠を既知として、質問を知らない選択と知っている選択の最適な網羅率の差を計算した（抄録）。", "p5": "LoCoMo・FairytaleQA・ContractNLIで、EVPIは履歴長の約1〜17%の予算で51.27〜87.67ポイントに達し、2つのLLMの正答率は40.74〜55.25ポイント高かった（抄録）。", "fun": "テスト前に何が出るか分かっていれば、ノートのどこを覚えればよいか絞れます。その「出題を知っていることの価値」を、経済学の情報の価値という考え方で測っているのが面白い点で、覚えられる量が少ないほど価値が大きくなります。", "unverified": "本文は未読。人手確認の規模は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "対人同調を解釈するシステムの階層的規制枠組み", "title": "Beyond Rapport: A Layered Regulatory Framework for Interpersonal Synchrony", "url": "https://doi.org/10.2139/ssrn.7597390", "authors": "Nastaran Saffaryazdi ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Saffaryazdi, N., Karai, Z., Broadbent, E., Lambert, A., & Billinghurst, M. (2026). Beyond Rapport: A Layered Regulatory Framework for Interpersonal Synchrony. https://doi.org/10.2139/ssrn.7597390", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "対話エージェントや職場のウェルビーイング監視が人の同調を読み取る際の妥当性の問題に対し、検出システムが満たすべき形式的な構成を提案した（抄録）。", "p3": "同調を自律神経・運動・表象の3層の資源制約つき過程として捉える「内受容-表象スタック（IRS）」を示し、出所の帰属・層横断の特徴づけ・持続性の監査の3段階の参照構成を作った（抄録）。", "p5": "実際の検出システムではなく理論的な提案で、5つの反証可能な予測と実証の道筋を示している（抄録）。", "fun": "二人の動きや心拍がそろうことを「仲が良い」証拠とみなしがちですが、同じ音楽を聞いているだけでもそろいます。本当に気持ちが通っているのか、無理に合わせているだけなのかを区別すべきだという指摘は、職場でAIが人を見張る時代に大切な視点です。", "unverified": "本文は未読。予測の具体的な内容は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "看護師燃え尽きの媒介効果を共分散行列から再検証", "title": "Questionable mediated effect of care-resistant behavior in dementia patients on nurses’ occupational burnout: A comment on Ding et al. (2026)", "url": "https://doi.org/10.31234/osf.io/cqx72_v1", "authors": "Kimmo Sorjonen", "venue": "PsyArXiv", "date": "2026-10-10", "apa": "Sorjonen, K. (2026). Questionable mediated effect of care-resistant behavior in dementia patients on nurses’ occupational burnout: A comment on Ding et al. (2026). https://doi.org/10.31234/osf.io/cqx72_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "認知症患者のケア拒否が看護師の燃え尽きにつながるという既発表の媒介モデルを、公表された共分散行列から再検討したコメント（抄録）。", "p3": "Ding et al.の共分散行列を使い、方向性のある媒介メカニズムを仮定しない別の潜在変数モデル（中核的自己評価を共通因子とするモデル）で同じデータを再現できるかを調べた（抄録）。", "p5": "観測された共分散構造は別のモデルでも同等に説明でき、観察データだけでは心理メカニズムの優劣を決められないと結論した（抄録）。", "fun": "同じ相関のパターンでも、「AがBを引き起こす」という説明と「AもBも共通の性格の表れ」という説明の両方が当てはまることがあります。論文の数字だけから別の説明を組み立ててみせた点が、相関と因果の違いを考える良い教材になっています。", "unverified": "本文は未読。モデル適合度の数値は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "位相誘導注意で多エージェント交通シミュレーション", "title": "TopoKin: Multi-agent traffic simulation via topology-guided attention and kinematics-constrained tokenization", "url": "https://doi.org/10.2139/ssrn.7593804", "authors": "Shiyu Fang ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Fang, S., Shi, H., Li, Z., Huang, Q., Chen, Z., Yang, Y., Sun, J., Hang, P., Qin, G., Lv, C., & Sun, J. (2026). TopoKin: Multi-agent traffic simulation via topology-guided attention and kinematics-constrained tokenization. https://doi.org/10.2139/ssrn.7593804", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "走行データから閉ループの多エージェント交通シミュレーションを作る際に、車線の衝突関係と運動の語彙という2つの事前知識を組み込んだTopoKinを提案した（抄録）。", "p3": "車線の衝突トポロジーで誘導する注意機構と、対称性による拡張・DTW圧縮・運動学的な絞り込みで作る運動トークンを、既存の自己回帰型シミュレータに加えた（抄録）。", "p5": "SMARTに対して全体的な改善を示し、CATKやTrafficBotsへの移植と4つの追加データでのゼロショット評価で汎用性を示した（抄録）。", "fun": "車の動きを言葉のような「単語」に区切って次の動きを予測する方法に、車線どうしが交差するという道路の構造と、車が物理的にできる動きだけを単語にするという工夫を加えています。距離が近いだけでなく、進路がぶつかる相手を意識させるのが要点です。", "unverified": "本文は未読。改善幅の数値は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "水道のデジタルツインに検証可能な判断カード", "title": "Operational Digital Twins in Water Infrastructure: Decision Cards for Verifiable Maintenance Actions", "url": "https://doi.org/10.5281/zenodo.23285716", "authors": "Yudin, Oleg I.", "venue": "Zenodo", "date": "2026-10-10", "apa": "Yudin, O. I. (2026). Operational Digital Twins in Water Infrastructure: Decision Cards for Verifiable Maintenance Actions (Version v 1.0.). Zenodo. https://doi.org/10.5281/ZENODO.23285716", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録に付いた抄録を使用", "preprint": true, "short": true, "p1": "水道事業の運用デジタルツインと維持管理の手順をつなぐ最小限の情報の取り決めとして、「判断カード」を提案する技術ノート（抄録）。", "p3": "デジタルツインの出力を検証可能な保守行動に結びつけるための情報項目を定める概念的な提案（抄録）。", "p5": "概念的な技術ノートであり、現場での検証は報告していないと明記している（抄録）。", "fun": "デジタルツイン（現実の設備を写したコンピュータ上の分身）がどれだけ賢くても、その判断が現場の作業にどうつながったかを後から確かめられなければ信頼されません。判断の根拠を一枚のカードに残すという発想は、記録の大切さを示しています。", "unverified": "本文は未読。カードの具体的な項目は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "人はAIに任せても結果責任を負うとき何を委ねるか", "title": "Trust, Delegation, and Alignment in Humanâ€“AI Decision Making", "url": "https://econpapers.repec.org/RePEc:chu:wpaper:26-11", "authors": "Erik O. Kimbrough ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "人間が結果を負う状況でのAIへの委任と信頼を実験で調べ、人とAIの意思決定分担の設計に実証的根拠を与える。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "AIリスクの報道エクスポージャーは株価に織り込まれるか", "title": "Are AI Risks Priced in the U.S. Stock Market? Evidence from Financial News Factors", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.05485", "authors": "Yanhui Shen", "venue": "RePEc NEP", "date": "2026-09-21", "apa": "Shen, Y. (2026). Are AI Risks Priced in the U.S. Stock Market? Evidence from Financial News Factors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.05485", "why": "AIリスクを種類別にニュースから測り、米国株のリターンで価格付けを検証する新しい資産価格の実証。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "経済学のレポート採点でLLMは見破られるか", "title": "A Turing Test for Grading in Economics: Detection, Grades, and Student Satisfaction in a Blinded Field Experiment", "url": "https://doi.org/10.2139/ssrn.7597401", "authors": "Scott Shane ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Shane, S., Sheremeta, R. M., Wang, S., & Xiong, H. (2026). A Turing Test for Grading in Economics: Detection, Grades, and Student Satisfaction in a Blinded Field Experiment. https://doi.org/10.2139/ssrn.7597401", "why": "盲検のフィールド実験でLLM採点の検出・成績・満足度を比較し、教育でのAI採点の実務判断に直結する。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "変革的AI時代の再分配政策を設計する", "title": "Redistributive Policies for the Times of Transformative AI", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.14750", "authors": "Jakub Growiec ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Growiec, J., Prettner, K., & Szkróbka, M. (2026). Redistributive Policies for the Times of Transformative AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.14750", "why": "自動化で労働分配率が下がる局面を想定し、所得・資産格差への政策対応を理論的に比較する。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "過去の成功から分岐する指針を学ぶ検索拡張推論", "title": "Guideline Forest: Retrieval-Augmented Reasoning with Experience-Induced Branching Guidelines", "url": "https://doi.org/10.2139/ssrn.7593444", "authors": "jiaxiang chen ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "chen, j., wang, z., zou, m., Wang, Q., & Xu, Z. (2026). Guideline Forest: Retrieval-Augmented Reasoning with Experience-Induced Branching Guidelines. https://doi.org/10.2139/ssrn.7593444", "why": "推論時探索の経験を指針として再利用する手法で、LLMの推論効率を高める方向の提案。"}, {"id": "pn06", "rank": 6, "field": "経営学", "headline": "規制の不確実性は企業のM&A戦略を変える", "title": "Regulatory Policy Uncertainty and Corporate Strategy: Evidence from M&A", "url": "https://doi.org/10.2139/ssrn.7597039", "authors": "Yanchao Fu ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Fu, Y., Guo, M. itle": "AdaMIQ: Adaptive Mutual Information Quantization for Vision-Language Models", "url": "https://doi.org/10.2139/ssrn.7597212", "authors": "Min Tan ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Tan, M., Tang, X., Tao, Y., Xia, Z., & Xiong, J. (2026). AdaMIQ: Adaptive Mutual Information Quantization for Vision-Language Models. https://doi.org/10.2139/ssrn.7597212", "why": "低ビット量子化での精度配分を相互情報量に基づいて適応的に決め、VLMの実装効率を高める。"}, {"id": "pn11", "rank": 11, "field": "開発経済学", "headline": "グリーン資金は汚職のもとで包摂的成長につながるか", "title": "Green Finance, Executive Corruption, and Inclusive Green Growth in Developing Countries", "url": "https://doi.org/10.2139/ssrn.7597403", "authors": "Isaac K. Ofori", "venue": "SSRN", "date": "2026-10-11", "apa": "Ofori, I. K. (2026). Green Finance, Executive Corruption, and Inclusive Green Growth in Developing Countries. https://doi.org/10.2139/ssrn.7597403", "why": "途上国へのグリーンファイナンスが包摂的グリーン成長に結びつく条件を経営者汚職との関係で検証する。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "社会的合意は財政再建後の成長を左右する", "title": "Can social pacts deliver growth after fiscal consolidation?", "url": "https://doi.org/10.2139/ssrn.7593515", "authors": "Peter Claeys ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Claeys, P., & MARZINOTTO, B. (2026). Can social pacts deliver growth after fiscal consolidation? https://doi.org/10.2139/ssrn.7593515", "why": "社会的合意の新しい代理指標で、財政再建の成長効果が対外収支の初期条件に依存することを示す。"}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "高齢有権者はEU財政ルールの遵守を弱めるか", "title": "Grey electorates and fiscal discipline: population ageing, public debt and compliance with EU fiscal rules", "url": "https://doi.org/10.2139/ssrn.7593516", "authors": "Santiago Calvo", "venue": "SSRN", "date": "2026-10-10", "apa": "Calvo, S. (2026). Grey electorates and fiscal discipline: population ageing, public debt and compliance with EU fiscal rules. https://doi.org/10.2139/ssrn.7593516", "why": "人口高齢化と公的債務・財政ルール遵守の関係を、改革後のEU財政枠組みに即して検証する。"}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "マルチモーダルLLMの有害性を細かく評価する基準", "title": "Falcon: A Fine-Grained Safety Benchmark and Evaluator for Multimodal Large Language Models", "url": "https://doi.org/10.2139/ssrn.7593354", "authors": "Qi Xue ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Xue, Q., Jiang, M., Zhang, R., Xie, X., Ke, P., & Liu, G. (2026). Falcon: A Fine-Grained Safety Benchmark and Evaluator for Multimodal Large Language Models. https://doi.org/10.2139/ssrn.7593354", "why": "画像と文章のどこが有害かを局在化して評価するベンチマークと評価器を提供する。"}, {"id": "pn15", "rank": 15, "field": "ヒューマンコンピュータインタラクション", "headline": "親子の相互作用で幼児の感情の時系列を予測", "title": "Predicting Temporal Patterns of Toddler Affect and Behavior in Parent–Child Interactions Using Multilevel Survival Analysis", "url": "https://doi.org/10.2139/ssrn.7577074", "authors": "Jenn-Yun Tein ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Tein, J.-Y., Clifford, S., Cheng, C. H., Ostner, S. G., Murillo, A., Tran, T., Lamp, S., Shaw, D. S., & Lemery-Chalfant, K. (2026). Predicting Temporal Patterns of Toddler Affect and Behavior in Parent–Child Interactions Using Multilevel Survival Analysis. https://doi.org/10.2139/ssrn.7577074", "why": "多層生存分析で、親子相互作用中の幼児の感情・行動の時間的パターンを予測する。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "価値の多元性を選択実験で選好に結びつける", "title": "Are stated preference valuation methods fit for purpose in a pluralist world? Using hybrid choice experiments to link value pluralism to preferences for nature restoration", "url": "https://doi.org/10.2139/ssrn.7597166", "authors": "Tim De Kruiff ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "De Kruiff, T., Gamborg, C., Stratton, A. D. H., & Jacobsen, J. B. (2026). Are stated preference valuation methods fit for purpose in a pluralist world? Using hybrid choice experiments to link value pluralism to preferences for nature restoration. https://doi.org/10.2139/ssrn.7597166", "why": "ハイブリッド選択実験で価値の多元性と自然再生への選好を結びつけ、表明選好法の妥当性を問い直す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "自然の価値観が多様な人々に対しても、表明選好法（stated preference）による経済評価が一般的な選好を捉えられることを示した（抄録）。", "p3": "ポーランド・スロバキア・オランダの自然再生の選択実験データを、「自然の多元的価値」尺度の回答と潜在クラスのハイブリッド選択モデルで結びつけた（抄録）。", "p5": "全集団がトレードオフを行い辞書式選好は否定されたが、内在的・関係的価値の強い人は費用を無視する傾向があり、平均評価額を大きく歪めた（抄録）。", "fun": "「この森を守るのにいくら払いますか」という質問は、自然そのものに価値があると考える人にとっては答えにくいものです。そうした人が値段の欄を無視しがちなことをデータで見つけ、平均の金額を大きく動かしてしまうと示した点が面白いです。", "unverified": "本文は未読。回答者数と各クラスの割合は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "中東の地政学リスクを原油とマクロに写すベイズ道具箱", "title": "Geopolitical Oil-Supply Scenarios and Macroeconomic Risks: A Bayesian Toolkit for Policy Analysis", "url": "https://econpapers.repec.org/RePEc:bde:opaper:2616e", "authors": "Irma Alonso-Alvarez ほか", "venue": "RePEc NEP", "date": "2026-09-21", "why": "地政学的な原油供給シナリオをマクロ経済リスクに写像する、政策分析向けの扱いやすい枠組み。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "中東の地政学リスクを原油価格とマクロ経済に写像する、中央銀行向けの扱いやすいベイズ的な分析枠組みを作った（抄録）。", "p3": "地政学的不確実性を少数の排他的シナリオの確率分布とし、予測市場価格・専門家評価・高頻度指標でベイズ更新し、在庫・備蓄を差し引いた供給不足をブレント価格式に入れる3ブロック構成（抄録）。", "p5": "統計的予測との整合性の確認や、観測された原油価格から暗黙のシナリオ構成を逆推定することもできるとしている（抄録）。", "fun": "「戦争が起きるか」という不確かなことを、いくつかの筋書きとその確率で表し、新しいニュースのたびに確率を更新していく、というベイズ統計の考え方を政策に使っています。逆に原油価格から、市場が想定している筋書きを読み取れる点も面白いです。", "unverified": "本文は未読。実際の適用結果の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "ヘッドルーム規制の厚生外部性と最適設計", "title": "Welfare Externalities and Optimal Headroom Regulation", "url": "https://doi.org/10.2139/ssrn.7591078", "authors": "George Xiang", "venue": "SSRN", "date": "2026-10-10", "apa": "Xiang, G. (2026). Welfare Externalities and Optimal Headroom Regulation. https://doi.org/10.2139/ssrn.7591078", "why": "制度の余裕幅（ヘッドルーム）に条件づけた規制の最適設計を厚生外部性から導く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "規制当局が「余裕幅（ヘッドルーム）」だけに条件づけて政策を行うとき、何を失うかを理論的に特徴づけた（抄録）。", "p3": "2期間の銀行経済で、ヘッドルームに依存する移転が私的誘因と社会的誘因を一致させる条件を、ヘッドルームのヤコビアンが厚生のくさびを張るかどうかで示した（抄録）。", "p5": "条件が満たされないとき、最良の是正はくさびの重みつき射影となり、その残差が追加の政策手段の価値を示すことを導いた（抄録）。", "fun": "銀行の規制では「自己資本が基準をどれだけ上回っているか」という一つの数字で対応を決めがちです。数字一つに頼ると直せない歪みが残り、その大きさを線形代数の射影という考えで測れる、という見方が面白い点です。", "unverified": "本文は未読。具体的な数値例の有無は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "景気循環の曖昧さの下での頑健な資産選択", "title": "Robust Portfolio Choice under Business-Cycle Ambiguity", "url": "https://doi.org/10.2139/ssrn.7597409", "authors": "Xiaoshan Su ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Su, X., Li, Y., & Wang, J. (2026). Robust Portfolio Choice under Business-Cycle Ambiguity. https://doi.org/10.2139/ssrn.7597409", "why": "拡散・災害ジャンプ・景気遷移の曖昧さを同時に扱う頑健な消費・ポートフォリオ選択の理論。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "拡散・災害ジャンプ・景気循環の遷移についての曖昧さ（モデルの不確かさ）を同時に扱う、頑健な消費・ポートフォリオ選択を解いた（抄録）。", "p3": "CRRA型効用で完備・不完備市場の半解析的な最適政策を導き、厚生コストを数量化した（抄録）。", "p5": "景気の遷移では「平常から危機へ」への曖昧さ回避が逆方向より大きな影響を持ち、完備市場ではこれが、不完備市場では拡散リスクの曖昧さ回避が厚生上最も重要だった（抄録）。", "fun": "確率そのものが分からない状況（曖昧さ）を嫌う投資家は、最悪の場合を想定して資産を選びます。景気が悪化する確率の見積もりの不確かさの方が、回復する確率の不確かさより重く効く、という非対称性が面白い結果です。", "unverified": "本文は未読。厚生コストの具体的な値は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経営学", "headline": "生成AIはイノベーションの方向をどう変えるか", "title": "Generative AI and the Direction of Innovation: Knowledge Work, Public Value, and Policy in Research and Innovation Systems", "url": "https://doi.org/10.2139/ssrn.7593558", "authors": "Hooman Shababi", "venue": "SSRN", "date": "2026-10-10", "apa": "Shababi, H. (2026). Generative AI and the Direction of Innovation: Knowledge Work, Public Value, and Policy in Research and Innovation Systems. https://doi.org/10.2139/ssrn.7593558", "why": "生成AIを生産性だけでなくイノベーションの方向と公共価値の観点から位置づける政策論。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "生成AIを生産性の技術としてだけでなく、イノベーションの方向と統治の問題として位置づける政策向けの総合レビュー（抄録）。", "p3": "知識労働での生成AI研究を、イノベーションシステム論・ミッション志向・責任あるイノベーションの研究と結びつけ、作業成果・能力形成・利益の配分・方向と統治の4つの成果を区別した（抄録）。", "p5": "実験と現場の証拠は特定の作業での条件付きの生産性向上を支持するが、職業・企業・研究体制全体での一般的な生産性効果は確立していないと整理した（抄録）。", "fun": "AIで仕事が速くなるのは一部の作業に限られ、AIの得意範囲を超えると逆に成績が落ちることもあります。速さだけでなく、人が育つか、誰が得をするか、知識の基盤を誰が握るかまで見るべきだという整理は、技術の評価軸を広げるものです。", "unverified": "本文は未読。参照した研究の範囲は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "宇宙開発に学ぶ極限環境の結合型イノベーション", "title": "Space Innovation Systems and Coupled Innovation Dynamics in Extreme Contexts", "url": "https://doi.org/10.2139/ssrn.7593559", "authors": "Bo Nielsen ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Nielsen, B., Raswant, A., Asakawa, K., & Buckely, P. J. (2026). Space Innovation Systems and Coupled Innovation Dynamics in Extreme Contexts. https://doi.org/10.2139/ssrn.7593559", "why": "高度な技術と資源効率を同時に生む宇宙イノベーションシステムを理論化する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "宇宙開発を、最先端技術と資源節約型（フルーガル）イノベーションを同時に生むイノベーションシステムとして理論化した（抄録）。", "p3": "質量・電力・容積・通信・乗員時間などの厳しい制約と、打ち上げ後に直せない不可逆性が、能力形成の仕組みを生むという能力形成モデルを構築した（抄録）。", "p5": "信頼性志向の学習、検証重視の開発、モジュール分解、システム統合と再結合という共通の仕組みから、高度さと節約が同じ能力基盤から生まれると論じた（抄録）。", "fun": "宇宙では重さも電気も限られ、一度打ち上げたら修理できません。その極端な制約が、最先端でありながら無駄のない技術を生むという見方は、「制約が創造性を生む」という身近な経験を理論にしたものと言えます。", "unverified": "本文は未読。事例の具体的な内容は未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "機械学習で単体法の最適基底を当て最適潮流を高速化", "title": "Machine Learning for Exact Simplex Basis Prediction: A Discrete Combinatorial Warm-Start for Real-Time DC Optimal Power Flow", "url": "https://doi.org/10.2139/ssrn.7593602", "authors": "Muhammad Dzulqarnain Al Firdausi ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Al Firdausi, M. D., Al-Ghazi, A., & Syed, M. N. (2026). Machine Learning for Exact Simplex Basis Prediction: A Discrete Combinatorial Warm-Start for Real-Time DC Optimal Power Flow. https://doi.org/10.2139/ssrn.7593602", "why": "DC最適潮流の線形計画で最適基底を直接予測し、厳密解のまま実時間計算を高速化する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "DC最適潮流の線形計画で、最適解を離散的な「基底」として機械学習で直接予測し、単体法の初期値に使う方法を提案した（抄録）。", "p3": "ランダムフォレスト、AdaBoost、XGBoost、k近傍法、多層パーセプトロンの5手法を、PGLib-OPFの11の送電網と確率的な負荷の条件で比べた（抄録）。", "p5": "Gurobiで評価すると、予測した基底によりすべての運用シナリオで単体法の反復回数が大きく減った（抄録）。", "fun": "連続的な数値を予測すると、わずかな誤差で送電網の制約を破ることがあります。そこで答えを「どの制約がぎりぎりで効いているか」という組み合わせの問題として当てにいく、という発想の転換が面白い点です。組み合わせが当たれば、厳密な答えが一気に求まります。", "unverified": "本文は未読。反復回数の削減率の数値は未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "株式の埋め込みは単純な基準を超えるか", "title": "A Systematic Benchmark of Vector Stock Embeddings", "url": "https://doi.org/10.2139/ssrn.7591058", "authors": "Tomasz Rymaszewski", "venue": "SSRN", "date": "2026-10-10", "apa": "Rymaszewski, T. (2026). A Systematic Benchmark of Vector Stock Embeddings. https://doi.org/10.2139/ssrn.7591058", "why": "相関網やリターンから学習した株式埋め込みを体系的に比較し、実用上の有効性を検証する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "株式の埋め込みベクトルが、圧縮元の生の特徴量より本当に優れているかを体系的に検証した（抄録）。", "p3": "S&P 500・Russell 1000・Russell 3000で、期間・共変動の除去法・グラフ構成・6種の表現を変え、検索・クラスタリング・教師あり読み出しをGICS分類に対して多重比較補正つきで評価した（抄録）。", "p5": "学習した埋め込みはすべて生の相関行の基準をsub-industry hit@3で0.11〜0.21上回ったが、生のリターン系列は明確には超えず、Russell 3000では統計的に同等（p=0.69）だった（抄録）。", "fun": "AIで作った「株の特徴ベクトル」は、元のデータをそのまま使うのと比べて本当に良いのか、という素朴な問いに丁寧に答えています。比べる相手の選び方次第で「勝ち」にも「引き分け」にもなる、という結論は、比較実験の基準の大切さを教えてくれます。", "unverified": "本文は未読。その他の評価指標での結果は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "いつLLMに聞くかを学ぶ地下鉄ダイヤ再編", "title": "When2Ask? Fusing Multi-Agent Reinforcement Learning with Large Language Models for Metro Train Rescheduling", "url": "https://doi.org/10.2139/ssrn.7593806", "authors": "Qin luo ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "luo, Q., Du, H., Li, L., De Giovanni, L., WANG, Y., Su, B., & HUANG, S. (2026). When2Ask? Fusing Multi-Agent Reinforcement Learning with Large Language Models for Metro Train Rescheduling. https://doi.org/10.2139/ssrn.7593806", "why": "多エージェント強化学習とLLMを融合し、応答性と汎化を両立させるダイヤ再編手法。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "地下鉄のダイヤ再編で、強化学習による即時制御と、LLMを含む戦略層による全体最適化を必要なときだけ切り替える階層的な枠組みWhen2Askを提案した（抄録）。", "p3": "問題を分散型部分観測マルコフ決定過程と混合整数線形計画で定式化し、列車ごとの制御はマルチエージェント強化学習、全体の調整はLLM・小型言語モデル・MILPソルバで行う（抄録）。", "p5": "設備制約や旅客の待ちから協調が必要と判断したときに戦略層を起動する（抄録。性能の数値は抄録の途中で切れており未確認）。", "fun": "普段は各列車が素早く自分で判断し、大きな乱れのときだけ「司令塔」に相談するという分担は、人間の組織にも似ています。司令塔の中でも、過去事例を探すのは大型のLLM、細かい作業は小型モデル、最後の計算は最適化ソルバ、と役割を分けている点が面白いです。", "unverified": "本文は未読。比較手法と性能の数値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "充電待ちと時間帯料金まで含むEV配送の強化学習", "title": "Deep Reinforcement Learning for the Electric Vehicle Routing Problem with Time Windows,Partial Charging, Charging-Station Queues and Time-of-Use Electricity Prices", "url": "https://doi.org/10.2139/ssrn.7592698", "authors": "Mathesh G ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "G, M., S, M., D, K., & S, A. A. (2026). Deep Reinforcement Learning for the Electric Vehicle Routing Problem with Time Windows,Partial Charging, Charging-Station Queues and Time-of-Use Electricity Prices. https://doi.org/10.2139/ssrn.7592698", "why": "部分充電・充電所の待ち行列・時間帯別電気料金を同時に扱うEV配送経路問題を深層強化学習で解く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "時間枠、部分充電、充電所の待ち行列、時間帯別電気料金を同時に含む電気自動車の配送経路問題を深層強化学習で解いた（抄録）。", "p3": "問題をマルコフ決定過程とし、先読みの実行可能性マスクで立ち往生を防ぐ方策ネットワークをREINFORCEで学習させた。27の正規化特徴で行動を評価し、規模に依存しない（抄録）。", "p5": "顧客10〜30の合成問題で、焼きなまし法より10顧客で2.4%、20顧客で13.0%、学習にない30顧客で24.9%安く、22〜38倍速かった（抄録）。", "fun": "配送トラックが電気自動車になると、どこを回るかだけでなく、いつ・どこで・どれだけ充電するか、充電器が空いているかまで考えなければなりません。学習で見たことのない大きさの問題でも従来法に勝った点が、この手法の強みを示しています。", "unverified": "本文は未読。実データでの検証の有無は未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "重なる投影から物体ごとの放射線寄与を推定", "title": "Object-level response estimation for a collimated Geiger–Müller array under non-uniform contamination", "url": "https://doi.org/10.2139/ssrn.7593552", "authors": "Yongzhuo LIU ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "LIU, Y., ZHANG, J., LIU, H., XI, F., & Mi, Y. (2026). Object-level response estimation for a collimated Geiger–Müller array under non-uniform contamination. https://doi.org/10.2139/ssrn.7593552", "why": "コリメートした計数管アレイで、非一様汚染下の物体別寄与を推定する逆問題の統計的手法。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "コリメートしたガイガー・ミュラー計数管アレイで、投影が重なり内部の汚染が一様でない物体ごとの放射線寄与を推定する逆計測法を作った（抄録）。", "p3": "OpenGATEで材料の幾何を保った応答行列を作り、物体ごとに4つの非負の部分領域係数を有限窓の計数尤度と縮小推定で求め、分割コンフォーマル較正で区間を付けた（抄録）。", "p5": "40の試験形状で、基準計数500のとき寄与割合の平均誤差は0.2653で、一様線源を仮定した推定より全体で13.4%、局所汚染で35.9%小さかった（抄録）。", "fun": "重なって見える複数の物体のうち、どれがどれだけ放射線を出しているかを、外から数えたカウントだけで割り振る問題です。答えが一つに決まらない部分（ヌル空間）を数学的に見極め、推定の幅まで示している点が誠実な設計です。", "unverified": "本文は未読。一様モデルが優れる条件の詳細は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "電流磁場に強いTMR-慣性の姿勢推定", "title": "Reliability-Aware TMR-Inertial Attitude Estimation for Multirotor Aircraft under Current-Induced Magnetic Disturbance", "url": "https://doi.org/10.2139/ssrn.7597052", "authors": "JiaNan Wang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Wang, J., Peng, X., & Wang, Z. (2026). Reliability-Aware TMR-Inertial Attitude Estimation for Multirotor Aircraft under Current-Induced Magnetic Disturbance. https://doi.org/10.2139/ssrn.7597052", "why": "信頼度を考慮した磁気-慣性融合で、マルチロータ機の電流起因の磁気擾乱下でも方位を推定する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "トンネル磁気抵抗（TMR）磁力計を、モーター電流による磁気擾乱のあるマルチロータ機の方位基準に使えるようにする姿勢推定の枠組みを作った（抄録）。", "p3": "非線形応答・軸結合・ハードアイアン・電流と磁場の結合を含む21パラメータの較正モデルと、磁場ノルム残差による共分散の調整、方位の新息検定、3状態EKFを組み合わせた（抄録）。", "p5": "磁場ノルムのRMS誤差は較正姿勢で0.7760から0.0520 µTに下がり、未使用の検証データでも0.0690 µT程度を保った（抄録）。", "fun": "ドローンのモーターに流れる電流そのものが磁場を作り、方位磁石を狂わせます。その影響を電流から予測して差し引き、さらに「今の磁気の測定は信用できるか」を判定して使い分ける、という二段構えが工夫の要点です。", "unverified": "本文は未読。閉ループ試験での方位誤差の値は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "信号とモデルを分けた軽量な電池残量推定", "title": "Lightweight SOC Estimation via Signal-Model Decoupling and Adaptive Bias Compensation", "url": "https://doi.org/10.2139/ssrn.7597208", "authors": "Defu Jiang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Jiang, D., Guo, Z., Xu, X., Bao, H., Shan, H., & Chen, K. (2026). Lightweight SOC Estimation via Signal-Model Decoupling and Adaptive Bias Compensation. https://doi.org/10.2139/ssrn.7597208", "why": "高精度モデルの計算負荷を避けつつ適応的バイアス補正でSOCを推定する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "電池の充電状態（SOC）推定で、信号とモデルを切り分けて計算を軽くしつつ発散を防ぐ枠組みを提案した（抄録）。", "p3": "変分モード分解で端子電圧から開放電圧の低周波成分を取り出し、定常と過渡の電流を分けた補償で、従来の観測方程式で起きる抵抗の電圧降下の「二重差し引き」を解消した（抄録）。", "p5": "持続的な低周波のバイアスをほぼ平均ゼロの確率的残差に変え、分極パラメータをオフラインで固定して計算負荷を抑えた（抄録。精度の数値は未確認）。", "fun": "電池の残量は直接は測れず、電圧から推定します。ところが取り出した電圧にはすでに抵抗の分の降下が含まれているのに、式の中でもう一度引いてしまう、という見落としを見つけて直した点が要です。式の細部の矛盾が推定のずれを生むことを示しています。", "unverified": "本文は未読。推定誤差の数値と検証条件は未確認。"}}, {"id": "pn29", "rank": 29, "field": "因果推論", "headline": "自律運航船の事故で原因を誰に帰属させるか", "title": "A Conceptual Framework for Causal Attribution in Incidents Involving Maritime Autonomous Surface Ships", "url": "https://doi.org/10.2139/ssrn.7589658", "authors": "Farzaneh Javadi", "venue": "SSRN", "date": "2026-10-11", "apa": "Javadi, F. (2026). A Conceptual Framework for Causal Attribution in Incidents Involving Maritime Autonomous Surface Ships. https://doi.org/10.2139/ssrn.7589658", "why": "開発者・統合者・船主・遠隔操船者に分散した判断の因果帰属を整理する概念枠組み。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "自律運航船の事故で、開発者・統合者・船主・遠隔運航センターそれぞれの寄与度を示すための因果帰属の概念枠組みACAMを提案した（抄録）。", "p3": "認証された事故証拠、構造的因果モデル、介入による反実仮想を、不確かさを明示したシャープレイ値による帰属に結びつけ、知見を蓄積する連合型の台帳AMRLも構想した（抄録）。", "p5": "因果的責任と法的責任は別物だが切り離せず、帰属は規範的な選択に依存するため、それを明示し検証可能にする設計だと論じた（抄録）。", "fun": "人が操船しない船がぶつかったら誰の責任か、という難問に、ゲーム理論で協力の貢献を公平に分けるシャープレイ値を使おうという提案です。どの「普通の基準」と比べるかで責任の割合が変わる、という指摘は、数字が価値判断と切り離せないことを示しています。", "unverified": "本文は未読。仮想事例の詳細は未確認。"}}, {"id": "pn30", "rank": 30, "field": "組織行動・心理的安全性", "headline": "意思決定の性質に応じてリーダーの判断を変える理論", "title": "Decision Elasticity Theory: A Multidimensional Framework for Contingent Leadership Decision-Making", "url": "https://doi.org/10.2139/ssrn.7593356", "authors": "Dr. Jitendra Shrivastava ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Shrivastava, Dr. J., & Yadav, Dr. N. (2026). Decision Elasticity Theory: A Multidimensional Framework for Contingent Leadership Decision-Making. https://doi.org/10.2139/ssrn.7593356", "why": "意思決定ごとに協議・速度・リスク許容を変える「意思決定弾力性」の多次元枠組みを提案する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "意思決定の可逆性・価値の半減期・相互依存性の3次元で、リーダーの判断スタイルを使い分ける「意思決定弾力性理論（DET）」を提案した（抄録）。", "p3": "既存の状況対応型リーダーシップ論が1次元に条件づけていたのに対し、3つの性質を直交する次元として8つの区画を作り、それぞれに判断スタイルを対応させた（抄録）。", "p5": "組織に蓄積する「意思決定の負債」という概念も導入した（抄録。実証の有無は未確認）。", "fun": "取り消せる決定か、時間が経つと価値が下がる決定か、関係者が多い決定か、という3つの軸で決め方を変えるべきだという提案です。経験豊富な管理職が直感でやっていることを、立方体の8つの部屋に整理して見える化しようとしている点が面白いです。", "unverified": "本文は未読。理論の検証方法は未確認。"}}, {"id": "pn31", "rank": 31, "field": "開発経済学", "headline": "世界銀行とネパール政府の開発協力10年", "title": "Relationship between World Bank Group and Nepal Government (2010- 2019)&nbsp;", "url": "https://doi.org/10.2139/ssrn.7589139", "authors": "Manoj Aryal", "venue": "SSRN", "date": "2026-10-10", "apa": "Aryal, M. (2026). Relationship between World Bank Group and Nepal Government (2010- 2019)&nbsp; https://doi.org/10.2139/ssrn.7589139", "why": "2010〜2019年のネパールにおける国際開発協力と政府開発援助の関係の動態を分析する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "2010〜2019年のネパールで、世界銀行グループを中心とする国際開発協力と政府開発援助の関係の変化を分析した（抄録）。", "p3": "公式の支出データ、援助の断片化、連邦制下での2019年国際開発協力政策の実施を分析し、ハーヴェイの新自由主義批判の枠組みで国別パートナーシップ戦略の影響を検討した（抄録）。", "p5": "譲許的援助から非譲許的な市場融資への移行を評価し、2018/19年度の年間支出は2億4200万ドルに達したと報告している（抄録）。", "fun": "援助は「もらうもの」から「借りるもの」へと性格を変えつつあり、中所得国を目指す国ほどその流れに乗ります。教育や医療といった暮らしの基盤に、国際機関の方針がどう入り込むかを10年分たどっている点が興味深いところです。", "unveri uctural-potential-based DEM contact model for heritage rammed earth", "url": "https://doi.org/10.1016/j.enganabound.2026.107089", "authors": "Chengrui Ge ほか", "venue": "Engineering Analysis with Boundary Elements", "date": "2026-10-09", "citescore": 7.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr16", "rank": 16, "headline": "スマートコントラクトは橋梁維持管理に価値を生むか", "title": "ASSESSING THE VALUE OF SMART CONTRACTS IN DIGITAL BRIDGE MAINTENANCE SYSTEMS", "url": "https://doi.org/10.14455/isec.2026.13(2).fam-06", "authors": "Leonardo Zunino ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "橋梁の維持管理の流れにブロックチェーンのスマートコントラクトを導入したときの、経済・社会・組織間の価値を評価した（抄録）。", "p3": "状態基準の補修を受けた既存の橋を事後的な事例とし、従来の管理過程と、認証された計測データ・AI支援の判断・補修実施・支払いをスマートコントラクトで統治する代替案を比べた（抄録）。", "p5": "事務作業量、作業の効率、意思決定などの運用指標で比較した（抄録。具体的な数値は抄録の途中で切れており未確認）。", "fun": "橋のセンサが「補修が必要」と判定したら、自動的に工事の発注から支払いまで進む仕組みを想像した研究です。技術の性能ではなく、手続きの手間や組織間の信頼がどう変わるかに注目しているのが面白い点です。", "unverified": "本文は未読。比較の結果の数値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "支承の統計評価で資産管理と設計を支える", "title": "STATISTICAL ASSESSMENT OF BRIDGE BEARINGS: A METHODOLOGY FOR ASSET MANAGEMENT, MAINTENANCE AND DESIGN", "url": "https://doi.org/10.14455/isec.2026.13(2).fam-05", "authors": "Emanuela De Luca ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "大規模な点検データを整理・分析するデータ駆動の方法を、橋梁支承に適用した（抄録）。", "p3": "支承の特性・点検記録・周辺情報を統合する関係データベースを作り、ネットワーク規模の体系的分析を可能にした（抄録）。", "p5": "イタリアの高速道路網の1万6千基超の支承に試適用し、型式による損傷発生の違いと腐食関連の欠陥の多さを示した（抄録）。", "fun": "橋を支える「支承」は目立たない部品ですが、何万個も集めて統計を取ると、どの型式がどんな傷み方をしやすいかが見えてきます。点検記録をばらばらのメモではなく、データベースとして整えることの力を示す研究です。", "unverified": "本文は未読。型式別の損傷率の数値は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "橋梁規模の2連RCボックスカルバートを現地載荷", "title": "FIELD TESTING OF A BRIDGE SIZE TWO-CELL RC BOX CULVERT", "url": "https://doi.org/10.14455/isec.2026.13(2).str-12", "authors": "Aaron Cole ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米ケンタッキー州で多い2連の現場打ちRCボックスカルバート（橋梁規模）を、現地試験で評価した（抄録）。", "p3": "耐荷力評価が必要な橋梁規模カルバート1378基のうち90.1%がRCボックスで、その68.2%が2連であることを背景に、簡便で保守的な評価に代わる現地試験を行った（抄録）。", "p5": "土と構造物の相互作用が複雑なため、現地載荷が最も正確な評価法だと位置づけている（抄録。試験結果は抄録の途中で切れており未確認）。", "fun": "道路の下を水が通る箱型の構造物（カルバート）は、土に埋まっているので計算で強さを見積もるのが難しく、安全側に低く見積もられがちです。実際にトラックを載せて測ることで、本当はどれだけ耐えられるかを確かめる、という素朴だが確実な方法です。", "unverified": "本文は未読。試験の結果と荷重条件は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "路面識別に基づく複合制動とABSの統合制御", "title": "Integrated Control Strategy of Composite Braking and ABS Based on Road Surface Identification", "url": "https://doi.org/10.1088/1742-6596/3330/1/012020", "authors": "Hongbiao Xiao ほか", "venue": "Journal of Physics: Conference Series", "date": "2026-10-09", "citescore": 1.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "四輪インホイールモータの電気自動車で、路面の識別を核に、回生と摩擦の複合制動とABSを統合する制御を提案した（抄録）。", "p3": "単輪の制動モデルでラグランジュ補間により現在の路面のピーク粘着係数と最適スリップ率を求め、目標制動強度との比較で通常制動とアンチロック制動を切り替えた（抄録）。", "p5": "従来法の基礎制動トルクの未定義とモード切替時の衝撃という問題を解消すると主張している（抄録。数値は未確認）。", "fun": "電気自動車はブレーキのときにモータで発電して電気を回収できますが、滑りやすい路面ではタイヤがロックしないよう制御を切り替える必要があります。その切り替えの判断に「今の路面がどれだけ滑りやすいか」を推定して使うのが要点です。", "unverified": "本文は未読。シミュレーション等の検証結果は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "超大型台風下の高層ビル応答を無線計測と画像で", "title": "Dynamic response monitoring of a tall building during Super Typhoon Gaemi using wireless sensing and computer vision techniques", "url": "https://doi.org/10.1016/j.measurement.2026.123542", "authors": "Xiaoliang Ma ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-11", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、超大型台風Gaemiの通過時に、無線センサと画像計測（コンピュータビジョン）で高層ビルの動的応答を監視した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、強い台風の最中に高層ビルがどう揺れたかを、配線のいらないセンサとカメラ映像の両方で捉えられるか、というものです。めったに起きない極端な現象を実物で測る機会は貴重です。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "注意機構付き残差網でSHMデータから損傷検出", "title": "An attention-enhanced residual network framework for structural damage detection based on structural health monitoring data", "url": "https://doi.org/10.1038/s41598-026-73433-7", "authors": "Bo Xie ほか", "venue": "Scientific Reports", "date": "2026-10-11", "citescore": 6.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、構造ヘルスモニタリングのデータから、注意機構で強化した残差ネットワークで構造損傷を検出する研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、たくさんのセンサの記録のうち「どこに注目すべきか」を深層学習に学ばせて、損傷を見つけられるか、というものです。人の目が重要な部分に注意を向けるのと似た仕組みを使う点が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr22", "rank": 22, "headline": "自己給電の摩擦-電磁センサで車両振動を監視", "title": "Self-sustainable broadband triboelectric-electromagnetic vehicle vibration monitoring system using magnet-coil coupled resonance and non-contact sensing", "url": "https://doi.org/10.1016/j.energy.2026.142712", "authors": "MoonSeong Jo ほか", "venue": "Energy", "date": "2026-10-10", "sjr": 2.06, "citescore": 17.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、磁石とコイルの共振と非接触計測を使い、摩擦帯電と電磁誘導で自ら発電する広帯域の車両振動監視システムを作った研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、車の振動そのものを電気に変えてセンサの電源にし、同時にその振動を測れるか、というものです。電池交換のいらないセンサは、長期の監視に向いた発想です。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr23", "rank": 23, "headline": "インドネシア鉄道改革で会計が空間的不平等を再生産", "title": "Socio-spatial inequality: the case of Indonesian railway's reform", "url": "https://doi.org/10.1108/aaaj-11-2025-8618", "authors": "Muhammad Muttaqin", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-10-10", "sjr": 1.574, "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "インドネシア国鉄の改革で、統治の道具としての会計実務が駅の空間を作り変え、不平等を再生産したことを示した（抄録）。", "p3": "2009〜2014年の組織改革を対象に、従業員・乗客・コンサルタント・専門家への28件の半構造化面接と年次報告書・公文書を三角測量で分析した（抄録）。", "p5": "効率と顧客志向の論理が、非公式に支えられてきた賑わいのある駅の空間を商業的な区域に変え、長年の居住者を追い出し地域経済を混乱させたと論じた（抄録）。", "fun": "会計の数字は中立に見えますが、「効率」を測る物差しが駅の姿を変え、そこで暮らしていた人々を追い出すことがある、という指摘です。帳簿の上の判断が街の空間と人の生活に直結していることを示している点が面白いです。", "unverified": "本文は未読。結論の詳細は抄録の途中で切れており未確認。"}}, {"id": "jr24", "rank": 24, "headline": "ESG評価の高い企業は翌期の利益調整が少ないか", "title": "ESG Performance and Earnings Management: Evidence from Chinese Listed Firms", "url": "https://doi.org/10.6007/ijarbss/v16-i10/29093", "authors": "曹文, Rohaida Basiruddin", "venue": "International Journal of Academic Research in Business and Social Sciences", "date": "2026-10-10", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "前期のESG評価が高い中国企業ほど、翌期の利益調整が小さいかを時間順序を守った設計で調べた（抄録）。", "p3": "2015〜2024年の中国A株非金融企業で、t−1期のESG（8つの格付けの合成）、t期の利益調整（修正ジョーンズの裁量的発生高の絶対値と実体的利益調整の合成）をOLSで推定した（抄録）。", "p5": "前期のESG評価が高いほど、その後の発生主義の利益調整の大きさは小さかった（抄録。実体的利益調整の結果は途中で切れており未確認）。", "fun": "環境や社会への配慮で評価の高い会社は、会計の数字もごまかしにくいのか、という問いです。原因と結果の順番を守るため、ESGは前の年、利益調整はその次の年で測るという工夫が、相関を因果と取り違えないための基本を示しています。", "unverified": "本文は未読。係数の大きさは未確認。"}}, {"id": "jr25", "rank": 25, "headline": "財務困窮の決定要因をPRISMAで整理", "title": "Reading the Warning Signs: A PRISMA-Guided Systematic Review of Liquidity, Leverage, Profitability, and Firm Size as Determinants of Financial Distress", "url": "https://doi.org/10.61656/sbamr.v7i1.531", "authors": "Nurhidayah Nurhidayah ほか", "venue": "Sustainable Business Accounting and Management Review", "date": "2026-10-11", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "財務困窮を予測する4つの財務特性（流動性・レバレッジ・収益性・企業規模）の実証結果を、PRISMAに沿って系統的に整理した（抄録）。", "p3": "2020〜2024年の査読論文をCrossrefで8つの検索式で探し、引用追跡を加え、国・業種・期間・手法・困窮の代理変数・各要因の効果の向きでコード化した（抄録）。", "p5": "インドネシアの上場企業と食品・飲料業に注目し、矛盾する結果の整理を目的としている（抄録。結論は未確認）。", "fun": "会社が危なくなる前兆として、現金の余裕、借金の多さ、もうけ、会社の大きさのどれを重視すべきかは、研究によって答えがばらばらです。そのばらつきの理由を、国や業種、測り方の違いから整理しようとしている点が面白いところです。", "unverified": "本文は未読。採用論文数と結論は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "保険会社の財務比率と財務困窮", "title": "The Effect of Financial Ratios on Financial Distress in Insurance Companies", "url": "https://doi.org/10.38035/dar.v2i1.634", "authors": "Aditya Mawardana ほか", "venue": "Dinasti Accounting Review", "date": "2026-10-10", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシア証券取引所の保険会社で、保険業特有の財務比率がRBC（リスクベース資本）で測った財務困窮に与える影響を調べた（抄録）。", "p3": "2017〜2021年の13社を目的的抽出し、パネルデータの固定効果モデルで推定した（抄録）。", "p5": "4比率は全体として有意で、支払保険金比率と流動性比率は負で有意、引受比率は影響なしだった（抄録）。", "fun": "保険会社の健全性は、一般の会社とは違う「支払った保険金の割合」などの物差しで見る必要があります。業種の特性に合わせた指標を使うことで、困窮の前兆が見えやすくなるという考え方が基本にあります。", "unverified": "本文は未読。標本が13社と小さく、係数の値は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "変革管理が時間主導型ABC導入を後押し", "title": "Effective Change Management and Its Role in Facilitating Time-Driven Activity-Based Costing Adoption in Malaysian Private Universities", "url": "https://doi.org/10.6007/ijarafms/v16-i4/28869", "authors": "Dalmie Shahrul Suryati binti Azmee ほか", "venue": "International Journal of Academic Research in Accounting Finance and Management Sciences", "date": "2026-10-10", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "マレーシアの私立大学で、時間主導型活動基準原価計算（TDABC）の導入を「効果的な変革管理」が後押しすることを示した（抄録）。", "p3": "リーダーの支援・伝達・研修・組織の準備度からなる変革管理を多次元の構成概念とし、意思決定者と財務担当者316人の調査をPLS-SEMで分析した（抄録）。", "p5": "変革管理はTDABC導入に有意な正の効果を持ち、知覚された革新の特性と導入の関係を部分的に媒介した（抄録）。", "fun": "新しい原価計算の方法が良いものだと分かっていても、それだけでは組織に広まりません。上司の後押しや研修といった「変える仕組み」があって初めて導入が進む、という結果は、道具より使う組織の側が大事だということを示しています。", "unverified": "本文は未読。効果量の数値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "マテリアルフローコスト会計で損失原価を削減", "title": "Material Flow Cost Accounting and Its Role in Reducing Loss Costs and Enhancing Product Sustainability: An Applied Study in the General Company for Textile and Leather Industries", "url": "https://doi.org/10.21070/ijler.v21i4.1677", "authors": "Alaa Jassim Salman", "venue": "Indonesian Journal of Law and Economics Review", "date": "2026-10-08", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "繊維製造の工程ごとの物質とエネルギーの流れを、マテリアルフローコスト会計（MFCA）で追い、損失コストを特定した（抄録）。", "p3": "ISO 14051に基づくMFCAを繊維・皮革の公企業の連続した製造工程に適用した（抄録）。", "p5": "損失コストは総物質フローコストの3.288%で、改善案により約15.46%削減でき、材料利用率は91.791%に上がると見積もった（抄録）。", "fun": "普通の原価計算では、捨てられた材料の費用は製品の原価に紛れて見えません。材料の流れを工程ごとに追い、「捨てた分にいくらかかったか」を別に数えることで、環境とお金の両方の無駄が見えるようにする方法です。", "unverified": "本文は未読。工程別の内訳は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "テクノストレスとAIへの信頼がAI導入と幸福を媒介", "title": "Technostress and trust in AI mediate the association between AI adoption and employee well-being", "url": "https://doi.org/10.1007/s44202-026-00928-9", "authors": "K. D. V. Prasad ほか", "venue": "Discover Psychology", "date": "2026-10-11", "citescore": 1.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、職場へのAI導入と従業員のウェルビーイングの関係を、テクノストレスとAIへの信頼が媒介すると示した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、職場にAIが入ってきたとき、人が元気になるか疲れるかは、AIによる負担感（テクノストレス）とAIを信じられるかどうかで決まるのではないか、というものです。同じ技術でも受け止め方で結果が逆になりうる点が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr30", "rank": 30, "headline": "O*NETの興味・仕事価値検査をフィンランドで検証", "title": "Adaptation and Validation of the O*NET Interest Profiler and the O*NET Computerized Work Importance Profiler (WIP-C) in Finland", "url": "https://doi.org/10.1177/10690727261493137", "authors": "Ville Puonti ほか", "venue": "Journal of Career Assessment", "date": "2026-10-10", "sjr": 1.413, "citescore": 7.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "公開の職業探索ツールであるO*NET興味プロファイラー短縮版と仕事価値プロファイラー（WIP-C）を、フィンランド語と文化に適応させ妥当性を検証した（抄録）。", "p3": "フィンランドの高校生558人（16〜20歳、女性65%）のデータで、既存の興味検査・職業的意味の尺度・BFI-2-XSと比べ、無作為化検定と多次元尺度法で構造的妥当性を確かめた（抄録）。", "p5": "両ツールとも内的一貫性は満足でき、興味プロファイラーでは構造的・収束的・併存的妥当性が確認された（抄録）。", "fun": "アメリカで作られた職業適性の検査を、そのまま翻訳して別の国で使ってよいかは自明ではありません。言葉や文化が違っても同じものを測れているかを、既存の検査や性格検査との関係で一つずつ確かめる手順が丁寧です。", "unverified": "本文は未読。WIP-Cの妥当性の結果は抄録の途中で切れており未確認。"}}, {"id": "jr31", "rank": 31, "headline": "臨床看護師のレジリエンスには潜在的な型がある", "title": "Distinct profiles of psychological resilience and associated factors among clinical nurses: a latent profile analysis", "url": "https://doi.org/10.1186/s12912-026-05342-z", "authors": "Manzhi Yao ほか", "venue": "BMC Nursing", "date": "2026-10-11", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "資源保存理論に基づき、臨床看護師の心理的レジリエンスの潜在的な類型と、それに関わる要因を調べた（抄録）。", "p3": "臨床経験1年以上の看護師への横断調査で、CD-RISC-10の各項目を指標に潜在プロファイル分析を行い、単変量分析と多項ロジスティック回帰で関連要因を検討した（抄録）。", "p5": "レジリエンスの複数の類型を特定し、類型ごとの関連要因を示した（抄録。類型の数と要因は抄録の途中で切れており未確認）。", "fun": "「打たれ強さ」を一つの点数で測るのではなく、どんな組み合わせで強いか弱いかというタイプに分けて見る方法です。タイプが分かれば、一律の研修ではなく、それぞれに合った支え方を考えられるようになります。", "unverified": "本文は未読。類型の数、標本数、関連要因は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "ルーマニア高齢者の孤独とケアの分断", "title": "Loneliness and Psychosocial Vulnerability among Older Adults in Romania: Stakeholder Perspectives on Care, Social Isolation, and Institutional Fragmentation", "url": "https://doi.org/10.33788/rcis.94.6", "authors": "Eliza Monica MOTORGA", "venue": "Revista de Cercetare si Interventie Sociala", "date": "2026-10-11", "citescore": 0.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ルーマニアの高齢者の心理社会的な脆弱性を、孤独・情緒的孤立・ケアの分断に注目して関係者の視点から質的に分析した（抄録）。", "p3": "2023〜2024年にブカレストなど6都市のソーシャルワーカー、精神科医、介護者、NGO等への半構造化面接12件と質問票55件を、再帰的テーマ分析で分析した（抄録）。", "p5": "老年期の脆弱性は加齢だけでなく、移住による家族の離散、世代間関係の弱まり、地域参加の減少、制度の分断、心理社会的支援の乏しさの相互作用で形づくられていた（抄録）。", "fun": "子どもたちが国外へ働きに出た結果、故郷に残された高齢者が孤立するという、移民の送り出し国ならではの問題が見えてきます。孤独が個人の性格ではなく、家族の移動や制度の隙間といった社会の仕組みから生まれていることを示しています。", "unverified": "本文は未読。提言の具体的な内容は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "社会的連帯経済をグローバルヘルスに組み込む", "title": "Integrating the social and solidarity economy into global health: towards structural transformation for equity, resilience, and sustainability", "url": "https://doi.org/10.1186/s12992-026-01240-w", "authors": "Masami Fujita ほか", "venue": "Globalization and Health", "date": "2026-10-11", "sjr": 1.692, "citescore": 9.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "2023年に国連決議で認められた「社会的連帯経済（SSE）」を、グローバルヘルスの公正・回復力・持続可能性を実現する制度的手段として検討した（抄録）。", "p3": "グローバルヘルス研究でSSEがどう扱われてきたかを検討し、移民の健康を例に、SSEの包摂的で連帯に基づく実践が健康の決定要因にどう関われるかを論じた（抄録）。", "p5": "SSEを規範の枠組みとしてだけでなく、規範を実現する制度的アプローチとして位置づけた（抄録）。", "fun": "健康の問題は病院だけでは解決できず、仕事や住まい、地域のつながりと絡み合っています。協同組合や共済のような「助け合いの経済」を健康政策の道具として使おうという発想が面白い点です。", "unverified": "本文は未読。具体的な事例の詳細は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "中小企業は社会的結束の担い手になれるか", "title": "SMEs as Agents of Social Cohesion: Opportunities, Challenges, and Conceptual Framework", "url": "https://doi.org/10.12688/f1000research.183208.2", "authors": "Malek Al-edenat ほか", "venue": "F1000Research", "date": "2026-10-10", "citescore": 2.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中小企業が社会的結束の担い手となる仕組みを説明する、統合的な概念枠組みを提案した（抄録）。", "p3": "起業論・社会関係資本・CSRの学際的な視点から、地域への埋め込み、雇用慣行、利害関係者との関わりを通じた経路を整理した（抄録）。", "p5": "機会として革新性・柔軟性・強い地域性・局所的な影響・個別の関与を、課題として資源・到達範囲の限界、利害調整、持続性、規模拡大を挙げた（抄録）。", "fun": "地元の小さな会社は、雇用だけでなく人と人をつなぐ場所にもなっています。大企業にはない身軽さや地域との近さが、社会のまとまりを生む力になるという整理は、町の商店街の役割を考えるヒントになります。", "unverified": "本文は未読。実証の有無は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "社会的脆弱性が都市の暑熱リスク格差を広げる", "title": "Social vulnerability amplifies global inequality in urban heat risk", "url": "https://doi.org/10.1038/s43247-026-04137-z", "authors": "Xuewen Lei ほか", "venue": "Communications Earth and Environment", "date": "2026-10-11", "sjr": 3.168, "citescore": 11.3, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、社会的脆弱性が都市の暑熱リスクの世界的な不平等を増幅することを示した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、同じ暑さでも、貧しさや高齢などの弱さを抱えた人が多い都市ほど被害が大きくなり、世界の格差が広がるのではないか、というものです。気温だけでなく人の側の条件がリスクを決める点が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "道路設計と歩きやすさの知覚と歩行行動", "title": "The relationship between urban road design, perceived walkability, and walking behavior", "url": "https://doi.org/10.1016/j.urbmob.2026.100303", "authors": "Polycap Chesifu Chebe ほか", "venue": "Journal of Urban Mobility", "date": "2026-10-10", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefの題名検索で見つかった別の記録の抄録を使用", "preprint": false, "short": true, "p1": "街路単位の知覚された歩きやすさを測る新尺度SPaRSを作り、道路設計・歩きやすさ・歩行行動の双方向の関係を調べた（抄録）。", "p3": "アディスアベバの設計の異なる5街路（改良3・未改良2）で、自己申告の歩行頻度と歩きやすさの双方向関係を2つの構造方程式モデルで検討した（抄録）。", "p5": "街区単位ではなく街路単位で歩きやすさを測り、歩くことが歩きやすさの知覚に与える逆方向の影響も扱った（抄録。結果の数値は未確認）。", "fun": "歩きやすい道だから人が歩くのか、よく歩く人だから道を歩きやすいと感じるのか、という「卵と鶏」の問題に取り組んでいます。両方向の矢印を同時に調べることで、道路の改良の効果を正しく見積もろうとしている点が面白いです。", "unverified": "本文は未読。抄録の取得元が別記録のため同一論文かは要確認。結果は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "ダッカ都市圏の雇用副都心と多核化", "title": "Employment subcenters and polycentric urban development in the Greater Dhaka Region, Bangladesh", "url": "https://doi.org/10.1016/j.jum.2026.100584", "authors": "Tawhid Monzur ほか", "venue": "Journal of Urban Management", "date": "2026-10-10", "sjr": 1.142, "citescore": 8.5, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、バングラデシュの大ダッカ都市圏で雇用の副都心を特定し、多核的な都市発展を分析した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、人口が急増する巨大都市で、仕事の集まる場所が一つの中心から複数の拠点へ分かれていくのか、というものです。都市の形が通勤や交通のあり方を左右する点で面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "デマンド交通と路線バスの非対称な相互作用", "title": "Asymmetric modal interactions between demand-responsive transit and fixed-route transit: A spatiotemporal autoregressive approach", "url": "https://doi.org/10.1016/j.retrec.2026.101865", "authors": "Dain Oh ほか", "venue": "Research in Transportation Economics", "date": "2026-10-10", "citescore": 6.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefの題名検索で見つかった別の記録の抄録を使用", "preprint": false, "short": true, "p1": "農村部のデマンド交通と路線バスの関係が、非対称な補完関係であることを示した（抄録）。", "p3": "韓国・清州の農村部の日次乗車データに、時空間自己相関・建物環境・社会人口を制御する時空間自己回帰モデル（STARX）を当てはめた（抄録）。", "p5": "デマンド交通は路線バスに短期は代替、長期はシステム全体で補完として影響したが、路線バスがデマンド交通に与える影響は無視できるほど小さかった（抄録）。", "fun": "呼ぶと来る乗合タクシーのような交通は、路線バスのお客を奪うのか、それとも新しいお客を連れてくるのかは、短い目で見るか長い目で見るかで答えが変わります。一方通行の影響という非対称さが面白い発見です。", "unverified": "本文は未読。抄録の取得元が別記録のため同一論文かは要確認。"}}, {"id": "jr39", "rank": 39, "headline": "クチコミが製品普及に生む創発的な効果", "title": "Word-of-Mouth effects on emergent behavior in product diffusion dynamics 製品普及のダイナミクスにおけるクチコミ効果とその創発性に関する研究", "url": "https://doi.org/10.1299/transjsme.26-00103", "authors": "Yuta MURAMATSU ほか", "venue": "Transactions of the JSME (in Japanese)", "date": "2026-10-10", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、製品普及のダイナミクスでクチコミが生む効果とその創発性を、機械学会の論文として扱った研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、一人ひとりのクチコミの小さなやり取りが積み重なって、社会全体の普及の波という大きな動きが「創発」するのか、というものです。個と全体をつなぐ見方が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr40", "rank": 40, "headline": "三つの符号化器で領域横断の好みを分離", "title": "Tri-Encoder Disentanglement with Dynamic Preference Gating for Cross-Domain Recommendation", "url": "https://doi.org/10.1145/3857353", "authors": "Sanghyuk Moon ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-10-11", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "領域横断の系列推薦で、利用者の好みを領域固有・領域共通・領域横断系列に固有の3成分に分解するモデルを提案した（抄録）。", "p3": "3つの符号化器がそれぞれの好みを捉え、領域マスキングと勾配反転層による敵対的学習で分離を促し、表現の整合と相互独立を課した（抄録）。", "p5": "3成分を明確に分離する枠組みを示した（抄録。精度の数値は抄録   ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
