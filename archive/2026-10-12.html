正、否定的感情と負に関連した（抄録）。", "p6": "未査読のプレプリント。観察研究であり因果は示さない。対象は米国の低所得家庭に限られる（抄録）。", "fun": "子どもが「いつ」ぐずり始め、「何回」ぐずるかを、病気の発症までの時間を調べる生存分析という道具で扱っているのが面白い点です。感情を「あるかないか」ではなく時間の中の出来事として見ることで、家庭の状況との関係が細かく見えてきます。", "unverified": "効果の大きさ（ハザード比など）の数値は抄録からは未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "価値の多元性を選択実験で選好に結びつける", "title": "Are stated preference valuation methods fit for purpose in a pluralist world? Using hybrid choice experiments to link value pluralism to preferences for nature restoration", "url": "https://doi.org/10.2139/ssrn.7597166", "authors": "Tim De Kruiff ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "De Kruiff, T., Gamborg, C., Stratton, A. D. H., & Jacobsen, J. B. (2026). Are stated preference valuation methods fit for purpose in a pluralist world? Using hybrid choice experiments to link value pluralism to preferences for nature restoration. https://doi.org/10.2139/ssrn.7597166", "why": "ハイブリッド選択実験で価値の多元性と自然再生への選好を結びつけ、表明選好法の妥当性を問い直す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "自然の価値観が多様な人々に対しても、表明選好法（stated preference）による経済評価が一般的な選好を捉えられることを示した（抄録）。", "p3": "ポーランド・スロバキア・オランダの自然再生の選択実験データを、「自然の多元的価値」尺度の回答と潜在クラスのハイブリッド選択モデルで結びつけた（抄録）。", "p5": "全集団がトレードオフを行い辞書式選好は否定されたが、内在的・関係的価値の強い人は費用を無視する傾向があり、平均評価額を大きく歪めた（抄録）。", "fun": "「この森を守るのにいくら払いますか」という質問は、自然そのものに価値があると考える人にとっては答えにくいものです。そうした人が値段の欄を無視しがちなことをデータで見つけ、平均の金額を大きく動かしてしまうと示した点が面白いです。", "unverified": "本文は未読。回答者数と各クラスの割合は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "中東の地政学リスクを原油とマクロに写すベイズ道具箱", "title": "Geopolitical Oil-Supply Scenarios and Macroeconomic Risks: A Bayesian Toolkit for Policy Analysis", "url": "https://econpapers.repec.org/RePEc:bde:opaper:2616e", "authors": "Irma Alonso-Alvarez ほか", "venue": "RePEc NEP", "date": "2026-09-21", "why": "地政学的な原油供給シナリオをマクロ経済リスクに写像する、政策分析向けの扱いやすい枠組み。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "中東の地政学リスクを原油価格とマクロ経済に写像する、中央銀行向けの扱いやすいベイズ的な分析枠組みを作った（抄録）。", "p3": "地政学的不確実性を少数の排他的シナリオの確率分布とし、予測市場価格・専門家評価・高頻度指標でベイズ更新し、在庫・備蓄を差し引いた供給不足をブレント価格式に入れる3ブロック構成（抄録）。", "p5": "統計的予測との整合性の確認や、観測された原油価格から暗黙のシナリオ構成を逆推定することもできるとしている（抄録）。", "fun": "「戦争が起きるか」という不確かなことを、いくつかの筋書きとその確率で表し、新しいニュースのたびに確率を更新していく、というベイズ統計の考え方を政策に使っています。逆に原油価格から、市場が想定している筋書きを読み取れる点も面白いです。", "unverified": "本文は未読。実際の適用結果の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "ヘッドルーム規制の厚生外部性と最適設計", "title": "Welfare Externalities and Optimal Headroom Regulation", "url": "https://doi.org/10.2139/ssrn.7591078", "authors": "George Xiang", "venue": "SSRN", "date": "2026-10-10", "apa": "Xiang, G. (2026). Welfare Externalities and Optimal Headroom Regulation. https://doi.org/10.2139/ssrn.7591078", "why": "制度の余裕幅（ヘッドルーム）に条件づけた規制の最適設計を厚生外部性から導く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "規制当局が「余裕幅（ヘッドルーム）」だけに条件づけて政策を行うとき、何を失うかを理論的に特徴づけた（抄録）。", "p3": "2期間の銀行経済で、ヘッドルームに依存する移転が私的誘因と社会的誘因を一致させる条件を、ヘッドルームのヤコビアンが厚生のくさびを張るかどうかで示した（抄録）。", "p5": "条件が満たされないとき、最良の是正はくさびの重みつき射影となり、その残差が追加の政策手段の価値を示すことを導いた（抄録）。", "fun": "銀行の規制では「自己資本が基準をどれだけ上回っているか」という一つの数字で対応を決めがちです。数字一つに頼ると直せない歪みが残り、その大きさを線形代数の射影という考えで測れる、という見方が面白い点です。", "unverified": "本文は未読。具体的な数値例の有無は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "景気循環の曖昧さの下での頑健な資産選択", "title": "Robust Portfolio Choice under Business-Cycle Ambiguity", "url": "https://doi.org/10.2139/ssrn.7597409", "authors": "Xiaoshan Su ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Su, X., Li, Y., & Wang, J. (2026). Robust Portfolio Choice under Business-Cycle Ambiguity. https://doi.org/10.2139/ssrn.7597409", "why": "拡散・災害ジャンプ・景気遷移の曖昧さを同時に扱う頑健な消費・ポートフォリオ選択の理論。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "拡散・災害ジャンプ・景気循環の遷移についての曖昧さ（モデルの不確かさ）を同時に扱う、頑健な消費・ポートフォリオ選択を解いた（抄録）。", "p3": "CRRA型効用で完備・不完備市場の半解析的な最適政策を導き、厚生コストを数量化した（抄録）。", "p5": "景気の遷移では「平常から危機へ」への曖昧さ回避が逆方向より大きな影響を持ち、完備市場ではこれが、不完備市場では拡散リスクの曖昧さ回避が厚生上最も重要だった（抄録）。", "fun": "確率そのものが分からない状況（曖昧さ）を嫌う投資家は、最悪の場合を想定して資産を選びます。景気が悪化する確率の見積もりの不確かさの方が、回復する確率の不確かさより重く効く、という非対称性が面白い結果です。", "unverified": "本文は未読。厚生コストの具体的な値は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経営学", "headline": "生成AIはイノベーションの方向をどう変えるか", "title": "Generative AI and the Direction of Innovation: Knowledge Work, Public Value, and Policy in Research and Innovation Systems", "url": "https://doi.org/10.2139/ssrn.7593558", "authors": "Hooman Shababi", "venue": "SSRN", "date": "2026-10-10", "apa": "Shababi, H. (2026). Generative AI and the Direction of Innovation: Knowledge Work, Public Value, and Policy in Research and Innovation Systems. https://doi.org/10.2139/ssrn.7593558", "why": "生成AIを生産性だけでなくイノベーションの方向と公共価値の観点から位置づける政策論。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "生成AIを生産性の技術としてだけでなく、イノベーションの方向と統治の問題として位置づける政策向けの総合レビュー（抄録）。", "p3": "知識労働での生成AI研究を、イノベーションシステム論・ミッション志向・責任あるイノベーションの研究と結びつけ、作業成果・能力形成・利益の配分・方向と統治の4つの成果を区別した（抄録）。", "p5": "実験と現場の証拠は特定の作業での条件付きの生産性向上を支持するが、職業・企業・研究体制全体での一般的な生産性効果は確立していないと整理した（抄録）。", "fun": "AIで仕事が速くなるのは一部の作業に限られ、AIの得意範囲を超えると逆に成績が落ちることもあります。速さだけでなく、人が育つか、誰が得をするか、知識の基盤を誰が握るかまで見るべきだという整理は、技術の評価軸を広げるものです。", "unverified": "本文は未読。参照した研究の範囲は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "宇宙開発に学ぶ極限環境の結合型イノベーション", "title": "Space Innovation Systems and Coupled Innovation Dynamics in Extreme Contexts", "url": "https://doi.org/10.2139/ssrn.7593559", "authors": "Bo Nielsen ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Nielsen, B., Raswant, A., Asakawa, K., & Buckely, P. J. (2026). Space Innovation Systems and Coupled Innovation Dynamics in Extreme Contexts. https://doi.org/10.2139/ssrn.7593559", "why": "高度な技術と資源効率を同時に生む宇宙イノベーションシステムを理論化する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "宇宙開発を、最先端技術と資源節約型（フルーガル）イノベーションを同時に生むイノベーションシステムとして理論化した（抄録）。", "p3": "質量・電力・容積・通信・乗員時間などの厳しい制約と、打ち上げ後に直せない不可逆性が、能力形成の仕組みを生むという能力形成モデルを構築した（抄録）。", "p5": "信頼性志向の学習、検証重視の開発、モジュール分解、システム統合と再結合という共通の仕組みから、高度さと節約が同じ能力基盤から生まれると論じた（抄録）。", "fun": "宇宙では重さも電気も限られ、一度打ち上げたら修理できません。その極端な制約が、最先端でありながら無駄のない技術を生むという見方は、「制約が創造性を生む」という身近な経験を理論にしたものと言えます。", "unverified": "本文は未読。事例の具体的な内容は未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "機械学習で単体法の最適基底を当て最適潮流を高速化", "title": "Machine Learning for Exact Simplex Basis Prediction: A Discrete Combinatorial Warm-Start for Real-Time DC Optimal Power Flow", "url": "https://doi.org/10.2139/ssrn.7593602", "authors": "Muhammad Dzulqarnain Al Firdausi ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Al Firdausi, M. D., Al-Ghazi, A., & Syed, M. N. (2026). Machine Learning for Exact Simplex Basis Prediction: A Discrete Combinatorial Warm-Start for Real-Time DC Optimal Power Flow. https://doi.org/10.2139/ssrn.7593602", "why": "DC最適潮流の線形計画で最適基底を直接予測し、厳密解のまま実時間計算を高速化する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "DC最適潮流の線形計画で、最適解を離散的な「基底」として機械学習で直接予測し、単体法の初期値に使う方法を提案した（抄録）。", "p3": "ランダムフォレスト、AdaBoost、XGBoost、k近傍法、多層パーセプトロンの5手法を、PGLib-OPFの11の送電網と確率的な負荷の条件で比べた（抄録）。", "p5": "Gurobiで評価すると、予測した基底によりすべての運用シナリオで単体法の反復回数が大きく減った（抄録）。", "fun": "連続的な数値を予測すると、わずかな誤差で送電網の制約を破ることがあります。そこで答えを「どの制約がぎりぎりで効いているか」という組み合わせの問題として当てにいく、という発想の転換が面白い点です。組み合わせが当たれば、厳密な答えが一気に求まります。", "unverified": "本文は未読。反復回数の削減率の数値は未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "株式の埋め込みは単純な基準を超えるか", "title": "A Systematic Benchmark of Vector Stock Embeddings", "url": "https://doi.org/10.2139/ssrn.7591058", "authors": "Tomasz Rymaszewski", "venue": "SSRN", "date": "2026-10-10", "apa": "Rymaszewski, T. (2026). A Systematic Benchmark of Vector Stock Embeddings. https://doi.org/10.2139/ssrn.7591058", "why": "相関網やリターンから学習した株式埋め込みを体系的に比較し、実用上の有効性を検証する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "株式の埋め込みベクトルが、圧縮元の生の特徴量より本当に優れているかを体系的に検証した（抄録）。", "p3": "S&P 500・Russell 1000・Russell 3000で、期間・共変動の除去法・グラフ構成・6種の表現を変え、検索・クラスタリング・教師あり読み出しをGICS分類に対して多重比較補正つきで評価した（抄録）。", "p5": "学習した埋め込みはすべて生の相関行の基準をsub-industry hit@3で0.11〜0.21上回ったが、生のリターン系列は明確には超えず、Russell 3000では統計的に同等（p=0.69）だった（抄録）。", "fun": "AIで作った「株の特徴ベクトル」は、元のデータをそのまま使うのと比べて本当に良いのか、という素朴な問いに丁寧に答えています。比べる相手の選び方次第で「勝ち」にも「引き分け」にもなる、という結論は、比較実験の基準の大切さを教えてくれます。", "unverified": "本文は未読。その他の評価指標での結果は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "いつLLMに聞くかを学ぶ地下鉄ダイヤ再編", "title": "When2Ask? Fusing Multi-Agent Reinforcement Learning with Large Language Models for Metro Train Rescheduling", "url": "https://doi.org/10.2139/ssrn.7593806", "authors": "Qin luo ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "luo, Q., Du, H., Li, L., De Giovanni, L., WANG, Y., Su, B., & HUANG, S. (2026). When2Ask? Fusing Multi-Agent Reinforcement Learning with Large Language Models for Metro Train Rescheduling. https://doi.org/10.2139/ssrn.7593806", "why": "多エージェント強化学習とLLMを融合し、応答性と汎化を両立させるダイヤ再編手法。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "地下鉄のダイヤ再編で、強化学習による即時制御と、LLMを含む戦略層による全体最適化を必要なときだけ切り替える階層的な枠組みWhen2Askを提案した（抄録）。", "p3": "問題を分散型部分観測マルコフ決定過程と混合整数線形計画で定式化し、列車ごとの制御はマルチエージェント強化学習、全体の調整はLLM・小型言語モデル・MILPソルバで行う（抄録）。", "p5": "設備制約や旅客の待ちから協調が必要と判断したときに戦略層を起動する（抄録。性能の数値は抄録の途中で切れており未確認）。", "fun": "普段は各列車が素早く自分で判断し、大きな乱れのときだけ「司令塔」に相談するという分担は、人間の組織にも似ています。司令塔の中でも、過去事例を探すのは大型のLLM、細かい作業は小型モデル、最後の計算は最適化ソルバ、と役割を分けている点が面白いです。", "unverified": "本文は未読。比較手法と性能の数値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "充電待ちと時間帯料金まで含むEV配送の強化学習", "title": "Deep Reinforcement Learning for the Electric Vehicle Routing Problem with Time Windows,Partial Charging, Charging-Station Queues and Time-of-Use Electricity Prices", "url": "https://doi.org/10.2139/ssrn.7592698", "authors": "Mathesh G ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "G, M., S, M., D, K., & S, A. A. (2026). Deep Reinforcement Learning for the Electric Vehicle Routing Problem with Time Windows,Partial Charging, Charging-Station Queues and Time-of-Use Electricity Prices. https://doi.org/10.2139/ssrn.7592698", "why": "部分充電・充電所の待ち行列・時間帯別電気料金を同時に扱うEV配送経路問題を深層強化学習で解く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "時間枠、部分充電、充電所の待ち行列、時間帯別電気料金を同時に含む電気自動車の配送経路問題を深層強化学習で解いた（抄録）。", "p3": "問題をマルコフ決定過程とし、先読みの実行可能性マスクで立ち往生を防ぐ方策ネットワークをREINFORCEで学習させた。27の正規化特徴で行動を評価し、規模に依存しない（抄録）。", "p5": "顧客10〜30の合成問題で、焼きなまし法より10顧客で2.4%、20顧客で13.0%、学習にない30顧客で24.9%安く、22〜38倍速かった（抄録）。", "fun": "配送トラックが電気自動車になると、どこを回るかだけでなく、いつ・どこで・どれだけ充電するか、充電器が空いているかまで考えなければなりません。学習で見たことのない大きさの問題でも従来法に勝った点が、この手法の強みを示しています。", "unverified": "本文は未読。実データでの検証の有無は未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "重なる投影から物体ごとの放射線寄与を推定", "title": "Object-level response estimation for a collimated Geiger–Müller array under non-uniform contamination", "url": "https://doi.org/10.2139/ssrn.7593552", "authors": "Yongzhuo LIU ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "LIU, Y., ZHANG, J., LIU, H., XI, F., & Mi, Y. (2026). Object-level response estimation for a collimated Geiger–Müller array under non-uniform contamination. https://doi.org/10.2139/ssrn.7593552", "why": "コリメートした計数管アレイで、非一様汚染下の物体別寄与を推定する逆問題の統計的手法。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "コリメートしたガイガー・ミュラー計数管アレイで、投影が重なり内部の汚染が一様でない物体ごとの放射線寄与を推定する逆計測法を作った（抄録）。", "p3": "OpenGATEで材料の幾何を保った応答行列を作り、物体ごとに4つの非負の部分領域係数を有限窓の計数尤度と縮小推定で求め、分割コンフォーマル較正で区間を付けた（抄録）。", "p5": "40の試験形状で、基準計数500のとき寄与割合の平均誤差は0.2653で、一様線源を仮定した推定より全体で13.4%、局所汚染で35.9%小さかった（抄録）。", "fun": "重なって見える複数の物体のうち、どれがどれだけ放射線を出しているかを、外から数えたカウントだけで割り振る問題です。答えが一つに決まらない部分（ヌル空間）を数学的に見極め、推定の幅まで示している点が誠実な設計です。", "unverified": "本文は未読。一様モデルが優れる条件の詳細は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "電流磁場に強いTMR-慣性の姿勢推定", "title": "Reliability-Aware TMR-Inertial Attitude Estimation for Multirotor Aircraft under Current-Induced Magnetic Disturbance", "url": "https://doi.org/10.2139/ssrn.7597052", "authors": "JiaNan Wang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Wang, J., Peng, X., & Wang, Z. (2026). Reliability-Aware TMR-Inertial Attitude Estimation for Multirotor Aircraft under Current-Induced Magnetic Disturbance. https://doi.org/10.2139/ssrn.7597052", "why": "信頼度を考慮した磁気-慣性融合で、マルチロータ機の電流起因の磁気擾乱下でも方位を推定する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "トンネル磁気抵抗（TMR）磁力計を、モーター電流による磁気擾乱のあるマルチロータ機の方位基準に使えるようにする姿勢推定の枠組みを作った（抄録）。", "p3": "非線形応答・軸結合・ハードアイアン・電流と磁場の結合を含む21パラメータの較正モデルと、磁場ノルム残差による共分散の調整、方位の新息検定、3状態EKFを組み合わせた（抄録）。", "p5": "磁場ノルムのRMS誤差は較正姿勢で0.7760から0.0520 µTに下がり、未使用の検証データでも0.0690 µT程度を保った（抄録）。", "fun": "ドローンのモーターに流れる電流そのものが磁場を作り、方位磁石を狂わせます。その影響を電流から予測して差し引き、さらに「今の磁気の測定は信用できるか」を判定して使い分ける、という二段構えが工夫の要点です。", "unverified": "本文は未読。閉ループ試験での方位誤差の値は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "信号とモデルを分けた軽量な電池残量推定", "title": "Lightweight SOC Estimation via Signal-Model Decoupling and Adaptive Bias Compensation", "url": "https://doi.org/10.2139/ssrn.7597208", "authors": "Defu Jiang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Jiang, D., Guo, Z., Xu, X., Bao, H., Shan, H., & Chen, K. (2026). Lightweight SOC Estimation via Signal-Model Decoupling and Adaptive Bias Compensation. https://doi.org/10.2139/ssrn.7597208", "why": "高精度モデルの計算負荷を避けつつ適応的バイアス補正でSOCを推定する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "電池の充電状態（SOC）推定で、信号とモデルを切り分けて計算を軽くしつつ発散を防ぐ枠組みを提案した（抄録）。", "p3": "変分モード分解で端子電圧から開放電圧の低周波成分を取り出し、定常と過渡の電流を分けた補償で、従来の観測方程式で起きる抵抗の電圧降下の「二重差し引き」を解消した（抄録）。", "p5": "持続的な低周波のバイアスをほぼ平均ゼロの確率的残差に変え、分極パラメータをオフラインで固定して計算負荷を抑えた（抄録。精度の数値は未確認）。", "fun": "電池の残量は直接は測れず、電圧から推定します。ところが取り出した電圧にはすでに抵抗の分の降下が含まれているのに、式の中でもう一度引いてしまう、という見落としを見つけて直した点が要です。式の細部の矛盾が推定のずれを生むことを示しています。", "unverified": "本文は未読。推定誤差の数値と検証条件は未確認。"}}, {"id": "pn29", "rank": 29, "field": "因果推論", "headline": "自律運航船の事故で原因を誰に帰属させるか", "title": "A Conceptual Framework for Causal Attribution in Incidents Involving Maritime Autonomous Surface Ships", "url": "https://doi.org/10.2139/ssrn.7589658", "authors": "Farzaneh Javadi", "venue": "SSRN", "date": "2026-10-11", "apa": "Javadi, F. (2026). A Conceptual Framework for Causal Attribution in Incidents Involving Maritime Autonomous Surface Ships. https://doi.org/10.2139/ssrn.7589658", "why": "開発者・統合者・船主・遠隔操船者に分散した判断の因果帰属を整理する概念枠組み。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "自律運航船の事故で、開発者・統合者・船主・遠隔運航センターそれぞれの寄与度を示すための因果帰属の概念枠組みACAMを提案した（抄録）。", "p3": "認証された事故証拠、構造的因果モデル、介入による反実仮想を、不確かさを明示したシャープレイ値による帰属に結びつけ、知見を蓄積する連合型の台帳AMRLも構想した（抄録）。", "p5": "因果的責任と法的責任は別物だが切り離せず、帰属は規範的な選択に依存するため、それを明示し検証可能にする設計だと論じた（抄録）。", "fun": "人が操船しない船がぶつかったら誰の責任か、という難問に、ゲーム理論で協力の貢献を公平に分けるシャープレイ値を使おうという提案です。どの「普通の基準」と比べるかで責任の割合が変わる、という指摘は、数字が価値判断と切り離せないことを示しています。", "unverified": "本文は未読。仮想事例の詳細は未確認。"}}, {"id": "pn30", "rank": 30, "field": "組織行動・心理的安全性", "headline": "意思決定の性質に応じてリーダーの判断を変える理論", "title": "Decision Elasticity Theory: A Multidimensional Framework for Contingent Leadership Decision-Making", "url": "https://doi.org/10.2139/ssrn.7593356", "authors": "Dr. Jitendra Shrivastava ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Shrivastava, Dr. J., & Yadav, Dr. N. (2026). Decision Elasticity Theory: A Multidimensional Framework for Contingent Leadership Decision-Making. https://doi.org/10.2139/ssrn.7593356", "why": "意思決定ごとに協議・速度・リスク許容を変える「意思決定弾力性」の多次元枠組みを提案する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "意思決定の可逆性・価値の半減期・相互依存性の3次元で、リーダーの判断スタイルを使い分ける「意思決定弾力性理論（DET）」を提案した（抄録）。", "p3": "既存の状況対応型リーダーシップ論が1次元に条件づけていたのに対し、3つの性質を直交する次元として8つの区画を作り、それぞれに判断スタイルを対応させた（抄録）。", "p5": "組織に蓄積する「意思決定の負債」という概念も導入した（抄録。実証の有無は未確認）。", "fun": "取り消せる決定か、時間が経つと価値が下がる決定か、関係者が多い決定か、という3つの軸で決め方を変えるべきだという提案です。経験豊富な管理職が直感でやっていることを、立方体の8つの部屋に整理して見える化しようとしている点が面白いです。", "unverified": "本文は未読。理論の検証方法は未確認。"}}, {"id": "pn31", "rank": 31, "field": "開発経済学", "headline": "世界銀行とネパール政府の開発協力10年", "title": "Relationship between World Bank Group and Nepal Government (2010- 2019)&nbsp;", "url": "https://doi.org/10.2139/ssrn.7589139", "authors": "Manoj Aryal", "venue": "SSRN", "date": "2026-10-10", "apa": "Aryal, M. (2026). Relationship between World Bank Group and Nepal Government (2010- 2019)&nbsp; https://doi.org/10.2139/ssrn.7589139", "why": "2010〜2019年のネパールにおける国際開発協力と政府開発援助の関係の動態を分析する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "2010〜2019年のネパールで、世界銀行グループを中心とする国際開発協力と政府開発援助の関係の変化を分析した（抄録）。", "p3": "公式の支出データ、援助の断片化、連邦制下での2019年国際開発協力政策の実施を分析し、ハーヴェイの新自由主義批判の枠組みで国別パートナーシップ戦略の影響を検討した（抄録）。", "p5": "譲許的援助から非譲許的な市場融資への移行を評価し、2018/19年度の年間支出は2億4200万ドルに達したと報告している（抄録）。", "fun": "援助は「もらうもの」から「借りるもの」へと性格を変えつつあり、中所得国を目指す国ほどその流れに乗ります。教育や医療といった暮らしの基盤に、国際機関の方針がどう入り込むかを10年分たどっている点が興味深いところです。", "unverified": "本文は未読。結論部分は抄録の途中で切れており未確認。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "グリーンウォッシングは債務不履行リスクを高める", "title": "The Impact of Corporate Greenwashing on Debt Default Risk", "url": "https://doi.org/10.2139/ssrn.7593730", "authors": "Yiyi Hao ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Hao, Y., & Gu, Z. (2026). The Impact of Corporate Greenwashing on Debt Default Risk. https://doi.org/10.2139/ssrn.7593730", "why": "企業のグリーンウォッシングと債務デフォルトリスクの関係を中国企業で検証する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業のグリーンウォッシング（環境配慮の誇張）が債務不履行リスクを高めることを、中国の上場企業で示した（抄録）。", "p3": "2013〜2024年の中国A株上場企業のパネルデータで実証し、情報の透明性と資金調達制約を経路として検定した（抄録）。", "p5": "グリーンウォッシングは不履行リスクを有意に高め、その効果は小規模・非国有企業と市場化の遅れた地域で強かった（抄録）。", "fun": "環境に優しいふりをすると、一時的には評判が上がっても、情報が不透明になってお金を借りにくくなり、結局は返済に困るリスクが増える、という結果です。見せかけのコストが財務に跳ね返る仕組みを示している点が面白いです。", "unverified": "本文は未読。効果の大きさの数値は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "高インフレ期のEU家計の金融資産構成", "title": "The impact of socioeconomic factors on the composition of household financial assets in EU countries during high inflation", "url": "https://doi.org/10.2139/ssrn.7597172", "authors": "Tibor Tatay ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Tatay, T., Novak (Novák), Z., & Galambos, B. (2026). The impact of socioeconomic factors on the composition of household financial assets in EU countries during high inflation. https://doi.org/10.2139/ssrn.7597172", "why": "相次ぐ供給・需要ショック下で社会経済要因と家計の金融資産構成の関係を調べる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "相次ぐ供給・需要ショックの高インフレ期に、EU諸国の社会経済条件と家計の金融資産構成の関係を調べた（抄録）。", "p3": "マクロ経済・人口指標の主成分分析で4つのクラスタに分類し、線形回帰とパネルARDLモデルで推定した（抄録）。", "p5": "就業率と高学歴者の割合が高く公的債務が低い国ほど現金が少なく株式と年金が多く、公的債務が高く女性就業率が低く農村人口が多い国では預金・債券・投資信託が多かった（抄録）。", "fun": "インフレのときに家計が現金で持つか、株や年金で持つかは、その国の働き方や教育、政府の借金の多さと関係している、という結果です。家計の財布の中身が国の姿を映しているという見方が面白い点です。", "unverified": "本文は未読。対象国数と期間は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "指値板ABMで市場の回復力は機構ごとに違う", "title": "Mechanism-specific market resilience and size-dependent nonlinear response in a unified limit-order-book agent-based model ​", "url": "https://doi.org/10.2139/ssrn.7593492", "authors": "Arina Ravilova ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Ravilova, A., Goncharov, I., Kantemirova, E., & Lukianchenko, P. (2026). Mechanism-specific market resilience and size-dependent nonlinear response in a unified limit-order-book agent-based model ​. https://doi.org/10.2139/ssrn.7593492", "why": "統一した指値板エージェントモデルで、不安定化の機構ごとの回復力と規模依存の非線形反応を示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "指値注文板の市場の不安定化を単一の原因ではなく集団的な性質として捉え、1つのエージェントベースモデルで8種類の摩擦とショックへの反応を比べた（抄録）。", "p3": "ノイズ・トレーダー、ファンダメンタリスト、Lux–Marchesi型の意見動学を持つトレンド追随者、戦略切替者、在庫制約のあるマーケットメーカーからなる連続ダブルオークションに、速度優位・遅延・流動性の厚さ・ニュースなどのショックを与えた（抄録）。", "p5": "市場の回復力は機構ごとに異なり、ショックの大きさに対して非線形に反応する（題名・抄録。具体的な数値は抄録の途中で切れており未確認）。", "fun": "株価の急落はニュースや高速取引のせいにされがちですが、実は参加者の顔ぶれや注文板の状態が組み合わさって決まる「みんなの反応」だ、という見方です。同じ仕組みに8種類の揺さぶりをかけて比べる実験室のような設計が面白い点です。", "unverified": "本文は未読。主要な結果の数値は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "点検所見からLLMは補修要否を判断できるか", "title": "EVALUATION OF LLM FOR DECISION-MAKING REGARDING THE NECESSITY OF TAKING MEASURES AGAINST BRIDGE DAMAGE", "url": "https://doi.org/10.14455/isec.2026.13(2).fam-03", "authors": "Teruyuki Miyakawa ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "apa": "Miyakawa, T., Nakamura, S., & Nishikawa, T. (2026). EVALUATION OF LLM FOR DECISION-MAKING REGARDING THE NECESSITY OF TAKING MEASURES AGAINST BRIDGE DAMAGE. Proceedings of International Structural Engineering and Construction, 13(2). https://doi.org/10.14455/isec.2026.13(2).fam-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、出版社のXMLに含まれる抄録を使用", "preprint": false, "p1": "橋梁点検技術者の自由記述の所見から、LLMが損傷状態と環境条件を踏まえて補修などの対策の要否を推論できるかを評価した（抄録）。", "p2": "橋梁の維持管理では、単純な数値データを超えた事例ごとの判断が求められ、専門的な技能が必要とされる（抄録）。", "p3": "第1段階で、点検者の自由記述に「事実」「推定の根拠」「推定の理由」「対策の方針」の4要素が書かれているかを、文の構成要素の自然言語処理で分析する方法を作った。第2段階で、対策判断の根拠となる事例を文脈内学習（in-context learning）でLLMに与え、損傷状態と環境条件から必要な措置を推論するモデルを実装した（抄録）。", "p4": "推論結果と、第1段階で見た4要素の記述の過不足との関係で評価した（抄録）。比較対象と定量的な指標は抄録からは未確認。", "p5": "推論の結果からも、第1段階で示した4要素の記述の不足が浮かび上がることが確認された。思考の連鎖（Chain of Thought）で強化した推論モデルと文脈内学習の組み合わせが橋梁維持管理に有効だった（抄録）。", "p6": "抄録には事例数、正答率などの定量的な結果が示されておらず、有効性の程度は確認できない。対象の橋梁や点検記録の出所も未確認。", "fun": "点検記録に「何を見たか」「なぜそう考えたか」「どうすべきか」がそろって書かれていないと、AIも正しい判断ができません。AIに判断させてみることで、人間の記録の書き方の弱点が逆に見えてくる、という使い方が面白い点です。", "unverified": "使用したLLMの種類、事例数、評価指標と数値はすべて未確認。"}}, {"id": "jr02", "rank": 2, "headline": "RAGとReActで橋梁維持管理のLLMエージェント", "title": "RAG-ReAct empowered large language models for localized intelligent bridge operation and maintenance: a knowledge-driven agentic approach", "url": "https://doi.org/10.55092/pe20260012", "authors": "Yawu Su ほか", "venue": "Proceedings Engineering", "date": "2026-10-10", "apa": "Su, Y., Dong, K., Liu, Y., Chen, M., & Zhang, R. (2026). RAG-ReAct empowered large language models for localized intelligent bridge operation and maintenance: a knowledge-driven agentic approach. Proceedings: Engineering, 1. https://doi.org/10.55092/pe20260012", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "知識ベースの自動構築、道具の標準化、検索拡張生成（RAG）と推論-行動（ReAct）を組み合わせ、1台のエッジ機器で動く橋梁の維持管理（O&M）エージェントを作った（抄録）。", "p2": "LLMを橋梁O&Mにそのまま使うと、専門分野での幻覚、推論のブラックボックス性、受け身の応答しかできない点が障害になる（抄録）。", "p3": "(1)知識ベースを自動で構築するパイプライン、(2)各O&M道具を自然言語の説明で包んだLLM生成の標準化された行動空間、(3)「知識に基づく思考→行動の実行→観察の帰還」の循環で閉ループのO&M作業を行うRAG-ReActのワークフロー、の3要素からなる（抄録）。", "p4": "Qwen3シリーズ（0.6B〜14Bパラメータ）と6万字の高速道路橋O&M知識ベースで体系的な実験を行った（抄録）。", "p5": "領域知識ベースの統合で専門的な正確さが大きく向上し、提案エージェントは単一のエッジ機器で閉ループの橋梁O&Mワークフローを実行できた（抄録）。", "p6": "抄録には正確さの数値や比較手法が示されておらず、改善の大きさは確認できない。実際の橋梁管理の現場での運用評価の有無も未確認。", "fun": "大きなAIをクラウドで動かす代わりに、小さなモデルに橋の専門知識の本棚（知識ベース）を持たせ、現場の機器だけで「調べる→考える→道具を使う→結果を見る」を繰り返させる発想です。物知りでなくても、調べ方を知っていれば仕事ができる、という人間の新人教育にも似ています。", "unverified": "正確さの具体的な数値、比較対象、モデル規模ごとの差は抄録からは未確認。"}}, {"id": "jr03", "rank": 3, "headline": "CWTとSTFTで構造損傷を検出する", "title": "STRUCTURAL DAMAGE DETECTION USING CONTINUOUS WAVELET TRANSFORM AND SHORT-TIME FOURIER TRANSFORM FOR STRUCTURAL HEALTH MONITORING", "url": "https://doi.org/10.14455/isec.2026.13(2).str-48", "authors": "Mohammad S. Miah ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "apa": "Miah, M. S., & Lienhart, W. (2026). STRUCTURAL DAMAGE DETECTION USING CONTINUOUS WAVELET TRANSFORM AND SHORT-TIME FOURIER TRANSFORM FOR STRUCTURAL HEALTH MONITORING. Proceedings of International Structural Engineering and Construction, 13(2). https://doi.org/10.14455/isec.2026.13(2).str-48", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、出版社のXMLに含まれる抄録を使用", "preprint": false, "p1": "連続ウェーブレット変換（CWT）、短時間フーリエ変換（STFT）、Welch法のパワースペクトル密度（PSD）推定の3手法で構造物の共振周波数を推定し、損傷検出への有効性を比べた（抄録）。", "p2": "地震や強風などの極端な動的荷重を受ける構造物では外的な要因が加わりモニタリングが難しく、損傷とその深刻さを特定する効果的な手法が必要とされる（抄録）。", "p3": "振動応答から、時間周波数解析のCWTとSTFT、周波数領域のWelch法で共振周波数を推定し、3手法の結果を相互に比べた（抄録）。背景：損傷で剛性が下がると固有振動数が下がるため、周波数の変化が損傷の手がかりになる。", "p4": "推定した共振周波数の精度を手法間で比較した（抄録）。対象構造、データ（実測か数値か）、損傷の与え方は抄録からは未確認。", "p5": "3手法とも、損傷の影響を受けた構造物の周波数をかなり正確に同定できた（抄録）。", "p6": "抄録には推定誤差の数値や、手法ごとの長所短所の比較結果が示されていない。環境・運用条件の変動下での頑健性は未確認。", "fun": "揺れの記録を「どの高さの音（周波数）がどの時間に鳴っているか」に分解するのが、ウェーブレットやフーリエ変換という道具です。楽譜を読むように揺れを読むと、構造物の弱ったところで音程が変わることを手がかりに損傷を探せます。", "unverified": "対象構造、データの種類、精度の数値はいずれも未確認。"}}, {"id": "jr04", "rank": 4, "headline": "浮き上がりロッキング橋脚の動的挙動を無次元化", "title": "Dynamic Behavior of Uplift‐Rocking Tall Bridge Bent Systems: Theoretical Modeling, Verification, and Dimensionless Analysis", "url": "https://doi.org/10.1002/eqe.70308", "authors": "Yang Liu ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-11", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Liu, Y., Jia, J., Du, X., Manabe, H., Zhang, D., & Ju, X. (2026). Dynamic Behavior of Uplift‐Rocking Tall Bridge Bent Systems: Theoretical Modeling, Verification, and Dimensionless Analysis. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70308", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "浮き上がりとロッキングを許す高い2柱式橋脚（UR-TDCB）の地震時の動的挙動を、橋軸と直角の両方向で表す理論モデルを作り、無次元解析で設計パラメータの影響を示した（抄録）。", "p2": "浮き上がりロッキング系は橋脚の耐震回復力を高める解として注目されるが、異なる方向の動的応答はほとんど調べられていなかった（抄録）。", "p3": "分布質量の効果と、幾何・接触の非線形性を含む理論モデルを両方向について作り、近断層地震動の数学モデルの下で無次元の運動方程式を導き、無次元ロッキングスペクトルで解析した（抄録）。背景：ロッキングは柱脚が基礎から浮き上がって揺れることで、損傷を抑えつつ地震のエネルギーを逃がす。", "p4": "OpenSeesで最適化した数値モデルと、全体の動的応答と局所の非線形挙動を比べて精度と計算効率を検証した（抄録）。", "p5": "理論モデルは精度と計算効率の両方で確認された。動的細長比と無次元対角長が大きいほど両方向で安定性が高まり、剛体モデルで通常無視される無次元質量と減衰比が浮き上がり条件と一般化変位の要求を主に支配した（抄録）。", "p6": "抄録には数値モデルとの誤差の値が示されていない。近断層地震動を数学モデル（パルス）で表しており、実地震記録での検証の範囲は未確認。", "fun": "地震のときに橋脚をがっちり固定するのではなく、わざと足元を浮かせて揺らすことで壊れにくくする、というのがロッキングの発想です。普通は無視される柱の重さや減衰が、浮き上がるかどうかを決める主役だった、という結果が面白い点です。", "unverified": "無次元パラメータの具体的な値と、OpenSeesとの比較の誤差は抄録からは未確認。"}}, {"id": "jr05", "rank": 5, "headline": "割り込み過多がデジタル業務ストレスを生む", "title": "Job Demands, Resources, and Digital Job Stress: The Roles of Knowledge Diversity and Interruption Overload in Digitalized Work Settings", "url": "https://doi.org/10.1177/21582440261494250", "authors": "Nihan Öksüz Narinç ほか", "venue": "Sage Open", "date": "2026-10-11", "citescore": 3.5, "citescore_year": "2025", "apa": "Öksüz Narinç, N., Akarçay, N., Arun, K., Tufan, C., & Griffiths, M. D. (2026). Job Demands, Resources, and Digital Job Stress: The Roles of Knowledge Diversity and Interruption Overload in Digitalized Work Settings. Sage Open, 16(4). https://doi.org/10.1177/21582440261494250", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "トルコの公的銀行の支店長406人の調査で、割り込みの過多と職場の知識の多様性が、デジタル職務ストレスの下位次元にそれぞれ異なる形で関係することを示した（抄録）。", "p2": "テクノストレスは個人の技術への反応として一様に扱われがちで、組織の要求と資源から多次元に形づくられる見方や、非西欧・規制の強い業種での研究が不足していた（抄録）。", "p3": "仕事の要求度-資源（JD-R）モデルとテクノストレス理論に基づき、デジタル職務ストレスを複雑さ・不安・対立・有用性・技術支援などの多次元の構成概念とし、割り込み過多（IO）と知識の多様性（WKD）との関係をPLS-SEMで推定した（抄録）。", "p4": "支店長406人の調査データで、各下位次元へのIOとWKDの経路の符号と有意性を検証した（抄録）。", "p5": "IOはデジタル業務の複雑さ・不安・対立・知覚された有用性と正、技術支援と負に関連した。WKDは過負荷と正に関連する一方、社会的結束・安全・技術支援の知覚も強め、要求と資源の両面を持った（抄録）。", "p6": "横断的な自己報告の調査で因果は示せない。対象はトルコの公的銀行の支店長に限られる（抄録）。効果量は抄録からは未確認。", "fun": "知識の違う人がそろう職場は、調整の手間で忙しくなる一方、困ったときに助け合える安心感も生みます。同じ職場の特徴がストレスの源にも支えにもなる「二面性」を示した点が面白いところです。", "unverified": "各経路の係数の値と、ストレスの下位次元の正確な一覧は抄録からは未確認。"}}, {"id": "jr06", "rank": 6, "headline": "住宅ローンと賃貸の高齢者は孤独になりやすい", "title": "The financial fabric of loneliness: links between home-ownership status, financial strain and loneliness among older adults", "url": "https://doi.org/10.1017/s0144686x26101007", "authors": "Fahimeh Mehrabi ほか", "venue": "Ageing and Society", "date": "2026-10-10", "sjr": 1.135, "citescore": 7.8, "citescore_year": "2025", "apa": "Mehrabi, F., Bierman, A., & Lee, Y. (2026). The financial fabric of loneliness: links between home-ownership status, financial strain and loneliness among older adults. Ageing and Society, 46. https://doi.org/10.1017/s0144686x26101007", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Cambridge Coreの本文HTML（方法・結果・感度分析・考察と限界）と表1・2、図2・3の説明を読んだ", "preprint": false, "p1": "カナダの高齢者4,010人の全国調査で、住宅ローン返済中や賃貸の高齢者が持ち家（完済）の人より孤独で、その差は経済的負担で完全に媒介されることを示した（抄録、§Result）。", "p2": "社会経済的条件が老年期の孤独への脆弱性を形づくることは示唆されてきたが、住居の所有形態と経済的負担、孤独の関係を一緒に検討した研究は少なかった（§Introduction）。", "p3": "2021年9〜10月のオンライン調査（65〜85歳、回答率56%、国勢調査で重みづけ）を用い、孤独（Hughesの3項目）と経済的負担（3項目）を潜在変数とする構造方程式モデル（FIML推定）で、住居形態→経済的負担→孤独の媒介と性別との交互作用を推定した（§Method）。", "p4": "持ち家完済を基準とした群差を半標準化係数で表し、老年学の効果量の目安（Hedges' g 0.15が25パーセンタイル、0.40が50パーセンタイル）と比べた（§Result）。", "p5": "統制前の孤独の半標準化差は賃貸0.355、ローン0.132、統制後は0.167と0.133（表2）。経済的負担の差は賃貸0.538・ローン0.555と大きく、経済的負担は孤独と正に関連し（標準化0.223）、間接効果はab=0.140と0.144。経済的負担を入れると直接効果は消えた（図2）。ローンと持ち家の負担差は女性で0.673と男性の0.434より大きかった（図3）。", "p6": "横断データで因果の向きは示せない。施設入所者やホームレス状態の高齢者を含まず、持ち家が孤独の変化にどう関わるかは不明、孤独尺度は改変版である（§Discussion）。", "fun": "老後に家を持っているかどうかで寂しさが違うのは、家そのもののせいではなく、毎月の支払いに追われる経済的な不安のせいでした。不安を統計的にそろえると差が消えるという「媒介」の考え方で、原因の通り道を見つけている点が面白いところです。", "unverified": "補足資料の付録A（統制変数の推定値）と感度分析の詳細は確認していない。"}}, {"id": "jr07", "rank": 7, "headline": "家族介護のレジリエンスは「強いられた耐久」", "title": "Constrained endurance in long-term family caregiving: Rethinking resilience through nursing ethics", "url": "https://doi.org/10.1177/09697330261490920", "authors": "Haiyan Zhang ほか", "venue": "Nursing Ethics", "date": "2026-10-11", "sjr": 1.27, "citescore": 6.3, "citescore_year": "2025", "apa": "Zhang, H., Huang, L., Qin, H., Chong, M., Fan, Z., Liu, C., Sun, J., Shao, X., Li, J., Gu, J., & Wang, P. (2026). Constrained endurance in long-term family caregiving: Rethinking resilience through nursing ethics. Nursing Ethics. https://doi.org/10.1177/09697330261490920", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "長期の家族介護で称賛されがちな「レジリエンス」を倫理的に批判し、「制約された耐久（constrained endurance）」という概念で捉え直した（抄録）。", "p2": "家族介護者研究でレジリエンスは困難への適応力を表す確立した概念だが、障害のある高齢者の長期介護では、継続が適応力の表れか、依存・道徳的義務・文化的期待・選択肢の乏しさの結果かがあいまいである（抄録）。", "p3": "看護倫理の観点からレジリエンスの言説を批判的に検討する理論論文。無批判な称賛が介護者の苦痛を心理の問題にすり替え、構造的な問題を個人化し、耐えることに道徳的価値を与えると論じる（抄録）。", "p4": "実証データではなく概念分析による議論（抄録）。", "p5": "疲労・両価的な感情・不満・休みたい願いが、対処の失敗や責任感の不足ではなく、介護の体制が持続可能な限界を超えた合図として読まれるべきだと主張した。レジリエンスを道徳的基準ではなく、限界を認め、隠れた費用を可視化し、介護を「耐えられる」ではなく「持続可能」にする支援を促す倫理的な信号として扱うよう提案した（抄録）。", "p6": "概念的な議論であり、実証的な検証は伴わない。どの文化・制度の文脈を主に想定しているかは抄録からは未確認。", "fun": "「よく頑張っていますね」という褒め言葉が、実は介護する人を追い詰めることがある、という指摘です。弱音を「努力不足」ではなく「仕組みが限界に来ている知らせ」と読み替えると、支える側がすべきことが見えてくる、という発想の転換が面白い点です。", "unverified": "論拠として参照した先行研究と事例は抄録からは未確認。"}}, {"id": "jr08", "rank": 8, "headline": "孔子廟の近さと利益調整の関係は弱い", "title": "Confucian Cultural Exposure and Earnings Management in China: Evidence from Accrual-Based and Real Earnings Management", "url": "https://doi.org/10.6007/ijarafms/v16-i4/29094", "authors": "曹文, Rohaida Basiruddin", "venue": "International Journal of Academic Research in Accounting Finance and Management Sciences", "date": "2026-10-10", "apa": "Cao, W., & Basiruddin, R. (2026). Confucian Cultural Exposure and Earnings Management in China: Evidence from Accrual-Based and Real Earnings Management. International Journal of Academic Research in Accounting, Finance and Management Sciences, 16(4). https://doi.org/10.6007/ijarafms/v16-i4/29094", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの記事ページは抄録と参考文献のみで、本文PDFは取得できず抄録を使用", "preprint": false, "p1": "孔子廟が近いという儒教文化への接触と、中国企業の利益調整の関係を、発生主義と実体的利益調整に分け、時期による違いも含めて検証した（抄録）。", "p2": "儒教文化が利益調整を抑えるという先行研究はあるが、経営者の裁量の形（会計上の発生高か、実際の取引の操作か）の区別と、時期による違いの正式な検定が不足していた（抄録）。", "p3": "2015〜2024年の中国A株非金融企業で、登記地から100 km以内の孔子廟の数（1を足した自然対数）を文化接触の尺度とし、社会規範理論に基づく2つの仮説を、業種・年の固定効果と企業クラスタ標準誤差のプールドOLSと交互作用で推定した（抄録）。", "p4": "H1は発生主義の利益調整の大きさ、H2は上方向の実体的利益調整との負の関連。期間（2015–19、2020–22、2023–24）による違いも検定した（抄録）。", "p5": "発生主義の利益調整とは負だが有意でなくH1は支持されなかった。上方向の実体的利益調整とも負で、10%水準での限定的な支持にとどまった。実体的利益調整との関係は2020–22年に2015–19年より有意に負が強く、2023–24年との差は10%水準の弱い証拠だった（抄録）。", "p6": "著者は結果を因果効果ではなく条件付きの関連と解釈すると明記している（抄録）。孔子廟の数が文化的接触をどこまで代表するかが残る疑問。", "fun": "「会社の近くに孔子をまつる廟が多いほど、会計の数字をごまかしにくい」という面白い仮説ですが、今回の検証では帳簿上の操作との関係ははっきりせず、実際の取引の操作で弱い関係が見えただけでした。期待どおりの結果が出なかったことも正直に報告している点が大切です。", "unverified": "係数の大きさ、標本の企業数は抄録からは未確認。"}}, {"id": "jr09", "rank": 9, "headline": "役割を分けたLLMの熟議で特徴量を選ぶ", "title": "LLM-FS-Agent: a deliberative role-based large language model architecture for transparent feature selection", "url": "https://doi.org/10.11591/ijai.v15.i5.pp4026-4038", "authors": "Mohamed Bal-Ghaoui ほか", "venue": "IAES International Journal of Artificial Intelligence (IJ-AI)", "date": "2026-10-11", "citescore": 2.9, "citescore_year": "2025", "apa": "Bal-Ghaoui, M., & Sabri, F. (2026). LLM-FS-Agent: a deliberative role-based large language model architecture for transparent feature selection. IAES International Journal of Artificial Intelligence (IJ-AI), 15(5), 4026. https://doi.org/10.11591/ijai.v15.i5.pp4026-4038", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（方法・結果・限界・結論の節と表2・3）を読んだ", "preprint": false, "p1": "開始役・改良役・反論役・判定役に分かれた複数のLLMエージェントが特徴量の関連性を熟議し、根拠つきで順位を付ける特徴量選択の枠組みLLM-FS-Agentを提案した（抄録、§2.3）。", "p2": "LLMによる特徴量選択は次元削減に有望だが、既存の方法は構造化された推論と判断の明確な根拠を欠いていた（抄録）。", "p3": "特徴量名と課題の説明を入力とし、開始役が意味的な分析と初期スコア、改良役が平均・標準偏差・目的変数との相関などの統計情報で補強、反論役が査読のように弱点や冗長を指摘し、判定役が最終スコアS_final=w_r S_refined+w_c S_challenged（w_r+w_c=1）で統合する（表2）。", "p4": "IoT侵入検知のCIC-DIAD 2024（84特徴量、3クラス、不足クラスに合わせた無作為下方抽出で12,408件）で、LLM-SelectとPCAを比較対象に、XGBoost・RF・SVC・LRの精度とAUCを特徴量数n=5〜50で比べた。LLMはMistral、Qwen、Gemma3-4B、LLaMA3-2B、Phi3-miniを使った（§2.1–2.2、表3・4）。", "p5": "n=20が最も安定し、LLM-Selectが弱い場合に精度を最大1.49%改善したが、他のモデルではわずかに下がった（§3.1）。AUCの差は平均+0.10%程度と小さい（表3）。XGBoostの学習時間は平均1.87倍速くなった（p=0.028、Cohen's d=0.87）（§3.2）。", "p6": "結果は使うLLMの選択に左右されうること、重みw_r・w_cの適応的な調整と他のサイバーセキュリティ場面での検証が今後の課題と著者が述べている（§3.4）。解釈：精度の向上幅は小さく、主な利点は判断の根拠が読めることにある。", "fun": "どのデータ項目が大事かを、AIに一人で決めさせるのではなく、「提案する人」「補強する人」「反対する人」「まとめる人」の会議形式で決めさせています。精度はほとんど変わらなくても、なぜその項目を選んだかの議論が残るので、人が判断を確かめやすくなるという点が面白いところです。", "unverified": "図7〜11の曲線の個々の値と表5は確認していない。"}}, {"id": "jr10", "rank": 10, "headline": "射出型岩盤崩壊は岩盤構造で運動が変わる", "title": "Influence of Source‐Area Rock Mass Structure on the Dynamic Evolution of Rock Avalanches With Ejection‐Dominated Initiation", "url": "https://doi.org/10.1029/2026jf009137", "authors": "Haifeng Ding ほか", "venue": "Journal of Geophysical Research: Earth Surface", "date": "2026-10-11", "sjr": 1.437, "citescore": 6.6, "citescore_year": "2025", "apa": "Ding, H., Fu, X., Zhou, Y., Kang, J., Zhu, L., & Ge, Y. (2026). Influence of Source‐Area Rock Mass Structure on the Dynamic Evolution of Rock Avalanches With Ejection‐Dominated Initiation. Journal of Geophysical Research: Earth Surface, 131(10). https://doi.org/10.1029/2026jf009137", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "地震で射出される型の岩盤崩壊について、射出速度と発生源の節理密度が、破砕・運搬・堆積とエネルギーの推移をどう決めるかを連続-不連続の数値枠組みで定量化した（抄録）。", "p2": "射出が支配的な岩盤崩壊は、ひとまとまりの岩塊が飛び出し、着地の衝撃で破砕し、相互作用するブロック群に変わるため、危険度が高く動きが複雑で、物質運搬とエネルギー変換の体系的な理解が不足していた（抄録）。", "p3": "すべり土塊に水平・鉛直の初速度を与え、結合力型の破壊表現とブロック間の接触力学を組み合わせた連続-不連続の数値枠組みで、射出速度と節理密度を変えて解析した（抄録）。", "p4": "堆積の分布、破砕の程度、運動エネルギーの推移で評価した（抄録）。", "p5": "鉛直射出速度が大きいほど自由飛行時間と衝撃が増し、重心移動と到達距離、最大堆積厚と体積が大きく、破砕が強まった。節理密度が高いほど破砕が進んで細粒になり、薄く広い堆積になった。射出速度は衝突を遅らせて初期の運動エネルギーを高め、高い節理密度は亀裂・衝突・すべりでエネルギー散逸を促し減衰をなだらかにした。逆級化構造などの堆積構造が現れた（抄録）。", "p6": "抄録には実際の崩壊事例との比較や数値の値が示されていない。初速度を与える設定が地震動との連成をどこまで代表するかは未確認。", "fun": "地震で山の斜面の岩がポンと空中に飛び出すと、着地の衝撃で砕け、長い距離を流れていきます。もとの岩に割れ目が多いほど細かく砕けて薄く広がる、という結果は、割れ目の多いせんべいほど粉々になるのと似ていて直感的です。", "unverified": "到達距離や破砕度の具体的な数値、モデルの検証方法は抄録からは未確認。"}}, {"id": "jr11", "rank": 11, "headline": "特徴量を画像化したCNNでP2P貸倒予測", "title": "Structure-aware feature-to-image encoding with convolutional neural networks improves peer-to-peer credit default prediction compared with conventional tabular models", "url": "https://doi.org/10.1007/s44163-026-02391-w", "authors": "Ali Shahbazi ほか", "venue": "Discover Artificial Intelligence", "date": "2026-10-10", "citescore": 6.2, "citescore_year": "2025", "apa": "Shahbazi, A., Hekmatjou, S., Hosseinzadeh-Bisafar, G., Samavatian, E., & Najafzadeh, H. (2026). Structure-aware feature-to-image encoding with convolutional neural networks improves peer-to-peer credit default prediction compared with conventional tabular models. Discover Artificial Intelligence, 6(1). https://doi.org/10.1007/s44163-026-02391-w", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Springerの本文PDF（要旨、考察の主要な結果のまとめ、限界の節）を読んだ。方法の細部と表は一部のみ確認", "preprint": false, "p1": "P2P融資の貸倒予測で、相関する特徴量を隣り合わせに並べて画像化し、CNNで特徴を抽出してランダムフォレストと組み合わせると、従来の表形式モデルより安定して高い精度が得られることを示した（抄録、§4.1）。", "p2": "P2P融資では個人投資家が銀行が吸収していた貸倒リスクを負うため、精度の高い信用リスク予測が求められる。表形式モデルは特徴量間の構造を明示的に使わない（抄録、§1）。", "p3": "LendingClubの226万件・151特徴量から、事後情報など46列を漏洩監査で除き1,335,455件を残し、複合順位で64特徴量を選んだ。相関する特徴量を隣接行に置くIGTDの並べ方で64×64の濃淡画像にし、CNNの特徴を各種分類器に渡した（§4.1）。具体例：信用格付と金利、3つのFICO点などが近くに並び、畳み込みが組み合わせを拾える。", "p4": "14の分類器（表形式7、CNN単体、1D-CNN、CNN混成5）を、3つの均衡化条件で10×5の層別交差検証、Friedman検定と補正リサンプルt検定で比べた。格付の除去、ハイパーパラメータ感度、打切り補正つきの時系列外検証も行った（抄録）。", "p5": "CNN+RFが最良で、元の不均衡データで精度0.971、AUC-ROC 0.990。プラットフォームの格付指標を除くとAUC-ROCは0.930に下がり、最新20%の満期貸付での時系列外検証でも精度0.951、AUC-ROC 0.967を保った（抄録、表12–14）。", "p6": "データはLendingClub（2007〜2018年）の1つだけで、借り手IDがなく反復借入を調整できない。優位性のかなりの部分はプラットフォーム自身の格付に由来し、Grad-CAMの重要度を個々の属性の説明に結びつける実装は未了と著者が述べている（§4.7）。", "fun": "表の数字を絵に変えてから画像認識のAIに読ませると、項目どうしの組み合わせのパターンを拾いやすくなる、という発想が面白い点です。ただし成績の多くは会社自身が付けた信用格付に頼っていたと正直に報告しており、新しい手法の「上乗せ分」を見極める大切さも示しています。", "unverified": "比較した各表形式モデルの数値（表10）とSHAPの上位特徴量の詳細は確認していない。"}}, {"id": "jr12", "rank": 12, "headline": "ホームレス女性はデジタル健康をどう使うか", "title": "eHealthism in inclusion health: a qualitative longitudinal study with women experiencing homelessness", "url": "https://doi.org/10.1186/s12939-026-03061-0", "authors": "Sophie Nadia Gaber ほか", "venue": "International Journal for Equity in Health", "date": "2026-10-10", "sjr": 1.55, "citescore": 6.6, "citescore_year": "2025", "apa": "Gaber, S. N., Mattsson, E., Klarare, A., Lundström, J. E., Rapaport, P., & . (2026). eHealthism in inclusion health: a qualitative longitudinal study with women experiencing homelessness. International Journal for Equity in Health. https://doi.org/10.1186/s12939-026-03061-0", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ロンドンでホームレス状態にある女性9人の縦断的な質的研究から、デジタル健康を個人の責任とみる「eHealthism」の排除の仕組みを3層の枠組みにまとめた（抄録）。", "p2": "包摂的な健康（inclusion health）の重要性は認識されているが、ホームレス状態の女性がデジタル健康とどう関わるかはほとんど分かっていなかった（抄録）。", "p3": "9人の女性への語りのインタビューと参与観察を、リクールの物語と解釈の理論に着想を得た3段階の現象学的解釈学で分析した。当事者経験のある女性が設計・募集・資料作成・分析・提言に参加した（抄録）。", "p4": "質的研究であり、日常でのデジタル技術の利用と、医療・福祉・民間団体との関わりの中でのデジタル健康の意味を解釈した（抄録）。", "p5": "「自分のやり方で健康管理する」「デジタルだけでは足りず支援が必要」「デジタルも使えるが対面とは違う」の3テーマを得た。個人・関係・文脈の3層の排除の仕組みを示し、ハイブリッドなケアでの意味ある選択と、トラウマに配慮した継続的な関係的支援の必要を提言した（抄録）。", "p6": "参加者は9人で、ロンドンの1都市に限られる。質的研究のため一般化には限界がある（抄録から推測）。", "fun": "スマホで予約や相談ができれば便利なはず、と考えがちですが、充電や通信費、信頼できる人とのつながりがなければ、デジタル化はかえって人を置き去りにします。当事者の女性が研究の設計から一緒に関わっている点も、この研究の大事な特徴です。", "unverified": "各テーマの具体的な語りと、3層の枠組みの詳細は抄録からは未確認。"}}, {"id": "jr13", "rank": 13, "headline": "大カイロ413地区のTOD改修可能性を地図化", "title": "Evaluation transit-oriented development potential using GIS-MCDA: “a spatial framework for Greater Cairo”", "url": "https://doi.org/10.1038/s41598-026-71012-4", "authors": "Khaled Elwan ほか", "venue": "Scientific Reports", "date": "2026-10-10", "citescore": 6.4, "citescore_year": "2025", "apa": "Elwan, K., Effat, H. A., Yousry, T. M., & Abd-AlMoity, E. A. (2026). Evaluation transit-oriented development potential using GIS-MCDA: “a spatial framework for Greater Cairo”. Scientific Reports, 16(1). https://doi.org/10.1038/s41598-026-71012-4", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Scientific Reportsの本文PDF（方法・検証・感度分析・限界の節）を読んだ", "preprint": false, "p1": "大カイロ都市圏の413の行政区（シヤカ）単位で、既成市街地の公共交通指向型開発（TOD）の改修・準備の可能性を示す細かな地図を、GIS上の多基準評価で作った（抄録）。", "p2": "急速に都市化する大都市のTOD評価は計画中の駅周辺に集中し、改修の対象として重要な高密度の歴史的地区はあまり評価されてこなかった（抄録）。", "p3": "文献レビューで密度・多様性・デザイン・アクセス（と経済）の候補指標を集め、シヤカ単位でデータのあるものに絞って専門家が確認した。指標を空間的に正規化し、順位に基づく重みを含む混成の重みづけで加重和（Σ W_i R_i）としてTOD指数を作った（§Methods）。", "p4": "高TOD地区と、地下鉄沿線の高密度・混合用途地区との空間的な一致、人口・雇用密度との相関で検証した。重みを変えた4つの代替シナリオで感度分析を行った（§Model validation、Sensitivity analysis）。", "p5": "中心部（サイエダ・ゼイナブ、ブラク、アズバケイヤ、シュブラ、アブディーン）が最も高く、周辺部（5月15日市、トゥラ、アトフィーフ）が低かった（抄録）。代替シナリオの平均変化は2.6〜6.8%、基準との相関はPearson 0.91〜0.97、Spearman 0.90〜0.96だった（§Sensitivity analysis）。", "p6": "シヤカ単位でも地区内の差は隠れ、合成指数は複雑な都市を単純化したスクリーニング道具にすぎない。歩行者の安全・治安はデータがなく含めていない。データは行政機関のもので非公開（§Limitations、Data availability）。", "fun": "駅を中心にした街づくり（TOD）は新しい駅で考えられがちですが、この研究は古くからの密集地こそ「すでにTODの素質がある」ことを地図で示しました。重みを変えても順位がほとんど変わらないかを確かめる感度分析は、指数を作るときの大事な点検方法です。", "unverified": "表2の最終的な重みの値と、人口・雇用密度との相関係数の値は確認していない。"}}, {"id": "jr14", "rank": 14, "headline": "越境インフラの運用界面ガバナンスと回復力", "title": "Operational Interface Governance, Digital Capability, and Resilience Support in Cross-Border Critical Infrastructure: A Capability-Pathway Perspective", "url": "https://doi.org/10.1061/jmenea.meeng-7761", "authors": "Junying Liu ほか", "venue": "Journal of Management in Engineering", "date": "2026-10-11", "sjr": 1.486, "citescore": 13.1, "citescore_year": "2025", "apa": "Liu, J., Shi, L., Li, H., & He, M. (2027). Operational Interface Governance, Digital Capability, and Resilience Support in Cross-Border Critical Infrastructure: A Capability-Pathway Perspective. Journal of Management in Engineering, 43(1). https://doi.org/10.1061/jmenea.meeng-7761", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "国境をまたぐ重要インフラの運用で、組織間の運用界面のガバナンスがデジタル能力を通じて、抵抗と回復の支援にどうつながるかをシナリオ調査で示した（抄録）。", "p2": "越境インフラの運用は、組織と管轄をまたぐ情報・権限・調整の界面の整合に依存するが、その統治と回復力の関係は十分に分かっていなかった（抄録）。", "p3": "動的能力の視点に基づき、実務者371人に被験者間のシナリオ調査を行い、運用界面ガバナンスのシナリオ（OIGS）→デジタル能力→感知・適時の意思決定・変化の実行の能力→抵抗支援・回復支援の経路を、SEMとバイアス補正ブートストラップで推定した（抄録）。", "p4": "各経路の係数と、間接効果の95%バイアス補正信頼区間で評価した（抄録）。", "p5": "強化したOIGSはデジタル能力と正に関連し、デジタル能力は3つの能力と正に関連した。デジタル能力から両方の回復力支援への直接経路が支持され、適時の意思決定が回復支援への最も強い直接経路だった。変化の実行能力の回復支援への直接経路は支持されなかったが、OIGSからの連鎖の経路は支持された（抄録）。", "p6": "回復力の支援は運用組織が知覚した支援の役割であり、システム全体の回復力ではないと著者が定義している（抄録）。シナリオ実験での回答であり、実際の運用結果ではない。", "fun": "国境をまたぐ鉄道や送電網は、どこか一つの組織だけでは守れません。情報や権限の受け渡しのルールを整えることが、デジタル化の投資を生かし、事故からの回復を早める前提になる、という順番を示した点が分かりやすいところです。", "unverified": "対象のインフラの種類、係数の値は抄録からは未確認。"}}, {"id": "jr15", "rank": 15, "headline": "構造ポテンシャルで版築土の劣化を再現するDEM", "title": "A structural-potential-based DEM contact model for heritage rammed earth", "url": "https://doi.org/10.1016/j.enganabound.2026.107089", "authors": "Chengrui Ge ほか", "venue": "Engineering Analysis with Boundary Elements", "date": "2026-10-09", "citescore": 7.6, "citescore_year": "2025", "apa": "Ge, C., Cui, K., Xu, P., Zhang, L., Liu, H., & Zeng, H. (2027). A structural-potential-based DEM contact model for heritage rammed earth. Engineering Analysis with Boundary Elements, 194, 107089. https://doi.org/10.1016/j.enganabound.2026.107089", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "歴史的な版築土の圧密・強化・劣化・残留安定化という応力-ひずみの全過程を、「構造ポテンシャル」関数で駆動する個別要素法（DEM）の接触モデルで再現した（抄録）。", "p2": "版築土は構造を持つ土で非線形の載荷過程をたどるが、従来のDEMの接触モデルには構造の変化の仕組みがなく、全過程を再現できなかった（抄録）。", "p3": "構造ポテンシャル関数S(ε)を作り、離散要素の二次開発で、接触スケールの剛性・強度・幾何的劣化・損傷を同時に更新する接触モデル（SPモデル）を作った。S(ε)のパラメータ(a,b,c)を微視構造の指標から導き、微視構造と構造変化を結びつけた（抄録）。", "p4": "20/5の繰り返し保留検証で応力-ひずみ曲線全体の正規化RMSE、25地点でのピーク応力とピークひずみの誤差、チャネルの除去と感度解析、亀裂進展と力鎖の再編で評価した（抄録）。", "p5": "曲線全体の平均NRMSEは7.43%で、調べたデータベースの範囲で微視構造から地点をまたいだ予測が安定していた。25地点すべてでピーク応力とピークひずみの誤差は2%以下で、亀裂進展と力鎖の再編は巨視的な応答と段階的に対応した（抄録）。", "p6": "検証は著者らのデータベースの範囲に限られ（抄録）、圧縮挙動以外の荷重条件や繰返し載荷への適用は未確認。", "fun": "土を突き固めて作る古い壁（版築）は、押すとまず締まって強くなり、やがて壊れて、最後は崩れた状態で落ち着きます。この一連の変化を、粒と粒の接触を一つの「構造の状態」を表す関数で動かすことで再現している点が面白いところです。", "unverified": "25地点の出所、パラメータの推定式の詳細は抄録からは未確認。"}}, {"id": "jr16", "rank": 16, "headline": "スマートコントラクトは橋梁維持管理に価値を生むか", "title": "ASSESSING THE VALUE OF SMART CONTRACTS IN DIGITAL BRIDGE MAINTENANCE SYSTEMS", "url": "https://doi.org/10.14455/isec.2026.13(2).fam-06", "authors": "Leonardo Zunino ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "apa": "Zunino, L., Villa, V., Gatteschi, V., & Domaneschi, M. (2026). ASSESSING THE VALUE OF SMART CONTRACTS IN DIGITAL BRIDGE MAINTENANCE SYSTEMS. Proceedings of International Structural Engineering and Construction, 13(2). https://doi.org/10.14455/isec.2026.13(2).fam-06", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "橋梁の維持管理の流れにブロックチェーンのスマートコントラクトを導入したときの、経済・社会・組織間の価値を評価した（抄録）。", "p3": "状態基準の補修を受けた既存の橋を事後的な事例とし、従来の管理過程と、認証された計測データ・AI支援の判断・補修実施・支払いをスマートコントラクトで統治する代替案を比べた（抄録）。", "p5": "事務作業量、作業の効率、意思決定などの運用指標で比較した（抄録。具体的な数値は抄録の途中で切れており未確認）。", "fun": "橋のセンサが「補修が必要」と判定したら、自動的に工事の発注から支払いまで進む仕組みを想像した研究です。技術の性能ではなく、手続きの手間や組織間の信頼がどう変わるかに注目しているのが面白い点です。", "unverified": "本文は未読。比較の結果の数値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "支承の統計評価で資産管理と設計を支える", "title": "STATISTICAL ASSESSMENT OF BRIDGE BEARINGS: A METHODOLOGY FOR ASSET MANAGEMENT, MAINTENANCE AND DESIGN", "url": "https://doi.org/10.14455/isec.2026.13(2).fam-05", "authors": "Emanuela De Luca ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "apa": "Luca, E. D., Roustaeikakaei, S., Masera, D., & Marano, G. C. (2026). STATISTICAL ASSESSMENT OF BRIDGE BEARINGS: A METHODOLOGY FOR ASSET MANAGEMENT, MAINTENANCE AND DESIGN. Proceedings of International Structural Engineering and Construction, 13(2). https://doi.org/10.14455/isec.2026.13(2).fam-05", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "大規模な点検データを整理・分析するデータ駆動の方法を、橋梁支承に適用した（抄録）。", "p3": "支承の特性・点検記録・周辺情報を統合する関係データベースを作り、ネットワーク規模の体系的分析を可能にした（抄録）。", "p5": "イタリアの高速道路網の1万6千基超の支承に試適用し、型式による損傷発生の違いと腐食関連の欠陥の多さを示した（抄録）。", "fun": "橋を支える「支承」は目立たない部品ですが、何万個も集めて統計を取ると、どの型式がどんな傷み方をしやすいかが見えてきます。点検記録をばらばらのメモではなく、データベースとして整えることの力を示す研究です。", "unverified": "本文は未読。型式別の損傷率の数値は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "橋梁規模の2連RCボックスカルバートを現地載荷", "title": "FIELD TESTING OF A BRIDGE SIZE TWO-CELL RC BOX CULVERT", "url": "https://doi.org/10.14455/isec.2026.13(2).str-12", "authors": "Aaron Cole ほか", "venue": "Proceedings of International Structural Engineering and Construction", "date": "2026-10-10", "citescore": 0.5, "citescore_year": "2025", "apa": "Cole, A., Peiris, A., Hutchinson, C., & Harik, I. (2026). FIELD TESTING OF A BRIDGE SIZE TWO-CELL RC BOX CULVERT. Proceedings of International Structural Engineering and Construction, 13(2). https://doi.org/10.14455/isec.2026.13(2).str-12", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米ケンタッキー州で多い2連の現場打ちRCボックスカルバート（橋梁規模）を、現地試験で評価した（抄録）。", "p3": "耐荷力評価が必要な橋梁規模カルバート1378基のうち90.1%がRCボックスで、その68.2%が2連であることを背景に、簡便で保守的な評価に代わる現地試験を行った（抄録）。", "p5": "土と構造物の相互作用が複雑なため、現地載荷が最も正確な評価法だと位置づけている（抄録。試験結果は抄録の途中で切れており未確認）。", "fun": "道路の下を水が通る箱型の構造物（カルバート）は、土に埋まっているので計算で強さを見積もるのが難しく、安全側に低く見積もられがちです。実際にトラックを載せて測ることで、本当はどれだけ耐えられるかを確かめる、という素朴だが確実な方法です。", "unverified": "本文は未読。試験の結果と荷重条件は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "路面識別に基づく複合制動とABSの統合制御", "title": "Integrated Control Strategy of Composite Braking and ABS Based on Road Surface Identification", "url": "https://doi.org/10.1088/1742-6596/3330/1/012020", "authors": "Hongbiao Xiao ほか", "venue": "Journal of Physics: Conference Series", "date": "2026-10-09", "citescore": 1.1, "citescore_year": "2025", "apa": "Xiao, H., & Li, Y. (2026). Integrated Control Strategy of Composite Braking and ABS Based on Road Surface Identification. Journal of Physics: Conference Series, 3330(1), 12020. https://doi.org/10.1088/1742-6596/3330/1/012020", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "四輪インホイールモータの電気自動車で、路面の識別を核に、回生と摩擦の複合制動とABSを統合する制御を提案した（抄録）。", "p3": "単輪の制動モデルでラグランジュ補間により現在の路面のピーク粘着係数と最適スリップ率を求め、目標制動強度との比較で通常制動とアンチロック制動を切り替えた（抄録）。", "p5": "従来法の基礎制動トルクの未定義とモード切替時の衝撃という問題を解消すると主張している（抄録。数値は未確認）。", "fun": "電気自動車はブレーキのときにモータで発電して電気を回収できますが、滑りやすい路面ではタイヤがロックしないよう制御を切り替える必要があります。その切り替えの判断に「今の路面がどれだけ滑りやすいか」を推定して使うのが要点です。", "unverified": "本文は未読。シミュレーション等の検証結果は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "超大型台風下の高層ビル応答を無線計測と画像で", "title": "Dynamic response monitoring of a tall building during Super Typhoon Gaemi using wireless sensing and computer vision techniques", "url": "https://doi.org/10.1016/j.measurement.2026.123542", "authors": "Xiaoliang Ma ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-11", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Ma, X., Zhi, L., Zhou, K., Kong, F., Duan, M., & Hu, F. (2026). Dynamic response monitoring of a tall building during Super Typhoon Gaemi using wireless sensing and computer vision techniques. Measurement, 123542. https://doi.org/10.1016/j.measurement.2026.123542", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、超大型台風Gaemiの通過時に、無線センサと画像計測（コンピュータビジョン）で高層ビルの動的応答を監視した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、強い台風の最中に高層ビルがどう揺れたかを、配線のいらないセンサとカメラ映像の両方で捉えられるか、というものです。めったに起きない極端な現象を実物で測る機会は貴重です。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "注意機構付き残差網でSHMデータから損傷検出", "title": "An attention-enhanced residual network framework for structural damage detection based on structural health monitoring data", "url": "https://doi.org/10.1038/s41598-026-73433-7", "authors": "Bo Xie ほか", "venue": "Scientific Reports", "date": "2026-10-11", "citescore": 6.4, "citescore_year": "2025", "apa": "Xie, B., Cui, J., & Lu, N. (2026). An attention-enhanced residual network framework for structural damage detection based on structural health monitoring data. Scientific Reports. https://doi.org/10.1038/s41598-026-73433-7", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、構造ヘルスモニタリングのデータから、注意機構で強化した残差ネットワークで構造損傷を検出する研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、たくさんのセンサの記録のうち「どこに注目すべきか」を深層学習に学ばせて、損傷を見つけられるか、というものです。人の目が重要な部分に注意を向けるのと似た仕組みを使う点が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr22", "rank": 22, "headline": "自己給電の摩擦-電磁センサで車両振動を監視", "title": "Self-sustainable broadband triboelectric-electromagnetic vehicle vibration monitoring system using magnet-coil coupled resonance and non-contact sensing", "url": "https://doi.org/10.1016/j.energy.2026.142712", "authors": "MoonSeong Jo ほか", "venue": "Energy", "date": "2026-10-10", "sjr": 2.06, "citescore": 17.1, "citescore_year": "2025", "apa": "Jo, M., Bhatta, T., Teli, A., Sharma, S., Pradhan, G. B., & Park, J. Y. (2026). Self-sustainable broadband triboelectric-electromagnetic vehicle vibration monitoring system using magnet-coil coupled resonance and non-contact sensing. Energy, 142712. https://doi.org/10.1016/j.energy.2026.142712", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、磁石とコイルの共振と非接触計測を使い、摩擦帯電と電磁誘導で自ら発電する広帯域の車両振動監視システムを作った研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、車の振動そのものを電気に変えてセンサの電源にし、同時にその振動を測れるか、というものです。電池交換のいらないセンサは、長期の監視に向いた発想です。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr23", "rank": 23, "headline": "インドネシア鉄道改革で会計が空間的不平等を再生産", "title": "Socio-spatial inequality: the case of Indonesian railway's reform", "url": "https://doi.org/10.1108/aaaj-11-2025-8618", "authors": "Muhammad Muttaqin", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-10-10", "sjr": 1.574, "apa": "Muttaqin, M. (2026). Socio-spatial inequality: the case of Indonesian railway’s reform. Accounting, Auditing & Accountability Journal, 1–20. https://doi.org/10.1108/aaaj-11-2025-8618", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "インドネシア国鉄の改革で、統治の道具としての会計実務が駅の空間を作り変え、不平等を再生産したことを示した（抄録）。", "p3": "2009〜2014年の組織改革を対象に、従業員・乗客・コンサルタント・専門家への28件の半構造化面接と年次報告書・公文書を三角測量で分析した（抄録）。", "p5": "効率と顧客志向の論理が、非公式に支えられてきた賑わいのある駅の空間を商業的な区域に変え、長年の居住者を追い出し地域経済を混乱させたと論じた（抄録）。", "fun": "会計の数字は中立に見えますが、「効率」を測る物差しが駅の姿を変え、そこで暮らしていた人々を追い出すことがある、という指摘です。帳簿の上の判断が街の空間と人の生活に直結していることを示している点が面白いです。", "unverified": "本文は未読。結論の詳細は抄録の途中で切れており未確認。"}}, {"id": "jr24", "rank": 24, "headline": "ESG評価の高い企業は翌期の利益調整が少ないか", "title": "ESG Performance and Earnings Management: Evidence from Chinese Listed Firms", "url": "https://doi.org/10.6007/ijarbss/v16-i10/29093", "authors": "曹文, Rohaida Basiruddin", "venue": "International Journal of Academic Research in Business and Social Sciences", "date": "2026-10-10", "apa": "Cao, W., & Basiruddin, R. (2026). ESG Performance and Earnings Management: Evidence from Chinese Listed Firms. International Journal of Academic Research in Business and Social Sciences, 16(10). https://doi.org/10.6007/ijarbss/v16-i10/29093", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "前期のESG評価が高い中国企業ほど、翌期の利益調整が小さいかを時間順序を守った設計で調べた（抄録）。", "p3": "2015〜2024年の中国A株非金融企業で、t−1期のESG（8つの格付けの合成）、t期の利益調整（修正ジョーンズの裁量的発生高の絶対値と実体的利益調整の合成）をOLSで推定した（抄録）。", "p5": "前期のESG評価が高いほど、その後の発生主義の利益調整の大きさは小さかった（抄録。実体的利益調整の結果は途中で切れており未確認）。", "fun": "環境や社会への配慮で評価の高い会社は、会計の数字もごまかしにくいのか、という問いです。原因と結果の順番を守るため、ESGは前の年、利益調整はその次の年で測るという工夫が、相関を因果と取り違えないための基本を示しています。", "unverified": "本文は未読。係数の大きさは未確認。"}}, {"id": "jr25", "rank": 25, "headline": "財務困窮の決定要因をPRISMAで整理", "title": "Reading the Warning Signs: A PRISMA-Guided Systematic Review of Liquidity, Leverage, Profitability, and Firm Size as Determinants of Financial Distress", "url": "https://doi.org/10.61656/sbamr.v7i1.531", "authors": "Nurhidayah Nurhidayah ほか", "venue": "Sustainable Business Accounting and Management Review", "date": "2026-10-11", "apa": "Nurhidayah, N., & Muslimin, M. (2025). Reading the Warning Signs: A PRISMA-Guided Systematic Review of Liquidity, Leverage, Profitability, and Firm Size as Determinants of Financial Distress. Sustainable Business Accounting and Management Review, 7(1), 55–74. https://doi.org/10.61656/sbamr.v7i1.531", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "財務困窮を予測する4つの財務特性（流動性・レバレッジ・収益性・企業規模）の実証結果を、PRISMAに沿って系統的に整理した（抄録）。", "p3": "2020〜2024年の査読論文をCrossrefで8つの検索式で探し、引用追跡を加え、国・業種・期間・手法・困窮の代理変数・各要因の効果の向きでコード化した（抄録）。", "p5": "インドネシアの上場企業と食品・飲料業に注目し、矛盾する結果の整理を目的としている（抄録。結論は未確認）。", "fun": "会社が危なくなる前兆として、現金の余裕、借金の多さ、もうけ、会社の大きさのどれを重視すべきかは、研究によって答えがばらばらです。そのばらつきの理由を、国や業種、測り方の違いから整理しようとしている点が面白いところです。", "unverified": "本文は未読。採用論文数と結論は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "保険会社の財務比率と財務困窮", "title": "The Effect of Financial Ratios on Financial Distress in Insurance Companies", "url": "https://doi.org/10.38035/dar.v2i1.634", "authors": "Aditya Mawardana ほか", "venue": "Dinasti Accounting Review", "date": "2026-10-10", "apa": "Mawardana, A., & Suzuda Pohan, F. (2024). The Effect of Financial Ratios on Financial Distress in Insurance Companies. Dinasti Accounting Review, 2(1), 7–16. https://doi.org/10.38035/dar.v2i1.634", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシア証券取引所の保険会社で、保険業特有の財務比率がRBC（リスクベース資本）で測った財務困窮に与える影響を調べた（抄録）。", "p3": "2017〜2021年の13社を目的的抽出し、パネルデータの固定効果モデルで推定した（抄録）。", "p5": "4比率は全体として有意で、支払保険金比率と流動性比率は負で有意、引受比率は影響なしだった（抄録）。", "fun": "保険会社の健全性は、一般の会社とは違う「支払った保険金の割合」などの物差しで見る必要があります。業種の特性に合わせた指標を使うことで、困窮の前兆が見えやすくなるという考え方が基本にあります。", "unverified": "本文は未読。標本が13社と小さく、係数の値は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "変革管理が時間主導型ABC導入を後押し", "title": "Effective Change Management and Its Role in Facilitating Time-Driven Activity-Based Costing Adoption in Malaysian Private Universities", "url": "https://doi.org/10.6007/ijarafms/v16-i4/28869", "authors": "Dalmie Shahrul Suryati binti Azmee ほか", "venue": "International Journal of Academic Research in Accounting Finance and Management Sciences", "date": "2026-10-10", "apa": "Binti Azmee, D. S. S., Binti Jaafar Sidik, M. H., Binti Hassan, H., Kasbun, N. F., & Lumat, Y. (2026). Effective Change Management and Its Role in Facilitating Time-Driven Activity-Based Costing Adoption in Malaysian Private Universities. International Journal of Academic Research in Accounting, Finance and Management Sciences, 16(4). https://doi.org/10.6007/ijarafms/v16-i4/28869", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "マレーシアの私立大学で、時間主導型活動基準原価計算（TDABC）の導入を「効果的な変革管理」が後押しすることを示した（抄録）。", "p3": "リーダーの支援・伝達・研修・組織の準備度からなる変革管理を多次元の構成概念とし、意思決定者と財務担当者316人の調査をPLS-SEMで分析した（抄録）。", "p5": "変革管理はTDABC導入に有意な正の効果を持ち、知覚された革新の特性と導入の関係を部分的に媒介した（抄録）。", "fun": "新しい原価計算の方法が良いものだと分かっていても、それだけでは組織に広まりません。上司の後押しや研修といった「変える仕組み」があって初めて導入が進む、という結果は、道具より使う組織の側が大事だということを示しています。", "unverified": "本文は未読。効果量の数値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "マテリアルフローコスト会計で損失原価を削減", "title": "Material Flow Cost Accounting and Its Role in Reducing Loss Costs and Enhancing Product Sustainability: An Applied Study in the General Company for Textile and Leather Industries", "url": "https://doi.org/10.21070/ijler.v21i4.1677", "authors": "Alaa Jassim Salman", "venue": "Indonesian Journal of Law and Economics Review", "date": "2026-10-08", "apa": "Alaa Jassim Salman. (2026). Material Flow Cost Accounting and Its Role in Reducing Loss Costs and Enhancing Product Sustainability: An Applied Study in the General Company for Textile and Leather Industries. Indonesian Journal of Law and Economics Review, 21(4). https://doi.org/10.21070/ijler.v21i4.1677", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "繊維製造の工程ごとの物質とエネルギーの流れを、マテリアルフローコスト会計（MFCA）で追い、損失コストを特定した（抄録）。", "p3": "ISO 14051に基づくMFCAを繊維・皮革の公企業の連続した製造工程に適用した（抄録）。", "p5": "損失コストは総物質フローコストの3.288%で、改善案により約15.46%削減でき、材料利用率は91.791%に上がると見積もった（抄録）。", "fun": "普通の原価計算では、捨てられた材料の費用は製品の原価に紛れて見えません。材料の流れを工程ごとに追い、「捨てた分にいくらかかったか」を別に数えることで、環境とお金の両方の無駄が見えるようにする方法です。", "unverified": "本文は未読。工程別の内訳は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "テクノストレスとAIへの信頼がAI導入と幸福を媒介", "title": "Technostress and trust in AI mediate the association between AI adoption and employee well-being", "url": "https://doi.org/10.1007/s44202-026-00928-9", "authors": "K. D. V. Prasad ほか", "venue": "Discover Psychology", "date": "2026-10-11", "citescore": 1.8, "citescore_year": "2025", "apa": "Prasad, K. D. V., Srinivas, V., Singh, S., Kothari, H., Nag, D., & Pathak, A. (2026). Technostress and trust in AI mediate the association between AI adoption and employee well-being. Discover Psychology. https://doi.org/10.1007/s44202-026-00928-9", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、職場へのAI導入と従業員のウェルビーイングの関係を、テクノストレスとAIへの信頼が媒介すると示した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、職場にAIが入ってきたとき、人が元気になるか疲れるかは、AIによる負担感（テクノストレス）とAIを信じられるかどうかで決まるのではないか、というものです。同じ技術でも受け止め方で結果が逆になりうる点が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr30", "rank": 30, "headline": "O*NETの興味・仕事価値検査をフィンランドで検証", "title": "Adaptation and Validation of the O*NET Interest Profiler and the O*NET Computerized Work Importance Profiler (WIP-C) in Finland", "url": "https://doi.org/10.1177/10690727261493137", "authors": "Ville Puonti ほか", "venue": "Journal of Career Assessment", "date": "2026-10-10", "sjr": 1.413, "citescore": 7.0, "citescore_year": "2025", "apa": "Puonti, V., Rantanen, J., Tolvanen, A., & Kiuru, N. (2026). Adaptation and Validation of the O*NET Interest Profiler and the O*NET Computerized Work Importance Profiler (WIP-C) in Finland. Journal of Career Assessment. https://doi.org/10.1177/10690727261493137", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "公開の職業探索ツールであるO*NET興味プロファイラー短縮版と仕事価値プロファイラー（WIP-C）を、フィンランド語と文化に適応させ妥当性を検証した（抄録）。", "p3": "フィンランドの高校生558人（16〜20歳、女性65%）のデータで、既存の興味検査・職業的意味の尺度・BFI-2-XSと比べ、無作為化検定と多次元尺度法で構造的妥当性を確かめた（抄録）。", "p5": "両ツールとも内的一貫性は満足でき、興味プロファイラーでは構造的・収束的・併存的妥当性が確認された（抄録）。", "fun": "アメリカで作られた職業適性の検査を、そのまま翻訳して別の国で使ってよいかは自明ではありません。言葉や文化が違っても同じものを測れているかを、既存の検査や性格検査との関係で一つずつ確かめる手順が丁寧です。", "unverified": "本文は未読。WIP-Cの妥当性の結果は抄録の途中で切れており未確認。"}}, {"id": "jr31", "rank": 31, "headline": "臨床看護師のレジリエンスには潜在的な型がある", "title": "Distinct profiles of psychological resilience and associated factors among clinical nurses: a latent profile analysis", "url": "https://doi.org/10.1186/s12912-026-05342-z", "authors": "Manzhi Yao ほか", "venue": "BMC Nursing", "date": "2026-10-11", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Yao, M., Liu, Z., Ling, S., Liu, Z., Chen, X., Han, Y., & He, L. (2026). Distinct profiles of psychological resilience and associated factors among clinical nurses: a latent profile analysis. BMC Nursing. https://doi.org/10.1186/s12912-026-05342-z", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "資源保存理論に基づき、臨床看護師の心理的レジリエンスの潜在的な類型と、それに関わる要因を調べた（抄録）。", "p3": "臨床経験1年以上の看護師への横断調査で、CD-RISC-10の各項目を指標に潜在プロファイル分析を行い、単変量分析と多項ロジスティック回帰で関連要因を検討した（抄録）。", "p5": "レジリエンスの複数の類型を特定し、類型ごとの関連要因を示した（抄録。類型の数と要因は抄録の途中で切れており未確認）。", "fun": "「打たれ強さ」を一つの点数で測るのではなく、どんな組み合わせで強いか弱いかというタイプに分けて見る方法です。タイプが分かれば、一律の研修ではなく、それぞれに合った支え方を考えられるようになります。", "unverified": "本文は未読。類型の数、標本数、関連要因は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "ルーマニア高齢者の孤独とケアの分断", "title": "Loneliness and Psychosocial Vulnerability among Older Adults in Romania: Stakeholder Perspectives on Care, Social Isolation, and Institutional Fragmentation", "url": "https://doi.org/10.33788/rcis.94.6", "authors": "Eliza Monica MOTORGA", "venue": "Revista de Cercetare si Interventie Sociala", "date": "2026-10-11", "citescore": 0.9, "citescore_year": "2025", "apa": "MOTORGA, E. M. (2026). Loneliness and Psychosocial Vulnerability among Older Adults in Romania: Stakeholder Perspectives on Care, Social Isolation, and Institutional Fragmentation. Revista de Cercetare Si Interventie Sociala, (94), 100–115. https://doi.org/10.33788/rcis.94.6", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ルーマニアの高齢者の心理社会的な脆弱性を、孤独・情緒的孤立・ケアの分断に注目して関係者の視点から質的に分析した（抄録）。", "p3": "2023〜2024年にブカレストなど6都市のソーシャルワーカー、精神科医、介護者、NGO等への半構造化面接12件と質問票55件を、再帰的テーマ分析で分析した（抄録）。", "p5": "老年期の脆弱性は加齢だけでなく、移住による家族の離散、世代間関係の弱まり、地域参加の減少、制度の分断、心理社会的支援の乏しさの相互作用で形づくられていた（抄録）。", "fun": "子どもたちが国外へ働きに出た結果、故郷に残された高齢者が孤立するという、移民の送り出し国ならではの問題が見えてきます。孤独が個人の性格ではなく、家族の移動や制度の隙間といった社会の仕組みから生まれていることを示しています。", "unverified": "本文は未読。提言の具体的な内容は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "社会的連帯経済をグローバルヘルスに組み込む", "title": "Integrating the social and solidarity economy into global health: towards structural transformation for equity, resilience, and sustainability", "url": "https://doi.org/10.1186/s12992-026-01240-w", "authors": "Masami Fujita ほか", "venue": "Globalization and Health", "date": "2026-10-11", "sjr": 1.692, "citescore": 9.8, "citescore_year": "2025", "apa": "Fujita, M., Loewenson, R., McCoy, D., Itami, K., Ong, L., Ueno, T., Murakami, H., Zugaj, M., & de Pas, R. v. (2026). Integrating the social and solidarity economy into global health: towards structural transformation for equity, resilience, and sustainability. Globalization and Health. https://doi.org/10.1186/s12992-026-01240-w", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補の収集時に取得した抄録を使用", "preprint": false, "short": true, "p1": "2023年に国連決議で認められた「社会的連帯経済（SSE）」を、グローバルヘルスの公正・回復力・持続可能性を実現する制度的手段として検討した（抄録）。", "p3": "グローバルヘルス研究でSSEがどう扱われてきたかを検討し、移民の健康を例に、SSEの包摂的で連帯に基づく実践が健康の決定要因にどう関われるかを論じた（抄録）。", "p5": "SSEを規範の枠組みとしてだけでなく、規範を実現する制度的アプローチとして位置づけた（抄録）。", "fun": "健康の問題は病院だけでは解決できず、仕事や住まい、地域のつながりと絡み合っています。協同組合や共済のような「助け合いの経済」を健康政策の道具として使おうという発想が面白い点です。", "unverified": "本文は未読。具体的な事例の詳細は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "中小企業は社会的結束の担い手になれるか", "title": "SMEs as Agents of Social Cohesion: Opportunities, Challenges, and Conceptual Framework", "url": "https://doi.org/10.12688/f1000research.183208.2", "authors": "Malek Al-edenat ほか", "venue": "F1000Research", "date": "2026-10-10", "citescore": 2.9, "citescore_year": "2025", "apa": "Al-Edenat, M., & AL Hawamdeh, N. (2026). SMEs as Agents of Social Cohesion: Opportunities, Challenges, and Conceptual Framework. F1000Research, 15, 1045. https://doi.org/10.12688/f1000research.183208.2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中小企業が社会的結束の担い手となる仕組みを説明する、統合的な概念枠組みを提案した（抄録）。", "p3": "起業論・社会関係資本・CSRの学際的な視点から、地域への埋め込み、雇用慣行、利害関係者との関わりを通じた経路を整理した（抄録）。", "p5": "機会として革新性・柔軟性・強い地域性・局所的な影響・個別の関与を、課題として資源・到達範囲の限界、利害調整、持続性、規模拡大を挙げた（抄録）。", "fun": "地元の小さな会社は、雇用だけでなく人と人をつなぐ場所にもなっています。大企業にはない身軽さや地域との近さが、社会のまとまりを生む力になるという整理は、町の商店街の役割を考えるヒントになります。", "unverified": "本文は未読。実証の有無は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "社会的脆弱性が都市の暑熱リスク格差を広げる", "title": "Social vulnerability amplifies global inequality in urban heat risk", "url": "https://doi.org/10.1038/s43247-026-04137-z", "authors": "Xuewen Lei ほか", "venue": "Communications Earth and Environment", "date": "2026-10-11", "sjr": 3.168, "citescore": 11.3, "citescore_year": "2025", "apa": "Lei, X., Meng, Q., Zhao, Q., Luo, M., Zhang, L., & Fang, C. (2026). Social vulnerability amplifies global inequality in urban heat risk. Communications Earth & Environment. https://doi.org/10.1038/s43247-026-04137-z", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、社会的脆弱性が都市の暑熱リスクの世界的な不平等を増幅することを示した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、同じ暑さでも、貧しさや高齢などの弱さを抱えた人が多い都市ほど被害が大きくなり、世界の格差が広がるのではないか、というものです。気温だけでなく人の側の条件がリスクを決める点が面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "道路設計と歩きやすさの知覚と歩行行動", "title": "The relationship between urban road design, perceived walkability, and walking behavior", "url": "https://doi.org/10.1016/j.urbmob.2026.100303", "authors": "Polycap Chesifu Chebe ほか", "venue": "Journal of Urban Mobility", "date": "2026-10-10", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "apa": "Chebe, P. C., & Martens, K. (2026). The relationship between urban road design, perceived walkability, and walking behavior. Journal of Urban Mobility, 10, 100303. https://doi.org/10.1016/j.urbmob.2026.100303", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefの題名検索で見つかった別の記録の抄録を使用", "preprint": false, "short": true, "p1": "街路単位の知覚された歩きやすさを測る新尺度SPaRSを作り、道路設計・歩きやすさ・歩行行動の双方向の関係を調べた（抄録）。", "p3": "アディスアベバの設計の異なる5街路（改良3・未改良2）で、自己申告の歩行頻度と歩きやすさの双方向関係を2つの構造方程式モデルで検討した（抄録）。", "p5": "街区単位ではなく街路単位で歩きやすさを測り、歩くことが歩きやすさの知覚に与える逆方向の影響も扱った（抄録。結果の数値は未確認）。", "fun": "歩きやすい道だから人が歩くのか、よく歩く人だから道を歩きやすいと感じるのか、という「卵と鶏」の問題に取り組んでいます。両方向の矢印を同時に調べることで、道路の改良の効果を正しく見積もろうとしている点が面白いです。", "unverified": "本文は未読。抄録の取得元が別記録のため同一論文かは要確認。結果は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "ダッカ都市圏の雇用副都心と多核化", "title": "Employment subcenters and polycentric urban development in the Greater Dhaka Region, Bangladesh", "url": "https://doi.org/10.1016/j.jum.2026.100584", "authors": "Tawhid Monzur ほか", "venue": "Journal of Urban Management", "date": "2026-10-10", "sjr": 1.142, "citescore": 8.5, "citescore_year": "2025", "apa": "Monzur, T., Tabassum, T., Bashir, N., & Azad, A. (2027). Employment subcenters and polycentric urban development in the Greater Dhaka Region, Bangladesh. Journal of Urban Management, 16(2), 100584. https://doi.org/10.1016/j.jum.2026.100584", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、バングラデシュの大ダッカ都市圏で雇用の副都心を特定し、多核的な都市発展を分析した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、人口が急増する巨大都市で、仕事の集まる場所が一つの中心から複数の拠点へ分かれていくのか、というものです。都市の形が通勤や交通のあり方を左右する点で面白い問いです。", "unverified": "抄録・本文とも未入手のため、データ・手法・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "デマンド交通と路線バスの非対称な相互作用", "title": "Asymmetric modal interactions between demand-responsive transit and fixed-route transit: A spatiotemporal autoregressive approach", "url": "https://doi.org/10.1016/j.retrec.2026.101865", "authors": "Dain Oh ほか", "venue": "  Economics", "date": "2026-10-10", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Zhang, S., & Almond, D. (2026). Too little too late? Nationwide carbon trading in China. Journal of Public Economics, 263, 105798. https://doi.org/10.1016/j.jpubeco.2026.105798", "why": "中国の全国炭素排出量取引制度の効果を評価する公共経済学の実証（抄録未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "2021年に始まった中国の全国炭素市場（排出原単位基準）の初期の効果を、発電所単位で初めて実証した（抄録）。", "p3": "衛星画像と機械学習で作った発電所単位のデータを使い、高効率と低効率の石炭火力の反応の差と、炭素市場のないインドネシア・フィリピンの石炭火力との比較で推定した（抄録）。", "p5": "高効率の発電所は低効率に比べ発電量とCO₂排出を約5%増やし、排出原単位の差別的な低下は見られなかった（推定は不精確）（抄録）。", "fun": "排出の「総量」ではなく「発電量あたりの排出」で規制すると、効率の良い発電所はむしろ発電を増やして排出も増えることがある、という結果です。規制の物差しの選び方で結果が逆になりうることを、宇宙から見た発電所のデータで示している点が面白いです。", "unverified": "本文は未読。結論部分は抄録の途中で切れており未確認。"}}, {"id": "jn17", "rank": 17, "field": "開発経済学", "headline": "猛暑時のマイクロファイナンス顧客の貯蓄行動", "title": "When heat hits: Short-run saving and withdrawal behavior among microfinance clients in Benin", "url": "https://doi.org/10.1016/j.worlddev.2026.107578", "authors": "Anna Mader ほか", "venue": "World Development", "date": "2026-10-10", "sjr": 2.027, "citescore": 9.3, "citescore_year": "2025", "apa": "Mader, A., & Mußhoff, O. (2027). When heat hits: Short-run saving and withdrawal behavior among microfinance clients in Benin. World Development, 210, 107578. https://doi.org/10.1016/j.worlddev.2026.107578", "why": "ベナンのマイクロファイナンス顧客で、暑熱ショック直後の貯蓄と引き出し行動を調べる（抄録未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "異常な暑さが、ベナンのマイクロファイナンス利用者の短期的な貯蓄と引き出しの行動にどう関係するかを調べた（抄録）。", "p3": "大手マイクロファイナンス機関の利用者約5万人のデータを位置情報つき気温データと結合し、二元固定効果、見かけ上無関係な回帰、OLSで推定した（抄録）。", "p5": "猛暑への曝露と金融行動の関係は利用者によって異なり、非農業の利用者では前四半期の猛暑日の後に予備的な貯蓄が積み上がる示唆的な証拠があった（抄録）。", "fun": "暑さは作物だけでなく、人々のお金の使い方にも影響します。農業をしていない人は暑さの後に「もしもの備え」として貯金を増やすという結果は、気候変動への適応が銀行口座の中でも起きていることを示しています。", "unverified": "本文は未読。農業利用者の結果は抄録の途中で切れており未     "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
