arxiv.org/abs/2610.20759", "authors": "Pengyu Li ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Li, P., & Zhang, Y. (2026). The Reach of Treatment Effects: Randomization Inference for Zero-Effect Regions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20759", "why": "処置効果がゼロの共変量領域がどこまで大きくありうるかに、有限標本で妥当な上側信頼限界を与える新しい問いを立てた。"}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "言語モデルのパラメータを小さな部品に分解して解釈", "title": "Interpreting Language Model Parameters", "url": "https://arxiv.org/abs/2610.20748", "authors": "Lucius Bushnaq ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Bushnaq, L., Braun, D., Clive-Griffin, O., Bussmann, B., Hu, N., Ivanitskiy, M., Linsefors, L., & Sharkey, L. (2026). Interpreting Language Model Parameters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20748", "why": "敵対的なアブレーションにも耐える部分要素へのパラメータ分解（VPD）で、表現ではなくパラメータの計算を解釈する方法を示した。"}, {"id": "pn10", "rank": 10, "field": "政治学", "headline": "分権化された公的就労が恩顧政治の道具になる", "title": "Decentralized but Dependent: Clientelism through Workfare", "url": "https://doi.org/10.2139/ssrn.7613922", "authors": "Gyozo Gyongyosi ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Gyongyosi, G., Reizer, B., & Gáspár, A. (2026). Decentralized but Dependent: Clientelism through Workfare. https://doi.org/10.2139/ssrn.7613922", "why": "ハンガリーの公的就労事業の行政データと差の差分析で、中央が市長を集票役にする二層の恩顧主義を示した。"}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "消費者は自分に得な推薦アルゴリズムを選べるか", "title": "Consumer Choice between Recommendation Algorithms -Experimental Evidence", "url": "https://doi.org/10.2139/ssrn.7616678", "authors": "Felix Schleef", "venue": "SSRN", "date": "2026-10-15", "apa": "Schleef, F. (2026). Consumer Choice between Recommendation Algorithms -Experimental Evidence. https://doi.org/10.2139/ssrn.7616678", "why": "事前登録実験で、消費者が良いアルゴリズムを見分けて支払意思を持つが、得の大きさとは結びつかないことを示した。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "戦争による男性不足が結婚と子の教育に残した影響", "title": "Effects of Gender Imbalance Within and Across Generations: Men's Marrying Up and Family Dynamics&nbsp;", "url": "https://doi.org/10.2139/ssrn.7610381", "authors": "Xinyan Liu ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Liu, X., Wakabayashi, M., Kureishi, W., Li, Y., & Bai, Y. (2026). Effects of Gender Imbalance Within and Across Generations: Men’s Marrying Up and Family Dynamics&nbsp; https://doi.org/10.2139/ssrn.7610381", "why": "第2次世界大戦による男性不足の都道府県差を使い、結婚の組み合わせ、女性の就業、子の学歴への長期的影響を示した。"}, {"id": "pn13", "rank": 13, "field": "教育", "headline": "少人数学級の効果は中学入学まで続く（フランス）", "title": "The Long Reach of Targeted Smaller Classes: Evidence from a National Reform", "url": "https://doi.org/10.2139/ssrn.7605718", "authors": "Fatimetou El Bah", "venue": "SSRN", "date": "2026-10-15", "apa": "El Bah, F. (2026). The Long Reach of Targeted Smaller Classes: Evidence from a National Reform. https://doi.org/10.2139/ssrn.7605718", "why": "仏国の困難校での1・2年生の学級半減の効果を、9コホートの行政データで中学入学時まで追跡した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "モデルに依存しない重要度で偽発見率を制御", "title": "Controlling the False Discovery Rate via Model-Agnostic Importance Measures", "url": "https://arxiv.org/abs/2610.21360", "authors": "Mengtao Wen ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wen, M., Ren, H., & Zou, C. (2026). Controlling the False Discovery Rate via Model-Agnostic Importance Measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21360", "why": "共変量分布の知識を要するModel-Xノックオフを補う、標本分割と新しい重要度による変数選択でFDR制御を保証した。"}, {"id": "pn15", "rank": 15, "field": "機械学習（Hugging Face）", "headline": "強化学習の方策変化を途中経過で選んで蒸留", "title": "Waypoint-OPD: Transferring RL-Induced Policy Shifts via Gated On-Policy Distillation", "url": "https://arxiv.org/abs/2610.21601", "authors": "Bingxi Hou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Hou, B., Jiang, G., Quan, G., Li, W., Feng, W., Liu, G., & Zhang, Y. (2026). Waypoint-OPD: Transferring RL-Induced Policy Shifts via Gated On-Policy Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21601", "why": "教師の強化学習の途中と最後の方策変化の向きの一致で蒸留をゲートし、数学とコードの推論で既存手法を上回った（HF投票320）。"}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "時変共変量を考慮した差の差法の異質効果", "title": "Difference-in-Differences for Heterogeneous Effects of General Treatment Strategies Accounting for Time-Varying Covariates", "url": "https://arxiv.org/abs/2610.22113", "authors": "Oliver Dukes ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Dukes, O., Shahn, Z., Robins, J., & Rotnitzky, A. (2026). Difference-in-Differences for Heterogeneous Effects of General Treatment Strategies Accounting for Time-Varying Covariates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22113", "why": "構造入れ子平均モデルを使い、一般的な処置戦略の効果の時間変化する異質性を差の差法で識別する枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "時間とともに変わる共変量による効果の違いを、差の差法の平行トレンド仮定のもとで推定できる周辺構造入れ子平均モデル（mSNMM）を提案した（抄録）。", "p3": "調整に必要な共変量のうち一部の低次元の変数だけで効果修飾をモデル化し、条件付き平行トレンドのもとで識別と推定を行う。処置が途中でオン・オフしても、持続的な介入の効果を扱える。", "p5": "時変交絡があっても必要な平行トレンド仮定がもっともらしく、モデルの誤特定のリスクを下げるとする。メディケイド拡大が無保険率に与える効果が、拡大前の失業率でどう変わるかに適用した（抄録。推定値は抄録になし）。", "fun": "政策の効果は、町の状況によって大きくも小さくもなります。しかも状況そのものが年ごとに変わり、政策を始めたりやめたりする地域もあります。この研究は、そうした「動く条件」の下でも、条件ごとの効果の違いを比べられる道具を作った点が新しいところです。", "unverified": "適用例の推定結果は未確認。"}}, {"id": "pn17", "rank": 17, "field": "因果推論", "headline": "打ち切りのある結果への二重頑健な近接因果推論", "title": "Flexible Doubly Robust Proximal Causal Inference for Censored Outcomes", "url": "https://arxiv.org/abs/2610.20893", "authors": "Dhanajit Brahma ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Brahma, D., Meng, R., Carin, L., & Henao, R. (2026). Flexible Doubly Robust Proximal Causal Inference for Censored Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20893", "why": "未測定交絡の下で生存時間の因果効果を、代理変数を使って柔軟かつ二重頑健に推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "未測定の交絡があるときに、打ち切りのある生存時間の因果効果を、代理変数を使って柔軟かつ二重頑健に推定する近接生存ブリッジ学習（PSB）を示した（抄録）。", "p3": "処置別の生存曲線の近接識別に基づき、結果ブリッジ・処置ブリッジ・二重頑健の3推定量を作る。ブリッジ関数は低ランクの時間分解を持つカーネル推定（PSB-K）か、射影最大モーメント制約の損失で学ぶニューラル推定（PSB-N）で学ぶ。", "p5": "標準的なSEMのベンチマーク、半合成のACTG研究、実データのFramingham研究で、PSB-KがSEMとACTGで最も良く、PSB-NがFraminghamで最も安定した（抄録）。", "fun": "病気の治療効果を調べるとき、測れていない要因が結果をゆがめることがあります。この研究は、その要因の「影」を映す代わりの変数を2種類使って、ゆがみを取り除こうとします。さらに途中で追跡できなくなった人がいても使えるようにした点が工夫です。", "unverified": "性能差の具体的な数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "機械学習で予測した結果変数を使う局所頑健推論", "title": "Locally Robust Inference with Outcomes Predicted by Machine Learning", "url": "https://arxiv.org/abs/2610.21756", "authors": "Juan Carlos Escanciano ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Escanciano, J. C., & Puerta-Cuartas, A. (2026). Locally Robust Inference with Outcomes Predicted by Machine Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21756", "why": "機械学習で生成した変数を回帰に使うときの偏りを補正する、局所頑健な推論を経済学向けに示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習で予測した値を結果変数としてそのまま計量分析に使うと推論が歪む問題に、3段階の局所頑健なGMMで正しい推論を与えた（抄録）。", "p3": "識別のモーメントに1段目と2段目の影響関数を加えた脱バイアスのモーメント条件を作り、両段階の正則化やモデル選択のバイアスに局所的に鈍感にする。一致性と漸近正規性を示す。", "p5": "モンテカルロ実験で有限標本の性能を確かめ、米国の住宅ローンデータで人種を使わない機械学習の債務不履行スコアに埋め込まれた黒人と白人の条件付き格差を調べ、実際の延滞の格差よりかなり小さいことを示した（抄録）。", "fun": "AIが作った「予測値」を本物のデータのように扱って分析すると、AIの誤差が結論にこっそり紛れ込みます。この研究は、その誤差の影響を打ち消す補正項を計算式に加えました。AIの出力を材料にする研究が増えるほど、重要になる下ごしらえの技術です。", "unverified": "住宅ローンデータの規模と期間は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "二重機械学習で因果推論するときの予測変数の選び方", "title": "Predictor Selection for Doubly Robust Double/debiased Machine Learning Estimators for Causal Inference", "url": "https://doi.org/10.31234/osf.io/7hcjw_v2", "authors": "Muwon Kwon ほか", "venue": "PsyArXiv", "date": "2026-10-16", "apa": "Kwon, M., & Steiner, P. M. (2026). Predictor Selection for Doubly Robust Double/debiased Machine Learning Estimators for Causal Inference. https://doi.org/10.31234/osf.io/7hcjw_v2", "why": "二重機械学習による因果効果推定で、どの予測変数を入れるべきかを検討した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "二重機械学習で因果効果を推定するとき、傾向スコアと結果のモデルで別々に選んだ予測変数の和集合を使う「和集合ダブル・ポストLasso」を提案した（抄録）。", "p3": "2つのモデルでそれぞれLassoで変数を選び、その和集合で両方のモデルを推定し直すことで、モデル間で選ばれる変数が異なることと、重要な変数の取りこぼしを防ぐ。", "p5": "シミュレーションで、別々に選んだ変数を使う方法より残る交絡バイアスを一貫して減らした。機械学習の推定が従来の二重頑健推定を常に上回るわけではなく、ポストLassoはLassoより交絡バイアスを減らした（抄録）。", "fun": "機械学習で原因と結果を調べるとき、「どの変数を使うか」をAIに選ばせると、片方のモデルにだけ大事な変数が抜けることがあります。両方で選ばれた変数をまとめて使うという素朴な工夫で偏りが減るのは、手法の性能より使い方が大事だという教訓です。", "unverified": "シミュレーション設定と偏りの減少量は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "不均一分散下の高次元Huber回帰の精密な漸近論", "title": "Precise Asymptotics for Dense High-Dimensional Huber Regression under Heteroscedasticity", "url": "https://arxiv.org/abs/2610.20798", "authors": "Jing Zhou ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Zhou, J., Venkataramanan, R., & Zou, H. (2026). Precise Asymptotics for Dense High-Dimensional Huber Regression under Heteroscedasticity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20798", "why": "標本数と次元が比例する領域で、不均一分散のHuber回帰推定量の分布を正確に特徴づけた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "標本数と次元が比例して大きくなる領域で、不均一分散があるときのHuber回帰推定量の漸近分布を正確に特徴づけた（抄録）。", "p3": "行列の近似メッセージ伝搬（AMP）の枠組みで、回帰係数と分散を決める係数を同時に追跡し、等分散のM推定の既存の枠組みを拡張する。推定量の中心と分散を3つのスカラー量で表す。", "p5": "不均一分散のもとでは、推定量の1次の中心が分散指標の係数の方向に余分にずれうることを示し、そのずれの係数と正確な漸近分散を導いた。中心のずれの検定を作り、シミュレーションで大きさと検出力を調べた（抄録）。", "fun": "外れ値に強いHuber回帰は便利ですが、データのばらつきが場所によって違うと、推定値の中心が少しずれることがわかりました。変数が多すぎる世界では、昔からの「たくさん集めれば真の値に近づく」という直観が通用しない、という現代統計らしい結果です。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "高次元のおかげで最適率が出る因子支援密度推定", "title": "Factor-Assisted Density Estimation: When Ambient Dimension Enables Oracle Rates", "url": "https://arxiv.org/abs/2610.20944", "authors": "Sunrit Chakraborty ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Chakraborty, S., & Dunson, D. (2026). Factor-Assisted Density Estimation: When Ambient Dimension Enables Oracle Rates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20944", "why": "因子モデルの潜在因子の密度推定で、高い観測次元がむしろオラクル率を可能にすることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高次元の因子モデルで、観測の次元が十分大きければ、単純なスペクトル法で潜在因子の密度をオラクル率で推定できることを示した（抄録）。", "p3": "潜在スコアのスペクトル推定値にカーネル密度推定を当てる非反復の手法FADEを提案し、誤差を条件付き中心化されたガウス摂動と一様に制御される残差に分ける展開で解析する。", "p5": "十分に高い次元でFADEはオラクル率を達成し、通常のノンパラメトリックな難しさとガウス逆畳み込みの障害を分けるミニマックス下界も示して、特定の高次元領域での率の最適性を確立した（抄録）。", "fun": "ふつう、変数が多いほど推定は難しくなります（次元の呪い）。ところがこの研究では、観測する項目が十分多いと、隠れた少数の要因がかえってくっきり見え、その分布を理想的な精度で推定できることを示しました。「次元の恵み」とでも言える逆転の発想です。", "unverified": "なし"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "ガウス変分推論の加速とその限界", "title": "Acceleration and its Limits in Gaussian Variational Inference", "url": "https://arxiv.org/abs/2610.21020", "authors": "Jaesung R. Park ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Park, J. R., Jang, U., & Chen, Y. (2026). Acceleration and its Limits in Gaussian Variational Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21020", "why": "勾配法のモーメンタム加速がガウス変分推論でどこまで効くかを理論的に明らかにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "勾配法のモーメンタム加速（条件数への依存をκから√κへ改善）が、ガウス変分推論でどこまで成り立つかを理論的に明らかにした（抄録）。", "p3": "ガウスの期待値を正確に計算できる場合は凸の合成問題として古典的な加速率が得られることを示し、点ごとの微分しか使えない場合については、どんな乱択アルゴリズムでも多くの問い合わせを要する対象分布の族を構成する。", "p5": "点ごとの微分しかないときはκ^(1−o(1))回の問い合わせが必要で、曲率の上下界だけでは一様な加速は保証できない。一方、ヘッセ行列のリプシッツ性のもとで分散低減法は加速を示し、実データでも大きな高速化が見られた（抄録）。", "fun": "坂を転がるボールに勢いをつけると早く谷底に着く、というのが加速法の考え方です。それが確率分布を近似する計算でも効くかを調べたところ、手に入る情報によっては原理的に速くできない場合があるとわかりました。「速くできない」と証明すること自体が大事な成果です。", "unverified": "実データでの高速化の倍率は未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "角度測度のワッサースタイン距離で極値依存を分類", "title": "Clustering extremal dependence structures via Wasserstein distances between angular measures", "url": "https://arxiv.org/abs/2610.21931", "authors": "Kamal Gasser ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Gasser, K., Ragone, F., & Segers, J. (2026). Clustering extremal dependence structures via Wasserstein distances between angular measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21931", "why": "複合極端事象の同時の振る舞いを、角度測度間のワッサースタイン距離でクラスタリングする方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の変数が同時に極端になる仕方（極値依存）を、角度測度どうしのワッサースタイン距離で比べ、変数の組をクラスタに分ける方法を示した（抄録）。", "p3": "高い閾値を超えた観測から角度測度を推定し、単体からアイチソン座標のユークリッド空間に写して1-ワッサースタイン距離で比べる。モデルの当てはめ不要のノンパラメトリックな非類似度を、距離に基づくクラスタリングに使う。", "p5": "階層クラスタリングとPAMで潜在的な分割を確率1に近づいて回復することを示した。依存の強さが同じでも形が違うクラスタで既存法より大きく優れ、スイスの降雨-融雪-流出の極値と国際株式市場に適用した（抄録）。", "fun": "大雨と雪解けが同時に起きると洪水の被害は桁違いになります。こうした「同時の極端」の起こり方は、強さだけでなく形にも違いがあります。この研究は、極端なときの方向の分布どうしの「運ぶ距離」で似ている度合いを測り、似た地域をまとめる方法を作りました。", "unverified": "適用例の具体的なクラスタ結果は未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "小地域推定のベンチマーク制約を満たす事前分布", "title": "Benchmarking Priors: A Fully Bayesian Approach to Small Area Benchmarking", "url": "https://arxiv.org/abs/2610.21744", "authors": "Soumadeep Bhowmick ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Bhowmick, S., Roy, A., Janicki, R., & Datta, G. S. (2026). Benchmarking Priors: A Fully Bayesian Approach to Small Area Benchmarking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21744", "why": "外部の合計値への整合（ベンチマーク）を厳密に満たす事前分布のクラスを小地域モデルに導入した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "小地域推定の推定値を外部の合計値（ベンチマーク）に厳密に一致させる制約を、事前分布として組み込む新しいベイズの枠組みを作った（抄録）。", "p3": "ベンチマーク制約で決まるパラメータ集合だけに台を持つ事前分布を作り、制約集合の中に収まる正しい事後分布と信用集合を得る。標準のFay-Herriotモデルから、多変量tの頑健版や非線形の版まで適用できる。", "p5": "シミュレーションと、米国勢調査局のSAIPEの直接推定とCPS ASECの全国値を使った、5〜17歳の子どもの貧困率の州別推定で有用性を示した（抄録）。", "fun": "州ごとの子どもの貧困率を足し合わせると、全国の公式値と食い違うことがあります。後から無理に合わせると不確かさの計算が狂います。この研究は、最初から「合計が合う世界」だけを考える確率の仕組みにして、つじつまと不確かさを両立させました。", "unverified": "推定精度の改善の数値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "時系列の逐次コンフォーマル予測のRパッケージ", "title": "conformalForecast: An R package for sequential conformal prediction in time series", "url": "https://arxiv.org/abs/2610.21648", "authors": "Xiaoqian Wang ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wang, X., & Girolimetto, D. (2026). conformalForecast: An R package for sequential conformal prediction in time series (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21648", "why": "時系列予測の不確実性を分布に依存せず保証するコンフォーマル予測を使いやすく実装した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "時系列の多段階予測に対し、コンフォーマル予測区間を作り、更新し、評価する一連の作業をまとめたRパッケージconformalForecastを公開した（抄録）。", "p3": "点予測と較正を分け、さまざまな予測を共通の入口で受け、予測期間ごとの誤差と較正状態を保つ。経験分位、フィードバック型、依存を考慮する方法など複数の較正法と、被覆率・区間幅・区間スコアの評価を実装する。", "p5": "オーストラリア5地域の短期電力価格の予測に適用し、全体の被覆率はおおむね名目水準に近く、移動被覆率と区間の効率は方法と期間で異なった。逐次更新は全体を再計算した区間を再現した（抄録）。", "fun": "天気予報の「降水確率」のように、予測には外れ方の幅も必要です。コンフォーマル予測は、過去の外れ具合から、決めた確率で当たる幅を作る方法です。このパッケージは、新しいデータが届くたびに幅を作り直す手間を減らし、実務で使いやすくした点が貢献です。", "unverified": "なし"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "関税で守られた企業をヘッジファンドが規律する", "title": "Disturbing the Quiet Life: Trade Protection and Hedge Fund Activism", "url": "https://doi.org/10.2139/ssrn.7616618", "authors": "Nickolay Gantchev ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Gantchev, N., & Giannetti, M. (2026). Disturbing the Quiet Life: Trade Protection and Hedge Fund Activism. https://doi.org/10.2139/ssrn.7616618", "why": "2018〜19年の米関税を輸入競争の衝撃として、競争が弱まった企業でアクティビストの介入が増えることを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "関税で輸入競争から守られた企業の経営者を誰が規律するのかを、2018〜19年の米関税を衝撃として調べ、ヘッドファンドのアクティビストがその役を担うことを示した（抄録）。", "p3": "関税による輸入競争の低下を外生的なショックとして使い、保護された産業でのアクティビストの標的化、要求内容、取締役の選任、株価反応、企業の投資・研究開発の変化を比べる。", "p5": "アクティビストは保護産業の企業、とくに直近の好業績企業や国内競争の少ない企業を標的にしやすくなり、取締役の席を求めることが増え、異常収益は15%と関税前の同様のキャンペーンの2倍超だった（抄録）。", "fun": "競争相手がいなくなると、経営者は楽をしたくなります（「静かな生活」）。関税で外国企業との競争が弱まったとき、代わりに経営者を突き動かしたのは物言う株主でした。市場の競争が弱まると、別の形の規律が生まれるという、経済の自己修復のような話です。", "unverified": "標本の企業数は未確認。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "国境を越えた関税の転嫁：寡占とネットワーク", "title": "Pass-through beyond the Border: Oligopoly, Networks, and Tariffs", "url": "https://doi.org/10.2139/ssrn.7616741", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Barbiero, O., Silva, A., & Stein, H. (2026). Pass-through beyond the Border: Oligopoly, Networks, and Tariffs. https://doi.org/10.2139/ssrn.7616741", "why": "輸入投入財・国内生産ネットワーク・外国企業との競争を通じた関税の価格転嫁を多部門モデルで示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "輸入投入財、国内の生産ネットワーク、外国企業との競争を通じて、国境の価格ショックが米国の生産者・消費者物価に転嫁される仕組みを多部門モデルで示し、2025年の関税に適用した（抄録）。", "p3": "水準でも対数でも転嫁を扱えるモデルを、産業連関、貿易、価格の公開データに直接対応させ、競合する輸入品の価格に企業が反応する経路を入れる。", "p5": "競合輸入品の価格への反応を入れると生産者物価への当てはまりが大きく改善し、消費者物価とも整合した。2025年2〜10月の関税引上げはPCEインフレに0.91ポイント寄与し、そのうち0.10ポイントは外国との競争の経路だった（抄録）。", "fun": "関税は輸入品だけを高くするように見えますが、国産品のメーカーも「ライバルの輸入品が高くなったから」と値上げできます。この研究は、そうした見えにくい値上げの道筋まで含めて、関税が物価全体をどれだけ押し上げたかを計算しました。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "アナリストはECBの政策をどう聞き取るか", "title": "What analysts hear and why it matters for monetary policy", "url": "https://doi.org/10.2139/ssrn.7613658", "authors": "Luca Ebener ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Ebener, L., & McGregor, T. (2026). What analysts hear and why it matters for monetary policy. https://doi.org/10.2139/ssrn.7613658", "why": "投資銀行アナリストの言葉から欧州中銀の政策解釈ショックを作り、金融政策の伝達を測った。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "大手投資銀行アナリストのレポートの言葉から、欧州中銀（ECB）の政策がどう解釈されたかの「政策解釈ショック」を作り、その経済効果を調べた（抄録）。", "p3": "政策理事会の前の予想レポートと後のまとめレポートのトーンの変化が、政策イベントで明らかになった予期せぬ情報を反映すると仮定し、GPTによる感情抽出でトーンを測る。", "p5": "アナリストのトーンは理事会のトーンによく沿い、ときに先取りした。解釈ショックのあとには景気抑制的なマクロ経済の反応と、金融市場価格の系統的な動きが続いた（抄録。数値は抄録になし）。", "fun": "中央銀行の発表そのものより、それを「専門家がどう受け取ったか」のほうが市場を動かすのかもしれません。この研究は、発表前後のアナリストのレポートの雰囲気の変化をAIで読み取り、それが景気にまで影響することを示しました。言葉の受け止め方が経済を動かす例です。", "unverified": "対象期間とレポートの数は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "関税は貧困層への税：2025年米貿易戦争の分配効果", "title": "Tariffs as a Tax on the Poor: Distributional Effects of the 2025 U.S. Trade War on Consumer Prices Across Income Groups", "url": "https://doi.org/10.2139/ssrn.7614598", "authors": "TRishala Singh", "venue": "SSRN", "date": "2026-10-16", "apa": "Singh, T. (2026). Tariffs as a Tax on the Poor: Distributional Effects of the 2025 U.S. Trade War on Consumer Prices Across Income Groups. https://doi.org/10.2139/ssrn.7614598", "why": "2025年の米関税による消費者物価の上昇が所得層ごとにどう異なるかを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "2025年の米関税が、所得の低い層ほど重い逆進的な消費税として働いたことを、所得五分位ごとの支出バスケットで示した（抄録）。", "p3": "2024年の消費者支出調査の五分位別の支出構成と、Yale Budget Labのモデルに較正した関税の帰着推定を組み合わせる。完全転嫁と固定バスケットを仮定した帰着の計算で、因果的な価格効果は推定しない。", "p5": "平均実効関税は最大18.3%で、最下位五分位の厚生損失は税引前所得の7.6%、最上位は1.7%（4.5倍の勾配）。最下位は支出の14.2%を高関税の必需品に使い、最上位は6.1%だった（抄録）。", "fun": "関税は外国に払わせる税のように語られますが、実際に払うのは国内で物を買う人です。しかも所得の低い人ほど、食品などの必需品に使うお金の割合が大きいので、負担が重くなります。同じ関税でも、家計の中身によって痛みが4倍以上違うことを示しました。", "unverified": "計算の前提（完全転嫁など）の妥当性は未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "メッセージアプリの相互運用を義務づけると", "title": "Mandating Interoperability in Messaging App Markets", "url": "https://doi.org/10.2139/ssrn.7613282", "authors": "Jun Yan ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Yan, J., & Dhakar, M. (2026). Mandating Interoperability in Messaging App Markets . https://doi.org/10.2139/ssrn.7613282", "why": "複数アプリを併用できる市場で、相互運用の義務化が競争可能性と消費者厚生に与える影響をモデル化した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "メッセージアプリの相互運用を義務づけると、競争と消費者厚生がどう変わるかを、併用できる市場の直接ネットワーク効果のモデルで分析した（抄録）。", "p3": "大きな利用者基盤を持つ無料の既存アプリと、プライバシー保護に優れた有料の新規アプリを考え、新規アプリが大衆戦略かニッチ戦略かを選ぶモデルを作る。", "p5": "相互運用が進むと新規アプリはニッチ戦略に切り替えうる。中程度の相互運用は、独占利用者が生むネットワーク価値を損ない、既存アプリの優位が小さいときに新規アプリをかえって不利にしうる。競争促進と消費者厚生の間に緊張がありうる（抄録）。", "fun": "どのアプリ同士でもメッセージを送れるようにすれば、小さなアプリも戦いやすくなりそうです。ところが、そのアプリだけでつながれるという魅力も消えてしまうため、中途半端な相互運用はかえって新参者を苦しめる場合がある、という逆説を示しました。", "unverified": "なし"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "米国とスイスの機会の不平等を比べる", "title": "Inequality of Opportunity in Times of Rising Global Inequality: USA vs. Switzerland", "url": "https://doi.org/10.2139/ssrn.7620173", "authors": "Jonas Bühler ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Bühler, J., Davis, J., Häner-Müller, M., Mazumder, B., & Schaltegger, C. A. (2026). Inequality of Opportunity in Times of Rising Global Inequality: USA vs. Switzerland. https://doi.org/10.2139/ssrn.7620173", "why": "スイスの行政データを使い、子の将来の成功に関する機会の不平等を米国と比較した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "兄弟姉妹の所得の相関で機会の不平等を測り、1970年代初めと80年代初めに働き始めた世代で、スイスと米国を比べた（抄録）。", "p3": "スイスの行政の所得データと米国の調査データで、長期所得の兄弟姉妹相関を2つのコホートについて推定する。", "p5": "米国では1980年代に兄弟姉妹相関と所得格差が急上昇し、相関は15.4%から30.6%へほぼ倍増した。スイスでは格差も機会の不平等もほぼ安定し、相関は両コホートで15%未満だった（抄録）。", "fun": "兄弟姉妹の収入が似ているほど、生まれた家庭が将来を左右していると考えられます。米国ではこの似かたが一世代で倍になりましたが、スイスではほとんど変わりませんでした。世界中で格差が広がった時代にも、国によって「生まれの重み」の変化は大きく違うのです。", "unverified": "米国の調査データの種類は未確認。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "ワンストップ国境は東アフリカの主食市場を統合したか", "title": "Do One-Stop Border Posts Integrate Staple Markets? Evidence from Staggered Border Reforms in Eastern Africa", "url": "https://doi.org/10.2139/ssrn.7602029", "authors": "Miyanda Hakooma", "venue": "SSRN", "date": "2026-10-15", "apa": "Hakooma, M. (2026). Do One-Stop Border Posts Integrate Staple Markets? Evidence from Staggered Border Reforms in Eastern Africa. https://doi.org/10.2139/ssrn.7602029", "why": "段階的な国境改革を使い、国境での手続き一本化が穀物価格差と取引量を変えたかを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "東アフリカで国境の通関を一本化するワンストップ国境所が、主食の国境を越えた価格差を縮めたかを、段階的な導入を使って検証した（抄録）。", "p3": "国境所の正式・非公式の穀物流量の月次監視データと、トウモロコシ・豆・米の国境間価格差のパネル（元の価格データの単位換算の誤りを修正）を組み合わせ、段階的導入のイベントスタディで推定する。", "p5": "国境所は価格差を測れるほどには縮めず、統合推定値はほぼゼロで、ランダム化推論などに頑健だった。ただし信頼区間は価格差の中央値約22%に対して中程度の統合も否定できない。非公式の割合は下がったが流量の推定は不精確だった（抄録）。", "fun": "国境の手続きを速くすれば、隣国との食料の値段の差は縮まりそうです。ところが調べてみると、はっきりした効果は見つかりませんでした。しかも著者は「効果ゼロの証明ではなく、効果の証拠がない」と慎重に言い分けています。結果の言い方の誠実さも見どころです。", "unverified": "対象の国境所の数は未確認。"}}, {"id": "pn33", "rank": 33, "field": "組織行動・心理的安全性", "headline": "大学選手は公式と非公式のリーダーに何を求めるか", "title": "A Comparison of University Athletes’ Preferences for Leadership from Formal vs. Informal Athlete Leaders", "url": "https://doi.org/10.2139/ssrn.7620272", "authors": "Katherine E. Hirsch-Agnew ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Hirsch-Agnew, K. E., Hitchcock, G., & Zimmerman, C. T. (2026). A Comparison of University Athletes’ Preferences for Leadership from Formal vs. Informal Athlete Leaders. https://doi.org/10.2139/ssrn.7620272", "why": "選手が公式の主将と非公式のリーダーに求めるリーダーシップの量を比較した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "北米の大学選手238人に、主将などの公式の選手リーダーと非公式のリーダーに、それぞれどれだけのリーダーシップを望むかを尋ねて比べた（抄録）。", "p3": "スポーツのリーダーシップ尺度と変革型リーダーシップの尺度を、公式・非公式それぞれを対象にした「望ましい量」版で回答してもらい、リーダーの種類と行動の間の違いを比べる。", "p5": "選手は公式リーダーに、指導、社会的支援、肯定的なフィードバック、個別配慮、目標の受容とチームワークの促進、高い期待、模範を非公式リーダーより多く望み、どちらのリーダーにも変革型の行動を最も望んだ（抄録）。", "fun": "チームには、肩書きのある主将と、肩書きはないけれど皆が頼る人がいます。選手たちは、主将にはより多くの役割を期待していました。一方で、どちらにも「やる気を引き出す」タイプの関わりを一番求めていたのは、部活動にも当てはまりそうな結果です。", "unverified": "効果量の値は未確認。"}}, {"id": "pn34", "rank": 34, "field": "組織行動・心理的安全性", "headline": "持続的な市民参加が若者にもたらす心理的帰結", "title": "Social and psychological consequences of sustained civic engagement: Insights from the 2024/25 Student Blockades in Serbia", "url": "https://doi.org/10.31234/osf.io/vujys_v1", "authors": "Ana Ivanov ほか", "venue": "PsyArXiv", "date": "2026-10-15", "why": "セルビアの2024〜25年の学生封鎖運動を対象に、集団行動の心理的・社会的な影響を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "セルビアの2024〜25年の学生による大学封鎖運動の参加者が、長期の集団行動をどう経験したかを、面接の質的分析で明らかにした（抄録）。", "p3": "現象学に基づく質的研究で、積極的に参加した学部・大学院生20人（女性11人、平均22.15歳）に60〜90分の半構造化面接を行い、反省的テーマ分析をした。", "p5": "封鎖を生活と政治的主体性を変える「変容の場」とするテーマ、集団的アイデンティティと道徳的関与による社会関係の組み替え、不安・脅威・燃え尽きと、それを和らげる人間関係の緩衝の3つの上位テーマが見いだされた（抄録）。", "fun": "リーダーのいない学生の抗議運動が何か月も続くと、参加した人の心や人間関係はどう変わるのでしょうか。この研究は、運動が生きがいや仲間を生む一方で、不安や燃え尽きももたらし、それを支えたのも仲間だったことを描きました。", "unverified": "便宜的な雪だるま式標本で、一般化の範囲は未確認。"}}, {"id": "pn35", "rank": 35, "field": "組織行動・心理的安全性", "headline": "インキュベータ支援からスタートアップの能力形成へ", "title": "From Institutional Support to Startup Development: Team Creativity and Organizational Innovation as Mechanisms of Capability Formation under Systemic Uncertainty", "url": "https://doi.org/10.2139/ssrn.7616304", "authors": "Carla S. Marques ほか", "venue": "SSRN", "date": "2026-10-15", "why": "チームの創造性と組織の革新が、支援を能力に変える媒介になることを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "ポルトガルのインキュベータの支援が、チームの創造性と組織の革新を通じてスタートアップの発展につながるかを、動的能力の観点から検証した（抄録）。", "p3": "7つのインキュベータに入居する35社のCEOと従業員の有効回答107件（2026年3〜6月のオンライン調査）を、PLS-SEMで分析する横断研究。", "p5": "インキュベータの支援はチームの創造性と組織の革新に正に関連し、創造性は革新と特に強く関連し、革新は発展と正に関連した。創造性は支援と革新の関係を部分的に媒介した（抄録）。", "fun": "起業を支援する施設は、お金や場所を提供します。でも、それが会社の成長につながるには、チームが自分たちで新しいアイデアを生み出す力に変わる必要がある、という結果です。支援は「渡すもの」ではなく、「中で育てるもの」に変わったときに効くのです。", "unverified": "横断調査で因果は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "逐次オークションで分散型のLLMワークフロー", "title": "Decentralized LLM Workflows via Sequential Auctions", "url": "https://arxiv.org/abs/2610.22201", "authors": "Ian Gemp ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "why": "利己的なエージェントの市場をオークションで組織し、多段階タスクを解く拡張可能な枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利己的なLLMエージェントの市場を逐次オークションで組織し、多段階の課題を分散的に解く枠組みで、不完全競争でも市場が機能することを示した（抄録）。", "p3": "完全なクローンによる完全競争を仮定した理論を緩め、異質なエージェントが入札を戦略的に下げて利益を確保する設定で、ミラー降下・トンプソン抽出・ベイズ最適・PPOの4つの入札法と、第1価格・第2価格・信用保存ヴィックリーの3方式を比べる。", "p5": "完全なクローンでは利益がゼロになり、競争がないと市場が崩れる。その間の不完全競争では、エージェントの必要な利益を保ちつつ協調課題が解けることを多様な領域で示した（抄録。数値は抄録になし）。", "fun": "AIたちに仕事を競りで割り振ると、そっくりなAIばかりなら値下げ競争で誰も儲からず、ライバルがいなければ足元を見られます。この研究は、その中間のほどよい競争で、AIも儲かり仕事もこなせることを示しました。経済学の市場の考えをAIの組織づくりに使う発想です。", "unverified": "課題の領域と性能の数値は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "ESGの高評価と炭素リーケージの逆説", "title": "Beyond Appearances: ESG Performance, Green Innovation, and the Carbon Leakage Paradox", "url": "https://doi.org/10.2139/ssrn.7620450", "authors": "ines ben mehrez ほか", "venue": "SSRN", "date": "2026-10-16", "why": "米上場650社のスコープ別排出を分析し、ESG評価とグリーン革新の関係に潜む逆説を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "米上場650社（2010〜2022年）で、ESG評価とスコープ別の炭素排出の関係と、グリーン革新の媒介・調整の役割を調べた（抄録）。", "p3": "スコープ1・2・3の排出をESG評価に回帰し、グリーン革新を媒介・調整として入れる。内生性に対して二段階最小二乗、傾向スコアマッチング、エントロピーバランシング、ヘックマン補正の4つの戦略を使う。", "p5": "ESG評価はスコープ1・2の排出を有意に減らし、グリーン革新がその経路になった。一方スコープ3の排出とはすべての定式化で正に関連し（「スコープ3の逆説」）、炭素集約的な活動がバリューチェーンへ移っている可能性を示した（抄録）。", "fun": "環境に優しいと評価される会社ほど、自社の煙突からの排出は減っていました。ところが取引先を含めたサプライチェーン全体の排出はむしろ多かったのです。汚れ仕事を外に出せば自社の数字はきれいになる、という評価の盲点を示している点が考えどころです。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "グリーンウォッシュを動的な戦略制御として解く", "title": "Greenwashing as a Dynamic Strategic Control: Detection Risk, Consumer Skepticism, Heterogeneous Time Preferences, and Retailer Cost Sharing", "url": "https://doi.org/10.2139/ssrn.7618221", "authors": "Arka Mukherjee", "venue": "SSRN", "date": "2026-10-16", "why": "発覚リスクと消費者の懐疑、時間選好の違いを入れて、環境改善と環境訴求の最適な組み合わせを導いた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "メーカーと小売の無限期間の微分ゲームで、本物の環境改善とグリーンウォッシュ（誇張した環境訴求）の最適な組み合わせを解いた（抄録）。", "p3": "メーカーが改善努力と誇張の強さを、主導者の小売が改善費用の補助の割合を選ぶ。本物の環境品質と消費者の懐疑を動的な状態とし、1つの監視パラメータqが情報を持つ消費者の割合・発覚確率・懐疑の蓄積を決める。両者の時間選好の違いも許す。", "p5": "閉形式の定常シュタッケルベルク均衡が得られ、静的モデルとは違い、グリーンウォッシュは1より厳密に小さい内生的な発覚の閾値で止まるなど4つの結果を示した（抄録）。", "fun": "「環境に優しい」と大げさに宣伝すると、ばれたときに客の不信がたまり、それが長く残ります。この研究は、その不信の蓄積を時間とともに追う数学のゲームを作り、監視が一定以上強ければ企業は誇張をやめることを示しました。評判を「たまっていく量」として扱うのが工夫です。", "unverified": "4つの結果のうち残り3つの内容は未確認。"}}, {"id": "pn39", "rank": 39, "field": "機械学習（Hugging Face）", "headline": "重みを変えずにエージェントの足場を自己進化させる", "title": "Self-Evolving Agent Harness", "url": "https://arxiv.org/abs/2610.18813", "authors": "Chuyang Wei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "why": "プロンプト・記憶・ワークフローなどの足場をフィードバックで改訂する自己進化を定式化した（HF投票184）。", "explain": {"basis": "抄録", "basis_note": "Hugging Faceの抄録を使用", "preprint": true, "short": true, "p1": "モデルの重みを変えずに、プロンプト・記憶・ワークフロー・ツールなどエージェントの足場（ハーネス）をフィードバックで改訂し続ける自己進化を定式化した（抄録）。", "p3": "更新の対象と、提案・採用の仕組みを分け、解釈される状態の変更、ツールやコードの改訂、制御ロジック、プラグイン構成を区別する。探索を進化的最適化として、信頼性を継続的PAC学習として扱う。", "p5": "明示的な仮定のもとで期待汎化の上界、過去の退行予算に条件付けた保持の上界、新しい独立の検証データによる高確率の採用規則を導いた。66ページの総合的な議論を含むとする（抄録）。", "fun": "AIの頭脳そのもの（重み）はそのままで、AIが使うメモ帳や手順書を少しずつ書き換えて賢くしていく、という方法の理論です。書き換えが本当に改善かを、新しいテストで確かめてから採用するルールを数学的に示しているのが、安全性の面で大事な点です。", "unverified": "実験的な評価の有無と結果は未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習（Hugging Face）", "headline": "汎用コンピュータ操作エージェントを全部公開で", "title": "OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use", "url": "https://arxiv.org/abs/2610.22200", "authors": "Hanzhang Zhou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "why": "視覚とプログラムの両方でコンピュータを操作するエージェントの、完全に公開された技術一式を目指した（HF投票208）。", "explain": {"basis": "抄録", "basis_note": "Hugging Faceの抄録を使用", "preprint": true, "short": true, "p1": "画面操作とプログラム操作の両方でコンピュータを使う汎用エージェント（GCUA）の技術一式を公開するOpenGCUAの最初のリリース（抄録）。", "p3": "コード実行を設計の中心に置き、途中結果で次の操作を決められるようにする。観察や課題状態の判断の一部を、固定のハーネス規則からモデルに移す「ハーネスからモデルへの意思決定の移譲」を提案する。", "p5": "OSWorld-v2で評価した8モデルすべてで得点が上がり、画面操作のみの実行に比べ平均部分得点が+19.6ポイント、1課題あたりの手順数が平均53.0%減った。実機のmacOS課題では、モデル間で推論トークン量に19.4倍の差があった（抄録）。", "fun": "AIにパソコンを使わせるとき、画面のボタンを1つずつクリックさせるより、プログラムを書かせて一気に処理させたほうが速くて確実です。人間でも、同じ作業を何百回も繰り返すならマウスよりスクリプトを使いますよね。その発想をAIエージェントに持ち込んだ研究です。", "unverified": "実機用ハーネスとSDKは予備版とされ、性能は未確認。"}}, {"id": "pn41", "rank": 41, "field": "機械学習（Hugging Face）", "headline": "AI導入の「最後の一マイル」を測るFDE-Gym", "title": "FDE-Gym: The Last Mile of AI Delivery", "url": "https://arxiv.org/abs/2610.22350", "authors": "Dongxu Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "why": "仕様の決まったタスクではなく、顧客先での導入作業を評価する新しいエージェント評価環境を示した（HF投票188）。", "explain": {"basis": "抄録", "basis_note": "Hugging Faceの抄録を使用", "preprint": true, "short": true, "p1": "仕様の決まった課題ではなく、曖昧な要望を確かめ、稼働中のシステムで隠れた制約を見つける「顧客先での導入作業」をAIエージェントで評価するベンチマークFDE-Gymを作った（抄録）。", "p3": "18部門・20の顧客シナリオから専門家が作った95の課題で、台本のある関係者と変更可能な顧客システムを模擬する。顧客自身の成功指標の改善を0〜1に正規化し、関係者とのやり取りなどに減点を課す。", "p5": "7社の13構成を評価し、隠れた制約を見つける必要がある現実的な設定で、最良でも平均0.56、95課題中14課題しか解決しなかった。主要な事実をすべて得た23課題でも、0.8以上は10課題だった（抄録）。", "fun": "「この仕様どおりに作って」と言われれば、AIはかなり上手に作れます。でも本当の仕事では、お客さん自身も気づいていない条件を聞き出すところから始まります。この評価で、AIがいちばん苦手なのはまさにそこだとわかりました。仕事の「最後の一マイル」の難しさです。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "完全か疎か：ニューラルネットの2つの識別可能性", "title": "Complete or Sparse: A Tale of Two Identifiabilities", "url": "https://arxiv.org/abs/2610.20851", "authors": "Junze Zhou ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "why": "教師あり学習がいつ真の表現を回復できるかを識別可能性として理論化し、機械的解釈可能性に基礎を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "教師あり学習がデータの背後の真の潜在変数を回復できる条件（識別可能性）を、ラベルが潜在変数を生むか、潜在変数がラベルを生むかの2つの因果の向きで調べた（抄録）。", "p3": "表現の次元が潜在空間以上なら最適な符号化器は潜在変数に線形であることを証明し、次元が足りないと識別可能性が一般に失われることを示す。さらに非負の活性化とエネルギー効率、または疎性とspark条件などの追加の制約で個々の潜在変数の回復を示す。", "p5": "生成的な設定では各ニューロンがちょうど1つの潜在変数を表す（いわゆるおばあさん細胞のような選択的応答）ことを説明し、識別的な設定では圧縮センシングの構造を受け継いで疎辞書学習で個々の潜在変数を完全に回復できることを示した（抄録）。", "fun": "脳には、特定の人の顔だけに反応する「おばあさん細胞」があるという話があります。この研究は、エネルギーを節約しながら学ぶと、人工のニューロンも1つの要因だけを担当するようになることを数学的に示しました。AIの中身が読めるようになる条件を探る基礎研究です。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "ディリクレ過程で次元に依存しないPAC-Bayes汎化", "title": "Dimension-Free PAC-Bayes Generalization for Deep Neural Networks via Dirichlet Processes", "url": "https://arxiv.org/abs/2610.21340", "authors": "Sumit Vashishtha", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "why": "パラメータ空間に事前分布を置く従来のPAC-Bayesの次元依存を、ディリクレ過程で取り除いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ネットワークのパラメータ数に依存しないPAC-Bayesの汎化保証を、事前分布をパラメータ空間ではなくデータ分布の空間にディリクレ過程で置くことで得た（抄録）。", "p3": "学習アルゴリズムによる押し出し測度でパラメータの分布を誘導し、データ処理不等式で、パラメータ空間の相対エントロピーをデータ空間のディリクレ過程のダイバージェンスで抑える。後者はディガンマ関数で閉形式に計算する。", "p5": "保証はパラメータ数・幅・深さに依存しない。MNIST全体で7,850〜4,203,522パラメータのモデルについて、従来の重み空間の上界が940%を超えて無意味になるのに対し、提案の保証は8.8〜9.4%で安定した（抄録）。", "fun": "巨大なAIほどパラメータが多く、従来の理論では「テストで間違える率は1000%以下」のような意味のない保証しか出せませんでした。この研究は、見方をパラメータからデータの側に移すことで、AIの大きさに関係なく1割程度という意味のある保証を出しました。", "unverified": "MNIST以外のデータでの結果は未確認。"}}, {"id": "pn44", "rank": 44, "field": "機械学習", "headline": "推論LLMの逐次実験計画を償却する", "title": "Amortizing Sequential Experimental Design in Reasoning LLMs", "url": "https://arxiv.org/abs/2610.20832", "authors": "Anita Kriz ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "why": "LLMが情報を適応的に集めるのが苦手な実験計画タスクで、逐次計画を学習で償却する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "情報を適応的に集めるのが苦手なLLMに、情報利得を報酬として推論を学ばせ、逐次ベイズ実験計画を償却（あらかじめ学習）した（抄録）。", "p3": "実験の生成モデルをLLM自身の信念とは独立に指定し、選んだモデルのもとで期待情報利得を最適化する。生成モデルの作り方、報酬の推定、仮説空間、多段の目的、計算コストなどの設計を比べる。", "p5": "20の質問ゲームで、情報獲得と課題成績が改善し、推論時・学習時のベイズ実験計画の基準を大幅に低いコストで上回り、未知のカテゴリにも一般化した。臨床対話のMedi-Qへの正の転移も示した（抄録）。", "fun": "「20の質問」ゲームで勝つには、毎回、答えの候補を半分に減らすような質問をするのがコツです。LLMは物知りでも、この「どれを聞けば一番わかるか」を考えるのが苦手でした。その質問のうまさを学習で身につけさせ、医療の問診にも応用できた点が面白いところです。", "unverified": "性能の具体的な数値は未確認。"}}, {"id": "pn45", "rank": 45, "field": "機械学習", "headline": "文脈内学習で生存分析をする基盤モデル", "title": "SurvICL: a Foundation Model for in-context Survival Analysis", "url": "https://arxiv.org/abs/2610.22242", "authors": "Julie Alberge ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "why": "打ち切りのある小規模データでも使える、生存分析向けの表形式基盤モデルを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "打ち切りのある小規模データでも50年前のCoxモデルを上回る、文脈内学習で生存曲線を予測する表形式基盤モデルSurvICLを作った（抄録）。", "p3": "新しい柔軟な比例オッズ事前分布から生成した合成データだけで事前学習する。合成データでは打ち切りのない事象時刻が得られるので、通常の分位点回帰の損失で学習できる。103データセットの過去最大の生存分析ベンチマークも作った。", "p5": "設計判断に使わなかった63データセットで、調整なしで20の基準に対し、統合ブライアスコアの対比較で82.9%勝ち（次点のCoxは71.3%）、小規模データでCoxを上回る初めてのモデルになった（抄録）。", "fun": "「いつ起きるか」を予測する生存分析では、半世紀前に作られたCoxの方法が今でも強敵でした。この研究は、本物の患者データではなく、作り物のデータを大量に見せて学ばせることで、ついにCoxを超えました。作り物なら「結末」まで全部わかる、という利点を生かした工夫です。", "unverified": "なし"}}, {"id": "pn46", "rank": 46, "field": "政治学", "headline": "アイデンティティ選挙と報道機関の供給", "title": "Identity-Based Elections and Media Supply", "url": "https://doi.org/10.2139/ssrn.7615991", "authors": "Akhmad Susamto", "venue": "SSRN", "date": "2026-10-15", "why": "有権者のアイデンティティに基づく選好が、政治情報の媒体の供給と情報集約をどう変えるかをモデル化した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "有権者が自分の集団の政党に有利な結論を望むとき、どんな報道機関が供給され、それが情報の集約にどう影響するかを理論モデルで示した（抄録）。", "p3": "各有権者は、自分で選べない外部の信号に加えて、自集団の政党を支持する事後確率を最大にする信号構造を選ぶ。各媒体は1つの集団向けに1つの信号構造を提供し広告収入を得る。独立所有と保護された独占を比べ、デジタル化が一方的な媒体のコストを下げる。", "p5": "外部の信号が不精確なら一方的な信号（普段は好ましいニュース、まれに決定的な悪いニュース）を、精確なら両面的な信号を好む。独立所有では、外部の信号が不精確な集団に一方的な媒体が参入する（抄録）。", "fun": "人は自分の味方に有利なニュースを好みがちです。この研究は、周りの情報があいまいな集団ほど、いつも味方に甘いけれどたまに決定的な悪い知らせも伝える媒体を好む、と示しました。偏った報道が生まれる理由を、需要と供給の経済学で説明している点が面白いところです。", "unverified": "保護された独占のもとでの結果は未確認（抄録が途中で切れている）。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "フェイスブックの規模と票は一致しない（ギリシャ）", "title": "Bigger Page, Fewer Votes: SYRIZA, New Democracy and Facebook in Greece, 2015 to 2020", "url": "https://doi.org/10.2139/ssrn.7615703", "authors": "Tristan Hotham", "venue": "SSRN", "date": "2026-10-15", "why": "ギリシャ5党の3万件超の投稿から、ページの大きさと得票の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "ギリシャの5政党と4人の党首のFacebookの投稿31,532件（2015年1月〜2020年9月）で、反応の量と得票を比べ、政権交代の前後の党首ページを追った（抄録）。", "p3": "CrowdTangleで集めた投稿の反応（インタラクション）の分け前を、同じ政党間の得票の分け前と比べ、ページの規模や投稿量、いいねあたりの反応を見る。", "p5": "2019年選挙前の1か月、SYRIZAとツィプラスのページは反応の56%と61%を得たが、得票は33%と36%だった。新民主主義党とミツォタキスは25%と21%で、得票は46%だった。差は投稿の質ではなく、聴衆の規模と投稿量の違いと整合した（抄録）。", "fun": "SNSで「いいね」がたくさん集まる政党が選挙で勝つとは限りません。ギリシャでは、反応の多かった側が負け、少なかった側が勝ちました。反応の多さは、投稿の回数やフォロワーの数で決まる部分が大きく、民意の大きさとは別物だということを示しています。", "unverified": "なし"}}, {"id": "pn48", "rank": 48, "field": "教育", "headline": "インディアナ州の学校バウチャー：負の選択と同級生効果", "title": "Negative Selection and Peer Effects in Indiana's Voucher Program", "url": "https://doi.org/10.2139/ssrn.7616518", "authors": "Kendyl Guzman", "venue": "SSRN", "date": "2026-10-15", "why": "私立学校バウチャーに誰が移るかと、その同級生効果を推定した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "インディアナ州の私立学校バウチャーを使う生徒の特徴と、その生徒が公立校を去ったことが残った同級生に与える影響を推定した（抄録）。", "p3": "バウチャー制度への自己選択を、過去の懲戒歴などの記録で調べ、懲戒歴のある生徒とない生徒の転出が、残った同級生の停学に与える効果を比べる。", "p5": "成績の良い生徒が選んで移るという正の選択の証拠はなく、懲戒歴の多い生徒が制度を選んでいた。懲戒歴のある生徒の転出で、残った同級生100人あたり校内停学が2.7件、校外停学が1.7件減り、懲戒歴のない生徒の転出では変化がなかった（抄録）。", "fun": "学校選択制では「できる子から私立へ抜けて、公立が苦しくなる」と心配されがちです。ところがこの州では、むしろ問題行動の多い子が私立へ移り、残った公立の教室は落ち着きました。制度の効果は、誰が動くかによって正反対にもなるという例です。", "unverified": "学力への影響は未確認。"}}, {"id": "pn49", "rank": 49, "field": "教育", "headline": "教員が届ける学校の心の健康プログラムをRCTで検証", "title": "Youth First Supports Adolescent Wellbeing: A Longitudinal Cluster-Randomized Controlled Trial of a Teacher-Delivered School-Based Program in India", "url": "https://doi.org/10.31234/osf.io/vg5ju_v3", "authors": "Peter L. Cooper ほか", "venue": "PsyArXiv", "date": "2026-10-15", "why": "インドでのクラスター無作為化比較試験で、教員による思春期のウェルビーイング支援の効果を長期に検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "インド・ビハール州の農村の公立校で、教員が実施する思春期のウェルビーイングの授業Youth Firstの効果を、クラスター無作為化比較試験の二次分析で長期に検証した（抄録）。", "p3": "70校のうち基礎データのある69校の7〜8年生5,445人を介入群と通常教育群に割り付け、開始時・8か月・20か月で測る。修正ITT分析で、学校と生徒の変量切片を持つ混合効果の差の差モデルを使い、主要評価項目はBenjamini-Hochberg法で補正した。", "p5": "補正後も、複数の時点とコホートで社会的・仲間の支援を有意に改善し、心理的ウェルビーイングにも効果があった。探索的には自己効力感や内在化症状、喫煙などにも名目上の効果があり、一部は修了1年後にも続いたか現れた（抄録）。", "fun": "心の健康を守る授業を、専門家ではなく普段の先生が、ふつうの公立校で行っても効果があるのか。5千人以上の生徒を学校単位でくじ引きに分けて確かめ、とくに友だちに支えられている感覚が育ったことがわかりました。大規模に広げられる方法として意味のある結果です。", "unverified": "効果量の値は未確認。"}}, {"id": "pn50", "rank": 50, "field": "教育", "headline": "最適なSTEM教育：一般均衡で評価する", "title": "Optimal STEM Education", "url": "https://doi.org/10.2139/ssrn.7616542", "authors": "Charles Ka Yui Leung ほか", "venue": "SSRN", "date": "2026-10-15", "why": "専攻・職業選択と内生的な技術革新を入れたモデルで、STEM教育の推進策の効果を評価した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "専攻と職業の選択、内生的な技術革新を入れた一般均衡のライフサイクルモデルで、STEM教育の推進策の効果を評価した（抄録）。", "p3": "モデルの中で、STEMの拡大、学費の一般的な支援、STEMへの補助、女性を対象にしたSTEM政策、研究開発への直接補助を同程度の費用で比べる。", "p5": "適度なSTEM拡大は厚生と成長を高めるが、行き過ぎると向いた専攻の学生を引き抜き研究能力を下げる。同程度の費用では一般的な学費支援が厚生を、STEM補助が成長を最も高め、女性対象の政策は男女の所得差を縮めるが強すぎると厚生を下げた（抄録）。", "fun": "「理系を増やせば国が豊かになる」と言われますが、増やしすぎると、本当は文系や他の分野に向いた人まで理系に来て、かえって研究の力が落ちるという結果です。どんな政策にも「ちょうどよい量」があることを、経済全体の模型で示した点が面白いところです。", "unverified": "モデルの較正の対象国は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "オンライン調査にAI回答者はどれだけ紛れ込むか", "title": "Estimating the threat of AI-agent responding across online survey platforms", "url": "https://doi.org/10.1073/pnas.2606460123", "authors": "Grace Zhang ほか", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "date": "2026-10-15", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr02", "rank": 2, "headline": "橋梁モニタリングの連続欠測を分解＋深層学習で復元", "title": "A Consecutive Missing-Data Recovery Method for B ng older home care clients in Finland", "url": "https://doi.org/10.1007/s10433-026-00954-5", "authors": "Mari Aaltonen ほか", "venue": "European Journal of Ageing", "date": "2026-10-15", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr12", "rank": 12, "headline": "放射線科チームのバーンアウトを仕事の要求度-資源で分析", "title": "Burnout and psychosocial working conditions in a multidisciplinary hospital radiology team: a cross-sectional study using the job demands–resources framework", "url": "https://doi.org/10.1186/s13244-026-02433-y", "authors": "Thomas Dertnig ほか", "venue": "Insights into Imaging", "date": "2026-10-15", "sjr": 1.418, "citescore": 7.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr13", "rank": 13, "headline": "べき型非線形楕円方程式のパラメータ同定の有限要素誤差", "title": "Finite Element Error Analysis for Elliptic Parameter Identification with Power-Type Nonlinearity", "url": "https://doi.org/10.1137/26m1842646", "authors": "De-Han Chen ほか", "venue": "SIAM Journal on Numerical Analysis", "date": "2026-10-16", "sjr": 2.12, "citescore": 5.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr14", "rank": 14, "headline": "気候予算はどう計算され政治化するか（エドモントン）", "title": "The politics of calculative tools in practice: Climate budgeting in Edmonton", "url": "https://doi.org/10.1177/00420980261492432", "authors": "Taylor Davey", "venue": "Urban Studies", "date": "2026-10-16", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr15", "rank": 15, "headline": "業績が良くても時価総額が上がらない「評価のボトルネック」", "title": "EXPRESS: Valuation Bottlenecks: Why Isn’t a Better Business Enough for a Higher Market Capitalization?", "url": "https://doi.org/10.1177/10591478261499473", "authors": "Shumpei Iwao ほか", "venue": "Production and Operations Management", "date": "2026-10-16", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr16", "rank": 16, "headline": "待ち行列の情報開示と価格で異質な顧客をさばく", "title": "EXPRESS: Pricing and Information Provision in Service Platforms with Heterogeneous Customers", "url": "https://doi.org/10.1177/10591478261498518", "authors": "Xin Weng ほか", "venue": "Production and Operations Management", "date": "2026-10-16", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の早期公開版の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "待ち時間への敏感さが異なる顧客が並ぶ仮想待ち行列で、サービス価格と待ち時間の情報開示をどう組み合わせるのが最適かを理論的に示した（抄録）。", "p3": "提供者が価格と待ち時間の開示方針を同時に決め、顧客が合理的期待のもとで並ぶか諦めるかを選ぶ様式化モデルを作る。長期平均の待ち時間を告げる決定的な開示を基準に比べる。", "p5": "最適な開示は尺度化したラデマッハー分布で表され、告げる値は高々2つで足りる。これにより無限次元の問題が有限次元の最適化に帰着し、告げる待ち時間をばらつかせるほうが得になる場合を特定した（抄録）。", "fun": "病院や飲食店のアプリで「待ち時間は約20分」と表示されると、並ぶかどうかの判断が変わります。この研究は、いつも平均を告げるより、状況に応じて2種類の値を使い分けるほうが得になる場合があると示しました。情報の出し方そのものが、料金と同じくらい大事な道具になります。", "unverified": "最適な戦略の具体的な条件は未確認（抄録が途中まで）。"}}, {"id": "jr17", "rank": 17, "headline": "人事担当者のAI利用意図を左右する認知と感情", "title": "Beyond usefulness: cognitive and emotional correlates of AI use intentions among HR professionals", "url": "https://doi.org/10.1108/jeim-07-2026-1316", "authors": "René Arseneault ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-10-16", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "人事担当者285人の調査で、AI利用意図に結びつく認知的・感情的な要因を、技術受容モデルと評価理論の観点から比べた（抄録）。", "p3": "有用性・使いやすさの認知的評価、AI利用不安、AIによる雇用不安、人事機能でのAI利用、AIの知識を予測変数とし、確認的因子分析のあと階層的な調整回帰でAIの知識の調整効果を探る。", "p5": "認知的評価が利用意図と最も強く結びつき、AI利用不安は小さな負の関連を示した。雇用不安、人事機能での利用、AIの知識は、他の予測変数を入れると固有の分散を説明しなかった（抄録）。", "fun": "「AIに仕事を奪われるのが怖いから使わない」と思われがちですが、人事のプロへの調査では、使うかどうかを一番左右したのは「便利で使いやすいか」でした。不安も少しは影響しますが、雇用への心配は他の要因を考えると目立たなくなりました。", "unverified": "横断調査のため因果は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "決済アプリの日常体験は利用者の幸福感を高めるか", "title": "Beyond continuance: how FinTech app experiences shape user well-being", "url": "https://doi.org/10.1108/intr-04-2026-0726", "authors": "Ali Raza ほか", "venue": "Internet Research", "date": "2026-10-16", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "サウジアラビアのデジタルウォレットのアプリの実際の口コミから、継続利用ではなく利用者のウェルビーイングを左右する体験の要因を特定した（抄録）。", "p3": "Google PlayとApp Storeのアラビア語・英語の口コミに、階層クラスタリング、LDAのトピックモデル、感情分析、複数モデルの分類、人による検証、正則化回帰を組み合わせた混合研究法を当て、自己決定理論で解釈する。", "p5": "苦情処理の有効性、システムの信頼性、利用者の自律性はウェルビーイングを正に、情報の曖昧さは負に左右した（抄録）。", "fun": "アプリの評価というと「使い続けるか」が注目されますが、この研究は「使っていて幸せか」に目を向けました。口コミを大量に読み解くと、困ったときにちゃんと対応してくれることや、自分で決められる感覚が幸福感につながっていました。", "unverified": "口コミの件数と係数の値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "AIが値付けすると消費者は価格をどう解釈するか", "title": "When AI Sets the Price: How Consumers Interpret Price Formats and Intent", "url": "https://doi.org/10.1111/joca.70080", "authors": "Alvaro Chacon ほか", "venue": "Journal of Consumer Affairs", "date": "2026-10-16", "sjr": 1.043, "citescore": 7.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "AIが値付けした価格に消費者がどう反応するかを、値付けの主体（AIか人か）と価格の形式（切りのよい価格か、980円のような端数価格か）で検証した（抄録）。", "p3": "チリの学生165人と米国の消費者631人の2つの実験で、値付けの主体と価格形式を操作し、推奨意図と購入意図、知覚された操作意図を測る。", "p5": "消費者はAIの値付けに好意的でなく、AIの値付けでは端数価格より切りのよい価格が好まれる傾向があった。端数価格はAIが消費者を操作・搾取しようとしているという知覚を強め、推奨と購入の意図を下げた（抄録）。", "fun": "「1,980円」のような値段は安く見せる昔ながらの工夫です。ところが、その値段をAIがつけたと知ると、人は「何か企んでいる」と感じてかえって買いたくなくなりました。同じ工夫でも、誰がやったかで受け取られ方が変わるのが面白い点です。", "unverified": "効果量の値は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "恋愛の推薦はAIか仲人か：消費者の反応", "title": "On matters of love: exploring consumer reactions to algorithmic vs. human dating recommendation agents", "url": "https://doi.org/10.1108/jrim-02-2026-0103", "authors": "Xi Song ほか", "venue": "Journal of Research in Interactive Marketing", "date": "2026-10-16", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "恋愛相手の推薦をアルゴリズムが行うか、仲人が行うかで、消費者のサービス利用の検討がどう変わるかを、エージェンシー理論と暗黙の理論から調べた（抄録）。", "p3": "予備調査（N=233）と2つのシナリオ実験（N=300、N=520）で、推薦者の種類と、人の知性は固定か変わるかという暗黙の信念を操作・測定する。", "p5": "推薦者の種類は消費者の統制感を左右し、それがサービスの受け入れを決めた。知性は固定的だという信念が強いほど、アルゴリズムによるサービスを検討しやすかった（抄録）。", "fun": "恋愛のような個人的なことをAIに任せられるかどうかは、「自分で決めている感覚」が持てるかにかかっていました。さらに「人の能力は変わらない」と考える人ほどAIの推薦を受け入れやすかったのは、意外な結びつきです。", "unverified": "統制感の測定方法は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "戦争と家計への不安が消費者の幸福感を下げる", "title": "How Concern About War and Finances Shapes Consumer Well-being: Evidence From Finland", "url": "https://doi.org/10.1007/s10603-026-09635-3", "authors": "Jannica Nyman ほか", "venue": "Journal of Consumer Policy", "date": "2026-10-15", "citescore": 5.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "2022年のロシアのウクライナ侵攻のあと、戦場の外にいるフィンランドの消費者の不安が、家計の心配を通じてウェルビーイングを下げたことを示した（抄録）。", "p3": "存在論的安全の観点から、開戦後6か月間に集めた全国代表の調査（n=4,394）で、脅威の知覚、家計の心配、消費の先送りとウェルビーイングの関係を分析する。", "p5": "知覚された脅威は主に家計の心配の増加と消費の先送りを通じてウェルビーイングを下げた。とくに低所得の消費者では消費の先送りがさらにウェルビーイングを損ない、一部の消費行動が危機時の安定に役立つことを示した（抄録）。", "fun": "戦争の不安から「今は買い物を控えよう」と考えるのは自然です。ところが、所得の低い人ほど、いつもの買い物を我慢することがかえって心を弱らせていました。日常の買い物は、生活のリズムを保つ「心の支え」にもなっているのかもしれません。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "LLMで読み解く購入後の苦情の感情崩壊", "title": "Post-Purchase Emotional Collapse: LLM-Assisted Analysis of Online Consumer Complaint Narratives", "url": "https://doi.org/10.16951/trendbusecon.1959160", "authors": "Eren Temel", "venue": "Trends in Business and Economics", "date": "2026-10-15", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "ネット通販で繰り返すサービスの失敗が積み重なって起きる「購入後の感情崩壊」を定義し、LLMを補助にした苦情の物語の分析で特徴を描いた（抄録）。", "p3": "トルコの苦情サイトsikayetvar.comの苦情1,000件を、LLMによる感情のコーディング、接点の特定、比喩分析、物語の分類で質的内容分析し、一部を人が検証する。", "p5": "配送の失敗が最も多くコードされた断絶点で、怒り・失望・後悔が主な感情として多くコードされた。苦情の物語には、だまし・戦い・破壊の比喩が含まれていた（抄録）。", "fun": "1回の配送ミスなら「まあいいか」で済むかもしれません。でも失敗が重なると、怒りが「裏切られた」という気持ちにまで変わっていきます。この研究は、苦情の文章に出てくる「戦い」や「だまし」といった比喩から、客の心が壊れていく過程を読み取りました。", "unverified": "人による検証の一致度は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "持続可能金融の規制はESG評価を株価に織り込ませるか", "title": "Beyond Disclosure: Sustainable Finance Regulation and the Pricing of ESG Performance in Mature Capital Markets", "url": "https://doi.org/10.1002/bse.71692", "authors": "Nicola Del Sarto", "venue": "Business Strategy and the Environment", "date": "2026-10-16", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "EURO STOXX 50とS&P 100の大企業（2015〜2024年）で、ESGの成績が企業価値と収益性にどれだけ結びつくか、EUの持続可能金融の規制でそれが変わったかを調べた（抄録）。", "p3": "企業と年の固定効果モデルで、1期前のESG成績とトービンのQ、会計上の収益性の企業内の関連を推定し、2018年のEU行動計画と2021年の開示規則（SFDR）の前後で欧米の企業を比べ、ESGの不祥事の調整効果も見る。", "p5": "ESGの改善はトービンのQと正だが弱く関連し、収益性とは系統的な関係がなかった。規制の節目のあとにEU企業でESGと価値の関係が強まった証拠はなく、不祥事はESGの価値関連性を弱める方向に働いた（抄録）。", "fun": "「ESGに取り組めば株価が上がる」「規制で開示すれば投資家が評価する」とよく言われます。ところが欧米の大企業を10年分調べると、その効果はわずかで、規制のあとも強まりませんでした。期待と実際の差を冷静に測った研究です。", "unverified": "係数の値は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "機関投資家の保有と雇用差別訴訟のリスク", "title": "Institutional Ownership and Corporate Exposure to Equal Employment Opportunity Lawsuits", "url": "https://doi.org/10.1111/corg.70066", "authors": "Chelsea Liu", "venue": "Corporate Governance: An International Review", "date": "2026-10-16", "sjr": 1.992, "citescore": 8.7, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "機関投資家の大口保有が多い企業ほど、雇用機会均等（EEO）の訴訟が少ないことを、2001〜2020年の22,501件の訴訟で示した（抄録）。", "p3": "米連邦裁判所の公民権法第7編の訴訟データで、機関投資家の大口保有との関連を推定し、ラッセル3000指数への採用を操作変数にした分析や変化分析などで頑健性を確かめる。", "p5": "関連は能動・受動、長期・短期の投資家に共通して成り立った。訴訟のあと、最大の投資家は資金を引き揚げ（退出）、短期投資家は議決権行使を強め（発言）、CEOの強制交代が増えた（規律）。低技能の労働環境で役割が大きかった（抄録）。", "fun": "働く人への差別は、会社にとって訴訟という形でお金のリスクになります。株を多く持つ投資家がいる会社ほど訴訟が少なく、訴えられると投資家が株を売ったり、社長が交代させられたりしていました。株主が従業員の扱いを見張る役割も担っていることを示しています。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "危機下のスマートシティを立て直すガバナンス", "title": "Governance innovation for crisis-stricken smart cities: A roadmap to recovery and sustainability", "url": "https://doi.org/10.1177/00208523261497985", "authors": "Alessandro Casali ほか", "venue": "International Review of Administrative Sciences", "date": "2026-10-16", "sjr": 1.163, "citescore": 7.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "財政危機に陥ったイタリアのパルマ市が、協働的なガバナンスと技術でスマートシティに転換し、危機を乗り越えた事例から、行政への道筋を示した（抄録）。", "p3": "パルマの転換の事例研究として、協働的ガバナンスの革新と技術の利用によるスマートサービスの仕組みを分析する。", "p5": "パルマは危機を克服し、2017年以降、年次のICity Rank指数で上位のスマートシティになったとし、効率的で効果的なスマートサービスのモデルを作るための青写真を示した（抄録）。", "fun": "お金がなくて困っている町ほど、新しい技術に投資する余裕はなさそうに思えます。ところがパルマ市は、市民や企業と一緒に仕組みを作り直すことで、危機から抜け出してイタリア有数のスマートシティになりました。技術より、進め方の工夫が鍵だったという事例です。", "unverified": "1都市の事例研究で、他都市への一般化は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "気候に強い都市道路インフラへのスマート技術統合", "title": "Multi-scale integration of smart technologies for climate-resilient urban road infrastructure: a systematic literature review and conceptual framework", "url": "https://doi.org/10.1108/sasbe-06-2025-0350", "authors": "Maryam Khazaee ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-10-16", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "道路・橋梁・舗装・排水などの都市道路インフラの気候レジリエンスを、スマート技術でどう高められるかを体系的文献レビューで整理し、概念枠組みを示した（抄録）。", "p3": "Scopusの1,684件から78の主要研究を選び、VOSviewerによる書誌分析とNVivoによる質的内容分析を行う4段階の体系的レビュー。", "p5": "GIS、BIM、デジタルツイン、IoT、AI、ビッグデータ、リモートセンシングの7つの中核技術を特定し、GISとリモートセンシングが空間・環境データを、IoTセンサが実時間の監視を担う統合したデジタル生態系をなすとした（抄録）。", "fun": "大雨や猛暑で道路や橋が傷む前に手を打つには、さまざまな技術を組み合わせる必要があります。このレビューは、地図、センサ、AI、仮想の双子（デジタルツイン）などが、それぞれどんな役割を分担しているかを地図のように描き出しています。", "unverified": "概念枠組みの詳細は未確認（抄録が途中まで）。"}}, {"id": "jr27", "rank": 27, "headline": "公共サービスの貧困と都市成長：途上国の経済的包摂", "title": "Utility Poverty and Urban Growth: Examining the Implications for Economic Inclusion in Developing Countries", "url": "https://doi.org/10.1002/sd.71787", "authors": "Yafei Zhang ほか", "venue": "Sustainable Development", "date": "2026-10-16", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "途上国74か国（2000〜2023年）のパネルで、エネルギー・デジタル・水の公共サービスの貧困が都市成長と経済的包摂に与える影響を調べた（抄録）。", "p3": "パネル修正標準誤差推定を主に、パネル動学OLSとGMMで頑健性を確かめ、断面依存・不均一分散・内生性に対処する。", "p5": "エネルギーとデジタルの貧困は都市成長に正の効果を持ち、農村の欠乏が電気と通信を求めて世帯を都市に押し出す役割を反映するとした。水の貧困は健康・労働生産性・住みやすさへの影響を通じて都市成長を抑えた（抄録）。", "fun": "電気やネットが足りない地域ほど都市が大きくなる、という一見逆の結果です。農村で電気やネットが使えないから、人が都市に移るのです。一方で水が足りないと都市は育ちにくい。同じ「インフラ不足」でも、種類によって人の動きへの効き方が逆になるのが面白い点です。", "unverified": "係数の値と経済的包摂への含意の詳細は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "価値獲得で交通インフラの維持管理費を賄う", "title": "Strategi Pembiayaan Inovatif untuk Pemeliharaan Infrastruktur Transportasi di Indonesia: Pendekatan Berbasis Value capture", "url": "https://doi.org/10.12962/j26151847.v9i3.9839", "authors": "Rully Andhika Karim ほか", "venue": "Jurnal Manajemen Aset Infrastruktur & Fasilitas", "date": "2026-10-15", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、インドネシア語）を使用", "preprint": false, "short": true, "p1": "インドネシアの交通インフラの維持管理の財源として、官民連携（KPBU）のもとで土地価値の獲得（LVC）と税に代わる支払い（PILOT）を使う戦略を検討した（抄録）。", "p3": "文献調査と関連する事例の分析で、両スキームを地元の状況で適用できるかを評価する。", "p5": "両方の資金調達の仕組みは、インフラ事業が生む経済的価値を最大化し、それを長期の維持管理の財源に回せるとし、維持管理の効率と持続性を高め、国家予算の負担を減らしうると結論した（抄録。定量的な分析は抄録になし）。", "fun": "駅や道路ができると周りの土地の値段が上がります。その値上がり分の一部を、道路を直すお金に回そうというのが「価値の獲得」の考え方です。作るときではなく、守り続けるお金をどう生むかに注目した点が、インフラの老朽化が進む国にとって大事な視点です。", "unverified": "事例の具体名と定量的な評価は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "相補条件を組み込んだPINNで浸潤線を予測", "title": "FB-PINN: A Fischer-Burmeister-enhanced physics-informed neural network for phreatic line prediction in saturated-unsaturated seepage flow", "url": "https://doi.org/10.1139/cgj-2026-0607", "authors": "Xuan-Qi Liu ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-15", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "土堰堤の飽和・不飽和浸透で、未知の浸出面を含む浸潤線を、平滑化したFischer-Burmeister関数を組み込んだPINN（FB-PINN）で格子なしに予測した（抄録）。", "p3": "浸出面が生むSignorini型の非線形相補問題を、平滑化FB関数で1つの滑らかな等式制約に書き換え、別々の罰則項による悪条件な損失と勾配の振動をなくす。混合形のRichards方程式と幹-枝の構造で、圧力水頭・含水率・浸潤線を同時に予測する。", "p5": "水位、堤体形状、成層した異方性材料、粘土コアのゾーン型ダムで検証し、飽和に近い低n領域の強いVG非線形を和らげる局所的な数値カットオフも導入した（抄録。精度の数値は抄録になし）。", "fun": "ダムの土の中を水がどこまで染み込んでいるかの境目（浸潤線）は、どこで水が外ににじみ出るかが前もってわからないため、計算が難しい問題でした。この研究は、「にじみ出るか、出ないか」の二択の条件を1本のなめらかな式にまとめ、AIに学ばせやすくした点が工夫です。", "unverified": "従来手法との精度比較の値は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "個別要素の仮想試験から疲労後の残存強度を推定", "title": "A Bilinear Residual Strength Model for Concrete Subjected to Fatigue Loads Based on Discrete Element Virtual Tests", "url": "https://doi.org/10.1061/jmcee7.mteng-24246", "authors": "Pei Zhang ほか", "venue": "Journal of Materials in Civil Engineering", "date": "2026-10-16", "citescore": 5.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "コンクリートの疲労後の残存強度を予測する2直線モデルを、個別要素法（DEM）の仮想試験のデータだけから作った（抄録）。", "p3": "疲労損傷モデルを入れたDEMの仮想試験を最大応力レベルを変えて行い、繰返し荷重による劣化の進行を捉え、その結果から残存強度の2直線の劣化モデルを立てる。", "p5": "既存のモデルより残存強度の劣化特性を精度よく予測し、結果は一貫して安全側に偏った。残存強度の変化の重要な変曲点も明示できたとする（抄録。数値は抄録になし）。", "fun": "コンクリートは何万回も揺さぶられると少しずつ弱くなります。本物で何度も試すのは大変なので、粒の集まりとしてコンピュータの中で壊してみる「仮想試験」を使いました。強さが急に落ち始める曲がり角が見つかれば、点検のタイミングを決めるのに役立ちます。", "unverified": "実験データとの照合の有無は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "勾配のある橋に吊った送電管路の車両荷重応答", "title": "Modeling and Analysis of Slope-Dependent Response Properties of Gas-Insulated Transmission Line System Under Vehicle-Induced Loads", "url": "https://doi.org/10.3390/eng7100565", "authors": "Haojie Chen ほか", "venue": "Eng", "date": "2026-10-16", "citescore": 4.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "勾配のある橋の下に吊った管路気中送電線（GIL）が、走行車両による橋の振動でどう揺れるかを、勾配を考慮した動的モデルで解析した（抄録）。", "p3": "車両による橋の振動を、GILの外被の支持点に作用する動的な力として等価に表す。導体を空間ティモシェンコはり要素、外被をReissner-Mindlinシェル要素、碍子を3次元の弾性ばねでモデル化し、調和外力のデータで検証する。", "p5": "低次のモードは曲げが支配的で、高次は曲げ-ねじれの連成を示した。車速、車両荷重、碍子の剛性、勾配の影響を調べ、鉛直変位の応答は車両荷重とともに増えることなどを示した（抄録）。", "fun": "橋の下には、電線や水道管など多くの設備がぶら下がっています。車が橋を渡るたびに橋が揺れ、その揺れが設備に伝わります。坂になった橋では、揺れが縦だけでなく斜めの成分も持つので、設備の揺れ方が変わる。その様子を細かな部品ごとにモデル化した研究です。", "unverified": "勾配の影響の具体的な結論は未確認（抄録が途中まで）。"}}, {"id": "jr32", "rank": 32, "headline": "グラフと注意機構で山岳橋の使用性を予測", "title": "Research on the prediction of serviceability of mountain bridges based on the Graph-Guided and Deep Attention Network model", "url": "https://doi.org/10.1007/s42452-026-09340-3", "authors": "Cheng Wang ほか", "venue": "Discover Applied Sciences", "date": "2026-10-15", "citescore": 4.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "山岳橋の構造ヘルスモニタリングのデータから、候補の因果グラフと注意機構を組み合わせた深層学習（CG-AttenDNN）で橋の使用性を予測した（抄録）。", "p3": "PCMCI+でモニタリング変数間の時間遅れ .7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "代表的官僚制の理論を民間の慈善に広げ、米国の地域財団912団体（2012〜2016年）で、指導層の人種的な代表性が有色人種のコミュニティへの助成を増やすかを検証した（抄録）。", "p3": "縦断データで、指導層の人種的な代表性と、有色人種のコミュニティに奉仕する団体への助成の関係を推定し、指導層の裁量と寄付者の統制（とくに寄付者助言基金）による違いを見る。", "p5": "指導層が十分な裁量を持つとき、代表性は有色人種のコミュニティへの助成の増加と対応したが、寄付者の統制が強まると関係は弱まった。裁量が受動的代表と能動的代表を結ぶという理論と整合した（抄録）。", "fun": "組織のトップに多様な人がいれば、お金の配り方も公平になるのでしょうか。答えは「その人が自由に決められるなら」でした。寄付者が使い道を細かく指定するほど、トップの多様性の効果は薄れます。代表を送り込むだけでなく、決める権限も大事だという話です。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "透析クリニックの患者の流れと職務設計", "title": "Dialysis Clinic Patient Flow and Work Design", "url": "https://doi.org/10.1287/msom.2025.0719", "authors": "Vincent Slaugh ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-10-16", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "米国の透析クリニックで、患者の流れと技術者（PCT）の仕事の割り振りを同時に設計し、全体の完了時間を短くし、労働効率を上げる方法を示した（抄録）。", "p3": "技術者と台が空き次第に開始する現行の「プッシュ」方式に対し、開始と終了の作業をずらす「インターレース」方式と、開始担当と終了担当の2人で2倍の台を受け持つ「タンデム」方式を提案し、治療時間一定のもとで完了時間の閉形式を導く。", "p5": "インターレース方式が最短の完了時間を達成し、タンデム方式は労働を減らしうることを示した（抄録。数値は抄録の取得範囲になし）。背景として、米国の透析患者は43.3万人、外来クリニックは約7,600、治療費は年250億ドル超とされる。", "fun": "透析では、治療の始めと終わりに技術者の手作業が集中し、それが重なると現場は大忙しになります。この研究は、作業の順番を少しずらしたり、始め担当と終わり担当に分けたりするだけで、待ち時間と疲労を減らせることを数式で示しました。工場の流れ作業の知恵を病院に生かした例です。", "unverified": "実際のクリニックでの検証結果は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "デジタルな職場ウェルビーイング施策の従業員体験", "title": "Employee experiences of digital workplace well-being programmes: A qualitative meta-synthesis", "url": "https://doi.org/10.5502/ijw.v16i3.5549", "authors": "Louise Cowpertwait ほか", "venue": "International Journal of Wellbeing", "date": "2026-10-16", "sjr": 1.036, "citescore": 4.7, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "デジタルな職場のウェルビーイング施策を従業員がどう経験したかを、29本の文献の質的メタ統合で整理した（抄録）。", "p3": "Scopus、MEDLINE、PsycINFO、ProQuestの検索で29の文献を特定し、テーマを統合する。", "p5": "「価値がある」「使いやすさ」「恥とスティグマ」「文脈的要因」「不十分で逆効果」の5つのテーマが得られ、技術受容モデルの領域と対応した。既存の一次研究の質が低く、方法の厳密さと透明な報告が必要とした（抄録）。", "fun": "会社が用意した心の健康アプリは、ありがたい一方で「使っていると弱い人だと思われそう」という恥ずかしさも生みます。この研究は、そうした本音を集め、良かれと思った施策が逆効果になる場合もあることを示しました。", "unverified": "なし"}}, {"id": "jr47", "rank": 47, "headline": "検索データで米国の人口移動を予測する", "title": "Predicting U.S. migration flows with online search data", "url": "https://doi.org/10.1177/00420980261493801", "authors": "Jaeyong Yoo ほか", "venue": "Urban Studies", "date": "2026-10-16", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "Googleトレンドの検索データが、米国の州間の人口移動の予測を改善するかを検証した（抄録）。", "p3": "内国歳入庁の州間移動の記録と、全50州とワシントンDCのGoogleトレンドのデータ（2004〜2018年）で、一方向の転出と出発地-到着地の双方向の流れの重力型パネルモデルを推定する。", "p5": "移動に関連する検索の強さはその後の移動の流れと関連し、従来の重力モデルの共変量と固定効果を超えて予測性能を改善した。検索データは公式統計を置き換えないが、時宜を得た補完になるとした（抄録）。", "fun": "引っ越しを考える人は、まず移り先の仕事や家賃や学校をネットで検索します。その検索の量を集めれば、実際の引っ越しが統計に出る前に、人の流れを先読みできるかもしれません。人の「下調べ」の跡が、社会の変化の早期警報になるという発想です。", "unverified": "予測の改善の大きさは未確認。"}}, {"id": "jr48", "rank": 48, "headline": "生成AIとAI研修は教員の授業準備を変えるか", "title": "Can AI help teachers? Experimental evidence on the effects of generative AI use and AI training on teachers’ lesson preparation", "url": "https://doi.org/10.1016/j.caeo.2026.100427", "authors": "Philipp Appel ほか", "venue": "Computers and Education Open", "date": "2026-10-15", "sjr": 2.903, "citescore": 16.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、生成AIの利用とAIの研修が教員の授業準備に与える効果を、実験によって検証した研究と読み     "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
