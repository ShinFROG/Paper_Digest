<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

6). Behavioural Convergence Theory: Independent Evidence from Multi-Agent Systems Research, and What Its First Tests Found. https://doi.org/10.2139/ssrn.7615704", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLM多エージェント研究で見つかった同調・権威効果・規範の創発などを、人のサイバーリスク行動の理論（行動収束理論）で読み直し、理論を改訂した（抄録）。", "p3": "既存の人のサイバーリスクモデルの16の行動要因を、明示的な分類基準で多エージェント研究の独立の証拠と照合し、4つの反証可能な予測を立て、姉妹論文の事前固定の実験結果を要約する。", "p5": "証拠は社会的な層で最も強かった。記述的な主張は支持されたが、人への介入がエージェントにも効くという転移の主張は、社会的な層で検証した範囲では成り立たず、理論は測定の枠組みとして位置づけ直された（抄録）。", "fun": "AIの集団にも「周りに合わせる」「偉い人に従う」といった人間そっくりの振る舞いが現れます。では人間向けの対策もAIに効くのか、と確かめたら効かなかった、という点が面白いところです。見た目が同じでも、中で起きている仕組みは別物かもしれないのです。", "unverified": "姉妹論文の実験の詳細（モデルの種類・数値）は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "証拠理論の分類器に反実仮想説明を拡張", "title": "On Counterfactual Explanations for Evidential Classifiers", "url": "https://imt-mines-ales.hal.science/hal-05802420v1", "authors": "Victor F. Lopes de Souza ほか", "venue": "HAL", "date": "2026-10-16", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "HALの抄録を使用（予備的な研究と明記）", "preprint": true, "short": true, "p1": "各クラスへの「信念の量」（質量関数）を出す証拠理論の分類器に、反実仮想説明（どこを変えれば判定が変わるか）を拡張する予備的研究（抄録）。", "p3": "通常の真偽の対照条件をファジィ述語に一般化し、質量関数を集合値の予測に変換してから判定する方法と、質量関数のうえで期待値として直接判定する方法の2つを定義する。", "p5": "合成データでの例示では、期待値に基づく方法のほうが許容される反実仮想の候補が多く得られる一方、簡潔さと解釈しやすさが下がる場合があった（抄録）。", "fun": "AIが「わからない」「AかBのどちらか」と曖昧に答えるとき、どうすれば答えが変わるかを説明するのは難しい問題です。この研究は、白黒ではなく「どのくらいそう言えるか」という度合いで条件を表して、曖昧な答えにも説明を与えようとしています。", "unverified": "合成データの設定や評価の具体的な数値は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "オペレーティングリース開示の不遵守を検出する", "title": "The Determinants and Consequences of Non-Compliance Detected in Operating Lease Disclosures", "url": "https://doi.org/10.2139/ssrn.7620081", "authors": "Christopher Stefan Böhme", "venue": "SSRN", "date": "2026-10-16", "apa": "Böhme, C. S. (2026). The Determinants and Consequences of Non-Compliance Detected in Operating Lease Disclosures. https://doi.org/10.2139/ssrn.7620081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "イタリア企業のIAS 17のもとでのオペレーティングリース契約の開示不遵守を新しい方法で検出し、その要因と、開示されたあとの資本コストの変化を調べた（抄録）。", "p3": "新しい検出の仕組みで不遵守企業を特定し、要因分析と、未開示だったリース債務が明らかになった前後での株主資本コストを対照企業と比べる分析を行う。", "p5": "不遵守は既存の財務レバレッジと正に有意に関連し、Big 4監査人との関連も一部見られた。開示後、不遵守企業の株主資本コストは対照企業に比べ統計的・経済的に有意に低下した（抄録）。", "fun": "隠していた借金のような情報が明らかになると、ふつうは評価が下がりそうです。ところがこの研究では逆に資本コストが下がりました。情報がないとき投資家は最悪を想定して多めに見積もっていた、という解釈で、「わからない」こと自体がコストになると示しています。", "unverified": "検出の仕組みの詳細、標本の規模と期間は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "投資顧問はAI利用とリスクをどう開示しているか", "title": "AI use and Risk Disclosure by Investment Advisers", "url": "https://doi.org/10.2139/ssrn.7616218", "authors": "Samir Chincholikar ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Chincholikar, S., & Chawla, R. (2026). AI use and Risk Disclosure by Investment Advisers. https://doi.org/10.2139/ssrn.7616218", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "米国の投資顧問がForm ADV Part 2AでAI利用とAIのリスクをどう開示しているかを、LLMを測定器として検証しながら大規模に測った（抄録）。", "p3": "16,223社から層別無作為に400社を抽出し、入手できた388冊の説明書をLLMで5分類し、同系統での再現、別系統による180冊の盲検再コード、158件の人手確認で検証した。", "p5": "AI利用の開示は23.7%、AIのリスクの記述は27.6%で、運用資産の最小四分位10.4%から最大四分位43.8%へと上がった。人手コードに対する精度0.76・感度0.81で、定義や重みの違いで推定は9.9〜23.7%と変わった（抄録）。", "fun": "「どれくらいの会社がAIを使っていると書いているか」という単純な問いでも、数え方を変えるだけで答えが約1割から2割強まで動きます。AIで文書を分類するときは、AIを物差しとして扱い、その物差し自体の精度を確かめる必要がある、という教訓が見えてきます。", "unverified": "5分類の定義の詳細と、本文の表は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "曖昧さの下で無形投資の開示はいつ役立つか", "title": "Valuing Intangible Investment Under Ambiguity: When Can Disclosure Help Investors?", "url": "https://doi.org/10.20944/preprints202610.1516.v1", "authors": "Vanya Georgieva ほか", "venue": "Preprints.org", "date": "2026-10-16", "apa": "Georgieva, V., & Atanasova, P. (2026). Valuing Intangible Investment Under Ambiguity: When Can Disclosure Help Investors? https://doi.org/10.20944/preprints202610.1516.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Preprints.org）", "preprint": true, "short": true, "p1": "無形投資の価値評価で、どんな開示が投資家に役立つかを、曖昧さ（確率すら見積もれない不確実性）とリアルオプションの理論から整理した概念的研究（抄録）。", "p3": "経営者だけが知る情報の非対称と、両者が共有する不確実性を区別し、後者をリスクと曖昧さに分け、投資額・期待価値・実績を追う枠組みと5つの命題、数値例を示す。", "p5": "共有された曖昧さのもとでは、最終結果の詳細な予測より、段階・必要資金・継続や中止の条件といった経営者の将来の意思決定の情報のほうが役立ちうると論じ、IAS 38の見直しへの示唆を述べる（抄録）。", "fun": "新薬やソフトの開発のように、成功する確率すら見当がつかない投資があります。そんなとき「いくら儲かるか」の予想より「どうなったらやめるか」の約束を示すほうが投資家に役立つ、という主張です。将来は読めなくても、引き際は決められるという発想が面白い点です。", "unverified": "実証はなく、数値例の内容は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "微分可能なPCA-GPR代理モデルで過渡応答の逆UQ", "title": "A differentiable PCA-GPR surrogate framework for full-transient Bayesian inverse uncertainty quantification of black-box nuclear thermal-hydraulic systems", "url": "https://arxiv.org/abs/2610.20978", "authors": "Zikang Yaoa ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Yaoa, Z., Yeea, E., & Lien, F.-S. (2026). A differentiable PCA-GPR surrogate framework for full-transient Bayesian inverse uncertainty quantification of black-box nuclear thermal-hydraulic systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20978", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高価な原子炉熱流動の過渡シミュレーションを、微分可能な確率的代理モデルに置き換え、時系列全体を使うベイズ逆不確実性評価を実用化した（抄録）。", "p3": "主成分分析で多チャネルの温度・流量の時系列を低次元に圧縮し、ガウス過程回帰で写像を学ぶ（PCA-GPR）。対数事後の自動微分でNUTSなど勾配を使うサンプリングも可能にする。", "p5": "5つの主成分で出力分散の99%超を説明し、正規化RMSEは2%未満。直接計算に比べ尤度評価のコストを約3000分の1にしつつ、事後統計と相関を保った（抄録）。", "fun": "1回の計算に時間がかかるシミュレーションを何万回も回すのは現実的ではありません。そこで、出力の時系列を少数の「型」に分解し、その組み合わせだけを高速に予測する身代わりモデルを作ります。計算を3000倍速くしても結論が変わらない、というのが要点です。", "unverified": "本文を入手できず、検証データの詳細は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "波-粒子分解で定常運動論方程式を陰的に解く", "title": "An implicit multiscale solver for steady kinetic equations based on wave-particle decomposition", "url": "https://arxiv.org/abs/2610.20660", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Liu, C., & Xu, K. (2026). An implicit multiscale solver for steady kinetic equations based on wave-particle decomposition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20660", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "希薄気体から連続体までを扱う定常の運動論方程式を、波と粒子に分解した陰的反復で効率よく解く方法（抄録）。", "p3": "局所的な特性線に沿ってマクスウェル分布だけを集める「波」と、運動論的な残りを運ぶ「粒子」に分け、巨視的な予測と微視的な補正を結ぶ残差に基づく陰的反復を作る。BGK・Shakhovモデルで流束への寄与を導く。", "p5": "衝撃波、内部流、極超音速外部流の1・2次元計算で運動論的な精度を保ちつつ、連続体極限付近で従来の反復法より反復回数と計算時間を大きく減らした（抄録。具体的な倍率は抄録になし）。", "fun": "気体は、分子どうしがほとんどぶつからない薄い状態と、絶えずぶつかる濃い状態とで振る舞いが変わります。両方を1つの方程式で扱うと計算が重くなりますが、「流れとしての部分」と「ばらばらの分子としての部分」に分けて担当させると速く解ける、という発想です。", "unverified": "計算時間の削減の具体的な値は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "ソルバに固定した持ち上げ転送作用素で事象を推論", "title": "SALTO: Solver-Anchored Lifted Transfer Operators for Nonlinear Event Inference", "url": "https://arxiv.org/abs/2610.21049", "authors": "Qi Wang ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wang, Q., & Foster, R. (2026). SALTO: Solver-Anchored Lifted Transfer Operators for Nonlinear Event Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21049", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "有限の大きさの局所的な事象（源）を、まばらなセンサから推定するための、シミュレータに整合するクープマン型の転送作用素の学習法（抄録）。", "p3": "持ち上げた空間で非線形力学を線形の伝播作用素で近似し、その転置で各センサを1回の計算で逆向きに運ぶ。物理状態の動力学をシミュレータの線形化に固定するなど3つの構造制約で、振幅が小さい極限で古典的随伴に一致させる。", "p5": "3つの非線形偏微分方程式系で、有限振幅の源による計測を2〜8%の誤差で予測し（古典的随伴は41〜165%）、反応拡散では2つの相互作用する源の事後分布をソルバの20分の1のコストで再現した（抄録）。", "fun": "どこで何が起きたかを、離れたセンサの記録から逆算するのは推理の問題です。小さな揺れなら直線近似で逆算できますが、大きな揺れでは外れます。この研究は、高い次元に持ち上げると曲がった関係がまっすぐになる、という数学の技を使って大きな揺れにも対応させています。", "unverified": "3つの偏微分方程式系の具体的な名前（反応拡散以外）は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "渦放出とフォノニック表面の流体-構造連成", "title": "Interaction of Sustained Vortex Shedding with a Phononic Subsurface: Effect of Positioning and Resonant Characteristics", "url": "https://arxiv.org/abs/2610.22044", "authors": "Sangwon Park ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Park, S., Ramakrishnan, V., Burgos, A. M., Goza, A., & Matlack, K. H. (2026). Interaction of Sustained Vortex Shedding with a Phononic Subsurface: Effect of Positioning and Resonant Characteristics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22044", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "平板上の剥離流の周期的な渦放出に、フォノニック材料の表面（2原子鎖でモデル化）を埋め込み、位置と共振特性で揚力・抗力の振動を変えられることを示した（抄録）。", "p3": "高精度の埋め込み境界法で強連成の流体-構造連成を計算し、表面の弦方向の位置と、共振変位振幅の成長率という2つのパラメータを変えて極限周期の挙動を調べる。", "p5": "位置によって増幅から強い減衰まで4つの領域に分かれ、平均の揚力・抗力の変化0.5%未満のまま、揚力振動を30%超、抗力振動を50%超減らす配置が見つかった（抄録）。", "fun": "翼や板の後ろには渦が規則正しく生まれ、それが揺れや騒音の原因になります。この研究は板の一部に、特定の振動数でよく揺れる小さなバネの列を仕込み、置き場所を選ぶだけで渦の揺さぶりを半分にできることを示しました。動力のいらない「受け身の制振」です。", "unverified": "レイノルズ数など流れの条件は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "流体弾性フォノニック結晶の波動有限要素解析", "title": "A novel Generalized Bloch Mode Synthesis and the Wave-based Finite Element Method for the analysis of hydroelastic phononic crystals: modeling and experiments", "url": "https://doi.org/10.52843/cassyni.zqry71", "authors": "Vinícius Mauro de Souza Santos", "venue": "MetaMAT 2026", "date": "2026-10-15", "apa": "de Souza Santos, V. M. (2026). A novel Generalized Bloch Mode Synthesis and the Wave-based Finite Element Method for the analysis of hydroelastic phononic crystals: modeling and experiments. https://doi.org/10.52843/cassyni.zqry71", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（講演の要旨）", "preprint": true, "short": true, "p1": "流体と弾性体が連成する周期構造（流体弾性フォノニック結晶）を、波動有限要素法で効率よく解くための、一般化ブロッホモード合成による次数低減を発展させた講演（抄録）。", "p3": "格子の単位セルだけを要素分割する波動有限要素法に、一般化ブロッホモード合成による縮約を組み合わせ、自由度の多い単位セルでも計算を軽くする。", "p5": "提案した枠組みは実験結果と有限要素法の参照解の両方と照合して検証したとする（抄録。数値は抄録になし）。", "fun": "同じ形が繰り返される構造は、ある振動数の波を通さない性質を持ち、振動を防ぐのに使えます。全体を計算すると重いので、1つのブロックだけを詳しく調べて全体を推し量ります。水と弾性体が絡む場合でもその近道が使えるようにした点が新しさです。", "unverified": "講演の要旨のみで、検証の具体的な結果は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "ひずみ速度とピンチングを考慮した鉄筋の構成則", "title": "A Rate-Dependent and Pinching-Sensitive Constitutive Model for Reinforcing Steel", "url": "https://doi.org/10.31224/8534", "authors": "Juan Fernando Velásquez Bedoya", "venue": "engrXiv", "date": "2026-10-15", "apa": "Velásquez Bedoya, J. F. (2026). A Rate-Dependent and Pinching-Sensitive Constitutive Model for Reinforcing Steel. https://doi.org/10.31224/8534", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（博士論文）", "preprint": true, "short": true, "p1": "地震時の鉄筋のひずみ速度依存と、付着すべりによるピンチングを再現する履歴型の構成則SteelDRCVを作り、OpenSeesに実装した博士論文（抄録）。", "p3": "実大振動台試験の円形橋脚と7階建て壁からひずみ速度を特徴づけ、高速引張試験で粘性過応力の項を同定する。準静的応答で履歴・ピンチングの係数を、ガウス過程代理モデルと推移的MCMCによるベイズ推定で残りの係数を推定する。", "p5": "事後分布により、どの係数が動的応答から、どれが準静的段階から情報を得ているかを示した（抄録。具体的な数値は抄録になし）。", "fun": "鉄筋は、ゆっくり引っ張るときと地震のように速く引っ張るときで強さが変わります。ところが多くの計算はこの違いを無視しています。この研究は実物大の揺れの実験から鉄筋の伸びる速さを測り、速さによる強さの増加を式に組み込みました。", "unverified": "本文を入手できず、較正結果の数値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "ベイズで地層と地盤定数を同時推定するGeoMix", "title": "GeoMix: A Bayesian Framework for Stratigraphic and Geotechnical Inference", "url": "https://arxiv.org/abs/2610.21021", "authors": "Bradley Wakefield ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wakefield, B., Bertolacci, M., Gunawan, D., Bransby, F., Watson, P., & Zammit-Mangion, A. (2026). GeoMix: A Bayesian Framework for Stratigraphic and Geotechnical Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21021", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "地震探査の記録と地盤調査を組み合わせ、海底の地層区分と地盤定数を同時にベイズ推定する階層モデルGeoMixを提案した（抄録）。", "p3": "空間的にまとまった地層をPottsマルコフ確率場で表し、地震探査の解釈ラベルを層境界付近で不確かさが大きい観測モデルでつなぐ。地層ごとのガウス過程で地盤定数を表し、グループ化Vecchia近似で大規模な3次元領域に対応する。", "p5": "シミュレーションとオランダのIJmuiden Ver洋上風力サイトへの適用で、既存手法より空間的に一貫した地層推定と、較正がよく正確な堆積物の予測が得られた（抄録。数値は抄録になし）。", "fun": "海の底の地盤は、ボーリングで穴を掘って調べるには広すぎます。そこで安く広く取れる音波の記録と、少ない掘削データを組み合わせます。「この辺りは同じ層が続きやすい」という性質を確率で表すことで、見えない海底の断面を不確かさ付きで描けるのが面白い点です。", "unverified": "精度の具体的な比較値は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "常時微動と多源監視で落石の発生過程を捉える", "title": "Evolution Process and Failure Mechanisms of Rockfalls Revealed by the Integration of Ambient Seismic Noise and Multi-Source Monitoring Data", "url": "https://doi.org/10.5194/egusphere-2026-4180", "authors": "Pan Chen ほか", "venue": "EGUsphere", "date": "2026-10-16", "apa": "Chen, P., Yang, Z., Huang, Z., Pang, B., & Wu, Z. (2026). Evolution Process and Failure Mechanisms of Rockfalls Revealed by the Integration of Ambient Seismic Noise and Multi-Source Monitoring Data. https://doi.org/10.5194/egusphere-2026-4180", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（EGUsphere）", "preprint": true, "short": true, "p1": "2022年瀘定地震で生じた高所の落石斜面を長期観測し、常時微動と水文・力学の多源観測を統合して、降雨による落石の進展と破壊の前兆を捉えた（抄録）。", "p3": "STA/LTA法で落石イベントを検出し、常時微動の干渉法から相対地震波速度変化（dv/v）を取り出して岩盤内部の状態を追い、降雨・水文観測・斜面安定解析と統合する。", "p5": "観測期間に329回の落石を検出して3種類に分類した。落石は降雨と強く関係するが非線形で時間遅れがあり、dv/vは崩壊の約2時間前に有意な異常を示し、崩壊時に約3%急減した（抄録）。", "fun": "岩が落ちる前に「岩の中の固さ」が変わるなら、それを測れば予報できるかもしれません。この研究は、地面の常にある小さな揺れが岩の中を伝わる速さを追い、崩れる約2時間前に変化が現れることを見つけました。耳を当てて岩の悲鳴を聞くような観測です。", "unverified": "本文を入手できず、斜面安定解析の結果は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "豪雨下の石積み擁壁の安定性を縮小模型で検証", "title": "Experimental Assessment of the Stability of Masonry Retaining Walls Under Heavy Rainfall Using Reduced-Scale Models", "url": "https://doi.org/10.53243/ICSMGE2026-894", "authors": "Hicham Cherifi ほか", "venue": "HAL", "date": "2026-10-16", "apa": "Hicham Cherifi, Anne-Sophie Colas, Denis Garnier, & Benjamin Terrade. (2026). Experimental Assessment of the Stability of Masonry Retaining Walls Under Heavy Rainfall Using Reduced-Scale Models. ISSMGE. https://doi.org/10.53243/ICSMGE2026-894", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALの抄録を使用", "preprint": true, "short": true, "p1": "豪雨による水圧で石積み擁壁がどう壊れるかを、小さなレンガで作った縮小模型の実験で調べた（抄録）。", "p3": "35.0×18.5×11.5mmのレンガで作った壁に飽和したHostun砂の盛土を支えさせ、模擬豪雨を与えて、高速カメラと間隙水圧計で変形と破壊を記録し、降伏設計理論で解釈する。", "p5": "破壊モード、荷重-変位の応答を特定し、実験と理論予測を比較した。結果は個別要素法（3DEC）と有限要素法による今後の数値解析に使うとする（抄録。数値は抄録になし）。", "fun": "フランスの道路沿いの擁壁の約6割は石積みです。昔からある丈夫な壁でも、雨水が背後にたまると押し倒す力が急に増えます。この研究は、手のひらに乗る小さなレンガで壁を再現し、雨を降らせて壊れる瞬間を高速カメラで撮るという、実験の工夫が面白い点です。", "unverified": "破壊モードの具体的な種類と理論との一致度は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "仕事の裁量はリモートワーカーを守るか", "title": "Does job control protect remote and hybrid workers? Work stress and work-related well-being in digitally mediated work in Indonesia and Malaysia", "url": "https://doi.org/10.2139/ssrn.7619819", "authors": "Vitradesie Noekent ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Noekent, V., Wulansari, N. A., Mat Radzi, R., Ranihusna, D., Putri, V. W., Ridloah, S., & Yaacob, Z. (2026). Does job control protect remote and hybrid workers? Work stress and work-related well-being in digitally mediated work in Indonesia and Malaysia. https://doi.org/10.2139/ssrn.7619819", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "インドネシアとマレーシアのリモート・ハイブリッドの労働者550人で、仕事の裁量がストレスを和らげるという要求度-コントロール-個人モデルを検証した（抄録）。", "p3": "横断調査（インドネシア283人、マレーシア267人）をPLS-SEMと多母集団分析で分析し、個人の要素にeワークの自己効力感を、境界条件に勤務形態と国を置く。", "p5": "ストレスは仕事の要求度とともに増えたが（β=0.66）、裁量とは無関係だった。裁量はどちらの国でもwell-beingと正に関係したが、ストレスの緩和効果はなく、ストレスは媒介しなかった（抄録）。", "fun": "「自由に働けるようにすればストレスは減る」と考えがちです。ところがこの調査では、裁量は満足感を上げても、ストレスそのものは減らしませんでした。ストレスを減らすには、自由を足すより仕事の量を減らすほうが確実だという、当たり前のようで見落とされがちな結論です。", "unverified": "横断調査のため因果は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "生成AIで書くと職場の文章自己効力感はどうなるか", "title": "Writing with AI: The Impact of Generative AI on Workplace Writing Self-efficacy", "url": "https://doi.org/10.2139/ssrn.7619756", "authors": "Minnie Yuan ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Yuan, M., & Molnar, A. (2026). Writing with AI: The Impact of Generative AI on Workplace Writing Self-efficacy. https://doi.org/10.2139/ssrn.7619756", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "生成AIに手伝ってもらって文章を書くと、職場での文章の自己効力感が下がるのかを、2つの実験で調べた（抄録）。", "p3": "バンデューラの社会的認知理論に基づき、生成AIあり・なしで同じ課題をさせ、自己効力感、成果の原因帰属、統制感を測る（実験1はN=128、実験2は若い標本でN=227）。", "p5": "生成AIの利用は成果の原因を外に帰属させ統制感を下げたが、自己効力感はほとんど変わらなかった（実験1の差は小さく結論は出ず）。帰属の変化と自己効力感の評価が切り離されていた（抄録）。", "fun": "AIに手伝ってもらった文章がうまくいくと、「自分の力ではない」と感じるはずです。実際に人はそう感じたのに、「自分は文章が書ける」という自信は下がりませんでした。手柄の持ち主と自信がずれるという、理論の予想を裏切る結果が面白い点です。", "unverified": "課題の内容と効果量の値は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "自分のデジタルツインに報酬を：シャプレー配分", "title": "Paying Workers for Their Digital Twins: Portable Royalties and Shapley Attribution", "url": "https://doi.org/10.2139/ssrn.7610846", "authors": "José Parra Moyano", "venue": "SSRN", "date": "2026-10-16", "apa": "Parra Moyano, J. (2026). Paying Workers for Their Digital Twins: Portable Royalties and Shapley Attribution. https://doi.org/10.2139/ssrn.7610846", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "従業員が自分を置き換えうるAI（デジタルツイン）を訓練するとき、どんな報酬設計なら努力を引き出せるかを理論モデルで示した（抄録）。", "p3": "チームで働くデジタルツインの価値への線形のロイヤルティを分析し、固定給、在職中だけのロイヤルティ、退職後も持ち運べるロイヤルティと退職金の組み合わせを比べ、シャプレー値による配分も検討する。", "p5": "固定給では置き換えられうるツインへの努力が減る。在職中だけの支払いは努力を上げるが高くつく。最適な割合の持ち運べるロイヤルティは、努力と期待利得を置き換えリスクから独立にし、企業にも好まれる（抄録）。", "fun": "自分の仕事を奪うかもしれないAIを、自分で一生懸命育てたいとは思いにくいですよね。この研究は、辞めた後もAIの稼ぎの一部を受け取れる「印税」の仕組みにすれば、置き換えの不安と関係なく努力できると示しました。作家の印税のような発想です。", "unverified": "モデルの仮定と最適な割合の値は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "上司の否定的感情表出が部下の主体的行動を抑える", "title": "The Impact of Leader Negative Emotional Displays on Employee Taking Charge Behavior: The Chain Mediating Roles of Work Stress and Threat Perception", "url": "https://doi.org/10.21203/rs.3.rs-10598773/v1", "authors": "Jin Wan ほか", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Wan, J., Zhou, W., Zhu, D., Zhang, Y., & Wang, J. (2026). The Impact of Leader Negative Emotional Displays on Employee Taking Charge Behavior: The Chain Mediating Roles of Work Stress and Threat Perception. https://doi.org/10.21203/rs.3.rs-10598773/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "上司が否定的な感情を表すと、部下の主体的な改善行動（テイキング・チャージ）は減るのか増えるのかを、2時点の上司-部下データで調べた（抄録）。", "p3": "感情の社会的情報モデルと制御理論に基づき、58人の上司と283人の部下の対データを構造方程式モデルで分析し、脅威の知覚と仕事のストレスを媒介に置く。", "p5": "否定的な感情表出は直接には主体的行動を下げたが、脅威の知覚とストレス（単独と連鎖）を通じては上げる経路もあり、全体としては負の効果だった（抄録）。", "fun": "上司が怒ると部下は萎縮しますが、一方で「このままではまずい」と動き出す人もいます。この研究は、その両方の道が同時にあり、差し引きでは萎縮のほうが勝つことを示しました。叱ることの「もろ刃の剣」を数字で分けて見せた点が面白いところです。", "unverified": "効果量の値と測定項目は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "在宅勤務と幸福感を結ぶ仕事と家庭の両立", "title": "Working from home and work-related well-being: The role of work-family balance", "url": "https://doi.org/10.21203/rs.3.rs-10778445/v1", "authors": "Fabrizio Méndez-Rivero ほか", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Méndez-Rivero, F., & Querejeta, M. (2026). Working from home and work-related well-being: The role of work-family balance. https://doi.org/10.21203/rs.3.rs-10778445/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "ドイツ、スペイン、スイス、オランダの約4,400人の2024年のデータで、在宅勤務と燃え尽き・ワークエンゲイジメント、仕事と家庭の両立の関係を男女別に調べた（抄録）。", "p3": "調和されたミクロデータで在宅勤務への自己選択を確かめ、燃え尽きとエンゲイジメントとの関連を推定し、分解法で仕事と家庭の両立の媒介の大きさを評価する。", "p5": "男性では在宅勤務が燃え尽きの高さと関連し（とくに父親）、エンゲイジメントの向上はなかった。女性では疲弊が減り、夫婦とも在宅の世帯でエンゲイジメントが大きく増え、両立が関連の重要な部分を説明した（抄録）。", "fun": "同じ在宅勤務でも、男性と女性で効き方が逆になるという結果です。女性は家庭との両立がしやすくなって元気になり、男性、とくに父親はかえって疲れていました。働き方の効果は、家の中で誰が何を担っているかによって変わることを示しています。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "職場の曖昧さと自閉・知的障害のある労働者の支援技術", "title": "Workplace Ambiguity and Technology Support for Autistic and IDD Workers", "url": "https://arxiv.org/abs/2610.21236", "authors": "Silas Curry ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Curry, S., Singh, R., Jung, H., Hwang, A. H.-C., Yang, F., Zhong, C., Lindgren, N., Chen, C., Li, L., & Ma, R. (2026). Workplace Ambiguity and Technology Support for Autistic and IDD Workers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21236", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "期待や手順が言葉にされない職場の曖昧さが、自閉症や知的・発達障害のある労働者の障壁になる仕組みを、介護者への面接で整理し、支援技術を考えた（抄録）。", "p3": "介護者11人に面接し、最後にAIとの共同デザインの活動を行う。曖昧さの5つのテーマを、評価・手順・関係の3次元の枠組みにまとめる。", "p5": "参加者は、その場での行動の修正、フィードバックの処理、生理的な合図による支援という3つの技術を提案した。一方、職場を読みやすくする技術が、労働者を雇用主に過度に見えるようにする監視の緊張も指摘した（抄録）。", "fun": "「空気を読む」ことを当然とする職場は、それが苦手な人には見えない壁になります。AIで暗黙のルールを見えるようにすれば助けになりますが、同時に本人の行動が上司に筒抜けになる危険もあります。助ける技術が監視の技術にもなる、という二面性が考えどころです。", "unverified": "対象者が介護者11人のみで、当事者の声は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "AIへの態度尺度の日本語短縮版と英国との測定不変性", "title": "The Short General Attitudes Towards Artificial Intelligence Scale in Japan: Psychometric Validation and Exploratory Measurement Invariance with the Original UK Sample", "url": "https://doi.org/10.31234/osf.io/fjdn6_v3", "authors": "Yu Kanno ほか", "venue": "PsyArXiv", "date": "2026-10-15", "apa": "Kanno, Y., & Kagawa, R. (2026). The Short General Attitudes Towards Artificial Intelligence Scale in Japan: Psychometric Validation and Exploratory Measurement Invariance with the Original UK Sample. https://doi.org/10.31234/osf.io/fjdn6_v3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "AIへの一般的な態度を測る10項目の短縮尺度を日本語に訳し（GAAIS-10-J）、日本の成人468人で検証し、英国の原版との測定不変性を探索した（抄録）。", "p3": "確認的因子分析で肯定・否定の2因子構造を確かめ、1か月後の再検査（N=429）、有用性・使いやすさを超える利用意図の説明力、英国標本（N=500）との不変性を調べる。", "p5": "2因子構造は部分的に支持され、内的一貫性と時間的安定性は良好だった。閾値・計量の不変性はおおむね成り立ったが完全な尺度不変性はなく、部分尺度不変性のもとで日本は肯定の平均が高く否定が低かった（抄録）。", "fun": "同じ質問でも、言葉や文化が違うと「同じものを測っている」とは限りません。日本人と英国人のAIへの態度を比べるには、まず物差しがそろっているかを確かめる必要があります。この研究は、物差しが一部ずれていることを示し、単純な国際比較の危うさを教えてくれます。", "unverified": "適合度指標の具体的な値は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "老親への子の責任をイランの内容分析で捉える", "title": "Filial Responsibility Toward Older Parents: A Conventional Content Analysis Study in Iran", "url": "https://doi.org/10.21203/rs.3.rs-10999999/v1", "authors": "Leila Tagharrobi ほか", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Tagharrobi, L., Tagharrobi, Z., Delbari, A., Khaji, A., momtaz, Y. A., & Zanjari, N. (2026). Filial Responsibility Toward Older Parents: A Conventional Content Analysis Study in Iran. https://doi.org/10.21203/rs.3.rs-10999999/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "イランで、老親に対する子の責任（孝の責任）がどんな内容から成るかを、成人した子と老親25人への面接の内容分析で明らかにした（抄録）。", "p3": "2024年6〜12月に最大変化の目的抽出で選んだ25人に半構造化面接を行い、飽和まで集め、GranheimとLundmanの方法で慣習的内容分析を行う。", "p5": "1,571のコードを15の下位カテゴリと5つの主カテゴリ（心理・情緒的、身体的、社会的、霊的、間接的な責任）にまとめた。社会的な責任には社会的包摂の後押しや交流・付き添いが含まれた（抄録）。", "fun": "親の世話というと食事や介護を思い浮かべますが、この研究では、親の尊厳を守ることや、亡くなった後も祈り続けることまで「子の責任」に含まれていました。ケアの中身は文化や宗教で大きく変わり、目に見えない部分が多いことを教えてくれます。", "unverified": "質的研究のため一般化の範囲は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "住民の声から健康格差を読み解く（オックスフォード州）", "title": "Understanding Health Inequalities Through Community Voice: A Qualitative Synthesis of Community Insight Profiles in Oxfordshire", "url": "https://doi.org/10.21203/rs.3.rs-11011394/v1", "authors": "Chiko Ncube ほか", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Ncube, C., Austin, K., Howell, K., Hyslop, J., & Brett, J. (2026). Understanding Health Inequalities Through Community Voice: A Qualitative Synthesis of Community Insight Profiles in Oxfordshire. https://doi.org/10.21203/rs.3.rs-11011394/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "豊かとされる英国オックスフォードシャーで、住民の声と地域データを組み合わせた12の地域インサイト報告を統合し、健康格差の要因と地域の資源を整理した（抄録）。", "p3": "公開されている12の報告を反省的テーマ分析で文書分析し、貧困、心の健康、医療へのアクセス、食料不安、住宅、安全、社会的排除、地域資源などの領域で抽出し、住民代表を含む関係者と検討した。", "p5": "診療所・歯科・心の健康支援へのアクセスの壁、「隠れた孤立」を含む社会的孤立、生活費と食料不安、住宅、交通と建築環境、若者支援の不足が繰り返し現れ、地域の団体や互助、公園などの資源も記録された（抄録）。", "fun": "平均では豊かな地域でも、特定の地区には困りごとが集まっています。この研究は、統計だけでなく住民の話を報告書に組み込み、「誰にも気づかれない孤立」のような数字に出にくい問題を拾い上げました。困りごとと同時に、地域にある助けの力も記録している点が特徴です。", "unverified": "12報告の地域の内訳は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "配車アプリの変動価格の公正感と顧客ロイヤルティ", "title": "Algorithmic Dynamic Pricing Fairness and Customer Loyalty toward Uber in Bangladesh: An AI-Era Perspective", "url": "https://doi.org/10.2139/ssrn.7614601", "authors": "Arifa Shapla ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Shapla, A., & Mannan, P. D. K. A. (2026). Algorithmic Dynamic Pricing Fairness and Customer Loyalty toward Uber in Bangladesh: An AI-Era Perspective. https://doi.org/10.2139/ssrn.7614601", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "バングラデシュのUber利用者385人の調査で、変動価格の公正感が満足を通じてロイヤルティにつながるかを検証した（抄録）。", "p3": "公平理論に基づき、価格の公正感・公平/価値・満足・ロイヤルティを各3項目の5段階尺度で測り、合成得点の標準化回帰と5,000回のブートストラップで構造モデルを推定する（授業用の調査データを使用と明記）。", "p5": "公正感は公平/価値（β=0.377）、満足（β=0.163）、ロイヤルティ（β=0.114）を正に予測し、満足はロイヤルティを強く予測して（β=0.416）、公正感とロイヤルティの関係を媒介した（間接効果0.072）（抄録）。", "fun": "雨の日に配車アプリの料金が跳ね上がると、「ずるい」と感じる人がいます。この調査では、料金が公正だと感じる人ほど満足し、また使い続けることが示されました。値段の高さそのものより、納得できる値段かどうかが客をつなぎとめるという話です。", "unverified": "授業課題のデータで、標本の代表性は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "LLMのウェルビーイング介入推薦は心理プロフィールに反応する", "title": "LLM-Generated Well-being Intervention Recommendations Are Sensitive to Psychological Profiles: A Proof-of-Concept Expert-Rating Study", "url": "https://doi.org/10.31234/osf.io/y3k8a_v3", "authors": "Benjamin Kaveladze ほか", "venue": "PsyArXiv", "date": "2026-10-15", "apa": "Kaveladze, B., Lampe, E. W., Heinz, M. V., Marsch, L., Campbell, A. T., & Jacobson, N. C. (2026). LLM-Generated Well-being Intervention Recommendations Are Sensitive to Psychological Profiles: A Proof-of-Concept Expert-Rating Study. https://doi.org/10.31234/osf.io/y3k8a_v3", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "LLMが利用者の心理プロフィールに合わせてウェルビーイング介入（チャットボットの対話）を推薦できるかを、専門家の評定で確かめた概念実証（抄録）。", "p3": "14の心理尺度を持つ学生178人のプロフィールに、4つのLLMが222の対話から10個を推薦し、2人の専門家が適切さを1〜10で評定する。半数は本人向け、残りは別人向けの推薦を見せる。", "p5": "本人向けの推薦（平均6.74）は別人向け（5.64）より適切と評価された（SMD=0.50）。ただし評定者間信頼性は低く（ICC=0.22）、どのLLMも候補一覧の並び順に強く影響された（抄録）。", "fun": "AIに「この人に合うアドバイスを選んで」と頼むと、本当にその人に合わせているのでしょうか。確かめるため、別人用に選んだものと比べて専門家に採点させる工夫をしています。合わせる力はあるものの、候補の並び順にも左右されるという弱点も見つかりました。", "unverified": "利用者のウェルビーイングが実際に改善するかは未検証。"}}, {"id": "pr42", "rank": 42, "headline": "同じ症状でも属性が変わるとAIの医療助言が変わる", "title": "Same Symptoms, Different Patients? Demographic Bias in AI-Generated Medical Advice", "url": "https://doi.org/10.2139/ssrn.7616179", "authors": "Anurag Chatterjee", "venue": "SSRN", "date": "2026-10-15", "apa": "Chatterjee, A. (2026). Same Symptoms, Different Patients? Demographic Bias in AI-Generated Medical Advice. https://doi.org/10.2139/ssrn.7616179", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "臨床情報を同じにして患者の人種・性別・年齢・社会経済的地位だけを変えたとき、医療LLMの助言が変わるかについての文献を統合し、評価の枠組みを示した（抄録）。", "p3": "医療アルゴリズムの偏りと医療LLMの新しい証拠を批判的に統合し、臨床解釈、リスク評価、診断の推奨、管理、説明の5つの観点からなる臨床一貫性の枠組みで整理する。", "p5": "属性の手がかりは、心の健康の評価、検査、侵襲的処置、緊急度などで出力を変えうる。一方で属性が臨床的に意味を持つ場合もあり、違いが即差別とは言えないため、反実仮想・交差的なテストと臨床的レビューが必要だと論じる（抄録）。", "fun": "症状がまったく同じなのに、患者の性別や人種を変えるとAIの答えが変わるなら問題です。ただ、病気によっては性別や年齢で正しい対応が違うこともあります。「変わること」と「不当に変わること」を区別する物差しを作ろうとしている点が考えどころです。", "unverified": "文献統合で、新しい実験データはない。"}}, {"id": "pr43", "rank": 43, "headline": "戦時下で建設したアフガニスタン基盤信託基金の教訓", "title": "Building under Fire: The Afghanistan Infrastructure Trust Fund and Lessons for Multilateral Development Banks in Wartime", "url": "https://doi.org/10.2139/ssrn.7618702", "authors": "Joseph Mik", "venue": "SSRN", "date": "2026-10-16", "apa": "Mik, J. (2026). Building under Fire: The Afghanistan Infrastructure Trust Fund and Lessons for Multilateral Development Banks in Wartime. https://doi.org/10.2139/ssrn.7618702", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "紛争が激化する中でアジア開発銀行が運営したアフガニスタン基盤信託基金（2010〜2021年）を事例に、戦時のインフラ融資の課題を整理した（抄録）。", "p3": "著者の2017年の独立評価を再検討し、事業ごとの差異分析、ポートフォリオ内の比較、他の2つの信託基金との比較、国際比較を用いる。因果識別ではなく理論に基づく枠組みとして示す。", "p5": "平時の実務と戦時の条件の間に、時間・制度・知識・言説の4つのずれを見いだし、それが工程の遅延、費用の増大、審査の更新不足、援助国間の摩擦を「治安」や「能力不足」より説得的に説明するとした（抄録）。", "fun": "道路や送電線は平和になってから作るのがふつうですが、アフガニスタンでは戦争が続く中で作りました。失敗の原因を「危ないから」で片づけず、時間の感覚や情報の集め方が平時のままだったことにある、と分解した点が面白いところです。ウクライナ復興にもつながる話です。", "unverified": "著者自身の過去の評価に基づくため、独立性は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "観光の快適性と持続可能な都市発展の協調（中国38都市）", "title": "Tourism comfort and sustainable urban development in 38 Chinese tourist cities: coupling coordination, spatial spillovers, and key drivers", "url": "https://doi.org/10.21203/rs.3.rs-10961386/v1", "authors": "Xiaoying Wu ほか", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Wu, X., Li, H., Hu, B., & Zhang, C. (2026). Tourism comfort and sustainable urban development in 38 Chinese tourist cities: coupling coordination, spatial spillovers, and key drivers. https://doi.org/10.21203/rs.3.rs-10961386/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "中国の人気観光都市38市（2000〜2023年）で、観光の快適性と持続可能な都市発展の協調の度合いと、その空間的な波及・要因を調べた（抄録）。", "p3": "総合評価の指標を作り、カップリング協調モデル、カーネル密度推定、大域的モランI、空間ダービンモデルを使う。", "p5": "両方とも改善し、協調度は軽い不調和から辛うじて協調へ移った。東部・沿岸が西部・内陸を上回り、交通アクセスが最も強い正の要因で、間接効果が直接効果を上回った。観光への過度の経済依存は負の効果を持った（抄録）。", "fun": "観光客が増えれば町が豊かになりそうですが、観光に頼りすぎると町の持続性はかえって下がるという「観光依存の逆説」が見つかりました。一方で、交通の便が良いことは周りの町にまで良い影響を広げていました。町は単独ではなく、つながりの中で育つことを示しています。", "unverified": "指標の構成と係数の値は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "予測と意思決定を一体で学ぶ公共交通経路推薦", "title": "A Prediction-Decision Collaborative Optimization Framework for Personalized Public Transit Path Recommendation", "url": "https://doi.org/10.2139/ssrn.7620253", "authors": "Pei Tong ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Tong, P., Yang, K., Wang, Y., & Yan, Y. (2026). A Prediction-Decision Collaborative Optimization Framework for Personalized Public Transit Path Recommendation. https://doi.org/10.2139/ssrn.7620253", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "公共交通の経路推薦で、予測誤差ではなく推薦の質を直接最適化する「予測と意思決定の協調最適化」を、北京の大規模な乗車データで示した（抄録）。", "p3": "乗車連鎖データから因子分析で潜在的な好みを取り出し、深層効用モデルで好み・経路・状況の相互作用を学び、微分可能な木のアンサンブル予測器を意思決定に基づく損失（Smart Predict-then-Optimize）で最適化する。", "p5": "費用・効率・総合的な兼ね合い・便利さの4因子が分散の84.14%を説明した。効用モデルの選択正答率は74.05%で多項ロジットを2.81〜5.08ポイント上回り、提案法は所要時間の予測精度が低いにもかかわらず平均後悔を4.88〜6.02%減らした（抄録）。", "fun": "所要時間をぴったり当てる予測が、良い道案内になるとは限りません。この研究は予測の正確さではなく「最終的に良い経路を選べたか」で学習させ、予測は少し外れても選択は良くなることを示しました。目的に合わせて学ばせ方を変える、という発想の転換です。", "unverified": "データの期間と規模は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "接着接合部に光ファイバを埋めてひずみ検出を改善", "title": "Regulated Fiber Incorporation for Improved Strain Detection in Bonded Connections", "url": "https://doi.org/10.2139/ssrn.7620015", "authors": "Chen Li", "venue": "SSRN", "date": "2026-10-16", "apa": "Li, C. (2026). Regulated Fiber Incorporation for Improved Strain Detection in Bonded Connections. https://doi.org/10.2139/ssrn.7620015", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "接着接合部の接着層に光ファイバセンサを組み込む2つの方法を比べ、制御された組み込みでひずみ計測の信頼性が上がることを示した（抄録）。", "p3": "レイリー後方散乱の変化からファイバ沿いのひずみ・温度を測る光ファイバセンサを、単重ね引張せん断試験片の接着層に2通りの方法で組み込み、ファイバの向き・位置とひずみ信号の信頼性・精度で評価する。", "p5": "ファイバの組み込みを制御すると、ひずみの検出が改善し、接着接合部のより正確な構造ヘルスモニタリングが可能になるとした（抄録。数値は抄録になし）。", "fun": "髪の毛ほどの光ファイバを接着剤の中に埋め込むと、どこがどれだけ伸びたかを線に沿って測れます。ただ、ファイバが少し斜めになるだけで測定値がずれてしまいます。地味ですが、センサを「まっすぐ正しく埋める方法」が精度を左右するという、計測の基本に迫る研究です。", "unverified": "2つの方法の具体的な違いと精度の数値は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "行動の一貫性をグラフで測りLLMエージェントの不確実性を評価", "title": "GraphACM: Graph-based Action Consistency Measurement for Uncertainty Quantification in LLM Agents", "url": "https://arxiv.org/abs/2610.22031", "authors": "Yaxin Ma ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Ma, Y., Zhang, W., Pothapragada, S. K., & Zare, A. (2026). GraphACM: Graph-based Action Consistency Measurement for Uncertainty Quantification in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22031", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "同じ課題をLLMエージェントに何度も実行させ、同じ状態での行動の一致度をグラフで測ることで、成功・失敗を予測する不確実性の指標を作った（抄録）。", "p3": "複数回の実行で等価な状態を統合した有向・行動ラベル付きのグラフを作り、共通の意思決定状態で行動を比べる。ノード単位と全体の一致度を定義し、全体の一致度を不確実性の代理として使う。", "p5": "3つのLLMでALFWorld、AppWorld、WebShopを試し、課題成功の予測でAUROC平均0.811となり、最強の行動一致の基準（0.729）や言語化された自信（0.769）を上回った（抄録）。", "fun": "AIに同じ仕事を何回かやらせて、毎回同じ場面で同じ行動を取るなら自信があり、ばらばらなら迷っている、と考えます。この研究は、その迷いが「どの場面で」起きるかまで地図のように示します。AIの自己申告の自信より、行動のぶれのほうが当てになるのが面白い点です。", "unverified": "なし"}}], "pre_notable":
