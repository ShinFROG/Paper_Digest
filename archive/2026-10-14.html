<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

aly Klinberg ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-13", "apa": "Klinberg, V., & Nikiforov, V. (2026). Association of AI Assistant Anthropomorphism with Occupational Burnout and Self-Efficacy Among Adult Workers: A Cross-Sectional Study. Zenodo. https://doi.org/10.5281/ZENODO.23327512", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（OpenAlex登録）を使用", "preprint": true, "short": true, "p1": "AIアシスタントを人間らしく感じる人ほど、AIを使う自信が高い傾向があることを示した横断調査（抄録）。", "p3": "AIを日常的に使う就業者661人のオンライン調査で、擬人化の知覚（Godspeed尺度）、AI利用の自己効力感（AISES）、職業的自己効力感（OSS）、燃え尽き（OLBI：疲弊と離脱）の関係を相関と回帰で調べた。", "p5": "擬人化はAI利用の自己効力感と弱く正に相関した（r=0.148）が、疲弊・離脱とは有意な相関がなかった。統制後の係数はβ=0.070（p=0.082）で、擬人化とAI利用経験の交互作用は有意だった（b=0.114）（抄録）。", "fun": "AIに『人っぽさ』を感じるかどうかで、人の働き方の感じ方が変わるのかを調べた研究です。人っぽく感じる人はAIを使いこなす自信が少し高いものの、疲れや仕事からの心の離れとは関係が見られませんでした。しかもその関係は、AIを使ってきた経験の長さによって変わります。", "unverified": "交互作用の向き（経験が長いほど強いのか）の詳細は抄録だけでは未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AI時代の孤独は所属と承認のずれ", "title": "Loneliness in the Age of AI and Digitally Mediated Relationships: The Affiliation–Affirmation Gap (Preprint)", "url": "https://doi.org/10.2196/preprints.114105", "authors": "Emma L. van der Schyff ほか", "venue": "JMIR Preprints", "date": "2026-10-13", "apa": "van der Schyff, E. L., & Campbell, A. J. (2026). Loneliness in the Age of AI and Digitally Mediated Relationships: The Affiliation–Affirmation Gap (Preprint). https://doi.org/10.2196/preprints.114105", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "デジタルやAIでつながっていても孤独になる理由を、「所属」と「承認」のずれとして説明する理論的論考（抄録）。", "p3": "自己肯定理論、社会的アイデンティティ理論、社会関係資本理論、社会的浸透理論を組み合わせ、ネットワーク上の所属（affiliation）と、自分らしさを認められる承認（affirmation）を区別する概念枠組みを提案した。実証データはない。", "p5": "SNSやAIの話し相手は所属を増やす一方で承認を弱めがちだとし、孤独を『交流がないこと』ではなく『本物の承認的なつながりがないこと』として捉え直すことを提案した（抄録）。", "fun": "友達リストが何百人いても寂しいことがあるのはなぜか、という身近な疑問に答えようとする論考です。『どこかに属している』感覚と『自分という人間を認めてもらえる』感覚は別物で、デジタルの世界は前者ばかりを増やしやすい、という見立てが面白い点です。", "unverified": "実証的な検証は含まれない理論的論考で、概念の測定方法は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "スマホ回答者のウェブ調査離脱と学歴の偏り", "title": "Who stops answering? Breakoff, smartphone use and educational bias in a web survey", "url": "https://doi.org/10.31235/osf.io/p2c59_v2", "authors": "Alžbeta Ľudmová ほか", "venue": "SocArXiv", "date": "2026-10-13", "apa": "Ľudmová, A., Kreidl, M., Hubatková, B., & Lakomý, M. (2026). Who stops answering? Breakoff, smartphone use and educational bias in a web survey. https://doi.org/10.31235/osf.io/p2c59_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ウェブ調査の途中離脱が学歴による偏りを強め、それがスマートフォンの小さな画面で特に大きいことを示した（抄録）。", "p3": "チェコの世代とジェンダー調査（2020〜2022年、5,468人、途中離脱244人）のウェブ回答とパラデータを使い、118の質問項目を時間の単位としてCox回帰とカプランマイヤー曲線で離脱を分析した。", "p5": "学歴が最も低い層の離脱は7%、最も高い層は3%だった。スマホ利用者では離脱率が高学歴4%から低学歴11%超まで上がり、大きな画面では3〜4%で平らだった（抄録）。", "fun": "アンケートを最後まで答えずにやめてしまう『途中離脱』を、病気の生存時間分析と同じ道具で調べたのが面白い点です。小さなスマホ画面では学歴による差が大きく開き、集まったデータが特定の人々に偏ってしまう仕組みが見えてきます。", "unverified": "なし"}}, {"id": "pr20", "rank": 20, "headline": "共感するAIは顧客の信頼を高めるか", "title": "Retailing with Empathetic AI: Examining the Effects of Emotional Intelligence Capabilities on Consumer Trust and Relationship Quality", "url": "https://doi.org/10.2139/ssrn.7602635", "authors": "Mary Johnson", "venue": "SSRN", "date": "2026-10-12", "apa": "Johnson, M. (2026). Retailing with Empathetic AI: Examining the Effects of Emotional Intelligence Capabilities on Consumer Trust and Relationship Quality. https://doi.org/10.2139/ssrn.7602635", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "感情を読み取って応じる小売のAIが、消費者の信頼と関係の質を高めることを示した調査研究（抄録）。", "p3": "英国のオンライン小売の消費者700人のパネル調査を、構造方程式モデリング（SEM）、多母集団の調整分析、ブートストラップの媒介分析で分析した。", "p5": "AIの感情知能が信頼に正の効果（β=0.412）を持ち、信頼が関係の質（β=0.456）と購買意図（β=0.378）を高めた。共感的な応答が信頼への効果を完全に媒介し、擬人化が関係の強さを調整した（抄録）。", "fun": "店のAIが『あなたの気持ちを分かっていますよ』と応じると、人はその店を信頼するのか、という問いです。結果では、共感的に応じることが信頼につながる経路の中心でした。機械の『思いやり』が本物でなくても効くのかを考えると、少し不思議な研究です。", "unverified": "AIの感情知能を回答者の知覚で測ったのか、実際の機能で操作したのかは抄録だけでは未確認。"}}, {"id": "pr21", "rank": 21, "headline": "構成概念のないエージェント評価ベンチマーク批判", "title": "Benchmarking Without Constructs: A Measurement Theory Critique of MCP Evaluation Frameworks", "url": "https://doi.org/10.2139/ssrn.7597219", "authors": "Himaneesh Sompalle", "venue": "SSRN", "date": "2026-10-12", "apa": "Sompalle, H. (2026). Benchmarking Without Constructs: A Measurement Theory Critique of MCP Evaluation Frameworks. https://doi.org/10.2139/ssrn.7597219", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "LLMエージェントの道具利用を測るMCPベンチマークが、測るべき構成概念を定義しないまま乱立していると指摘した論考（抄録）。", "p3": "古典的測定理論の観点から、MCP-Bench、MCP-Universe、MCPMarkなど3つのベンチマークを構成概念妥当性・評価の信頼性・再現性の軸で分析した。", "p5": "心理測定学の初期と同じく『測る対象の合意より先に道具が作られている』測定の危機にあるとし、構成概念の明示的な操作化、多特性の妥当性検証、学際的な合意形成を提案した（抄録）。", "fun": "『AIの道具を使う力』を測るテストがたくさん作られていますが、そもそも『道具を使う力』とは何かが決まっていない、という指摘です。100年前の心理学が知能テストで通った道を、AI評価がもう一度たどっているという見方が面白い点です。", "unverified": "各ベンチマークの具体的な問題点の詳細は抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "粘弾性を入れた不飽和土中空洞の間隙水圧", "title": "Influence of Kelvin-Voigt Viscoelasticity on Transient Pore Pressure Response of Cylindrical Cavities in Unsaturated Soil", "url": "https://doi.org/10.21203/rs.3.rs-11177446/v1", "authors": "Xiong Hao", "venue": "Research Square (In Review)", "date": "2026-10-13", "apa": "Hao, X. (2026). Influence of Kelvin-Voigt Viscoelasticity on Transient Pore Pressure Response of Cylindrical Cavities in Unsaturated Soil. https://doi.org/10.21203/rs.3.rs-11177446/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録、途中で切れている）を使用", "preprint": true, "short": true, "p1": "不飽和土中の円筒空洞の過渡的な間隙水圧応答の解析解を、土の骨格の粘弾性（ケルビン・フォークト型）を含むよう拡張した（抄録）。", "p3": "弾性・粘弾性の対応原理により、ラプラス領域でラメ定数を時間依存の形に置き換えるだけで、ヘルムホルツ分解とベッセル関数の解の構造、境界条件をそのまま使えるようにした。逆ラプラス変換はDen Iseger法で数値的に行う。", "p5": "未確認（取得できた抄録が途中で切れており、結果の記述を確認できず）。", "fun": "粘土のように『ゆっくり変形する』土の性質を入れるのに、式を一から解き直さなくても済む、というのが面白い点です。ばねにダンパーを並べたモデルは、周波数の世界では『ばねの硬さが周波数で変わる』と見なせるので、既存の解をそのまま使い回せます。", "unverified": "抄録が途中で切れており、数値結果と粘性の影響の大きさは未確認。"}}, {"id": "pr23", "rank": 23, "headline": "凍上を多孔質力学で連成解析", "title": "Numerical investigation of frost heave in soils: a poromechanic approachs", "url": "https://doi.org/10.2139/ssrn.7606738", "authors": "Jinfeng Li ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Li, J., Dangla, P., Shan, F., Pereira, J.-M., Wang, Y., & Teng, J. (2026). Numerical investigation of frost heave in soils: a poromechanic approachs. https://doi.org/10.2139/ssrn.7606738", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多孔質力学にもとづく熱・水・力学の連成モデルで、土の凍上が2段階で進むことを示した（抄録）。", "p3": "凍結面の進行に伴う間隙水の移動、凍結吸引（クライオサクション）、局所的な応力の再配分を連成して解き、境界条件、初期含水量、材料特性、冷却履歴、試料形状のパラメータ解析を行った。", "p5": "凍上は、凍結吸引と凍結圧による初期の収縮段階と、凍結面での水の流れのピークに伴う凍上段階に分かれた。凍結パラメータが支配的で、ヤング率とポアソン比が大きいと凍上は抑えられた（抄録）。", "fun": "冬に道路や地面が持ち上がる『凍上』は、水が凍って膨らむだけでは説明できません。凍る場所に周りから水が吸い寄せられ、氷の層（アイスレンズ）が育つからです。この研究は、まず縮んでから膨らむという2段階の過程をモデルで再現しました。", "unverified": "モデルの実験による検証の有無と、数値的な大きさは抄録では未確認。"}}, {"id": "pr24", "rank": 24, "headline": "飛行試験の衝撃・乱流による運用モード解析", "title": "Dornier Seastar CD2 – Flutter Flight Test – Impulse and Turbulence Based OMA Using FFT, Nyquist, PSD and SVD", "url": "https://doi.org/10.5281/zenodo.23304259", "authors": "Graf ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Graf, A., & Vollan, A. (2026). Dornier Seastar CD2 – Flutter Flight Test – Impulse and Turbulence Based OMA Using FFT, Nyquist, PSD and SVD. Zenodo. https://doi.org/10.5281/ZENODO.23304259", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの短い抄録を使用", "preprint": true, "short": true, "p1": "小型水上機のフラッター飛行試験で、衝撃と乱流を入力とする運用モード解析（OMA）の方法を開発した報告（抄録）。", "p3": "衝撃入力ではFFT、ラプラス変換、2次元・3次元のナイキスト線図に周波数領域分解（FDD）を加え、乱流入力ではパワースペクトル密度（PSD）と特異値分解（SVD）でモードを同定する。", "p5": "未確認（抄録は手法の説明のみで、同定結果の記載なし）。", "fun": "飛行機の翼が空気の力で激しく揺れ始める『フラッター』は危険なので、試験飛行で振動の性質を調べます。入力を測らなくても、たたいた揺れや乱気流での揺れだけから固有の揺れ方を取り出す、という点で、橋を通る車の揺れから橋の性質を探る考え方と通じています。", "unverified": "同定された振動数・減衰などの結果は抄録になく未確認。審査のない置き場の文書。"}}, {"id": "pr25", "rank": 25, "headline": "南アの旧鉱業都市にみるスマートシティの矛盾", "title": "The Smart City in South Africa: The Conflicts of a Developmental Transformation and Urban Optimisation The Smart City and Urban Optimisation", "url": "https://doi.org/10.21203/rs.3.rs-11013951/v1", "authors": "kentse Sesele", "venue": "Research Square (In Review)", "date": "2026-10-13", "apa": "Sesele, k. (2026). The Smart City in South Africa: The Conflicts of a Developmental Transformation and Urban Optimisation The Smart City and Urban Optimisation. https://doi.org/10.21203/rs.3.rs-11013951/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "南アフリカの旧金鉱業都市を例に、スマートシティ化が地域の発展能力に制約されることを示した事例研究（抄録）。", "p3": "開発国家論と批判的スマート都市論を結び、マチャベン市の自治体・財政・インフラ・社会経済の長期データから、生産的雇用、財政動員、サービス提供、制度の正統性の4つの地域能力を検討した。", "p5": "生産基盤の縮小、財政動員の弱体化、サービスインフラの劣化、統治の問題が、技術の吸収とデジタル参加を制約していた。スマート技術は『地域的に中立な都市』に入るわけではないと結論づけた（抄録）。", "fun": "『最新技術を入れれば街は賢くなる』という考えに、待ったをかける研究です。鉱山が閉じて税収や雇用が減った街では、技術を支える土台そのものが弱っています。技術の効果は、それが置かれる街の歴史に左右されるという視点が面白い点です。", "unverified": "用いた指標と期間の詳細は抄録では未確認。"}}, {"id": "pr26", "rank": 26, "headline": "待ち行列を考えた自動運転車のエコドライブ", "title": "A Queue-Aware Multi-Agent Eco-Driving Model for Connected and Automated Vehicles at a Signalized Intersection in Mixed Traffic", "url": "https://doi.org/10.20944/preprints202610.0988.v1", "authors": "Wenming Rao ほか", "venue": "Preprints.org", "date": "2026-10-13", "apa": "Rao, W., Zhou, Z., An, C., & Chen, D. (2026). A Queue-Aware Multi-Agent Eco-Driving Model for Connected and Automated Vehicles at a Signalized Intersection in Mixed Traffic. https://doi.org/10.20944/preprints202610.0988.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "信号交差点の待ち行列を考慮した強化学習の自動運転車エコドライブで、混在交通のCO2を減らせることを示した（抄録）。", "p3": "待ち行列の解消を考えた実効青時間の推定と、自車と後続車の排出を合わせた報酬を、近接方策最適化（PPO）の制御器に組み込み、SUMOで交通量と自動運転車の普及率を変えて評価した。", "p5": "多くの条件でCO2が減り、普及率が高いほど削減率が増えた。1200台/時では普及率10%から70%で削減率が7.0%から25.6%に上がった。アブレーションで2つの工夫の両方が寄与した（抄録）。", "fun": "青信号でも前に車が並んでいればすぐには進めません。この当たり前の事実を入れるだけで、自動運転車の『省エネ運転』が賢くなります。しかも自分の車だけでなく後ろの車の排出も報酬に入れることで、周りを巻き込んで全体の排出を減らす点が面白いところです。", "unverified": "人間運転車のモデル化の仕方と交差点の条件の詳細は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "全予算事業を事後検証する機関の制度設計", "title": "決算検証院構想 —— 事後的効果検証機関の制度設計", "url": "https://doi.org/10.5281/zenodo.23339910", "authors": "とまと", "venue": "Zenodo", "date": "2026-10-13", "apa": "とまと. (2026). 決算検証院構想 —— 事後的効果検証機関の制度設計 (Version v1.0). Zenodo. https://doi.org/10.5281/ZENODO.23339910", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの日本語抄録を使用", "preprint": true, "short": true, "p1": "日本の予算事業を独立に事後検証する機関として、国会に置く「決算検証院」を提案した制度設計の論考（抄録）。", "p3": "会計検査院の有効性検査、政策評価法の政策評価、行政事業レビューの3系統を比べ、独立性・網羅性・予算への接続を同時に満たす主体がないことを示したうえで、制度案を組み立てた。", "p5": "原則として全予算事業を、削減前の供給能力評価と執行後の効果検証の2軸で毎年度評価し、継続・縮小・廃止を非拘束で勧告する。退ける場合は理由の公開を義務づけ、支出IDで資金を追跡する（抄録）。", "fun": "税金の使い道が『本当に効いたのか』を誰がチェックするのかという問いです。すでに3つの仕組みがあるのに、どれも『政府から独立』『全部の事業』『予算に反映』を同時には満たさない、という整理が分かりやすい点です。勧告に強制力を持たせない代わりに、無視するなら理由を公開させる工夫も面白いところです。", "unverified": "審査のない置き場の文書で、実現可能性の検討の深さは未確認。"}}, {"id": "pr28", "rank": 28, "headline": "先端AIモデルの監査人は誰であるべきか", "title": "Who May Audit a Frontier Model? Independence, Jurisdiction and the Assurance Profession", "url": "https://doi.org/10.2139/ssrn.7592858", "authors": "Thomas Serval", "venue": "SSRN", "date": "2026-10-13", "apa": "Serval, T. (2026). Who May Audit a Frontier Model? Independence, Jurisdiction and the Assurance Profession. https://doi.org/10.2139/ssrn.7592858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "先端AIモデルの外部監査人は誰であるべきかを、財務監査の独立性の基準から論じた論考（抄録）。", "p3": "非財務の保証業務の国際基準（ISAE 3000改訂版）、独立性の倫理規程（IESBA）、公的監督の制度（PCAOBなど）を手がかりに、財務監査の前例から監査人の要件を導いた。", "p5": "AI安全系の非営利評価団体も大手コンサルティング網も独立性の要件を満たさないと論じ、6つの適格基準を導いた。監査対象とは別の法域に置く監査人を中心に据え、国際的な独立監査人の団体を提案した（抄録）。", "fun": "AIの安全性を『外部の監査人』が確かめるとして、その監査人を誰にするかは意外と難しい問題です。この論考は、会社の決算をチェックする会計監査が長年かけて作ってきた『独立性』のルールを、そのままAIに当てはめようとしています。古い制度の知恵を新しい技術に生かす発想が面白い点です。", "unverified": "抄録にある政策的な合意（2026年9月29日）の内容は原文の主張のまま記載し、外部では未確認。"}}, {"id": "pr29", "rank": 29, "headline": "診療室の建築イメージが燃え尽きを左右する", "title": "The \"therapeutic space\" as a strategic professional resource: architectural imagery's impact on efficacy and burnout in mental healthcare", "url": "https://doi.org/10.5281/zenodo.23324616", "authors": "Gorbenko ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Gorbenko, S., Khokhlina, O., Omelchenko, Y., Vlasenko, S., Lazos, G., & Ichanska, O. (2026). The \"therapeutic space\" as a strategic professional resource: architectural imagery's impact on efficacy and burnout in mental healthcare. Zenodo. https://doi.org/10.5281/ZENODO.23324616", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "診療室の建築のタイプが、精神保健の専門職の効力感と燃え尽きリスクの評価を大きく左右することを示した（抄録）。", "p3": "精神保健の専門職150人に、4種類の診療室（ミニマリスト、バイオフィリック、クラシック、カオス）の3D画像を順序を入れ替えて評価させる被験者内の準実験を行い、ビッグファイブ性格と合わせて反復測定分散分析と相関で分析した。", "p5": "植物など自然を取り入れたバイオフィリックな部屋で快適さ（6.21）と効力感（6.05）が最も高く、燃え尽きリスク（1.87）が最も低かった。散らかった部屋は燃え尽きリスク5.98で、神経症傾向（r=0.58）と誠実性（r=0.62）が苦痛を強めた（抄録）。", "fun": "働く部屋の見た目だけで、仕事の自信や疲れの感じ方がここまで変わるのか、という結果です。緑のある部屋が良く散らかった部屋が悪いのは直感どおりですが、まじめな人ほど散らかった部屋でつらく感じる点は意外です。ただし実際に働いたのではなく、画像を見た評価である点に注意が要ります。", "unverified": "画像評価による準実験で、実際の職場での効果は未確認。審査のない置き場の文書。"}}, {"id": "pr30", "rank": 30, "headline": "職場に持ち込まれるエコ不安と従業員エンゲージメント", "title": "When Climate Concern Comes to Work: Eco-Anxiety and Employee Engagement", "url": "https://doi.org/10.2139/ssrn.7600478", "authors": "Laurianne Le Chalony ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Le Chalony, L., & Harkiolakis, N. (2026). When Climate Concern Comes to Work: Eco-Anxiety and Employee Engagement. https://doi.org/10.2139/ssrn.7600478", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "気候変動への不安（エコ不安）が強くても、仕事へのエンゲージメントは高いままでありうることを示した混合研究（抄録）。", "p3": "民間企業の従業員182人の量的データと10人のインタビューを順に組み合わせる説明的混合法で、エコ不安と職場の（非）エンゲージメントの枠組み（EWD）を作り、改良した。", "p5": "強いエコ不安と高いエンゲージメントは両立しえた。心理社会的・組織的の2次元は同時に入れるとどちらもエンゲージメントを単独で予測しなかった。インタビューでは主体性、意味、価値の一致、組織の真正性が仕組みとして浮かんだ（抄録）。", "fun": "『地球の未来が心配で仕事に身が入らない』とは限らない、という結果です。会社の取り組みが本物だと感じられ、自分も何かできると思えれば、不安を抱えながらも仕事に打ち込める。不安そのものより、それを受け止める職場の資源が大事だという見方が面白い点です。", "unverified": "エンゲージメントの測定尺度と回帰の数値は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "成長機会と報酬は看護職の燃え尽きの別次元に効く", "title": "Differential associations of professional growth and compensation with exhaustion and disengagement among nursing staff in U.S. health centers: A cross-sectional study", "url": "https://doi.org/10.2139/ssrn.7590056", "authors": "Xiao Li ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Li, X., Park, J. M., Zhu, J., & Young-Rock, H. (2026). Differential associations of professional growth and compensation with exhaustion and disengagement among nursing staff in U.S. health centers: A cross-sectional study. https://doi.org/10.2139/ssrn.7590056", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "看護職の燃え尽きの2つの次元に、成長の機会と報酬がそれぞれ別々に効くことを示した横断研究（抄録）。", "p3": "米国の公的支援を受けた医療センターの従業員well-being調査から看護職5,652人を分析した。因子分析で疲弊と離脱の2次元を確かめ、頑健標準誤差の重回帰と潜在プロファイル分析で職場の資源との関係を調べた。", "p5": "成長の機会は離脱の低さと関連した（β=-0.247）が疲弊とは関連しなかった。報酬・福利厚生は疲弊の低さと関連した（β=-0.048）が離脱とは関連しなかった。両者の交互作用は有意でなかった（抄録）。", "fun": "『燃え尽き』は1つのものではなく、『くたくたに疲れる』ことと『仕事に気持ちが向かなくなる』ことの2つに分かれます。この研究では、給料は前者に、成長の機会は後者に効くという分業が見えました。対策を考えるときに、どちらの燃え尽きなのかを見分ける意味が分かります。", "unverified": "なし"}}, {"id": "pr32", "rank": 32, "headline": "施設で育つ若者にとってのメンターの意味", "title": "Mentorship as a Bridge: Significant Adults and the Future Self of Adolescents in Institutional Care", "url": "https://doi.org/10.2139/ssrn.7589349", "authors": "Maria Kozlova ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Kozlova, M., Iakimova, O., & Madfes, O. (2026). Mentorship as a Bridge: Significant Adults and the Future Self of Adolescents in Institutional Care. https://doi.org/10.2139/ssrn.7589349", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "親の養育を受けずに施設で育つ若者にとって、ボランティアのメンターが『今の自分』と『なりたい自分』をつなぐ存在であることを示した（抄録）。", "p3": "ロシアの家庭養育支援センターで暮らしメンタリングに参加する14〜17歳の33人に、半構造化面接、投影法、修正版の意味微分法を用い、Wilcoxon検定、並べ替え検定、多次元尺度構成法などで分析した。", "p5": "大人との関係は『実際に会えること』と『象徴的な近さ』の2次元で4つの位置に分かれた。未来の自分は今の自分より自立的・自信がある方向に評価され、未来の自分に最も近いのは『幸せな人』とメンターだった（抄録）。", "fun": "子どもにとって大切な大人は、肩書きで決まるのではない、という結果です。長く付き合い、自分から来てくれて、対等で、施設の外でも会える人が大切になる。メンターは『今の話し相手』であると同時に『将来の見本』でもある、という二重の役割が面白い点です。", "unverified": "標本が33人と小さく、一般化の範囲は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "生成AIは人間関係をどう変えるか：統合的レビュー", "title": "Social Relationships in the Age of Artificial Intelligence: Profound Shifts and New Challenges—An Integrative Literature Review", "url": "https://doi.org/10.20944/preprints202610.1164.v1", "authors": "Safran Safar Almakaty", "venue": "Preprints.org", "date": "2026-10-13", "apa": "Almakaty, S. S. (2026). Social Relationships in the Age of Artificial Intelligence: Profound Shifts and New Challenges—An Integrative Literature Review. https://doi.org/10.20944/preprints202610.1164.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "会話AIはその場の孤独を和らげても、人を長く支える関係の蓄積は作れないことを、文献の統合レビューで論じた（抄録）。", "p3": "関係科学、人と機械のコミュニケーション研究、調査、実験、縦断パネル、無作為化試験、メタ分析を2026年9月まで統合し、アラブ社会の知見も含めて『応答性と互恵性の橋』モデルを提案した。", "p5": "若者の少なくない割合が悲しいときにチャットボットを使い、短期的には人と話すのと同程度に孤独が減る。一方、無作為化実験では支援的なチャットボットより人間の仲間が上回り、交友目的の集中的な利用は孤独の増加と関連した（抄録）。", "fun": "AIと話すと寂しさが和らぐのは『ちゃんと聞いてもらえた』と感じるからです。でも友情には、お互いに必要とし合うこと、犠牲を払うこと、一緒に過ごした歴史が要ります。AIは人とのつながりへの『橋』にはなれても『代わり』にはなれない、という整理が分かりやすい点です。", "unverified": "統合した研究の数と選び方は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "繰り返す洪水で住民のリスク認知はどう変わるか", "title": "Flood risk perception and behavioural responses in conditions of repeated floods: evidence from Bagnacavallo (Ravenna, Italy)", "url": "https://doi.org/10.21203/rs.3.rs-10812202/v1", "authors": "Alexandra D'Angelo ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "D’Angelo, A., Marcon, L., Gil-Gallen, S., Petitta, M., & Andrighetto, G. (2026). Flood risk perception and behavioural responses in conditions of repeated floods: evidence from Bagnacavallo (Ravenna, Italy). https://doi.org/10.21203/rs.3.rs-10812202/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "洪水が繰り返し起きる町で、住民のリスク認知と協力行動がどう変わるかを調べた事例研究（抄録）。", "p3": "2023年以降に洪水が繰り返したイタリアのバニャカヴァッロで、3回のフォーカスグループと100人の調査を行い、リスク認知の変化と、対人協力・気候対策行動への影響を調べた。", "p5": "繰り返す災害は一時的な衝撃ではなく長期の社会的ストレスとして働き、協力、対立、制度への不信が絡み合う形で集団の行動とリスク認知を作り変えていた（抄録）。", "fun": "『めったにない災害』が『よくある災害』に変わったとき、地域のつながりは強くなるのか弱くなるのか、という問いです。助け合いが生まれる一方で、対立や行政への不信も生まれるという複雑な姿が見えてきます。気候変動の時代に多くの地域が直面しうる問題です。", "unverified": "調査の具体的な数値結果は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "無人の自動運転バスで乗客を誰が支えるか", "title": "Passenger Support in Autonomous Public Transport: A Systematic Review of Protection, Assistance, and Service Continuity", "url": "https://doi.org/10.2139/ssrn.7603081", "authors": "Shayan Khanmohammadidoustani ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Khanmohammadidoustani, S., Mohammadi, A., Sriraj, P. S., & Yigitcanlar, T. (2026). Passenger Support in Autonomous Public Transport: A Systematic Review of Protection, Assistance, and Service Continuity. https://doi.org/10.2139/ssrn.7603081", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "乗務員のいない自動運転バスで乗客をどう守り助けるかについて、研究の証拠と空白を整理した系統的レビュー（抄録）。", "p3": "Scopus、Web of Science、ProQuestを2026年9月に検索し、63本の論文を、問題の認識、助けの要請、連絡と優先度判定、支援の提供、解決の確認という5つの支援機能に分けて統合した。", "p5": "支援を扱う49本のうち35本は主に乗客のニーズや知覚に関するもので、緊急度の判定は2本、解決の確認も2本だけだった。乗務員なしの通常運行で支援の提供とその結果の両方を記録した研究はなかった（抄録）。", "fun": "運転手がいないバスで、具合が悪くなった人や困った人を誰がどう助けるのか。技術の部品はそろいつつあっても、『助けを求めてから解決するまで』をつなげて確かめた研究はまだない、という指摘です。自動化で消える人の役割の大きさが見えてきます。", "unverified": "なし"}}, {"id": "pr36", "rank": 36, "headline": "新しい店の出店は近隣店の需要を増やすか", "title": "Like a Good Neighbor? Demand Spillovers from Recreational Cannabis Dispensary Openings to Nearby Retail Establishments", "url": "https://doi.org/10.2139/ssrn.7603219", "authors": "Ecem Basak ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Basak, E., Sanatizadeh, A., & Hong, K. (2026). Like a Good Neighbor? Demand Spillovers from Recreational Cannabis Dispensary Openings to Nearby Retail Establishments. https://doi.org/10.2139/ssrn.7603219", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "大麻販売店の出店が、近隣の店の客数と売上を増やすことを示した（抄録）。", "p3": "イリノイ州の2021〜2024年の段階的な出店を使い、行政の店舗記録と近隣の事業所の月次の客数・取引・売上を組み合わせて、差の差分析を行った。", "p5": "出店で近隣の客数は約6.82%、取引は8.01%、売上は7.47%増えた。増加は来店客の増加によるもので、客1人あたりの売上は変わらなかった。飲食と生活必需品の店、チェーン店、歩きやすい地区で効果が大きかった（抄録）。", "fun": "新しい店ができると周りの店は客を奪われるのか、それとも人通りが増えて得をするのか。この研究では後者でした。しかも得をするのはチェーン店で個人店ではないという結果は、人の流れが増えても、それを受け止める側の準備で恩恵が変わることを示しています。", "unverified": "なし"}}, {"id": "pr37", "rank": 37, "headline": "同族中小企業のAI導入意図と組織の準備度", "title": "Digital Entrepreneurial Orientation and AI Adoption Intention in Family SMEs: The Mediating Role of Organizational AI Readiness", "url": "https://doi.org/10.2139/ssrn.7600860", "authors": "Masoud Abdollahi Mousavi", "venue": "SSRN", "date": "2026-10-13", "apa": "Abdollahi Mousavi, M. (2026). Digital Entrepreneurial Orientation and AI Adoption Intention in Family SMEs: The Mediating Role of Organizational AI Readiness. https://doi.org/10.2139/ssrn.7600860", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "同族の中小企業でデジタル志向がAI導入意図につながるのは、組織のAI準備度を通じてであることを示した調査研究（抄録）。", "p3": "イランの同族中小企業274社の横断調査をPLS-SEMで分析し、デジタル起業家志向、組織のAI準備度（経営・人材・技術とデータ・資源とプロセス）、AI導入意図の関係と、家族の経営関与の調整効果を調べた。", "p5": "志向は準備度と正に関連し（β=0.53）、準備度は意図と正に関連した（β=0.42）。準備度は関係の約44%を媒介し（間接効果0.22）、媒介は人材と技術・データの準備度が担った。家族の関与による調整は見られなかった（抄録）。", "fun": "『AIを使いたい』という社長の気持ちだけでは導入は進まず、人とデータの準備がその橋渡しをする、という結果です。著者自身が事前登録なしの横断調査であることを明記し、結果を『関連』にとどめている点も誠実です。", "unverified": "なし"}}, {"id": "pr38", "rank": 38, "headline": "粗視化CFD-DEMで流動層ガス化を予測", "title": "PREDICTIVE MODELING OF COAL GASIFICATION IN FLUIDIZED BEDS: A COARSE-GRAINED CFD-DEM APPROACH VALIDATED AT PILOT SCALE", "url": "https://doi.org/10.2139/ssrn.7606985", "authors": "Subi Nath ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Nath, S., & Roy, S. (2026). PREDICTIVE MODELING OF COAL GASIFICATION IN FLUIDIZED BEDS: A COARSE-GRAINED CFD-DEM APPROACH VALIDATED AT PILOT SCALE. https://doi.org/10.2139/ssrn.7606985", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "流動層での石炭ガス化を、反応を含む粗視化粒子法（MP-PIC）で予測し、パイロット規模の実験で検証した（抄録）。", "p3": "気泡流動層ガス化炉の流体力学に、揮発分の放出、チャーの不均一反応、気相反応を結合したMP-PICモデルを作り、灰分の多い石炭の複数の運転条件のパイロット実験と比べた。酸素と水蒸気の流量でパラメータ解析を行った。", "p5": "合成ガスの組成と軸方向の温度分布の予測は実験とおおむね一致した。入口の酸素と水蒸気の流量が合成ガスの収率と組成を強く左右した（抄録）。", "fun": "流動層の中では無数の粒子がぶつかり合いながら燃えたり反応したりします。1粒ずつ計算すると重すぎるので、似た粒子をまとめて『代表粒子』として扱うことで、実機に近い規模でも計算できるようにしています。", "unverified": "一致の程度の数値は抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "コンフォーマル予測で非破壊検査の異常検知に不確実性", "title": "Unsupervised Defect Detection across NDT Modalities: A Conformal Anomaly DetectionFramework to quantify uncertainty in decision making", "url": "https://doi.org/10.2139/ssrn.7602427", "authors": "Ahmed HAMDI ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "HAMDI, A., ESTERMANN, F., Kaftandjian, V., DELACHARTRE, P., & GUY, P. (2026). Unsupervised Defect Detection across NDT Modalities: A Conformal Anomaly DetectionFramework to quantify uncertainty in decision making. https://doi.org/10.2139/ssrn.7602427", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "欠陥のないデータだけで学習する異常検知に、コンフォーマル予測でp値を付け、非破壊検査の判断に不確実性を示せるようにした（抄録）。", "p3": "変分オートエンコーダの再構成残差と、凍結したDINOv2の特徴のメモリーバンクという2つの異常スコアを、共通のコンフォーマル異常検知の枠組みでp値に変換し、X線CT、レール表面、超音波溶接、振動スペクトログラムの4つのデータで評価した。", "p5": "特徴ベースの方法が4つ中3つのデータで最良のF1を示し、X線CTでは再構成ベースが優位だった。超音波ではF1=0.94、振動信号ではVAEでF1=0.85に達した（抄録）。", "fun": "『壊れた例』をほとんど集められない検査で、正常な例だけから『いつもと違う』を見つける方法です。さらに『どれくらい珍しいか』を確率（p値）で示すので、判断の自信の度合いが分かります。", "unverified": "なし"}}, {"id": "pr40", "rank": 40, "headline": "思考連鎖プロンプトの戦略比較", "title": "Does More Deliberation Help? A Comparative Evaluation of Chain-of-Thought Prompting Strategies for Grade-School Math Reasoning in Open-Source Instruction-Tuned Language Models", "url": "https://doi.org/10.21203/rs.3.rs-11327774/v1", "authors": "Arun Kumar", "venue": "Research Square (In Review)", "date": "2026-10-13", "apa": "Kumar, A. (2026). Does More Deliberation Help? A Comparative Evaluation of Chain-of-Thought Prompting Strategies for Grade-School Math Reasoning in Open-Source Instruction-Tuned Language Models. https://doi.org/10.21203/rs.3.rs-11327774/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録、途中で切れている）を使用", "preprint": true, "short": true, "p1": "小型のオープンLLMで、思考連鎖（CoT）プロンプトの4つの方法の効果を統制して比べた（抄録）。", "p3": "Mistral-7B、Phi-3-mini、Llama-3-8Bの3モデルで、ゼロショットCoT、少数例CoT、自己整合性、思考の木（ToT）を、GSM8Kの100問で比べ、95%信頼区間とMcNemarの正確検定で差を検定した。", "p5": "3モデルとも、少数例CoTと自己整合性がゼロショットCoTを有意に上回り、正答率の差は12〜40ポイントだった（抄録）。ToTの結果は抄録が途中で切れており未確認。", "fun": "大きなAIで効くとされる『考え方の手順を示す』工夫が、手元で動く小さなAIでも効くのかを確かめた研究です。例を見せてから解かせる方法や、何度か解かせて多数決をとる方法がよく効きました。", "unverified": "抄録が途中で切れており、思考の木（ToT）の結果と問題数100の制約の影響は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "気候移行リスクを入れた構造型信用リスクモデル", "title": "Integrating Climate Transition Risk into Structural Credit Risk Models: A Dynamic Merton Framework with Stochastic Volatility", "url": "https://doi.org/10.2139/ssrn.7596720", "authors": "Henry Mayambu", "venue": "SSRN", "date": "2026-10-12", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "マートンの構造型信用リスクモデルに、気候移行ショックと確率的ボラティリティを加えた（抄録）。", "p3": "炭素価格、規制上の罰則、消費者の選好の変化が、炭素集約的な企業の資産価値のドリフトとボラティリティを変えるように定式化し、模擬した貸借対照表と市場パラメータで炭素税の経路とデフォルト確率・信用スプレッドを評価した。", "p5": "標準的なマートンモデルは、排出強度の高い企業の中長期のデフォルトリスクを大きく過小評価した。Pythonの実装も提供する（抄録）。", "fun": "会社の価値が借金を下回ったら倒産、と考えるのがマートンモデルです。そこに『将来の炭素税で会社の価値の伸びが削られる』効果を入れると、炭素を多く出す企業の倒産確率がもっと高く見積もられます。模擬データでの検証である点は差し引いて読む必要があります。", "unverified": "模擬データでの評価で、実データでの検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "生成AIは選ぶ段階より探す段階で使え", "title": "Too Late to Prune: Generative AI, the Screen, and Team Creative Decisions", "url": "https://doi.org/10.2139/ssrn.7592800", "authors": "Difang Huang ほか", "venue": "SSRN", "date": "2026-10-13", "why": "148チームの事前登録実験で、同じ時間のAI利用でも選別段階に回すと創造的成果が下がることを示した。"}, {"id": "pn02", "rank": 2, "field": "組織行動・心理的安全性", "headline": "部下をAIに替えるとリーダーが働かなくなる", "title": "The Hidden Value of Human Followers", "url": "https://econpapers.repec.org/RePEc:zbw:esprep:344041", "authors": "Hattori, Keisuke", "venue": "RePEc NEP", "date": "2026-10-12", "why": "人間の部下がリーダーの努力を観察し   ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
