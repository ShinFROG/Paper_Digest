y as pathways to subjective well-being", "url": "https://doi.org/10.1016/j.trd.2026.105689", "authors": "Luis A. Guzmán ほか", "venue": "Transportation Research Part D Transport and Environment", "date": "2026-10-12", "sjr": 2.032, "citescore": 13.6, "citescore_year": "2025", "apa": "Guzman, L. A., Gonzalez, D., Cantillo-Garcia, V. A., Moncada, C., & Sarmiento, O. L. (2027). The indirect city: transport, environment, and perceived livability as pathways to subjective well-being. Transportation Research Part D: Transport and Environment, 162, 105689. https://doi.org/10.1016/j.trd.2026.105689", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr12", "rank": 12, "headline": "自治体窓口のベンチ要望から高齢者の空間的公正", "title": "A bench is just a bench: A spatial justice analysis of older adults’ needs based on municipal hotline data", "url": "https://doi.org/10.1177/00420980261492905", "authors": "Rinat Ben Noon ほか", "venue": "Urban Studies", "date": "2026-10-13", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Ben Noon, R., & Ayalon, L. (2026). A bench is just a bench: A spatial justice analysis of older adults’ needs based on municipal hotline data. Urban Studies. https://doi.org/10.1177/00420980261492905", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr13", "rank": 13, "headline": "地価税は環境と成長の対立を解く", "title": "Land Value Tax Enables Green Growth", "url": "https://doi.org/10.23941/ejpe.v19i1.1038", "authors": "Paul Forrester", "venue": "Erasmus Journal for Philosophy and Economics", "date": "2026-10-13", "citescore": 0.8, "citescore_year": "2025", "apa": "Forrester, P. (2026). Land Value Tax Enables Green Growth. Erasmus Journal for Philosophy and Economics, 19(1). https://doi.org/10.23941/ejpe.v19i1.1038", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr14", "rank": 14, "headline": "地震時の表層崩壊分布から表土厚を逆推定", "title": "Coseismic Shallow Landslide Distributions Reveal Patterns of Regolith Thickness in High Mountains", "url": "https://doi.org/10.1029/2026jf009250", "authors": "Suryodoy Ghoshal ほか", "venue": "Journal of Geophysical Research: Earth Surface", "date": "2026-10-13", "sjr": 1.437, "citescore": 6.6, "citescore_year": "2025", "apa": "Ghoshal, S., Boulton, S. J., Hales, T. C., Bennett, G., Beswick, A., Jones, J. N., Lewin, S., Mildon, Z. K., Stokes, M., Whitworth, M. R. Z., & Campforts, B. (2026). Coseismic Shallow Landslide Distributions Reveal Patterns of Regolith Thickness in High Mountains. Journal of Geophysical Research: Earth Surface, 131(10). https://doi.org/10.1029/2026jf009250", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr15", "rank": 15, "headline": "倒産予測にデフォルト・プット価値を加える", "title": "Taiwanese Bankruptcy Prediction with LASSO and Default-Put-Inspired Random Forests", "url": "https://doi.org/10.54254/2754-1169/2026.ld37672", "authors": "Zhuo Ren", "venue": "Advances in Economics Management and Political Sciences", "date": "2026-10-13", "apa": "Ren, Z. (2026). Taiwanese Bankruptcy Prediction with LASSO and Default-Put-Inspired Random Forests. Advances in Economics, Management and Political Sciences, 303(1), None–None. https://doi.org/10.54254/2754-1169/2026.ld37672", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr16", "rank": 16, "headline": "ゼロショットLLMの信用リスク予測を監査", "title": "Can Zero-Shot Large Language Models Be Trusted for Credit-Risk Prediction? An Explainability Audit Against LightGBM on Loan Default Data", "url": "https://doi.org/10.3390/jrfm19100811", "authors": "Saeed AlMarri ほか", "venue": "Journal of Risk and Financial Management", "date": "2026-10-13", "citescore": 5.5, "citescore_year": "2025", "apa": "AlMarri, S., Juhasz, K., Ravaut, M., Marti, G., & Al Ahbabi, H. (2026). Can Zero-Shot Large Language Models Be Trusted for Credit-Risk Prediction? An Explainability Audit Against LightGBM on Loan Default Data. Journal of Risk and Financial Management, 19(10), 811. https://doi.org/10.3390/jrfm19100811", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ゼロショットのLLMは信用リスク予測でLightGBMに及ばず、自分で述べる判断理由も実際の判断パターンと一致しにくいことを示した（抄録）。", "p3": "LendingClubの2007〜2016年の396,030件の貸付で、4つのオープンLLMとLightGBMに同じ21の予測変数を与えて返済確率を出させ、同じ20%の保留データで比べた。判断パターンをSHAPで監査し、各LLMが特徴量ごとに述べた影響の向きと照合した。", "p5": "LightGBMはROC-AUC 0.724、PR-AUC 0.907、Brier 0.141で、最良のLLM（Gemma-2-9B）の0.669、0.880、0.204を上回った。LLMの自己説明は上位特徴量のSHAPの向きと33〜67%しか一致しなかった（抄録）。", "fun": "AIに『なぜその判断をしたの？』と聞くと、もっともらしい理由を答えてくれます。でも、その理由が本当に判断の中身と一致しているかを統計的に確かめると、半分くらいしか合っていない。AIの『説明』をうのみにしてはいけない、という教訓が面白い点です。", "unverified": "なし"}}, {"id": "jr17", "rank": 17, "headline": "2段階ガレルキン縮約で非線形問題を高速化", "title": "A Two‐Level Galerkin Reduced Order Model for Nonlinear Problems", "url": "https://doi.org/10.1002/num.70148", "authors": "Dylan Park ほか", "venue": "Numerical Methods for Partial Differential Equations", "date": "2026-10-13", "citescore": 6.6, "citescore_year": "2025", "apa": "Park, D., Mou, C., Liu, H., Sandu, A., & Iliescu, T. (2026). A Two‐Level Galerkin Reduced Order Model for Nonlinear Problems. Numerical Methods for Partial Differential Equations, 42(6). https://doi.org/10.1002/num.70148", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Numerical Methods for PDEsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "非線形問題の縮約モデルを2段階に分け、精度を保ったまま計算コストを2〜3倍近く減らした（抄録）。", "p3": "まず低次元の非線形系を解き、次にその解のまわりで元の非線形方程式を線形化して解く2段階ガレルキン縮約モデル（2L-ROM）を提案した。定常ナビエ・ストークス方程式で誤差評価を証明し、バーガース方程式で数値的に調べた。", "p5": "適切なパラメータで2L-ROMの誤差の上界は通常の1段階ROMと同じ次数になった。計算コストは1段階ROMの約2分の1から3分の1近くまで減り、精度は落ちなかった。最良のパラメータは理論的なスケーリングに近かった（抄録）。", "fun": "複雑な流れの計算を、少ない変数で近似する『縮約モデル』の高速化です。まず粗く非線形のまま解き、その答えのまわりでは問題がほぼ直線的になるので、細かいところは簡単な線形計算で仕上げる。料理の下ごしらえと仕上げを分けるような発想です。", "unverified": "なし"}}, {"id": "jr18", "rank": 18, "headline": "流体中の粒状体の力鎖をコミュニティ検出", "title": "Community Detection of Force-Chain Network Evolution During Particle Migration in Granular Packings Under Fluid Action", "url": "https://doi.org/10.3390/pr14203279", "authors": "Luming Cha ほか", "venue": "Processes", "date": "2026-10-12", "citescore": 5.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Processesの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "流体の作用を受ける3次元の粒状体で、力鎖のネットワークをコミュニティ検出で自動抽出し、その変化を定量化した（抄録）。", "p3": "CFD-DEM連成で粒子の移動を計算し、粒子間の接触力を重み付きネットワークに符号化して、改良Louvain法でモジュラリティを最適化してサブコミュニティに分けた。流体圧と粘性を変えて、コミュニティの大きさ、平均接触力、中心性、配位数を比べた。", "p5": "強い力鎖は充填の中央部にまとまった枝分かれの多いコミュニティを作り、流体圧が高いと強弱の鎖が組み直されて系が安定した。コミュニティの大きさの分布は特徴的な規模を持たない減衰を示した。粘性が高いと粒子の移動が遅れた（抄録）。", "fun": "砂山の中では、力はすべての粒に均等にかかるのではなく、一部の粒がつながった『力の鎖』を通って伝わります。その鎖を、SNSの友達グループを見つけるのと同じ手法（コミュニティ検出）で見つけ出す、という分野をまたぐ発想が面白い点です。", "unverified": "なし"}}, {"id": "jr19", "rank": 19, "headline": "南の都市1,914の非公式居住地と脆弱性", "title": "Multidimensional vulnerabilities of informal settlements in the Urban South", "url": "https://doi.org/10.1073/pnas.2523034123", "authors": "Mingxing Chen ほか", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "date": "2026-10-12", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "PNASの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "グローバルサウスの1,914都市で非公式居住地を衛星画像と深層学習で描き、その多面的な脆弱性を比べた（抄録）。", "p3": "Sentinel-2の画像と深層学習で非公式居住地を抽出し、居住条件、社会インフラ、環境リスクからなる都市非公式居住地脆弱性指数で異質性を調べた。", "p5": "非公式居住地は都市域の12.94±2.52%（約3.4万km²）を占め、サハラ以南アフリカでは31.75±6.20%と最も多く脆弱性も最も高かった。東アジアの都市は全次元で比較的低かった。脆弱性は低と高に二極化していた（抄録）。", "fun": "世界の都市のどこに、どれだけ『スラム』のような住まいが広がっているのかは、実はよく分かっていませんでした。人工衛星の画像とAIで2,000近い都市を一気に調べ、地域によって脆弱さの中身が違うことを示した点が面白いところです。", "unverified": "なし"}}, {"id": "jr20", "rank": 20, "headline": "政府の準備金は裁量があってこそ格付を上げる", "title": "Governing Reserves: Managerial Discretion and Government Creditworthiness", "url": "https://doi.org/10.1111/puar.70220", "authors": "Sharon N. Kioko ほか", "venue": "Public Administration Review", "date": "2026-10-13", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Public Administration Reviewの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "政府の準備金は、形式的に持つだけでは信用格付を上げず、管理者が使い方を裁量できるときに信用力を高めることを示した（抄録）。", "p3": "信用格付を信用力の代理指標として、準備金に対する管理者の裁量と、形式的な準備金の有無が格付に与える影響を調べた。", "p5": "蓄積した資源に対する管理者の裁量は財政の柔軟性を高め、信用力を強めた。形式的な準備金があるだけでは格付は改善しなかった（抄録）。", "fun": "『貯金がある』ことより『いざというときに使える』ことのほうが、お金を貸す側には安心材料になる、という結果です。ルールで縛られた積立金より、状況に応じて使える蓄えのほうが評価される。家計にも通じる直感を、行政のデータで確かめた点が面白いところです。", "unverified": "対象の政府の種類と期間、推定方法は抄録では未確認。"}}, {"id": "jr21", "rank": 21, "headline": "欧州の介護現金給付と家族ケアの市場化", "title": "The turn to optional familialism through the market Long-term care, cash-for-care, and caregiving policies in Europe", "url": "https://doi.org/10.1111/spol.12505", "authors": "Blanche Le Bihan ほか", "venue": "HAL (ART) Social Policy and Administration", "date": "2026-10-13", "citescore": 4.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Social Policy and Administrationの抄録（HAL登録）を使用", "preprint": false, "short": true, "p1": "欧州の介護の現金給付が、家族介護を支えるだけでなく『市場を通じた選択的な家族主義』へ向かわせたことを示した比較研究（抄録）。", "p3": "家族化と脱家族化の議論にもとづく分析枠組みを作り、欧州7か国の20年間の介護の現金給付と長期介護政策が、インフォーマルな介護をどう位置づけ条件づけてきたかを比べた。", "p5": "現金給付は単に家族介護を支える道具ではなく、家族に介護を促しつつ市場の介護という選択肢も与える『市場を通じた選択的家族主義』への転換に寄与していた（抄録）。", "fun": "介護が必要な人にお金を渡す制度は、家族に介護を任せるためのものか、それとも外部のサービスを買うためのものか。その両方を同時に可能にしてきた、という見方が面白い点です。家族と市場の境目が、制度によって少しずつ動いていく様子が見えます。", "unverified": "対象7か国の名前は抄録では未確認。"}}, {"id": "jr22", "rank": 22, "headline": "高齢者に優しい都市づくりで排除される人々", "title": "Towards inclusive age-friendly communities: A scoping review of diversity and representation in global initiatives", "url": "https://doi.org/10.1177/00420980261486964", "authors": "Fatima Salomoni ほか", "venue": "Urban Studies", "date": "2026-10-13", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Urban Studiesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "高齢者に優しい都市づくりで、社会的に排除された高齢者がどう参加しているかをスコーピングレビューで整理した（抄録）。", "p3": "10,857件の記録とグレー文献を調べ、基準を満たした8件の研究から、参加の方法、戦略、課題と促進要因を整理した。", "p5": "共同設計のワークショップ、グラフィック・ファシリテーション、諮問パネル、当事者による調査、世代間の協働などの方法が見られたが、多くは小規模・短期で、意思決定の仕組みに組み込まれていなかった（抄録）。", "fun": "『高齢者に優しい街』をつくるとき、声の届きにくい高齢者は本当に参加できているのでしょうか。1万件以上の文献を調べても、きちんと当てはまる研究は8件しかなかった、という事実自体が、この問題がまだ手つかずであることを物語っています。", "unverified": "なし"}}, {"id": "jr23", "rank": 23, "headline": "客観的・主観的孤立を同時に見た幸福感", "title": "The relationship between objective and subjective social isolation and well-being: a national cross-sectional survey in Wales", "url": "https://doi.org/10.3389/fpubh.2026.1918382", "authors": "Carys Dale ほか", "venue": "Frontiers in Public Health", "date": "2026-10-13", "citescore": 6.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Frontiers in Public Healthの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "客観的な孤立と主観的な孤立が重なると、どちらか一方よりwell-beingの悪さとの関連が強いことを示した（抄録）。", "p3": "ウェールズの全国公衆衛生パネル調査（16歳以上の2,042人）で、客観的・主観的な社会的孤立と、4つのwell-being指標（生活満足、生きがい、幸福、不安）の関係を、障害の有無を含む属性とともに分析した。", "p5": "客観的に孤立した人は4.9%、主観的には20.8%、両方は7.3%だった。両方の孤立は4指標すべてで悪い結果の見込みを高め、次いで主観的、客観的の順だった。両方の孤立は50〜69歳と障害のある人で多かった（抄録）。", "fun": "『人と会っていない』ことと『寂しいと感じる』ことは別物です。この研究では、その両方が重なった人が最もつらい状態にあることが分かりました。支援を考えるとき、会う回数だけでなく本人の感じ方も合わせて見る大切さが分かります。", "unverified": "なし"}}, {"id": "jr24", "rank": 24, "headline": "高温極限の離散N粒子系の大数の法則", "title": "Discrete N‐particle systems at high temperature through Jack generating functions", "url": "https://doi.org/10.1112/plms.70223", "authors": "Cesar Cuenca ほか", "venue": "Proceedings of the London Mathematical Society", "date": "2026-10-13", "sjr": 2.413, "citescore": 2.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Proceedings of the London Mathematical Societyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "粒子数が無限大になると同時に逆温度が0に近づく離散N粒子系について、大数の法則が成り立つ必要十分条件を示した（抄録）。", "p3": "条件をJack生成関数で表し、Hecke関係から得たCherednik作用素の作用の漸近挙動で解析した。対数ガス型の相互作用を持つ非交差粒子のマルコフ連鎖などに応用した。", "p5": "大数の法則の答えを、キュムラントの新しい1パラメータ変形で表した。既知の量子化自由キュムラントの結果や、ランダム行列の固有値の連続版の結果を特別な場合として再現し、固定温度の場合の既知の結果も導いた（抄録）。", "fun": "たくさんの粒子が互いに押し合いながら並ぶとき、粒子の数を増やしていくと全体の分布は1つの形に落ち着きます。温度が高くなる（逆温度が0に近づく）のと同時に粒子を増やすという難しい極限で、いつそうなるかを完全に答えた点が面白いところです。", "unverified": "記号（逆温度の変数名）は抄録で欠落しており未確認。"}}, {"id": "jr25", "rank": 25, "headline": "職場参加の機会は社会経済格差を再生産する", "title": "The Participation Gap: Reproducing Socioeconomic Inequality in Workplace Participation", "url": "https://doi.org/10.1177/09500170261455218", "authors": "Jan Simon Danko", "venue": "Work, Employment and Society", "date": "2026-10-13", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Work, Employment and Societyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "職場での参加の機会が社会経済的地位によって偏り、平等を促すはずの参加が不平等を再生産しうることを示した（抄録）。", "p3": "ブルデューにもとづく組織フィールドの視点から、スイスの独自の調査データで、職場参加へのアクセスの知覚と社会経済的地位の関係、そして階級的な性向による媒介を調べた。", "p5": "社会経済的地位の高い人ほど、職位、学歴、社会人口学的要因を統制しても、職場参加へのアクセスを有意に多く報告した。その関係は組織の『ゲームのルール』に合った階級的な性向によって媒介された（抄録）。", "fun": "『みんなで意見を出し合う職場』は平等そうに見えます。でも、会議で発言しやすい話し方や振る舞いは、育ちによって身につきやすさが違う。その結果、参加の場がかえって格差を広げることがある、という指摘が面白い点です。", "unverified": "標本の規模は抄録では未確認。"}}, {"id": "jr26", "rank": 26, "headline": "現場作業員はスマホの割り込みをどう扱うか", "title": "“I’m Here to Work and Not to Call”: Blue-Collar Workers Navigating Interruptions by Mobile Devices", "url": "https://doi.org/10.1177/20501579261496742", "authors": "Floor Fiers", "venue": "Mobile Media and Communication", "date": "2026-10-13", "sjr": 1.467, "citescore": 8.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Mobile Media and Communicationの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "建設などの現場作業員が、スマホなどの割り込みにどう対処しているかを面接調査で明らかにした（抄録）。", "p3": "オランダの現場系企業の従業員への電話調査に組み込んだ46件の半構造化面接で、モバイル機器による割り込みの経験と対処を調べた。", "p5": "作業員は割り込みのたびに多くの状況要因を比べて応答を決める複雑な交渉を行っており、選択を導くルールを作る、選ぶ場面を減らす予防策をとる、モバイル通信を構造的に後回しにするという3つの戦略が見られた（抄録）。", "fun": "高い所や重機のそばで働いているときに電話が鳴ったら、出るか、無視するか。その一瞬の判断は、実は安全にかかわる高度な技能だ、という見方が面白い点です。オフィスでの『集中を妨げる通知』とは重みの違う問題が見えてきます。", "unverified": "なし"}}, {"id": "jr27", "rank": 27, "headline": "ブランド危機後の贈り物は関係型が効く", "title": "From crisis to opportunity: how gift types reshape consumer patronage intention through perceived brand responsibility", "url": "https://doi.org/10.1108/jpbm-02-2026-6779", "authors": "Wenqi Wang ほか", "venue": "Journal of Product and Brand Management", "date": "2026-10-13", "sjr": 2.139, "citescore": 13.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Product and Brand Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ブランドの危機の後に配る贈り物は、取引的なものより関係的なもののほうが愛顧意図を高めることを示した（抄録）。", "p3": "5つのシナリオ実験（998人）で、取引的と関係的の贈り物の効果を比べ、ブランドの責任の知覚を媒介、危機の性質、ブランドの物語性、事前の信頼を調整とする調整付き媒介モデルをANOVAとPROCESSで検証した。", "p5": "関係的な贈り物は取引的な贈り物より愛顧意図を高め、その効果はブランドの責任の知覚で完全に媒介された。利点は内部要因の危機、物語性の高い伝え方、事前の信頼が高い消費者で大きかった（抄録）。", "fun": "お詫びのしるしが『割引券』か『心のこもった品』かで、受け取る側の印象が変わります。後者のほうが『この会社は責任を感じている』と伝わり、また買いたくなる。贈り物の人類学の考え方を企業の危機対応に持ち込んだ点が面白いところです。", "unverified": "なし"}}, {"id": "jr28", "rank": 28, "headline": "オムニチャネルの一貫性が企業内ロックインに", "title": "How Channel Consistency Relates to Synergy Realisation and Within‐Firm Lock‐In in Omnichannel Grocery Retailing? A Mixed‐Methods Approach", "url": "https://doi.org/10.1002/cb.70261", "authors": "Xi Wang ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-12", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Consumer Behaviourの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "オムニチャネルの食料品小売で、どの次元のチャネル一貫性が相乗効果の実感と企業内ロックインにつながるかを示した（抄録）。", "p3": "中国のオムニチャネルの食料品の買い物客を対象に、量的調査（PLS-SEMとcIPMA）と質的面接を順に行う説明的混合法で、商品・サービス・価格・販促・コミュニケーションの一貫性と、制御焦点（促進・予防）の調整を調べた。", "p5": "商品・サービス・価格の一貫性は相乗効果の実感とロックインに正に関連し、コミュニケーションの一貫性は相乗効果の実感とだけ、販促の一貫性はどちらとも関連しなかった。制御焦点の調整効果は非対称だった（抄録）。", "fun": "ネットと店舗で品ぞろえや値段がそろっていると、客は『この店だけで十分』と感じて他店に移りにくくなります。ただし、キャンペーンをそろえても効果はない、という結果が意外です。何をそろえれば客の心をつかめるかの優先順位が見える研究です。", "unverified": "標本の規模は抄録では未確認。"}}, {"id": "jr29", "rank": 29, "headline": "観光地のサービス失敗危機とボイコット", "title": "The effect of service failure crisis in destinations on tourism boycotts: The moderating role of power distance beliefs", "url": "https://doi.org/10.1177/13567667261496543", "authors": "陈岩英 ほか", "venue": "Journal Of Vacation Marketing", "date": "2026-10-12", "citescore": 13.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Vacation Marketingの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "観光地のサービス失敗の危機が自分に近い範囲で起きるほど、観光ボイコットが強くなることを示した（抄録）。", "p3": "自己バイアス理論と解釈レベル理論にもとづき、2つの実験で、危機の範囲（個人・共同体・外部）がボイコットに与える影響と、相対的剥奪感と信頼の直列媒介、権力格差信念の調整を調べた。", "p5": "ボイコットは個人の範囲で最も強く、次いで共同体、外部の順だった。相対的剥奪感と観光地への信頼が順に媒介し、権力格差信念が範囲の違いによる負の反応の差を大きくした（抄録）。", "fun": "観光地でのトラブルを『自分ごと』と感じるほど、その土地に行かない運動に加わりやすい。距離の近さが怒りを増幅するという結果は、遠い国のニュースより身近な事件に心が動くことと似ています。上下関係を当然と考える人ほど差が大きくなる点も興味深いところです。", "unverified": "実験の標本規模は抄録では未確認。"}}, {"id": "jr30", "rank": 30, "headline": "暑熱都市の駅アクセスを気候込みで評価", "title": "Climate-Responsive First/Last-Mile Accessibility Around Riyadh Metro: A Multi-Scalar Decision-Support Framework for Smart Urban Mobility", "url": "https://doi.org/10.3390/smartcities9100172", "authors": "Ahmad Mashary Alnaim ほか", "venue": "Smart Cities", "date": "2026-10-13", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Smart Citiesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "暑く乾燥したリヤドの地下鉄駅まわりの歩行路を、日陰や日射などの5つの空間指標で評価し、改修案を比べる意思決定支援の枠組みを示した（抄録）。", "p3": "日陰の連続性、相対的な日射曝露、移動の摩擦、経路の視認、推定した移動の対応の5つの指標で、12の歩行区間を現状と3つの改修案（植樹、軽量の天蓋、組み合わせ）で比べた。", "p5": "現状では日陰の連続性18%、日射曝露指数4.2、経路確認の手がかり約42%だったが、組み合わせ案ではそれぞれ84%、2.1、75%になり、組み合わせ案が最上位だった。著者は、これは比較的な空間性能で、実測の暑さの緩和などではないと明記している（抄録）。", "fun": "駅まで歩く道が近くても、炎天下で日陰がなければ人は歩きません。『距離』だけでなく『暑さ』や『迷いやすさ』まで含めて道を評価し、木と屋根を組み合わせると日陰が大きく増えることを示しました。著者自身が『実際に涼しくなったかは測っていない』と限界を明記している点も誠実です。", "unverified": "抄録の日射曝露指数の改修後の値（2.1%と表記）の単位は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "スマートシティ交通監視のAIクラウド基盤", "title": "AI Cloud Platform for Smart City Traffic Monitoring and Analysis Using Multi-Dimensional Big Data and Deep Learning Models", "url": "https://doi.org/10.3390/smartcities9100170", "authors": "Ling Zhao ほか", "venue": "Smart Cities", "date": "2026-10-12", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Smart Citiesの抄録（Crossref登録、途中で切れている）を使用", "preprint": false, "short": true, "p1": "監視カメラ、ドローン映像、IoTセンサの分析を1つのクラウド基盤に統合したスマートシティの交通監視システムを示した（抄録）。", "p3": "ドローン映像では事故の検出・分類、緊急車両の検出、車両の追跡・計数・渋滞分析の3つのパイプラインを意思決定レベルで統合した。検出にYOLOv8、追跡にDeep SORT、PeMS-BAYのセンサデータの短期予測にDCRNNを使い、境界ノードを重ねたグラフ分割で予測精度と計算効率の兼ね合いも評価した。", "p5": "未確認（抄録がモジュール単位の実験の結果の手前で切れている）。", "fun": "街の交通を見張るAIはたくさんありますが、カメラ用、ドローン用、センサ用と別々のことが多く、使う人が困ります。それを1つの画面にまとめる仕組みを作った研究です。道路網をいくつかに分けて計算を速くする工夫も、大きな街ならではの課題です。", "unverified": "抄録が途中で切れており、性能の数値は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "監査品質と租税回避の関係は分布で異なる", "title": "Tax avoidance and audit quality: evidence from Spanish listed and non-listed companies", "url": "https://doi.org/10.1108/sar-03-2026-0017", "authors": "Raúl Rivero-Blanco ほか", "venue": "Revista de Contabilidad – Spanish Accounting Review", "date": "2026-10-13", "citescore": 3.2, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Revista de Contabilidad – Spanish Accounting Reviewの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "監査品質と租税回避の関係は、租税回避の分布の位置や上場・非上場で大きく異なることを分位点回帰で示した（抄録）。", "p3": "スペインの企業（2008〜2019年）で、監査品質の代理指標（BIG4と監査人の在任期間）と租税回避の関係を、上場・非上場別に分位点回帰で推定し、PCSEの線形推定と比べた。", "p5": "非上場企業では両指標の関連が分布によって異なり、BIG4は保守的な企業で税負担の高さと、会計と税の差の上側で大きな差と関連し、在任期間は符号が逆転した。上場企業ではBIG4はほぼ一様に税負担の高さと関連し、在任期間は関連しなかった。平均による推定ではこれらが見えなかった（抄録）。", "fun": "『平均すると関係なし』でも、分布の端のほうでは強い関係が隠れていることがあります。大手の監査法人が税金の節約を抑えるのか助けるのかは、企業がどれだけ節税に積極的かで変わる、という結果は、平均だけを見る危うさを示しています。", "unverified": "なし"}}, {"id": "jr33", "rank": 33, "headline": "投資家心理が利益調整と開示を左右する", "title": "The Impact of Investor Sentiment on Earnings Management and Financial Disclosure Behavior: Evidence from China’s A-Share Market", "url": "https://doi.org/10.1080/15427560.2026.2690919", "authors": "Yu Cui", "venue": "Journal of Behavioral Finance", "date": "2026-10-12", "citescore": 5.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Behavioral Financeの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "中国A株市場で、投資家心理が高いときに利益の出ている企業ほど良い利益を報告し開示も増やすことを示した（抄録）。", "p3": "2013〜2023年の中国A株上場企業14,081企業・年で、業種調整済みのトービンのQを企業ごとの評価圧力・投資家心理の代理指標とし、業績にもとづく適合指標で利益調整を測った。", "p5": "心理が高いとき、黒字企業は赤字企業に比べてより良い利益を報告し、開示の頻度も高かった。市場は投資家の感情に応じた行動の揺れを示すと結論づけた（抄録）。", "fun": "株価が実力以上に高く評価されているとき、会社は『この期待に応えたい』と思って、数字を良く見せたり発表を増やしたりするのかもしれません。市場の空気が会社の会計に影響する、という双方向の関係が面白い点です。", "unverified": "トービンのQを心理の代理とする妥当性と係数の大きさは抄録では未確認。"}}, {"id": "jr34", "rank": 34, "headline": "過信CEOと利益操作、集中所有市場の統治の限界", "title": "Overconfident CEOs, Earnings Manipulation, and the Limits of Governance in Concentrated-Ownership Markets", "url": "https://doi.org/10.3390/jrfm19100806", "authors": "Abdulrazak Balilah", "venue": "Journal of risk and financial management", "date": "2026-10-11", "citescore": 5.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Managementの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "サウジアラビアの上場企業で、過信したCEOほど裁量的会計発生高と実体的な利益調整が大きいことを示した（抄録）。", "p3": "2018〜2024年の98社686企業・年で、過剰投資の残差、相対報酬比率、3年間の買収頻度から過信の主成分合成指標を作り、固定効果回帰とシステムGMMで推定した。", "p5": "過信は裁量的発生高の絶対値と実体的利益調整の両方と正に関連した。1標準偏差の上昇は、それぞれ標本平均の約38%と44%に相当した。大手4監査法人は発生高との関連を弱めたが実体的調整は弱めず、所有の集中は関連を強めた（抄録）。", "fun": "自信過剰な社長ほど数字をいじりやすい、という結果です。ストックオプションの情報が使えない国でも、投資の多さ、報酬、買収の回数から『自信過剰さ』を推し量る工夫が面白い点です。監査法人は会計の操作は抑えられても、取引そのものを動かす操作は抑えにくいことも分かります。", "unverified": "なし"}}, {"id": "jr35", "rank": 35, "headline": "ファジーC平均で上場企業の財務困窮を予測", "title": "Financial distress prediction for listed enterprises using Fuzzy C-Means", "url": "https://doi.org/10.36708/ls.2019.i01.002", "authors": "Lu Wang", "venue": "Littera Scripta", "date": "2026-10-13", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Littera Scriptaの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ファジーC平均法で中国の上場企業の財務困窮を予測した（抄録）。", "p3": "上海・深圳の同時期・同業種の困窮企業90社と正常企業90社の12の財務指標を前処理し、有意差のある11指標でファジーC平均法（所属度を連続値で持つクラスタリング）による分類を行った。", "p5": "FCMの結果は困窮企業でより良い性能を示した（抄録）。具体的な精度の数値は抄録に記載なし。", "fun": "会社を『危ない』『安全』の2つにきっぱり分けるのではなく、『7割危ない』のように度合いで表すのがファジー（あいまい）な分類の考え方です。現実の会社は白黒つけにくいので、この見方は直感に合っています。", "unverified": "予測精度の数値と比較対象のモデルは抄録になく未確認。"}}, {"id": "jr36", "rank": 36, "headline": "液架橋界面の変化を非侵入型縮約モデルで予測", "title": "A two-stage non-intrusive reduced-order model for parametric prediction of liquid-bridge interface evolution in gravure-printing cavities", "url": "https://doi.org/10.1063/5.0351233", "authors": "Hyeokgyun Moon ほか", "venue": "Physics of Fluids", "date": "2026-10-13", "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Physics of Fluidsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "グラビア印刷の液架橋の界面変化と転写率を、セルの形状から直接予測する2段階の非侵入型縮約モデルを作った（抄録）。", "p3": "第1段でガウス過程が形状からちぎれる時刻と転写率を予測し、その時刻で時間を正規化して形状間のスナップショットをそろえる。第2段で固有直交分解（POD）で圧縮し、モード係数をガウス過程で回帰する。18形状で学習した。", "p5": "一つ抜き交差検証で参照の界面を全体のRMS誤差1.85%で再現し、誤差はPODの打ち切り1.04%と係数回帰1.53%に分かれた。独立の5つの検証例でも0.61〜1.19%だった（抄録）。", "fun": "インクの橋が伸びてちぎれる様子を毎回細かく計算するのは大変です。そこで『いつちぎれるか』でまず時間をそろえ、どの形でも同じ物差しで比べられるようにしてから、少数の基本パターンの組み合わせで表す、という2段階の工夫が面白い点です。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "ペルー沿岸乾燥流域の土石流と降雨閾値", "title": "Debris Flow Dynamics in a Coastal Arid Catchment: Rainfall Thresholds and Numerical Simulation During the 2023 Yaku Event, Peru", "url": "https://doi.org/10.3390/coasts6040044", "authors": "Carlos Millán ほか", "venue": "Coasts", "date": "2026-10-12", "citescore": 2.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Coastsの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "ペルーの2023年Yaku現象で起きた高濃度流を、地形分類、水文モデル、数値シミュレーションで解析し、降雨閾値とハザードマップを作った（抄録）。", "p3": "3つの地形計測法で流域をデブリフラッド型に分類し、線形回帰と真のスキル統計量にもとづく降雨強度・継続時間の閾値を導いた。事象ベースの水文モデルのハイドログラフを入力にVoellmy摩擦のRAMMSで、事前地形と、施設が損傷した事後の2つのシナリオを計算した。", "p5": "閾値は2026年の雨季に運用で検証された。事後シナリオでは防護施設の損傷により流れの範囲と強さが大きく増した。結果は正式なリスク評価に使われた（抄録）。", "fun": "砂漠に近い乾いた海岸の谷でも、まれな豪雨で土砂を多く含んだ流れが起きます。一度の災害で砂防施設が壊れると、次の災害はもっと広がる、という『災害が次の災害を大きくする』連鎖を数値で示した点が重要です。", "unverified": "閾値の具体的な値は抄録では未確認。"}}, {"id": "jr38", "rank": 38, "headline": "がん経験高齢者のインフォーマルケア時間を推計", "title": "Estimating informal caregiving time among older U.S. cancer survivors by health-related quality of life using the Health and Retirement Study.", "url": "https://doi.org/10.1200/op.2026.22.10_suppl.283", "authors": "Juncheng Tong ほか", "venue": "JCO Oncology Practice", "date": "2026-10-13", "sjr": 1.985, "citescore": 6.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JCO Oncology Practiceの学会抄録（Crossref登録、途中で切れている）を使用", "preprint": false, "short": true, "p1": "米国の高齢のがん経験者が受けるインフォーマルな介護の時間を、健康関連QOLとの関係で推計した学会抄録（抄録）。", "p3": "健康と退職調査（HRS）の2010〜2022年の60歳以上を対象に、日常生活動作の無償の援助時間を月ごとに合計し、HUI-3とVASで測ったQOLとの関係を、がんの有無との交互作用を含む2部ガンマモデルで調査重み付きで分析した。", "p5": "30,372人・波のうち17.7%にがんの既往があり、がん経験者は月61.5時間のインフォーマルな介護を受け、がんのない人の45.5時間より有意に多かった（抄録）。金額換算以降は抄録が途中で切れている。", "fun": "家族が無償でしている介護は、お金の計算には出てきません。そのため、がん治療の費用対効果を考えるときに見落とされがちです。全国調査から『月に何時間』という形で見える化した点が、見えない担い手の負担を考えるうえで大切です。", "unverified": "抄録が途中で切れており、時給換算の総額とQOLとの関係の結果は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "防災研究の社会関係資本を体系的に整理", "title": "From Bosai to Global Resilience: A Systematic Review of Social Capital in Disaster Risk Management Research", "url": "https://doi.org/10.1111/1468-5973.70247", "authors": "Murat Bayraktar", "venue": "Journal of Contingencies and Crisis Management", "date": "2026-10-12", "citescore": 4.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Contingencies and Crisis Managementの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "災害リスク管理の社会関係資本の研究を、日本の『防災』文化を基準に217本の論文で体系的にレビューした（抄録）。", "p3": "ScopusとWeb of Scienceから1999〜2025年の査読論文217本を集め、計量書誌分析と全文の主題分類を組み合わせた。", "p5": "災害と地域のレジリエンス（37.8%）、事業とサプライチェーン（33.2%）、気候・環境適応（17.5%）、健康関連の組織リスク（11.5%）の4群に分かれた。結束型のつながりは直後の対応を、橋渡し型・連結型は復旧を支え、不平等があると社会関係資本は不十分または排除的になった（抄録）。", "fun": "日本の町内会や近所づきあいに根ざした『防災』は、世界から見ると社会関係資本の最も制度化された例だ、という位置づけが面白い点です。身内の強い絆は直後の助け合いに、外とのゆるいつながりは立ち直りに効く、という役割分担も見えます。", "unverified": "なし"}}, {"id": "jr40", "rank": 40, "headline": "在宅勤務とAIツール利用が燃え尽きに与える影響", "title": "The effect of remote work and AI tool use for treatment planning on burnout and the perception of a healthy work-life balance.", "url": "https://doi.org/10.1200/op.2026.22.10_suppl.757", "authors": "Ajay Dubey ほか", "venue": "JCO Oncology Practice", "date": "2026-10-13", "sjr": 1.985, "citescore": 6.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JCO Oncology Practiceの学会抄録（Crossref登録、途中で切れている）を使用", "preprint": false, "short": true, "p1": "放射線腫瘍の医療チームで、在宅勤務とAI支援の輪郭描出がワークライフバランスと時間の節約につながると感じられていることを示した調査の学会抄録（抄録）。", "p3": "放射線腫瘍医、医学物理士、線量計算士に匿名のオンライン調査を行い、在宅勤務、コミュニケーション、ワークライフバランス、AI支援の輪郭描出の利用、業務効率、燃え尽きを尋ねた。", "p5": "130人が参加し、在宅勤務でワークライフバランスが改善したと答えたのは医師71.4%、物理士80%、線量計算士87.3%だった。自動化で週1時間以上節約できたと答えたのは医師52.4%、物理士71.1%だった（抄録）。燃え尽きの結果は抄録が途中で切れている。", "fun": "同じ医療チームでも、職種によって在宅勤務やAIの恩恵の感じ方が違う、という点が面白いところです。画面に向かう作業の多い職種ほど在宅勤務を良いと感じています。AIがどの仕事を軽くするかは、職場の中でも一様ではありません。", "unverified": "抄録が途中で切れており、燃え尽きとの関係の結果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "病院の組織環境が看護師の燃え尽きと離職に", "title": "Organizational Environment and Its Association With Burnout and Turnover Intention Among Hospital Nurses: A Cross‐Sectional Study", "url": "https://doi.org/10.1111/jan.70792", "authors": "Hailan Jiang ほか", "venue": "Journal of Advanced Nursing", "date": "2026-10-13", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Advanced Nursingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "病院の組織環境が支援的であるほど、看護師の燃え尽きと離職意図のオッズが大きく低いことを全国調査で示した（抄録）。", "p3": "2022年の米国の看護師全国標本調査から、直接ケアに当たる病院勤務の看護師6,592人を分析した。6項目の組織環境指数を作って心理測定的に確かめ、重み付きロジスティック回帰と、KHB法による離職意図との関連の分解を行った。", "p5": "87.3%が燃え尽きを感じたことがあり、67.0%が離職を考えたことがあった。指数が1点上がるごとに各結果の調整オッズは約半分になった。燃え尽きは離職意図との関連の21.7%を説明した（抄録）。", "fun": "看護師の9割近くが燃え尽きを経験し、3分の2が辞めることを考えたことがある、という数字自体が衝撃的です。職場の環境が良いほど燃え尽きも離職の考えも減り、その一部は燃え尽きを通じた経路で説明できる、という分解が分かりやすい点です。", "unverified": "なし"}}, {"id": "jr42", "rank": 42, "headline": "モード基底の非心ウィシャート行列で構造動力学の不確実性", "title": "Non‐Central Wishart Random Matrices in Structural Dynamics: A Modal‐Basis Approach", "url": "https://doi.org/10.1002/nme.70446", "authors": "Alan Das Mannoosseril ほか", "venue": "International Journal for Numerical Methods in Engineering", "date": "2026-10-13", "citescore": 5.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal for Numerical Methods in Engineeringの抄録（Crossref登録、途中で切れている）を使用", "preprint": false, "short": true, "p1": "非心ウィシャート分布のランダム行列をモード基底で較正し、構造動力学の質量・剛性の不確実性を効率よく表す方法を示した（抄録）。", "p3": "有限要素の座標で直接同定するには全行列の共分散が必要で重いため、参照となるパラメトリックなアンサンブルから縮約したシステム行列の分散情報を同定し、直接サンプリングで不確実性を前向きに伝える。材料と厚さに空間相関のある不確実性を持つ固定アルミ板の強制振動で、中心ウィシャートと比べた。", "p5": "板の問題で、応答の統計量から不確実性の主な寄与を調べた（抄録）。具体的な結論は抄録が途中で切れており未確認。", "fun": "構造物の重さや硬さには、材料のばらつきなどで不確かさがあります。一つ一つのパラメータの不確かさを積み上げる代わりに、行列そのものをくじで引くように扱う『ランダム行列』の考え方で、振動の不確かさを丸ごと表す点が面白いところです。", "unverified": "抄録が途中で切れており、比較の結果は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "幅広の転体橋を1軸の試験で計量する", "title": "Single-Axis Weighing Method for Horizontal Swivel Construction of Wide Bridges", "url": "https://doi.org/10.3390/buildings16204022", "authors": "Chengbo Lu ほか", "venue": "Buildings", "date": "2026-10-13", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Buildingsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "幅の広い転体施工の橋で、支持脚の変位から不釣り合いモーメントを1回の計量試験で推定する方法を示した（抄録）。", "p3": "剛体のつり合いモデルで、仮固定を解いた後の支持脚と滑り台の隙間を不釣り合い荷重の位置に結びつけ、桁を16の扇形領域に分けて隙間のパターンから領域を特定し、境界方向の1回の計量で総モーメントの範囲を求める。縮尺模型の8ケースと実橋に適用した。", "p5": "8ケースすべてで変位パターンが荷重の領域を正しく特定し、理論値は計量試験の区間内に入った。60m+60m、幅44mのPC T形ラーメン橋では、回転中心から36mに25tの錘を置いて偏心が約134mmから約99mmに減った（抄録）。", "fun": "川や線路の上に橋を架けるとき、横で組み立ててからぐるっと回して架ける方法があります。回す前に橋の重さの偏りを知る必要がありますが、普通は2方向に2回試験が要ります。脚のわずかな隙間のパターンを読むことで1回で済ませる、という工夫が面白い点です。", "unverified": "なし"}}, {"id": "jr44", "rank": 44, "headline": "LLMマルチエージェントで製造現場の課題を発見", "title": "Large language model multiagent systems for industrial problem discovery and prioritization", "url": "https://doi.org/10.1007/s44163-026-02468-6", "authors": "Mohammed Amin Adoul ほか", "venue": "Discover Artificial Intelligence", "date": "2026-10-13", "citescore": 6.2, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Discover Artificial Intelligenceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "製造業の部門横断の課題を、LLMの複数エージェントが発見し優先順位をつける枠組みと研究課題を示した展望論文（抄録）。", "p3": "生産、品質、保全、サプライチェーン、安全、エネルギーの6つの専門エージェントが、作業者による発見、部門横断の分析、関係候補の検出、合意による財務評価、討論による優先順位づけの5段階で協働する手順を設計した。実装と実証評価は対象外と明記している。", "p5": "未確認（展望論文で、実装・評価の結果は含まれない）。優先順位づけの手順（財務見積もりの正規化など）は完全に定めた（抄録）。", "fun": "工場の ジメチルアミン系に適用した。", "p5": "動力学的な当てはめのパラメータなしに、汚染された巨大都市、高地の遠隔地、極めて清浄な北方の泥炭地での実験と観測のクラスター形成を再現した。生成を最大にする最適な結合自由エネルギーがあり、正午や春、熱波の下でも生成が起きることを説明した（抄録）。", "fun": "空気中で何もないところから小さな粒子が生まれる現象は、雲や気候に関係します。それがいつ起きるかを、2つの分子がどれだけ強くくっつくかという1つの量で説明できる、という単純さが面白い点です。40℃近い熱波の日にも起きる理由まで説明できます。", "unverified": "なし"}}, {"id": "jn17", "rank": 17, "field": "地球科学", "headline": "米本土の氷河は約4分の1が消失", "title": "Extensive glacier loss in the coterminous United States", "url": "https://doi.org/10.1073/pnas.2600941123", "authors": "Andrew G. Fountain ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-12", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "米本土の氷河の面積と体積の変化を初めて包括的に評価した。", "explain": {"basis": "抄録", "basis_note": "PNASの短い抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米国本土の氷河の面積と体積の変化を初めて包括的に評価し、20世紀半ば以降に約4分の1が消失したことを示した（抄録）。", "p3": "米国本土西部の山岳の氷河について、20世紀半ば以降の面積と体積の変化を評価した（データと手法の詳細は抄録に記載なし）。", "p5": "約4分の1の氷河が消失し、全体の面積と体積は3分の1減った。縮小のパターンから、多くの氷河は小さいため局所的な地形の影響で保たれていると考えられた（抄録）。", "fun": "アメリカ本土にも氷河がありますが、その全体がどれだけ減ったかは、これまで誰もきちんと数えていませんでした。4つに1つが消えたという結果に加え、小さな氷河は日陰や吹きだまりといった地形のおかげで生き残っている、という見方が面白い点です。", "unverified": "使ったデータ（航空写真・衛星など）と期間の詳細は抄録では未確認。"}}, {"id": "jn18", "rank": 18, "field": "計算科学", "headline": "正のヤコビアンを保証する六面体メッシュ生成", "title": "MCHex: marching cubes based adaptive hexahedral mesh generation with guaranteed positive Jacobian", "url": "https://doi.org/10.1145/3858338", "authors": "Hua Tong ほか", "venue": "ACM Transactions on Graphics", "date": "2026-10-13", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "マーチングキューブを各格子に適用し、境界の忠実さと要素品質を保証する六面体メッシュ生成を示した。", "explain": {"basis": "抄録", "basis_note": "ACM Transactions on Graphicsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "マーチングキューブ法を格子の各セルに適用し、すべての要素でヤコビアンが正であることを保証する六面体メッシュ生成法を示した（抄録）。", "p3": "切断されたセルの形を3正則な多面体に制限し、中点分割を行うことで、境界がマーチングキューブの面になる全六面体メッシュを作る。202のベンチマーク形状で既存の最先端の手法と比べた。", "p5": "すべての要素で正のヤコビアンを理論的に保証し、境界はマーチングキューブの近似の速さで収束し、既存手法の中で最も速い実行時間を示した（抄録）。比較の数値の詳細は抄録が途中で切れており未確認。", "fun": "構造や流れの計算では、形をサイコロのような六面体で埋め尽くすと精度が良いのですが、複雑な形の境界でつぶれた要素ができやすいのが悩みでした。CGで使われる表面の作り方を組み込むことで、つぶれた要素が絶対にできないことを数学的に保証した点が面白いところです。", "unverified": "抄録が途中で切れており、比較の数値は未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "機械学習で導く自律実験で水電解触媒を最適化", "title": "Optimizing NiMo Electrocatalyst Coatings for Hydrogen Evolution in Alkaline Electrolysis With The Machine Learning‐Guided Autonomous Platform CatBot", "url": "https://doi.org/10.1002/adfm.78438", "authors": "Paolo Vincenzo Freiesleben de Blasio ほか", "venue": "Advanced Functional Materials", "date": "2026-10-13", "sjr": 5.022, "citescore": 28.7, "citescore_year": "2025", "why": "自律実験プラットフォームで触媒コーティングを効率的に探索する手法を示した。", "explain": {"basis": "抄録", "basis_note": "Advanced Functional Materialsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "自動合成・試験装置とベイズ最適化を閉じたループで回し、水電解用のNiMo触媒コーティングを効率よく見つけた（抄録）。", "p3": "自動の電極触媒合成・試験システムCatBotにベイズ最適化と工業条件での加速劣化試験を組み合わせ、6次元の合成条件の空間を限られた実験回数で探索した。有望なコーティングを工業用のニッケル発泡体電極に拡大した。", "p5": "活性と安定性が非常に高い領域を特定し、30wt%KOHで水素発生の過電圧173mVという白金並みの活性を示した（抄録）。", "fun": "触媒の作り方の組み合わせは膨大で、人の手で一つずつ試していては終わりません。ロボットが作って試し、AIが次に試す条件を選ぶ、というループで、白金を使わずに白金並みの性能を見つけた点が面白いところです。", "unverified": "過電圧の電流密度の条件は抄録の記号が欠けており未確認。"}}, {"id": "jn20", "rank": 20, "field": "機械学習", "headline": "LLMが導く反復設計で長寿命ナトリウム電池", "title": "Large Language Model Directed Iteration for the Design of Ultra‐Stable Sodium‐Ion Battery", "url": "https://doi.org/10.1002/adfm.79026", "authors": "Jie Feng ほか", "venue": "Advanced Functional Materials", "date": "2026-10-13", "sjr": 5.022, "citescore": 28.7, "citescore_year": "2025", "why": "LLMに領域知識を持たせて探索と活用を両立させる材料設計の流れを示した。", "explain": {"basis": "抄録", "basis_note": "Advanced Functional Materialsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "LLMによる文献知識の掘り起こしとベイズ最適化を組み合わせ、長寿命のナトリウムイオン電池の電解液を設計した（抄録）。", "p3": "LLMを知識の採掘の補助に、ベイズ最適化を多目的最適化に使う文献知識主導の反復の流れで電解液の組成を求め、2種の陰イオンを使う混合溶媒和電解液（DHSE）を得た。", "p5": "DHSEは緻密で無機成分の多い正極界面膜を作り、副反応を抑えてNa⁺の移動を速めた。工業規模のAh級パウチセルでエネルギー密度107.7Wh/kg、0.5Cで100サイクル後の容量維持率94%を示した（抄録）。", "fun": "材料の探索では『広く探す』か『深く掘る』かの板挟みがあります。論文の山からAIに知識を拾わせて候補を絞り、そこから最適化で詰めていく、という人間の研究者のような手順をAIで組んだ点が面白いところです。", "unverified": "なし"}}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "AIが動かすエコシステムの価値創造と獲得", "title": "Value creation and capture in artificial intelligence‐enabled ecosystems", "url": "https://doi.org/10.1002/sej.70057", "authors": "Rahul Kapoor ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-10-13", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "汎用技術としてのAIの特性からエコシステムでの価値創造と獲得を理論化した。", "explain": {"basis": "抄録", "basis_note": "Strategic Entrepreneurship Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "汎用技術としてのAIの特性から、AIを使ったエコシステムでの価値の創造と獲得を理論化した（抄録）。", "p3": "AIは複数の価値提案を、別々だが相互につながったエコシステムで支えると考え、AIの開発者がどの価値提案を支えるか、汎用か特化か、開放か閉鎖かを選び、利用者もエコシステムの構成を戦略的に選ぶという枠組みを作った。", "p5": "開発者と利用者の選択が、時間とともにエコシステムの役割と競争関係を変えうることを示し、戦略・イノベーション研究の研究課題を示した（抄録）。", "fun": "AIの価値は技術の性能だけでは決まらず、それを使う会社やサービスの組み合わせで決まる、という見方です。同じAIでも、何に使うかごとに別々の『生態系』ができる、という整理が分かりやすい点です。", "unverified": "理論的論考で、実証は未確認。"}}, {"id": "jn22", "rank": 22, "field": "組織行動・心理的安全性", "headline": "環境志向の採用ブランドは道徳的意味で人を惹く", "title": "Environmental Sustainability–Oriented Employer Branding and Employer Attractiveness: The Role of Moral Meaningfulness Across Career Stages", "url": "https://doi.org/10.1002/bse.71688", "authors": "Subburaj Alagarsamy ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-13", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "環境への価値コミットメントが職業段階ごとに求職者の魅力に与える影響を扱った。", "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "環境への取り組みを打ち出す採用ブランドは、仕事の道徳的な意味を通じて求職者を惹きつけることを示した（抄録）。", "p3": "UAEの社会人経験のある学生242人に3時点の時間差調査を行い、環境関連の従業員価値提案、仕事の道徳的有意味感、人材の惹きつけの関係と、キャリア段階の調整を調べた。", "p5": "環境関連の価値提案は道徳的有意味感を高め、それが惹きつけを予測し、有意な媒介があった。キャリア初期ほど有意味感と惹きつけの関連が強かったが、調整付き媒介の指標は有意でなかった（抄録）。", "fun": "『環境に良いことをしている会社』で働きたいと思うのは、その仕事が道徳的に意味のあるものに感じられるからだ、という経路を示した研究です。若い人ほどその意味を重視する傾向が見えますが、全体の経路の強さまでは変わらなかった点は慎重に読む必要があります。", "unverified": "なし"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "皮肉なブランド名は健康イメージに道徳的負債", "title": "Liquid Death, Moral Debt: Ironic Naming and the Effect on Healthiness Perception", "url": "https://doi.org/10.1002/mar.70284", "authors": "Smaraki Mohanty ほか", "venue": "Psychology and Marketing", "date": "2026-10-13", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "why": "「Liquid Death」のような皮肉な命名が健康性の知覚に与える影響を実験で検証した。", "explain": {"basis": "抄録", "basis_note": "Psychology and Marketingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "「Liquid Death」のような皮肉なブランド名は、商品の道徳性の知覚を下げて健康的だという評価を下げることを実験で示した（抄録）。", "p3": "複数の実験で、皮肉な名前と健康性の知覚の関係、道徳性の媒介、美徳的な商品（スムージー）と悪徳的な商品（ミルクシェイク）の違い、パッケージの属性情報の効果を調べた。", "p5": "皮肉な名前は道徳性の知覚を下げ、健康性の知覚を下げた。この『皮肉の罰』はスムージーでは見られたがミルクシェイクでは弱まり、診断的な属性情報で弱まった。目を引いても購入意図にはつながらなかった（抄録）。", "fun": "『液体の死』という名前の水が実際に売られています。目立つのは確かですが、体に良いはずの商品に皮肉な名前をつけると『なんだか体に悪そう』と思われてしまう。もともと体に悪いとわかっているお菓子なら気にされない、という違いが面白い点です。", "unverified": "実験の数と標本規模は抄録では未確認。"}}, {"id": "jn24", "rank": 24, "field": "経済学", "headline": "民間財団の慈善資本はどう配分されるか", "title": "Charitable capital allocation: Evidence from private foundations", "url": "https://doi.org/10.1016/j.jfineco.2026.104377", "authors": "Zhongjin (Gene) Lu ほか", "venue": "Journal of Financial Economics", "date": "2026-10-13", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "JFE掲載の民間財団の資本配分の実証（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Journal of Financial Economicsの題名のみ（取得できたのは再現パッケージの名前だけ）", "preprint": false, "short": true, "p1": "題名からは、米国などの民間財団が慈善の資本をどう配分しているかを実証した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "財団は、寄付として配るお金と、運用して増やすお金のバランスをどう決めているのでしょうか。題名から読み取れる問いは、営利企業の資本配分と同じ見方で、慈善のお金の流れを分析するというものです。", "unverified": "手法・データ・結果はす       }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
