<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

aly Klinberg ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-13", "apa": "Klinberg, V., & Nikiforov, V. (2026). Association of AI Assistant Anthropomorphism with Occupational Burnout and Self-Efficacy Among Adult Workers: A Cross-Sectional Study. Zenodo. https://doi.org/10.5281/ZENODO.23327512", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（OpenAlex登録）を使用", "preprint": true, "short": true, "p1": "AIアシスタントを人間らしく感じる人ほど、AIを使う自信が高い傾向があることを示した横断調査（抄録）。", "p3": "AIを日常的に使う就業者661人のオンライン調査で、擬人化の知覚（Godspeed尺度）、AI利用の自己効力感（AISES）、職業的自己効力感（OSS）、燃え尽き（OLBI：疲弊と離脱）の関係を相関と回帰で調べた。", "p5": "擬人化はAI利用の自己効力感と弱く正に相関した（r=0.148）が、疲弊・離脱とは有意な相関がなかった。統制後の係数はβ=0.070（p=0.082）で、擬人化とAI利用経験の交互作用は有意だった（b=0.114）（抄録）。", "fun": "AIに『人っぽさ』を感じるかどうかで、人の働き方の感じ方が変わるのかを調べた研究です。人っぽく感じる人はAIを使いこなす自信が少し高いものの、疲れや仕事からの心の離れとは関係が見られませんでした。しかもその関係は、AIを使ってきた経験の長さによって変わります。", "unverified": "交互作用の向き（経験が長いほど強いのか）の詳細は抄録だけでは未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AI時代の孤独は所属と承認のずれ", "title": "Loneliness in the Age of AI and Digitally Mediated Relationships: The Affiliation–Affirmation Gap (Preprint)", "url": "https://doi.org/10.2196/preprints.114105", "authors": "Emma L. van der Schyff ほか", "venue": "JMIR Preprints", "date": "2026-10-13", "apa": "van der Schyff, E. L., & Campbell, A. J. (2026). Loneliness in the Age of AI and Digitally Mediated Relationships: The Affiliation–Affirmation Gap (Preprint). https://doi.org/10.2196/preprints.114105", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "デジタルやAIでつながっていても孤独になる理由を、「所属」と「承認」のずれとして説明する理論的論考（抄録）。", "p3": "自己肯定理論、社会的アイデンティティ理論、社会関係資本理論、社会的浸透理論を組み合わせ、ネットワーク上の所属（affiliation）と、自分らしさを認められる承認（affirmation）を区別する概念枠組みを提案した。実証データはない。", "p5": "SNSやAIの話し相手は所属を増やす一方で承認を弱めがちだとし、孤独を『交流がないこと』ではなく『本物の承認的なつながりがないこと』として捉え直すことを提案した（抄録）。", "fun": "友達リストが何百人いても寂しいことがあるのはなぜか、という身近な疑問に答えようとする論考です。『どこかに属している』感覚と『自分という人間を認めてもらえる』感覚は別物で、デジタルの世界は前者ばかりを増やしやすい、という見立てが面白い点です。", "unverified": "実証的な検証は含まれない理論的論考で、概念の測定方法は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "スマホ回答者のウェブ調査離脱と学歴の偏り", "title": "Who stops answering? Breakoff, smartphone use and educational bias in a web survey", "url": "https://doi.org/10.31235/osf.io/p2c59_v2", "authors": "Alžbeta Ľudmová ほか", "venue": "SocArXiv", "date": "2026-10-13", "apa": "Ľudmová, A., Kreidl, M., Hubatková, B., & Lakomý, M. (2026). Who stops answering? Breakoff, smartphone use and educational bias in a web survey. https://doi.org/10.31235/osf.io/p2c59_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ウェブ調査の途中離脱が学歴による偏りを強め、それがスマートフォンの小さな画面で特に大きいことを示した（抄録）。", "p3": "チェコの世代とジェンダー調査（2020〜2022年、5,468人、途中離脱244人）のウェブ回答とパラデータを使い、118の質問項目を時間の単位としてCox回帰とカプランマイヤー曲線で離脱を分析した。", "p5": "学歴が最も低い層の離脱は7%、最も高い層は3%だった。スマホ利用者では離脱率が高学歴4%から低学歴11%超まで上がり、大きな画面では3〜4%で平らだった（抄録）。", "fun": "アンケートを最後まで答えずにやめてしまう『途中離脱』を、病気の生存時間分析と同じ道具で調べたのが面白い点です。小さなスマホ画面では学歴による差が大きく開き、集まったデータが特定の人々に偏ってしまう仕組みが見えてきます。", "unverified": "なし"}}, {"id": "pr20", "rank": 20, "headline": "共感するAIは顧客の信頼を高めるか", "title": "Retailing with Empathetic AI: Examining the Effects of Emotional Intelligence Capabilities on Consumer Trust and Relationship Quality", "url": "https://doi.org/10.2139/ssrn.7602635", "authors": "Mary Johnson", "venue": "SSRN", "date": "2026-10-12", "apa": "Johnson, M. (2026). Retailing with Empathetic AI: Examining the Effects of Emotional Intelligence Capabilities on Consumer Trust and Relationship Quality. https://doi.org/10.2139/ssrn.7602635", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "感情を読み取って応じる小売のAIが、消費者の信頼と関係の質を高めることを示した調査研究（抄録）。", "p3": "英国のオンライン小売の消費者700人のパネル調査を、構造方程式モデリング（SEM）、多母集団の調整分析、ブートストラップの媒介分析で分析した。", "p5": "AIの感情知能が信頼に正の効果（β=0.412）を持ち、信頼が関係の質（β=0.456）と購買意図（β=0.378）を高めた。共感的な応答が信頼への効果を完全に媒介し、擬人化が関係の強さを調整した（抄録）。", "fun": "店のAIが『あなたの気持ちを分かっていますよ』と応じると、人はその店を信頼するのか、という問いです。結果では、共感的に応じることが信頼につながる経路の中心でした。機械の『思いやり』が本物でなくても効くのかを考えると、少し不思議な研究です。", "unverified": "AIの感情知能を回答者の知覚で測ったのか、実際の機能で操作したのかは抄録だけでは未確認。"}}, {"id": "pr21", "rank": 21, "headline": "構成概念のないエージェント評価ベンチマーク批判", "title": "Benchmarking Without Constructs: A Measurement Theory Critique of MCP Evaluation Frameworks", "url": "https://doi.org/10.2139/ssrn.7597219", "authors": "Himaneesh Sompalle", "venue": "SSRN", "date": "2026-10-12", "apa": "Sompalle, H. (2026). Benchmarking Without Constructs: A Measurement Theory Critique of MCP Evaluation Frameworks. https://doi.org/10.2139/ssrn.7597219", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "LLMエージェントの道具利用を測るMCPベンチマークが、測るべき構成概念を定義しないまま乱立していると指摘した論考（抄録）。", "p3": "古典的測定理論の観点から、MCP-Bench、MCP-Universe、MCPMarkなど3つのベンチマークを構成概念妥当性・評価の信頼性・再現性の軸で分析した。", "p5": "心理測定学の初期と同じく『測る対象の合意より先に道具が作られている』測定の危機にあるとし、構成概念の明示的な操作化、多特性の妥当性検証、学際的な合意形成を提案した（抄録）。", "fun": "『AIの道具を使う力』を測るテストがたくさん作られていますが、そもそも『道具を使う力』とは何かが決まっていない、という指摘です。100年前の心理学が知能テストで通った道を、AI評価がもう一度たどっているという見方が面白い点です。", "unverified": "各ベンチマークの具体的な問題点の詳細は抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "粘弾性を入れた不飽和土中空洞の間隙水圧", "title": "Influence of Kelvin-Voigt Viscoelasticity on Transient Pore Pressure Response of Cylindrical Cavities in Unsaturated Soil", "url": "https://doi.org/10.21203/rs.3.rs-11177446/v1", "authors": "Xiong Hao", "venue": "Research Square (In Review)", "date": "2026-10-13", "apa": "Hao, X. (2026). Influence of Kelvin-Voigt Viscoelasticity on Transient Pore Pressure Response of Cylindrical Cavities in Unsaturated Soil. https://doi.org/10.21203/rs.3.rs-11177446/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録、途中で切れている）を使用", "preprint": true, "short": true, "p1": "不飽和土中の円筒空洞の過渡的な間隙水圧応答の解析解を、土の骨格の粘弾性（ケルビン・フォークト型）を含むよう拡張した（抄録）。", "p3": "弾性・粘弾性の対応原理により、ラプラス領域でラメ定数を時間依存の形に置き換えるだけで、ヘルムホルツ分解とベッセル関数の解の構造、境界条件をそのまま使えるようにした。逆ラプラス変換はDen Iseger法で数値的に行う。", "p5": "未確認（取得できた抄録が途中で切れており、結果の記述を確認できず）。", "fun": "粘土のように『ゆっくり変形する』土の性質を入れるのに、式を一から解き直さなくても済む、というのが面白い点です。ばねにダンパーを並べたモデルは、周波数の世界では『ばねの硬さが周波数で変わる』と見なせるので、既存の解をそのまま使い回せます。", "unverified": "抄録が途中で切れており、数値結果と粘性の影響の大きさは未確認。"}}, {"id": "pr23", "rank": 23, "headline": "凍上を多孔質力学で連成解析", "title": "Numerical investigation of frost heave in soils: a poromechanic approachs", "url": "https://doi.org/10.2139/ssrn.7606738", "authors": "Jinfeng Li ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Li, J., Dangla, P., Shan, F., Pereira, J.-M., Wang, Y., & Teng, J. (2026). Numerical investigation of frost heave in soils: a poromechanic approachs. https://doi.org/10.2139/ssrn.7606738", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多孔質力学にもとづく熱・水・力学の連成モデルで、土の凍上が2段階で進むことを示した（抄録）。", "p3": "凍結面の進行に伴う間隙水の移動、凍結吸引（クライオサクション）、局所的な応力の再配分を連成して解き、境界条件、初期含水量、材料特性、冷却履歴、試料形状のパラメータ解析を行った。", "p5": "凍上は、凍結吸引と凍結圧による初期の収縮段階と、凍結面での水の流れのピークに伴う凍上段階に分かれた。凍結パラメータが支配的で、ヤング率とポアソン比が大きいと凍上は抑えられた（抄録）。", "fun": "冬に道路や地面が持ち上がる『凍上』は、水が凍って膨らむだけでは説明できません。凍る場所に周りから水が吸い寄せられ、氷の層（アイスレンズ）が育つからです。この研究は、まず縮んでから膨らむという2段階の過程をモデルで再現しました。", "unverified": "モデルの実験による検証の有無と、数値的な大きさは抄録では未確認。"}}, {"id": "pr24", "rank": 24, "headline": "飛行試験の衝撃・乱流による運用モード解析", "title": "Dornier Seastar CD2 – Flutter Flight Test – Impulse and Turbulence Based OMA Using FFT, Nyquist, PSD and SVD", "url": "https://doi.org/10.5281/zenodo.23304259", "authors": "Graf ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Graf, A., & Vollan, A. (2026). Dornier Seastar CD2 – Flutter Flight Test – Impulse and Turbulence Based OMA Using FFT, Nyquist, PSD and SVD. Zenodo. https://doi.org/10.5281/ZENODO.23304259", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの短い抄録を使用", "preprint": true, "short": true, "p1": "小型水上機のフラッター飛行試験で、衝撃と乱流を入力とする運用モード解析（OMA）の方法を開発した報告（抄録）。", "p3": "衝撃入力ではFFT、ラプラス変換、2次元・3次元のナイキスト線図に周波数領域分解（FDD）を加え、乱流入力ではパワースペクトル密度（PSD）と特異値分解（SVD）でモードを同定する。", "p5": "未確認（抄録は手法の説明のみで、同定結果の記載なし）。", "fun": "飛行機の翼が空気の力で激しく揺れ始める『フラッター』は危険なので、試験飛行で振動の性質を調べます。入力を測らなくても、たたいた揺れや乱気流での揺れだけから固有の揺れ方を取り出す、という点で、橋を通る車の揺れから橋の性質を探る考え方と通じています。", "unverified": "同定された振動数・減衰などの結果は抄録になく未確認。審査のない置き場の文書。"}}, {"id": "pr25", "rank": 25, "headline": "南アの旧鉱業都市にみるスマートシティの矛盾", "title": "The Smart City in South Africa: The Conflicts of a Developmental Transformation and Urban Optimisation The Smart City and Urban Optimisation", "url": "https://doi.org/10.21203/rs.3.rs-11013951/v1", "authors": "kentse Sesele", "venue": "Research Square (In Review)", "date": "2026-10-13", "apa": "Sesele, k. (2026). The Smart City in South Africa: The Conflicts of a Developmental Transformation and Urban Optimisation The Smart City and Urban Optimisation. https://doi.org/10.21203/rs.3.rs-11013951/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "南アフリカの旧金鉱業都市を例に、スマートシティ化が地域の発展能力に制約されることを示した事例研究（抄録）。", "p3": "開発国家論と批判的スマート都市論を結び、マチャベン市の自治体・財政・インフラ・社会経済の長期データから、生産的雇用、財政動員、サービス提供、制度の正統性の4つの地域能力を検討した。", "p5": "生産基盤の縮小、財政動員の弱体化、サービスインフラの劣化、統治の問題が、技術の吸収とデジタル参加を制約していた。スマート技術は『地域的に中立な都市』に入るわけではないと結論づけた（抄録）。", "fun": "『最新技術を入れれば街は賢くなる』という考えに、待ったをかける研究です。鉱山が閉じて税収や雇用が減った街では、技術を支える土台そのものが弱っています。技術の効果は、それが置かれる街の歴史に左右されるという視点が面白い点です。", "unverified": "用いた指標と期間の詳細は抄録では未確認。"}}, {"id": "pr26", "rank": 26, "headline": "待ち行列を考えた自動運転車のエコドライブ", "title": "A Queue-Aware Multi-Agent Eco-Driving Model for Connected and Automated Vehicles at a Signalized Intersection in Mixed Traffic", "url": "https://doi.org/10.20944/preprints202610.0988.v1", "authors": "Wenming Rao ほか", "venue": "Preprints.org", "date": "2026-10-13", "apa": "Rao, W., Zhou, Z., An, C., & Chen, D. (2026). A Queue-Aware Multi-Agent Eco-Driving Model for Connected and Automated Vehicles at a Signalized Intersection in Mixed Traffic. https://doi.org/10.20944/preprints202610.0988.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "信号交差点の待ち行列を考慮した強化学習の自動運転車エコドライブで、混在交通のCO2を減らせることを示した（抄録）。", "p3": "待ち行列の解消を考えた実効青時間の推定と、自車と後続車の排出を合わせた報酬を、近接方策最適化（PPO）の制御器に組み込み、SUMOで交通量と自動運転車の普及率を変えて評価した。", "p5": "多くの条件でCO2が減り、普及率が高いほど削減率が増えた。1200台/時では普及率10%から70%で削減率が7.0%から25.6%に上がった。アブレーションで2つの工夫の両方が寄与した（抄録）。", "fun": "青信号でも前に車が並んでいればすぐには進めません。この当たり前の事実を入れるだけで、自動運転車の『省エネ運転』が賢くなります。しかも自分の車だけでなく後ろの車の排出も報酬に入れることで、周りを巻き込んで全体の排出を減らす点が面白いところです。", "unverified": "人間運転車のモデル化の仕方と交差点の条件の詳細は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "全予算事業を事後検証する機関の制度設計", "title": "決算検証院構想 —— 事後的効果検証機関の制度設計", "url": "https://doi.org/10.5281/zenodo.23339910", "authors": "とまと", "venue": "Zenodo", "date": "2026-10-13", "apa": "とまと. (2026). 決算検証院構想 —— 事後的効果検証機関の制度設計 (Version v1.0). Zenodo. https://doi.org/10.5281/ZENODO.23339910", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの日本語抄録を使用", "preprint": true, "short": true, "p1": "日本の予算事業を独立に事後検証する機関として、国会に置く「決算検証院」を提案した制度設計の論考（抄録）。", "p3": "会計検査院の有効性検査、政策評価法の政策評価、行政事業レビューの3系統を比べ、独立性・網羅性・予算への接続を同時に満たす主体がないことを示したうえで、制度案を組み立てた。", "p5": "原則として全予算事業を、削減前の供給能力評価と執行後の効果検証の2軸で毎年度評価し、継続・縮小・廃止を非拘束で勧告する。退ける場合は理由の公開を義務づけ、支出IDで資金を追跡する（抄録）。", "fun": "税金の使い道が『本当に効いたのか』を誰がチェックするのかという問いです。すでに3つの仕組みがあるのに、どれも『政府から独立』『全部の事業』『予算に反映』を同時には満たさない、という整理が分かりやすい点です。勧告に強制力を持たせない代わりに、無視するなら理由を公開させる工夫も面白いところです。", "unverified": "審査のない置き場の文書で、実現可能性の検討の深さは未確認。"}}, {"id": "pr28", "rank": 28, "headline": "先端AIモデルの監査人は誰であるべきか", "title": "Who May Audit a Frontier Model? Independence, Jurisdiction and the Assurance Profession", "url": "https://doi.org/10.2139/ssrn.7592858", "authors": "Thomas Serval", "venue": "SSRN", "date": "2026-10-13", "apa": "Serval, T. (2026). Who May Audit a Frontier Model? Independence, Jurisdiction and the Assurance Profession. https://doi.org/10.2139/ssrn.7592858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "先端AIモデルの外部監査人は誰であるべきかを、財務監査の独立性の基準から論じた論考（抄録）。", "p3": "非財務の保証業務の国際基準（ISAE 3000改訂版）、独立性の倫理規程（IESBA）、公的監督の制度（PCAOBなど）を手がかりに、財務監査の前例から監査人の要件を導いた。", "p5": "AI安全系の非営利評価団体も大手コンサルティング網も独立性の要件を満たさないと論じ、6つの適格基準を導いた。監査対象とは別の法域に置く監査人を中心に据え、国際的な独立監査人の団体を提案した（抄録）。", "fun": "AIの安全性を『外部の監査人』が確かめるとして、その監査人を誰にするかは意外と難しい問題です。この論考は、会社の決算をチェックする会計監査が長年かけて作ってきた『独立性』のルールを、そのままAIに当てはめようとしています。古い制度の知恵を新しい技術に生かす発想が面白い点です。", "unverified": "抄録にある政策的な合意（2026年9月29日）の内容は原文の主張のまま記載し、外部では未確認。"}}, {"id": "pr29", "rank": 29, "headline": "診療室の建築イメージが燃え尽きを左右する", "title": "The \"therapeutic space\" as a strategic professional resource: architectural imagery's impact on efficacy and burnout in mental healthcare", "url": "https://doi.org/10.5281/zenodo.23324616", "authors": "Gorbenko ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Gorbenko, S., Khokhlina, O., Omelchenko, Y., Vlasenko, S., Lazos, G., & Ichanska, O. (2026). The \"therapeutic space\" as a strategic professional resource: architectural imagery's impact on efficacy and burnout in mental healthcare. Zenodo. https://doi.org/10.5281/ZENODO.23324616", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "診療室の建築のタイプが、精神保健の専門職の効力感と燃え尽きリスクの評価を大きく左右することを示した（抄録）。", "p3": "精神保健の専門職150人に、4種類の診療室（ミニマリスト、バイオフィリック、クラシック、カオス）の3D画像を順序を入れ替えて評価させる被験者内の準実験を行い、ビッグファイブ性格と合わせて反復測定分散分析と相関で分析した。", "p5": "植物など自然を取り入れたバイオフィリックな部屋で快適さ（6.21）と効力感（6.05）が最も高く、燃え尽きリスク（1.87）が最も低かった。散らかった部屋は燃え尽きリスク5.98で、神経症傾向（r=0.58）と誠実性（r=0.62）が苦痛を強めた（抄録）。", "fun": "働く部屋の見た目だけで、仕事の自信や疲れの感じ方がここまで変わるのか、という結果です。緑のある部屋が良く散らかった部屋が悪いのは直感どおりですが、まじめな人ほど散らかった部屋でつらく感じる点は意外です。ただし実際に働いたのではなく、画像を見た評価である点に注意が要ります。", "unverified": "画像評価による準実験で、実際の職場での効果は未確認。審査のない置き場の文書。"}}, {"id": "pr30", "rank": 30, "headline": "職場に持ち込まれるエコ不安と従業員エンゲージメント", "title": "When Climate Concern Comes to Work: Eco-Anxiety and Employee Engagement", "url": "https://doi.org/10.2139/ssrn.7600478", "authors": "Laurianne Le Chalony ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Le Chalony, L., & Harkiolakis, N. (2026). When Climate Concern Comes to Work: Eco-Anxiety and Employee Engagement. https://doi.org/10.2139/ssrn.7600478", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "気候変動への不安（エコ不安）が強くても、仕事へのエンゲージメントは高いままでありうることを示した混合研究（抄録）。", "p3": "民間企業の従業員182人の量的データと10人のインタビューを順に組み合わせる説明的混合法で、エコ不安と職場の（非）エンゲージメントの枠組み（EWD）を作り、改良した。", "p5": "強いエコ不安と高いエンゲージメントは両立しえた。心理社会的・組織的の2次元は同時に入れるとどちらもエンゲージメントを単独で予測しなかった。インタビューでは主体性、意味、価値の一致、組織の真正性が仕組みとして浮かんだ（抄録）。", "fun": "『地球の未来が心配で仕事に身が入らない』とは限らない、という結果です。会社の取り組みが本物だと感じられ、自分も何かできると思えれば、不安を抱えながらも仕事に打ち込める。不安そのものより、それを受け止める職場の資源が大事だという見方が面白い点です。", "unverified": "エンゲージメントの測定尺度と回帰の数値は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "成長機会と報酬は看護職の燃え尽きの別次元に効く", "title": "Differential associations of professional growth and compensation with exhaustion and disengagement among nursing staff in U.S. health centers: A cross-sectional study", "url": "https://doi.org/10.2139/ssrn.7590056", "authors": "Xiao Li ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Li, X., Park, J. M., Zhu, J., & Young-Rock, H. (2026). Differential associations of professional growth and compensation with exhaustion and disengagement among nursing staff in U.S. health centers: A cross-sectional study. https://doi.org/10.2139/ssrn.7590056", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "看護職の燃え尽きの2つの次元に、成長の機会と報酬がそれぞれ別々に効くことを示した横断研究（抄録）。", "p3": "米国の公的支援を受けた医療センターの従業員well-being調査から看護職5,652人を分析した。因子分析で疲弊と離脱の2次元を確かめ、頑健標準誤差の重回帰と潜在プロファイル分析で職場の資源との関係を調べた。", "p5": "成長の機会は離脱の低さと関連した（β=-0.247）が疲弊とは関連しなかった。報酬・福利厚生は疲弊の低さと関連した（β=-0.048）が離脱とは関連しなかった。両者の交互作用は有意でなかった（抄録）。", "fun": "『燃え尽き』は1つのものではなく、『くたくたに疲れる』ことと『仕事に気持ちが向かなくなる』ことの2つに分かれます。この研究では、給料は前者に、成長の機会は後者に効くという分業が見えました。対策を考えるときに、どちらの燃え尽きなのかを見分ける意味が分かります。", "unverified": "なし"}}, {"id": "pr32", "rank": 32, "headline": "施設で育つ若者にとってのメンターの意味", "title": "Mentorship as a Bridge: Significant Adults and the Future Self of Adolescents in Institutional Care", "url": "https://doi.org/10.2139/ssrn.7589349", "authors": "Maria Kozlova ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Kozlova, M., Iakimova, O., & Madfes, O. (2026). Mentorship as a Bridge: Significant Adults and the Future Self of Adolescents in Institutional Care. https://doi.org/10.2139/ssrn.7589349", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "親の養育を受けずに施設で育つ若者にとって、ボランティアのメンターが『今の自分』と『なりたい自分』をつなぐ存在であることを示した（抄録）。", "p3": "ロシアの家庭養育支援センターで暮らしメンタリングに参加する14〜17歳の33人に、半構造化面接、投影法、修正版の意味微分法を用い、Wilcoxon検定、並べ替え検定、多次元尺度構成法などで分析した。", "p5": "大人との関係は『実際に会えること』と『象徴的な近さ』の2次元で4つの位置に分かれた。未来の自分は今の自分より自立的・自信がある方向に評価され、未来の自分に最も近いのは『幸せな人』とメンターだった（抄録）。", "fun": "子どもにとって大切な大人は、肩書きで決まるのではない、という結果です。長く付き合い、自分から来てくれて、対等で、施設の外でも会える人が大切になる。メンターは『今の話し相手』であると同時に『将来の見本』でもある、という二重の役割が面白い点です。", "unverified": "標本が33人と小さく、一般化の範囲は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "生成AIは人間関係をどう変えるか：統合的レビュー", "title": "Social Relationships in the Age of Artificial Intelligence: Profound Shifts and New Challenges—An Integrative Literature Review", "url": "https://doi.org/10.20944/preprints202610.1164.v1", "authors": "Safran Safar Almakaty", "venue": "Preprints.org", "date": "2026-10-13", "apa": "Almakaty, S. S. (2026). Social Relationships in the Age of Artificial Intelligence: Profound Shifts and New Challenges—An Integrative Literature Review. https://doi.org/10.20944/preprints202610.1164.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "会話AIはその場の孤独を和らげても、人を長く支える関係の蓄積は作れないことを、文献の統合レビューで論じた（抄録）。", "p3": "関係科学、人と機械のコミュニケーション研究、調査、実験、縦断パネル、無作為化試験、メタ分析を2026年9月まで統合し、アラブ社会の知見も含めて『応答性と互恵性の橋』モデルを提案した。", "p5": "若者の少なくない割合が悲しいときにチャットボットを使い、短期的には人と話すのと同程度に孤独が減る。一方、無作為化実験では支援的なチャットボットより人間の仲間が上回り、交友目的の集中的な利用は孤独の増加と関連した（抄録）。", "fun": "AIと話すと寂しさが和らぐのは『ちゃんと聞いてもらえた』と感じるからです。でも友情には、お互いに必要とし合うこと、犠牲を払うこと、一緒に過ごした歴史が要ります。AIは人とのつながりへの『橋』にはなれても『代わり』にはなれない、という整理が分かりやすい点です。", "unverified": "統合した研究の数と選び方は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "繰り返す洪水で住民のリスク認知はどう変わるか", "title": "Flood risk perception and behavioural responses in conditions of repeated floods: evidence from Bagnacavallo (Ravenna, Italy)", "url": "https://doi.org/10.21203/rs.3.rs-10812202/v1", "authors": "Alexandra D'Angelo ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "D’Angelo, A., Marcon, L., Gil-Gallen, S., Petitta, M., & Andrighetto, G. (2026). Flood risk perception and behavioural responses in conditions of repeated floods: evidence from Bagnacavallo (Ravenna, Italy). https://doi.org/10.21203/rs.3.rs-10812202/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "洪水が繰り返し起きる町で、住民のリスク認知と協力行動がどう変わるかを調べた事例研究（抄録）。", "p3": "2023年以降に洪水が繰り返したイタリアのバニャカヴァッロで、3回のフォーカスグループと100人の調査を行い、リスク認知の変化と、対人協力・気候対策行動への影響を調べた。", "p5": "繰り返す災害は一時的な衝撃ではなく長期の社会的ストレスとして働き、協力、対立、制度への不信が絡み合う形で集団の行動とリスク認知を作り変えていた（抄録）。", "fun": "『めったにない災害』が『よくある災害』に変わったとき、地域のつながりは強くなるのか弱くなるのか、という問いです。助け合いが生まれる一方で、対立や行政への不信も生まれるという複雑な姿が見えてきます。気候変動の時代に多くの地域が直面しうる問題です。", "unverified": "調査の具体的な数値結果は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "無人の自動運転バスで乗客を誰が支えるか", "title": "Passenger Support in Autonomous Public Transport: A Systematic Review of Protection, Assistance, and Service Continuity", "url": "https://doi.org/10.2139/ssrn.7603081", "authors": "Shayan Khanmohammadidoustani ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Khanmohammadidoustani, S., Mohammadi, A., Sriraj, P. S., & Yigitcanlar, T. (2026). Passenger Support in Autonomous Public Transport: A Systematic Review of Protection, Assistance, and Service Continuity. https://doi.org/10.2139/ssrn.7603081", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "乗務員のいない自動運転バスで乗客をどう守り助けるかについて、研究の証拠と空白を整理した系統的レビュー（抄録）。", "p3": "Scopus、Web of Science、ProQuestを2026年9月に検索し、63本の論文を、問題の認識、助けの要請、連絡と優先度判定、支援の提供、解決の確認という5つの支援機能に分けて統合した。", "p5": "支援を扱う49本のうち35本は主に乗客のニーズや知覚に関するもので、緊急度の判定は2本、解決の確認も2本だけだった。乗務員なしの通常運行で支援の提供とその結果の両方を記録した研究はなかった（抄録）。", "fun": "運転手がいないバスで、具合が悪くなった人や困った人を誰がどう助けるのか。技術の部品はそろいつつあっても、『助けを求めてから解決するまで』をつなげて確かめた研究はまだない、という指摘です。自動化で消える人の役割の大きさが見えてきます。", "unverified": "なし"}}, {"id": "pr36", "rank": 36, "headline": "新しい店の出店は近隣店の需要を増やすか", "title": "Like a Good Neighbor? Demand Spillovers from Recreational Cannabis Dispensary Openings to Nearby Retail Establishments", "url": "https://doi.org/10.2139/ssrn.7603219", "authors": "Ecem Basak ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Basak, E., Sanatizadeh, A., & Hong, K. (2026). Like a Good Neighbor? Demand Spillovers from Recreational Cannabis Dispensary Openings to Nearby Retail Establishments. https://doi.org/10.2139/ssrn.7603219", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "大麻販売店の出店が、近隣の店の客数と売上を増やすことを示した（抄録）。", "p3": "イリノイ州の2021〜2024年の段階的な出店を使い、行政の店舗記録と近隣の事業所の月次の客数・取引・売上を組み合わせて、差の差分析を行った。", "p5": "出店で近隣の客数は約6.82%、取引は8.01%、売上は7.47%増えた。増加は来店客の増加によるもので、客1人あたりの売上は変わらなかった。飲食と生活必需品の店、チェーン店、歩きやすい地区で効果が大きかった（抄録）。", "fun": "新しい店ができると周りの店は客を奪われるのか、それとも人通りが増えて得をするのか。この研究では後者でした。しかも得をするのはチェーン店で個人店ではないという結果は、人の流れが増えても、それを受け止める側の準備で恩恵が変わることを示しています。", "unverified": "なし"}}, {"id": "pr37", "rank": 37, "headline": "同族中小企業のAI導入意図と組織の準備度", "title": "Digital Entrepreneurial Orientation and AI Adoption Intention in Family SMEs: The Mediating Role of Organizational AI Readiness", "url": "https://doi.org/10.2139/ssrn.7600860", "authors": "Masoud Abdollahi Mousavi", "venue": "SSRN", "date": "2026-10-13", "apa": "Abdollahi Mousavi, M. (2026). Digital Entrepreneurial Orientation and AI Adoption Intention in Family SMEs: The Mediating Role of Organizational AI Readiness. https://doi.org/10.2139/ssrn.7600860", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "同族の中小企業でデジタル志向がAI導入意図につながるのは、組織のAI準備度を通じてであることを示した調査研究（抄録）。", "p3": "イランの同族中小企業274社の横断調査をPLS-SEMで分析し、デジタル起業家志向、組織のAI準備度（経営・人材・技術とデータ・資源とプロセス）、AI導入意図の関係と、家族の経営関与の調整効果を調べた。", "p5": "志向は準備度と正に関連し（β=0.53）、準備度は意図と正に関連した（β=0.42）。準備度は関係の約44%を媒介し（間接効果0.22）、媒介は人材と技術・データの準備度が担った。家族の関与による調整は見られなかった（抄録）。", "fun": "『AIを使いたい』という社長の気持ちだけでは導入は進まず、人とデータの準備がその橋渡しをする、という結果です。著者自身が事前登録なしの横断調査であることを明記し、結果を『関連』にとどめている点も誠実です。", "unverified": "なし"}}, {"id": "pr38", "rank": 38, "headline": "粗視化CFD-DEMで流動層ガス化を予測", "title": "PREDICTIVE MODELING OF COAL GASIFICATION IN FLUIDIZED BEDS: A COARSE-GRAINED CFD-DEM APPROACH VALIDATED AT PILOT SCALE", "url": "https://doi.org/10.2139/ssrn.7606985", "authors": "Subi Nath ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Nath, S., & Roy, S. (2026). PREDICTIVE MODELING OF COAL GASIFICATION IN FLUIDIZED BEDS: A COARSE-GRAINED CFD-DEM APPROACH VALIDATED AT PILOT SCALE. https://doi.org/10.2139/ssrn.7606985", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "流動層での石炭ガス化を、反応を含む粗視化粒子法（MP-PIC）で予測し、パイロット規模の実験で検証した（抄録）。", "p3": "気泡流動層ガス化炉の流体力学に、揮発分の放出、チャーの不均一反応、気相反応を結合したMP-PICモデルを作り、灰分の多い石炭の複数の運転条件のパイロット実験と比べた。酸素と水蒸気の流量でパラメータ解析を行った。", "p5": "合成ガスの組成と軸方向の温度分布の予測は実験とおおむね一致した。入口の酸素と水蒸気の流量が合成ガスの収率と組成を強く左右した（抄録）。", "fun": "流動層の中では無数の粒子がぶつかり合いながら燃えたり反応したりします。1粒ずつ計算すると重すぎるので、似た粒子をまとめて『代表粒子』として扱うことで、実機に近い規模でも計算できるようにしています。", "unverified": "一致の程度の数値は抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "コンフォーマル予測で非破壊検査の異常検知に不確実性", "title": "Unsupervised Defect Detection across NDT Modalities: A Conformal Anomaly DetectionFramework to quantify uncertainty in decision making", "url": "https://doi.org/10.2139/ssrn.7602427", "authors": "Ahmed HAMDI ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "HAMDI, A., ESTERMANN, F., Kaftandjian, V., DELACHARTRE, P., & GUY, P. (2026). Unsupervised Defect Detection across NDT Modalities: A Conformal Anomaly DetectionFramework to quantify uncertainty in decision making. https://doi.org/10.2139/ssrn.7602427", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "欠陥のないデータだけで学習する異常検知に、コンフォーマル予測でp値を付け、非破壊検査の判断に不確実性を示せるようにした（抄録）。", "p3": "変分オートエンコーダの再構成残差と、凍結したDINOv2の特徴のメモリーバンクという2つの異常スコアを、共通のコンフォーマル異常検知の枠組みでp値に変換し、X線CT、レール表面、超音波溶接、振動スペクトログラムの4つのデータで評価した。", "p5": "特徴ベースの方法が4つ中3つのデータで最良のF1を示し、X線CTでは再構成ベースが優位だった。超音波ではF1=0.94、振動信号ではVAEでF1=0.85に達した（抄録）。", "fun": "『壊れた例』をほとんど集められない検査で、正常な例だけから『いつもと違う』を見つける方法です。さらに『どれくらい珍しいか』を確率（p値）で示すので、判断の自信の度合いが分かります。", "unverified": "なし"}}, {"id": "pr40", "rank": 40, "headline": "思考連鎖プロンプトの戦略比較", "title": "Does More Deliberation Help? A Comparative Evaluation of Chain-of-Thought Prompting Strategies for Grade-School Math Reasoning in Open-Source Instruction-Tuned Language Models", "url": "https://doi.org/10.21203/rs.3.rs-11327774/v1", "authors": "Arun Kumar", "venue": "Research Square (In Review)", "date": "2026-10-13", "apa": "Kumar, A. (2026). Does More Deliberation Help? A Comparative Evaluation of Chain-of-Thought Prompting Strategies for Grade-School Math Reasoning in Open-Source Instruction-Tuned Language Models. https://doi.org/10.21203/rs.3.rs-11327774/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録、途中で切れている）を使用", "preprint": true, "short": true, "p1": "小型のオープンLLMで、思考連鎖（CoT）プロンプトの4つの方法の効果を統制して比べた（抄録）。", "p3": "Mistral-7B、Phi-3-mini、Llama-3-8Bの3モデルで、ゼロショットCoT、少数例CoT、自己整合性、思考の木（ToT）を、GSM8Kの100問で比べ、95%信頼区間とMcNemarの正確検定で差を検定した。", "p5": "3モデルとも、少数例CoTと自己整合性がゼロショットCoTを有意に上回り、正答率の差は12〜40ポイントだった（抄録）。ToTの結果は抄録が途中で切れており未確認。", "fun": "大きなAIで効くとされる『考え方の手順を示す』工夫が、手元で動く小さなAIでも効くのかを確かめた研究です。例を見せてから解かせる方法や、何度か解かせて多数決をとる方法がよく効きました。", "unverified": "抄録が途中で切れており、思考の木（ToT）の結果と問題数100の制約の影響は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "気候移行リスクを入れた構造型信用リスクモデル", "title": "Integrating Climate Transition Risk into Structural Credit Risk Models: A Dynamic Merton Framework with Stochastic Volatility", "url": "https://doi.org/10.2139/ssrn.7596720", "authors": "Henry Mayambu", "venue": "SSRN", "date": "2026-10-12", "apa": "Mayambu, H. (2026). Integrating Climate Transition Risk into Structural Credit Risk Models: A Dynamic Merton Framework with Stochastic Volatility. https://doi.org/10.2139/ssrn.7596720", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "マートンの構造型信用リスクモデルに、気候移行ショックと確率的ボラティリティを加えた（抄録）。", "p3": "炭素価格、規制上の罰則、消費者の選好の変化が、炭素集約的な企業の資産価値のドリフトとボラティリティを変えるように定式化し、模擬した貸借対照表と市場パラメータで炭素税の経路とデフォルト確率・信用スプレッドを評価した。", "p5": "標準的なマートンモデルは、排出強度の高い企業の中長期のデフォルトリスクを大きく過小評価した。Pythonの実装も提供する（抄録）。", "fun": "会社の価値が借金を下回ったら倒産、と考えるのがマートンモデルです。そこに『将来の炭素税で会社の価値の伸びが削られる』効果を入れると、炭素を多く出す企業の倒産確率がもっと高く見積もられます。模擬データでの検証である点は差し引いて読む必要があります。", "unverified": "模擬データでの評価で、実データでの検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "生成AIは選ぶ段階より探す段階で使え", "title": "Too Late to Prune: Generative AI, the Screen, and Team Creative Decisions", "url": "https://doi.org/10.2139/ssrn.7592800", "authors": "Difang Huang ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Huang, D., Yu, S., Chen, F., & Zhou, W. (2026). Too Late to Prune: Generative AI, the Screen, and Team Creative Decisions. https://doi.org/10.2139/ssrn.7592800", "why": "148チームの事前登録実験で、同じ時間のAI利用でも選別段階に回すと創造的成果が下がることを示した。"}, {"id": "pn02", "rank": 2, "field": "組織行動・心理的安全性", "headline": "部下をAIに替えるとリーダーが働かなくなる", "title": "The Hidden Value of Human Followers", "url": "https://econpapers.repec.org/RePEc:zbw:esprep:344041", "authors": "Hattori, Keisuke", "venue": "RePEc NEP", "date": "2026-10-12", "why": "人間の部下がリーダーの努力を観察し応えるという補完性から、AI導入がチームの産出を下げうることを理論的に示した。"}, {"id": "pn03", "rank": 3, "field": "経営学", "headline": "AI単独のゲームが人間の作品より売れた", "title": "Creative Destruction: Human-AI Competition in an Experimental Market", "url": "https://doi.org/10.2139/ssrn.7603138", "authors": "John J. Conlon ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Conlon, J. J., & Schwardmann, P. (2026). Creative Destruction: Human-AI Competition in an Experimental Market. https://doi.org/10.2139/ssrn.7603138", "why": "1,025人の3つの実験で、人間の『センス』や人間製への選好という仮説を支持する証拠が見られなかった。"}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "オンポリシー蒸留より初期生徒の出力で蒸留が良い", "title": "When Do We Need On-Policy Distillation? Distilling on Offline Student Rollouts Is Often Better", "url": "https://arxiv.org/abs/2610.11291", "authors": "Siyan Zhao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Zhao, S., Fu, Y., Jiang, J., Liu, S.-Y., Bian, S., Lee, B.-K., Sreenivas, S. T., Dai, W., Ye, H., Grover, A., & Molchanov, P. (2026). When Do We Need On-Policy Distillation? Distilling on Offline Student Rollouts Is Often Better (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11291", "why": "17の教師・生徒の組で、簡単な代替法がOPDを14組で上回り、訓練も大幅に速いことを示した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "点と箱で物を指すロボット用グラウンディング基盤", "title": "GroundingPI: A Grounding Foundation Model towards Physical Intelligence with Visual Primitives", "url": "https://arxiv.org/abs/2609.39601", "authors": "Qize Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-13", "apa": "Yu, Q., Fan, L., Chen, B., Liang, J., Ding, X., Chen, Y., Song, Z., Wang, Y., Zou, Y., Wang, K., Chen, T., Song, W., Zhou, B., Li, M., Huang, S., Ye, Y., Jiang, C., Wei, W., Wu, R., … Huang, S. (2026). GroundingPI: A Grounding Foundation Model towards Physical Intelligence with Visual Primitives (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.39601", "why": "4Bパラメータのモデルで、雑然とした場面や小さな物体の位置特定を制御に使える速さで行う。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "通貨安ショックで家計の物価予想が最も動く", "title": "How Exchange Rate Shocks Shape Beliefs: Evidence from Households, Firms, and Professionals", "url": "https://doi.org/10.2139/ssrn.7601658", "authors": "Okan Akarsu ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Akarsu, O., & Aktug, E. (2026). How Exchange Rate Shocks Shape Beliefs: Evidence from Households, Firms, and Professionals. https://doi.org/10.2139/ssrn.7601658", "why": "トルコの2015〜2024年で、家計・企業・専門家の順に物価予想の反応が強い階層を示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "金融引き締めで家賃が上がる理由は市場分断", "title": "Housing Market Segmentation and Monetary Policy", "url": "https://doi.org/10.2139/ssrn.7603923", "authors": "Pablo De Llanos", "venue": "SSRN", "date": "2026-10-13", "apa": "De Llanos, P. (2026). Housing Market Segmentation and Monetary Policy. https://doi.org/10.2139/ssrn.7603923", "why": "持ち家と賃貸の分断で引き締め時に賃貸需要が増え家賃が上がる仕組みを、推定したニューケインジアンモデルで定量化した。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "高次元パネル分位点回帰を交互固定効果つきで推定", "title": "Estimation and Inference for High-Dimensional Panel Quantile Regression Models with Interactive Fixed Effects", "url": "https://doi.org/10.2139/ssrn.7606861", "authors": "Minyuan Zhang ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Zhang, M., & Su, L. (2026). Estimation and Inference for High-Dimensional Panel Quantile Regression Models with Interactive Fixed Effects. https://doi.org/10.2139/ssrn.7606861", "why": "回帰変数が標本より多い場合でも、潜在因子を除いて分位点の係数を推定・推論する方法を示した。"}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "構造推定の数値近似誤差はいつ問題になるか", "title": "When Does Numerical Approximation Matter? Equilibrium Feedback and Bias Correction", "url": "https://doi.org/10.2139/ssrn.7595039", "authors": "Kyoo il Kim ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Kim, K. i., Kim, I. K., & Kim, H. (2026). When Does Numerical Approximation Matter? Equilibrium Feedback and Bias Correction. https://doi.org/10.2139/ssrn.7595039", "why": "不動点の近似誤差とパラメータの偏りを結ぶ枠組みで、動学離散選択や動学ゲームでの評価基準を示した。"}, {"id": "pn10", "rank": 10, "field": "地震工学・防災", "headline": "ブラジルの自治体の災害の多様さと複合被害", "title": "Municipal hazard diversity and compound disaster impacts across Brazil", "url": "https://doi.org/10.2139/ssrn.7607403", "authors": "Maria de Andrade Rocha Alenca Castro ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Castro, M. d. A. R. A., Gomes Jr., M. N., Nguyen, P., Mendiondo, E. M., de Moraes, O. L. L., Ambrizzi, T., & Marengo, J. (2026). Municipal hazard diversity and compound disaster impacts across Brazil. https://doi.org/10.2139/ssrn.7607403", "why": "76,191件の自治体記録から、災害の種類の組み合わせと被害の大きさの関係を分析した。"}, {"id": "pn11", "rank": 11, "field": "心理学・認知科学", "headline": "顔認識の得意不得意を決める計算過程", "title": "Individual differences in the computational processes that support face recognition", "url": "https://doi.org/10.31234/osf.io/q9gcu_v1", "authors": "Fournier Raphaël ほか", "venue": "PsyArXiv", "date": "2026-10-12", "apa": "Raphaël, F., Downing, P., & Ramsey, R. (2026). Individual differences in the computational processes that support face recognition. https://doi.org/10.31234/osf.io/q9gcu_v1", "why": "300人の実験と数理モデルで、顔認識能力の個人差が意思決定過程のどのパラメータに対応するかを調べた。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "テスト時適応でコンフォーマル保証が崩れる理由", "title": "Diagnosing and repairing the conformal coverage guarantee of test-time-adapted image classifiers", "url": "https://doi.org/10.2139/ssrn.7602585", "authors": "Mohammad Reza Mahdiani", "venue": "SSRN", "date": "2026-10-12", "apa": "Mahdiani, M. R. (2026). Diagnosing and repairing the conformal coverage guarantee of test-time-adapted image classifiers. https://doi.org/10.2139/ssrn.7602585", "why": "エントロピー最小化型の適応が信頼度を自ら作ってしまう問題を診断し、保証を修復する方法を示した。"}, {"id": "pn13", "rank": 13, "field": "因果推論", "headline": "環境を越えて安定な因果的特徴で投資シグナル", "title": "Invariant Causal Representation Learning for Alpha Generation: A Framework for Out-of-Distribution Generalization in Non-Stationary Financial Markets", "url": "https://doi.org/10.2139/ssrn.7602365", "authors": "Ishan Saraf", "venue": "SSRN", "date": "2026-10-13", "apa": "Saraf, I. (2026). Invariant Causal Representation Learning for Alpha Generation: A Framework for Out-of-Distribution Generalization in Non-Stationary Financial Markets. https://doi.org/10.2139/ssrn.7602365", "why": "環境不変の潜在特徴を学ぶことで、市場の局面変化に強いアルファ生成の枠組みを示した。"}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "生成AIは若手の修業を奪うが起業を後押しする", "title": "Automation, Apprenticeship, and Entrepreneurship: Generative AI and the Future Supply of Expertise", "url": "https://doi.org/10.2139/ssrn.7605302", "authors": "Yifan Sun", "venue": "SSRN", "date": "2026-10-13", "apa": "Sun, Y. (2026). Automation, Apprenticeship, and Entrepreneurship: Generative AI and the Future Supply of Expertise. https://doi.org/10.2139/ssrn.7605302", "why": "若手の仕事の自動化が起業の参入障壁も下げるという相殺効果から、専門性の将来の供給を論じた。"}, {"id": "pn15", "rank": 15, "field": "地震工学・防災", "headline": "非常時の交通の冗長性は自転車と乗り継ぎで", "title": "Redundancy by design: The bicycle and intermodality as pillars of transport resilience in emergencies, with lessons from Japan", "url": "https://doi.org/10.31235/osf.io/8tmuv_v1", "authors": "Chris Mayles", "venue": "SocArXiv", "date": "2026-10-12", "apa": "Mayles, C. (2026). Redundancy by design: The bicycle and intermodality as pillars of transport resilience in emergencies, with lessons from Japan. https://doi.org/10.31235/osf.io/8tmuv_v1", "why": "日本の教訓を交え、自転車を含む複数手段の組み合わせを交通レジリエンスの柱と位置づけた。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "長い作業をこなす端末エージェント用データの拡大", "title": "Scaling Agentic Data for Long-Horizon Terminal Intelligence", "url": "https://arxiv.org/abs/2610.13166", "authors": "Shun Zou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-13", "apa": "Zou, S., Ma, Z., Zou, Y., Wang, Y., Chen, L., Chen, Z., Chen, G., Chu, X., & Zhao, F. (2026). Scaling Agentic Data for Long-Horizon Terminal Intelligence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13166", "why": "長期の作業軌跡データを拡大し、端末エージェントの自律的な作業能力を高める（HF投票132）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "実際の専門業務から長い作業軌跡のデータを自動で合成し、端末で長時間働くAIエージェントを強くした（抄録）。", "p3": "TerminalHorizonというデータ合成エンジンが、独立した実行で環境構築時に省かれた重要な作業を見つけて環境を作り直し、同じ目標のもとで課題を段階的に拡張する。1.5千の課題環境でQwen3.5-27Bを教師ありで微調整した。", "p5": "コーディングエージェント、実運用のエージェント課題、一般推論の12のベンチマークすべてで大きく性能が上がった。12時間の研究予算での事例でも、最初の解の後も実験を続けて改良できた（抄録）。", "fun": "AIに長い仕事を覚えさせたいのに、練習用の課題を作るときに『肝心な部分』を先に済ませてしまうと、AIは探索や検証を学べません。この研究は、別のAIに実際に解かせて『どこが抜けていたか』を見つけ、練習問題そのものを作り直す点が面白いところです。", "unverified": "各ベンチマークでの具体的な改善幅は抄録では未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "層方向の注意残差を多ストリームに拡張", "title": "Multi-Stream Attention Residuals", "url": "https://arxiv.org/abs/2610.13630", "authors": "Xiaohan Qin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-13", "apa": "Qin, X., Zhang, X., Dai, T., Zou, S., Wu, H., Yang, Y., Xia, Z., Yao, L., Liu, Y., & Yan, J. (2026). Multi-Stream Attention Residuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13630", "why": "深さ方向の注意をマルチヘッド化し、小さな追加コストで性能を上げる（HF投票33）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "層の深さ方向の注意による残差接続を多ストリームに拡張し、少ない追加コストで大規模モデルの性能を上げた（抄録）。", "p3": "深さ方向に過去の層の表現を内容に応じて取り出すAttnResを、系列方向のマルチヘッド注意にならって多ヘッド化した。各ヘッドは多尺度の因果畳み込みで異なる文脈の見方を持ち、取り出した表現を軽い適応的な混合で1本にまとめる。", "p5": "18Bと28BのMoE規模で12の下流ベンチマークすべてで従来の残差の変種を上回った。同じ損失に達する計算量は標準の残差より1.58倍速く、AttnResは1.35倍、mHCは1.30倍だった（抄録）。", "fun": "深いニューラルネットでは、前の層の情報を後ろへそのまま足す『残差接続』が重要な仕組みです。この研究は、その足し方を『どの層の情報を取り出すかを注意で選ぶ』形にし、さらに複数の視点で選べるようにしました。小さな工夫で計算の効率が上がる点が面白いところです。", "unverified": "なし"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "米国と南アの家計はインフレの原因を違って語る", "title": "Narratives on Inflation: Evidence from the United States and South Africa", "url": "https://doi.org/10.2139/ssrn.7600219", "authors": "Lovisa Reiche", "venue": "SSRN", "date": "2026-10-12", "apa": "Reiche, L. (2026). Narratives on Inflation: Evidence from the United States and South Africa. https://doi.org/10.2139/ssrn.7600219", "why": "調査実験で、インフレの物語が国の経験によって異なり予想に結びつくことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "米国と南アフリカの家計が、インフレの原因を異なる『物語』で理解していることを調査実験で示した（抄録）。", "p3": "インフレのショックを示す調査実験で、両国の消費者が語るインフレの原因の物語と、失業・成長・消費・賃金の予想を調べた。", "p5": "米国の家計はインフレの上昇を供給要因、低下を需要要因と非対称に結びつけ、南アフリカの家計は一貫して供給側から見た。物語は定量的な予想と整合し、各国の歴史的経験を反映した。インフレが高いと予想消費は減るが、賃金要求はほとんど変わらなかった（抄録）。", "fun": "物価が上がったとき、人は頭の中で『なぜ上がったか』の物語を作ります。その物語が国によって違い、過去の経験に左右されるというのが面白い点です。同じ物価上昇でも、受け取り方が違えば金融政策の効き方も変わりえます。", "unverified": "標本の規模と調査の設計の詳細は抄録では未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "AIは貧しい国の家計の厚生を上げるか", "title": "Can AI Improve Household Welfare in Poorer Countries? Evidence and Measurement Challenges", "url": "https://econpapers.repec.org/RePEc:iza:izadps:dp18984", "authors": "Dang ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "9つの評価研究でAI支援が時間あたり産出を平均で上げたことなど、効果と測定上の課題を整理した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "AIが貧しい国の家計の厚生を上げるか、厚生の測定に使えるかを、評価研究の構造化された批判的レビューで検討した（抄録）。", "p3": "選んだ評価研究を、生産性、個別指導、事業・労働市場、家計の消費貧困、厚生の測定の観点で整理し、感度分析と高リスクの試験を除いた頑健性を確かめた。", "p5": "9つの評価でAI支援は時間あたり産出を平均29%上げ、8つの個別指導の比較で道具なしのテストの成績が平均0.21標準偏差上がった（高リスクの試験を除くと頑健性は下がる）。生成AIが貧困国の家計の消費貧困に与える効果の因果研究は見つからなかった（抄録）。", "fun": "AIは専門家が少ない国でこそ役立つはずだ、という期待をデータで確かめた研究です。生産性や学習の効果は見えても、『家計が実際に豊かになったか』を確かめた研究はまだない、という指摘が大事な点です。AIの利用自体が国の豊かさとともに増えるという偏りも示されています。", "unverified": "対象研究の選定基準の詳細は抄録では未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "製造業の求人にみる工場でのAI", "title": "AI on the Factory Floor: Evidence from Manufacturing Job Postings", "url": "https://econpapers.repec.org/RePEc:fip:fedgfn:103871", "authors": "Maria D. Tito", "venue": "RePEc NEP", "date": "2026-10-12", "why": "求人データから製造業のAI関連の技能需要の変化を追った。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの短い抄録（研究の背景のみ）を使用", "preprint": true, "short": true, "p1": "製造業の求人データから、工場でのAI関連の技能需要を測ろうとする研究（抄録は背景の説明のみ）。", "p3": "未確認（抄録は企業の採用判断が技能需要の指標になるという背景の記述のみで、データと手法の記載なし）。", "p5": "未確認（抄録に結果の記載なし）。", "fun": "AIが仕事をどう変えるかは、生産性や雇用の統計に表れるまで時間がかかります。そこで『企業がいま、どんな人を募集しているか』を見れば、変化を早くつかめるという発想です。工場という、AIの影響があまり語られない現場に注目している点が面白いところです。", "unverified": "データ、手法、結果はいずれも抄録に記載がなく未確認。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "探索型の人材をどう報酬で選び分けるか", "title": "Selecting for Innovation *", "url": "https://doi.org/10.2139/ssrn.7591479", "authors": "Gustavo Manso", "venue": "SSRN", "date": "2026-10-13", "apa": "Manso, G. (2026). Selecting for Innovation *. https://doi.org/10.2139/ssrn.7591479", "why": "探索者と模倣者の業績履歴の違いを使い、報酬の時期と経路依存で選別する契約を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "探索に向いた人材を見分けられない企業が、報酬の時期と経路で探索者を選び分ける契約を理論的に示した（抄録）。", "p3": "隠れた行動のある2期間モデルで、探索者と模倣する活用者が異なる業績の履歴を生むことを使い、意図した活動のもとで起きやすい履歴に報酬を置く契約を分析した。コミットメント、解雇、フィードバックも同じ論理で扱う。", "p5": "活用者には成功ごとに、探索者には主に長期の成功に（初期の失敗が十分に情報を持つときは失敗の後にも）支払うことで選別できる。探索型のインセンティブは成果だけでなく、誰が入り・残り・探索を選ぶかを変えると予測する（抄録）。", "fun": "『新しいことに挑戦する人』を雇いたくても、面接では見分けられません。そこで、すぐに結果を出すと得をする給料ではなく、長い目で見た成功や『意味のある失敗』に報いる給料にすれば、挑戦する人が自然に集まるという考え方です。給料の形そのものが人を選ぶふるいになる点が面白いところです。", "unverified": "なし"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "対象を絞れば事業支援の男女差は縮む", "title": "From Disparity to Equality: Strategic Targeting to Close Gender Gaps in Business Upgrading Programs", "url": "https://doi.org/10.2139/ssrn.7603818", "authors": "Stephen J Anderson ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Anderson, S. J., Kankanhalli, S., Grover, A., & Ramani, N. (2026). From Disparity to Equality: Strategic Targeting to Close Gender Gaps in Business Upgrading Programs. https://doi.org/10.2139/ssrn.7603818", "why": "3か国の実験データで、準備度スコアによる対象選定が女性起業家への効果の差を縮めることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "10の観察できる要因からなる準備度スコアで対象を選べば、事業支援プログラムの男女の効果の差を解消できることを示した（抄録）。", "p3": "ウガンダ、南アフリカ、メキシコの企業の実験データを統合し、起業家の資源と能力を表すプログラム準備度スコアカードで対象を選んだ場合の効果を比べた。", "p5": "対象を選ばないと男性主導の企業は大きく有意な利益を得たが、女性主導の企業の平均効果はほぼゼロだった。スコアの上位4分の1の女性に絞ると、男性と統計的に区別できない効果が得られた（抄録）。", "fun": "同じ支援でも、女性経営者には効かないように見えることがあります。でも、それは『女性だから』ではなく、支援を生かす準備が整っていない人も混ざっていたからかもしれません。準備の度合いで選ぶと男女差が消えるという結果は、平均だけを見る危うさを教えてくれます。", "unverified": "なし"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "稼ぐ段階のただ乗りが公共財実験では見えない", "title": "Earn Before You Buy: Input-Market Free Riding, Majority Voting, and the Design of Public Goods Experiments&nbsp;", "url": "https://doi.org/10.2139/ssrn.7590661", "authors": "Philip E. Graves", "venue": "SSRN", "date": "2026-10-12", "apa": "Graves, P. E. (2026). Earn Before You Buy: Input-Market Free Riding, Majority Voting, and the Design of Public Goods Experiments&nbsp; https://doi.org/10.2139/ssrn.7590661", "why": "所得を稼ぐ前の段階での『入力市場のただ乗り』が標準的な実験設計で観察できないことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "公共財のただ乗りが『稼ぐ段階』でも起きることを示し、それを観察できる実験の設計を提案した（抄録）。", "p3": "線形の利得では稼ぐ判断が公共財と独立になり、稼ぐ段階のただ乗りが見えないことを示したうえで、私的消費の限界価値が逓減するモデルを作り、6つの処置からなる実験設計を提案した。", "p5": "拘束力のある多数決が全員の労働努力を高め、その大きさは投票が労働の前か後かで変わり、固定収入より稼いだ収入から税を払うときに公共財を多く選ぶと予測した。評価が右に歪むと多数決は過少供給になる（抄録）。", "fun": "みんなのためのお金をケチる『ただ乗り』は、出すときだけでなく、そもそも稼がないという形でも起きる、という指摘です。これまでの実験は最初にお金を配っていたので、この『稼がないただ乗り』が見えていませんでした。実験の前提を問い直す発想が面白い点です。", "unverified": "提案段階の実験設計で、実施結果は未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "非エルゴード過程の大数の法則", "title": "Laws of Large Numbers for Non-Ergodic Processes", "url": "https://doi.org/10.2139/ssrn.7593678", "authors": "Moawia Alghalith", "venue": "SSRN", "date": "2026-10-12", "apa": "Alghalith, M. (2026). Laws of Large Numbers for Non-Ergodic Processes. https://doi.org/10.2139/ssrn.7593678", "why": "混合条件に頼らず、条件付きの大数の法則を非エルゴード定常過程で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "エルゴード性のない定常時系列で、混合条件を使わずに条件付きの大数の法則を示した理論論文（抄録）。", "p3": "標本平均の2乗にあたる2重和を分析し、不変σ集合体で条件づけると定数に収束することを示した。4次モーメントの共分散テンソルがO(1/n²)で縮むことを必要十分条件として導いた。", "p5": "条件なしでは推定量は経路に依存する確率変数に収束するが、条件づけると局所的に定数になる。構造推定、深層学習の初期化の乱数、分散共分散の推定のサイズ歪みへの応用を論じた（抄録）。", "fun": "平均をたくさんとれば真の値に近づく、という大数の法則は、時系列がどこかで『混ざり合う』ことを前提にしています。しかし経済には、一度入ると抜けられない局面（レジーム）があります。そういう場合でも、局面ごとに見れば平均は落ち着く、という結果を示した点が面白いところです。", "unverified": "証明と応用の詳細は抄録では未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "係数が時間変化する共和分系のノンパラメトリック推定", "title": "Nonparametric Series Estimation of Cointegrated Systems with Time-varying Coefficients", "url": "https://doi.org/10.2139/ssrn.7595338", "authors": "Yu Bai ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Bai, Y., Gao, J., & Kew, H. (2026). Nonparametric Series Estimation of Cointegrated Systems with Time-varying Coefficients. https://doi.org/10.2139/ssrn.7595338", "why": "滑らかに変化する係数の共和分系を級数推定で扱う漸近理論を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "係数が時間とともに滑らかに変わる共和分系を、級数で推定する効率的な方法を示した（抄録）。", "p3": "未知の非定常なボラティリティのもとで級数ベースの最小二乗推定の漸近理論を作り、効率性の理論を導いて、効率性の限界に達する級数ベースの動学的最小二乗推定量（SDOLS）を提案した。モンテカルロ実験と消費・資産比率への応用で評価した。", "p5": "SDOLSは有限標本で良好に機能し、既存の方法を上回ることが多かった。共和分関係の時間変化を許すと、株式プレミアムの予測精度が固定係数や過去平均より改善することが多かった（抄録）。", "fun": "長い目で見ると一緒に動く2つの量（共和分）の関係が、時代とともに少しずつ変わることがあります。その変化を、係数を時間の滑らかな関数で表すことで捉えた研究です。関係が固定だと仮定するより、株の予測が良くなるという結果が面白い点です。", "unverified": "予測精度の改善幅は抄録では未確認。"}}, {"id": "pn26", "rank": 26, "field": "心理学・認知科学", "headline": "実行が安くなると価値は仕様と評価に移る", "title": "When Execution Is Cheap: Specification, Evaluation, and Rent Capture in AI-Enabled Work", "url": "https://doi.org/10.31235/osf.io/4az6c_v1", "authors": "Babu George", "venue": "SocArXiv", "date": "2026-10-12", "apa": "George, B. (2026). When Execution Is Cheap: Specification, Evaluation, and Rent Capture in AI-Enabled Work. https://doi.org/10.31235/osf.io/4az6c_v1", "why": "AIで実行コストが下がるとき、成果の定義と評価の作業に経済的な利得が集まる条件を示した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用", "preprint": true, "short": true, "p1": "AIで実行のコストが下がると、価値は成果の定義と評価に移ることを、2つのモデルで示した（抄録）。", "p3": "成功の定義を、意図の引き出し、仕様の選択、選択の承認、出力の検証の4つの活動に分け、評価コストと代理指標の忠実度の2つのモデルで仕組みを分析した。", "p5": "安い実行の利得は評価コストで決まる上限に近づき、候補を多く作るほど代理指標の忠実度の価値が上がる（グッドハート型の失敗につながる）。レントが生じる条件を整理し、6つの検証可能な予測と要因実験を提案した（抄録）。", "fun": "AIがどんどん作ってくれるなら、人の仕事は『何を作ってほしいかを決めること』と『できたものを見極めること』になります。たくさん作れるほど、良し悪しを測る物差しのずれが目立ってくる、という指摘が面白い点です。テストの点数だけを上げる勉強の問題とよく似ています。", "unverified": "提案した実験の実施結果は未確認。"}}, {"id": "pn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "チームフロー測定尺度のフランス語版の妥当性", "title": "French Validation of the Team Flow Monitor: Factor Structure and Validity Evidence in Student Teams", "url": "https://doi.org/10.31234/osf.io/wte5q_v1", "authors": "Victoire Vallier ほか", "venue": "PsyArXiv", "date": "2026-10-13", "apa": "Vallier, V., Verger, N., Shankland, R., Turgon, R., & Hallez, Q. (2026). French Validation of the Team Flow Monitor: Factor Structure and Validity Evidence in Student Teams. https://doi.org/10.31234/osf.io/wte5q_v1", "why": "チームの共有された最適体験を測る尺度の因子構造と妥当性を学生チームで検証した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "チームフローを測る尺度（Team Flow Monitor）のフランス語版を作り、信頼性と妥当性を確かめた（抄録）。", "p3": "研究1（225人）で翻訳・適応し、確認的因子分析で構造を調べた。研究2（92人）では共同課題に取り組む学生チームで、チームの成果・満足と個人の成果との相関を比べた。", "p5": "4つの側面（一体感、共同の進展感、相互信頼、全体への集中）が2次のチームフロー因子にまとまる構造が支持された（CFI=.971、RMSEA=.071）。チームの成果・満足との相関はrs≥.68で、個人の成果（r=.28）より有意に強かった（抄録）。", "fun": "一人で没頭する『フロー』はよく知られていますが、チーム全体が一緒に乗っている状態もあります。それを測る物差しを別の言語でも使えるようにした研究です。チームの成果とは強く結びつき、個人の成果とは弱くしか結びつかないことが、『チームの体験』を測れている証拠になっています。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "経営学", "headline": "象徴的経営における沈黙の役割", "title": "The Role of Silence in Symbolic Management", "url": "https://doi.org/10.2139/ssrn.7604560", "authors": "W. Chad Carlos ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Carlos, W. C., & Lewis, B. W. (2026). The Role of Silence in Symbolic Management. https://doi.org/10.2139/ssrn.7604560", "why": "組織が語らないことが外部評価に与える役割を象徴的経営の理論に位置づけた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "実際には取り組んでいるのに外には言わない『逆デカップリング』を概念化し、その理由を理論化した（抄録）。", "p3": "象徴的経営の研究が前提とする『目に見える主張は得になる』に反する事例を出発点に、注目と監視、聴衆の要求の衝突、制度的不確実性の3つの仕組みを理論的に整理した。", "p5": "象徴的な沈黙は戦略的な利点と解釈上のリスクの両方を生むとし、沈黙を組織が外部の評価を形づくる手段の一つとして位置づけた（抄録）。", "fun": "会社は良いことをしたら宣伝するもの、と思いがちです。でも、あえて黙っている会社もあります。目立つと批判の的になる、相手によって期待がばらばら、ルールが定まっていない、といった状況では、黙ることが賢い選択になりうるという見方が面白い点です。", "unverified": "理論的論考で、実証的な検証は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経営学", "headline": "弾幕コメントの言語特徴と消費者の関与", "title": "Barrage Linguistic Features and Consumer Engagement Dynamics: Evidence from Online Product Review Videos", "url": "https://doi.org/10.2139/ssrn.7606863", "authors": "Yutong Ma ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Ma, Y., Fu, X., Liu, M. T., Lee, V. H., & Wang, S. S. (2026). Barrage Linguistic Features and Consumer Engagement Dynamics: Evidence from Online Product Review Videos. https://doi.org/10.2139/ssrn.7606863", "why": "レビュー動画の弾幕コメントの言語特徴と関与の動態の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "商品レビュー動画の弾幕コメントの言葉の特徴が、その後の視聴者の関与の量と感情の高ぶりにどう関わるかを示した（抄録）。", "p3": "大規模な弾幕と週次の関与のデータに、パネル・ベクトル自己回帰モデルを当てはめ、感情を高ぶらせる言葉（情動的側面）と記述の具体性（認知的側面）の動的な関係を推定した。", "p5": "前の週の弾幕の情動語と具体性は翌週の弾幕の量と正に関連したが、翌週の弾幕の感情の高ぶりとは負に関連した。動画の情報の豊かさとインフルエンサーの高ぶりで異質性も調べた（抄録）。", "fun": "動画の上を流れるコメント（弾幕）は、見ている人同士の会話のようなものです。興奮した言葉や具体的な言葉が多い週の後は、コメントの数は増えるのに興奮はむしろ落ち着く、という一見矛盾する動きが面白い点です。", "unverified": "データの規模と期間は抄録では未確認。"}}, {"id": "pn30", "rank": 30, "field": "経営学", "headline": "戦略的な参加者がいる動的マッチングの価格設定", "title": "Pricing in Dynamic Matching Platforms with Strategic Agents", "url": "https://doi.org/10.2139/ssrn.7604120", "authors": "Tonghun Lee ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Lee, T., Tsao, M., & Yan, C. (2026). Pricing in Dynamic Matching Platforms with Strategic Agents. https://doi.org/10.2139/ssrn.7604120", "why": "時間とともに変わるマッチング機会のもとで、マッチ依存の価格設定を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "相乗りのような動的マッチングの場で、利用者が値引きを待って申し込みを遅らせても、近視眼的に最適化した価格は損をしないことを示した（抄録）。", "p3": "マッチング機会が時間とともに変わる場で、マッチの有無で変わる価格と、利用者の戦略的な申込みの遅延を理論的に分析し、シカゴのデータで大規模な相乗りシミュレーションを行った。", "p5": "すぐ申し込む利用者向けに最適化した価格は、戦略的な行動のもとでも最適な近視眼的利益以上を得られ、利用者の余剰、処理量、マッチ率でも同様だった。2人がそろった時点で市場を清算する値引きが最適になった（抄録）。", "fun": "相乗りで『相手が見つかったら安くなる』なら、少し待ってから頼む人が出てきます。普通はそれが運営側の損になると心配しますが、この研究では、待つ人がいても運営の利益も利用者の得も減らない、むしろ増えることがあると示しました。", "unverified": "シミュレーションの数値結果は抄録では未確認。"}}, {"id": "pn31", "rank": 31, "field": "地震工学・防災", "headline": "資金源が多様なほど住宅の復旧が速い", "title": "Resource Variety Matters: Funding Access and the Pace of Housing Recovery", "url": "https://doi.org/10.2139/ssrn.7601949", "authors": "Sara Hamideh ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Hamideh, S., Venugopalan, A., Sutley, E. J., & Dillard, M. (2026). Resource Variety Matters: Funding Access and the Pace of Housing Recovery. https://doi.org/10.2139/ssrn.7601949", "why": "災害後の住宅復旧のペースと資金へのアクセスの関係を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "災害後の住宅の復旧の速さは、資金の多様さよりも世帯の社会的脆弱性に強く関連することを示した（抄録）。", "p3": "2016年のハリケーン・マシュー後のノースカロライナ州ランバートンでの縦断調査の第2波を使い、被害と社会的脆弱性ごとの資源へのアクセスと復旧を記述し、社会人口学的要因と被害を統制したOLSで資金援助と復旧の関係を調べた。", "p5": "世帯は資源を順に使い分けるより『積み重ね』ていた。資源へのアクセスは脆弱性の特徴より復旧との関連が弱かった。洪水保険だけが一貫して修理の速さと関連したが、最も必要な世帯ほど持っていなかった（抄録）。", "fun": "災害の後、お金の支援さえあれば家は早く直る、とは限らないという結果です。もともとの暮らしの弱さのほうが復旧の速さを強く左右し、唯一効いた洪水保険は、最も必要な人ほど入っていませんでした。支援の届き方の偏りが見える研究です。", "unverified": "標本の規模とOLSの係数は抄録では未確認。"}}, {"id": "pn32", "rank": 32, "field": "地震工学・防災", "headline": "極端気象の被害はサプライチェーンで広がる", "title": "The Criticality Of Supply Chains In Modelling Impact And Adaptation Mechanisms For Extreme Weather Events", "url": "https://doi.org/10.2139/ssrn.7605878", "authors": "Ruben Kerkhofs ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Kerkhofs, R., van Kruijsdijk, G., Jindal, A., Bernhofen, M., De Spiegeleer, J., Schoutens, W., & Shrimali, G. (2026). The Criticality Of Supply Chains In Modelling Impact And Adaptation Mechanisms For Extreme Weather Events. https://doi.org/10.2139/ssrn.7605878", "why": "インフラの途絶が供給網を通じて波及する影響を確率的にモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "極端気象の被害の約半分がサプライチェーンの間接的な途絶から生じることを、インドの石炭・電力の確率的なエージェントモデルで示した（抄録）。", "p3": "確率的なハザードのシミュレーションを、資産単位の生産ネットワークの日々の運用と企業のキャッシュフローに結びつけ、RCP2.6とRCP8.5のもとで損失分布を求めた。", "p5": "間接的な途絶が総損失の約半分を占め、気候が極端になるほど裾のリスクの主因になった。洪水防御の強化で平均損失は90%以上減るが、ネットワークの相互依存による損失は残った。重要な資産を優先する適応は、無作為や曝露だけの戦略より効率よく極端な損失を減らした（抄録）。", "fun": "洪水で発電所が1か所止まると、その発電所だけでなく、石炭を運ぶ鉄道や電気を使う工場にも影響が広がります。個々の施設を強くするだけでは足りず、ネットワークの『要』を守ることが大事だという結果は、インフラを網として見る大切さを教えてくれます。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "地震工学・防災", "headline": "近断層地震動に対する表面遮水壁型ロックフィルダム", "title": "Seismic Response of a Low Concrete-Faced Rockfill Dam under Near-Field and Far-Field Earthquake Ground Motions: A Case Study of Dhap Dam, Nepal", "url": "https://doi.org/10.2139/ssrn.7602698", "authors": "Kailash Thapa ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Thapa, K., & Raut, D. (2026). Seismic Response of a Low Concrete-Faced Rockfill Dam under Near-Field and Far-Field Earthquake Ground Motions: A Case Study of Dhap Dam, Nepal. https://doi.org/10.2139/ssrn.7602698", "why": "ネパールのダムで近断層と遠方の地震動に対する応答の違いを調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ネパールの高さ24mの表面遮水壁型ロックフィルダムで、近断層地震動が上部に大きな負荷をかけることを示した（抄録）。", "p3": "ダム・貯水池・基礎の2次元有限要素モデルの時刻歴解析で、インペリアルバレー、ロマプリータ、集集地震の近断層7波と遠方7波を入力し、加速度、応答スペクトル、変位を比べた。", "p5": "近断層の記録は堤頂下で加速度と増幅が大きく、堤頂のスペクトルに0.8〜1.1秒の長周期のピークが現れた。基部に対する堤頂の変位は近断層で約3倍だった（p=0.017）。最大の鉛直変位は余裕高の約6%だった（抄録）。", "fun": "断層のすぐ近くの地震では、断層の破壊が向かってくる方向に強い『速度パルス』が出ることがあります。このパルスがダムの上のほうを大きく揺らすことを示した研究です。最大速度だけでは揺れの大きさが説明できず、揺れの周期や長さも効いている点が興味深いところです。", "unverified": "なし"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "逆選択のある保険市場で市場支配力は補償を減らす", "title": "Market Power and Insurance Coverage", "url": "https://doi.org/10.2139/ssrn.7590660", "authors": "Daniel Gottlieb ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Gottlieb, D., & Moreira, H. (2026). Market Power and Insurance Coverage. https://doi.org/10.2139/ssrn.7590660", "why": "独占と完全競争の配分を比べ、低リスク者の補償が減ることを理論的に示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "逆選択のある保険市場で、独占は支払意思の低い人の補償を減らし、高い人の補償を増やすことを示した（抄録）。", "p3": "逆選択のある市場で独占と完全競争の配分を理論的に比べ、選好と費用の実証モデルにもとづくシミュレーションで効果の大きさを確かめた。多次元のタイプの競争均衡の性質も示した。", "p5": "弱い条件のもとで独占は一定割合の顧客を必ず排除するが、競争企業は全員にゼロから離れた補償を提供する。一方、いいとこ取り（クリームスキミング）を避けるため、競争企業は支払意思の高い人への補償を独占より少なくする。両効果は量的にも大きかった（抄録）。", "fun": "『競争があれば誰にとっても良い』とは保険では限らない、という結果です。競争は加入できない人を減らしますが、リスクの低い客を奪われないように、手厚い補償を求める人には逆に薄い補償しか出せなくなります。保険の世界のねじれた力学が見えます。", "unverified": "シミュレーションの数値は抄録では未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "税制の設計が企業のフォーマル化を左右する", "title": "Informality and the Structure of Taxation: A Quantitative Exploration", "url": "https://doi.org/10.2139/ssrn.7600938", "authors": "Shweta Sogani ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Sogani, S., & Dasgupta, K. (2026). Informality and the Structure of Taxation: A Quantitative Exploration. https://doi.org/10.2139/ssrn.7600938", "why": "異質な企業がフォーマル化を選ぶ定量モデルで税制の構造の効果を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "税の種類によって企業のフォーマル化への効果が逆向きになることを、インドの製造業に合わせた定量モデルで示した（抄録）。", "p3": "異質な企業がフォーマルかインフォーマルかを選ぶモデルで、フォーマル企業に売上税、給与税、累進的な利潤税を課し、インドのフォーマル・インフォーマルの製造業の規模分布に合わせて較正し、反実仮想と最適税制を分析した。", "p5": "売上税率を上げるとフォーマル化が進み、給与税率を上げると減り、利潤税率の効果はほぼなかった。インフォーマル企業の割合75%を目標に税収を保つ改革では、給与税から売上税・利潤税へ移すことで厚生が1.7%上がった（抄録）。", "fun": "税金を上げると企業は税務署から隠れる（インフォーマルになる）と思いがちです。でも、どの税を上げるかで逆の結果になるというのが面白い点です。人を雇うことにかかる税を下げれば、税収を減らさずに表に出てくる企業を増やせるかもしれません。", "unverified": "なし"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "欧州レポ市場のヘアカットと借り手の集中", "title": "Haircuts and Borrower Concentration: Evidence from EU Repo Markets", "url": "https://doi.org/10.2139/ssrn.7592140", "authors": "Alessandro Spolaore", "venue": "SSRN", "date": "2026-10-12", "apa": "Spolaore, A. (2026). Haircuts and Borrower Concentration: Evidence from EU Repo Markets. https://doi.org/10.2139/ssrn.7592140", "why": "取引レベルのデータで二者間レポのヘアカットの決定要因を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "欧州の二者間レポ市場で、借り手の交渉力がヘアカットの水準を左右することを取引データで示した（抄録）。", "p3": "欧州の二者間レポの網羅的な取引レベルのデータで、借り手の集中と貸し手の分散がヘアカット（担保の掛け目）の決定に与える影響を、取引相手の種類ごとに分析した。", "p5": "ヘアカットは借り手の集中とともに平均44〜80ベーシスポイント上がり、貸し手の分散とともに下がった。ノンバンクは資金源の分散に特に敏感だった。集中した関係はネッティングの機会があるとゼロ・ヘアカットの可能性を高めるというトレードオフもあった（抄録）。", "fun": "お金を借りるときに差し出す担保は、価値の満額ではなく少し割り引いて評価されます（ヘアカット）。その割引率が、借り手がどれだけ多くの相手と取引しているかという『交渉力』で変わるというのが面白い点です。金融の安定にかかわる見えにくい仕組みを照らしています。", "unverified": "なし"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "金融政策と住宅ローン返済額", "title": "Monetary Policy and Mortgage Payments", "url": "https://doi.org/10.2139/ssrn.7595138", "authors": "William Miles", "venue": "SSRN", "date": "2026-10-12", "apa": "Miles, W. (2026). Monetary Policy and Mortgage Payments. https://doi.org/10.2139/ssrn.7595138", "why": "政策金利が住宅費用に与える効果の研究間の食い違いを、ローン返済の側から検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "金融引き締めは住宅価格を下げても、住宅ローンの金利上昇を通じて新たに買う人の返済額を増やすことを示した（抄録）。", "p3": "住宅価格指数ではなく実際の住宅価格の中央値を使い、30年固定の住宅ローン金利で返済額を計算して、政策金利の引き上げへの反応を推定した。", "p5": "引き締めは住宅価格を明確に下げるが30年金利を上げ、返済額への純効果は明確に正だった。販売期間が延び、住宅投資が減って将来の供給が減り、長期的には価格を押し上げる。CPI・PCEの住居費への効果はなしか正だった（抄録）。", "fun": "金利を上げれば家は安くなるのだから、家を買う人は助かる、と考えがちです。でも実際は、安くなる分より金利で増える分のほうが大きく、毎月の返済はむしろ増えます。さらに家が建たなくなって、いずれ価格が上がるという長い目の効果も面白い点です。", "unverified": "推定の手法（VARなど）は抄録では未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "1つのモデルで再帰回数を伸縮させる言語モデル", "title": "One Model to Loop Them All: Elastic Latent Recurrence for Language Models", "url": "https://arxiv.org/abs/2610.12582", "authors": "Faisal Ladhak ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Ladhak, F., Acharya, S., Serano, S. A., Sun, S., Ginsburg, B., & Puvvada, K. C. (2026). One Model to Loop Them All: Elastic Latent Recurrence for Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12582", "why": "共有ブロックを繰り返す潜在再帰モデルで、推論計算量と精度を1つのチェックポイントで調整する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "同じブロックを繰り返す言語モデルで、1回の計算でも普通のモデルと同等の精度を保ち、繰り返すほど精度が上がる訓練法を示した（抄録）。", "p3": "学習される刻み幅のゲート付き状態更新、各更新での繰り返し回数の混合、各回の繰り返し番号と予算での条件づけの3つを組み合わせた。訓練の後半から混合を導入し、MoEでは最初の回の経路を再利用する。", "p5": "4Bの密モデルと30B-A3BのMoEで、1回の繰り返しでの10課題平均は対応する基準より0.52ポイント低い〜1.04ポイント高く、4回で7.25と4.75ポイント上がった。経路の再利用で混合深さの更新時間が11.7%減った（抄録）。", "fun": "同じ層を何周もさせて考えを深めるモデルは、急ぐときに1周だけ回すと普通のモデルより弱い、という弱点がありました。この研究はその弱点をなくし、『急ぐなら1周、じっくりなら4周』を1つのモデルで選べるようにしました。", "unverified": "なし"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "巨大活性化の誕生・成長・統合の過程", "title": "The Life Cycle of a Massive Activation: Stochastic Birth, Weight-Decay-Driven Growth, and Competitive Consolidation", "url": "https://arxiv.org/abs/2610.00423", "authors": "S. Aaron McClendon ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "McClendon, S. A., Gallego-Feliciano, J., & Saravanos, A. (2026). The Life Cycle of a Massive Activation: Stochastic Birth, Weight-Decay-Driven Growth, and Competitive Consolidation (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.00423", "why": "Transformerの巨大活性化の規模が訓練中にどう決まるかを、重み減衰との関係から説明した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "Transformerの巨大な活性化の大きさが、重み減衰とAdamWの前処理のつり合いで決まることを示した（抄録）。", "p3": "訓練の軌跡の分析と統制した介入で、巨大活性化の出現・成長・統合を追い、重み減衰を外した場合と保った場合の続きの訓練を比べ、つり合いのモデルを作った。", "p5": "重み減衰が全体の活性化の規模の変化を因果的に制御した。減衰係数λを変えるとピークの時期はほぼ対数線形にずれ、ピークの大きさはほぼλ^(-1/2)に比例し、つり合いのモデルと整合した（抄録）。", "fun": "大規模言語モデルの内部には、他の数百倍も大きな値をとる特別な場所があり、それが注意の『たまり場』になっています。その大きさが、値を大きくしようとする学習の力と、小さく抑えようとする重み減衰の綱引きで決まる、という物理の平衡のような説明が面白い点です。", "unverified": "なし"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "分布頑健な混合エキスパートの訓練", "title": "Distributionally Robust Mixture-of-Experts Training", "url": "https://arxiv.org/abs/2610.07207", "authors": "Xin Teng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Teng, X., Li, M., & Wen, H. (2026). Distributionally Robust Mixture-of-Experts Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07207", "why": "ルーティングが不完全なときのMoEの信頼性の問題に分布頑健最適化で対処した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "混合エキスパート（MoE）の訓練で、負荷の均等化ではなく誤ったルーティングへの頑健性を目的にすることで性能を上げた（抄録）。", "p3": "層ごとのエキスパートを頑健性のグループとみなし、平滑化したエキスパートごとの損失にもとづくエントロピー正則化のソフトマックスでエキスパートの分布を更新し、損失の高いルーティング結果を最適化する。", "p5": "10.3Bパラメータ・67Bトークンで7課題平均を0.6625から0.6767に上げた（補助損失なしの均衡化は0.6431）。エキスパートの損失のばらつきが減り、強制的な誤ルーティングでの超過損失が4.3%低かった（抄録）。", "fun": "MoEは『専門家』を何人も用意して、問題ごとに担当を割り振る仕組みです。仕事を均等に割り振るだけだと、慣れていない専門家に回ったときに失敗します。最悪の割り振りでも困らないように鍛える、という発想が面白い点です。", "unverified": "なし"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "分岐させるオンポリシー蒸留", "title": "Branching On-Policy Distillation", "url": "https://arxiv.org/abs/2610.13481", "authors": "Dongyang Chen ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-13", "apa": "Chen, D., Liu, S., Li, S., Tang, D., Liang, J., Wu, Z., & Lu, L. (2026). Branching On-Policy Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13481", "why": "1本の軌跡では限られる教師信号の範囲を分岐で広げる蒸留法を提案した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "生徒モデルが迷う場面で軌跡を分岐させて教師の指導を広げる、オンポリシー蒸留の改良法を示した（抄録）。", "p3": "生徒の不確かさと教師との不一致で情報の多い決定点を選び、共通の前半から生徒の続きを再サンプリングし、本線と分岐の両方にトークン単位の教師の指導を与える。繰り返しを抑える修正（PBR）も加えた。", "p5": "共通の前半の再利用で生成トークンをALFWorldで約19%、WebShopで約31%減らした。通常のOPDより数学の平均正答率（avg@16）で18.55ポイント、ALFWorldの成功率で13.8ポイント上回った（抄録）。", "fun": "先生が生徒の答案を添削するとき、1通りの解き方だけでなく『ここで別の道を選んだらどうなるか』まで見せられたら学びが広がります。生徒が迷った分かれ道だけを選んで枝分かれさせるので、無駄なく指導の幅を広げられる点が面白いところです。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "関連していても適用できるとは限らないGUIエージェントの経験", "title": "Relevance Does Not Imply Applicability: Experience Activation for Personal GUI Agents", "url": "https://arxiv.org/abs/2609.33304", "authors": "Fuyao Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-13", "apa": "Zhang, F., Wang, X., Li, Z., Zhang, J., Huang, L., & Lim, W. Y. B. (2026). Relevance Does Not Imply Applicability: Experience Activation for Personal GUI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.33304", "why": "個人用GUIエージェントの過去の経験の使い方を、関連性ではなく適用可能性で選ぶ。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "個人用GUIエージェントで、関連する過去の経験ではなく、いまの画面に適用できる経験だけを使うことで成功率を上げた（抄録）。", "p3": "検索した履歴の効果が最初の一歩にほぼ集中することを示したうえで、訓練不要のExpActivatorを提案した。実行中は凍結したGUIモデルの潜在空間で現在の画面を過去の状態と照合して対応する行動を参照に与え、繰り返しの意図は時刻と状況の支えが十分なときだけ使う。", "p5": "4つのGUIモデルで軌跡内の各ステップの成功率を平均28%上げ、履歴のトークンを約5分の1に減らしつつ全モデルで最良の個人化実行を示した（抄録）。", "fun": "『前にも同じ用事をした』と思い出せても、その記憶が今の画面で何を押すべきかを教えてくれるとは限りません。『関連がある』と『いま使える』は別だ、という気づきが面白い点です。人間の記憶の使い方にも通じる考え方です。", "unverified": "抄録が途中で切れており、先回りの提案の精度の数値は未確認。"}}, {"id": "pn43", "rank": 43, "field": "心理学・認知科学", "headline": "子どもはAIとの対話で概念をどう表すか", "title": "Mapping the Digital Mind: Cognitive Architecture and Mechanisms of Conceptual Representation During Children's Interaction with Artificial Intelligence Models", "url": "https://doi.org/10.2139/ssrn.7597861", "authors": "Antonis Theofilidis", "venue": "SSRN", "date": "2026-10-12", "apa": "Theofilidis, A. (2026). Mapping the Digital Mind: Cognitive Architecture and Mechanisms of Conceptual Representation During Children’s Interaction with Artificial Intelligence Models. https://doi.org/10.2139/ssrn.7597861", "why": "子どもと生成AIの相互作用での概念表象の仕組みを実験で調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "10〜12歳の子どもが生成AIで問題を解くと、百科事典で調べるより概念の理解が深まり負荷が下がる一方、誤答をうのみにする子もいることを示した（抄録）。", "p3": "120人を子ども向けの生成AI環境の群と子ども用百科事典の群に無作為に割り付け、概念地図課題、NASA-TLXの認知負荷、WISC-Vの数唱（逆唱）で評価し、分散分析で比べた。", "p5": "AI群は事後テストで概念表象の質と複雑さが有意に上がり（F(1,118)=34.21、η²=.22）、認知負荷が低かった（F(1,118)=39.12）。ただし効果は作業記憶の容量に依存し、実行機能の低い子どもはシステムの誤答をそのまま受け入れがちだった（抄録）。", "fun": "AIと会話しながら調べると、子どもは考えを整理しやすくなる。でも、頭の中で情報を保っておく力（作業記憶）が弱い子は、AIのもっともらしい間違いを信じてしまいやすい。便利な道具ほど、使う人の力によって効果が変わるという大事な示唆です。", "unverified": "短期の評価で、長期的な効果は未確認。"}}, {"id": "pn44", "rank": 44, "field": "統計学", "headline": "LLMを提案分布に使うMCMCの収束診断", "title": "Evaluating Convergence Diagnostics for LLM-based Bayesian Sampling", "url": "https://doi.org/10.2139/ssrn.7602759", "authors": "Albert Schmidt", "venue": "SSRN", "date": "2026-10-13", "apa": "Schmidt, A. (2026). Evaluating Convergence Diagnostics for LLM-based Bayesian Sampling. https://doi.org/10.2139/ssrn.7602759", "why": "LLMを提案分布にするベイズ推論で、従来の収束診断がどこまで使えるかを評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "LLMを提案分布に使うMCMCでは、従来の収束診断が誤って収束を示しうることを示した（抄録）。", "p3": "Gelman-RubinのR̂、有効標本サイズ、トレースプロットを、LLMで提案を生成するメトロポリス・ヘイスティングス法に当てはめ、シミュレーションと実データの事例で評価した。", "p5": "鎖が局所的な山にとらわれたり多様性が極端に低かったりしても、診断が誤って収束を示すことがあった。原因はLLMの提案の強い相関と、得られる鎖が非マルコフ的になることだとし、推奨される手順と研究課題を示した（抄録）。", "fun": "MCMCは、くじ引きのような試行を何度も繰り返して答えの分布を描く方法で、『もう十分混ざったか』を確かめる診断が欠かせません。賢いAIに次の一手を提案させると、その診断がだまされてしまうことがある、という警告が面白い点です。", "unverified": "具体的な事例と誤診断の頻度は抄録では未確認。"}}, {"id": "pn45", "rank": 45, "field": "統計学", "headline": "共分散推定の減衰は目的によって決まる", "title": "Memory for What?&nbsp;How the Objective Links Correlation Decay to Volatility Decay in Covariance Estimation", "url": "https://doi.org/10.2139/ssrn.7602921", "authors": "William Smyth", "venue": "SSRN", "date": "2026-10-13", "apa": "Smyth, W. (2026). Memory for What?&nbsp;How the Objective Links Correlation Decay to Volatility Decay in Covariance Estimation. https://doi.org/10.2139/ssrn.7602921", "why": "指数加重共分散の減衰率が市場の記憶だけでなく、推定を使う意思決定に依存することを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "共分散推定の『記憶の長さ』は市場の性質だけでなく、推定を何に使うかという目的で決まることを示した（抄録）。", "p3": "米国株で、ボラティリティと相関を別々に指数加重した共分散を作り、最小分散ポートフォリオの実現リスクとガウス尤度のそれぞれで相関の減衰を選び、事前に定めた検定とシミュレーションで比べた。", "p5": "最も短いボラティリティ設定で、ポートフォリオ目的は約45日分、尤度目的は約800日分の相関の記憶を選んだ。尤度の選んだ相関を使うと保留データでの最小分散リスクが約9%上がった。真の共分散が一定のシミュレーションでも効果が再現された（抄録）。", "fun": "過去のデータをどのくらい昔まで重視するかは、『市場がどれだけ昔を覚えているか』を表すと考えられてきました。でも実は、その推定で何をしたいかによって最適な長さが変わる、というのが面白い点です。同じデータでも目的が違えば答えが変わります。", "unverified": "なし"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "車両通過時の変位比で拡幅橋の継手剛性を同定", "title": "Condition Assessment of the Splicing Joint in Widened Bridges Using Vehicle-Induced Quasi-Static Displacement Transfer Ratios: Theory and Experiments", "url": "https://doi.org/10.1061/jbenf2.beeng-8539", "authors": "Zhilu Wang ほか", "venue": "Journal of Bridge Engineering", "date": "2026-10-13", "citescore": 7.2, "citescore_year": "2025", "apa": "Wang, Z., Liu, Z., Chen, L., Xing, J., Zhan, J., & Yang, Y. (2026). Condition Assessment of the Splicing Joint in Widened Bridges Using Vehicle-Induced Quasi-Static Displacement Transfer Ratios: Theory and Experiments. Journal of Brid
