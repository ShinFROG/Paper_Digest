<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-17", "intro": "プレプリントの新着805件（一覧の候補271件）、学術誌の新着（上位10%誌・重点誌・VBIの監視誌1,794件・うち一覧の候補314件、その他のQ1・Q2誌と国内誌の候補92件）、重要論文の候補280件（プレプリント210件・学術誌70件）、新着オープンデータ137件（一覧の候補116件）から選びました。プレプリント・関連41報、プレプリント・注目50報、論文誌・関連46報、論文誌・注目38報、オープンデータ29件です（関連の部とオープンデータは基準を満たす候補に絞りました。論文誌の注目は候補70件の多くが化学・材料の誌で、組織行動・心理的安全性以外の重点分野の候補が少なかったため上位10%誌の新着で補い、統計学・機械学習は各1報、因果推論は該当なしでした。プレプリントの注目では組織行動・心理的安全性と経営学の候補が少数でした。抄録のない新着は各部の16位以下に置きました）。e-Statの新しい統計表は今日の候補にありませんでした。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "調査前にLLMで合成回答を作り分析コードを準備", "title": "Efficiency Gains in Social Science Research: A Prospective Silicon Sampling Protocol for Pre-Treatment and Code Optimization", "url": "https://arxiv.org/abs/2611.18436", "authors": "Noa\\\"im Astitou ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Astitou, N., & Aucouturier, E. (2026). Efficiency Gains in Social Science Research: A Prospective Silicon Sampling Protocol for Pre-Treatment and Code Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18436", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のPDFの本文（手法・結果・方法論上の利得・結論の節）を読んだ。表1は抽出で崩れており本文の記述で確認", "preprint": true, "p1": "実データを集める前に3つのLLMで同じ質問紙への合成回答を作り、それで分析コードを先に書くと、実データ到着後の調整は約1週間で済み、コードの85〜90%をそのまま再利用できた（§5）。合成回答の忠実度は集合的な認識では高く、専門的な実践では低い（§6）。", "p2": "シリコン・サンプリング（LLMに回答者を模擬させること）は回答の代替として議論され、多数派への偏りや分散の縮小が指摘されてきた（§2）。本研究は代替ではなく、収集前の分析準備としての価値を問う（§2.4）。", "p3": "フランスの医用画像研究ネットワーク（FLI）を模した説明をClaude（Sonnet 4.6）・GPT 5.3・Kimi 2.6に与えて会員像を作らせ、実際の質問紙に各150人分を回答させた。3つを混ぜたMixteも作った（§3.1）。主題別の予測可能性指数TPI（変数ごとの差を0〜100点に標準化して平均）と自由記述の語の重なりWRSで比べた（§3.3–3.4）。", "p4": "比較の基準は実際の会員の回答（n=129）。検定はBenjamini–HochbergのFDRで補正し、TPIの閾値（90以上でほぼ完全など）は探索的な目安とする（§3.2–3.3）。", "p5": "TPIはChatGPT 73.8〜Claude 81.3で、貢献・影響・持続可能性は79.9〜95.3、放射線防護の倫理は50.3〜60.9だった（§4.2）。WRSはどれも50点未満（§4.3）。クラスタ数は実データ・Claude・Mixteが2、ChatGPTは8で安定性0.333と不安定だった（§4.4）。", "p6": "時間の節約は事後の質的な観察で、合成データを使わない対照条件はないと著者が認める（§5）。解釈：1つの専門家ネットワークの1回の調査の結果で、モデルの版に依存する。", "fun": "本番の調査の前に、AIに「たぶんこんな答えが返ってくる」という練習用の回答を作らせ、それで集計のプログラムを書いておく。本番のデータが届くと、プログラムの9割近くはそのまま使えた。一方でAIは、多数派の意見はまねできても、専門的な仕事の細かな実態はまねできなかった。AIを答えの代わりではなく練習台として使う発想が面白い。", "unverified": "表1の各変数の差の数値は抽出の崩れで未確認。コードの再利用率85〜90%は著者の事後的な見積もり。"}}, {"id": "pr02", "rank": 2, "headline": "課題に応じてLLMエージェントのペルソナを選ぶ", "title": "Who Should Be on the Panel? Task-Conditioned Persona Selection for LLM Trading Agents", "url": "https://arxiv.org/abs/2611.18150", "authors": "Boming Yang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Yang, B., Wang, Y., Guo, J., Iwasawa, Y., & Matsuo, Y. (2026). Who Should Be on the Panel? Task-Conditioned Persona Selection for LLM Trading Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18150", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（手法、実験の設定、主要な結果の表2・表3と図3、結論・限界）を読んだ", "preprint": true, "p1": "銘柄ごとに、値動きの方向を伏せた統計の概要から実在のトレーダー名のペルソナを6人選んで委員会を組むLLMの売買システムFinPanelで、委員の顔ぶれを課題に合わせて選ぶこと自体が成績を左右すると示した（§3、§5）。", "p2": "複数エージェントのLLMは役割の顔ぶれを固定して協調の仕方だけを設計しがちで、誰を入れるかは設計者任せだった（§1）。銘柄で適した売買スタイルが違う売買はその影響を見やすい。", "p3": "採用役が上下を伏せた値動きの概要（全リターンの符号を反転しても不変）から名前だけでペルソナを選び、各委員が同じ情報から独立に売り・買い・保持を主張し、記録係が委員ごとの階層的な成績記録を付け、責任者が主張と記録を読んで決める。記録は委員に返さないので委員は選ばれたスタイルのまま働く（§3.3）。", "p4": "公開の検証基盤FINSABERで、学習期限後の2025年に米国8銘柄を取引し、累積リターン（主指標）と最大ドローダウンで、同じ枠組みで再実装した既存のLLM売買エージェント3種や規則・予測・強化学習の手法と比べた。基盤モデルはgpt-oss-120b（§4.1）。", "p5": "8銘柄平均の2025年通年の累積リターンは16.1%で、論文どおりに動かした既存エージェントの最良7.9%を上回り、ドローダウンは全銘柄で買い持ちより浅かった（§4.2）。同じ6席を固定の顔ぶれにすると7.2%、銘柄名だけで選ぶと7.9%に下がった（表3）。席数を増やしても、責任者の読み込みでも選択の効果は代替できなかった（§4.5）。", "p6": "8銘柄・1年（全銘柄が上昇した年）・1つの基盤モデルに限られ、収益ではどのLLM手法も買い持ちに勝てなかったと著者が認める（§5、限界）。解釈：実在の人名でスタイルを呼び出すため、効果がモデルの持つ人物像の知識に依存する。", "fun": "株の売買を一人の名人に任せるのではなく、銘柄ごとに向いた「名人の委員会」を組む。しかも委員選びには、株価が上がったか下がったかは見せず、揺れ方の特徴だけを見せる。同じ6人の委員でも、顔ぶれを銘柄に合わせて変えるだけで成績が倍近く違った。誰に話し合わせるかが、どう話し合わせるかより大事だったという点が面白い。", "unverified": "表1の銘柄ごとの数値と、記録の階層化の効果（§4.4）の詳細は読み切れていない。"}}, {"id": "pr03", "rank": 3, "headline": "複数LLMの協調の利得は計算量をそろえると消える", "title": "More Agents, More Samples, or More Thinking? Untangling Coordination, Ensembling, and Test-Time Compute in Multi-Agent LLMs", "url": "https://arxiv.org/abs/2611.17610", "authors": "Seyed Mahmoud Sajjadi Mohammadabadi", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Mohammadabadi, S. M. S. (2026). More Agents, More Samples, or More Thinking? Untangling Coordination, Ensembling, and Test-Time Compute in Multi-Agent LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17610", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（比較対象の4分類、統合の結果、多層モデル、能力の閾値、限界、結論の節）を読んだ", "preprint": true, "p1": "複数のLLMエージェントの協調の利得は、単体側にも同じ試行回数や計算予算を与えて比べると消え、むしろ平均で正答率が0.042下がることを、9研究・516構成の統合で示した（§5.3、§7）。", "p2": "複数エージェントの評価は単体の1回の生成（貪欲法）と比べることが多く、協調の効果と、試行の多さ・推論の計算量の効果が混同されていた（§1）。", "p3": "6次元の資源ベクトル（エージェント数・試行数・推論トークンなど）で構成を整理し、比較対象を4分類した。A：単体1回、B：試行回数をそろえる（例：自己整合性の多数決）、C：計算予算をそろえる、D：精度と費用のパレート前線（§3.5）。各論文から対の差を抽出し、記述統計と3層のREMLモデル（対数オッズ）で統合した（§5.4）。", "p4": "評価指標は正答率の差。比較対象の強さを段階的に上げ、1つの研究を除いても結果が保たれるかを確かめた（§5.3）。", "p5": "Aに対する平均差は−0.032だが、B・Cでは474対の平均が−0.042で、74%の対で複数エージェントは同等以下だった。対数オッズの推定は−0.195（95%区間−0.320〜−0.070）（表3）。両方の比較を持つ5研究すべてで、比較対象を1回から多試行にすると差が平均0.038下がった（§5.3）。", "p6": "研究は9本で、1本が516構成のうち180を占め、最初の5本は検索手順なしに選ばれたと著者が認める（§5.7）。著者は、情報が分割されているとき、外部の検証があるとき、モデル間で誤りが異なるときに限って協調が効きうると論じる（§7）。", "fun": "AIを何人も集めて話し合わせると賢くなる、と言われてきた。しかし、一人のAIに同じ回数だけ考え直させ、多数決をとるだけでも同じかそれ以上の成績が出ることが多かった。話し合いの効果だと思われていたものの多くは、単に「たくさん試した」効果だったのである。比べ方を公平にするだけで結論が変わる点が面白い。", "unverified": "研究ごとの詳しい対の一覧（付録B）は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "米国の規則制定への意見4,230万件で多元性を評価", "title": "DOCKET: A Pluralistic Benchmark for Evaluating AI-Assisted Policy Feedback in U.S. Rulemaking", "url": "https://arxiv.org/abs/2611.17914", "authors": "Alexander Spangher ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Spangher, A., Peale, C., Casacuberta, S., Wu, V. Y., Suzgun, M., Martin, O. H., Bateyko, D., Handan-Nader, C., Yang, D., Koyejo, S., & Ho, D. E. (2026). DOCKET: A Pluralistic Benchmark for Evaluating AI-Assisted Policy Feedback in U.S. Rulemaking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17914", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（データの作り方、3つの所見、ベンチマークの作成と結果、考察・結論）を読んだ", "preprint": true, "p1": "米国の連邦規則への意見公募（Notice & Comment）の意見4,230万件を規則案の条項に結びつけた資料DOCKETを作り、LLMが書く意見は人の意見の主張と18〜30%しか重ならず、政府側の立場に偏ることを示した（抄録、§4.2）。", "p2": "AIの多元性（多様な人の視点を表す力）の既存のベンチマークは一般的な意見が中心で、専門的で利害の絡む実際の政策の議論に根ざしていなかった（§4）。", "p3": "2016〜2026年の44機関・2万2,400件の規則への意見を集め、規則案の条項・意見の主張・最終規則を対応づけた（§2）。ベンチマークは558件の規則案（条項2万2,837、実際の主張4万3,371）で、LLMに規則案への意見を書かせ、狙う条項、主張、論の枠組み、文体の一致を適合率・再現率で測り、利害関係者別の同意率も求めた（§4.1）。", "p4": "比較の基準は実際の公募意見。gpt-4o-mini・gpt-5-mini・gpt-5・Llama 2種を、そのまま、ペルソナの指定、少数例、検索拡張（RAG）、道具の使用で試した（§4.1）。", "p5": "主張の適合率は18〜30%と低い一方、枠組みと文体は65〜82%と高く、人らしい文章は書けても各集団の関心は捉えられなかった（§4.2）。gpt-5-miniの主張は85.9%が修正の提案（人は43.8%）、反対は5.1%（人は30.4%）。人は少数の条項に集中するが、モデルは条項の78〜99%に満遍なく触れた。ペルソナの指定は立場を変えても、どの論点を出すかはほとんど変えなかった（§4.2）。", "p6": "意見の照合や分類にLLMの判定を使っており、照合にも誤りが残ると著者が認める（付録A.9）。解釈：評価は米国の連邦の規則に限られ、他国の公聴の制度への一般化は確かめられていない。", "fun": "国が新しい規則を作るとき、国民や企業、労働組合などから意見を募る。AIにその意見を書かせると、文章はそれらしくても、実際の人が問題にした点とは2割から3割しか重ならなかった。しかもAIは政府や業界寄りで、労働者の安全の訴えにはあまり触れなかった。「それらしく書ける」ことと「人々の声を代弁できる」ことは違うと示した点が面白い。", "unverified": "付録の利害関係者別の同意率の全表（表18）と人による検証の詳細は読んでいない。"}}, {"id": "pr05", "rank": 5, "headline": "熟練の橋梁点検者の推論を階層データで保存", "title": "道路橋点検の熟練技術者の推論構造を保持した階層的データセットの構築に向けた実践研究", "url": "https://doi.org/10.51094/jxiv.7124", "authors": "小林 ほか", "venue": "Jxiv", "date": "2026-11-09", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "JxivのPDFの本文（はじめに、既往研究、データの要件、データセットの例示の前半）を読んだ。2段組の抽出で文の順序が崩れており、例示の後半は読み切れていない", "preprint": true, "p1": "道路橋点検の熟練技術者の判断を、画像と所見の対応ではなく、根拠・論拠・結論・措置方針の推論構造と、橋全体から部材・局所の変状までの階層、点検・補修の履歴とを結びつけて保存する、AIで再利用できるデータ構造（AI-Ready）を提案した（§1、§4）。", "p2": "SDNET2018やCODEBRIMなどの既往のデータは、画像と変状のラベルの対応が中心で、技術者がどこに着目し、どう解釈して判断したかという過程を保存できていない（§2(4)）。点検調書や補修履歴もPDFやExcelで人が読む前提で蓄積され、情報間の意味の関係は構造化されていない（§1）。", "p3": "Polanyiの暗黙知の議論から、暗黙知そのものではなく、暗黙知を背景に外在化された判断を対象とする方針を立てた（§3）。熟練者の判断が観察事実から損傷の状態・原因の仮説を立て、関連情報と照合して結論と措置方針に至る仮説演繹的な構造で説明できるという既往の知見を土台に、シーングラフや時空間知識グラフの考え方を取り入れ、対象の時空間・階層の文脈と推論の関係を一体で保持する構成とした（§2(3)、§3）。", "p4": "定量的な評価はなく、道路橋の地震後の点検を題材にデータセットの構成を例示し、従来の画像と所見中心のデータで失われやすい判断の文脈を保持できることを示す（§4）。", "p5": "1つの所見を観察事実・技術的な解釈・結論・措置方針に分けて保持し、部材と構造要素の関係や過去の履歴との関係も含めて時空間の情報を補う構成を例示した（§4(1)）。一つの根拠から複数の仮説ができる場合や、複数の観察が一つの結論を支える場合を、一方向の流れでなく命題間の関係として表すとした（§2(3)）。", "p6": "AIの学習での効果は検証していない。解釈：データ化の手間と、技術者ごとに推論の書き方がぶれることへの対処は今後の課題と考えられる。", "fun": "ベテランの点検員は「このひび割れは心配ない」と一言で書くが、その裏では、橋全体の形、周りの部材の様子、昔の補修の記録などを頭の中で照らし合わせている。写真と一言だけを記録しても、その考えの筋道は残らない。この研究は、根拠・理由・結論・対策を分けて、橋のどの部分の話かと一緒に保存する入れ物を設計した。熟練の技を「考えの地図」として残す発想が面白い。", "unverified": "例示したデータセットの具体的な項目数や形式（グラフの記法など）は、抽出の崩れのため確認できていない。"}}, {"id": "pr06", "rank": 6, "headline": "強化学習で非線形系の同定に向く入力を設計", "title": "A Reinforcement Learning Approach to Space-Filling Input Design for Nonlinear System Identification", "url": "https://arxiv.org/abs/2611.18229", "authors": "Charly Witmeur ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Witmeur, C., Cruz, G. G., Schoukens, M., Runacres, M. C., & Decuyper, J. (2026). A Reinforcement Learning Approach to Space-Filling Input Design for Nonlinear System Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18229", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（問題設定、報酬・観測の設計、評価指標、2つの系の結果、結論）を読んだ。表1・表2の数値は本文の記述で確認", "preprint": true, "p1": "非線形のシステム同定の実験で使う入力信号を、系の状態空間をまんべんなく探索するように強化学習で学ばせる設計法を示し、振幅の上限が同じ条件で既存の入力より広く均一に状態を覆えることを2つの系で示した（§4.4、§5）。", "p2": "古典的な入力設計は線形モデルのパラメータの分散を小さくするもので、非線形のブラックボックスでは注目領域でのモデル構造の偏りが主な誤差になる（§1）。既存の空間充填の設計は入力の種類（マルチサインなど）を事前に決め、最適化を解き直す必要があった（§3）。", "p3": "入力は1サンプルずつエージェントが振幅の上限内で選ぶ。注目領域を格子に分けた訪問テンソルを持ち、初めての格子に入れば報酬1、再訪には訪問回数の平方根に反比例するボーナスを与える（式(2)(3)）。観測は現在と過去の状態、直前の入力、訪問テンソルの圧縮表現で、PPOで学習する（§3）。設計はオフラインで、本研究では代理モデルの代わりに正確な運動方程式を使った（§2）。", "p4": "非線形ばね付きの質量-ばね-ダンパ系とVan der Pol振動子で、調整済みの掃引正弦波、クレストファクタ最適化マルチサイン、既存の空間充填マルチサインと比べた。指標は覆った領域の割合C、最大の空白（ボロノイ図の最大セル面積比M）、均一さ（セル面積の変動係数CV）（§4.3）。", "p5": "機械系ではRL入力がC=71.72%、CV=0.52と最良で（他は最大47.34%、CVは1.09〜1.99）、中央の1か所の空白でMだけは最大だった。学習された入力は約2 Hzの共振を突く振幅変調の振動になった（§4.4.1）。Van der Pol系ではCは30.46%と小さめだが、MとCVが最小だった（§4.4.2）。", "p6": "得られたデータで実際にモデルを同定した精度の比較はしておらず、代理モデルの誤差や計測雑音のもとでの実機への適用も今後の課題と著者が述べる（§5）。", "fun": "機械の性質を調べるには、いろいろな揺らし方を試して反応を記録する。この研究では、AIに「まだ行ったことのない状態に行けたらごほうび」というゲームをさせて、揺らし方そのものを考えさせた。するとAIは、教えられていないのに機械の共振の振動数を見つけ、揺れの大きさを強弱させる賢い揺らし方にたどり着いた点が面白い。", "unverified": "表1・表2の累積報酬の値と、学習の計算時間は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "粒子の軌跡から相互作用核を弱形式で学習", "title": "Mesh-Free Weak-Form Regression for Learning Interaction Kernels from Particle Trajectories", "url": "https://arxiv.org/abs/2611.18455", "authors": "Daisuke Inoue ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Inoue, D., & Kalise, D. (2026). Mesh-Free Weak-Form Regression for Learning Interaction Kernels from Particle Trajectories (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18455", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（手法、主定理の要約、数値実験の1次元・2次元・10次元、結論）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "ノイズのある粒子の位置の記録だけから、速度の推定も密度の再構成も格子も使わずに粒子間の相互作用の関数（相互作用核）を推定する弱形式の回帰を示し、誤差を粒子数・時間刻み・観測雑音・ペアの抽出の寄与に分けて評価できるようにした（§2、定理1）。", "p2": "相互作用核の推定は、雑音のある位置を差分して速度を求めると雑音が増幅され、平均場の密度を再構成すると格子や密度推定の誤差が入り、全ペアの計算は粒子数の2乗の費用がかかった（§1）。", "p3": "確率微分方程式 dX_i = (1/N)Σ K(X_i−X_j) dt + σ dW_i に従う粒子に、滑らかな空間・時間の試験関数をかけて粒子平均と部分積分を行うと、速度を使わない恒等式（弱形式）が得られる（§2.2）。核を候補関数の辞書で展開し、残差の二乗を最小化するLASSO（疎な回帰）で係数を求め、相互作用はP組の抽出したペアで評価して費用をO(N²)からO(P)に下げる。平均場極限での同定可能性を有限粒子へ移して係数誤差の高確率の上界を導いた（§3）。", "p4": "1次元のニュートン型斥力、2次元の捕食者-被食者、10次元の距離に局在した相互作用の模擬で、弱形式と前進差分（強形式）を、LASSO・Ridge・OLSで比べた。指標は係数のRMSEとドリフトの誤差（§4）。", "p5": "1次元（N=1000、Δt=0.005）で正確な位置からの係数RMSEは弱LASSO 2.09、弱OLS 15.99、強形式LASSO 2.42、観測雑音0.1では3.85、31.28、1814で、弱形式の時間積分が雑音の増幅を抑えた（§4.2、図2a）。Δtに対する誤差の傾きは0.555で、理論のO(√(Δt/P))と整合した。3つの実験すべてで弱LASSOの係数とドリフトの誤差が最小だった（§5）。", "p6": "辞書に真の核が正確に含まれ、拡散の強さσが既知であることを仮定し、どの候補関数が効くか（台）の回復と異質な粒子系の理論は未解決と著者が述べる（§3、§5）。", "fun": "鳥の群れや人ごみの動きの記録から、「近づくと押し合い、遠いと引き合う」といった粒子同士の力の法則を逆算したい。ところが、ふらつく位置の記録から速さを計算すると誤差が大きくなる。この研究は、記録をなめらかな関数で「ならして」から使うことで、速さを計算せずに力の法則を取り出した。少し離れて眺めることで雑音に強くなる点が面白い。", "unverified": "2次元・10次元の実験の表の数値（係数とドリフトの誤差の対応）は表の抽出が崩れており、個々の値は確認できていない。"}}, {"id": "pr08", "rank": 8, "headline": "スコア関数で反応拡散を粒子のODEとして解く", "title": "Score-based neural ordinary differential equations for reaction-diffusions", "url": "https://arxiv.org/abs/2611.18467", "authors": "Jianguo Hou ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Hou, J., & Li, W. (2026). Score-based neural ordinary differential equations for reaction-diffusions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18467", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（問題設定、重みつき特性曲線、数値実験の3例、表1・表2）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "反応拡散方程式（拡散に加えて密度が局所的に増減する方程式）を、位置と質量の重みを運ぶ粒子が学習した速度場に沿って動く常微分方程式として解くラグランジュ型の方法を作り、質量が保存されない場合にも密度・スコア・質量を粒子の上で追えるようにした（§2、§4）。", "p2": "拡散方程式はスコア関数（密度の対数の勾配）が駆動する輸送方程式に書き換えられるが、従来の確率流の方法は総質量の保存を前提としていた（抄録）。反応で重みが偏ると少数の粒子に質量が集中し、格子による密度推定は高次元で雑音と偏りが増える（§1）。", "p3": "各粒子が位置X、対数密度ℓ、スコアS、対数質量λを運び、反応項はℓとSの時間発展に入れ、重みで質量の変化を追う（命題2.3）。速度vが自分の誘導する密度について v = b − γ∇log μ[v] を満たせば正しい解になる（命題2.4）ので、この自己整合の残差を学習の目的とし、反応率が非増加なら相対エントロピーの不等式で誤差を抑えられることを示した（§2.3–2.5）。時間を短い窓に分け、窓ごとに固定した速度で粒子データを作ってネットワークの速度を回帰する（§3）。", "p4": "厳密解のある線形の湧き出し付きOU方程式、Fisher–KPP方程式（1次元・3次元）、混合ガウスへのWasserstein–Fisher–Rao勾配流で、独立の参照解と速度・質量・分布・スコアの誤差を比べた（§4）。", "p5": "OUでは質量誤差と運んだスコアの誤差が1%未満、分布誤差が0.01未満だった（表1）。Fisher–KPPの3次元では総質量が4.0から129に増える成長と外向きの前線を再現した（図5）。混合ガウスでは速度誤差約4%、質量誤差0.74%以下で、初期に質量のほとんどない場所に新しい山ができる様子を捉え、将来の質量で重みづける工夫が有効だった（表2）。", "p6": "誤差の保証は反応率が非増加で増加率が有界な場合に限られる（§2）。解釈：高次元での計算費用と、他の方法（格子法や確率的な粒子法）との精度・費用の比較は、読んだ範囲では限定的だった。", "fun": "インクが水に広がる様子は、インクの粒が「濃い所から薄い所へ」押し出されるように動くと考えても計算できる。この研究は、さらに粒が途中で増えたり減ったりする場合（生き物の繁殖など）まで、一粒一粒に「重さ」を持たせて追いかけた。最初はほとんど何もない場所に新しい山が育つ様子まで再現できる点が面白い。", "unverified": "Fisher–KPPの誤差の具体的な上限値と、表2の比較条件ごとの数値の対応は、表の抽出の崩れで確認できていない。"}}, {"id": "pr09", "rank": 9, "headline": "学習した車両力学モデルの物理的な忠実度を検証", "title": "Physical Fidelity of Learned Nonlinear Vehicle Dynamics: Validation Selection, Observational Bias, and Architecture-Conditioned Inductive Bias", "url": "https://doi.org/10.21203/rs.3.rs-11443334/v1", "authors": "Josafat Leal FIlho ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "FIlho, J. L., & Fröhlich, A. A. (2026). Physical Fidelity of Learned Nonlinear Vehicle Dynamics: Validation Selection, Observational Bias, and Architecture-Conditioned Inductive Bias. https://doi.org/10.21203/rs.3.rs-11443334/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文はPDFが取得できず未読", "preprint": true, "p1": "学習した非線形の車両力学モデルが、名目の軌跡は再現しても局所の接線（ヤコビアン）や有限時間の応答を誤ることを、解析的な3・7・14状態の車両モデルで評価し、検証データの選び方と学習の工夫がどの忠実度を良くし、どれを悪くするかを示した（抄録）。未査読。", "p2": "車両力学の学習モデルは軌跡の一致で評価されがちで、物理的に重要な局所の振る舞いまで正しいかは確かめられていなかった（抄録）。解釈：車両の振動から路面や橋を推定する逆解析では、軌跡より局所の感度が効くことが多い。", "p3": "参照の解析モデルを使い、ベクトル場、ヤコビアン、方向の変形、局所で固定した伝播作用素（frozen-local propagator）の4つの指標で忠実度を測り、物理に基づく検証データの選択、被覆を制約したラグランジュ型の選択、損失の適応的なつり合い、AdamからL-BFGSへの切り替え、モデルの構造を比べた（抄録）。", "p4": "比較の基準は無作為の抽出と、事前に定めた実用上の閾値5%。新しい乱数の種での再学習と、Holm法の多重比較の補正で判定した（抄録）。", "p5": "10%の予算で、参照に基づく選択（対称な成長）は重要な領域のマクロ再現率0.4338で、無作為の0.1011より高かった。物理に基づく選択は14状態のヤコビアンの誤差を2.09%減らしたが閾値5%に届かず、伝播作用素の5.80%の減少も補正後は有意でなかった。被覆制約つきの選択はヤコビアンの誤差を16.5%改善する一方、伝播作用素の誤差を27.6%悪化させた（抄録）。716の保存済みモデルの分析では、介入は前後方向やピッチなどを改善し横速度とロールを悪化させるなど、忠実度を状態間で付け替えていた（抄録）。", "p6": "損失の適応的なつり合いと最適化の切り替えは一貫した利得を示さず、構造の効果は学習器のパラメータ化に依存した（抄録）。解釈：実測データでの検証の有無は抄録から分からず、解析モデル上の結果である。", "fun": "車の動きをAIに覚えさせると、ふつうに走る様子はうまくまねできるのに、ハンドルを少し切ったときの細かな反応がずれていることがある。この研究では、ある部分の正確さを上げる工夫をすると、別の部分の正確さが下がることが多かった。全体の点数だけでは見えない「得意と苦手の入れ替わり」を見える化した点が面白い。", "unverified": "本文を読めておらず、モデルの構成（ネットワークの種類）、データの量、各指標の定義の詳細は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "仮想将来世代の視点で水道インフラ計画を熟議", "title": "Planning and Assessment of Future Water Supply Infrastructure through \"Imaginary Future Generations\" -A Deliberation Experiment with Municipal Officials", "url": "https://doi.org/10.2139/ssrn.7690758", "authors": "Keishiro Hara ほか", "venue": "SSRN", "date": "2026-11-16", "apa": "Hara, K., Aoki, N., & Fuchigami, Y. (2026). Planning and Assessment of Future Water Supply Infrastructure through “Imaginary Future Generations” -A Deliberation Experiment with Municipal Officials. https://doi.org/10.2139/ssrn.7690758", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は取得できず未読", "preprint": true, "p1": "仮想将来世代（Imaginary Future Generations、将来の世代の立場に立って議論する手法）を、吹田市の水道局職員との熟議の実験に使い、水道インフラの計画の議論の重点が費用対効果から将来の社会の状態へ移ることを示した（抄録）。未査読。", "p2": "水道などのインフラの維持管理の計画は長期にわたるが、現在の視点の議論では費用対効果が優先されがちで、将来の利用者やリスクを計画に反映する方法が課題だった（抄録）。背景：仮想将来世代の手法は、人や社会の「フューチャー・デザイン」の研究で将来を思いやる力を高めると報告されてきた。", "p3": "大阪府吹田市の水道局の職員と、水道インフラの維持管理の課題について計5回のワークショップを行い、現在の視点と将来（仮想将来世代）の視点での議論の内容を比べ、参加者への質問紙で政策を評価する基準の相対的な重要度を調べた（抄録）。", "p4": "比較の基準は同じ参加者の現在の視点での議論と、ワークショップ前後の質問紙の回答。評価は議論の内容の質的な分析が中心である（抄録）。", "p5": "将来の視点では、地震など将来のリスクと危機への意識が目立って高まり、それに対応する新しい政策の方向を提案する傾向が見られ、他の事業者を含む広い運営の文脈を考えつつ将来の利用者へのサービスを重視する提案に傾いた（抄録）。質問紙では「費用対効果」の重要度が下がり「水の利用者のニーズ」が上がり、効果はワークショップの後も続いたと示唆された（抄録）。", "p6": "参加者は1つの自治体の職員に限られ、対照群の有無と統計的な検定の詳細は抄録から分からない（解釈）。著者は、得られた知見が水道インフラの長期計画と評価の新しい方法論の開発に役立つとしている（抄録）。", "fun": "水道管は何十年も使うので、今の予算の都合だけで決めると、未来の住民が困ることがある。この実験では、市の職員に「自分は30年後の住民だ」と想像して話し合ってもらうと、話題が「安く済むか」から「将来どんな社会になり、地震にどう備えるか」に変わった。立場を想像するだけで議論の中身が変わるという点が面白い。", "unverified": "参加者数、ワークショップの具体的な手順、質問紙の尺度と数値は抄録から確認できない。"}}, {"id": "pr11", "rank": 11, "headline": "LLMの自己対戦で表データの異常検知を強化", "title": "f-Divergence Self-Play for Tabular Anomaly Detection via Large Language Models", "url": "https://arxiv.org/abs/2611.18370", "authors": "Hoang Tran Vuong ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Vuong, H. T., Van, L. N., Nguyen, D., Nguyen, T., Nguyen, P., Harandi, M., & Le, T. (2026). f-Divergence Self-Play for Tabular Anomaly Detection via Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18370", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（手法と定理3.1、実験の設定、主要な結果、アブレーション、異常検知以外への一般化）を読んだ。付録の詳細表は読んでいない", "preprint": true, "p1": "表の行をテキストにしてLLMに読ませる異常検知で、モデル自身が生成した「正常らしくない」サンプルを擬似異常として使う自己対戦の微調整（DiSPaT）により、正常データの記述を引き締め、既存のLLM法・深層学習・古典的な手法を上回った（§3、§4.1）。", "p2": "数値・カテゴリ・テキストが混じる表データでは正常の表現を学びにくい（§1）。行を文章化してLLMを正常データの尤度で一度だけ微調整する既存法（AnoLLM）は、異常の例がないため決定境界が緩くなりやすかった（§3）。", "p3": "各反復で、現在のモデルが生成した続きの系列を擬似異常とし、判別器が本物の正常データと区別するよう学び、その信号でモデルを更新して生成分布を正常データの分布に近づける。目的はf-ダイバージェンスの最小化で、Fenchel共役による上下からの評価（定理3.1）で学習目的との近さを示し、判別器を対数比で暗黙に表して1つの最適化にまとめた（§3）。擬似異常は本当の異常を模すためではなく、だんだん難しくなる「正常でない」参照として働く。", "p4": "テキスト・数値・カテゴリを含む6つのデータ（Fakejob、Lymphography、Seismic、Vehicle、20 Newsgroups、Ecoli）とODDSの数値データ30個で、AUC-ROC・AUC-PR・F1を、AnoLLMと古典・深層の手法と比べた。モデルはSmolLM 135M・360M・1.7B（§4）。", "p5": "平均AUC-ROCはAnoLLMより135Mで8.1%、360Mで7.6%、1.7Bで5.8%高く、AUC-PRとF1でも改善した（§4.1）。古典・深層の最良の手法より、AUC-ROCで少なくとも12.7%高かった。f-ダイバージェンスはKLが最良で（§4.2）、反復とともに性能はおおむね上がり、多くは3回目までに伸びた（図1）。対話の整合化（SPIN）の設定でも平均スコアが42.26から43.80に上がった（§4.3）。", "p6": "比較対象の値の一部は先行研究の報告値をそのまま用いている（表1の注）。解釈：反復ごとに生成と再学習を行うため計算費用が増え（付録B.2で扱う）、大規模な表への適用の費用は読んだ範囲では未確認。", "fun": "偽札を見破る名人になるには、本物をよく見るだけでなく、だんだん精巧になる偽物と見比べるのが効く。この研究では、AIが自分で「本物そっくりだが少し違う」データを作り、それと本物を見分ける練習を繰り返す。本当の異常の例が一つもなくても、自作の偽物で目を鍛えられる点が面白い。", "unverified": "データセットごとのAUC-ROCの値（表1〜3）は、表の抽出の崩れで確認できていない。"}}, {"id": "pr12", "rank": 12, "headline": "ネットゼロ開示の量と具体性を重みつき辞書で測る", "title": "Measuring What Companies Say about Net Zero and Climate Transition: A Weighted-Lexicon Framework with ClimateBERT Corroboration", "url": "https://doi.org/10.21203/rs.3.rs-11478503/v1", "authors": "Srikanth Potharla", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Potharla, S. (2026). Measuring What Companies Say about Net Zero and Climate Transition: A Weighted-Lexicon Framework with ClimateBERT Corroboration. https://doi.org/10.21203/rs.3.rs-11478503/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research Squareの原稿PDFの本文（データ、辞書の構成と重み、文脈の安全装置、ClimateBERTによる裏づけ、検証と頑健性、考察）を読んだ", "preprint": true, "p1": "年次報告書のネットゼロ・気候移行に関する記述の量と具体性を、18カテゴリ・273パターンの重みつき辞書を段落単位で当て、ClimateBERTで裏づける透明で監査可能な指標（NZCTD）として測れるようにした（抄録、§3）。実際の排出削減や誠実さの指標ではないと明記している。", "p2": "開示のテキスト分析は、規模は大きいが区別のない語数の集計と、文脈に敏感だが費用のかかる手作業の符号化の間でトレードオフがあった（抄録）。汎用の辞書は文脈を扱いにくい（§3.4）。", "p3": "辞書は版管理したJSON（v1.3）で、重み4はネットゼロと排出の目録、3は排出スコープ・目標・移行計画・進捗、2は時期・数量化・相殺・統治・保証・財務、1はエネルギー・事業・バリューチェーンの行動、0は弱い文脈と外部主体の印とした（§3.4）。インドのPAT制度やBRSR、ラーク・クロール単位の表記にも対応する。段落ごとに文脈の安全装置で該当を判定し、該当した段落だけにClimateBERTを当てて別の分類で確かめる（§3.5–3.6）。", "p4": "インドの上場468社・4,048社年（2013〜2025年度）に適用し、記述統計、主成分分析、重みなしの合計との比較、再計算による整合の確認を行った（§3.2、§4.2）。標本は保存資料からの便宜的なもの（§3.2）。", "p5": "平均点は319.58（中央値140.0）で右に大きく偏り、年平均は2013年度の約32.2から2025年度の約909.7へ28.25倍に増えた（抄録）。重みつきと重みなしの得点の相関はPearson 0.9855、Spearman 0.9919で（§4.2）、第1主成分が分散の46.85%を説明した。ClimateBERTによる確認の比率は後年で約0.684だった（抄録）。", "p6": "ClimateBERTの確認は辞書で選んだ段落に条件づけられており、人の符号化による正解との精度評価はないと著者が認める（§4.2）。年ごとの増加は保存資料の構成や文書の長さの影響を分けておらず、規制の効果は識別していない（§4.3）。", "fun": "会社の報告書に「ネットゼロ」という言葉が何回出てくるかを数えるだけでは、本気度は分からない。この研究は、「2050年までに」「スコープ3」のような具体的な言葉ほど高い点をつける採点表を作り、さらにAIに文脈を確かめさせた。インドの企業ではこの点数が12年で28倍に増えていた。言葉の「量」と「具体さ」を分けて測る工夫が面白い。", "unverified": "表1の各カテゴリのパターン数と、カテゴリ別の出現率の数値は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "高・低精度のデータを合わせて縮約モデルを学習", "title": "Multifidelity Operator Inference for Dynamical Systems", "url": "https://arxiv.org/abs/2611.17503", "authors": "Vignesh Sella ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sella, V., Chaudhuri, A., & Willcox, K. (2026). Multifidelity Operator Inference for Dynamical Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17503", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のPDFの本文（手法の多忠実度の損失、数値実験の設定、図表のキャプション、結論）を読んだ。式の多くはPDFの抽出で崩れており、細部は読み切れていない", "preprint": true, "p1": "少ない高精度（HF）のスナップショットと多い低精度（LF）のスナップショットを1つの回帰に組み込み、非侵入的な縮約モデル（Operator Inference、OpInf）を学ぶ多忠実度の方法MF-OpInfを示し、同じ訓練の計算予算で未知のパラメータへの予測誤差を反応拡散で最大87%、円柱まわりの流れで28%減らした（抄録、§V）。", "p2": "OpInfはスナップショットの射影から縮約作用素を最小二乗で学ぶが、高精度のシミュレーションは高価で、パラメータの範囲や訓練の時間幅が限られ、縮約モデルの予測が不正確・不安定になりうる（抄録、§I）。", "p3": "制御変量の考え方に基づく多忠実度の最小二乗で、各忠実度の残差の損失を組み合わせ、複数の軌跡にまたがる1組の縮約作用素を学ぶ（§III.B）。LFの軌跡はHFより多くのパラメータと長い時間を覆い、基底も重みつきPOD（固有直交分解）でLFのデータを使って改善する（§III.C）。予算の配分は、HFの軌跡を減らしてLFに回す配分1と、HFの軌跡を短くする配分2を比べた（図3）。", "p4": "正弦波の強制項をパラメータにした3次の非線形反応拡散方程式と、入口のパルスをパラメータにした2次元の円柱まわりの非圧縮流で、同じ訓練シミュレーション費用のHFのみのOpInfと、訓練範囲を超える時間の相対L2誤差で比べた（§IV、表2、表5）。", "p5": "配分1で、HFの訓練時間を超える区間の未知パラメータでの平均相対誤差は反応拡散で約87%、円柱流で28%下がった（§V）。基底の構成と作用素の当てはめのどちらにLFのデータを使っても誤差が下がった（表6）。配分2の改善は一貫しなかった（§V）。", "p6": "配分2は特に円柱流で利得が不安定で、検証データによる係数の選択が最小の試験誤差の構成を選ばないこともあったと著者が認める（§V）。多忠実度の係数・正則化・基底の重みの選び方は今後の課題。", "fun": "精密だが時間のかかる計算は少しだけ、粗いが速い計算はたくさん行い、両方をうまく混ぜて「速くて正確な縮小版の模型」を作る研究である。粗い計算は細部で間違うが、精密な計算が届かない条件や先の時刻の手がかりをくれる。同じ計算時間で、未知の条件での予測の誤差を大きく減らした点が面白い。", "unverified": "MF損失の具体的な式と係数αの役割、表2・表5の個々の数値は、PDFの抽出の崩れで確認できていない。"}}, {"id": "pr14", "rank": 14, "headline": "LLMはペルソナを捨てられても人格は捨てられない", "title": "Language Models Can Shed a Persona but Not the Person", "url": "https://doi.org/10.5281/zenodo.24249957", "authors": "Chen ほか", "venue": "Zenodo", "date": "2026-11-15", "apa": "Chen, Y., Wang, X., & Zhang, H. (2026). Language Models Can Shed a Persona but Not the Person (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.24249957", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDFの本文（抄録、考察、限界、データの公開方針）を読んだ。結果の節の個別の図表は読み切れていない", "preprint": true, "p1": "架空の人物のペルソナを小型のLLM（Qwen3-4B）に2通りの方法で埋め込むと、同一性の質問への答えは同じでも内部表現の変化の経路が違い、28層の低ランクの部分空間を固定するとペルソナはほぼ消えるが、元の「AIアシスタント」としての自己認識は戻らないことを示した（抄録、考察）。Zenodo上の未査読の原稿。", "p2": "ペルソナを持たせたLLMで、ペルソナを表現の上でどう取り除けるか、取り除いた後に何が残るかは明らかでなかった。線形の消去の研究は、どこへ射影するかの影響を報告してこなかった（考察）。", "p3": "架空のピアノ調律師「Wenzhi」の一人称の対話で全面的に微調整する方法（C）と、システムプロンプトでその人物を演じた元モデルの答えで自己蒸留する方法（D）を、プロンプトのみ（B）、三人称の書き換え（T）、ペルソナなしの日常対話（F）の対照（各3つの乱数の種）と比べ、活性化の変化と、部分空間を元モデル（A）の平均へ固定する介入を調べた（抄録）。", "p4": "評価は保留した同一性の質問への回答で、人物として答える割合、AIと名乗る割合、文章の破綻を、Gemini 3.8 Flashの判定（著者1人の注釈で較正）で測った（限界）。", "p5": "B・C・Dは同一性の質問の91〜96%にWenzhiとして答えた。28層のランク2〜8の部分空間を平均に固定するとWenzhiの答えは3〜8%に下がり（無作為の部分空間では90〜99%）、破綻は10%以下だった。固定後のモデルがAIと名乗るのは5〜10%（元モデル71%）で、ペルソナなしの微調整（F）だけでもAIとしての自己認識は74%から18〜20%に下がった（抄録）。原点へゼロにする消去では、動物や電子的な存在として話す答えが40〜54%出た（抄録）。", "p6": "1つの中国語の架空の伝記と1つの4Bモデルに限られ、CとDは学習データの長さや事実の頻度が異なり、判定は1つのモデル系統で行ったと著者が認める（限界）。著者は、微調整したモデルが人間だと名乗るため重みは公開しないとしている。", "fun": "AIに架空の人物の人生を覚えさせると、「あなたは誰？」に9割以上その人物として答える。そこで頭の中の小さな部分を元に戻すと、人物の記憶はほぼ消えた。ところが元の「私はAIアシスタントです」という自己紹介は戻らず、名もない「誰か」として話し始めた。役を降りても素の自分に戻れない、という結果が面白い。", "unverified": "結果の節の図1・図2の層ごとの変化の数値は読み切れていない。"}}, {"id": "pr15", "rank": 15, "headline": "孤独を日常の即時評価と端末のセンシングで測る", "title": "Assessing Loneliness in Daily Life by Combining Ecological Momentary Assessment and Passive Sensing: Scoping Review (Preprint)", "url": "https://doi.org/10.2196/preprints.116856", "authors": "Hyeonjin Cho ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Cho, H., Lee, M., Joo, J., Won, S., Han, J., Kim, D., Warrier, G., Thrul, J., & Cho, J. (2026). Assessing Loneliness in Daily Life by Combining Ecological Momentary Assessment and Passive Sensing: Scoping Review (Preprint). https://doi.org/10.2196/preprints.116856", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は取得できず未読", "preprint": true, "p1": "孤独と関連する社会的な構成概念を、経験サンプリング（EMA、日常の中でその場の状態を繰り返し尋ねる方法）とスマートフォン・ウェアラブルの受動的センシングを組み合わせて測った研究を体系的に洗い出し、測り方と行動・生理の指標との関連を整理した（抄録）。未査読。", "p2": "孤独は日々の社会的な文脈で揺れ動くのに、ふだんは過去を振り返る質問紙で測られている。EMAと受動的センシングを組み合わせれば日常の中で捉えられるが、どう統合されてきたかは整理されていなかった（抄録）。", "p3": "PRISMA-ScRに従い、PubMed・Embase・CINAHL・Web of Science・PsycINFOを2025年1月13日まで検索し、EMAで孤独関連の概念を測り、受動的センシングで身体活動・睡眠・心拍・電話の利用などを捉えた研究を、年齢や健康状態を問わず含めた。標準化した様式でEMAの抽出方式、機器、両データの時刻の合わせ方、報告された関連を抽出した（抄録）。", "p4": "評価は記述的な整理で、効果の統合（メタ分析）は行っていない（抄録）。", "p5": "157件（重複除去後86件）から12研究が該当した。EMAはすべて時刻に基づく抽出で、期間は3日〜8週間だった。センシングは主にウェアラブル（7研究）かスマートフォン（3研究）で、両方を使ったのは2研究だった。身体活動が多く座りがちな行動が少ないほど、その時の孤独が低いか社会的支援が多かった。場所の指標は混在し、訪れた場所の数が多いほど孤独が低い一方、日課が規則的なほど一人の時間が長かった。通話は孤独との関連を示したが、テキストメッセージは示さなかった（抄録）。", "p6": "対象研究は12本と少なく、測定の方式もばらばらで、結論は探索的と考えられる（解釈）。抄録は途中で切れており、著者の挙げる限界は確認できない。", "fun": "「寂しい」という気持ちは一日の中でも上がったり下がったりする。この研究は、スマホやスマートウォッチが勝手に記録する歩数や行き先、通話の記録と、その場で尋ねた寂しさを組み合わせた研究を集めた。よく体を動かす人ほど寂しさが低く、メールより電話が寂しさと関係していた。何気ない行動の記録から心の状態が見えてくる点が面白い。", "unverified": "本文を読めておらず、各研究の対象者の特徴と関連の大きさ、著者の結論と限界の記述は未確認。抄録の末尾は欠けている。"}}, {"id": "pr16", "rank": 16, "headline": "同定可能性の証明をLean 4で機械的に検証", "title": "From Pen-and-Paper to Machine-Checked Proofs: Lean for System Identification", "url": "https://arxiv.org/abs/2611.18220", "authors": "Manas Mejari ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Mejari, M., Piga, D., & Forgione, M. (2026). From Pen-and-Paper to Machine-Checked Proofs: Lean for System Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18220", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "システム同定と制御の研究者向けに、証明支援系Lean 4で定理と証明をコードとして書き、すべての推論を小さな信頼できるカーネルに検査させる方法を紹介した（抄録）。", "p3": "同定可能性と集合の不変性の2つの初歩的な例でLeanの証明の読み方を示し、予測誤差法の雑音フィルタの逆に関する古典的な補題（Ljung, 1999の補題3.1）を形式化して分析した（抄録）。", "p5": "形式化により、この補題の主張はすべての実現値ではなく、ほとんど確実に（確率1で）成り立つという微妙な点が明らかになり、簡単な反例で具体的に示した（抄録）。", "fun": "教科書に載っている有名な定理でも、証明の一歩一歩をコンピュータに確かめさせると思わぬすき間が見つかることがある。この論文では、雑音の処理に関する定番の補題が「どんな場合でも」ではなく「確率1で」しか成り立たないことが分かった。数学の証明をプログラムのように検査する道具が、工学の理論の見直しにも役立つという点が面白い。", "unverified": "形式化した証明の分量や、扱った補題以外の結果は抄録から確認できない。反例の具体的な形は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "GNSSの1PPSで時刻をそろえた低価格センサ網", "title": "Decentralized Low-Frequency Acoustic and Infrasound Sensor Mesh Architecture with Hardware 1-PPS GNSS Synchronization and 3D TDoA-EKF Fusion for Environmental Hazard Monitoring", "url": "https://doi.org/10.5281/zenodo.24253649", "authors": "Banakh, Andriy Stepanovych", "venue": "Zenodo", "date": "2026-11-15", "apa": "Banakh, A. S. (2026). Decentralized Low-Frequency Acoustic and Infrasound Sensor Mesh Architecture with Hardware 1-PPS GNSS Synchronization and 3D TDoA-EKF Fusion for Environmental Hazard Monitoring (Version 2.0). Zenodo. https://doi.org/10.5281/ZENODO.24253649", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（DataCiteから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ESP32のマイコンと24ビットADC、GNSSの1PPS（毎秒1回の時刻パルス）のハードウェア割り込みでノード間の時刻をそろえた、低周波音と超低周波音の分散型センサ網TREMBITA-Meshの設計を示した（抄録）。未査読の原稿。", "p3": "各ノードはADS1256（1000 SPS）で計測し、1PPSの割り込み（エッジのゆらぎ20 ns未満）でNMEAとPPSの1秒のずれをなくす。サーバでは3次元の到達時間差（TDoA）の多点測位と6状態の拡張カルマンフィルタ（EKF）で音源を追跡する（抄録）。", "p5": "6ノードの網の模擬で、EKFにより3次元の追跡のRMSEが32.6%減り（12.22 mから8.24 m）、時刻の誤差σ=2.0 msのとき3次元誤差の中央値は5.45 mだった（抄録）。", "fun": "雷の光と音の時間差で距離が分かるように、何台ものマイクに音が届く時間のずれから音の出どころを計算できる。そのためには各マイクの時計がそろっていなければならない。この研究は、GPS衛星が送る1秒ごとの合図で安いマイコンの時計を合わせ、数メートル単位の精度で音源を追う。時刻合わせが位置の精度を決めるという点が面白い。", "unverified": "実地での検証の有無と規模、模擬の条件の詳細は抄録から確認できない。査読を経ていない。"}}, {"id": "pr18", "rank": 18, "headline": "小型LLMの判定の集約で群衆の決定は定まるか", "title": "Small Open-Weight Language Models for Crowd Decision-Making: Capabilities and Limits of Output-Level Fusion and Linguistic Aggregation", "url": "https://arxiv.org/abs/2611.17589", "authors": "David Herrera-Poyatos ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Herrera-Poyatos, D., Zuheros, C., Peláez-González, C., Herrera-Poyatos, A., Montes, R., & Herrera, F. (2026). Small Open-Weight Language Models for Crowd Decision-Making: Capabilities and Limits of Output-Level Fusion and Linguistic Aggregation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17589", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公開重みの小型LLMで口コミを繰り返し判定して集約する群衆の意思決定は、1つの勝者を決めるより、余裕つきの候補の集合として示すべきだと示した（抄録）。", "p3": "8〜36Bの公開重みモデル5つと参照モデルで、ロンドンの4店のTripAdvisorの口コミ474件を各10回分類し（マドリードの12店・600件でも追試）、判定の集約・融合と、評価者の引き直しへの感度を調べた（抄録）。", "p5": "評価者を引き直すと勝者が保たれるのは複製の47〜81%で、実行を引き直した場合の86〜100%より低く、同時区間ではどのシステムも単一の勝者を決められなかった（ロンドンは4店すべてが候補に残った）。大きめの3モデルは参照モデルと同じ勝者を挙げた（抄録）。", "fun": "AIに口コミを読ませて「一番の店」を決めさせると、同じ質問でも答えが毎回少し揺れる。何度も聞いてまとめればその揺れは小さくなるが、口コミを書いた人の顔ぶれが変わると一番が入れ替わってしまう。AIを何度使っても、元のデータが持つ不確かさは消せないことを示した点が面白い。", "unverified": "使ったモデル名、2-tupleの言語的表現による集約の具体的な手順、区間の作り方の詳細は抄録から確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "配偶者も子もない高齢者の幸福感をネットワーク分析", "title": "Vulnerable nodes and candidate intervention targets in subjective well-being among older adults without a spouse or living children: A Computer-Simulated Network Analysis Objective: To characterize the network structure of subjective well-being among older adults without a spouse or living children. We sought to identify central and bridge nodes, potential intervention and prevention targets, and differences in candidate targets by parental history to inform psychological care. Methods: Using stratified sampling, we surveyed 384 older adults without a spouse or living children in Changsha between November 2025 and February 2026. Participants completed the Memorial University of Newfoundland Scale of Happiness. The sample included 283 life (Preprint)", "url": "https://doi.org/10.2196/preprints.116770", "authors": "Chunyan Li ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Li, C., Ren, Y., Li, Y., Chen, Q., Xie, Y., Xiao, J., & Wang, J. (2026). Vulnerable nodes and candidate intervention targets in subjective well-being among older adults without a spouse or living children: A Computer-Simulated Network Analysis Objective: To characterize the network structure of subjective well-being among older adults without a spouse or living children. We sought to identify central and bridge nodes, potential intervention and prevention targets, and differences in candidate targets by parental history to inform psychological care. Methods: Using stratified sampling, we surveyed 384 older adults without a spouse or living children in Changsha between November 2025 and February 2026. Participants completed the Memorial University of Newfoundland Scale of Happiness. The sample included 283 life (Preprint). https://doi.org/10.2196/preprints.116770", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "配偶者も存命の子もいない高齢者の主観的幸福感の項目間のネットワークを推定し、仮想的な摂動のシミュレーションで介入・予防の候補となる項目を特定した（抄録）。未査読。", "p3": "長沙市で層化抽出した384人（生涯子なし283人、子を亡くした101人）の幸福尺度の24項目を2値化してIsingネットワークを推定し、強度中心性と橋渡しの強さを求め、項目の閾値を動かす摂動で介入の効果を模擬した（抄録）。", "p5": "全体ではPE1の強度中心性が最大（7.092）、PE4の橋渡しの強さが最大（3.243）だったが、PE4は大きな純便益を生まなかった。介入の第一候補はPA1・PE5・PA3で、有害な合成アウトカムの模擬上の減少は8.24%・10.58%・6.26%だった（抄録）。", "fun": "幸福感のアンケートの答え同士がどうつながっているかを網の目として描き、どの項目を良くすると全体が一番良くなるかをコンピュータ上で試している。網の中で一番つながりの多い項目を動かすのが一番効く、とは限らなかった。目立つ位置にあることと、変えたときの効果は別だと数字で示した点が面白い。", "unverified": "各項目（PE1・PA1など）の内容、群間比較の検定の詳細は抄録から確認できない。著者は縦断研究と実際の介入での検証が必要としている。"}}, {"id": "pr20", "rank": 20, "headline": "洪水の被害は生活の損失で見ると不平等が大きい", "title": "Socio-economic flood resilience reveals welfare-vulnerable communities obscured by asset-based appraisals", "url": "https://doi.org/10.21203/rs.3.rs-11539385/v1", "authors": "Jie Liu ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Liu, J., Liu, J., Wang, T., Li, Z., Xu, Z., Cats, O., Cremen, G., Wang, J., He, M., Chen, A., Galaitisi, S., Linkov, I., & Debnath, R. (2026). Socio-economic flood resilience reveals welfare-vulnerable communities obscured by asset-based appraisals. https://doi.org/10.21203/rs.3.rs-11539385/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "洪水リスクを資産の損失だけでなく金銭換算したwell-beingの損失でも評価すると、資産ベースの評価では見えない、福祉面で脆弱な地域が浮かび上がることを示した（抄録）。未査読。", "p3": "2 m解像度の浸水ハザード図、社会経済データ、動的な復旧モデルを統合し、社会経済的な洪水レジリエンス（SEFR＝資産の損失÷金銭換算したwell-beingの損失）を、イングランドの6,791地区で現在と将来（RCP8.5）の複数の洪水源・再現期間について求めた（抄録）。", "p5": "貧しい地区ほどSEFRが低く、低SEFRの地区は空間的に集まっていた。資産損失の上位5%・10%の地区の7.8〜23.8%は、同じ規模のwell-being損失の上位に入らなかった（抄録）。", "fun": "同じ100万円の被害でも、蓄えの多い家と少ない家では生活への打撃がまったく違う。この研究は、壊れた物の値段ではなく暮らしがどれだけ苦しくなったかをお金に換算して洪水の被害を測り直した。物の値段だけで対策の優先順位を決めると、本当に困る地域を見落とすことを数字で示した点が面白い。", "unverified": "well-beingの損失の金銭換算の方法と復旧モデルの詳細は抄録から確認できない。"}}, {"id": "pr21", "rank": 21, "headline": "支援ロボットのLLMに持たせたい価値観を測る", "title": "Personalization of Basic and Moral Values Guiding LLM-Controlled Assistant Robots", "url": "https://arxiv.org/abs/2611.18230", "authors": "Mateusz Wozniak ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Wozniak, M., Gao, Q., & Wykowska, A. (2026). Personalization of Basic and Moral Values Guiding LLM-Controlled Assistant Robots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18230", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMで動く支援ロボットに利用者が望む価値観は本人の価値観と異なり、LLMに指示するだけではその望みに近づかないことを示した（抄録）。", "p3": "簡易版シュワルツ価値観調査（SVS）、PVQ-21、道徳基盤質問紙（MFQ）を、自分用とロボット用の両方の形で将来の利用者22人に実施し、尺度の使いやすさをUEQ-Sで比べ、15のLLMをその価値観のプロファイルと比べた（抄録）。", "p5": "参加者はロボットに、個人に焦点を当てた価値は自分より低く、社会に焦点を当てた価値は高くあってほしいと答え、道徳のプロファイルはほぼ同じだった。ロボットとして振る舞うよう指示したLLMは望まれた方向へ弱くしか動かなかった（抄録）。", "fun": "自分の家に来るロボットには、自分と同じ性格より「もっと周りを思いやる」性格でいてほしい、と人は考えるらしい。ところがAIに「ロボットとして振る舞って」と頼んでも、その望みにはなかなか近づかない。人がロボットに求める人柄とAIが自然に示す人柄のずれを、心理テストで数字にした点が面白い。", "unverified": "参加者は22人と少ない。どのLLMがどの程度ずれたかの数値は抄録から確認できない。"}}, {"id": "pr22", "rank": 22, "headline": "ペルソナベクトルによる予防的な誘導の副作用", "title": "Safety Side Effects of Preventative Persona Steering: An Empirical Audit", "url": "https://arxiv.org/abs/2611.17620", "authors": "Sabrina Tang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Tang, S., Vo, N., Murillo, C., Sukumarnpiti, C., & Wilson, S. (2026). Safety Side Effects of Preventative Persona Steering: An Empirical Audit (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17620", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "おべっかや幻覚を抑えるペルソナベクトルの予防的な誘導は、知識の正確さを保っても、拒否などの安全面の振る舞いを変えることを示した（抄録）。", "p3": "おべっか（sycophancy）と幻覚に対応する活性化空間の方向を微調整中に加え評価時に外す予防的な誘導を3つのモデルに適用し、3つの安全性ベンチマーク、特性の表出、一貫性、MMLUを測った（抄録）。", "p5": "予防的な誘導は拒否の振る舞いを変え、その大きさは特性によって異なり、安全面で中立とは言えなかった。著者は誘導の方法を複数の安全性ベンチマークで評価すべきだと結論する（抄録）。", "fun": "AIの「ごますり」を減らす処置をしたら、知識のテストの点は下がらなかった。それで安心と思いきや、危ない頼みを断る態度まで変わっていた、という副作用の話である。一つの性格を直すと別の性格まで動いてしまう点に、AIの性格を調整する難しさがよく表れていて面白い。", "unverified": "使ったモデル名、拒否率の変化の大きさと方向は抄録から確認できない。"}}, {"id": "pr23", "rank": 23, "headline": "LLM検証者の判定は記録の抽象化で保たれるか", "title": "Do Verifier Judgments Survive Abstraction? Measuring Verification Transport for LLM Agent Evaluation", "url": "https://arxiv.org/abs/2611.18471", "authors": "Disha Sheshanarayana ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sheshanarayana, D., & Goli, S. L. R. (2026). Do Verifier Judgments Survive Abstraction? Measuring Verification Transport for LLM Agent Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18471", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMによる検証者の判定が、同じエージェントの実行を抽象化した表現で見せると約31%まで崩れることを示し、その安定性を測る試験（Verification Transport）を提案した（抄録）。", "p3": "課題・軌跡・結果・正解・評価基準・検証者を固定したまま、同じ実行のそのままの表示、抽象化した表示、来歴を戻した表示を作り、4つのベンチマーク、7つの検証者のモデル、4つの検証の手順、3種類の抽象化の境界で比べた（抄録）。", "p5": "マクロな抽象化と委任で判定の破綻は約31%に達し、直接の検証は誤った判定を、証拠に基づく手順や熟議的な手順は判定の保留を出しやすかった。来歴を戻すと破綻の85.5%が回復した（抄録）。", "fun": "同じ料理でも、作る過程を全部見た審査員と、完成品の写真だけ見た審査員では評価が変わるかもしれない。AIがAIの仕事を採点するときも同じで、作業の記録が要約されると判定が3割近く崩れることがあった。慎重な審査員ほど「分からない」と答えがちで、間違いが少ないことが信頼の証拠とは限らない点が面白い。", "unverified": "使ったベンチマークと検証者のモデル名、抽象化の境界ごとの数値は抄録から確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "241のLLMはAIの存亡リスクを中央値10%と回答", "title": "Large language models put existential risk from artificial intelligence at 10%", "url": "https://arxiv.org/abs/2611.18219", "authors": "Julian Kauk", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Kauk, J. (2026). Large language models put existential risk from artificial intelligence at 10% (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18219", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "241のLLMに高度なAIが人類の絶滅や恒久的な無力化を招く確率を尋ね、AI自身が自らの技術のリスクをどう述べるかを記録した（抄録）。", "p3": "241のLLMに、利用できるすべての推論設定で同じ問いを投げ、回答の分布を価格・新しさ・推論量と比べ、最も可能性の高い原因も尋ねた（抄録）。", "p5": "中央値は10.0%で、中央90%は3.5〜15.8%と人間の専門家の幅よりずっと狭かった。高価なモデルほど高いリスクを述べ、推論を増やしても推定はほぼ変わらず不確かさが主に高い側へ広がった。ほぼすべてが制御の喪失を最大の原因に挙げた（抄録）。", "fun": "人間の専門家に「AIが人類を滅ぼす確率は？」と聞くと答えは大きくばらつく。ところが241ものAIに同じことを聞くと、多くが10%前後に集まった。ただし著者は、これはAIが自分で考えた答えというより、学習した文章や調整の影響を映した答えだと注意している。AIの「意見」をどう読むべきかを考えさせる点が面白い。", "unverified": "質問文の具体的な形と、モデルごとの回答の詳細は抄録から確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "患者役のLLMがいつ質問すべきかを理論で設計", "title": "When Should a Virtual Patient Ask? RISP-Guided Proactive Information Seeking in Multi-Agent Patient Simulation", "url": "https://arxiv.org/abs/2611.18183", "authors": "Jingyao Cai ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Cai, J., Liu, S., Rehman, A., Li, X., Qintian, Dolby, T., Green, S. M., & Yang, X. (2026). When Should a Virtual Patient Ask? RISP-Guided Proactive Information Seeking in Multi-Agent Patient Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18183", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "看護のコミュニケーション訓練用の仮想患者を、患者がいつ何を質問するかを心理学のモデルで決める複数エージェントのシステム（RISP-MAS）として作った（抄録）。", "p3": "情報探索を知覚したリスクと、知っていることと知りたいことの差に結びつけるRISPモデル（リスク情報探索・処理モデル）に基づき、患者の知覚と情報ニーズの評価を、質問するか・いつ・どの不確かさについて聞くかの判断につないだ（抄録）。", "p5": "看護学生と仮想患者の対話の評価で、専門家はもっともらしい情報探索の振る舞いと判断し、学生の感想も肯定的だった（抄録）。", "fun": "病院で不安な患者さんは、説明を聞くうちに「それって大丈夫なの？」と自分から質問する。これまでのAIの模擬患者は聞かれたことに答えるのが中心だった。この研究は、不安の大きさと知りたいことの差から、患者役のAIが自分で質問を切り出す時機を決める。人の気持ちの理論をAIの振る舞いの設計図に使う点が面白い。", "unverified": "評価の参加者数、専門家評価の尺度と数値は抄録から確認できない。"}}, {"id": "pr26", "rank": 26, "headline": "LLMによる審査を道具を使うエージェントへ拡張", "title": "Agent-as-a-Judge", "url": "https://arxiv.org/abs/2611.18067", "authors": "Runyang You ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "You, R., Cai, H., Zhang, C., Xu, Q., Liu, M., Yu, T., Li, Y., & Li, W. (2026). Agent-as-a-Judge (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18067", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "与えられた資料だけで採点するLLM-as-a-Judgeに対し、足りない証拠を自ら集めてから判定する能動的な評価者（Agent-as-a-Judge）の研究を整理した総説（抄録）。", "p3": "評価のための検査とその結果の使い方で範囲を定め、複数エージェントの協働、道具の利用、記憶、計画の4つの観点で設計の空間を整理し、主要なエージェント型の審査の公表スコアをまとめ、欠けている項目を再現した（抄録）。", "p5": "比較では、エージェント型にすることによる利得が評価対象によって不均一で、専用の評価が必要だと示した。費用・信頼性・安全・統治の課題を挙げた（抄録）。", "fun": "テストの採点係が答案だけを見て点をつけるのではなく、必要なら実験をやり直したり資料を調べたりしてから判定する、という発想である。AIの答えを別のAIが審査する時代に、審査役のAIにも「調べる力」を持たせようとしている。審査が賢くなるほど費用と信頼性の問題も増えるという緊張関係が面白い。", "unverified": "再現したスコアの具体的な数値と対象の審査システムは抄録から確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "高齢者ケアの音声エージェントの個別化と忠実度", "title": "Voice-Based Conversational Agents as AI Care Assistants: Evaluating Personalization, Intervention Delivery Fidelity, and Privacy Expectations in Older Adults' Care", "url": "https://arxiv.org/abs/2611.18385", "authors": "Thalia Viranda ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Viranda, T., Wang, S., Bo, J., Yang, Y., Zhang, H., Cuadra, A., Adler, D. A., Boot, W., Czaja, S., Estrin, D., & Choudhury, T. (2026). Voice-Based Conversational Agents as AI Care Assistants: Evaluating Personalization, Intervention Delivery Fidelity, and Privacy Expectations in Older Adults' Care (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18385", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "高齢者向けの多領域の生活習慣介入を音声の会話エージェントARCで届けられることを示し、個別化と介入の忠実度、データ共有への期待を評価した（抄録）。", "p3": "目標、参加者の文脈、根拠に基づく要素を定めたセッションでARCを動かし、高齢者80人の3日間の遠隔研究で6種類のセッション473回（9,183ターン、平均19.4ターン・6分）を分析した（抄録）。", "p5": "使いやすさと受容性は良好だった。領域単位の文脈の再利用は強いが個人の文脈の再利用は控えめで、個別化と忠実度の関連は有意でなく、忠実度の問題は手順からの逸脱より介入要素の伝え漏れだった。データ共有への期待はデータの種類と相手で異なった（抄録）。", "fun": "AIの話し相手が健康のアドバイスをするとき、相手に合わせて話を変えすぎると、本来伝えるべき内容が抜け落ちるかもしれない。この研究は、80人の高齢者との会話記録から、AIが話をそらすことより、伝えるべき要素を言い忘れることの方が問題だと見つけた。満足度だけでは分からない「ちゃんと届いたか」を測った点が面白い。", "unverified": "介入の内容（運動・食事など）の内訳と、忠実度の測り方の詳細は抄録から確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "日本の金融資格試験からLLMの金融知識を評価", "title": "JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams", "url": "https://arxiv.org/abs/2611.18130", "authors": "Issa Sugiura ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sugiura, I., Makino, T., & Ishida, T. (2026). JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "会計・税務・FP・銀行業務の6つの日本の資格試験（2026年版）から321問の金融ベンチマークJFinBenchを作り、毎年更新できる構築手順とともに公開した（抄録）。", "p3": "コーディングエージェントが試験ごとの変換コードと確認ページを書き、人がすべての問題を確かめて修正を戻す、人が介在する構築パイプラインで形式の違う試験を取り込み、12のLLMを評価した（抄録）。", "p5": "Claude Fable 5とGPT-6 Astraは全体で93%を超え、最良の公開重みモデルKimi K3.1 ProはClaude Fable 5に12ポイント及ばなかった。端末とWebを使えるとすべてのモデルが向上したが差は約4ポイント残り、順位はほぼ変わらなかった（抄録）。", "fun": "AIの試験は、問題がネットに出回るとAIが答えを覚えてしまい実力が測れなくなる。この {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "渦度の持続図（位相的データ解析）で有用な渦だけを残す目標の流れを定め、制御つき動的モード分解（DMDc）の縮約モデルとモデル予測制御で、翼まわりの流れの抵抗を下げた（抄録）。", "p3": "渦度の絶対値の持続図で渦を検出・特徴づけ、目標の流れを縮約空間で勾配降下により事前に計算し、制御の各段を小さな凸二次計画に帰着させた（抄録）。", "p5": "振動する航空機の翼まわりの流れに7つの振動数で適用し、主要な渦を保ったまま抗力係数の平均を下げた（抄録）。", "fun": "水の中で手を振ると渦ができるが、渦には役に立つものと邪魔なものがある。この研究は、渦の「形の特徴」を数学の位相幾何学の道具で数え上げ、残したい渦だけを残すように流れを操る。目に見える渦の形を数学で分類し、それを制御の目標にしている点が面白い。", "unverified": "抗力の低減率の数値と、計算の条件（レイノルズ数など）は抄録から確認できない。"}}, {"id": "pr31", "rank": 31, "headline": "小領域で学んだ非線形縮約を大領域へ組み上げる", "title": "Compatible by Construction: Bottom-Up Nonlinear Model Reduction without Interface Bases", "url": "https://arxiv.org/abs/2611.17773", "authors": "Youngkyu Kim ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Kim, Y., & Choi, Y. (2026). Compatible by Construction: Bottom-Up Nonlinear Model Reduction without Interface Bases (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17773", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "小さな訓練領域で学んだ局所の非線形な表現を再利用し、再学習なしで大きな領域のPDEを解く、界面の基底を使わない縮約法を示した（抄録）。", "p3": "共有の非線形デコーダが各部分領域の自由度全体を表し、各大域の自由度は一つの所有者だけを持つので状態は一意に決まり、界面の写しや適合条件が要らない。デコーダを固定し、元の時間離散のPDEの残差を最小にするように部分領域ごとの縮約座標をGauss–Newton法で同時に決める（抄録）。", "p5": "パラメータ化した粘性Burgers方程式と非圧縮Navier–Stokes方程式で、より大きな領域に再学習なしで再利用でき、同じ結合の局所POD（固有直交分解）と比べ、試した範囲で精度と効率のよい釣り合いを示した（抄録）。", "fun": "大きな建物の揺れを計算するのに、小さな部屋の揺れ方だけを学んで、それを並べて全体を組み立てられたら楽である。この研究は、部屋と部屋の境目で食い違いが出ないように、境目の値をどちらか一方の部屋だけが持つ決まりにした。部品を学んで全体を組む発想と、境目の扱いの工夫が面白い。", "unverified": "精度・計算時間の具体的な数値は抄録から確認できない。"}}, {"id": "pr32", "rank": 32, "headline": "メッシュなしの深層エネルギー法で熱き裂を予測", "title": "A mesh-free deep energy method for phase-field modeling of thermally driven brittle fracture", "url": "https://arxiv.org/abs/2611.17630", "authors": "Han Zhang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Zhang, H., Alamdari, M. M., Shahbodagh, B., Vahab, M., Anitescu, C., Rabczuk, T., & Atroshchenko, E. (2026). A mesh-free deep energy method for phase-field modeling of thermally driven brittle fracture (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17630", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "き裂の位置や経路を事前に与えずに、熱による脆性き裂の自然な発生、間隔、進展と停止を予測するメッシュなしの深層エネルギー法を示した（抄録）。", "p3": "変位・フェーズフィールドと過渡的な温度を、それぞれ多重解像度の符号化を持つ2つのネットワークで表し、力学のエネルギーと後退オイラーの熱方程式の汎関数を毎回引き直す積分点で評価する。不可逆性をき裂の集合に限るなどで偽の損傷の蓄積を防いだ（抄録）。", "p5": "切欠きのある2つの板で発生のピーク荷重が独立の有限要素の参照とよく一致し、急冷したガラス帯ではき裂の経路が直線から振動、分岐へと変わり、振動の閾値は線形安定性の予測に近かった。急冷したセラミック板では実験で見られる型のき裂の列ができた（抄録）。", "fun": "熱いガラスのコップに冷たい水を注ぐと割れることがある。この研究は、割れ目がどこにできるかを前もって教えなくても、AIを使った計算で割れ目が自然に生まれ、まっすぐ進んだり、くねったり、枝分かれしたりする様子を再現した。割れ方の変化が理論の予測とも合う点が面白い。", "unverified": "計算時間や有限要素法との差（き裂の密度の違いの程度）の数値は抄録から確認できない。"}}, {"id": "pr33", "rank": 33, "headline": "B-スプラインMPMで骨材入りコンクリートの熱と衝撃", "title": "Thermomechanical modelling of concrete with aggregate inclusions using total Lagrangian B-spline material point method", "url": "https://doi.org/10.21203/rs.3.rs-11616577/v1", "authors": "Haitao Ding ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Ding, H., Sun, Z., Xiao, W., & Zhou, X. (2026). Thermomechanical modelling of concrete with aggregate inclusions using total Lagrangian B-spline material point method. https://doi.org/10.21203/rs.3.rs-11616577/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "参照配置で補間を固定する全ラグランジュ型のB-スプライン物質点法（TLBSMPM）を作り、骨材を含むコンクリートの熱と力学の連成（熱伝導・応力波・損傷）を相ごとに解けることを示した（抄録）。未査読。", "p3": "弾性波と曲げのベンチマーク、熱伝導の試験、熱衝撃を受ける片持ち梁、均質と3相のコンクリート円板の衝撃解析で検証した（抄録）。", "p5": "波と熱伝導の誤差は格子の細分で減り、片持ち梁の振動数は梁理論と0.75%以内で一致した。曲げでは更新ラグランジュ型より応力の振動と計算時間が減り、3相の円板では損傷が界面とその周りに集中した（抄録）。", "fun": "コンクリートは、砂利（骨材）とそれを固めるモルタルと、その境目の薄い層からできている。この研究は、熱や衝撃を受けたとき、どこから壊れていくかを粒子を使った計算で調べ、境目の層に損傷が集中することを再現した。材料の中の「つなぎ目」が弱点になるという、身近な構造物にも通じる話が面白い。", "unverified": "衝撃の条件と損傷の量の数値は抄録から確認できない。"}}, {"id": "pr34", "rank": 34, "headline": "粘着性粒子の付着力と剥離エネルギーを測る方法", "title": "A Cantilever-Based Method for Probing Adhesion Force and Kinetic Detachment Energy in Cohesive Granular Materials", "url": "https://arxiv.org/abs/2611.18021", "authors": "Maxime Lajeunesse ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Lajeunesse, M., Rocha, F. M., Dumont, D., Bertin, V., Moratille, Y., Sintes-Zydowicz, N., Drockenmuller, E., & Pouliquen, O. (2026). A Cantilever-Based Method for Probing Adhesion Force and Kinetic Detachment Energy in Cohesive Granular Materials (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18021", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "粘着性のある粒状体で、粒子をはがす準静的な力と、動的にはがすのに要するエネルギーを一つの装置で測る片持ち梁の方法を示し、力とエネルギーが一致しない（分離している）ことを見いだした（抄録）。", "p3": "ガラスの梁の片持ち梁で力を測り、新しいカタパルト方式（はじき出し）でエネルギーを測る。ポリマー被覆のシリカ粒子、湿った粒状体、架橋したPEHAの微粒子の3種類に適用した（抄録）。", "p5": "力とエネルギーが根本的に分離しており、粒子の性質を表すには両方が同じように重要だと示した（抄録）。", "fun": "粉や濡れた砂がくっつき合う強さは、「引きはがす力」で測るのが普通である。この研究は、ゆっくり引きはがす力と、はじき飛ばしてはがすのに必要なエネルギーを別々に測り、その二つが一致しないことを見つけた。くっつきやすさを一つの数字で表せないという発見が面白い。", "unverified": "材料ごとの力とエネルギーの数値は抄録から確認できない。"}}, {"id": "pr35", "rank": 35, "headline": "氷河湖決壊洪水の側岸侵食を2つの様式で解析", "title": "Controls of shear scour and bend impact of glacial lake outburst floods: insights from the 2023 South Lhonak event", "url": "https://doi.org/10.5194/egusphere-2026-6278", "authors": "Pu Li ほか", "venue": "EGUsphere", "date": "2026-11-16", "apa": "Li, P., Hu, K., Wei, L., & Li, H. (2026). Controls of shear scour and bend impact of glacial lake outburst floods: insights from the 2023 South Lhonak event. https://doi.org/10.5194/egusphere-2026-6278", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの討議用原稿の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2023年10月3日のインド・シッキムの南ロナク湖の決壊洪水で、側岸の侵食をせん断による洗掘と湾曲部の衝撃の2様式に分け、どちらが支配するかを河道の形が決めることを示した（抄録）。討議中の未査読原稿。", "p3": "約68 kmの区間で、洪水の前後の標高モデル、高解像度の画像、HEC-RASの流れの計算を使い、斜め噴流の理論に基づく力学モデルで衝撃圧とせん断応力を比べた（抄録）。", "p5": "湾曲部の頂点の最大の後退速度の平均は4.28 cm/sで洗掘部の2.51 cm/sより大きく、有効な侵食深は52.7 m対15.2 m、侵食後の岸の勾配は61.8°対40.7°だった。湾曲部の衝撃圧は岸のせん断応力を約2桁上回った（抄録）。", "fun": "川が急に曲がるところでは、水が岸に正面からぶつかって深くえぐる。まっすぐなところでは、水が岸をこするように削る。氷河湖が決壊した大洪水では、この二つの削り方で岸の壊れ方がまったく違い、曲がり角の深さは50 m以上にもなった。川の形が災害の壊れ方を決めるという点が面白い。", "unverified": "侵食速度の推定方法の誤差と、HEC-RASの計算条件の詳細は抄録から確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "海氷モデルに輝度温度を直接同化して更新", "title": "Evaluation of direct assimilation of brightness temperature to update Arctic sea-ice model fields", "url": "https://doi.org/10.5194/egusphere-2026-6669", "authors": "Marina Durán Moro ほか", "venue": "EGUsphere", "date": "2026-11-16", "apa": "Durán Moro, M., Lavergne, T., Bertino, L., Palerme, C., Ying, Y., Xie, J., & Sørensen, A. M. (2026). Evaluation of direct assimilation of brightness temperature to update Arctic sea-ice model fields. https://doi.org/10.5194/egusphere-2026-6669", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの討議用原稿の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "衛星から推定した海氷密接度ではなく、AMSR2の輝度温度（レベル1）を北極の海洋・海氷結合モデルに直接同化すると、氷縁域の解析が改善する可能性を示した（抄録）。討議中の未査読原稿。", "p3": "輝度温度はモデルの変数でないため放射伝達モデルを組み込み、海氷域の実効放射率の4つのパラメータ化（固定値、アトラスの気候値、新しいDAL法、機械学習）を比べ、冬季にアンサンブルカルマンフィルタで5つの同化実験を行った（抄録）。", "p5": "DAL法は模擬した輝度温度と観測の平均絶対差が4 K未満で最良だった。氷縁域では、輝度温度の同化は密接度の同化に比べ、観測の密接度との平均絶対差を2〜9%減らした（抄録）。", "fun": "衛星は海氷そのものではなく、氷や海から出る弱い電波の強さ（輝度温度）を測っている。普通はそこから「氷が何割あるか」を計算してからモデルに入れるが、その換算で情報が抜け落ちる。この研究は、換算前の生の観測をそのまま計算に取り込んだ。加工しない方が良い場合があるという点が面白い。", "unverified": "予報の改善の持続時間と、氷の年齢の情報の扱いは抄録から確認できない。"}}, {"id": "pr37", "rank": 37, "headline": "汎用な水理ニューラル作用素で下水道ツインを高速化", "title": "Generalized hydraulic neural operators turbocharging sewer digital twins", "url": "https://arxiv.org/abs/2611.18081", "authors": "Ruozhou Lin ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Lin, R., Li, S., Shi, T., Hu, L., Zhang, Z., Tian, W., & Yuan, Z. (2026). Generalized hydraulic neural operators turbocharging sewer digital twins (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18081", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "サン・ブナン方程式の解で学習した微分可能な多分岐のニューラル作用素で、管内の水理を高速に予測し、未知の管路・ネットワーク・流況に再学習なしで使える下水道のデジタルツインの部品を作った（抄録）。", "p3": "サン・ブナン方程式の数値解を学習データにして、管内の水理を予測するニューラル作用素を学習し、オンラインの予測、データ同化、診断に使った（抄録）。", "p5": "複雑な水理の動きを高い忠実度で再現し、オンラインの予測で千倍から百万倍の高速化を達成し、未知の管路・ネットワーク・流況に再学習なしで汎化した（抄録）。", "fun": "大雨のとき下水管の中で水がどう流れるかを計算するのは時間がかかり、リアルタイムの判断には間に合わない。この研究は、物理の方程式の答えをAIに学ばせて、千倍以上速く同じ答えを出せるようにした。しかも初めて見る下水管でも学び直さずに使える点が面白い。", "unverified": "精度の具体的な指標と、試したネットワークの規模は抄録から確認できない。"}}, {"id": "pr38", "rank": 38, "headline": "SE(3)上の頑健なカルマンフィルタで航法を推定", "title": "Adaptive Robust Filtering Based on SE(3) and Its Application in SINS/DVL Navigation", "url": "https://doi.org/10.21203/rs.3.rs-11442439/v1", "authors": "Liu MingMing ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "MingMing, L., & Jinlai, L. (2026). Adaptive Robust Filtering Based on SE(3) and Its Application in SINS/DVL Navigation. https://doi.org/10.21203/rs.3.rs-11442439/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "慣性航法（SINS）とドップラー速度計（DVL）の統合航法で、状態をリー群SE(3)に埋め込んだ変換キュバチャカルマンフィルタに外れ値の検出と再構成を加えた頑健な適応フィルタ（SE(3)-RATCKF）を提案した（抄録）。未査読。", "p3": "従来のオイラー角の誤差モデルによる状態空間の不整合を解くため左右の誤差のTCKFを構成し、カイ二乗検定とHuber法で更新段階のイノベーションを実時間で検査して異常な計測を再構成した（抄録）。", "p5": "船上のSINS/DVLの実験で、従来法に比べ大きな初期の姿勢誤差のもとで航法の精度が上がり、外れ値を抑え、正常時の過補正も避けたと報告する（抄録）。", "fun": "船の位置を知るには、加速度と回転を測るセンサと、海底に当てた音で速さを測る装置を組み合わせる。ところが向きの表し方によっては、計算の中で姿勢と速さの関係がずれてしまう。この研究は、回転と移動を一体で扱う数学（リー群）を使ってこのずれを根本から防いだ。表し方を変えるだけで推定が安定する点が面白い。", "unverified": "精度の改善の数値と実験の条件は抄録から確認できない。"}}, {"id": "pr39", "rank": 39, "headline": "CNT混入セメントの自己検知性を連成FEで解析", "title": "Coupled Ionic–Electronic Finite Element Modeling of Piezoresistivity in Carbon Nanotube-Reinforced Cement Composites", "url": "https://doi.org/10.20944/preprints202611.1497.v1", "authors": "Yong-Sen Yang ほか", "venue": "Preprints.org", "date": "2026-11-16", "apa": "Yang, Y.-S., Wang, Y.-F., Zhang, J.-H., Zhao, Y., & Lin, Q.-L. (2026). Coupled Ionic–Electronic Finite Element Modeling of Piezoresistivity in Carbon Nanotube-Reinforced Cement Composites. https://doi.org/10.20944/preprints202611.1497.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "空隙率とCNT量が空間的に変わるセメント複合材のピエゾ抵抗（ひずみで電気抵抗が変わる性質）を、イオンと電子の伝導を連成した3次元の電気-力学有限要素モデルで説明できるようにした（抄録）。未査読。", "p3": "細孔溶液のイオン伝導とCNTの接触・トンネルの電子伝導を組み合わせ、両ネットワークの連結性をすき間の開閉を区別する主ひずみで変化させるモデルを作り、CNTを0.5%含むモルタルの3つの含水状態の繰返し一軸圧縮試験で較正した（抄録）。", "p5": "負のピエゾ抵抗の応答を再現し、乾燥で分極が減るほど一致がよくなった。空隙率を0.30から0.22に下げると最小の正規化電圧は0.949から0.841に下がり、三軸圧縮で最大の応答（0.82対一軸の0.94）となった（抄録）。", "fun": "コンクリートに炭素の細い管（カーボンナノチューブ）を混ぜると、押されたときに電気の通りやすさが変わり、建物自体がひずみのセンサになる。この研究は、その仕組みを水の中のイオンと管を伝わる電子の二つの電流に分けて計算で再現した。材料そのものをセンサにする発想と、その中身の解明が面白い。", "unverified": "実構造物での検証は行われていない。モデルのパラメータ数と較正の誤差は抄録から確認できない。"}}, {"id": "pr40", "rank": 40, "headline": "都市の水関連の自然基盤解決策の資金調達", "title": "Finance Options for Nature-based Water Solutions", "url": "https://doi.org/10.5281/zenodo.24276823", "authors": "Abdur Rashid ほか", "venue": "Zenodo", "date": "2026-11-16", "apa": "Abdur Rashid, & Annacarin Karlsson. (2026). Finance Options for Nature-based Water Solutions. Zenodo. https://doi.org/10.5281/ZENODO.24276823", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "都市の水関連の自然を基盤とした解決策（NbS）の補助・融資・保険の選択肢と、その利用を左右する財務・制度・規制・統治の条件を整理したプロジェクト報告書（NATURGOのD2.2）（抄録）。", "p3": "NbS、都市の水管理、金融、保険、統治に関する学術文献と灰色文献のスコーピングレビューに基づく（抄録）。", "p5": "社会的便益は大きいが直接の収益が小さいNbSでは公的資金が基本であり、運用・監視・維持の財源が不安定だと指摘し、ブレンデッド・ファイナンス、グリーンボンド、官民連携、生態系サービスへの支払い、雨水の料金、土地の価値の取り込み（value capture）、成果連動型の資金、保険などを補完策に挙げた（抄録）。", "fun": "公園の緑地や雨を吸い込む地面は、洪水を減らすなど街全体に役立つが、直接お金を生まないので維持費が後回しになりがちである。この報告書は、税金だけでなく、土地の値上がり分を回収する仕組みや保険など、さまざまな財布を組み合わせる方法を整理した。「みんなの得」をどう払うかという問いが面白い。", "unverified": "スコーピングレビューの対象文献の数と選定方法は抄録から確認できない。"}}, {"id": "pr41", "rank": 41, "headline": "de Jong Gierveldの孤独尺度のマニュアル改訂版", "title": "Manual of the Loneliness Scale", "url": "https://doi.org/10.5281/zenodo.24279035", "authors": "van Tilburg ほか", "venue": "Zenodo", "date": "2026-11-16", "apa": "van Tilburg, T., & De Jong Gierveld, J. (2026). Manual of the Loneliness Scale. Zenodo. https://doi.org/10.5281/ZENODO.24279035", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "Jenny de Jong Gierveldが開発した孤独尺度の使い方をまとめたマニュアルの改訂版で、1999年版を更新した（抄録）。", "p3": "オランダ語と英語の項目、他言語の検証済みの翻訳への参照、使用の条件、得点の計算方法、方法論と内容の考察、短縮版、カットオフ値を収録している（抄録）。", "p5": "新しい実証結果を報告するものではなく、尺度の利用者向けの資料である（抄録）。", "fun": "「寂しさ」は目に見えないので、決まった質問への答えを点数にして測る。同じ物差しを世界中で使えば国や時代の比較ができるが、そのためには質問文や採点の決まりをそろえる必要がある。この資料は、その共通の物差しの取扱説明書である。心の状態を測る道具にも説明書が要るという点が面白い。", "unverified": "改訂で変わった点（カットオフ値の変更の有無など）は抄録から確認できない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "高級車を選択肢に加えると最安の配車が売れる", "title": "Irregular Demand: The Anti-Compromise Effect in the Field", "url": "https://doi.org/10.3386/w36013", "authors": "Nicola Gennaioli ほか", "venue": "NBER Working Paper", "apa": "Gennaioli, N., List, J. A., Rodemeier, M., & Sun, G. K. (2026). Irregular Demand: The Anti-Compromise Effect in the Field (NBER Working Paper No. 36013). National Bureau of Economic Research. https://www.nber.org/papers/w36013", "why": "Lyftの720万人・4,700万回の選択で高級な配車の表示と価格を無作為化した自然フィールド実験で、選択肢を加えると既存の選択肢の需要は減るという規則性に反し、最も安い選択肢と買わない選択が増えた。効果は高級車の価格と繰り返しの表示で強まり、表示がない回にも残り、合理的推論や不注意では説明できないと報告する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は取得できず未読", "preprint": true, "p1": "選択肢を加えれば既存の選択肢の需要は減るという標準的な需要理論の「規則性」に反し、高級な配車を選択肢に加えると、最も安い既存の選択肢と「買わない」が増える反妥協効果（anti-compromise effect）が、大規模なフィールド実験で起きることを示した（抄録）。", "p2": "背景：新古典派の需要では、選択肢を1つ足すと、既存の選択肢の需要はそこから奪われるだけで増えることはない（規則性）。実験室では妥協効果などの例外が知られていたが、現実の大規模な市場での証拠は限られていた。本研究は配車サービスでこの規則性を検証した（抄録）。", "p3": "Lyftの720万人の利用者・4,700万回の選択を対象に、高級な配車の選択肢を表示するかどうかとその価格を無作為化する自然フィールド実験を行った（抄録）。", "p4": "比較は高級な配車を表示しない群との需要の差で、効果が価格と繰り返しの表示でどう変わるか、表示されない回にも残るかを調べた（抄録）。", "p5": "高級な配車を表示すると、最も安い既存の選択肢と買わない選択の需要が増えた。効果は高級な配車の価格が高いほど、繰り返し表示されるほど大きく、高級な配車が表示されない回にも持続した。合理的な推論（品揃えから品質を推し量る）や不注意ではこれらの事実を説明できないと報告する（抄録）。", "p6": "解釈：抄録からは、効果の大きさの数値、説明に用いる理論、利用者の属性による違いは分からない。1つの企業・サービスでの結果で、他の市場への一般化は本文で確かめる必要がある。", "fun": "お店のメニューに高い料理を一つ加えると、真ん中の値段の料理が売れるようになる、という話はよく聞く。ところがこの配車アプリの巨大な実験では、高い車を見せると、逆に一番安い車を選ぶ人と「やっぱり乗らない」人が増えた。しかも高い車を見せなかった日にまでその影響が残った。人の選び方が教科書どおりにいかないことを、数百万人の行動で示した点が面白い。", "unverified": "本文を読めておらず、効果の大きさ、実験の期間と地域、提案する説明の理論は未確認。"}}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "高次元の正規近似で1/√nに近い速さを達成", "title": "High-Dimensional Gaussian and Bootstrap Approximation: Near $1/\\sqrt{n}$ Rates with General Covariance", "url": "https://arxiv.org/abs/2611.17923", "authors": "Miles E. Lopes ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Lopes, M. E., & Masini, R. (2026). High-Dimensional Gaussian and Bootstrap Approximation: Near $1/\\sqrt{n}$ Rates with General Covariance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17923", "why": "p次元の独立同分布ベクトルの和について、長方形上のBerry–Esseen型の誤差が共分散に制約を置かなくてもlog(pn)の因子を除き1/√nの次数で抑えられるかという長年の未解決問題に、劣ガウスの条件のもとで肯定的に答えた。題名のとおり、ガウス近似とブートストラップ近似の両方を扱う。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（序論、主結果の定理2.1〜2.3、証明の構成の冒頭）を読んだ。証明の詳細（§4以降）は読んでいない", "preprint": true, "p1": "p次元の独立同分布の確率ベクトルの正規化した和が、すべての長方形の上でガウス分布にどれだけ近いか（Berry–Esseen型の誤差）について、共分散行列に何の制約も置かずに、対数の因子を除き1/√nの速さで近づくことを証明し、長年の未解決問題に肯定的に答えた（§1、定理2.1）。", "p2": "この誤差の評価はp≫nの高次元推論の基礎で、Chernozhukovらの2013年の結果はn^(−1/8)程度の速さだった（§1）。その後n^(−1/4)まで改善されたが、それより速い結果は相関行列の最小固有値の下限や対数凹の密度などの追加の構造を必要とし、一般の共分散ではn^(−1/6)やn^(−1/4)が最適だという予想さえあった（§1）。", "p3": "各成分の分散が1で劣ガウス（裾がガウス程度に軽い、尺度B）なら、誤差は C·B·log³(pn)·log(n)/√n 以下になる（定理2.1）。共分散が退化していてもよい。証明は補間に基づき、補間の微分を共分散の構造に左右されない形で抑える点が新しい（抄録、§3）。さらに共分散行列の間の特別な食い違いの尺度を定義し、ガウス同士の比較（定理2.2）とガウス乗数ブートストラップの近似（定理2.3）でも同様の速さを得た（§2）。", "p4": "理論論文であり、数値実験による評価はない。比較の基準は既往研究の速さ（n^(−1/8)、n^(−1/4)、構造仮定つきのn^(−1/2)など）である（§1）。", "p5": "ガウス近似で n^(−1/2) に対数の因子を掛けた速さを一般の共分散で達成し、ブートストラップ近似でも確率1−α以上で C·B·log(n)/√n ·(B√log(p/α)·log(p) + log³(pn)) の上界を与えた（定理2.3）。共分散が可逆から遠い場合にも成り立つ点が主な新しさである（§2.3）。", "p6": "成分の分散が0でないこと、劣ガウスの裾を仮定している（抄録）。解釈：対数の因子の次数（log³など）が最適かは本文の範囲では論じられておらず、裾の重い分布への拡張は残る。", "fun": "たくさんの小さなばらつきを足し合わせると、形が釣り鐘型（正規分布）に近づく、というのが中心極限定理である。測るものが何千、何万種類もあると、その近づき方の速さがどこまで保証できるかは長年の難問だった。この論文は、測るもの同士の関係がどんなに複雑でも、データの数の平方根に比例する速さで近づくことを証明した。統計の道具の「保証書」を一段強くした点が面白い。", "unverified": "証明の技術的な部分（ファセット感度、Gibbs測度による曲率の制御）は読んでおらず、確認していない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "介護の生産性低下が介護の価格上昇を生む", "title": "Aging and Structural Change: Cost Disease in the Care Sector", "url": "https://doi.org/10.3386/w36024", "authors": "Nick Pretnar ほか", "venue": "NBER Working Paper", "apa": "Pretnar, N., Kydland, F., & Kydland, T. Y. (2026). Aging and Structural Change: Cost Disease in the Care Sector (NBER Working Paper No. 36024). National Bureau of Economic Research. https://www.nber.org/papers/w36024", "why": "市場の生産性の伸びがサービスを家庭の外へ移してきたのに対し、公的な介護は生産性の伸びが負である例外だと示した。インフォーマルな介護を含む2部門の世代重複の一般均衡モデルで、介護の相対価格の上昇は人口構成ではなくこの低下で説明でき、価格が上がると高齢者は介護以外の消費へ代替し、インフォーマルな介護に負担が移ると論じる。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は取得できず未読", "preprint": true, "p1": "サービス業の多くでは市場の生産性の伸びが家庭内の生産を市場へ引き出してきたが、公的・市場の介護（フォーマルな介護）は生産性の伸びが負である例外で、それが介護の相対価格の上昇の原因だと示した（抄録）。", "p2": "高齢化に伴う介護の費用の上昇は人口構成の変化で説明されがちだが、価格の上昇が需要の増加によるのか生産性によるのかは区別されていなかった（抄録）。背景：生産性の伸びが遅い部門の相対価格が上がる現象はボーモルの「コスト病」と呼ばれる。", "p3": "インフォーマルな介護（家族などによる介護）を含む2部門の一般均衡の世代重複モデルを作り、フォーマルな介護の相対価格の上昇の要因を分解した（抄録）。", "p4": "抄録からは、データの国・期間とモデルの較正の方法は分からない。比較は人口構成の効果と生産性の効果の分解である（抄録）。", "p5": "フォーマルな介護の相対価格の上昇は人口構成ではなく生産性の低下に帰せられた。介護と介護以外の消費の補完性が、フォーマルとインフォーマルの介護の補完性より強く、フォーマルな介護の価格が上がると高齢者は介護以外の消費へ代替し、介護の負担がインフォーマルな介護者に移る（抄録）。介護以外の生産性が上がるか新しい世代が増え、介護の必要が減れば、高齢化は成長を遅らせるとは限らない（抄録）。", "p6": "解釈：介護の生産性をどう測るか（質の変化をどう扱うか）で結論が変わりうるが、抄録からは確認できない。日本のような介護保険の制度での当てはまりも本文で確かめる必要がある。", "fun": "洗濯や料理は機械や店のおかげで家の外に出ていき、安く便利になった。ところが介護は、人が人を世話する仕事なので効率を上げにくく、むしろ生産性が下がっていたという。介護が高くなると、お年寄りは介護を買うのを控えて他のものにお金を使い、そのしわ寄せが家族に行く。高齢化の問題を「人数」ではなく「生産性」から見直した点が面白い。", "unverified": "本文を読めておらず、使ったデータ、生産性の測り方、数値の結果は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "社会的企業の効果測定で売上と資金調達が倍増", "title": "Measuring the Impact of Impact Measurement", "url": "https://doi.org/10.3386/w36009", "authors": "Emanuele Colonnelli ほか", "venue": "NBER Working Paper", "apa": "Colonnelli, E., McQuade, T., Rigol, N., & Roth, B. N. (2026). Measuring the Impact of Impact Measurement (NBER Working Paper No. 36009). National Bureau of Economic Research. https://www.nber.org/papers/w36009", "why": "インドの高成長の社会的企業で、インパクト測定の支援を無作為に割り付けた初の実験を行い、処置群は売上の伸びと資金調達額がほぼ2倍になった。投資家への実験でも、定量化されたインパクト指標には強く反応し一般的な記述には反応しないと報告する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録を基本とし、Crossrefの題名検索で見つかったSSRN版の抄録で確認。本文は取得できず未読", "preprint": true, "p1": "インドの高成長の社会的企業で、インパクト（社会的な成果）の測定を支援する介入を無作為に割り付けた初の実験を行い、測定を受けた企業は売上の伸びと資金調達額がほぼ2倍になることを示した（抄録）。", "p2": "インパクト投資や社会的企業ではインパクトの測定が中心的な役割を持つが、測定することが企業自身の利益になるかは分かっていなかった（抄録）。", "p3": "高成長の社会的企業を対象に、インパクト測定の介入を無作為に割り付ける比較試験（RCT）を行い、あわせて初期段階の投資家を対象に、定量化したインパクト指標と一般的な質的な記述への反応を比べる実験を行った（抄録）。", "p4": "比較の基準は対照群の企業の売上の伸びと資金調達額、投資家の実験では質的な記述への反応である（抄録）。", "p5": "処置群の企業は対照群に比べ、売上の伸びがほぼ2倍、調達した資金もほぼ2倍だった。投資家は定量化されたインパクト指標には強く反応したが、一般的な質的なインパクトの記述には反応しなかった（抄録）。", "p6": "解釈：抄録からは、標本の企業数、追跡期間、効果の信頼区間、効果が測定そのものによるのか投資家への伝わり方によるのかの分解は分からない。インド以外への一般化も確かめる必要がある。", "fun": "「社会のために良いことをしています」と言うだけでは投資家の心は動かないが、「何人の生活がどれだけ良くなったか」を数字で示すと反応が大きく違った。しかも、数字で測る習慣をつけた会社は売上もお金集めも倍近くになった。良いことを「測る」こと自体が、会社の成長につながるという点が面白い。", "unverified": "本文を読めておらず、企業数・期間・効果の大きさの不確かさ、介入の具体的な内容は未確認。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "小学校の学びの差が15年後の所得を高める", "title": "Learn to Earn: The Long-Term Effects of Foundational Learning", "url": "https://doi.org/10.3386/w36030", "authors": "Tahir Andrabi ほか", "venue": "NBER Working Paper", "apa": "Andrabi, T., Bau, N., Das, J., Khwaja, A. I., & Michaud-Leclerc, C. (2026). Learn to Earn: The Long-Term Effects of Foundational Learning (NBER Working Paper No. 36030). National Bureau of Economic Research. https://www.nber.org/papers/w36030", "why": "パキスタンの児童を15年追跡し、学校の付加価値と村単位の無作為の情報介入という2つの識別戦略で、低所得国で初めて小学校の学習と成人後の学歴・所得の因果関係を示した。よりよい学校に通うことによる生涯所得の増加も金額で試算している。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は取得できず未読", "preprint": true, "p1": "パキスタンの児童を15年追跡し、低所得国で初めて、小学校での学習が成人後の学歴と所得を高めるという因果の証拠を、2つの識別戦略で示した（抄録）。", "p2": "低・中所得国の教育投資の正当化は、テストの得点と経済成長の結びつきなど間接的な証拠に頼ってきた。学校での学習と成人後の所得を同じ人で結ぶ長期のデータが乏しかった（抄録、背景）。", "p3": "第1の戦略は、テストの得点の付加価値（学校が学力をどれだけ伸ばすか）が高い学校に通ったことの効果の推定。第2は、村単位で学習を伸ばした無作為の情報提供の介入の効果の推定である（抄録）。", "p4": "評価は15年後の学歴と所得で、比較の基準は付加価値の低い学校に通った児童と、介入のない村である（抄録）。", "p5": "付加価値の高い学校に通うと15年後の学歴と所得が上がり、情報提供の介入による村単位の学習の伸びも同様の効果を生んだ。1標準偏差よい学校に通う全生徒の生涯所得の増加は合計17万5,000米ドルで、情報提供の介入の公的資金の限界価値（MVPF）は男性で無限大（費用を上回る税収の増加などで実質的に元が取れる）だった（抄録）。", "p6": "解釈：抄録からは、追跡の脱落の扱い、女性での効果、所得の測り方は分からない。17万5,000米ドルの算出の単位（学校あたりなど）は本文で確かめる必要がある。", "fun": "小学校で読み書きや計算がよくできるようになると、大人になって本当に稼ぎが増えるのか。当たり前に思えるが、貧しい国で同じ子どもを15年追いかけて確かめた研究はなかった。よい学校に通った子や、成績の情報を親に知らせた村の子は、大人になって学歴も収入も高かった。教育の効果を「一生の稼ぎ」で示した点が面白い。", "unverified": "本文を読めておらず、効果の大きさの推定値、標本の大きさ、MVPFの計算の前提は未確認。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "誤指定のGMMでも有効な直交スコアでDML", "title": "Orthogonal Scores and Double/Debiased Machine Learning for Possibly Misspecified GMM", "url": "https://arxiv.org/abs/2611.17578", "authors": "Byunghoon Kang", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Kang, B. (2026). Orthogonal Scores and Double/Debiased Machine Learning for Possibly Misspecified GMM (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17578", "why": "モーメント条件が厳密には成り立たない過剰識別のGMMでも有効なNeyman直交スコアを閉じた形で構成し、二重／脱バイアス機械学習（DML）を誤指定に頑健にした。従来の構成はモーメント条件の厳密な成立を前提としていた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（序論、直交スコアの構成の要点、モンテカルロ実験の設定と結果の記述、結論）を読んだ。証明と表1の数値の全体は読んでいない", "preprint": true, "p1": "モーメント条件が厳密には成り立たない（誤指定の）過剰識別のGMMでも有効なNeyman直交スコアを閉じた形で作り、機械学習の第1段推定を使う二重／脱バイアス機械学習（DML）で正しい標準誤差と推論を得られるようにした（抄録、§7）。", "p2": "DMLは機械学習で推定した撹乱パラメータの偏りを直交スコアと交差適合で除く方法として経済学で広く使われるが、既存の直交スコアはモーメント条件がちょうど0になる正しい指定を前提としていた（§1）。操作変数の一部が無効なときや処置効果が異質なとき、過剰識別のモデルではこの前提が崩れる。", "p3": "頑健な直交スコアは、従来の直交スコアに、ヤコビアンと重み行列の推定に関する補正項を加えたもので、補正項は母集団のモーメントに比例し、正しい指定では消える（抄録）。これと交差適合を組み合わせたDMLが、低次元のGMMの推定対象について一様に妥当な推論を与えることを示し、部分線形の操作変数（PLIV）モデルと、複数の操作変数を持つ局所平均処置効果（LATE）モデルで具体化した（§4、§5）。", "p4": "PLIVモデルのモンテカルロ実験（制御変数200個、操作変数5個、第1段はpost-LASSO、5分割の交差適合、標本500・1000・2000、2,000回の反復）で、正しい指定、無効な操作変数（設計A）、異質な効果（設計B）の場合に、従来と頑健な標準誤差の平均と95%信頼区間の被覆率を比べた（§6）。", "p5": "正しい指定では2つの標準誤差と被覆率はほぼ同じだった。誤指定では頑健な標準誤差は従来より約15〜20%大きく、推定量の実際の標準偏差によく一致した一方、従来の標準誤差は小さすぎて信頼区間が全標本サイズで被覆不足になった（設計Aで0.885、0.890など）（§6.1）。", "p6": "推定対象は誤指定のもとでの擬似真値（モーメントを最も0に近づける値）であり、その解釈が政策上の量に対応するかは文脈次第である（解釈）。非線形のスコアや一般の重みへの拡張は付録Bで扱っている（目次）。", "fun": "統計の推定では「誤差の幅」を正しく見積もることが、結論の信頼性を左右する。この研究は、使う前提（モーメント条件）が少し崩れているとき、広く使われている方法の誤差の幅が小さく出すぎてしまい、「確かだ」と言いすぎることを示した。補正の項を足すだけで正しい幅に戻せるという、実務に効く修正が面白い。", "unverified": "表1の全体の数値（MAD、標準偏差、設計Bの被覆率）は抽出の崩れで一部しか確認できていない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "AIの影響は失職が先に、雇用創出は後に表れる", "title": "AI and the Two Margins of Work: Why Job Losses Show Up Before Job Creation", "url": "https://arxiv.org/abs/2611.17530", "authors": "Mark Esposito ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Esposito, M., & Zhang, L. (2026). AI and the Two Margins of Work: Why Job Losses Show Up Before Job Creation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17530", "why": "技術変化は既存の活動内の調整と新しい活動の創出という2つの経路で労働需要に作用し、給与統計は前者をすぐに後者を遅れて記録すると論じた。コンピュータ時代には1978年以降に参入した企業が1998年に給与総額の42%を占めたなどの事実から、AIでも雇用の喪失が創出より先に統計に現れると示す。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（抄録、コンピュータ時代の雇用の分解、AIの初期の指標の2つの経路、モデルの要点）を読んだ。付録の推定の詳細は読んでいない", "preprint": true, "p1": "技術変化は既存の活動の中の調整と、主に新しい企業による活動の創出という2つの経路で労働需要に作用し、給与統計は前者をすぐに、後者を遅れて記録するため、AIの雇用への影響は失職が先に見え、何年も置き換えを過大に評価しうることを示した（抄録）。", "p2": "AIの雇用への影響を給与統計で評価すると、創業者の労力や新しい事業の初期段階が記録されず、新しい仕事の創出が遅れて現れる（§5.1、§6）。", "p3": "国勢調査の企業動態統計（BDS）で、参入企業の雇用創出と既存企業の純変化を分けた（§2.2）。モデルでは1つのAI能力が既存の生産で受け入れられる産出の費用を下げ、新しい事業を試す価値を高め、創業者の労力を雇用時間と別に扱う。製品の規模がすぐ調整されれば総労働時間は減らず、時間がかかれば労働時間はまず減って後で回復する（抄録、§3）。純復元率の指標を提案した（抄録）。", "p4": "検証は、コンピュータ時代の参入世代の給与の保持、自動化特許への曝露が大きい産業での順序、2022年末〜2026年第1四半期の事業所の雇用フローと言語モデルへの曝露の関係である（§2、§5）。", "p5": "1982〜1998年に参入企業は年平均278万の給与雇用を加え、既存企業の純減を上回った（§2.2）。1978年以降の参入企業が1998年に給与総額の42%を占め、参入世代は5年後も約80%を保った（抄録）。2026年第1四半期までの72産業で、ChatGPT以前からの事業所の雇用は2019年比で13.6%減ったが新規開設がそれを上回り、曝露が1標準偏差高い産業と低い産業の差は1.1ポイント（標準誤差1.9）で有意でなかった（§5.2）。", "p6": "現時点の給与データでは、効率の改善が7年かけて広がる場合と効果がない場合を区別できないと著者が認める（§5.2）。長期の符号は所得効果で決まる（抄録）。", "fun": "新しい技術が来ると、まず今ある仕事が減るニュースが目立ち、新しい会社や仕事が生まれる効果は何年も遅れて統計に現れる。コンピュータの時代も、伸びた雇用の多くは新しく生まれた会社によるものだった。AIの影響を「今の雇用統計」だけで判断すると悲観的になりすぎる、という時間差の指摘が面白い。", "unverified": "モデルの数値解（労働時間の谷0.23%など）の前提と、付録の推定表の詳細は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "自動緊急ブレーキの標準装備で追突の負傷が減少", "title": "Crash Injuries and Fatalities in the United States Following Standardization of Automatic Emergency Braking", "url": "https://doi.org/10.3386/w36028", "authors": "Vishal Patel ほか", "venue": "NBER Working Paper", "apa": "Patel, V., Worsham, C. M., Liu-Hass, M., Tsai, T., & Jena, A. (2026). Crash Injuries and Fatalities in the United States Following Standardization of Automatic Emergency Braking (NBER Working Paper No. 36028). National Bureau of Economic Resea
