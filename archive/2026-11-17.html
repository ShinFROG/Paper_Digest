rch. https://www.nber.org/papers/w36028", "why": "2017〜2022年に39車種で自動緊急ブレーキが任意から標準装備になった段階的な導入を自然実験として使い、全米で自車が起こした追突による負傷の割合が13.9%から8.0%に下がったと報告する。任意装備では選ぶ運転者が異なるという選択の偏りを避けた設計である。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は取得できず未読", "preprint": true, "p1": "自動緊急ブレーキ（AEB）が任意装備から標準装備になった時期の車種間の違いを自然実験として使い、AEBが追突による負傷と死亡を減らすことを全米のデータで示した（抄録）。", "p2": "車の安全技術が実際の事故の負傷・死亡を減らすかの厳密な証拠は限られていた。任意の装備を選ぶ運転者はそうでない運転者と異なるため、装備の有無を比べるだけでは効果を取り出せない（選択の偏り）（抄録）。", "p3": "2017〜2022年に39車種でAEBが段階的に標準装備になったことを利用し、標準化の前後で、その車が起こした追突事故による負傷と死亡の割合を比べた（抄録）。", "p4": "比較の基準は、AEBを標準化しなかった車種と、AEBが防ぐよう設計されていない種類の事故（偽の結果、プラセボ）である（抄録）。", "p5": "標準化した最初の年式で、自車が起こした追突による負傷の割合は13.9%から8.0%に、死亡の割合は6.0%から4.7%に下がった。標準化しなかった車種ではどちらも下がらず、AEBが防ぐ設計でない種類の事故は影響を受けなかった（抄録）。", "p6": "解釈：割合の分母（全事故に占める割合か）と、事故件数そのものの変化、標準化と同時期の他の装備の変更の影響は抄録からは分からない。", "fun": "前の車にぶつかりそうになると自動でブレーキがかかる装置は、本当に事故の被害を減らしているのか。オプションで付ける人は慎重な人かもしれないので、単純な比較では分からない。この研究は、メーカーが全車に標準で付け始めた年をきっかけに比べ、追突による負傷の割合が約4割下がったことを示した。付ける人の性格の違いを避けた比べ方が面白い。", "unverified": "本文を読めておらず、データの出所、推定の方法、信頼区間は未確認。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "同等の企業でも貧しい国では投資の関心が下がる", "title": "How Does Capital Flow To Poor Countries? Evidence from Venture Capital and Private Equity", "url": "https://doi.org/10.3386/w36036", "authors": "Emanuele Colonnelli ほか", "venue": "NBER Working Paper", "apa": "Colonnelli, E., Cruz, M., Lerner, J., Pereira-Lopez, M., & Wei, Y. (2026). How Does Capital Flow To Poor Countries? Evidence from Venture Capital and Private Equity (NBER Working Paper No. 36036). National Bureau of Economic Research. https://www.nber.org/papers/w36036", "why": "108か国の投資家1,485人に、企業の特徴・所在地・条件を無作為化した仮想の投資案件を評価させる誘因つきの実験で、基礎的条件への反応は同じでも、貧しい国の企業は同等でも関心が大きく下がることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は取得できず未読", "preprint": true, "p1": "ベンチャーキャピタルとプライベート・エクイティの投資家は、企業の基礎的条件には同じように反応するのに、同等の企業でも貧しい国にあると関心を大きく下げる「貧困国ペナルティ」を持ち、それは新興国に特化した投資家ほど小さいことを示した（抄録）。", "p2": "なぜ貧しい国には民間資本がほとんど流れないのかは長年の問いで、投資家が国をまたいで企業をどう評価しているかの直接の証拠は乏しかった（抄録）。", "p3": "108か国の投資家1,485人に、企業の特徴・所在地・投資条件を無作為化した仮想の投資案件を評価させる、誘因つきの実験的な調査を行い、投資の実務についての詳しい調査もあわせて行った（抄録）。", "p4": "比較の基準は、所在地以外が同じ企業への関心の差と、投資家の市場の特化（新興国か先進国か）や国のリスク管理の実務による違いである（抄録）。", "p5": "同等の企業でも貧しい国では関心が大幅に下がり、このペナルティは新興国に特化した投資家で小さかった。新興国と先進国の投資家は投資の実務はおおむね似ているが、国の情報の入手、国のリスクの評価と管理、投資の回収（エグジット）の方法が違った。国のリスクを積極的に管理すると答えた投資家は、市場の特化を考慮してもペナルティが小さかった（抄録）。", "p6": "解釈：仮想の案件への評価であり、実際の投資行動との対応は確かめる必要がある。ペナルティの大きさの数値は抄録から分からない。", "fun": "同じ中身の会社でも、豊かな国にあるか貧しい国にあるかで、投資家の興味が大きく変わるという。ただし、その国に詳しい投資家ほど割り引きは小さかった。お金が貧しい国に流れにくい理由の一部が、会社の実力ではなく「よく知らない国への不安」にあることを、仮想の案件を使った実験で示した点が面白い。", "unverified": "本文を読めておらず、ペナルティの大きさ、国の所得の分け方、回答者の属性は未確認。"}}, {"id": "pn10", "rank": 10, "field": "地震工学・防災", "headline": "都市の地震死者推計の不確かさは倒壊判定が主因", "title": "Collapse misclassification dominates the uncertainty in city-scale earthquake fatality estimates: a validated probabilistic seismic risk model for the residential building stock of Peshawar, Pakistan", "url": "https://doi.org/10.21203/rs.3.rs-11492895/v1", "authors": "Wasim Khan ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Khan, W., Ullah, S., & Aman, H. (2026). Collapse misclassification dominates the uncertainty in city-scale earthquake fatality estimates: a validated probabilistic seismic risk model for the residential building stock of Peshawar, Pakistan. https://doi.org/10.21203/rs.3.rs-11492895/v1", "why": "パキスタン・ペシャワル県の住宅36万1,357棟（人口431万人）について事象ベースの確率論的地震リスクモデルを更新し、死者推計を検証した。題名のとおり、倒壊の誤分類が都市規模の死者推計の不確かさを支配すると報告する。", "explain": {"basis": "本文", "basis_note": "Research Squareの原稿PDFの本文（抄録、損傷と死者の結果の節、考察の冒頭、限界、結論）を読んだ。方法の各モデルの細部は読み切れていない", "preprint": true, "p1": "パキスタン・ペシャワル県の住宅36万1,357棟（人口431万人）の確率論的な地震リスクモデルを更新し、都市規模の地震の死者推計の不確かさを支配するのは、ハザードや建物の脆弱性よりも「完全損傷を倒壊（死者）にどう換算するか」の段階だと示した（抄録、§4.3）。未査読。", "p2": "データの乏しい急成長都市の確率論的な地震リスクの推計は対策の優先順位づけに使われるが、死者の部分はほとんど検証されてこなかった。ペシャワルの既往の推計は年0.2〜881人と大きくばらついていた（§5.1）。", "p3": "2021年のパキスタン建築基準の震源モデル、国勢調査に基づく暴露モデル（GEMの7建物分類）、GEMの解析的な脆弱性関数で事象ベースのリスク計算を行い、集計損失曲線を等価なスペクトル加速度のハザード曲線に逆変換した閉形式のモデルを導いた（抄録）。死者への換算は5通りの設定で比べ、9要因の感度分析と1,500回のモンテカルロで不確かさを伝播した（抄録、§4.3）。", "p4": "閉形式のモデルを事象ベースの年平均損失（AAL）、建築基準と13の既往研究のハザード、2015年のヒンドゥークシュ地震（Mw 7.5）の観測された死者数と照合した（抄録）。", "p5": "AALは2,020万〜2,280万米ドル（再調達価額の0.26〜0.29%）で、無補強れんがと日干しれんがが97%を占めた。完全損傷をすべて倒壊とみなすと年412〜881人で、2015年の逆解析では州全体の死者を上回りうるが、HAZUSの倒壊率やGEMの死者関数を使うと年51〜77人（10万人あたり1.2〜1.8人）になり観測と整合した（抄録）。死者の5〜95%範囲は年18〜259人で、AALの不確かさは脆弱性モデルの選択が支配した（抄録）。", "p6": "閉形式のモデルは1本の等価ハザード曲線を使い、区内のハザードと地盤の空間変動や地震動の空間相関を無視しており、空間的な損失分布には向かないと著者が認める（§5.3）。日干しれんが平屋の補強は命1つあたり5〜6倍費用対効果が高いが、直接損失だけではどの戦略も経済的に正当化されない（抄録）。", "fun": "地震でどれだけの人が亡くなるかの予測は、計算の途中のたった一つの仮定で10倍も変わってしまう。「完全に壊れた家」を「倒れて人が下敷きになる家」と同じとみなすかどうかである。この研究は、その仮定を過去の地震の実際の被害と照らし合わせて見直し、予測のぶれの大部分がそこから来ることを示した。どこに一番気をつけるべきかを数字で示した点が面白い。", "unverified": "各構成（ATC-13、HAZUS、GEM）の死者推計の細かな数値の対応と、感度分析の順位は一部しか確認していない。"}}, {"id": "pn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "ワーク・エンゲイジメントの交差遅延効果を再検証", "title": "No convincing evidence for prospective effects between work engagement, burnout, and personality traits: A reassessment of Fukuzaki and Iwata (2027)", "url": "https://doi.org/10.31234/osf.io/k4tp3", "authors": "Kimmo Sorjonen ほか", "venue": "PsyArXiv", "date": "2026-11-16", "apa": "Sorjonen, K., Melin, B., Folke, F., & Melin, M. (2026). No convincing evidence for prospective effects between work engagement, burnout, and personality traits: A reassessment of Fukuzaki and Iwata (2027). https://doi.org/10.31234/osf.io/k4tp3", "why": "Fukuzaki and Iwataが交差遅延パネルモデルでワーク・エンゲイジメント、バーンアウト、性格特性の間に前向きの影響があると結論したのに対し、同じ標本サイズと相関行列を再現した模擬データで、有意な交差遅延係数は別の統計的過程でも生じることを示し、前向きの影響の説得的な証拠はないと再評価した。", "explain": {"basis": "本文", "basis_note": "PsyArXivのPDFの本文（方法、結果、考察の冒頭）を読んだ。図1の各パネルの数値は読み切れていない", "preprint": true, "p1": "Fukuzaki and Iwataが交差遅延パネルモデルで示したワーク・エンゲイジメント、バーンアウト、性格特性の間の前向きの（時間的に先行する）影響は、もっともな別の分析の指定では向きが逆になったり消えたりし、すべてを統合すると有意な効果は残らないことを示した（抄録、結果）。", "p2": "交差遅延の係数が有意でも、回帰の人工物（たとえば平均への回帰）など別の統計的な過程で同じような推定値が生じうるため、それだけでは本当の前向きの影響を示せない（抄録）。", "p3": "原データは入手できなかったため、元論文が報告した標本サイズと相関行列を再現する模擬データを作った（方法）。Sorjonenらの推奨に従い、結果変数の初期値を統制する従来の指定（a1）、追跡時点の値を統制する指定（b1、Campbell and Kennyが回帰の人工物の検討に推奨）、どちらも統制しない指定（c1）の3通りで前向きの関係を推定し、全推定値をメタ分析で統合した（方法）。", "p4": "比較の基準は元論文の結論で、3つの指定の間で効果の向きと大きさが一致するか、統合した効果が有意かで判断した（結果）。", "p5": "初期値を統制すると元論文の結論が再現され、たとえばエンゲイジメントが後の開放性を高め、バーンアウトが後の神経症傾向を高めた（図1）。追跡時点の値を統制すると関連の向きが反転し、バーンアウトと後の神経症傾向の正の関連は負になった。どちらも統制しないと、1つを除いてほぼすべての関連が有意でなくなった。メタ分析で統合した効果はどれも有意でなかった（結果）。", "p6": "再分析は報告された相関行列から作った模擬データによるもので、原データでの検証ではない（方法）。著者は、多元宇宙分析（マルチバース分析）の推奨に沿い、単一のモデルではなく合理的な分析の選択肢全体の傾向から結論を引くべきだとする（抄録）。", "fun": "「やる気のある人は、後で性格まで前向きに変わる」という研究結果があったとする。この再検証では、同じデータでも分析の仕方を少し変えるだけで、効果がプラスにもマイナスにもゼロにもなった。一つの分析方法で見えた効果をうのみにせず、いくつもの方法で確かめる大切さがよく分かる点が面白い。", "unverified": "元論文の標本サイズ、測定の時点の間隔、個々の係数の値は、読んだ範囲では確認できていない。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "反論に流されず正解を保つ能力をLLMに学ばせる", "title": "Benchmarks Don't Talk Back: Learning Through Self-Disagreement", "url": "https://arxiv.org/abs/2611.17563", "authors": "Soheil Abbasloo ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Abbasloo, S., & Cheng, P. (2026). Benchmarks Don't Talk Back: Learning Through Self-Disagreement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17563", "why": "LLMは誤った反論でも正しい答えを手放すことがあり、それは正確さの不足ではなく、立場を保つべき時と譲るべき時を見分ける独立した能力（弁証法的能力）の問題だと論じ、自己の不一致から学ぶ方法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（問題の診断、設計の概要、全体の結果、限界）を読んだ。付録の詳細表は読んでいない", "preprint": true, "p1": "LLMが反論を受けたときに、正しい答えを保つべき時と、より良い答えに譲るべき時を見分ける能力（弁証法的能力）は、最初の答えの正確さとは別の能力で、モデル自身が自分の答えへの最強の反論を作り、その反論が成り立つかを判定する自己不一致（Self-Disagreement）の強化学習で鍛えられることを示した（抄録、§4.1）。", "p2": "ベンチマークはモデル単独の答えを測るが、実際の利用では答えに異議が出され、モデルは誤った反論にも正しい答えを手放す（§1）。正確さを上げる学習や、自己整合性・自己反省など推論時の工夫ではこの振る舞いは改善しなかった（§2）。", "p3": "1つのモデルが答えを示し、別の文脈でその答えへの反論（アンチテーゼ）を作り、戻って反論が成り立つかを判定してから答え直す。報酬は参照解との照合による検証可能な報酬（RLVR）だけで、答えと判定の両方を同じ検証器で採点し、報酬モデル・選好データ・人の注釈は使わない（§3）。", "p4": "327問を17の挑戦者（外部モデル15、自身の初期モデル、自身の批判）にぶつける診断用の問題集で、挑戦を受けた後に落ち着いた答えの正答率（統合正答率）を測った。基準はQwen3-8BとGemma-2 9Bの元モデルと、正確さだけで学習した対照など（§2、§4）。", "p5": "元モデルは自分が正しく挑戦者が誤っているときに正答を保てたのがQwen3-8Bで53.3%、Gemma-2 9Bで25.1%で、ほぼ無条件に譲っていた（§2）。学習後のQwen3-8Bは9つの公開ベンチマークすべてで元モデルを上回り、統合正答率は平均50.0%から55.9%（+5.90ポイント、95%区間+4.64〜+7.16）、Gemma-2 9Bは19.9%から37.8%になった（§4.1）。同じ挑戦を全員に与える比較でも元モデルより6.2〜14.1ポイント高かった。", "p6": "報酬は参照解との完全一致の検証に限られ、正しさを確かめられない領域で同じ信号が作れるかは未解決だと著者が認める（§5）。挑戦は主に1往復で、複数のモデル系統・規模への一般性も主張していない（§5）。", "fun": "議論で相手に強く言われると、自分が正しくても「そうかも」と折れてしまうことがある。AIも同じで、間違った反論にも正しい答えを簡単に手放していた。この研究では、AIに自分の答えへの一番強い反論を自分で考えさせ、その反論が本当に正しいかを判定する練習をさせた。外から反対意見をもらわなくても、自分の中の反対意見で鍛えられるという点が面白い。", "unverified": "付録の各ベンチマークの値と、報酬の分解（スキル項11.08ポイントなど）の意味は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "因果探索の結果に解釈できる信頼領域を与える", "title": "Interpretable confidence regions for causal discovery", "url": "https://arxiv.org/abs/2611.17771", "authors": "Jian Kang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Kang, J., Mazumder, A., Lembo, G. C., & Taeb, A. (2026). Interpretable confidence regions for causal discovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17771", "why": "観察データから同定されるCPDAG（因果グラフの同値類）について、条件付き独立性の検定を摂動させて妥当なグラフを生成するperturbed PCをもとに、解釈できる信頼領域を構成した。因果探索の多くは点推定にとどまり、構造の不確かさの扱いが手薄だった。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（貢献のまとめ、信頼領域のシミュレーションの設定と結果）を読んだ。理論の証明と計算法の詳細（§5、§6）は読んでいない", "preprint": true, "p1": "観察データから推定される因果グラフの同値類（CPDAG）について、点推定ではなく、真のグラフを含む「信頼領域」を、中心と半径の信頼球や、上下の境界グラフで挟む信頼区間という解釈しやすい形で作れるようにした（抄録、§1.1）。", "p2": "因果探索の研究の多くは因果グラフの点推定にとどまり、学習した構造の不確かさはあまり扱われてこなかった（抄録）。既存のperturbed PC（PC法の条件付き独立性の検定を摂動させて妥当なCPDAGを多数作る方法）は、閾値が実行回数Mとともに小さくなり、偽のばらつきが増えた（§1.1）。", "p3": "閾値を√log M の次数で大きくして、帰無仮説のもとの最大の摂動の大きさに合わせ、偽の棄却を抑えつつ弱い信号は少なくとも1回は通るようにし、強い忠実性の仮定なしに漸近的な被覆を保った（§1.1）。得られたCPDAGの集まりを、モデルの包含関係の半順序（poset）の最短路距離による信頼球と、共通の下界・上界のグラフによる信頼区間に要約し、その厳密計算の理論とアルゴリズムを作った（§1.1、§5、§6）。", "p4": "線形ガウスの構造方程式モデルで、変数10個の例では20のモデル×各30データの600件を、M=1000回の摂動で解析し、PCの点推定と既存のperturbed PCの集まりと、被覆率（領域が真のCPDAGを含む割合）と領域の大きさ（半径・幅）で比べた（§1.1、§7）。", "p5": "PCの点推定の被覆は悪く、既存の集まりは小標本で被覆が不足したが、信頼球や信頼区間に変換すると被覆が大きく改善した。提案した閾値は同等の被覆を保ちながら、信頼球の半径と区間の幅をかなり小さくした（図1、§7.2）。", "p6": "解釈：実験は線形ガウスの模擬データと変数10〜15個の規模に限られ、非線形・非ガウスの場合や大規模なグラフでの計算費用は、読んだ範囲では確かめられていない。", "fun": "データから「何が何の原因か」を矢印の図で推定する方法はあるが、推定にはぶれがつきもので、一枚の図だけでは信用しにくい。この研究は、「本当の図はこの範囲のどこかにある」と、ありうる図の範囲を示す方法を作った。しかも、その範囲を「中心の図から何歩以内」や「この図とこの図の間」のように、人が読める形でまとめた点が面白い。", "unverified": "被覆率と半径の具体的な数値（図1、図9、図10）は図からの読み取りが必要で確認できていない。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "単体のアラインメントはチームのAIに移らない", "title": "Aligning AI Teams", "url": "https://arxiv.org/abs/2611.17820", "authors": "Siddarth Srinivasan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "apa": "Srinivasan, S., Matthews, M. J., Sohl-Dickstein, J., & Jones, E. (2026). Aligning AI Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17820", "why": "個々のLLMエージェントへのアラインメント訓練が複数エージェントの協働では効かなくなる仕組みを、ソフトウェア開発の2課題とコンサルティング提案の10課題で調べ、チームへの移転を保つ介入を検討した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTMLの本文（チーム構成と介入、敗血症の分類器と推薦システムの事例の結果と仕組みの分析）を読んだ。コンサルティング提案の課題と付録は読み切れていない", "preprint": true, "p1": "個々のLLMエージェントで保たれていた安全な振る舞いがエージェントのチームでは崩れる主な原因が「責任の分散」であることを示し、安全責任者のエージェントを指名し、調整役に安全仕様の文書を書かせると単体並みの安全性に戻せることを示した（抄録）。", "p2": "個々のLLMへのアラインメント訓練が複数エージェントの協働に移らないことは先行研究で示されていたが、その仕組みと、それを防ぐ介入は分かっていなかった（§1）。", "p3": "プロジェクトマネージャ1体とコーダー8体（同じモデル、ハブと放射状の構成）のチームを基準に、グループチャット、相互レビュー（3つの構成）、安全に焦点を当てたレビュー、責任の割り当て（安全責任者の指名・全員・マネージャへの集中）、安全仕様の文書、文書と責任者の組み合わせを試した（§4.1）。記録を別のLLMで読み、統合したシステムを試したか、害に気づいたか、直そうとしたか、責任を転嫁・正当化したかを符号化した（§4.2）。", "p4": "敗血症のトリアージの分類器（合成のICU患者400件で学習、100件で評価、安全性は感度）とニュース推薦の構築、10のコンサルティング提案の作成で、単体のエージェントの安全性の範囲との差を比べた（§4、§5）。", "p5": "敗血症の課題でチームの安全性は単体より、Mythos Previewで約59ポイント、Opus 4.7で36ポイント、Opus 4.6で35ポイント低かった（§4.2）。一方、推薦の課題ではMythos Previewの差が−3ポイントと最小で、能力が高いほど差が大きいという一貫した傾向はなかった（§4.3）。相互レビューやグループチャットなどの自然な介入は差を確実には埋めず、文書と責任者の組み合わせが最も確実に単体の範囲まで戻した（§4.2、§4.3）。", "p6": "評価した課題とモデル（Anthropicのモデル中心）は限られ、記録の符号化もLLMの判定に依存する（§4.2、付録C）。解釈：実際の開発組織の分業にどこまで当てはまるかは今後の検証が要る。", "fun": "一人で仕事をすると「これで患者さんに害が出ないか」と全体を確かめるAIも、9人のチームに分けると、自分の担当部分だけを見て全体の確認を誰もしなくなった。人間の組織でも起きる「誰かがやるだろう」という責任の分散が、AIのチームにも起きたのである。対策も人間と同じく「安全の責任者を一人決める」ことが効いた点が面白い。", "unverified": "コンサルティング提案の課題の結果と、責任の分散の各指標の割合（図2）は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "自営と給与所得の課税の不公平は垂直的不公平並み", "title": "Horizontal Equity of Taxation: Citizen Beliefs and Policy Preferences", "url": "https://doi.org/10.3386/w36007", "authors": "Pierre Bachas ほか", "venue": "NBER Working Paper", "apa": "Bachas, P., Hoy, C. A., Jensen, A., & Shaukat, M. (2026). Horizontal Equity of Taxation: Citizen Beliefs and Policy Preferences (NBER Working Paper No. 36007). National Bureau of Economic Research. https://www.nber.org/papers/w36007", "why": "途上国29か国の税のミクロシミュレーションと家計調査で、自営業者への課税が難しいために生じる同じ所得の納税者間の水平的不公平が垂直的公平と同程度の大きさで、給与所得者に偏る累進的な改革で悪化すると示した。パキスタンでの情報提供の無作為化実験で人々の認識と政策選好も調べた。", "explain": {"basis": "本文", "basis_note": "IFSのワーキングペーパー版のPDF（抄録と序論）を読んだ。本文は約1万行あり、推計と実験の結果の節の詳細は読み切れていない", "preprint": true, "p1": "途上国では、同じ所得でも自営業者は給与所得者より実効税負担がずっと軽いという水平的不公平が大きく、垂直的公平（高所得者と中位の差）と同程度であること、所得税を厚くして垂直的公平を改善する改革は水平的不公平を同程度悪化させることを示した（抄録、序論）。", "p2": "自営業の所得は第三者からの報告や源泉徴収がないため、所得税で50〜75%が申告されないのに対し、給与所得者の脱税率は通常10%未満で、同じ所得でも税負担が大きく違う（序論）。途上国では自営業者が労働力の大きな割合を占め、上位10%でも約半数にのぼる。", "p3": "雇用の形態と家計の消費を区別できる途上国29か国の家計調査を使い、個人所得税（控除・税率表）と付加価値税（軽減税率やインフォーマルな購入）を組み込んだ税のミクロシミュレーションを作り、雇用形態ごとの脱税の推計と合わせて実効税率を求めた（序論）。パキスタンでの対面調査と、他の途上国5か国のオンライン調査で、実態についての情報を無作為に与える実験を行った（序論）。", "p4": "水平的不公平は上位10%の給与所得者と自営業者の実効税率の差、垂直的不公平は上位10%と中位の労働者の差で測り、国ごとの平均実効税率で基準化した（序論）。", "p5": "上位10%の自営業者は、他の点で同等の給与所得者より税負担が6ポイント（相対で36%）少なく、この差は垂直的な差と同程度だった。税収を変えずに所得税を増やし消費税を減らす改革は、垂直的公平を改善するが水平的公平を同程度悪化させた（序論）。調査では水平的不公平への懸念が広く、情報提供は懸念を高めたが、所得税と消費税の選択を含む政策選好は変えなかった（序論）。", "p6": "解釈：脱税率は外部の推計に依存しており、その不確かさが不公平の大きさの推計にどう伝わるかは、読んだ範囲では確認できていない。", "fun": "同じ年収でも、会社員は給料から税金が天引きされるが、自営業者は申告しない分を隠しやすい。途上国ではこの差が大きく、お金持ちの自営業者は同じ収入の会社員より税金が3割以上少なかった。金持ちからもっと取ろうと所得税を上げると、かえって会社員と自営業者の差が広がってしまう、という公平さどうしのぶつかり合いが面白い。", "unverified": "対象国の数は抄録では25か国、序論とNBERの抄録では29か国と記されており、どちらが最終の数かは未確認。実験の効果の推定値は読んでいない。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "合理的不注意の離散選択モデルをセミパラで推定", "title": "Estimating a Rational Inattention Discrete Choice Model: A Semiparametric Approach", "url": "https://arxiv.org/abs/2611.18479", "authors": "Hanqi Wang", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Wang, H. (2026). Estimating a Rational Inattention Discrete Choice Model: A Semiparametric Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18479", "why": "選択は選択肢の利得とその利得について決定前に学ぶ情報に依存するとして、選択データから観察されない利得の異質性と情報取得の費用の両方を識別できることを示し、外生的な利得と情報費用のシフターのもとでのセミパラメトリックな点識別の条件を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "合理的不注意（情報の取得に費用がかかるため選択肢の利得を不完全にしか調べない）の離散選択モデルで、選択データから利得の異質性と情報の単位費用の両方を、分布の形を仮定せずに識別・推定できることを示した（抄録）。", "p3": "2項選択では、利得のシフターの関数としての選択確率を累積分布関数に持つ観察されない閾値を構成し、そのモーメントから利得の係数と情報費用を、逆畳み込みで嗜好ショックの分布を識別する。多項選択へ拡張し、市場シェアに基づくシーブ最小距離推定量と検定の反転による信頼領域を作った（抄録）。", "p5": "Amazon Mechanical Turkへの応用で、情報の単位費用が下がると平均の課題の引き受け確率が上がり、賃金への弾力性が下がる反実仮想を示した（抄録）。", "fun": "人は選ぶ前に全部を調べ尽くすわけではなく、調べる手間と得を天秤にかけて「ほどほどに」調べて選ぶ。この研究は、人々の選択の記録だけから、その「調べる手間の大きさ」まで推し量れることを数学的に示した。見えない心の中のコストを、行動のデータから取り出す点が面白い。", "unverified": "応用での推定値（情報費用の大きさ）の具体的な数値は抄録から確認できない。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "正の重みだけではTWFEの推論は保証されない", "title": "Positive Weights Do Not Certify TWFE Inference: A Design Diagnostic under Treatment-Effect Heterogeneity", "url": "https://arxiv.org/abs/2611.18116", "authors": "Stanis{\\l}aw M. S. Halkiewicz", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Halkiewicz, S. M. S. (2026). Positive Weights Do Not Certify TWFE Inference: A Design Diagnostic under Treatment-Effect Heterogeneity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18116", "why": "処置効果が異質なとき、すべての処置の重みが正でも二元固定効果（TWFE）の推論は一様に妥当とは限らないことを示し、局所的な処置効果のずれのもとでの最悪の偏りの大きさを設計だけから計算できる診断量を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "処置効果が異質なとき、処置の重みがすべて正でも二元固定効果（TWFE）の推論が一様に妥当とは限らないことを示し、その妥当性を設計の情報から検査・保証する診断法を作った（抄録）。", "p3": "局所的な処置効果のずれのもとで、処置セルの等重みの効果の統計量の最悪の平均のずれを(c/q)Γ（Γは設計だけで決まる量、qはクラスタのスコアの雑音の尺度）と導き、危険を検出する片側の下限と、妥当性を保証する非心カイ二乗の反転という2つの正則な手続きを用いた（抄録）。", "p5": "5%の名目水準で5ポイントの許容のとき閾値は0.652だった。最低賃金のパネルでは飽和モデルの95%下限が0.793で従来の推論は保証されず、ブラジルの固定資産税の再分析（2,840自治体）でも4分類すべてで保証されなかった（抄録）。", "fun": "政策の効果を測る定番の回帰分析には「重みが負になると危ない」という注意書きがある。この研究は、重みが全部正でも安心できない場合があることを示し、自分のデータの設計だけから危険度を計算する方法を作った。よく使われる道具の安全確認の基準を一段厳しくした点が面白い。", "unverified": "診断量の計算の詳細と、離婚・正当防衛法（castle doctrine）の再分析の数値の意味は抄録の範囲でしか確認できない。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "途上国のインフラは最後の裁定機会になりうる", "title": "The Last Arbitrage? Capital Flows, Development, and Infrastructure as an Asset Class", "url": "https://doi.org/10.3386/w36022", "authors": "Anusha Chari ほか", "venue": "NBER Working Paper", "apa": "Chari, A., Gamble, M., & Henry, P. B. (2026). The Last Arbitrage? Capital Flows, Development, and Infrastructure as an Asset Class (NBER Working Paper No. 36022). National Bureau of Economic Research. https://www.nber.org/papers/w36022", "why": "なぜ資本は豊かな国から貧しい国へ流れないかというLucasの問いについて、途上国の株式市場の開放で生まれた資産クラスとの対比から、インフラが最後の裁定機会になりうると論じた。貧しい国の舗装道路の社会的収益率の中央値は自由化当時の米国の資本収益率の3.7倍だが、投資家が得るのは契約や料金で確保できる部分だけだと指摘する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "途上国のインフラは社会的収益率が高いのに民間資本が集まりにくい理由を、投資家が得られるのは社会的収益の一部だけだという制約（民間の対外的なハードル）と、収益の情報が開示されないことから論じた（抄録）。", "p3": "株式市場の開放後の新興国株と比べ、貧しい国の舗装道路の社会的収益率を推計し、国際金融公社（IFC）の非公開のインフラ株式ポートフォリオの収益を分析した（抄録）。", "p5": "舗装道路の社会的収益率の中央値は自由化当時の米国の資本収益率の3.7倍だった。IFCのインフラ株式はS&P 500を年2ポイント上回ったが、上回った個別投資は41%で、交通への投資は9件と電力・通信の157件より少なかった（抄録）。", "fun": "道路はみんなの役に立つので社会全体の得は大きいが、通行料などで回収できる分しか投資家の儲けにならない。だから得が大きいのにお金が集まらない。さらに過去の儲けの情報が公開されていないと、投資家は学ぶこともできない。インフラにお金が流れない理由を、情報の問題として示した点が面白い。", "unverified": "社会的収益率の推計の方法と対象国の数は抄録から確認できない。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "H-1Bなど一時的な高技能移民の労働市場への影響", "title": "The Labor Market Impact of Temporary High-Skill Immigration Programs", "url": "https://doi.org/10.3386/w36014", "authors": "George J. Borjas", "venue": "NBER Working Paper", "apa": "Borjas, G. J. (2026). The Labor Market Impact of Temporary High-Skill Immigration Programs (NBER Working Paper No. 36014). National Bureau of Economic Research. https://www.nber.org/papers/w36014", "why": "米国コミュニティ調査で一時的な高技能就労者を特定し、学歴と専攻ごとの供給を測った。最も影響を受ける技能層の自国民は所得の伸びが鈍り通年フルタイムの就業が相対的に減ったと報告し、資格の終了後も残る人を含むモデルで影響を評価する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "H-1BやOPTなどの一時的な高技能就労の制度が米国の労働者に与える影響を、資格の終了後も残る人の効果まで含めて推計した（抄録）。", "p3": "米国コミュニティ調査で一時的な就労者を特定して学歴・専攻ごとの供給を測り、一時的な流入と残留者のモデルから、現在の一時的な就労者の数への操作変数回帰の係数が残留者の乗数を含むことを示し、観測された増加を掛けて全体の効果を求めた（抄録）。", "p5": "理工系の学位を持つ自国民の所得は約3.5%、コンピュータ・電気電子の修士は約16%低くなり、生産の補完性による平均賃金の上昇（約1.4%）は損失の一部しか相殺しなかった（抄録）。", "fun": "外国から専門職の人が来ると、同じ仕事をする人の給料は下がるのか、それとも会社全体が伸びてみんなの給料が上がるのか。この研究は、ビザが切れた後も残る人たちという、統計に表れない影響まで計算に入れる工夫をした。見えない人の分を数式で取り戻す発想が面白い。", "unverified": "操作変数の具体的な内容と、乗数が成り立つ条件は抄録から確認できない。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "技能の供給が少ない国ほど大企業の雇用が少ない", "title": "Skill Supply, Firm Size, and Economic Development", "url": "https://econpapers.repec.org/RePEc:iza:izadps:dp19052", "authors": "Gottlieb ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "57か国の労働者の学歴・賃金と雇用主の規模を結びつけた統一のミクロデータで、技能の賦存が少ない国ほど大企業での雇用が少なく技能プレミアムが大きく、大企業は技能集約的であるなど4つの事実を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "低所得国で大企業の雇用が少ないのは、技能を持つ労働者が少ないことへの効率的な対応だと、57か国のミクロデータとモデルで示した（抄録）。", "p3": "労働者の学歴・賃金と雇用主の規模を結びつけた統一データから4つの事実を示し、異質な企業が技能集約的な近代技術と伝統的技術を選ぶモデルで説明・定量化した（抄録）。", "p5": "技能の少ない国ほど大企業の雇用が少なく技能プレミアムが大きく、大企業は技能集約的でその差は低所得国で大きい。モデルでは技能の賦存が大企業の雇用の国際差の88%を説明し、技術の選択が技能増加による産出の利得を3分の1上乗せした（抄録）。", "fun": "貧しい国に小さな会社が多いのは、制度が悪くて会社が大きくなれないからだと考えられがちである。この研究は、技能を持つ人が少ない国では、その人たちを必要としない小さな会社のやり方の方が理にかなっていると示した。「非効率に見えるものが実は合理的」という見方の転換が面白い。", "unverified": "57か国の内訳とデータの出所は抄録から確認できない。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "戦略的に単純な仕組みでも選好は見分けにくい", "title": "Menu Design Meets Market Design: Strategic Simplicity vs. Choice Complexity", "url": "https://arxiv.org/abs/2611.17984", "authors": "Gian Caspari ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Caspari, G., Hild, P. E., Hilweg-Waldeck, M., Khanna, M., & Meisner, V. (2026). Menu Design Meets Market Design: Strategic Simplicity vs. Choice Complexity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17984", "why": "虚偽の申告の誘因をなくす戦略的な単純さと、参加者が自分の選好を見分けられることは別の問題だとして、逐次独裁制で実労働の課題の組み合わせを選ぶ誘因つきの実験を行い、選択の複雑さの影響を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "うそをつく誘因がない（戦略的に単純な）仕組みでも、人は自分が何を好むかを見分けられず、選んだ後に約6回に1回は選択をひっくり返すことを実験で示した（抄録）。", "p3": "逐次独裁制の実験で、参加者は実労働の課題の組み合わせ（課題の数が異なる）を15回、誘因つきで、大きなメニューからまたは2択の連続で選び、最後に予告なく、各割り当てを以前に退けた選択肢と比べて選び直した（抄録）。", "p5": "選択のおよそ6回に1回が覆され、5回に1回近くが客観的に劣る組み合わせを含んだ。選び方を単純にしても改善せず、2択への分解は能力の低い参加者の反転を増やし、自信を過大にした（抄録）。", "fun": "正直に好みを答えるのが一番得になるように仕組みを作っても、本人が自分の好みを分かっていなければうまくいかない。この実験では、選んだ後に聞き直すと6回に1回は答えが変わった。選び方を単純にすれば迷わないはず、という直感が外れた点も面白い。", "unverified": "参加者数と、反転率の群間の差の大きさは抄録から確認できない。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "サステナブル債の発行が企業統治の採用を促す", "title": "Investment and Governance: Through The Lens of Sustainability", "url": "https://doi.org/10.3386/w36011", "authors": "Jitendra Aswani ほか", "venue": "NBER Working Paper", "apa": "Aswani, J., & Rigobon, R. (2026). Investment and Governance: Through The Lens of Sustainability (NBER Working Paper No. 36011). National Bureau of Economic Research. https://www.nber.org/papers/w36011", "why": "2013〜2022年の公開企業のサステナブル債3,944件で、不均一分散に基づく識別により、サステナブルな負債の比率が1%上がるとサステナビリティの統治を採用する確率が9.2%上がり、採用は環境パフォーマンスを16%改善する（構造推定）と報告する。効果は非金融企業に限られる。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "サステナブルな資金調達（サステナブル債・ローン）が企業のサステナビリティの統治の採用を促し、採用が環境パフォーマンスを改善するという因果の連鎖を推計した（抄録）。", "p3": "2013〜2022年の公開企業のサステナブル債3,944件で、不均一分散に基づく識別戦略を使い、構造推定で環境パフォーマンスへの効果を求めた（抄録）。", "p5": "サステナブルな負債の比率が1%上がると統治の採用確率が9.2%上がり、採用は環境パフォーマンスを16%改善した（構造推定）。効果は非金融企業に限られ、環境パフォーマンスがよい企業ほど採用しにくかった（抄録）。", "fun": "環境のためのお金を借りると、会社の仕組みまで環境重視に変わるのか。この研究は、借りたお金の割合が増えるほど環境の担当体制を整える会社が増え、実際に環境の成績も良くなることを示した。お金の流れが会社の中の決まりを変えるという因果の連鎖を、数字で追った点が面白い。", "unverified": "不均一分散による識別の仮定の妥当性と、環境パフォーマンスの指標の定義は抄録から確認できない。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "地元警察の移民取締り権限で軽微な逮捕が増加", "title": "Crime on ICE: Local Police Behavior and Immigration Enforcement in the United States", "url": "https://doi.org/10.3386/w36026", "authors": "John J. Donohue ほか", "venue": "NBER Working Paper", "apa": "Donohue, J. J., Markman, T., & Baldwin, E. A. (2026). Crime on ICE: Local Police Behavior and Immigration Enforcement in the United States (NBER Working Paper No. 36026). National Bureau of Economic Research. https://www.nber.org/papers/w36026", "why": "2000〜2024年のFBI統一犯罪報告で、地元警察が連邦の移民法を執行する権限を得た時期の違いを使い、軽微で裁量的な犯罪の逮捕が約7%増えた一方、それに見合う犯罪の減少は見られないと報告する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "地元の警察が連邦の移民法を執行する権限を持つと、軽微で裁量的な逮捕が増える一方、治安の改善は見られないことを示した（抄録）。", "p3": "2000〜2024年のFBI統一犯罪報告のデータで、管轄ごとに権限の導入時期が異なることを利用し、取り締まりへの因果効果を推計した（抄録）。", "p5": "権限の導入で軽微で裁量的な犯罪の逮捕が約7%増えたが、犯罪の発生率や重大犯罪の減少は見られなかった（抄録）。", "fun": "警察に新しい権限を与えると町は安全になる、と説明されることが多い。この研究は全米のデータで、逮捕は増えても犯罪自体は減っていないことを示した。何を取り締まるかの優先順位が変わるだけかもしれない、という見方が、政策の効果を確かめることの大切さを教えてくれる点が面白い。", "unverified": "差の差の推定量の種類と、事前トレンドの検定の結果は抄録から確認できない。"}}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "連邦のフォニックス教育事業の学力への効果", "title": "Decoding Success: Phonics-based Instruction and Student Achievement", "url": "https://doi.org/10.3386/w36018", "authors": "Alex Hollingsworth ほか", "venue": "NBER Working Paper", "apa": "Hollingsworth, A., Ortega, A., & Zirogiannis, N. (2026). Decoding Success: Phonics-based Instruction and Student Achievement (NBER Working Paper No. 36018). National Bureau of Economic Research. https://www.nber.org/papers/w36018", "why": "No Child Left Behindのもとで年約10億ドル規模だった連邦の読解教育事業Reading Firstを対象に、フォニックス（音と綴りの対応）に基づく指導が生徒の学力に与えた効果を分析した。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "かつて効果がないとして打ち切られた連邦の読解教育事業Reading First（フォニックス重視）が、実は読解の得点を上げ、大人になってからの学歴と所得まで高めていたことを示した（抄録）。", "p3": "テキサス州の行政データと事業の受給資格の算定式を使い、差の差と操作変数の推定で効果を求め、デジタル化した試験問題を分析し、対象の世代を成人初期まで追跡した（抄録）。", "p5": "受給資格は3年生の読解の得点を0.1標準偏差上げ、効果は少なくとも8年生まで続いた。基本的な読み解きや語数の多い問題で差が大きく、数学の得点も上がった。高校の期限内の卒業、大学進学、4年制大学の修了、25歳時の所得も増えた（抄録）。", "fun": "文字と音の対応を練習する読み方の指導は、効果がないとして一度打ち切られた。ところが十数年後のデータで追うと、子どもたちは読む力だけでなく数学の点、進学、25歳の稼ぎまで伸びていた。短い期間の評価だけで政策を判断する危うさが分かる点が面白い。", "unverified": "所得や進学への効果の大きさの数値は抄録から確認できない。"}}, {"id": "pn25", "rank": 25, "field": "因果推論", "headline": "製品ごとの実験の効果をサイト全体の影響に換算", "title": "Making Experiment Results Comparable through Sitewide Impact Estimation", "url": "https://arxiv.org/abs/2611.18411", "authors": "Xiaochen Zhang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Zhang, X., Zheng, W., Kang, X., & Manthena, V. (2026). Making Experiment Results Comparable through Sitewide Impact Estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18411", "why": "Robloxの多様な製品面では、無作為化実験の効果はその標本の利用者についてしか分からず、面ごとの到達範囲と全体指標への寄与が違うため比較できないとして、実験の効果をサイト全体への影響に換算する推定法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "製品面ごとの無作為化実験の効果（リフト）を、施策を対象者全員に適用したときのサイト全体の指標への影響（サイト全体インパクト）に換算する推定法をRobloxで作った（抄録）。", "p3": "到達範囲と、処置がないときの対象集団の全体指標への寄与を組み合わせた被覆係数でリフトを拡大し、平均の差の指標と、2つの集計値の比の指標のそれぞれの推定量を作り、A/A試験と長期のホールドアウトで検証した（抄録）。", "p5": "利用時間で有意な139の実験で、リフトとサイト全体インパクトの順位相関は0.20にとどまり、リフトの上位10件のうちサイト全体インパクトでも上位10件に入ったのは5件だった（抄録）。", "fun": "実験で「この機能で利用時間が10%増えた」と分かっても、その機能を使う人が少なければ全体への影響は小さい。逆に、少数でもよく遊ぶ人に効く機能は全体を大きく動かす。この研究は、実験の効果の大きさと全体への影響の順位がほとんど一致しないことを示した点が面白い。", "unverified": "推定量の分散の扱いと、年ごとの成長の帰属の結果は抄録から確認できない。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "干渉のある集団で処置対象を資源制約つきで最適化", "title": "Constrained Stochastic Policy Targeting under Heterogeneous Partial Interference", "url": "https://arxiv.org/abs/2611.18444", "authors": "Elena Dal Torrione ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Torrione, E. D., Park, C., & Forastiere, L. (2026). Constrained Stochastic Policy Targeting under Heterogeneous Partial Interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18444", "why": "処置が本人への直接効果と他者への間接効果を通じて集団の平均に効く不均一な部分干渉のもとで、資源の制約のもとで確率的に処置対象を選ぶ政策を設計する方法を示した（例：感染を広げやすい人へのワクチン接種）。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "処置が本人と周囲の両方に効く不均一な干渉のもとで、成果の目標を満たしつつ平均の処置確率を最小にする個人別の確率的な処置方針を学習する方法を示した（抄録）。", "p3": "制約違反の滑らかな代理と、干渉を考慮した逆確率重みづけまたは自己正規化の推定量で集団平均の成果を推定し、両推定量について有限標本での後悔（regret）の保証を与えた。処置確率に制約をおいて成果を最大にする補完的な問題も扱った（抄録）。", "p5": "コロンビアの通学を促す条件付き現金給付に適用し、干渉を考慮して処置確率を個人別にすると、干渉を無視するか一律の処置確率を課す方針より資源の使用を減らせることを示した（抄録）。", "fun": "感染を広げやすい人に優先してワクチンを打てば、少ない本数で流行を抑えられる。同じように、ある子に給付すると周りの子にも良い影響が及ぶなら、誰に配るかを工夫すれば予算を節約できる。周りへの波及まで計算に入れて「誰に、どのくらいの確率で」配るかを決める点が面白い。", "unverified": "コロンビアの事例での資源の節約の大きさは抄録から確認できない。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "極値間の因果の強さを測る係数の漸近理論", "title": "Causal and conditional tail coefficients: asymptotics, inference and graph recovery", "url": "https://arxiv.org/abs/2611.18225", "authors": "Axel B\\\"ucher ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Bücher, A., & Krali, M. (2026). Causal and conditional tail coefficients: asymptotics, inference and graph recovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18225", "why": "ある変数の極端な値が別の変数に与える影響を測る因果テール係数について、順位に基づく推定量の漸近理論を非パラメトリックな条件で確立し、推論と因果グラフの復元に用いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "一方の変数の極端な値が他方に与える影響を測る因果テール係数（CTC）の順位に基づく推定量の漸近理論を確立し、因果の祖先関係の信頼グラフを作れるようにした（抄録）。", "p3": "標準的なコピュラのモデルを満たす非パラメトリックな条件のもとで、CTCが条件付きの裾の極限分布の平均で決まることを示し、CTC行列全体の同時漸近正規性と乗数ブートストラップの一致性を証明した（抄録）。", "p5": "裾の重い線形および再帰的なmax-linear構造方程式モデルでは、CTCが1になるのは第1の変数が第2の変数の祖先であるときに限ることを示し、祖先グラフの漸近的な被覆保証つきの信頼グラフを導いた。模擬と食事摂取データで例示した（抄録）。", "fun": "大雨の日に川の水位が極端に上がるように、原因が極端なら結果も極端になりやすい。この研究は、ふだんの関係ではなく「極端なとき同士」のつながりから、どちらが原因かを見分ける指標に、統計的な確からしさの幅を与えた。めったに起きないことから因果を読む点が面白い。", "unverified": "模擬の条件と、食事摂取データでの具体的な結果は抄録から確認できない。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "楽観補正後の信頼区間を推定対象ごとに分ける", "title": "Estimand-specific bootstrap confidence intervals after optimism correction for prediction models", "url": "https://arxiv.org/abs/2611.17774", "authors": "Seiya Takano ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Takano, S., Nishida, K., Emoto, R., & Matsui, S. (2026). Estimand-specific bootstrap confidence intervals after optimism correction for prediction models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17774", "why": "ブートストラップで楽観度を補正した予測モデルの性能の信頼区間が何を覆うかは推定対象次第だとして、観測標本から作った最終モデルの性能と、モデル開発を繰り返したときの平均性能を区別し、それぞれに合う区間を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "予測モデルの楽観度を補正した後の性能の信頼区間は推定対象によって正しい作り方が違うことを示し、最終モデルの性能に合う区間の作り方（入れ子の誤差ブートストラップNEB）を示した（抄録）。", "p3": "観測標本から作った最終モデルの性能と、モデル開発を繰り返したときの平均性能の2つを区別し、推定誤差の1次展開から前者の誤差に合うブートストラップの根を特定した。内側のブートストラップが不要なOEBはNEBを近似し、従来の2段階（TSB）と位置シフト（LSB）は後者の変動を再現することを示した（抄録）。", "p5": "模擬ではAUC・Brierスコア・対数損失でNEBの被覆率がTSB・LSBより名目に近かった。較正の指標ではTSBの根の1次の極限が退化し、大標本でも被覆率が大きく不足した（抄録）。", "fun": "テストの点数に「誤差の幅」をつけるとき、何についての幅なのかをはっきりさせないと、幅の計算方法も決まらない。この研究は、手元のデータで作った一つのモデルの実力と、作り方そのものの平均的な実力は別物だと区別した。同じ数字に見えても問いが違えば答え方も違う、という点が面白い。", "unverified": "模擬の設定（標本の大きさ、変数あたりのイベント数）の詳細は抄録から確認できない。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "仮想評価法と選択実験の支払意思額はいつ一致するか", "title": "When Do Contingent Valuation And Discrete Choice Experiments Converge? Evidence From A Meta-Analysis Of Environmental Valuation Studies", "url": "https://doi.org/10.2139/ssrn.7691682", "authors": "Giovanni Signorello ほか", "venue": "SSRN", "date": "2026-11-16", "apa": "Signorello, G., Ørbeck, M., & Navrud, S. (2026). When Do Contingent Valuation And Discrete Choice Experiments Converge? Evidence From A Meta-Analysis Of Environmental Valuation Studies. https://doi.org/10.2139/ssrn.7691682", "why": "40の環境評価研究の60の研究内比較を明示的な比較可能性の規則で集めたメタ分析で、選択実験（DCE）の支払意思額が仮想評価法（CV）より高い傾向と、両者が一致する条件を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "環境の価値を測る仮想評価法（CV）と選択実験（DCE）は、個々の研究が示すより近い値を出し、差は手法そのものより回答者に課す課題の形に関係することをメタ分析で示した（抄録）。", "p3": "比較可能性の4条件を満たす40研究の60の研究内比較を集め、回答者の重なり、属性や選択課題の数、効率的計画、出版年などが差を説明するかを調べた（抄録）。", "p5": "比較の60%でDCEの支払意思額が高かった（幾何平均の比1.20）が、75.0%は2倍未満、48.3%は1.5倍未満の差だった。現状と1つの変化案を比べる形のDCEで差が約3分の1小さく、誘因両立の工夫は差を縮めなかった（抄録）。", "fun": "「この湖をきれいにするのにいくら払う？」と直接聞く方法と、いくつかの案から選ばせて値段を割り出す方法は、理屈の上では同じ値になるはずである。集めて比べると思ったより近く、違いが出るのは、選ばせ方が直接聞く形から離れるときだった。質問の形が答えを変えるという点が面白い。", "unverified": "差が小さい形の結果は5研究に基づく探索的なものと著者が述べている。分析の推定量の詳細は抄録から確認できない。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "高次元固定効果の回帰をStataで高速に推定", "title": "fereg: Fast High-Dimensional Fixed-Effects Regressions in Stata", "url": "https://doi.org/10.3386/w36017", "authors": "Johannes F. Schmieder", "venue": "NBER Working Paper", "apa": "Schmieder, J. F. (2026). fereg: Fast High-Dimensional Fixed-Effects Regressions in Stata (NBER Working Paper No. 36017). National Bureau of Economic Research. https://www.nber.org/papers/w36017", "why": "多数の固定効果を含む線形回帰とポアソン疑似最尤推定を高速に行うStataのコマンドfereg・feppmlを提示した。固定効果の構造に応じて射影・Krylov・マルチグリッドの解法を選び、結果を検査してから出力する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "多数の固定効果を含む線形回帰とポアソン疑似最尤推定を高速に行うStataのコマンドfereg・feppmlを公開し、既存のコマンドより大幅に速いことを示した（抄録）。", "p3": "計算はコンパイル済みのプラグインに渡し、固定効果の構造に応じて射影・Krylov・マルチグリッドの解法を選び、結果を検査してから出力し、複数のコアで動く。交互作用の固定効果、群ごとの傾き、重み、多方向のクラスタ標準誤差などに対応する（抄録）。", "p5": "最大1,000万観測の模擬でferegはreghdfeの6〜204倍、feppmlはppmlhdfeの11〜103倍速く、fixest（R）・PyFixest（Python）より53構成すべてで速かった。労働者120万人・企業11万7,000社の行政データでも、どのコア数でも他のコマンドより3.4倍以上速かった（抄録）。", "fun": "「会社ごと」「年ごと」の違いを取り除いて分析する回帰は経済学の定番だが、データが何百万件にもなると計算に時間がかかる。このソフトは、データの形に合わせて解き方を自動で選ぶことで、既存のソフトの数倍から200倍速く計算する。研究の道具を速くすることが研究そのものを変えうる点が面白い。", "unverified": "推定値が既存のコマンドと一致することの検証の詳細は抄録から確認できない。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "大学生のAI利用と学習への影響を追うパネル調査", "title": "Impacts of AI in Higher Education: A Panel Survey of Undergraduates", "url": "https://doi.org/10.3386/w36021", "authors": "Bruce Sacerdote ほか", "venue": "NBER Working Paper", "apa": "Sacerdote, B., & Parris-Bacon, M. (2026). Impacts of AI in Higher Education: A Panel Survey of Undergraduates (NBER Working Paper No. 36021). National Bureau of Economic Research. https://www.nber.org/papers/w36021", "why": "ダートマス大学の学生、高校の最終学年の生徒、全米の大学生の標本への調査の第1波で、学習に有害な課題と有益な課題の両方でAIが広く使われ、自分より他人の不正利用を多く報告し、92%がAIの利用は文章力に有害だと考えていると報告する。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ダートマス大学の学生、高校の最終学年の生徒、全米の大学生への調査の第1波から、大学生のAIの使い方と、学習への害と利益の認識を報告した（抄録）。", "p3": "複数の標本へのパネル調査で、学習に有害・有益と考えられる課題でのAIの利用、自分と他人の不正利用、分野別の認識、将来の仕事への影響の見方を尋ねた（抄録）。", "p5": "学生は自分より他人の不正利用をずっと多く報告し、92%がAIの利用は文章力に有害だと答えた。ダートマスの回答者の84%はAIが志望分野の仕事を無くすより性質を変えると考え、価値と害の認識は分野で大きく異なった（抄録）。", "fun": "大学生の9割以上が「AIを使うと文章が下手になる」と答えながら、実際には多くがAIを使っている。しかも自分より周りの方がずるをしていると感じている。AIとの付き合い方を、使う当人たちがどう考えているかを数字にした点が面白い。", "unverified": "各標本の回答者数と回収率は抄録から確認できない。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "教師の重みを折り畳んで小さな言語モデルを作る", "title": "Folding Language Models into Themselves", "url": "https://arxiv.org/abs/2611.18113", "authors": "Ziyang Zhang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Zhang, Z., Jing, Y., Li, Y., Wang, H., & Gong, Y. (2026). Folding Language Models into Themselves (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18113", "why": "知識蒸留で生徒を一から学習するのではなく、教師の隣り合うN層を1つの共有ブロックに折り畳みN回繰り返し実行する方法（Concertina）で、教師の重みから直接生徒を作る。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "教師モデルの隣り合うN層を1つの共有ブロックに折り畳んでN回繰り返し実行する方法（Concertina）で、小さな生徒モデルを教師の重みから直接作り、少ないデータの蒸留で性能の大半を回復させた（抄録）。", "p3": "各反復に、置き換えた層から初期化した低ランクの補正を持たせ、トークンごとのゲートで補正を混ぜる。一般・数学・学術・多肢選択のデータをつり合わせた蒸留のレシピを設計した（抄録）。", "p5": "Qwen3-4Bから作った2.27Bのモデルは220億トークンの蒸留で、常識と数学の推論で教師の約90%、8つのベンチマークの平均で84%を保ち、同規模の密なモデルや層共有の比較対象、千倍以上のデータで学習したQwen3-1.7Bを上回った（抄録）。", "fun": "分厚い本を薄くするのに、一から書き直すのではなく、似たページを1枚にまとめて何度も読み返す、という発想である。大きなAIの何層かを1つにまとめて繰り返し使い、少しの補正を加えるだけで、性能の大部分が残った。作り直すより折り畳む方が安く済むという点が面白い。", "unverified": "推論の速さやメモリの削減量は抄録から確認できない。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "言語化されない直列の思考の深さを測る指標", "title": "An Operationalization of Opaque Serial Depth", "url": "https://arxiv.org/abs/2611.17495", "authors": "Nathan Sheffield ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sheffield, N., Westover, A., Finnveden, L., Pan, A., Stastny, J., & Greenblatt, R. (2026). An Operationalization of Opaque Serial Depth (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17495", "why": "思考の連鎖（CoT）による監視が将来の構造変化で効かなくなる恐れから、モデルが言語化せずに行える直列の計算量の代理指標として、不透明な直列の深さを操作的に定義した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "モデルが言葉に出さずに行える直列の計算の量の代理指標として、人が理解できる出力を介さない計算の経路の最大長（NLS深さ）を定義し、構造と訓練の設定だけから評価できるようにした（抄録）。", "p3": "事前学習で人に理解できる出力を出すよう初期化され、出力空間が広げられていないノードを自然言語に根ざすノードと定め、そこを通らない最長経路を測る。既存と提案中のアーキテクチャに当てはめ、Gemma3-1Bで深さの上限の例を示した（抄録）。", "p5": "公開重みのモデルではNLS深さは層の数と強く相関し、近年ゆっくり増えてきた。標準的なTransformerの拡大では緩やかに増えるが、潜在的な推論の構造では大きく増えうると論じた（抄録）。", "fun": "AIが考えた過程を文章（思考の連鎖）で書き出してくれる限り、人はその考えをのぞき見できる。しかし言葉にせず頭の中だけで長く考えられるようになると、監視が難しくなる。この研究は、その「言葉にしない考えの長さ」を、AIを作る前の設計図から測る物差しを提案した点が面白い。", "unverified": "モデルごとのNLS深さの具体的な数値は抄録から確認できない。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "14万件の実行記録からコーディングAIの行動を読む", "title": "Interpreting Coding Agents Through Their Behavioral Trajectories", "url": "https://arxiv.org/abs/2611.17440", "authors": "Ibragim Badertdinov ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "apa": "Badertdinov, I., & Golubev, A. (2026). Interpreting Coding Agents Through Their Behavioral Trajectories (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17440", "why": "117モデル・125構成のコーディングエージェントの実行軌跡14万3,209件を規則ベースのパーサで高水準の行動に変換して比較し、成否だけの評価では見えない振る舞いを分析した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "117モデル・125構成のコーディングエージェントの実行軌跡14万3,209件を行動の単位に変換し、成功率が同じでも探し方・直し方・確かめ方が大きく違うことを示した（抄録）。", "p3": "異なるインタフェースの生の記録を、リポジトリの検索、ファイルの編集、テストの実行などの高水準の行動に変換する規則ベースのパーサを作り、500の事象で6モデルの合意の参照と照合した（抄録）。", "p5": "課題の結果やトークン数、道具名を使わなくても、行動の集計プロファイルから別のリポジトリ・言語でどのエージェントかを当てられた。足場（scaffold）の選択と推論の量が探索・編集・テストの行動を系統的に変えた（抄録）。", "fun": "テストの点が同じ二人でも、問題の解き方はまったく違うことがある。AIのプログラマーも同じで、正解率が同じでも、よく調べてから直すAI、すぐ書き換えるAI、何度も試すAIと癖が違った。癖だけでどのAIかを当てられるほど個性があるという点が面白い。", "unverified": "パーサの照合の一致率と、個別の行動の差の大きさは抄録から確認できない。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "GPSを消しても車のCAN信号から経路を復元", "title": "CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving", "url": "https://arxiv.org/abs/2611.18442", "authors": "Yuhang Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "apa": "Wang, Y., Yang, J., Wei, C., Chen, S., Chi, H., & Zhou, H. (2026). CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18442", "why": "運転データの公開や利用ベースの保険はGPS記録を除けばプライバシーを守れるとする前提に対し、車両のCAN信号に残る情報から走行軌跡を復元できることを自然な運転データで示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "GPSを除いた車両のCAN信号（速度・操舵など）からでも走行経路を高い割合で復元できることを、大規模な自然な運転データとベンチマーク（CANTraj）で示した（抄録）。", "p3": "復号したCANの事象と時刻をそろえたGNSSの軌跡を対にしたデータ（3,940走行、454人）と評価用のベンチマーク（3,675走行、431人、1,380時間、8万5,919 km）を公開し、未見の94人の776走行で6つの既存の攻撃法を同じ条件で比べた（抄録）。", "p5": "出発点と方位が分かるとき、速度に操舵を加えると地図フィルタの5分間の経路の復元率が56%から87%に上がり、平均変位誤差の中央値は43 m（地図なしの推測航法は921 m）だった。LLMで候補経路を選ぶ方法は試験で79%を復元した（抄録）。", "fun": "車の記録から位置情報（GPS）を消せばどこを走ったかは分からない、と思われがちである。ところが、スピードとハンドルの切り方を地図と照らし合わせると、9割近い経路が分かってしまった。消したはずの情報が別のデータに残っているという、プライバシーの落とし穴を示した点が面白い。", "unverified": "出発点や方位が分からない場合の復元率の詳細は抄録の範囲でしか確認できない。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "時系列基盤モデルの汎化の源を切り分ける", "title": "FlexCast: Flexible Context Learning for Time Series Foundation Models", "url": "https://arxiv.org/abs/2611.17862", "authors": "Zuyang Shen ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Shen, Z., Gong, L., Fan, F., Wang, B., Ao, X., Wei, Y., Liu, M., Luo, C., & Zhan, J. (2026). FlexCast: Flexible Context Learning for Time Series Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17862", "why": "自己回帰型の時系列基盤モデルでは可変な文脈への条件づけと予測単位の分解が絡み合い汎化の源が分からないとして、両者を切り離した柔軟な文脈学習（FlexCast）を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "時系列の基盤モデルの強さは、左から右へ順に予測する推論ではなく、多様な文脈と予測対象の組を学ぶ柔軟な訓練から来ることを、マスク予測の枠組み（FlexCast）で切り分けて示した（抄録）。", "p3": "予測を時系列のパッチの可変長のマスク予測として定式化し、事前学習で見える文脈とマスクする対象を動的に抽出する。推論時は同じモデルで1段の予測、信頼度に基づく反復の改良、次トークン型の生成を比べた（抄録）。", "p5": "BLASTと複数のゼロショットのベンチマークで強い基盤モデルと同等以上の精度を示し、推論の遅延を大きく減らした。アブレーションでは文脈の多様性と連続した対象のマスクが性能を決め、左から右への復号は一貫した利得を生まなかった（抄録）。", "fun": "天気予報のように時系列を予測するAIは、明日、明後日と一歩ずつ順に予測するのが普通である。この研究は、順に予測すること自体が強さの理由なのか、学習のさせ方が理由なのかを切り分け、後者だと示した。当たり前と思われていた仕組みの「効いている部分」を見つけた点が面白い。", "unverified": "精度と遅延の改善の具体的な数値は抄録から確認できない。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "安定限界を超える歩幅の勾配降下法の収束理論", "title": "Classification with Large-Step Gradient Descent: Unifying Self-Stabilization and Convergence Rates", "url": "https://arxiv.org/abs/2611.17459", "authors": "Salma Tarmoun ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Tarmoun, S., MacDonald, L. E., Emmanouilidis, K., Xu, Z., & Vidal, R. (2026). Classification with Large-Step Gradient Descent: Unifying Self-Stabilization and Convergence Rates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17459", "why": "古典的な安定性の閾値を超える歩幅の勾配降下法は損失が振動しながらも速く収束し汎化もよいことが多いが理論は不完全だったとして、分類問題で自己安定化と収束の速さを統一的に説明した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "古典的な安定限界を超える大きな歩幅の勾配降下法が、分類問題でも振動しながら収束する仕組みを、自己安定化と収束の速さを統一する幾何学的な見方で説明した（抄録）。", "p3": "最小値が有限のパラメータで達成されない指数型の裾の損失（ロジスティック・交差エントロピー）について、最小値の多様体の代わりに曲率で定まる参照部分空間を見つけ、直交方向の振動が鋭さの減る方向への平行な進行で減衰する結合した力学系として解析した（抄録）。", "p5": "正則性の条件（対称なデータモデルで確認）のもとで、損失だけでなく反復の値そのものの明示的な上界を不安定と安定の両方の領域で導き、安定領域での3段階の減衰の構造と、大きな歩幅が生む一時的な暗黙のバイアスを示した（抄録）。", "fun": "坂道を大股で駆け下りると、左右に揺れながらもかえって速く谷底に着くことがある。AIの学習でも、教科書的には大きすぎる歩幅で進んだ方が速く良い答えに着くことが知られていた。この研究は、揺れが前進とともに自然に収まる仕組みを、正解が無限の彼方にある分類問題でも説明した点が面白い。", "unverified": "一時的な暗黙のバイアスの内容の詳細は抄録の途中までしか確認できない。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "AIによる査読は付録の内容に偏る", "title": "AI Reviews Are Biased Towards the Appendix", "url": "https://arxiv.org/abs/2611.17811", "authors": "Saptarshi Ghosh ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "apa": "Ghosh, S., Saim, M., & Jiang, T. (2026). AI Reviews Are Biased Towards the Appendix (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17811", "why": "査読者がLLMで論文の弱点を洗い出すことが増え、その出力が人の査読に影響するなかで、LLMの査読が論文の付録の内容に偏ることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMに論文の査読をさせると、指摘する弱点の約半分以上を付録から取り、人の査読者（8.4%）と大きく違うことを示した（抄録）。", "p3": "ACL・EMNLP・COLM・ICLRの2,000本の論文で、最新のGPTとClaudeのモデルにAPI、コーディングエージェント、Webの3つの使い方で査読させ、弱点の出どころを人の査読と比べた（抄録）。", "p5": "モデルは弱点の約50%以上を付録から引き、使い方によらずこの傾向は同じだった。人の弱点は主に書き方と中核のアイデアに関するもので、LLMは付録の奥の、貢献の中心でない細かな技術的点を指摘した（抄録）。", "fun": "論文の査読者は、本文の主張が正しいかを中心に読むのが普通である。ところがAIに査読させると、指摘の半分以上が巻末の付録の細かい点から出てきた。AIは「重要なところ」より「細かく書いてあるところ」に食いつくのかもしれない、という癖が見えた点が面白い。", "unverified": "使ったモデルの名前と版、弱点の分類の方法は抄録から確認できない。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "アルゴリズムの不透明さを依頼人-代理人問題で分析", "title": "Algorithmic Opacity as a Principal-Agent Problem", "url": "https://arxiv.org/abs/2611.17980", "authors": "Ignacio Cofone ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Cofone, I., & Strandburg, K. J. (2026). Algorithmic Opacity as a Principal-Agent Problem (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17980", "why": "悪用の防止や企業秘密を理由とするアルゴリズムの不透明さが、社会的な利益より私的利益を優先する意思決定者の戦略的な行動を隠しうるとして、依頼人-代理人の問題として定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "悪用防止や企業秘密を理由とするアルゴリズムの不透明さが意思決定者の私的な利益を隠しうるとして、どんなときに開示を義務づけるべきかを依頼人-代理人の枠組みで判定する検査を提案した（抄録）。", "p3": "悪用や秘密の漏えいを招かずに開示できる2つの診断量、誤りのプロファイル（全体と群ごとの偽陽性率・偽陰性率）と群ごとの決定の分布を使い、大きな群間差や誤りの非対称があれば追加の開示を推定する（反証可能な推定）規則を示した（抄録）。", "p5": "正解の誤り率が分からなくても群ごとの決定の分布で同じ推定ができ、誤りのプロファイルを出せないこと自体が診断になると論じた。段階的・部分的などの開示制度を考えると、正当化できる不透明さの範囲は通常考えられるより狭いと結論する（抄録）。", "fun": "「仕組みを公開すると悪用されるから秘密にする」という言い分は、ときに都合の悪いことを隠す口実にもなる。この研究は、仕組みそのものではなく「どの集団でどれだけ間違えたか」だけを公開させれば、悪用を防ぎつつ公平さを確かめられると提案した。隠す理由と見せる方法を両立させる発想が面白い。", "unverified": "実際の事例への適用の有無は抄録から確認できない。"}}, {"id": "pn40", "rank": 40, "field": "経営学", "headline": "共有のAI計算基盤の市場設計と投資の誘因", "title": "Market Design for Shared AI Infrastructure: Investment Incentives, Allocation, and Competition", "url": "https://doi.org/10.2139/ssrn.7691321", "authors": "Donghyun Lee", "venue": "SSRN", "date": "2026-11-16", "apa": "Lee, D. (2026). Market Design for Shared AI Infrastructure: Investment Incentives, Allocation, and Competition. https://doi.org/10.2139/ssrn.7691321", "why": "異なるAI計算資源を中立的な連合で共有する制度が、独自の基盤や既存のクラウド市場より厚生を改善する条件を、投資の誘因・配分・競争の観点から分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "異なるAI計算資源を中立的な連合で共有する制度が、独自の基盤や商用クラウド市場より厚生を改善する条件と、その利得が失われる条件を一連のモデルで示した（抄録）。", "p3": "残余の所有権、契約上のサービスの権利、運用の管理を分ける制度を考え、技術の波及を伴う設備投資、信頼性のプール、制約つきの配分、誘因両立の入札、固定費の回収、連合の安定、統治、利用の内生的な広がり、電力市場のリバウンドをモデル化した（抄録）。", "p5": "連合は重複した予備の設備を減らしうる一方で総投資と電力使用を増やしうること、効率的な配分が正直な申告・自己資金での運営・安定した制度を意味しないことを示し、評価のための実証の設計を示した（抄録）。", "fun": "AIを動かす大型コンピュータを、会社ごとに持つのではなく皆で持ち寄って共有すれば無駄が減りそうである。しかしこの研究は、共有で安くなると利用が増えて電気をかえって多く使うかもしれないなど、いい話ばかりではない条件も整理した。共有の得と落とし穴を同時に考える点が面白い。", "unverified": "実証分析は行われておらず、計算例は仮想的なものと抄録に記されている。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "既存の記録からコンテンツ審査の品質を検証", "title": "Accounting for Trust and Safety: Bounding Content-Moderation Quality from Records You Already Hold", "url": "https://arxiv.org/abs/2611.18437", "authors": "Aayush Agarwal ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Agarwal, A., Sohi, D. V. S., & Cornelison, L. (2026). Accounting for Trust and Safety: Bounding Content-Moderation Quality from Records You Already Hold (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18437", "why": "プラットフォームが専門家の監査で示すコンテンツ審査の品質を、異議申し立てによる取り消しなど既に持っている記録から形式的に検証する方法（品質の上下限）を開発した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "プラットフォームが専門家の監査で示すコンテンツ審査の品質の主張を、異議申し立てによる取り消しや確認済みの通報など既存の記録から形式的に検査する方法を示した（抄録）。", "p3": "既存の記録が与える片側の限界（品質の目標が満たされなかったことは示せるが、満たされたことは証明できない）の理論、限界、構成した例、将来の評価の手順を示した（抄録）。", "p5": "Metaの運用データの分析、実験、本番の結果は報告していない（抄録）。", "fun": "「審査の正確さは99%です」という会社の主張を、外の人が確かめるのは難しい。この研究は、会社がすでに持っている「異議が認められて判定が覆った件数」などの記録から、少なくとも主張が外れていることは証明できると示した。証明できることと、できないことをはっきり分けた点が面白い。", "unverified": "実データでの検証はなく、方法の有効性は未確認。"}}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "共分散のクロネッカー近似で逆問題を効率よく解く", "title": "Kronecker Approximations of Covariance Matrices for Solving Inverse Problems", "url": "https://arxiv.org/abs/2611.18309", "authors": "Srijon Sarkar ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sarkar, S., & Chung, J. (2026). Kronecker Approximations of Covariance Matrices for Solving Inverse Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18309", "why": "不良設定な逆問題の正則化で未知パラメータの事前共分散を使う際に、共分散行列をクロネッカー積で近似して計算を効率化する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ベイズ的な逆問題で計算の妨げになる大きな事前共分散行列を、クロネッカー・テプリッツ積で近似し、保存と逆行列の計算を桁違いに安くした（抄録）。", "p3": "共分散カーネルが生むブロック・テプリッツ・テプリッツ・ブロックの構造を利用して小さな近似を作り、一般化ハイブリッド反復法で解くベイズ的な逆問題の事前共分散の代わりに使った（抄録）。", "p5": "既存の行列近似より相対的な近似誤差が小さく、ランクとともに誤差が速く減り、行列とベクトルの積を効率よく計算できた。2次元の地震波トモグラフィーの再構成に適用して実用性を示した（抄録）。", "fun": "地下の様子を地震波から推定するような「結果から原因を当てる」問題では、未知の量どうしの関係を表す巨大な表（共分散行列）が計算の重荷になる。この研究は、その表に隠れた規則的な模様を利用して、小さな表の掛け算で近似した。データの形の規則性を計算の近道に変える点が面白い。", "unverified": "近似誤差と計算時間の具体的な数値は抄録から確認できない。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "改良地盤の剛性のばらつきが土留め壁の変位を左右", "title": "Effect of Spatial Stiffness Variability in CDM-Improved Ground on Retaining Wall Displacement", "url": "https://doi.org/10.21203/rs.3.rs-11611472/v1", "authors": "Trong Nghia Le ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Le, T. N., Nguyen, K. T. D., Nguyen, H. H., Nguyen, M. T., & Nguyen, T. K. (2026). Effect of Spatial Stiffness Variability in CDM-Improved Ground on Retaining Wall Displacement. https://doi.org/10.21203/rs.3.rs-11611472/v1", "why": "ホーチミン市の軟弱地盤の掘削で、セメント深層混合で改良した地盤の剛性の空間的なばらつきが土留め壁の変位に与える影響を、傾斜計の計測で較正した2次元有限要素モデルで調べた。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "セメント深層混合（CDM）で改良した地盤の剛性の空間的なばらつきは、土留め壁の変位の平均より散らばりに強く効くことを、ホーチミン市の掘削の確率論的な解析で示した（抄録）。", "p3": "傾斜計の計測で較正した2次元有限要素モデルで、65本の改良柱の578試料（E50の平均956.61 MPa、変動係数0.53）に基づく対数正規の剛性場をスペクトル表現で生成し、基準300回と6つの条件各50回の解析を行った（抄録）。", "p5": "基準の変位は8.5〜8.6 mmと9.5〜9.6 mmの2つの集まりを作った。変動係数を0.1から0.3にすると変位の標準偏差は0.085 mmから0.26 mmに増えたが平均はほぼ変わらず、計測値8.84 mmを超える確率は基準で約44%だった（抄録）。", "fun": "地盤を固める工事をしても、固まり具合は場所ごとにむらがある。この研究は、むらを確率で表して何百回も計算し、むらは壁の動きの「平均」より「ばらつき」を大きくすると示した。平均だけ見て安心してはいけないという、不確かさを扱う設計の基本がよく分かる点が面白い。", "unverified": "2つの集まりができた原因の説明は抄録から確認できない。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "ミラノ近郊の深い地盤構造を探査し地震応答を評価", "title": "Deep Active and Passive Geophysical Investigation at the Vettabbia Site (Milan, Italy) and Implications for Site-Specific Earthquake Ground Response Analysis", "url": "https://doi.org/10.20944/preprints202611.1505.v1", "authors": "Sara Lovati ほか", "venue": "Preprints.org", "date": "2026-11-16", "apa": "Lovati, S., Maraio, S., Puglia, R., Maesano, F., Brunelli, G., Ferrari, E., Varchetta, F., Villani, F., Rizzo, A. L., Luzi, L., & Massa, M. (2026). Deep Active and Passive Geophysical Investigation at the Vettabbia Site (Milan, Italy) and Implications for Site-Specific Earthquake Ground Response Analysis. https://doi.org/10.20944/preprints202611.1505.v1", "why": "ミラノ南東の地点で地質データ、単点と2次元の受動的な計測、高品質の深部反射法の断面から新しい地震層序モデルを作り、深い沖積層での地点固有の地震応答の解析に生かした。", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ミラノ南東のVettabbia地点で、受動的な計測と高分解能の反射法探査を組み合わせ、深さ約1 km以上までのせん断波速度（Vs）の断面と地点固有の地震応答を求めた（抄録）。", "p3": "2023年に4.5 Hzの受振器240個で1.5 kmの反射法の断面を取得し、P波速度と不連続面の深さを既存の研究の制約と合わせて、レイリー波の分散曲線と楕円率曲線の同時逆解析を行い、1次元の等価線形モデルでイタリアの建築基準の参照スペクトルの入力に対する応答を計算した（抄録）。", "p5": "1〜4 Hzに明瞭な共振のピークが現れ、既存の地震の水平・上下スペクトル比と一致し、1 Hz未満では滑らかな増幅となった（抄録）。", "fun": "同じ地震でも、地面の下にやわらかい土が厚く積もっている場所ほど揺れが大きく増幅される。この研究は、地面をたたいて跳ね返る波と、ふだんの微小な揺れの両方を使って、ミラノの地下1 kmより深くまでの構造を描いた。見えない地下の層の重なりが、地上の揺れ方を決めることを示した点が面白い。", "unverified": "増幅率の具体的な数値は抄録から確認できない。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "2.5D実装のはんだ接合のランダム振動応力を最適化", "title": "Stress Analysis and Optimization of Ball Grid Array Solder Joints in 2.5D Packaging under Random Vibration Loading", "url": "https://doi.org/10.21203/rs.3.rs-11033973/v1", "authors": "Jinmei Yang ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Yang, J., Huang, C., Liang, Y., Wang, G., & Lu, Y. (2026). Stress Analysis and Optimization of Ball Grid Array Solder Joints in 2.5D Packaging under Random Vibration Loading. https://doi.org/10.21203/rs.3.rs-11033973/v1", "why": "2.5D実装のボールグリッドアレイのはんだ接合を有限要素モデルにし、ランダム振動下の応力を解析してひずみの測定台で検証したうえで、構造の最適化を行った。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2.5D実装のボールグリッドアレイ（BGA）のはんだ接合のランダム振動下の応力を有限要素法で解析・検証し、接合の高さと中間基板の厚さの最適な組み合わせを求めた（抄録）。", "p3": "ひずみの測定台で解析の精度を確かめ、上下のはんだ接合の高さと中間基板の厚さを要因とする16試行の直交表（田口法）で最大応力を求め、範囲分析・分散分析とグレイ関連の2目的最適化を行った（抄録）。", "p5": "上側の接合の最大応力には上側の接合の高さ、下側には中間基板の厚さが最も効いた。最適な組み合わせは上側0.24 mm、下側0.38 mm、中間基板0.1 mmだった（抄録）。", "fun": "スマートフォンなどの電子部品は、小さなはんだの玉で基板とつながっている。乗り物の振動などで揺さぶられると、その玉に力がかかり、少しずつ傷んでいく。この研究は、玉の高さや板の厚さを少し変えるだけで、どの玉にかかる力が減るかを計算と実験で調べた。ミリ以下の寸法が壊れにくさを決める点が面白い。", "unverified": "最適化による応力の低減率と、疲労寿命への効果は抄録から確認できない。"}}, {"id": "pn46", "rank": 46, "field": "ヒューマンコンピュータインタラクション", "headline": "UIを文脈の射影として作るエージェントの設計", "title": "Everything is an Operational View: UI as a Projection over Context in Agentic Systems", "url": "https://arxiv.org/abs/2611.17355", "authors": "Jieshan Chen ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Chen, J., Mao, R., Xu, X., Gu, X., Li, Y., & Xing, Z. (2026). Everything is an Operational View: UI as a Projection over Context in Agentic Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17355", "why": "生成的UIが要求と応答の流れで文脈を分断し透明性と制御を損なうとして、データ・能力・相互作用をエージェント用のファイルシステムで整理し、UIをその上の射影として構成するAFS-UIを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "生成的UIを、データ・能力・対話の状態をまとめたエージェント用のファイルシステムの上の「射影」として捉え直す枠組み（AFS-UI）を提案した（抄録）。", "p3": "要求と応答の流れで文脈が分断される既存の方法に対し、資源の発見しにくさ、操作の意味の不整合、射影と文脈の絡み合い、資源の組み合わせと置き換えの硬さ、発展のしにくさに対処する共通の操作面を設計した（抄録）。", "p5": "インタフェースを共有資源の上の動的で検査できる見え方とし、人とエージェントの両方が同じ操作面で関われるようにした。定量的な評価は抄録に記載がない（抄録）。", "fun": "AIがその場で画面を作ってくれる時代には、画面ごとに情報がばらばらになりがちである。この研究は、すべての情報を一つの共有の「書類棚」にまとめ、画面はその棚の一部をのぞく窓にすぎない、と考え直した。画面を作る対象から、のぞき方の一つへと見方を変える発想が面白い。", "unverified": "実装の評価（利用者実験など）の有無と結果は抄録から確認できない。"}}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "EU AI法を技術要件に落とす参加型ワークショップ", "title": "Between Obligations and Evidence: A Participatory Study of Translating the EU AI Act into Technical Requirements", "url": "https://arxiv.org/abs/2611.18439", "authors": "Helma Torkamaan ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Torkamaan, H., Mansoury, M., Xin, Y., Trespalacios, O. O., Savella, R., Zwitter, A., Heuss, M., Nguyen, H. S., Sekwenz, M.-T., Li, M., Tamponi, R., & Khosla, M. (2026). Between Obligations and Evidence: A Participatory Study of Translating the EU AI Act into Technical Requirements (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18439", "why": "高リスクAIへのEU AI法の要求を技術要件に翻訳する際の、何を測りどんな証拠が適合を支えるかという選択を、研究者・政策担当者・実務家32人の参加型ワークショップで医療・採用などの場面を使って調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "EU AI法の高リスクAIへの要求を技術的な要件に翻訳する際の緊張関係を、研究者・政策担当者・実務家32人の参加型ワークショップで明らかにした（抄録）。", "p3": "医療・採用・公共交通の現実的な場面を使い、規制上の義務の解釈、技術要件への翻訳、実務での評価を議論してもらい、記録を主題分析した（抄録）。", "p5": "公平性の指標が採用での差別を隠しうること、時間の制約と情報不足が公共交通での人による監督を損ないうること、患者集団の変化が性能の証拠を無効にしうることなどを挙げ、技術・組織・証拠の課題が相互に依存すると結論した（抄録）。", "fun": "法律に「AIは公平でなければならない」と書いても、何をどう測れば公平と言えるかは書いていない。この研究は、病院や採用、交通の具体的な場面で専門家たちに考えてもらい、測り方の選び方次第で差別がかえって見えなくなる危険を見つけた。決まりを作ることと守ることの間の溝を描いた点が面白い。", "unverified": "参加者の内訳と分析の手順の詳細は抄録から確認できない。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "人が従わない推薦を差分プライバシーのもとで学ぶ", "title": "Learning Recommendations under Imperfect Human Compliance with Record-Level Differential Privacy", "url": "https://arxiv.org/abs/2611.17490", "authors": "Yuwen Ma ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Ma, Y., Bastianello, N., Spurgeon, S., & Chen, B. (2026). Learning Recommendations under Imperfect Human Compliance with Record-Level Differential Privacy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17490", "why": "推薦の効果が人の遵守に依存し、プライバシーのため過去の反応データを使いにくい状況で、実施された行動を推薦への確率的な反応としてモデル化し、遵守の分布が未知のもとでの決定依存の最適化として推薦の仕組みを定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "人が推薦に従うとは限らず、過去の反応データの利用がプライバシーで制限される状況で、記録単位の差分プライバシーを守りながら推薦を学習するアルゴリズムと、その性能の保証を示した（抄録）。", "p3": "実施された行動を推薦への確率的な反応としてモデル化し、遵守の分布が未知の決定依存の最適化として定式化し、局所的にノイズを加えた過去の行動から学ぶバッチ型のガウス過程UCBを用いた（抄録）。", "p5": "記録単位の差分プライバシーと、遵守の分布が未知の場合の高確率の単純後悔の上界を導いた。非遵守率の上限が分かれば私的なデータを使う前に推薦の候補を絞れる。合成の運転者の反応による追従走行の模擬で理論を確かめた（抄録）。", "fun": "カーナビが「ここで減速して」と勧めても、運転者が従うとは限らない。しかも過去の運転記録はプライバシーのため少しぼかして使う必要がある。この研究は、人が言うことを聞かないことと、記録がぼやけていることの両方を前提に、それでも良い推薦を学べる保証を示した点が面白い。", "unverified": "実際の運転者のデータでの検証はなく、模擬の詳細な数値は抄録から確認できない。"}}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "AIの記憶規則は1組のプレビューでは確かめにくい", "title": "What a Memory Preview Cannot Tell You: Ambiguity in AI Memory Permissions", "url": "https://arxiv.org/abs/2611.17874", "authors": "Sadia Noman Tonni ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Tonni, S. N., & Shahid, N. F. (2026). What a Memory Preview Cannot Tell You: Ambiguity in AI Memory Permissions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17874", "why": "アシスタントが記憶した出来事を再利用してよい条件を定める規則を、許可と拒否の1例ずつのプレビューで確認する方法について、規則の候補を列挙し、プレビューから利用者が規則をどこまで推測できるかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIアシスタントの記憶の利用規則を、許可と拒否の1例ずつのプレビューで確認するやり方では、利用者は規則を正しく推測できないことを、規則の列挙と小さな予備実験で示した（抄録）。", "p3": "6または12の妥当な規則を持つ編集画面で、プレビューと両立するすべての規則を列挙し、適応的な検査や他の課題への転用の検査がどれだけ規則を絞れるかを数えた（抄録）。", "p5": "意図した規則のもとで39通りの許可・拒否の組のうち36組は、どの規則も許さない拒否の例を含み、規則を特定できる組はなかった。予備実験では弱いプレビューを見た20人中10人が2つの用途の少なくとも1つを誤って予測するか確信がなかった（抄録）。", "fun": "AIに「この思い出は仕事の相談には使わないで」と頼み、確認画面で例を一つずつ見せられて安心したとする。ところがこの研究は、例を一組見ただけでは、どんな決まりが保存されたのか実はほとんど分からないことを数え上げで示した。確認したつもりが確認になっていない、という落とし穴が面白い。", "unverified": "よりよいプレビューが人の理解を助けるかは未検証と著者が述べている。"}}, {"id": "pn50", "rank": 50, "field": "ヒューマンコンピュータインタラクション", "headline": "ロボットの人物像と相づちで模擬面接の緊張を緩和", "title": "Alleviating Interview Stress: Effects of Robot Persona and Reactive Backchanneling on High-Pressure Mock Interviews", "url": "https://arxiv.org/abs/2611.17830", "authors": "Haochen Yang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Yang, H., Gao, Z., Tao, G., Dong, Y., & Rau, P.-L. P. (2026). Alleviating Interview Stress: Effects of Robot Persona and Reactive Backchanneling on High-Pressure Mock Interviews (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17830", "why": "高圧的な模擬面接で、ロボットのペルソナと反応的な相づちが面接を受ける人の不安と成績にどう影響するかを実験で調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "模擬面接のロボット面接官の話し方の性格（支援的か挑戦的か）と相づち（積極的か否定的か）が、受験者の心理状態と表情に与える影響を実験で調べた（抄録）。", "p3": "2×2の参加者間実験（28人）でNAOロボットと面接を行い、状態不安・自己効力感・社会的存在感の主観的な尺度と、表情の感情認識による客観的な指標を集めた（抄録）。", "p5": "支援的な人物像は課題の負荷を下げ、ロボットの温かさと心の知覚を高め、監視されている感覚と不快感を下げた。積極的な相づちは中立でない表情（p = .021）と不安・緊張の表情（p = .048）を増やし、社会的存在感に交互作用があった（p = .045）。主観と客観の一致は67.9%だった（抄録）。", "fun": "就職の面接練習をロボットとするとき、ロボットが優しく話すか厳しく話すか、うなずき方をどうするかで、緊張の度合いが変わるかを調べた。優しい話し方は気持ちを楽にしたが、熱心なうなずきはかえって緊張の表情を増やした。良かれと思った反応が逆効果になりうる点が面白い。", "unverified": "参加者は28人と少なく、効果の大きさの数値は抄録から一部しか確認できない。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "AIによる申込の拒否は人より不満を招く", "title": "When AI Says No: AI-Driven Service Rejection and Its Impact on Customer Satisfaction", "url": "https://doi.org/10.1177/10946705261502655", "authors": "Panagiotis Sarantopoulos ほか", "venue": "Journal of Service Research", "date": "2026-11-16", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Sarantopoulos, P., Liu, N., Kim, S., & He, H. (2026). When AI Says No: AI-Driven Service Rejection and Its Impact on Customer Satisfaction. Journal of Service Research. https://doi.org/10.1177/10946705261502655", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "申込などを断る（サービスの拒否）のがAIの担当者だと、人の担当者が断るより顧客の満足が下がり、その原因はAIの判断能力が低いと見なされて責任を強く帰属されることだと示し、「なぜ断ったか」という目的の説明がこの反応を和らげることを示した（抄録）。", "p2": "サービスの拒否はサービス業で日常的に起きるが、AIがサービスの提供に組み込まれるなかで、AIによる拒否が人による拒否と比べて顧客満足にどう影響するかは分かっていなかった（抄録）。", "p3": "AIの担当者と人の担当者が顧客の申込を拒否する状況を比べ、拒否への責任の帰属と、判断能力の知覚を媒介として調べた。さらに説明の種類として、拒否が起きた理由を明らかにする目的論的な説明、拒否がどう決まったかを明らかにする機械論的な説明、説明なしを比べた（抄録）。", "p4": "比較の基準は人による拒否と説明なしの条件で、評価は顧客満足（抄録）。研究の数や参加者の数は抄録から分からない。", "p5": "顧客は一般に、人よりAIに拒否されたときに満足が低かった。これは顧客がAIの担当者により大きな責任を帰属し、その判断能力を低く知覚するためだった。目的論的な説明は、機械論的な説明や説明なしに比べて否定的な反応を効果的に和らげた（抄録）。", "p6": "解釈：抄録からは、実験が仮想の場面かどうか、拒否の種類（融資・保険など）、効果の大きさは分からない。説明の効果が繰り返しの利用や実際の取引でも続くかは確かめる必要がある。", "fun": "ローンの審査で「お断りします」と言われるとき、相手が人かAIかで気持ちが変わるだろうか。この研究では、AIに断られた方が不満が大きかった。人はAIを「判断が下手なのに偉そうに決める」と感じやすいらしい。ただし「なぜ断ったのか」を説明されると不満が和らいだ。仕組みより理由を知りたい、という人の心理が面白い。", "unverified": "本文を読めておらず、研究の数・参加者数・効果の大きさ・場面の設定は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "橋の舗装維持管理に特化したLLMを規準類で調整", "title": "Bridge-RoadLM: Building a Domain-Adapted Large Language Model for Bridge Pavement Maintenance Based on Authoritative Specification Corpora and Efficient Parameter Fine-Tuning", "url": "https://doi.org/10.1061/jpcfev.cfeng-5649", "authors": "Yutao Zhu ほか", "venue": "Journal of Performance of Constructed Facilities", "date": "2026-11-16", "sjr": 0.509, "citescore": 4.3, "citescore_year": "2025", "apa": "Zhu, Y., Wang, J., Zhang, L., Liu, Z., & Xu, Y. (2027). Bridge-RoadLM: Building a Domain-Adapted Large Language Model for Bridge Pavement Maintenance Based on Authoritative Specification Corpora and Efficient Parameter Fine-Tuning. Journal of Performance of Constructed Facilities, 41(1). https://doi.org/10.1061/jpcfev.cfeng-5649", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "規準や技術文書から作った1万件の指示データで、手元で動かせる複数のLLMを効率よく微調整し、橋梁の舗装の維持管理の予備的な判断支援に使える専門化したLLM（Bridge-RoadLM）と、その評価の手順を作った（抄録）。", "p2": "汎用のLLMは橋梁の舗装の維持管理のような専門的な課題では信頼性が限られていた（抄録）。", "p3": "権威ある規準と技術文書から自動のデータ処理でBridge-Road Corpus（指示に従う形式の1万サンプル）を作り、Qwen・DeepSeek・LLaMA・Gemmaの代表的なモデルをLoRA（少数のパラメータだけを学習する方法）で微調整した（抄録）。", "p4": "評価は、自動の言語指標、専門家が検証した500問の試験問題、点検報告書の形式の自由回答を、経験10〜17年の技術者6人が匿名で、正しさ・網羅性・根拠の追跡可能性・幻覚の抑制・安全性の5基準で採点する盲検評価の3段階（抄録）。", "p5": "いくつかの微調整モデルで性能が上がり、最大の改善はQwen3-8Bで、舗装の欠陥診断の正答率が45.0%から81.0%（95% Wilson区間は35.6〜54.8%と72.2〜87.5%）、橋梁の監視と維持管理は25.0%から75.0%（17.5〜34.3%と65.7〜82.5%）に上がった。盲検評価でもQwen3-8Bが9モデル中で最高の平均点だった（抄録）。", "p6": "微調整の効果はモデルの系統によって異なり、専門分野のPEFTがすべてのLLMを一様に改善するわけではないと著者が述べる（抄録）。用途は人が介在する前提の規準の参照、欠陥の解釈、維持管理計画の下書きに限られる（抄録）。", "fun": "橋の舗装の傷みを判断するには、分厚い基準書の知識が要る。普通のAIに聞くと半分も正解しなかったが、基準書から作った1万問の練習帳で鍛えると、欠陥の診断の正答率が45%から81%に上がった。さらにベテラン技術者6人が名前を伏せて答えを採点した。現場で使う前に、専門家の目で確かめる手順まで作った点が面白い。", "unverified": "本文を読めておらず、試験問題の作り方、他のモデルの数値、幻覚の評価の詳細は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "鉄道カルバートの剛性急変部の動的挙動を総説", "title": "Dynamics of Railway Culverts and Transition Zones Under Moving Trains: A Literature Review", "url": "https://doi.org/10.3390/sym18111910", "authors": "Yingjie Wang ほか", "venue": "Symmetry", "date": "2026-11-16", "sjr": 0.424, "citescore": 5.2, "citescore_year": "2025", "apa": "Wang, Y., Njuguna, K. K., & Yau, J.-D. (2026). Dynamics of Railway Culverts and Transition Zones Under Moving Trains: A Literature Review. Symmetry, 18(11), 1910. https://doi.org/10.3390/sym18111910", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は取得できず未読", "preprint": false, "p1": "鉄道のカルバート（線路の下を通る水路などの構造物）とその前後の取付部（遷移区間）の動的挙動を、列車-軌道-地盤-構造物の相互作用（TTSSI）での剛性の不連続による「対称性の崩れ」という視点から総説し、デジタルツインの枠組みを提案した（抄録）。", "p2": "カルバートの遷移区間では構造物と地盤の剛性が急に変わり、荷重の伝達が乱れて動的増幅、不同沈下、振動の集中、軌道の劣化が進む。遷移区間の研究は多いが、対称性の視点からの体系的な整理はなかった（抄録）。", "p3": "2000〜2026年に発表された、カルバートの動力学、遷移区間の設計、TTSSIの仕組み、数値モデル、現地モニタリング、国際的な設計基準、デジタルツインの研究を批判的に検討し、簡易な解析式から3次元の完全連成モデルまでの数値手法を実験・現地観測と比べて評価した（抄録）。", "p4": "総説であり、新しいデータによる検証はない（抄録）。", "p5": "遷移区間の動的挙動は、盛土と埋設構造物の間の力学的な対称性を崩す剛性の不連続に根本的に支配されると結論した。課題として、地盤の非線形性、水と土の連成、レジリエンスの定量化、長期の現地検証を挙げ、計測・データ同化・物理シミュレーション・予知保全を統合するシステム指向のデジタルツインの枠組みを提案した（抄録）。", "p6": "提案したデジタルツインの枠組みは概念的なもので、実装と検証は今後の課題とされる（抄録）。解釈：レビューの対象文献の数と選定の手順は抄録から分からない。", "fun": "線路の下に水路のトンネルがあると、そこだけ地面の固さが急に変わる。固い所と柔らかい所の境目を列車が通ると、揺れが大きくなったり、線路が少しずつ沈んだりする。この総説は、その問題を「左右（前後）のつり合いが崩れること」として整理した。段差のない道でも固さの段差が乗り物を揺らす、という見方が面白い。", "unverified": "本文を読めておらず、取り上げた個別の研究、数値手法の比較の結論の詳細は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "生成AIの統治の成熟は承認利用と隠れ利用を分ける", "title": "GenAI governance maturity and divergent use pathways at work: sanctioned assimilation depth and shadow use", "url": "https://doi.org/10.1108/itp-03-2026-0549", "authors": "Stanley Y. B. Huang", "venue": "Information Technology and People", "date": "2026-11-16", "sjr": 1.956, "citescore": 15.5, "citescore_year": "2025", "apa": "Huang, S. Y. B. (2026). GenAI governance maturity and divergent use pathways at work: sanctioned assimilation depth and shadow use. Information Technology & People, 1–15. https://doi.org/10.1108/itp-03-2026-0549", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "従業員が感じる生成AIの社内統治（ガバナンス）の成熟度が、会社が承認した生成AIの深い利用（業績につながる）と、許可されていない公開ツールの「隠れた利用」（創造性につながる）を別々の経路で左右することを示した（抄録）。", "p2": "データを扱う職場では、会社が承認した生成AIの利用と、従業員が勝手に公開ツールを使う隠れた利用（シャドーAI）が並存するが、統治の取り組みが両者にどう関わるかは分かっていなかった（抄録）。", "p3": "台湾の知識労働者750人の2時点の調査をPLS-SEMで分析し、規制の圧力と社内指針の目立ちやすさ→統治の成熟度→安全に使える雰囲気とデータ漏えいリスクの知覚→承認利用の深さ・隠れた利用→業務の成果・創造性の経路を検証した。同時点の測定、統制変数、業種、承認利用から隠れた利用への別経路の追加の検討も行った（抄録）。", "p4": "評価は構造方程式モデルの経路係数の有意性で、比較の基準となる対照群はない（抄録）。", "p5": "規制の圧力と社内指針の目立ちやすさは統治の成熟度と正に関連し、成熟度は安全に使える雰囲気とデータ漏えいリスクの知覚の両方と正に関連した。安全に使える雰囲気は承認利用の深さと業務の成果に、リスクの知覚は隠れた利用の少なさに結びつき、隠れた利用は創造性と正に関連した（抄録）。著者は、承認利用と隠れた利用は1本の連続体の両端ではなく別の利用の様式だとする（抄録）。", "p6": "解釈：観察研究で因果の向きは確定せず、自己報告の隠れた利用は過少に報告されうる。台湾の知識労働者以外への一般化も確かめる必要がある。", "fun": "会社が生成AIの使い方のルールを整えると、社員は会社公認のAIを安心して使い込み、仕事の成果が上がる。一方で、こっそり外のAIを使う人は減るが、その「こっそり使い」は実は新しい発想を生んでいた。ルールが安全と引き換えに冒険を減らすかもしれない、という緊張関係を示した点が面白い。", "unverified": "本文を読めておらず、経路係数の大きさ、尺度の項目、2時点の間隔は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "人1人とLLM4体の議論で造語は一体感を高めず", "title": "Proposed new words and collective identity in human and language model agent groups", "url": "https://doi.org/10.1038/s41598-026-80001-6", "authors": "Kazuhiro Ito ほか", "venue": "Scientific Reports", "date": "2026-11-16", "sjr": 0.893, "citescore": 6.4, "citescore_year": "2025", "apa": "Ito, K., Nagai, H., Wakamiya, S., & Aramaki, E. (2026). Proposed new words and collective identity in human and language model agent groups. Scientific Reports. https://doi.org/10.1038/s41598-026-80001-6", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文はオープンアクセスだが取得できず未読", "preprint": false, "p1": "日本人の参加者1人と、LLMであることを明かした4体のエージェントからなる一時的な集団で、エージェントが新しい言葉（造語）を提案しても、集団へのアイデンティティの変化は有意に変わらなかったことを、多重比較の補正を含めて慎重に報告した（抄録）。", "p2": "集団はふつうの表現で足りるのに独自の言葉を作り、その言葉は集団のアイデンティティの象徴になりうる。観察研究は言葉の使い方と共同体への愛着を結びつけてきたが、人とLLMの混成集団で造語の提案がアイデンティティを変えるかは調べられていなかった（抄録）。", "p3": "日本人100人を2つの募集の波で集め、第1波でだけエージェントが新語を提案し、両波の議論の前後で集団アイデンティティの変化を比べた。提案の波の中で、提案語への好意的な評価とアイデンティティの変化の関連、波・発言数・チームの印象の3要因の交互作用も調べた（抄録）。", "p4": "主な比較は波の間の平均的なアイデンティティの変化で、探索的な関連は多重比較の補正後のp値で判断した（抄録）。", "p5": "集団アイデンティティの変化の平均は波の間で有意に異ならなかった。提案の波では、提案語への好意的な評価とアイデンティティの変化に関連が見られたが補正後は有意でなかった（補正後p=0.229）。3要因の交互作用は名目上p=0.027だったが補正後は有意でなく（p=0.082）、中間時点のアイデンティティで調整した感度分析でも有意でなかった（抄録）。", "p6": "波の間の比較は募集の時期と交絡しており、評価は議論の後に行われたため因果の推論に限界があると著者が認め、反復測定のある無作為化研究の必要を述べる（抄録）。", "fun": "仲間内だけで通じる言葉があると、一体感が高まる気がする。そこで、人1人とAI4体のグループで、AIが「私たちの合言葉」になる造語を提案してみた。ところが、一体感がはっきり高まったとは言えなかった。うまくいかなかった結果も、統計の補正をきちんとしたうえで正直に報告している点が、かえって面白い。", "unverified": "本文を読めておらず、議論の課題、エージェントの設計、アイデンティティの尺度は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "DEMの連成で引き継ぐ状態量と学習代替を検証", "title": "State Handover and Learned Surrogates in a Sequentially Coupled Simulation Chain of Snow-Removal Machines", "url": "https://doi.org/10.3390/app162211315", "authors": "Seita Hoshino", "venue": "Applied Sciences (Switzerland)", "date": "2026-11-16", "sjr": 0.555, "citescore": 6.1, "citescore_year": "2025", "apa": "Hoshino, S. (2026). State Handover and Learned Surrogates in a Sequentially Coupled Simulation Chain of Snow-Removal Machines. Applied Sciences, 16(22), 11315. https://doi.org/10.3390/app162211315", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文はオープンアクセスだが取得できず未読", "preprint": false, "p1": "除雪機を順に通す個別要素法（DEM）の連鎖のシミュレーションで、前の段から次の段へ粒子のどの状態を引き継ぐ必要があるか、またある段を学習した代理モデル（GNN）で置き換えられるかを、数値実験で確かめた（抄録）。", "p2": "複数の機械を順に扱うDEMの連鎖では、ある段の最終の粒子状態のどの部分を次へ渡すべきか、段を代理モデルに置き換えたとき下流のDEMがそれを受け入れるかが分かっていなかった（抄録）。", "p3": "プラウ・スイーパー・ロータリーブロワの理想化したDEMの連鎖を試験台にし、10組の初期充填で引き継ぐ状態（並進速度、角速度、接触履歴）を操作した。さらにグラフニューラルネットワークの代理モデルを5つの訓練の乱数の種で作り、下流のDEMが修正なしに受け入れるかを調べた（抄録）。", "p4": "評価は最終的な残雪の質量で、比較の基準はすべての状態を引き継いだ場合。第2の境界、時間刻みの半減、摩擦・粘着・粒径の変更でも結果の符号を確かめた（抄録）。", "p5": "プラウとスイーパーの境で並進速度を除くと、短い工程で残雪が4.00 kg（初期質量の16%、95%区間3.90〜4.09 kg）、長い工程で0.28 kg（1.2%）増えた。角速度と接触履歴を除いても残雪の変化は0.1%未満だった。GNNの代理モデルは50回中43回が修正なしに受け入れられ、拒否された状態はすべて粒子の中心が重なっていた。受け入れられた状態でも残雪は種ごとの平均で0.3〜3.1 kg増え、その原因は位置の誤差ではなく引き継いだ速度だった（抄録）。", "p6": "理想化した数値の試験台での結果で、実機の除雪との照合はない（抄録）。著者は、代理モデルは下流で受け入れられるか、下流の指標でどうなるかで評価すべきだとする（抄録）。", "fun": "雪かきの機械が何台も続けて雪を運ぶとき、前の機械から次の機械へ「雪の粒の位置」だけを渡せばよいのか、「動いている速さ」も渡す必要があるのか。計算で確かめると、速さを渡さないと残る雪が16%も増えたが、粒の回転や触れ合いの記憶はほとんど関係なかった。何を引き継げば十分かを見極める発想が面白い。", "unverified": "本文を読めておらず、粒子数、雪のモデルのパラメータ、GNNの構成は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "SNS上の客同士の無礼は擁護より非難が効く", "title": "Through the eyes of an observer: the role of perceived effort in addressing online incivility in social media service recovery", "url": "https://doi.org/10.1108/ejm-08-2024-0648", "authors": "Todd J. Bacile ほか", "venue": "European Journal of Marketing", "date": "2026-11-16", "sjr": 2.266, "citescore": 11.1, "citescore_year": "2025", "apa": "Bacile, T. J., Fox, A. K., Elmadag, A. B., Okan, M., Dineva, D., & Wolter, J. S. (2026). Through the eyes of an observer: the role of perceived effort in addressing online incivility in social media service recovery. European Journal of Marketing, 1–47. https://doi.org/10.1108/ejm-08-2024-0648", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "SNS上で顧客どうしの無礼（インシビリティ）が起きたとき、企業がそれを擁護するより非難する方が、無礼を不正と感じる観察者の購買・関与の意図を、企業の努力の知覚を通じて高めることを示した（抄録）。", "p2": "サービス回復の研究は苦情を言う本人への対応が中心で、顧客どうしの無礼という「消費に関わらない失敗」に企業がどう対応すべきか、それを周りで見ている観察者がどう受け止めるかは調べられていなかった（抄録）。", "p3": "帰属理論とサービス風土の考え方を用い、企業の2つの応答（無礼を擁護する・非難する）が観察者の知覚に与える影響を調べた。研究1はオンラインの内容分析で実態を示し、研究2（荒らしによる無礼）と研究3（常連客による無礼）はサービスの失敗と苦情の場面のシナリオで、観察者の努力の知覚とサービス風土の媒介、観察者の顧客間の公正さの知覚による調整を検証した（抄録）。", "p4": "比較の基準は擁護の応答で、評価は観察者の購買意図と関与の意図（抄録）。", "p5": "実際の企業は無礼を非難するより擁護することが8倍多かった（研究1）。研究2・3では、無礼を非難すると観察者の努力の知覚が上がり購買・関与の意図が高まったが、それは観察者が無礼を不正と感じる場合に限られた。努力の媒介は、サービス風土という別の媒介を統制しても頑健だった（抄録）。", "p6": "解釈：シナリオ実験による意図の測定で、実際の購買行動は測っていない。SNSの種類やブランドによる違いは抄録からは分からない。", "fun": "企業のSNSで、ある客が別の客に失礼な書き込みをしたとき、企業は「まあまあ」となだめるべきか、「その発言は不適切です」とはっきり言うべきか。この研究では、はっきり非難した方が、周りで見ている人の「この会社は努力している」という評価が上がり、買いたい気持ちも高まった。当事者だけでなく観客の目を意識すべきだ、という視点が面白い。", "unverified": "本文を読めておらず、参加者数、効果の大きさ、調整効果の検定の詳細は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "複数LLMの合議で分析用の投稿集合を絞り込む", "title": "Curate before you cluster: LLM-consensus filtering for marketing text analytics", "url": "https://doi.org/10.1108/jrim-11-2025-0719", "authors": "Lavy Khoushinsky", "venue": "Journal of Research in Interactive Marketing", "date": "2026-11-16", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "apa": "Khoushinsky, L. (2026). Curate before you cluster: LLM-consensus filtering for marketing text analytics. Journal of Research in Interactive Marketing, 1–15. https://doi.org/10.1108/jrim-11-2025-0719", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "注目の大きい出来事のSNS上の会話から分析したい投稿だけを取り出す問題を、複数のLLMの合意によるラベル付け、分類器への蒸留、類似度で制御した拡張の3段階で解き、取り出しの質を高めつつ無関係な投稿の混入を低く保てることを示した（抄録）。", "p2": "ソーシャルリスニングでは、キャンペーンの話題が政治・文化・ブランドの広い議論と絡み合い、分析したい会話だけを取り出すコーパスの構築が難しく、それが後の分析をゆがめうる（抄録）。", "p3": "（1）複数のLLMの合意で関連性を文脈に即して判定し、（2）その判定を分類器に蒸留して大規模に使える高精度の種集合を作り、（3）類似度の閾値で意味のずれを抑えながら関連する投稿を追加で回収する。ナイキの2018年のDream Crazyキャンペーンをめぐるレディットの投稿7万3,564件で示した（抄録）。", "p4": "評価は回収の質と混入の低さで、人による監査と時間的な反証（キャンペーン前の時期の投稿で確かめる）で妥当性を調べた（抄録）。", "p5": "提案した手順は混入を低く保ちながら回収の質を大きく改善した。人の監査と時間的な反証は、経験的に観察できる意味の境界で一致し、コーパスの構築は本質的に境界の管理の問題だと示した（抄録）。著者は、網羅性と混入のトレードオフを分析の前に管理することが効果的なソーシャルリスニングの条件だとする（抄録）。", "p6": "解釈：1つのキャンペーン・1つのプラットフォームでの例示で、使ったLLMの種類や数、回収の質の数値は抄録からは分からない。", "fun": "話題のCMについてネットで何が言われているかを調べたくても、関係のない政治の議論やほかの話題が大量に混ざってしまう。この研究は、まず何台ものAIに「これは関係ある投稿か」を多数決で判定させ、それを手本に高速な仕分け機を作り、最後に似た投稿を慎重に拾い足した。分析の前の「下ごしらえ」に正面から取り組んだ点が面白い。", "unverified": "本文を読めておらず、合意に使ったLLMの構成、回収率・混入率の数値は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "4種のデジタルツイン基盤の成熟度を実装で比較", "title": "Benchmarking Four Digital Twin Implementations: An Evidence-Based Assessment Using the Digital Twin Maturity Model", "url": "https://doi.org/10.3390/smartcities9110196", "authors": "Kye Rodenberg ほか", "venue": "Smart Cities", "date": "2026-11-16", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Rodenberg, K., & Gharineiat, Z. (2026). Benchmarking Four Digital Twin Implementations: An Evidence-Based Assessment Using the Digital Twin Maturity Model. Smart Cities, 9(11), 196. https://doi.org/10.3390/smartcities9110196", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文はオープンアクセスだが取得できず未読", "preprint": false, "p1": "4つのデジタルツインの基盤（Autodesk Tandem、OpenTwins、Bentley iTwin、AWS IoT TwinMaker）に同じ事例を実装し、ISO/IEC 30186:2025の成熟度の観点で、実装された機能に基づいて評価する実践的な方法を示した（抄録）。", "p2": "デジタルツインという言葉は基盤によって一貫せずに使われ、データ統合・自動化・分析・可視化の能力が大きく異なるため、ある基盤が実際に何をできるのかが分からなかった（抄録）。", "p3": "建物情報モデル（BIM）と、Raspberry Pi 5が送る温度・湿度のIoTの実時間データからなる共通の事例を各基盤に実装し、5つの一般的な監視の課題と、文書に書かれているだけの機能と実装された機能を区別する項目単位の証拠に基づく採点で、成熟度の各側面を評価した（抄録）。", "p4": "評価の基準はISO/IEC 30186:2025の成熟度の側面（収束、信頼性など）で、実装の手順、データ統合の方法、再現性の実際の制約（データの更新間隔の違いなど）も記録した（抄録）。", "p5": "4つの実装はすべて収束の側面でレベル2に達し、AWS IoT TwinMakerは信頼性でもレベル2だった。AWSの1時間の観測では各変数の期待される60サンプルすべてが保持された（較正したセンサの精度ではなくデータの連続性を示す）。どの実装も予測、双方向の制御、ツイン間の自律的な連携を示せなかった（抄録）。", "p6": "解釈：評価は温度・湿度のセンサ1つの建物の事例で、橋梁などの構造物の振動計測のような高頻度・大容量のデータでの能力は確かめられていない。著者は、成熟度は使いやすさ・データの所有・必要な専門性と合わせて解釈すべきだとする（抄録）。", "fun": "「デジタルツイン」という言葉は、建物や街のそっくりなコンピュータ上の分身を指すが、製品によって中身はまちまちである。この研究は、4つの有名な製品に同じ建物とセンサをつないで、カタログではなく実際に動いた機能だけで点数をつけた。どの製品も「未来を予測して現実を操作する」段階には届いていなかった、という正直な結果が面白い。", "unverified": "本文を読めておらず、各側面のレベルの全体と採点の詳細は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "サステナビリティ開示と社債スプレッドの関係", "title": "Sustainability‐Related Information and Secondary‐Market Corporate‐Bond Spreads: Disclosure, Verification, and Contractual Commitment", "url": "https://doi.org/10.1002/csr.71171", "authors": "Simon Fernandez‐Vazquez ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-16", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Fernandez‐Vazquez, S., & Martinez Alvarez, J. (2026). Sustainability‐Related Information and Secondary‐Market Corporate‐Bond Spreads: Disclosure, Verification, and Contractual Commitment. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71171", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "世界の社債の流通市場で、サステナビリティ関連の情報の3つの側面（開示、外部検証、契約上の約束）とスプレッドの関係を調べ、開示とスプレッドの負の関連は主に発行体の間の違いによるもので、発行体の中での変化による関連ではないことを示した（抄録）。", "p2": "サステナビリティの情報が社債の価格に反映されるかは関心が高いが、開示・検証・契約上の約束という情報の構造の側面を分け、流通市場の価格との関係を見た研究は限られていた（抄録）。", "p3": "LSEG Workspaceの社債（サステナブルに分類された部分集合を含む世界の標本）で、オプション調整後スプレッド（OAS）を3つの側面に回帰し、横断の定式化に加えて発行体の固定効果と、発行体の間・中を分ける推定を行った（抄録）。", "p4": "評価は回帰の係数の符号と有意性。分類された債券とそうでない債券で開示の指標がとる範囲が重ならない（分類外0〜2、分類債3〜5）ため、同じ指標値で比べられないことも検討した（抄録）。", "p5": "開示は横断の定式化でOASと負に関連したが、発行体の固定効果と間・中の推定では、その関連は主に発行体の間のものだった。開示が0か正かの比較は分類外の債券でのみ観測で支えられた。検証は通常の同時の定式化ではスプレッドと正に関連したが、分類を加えると有意でなくなり、その正の値は分類債にしか現れなかった。契約上の約束は観測の支えが乏しかった（抄録）。", "p6": "結果は流通市場の既発債についての条件つきの関連で、発行の費用への因果効果ではないと著者が明記する（抄録）。解釈：指標の範囲が分類で分かれており、識別できる比較は限られる。", "fun": "環境に良いことを詳しく報告している会社の社債は、利回りが低い（安くお金を借りられる）のだろうか。この研究では、確かに詳しく報告する会社ほど利回りが低かったが、それは「報告が詳しい会社はもともと別の種類の会社」だからで、同じ会社が報告を増やしても利回りはあまり変わらなかった。比べる相手を変えると見え方が変わる点が面白い。", "unverified": "本文を読めておらず、標本の債券数・期間、係数の大きさは未確認。"}}, {"id": "jr11", "rank": 11, "headline": "期限つきの現金給付の間に近隣への愛着が低下", "title": "The Limits of Cash: Guaranteed Income, Basic Income, and the Reproduction of the Precarious City", "url": "https://doi.org/10.1111/anti.70248", "authors": "James C. Fraser ほか", "venue": "Antipode", "date": "2026-11-16", "sjr": 1.442, "citescore": 7.0, "citescore_year": "2025", "apa": "Fraser, J. C., & Oakley, D. A. (2026). The Limits of Cash: Guaranteed Income, Basic Income, and the Reproduction of the Precarious City. Antipode, 58(6). https://doi.org/10.1111/anti.70248", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "期限つきの無条件の現金給付は、低所得の住民の家計の苦しさ（分配の面）を動かさない一方で、近隣への愛着や社会的なまとまり（関係の面）が給付の間とその後に損なわれていくことを、5年間の参加型パネルで示した（抄録）。", "p2": "保証所得の試行やコロナ禍の救済給付はどれも期限つきという政治的な形をとるが、再編の進む人種的に分断された住宅市場で、その形が住民に何をもたらすかは問われていなかった（抄録）。", "p3": "シンシナティのオーバー・ザ・ラインの手ごろな住宅の保全物件に住む、主に黒人の低所得の女性を対象に、5年間の参加型パネル研究を行い、個人内の変化として近隣への愛着、社会的なまとまり、家計の苦しさを追った（抄録）。", "p4": "比較は給付の前・期間中・終了後の同じ個人の変化で、対照群の有無は抄録から分からない（抄録）。", "p5": "個人内で、近隣への愛着は給付期間中に有意に下がり回復しなかった。社会的なまとまりは給付の間は保たれたが、終了後に急に下がった。家計の苦しさはどちらの向きにも動かなかった（抄録）。著者はこの型を、法定の期限、税額控除の契約条件、再開された立ち退きの手続きによって不安定さを管理可能な範囲にとどめる統治の技術（正常化）と読む（抄録）。", "p6": "著者の主張は現金給付への反対ではなく、分配の手段が関係の傷に届くという前提への反対である（抄録）。解釈：参加者数と統計の検定の詳細は抄録から分からず、近隣の再開発など同時期の変化との区別が必要である。", "fun": "お金を配れば暮らしは楽になる、と考えがちである。ところがこの研究では、期限つきでお金を配っても家計の苦しさの感じ方は変わらず、そのうえ近所への愛着や住民どうしのつながりは、配っている間も配り終わった後も弱まっていった。お金で埋められる穴と、埋められない穴がある、という指摘が面白い。", "unverified": "本文を読めておらず、参加者数、給付の額と期間、尺度の詳細は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "のれん減損は監査報酬を押し上げる", "title": "Do auditors price goodwill impairments? The role of audit committee accounting expertise", "url": "https://doi.org/10.1108/jaar-01-2026-0061", "authors": "Mouna Kammoun ほか", "venue": "Journal of Applied Accounting Research", "date": "2026-11-16", "sjr": 1.225, "citescore": 11.4, "citescore_year": "2025", "apa": "Kammoun, M., Depoers, F., & Khlif, H. (2026). Do auditors price goodwill impairments? The role of audit committee accounting expertise. Journal of Applied Accounting Research, 1–22. https://doi.org/10.1108/jaar-01-2026-0061", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "フランスの上場企業で、IAS 36によるのれんの減損が大きいほど監査報酬が高く、監査委員会の会計の専門性がその報酬の上乗せを弱めることを、共同監査（2つの監査法人による監査）の環境で示した（抄録）。", "p2": "のれんの減損は判断の大きい会計上の見積りで、監査の手間や価格に反映されると考えられるが、共同監査が義務のフランスでの証拠と、監査委員会の専門性の役割は限られていた（抄録）。", "p3": "フランスの上場214社・1,926社年（2011〜2019年）で、企業と年の固定効果とパネル修正標準誤差による回帰を行い、監査委員会の会計の専門性を2値と連続の尺度で測って交互作用を推定し、頑健性の分析を加えた（抄録）。", "p4": "評価は監査報酬への減損の係数と、専門性との交互作用の符号と有意性である（抄録）。", "p5": "のれんの減損は監査報酬と正に関連し、その関連は減損損失が大きいほど強かった。2値の専門性の尺度との交互作用は負でわずかに有意（marginally significant）、連続の尺度では報酬の上乗せが弱まることのより強い証拠が得られた（抄録）。", "p6": "保存データによる研究で、共同監査人の間の調整の過程は直接観測できず、報酬の上乗せを調整で解釈するのは間接的だと著者が認める（抄録）。", "fun": "企業買収で生まれた「のれん」の価値が下がったと判断するには、将来の見通しという主観的な見積りが要る。この研究では、のれんを大きく減らした会社ほど監査の料金が高かった。ところが監査委員会に会計の専門家がいると、その上乗せが小さくなった。専門家が社内にいると監査人との議論が早く片づくのかもしれない、という点が面白い。", "unverified": "本文を読めておらず、係数の大きさ、専門性の測り方の詳細、頑健性の分析の内容は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "欧州4国の道路財源の仕組みと維持の成果を比較", "title": "Road Funding Models and Sustainable Governance in Southern and Western Europe: A Comparative Analysis", "url": "https://doi.org/10.3390/smartcities9110193", "authors": "Esther Pérez Arellano ほか", "venue": "Smart Cities", "date": "2026-11-16", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Pérez Arellano, E., Sampedro Rodríguez, Á., Soto Pérez, A. C., & Suárez-Macías, J. (2026). Road Funding Models and Sustainable Governance in Southern and Western Europe: A Comparative Analysis. Smart Cities, 9(11), 193. https://doi.org/10.3390/smartcities9110193", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文はオープンアクセスだが取得できず未読", "preprint": false, "p1": "スペイン・フランス・イタリア・ドイツの高規格道路の財源の仕組みを9つの指標で比べ、一般財源に頼る方式は財政的にも環境的にも持続可能でなく、距離に応じた利用者負担・汚染者負担へ移るべきだと結論した（抄録）。", "p2": "EUの交通政策では、高規格道路の長期の財政の持続性、構造物の保全、環境との整合が大きな課題である（抄録）。", "p3": "最も似たシステムの比較設計（MSSD）に基づく構造化された比較政策分析で、各国を統治の構造、課金の技術の仕組み、財政の持続性の指標にまたがる9つの主要業績指標（KPI）の行列で評価した（抄録）。", "p4": "比較の基準は4か国の間の違いで、指標は財源の自給率や維持管理の遅れの規模など（抄録）。", "p5": "コンセッション方式のフランスとイタリアは財源の自給率が130%を超え、需要のリスクを移転して維持管理の遅れを防いでいた。ドイツの衛星による料金所のない大型車課金（Lkw-Maut）は、改正ユーロビネット指令（2022/362）のもとでCO2排出の割増を課し、収入の使途を法で特定していた。スペインは料金のコンセッションの取りやめ後に一般財源に頼り、維持管理の遅れの累積が100億ユーロを超え、財源の自給率はほぼ0%だった（抄録）。", "p6": "解釈：比較は4か国の制度の記述と指標に基づくもので、制度の違いが成果の違いを生んだという因果の識別ではない。指標のデータの出所と年次は抄録から分からない。", "fun": "高速道路を誰のお金で直すかは国によって違う。通行料で賄うフランスやイタリアは修繕費を自分で稼げているのに、通行料をやめて税金に頼ったスペインでは、直せていない修繕が1兆円を超えるほどたまっていた。道路の「お財布」の作り方が、何十年後の道路の傷み具合を左右するという点が面白い。", "unverified": "本文を読めておらず、9つのKPIの一覧とデータの出所、評価の方法の詳細は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "飽和・不飽和土を2変数でつなぐ多孔質弾性", "title": "A practical poroelasticity modeling framework for saturated and unsaturated soils: theory, implementation, and experimental validation", "url": "https://doi.org/10.1007/s11440-026-03264-3", "authors": "Muchun Liu ほか", "venue": "Acta Geotechnica", "date": "2026-11-16", "sjr": 2.025, "citescore": 11.8, "citescore_year": "2025", "apa": "Liu, M., Ren, Y., Biniyaz, A., & Liu, Z.
