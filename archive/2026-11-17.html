 L. (2026). A practical poroelasticity modeling framework for saturated and unsaturated soils: theory, implementation, and experimental validation. Acta Geotechnica. https://doi.org/10.1007/s11440-026-03264-3", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（数値の枠組み、計算の手順、室内実験と遠心模型実験での検証、χの感度）を読んだ。支配方程式の導出の細部は読んでいない", "preprint": false, "p1": "飽和から不飽和までの土の変形と浸透を、変位とマトリックポテンシャルの2つの未知数だけで連続的に扱う実用的な多孔質弾性の枠組みを作り、FEniCSのオープンソースのソルバとして実装し、室内実験と遠心模型実験で検証した（抄録、§3〜§5）。", "p2": "既存の飽和・不飽和の多孔質弾性の理論は、補助変数や複雑な状態の追跡、入り組んだ構成式に頼り、完全なニュートン・ラフソン法の線形化で計算費用が高く、安定性や見通しにも問題があった（抄録）。", "p3": "Biotの相反的な連成構造を共通の連成係数αχで表し、Bishopのパラメータχを各時間ステップでKhalili–Khabbazの式により更新する（抄録）。非線形の係数（χ、比水分容量、透水係数など）を前の時間ステップの値で半陰的に評価するので、各ステップは1回の線形解だけで済む（§3.3）。陰的オイラー法で時間を離散化した。", "p4": "粗砂と細砂の砂柱の排水実験（側方・底面・全面の3通りの排水、速い・遅い2つの速度）での沈下・間隙水圧・含水率と、50gの遠心模型の河川堤防（462日相当の水位の上下）での間隙水圧と変位で比べた（§4、§5）。", "p5": "粗砂の最大の沈下の実測は全面排水で0.141 mm、側方排水で0.132 mmで、計算は排水の全条件で実測とよく一致した（§4.4.1）。遠心模型ではP7・P8の間隙水圧の計算のピークが27.2 kPaと25.3 kPa（実測36.1 kPaと22.9 kPa）で、法面のLR2の鉛直変位は計算49.5 mm、実測57.1 mmと全体の量をやや過小評価した（§5.3）。", "p6": "半陰的な手順は、完全に更新した非線形問題の収束をそれ自体では保証しないと著者が述べる（§3.4）。解釈：室内実験の元データは限られ一部が欠けている（§4.4.1）。", "fun": "地面の土は、水でびっしょりの部分と、乾いて空気が入った部分が混ざっている。両方をまとめて計算するのは難しく、プログラムも複雑になりがちだった。この研究は、未知数を「動き」と「水の吸い付く力」の2つに絞り、一歩ごとの計算を簡単な形にして、実験の沈下や水圧をよく再現した。複雑な現象を手の届く道具にした点が面白い。", "unverified": "10を超える室内実験の全体の比較（抄録の記述）のうち、読めたのは砂柱の実験と遠心模型の一部で、他の実験の一致の程度は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "局所依存のある尺度は二因子IRTで不変性を検定", "title": "Assessing Measurement Invariance With Bifactor IRT Models", "url": "https://doi.org/10.1177/00131644261498237", "authors": "Lu Zhang ほか", "venue": "Educational and Psychological Measurement", "date": "2026-11-16", "sjr": 2.63, "citescore": 7.1, "citescore_year": "2025", "apa": "Zhang, L., & Andersson, B. (2026). Assessing Measurement Invariance With Bifactor IRT Models. Educational and Psychological Measurement. https://doi.org/10.1177/00131644261498237", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "局所依存のある項目群（同じ文章に基づく読解問題など）を含むテストで、二因子IRTモデル（全体の因子と項目群ごとの特殊因子を持つモデル）での測定不変性の検定を、誤指定や制約の置き方、推定法の違いまで含めてシミュレーションで調べた（抄録）。", "p2": "測定不変性（集団の間で尺度が同じものを測っていること）の評価には一次元のIRTが使われるが、その局所独立の仮定は破られがちである（抄録）。二因子モデルでの不変性の評価の方法は十分に整理されていなかった。", "p3": "ノルウェーの全国読解テスト（2022〜2023年）を手本にしたシミュレーションで、周辺最尤法（MML）と尤度比検定を用い、（1）データが二因子構造なのに一次元モデルでDIF（特異項目機能）を評価した場合の影響、（2）多群の二因子モデルで全体の傾きだけを制約するか、全体と特殊の傾きの両方を制約するかの影響、（3）適応ガウス・エルミート求積、ラプラス近似、次元縮約つきEMアルゴリズムの比較を調べた（抄録）。", "p4": "評価は検定のサイズ（帰無仮説が正しいときに誤って棄却する率が名目の水準どおりか）である（抄録）。", "p5": "特殊因子の傾きが集団の間で同じなら、どの方法も正確なサイズを示した。しかし特殊因子の傾きが集団で異なるとき、その違いを考慮しないモデルはサイズが膨らんだ（誤って不変性を棄却しやすくなった）（抄録）。", "p6": "解釈：抄録からは、検出力の結果、一次元モデルの誤指定の影響の大きさ、実データへの適用の有無は分からない。読解テストを手本にした設定で、他の種類の尺度への一般化は確かめる必要がある。", "fun": "国語のテストで、同じ文章について何問も出すと、その文章が得意かどうかで点数がまとめて上下する。こうした「問題どうしのつながり」を無視して、男女や地域で問題の公平さを比べると、公平な問題まで「不公平」と判定してしまうことがある。テストの物差しの公平さを確かめる道具の、使い方の落とし穴を示した点が面白い。", "unverified": "本文を読めておらず、シミュレーションの条件（標本数、項目数）と各推定法の数値結果は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "タイヤ変形の復元で車輪ごとの橋上移動荷重を同定", "title": "Rim-constrained tire deformation recovery and reliability-weighted signal fusion for tire-level bridge moving-load identification", "url": "https://doi.org/10.1016/j.ymssp.2026.115212", "authors": "Zida Chen ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-16", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Chen, Z., You, Y., Gu, J., Yang, Z., Huang, Z., & Gao, K. (2027). Rim-constrained tire deformation recovery and reliability-weighted signal fusion for tire-level bridge moving-load identification. Mechanical Systems and Signal Processing, 263, 115212. https://doi.org/10.1016/j.ymssp.2026.115212", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Mechanical Systems and Signal Processingの新着。出版社サイトとAPIから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、リム（ホイールの縁）で拘束したタイヤの変形を復元し、信頼度で重みづけて複数の信号を融合することで、橋を渡る車両の荷重をタイヤ単位で同定する方法を扱う。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、橋の上を走る車がどの瞬間にどのタイヤでどれだけの重さをかけているかを、タイヤのつぶれ方から逆算できるか、というものである。タイヤ自体を体重計のように使う発想で、複数のセンサの「当てになる度合い」を考えて組み合わせる工夫も題名から読み取れる。", "unverified": "手法の詳細、検証の方法（実験か数値か）、同定の精度はすべて未確認。"}}, {"id": "jr17", "rank": 17, "headline": "航空機・舗装・地震の連成を時間領域で解析", "title": "Coupled Time-Domain Investigation of Aircraft, Pavement and Seismic Interaction in Jointed Concrete Pavement on Pasternak Foundation", "url": "https://doi.org/10.1007/s42417-026-02919-5", "authors": "Khair IU Faisal Wani ほか", "venue": "Journal of Vibration Engineering & Technologies", "date": "2026-11-16", "sjr": 0.56, "citescore": 4.5, "citescore_year": "2025", "apa": "Wani, K. I. F., Sharma, A., Verma, V., Singh, K., & Sharma, A. (2026). Coupled Time-Domain Investigation of Aircraft, Pavement and Seismic Interaction in Jointed Concrete Pavement on Pasternak Foundation. Journal of Vibration Engineering & Technologies, 14(8). https://doi.org/10.1007/s42417-026-02919-5", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Journal of Vibration Engineering & Technologiesの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、Pasternak地盤上の目地付きコンクリート舗装で、航空機の荷重、舗装、地震動の相互作用を連成させて時間領域で解析する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、飛行機が滑走路を走っているときに地震が来たら、舗装と地面と機体がどう揺れ合うか、というものである。重い乗り物、継ぎ目のある舗装、ばねのような地盤、地震という4つを同時に計算に入れる点が、題名から読み取れる難しさである。", "unverified": "解析モデルの自由度、地震動の入力、結果はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "物理情報ベイズ代理モデルで歴史構造物のFE更新", "title": "Physics-Informed Bayesian Surrogate-Assisted Finite Element Model Updating for Structural Reliability Assessment of Historical Constructions", "url": "https://doi.org/10.1080/15583058.2026.2762072", "authors": "Pablo Pachón García ほか", "venue": "International Journal of Architectural Heritage", "date": "2026-11-15", "sjr": 0.583, "citescore": 5.6, "citescore_year": "2025", "apa": "Pachón García, P., Naranjo-Pérez, J., Compán, V., & Jimenez-Alonso, J. F. (2026). Physics-Informed Bayesian Surrogate-Assisted Finite Element Model Updating for Structural Reliability Assessment of Historical Constructions. International Journal of Architectural Heritage, 1–22. https://doi.org/10.1080/15583058.2026.2762072", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "International Journal of Architectural Heritageの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、物理の知識を組み込んだベイズの代理モデルを使って有限要素モデルを更新し、歴史的な構造物の構造信頼性を評価する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、古い建物のように材料や状態がよく分からない構造物を、計測データから計算モデルに合わせ込み、どれくらい安全かを確率で言えるか、というものである。重い計算の代わりに軽い代理モデルを使う工夫が、題名から読み取れる。", "unverified": "対象の構造物、計測データの種類、更新の結果はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "多梁連成構造の振動解析に節点の柔性モデル", "title": "A parametric compliance nodal joint model for efficient vibration analysis of coupled multi-beam structures", "url": "https://doi.org/10.1016/j.ijmecsci.2026.112284", "authors": "Chi Xu ほか", "venue": "International Journal of Mechanical Sciences", "date": "2026-11-15", "sjr": 2.101, "citescore": 16.1, "citescore_year": "2025", "apa": "Xu, C., Shao, K., Xu, H., Xiong, C., Branson, D. T., & Yang, J. (2026). A parametric compliance nodal joint model for efficient vibration analysis of coupled multi-beam structures. International Journal of Mechanical Sciences, 112284. https://doi.org/10.1016/j.ijmecsci.2026.112284", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "International Journal of Mechanical Sciencesの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、複数の梁を連結した構造の振動解析を効率よく行うため、接合部（節点）の柔らかさをパラメータで表すモデルを提案する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、梁と梁のつなぎ目が完全に固くも完全にゆるくもないとき、その「ほどほどの固さ」を少ない数で表して全体の揺れを速く計算できるか、というものである。骨組みの揺れ方はつなぎ目で大きく変わるので、そこに目をつけた点が題名から読み取れる。", "unverified": "モデルの形、検証の方法、計算の効率化の程度はすべて未確認。"}}, {"id": "jr20", "rank": 20, "headline": "言語特徴を加えた財務困窮予測を説明可能MLで", "title": "Incorporating multidimensional language characteristics into financial distress prediction: A study based on word embedding and explainable machine learning approaches", "url": "https://doi.org/10.1016/j.pacfin.2026.103431", "authors": "Lianlian Wang ほか", "venue": "Pacific-Basin Finance Journal", "date": "2026-11-15", "sjr": 1.322, "citescore": 7.4, "citescore_year": "2025", "apa": "Wang, L., & Huang, W.-Q. (2026). Incorporating multidimensional language characteristics into financial distress prediction: A study based on word embedding and explainable machine learning approaches. Pacific-Basin Finance Journal, 103431. https://doi.org/10.1016/j.pacfin.2026.103431", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "Pacific-Basin Finance Journalの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、単語埋め込みで作った多次元の言語的な特徴を財務困窮の予測に組み込み、説明可能な機械学習で解釈する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、会社が書く文章の言葉づかいに、数字には表れない経営の危うさのサインが含まれているか、というものである。決算の数字に加えて文章の特徴を使い、しかもAIがなぜそう予測したかを説明できるようにする点が、題名から読み取れる狙いである。", "unverified": "対象の国・期間、使った文書の種類、予測の精度はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "AIを介した修理の回復で従業員の情動能力が効く", "title": "The impact of frontline employees’ emotional competence on post-recovery service outcomes in AI-mediated automobile repair: the mediating role of perceived experiential value", "url": "https://doi.org/10.1108/ijqrm-10-2025-0372", "authors": "Manel Ben Ayed", "venue": "International Journal of Quality & Reliability Management", "date": "2026-11-16", "sjr": 0.666, "citescore": 8.7, "citescore_year": "2025", "apa": "Ben Ayed, M. (2026). The impact of frontline employees’ emotional competence on post-recovery service outcomes in AI-mediated automobile repair: the mediating role of perceived experiential value. International Journal of Quality & Reliability Management, 1–22. https://doi.org/10.1108/ijqrm-10-2025-0372", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "AIを介した自動車修理のサービス回復で、最前線の従業員の情動的能力が顧客の経験価値を通じて回復後の満足・愛着・継続利用につながることを示した（抄録）。", "p3": "AIを導入した2つの販売店で、記録されたサービス回復を最近経験した顧客354人に質問紙を配り、PLS-SEMで検証し、AIの介在の程度と顧客の脆弱性で多群分析を行った（抄録）。", "p5": "情動的能力は経験価値に強く効き（β=0.902）、経験価値を通じた間接効果は満足（β=0.297）、愛着（β=0.499）、継続（β=0.653）で有意だった。この関係はAIの介在が多い場合と脆弱な顧客で強かった（抄録）。", "fun": "修理工場でトラブルが起きたとき、AIが手続きを進めても、最後に客の気持ちを受け止めるのは人である。この研究では、AIが多く関わる店ほど、従業員の感情をくみ取る力の効果が大きかった。機械化が進むほど人の気配りの価値が上がるという逆説が面白い。", "unverified": "AIの介在の程度の測り方と、多群分析の差の検定の詳細は抄録から確認できない。"}}, {"id": "jr22", "rank": 22, "headline": "CSR志向の人事は職場の支援でストレスを減らす", "title": "Protecting mental well-being against perceived work stress: the mitigating mechanism of CSR-oriented HRM via job social support", "url": "https://doi.org/10.1108/ijoa-05-2026-6954", "authors": "Tuan Tran-Hoang ほか", "venue": "International Journal of Organizational Analysis", "date": "2026-11-16", "sjr": 0.952, "citescore": 9.1, "citescore_year": "2025", "apa": "Tran-Hoang, T., Pham, N. T., Vrontis, D., & Ahmed, Z. U. (2026). Protecting mental well-being against perceived work stress: the mitigating mechanism of CSR-oriented HRM via job social support. International Journal of Organizational Analysis, 1–21. https://doi.org/10.1108/ijoa-05-2026-6954", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "CSR志向の人事管理が、職務上の社会的支援を増やしストレスを下げることを通じて従業員のメンタルの良好さに結びつく経路を、資源保存理論で示した（抄録）。", "p3": "ベトナム南東部の外資系企業の従業員869人の2時点の対応づけた回答を、構造方程式モデルとブートストラップで分析した（抄録）。", "p5": "CSR志向の人事は社会的支援の増加とストレスの低下に関連し、支援からストレスの低下、メンタルの良好さへと続く直列の経路が有意だった。著者は観察研究のため因果の順序は確定しないと述べる（抄録）。", "fun": "社会貢献に熱心な会社の人事制度は、社員の心の健康にも良いのか。この研究は、そうした制度が職場で助け合う雰囲気を生み、それがストレスを減らして心の健康につながる、という順番を調査で追った。会社の理念が日々の人間関係を通じて社員に届く道筋を描いた点が面白い。", "unverified": "効果の大きさの数値は抄録から確認できない。"}}, {"id": "jr23", "rank": 23, "headline": "高知県のSDG登録制度と建設会社の業績の変化", "title": "Who Registers and What Changes? Evidence From a Local Government Sustainable Development Goals Registration System Among Construction Firms in Japan", "url": "https://doi.org/10.1002/sd.71918", "authors": "Yukiko Konno", "venue": "Sustainable Development", "date": "2026-11-16", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "apa": "Konno, Y. (2026). Who Registers and What Changes? Evidence From a Local Government Sustainable Development Goals Registration System Among Construction Firms in Japan. Sustainable Development. https://doi.org/10.1002/sd.71918", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "高知県の地方自治体のSDG登録制度に、どの建設会社が登録し、登録後に何が変わるかを、経営事項審査のデータで調べた（抄録）。", "p3": "建設会社1,447社（2019〜2025年）の経営事項審査のデータで、登録の予測と群・時点別の差分の差分法を組み合わせ、5つの成果の領域と時期を一つの設計で調べた（抄録）。", "p5": "登録は登録前の特徴、とくに早い登録者で強く予測された。有意な正の変化は収益性と完成工事高だけで、前者は登録前からわずかに見られ、後者は登録後に大きくなる傾向だった。他の成果に有意な変化はなかった（抄録）。", "fun": "県がSDGsに取り組む会社を登録し、公共工事の入札で点数を上乗せする仕組みを作った。登録した会社が良くなったように見えても、もともと良い会社が登録しただけかもしれない。この研究は、誰が登録したかと、登録で何が変わったかを分けて調べた点が面白い。", "unverified": "効果の大きさの数値と、5つの成果の領域の内訳は抄録から確認できない。著者は1県・1業種で一般化に限界があると述べる。"}}, {"id": "jr24", "rank": 24, "headline": "Euronext 100社のAI開示を決める要因", "title": "Artificial Intelligence Disclosure as an Emerging Dimension of Corporate Social Responsibility: Evidence From the Euronext 100", "url": "https://doi.org/10.1002/csr.71159", "authors": "María Jesús Guillén Palomino ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-16", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Guillén Palomino, M. J., Arias Abelaira, T., & Rodríguez Ariza, L. (2026). Artificial Intelligence Disclosure as an Emerging Dimension of Corporate Social Responsibility: Evidence From the Euronext 100. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71159", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "Euronext 100の企業で、AIの採用・統治・責任ある利用の開示を左右する要因を分析し、企業規模が最も一貫して開示の多さと関連することを示した（抄録）。", "p3": "正統性理論・エージェンシー理論・シグナリング理論に基づき、欧州の大手上場100社で企業規模・収益性・負債と開示の関係を多変量回帰で調べた（抄録）。", "p5": "最終モデルの調整済みR2は0.058〜0.111と小さかった。規模は開示と正に関連したが有意性は定式化に依存し、収益性は1つのモデルでのみ有意、負債は頑健な関連を示さなかった（抄録）。", "fun": "AIをどう使っているかを会社が自分から説明する「AI開示」は、新しい種類の情報公開である。大きい会社ほどよく説明する傾向はあったが、会社の特徴で説明できる部分は1割ほどにとどまった。開示の多さが何で決まるのかはまだ分かっていない、と正直に示した点が面白い。", "unverified": "開示の測り方（指標の作り方）と対象年は抄録から確認できない。"}}, {"id": "jr25", "rank": 25, "headline": "LLM対話のペルソナの急変をラベルなしで検出", "title": "Detecting Behavioral Anomalies in LLM Response Sequences: A Leakage-Free Benchmark and Comparative Study of Predictive, Distance, and Change-Point Detectors", "url": "https://doi.org/10.3390/e28111257", "authors": "Przemysław Sujecki ほか", "venue": "Entropy", "date": "2026-11-16", "sjr": 0.475, "citescore": 4.9, "citescore_year": "2025", "apa": "Sujecki, P., & Frąszczak, D. (2026). Detecting Behavioral Anomalies in LLM Response Sequences: A Leakage-Free Benchmark and Comparative Study of Predictive, Distance, and Change-Point Detectors. Entropy, 28(11), 1257. https://doi.org/10.3390/e28111257", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "多ターンの対話でLLMのペルソナ・話題・文体・文脈の使い方が急に変わる異常を、異常のラベルや外部知識なしに応答の埋め込みから検出する方法を比べ、ベンチマークを公開した（抄録）。", "p3": "Mistral-7B-Instructで作った700対話（異常の種類ごとに100）と別の生成モデルでの追試の対話を用意し、情報漏れのない手順で12の検出器をROC-AUC・PR-AUC・遅延・一定の誤報率での再現率で比べた（抄録）。", "p5": "予測誤差とアンカーの融合が主コーパスで最良（ROC-AUC 0.762、PR-AUC 0.771）だったが、すべての異常の種類で最良の検出器はなかった。融合は自然な話題の適応のもとで誤報率0.002（アンカーは0.110）だった（抄録）。", "fun": "長く話しているうちに、AIの口調が急に変わったり、別人のようになったりすることがある。この研究は、正しい答えを知らなくても、話しぶりの「いつもとの違い」だけからそうした変化を見つける方法を比べた。自然な話題の移り変わりと、おかしな変化を見分けるのが難しさである点が面白い。", "unverified": "異常の4種類の具体的な作り方と、人による監査の結果は抄録から確認できない。"}}, {"id": "jr26", "rank": 26, "headline": "84体の階層型LLMエージェントの運用記録", "title": "Hierarchical Multi-Agent LLM Architecture for IoT Platform Configuration: Design Patterns and Production Lessons", "url": "https://doi.org/10.3390/iot7040101", "authors": "Andrii Shvaika ほか", "venue": "IoT", "date": "2026-11-16", "sjr": 0.759, "citescore": 8.0, "citescore_year": "2025", "apa": "Shvaika, A., Shvaika, D., & Artemchuk, V. (2026). Hierarchical Multi-Agent LLM Architecture for IoT Platform Configuration: Design Patterns and Production Lessons. IoT, 7(4), 101. https://doi.org/10.3390/iot7040101", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "IoTプラットフォームの設定を自然言語から作る3階層84体のLLMエージェントの5か月の本番ログを分析し、成功率・失敗の所在・費用を報告した（抄録）。", "p3": "スキーマで制約したエージェントが依存関係の不足を申告する仕組みと依存の規則で故障の原因を割り当て、2人の著者による層別標本の独立の監査で推定を確かめた（抄録）。", "p5": "外部の利用者向けに1,408件の設定を完了し、導入を試みた1,376件のうち768件（55.8%）はどの段階でも失敗の記録がなかった。生成側に起因する故障は完了した設定の10.2%（95%信頼区間8.7〜11.8%）で、データ処理の規則に集中した。1件あたりの推論費用の中央値は0.57ドルだった（抄録）。", "fun": "AIの研究では「うまくいった例」の紹介が多いが、実際に何か月も使われたときの失敗の記録は少ない。この論文は、84体のAIが分業する仕組みが本番でどれくらい失敗し、どこで間違えやすく、1件いくらかかったかを正直に数えた。現場の記録から設計の教訓を引き出す点が面白い。", "unverified": "失敗の具体的な内容の分類と、改善策の効果は抄録から確認できない。"}}, {"id": "jr27", "rank": 27, "headline": "駅周辺の型で世帯の交通CO2が最大6割違う", "title": "Transit Quality Is Not Enough: A Station-Area Typology of Transit-Oriented Development and Household Transportation Emissions", "url": "https://doi.org/10.3390/su182211612", "authors": "Ahoura Zandiatashbar ほか", "venue": "Sustainability", "date": "2026-11-16", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "apa": "Zandiatashbar, A., Rozhkov, A., & Nemet, S. (2026). Transit Quality Is Not Enough: A Station-Area Typology of Transit-Oriented Development and Household Transportation Emissions. Sustainability, 18(22), 11612. https://doi.org/10.3390/su182211612", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "高頻度の公共交通があるだけでは低炭素の移動にならず、駅周辺の土地利用と接続性で世帯の交通CO2が大きく違うことを、駅勢圏の類型化で示した（抄録）。", "p3": "サンフランシスコ湾岸の6,154の駅勢圏を、建物環境の8つの標準化指標のWard法のクラスタリングでCBD-TOD・TOD・Hybrid・交通隣接開発（TAD）に分け、高品質交通地区の3,070の街区群で世帯の交通CO2を比べた（抄録）。", "p5": "世帯の交通CO2の中央値はTADの年5.6 tからHybrid 4.3 t、TOD 3.4 t、CBD-TOD 1.8 tへ下がり、世帯の特徴を調整するとTADに比べTODで31%、CBD-TODで60%、Hybridで11%低かった。HybridとTADをTODの水準にすると約4分の1減ると試算した（抄録）。", "fun": "駅の近くに住めば車を使わずに済むはず、と思いがちである。ところが、駅があっても周りにお店や職場が少なければ、結局車で移動してしまう。この研究は、電車の本数ではなく駅の周りの街のつくりがCO2を左右することを数字で示した。交通は街と一体で考える必要があるという点が面白い。", "unverified": "8つの指標の具体的な内容は抄録から確認できない。"}}, {"id": "jr28", "rank": 28, "headline": "GNSS変位で拘束した強震記録の基線補正", "title": "Strong-motion baseline correction based on acceleration smoothness priors and GNSS static displacement constraints", "url": "https://doi.org/10.1016/j.geog.2026.10.019", "authors": "Yuanfan Zhang ほか", "venue": "Geodesy and Geodynamics", "date": "2026-11-15", "sjr": 0.761, "citescore": 6.5, "citescore_year": "2025", "apa": "Zhang, Y., Li, Y., Nie, Z., Wang, Z., & Shan, X. (2026). Strong-motion baseline correction based on acceleration smoothness priors and GNSS static displacement constraints. Geodesy and Geodynamics. https://doi.org/10.1016/j.geog.2026.10.019", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、OpenAlexの題名検索で見つかった同名のEGU 2026の講演要旨を使用。本文は未取得", "preprint": false, "short": true, "p1": "強震計の加速度記録の基線のずれ（積分した変位のドリフト）を、加速度の滑らかさの事前分布と、同じ場所の高頻度GNSSの静的変位の拘束で補正する方法を示した（講演要旨）。", "p3": "滑らかさの事前分布法で定常的な加速度と非周期の雑音の傾向を正則化で分け、GNSSの静的変位を外部の拘束にして階段関数の当てはめを改良し、補正の時刻のパラメータを格子探索で決めた。振動台実験と2つの地震で検証した（講演要旨）。", "p5": "振動台実験では補正後の変位が零線に戻り、長周期と永久変位を保って、RMS 0.585 cm、相関係数0.964だった。2023年のトルコの連続地震では強震計の変位がGNSSとよく一致し、平均RMS 2.720 cm、相関係数0.799だった（講演要旨）。", "fun": "地震計の揺れの加速度を2回足し合わせれば、地面がどれだけ動いたかが分かるはずである。ところが小さなずれが積み重なって、計算上の地面がどんどん流れていってしまう。この研究は、衛星測位（GNSS）が測った「最終的な地面のずれ」を答え合わせに使って、その流れを止めた点が面白い。", "unverified": "論文誌の本文と講演要旨の内容が同じかは未確認。講演要旨のマドゥオ地震の数値は振動台実験の値と同じで、取り違えの可能性があり未確認。"}}, {"id": "jr29", "rank": 29, "headline": "形状記憶合金TMDで橋の渦励振を抑える解析", "title": "Dynamic Behavior of the Shape Memory Alloy-Enhanced Tuned Mass Damper in Bridge Vortex-induced Vibration: An Analytical Study", "url": "https://doi.org/10.1016/j.apm.2026.117441", "authors": "Sizhe Wu ほか", "venue": "Applied Mathematical Modelling", "date": "2026-11-14", "sjr": 1.103, "citescore": 10.2, "citescore_year": "2025", "apa": "Wu, S., Fang, G., Xu, S., Ge, Y., & Tesfamariam, S. (2026). Dynamic Behavior of the Shape Memory Alloy-Enhanced Tuned Mass Damper in Bridge Vortex-induced Vibration: An Analytical Study. Applied Mathematical Modelling, 117441. https://doi.org/10.1016/j.apm.2026.117441", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Applied Mathematical Modellingの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、形状記憶合金で強化した同調質量ダンパー（TMD）を使って、橋の渦励振（風の渦による周期的な揺れ）を抑える仕組みを解析的に調べる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、風で揺れる橋に、温度や変形で性質が変わる特別な金属を組み込んだ揺れ止めのおもりを付けると、揺れをどこまで抑えられるか、というものである。形状記憶合金のエネルギーを吸収する性質を揺れ止めに使う発想が、題名から読み取れる。", "unverified": "解析のモデル、対象の橋、抑制の効果はすべて未確認。"}}, {"id": "jr30", "rank": 30, "headline": "水中の橋梁欠陥を環境条件つきで検出し信頼度を評価", "title": "Environment-conditioned instance segmentation with reliability assessment for underwater bridge defect inspection", "url": "https://doi.org/10.1016/j.engappai.2026.116758", "authors": "Han Shen ほか", "venue": "Engineering Applications of Artificial Intelligence", "date": "2026-11-15", "sjr": 1.782, "citescore": 11.7, "citescore_year": "2025", "apa": "Shen, H., Hou, S., & Zhu, H. (2027). Environment-conditioned instance segmentation with reliability assessment for underwater bridge defect inspection. Engineering Applications of Artificial Intelligence, 187, 116758. https://doi.org/10.1016/j.engappai.2026.116758", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Engineering Applications of Artificial Intelligenceの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、水中の橋梁の点検で、環境の条件（濁りや明るさなど）を考慮したインスタンス分割（画像の中の欠陥を一つずつ切り出す方法）で欠陥を検出し、その信頼性を評価する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、見通しの悪い水の中で撮った橋の脚の画像から、ひび割れなどの傷をAIで正確に見つけ、その判定がどれくらい当てになるかまで示せるか、というものである。見つけるだけでなく「信じてよい度合い」を出す点が、題名から読み取れる工夫である。", "unverified": "対象の構造物、使ったデータ、検出の精度はすべて未確認。"}}, {"id": "jr31", "rank": 31, "headline": "液状化の構成モデルを境界値問題の逆解析で評価", "title": "Evaluating predictive capabilities of constitutive models for soil liquefaction through boundary value problem-based inverse analysis", "url": "https://doi.org/10.1016/j.soildyn.2026.110826", "authors": "Jiangxu Deng ほか", "venue": "Soil Dynamics and Earthquake Engineering", "date": "2026-11-16", "sjr": 1.258, "citescore": 8.8, "citescore_year": "2025", "apa": "Deng, J., Chrisopoulos, S., Fan, Z., Yuan, Y., & Cudmani, R. (2027). Evaluating predictive capabilities of constitutive models for soil liquefaction through boundary value problem-based inverse analysis. Soil Dynamics and Earthquake Engineering, 213, 110826. https://doi.org/10.1016/j.soildyn.2026.110826", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "Soil Dynamics and Earthquake Engineeringの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、液状化を表す構成モデル（土の応力とひずみの関係式）の予測能力を、境界値問題に基づく逆解析によって評価する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、地震で地面が液体のようになる液状化を表す数式が、実際の地盤の揺れをどこまで再現できるか、というものである。要素試験だけでなく、実際の地盤全体の問題として解いて逆にパラメータを求め、数式の実力を確かめる点が、題名から読み取れる。", "unverified": "比べた構成モデル、使ったデータ、評価の結果はすべて未確認。"}}, {"id": "jr32", "rank": 32, "headline": "ナノ粒子の引力をDEMの近接接触則で表す", "title": "Modeling nanoparticle‑induced attractions in granular soils using a DEM proximity contact law", "url": "https://doi.org/10.1016/j.compgeo.2026.108831", "authors": "Travis A. Shoemaker ほか", "venue": "Computers and Geotechnics", "date": "2026-11-16", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": ustrial-Scale SAG Mill Based on the Discrete Element Method", "url": "https://doi.org/10.3390/machines14111346", "authors": "Jiayi Zhao ほか", "venue": "Machines", "date": "2026-11-16", "sjr": 0.591, "citescore": 6.1, "citescore_year": "2025", "apa": "Zhao, J., Li, L., Wu, H., He, Y., Ji, X., & Xue, Y. (2026). Simulation Study on Impact Load of an Industrial-Scale SAG Mill Based on the Discrete Element Method. Machines, 14(11), 1346. https://doi.org/10.3390/machines14111346", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "直径5.5 m・長さ2.25 mの産業規模の半自生粉砕（SAG）ミルの運転を個別要素法（DEM）で模擬し、内部の荷の運動の型と胴体への衝撃荷重の時間・周波数の特徴の関係を示した（抄録）。", "p3": "Hertz–Mindlinの滑りなし接触モデルで臨界速度比を変えた運転全体を模擬し、FFTで荷重の変化を時間と周波数で分析した。滑り軸受の油膜圧の計測は定常の平均荷重だけを間接的に検証する（抄録）。", "p5": "滝のように流れる運動は高周波・低振幅、放物線を描いて落ちる運動は低周波・高振幅の衝撃を生み、臨界速度比を75%から80%に上げると主振動数の鉛直荷重のスペクトル振幅が78.1%増えた（1回の模擬）。計測（77%）と模擬（80%）の相対誤差は7.7%だった（抄録）。", "fun": "鉱石を砕く巨大な回転ドラムの中では、鋼の球と石が転がり落ちたり、放り投げられたりしてぶつかり合う。この研究は、何万もの粒の動きを計算し、回転の速さで落ち方が変わると、ドラムを叩く力の強さとリズムが変わることを示した。粒の動き方の型が機械の傷み方を決める点が面白い。", "unverified": "過渡的な衝撃のピークと周波数の特徴は実験で検証されていないと著者が述べている。"}}, {"id": "jr35", "rank": 35, "headline": "粒状流の圧力場を改良した粒子法で滑らかに計算", "title": "Mesh‐Free Simulation of Granular Flows by the Improved Explicit Incompressible Moving Particle Method", "url": "https://doi.org/10.1002/fld.70113", "authors": "Tibing Xu ほか", "venue": "International Journal for Numerical Methods in Fluids", "date": "2026-11-16", "sjr": 0.575, "citescore": 3.7, "citescore_year": "2025", "apa": "Xu, T., Hou, J., & Koshizuka, S. (2026). Mesh‐Free Simulation of Granular Flows by the Improved Explicit Incompressible Moving Particle Method. International Journal for Numerical Methods in Fluids. https://doi.org/10.1002/fld.70113", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "メッシュを使わない粒子法（MPS法）の陽的非圧縮スキームに再補正の時間ステップを加え、粒状流の圧力場を滑らかに計算できるようにした（抄録）。", "p3": "圧力のポアソン方程式を陽的非圧縮スキーム（EI-MPS）で解き、さらに圧力場を更新する再補正の段を加え、粒状柱の崩壊、2つの粒状柱の衝突、砂の衝撃流を模擬した（抄録）。", "p5": "得られた圧力場は非常に滑らかで、速度と自由表面の変化を再現した。再補正は自由表面近くの圧力の雑音を除くのに役立った（抄録）。", "fun": "砂山が崩れるとき、砂は液体のように流れたり固体のように止まったりする。粒子の集まりで流れを計算すると、圧力がガタガタと振動してしまうことが悩みだった。この研究は、計算の一歩ごとに圧力をもう一度直す工夫で、滑らかな圧力を得た。小さな手順の追加が計算の質を変える点が面白い。", "unverified": "実験との定量的な比較の数値は抄録から確認できない。"}}, {"id": "jr36", "rank": 36, "headline": "部品ごとの縮約モデルでロケット燃焼を計算", "title": "Component-Based Reduced-Order Modeling Framework for Rocket Combustion Dynamics in Multi-Injector Configurations", "url": "https://doi.org/10.2514/1.j067251", "authors": "Brody Gatza ほか", "venue": "AIAA Journal", "date": "2026-11-16", "sjr": 0.775, "citescore": 6.2, "citescore_year": "2025", "apa": "Gatza, B., & Huang, C. (2026). Component-Based Reduced-Order Modeling Framework for Rocket Combustion Dynamics in Multi-Injector Configurations. AIAA Journal, 1–21. https://doi.org/10.2514/1.j067251", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "大規模なロケットエンジンを噴射器・燃焼器・ノズルの部品に分け、部品ごとに学習した縮約モデル（ROM）をつないで全体を効率よく模擬する枠組み（CBROM）を示した（抄録）。", "p3": "小さな計算領域の高精度シミュレーションだけで、境界条件で系全体の応答を模した部品ごとのROMを訓練し、変数変換つきの形を保つ最小二乗射影による適応型ROMで構成して結合した。7噴射器のモデル燃焼器で評価した（抄録）。", "p5": "運転条件と形状の変更に伴う自励的な燃焼振動の変化を、動的モード分解のスペクトルと、時間平均・二乗平均平方根の場の特徴で正確に予測できた（抄録）。", "fun": "ロケットエンジン全体を細かく計算すると、最新のコンピュータでも手に負えない。この研究は、エンジンを部品に分け、それぞれの「縮めた計算模型」を作ってからつなぎ合わせた。プラモデルのように部品ごとに作って組み立てる発想で、巨大な計算を現実的な大きさにした点が面白い。", "unverified": "計算の効率化の倍率と誤差の数値は抄録から確認できない。"}}, {"id": "jr37", "rank": 37, "headline": "集中治療の看護師がAI意思決定支援に抱く倫理", "title": "Nurses' Experiences With the Use of Artificial Intelligence‐Supported Decision‐Making Systems and Their Ethical Dimensions: A Qualitative Study", "url": "https://doi.org/10.1111/nicc.70772", "authors": "Saadet Yılmaz ほか", "venue": "Nursing in Critical Care", "date": "2026-11-16", "sjr": 0.85, "citescore": 4.4, "citescore_year": "2025", "apa": "Yılmaz, S., & Gul, S. (2026). Nurses’ Experiences With the Use of Artificial Intelligence‐Supported Decision‐Making Systems and Their Ethical Dimensions: A Qualitative Study. Nursing in Critical Care, 31(6). https://doi.org/10.1111/nicc.70772", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "集中治療室の看護師がAIによる意思決定支援システムを使う経験と、その倫理的な側面を、インタビューで4つの文脈と14の主題に整理した（抄録）。", "p3": "トルコの病院でAIの意思決定支援を使った経験があり、集中治療の経験が2年以上の看護師9人に、オンラインで半構造化の詳細面接を行い、主題分析した（抄録）。", "p5": "文脈は、システム利用の利点、限界、臨床判断の自律性への影響、利用の倫理的な側面の4つだった。著者は、AIの導入は看護の役割と責任を作り変える変化だと結論する（抄録）。", "fun": "AIが「この患者さんには次にこの処置を」と提案してくれる病室で、看護師は助かると感じる一方、自分の判断はどこまで必要なのかと迷うこともある。この研究は、そうした現場の声を丁寧に聞き取った。便利さと責任の重さが同時に増すという、新しい技術と働く人の関係が面白い。", "unverified": "14の主題の具体的な内容は抄録から確認できない。参加者は9人と少ない。"}}, {"id": "jr38", "rank": 38, "headline": "高齢者の家族介護者と医療者の情報共有を総説", "title": "Information Sharing Between Family and Friend Carers of Older Adults and Healthcare Professionals: A Systematic Review of Qualitative Studies", "url": "https://doi.org/10.1111/jgs.70840", "authors": "Steven Hall ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-11-16", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "apa": "Hall, S., Cammer, A., Baskerville, K., Fani, C., Li, Z., Shaw, C., Wagg, A., & Gibson, W. (2026). Information Sharing Between Family and Friend Carers of Older Adults and Healthcare Professionals: A Systematic Review of Qualitative Studies. Journal of the American Geriatrics Society. https://doi.org/10.1111/jgs.70840", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "60歳以上の高齢者を介護する家族・友人と医療者の情報共有について、質的研究62本を統合し、7つの統合された知見にまとめた（抄録）。", "p3": "2025年5月5日に5つのデータベースを検索し、JBIのチェックリストで偏りを評価し、メタ集約と質的メタ要約・頻度効果量で統合した（抄録）。", "p5": "情報共有は時宜を得て明確・継続的である必要がある（頻度効果量48%）、組織・人員・政策の文脈が持続性を左右する（38%）、信頼と共感が協働の基盤（37%）、介護者を正当なパートナーと認める必要（35%）などを示し、情報共有を本人・介護者・医療者の三者の過程として捉えるべきだと論じた（抄録）。", "fun": "家族の介護をする人は、本人の様子を一番よく知っているのに、病院では「付き添いの人」として扱われ、情報の輪から外れがちである。この研究は60本以上の研究をまとめ、介護者を対等な仲間として扱うことが、本人のケアの質と介護者の負担の両方に関わると示した。見えにくい担い手に光を当てた点が面白い。", "unverified": "対象研究の国の内訳と、偏りの評価の結果は抄録から確認できない。"}}, {"id": "jr39", "rank": 39, "headline": "神経多様性を肯定する心理支援の尺度を開発", "title": "Preliminary Development and Psychometric Properties of the Index of Neurodiversity-Affirming Psychological Practice", "url": "https://doi.org/10.1177/25739581261507530", "authors": "Simon M. Bury ほか", "venue": "Autism in Adulthood", "date": "2026-11-16", "sjr": 1.837, "citescore": 11.2, "citescore_year": "2025", "apa": "Bury, S. M., Uljarević, M., O’Brien, C., Hedley, D., Flower, R. L., & Jellett, R. (2026). Preliminary Development and Psychometric Properties of the Index of Neurodiversity-Affirming Psychological Practice. Autism in Adulthood. https://doi.org/10.1177/25739581261507530", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SAGEの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "自閉のある成人が、自分の受ける心理療法が神経多様性を肯定するものかを評価する初めての尺度（iNAPP、60項目・4因子）を開発し、予備的な心理測定的性質を示した（抄録）。", "p3": "当事者と心理士のデルファイ研究から項目を作り、自閉の当事者の助言委員会、認知面接（6人）、予備調査（40人）を経て、心理療法を受けている自閉の成人373人で探索的構造方程式モデルにより因子構造を評価した（抄録）。", "p5": "最終モデルの適合は良好で（CFI 0.973、TLI 0.968、RMSEA 0.038）、自閉について学び続ける姿勢、伝わる伝え方、本来の自分を出せる安全、自閉を理解した支持の4因子からなり、因子の内的一貫性はω=0.715〜0.960だった（抄録）。", "fun": "カウンセリングが自分に合っているかを、受ける側の自閉の人自身が評価する物差しはこれまでなかった。この研究は、当事者と一緒に質問を作り、何百人もの回答でその物差しが一貫して測れることを確かめた。測られる側が物差しづくりに参加するという作り方が面白い。", "unverified": "妥当性（他の尺度との関連など）の検証結果は抄録の範囲で一部しか確認できない。"}}, {"id": "jr40", "rank": 40, "headline": "高級サービスは人とAIの混成が最も本物らしい", "title": "Perceived Authenticity in GenAI‐Mediated Luxury Services: The Role of Delivery Configuration and Need for Uniqueness (NFU)", "url": "https://doi.org/10.1002/mar.70310", "authors": "Jaylan Azer ほか", "venue": "Psychology and Marketing", "date": "2026-11-16", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Azer, J., & Christodoulides, G. (2026). Perceived Authenticity in GenAI‐Mediated Luxury Services: The Role of Delivery Configuration and Need for Uniqueness (NFU). Psychology & Marketing. https://doi.org/10.1002/mar.70310", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "高級サービスの提供を人だけ・生成AIだけ・人とAIの混成で比べると、混成が最も好ましい評価を得て、本物らしさの知覚がその効果を説明することを2つの実験で示した（抄録）。", "p3": "社会技術理論とサービスにおけるAI・高級品の研究を統合し、2つの実験で提供の形の違いが顧客の評価に与える影響と、独自性欲求（NFU）の役割を調べた（抄録）。", "p5": "混成の提供が最も好ましい結果を生み、本物らしさの知覚が効果を媒介し、独自性欲求が提供の形による反応の違いを左右した（抄録）。", "fun": "高級店では、人の手による特別なもてなしが価値の源とされる。そこに生成AIを入れると価値が下がりそうだが、実験では人とAIを組み合わせた形が一番「本物らしい」と評価された。AIか人かではなく、どう組み合わせるかが大事だという点が面白い。", "unverified": "実験の参加者数と効果の大きさは抄録から確認できない。"}}, {"id": "jr41", "rank": 41, "headline": "無人のスマートホテルへの乗り換え意図", "title": "When technological innovation and sustainability meet: extending the push–pull–mooring model of customers’ switching intention to unmanned smart hotels", "url": "https://doi.org/10.1080/10548408.2026.2761076", "authors": "Stephanie Hui-Wen Chuah ほか", "venue": "Journal of Travel and Tourism Marketing", "date": "2026-11-16", "sjr": 2.321, "citescore": 14.1, "citescore_year": "2025", "apa": "Chuah, S. H.-W., Yan, Z., Chen, Z., & Ghazali, M. F. (2026). When technological innovation and sustainability meet: extending the push–pull–mooring model of customers’ switching intention to unmanned smart hotels. Journal of Travel & Tourism Marketing, 1–20. https://doi.org/10.1080/10548408.2026.2761076", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "Journal of Travel and Tourism Marketingの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、顧客が従来のホテルから無人のスマートホテルへ乗り換える意図を、押し・引き・係留（PPM）モデルを拡張し、技術革新と持続可能性の観点から説明する。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、人のいないホテルに泊まってみようと思うのはなぜか、というものである。今のホテルへの不満（押し）、新しいホテルの魅力（引き）、乗り換えをためらわせる事情（係留）の3つで説明する枠組みに、技術と環境への配慮を加える点が題名から読み取れる。", "unverified": "調査の対象と方法、結果はすべて未確認。"}}, {"id": "jr42", "rank": 42, "headline": "中空矩形の橋脚のせん断耐力を9体の実験で検証", "title": "Experimental Investigation on Shear Capacity of Rectangular Hollow-Core Bridge Piers", "url": "https://doi.org/10.1061/jsendh.steng-16692", "authors": "Zhou Lin ほか", "venue": "Journal of Structural Engineering", "date": "2026-11-14", "sjr": 1.206, "citescore": 7.5, "citescore_year": "2025", "apa": "Lin, Z., & Monti, G. (2027). Experimental Investigation on Shear Capacity of Rectangular Hollow-Core Bridge Piers. Journal of Structural Engineering, 153(2). https://doi.org/10.1061/jsendh.steng-16692", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "中空矩形断面の橋脚9体の正負交番載荷実験から、2つのウェブと隣接する4つのフランジ部分を有効せん断面積とするせん断耐力の評価法を提案した（抄録）。", "p3": "断面の縦横比、軸力比、載荷方向、ウェブ幅比、横・縦の鉄筋比を変え、軸力と水平変位を同時に与える実験を行い、提案した有効せん断面積を既往の試験体で評価した（抄録）。", "p5": "フランジの破断で断面がウェブ領域と中央のフランジ領域に分かれ、前者が主にせん断に、後者は主に曲げに抵抗した。提案法の予測はとくにせん断が支配的な試験体で妥当に一致し、斜め方向の載荷は4つのウェブ壁を働かせて初期剛性と最大水平耐力を高めた（抄録）。", "fun": "中が空洞の四角い柱は、軽くて丈夫なので高い橋脚によく使われる。ところが横から強い力を受けたときに、断面のどの部分が力を受け持つのかはよく分かっていなかった。この研究は、実際に柱を壊して割れ方を観察し、力を受け持つ部分を見極めた。壊れ方から設計の決まりを作る点が面白い。", "unverified": "予測の誤差の数値は抄録から確認できない。"}}, {"id": "jr43", "rank": 43, "headline": "被災した橋脚の部材を組み直した梁の曲げ性能", "title": "Flexural performance of beams reassembled from earthquake-damaged bridge pier segments: Experimental and numerical investigation", "url": "https://doi.org/10.1016/j.istruc.2026.113553", "authors": "Tianyu Xie ほか", "venue": "Structures", "date": "2026-11-16", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Xie, T., Lan, H., Li, G., Guo, T., Liu, X., Goksu, C., & Xu, T. (2026). Flexural performance of beams reassembled from earthquake-damaged bridge pier segments: Experimental and numerical investigation. Structures, 94, 113553. https://doi.org/10.1016/j.istruc.2026.113553", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Structuresの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、地震で損傷した橋脚のセグメント（分割された部材）を組み直して梁として使ったときの曲げ性能を、実験と数値解析で調べる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、地震で傷んだ橋の柱の部品を捨てずに組み直し、別の用途の梁として再利用できるか、というものである。壊れたものの残りの力を測って使い道を探す点に、資源を無駄にしない発想が題名から読み取れる。", "unverified": "試験体の構成、解析の方法、曲げ性能の結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "LLMと強化学習で長大橋の主塔を設計", "title": "Intelligent design of long-span bridge pylons using large language models and reinforcement learning for structural optimization and aesthetic refinement", "url": "https://doi.org/10.1016/j.istruc.2026.113474", "authors": "Cheng Xiang ほか", "venue": "Structures", "date": "2026-11-16", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Xiang, C., Liu, L., Ning, Y., Yu, T., Chen, A., Briseghella, B., & Wang, D. (2026). Intelligent design of long-span bridge pylons using large language models and reinforcement learning for structural optimization and aesthetic refinement. Structures, 94, 113474. https://doi.org/10.1016/j.istruc.2026.113474", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Structuresの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、大規模言語モデル（LLM）と強化学習を使って、長大橋の主塔の構造の最適化と見た目の美しさの調整を行う設計手法を扱う。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、吊り橋や斜張橋の巨大な塔の形を、強さだけでなく美しさまで考えてAIに設計させられるか、というものである。言葉で美しさを扱えるLLMと、試行錯誤で最適な形を探す強化学習を組み合わせる点が、題名から読み取れる工夫である。", "unverified": "設計の対象、評価の方法、結果はすべて未確認。"}}, {"id": "jr45", "rank": 45, "headline": "港湾のScope 3算定と気候開示の研究を整理", "title": "Translating Scope 3 Carbon Accounting Into Climate Disclosure in Maritime‐Port Ecosystems: A Systematic Literature Review", "url": "https://doi.org/10.1002/bse.71870", "authors": "Assunta Di Vaio ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-16", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Di Vaio, A., Esposito, A., D’Amore, G., & Mastellone, L. (2026). Translating Scope 3 Carbon Accounting Into Climate Disclosure in Maritime‐Port Ecosystems: A Systematic Literature Review. Business Strategy and the Environment. https://doi.org/10.1002/bse.71870", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "港湾の生態系でのScope 3（自社の外のサプライチェーンの排出）の炭素会計を気候開示へつなぐ過程を、境界の設定や検証などに依存する「翻訳」の過程として概念化した（抄録）。", "p3": "査読論文114本（Scopus 84本、Google Scholar 30本）を体系的にレビューし、書誌分析と質的内容分析を組み合わせた（抄録）。", "p5": "研究はScope 3の算定と境界設定、気候開示と説明責任、デジタル基盤と追跡可能性の3領域にまとまり、排出の測定や脱炭素が中心で、開示の信頼性と分散した説明責任への関心は小さかった。理論に基づく枠組みとTCCMに基づく研究課題を示した（抄録）。", "fun": "港では船会社、倉庫、トラック会社など多くの組織が関わるので、二酸化炭素の排出を「誰の分」として数えるかが難しい。この研究は、排出を数えることと、それを報告して責任を明らかにすることの間には、境界の決め方や検証という「翻訳」の段階があると整理した。数えることと伝えることの違いに注目した点が面白い。", "unverified": "レビューの選定基準の詳細は抄録から確認できない。"}}, {"id": "jr46", "rank": 46, "headline": "言語モデルで建設業の政策文書を利害関係者別に分類", "title": "Language model-based stakeholder-specific policy texts classification of GBA construction industry cross-regional collaboration", "url": "https://doi.org/10.1108/ecam-10-2025-1620", "authors": "Binwei Gao ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-16", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Gao, B., Xiao, L., Wang, R., Ma, R., Miao, J., He, D., & Shen, G. Q. (2026). Language model-based stakeholder-specific policy texts classification of GBA construction industry cross-regional collaboration. Engineering, Construction and Architectural Management, 1–38. https://doi.org/10.1108/ecam-10-2025-1620", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "粤港澳大湾区の建設業の地域間協力に関する政策文書を、利害関係者ごとに自動分類する言語モデル（LFGNBert）を作り、その結果を使ったLLMの相談システムの回答の正確さを高めた（抄録）。", "p3": "BERTに複数の注意機構とグラフネットワークを融合したモデルで政策文書を分類し、推論結果をもとに検索拡張生成（RAG）のLLMの相談システムを構築して4つの質問形式で評価した（抄録）。", "p5": "重みつきの適合率・再現率・F1は0.9723、0.9717、0.9716で、従来のBERTより約5%高かった。相談システムは未処理の文書からの検索に比べ、回答の正確さが4つの質問形式で5〜9%改善した（抄録）。", "fun": "政策の文書は大量で、建設会社、役所、技術者など立場によって知りたいことが違う。この研究は、文書を「誰に関係するか」でAIに仕分けさせてから質問に答えさせると、答えの正確さが上がることを示した。整理してから探すと見つけやすいという、図書館のような発想が面白い。", "unverified": "分類の対象の文書数と、利害関係者の区分の数は抄録から確認できない。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経営学", "headline": "1位価格の広告オークションで入札の減額が不足", "title": "EXPRESS: Slim Shading in Ad Auctions: Adjustment of Bidding Strategies to First-Price Rules", "url": "https://doi.org/10.1177/00222437261511019", "authors": "Robert Zeithammer ほか", "venue": "Journal of Marketing Research", "date": "2026-11-16", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Zeithammer, R., & Alcobendas, M. (2026). EXPRESS: Slim Shading in Ad Auctions: Adjustment of Bidding Strategies to First-Price Rules. Journal of Marketing Research. https://doi.org/10.1177/00222437261511019", "why": "大規模な広告取引所が2位価格から1位価格のオークションに切り替えた際の入札の調整を調べた。入札者が直面した競争の局所的な指標から各入札の評価額の下限を推定する非パラメトリックな方法を作り（入札者の対称性・評価の独立性・均衡を仮定しない）、主要8社の需要側プラットフォームの4,000万件超のオークションで、減額（シェーディング）が広く不足していたと報告する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（EXPRESSの早期公開版）を使用。本文は取得できず", "preprint": false, "p1": "大規模な広告取引所が2位価格から1位価格のオークションに切り替えた後、主要8社の需要側プラットフォーム（DSP）のアルゴリズムによる入札の減額（シェーディング）が少なくとも3か月にわたって不十分だったことを、新しい非パラメトリックな推定法で示した（抄録）。", "p2": "1位価格のオークションでは、入札者は評価額より戦略的に低く入札すべきだが、実際の減額が直面する競争に照らして十分かを判断するには、観測できない評価額を知る必要があった（抄録）。", "p3": "各入札の背後の評価額の下限を、局所的な競争の指標から推定する非パラメトリックな推定量を作った。入札者の対称性、評価額の独立性、均衡の入札の仮定を必要としない（抄録）。", "p4": "4,000万件を超えるオークションに適用し、切り替えの前後で推定した評価額の下限を比べた。局所的な競争の定義の変更、より多くの条件づけの情報、推定量の仮定の変更で頑健性を確かめた（抄録）。", "p5": "切り替え後に減額の不足が広く見られた。推定した評価額の下限は切り替え後少なくとも3か月、切り替え前の水準を大きく上回ったままで、調べたどの入札者も十分に減額していなかった（抄録）。", "p6": "解釈：抄録からは、減額の不足による支払いの増加額などの数値は分からない。著者は、高度なアルゴリズムの入札者でも大きな制度変更への調整は驚くほど遅く、短期のA/Bテストの解釈に注意が要ると示唆する（抄録）。", "fun": "ネット広告の枠は一瞬のオークションで売られる。ルールが「2番目に高い値段を払う」から「自分の言い値を払う」に変わったら、賢い入札者は入札額を下げるはずである。ところがコンピュータで自動入札する大手8社でさえ、3か月たっても十分に下げられていなかった。機械でも新しいルールに慣れるのは遅い、という発見が面白い。", "unverified": "本文を読めておらず、推定量の詳細、減額の不足の大きさ、取引所の名前は未確認。"}}, {"id": "jn02", "rank": 2, "field": "オペレーションズ・リサーチ", "headline": "顧客属性に応じた品揃えの探索を最適化", "title": "Exploration Optimization for Dynamic Assortment Personalization under Linear Preferences", "url": "https://doi.org/10.1287/opre.2022.0205", "authors": "Fernando G. Bernstein ほか", "venue": "Operations Research", "date": "2026-11-16", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Bernstein, F. G., Modaresi, S., & Saure, D. (2026). Exploration Optimization for Dynamic Assortment Personalization under Linear Preferences. Operations Research. https://doi.org/10.1287/opre.2022.0205", "why": "オンライン小売が顧客の属性に応じて品揃えを選びながら選好を学ぶ動的な個別化で、効用が属性に線形に依存するとき、価格と線形性による探索の効率化があり、すべての商品をすべての顧客に見せなくても最適な品揃えが分かることを示した。線形計画で表される事例依存の後悔の下限を導いた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "オンライン小売が顧客の属性に応じて品揃えを選びながら好みを学ぶ動的な個別化で、すべての商品をすべての顧客像に見せなくても最適な品揃えが分かる「探索の効率化」を明らかにし、それを使った学習の方針が実データでトンプソン抽出より後悔（取り逃した収益）と計算の両面で優れることを示した（抄録）。", "p2": "商品の効用が顧客の属性に未知の係数行列を通じて線形に依存するとき、好みを学ぶための探索と、収益を上げるための活用のトレードオフが生じる（抄録）。", "p3": "価格に起因する効率と線形性に起因する効率という2種類の探索の効率を特定し、線形計画で表される事例依存の後悔の下限（RLB問題）を導いた（抄録）。RLBは構造が複雑で未知のパラメータに依存するため、解釈しやすい探索の構造を持ち、扱いやすい混合整数線形計画として解ける別の定式化（探索最適化問題）を導入し、いずれかを解いて効率的な探索集合を選ぶ方針を作り、探索最適化の方針の後悔の上界を示した（抄録）。", "p4": "チリの大手小売のデータで、後悔と計算効率をトンプソン抽出と比べた（抄録）。", "p5": "提案した方針は、後悔と計算効率の両方でトンプソン抽出を大きく上回り、実務的な規模に拡張可能だった（抄録）。", "p6": "解釈：効用が属性に線形という仮定に依存し、抄録からは改善の大きさの数値、比較した他の方法、顧客の選択モデル（多項ロジットなど）の詳細は分からない。", "fun": "ネット通販で、客の年齢や住む地域に応じて見せる商品を変えれば売上は伸びるが、そのためには誰が何を好むかを試しながら学ぶ必要がある。この研究は、全員に全商品を見せて試さなくても、値段の違いや好みの規則性を利用すれば、少ない試しで最適な並べ方が分かることを数学的に示した。試し方そのものを最適化する発想が面白い。", "unverified": "本文を読めておらず、後悔の上界の形、実データでの改善の大きさは未確認。"}}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "ブランドの商品を歩合で売るギグ販売員の働き方", "title": "EXPRESS: How Gig Sellers Do the Hustle", "url": "https://doi.org/10.1177/00222429261510754", "authors": "Eileen Fischer ほか", "venue": "Journal of Marketing", "date": "2026-11-16", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "apa": "Fischer, E., & Jap, S. D. (2026). EXPRESS: How Gig Sellers Do the Hustle. Journal of Marketing. https://doi.org/10.1177/00222429261510754", "why": "特定のブランドの商品をマーケティングの支援を受けて売り、給与や福利厚生なしに歩合だけで報酬を得るギグ販売員という市場の担い手を概念化した。成果を上げる販売員の大量の質的データから、帰納と仮説形成によって理論的な洞察を導く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（EXPRESSの早期公開版）を使用。本文は取得できず", "preprint": false, "p1": "特定のブランドの商品をマーケティングの支援を受けて歩合だけで売る「ギグ販売員」という見過ごされてきた市場の担い手を概念化し、成果を上げる販売員は予測に基づく実践よりエフェクチュエーション（手持ちの手段から機会を作る）に基づく実践に大きく頼っていることを示した（抄録）。", "p2": "ギグ販売員は顧客の獲得から成約までを一人で担う半ば起業家的な立場だが、新製品を開発する通常の起業家とも、給与や福利厚生のある組織の営業担当者とも異なり、その働き方は理論的に扱われてこなかった（抄録）。", "p3": "成果を上げている販売員の大量の質的データを、文献と分析の両方から帰納と仮説形成（アブダクション）で検討し、販売員が自分にとって重要なことを達成するために機会をどう捉えるかを解き明かした（抄録）。", "p4": "質的研究であり、統計的な比較の基準はない。理論的な洞察は、組織に属する営業担当者や他の独立代理人の知見と対比された（抄録）。", "p5": "エフェクチュエーション（手持ちの手段や関係から機会を作り出す考え方）に基づく実践への依存が、満足な成果の達成に決定的だった。ギグ販売の行き先として、ギグ販売にとどまる（長期の忠誠、チームの移籍、副収入の充実）か、起業や雇用といった別の機会の通路に進むかという幅広い結果を示した（抄録）。", "p6": "解釈：成果を上げた販売員だけを対象にしており、うまくいかなかった販売員との比較はない。データの国や人数、ブランドの種類は抄録から分からない。", "fun": "化粧品や健康食品を、給料なしの歩合だけで知り合いに売る人たちがいる。会社員の営業とも、自分で商品を作る起業家とも違う、この中間の働き方を正面から研究した。うまくいく人は、綿密な計画を立てるより、手元の人脈や得意なことから機会を広げていた。働き方の新しい分類を作った点が面白い。", "unverified": "本文を読めておらず、データの規模と出所、分析の手続きの詳細は未確認。"}}, {"id": "jn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "上司との1on1の量と質がエンゲイジメントを高める", "title": "One Meeting That Should Not Be an Email: Manager–Direct Report One‐on‐One Meetings and Employee Engagement", "url": "https://doi.org/10.1002/job.70134", "authors": "Jon Gray ほか", "venue": "Journal of Organizational Behavior", "date": "2026-11-16", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "apa": "Gray, J., Flinchum, J., Rogelberg, S., Gerson, M. J., Dilley, N. J., & Kreamer, L. (2026). One Meeting That Should Not Be an Email: Manager–Direct Report One‐on‐One Meetings and Employee Engagement. Journal of Organizational Behavior. https://doi.org/10.1002/job.70134", "why": "仕事の要求度-資源（JD-R）理論、自己決定理論、Kahnのエンゲイジメント理論に基づき、上司と部下の1対1の面談（1on1）の回数と質が従業員のエンゲイジメントを高めるという仮説を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "上司と部下の1対1の面談（1on1）は、回数よりも、面談での上司の課題志向・関係志向の振る舞いという「質」が、部下の基本的な心理的欲求を満たすことを通じてワーク・エンゲイジメントと一貫して結びつくことを示した（抄録）。", "p2": "エンゲイジメントの先行要因と効果はよく知られているのに、組織は従業員のエンゲイジメントを保つのに苦労しており、実践的な別の手立てが求められていた（抄録）。", "p3": "仕事の要求度-資源（JD-R）理論、自己決定理論（SDT）、Kahnのエンゲイジメント理論に基づき、1on1の量と質が自律性・有能感・関係性の欲求の充足を通じてエンゲイジメントを高めるという調整つき媒介のモデルを立て、時間を空けた2回のオンライン調査（N=303）で検証した（抄録）。", "p4": "評価はモデルの経路の有意性で、上司が1on1以外で同じ振る舞いをする程度を統制しても関連が残るかを確かめた（抄録）。", "p5": "1on1での上司の課題志向・関係志向の振る舞いに表れる面談の質は、面談の回数よりも一貫してエンゲイジメントと関連した。この関係は、上司が1on1の外で同じ振る舞いをする程度を考慮しても残り、1on1が個別で同時的な支援のための独自の場であることを示唆した（抄録）。", "p6": "解釈：自己報告の調査による関連の分析で、因果は確定しない。調整変数の内容と効果の大きさ、回答者の職種・国は抄録から分からない。", "fun": "「その会議、メールで済んだよね」と言われがちだが、上司と部下の1対1の面談は別かもしれない。この研究では、面談の回数を増やすより、面談の中で上司が仕事の手助けをし、相手を気づかうことの方が、部下のやる気と結びついていた。会う回数より会い方が大事だ、という当たり前のようで確かめられていなかったことを示した点が面白い。", "unverified": "本文を読めておらず、尺度の内容、調整効果の結果、係数の大きさは未確認。"}}, {"id": "jn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "障害者に意味ある仕事が届かなくなる仕組み", "title": "When meaningful work becomes inaccessible: Disability, ableism and passive agency", "url": "https://doi.org/10.1177/00187267261499886", "authors": "Linna Sai ほか", "venue": "Human Relations", "date": "2026-11-16", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Sai, L., Williams, J., & Gao, G. (2026). When meaningful work becomes inaccessible: Disability, ableism and passive agency. Human Relations. https://doi.org/10.1177/00187267261499886", "why": "意味のある仕事への接近が特定の集団で構造的に制約される理由を、Archerの能動的・受動的エージェンシーの区別から、構造的な制約が働きかける力そのものを制限する受動的エージェンシーとして概念化した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "中国の障害のある労働者33人へのインタビューから、能力主義的な差別（エイブリズム）が構造的な制約として働き、労働者を「受動的なエージェント」の位置に置くことで、自律・尊厳・承認の機会を奪い、意味のある仕事への接近を体系的に閉ざす仕組みを示した（抄録）。", "p2": "意味のある仕事への接近は主観的な経験と客観的な条件の両方に左右されると認められてきたが、その接近がなぜ特定の集団で体系的に制約されるのかは不明確だった。先行研究は労働者が条件に働きかけ交渉し抵抗する能動的な主体性を強調し、その力自体が制限される仕組みには踏み込んでいなかった（抄録）。", "p3": "Archerの能動的・受動的エージェンシーの区別に基づき、受動的エージェンシーを「構造的な制約が目的のある行為の能力を制限する仕組み」として概念化し、中国の障害のある労働者33人の面接を分析した（抄録）。", "p4": "質的研究で、統計的な比較の基準はない（抄録）。", "p5": "エイブリズムは構造的な制約として障害のある労働者を受動的なエージェントに位置づけ、自律・尊厳・承認の機会を限ることで、仕事を意味あるものとして経験する力を制限していた。一方で、より能動的な主体性が発揮され、意味のある仕事が保たれうる条件（状況に依存する条件）も明らかにした（抄録）。", "p6": "解釈：中国の33人の面接に基づく理論化で、他の国や障害の種類への一般化は確かめる必要がある。能動的な主体性が発揮される条件の具体的な内容は抄録から分からない。", "fun": "やりがいのある仕事は、本人の気の持ちようや努力で見つけられる、と言われがちである。この研究は、障害のある人が職場で「できない人」として扱われ続けると、そもそも自分で選んだり工夫したりする余地が奪われ、やりがいを感じる入口が閉ざされることを描いた。努力する力そのものが環境に左右される、という視点が面白い。", "unverified": "本文を読めておらず、面接の対象者の属性、分析の手続き、具体的な事例は未確認。"}}, {"id": "jn06", "rank": 6, "field": "地震工学・防災", "headline": "ネパール・中国国境の氷河崩落から洪水への連鎖", "title": "The 26 August 2026 Cascading Disaster at the Nepal-China Border: A Transboundary Hazard Chain and Its Implications for Early Warning", "url": "https://doi.org/10.1007/s13753-026-00786-y", "authors": "Wenzhuo Wang ほか", "venue": "International Journal of Disaster Risk Science", "date": "2026-11-16", "sjr": 1.225, "citescore": 8.4, "citescore_year": "2025", "apa": "Wang, W., & Yang, S. (2026). The 26 August 2026 Cascading Disaster at the Nepal-China Border: A Transboundary Hazard Chain and Its Implications for Early Warning. International Journal of Disaster Risk Science. https://doi.org/10.1007/s13753-026-00786-y", "why": "2026年8月26日にネパールのランタン・リルン（7,234 m）の氷河で始まり、数分で土石流となって中国の吉隆口岸を壊滅させ、ネパールへ戻る長距離の洪水となった国境をまたぐ災害の連鎖を、地震記録・衛星の迅速評価・公的報告から再構成した。崩落は当初M4.4の地震として記録され、後に地震規模相当5.2の地すべりに分類し直され、約20 km離れた口岸に6〜7分で到達した。", "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（事象の時空間の特徴、災害の連鎖と増幅の仕組み、早期警報の盲点）を読んだ。第5節の統治の提言は一部のみ読んだ", "preprint": false, "p1": "2026年8月26日にネパールのランタン・リルンの氷河斜面で始まり、数分で土石流となって中国の吉隆口岸を壊滅させ、ネパールへ戻る長距離の洪水になった国境をまたぐ災害の連鎖を、地震記録・衛星の迅速評価・公的報告から再構成し、既存の早期警報の4つの盲点を示した（抄録、§4）。", "p2": "高山アジアでは2000年以降に氷河の質量が加速的に失われ、雪氷に関わる災害の連鎖が懸念されているが、ヒマラヤの早期警報は氷河湖決壊（GLOF）とモンスーンの雨を前提に組まれていた（抄録）。", "p3": "地震観測網の記録、衛星の迅速評価、査読済みの事後解析（Sentinel-2の221シーン）、中国・ネパールの公的報告を突き合わせて時系列と距離・規模を整理し、数分単位の初期の連鎖と、数日にわたる堰き止め湖の段階を区別した（§2、§3）。", "p4": "評価は既存の警報の枠組み（国連のEW4Allの4本柱）の想定に照らした事例の診断で、統計的な検証ではない（§4）。", "p5": "標高約5,200〜5,300 mで起きた崩落は当初M4.4の地震として記録され、後に地震規模相当5.2の地すべりに分類し直された。約20 km離れた口岸に6〜7分で到達し、平均速度は時速170〜200 km程度と見積もられた（§2）。口岸の約0.7 km²と27棟が倒壊し、堰き止め湖は250万m³まで拡大後に自然排水した。死者・行方不明は中国で43人・519人、ネパールで1,451人・約5,786人と報告された（抄録）。発生源に氷河湖がなく、事前の大雨もなかったため、湖の目録、雨量の閾値、地震の種別の即時判定、前兆の監視のいずれの警報も働かなかった（§4）。", "p6": "解釈：被害の数値は報告時点で変わりうる値で（§2）、増幅の主因を土砂の取り込みの段階とする解釈は推定を含む（§3）。著者は中国とネパールの共同の監視・警報・緊急対応の枠組みが必要だとする（抄録）。", "fun": "氷河の災害というと、氷河湖があふれる洪水を思い浮かべる。ところがこの災害では湖がなく、雨も降っていなかったのに、氷と岩の崩落が数分で谷を駆け下り、時速200 km近い土石流になった。地震計は揺れを捉えたが、最初は地震と間違えられた。想定の「外側」で起きた災害が、警報の仕組みの穴をあぶり出した点が重い。", "unverified": "第5節の提言の具体的な内容と、前兆の監視の盲点（第4の盲点）の詳細は読み切れていない。"}}, {"id": "jn07", "rank": 7, "field": "ヒューマンコンピュータインタラクション", "headline": "バレエの微小な不安定さを音で知覚できるように", "title": "The Sound of (iN)stability: Making Subtle Movement Fluctuations Perceptible via Material Metaphor Sonification in Ballet", "url": "https://doi.org/10.1145/3862641", "authors": "María Concepción Valdez Gastelum ほか", "venue": "ACM Transactions on Computer-Human Interaction", "date": "2026-11-12", "citescore": 16.0, "citescore_year": "2025", "apa": "Gastelum, M. C. V., Stambor, Y., Cibrian, F., Tajadura-Jiménez, A., & Tentori, M. (2026). The Sound of (iN)stability: Making Subtle Movement Fluctuations Perceptible via Material Metaphor Sonification in Ballet. ACM Transactions on Computer-Human Interaction. https://doi.org/10.1145/3862641", "why": "バレエの制御に重要な微小な不安定さは通常のフィードバックでは捉えにくいとして、ダンサーと共同設計した対話型の可聴化インタフェースSONAを開発し、肘の動きのデータを自然の変化に着想を得た音の質感に写像して不安定さを知覚できるようにした。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "バレエの動きの中の微小な不安定さを、自然の変化を思わせる比喩的な音に変えて知覚できるようにする対話型の可聴化（ソニフィケーション）のインタフェースSONAを作り、ダンサー24人の実験で不安定さへの気づきを高め、不安定な事象の頻度と長さを減らしたことを示した（抄録）。", "p2": "動きには常に安定と不安定の行き来があり、バレエでは不安定さへの微妙な出入りを認識して制御することが滑らかさの鍵だが、こうした微小な不安定さは通常のフィードバック（鏡や指導者の言葉など）では捉えにくい（抄録）。", "p3": "バレエのダンサーと共同設計し、両肘の動きのデータを自然の変化（素材の変形など）に着想を得た移り変わる音の質感に写像した。閾値に基づくアルゴリズムで利用者ごとの動きの連続性の乱れを検出し、適応的なフィードバックとして音で知らせる（抄録）。", "p4": "ダンサー24人の参加者内比較の実験で、不安定さへの接近のしやすさ、利用者の経験、不安定な事象の頻度と持続時間を評価した（抄録）。", "p5": "SONAは不安定さへの気づきを改善し、利用者の経験を高め、不安定な事象の頻度と持続時間を減らした。参加者は音を直感的で意味のあるものと述べ、身体への気づきが高まったと報告した（抄録）。", "p6": "解釈：比較の条件（音なし、または別の音）の詳細、効果の大きさ、練習の長期的な効果は抄録から分からない。肘のデータだけに基づく設計で、全身の不安定さをどこまで捉えるかは確かめる必要がある。", "fun": "片足で立つと、体はわずかにふらつき続けている。バレエではこの小さなふらつきを感じ取って整えることが大切だが、自分では気づきにくい。この研究は、肘の動きのぶれを「氷がきしむ」ような自然を思わせる音に変えて聞かせた。目で見るのではなく耳で体の状態を知る、という感覚の置き換えが面白い。", "unverified": "本文を読めておらず、音の設計の具体例、統計の検定の結果、比較条件は未確認。"}}, {"id": "jn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "非倫理的な上司と部下の非倫理的な創造性は逆U字", "title": "Unethical Leadership and Employee Creative Unethicality—Do Dark Personalities Matter?", "url": "https://doi.org/10.1111/1467-8551.70126", "authors": "Janja Annabel Tardios ほか", "venue": "British Journal of Management", "date": "2026-11-16", "sjr": 2.694, "citescore": 12.4, "citescore_year": "2025", "apa": "Tardios, J. A., Uddin Ahmed, F., Mostafiz, M. I., Rahman, P. N. A., Tarba, S. Y., Wijayaratna, K., & Owolabi, H. A. (2026). Unethical Leadership and Employee Creative Unethicality—Do Dark Personalities Matter? British Journal of Management. https://doi.org/10.1111/1467-8551.70126", "why": "自己調整理論に基づき、非倫理的なリーダーシップの程度と部下の非倫理的な創造性が逆U字の関係にあり、ダークトライアドの性格特性で条件づけられると論じ、468人の時間差調査で検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "上司の非倫理的なリーダーシップの程度と、部下の「非倫理的な創造性」（規範に反する独創的な行動）は逆U字の関係にあり、その関係は部下のマキャベリズムとサイコパシーの傾向が強いほど強まることを示した（抄録）。", "p2": "従業員の創造性が非倫理的な形をとることもあると分かってきたが、その理解は限られていた。リーダーの行動が創造性を促すなら、非倫理的な創造性も非倫理的なリーダーシップに支えられているかもしれない（抄録）。", "p3": "自己調整理論の「焦点の筋」の考え方に基づき、非倫理的なリーダーシップの程度が中程度で非倫理的な創造性が最も高く、強すぎると自己調整が働いてかえって倫理的な解決を求めるという逆U字の仮説と、ダークトライアド（マキャベリズム、サイコパシー、ナルシシズム）による調整の仮説を立て、バングラデシュ・インド・マレーシアの26社の従業員468人の時間差の調査で検証した（抄録）。", "p4": "評価は回帰の二次の項と交互作用の有意性で、比較の対照群はない（抄録）。", "p5": "仮説どおりの逆U字の効果が確認され、この関係は部下のマキャベリズムとサイコパシーによって正に調整された。非倫理的なリーダーシップが強い状況でも、自己調整に導かれる部下はより倫理的な解決を追求しうるが、マキャベリズムやサイコパシーの傾向があると自己調整が損なわれ、非倫理的な創造性が起きやすくなる（抄録）。", "p6": "解釈：自己報告の調査で、非倫理的な創造性の測定が社会的望ましさに影響されうる。ナルシシズムの調整効果の結果は抄録に記されておらず、3か国以外への一般化も確かめる必要がある。", "fun": "ずるい上司の下では、部下もずる賢い工夫をするようになるのか。この研究では、上司のずるさが中くらいのとき部下の「悪知恵」が最も増え、上司が度を越すと、部下はかえって正しいやり方を探す傾向があった。ただし、もともと人を操ることをいとわない性格の部下では、歯止めが効きにくかった。単純な比例関係ではない点が面白い。", "unverified": "本文を読めておらず、効果の大きさ、尺度の内容、時間差の間隔は未確認。"}}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "社員の思想に合うCEOの社会的発言と生産性", "title": "From Symbolic Action to Substantive Outcomes: The Positive Relationship Between Ideologically Aligned CEO Activism and Employee Productivity", "url": "https://doi.org/10.1111/corg.70069", "authors": "G. Alessandra Rizzi ほか", "venue": "Corporate Governance: An International Review", "date": "2026-11-16", "sjr": 1.992, "citescore": 8.7, "citescore_year": "2025", "apa": "Rizzi, G. A., & Misangyi, V. F. (2026). From Symbolic Action to Substantive Outcomes: The Positive Relationship Between Ideologically Aligned CEO Activism and Employee Productivity. Corporate Governance: An International Review. https://doi.org/10.1111/corg.70069", "why": "2015〜2019年のS&P 1500のCEO1,026人のパネルで、CEOの社会的・政治的な発言（CEOアクティビズム）が従業員の思想と一致するほど従業員の生産性が高く、その関係は分極化した業界・企業で強まると報告する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "CEOが社会・政治的な問題について公に立場を示すCEOアクティビズムが、従業員の思想的な傾向と一致しているほど従業員の生産性が高く、その関係は思想的に分極化した業界や企業で強まることを、S&P 1500のCEOのパネルで示した（抄録）。", "p2": "CEOアクティビズムは経営トップの間で広がっているが、それが企業の実質的な成果と関連するか、どんな条件でそうなるかはほとんど分かっていなかった（抄録）。", "p3": "利害関係者との整合という見方と、経営者の象徴的な行為の意味づけという見方を統合し、CEOアクティビズムを実質的な組織の帰結を持つ象徴的な行為として理論化した。2015〜2019年に観察したS&P 1500のCEO1,026人のパネルで、アクティビズムと従業員の思想の一致と従業員の生産性の関係、分極化による調整を推定し、補足の媒介分析を行った（抄録）。", "p4": "評価は関連の符号と有意性、分極化した業界・企業での関連の強まりで、比較の基準は思想の一致が低い場合である（抄録）。", "p5": "CEOアクティビズムと従業員の思想の一致は従業員の生産性と正に関連し、その関係は分極化の高い業界と企業で増幅された。補足の媒介分析は、思想が一致するアクティビズムが従業員の好ましい態度を通じて生産性に結びつくという想定の仕組みと整合する証拠を示した（抄録）。", "p6": "結果は関連（associated）として述べられており、因果の識別ではない（抄録）。解釈：従業員の思想の測り方（政治献金など）と生産性の指標の定義は抄録から分からない。", "fun": "社長がSNSなどで社会問題について意見を言うと、会社の業績に影響するのだろうか。この研究では、社長の主張が社員の多数派の考え方と合っている会社ほど、社員一人あたりの生産性が高かった。しかも世の中で意見が割れている業界ほど、その関係が強かった。言葉だけに見える行動が、働く人の力の入れ方とつながっている点が面白い。", "unverified": "本文を読めておらず、思想の一致と生産性の測り方、効果の大きさは未確認。"}}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "保険の株式会社と相互会社が併存する理由", "title": "Insurer Capital and Organizational Forms in Market Equilibrium", "url": "https://doi.org/10.1093/rcfs/cfag034", "authors": "Ajay Subramanian ほか", "venue": "Review of Corporate Finance Studies", "date": "2026-11-15", "sjr": 3.738, "citescore": 4.8, "citescore_year": "2025", "apa": "Subramanian, A., & Wang, J. (2026). Insurer Capital and Organizational Forms in Market Equilibrium. Review of Corporate Finance Studies. https://doi.org/10.1093/rcfs/cfag034", "why": "株式会社と相互会社という保険会社の組織形態が併存し市場によって優勢が異なることを、自己資本の便益と費用と経営効率を内生的に反映する市場均衡モデルで説明した。相互会社化は税や代理人費用とともに増え、保険契約者の損失の平均と固有の変動とともに減るなどの予測を米国の保険データで確かめた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "保険会社の株式会社と相互会社という2つの組織形態が併存し、市場によってどちらが優勢かが違うことを、自己資本の便益と費用と経営の効率を内生的に反映する市場均衡のモデルで説明し、米国の保険データでモデルの予測をすべて支持した（抄録）。", "p2": "株式会社（株主が出資する）と相互会社（契約者が出資者を兼ねる）の保険会社が同じ市場で長く併存し、市場によって優勢な形態が異なる理由は、組織形態を均衡の結果として説明する理論では十分に扱われていなかった（抄録）。", "p3": "組織形態が自己資本の便益と費用、保険会社の経営の効率の影響を内生的に反映する市場均衡のモデルを作り、相互会社化（相互会社の割合）が税・代理人費用・損失のリスク・市場の収益とどう関係するかの予測を導いた（抄録）。", "p4": "米国の保険データで、モデルから導いた予測を検証した（抄録）。データの期間や種目は抄録から分からない。", "p5": "株式会社の保険会社は相互会社より大きく効率的だった。相互会社化は（1）税と代理人費用とともに増え、（2）契約者の損失の平均と固有の変動とともに減り、（3）保険会社全体の資産と負債のリスクとともに増え、（4）契約者の損失の分散が低い（高い）とき市場の収益とともに増える（減る）。米国の保険データはこれらの予測をすべて支持した（抄録）。", "p6": "解釈：抄録からは、実証の方法（どの指標でどう推定したか）と効果の大きさは分からない。日本の生命保険のように相互会社から株式会社への転換が起きた市場への当てはまりは、本文で確かめる必要がある。", "fun": "保険会社には、株主がいる株式会社と、加入者みんなが持ち主の相互会社がある。なぜ両方が生き残っているのかを、経済学のモデルで説明した研究である。税金が重いときや、経営者が勝手をしやすいときは相互会社が有利になる、といった条件を数式で示し、米国のデータで確かめた。会社の「形」そのものが市場の条件で決まるという見方が面白い。", "unverified": "本文を読めておらず、モデルの詳細と実証の方法・結果の数値は未確認。"}}, {"id": "jn11", "rank": 11, "field": "経営学", "headline": "トランスジェンダーの消費者に見る曖昧な脆弱性", "title": "Ambiguous Consumer Vulnerability: How Transgender Consumers Navigate the Co-Constitution of Agency and Harm", "url": "https://doi.org/10.1177/10946705261496837", "authors": "Varala Maraj ほか", "venue": "Journal of Service Research", "date": "2026-11-16", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Maraj, V., Campana, M., & Venkatraman, R. (2026). Ambiguous Consumer Vulnerability: How Transgender Consumers Navigate the Co-Constitution of Agency and Harm. Journal of Service Research. https://doi.org/10.1177/10946705261496837", "why": "英国のトランスジェンダーの消費者の民族誌から、市場への参加で主体性を発揮すること自体が害を生む「曖昧な消費者の脆弱性」を概念化した。市場から退出できないため消費者は意図して害を引き受け、法的な不安定さがその曖昧さを持続させると論じ、回避・教育・同調の3つの戦略を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "英国のトランスジェンダーの消費者の民族誌から、市場への参加で主体性を発揮すること自体が害を生む「曖昧な消費者の脆弱性」という概念を作り、消費者がそれを解消するのではなく、回避・教育・同調の3つの戦略でやりくりしていることを示した（抄録）。", "p2": "消費者の脆弱性の研究は、害と主体性を対立するものとして扱い（市場の資源への接近が制限されると主体性が損なわれ、主体性を回復すれば害が減る）、脆弱な消費者が制約はあっても安定した法的地位にあると前提してきた（抄録）。", "p3": "英国に住むトランスジェンダーの消費者を対象に民族誌の調査を行い、市場への参加の経験から、主体性と害が同時に構成される過程と、法的な不安定さの影響を分析した（抄録）。", "p4": "質的研究であり、統計的な比較の基準はない（抄録）。", "p5": "市場は避けられずアイデンティティとwell-beingの中心にあるため退出は選択肢にならず、消費者は市場への接近を保つために意図して害を引き受けていた。法的な不安定さはこの主体性と害の同時の構成を強め、その曖昧さを持続させ、サービスごとに不均等に分布させた。回避・教育・同調の3つの戦略は曖昧さを解消せずやりくりする手段で、法的な不安定さはその効果も複雑にした。経営への示唆として、継ぎ目のないサービスへの包摂と、性別の表現の流動性を問題にしない対応を挙げた（抄録）。", "p6": "解釈：英国の事例に基づく理論化で、法制度の異なる国への一般化は確かめる必要がある。調査の対象者数と期間は抄録から分からない。", "fun": "お店やサービスを使うことは、自分らしく生きるための大切な場面でもある。ところがトランスジェンダーの人にとっては、服を買う、病院や銀行の窓口に行くといった当たり前の行動そのものが、傷つく経験を伴うことがある。それでも市場から離れられないので、傷を覚悟して参加し続ける。「自分で選ぶこと」と「傷つくこと」が同時に起きる、という見方が深い。", "unverified": "本文を読めておらず、調査の対象者数、データの集め方、具体的な事例は未確認。"}}, {"id": "jn12", "rank": 12, "field": "地震工学・防災", "headline": "衛星と地上の計測を統合し地すべりの活動期を検出", "title": "When slopes awaken: Detecting landslide activation phases with InSAR and optical offset tracking", "url": "https://doi.org/10.1007/s10346-026-02849-z", "authors": "Floriane Provost ほか", "venue": "Landslides", "date": "2026-11-16", "sjr": 1.778, "citescore": 12.5, "citescore_year": "2025", "apa": "Provost, F., Handwerger, A. L., Malet, J.-P., Bertrand, C., Di Paolo, F., & Dall Amico, M. (2026). When slopes awaken: Detecting landslide activation phases with InSAR and optical offset tracking. Landslides. https://doi.org/10.1007/s10346-026-02849-z", "why": "フランス南東アルプスの面積約18 haの地すべりを、衛星レーダー干渉（InSAR）、衛星光学画像の相関、地上のレーダー干渉、GNSSで2014〜2020年に観測し、衛星のInSARと光学の結果を合わせて3次元の変位時系列を逆算する方法を提案した。統合で衛星の変位時系列の精度が上がり、活動の始まりと継続期間を検出しやすくなると報告する。", "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（4次元の変位の逆解析、2013〜2020年の運動、現地計測との照合、積雪の影響の節）を読んだ。考察の後半は読み切れていない", "preprint": false, "p1": "フランス南東アルプスの面積約18 haの大規模地すべりで、衛星のレーダー干渉（InSAR）と光学画像の相関（OIC）を合わせて3次元の変位の時系列を逆算する方法を提案し、精度を上げて加速の始まりと継続期間を捉え、加速の引き金に雨・雨の雪上降下（Rain-on-Snow）・融雪が関わることを示した（抄録）。", "p2": "この地すべりは2016年末に活発化し、下流のギル川を土砂でせき止めるおそれがあった（抄録）。衛星の手法は単独では2方向の成分しか得られず、3次元の動きを決めるには不足だった（§4次元の逆解析）。", "p3": "InSARの昇交・降交の視線方向の変位とOICの南北・東西の変位を、動きが斜面に平行という条件（式(2)）を加えた連立方程式で逆算し、3成分の時系列を得た。地上のGNSS・GB-SAR・LiDARで検証し、現地の気象データ、衛星の積雪分布、積雪水量のモデルと1次元の拡散モデルで間隙水圧の変化を3つのシナリオで推定した（§手法）。", "p4": "2017年5〜10月の4点のGNSSの時系列と、斜面下部を監視したGB-SARの変位を、OICだけの逆算と、OICとInSARを合わせた逆算で比べた（§検証）。", "p5": "上部中央の活動域の速度は2013年の年約1 mから2015年の年約10 mへ加速し、2017〜2018年には年20 mを超えた（§結果）。OICとInSARの組み合わせはOIC単独よりGNSSとの誤差を減らし、活動域と安定域の境界も明確にした（G4を除く）。2016年秋の加速は1日154 mmの豪雨と、2018年春の加速は融雪の時間差を考慮したシナリオの間隙水圧と、よく対応した（§積雪の影響）。", "p6": "安定域の点（G0）では変位の大きさを過大に推定し、G4では衛星のどちらの手法とも大きく食い違うなど、手法の限界が見られた（§検証）。解釈：1つの地すべりの事例で、他の斜面への適用は確かめる必要がある。", "fun": "山の斜面がゆっくり滑り落ちる地すべりは、ある時ふいに速くなることがある。この研究は、人工衛星のレーダーとカメラの2種類の画像を組み合わせて斜面の動きを立体的に追い、加速のきっかけが「雪の上に降った雨」や「雪どけの時期」と関係していることを見つけた。宇宙から測った動きと、雪の積もり方を結びつけた点が面白い。", "unverified": "各GNSS点のRMSEの数値（図4）と、地すべりの内部の形状の推定結果は確認していない。"}}, {"id": "jn13", "rank": 13, "field": "ヒューマンコンピュータインタラクション", "headline": "地下埋設物のAR表示法を作業負荷で比較", "title": "Evaluating augmented reality visualization methods for underground utilities using affordance theory and task load analysis", "url": "https://doi.org/10.1108/sasbe-01-2026-0004", "authors": "Hesam Khorrami Shad ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-11-16", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "apa": "Khorrami Shad, H., Xu, Z., Lovreglio, R., Paes, D., Feng, Z., & Yiu, T. W. (2026). Evaluating augmented reality visualization methods for underground utilities using affordance theory and task load analysis. Smart and Sustainable Built Environment, 1–36. https://doi.org/10.1108/sasbe-01-2026-0004", "why": "掘削時の地下埋設物の損傷を防ぐため、タブレットのビデオシースルー型ARで地下埋設物を表示する4つの方法を、アフォーダンス理論と作業負荷の分析に基づく管理された実験で比べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "掘削時に地下埋設物（水道管・ガス管など）を傷つけないためのタブレットのAR表示について、X線、影、断面、新たに作った組み合わせの4方式を60人の参加者内実験で比べ、位置と深さの明確な理解が要る場面ではX線と組み合わせの方式が有用だと示した（抄録）。", "p2": "地表のマーキングや2次元の図面は空間的な文脈が乏しく、ARはそれを補えるが、AR表示の方式を比べた実証的な証拠は限られていた（抄録）。", "p3": "タブレットのビデオシースルー型ARで、模擬した地下埋設物の可視化の課題を4方式で行う管理された参加者内実験（60人）を実施し、アフォーダンス理論（感覚的・認知的に何が読み取れるか）と作業負荷の分析で評価し、年齢やARへの慣れとの関係を混合効果モデルで調べた（抄録）。", "p4": "評価はアフォーダンスの得点と作業負荷で、比較の基準は4方式の間の差である（抄録）。", "p5": "X線と組み合わせの方式は、測定したアフォーダンスと作業負荷の結果で同程度で、どちらも影の方式より概して良かった。年齢は作業負荷と感覚的・認知的なアフォーダンスの得点に関連したが、ARへの慣れは混合効果モデルで有意な予測因子ではなかった（抄録）。", "p6": "管理された環境で、参加者は主に大学院生であり、実際の掘削現場の専門の作業員ではないため、結果は文脈に限った証拠として解釈すべきだと著者が述べる（抄録）。抄録の後半はARへの慣れが作業負荷を下げるとも述べており、混合効果モデルの結果との関係は本文で確かめる必要がある（解釈）。", "fun": "道路を掘るとき、地面の下の水道管やガス管を見落として傷つける事故が起きる。タブレットをかざすと地面が透けて管が見えるような表示（AR）を4種類作って比べたところ、レントゲン写真のように透かして見せる方式と、新しい組み合わせ方式が分かりやすかった。見えないものをどう見せるかで、人の理解のしやすさが変わる点が面白い。", "unverified": "本文を読めておらず、各方式の得点の数値、課題の具体的な内容、ARへの慣れの効果の記述の食い違いの理由は未確認。"}}, {"id": "jn14", "rank": 14, "field": "工学", "headline": "主応力方向に沿う壁状のボロノイ内部構造を生成", "title": "Stress-Driven Anisotropic Voronoi Structures", "url": "https://doi.org/10.1145/3864020", "authors": "Dennis Bukenberger ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-16", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Bukenberger, D., Wu, J., & Westermann, R. (2026). Stress-Driven Anisotropic Voronoi Structures. ACM Transactions on Graphics. https://doi.org/10.1145/3864020", "why": "外力による主応力の方向に形が沿う異方性の3次元ボロノイ内部構造を作る方法を示した。従来の応力に沿う内部構造はトラス状が中心だったが、同じ材料量でより剛性の高い壁状の構造を、応力に駆動された標本配置と応力場で拘束したLloyd緩和で作る。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は購読誌のため取得できず", "preprint": false, "p1": "外力が生む主応力の方向に形が沿う異方性の3次元ボロノイの内部構造（インフィル）を、トラス状ではなく壁状の構造として作る方法を示し、同じ材料量で既存の壁状・トラス状の方法より高い剛性を、ずっと短い構築時間で得た（抄録）。", "p2": "応力に沿う既存の内部構造の作り方は主にトラス状の構造を生成していたが、壁状の構造の方が同じ材料量でより高い剛性を達成することが知られていた（抄録）。", "p3": "応力場に駆動された点の配置（サンプリング）と、応力場で拘束したLloyd緩和で、局所的に変わる応力の方向にセルがそろう異方性の重心ボロノイ分割（CVT）を計算する。そのために新しい適応的な距離の尺度（Lqノルム）を導入した。最後に各ボロノイセルの中で形を保つ調和距離場を削り出して、連続した壁状の微細構造を作る（抄録）。", "p4": "有限要素解析と、3Dプリントした試験体の物理実験で、同じ材料量での剛性と構築時間を既存の壁状・トラス状の方法と比べた（抄録）。", "p5": "得られた内部構造は、同等の材料量で既存の壁状・トラス状の方法より剛性が高く、構築の時間もかなり短かった（抄録）。", "p6": "解釈：抄録からは剛性の向上率と時間の短縮の具体的な数値、荷重条件の種類、強度（破壊）や疲労への効果は分からない。単一の荷重条件に合わせた構造が、荷重が変わる場合にどう振る舞うかも確かめる必要がある。", "fun": "骨の内部は、かかる力の向きに沿ってすき間のある網目が並び、軽くて丈夫になっている。この研究は、3Dプリンタで作る部品の中身を、力の流れの向きにそろった「壁」の網目で埋める方法を作った。棒を組んだような網目より壁の網目の方が、同じ材料で硬くなる。自然の骨の作りに似た発想を計算で実現した点が面白い。", "unverified": "本文を読めておらず、剛性と構築時間の数値、試験体の形状と荷重条件は未確認。"}}, {"id": "jn15", "rank": 15, "field": "機械学習", "headline": "評価コメントからRAGで学生の誤りの型を抽出", "title": "Curriculum-aligned analysis of assessment feedback: a retrieval-augmented large language model approach for revealing fine-grained student error patterns in higher education", "url": "https://doi.org/10.1186/s41239-026-00640-7", "authors": "Linxin Hua ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-11-15", "sjr": 7.947, "citescore": 48.4, "citescore_year": "2025", "apa": "Hua, L., Xu, J., Guo, L., Zheng, N., Shen, Q., Tan, D., & Lu, Y. (2026). Curriculum-aligned analysis of assessment feedback: a retrieval-augmented large language model approach for revealing fine-grained student error patterns in higher education. International Journal of Educational Technology in Higher Education, 23(1). https://doi.org/10.1186/s41239-026-00640-7", "why": "高等教育の課題への評価コメントを、LLMで誤りの分類体系を作り、検索拡張生成（RAG）で科目内容に対応づけ、誤りのパターンとして集約する3段階の方法を提案し、工学系の授業の4学年（2022〜2025年）の6,072件のコメントに適用した。", "explain": {"basis": "本文", "basis_note": "出版社（Springer、オープンアクセス）のPDFの本文（抄録、研究課題、結果の構成、限界）を読んだ。方法の詳細と結果の個別の表は読み切れていない", "preprint": false, "p1": "大学の課題への採点コメントを、LLMで誤りの分類体系を作り、検索拡張生成（RAG）で授業内容の単位に対応づけ、学年全体での出現率つきの誤りのパターンに集約する3段階の方法を作り、教員チームがそれを授業改善の根拠として使う過程を示した（抄録）。", "p2": "採点コメントは学生の具体的な誤りの細かな証拠を含むのに、授業改善のデータとしてはほとんど使われていなかった（抄録）。", "p3": "（1）コメントから誤りの分類体系を導き、（2）各コメントを授業の資料の知識単位（スライド・ページ）にRAGで対応づけて誤りの種類を判定し、（3）注釈を誤りのパターンに集約して学年の中での出現の割合を定量化した（抄録、付録）。工学系の学部の授業の4学年（2022〜2025年）の採点コメント6,072件に適用した（抄録）。", "p4": "注釈の妥当性は人の判断との一致率で評価し、専門家が設計した分類体系を同じデータに当てた場合と比べた。教員チームのフォーカスグループで、パターンの受け止めと使い方を調べた（抄録、§結果）。", "p5": "コメントは、内容の欠落と根拠づけの不足が中心の、授業内容に対応した繰り返し現れる誤りのパターンにまとまり、特定のモジュールと週に集中し、半数以上が学年をまたいで再発した。注釈は人の判断と89.1%一致し、専門家の分類体系の74.7%を大きく上回った。教員チームはパターンを採点の経験と照らして確認し、授業の改訂を提案する一方、パターンは参照であり教育の質の直接の尺度ではないという線を引いた（抄録）。", "p6": "1つの機関の1つの授業（グループの報告書の課題）の事例で、検証は経験3年の評価者1人、教員の議論は1回に限られ、2つの分類体系は出発点の情報が異なるため一致率の差の一部はその違いによると著者が認める。LLMの手順はすべて1つのモデル系統で行った（限界）。", "fun": "先生が答案に書く「根拠が足りない」「この内容が抜けている」といったコメントは、学生に返したら終わりになりがちである。この研究は、6,000件ものコメントをAIで整理して、授業のどの回のどの内容でつまずきが多いかを地図のように描いた。学生へのコメントが、先生自身の教え方を見直す材料に変わる点が面白い。", "unverified": "結果の節の誤りのパターンの具体例と出現率の数値、使ったLLMの名前は確認していない。"}}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "在宅勤務への移行で性格は変わらなかった", "title": "Personality Was Robust to the Transition to Remote Work Under the COVID‐19 Pandemic", "url": "https://doi.org/10.1111/jopy.70104", "authors": "Meaghan M. Tracy ほか", "venue": "Journal of Personality", "date": "2026-11-16", "sjr": 1.804, "citescore": 8.3, "citescore_year": "2025", "apa": "Tracy, M. M., Meade, A. W., & Behrend, T. S. (2026). Personality Was Robust to the Transition to Remote Work Under the COVID‐19 Pandemic. Journal of Personality. https://doi.org/10.1111/jopy.70104", "why": "コロナ禍で対面から在宅勤務に移った就業者1,475人の縦断データで、IRTに基づく測定不変性の分析と線形混合モデルを用い、働く場の移行が性格を変えなかったと報告する。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "コロナ禍に対面から在宅勤務へ移った就業者1,475人の縦断データで、働く場の移行は性格項目の解釈も性格特性の平均値も変えなかったことを示した（抄録）。", "p3": "性格の動態と参照枠の効果の研究に基づき、既存の縦断データにIRTに基づく測定不変性の分析と線形混合効果モデルを当てはめた（抄録）。", "p5": "在宅勤務への移行は、性格項目の受け取り方にも特性の平均点にも影響しなかった。著者は、性格は状況の変化に頑健だという理論を支持すると結論する（抄録）。", "fun": "家で働くようになって、几帳面さや社交性が変わったと感じる人もいるだろう。この研究は、同じ人を追いかけ、質問の受け取り方そのものが変わっていないかまで確かめたうえで、性格はほとんど変わらなかったと示した。物差しのずれまで疑ってから結論を出す慎重さが面白い。", "unverified": "効果の大きさの推定値と信頼区間は抄録から確認できない。"}}, {"id": "jn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "女性の経営幹部のリーダーとしての成熟の枠組み", "title": "Walking the Spiral Staircase: A Female Executive Leader Maturation Framework", "url": "https://doi.org/10.1111/gwao.70295", "authors": "Cristina Domínguez‐Soto ほか", "venue": "Gender, Work and Organization", "date": "2026-11-16", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Domínguez‐Soto, C., Labajo, V., & Labrador‐Fernández, J. (2026). Walking the Spiral Staircase: A Female Executive Leader Maturation Framework. Gender, Work & Organization. https://doi.org/10.1111/gwao.70295", "why": "スペインのさまざまな部門の女性の経営幹部30人の生活史インタビューから、男性的な指導者構造の中でのリーダーとしての発達を、内省・適応・意味づけの非線形な過程として描く枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "スペインの女性の経営幹部30人の生活史インタビューから、女性のリーダーとしての成熟を3段階のらせん階段として描く枠組みを示した（抄録）。", "p3": "男性的な指導者構造の中で働く多様な部門の女性幹部への生活史インタビューを、社会構成主義のグラウンデッド・セオリーで分析し、構成的発達理論とジェンダー・リーダーシップ研究を手がかりにした（抄録）。", "p5": "個人の実務者から関係的なリーダーへ、関係的なリーダーから戦略的な経営者へ、経営者から取締役へという3段階で、各段階は内省、対人の交渉、文脈の複雑さの統合を伴い、行き戻りしながら上昇する過程だった（抄録）。", "fun": "出世の道はまっすぐな階段のように語られがちだが、この研究は、女性の経営幹部がたどる道を、同じところを回りながら少しずつ上がる「らせん階段」にたとえた。周りの期待とのせめぎ合いの中で、自分の在り方を何度も問い直す過程として描いた点が面白い。", "unverified": "各段階の移行のきっかけの具体例は抄録から確認できない。"}}, {"id": "jn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "AIの公平性だけでなく組織での可視化を問う", "title": "Stop Asking Only Whether AI is Fair: Feminisms, Organizational Legibility, and Action on AI, Gender, and Work", "url": "https://doi.org/10.1111/gwao.70298", "authors": "Alessandra Lazazzara ほか", "venue": "Gender, Work and Organization", "date": "2026-11-15", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Lazazzara, A., Zamani, E. D., Georgiadou, A., & Tandon, A. (2026). Stop Asking Only Whether AI is Fair: Feminisms, Organizational Legibility, and Action on AI, Gender, and Work. Gender, Work & Organization. https://doi.org/10.1111/gwao.70298", "why": "AIとジェンダーの議論がアルゴリズムの偏りと公平性に偏っていると批判し、フェミニズムの視点から、労働者と貢献が組織に把握される過程（AIを介した組織的な可読性）を分析する枠組みを提示した論考。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "AIとジェンダーの議論を公平性の問題に限らず、AIが労働者を組織に「読み取れる」ものにする過程（AIを介した組織的な可読性）から捉える視点を提示した論考（抄録）。", "p3": "複数のフェミニズムの伝統に基づき、分類（労働者をカテゴリに割り当てる）、評価（どの仕事が認められるか）、相互作用、適応（労働者の交渉・抵抗）という4つの循環する仕組みを整理した（抄録）。", "p5": "これらの仕組みを通じて、AIがジェンダー・人種・階級・障害の交差する不平等を再生産しうる一方で、異議と変革の可能性も生むと論じ、状況に根ざした実践と周縁化された声に注目する研究を呼びかけた（抄録）。実証データはない。", "fun": "AIの差別の問題は「判定が公平かどうか」で議論されがちである。この論考は、そもそも誰のどんな働きがAIに「数えられ」、どんな働きが見えなくなるのか、という一歩手前の問いを立てた。公平に測る前に、何を測っているのかを問う視点の転換が面白い。", "unverified": "論考であり実証的な検証はない。"}}, {"id": "jn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "生成AIへの曝露と職業の性格要件の報酬", "title": "Intellectual Tenacity at Work: Generative AI Exposure and the Economic Returns to Occupational Personality Requirements", "url": "https://doi.org/10.5465/amd.2025.0303", "authors": "Christos Makridis ほか", "venue": "Academy of Management Discoveries", "date": "2026-11-16", "sjr": 3.416, "citescore": 8.7, "citescore_year": "2025", "apa": "Makridis, C., & Hickman, L. (2026). Intellectual Tenacity at Work: Generative AI Exposure and the Economic Returns to Occupational Personality Requirements. Academy of Management Discoveries. https://doi.org/10.5465/amd.2025.0303", "why": "題名によれば、生成AIへの曝露が、職業に求められる性格特性（知的な粘り強さ）の経済的な報酬をどう変えるかを扱う（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Academy of Management Discoveriesの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、生成AIへの曝露が、職業に求められる性格の要件（知的な粘り強さ）がもたらす経済的な報酬（賃金など）をどう変えるかを扱う。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、生成AIが得意な仕事が増えたとき、難しい問題に粘り強く取り組む性格は今まで以上に報われるのか、それとも価値が下がるのか、というものである。技術の変化が「どんな人柄が稼げるか」まで変えうる、という視点が題名から読み取れる。", "unverified": "使ったデータ、分析の方法、結果はすべて未確認。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "構成概念の重複からリーダーシップ理論の構造を描く", "title": "The “Nebula” of Leadership: How Construct Redundancy Reveals the Structure of Leadership Theory", "url": "https://doi.org/10.5465/amd.2025.0272", "authors": "Chen Lin ほか", "venue": "Academy of Management Discoveries", "date": "2026-11-16", "sjr": 3.416, "citescore": 8.7, "citescore_year": "2025", "apa": "Lin, C., Zhao, C., Liu, Y., & Gao, Z. (2026). The “Nebula” of Leadership: How Construct Redundancy Reveals the Structure of Leadership Theory. Academy of Management Discoveries. https://doi.org/10.5465/amd.2025.0272", "why": "題名によれば、リーダーシップの構成概念の重複（冗長性）を手がかりに、リーダーシップ理論の全体の構造を明らかにする（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Academy of Management Discoveriesの新着。抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、リーダーシップの多数の構成概念の重複（冗長性）を手がかりに、リーダーシップ理論全体の構造（「星雲」のような広がり）を明らかにする。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、変革型、奉仕型、真正型など数多く提案されてきたリーダーシップの型が、実は同じものを違う名前で呼んでいるだけではないか、というものである。似た概念の重なりを地図のように描いて、理論全体の形を見ようとする発想が題名から読み取れる。", "unverified": "分析の対象と方法、結果はすべて未確認。"}}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "ブランド名の定冠詞は元祖らしさを高める", "title": "Definitely Original: The Effect of the Definite Article in Brand Names on Perceived Originality and Consumer Responses", "url": "https://doi.org/10.1002/mar.70304", "authors": "Fatemeh Vafaeesefat ほか", "venue": "Psychology and Marketing", "date": "2026-11-16", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Vafaeesefat, F., Mahmood, A., & Chen, S. (. (2026). Definitely Original: The Effect of the Definite Article in Brand Names on Perceived Originality and Consumer Responses. Psychology & Marketing. https://doi.org/10.1002/mar.70304", "why": "ブランド名の先頭の定冠詞theが消費者の反応を高める効果を、そのブランドが同種の元祖だという知覚（ブランドの起源性）が媒介することを、言語学の前提の理論から論じ実験で示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "ブランド名の先頭に定冠詞theがあると、そのブランドが同種の元祖だという知覚（ブランドの起源性）を通じて、消費者の態度と行動意図が好ましくなることを示した（抄録）。", "p3": "定冠詞は指す対象を文脈の中の典型的で特定できるものとして前提するという言語学の知見から仮説を立て、架空のブランドを使った5つの実験と実データの分析1つ、計6研究で検証した（抄録）。", "p5": "The Body ShopのようにTheで始まる名前は、Body Shopのような名前より好ましい態度と行動意図を生んだ。この効果は模倣ブランドや競争の激しいカテゴリーでは弱まった（抄録）。", "fun": "店の名前に「The」が付くだけで、その店が「本家」「元祖」のように感じられ、好感が高まるという。たった一語の文法が、人の受け止め方を変えるのである。言語学の理論を広告やブランドの名づけに応用し、実験で確かめた点が面白い。", "unverified": "効果の大きさの数値と、実データの分析の内容は抄録から確認できない。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "中国企業のグリーン革新は国家からの正統性に届くか", "title": "From Green Innovation to Legitimacy: The Roles of ESG Engagement and Institutional Context in China", "url": "https://doi.org/10.1002/bse.71860", "authors": "Li Xian Liu ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-16", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Liu, L. X., Jiang, F., Zheng, X., & McCarthy, B. (2026). From Green Innovation to Legitimacy: The Roles of ESG Engagement and Institutional Context in China. Business Strategy and the Environment. https://doi.org/10.1002/bse.71860", "why": "2010〜2023年の中国A株の上場企業のパネルで、グリーン・イノベーションと国家に向けた正統性の関係、ESGへの取り組みの媒介、地域の制度の質による調整を調べた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "中国の上場企業で、グリーン・イノベーションが国家からの正統性（国家に認められる度合い）と正に関連し、その一部がESGへの取り組みを通じることを示した（抄録）。", "p3": "2010〜2023年の中国A株の上場企業のパネルで、グリーン・イノベーション（実質的な活動）、ESGへの取り組み（信号）、国家に向けた正統性の関係と、地域の制度の質の調整を分析した（抄録）。", "p5": "グリーン・イノベーションは国家に向けた正統性と正に関連し、その一部はESGへの取り組みを経由した。制度の質は主にイノベーションとESGの結びつきを通じて間接の関係を強めた（抄録）。", "fun": "環境に良い技術を開発しても、それだけで世間や国に認められるとは限らない。この研究は、中国の会社では、技術開発をESGの活動として「見える形」にすることが、国からの評価につながる道筋になっていると示した。実際の取り組みと、それを伝える信号を分けて考える点が面白い。", "unverified": "正統性の指標の作り方と、効果の大きさは抄録から確認できない。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "デジタル化と環境革新が中小企業の国際化を促す", "title": "Digitalisation, Eco‐Innovation and SME Internationalisation: A Dynamic Capabilities Perspective", "url": "https://doi.org/10.1002/bse.71832", "authors": "Samar Abdalla ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-16", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Abdalla, S., Tantawy, A. A., Ng, P. Y., & Amankwah‐Amoah, J. (2026). Digitalisation, Eco‐Innovation and SME Internationalisation: A Dynamic Capabilities Perspective. Business Strategy and the Environment. https://doi.org/10.1002/bse.71832", "why": "英国の中小企業の経営者300人のデータで、デジタル化が環境面の革新を通じて国際化に影響し、国際化の経験がその関係を調整することを動的能力の視点から示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "英国の中小企業で、デジタル化が環境面の革新（エコ・イノベーション）を促し、それを通じて国際化に影響することを動的能力の視点から示した（抄録）。", "p3": "英国の中小企業の経営者300人から得たデータで、デジタル化、エコ・イノベーション、国際化の関係と、国際化の経験の調整効果を分析した（抄録）。", "p5": "デジタル化はエコ・イノベーションを高め、それが国際化の活動の性質に影響した。国際化の経験はエコ・イノベーションと国際化の関係を調整した（抄録）。", "fun": "小さな会社が海外に打って出るには何が必要か。この研究は、デジタル化が環境に配慮した新しい取り組みを生み、それが海外での強みになるという連鎖を示した。デジタルと環境という二つの流行語を、会社の成長の道筋としてつないだ点が面白い。", "unverified": "分析の手法と効果の大きさは抄録から確認できない。横断的なデータかどうかも未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "実務家が情報システム研究を使わない理由", "title": "Won’t somebody please think of practitioners? Understanding practitioner engagement with academic information systems research", "url": "https://doi.org/10.1108/intr-11-2025-1954", "authors": "Cathal Doyle ほか", "venue": "Internet Research", "date": "2026-11-16", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Doyle, C., Li, Q., Mirkovski, K., & Lowry, P. B. (2026). Won’t somebody please think of practitioners? Understanding practitioner engagement with academic information systems research. Internet Research, 36(7), 259–277. https://doi.org/10.1108/intr-11-2025-1954", "why": "情報システムの学術研究に実務家が関与しない理由を知識の採用と翻訳の問題として捉え、英米などの実務家315人の調査をPLSで分析した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "情報システムの実務家が学術研究をあまり使わない理由を、知識の採用と翻訳の問題として捉え、実務家315人の調査で関与の経路を示した（抄録）。", "p3": "主に英米（一部ニュージーランド）の実務家315人の横断調査をPLSパスモデルで分析し、ブートストラップの媒介分析と多変量分散分析を行った（抄録）。", "p5": "革新の自律性は内容の関連性の知覚を高めたが、伝え方の関連性は高めなかった。伝え方の関連性は非公式な情報源への接近を、内容の関連性は公式・非公式の両方への接近を高め、どちらの接近も研究への関与行動を増やした（抄録）。", "fun": "研究者が役に立つ研究をしても、現場の人に読まれなければ意味がない。この研究は、実務家が論文の中身に価値を感じても、書き方の壁は残ることを示した。研究を届けるには、内容の良さと伝え方の工夫が別々に必要だという点が面白い。", "unverified": "効果の大きさの数値は抄録から確認できない。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "異常降水によるサプライチェーンの打撃をAIは和らげるか", "title": "Can artificial intelligence mitigate the adverse impact of climate shocks on supply chain resilience? Firm-level evidence from abnormal precipitation", "url": "https://doi.org/10.1080/00207543.2026.2762327", "authors": "Yuhuan Zhao ほか", "venue": "International Journal of Production Research", "date": "2026-11-16", "sjr": 2.215, "citescore": 18.1, "citescore_year": "2025", "apa": "Zhao, Y., Wu, J., & Zhu, J. (2026). Can artificial intelligence mitigate the adverse impact of climate shocks on supply chain resilience? Firm-level evidence from abnormal precipitation. International Journal of Production Research, 1–17. https://doi.org/10.1080/00207543.2026.2762327", "why": "題名によれば、異常な降水という気候ショックがサプライチェーンの頑健性に与える悪影響を企業のAI活用が和らげるかを、企業単位のデータで検証する（抄録なし）。", "explain": {"basis": "題名", "basis_note":
