可能性に分解する（抄録）。", "p5": "主要なSNSに適用し、ネットワーク内の信頼は、各プラットフォームの構造が生む認識の制度から、ネットワークへの信頼は、概念実証のLLMによる診断から分析した。誤情報と、デジタルに媒介された公共の議論の認識的な脆弱性への含意を述べる（抄録）。", "fun": "SNSを信じるとき、実は2つの信頼があります。1つは「そこにいる人たちの情報を信じるか」、もう1つは「SNSという仕組みそのものを信じるか」です。この研究は、「あの人は私をこう思っているはず」といった相手の考えについての考えまで数式にして、2つの信頼を整理しました。信頼を層に分けて考えるのが面白い点です。", "unverified": "抄録のみで、理論の形式化とLLM診断の具体的な結果は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "単眼カメラで多点・2方向の変位とモード同定", "title": "A Multi-Point Bidirectional Vision-Based Method for Structural Displacement Measurement and Modal Identification", "url": "https://doi.org/10.3390/civileng7040077", "authors": "Bibo Hou ほか", "venue": "CivilEng", "date": "2026-11-09", "citescore": 4.4, "citescore_year": "2025", "apa": "Hou, B., Ji, Y., Tang, J., Xing, T., & Ni, P. (2026). A Multi-Point Bidirectional Vision-Based Method for Structural Displacement Measurement and Modal Identification. CivilEng, 7(4), 77. https://doi.org/10.3390/civileng7040077", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "CivilEngの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "1台の単眼カメラで、構造物の複数点の水平・鉛直の2方向の変位の時刻歴を同時に測り、多層構造のモード同定に使える方法を示した（抄録）。", "p2": "接触式の変位センサは取り付け台や基準枠が要り、高密度に置きにくい。1方向だけの視覚計測は、面内の応答を完全には捉えられない（抄録）。", "p3": "ZNCC（零平均正規化相互相関）のテンプレートマッチングで目標位置を整数画素で求め、それを初期値に、逆合成ガウス・ニュートン法（ICGN）でサブピクセルの水平・鉛直の動きを求める。校正した画像のスケールで、画素の動きを物理的な変位に換算する（抄録）。", "p4": "2段階の検証。(1) 1層フレームの振動台実験で、視覚から得た変位をレーザー計測と比べ、複数点の2方向応答から固有振動数を同定する。(2) 3層のプレハブフレームを斜めのカメラ視点で、より広い視野で評価する（抄録）。", "p5": "3層フレームのEl Centro波の加振で、階ごとに比べると、上の階ほど計測の一貫性が下がり、空間解像度と画像スケールの変化への感度が示された。全体として、複数のカメラや多数の接触センサなしで、複数点の2方向の動的変位から多層構造のモード同定ができるとする。誤差などの数値は未確認（抄録）。", "p6": "未確認（抄録に著者の限界の明記がなく、本文を入手できず）。解釈：検証は振動台の実験で、実橋や屋外の条件は抄録からは分からない。", "fun": "地震のときに建物がどれだけ揺れるかを、1台のカメラの映像だけで測ります。画面の模様の小さな動きをピクセルより細かい単位まで追いかけて、揺れの大きさと向きを数字にします。ただし上の階ほど、画像の解像度や縮尺の違いの影響を受けて、測る精度が落ちました。1台で済めば、センサを何十個も付ける手間が減ります。", "unverified": "本文を入手できず、変位の誤差の数値、固有振動数の同定結果、カメラの配置と校正の詳細、レーザー計測との一致度は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "洪水の衝撃による橋脚の過渡応答と洗掘を連成で評価", "title": "Numerical Investigation of Flood-Induced Dynamic Response of Bridge Piers and Local Scour Around Pile-Group Foundations in an African Floodplain", "url": "https://doi.org/10.3390/eng7110628", "authors": "Xuecai Li ほか", "venue": "Eng", "date": "2026-11-09", "citescore": 4.1, "citescore_year": "2025", "apa": "Li, X., Liu, S., Deng, H., Yang, M., & Li, W. (2026). Numerical Investigation of Flood-Induced Dynamic Response of Bridge Piers and Local Scour Around Pile-Group Foundations in an African Floodplain. Eng, 7(11), 628. https://doi.org/10.3390/eng7110628", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Engの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "タンザニアのJangwani橋を例に、洪水による橋脚の動的応答と、群杭基礎まわりの局所洗掘を、流体・構造連成と、水理・土砂輸送を連成した洗掘のモデルで数値的に調べ、設計と施工の安全管理の根拠を示した（抄録）。", "p2": "洪水が橋脚に与える短時間の衝撃と、群杭基礎まわりの洗掘が、断面形・流速・水位・杭径でどう変わるかを調べる。抄録には従来法の不足の記述はない（抄録）。", "p3": "橋脚には流体・構造連成（FSI）のモデル、群杭基礎には水理・土砂輸送を連成した洗掘モデルを別々に作る。断面形（円・正方形・長方形）、接近流速、水位、杭径を変えて、流体力、変位、応力、洗掘の進展を比べる（抄録）。", "p4": "指標は、衝撃力と準定常の流体力の比、最大主応力、FSI係数（剛な橋脚の場合との平均力の比）、3000秒のシミュレーションでの洗掘深さ。基準条件まわりの局所的な摂動で、流速・水位・杭径の影響の大きさを順位付ける（抄録）。実測との照合は未確認。", "p5": "洪水の初期衝撃への橋脚の応答は、初期衝撃・減衰振動・準定常の3段階で、衝撃力の最大は準定常の流体力の1.61〜2.93倍。円形断面は、正方形・長方形より衝撃力の最大と最大主応力が小さい。FSI係数は0.98〜1.41で、多くの場合、剛な橋脚より平均力が大きい。洗掘は最初に急速に進み、後に緩やかになり、上流側の前列の杭に集中し、後列は遮蔽で小さい。最大洗掘深さへの影響は、流速が最大で、水位、杭径の順（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：結果は基準条件まわりの局所的な感度で、3000秒の短時間の模擬であり、実測との照合の有無は抄録から分からない。", "fun": "洪水が来た瞬間、橋の脚には、その後に流れ続ける水の力の1.61〜2.93倍もの衝撃がぶつかります。断面が丸いと、四角いより衝撃も応力も小さくなりました。また、群杭の足元の土は、水が最初に当たる前列の杭のまわりからえぐれ、後ろの列は前の杭の影になって守られます。洪水対策の設計では、定常な流れだけでなく、最初の衝撃を見ることが大事です。", "unverified": "本文を入手できず、モデルの検証（実測・水槽実験との照合）、メッシュと時間刻み、洗掘深さの具体的な値、各条件の数値は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "雑音に強いハイブリッドNNで板の損傷位置を特定", "title": "A noise-robust hybrid neural network framework for damage localization in plates", "url": "https://doi.org/10.1177/10567895261506545", "authors": "Can Gonenli ほか", "venue": "International Journal of Damage Mechanics", "date": "2026-11-10", "citescore": 8.5, "citescore_year": "2025", "apa": "Gonenli, C., & Duymazlar, O. (2026). A noise-robust hybrid neural network framework for damage localization in plates. International Journal of Damage Mechanics. https://doi.org/10.1177/10567895261506545", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal of Damage Mechanicsの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "対称な板で、固有振動数の変化だけでは損傷位置が決まらずノイズにも弱い問題を、複数状態の周波数変化と3つの基準点のモード形状の振幅を組み合わせたハイブリッド入力のニューラルネットで解き、ノイズのもとで損傷領域を絞れることを数値的に示した（抄録）。", "p2": "全体の固有振動数の変化だけに頼る従来法は、対称な板では非一意性（損傷位置が複数ありうる）と測定ノイズへの弱さのため、損傷位置を正確に特定できない（抄録）。", "p3": "複数状態の周波数変化（環境温度の変化を受動的なデータ拡張に使う）と、3つのアンカー点で取り出した空間モード形状の振幅を入力にし、クロストークを避ける分割ネットワークを使う。実験モーダル解析の分解能の限界（周波数±0.10 Hz、振幅±1%）に基づくノイズを、訓練中に同時に注入する（抄録）。", "p4": "検証は、両端固定・自由・固定・自由の板の数値実験。標準の周波数ベースのネットワークと比べ、ノイズのもとでの損傷位置の空間的なずれを評価する（抄録）。", "p5": "標準の周波数ベースのネットワークは、代表的なノイズのもとで壊滅的に失敗するが、提案のハイブリッドの枠組みは空間的なずれを抑え、損傷領域を確実に切り分ける。理想的な条件では、要素より細かい位置精度に達する（抄録）。具体的な数値は未確認。", "p6": "未確認（抄録に限界の明記がなく、本文を入手できず）。抄録は、数値実験による概念実証であり、実験での実装の前の段階だと述べる（抄録）。", "fun": "板のひび割れの場所を、板の揺れ方（固有振動数）の変化だけで探すと、左右対称な板では「右か左か」が決まりません。そこで、3つの点で揺れの形も測って組み合わせました。気温で揺れ方が変わることを、むしろ練習データを増やすのに使い、測定のノイズも訓練中にわざと混ぜておくことで、現場に近い条件でも位置を絞れました。", "unverified": "本文を入手できず、ネットワークの構造、損傷の大きさと種類、各ノイズ条件での誤差の数値、温度変化の扱いは未確認。"}}, {"id": "jr04", "rank": 4, "headline": "周波数領域の時系列解析の課題・手法・ベンチマーク", "title": "Time Series Analysis in Frequency Domain: A Survey of Open Challenges, Opportunities and Benchmarks", "url": "https://doi.org/10.1145/3862757", "authors": "Regina (Qianru) Zhang ほか", "venue": "ACM Computing Surveys", "date": "2026-11-10", "sjr": 5.985, "citescore": 65.2, "citescore_year": "2025", "apa": "Zhang, R. (., Sun, Y., Wen, H., Yang, P., Li, X., Li, M., Lam, K.-Y., Lio, P., Yiu, S.-M., & Yin, H. (2026). Time Series Analysis in Frequency Domain: A Survey of Open Challenges, Opportunities and Benchmarks. ACM Computing Surveys. https://doi.org/10.1145/3862757", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "ACM Computing Surveysの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "古典的なフーリエ解析から最新のニューラル演算子までの、周波数領域の時系列解析を、100件を超える研究の調査から1つの分類にまとめ、3つの未解決課題と標準化したベンチマークを示した（抄録）。", "p2": "周波数領域の解析は時間領域にない利点を持つ一方、新しい理論的・実践的な課題を生む。分野の知識の空白（特に幾何学的深層学習と量子強化のスペクトル解析）を整理する必要があった（抄録）。", "p3": "スペクトル手法を、古典的な手法から機械学習の手法までつなぐ統一的な分類にまとめ、方法選択と実装の体系的な枠組みを示す（抄録）。具体的な分類軸は未確認。", "p4": "100件を超える研究を精査し、性能評価の標準化されたベンチマークを設ける（抄録）。対象のデータと指標は未確認。", "p5": "3つの未解決課題として、(1) スペクトル変換での因果構造の保存、(2) 学習した周波数表現の不確実性の定量化、(3) 非ユークリッドのデータ構造のトポロジーを考慮した解析を挙げる。実務者向けに方法選択と実装の枠組みを示し、今後の研究の方向を描く（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：サーベイの網羅性は、調査した100件超の範囲に依存する。", "fun": "時間とともに変わるデータ（気温、心拍、株価）を「波の重ね合わせ」として見る方法が、周波数領域の解析です。音を高い音と低い音に分けて考えるのと同じ発想です。この総説は、100件超の研究を整理して、「原因と結果の順序が壊れないか」「予測のあいまいさをどう表すか」といった、まだ解けていない問題を並べました。", "unverified": "本文を入手できず、分類の具体的な軸、ベンチマークの内容、各手法の比較結果は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "斜面角ごとに石炭ガングの土石流発生を実験と連成解析", "title": "Critical Initiation Mechanism and Multi-Field Response Characteristics of Coal Gangue Debris Flow Under Different Slope Angles", "url": "https://doi.org/10.3390/app162211113", "authors": "Shuhua Zhai ほか", "venue": "Applied Sciences", "date": "2026-11-10", "citescore": 6.1, "citescore_year": "2025", "apa": "Zhai, S., Huang, Z., Yu, J., Lyu, F., Liu, H., Wang, Y., & Du, A. (2026). Critical Initiation Mechanism and Multi-Field Response Characteristics of Coal Gangue Debris Flow Under Different Slope Angles. Applied Sciences, 16(22), 11113. https://doi.org/10.3390/app162211113", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Applied Sciencesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "石炭ずりの堆積物が水の負荷で土石流になる条件を、斜面の傾きごとに、水路実験と、粒子・浸透を連成した数値シミュレーションで調べ、傾きが大きいほど開始しやすい傾向を示した（抄録）。", "p2": "石炭ずり（炭鉱の廃石）の堆積物は水の負荷で土石流を起こしうるが、斜面の傾きが開始と内部の応答にどう効くかは不明だった（抄録）。", "p3": "北京西部の石炭ずりで、12°・16°・20°・24°の水路実験を行い、大規模な粒子画像流速測定（PIV）、間隙水圧、土圧、MEMSで測る。16°・20°・24°では、PFC（粒子）とFiPy（浸透）を連成したシミュレーションで、粒子の動き、応力、間隙率、浸透を調べる（抄録）。", "p4": "指標は、開始に必要な臨界流量、粒子の最大の局所速度、間隙水圧・有効飽和度・鉛直応力・間隙率の空間分布（抄録）。実験と数値の定量的な一致度は未確認。", "p5": "開始は、局所的な転がり・滑りから広い範囲の持続的な動きへ進む、段階的で空間的に非同期な過程。臨界流量は12°・16°・20°・24°でそれぞれ約132.19、42.56、59.00、29.10 m3/hで、全体に傾きが大きいほど下がるが、20°は16°より高い。最大の局所粒子速度は16°・20°・24°で約0.347、0.387、0.412 m/s。高速領域は法尻付近から内側へ広がり、法尻付近で間隙水圧と有効飽和度が高い（抄録）。", "p6": "傾きの効果は、斜面方向の重力の負荷が増え、法線方向の拘束が減るためとされる一方、局所の浸透や粒子の接触のばらつきが不安定の伝播に影響しうる（抄録）。20°で16°より臨界流量が高い理由は抄録で説明されていない。本文を入手できず、限界の記述は未確認。", "fun": "斜面にある石炭の廃石の山に水を流すと、どれくらいの水の量で一気に土石流になるでしょう。傾きを12°から24°まで変えると、傾きが大きいほど少ない水で動き出す傾向がありました。ただし20°は16°より多くの水が必要で、単純ではありません。始まりは一斉でなく、一部の粒子が転がり、広がっていく段階的な過程でした。", "unverified": "本文を入手できず、流量の測定方法、実験の繰り返し数、数値シミュレーションの検証（実験との照合）、20°で臨界流量が高い理由は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "街路の知覚が自転車レーンの効果を左右する", "title": "Streetscape perception conditions the causal impacts of low-stress bicycle infrastructure", "url": "https://doi.org/10.1093/pnasnexus/pgag354", "authors": "M Mavin De Silva ほか", "venue": "PNAS Nexus", "date": "2026-11-10", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "De Silva, M. M., Wang, S., Piyatilake, A., Tian, S., Gabilondo, S. G., & Nakayama, T. (2026). Streetscape perception conditions the causal impacts of low-stress bicycle infrastructure. PNAS Nexus. https://doi.org/10.1093/pnasnexus/pgag354", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "PNAS Nexusの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "街路の見え方（安全さ・活気などの知覚）によって自転車レーンの効果が変わることを、ニューヨーク市のバイクシェアのデータで、因果推論により示した（抄録）。", "p2": "街路の知覚が交通インフラへの反応を左右するが、自転車の利用行動での役割は十分に調べられていない（抄録）。", "p3": "街路のパノラマ画像から6種類の知覚を導き、建造環境の特徴と結ぶ。ニューヨーク市の保護レーンとペイントレーンの段階的な導入を使い、傾向スコアマッチング、差の差法、因果フォレストを、バイクシェアの起終点データに適用する（抄録）。", "p4": "評価は、レーン導入後の利用の増加（処置前の効果が検出されないことの確認を含む）と、知覚環境ごとの処置効果の違い。街路単位の反事実予測も作る（抄録）。", "p5": "レーンは利用を有意に増やし、処置前の効果は検出されない。保護レーンは約32%（β=0.2705、p<0.001）、ペイントレーンは約10%（β=0.0967、p<0.05）増やす。効果は知覚環境で系統的に変わり、ペイントレーンは既に安全で活気のある街路で最も効き、保護レーンは幅広い環境で効いて、ストレスの多い・質の低い環境で最も大きな効果を生む（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：バイクシェアのデータは自転車利用の一部にとどまる可能性がある。", "fun": "自転車レーンを作ると、乗る人は増えます。柵などで守った保護レーンでは約32%、路面に色を塗っただけのレーンでは約10%。でも、街の見た目で効き方が変わるのが面白いところです。塗っただけのレーンは、もともと安全で活気のある通りでよく効き、保護レーンは、ストレスの多い通りで特に効きました。人の印象も、都市計画のデータになるという研究です。", "unverified": "本文を入手できず、知覚の6種類の定義と測り方、マッチングの共変量、平行トレンドの検証、効果の信頼区間、因果フォレストでの異質性の詳しい結果は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "LLMの国別の個人主義指数は調査と高相関だが偏る", "title": "When AI thinks about culture: comparing language-based and empirical measures of individualism–collectivism", "url": "https://doi.org/10.1057/s41267-026-00913-3", "authors": "Plamen Akaliyski ほか", "venue": "Journal of International Business Studies", "date": "2026-11-09", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "apa": "Akaliyski, P., & Messner, W. (2026). When AI thinks about culture: comparing language-based and empirical measures of individualism–collectivism. Journal of International Business Studies. https://doi.org/10.1057/s41267-026-00913-3", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社PDFの本文を読んだ（抄録・はじめに（前半）・方法・結果・考察・限界・結論）。仮説の導出（はじめに後半）とオンライン補足資料は読み切れていない", "preprint": false, "p1": "5つのLLMが推定した国ごとの個人主義–集団主義（I-C）を、全国代表の調査に基づく指標と比べ、国の順位はよく一致する一方、西洋は個人主義が過大、儒教圏の東アジアは過小という系統的なずれがあることを示した（抄録）。", "p2": "LLMは文化の解説に使われ始めたが、その文化的な知識がどれほど正確か、固定観念を再現するのか是正するのかは分かっていない。国際経営では、管理者が文化的な助言を権威あるものとして扱う恐れがある（はじめに）。", "p3": "LLMに国際経営の専門家の役を与え、「X-Y」という架空の名前の次元（個人の自由／伝統への同調、多様性への寛容／少数者の排除、個人間の平等／地位や集団による差別）で、国ごとに0〜100のスコアを答えさせる。国ごとに別々に問い、5回繰り返して平均する。基準は、世界価値観調査と欧州価値観調査をまとめたAkaliyskiら（2026）の指標（102か国、29項目）（方法）。", "p4": "検証する仮説は、相関（H1）、モデル世代での改善（H2）、国グループ（儒教圏・西洋・西洋周辺）ごとの切片のずれ（H3）、ホフステード指標との一致（H4）。国グループのダミーを加えた回帰で見て、別のI-C指標3つと、グループ分類の変更で頑健性を確かめる（方法）。", "p5": "LLMの推定と調査指標の相関は0.789（Gemini 1.5 Flash）〜0.874（GPT-4.1）で、世代で改善するがGPT-4.1で頭打ち（表1）。GPT-5では、国グループのダミーでR²が0.763から0.843に上がり、儒教圏は−10.847、西洋は+17.034、西洋周辺は+10.734で、ずれは主に切片にある（表2）。ホフステード指標を加えるとR²は0.875で、係数は0.466と、調査指標の1.042に近い大きさ（表3）。小さい・古いモデルはノイズが大きく、R²はGPT-4o-miniが0.701、Gemini 1.5 Flashが0.641。", "p6": "基準は2026年の新しい調査指標1つで、別の定義や行動での表れとのずれは別の問題。国の標本、モデルにアクセスした時期、I-Cの1次元に限る。ホフステードとの一致の原因が、得点自体への露出か、その枠組みが作った言説かは切り分けられない。下流の影響は検証していない（考察、限界）。", "fun": "「日本人は集団主義、欧米人は個人主義」という見方は、昔のホフステードの調査に基づく有名な話です。最新の大規模調査と比べると、AIも国の順位はかなり当てますが、西洋は「個人主義すぎる」、東アジアは「集団主義すぎる」と、固定観念の方向にずれます。しかもそのずれは、古い研究の順位と並んで動いていました。AIは、新しい調査より昔の定説を覚えているのかもしれません。", "unverified": "オンライン補足資料（C〜H）の国別の値、モデルごとの詳しい回帰結果、頑健性の詳細は読み切れていない。はじめに後半の先行研究と仮説の導出は確認していない。"}}, {"id": "jr08", "rank": 8, "headline": "LLMの専門家デルファイは新しい論点で乖離する", "title": "Large Language Models Aligned With Medical Experts on Established Topics but Were Less Aligned on Emerging or Debated Topics in Posterolateral Corner Treatment: An Artificial Intelligence‐Augmented Delphi Study", "url": "https://doi.org/10.1002/ars2.70086", "authors": "Yinan Yu ほか", "venue": "Arthroscopy, Sports Medicine, and Rehabilitation", "date": "2026-11-10", "sjr": 0.956, "citescore": 4.4, "citescore_year": "2025", "apa": "Yu, Y., Tollefson, L. V., LaPrade, R. F., Chahla, J., Oettl, F. C., Samuelsson, K., & Feldt, R. (2026). Large Language Models Aligned With Medical Experts on Established Topics but Were Less Aligned on Emerging or Debated Topics in Posterolateral Corner Treatment: An Artificial Intelligence‐Augmented Delphi Study. Arthroscopy, Sports Medicine, and Rehabilitation. https://doi.org/10.1002/ars2.70086", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Arthroscopy, Sports Medicine, and Rehabilitationの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "膝の後外側角の治療について、LLM4種に専門家のDelphi法と同じ作業（合意文の5段階評価と、専門家の合意度の推定）をさせ、確立した話題では専門家とよく合い、新しい・議論のある話題では合いにくいことを示した（題名、抄録）。", "p2": "LLMが医療の専門家の知識と合意をどこまで反映するかを、同時に行った専門家の修正Delphi研究と比べて評価し、LLMの振る舞いを質的に分析する（抄録）。", "p3": "4つの市販LLM（Gemini-2.5-Pro、GPT-4o、o4-mini、o3）に、後外側角の合意文を5段階のリッカート尺度で評価させ、専門家の合意の水準も推定させる。複数回の呼び出しでの自己一貫性を見る。ウェブ検索を使う「ディープリサーチ」で性能が上がるかも調べる（抄録）。", "p4": "指標は、専門家の多数意見との一致、専門家の合意を予測する正確さ、複数回の呼び出しでの自己一貫性（抄録）。専門家の人数と文の数は未確認。", "p5": "LLMの評価は専門家の平均評価と中程度の相関で、一部のモデルは過度に肯定的に評価する傾向があった。自己一貫性から得た合意は、専門家の合意を確実には近似しなかった。LLMによる合意の推定は有益で、一部のモデルは実際の合意との一致が改善した。根拠の作り方、確信の表し方、相反する証拠の扱いはLLMごとに違った。ディープリサーチで評価の正確さと合意の予測が上がる予備的な結果があり、推論に幻覚の疑いが見られ、確認が要る（抄録）。", "p6": "著者は、直接の評価と自己一貫性が専門家のパネルと完全には一致しないとし、モデルの選択や組み合わせが有益だと述べる。ディープリサーチの効果は予備的で、幻覚の証拠は検証が必要。エビデンスレベルはV（専門家の意見）（抄録）。相関係数や専門家の人数は未確認。", "fun": "膝の外側の複雑な靱帯（後外側角）の治療法について、医者たちが「この文に賛成か」を点数で答えて合意をつくる手法（デルファイ法）を、AIにもやらせてみました。定番の話題では専門家とよく合ったのに、新しい話題や意見が割れる話題では合いにくくなりました。AIにウェブ検索をさせると、合意の予測が良くなったのも面白い点です。", "unverified": "本文を入手できず、専門家の人数、評価した文の数、相関係数などの数値、ディープリサーチの条件、幻覚の具体例は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "知識グラフ＋LLMのアイデアを100人超の研究責任者が評価", "title": "Generating interesting scientific ideas using knowledge graphs and LLMs: Evaluations with 100 research group leaders", "url": "https://doi.org/10.1073/pnas.2611349123", "authors": "Xuemei Gu ほか", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "date": "2026-11-09", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Gu, X., & Krenn, M. (2026). Generating interesting scientific ideas using knowledge graphs and LLMs: Evaluations with 100 research group leaders. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2611349123", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "オープンアクセス版（arXiv v4）の本文を読んだ（抄録・はじめに・貢献1〜4・考察と限界）。補足資料は読み切れていない。出版社版（PNAS）との差は未確認", "preprint": false, "p1": "論文5800万報の知識グラフとLLMから、2人の研究者の共同研究案を生成するSciMuseを作り、100人超のグループリーダーに4,400件超の案を評価してもらって、案の「面白さ」を大規模に測り、予測できることを示した（抄録）。", "p2": "AIが作る研究案が経験を積んだ科学者にとって面白いかを、多様な分野で大規模に人が評価した研究はほぼなかった。既存の評価は、博士課程の学生を対象にした少人数のものだった（はじめに）。", "p3": "プレプリント2,444,442件から抽出した123,128の概念を頂点とし、題名・抄録で共起した概念を辺（引用と時間で重み付け）とする知識グラフを作る。2人の研究者の直近の論文から概念のプロフィールを作り、自己批評と改訂を重ねるプロンプトで共同研究案を生成する。条件は、高被引用予測の概念対、ランダムな概念対、題名だけのGPT基準の3つ（貢献1・2）。", "p4": "マックス・プランク協会の研究グループリーダー267人を招待し、110人が参加（41.20%）。各人が、条件ごとに16件、計48件の案を、1（面白くない）〜5（とても面白い）で評価し、4,451件が得られた（完了率84.3%）。条件間の平均、4・5の割合、グラフ特徴量との関係、面白さの予測（AUC）を調べる（貢献3・4）。", "p5": "評価の平均は2.403で、最頻は1（36.7%）、4か5は1,107件（24.9%）。条件別の平均は、高被引用予測が2.350、ランダムが2.446、題名のみが2.414で、知識グラフが選ぶ概念対は基準より面白さを高めず、高被引用予測はランダムより低い弱い傾向（1.94σ）（貢献3）。面白さは、25個のグラフ特徴量のニューラルネット（AUC 63.20%）とGPT-4oのゼロショット順位付け（AUC 67.44%）で、弱いが偶然を上回る精度で予測でき、上位5件の精度は49.20%と45.76%（貢献4）。", "p6": "評価者はマックス・プランク協会の所属で自然科学が多く、任意参加の自己選択バイアスがあり、結果は科学者全体を代表しない。面白さの評価は評価者ごとに閾値が違う。評価者が提案された共同研究の当事者の1人のため、意味的距離は自分の専門からの距離とも重なり、切り分けられない。知識グラフは主に英語の文献に偏る（考察と限界）。", "fun": "AIが考えた研究アイデアを、100人以上の研究グループのリーダーに採点してもらうと、平均は5点満点で2.40点と低めでした。意外なのは、「論文でよく引用されそうな組み合わせ」を選んで与えても、ランダムに選んだ組み合わせより面白くならなかったことです。よく知られたテーマは、専門家には面白く感じにくいのかもしれません。それでも、AI自身に「どちらが面白いか」を比べさせると、専門家の評価を弱いながら当てられました。", "unverified": "補足資料（プロンプトの全文、追加の分析、図9〜14）は読み切れていない。知識グラフ構築の細部とニューラルネットの設定は一部のみ確認。PNAS掲載版とarXiv v4の差は確認していない。"}}, {"id": "jr10", "rank": 10, "headline": "生成AIが知識労働の産業構造を変える条件を二軸で整理", "title": "Generative AI and the architecture of knowledge work: Expertise bypass, exchange governability, and shifting bottlenecks", "url": "https://doi.org/10.1002/sej.70069", "authors": "Michael G. Jacobides ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-11-10", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "apa": "Jacobides, M. G., Ma, M. D., Das, A., Langione, M., & Iyer, S. (2026). Generative AI and the architecture of knowledge work: Expertise bypass, exchange governability, and shifting bottlenecks. Strategic Entrepreneurship Journal. https://doi.org/10.1002/sej.70069", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Strategic Entrepreneurship Journalの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "生成AIが知識労働の業界アーキテクチャ（活動が企業の境界をまたいでどう配分されるか）をいつ変えるかを、「専門性の迂回」と「交換の統治可能性」という2つの独立な次元から説明し、4つの構成を示した（抄録）。", "p2": "生成AIと仕事の研究は、これまでタスクに注目してきた。タスクの水準の効果が、企業の境界をまたぐ活動の配分をいつ変えるかが問いだった（抄録）。", "p3": "3段階の帰納的（abductive）設計で、役員のラウンドテーブル、626社のウェブサイトのパネル（2017〜2025年）、C級の役員と社外取締役への33件のインタビューと追加のラウンドテーブルを使う。専門性の迂回（専門性なしでAIが成果物を作れるか）と、交換の統治可能性（その活動を仕様化・検証・価格付け・保証できるか）の2次元で整理する（抄録）。", "p4": "626社のウェブサイトの位置づけの文言を、専門サービス企業とインタフェース志向のテクノロジー企業で比べ、インタビューで確かめる質的な設計（抄録）。コーディングの方法と指標は未確認。", "p5": "専門サービス企業は関係に基づく価値を前面に出し、インタフェース志向のテクノロジー企業は拡張可能なインタフェースを強調するという、分岐した位置づけを確認した。2つの次元の交差から、争われる再配分、選択的な内製化を伴う持続的な束、連合型の専門家提供、統合型の専門家提供の4つの構成が生じる。両方が揃うと仕事は争われ再配分されうるが、食い違うと、AIへの曝露が大きい活動も束ねられたままで、曝露が小さい人間集約的な仕事が連合型の専門家モデルで動きうる（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：質的な探索的研究のため、4つの構成の一般化や因果の検証は別の課題と考えられる。", "fun": "AIが仕事を奪うかという話では、「AIで置き換えやすい仕事か」だけを見がちです。この論文は、もう1つの軸として、その仕事を会社の外に出して「仕様を決め、検査し、値段をつけ、保証できるか」を見ました。両方そろうと仕事は会社の間を動くが、そろわないと、AIが得意な仕事でも会社の中に残りうる、という整理です。", "unverified": "本文を入手できず、626社の抽出方法、コーディングの手順、インタビューの内容、4つの構成の事例は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "AI依存の二経路が認知的自律性と創造的成果に与える影響", "title": "The challenge of AI dependence: exploring its impact on cognitive autonomy and elaboration in creative performance", "url": "https://doi.org/10.1108/itp-12-2025-1853", "authors": "Yanyang Ma ほか", "venue": "Information Technology and People", "date": "2026-11-09", "sjr": 1.956, "citescore": 15.5, "citescore_year": "2025", "apa": "Ma, Y., Li, K., & Liu, Y. (2026). The challenge of AI dependence: exploring its impact on cognitive autonomy and elaboration in creative performance. Information Technology & People, 1–34. https://doi.org/10.1108/itp-12-2025-1853", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Information Technology and Peopleの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "AIへの依存を「道具的依存」と「感情的依存」の二経路で捉え、それが認知的自律性と創造的成果の精緻化にどう影響するかを、2段階の混合研究で調べた（抄録）。", "p2": "AIが広がるほど利用者の認知的自律性が弱まる懸念があるが、AI依存の構成と、認知的自律性や創造的成果への影響は十分に探られていない（抄録）。", "p3": "認知評価理論と精緻化見込みモデルから、道具的依存と感情的依存を中核変数とする二経路モデルを組み立て、2種類のAI依存の形成機構と、認知的自律性への異なる影響を説明する（抄録）。", "p4": "2段階の混合研究。研究1で、知覚された信頼、相互作用性の次元、依存、認知的自律性の関係と媒介を検証し、研究2は小標本の探索的な実験で、選んだ仮説を再検証して創造的成果の精緻化を見る（抄録）。標本の大きさは未確認。", "p5": "研究1：知覚された信頼は主に道具的依存に正の効果を持つ。相互作用性の次元は、感情的依存と認知的自律性に違った影響を与える。媒介分析で、依存の中核的な媒介の役割を確認した。研究2：道具的依存が創造的成果の精緻化の次元に負の効果を持つ可能性を見いだした（抄録）。数値は未確認。", "p6": "研究2は小標本の探索的な実験で、結果は予備的（抄録）。貢献は、二経路の形成機構と、依存が認知的自律性を作り替える点とされる。本文を入手できず、標本・尺度・効果量は未確認。", "fun": "AIに頼ることには2種類あります。「便利な道具だから頼る」と「なんとなく気持ちの上で頼る」です。この研究によると、AIへの信頼は主に「道具として頼る」ほうを強め、その道具的依存は、創造的な作品の作り込み（精緻化）を弱めるかもしれません。ただし小さな実験で、結論は予備的です。何に、どう頼るかで、考える力への影響が違いそうです。", "unverified": "本文を入手できず、標本の大きさ、尺度、効果量、媒介分析の数値、研究2の実験条件は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "サービス研究の追試の類型と実施の指針・チェックリスト", "title": "Strengthening service research through replication: contributions, guidelines, and a checklist", "url": "https://doi.org/10.1108/josm-03-2026-0263", "authors": "Sören Köcher ほか", "venue": "Journal of Service Management", "date": "2026-11-10", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Köcher, S., Van Vaerenbergh, Y., Hazée, S., Köcher, S., & Zwienenberg, T. J. (2026). Strengthening service research through replication: contributions, guidelines, and a checklist. Journal of Service Management, 37(6), 293–325. https://doi.org/10.1108/josm-03-2026-0263", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Service Managementの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "サービス研究で少ない追試（replication）を増やすため、追試の分類（3次元）と、4つの貢献の経路、5段階の指針、評価用のチェックリストを示した（抄録）。", "p2": "追試は確立した現象を確認・修正する重要性が認識されているが、サービス研究では比較的少ない。概念の整理と、定量的な追試の実施・公刊の実践的な指針が足りない（抄録）。", "p3": "追試の広い文献とサービス研究の既存の追試に基づく概念的・内省的な方法。追試を、忠実度、研究者の独立性、主張の出所の3次元で分類し、理論の確認（validating）・理論の拡張（extending）・方法の洗練（refining）・実務への翻訳（translating）の4つの貢献経路を統合した枠組みにする（抄録）。", "p4": "方法は概念的・内省的で、サービス文献の例で各貢献経路を例示する（抄録）。データによる検証や評価指標は未確認。", "p5": "追試は単なる検証を超える貢献を生みうるとし、4つの貢献経路と、追試を行い・書き・評価するための5段階の指針を提案する。著者・査読者・編集者が追試の質を体系的に評価できるチェックリストも作る（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：概念的な提案で、指針とチェックリストが実際の追試や査読で機能するかは、抄録からは分からない。", "fun": "科学の結果は、別の人が同じ方法でやっても同じになるか（追試）を確かめて、はじめて信用できます。ところがサービス研究では追試が少ないそうです。この論文は、追試を「どこまで同じに再現するか」「誰がやるか」「何を主張しているか」の3つの軸で分け、確認するだけでなく、理論を広げる・方法を磨く・現場に翻訳するという、4つの役立ち方があると整理しました。", "unverified": "本文を入手できず、3次元の具体的な区分、5段階の指針とチェックリストの項目、挙げられた事例は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "仮想インフルエンサーは非営利との協働で信頼が高まる", "title": "Who stands with the virtual influencer? Trust in nonprofit versus corporate partnerships in social advocacy", "url": "https://doi.org/10.1108/jrim-12-2025-0764", "authors": "Leping You ほか", "venue": "Journal of Research in Interactive Marketing", "date": "2026-11-09", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "apa": "You, L., & Liu, F. (2026). Who stands with the virtual influencer? Trust in nonprofit versus corporate partnerships in social advocacy. Journal of Research in Interactive Marketing, 1–20. https://doi.org/10.1108/jrim-12-2025-0764", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Research in Interactive Marketingの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "バーチャルインフルエンサー（VI）が非営利組織と組むと、社会的な主張への日和見や冷笑の知覚が下がり、信頼が上がることを、2つの事前登録実験（N=640）で示した（抄録）。", "p2": "VIと組織の協働が、社会的な主張での消費者の日和見や冷笑の知覚を減らせるか、信頼が媒介するか、脆弱性の開示が調整するかは不明だった（抄録）。", "p3": "実験1は3条件（VI単独、VIと企業、VIと非営利組織）。実験2は、協働の種類（VI-企業／VI-非営利）×脆弱性の開示（予算の制約を開示／しない）の2×2で、信頼を通る間接効果を開示が調整するかを調べる（抄録）。", "p4": "2つの事前登録実験で合計640人。評価するのは、信頼、日和見の知覚、冷笑の知覚で、信頼の媒介を検証する（抄録）。", "p5": "実験1では、VI-非営利はVI単独より信頼が高く日和見と冷笑が低いが、VI-企業との比較は有意でない。実験2でも、企業との協働に対して同じ非営利の優位が出た。信頼が否定的知覚の差を媒介した。脆弱性の開示は日和見と冷笑を下げたが、信頼を有意に上げず、信頼を通る間接効果も調整しなかった（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：実験の状況は設定されたもので、現実のキャンペーンでの効果は別の問題。効果量は未確認。", "fun": "SNSのキャラクター（バーチャルインフルエンサー）が社会問題を訴えるとき、1人で言うより、非営利団体と組むほうが信頼されやすい、という実験です。企業と組むときは、この効果が出ませんでした。さらに、「予算が足りません」と弱みを正直に明かすと、日和見だという印象は減りましたが、信頼そのものは増えませんでした。", "unverified": "本文を入手できず、参加者の属性、刺激の内容、効果量、有意水準の数値、事前登録の内容、尺度は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "気候政策の不確実性は費用の粘着性を下げる", "title": "Can climate policy uncertainty reduce corporate cost stickiness?", "url": "https://doi.org/10.1080/00036846.2026.2761046", "authors": "Yuan Tian ほか", "venue": "Applied Economics", "date": "2026-11-08", "citescore": 4.4, "citescore_year": "2025", "apa": "Tian, Y., Zhang, W., Ma, J., & Wen, Y. (2026). Can climate policy uncertainty reduce corporate cost stickiness? Applied Economics, 1–19. https://doi.org/10.1080/00036846.2026.2761046", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Applied Economicsの抄録のみを読んだ（OpenAlex。本文は入手できず）", "preprint": false, "p1": "気候政策の不確実性（CPU）が企業の費用の硬直性を下げることを、中国のA株上場企業の2009〜2025年のパネルで示し、その機構と経済的な帰結を分析した（抄録）。", "p2": "低炭素化の方向が明確でも実施の経路が不確かなとき、CPUが企業の資源調整にどう影響するかは、制度変化に直面した企業行動を理解する上で重要な問いだった（抄録）。", "p3": "中国A株上場企業の2009〜2025年のパネルデータで、CPUと費用の硬直性の関係を推定する。機構として、企業固有の炭素集約的資産への投資と人的資本の構造を調べ、低コスト戦略の企業と非国有企業での違い、財務業績・財務困難・組織のレジリエンスへの帰結も見る（抄録）。推定式とCPUの指標は未確認。", "p4": "評価は、CPUの係数（費用の硬直性への効果）、機構変数（資産投資・人的資本）、サブサンプル（戦略・所有形態）、帰結（財務業績、財務困難、レジリエンス）（抄録）。内生性への対処は未確認。", "p5": "CPUは費用の硬直性を有意に下げる。低炭素化の方向が明確で実施経路が不確かなとき、経営者は座礁資産のリスクを懸念し、調整を遅らせず予防的に資源を調整する。CPUは、炭素集約的な企業固有資産への投資を減らし、人的資本の構造を最適化して、費用調整の柔軟性を高める。効果は低コスト戦略の企業と非国有企業で強い。硬直性の低下は、財務業績を高め、財務困難を減らし、レジリエンスを高める（抄録）。係数の大きさは未確認。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：結果は中国の上場企業に限られ、他国や非上場企業への一般化、逆の因果や欠落変数への対処は、抄録から判断できない。", "fun": "「これから環境規制がどうなるか分からない」とき、会社はじっと待つのが得策に思えます。でも、この研究の中国企業のデータでは、規制の不確実性が高いほど、会社は費用を柔軟に調整し、費用が下がりにくい性質（硬直性）が弱くなりました。古い設備にお金を固定せず、人材の構成も見直すためで、結果として業績や打たれ強さが上がるという結果です。", "unverified": "本文を入手できず、CPUの測り方、費用の硬直性の推定式、識別戦略、係数の大きさ、頑健性の検定は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "年報のテキスト指標で資金制約とデジタル化を分析", "title": "Financial constraints and corporate digital transformation: Evidence from text-based measures and distributional analysis", "url": "https://doi.org/10.21511/imfi.23(4).2026.17", "authors": "Hung Nguyen Viet ほか", "venue": "Investment Management and Financial Innovations", "date": "2026-11-10", "citescore": 3.0, "citescore_year": "2025", "apa": "Nguyen Viet, H., Nguyen Ha, L., & Ha Quynh, H. (2026). Financial constraints and corporate digital transformation: Evidence from text-based measures and distributional analysis. Investment Management and Financial Innovations, 23(4), 275–289. https://doi.org/10.21511/imfi.23(4).2026.17", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社のHTMLページで読めたのは、抄録、キーワード、図表の題名、参考文献だけで、本文の章は入手できなかった。抄録の範囲の解説", "preprint": false, "p1": "ベトナムの上場製造業で、財務制約が、年次報告書から作ったテキストベースのデジタル変革の測度と負に関連し、その関連は分布の上側ほど強まる傾向にあるが、分位点間の差は統計的に有意でないことを示した（抄録）。", "p2": "財務制約とデジタル変革の関係が、デジタル変革の条件付き分布の位置によって変わるかが問いだった（抄録）。", "p3": "2017〜2024年の272社の均衡パネル。年次報告書からTF-IDFの重みと主成分分析で、デジタル変革のテキスト指標を作る。高次元固定効果（HDFE）、2段階のSystem GMM、モーメント法の分位点回帰（MMQREG）を組み合わせて推定する（抄録）。", "p4": "指標は、財務制約の係数（HDFEとSystem GMM）、遅れの従属変数の係数（持続性）、MMQREGの分位点ごとの係数と、その等値の検定。付録で、遅れの従属変数の境界検定と、System GMMの操作変数のラグ選択への感度を確かめる（抄録、表の題名）。", "p5": "HDFEとSystem GMMの両方で、財務制約はテキストベースのデジタル変革の測度と、一貫して負で統計的に有意な関連を示す。遅れの従属変数の係数は正で、測度に時間的な持続性がある。MMQREGの点推定は、分布の上側の分位点ほど負に大きくなるが、係数の等値の検定は、分位点間で異なる十分な証拠を与えない（抄録）。係数の大きさは未確認。", "p6": "著者は、この測度が企業の開示から作られるため、実現したデジタル投資や検証された実装の直接の証拠として解釈すべきでないと述べ、分位点間の差を示す有意な証拠はないとする（抄録）。因果の識別は未確認。対象はベトナムの上場製造業。", "fun": "「お金に余裕がない会社ほど、デジタル化に取り組みにくい」。では、その関係は、デジタル化が進んだ会社でも同じでしょうか。この研究は、会社の年次報告書の言葉の使われ方を、機械学習の手法で点数にして調べました。お金の制約が強いほど報告書上のデジタル化は低く、デジタル化が進んだ会社ほど影響が大きい傾向はあるものの、統計的にはっきりした差ではありません。報告書の言葉と実際の投資は同じとは限らない点も、著者は注意しています。", "unverified": "本文の章（仮説、データ、結果の詳細）を入手できず、係数の大きさ、標準誤差、財務制約の測り方、操作変数の選び方、図1と表の数値は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "灰色・緑のインフラの格差が洪水耐性の格差と対応", "title": "Imbalanced Gray‐Green Infrastructure Closely Parallels Extreme Rainfall‐Flood Resilience Inequality Between Mainstream and Tributary Cities in the Pearl River Basin, Southern China", "url": "https://doi.org/10.1029/2026ef009184", "authors": "Jinyuan Ren ほか", "venue": "Earth's Future", "date": "2026-11-10", "sjr": 3.116, "citescore": 13.2, "citescore_year": "2025", "apa": "Ren, J., Xie, Z., Lv, H., Wang, W. J., Yang, H., Yang, D., Xu, J., & Bai, S. (2026). Imbalanced Gray‐Green Infrastructure Closely Parallels Extreme Rainfall‐Flood Resilience Inequality Between Mainstream and Tributary Cities in the Pearl River Basin, Southern China. Earth’s Future, 14(11). https://doi.org/10.1029/2026ef009184", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Earth's Futureの抄録のみ（本文は入手できず）。抄録中のGini係数などの数値は欠落している", "preprint": false, "short": true, "p1": "珠江流域で、排水網と緑地（灰色・緑のインフラ）の提供の不平等が、豪雨・洪水への耐性の不平等と対応していることを示した。", "p3": "2025年の台風Wutipの期間を固定した極端事象の観測窓で、排水網と都市緑地でインフラを表し、Gini係数と、機械学習による「洪水感受性–インフラ脆弱性」の枠組みを組み合わせて、流域全体の耐性を地図にする。水文・発展の文脈の異なる23都市でインフラと耐性の関係を調べた（抄録）。", "p5": "インフラの提供は不平等で、本流の都市は緑地率と排水網の密度が概して高く、支流の都市は建成区ベースのインフラが限られる。耐性は空間的に分化し、珠江デルタなどの都市群で高く、内陸の山地の支流域で低い。建成区ベースの指標は不平等が最も大きく、耐性と強く関連した（抄録）。", "fun": "大雨のとき、排水路と緑地が整った大きな都市は水に強く、山あいの小さな町ほど弱い、という格差を、台風の1回分のデータで見える化しました。川の本流沿いと支流沿いで、同じ流域でも「守られ方」が違うのです。インフラの偏りが、そのまま災害の被害の偏りになるのが面白い点です。", "unverified": "本文未読のため、Giniと耐性の関連の具体的な数値（抄録では欠落）と、機械学習の枠組みの詳細は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "衛星画像のほうが街路画像より通勤手段の分担を予測", "title": "Urban visual AI for travel behavior prediction: A comparative analysis of satellite and street view imagery", "url": "https://doi.org/10.5198/jtlu.2026.2873", "authors": "Jinghao Cao ほか", "venue": "Journal of Transport and Land Use", "date": "2026-11-09", "citescore": 4.6, "citescore_year": "2025", "apa": "Cao, J., Liang, Y., Li, M., & Wang, S. (2026). Urban visual AI for travel behavior prediction: A comparative analysis of satellite and street view imagery. Journal of Transport and Land Use, 19(1), 413–440. https://doi.org/10.5198/jtlu.2026.2873", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Transport and Land Useの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "衛星画像とストリートビュー画像の特徴で、国勢調査区ごとの通勤手段の分担を比べて予測し、衛星の方がやや良く、両方を使う価値があると示した。", "p3": "フロリダ州の国勢調査区で、意味分割により衛星画像・ストリートビューから土地利用と街路の特徴を抽出し、社会人口データと合わせて複数の機械学習モデルで通勤手段の分担を予測する。SHAPで視覚特徴の寄与を解釈する（抄録）。", "p5": "サンプル外R2では概して衛星画像がストリートビューを上回り、木のモデルでの相対改善はおおむね2〜8%。低いズームの広い空間文脈は自動車・公共交通、高いズームの細部は徒歩・自転車の予測がよい。SHAPでは、低密度で緑が多い環境は自動車依存が高く、高密度で歩行者向けの環境は公共交通・アクティブモードの分担が高いという一貫した関連が出た（抄録）。", "fun": "街の写真から、そこに住む人が車で通勤するか、電車か、歩きかを当てられるか、という実験です。上空から見た衛星画像のほうが、道路の目線の写真より当たりやすく、さらにズームの大きさで得意な交通手段が変わりました。見る高さと広さで、街の「語り方」が変わるのが面白い点です。", "unverified": "本文未読のため、モデルの種類、ズームレベルの定義、R2の具体的な値は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "上司向けの感情労働の日々の影響を日誌法で追う", "title": "A Diary Study on the Effects of Supervisor-Directed Emotional Labour on Emotional Exhaustion, Work Engagement, and Job Performance Among Customer Service Employees", "url": "https://doi.org/10.3390/admsci16110559", "authors": "Sandra Yue-Xin Chin ほか", "venue": "Administrative Sciences", "date": "2026-11-09", "citescore": 6.6, "citescore_year": "2025", "apa": "Chin, S. Y.-X., Loh, M. Y., & Lee, M. C. C. (2026). A Diary Study on the Effects of Supervisor-Directed Emotional Labour on Emotional Exhaustion, Work Engagement, and Job Performance Among Customer Service Employees. Administrative Sciences, 16(11), 559. https://doi.org/10.3390/admsci16110559", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Administrative Sciencesの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "上司に向けた感情労働（表層演技・深層演技）が、日々のエンゲージメントや疲弊を通じて職務成績に及ぼす影響を、顧客対応職の日誌研究で示した。", "p3": "資源保存理論に基づき、米国の顧客対応職104人が5日間の日誌に回答し、422の観測が得られた。上司とのやりとりでの深層演技・表層演技と、仕事へのエンゲージメント、情緒的疲弊、職務成績の関係をMplusの多水準分析で検討した（抄録）。", "p5": "個人内の水準では、日々の表層演技はエンゲージメントの低下を通じて成績を下げ、深層演技はエンゲージメントの上昇を通じて成績を上げた。個人間の水準では、平均的に表層演技が多い人は情緒的疲弊が高く、それを通じて成績が低い。個人内と個人間で機構が異なる（抄録）。", "fun": "上司の前で「本当はそう思っていないのに笑顔をつくる」（表層演技）日は、仕事への意欲が下がって成績も下がりました。一方、「相手の立場に立って本心から気持ちを合わせる」（深層演技）日は、意欲が上がって成績も上がります。同じ「感情を演じる」でも、うわべだけか心から合わせるかで、結果が正反対になるのが面白い点です。", "unverified": "本文未読のため、効果量、測定尺度、標本の偏り（顧客対応職のみ）は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "看護でのAIへの態度の尺度は妥当性の根拠が偏る", "title": "Psychometric properties of assessment tools for evaluating attitudes toward artificial intelligence in nursing practice and nursing education: a scoping review", "url": "https://doi.org/10.1186/s12912-026-05572-1", "authors": "Linchun Huang ほか", "venue": "BMC Nursing", "date": "2026-11-10", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Huang, L., Tang, N., Cai, Y., Lin, Y., Huang, J., & Su, Y. (2026). Psychometric properties of assessment tools for evaluating attitudes toward artificial intelligence in nursing practice and nursing education: a scoping review. BMC Nursing. https://doi.org/10.1186/s12912-026-05572-1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "BMC Nursingの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "看護師・看護学生のAIへの態度を測る尺度の心理測定的な性質を整理し、内容・構造の妥当性は報告されるが、収束・弁別妥当性・異文化の不変性・基準関連妥当性の報告が不足していることを示した。", "p3": "PRISMA-ScRに従うスコーピングレビューで、9つのデータベースを2026年9月8日まで検索し、看護の研究と、看護に適応された尺度の元になった非看護集団の研究を対象にした。尺度の特徴と報告された心理測定特性を記述的にまとめた（抄録）。", "p5": "24件（看護の18件・元の尺度の6件）で、11の尺度ファミリー・24の尺度版。内容妥当性と構造妥当性は報告が多いが、収束妥当性・弁別妥当性・異文化の測定不変性は一貫して報告されず、基準関連妥当性はどの研究でも報告がない。内的一貫性は言語版・尺度で異なる。尺度間の優劣は示さない（抄録）。", "fun": "「AIを使うことへの気持ち」を測る質問票はたくさんありますが、その質問票が「本当にその気持ちを測れているか」を確かめる作業（妥当性の検証）は、実は抜けが多いことが分かりました。特に、国や言語が違っても同じ意味で使えるかの確認は、ほとんどされていません。物差しの精度を点検する論文が、気づきにくい穴を見つけるのが面白い点です。", "unverified": "本文未読のため、対象となった尺度の名前と、各特性の報告件数は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "JD-Rモデルの要求度と燃え尽きの関連をメタ分析", "title": "Occupational burnout and professional efficacy in physical education: a multilevel meta-analysis of the job demands-resources model", "url": "https://doi.org/10.3389/fpsyg.2026.1999149", "authors": "Ziqi Wang ほか", "venue": "Frontiers in Psychology", "date": "2026-11-10", "citescore": 7.0, "citescore_year": "2025", "apa": "Wang, Z., Jia, Z., & Wang, W. (2026). Occupational burnout and professional efficacy in physical education: a multilevel meta-analysis of the job demands-resources model. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1999149", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Frontiers in Psychologyの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "体育教員の燃え尽きと職務効力感について、仕事の要求度-資源（JD-R）モデルの関連を、多水準メタ分析でまとめた。", "p3": "PRISMAに従い、2026年5月に5つのデータベースで、体育教員のJD-Rの先行変数と心理的結果（燃え尽き・職務効力感）を調べた査読つきの横断研究を検索した。11研究・4,341人・77の効果量が4つの対象の経路に入り、多水準メタ分析を行った（抄録）。", "p5": "要求度と燃え尽きは正の関連（k=17、r=0.477、95%CI 0.376〜0.568）、資源と燃え尽きは負の関連（k=53、r=-0.342、95%CI -0.435〜-0.241）。探索的な資源の下位集団は、個人資源がr=-0.350（k=30）、組織・社会的資源がr=-0.291（p=0.053）。国による差の探索（F(6, 46)=4.476）もある。資源・要求度のどちらも職務効力感とは有意な関連がない。独立の研究の数が限られ、下位集団・国別は慎重に解釈する必要がある（抄録）。", "fun": "仕事がきつい（要求）ほど先生は燃え尽きやすく、助けがあるほど燃え尽きにくい、という考え方（JD-Rモデル）を、体育の先生に関する11の研究をまとめて確かめました。燃え尽きとの関係ははっきり出た一方、自分の仕事が役に立っているという感覚（職務効力感）とは、研究の数が少なく、はっきりした関係は見えませんでした。強い関係と、まだ分からない関係を分けて示す誠実さが面白い点です。", "unverified": "本文未読のため、研究間の異質性の指標と出版バイアスの検討は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "重い精神疾患のある成人の世代間ケアは同居で左右", "title": "Coresidence With Children or Parents and Caregiving Among Adults With Serious Mental Illness: A Convergent Mixed‐Methods Study in Beijing", "url": "https://doi.org/10.1155/hsc/7806239", "authors": "Ying Li", "venue": "Health & Social Care in the Community", "date": "2026-11-10", "citescore": 6.7, "citescore_year": "2025", "apa": "Li, Y. (2026). Coresidence With Children or Parents and Caregiving Among Adults With Serious Mental Illness: A Convergent Mixed‐Methods Study in Beijing. Health & Social Care in the Community, 2026(1). https://doi.org/10.1155/hsc/7806239", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Health & Social Care in the Communityの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "重い精神疾患のある成人でも、子や親へのケアを担っており、子との同居はケアの提供を増やすが年齢とともに弱まることを、北京の混合研究で示した。", "p3": "収束的な混合研究法で、重い精神疾患（SMI）のある北京の成人について、子または親との同居が、過去30日のケア提供の有無と日数に関連するかを調べ、年齢が調整するかを検討した。量的な結果の説明に質的な面接のテーマを使う（抄録）。", "p5": "子との同居はケア提供の確率（OR 2.63、95%CI 1.36〜5.07）と日数（b=7.97）と正の関連だが、年齢とともに弱まる（OR 0.94、b=-0.33）。親との同居はどちらとも有意でなく、年齢は日数との関連を、境界的な有意水準で強める（b=0.34、p=0.05）。質的には、子へのケアは一般的、親へのケアは親の健康と近さに依存、同居者の方が頻繁に手伝える、ケアが意味・目的・希望の源にも不適切な支援では否定的な感情にもなる、の4つのテーマが得られた（抄録）。", "fun": "心の病気がある人は「ケアされる側」と思われがちですが、実は子どもや親の世話をしている人も多い、という話です。しかもそれが生きる意味や希望にもつながる一方、支えが足りないと負担や苦しみにもなります。「支えられる人」が同時に「支える人」でもあることに気づかせてくれるのが面白い点です。", "unverified": "本文未読のため、標本の規模、変数の定義、質的なテーマの根拠は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "ESG開示と業績の関係をイノベーション能力が強める", "title": "Exploring the Moderating Role of Innovation Capabilities in the ESG Disclosure–Firm Performance Relationship: Evidence From an Emerging Market", "url": "https://doi.org/10.1002/sd.71853", "authors": "Rizwana Khurshid ほか", "venue": "Sustainable Development", "date": "2026-11-09", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "apa": "Khurshid, R., Islam, A. u., & Malik, N. (2026). Exploring the Moderating Role of Innovation Capabilities in the ESG Disclosure–Firm Performance Relationship: Evidence From an Emerging Market. Sustainable Development. https://doi.org/10.1002/sd.71853", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Sustainable Developmentの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "インドのNifty 500で、ESG開示が企業の業績を高める関係を、R&D集約度や技術ノウハウが強めることを示した。", "p3": "Nifty 500の2015〜2025年のパネルで、ROE・ROA・Tobin's Qで業績を測り、イノベーション能力をR&D集約度・技術ノウハウ（暗黙知）・特許で表す。固定効果回帰（Driscoll–Kraay標準誤差・PCSE）とシステムGMMで頑健性を確かめた（抄録）。", "p5": "ESG開示は収益性・業務効率・市場評価に正の効果をもつ。環境・社会・ガバナンスの各要素も個別に業績に寄与する。R&D集約度と技術ノウハウは、ESG開示とその各要素の正の効果を一貫して強める。特許は、会計ベースの業績を弱める一方で、長期の技術的な可能性を示して市場評価を高めるという、混合した調整効果を示す（抄録）。", "fun": "「環境や社会への取り組みを公開すると、会社の成績が良くなる」と言われますが、その効果は、会社が持つ技術力や学ぶ力で大きく変わる、という話です。特許を多く持つと、短期の利益には重しになる一方、株価では将来性として評価されるなど、同じ特許が見方で逆の顔を見せるのが面白い点です。", "unverified": "本文未読のため、効果の大きさ、内生性の扱い、変数の定義は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "不正ペンタゴンとBeneish M-Scoreで不正を検証", "title": "Fraud Pentagon and financial statement fraud: The moderating role of audit opinion in Indonesian Pharmaceutical Companies", "url": "https://doi.org/10.26905/afr.v8i2.17973", "authors": "Fatiyatul Islami ほか", "venue": "AFRE (Accounting and Financial Review)", "date": "2026-11-10", "apa": "Islami, F., Safriliana, R., Yuniarti, S., & Mennita, R. (2025). Fraud Pentagon and financial statement fraud: The moderating role of audit opinion in Indonesian Pharmaceutical Companies. AFRE (Accounting and Financial Review), 8(2), 79–93. https://doi.org/10.26905/afr.v8i2.17973", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "AFRE（Accounting and Financial Review）の抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "不正の要因をまとめた「フラウド・ペンタゴン」と財務諸表不正の関係を、監査意見が調整するかを、インドネシアの製薬企業で検証した。", "p3": "インドネシア証券取引所に上場する製薬10社の2019〜2023年の監査済み財務諸表・年次報告書（50企業年）で、財務諸表不正をBeneish M-Scoreで測り、圧力・能力・機会・正当化・傲慢を、財務の安定性・取締役の変更・監視の不備・監査人の交代・年報のCEO写真の頻度で代理する。ロジスティック回帰と調整分析を使う（抄録）。", "p5": "圧力のみが財務諸表不正と有意な関係を示し、他の4要素は個別には有意でない。監査意見は、圧力・機会・傲慢と不正の関係を調整するが、能力・正当化の関係は調整しない。製薬企業の不正リスクの指標を評価するときは監査意見を考慮する必要があると述べる（抄録）。", "fun": "不正を働く会社には、「追い詰められている」「チャンスがある」「自分は大丈夫だと思っている」といった共通点があると言われます。この研究は、その「傲慢さ」を、なんと年次報告書にCEOの写真が何回出てくるかで測りました。ユニークな代理指標ですが、標本が小さく、結論は慎重に読む必要があるのが面白い点です。", "unverified": "標本が10社・50企業年と小さく、代理変数の妥当性は本文未読のため未確認。"}}, {"id": "jr24", "rank": 24, "headline": "財務困窮が深いほど不正リスクが高い（マレーシア）", "title": "Financial fraud in Malaysia's consumer products industry: Evidence on financial distress and corporate tax reporting", "url": "https://doi.org/10.59953/paperasia.v42i5b.1456", "authors": "Zafierah Zainazor ほか", "venue": "PaperASIA", "date": "2026-11-10", "citescore": 0.7, "citescore_year": "2025", "apa": "Zainazor, Z., Rashid, N., Mohd Nasir, N. E., Rozaidi, A. H., & Othman, A. (2026). Financial fraud in Malaysia’s consumer products industry: Evidence on financial distress and corporate tax reporting. PaperASIA, 42(5b). https://doi.org/10.59953/paperasia.v42i5b.1456", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "PaperASIAの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "マレーシアの消費財企業で、財務困窮が深いほど不正リスクが高いことを、Beneish M-ScoreとAltman Z-Scoreで示した。", "p3": "Bursa Malaysiaに上場する消費財企業71社・781企業年（2014〜2024年）の均衡パネルで、不正をBeneish M-Score、財務困窮をAltman Z-Score、税務報告を実効税率で測る。Hausman検定で固定効果が選ばれたため企業固定効果回帰を使い、1期前の不正の分類も加えて持続性を捉える（抄録）。", "p5": "Altman Zは不正指標と有意に負の関連（財務困窮が深い＝Zが低いほど不正リスクが高い）。税務報告は有意でなく、前期の不正指標は強く正で、不正に関する報告パターンの持続性が大きい。不正の三角形・ダイヤモンドでは圧力が実証的に関連し、税務報告の裁量が表す機会は文脈依存と考えられる（抄録）。", "fun": "「お金に困った会社は、数字をごまかしたくなる」という直観を、決算の数字だけで作った2つの指標（倒産しやすさのZスコアと、粉飾の疑いのMスコア）で確かめました。さらに、去年疑わしかった会社は今年も疑わしい、という強い続き方も見つかりました。不正は一度きりでなく、習慣のように続くのが面白い点です。", "unverified": "本文未読のため、係数の大きさ、Mスコアの閾値、頑健性検査は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "プラズマのイオンの速度分布が0.1ミリ秒で平坦化", "title": "Direct observation of phase-space dynamics during energetic-particle-driven MHD bursts", "url": "https://doi.org/10.1038/s42005-026-02939-3", "authors": "Katsumi Ida ほか", "venue": "Communications Physics", "date": "2026-11-10", "sjr": 1.641, "citescore": 9.0, "citescore_year": "2025", "apa": "Ida, K., Yoshinuma, M., Kobayashi, T., Nagaoka, K., Ogawa, K., Tokuzawa, T., Nuga, H., & Katoh, Y. (2026). Direct observation of phase-space dynamics during energetic-particle-driven MHD bursts. Communications Physics, 9(1). https://doi.org/10.1038/s42005-026-02939-3", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Communications Physicsの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "プラズマ中のイオンの速度空間と実空間の分布が、MHDバーストの発生から0.1ミリ秒以内に急に変わる様子を、直接観測した。", "p3": "大型ヘリカル装置（LHD）で、MHDバーストの発生場所でのイオンの速度分布の変化を測る。磁場に平行な方向へのイオンの加速と、波と粒子の相互作用（Landau減衰・走行時間減衰）でMaxwell分布から外れる速度分布を、速度空間と実空間で追う（抄録）。", "p5": "バーストの発生から0.1ミリ秒以内に、速度空間での平坦化（速度勾配の低下）と、磁場に平行なイオンのエネルギーが発生場所で30%急増することを示した。加速による異方性は、イオン–イオン衝突の時間スケール（2〜3ミリ秒）で消える。エネルギーの一過的な増加は周辺部では6ミリ秒以内に減衰するが、コアではずっと長く続き、コアのイオンエネルギーの上昇に寄与する（抄録）。", "fun": "核融合装置の中では、イオン（電気を帯びた粒子）が猛烈な速さで飛び回っています。この研究は、位置と速度の両方で「粒子がどんな分布で散らばっているか」を測り、突然の波の乱れ（バースト）の直後に、わずか0.1ミリ秒で速度の分布が平らになり、粒子が一気に加速される様子をとらえました。粒子の分布の時間変化を直接見られるのが面白い点です。", "unverified": "本文未読のため、測定の手法（分光の原理）、再現性、誤差の評価は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "ドローン写真測量と深層学習で石造アーチ橋の欠陥を定量化", "title": "A Novel Defect Detection and Quantification Method for Stone Arch Bridges Based on UAV Photogrammetry and Deep Learning", "url": "https://doi.org/10.1155/stc/7264726", "authors": "Fan Sun ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-10", "citescore": 10.3, "citescore_year": "2025", "apa": "Sun, F., Chun, Q., & Zhang, C. (2026). A Novel Defect Detection and Quantification Method for Stone Arch Bridges Based on UAV Photogrammetry and Deep Learning. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/7264726", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Control and Health Monitoringの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "ドローン写真測量と深層学習を組み合わせて、石造アーチ橋の欠陥の面積やひび割れの長さを実寸で自動的に測れる枠組みができた。", "p3": "UAV写真測量、SfM-MVSによる3D再構成、正射写真と円筒投影の生成、深層学習による実例分割を組み合わせ、画素から物理寸法への直接変換で欠陥面積とひび割れ長を求める。高解像度の投影画像を切り出して、白華・汚れ・ひび割れ・風化・植生の5種の欠陥のデータセットを作り、AFPNとASFFを加えた改良YOLO26s-segで検出・分割した（抄録）。", "p5": "改良モデルは、Box mAP@0.5が76.91%、Mask mAP@0.5が76.87%で、基準を上回りながら、パラメータ数と計算コストを減らした。この枠組みは、欠陥面積とひび割れ長を直接定量でき、古い石造アーチ橋の点検・維持管理の自動化に使える（抄録）。", "fun": "歴史のある石の橋を点検するには、人が足場に登って目で見て、ひび割れの長さを測るので、危険で時間がかかります。この研究は、ドローンで撮った写真から橋の3次元モデルを作り、AIがひび割れや汚れを見つけて、実際の長さまで自動で測ります。危険な場所に人が行かなくても、傷の大きさを数字で残せるのが面白い点です。", "unverified": "本文未読のため、基準モデルとの差の大きさ、データセットの規模、橋の数は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "安価な加速度計1台のウェーブレットで門型クレーンの異常検出", "title": "Structural Health Monitoring of Port Rail-Mounted Gantry Cranes via Wavelet and Machine Learning-Based Algorithms", "url": "https://doi.org/10.3390/infrastructures11110414", "authors": "Daniel Hendrickson ほか", "venue": "Infrastructures", "date": "2026-11-09", "citescore": 5.7, "citescore_year": "2025", "apa": "Hendrickson, D., & Hinders, M. (2026). Structural Health Monitoring of Port Rail-Mounted Gantry Cranes via Wavelet and Machine Learning-Based Algorithms. Infrastructures, 11(11), 414. https://doi.org/10.3390/infrastructures11110414", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Infrastructuresの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "港湾の門型クレーンの異常を、商用のIoT加速度センサ1台の信号をウェーブレットで変換して、オートエンコーダで検出できる方法ができた。", "p3": "加速度信号をウェーブレット領域に変換して3次元の動的ウェーブレット指紋を作り、オートエンコーダの異常検知でその中の異常を目立たせる。遠隔で、保守員も運転員もいないクレーンの早期の故障検出が目的（抄録）。", "p5": "標準的な信号処理と異常検知では、多くの交絡する信号のために不十分な、騒音の多い複合的な産業環境でも、1つのセンサで成功したと報告する。定量的な指標は抄録に書かれていない（抄録）。", "fun": "港のクレーンは、いつも動いていて、ガタガタという他の機械の音も混ざります。その中から「壊れる前のわずかな異常な揺れ」を、安い振動センサ1つで見つける工夫です。揺れの波を、時間と周波数の「指紋」のような画像に変えて、AIに「普段と違う」を覚えさせるのが面白い点です。", "unverified": "抄録に定量的な結果がなく、本文未読のため検出率・誤検知率・実験の規模は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "交通下の橋面舗装をドローンで車両の遮蔽を補って検査", "title": "Drone-Based Vehicle-Aware Spatiotemporal Reliability Fusion for Bridge Deck Pavement Inspection Under Normal Traffic", "url": "https://doi.org/10.3390/drones10110837", "authors": "Taojie Wang ほか", "venue": "Drones", "date": "2026-11-09", "citescore": 10.0, "citescore_year": "2025", "apa": "Wang, T., Qian, Z., & Chen, L. (2026). Drone-Based Vehicle-Aware Spatiotemporal Reliability Fusion for Bridge Deck Pavement Inspection Under Normal Traffic. Drones, 10(11), 837. https://doi.org/10.3390/drones10110837", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Dronesの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "通常の交通がある橋の舗装を、ドローン動画から車両の遮蔽を補って再構成し、ひび割れの長さを測れる枠組みVSRFができた。", "p3": "車両検出を拡張した遮蔽マスクにして時間的な見かけの安定性と合成し、パノラマ座標へ位置合わせしたあと、最も信頼性が高い遮蔽のない観測を舗装表面全体に移して局所的にブレンドする。再構成したモザイクで、ひび割れの分割と基準つきの長さ推定を行う。5つの橋の4020フレームで評価した（抄録）。", "p5": "177.5〜212.0メガピクセルのパノラマで、レーン規模の連続性と舗装の質感・標示・継目・ひび割れの細部を保った。792組の保持した別フレームの回復では、独立の鮮明な基準に対して平均PSNR 30.15 dB、平均SSIM 0.9612。現地基準のひび割れ長の平均絶対百分率誤差は12.6%で、中央値合成の24.0%より小さい（抄録）。", "fun": "橋の上を走る車は、ドローンの目で見たときのじゃまものです。この研究は、同じ場所を何回も撮った動画から、車がいない瞬間の映像をつなぎ合わせて、「車が1台もいない橋」の写真を作ります。道路を止めずに橋の点検ができるのが面白い点です。ひび割れの長さの誤差も、単純な方法の約半分になりました。", "unverified": "本文未読のため、PSNR・SSIMの基準の詳細、ひび割れの検出の精度は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "物流のサービス生態系のデジタル変革を3段階で整理", "title": "Digital transformation of service ecosystems: an orchestration perspective", "url": "https://doi.org/10.1108/ijopm-04-2026-0492", "authors": "Bingyu Han ほか", "venue": "International Journal of Operations and Production Management", "date": "2026-11-10", "sjr": 2.983, "citescore": 15.1, "citescore_year": "2025", "apa": "Han, B., Qin, L., Li, L., & Zhang, W. (2026). Digital transformation of service ecosystems: an orchestration perspective. International Journal of Operations & Production Management, 1–26. https://doi.org/10.1108/ijopm-04-2026-0492", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "International Journal of Operations and Production Managementの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "物流のサービス生態系のデジタル変革が3つの段階を経て進み、資源のオーケストレーションとネットワークのオーケストレーションが相互に作用することを、事例研究で示した。", "p3": "中国の3つの内陸港の事例研究で、面接・観察・文書を突き合わせ、生態系の水準でのオーケストレーションの実践と変革の進展を捉え、過程モデルを作る（抄録）。", "p5": "デジタル変革は、デジタルな接続の整備、デジタルなサービスの可能性の活用、デジタルな価値の共創、という3つの発展段階をたどる。各段階で、関与者は資源とネットワークのオーケストレーションを使い、その2つが相互に作用して時間とともに変化する。オーケストレーションの主導は、異なる関与者が担いうる（抄録）。", "fun": "港の物流は、船会社・倉庫・トラック・税関など、たくさんの会社がつながって動いています。この研究は、デジタル化が「1社のIT導入」でなく、会社のつながり全体で「まず接続し、次にサービスを生かし、最後に価値を一緒に作る」という3段階で進むことを見つけました。さらに、まとめ役は決まった会社でなくても務まるのが面白い点です。", "unverified": "本文未読のため、事例の詳細、データの量、モデルの根拠となる引用は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "持続可能な移動サービスを顧客はどう日常に組み込むか", "title": "Understanding sustainable mobility services: a customer-dominant logic perspective", "url": "https://doi.org/10.1108/jstp-05-2025-0202", "authors": "Maxim Saleschus ほか", "venue": "Journal of Service Theory and Practice", "date": "2026-11-10", "citescore": 9.4, "citescore_year": "2025", "apa": "Saleschus, M., Ruthardt, D., & Hadwich, K. (2026). Understanding sustainable mobility services: a customer-dominant logic perspective. Journal of Service Theory and Practice, 36(7), 297–337. https://doi.org/10.1108/jstp-05-2025-0202", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Service Theory and Practiceの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "顧客が持続可能な移動サービスを日常にどう取り込むかを、顧客優位ロジックから、面接で要因を見つけ、調査で検証した。", "p3": "ドイツのモビリティ事業者の顧客20人への面接を解釈的テーマ分析で整理し、潜在要因の解釈と尺度の開発を行った。次に、オンライン調査（n=278）と構造方程式モデリングで研究モデルを検証した（抄録）。", "p5": "顧客の生態系への持続可能な移動サービスの取り込みは、事業者のサービスの内外のつながりの知覚、そのサービスが顧客の持続可能性に与える価値の知覚、顧客のマルチモーダルな統合行動、事業者の中心性の知覚によって推進される。構造方程式モデリングで、これらの有意な関係と、顧客満足・好意的な口コミへの効果が確かめられた（抄録）。", "fun": "「環境にやさしい交通サービス」を、会社は「環境に良い」と宣伝しがちですが、お客さんは自分の毎日の暮らしの中で、どう使うかを考えています。この研究は、お客さんの言葉から要因を拾い、それを質問票にして調べ、「サービスの使いやすさのつながり」や「中心になる事業者がいること」が満足と口コミにつながると示しました。お客さんの視点から作った物差しが面白い点です。", "unverified": "本文未読のため、構造方程式の適合度と係数の大きさは未確認。"}}, {"id": "jr31", "rank": 31, "headline": "LLMのロールプレイで案内表示の認知バイアスを洗い出す", "title": "Identifying Cognitive Biases in Wayfinding Language at Shanghai Hongqiao Hub Using Large Language Model Role-Play", "url": "https://doi.org/10.70088/cvdect89", "authors": "Yifan Wei ほか", "venue": "Artificial Intelligence and Digital Technology", "date": "2026-11-10", "apa": "Wei, Y., & Jiang, S. (2026). Identifying Cognitive Biases in Wayfinding Language at Shanghai Hongqiao Hub Using Large Language Model Role-Play. Artificial Intelligence and Digital Technology, 3(6), 14–21. https://doi.org/10.70088/cvdect89", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Artificial Intelligence and Digital Technologyの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "LLMのロールプレイで、案内表示の言葉に潜む認知バイアスを洗い出す方法を作り、実調査で何が求められているかを確かめた。", "p3": "上海虹橋ハブの4つの乗換えルートの動画から作った場面の記述をDeepSeekへのプロンプトにして、72の応答を生成し、解釈や判断の難しさにつながる311の手がかりを抽出してコード化した。309人の調査で、案内表示に足したい情報の選択率を調べた（抄録）。", "p5": "シミュレーションでは、課題との照合（77件）と行動の指示（73件）が多かった。調査では歩行時間と距離が最も多く選ばれ、経路の確認と荷物のある旅行者向けの経路も項目評価が高かった。探索的な比較で、時間的な圧力がよくある人は、歩行時間・上り階段・改札までの距離の複合項目を高く評価し、子連れで乗り換えた人は、エレベーター・エスカレーター・バリアフリー経路の情報をよく選んだ（抄録）。", "fun": "駅の案内板は、慣れた人には分かりやすくても、初めての人や荷物のある人、子連れの人には分かりにくいことがあります。この研究は、いろいろな立場の「旅行者」をAIに演じさせて、「ここで迷いそう」という点を先に洗い出し、そのあと実際の人の調査で確かめました。AIが問題の候補を出し、人間が検証する分業が面白い点です。", "unverified": "AIの手がかりと調査の対応関係の厳密な検証は、本文未読のため未確認。抄録は探索的な比較としている。"}}, {"id": "jr32", "rank": 32, "headline": "LLM生成の合成リハビリデータの統計的忠実度を評価", "title": "Exploratory Evaluation of the Statistical Fidelity of Large Language Model-Generated Synthetic Rehabilitation Data for Patients with Hip Fracture", "url": "https://doi.org/10.3390/jcm15218700", "authors": "Ryo Momosaki ほか", "venue": "Journal of Clinical Medicine", "date": "2026-11-09", "citescore": 5.2, "citescore_year": "2025", "apa": "Momosaki, R., Ushida, K., Yamamoto, Y., & Shimizu, A. (2026). Exploratory Evaluation of the Statistical Fidelity of Large Language Model-Generated Synthetic Rehabilitation Data for Patients with Hip Fracture. Journal of Clinical Medicine, 15(21), 8700. https://doi.org/10.3390/jcm15218700", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Journal of Clinical Medicineの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "集計統計だけをLLMに与えて作らせた合成データは、与えた周辺分布は再現するが、与えなかった多変量の構造や下流の課題の性能までは保てないことを、股関節骨折のデータで示した。", "p3": "26,637件の入院記録のうち完全な12,130件から1000件を再現可能に標本抽出し、12変数の集計統計を3つのLLMに与えて、それぞれ1000件の合成データを作らせた。与えた周辺分布への忠実度、与えなかった分布・相関の保存、論理的な妥当性、退院時Barthel指数を予測する探索的な回帰での性能を評価した（抄録）。", "p5": "平均絶対標準化平均差は、GPT 0.164、Claude 0.027、Gemini 0.001。36の相関の平均絶対差は0.090・0.113・0.105。合成データで学習し実データで検証したR2は0.167・−0.080・0.146。与えなかった多変量の構造や課題の性能は一貫して保たれず、実データの置き換えを支持しない（抄録）。", "fun": "「個人データは出せないので、平均や割合だけからAIにそっくりなデータを作ってもらおう」という発想は便利ですが、見た目が似ていても中身が使えるとは限りません。この研究では、平均などは合わせてくれたのに、変数どうしの関係は崩れていて、それで予測を学ぶと実データでは当たらないモデルもありました。見かけの似ているを疑うことの大切さが面白い点です。", "unverified": "本文未読のため、プロンプトの詳細と、プライバシーの評価は未確認。抄録は探索的な結果で、モデルの優劣は確定しないとしている。"}}, {"id": "jr33", "rank": 33, "headline": "ニューヨークの自転車利用を空間的に変わる要因で説明", "title": "Spatial and Temporal Heterogeneity of Multi-Scale Built Environment Influences on Cycling Behavior", "url": "https://doi.org/10.3390/buildings16224475", "authors": "Xitong Yuan ほか", "venue": "Buildings", "date": "2026-11-10", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Yuan, X., Xiong, H., Shi, T., Gao, Y., Chen, M., Peng, C., & Ming, T. (2026). Spatial and Temporal Heterogeneity of Multi-Scale Built Environment Influences on Cycling Behavior. Buildings, 16(22), 4475. https://doi.org/10.3390/buildings16224475", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Buildingsの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "ニューヨークの自転車シェアの利用を、地理的な文脈と環境指標の寄与に分けて、平日と休日で比べ、場所ごとに変わる関連を示した。", "p3": "マンハッタンのCiti Bikeのデータと24の環境指標に、GeoShapleyを組み込んだ説明可能な機械学習を適用し、非線形で空間的に変わる関連を、環境変数の寄与・地理的な文脈・その交互作用に分けて調べる（抄録）。", "p5": "地理的な文脈が最も重要で、駅の供給が環境変数の中で最大の寄与（平日・休日とも）。地下鉄へのアクセス・建物密度・商業用地は平日、住宅用地・自転車経路の密度・駅の供給は休日に重要。街路画像の特徴では、平日は見える建物、休日は歩道の見えやすさが広く正に寄与し、空が広く見えるほど概して利用が少ない（抄録）。", "fun": "自転車をどれだけ使うかは「駅が近いか」「道が安全か」だけでなく、どの場所にいるか（立地そのもの）が一番大きな要因でした。しかも平日は通勤のための地下鉄のつながり、休日は住宅街や自転車道の多さと、利用の理由が変わります。同じ街でも曜日で自転車の使われ方が違うのが面白い点です。", "unverified": "本文未読のため、GeoShapleyの値の大きさとモデルの精度は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "条件付き正規化フローによる償却型・完全ベイズのモデル更新", "title": "Amortized yet fully Bayesian stochastic model updating with conditional normalizing flow", "url": "https://doi.org/10.1016/j.strusafe.2026.102787", "authors": "Sangwon Lee ほか", "venue": "Structural Safety", "date": "2026-11-09", "sjr": 1.544, "citescore": 12.4, "citescore_year": "2025", "apa": "Lee, S., Yaoyama, T., Kitahara, M., Matsumoto, Y., & Itoi, T. (2027). Amortized yet fully Bayesian stochastic model updating with conditional normalizing flow. Structural Safety, 125, 102787. https://doi.org/10.1016/j.strusafe.2026.102787", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "掲載誌（Structural Safety）の題名のみ。抄録・本文は入手できなかった", "preprint": false, "short": true, "p1": "題名によれば、確率的なモデル更新を、条件付き正規化フローで償却（あらかじめ学習して使い回す）しつつ、完全なベイズ推論として行う研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さ：ベイズ推論（答えの不確かさまで出す確率の方法）は、計算に時間がかかるのが弱点でした。償却を組み合わせれば、新しいデータが来るたびに計算し直さず、素早く答えの幅まで出せるのか、という問いが読み取れます。", "unverified": "抄録・本文を入手できず、題名以外は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "光学フローと圧縮センシングで出力のみのモード解析", "title": "Integrating deep optical flow and compressive sensing with blind source separation for Output-Only operational modal analysis", "url": "https://doi.org/10.1016/j.measurement.2026.123864", "authors": "Ipili Mohan Rao ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-11-09", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Rao, I. M., Meena, P. P., Saravanan, T. J., & Dhandole, S. D. (2026). Integrating deep optical flow and compressive sensing with blind source separation for Output-Only operational modal analysis. Measurement, 123864. https://doi.org/10.1016/j.measurement.2026.123864", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "掲載誌（Measurement）の題名のみ。抄録・本文は入手できなかった", "preprint": false, "short": true, "p1": "題名によれば、深層学習のオプティカルフロー、圧縮センシング、ブラインド音源分離を組み合わせた、出力のみの運用モード解析の研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さ：何が揺らしているか分からない（出力のみ）状態でも、動画の動きの情報から、構造物がどんな揺れ方（モード）をしているかを取り出せるのか、という問いが読み取れます。見えない揺れの形を、映像と信号処理で取り出す発想です。", "unverified": "抄録・本文を入手できず、題名以外は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "多チャンネル時間領域の応答分解による構造のモード解析", "title": "A structural modal analysis method based on multi-channel time-domain response decomposition with Taylor series", "url": "https://doi.org/10.1016/j.ymssp.2026.115165", "authors": "Pengfei Jin ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-10", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Jin, P., Shi, Z., Peng, X., Sun, G., & Wang, G. (2027). A structural modal analysis method based on multi-channel time-domain response decomposition with Taylor series. Mechanical Systems and Signal Processing, 262, 115165. https://doi.org/10.1016/j.ymssp.2026.115165", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "掲載誌（Mechanical Systems and Signal Processing）の本文は入手できず、SSRNの版に登録された抄録（Crossrefの題名検索）を使用", "preprint": false, "short": true, "p1": "多チャンネルの自由振動応答を時間領域で分解し、固有モードをTaylor級数で表す新しいモード分解法FRDTSができた。", "p3": "モード形にモード質量の正規化の制約を入れ、固有モードをTaylor級数で表して、多チャンネルの自由振動応答の時間領域での分解・再構成を定式化する。Lagrange乗数と勾配降下法でモード形と当てはめパラメータを反復的に求め、再構成信号から減衰比と初期位相を取り出す（抄録）。", "p5": "正則化パラメータと当てはめ次数の2つの事前設定がアルゴリズムの収束に与える影響を数値例で調べ、固有の耐雑音性を示す。最近の信号分解法と比べて、単純支持梁のシミュレーション、実験の2層せん断構造、実大の橋への適用で、モードパラメータの同定の有効性を示した（抄録）。", "fun": "ゆらゆら揺れる建物や橋の動きは、実は何種類かの「揺れ方（モード）」の足し算でできています。この方法は、センサが捉えた複数の揺れの記録を、数学の級数（Taylor級数）で「揺れ方ごとの波」に分け直し、それぞれの減衰の速さまで取り出します。雑音に強く、実際の橋でも使えることを確かめたのが面白い点です。", "unverified": "本文未読のため、性能指標（誤差）や比較手法の一覧は未確認。抄録はSSRN版のもので、掲載版と異なる可能性がある。"}}, {"id": "jr37", "rank": 37, "headline": "斜張橋のケーブル力を振動で補強した多源計測から復元", "title": "Vibration-enhanced multi-source measurement reconstruction of cable force in cable-stayed bridges", "url": "https://doi.org/10.1016/j.measurement.2026.123880", "authors": "Haoqi Zhang ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-11-09", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Zhang, H., Pan, X., Tian, Y., & Wu, J. (2026). Vibration-enhanced multi-source measurement reconstruction of cable force in cable-stayed bridges. Measurement, 123880. https://doi.org/10.1016/j.measurement.2026.123880", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "掲載誌（Measurement）の本文は入手できず、SSRNの版に登録された抄録（Crossrefの題名検索）を使用", "preprint": false, "short": true, "p1": "斜張橋のケーブル力を、同期した振動・温度・ひずみの計測から、振動情報で特徴を補正しながら再構成する方法VFERができた。", "p3": "LSTMエンコーダで結合した時間情報を取り出し、特徴ごとの線形変調で振動に敏感な成分を適応的に強調する。多尺度の因果畳み込みと因果マルチヘッド注意を組み合わせた再構成器で、ゆっくりした熱・力学的な傾向と短期の力の変動を、未来の情報を使わずに捉える。中国の勝利黄河大橋の1年間・1時間ごとの現場計測データで評価した（抄録）。", "p5": "RNN・LSTM・GRU・TCN・Transformerの基準と比べ、3つの計測点すべてでMAEとRMSEが最小で、R2は0.9977、0.9290、0.9701。最も変動と雑音が大きい計測点では、RMSEが4.96、R2が0.9290。アブレーションで、振動で条件づけた特徴変調と因果的な時間再構成が補い合って効くことを確かめた（抄録）。", "fun": "橋を支えるケーブルの張力は、センサの故障や天候で、記録が途切れたり乱れたりします。そこで、振動・温度・ひずみの記録から、ケーブルの張力を「推理して」穴埋めするAIを作りました。特に、振動の情報で
