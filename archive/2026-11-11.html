の処置履歴に結果が依存する因果推論の枠組みを示し、最小二乗法とGMMの推定量、DAGによる識別仮定の検討を与えた（抄録）。", "p2": "TWFEは効果が不均一だと因果効果を正しく推定できない。この問題の研究は二値の段階的導入が中心で、連続処置が時間とともに上下し、遅れた効果を持つ場合を扱う研究は少ない（はじめに）。", "p3": "潜在結果を処置の履歴で表し、処置を少し変えたときの平均因果反応（ACR）を部品に、時点と処置水準で集計した「集計因果効果」を目標にする。識別には条件付き独立の逐次版（SCIA）を置く。効果の関数が処置について線形ならTWFEに戻り、非線形や過去の処置との積を含めるとTWFEは使えない。弱い仮定ではGMM、強い仮定ではTWFEで係数を推定し、標準誤差は断面のブートストラップで求める（§1〜§3、結論）。", "p4": "識別仮定の妥当性は、事前トレンドの検定ではなく、研究者の文脈知識をDAGに表して条件付き独立を導く方法で確かめる（はじめに）。実データは、Dreher・Langlotz（2020）の援助と成長のデータ（不均衡パネル、97単位・10期）で、効果の関数の3つの形（線形、2次、2次と初期GDPとの交互作用）を比べる（§5）。", "p5": "援助の成長への集計因果効果の推定値は、モデル2・3で−0.031と−0.068、ブートストラップ標準誤差は0.116と0.144で、有意でない。時点別の効果は逆U字でおよそ第5期にピークを持つが、時系列の変動は断面の変動より小さく、モデルが正しければ、援助の平均効果は時点を通じて一貫して有意でない（§5）。", "p6": "識別仮定（SCIA）は、DiD/TWFEの仮定と本質的に似ているが、やや強い（結論）。応用は「おもちゃの例」で、援助の効果の真偽の議論には加わらず、DAGの検討も行わない（§5の注）。ACR以外の部品は扱わない（結論）。共変量は過去の処置に影響されないと仮定する（§2.1）。", "fun": "国への援助が、その国の経済成長を高めるかは、長年決着がつかない問いです。援助の額は連続的で、年によって増えたり減ったりし、効果も後から出ます。この論文は、この「連続的で、履歴に依存する処置」を扱う枠組みを作りました。新しい点として、「この仮定は妥当か」を、データの傾向でなく、研究者の知識を図（DAG）にして検討するよう提案しています。", "unverified": "付録A〜D（具体的な関数形、証明、動的パネルの結果）、§4の漸近性質の条件、§6のDiD/TWFEとの違いの節、表2〜3の全数値は読み切れていない。シミュレーションの有無は確認していない。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "人間の金融学：ストレス反応を取り入れたインフレ期待", "title": "Presidential Address: Human Finance: Incorporating Insights from the Life Sciences", "url": "https://doi.org/10.1111/jofi.70096", "authors": "ULRIKE MALMENDIER", "venue": "The Journal of Finance", "date": "2026-11-10", "sjr": 22.27, "citescore": 16.8, "citescore_year": "2025", "apa": "MALMENDIER, U. (2026). Presidential Address: Human Finance: Incorporating Insights from the Life Sciences. The Journal of Finance. https://doi.org/10.1111/jofi.70096", "why": "米国金融学会の会長講演で、ストレス反応・衝動制御・気分調整など生命科学の知見を経済・金融モデルに取り込む例として、個人のインフレ経験の回顧調査と、過去のインフレを再体験させる実験を組み合わせた。生理的・感情的・認知的なストレス指標がインフレ期待の上昇と記憶の鮮明さを予測し、個人の経済的な語りにも影響すると示した。", "explain": {"basis": "抄録", "basis_note": "The Journal of Financeの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "生命科学で知られる人間行動の決定要因（ストレス反応、衝動の抑制、気分の調整）を経済・金融のモデルに入れる例として、インフレ期待を取り上げ、生理的・感情的・認知的なストレスの指標が、高いインフレ期待と鋭い記憶の想起を予測し、個人の経済的な語りも形づくることを示した（抄録）。", "p2": "ストレス反応、衝動の抑制、気分の調整など、生命科学が特定した人間行動の主な決定要因が、標準的な経済・金融のモデルには欠けている（抄録）。", "p3": "個人のインフレの経験を尋ねる回顧的な調査と、過去のインフレの再体験を誘発する実験的な介入を組み合わせる。生理的・感情的・認知的なストレスの指標を測り、インフレ期待、記憶の想起、経済的な語りとの関係を見る（抄録）。", "p4": "評価は、ストレスの指標と、インフレ期待、記憶の想起の鋭さ、個人の経済的な語りとの関係（抄録）。標本の大きさ、指標の種類、統計的な検定は未確認。", "p5": "生理的・感情的・認知的なストレスの指標は、インフレ期待の上昇と記憶の想起の鋭さを予測し、個人の経済的な語りも形づくる（抄録）。効果の大きさは未確認。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。抄録は、経済的な苦境や危機の経験の持続的な傷あとに対抗する政策手段として、予測可能性と統制を与える経験の設計を挙げる（抄録）。", "fun": "インフレ（物価上昇）を経験した人は、その後も長くインフレを強く予想しがちだと言われます。この会長講演は、その理由を、ストレスの体の反応まで測って調べました。昔のインフレを思い出させる実験をすると、ストレスの強い人ほど将来のインフレを高く予想し、記憶も鮮明でした。「先が読めて、自分で制御できる」経験の設計が、傷あとをやわらげるかもしれない、という提案です。", "unverified": "本文を入手できず、標本の大きさ、生理指標の種類、介入の手順、効果の大きさ、統計的な検定は未確認。"}}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "リーダーは理論家：因果理論を立てて問題を枠づける", "title": "Leaders as Theorists", "url": "https://doi.org/10.1111/joms.70182", "authors": "Teppo Felin ほか", "venue": "Journal of Management Studies", "date": "2026-11-10", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Felin, T., Ployhart, R. E., & Zenger, T. (2026). Leaders as Theorists. Journal of Management Studies. https://doi.org/10.1111/joms.70182", "why": "リーダーシップ研究の特性・スタイル対関係・文脈の二極に対し、第三の見方として、リーダーは因果理論を組み立てて問題を枠づける理論家だと論じた。文脈・信頼・関係性は理論を提唱し採用し検証し拡大する過程で現れるとし、リーダーの理論化と因果推論を改善し教える規範的な研究課題を示した（理論論文）。", "explain": {"basis": "抄録", "basis_note": "Journal of Management Studiesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "リーダーシップを、個人の特性か、関係と文脈かの二者択一でなく、「リーダーは理論家である」と捉える第三の見方を示した（抄録）。", "p2": "リーダーシップの研究は、個人の特性（またはスタイル・行動）か、関係と文脈かの両極に集中してきたが、どちらも、リーダーシップがどこから生まれ、集合的な成果をどう生むかを説明しない（抄録）。", "p3": "リーダーは、組織のどの階層でも、因果の理論を立て、問題を枠づける前向きな行為者で、理論を立てること自体がリードする行為を構成する、と論じる。理論の価値は社会的な機構で実現・増幅・制約される。文脈・信頼・関係性は出発点でなく、リーダーが理論を主張し、採用し、試し、広げる中で生まれる（抄録）。", "p4": "概念的な論考で、データによる検証は抄録にない。評価の基準は、この見方が既存の二つの極を説明し直し、研究課題を生むかどうか（解釈）。", "p5": "結果は理論の提案で、リーダーの理論化と因果的推論を改善し教える、規範的・介入的な課題を掲げ、リーダーを理論家として研究する課題を示す（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：実証データによる検証がなく、この見方が既存の説明より予測や介入で優れるかは、今後の研究に委ねられる。", "fun": "リーダーシップとは何でしょう。「生まれつきの人柄」でも「周りとの関係」でもなく、「リーダーとは、物事がどうつながっているかの説（理論）を作り、問題の見方を示す人だ」という新しい見方の論文です。信頼や雰囲気は出発点でなく、リーダーが説を示し、試し、広げるなかで生まれると言います。理論の立て方は、練習して教えられるという主張も面白い点です。", "unverified": "本文を入手できず、理論の命題の中身、既存の理論との比較、研究課題の具体、事例は未確認。"}}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "初期のML企業の成長経路は技術の特性に拘束される", "title": "Growth Paths in Early Machine Learning Ventures: Technical Configuration and Competitive Advantage Over Time", "url": "https://doi.org/10.1287/orsc.2022.17147", "authors": "Jack Fraser ほか", "venue": "Organization Science", "date": "2026-11-10", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "apa": "Fraser, J., & Ozcan, P. (2026). Growth Paths in Early Machine Learning Ventures: Technical Configuration and Competitive Advantage Over Time. Organization Science. https://doi.org/10.1287/orsc.2022.17147", "why": "加速プログラムの6つの初期機械学習企業を追った帰納的な事例研究で、訓練データ・学習パラダイム・モデル出力が互いと用途に依存する関係が成長経路を形づくることを示した。初期の競争優位をもたらす特性が、後の成長を制約しうる。事例は6社のみ。", "explain": {"basis": "抄録", "basis_note": "Organization Scienceの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "加速プログラムに参加する初期段階の機械学習の新興企業6社を追う複数事例研究で、学習データ・学習の方式・モデルの出力の技術的な相互依存が、成長経路を広げたり制約したりし、初期の競争優位が後の成長を制約しうることを示した（抄録）。", "p2": "機械学習の能力は戦略的な資産になったが、その技術的な性質が、それを構築する企業の競争優位にどう影響するかはほとんど分かっていない（抄録）。", "p3": "加速プログラムの初期段階の機械学習企業6社を追跡する帰納的な複数事例研究で、特化と探索の局面が、基盤技術の性質にどう制約されるかを探る（抄録）。", "p4": "6社の事例を時間を追って比べる質的な研究（抄録）。データの収集方法とコーディングは未確認。", "p5": "学習データ・学習の方式・モデルの出力は、互いに、また適用先の用途に依存し、その関係は時間とともに変わる。この相互依存が成長経路を形づくり、企業が使える戦略的な選択肢を、広げたり狭めたりする。早期の競争優位をもたらす特性が、後の成長を制約しうる（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：6社の探索的な事例研究で、他の機械学習企業や成熟した企業への一般化は検証されていない。", "fun": "AIの会社が、最初に強みとなった特性が、あとで足かせになるという話です。データ、学習の方式、モデルの出力は互いに結びついていて、その結びつきが、会社の選べる道を広げたり狭めたりします。加速プログラムの6社を追う研究で、強みが時間とともに変わりうる様子を描きました。", "unverified": "本文を入手できず、6社の具体、収集したデータの種類と期間、分析の手順、示された技術構成の類型は未確認。"}}, {"id": "jn05", "rank": 5, "field": "計算社会科学・ネットワーク科学", "headline": "人間とAIの協働の設計で品質・満足・多様性が変わる", "title": "Designing human and generative AI collaboration: Trade-offs in productivity, satisfaction, and creative diversity", "url": "https://doi.org/10.1093/pnasnexus/pgag353", "authors": "Kartik Hosanagar ほか", "venue": "PNAS Nexus", "date": "2026-11-10", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "Hosanagar, K., & Ahn, D. (2026). Designing human and generative AI collaboration: Trade-offs in productivity, satisfaction, and creative diversity. PNAS Nexus, 5(11). https://doi.org/10.1093/pnasnexus/pgag353", "why": "1,000語の創作課題の被験者実験で、3つの人間–AI協働の設計を比べた。完了時間は同程度でも、AIが企画から編集までを主導し人が承認・拒否するだけの設計では、品質・満足度・ジャンルと意味の多様性が低かった。人が企画段階か全体に関与する設計は、時間を延ばさずに品質と満足の損失を避けた。", "explain": {"basis": "抄録", "basis_note": "PNAS Nexusの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "1,000語の創作文章の課題の被験者実験で、人と生成AIの協働の設計3種を比べ、AIが発想から編集までを主導し人が承認・拒否するだけの設計（Human Confirmation）で、質・満足度・多様性が最も下がることを示した（抄録）。", "p2": "生成AIの生産性向上への期待の一方、働く人の満足度の低下と創造性の多様性の低下が懸念されているが、協働の設計がAI導入に伴う代償をどう形づくるかは不明だった（抄録）。", "p3": "1,000語の創作文章の課題で、人間を被験者にした実験。3つの人間-AI協働の設計を比べる。AIが主導し人が確認するHuman Confirmationと、準備段階（発想・構成）または執筆全体で人が関与する設計を含む（抄録）。", "p4": "指標は、完了時間、質、満足度、ジャンルと意味の多様性（集計）、内容の類似度（抄録）。設計ごとの標本の大きさと評価者は未確認。", "p5": "完了時間は3設計で同程度だったが、質・満足度・多様性は違った。Human Confirmationは、質と満足度が低く、ジャンルと意味の多様性の集計も低い、最も明確な不利を示した。準備段階か執筆全体で人の関与を保つ設計は、全体の完了時間を延ばさずに、質と満足度の明確な低下を避けた。準備段階で能動的な人の関与を保つことは、Human Confirmationより内容の類似度の集計が低いこととも関連した（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：1つの創作課題（1,000語）の結果で、他の仕事、長期の影響、実務での協働への一般化は、抄録からは分からない。", "fun": "AIに文章を書かせるとき、「AIが全部書いて、人は『いい』か『だめ』を決めるだけ」にすると、できた文章の質が下がり、書いた人の満足も下がり、内容のバラエティも減りました。一方、人が最初の発想や構成の段階から関わる設計では、同じ時間で、質と満足度の低下を避けられました。AIを使うかでなく、創作の主導権を人とAIでどう分けるかが大事、という結果です。", "unverified": "本文を入手できず、被験者の人数、課題の内容、設計ごとの数値（質・満足度・多様性の差）、評価者と多様性の測り方は未確認。"}}, {"id": "jn06", "rank": 6, "field": "機械学習", "headline": "気候エミュレータの訓練シナリオを最適化して汎化を上げる", "title": "Optimal scenario design for climate emulation", "url": "https://doi.org/10.1073/pnas.2620731123", "authors": "Christopher B. Womack ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-09", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Womack, C. B., Bouabid, S., Sokolov, A., Salunke, P., Flierl, G., Eastham, S. D., & Selin, N. E. (2026). Optimal scenario design for climate emulation. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2620731123", "why": "気候の機械学習代理モデルでは、既存シナリオの構造的な多様性の低さが予測精度に上限を課す。微分可能な簡易気候モデルで損失の訓練データへの感度を計算し、データを反復更新する方法を示し、1つの最適化シナリオで学習したエミュレータが、標準のScenarioMIP 6経路で学習したものを上回った。", "explain": {"basis": "本文", "basis_note": "オープンアクセス版（arXiv v2）の本文を読んだ（抄録・はじめに・結果・考察）。SI付録、図6〜7の詳細は読み切れていない。出版社版（PNAS）との差は未確認", "preprint": false, "p1": "気候エミュレータ（排出量から全球平均気温を予測する機械学習の代理モデル）の訓練データ自体を最適化し、標準の6本のシナリオより少ない、最適化した1本のシナリオで、より高い予測精度と、訓練にない構造のシナリオへの汎化を得られることを示した（抄録）。", "p2": "物理系の機械学習では、物理制約を組み込む構造の設計が中心だったが、気候エミュレータでは、既存のシナリオ（ScenarioMIP）の構造の多様性の低さが予測精度に上限を与える。フルスケールの気候モデルは計算費用が大きく、シナリオを増やしにくい（抄録）。", "p3": "微分可能な簡易気候モデル（CO2・CH4・N2O・硫黄・黒色炭素）で、訓練データの摂動に対するエミュレータの損失の感度を自動微分で求め、確率的勾配降下で訓練用の排出量の時系列を繰り返し更新して、目標シナリオでの精度を最大にする。エミュレータは多層パーセプトロンで、排出量から全球平均気温を出す（図1、結果）。", "p4": "指標は正規化RMSEで、50回の独立な実行の中央値と四分位範囲。比較対象は、ScenarioMIP-CMIP7の優先1（6本）で訓練したエミュレータ。評価は、現実的な政策の経路、理想化した実験（DECK）、単一の強制力や気候介入のシナリオ（DAMIP・GeoMIPなど）、RCP・SSPで、一部は最適化から除いて情報漏えいを避ける。中間複雑度のモデル（MESM）でも独立に検証する（結果）。", "p5": "最適化したエミュレータは、基準が自分の訓練データで評価した誤差の下限を、全ての強制力で下回る（図3）。優先1に最適化すると平均で37〜46%改善し（他の集合に情報漏えいなし）、全シナリオを同時に最適化すると、DECKで中央値61%、全体で53%改善し、DAMIPとGeoMIPで中央値のR²は0.96〜1。DECKだけに最適化すると全体で780%悪化し、多様なシナリオが要る。MESMでは、CO2のみで、最適化した1〜2本が6本の基準に並ぶか上回る（結果）。", "p6": "最も単純な多層パーセプトロンでの結果で、他の構造・物理領域・より非線形な系は未検証。全シナリオの同時最適化は情報漏えいを含み、MESMでの検証はCO2のみ。最適なシナリオは唯一でなく、予算に依存する族。異なる訓練が打ち消し合う干渉も起こりうる（考察）。", "fun": "気候の将来予測を速く出すAI（エミュレータ）に、どんな「練習問題（排出シナリオ）」を見せて学ばせるか、という研究です。従来のシナリオは、どの温室効果ガスも似た動きで、AIは「全部まとめて」しか覚えられません。そこで、AIの成績が一番よくなるように、練習問題そのものを自動微分で作り替えました。すると、1本の変わった形のシナリオで、温室効果ガスと硫黄（エアロゾル）の効き方の違いまで見分けられました。", "unverified": "SI付録1〜8（技術的な説明、感度分析、数値結果の全体）は読み切れていない。図6〜7の個別の数値、MESMの詳しい結果、DECKの詳細は一部のみ確認。PNAS掲載版とarXiv v2の差は確認していない。"}}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "株主アクティビズムの後に従業員起点の情報漏えいが増える", "title": "Value Created, Value Leaked: Shareholder Activism and Employee-Initiated Data Leaks", "url": "https://doi.org/10.1287/stsc.2025.0350", "authors": "Mark DesJardine ほか", "venue": "Strategy Science", "date": "2026-11-10", "sjr": 3.56, "citescore": 6.6, "citescore_year": "2025", "apa": "DesJardine, M., & Wang, J. (2026). Value Created, Value Leaked: Shareholder Activism and Employee-Initiated Data Leaks. Strategy Science. https://doi.org/10.1287/stsc.2025.0350", "why": "株主アクティビズムが、組織的公正の分配的公正の認識を通じて従業員起点の情報漏えいを増やす可能性を、独自の漏えいデータと差の差分析で検証した。従業員向けCSRの実績や従業員満足度が高いと、その関係が緩和される。", "explain": {"basis": "抄録", "basis_note": "Strategy Scienceの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "株主アクティビズムの運動が、残った従業員の分配的公正の知覚を変え、従業員が起こす情報漏えいを増やすことを、差の差の推定で示し、従業員志向のCSRの実績と運動前の高い従業員満足度が緩衝になることを示した（抄録）。", "p2": "株主アクティビズムは株主価値を高め、ガバナンスを改善するが、企業の優先事項が変わるとき、残った従業員がそれをどう解釈して反応するかは、ほとんど分かっていない（抄録）。", "p3": "組織的公正理論に基づき、運動が、従業員の貢献と報酬のバランスという分配的公正の知覚を変え、従業員が起こす情報漏えいの可能性を高めると提案する。漏えいは、不満による意図的な開示から、圧力下での警戒の緩みまで幅があり、従業員が日々の仕事に最も重大だと感じる要求に集中する（抄録）。", "p4": "従業員が起こした情報漏えいの新しいデータセットで、差の差の推定により、運動の前後と対象・非対象の企業を比べる。CSRの実績と従業員満足度が調整するかを見る（抄録）。データの規模と指標は未確認。", "p5": "仮説は支持された。株主アクティビズムの運動は、従業員が起こす情報漏えいを高めうる。従業員志向のCSRの強い実績と、運動前の高い従業員満足度は、この関係を緩衝する（抄録）。効果の大きさは未確認。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：漏えいの動機（不満か不注意か）をデータで切り分けられているかは、抄録からは分からない。", "fun": "外部の投資家が会社の経営に強く口を出す（株主アクティビズム）と、株主の利益や効率が上がることがあります。でもこの研究は、その裏で、残った社員が「自分の働きに見合うものがもらえていない」と感じ、情報漏えいが増えうると指摘します。社員を大切にするCSRの実績がある会社や、社員の満足度が高い会社では、この悪影響が弱まりました。", "unverified": "本文を入手できず、情報漏えいのデータの出所と件数、運動の対象企業の数、差の差の識別の検討、効果の大きさは未確認。"}}, {"id": "jn08", "rank": 8, "field": "気候科学", "headline": "世界のCO2排出は2026年に0.4%減の予測、加速が必要", "title": "A further acceleration of clean energy is needed for global CO2 emissions to peak and decline", "url": "https://doi.org/10.1038/s41558-026-02821-8", "authors": "Corinne Le Quéré ほか", "venue": "Nature Climate Change", "date": "2026-11-10", "sjr": 7.978, "citescore": 39.0, "citescore_year": "2025", "apa": "Le Quéré, C., Andrew, R. M., Canadell, J. G., Friedlingstein, P., Jackson, R. B., & Peters, G. P. (2026). A further acceleration of clean energy is needed for global CO2 emissions to peak and decline. Nature Climate Change. https://doi.org/10.1038/s41558-026-02821-8", "why": "2019〜2025年に化石燃料CO2排出は年平均0.8%増えたが、2026年は0.4%減と予測した（イラン紛争によるエネルギー・ショックへの短期的な反応とみられる）。電気自動車と太陽光・風力が2028年までに需要増による排出増加の約64〜79%を相殺するが、排出の頭打ちと減少の確実な達成にはクリーン技術の展開加速が要る。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文を読んだ（抄録・本文・方法の前半）。拡張データの図表と方法の後半は読み切れていない", "preprint": false, "p1": "2026年の世界の化石燃料由来のCO2排出は0.4%減ると予測されるが、これはイラン紛争によるエネルギーショックへの短期の反応とみられ、排出のピークではないこと、EVと太陽光・風力が需要増による排出増の約64〜79%を相殺するが、ピークと減少には導入の加速が要ることを示した（抄録、本文）。", "p2": "対策は、戦争、防衛への優先の移り、資本コストの高さ、AIとデータセンターの拡大などの逆風の中にある。エネルギー転換が排出のピークにどこまで近づいたかを、定量化する必要があった（本文の冒頭）。", "p3": "EVと太陽光・風力による回避排出量を、それらがなければ化石燃料が供給したという反事実で国別に推定し、残りの要因は世界GDPと、反事実のCO2原単位（実際の排出＋回避排出をGDPで割る）で表す。2027〜2028年は、導入を2026年の水準に据え置く場合と、ロジスティック曲線で加速する場合の2つで予測する（本文、方法）。", "p4": "データは、グローバル・カーボン・バジェットの2026年更新、EVは52か国の登録、電力は220の国・地域の統計。感度試験で、EVの回避排出の増加の不確実性は−19%〜+25%、太陽光・風力は±7%。比べるのは、需要由来の排出増に対する回避排出の割合（方法）。", "p5": "2025年は排出が1.2%増え、2026年は0.4%減る見込みで、石油が1.9%減、ガスが0.3%減、石炭が0.6%増（図2）。回避排出は、EVが2019年の0.03から2025年の0.19 GtCO2、太陽光・風力は2025年に4.1 GtCO2で、合計の約95%を占める。2025〜2028年に、需要由来の増加2.59 GtCO2のうち、EVと太陽光・風力が、現状維持で1.64（63%）、加速で2.04（79%）を相殺する。2026年のEVの回避排出の増加0.05 GtCO2は、石油排出の減少の約20%で、減少の大半は価格の高騰と供給の制約とみられる。", "p6": "回避排出は単純化した反事実で、因果を示さない。天候、水力・原子力の変動、経済ショックが短期の排出を動かし、基調を隠す。予測の幅は、2026年のショックからの回復のような短期の変動を含まない（方法）。解釈：抄録・結論は64〜79%、本文の計算は63%と79%で、表記が少し異なる。", "fun": "2026年のCO2排出は世界全体で減る見込みですが、著者は、これを「脱炭素が進んだ」しるしとは見ません。イラン紛争で石油が高く、不足したための短期の反応だろう、と言います。ただ、EVと太陽光・風力がなければ、2019〜2025年の排出は年1.9%増えていたはず（実際は0.8%増）。この2つのおかげで、需要の増加による排出増の約64〜79%が打ち消されています。", "unverified": "拡張データの図表（Extended Data Figs 1〜6、Tables 1〜4）と、方法の後半（需要由来の反事実原単位の詳細、GDPの予測）は読み切れていない。"}}, {"id": "jn09", "rank": 9, "field": "環境科学", "headline": "窒素余剰の推定は農業データの選び方で大きく変わる", "title": "Agricultural data source choice as a dominant control on nitrogen surplus uncertainty", "url": "https://doi.org/10.1038/s41893-026-01992-8", "authors": "Baibaswata Bhaduri ほか", "venue": "Nature Sustainability", "date": "2026-11-10", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "apa": "Bhaduri, B., Kourakos, G., Miller, K., & Harter, T. (2026). Agricultural data source choice as a dominant control on nitrogen surplus uncertainty. Nature Sustainability. https://doi.org/10.1038/s41893-026-01992-8", "why": "カリフォルニア州セントラルバレーで、専門家・調査・規制・郡の4種のデータを固定した窒素収支の枠組みに通して24通りの推定を作り、データ選択だけで余剰推定が大きく乖離することを示した。乖離は作物・地域・経路の優先順位や経済負担の概算を入れ替えるほど大きく、データ源の不確実性の明示的な伝播が要る。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文を読んだ（抄録・はじめに・結果・考察の主要部分）。方法の詳細、補足資料、考察の最終節は読み切れていない", "preprint": false, "p1": "米カリフォルニアのセントラルバレーを例に、窒素余剰の推定が、肥料・収穫・堆肥のデータセットの選び方だけで大きく変わり、作物・地域・対策の優先順位が入れ替わりうることを、24通りの窒素収支のケースで示した（抄録）。", "p2": "窒素余剰は地下水汚染の主因だが、推定は不整合な肥料・収穫・堆肥のデータに依存する。複数のデータを体系的に比べて不確実性を定量した研究と、不確実性の無視がホットスポットの地図や削減の負担の選定を偏らせるかの検証が欠けていた（はじめに）。", "p3": "5つのデータセットから、肥料の施用と収穫による除去の上限・下限、多年生の植物組織への窒素の貯留の有無、堆肥（全量・半量・なし）を組み合わせた24のケースを作り、モデルの構造と土地利用を固定したまま、50 mの空間分布型の窒素収支に通す。差はデータの選択だけに帰される（本文）。", "p4": "対象は支配的な作物20種（灌漑農地の約75%）。指標は、作物ごとの窒素余剰の幅、町区556のホットスポット順位の入れ替わり（順位の不安定度）、地下水保護の目標と比べた必要な削減量と、収益の減少の目安（本文）。", "p5": "入力が最大で除去が最小のとき、窒素余剰は100 kg N ha−1 yr−1を超える場所が多い。トウモロコシは平均300±190 kg N ha−1 yr−1で、ばらつきが最大。データ由来の余剰は約74 kg ha−1、変動係数は約58%で、欧州27か国の集計（約7%と13%）より不確実性が約1桁大きい。堆肥のある所では、堆肥の量が余剰のパターンを決める。町区のホットスポット順位の入れ替わりは最大で約0.17に達し、地下水保護の目標に必要な削減量も、畑作物と野菜でデータにより変わる（本文）。", "p6": "どの比較対象も窒素余剰（質量収支の残差）を直接測らず、地域の推定が包絡線のどこにあるかを示すだけで、不確実性を1つに絞れない。24のケースは等しく起こりうる未来でなく、境界を与える包絡線で、より極端な組み合わせで不確実性はさらに広がりうる（本文）。解釈：1地域の例で、他の地域も同じ大きさとは限らない。", "fun": "畑に入れた肥料の窒素のうち、作物が使わなかった「余り」が、地下水の汚染のもとになります。ところが、この余りの計算は、どの統計を使うかで大きく変わります。カリフォルニアの農業地帯で5つのデータを組み替えて24通りに計算すると、余りの大きさだけでなく、「どの町が最も対策が必要か」の順位まで入れ替わりました。大きな数どうしの引き算の結果なので、ちょっとした誤差が何倍にも拡大されるためです。", "unverified": "補足資料（比較の表、プロセスモデルとの照合、地下水由来の逆推定との整合、感度分析）、方法の詳細、考察の最終節は読み切れていない。"}}, {"id": "jn10", "rank": 10, "field": "経営学", "headline": "気候移行リスクの統治権限はどう組み立てられたか", "title": "Issue‐Centric Orchestration of Climate Transition: The Case of Transition Risk Governance", "url": "https://doi.org/10.1111/joms.70187", "authors": "Niina Hakala ほか", "venue": "Journal of Management Studies", "date": "2026-11-10", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Hakala, N., & Jemaa, F. (2026). Issue‐Centric Orchestration of Climate Transition: The Case of Transition Risk Governance. Journal of Management Studies. https://doi.org/10.1111/joms.70187", "why": "気候移行が金融規制の所管外だった10年前から、2010〜2021年に統治権限が築かれる過程を縦断的に調べ、課題の発生・安定化・翻訳の3段階の課題中心のオーケストレーション過程モデルを示した。民間主導のTCFDが移行リスクを安定させ、公的権限を縮小せず再形成・拡張したと論じる。", "explain": {"basis": "抄録", "basis_note": "Journal of Management Studiesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "2010〜2021年に気候移行（脱炭素化）が金融ガバナンスの課題になる過程を縦断的に調べ、誰にも確立した権限がない新しい課題へのガバナンスの権限が、「課題中心のオーケストレーション」（出現・安定化・翻訳の3段階）で組み立てられることを示した（抄録）。", "p2": "10年前、気候移行は金融規制当局・中央銀行・会計基準設定機関・金融市場の主体の権限の外にあったが、今は金融市場のガバナンスの中心にある。誰にも権限がない新しい課題への権限が、どう組み立てられるかが問いだった（抄録）。", "p3": "ラトゥールの「懸念の事柄」の概念に基づき、気候移行が移行リスクとして構成され、民間主導の気候関連財務情報開示タスクフォース（TCFD）を通じて安定化し、結ばれたガバナンスの場に翻訳された過程を分析する。出現・安定化・翻訳の3段階の過程モデルを作る（抄録）。", "p4": "2010〜2021年の縦断的な事例研究で、移行リスクの軌跡をたどる質的な設計（抄録）。データの出所とコーディングは未確認。", "p5": "気候移行は移行リスクとして構成され、TCFDで安定化し、複数のガバナンスの場に翻訳される中で、ガバナンスの権限が段階的に組み立てられる。民間のガバナンスの取り組みは、公的な権限を置き換えたり縮めたりせず、形を変えて広げうる。共有された懸念を中心に、相互依存するガバナンスの仕組みが、領域と法域をまたいで形成される（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：1つの課題（気候移行）の事例のため、他の新しい課題への一般化は検証が要る。", "fun": "10年前の金融の世界では、「気候変動は誰の仕事か」がはっきりしていませんでした。それが今は、金融ルールの中心の話題です。この論文は、誰も権限を持たない新しい問題に対して、権限がどう組み上がるかを、民間のタスクフォース（TCFD）が形にした「移行リスク」という見方を軸に描きました。民間の取り組みが国の権限を押しのけず、広げる形で働くのが面白い点です。", "unverified": "本文を入手できず、データの出所（文書、インタビューなど）、3段階の具体的な事例、他の課題との比較は未確認。"}}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "ジェンダー・レンズ投資のプロト・インフラを構築", "title": "Making ‘Gender‐Lens Investing’ Work: Cultivating Proto‐Infrastructure for Alternative Financial Futures", "url": "https://doi.org/10.1111/joms.70177", "authors": "Danielle Logue ほか", "venue": "Journal of Management Studies", "date": "2026-11-10", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Logue, D., Höllerer, M. A., Zhao, Y., & Ohlson, T. (2026). Making ‘Gender‐Lens Investing’ Work: Cultivating Proto‐Infrastructure for Alternative Financial Futures. Journal of Management Studies. https://doi.org/10.1111/joms.70177", "why": "ジェンダー・レンズ投資の28の投信・ETFをfsQCAで分析し、象徴的・関係的・物質的な資源の組合せでどう実現されるかを診断した。予示的な組織化は草の根だけでなくエリートにもあるとし、制度的インフラが固まる前段階としての「プロト・インフラ」を提案した。", "explain": {"basis": "抄録", "basis_note": "Journal of Management Studiesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "エリートが、ジェンダーレンズ投資（GLI）を投資商品として今ここで実現する「予示的な組織化」を、28のGLIファンドのfsQCAで分析し、象徴的・関係的・物質的な資源の組み合わせを特定して、エリートが既存の制度資源を組み替えて「原基的なインフラ」を作ることを示した（抄録）。", "p2": "エリートが、代替的な将来を実現する制度的なインフラを、どう構築するかが問いだった。予示的な組織化は、草の根の活動のものと考えられがちだった（抄録の含意）。", "p3": "ジェンダー平等の金融・投資の世界的な運動の中のGLIで、28のGLI投資信託・ETFを対象に、ファジィ集合の質的比較分析（fsQCA）を行う。ファンドの運用者が利用できる資源をどう組み合わせてGLIを投資商品として予示するかを、象徴的・関係的・物質的な資源の配置として特定する（抄録）。", "p4": "28のファンドを事例とし、結果をもたらす条件の組み合わせ（配置）を比べる。結果の定義、条件の測り方、一貫性と被覆度は未確認（抄録のみ）。", "p5": "GLIが現在に認識され実行できるものになる、象徴的・関係的・物質的な資源の異なる配置を特定した。予示的な取り組みは草の根の活動に限られず、代替的な実践を支えるインフラは、エリートが既存の制度資源を組み替えた「原基的なインフラ」として築かれる。原基的なインフラは、完全な制度的インフラが固まる前に、予示的な実践が萌芽的な制度の形を得る過程を理論化する概念（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：fsQCAは28事例に基づく配置の記述で、因果の大きさの推定ではなく、他の市場や時期への一般化は別の課題。", "fun": "社会を変える新しい仕組みづくりは、草の根の運動の仕事、と思いがちです。この論文は、金融の世界のエリート（ファンドの運用者）も、ジェンダー平等に配慮する投資（GLI）という「未来のやり方」を、手持ちの材料の組み合わせで先取りして作っていると示しました。28のファンドを比べ、象徴・関係・物質の資源の組み合わせ方の違いを見つけました。", "unverified": "本文を入手できず、fsQCAの条件と結果の定義、一貫性と被覆度、特定した配置の具体、事例の選び方は未確認。"}}, {"id": "jn12", "rank": 12, "field": "開発経済学", "headline": "中南米の熱曝露の死亡3,000万件を社会的炭素費用に換算", "title": "A bottom-up social cost of carbon for Latin America: Municipality-level heat-mortality damage functions from 30 million daily death records", "url": "https://doi.org/10.1088/1748-9326/aebfaf", "authors": "Fernando Antonio Ignacio González", "venue": "Environmental Research Letters", "date": "2026-11-09", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "apa": "González, F. A. I. (2026). A bottom-up social cost of carbon for Latin America: Municipality-level heat-mortality damage functions from 30 million daily death records. Environmental Research Letters. https://doi.org/10.1088/1748-9326/aebfaf", "why": "ブラジル・メキシコ・チリ・エクアドル・ペルーの10,214の市区町村単位・3,000万件の日次死亡記録（2000〜2023年）をERA5再解析と結合し、国別のPoisson曝露応答関数を推定した。最高気温35℃以上で当日の熱–死亡の半弾力性はブラジル10.9%、メキシコ13.0%で、2%割引の死亡に基づく社会的炭素費用は約0.5ドル/tCO₂（ブラジル）と0.3ドル/tCO₂（メキシコ）と算出した。", "explain": {"basis": "本文", "basis_note": "出版社の受理原稿PDFを読んだ（抄録・はじめに・§2.2・§3.1・§4〜§7）。§2.1のデータ、§3.2の頑健性、補足資料は読み切れていない", "preprint": false, "p1": "ブラジル・メキシコ・チリ・エクアドル・ペルーの3,000万件の日次死亡記録から、市区町村レベルで暑熱による死亡の損害関数を推定し、国別の死亡のみの社会的炭素費用（SCC）に換算した。値は小さいが、国間の順序は全体モデルと一致する（抄録）。", "p2": "国別のSCCは実際の意思決定の拠り所になりつつあるが、統合評価モデルの国別損害は高所得国の証拠から補完して作られ、ラテンアメリカの住民が負う限界損害に合うかは、地域のミクロデータで確かめられていない。世界の損害関数の基礎データに、この地域はほぼ含まれない（はじめに）。", "p3": "国ごとに、日最高気温を8つの区間に分け、区間ごとの日別死亡数のPoisson回帰（市区町村・国×年・月・曜日の固定効果）で、20〜25℃を基準とした半弾力性を推定する。これにSSP2-4.5の昇温（CO2 1トンの昇温はTCREで1,000 GtCO2あたり0.45℃）、所得による感応度の低下、所得とともに上がる統計的生命価値、高齢化を組み合わせて、死亡のSCCにする（§2〜§4）。", "p4": "指標は、気温区間ごとの死亡の半弾力性（識別は市区町村内の日別の気温の変動）と、国別のSCC（損害関数の係数だけ、および全体の不確実性を伝播した2つのモンテカルロ95%区間）。割引率は1.5%・2%・3%で、2%を中心にする。比較は、Ricke et al.（2018）の国別の全体SCC（§2〜§5）。", "p5": "暑い日（日最高気温35℃以上）の死亡は、ブラジルで10.9%、メキシコで13.0%増える。チリは中程度の暖かさで負、エクアドルは35℃超が不正確、ペルーは寒さが主（§3.1）。SSP2-4.5、割引率2%の中央値は、ブラジルが約0.5ドル/tCO2、メキシコが約0.3ドル、チリは小さな負、エクアドルとペルーはほぼゼロ（§4）。全体のSCCの一部にとどまるが、国間の順序と符号は一致する（§5）。現在の気候で、ブラジルとメキシコは年に約29,000人と19,000人の超過死亡（§6）。", "p6": "死亡のみの推定で、農業・海面・生態系・労働生産性の損害を含まない。メキシコ・チリ・エクアドルのパネルは4年・6年・2年と短く、メキシコはパンデミックと重なる。昇温は観測分布の平均シフトで、所得による感応度の低下は1つの指数で全区間に一様。TCREを2100年で打ち切るため、中央値を約10%過小評価する（§7）。", "fun": "暑い日（最高気温35℃以上）には、ブラジルの死亡が10.9%、メキシコが13.0%増えます。でも、CO2を1トン出すことで増える世界の気温はごくわずかなので、1つの国が負う「1トンあたりの被害」は、数十セントにすぎません。大きな被害があっても、1トンあたりは小さい。この違いを分けて考えるのが、この論文の大事な点で、炭素の値段より、暑さ対策や医療への投資の優先度の材料になる、と著者は位置づけています。", "unverified": "補足資料S1〜S12（分布ラグ、頑健性、代替の昇温モデル、パルスモデルとの照合）、表2〜4の全数値、§3.2の頑健性の詳細は読み切れていない。"}}, {"id": "jn13", "rank": 13, "field": "気候科学", "headline": "風が弱く猛暑になる複合事象は2100年までに最大750%増", "title": "Intensification of compound wind drought and heatwave events under climate change", "url": "https://doi.org/10.1073/pnas.2604442123", "authors": "Meng Qu ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-09", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Qu, M., Shen, L., Yang, X., Wan, F., Zhong, H., & Wu, S. (2026). Intensification of compound wind drought and heatwave events under climate change. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2604442123", "why": "27の高解像度CMIP6モデルで、低風速と高温が同時に起きる複合事象の頻度が世界の陸域で100〜750%増え、持続期間は80〜300%延びると予測した。熱力学的な温暖化と風の弱まりが主な要因で、観測された過去の傾向を使う創発的制約により、モデル間分散を世界・地域で10〜40%減らせた。", "explain": {"basis": "抄録", "basis_note": "Proceedings of the National Academy of Sciencesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "風速が弱い「風の干ばつ」と高温が同時に起こる複合現象（WDHW）が、将来、世界の陸域で強まることを、27のダウンスケールCMIP6モデルで示し、頻度・継続日数・駆動要因・不確実性の低減まで評価した（抄録）。", "p2": "WDHWは将来の電力システムの安定への脅威になるが、その将来の変化と物理的な駆動要因は、十分に制約されていない（抄録）。", "p3": "27のダウンスケールしたCMIP6モデル（約25 km）の日次出力から、低風速と高温の同時発生を同定する。低〜高CO2のシナリオで、頻度と継続日数の将来変化を比べ、駆動要因（熱力学的な温暖化、風の弱まり、変動、風と気温の結合）を分ける。観測された過去の傾向を将来予測に結ぶ創発的制約で、モデル間のばらつきを減らす（抄録）。", "p4": "評価は、2100年までの頻度と継続日数の変化率（シナリオ別）、駆動要因の寄与、創発的制約によるモデル間分散の低減（抄録）。複合現象の閾値の定義とモデルの検証は未確認。", "p5": "低〜高CO2のシナリオで、世界の事象頻度は2100年までに100〜750%増え、継続日数は80〜300%長くなる。主な駆動要因は、熱力学的な温暖化と広範な風の弱まりで、地域的には、変動の増大と、極向きのジェット気流に伴う風と気温の結合の強化が増幅する。創発的制約で、世界・地域のモデル間分散を10〜40%減らせる（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：結果はCMIP6のダウンスケールモデルの範囲で、複合現象の定義（閾値）と、観測の傾向と将来の関係が続くという仮定に依存する。", "fun": "風が弱くて暑い日が重なると、電力システムは安定を保ちにくくなります。27の気候モデルで調べたら、そんな「無風の猛暑」は、2100年までに頻度が100〜750%増え、続く日数も80〜300%長くなると分かりました。主な原因は、地球の温暖化と、世界的な風の弱まりです。地域によっては、極に向かうジェット気流の変化が、さらに強めます。", "unverified": "本文を入手できず、複合現象の閾値の定義、モデル間のばらつき、地域別の結果、創発的制約の関係の強さは未確認。"}}, {"id": "jn14", "rank": 14, "field": "社会心理学", "headline": "信念が集団の条件だと幼児は証拠が出ても信念を改めない", "title": "Belonging to a group with shared ideology leads preschool children to resist revising their beliefs despite disconfirming evidence", "url": "https://doi.org/10.1073/pnas.2622764123", "authors": "Zoe Renee Finiasz ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-09", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Finiasz, Z. R., & Kushnir, T. (2026). Belonging to a group with shared ideology leads preschool children to resist revising their beliefs despite disconfirming evidence. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2622764123", "why": "4〜5歳の子ども192人の3実験で、新しい因果系についての主張に賛同させて同じ主張の集団に加入させ、その後に誤りを示す証拠を見せた。集団の成員資格が共有信念に依存すると伝えた条件でだけ、子どもは誤った賛同を維持し（実験3では行動にも）、イデオロギーによる集団の結びつきの発達的な起源を示した。", "explain": {"basis": "抄録", "basis_note": "Proceedings of the National Academy of Sciencesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "4〜5歳の子ども192人の3つの実験で、グループの所属が「共有された信念」に条件づけられているときだけ、証拠で最初の誤った支持が否定されても、子どもはそれを改めずに維持し、行動にも移すことを示した（抄録）。", "p2": "信念を共有するグループ（イデオロギーに基づく集団）への所属は、成人に偽の信念を支持し維持させるが、信念を改めない傾向が子どもの頃から現れるかは不明だった（抄録）。", "p3": "子どもが新しい因果の仕組みについての主張を支持し、その主張を共有するグループに入る。焦点の信念依存条件では、「所属はこの主張に基づく」と共有された信念として伝える。対照は、同じ信念を持つが所属の条件ではない条件（実験1・2・3）と、同じ主張を「推測」として示す条件（実験2）。入った後で最初の支持が誤りだと示す証拠を見せ、改める機会を与える（抄録）。", "p4": "子どもを条件にランダムに割り当て、新しい情報に基づく信念の改訂（実験3では行動も）を測る（抄録）。改訂の割合と統計的な検定は未確認。", "p5": "所属が共有された信念に条件づけられたときだけ、子どもは最初の誤った支持を保持し、実験3では、それに基づいて行動した。著者は、イデオロギーの結びつける力が発達の初期にルーツを持ち、最も早い年齢から、所属の動機が真理の追究と合理性を上回ると解釈する（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：4〜5歳に限った課題で、新しい因果の仕組みについての主張という設定のため、成人の現実の信念や分極との関係は推論にとどまる。", "fun": "「この考えを共有する人だけが仲間」というルールのグループに入ると、4〜5歳の子どもでさえ、あとで「その考えは間違いだよ」という証拠を見せられても、考えを変えにくくなりました。同じ考えでも、「仲間であることの条件」でなければ変えられたのです。信念が仲間の証になると、真実より所属が優先される。その芽が幼児の頃からあるのが面白い点です。", "unverified": "本文を入手できず、課題の具体的な内容（因果の仕組み）、各実験の人数と割合、効果量、有意水準、行動測定（実験3）の詳細は未確認。"}}, {"id": "jn15", "rank": 15, "field": "物理学", "headline": "液滴の接触線摩擦は速度だけでなく接触の履歴に依存", "title": "History-dependent droplet friction driven by contact-line aging", "url": "https://doi.org/10.1073/pnas.2619504123", "authors": "Yuanzhe Li ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-09", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Li, Y., Lee, Y., Hayashi, K., Zhang, H., Miyata, K., Liu, J., Hosomi, T., Yanagida, T., Fukuma, T., Mouterde, T., & Shiomi, J. (2026). History-dependent droplet friction driven by contact-line aging. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2619504123", "why": "液滴の接触線摩擦は速度のみで決まるとされるが、静止摩擦が動摩擦を超えることや速度弱化は説明できない。分子で調整できるアルキルシラン単分子膜とイオン液体で、固体的な単分子膜上の摩擦が時間とともに強まる（静止摩擦の時間増強・動摩擦の速度弱化）ことを示し、欠陥へのピン止めが進む接触線のエージングのモデルで定量的に説明した。", "explain": {"basis": "抄録", "basis_note": "Proceedings of the National Academy of Sciencesの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": false, "p1": "液滴が固体表面を動くときの接触線の摩擦が、滑る速度だけでなく接触の履歴にも依存することを、分子的に調整できる単分子膜とイオン液体で示し、接触線のナノスケールのエージング（欠陥への占有の進行）で説明した（抄録）。", "p2": "液滴の運動は、速度とともに単調に増える接触線の摩擦で記述されるが、静止摩擦が動摩擦を超えうることや、接触線の摩擦が速度弱化しうることを、速度だけの記述では説明できない（抄録）。", "p3": "基板は自己組織化したアルキルシラン単分子膜、液体は揮発しにくいイオン液体。固体的な単分子膜で、時間とともに強まる静止摩擦と速度弱化の動摩擦を観察し、鎖長を短くするか温度を上げて表面を液体的（ピン止め欠陥の密度が低い）にすると、両方が弱まる。接触線の区間が熱ゆらぎで界面の欠陥を順に占め、ピン止めが強まるエージングで説明し、モデルで定量化する（抄録）。", "p4": "評価は、開始の摩擦（接触時間による静止摩擦の増加）と低速での摩擦の動態を、エージングに基づくモデルがどれだけ定量的に捉えるか。多様な液体・基板の系で、同様の対数的な強化が見られるかも比べる（抄録）。", "p5": "固体的な単分子膜で、接触履歴による摩擦の強化（時間とともに強まる静止摩擦、速度弱化の動摩擦）が顕著に見られ、鎖長を短くするか温度を上げると抑えられる。エージングのモデルは、履歴に依存する開始の摩擦と低速の摩擦の動態を定量的に捉える。多様な液体・基板の系での同様の対数的な強化は、構成則の幅広い適用可能性を示唆する（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：結果は特定の系（アルキルシラン単分子膜とイオン液体）で、他の表面や水系への一般化は、抄録の「示唆」にとどまる。", "fun": "液体の滴は、表面にしばらく置いておくと、動かすのに必要な力が大きくなります。この論文は、その理由を、滴の縁（接触線）が、時間とともに表面の小さな欠陥に、熱のゆらぎで少しずつはまり込み、くっつきが強まるからだと説明しました。静止した時間が長いほど強くなる「エージング」で、表面を液体に近い状態にすると弱まります。", "unverified": "本文を入手できず、単分子膜の鎖長・温度の具体的な値、摩擦の大きさの数値、モデルの式とパラメータ、他系との比較の詳細は未確認。"}}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "住宅価格の上昇圧力が従業員の訴訟を増やす", "title": "Housing Price Pressure and Employee Lawsuits: Evidence From China", "url": "https://doi.org/10.1111/jifm.70022", "authors": "Xuanhao Huang ほか", "venue": "Journal of International Financial Management and Accounting", "date": "2026-11-10", "sjr": 1.639, "citescore": 16.2, "citescore_year": "2025", "apa": "Huang, X., Chen, H., Huang, Z., & Zhang, D. (2026). Housing Price Pressure and Employee Lawsuits: Evidence From China. Journal of International Financial Management & Accounting. https://doi.org/10.1111/jifm.70022", "why": "2013〜2019年の中国上場企業で、都市の住宅価格が上がるほど従業員による訴訟の確率が上がる。購入制限政策の段階的導入を使った差の差分析と土地供給を使った操作変数で因果性を確かめ、心理的圧力が機構で、実体のある訴訟が増え他の訴訟は増えないと示した。", "explain": {"basis": "抄録", "basis_note": "Journal of International Financial Management and Accountingの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "住宅価格の上昇が従業員の訴訟を増やすことを、中国の上場企業で、購入制限政策の導入と土地供給を使って因果的に示した。", "p3": "2013〜2019年の中国の上場企業で、都市の住宅価格と、その都市の企業への従業員訴訟の確率の関係を調べる。住宅価格の伸びを抑える購入制限政策の段階的導入を使った差の差分析と、土地供給を住宅価格の操作変数に使って因果性を確かめる（抄録）。", "p5": "従業員訴訟の確率は、企業が所在する都市の住宅価格とともに上がる。機構・横断面の分析は、心理的な圧力が鍵になりうることを示し、実体のある訴訟が増えるのであって濫訴ではなく、他の種類の訴訟は有意に増えないため、圧力は主に社内の労使関係に及ぶ（抄録）。", "fun": "家の値段が上がると、住宅ローンや家賃で家計が苦しくなり、その不満が会社への訴え（労働訴訟）という形で出てくる、という話です。しかも、会社の外の関係者（取引先など）との訴訟は増えず、社内の関係だけが悪くなるという、はっきりした現れ方をします。暮らしの苦しさが職場の関係まで揺らすのが面白い点です。", "unverified": "本文未読のため、効果の大きさ、操作変数の強さ、訴訟データの出所は未確認。"}}, {"id": "jn17", "rank": 17, "field": "開発経済学", "headline": "インフォーマル経済と事業環境がCO2排出に及ぼす影響", "title": "Informality and the Business Environment as Drivers of Carbon Emissions: The Moderating Role of Environmental Regulatory Quality", "url": "https://doi.org/10.1002/bse.71747", "authors": "Teng Ma ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-10", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Ma, T., Wang, Y., Imandojemu, K., & Orole, F. (2026). Informality and the Business Environment as Drivers of Carbon Emissions: The Moderating Role of Environmental Regulatory Quality. Business Strategy and the Environment. https://doi.org/10.1002/bse.71747", "why": "145か国の2005〜2020年のパネルで、インフォーマリティが集計CO2排出の低さと一貫して関連し、低所得国で最も強く高所得国で最も弱い。この見かけの環境的利点は小規模・労働集約・資本制約による生産の性質を映すもので、事業環境の多くの指標は排出と正の関連をもち、環境規制の質が条件づける。", "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "インフォーマル経済と事業環境が、CO2排出とどう関係するかと、環境規制の質が関係を調整することを、145か国のパネルで示した。", "p3": "2005〜2020年の145か国の年次パネルで、世界開発指標と世界銀行のデータを使う。インフォーマリティは動的一般均衡と多重指標多重原因（MIMIC）による推定で測り、事業環境は企業の参入・インフラ・金融・課税・貿易・商取引の制度を表す9つの次元で捉える。主推定は負の二項回帰で、頑健性にポアソン回帰・別の測定・所得群別の推定を使う（抄録）。", "p5": "インフォーマリティは集計CO2排出の低さと一貫して関連し、低所得国で最も強く、高所得国で最も弱い。この見かけの環境的利点は、インフォーマルな生産の小規模・労働集約・資本制約という性質を映すもので、本質的に清潔なやり方ではないとされる。事業環境の指標の多くは、特に低・中所得国で、排出の増加と関連する。環境規制の質が、負のインフォーマリティと排出の関係を調整する（抄録）。", "fun": "インフォーマル経済（登録されていない小さな商売など）は、排出するCO2が少ないという結果が出ました。でもそれは、環境に良い努力をしているのではなく、単に規模が小さくて、機械やエネルギーを使う余裕がないからだ、というのが著者の解釈です。数字が良く見える理由を、仕組みから問い直すのが面白い点です。", "unverified": "本文未読のため、係数の大きさと、インフォーマリティの測定の妥当性は未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "調達担当者の解釈が社会的持続可能性の展開の深さを決める", "title": "Walk the talk: how procurement professionals' interpretations shape social sustainability cascading", "url": "https://doi.org/10.1108/ijopm-11-2025-1123", "authors": "Svetlana Castre de Chabot ほか", "venue": "International Journal of Operations and Production Management", "date": "2026-11-10", "sjr": 2.983, "citescore": 15.1, "citescore_year": "2025", "apa": "Castre de Chabot, S., Ruel, S., Jaegler, A., & Gold, S. (2026). Walk the talk: how procurement professionals’ interpretations shape social sustainability cascading. International Journal of Operations & Production Management, 1–26. https://doi.org/10.1108/ijopm-11-2025-1123", "why": "27人の調達専門家への面接に基づく構成主義的グラウンデッド・セオリーで、社会的持続可能性のコミットメントがサプライヤー向けの統治に展開される深さを、担当者の役割の解釈・働きかけの価値の見立て・改善志向の実現可能性の見立てで説明する過程モデルを示した。", "explain": {"basis": "抄録", "basis_note": "International Journal of Operations and Production Managementの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "調達担当者が自分の役割をどう解釈するかが、企業の社会的持続可能性の方針がサプライヤー向けの統治にどこまで展開される（カスケードする）かを決めることを、面接から示した。", "p3": "構成主義的グラウンデッド・セオリーで、組織の文脈の異なる27人の専門家への面接を、反復的なコーディング・継続的比較・理論的サンプリング・感受概念との帰納的な往復で分析する（抄録）。", "p5": "担当者が、社会的持続可能性を自分の役割に含めるか、サプライヤー向けの行動に価値があるか、より改善志向の関与が実現可能かの見立てが違い、この状況に応じた判断が、手続き的な遵守で終わるか、より生成的なサプライヤー向けの実践になるかを分ける。将来の社会的・商業的帰結を今の判断に関連づける逆説的な意味づけが、より生成的な対応が競合する商業的要請のもとでも実行可能であることを説明する（抄録）。", "fun": "「うちの会社は取引先の人権や労働環境にも責任を持つ」という方針があっても、現場の調達担当者が「それは自分の仕事か」「相手に言って意味があるか」をどう考えるかで、実際の取り組みの深さが変わります。同じ会社の中でも担当者によってやり方が違う理由を、本人たちの解釈から説明するのが面白い点です。", "unverified": "本文未読のため、面接の対象の業種、コードの具体例、一般化の範囲は未確認。質的研究で、因果の強さは示せない。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "デジタル化はエコイノベーションと正に関連、脱炭素は限定的", "title": "A Meta‐Analysis of the Twin Transition: The Impact of Digitalization on Firms' Eco‐Innovation", "url": "https://doi.org/10.1002/bse.71801", "authors": "Rafael Alberto Iturralde Solorzano ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-10", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Iturralde Solorzano, R. A., Acebo, E., & Miguel‐Dávila, J.-Á. (2026). A Meta‐Analysis of the Twin Transition: The Impact of Digitalization on Firms’ Eco‐Innovation. Business Strategy and the Environment. https://doi.org/10.1002/bse.71801", "why": "38の実証研究・587の効果量のメタ回帰で、デジタル化はエコイノベーションと正の関連をもち、AI・デジタル革新・スマート製品基盤が最も強く、ロボットとIndustry 4.0は弱い。グリーン・イノベーションには頑健な正の関連だが、脱炭素には負または平均的に無関連で、デジタル化だけでは排出削減に不十分だと示唆する。", "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "デジタル化がエコイノベーションと正に関連し、特にAI・デジタル革新・スマート製品基盤で強いが、脱炭素には負または無関連であることを、メタ分析で示した。", "p3": "高インパクトの学術誌に載った38の実証研究・587の効果量を定量的に統合し、メタ回帰で、技術の種類と環境成果のあいだの関係の異質性を調べた（抄録）。", "p5": "デジタル化はエコイノベーションと統計的に有意な正の関連をもつ。技術の種類では、AI・デジタル革新・スマート製品基盤が最も強い正の関連で、ロボットとIndustry 4.0は弱い証拠。環境成果では、グリーン・イノベーションとは頑健な正の関連だが、脱炭素とは平均して負または無関連で、補完的な環境戦略なしにはデジタル化だけで排出削減に不十分かもしれない（抄録）。", "fun": "「デジタル化を進めれば環境にも良い」と期待されますが、38の研究・587の結果をまとめて調べると、環境に良い新しい技術やサービスを生み出す（グリーン・イノベーション）力は高まる一方、CO2を減らす（脱炭素）効果ははっきりしませんでした。便利な技術を入れただけでは排出は減らない、という冷静な結論が面白い点です。", "unverified": "本文未読のため、メタ回帰の係数、出版バイアスの検討、研究間の異質性の指標は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "動的価格設定でAIと人間の価格設定者への消費者の反応", "title": "In pricing we trust? Consumer responses to AI and human price setters in dynamic pricing", "url": "https://doi.org/10.1007/s11747-026-01224-7", "authors": "Begum Kaplan ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-10", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Kaplan, B., Minton, E. A., & Lamberton, C. (2026). In pricing we trust? Consumer responses to AI and human price setters in dynamic pricing. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01224-7", "why": "題名から、動的価格設定でAIと人間の価格設定者に対する消費者の反応（信頼）を比べる研究（Journal of the Academy of Marketing Science、SJR 6.426）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "掲載誌（Journal of the Academy of Marketing Science）の題名のみ。抄録・本文は入手できなかった", "preprint": false, "short": true, "p1": "題名によれば、動的価格設定で、価格を決めるのがAIか人間かによって、消費者の反応（信頼）がどう変わるかを調べる研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さ：同じ値段でも、「AIが決めた」と言われるのと「人が決めた」と言われるのとで、買う側の納得や信頼が変わるのか。需要で値段が上下する仕組み（動的価格設定）への不信を、AIが強めるのか和らげるのか、という問いが読み取れます。", "unverified": "抄録・本文を入手できず、題名以外は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "短尺動画プラットフォームでのインフルエンサー組合せの設計", "title": "Designing influencer portfolios in algorithm-driven short-video platforms: The role of portfolio focus and portfolio size", "url": "https://doi.org/10.1007/s11747-026-01226-5", "authors": "Xuebing Dong ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-10", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Dong, X., & Chen, L. (2026). Designing influencer portfolios in algorithm-driven short-video platforms: The role of portfolio focus and portfolio size. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01226-5", "why": "題名から、アルゴリズム駆動の短尺動画プラットフォームで、インフルエンサーのポートフォリオの焦点と規模の役割を調べる研究（Journal of the Academy of Marketing Science、SJR 6.426）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "掲載誌（Journal of the Academy of Marketing Science）の題名のみ。抄録・本文は入手できなかった", "preprint": false, "short": true, "p1": "題名によれば、アルゴリズムが動かす短尺動画のプラットフォームで、インフルエンサーの組合せ（ポートフォリオ）の焦点と規模の役割を調べる研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さ：企業が動画の人気者（インフルエンサー）に宣伝を頼むとき、少数に絞るのがよいか、多くの人に分散するのがよいか。同じ分野で固めるか、違う分野で広げるかで、アルゴリズムが動画を広めてくれる効果が変わるのか、という問いが読み取れます。", "unverified": "抄録・本文を入手できず、題名以外は未確認。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "企業借入でのプライベート・デットと銀行債務の比較", "title": "Private debt versus bank debt in corporate borrowing", "url": "https://doi.org/10.1016/j.jfineco.2026.104401", "authors": "Sharjil Haque ほか", "venue": "Journal of Financial Economics", "date": "2026-11-09", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "apa": "Haque, S., Mayer, S., & Stefanescu, I. (2026). Private debt versus bank debt in corporate borrowing. Journal of Financial Economics, 186, 104401. https://doi.org/10.1016/j.jfineco.2026.104401", "why": "抄録から、企業の借入で、プライベート・デット（私募の負債）を投資に、銀行のクレジットラインを流動性の保険に使い分けることを、貸出データで示した研究（Journal of Financial Economics、SJR 18.748）。", "explain": {"basis": "抄録", "basis_note": "Journal of Financial Economicsの抄録（OpenAlexの記録）のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "企業が借入で、民間の私募債（プライベート・デット）を投資に、銀行のクレジットラインを流動性の保険に使い分けることを、行政の貸出データで示した。", "p3": "銀行の融資単位の行政データを、プライベート・デットの案件と照合し、両方を使う二重借り手（デュアル・ボロワー）の大きな集団で、私募債と銀行債務の相互作用を調べる（抄録）。", "p5": "これらの企業は、プライベート・デットを投資に、銀行のクレジットラインを流動性保険に使う。プライベート・デットはスプレッドが高く、株式のような柔軟な条項が一般的で、それが銀行のクレジットラインへの依存の高さと関連する。銀行のみの借り手に比べ、二重借り手はより多くより大きなクレジットラインを得て、流動性ショックのあとに強く引き出す。プライベート・デットは銀行のタームローンの代替だが、銀行がクレジットラインで流動性を提供する機能とは補完的（抄録）。", "fun": "お金を借りるのに、銀行と、銀行以外の投資家（私募債）の両方を使う会社があります。調べると、新しい設備などへの投資には私募債、「急にお金が足りなくなったとき」の備えには銀行の枠、と使い分けていました。銀行は貸出の代わりに、いざという時の保険の役を担っているのが面白い点です。", "unverified": "本文未読のため、標本の規模、スプレッドの大きさ、識別の方法は未確認。"}}, {"id": "jn23", "rank": 23, "field": "経済学", "headline": "退職が精神的健康に及ぼす影響", "title": "The Effect of Retirement on Mental Health", "url": "https://doi.org/10.3368/jhr.0523-12913r3", "authors": "Bettina Siflinger ほか", "venue": "Journal of Human Resources", "date": "2026-11-09", "sjr": 6.085, "citescore": 8.8, "citescore_year": "2025", "apa": "Siflinger, B., Salm, M., & Xie, M. (2026). The Effect of Retirement on Mental Health. Journal of Human Resources, 0523–12913R3. https://doi.org/10.3368/jhr.0523-12913r3", "why": "題名から、退職の精神的健康への影響を扱う研究（Journal of Human Resources、SJR 6.085）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "掲載誌（Journal of Human Resources）の題名のみ。抄録・本文は入手できなかった", "preprint": false, "short": true, "p1": "題名によれば、退職が精神的健康に及ぼす効果を扱う研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さ：退職すると、仕事のストレスから解放されて心が楽になるのか、それとも役割や人とのつながりを失って落ち込むのか。同じ退職でも、人や状況でどちらにも転びうる問いが読み取れます。", "unverified": "抄録・本文を入手できず、題名以外は未確認。"}}, {"id": "jn24", "rank": 24, "field": "経済学", "headline": "職業訓練におけるピア効果", "title": "Peer Effects in Labor Market Training", "url": "https://doi.org/10.3368/jhr.1123-13256r2", "authors": "Ulrike Unterhofer ほか", "venue": "Journal of Human Resources", "date": "2026-11-09", "sjr": 6.085, "citescore": 8.8, "citescore_year": "2025", "apa": "Unterhofer, U., & Bernasconi, M. (2026). Peer Effects in Labor Market Training. Journal of Human Resources, 1123–13256R2. https://doi.org/10.3368/jhr.1123-13256r2", "why": "抄録から、職業訓練で就職しやすい仲間に多く接した参加者ほど、長期の就業と所得が増えることを、行政データで示した研究（Journal of Human Resources、SJR 6.085）。", "explain": {"basis": "抄録", "basis_note": "Journal of Human Resourcesの抄録（OpenAlexの記録）のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "職業訓練では、グループの構成がその効果を左右し、就職しやすい仲間に多く接した参加者ほど長期の就業と所得が増えることを、ドイツの行政データで示した。", "p3": "ドイツの詳細な行政データと、新しい就職しやすさ（雇用可能性）の指標を使い、訓練グループの中で、雇用可能性の高い仲間への平均的な接触が参加者の成果に与える影響を調べる（抄録）。", "p5": "雇用可能性の高い仲間への接触が大きいほど、参加者は長期の就業と所得が増える。効果は本人の雇用可能性で大きく異なり、雇用可能性の低い求職者は長期の利得が大きく、高い人は主に入職時の賃金の上昇という短期の利得を得る。機構の分析では、知識の波及による正の効果の一部を、グループ内の求職の競争が弱めることが示唆される（抄録）。", "fun": "同じ職業訓練を受けても、教室にどんな仲間がいるかで、その後の仕事と収入が変わる、という話です。「仕事を見つけやすい人」と一緒に学ぶと、情報やコツが伝わって得をしますが、同じ求人を取り合う競争が、その得を少し減らします。誰と学ぶかが将来を変えるのが面白い点です。", "unverified": "本文未読のため、雇用可能性の指標の作り方、効果の大きさ、識別の方法は未確認。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "デジタル変革の開示と株主資本コストの十分性の閾値", "title": "The cost of the buzz? A sufficiency threshold perspective on digital transformation disclosure and cost of equity capital", "url": "https://doi.org/10.1016/j.respol.2026.105661", "authors": "Lane Matthews ほか", "venue": "Research Policy", "date": "2026-11-10", "citescore": 17.6, "citescore_year": "2025", "apa": "Matthews, L., Müller, J. M., Kazantsev, N., & Heyden, M. L. M. (2027). The cost of the buzz? A sufficiency threshold perspective on digital transformation disclosure and cost of equity capital. Research Policy, 56(1), 105661. https://doi.org/10.1016/j.respol.2026.105661", "why": "題名から、デジタル変革の開示が株主資本コストに与える影響を「十分性の閾値」の視点で調べる研究（Research Policy）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "掲載誌（Research Policy）の題名のみ。抄録・本文は入手できなかった", "preprint": false, "short": true, "p1": "題名によれば、デジタル変革の開示が株主資本コストに与える影響を、十分性の閾値の視点から調べる研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いの面白さ：会社が「デジタル変革に取り組んでいます」と発表すると、投資家はその会社に要求する利回り（資本コスト）を下げるのか。ただの流行語（バズ）では下がらず、「十分な中身」の閾値を超えたときだけ効く、という問いが読み取れます。", "unverified": "抄録・本文を入手できず、題名以外は未確認。"}}, {"id": "jn26", "rank": 26, "field": "経営学", "headline": する、乖離条件付きのプロンプト生成器を使う（抄録）。", "p5": "連続時間の動的グラフのベンチマークで、ノード分類とリンク予測の両方で、12の最先端の基準を一貫して上回り、有効性と効率が優れると報告する（抄録）。", "fun": "SNSの友だち関係、論文の引用、お店の取引など、「時間とともに変わるつながり」は分野ごとに性質が違い、1つのAIで全部を学ぶのは難しい問題でした。この研究は、「どの分野にも通じる意味の部分」と「その分野特有の時間の動き」を分けて学び、分野ごとに合う専門家を選ぶ仕組みを作りました。いろいろな分野の変化を1つの頭脳で扱う試みが面白い点です。", "unverified": "本文未読のため、基準の一覧、ベンチマークの詳細、数値の改善幅は未確認。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "視覚特徴の再サンプリングでLVLMの視覚情報を回復", "title": "Vision Remember: Recovering Visual Information in LVLMs via Vision Feature Resampling", "url": "https://doi.org/10.1109/tpami.2026.3751856", "authors": "Ze Feng ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-09", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Feng, Z., Liu, J.-J., Yang, S., Xiao, L., Quan, Z., Feng, Z., Yang, W., & Wang, J. (2026). Vision Remember: Recovering Visual Information in LVLMs via Vision Feature Resampling. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–16. https://doi.org/10.1109/tpami.2026.3751856", "why": "抄録から、大規模視覚言語モデル（LVLM）で圧縮により失われる視覚情報を、視覚特徴の再サンプリングで回復する研究（IEEE TPAMI、SJR 4.829）。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの抄録（OpenAlexの記録）のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "画像と言葉を扱う大規模モデル（LVLM）で、視覚トークンの圧縮で失われる細かい視覚情報を、元の視覚特徴を各層で再サンプリングして回復する方法Vision Rememberができた。", "p3": "視覚トークンを圧縮すると、文字認識（OCR）や図表の理解のような細かい空間関係に頼る課題で重要な情報が失われうる。そこで、LLMデコーダの各層で元の視覚特徴を再サンプリングする。2つのモジュール（トークン–特徴の交差注意層、トークンの双方向自己注意層）で、局所的な交差注意と多段の融合で視覚表現を豊かにする（抄録）。", "p5": "LLaVA-NeXTの基準で、複数の視覚理解ベンチマークのほぼ全ての設定で、Vision RememberはTokenPackerを+2.7、FastVを+5.7上回る。従来の視覚特徴の再融合法とも比べ、同じ基準でDeepStackを+3.9、SVA Aggregatorを+3.4上回る。さまざまな効率的な視覚プロジェクタとLVLMと組み合わせても一般化する（抄録）。", "fun": "AIが写真や図を読むとき、計算を軽くするために画像の情報を縮めて渡しますが、縮めすぎると、細かい文字や表の線が読めなくなります。この研究は、AIが考えを進める途中の各段階で、もう一度元の画像の特徴を見直す仕組みを足して、縮めた情報を取り戻しました。記憶を途中でもう一度確認して思い出すのが面白い点です。", "unverified": "本文未読のため、ベンチマークの一覧と評価指標、計算コストの具体的な数値は未確認。"}}, {"id": "jn36", "rank": 36, "field": "機械学習 強める研究（IEEE TPAMI、SJR 4.829）。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの抄録（OpenAlexの記録）のみ。本文は入手できなかった", "preprint": false, "short": true, "p1": "連合学習で共有される勾配から元の画像を復元する攻撃を、GANの中間層の特徴領域まで探索を広げて強化するGIFDが提案された。", "p3": "従来は、事前学習したGANの潜在空間だけで勾配の反転を行い、表現力と汎化性が限られていた。GIFDは、GANを分解して中間層の階層的な特徴を探索し、最適化する層を、初期の潜在空間から出力画像に近い中間層へ徐々に変える。現実的でない画像を避けるため、探索範囲に小さなl1球の制約を加える（抄録）。", "p5": "分布外（OOD）の設定（GANと連合学習のタスクの訓練集合が同じ分布に従うという仮定を弱める）とラベルが一致しない場合のラベル対応の技法にも拡張し、さまざまな連合学習の場面で、画素水準の復元が可能で、競合する基準を上回ることを、広範な実験で示した（抄録）。", "fun": "「データは自分のスマホから外に出さず、学習の結果（勾配）だけを送る」連合学習は、プライバシーを守る仕組みとされています。でも、その送られた結果から、元の写真をほぼそのまま復元できてしまう攻撃があります。この研究は、その復元をさらに強力にしたもので、守る側が対策を考えるための警告になるのが面白い点です。", "unverified": "本文未読のため、復元の定量的な指標と、比較した基準の一覧は未確認。"}}], "data_related": [{"rank": 1, "headline": "吊橋の渦励振時の風と加速度の時刻歴計測", "title": "TJ-wind/VIV-measurement-data-of-a-1650-suspension-bridge: Wind and acceleration time histories during bridge vortex-induced vibration", "url": "https://doi.org/10.5281/zenodo.24093380", "authors": "Tongji Wind Engineering", "venue": "Zenodo", "date": "2026-11-09", "apa": "Tongji Wind Engineering. (2026). TJ-wind/VIV-measurement-data-of-a-1650-suspension-bridge: Wind and acceleration time histories during bridge vortex-induced vibration (Version viv-data-v1.01) [Computer software]. Zenodo. https://doi.org/10.5281/ZENODO.24093380", "summary": "同済大学の風工学グループが公開した、吊橋の渦励振（VIV）中の風と加速度の時刻歴の計測データ（題名に「1650」とあるが単位の記載なし）。実データはGitHubのリリース（viv-data-v1）からダウンロードする形で、Zenodoの記録は案内のみ。ライセンスCC BY 4.0、版 viv-data-v1.01。関連論文の記載なし。", "kind": "data", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"rank": 2, "headline": "3Dプリント板のFBGセンサによるガイド波損傷検出", "title": "Guided wave-based damage detection with the embedded FBG sensors in the 3D printed plate - dataset", "url": "https://doi.org/10.5281/zenodo.24098805", "authors": "Wandowski, Tomasz", "venue": "Zenodo", "date": "2026-11-10", "apa": "Wandowski, T. (2026). Guided wave-based damage detection with the embedded FBG sensors in the 3D printed plate - dataset [Dat   function themeColor(it) { return it.theme_no ? "--t" + it.theme_no : "--accent-soft"; }

    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);

      select(v);

  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {

  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }

  function renderTabs() {
    var g = groupOf(state.view);

    });

    subtabs.hidden = !g || g.parts.length < 2;

      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";

      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);

  }

    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {

      var chip = el("span", "chip", chipText);

    if (ex) {
      var basis = el("p", "basis");

      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));

      });

        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));

    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);

        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
