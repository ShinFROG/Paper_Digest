<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-11", "intro": "プレプリントの新着1,436件（一覧の候補273件）、学術誌の新着（上位10%誌2,271件・うち一覧の候補300件、その他の学術誌の関連候補308件・うち一覧の候補155件）、重要論文の候補334件（プレプリント233件・学術誌101件）、新着オープンデータ136件（一覧の候補116件）とe-Statの更新10件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目37報、オープンデータ30件です（論文誌・注目は、候補の多くが化学・材料・生物・気候の分野で、重点分野の候補が少なく抄録のないものも多かったため、上位10%誌の新着で補い、基準を満たすものに絞りました。統計学の候補はありませんでした）。上位10%誌の一覧の更新はHTTP 404で取得できず、9月27日に作った一覧を使いました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "車両モデルの固有振動数が重なる重心高さを導出", "title": "Symmetric and asymmetric vehicle models: coincidence of natural frequencies and the role of modal and interwheel correlations under random excitation", "url": "https://doi.org/10.21203/rs.3.rs-11667218/v1", "authors": "Gildas Amouzou ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Amouzou, G., Danho, É., Elishakoff, I., & Kéita, L. (2026). Symmetric and asymmetric vehicle models: coincidence of natural frequencies and the role of modal and interwheel correlations under random excitation. https://doi.org/10.21203/rs.3.rs-11667218/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research Squareの出版社PDF（本文）を読んだ。抄録・序論（§1）・結論（§7）・§6.1の冒頭の範囲で、式の導出（§4〜§5）と図は読み切れていない", "preprint": true, "p1": "7自由度の車両全体モデルで、アンチロールバーと重心高さを入れた固有振動数の一致条件を閉形式で導き、車輪どうしの励振の相関を落とすと応答の誤差が桁違いになることを示した（§7）。", "p2": "路面の不規則な凸凹による車両の振動解析では、固有振動数が重複するとモード間の相関が無視できなくなる。先行研究（Long他）は、アンチロールバーのない理想の対称車両で1つの車輪だけを励振しており、走行中の車を表していない（§1）。", "p3": "車体のバウンス・ピッチ・ロールと4輪の上下変位の運動方程式を、ピッチとロールが小さいとして線形化し、固有振動数を解析式で導く。自己相関行列を留数法で求め、4輪に車軸間距離・左右間隔・車速で決まる時間遅れをつけた定常白色雑音と正弦形のスピードバンプを与える（§2〜§6）。", "p4": "モード間相関の省略による誤差（Long他の75%）と、車輪間の励振の相関の省略による誤差を、1〜120 km/hで比べる。スピードバンプは決定論的な過渡励振なので、RMSでなく振動エネルギーで評価した（§7、抄録）。", "p5": "対称車両では、バウンス–ピッチが重心高さ0.761 mで（バーの剛性によらず）、バウンス–ロールがバーなし0.408 m・あり1.280 mで一致する（抄録）。4輪を励振すれば、モード間相関の省略の誤差は0.16%未満（白色雑音）・0.8%未満（スピードバンプ）だが、車輪間相関の省略はロールで1,453〜6,064%の誤差になる。車体の臨界速度は5〜30 km/hで、エネルギーはアスペクト比1/10で5〜15 km/hで最大となる（§7）。", "p6": "対象は小さなピッチ・ロール角を仮定した線形モデルで、実車の測定との比較は読めた範囲では見当たらない。解釈：結論は、論文中の車両の諸元と路面モデルのもとでの数値であり、別の車両への一般化は本文からは確かめられていない。", "fun": "車は4つのタイヤで路面の凸凹を受けますが、前のタイヤが通った凸凹を、後ろのタイヤは少し遅れて通ります。この「遅れ」を無視して、4つのタイヤがそれぞれ別の凸凹を受けると考えると、車体の横揺れ（ロール）の見積もりが桁違いにずれてしまうと分かりました。ゆっくり走るとき（5〜30 km/h）に、遅れの効果で最も大きく揺れるのが面白い点です。", "unverified": "式の導出（§4〜§5）、数値例の図表、車両パラメータの全値は読み切っておらず未確認。実車の測定による検証の有無も未確認。"}}, {"id": "pr02", "rank": 2, "headline": "等幾何梁と流体の連成で荷重を仕事共役に受け渡す", "title": "Consistent Mapping for Fluid Structure Interaction with Geometrically Nonlinear Isogeometric Beams", "url": "https://arxiv.org/abs/2611.12599", "authors": "Juan Ignacio Camarotti ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Camarotti, J. I., Aristio, R., & Wüchner, R. (2026). Consistent Mapping for Fluid Structure Interaction with Geometrically Nonlinear Isogeometric Beams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12599", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ。抄録と§7（結論）の範囲で、§3〜§6の式とベンチマークの図表は読み切れていない", "preprint": true, "p1": "幾何学的に非線形な等幾何梁（BernoulliとTimoshenko）と流体界面のあいだで、変位と荷重を一貫して受け渡す写像ができ、分割解法の流体–構造連成（FSI）に使えることを示した（§7）。", "p2": "等幾何梁は少ない自由度で精密な形状を表せるが、流体との連成では、1次元の梁の中心線と周囲の流体界面のあいだで運動と荷重を移す必要がある。従来の有限要素梁向けの写像はあっても、スプライン基底の運動学と断面の回転の記述に合う写像は、非線形の等幾何梁にはなかった（抄録）。", "p3": "参照配置で流体界面の点を梁に付け、現在の中心線と断面の運動学から界面を再構成する。この再構成を一貫して線形化すると変位の写像演算子が得られ、その転置が流体力を梁の一般化力・モーメントに仕事共役に移す（§3、§4、抄録）。", "p4": "解析的な曲げ・ねじり・組合せ変形の試験、収束性の試験、仮想仕事の試験で写像を検証し、MokとTurek–Hronのベンチマークの梁版とGolandの翼のフラッターで連成問題を評価した（§5、§6）。", "p5": "Timoshenkoの写像は期待どおりO(h^{p+1})の収束を示し、仮想仕事の試験の相対差は約10のマイナス11乗〜マイナス10乗で、仕事共役が確認された。Mokの基準では、等幾何Kirchhoff–Loveシェルの参照解をよく再現した。Golandの翼のフラッター速度はBernoulliで159.97 m/s、Timoshenkoで159.53 m/s、振動数は10.94 Hzと10.89 Hzで、文献の約11 Hzに近く、フラッター速度は異なるモデルで報告された約135〜174 m/sの範囲に入る（§7）。", "p6": "断面が剛体的に動くという仮定が成り立つ範囲が前提で、反りや断面の局所変形が大きい問題には、より豊かな構造モデルが要る（§7）。解釈：フラッター速度の検証は、幅の広い文献値の範囲との比較にとどまり、厳密な基準解との一致は示されていない。", "fun": "飛行機の翼や旗のように、細長い物が風や水の流れで揺れる問題は、物の形と流れの両方を同時に計算する必要があります。この研究は、細長い物を「1本の線」で表す省エネの計算モデルと、周りの流れの計算を、ズレなくつなぐ受け渡しのルールを作りました。翼が震えだす速さ（フラッター速度）も、文献の範囲に入る値として予測できたのが面白い点です。", "unverified": "MokとTurek–Hronのベンチマークの定量的な誤差（図・表）と、§3〜§4の式の導出は読み切れておらず未確認。"}}, {"id": "pr03", "rank": 3, "headline": "デジタルツインのデータ同化と制御を平均場で定式化", "title": "Online Digital Twins: Data Assimilation and Control", "url": "https://arxiv.org/abs/2611.12001", "authors": "Sebastian Reich", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Reich, S. (2026). Online Digital Twins: Data Assimilation and Control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12001", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ。序論（§1）・問題設定（§2）・§6・結論（§7）の範囲で、§3〜§5の導出は読み切れていない", "preprint": true, "p1": "デジタルツインの「データ同化」と「制御」を、連続時間の平均場の粒子系という1つの枠組みで同時に扱う数理モデルを示した（§1、抄録）。", "p2": "物理過程の部分的で雑音のある観測でデジタル表現を絶えず更新し（フィルタリング・データ同化）、そのモデルで将来を計画して物理過程の制御を決める必要がある。多くの実装は同化と制御を分けて扱うが、線形ガウスの場合を除いて最適でないとされる（§1、§7）。", "p3": "物理過程の観測は部分的で、仮想表現（拡散過程のモデル）がそれに近似する設定。データ同化はフィードバック粒子フィルタとその近似であるアンサンブルKalman–Bucyフィルタ（EnKBF）で、制御は平均場のPontryagin最小原理で表す。後退水平の計画（モデル予測制御）をハミルトン系の相互作用粒子系として実装でき、EnKBFとアフィン近似の制御則を詳しく扱う（§2〜§6）。", "p4": "この論文は数学的な枠組みを示すもので、数値計算は含まれない（抄録、§7）。提案の定式化を、出力フィードバックMPC・信念状態の共分散ステアリング・順方向・逆方向の確率微分方程式による最適制御と数値で比べることが今後の課題として挙げられる（§7）。", "p5": "結果は定式化と理論にあり、数値の結果はない。同化と制御の分離を避ける相互作用粒子の定式化を与え、既存の平均場PMPを状態に依存する拡散行列へ拡張した（§1、§4）。", "p6": "仮想表現を物理過程の複製とみなす「理想のツイン」の仮定は実際には満たされず、実装の品質・頑健性・信頼性の評価が課題で、モデルの誤指定下の統計的な検討は将来に残る。状態の次元が増えたときの拡張性や、勾配の効率的な近似、離散時間の観測への拡張も課題とされる（§7）。", "fun": "工場や建物のデジタルツインは、実物から少しずつ届く不完全なデータで、コンピュータの中の分身を絶えず直しながら、その分身を使って「次にどう操作するか」を決めます。この論文は、「直す」作業と「操作を決める」作業を、粒子がたくさん動く1つのしくみとして一緒に扱う数学の形を作りました。分身が完全なコピーではないことを前提にしているのが面白い点です。", "unverified": "式の導出と定理の証明（§3〜§5）は読み切れておらず未確認。数値計算は論文に含まれない。"}}, {"id": "pr04", "rank": 4, "headline": "ダムの浸透をPOD縮約とEKFで実測から同定", "title": "Observer-based parameter estimation in a Darcy model towards dam internal seepage monitoring with validation on real data", "url": "https://arxiv.org/abs/2611.12403", "authors": "Andrea Ferretti (GIPSA-MODUS) ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Ferretti, A., Besançon, G., & Robbe, E. (2026). Observer-based parameter estimation in a Darcy model towards dam internal seepage monitoring with validation on real data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12403", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv PDFの本文を読んだ（抄録・§II・§IV・§V・図表キャプション）。§IIIのEKFの式は読み切れていない", "preprint": true, "p1": "ダム内部の浸透を、Darcy則の1次元拡散モデルの水理拡散係数Dとして、実測データからオンラインに推定でき、その推定がバッチ最適化の結果と整合した（抄録、§IV）。", "p2": "堤体ダムでは貯水池の水が堤体の間隙を下流へ浸透し、構造に損傷を与えうる。堤体内の間隙水圧を測るピエゾメータの記録から、構造の状態を反映するパラメータDを求めたいが、偏微分方程式のままでは計算が重く、実時間の推定に向かない（§II）。", "p3": "飽和・等方・時不変・層流の仮定のもとで、水頭hは∂h/∂t=D ∂²h/∂x²に従う。有限差分の全次元モデルを、Dの多くの値で動かしたスナップショットの特異値分解で固有直交分解（POD）し、エネルギーの大きい3つのモードだけの縮約モデルにする。これに拡張カルマンフィルタ（EKF）を設計し、Dをオンラインに推定する（§II〜§IV）。", "p4": "EDFの実ダムの約30年・14日間隔のデータで、同じ材料の領域にある6つのピエゾメータを同定に、外側の2つのセンサーを境界条件に使う。外れ値の除去・14日での再標本化・低周波トレンドの除去の前処理をする。検証は2つで、同じデータでのオフラインのバッチ最適化との比較と、推定したDで観測を再現できるかの確認（§II、§IV）。", "p5": "EKFの初期値をD̂=10〜100の範囲で変えても、すべての軌跡が2010年までに同じ定常値へ収束した（図3）。推定したDによるモデルの誤差は、センサーごとにRMSEが1.2703、1.2864、2.4006、1.8487、MAPEが0.05〜0.11%だった（表II）。", "p6": "今後の課題は、より複雑なモデルと非線形効果への拡張、高度な推定法による頑健性の向上（§V）。材料が一様で時間不変、水平方向だけの拡散という簡略化が前提になる（§II）。定常値のまわりの小さな振動は、計測雑音とEKFの共分散の調整に由来するとされる（§IV）。", "fun": "ダムの中を水がじわじわ染みていく速さは、外からは見えません。この研究は、ダムの中に埋めた水圧センサーの約30年分の記録から、水の染みやすさ（拡散係数）を、時間とともに追いかけて推定しました。初期値をバラバラにしても同じ値に収束するという、安定した推定になったのが面白い点です。", "unverified": "§IIIのEKFの式、図6（別の高さのセンサーでの比較）の結果、データ期間の記載の違い（本文中に30年と35年の両方がある）は読み切れておらず未確認。"}}, {"id": "pr05", "rank": 5, "headline": "ハミルトン系の位相空間分布をシンプレクティック流で生成", "title": "Symplectic Normal Coordinates Flow for Generative Modeling of Hamiltonian Systems", "url": "https://arxiv.org/abs/2611.11061", "authors": "Christopher M. Pierce", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Pierce, C. M. (2026). Symplectic Normal Coordinates Flow for Generative Modeling of Hamiltonian Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11061", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§4・§4.1・§5・§6。付録Bのアブレーションは読み切れていない）", "preprint": true, "p1": "ハミルトン系の位相空間での密度の時間発展を、振幅に依存する回転（バーコフ正規形）の層をもつシンプレクティックな正規化フローで学習・生成でき、非線形が強いほど既存のフローより尤度が良いことを示した（§6）。", "p2": "条件のパラメータごとの密度がシンプレクティック変換で結ばれる物理系の生成モデルを、構造で保存則を保証して効率よく学習したい。RealNVPはシンプレクティックでなく、一般のSympNetは正規形の構造を使わない（§4、§5）。", "p3": "正規座標への変換N(c*)をLA-SympNetで学習し、間に、作用Jに依存する角度θ(J,c*)だけ各平面を回す層R(J,c*)を挟み、M=N⁻¹RNとする。回転層がシンプレクティックなのは、角度のヤコビアンが作用について対称なときで、GradNet-Cで満たす。潜在側は通常のRealNVP層（§4、§4.1）。", "p4": "3つの条件付き生成課題で、RealNVPとLA-SympNetと比べる。(1) 8個の弱く相互作用するDuffing振動子の鎖（非線形の強さβを0〜0.1）、(2) 空間電荷のある一様集束チャネルの電子ビーム（位相空間2次元）、(3) コヒーレントシンクロトロン放射を含む圧縮シケインの電子ビーム（6次元）。評価は保持データの負の対数尤度（nats/sample）（§5）。", "p5": "Duffing鎖では、βが増えるとRealNVPの負の対数尤度は12.0から14.1、SympNetは12.3から15.4へ悪化するのに、提案のフローは11〜12 nats/sampleで安定する（図2、§5.1）。集束チャネルではRealNVPが−11.34、SympNetが−11.25、提案が−11.49で最良（§5.2）。シケインでは提案−5.07、RealNVP−5.06、SympNet−4.15で、提案はSympNetより効率が良くRealNVPと同等（§5.3）。", "p6": "条件付きの変換を正規座標での回転に限る点が限界で、共鳴の駆動項があるとバーコフ正規形の論拠は成り立たず、正規形は形式的な級数で発散しうる（§6）。実験は最大16次元の位相空間の模擬系に限られる（§6）。ハイパーパラメータの調整は、β=0.1の1つの条件で行われた（§5.1）。", "fun": "ふりこのような振動する物が集まった系は、時間がたつと、粒子の分布が位相空間（位置と速度の平面）の中で、渦のようにぐるぐる回りながら変形します。この研究は、AIの中に「振幅が大きいほど速く回る」という、物理の自然な動きを部品として入れて、分布の変化を学ばせました。物理の形を知っているAIは、非線形が強くなっても成績が崩れないのが面白い点です。", "unverified": "付録Bのアブレーション、§2の関連研究、図3・4の詳細は読み切れておらず未確認。"}}, {"id": "pr06", "rank": 6, "headline": "意見動力学の運動論方程式をスペクトル法で解く", "title": "A Legendre-Galerkin Method for Kinetic Models of Opinion Dynamics with Quasi-Invariant Consistency", "url": "https://arxiv.org/abs/2611.11492", "authors": "Rui Wang ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Wang, R., & Xiong, Y. (2026). A Legendre-Galerkin Method for Kinetic Models of Opinion Dynamics with Quasi-Invariant Consistency (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11492", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（序論の一部・§5・§6と目次。§3〜§4の導出と証明は読み切れていない）", "preprint": true, "p1": "意見が2者の対話で変わる運動論（Boltzmann型）モデルを、Legendre–Galerkinスペクトル法で高精度に解き、誤差評価と、準不変領域でFokker–Planck方程式への整合性を証明した（§6、抄録）。", "p2": "意見分布の運動論モデルは、意見に依存した妥協の重みと雑音の振幅をもつ2者の相互作用で書けるが、衝突項は複数の積分を含む非線形・非弾性の項で、高精度な数値近似が難しい（§1、抄録）。", "p3": "弱い衝突核を厳密に有限分解して、時間に依存しないテンソル表現のGalerkin衝突演算子を得る。雑音のモーメントとLegendreの3項漸化式を使う再帰で、テンソルを1次元のGauss–Legendre求積だけで前計算し、各衝突評価をテンソルの縮約に帰着する。有界信頼の相互作用にも拡張できる（§3、§6）。", "p4": "空間（Legendre次数N）と時間の収束、質量保存を、相対L2誤差で検証する。初期密度は意見w=−0.25を中心とするガウス型で、基準解はN=128で作る。準不変領域は、スケーリングしたεでの離散演算子の誤差で確かめ、有界信頼のクラスタ形成を信頼閾値Δで調べる（§5）。", "p5": "空間の収束は指数的で、N=8、16、32、64の相対誤差が8.199×10⁻²、1.713×10⁻³、4.286×10⁻⁷、1.845×10⁻¹⁴となる（表1）。時間はほぼ4次の収束で、観測された次数は4.079〜4.010（表2）。準不変領域での離散演算子の誤差はεの平方根のオーダーで、理論と一致した（図1）。有界信頼では、閾値Δを1から0.4、0.2へ小さくするほどクラスタが増え、意見の分極が起こりうることが示された（図2）。", "p6": "誤差評価は一定の正則性と安定性の仮定のもとで示される（§6）。数値実験は1次元の意見空間の例で、実データでの検証はなく、モデルのパラメータ推定やデータ駆動の応用は将来の課題とされる（§6）。", "fun": "SNSで意見が割れて対立する現象を、人々が1対1で話すたびに少しずつ意見が変わる、という単純な数式で表します。この論文は、その数式を、誤差がとても小さくなる計算の方法で解く技を作りました。「話し合う相手を、自分に近い意見の人だけにする」と、意見のグループが分かれて分極していく様子が、計算結果から見えるのが面白い点です。", "unverified": "定理の証明（§4）、有界信頼の拡張の詳細（§3.4）、補足資料の動画は読み切れておらず未確認。"}}, {"id": "pr07", "rank": 7, "headline": "LLMの潜在層が66の心理構成概念を安定して表す", "title": "Not Your Average Clever Hans: Latent Representation of Psychological Constructs in Large Language Models", "url": "https://doi.org/10.2139/ssrn.7682438", "authors": "Jack Chen ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Chen, J., Zhou, Z., An, C., & Chen, L. (2026). Not Your Average Clever Hans: Latent Representation of Psychological Constructs in Large Language Models. https://doi.org/10.2139/ssrn.7682438", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefの記録）の抄録のみ。本文は入手できなかった", "preprint": true, "p1": "LLMを実験の被験者（シリコンサンプル）に使うとき、効果がLLM内部の心理的構成概念の表象を介して生じているかを確かめる方法を示し、66の構成概念が16のオープンウェイトLLMの潜在層で妥当に表されることを示した（抄録）。", "p2": "心理学者がLLMを実験参加者に使うことが増えているが、シリコンサンプルでの効果が過程理論を支えるのは、LLMの応答が中間の心理的状態（構成概念）の表象を介して生じる場合だけである。LLMがそうした構成概念の安定した表象をもつかは不明だった（抄録）。", "p3": "多特性多方法（multitrait-multimethod）の手法で、66の心理構成概念（例：心理的所有感、道徳的行為主体性、目標進捗の知覚）を、16のオープンウェイトLLMの潜在の神経層で調べる。構成概念の異なる操作が同じ表象を活性化するかも検討する（抄録）。", "p4": "構成概念妥当性の基準を表象が満たすかを評価し、その活性化がLLMの応答に影響するかを、入力が応答生成にどれだけ近いかとの関係で調べる（抄録）。", "p5": "LLMの内部表象は構成概念妥当性の基準を満たし、モデル開発元と規模をまたいで共有され、評価過程（appraisal）によってグループ化された。構成概念の別々の操作が同じ表象を活性化し、その活性化が応答に影響するかは、入力と応答生成の近さに依存した（抄録）。", "p6": "抄録には著者が認める限界の記載がない。解釈：確かめられたのはオープンウェイトモデルの内部表象で、閉じた商用モデルや、表象が応答の因果に実際に使われる範囲は、抄録からは分からない。", "fun": "「人間そっくりに答えるAI」を、心理学の実験の被験者として使う研究が増えています。でも、そのAIの答えが、本当に人間の心理のしくみ（たとえば「自分のものだ」という気持ち）と同じ中身から出ているのか、それとも見かけだけなのかは分かりません。この論文は、AIの頭の中に、そうした心の概念がちゃんと作られているかを、脳の検査のように調べる方法を示しました。", "unverified": "本文未読のため、66の構成概念の一覧、16モデルの名前、効果の大きさ、著者が認める限界は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "模擬患者LLMは実在の回答者より回答のばらつきが小さい", "title": "The Average Patient: Do Simulated Psychiatric Patients Answer Like Real People?", "url": "https://arxiv.org/abs/2611.11679", "authors": "Weixiang Sun ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Sun, W., Wang, Z., Shi, K., Huang, H., Nelson, C., Li, Y., & Ye, Y. (2026). The Average Patient: Do Simulated Psychiatric Patients Answer Like Real People? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11679", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§3〜§5・§6.1・§7・§8・Limitations）。付録と§6.2の数値は読み切れていない", "preprint": true, "p1": "LLMで作った模擬の精神科の患者は、同じ合計点の実在の回答者よりも回答のばらつきが1.5〜11分の1に縮み、ほとんどの症状を中程度に認める「平均的な患者」になることを、項目水準で示した（抄録、§5.2）。", "p2": "模擬患者は臨床家の訓練やAIセラピストの評価に使われるが、もっともらしさや合計点で評価されがちで、項目ごとの回答の分布や相関は検証されていない。ペルソナが運ぶ情報の量（情報予算）が模擬患者の違いの上限を決めるため、重症度だけを伝えるペルソナではばらつきが小さくなると予想される（抄録、§3.2）。", "p3": "重症度（4段階）を名指す1行のペルソナで、17のLLMにPHQ-9・GAD-7などの質問票に答えさせ、同じ合計点の実在の回答者（NHANES 41,714人など9つの参照）と比べる。症状の幅・「全くない」の割合・全項目を認める割合・ばらつき・項目間の共変動を測る（§3、§4）。", "p4": "「平均的な患者」仮説（各項目で名指した状態の典型の水準で答える）の予測を、合計点を合わせた比較で検証する。指標は、ばらつきの比、全項目を認める割合、実在と見分けるAUC、残差相関の類似度で、偽装を指示された人の群と、面接・評価エージェントへの下流の使用も調べる（§3、§5〜§7）。", "p5": "PHQ-9の合計15〜24で、モデルが「全くない」と答えるのは0〜4.5%（実在は10〜15%）、項目1〜8をすべて認めるのは99.1〜100%（実在は47〜62%）、2つの応答のばらつきは3.0〜8.6分の1（図1）。9つの参照では1.5〜11分の1（§5.2）。偽装を指示された人が「全くない」と答える頻度は本物の患者の0.90倍、モデルは最大0.37倍（§5.3）。評価エージェントが重症度帯に当てる割合は、重症度を伝えた患者で20〜26%、実在のプロファイルを与えた患者で42〜61%（§7.3）。", "p6": "人の参照データは公開調査・臨床・学生の標本で、モデルのペルソナと母集団・言語・実施方法が異なる。偽装の比較は外傷後の症状の1つの公開研究に基づき、面接は固定の台本で、評価エージェントも著者自身のもの。訓練が回答の集中を生む仕組みは将来の課題とされる（Limitations）。", "fun": "AIに「中くらいのうつ病の人として答えて」と頼むと、どの症状もまんべんなく、ほどほどに当てはまる、教科書どおりの「平均的な患者」として答えます。本物の人は、ある症状は全くなく、ある症状は強い、というふうに偏っているので、AIの答えは、同じ合計点の人より、ばらつきが1.5〜11分の1しかありませんでした。人間らしい偏りをまだうまく真似できていないのが面白い点です。", "unverified": "付録（証明・表・図）、§6.2のプロンプト・ペルソナ・モデル規模の効果の数値、§5.1の共変動の指標は読み切れておらず未確認。"}}, {"id": "pr09", "rank": 9, "headline": "公的統計ベースの合成ペルソナ100万件を調査と照合", "title": "Viability of Public Statistics–Based Synthetic Personas in Small-Area Public Health Surveillance: Sociodemographic Benchmark Consistency Study Using Korea Community Health Survey and Korean Statistical Information Service Data (Preprint)", "url": "https://doi.org/10.2196/preprints.106306", "authors": "Miryoung Kim", "venue": "JMIR Preprints", "date": "2026-11-09", "apa": "Kim, M. (2026). Viability of Public Statistics–Based Synthetic Personas in Small-Area Public Health Surveillance: Sociodemographic Benchmark Consistency Study Using Korea Community Health Survey and Korean Statistical Information Service Data (Preprint). https://doi.org/10.2196/preprints.106306", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprints（Crossrefの記録）の抄録のみ。本文は入手できなかった", "preprint": true, "p1": "公的統計から作った韓国の合成ペルソナ（個人レベルの人工データ）は、性別・道・独居・年齢などの基本的な周辺分布とはよく合うが、高次元の社会人口の組合せでは一致が弱く、単独で地域の監視や健康アウトカムの推論に使うべきでないことを示した（抄録）。", "p2": "合成ペルソナは個人情報を出さずに個人レベルのデータを作れるが、監視に使うには、周辺分布だけでなく、脆弱な集団を定める結合プロファイルを保つ必要がある（抄録）。", "p3": "合成ペルソナ100万行を、2021〜2025年の地域保健調査（CHS）の成人1,156,122人と、韓国統計情報サービス（KOSIS）の市町村指標と比べる。中核変数は年齢群・性別・婚姻状況・独居・学歴（地域版では婚姻の代わりに道または市町村）。周辺・結合の分布をパーセントポイント差と総変動距離（TVD）で比べ、CHSの標本誤差を500回の層別クラスターブートストラップで見積もる（抄録）。", "p4": "評価は、TVD（0に近いほど一致）とそのブートストラップ区間、CHSの半分割の基準との比較。疎なセル、KOSISとの相関、地域の構成を標準化した分析で、頑健性と下流の使い道（未充足の医療の割合）も確かめた（抄録）。", "p5": "性別（TVD<0.001）、道（0.006）、独居（0.008）、年齢群（0.013）はCHSに近く、婚姻（0.039）と学歴（0.059）はやや大きい。全国の中核プロファイルのTVDは0.106で、CHSの半分割の中央値0.009より大きく、市町村のプロファイルは0.117（半分割の中央値0.082）。CHSと合成ペルソナの構成で標準化した未充足医療の割合の差は平均0.109ポイント（相関0.567）だが、全国のプロファイル別確率による標準化は地域のCHSの率を再現しなかった（合成ペルソナの構成で相関0.004）。KOSISの独居の条件付き比較は中程度（相関0.547）（抄録）。", "p6": "著者は、追加の較正・検証なしに、単独の情報源として地域の監視や健康アウトカムの推論に使うべきでないと結論し、構成に基づくシナリオ作りやダッシュボードの試作に限る使い方を示す（抄録）。解釈：高次元の組合せでの不一致の原因（元の統計の粒度など）は、抄録からは分からない。", "fun": "「公的な統計をもとに、本物そっくりの架空の人々を100万人作れば、個人情報なしで街の健康状態を調べられる」という発想の検証です。性別や年齢のような単純な集計はよく合いましたが、「この年齢・学歴・一人暮らし」といった組み合わせになると、本物の調査とのずれが大きくなりました。見た目がそっくりでも、組み合わせの再現は難しいのが面白い点です。", "unverified": "本文未読のため、合成ペルソナの作り方、変数の定義、各指標の図表は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "会合の形式でLLM集団の意見への影響が変わる", "title": "Same Contacts, Different Rooms:Meeting Format Shapes LLM Group Influence Beyond Pairwise Contact Counts", "url": "https://arxiv.org/abs/2611.10641", "authors": "Zhexi Gu ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Gu, Z., Cao, S., & Zhu, R. (2026). Same Contacts, Different Rooms:Meeting Format Shapes LLM Group Influence Beyond Pairwise Contact Counts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10641", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§5.1〜§5.3・§6の一部・§7・Limitations）。付録は読み切れていない", "preprint": true, "p1": "LLMの集団の意見への影響は、メンバーと初期の立場と2者ごとの接触数を固定しても、会合の形式（人数と編成）で変わるため、接触ネットワークだけでは捉えられないことを示した（抄録、§7）。", "p2": "LLMエージェントの集団のシミュレーションは、通常、相互作用を2者ごとの接触ネットワークにまとめる。しかし、その要約が、会合の形式（誰が同席するか）の違いを捨てても成り立つかは検証されていなかった（抄録、§2）。", "p3": "メンバー・初期の立場・2者ごとの接触数を固定し、会合の組み替えだけを変える。3人組を5人の会合に統合する「サイズ変更」と、3人組の中の組合せを入れ替える「再編成」は、同じ60の2者の曝露を動かす。各メンバーは同席者全員の議論を読み、1ステップの支持を出す。6つのオープンウェイトLLMと14の論題で行う（抄録、§3）。", "p4": "グループの支持の変化（RMS、ポイント）をサイズ変更と再編成で比べ、2者ごとの規則を会合ごとに適用した予測と、静的な接触ネットワーク上の規則の予測を、R²で比べる（§4、§5）。", "p5": "RMSの変化はサイズ変更4.36ポイント、再編成2.59ポイントで、全6モデルと84のモデル×論題のセルのうち81でサイズ変更が大きい（差1.77ポイント、§5.1）。サイズ変更は初期の多数派を1.72ポイント増幅するが、再編成の方向性は0.03ポイント以下。会合ごとの2者規則は再編成の効果の最大76%を説明し、同じ重みで会合ごとに計算すると、2つのモデルでサイズ変更のR²が0.51〜0.58上がる（§5.2、§5.3）。Jensenギャップは会合ごとの予測ロジットのばらつきと追随する（対数対数の相関0.97、抄録）。", "p6": "証拠は6つの小さなオープンウェイトモデルと14の論題で、固定した初期状態からの1ステップの読み出しに限られ、人間の集団でなくLLMの集団を述べる。会合の数やトークン数はそろえていない。逐次の会合での検証が次の課題とされる（Limitations and next steps）。", "fun": "友だち3人ずつの小さなグループで何回も話すのと、5人の大きなグループで話すのとでは、「誰と何回話したか」の回数が同じでも、集まった意見の動きが違いました。大きな会議では、もともと多かった意見がさらに強まります。AIの集団でも、人間の会議と同じように、人数の違いが空気を変えるのが面白い点です。", "unverified": "付録（スケジュールの詳細、予測子の定式化、Jensen境界の証明）と図の詳細は読み切れておらず未確認。"}}, {"id": "pr11", "rank": 11, "headline": "ペルソナの持続性を長期の意思決定で測る", "title": "THEATRON: A Benchmark for Evaluating Persona Persistence in Long-Horizon LLM Decision-Making", "url": "https://arxiv.org/abs/2611.11487", "authors": "Yuyan Wang ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Wang, Y., Jiang, Y., Liu, Z., Huang, J., & Ananiadou, S. (2026). THEATRON: A Benchmark for Evaluating Persona Persistence in Long-Horizon LLM Decision-Making (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11487", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§3・§4.2〜§4.5・§5・Limitations）。付録は読み切れていない", "preprint": true, "p1": "行動ファイナンスのペルソナをLLMに与えたとき、長い意思決定で一貫して保たれるかを測るベンチマークTHEATRONで、ペルソナは行動を系統的に変えるが、一貫した方針にはなりにくいことを示した（抄録、§5）。", "p2": "既存の評価はペルソナの表現（口調など）を調べるもので、ペルソナ情報が長期の逐次の意思決定で保たれるかは調べていない（抄録）。", "p3": "AAPLとTSLAの102取引日（2025年1月2日〜5月30日）の価格・ニュース要約・SEC開示を共通の証拠にして、過信・損失回避・群集（Herding）のペルソナを最初に1つ割り当て、各日にBUY/HOLD/SELLを出させる。前の行動の実現損益を次の入力に言葉で渡す。ゼロショット・ワンショット・思考の連鎖（CoT）の3つの注入方法を、4つのLLMで、各条件5回のロールアウトで評価する（§3、§4、Limitations）。", "p4": "（i）ペルソナなしの基準と異なる、（ii）同じペルソナの繰り返しが安定、（iii）ペルソナ間が分離できる、（iv）分離が状態に鈍感な行動の崩壊によらない、（v）行動がペルソナに沿った方向性を示す、の5条件を、基準との差、ロールアウトのばらつき、収益・行動のB/W比、行動のエントロピー、方向性の検査で評価する（§3.3）。", "p5": "ゼロショットでは、ペルソナなしの基準との行動の比較24件すべて、収益の軌跡の21件が有意で、過信は非HOLDを22.5〜96.5ポイント増やし、群集は見える価格方向への一致を32.3〜66.7ポイント高める（§4.2）。ただし同じペルソナでも収益のばらつきが大きく（GPT-5.4-miniの過信で標準偏差が15.40%・21.95%）、Gemini-2.5-Flashの過信ではTSLAで5回とも同じ102の行動に崩壊した。エントロピーはB/Wと負の関連で、多様性は安定の指標にならない。ワンショット・CoT・Qwen3-8Bの微調整（2,202件）でも失敗は一貫して解消しない（§4.2〜§4.4）。", "p6": "2銘柄・3つのペルソナ・3つの注入方法・各5回で、BMRNと2つ目のAAPLの窓はゼロショットのみ。売買は1期間の方向性だけに単純化され、在庫・ポジションの大きさ・取引費用・流動性・市場との相互作用を捨象する。SFTは1つの設定。APIのモデル更新が再現性に影響しうる（Limitations）。", "fun": "「あなたは自信過剰な投資家です」とAIに役を与えて、何か月分の売買を決めさせると、役の違いで行動はちゃんと変わります。でも「1つの人格として一貫した判断」にはなりにくく、毎回ぶれるか、いつも同じ行動（買いばかり）に固まってしまいました。役を演じるのと、役の人格を保ち続けるのは別のこと、というのが面白い点です。", "unverified": "付録（プロンプトの全文、統計手順、ケーススタディ、BMRNと第2のAAPL窓の詳細）と表8・10の数値は読み切れておらず未確認。"}}, {"id": "pr12", "rank": 12, "headline": "25万件の会話で見るAI協働の重要度・主導権・摩擦", "title": "Human-AI Collaboration at Scale: Task Criticality, Agency, and Friction across 250,000 Conversations", "url": "https://arxiv.org/abs/2611.09902", "authors": "Yijia Shao ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Shao, Y., Zhao, D., Padmakumar, V., Wang, J., & Yang, D. (2026). Human-AI Collaboration at Scale: Task Criticality, Agency, and Friction across 250,000 Conversations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09902", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§3.1・§3.3・§4.1・§4.2・§5・§6・Limitations）。§3.2、付録、§5.2の後半は読み切れていない", "preprint": true, "p1": "Claude.aiの249,834件の会話から、人がAIにどんな重さの仕事を任せ、どれだけ主導権を持ち、どこでつまずくかを、大規模に測れるようにした（抄録）。", "p2": "AIの使われ方の研究は、アンケート・実験室の研究・狭い課題のベンチマークが中心だった。実際の会話で、仕事の重さ・人の主導権・学び・摩擦をまとめて見た研究が足りなかった（Limitations）。", "p3": "会話をクラスタにまとめて個々の中身を見せないClioで、LLM分類器が会話ごとに、仕事の重大度（取り消しにくさ・外部への見え方・影響の3軸で4段階）、人の主導権（Human Agency Scale）、AI出力への向き合い方、AIの教え方、摩擦の原因と結果、利用者の対処を判定する（§3.1、§3.3、§4.1、§4.2、§5）。", "p4": "実験ではなく記述的な分析で、会話ごとのラベルの分布を、重大度の段階・仕事の領域・国で比べる。国別は2,000件以上ある19か国で、政府のAI準備度の指標と相関を見る。ラベル設計はWildChatの一部で確かめた（§4.2、Limitations）。", "p5": "重大度は、一過性20%・運用24%・重大44%・高リスク12%で、34%は実行すべき作業を含まない。法務・金融の指導がTCI 2.14で最も重く、学業は1.06（§3.1）。AI出力の手直しは重大の段階で60%に達するが、高リスクでは52%に下がり、理解しようとする会話が21%に増える（§3.3）。人が主導するH4は72%、AI単独寄りのH1+H2は18.2%（§4.1）。AIが教える会話は67%で、国別ではAI準備度が高いほど理解を求める利用が増える（r=+0.54）が、教える頻度はほぼ変わらない（r=+0.16、図4）。摩擦は49.7%の会話にあり、モデル起因38.6%、利用者起因19.4%。摩擦のある会話の78.7%で利用者が能動的に対処した（§5.1、§5.2）。", "p6": "Clioは会話をクラスタにまとめるため、注釈を元の会話と直接照合できず、会話単位の質的分析もできない。誤分類が少数残るとする。データはClaude.aiのチャットのみで、Claude Codeなどの自律型は含まず、1社の利用者に偏る（Limitations）。会話の再開は同じスレッド内しか数えず、過小の可能性がある（§5.2）。", "fun": "AIに頼まれる仕事の44%は、やり直しにくい、外の人に影響する「重い仕事」でした。面白いのは、仕事が重くなるほど人はAIの答えをそのまま使わず手直しするのに、いちばん重い12%の層では手直しが減り、「まず理解しよう」とする会話が増えること。著者は、見張りがいちばん要る所で見張りが弱まる恐れを指摘しています。", "unverified": "§3.2（作業の粒度）、付録（分類器の指示文・ファセットの定義）、§5.2の後半は読み切れていない。LLM分類器の精度（WildChatでの検証結果）の数値は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "デジタル管理が1つ増えるごとに心理社会的リスクが増える", "title": "When the Algorithm Sets the Pace: Digital Management, Worker Voice and Job Quality", "url": "https://doi.org/10.21203/rs.3.rs-11660421/v1", "authors": "Sarfaraz Abu Abdullah", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Abdullah, S. A. (2026). When the Algorithm Sets the Pace: Digital Management, Worker Voice and Job Quality. https://doi.org/10.21203/rs.3.rs-11660421/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "出版社PDFの本文を読んだ（抄録・§4・§5・§6〜§9・§10.3）。§1〜§3、§10.1〜§10.2、表と図は読み切れていない", "preprint": true, "p1": "EUの労働者調査OSH Pulse 2022（約27,250人）の公表結果の再分析で、デジタル管理の広がりは業種より国で決まり、労働者の発言の制度が強い国でも導入は少なくなく、協議が悪影響の一部を相殺する規模を見積もった（抄録）。", "p2": "アルゴリズムが仕事の割当・ペース・監視・評価を行う仕組みが通常の職場に広がったが、普及の程度、守られる人、仕事の質への影響の比較証拠は乏しい（抄録）。", "p3": "公表された29か国×8業種（232セル）の指標の平均と回帰係数だけを使う。繰り返しのない二元配置分散分析で国と業種の寄与を分け、Tukey検定で加法性を、ケンドールのWで業種順位の一致を見る。共同決定を求める5か国と他24か国の差は順列検定などで比べ、協議が打ち消す実践の数（相殺比）はデルタ法、全員に及んだ場合の改善量はモンテカルロで出す（§5）。", "p4": "指標は労働者が答えるデジタル管理の実践数（0〜6）、心理社会的リスク（0〜6）、健康の訴え（0〜7）。比べる軸は国・業種・発言制度の型で、2024年のESENERと2025年のOSH Pulseは文脈の確認に使う（§4、§5.3、§8.5）。", "p5": "平方和の寄与は国62.7%、業種12.3%、残差25.0%（§6.1）。業種の順位は国をまたいで一致し（W=0.28）、商業・運輸・飲食が最高の2.15、建設が最低の1.76（§6.2）。共同決定5か国の平均は1.84で他24か国の1.95より0.11低いが、完全順列検定でp=0.44、1国を除くと−0.01〜−0.22と動く（§7、§9）。実践1つで心理社会的リスクが0.208、健康の訴えが0.172増え、協議は実践0.51個分と0.78個分を打ち消す（§8.1、§8.2）。協議が全員に及ぶと負荷の14.6%と22.3%、効果のある措置をそろえると53.3%と74.0%を相殺する（§8.3）。", "p6": "公表集計と係数だけで、セルの標本数がなく、F検定は標本誤差でなくセル平均の差の記述になる。横断的な自己報告で因果は言えず、相殺の計算は因果とみなした規模の比較にすぎない。加法線形モデルのため、協議が悪影響自体を弱めるかは検証できない。協議の項目はストレスに関わる側面で、アルゴリズムの運用ではない。制度の分類は粗い（§4.3、§9）。", "fun": "配達アプリのようにアルゴリズムが仕事の順番や速さを決める仕組みは、ふつうの職場にも広がっています。面白いのは、広がり方が「どの業種か」より「どの国か」で決まること（国の寄与62.7%、業種12.3%）。労働者の意見を聞く法律が強い国でも、導入は少なくなっていませんでした。意見を聞く制度は導入のブレーキではなく、負担のうち協議だけなら15%と22%ほどを和らげる程度、という見積もりです。", "unverified": "元の調査（Pesole 2023）の係数とセル値は原典で再確認しておらず、この論文の記載による。図2〜6、付録の表A・B、§1〜§3の仮説の細部は読み切れていない。"}}, {"id": "pr14", "rank": 14, "headline": "ESG開示518件でLLMの数値抽出と回答拒否を監査", "title": "Auditing the Auditor: Extraction Accuracy, Hallucination, and Abstention in Open-Weight LLMs for ESG Reporting A Longitudinal Empirical Benchmark Across 518 Corporate Disclosures (2010–2026)", "url": "https://doi.org/10.21203/rs.3.rs-11610550/v1", "authors": "Redeemer Salami Okekale ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Okekale, R. S., Markin, K., Amuna, D., & Coker, F. (2026). Auditing the Auditor: Extraction Accuracy, Hallucination, and Abstention in Open-Weight LLMs for ESG Reporting A Longitudinal Empirical Benchmark Across 518 Corporate Disclosures (2010–2026). https://doi.org/10.21203/rs.3.rs-11610550/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社PDFの本文を読んだ（抄録・§2.4の要旨・§3・§4.1〜§4.4・§4.6・§5・§6）。§4.5と§4.7〜§4.8、表と図の全値は読み切れていない", "preprint": true, "p1": "ESG報告書から数値を抜き出す監査作業で、オープンウェイトのLLM5つが、表の数値の読み取りと、見つからないときの回答拒否をどこまでできるかを、518報告書で測れるようにした（抄録）。", "p2": "監査では、密な表から正確な数値を取り、開示がなければ推測せず断る必要がある。既存の評価は、オープンウェイト同士の比較、複数パッセージ検索、欠落開示の試験、2025〜2026年のCSRD報告を欠く（抄録、§2.4）。", "p3": "欧州企業の518報告書（2010〜2026年、279,862パッセージ）を索引し、120問（数値KPI55・前年比20・方針25・分野横断20）を、上位1件・上位3件・正解ページ・年や企業が違う紛らわしいページ（通常／厳格プロンプト）の5条件で5モデルに解かせる。採点は別系統のPhi-4-14B（§3）。", "p4": "指標は文脈精度・文脈再現・忠実性・回答関連性・事実正確性（F1）で、数値は±1%の丸めを許して自動検証する。温度0で再現性を確保し、自己採点を避けるため審査役は別系統にした（§3.1、§3.5）。", "p5": "上位1件では事実正確性が0.389〜0.474（GPT-OSS-20Bが最高の0.474）。上位3件で文脈再現が0.562から0.662に上がり、数値KPIの抽出が7〜15点改善する（§4.1）。正解ページを渡しても平均0.492から0.651（+16.0点）で、最強のGPT-OSS-20Bは0.731止まり、表の読み違いが残る（§4.2）。紛らわしいページでは、通常プロンプトの従来型モデルが14.2〜24.2%で数値を作り、DeepSeek-R1-7Bは77.5%で自発的に拒否し、厳格プロンプトで密なモデルの拒否は74.2〜80.0%に上がる（§4.3）。標準化された2025〜2026年のCSRD報告は、正解ページ前提で+8.5〜+11.5点高い（§4.4）。", "p6": "英語・欧州上場企業の報告書に限り、PDFのテキスト抽出のため画像の図は読めず、検索は1つの索引に固定し、各問は1報告書で完結する。審査役LLMは言い換えの拒否を減点しうる（Limitations）。抄録の0.729と0.335は、物語の最高値と数値のk=1の基準値という条件違いの比較で、同条件（正解ページ・GPT-OSS-20B）の差は0.800対0.650の15.0点（§4.4）。", "fun": "「2024年の有害廃棄物の量は？」と聞いて、AIには2022年の水の再利用の段落だけを渡します。すると、Qwen3-4Bは存在しない「18,400トン」を作り、Gemma-4-31Bは2022年の水の数字（12,500立方メートル）を答えてしまい、DeepSeek-R1-7Bだけが「年も項目も違う」と気づいて答えを控えました。「分かりません」と言わせる指示や考え方が、結果を大きく変えました。", "unverified": "抄録の「最大46.7%」に対応する本文の記述は確認できていない（§4.3の本文は14.2〜24.2%で、図5の数値は文字化けして対応が読み取れない）。審査役Phi-4-14Bの採点を人手の判定と照合した記述は本文で見つけられなかった。"}}, {"id": "pr15", "rank": 15, "headline": "社会的つながりの変化と孤独・メンタル不調の関係", "title": "The Cost of Disconnection: Longitudinal Egocentric Network Analyses Linking Social Isolation to Loneliness and Mental Health in Adolescents and Adults", "url": "https://doi.org/10.31234/osf.io/tgqxc", "authors": "Lu Zhang ほか", "venue": "PsyArXiv", "date": "2026-11-09", "apa": "Zhang, L., Nelissen, A. B., Daniels, S., Richards, M., Andrews, J. L., & Schweizer, S. (2026). The Cost of Disconnection: Longitudinal Egocentric Network Analyses Linking Social Isolation to Loneliness and Mental Health in Adolescents and Adults. https://doi.org/10.31234/osf.io/tgqxc", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみを読んだ（OSF。本文は入手できず）", "preprint": true, "p1": "新型コロナ下の社会的な断絶が人間関係のネットワークをどう変え、それが青年と成人の孤独・うつにどう違って結びつくかを、3か国の前向き研究で示した（抄録）。", "p2": "社会的な断絶は若者のメンタルヘルス危機の一因とされるが、断絶がネットワークをどう組み替え、年齢層でメンタルウェルビーイングとの結びつきがどう違うかは不明だった（抄録）。", "p3": "CORAL研究（オーストラリア・英国・米国）の1,278人（11〜89歳、平均37.2±16.2歳、88%が女性）で、自己中心ネットワーク分析から構造的な密度・機能的な親密さ・交流頻度を求め、線形混合効果モデルで、ベースライン・3か月後・6か月後の横断的・前向きな関連を調べる（抄録）。", "p4": "結果変数は、うつ・孤独を含むメンタルウェルビーイングで、比較は青年と成人。尺度名・統制変数・効果量は未確認（抄録のみ）。", "p5": "青年は仮想の交流が多く、対面の接触が少なかった。ネットワークの親密さが高いほどうつが低く、密だが親密でないネットワークは孤独が強かった。パンデミック前からの接触の減少は、特に若い人でウェルビーイングの低下と関連した（抄録）。係数や信頼区間は未確認。", "p6": "未確認（抄録に限界の記述なし、本文を入手できず）。解釈：参加者の88%が女性で、結果は関連の記述にとどまり、因果の主張は抄録にない。", "fun": "コロナ禍で会えなくなったとき、人間関係の「かたち」と「親しさ」のどちらが心を守るのか、を調べた研究です。友だち同士がよくつながっていても、一人ひとりとの親しさが浅いネットワークは孤独が強く、親しさが高いほどうつは低くなっていました。若い人ほど、コロナ前より接触が減ったことと心の健康の悪化が結びついていました。", "unverified": "本文を入手できず、うつ・孤独の尺度、統制変数、効果量と信頼区間、脱落・欠測の扱い、年齢区分の定義は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "不正を経験した投信が保有先の開示を改善させる", "title": "Mutual Funds' Exposure to Accounting Fraud and their Influence on Corporate Disclosure", "url": "https://doi.org/10.2139/ssrn.7682935", "authors": "Gjergji Cici ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Cici, G., Masli, A., & Xi, Y. (2026). Mutual Funds’ Exposure to Accounting Fraud and their Influence on Corporate Disclosure. https://doi.org/10.2139/ssrn.7682935", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "不正を経験した投資信託が、他の保有企業の自発的な情報開示の質を高めるよう働きかけることを、所有構造から示した。", "p3": "保有企業の1つで不正が起きた投信を介した「不正ショックへの曝露」を各企業で測り、その大きさと自発的開示の成果の関係を調べた。操作変数分析を含む複数の検定で、影響によるという解釈を支える（抄録）。", "p5": "不正ショックへの曝露が大きい企業ほど自発的開示の成果が良い。改善は、過去に財務報告の弱さがあった企業と、投信の所在地に近い企業で大きく、アナリストの共通カバレッジや広いガバナンス活動では説明できないとされる（抄録）。", "fun": "友だちの家で火事が起きたら、自分の家の防火を見直すのは自然ですよね。同じように、投資信託は保有先の1社で不正を経験すると、他の保有先にも「ちゃんと情報を出して」と求めるようになる、という話です。不正の影響が思わぬ形で別の会社の透明性を高めるのが面白い点です。", "unverified": "本文は読めておらず、操作変数の詳細・標本・効果の大きさは未確認。"}}, {"id": "pr17", "rank": 17, "headline": "強化学習で駅周辺の土地利用と容積率を最適化", "title": "Transit-Oriented Land Use Planning Using Deep Reinforcement Learning", "url": "https://arxiv.org/abs/2611.10281", "authors": "Bo Yang ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Yang, B., Liang, Y., Zhao, Z., Ding, F., Zheng, Y., Wang, S., & Zhao, J. (2026). Transit-Oriented Land Use Planning Using Deep Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10281", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "駅周辺の土地利用の種類と容積率（FAR）を、計画者が決めた優先順位のもとで自動的に最適化する枠組みDRL4TODができた。", "p3": "土地区画・道路・駅の空間的な依存をグラフニューラルネットワークで捉え、深層強化学習で各区画に土地利用と容積率を割り当てる。密度・多様性・輸送容量の利用を同時に最適化し、再整備費を抑える（抄録）。", "p5": "上海の実在の2つの駅勢圏で、規則ベースの手法と遺伝的アルゴリズムを一貫して上回り、より低い再整備費でTODの成果を得た。目的の重みを変えて、費用重視などにも調整できる（抄録）。", "fun": "駅の近くに何をどれだけの高さで建てるかは組み合わせが膨大で、人間の勘だけでは最適な案を探しきれません。この研究は、ゲームを解くAIのように試行錯誤で「良い街の形」を探し、しかも1つの答えではなく、費用重視・密度重視など目的に応じた複数の案を出します。街づくりの検討にAIが選択肢を並べてくれるのが面白い点です。", "unverified": "本文未読のため、評価指標の定義、比較手法の設定、実験の詳細は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "オープンデータでTOD駅周辺を点検するNPPE枠組み", "title": "Node, place, people and ecology: an open-data framework and tool for screening transit-oriented development along an Indian metro corridor", "url": "https://doi.org/10.21203/rs.3.rs-11201353/v1", "authors": "D. Sai Kiran Varma ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Varma, D. S. K., & Rankavat, S. (2026). Node, place, people and ecology: an open-data framework and tool for screening transit-oriented development along an Indian metro corridor. https://doi.org/10.21203/rs.3.rs-11201353/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "オープンデータだけで、鉄道駅周辺のTOD（公共交通指向開発）の準備度を4つの次元（ノード・場所・人・生態）で点検する枠組みNPPEと、そのブラウザツールができた。", "p3": "7つのオープンデータ指標から4次元を作り、各点数にAtkinson型のバランス比と制約となる次元を組み合わせる。OpenStreetMapとCopernicusの空気質データを使うオープンソースのツールTODSphereで実装し、ノイダ地下鉄アクア線の21駅に適用した（抄録）。", "p5": "NPPEの順位は従来のノード・場所の階層と強く関連した（ρ=0.89）が、8駅は3段階以上順位が動いた。6駅の準備度は1つの次元だけに依存し、制約次元は13駅で人、6駅で生態（道路沿いの曝露）。駅の順序は手法・半径・重み・季節を変えても安定した（W=0.97）（抄録）。", "fun": "駅の周りの街づくりを評価するとき、従来は「駅の便利さ」と「土地の使われ方」しか見ていませんでした。この研究は「住民が日常のサービスに行けるか」「道路沿いの空気は汚れていないか」まで加えて、点数の平均だけでなく「1つの弱点だけで助かっている駅」を見つけます。1科目だけ高い成績表の盲点を暴くような発想が面白い点です。", "unverified": "本文未読のため、7指標の具体的な定義、バランス比の式、重みの設定は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "ストリートビューで空き家を判定、対象家屋の特定つき", "title": "Developing a Street View Imagery Processing Pipeline for Building-Level Vacant House Assessment", "url": "https://arxiv.org/abs/2611.11893", "authors": "Dongjoon Park ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Park, D., Lee, S., Kim, J. W., & Kang, B. (2026). Developing a Street View Imagery Processing Pipeline for Building-Level Vacant House Assessment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11893", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ストリートビュー画像で空き家を判定するとき、画像が使えるかと、写っている家が対象かどうかを明示して確かめられる処理の流れができた。", "p3": "画像の構図と行政区に合わせて使えない画像を選別する適合度フィルタと、カメラのメタデータと区画境界から対象の家を特定する整合処理を組み合わせる。建物の輪郭や追加の学習は要らない。韓国の戸建1,609区画の10,311枚で適用した（抄録）。", "p5": "整合は人手の判定と85.6%一致し（最良の単純規則は79.8%）、空き家分類のAUROCは0.684から0.719に上がった。ただし同じ画像で別の家を指しても0.709となり、Grad-CAMでもモデルが対象の家以外を見ていることが多かった（抄録）。", "fun": "空き家をAIが見分けるとき、点数が上がったから正しく見ているとは限りません。この研究では、わざと隣の家を指しても点数がほぼ同じで、AIは対象の家以外を見ていることも多いと分かりました。当たっているように見える答えの中身を点検する姿勢が面白い点です。", "unverified": "本文未読のため、フィルタの具体的な基準やデータの詳細は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "財務情報と株価情報のどちらが信用リスクに効くか", "title": "Equity Market Signals and Credit Risk Measurement in China", "url": "https://doi.org/10.2139/ssrn.7682070", "authors": "Guiyuan Ma", "venue": "SSRN", "date": "2026-11-10", "apa": "Ma, G. (2026). Equity Market Signals and Credit Risk Measurement in China. https://doi.org/10.2139/ssrn.7682070", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "会計情報と株式市場の情報のどちらが信用リスクの測定に効くかは、リスク指標の作り方と予測時点で入手できる情報で変わることが示された。", "p3": "2015〜2025年の中国の上場企業で、Merton型のモデル由来の債務不履行確率（EDF）の裾を対象に、情報の組合せを比べる。会計年度基準と実際の報告公表日基準を区別し、年内の順位づけと年をまたぐ点数比較を分けた（抄録）。", "p5": "会計年度基準では市場リスクが年内の識別を改善するが、全体（プール）の識別は悪化する。報告日基準では市場リスク変数を加えると年内・プールとも識別が悪化する。終値の固着はリスクへの再突入と探索的に関連するが、一貫した追加の予測力はない（抄録）。", "fun": "天気予報で昨日の気温と今日の空模様のどちらが役に立つかは、予報を出す時刻に何が分かっているかで変わります。この研究も、決算の公表日という「いつ分かるか」をそろえるだけで、株価情報が役に立つかどうかの結論が逆転しうることを示します。情報を入手できる時点を厳密に扱う大切さが面白い点です。", "unverified": "本文未読のため、識別力の指標（AUCなど）や効果の大きさは未確認。"}}, {"id": "pr21", "rank": 21, "headline": "民間の詐欺が自治体債の利回りスプレッドを広げる", "title": "The Price of Distrust: Private Financial Fraud and Public Finance Externalities", "url": "https://doi.org/10.2139/ssrn.7687359", "authors": "Mark H. Liu ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Liu, M. H., Wu, Q., & Zhang, T. (2026). The Price of Distrust: Private Financial Fraud and Public Finance Externalities. https://doi.org/10.2139/ssrn.7687359", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ポンジ詐欺のような民間の金融不正が報じられると、無関係な自治体債の資金調達コストまで上がる、という波及を示した。", "p3": "2009〜2022年の米国50州の地方債の発行データで、公に報じられたポンジ詐欺の件数と、翌年の発行利回りスプレッドの関係を調べる。SECの地域事務所の執行の生産性と地理的な近さを使った操作変数の推定も加える（抄録）。", "p5": "報告件数が1標準偏差増えると、スプレッドは2.64ベーシスポイント広がる（信用格付けが1段階悪いときの差の約61%、標本平均スプレッドの10.60%）。個人向けの市場区分、低格付け、経済政策の不確実性が高い州で強く、社会関係資本が大きい州や2014〜2016年のFTCの詐欺教育キャンペーン後は弱い（抄録）。", "fun": "遠くの町で起きた詐欺のニュースで、自分の町の借金の利息まで少し高くなる、という話です。人は「だまされたかも」という警戒を、無関係な相手にまで広げてしまうと考えられます。信頼が壊れると、その被害が社会全体のコストとして広がるのが面白い点です。", "unverified": "本文未読のため、スプレッドの定義、操作変数の第1段階の強さ、頑健性検査は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "SECの半期開示容認案を冷静に評価した論考", "title": "On the SEC's Proposal to Permit Semiannual Financial Reporting", "url": "https://doi.org/10.2139/ssrn.7681825", "authors": "Ray Ball ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Ball, R., & Sutherland, A. (2026). On the SEC’s Proposal to Permit Semiannual Financial Reporting. https://doi.org/10.2139/ssrn.7681825", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "四半期報告を半期報告に選べるようにするSECの提案を、強い反対意見に流されず評価し、影響は限定的で穏当だという見方を示した。", "p3": "提案の是非を、コメントレターの強い反対と対比しながら論点ごとに検討する評価論考で、新しい実証分析や推定モデルの記載は抄録にはない（抄録）。", "p5": "企業はこの選択肢を与えられても賢明に反応し、多くは10-Qの提出を続けるか、決算発表などの負担の小さい適時開示で代替するだろうと予想する。半期報告だけで不正・インサイダー取引・IPOが大きく増えるという主張には懐疑的で、提案は控えめだが歓迎できる負担軽減だと評価する（抄録）。", "fun": "ルールの変更に大反対の声が集まるとき、本当に悪いことが起きるのかを冷静に見直すのがこの論考です。選べるようにしても、多くの会社は今まで通りか別の方法で情報を出し続けるはずだ、と予想します。多数派の感情的な反応と、起こりそうな現実とのズレを考える材料になるのが面白い点です。", "unverified": "抄録のみの評価論考で、根拠とされる先行研究や数値は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "投信の文章の独自性は手数料に、保有の独自性は成績に", "title": "From Words to Portfolios: Disentangling Narrative and Reality in Mutual Fund Differentiation", "url": "https://doi.org/10.2139/ssrn.7682021", "authors": "Ge Yu", "venue": "SSRN", "date": "2026-11-09", "apa": "Yu, G. (2026). From Words to Portfolios: Disentangling Narrative and Reality in Mutual Fund Differentiation. https://doi.org/10.2139/ssrn.7682021", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "投資信託の違いを、保有銘柄の独自性と目論見書の文章の独自性という2つの尺度に分けて測り、手数料・資金流入・将来の成績への意味が別々であることを示した。", "p3": "トランスフォーマーに基づくポートフォリオ埋め込みモデルで保有銘柄の独自性を、事前学習した大規模言語モデルによる目論見書の埋め込みで文章の独自性を測る。2つの尺度と、手数料・資金流入・将来の成績との関係を調べた（抄録）。", "p5": "2つの尺度の相関は弱く、保有の独自性が文章の独自性と一致するとは限らない。目論見書の独自性は高い手数料と関連し、過去の成績が良いと資金流入も大きい。保有の独自性は、過去の実績が強い投信で将来のアルファを予測する（抄録）。", "fun": "「他にない特別なファンドです」という宣伝文句が、実際の中身も特別なのか、言葉だけ特別なのかを、この研究はAIで別々に測ります。結果は、言葉の特別さは高い手数料と、中身の特別さは将来の成績と結びつくというもの。宣伝の言葉と実体のずれを数字で切り分けられるのが面白い点です。", "unverified": "本文未読のため、埋め込みの作り方、標本期間、効果の大きさは未確認。"}}, {"id": "pr24", "rank": 24, "headline": "投資と内部資金の自由度で測る新しい資金制約指標", "title": "A New Financial Constraints Index F. Javier Sánchez-Vidal", "url": "https://doi.org/10.2139/ssrn.7681790", "authors": "Javier Sánchez Vidal", "venue": "SSRN", "date": "2026-11-09", "apa": "Sánchez Vidal, J. (2026). A New Financial Constraints Index F. Javier Sánchez-Vidal. https://doi.org/10.2139/ssrn.7681790", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "投資が内部の資金にどれだけ縛られないかを直接測る、新しい資金制約の指標ICFFが提案された。", "p3": "投資キャッシュフロー感応度の推定は会計上の半恒等式の問題で歪むという先行研究に基づき、内部資金とは独立に投資できる程度を直接測る指標を作る。スペインの中小企業の均衡パネルで、ICFS・WW・SA指数などの既存指標と比べる（抄録）。", "p5": "ICFFは企業の資金制約の状態と強く関連し、既存指標と同等以上に機能し、従来の指標を加えても情報を持つ。会計上の半恒等式の問題が、ICFSの文献の長年の不整合を説明しうることも示唆された（抄録）。", "fun": "お金に困っている会社を見分けるには、手持ちの現金が増えたら投資も増えるかを見るのが昔からのやり方でした。でも会計の数字には、どう動かしても自動的に成り立つ関係があって、その見方が歪むことがあると指摘します。会計のしくみそのものが統計の落とし穴になる、というのが面白い点です。", "unverified": "本文未読のため、指標の定義式、標本の規模、数値結果は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "ペルソナ付きLLM集団で競合キャンペーンの効果を分離", "title": "Competing Influence in LLM Populations: Budget Timing and Baseline Drift", "url": "https://arxiv.org/abs/2611.11867", "authors": "Mehwish Nasim ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Nasim, M., & Fay, N. (2026). Competing Influence in LLM Populations: Budget Timing and Baseline Drift (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11867", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントの集団で、競合する2つのキャンペーンの効果を、何もしない場合の自然な変化（ドリフト）と切り分けて測ると、見かけの効果の一部はドリフトだと分かる。", "p3": "ペルソナを与えたLLMエージェントの網で、意見を自然言語でやりとりして改める。賛成側と反対側に同じ配信予算を与え、別の測定用プローブで意見を測る。8つの主張で単独・競合の条件を、キャンペーンなしの対照と比べ、早期・持続・後期の支出の9通りも評価した（抄録）。", "p5": "何もしなくても意見が動くドリフトは主張ごとに大きく違い、見かけの効果のかなりの割合を占める場合がある。ドリフトを除くと、効果の向きはキャンペーン側の役割より主張の証拠上の位置づけに沿う。何もしない集団も意見の多様性を失う。結果は相手の支出スケジュールに依存し、純粋戦略の均衡がない（抄録）。", "fun": "SNSで意見が変わったとき、広告のおかげなのか、放っておいても変わったのかを区別するのは、人間の調査でも難しいことです。AIだけの町では、何もしなくても意見がだんだんそろっていくことが分かり、その自然な流れを差し引かないと広告の効果を勘違いします。さらに広告役のAIは、証拠と合わない立場だと主張を貫かないこともあるのが面白い点です。", "unverified": "本文未読のため、モデル名・エージェント数・統計的な有意性は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "消費者の心の状態を更新するEC利用者シミュレータ", "title": "ShopMind: A Mental World Model for Personalized and Realistic E-commerce User Simulation", "url": "https://arxiv.org/abs/2611.11897", "authors": "Peixuan Hou ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Hou, P., Chen, B., He, L., Xu, J., Ma, X., & Song, G. (2026). ShopMind: A Mental World Model for Personalized and Realistic E-commerce User Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11897", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "消費者の心の状態（信念・不確実性・意図）が買い物の情報の解釈でどう更新されるかを組み込んだ、より個人らしく現実的なEC利用者シミュレータShopMindができた。", "p3": "行動を直接予測せず、Theory of Mindに基づき、消費者が情報をどう解釈し心の状態がどう進むかを世界モデルとして持つ。ShopMindが作る行動と心の状態の組から、観察できる行動から潜在的な心の状態を推定するMSRモデルも学習する（抄録）。", "p5": "最も強い代替手法に比べて、個別性が18.0%、行動の現実性が19.6%向上した。MSRは消費価値の測定とCTR予測の性能も向上させた（抄録）。", "fun": "ネットで買い物するときの人の気持ちは、見ただけでは分かりません。この研究のAIは「この人はこの情報をこう受け取り、気持ちがこう変わったから、次にこう動く」という心の動きを先に作ってから行動を予測します。人の行動の裏にある心のモデルをAIに持たせるのが面白い点です。", "unverified": "本文未読のため、比較対象の手法、データセット、評価指標の定義は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "LLM固有の性格傾向は指示でも上書きされにくい", "title": "More Than Just Style: Benchmarking Personality Influence in Large Language Models", "url": "https://arxiv.org/abs/2611.12392", "authors": "Yuhao Liu ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Liu, Y., Wang, M., Chen, X., & Liu, L. (2026). More Than Just Style: Benchmarking Personality Influence in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12392", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMが持つ性格のような傾向を、能力や指示の効果から分けて測る評価の枠組みSPACEができた。", "p3": "性格の検証、能力の評価、階層的な状況課題のデータセットと、制御した評価手順を組み合わせる。指示の条件を比較して、性格の影響を、測定した能力の変化や直前の指示の効果から区別する（抄録）。", "p5": "プロンプトで生成の文体は変えられるが、モデルの内部の性格傾向は持続し、反対の指示でも容易に上書きされない。この傾向はタスクの成績にも観察できる影響を与える（抄録）。", "fun": "「明るく話して」と頼めば、AIは文体を明るくします。でもこの研究は、AIの中には頼んでも変わりにくいもともとのクセがあり、それが答えの出来にも影響すると言います。人間の性格のように、AIにも簡単には上書きできない傾向があるかもしれないのが面白い点です。", "unverified": "本文未読のため、評価したモデルの種類、データセットの規模、数値結果は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "温度0で再現可能なABM-LLM歴史シミュレーション", "title": "Deterministic Narrative Gravity: Bridging Theory of Mind and Historical Simulation through ABM-LLM Architectures", "url": "https://arxiv.org/abs/2611.11212", "authors": "Alicia Colmenero-Fern\\'andez ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Colmenero-Fernández, A., & Alvarado, L. O. (2026). Deterministic Narrative Gravity: Bridging Theory of Mind and Historical Simulation through ABM-LLM Architectures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11212", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMの確率的なふるまいで再現できなかった歴史の社会シミュレーションを、温度0・固定環境で完全に再現できるABM-LLMの枠組みにした。", "p3": "LLMをエージェントベースモデル（ABM）の流れに結び、心の理論と認知考古学に基づく状態を毎ターン与える。ローカルの固定環境で温度0、呼び出しごとのモデル再読込で動かし、SHA-256ハッシュで成果物が同一であることを確かめた。4B〜31Bの7設定を足場なしの基準と比べた（抄録）。", "p5": "8B以下の小さなモデルは文脈容量の過負荷で反復する対話に陥る。12B以上ではABMの足場が単調な応答を崩し、シーンの早すぎる終結に抗して終端の物語ベクトルが開いたまま保たれた（全体で12/21、公式の12B以上の設定では9/9）。足場なしでは0/21（抄録）。", "fun": "AIに同じ質問をしても毎回少しずつ違う答えが返るので、実験をもう一度やって同じ結果になるかを確かめるのは困難です。この研究は、設定を固定してAIの出力まで1文字も違わずに再現できることを、指紋のようなハッシュ値で示しました。さらに中くらいの大きさのAIになると、物語を勝手に広げて続けることも分かるのが面白い点です。", "unverified": "本文未読のため、評価指標（物語ベクトル）の定義と、7設定の具体的な構成は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "LLM集団では誰が誰を観察するかで成果が変わる", "title": "Steering Emergent Behavior in Multi-Agent LLM Systems via Information Networks", "url": "https://arxiv.org/abs/2611.11714", "authors": "Sepehr Ilami ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Ilami, S., & Heydari, B. (2026). Steering Emergent Behavior in Multi-Agent LLM Systems via Information Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11714", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントの集団では、誰が誰を観察できるか（情報ネットワーク）を設計すると、情報を共有するほど良いとは限らないと分かった。", "p3": "10体の同一のLLMが反復の集団意思決定ゲームを行い、既定では前ラウンドの匿名の要約だけを見る。管理者が固定の予算で、仲間の過去の行動を見せる有向の観察リンクを足す。1,080エピソード・6つのゲーム（協調・反協調・社会的ジレンマ・探索）で、情報の量と誰が誰を見るかを調べた（抄録）。", "p5": "情報の価値は、個人の行動と集団の目的が一致するかに依存する。一致するなら仲間の情報は有益か中立だが、ただ乗りや混雑の外部性があると有害な行動を増幅し、公共財ゲームでは情報なしが最良。固定予算では有害な結合のときだけ配線が重要で、部分集団が有害な行動を固定化する「バーベル」型が最悪（抄録）。", "fun": "「情報は多いほどみんなが賢くなる」とは限りません。AIたちに互いの行動を見せると、良い行動だけでなく悪い行動もうつり、ただ乗りが得な場面では見せない方が成果が良くなりました。しかも仲良しグループに分かれた形が、人間の理論の直観とは逆に最悪でした。全部オープンにする設計が良いとは限らないのが面白い点です。", "unverified": "本文未読のため、使ったLLMの種類、ゲームごとの効果の大きさと統計的な確かさは未確認。抄録は、結果を1つの制御されたLLM集団内の規則性とし、モデルによらない法則とは述べていない。"}}, {"id": "pr30", "rank": 30, "headline": "価値プロファイルに合わせてLLMの応答を個別に調整", "title": "Personalized Alignment of Language Models with Human Value Profiles", "url": "https://arxiv.org/abs/2611.09919", "authors": "Rashon Poole ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Poole, R., & Jahanbakhsh, F. (2026). Personalized Alignment of Language Models with Human Value Profiles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09919", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "個人を人口統計やペルソナではなく安定した価値プロファイルで表し、質問ごとに関連する価値だけを使ってLLMの応答を個別に合わせる枠組みができた。", "p3": "ユーザーをSchwartzの価値プロファイルで表し、各質問に関連する価値を選んでから、ターゲット化したプロンプト・活性の誘導・LoRA-DPOを適用する。1,501の価値の緊張場面のデータを作り、全国代表の調査から抽出した152の価値プロファイルで評価した（抄録）。", "p5": "価値で絞った方法は、個別化なし・人口統計・全プロファイルを入れる基準を上回り、利得は単なる情報の提示でなく質問ごとの価値への絞り込みから来る。誘導の効果はユーザーによって均一でなく、価値空間のどこに優先順位があるかで変わる。ターゲット化プロンプトに活性誘導かLoRA-DPOを組み合わせると、論理の質を保ちつつ最も個別化が強い（抄録）。", "fun": "同じ「人に合わせたアドバイス」でも、年齢や性別でなく、その人が何を大切にするか（例：自由か安全か）に合わせるほうが良い、という発想です。しかも全部の価値を渡すより、その質問に関係する価値だけを渡す方が効きます。たくさん伝えるより、的を絞って伝えるほうが伝わるのが面白い点です。", "unverified": "本文未読のため、評価指標と比較する基準の詳細、モデルの種類は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "ペルソナの一般化はモデルをまたいで直線関係になる", "title": "Is Persona Generalization Predictable?", "url": "https://arxiv.org/abs/2611.12864", "authors": "Olina Mukherjee ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Mukherjee, O., Goel, A., Raghunathan, A., & Springer, J. M. (2026). Is Persona Generalization Predictable? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12864", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ある領域での微調整が他の領域の振る舞いを変える「ペルソナの一般化」が、確率の目盛りで直線の関係に乗り、予測と制御ができることを示した。", "p3": "微調整のハイパーパラメータを変えながら、領域内と領域外のペルソナの出現率を比べる。出現率はprobit（正規分布の累積分布の逆関数）の尺度でほぼ直線になり、その関係がQwenやLlamaなどのモデル族・規模をまたいで共通だという「on-the-line」現象を見いだした（抄録）。", "p5": "学習率・重み減衰・学習期間のように訓練可能なパラメータの集合を変えない選択は、モデルを同じ直線上で動かし、主に領域内の学習を弱めて転移を減らす。どの層を微調整するかを変えると傾きが変わり、危険な行動では後の層だけの微調整で傾きが浅くなり、領域内の学習を保ったまま領域外の不整合が減る（抄録）。", "fun": "AIにある仕事のために性格づけ（微調整）をすると、関係のない場面まで性格がうつってしまうことがあります。この研究では、そのうつり具合が、モデルの種類や大きさが違っても同じ直線の上に並ぶことを見つけました。バラバラに見えた奇妙な現象が、1本の線で説明できるのが面白い点です。", "unverified": "本文未読のため、直線のあてはまりの程度、対象としたペルソナの種類、モデルの規模は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "バックエンド交換でエージェントの人格が変わるか", "title": "Towards Identity-Preserving LLM Agents under Model Transition", "url": "https://arxiv.org/abs/2611.10628", "authors": "Yihuang Kang ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Kang, Y., Huang, P.-C., Ku, C.-T., Hsu, C., Lee, P.-J., & Cheng, I.-L. (2026). Towards Identity-Preserving LLM Agents under Model Transition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10628", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントの土台のモデルを入れ替えても、同じペルソナ・記憶・規則を載せれば同じように振る舞うとは限らないことを、行動の水準で示した。", "p3": "12の規制領域で、3つのオープンウェイトモデルを使い、5,760回のコンプライアンス試験を行う。エージェントの外部状態を同一に保ったまま、モデルの組合せによる行動の漂流を調べた（抄録）。", "p5": "組合せによっては行動が有意に変わり、変わらないものもある。モデルは全て方針の遵守を言明するが、圧力下の実際の決定は違い、同じ外部状態でも最も遵守的なモデルが入れ替わる（ある基盤で大きな正の効果、他の2つでは無視できる）。言葉による確認では漂流が見えない（抄録）。", "fun": "エージェントに「あなたはこういう人です」と設定を書いておけば、中身のAIを新しいものに替えても同じ人格が続く、と思いがちです。でも検証すると、全員が「規則は守ります」と言うのに、追い込まれたときの実際の判断は違いました。言葉で確認しただけでは安心できず、行動で試す必要があるのが面白い点です。", "unverified": "本文未読のため、評価した3つのモデルの名前、判定の方法、統計的な検定の詳細は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "41のLLMが臨床家・家族・本人に勧める介入を比較", "title": "Curbside Chatbots: Auditing the Mental Health Interventions Large Language Models Recommend to Clinicians, Caregivers, and Patients", "url": "https://arxiv.org/abs/2611.12814", "authors": "Matthew Flathers ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Flathers, M., Noorily, J., Nguyen, P. A., Kalinich, M., Fallah, M., Lisowski, V., Shi, C., Bodner, R. M., Simms, A., Hete, M., Chen, M., Powell, S. K., Williamson, T., Ospina-Pinillos, L., Notsu, H., Herpertz, J., & Torous, J. (2026). Curbside Chatbots: Auditing the Mental Health Interventions Large Language Models Recommend to Clinicians, Caregivers, and Patients (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12814", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "同じ臨床情報でも、臨床家・介護者・本人のどの立場から語られるかで、LLMが勧める精神保健の介入が変わることを、41のモデルで監査した。", "p3": "19の症例ビネットと5つの質問で、41のLLMの自由記述の応答35,055件を集め、妥当性を確かめた判定器で、挙げられた介入をすべて抽出した。同じ症例について、29のモデルに選択肢の一覧を7段階で評価させた（抄録）。", "p5": "モデルは概ね自分が高く評価する介入を勧めるが、勧め方は立場で違い、臨床家には相談型の応答、一般の利用者には曖昧で簡略な助言を出すモデルが多い。特定の介入の種類を尋ねると、自分が負と評価した選択肢を最初の選択として挙げることが多く、通常は条件がつく（抄録）。", "fun": "同じ相談でも、お医者さんが話すのと、家族が話すのと、本人が話すのとで、AIの答え方が変わっていました。専門家には専門的に、一般の人には無難で簡単に、という使い分けです。誰が聞くかでAIの助言の中身が変わるので、身近な人の相談にAIを使うときに知っておきたい点が面白いです。", "unverified": "本文未読のため、提示した症例の内容、判定器の精度、モデルの一覧は未確認。装置・コード・全コーパスは掲載時に公開する予定とされる。"}}, {"id": "pr34", "rank": 34, "headline": "複数LLMで競合仮説を比べる監査可能な証拠統合", "title": "Auditable Multi-LLM Evidence Synthesis for Contested Heritage Origins: Comparing Competing Hypotheses in the Turpan Karez Debate", "url": "https://doi.org/10.21203/rs.3.rs-11469328/v1", "authors": "Xiangping Qi ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Qi, X., Malik, M. I., Wang, Z., Zhang, J., Wang, S., Gan, H., Li, K., & Shi, Y. (2026). Auditable Multi-LLM Evidence Synthesis for Contested Heritage Origins: Comparing Competing Hypotheses in the Turpan Karez Debate. https://doi.org/10.21203/rs.3.rs-11469328/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "論争が続くトルファンのカレーズ（地下水路）の起源という歴史の問いを、複数のLLMで証拠を並行抽出して競合3仮説を点数化する、追跡・検証できる枠組みで評価した。", "p3": "多言語の文献を段階的に検索し、RAGで候補の箇所を特定し、3つのLLM（DeepSeek V4 Pro、GLM-5.2、Qwen3.7-Plus）が証拠候補を並行に出す。原文に拘束した検証、証拠のファミリーへの統合、頑健性分析を行う。275本の全文から141のテキスト断片を取得し、727の証拠記録を作った（抄録）。", "p5": "証拠の十分性・正味の証拠バランス・学界の合意・証拠タイプの多様性を統合した点数は、中央アジア伝来が0.5735、地元発明が0.5125、中原伝来が0.3321。ファミリー単位のブートストラップ10,000回のうち82.6%で中央アジア伝来が1位だった（抄録）。", "fun": "「この地下水路の技術はどこから来たのか」という論争を、人間の研究者ではなく、複数のAIに論文を読ませて証拠を集めさせ、仮説ごとに点数をつけて決着の度合いを測る試みです。AIが拾った証拠をあとから原文で確かめられるようにして、AIの勝手な思い込みを防ぐ仕組みが面白い点です。", "unverified": "本文未読のため、点数の算出式、各LLMの寄与の違い、対象文献の範囲は未確認。決め手となる証拠がない状況での探索的な結果として読む必要がある。"}}, {"id": "pr35", "rank": 35, "headline": "POD・SPOD・ガウス過程でパラメトリックな縮約モデル", "title": "Parametric spatio-temporal reduced-order modelling via Spectral Proper Orthogonal Decomposition and Gaussian Process Regression", "url": "https://arxiv.org/abs/2611.12028", "authors": "Guglielmo Padula ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Padula, G., Colanera, A., & Rozza, G. (2026). Parametric spatio-temporal reduced-order modelling via Spectral Proper Orthogonal Decomposition and Gaussian Process Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12028", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "パラメータや予測期間が訓練範囲の外でも使える、時間変化まで含む非侵入型のパラメトリックな縮約モデルSPOD-GPRができた。", "p3": "POD（固有直交分解）でまず状態を低次元に射影し、軌跡を窓に分けて周波数領域に移し、エネルギーの大きい周波数だけ残す。その周波数ごとにSPODを行い、時間的にまとまったモードと係数を得る。POD・SPOD基底のパラメータ依存はGrassmann多様体の局所チャート上でガウス過程回帰（GPR）により表す（抄録）。", "p5": "4つの例（2次元の異方性Kuramoto–Sivashinsky方程式の2つの領域、レイノルズ数をパラメータとする円柱まわりの流れ、楕円障害物まわりの流れ）の全てで、POD-GPRの基準より正規化平均絶対誤差が小さく、予測の不確かさの較正も改善した。特に流れでは、POD-GPRは過信が深刻だった（抄録）。", "fun": "複雑な流れの計算は時間がかかるので、本物の計算を何度も回さずに、似た結果をすばやく出す「近道モデル」を作ります。この研究は、流れの時間的な波のリズム（周波数）に注目して近道を作り、さらに「どれだけ自信がないか」まで正直に出します。従来法は自信満々なのに外れることがあったのが面白い点です。", "unverified": "本文未読のため、誤差の具体的な数値、計算コストの比較、基底の次元の選び方は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "高価なモデル較正の不確実性をラプラス近似で安く評価", "title": "Laplace approximation of the parameter posterior with embedded error for efficient uncertainty quantification of expensive model calibrations", "url": "https://arxiv.org/abs/2611.10210", "authors": "Reese E. Jones ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Jones, R. E., Karlson, K. N., Kury, M. W., Khalil, M., & Tuminaro, R. S. (2026). Laplace approximation of the parameter posterior with embedded error for efficient uncertainty quantification of expensive model calibrations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10210", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "高価なモデルの最小二乗の較正のあとで、安価に近似的な不確実性評価を追加するラプラス近似の方法が示された。", "p3": "観測の独立な雑音とパラメータの分散を、Sargsyan・Najm・Ghanem（2015）の組込み誤差の扱いに沿って取り込む。ラプラス近似とベイズ較正の関係を理論として整え、ブラックボックス変分推論とコストと忠実度で比べる（抄録）。", "p5": "抄録には、固体材料モデルの実際の較正で方法を示したとあるが、数値結果は書かれていない（抄録）。", "fun": "設計に使う計算モデルは1回動かすだけで時間がかかるので、何万回も試す普通の不確実性の計算（MCMC）はできません。この研究は、1回の「ベストな当てはめ」を求めたあとに、少ない追加計算で「どのくらい自信がないか」の見積りをつける近道を考えました。高価な計算の結果に、安く誤差の幅をつけられるのが面白い点です。", "unverified": "本文未読のため、近似の精度の定量的な結果と、変分推論との比較の数値は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "物理拘束つきSIRENで超音波ガイド波の損傷を同定", "title": "Physics-Informed Sinusoidal Representation Networks for Damage Identification in Ultrasonic Guided Wave Structural Health Monitoring", "url": "https://arxiv.org/abs/2611.12299", "authors": "Lukas Jilke ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Jilke, L., Wasle, C., Hosters, N., Raddatz, F., Behr, M., & Wende, G. (2026). Physics-Informed Sinusoidal Representation Networks for Damage Identification in Ultrasonic Guided Wave Structural Health Monitoring (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12299", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "超音波ガイド波の損傷同定で、物理法則を組み込んだPI-SIRENにより、疎な計測から板の波動場を再構成し、切欠きの位置を板の対角の1%の誤差で特定できた。", "p3": "周期活性化関数をもつSIREN（高周波を表しやすい）に、Mindlin–Reissner板理論の支配方程式を損失に埋め込み、周波数領域で時間離散化なしに超音波の波動場を再構成する。パラメータはAdam、残差適応リファインメント（RAR）、準ニュートン法L-BFGSの3段階で最適化する（抄録）。", "p5": "数値・実験の評価で、疎なデータから物理的に整合した基準を得る効率的な代理モデルとして働き、損傷同定の流れに組み込むと、疎な実験計測からフライス加工した切欠きの位置を、板の対角の1%の誤差で検出・特定した。データ駆動の基準や、ハイパボリックタンジェント活性（フーリエ特徴あり・なし）のMLPは、再構成誤差が大きく損傷を特定できなかった（抄録）。", "fun": "普通のAIは、ゆっくり変わる波の形は得意でも、細かく速く振動する波は苦手です（スペクトルバイアス）。この研究は、サイン波のような周期的な活性化関数と、板の振動の物理法則を組み合わせて、センサが少なくても板の中の波を描き出し、傷の場所を当てました。物理を教えたAIが、データだけのAIが見落とす傷を見つけるのが面白い点です。", "unverified": "本文未読のため、実験の板の寸法、センサの配置、再構成誤差の定量値は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "速度状態依存摩擦の断層すべりを流体注入と連成", "title": "VEM-bubble discretisation and iterative coupling algorithm for a fluid induced seismicity model with rate-and-state friction", "url": "https://arxiv.org/abs/2611.12462", "authors": "El Hadi Zerga ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Zerga, E. H., Masson, R., Ampuero, J.-P., & Romanet, P. (2026). VEM-bubble discretisation and iterative coupling algorithm for a fluid induced seismicity model with rate-and-state friction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12462", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "流体注入で起こる誘発地震のモデル（多孔質の流れ・ポロ弾性・速度状態依存摩擦のすべり）を連成して解く離散化と反復解法が示され、その収束が証明された。", "p3": "母岩と断層網の単相Darcy流れ、準静的なポロ弾性応答、放射減衰で安定化した速度状態依存摩擦（準動的）の断層すべりを連成する。接触問題はバブル安定化したVirtual Element Method、流れはハイブリッド有限体積で離散化し、時間は陰的で、Darcy流れ・摩擦接触・状態微分方程式を反復する連成アルゴリズムで解く（抄録）。", "p5": "メッシュ幅によらない時間刻みの小ささの仮定のもとで反復連成の縮小性を示し、不動点の収束と系の適切性を証明した。摩擦接触の問題は、速度状態依存摩擦則の局所的な非線形反転に基づく半滑らかNewton法と、ブロックGauss–Seidel前処理で解く（抄録）。", "fun": "地下に水などを注入すると、断層が滑って地震が起きることがあります。この研究は、水の流れ、岩の変形、断層の摩擦という3つの現象が互いに影響し合う様子を、順番に計算を繰り返す方法で解き、そのやり方が必ず収束することを数学で証明しました。地震を起こす連鎖を、確実に計算できる土台にするのが面白い点です。", "unverified": "本文未読のため、数値実験の結果（収束の速さ、計算例）は未確認。抄録は証明と解法の記述が中心。"}}, {"id": "pr39", "rank": 39, "headline": "解析増分で予報モデルの偏りを診断・補正する理論", "title": "Analysis increments for model bias diagnosis and correction: Theoretical foundations", "url": "https://arxiv.org/abs/2611.11162", "authors": "Eviatar Bach", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Bach, E. (2026). Analysis increments for model bias diagnosis and correction: Theoretical foundations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11162", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "データ同化の解析増分でモデルの偏りを診断・補正する、広く使われる方法に、初めて理論的な裏づけを与えた。", "p3": "まず、予報モデルに一定の偏りがあるKalmanフィルタで、平均した解析増分が何を測るかを示し、補正を繰り返すと観測を通して見える偏りがすべて除かれることを証明する。次に状態に依存する偏りへ拡張し、線形力学では各増分がフィルタの記憶の期間のモデル誤差を観測を通して記録することを使って、長期平均・似た条件での平均・平均なし（機械学習による補正）の意味を決める（抄録）。", "p5": "線形モデルの数値実験で理論が確かめられ、非線形のLorenz '96モデル（ニューラルネットで学習した補正を含む）でも主要な結論が引き継がれることが示唆された。線形の力学では、観測を通して見える偏りを除いたあとの残りは、どの方法でも同定できない（抄録）。", "fun": "天気予報のモデルには、くせ（偏り）があります。予報と、その後に観測で修正した値の差（解析増分）の平均でくせを直す方法は経験的に広く使われてきましたが、なぜうまくいくか、どこまで直せるかは理論的に分かっていませんでした。この研究は、観測からは見えない偏りは誰にも見つけられないという限界まで証明したのが面白い点です。", "unverified": "本文未読のため、証明の仮定の詳細と数値実験の設定は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "センサが疎な道路の交通状態をPINNで推定", "title": "When Does Physics Beat Data? Data-Efficient Traffic State Estimation with Amortized PINNs", "url": "https://arxiv.org/abs/2611.11881", "authors": "Anna Lazareva ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Lazareva, A., & Tarakanov, A. (2026). When Does Physics Beat Data? Data-Efficient Traffic State Estimation with Amortized PINNs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11881", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "センサが疎な道路でも、交通の保存則を事前情報として入れた物理情報つきニューラルネット（PINN）で、未計測地点の交通密度を推定できる。", "p3": "交通状態推定は、少数のセンサから未計測地点の密度を復元する課題。Lighthill–Whitham–Richards（LWR）保存則を物理的な事前情報として入れた償却型PINNを、4つの実回廊（NGSIM、I-80、PeMS04、PeMS08）で、古典的・深層のクリギングと比べる。1つの損失条件付きPINNで、回廊ごとの損失重みの探索も不要にした（抄録）。", "p5": "データ駆動の手法は観測したセンサに過学習するが、物理情報つき推定は未使用のセンサに一般化する。衝撃波の多い2回廊では、センサを外すほどデータ駆動の手法が崩れ、物理情報つきは緩やかに劣化し、85〜90%を外した条件で物理なしのネットワークに約26〜38%、90%でクリギングに約10〜21%の差をつけた。損失条件付きPINNは20点の探索と同等の性能を約5倍低いコストで得た（抄録）。", "fun": "道路の混み具合をすべての場所で測るにはセンサが足りません。そこで「車は急に消えたり増えたりしない」という当たり前の物理法則をAIに教えておくと、センサの9割近くを外しても推定が崩れにくいことが分かりました。データが少ないとき、物理の常識が頼りになるのが面白い点です。", "unverified": "本文未読のため、PINNの構造、評価指標（誤差の定義）、各回廊の数値は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "高齢者の自立居住の持続を識別境界つきで検証", "title": "Autonomy Persistence and Structural Isolation Among Older Adults: Exact Displacement Estimands, Sharp Identification Bounds and a Falsifiable Protocol for ACS Microdata", "url": "https://doi.org/10.2139/ssrn.7682278", "authors": "Sami Rashid Mohammed Shibah", "venue": "SSRN", "date": "2026-11-09", "apa": "Mohammed Shibah, S. R. (2026). Autonomy Persistence and Structural Isolation Among Older Adults: Exact Displacement Estimands, Sharp Identification Bounds and a Falsifiable Protocol for ACS Microdata. https://doi.org/10.2139/ssrn.7682278", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "高齢者が自宅で自立して暮らし続ける傾向と、同居・施設への置き換えを、選好が観測されない世帯データで何が言えるかを定めたうえで検証した。", "p3": "65歳以上・配偶者なし・機能制限のある人で、独居か否かと残りの居住形態の2段階のモデルを、g計算で自立持続率（APR）・置換の割合などに変換する。13の命題を証明し、仮説・反証ルール・コードを結果分析の前に固定し、IPUMS NHIS 2000〜2018（96,413人）とACS 2023のカリフォルニア（38,591人）で検証した（抄録）。", "p5": "NHISでは、対象の67.8%が独居で19.8%が日常生活の手助けを要した。手助けが必要になると独居が12.9%減り（APR 0.871）、置き換えられた確率の80%は子の世帯へ向かった。外国生まれ・ヒスパニック・アジア系で子の世帯への移行が小さいという仮説H3は、わずかに反証された。ACSのカリフォルニアでもAPRは0.774だった（抄録）。", "fun": "お年寄りの多くは、体が不自由になっても自分の家で自分らしく暮らしたいと願っています。でも国の統計には、誰と住んでいるかは載っていても、本人の望みは載っていません。この研究は、統計からは分からないことを数学ではっきり線引きしたうえで、手助けが必要になると一人暮らしが減り、その大半が子どもの家に移ることを示しました。分からない部分を正直に切り分けるところが面白い点です。", "unverified": "本文未読のため、識別境界の導出、仮説H2・H3の検証の詳細、頑健性分析は未確認。抄録は途中のACSの結果の記述まで確認した。"}}, {"id": "pr42", "rank": 42, "headline": "親の燃え尽き尺度は複雑なケアのある親にも同じに測れる", "title": "Evaluating the Parental Burnout Assessment in parents of children with and without complex care needs: Measurement invariance, group differences, and the correlates of socio-demographic characteristics", "url": "https://doi.org/10.31234/osf.io/rzcqy", "authors": "Nathalie Patty ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Patty, N., Lemmen, C. H. C., Schuengel, C., van Meeteren, K., Ketelaar, M., Luijk, M., & Willemen, A. M. (2026). Evaluating the Parental Burnout Assessment in parents of children with and without complex care needs: Measurement invariance, group differences, and the correlates of socio-demographic characteristics. https://doi.org/10.31234/osf.io/rzcqy", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "親の燃え尽きを測る尺度（PBA）は、複雑なケアが必要な子の親にも、そうでない親にも同じように測れることが確かめられ、前者の燃え尽きが高いことが示された。", "p3": "複雑なケアが必要な子（CCN）の親337人とCCNのない子の親329人がPBAに回答し、確認的因子分析で4因子構造（親役割での消耗・うんざり・以前の親としての自分との対比・感情的な距離）を調べた。多母集団の確認的因子分析で、グループ間の測定不変性を検討した（抄録）。", "p5": "4因子の構造と、単一の上位因子（親の燃え尽き）で説明できる構造が支持され、グループ間でスカラー不変性が成り立った。CCNの親は有意に高い得点だった（d=1.33）。CCNの子の母は父より高く、この差は一般の親では小さかった。親の年齢・民族・学歴・ひとり親・子どもの数などは関連しなかった（抄録）。", "fun": "「子育てで疲れ果てた」という気持ちを数字にする質問票が、特別な支援が必要な子の親にも、そうでない親にも同じ意味で使えるのかを確かめた研究です。使えると分かったうえで、支援が必要な子の親の燃え尽きが、そうでない親よりかなり高いことも示しました。同じ物差しで比べられると、困りごとの大きさが数字ではっきり見えるのが面白い点です。", "unverified": "本文未読のため、適合度指数の値と因子負荷量は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "家族の関与の質問票をペルシア語に適応し妥当性を検証", "title": "Cultural Adaptation and Psychometric Validation of the Persian Family Involvement in Care Questionnaire in Cardiac Surgery Inpatient Settings", "url": "https://doi.org/10.21203/rs.3.rs-11172661/v1", "authors": "Abbas Heydari ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Heydari, A., Manzari, Z. S., & Daneshfar, M. (2026). Cultural Adaptation and Psychometric Validation of the Persian Family Involvement in Care Questionnaire in Cardiac Surgery Inpatient Settings. https://doi.org/10.21203/rs.3.rs-11172661/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "入院ケアでの家族の関与を測る質問票（FICQ）をペルシア語に適応し、心臓外科関連病棟の家族介護者で妥当性と信頼性を確かめた。", "p3": "翻訳と文化的適応を国際的な指針で行い、表面的・内容的妥当性を評価した。2025年5〜10月にイランの教育病院の家族介護者320人を、探索的因子分析（160人）と確認的因子分析（160人）の独立な2つの部分標本に分けて検討した。ペルシア語版は16項目・3領域（抄録）。", "p5": "探索的因子分析は、原版と整合する3因子（情報とコミュニケーション・ケアと意思決定への参加・支援と尊重）を支持し、総分散の49.0%を説明した。確認的因子分析の適合は許容範囲（χ²/df=2.13、RMSEA=0.069、CFI=0.96、TLI=0.95、SRMR=0.045）で、内的一貫性はCronbachのα=0.961、McDonaldのω=0.958、再検査信頼性はICC=0.996だった（抄録）。", "fun": "病院で家族がどれだけ治療やケアに関わっているかを測る質問票を、別の国の言葉と文化に合わせて作り直す仕事です。ただ訳すだけでなく、因子分析などで「同じものを測れているか」を丁寧に確かめます。外国で作られた物差しを自分の社会で使うときの手順が分かるのが面白い点です。", "unverified": "本文未読のため、因子負荷量、再検査の間隔、標本の属性は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "LLMが日常の意思決定の考慮事項を補うと予測が改善", "title": "Developing human-AI complementarity: Augmenting everyday decision making with Large Language Models", "url": "https://doi.org/10.31234/osf.io/gzp7r", "authors": "Adrian Paul Banks ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Banks, A. P., & Gamblin, D. M. (2026). Developing human-AI complementarity: Augmenting everyday decision making with Large Language Models. https://doi.org/10.31234/osf.io/gzp7r", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMが日常の意思決定の検討材料を補うと、人間だけ・AIだけの評価より、決定の成功をよく予測できる場合があることを示した。", "p3": "3つの縦断研究（N=671）で、参加者が2つの選択肢の実際の個人的な決定と、1週間後の決定の成功を報告する。LLMが決定ごとに考慮事項や代替案の評価を生成し、AIの単独予測、人間の重みつき加算評価、LLMの属性などを取り入れた補強評価の予測の妥当性を比べた（抄録）。", "p5": "補強した評価は3つの研究すべてで経験した結果を一貫して予測し、最も強い関連を示した。補完性の証拠は研究2で最も明確で、完全に補強した評価が単独の2つの評価を上回り、それらを合わせても説明できない分散をさらに説明した。補強は属性の集合を広げ、参加者は人間とAIの寄与を保った（抄録）。", "fun": "進路や買い物のような大事な決断をAIに丸投げすると、うまくいくとは限りません。この研究では、AIに「考えるべき点」を挙げてもらい、人間がそこから選んで評価する形にすると、1週間後の「やってよかった」を、人間だけやAIだけより当てられました。AIは答えを出す係でなく、見落としを減らす係として使うのが面白い点です。", "unverified": "本文未読のため、予測妥当性の指標の値、各研究の設計の違い、標本の属性は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "性格と仕事の不適合は不足30%・過剰42%で知覚される", "title": "Mapping and Understanding Employees’ Perceived Personality–Work (Mis)Fit: a Mixed-Method Approach", "url": "https://doi.org/10.31234/osf.io/7eqfn", "authors": "Sofie Dupré ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Dupré, S., Vergauwe, J., & Wille, B. (2026). Mapping and Understanding Employees’ Perceived Personality–Work (Mis)Fit: a Mixed-Method Approach. https://doi.org/10.31234/osf.io/7eqfn", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "従業員が感じる性格と仕事の不適合（足りない／過剰）を、特性ごとに測る尺度で捉え、その経験と上司評価の成績との関係を調べた。", "p3": "従業員734人と上司521人の多手法・多情報源の設計で、「少なすぎる／多すぎる」尺度で知覚された性格と仕事の（不）適合を測り、それを形づくる職場での経験を調べ、上司評価の職務成績との関連を検討した（抄録）。", "p5": "知覚された不適合は多く、不足が30%、過剰が42%だった。適合は性格特性の幅広い水準で見られた。テーマ分析では、不適合の否定的な経験が課題の遂行を超えてウェルビーイングや対人の困難に及び、特性ごとに違うパターンだった。上司評価の成績との関連は小さかった（抄録）。", "fun": "「自分の性格は今の仕事に合っているか」には、合わないだけでなく、もっと慎重さがほしい（足りない）と、慎重すぎて疲れる（過剰）の2通りがあります。調べると、足りないと感じる人が30%、過剰と感じる人が42%もいました。同じ性格でも、多すぎる側の不適合があると気づけるのが面白い点です。", "unverified": "本文未読のため、尺度の項目、特性ごとの結果、成績との関連の効果量は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "借用規模の三層モデルを日本の都道府県で検証", "title": "借用規模（Borrowed Size）の三層モデル: 日本からの実証的知見", "url": "https://doi.org/10.51094/jxiv.7028", "authors": "大塚, 章弘", "venue": "Jxiv", "date": "2026-11-01", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Jxivの抄録のみ（英語・日本語）。本文は入手できなかった", "preprint": true, "short": true, "p1": "大都市の規模の利益が、ネットワークと制度を通じて小さな地域に及ぶ「借用規模」を、三層の枠組みで整理し、日本の都道府県データで示した。", "p3": "規模に関する外部性、媒介するネットワーク連結性、制度的・関係的な基盤という三層の枠組みを提案する。日本の都道府県のデータで、アクセスの改善・産業の専門化・国土計画が、集積の便益を都市の中心の外に広げることを示す（抄録）。", "p5": "集権的な統治、大都市への集中、急速な高齢化という日本の文脈で、国の空間戦略と財政移転が地方の産業の専門化と相互作用して、周辺地域の借用規模の効果を支えることを説明する。空間的な外部性が非物理的な経路でも働き、集積と分散の二分法に疑問を投げかける。借用規模は受け身の波及ではなく、制度に媒介された能動的な過程とされる（抄録）。", "fun": "大きな都市の近くにある小さな町が、都市の力を「借りる」ことで栄える、という現象です。この研究は、借りる力が道路や鉄道だけでなく、国の計画や補助金、人のつながりといった目に見えない道筋でも届くことを、日本の都道府県のデータで示します。町の発展を、規模だけでなく制度や信頼でも説明するのが面白い点です。", "unverified": "本文未読のため、使った変数・推定方法・数値結果は未確認（抄録は記述的で、数値の記載がない）。"}}, {"id": "pr47", "rank": 47, "headline": "常時稼働のAIの仕事発見を模擬職場で評価", "title": "AutoBuddy: Evaluating Proactive, Always-On Agents on Task Discovery and Execution in a Simulated Workplace", "url": "https://arxiv.org/abs/2611.12393", "authors": "Shiqi Chen ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Chen, S., Diaz, D. M., Chen, W.-N., Afonja, G., Yang, F., Wang, R., Bansal, C., Rühle, V., Rajmohan, S., & Han, D. (2026). AutoBuddy: Evaluating Proactive, Always-On Agents on Task Discovery and Execution in a Simulated Workplace (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12393", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "常時稼働のAIアシスタントが、依頼されなくても職場の仕事を見つけて実行できるかを評価する、模擬職場のベンチマークAutoBuddy-Benchができた。", "p3": "組織の従業員・プロジェクト・業務システム・出来事の履歴を時間グラフでモデル化し、現実的な作業空間の資料に描き直し、義務を生む出来事から正解の課題を導き、結果を世界の状態から計算する。実行はエージェントが作業空間に加えた変更で判定する。参照エージェントAutoBuddyは、基盤のLLMだけを入れ替えて評価した（抄録）。", "p5": "課題が失われる場所が系統的にずれる。弱いモデルは主に課題の発見で失敗し、中間のモデルは課題を見つけても実行の手前で止まり、最も強いモデルは主に業務システムの操作などの実行で失敗する。発見の精度は実行の質とは弱くしか関連せず、2つは別の能力とみられる（抄録）。", "fun": "メールやチャットに埋もれた「やるべき仕事」を、言われなくても見つけて片づけてくれるAIが理想です。でも実際には、見つけるのが苦手なAI、見つけても実行しないAI、実行で転ぶAIと、つまずく場所がAIの強さで変わりました。「気づく力」と「やり遂げる力」が別の能力だと分かるのが面白い点です。", "unverified": "本文未読のため、評価したモデルの種類、課題の数、数値結果は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "状態監視を保全判断につなぐ証拠の流れを整理", "title": "Industrial Asset Health as an Evidence Pipeline: Condition Monitoring, Digital Twins, and Maintenance Decisions", "url": "https://doi.org/10.2139/ssrn.7682022", "authors": "Danish Rahim Khan ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Khan, D. R., Qureshi, A. N., & Abbasi, M. T. (2026). Industrial Asset Health as an Evidence Pipeline: Condition Monitoring, Digital Twins, and Maintenance Decisions. https://doi.org/10.2139/ssrn.7682022", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "状態監視の測定を、保全の判断に耐える証拠にどうつなぐかを整理した参照アーキテクチャと、研究課題の一覧が示された（レビュー）。", "p3": "異常検知・故障診断・余寿命推定・介入選択を区別し、各課題とデータ・検証の要件を結ぶ。振動と運転状況の分析を、エッジでの実行、異種混合の計算、不確実性、デジタルツイン、ソフトウェア保守に結びつけ、分析的な費用モデルと評価プロトコルを提案する（抄録）。", "p5": "新しい機械の実験・故障予測・実測の経済的な節約額は示していない。診断のスコアが高いだけでは保全の便益の十分な証拠にならないことを、費用モデルと評価プロトコルで示す（抄録）。", "fun": "「故障をほぼ当てるAI」ができても、それで本当にお金や手間が節約できたかは別の話です。この論文は、AIの診断の点数だけで「役に立った」と言えない理由を費用のモデルで説明し、効果を確かめるための評価の手順を示します。点数のよさと現場の役立ち度は別だと教えてくれるのが面白い点です。", "unverified": "抄録のみのレビューで、費用モデルの式と評価プロトコルの詳細は未確認。新しい実験は含まれない。"}}, {"id": "pr49", "rank": 49, "headline": "テンソルネットワークのカーネル機械で非線形系を同定", "title": "Tensor Network Kernel Machines for Nonlinear System Identification", "url": "https://arxiv.org/abs/2611.12326", "authors": "Kim Batselier", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Batselier, K. (2026). Tensor Network Kernel Machines for Nonlinear System Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12326", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "テンソルネットワーク・カーネル機械が、非線形システム同定をどう効率的にするかを、2つの定義的な性質から基礎的に解説する。", "p3": "低ランクのテンソルネットワークを使うモデルクラスの2つの定義的な性質を説明し、モデルの最適化と正則化、最近の展開、さらに探る足がかりをまとめる解説論文（抄録）。", "p5": "解説論文のため、新しい実験結果の記載はない。この10年にこのモデルクラスが効率的な非線形同定を可能にしてきたと述べる（抄録）。", "fun": "複雑な機械の動きを、入力と出力の記録から数式で表そうとすると、変数が増えるたびに計算量が爆発します。この解説は、巨大な表を小さな部品のつながり（テンソルネットワーク）に分解して、爆発を抑える考え方を紹介します。大きな問題を小さな部品の連結で扱う発想が面白い点です。", "unverified": "抄録のみで、モデルの定式化や具体的な数値は未確認（解説論文）。"}}, {"id": "pr50", "rank": 50
