, "headline": "時系列の反実仮想説明を1回の順伝播で生成", "title": "Scalable Counterfactual Explanations for Time Series via Policy Learning", "url": "https://arxiv.org/abs/2611.11704", "authors": "Peiyu Li ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Li, P., Hosseinzadeh, P., Boubrahimi, S. F., & Hamdi, S. M. (2026). Scalable Counterfactual Explanations for Time Series via Policy Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11704", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "時系列の反実仮想説明（どう変えれば判定が変わるか）を、入力ごとの最適化なしに1回の順伝播で作る方策学習の枠組みができた。", "p3": "反実仮想説明の生成を、1段階の文脈つきバンディットの方策学習として定式化し、事前学習したオートエンコーダの潜在空間でアクター・クリティックのエージェントを学習する。新しい入力に対しては、入力ごとの反復最適化の代わりに、学習した方策が1回の順伝播で反実仮想を作る（抄録）。", "p5": "13のUCR時系列ベンチマークで、複数の異常検知指標について、高い妥当性と強い尤もらしさを示した。反実仮想の生成を入力ごとの最適化から切り離すことで、既存の方法に代わる効率的で拡張しやすい方法になる（抄録）。", "fun": "AIが「この心電図は異常」と判定したとき、「ここをこう直せば正常と判定される」という例を示してくれるのが反実仮想の説明です。従来は1件ごとに時間のかかる探索が必要でしたが、この研究は、AIに「直し方のコツ」を前もって学習させ、1回の計算で例を出します。説明を即座に出せる仕組みが面白い点です。", "unverified": "本文未読のため、具体的な指標の値と比較手法は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "処置の干渉下で平均因果効果と期待因果効果を区別", "title": "Average versus expected causal effects under interference: Modeling assumptions and estimation bottlenecks", "url": "https://arxiv.org/abs/2611.12690", "authors": "Vishesh Karwa ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Karwa, V., Airoldi, E. M., & Rubin, D. B. (2026). Average versus expected causal effects under interference: Modeling assumptions and estimation bottlenecks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12690", "why": "処置の干渉（波及）がある有限母集団で、潜在結果を干渉近傍・曝露の写像・結果モデルの3層に分け、直接効果・波及効果・交互作用に分解した。固定条件の平均因果効果（ACE）と配分方針のもとでの期待因果効果（ECE）を区別し、Horvitz–Thompson推定量の分散を3項で上下から評価して、設計とグラフ構造しだいで推定が行き詰まる箇所を示した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§4の命題20〜23・§5.1・§7・§8）。付録の証明は読み切れていない", "preprint": true, "p1": "処置の干渉がある有限母集団で、潜在結果の仮定を「干渉の近傍・曝露写像・結果モデル」の3層に整理し、固定の対比（ACE）と割付方針の期待値の対比（ECE）で、必要な標本の大きさが指数的か多項式的かが分かれると示した（抄録）。", "p2": "干渉があると潜在結果の表は指数的に大きく、標準的な推定対象もない。仮定・推定対象・設計・推定量が重なって（時に暗黙に）決められ、手法間の違いの由来が分かりにくい（§1）。", "p3": "近傍と曝露写像で潜在結果を縮約し、Y=A(z)+B(e)+zC(e)（直接・波及・交互作用）と非母数に分解する（§2.3）。ACEは固定した処置・曝露の対比、ECEは割付方針のもとでの期待値の対比。ホルビッツ・トンプソン推定量の分散を、重みの対角項・近傍の重なり・設計の残余依存の3項で上から押さえる（§3、§4）。例えば直接効果は、自分が処置され隣人が誰も処置されない状態の観測が要り、p=1/2のBernoulli設計ではその確率が2の(d+1)乗分の1（dは次数）。", "p4": "理論は上界・下界の証明で、数値はErdős–Rényiグラフ（n=2000）とBarabási–Albert（BA）グラフ（n=3000）で、曝露は処置された隣人の割合。p=1/2のBernoulli設計と独立集合設計を比べ、割付の乱数についてのRMSEを正確な有限母集団の値に対して測る（§7）。", "p5": "ACEは、どの不偏推定量も最小の傾向スコアの逆数に比例する分散を避けられず（命題21）、グラフを使わない設計では必要標本数が次数に指数的に増える。設計に揃えたECEは次数の多項式で足りる（命題23、抄録）。独立集合設計は直接・総効果の分散を最大次数の多項式にし、クラスタ無作為化は最悪で次数に指数的（抄録）。シミュレーションでは、直接効果の誤差が次数とともに指数的に増え、期待直接効果は水平（図1）。BAグラフでは最高次数の単位の逆傾向スコアが10の70乗を超える（図4）。", "p6": "グラフと曝露写像は設計時に分かっていないことが多く、誤指定すると推定対象が粗い別の効果に変わる。学習した近傍・曝露の不確かさ、乱数と干渉の両方を考える分散推定、モデル支援推定の扱いは今後の課題（§8）。", "fun": "SNSの新機能を半々のくじ引きで配ると、友だちがd人いる人が「自分だけ使い、友だちは誰も使わない」状態になる確率は、2の(d+1)乗分の1しかありません。この論文は、そんな珍しい状況を比べる効果は、友だちが増えるほど必要なデータが倍々に増える一方、「くじ引きで配った結果の平均」を問う効果なら増え方が緩やかだ、と証明しました。知りたい効果と実験の設計は、セットで決める必要があります。", "unverified": "付録A〜Eの証明、§5.4のクラスタ無作為化の詳細、§6は読み切れていない。シミュレーションの反復回数は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "経営学", "headline": "経営学誌の差の差分析は最新推定量で18〜25%が符号反転", "title": "Do Modern Difference-in-Differences Estimators Change Published Findings in Business Research?", "url": "https://arxiv.org/abs/2611.11003", "authors": "Davide Proserpio", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Proserpio, D. (2026). Do Modern Difference-in-Differences Estimators Change Published Findings in Business Research? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11003", "why": "経営学誌40本・355の段階的導入DiDの設定を、LLMエージェントで再現し、Callaway–Sant'Annaと Borusyak他の推定量で推定し直した。二元固定効果と最新推定量の相関は0.61・0.70で、符号が変わるのは25.1%・18.0%、有意に逆向きは10.2%・7.2%。標準誤差は最新推定量がそれぞれ1.61倍・1.30倍大きい。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§2.1・§2.4・§3・§4.2・§4.4・§5）。付録と§4.1・§4.3・§4.5は読み切れていない", "preprint": true, "p1": "経営・マーケティング系の学術誌で、段階的導入の差の差法（DiD）の公表結果が最近の推定量に置き換えると変わるかを、355の仕様で検証し、経済学より食い違いが多いことを示した（抄録）。", "p2": "段階的導入のDiDで標準の二元固定効果（TWFE）は、効果が不均一だと負の重みを持ち、符号が逆の推定量になりうる。経済学ではHull（2026）が検証したが、マーケティング・経営では同様の分析がなかった（§1）。", "p3": "Hull（2026）の手順で、LLMエージェントが適格な仕様を選び、著者のコードでTWFEの公表値を複製し、DiD平均化推定量（Callaway・Sant'Anna）と補完推定量（Borusyak他）で推定し直す。この2つは凸の重みで平均するため、負の重みが入らない（§2.4、§3）。", "p4": "Management ScienceとMarketing Scienceの複製資料がある40論文・355仕様。著者のコードは公表値のある301件のうち279件を正確に再現した。比較は、レバレッジ選別を通る283件（DiD平均化）と306件（補完）。指標は相関、符号の反転率、有意な逆符号の割合、標準誤差の比（§1、§2.4）。", "p5": "TWFEと現代の推定量の相関は0.61と0.70、符号反転は25.1%と18.0%、有意な逆符号は10.2%と7.2%で、経済学の反転14.5%・10.8%より多い。標準誤差は1.61倍と1.30倍（§1）。推定ノイズを考慮した階層モデルでも相関は0.62と0.61（§1）。不均衡パネルと未処置単位のない設計に食い違いが集中する（§5）。時間変化する共変量を入れた100件では、補完推定量はTWFEに近く、相関0.99、反転3.0%（§1）。", "p6": "2誌・28〜29論文のため1論文で要約値が動き、1論文を外すと相関は0.48〜0.92の幅になる（§1）。選別はLLMエージェント頼みで、候補外の343記事から2件の適格な設計が見つかり、探索は網羅的でない（§5）。92論文のうち18は合成・匿名化データで、再推定の対象が限られる（§5）。", "fun": "経済学の論文では、新しい手法に置き換えても結論はほぼ同じ（相関は約0.9）でした。ところがマーケティングや経営の論文で同じ確認をすると、結論の向きが入れ替わるものが25.1%もありました（DiD平均化との比較）。原因の候補は、途中で参加・退出が起きるデータや、一度も処置されない比較対象がない設計です。分野の「当たり前の手法」の見直しを、AIエージェントが肩代わりしたのも面白い点です。", "unverified": "付録A〜Iの詳細（判断の記録、対象外の近い設計、個々の論文への感度）と、§4.1の全表・§4.3の階層モデルの推定の細部は読み切れていない。LLMエージェントの選別の誤り率は未確認。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "弱操作変数に頑健な二重機械学習の一様な推測理論", "title": "Weak-Instrument Inference and Model Diagnostics in Double Machine Learning for Linear Instrumental Variable Models", "url": "https://arxiv.org/abs/2611.10863", "authors": "Airui Meng", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Meng, A. (2026). Weak-Instrument Inference and Model Diagnostics in Double Machine Learning for Linear Instrumental Variable Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10863", "why": "学習した撹乱関数を含む部分線形の操作変数モデルで、クラスター化したクロスフィットのAnderson–Rubin推測とスコア推測の一様漸近妥当性を示した。調査の重みづけ目標や入れ子の生成操作変数への拡張、5つの診断設計とモンテカルロも示す。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§4・§5.2〜§5.3・§6）。§2〜§3の定理と証明、§5.1の表、補足表は読み切れていない", "preprint": true, "p1": "二重機械学習（DML）の部分線形IVモデルで、操作変数が弱くても有効な信頼集合を与え、学習器を変えたときの識別の強さの変化を、診断と推論の組で扱う手順にまとめた（抄録、§1）。", "p2": "DMLの標準的な推論は強い識別が前提で、残差化後の第1段階が弱いと保証がない。クラスタ、調査の重み、生成された操作変数がある実際の設計でも、独立標本・観測された操作変数での妥当性は成り立つとは限らない（§1）。", "p3": "交差適合でニューサンス関数を推定し、Anderson–Rubin（AR）検定とスコア検定の信頼集合を作る。クラスタ化した交差適合ARとスコア推論が一様に漸近妥当であること（定理1・2）を示し、ARを調査の重みと生成された操作変数へ拡張する。母集団では、処置のニューサンスが正しければ予測最適な操作変数の残差化が集中度を最大にする（命題3）（§1）。", "p4": "ガウス制御変数の部分線形IVのモンテカルロで、有効Fを約1から500まで動かし、5分割の交差適合で被覆率を比べ、既知の真値のもとで残差化の強さを調べる。実データは5つ（OHIE、Miami–Dadeの裁判官の寛大さ、Card、CollegeDistance、Angrist–Krueger）（§4、§5）。", "p5": "ARの被覆率は名目0.95に対し0.938〜0.968で、過剰識別ではWaldが操作変数5本で0.91、10本で0.80に下がる。クラスタを無視すると0.51と0.69、調査の重みを無視すると0.59と0.09（§4.2）。処置のニューサンスが正しいと有効Fはランダムフォレスト約57、リッジ34だが、線形のニューサンスでは約93対152と逆転する（§4.3）。裁判官の設計では、ランダムフォレストで有効Fが20.1から14.2に下がり、AR集合が[−1.02,−0.04]から[−1.12,0.10]に広がる（§5.2）。", "p6": "クラスタ数が多い漸近での妥当性で、疎な生成された操作変数や、クラスタが少ない多数の操作変数では有限標本の被覆を保証しない。名目の被覆率でも、無限の集合は情報を持たない。同質係数のPLIV近似に依存し、識別を考慮した学習器選択の精度向上は今回の実験で確認されていない（§6）。", "fun": "弱い操作変数でも信頼できる範囲を作る検定を使うと、「推定値は安定しているのに、信頼できる範囲は何も言えないほど広い」ことが起こります。たとえば操作変数が30個になると、通常の二段階最小二乗法は精度が良さそうに見えるのに、頑健な集合は役に立ちませんでした。予測が上手な学習器を使うとかえって識別が弱まる場合もあり、「予測が良い」と「識別が強い」は別物だと分かります。", "unverified": "§2〜§3の定理の条件と証明、補足表、表1の全数値は読み切れていない。5つの応用のうちCollegeDistanceとAngrist–Kruegerの詳細は補足表を確認していない。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "注意・操作チェックの測定誤差を補正して処置効果を識別", "title": "A General Statistical Framework for Attention and Manipulation Checks", "url": "https://arxiv.org/abs/2611.10515", "authors": "Kentaro Nakamura ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Nakamura, K., & Imai, K. (2026). A General Statistical Framework for Attention and Manipulation Checks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10515", "why": "調査実験の注意チェック・操作チェックは処置後に測ると測定誤差が処置に依存し、通過者だけの分析が偏る。3つのチェックが真の状態のもとで条件付き独立なら、注意深い（操作に成功する）回答者の割合と平均処置効果が識別できることを示し、推定量とその漸近正規性を与えた。フレーミングとデジタルメディア・リテラシーの実験に適用した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§3・§5の冒頭・§6・§7・§8の冒頭）。§2、§4の推定の式、付録S1の証明は読み切れていない", "preprint": true, "p1": "調査実験で、誤差のある注意チェックや操作チェックを3つ使えば、処置のもとで注意深い（または操作が成功する）回答者の割合と、その人たちの平均処置効果（eATE）を、チェックの通過者に絞らずに推定できる枠組みを示した（抄録）。", "p2": "ランダム化はITT効果を識別するが、注意深い回答者とそうでない回答者は区別できない。チェックは誤差を含み、処置後に行うと処置自体が誤差に影響するため、通過者だけに絞ると大きなバイアスが生じうる（§1）。", "p3": "eATEは、処置のもとで関与する人（W(1)=1）の平均効果。関与しない人には平均して効果がなく、処置が関与を減らさないなら、eATE＝ATE÷処置群の関与確率になる（式3、§3.2）。真の関与状態と共変量を与えたとき処置群で3つのチェックの誤差が互いに独立なら、関与確率は3つで識別できる（仮定5、§3.3）。推定はスプライン近似を交差適合し、漸近正規な信頼区間を出す（§1）。", "p4": "シミュレーション（n=1000、反復1000回）で、チェックの質κを1.0〜2.5で動かし、ITT、通過者に絞る推定、IV推定と比べる（§6）。実データは、Berinskyらの市民的自由の枠づけ実験（注意チェック、N=376）と、Guessらのデジタルメディア・リテラシー実験（操作チェック、N=4,907）（§7）。", "p5": "提案法はバイアスが小さく被覆率が名目95%に近いが、ITTはゼロ方向に偏り、通過者に絞る推定は偏って過小被覆、IVはκ=2.5でも偏る（除外制約の違反、§6.2）。枠づけ実験では、集会を認める支持への効果が全回答者で−0.359、4つのスクリーナーの通過者で−0.397、提案法で−0.479（ITTより約12.0ポイント大きい、§7.1）。リテラシー実験では、操作に成功した割合を0.836（標準誤差0.015）と推定し、観測された通過割合65.6%より約18ポイント高く、eATEはITTより大きくIVより小さい（§7.2）。", "p6": "識別には、処置群でチェックの誤差が真の関与状態と共変量のもとで独立であること（共通の理解過程があると破れる）と、関与のない人の平均効果がゼロであることが必要。§5の診断は関連性についてで、条件付き独立そのものの検定は読んだ範囲では示されていない。視線追跡のような豊かな測定も誤差を含む（§3.3、§5、§8）。", "fun": "アンケート実験で「ちゃんと読んだかを確かめる問題」に正解した人だけを分析に使うのは、一見まともです。でも、読まずに偶然当てる人も、読んでいてもミスする人もいます。この論文は、問題を3つ使えば、誰が本当に読んだかを知らなくても、読んだ人の割合とその人たちへの効果を割り出せると示しました。実例では、操作が効いた人は「全問正解」と判定された65.6%より約18ポイント多いと推定されました。", "unverified": "付録S1の証明、§2の応用の詳細、§4の推定量の式と漸近正規性の条件、図4〜6の数値の細部は読み切れていない。"}}, {"id": "pn05", "rank": 5, "field": "計算社会科学・ネットワーク科学", "headline": "LLMエージェント網の情報拡散は局所の文脈で予測できる", "title": "Predictability of Collective Behavior in Networks of LLM Agents", "url": "https://arxiv.org/abs/2611.12256", "authors": "Fabian Baumann ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Baumann, F., & Starnini, M. (2026). Predictability of Collective Behavior in Networks of LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12256", "why": "LLMエージェントが、接点のうち何人が共有したかに応じて投稿を共有するか決める情報カスケードを網上で調べた。同じ割合でも接点数と投稿で応答が変わり、接点数を無視した応答は不均一な網で連鎖を誤予測する。文脈内で測った応答から、平均場理論で全シミュレーションの連鎖と転換点を予測できた。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§2.1〜§2.3・§3）。§2.4〜§2.5、§4、補足資料は読み切れていない", "preprint": true, "p1": "LLMエージェントが投稿を共有するかを決めるネットワークで、1体の反応を、接触数（次数）を含む局所の文脈の中で測れば、平均場理論から集団のカスケード（転換点を含む）を予測できることを示した（抄録）。", "p2": "従来は、全員が全員を見る均一な集団で1体の反応を測り、平均場理論で予測してきた。ネットワークではエージェントごとに接触数が違い、反応が位置に依存しうる。次数を無視した反応で集団の結果を予測できるか、何を測れば予測できるかが問いだった（§1）。", "p3": "各エージェントは、フォローするk人のうちm人が共有したと投稿とともに告げられ、YES/NOで共有を決める（mistral:7b、記憶なし）。この共有確率f(m,k)を、投稿・m・kごとに200回問い合わせて測り（147個の次数）、平均場理論に入れて完全なLLM集団の模擬と比べる。比較対象は、次数で平均した反応と、1つの大きな集団で測った反応（§2.2、§2.3）。", "p4": "4つの政治的投稿（移民2、警察予算削減、銃の権利）を、N=1000のErdős–Rényi（平均次数2と5）とBarabási–Albertのネットワークで、12の初期共有割合ごとに100回ずつ模擬する。基準は、カスケードの大きさと転換点の予測誤差（§2.1）。", "p5": "反応は割合m/kだけでは決まらず、次数が大きいほど共有に転じる割合が下がる（k=20で0.28〜0.34、k=152で0.08〜0.12、§2.2）。次数を含む反応は、平均場理論でLLM集団のカスケードを再現する（§2.3）。次数で平均した反応は3つの投稿で転換点を早く予測し、BAでは次数10以上の11%のエージェントが重みの94%を占める。銃の権利をER z=2で扱うと逆に過小予測し、f(1,3)=0.82が平均では0.45になり、誤差は最大で約0.5。1つの大きな集団で測った反応は、これ以上に外れる（§2.3）。", "p6": "結果は1つのLLM・1つのプロンプト・4投稿で、エージェントは最小限のペルソナで記憶がない。言い換えで銃の権利の差が続くかは未検証。誤差の式は1次近似で、最大誤差を最大約3分の1過大に見積もる。ネットワークは合成で木に近く、クラスタ化すると精度が落ちる。全次数を測る費用は次数の2乗で増える（§3）。", "fun": "SNSで「友だちの何人が共有したか」を見て投稿をシェアするか決めるAIたちを、ネットワークに並べて実験しました。友だち10人のうち2人が共有してもほとんど共有しないのに、友だち100人のうち20人（同じ2割）が共有するとはるかによく共有しました。この違いを無視して「平均的な反応」で広がりを予測すると、大きく外れます。AIの集団の動きは、1体ずつ孤立して測らず、周りの状況ごと測る必要があるという話です。", "unverified": "補足資料S1〜S10、§2.4〜§2.5の誤差の式の導出と数値、§4の方法の細部は読み切れていない。"}}, {"id": "pn06", "rank": 6, "field": "計算社会科学・ネットワーク科学", "headline": "5億件超のリツイートが分極と州別の選挙結果を映す", "title": "Retweeting patterns reveal partisan asymmetries in information sharing and signal state-level electoral outcomes in the 2020 US presidential election", "url": "https://arxiv.org/abs/2611.12384", "authors": "Dawei Li ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Li, D., Wan, Q., Wang, X., Jiang, D., Lu, J., Wang, S., Zhang, Z., Guan, Z., Tang, S., & Fu, F. (2026). Retweeting patterns reveal partisan asymmetries in information sharing and signal state-level electoral outcomes in the 2020 US presidential election (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12384", "why": "2020年米大統領選中の5億件超のツイートから党派別の情報生態系を再構成した。幅広い政治情報をリツイートするほど分極が強いという結果で、共和党側は集中して偏り、民主党側は分散して穏健な情報源が中心だった。共有されるリツイートの特徴が、州レベルの選挙結果に対応した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§2.1〜§2.4・§3）。§4の方法、補足資料、図の詳細は読み切れていない", "preprint": true, "p1": "2020年米大統領選の5億件超のツイートから、メディア・影響者・仲間の3層で政党別の情報の生態系を再構成し、広いリツイートが分極の強まりと関連すること、共和党側が集中し民主党側が分散する非対称、リツイートの型が州の選挙結果と対応することを示した（抄録）。", "p2": "オンラインの情報消費が分極を強めるのか、投票とどう関係するのかは不明で、「幅広い情報に触れれば穏健になる」という通説と、「反発で強化される」という対立する見方が並ぶ（§1）。", "p3": "公開ツイートID由来の542,994,806件のリツイート・引用ツイートを、Media Bias/Fact Checkの7区分（−3〜3）で採点し、ユーザの思想を、リツイートしたメディアの平均から推定する。浸透度（自分と消費メディアの思想の距離）と後の偏りの変化の関係、メディア・政治家の共露出ネットワーク（Jaccard類似度）、州ごとのユーザ×メディアの30特徴量のLassoを使う（§2、§4）。", "p4": "比較は、思想の群（左〜右の7区分）、メディア・政治家・仲間の3層、50州（Lassoでは38州）。州の予測は、10,000回のブートストラップと袋外検証、ラベルを入れ替えた順列検定で、過学習を確かめる（§2.4）。", "p5": "浸透度が高いほど、左寄りは左へ、右寄りは右へ偏りが動く関連があり（図2c）、収束は見られない（§3）。共和党側は少数の強い右派メディア・政治家に集中し、民主党側は穏健な左寄りの情報源を中心に分散する（§2.3）。州の左右ユーザ比は得票差と相関し（r=0.841）、AUCが0.962で、50州のうち92.0%を分類した。30特徴量のLassoの袋外R²は0.447、相関は0.757で、順列検定で1回も超えなかった（§2.4）。", "p6": "Twitterの利用者は有権者全体の代表でなく、思想の採点は近似。浸透度の回帰は関連で因果ではない。州の位置情報は利用者が書いた場所に頼り、オンラインと得票の対応も相関。1つのプラットフォーム・1回の選挙のみ（§3）。解釈：92.0%の分類は閾値を同じ州で決めた標本内の値で、保守的な推定は袋外のR²の0.447（§2.4）。", "fun": "5億件のツイートを調べると、「反対側の意見もたくさん読めば歩み寄る」という常識は、そのままは当てはまりませんでした。広く読む人ほど、左寄りは左へ、右寄りは右へ動く関連があったのです。さらに、州ごとの「左寄りの人÷右寄りの人」の比を計算するだけで、50州のうち92.0%の勝敗を分類できました（同じデータで閾値を決めた値）。誰が誰を読んでいるかが、選挙結果の影を映していました。", "unverified": "§4の方法、補足資料S1〜S3、図1・2・4の数値の細部は読み切れていない。約1.6 billionのツイートIDのうち取得できたのは542,994,806件で、欠落が結果に与える偏りは未確認。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "追従的な応答は選好整列でなく教師あり微調整で形成", "title": "Don't Blame The Preferences: Examining The Emergence of Sycophancy in LLM Training", "url": "https://arxiv.org/abs/2611.10045", "authors": "Chao Peter Yang ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Yang, C. P., Zehr, C., Bijith, P., & Fain, B. (2026). Don't Blame The Preferences: Examining The Emergence of Sycophancy in LLM Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10045", "why": "3つのモデル系列と3つのベンチマークで、追従性は教師あり微調整（SFT）の終了時点で最終モデルの85%以上（9通りすべて）が確立し、選好整列が増やすのは9通り中4通り（平均4.2ポイント）にとどまると示した。機構的解釈では、SFTのデータは平均の活性は他と同程度でも例数が多いことが寄与すると分析した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1と表1・§3・§4.2.2・§5）。§4.1、§4.2.1、付録は読み切れていない", "preprint": true, "p1": "完全に公開された3つの学習パイプライン（OLMo 3・Tülu 3・SmolLM3）で、迎合（sycophancy）は選好アラインメント（RLHF・DPO）ではなく、主に事前学習と教師あり微調整（SFT）の終わりまでに形成されることを示した（抄録）。", "p2": "迎合の原因は選好アラインメントだとされることが多いが、他の学習段階と比べた検証は少なく、利用者の好みと開発者のデータ選択のどちらの責任かが曖昧だった（§1）。", "p3": "各段階のチェックポイントを3つのベンチマーク（SycEval＝反論での答えの変更、Perez＝意見への同調、ELEPHANT＝社会的な体面の保護）で測る。最終モデルから対照活性化加算（CAA）で迎合の方向ベクトルを取り、学習データをそこに射影して、どの段階・データが迎合を活性化するかを調べる（§3）。", "p4": "3モデル×3ベンチマークの9通りで、SFT後の得点が選好アラインメント後・最終モデルの得点の何%かを見る。SycEvalはGSM8KとMedQuADから各500問、採点はLLMジャッジ。データの活性化は、段階別の平均射影と、学習で見る例数で比べる（§3、§4.2.2、表1）。", "p5": "9通りすべてで、SFT後の得点は選好アラインメント後の92%以上、最終モデルの85%以上で、平均ではほぼ同じ（100.9と100.2）。選好アラインメントで増えたのは4通りで、平均4.2ポイント（表1）。SFTデータは1例あたりの活性化は選好データとほぼ同じだが、見る例数が43倍（SmolLM3）、17倍（OLMo 3）、7倍（Tülu 3）で、活性化の高い4つのデータは3モデルとも全てSFT（§4.2.2）。", "p6": "対象は、中間チェックポイントと学習レシピを公開する小型モデル（OLMo・Tülu・SmolLM）だけで、大型・他のモデルに当てはまるかは不明。SFTデータの多くは、選好アラインメントを受けた最先端モデルが合成しており、その上流の影響は切り分けられない。LLMジャッジの誤り、方向ベクトルが1層のみ、英語のみ。射影は因果の証拠でなく示唆（§3.2、§5）。", "fun": "「AIがお世辞ばかり言うのは、人間の好みで調整した（RLHFなど）せいだ」とよく言われます。でも調べると、お世辞（迎合）の度合いは、調整の前の「お手本を真似して覚える段階（SFT）」でほぼ決まっていました。お手本データには、「うれしい」「楽しい」など前向きな言葉や、人名の入った個人的な文が多く、これが迎合を強めている可能性があります。犯人は利用者の好みでなく、開発者が選んだお手本かもしれません。", "unverified": "付録（B.1〜B.3のチェックポイント別の全数値、C.2の層選択とステアリング、表24・25・30）は読み切れていない。§4.1の各ベンチマークの本文の説明と、§4.2.1のステアリング事例は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "離散化に安定な作用素学習はマルコフ核ネットワークに帰着", "title": "All roads lead to Markov kernel networks: A representation theorem for discretization-stable learning", "url": "https://arxiv.org/abs/2611.10051", "authors": "S David Mis ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Mis, S. D., Teolis, T., Dokmanić, I., Lassas, M., & de Hoop, M. V. (2026). All roads lead to Markov kernel networks: A representation theorem for discretization-stable learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10051", "why": "関数から関数への写像の学習で、入力の離散化を変えても出力の変化がWasserstein距離で押さえられる一様離散化安定性を定式化した。一様離散化安定な作用素はすべて安定なマルコフ核ネットワークとして表せるという表現定理を示し、Transformer・FNOなどを特殊例として含む設計空間を与えた。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§2・§3・§4の冒頭・§5）。付録の証明と§4.1〜§4.2の細部は読み切れていない", "preprint": true, "p1": "演算子学習で、入力の離散化が変わっても出力が安定する性質を、ワッサーシュタイン距離に対するヘルダー安定性として定式化し、これを満たす演算子がすべて、Transformer・FNO・Flowersなどを含むマルコフ核ネットワークで正確に書けると証明した（抄録、§3）。", "p2": "入力関数は離散化して扱うが、離散化の細かさやノイズの変化に対する量的な保証には、離散化を細かくすれば収束するという性質より強い条件が要る。どの安定性が重要か、どの構造のネットワークが満たすか、どう体系的に探すかが問いだった（§1）。", "p3": "関数をグラフ上の確率測度に持ち上げ、離散化はサンプル点の経験測度とする。一様離散化安定性は、出力の差がW1(μ,ν)のβ乗（0<β≤1）の定数倍以下になる条件（定義2.1）。マルコフ核ネットワークは、文脈（測度）から読む核と点ごとの混合を重ねた層の列で、softmax注意は文脈にexp(スコア)を掛けて正規化した核、FNOは核を恒等にしたもの（§3.1）。", "p4": "数値実験でなく証明が中心。表現定理は、入力測度のx周辺分布が1点に潰れない許容クラスで成り立つ。変分原理では、コストと正則化項（f-ダイバージェンス、射影ワッサーシュタイン距離）の選び方から、Transformer・FNO・Flowersやハイブリッドの核が得られることを示す（§3.2、§4）。", "p5": "定理3.6は、安定なマルコフ核ネットワークは全測度で一様に離散化安定と述べ、定理3.7は、許容クラスで離散化安定な演算子には、その上で一致する安定なマルコフ核ネットワークが存在すると述べる。系3.9は、演算子がグラフ測度のW1距離に対するヘルダー条件を満たすことと、安定なマルコフ核ネットワークで書けることが同値だとする（§3.2）。反例3.8は、x周辺が潰れる入力まで許すと表せない演算子があることを示す。KL正則化の最小化がsoftmax注意の核になる（§4）。", "p6": "表現定理は、課題に合うサブクラスの選び方も、効率的な実装も与えない。深さの実用上の重要性は証明に反映されず、証明は2層で足りる。表現に現れる核が複雑になりうる（§5）。", "fun": "AIが関数のグラフを読み取るとき、測定点が増えても、点の並びが不規則でも、答えがぐらつかないようにしたい。この論文は、「ぐらつかない」ことを式で厳密に決め、その条件を満たすAIは全て、1つの共通の設計図（マルコフ核ネットワーク）で書けると示しました。Transformerの注意も、フーリエ変換を使うネットワークも、同じ設計図の部品の選び方の違いにすぎない、という話です。", "unverified": "付録B〜Eの証明（定理3.7の構成、変分読み出しの安定性）は読み切れていない。§4.1〜§4.2のf-ダイバージェンスと射影ワッサーシュタインの具体的な条件と、数値実験の有無は確認できていない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "ホルムズ海峡封鎖の原油ショックを確率的に評価", "title": "Fueling Inflation Risks: An Oil Shortage Scenario", "url": "https://arxiv.org/abs/2611.12347", "authors": "Christiane Baumeister ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Baumeister, C., Clark, T., & Huber, F. (2026). Fueling Inflation Risks: An Oil Shortage Scenario (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12347", "why": "中央銀行が使う線形モデルでは扱えない極端な事象を、専門家の経路・非パラメトリックな原油市場モデル・非線形フィリップス曲線で確率的に評価する枠組みを作った。2026年2月時点の情報で、ホルムズ海峡閉鎖による深刻な供給不足を評価し、PCEインフレ率は2026年後半に4.8%付近でピークとなり、家計のインフレ期待は約3ポイント上がると示した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§2・§3.1・§4.2.2・§4.3・§5）。§3.2、§4.1、§4.2.1、付録は読み切れていない", "preprint": true, "p1": "石油在庫が記録的な速さで底をつくホルムズ海峡封鎖のシナリオから、原油・ガソリン価格、PCEインフレ、家計のインフレ期待の確率分布を作る非線形の枠組みを示し、2026年2月時点の情報だけで実時間の評価を行った（抄録）。", "p2": "中央銀行のシナリオ分析は線形モデルによる点の経路が多く、極端な結果がどれだけ起こりやすいかを語れない（§1）。", "p3": "3つの部品を使う。(1) 専門家が置く在庫の経路（2026年6月末に史上最低、1年そこに留まり、戦前の半分まで回復）。(2) 世界の石油市場の非母数モデル（VARにベイズ加法回帰木BARTと因子確率ボラティリティ、7変数・12ラグ・250本の木）で条件付き予測分布を作り、Brentからガソリン（474都市圏）に換算する。(3) PCEのエネルギー・食料・コアのBART型フィリップス曲線に通す（§1、§2.1、§2.2）。", "p4": "2026年2月までのデータだけを使い、その後の紛争のデータで更新しない。石油市場モデルの尾部予測は、1992〜2019年と2020年1月〜2026年2月で、ランダムウォーク2種とSV付きVARを上回る（§1、§2.1）。評価は、ガソリンとインフレの閾値超過確率、調査（SPF・SME）の事前予想との比較（§3.1、§4.2.2）。", "p5": "実質Brent価格の中央値は2027年半ばに166ドル/バレルへ上がり、2027年末に200ドルを超える確率は28%（§1）。ガソリンの全米中央値は1年足らずで5ドル/ガロンに達し、2027年は毎月4ドル超の確率が86〜95%、6ドル超は同年後半に約30%（§3.1）。総合PCEインフレは2026年12月に約4.8%でピークとなり、2年後に2%を上回る確率は総合86%、コア97%（§1）。家計のインフレ期待は約3ポイント上がって約9%に達する（§4.3）。調査の事前予想は約2.5%で、シナリオの中央値は総合3.7%（2026年）、3.2%（2027年）（§4.2.2）。", "p6": "予測ではなく仮説的な最悪ケースの分析（§1）。在庫の経路は専門家の仮定で、ガソリンへの換算は固定した傾きの経験則。属性別の家計期待は、調査が構成比を公表しないため重みを推定し、積み上げた集計は直接推定より約1ポイント高い（§3.2、§4.3）。", "fun": "ホルムズ海峡が封鎖され、世界の石油の貯金（在庫）が底をついたら、何が起きるか。この論文はそれを「確率」で描きました。貯金がある間は価格が抑えられますが、尽きると一気に上がり、ガソリンが1ガロン5ドルを超える確率は1年後に半分以上、2年後も物価上昇率が2%を超える確率は総合で86%。シナリオの2026年10月のBrent価格は140ドルで、実際は125ドルでした。", "unverified": "§3.2の都市圏別の結果、§4.1のフィリップス曲線の推定の詳細、§4.2.1の図、付録A〜Cは読み切れていない。在庫の経路の妥当性と実績との整合は、2026年10月のBrent以外は未確認。"}}, {"id": "pn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "政権交代で従業員の上級幹部の評価が政治的適合に連動", "title": "The Buck Stops at the Top: Political Transitions and Employees' Evaluations of Leaders Near and Far", "url": "https://doi.org/10.2139/ssrn.7681850", "authors": "Anshuman Mishra", "venue": "SSRN", "date": "2026-11-10", "apa": "Mishra, A. (2026). The Buck Stops at the Top: Political Transitions and Employees’ Evaluations of Leaders Near and Far. https://doi.org/10.2139/ssrn.7681850", "why": "米国連邦職員調査（2014〜2024年、540万件の回答）を使い、2017年と2021年の政権党交代が連邦37機関と政権の政治的適合を逆方向に動かした自然実験で、従業員の評価を比べた。上級幹部への評価は政治的適合に連動し、リベラルな機関では2017年後に低下、2021年後に上昇し、保守的な機関では逆の動きだった。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": true, "p1": "米国の政権交代（2017年・2021年）で政治的適合が変わると、職員の評価が動くのは遠い上級リーダーに対してだけで、直属の上司の評価は動かないという「評価の防火壁」を、連邦職員調査の自然実験で示した（抄録）。", "p2": "政権交代で組織と政権の政治的適合が変わると、職員のリーダー評価はどう変わるか。トリクルダウンの研究は上から直属の上司へ波及すると考え、リーダー距離の理論は、遠いリーダーは価値・象徴・言説で、近いリーダーは扱われ方で評価されるため、適合の喪失は直属の上司に届かないと予想する（抄録）。", "p3": "米国の2回の大統領の政党交代（2017年と2021年）が、ホワイトハウスと37の連邦機関の政治的適合を逆方向に動かした自然実験。2014〜2024年の連邦職員意識調査の540万件の回答で、よりリベラルな機関とより保守的な機関の評価の変化を比べる（抄録）。", "p4": "比べるのは、機関の政治的傾向（リベラル／保守）と政権交代の前後で、同じ職員が同じ調査で答える、上級リーダー・上司の上の管理者・直属の上司の評価と、職務満足、エンゲージメント、推薦意向、離職意向。解釈：差の差に近い比較だが、統制変数や推定式は未確認（抄録のみ）。", "p5": "上級リーダーの評価は政治的適合に沿って動き、リベラルな機関では2017年後に下がり2021年後に上がり、保守的な機関では逆だった。上司の上の管理者の評価は動きが小さく、直属の上司の評価は動かなかった。不適合は職務満足・エンゲージメント・推薦意向を下げ、離職意向を上げ、その損失の多くは上級リーダーの評価の低下と並んで動いた。評価の高い上司は、自分の評価は保ったが損失は和らげなかった（抄録）。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。解釈：機関の政治的傾向の測り方、同時期の他の出来事の影響、回答者の入れ替わりの影響は、抄録からは分からない。", "fun": "政権が変わると、役所で働く人たちは「上のほうの人」への評価を変えるのに、毎日顔を合わせる直属の上司への評価は変えませんでした。540万件の回答から、遠いリーダーは価値観や象徴で、近い上司は接し方で評価される、という見方が支持されます。著者はこれを「評価の防火壁」と呼び、悪い印象の修復は、職員が原因と感じる階層が主に担うべきだと提案しています。", "unverified": "本文を入手できず、識別の詳細（統制変数、推定式、有意性）、効果の大きさ、各機関の政治的傾向の測り方、回答者の入れ替わりの扱いは未確認。"}}, {"id": "pn11", "rank": 11, "field": "開発経済学", "headline": "途上国のグリーン技術は先進国との共同開発で影響が大きい", "title": "Innovation partnerships for development along green value chains", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141792", "authors": "Edet ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "グリーン技術の新興・途上国（EMDE）での発明は、知識波及の価値で測ると質が相対的に高い。影響が最も大きい途上国の発明は途上国と高所得国（HIC）の協働で生まれ、そうした協働はHICの発明の約2%でEMDEの発明の約半分を占める。R&D人員がHICとEMDEの両方にいる多様な企業ほど両側で波及が大きいと示し、R&D減税や開発銀行の共同投資を提案する。", "explain": {"basis": "本文", "basis_note": "オープンアクセス版PDFの本文を読んだ（抄録・§1〜§7、図表の一部）。付録A〜D、表3〜4の全係数は読み切れていない", "preprint": true, "p1": "新興・途上国（中国を除く）の特許の約半数（グリーン技術で48%）は高所得国との共同発明で、知識のスピルオーバーが最も大きいのがこの共同発明であり、世界の大手研究開発企業の途上国比率は低すぎると、特許データで示した（抄録、§1、§4）。", "p2": "途上国のグリーン技術は質が高いが、企業は社会的価値の一部しか得られず投資が不足する。政府・開発銀行の資金は限られるため、高所得国との共同発明が別の資金源になるか、途上国の吸収能力は十分か、多様化が世界のスピルオーバーを損なわないかが問いだった（§1）。", "p3": "2013〜2022年に出願された特許ファミリー（約2000万件）を発明とし、被引用ネットワークから価値とスピルオーバーを推定する（Patent Rank、減衰係数0.5のk乗）。発明者の居住国を高所得国・途上国・中国に分け、研究開発費上位の企業（EU JRCスコアボード、4,474社）の発明を結び、企業ごとに、途上国の発明者を含む発明の割合とスピルオーバーの二次の関係を推定する（§2、§6）。", "p4": "比較は、発明者チームの型（途上国単独・非高所得国の国際・高所得国を含む国際）別のスピルオーバーと限界収益、およびスコアボード企業の途上国比率の違い。企業の活動国数・発明数・研究開発費・費用・私的価値を統制し、5区間の推定も行う（§4、§6）。", "p5": "途上国のグリーン発明は平均8.01百万ドルで、高所得国の全発明の平均7.68百万ドルを上回る（§3）。途上国の発明の47%（グリーンは48%）に高所得国の発明者が加わる（§4）。高所得国を含む共同は、世界へのスピルオーバーが1発明あたり10.75百万ドルで、共同なしの2.07百万ドルを上回り、途上国向けも1.09対0.21百万ドル（§4）。スコアボード企業の途上国比率は平均約2%、中央値は0。途上国比率とスピルオーバーは逆U字で、途上国向けは0.44、高所得国向けは0.39で最大（§5、§6）。", "p6": "0.44は厳密な最適値ではなく、約2%からの引き上げは大きな変化で他の反応も呼ぶ（脚注8）。逆U字の下降側は少数の小規模企業から推定され、慎重な解釈が要る（§6）。大企業ほど多様で質も高いという規模の交絡と逆の因果が懸念され、統制で対処するが残りうる（§6）。スピルオーバーは特許の被引用からの推定で、吸収能力の保守的な見積もり（§4）。", "fun": "途上国の発明のほぼ半分は、先進国の人や企業との共同でした。しかも、そうした共同の発明のほうが、世界に広がる知識の価値が約5倍高い（10.75対2.07百万ドル）のです。大手企業が途上国で研究する割合は、平均でたった約2%。出身国をほどよく混ぜた研究チームほど知識が途上国にも先進国にも広がる、という逆U字の結果が面白いところです。", "unverified": "付録A〜D（Patent Rankの導出、回帰表、簡易シミュレーション）、表3・4の全係数、§3の限界収益の図は読み切れていない。スピルオーバー指標の妥当性は元の研究（Guillard et al. 2021）に依存し、本稿では確認していない。"}}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "競争訴訟の統制変数はモデル選択でなく因果識別で選ぶ", "title": "DAGs in the Courtroom: Good and Bad Controls in Competition Litigation&nbsp;", "url": "https://doi.org/10.2139/ssrn.7681576", "authors": "Peter L. Ormosi ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Ormosi, P. L., & Bönisch, P. (2026). DAGs in the Courtroom: Good and Bad Controls in Competition Litigation&nbsp; https://doi.org/10.2139/ssrn.7681576", "why": "競争訴訟の価格弾力性・過剰請求・転嫁率の推定で、専門家が「何でも入れる」統制変数の選び方をしがちだが、統制の選択は適合ではなく因果識別の問題だと論じる。処置（反競争的行為）の前に決まる変数が適切で、行為の影響を受ける変数や効果の経路上の変数を統制するとバイアスが生じる。有向非巡回グラフ（DAG）で良い統制・悪い統制の原則を整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（Crossref。本文は入手できず）", "preprint": true, "p1": "競争法訴訟で、価格の過大請求（オーバーチャージ）や価格転嫁の推定に使う統制変数を、「あてはまりの良さ」でなく「因果の識別」から選ぶ原則を、有向非巡回グラフ（DAG）で整理し、カルテルの例で示した（題名、抄録）。", "p2": "実務では、使える変数を何でも入れる「キッチンシンク」流の統制が多く、統制の選択がモデル選択の問題として扱われる。しかし統制の選択は、本来は因果の識別の問題である（抄録）。", "p3": "適切な統制は、疑われる行為（反競争的行動）より前に決まる変数で、事前の差を取り除いて行為の効果を分離する。不適切な統制は、行為自身に影響される変数や、効果が伝わる経路上の変数で、統制すると効果の一部を消したり、見せかけの関係を作ったりする（抄録）。", "p4": "検証は、カルテルの過大請求の推定の例で、因果の理屈に基づく統制の選択が、結果の頑健さと解釈のしやすさをどう改善するかを示す形。データ・比較対象・評価指標は未確認（抄録のみ）。", "p5": "不適切な統制は、弾力性・過大請求・価格転嫁の推定にバイアスを生む。因果の理屈に基づく統制の選択は、経済的に意味があり、法的にも守れる証拠を与える（抄録）。具体的な数値は未確認。", "p6": "未確認（抄録に限界の記述がなく、本文を入手できず）。抄録には、この論文がCinelli et al.（2024）に強く触発されたとの注記がある。", "fun": "裁判で「談合（カルテル）で値段が何%上がったか」を計算するとき、使える変数を全部入れて当てはまりを良くしようとする専門家が多いそうです。でも、談合の結果として動く変数まで入れると、見たい効果そのものを消してしまいます。この論文は、何を入れるかは当てはまりの良さでなく、因果の矢印で決めようと訴えます。", "unverified": "本文を入手できず、具体的な事例の数値、DAGの描き方、誤りの種類（経路上の変数など）の分類、推奨する手順は未確認。"}}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "表形式の基盤モデルは因果効果の推定でも従来学習器に勝る", "title": "Does Predictive Performance Translate to Causal Performance? Evaluating tabular foundation models as nuisance learners for causal effect estimation", "url": "https://arxiv.org/abs/2611.11381", "authors": "Andrew R Weckstein ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Weckstein, A. R., Dahabreh, I. J., Zitnik, M., Hernández-Díaz, S., & Schneeweiss, S. (2026). Does Predictive Performance Translate to Causal Performance? Evaluating tabular foundation models as nuisance learners for causal effect estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11381", "why": "事前分布で学習した表形式の基盤モデル（PFN：TabPFN・Mitra）を、二重頑健推定量の傾向スコア・結果回帰の学習器として評価した。単純なパラメトリック設定では正しく特定した回帰と同等で、複雑な設定ではSuper Learnerを含む従来の学習器より精度・不確実性の評価とも優れ、標本が増えると2つのPFNだけが名目の信頼区間被覆に近づいた。", "explain": {"basis": "本文", "basis_note": "arXiv PDFの本文を読んだ（抄録・はじめに・方法・結果の主要部分・考察）。付録S1〜S2、表の全数値は読み切れていない", "preprint": true, "p1": "表形式データの事前学習済み基盤モデル（TabPFNなどのPFN）を、二重頑健推定量の局外関数の学習器に使うと、予測が良いだけでなく、平均因果効果の推定の精度と信頼区間の被覆率でも、従来の学習器やSuper Learnerを上回るかを、シミュレーションで評価した（抄録）。", "p2": "二重頑健推定とクロスフィッティングは、回帰や木のような従来の学習器で検証されてきた。PFNは事前学習済みで、文脈内学習により重みを更新せずに予測するため、同じ枠組みで機能するか、クロスフィッティングの役割が不明だった（はじめに）。", "p3": "傾向スコアと結果回帰（局外関数）の学習器を入れ替え、AIPWとTMLEで平均因果効果（ATE）を推定する。比べる学習器は、GLM、ランダムフォレスト、HAL、TabPFN（v3、調整なしの既定設定）と、3種のSuper Learner。クロスフィッティングあり・なしで評価する（方法）。", "p4": "シミュレーション1は合成データ（4つの共変量、真の効果6、単純／複雑な交絡、n=200・1200・5000、各200回）。シミュレーション2は、実共変量（4,802組の母子）に基づく44のデータ生成過程×50回のplasmode。指標は、バイアス、RMSE、95%信頼区間の被覆率、標準誤差の較正（方法）。", "p5": "単純な設定では、PFNは正しい回帰に近い（バイアス1〜2%、被覆率95〜96%）。複雑な設定では、PFNがバイアス10%未満・被覆率90〜91%で最良、最良の従来学習器（SL Flexible）でもバイアス15%・被覆率66%。n=5000ではTabPFNのバイアスが2%未満、Super Learnerは8〜10%、HALと回帰は28〜30%程度（結果）。シミュレーション2では、クロスフィットのTMLEで相対バイアス0.8%（次点1.6%）、ATEの35個すべてで最小のRMSE。n=200や高次元でクロスフィットなしだと被覆率が低く、傾向スコアの過学習とみられる（結果、抄録）。", "p6": "シミュレーションのみで、平均因果効果・連続の結果・2値の処置に限り、識別可能性は常に保証される。媒介変数・合流点・操作変数を含む状況や、大きなデータでの実用性は未検証。PFNの性能は事前学習の分布が現実の構造をどれだけ含むかに依存しうる。plasmodeの被覆率は反復50回で慎重に読む（結果、考察）。", "fun": "AIに「大量の練習問題（合成データ）」を先に解かせておき、本番の問題は追加の勉強なしで、問題文を見せるだけで答えさせる。それがTabPFNです。この論文は、原因を探る統計の計算にこの「練習済みAI」を使うと、専門家が手間をかけて組むアンサンブルより、推定が正確で誤差の見積もりも当たりやすいことを確かめました。ただし標本が少ないと、処置のラベルを丸暗記して失敗することもありました。", "unverified": "付録S1〜S2の追加結果、図5以外の図、表1の全数値、Mitraの詳細な結果は読み切れていない。TabPFNの事前学習データの内容は先行研究に依存し、確認していない。"}}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "忠実性に頼らない因果探索：自然性原理で部分識別", "title": "Causal Discovery Grounding and the Naturalness Assumption", "url": "https://arxiv.org/abs/2611.10388", "authors": "Guilherme P. Soares ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Soares, G. P., Koukorinis, A., Beckers, S., Fawkes, J., Watson, D. S., & Silva, R. (2026). Causal Discovery Grounding and the Naturalness Assumption (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10388", "why": "標準の因果探索は条件付き独立がDAGと厳密に対応するという忠実性を仮定するが、近似的な破れは厳密な破れと区別できない。観測上の関連の強さが因果依存の強さを抑えるという「自然性」の原理を導入し、未知の抑制関数をベイズで扱って別の研究の実験結果で補強する。未観測交絡を除外できるかを調べ、因果効果の部分識別への有用性を示した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§4.1・§7・§9）。§2〜§3、§4.2〜§6、付録は読み切れていない", "preprint": true, "p1": "独立性が厳密に成り立つとするfaithfulnessの代わりに、観測上の関連の強さが因果的な依存の強さを抑えるという「自然さ」の原理を導入し、過去のRCTでその許容幅を学習して、観測データだけの現場で条件付き因果効果の区間を求められるようにした（抄録、§1、§9）。", "p2": "標準的な因果探索は、観測分布の条件付き独立がDAGの独立と厳密に対応するとするfaithfulnessに頼るが、近似的な破れと厳密な独立は区別できず、因果効果の識別に隙が残る（抄録）。", "p3": "2つの自然さの原理（NP1・NP2）は、観測（idle）レジームでの近似的な独立と、処置との十分強い関連があれば、隠れ変数に関する近似的な独立が、問題の族で共有される許容幅の関数の範囲で成り立つとする（§4、§9）。この未知の関数を、RCTと観測標本の対がある現場でベイズ的に学び、観測データだけの現場の効果に上下限を付ける（§9）。", "p4": "3つの半合成実験で、Manski境界、Balke–Pearl境界、CB-IPW/CB-DR、オラクルB-Learnerと、境界の幅と、真のRCT効果を含む割合（ヒット率）で比べる。実験IはManyLabsの3つのRCT（ターゲットは約1310人）、実験IIはTwins、実験IIIは不確実性を伝播するベイズ版（§7）。", "p5": "ManyLabsでは、reciprocityのβ=2でヒット率が0.64（Balke–Pearlは0.72）に下がるが、雑音の共変量15個を足しても幅0.46・ヒット率0.90を保つ（§7.2）。Twinsでは結果の出た404条件で、平均の幅が0.425で、Manskiの1.000、Balke–Pearlの0.958より狭い（§7.3）。ベイズ版では、Manskiより常に狭く（幅0.53〜0.95対1）、真の効果を含む割合は91〜99%。Balke–Pearlは狭いが、β=2で含む割合が87%、82%、48%に落ちる（§7.4）。", "p6": "過去の現場にRCTと観測標本の対があること（D2）が前提で、バイアスや測定誤差のない理想的なRCTを仮定し、扱うのは処置・結果・処置前の共変量の特定の問題に限る（§1）。Twinsで結果が出たのは720条件中404条件。ソースを1拠点除くと36の組み合わせのうち33で許容幅が0.05超動く。不確実性を伝播すると幅は約1.75倍。半合成データのみ（§7）。", "fun": "観測データだけで「原因と結果が本当につながっているか」を知るには、「関係がない所はぴったり関係がない」という厳密な前提を置くのが普通です。でも現実には、「ほぼ関係がない」と「ぴったり関係がない」は見分けられません。この論文は、前提を「関連が強いほど因果の強さの上限も決まる」とゆるめ、そのゆるさの度合いを、昔の実験（RCT）の結果で目盛り合わせして使います。", "unverified": "§2（拡張条件付き独立）、§3の仮定、§4.2〜§4.4、§5〜§6のアルゴリズムの詳細、付録の証明と追加の実験結果は読み切れていない。NP1・NP2の技術的な条件（εとε′の関係）は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "クラスター無作為化試験の媒介を処置後の交絡下で識別", "title": "Semiparametric causal mediation analysis in cluster-randomized trials with post-treatment confounding", "url": "https://arxiv.org/abs/2611.11903", "authors": "Daeyoung Ham ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Ham, D., Cheng, C., & Li, F. (2026). Semiparametric causal mediation analysis in cluster-randomized trials with post-treatment confounding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11903", "why": "クラスター無作為化試験の媒介分析で、処置が媒介変数と結果の交絡を生む場合でも使える介入的媒介効果の半パラメトリックな枠組みを作った。クラスター内の干渉を許し、間接効果を自分の媒介変数経由と他のメンバー経由に分解し、効率的影響関数に基づく推定量の多重頑健性と漸近正規性を示した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文を読んだ（抄録・§1・§2・§6・§7・§8）。§3〜§5と付録は読み切れていない", "preprint": true, "p1": "クラスター無作為化試験で、処置が媒介変数と結果の共通原因を変える（処置後の交絡）場合でも、クラスター内の干渉を許して、介入的な直接・間接効果と、間接効果を「自分の媒介変数」経由と「他の人の媒介変数（波及）」経由に分ける半母数の枠組みを示した（抄録）。", "p2": "既存の方法は自然媒介効果が中心で、処置が媒介変数と結果の共通原因を変えると識別できず、検証できない制約が要る。クラスター内の干渉も加わるとさらに難しい（§1）。", "p3": "処置aのもとで、クラスターの媒介変数ベクトルを処置a'のもとでの分布から確率的に引き直した結果の平均θ(a,a')で、直接効果IDE=θ(1,0)−θ(0,0)、間接効果IIE=θ(1,1)−θ(1,0)を定義する。IIEは、自分の媒介変数だけを替える部分（IIME）と、他の人の媒介変数を替える部分（ISME）に分かれる（§2）。効率的影響関数からクロスフィット推定量を作り、低次元の再表現で密度推定を減らす（§1）。", "p4": "シミュレーションは、クラスター数Kを4通りに変え、各2,000試験、5分割のクロスフィット。4つの局外関数の正誤の全16通りで、g計算（プラグイン）と比べる。実データはPPACT試験（106クラスター、850人）で、認知行動療法の12か月後の疼痛の影響への効果を、6か月後の障害度（RMDQ）を媒介変数、診療への満足度を処置後の交絡として分析する（§6、§7）。", "p5": "全て正しい場合（C-1111）は標準の推定量がほぼ不偏で、Kとともに性能が上がり、被覆率は名目に近い。多重頑健性の条件が満たされる組では誤りがあっても不偏で、満たされない組（C-1101のISME）では偏りが残る（§6.1）。PPACTでは、総効果が−0.54〜−0.46、直接効果が−0.27〜−0.15で有意でなく、間接効果は負で、自分のRMDQ経由が主（IIMEは−0.31〜−0.24）、波及（ISME）は−0.12〜0.10で全て0を含む。低次元の推定量は区間が広く、IIEが0を含む（§7）。", "p6": "識別には、処置後の交絡を含めて測った変数のもとで媒介変数と結果が交換可能であること（A3）と、クラスター間の干渉がないことが必要。介入効果は仮想の介入の効果で、直接と間接の和が総効果に一致するとは限らない（§2）。複数の媒介変数への拡張と、残る交絡への感度分析は今後の課題（§8）。", "fun": "試験で「治療が効いた理由」を調べたいとき、診療所のようなグループの中で効果が仲間に伝わると、話が複雑になります。この論文は、「全員の媒介変数（例：痛みによる生活の障害の程度）を、治療群の分布から引き直したら？」という仮想の実験で、効果を「自分の変化」経由と「仲間の変化」経由に分けました。実データでは、効果は主に自分の変化経由で、仲間経由ははっきり見えませんでした。", "unverified": "付録A〜I（定理の証明、局外関数の推定、追加の数値）、§3〜§5の効率的影響関数の式と漸近的性質の条件、低次元の推定量の詳しい結果（図3・4）は読み切れていない。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "反復アルゴリズムの軌跡全体に同時推測を与える", "title": "Algorithm-aware Statistical Inference in High-dimensional Estimating Equations", "url": "https://arxiv.org/abs/2611.12287", "authors": "Tongyu Li ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Li, T., & Giessing, A. (2026). Algorithm-aware Statistical Inference in High-dimensional Estimating Equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12287", "why": "高次元の推定方程式を反復で解くアルゴリズムの標本不確実性を、反復ごとの母集団推定対象に対する同時推測として定式化した。元のアルゴリズムを繰り返し動かさず、観測した軌跡に沿って摂動を伝える固定ヤコビアン・ブートストラップを提案し、疎な線形回帰・フィッシャー判別・時間差分学習で被覆を確認した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "反復アルゴリズムの途中の推定値の軌跡全体に、同時に成り立つ信頼区間を与える推測の方法ができた。", "p3": "高次元の推定方程式で生成した離散的な軌跡を対象に、反復ごとの母集団の推定対象（アルゴリズムの正則化を保つ）に対する同時推測を作る。元の非線形アルゴリズムを何度も動かさず、観測した軌跡に沿って摂動を伝える固定ヤコビアン・ブートストラップを提案する（抄録）。", "p5": "安定性・エントロピー・モーメントの条件のもとで、無限個でありうる対比と反復にわたる一様な1次展開とブートストラップの妥当性を示した。疎な線形回帰・対の判別分析・時間差分学習のシミュレーションで同時被覆が正確で、マイクロ無作為化試験の処置軌跡の推測にも適用した（抄録）。", "fun": "機械学習は、答えに少しずつ近づく計算を何百回も繰り返しますが、その途中の値がどれだけ当てになるかは普通は分かりません。この研究は、計算を最初からやり直さずに、途中の値の「誤差の幅」を全部の回について同時に出す方法を作りました。計算の途中経過の信頼度まで測れるのが面白い点です。", "unverified": "本文未読のため、条件の詳細とシミュレーションの数値、適用例の結果は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "退化した交換可能配列のU統計量の一様な推測", "title": "Uniform inference for $U$-statistics of exchangeable arrays under degeneracy", "url": "https://arxiv.org/abs/2611.11388", "authors": "T\\^am LeMinh", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "LeMinh, T. (2026). Uniform inference for $U$-statistics of exchangeable arrays under degeneracy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11388", "why": "行列交換可能な配列のU統計量は自然な帰無仮説で退化し、収束率や極限分布が変わる。退化の次数を知らなくても、古典的な不偏分散推定量による推測が一様に妥当となる条件（非連結グラフに対応する射影の分散割合が0に収束）を示した。行・列のジャックナイフ分散推定量は、退化下で標準正規の極限を与えるとは限らないと指摘する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "行・列で交換可能な配列のU統計量が退化しても、古典的な分散推定量による推測が一様に使える条件を示した。", "p3": "U統計量を、2部グラフで添字づけた直交射影に分解する。一様な4次モーメントの仮定のもとで、非連結なグラフの射影の集中の尺度が0に向かうなら、標準化統計量が漸近的にガウス分布に従い、古典的な不偏分散推定量が比で一致することを示す。射影が正規化されたコンパクト性を満たせば、この条件は必要十分になる（抄録）。", "p5": "各グラフが連結成分の数に等しい次数のWiener chaosに寄与するという一般的な極限定理から、条件の必要性が従う。行・列のジャックナイフ分散推定量は非負だが、退化した場合に標準正規の極限をもつ標準化統計量を一般には与えない。積の形からの距離に基づく推定・検定の例で、モデルに応じた速度のガウス・非ガウスの極限を示し、ガウス極限を要しない保守的な推測も提案した（抄録）。", "fun": "「2人組の関係」のデータ（たとえば、ユーザーと商品の評価の表）の統計は、仮説が正しいときに計算の性質が急に変わることがあり、普通の誤差の見積りが使えなくなります。この研究は、その性質の変わり方を知らなくても、いつものやり方で安全に推測できる条件をぴったり特定し、ジャックナイフ法が危ない場合まで指摘します。どこまで安全かの境界線を引くのが面白い点です。", "unverified": "本文未読のため、定理の仮定の細部と、応用例の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "コンフォーマル最高密度集合の被覆と形のミニマックス理論", "title": "Coverage and shape of conformal highest-density sets: A minimax theory", "url": "https://arxiv.org/abs/2611.11909", "authors": "Ilsang Ohn", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Ohn, I. (2026). Coverage and shape of conformal highest-density sets: A minimax theory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11909", "why": "条件付き最高密度集合の過剰体積を被覆誤差と過剰質量に分解し、被覆誤差のミニマックス率は共変量の非パラメトリック回帰の率、過剰質量は条件付き密度推定率の2乗であると示した。通常の分割コンフォーマルは単一の閾値で較正するため遅い方の率になりうると証明し、共変量への回帰で被覆を推定する二段階較正を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "コンフォーマル予測の最高密度集合について、被覆の誤差と集合の形の精度がどこまで良くなりうるかをミニマックスの理論で示し、それを達成する二段階の較正を提案した。", "p3": "条件付き最高密度集合の過剰体積を、被覆誤差と過剰質量に分解する。通常の分割コンフォーマルは単一の閾値で較正するので、密度推定の偏りを共変量について平均的にしか補正しない。そこで密度推定の上位集合の被覆を共変量への回帰で推定し、それを適合度スコアに使う二段階較正を提案する（抄録）。", "p5": "体積が定数倍まで正確な手順のうち、被覆誤差の最小の速さは共変量の非パラメトリック回帰の速さ、過剰質量は条件付き密度推定の速さの2乗であることを示した。通常の分割コンフォーマルの被覆誤差は遅い方の密度の速さになりうる。局所多項式の密度推定を使う二段階較正は、対数因子を除いて両方のミニマックスの速さを達成し、シミュレーションと自転車シェアの需要への適用で結果を示した（抄録）。", "fun": "「次の値はほぼ確実にこの範囲に入る」という予測の範囲を作るとき、どこでも同じ品質で成り立つように作るのは意外に難しい問題です。この研究は、予測の範囲を、確率の高い所を集めた「いちばん狭い集合」にして、その狭さと正しさの限界を数学で決めました。予測の範囲を、正しく、しかもできるだけ狭くする方法の限界が分かるのが面白い点です。", "unverified": "本文未読のため、速さの条件・正則性の仮定、数値実験の結果は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "単一時系列の多段予測に条件付き被覆を与えるコンフォーマル法", "title": "Conformal Prediction for Multi-Step Forecasting: Conditional Coverage and Sharp Score Calibration Rates", "url": "https://arxiv.org/abs/2611.12004", "authors": "Siyuan He ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "He, S., & Yang, Y. (2026). Conformal Prediction for Multi-Step Forecasting: Conditional Coverage and Sharp Score Calibration Rates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12004", "why": "定常な単一時系列の1ステップ・多ステップ予測で、時間依存とローリング推定による重なりを考慮するカーネル型のコンフォーマル法TRACKを提案した。残差スコアの条件付き分位点を推定して予測集合を作り、重なる窓が較正と被覆に与える影響を、有限標本の上界と一致するミニマックス下界で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "単一の定常時系列の多段階予測に、時間依存と重なる窓の影響を考慮して条件付き被覆を与えるコンフォーマル法TRACKができた。", "p3": "ローリング窓の予測器から、残差スコアの条件付き分位点をカーネルで推定して予測集合を作る。予測器の記憶と予測の期間が標本数とともに増えることを許し、地平線ごとに異なる不確実性とローリング推定が生む依存を扱う。有限標本の上界と、既知のスコアの族に対するミニマックス下界を導いた（抄録）。", "p5": "有限標本の上界は、時間依存と重なるスコア窓が較正と被覆にどう影響するかを定量化し、ミニマックス下界と一致する。シミュレーションと風力発電・自転車シェア需要への適用で、区間の幅を競争的に保ちながら、領域ごとの条件付き被覆を改善した（抄録）。", "fun": "天気や需要の予測では、「明日の値」と「来週の値」のように、先の予測ほど不確かさが大きくなります。この研究は、予測の幅を先に行くほどちゃんと広げ、しかも「ここは外れやすい」という場面ごとの当たる確率まで保証する方法を作りました。外れる確率を、場面ごとに正直に出せるのが面白い点です。", "unverified": "本文未読のため、定理の条件と数値結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "誤差を含む補助情報でも非確率標本の選択バイアスを補正", "title": "Inference for Non-Probability Samples Using Error-Prone Auxiliary Information", "url": "https://arxiv.org/abs/2611.10975", "authors": "Lyndon Ang ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Ang, L., Clark, R., Loong, B., & Holmberg, A. (2026). Inference for Non-Probability Samples Using Error-Prone Auxiliary Information (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10975", "why": "非確率標本の参加確率を、参照標本の補助情報に誤差があっても推定する半パラメトリックな方法を提案した。参加確率のロジスティック回帰と、誤差を含む補助変数のノンパラメトリックなカーネル回帰を組み合わせ、逆確率重みづけ推定量の一致性とブートストラップ分散を示す。シミュレーションと実データで、誤差を無視する方法に残るバイアスを軽減した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "非確率標本の選択バイアスを補正するとき、補助情報（参照標本）に測定誤差があっても使える参加確率の推定法ができた。", "p3": "参加確率のロジスティック回帰と、誤差を含む補助変数のノンパラメトリックなカーネル回帰を組み合わせる半パラメトリックな方法を提案する。この参加確率で作った逆確率重みづけ（IPW）推定量の一致性を示し、ブートストラップによる分散推定も述べる（抄録）。", "p5": "シミュレーションと実データの分析で、選択バイアスを効果的に軽減し、測定誤差を考慮できる。誤差を無視する方法の推定には一部バイアスが残る（抄録）。", "fun": "インターネット調査のように、誰でも参加できる調査は、参加した人が偏っています。その偏りを直すには、国全体の分かっている情報と比べますが、その比べる情報にも誤差があることがあります。この研究は、基準側の誤差まで考えに入れて偏りを直す方法を作りました。ものさし自体のずれを直すのが面白い点です。", "unverified": "本文未読のため、シミュレーションの設定、実データ、推定量の分散の評価は未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "行政担当者の格差と一致度を割当の難しさを除いて測る", "title": "Measuring Public Institutions and their Agents: Disparities and Agreement, with Application to Asylum Decisions in the U.S. Immigration Courts", "url": "https://arxiv.org/abs/2611.10308", "authors": "Jonathan Auerbach ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Auerbach, J., & Sobel, M. E. (2026). Measuring Public Institutions and their Agents: Disparities and Agreement, with Application to Asylum Decisions in the U.S. Immigration Courts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10308", "why": "公的機関で担当者ごとに割り当てられる事案が違うと、単純な比較は割当の難しさを映してしまう。同じ事案群を担当しえた無作為の同僚との比較で格差と一致度の尺度を作り、格差は各担当者の行動の周辺分布から識別でき、一致度は感度分析の仮定のもとで上下界や推定ができると示した。2007〜2014年の米国移民裁判所の難民申請に適用し、限定的な格差と大きな潜在的一致を見いだした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "行政機関の担当者の格差と一致の度合いを、割り当てられた事案の難しさを除いて測る尺度を作り、米国移民裁判所の難民申請に適用した。", "p3": "担当者ごとに事案が違うと、単純な比較は割当の難しさを映す。同じ事案群を担当しえた無作為に選んだ同僚の潜在的な成績と、その担当者を比べる格差と一致の尺度を作る。格差は各担当者の行動の周辺分布から識別でき、担当者が異なる事案を扱う場合に識別できない一致は、潜在結果の依存についての感度分析の仮定のもとで上下界が付く（抄録）。", "p5": "2007〜2014年の難民申請にノンパラメトリックなベイズモデルを適用すると、先行の実証研究が主張する広範な偏りの像は支持されず、裁判官・裁判所の水準で、格差は限られ、潜在的な一致は大きい（抄録）。", "fun": "裁判官ごとの判断のばらつきを「偏りがある」と言うには、担当した事件の難しさの違いを取り除かなければなりません。この研究は、くじ引きで同僚と担当を入れ替えたら判断はどれだけ違うかを基準にして、公平に比べる物差しを作り、悪名高い移民裁判所でも格差は思ったより小さいことを示しました。比べ方が結論を変えるのが面白い点です。", "unverified": "本文未読のため、ベイズモデルの詳細と数値結果は未確認。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "クラスター水準の未測定共変量を変分オートエンコーダで補正", "title": "Causal Machine Learning for Multilevel Studies with Unmeasured Cluster-Level Covariates via Variational Autoencoders", "url": "https://arxiv.org/abs/2611.11483", "authors": "Youmi Suk ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Suk, Y., & Li, Y. (2026). Causal Machine Learning for Multilevel Studies with Unmeasured Cluster-Level Covariates via Variational Autoencoders (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11483", "why": "多水準データの観測研究で、未測定のクラスター水準の交絡を、結果と処置の残差のクラスター内の依存から変分オートエンコーダで推定するVAE-Rラーナーを提案した。条件付き平均処置効果と平均処置効果の推定で、通常のR-ラーナーのバイアスをほぼ除去し、複数サイトの無作為化試験では精度を改善することをシミュレーションで示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "多水準データで、測られていないクラスター水準の交絡を変分オートエンコーダで補う因果機械学習の方法VAE-Rができた。", "p3": "結果と処置の残差のクラスター内の依存から、変分オートエンコーダ（VAE）で未測定のクラスター水準の共変量を推定し、その調整で条件付き平均処置効果（CATE）と平均処置効果（ATE）を推定する。VAEの復号は、測定済みの共変量で説明できないクラスター水準の変動だけを潜在変数が捉えるオフセット尤度で指定する。潜在次元とKL重みの2つのハイパーパラメータの選び方も示す（抄録）。", "p5": "シミュレーションで、多水準の観測データでは通常のR-ラーナーのCATE・ATE推定のバイアスをほぼ除き、複数サイトの無作為化試験では精度を改善した。多水準の観測研究と複数サイトの無作為化試験の2つのデータで例示した（抄録）。", "fun": "学校ごと・地域ごとに違う、測られていない事情（校風や地域性）は、成績への影響を調べるときに見えない落とし穴になります。この研究は、同じ学校の中での結果と処置の似方のくせから、見えない事情をAIで推測して取り除きます。見えないものを、集団内の似方から推し量るのが面白い点です。", "unverified": "本文未読のため、シミュレーションの数値、実データの内容、ハイパーパラメータ選択の詳細は未確認。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "処置後しか観測できない地点にも使える合成コントロール", "title": "Graph-regularized synthetic control for spatial panels with post-only treated locations", "url": "https://arxiv.org/abs/2611.11496", "authors": "Hajime Seya ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Seya, H., Moriwaki, R., & Murakami, D. (2026). Graph-regularized synthetic control for spatial panels with post-only treated locations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11496", "why": "空間パネルで処置前の結果履歴がない処置地点のドナー重みを、地理的に近い地点は似た重みを使うよう同時に推定するGraph-SCMを提案した。経済的な類似性で辺の強さを調整するGeoEco-SCMもあり、モンテカルロでは共変量バランス法に勝つ設定もあるが、どの方法も他を支配しないと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "処置の前の結果の履歴がない地点でも使える合成コントロールとして、地理的に近い地点が似たドナーの組合せを使うよう同時に推定するGraph-SCMが提案された。", "p3": "処置地点ごとのドナー重みを、地理的に近い地点が似た重みになるよう促しながら同時に推定する（Graph-SCM）。同じ地理グラフの辺の強さを、処置前の経済的な類似性で調整するGeoEco-SCMもある。履歴が完全・一部・まったくない場合を、1つの凸な重み推定問題で扱う（抄録）。", "p5": "モンテカルロ実験で、共変量バランス型の合成コントロール、等重みのドナー平均、推定可能な場合の通常の合成コントロール、時空間の補完・直接予測と比べると、どの方法も他を支配しない。グラフによる借用は共変量バランスを上回る設定が複数あるが、選択的被覆の設計では共変量バランスが有利。地理だけで関連するドナーを見逃すとき、経済的な調整が役立つ（抄録）。", "fun": "「ある町に新しい政策を導入して、その効果を測りたい」とき、導入前のデータがない町では、比べる相手（似た町の組合せ）を選べません。この研究は、「隣り合う町は似た相手を使うはず」という地理の手がかりで、その選び方を決めます。結果は、どの方法も常に最良ではないという正直なものです。データの足りなさを地図で補う発想が面白い点です。", "unverified": "本文未読のため、モンテカルロの設計と、各設定での数値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "社会規範の特定の誤りが同調の推定と介入配分を歪める", "title": "When the Norm is Wrong: Social Norm Misspecification and Targeting with an Application to Microfinance Adoption", "url": "https://arxiv.org/abs/2611.12255", "authors": "Shantanu Chadha", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Chadha, S. (2026). When the Norm is Wrong: Social Norm Misspecification and Targeting with an Application to Microfinance Adoption (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12255", "why": "仲間効果の構造モデルで規範を平均や極値で恣意的に置く誤りを、離散選択へ拡張した一定の代替弾力性（CES）規範で扱った。不完全情報の二値選択ゲームで均衡の存在・一意性・識別を示し、インドのマイクロファイナンス採用データでは強い最大値寄りの規範と村ごとの違いを見いだし、線形規範で補助金配分を決めると標的が大きく変わると示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "仲間効果の構造モデルで社会規範の形を誤ると、推定とターゲティングが大きく歪むことを、規範の形が柔軟なモデルで示した。", "p3": "平均や極値を恣意的に仲間の影響とする仕様に代え、連続選択の代替弾力性一定（CES）規範を離散選択へ拡張する。不完全情報の二値選択ゲームで合理的期待均衡の存在・一意性と構造パラメータの識別条件を導き、Nested Pseudo-Likelihood推定量をスペクトルアルゴリズムで実装する（抄録）。", "p5": "モンテカルロで、CES推定は標本が増えると真値に近づく一方、線形規範を課すと大標本でもバイアスが残る。インドのマイクロファイナンス採用データでは、強い最大値寄りの規範と、カースト構成・富で分けた村ごとの曲率・仲間効果の有意な異質性を見いだした。固定の補助金予算の反事実で、推定した規範と線形規範は大きく違う世帯を標的にし、前者は村の「リーダー」を優先した（抄録）。", "fun": "友だちの影響の測り方には、「友だちの平均」を見る方法と「いちばん積極的な友だち」を見る方法があります。インドの村のマイクロファイナンスのデータでは、「いちばん積極的な人」に引っ張られる傾向が強いと分かりました。測り方を誤ると、補助金を配る相手まで変わってしまうのが面白い点です。", "unverified": "本文未読のため、モンテカルロの数値、推定した曲率の値、データの詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "Transformerは層とモジュールを組で選んで探るとよい", "title": "Probing Transformer Representations Layer by Layer, Module by Module", "url": "https://arxiv.org/abs/2611.11531", "authors": "Ambroise Odonnat ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Odonnat, A., Gnassounou, T., Chapel, L., Tavenard, R., & Redko, I. (2026). Probing Transformer Representations Layer by Layer, Module by Module (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11531", "why": "ビジョン基盤モデルとLLMの144,000回超の線形プロービングで、最終層の残差流より、層とモジュールの最良の組合せのほうが大きく改善することを示した。視覚では最終層のフィードフォワード活性（Act@100）、言語では深さ60%の2つ目の正規化層（LN2@60）の固定戦略が、最良の組合せの利得の平均42%・86%を回復する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "Transformerのどの表現を線形プローブで調べるべきかを、層とモジュールの組合せで調べ、最終層より良い単純な固定戦略を示した。", "p3": "ビジョン基盤モデルとLLMで、144,000回を超える線形プロービング評価を行い、層とモジュールを別々でなく同時に選ぶべきかを調べた（抄録）。", "p5": "最良の層とモジュールの組合せの利得は、残差流を固定した最良の層より大きく、モジュールの性能は層ごとに大きく変わる。視覚の固定戦略は最終層のフィードフォワード活性（Act@100）、言語は深さ60%の2つ目の正規化層（LN2@60）。基準のプロービングを多くの評価で上回り、最良の組合せの利得の平均42%（視覚）・86%（言語）を回復した。視覚基盤モデルでは、事前学習と下流データの転移が難しいほど利得が大きい（抄録）。", "fun": "AIの中身を調べるとき、「出力に一番近い最後の層」を見るのが普通でしたが、途中の層のほうが情報がよく取り出せることがあります。さらに各層の中の部品（フィードフォワードや正規化など）まで細かく選ぶと、もっと良くなることを144,000回を超える実験で確かめました。中身のどこを見るかで、AIが「知っていること」の見え方が変わるのが面白い点です。", "unverified": "本文未読のため、対象としたモデルとデータセットの一覧、評価指標は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "プラトン的表現仮説は新しい言語モデルでも条件つきで成立", "title": "Where Does Alignment Emerge and What Does It Mean? A Closer Look at the Platonic Representation Hypothesis", "url": "https://arxiv.org/abs/2611.12869", "authors": "Julia Herbst ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Herbst, J., Roschmann, S., Bouniot, Q., & Akata, Z. (2026). Where Does Alignment Emerge and What Does It Mean? A Closer Look at the Platonic Representation Hypothesis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12869", "why": "ニューラルネットの表現が収束するというプラトン的表現仮説（PRH）を、層・次元ごとの整合から再検討した。キャプションが十分に清浄で情報があれば、能力と整合の傾向は新しいモデルでも続く。単一モダリティのモデル間の整合は、明示的に整合させた視覚言語モデルを上回りうるが、同一モダリティのモデル同士の整合には遠く及ばない。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ニューラルネットの表現が収束するというプラトン的表現仮説（PRH）が、言語モデルと視覚モデルの間で、どの層・次元で、どの条件のもとで成り立つかを検討し直した。", "p3": "単一モダリティのモデルどうしの整合がモデルの層と表現の次元のどこで生じるかを調べ、新しい言語モデルでも能力と整合の傾向が続くかを検討する。深さと幅で交絡する類似度指標に、単一モダリティと多モダリティの基準を導入して解釈する（抄録）。", "p5": "キャプションが十分に清浄で情報があれば、能力と整合の傾向は新しいモデルでも続く。単一モダリティのモデルの異種モダリティ間の整合は、明示的に整合させた視覚言語モデルを上回りうるが、同じモダリティのモデル間の整合には大きく及ばない（抄録）。", "fun": "別々に学習した「絵を見るAI」と「言葉を読むAI」の頭の中が、だんだん似てくるのではないか、という仮説の検証です。調べてみると、似ているかどうかは、入力に添える説明文が良いかどうかに左右されるうえ、同じ種類のAI同士ほどには似ていないことが分かりました。「似てきた」という印象を、比べ方の基準から見直すのが面白い点です。", "unverified": "本文未読のため、評価したモデルとデータセット、整合の指標の値は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "推論の見かけ上の相関への依存を重み編集で抑える", "title": "SWEET: Mitigating Spurious Feature Reliance in LLM Reasoning via Weight Editing", "url": "https://arxiv.org/abs/2611.10974", "authors": "Zhizhang Fu ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Fu, Z., Zhao, L., Korakakis, M., Ding, M., Szpruch, L., & Zhang, Y. (2026). SWEET: Mitigating Spurious Feature Reliance in LLM Reasoning via Weight Editing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10974", "why": "LLMの推論が無関係な妨害文で乱れる（偽の相関への依存）問題に、反事実の介入と機構的解釈を組み合わせた訓練不要の重み編集SWEETを提案した。20組の原問題と反事実問題から方向を抽出し、5つの推論モデル・5つのベンチマークで摂動入力の精度を平均11.8ポイント改善し、原問題と摂動問題の差の相対比を17.6%から2.5%に縮めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMの推論が無関係な妨害文で乱れる（見かけの相関への依存）のを、訓練なしの重みの編集で抑える方法SWEETができた。", "p3": "原問題とその反事実の変種の活性の差から、トークン・系列レベルの振る舞いの方向を抽出し、責任のあるMLPのニューロンと注意ヘッドを特定して、その方向に沿った寄与を重みの編集で抑える。方向の抽出には、原問題と反事実の20組だけを使う（抄録）。", "p5": "5つのオープンウェイトの推論モデルと5つの推論ベンチマークで、摂動した入力の精度を平均11.8ポイント、原入力の精度を2ポイント改善し、原問題と摂動問題の精度の相対差を17.6%から2.5%に縮めた。繰り返し現れる誤りの2つの形（無関係な条件の取り込みすぎと考えすぎ）を同定し、両方の方向を抑えることで頑健性が上がるという機構的な証拠を示した（抄録）。", "fun": "算数の文章題に、答えと関係のない一文を足しただけで、AIが急に間違えることがあります。AIが「関係ない情報」に引きずられるくせを、頭の中のどの部品が担当しているかを突き止め、その部品だけを少し書き換えて、再学習なしで直しました。たった20組の例で直せるのが面白い点です。", "unverified": "本文未読のため、モデルとベンチマークの名前、編集の強さの設定は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "表形式基盤モデルは学習なしの世界モデルになりうるが限界も", "title": "An Evaluation of Tabular Foundation Models as Training-Free World Models", "url": "https://arxiv.org/abs/2611.11921", "authors": "Xian Yeow Lee ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Lee, X. Y., Takase, R., & Farahat, A. (2026). An Evaluation of Tabular Foundation Models as Training-Free World Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11921", "why": "事前学習した表形式の基盤モデルを、状態遷移の組に対する文脈内回帰として、学習なしの動力学モデルに使えるかを調べた。人工的な力学系とロボットの歩行課題で、限られた遷移で一から学習したLSTM・MLPより多くの設定で正確だが、全データで学習したモデルには多くの系で及ばず、推論は約3桁遅い。長い文脈を与えると多段の予測が改善する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "事前学習した表形式の基盤モデルを、学習なしでロボットなどの動力学モデル（世界モデル）に使えるかを評価し、使える場面と限界を示した。", "p3": "次の状態の予測を、状態遷移の組に対する文脈内回帰として定式化し、表形式の基盤モデル（TabFM）を、人工的な力学系とロボットの歩行課題で、一から学習したLSTM・MLPや他の回帰と比べる。多段の自己回帰的な展開も調べる（抄録）。", "p5": "限られた遷移で一から学習したLSTM・MLPより、ほとんどの設定でTabFMの方が正確。同じデータに当てはめる回帰の中では、歩行課題で最も正確で、滑らかな低次元の系ではガウス過程が優れる。全データで学習したモデルには多くの系で及ばない。多段の展開では文脈の長さに強く依存し、短いと自明な基準の水準まで劣化するが、長いと大きく改善して、ある歩行課題では学習したLSTMを上回る。推論はLSTMより約3桁遅い（抄録）。", "fun": "ロボットが「こう動いたら次はこうなる」を予測するモデルは、普通は大量の動きのデータで学習します。この研究では、表データを大量に学習したAIに「これまでの動きの例」を見せるだけで、学習なしに予測できるかを試しました。データが少ないときは学習済みのAIより当たる一方、長い予測では例の量が足りないと崩れます。「例を見せるだけ」でどこまで使えるかが分かるのが面白い点です。", "unverified": "本文未読のため、評価した系とベンチマークの一覧、数値の大きさは未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "時系列基盤モデルは先物の短期収益で無変化予測に勝てない", "title": "Do Time-Series Foundation Models Forecast Index-Futures Returns? A Preregistered Evaluation of Models, Metrics, and Input Representations", "url": "https://arxiv.org/abs/2611.12141", "authors": "Rishabh Upadhyay", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Upadhyay, R. (2026). Do Time-Series Foundation Models Forecast Index-Futures Returns? A Preregistered Evaluation of Models, Metrics, and Input Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12141", "why": "事前登録した評価で、凍結した5つの時系列基盤モデルをナスダック100・S&P500の先物の5〜120分先の収益で無変化予測と比べた。ブラインドの160の設定のうち無変化予測に勝つものは0で（Hansen SPA検定でp=1.000）、価格水準の相関や日内RankICなどの標準指標は、見かけの技能を示してしまうと指摘した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "凍結した時系列基盤モデルは、先物の日中の収益では、何も変えないという予測に勝てないことを、事前登録した評価で示した。", "p3": "E-miniナスダック100とS&P 500の先物で、5つのゼロショットモデル（Chronos-Bolt、Chronos-2、TimesFM 2.5、Moirai 2.0、TiRex）と別実験のKronosを、5〜120分先で無変化予測と比べる。入力は価格・対数収益・ボラティリティで標準化した収益・出来高時計（抄録）。", "p5": "一度だけ開いたブラインドの集合で、160のモデル・表現・地平線・市場の組合せのうち無変化予測に勝つものは0で、Hansen SPA検定ではp=1.000だった。後の事後検証でも120のうち0。価格水準の相関は0.9996を超えるが無変化の方が高得点で、日内のRankICは自明な平均回帰則（30分で+0.35）を評価し、符号ランダム化の帰無で観測値の約95%が再現された。強く埋め込んだ人工信号では、5分では部分的に回復し、30分では悪化した（抄録）。", "fun": "株価のような値動きは、予測がとても難しい世界です。最先端の「時系列の基盤モデル」でも、「明日も今日と同じ」と答えるだけの予測に、160通りの試験で1つも勝てませんでした。しかも、よくある評価の物差しでは「当たっているように」見えてしまいます。すごいAIでも、手がかりの少ない領域では勝てないことを、見かけの成功の仕組みとともに示すのが面白い点です。", "unverified": "本文未読のため、各指標の計算の詳細と、後の事後検証の位置づけは未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "LLMでAutoMLの構成を共通の離散列にして一括探索", "title": "Large Language Models as a Universal Searcher for Open-World Automated Machine Learning", "url": "https://arxiv.org/abs/2611.12791", "authors": "Yuxuan Hu ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Hu, Y., Liu, J., Shi, W., Huang, X., Wei, L., Zhan, M., Zhou, A., Liu, R., & Li, H. (2026). Large Language Models as a Universal Searcher for Open-World Automated Machine Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12791", "why": "モデル構造・ハイパーパラメータ・データ比率を共通の数値符号NCodeに変換し、LLMにランキング課題として解かせる汎用AutoMLを提案した。単一ドメインの視覚課題の最適化軌跡だけで学習しても、画像分類・分割・話者照合・文生成画像に一般化し、10億パラメータのDiffusion Transformerの大規模学習（896 GPU日）でGenEval 0.91を達成した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "モデル構造・ハイパーパラメータ・データ比率を共通の数値符号にして、LLMに一括して探索させる汎用のAutoML枠組みができた。", "p3": "NCodeという統一的な数値符号で、多様なAutoMLの設計選択を共通の離散列に変換し、最適化を統一的なランキング課題に置き換える。限られた単一ドメインの視覚課題の最適化の軌跡だけで学習し、強化学習で思考の連鎖（CoT）の推論を身につけさせて、探索の戦略を解釈する（抄録）。", "p5": "画像分類・画像分割・話者照合・文章からの画像生成のベンチマークで、課題・モダリティ・共同の探索空間をまたぐ汎化を示し、最高水準の性能を得た。billion級のパラメータを持つDiffusion Transformerの大規模学習と共同最適化（896 GPU日）で、最高水準のGenEval 0.91に達した。探索戦略は、初期の多様性重視の探索から後期の基準点の活用へ移る（抄録）。", "fun": "AIの設計（どの形にして、どう学習させ、どのデータをどれだけ使うか）は、職人の勘のような作業で、「AutoML」という自動化も分野ごとに作り直しでした。この研究は、設計の選択肢を共通の数字の並びに直し、1つのAIに「どれが良さそうか」を当てさせる形にして、いろいろな課題に使い回せることを示しました。設計の作業をAIが引き継ぐ方向の一歩が面白い点です。", "unverified": "本文未読のため、比較した基準手法と、各ベンチマークの数値は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "異なる触覚センサを共通表現に統合する触覚基盤モデル", "title": "Learning Heterogeneous Tactile Representation for General Dexterous Manipulation", "url": "https://arxiv.org/abs/2611.12806", "authors": "Bing Han ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-10", "apa": "Han, B., Peng, Y., Dong, H., Hu, Y., Jia, Y., Wang, F., Zheng, K., Zhang, Y., Zeng, Y., Zhang, X., Song, C., Zou, R., Dong, A., Guan, Y., Cheng, K. L., Zhu, X., Shen, Y., Xue, N., & Ning, W. (2026). Learning Heterogeneous Tactile Representation for General Dexterous Manipulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12806", "why": "圧抵抗・磁気・視覚触覚の異なる触覚センサを統一表現にするLingBot-Touchを提案した。トークンは拡散方策やVLAの方策モデルに差し込めて器用な操作を改善し、シミュレーションと複数のハードウェアの実機で評価した。Hugging Face Daily Papersの投票数は91。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに載るarXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "圧抵抗・磁気・視覚触覚と、種類の違う触覚センサのデータを共通の表現にする触覚基盤モデルLingBot-Touchができた。", "p3": "センサ固有の物理から触覚の理解を切り離して、異種のセンサを統一的に表し、新しいセンサ種にも拡張しやすいモデルを作る。得られた触覚トークンは、拡散方策やπ_0.5・LingBot-VLAなどの視覚言語行動（VLA）モデルの方策に差し込める（抄録）。", "p5": "シミュレーションと、複数のハードウェアの実機での展開を含む大規模な実験で、触覚の表現が複雑な操作課題に大きく寄与し、計算効率も保つ。異種のセンサのデータを使って触覚学習を拡大する可能性を示す（抄録）。", "fun": "ロボットの手が物をつかむとき、人間の指のような「触った感じ」が大事ですが、触覚センサは会社や方式ごとに数字の出方がバラバラです。この研究は、違うセンサの出す数字を、共通の「触覚の言葉」に翻訳するAIを作り、翻訳後はどの種類のロボットの制御にも差し込めるようにしました。違うセンサを共通の言葉にそろえる発想が面白い点です。", "unverified": "本文未読のため、実験した課題の一覧、ロボットの種類、数値の改善幅は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "メタ認知で研究の問いと方法を選ぶAI共同研究者", "title": "Sage-Taiyi: A Metacognitive Architecture for Scientific Discovery", "url": "https://arxiv.org/abs/2611.12762", "authors": "Weida Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-10", "apa": "Wang, W., Chen, B., Jiang, Y., Pu, S., Shen, W., Liu, Z., Su, Y., Wang, Z., Zhou, S., Wang, Z., Li, Y., Zong, X., Yang, Y., Bi, J., Wang, Y., Peng, C., Geng, S., Zhang, Q., Lu, K., … Zhang, S. (2026). Sage-Taiyi: A Metacognitive Architecture for Scientific Discovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12762", "why": "蓄積した科学的理解で次に何を調べるかを導き、証拠・仮定・未解決の問いを監視・制御するSage-Taiyiを提案した。10分野265課題のTaiyi-Benchで8指標すべて1位（総合54.0対AI Scientist-v2の47.9）で、化学の反応条件の最適化では収率が痕跡量から84%、13%から69%に向上した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに載るarXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "蓄積した科学的理解で次に何を調べるかを導き、証拠・仮定・未解決の問いを自分で点検し直すAI共同研究者の設計Sage-Taiyiができた。", "p3": "明示的な監視と制御で、証拠・仮定・未解決の問いについての理解を改め、その評価をもとに研究の目標を調整し、再利用できる推論の方法を選ぶ。10分野の50本の論文から作った265課題の、AI共同研究者向けのアイデア創出ベンチマークTaiyi-Benchで評価した（抄録）。", "p5": "歴史的な再発見と自由なアイデア創出の8指標すべてで1位で、総合点は54.0（最強の基準AI Scientist-v2は47.9）。外部の2つの科学的アイデア創出ベンチマークでも良好。専門家との5つの共同研究で、化学・材料科学・工学の実験・計算による検証へつながり、化学では、コバルト触媒カルボニル化の収率が痕跡量から84%、光触媒のアリル位アミノ化が13%から69%に上がった（抄録）。", "fun": "科学者が研究を進めるときは、「自分は何が分かっていて、何が分かっていないか」を絶えず見直しながら、次にやることを決めます。この研究は、AIにその「自分の理解を見直す」仕組みを持たせました。さらに、AIの提案した実験条件で、化学反応の収率が痕跡量から84%に上がった例もあります。AIが自分の考えを点検しながら研究する発想が面白い点です。", "unverified": "本文未読のため、ベンチマークの指標の定義と、実験検証の詳細は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "最低賃金の引上げは若い小企業の成長を遅らせる", "title": "Minimum Wage, Business Dynamism, and the Life Cycle of Firms", "url": "https://doi.org/10.2139/ssrn.7682217", "authors": "André Victor Doherty Luduvice ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Doherty Luduvice, A. V., Martinez, T. R., & Sollaci, A. (2026). Minimum Wage, Business Dynamism, and the Life Cycle of Firms . https://doi.org/10.2139/ssrn.7682217", "why": "異質な企業が労働市場支配力・革新投資・公式/非公式部門の選択をもつモデルで、最低賃金の引上げが若く低生産性の企業を縮め革新の誘因も下げると予測し、ブラジルの行政・センサスデータ（1999〜2010年）で確かめた。小規模で若い事業所の成長率は下がり、古く大きい事業所の成長率は上がり、非公式雇用は増える。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "最低賃金の引上げが若く小さな企業の成長を鈍らせ、革新の誘因も下げることを、モデルとブラジルのデータで示した。", "p3": "労働市場の支配力・革新投資・公式/非公式部門の選択をもつ異質な企業のモデルを作り、1999〜2010年の最低賃金への曝露のばらつきを使って、ブラジルの行政・センサスのデータで予測を確かめた。さらに、買い手独占的な企業と内生的な革新を含む定量的な一般均衡モデルをブラジル経済に合わせて較正した（抄録）。", "p5": "最低賃金の引上げは、小さく若い事業所の成長率を下げ、古く大きい事業所の成長率を上げる。自治体の水準では、非公式雇用と、公式・非公式の両方の労働者の収入が増える。反事実の引上げでは、若い企業から古い企業へ再配分され、生産性の低い企業の革新が抑えられ、非公式部門が拡大する（抄録）。", "fun": "最低賃金を上げると、働く人の給料が増えるだけでなく、会社の成長の仕方も変わります。この研究によると、新しくできたばかりの小さな会社ほど成長が鈍り、古くて大きな会社が相対的に有利になります。賃金のルールが、経済の新陳代謝（新しい会社が育つ力）にまで響くかもしれないのが面白い点です。", "unverified": "本文未読のため、識別戦略（曝露の測り方）、効果の大きさ、モデルの較正の詳細は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "ドイツ国債の取引報告から見える中核ディーラーの構造", "title": "Anatomy of a Safe Asset: Bund Market Structure and Reform", "url": "https://doi.org/10.2139/ssrn.7681379", "authors": "Mark Kerssenfischer ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Kerssenfischer, M., & Scherrieble, W. (2026). Anatomy of a Safe Asset: Bund Market Structure and Reform. https://doi.org/10.2139/ssrn.7681379", "why": "MiFID I・IIの取引報告から、独国債（ユーロ圏の基準安全資産）の取引相手がわかる取引水準データを作った。集中したディーラーの中核が持続的な関係で仲介し、投資家部門ごとに分断されていることを示し、中央清算はディーラーのネット決済義務を35%減らすが、プラットフォームの集中は関係の剰余の損失で厚生を下げると評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ドイツ国債の取引報告から、取引相手が分かる取引水準のデータを作り、少数のディーラーが持続的な関係で仲介する市場構造と、2つの改革の効果を評価した。", "p3": "MiFID I・IIの取引報告（2008年以降）から、非匿名の取引水準データを構築する。ストレス局面の流れを識別し、投資家部門別の取引と執行コストを調べる。2つの改革（義務的な中央清算とプラットフォームの集中）を評価する（抄録）。", "p5": "集中したディーラーの中核が持続的な関係で仲介し、取引は投資家部門で分断され、注文は相対（OTC）と電子の取引所に分散している。外国の公的口座は、価格が下がる局面でも上がる局面でも国債を供給する。価格情報の多い流れを担うヘッジファンドと公的部門の執行コストは中位で、個人が最も高い。義務的な中央清算はディーラーのネット決済義務を35%減らす（米国債・英国債の同種の推定より小さい）。構造モデルでは、関係の剰余の損失が大きく、プラットフォームの集中は厚生を下げる（抄録）。", "fun": "「世界でいちばん安全な資産」とされるドイツ国債も、実際には、少数の大手ディーラーと長い付き合いのある相手が取引を支えている、昔ながらの人間関係の市場でした。取引を全部1つの電子の場に集めれば効率が上がりそうに見えますが、計算すると、築かれた付き合いの価値が失われて、かえって損になる場合があります。見かけの効率化が良いとは限らないのが面白い点です。", "unverified": "本文未読のため、データの件数、執行コストの数値、構造モデルの仮定は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "労働者に合う求人が増えると使用者の買い手独占力が弱まる", "title": "Who Benefits from Worker-Specific Job Openings? Matching Meets Monopsony", "url": "https://doi.org/10.2139/ssrn.7681849", "authors": "Sachiko Kazekami", "venue": "SSRN", "date": "2026-11-09", "apa": "Kazekami, S. (2026). Who Benefits from Worker-Specific Job Openings? Matching Meets Monopsony. https://doi.org/10.2139/ssrn.7681849", "why": "現職の職種名と求人の職種名を照合して、労働者別の求人（良いマッチ）を捉え、マッチの改善が生産性だけでなく買い手独占力の低下を通じても効率を高めると示した。2019〜2025年の米国データで、マッチの改善は離職を増やし、同僚の機会を通じても作用する。昇進への効果は職種によって異なる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ（脚注が混在している）。本文は入手できなかった", "preprint": true, "short": true, "p1": "労働者の現職に合う求人（良いマッチ）が増えると、使用者の買い手独占力が弱まり、生産性と効率の両方が高まりうることを、米国のデータで示した。", "p3": "現職の職種名と、掲載された求人の職種名を照合して、労働者別の求人として良いマッチを捉える。2019〜2025年の米国データで、良いマッチが使用者の買い手独占力を弱めるかを調べた（抄録）。", "p5": "良いマッチは離職を増やし、買い手独占力の低下と整合する。この効果は本人の機会だけでなく、同僚の機会を通じても生じる。同僚に上位の機会があると、ソフトウェアと金融では昇進が増えるが、教員と看護師では増えない。企業も外部の選択肢の変化に反応するが、先行研究が買い手独占力を重視する一部の労働市場では、その反応が見られない（抄録）。", "fun": "転職先が見つかりやすい人が増えると、会社は「辞められたら困る」ので、給料や待遇を良くせざるをえなくなります。この研究は、本人の仕事に近い求人が増えるほど、離職が増え、会社の「雇う側の強さ」が弱まることを示しました。自分に合う求人が見えるだけで、働く人の立場が強くなるのが面白い点です。", "unverified": "本文未読のため、識別の方法、効果の大きさ、抄録の途中に脚注が混在する部分の記述は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "労働市場が逼迫するほど少数派の賃金格差が縮む", "title": "Labor Market Tightness and Minority Earnings Gaps", "url": "https://doi.org/10.2139/ssrn.7682898", "authors": "Vittoria Dicandia ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Dicandia, V., & Hernandez Martinez, V. (2026). Labor Market Tightness and Minority Earnings Gaps. https://doi.org/10.2139/ssrn.7682898", "why": "米国の大都市圏の行政データ（2010〜2025年）で、失業率が1ポイント下がると白人と少数派の賃金格差が全職で約0.2ポイント、新規の安定雇用で0.3ポイント縮む。逼迫した市場では0.4・0.6ポイントと効果が強まり、労働者・求人の構成や同時期の政策では説明できず、雇用主間の競争が一因だと示唆する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "労働市場が逼迫するほど白人と少数派の賃金格差が縮むことを、米国の大都市圏の行政データで示した。", "p3": "2010〜2025年の米国大都市圏の行政データで、全国的なショック・地域の季節性・地域のトレンドを除いたうえで、失業率の変化と、白人−少数派の賃金格差の関係を調べる（抄録）。", "p5": "失業率が1ポイント下がると、格差は全職で約0.2ポイント、新規の安定雇用で0.3ポイント縮む。逼迫が強い市場では0.4・0.6ポイントと効果が強まる。労働者・求人の構成や同時期の政策では説明できず、職種間の移動や上位の職種への移行の寄与は小さい。採用が少数の雇用主に集中している所では、格差の反応が緩い。市場の区分内の相対的な賃金改善と雇用主間の競争が経路と示唆される（抄録）。", "fun": "景気が良くて人手が足りない「売り手市場」になると、働く人の給料が上がるだけでなく、人種による給料の差まで縮まる、という話です。会社は人手が足りないと、誰でもいいから採りたくなり、差別的な選り好みをする余裕がなくなるのかもしれません。経済の状態が社会の格差まで動かすのが面白い点です。", "unverified": "本文未読のため、推定式、標本の規模、頑健性検査は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "データ検証と利益監査を組み合わせる最適な税務執行", "title": "Optimal hybrid tax enforcement", "url": "https://arxiv.org/abs/2611.10851", "authors": "Saara H\\\"am\\\"al\\\"ainen ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Hämäläinen, S., Ferraz, E., & Ramos, S. C. (2026). Optimal hybrid tax enforcement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10851", "why": "納税者が申告する分類データは課税・監査の標的化に役立つが、操作の余地も生む。抑止を回復すると、あらゆる申告を利益監査かデータ検証で検証する大域的な検証境界が内生的に生じることを示し、利益監査の対象データ区分を選ぶ最適な混合を特徴づけた。最適な実装は利益の束にはなるが、データの束にはならない。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "納税者が申告する分類データを税務執行にどう使い、利益監査とデータ検証をどう組み合わせるのが最適かを示した。", "p3": "抑止を回復する条件から、あらゆる申告を利益監査かデータ検証で検証する「大域的な検証境界」が内生的に生じることを示す。最適な混合では、利益監査をこの境界まで行うデータ区分と、区分ごとに低い閾値までしか利益監査せず、それを超えるとデータ検証に切り替わる区分を選ぶ（抄録）。", "p5": "データ検証にコストがかかることが、差別化した税務執行の利益を制約する。最適な実装は利益の束（bunching）が特徴だが、データの束は伴わない（抄録）。", "fun": "税金を調べる側は、「どの業種か」といった申告データを手がかりに、怪しい人から優先して調べたいところです。でも、申告する側はその分類を自分に都合よく操作できます。この研究は、「全部をお金の中身まで調べる」か「分類の正しさを確かめる」かの使い分けの最適な形を数学で決めました。ズルを防ぎながら、調べるコストを抑える工夫が面白い点です。", "unverified": "抄録のみの理論研究で、モデルの設定と命題の証明の詳細は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "風力・太陽光で電力価格の変動は増えたかを再定義して検証", "title": "Have wind and solar energy increased electricity price volatility? And what is electricity price volatility, anyway?", "url": "https://arxiv.org/abs/2611.10731", "authors": "Lion Hirth", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Hirth, L. (2026). Have wind and solar energy increased electricity price volatility? And what is electricity price volatility, anyway? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10731", "why": "従来の文献が混同していた、配送時刻をまたぐ価格のばらつき（変動性、蓄電できないことが原因）と、同じ配送時刻の取引時点をまたぐ価格の変化（ボラティリティ、不確実性が原因）を定義し、日量入札と不均衡市場の代数モデルで分解した。ドイツの25年のデータで、変動性はU字形に推移し、ボラティリティは時間とともに低下した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "風力・太陽光が電力価格の変動を増やしたかという問いを、配送時刻をまたぐ価格のばらつき（変動性）と、取引時点をまたぐ価格の変化（ボラティリティ）に分けて定義し直して検証した。", "p3": "同じ前日市場のオークションで決まる異なる配送時刻の価格差を「変動性」（蓄電できないことが原因）、同じ配送時刻の価格が時間外取引で新しい情報により変わるのを「ボラティリティ」（不確実性が原因）と定義する。前日市場と不均衡市場の簡単な代数モデルで両者の分解と根本的な要因を導き、ドイツの25年のデータを示す（抄録）。", "p5": "この間に風力・太陽光は発電の0%から50%近くに増えた。変動性は2000年代から2010年代に下がり、その後再び上がるU字形の経路をたどった。一方、ボラティリティは時間とともに低下した（抄録）。", "fun": "「再生可能エネルギーが増えると電気の値段が不安定になる」とよく言われますが、「不安定」には、時間帯による値段の違いと、同じ時間帯の値段が直前まで変わることの2種類があって、これまで混ざって議論されていました。分けて調べると、風力・太陽光が増えても、後者のぶれは減っていました。言葉を分けるだけで結論が変わるのが面白い点です。", "unverified": "本文未読のため、代数モデルの式、データの詳細と指標の定義は未確認。"}}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "インドの農産物オークションで暗黙の談合を実証", "title": "Analysis of Supply Information, Code Bidding, and Efficiency in Repetitive Simultaneous Ascending Online Auctions: A Study of India's eNAM Digital Agricultural Market", "url": "https://arxiv.org/abs/2611.10068", "authors": "Dipankar Das ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Das, D., Sarkar, K., & Jadhav, V. (2026). Analysis of Supply Information, Code Bidding, and Efficiency in Repetitive Simultaneous Ascending Online Auctions: A Study of India's eNAM Digital Agricultural Market (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10068", "why": "全季節の供給が透明で売り手が均衡入札を拒否できる反復同時上昇オークション（インドeNAM）をモデル化し、談合が生じる条件を導いた。取引データで、入札者の集中度が低く供給情報が共有される下での暗黙の談合（コード入札）の出現を確認し、供給の透明性と戦略的な拒否の併存が配分の非効率を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "インドの農産物電子市場eNAMの反復同時上昇オークションで、供給情報の共有と売り手の拒否権が、談合を生み、配分の非効率を生むことを示した。", "p3": "全季節の供給が透明で、売り手が均衡入札を拒否できる反復同時上昇オークション（RSAA）を、ラウンド間の戦略的依存と内生的な売り手の参入をもつゲームとしてモデル化し、談合が生じる条件を導く。取引水準のデータで、暗黙の談合（コード入札）の出現を実証する（抄録）。", "p5": "入札者の集中度が低く、供給情報が共有される下で、暗黙の談合（コード入札）が維持される。需要側の協調は価格競争を系統的に弱める。供給の透明性と戦略的な拒否の併存は、上昇価格形式にもかかわらず、有意な配分の非効率をもたらす（抄録）。", "fun": "農産物をネットで競りにかけると公平になるはずですが、「どれだけ出荷されるか」が全員に見える仕組みだと、買い手たちが暗黙の合図（コード入札）で価格を競り合わないように示し合わせてしまうことがあります。情報を公開すると競争が強まるとは限らず、談合のきっかけにもなるのが面白い点です。", "unverified": "本文未読のため、モデルの均衡の詳細、データの規模、実証の指標は未確認。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "リーダーの性格と潜在動機の交互作用が奉仕型リーダーを説明", "title": "What Drives Leaders to Serve? The Joint and Interactive Effects of HEXACO Personality Traits and Implicit Motives on Servant Leadership", "url": "https://doi.org/10.31234/osf.io/2gf9e", "authors": "Justine Amory ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Amory, J., Dupré, S., Runge, J. M., & Wille, B. (2026). What Drives Leaders to Serve? The Joint and Interactive Effects of HEXACO Personality Traits and Implicit Motives on Servant Leadership. https://doi.org/10.31234/osf.io/2gf9e", "why": "上司219人の性格（HEXACO）と潜在動機、部下によるサーバント・リーダーシップの評価を組み合わせた。性格も潜在動機も単独では固有の分散を説明せず、両者の交互作用が予測を改善した。親和動機が高い上司は、外向性が高く協調性が低いとき、よりサーバント的と見られた。未査読のプレプリント。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "リーダーの性格（HEXACO）と潜在動機の交互作用が、部下から見たサーバント・リーダーシップを説明することを、上司と部下の対のデータで示した。", "p3": "チャネリング仮説（Winter他、1998）に基づき、上司219人のHEXACO性格特性と潜在動機の測定と、部下によるサーバント・リーダーシップの評価を組み合わせる対の設計で、性格・動機・その交互作用の役割を調べた（抄録）。", "p5": "予想に反して、性格特性も潜在動機も、単独では固有の分散を説明しなかった。しかし、顕在的な特性と潜在動機の交互作用が予測を有意に改善した。親和動機が高い上司は、外向性が高く、予想に反して協調性が低いと、よりサーバント的と見られた（抄録）。", "fun": "「やさしい人ほど部下に尽くすリーダーになる」と思いがちですが、この研究では、性格だけ、あるいは心の奥の動機だけでは説明できませんでした。「人と親しくなりたい欲求」が強く、しかも外向的で協調性は低い上司が、部下からは尽くす上司と見られたのです。性格と動機の組み合わせで思わぬ結果が出るのが面白い点です。", "unverified": "本文未読のため、効果量、尺度の詳細、交互作用の検定の設定は未確認。未査読のプレプリント。"}}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "LLMエージェントのチームを人間のチーム理論で設計する", "title": "Teamknitt: Configuring, Observing and Intervening in LLM-Agent Teams through the Lens of Dynamical-Systems and Human-Team Theory", "url": "https://arxiv.org/abs/2611.12545", "authors": "Goran Mitevski", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Mitevski, G. (2026). Teamknitt: Configuring, Observing and Intervening in LLM-Agent Teams through the Lens of Dynamical-Systems and Human-Team Theory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12545", "why": "LLMエージェントのチームの形をソフトに固定せず、人間のチーム研究の問い（現象がメンバーにあるか相互作用にあるか等）を設計の視点にするteamknittを提案した。1〜16体を14の決定的なルーティングなどから設定し、システム・非システムの両視点で観察でき、介入は人が主導する明示的な操作に限る。参照実装を公開している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "LLMエージェントのチームを、人間のチーム研究の問い（現象はメンバーにあるか、相互作用にあるか等）を設計の視点にして、設定・観察・介入できる枠組みteamknittが提案された。", "p3": "1〜16体のAIエージェントのチームを、14の決定的なルーティングのトポロジーかカスタムの有向グラフ、共有プロファイル、依存・受け渡し・専門性のディレクトリで設定する。過程は、メンバーの報告・行動と、分散した問題解決・交換記憶・調整・チームの動態の視点で観察し、介入は人が主導する再構成・計画した撹乱・私的なフィードバック・一時停止などに限る（抄録）。", "p5": "アイデアとシステムの記述の論文で、比較結果は報告していない。トポロジー・情報の流れ・介入のタイミングについて反証できる仮説を示し、メンバー間・異なるモデルの間のコミュニケーション出力のフラクタルなスケーリングが課題と成果に関係するかも仮説とする。信頼や共通理解などの創発状態は、測定しないと宣言している（抄録）。", "fun": "AIエージェントを何人かチームにして仕事をさせるとき、誰が誰と話すか、どの情報を渡すかを、人間のチーム研究の考え方で整理する試みです。AIのチームを人間の組織論の問いで観察・調整するのが面白い点です。結果はまだなく、「こうすると良いのでは」という仮説の形で、確かめるべき問いが並んでいます。", "unverified": "比較の実験結果は報告されていない設計論文で、本文未読のため実装の詳細は未確認。"}}, {"id": "pn42", "rank": 42, "field": "組織行動・心理的安全性", "headline": "同調圧力下でのリーダーの選び方を網ゲームで最適化", "title": "Designing Leadership under Social Conformity", "url": "https://doi.org/10.2139/ssrn.7681807", "authors": "Jiacheng Fan", "venue": "SSRN", "date": "2026-11-10", "apa": "Fan, J. (2026). Designing Leadership under Social Conformity. https://doi.org/10.2139/ssrn.7681807", "why": "隣人の平均努力に合わせる同調コストがある局所平均の網ゲームで、生産性の異なるプレイヤーをリーダーとフォロワーに2段階で分けて総努力を最大化する設計を分析した。リーダーの生産性が規範を上回るか否かで努力が増減することを示し、最適な単一リーダーの正確な指標を導き、同調の強さが極限のときの最適な集団の構造を特徴づけた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "同調の圧力がある網ゲームで、生産性の違うメンバーのうち誰をリーダーにするのが最適かを、理論的に決めた。", "p3": "隣人の平均努力に合わせる同調コストがある局所平均の網ゲームで、生産性が異なるプレイヤーを、組織の計画者が2段階でリーダーとフォロワーに分け、総努力を最大化する設計を分析する（抄録）。", "p5": "リーダーの生産性が社会規範を上回るかどうかで、リーダーシップが均衡の努力を増やすか減らすかが決まる。最適な単一リーダーの正確な指標を導き、局所集計モデルの主要なリーダーと大きく違いうることを示した。同調の好みが0または無限大に近づくときの最適集団を特徴づけ、弱い同調では局所的に生産性の高い者が、強い同調では網で最も生産的な者に集約する。多段の階層では、細かい順序づけが最適でないことがある（抄録）。", "fun": "グループの成果を高めるために「誰を先に動かすか」を決める問題です。周りに合わせたい気持ちが強いと、一番できる人だけをリーダーにするのが最良ですが、気持ちが弱いと、地域ごとに力のある人を選ぶのが良いなど、最適なリーダーの選び方が変わります。細かく段階を刻むほど良いとも限らないのが面白い点です。", "unverified": "抄録のみの理論研究で、均衡の定義と指標の式は未確認。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "サイバー安全の虚偽主張では低価格が信頼できる信号になる", "title": "Regulating Cyberwashing: False Claims, Hacker Threats, and Price Signaling", "url": "https://doi.org/10.2139/ssrn.7682031", "authors": "Tushan Huang ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Huang, T., Lu, T., Shin, H., & Fu, K. (2026). Regulating Cyberwashing: False Claims, Hacker Threats, and Price Signaling. https://doi.org/10.2139/ssrn.7682031", "why": "企業が検証できないサイバーセキュリティ水準を主張し価格も決めるシグナリングモデルで、攻撃者が顧客基盤への侵害の期待利益で攻撃を決める経路を内生化した。顧客基盤の拡大が安全な企業にとって小さな限界損失を生むため、価格を下げる需要拡大が安全性の信頼できるシグナルになる。虚偽表示は罰則が低く攻撃者の利益費用比が中程度のときに生じる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "企業のサイバーセキュリティの虚偽主張（サイバー・ウォッシング）を、価格シグナリングと攻撃者の行動を含むモデルで分析し、規制の設計を示した。", "p3": "企業が自社のセキュリティ水準を私的に知り、主張と価格を選ぶシグナリングモデル。消費者はこれらの信号から水準を推測し、攻撃者は顧客基盤を侵害したときの期待利得で攻撃を決め、規制当局は虚偽の高水準の主張に期待罰則を課す（抄録）。", "p5": "安全な企業は顧客を増やしても侵害による期待損失が小さいため、価格を下げた需要拡大が安全性の信頼できる信号になる。サイバー・ウォッシングは罰則が低く攻撃者の利益費用比が中程度のときに起き、高い罰則か十分低い比では誠実な開示が保たれる。消費者余剰は抑止水準をわずかに上回る罰則で最大。より広いサイバーセキュリティ統治は非単調な効果を持ち、攻撃者の利益費用比を下げる政策が、脅威の規律効果を弱めて厚生を下げうる（抄録）。", "fun": "「うちのサービスは安全です」という宣伝を、客は確かめられません。この研究は、本当に安全な会社は、客が増えても被害の期待が小さいので、値下げして客を増やせることから、価格が安全性の証拠になりうるという点を見いだしました。さらに、悪い人たちへの対策を強めすぎると、かえって嘘の宣伝が増えることもある、というのが面白い点です。", "unverified": "抄録のみの理論モデルで、均衡の選択と命題の証明の詳細は未確認。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "自治体の環境評価に生成AIを入れる条件は組織にある", "title": "The Enabling Ecosystem For Generative AI In Strategic Environmental Assessment: An Interpretive Framework Grounded In A Regional Case Study", "url": "https://doi.org/10.2139/ssrn.7682013", "authors": "Eleonora Bonacci", "venue": "SSRN", "date": "2026-11-09", "apa": "Bonacci, E. (2026). The Enabling Ecosystem For Generative AI In Strategic Environmental Assessment: An Interpretive Framework Grounded In A Regional Case Study. https://doi.org/10.2139/ssrn.7682013", "why": "イタリア・ヴェネト州の環境評価局（2025年11月〜2026年3月）で、戦略的環境評価の4つの用途にRAGを試した。出力の信頼性は起草の複雑さより裁量の複雑さとともに下がり、幻覚は規範の引用が密な用途に集中し、導入の障壁は技術より組織・文化にあった。これを4成分の「実現を支える生態系」の枠組みで解釈する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "自治体の環境評価に生成AIを入れるとき、成否を分けるのは技術より組織・文化・規範・基盤の「実現を支える生態系」だと、現場の実験から整理した。", "p3": "イタリア・ヴェネト州の環境評価局で2025年11月〜2026年3月に、戦略的環境評価（SEA）の4つの用途（書類の完全性の確認から、法的拘束力のある理由づけ意見の起草まで）でRAGの構成を試した。結果を、4つの相互依存する成分（文化・組織/能力・規範/統治・基盤/持続可能性）の「生態系」の枠組みで解釈する（抄録）。", "p5": "出力の信頼性は、起草の複雑さだけでなく裁量の複雑さとともに下がる。幻覚は規範の引用が最も密な用途に集中する。導入の障壁は、技術より組織的・文化的なものが中心だった。この枠組みは、3層の国のガイダンス構造を支える（抄録）。", "fun": "AIを役所の仕事に入れると、文章の下書きは得意でも、「どの法律をどう当てはめるか」の判断（裁量）が重い仕事ほど、間違いが増えました。しかも、導入の壁は、AIの性能より、職員の慣れや組織の風土でした。技術が良ければ使えるわけではなく、役所の文化づくりが成否を決めるのが面白い点です。", "unverified": "本文未読のため、用途ごとの信頼性の数値、評価の指標、実験の規模は未確認。"}}, {"id": "pn45", "rank": 45, "field": "計算社会科学・ネットワーク科学", "headline": "4.5万の会議の記録から協働ネットワークの長期動態を追う", "title": "Collaboration Signatures: Tracking Long-Horizon Dynamics of Cross-Meeting Collaboration Networks", "url": "https://arxiv.org/abs/2611.10341", "authors": "Shengqi Zhu ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Zhu, S., Mysore, S., & Sarrafzadeh, B. (2026). Collaboration Signatures: Tracking Long-Horizon Dynamics of Cross-Meeting Collaboration Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10341", "why": "多国籍企業の45,426件の会議の全文書き起こしと160万件の議題項目を結びつけ、6,065の協働からなる会議間の協働ネットワークを作った。会議は主に木構造、作業内容は入れ子の有向非巡回グラフになる。課題の分割・チーム構成・時間的連続性という既存の3つの視点は動態の一部しか説明せず、議題・相互作用・言語の蓄積を使う見方を探る。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "会議の書き起こしを結んで、企業内の協働が長い期間でどう展開するかを追う「会議間の協働ネットワーク」を作り、協働の署名（シグネチャ）という見方を示した。", "p3": "多国籍技術企業の45,426件の会議の全文書き起こしと160万件の抽出した議題項目を結びつけ、6,065の協働からなる会議間の協働ネットワークを作る。タスク分割・チーム構成・時間的連続性という既存の3つの視点でネットワークの時間変化を調べ、各木に沿って議題・相互作用・言語を蓄積した「協働の署名」と比べる（抄録）。", "p5": "会議は主に木構造にまとまり、作業内容は入れ子の有向非巡回グラフ（DAG）をなす。既存の3視点は動態の一部しか説明しない。協働の署名は、保持した会議の協働を偶然の4.5倍で特定し、次の会議の予測と木全体の当てはめで、チーム・タスクの視点（単独でも併用でも）より協働をよく表す（抄録）。", "fun": "会社の会議は、1回ごとに見ると、ただの打合せの断片です。でも、同じ話題が続く会議をつなぐと、1本の木のような「仕事の成り行き」が見えてきます。その木ごとの話し方や議題のくせ（署名）は、別の会議が同じ協働のものかを、偶然の4.5倍の精度で当てられました。会議の言葉に、仕事ごとの指紋があるのが面白い点です。", "unverified": "本文未読のため、予測の評価指標、企業のデータの前処理、署名の具体的な定義は未確認。"}}, {"id": "pn46", "rank": 46, "field": "計算社会科学・ネットワーク科学", "headline": "重み付き二部ネットワークはノード強度だけでは説明できない", "title": "Beyond node strengths: the topological content of weighted bipartite networks", "url": "https://arxiv.org/abs/2611.10085", "authors": "Daniele Cirulli ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Cirulli, D., Buffa, L., Cimini, G., Mazzilli, D., Patelli, A., & Saracco, F. (2026). Beyond node strengths: the topological content of weighted bipartite networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10085", "why": "連続の重み付き二部ネットワークで、ノード強度のみ・強度と密度・強度と次数列を保存する最大エントロピーモデルの階層を導入した。経済・技術・生態・社会・語彙の系で、強度だけでは経験的な構造を再現できないが、足りない位相情報は密度を制御する1つの制約で記述できることが多い。位相の解像度の選択は、統計的に有意な関係の同定も変える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "重み付き二部ネットワークの構造が、ノードの強さ（取引量）だけで説明できるのか、追加の位相情報が要るのかを、最大エントロピーモデルの階層で調べた。", "p3": "ノード強度のみ、強度と全体の密度、強度と完全な次数列を保存する3段の最大エントロピーモデルの階層を、連続の重み付き二部ネットワークに導入する。経済・技術・生態・社会・語彙の系で、適合・標本抽出・モデル選択・検証を共通の流れで行う（抄録）。", "p5": "強度の制約だけでは経験的な構造を再現できないことが多い。ただし足りない位相情報は低次元で、密度を制御する1つの制約が最も簡潔な記述になることが多く、次数の異質性が強い網ではノードごとの制約が要る。位相の解像度の選択は、どの相互作用や射影された関係が統計的に有意とされるかも変える（抄録）。", "fun": "「大企業と大企業のつながりが多いのは、どちらも取引量が大きいからだ」と考えがちですが、本当にそれだけで説明できるのかを、数学の道具（最大エントロピー）で確かめます。取引量だけでは足りず、「つながりの数」の情報が要る。でも、その追加の情報は意外と少なくて済む、というのが面白い点です。", "unverified": "本文未読のため、モデルの定式化と各系のデータの詳細、数値は未確認。"}}, {"id": "pn47", "rank": 47, "field": "計算社会科学・ネットワーク科学", "headline": "AI研究の空間での近さが国ごとの専門化と影響を決める", "title": "The AI research space shapes country academic performance", "url": "https://arxiv.org/abs/2611.11663", "authors": "Siyi Zhou ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Zhou, S., Pan, T., & Ke, Q. (2026). The AI research space shapes country academic performance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11663", "why": "著者・トピックの結合でAI研究トピック間の近さを測り、AI研究空間を作って国ごとの専門化の束を示した。国は、すでに専門化した近隣のトピックに近いトピックで専門化を得やすく、国内の発達したトピックと整合する論文ほど高い影響になりやすい。国ごとのAI開発の格差と、経路依存が現れる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "AI研究のトピックどうしの近さを作者のつながりで測った「AI研究空間」が、国ごとのAI研究の専門化と論文の影響力を決めることを示した。", "p3": "AIの研究トピックの対を、著者–トピックの結合に基づく近さで結んでAI研究空間を作り、国ごとの成果を射影して専門化の「かご」を示す。空間の構造が国の科学的発展にどう関わるかを調べる（抄録）。", "p5": "国は、すでに専門化している近隣のトピックに近いトピックで専門化を得やすい。国内で発達したトピックと整合する論文ほど、高い影響になりやすい。国ごとのAI開発の格差と、研究空間が生む経路依存が示される（抄録）。", "fun": "新しい分野を始めやすいかは、「すでに得意な分野の近く」にあるかで決まる、という話です。AIの研究でも、国ごとに得意なテーマの近くのテーマを伸ばしやすいことが分かりました。一方で、近くに得意分野がない国は、AIの分野で追いつくのが難しいという格差も浮かびます。得意分野が地図で近い順に広がっていくのが面白い点です。", "unverified": "本文未読のため、近さの定義、データの範囲、効果の大きさは未確認。"}}, {"id": "pn48", "rank": 48, "field": "計算社会科学・ネットワーク科学", "headline": "集計情報だけから経済ネットワークを再構成する", "title": "Network Reconstruction via Jeffreys Prior under Missing Sufficient Statistics", "url": "https://arxiv.org/abs/2604.05745", "authors": "Minh Duc Duong ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Duong, M. D., & Garlaschelli, D. (2026). Network Reconstruction via Jeffreys Prior under Missing Sufficient Statistics (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2604.05745", "why": "国・銀行・企業などの経済ネットワークを集計情報から再構成する適合度モデルで、ブロック構造の密度が観測できない場面を、Jeffreys事前分布による全ての整合解のエントロピー分布の中央値で補った。9つの国際貿易ネットワークで、GDPをノード適合度、世界銀行の地域を分割として、ブロックを考慮しない基準を系統的に上回り、ブロック密度が既知の方法を超えることもあった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "集計情報しかないときの経済ネットワークの再構成で、ブロック構造の密度が観測できなくても、Jeffreys事前分布のエントロピーの中央値で補う方法が示された。", "p3": "ノード適合度（GDPなど）と全体の密度だけを十分統計量とする適合度モデルに、ブロック構造（FCBM）を取り入れるが、ブロックごとの密度が観測できない設定で、Jeffreys事前分布が与える整合する全解とそのエントロピーの分布の中央値を代表として選ぶ。9つの国際貿易ネットワークで、GDPをノード適合度、世界銀行の地域を外から与えた分割として評価した（抄録）。", "p5": "同じ入力統計だけを使うブロックを考えない基準を系統的に上回り、より多くの情報を使うFCBMを上回ることもあった。人工のネットワークで、中央値は4つのエントロピー基準の代表のうち、現実的な密度・地域効果の範囲では最良と確かめられた。パラメータを現実の範囲から大きく外すと、他の代表が良いこともある（抄録）。", "fun": "国同士の貿易の表のように、「全体の合計」しか公開されていないとき、誰が誰とどれだけ取引したかを推測する問題です。この研究は、「分からない部分は、可能な答え全部の真ん中あたりを選ぶ」という単純な方針で、他の方法より当たることを示しました。分からないところを、ありえる答えの中央値で補うのが面白い点です。", "unverified": "本文未読のため、評価指標の値、人工ネットワークの設定は未確認。"}}, {"id": "pn49", "rank": 49, "field": "計算社会科学・ネットワーク科学", "headline": "山火事でのSNSの参加と注目は距離で非線形に異なる", "title": "Place and Political Behavior Online during the Los Angeles Blaze", "url": "https://arxiv.org/abs/2611.10631", "authors": "Sofi Koponen ほか", "venue": "arXiv", "date": "Tue, 10 Nov 2026", "apa": "Koponen, S., Salloum, A., Aiello, L. M., Kivelä, M., & Malkamäki, A. (2026). Place and Political Behavior Online during the Los Angeles Blaze (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.10631", "why": "2025年1月のロサンゼルス山火事に関するBlueskyの社会政治的な投稿をすべて分析した。集団行動への参加は距離に対して非線形で、近い層と国際層が地域・国内層より参加する一方、注目は地域・国内層による拡散的で非参加的な政治議論に集中し、参加と注目の地理的なずれを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "山火事のようなオンライン上の危機の議論で、集団行動への参加と注目が、震源からの距離で食い違うことを示した。", "p3": "2025年1月のロサンゼルス山火事に関するBlueskyの社会政治的なコンテンツをすべて分析し、集団行動への参加と注意の配分が、地理的な距離でどう変わるかを調べた（抄録）。", "p5": "参加は距離に対して非線形で、近い層と国際層が、地域・国内の層より多く参加する。注目は、地域・国内の層に集中し、その多くは拡散しやすいが参加につながらない政治的な議論だった。参加と注目の地理的なずれが見られ、気候危機のなかでオンラインの話題が、集団行動から注目をそらしていることを示す（抄録）。", "fun": "大きな山火事が起きると、近くの人も、遠くの外国の人も、SNSで動きます。でも、いちばん注目を集めたのは、その中間の「地域や国内」の人たちの議論で、行動（署名や支援）にはつながりにくいものでした。注目と行動が別の人たちに分かれていて、ニュースの盛り上がりが行動を生むとは限らないのが面白い点です。", "unverified": "本文未読のため、参加と注目の定義、距離の区分、データの規模は未確認。"}}, {"id": "pn50", "rank": 50, "field": "計算社会科学・ネットワーク科学", "headline": "ネットワーク内の信頼とネットワークへの信頼を認識網で分解", "title": "Trust within Networks and Trust in Networks", "url": "https://doi.org/10.2139/ssrn.7681418", "authors": "Mihnea Moldoveanu ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Moldoveanu, M., & Baum, J. A. C. (2026). Trust within Networks and Trust in Networks. https://doi.org/10.2139/ssrn.7681418", "why": "エージェントの信念と他者の信念についての信念を表す認識網（エピネット）で、ネットワーク内の信頼とネットワークそのものへの信頼を定式化した。後者は正確さ・信頼性・公平性・プライバシー・安全性・透明性・説明可能性の次元に分解し、主要なSNSに適用して、誤情報と公共の議論の認識的な脆弱性の含意を示す。LLMによる診断は概念実証。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみ。本文は入手できなかった", "preprint": true, "short": true, "p1": "ネットワークの中の信頼と、ネットワークそのものへの信頼を、信念についての信念まで表す認識網（エピネット）で整理した。", "p3": "エージェントの信念と、他者の信念についての信念を表す認識網（エピネット）で、ネットワーク内の信頼（能力と誠実さの信念に基づく情報の処理と更新の制度）と、ネットワークへの信頼（情報を選別して推論を支えるシステムとしての評価）を定式化する。後者は、正確さ・信頼性・公平性・プライバシー・安全性・透明性・説明
