Review)", "date": "2026-11-16", "apa": "Matsui, T., Morii, T., Okazawa, R., Nishino, T., Notake, H., & Hada, A. (2026). Bayesian seismic fragility curves for building components based on questionnaire damage data from the 2016 Kumamoto and 2022 Fukushima-ken Oki earthquakes. https://doi.org/10.21203/rs.3.rs-11550932/v1", "why": "2016年熊本地震と2022年福島県沖地震で被災した24棟の質問紙調査の被害データと多質点せん断モデルの応答から、FEMA P-58の脆弱性曲線を事前情報とするベイズ推定で、日本の建物の13種類の部材について18本の経験的脆弱性曲線を作った。設計基準の異なる日本の建物に米国の曲線をそのまま当てはめる問題に答える。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIにさらされた職で雇用減はなく若年層だけ減少", "title": "AI and the Labor Market: Productivity Driver or Job Killer?", "url": "https://econpapers.repec.org/RePEc:ces:econpr:_61", "authors": "Oliver Falck ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "ドイツの行政データとEU労働力調査で生成AI登場後の職業別の雇用を追い、AIにさらされた職業で広範な雇用減は見られない一方、ドイツでは20〜24歳の雇用が相対的に減り、EU全体でも自動化されやすい職で新卒採用が減る兆しがあると報告する。米国の最近の証拠と一致し、労働市場への入口の監視を勧める。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "パネルの反実仮想の推論を単位間の交換可能性で", "title": "Unit-Level Conformal Inference for Panel Counterfactuals", "url": "https://arxiv.org/abs/2611.19209", "authors": "Ziyi Liu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Liu, Z., & Xu, Y. (2026). Unit-Level Conformal Inference for Panel Counterfactuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19209", "why": "処置単位が少ないパネルの反実仮想推定（差の差法、合成統制、行列補完など）について、時間方向ではなく単位間の予測誤差の交換可能性に基づく等角推論を提案し、非定常性などの強い時間的異質性があっても有限標本で時点ごとの信頼集合を与える。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "組織で働くコーディングAIの課題完遂は8%未満", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "url": "https://arxiv.org/abs/2611.20218", "authors": "Xinping Lei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Lei, X., Liu, M., Zhu, R., Hu, X., Li, X., Zhang, A., Chai, W., Li, H., Wang, T., Zhang, J., Zhao, E., Shi, Y., Liang, Y., Yang, Z., Wang, X., Yao, Y., Ma, X., Li, Y., Yang, T., … Xuan, W. (2026). SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20218", "why": "101のリポジトリで、26人の同僚がいる模擬的な開発組織にエージェントを置き、同僚と記録に分散した要件の回収と矛盾の解消を求めるベンチマークを作った。11のモデルの上位2つでも失敗していたテストの約63%は通すが課題の完遂は8%未満で、部分的な実装と完遂の大きな差を示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "地震は人を性急にし消費を増やす", "title": "Identifying Time Preference Shocks: Stated and Revealed Preferences after an Italian Earthquake", "url": "https://arxiv.org/abs/2611.19662", "authors": "Krisztina Molnar ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Molnar, K., Rondinelli, C., & Wong, P. Y. (2026). Identifying Time Preference Shocks: Stated and Revealed Preferences after an Italian Earthquake (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19662", "why": "表明された性急さと顕示された選好（消費）を同時に見ることで、時間選好のショックと資金制約を識別する枠組みを作り、2009年ラクイラ地震で被害を受けなかった家計で、性急さの表明が増え非耐久財の消費が11%増えたと報告する。心理的ストレスの経路と整合的で、ストレスに弱い人に集中する。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "重み付き等角p値でBH法のFDR制御は破れる", "title": "Almost Controlled: The FDR of Benjamini-Hochberg on Weighted Conformal p-Values", "url": "https://arxiv.org/abs/2611.21509", "authors": "Ryan Lim (Albert Einstein College of Medicine)", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Lim, R. (2026). Almost Controlled: The FDR of Benjamini-Hochberg on Weighted Conformal p-Values (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21509", "why": "共変量シフトに対応する重み付き等角p値をBenjamini–Hochberg法に渡すと有限標本でFDRが制御されるかという問いに、厳密な有理数計算で確かめた2つの反例で否定的に答え、目標値からの超過の上限を校正点の数・検定単位の数・重みの比で与えた。"}, {"id": "pn09", "rank": 9, "field": "心理学・認知科学", "headline": "生成AIに頼った後は自力の推論で努力を調整しにくい", "title": "Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation", "url": "https://doi.org/10.31234/osf.io/83jum", "authors": "Dawid Ratajczyk ほか", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Ratajczyk, D., Dymarska, A., Matłoka, A., Tomczyk, M., & Wiącek, M. (2026). Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation. https://doi.org/10.31234/osf.io/83jum", "why": "事前登録した実験室実験（193人）で、関係推論の課題をChatGPTの有無と成果報酬の有無で解かせ、その後AIなしでより複雑な課題と記憶テストを課した。AIの支援は最初の正答率を上げたが、後の自力の推論がやや劣る証拠があり、報酬や難しさに応じた努力の調整が弱かった。記憶への明確な影響はなかった。"}, {"id": "pn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "自発的なチーム形成を安定性の制約で説明", "title": "Team Stability: Theory and Evidence", "url": "https://arxiv.org/abs/2611.19476", "authors": "Anton Badev", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Badev, A. (2026). Team Stability: Theory and Evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19476", "why": "個人が自ら協働相手を選んでチームができる過程を、合意による形成・外部性・混雑を含む理論で表し、メンバーが離脱や単独作業を望まないという安定性の制約を課した。連邦準備制度理事会のエコノミストの共同研究で、制約が観測されたチームを説明し、経験者に業務を移すと新人の研究成果と協働が増えると報告する。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "米大企業の社会問題への立場表明は4倍に", "title": "Corporate Stances on Societal Issues in the US", "url": "https://arxiv.org/abs/2611.19068", "authors": "Jacob Conway ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Conway, J., Hall, A., Larreboure, M., Pennec, C. L., Pons, V., & Sun, A. (2026). Corporate Stances on Societal Issues in the US (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19068", "why": "S&P500の836社について2008〜2025年の約5万2千件の記事・プレスリリースをLLMで読み、9つの党派的な争点で9,917件の立場表明を特定した。表明は2008年以降4倍に増えて2021年に最多、大半がリベラル寄りで大企業に集中し、ロビー活動や献金とは弱くしか関係せず、報道と関心の高まりに合わせて行われると報告する。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "規制当局の名指し公表でアプリの更新が減る", "title": "Regulatory Naming and Shaming and Product Innovation: Evidence from App Portfolios", "url": "https://doi.org/10.2139/ssrn.7694358", "authors": "Chenze Wang ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Wang, C., Xu, S., Wang, J., & Liu, S. (2026). Regulatory Naming and Shaming and Product Innovation: Evidence from App Portfolios. https://doi.org/10.2139/ssrn.7694358", "why": "利用者の権利を侵害したアプリを中国政府が公表する政策を準自然実験とし、iOSアプリのパネルで傾向スコアと差の差法を組み合わせ、名指しされたアプリの大型更新が約27.5%減る一方、同じ開発者の名指しされていないアプリでは約16.7%増えたと報告する。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "0.9Bから375Bまで開発履歴ごと公開したLLM群", "title": "K2-Horizon: A Frontier Fleet of Open Source Language Models", "url": "https://arxiv.org/abs/2611.21003", "authors": "K2 Team ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "K2 Team, Liu, Z., Li, H., Ma, X., Moreno, A., Sahoo, S. S., Srivastava, R. K., Yurochkin, M., Abdine, H., Akhauri, Y., Babu, A., Bellamy, D., Bhandari, J., Bouch, D., Bouhedja, W., Cao, W., Chamma, A., Chang, P.-C., Chen, J., … Xing, E. P. (2026). K2-Horizon: A Frontier Fleet of Open Source Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21003", "why": "0.9Bの密モデルから375B-A23BのMoEまで6つのモデルを、中間チェックポイントを含む開発履歴ごと公開した。注意の値射影にMoEを使うMoVAなどを導入し、36B-A4Bのモデルは同じデータの32B密モデルに活性パラメータ7分の1でほぼ並ぶと報告する。"}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "LATEの仮定が含む制約を使う条件付き尤度比検定", "title": "Never too LATE: Exploiting restrictions for inference on the Local Average Treatment Effect", "url": "https://arxiv.org/abs/2611.21496", "authors": "Xavier D'Haultf{\\oe}uille ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "D'Haultfœuille, X., Hazard, Y., & Ketz, P. (2026). Never too LATE: Exploiting restrictions for inference on the Local Average Treatment Effect (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21496", "why": "除外制約・独立性・単調性の仮定が含意する追加の制約を使い、局所平均処置効果（LATE）について、広いデータ生成過程で漸近的にサイズを一様に制御する条件付き尤度比検定を提案した。計算は軽く、弱い操作変数でもWald検定やAnderson–Rubin検定より検出力が高い。"}, {"id": "pn15", "rank": 15, "field": "工学", "headline": "地区別の被害集計からヒマラヤの組積造の脆弱性", "title": "What district damage statistics can identify: joint Bayesian inference of intensity and masonry vulnerability after the 2005 Kashmir earthquake", "url": "https://doi.org/10.21203/rs.3.rs-11509792/v1", "authors": "Syed Sajid Hussain", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Hussain, S. S. (2026). What district damage statistics can identify: joint Bayesian inference of intensity and masonry vulnerability after the 2005 Kashmir earthquake. https://doi.org/10.21203/rs.3.rs-11509792/v1", "why": "2005年カシミール地震の8地区・約79万戸の被害集計を、センサスの壁材とShakeMapの震度と組み合わせ、震度場を不確実とする階層ベイズで組積造の脆弱性関数を推定した。地区を除いた予測とインド側の公式統計で検証し、粗石造の脆弱性指数は欧州の基準と同程度かやや上と報告する。"}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "チーム募集では上位者に返信と成功が集中", "title": "Who Shows Up, Who Benefits, and Who Wins? Expert-Novice Disparities in Team-Seeking Forums and Competition Performance on Kaggle", "url": "https://arxiv.org/abs/2611.18983", "authors": "Ran Bi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Bi, R., & Wei, S. (2026). Who Shows Up, Who Benefits, and Who Wins? Expert-Novice Disparities in Team-Seeking Forums and Competition Performance on Kaggle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18983", "why": "Kaggleの「チームを探す」スレッドの2023年の18のコンペで、参加者671人の89.3%は下位層だが、上位層ほど返信を多く受け、チーム形成に成功しやすい（52.9%対32.6%）ことを示し、公開のチーム形成が既存の階層を再生産しうると報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "Kaggleの「チームを探す」スレッドで、公開のチーム募集が参加の機会を広げるのか既存の階層を再生産するのかを調べ、上位の利用者に返信とチーム形成の成功が集中することを示した（抄録）。未査読。", "p3": "2023年の18のコンペで、実践共同体の理論に基づき、研究1でスレッドの参加者671人の返信ネットワークを、研究2で219人の参加の痕跡と非公開の順位表の成績の関係を分析した（抄録）。", "p5": "参加者の89.3%は下位層だが、上位層は返信が多く（Kruskal–Wallis H=16.46）、チーム形成の成功率も高かった（52.9%対32.6%）。成績は提出回数（ρ=.435）と正に関連したが、スレッドでの議論とは関連しなかった（ρ=−.021）（抄録）。", "fun": "誰でも参加できる「仲間募集」の掲示板は平等に見える。ところが実際には、腕が知られた人に声がかかり、初心者は取り残されやすかった。しかも勝敗を分けたのは掲示板でのおしゃべりではなく、何度も答えを出して試す実践だった。開かれた場が自動的に公平になるわけではないという点が面白い。", "unverified": "初心者層での提出と成績の関係の推定は不精確（著者が明記）。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "チームの動きを52変数のポート・ハミルトン系で予測", "title": "ANCHOR: A Port-Hamiltonian Model for Forecasting Team Dynamics in Human-in-the-Loop Systems", "url": "https://arxiv.org/abs/2611.19124", "authors": "Diana Romero ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Romero, D., & Elmalaki, S. (2026). ANCHOR: A Port-Hamiltonian Model for Forecasting Team Dynamics in Human-in-the-Loop Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19124", "why": "複合現実のヘッドセットで計測した発話・視線・位置からチームの協働を予測するため、チームを「エネルギーの器の中の球」とみなす52パラメータのスイッチ型ポート・ハミルトン系を提案し、各部分をチーム心理学の検証可能な主張に対応させた。約4万パラメータのブラックボックスと同等の精度で、会話の崩壊をAUROC 0.85で予測する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "複合現実のヘッドセットで測ったチームの協働を予測するため、チームを「エネルギーの器の中の球」とみなす52パラメータのスイッチ型ポート・ハミルトン系ANCHORを提案した（抄録）。未査読。", "p3": "誰が話し、どこを見て、誰と立っているかを入力に、器の底（チームの安定点）を最近の行動・自身の履歴・他チームの3つの源から決める。各部分をチーム心理学の検証可能な主張に対応させ、促し（プロンプト）の影響が有界になる構造を持たせた（抄録）。", "p5": "訓練に使っていない4人チームで、普段の行動からずれたチームは30秒以内に大部分戻り、32秒後のずれの残り約24%をANCHORは30%と予測した。約4万パラメータのブラックボックスと同等の精度で、会話の崩壊をAUROC 0.85で予測した（抄録）。", "fun": "チームの雰囲気が崩れかけたとき、すぐ元に戻るのか、そのまま崩れるのか。この研究は、チームを「お椀の底に向かって転がる球」にたとえた物理の式で表した。わずか52個の数字で4万個の数字を使うAIと同じくらい当てられ、しかも各数字の意味が読める。物理の考え方を人の集団に使う発想が面白い。", "unverified": "チームの数は抄録では記号のままで確認できない。促しの効果は仮定に基づくシミュレーションである。"}}, {"id": "pn18", "rank": 18, "field": "心理学・認知科学", "headline": "再現失敗後の再挑戦で再現したのは17件中5件", "title": "Estimating the replicability of psychology experiments after an initial failure to replicate", "url": "https://doi.org/10.31234/osf.io/an3yb_v2", "authors": "Veronica Boyce ほか", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Boyce, V., Prystawski, B., Abutto, A. B., Chen, E. M., Chen, Z., Chiu, H., Ergin, I., Gupta, A., Hu, C., Kemmann, B., Klevak, N., Lua, V. Y. Q., Mazzaferro, M., Mon, K., Ogunbamowo, D., Pereira, A., Troutman, J., Tung, S., Uricher, R., & Frank, M. C. (2026). Estimating the replicability of psychology experiments after an initial failure to replicate. https://doi.org/10.31234/osf.io/an3yb_v2", "why": "最初の追試で再現できなかった心理学の17の実験を再び追試し、5件（29%）で元の結果がおおむね再現されたが効果量は小さく、12件は再び失敗したと報告する。明らかな弱点のない失敗の後は、その効果の追究をやめるのが効率的かもしれないと論じる。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "最初の追試で再現できなかった心理学の17の実験を再び追試し、5件（29%）で元の結果がおおむね再現されたが、12件は再び失敗したことを報告した（抄録）。未査読。", "p3": "一度再現に失敗した実験について、「救出」のための2度目の追試を17件行い、元の結果の再現の程度を判定した（抄録）。", "p5": "再現した5件でも効果量は小さかった。成功は標本の大きさや注意確認などの方法の変更によるかもしれないと推測し、失敗した追試に明らかな弱点がなければ、1回の失敗で追究をやめるのが効率的かもしれないと論じる（抄録）。", "fun": "心理学の有名な実験を追試すると、再現できないことが少なくない。では一度失敗したら、もう一度試すべきか。17件で再挑戦すると成功は3割弱で、それも効果は小さかった。科学の限られた時間とお金をどこに使うかという、研究の進め方そのものに答えようとしている点が面白い。", "unverified": "17件の実験の内訳と、成功と判定した基準の詳細は抄録からは確認できない。"}}, {"id": "pn19", "rank": 19, "field": "心理学・認知科学", "headline": "臨床心理の力学系研究に高次元の呪い", "title": "The Curse of Dimensionality: How Does it Affect Dynamical Systems Research in Clinical Psychology?", "url": "https://doi.org/10.31234/osf.io/8uyv7", "authors": "Jingmeng Cui", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Cui, J. (2026). The Curse of Dimensionality: How Does it Affect Dynamical Systems Research in Clinical Psychology? https://doi.org/10.31234/osf.io/8uyv7", "why": "臨床心理学で広がる力学系アプローチが低次元の安定性の地形に頼っていることを指摘し、高次元の地形が直観と食い違う可能性と、安定性と遷移の情報を保つ低次元の記述という解決策、次元縮約を中心とする研究課題を提案する。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "臨床心理学の力学系アプローチが多変数を想定しながら低次元の安定性の地形に頼っているずれを指摘し、高次元の問題と次元縮約による解決策を論じた（抄録）。未査読。", "p3": "高次元の安定性の地形が低次元から得た直観とどう食い違いうるかを議論し、安定性と遷移の情報を保つ「十分な低次元の記述」を解決策として示した（抄録）。", "p5": "安定性と遷移の情報を保つ次元縮約の手法を中心とする、今後の研究課題を提案した（抄録）。", "fun": "心の状態を「谷と山のある地形を転がる球」にたとえ、うつ状態は深い谷に落ちた状態だ、と説明することがある。ところが心は何十もの要素からなり、高次元の地形は2次元の絵とは性質が大きく違う。直観に頼りすぎず、大事な情報を残したまま次元を減らす必要がある、という指摘が面白い。", "unverified": "理論的な論考で、具体的な数値例は抄録からは確認できない。"}}, {"id": "pn20", "rank": 20, "field": "経営学", "headline": "運用者の大学の授業内容が運用成績を左右", "title": "Education and Investment Skill: Evidence from Mutual Fund Managers&nbsp;", "url": "https://doi.org/10.2139/ssrn.7694303", "authors": "Vasudha Nair", "venue": "SSRN", "date": "2026-11-16", "apa": "Nair, V. (2026). Education and Investment Skill: Evidence from Mutual Fund Managers&nbsp; https://doi.org/10.2139/ssrn.7694303", "why": "約7万5千のシラバスから大学の教育の「運用実務への関連性」と「研究への適時性」を測り、どちらも1標準偏差高いと年率約0.5ポイント高いリターンと関連し、高校に最も近い大学の値を操作変数にしても結果が保たれると報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "投資信託の運用者が卒業した大学の授業内容が運用成績を説明するかを約7万5千のシラバスで調べ、実務への関連性と研究への適時性がともに高いリターンと関連することを示した（抄録）。未査読。", "p3": "シラバスから「運用実務への関連性」と「同時代の研究への適時性」を測って運用成績との関係を推定し、運用者の高校に最も近い大学の値を操作変数に使った（抄録）。", "p5": "どちらの指標も1標準偏差高いと年率約0.5ポイント高いリターンと関連し、操作変数でも結果が保たれた。関連性の高い教育はアナリストの多い銘柄で、適時性の高い教育はアナリストの少ない銘柄で高いリターンと関連した（抄録）。", "fun": "大学で何を習ったかが、何年も後の仕事の成績に表れるのか。この研究は大学の授業の計画書（シラバス）を7万枚以上読み、実務に役立つ内容と、最新の研究を取り入れた内容の両方が、運用成績の高さと結びつくことを示した。授業の中身を数値にして職業の成果と結ぶ発想が面白い。", "unverified": "シラバスの内容を測る方法（テキスト分析の手順）は抄録からは確認できない。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "誰も読まない開示が投資信託の行動を律する", "title": "The Hidden Work of Disclosures", "url": "https://doi.org/10.2139/ssrn.7709199", "authors": "Timothy D. Lytton ほか", "venue": "SSRN", "date": "2026-11-16", "apa": "Lytton, T. D., & Tucker, A. M. (2026). The Hidden Work of Disclosures. https://doi.org/10.2139/ssrn.7709199", "why": "投資顧問・運用者・コンプライアンス担当・弁護士への面接から、投資信託の開示は投資家に読まれる前の作成・審査の過程で専門職の規範と法的監督を働かせ、商品設計や運用を律していると論じ、開示は無効だという通説に反論する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "投資家のほとんどが読まない投資信託の開示にも、作成・審査の過程で運用会社の行動を律する効果があると、関係者への面接から論じた法学の論文（抄録）。未査読。", "p3": "投資顧問、運用者、コンプライアンス担当、ファンドの弁護士への独自の面接を行い、開示の作成・審査・改訂の過程で何が起きているかを調べた（抄録）。", "p5": "開示の作成過程が専門職の規範・法的な監督・組織の手順を働かせ、商品設計・販売・運用・法令遵守を形づくると示した。「言う通りにやり、やる通りに言う」という規範による共同規制と捉え直し、公的な監督が弱まっても事前に投資家を守りうると論じる（抄録）。", "fun": "取扱説明書や約款のように、誰も読まない書類に意味はあるのか。この研究は、読まれるかどうかではなく「書く過程」に効果があると主張する。会社の中で弁護士や担当者が「本当にこの通りにやっているか」を確かめ合う過程そのものが、行動を正しているというのだ。書類の価値を書き手の側から見る点が面白い。", "unverified": "面接の人数と分析の方法は抄録からは確認できない。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "インフルエンサーの「役立つ嘘」が厚生を上げる", "title": "Truths, Half-truths and Helpful Lies: Crafting Influencer Strategy using Information Design", "url": "https://doi.org/10.2139/ssrn.7691622", "authors": "Sridhar Balasubramanian", "venue": "SSRN", "date": "2026-11-17", "apa": "Balasubramanian, S. (2026). Truths, Half-truths and Helpful Lies: Crafting Influencer Strategy using Information Design. https://doi.org/10.2139/ssrn.7691622", "why": "ベイズ説得の情報設計で、第三者の口コミサイトが良い組み合わせを悪いと判定する誤りがある市場での最適なインフルエンサー戦略を導き、その誤りが小さいときは消費者厚生を最大にするインフルエンサーが悪い組み合わせを良いと伝える「役立つ嘘」で普及不足を補うと示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "独立した口コミサイトが誤る市場での最適なインフルエンサー戦略を、ベイズ説得に基づく情報設計で導き、口コミサイトの誤りの大きさで最適な戦略が切り替わることを示した（抄録）。未査読。", "p3": "評判を気にする口コミサイトは良い組み合わせの商品を悪いと判定する誤り（第2種の誤り）をし、インフルエンサーは手数料と消費者厚生の兼ね合いで偏った評価を投稿するとして、企業の起用・契約・価格の選択を内生化したモデルを解いた（抄録）。", "p5": "誤りが小さいときは消費者厚生を最大にするインフルエンサーを使うのが最適で、その人は悪い組み合わせを良いと伝える「役立つ嘘」で普及不足を補う。誤りが中程度なら販売志向のインフルエンサーを手数料で動かし、大きいとインフルエンサーを使わない（抄録）。", "fun": "口コミサイトは、合う人には良い商品を「合わない」と言ってしまうことがある。それを補うために、インフルエンサーがときに「合わない人にも合う」と言う小さな嘘が、全体ではみんなを得させる場合がある。正直が常に最善とは限らないという結論を数式で示した点が意外で面白い。", "unverified": "モデルの数値例や実データでの検証の有無は抄録からは確認できない。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "話題のゲームの効果を経路別に分解", "title": "From Viral Exposure to Engagement: A Causal Mediation Framework for Digital Platforms", "url": "https://arxiv.org/abs/2611.18945", "authors": "Bolun Liu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Liu, B., Manthena, V., Toh, W., & Zheng, W. (2026). From Viral Exposure to Engagement: A Causal Mediation Framework for Digital Platforms (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18945", "why": "Robloxで、話題のゲームのプレイ時間がその後の利用に与える効果を、交流や発見の行動を介する間接効果と直接効果に分ける因果媒介の枠組みを作った。交差適合のR-learnerで経路ごとの効果を共変量の関数として推定し、平均する前に個人ごとの偏りの補正を加える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "Robloxで、話題のゲームのプレイ時間がその後の利用に与える効果を、交流と発見の行動を介する間接効果と直接効果に分ける因果媒介の枠組みを作り、2つのゲームに適用した（抄録）。未査読。", "p3": "因果DAGで仮定を明示し、共変量・曝露・媒介・結果を重ならない時間窓で測る設計で、交差適合のR-learnerで各経路の効果を共変量の関数として推定し、平均の前に個人ごとの偏り補正（Chernozhukovら2018）を加えた（抄録）。", "p5": "シミュレーションで補正は被覆率を90〜95%に戻した（曲面を平均するだけでは最大39%）。実データでは、その後の利用は話題作への曝露だけでは説明できず、話題作内の利用の46%を交流行動が、他のゲームの利用の52%を新しいゲームの発見が媒介した（抄録）。", "fun": "大ヒットしたゲームで遊んだ人は、その後もたくさん遊ぶようになるのか。それはヒット作そのものの力か、友達と遊ぶようになったからか、別のゲームを見つけたからか。この研究は効果の通り道を分けて測った。データが増えるとかえって信頼区間が外れやすくなる場合があるという発見も意外で面白い。", "unverified": "2つのゲームの名前と、識別の仮定が満たされるかの検証の詳細は抄録からは確認できない。"}}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "事実と反事実を同時に学ぶ因果PFN", "title": "Joint Learning of Factual and Counterfactual Worlds for Causal Prior-data Fitted Networks", "url": "https://arxiv.org/abs/2611.19710", "authors": "Furkan Danisman ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Danisman, F., Zhang, L., Jin, Z., & Kong, D. (2026). Joint Learning of Factual and Counterfactual Worlds for Causal Prior-data Fitted Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19710", "why": "合成データで事前学習する因果のPFN（事前データ適合ネットワーク）は両方の世界の結果を生成できるのに、学習目標が単位ごとに一方の結果しか使っていなかったと指摘し、事実と反事実の世界を同時に学習して、処置効果の分布の依存構造を捉える方法を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "合成データで事前学習する因果のPFN（事前データ適合ネットワーク）を、単位ごとの事実と反事実の結果の同時分布を学ぶ「同時学習」で訓練し、応答・個別処置効果・平均処置効果の3つの密度を世界間の依存を考慮して得られるようにした（抄録）。未査読。", "p3": "既存の因果PFNは合成データでも単位ごとに一方の世界の結果しか学ばず、両世界の依存が失われ独立が仮定されていたと指摘し、同時分布を学習させ、推論時には単位間の最適輸送で平均処置効果の密度を近似した（抄録）。", "p5": "既存の因果PFNに同時学習と最適輸送を加え、半合成・合成・実データのベンチマークで評価し、多くの設定で点推定と不確実性の定量化が基準より有意に改善した（抄録）。", "fun": "薬を飲んだ人が、飲まなかったらどうなっていたかは、現実には決して観察できない。ところが計算機の中で作った架空の世界なら、両方の結果を同時に作れる。この研究は、その「両方が見える」利点を学習に生かし切っていなかった既存の方法を改めた。現実ではできないことを訓練の段階で活用する発想が面白い。", "unverified": "ベンチマークごとの改善の大きさは抄録からは確認できない。"}}, {"id": "pn25", "rank": 25, "field": "因果推論", "headline": "二つの環境の差で予測を頑健にする因果正則化", "title": "Causal Regularization for Robust Prediction", "url": "https://arxiv.org/abs/2611.18814", "authors": "Alessia Berarducci ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Berarducci, A., Lembo, M., Vinciotti, V., & Wit, E. C. (2026). Causal Regularization for Robust Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18814", "why": "学習データに2次モーメントの有限性だけを仮定し、2つの環境の共変量と応答の2次モーメントの違いで定めた一般化リスク差から、分布の変化に頑健な予測を得る因果正則化を一般化した。OLSと正則化の極限を補間する閉じた形の推定量を導く。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "学習データに2次モーメントの有限性だけを仮定し、2つの環境の差を使って分布の変化に頑健な予測を得る因果正則化を一般化した（抄録）。未査読。", "p3": "共変量と応答の2次モーメントの変化から定めた一般化リスク差で2つの環境の違いを測り、環境外の分布の篩を定めて最悪リスクを分解し、OLSと正則化の極限解の間を補間する閉じた形の推定量を導いた（抄録）。", "p5": "提案した推定量は限られた環境で学習しても広い摂動環境で予測を安定させうる。内積の不変性と、原因となる変数を与えたときの条件付き平均の不変性のもとで、因果的な解釈が回復する（抄録）。", "fun": "ある病院のデータで作った予測を別の病院で使うと、うまくいかないことがある。環境が変わっても崩れにくい予測を作るのが頑健な予測だ。この研究は、二つの環境のずれ方から「ずれに強い方向」を学び、ふつうの回帰と強い正則化の中間を選ぶ式を作った。頑健さと因果を別の目標として分けて考える点が面白い。", "unverified": "数値実験やデータでの検証の結果は抄録からは確認できない。"}}, {"id": "pn26", "rank": 26, "field": "因果推論", "headline": "為替介入は識別の良い研究ほど効果が明確", "title": "Does Foreign Exchange Intervention Move Exchange Rates? Evidence Ranked by Identification Strategy", "url": "https://doi.org/10.31235/osf.io/wp7bg", "authors": "Alain Naef", "venue": "SocArXiv", "date": "2026-11-16", "apa": "Naef, A. (2026). Does Foreign Exchange Intervention Move Exchange Rates? Evidence Ranked by Identification Strategy. https://doi.org/10.31235/osf.io/wp7bg", "why": "中央銀行は通貨が圧力を受けているときに介入するため単純な推定は効果を0に近づけると論じ、9つの実証デザインを識別の信頼性で順位づけて50年分の証拠を読み直し、信頼性の高いデザインほど介入が意図した方向に数分から数週間効くという結果が明確になると示した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "為替介入が為替相場を動かすかという長年の論争で、証拠が食い違って見えるのは識別の問題だと論じ、識別の信頼性で研究デザインを順位づけて50年分の証拠を読み直した（抄録）。未査読。", "p3": "中央銀行は通貨が既に圧力を受けているときに介入するため単純な推定は効果を0に近づけ、符号を反転させることもあると指摘し、日次のイベントスタディから高頻度データ、回帰不連続、合成統制までの9つのデザインを、この偏りへの対処の良さで順位づけた（抄録）。", "p5": "信頼性の高いデザインほど結果が明確で、介入は数分から数週間、意図した方向に相場を動かす。効果の持続、秘密介入の役割、介入の費用は未解決で、政策の組み合わせ・外貨準備・ドルの支配に依存する（抄録）。", "fun": "中央銀行は円安が進んで困ったときに介入する。だから介入の直後も円安が続いていると、「介入は効かない」ように見えてしまう。この研究は、こうした見かけのからくりにどれだけ対処できているかで過去の研究を並べ直し、信頼できる研究ほど「効く」と示した。結論より、証拠の読み方を変えた点が面白い。", "unverified": "9つのデザインの具体的な順位と、読み直した研究の数は抄録からは確認できない。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "農業債務の免除で家計は出稼ぎから地元の起業へ", "title": "Business Debt Relief and the Reallocation of Household Labor", "url": "https://doi.org/10.2139/ssrn.7694858", "authors": "Naman Nishesh", "venue": "SSRN", "date": "2026-11-16", "apa": "Nishesh, N. (2026). Business Debt Relief and the Reallocation of Household Labor . https://doi.org/10.2139/ssrn.7694858", "why": "インドの大規模な農業債務免除の適格基準の準無作為性を使い、銀行の行政記録と事業登録を結びつけ、免除対象の家計が都市への出稼ぎ労働を減らし、地元での小規模事業の借入と非農業の起業を増やしたと報告する。農場単位の評価では見えない便益を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "インドの大規模な農業債務の免除で、家計が都市への出稼ぎを減らして地元での非農業の起業を増やし、農場単位の評価では見えない便益があることを示した（抄録）。未査読。", "p3": "2つの大規模な債務免除の適格基準による準無作為な差を利用し、銀行の行政記録を事業登録と結びつけ、免除対象の家計と比較可能な非対象の家計を比べた（抄録）。", "p5": "免除対象の家計は都市の賃金労働への依存を減らし、出稼ぎしていた人は戻る傾向があった。同じ家計は小規模事業の借入を増やし、地元で非農業の事業をより多く始めた。影響の大きい地区では事業の創出と経済活動も増えた（抄録）。", "fun": "借金を帳消しにしても農業の生産性は上がらない、という謎があった。この研究は、家族が借金から解放されると、都会への出稼ぎをやめて地元で小さな商売を始めることを見つけた。効果は畑の中ではなく家族の働き方の変化に表れていたのだ。評価する場所を変えると見えるものが変わる好例として面白い。", "unverified": "効果の大きさの数値は抄録からは確認できない。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "犯罪組織からの領域奪還で零細事業の所得が13%増", "title": "The Economic Returns to Restoring State Control: Informal Businesses and Security Policy in El Salvador", "url": "https://doi.org/10.2139/ssrn.7691958", "authors": "Johann Caro-Burnett ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Caro-Burnett, J., & Ayala, R. (2026). The Economic Returns to Restoring State Control: Informal Businesses and Security Policy in El Salvador. https://doi.org/10.2139/ssrn.7691958", "why": "エルサルバドルの地理的に絞った治安計画の段階的な導入と2015〜2025年の家計調査から、インフォーマルな自営業の実質月収が約13%増え、時間当たり所得も増えたと推定した。2022年以降も約15%の増加が続き、治安の認識も改善したと報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "エルサルバドルで犯罪組織の支配地域を国家の管理下に戻す治安計画（PCT）が、インフォーマルな自営業の所得を約13%増やしたと推定した（抄録）。未査読。", "p3": "地理的に絞った治安計画の段階的な導入と、2015〜2025年の家計調査を用いて、優先された自治体と比較対象の自治体を比べた（抄録）。", "p5": "自営業の実質月収は約13%増え、事業の収入と時間当たり所得も増えたが、労働時間に有意な変化はなかった。2022〜2025年も約15%の増加が続いたが差はそれ以上広がらず、強盗・暴行の減少と治安の認識の改善は優先自治体で大きかった（抄録）。", "fun": "ギャングが地域を支配していると、店を出しても客が来られず、みかじめ料も取られる。治安が戻ると小さな商売の稼ぎはどれだけ増えるのか。この研究は、警察の計画が地域ごとに順に始まったことを利用して、その効果を約13%と見積もった。治安を経済の視点から測る点が面白い。", "unverified": "推定に使った具体的な手法（差の差の種類）は抄録からは確認できない。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "ドラマの聖地化で観光は急増したが雇用は増えず", "title": "A Game of Throngs: How Spotlight Tourism Reshapes Local Economies", "url": "https://arxiv.org/abs/2611.21364", "authors": "Mafalda Batalha ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Batalha, M., & Viviens, J. (2026). A Game of Throngs: How Spotlight Tourism Reshapes Local Economies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21364", "why": "2017年に『ゲーム・オブ・スローンズ』の舞台になったバスクの礼拝堂を外生的なショックとし、行政データと合成統制法で、観光は急増したが観光関連の雇用増は他部門の減少で相殺され総雇用は変わらず、住宅市場の過熱の兆候があったと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ドラマの撮影地になって観光客が急増したスペインの小さな礼拝堂の地域で、観光は急増したが総雇用は増えず、住宅市場の過熱の兆しがあったことを示した（抄録）。未査読。", "p3": "2017年7月に『ゲーム・オブ・スローンズ』に登場したバスクのサン・フアン・デ・ガステルガチェを外生的なショックとし、新しい行政データと合成統制法で地域経済への因果効果を推定した（抄録）。", "p5": "観光活動は先行研究を大きく上回るほど急増したが、観光関連の雇用の増加は他部門の減少でほぼ相殺され、総雇用への効果はなかった。不動産の取引件数と価格が上がり、住民の流出は見られず、外国からの転入が約2倍になった（抄録）。", "fun": "ある日突然、テレビドラマのおかげで小さな村が世界的な観光地になる。地元は豊かになったのだろうか。調べると、観光の仕事は増えたが他の仕事が減り、全体の働き口は変わらなかった。代わりに家の値段が上がった。観光ブームが必ずしも地元の暮らしを広く良くするわけではないことを示した点が面白い。", "unverified": "対象地域の範囲と合成統制の比較地域は抄録からは確認できない。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "AIの高度化は価格の情報効率を下げうる", "title": "The opposing informational effects of AI trading", "url": "https://arxiv.org/abs/2611.18872", "authors": "Hajime Shimao", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Shimao, H. (2026). The opposing informational effects of AI trading (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18872", "why": "資源の限られた予測を行う競争市場で、高性能なアルゴリズムが私的観察を公開記録の分析で代替し、価格に集約される私的情報が減る効果と、高度な分析を他の投資家に伝える効果が共存する条件を示した。神経ネットによる市場実験では、普及が進むと性能向上の利得が44%下がった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIの性能向上が個々の予測を良くしても、価格が新しい情報を伝える力を高めるとは限らず、私的情報の集約を減らす効果と高度な分析を伝える効果が共存することを示した（抄録）。未査読。", "p3": "資源の限られた予測を行う競争市場のモデルで、2つの効果が共存し、さらなる計算の私的な便益が下がる条件を示し、数値的な均衡計算、有限データの神経ネットの市場実験、利益予想と言語モデルの統制課題で確かめた（抄録）。", "p5": "神経ネットの実験では、普及が進むと限られた観察者にとって価格の予測力は上がるが高度な観察者には下がり、性能向上の便益は44%下がった。性能向上しなかった投資家の再学習は私的情報の精度の低下を増幅しうる（抄録）。", "fun": "株の売買にAIを使う人が増えると、みんなが公開データの分析に頼り、自分だけが知る現場の情報を集めなくなるかもしれない。すると株価は、隠れた情報を映す鏡としての力を失う。一方で、分析の結果は株価を通じてAIを持たない人にも伝わる。AIの普及が市場の「知恵」を増やすとは限らないという指摘が面白い。", "unverified": "モデルの具体的な仮定と実証の詳細は抄録からは確認できない。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "学習データへの対価支払いがAIによる代替を進める", "title": "Paying Creators for Training Data Can Increase AI Displacement", "url": "https://arxiv.org/abs/2611.20204", "authors": "Lijuan Luo ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Luo, L., Manzoor, E., Yang, N., & Yao, F. (2026). Paying Creators for Training Data Can Increase AI Displacement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20204", "why": "作り手が学習データを提供するかを選び、消費者が作り手の作品とAIの生成物を選ぶプラットフォームのモデルで、学習データへの対価の支払いを義務づけると、質の低い作り手はデータの提供に専念しAIが需要を完全に奪うことを示した。支払いがない場合は、作り手を失う恐れが価格を抑える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "生成AIの学習データについて作り手への対価の支払いを義務づけると、かえってAIによる作り手の代替が進みうることを、プラットフォームのモデルで示した（抄録）。未査読。", "p3": "作り手が学習データを提供するかを選び、消費者が作り手の作品と作り手の作品で学んだ生成AIのどちらを買うかを選ぶモデルで、対価の支払いとオプトアウトの政策の効果を分析した（抄録）。", "p5": "支払いを義務づけると、質の低い作り手は学習データの提供者に専念し、AIの質と価格が同じでもAIが需要を完全に奪う。支払いがないと作り手とデータを失う恐れがプラットフォームの価格を縛り、AIの改善によるさらなる代替を防ぐ。支払いは作り手の利得と総余剰を増やすが消費者余剰を減らす（抄録）。", "fun": "AIが絵や文章の作り手の作品から学ぶなら、作り手にお金を払うべきだという声がある。ところがこの研究のモデルでは、お金を払う仕組みにすると、一部の作り手は作品を売るのをやめてデータを売る側に回り、AIに市場を奪われてしまう。良かれと思った政策が逆の結果を生むしくみを示した点が面白い。", "unverified": "モデルの結果の頑健性（作り手が多数いる場合など）は抄録からは確認できない。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "戦争による物価ショックでECBへの信認が低下", "title": "Transient Shocks Fade, Persistent Ones do Not: The ECB's Credibility with Households after Two Wars", "url": "https://doi.org/10.2139/ssrn.7692760", "authors": "Leonardo Cadamuro", "venue": "SSRN", "date": "2026-11-17", "apa": "Cadamuro, L. (2026). Transient Shocks Fade, Persistent Ones do Not: The ECB’s Credibility with Households after Two Wars. https://doi.org/10.2139/ssrn.7692760", "why": "ECB消費者期待調査の同じ家計を2022年のウクライナ侵攻と2026年の中東の戦争の前後で追い、両方で1年先の期待インフレ率が2.3ポイント上がり、ECBが物価安定を保つ確率の評価が下がったと報告する。原油価格が戻った2026年7月には損失の3分の1から3分の2を回復した。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2022年のウクライナ侵攻と2026年の中東の戦争によるエネルギー価格のショックの前後で同じ家計を追い、ECBへの信認の低下と回復の違いを示した（抄録）。未査読。", "p3": "ECB消費者期待調査のミクロデータで、1年先の期待インフレ率とECBが物価安定を保つ確率の評価を2つの戦争の前後で比べ、各国の物価の違いを使って、家計が自国の物価でECBを判断するかも調べた（抄録）。", "p5": "両方の戦争で期待インフレ率は2.3ポイント上がり、物価安定の確率の評価も同程度下がった。2026年7月には損失の3分の1から3分の2を回復したが、2022年7月には全く回復していなかった。自国の物価の影響は検出されず、ECBへの信認1点あたり短期の期待の改定は約0.1ポイント小さかった（抄録）。", "fun": "戦争で燃料の値段が上がると、人々は「物価はもっと上がる」と考え、中央銀行への信頼も揺らぐ。同じ家計を二度の戦争で追うと、一時的なショックなら信頼はすぐ戻り、長引くショックでは戻らなかった。人々の期待が、出来事の持続性をよく見分けていることを示した点が面白い。", "unverified": "家計の標本の大きさは抄録からは確認できない。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "LLMで付けた処置ラベルの回帰は誰の効果か", "title": "Who Is the Regression About? Auditing AI-Labeled Treatments When Effects Differ", "url": "https://arxiv.org/abs/2611.21207", "authors": "Ayman Farahat", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Farahat, A. (2026). Who Is the Regression About? Auditing AI-Labeled Treatments When Effects Differ (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21207", "why": "LLMが付けた処置のラベルにOLSを当てると、処置群と対照群の効果を少ない群に重みを置いて平均すると指摘し、ラベルの偏りを古典的な減衰と結果に相関する選択的な項に分解した。LinkedInの求人でリモート勤務の賃金差が約40%過小評価されることと、層別の盲検監査による補正を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMが付けた処置のラベルで回帰すると、効果が異なるときにOLSが誰の効果を推定しているかがずれ、ラベルの誤りが選択的な偏りを生むことを示し、補正の方法を示した（抄録）。未査読。", "p3": "効果が異なるとき、OLSは処置群の効果（ATT）と対照群の効果（ATU）を少ない群に重みを置いて平均すると指摘し、ラベルの偏りを誤分類による古典的な減衰と、誤りが結果と相関するときの選択的な項に分解した（抄録）。", "p5": "LinkedInの求人で、モデルは賃金の高いリモート勤務の求人を見逃し、精度の確認には合格するのにリモート勤務の賃金差を約40%過小評価した。この偏りはデータを増やしても消えないが、両方のラベル群の層別の盲検監査で補正でき、両方の効果を復元できた（抄録）。", "fun": "AIに大量の求人票を読ませて「リモート勤務かどうか」の印を付けさせ、給料の差を調べるのは便利だ。だがAIが給料の高い求人ほど見落とすと、精度の検査には合格しても結論が大きくずれる。しかもデータを増やしても直らない。AIの付けた印をそのまま使う危うさと、少数の人手の確認で直す方法を示した点が面白い。", "unverified": "監査に必要な標本の大きさは抄録からは確認できない。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "共変量シフト下の重み付き等角予測の極限理論", "title": "Weighted conformal prediction under covariate shift: process limits, estimated weights and efficiency", "url": "https://arxiv.org/abs/2611.20052", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Pournaderi, M. (2026). Weighted conformal prediction under covariate shift: process limits, estimated weights and efficiency (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20052", "why": "共変量シフトに尤度比で重み付けする分割等角予測について、重み付き経験分布関数の過程の弱収束をχ²距離が有限であることと同値に特徴づけ、水準をまたぐ被覆の同時分布、整合的なブートストラップ、推定された重みの影響を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "共変量シフトのもとの重み付き分割等角予測について、重み付き経験分布関数の過程の極限を特徴づけ、推定した重みの影響と効率性を明らかにした（抄録）。未査読。", "p3": "較正のスコアを尤度比で重み付けした自己正規化の経験分布関数の過程を調べ、χ²距離が有限であることと、ガウス過程への弱収束が同値であることを示した（スコアが非退化の場合）（抄録）。", "p5": "極限から水準をまたぐ被覆の同時分布、整合的なブートストラップ、Berry–Esseen型の収束率を得た。推定した比は分散をオラクルより小さくしうる共分散の項として入り、比が既知のときの半パラメトリック効率の必要十分条件と、χ²距離が無限のときのp安定の極限も示した（抄録）。", "fun": "予測が当たる範囲（予測区間）を、訓練時と状況が違うデータでも保証したいとき、データに重みを付けて補正する。この研究は、その補正がうまく働く条件が、二つの分布の「ずれの大きさ」が有限であることとぴったり一致することを証明した。重みを推定した方がかえってばらつきが小さくなる場合があるという結果も面白い。", "unverified": "数値実験の有無と結果は抄録からは確認できない。"}}, {"id": "pn35", "rank": 35, "field": "統計学", "headline": "低次元スケッチでシミュレーション推論を圧縮", "title": "Compressed Simulation-Based Inference: Neural Posterior Estimation for Massive Data via Low-Dimensional Sketches", "url": "https://arxiv.org/abs/2611.21286", "authors": "Michael Wieck-Sosa ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wieck-Sosa, M., & Shalizi, C. R. (2026). Compressed Simulation-Based Inference: Neural Posterior Estimation for Massive Data via Low-Dimensional Sketches (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21286", "why": "大量データの神経事後推定で、要約統計量の代わりにデータのランダムな低次元スケッチを条件とする方法を提案し、p次元のパラメータでは2p+1個のスケッチで事後一致性が得られることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "大量のデータのシミュレーションに基づく推論で、要約統計量の代わりにデータのランダムな低次元スケッチを条件とする神経事後推定を提案し、少数のスケッチで事後一致性が得られることを示した（抄録）。未査読。", "p3": "シミュレーションしたデータとパラメータの対で学習する神経事後推定（NPE）で、パラメータの条件付き密度を、データのランダムな低次元の射影（スケッチ）を与えたときの密度で近似した（抄録）。", "p5": "p次元のパラメータのモデルでは2p+1個のランダムなスケッチで事後一致性が得られることを示した。最先端の埋め込みネットワークと比べ、最良のものと同等の性能を計算効率を高めて達成した（抄録）。", "fun": "巨大なデータからモデルの数値を推定するとき、データをそのまま使うのは重すぎるので、平均などの要約にまとめるのが普通だ。だが良い要約を考えるのは難しい。この研究は、データをでたらめな方向に少数回だけ投影した値で足りると示した。推定したい数の2倍と1個の投影で十分という簡潔さが面白い。", "unverified": "比較したモデルの例と計算時間の削減の大きさは抄録からは確認できない。"}}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "LLM評価の成功確率の分布に有限標本の信頼領域", "title": "Variance-adaptive confidence regions for fixed-benchmark binomial mixtures, with application to LLM evaluation", "url": "https://arxiv.org/abs/2611.21266", "authors": "Kuancheng Ye", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Ye, K. (2026). Variance-adaptive confidence regions for fixed-benchmark binomial mixtures, with application to LLM evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21266", "why": "問題ごとにn回実行したLLMの成功回数から、成功確率の経験分布の線形汎関数について、全てのn・m・固定された確率で被覆が保証される分散適応型の信頼領域を、線形計画として構成した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMを問題ごとにn回実行した成功回数から、成功確率の経験分布の線形汎関数について、全てのn・m・固定された確率で被覆を保証する分散適応型（VA）の信頼領域を作った（抄録）。未査読。", "p3": "候補の混合分布ごとに、それが含意する裾の回数の条件付き分散で検定する。この分散は分布について線形なので、領域は線形計画として解け、セルの包絡で格子の外でも有効性を保つ（抄録）。", "p5": "主な比較の前に固定した規則のもとで、VAは2段階の差し込み型の帯より全てのnで狭かった（n=128で幅の比の中央値0.60）が、n=128の漸近的な点ごとの区間（AMARI）よりは狭くなく、実際のロールアウトではn≦128で点ごと・Bonferroni補正のAMARIより広かった。P(p>0)や大きなkのpass@kは下限しか得られない（抄録）。", "fun": "AIの性能を「100問中何問解けたか」で比べるとき、その数字にどれだけ誤差があるかは意外に難しい問題だ。問題ごとに難しさが違い、同じ問題でも解けたり解けなかったりするからだ。この研究は、どんな場合でも保証される誤差の幅を作り、他の方法より広くなる場面も正直に報告した。保証の強さと幅の狭さの取引が見える点が面白い。", "unverified": "実際のロールアウトのデータの出所は抄録からは確認できない。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "ℓpノルムの平均推定に鋭い相転移", "title": "Phase Transitions in Heavy-Tailed Mean Estimation under $\\ell_p$ Norms", "url": "https://arxiv.org/abs/2611.20176", "authors": "Ishaq Aden-Ali ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Aden-Ali, I., Cherapanamjeri, Y., Høgsgaard, M. M., Larsen, K. G., & Zhivotovskiy, N. (2026). Phase Transitions in Heavy-Tailed Mean Estimation under $\\ell_p$ Norms (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20176", "why": "共分散の存在だけを仮定した平均ベクトルの推定で、p>2のℓpノルムでは期待リスクにも頑健化が必要になることを示し、ミニマックス・リスクが標本数・次元・pの関係で鋭く相転移すること、座標ごとのmedian-of-meansがこれに最適に追随することを証明した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "共分散の存在だけを仮定した確率ベクトルの平均推定で、p>2のℓpノルムでは期待リスクでも頑健化が必要になり、ミニマックス・リスクが鋭く相転移することを証明した（抄録）。未査読。", "p3": "標本数n・次元d・ノルムのpの関係でミニマックス・リスクを特徴づけ、損失の幾何に合わせてバケット数を選ぶ座標ごとのmedian-of-means推定量の性能を解析した（抄録）。", "p5": "大標本の領域では古典的なガウスの速さが達成でき、それ以外では裾の重い分布が本質的に非ガウスの障害を生む。座標ごとのmedian-of-meansは相転移に最適に追随し、一般のノルム向けの射影型のmedian-of-meansはℓpノルムでは多項式的に最適でない場合があった（抄録）。", "fun": "たまにとんでもない値が出るデータの平均を推定するとき、普通の平均は外れ値に引っ張られる。誤差を普通の距離で測るなら普通の平均で十分だが、最大の誤差を重く見る測り方に変えると、外れ値対策が必須になる。この境目が標本の数と次元で急に切り替わる「相転移」を示した点が面白い。", "unverified": "数値実験の有無は抄録からは確認できない。"}}, {"id": "pn38", "rank": 38, "field": "統計学", "headline": "AdamやMuonの高次元の有効動力学を導出", "title": "High-dimensional limit theorems for adaptive variants of SGD I: Ballistic limits", "url": "https://arxiv.org/abs/2611.19059", "authors": "Aukosh Jagannath ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Jagannath, A., & Sarangian, V. (2026). High-dimensional limit theorems for adaptive variants of SGD I: Ballistic limits (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19059", "why": "指数移動平均と前処理による非マルコフ性を平均化法で扱い、Adam・Muonなど適応的なSGDの高次元での有効動力学をマルコフ過程として導いた。テンソルPCAやXOR問題のネットワークで、アルゴリズムを定量的に比較できることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AdamやMuonなどモーメンタムを持つ適応的なSGDの、高次元での有効動力学をマルコフ過程として導き、アルゴリズムを定量的に比べられるようにした（抄録）。未査読。", "p3": "指数移動平均と前処理による非マルコフ性を平均化法で扱い、テンソルPCA、ガウス射影モデル、教師-生徒ネットワーク、MuonとAdamを併用してXOR問題を学ぶ多層ネットワークに適用した（抄録）。", "p5": "学習の初期はオンラインSGDがAdamより汎化が良く、学習曲線が交差した後はAdamが上回る「交差」現象を見いだした。安定性の縁（Edge of Stability）の一種を証明し、それを鋭く特徴づける無限ラプラシアンの類似物を導入した（抄録）。", "fun": "AIの学習で使う最適化の方法は経験則で選ばれることが多い。この研究は、膨大な数のパラメータの動きを少数の量の動きにまとめる理論で、方法どうしを数式で比べられるようにした。最初は単純な方法が勝ち、途中から高度な方法が追い抜くという逆転を理論で説明した点が面白い。", "unverified": "理論の予測と実際の大規模な学習との一致の程度は抄録からは確認できない。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "科学的証拠を扱う3,200億パラメータのMoE", "title": "Sage S2.1 Flash Technical Report", "url": "https://arxiv.org/abs/2611.21072", "authors": "Kun Cai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Cai, K., Chen, H., Cheng, G., Cheng, Q., Dai, X., Dong, G., Ge, Q., Gu, L., Gui, T., Guo, H., Hu, Y., Huang, Z., Jin, J., Lam, A., Li, J., Li, Y., Lin, J., Liu, Y., Lu, X., … Zhou, B. (2026). Sage S2.1 Flash Technical Report (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21072", "why": "分子グラフ・生物配列・スペクトルの専用エンコーダを持ち、道具の使用・検索・コーディングの検証可能な環境で訓練した3,200億パラメータのMoEモデルの技術報告。7領域33のベンチマークで評価し、主な比較ではOfficeQA ProやMLE-bench Liteなどで1位と報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "分子グラフ・生物配列・スペクトルの専用エンコーダを持ち、科学的証拠を扱い対話的な環境で行動する3,200億パラメータの混合専門家（MoE）モデルの技術報告（抄録）。未査読。題名はS2.1、抄録ではS1.5と表記されている。", "p3": "モダリティ別の射影で表現を共通の骨格の入力空間に写し、文章・画像とともに処理する。道具の使用・検索・コーディングと、機械学習の実験や科学ソフトウェアの作業の検証可能な環境を作り、実行結果や環境の状態で完了を判定して訓練した（抄録）。", "p5": "7領域33のベンチマークで評価し、5つの基準との主な比較でOfficeQA Pro（72.2）、MLE-bench Lite（HumanRank 90.3）などで1位、OSWorld-Verified（85.2）などで2位だった（抄録）。", "fun": "文章だけでなく、分子の形や遺伝子の並び、測定のグラフ（スペクトル）まで読めるAIを作り、表計算の作業や機械学習の実験までこなさせる。結果の正しさを実行結果で機械的に確かめられる練習場を用意した点が要だ。いろいろな種類の「証拠」を一つの頭で扱う方向へAIが進んでいることがよく分かる。", "unverified": "題名と抄録でモデルの版の表記が異なる（S2.1とS1.5）。比較した5つの基準の名前は抄録からは確認できない。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "552Bの視覚言語モデルをロボット制御の基盤に", "title": "ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters", "url": "https://arxiv.org/abs/2611.21607", "authors": "Ruixi Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Yu, R., Liu, D., Chen, X., Qi, Z., Li, Z., Cao, Z., Niu, L., Zhang, Y., Liang, S., Fan, K., Wang, H., & Yi, L. (2026). ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21607", "why": "552BのDeepSeek-V4.1-Flashを行動生成のDiTにつなぎ、2Bから552Bまでの視覚言語モデルを同じ訓練設定で比べた。10回の実演で2Bの50回を上回り、LIBERO-PROでの汎化や実機の充電器差し込みも改善したと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "最先端規模の視覚言語モデルがロボット制御のより強い基盤になるかを調べ、552BのDeepSeek-V4.1-Flashを行動生成のDiTにつないだScaleVLAで、少数の実演・汎化・精密操作の改善を示した（抄録）。未査読。", "p3": "2Bから552Bまでの視覚言語モデルを同じ訓練設定で行動のDiTにつなぎ、標本効率・汎化・精密操作の3つの能力で比べた（抄録）。", "p5": "10回の実演で2Bの50回の訓練を上回り（87.8%対85.6%）、LIBERO-PROの成功率は45.1%（小さい骨格では最大31.3%）、実機の充電器の差し込みは10回中4回から9回に増えた。行動の塊あたりの遅延の中央値は216 msだった（抄録）。", "fun": "ロボットを動かすAIには、軽くて速い小さなモデルが使われてきた。この研究は、巨大な言語と画像のAIをロボットの「頭」にすると、少ないお手本で覚え、初めての状況にも強くなることを示した。充電器を差し込むような細かい作業で特に伸びた点が、知識の量が手先の器用さにつながる例として面白い。", "unverified": "実機の試行回数が10回と少なく、他の作業での再現性は抄録からは確認できない。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "生の市場データから資産配分をフローで直接生成", "title": "AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data", "url": "https://arxiv.org/abs/2611.19937", "authors": "Annan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Wang, A., Xie, Y., Cen, Y., Chen, L. L., Zhu, Q. J., Li, X., Wei, T., & Lin, W. (2026). AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19937", "why": "複数資産の市場の履歴から、資本制約のもとでの同時のポジションをフロー・マッチングで直接生成する枠組みを提案し、戦略の模倣で構造を与えてから最適化する2段階の訓練で、予測と配分の分離による不整合を解消する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "複数資産の生の市場の履歴から、資本制約のもとの同時のポジションの重みをフロー・マッチングで直接生成する端から端までの枠組みAllocFlowを示した（抄録）。未査読。", "p3": "時間的な市場表現を条件とする資産横断のフローTransformerで符号付きの重みを一括で生成し、戦略の模倣で候補の分布を形づくった後、ポートフォリオ単位の報酬と凍結した参照方策による群相対の強化学習で洗練する2段階で訓練した（抄録）。", "p5": "暗号資産の永久先物の1時間足で、強化学習により模倣方策の年率の純収益は27.79%から51.38%に、カルマー比は0.955から4.043に上がり、教師の戦略を全指標で上回った。再学習なしで2026年の未見の6か月でカルマー比4.90だった（抄録）。", "fun": "株や通貨の売買では、値動きを予測する段階と、資金をどう配分するかを決める段階を分けるのが普通だ。この研究は、予測を飛ばして市場の生データから直接「どれをどれだけ持つか」をAIに描かせた。まずお手本の戦略をまねさせ、その後で成績を報酬に磨くという二段構えが、人の学び方にも似ていて面白い。", "unverified": "取引コストの扱いと、暗号資産以外の市場での性能は抄録からは確認できない。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "潜在フィードバックは計算とデータの増幅器", "title": "Latent Feedback Is a Compute and Data Amplifier", "url": "https://arxiv.org/abs/2611.20404", "authors": "Benhao Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Huang, B., Dwivedi, C., Ma, X., Moreno, A., & Liu, H. (2026). Latent Feedback Is a Compute and Data Amplifier (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20404", "why": "各トークンの最上層の状態を次のトークンの入力に戻す潜在フィードバックを、同じ計算量をエポック数に使う通常のTransformerと、モデル規模・データ量・エポックの格子で比べ、固有データが十分ある領域では同じ損失に少ない計算量・データで届くと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "各トークンの最上層の状態を次のトークンの入力に戻す潜在フィードバックが、同じ計算量をエポック数に使う通常のTransformerより、計算量とデータの両方を節約することを示した（抄録）。未査読。", "p3": "モデル規模・固有データ量・エポック数の格子で、各点で両方のモデルを調整して比べ、潜在フィードバックをパラメータの多いTransformerとして表す1つのスケーリング則を当てはめた（抄録）。", "p5": "固有データが十分にある領域では、同じ損失に少ない計算量・少ない固有データで届いた。60M〜271Mのモデルで当てはめた法則は、778Mでの損失を0.3%以内、両モデルの差を0.05%以内で予測した。節約は最大で計算量48%、固有データ47%だった（抄録）。", "fun": "良質な学習データが尽きてくると、同じデータを何周も読ませるしかないが、2周目以降の効果は落ちていく。この研究は、AIが自分の考えた途中の状態を次の一語に回す仕組みを使うと、同じ計算量でもっと賢くなれることを示した。データ不足の時代の計算の使い道として面白い。", "unverified": "より大きなモデルでの検証は778Mまでで、それ以上は外挿である（抄録の範囲）。"}}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "画像から連鎖反応を予測する物理推論はまだ不確か", "title": "DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images", "url": "https://arxiv.org/abs/2611.20385", "authors": "Emilio Ferrara", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Ferrara, E. (2026). DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20385", "why": "坂・振り子・ドミノなどの2次元剛体の場面の静止画から結果を予測させる854問（427の最小対）のベンチマークで、10系統30のモデルを評価し、助けなしでは確実に予測できるモデルはないと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "坂・振り子・シーソー・ドミノなどの2次元の剛体の場面の静止画から連鎖反応の結果を予測させるベンチマークで、助けなしに確実に予測できる視覚言語モデルはないことを示した（抄録）。未査読。", "p3": "物理シミュレータで結果を計算した854問（427の最小対）で、一つの量を1〜3格子だけ変えると一人の生死が分かれるように作り、最後は決定的な計算に至る4段のヒントを付けた。10系統30のモデルを評価した（抄録）。", "p5": "助けなしでは、最先端のモデルでも運命が変わる人の正答は最大72%、対の両方の正答は最大34%だった。決め手の計算と必要な量（静止画では見えない速さを含む）を書き出すと82〜92%に上がり、小さなモデルは偶然に近いままだった（抄録）。", "fun": "ボールを押すと坂を転がり、ドミノが倒れ、最後に誰かに当たるかどうか。AIはこうした場面の説明はすらすらできるのに、結果の予測は苦手だった。決め手になる計算を教えると正解できるのに、自分では計算を始めない。言葉で上手に説明できることと、正しく予測できることは別だと示した点が面白い。", "unverified": "評価した30モデルの一覧と、問題ごとの難しさの分布は抄録からは確認できない。"}}, {"id": "pn44", "rank": 44, "field": "機械学習", "headline": "取引系列の基盤モデルの上乗せは勾配ブースティングに小さい", "title": "How Much Do Foundation Models Add to Gradient Boosting on Financial Event Sequences?", "url": "https://arxiv.org/abs/2611.18914", "authors": "Carlos Eduardo Martins Relvas ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Relvas, C. E. M., & Bernardo, G. di G. (2026). How Much Do Foundation Models Add to Gradient Boosting on Financial Event Sequences? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18914", "why": "取引系列で事前学習した基盤モデルの利得を、時点ごとの集計特徴量とLightGBMを基準に27手法・3つのラベル量・5シードで比べ、凍結した自己教師の埋め込みは基準をほとんど改善しないと報告し、両者を順位で平均するTBSを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "取引の系列で事前学習した基盤モデルが、時点の集計特徴量とLightGBMという基準にどれだけ上乗せするかを測り、両者を順位で平均するTBSが最も安定して基準を上回ることを示した（抄録）。未査読。", "p3": "合成のクレジットカード、公開のMBD-mini、企業間信用とB2Bの解約の非公開データの4つで、27手法を3つのラベル量・5シード・対のブートストラップ区間で比べた。系列モデルは約40万パラメータでデータごとに事前学習した（抄録）。", "p5": "凍結した自己教師の埋め込みは基準をほとんど改善せず、微調整した系列ネットワーク単独は21の組み合わせ中9で基準を上回った。TBSは19（FDR調整後18）で上回り、AUCの中央値の上乗せは+1.8点。ラベルが多く表形式の情報が豊富なほど上乗せは縮んだ（抄録）。", "fun": "お金の出入りの記録を大量に読ませた「基盤モデル」が、昔ながらの決定木の手法より賢いと宣伝されることがある。公平に比べ直すと、基盤モデル単独では半分も勝てず、二つを組み合わせたときに初めて安定して勝った。新しい技術の売り文句を、公開データと丁寧な比較で確かめ直した姿勢が面白い。", "unverified": "TabFormerとAMLのベンチマークの再検討の結論の詳細は、抄録の途中までしか確認できない。"}}, {"id": "pn45", "rank": 45, "field": "機械学習", "headline": "難しい課題では大バッチへの切替を遅らせるのが最適", "title": "Fast Catch-Up, Late Switching: Optimal Batch Size Scheduling via Functional Scaling Laws", "url": "https://arxiv.org/abs/2602.14208", "authors": "Jinbo Wang ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wang, J., Li, B., Zhou, Z., Wang, M., Sun, Y., Zhang, J., Cai, X., & Wu, L. (2026). Fast Catch-Up, Late Switching: Optimal Batch Size Scheduling via Functional Scaling Laws (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2602.14208", "why": "関数的スケーリング則の枠組みでデータ予算を固定した最適なバッチサイズの計画を特徴づけ、易しい課題では増やし続け、難しい課題では大半を小バッチで進めて終盤に切り替えるのが最適になること、その背後に「急速な追いつき」効果があることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "関数的スケーリング則の枠組みで、データ予算が固定されたときの最適なバッチサイズの計画を特徴づけ、難しい課題では終盤まで小さいバッチを保って遅く切り替えるのが最適になることを示した（抄録）。未査読。", "p3": "関数的スケーリング則（Liら2025a）を使って最適なバッチサイズの計画を解析し、小から大への切替後に損失が一定の大バッチの軌道にすばやく合う「急速な追いつき」効果の仕組みを、蓄積した勾配の雑音の急速な忘却として説明した（抄録）。", "p5": "易しい課題では最適な計画はバッチを増やし続け、難しい課題では大半を小バッチで進めて終盤だけ大バッチにする。最大11億パラメータ・1兆トークンの密モデルとMoEの事前学習で、遅い切替の計画は一定のバッチと早い切替をすべての設定で上回った（抄録）。", "fun": "AIの学習では、一度にまとめて見せるデータの量（バッチサイズ）を途中で増やすことがある。この研究は、難しい問題ほど最後まで小分けで学ばせ、終盤に一気に大きくするのが得だと示した。切り替えた直後に損失がすぐ追いつくので、大きなバッチを後回しにしてもデータを節約できる。勉強の仕方にも似た話で面白い。", "unverified": "課題の「難しさ」をどう測るかの定義は抄録からは確認できない。"}}, {"id": "pn46", "rank": 46, "field": "機械学習", "headline": "推論の過程をグラフにして失敗の構造を見る", "title": "Understanding Failures in LLM Reasoning by Learning Structured Representations of Chain-of-Thought", "url": "https://arxiv.org/abs/2611.18611", "authors": "Tommaso Felice Banfi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Banfi, T. F., Akhtar, M., Ni, J., & Sachan, M. (2026). Understanding Failures in LLM Reasoning by Learning Structured Representations of Chain-of-Thought (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18611", "why": "思考の連鎖（CoT）を推論ステップの依存グラフとして表し、グラフニューラルネットと帰属の説明で正しい推論と失敗の構造的なパターンを特定し、正しいCoTは序盤の計画を重視し、誤りは過負荷の統合ステップと依存関係の違反と関連すると報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの思考の連鎖（CoT）を推論ステップの依存グラフとして表し、グラフの構造から推論の質（正しさ・効率・失敗の型）を読み取る枠組みCoT2Graphを示した（抄録）。未査読。", "p3": "CoTを後戻り・分岐・部分課題の統合などを表す有向の依存グラフに変換し、グラフニューラルネットでモデル化し、帰属に基づく説明で推論の質と関連する構造のパターンを特定した（抄録）。", "p5": "正しいCoTは序盤の計画を重視し、誤ったCoTは過負荷の統合ステップと依存関係の違反と関連した。グラフの信号は正答の予測で従来の木構造の方法を最大2.5%、長さに基づく基準を7.8%上回り、Best-of-Nの選択も改善した（抄録）。", "fun": "AIが答えを出すまでの「考えの筋道」を、文章としてではなく、どの考えがどの考えに頼っているかの地図にして調べた。すると、正しく解けるときは最初によく計画を立て、間違えるときは最後にたくさんの考えを一度にまとめようとして破綻していた。人の答案の採点にも通じる発見で面白い。", "unverified": "対象としたLLMと課題の種類は抄録からは確認できない。"}}, {"id": "pn47", "rank": 47, "field": "機械学習", "headline": "土木・防災の判断でVLMを評価するベンチマーク", "title": "CivilBench: Benchmarking Vision-Language Models for Multimodal Information Integration in Civil Engineering", "url": "https://arxiv.org/abs/2611.21105", "authors": "Dan Yuan ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Yuan, D., Wen, Y., He, Z., Zhou, Z., Liu, S., & Zheng, Z. (2026). CivilBench: Benchmarking Vision-Language Models for Multimodal Information Integration in Civil Engineering (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21105", "why": "逐次推論・画像による構造の理解・開かれた理解の3群で、構造損傷の評価・リスク推論・因果分析・補修計画などを含む土木・防災のベンチマークを、専門家の注釈と品質検証を経て構築し、代表的なVLMを評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "土木・構造工学と災害の場面で視覚言語モデル（VLM）の推論能力を評価するベンチマークCivilBenchを作り、代表的なVLMに領域固有の推論で大きな限界があることを示した（抄録）。未査読。", "p3": "逐次推論、画像による構造の理解、開かれた理解の3つの課題群で、数値推論・構造損傷の評価・リスク推論・因果分析・補修計画を扱い、領域データの収集、工学向けの説明文、専門家の注釈、問題設計、品質検証の手順で構築した（抄録）。", "p5": "逐次推論が大きな隘路で、特に少ない構造化された観測から数値の関係を推論する場面で弱かった。数値の事前情報と外部知識で限界は緩和されたが、効果はモデルが証拠を確実に読み使えるかに依存した（抄録）。", "fun": "AIに地震で壊れた建物の写真を見せたり、点検の数字を読ませたりして、技術者のような判断ができるかを試す問題集を作った。AIは写真の説明は得意でも、限られた数字から順を追って関係を推し量る問題でつまずいた。専門の現場でAIを使う前に、何が苦手かを確かめる道具として面白い。", "unverified": "評価したVLMの名前と正答率の数値は抄録からは確認できない。"}}, {"id": "pn48", "rank": 48, "field": "工学", "headline": "スケールド境界有限要素でFFT均質化を安定に", "title": "Scaled boundary finite elements for FFT-based computational micromechanics", "url": "https://arxiv.org/abs/2611.20722", "authors": "Flavia Gehrig ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Gehrig, F., Birk, C., & Schneider, M. (2026). Scaled boundary finite elements for FFT-based computational micromechanics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20722", "why": "ボクセル格子上の3次元線形弾性の均質化を、半径方向に解析解を持つスケールド境界有限要素法で離散化する行列不要のFFTソルバを提案し、空隙のある不均質な微視構造で、低減積分要素の砂時計不安定と完全積分要素の過剛性をともに避ける。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ボクセル格子上の3次元線形弾性の均質化を、スケールド境界有限要素法（SBFEM）で離散化する行列不要のFFTソルバを提案し、空隙のある不均質な微視構造で安定に解けるようにした（抄録）。未査読。", "p3": "半径方向に解析解を持つSBFEMの六面体セルを周期的な格子の全ボクセルに使い、一様なSBFEMの剛性作用素に基づく前処理をフーリエ空間で局所的に適用した。前処理後の条件数は格子の解像度によらず材料のコントラストで抑えられることを示した（抄録）。", "p5": "全体剛性行列を組み立て・保存しない実装ができ、短繊維強化複合材、ポリウレタンフォーム、砂のバインダジェットの微視構造で、既存のボクセル離散化と比べて頑健な収束と競争的な精度を示した（抄録）。", "fun": "スポンジのように穴だらけの材料の硬さを計算するとき、細かい立方体（ボクセル）で表すと、ある方法では計算がぐらつき、別の方法では硬く出すぎる。この研究は、立方体の中を中心から放射状に正確に解く方法を使い、その中間のちょうど良い計算を実現した。格子を細かくしても計算が難しくならない点も面白い。", "unverified": "計算時間の比較の数値は抄録からは確認できない。"}}, {"id": "pn49", "rank": 49, "field": "工学", "headline": "竹の中空テーパー構造で最大曲げ応力が出る位置", "title": "Location of maximum bending stress in tapered hollow plants: A case study on Moso bamboo (Phyllostachys edulis)", "url": "https://doi.org/10.21203/rs.3.rs-11439875/v1", "authors": "Carol Lee Chalermsin ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Chalermsin, C. L., Tsugawa, S., & Sato, M. (2026). Location of maximum bending stress in tapered hollow plants: A case study on Moso bamboo (Phyllostachys edulis). https://doi.org/10.21203/rs.3.rs-11439875/v1", "why": "軸方向に材料が傾斜する中空テーパー梁で、さまざまな荷重分布での最大曲げ応力の位置を非線形の支配方程式から求め、線形と大たわみの解析の一致、テーパー比の影響を調べ、孟宗竹に適用した。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "軸方向に材料が変化する中空のテーパー梁で最大曲げ応力が生じる位置を、荷重分布ごとに大たわみの非線形方程式から求め、孟宗竹に適用した（抄録）。未査読。", "p3": "等分布・逆三角形・三角形・集中の4つの荷重について支配方程式を導いて大たわみ解析で解き、線形解析と比べ、テーパー比の影響を調べた（抄録）。", "p5": "分布荷重では線形解析で最大応力の位置を十分に予測できたが、集中荷重では低い荷重でのみ正確だった。テーパーが強いほど最大応力は先端側に移り、孟宗竹では稈の上部に位置した（抄録）。", "fun": "竹は中が空洞で、根元から先へ細くなる。風で曲げられたとき、どこが一番危ないのか。この研究は、竹のような形と材料の変化を式にして解き、最も大きな応力は根元ではなく上の方に来ることを示した。自然が作った軽くて強い形の秘密を、建築部材の設計に生かせる点が面白い。", "unverified": "実際の竹での曲げ試験による検証の有無は抄録からは確認できない。"}}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "包摂的リーダーは心理的安全性を介しAI利用意図を高める", "title": "The Impact of Inclusive Leadership on AI Use Intent: The Mediating Role of Psychological Safety, Emotional Regulation, and Trust", "url": "https://doi.org/10.2139/ssrn.7692758", "authors": "Haldun Turan ほか", "venue": s Non-Uniform Temperature Distribution Effects on Impedance-Based Structural Health Monitoring", "url": "https://doi.org/10.1109/jsen.2026.3752433", "authors": "Felipe Augusto Barnabé ほか", "venue": "IEEE Sensors Journal", "date": "2026-11-16", "sjr": 0.947, "citescore": 7.8, "citescore_year": "2025", "apa": "Barnabé, F. A., & Baptista, F. G. (2026). Uniform versus Non-Uniform Temperature Distribution Effects on Impedance-Based Structural Health Monitoring. IEEE Sensors Journal, 1. https://doi.org/10.1109/jsen.2026.3752433", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "電気機械インピーダンス（EMI）法の構造ヘルスモニタリングで、一様でない温度分布はインピーダンスの波形の形を不規則に変え、模擬した初期損傷より大きな変化を生みうることを実験で示した（抄録）。", "p3": "アルミ板にほぼ一様な温度分布と不均一な温度分布を与えて圧電素子のインピーダンスを測り、温度による変化を、実効周波数シフト（EFS）と動的時間伸縮（DTW）の補償と相関係数偏差（CCD）の指標で、模擬した初期損傷による変化と比べた（抄録）。", "p5": "ほぼ一様な温度は波形の全体的な変化を、不均一な温度は形の不規則な変化を生んだ。最も厳しい条件では、EFS補償後の不均一な温度によるCCDは模擬損傷の約9.5倍だった。DTWで整列は改善したが、不均一な温度による差は残った（抄録）。", "fun": "構造物に貼ったセンサの電気的な性質の変化から傷を見つける方法では、温度の変化が大きな雑音になる。これまで温度は全体に一様に変わると考えて補正してきたが、日なたと日陰のように場所でむらがあると、補正しても傷より大きな「偽の傷」が現れた。現場の温度のむらの怖さを実験で示した点が面白い。", "unverified": "温度分布の具体的な与え方と、模擬損傷の作り方は抄録からは確認できない。"}}, {"id": "jr19", "rank": 19, "headline": "複数モータの同期制御で車両-タイヤ-路面を同時推定", "title": "Cooperative Estimation of Vehicle-Tire-Road Interaction Parameters Based on Multiple PMSMs Deviation Coupled Synchronous Control", "url": "https://doi.org/10.1109/tvt.2026.3753995", "authors": "Haoran Li ほか", "venue": "IEEE Transactions on Vehicular Technology", "date": "2026-11-16", "sjr": 2.052, "citescore": 13.3, "citescore_year": "2025", "apa": "Li, H., Zhou, H., Wang, G., Wang, H., Zhang, R., & Yu, B. (2026). Cooperative Estimation of Vehicle-Tire-Road Interaction Parameters Based on Multiple PMSMs Deviation Coupled Synchronous Control. IEEE Transactions on Vehicular Technology, 1–16. https://doi.org/10.1109/tvt.2026.3753995", "theme": "VBI・橋梁SHM", "theme_no": 1, "explai
