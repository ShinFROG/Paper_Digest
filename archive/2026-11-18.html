<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

00有効標本あたりの計算は長さ250で43秒（PMMH 760秒）で（図5C）、長い記録での状態の精度を支えたのはマルコフ・マスクだった（図6）。", "p6": "パラメータの事後分布は学習時の窓を超える証拠を集約できず縮まないこと、PMMHより近似の精度が低いこと、高次元の系は未検証であることを著者は認める（§5.3、§7）。解釈：4系はいずれも2次元程度の状態を全て雑音付きで観測する設定で、一部の状態しか観測できない系での性能が残る疑問である。", "fun": "計測のたびに時間のかかる計算をやり直す代わりに、あらかじめ大量の模擬データで「答えの出し方」をAIに覚えさせておく。画像の傷を埋めるAIと同じ仕組みで、揺れの記録から見えない状態や機械の性質をすぐに推定し、欠けたデータも埋められる。短い練習問題だけで長い本番に対応できるのは、各時刻が隣の時刻とだけ直接つながるという性質を使ったからだ。", "unverified": "パラメータの事後分布の幅が広すぎる程度（被覆率）は数値で確認できなかった。部分観測・高次元の系での性能は未検証（著者も今後の課題とする）。"}}, {"id": "pr02", "rank": 2, "headline": "共分散の膨張と投影ドロップアウトでEKIを改良", "title": "Enhancing Exploration in Ensemble Kalman Inversion via Covariance Inflation and Projected Dropout", "url": "https://arxiv.org/abs/2611.19845", "authors": "Baojun Che ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Che, B., Huang, D. Z., Mao, X., & Wang, W. (2026). Enhancing Exploration in Ensemble Kalman Inversion via Covariance Inflation and Projected Dropout (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19845", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・手法・理論の要旨・数値実験・結論の節と図のキャプション）を読んだ。定理の証明は読んでいない", "preprint": true, "p1": "アンサンブル・カルマン逆解析（EKI）に、乗法的な共分散の膨張と、平均の更新に加える「投影ドロップアウト」補正を組み合わせ、アンサンブルの崩壊を防ぎつつ初期アンサンブルの張る部分空間の外も探索できるようにした（§1.1、§3）。未査読。", "p2": "EKIは微分不要で並列化しやすいが、人工的な時間発展が恒等写像なのでばらつきが補充されず、分析ステップで共分散が縮み続ける。そのため線形の場合の平均誤差は反復回数nに対しO(n^-1/2)と遅く、粒子は初期アンサンブルのアフィン包から出られない（§1）。", "p3": "膨張では平均まわりの偏差を√(1/(1−Δτ))倍に広げてから同化し（式6a）、投影ドロップアウトでは偏差の座標の一部をベルヌーイ・マスクで0にした方向を順問題に通し、元のアンサンブルで表せない応答の成分だけで平均を動かす（§3.2、式21）。線形問題では、部分空間内の誤差が条件数によらない率で指数的に減り、補空間の誤差も期待値で指数的に縮むことを証明した（§4）。", "p4": "条件数1〜10⁴で初期部分空間の外の方向が0・2・10個の100次元の線形問題、100次元の単調3次・Rosenbrock・Rastrigin、回転球面上のバロトロピック流の初期渦度を北半球50点の東西風から推定する問題で、膨張のみ（I-EAKI）・既存のドロップアウトEKI（DEKI）・CMA-ESと比べた（§5）。", "p5": "図1は反復（横軸）に対する相対誤差（対数）で、外の方向がないとI-EAKIと提案法は条件数によらず同じ速さで数値精度まで下がり、外の方向があるとI-EAKIは部分空間の下限で止まるが提案法はさらに下がった（§5.1）。非線形問題ではDEKIが共分散の崩壊とともに停滞し、提案法はばらつきを保ってより低い値に達し、RastriginではCMA-ESも上回った（§5.2、図2）。", "p6": "非線形問題での収束の保証はなく、適応的なパラメータ選択や直線探索・信頼領域の受理基準は今後の課題とされる（§6）。投影ドロップアウトは1反復あたりの順問題の評価をI-EAKIの約2倍に増やす（§5.1）。解釈：Rosenbrockでは提案法もCMA-ESも狭い谷で進みが遅く、曲がった谷での優位は限られる。", "fun": "答えを探す「調査隊」を何十人か送り出し、互いの報告を突き合わせて答えに近づくのがアンサンブル・カルマン法だ。ところが隊員は次第に同じ場所に固まり、最初に散らばった範囲の外は決して探せない。この研究は、隊員の散らばりをわざと広げ直し、さらにランダムに一部の情報を隠して新しい方向を試させることで、見落としていた答えにも届くようにした。", "unverified": "バロトロピック流の問題の誤差の具体的な数値は図からしか読めず、確認できなかった。非線形問題での理論的な保証はない。"}}, {"id": "pr03", "rank": 3, "headline": "合成回答者に属性を渡しても集団比較は改善しにくい", "title": "Necessary for What? Auditing Demographic Disclosure to LLM Synthetic Respondents", "url": "https://arxiv.org/abs/2611.20606", "authors": "Aspen Wang ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wang, A., Shan, Y. Y., & Ku, L.-W. (2026). Necessary for What? Auditing Demographic Disclosure to LLM Synthetic Respondents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20606", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・実験設計・結果・考察・限界・結論の節と図表のキャプション）を読んだ。付録は読んでいない", "preprint": true, "p1": "LLMの合成回答者に回答者自身の属性の記録を渡す必要性を、個人の予測・母集団の推定・集団の比較という目的ごとに監査し、記録が要るのは集団比較だけで、それでもモデルの集団差は個人より属性のラベルに依存することを示した（§1、§4–5）。未査読。", "p2": "合成パネルでは属性の記録をプロンプトに入れるほど忠実になるという前提が置かれ、既知の集団差の再現で妥当性が確かめられてきた。だが記録は実在の人の個人データで、4項目の属性と8問の回答を合わせると回答者の90%が一意に特定でき、どの推定に記録が必要かは問われてこなかった（§1、§4.3）。", "p3": "他の8問の回答に加え、本人の記録（15項目）、無作為に入れ替えた他人の記録、国勢調査の個票、合成ペルソナ、項目を減らした記録を渡す条件を比べた（表1）。入れ替えた記録で作った回答をプロンプトに示した属性で集計し直す「再集計テスト」でラベル追従を調べ、同じ情報で人の回答に当てはめた正則化多項ロジットを参照とした（§3.3–3.5）。", "p4": "Pewの米国トレンド・パネル（1,000人・63問）とISSP 2023（1,513人・27問）で、7B〜72Bの11のオープンウェイトのモデルを、ブライア・スコア、総変動距離、人のデータで支持された集団差（Pewで1,281対）の再現・反転の割合で評価した（§3.2、§3.4）。", "p5": "記録で中央値のモデルのブライア・スコアは3%（Pew）と1%（ISSP）しか改善せず、母集団の推定は人の標本と22〜51ポイント離れたまま1ポイント未満しか縮まなかった（§4.1）。集団差の再現はPewで22.6%から41.8%に上がったが、他人の記録では11.6%に下がり、それを示した属性で集計すると36%を再現した（§4.2、図3a）。モデルの集団差は人の約5分の1（比の中央値0.21）で、状況の差の76%に対し態度の差は22%しか再現せず、宗教と民族的出自で平板化と反転が最も強かった（§5、図5–6）。", "p6": "米国の2調査で、既に実施した質問で評価したため新しい質問ではラベル追従がより大きい可能性があり、プロンプトの形式は1つ、状況と態度の区分は文言による探索的なものと著者は認める（§7）。解釈：既知の集団差を再現できるかで合成パネルを検証する方法ではラベル追従を見抜けない、という指摘が重い。", "fun": "AIに「40代・大卒・男性」などと属性を教え、その人のつもりでアンケートに答えさせる方法が広がっている。調べると、AIは本人の考えより「その属性の人ならこう答えるはず」という型で答えていた。他人の属性を渡しても、渡した属性どおりの差を作り出したのだ。しかも宗教や民族のように慎重に扱うべき属性ほど、本当の考えの違いを消してしまっていた。", "unverified": "ホスト型の3モデルの詳しい結果と、識別可能性の計算の詳細（付録）は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "異種LLM討論の利得は能力の移転と受容で決まる", "title": "Borrowed Strength, Imported Risk: Capability Gaps and Reception Govern Heterogeneous LLM Debate", "url": "https://arxiv.org/abs/2611.20649", "authors": "Prashanti Nilayam ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Nilayam, P., Ramanna, K. K., Tumbade, P., Bhat, N. N., & Nayak, S. (2026). Borrowed Strength, Imported Risk: Capability Gaps and Reception Govern Heterogeneous LLM Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20649", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・枠組み・実験設定・結果・考察・結論・限界の節と表2–3）を読んだ。付録は読んでいない", "preprint": true, "p1": "異なるLLMを組み合わせた討論の利得は、集合的な推論による新しい能力の創出より、強い相手（ピア）から弱い受け手への能力の移転が大部分を占め、相手の能力の優位と受け手の受容率の積でほぼ説明できることを示した（§1、§4.3）。未査読。", "p2": "異種のLLM討論は、多様性が補完的な推論を生むと説明されてきたが、単一のエージェントの推論の方が安く済むという評価も増えている。利得がどの条件で生じるかを事前に測る方法はなかった（§1）。", "p3": "3体のパネルで、受け手だけ・相手だけの同種の討論、誠実な異種の討論、相手に誤答を擁護させる敵対的な異種の討論を同じ問題で比べた（§1、§3）。利得をΔA≈κΓ⁺ρと分解した。Γ⁺は同じ課題での相手の正答率の優位（正の部分）、ρは相手が正しいときに誤った受け手が正しくなる確率（受容率）である（式1、§2）。", "p4": "MATH-hard（262問）とGSM8Kの9方向（1B〜120Bのオープンモデルと3つの先端API）を主分析に、受け手をQwen-7Bに固定して相手を替える2方向を係数を固定した検証に、MuSiQueの300問を別課題の検証に使い、同種の討論と対にして正答率の変化を比べた（§3）。", "p5": "9方向の平均で、誠実な異種の討論は第1往復で同種より正答率を6.55ポイント上げ、相手の優位が正の6方向では平均+9.58、負の3方向では+0.49だった（§4.1、表2）。当てはまりは優位だけでR²=.776、優位×受容率で.995で（表3）、固定した係数で、受容率約61%のまま相手の優位を倍にすると利得が7.89から16.92ポイントに増えることを予測した（§4.4）。相手を敵対的にすると同種より3.06ポイント下がった（§4.5）。", "p6": "方向の数が少なく互いに独立でないこと、正の優位での移転は数学以外で未検証なこと、敵対者は1種類の役割の指示だけであることを著者は認める（限界の節）。解釈：討論は最も強いメンバーを直接呼ぶ方法と比べるべきで、5往復の討論は相手1回の呼び出しの40.6〜86.7倍のトークンを使う点も重い（§4.6）。", "fun": "強い人と弱い人が話し合って成績が上がるのは、三人寄れば文殊の知恵で新しい知恵が生まれるからか、それとも弱い人が強い人の答えを写しているだけか。AIどうしの討論で調べると、ほとんどは後者だった。しかも、その強い相手がわざと間違えると全員が引きずられる。頼れる相手ほど、裏切ったときの害も大きいという点が面白い。", "unverified": "付録の方向ごとの詳しい数値と受容率の区間（付録C、G）は読んでいない。"}}, {"id": "pr05", "rank": 5, "headline": "スコアベース拡散で確率的閉包を間接学習", "title": "Score-Based Stochastic Closure Modeling via Offline Indirect Learning and Online Data Assimilation", "url": "https://arxiv.org/abs/2611.19676", "authors": "Xinghao Dong ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Dong, X., Yang, H., & Wu, J.-L. (2026). Score-Based Stochastic Closure Modeling via Offline Indirect Learning and Online Data Assimilation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19676", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・手法の概要・数値設定・閉包の検証・汎化・データ同化・結論の節と表1–7）を読んだ。付録は読んでいない", "preprint": true, "p1": "粗い格子の縮約モデルの確率的な閉包を、閉包そのもののデータを使わず解像された状態の軌跡だけから条件付きスコアベース拡散モデルで学習し、オンラインのデータ同化で更新する枠組みを示した（§1、§2）。未査読。", "p2": "縮約モデルでは同じ解像状態でも未解像の細かい場が違えば閉包が異なり、決定論的な閉包では表せない。確率的な閉包を直接学ぶには参照の閉包場が要るが、計測や詳細な計算では得にくく、疎なデータからの時間微分の推定も不安定だった（§1）。", "p3": "逆拡散のサンプラと粗い格子の物理ソルバを通した微分可能な「軌跡エネルギー・スコア」損失で、生成した軌跡と観測の一致と軌跡間のばらつきを同時に評価し、閉包を間接学習した（Score-I、§2.3）。同化では、学習した事前スコアに尤度の誘導を加えて閉包の事後分布から標本を取り（事後スコアDA）、状態のアンサンブル・カルマン・フィルタ（EnKF）でも補正した（§2.4–2.5）。", "p4": "2次元乱流（512²のDNSを64²に粗視化）で、閉包を直接学習したScore-D、動的スマゴリンスキー（DSM）、純粋にデータ駆動のFNOと状態拡散モデル、ガウス仮定の閉包EnKFと、相対誤差（RE）・スペクトル・誤差とばらつきの比で比べた（§3.1）。", "p5": "10秒後のREはDSMの1.172に対しScore-Dが0.390、Score-Iが0.582だった（表2）。強制と粘性を変えた条件でScore-Iは0.655と0.383で、FNO（1.035、1.264）と状態拡散モデル（0.969、0.971）を下回った（§3.3）。16×16点の観測を0.05秒ごとに同化すると、20秒後のREは事後スコアDAが閉包EnKFより38〜58%小さく、状態EnKFと組み合わせると状態EnKF単独よりさらに22〜41%下がった（§3.4、表6）。", "p6": "Score-Iの閉包は点ごとの誤差がScore-Dより大きく（単一標本の相対誤差0.364対0.068、表1）、高波数の閉包のパワーを過大に予測した（§3.2.1）。解釈：検証は細かい場の真値と比べられる2次元乱流の計算だけで、実測データへの適用は残る課題である。", "fun": "細かい渦まで全部計算すると重すぎるので、粗い格子で計算し、見えない細かい渦の影響（閉包）を補う。ただその影響は同じ粗い状態でも毎回違うので、サイコロのように確率で表したい。困るのは、その影響を直接測ったデータがないことだ。この研究は、粗い流れの動きの記録だけから逆算して、見えない影響の「出方の癖」を学ばせた点が面白い。", "unverified": "汎化の実験の強制の変更の詳しい範囲と、付録の統計的な正当化は読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "神経代理モデルの制御変量で運動論方程式のUQ", "title": "Control variates with neural surrogates for uncertainty quantification in kinetic equations", "url": "https://arxiv.org/abs/2608.01360", "authors": "Wei Chen ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Chen, W., Dimarco, G., & Pareschi, L. (2026). Control variates with neural surrogates for uncertainty quantification in kinetic equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2608.01360", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・推定量の定義・数値試験・考察と結論の節と図1–4のキャプション）を読んだ。定理の証明は読んでいない", "preprint": true, "p1": "ボルツマン方程式などの運動論方程式の不確実性定量化で、多忠実度の制御変量のうち低忠実度モデルを神経代理モデルに置き換えても推定量は不偏のままで、最適分散の変化は神経近似の誤差で抑えられることを示した（§1、§2.2）。未査読。", "p2": "確率的な入力を持つボルツマン・ランダウ方程式は高次元で衝突項の評価が重く、モンテカルロ法の誤差は標本数Mに対しM^-1/2でしか減らない（§2.1）。BGKやFokker–Planckの縮約モデルを制御変量に使う方法はあったが、それを神経代理モデルに置き換えたときの誤差の伝わり方は解析されていなかった（§1）。", "p3": "少数の高忠実度の標本と多数の低忠実度の標本を共分散で結ぶ制御変量推定量で、低忠実度の観測量Q_Lを神経近似Q_Nに替えた場合を摂動として解析した（§2.1–2.2）。神経近似は高忠実度の解を置き換えず相関を使うだけなので偏りは生まず、誤差は分散低減の効率にだけ効く。不均一なFokker–Planck・BGK代理の残差の安定性評価と結び付け、オイラー方程式の観測量を含む漸近保存（AP）の階層に拡張した（§3）。", "p4": "ボルツマン–BGKの2山の試験で、観測量の誤差ε_Qと最適分散の変化ΔVの関係を調べ（高忠実度5標本、低忠実度2,500標本）、ヴラソフ–ポアソン–ランダウを高忠実度、VPFPの神経代理とオイラー–ポアソンを制御とする非線形ランダウ減衰の試験で、階層の係数と推定誤差を調べた（§4）。", "p5": "図1左はε_Q（横軸）に対するΔVでほぼ線形に増え、右のΔV/(ε_Q+ε_Q²)は約520以下で定理6と整合した（§4.1）。神経BGK制御は単純なモンテカルロより誤差を下げ、学習の損失が小さい代理ほど効果が大きかった（図2）。ε=10⁻²では、クヌーセン数のずれた神経制御でもモンテカルロより改善し、オイラー–ポアソンを加えた階層で分散低減がさらに大きくなった（図4）。", "p6": "解析は低忠実度制御の置き換えに関する摂動的なもので、テンソル近似や学習・汎化の誤差を含む完全な誤差理論は今後の課題と著者は述べ、長い時間ではモデル誤差が神経代理の誤差を上回りうると記す（§4.2、§5）。解釈：数値例は図だけで示され、分散低減の倍率の数値は示されていない。", "fun": "気体の分子一つひとつの速さの分布を追う方程式は、条件を変えて何千回も解くには重すぎる。そこで、重い計算は少しだけ行い、軽いAIの近似を大量に回して「ずれ方の癖」を差し引くことで平均の推定の誤差を減らす。AIが多少不正確でも答えが偏らず、精度の悪さは効率の低下にしか響かないことを数学で示した点が面白い。", "unverified": "定理の証明と、神経代理のモデル構造の詳細（先行研究に記載）は読んでいない。分散低減の倍率の数値は確認できなかった。"}}, {"id": "pr07", "rank": 7, "headline": "構造を使うPINNで多エージェント系を同定", "title": "Efficient Modeling of Multi-Agent Systems via Structure-Aware Physics-Informed Learning", "url": "https://arxiv.org/abs/2611.21404", "authors": "Yulun Wu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wu, Y., Bastianello, N., Johansson, K. H., & Barreau, M. (2026). Efficient Modeling of Multi-Agent Systems via Structure-Aware Physics-Informed Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21404", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・手法・数値実験・結論の節と表1–3）を読んだ。付録の設定表は読んでいない", "preprint": true, "p1": "多数の似たエージェントが網の目でつながる結合系について、共有の時間的基底とエージェントごとの係数で軌道を表すPINN「MAS-PINN」を作り、軌道の推定、部分観測からのパラメータ同定、未知の結合の推定を、少ない計算時間とメモリで行えるようにした（§1、§4）。未査読。", "p2": "通常のPINNを大きな結合系に使うと、状態変数が多くメモリが足りず、エージェント間で結合した残差のため学習が重い。段階的な学習や二層最適化などの既存の改良は、軌道を同時に当てはめる必要がある結合系にそのままは使えなかった（§1）。", "p3": "エージェントは共通の名目的な力学を持つので、軌道を共有の時間基底ψ(t)とエージェント固有の係数Wᵢで表し（式8）、基底の勾配更新、係数のレーベンバーグ–マルカート（LM）更新、物理パラメータの最小二乗更新を交互に行う（§4.1）。係数の更新は近傍とだけ結合する構造を使い、全体のヤコビ行列を作らない打ち切り共役勾配で解くため、観測された個体で学んだ基底が観測されない個体の推定にも使われる（§4.1）。", "p4": "環状のローレンツ96（50・100地点）の軌道推定を通常のPINN・PirateNetsと、8地点の3種のロトカ–ヴォルテラ網（半分の地点だけを雑音付きで観測）と8個のレスラー振動子の超グラフ（28の対と56の3体の候補）の同定をHyperPINN・移動ホライズン推定（MHE）と比べ、5回の試行の相対L²誤差とAUCで評価した（§5）。", "p5": "ローレンツ96の軌道誤差は100地点で(2.2±0.9)×10⁻⁴で、比較手法より2桁以上小さかった（表1）。ロトカ–ヴォルテラでは3つの雑音水準すべてで、相互作用行列・分散の重み・全地点の軌道の誤差が最小だった（図2）。行列不要のLM更新は密なLMの77.77秒・3,194 MBに対し1.20〜3.64秒・32 MBで（表2）、レスラーではMHEと同じくAUC 1.00で、重みと軌道の誤差は最小だった（表3）。", "p6": "固定パラメータでオフラインの設定に限られ、時間変化する結合構造やオンラインの逐次推定は今後の課題と著者は述べる（§6）。解釈：同定の実験は8個体と小さく、規模を広げたときの同定の精度（計算量ではなく）はまだ確かめられていない。", "fun": "鳥の群れや送電網のように、たくさんの似た仲間がつながって動く系をAIで丸ごと覚えようとすると、仲間が増えるほど計算が爆発する。この研究は「みんな同じような動き方をする」ことに目を付け、共通の動きの部品を一度だけ学び、個体ごとの違いは少数の係数で表した。見えていない仲間の動きまで推定できるのは、この共通部品を共有しているからだ。", "unverified": "付録の実験設定（表5–8）と、計算量の命題の証明は読んでいない。"}}, {"id": "pr08", "rank": 8, "headline": "LLMの利益予想のばらつきは大半がノイズ", "title": "Artificial Disagreement: How AI Models Interpret Disclosures", "url": "https://doi.org/10.2139/ssrn.7692338", "authors": "Joshua Mitts ほか", "venue": "SSRN", "date": "2026-11-16", "apa": "Mitts, J., Ofir, M., & Shillo, A. (2026). Artificial Disagreement: How AI Models Interpret Disclosures. https://doi.org/10.2139/ssrn.7692338", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず（403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "事前登録の研究で、6つのオープンウェイトLLMに学習期限後のSEC提出書類8,476件から1株当たり利益（EPS）を予想させ、LLMの予想はアナリストよりはるかにばらつくが、その大半はモデル内のサンプリングの雑音で、情報に基づく意見の違いではないことを示した（抄録）。未査読。", "p2": "投資家が同じデータで学んだ少数のLLMに頼ると「アルゴリズムの単一文化」が生まれ、市場の意見の違いが失われるという予測があったが、実証されていなかった（抄録）。", "p3": "提出書類からEPSを予想させ、提出後10取引日以内に予想を出したか確認したアナリストと比べた。各モデルを繰り返し問い合わせて分散をモデル内とモデル間に分け、書類の語をランダムにかき混ぜた対照や、他のモデルが作った要約から予想させる設計で、違いの源を調べた（抄録）。", "p4": "モデル間の予想の標準偏差、同じ書類に対する予想の改定のばらつき、改定が実績値に向かう割合、ばらつきと出来高・リターンの関係を、アナリストと比べた（抄録）。", "p5": "モデル間の標準偏差はアナリストの5.7倍（幾何平均）、改定のばらつきは8.9倍だったが、分散の90%超はモデル内の雑音で、書類をかき混ぜてもばらつきは16%しか変わらず、精度もほぼ同じだった。改定が実績値に向かうのはモデルで36%、アナリストで62%で、要約を使う設計では要約したモデルが分散の約半分、予想したモデルが約8分の1を説明した（抄録）。", "p6": "結論はこの問い合わせの手順のもとでのもので、モデルは共通して楽観的な偏りを持ち、モデルのばらつきは出来高やリターンを確実には予測しなかった（抄録）。解釈：商用の最先端モデルや長い推論で同じ結果になるかは、本文がなく確認できない。", "fun": "AIに企業の決算書を読ませて利益を予想させると、AIどうしで答えが大きく食い違う。一見すると多様な意見だが、同じAIに何度も聞くと毎回答えが変わり、その「気まぐれ」が食い違いのほとんどだった。決算書の単語をでたらめに並べ替えても予想の精度がほとんど変わらないという結果は、AIが本当に書類を読んでいるのかを問いかけていて面白い。", "unverified": "本文を入手できず、使ったモデル名・プロンプト・統計手法の詳細は確認できない。"}}, {"id": "pr09", "rank": 9, "headline": "金融ペルソナの議論は返信で寄るがすぐ戻る", "title": "Persona Persistence, Transient Stance Alignment, and Thread Survival in an Autonomous Agent Forum", "url": "https://doi.org/10.5281/zenodo.22073940", "authors": "LIU, TENGJIAO", "venue": "Zenodo", "date": "2026-11-16", "apa": "LIU, T. E. N. G. J. I. A. O. (2026). Persona Persistence, Transient Stance Alignment, and Thread Survival in an Autonomous Agent Forum. Zenodo. https://doi.org/10.5281/ZENODO.22073940", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（序論・実験設定・結果・考察・限界・結論と表1–7、全7ページ）を読んだ。表5はPDFの抽出で崩れており本文の記述で確認", "preprint": true, "p1": "19の投資家ペルソナを持つLLMエージェントが人の介入なしに10日間議論したフォーラムの3,120投稿を分析し、返信では相手に立場を寄せるが次の独立した投稿では元に戻る「並行する独白」の状態を示した（抄録、§1）。Zenodoに登録された未査読のプレプリント。", "p2": "長い議論でのLLMエージェントの問題は話題の崩壊（意味の漂流）とされてきたが、エージェントが相手の話を聞いて立場を持続的に変えるのか、各自の台本を並行して演じているだけなのかは測られていなかった（§1）。", "p3": "GPT-4oとClaude 3.5 Sonnetに割り当てた19のペルソナを10分ごとに一斉に起動して議論させ（§3、表1）、話者の識別をTF-IDFのロジスティック回帰で、立場を成長–価値など3つの語彙の軸で測った（§5.2–5.3）。返信の立場を自身の平均と親投稿の立場に回帰し、親を同じ相手の別の投稿に替えるプラセボで相手の選び方と会話の場の効果を分け、次の独立投稿まで立場が残るかを相手方向への射影で測った（§5.3）。", "p4": "評価は話者識別のマクロF1、実際とプラセボの係数の差、連続する1,159組での返信と次の投稿の整合度、376の対話スレッドの終了の離散時間ハザードモデル（スレッド単位のクラスタ・ブートストラップ）による（§5.2–5.4）。", "p5": "話者は3つの分割でマクロF1 0.76〜0.78で識別でき、各ペルソナの特徴語（全語の5.05%）を隠しても約0.75を保った（表4）。会話の場の効果は3軸で0.201〜0.232で、相手への整合は返信で0.425、次の独立投稿で0.032（中央値0.000）に落ちた（§5.3）。スレッドの終了ハザードはPoor Charlieの参加で低く（HR 0.66、p=0.018）、RaiderとActivistの応酬1回ごとにも低かった（HR 0.84、p=0.010、表7）。", "p6": "ペルソナなし・単一ペルソナの対照実験がなくパターンをペルソナの多様性に帰属できないこと、一斉起動の仕組み、基盤モデルが2種だけであること、実際の資金がないことを著者は限界とする（限界の節）。解釈：個人の研究者によるZenodoの原稿で、立場の測定は語彙に基づく近似である。", "fun": "19人の有名投資家をまねたAIを掲示板に放ち、10日間自由に議論させた。AIは返事をするときは相手に歩み寄るそぶりを見せるが、次に自分から書くときには元の意見に戻っていた。話し合いは続くのに誰も考えを変えない「すれ違いの独り言」だったのだ。言い争う相手がいるスレッドほど長く続くという結果も、人のネット掲示板に似ていて面白い。", "unverified": "立場の語彙の一覧とハザードモデルの細かな設定は確認していない。表5の係数はPDFの抽出の崩れのため本文の記述で確認した。"}}, {"id": "pr10", "rank": 10, "headline": "フィッシャー情報で量子化器を設計し同定精度を上げる", "title": "Universal Quantizer Design for Identification of Systems with Memory", "url": "https://arxiv.org/abs/2611.20836", "authors": "Yibo Shi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Shi, Y., Wang, Y., Johansson, K. H., & Rojas, C. R. (2026). Universal Quantizer Design for Identification of Systems with Memory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20836", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・問題設定・設計法・数値実験・結論の節と表1–2）を読んだ。命題の証明は読んでいない", "preprint": true, "p1": "量子化された（少数の閾値で区切った）観測からの系同定で、記憶を持つ（雑音が状態の動きに入る）一般の系について、シミュレーションした軌跡だけからフィッシャー情報量を推定し、ビット予算のもとで閾値の位置と数を設計する汎用的な方法を示した（§1）。未査読。", "p2": "量子化器の設計は、フィッシャー情報行列（FIM）が閉じた式で書けるFIR系などでしか解かれていなかった。ARXや過程雑音のある状態空間モデルでは尤度が隠れ状態の周辺化になって式がなく、数値的な方法も状態が低次元か遷移密度が既知の場合に限られた（§1）。", "p3": "パラメータとその近くの点で軌跡をシミュレーションし、量子化した記号列のKLダイバージェンス率を文脈木重み付け（CTW）で数えて推定し、その曲率としてFIMを得る（§3.1）。基準はビットあたりの最小固有値（E最適）で、閾値の関数としては区分的に一定なので直接探索で最大化し、真のパラメータが未知のときは予算の一部で推定してから設計する2段階法を使った（§2.2、§3.2–3.3）。", "p4": "点質量フィルタで参照値を計算できる量子化ARX系（6設定）と、閉じた式のない2段タンク（下段のタンクにレベルスイッチ）で、参照の最適設計に対する損失、中央値に閾値を1つ置く設計との同定誤差（R·λmax(MSE)）、粒子フィルタとの計算時間を比べた（§4）。", "p5": "ARX系では選んだ閾値の数が6設定すべてで最適で、参照の最適に対する損失は0.2〜2.0%だった（表1）。2段タンクでは中央値の閾値が基準の谷にあり、選んだ3閾値の設計は基準が中央値より89%高く、同定誤差を約50%減らした（§4.2、表2）。同じCPU時間で推定法の損失は0.2%、128粒子のフィルタは約5%で、1024粒子なら最良を選ぶが約70倍の時間がかかった（図3b）。", "p6": "設計の一致性は推定の一様収束を条件としており、その証明、収束の速さ、刻み幅と深さの選び方は今後の課題と著者は述べる（§5）。2段タンクのシミュレーション最尤推定の誤差は下界の1.5〜1.7倍で効率的でなかった（§4.2.4）。解釈：入力信号の設計や時間変化する系は扱っていない。", "fun": "安いセンサは、水位が「ここより上か下か」しか教えてくれない。ではどこに線を引けば、少ない情報から一番多くを学べるか。この研究は、計算機の中で何度も模擬実験をして、線の位置ごとの「情報の量」を数え比べた。誰もが使う真ん中の1本の線が実は情報の谷にあることがあり、線を3本にする方が得になる場合もあった点が意外で面白い。", "unverified": "推定法の損失の上界（命題1）の証明と、アルゴリズムの細かな設定は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "梁の厳密解から構成パラメータの同定可能性を診断", "title": "From Exact Analytical Solutions to Parameter Identifiability: Timoshenko Nanobeams in Local/Nonlocal Stress Gradient Elasticity", "url": "https://doi.org/10.2139/ssrn.7683774", "authors": "Akbar Hassanpour ほか", "venue": "SSRN", "date": "2026-11-16", "apa": "Hassanpour, A., Sequeira, A. A., & Mohamadichamgavi, J. (2026). From Exact Analytical Solutions to Parameter Identifiability: Timoshenko Nanobeams in Local/Nonlocal Stress Gradient Elasticity. https://doi.org/10.2139/ssrn.7683774", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず（403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "非局所・勾配を持つ応力勾配弾性（LNStressG）の3つの構成パラメータについて、ティモシェンコ・ナノ梁の厳密解を導き、構造的には同定可能でも、実際の推定の精度は梁の支持条件と測る長さの範囲で大きく変わることを示した（抄録）。未査読。", "p2": "ナノスケールの力学では、非局所長さ・勾配長さ・混合パラメータの異なる組み合わせがほぼ同じ応答を生むため、パラメータの確実な同定が難しいが、一般化連続体モデルの構造的・実際的な同定可能性はほとんど調べられていなかった（抄録）。", "p3": "先端荷重の片持ち梁（滑らかな場）と中央荷重の両端固定梁（せん断力が不連続な場）で、パラメータに依存する閉じた形の解を導き、後者では界面条件と対称性を使って高次の境界-界面系を数値的に解かずにたわみと曲げ剛性の式を得た（抄録）。複数の梁長の曲げ剛性の測定を想定し、感度、フィッシャー情報、相関と共線性、プロファイル尤度、多始点の推定、雑音下のモンテカルロ較正で同定可能性を評価した（抄録）。", "p4": "2つの解は独立に公表された結果と照合して検証し、パラメータの一意性・補償・推定の不確実性の観点で2つの支持条件を比べた（抄録）。", "p5": "パラメータ間の相関は大きいものの、調べた範囲では両方の支持条件で構造的な同定可能性と経験的な大域的一意性が支持された。実際的な同定可能性は大きく異なり、両端固定梁の方が感度が強く、共線性が小さく、プロファイル尤度の区間が狭く、雑音下の不確実性がかなり小さかった（抄録）。", "p6": "結果は調べたパラメータの範囲に限られる（抄録）。解釈：較正の結果の具体値や実測データへの適用は抄録からは分からず、本文で確かめる必要がある。", "fun": "小さな梁の硬さを決める数字が3つあるとき、ある数字を増やし別の数字を減らすと、測る量がほとんど同じになってしまうことがある。この研究は、数式の上では区別できても、雑音のある実験では見分けにくい場合があることを示した。両端を固定して真ん中を押す実験の方が3つの数字をずっと見分けやすいという指摘は、実験の設計の大切さをよく表している。", "unverified": "本文を入手できず、導いた式の形、感度や不確実性の数値、調べたパラメータの範囲は確認できない。"}}, {"id": "pr12", "rank": 12, "headline": "AI導入と従業員の幸福をJD-Rで整理する総説計画", "title": "A Scoping Review Protocol on Artificial Intelligence Adoption and Employee Well-being: A Job Demands–Resources Perspective from Academia and Practice", "url": "https://doi.org/10.17605/osf.io/ez2jw", "authors": "Carel Chan ほか", "venue": "preprint", "date": "2026-12-30", "apa": "Chan, C., Tan, S., Girardi, A., & Gasbarro, D. (2026). A Scoping Review Protocol on Artificial Intelligence Adoption and Employee Well-being: A Job Demands–Resources Perspective from Academia and Practice. OSF Registries. https://doi.org/10.17605/OSF.IO/EZ2JW", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OSFの登録ページは取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "AIの導入が従業員のウェルビーイングに与える影響を、仕事の要求度-資源（JD-R）理論の2つの経路で、学術研究と実務の灰色文献の両面から整理するスコーピングレビューの計画（プロトコル）（抄録）。結果はまだない。未査読。", "p2": "職場へのAI技術の急速な導入で、従業員のウェルビーイングへの影響を理解する必要が高まっているが、JD-Rの要求と資源の2経路で、学術と実務の視点を比べて整理した研究はなかった（抄録）。", "p3": "Arksey & O'Malleyの枠組みとJBI（2024）の指針に従い、PsycINFO・Scopus・Web of Scienceから学術論文を、ILOやコンサルティング会社（Accenture、Deloitte）のサイトから灰色文献を、2001年以降の英語の文献に限って集める（抄録）。", "p4": "表題・抄録と全文の選別、データの抽出について25件で予備試験を行い、各段階を2人の評価者が独立に行い、3人目が不一致を解消する（抄録）。", "p5": "計画の段階で結果は報告されていない。公開済みの文献だけを使うため倫理審査は不要とし、査読誌での公表、専門家団体・産業界への共有、教育課程への反映を予定している（抄録）。", "p6": "解釈：英語の文献に限ることと、灰色文献を特定の機関・企業のサイトに絞ることが、集まる証拠の範囲を狭める可能性がある。結果が出るまで、AIの影響の向きは分からない。", "fun": "AIは仕事を楽にするのか、それとも新しいストレスを生むのか。この研究計画は、仕事の「負担」と「支え」という二つの見方で、大学の研究とコンサルティング会社の報告の両方を集め、食い違いを探そうとしている。研究者と実務家が同じ現象をどう違って見ているかを比べる発想が面白い。", "unverified": "計画のみで結果はない。OSFの登録ページ（本文）は取得できなかった。"}}, {"id": "pr13", "rank": 13, "headline": "生成AI期の生産性向上の取り分が労働から離れる", "title": "Productivity Without Prosperity? Who Captures the Economic Gains from Workplace Artificial Intelligence?", "url": "https://doi.org/10.21203/rs.3.rs-11745769/v1", "authors": "Sarfaraz Abu Abdullah", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Abdullah, S. A. (2026). Productivity Without Prosperity? Who Captures the Economic Gains from Workplace Artificial Intelligence? https://doi.org/10.21203/rs.3.rs-11745769/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（序論・データ・方法・結果I–III・頑健性と限界の節）を読んだ。表と図は本文の記述で確認", "preprint": true, "p1": "米国の非農業部門の生産性上昇（2024年第1四半期〜2026年第3四半期）の配分を会計的に正確に分解し、上昇の約半分しか労働者に回らずその割合が下がっていること、職場AIはこの変化の一部（中央値で約2割）しか説明できないことを、公表データで示した（抄録、§7–8）。未査読。", "p2": "生成AIが特定の作業の生産性を14〜40%上げるという実験はあるが、経済全体に広がったとき誰が利益を得るかは不明で、作業・労働者・経済の各水準の証拠をつなぐ枠組みがなかった（抄録、§1）。", "p3": "労働分配率の恒等式lnπ=ln(w/P)−ln sで、生産性の対数変化を実質の製品賃金の変化と分配率の低下に正確に分けて労働の取り分を求め、公表指数の丸め誤差を10万回のモンテカルロで区間にした（§5.1–5.2）。AIの寄与の割合を3〜20%の範囲に置き、既存研究がデンマークで測ったAIの利益の賃金への転嫁率3〜7%（論文が引用する値）と組み合わせ、AIが説明できる非労働の取り分を上下から挟んだ（§5.4–5.5）。", "p4": "BLSの2026年11月5日の生産性統計、国勢調査局の企業調査（BTOS）のAI利用、既存の現場実験と行政データの結果を使い、取り分、物価への寄与、AIの寄与の上下限を計算した（§4）。", "p5": "期間全体で生産性は対数6.35ポイント上がり、労働の取り分は51.7%（丸め区間50.3〜53.1%）で、労働分配率は1947年以降最低の53.0%に下がった（§7.1）。取り分は2024年84%、2025年70%、直近4四半期で−16%と低下し、非金融法人の単位利益は16.1%増えた（§7.2）。AIが説明できる非労働の取り分の上昇は中央値22.6%（5〜95%点で7.6〜37.7%）で、少なくとも62%は他の要因によると計算した（§8.1）。", "p6": "記述的・集計的な証拠で因果は識別できず、AIの寄与の割合は観測されない境界の仮定で、指数は丸められ改定されると著者は認める（§4.3、§9）。直近の窓は短く暫定的である（§7.2）。解釈：デンマークで測られた転嫁率を米国に当てはめる点にも不確かさが残る。", "fun": "会社の生産性が上がっても、働く人の給料が同じだけ上がるとは限らない。この研究は国の統計の数字を一つの式で分解し、最近の生産性の伸びの半分しか給料に回っておらず、ここ1年は給料の取り分が実質的にマイナスだったことを示した。一方で、その原因をAIのせいにできるのはせいぜい2割程度だという冷静な見積もりも面白い。", "unverified": "表2–7は本文の記述で確認し、表そのものは確認していない。デンマークの転嫁率などの元論文は読んでいない（論文が引用する値として記した）。"}}, {"id": "pr14", "rank": 14, "headline": "無償労働の役割アイデンティティは揺らぎやすい", "title": "The Fluidity of Unpaid Role Identities within a Work-First Welfare Regime", "url": "https://doi.org/10.31235/osf.io/fw2r3", "authors": "B. Goos ほか", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Goos, B., Elshout, J., de Wit, A., & de Boer, A. (2026). The Fluidity of Unpaid Role Identities within a Work-First Welfare Regime. https://doi.org/10.31235/osf.io/fw2r3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（序論・方法・結果・考察と結論・限界の節）を読んだ。付録の質問項目は読んでいない", "preprint": true, "p1": "就労優先の福祉制度のもとで、生活保護の受給者がボランティアや介護などの無償労働から得る役割アイデンティティは、意味・所属・自尊心を与える一方で「本当の仕事」と認められず揺らぎやすく、場面によって主張したり隠したりされる（流動性）ことを示した（抄録、結果の節）。未査読。", "p2": "就労を社会参加とアイデンティティの尺度とする制度では、有償の仕事のない人に緊張が生じる。無償労働が仕事の潜在的な機能（日課、つながり、目的）を代替しうるという議論はあったが、それが受給者にとってどの条件で承認されたアイデンティティになるかは分かっていなかった（序論、考察）。", "p3": "義務と取締りを重視する市から自発性と個別対応を重視する市まで、最大変動の原理で選んだオランダの3自治体で、受給者30人（女性18人・男性12人、27〜65歳、多様な民族的背景）に半構造化面接を行い、ボランティア・家族介護・子育てを分けて主題分析した（方法の節）。", "p4": "自治体の比較は目的とせず、知見が一つの地域の政策体制に依存しないよう場所を選んだ。第1著者が開いたコードを主題にまとめ、共著者全員の合同の会合で原データと照らして修正した（方法の節）。", "p5": "主題は、代替的な役割アイデンティティの機会、その脆さ、流動性、集中的な介護の二重の負担の4つだった（結果の節）。アイデンティティは、労働市場から離れていることを受け入れ、周囲が活動を評価し、活動が目に見える場では頑健で、就労の規範が強い場では不安定だった。ボランティアは有償の仕事に似せられるが、家族介護は私的で職業の目印がなく、ほぼ女性が担い、認められない努力と二重の負担を感じていた（考察）。", "p6": "標本は連絡のつく活動的な受給者に偏りうること、性別や民族による違いを体系的には分析していないこと、就労倫理の弱いオランダ以外への一般化は不確かなことを著者は限界とする（限界の節）。解釈：30人の面接に基づく概念の提案で、頑健さの条件の量的な検証は今後の課題である。", "fun": "仕事をしていないと、毎日ボランティアをしたり家族を介護したりしていても「何もしていない人」と見られがちだ。この研究で話を聞いた人たちは、相手によって「ボランティアをしている」と胸を張ったり、黙っていたりした。特に家で家族を介護する女性は、誰からも見えない努力を重ねていた。「働く」とは何かを問い直させる点が面白い。", "unverified": "付録の質問項目の一覧は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "東京の低普及率のコネクテッドカー軌跡で渋滞密度", "title": "Estimation of jam density and saturation flow at signalized intersections using only low penetration rate connected vehicle GNSS trajectories: Case study using actual data in Tokyo", "url": "https://arxiv.org/abs/2611.20457", "authors": "Toru Seo ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Seo, T., Kusakabe, T., & Oguchi, T. (2026). Estimation of jam density and saturation flow at signalized intersections using only low penetration rate connected vehicle GNSS trajectories: Case study using actual data in Tokyo (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20457", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論・方法・データ・結果・考察・結論の節と図のキャプション）を読んだ。地点ごとの数値の表（表2–3）は確認していない", "preprint": true, "p1": "東京の3交差点の6方向で、普及率1〜3%のコネクテッドカー（CV）のGNSS軌跡を6か月集め、停止位置の分布の山の間隔から渋滞時の車頭間隔（渋滞密度）を、さらに飽和交通流率を推定し、映像による参照と比べて使える条件を示した（抄録、§4）。未査読。", "p2": "CVの軌跡から飽和交通流率を推定する方法の多くは渋滞密度を外から与える必要があり、渋滞密度そのものの推定法はシミュレーションや1日分のNGSIMデータでしか評価されず、普及率も5〜25%が想定されていた。実際の低普及率のデータで推定できるかは分かっていなかった（§1）。", "p3": "待ち行列の車は停止線から一定の車頭間隔で止まるので、多数の周期の停止位置を集めると間隔の整数倍の位置に山が並ぶ（§2.1、図1）。この間隔を、2つのガウス山の当てはめ、空間自己相関、規則ベースの3つの方法で求め、推定した間隔で停止位置を累積台数に換算して回帰し、飽和交通流率を求め、ブートストラップで標準誤差を出した（§2.2–2.4）。", "p4": "ITS Connectを搭載した車の約100ミリ秒間隔の記録（2024年12月〜2025年5月の平日、UTMS協会提供）を恵比寿3・新橋4・新宿7の両方向に使い、映像と航空写真から求めた参照（車頭間隔7.88 m）と比べた（§3.1）。", "p5": "待ち行列がよく形成される地点では3つの方法が約8 mの車頭間隔でおおむね一致し、飽和交通流率は映像の参照のおおむね10%以内だった（抄録、§3.3）。最も一致した新橋4の北向きに対し、待ち行列の短い恵比寿3の南向きは2つ目の山が弱く自己相関法が不安定だった（§3.2、図6–7）。信頼できる山は最初の2〜3個だけで、規則ベース法が最も頑健だった。3つの方法の一致と、標準誤差が車線あたり毎時100台未満であることを信頼性の自己評価の基準として提案した（§3.3）。", "p6": "停止位置が全車線で同じと仮定しており、路上駐車・バス停・バス専用車線による車線間の違いが一部の地点の誤差を大きくした可能性を著者は認める（§3.3）。推定はオフラインで、普及率が低いほど長いデータの蓄積が必要になる（§2.1）。", "fun": "信号待ちの車の列では、車は前の車からほぼ一定の間隔で止まる。だから、たまたま通る通信機能付きの車が止まった位置を半年分集めると、約8 mごとに山がある分布になる。走っている車の100台に1〜3台しかデータがなくても、それを積み重ねれば交差点がさばける車の量まで推定できる。少ないデータを時間で補う発想が面白い。", "unverified": "表2（地点ごとのCVの台数と普及率）と表3（地点ごとの推定値と誤差）の個別の数値は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "多エージェントの引き継ぎ効果は事前登録で再現せず", "title": "What Survives Preregistered Testing in Multi-Agent Handoffs?", "url": "https://doi.org/10.2139/ssrn.7694998", "authors": "Xiaobo Chen ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Chen, X., Zhu, G., Wang, Z., & Wang, C. (2026). What Survives Preregistered Testing in Multi-Agent Handoffs? https://doi.org/10.2139/ssrn.7694998", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "並列の多エージェントLLMのワークフローで、サブエージェント間の引き継ぎ方式の効果は事前登録の再検証で再現せず、単一文脈のエージェントは品質と費用でどの条件にも劣らなかった（抄録）。未査読。", "p3": "複数のモデルとTravelPlanner由来の課題で4,000超のワークフローを、LLMの採点者を使わず有限の仕様で厳密に採点した。サブエージェントが依頼の全文を見るか、引き継ぎが要約か構造化記録か、統合時に依頼を読み直すかを変えた（抄録）。", "p5": "単一文脈のエージェントは全系統で最も安かった。読み直しは元の課題で+5.6点（Holm p=0.028）だが新しい課題では+2.4点（p=0.44）で、事前登録のメタ分析でも引き継ぎ方式の効果は有意でなかった（抄録）。", "fun": "仕事を何人かのAIに分けて渡すとき、渡し方を工夫すれば成績が上がるという話はよく聞く。ところが事前に計画を公開して確かめ直すと、その効果は再現しなかった。見かけの効果の一部は、要約が空のまま測っていたなどの測定の失敗だった。分担させずに1つのAIに全部任せる方が安上がりだったという結果も面白い。", "unverified": "課題ごとの詳しい結果と測定上の失敗の経緯は本文で確認していない。資料は著者への依頼で入手する形。"}}, {"id": "pr17", "rank": 17, "headline": "推論の予算を外から変えてもLLMの行動バイアスは残る", "title": "Does Deliberation Debias? Exogenous Reasoning Effort and Behavioural Finance Bias in Large Language Model Portfolio Advisors", "url": "https://doi.org/10.2139/ssrn.7691604", "authors": "Vinay Batra", "venue": "SSRN", "date": "2026-11-17", "apa": "Batra, V. (2026). Does Deliberation Debias? Exogenous Reasoning Effort and Behavioural Finance Bias in Large Language Model Portfolio Advisors. https://doi.org/10.2139/ssrn.7691604", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの投資助言で、推論の予算をAPIで外から3段階に変えると、9種類の無関係な手がかりによるバイアスの大きさのばらつきは縮むが、平均はほぼ変わらないことを示した（抄録）。未査読。", "p3": "推論の予算をモデルが項目を見る前に設定し、手がかりだけが異なる対の項目で3つのモデルの9,720の回答を集め、第2波で再測定した（抄録）。", "p5": "処分効果は人と逆向きで、利益より損失で売りやすかった（カテゴリ尺度で+0.239）。推論努力は確認的な9事例すべてで絶対効果を下げた（ラベルを入れ替えた帰無で0.0125）。出力トークン数で観察的に測ると、推論が多いほどバイアスが大きく見えた（抄録）。", "fun": "人は値上がりした株を早く売り、値下がりした株を持ち続けがちだ（処分効果）。AIに投資の相談をすると、この癖が逆向きに現れたという。さらに「よく考えさせる」量を外から決めて比べると、癖の平均は減らず、癖の強さのばらつきが縮んだ。考える量をAIの自己申告ではなく外から操作するという実験の作り方が要になっている。", "unverified": "3つのモデルの名前と、バイアスの各系統の詳細は抄録からは確認できない。"}}, {"id": "pr18", "rank": 18, "headline": "介護の質問への答え方が仲間・医師・LLMで異なる", "title": "One Question, Four Voices: How Advice for Alzheimer's Caregiving Differs Between Caregivers, Clinicians, and Large Language Models", "url": "https://arxiv.org/abs/2611.18604", "authors": "Congning Ni ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Ni, C., Park, J. K., Li, Y., Qadir, S., Huang, S. S., Powers, J. S., Hiner, J. A., Leung, V., Commiskey, P., Song, L., Chen, Q., Wisniewski, P. J., Malin, B. A., & Yin, Z. (2026). One Question, Four Voices: How Advice for Alzheimer's Caregiving Differs Between Caregivers, Clinicians, and Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18604", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "認知症の介護者の質問85件への答えを、仲間の介護者・医師・ChatGPT・RAGのCareGPTで比べ、LLMは丁寧で情報は多いが語りや文脈に乏しいことを示した（抄録）。未査読。", "p3": "ALZConnectedの実際の質問に4群が答えた内容を、言語形式・情緒的支援・情報的支援・話題の範囲の28の指標とトピックモデルで比べた（抄録）。", "p5": "LLMは丁寧さと情緒的支援の指標で仲間を上回り、情報量は医師並みだったが、物語性と文脈性が低かった。CareGPTはChatGPTとほとんど区別できず、仲間は感情の整理や法律・お金の問題まで幅広く扱った（抄録）。", "fun": "同じ介護の悩みに、経験者・医師・AIが答えると何が違うのか。AIは礼儀正しく情報も多いが、「うちもそうだった」という経験の語りがない。仲間の答えはお金や法律、気持ちの整理まで広がっていた。掲示板の会話を検索して渡してもAIの口調は変わらなかったという点も、AIの答え方の癖を示していて興味深い。", "unverified": "28の指標の個別の数値と統計的な検定の詳細は抄録からは確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "LLMエージェント市場の能力を2段階で評価", "title": "Macro Control and Capability Evaluation of Black-Box World Models: A Two-Regime Framework for LLM-Agent Markets", "url": "https://arxiv.org/abs/2611.19311", "authors": "Zhiyang Niu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Niu, Z., Li, C., Shen, H., Zhao, M., & Zhang, J. (2026). Macro Control and Capability Evaluation of Black-Box World Models: A Two-Regime Framework for LLM-Agent Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19311", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMエージェントが売買する市場を「世界モデル」とみなし、マクロの入出力だけから能力を情報の模擬とマクロの創発の2段階に分けて評価する枠組みを示した（抄録）。未査読。", "p3": "個々の注文や約定には手を触れず、目標となる価格の参照経路を毎日公表する「緩いマクロ制御」を導入し、参照のみの条件と外部情報を注入する条件で、実現度R・構造的偏りB・真と反転の差Δを測った（抄録）。", "p5": "5つの単一指数の市場で、参照経路の公表は実現の経路を目標側に動かし、追跡の得点は参照なしよりニュースなしで0.306と0.415高かった。構造的偏りは株と現金70/30で最小（B=0.042）、実現はテクニカル3割で最大（R=0.894）だった（抄録）。", "fun": "AIの投資家をたくさん集めて市場を作ると、その市場は本物の経済のまねになるのか。中をのぞかずに外から確かめるため、「明日の目標値」を毎日発表するだけで市場がそちらへ動くかを見る。目標を逆さにした場合と比べることで、AIの市場がもともと持つ偏りも測れる。外側の数字だけで中の仕組みを推し量る工夫が面白い。", "unverified": "使ったLLMと市場の設定の詳細は抄録からは確認できない。"}}, {"id": "pr20", "rank": 20, "headline": "LLMの模擬クライアントと人の発話を同じ文脈で比較", "title": "Language of AI-Simulated and Human Clients in Behavioral Health Counseling: Comparative Pilot Study of Motivational Interviewing (Preprint)", "url": "https://doi.org/10.2196/preprints.117123", "authors": "Xi Chen", "venue": "JMIR Preprints", "date": "2026-11-17", "apa": "Chen, X. (2026). Language of AI-Simulated and Human Clients in Behavioral Health Counseling: Comparative Pilot Study of Motivational Interviewing (Preprint). https://doi.org/10.2196/preprints.117123", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "動機づけ面接の同じ文脈でLLMの模擬クライアントと人の返答を比べ、LLMは変化への同意を言い過ぎるのではなく、現状維持の発言を人より多く出すことを示した（抄録）。未査読。", "p3": "AnnoMIの133の会話から4,669の文脈を取り、Claude Opus 5.5とGPT-6 Astraに単発の返答と8往復の続きを作らせ、分類器と盲検の評価者が変化・維持・中立の発話を判定し、発話の種類の遷移確率を比べた（抄録）。", "p5": "単発では変化から維持への逆戻りがLLMで多かった（OR 10.0）が、返答を人並みに短くさせると差の信頼区間は0を含んだ。8往復の全条件でLLMは維持の発話が多かった（差0.16〜0.31）（抄録）。", "fun": "AIに患者役をさせてカウンセリングの練習台にするとき、「AIは素直すぎてすぐ説得される」と心配されてきた。調べてみると逆で、AIの患者役は「今のままでいい」という発言を人より多くした。しかもその差は返答の長さや相手のカウンセラー次第で変わった。練習台の性格が設定の細部で変わることを数字で示した点が面白い。", "unverified": "分類器の判定の誤りが結果に与える影響の大きさは抄録からは確認できない。臨床的な効果ではなく会話の振る舞いの比較である。"}}, {"id": "pr21", "rank": 21, "headline": "米保険会社の10-KでAIの言及が急増", "title": "Artificial Intelligence Disclosure in US Insurers' Annual Reports, 2019–2025: Descriptive Evidence from Form 10-K Filings", "url": "https://doi.org/10.2139/ssrn.7692738", "authors": "Yeshwanth Vepachadu", "venue": "SSRN", "date": "2026-11-16", "apa": "Vepachadu, Y. (2026). Artificial Intelligence Disclosure in US Insurers’ Annual Reports, 2019–2025: Descriptive Evidence from Form 10-K Filings. https://doi.org/10.2139/ssrn.7692738", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "米国の上場保険会社の年次報告書（10-K）でのAIの言及を2019〜2025年度の企業・年パネルで測り、言及の急増と、統治・規制の語の共起の増加を示した記述研究（抄録）。未査読。", "p3": "EDGARから187社の1,009件の10-Kを集め、透明なキーワード辞書でAIの言及を数え、年固定効果と企業クラスタ誤差の線形確率モデルで企業の特性との関係を見た（抄録）。", "p5": "AIか機械学習に触れる報告書は2019年度の9.8%から2025年度の92.9%に増え、生成AIは2025年度に43.6%。大きな保険会社ほど生成AIに触れやすかった（総資産の対数1単位で3.9ポイント）。ROAとの関連は有意でなかった（抄録）。", "fun": "会社の年次報告書に「AI」という言葉が出てくるかを数えるだけで、時代の変化が見える。保険会社では6年で1割から9割超に増えた。ただし著者は、言葉が増えたのが規制のせいか世の中の流行のせいかは区別できず、中身のある記述か決まり文句かも調べていないと明記している。数えることの強さと限界の両方がよく分かる。", "unverified": "辞書の語の一覧と、決まり文句かどうかの判定は抄録からは確認できない（著者も未検証と記す）。"}}, {"id": "pr22", "rank": 22, "headline": "月次決算を2日に短縮した製造工場の事例", "title": "The Two-day Close: Shop-floor Discipline and AI Estimation in Two Iranian Manufacturing Plants", "url": "https://doi.org/10.2139/ssrn.7691201", "authors": "Aliasghar Hakimian", "venue": "SSRN", "date": "2026-11-17", "apa": "Hakimian, A. (2026). The Two-day Close: Shop-floor Discipline and AI Estimation in Two Iranian Manufacturing Plants. https://doi.org/10.2139/ssrn.7691201", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "イランの製造2工場で、月次の財務諸表を月末の約15日後ではなく2日後に出せるようにした実務の事例を報告した（抄録）。未査読。", "p3": "現場の記録の再設計、逆勘定科目表や自律的な補助元帳などの勘定構造、検証ゲート付きの13段階の自動の締め、遅れて届くエネルギー・水・残業などの原価のAI推定を組み合わせ、前後の比較とAPQCの基準値で評価した（抄録）。", "p5": "2工場とも7か月連続で月末2日後に財務諸表を出し、APQCの上位4分の1の4.8日より58%短い。自動の締めは約5分で、残りの時間は例外の処理に使われる。AI推定の精度はまだ測っていない（抄録）。", "fun": "会社の1か月の成績表を作るのに、ふつうは2週間ほどかかる。材料費や電気代の請求書が遅れて届くからだ。この工場では、遅れる分をAIで見積もって先に締め、届いたら翌月に直すことで2日にした。待つ代わりに推定して後で補正するという発想は、天気予報や測量の考え方にも通じる。", "unverified": "AIによる原価の推定の精度は未測定（著者が明記）。著者は両工場とソフトウェア会社の利害関係者で、2工場の前後比較のため一般化には限界がある。"}}, {"id": "pr23", "rank": 23, "headline": "自然言語からDEMを実行・後処理するLLMエージェント", "title": "GranularGPT: Natural-Language-Driven End-to-End Discrete Element Method Simulations", "url": "https://arxiv.org/abs/2611.20551", "authors": "Erlei Li ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Li, E., Tang, S., Wang, A., Hu, M., Dai, Y., & Wang, G. (2026). GranularGPT: Natural-Language-Driven End-to-End Discrete Element Method Simulations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20551", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "自然言語の指示から個別要素法（DEM）の計算の作成・実行・監視・後処理までを、LLMエージェントで自動化する枠組みを示した（抄録）。未査読。", "p3": "利用者の言葉から計算条件を作り、計算を実行・監視し、粒度分布・充填密度・速度分布・排出率・混合指数・接触力・熱量などを自動で抽出・報告する。12の場面の60件の通常条件と、誤りの処理で評価した（抄録）。", "p5": "60件の計算の成功率は91.7%。修復可能な10件の誤りはすべて検出して9件を解決し、修復できない5件はすべて正しく報告した（抄録）。", "fun": "砂や粉の動きを1粒ずつ計算する方法（個別要素法）は便利だが、設定が難しく専門家しか使えなかった。この研究は「この容器から砂を流して」と言葉で頼むだけで、計算の準備から結果のまとめまでAIが行う仕組みを作った。失敗したときに直せるかどうかまで調べている点が、実用を意識していて面白い。", "unverified": "使ったDEMのソフトウェアとLLM、結果の物理的な正しさの検証方法は抄録からは確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "MDから学ぶ非局所構成則で破壊を大規模に予測", "title": "Mesoscale Neural Operators: Learning Nonlinear Constitutive Laws from Molecular Dynamics for Scalable Fracture Predictions", "url": "https://arxiv.org/abs/2611.19658", "authors": "Yue Yu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Yu, Y., Wang, J., Silling, S., & Yang, Z. (2026). Mesoscale Neural Operators: Learning Nonlinear Constitutive Laws from Molecular Dynamics for Scalable Fracture Predictions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19658", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "分子動力学（MD）の載荷・変位のデータから非局所の構成則を学び、大きな領域の連続体の破壊計算に使える「メソスケール・ニューラル演算子」（MNO）を提案した（抄録）。未査読。", "p3": "非局所モデルの特性長さ（ホライズン）を使ってスケールを移り、ホライズンを変えてもひずみエネルギー密度が変わらない正規化した核と、エネルギー解放率を保つ臨界伸びの再尺度化を組み込んだ（抄録）。", "p5": "粗視化MDのデータで、学習したモデルはMDのひずみエネルギー密度と臨界エネルギー解放率に3%以内で一致し、分布外の引張試験で最大伝達力を6%以内で予測した。訓練片の4,000倍の面積の板で動的な脆性破壊の分岐を再現した（抄録）。", "fun": "原子1個ずつの計算は割れ方を正確に表せるが、大きな板には重すぎて使えない。この研究は原子の計算から「割れの規則」を学び、それを大きな板の計算に持ち込んだ。大きさを変えても割れるのに必要なエネルギーが変わらないよう式の形を工夫している。小さな世界の知識を大きな世界に運ぶ方法として面白い。", "unverified": "対象とした材料と、学習データの規模の詳細は抄録からは確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "物理制約つき代理モデルで地すべりの流下を高速予測", "title": "A physics-constrained emulator for time-discretised landslide runout modelling", "url": "https://arxiv.org/abs/2611.21015", "authors": "Ye Chen ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Chen, Y., Nava, L., de Vries, M. V. W., & Wang, F. (2026). A physics-constrained emulator for time-discretised landslide runout modelling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21015", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "地すべりの流下を、地形（数値標高モデル）上の厚さと速度を一定の時間刻みで次へ進める物理制約つきの神経代理モデルで再現し、数値計算より50倍以上速くした（抄録）。未査読。", "p3": "一定の時間間隔の厚さと速度の対20万超の標本で学習し、質量保存と運動エネルギーの損失に基づく物理的な損失関数で整合性を保たせた。1ステップの予測と、出力を次の入力に戻す自己回帰の連続予測で評価した（抄録）。", "p5": "1ステップの予測誤差（RMSE）は厚さ約0.06 m・速度約0.11 m/sで、110回の連続予測の後も約0.21 m・0.09 m/sにとどまった（抄録）。", "fun": "山崩れがどこまで流れるかを計算するには、時間のかかる物理シミュレーションを何度も回す必要がある。この研究は、短い時間ごとの「次の瞬間」を予測するAIを作り、それをつなげて全体の流れを再現した。AIに質量やエネルギーの法則を守らせることで、何度つないでも大きく崩れないようにした点が工夫だ。", "unverified": "学習に使った地すべりの数と地形、未知の地形での性能は抄録からは確認できない。"}}, {"id": "pr26", "rank": 26, "headline": "光ファイバの分布音響計測で土石流の活動を捉える", "title": "Distributed Acoustic Sensing of debris-flow activity in the Öschibach torrent (Swiss Alps)", "url": "https://doi.org/10.5194/egusphere-gc14-fibreoptic-18", "authors": "Juan Sebastian Osorno Bolivar ほか", "venue": "HAL", "date": "2026-11-16", "apa": "Osorno Bolivar, J. S., Chmiel, M., Walter, F., Blumenschein, F., Friedli, K., & Sladen, A. (2026). Distributed Acoustic Sensing of debris-flow activity in the Öschibach torrent (Swiss Alps). https://doi.org/10.5194/egusphere-gc14-fibreoptic-18", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された学会発表の要旨を使用。本文はない", "preprint": true, "short": true, "p1": "スイスの渓流沿いの約4 kmの既設の光ファイバを分布音響センシング（DAS）に使い、土石流の活動を高い空間分解能で捉え、整合場処理で発生位置を推定する試みを示した学会発表の要旨（抄録）。未査読。", "p3": "2025年夏に岩盤斜面に地震計の高密度アレイを置き、光ファイバを約850チャンネル（間隔約5 m、ゲージ長約10 m、約600 Hz）で計測した。水位の閾値で事象を抽出し、周波数ごとの位相情報を使う整合場処理（MFP）で源の位置を推定した（抄録）。", "p5": "事象中は渓流近くのチャンネルで20〜30 Hzのエネルギーが増え、落石や地震も記録された。合成データの試験で、隣り合う2つの支流の源を区別できることを示した。結果は予備的である（抄録）。", "fun": "通信用に埋めてある光ファイバは、全長にわたる「耳」として使える。ファイバのわずかな伸び縮みから、数メートルごとに振動を聞き分けられるからだ。この研究では、山の斜面から落ちる石と谷を下る土石流の動きを結びつけようとしている。既にある設備を防災の見張りに変える発想が面白い。", "unverified": "学会の要旨で、土石流の速度の追跡などの結果は予備的。本文はない。"}}, {"id": "pr27", "rank": 27, "headline": "Sobol指数で改良土のSCCパラメータの同定性を診断", "title": "Global sensitivity and identifiability of Structured Cam Clay parameters for cement-treated clays: a variance-based analysis with a staged calibration protocol", "url": "https://doi.org/10.21203/rs.3.rs-11595166/v1", "authors": "Alhassan Ahmed Igbeneghu ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Igbeneghu, A. A., Kayode-Ojo, N., & Adegbemileke, S. A. (2026). Global sensitivity and identifiability of Structured Cam Clay parameters for cement-treated clays: a variance-based analysis with a staged calibration protocol. https://doi.org/10.21203/rs.3.rs-11595166/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "セメント改良粘土のStructured Cam Clayモデルの7パラメータについて、大域感度と同定可能性を分散に基づいて調べ、段階的な較正の手順を提案した（抄録）。未査読。", "p3": "排水・非排水の三軸圧縮のひずみ制御の積分器を作り（Modified Cam Clayの閉形式解と0.12%以内で一致）、応力経路ごとに18,432回の計算から1次と全次のSobol指数を求め、20万組の棄却サンプリングで同定可能性を調べた（抄録）。", "p5": "非排水の最大強度は粘着力と限界状態応力比でほぼ決まり（全次指数0.73と0.26）、1回の非排水試験では両者がほぼ完全に交換可能だった。膨潤指数は排水・非排水を組み合わせても三軸の曲線から同定できなかった。ナイジェリア南西部の5つの改良土に適用した（抄録）。", "fun": "土の性質を表す式には調整用の数字（パラメータ）がいくつもあるが、実験から全部を決められるとは限らない。この研究は、ある2つの数字が、一方を増やし他方を減らすと同じ結果になる「すり替え」の関係にあり、1回の試験では区別できないことを示した。どの試験でどの数字を決めるかの順番を設計し直した点が面白い。", "unverified": "提案した較正手順の詳細と、5つの土での較正結果の数値は抄録からは確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "圧電センサとFEM・機械学習でき裂の位置を推定", "title": "AI powered Structural Health Monitoring via Piezoelectric Sensors", "url": "https://doi.org/10.21203/rs.3.rs-11734968/v1", "authors": "Akash M A", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "A, A. M. (2026). AI powered Structural Health Monitoring via Piezoelectric Sensors. https://doi.org/10.21203/rs.3.rs-11734968/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "アルミ梁の表面の圧電アクチュエータ・センサの過渡応答を有限要素で多数作り、機械学習でき裂の有無と位置を推定する概念実証を示した（抄録）。未査読。", "p3": "COMSOLで長方形のき裂を20〜180 mmに5 mm刻みで動かし、4点の電位の時系列500超から1点あたり6つの特徴（RMS、尖度、包絡線の到達時刻、卓越周波数など）を取り、SVMで健全・損傷を分類し、Matérn核のガウス過程回帰で位置を推定した（抄録）。", "p5": "位置推定の平均絶対誤差は25.09 mmで、95%予測区間を出した。ただし健全な状態のデータは1つの損傷梁の計算を加工して作っており、著者は検証済みの精度ではなく概念実証と位置づけている（抄録）。", "fun": "金属の梁に小さな「声を出す板」と「聞く板」を貼り、ひびがあると振動の伝わり方が変わることを利用して、ひびの場所を当てる。この研究は実物ではなく計算で多数のひびの例を作り、AIに学ばせた。著者自身が、健全な場合のデータの作り方に限界があると正直に書いている点も、結果を読むうえで大事だ。", "unverified": "健全な状態のデータが独立した計算でないため、分類の精度は検証されていない（著者が明記）。実験での確認もない。"}}, {"id": "pr29", "rank": 29, "headline": "LLMの有限要素コード生成はまだ一貫性に欠ける", "title": "Scientific Coding with Large Language Models: Evidence from Finite Element Analysis", "url": "https://arxiv.org/abs/2611.21176", "authors": "Erfan Hamdi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Hamdi, E., Shor, J., & Lejeune, E. (2026). Scientific Coding with Large Language Models: Evidence from Finite Element Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21176", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "非線形・履歴依存の力学と構造動力学を含む17の有限要素の課題で15のLLMのコード生成を評価し、一度は成功しても毎回成功するとは限らないことを示した（抄録）。未査読。", "p3": "FEM-Benchを拡張し、実行のフィードバックなしの実装とテスト生成の2部門で評価し、6モデルではコードの実行と修正を許すエージェントの枠組みとも比べた。失敗した249のエージェントの軌跡を分析した（抄録）。", "p5": "単発の実装の最高は87.1%。Claude Opus 5とSimpleAgentは3回中1回以上の成功が96.5%だが、3回とも成功は77.1%だった。自己検証の失敗はテストの網羅不足（73.1%）が最も多く、実装役とテスト役を分けた構成で3回とも成功が88.8%に上がった（抄録）。", "fun": "AIにプログラムを書かせると、3回試せばほぼ1回は正解するが、3回とも正解する率はぐっと下がる。しかもAIは自分で書いたテストに合格して安心してしまう。テストとプログラムが同じ間違いを共有していることもあった。書く役と確かめる役を別々のAIにすると良くなったという結果は、人の仕事の分担にも通じる。", "unverified": "17の課題の内訳と、モデルごとの詳細な成績は抄録からは確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "LLMの抽出を決定的な検査で止める振動試験の解析", "title": "Language Models Meet Vibration Testing for LEO Constellation Satellites with Calibrated Response Prediction from Few-show Sweeps", "url": "https://arxiv.org/abs/2611.20579", "authors": "Jun Wu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wu, J., Li, D., Zheng, Z., Yue, H., Yang, F., & Sun, H. (2026). Language Models Meet Vibration Testing for LEO Constellation Satellites with Calibrated Response Prediction from Few-show Sweeps (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20579", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMが試験記録から解析の設定を抽出する際に、単位・物理的整合・原文の引用・モデル間の一致などの決定的な検査を通ったものだけを使う「検証ゲート」を提案し、衛星の振動試験で示した（抄録）。未査読。", "p3": "低軌道の衛星の正弦波振動の受入試験で、DeepSeek V4.1 FlashとQwen-plusが中国語の試験記録から76項目の設定を抽出し、ゲートを通した設定で応答の制限（ノッチング）を計算した。曲線の予測では、LLMの直接予測と小さな物理構造のネットワークを比べた（抄録）。", "p5": "事実単位のF1は0.98〜1.0で、全ゲートを通した20の設定すべてで正解と同一のノッチング結果になり、使われた項目の17の誤りはすべて止められた。LLMの直接の曲線予測は線形外挿並みで、物理構造のネットワークは過剰なノッチ帯域を86〜89%減らした（抄録）。", "fun": "AIが書類を読んで計算の設定を作ると、もっともらしいが間違った数字が紛れ込むことがある。この研究は、単位が合うか、原文に本当に書いてあるか、別のAIと答えが一致するかを機械的に確かめる関所を設けた。さらに、AIに曲線を直接予想させるより小さな物理モデルの方が良いという「負の結果」も報告していて誠実だ。", "unverified": "試験記録の数と、止めた誤りのうち人工的に注入したものの内訳は抄録からは確認できない。"}}, {"id": "pr31", "rank": 31, "headline": "分数階の記憶を持つポート・ハミルトンNNで粘弾性構造", "title": "Port-Hamiltonian Neural Networks with Diffusive Fractional Memory and Tensor-Train Operators: Passivity-Preserving Surrogates for Digital Twins of Viscoelastic Structures", "url": "https://doi.org/10.20944/preprints202611.1680.v1", "authors": "Luis Rojas Valdivia ほか", "venue": "Preprints.org", "date": "2026-11-17", "apa": "Rojas Valdivia, L., & García, J. (2026). Port-Hamiltonian Neural Networks with Diffusive Fractional Memory and Tensor-Train Operators: Passivity-Preserving Surrogates for Digital Twins of Viscoelastic Structures. https://doi.org/10.20944/preprints202611.1680.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "分数階の粘弾性減衰を持つ構造の代理モデルで、カプート微分の記憶を有限のポート・ハミルトン系として表し、エネルギーを生まない（受動性を保つ）神経ネットTT-fpHNNを提案した（抄録）。未査読。", "p3": "カプート微分の拡散表現を正の重みの求積で離散化し、裾の補正、エネルギー収支を厳密に保つ離散勾配の積分、正定値のテンソル・トレイン分解の演算子を組み合わせた（抄録）。", "p5": "24節点の核の誤差は6.4%から0.09%に下がった。450自由度でランク8のモデルは200周期を誤差0.66%・11,106パラメータで再現し、制約なしのモデルは発散した。2,160自由度で1万ステップ受動性を保ち、分数階は雑音1%で±0.05以内で推定できた（抄録）。", "fun": "ゴムのように「過去の変形を覚えている」材料を含む構造をAIでまねると、長く計算するうちにエネルギーが勝手に増えて暴走しがちだ。この研究は、エネルギーの出入りの帳簿が必ず合う形（ポート・ハミルトン系）にAIを閉じ込め、記憶も有限個の部品で表した。物理の約束をAIの形そのものに組み込む発想が面白い。", "unverified": "実構造の計測データでの検証はなく、合成のトラスでの結果である（抄録の範囲）。"}}, {"id": "pr32", "rank": 32, "headline": "AIによる人事に従業員は条件付きで信頼を寄せる", "title": "“The System Says So”: Making Sense of AI-Driven HRM, Conditional Trust and Employee Well-Being in Saudi Arabian Organisations", "url": "https://doi.org/10.21203/rs.3.rs-11330157/v1", "authors": "Faris Alsaedi", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Alsaedi, F. (2026). “The System Says So”: Making Sense of AI-Driven HRM, Conditional Trust and Employee Well-Being in Saudi Arabian Organisations. https://doi.org/10.21203/rs.3.rs-11330157/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "サウジアラビアの組織の従業員が、AIによる人事管理をどう解釈し、それが人事システムへの信頼とウェルビーイングをどう形づくるかを質的に示した（抄録）。未査読。", "p3": "35人への半構造化面接を再帰的主題分析で分析した（抄録）。", "p5": "AIによる人事の受け止め方は、透明性・人の関与・文脈への配慮で決まった。事務作業のAIには条件付きの信頼が寄せられたが、人事評価のような重要な決定には信頼しにくく、尊厳・自律・心の健康への懸念が、AIが文脈を見ず単純化しすぎるという認識と結びついていた（抄録）。", "fun": "「システムがそう言っているから」と人事の判断を告げられたら、納得できるだろうか。従業員は、勤怠の処理のような事務ならAIに任せてもよいが、自分の評価となると話は別だと感じていた。AIへの信頼が「何を任せるか」で変わるという結果は、機械に任せる線引きを考える手がかりになる。", "unverified": "対象の組織・職種の構成と、引用された語りの詳細は抄録からは確認できない。"}}, {"id": "pr33", "rank": 33, "headline": "職場AIによる専門知の取り込みと退職時の帰属", "title": "Expertise capture in workplace AI", "url": "https://arxiv.org/abs/2611.21456", "authors": "Andreas Ekelhart ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Ekelhart, A., Mohsin, A., Sarker, I. H., & Janicke, H. (2026). Expertise capture in workplace AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21456", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "職場のAIアシスタントに蓄積されるプロンプト・事例・記憶・対話履歴に労働者の専門的判断が取り込まれる過程を「専門知の取り込み」と名づけ、帰属・分離・撤回の可能性を整理する枠組みを示した（抄録）。未査読。", "p3": "貢献の形態、技術的な保存場所、変換の種類の3つの軸で整理し、貢献がどこに置かれどう変換されたかで、帰属・分離・撤回の可否がシステムの設計の段階で決まることを論じた（抄録）。", "p5": "労働者が去ると、組織はその判断で形づくられた能力を保持し、労働者は使えなくなる。この非対称は、貢献が派生物・学習済みの部品・後継システムへ移るほど強まる。書き込み時の出所記録、分離可能な貢献の抽出、実行可能な退出の手続きの3つの方策を示した（抄録）。", "fun": "仕事でAIに頼み方の工夫や判断のコツを教え込むと、そのノウハウは会社のAIの中に残る。退職したら自分は使えなくなるのに、会社は使い続けられる。これを「専門知の取り込み」と名づけ、どこまでなら後から取り出せるかを技術の仕組みから考えた。働き方とAIをめぐる新しい権利の問題として面白い。", "unverified": "実証データはなく、概念的な枠組みの提案である（抄録の範囲）。"}}, {"id": "pr34", "rank": 34, "headline": "認知症介護者の報酬感の軌跡と心身の健康", "title": "Caregiving reward trajectories and outcomes among family caregivers of persons living with dementia: A two-year longitudinal study", "url": "https://doi.org/10.21203/rs.3.rs-11228226/v1", "authors": "Ya-Hui Chou ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Chou, Y.-H., Shyu, Y.-I. L., Lin, Y.-K., & Hsu, W. C. (2026). Caregiving reward trajectories and outcomes among family caregivers of persons living with dementia: A two-year longitudinal study. https://doi.org/10.21203/rs.3.rs-11228226/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "台湾の認知症の家族介護者200人を2年追跡し、介護の報酬感（そばにいる・意味・学び）の軌跡が3群に分かれ、報酬感の高い群ほど役割負担と抑うつが少ないことを示した（抄録）。未査読。", "p3": "神経内科の外来から集めた介護者を、開始時・1年後・2年後に報酬感、役割負担、健康関連QOL、抑うつ症状で測り、集団に基づく軌跡モデルと一般化推定方程式で分析した（抄録）。", "p5": "報酬感はおおむね安定していたが、学びの報酬感だけは直線的に増えた（p=.01）。高い軌跡ほど役割負担が低く（β=−0.52〜−0.27）、抑うつ症状が少なく（β=−10.10〜−4.90）、意味の報酬感は身体的健康とも関連した。便宜標本と未調整のモデルである（抄録）。", "fun": "介護は「大変なこと」として語られがちだが、そばにいられる喜び、意味を感じること、新しく学ぶことといった「報酬」もある。2年間追うと、多くの報酬感は変わらないのに、学びの報酬感だけは経験とともに伸びていた。負担を減らすだけでなく、報酬を育てるという支援の考え方につながる点が面白い。", "unverified": "交絡要因を調整していないため（著者が明記）、報酬感が健康を改善するという因果は確認できない。"}}, {"id": "pr35", "rank": 35, "headline": "5,100万件のレシートで食の組み合わせと健康格差", "title": "Food co-purchasing networks encode geographic disparities in cardiometabolic health", "url": "https://arxiv.org/abs/2611.19420", "authors": "Antonio Desiderio ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Desiderio, A., Rodovero, L., & Lehmann, S. (2026). Food co-purchasing networks encode geographic disparities in cardiometabolic health (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19420", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "デンマーク95自治体の5,100万件のレシートから食品の共購買ネットワークを作り、何を買うかより、どう組み合わせて買うかが地域の心代謝系の健康の差を映すことを示した（抄録）。未査読。", "p3": "人気だけでは説明できない共購買を、統計的に検証した二部ネットワークで取り出し、ネットワークの骨格を食のコミュニティに分け、その地域での結束度で心代謝系の処方を予測した（抄録）。", "p5": "自治体は同じ商品を買っていても、組み合わせ方は都市から周縁への連続的な勾配に沿って変わり、コミュニティの結束度は社会人口学的な調整の後に残る分散の4分の1から半分を説明した。超加工食品は地理的な勾配がなく、ネットワークの周縁にあった（抄録）。", "fun": "同じスーパーで同じ商品が売られていても、何と何を一緒にかごに入れるかは地域で違う。この研究は5千万枚のレシートから「一緒に買われる組み合わせ」の網を作り、その形が地域の糖尿病や心臓病の薬の多さを予測することを示した。買い物かごの中の組み合わせが健康の地図になる、という見方が面白い。", "unverified": "処方データの種類と、自治体単位の分析であることによる生態学的な誤りの扱いは抄録からは確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "歩道の通行可否の判断を少数の回答で個人に合わせる", "title": "Passable for Whom? Few-Shot Personal Calibration of Sidewalk Accessibility Perception", "url": "https://arxiv.org/abs/2611.19839", "authors": "Wesley Maia ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Maia, W., Martinez-Sanchez, A., Keskar, M., & Greer, R. (2026). Passable for Whom? Few-Shot Personal Calibration of Sidewalk Accessibility Perception (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19839", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "歩道を通れるかの判断は人によって違うという前提で、初めての人の少数の回答から、その人の未見の歩道の判断を予測する「少数ショットの個人の較正」を提案した（抄録）。未査読。", "p3": "凍結した視覚言語モデルの内部状態と、1.49万件の公開監査で学んだ検出器による障害物の種類・深刻度・文脈を「場面の記述」とし、回答の傾向と属性の重みを「個人の解釈」として回答から当てはめる。135人の利用者が同じ50場面を評価した8,883の判断で、人と場面の両方を検証用に分けて評価した（抄録）。", "p5": "8つの回答でブライアスコアは0.550から0.479に下がり、同じ回答をVLMにプロンプトで渡す方法は0.562だった。等角リスク制御で「通れる・通れない・あなた次第」を誤りの率5%で出すと、言い切れる場面の割合は27%から42%に増えた（抄録）。", "fun": "車いすの人にとって「通れる歩道」は一つに決まらない。同じ補助具を使う人どうしでも、同じ写真の判断が分かれるからだ。この研究は、その人に8枚ほど答えてもらうだけで判断の癖をつかみ、見たことのない歩道を予測した。自信がないときは「あなた次第」と正直に言う仕組みも面白い。", "unverified": "補助具の種類別の結果と、対象の都市は抄録からは確認できない。"}}, {"id": "pr37", "rank": 37, "headline": "ペルソナ付きLLMエージェントの暗黙の偏りの地図", "title": "A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents", "url": "https://arxiv.org/abs/2611.21376", "authors": "Jason Alexander ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Alexander, J., Li, Y., Licamele, M., Deng, W. H., & Das, S. (2026). A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21376", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "人種・性自認・政治志向のペルソナを持たせたLLMエージェントの日常的な判断に現れる暗黙の偏りを506の場面の「地図」にまとめ、どの偏りを優先して見直すべきかを群衆監査で調べた（抄録）。未査読。", "p3": "米国生活時間調査（ATUS）の17の生活領域から判断場面を作り、ペルソナ間で有意な偏りが出た506場面を集め、500人の参加者が8,010回の二者択一で見直すべき場面を選び、その理由を分析した（抄録）。", "p5": "参加者は、関係する人が多い場面（食事など）、重大な場面（健康など）、模擬した集団の全員が同じ判断をした場面を優先し、格差の大きさや生活領域にはあまり左右されなかった。参加者は格差を集団の特性と解釈し、自分の内なる固定観念でもっともらしさを判断しがちだった（抄録）。", "fun": "AIに「ある属性の人」を演じさせると、日々の小さな選択にも偏りが出る。では、どの偏りから直すべきか。人に選んでもらうと、偏りの大きさより「全員が同じ答えをした」かどうかを重視した。ところがその判断自体が、選ぶ人の固定観念に左右されていた。偏りを人が監査することの難しさが見える点が面白い。", "unverified": "使ったLLMの種類と、偏りの有意性の判定方法は抄録からは確認できない。"}}, {"id": "pr38", "rank": 38, "headline": "方程式フリーの多スケール計算の自己随伴境界条件", "title": "Self-adjoint boundary conditions for equation-free multiscale modelling", "url": "https://arxiv.org/abs/2611.18788", "authors": "J. E. Bunder", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Bunder, J. E. (2026). Self-adjoint boundary conditions for equation-free multiscale modelling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18788", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ミクロのモデルを時空間に散らばる小さなパッチで解いてマクロの挙動を求める方程式フリーの多スケール計算で、自己随伴の対称性を保つパッチの結合条件を作った（抄録）。未査読。", "p3": "有界な領域で固定の境界条件を持つ、コンパクトな自己随伴作用素で定まるミクロのモデルを対象に、パッチ間の結合がミクロの方程式の対称性を保つように設計した（抄録）。", "p5": "対称性を保たない結合ではマクロの計算が保存則を満たさず非物理的になりうることを指摘し、新しい設計で方程式フリー法を適用できる系の範囲が大きく広がると述べる（抄録）。", "fun": "細かい世界の計算を全域で行うのは重すぎるので、ところどころの小窓（パッチ）だけを計算し、その間をつないで大きな世界の動きを推定する。ただ、つなぎ方を誤ると、エネルギーが保存されないなど物理的にありえない結果になる。もとの方程式が持つ「対称性」をつなぎ目でも守る工夫が要になっている。", "unverified": "数値例と、保存則の誤差の大きさは抄録からは確認できない。"}}, {"id": "pr39", "rank": 39, "headline": "位相空間の適応格子でプラズマ中の球を解く", "title": "A spherical body in plasma simulated with adaptive mesh and algorithm refinement", "url": "https://arxiv.org/abs/2611.21466", "authors": "Vladimir I. Kolobov ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Kolobov, V. I., & Arslanbekov, R. R. (2026). A spherical body in plasma simulated with adaptive mesh and algorithm refinement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21466", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "弱電離プラズマ中の吸収球という探針理論の古典的な運動論の問題で、位相空間の適応格子とアルゴリズムの細分化（PAMAR）の枠組みを示し、厳密解と照合した（抄録）。未査読。", "p3": "電子とイオンを、それぞれの適応的な（r, v, μ）の八分木、または角度モーメントの縮約位相空間（Fokker–Planck、2流モデル）で解き、半径方向のポアソン場で結合した。衝突なしは特性曲線法、弾性散乱は軌道に沿う積分の厳密解で検証した（抄録）。", "p5": "探針の電流-電圧特性と電位・各粒子種のモーメントの分布は厳密解と一致した。遠方の電位は衝突なしでr⁻²で落ち、イオンの平均自由行程より外でのみr⁻¹になった。弾性散乱では収集電流の平均自由行程への依存を1%で追った（抄録）。", "fun": "プラズマの中に小さな球を入れると、まわりの電子やイオンの速さの分布がどう乱れるか。位置と速度を合わせた「位相空間」を細かく区切って解くと計算が重いので、必要なところだけ細かくする方法を作り、正確な解と照らし合わせた。どこで粒子の詳しい計算から流体の粗い計算に切り替えるかを自動で判断する点が面白い。", "unverified": "計算コストの削減の程度は抄録からは確認できない。"}}, {"id": "pr40", "rank": 40, "headline": "高次の非線形を二次の縮約モデルで表す", "title": "Reduced-Order Quadratic Representation of Higher-Order Nonlinear Dynamical Systems for Phononic Frequency Comb Generation", "url": "https://doi.org/10.21203/rs.3.rs-11747824/v1", "authors": "Madhurendra Mishra ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Mishra, M., & Ganesan, A. (2026). Reduced-Order Quadratic Representation of Higher-Order Nonlinear Dynamical Systems for Phononic Frequency Comb Generation. https://doi.org/10.21203/rs.3.rs-11747824/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2:1の内部共振近くで駆動される2モード系で、6次までの多項式の非線形が二次の縮約モデルで表せることを解析的に示し、フォノン周波数コムの発生への影響を調べた（抄録）。未査読。", "p3": "共振近くの縮約モデルで、奇数次の非線形項は実効のモード振動数を、偶数次の項は二次の結合係数を変えることを導き、MoS2共振子を想定したパラメータの数値計算で精度を確かめた（抄録）。", "p5": "数値計算で周波数コムが生じる力と振動数の領域を特定し、駆動周波数と分数調波のまわりの側帯波を示した。長い方程式と短い方程式は多くの傾向で一致したが、スペクトルの分布と一部の発生境界には差が残った（抄録）。", "fun": "二つの振動が互いに影響しあうと、くし（コム）の歯のように等間隔に並んだ周波数の振動が生まれることがある。この研究は、高次の複雑な非線形があっても「二次の結合」だけの簡単な式にまとめ直せることを示した。奇数次は振動数をずらし、偶数次は結合の強さを変えるという役割分担が分かりやすい。", "unverified": "縮約モデルが使える範囲の定量的な境界は抄録からは確認できない。"}}, {"id": "pr41", "rank": 41, "headline": "XBRLグラフ上のLLMの偽の監査可能性を測る計画", "title": "Right Number, Forged Pedigree: A Preregistered Minimal Study of False Auditability in LLM Answers over XBRL Knowledge Graphs", "url": "https://doi.org/10.5281/zenodo.24311557", "authors": "Chahed, Oussama", "venue": "Zenodo", "date": "2026-11-17", "apa": "Chahed, O. (2026). Right Number, Forged Pedigree: A Preregistered Minimal Study of False Auditability in LLM Answers over XBRL Knowledge Graphs. Zenodo. https://doi.org/10.5281/ZENODO.24311557", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された分析計画の説明（DataCiteから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "XBRLの知識グラフに基づくLLMの回答で、数値は正しいが引用が無効な「偽の監査可能性」と、偽造された出典を監査役のLLMが受け入れるかを測る、事前登録した分析計画（抄録）。結果はまだない。未査読。", "p3": "30社年・240項目・6つのオープンウェイトのモデルで、研究Aは正しい数値に無効な引用が付く頻度を、研究Bは出典を偽造した正しい回答を監査役のモデルが受け入れるかを測る。完全なシステムと何も見ないシステムの得点をオフラインの対照で固定した（抄録）。", "p5": "公開されたのは計画、設定、凍結したコーパス（ハッシュ付き）、試行の費用の記録、オフラインの検査の結果で、実際の言語モデルによる結果は含まれない（抄録）。", "fun": "AIが「この数字は財務データのこの箇所から取りました」と出典を示すと、確かめられるように見える。だが出典が実在し、そこから本当に数字を計算し直せなければ意味がない。この研究は、答えは合っているのに出典がでたらめという危うい状態がどれくらいあるかを測る計画を、結果を見る前に固定して公開した。", "unverified": "結果はまだ出ていない（分析計画の公開のみ）。"}}, {"id": "pr42", "rank": 42, "headline": "財務エージェントの数値の主張を5種の誤りで検証", "title": "FinVerify: A Verification Framework for Financial Agents", "url": "https://arxiv.org/abs/2611.20423", "authors": "Mao Guan ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Guan, M., Chen, Q., Meng, G., & Liu, X.-Y. (2026). FinVerify: A Verification Framework for Financial Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20423", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "財務エージェントの数値の主張を、期間の整合・出典の忠実さ・比較可能性・会計の整合・財務モデルの忠実さの5種の誤りに基づいて検証し、合格・却下・保留を返す枠組みFinVerifyを示した（抄録）。未査読。", "p3": "Agent Finance Reasoningの190の誤った軌跡から誤りを5分類し、LLMが主張と証拠を構造化し、決定的な検証器が財務の要件を調べ、正式な式があるときはZ3で入力との整合を確かめる。5つのベンチマークでLLMの採点者などと比べた（抄録）。", "p5": "Agent Finance Reasoningで、受理した主張の適合率はLLM採点者の56.4%から76.7%に上がった（被覆率81.2%）。XBRLFilingでは適合率99.8%・判定精度97.0%、FinanceBench-67では87.9%（採点者69.7%）。FinQAとTAT-QAでは改善が小さかった（抄録）。", "fun": "AIに財務の質問をすると、計算は合っているのに違う年度の数字を使ったり単位を取り違えたりする。この研究は、そうした間違いを5種類に分け、それぞれを機械的に検査する仕組みを作った。証拠が足りないときは無理に判定せず「保留」する点が、会計の監査の考え方に近くて面白い。", "unverified": "保留の割合が高い場合の実務上の扱いは抄録からは確認できない。"}}, {"id": "pr43", "rank": 43, "headline": "業績の数字に隠れる事業の失敗要因を探る診断法", "title": "Diagnostic Root Audit (DRA): An Analytical Methodology for Business Failure Identification", "url": "https://doi.org/10.2139/ssrn.7694962", "authors": "Ahmad Rahmatkhah", "venue": "SSRN", "date": "2026-11-17", "apa": "Rahmatkhah, A. (2026). Diagnostic Root Audit (DRA): An Analytical Methodology for Business Failure Identification. https://doi.org/10.2139/ssrn.7694962", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "利益や受注が出ているのに回収の遅れや利益率の低下が進むB2B企業で、収益の漏れの運用上の原因をたどる部門横断の診断の手順（DRA）を提案した（抄録）。未査読。", "p3": "財務記録、CRMと見積りの履歴、契約、納品の記録、時間・原価の記録、回収を突き合わせ、過去の取引の再構成から、待ち時間の分析、利益率と値引きの分解、段階ごとの関門の統治、経営への是正計画までの5段階で進める。分析の単位は営業担当者ではなく商取引の約束とその後の結果である（抄録）。", "p5": "漏れの仕組みの特定、段階を抜ける証拠の明確化、価格と契約の統制、計上した収益と回収した現金の区別、販売能力と納品能力の照合を行う。著者は管理の設計の枠組みで、効果は文脈で検証すべきだとしている（抄録）。", "fun": "会社の決算では売上も利益も出ているのに、なぜか手元のお金が足りなくなることがある。売上を計上する時点と、実際にお金が入る時点がずれるからだ。この研究は、見積りから納品、入金までを1件ずつたどり直して、どこで利益が漏れているかを探す手順を示した。数字の合計の陰に隠れた原因を探る発想が面白い。", "unverified": "実際の企業への適用例と効果の検証は示されていない（著者が明記）。"}}, {"id": "pr44", "rank": 44, "headline": "AUCが最良の貸倒予測が損失最小とは限らない", "title": "The Model That Wins on AUC Is Not the Model That Saves the Bank Money: A Cost-Sensitive Re-Evaluation of Credit Default Prediction Classifiers", "url": "https://doi.org/10.5281/zenodo.24304545", "authors": "Prakasa, Nezar Abdilah", "venue": "Zenodo", "date": "2026-11-17", "apa": "Prakasa, N. A. (2026). The Model That Wins on AUC Is Not the Model That Saves the Bank Money: A Cost-Sensitive Re-Evaluation of Credit Default Prediction Classifiers. Zenodo. https://doi.org/10.5281/ZENODO.24304545", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された論文の説明（DataCiteから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "クレジットカードの債務不履行の予測で、AUCで最良のモデルと銀行の期待損失を最小にするモデルは一致せず、判定の閾値を費用に合わせる方が効果が大きいことを示した（抄録）。未査読。", "p3": "台湾の3万口座のUCIのデータで、4つの分類器を対にした反復の層化交差検証（5分割×6回）で比べ、通常の0.5の閾値とAUC等の指標、各口座の与信枠に基づく費用行列で入れ子に最適化した閾値の両方で評価した（抄録）。", "p5": "AUCではLightGBMが有意に最良だったが、期待費用はランダムフォレストが最小（与信総額の1.24%）で、木のアンサンブル3つの間の費用差は有意でなかった。費用に最適化した閾値に変えると、どのモデルでも期待費用が86〜88%減った（抄録）。", "fun": "お金を返さない人を見逃す損と、返せる人を断ってしまう損は、銀行にとって桁違いに違う。それなのに多くの研究は二つの間違いを同じ重さで数えてきた。この研究は、どのAIが一番かという競争より、「どこで線を引くか」を損の大きさに合わせる方がずっと効くことを示した。評価の物差しが答えを変える好例だ。", "unverified": "費用行列の仮定（損失率など）の詳細は抄録からは確認できない。"}}, {"id": "pr45", "rank": 45, "headline": "都市の暑熱適応策の費用便益を空間的に評価", "title": "URBADAPT-HEAT v1.0: a scalable geospatial framework for city-level public-private adaptation infrastructure cost-benefit analysis and its urban heat risk implementation", "url": "https://doi.org/10.5194/egusphere-2026-5357", "authors": "Armande Aboudrar-Méda ほか", "venue": "EGUsphere", "date": "2026-11-16", "apa": "Aboudrar-Méda, A., & Falchetta, G. (2026). URBADAPT-HEAT v1.0: a scalable geospatial framework for city-level public-private adaptation infrastructure cost-benefit analysis and its urban heat risk implementation. https://doi.org/10.5194/egusphere-2026-5357", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "EGUsphereの討論用原稿の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "都市内の空間解像度で暑熱による死亡のリスクを評価し、公共・民間の適応策の効果・費用・相互作用・公平性を費用便益で比べる地理空間の枠組みURBADAPT-HEAT v1.0を示した（抄録）。未査読。", "p3": "危険・暴露・脆弱性・影響の4要素を、高解像度の気温場、2050年までの気候と人口の予測、社会的脆弱性の指標、年齢別の暑熱死亡の影響関数で結び、冷房・街路樹・早期警報の3つの政策を、冷房による熱の島の強化などのフィードバックを含めて評価する。25年の割引費用と便益、予算制約下の組み合わせの最適化、PAWNの大域感度分析を備える（抄録）。", "p5": "ローマ・アテネ・リスボン・コペンハーゲンの4都市で実装して枠組みの振る舞いを示し、欧州40都市にも実装したが、その比較は別の研究に回すとしている（抄録）。", "fun": "暑さ対策にエアコンを増やすと、室外機の熱で街はさらに暑くなる。街路樹を植えれば冷房の需要が減る。この研究は、こうした対策どうしの影響まで含めて、どこに何を配ればお金に見合って命を守れるかを地図の上で計算する仕組みを作った。誰が得をし誰が取り残されるかまで示す点が政策の道具として面白い。", "unverified": "4都市での具体的な費用便益の数値は抄録からは確認できない。"}}, {"id": "pr46", "rank": 46, "headline": "開発者の性格がAIコーディング支援の使い方を左右", "title": "How Developer Personality Shapes the Use of AI Coding Assistants", "url": "https://arxiv.org/abs/2611.21240", "authors": "Annemarie Wittig ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wittig, A., Mailach, A., & Siegmund, N. (2026). How Developer Personality Shapes the Use of AI Coding Assistants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21240", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "利用者の性格とLLMツールの受け止め方の関係を12研究のスコーピングレビューで整理し、開発者の小規模な2波の調査で、性格がAIコーディング支援の経験と関連する最初の兆候を示した（抄録）。未査読。", "p3": "一般の検索、ソフトウェア工学の主要な場、AIツール、雪だるま式の探索で12研究を特定した。続いて開発者に2波の探索的な調査（29人と11人）を行い、ビッグファイブで測った性格とAIコーディング支援の受け止め方の関係を見た（抄録）。", "p5": "12研究はいずれも性格と受け止め方（特に有用性）の関連を報告したが、ソフトウェア工学の文脈のものはなかった。調査では外向性が高いほど私的な利用の経験が良く、協調性は第1波で職業上の経験の悪さと、第2波で良さと関連した（抄録）。", "fun": "同じAIのプログラミング助手でも、使う人の性格によって「役に立つ」と感じる度合いが違うかもしれない。この研究は先行研究を集め、さらに少人数の開発者に尋ねて、外向的な人ほど個人で使う体験を好意的に感じる傾向を見つけた。人に合わせてAIの振る舞いを変える理由づけを探る、最初の一歩として面白い。", "unverified": "調査は29人と11人と小規模で、結果は予備的（著者が明記）。"}}, {"id": "pr47", "rank": 47, "headline": "家族介護者の回想法を模擬AIエージェントで支援", "title": "MemoryLane: Supporting Reminiscence Conversations Between Older Adults with Mild Dementia and Lay Caregivers Using a Simulated AI Agent", "url": "https://arxiv.org/abs/2611.19013", "authors": "Soumay Agarwal ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Agarwal, S., Gajula, A., Li, L., Ma, R., Martin, J., Madan, K., Brown, E., & Chen, C. (2026). MemoryLane: Supporting Reminiscence Conversations Between Older Adults with Mild Dementia and Lay Caregivers Using a Simulated AI Agent (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19013", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "軽度の認知症の高齢者と家族などの介護者の回想の会話を、写真をそろえなくても支えられるAIツールMemoryLaneを作り、関係者のフォーカスグループで評価した（抄録）。未査読。", "p3": "患者・介護者・患者の仲間役の模擬AIエージェントの三者で会話し、共有画面にエージェントと話題の思い出のAI生成画像を出す。介護者は手元のスマートフォンでエージェントの振る舞いを操作し、生成画像を調整できる（抄録）。", "p5": "認知症ケアの関係者5人の予備的なフォーカスグループで、仲間役のAIエージェントとAI生成画像の価値、介護者が画像とエージェントを調整することの実現可能性が示唆された（抄録）。", "fun": "昔の思い出を語ることは、認知症の人の心を落ち着かせる助けになる。ただ、昔の写真をそろえるのは大変で、思い出を共有していない家族は話を広げにくい。この研究では、AIが同世代の友人役として会話に加わり、話題の情景を絵にして見せる。主役はあくまで家族で、AIの動きは家族が手元で操る点が面白い。", "unverified": "評価は5人のフォーカスグループのみで、患者を交えた試用の結果は抄録からは確認できない。"}}, {"id": "pr48", "rank": 48, "headline": "テンニースの本質意志と選択意志を二重過程論に結ぶ", "title": "Ferdinand Tönnies and the Sociological Roots of Dual-Process Theories of Thinking: Cognition, Social Relations, and Modernity", "url": "https://doi.org/10.31235/osf.io/32pqx", "authors": "Jean-Sébastien Vayre", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Vayre, J.-S. (2026). Ferdinand Tönnies and the Sociological Roots of Dual-Process Theories of Thinking: Cognition, Social Relations, and Modernity. https://doi.org/10.31235/osf.io/32pqx", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "テンニースの本質意志と選択意志の区別を、現代の思考の二重過程論と対応づけ、心理と社会の形を合わせて説明する視点が現代の研究を豊かにすると論じた理論研究（抄録）。未査読。", "p3": "テンニースが二つの意志を共同社会（ゲマインシャフト）と利益社会（ゲゼルシャフト）の関係に結びつけた理論を再読し、性差の自然化、内省と近代の結びつけ、計算と市場関係の結びつけという3つの限界を検討した（抄録）。", "p5": "近代を、直観的・内省的な活動が育ち使われる社会的条件の変化と捉え直し、認知活動の育成・動員・社会的配分・社会技術的な委任の4つの次元からなる枠組みを提案した（抄録）。", "fun": "人には、さっと直感で決める考え方と、じっくり計算して決める考え方があるという「二重過程論」は、今の心理学や経済学でよく使われる。実は100年以上前に社会学者テンニースが、似た区別を村の共同体と都会の利益社会に結びつけていた。古典を読み直すと、現代の理論の盲点が見えるという点が面白い。", "unverified": "理論的な論考で、実証的な検証は含まない（抄録の範囲）。"}}, {"id": "pr49", "rank": 49, "headline": "職場の縄張りの喪失を測る尺度の開発", "title": "Development and Structural Validation of the Perceived Deterritorialization Scale (PDS) in Workplace Settings", "url": "https://doi.org/10.31234/osf.io/s8xjy", "authors": "Jean Frantz Bruny", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Bruny, J. F. (2026). Development and Structural Validation of the Perceived Deterritorialization Scale (PDS) in Workplace Settings. https://doi.org/10.31234/osf.io/s8xjy", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "職場の空間を自分らしくし、状態を予測し、出入りを制御する力が弱まる「縄張りの喪失感」を測るフランス語の尺度（PDS）を開発し、3因子の構造を確かめた（抄録）。未査読。", "p3": "研究1でフランスの事務職340人に26項目を実施し、主因子法とオブリミン回転で3因子（空間的なアイデンティティの喪失、環境の不安定さ、縄張りへの侵入）を得て15項目を残した。研究2の独立した225人で確認的因子分析を行った（抄録）。", "p5": "相関する3因子のモデルが他のモデルより良く適合し（CFI=.982、RMSEA=.034）、内的一貫性はα=.818〜.840だった。個室・オープン・フリーアドレスの間で部分的なスカラー不変性の暫定的な証拠を得た。外部の妥当性と時間的安定性は今後の課題（抄録）。", "fun": "フリーアドレスの職場では、自分の机がなく、毎日どこに座れるか分からない。この研究は、そうした「自分の居場所がなくなる感覚」を、自分らしさの喪失、環境の不安定さ、縄張りへの侵入の3つに分けて測る物差しを作った。動物の縄張りの考えを人の職場に当てはめる発想が面白い。", "unverified": "収束・弁別・基準関連の妥当性と時間的な安定性は未確立（著者が明記）。"}}, {"id": "pr50", "rank": 50, "headline": "環境への取り組みと企業の財務困窮", "title": "Environmental initiatives and corporate financial distress", "url": "https://hal.science/hal-05867585v1", "authors": "Nicolae Stef ほか", "venue": "HAL", "date": "2026-11-16", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "HALの登録は題名のみで、抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名から、企業の環境への取り組みと財務困窮の関係を調べる研究と読める。未査読。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "環境に配慮する取り組みは、会社にとってお金のかかる負担なのか、それとも将来の危機を防ぐ備えなのか。題名からは、環境への取り組みが会社の経営の行き詰まりとどう関係するかを問う研究と読める。良いことをする会社は倒れにくいのか、という素朴で大事な問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "中国の訪日自粛で日本のスポットワーク時給が低下", "title": "Trade Tensions Meet the Gig Economy: Evidence from the 2025 Halving of Chinese Travel to Japan", "url": "https://arxiv.org/abs/2611.21070", "authors": "Suguru Otani ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Otani, S., & Yang, C. (2026). Trade Tensions Meet the Gig Economy: Evidence from the 2025 Halving of Chinese Travel to Japan (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21070", "why": "2025年11月の中国の渡航自粛勧告を外生的なショックとし、日本最大のスポットワーク・プラットフォームの求人で、中国人客への依存が大きい都道府県ほど掲載時給がすぐに持続的に下がった一方、求人数・時間・雇用には頑健な変化がなかったと報告する。サービス輸出への地政学的ショックがギグ経済の労働の価格に及ぶ初めての証拠とする。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "パチンコ店の開店は窃盗を増やさない", "title": "Opening a Gambling Venue Is as Harmless as Opening a Restaurant in Terms of Theft Causal Effects of Electronic Gaming Machine Venue Openings on Theft in Japan", "url": "https://doi.org/10.31235/osf.io/bnyfh", "authors": "Yuhei Yamaguchi", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Yamaguchi, Y. (2026). Opening a Gambling Venue Is as Harmless as Opening a Restaurant in Terms of Theft Causal Effects of Electronic Gaming Machine Venue Openings on Theft in Japan. https://doi.org/10.31235/osf.io/bnyfh", "why": "日本のパチンコ店の開店前後の窃盗件数を、二重/脱バイアス機械学習の差の差法で分析し、窃盗の変化は見られず、効果は飲食店の開店と同等だったと報告する。賭博施設と犯罪の関係が地域や社会の文脈に依存するという議論に、これまで研究の少なかった日本の事例を加える。"}, {"id": "pn03", "rank": 3, "field": "工学", "headline": "熊本・福島県沖地震の被害から部材のベイズ脆弱性曲線", "title": "Bayesian seismic fragility curves for building components based on questionnaire damage data from the 2016 Kumamoto and 2022 Fukushima-ken Oki earthquakes", "url": "https://doi.org/10.21203/rs.3.rs-11550932/v1", "authors": "Takahiro Matsui ほか", "venue": "Research Square (In
