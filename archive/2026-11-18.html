<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

 "venue": "HAL", "date": "2026-11-16", "theme": "会計情報科学", "theme_no": 2}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "中国の訪日自粛で日本のスポットワーク時給が低下", "title": "Trade Tensions Meet the Gig Economy: Evidence from the 2025 Halving of Chinese Travel to Japan", "url": "https://arxiv.org/abs/2611.21070", "authors": "Suguru Otani ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "2025年11月の中国の渡航自粛勧告を外生的なショックとし、日本最大のスポットワーク・プラットフォームの求人で、中国人客への依存が大きい都道府県ほど掲載時給がすぐに持続的に下がった一方、求人数・時間・雇用には頑健な変化がなかったと報告する。サービス輸出への地政学的ショックがギグ経済の労働の価格に及ぶ初めての証拠とする。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "パチンコ店の開店は窃盗を増やさない", "title": "Opening a Gambling Venue Is as Harmless as Opening a Restaurant in Terms of Theft Causal Effects of Electronic Gaming Machine Venue Openings on Theft in Japan", "url": "https://doi.org/10.31235/osf.io/bnyfh", "authors": "Yuhei Yamaguchi", "venue": "SocArXiv", "date": "2026-11-17", "why": "日本のパチンコ店の開店前後の窃盗件数を、二重/脱バイアス機械学習の差の差法で分析し、窃盗の変化は見られず、効果は飲食店の開店と同等だったと報告する。賭博施設と犯罪の関係が地域や社会の文脈に依存するという議論に、これまで研究の少なかった日本の事例を加える。"}, {"id": "pn03", "rank": 3, "field": "工学", "headline": "熊本・福島県沖地震の被害から部材のベイズ脆弱性曲線", "title": "Bayesian seismic fragility curves for building components based on questionnaire damage data from the 2016 Kumamoto and 2022 Fukushima-ken Oki earthquakes", "url": "https://doi.org/10.21203/rs.3.rs-11550932/v1", "authors": "Takahiro Matsui ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "why": "2016年熊本地震と2022年福島県沖地震で被災した24棟の質問紙調査の被害データと多質点せん断モデルの応答から、FEMA P-58の脆弱性曲線を事前情報とするベイズ推定で、日本の建物の13種類の部材について18本の経験的脆弱性曲線を作った。設計基準の異なる日本の建物に米国の曲線をそのまま当てはめる問題に答える。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIにさらされた職で雇用減はなく若年層だけ減少", "title": "AI and the Labor Market: Productivity Driver or Job Killer?", "url": "https://econpapers.repec.org/RePEc:ces:econpr:_61", "authors": "Oliver Falck ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "ドイツの行政データとEU労働力調査で生成AI登場後の職業別の雇用を追い、AIにさらされた職業で広範な雇用減は見られない一方、ドイツでは20〜24歳の雇用が相対的に減り、EU全体でも自動化されやすい職で新卒採用が減る兆しがあると報告する。米国の最近の証拠と一致し、労働市場への入口の監視を勧める。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "パネルの反実仮想の推論を単位間の交換可能性で", "title": "Unit-Level Conformal Inference for Panel Counterfactuals", "url": "https://arxiv.org/abs/2611.19209", "authors": "Ziyi Liu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "処置単位が少ないパネルの反実仮想推定（差の差法、合成統制、行列補完など）について、時間方向ではなく単位間の予測誤差の交換可能性に基づく等角推論を提案し、非定常性などの強い時間的異質性があっても有限標本で時点ごとの信頼集合を与える。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "組織で働くコーディングAIの課題完遂は8%未満", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "url": "https://arxiv.org/abs/2611.20218", "authors": "Xinping Lei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "101のリポジトリで、26人の同僚がいる模擬的な開発組織にエージェントを置き、同僚と記録に分散した要件の回収と矛盾の解消を求めるベンチマークを作った。11のモデルの上位2つでも失敗していたテストの約63%は通すが課題の完遂は8%未満で、部分的な実装と完遂の大きな差を示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "地震は人を性急にし消費を増やす", "title": "Identifying Time Preference Shocks: Stated and Revealed Preferences after an Italian Earthquake", "url": "https://arxiv.org/abs/2611.19662", "authors": "Krisztina Molnar ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "表明された性急さと顕示された選好（消費）を同時に見ることで、時間選好のショックと資金制約を識別する枠組みを作り、2009年ラクイラ地震で被害を受けなかった家計で、性急さの表明が増え非耐久財の消費が11%増えたと報告する。心理的ストレスの経路と整合的で、ストレスに弱い人に集中する。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "重み付き等角p値でBH法のFDR制御は破れる", "title": "Almost Controlled: The FDR of Benjamini-Hochberg on Weighted Conformal p-Values", "url": "https://arxiv.org/abs/2611.21509", "authors": "Ryan Lim (Albert Einstein College of Medicine)", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "共変量シフトに対応する重み付き等角p値をBenjamini–Hochberg法に渡すと有限標本でFDRが制御されるかという問いに、厳密な有理数計算で確かめた2つの反例で否定的に答え、目標値からの超過の上限を校正点の数・検定単位の数・重みの比で与えた。"}, {"id": "pn09", "rank": 9, "field": "心理学・認知科学", "headline": "生成AIに頼った後は自力の推論で努力を調整しにくい", "title": "Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation", "url": "https://doi.org/10.31234/osf.io/83jum", "authors": "Dawid Ratajczyk ほか", "venue": "PsyArXiv", "date": "2026-11-17", "why": "事前登録した実験室実験（193人）で、関係推論の課題をChatGPTの有無と成果報酬の有無で解かせ、その後AIなしでより複雑な課題と記憶テストを課した。AIの支援は最初の正答率を上げたが、後の自力の推論がやや劣る証拠があり、報酬や難しさに応じた努力の調整が弱かった。記憶への明確な影響はなかった。"}, {"id": "pn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "自発的なチーム形成を安定性の制約で説明", "title": "Team Stability: Theory and Evidence", "url": "https://arxiv.org/abs/2611.19476", "authors": "Anton Badev", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "個人が自ら協働相手を選んでチームができる過程を、合意による形成・外部性・混雑を含む理論で表し、メンバーが離脱や単独作業を望まないという安定性の制約を課した。連邦準備制度理事会のエコノミストの共同研究で、制約が観測されたチームを説明し、経験者に業務を移すと新人の研究成果と協働が増えると報告する。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "米大企業の社会問題への立場表明は4倍に", "title": "Corporate Stances on Societal Issues in the US", "url": "https://arxiv.org/abs/2611.19068", "authors": "Jacob Conway ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "S&P500の836社について2008〜2025年の約5万2千件の記事・プレスリリースをLLMで読み、9つの党派的な争点で9,917件の立場表明を特定した。表明は2008年以降4倍に増えて2021年に最多、大半がリベラル寄りで大企業に集中し、ロビー活動や献金とは弱くしか関係せず、報道と関心の高まりに合わせて行われると報告する。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "規制当局の名指し公表でアプリの更新が減る", "title": "Regulatory Naming and Shaming and Product Innovation: Evidence from App Portfolios", "url": "https://doi.org/10.2139/ssrn.7694358", "authors": "Chenze Wang ほか", "venue": "SSRN", "date": "2026-11-17", "why": "利用者の権利を侵害したアプリを中国政府が公表する政策を準自然実験とし、iOSアプリのパネルで傾向スコアと差の差法を組み合わせ、名指しされたアプリの大型更新が約27.5%減る一方、同じ開発者の名指しされていないアプリでは約16.7%増えたと報告する。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "0.9Bから375Bまで開発履歴ごと公開したLLM群", "title": "K2-Horizon: A Frontier Fleet of Open Source Language Models", "url": "https://arxiv.org/abs/2611.21003", "authors": "K2 Team ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "0.9Bの密モデルから375B-A23BのMoEまで6つのモデルを、中間チェックポイントを含む開発履歴ごと公開した。注意の値射影にMoEを使うMoVAなどを導入し、36B-A4Bのモデルは同じデータの32B密モデルに活性パラメータ7分の1でほぼ並ぶと報告する。"}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "LATEの仮定が含む制約を使う条件付き尤度比検定", "title": "Never too LATE: Exploiting restrictions for inference on the Local Average Treatment Effect", "url": "https://arxiv.org/abs/2611.21496", "authors": "Xavier D'Haultf{\\oe}uille ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "除外制約・独立性・単調性の仮定が含意する追加の制約を使い、局所平均処置効果（LATE）について、広いデータ生成過程で漸近的にサイズを一様に制御する条件付き尤度比検定を提案した。計算は軽く、弱い操作変数でもWald検定やAnderson–Rubin検定より検出力が高い。"}, {"id": "pn15", "rank": 15, "field": "工学", "headline": "地区別の被害集計からヒマラヤの組積造の脆弱性", "title": "What district damage statistics can identify: joint Bayesian inference of intensity and masonry vulnerability after the 2005 Kashmir earthquake", "url": "https://doi.org/10.21203/rs.3.rs-11509792/v1", "authors": "Syed Sajid Hussain", "venue": "Research Square (In Review)", "date": "2026-11-17", "why": "2005年カシミール地震の8地区・約79万戸の被害集計を、センサスの壁材とShakeMapの震度と組み合わせ、震度場を不確実とする階層ベイズで組積造の脆弱性関数を推定した。地区を除いた予測とインド側の公式統計で検証し、粗石造の脆弱性指数は欧州の基準と同程度かやや上と報告する。"}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "チーム募集では上位者に返信と成功が集中", "title": "Who Shows Up, Who Benefits, and Who Wins? Expert-Novice Disparities in Team-Seeking Forums and Competition Performance on Kaggle", "url": "https://arxiv.org/abs/2611.18983", "authors": "Ran Bi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "Kaggleの「チームを探す」スレッドの2023年の18のコンペで、参加者671人の89.3%は下位層だが、上位層ほど返信を多く受け、チーム形成に成功しやすい（52.9%対32.6%）ことを示し、公開のチーム形成が既存の階層を再生産しうると報告する。"}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "チームの動きを52変数のポート・ハミルトン系で予測", "title": "ANCHOR: A Port-Hamiltonian Model for Forecasting Team Dynamics in Human-in-the-Loop Systems", "url": "https://arxiv.org/abs/2611.19124", "authors": "Diana Romero ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "複合現実のヘッドセットで計測した発話・視線・位置からチームの協働を予測するため、チームを「エネルギーの器の中の球」とみなす52パラメータのスイッチ型ポート・ハミルトン系を提案し、各部分をチーム心理学の検証可能な主張に対応させた。約4万パラメータのブラックボックスと同等の精度で、会話の崩壊をAUROC 0.85で予測する。"}, {"id": "pn18", "rank": 18, "field": "心理学・認知科学", "headline": "再現失敗後の再挑戦で再現したのは17件中5件", "title": "Estimating the replicability of psychology experiments after an initial failure to replicate", "url": "https://doi.org/10.31234/osf.io/an3yb_v2", "authors": "Veronica Boyce ほか", "venue": "PsyArXiv", "date": "2026-11-17", "why": "最初の追試で再現できなかった心理学の17の実験を再び追試し、5件（29%）で元の結果がおおむね再現されたが効果量は小さく、12件は再び失敗したと報告する。明らかな弱点のない失敗の後は、その効果の追究をやめるのが効率的かもしれないと論じる。"}, {"id": "pn19", "rank": 19, "field": "心理学・認知科学", "headline": "臨床心理の力学系研究に高次元の呪い", "title": "The Curse of Dimensionality: How Does it Affect Dynamical Systems Research in Clinical Psychology?", "url": "https://doi.org/10.31234/osf.io/8uyv7", "authors": "Jingmeng Cui", "venue": "PsyArXiv", "date": "2026-11-17", "why": "臨床心理学で広がる力学系アプローチが低次元の安定性の地形に頼っていることを指摘し、高次元の地形が直観と食い違う可能性と、安定性と遷移の情報を保つ低次元の記述という解決策、次元縮約を中心とする研究課題を提案する。"}, {"id": "pn20", "rank": 20, "field": "経営学", "headline": "運用者の大学の授業内容が運用成績を左右", "title": "Education and Investment Skill: Evidence from Mutual Fund Managers&nbsp;", "url": "https://doi.org/10.2139/ssrn.7694303", "authors": "Vasudha Nair", "venue": "SSRN", "date": "2026-11-16", "why": "約7万5千のシラバスから大学の教育の「運用実務への関連性」と「研究への適時性」を測り、どちらも1標準偏差高いと年率約0.5ポイント高いリターンと関連し、高校に最も近い大学の値を操作変数にしても結果が保たれると報告する。"}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "誰も読まない開示が投資信託の行動を律する", "title": "The Hidden Work of Disclosures", "url": "https://doi.org/10.2139/ssrn.7709199", "authors": "Timothy D. Lytton ほか", "venue": "SSRN", "date": "2026-11-16", "why": "投資顧問・運用者・コンプライアンス担当・弁護士への面接から、投資信託の開示は投資家に読まれる前の作成・審査の過程で専門職の規範と法的監督を働かせ、商品設計や運用を律していると論じ、開示は無効だという通説に反論する。"}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "インフルエンサーの「役立つ嘘」が厚生を上げる", "title": "Truths, Half-truths and Helpful Lies: Crafting Influencer Strategy using Information Design", "url": "https://doi.org/10.2139/ssrn.7691622", "authors": "Sridhar Balasubramanian", "venue": "SSRN", "date": "2026-11-17", "why": "ベイズ説得の情報設計で、第三者の口コミサイトが良い組み合わせを悪いと判定する誤りがある市場での最適なインフルエンサー戦略を導き、その誤りが小さいときは消費者厚生を最大にするインフルエンサーが悪い組み合わせを良いと伝える「役立つ嘘」で普及不足を補うと示した。"}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "話題のゲームの効果を経路別に分解", "title": "From Viral Exposure to Engagement: A Causal Mediation Framework for Digital Platforms", "url": "https://arxiv.org/abs/2611.18945", "authors": "Bolun Liu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "Robloxで、話題のゲームのプレイ時間がその後の利用に与える効果を、交流や発見の行動を介する間接効果と直接効果に分ける因果媒介の枠組みを作った。交差適合のR-learnerで経路ごとの効果を共変量の関数として推定し、平均する前に個人ごとの偏りの補正を加える。"}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "事実と反事実を同時に学ぶ因果PFN", "title": "Joint Learning of Factual and Counterfactual Worlds for Causal Prior-data Fitted Networks", "url": "https://arxiv.org/abs/2611.19710", "authors": "Furkan Danisman ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "合成データで事前学習する因果のPFN（事前データ適合ネットワーク）は両方の世界の結果を生成できるのに、学習目標が単位ごとに一方の結果しか使っていなかったと指摘し、事実と反事実の世界を同時に学習して、処置効果の分布の依存構造を捉える方法を提案する。"}, {"id": "pn25", "rank": 25, "field": "因果推論", "headline": "二つの環境の差で予測を頑健にする因果正則化", "title": "Causal Regularization for Robust Prediction", "url": "https://arxiv.org/abs/2611.18814", "authors": "Alessia Berarducci ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "学習データに2次モーメントの有限性だけを仮定し、2つの環境の共変量と応答の2次モーメントの違いで定めた一般化リスク差から、分布の変化に頑健な予測を得る因果正則化を一般化した。OLSと正則化の極限を補間する閉じた形の推定量を導く。"}, {"id": "pn26", "rank": 26, "field": "因果推論", "headline": "為替介入は識別の良い研究ほど効果が明確", "title": "Does Foreign Exchange Intervention Move Exchange Rates? Evidence Ranked by Identification Strategy", "url": "https://doi.org/10.31235/osf.io/wp7bg", "authors": "Alain Naef", "venue": "SocArXiv", "date": "2026-11-16", "why": "中央銀行は通貨が圧力を受けているときに介入するため単純な推定は効果を0に近づけると論じ、9つの実証デザインを識別の信頼性で順位づけて50年分の証拠を読み直し、信頼性の高いデザインほど介入が意図した方向に数分から数週間効くという結果が明確になると示した。"}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "農業債務の免除で家計は出稼ぎから地元の起業へ", "title": "Business Debt Relief and the Reallocation of Household Labor", "url": "https://doi.org/10.2139/ssrn.7694858", "authors": "Naman Nishesh", "venue": "SSRN", "date": "2026-11-16", "why": "インドの大規模な農業債務免除の適格基準の準無作為性を使い、銀行の行政記録と事業登録を結びつけ、免除対象の家計が都市への出稼ぎ労働を減らし、地元での小規模事業の借入と非農業の起業を増やしたと報告する。農場単位の評価では見えない便益を示す。"}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "犯罪組織からの領域奪還で零細事業の所得が13%増", "title": "The Economic Returns to Restoring State Control: Informal Businesses and Security Policy in El Salvador", "url": "https://doi.org/10.2139/ssrn.7691958", "authors": "Johann Caro-Burnett ほか", "venue": "SSRN", "date": "2026-11-17", "why": "エルサルバドルの地理的に絞った治安計画の段階的な導入と2015〜2025年の家計調査から、インフォーマルな自営業の実質月収が約13%増え、時間当たり所得も増えたと推定した。2022年以降も約15%の増加が続き、治安の認識も改善したと報告する。"}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "ドラマの聖地化で観光は急増したが雇用は増えず", "title": "A Game of Throngs: How Spotlight Tourism Reshapes Local Economies", "url": "https://arxiv.org/abs/2611.21364", "authors": "Mafalda Batalha ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "2017年に『ゲーム・オブ・スローンズ』の舞台になったバスクの礼拝堂を外生的なショックとし、行政データと合成統制法で、観光は急増したが観光関連の雇用増は他部門の減少で相殺され総雇用は変わらず、住宅市場の過熱の兆候があったと報告する。"}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "AIの高度化は価格の情報効率を下げうる", "title": "The opposing informational effects of AI trading", "url": "https://arxiv.org/abs/2611.18872", "authors": "Hajime Shimao", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "資源の限られた予測を行う競争市場で、高性能なアルゴリズムが私的観察を公開記録の分析で代替し、価格に集約される私的情報が減る効果と、高度な分析を他の投資家に伝える効果が共存する条件を示した。神経ネットによる市場実験では、普及が進むと性能向上の利得が44%下がった。"}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "学習データへの対価支払いがAIによる代替を進める", "title": "Paying Creators for Training Data Can Increase AI Displacement", "url": "https://arxiv.org/abs/2611.20204", "authors": "Lijuan Luo ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "作り手が学習データを提供するかを選び、消費者が作り手の作品とAIの生成物を選ぶプラットフォームのモデルで、学習データへの対価の支払いを義務づけると、質の低い作り手はデータの提供に専念しAIが需要を完全に奪うことを示した。支払いがない場合は、作り手を失う恐れが価格を抑える。"}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "戦争による物価ショックでECBへの信認が低下", "title": "Transient Shocks Fade, Persistent Ones do Not: The ECB's Credibility with Households after Two Wars", "url": "https://doi.org/10.2139/ssrn.7692760", "authors": "Leonardo Cadamuro", "venue": "SSRN", "date": "2026-11-17", "why": "ECB消費者期待調査の同じ家計を2022年のウクライナ侵攻と2026年の中東の戦争の前後で追い、両方で1年先の期待インフレ率が2.3ポイント上がり、ECBが物価安定を保つ確率の評価が下がったと報告する。原油価格が戻った2026年7月には損失の3分の1から3分の2を回復した。"}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "LLMで付けた処置ラベルの回帰は誰の効果か", "title": "Who Is the Regression About? Auditing AI-Labeled Treatments When Effects Differ", "url": "https://arxiv.org/abs/2611.21207", "authors": "Ayman Farahat", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "LLMが付けた処置のラベルにOLSを当てると、処置群と対照群の効果を少ない群に重みを置いて平均すると指摘し、ラベルの偏りを古典的な減衰と結果に相関する選択的な項に分解した。LinkedInの求人でリモート勤務の賃金差が約40%過小評価されることと、層別の盲検監査による補正を示す。"}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "共変量シフト下の重み付き等角予測の極限理論", "title": "Weighted conformal prediction under covariate shift: process limits, estimated weights and efficiency", "url": "https://arxiv.org/abs/2611.20052", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "共変量シフトに尤度比で重み付けする分割等角予測について、重み付き経験分布関数の過程の弱収束をχ²距離が有限であることと同値に特徴づけ、水準をまたぐ被覆の同時分布、整合的なブートストラップ、推定された重みの影響を導いた。"}, {"id": "pn35", "rank": 35, "field": "統計学", "headline": "低次元スケッチでシミュレーション推論を圧縮", "title": "Compressed Simulation-Based Inference: Neural Posterior Estimation for Massive Data via Low-Dimensional Sketches", "url": "https://arxiv.org/abs/2611.21286", "authors": "Michael Wieck-Sosa ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "大量データの神経事後推定で、要約統計量の代わりにデータのランダムな低次元スケッチを条件とする方法を提案し、p次元のパラメータでは2p+1個のスケッチで事後一致性が得られることを示した。"}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "LLM評価の成功確率の分布に有限標本の信頼領域", "title": "Variance-adaptive confidence regions for fixed-benchmark binomial mixtures, with application to LLM evaluation", "url": "https://arxiv.org/abs/2611.21266", "authors": "Kuancheng Ye", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "問題ごとにn回実行したLLMの成功回数から、成功確率の経験分布の線形 tion Within Loan Syndicates", "url": "https://doi.org/10.1111/1475-679x.70097", "authors": "Robert M. Bushman ほか", "venue": "Journal of Accounting Research", "date": "2026-11-17", "sjr": 9.774, "citescore": 13.4, "citescore_year": "2025", "why": "協調融資市場で、主幹事行と参加行の政治的な距離が大きいほど参加の確率と保有割合が下がり、全米の分極化が強い時期に関係が強まることを示した。シンジケート内の政治的多様性は緩いコベナンツと高い金利スプレッドと関連し、再交渉の膠着を避けるため条件付きの統制を手放すトレードオフと解釈する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "責任投資を誓った投信は企業訪問を増やす", "title": "Do Fund Managers’ Commitments to Responsible Investing Affect Private Information Acquisition, Information Environment, and Corporate Sustainability?", "url": "https://doi.org/10.1287/mnsc.2024.08443", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-16", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "国連責任投資原則に署名した投資信託の運用者が、環境・社会の問題に焦点を当てた企業訪問を増やすことを示した。訪問は訪問したファンドの投資価値をほとんど生まないが、アナリスト予想の誤差の低下など銘柄の情報環境を改善し、訪問先企業の持続可能性の実践を高める外部性を持つ。"}, {"id": "jn06", "rank": 6, "field": "気候科学", "headline": "メキシコ湾流の変動が北極経由で黒潮続流に及ぶ", "title": "Kuroshio Extension warming shaped by Gulf Stream variability via the Arctic atmosphere", "url": "https://doi.org/10.1038/s41561-026-02139-2", "authors": "Yoko Yamagami ほか", "venue": "Nature Geoscience", "date": "2026-11-17", "sjr": 6.141, "citescore": 27.3, "citescore_year": "2025", "why": "100年の理想化モデル実験で、メキシコ湾流の変動が黒潮続流の海面水温の内部変動の13%を説明する一方、逆向きの影響は見られないことを示した。湾流の正の海面水温偏差が北半球環状モードに似た大気循環を励起してアリューシャン低気圧を弱め、黒潮続流を北へずらすと報告する。"}, {"id": "jn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "成功は文化の多様さで学びにくく失敗は学びやすい", "title": "The Impacts of Host Culture Heterogeneity on Learning from Success Versus Failure in Foreign Direct Investments", "url": "https://doi.org/10.1111/joms.70178", "authors": "Yuping Zeng ほか", "venue": "Journal of Management Studies", "date": "2026-11-17", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "韓国の多国籍企業の1990〜2016年の海外直接投資のデータで、過去に成功した投資先の文化が多様なほど成功経験の学習効果が弱まり、過去に失敗した投資先の文化が多様なほど失敗経験の学習効果が強 score": 14.7, "citescore_year": "2025", "why": "中国の石炭火力の新設を国内外の社会・経済・気候・地政学の影響から分析する統合的な枠組みを作り、2030年までに再生可能エネルギーを3倍にすれば（中国は達成の見込み）、発電構成と蓄電の計画と合わせて全ての電力需要シナリオを満たし、石炭火力の追加は不要だと示した。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "複数の政府機関との研究開発契約が市場の学習に", "title": "Government‐funded experimentation: How startups use R&D contracts to resolve uncertainty", "url": "https://doi.org/10.1002/sej.70063", "authors": "Larisa Cioaca", "venue": "Strategic Entrepreneurship Journal", "date": "2026-11-16", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "2001〜2018年の米政府の研究開発契約320億ドル分でハイテク新興企業を調べ、契約額（技術の実験）よりも契約した機関の数（市場の実験）がその後の雇用・売上・買収と正に関連することを示し、複数の政府の買い手から市場の機会を学ぶ過程と整合的だとする。"}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "女性リーダーはDXで技術と社会の統合を実践", "title": "Digital Transformation Through a Socio‐Technical Systems Lens: Women Leaders' Approaches to Technological Change and Organizational Dynamics", "url": "https://doi.org/10.1111/ntwe.70058", "authors": "Chanvi Singh ほか", "venue": "New Technology, Work and Employment", "date": "2026-11-17", "sjr": 3.193, "citescore": 13.3, "citescore_year": "2025", "why": "豪州の上級女性リーダー16人への面接の主題分析で、技術と社会の要素を相互に構成するものとして扱い、意思疎通・従業員の参加・人間中心の職務設計・能力開発・継続的な適応で統合を実践していることを示し、心理社会的安全性がシステム水準の条件として現れたと報告する。"}, {"id": "jn14", "rank": 14, "field": "心理学・認知科学", "headline": "同じ種類の曲が呼び起こす自伝的記憶は人どうしで似る", "title": "Music illuminates sociocultural dimensions of autobiographical memory", "url": "https://doi.org/10.1073/pnas.2536885123", "authors": "Cara Turnbull ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "大学生233人が親しんだ曲の短い断片から想起した自伝的記憶の自由記述を自然言語処理で分析し、同じ種類（ジャンル・発売時期）の曲が呼び起こす記憶は聞き手どうしで著しく似ていることを示した。歌詞の語や要約を手がかりにした対照条件では説明できず、社会文化的に共有された筋書きを反映すると論じる。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "身長で見る7000年のユーラシアの生活水準", "title": "Stature reveals changing patterns of the biological standard of living in E       }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
