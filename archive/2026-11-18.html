e": 7.7, "citescore_year": "2025", "apa": "Nakamichi, Y., O’Sullivan, C., Tangney, P., & Angioletti-Uberti, S. (2027). Particle-Scale Triaxial Compression Simulations of Clay Using Coarse-Grained Molecular Dynamics. Journal of Geotechnical and Geoenvironmental Engineering, 153(2). https://doi.org/10.1061/jggefk.gteng-15422", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "粗視化分子動力学（CGMD）で正規圧密のカオリナイトの三軸圧縮を粒子から再現し、間隙流体のpHによる初期の微視構造の違いが、ひずみ硬化・収縮と、ピーク強度・ダイレイタンシーの違いを生むことを示した（抄録）。", "p3": "pH=4の綿毛状とpH=8の分散状の2つの仮想試料を作り、拘束圧300・400・500 kPaで三軸圧縮の計算を行い、粒子間摩擦係数を変えるパラメータ研究を行った（抄録）。", "p5": "CGMDは応力依存の剛性とせん断強度、大ひずみでの限界状態への収束を定性的に再現した。pH=4はひずみ硬化・収縮、pH=8はピーク強度・ダイレイタンシーを示した。粒子間摩擦を増やすと限界状態の摩擦角が増え、実験値に近づくには摩擦係数がおよそ1.0必要だった（抄録）。", "fun": "粘土は目に見えない板状の粒子の集まりで、粒子のくっつき方は水の酸性度で変わる。この研究は粒子を一つずつ計算機の中で並べ、押しつぶす試験をまねた。同じ粘土でも、酸性の水ではじわじわ固くなり、アルカリ性の水では一度強くなってから崩れた。粒の並び方が土の性格を決めることを見せた点が面白い。", "unverified": "計算に使った粒子数と計算時間は抄録からは確認できない。"}}, {"id": "jr27", "rank": 27, "headline": "仕事の意味と天職感がストレス要因の害を緩める", "title": "Mitigating the Negative Consequences of Work Stressors: The Role of Perceived Meaning and Calling", "url": "https://doi.org/10.1177/08948453261509347", "authors": "Danielle West ほか", "venue": "Journal of Career Development", "date": "2026-11-17", "sjr": 1.277, "citescore": 9.3, "citescore_year": "2025", "apa": "West, D., Gardner, D. M., Prasad, J. J., & Dik, B. J. (2026). Mitigating the Negative Consequences of Work Stressors: The Role of Perceived Meaning and Calling. Journal of Career Development. https://doi.org/10.1177/08948453261509347", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "仕事の要求度-資源（JD-R）の枠組みで、職場のストレス要因が仕事と健康に及ぼす害を、仕事の意味が媒介し、天職感（コーリング）が緩衝することを示した（抄録）。", "p3": "493人の従業員への2時点の調査で、ストレス要因への曝露から、仕事の意味の経験を経て、職務満足・離職意図・身体症状・燃え尽きに至るモデルを、天職感の程度による違いを含めて検証した（抄録）。", "p5": "特定のストレス要因への曝露と職場・健康の結果は一貫して結びついていた。天職感が、仕事の意味を通じて一部のストレス要因の影響を和らげることが支持された（抄録）。", "fun": "同じように忙しい職場でも、つぶれてしまう人と踏ん張れる人がいる。この研究は、その差の一つが「この仕事には意味がある」「これは自分の天職だ」という感覚にあることを示した。仕事の負担を減らすことだけでなく、仕事の意味を感じられるようにすることも守りになるという視点が面白い。", "unverified": "ストレス要因の種類ごとの効果の大きさは抄録からは確認できない。"}}, {"id": "jr28", "rank": 28, "headline": "ごみ収集車のカメラで不法投棄を即時に地図化", "title": "KerbTrack – A privacy-compliant modular AIoT solution for on-demand mapping of illegal kerbside bulk waste dumping", "url": "https://doi.org/10.1108/sasbe-05-2026-0428", "authors": "Umair Iqbal ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-11-17", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "apa": "Iqbal, U., Papini, M., Zulfiqar, M., Lim, D., Barthelemy, J., & Perez, P. (2026). KerbTrack – A privacy-compliant modular AIoT solution for on-demand mapping of illegal kerbside bulk waste dumping. Smart and Sustainable Built Environment, 1–30. https://doi.org/10.1108/sasbe-05-2026-0428", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "ごみ収集車に載せたエッジAIのカメラで、歩道に不法投棄された粗大ごみをリアルタイムに検出・地図化する、プライバシーに配慮したAIoTの仕組みを作り、試作で運用の実現性を示した（抄録）。", "p3": "新しい注釈付きデータKerbTrackと、FLUX.1-devとLoRAで作った合成画像5,114枚のKerbTrack-Synで、YOLOやDINOなどの物体検出を学習・評価し、収集車のIMX335カメラにつないだNVIDIA Jetson AGX Orinに実装し、検出のメタデータと位置だけをダッシュボードに送った（抄録）。", "p5": "KerbTrackではYOLOv26がmAP50 90%で最も高かったが、誤り分析と合成データでの評価では、DINOが誤検出の抑制と多様な見え方への頑健性で優れていた。収集車での試作で運用の実現性を確かめた（抄録）。", "fun": "毎日街を回るごみ収集車にカメラとAIを積めば、道ばたの不法投棄を自動で見つけて地図にできる。映像そのものは送らず「どこに何があったか」だけを送るので、通行人のプライバシーも守れる。街を走る車を、街の見回り役の動くセンサに変える発想が面白い。", "unverified": "試作は限られた条件の小規模なもので、他の都市や天候での性能は未確認（著者が明記）。"}}, {"id": "jr29", "rank": 29, "headline": "サービス失敗時の炎上でフォロワーが集まる要因", "title": "Follower formation in online brand community firestorms: Social characteristics, post content, and peer attention during service failure", "url": "https://doi.org/10.1016/j.jretconser.2026.105215", "authors": "Lingpiao Wang ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-11-17", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "apa": "Wang, L., Wang, Y., Li, X., Tian, H., Jiang, M., & Shi, Z. (2027). Follower formation in online brand community firestorms: Social characteristics, post content, and peer attention during service failure. Journal of Retailing and Consumer Services, 95, 105215. https://doi.org/10.1016/j.jretconser.2026.105215", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、サービスの失敗をきっかけにオンラインのブランドコミュニティで起きる炎上について、投稿者の社会的な特徴・投稿の内容・仲間の注目が、フォロワーの形成にどう影響するかを調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "お店やブランドの失敗にSNSで怒りの声が上がると、ある投稿には次々と人が集まり、別の投稿は埋もれていく。題名からは、誰が、何を、どんな注目のもとで投稿すると人が集まるのかを調べる研究と読める。炎上が広がる仕組みを、投稿のつながりから解き明かそうとする問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}, {"id": "jr30", "rank": 30, "headline": "財務困窮企業の株価は市場と連動しにくい", "title": "Financial distress and stock comovement", "url": "https://doi.org/10.1080/23270012.2026.2738149", "authors": "Zhuo June Cheng ほか", "venue": "Journal of Management Analytics", "date": "2026-11-16", "sjr": 0.649, "citescore": 7.1, "citescore_year": "2025", "apa": "Cheng, Z. (., Fang, J., & Huang, S. (2026). Financial distress and stock comovement. Journal of Management Analytics, 1–25. https://doi.org/10.1080/23270012.2026.2738149", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "財務困窮企業の株式リターンは市場全体との共変動が最も低く、それが評価の不確実性と情報・裁定の摩擦による企業固有の変動で説明されることを示した（抄録）。", "p3": "線形のファクターモデルで、財務困窮の程度とリターンの共変動・固有変動の関係を分析し、困窮と誤評価（過小・過大評価）の関係から極端なリターンの起こりやすさを調べた（抄録）。", "p5": "財務困窮企業ほど共変動が低く、高い固有変動がそれを説明した。困窮企業は極端な正・負のリターンを経験しやすく、困窮企業に当てはめたアノマリー戦略の高いリターンや、困窮とリターンの関係の実証結果の食い違いを説明する助けになる（抄録）。", "fun": "倒産しそうな会社の株は、市場全体が上がっても下がっても、それとは関係なく大きく動く。値段の決め方がはっきりせず、売り買いで正す人も少ないので、値段が本当の価値から大きくずれやすいからだ。危ない会社ほど「市場と一緒に動かない」という性質が、昔からの謎を解く鍵になる点が面白い。", "unverified": "対象の市場・期間・企業数は抄録からは確認できない。"}}, {"id": "jr31", "rank": 31, "headline": "MFIの困窮予測は時間順の検証で精度が下がる", "title": "Leveraging machine learning to predict distress in microfinance institutions", "url": "https://doi.org/10.1016/j.iref.2026.106044", "authors": "Tushar M. Bhuwad ほか", "venue": "International Review of Economics & Finance", "date": "2026-11-12", "sjr": 1.485, "citescore": 8.3, "citescore_year": "2025", "apa": "Bhuwad, T. M., Ranjani, K. S., & Manupati, V. K. (2026). Leveraging machine learning to predict distress in microfinance institutions. International Review of Economics & Finance, 112, 106044. https://doi.org/10.1016/j.iref.2026.106044", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "マイクロファイナンス機関の財務困窮の早期警戒に機械学習を使い、無作為の交差検証より時間順の検証で精度が大きく下がること、運営の自立度が困窮とU字型に関連することを示した（抄録）。", "p3": "MIX Marketの933機関の2015〜2019年のパネルで、資本構成と運営効率の指標を予測子とし、SMOTEで不均衡を補正して複数の分類器を比べた。困窮はAltman Z''の非製造業版で代理し、無作為と時間順の検証で評価した（抄録）。", "p5": "ランダムフォレストとK近傍法が最も良く、無作為の検証で重み付きF1は約96.2%（困窮クラスのF1は約0.82）だったが、時間順の検証では約71.0%に下がった。モデルの順位は安定していた。運営自立度が最も重要で、低すぎても高すぎても困窮のリスクが高かった（抄録）。", "fun": "AIの予測は、過去と未来を混ぜて検証すると良く見えるが、本番では「過去から未来を当てる」しかない。この研究は、検証の仕方を変えるだけで成績が96%から71%に落ちることを示した。さらに、効率が良すぎる機関も危ないというU字の関係も面白い。予測の評価は使う場面に合わせるべきだという好例だ。", "unverified": "困窮の代理指標（Altman Z''）が実際の破綻とどれだけ対応するかは抄録からは確認できない。"}}, {"id": "jr32", "rank": 32, "headline": "市営コワーキング拠点が若者の社会関係資本を育む", "title": "From shared space to shared resilience: How municipal co‐working hubs build social capital among urban young adults", "url": "https://doi.org/10.1002/ajcp.70119", "authors": "Tal Harel ほか", "venue": "American Journal of Community Psychology", "date": "2026-11-17", "sjr": 1.195, "citescore": 6.0, "citescore_year": "2025", "apa": "Harel, T., Harel, D., & Kaplan, S. (2026). From shared space to shared resilience: How municipal co‐working hubs build social capital among urban young adults. American Journal of Community Psychology. https://doi.org/10.1002/ajcp.70119", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "テルアビブ・ヤッフォの市営のコワーキング・学習拠点が、18〜35歳の若者の自己組織化・自信・所属感を支え、結束・橋渡し・連結の社会関係資本を通じて地域のレジリエンスを支えうることを質的に示した（抄録）。", "p3": "統合レジリエンス・モデルに基づき、5つの市営拠点の職員と若者への72件の半構造化面接を主題分析した（抄録）。", "p5": "学び、自主的な取り組み、地域の行事、支えになる職員との関係、仲間の支え、市とのつながり、個人のエンパワメント、機能的な設備の8つの主題が得られ、拠点を相互支援・参加・共同の取り組みの機会を通じた公共のレジリエンスの基盤と位置づけた（抄録）。", "fun": "市が用意した共用の仕事場や勉強場所は、ただの机と電源ではない。そこで顔を合わせるうちに仲間ができ、市の担当者とつながり、自分たちで催しを始めるようになる。この研究は、日々の「場」が若者と地域の回復力を育てる仕組みを描いた。公共の施設を人のつながりの土台として見る視点が面白い。", "unverified": "面接の対象者の内訳と、拠点ごとの違いは抄録からは確認できない。"}}, {"id": "jr33", "rank": 33, "headline": "移民女性の見えない介護を演劇で可視化する計画", "title": "Performing the unspoken: Protocol for an ethnodrama study of caregiver burden among Arab migrant women caring for older adults at home in the Greater Toronto Area", "url": "https://doi.org/10.1371/journal.pone.0362877", "authors": "Areej Al‐Hamad ほか", "venue": "PLoS ONE", "date": "2026-11-16", "sjr": 0.726, "citescore": 4.8, "citescore_year": "2025", "apa": "Al-Hamad, A., Yasin, Y. M., Metersky, K., Kokorelias, K., & Lewis, C. (2026). Performing the unspoken: Protocol for an ethnodrama study of caregiver burden among Arab migrant women caring for older adults at home in the Greater Toronto Area. PLOS One, 21(11), e0362877. https://doi.org/10.1371/journal.pone.0362877", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "トロント圏で高齢者を在宅で介護するアラブ系移民女性の負担を、面接・エスノドラマ（当事者の語りに基づく演劇）・名義集団法の3段階で可視化し、支援の提言を共同で作る研究計画を示した（抄録）。", "p3": "アラブ・コミュニティ・センターと協働し、ケアの倫理と交差性の枠組みで、第1段階に20〜25人の半構造化面接と主題分析、第2段階に語りを4つの短い場面の演劇にして上演と観客の対話、第3段階に関係者10〜15人とのオンラインの名義集団法で提言の優先順位を付ける（抄録）。", "p5": "計画の論文で結果はまだない。成果として多層の提言、地域への報告書、演劇を使った知識の発信、学術論文、知識の発信の会合を予定している（抄録）。", "fun": "家族の介護は、家の中で黙って担われるため外から見えにくい。移民の女性なら、言葉の壁や文化の期待も重なる。この研究は、そうした語られない経験を聞き取り、演劇にして人前で演じ、見た人の反応からも支援の必要を探る。研究の結果を数字ではなく舞台で伝えるという方法が面白い。", "unverified": "計画段階のため、結果はない。"}}, {"id": "jr34", "rank": 34, "headline": "E3C超縮約でマルチスケール均質化を高速化", "title": "An adaptive E3C hyper-reduction approach to the homogenization of dissipative microstructures and its justification via the Hill-Mandel condition", "url": "https://doi.org/10.1007/s00466-026-02869-5", "authors": "Hauke Goldbeck ほか", "venue": "Computational Mechanics", "date": "2026-11-17", "sjr": 1.223, "citescore": 7.7, "citescore_year": "2025", "apa": "Goldbeck, H., & Wulfinghoff, S. (2026). An adaptive E3C hyper-reduction approach to the homogenization of dissipative microstructures and its justification via the Hill-Mandel condition. Computational Mechanics. https://doi.org/10.1007/s00466-026-02869-5", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "散逸性の微視構造を持つ材料の3次元の非弾性の計算均質化を、E3C超縮約で高速化し、その理論的な裏付けとオンラインで部分空間を適応させる方法を示した（抄録）。", "p3": "E3C法が古典的なHill–Mandelのマクロ均質性条件の射影・超縮約版を満たすことを示し、内部変数を持つ非結晶の散逸材料に粘性の正則化で拡張し、オフラインで決めた線形の部分空間の中に、より低次元で動的に更新するアフィン部分空間を作る「逐次部分空間モード適応」を提案した（抄録）。", "p5": "学習のバッチサイズ・材料の非線形性・微視構造の影響をパラメータ研究で評価し、数十万のマクロ自由度を持つ3次元の弾塑性の2スケール計算で、単一スケールの計算に近い計算時間で効率と精度を示した（抄録）。", "fun": "複合材料の部品を計算するには、部品の各点で、さらに細かい内部構造の計算を繰り返す必要があり、途方もなく重い。この研究は、内部構造の計算を少数の代表的な形の組み合わせに縮め、しかもその形を計算の途中で入れ替えて精度を保った。重い計算を物理の約束を守ったまま軽くする工夫が面白い。", "unverified": "縮約による誤差の大きさの数値は抄録からは確認できない。"}}, {"id": "jr35", "rank": 35, "headline": "確率動力学系の条件付き破壊確率を評価する枠組み", "title": "A KPOD-K-MEL computational framework for conditional failure probability evaluation: toward reliability-based design optimization of stochastic dynamic systems", "url": "https://doi.org/10.1016/j.compstruc.2026.108541", "authors": "Zeming Chang ほか", "venue": "Computers and Structures", "date": "2026-11-17", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "apa": "Chang, Z., Li, L., & Liu, Y. (2027). A KPOD-K-MEL computational framework for conditional failure probability evaluation: toward reliability-based design optimization of stochastic dynamic systems. Computers & Structures, 334, 108541. https://doi.org/10.1016/j.compstruc.2026.108541", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、確率的な動的システムの条件付きの破壊確率を評価し、信頼性に基づく設計最適化につなげる計算の枠組み（KPOD-K-MEL）を提案する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "地震や風のように揺れ方が毎回違う力を受ける構造物が、ある条件のもとでどれくらいの確率で壊れるか。それを設計のたびに計算するのは重すぎる。題名からは、この確率を効率よく求めて、壊れにくさを保証する設計の最適化に使う方法を作る研究と読める。偶然を含む揺れを確率で扱う問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。手法名の略語の意味も未確認。"}}, {"id": "jr36", "rank": 36, "headline": "GNNで粒状体の粒子間接触力を予測", "title": "Graph neural network prediction of inter-particle contact forces in granular materials under uniaxial compression", "url": "https://doi.org/10.1016/j.engappai.2026.116683", "authors": "Mobina Taghaddosi ほか", "venue": "Engineering Applications of Artificial Intelligence", "date": "2026-11-16", "sjr": 1.782, "citescore": 11.7, "citescore_year": "2025", "apa": "Taghaddosi, M., & Mahabadi, N. (2027). Graph neural network prediction of inter-particle contact forces in granular materials under uniaxial compression. Engineering Applications of Artificial Intelligence, 187, 116683. https://doi.org/10.1016/j.engappai.2026.116683", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、一軸圧縮を受ける粒状体の粒子間の接触力を、グラフニューラルネットワークで予測する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "砂を押し固めると、力は全ての粒に均等にかかるのではなく、一部の粒がつながった「力の鎖」に集中する。題名からは、粒とその接触をつながりの網（グラフ）として表し、どの接触に強い力がかかるかをAIで当てる研究と読める。目に見えない力の通り道を予測するという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr37", "rank": 37, "headline": "雪解け水と降雨でトンネル残土の土石流が発生", "title": "A preliminary study of runoff-generated waste dump debris flow in the mountain cryosphere", "url": "https://doi.org/10.1007/s12665-026-13055-4", "authors": "Jing Luo ほか", "venue": "Environmental Earth Sciences", "date": "2026-11-17", "sjr": 0.696, "citescore": 5.4, "citescore_year": "2025", "apa": "Luo, J., Pei, X., Dong, Z., Jin, B., Yan, R., Shi, X., Yang, P., Liu, Z., Duan, Y., Lei, J., & Wang, B. (2026). A preliminary study of runoff-generated waste dump debris flow in the mountain cryosphere. Environmental Earth Sciences, 85(18). https://doi.org/10.1007/s12665-026-13055-4", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "チベット高原の高山域のトンネル残土の堆積で、雪解け水と降雨による集中流が侵食から流路化した土石流を引き起こす過程を、現地調査と水路実験で示した（抄録）。", "p3": "ナムチャバルワ山近くの多雄拉の残土の侵食の特徴を調べ、龍嘉曲流域の地形と水文を考慮して、残土の形を変えた水路実験を行い、水理・力学の分析を行った（抄録）。", "p5": "残土は雪解け水で溝と側方の侵食を受け、降雨で悪化した。流量が増えると侵食溝が広がって流路になり、流路化した土石流が河床を大きく侵食した。勾配が急なほど発生に必要な流量は大きかった。発生は表面の抗力、内部の浸透力、浅い部分の飽和による（抄録）。", "fun": "山奥でトンネルを掘ると大量の土砂が出て、谷に積み上げられる。この研究は、その人工の土の山が、雪解けと雨が重なると土石流になって流れ出す過程を、実験で再現した。人が作った斜面が新しい災害の種になるという指摘と、水が土を押し流す力の内訳を分けて考えた点が面白い。", "unverified": "発生に必要な流量の具体的な数値は抄録からは確認できない。"}}, {"id": "jr38", "rank": 38, "headline": "交通拠点の道路・鉄道振動の伝播を予測する枠組み", "title": "Hybrid prediction framework and propagation mechanisms of coupled road-rail vibrations in large-scale transportation hub complexes", "url": "https://doi.org/10.1016/j.conbuildmat.2026.148892", "authors": "Guangrui Yang ほか", "venue": "Construction and Building Materials", "date": "2026-11-17", "sjr": 2.097, "citescore": 14.2, "citescore_year": "2025", "apa": "Yang, G., Liu, Q., Guo, W., Luo, W., Huang, P., & Zou, C. (2026). Hybrid prediction framework and propagation mechanisms of coupled road-rail vibrations in large-scale transportation hub complexes. Construction and Building Materials, 551, 148892. https://doi.org/10.1016/j.conbuildmat.2026.148892", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、大規模な交通拠点の複合施設で、道路と鉄道の振動が連成して伝わる機構と、その予測の混合的な枠組みを扱う研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "駅と道路と商業施設が一体になった大きな交通拠点では、車と電車の揺れが混ざり合って建物に伝わる。題名からは、二つの揺れがどう重なり、どう伝わるかを調べ、予測する方法を作る研究と読める。複数の揺れの源が重なる場所で、建物の揺れを前もって見積もるという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr39", "rank": 39, "headline": "地下鉄振動と地震を同時に抑える複合支承", "title": "Seismic and Subway-Induced Vibration Dual-Control Performance of Metal Rubber–Polyurethane Composite Bearings for TOD Over-Track Buildings", "url": "https://doi.org/10.3390/buildings16224539", "authors": "Ben Sha ほか", "venue": "Buildings", "date": "2026-11-16", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Sha, B., Ma, J., Wu, Y., & Li, A. (2026). Seismic and Subway-Induced Vibration Dual-Control Performance of Metal Rubber–Polyurethane Composite Bearings for TOD Over-Track Buildings. Buildings, 16(22), 4539. https://doi.org/10.3390/buildings16224539", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "公共交通指向型開発（TOD）の線路上空の建物向けに、地下鉄の振動と地震の両方を抑える金属ゴム・ポリウレタン複合支承を提案し、試験と解析で性能を示した（抄録）。", "p3": "鉛直圧縮と水平の圧縮せん断の試験を複数組行って剛性・強度などを求め、ETABSで典型的な線路上空の多層骨組みのモデルを作り、基礎固定と免震の条件で動的応答を比べた（抄録）。", "p5": "鉛直の振動絶縁では固有周期が0.11秒から0.20〜0.24秒に延び、40〜100 Hzの加速度応答が弱まった。水平の免震では固有周期が0.7秒から1.20〜1.51秒に延び、MR-PU-A2の構成で最下層のX方向の免震率は3つの地震動で67〜74%だった（抄録）。", "fun": "駅や線路の真上にマンションを建てると、地下鉄の細かい揺れが毎日伝わり、地震のときは大きな揺れも受ける。この研究は、金属の細い線を絡めたゴムのような材料と樹脂を組み合わせた支えで、両方の揺れを一つの装置で抑えようとした。揺れの周波数の違いを利用して、二つの役目を兼ねさせる点が面白い。", "unverified": "解析のみで、実建物での計測による検証は抄録からは確認できない。"}}, {"id": "jr40", "rank": 40, "headline": "気候変動と施工欠陥を入れた床版劣化の物理モデル", "title": "Coupled Physics-Based Bridge Deck Condition Assessment Considering Climate Change and Construction Defects", "url": "https://doi.org/10.1061/jbenf2.beeng-8469", "authors": "Jesika Rahman ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-17", "sjr": 1.087, "citescore": 7.2, "citescore_year": "2025", "apa": "Rahman, J., & Billah, A. M. (2027). Coupled Physics-Based Bridge Deck Condition Assessment Considering Climate Change and Construction Defects. Journal of Bridge Engineering, 32(2). https://doi.org/10.1061/jbenf2.beeng-8469", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "鉄筋コンクリート床版の塩害・中性化・凍結融解・交通による疲労と施工欠陥を一つの物理モデルで扱い、気候変動のシナリオによる劣化の差と、かぶり厚さが最も重要なことを示した（抄録）。", "p3": "締固め不良などの施工欠陥と、凍結防止剤の塩分にさらされる程度の空間的なばらつきを2次元の格子で表し、現地のデータで主要な物理指標の予測を検証した（抄録）。", "p5": "主要な指標の予測誤差はおおむね10%未満だった。水セメント比を0.45から0.60にすると今世紀末の鉄筋径の減少が約51%増え、かぶりを80 mmから42 mmに減らすと腐食の開始が29年から5年に早まった。気候シナリオ間でひび割れ幅の予測は最大0.46 mm違った（抄録）。", "fun": "橋の床は、塩、空気中の二酸化炭素、凍ったり溶けたりの繰り返し、車の重みで少しずつ傷んでいく。これまでは原因ごとに別々に計算されることが多かったが、この研究は全部を一つの計算にまとめ、温暖化の進み方による違いまで見積もった。鉄筋を覆うコンクリートの厚さが寿命を大きく左右するという結論が分かりやすい。", "unverified": "検証に使った現地データの橋の数と期間は抄録からは確認できない。"}}, {"id": "jr41", "rank": 41, "headline": "サービス回復と価格の公正さが乗客の忠誠を高める", "title": "Effects of perceived justice and price fairness on passenger loyalty via satisfaction in Indian airlines: do gender and failure severity moderate such relationships?", "url": "https://doi.org/10.1108/tqm-12-2025-0698", "authors": "Akuthota Sankar Rao ほか", "venue": "The TQM Journal", "date": "2026-11-16", "sjr": 0.971, "citescore": 12.8, "citescore_year": "2025", "apa": "Rao, A. S., & Suar, D. (2026). Effects of perceived justice and price fairness on passenger loyalty via satisfaction in Indian airlines: do gender and failure severity moderate such relationships? The TQM Journal, 1–21. https://doi.org/10.1108/tqm-12-2025-0698", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "インドの航空会社で、サービス回復の知覚的公正と価格の公正さが満足を通じて乗客の忠誠を高め、その関係は女性の乗客と失敗の深刻度が低い場合に強いことを示した（抄録）。", "p3": "サービスの失敗と回復の対応を経験した乗客485人のデータを構造方程式モデルで分析し、性別と失敗の深刻度で多群分析を行った（抄録）。", "p5": "知覚的公正と価格の公正さは満足と忠誠を有意に高め、満足が部分的に媒介した。関係は女性の乗客と、失敗の深刻度が低い条件で強かった（抄録）。", "fun": "飛行機の遅れや荷物の紛失のあとの対応が、公平で誠実だと感じられれば、客はまたその会社を選ぶ。この研究は、その効果が失敗の大きさで変わり、大きな失敗では対応の効き目が弱まることを示した。小さな失敗のうちに丁寧に対応することの大切さを、客の気持ちの道筋から示した点が面白い。", "unverified": "調査は自己申告の横断データで、因果は確認できない。効果の大きさの数値は抄録からは確認できない。"}}, {"id": "jr42", "rank": 42, "headline": "接客の支援は関係の質を経て障害のある客の忠誠に", "title": "Building the relational bridge: how frontline social support fosters market inclusion for consumers with disabilities", "url": "https://doi.org/10.1108/jsm-12-2025-0957", "authors": "Abdulkadir Sencan ほか", "venue": "Journal of Services Marketing", "date": "2026-11-17", "sjr": 1.536, "citescore": 9.4, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "障害のある消費者に対する接客従業員の社会的な支援は、関係の質を高めることを通じてのみ再購買と口コミにつながることを示した（抄録）。", "p3": "変革的サービス研究と障害の社会モデルに基づき、トルコの障害のある消費者131人のデータを、SmartPLS 4の2段階の階層成分モデルによるPLS-SEMで分析した（抄録）。", "p5": "社会的支援は関係の質に強い正の効果を持つが、再購買意図や口コミには直接は効かず、関係の質が両方の経路を完全に媒介した。便宜標本で、視覚と肢体の障害のある人が中心である（抄録）。", "fun": "お店の人の親切は、それだけでは常連客を生まない。障害のある客にとっては、親切が積み重なって「この店とは信頼関係がある」と感じたときに初めて、また来よう、人に勧めようという行動につながる。市場への参加を、店員との関係づくりの問題として捉えた点が面白い。", "unverified": "便宜標本・自己申告のデータで一般化に限界がある（著者が明記）。"}}, {"id": "jr43", "rank": 43, "headline": "VRの3D視線計測で街路空間の視覚密度を定量化", "title": "Quantifying Urban Spatial Visual Density by Integrating Real-Scene Reconstruction with Virtual Reality-Based 3-Dimensional Eye-Tracking", "url": "https://doi.org/10.3390/buildings16224550", "authors": "Xinyu Fan ほか", "venue": "Buildings", "date": "2026-11-16", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "実景の3次元再構築とVR内の3次元視線計測を組み合わせ、自由に歩きながら見る都市空間の視覚的な注意から「空間の視覚密度」の指標を作った（抄録）。", "p3": "実景のスキャンで高精度の都市の場面を再構築し、自由歩行のできるVR環境でヘッドマウントディスプレイによる視線計測を行い、視線の計算から行動の指標を作り、瀋陽の時光里街区の屋外部分で実証した（抄録）。", "p5": "3次元の実景再構築と3次元の視線計測の組み合わせで、都市での人の見え方と動きをある程度まねでき、従来の平面的な視線計測実験の不足を補えると報告する（抄録）。", "fun": "街並みの良し悪しを評価するとき、写真を見せて感想を聞く方法では、歩きながら見る本当の体験とずれてしまう。この研究は、実際の街を丸ごとVRの中に再現し、そこを歩く人の視線を立体的に記録した。人がどこに目を向けたかの密度で、空間の「にぎやかさ」を数える発想が面白い。", "unverified": "参加者の人数と、指標の数値的な結果は抄録からは確認できない。"}}, {"id": "jr44", "rank": 44, "headline": "高密度化は見えない立ち退きと住戸の空置を伴う", "title": "Each building tells a story: A New York City neighborhood on the cusp of densification", "url": "https://doi.org/10.1177/00420980261500283", "authors": "Mara Sidney ほか", "venue": "Urban Studies", "date": "2026-11-17", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "マンハッタンのインウッド地区で、ニューヨーク市の再ゾーニングによる高密度化が既存の住宅政策と絡み合い、目に見えない立ち退きや住戸の空き置きなどの矛盾した結果を生むことを示した（抄録）。", "p3": "新しい都市政策の分析の枠組みで、公共政策・不動産記録・日常の観察を組み合わせ、再ゾーニングの戦略と他の住宅政策が交わる4つの場所を事例として調べた（抄録）。", "p5": "高密度化と低密度化が同時に起き、高層ビルのように見える変化の陰で、借家人の立ち退きや住戸を貸さずに置いておく行為が進んでいた。再ゾーニングの採択後も関係者が別の経路で政策の変更を求め、実施が場当たりの政策形成として働いていた（抄録）。", "fun": "街に高いビルを建てやすくする規制緩和は、住宅を増やして家賃を下げる策と説明されることが多い。ところが実際の街を一軒ずつ見ると、目立つ高層化の裏で、住民の追い出しや空き部屋のまま寝かせる動きが起きていた。統計では見えない変化を「建物の物語」から拾う方法が面白い。", "unverified": "4つの事例の選び方と、量的な規模は抄録からは確認できない。"}}, {"id": "jr45", "rank": 45, "headline": "生成AIの受容はジョブ・クラフティングを通じ革新に", "title": "Generative Artificial Intelligence Acceptance and Innovation in Healthcare: Job Crafting and Crisis Leadership", "url": "https://doi.org/10.3390/su182211667", "authors": "Reem M. Mashat ほか", "venue": "Sustainability", "date": "2026-11-16", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "仕事の要求度-資源（JD-R）理論に基づき、サウジアラビアの医療従事者で、生成AIの受容がジョブ・クラフティングを通じて革新的な行動と結びつくことを示した（抄録）。", "p3": "医療従事者250人へのオンライン調査をPLS-SEMで分析し、生成AIの受容・ジョブ・クラフティング・革新的行動の関係と、危機的リーダーシップの調整を調べた（抄録）。", "p5": "生成AIの受容とジョブ・クラフティング、ジョブ・クラフティングと革新的行動はそれぞれ有意に正に関連し、ジョブ・クラフティングが部分的に媒介した。危機的リーダーシップの調整は支持されなかった。実際の生成AIの利用は測っていない（抄録）。", "fun": "生成AIを受け入れた医療従事者は、自分の仕事のやり方を自ら組み替える（ジョブ・クラフティング）傾向があり、それが新しい工夫につながっていた。AIが直接に革新を生むのではなく、働く人が仕事を作り直す主体性を介して効いているという見方が面白い。", "unverified": "横断調査で因果は確認できない。実際の利用量は測定していない（著者が明記）。"}}, {"id": "jr46", "rank": 46, "headline": "負債調達は利益調整を増やしガバナンスが抑える", "title": "The regulating role of governance framework on the association between external financing and accounting manipulation: evidence from an emerging market", "url": "https://doi.org/10.1108/cg-09-2025-0670", "authors": "Mohammad Helal Uddin", "venue": "Corporate Governance", "date": "2026-11-16", "sjr": 0.992, "citescore": 11.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "バングラデシュの上場企業で、負債による資金調達は利益調整を増やし、株式による調達は減らし、コーポレート・ガバナンスが両者の関係を調整することを示した（抄録）。", "p3": "13業種の非金融の上場118社の2011〜2024年の年次報告書のデータで、ガバナンス指数を調整変数とし、発生主義と実体の利益調整のモデルを用いて最小二乗法の重回帰で検証した（抄録）。", "p5": "負債調達への依存が大きい企業ほど利益調整を行いやすく、株式調達は利益調整と有意に負の関係だった。ガバナンスの仕組みは利益調整を有意に減らし、外部資金調達と会計操作の関係を有意に調整した（抄録）。", "fun": "銀行からお金を借りている会社は、返済の条件（財務制限）を守るために決算の数字をよく見せたくなる。株で資金を集める会社は、多くの投資家の目にさらされる。この研究は、お金の集め方の違いが決算の数字の「お化粧」の度合いに表れ、監視の仕組みがそれを抑えることを示した点が分かりやすい。", "unverified": "内生性への対処（調達方法の選択の偏り）は抄録からは確認できない。"}}, {"id": "jr47", "rank": 47, "headline": "高齢者の孤独感は約6割が特性で約4割が状態", "title": "Stability and change in loneliness among older Europeans: a trait-state-occasion analysis of SHARE data.", "url": "https://doi.org/10.1080/13607863.2026.2761596", "authors": "Galiana L ほか", "venue": "Aging & mental health", "date": "2026-11-16", "sjr": 1.207, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "欧州の高齢者の孤独感を特性（安定した個人差）と状態（時期ごとの変動）に分け、約60%が特性的であることと、援助の授受が主に特性の部分と関連することを示した（抄録）。", "p3": "SHAREの3つの波で、UCLA孤独感尺度に特性-状態-時点（TSO）モデルを当てはめ、受けた援助と与えた援助を共変量に加えた（抄録）。", "p5": "特性の成分が潜在分散の約60%、時点の成分が約40%を占めた。受けた援助は特性的な孤独感と正に、与えた援助は負に関連した。時点に固有の成分との関連はおおむね弱く有意でなかったが、2つの例外があった（抄録）。", "fun": "お年寄りの孤独感は、その人の性格のように変わりにくいのか、その時々の出来事で揺れ動くのか。調べると6割は変わりにくい部分だった。しかも、人を助けている人ほど孤独を感じにくく、助けられている人ほど感じやすかった。「助ける側に回ること」が孤独を和らげる可能性を示した点が面白い。", "unverified": "援助の授受と孤独感の因果の向きは抄録からは確認できない。"}}, {"id": "jr48", "rank": 48, "headline": "液状化と流体力の連成下での橋脚の地震応答", "title": "Three-dimensional numerical simulation and seismic response analysis of bridge piers under coupled site liquefaction and hydrodynamic action conditions", "url": "https://doi.org/10.1016/j.oceaneng.2026.129507", "authors": "Yu Chen ほか", "venue": "Ocean Engineering", "date": "2026-11-17", "sjr": 1.524, "citescore": 10.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、地盤の液状化と動水圧（水の流体力）が同時に働く条件で、橋脚の地震応答を3次元の数値シミュレーションで解析する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "川や海に立つ橋脚は、地震のときに足もとの砂地盤が液状化して支えを失い、同時にまわりの水からも押される。題名からは、この二つの効果を一緒に計算して、橋脚がどう揺れるかを調べる研究と読める。別々に考えられがちな地盤と水の影響を重ね合わせるという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "らせん状の地形上のブラウン運動を位相空間で解く", "title": "Chirality-sensitive mobility and dissipation of Brownian motion on a helical landscape", "url": "https://doi.org/10.1063/5.0347035", "authors": "Debankur Bhattacharyya ほか", "venue": "The Journal of Chemical Physics", "date": "2026-11-16", "sjr": 0.877, "citescore": 5.3, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "円筒面に刻まれたらせん状の地形の上を動く慣性を持つ粒子のブラウン運動を、位相空間の線形オルンシュタイン・ウーレンベック過程として定式化し、移動度テンソルなどを閉じた形で導いた（抄録）。", "p3": "調和井戸の近似で、決定論的な運動はらせん方向の自由な伝播とそれに直交する調和振動に分かれる。等方的な減衰ならランジュバン方程式でも分離が保たれるが、軸方向と角度方向で減衰が異なると分離が壊れる。らせん方向の拡散に伴う零モードを射影で除いた安定部分空間で定常ダイナミクスを作り、線形応答を導いた（抄録）。", "p5": "定常の時間相関関数と動的な移動度テンソルを時間・周波数の両領域で閉じた形で得た。非対角の要素は軸方向の力と回転、トルクと軸方向の輸送の交差応答を表し、時間反転対称性と整合して等しい。軸方向と角度方向を同時に駆動すると、らせんの向きによってエネルギー散逸に非対称が生じた（抄録）。", "fun": "ねじのような溝の上を、熱で揺さぶられながら動く小さな粒を考える。押すと回り、回すと進むという「ねじの性質」が、ゆらぎのある世界でどう現れるかを、位置と速度を合わせた空間で厳密に計算した。右ねじと左ねじで熱の出方が違うという結果は、分子の左右の違いを見分ける手がかりにもなりそうで面白い。", "unverified": "数値シミュレーションとの照合の有無は抄録からは確認できない。"}}, {"id": "jr50", "rank": 50, "headline": "CNNとBiLSTMでDEMの間隙率を代理予測", "title": "A sequential deep learning surrogate framework integrating CNN and BiLSTM for DEM-based porosity prediction in heterogeneous granular assemblies", "url": "https://doi.org/10.1007/s10596-026-10485-8", "authors": "Phong Nguyen Thanh ほか", "venue": "Computational Geosciences", "date": "2026-11-16", "sjr": 0.547, "citescore": 5.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、不均質な粒状体の集合の間隙率を、個別要素法（DEM）の代わりにCNNとBiLSTMを組み合わせた逐次の深層学習の代理モデルで予測する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "大きさや形のそろわない粒を詰めたとき、どれくらいすき間ができるかは、粒を一つずつ動かす計算で求められるが時間がかかる。題名からは、画像の特徴をつかむAIと時間の流れを追うAIを組み合わせ、その計算の結果を素早くまねる研究と読める。重い計算をAIで置き換える試みとしての問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "LLMは履歴書の作成と選考・賃金提案で性差を再生産", "title": "Automating inequality? Gender bias in AI-mediated labor markets", "url": "https://doi.org/10.1073/pnas.2534118123", "authors": "Kenza Elass ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "応募者の性別だけを無作為に変えた一連の監査実験で、LLMが性別ステレオタイプに沿った履歴書を生成し、選考の点数と賃金の提案に性別の偏りを示すことを報告する。選考点は職業の性別分離に沿って男性の多い職で女性を不利に、女性の多い職で有利にし、偏りは同じ内容の評価の違いと生成内容の違いの2つの経路で生じる。"}, {"id": "jn02", "rank": 2, "field": "因果推論", "headline": "空き地の緑化の防犯効果は10年後も続く", "title": "Sustainability of violence prevention after a randomized vacant lot greening intervention in Philadelphia: A 10-y follow-up", "url": "https://doi.org/10.1073/pnas.2620725123", "authors": "Nicole Asa ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "2013年にフィラデルフィアで行った空き地の緑化のクラスター無作為化試験を10年追跡し、介入を受けた区画は受けなかった区画より犯罪全体と暴力犯罪の密度が年9%低く（ITT）、緑化が持続した区画では12%・11%低かった（汚染調整ITTによる局所平均処置効果）。介入の10年後も暴力の予防効果が続くと報告する。"}, {"id": "jn03", "rank": 3, "field": "統計学", "headline": "無作為化実験の回帰調整を脱相関で改良", "title": "A decorrelation method for general regression adjustment in randomized experiments", "url": "https://doi.org/10.1093/jrsssb/qkag145", "authors": "Fangzhou Su ほか", "venue": "Journal of the Royal Statistical Society Series B: Statistical Methodology", "date": "2026-11-13", "sjr": 3.734, "citescore": 7.6, "citescore_year": "2025", "why": "設計に基づく枠組みで平均処置効果を一般の関数クラスによる回帰調整で推定する際、標本の再利用による偏りを脱相関という新しい方法で回避し、回帰の一致性を要しない漸近・非漸近の保証、条件付き正規近似、有限標本の被覆保証を示した。高次元・ノンパラメトリックの問題で標本複雑度の改善を示す。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "政治的に遠い銀行どうしは協調融資を組みにくい", "title": "Partisan Banks and Creditor Coordination Within Loan Syndicates", "url": "https://doi.org/10.1111/1475-679x.70097", "authors": "Robert M. Bushman ほか", "venue": "Journal of Accounting Research", "date": "2026-11-17", "sjr": 9.774, "citescore": 13.4, "citescore_year": "2025", "why": "協調融資市場で、主幹事行と参加行の政治的な距離が大きいほど参加の確率と保有割合が下がり、全米の分極化が強い時期に関係が強まることを示した。シンジケート内の政治的多様性は緩いコベナンツと高い金利スプレッドと関連し、再交渉の膠着を避けるため条件付きの統制を手放すトレードオフと解釈する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "責任投資を誓った投信は企業訪問を増やす", "title": "Do Fund Managers’ Commitments to Responsible Investing Affect Private Information Acquisition, Information Environment, and Corporate Sustainability?", "url": "https://doi.org/10.1287/mnsc.2024.08443", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-16", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "国連責任投資原則に署名した投資信託の運用者が、環境・社会の問題に焦点を当てた企業訪問を増やすことを示した。訪問は訪問したファンドの投資価値をほとんど生まないが、アナリスト予想の誤差の低下など銘柄の情報環境を改善し、訪問先企業の持続可能性の実践を高める外部性を持つ。"}, {"id": "jn06", "rank": 6, "field": "気候科学", "headline": "メキシコ湾流の変動が北極経由で黒潮続流に及ぶ", "title": "Kuroshio Extension warming shaped by Gulf Stream variability via the Arctic atmosphere", "url": "https://doi.org/10.1038/s41561-026-02139-2", "authors": "Yoko Yamagami ほか", "venue": "Nature Geoscience", "date": "2026-11-17", "sjr": 6.141, "citescore": 27.3, "citescore_year": "2025", "why": "100年の理想化モデル実験で、メキシコ湾流の変動が黒潮続流の海面水温の内部変動の13%を説明する一方、逆向きの影響は見られないことを示した。湾流の正の海面水温偏差が北半球環状モードに似た大気循環を励起してアリューシャン低気圧を弱め、黒潮続流を北へずらすと報告する。"}, {"id": "jn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "成功は文化の多様さで学びにくく失敗は学びやすい", "title": "The Impacts of Host Culture Heterogeneity on Learning from Success Versus Failure in Foreign Direct Investments", "url": "https://doi.org/10.1111/joms.70178", "authors": "Yuping Zeng ほか", "venue": "Journal of Management Studies", "date": "2026-11-17", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "韓国の多国籍企業の1990〜2016年の海外直接投資のデータで、過去に成功した投資先の文化が多様なほど成功経験の学習効果が弱まり、過去に失敗した投資先の文化が多様なほど失敗経験の学習効果が強まることを示した。後続の投資先が過去の経験と文化的に遠いほど効果が際立つ。"}, {"id": "jn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "将来の仕事上の自己像の鮮明さを初めてメタ分析", "title": "Future work self salience: a meta-analysis", "url": "https://doi.org/10.1108/cdi-04-2026-0288", "authors": "Anne-Kathrin Kleine ほか", "venue": "Career Development International", "date": "2026-11-17", "sjr": 1.386, "citescore": 7.7, "citescore_year": "2025", "why": "69研究（73標本、2万7,045人）の心理測定的メタ分析で、将来の仕事上の自己像の顕著性（FWSS）は積極的性格・将来志向・キャリア適応力・職務成果・ワーク・エンゲイジメント・ウェルビーイングなどと正に関連し、既存の予測変数を超えてキャリア適応力を説明した。キャリア適応力が積極的なキャリア行動への関係を媒介する。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "COP15後に社債で生物多様性リスクへの上乗せ金利", "title": "Biodiversity Risk in the Corporate Bond Market", "url": "https://doi.org/10.1287/mnsc.2024.07660", "authors": "Sevgi Soylemezgil ほか", "venue": "Management Science", "date": "2026-11-16", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "2021年10月の国連生物多様性会議（COP15）以降、米国の社債市場で生物多様性のフットプリントが1標準偏差大きい企業の流通利回りのスプレッドが7%高くなり、それ以前は有意でなかったことを示した。発行市場でも見られ、中期債で強く、気候関連の経路とは区別される。"}, {"id": "jn10", "rank": 10, "field": "心理学・認知科学", "headline": "心の知覚の内部モデルは短期に柔軟で長期に安定", "title": "Short-term flexibility and long-term stability in models of mind perception", "url": "https://doi.org/10.1073/pnas.2625583123", "authors": "Ronja F. Held ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "4つの実験（計256人）で、人・ペット・ロボット・音声アシスタント・道具などに主体性と経験を帰属させる内部モデルを表象類似性分析で調べ、経験の帰属は生物か否かの区別に基づき、主体性の帰属は個人差が大きく情報を受けると範疇全体で更新されることを示した。ロボットやペットとの長期の接触でモデルが組み替わる証拠はなかった。"}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "中国は石炭火力を増やさなくても電力需要を満たせる", "title": "China’s energy transition strategy favoring both coal and renewables: Economic risks and global implications", "url": "https://doi.org/10.1073/pnas.2531538123", "authors": "Xiaoli Zhang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "中国の石炭火力の新設を国内外の社会・経済・気候・地政学の影響から分析する統合的な枠組みを作り、2030年までに再生可能エネルギーを3倍にすれば（中国は達成の見込み）、発電構成と蓄電の計画と合わせて全ての電力需要シナリオを満たし、石炭火力の追加は不要だと示した。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "複数の政府機関との研究開発契約が市場の学習に", "title": "Government‐funded experimentation: How startups use R&D contracts to resolve uncertainty", "url": "https://doi.org/10.1002/sej.70063", "authors": "Larisa Cioaca", "venue": "Strategic Entrepreneurship Journal", "date": "2026-11-16", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "2001〜2018年の米政府の研究開発契約320億ドル分でハイテク新興企業を調べ、契約額（技術の実験）よりも契約した機関の数（市場の実験）がその後の雇用・売上・買収と正に関連することを示し、複数の政府の買い手から市場の機会を学ぶ過程と整合的だとする。"}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "女性リーダーはDXで技術と社会の統合を実践", "title": "Digital Transformation Through a Socio‐Technical Systems Lens: Women Leaders' Approaches to Technological Change and Organizational Dynamics", "url": "https://doi.org/10.1111/ntwe.70058", "authors": "Chanvi Singh ほか", "venue": "New Technology, Work and Employment", "date": "2026-11-17", "sjr": 3.193, "citescore": 13.3, "citescore_year": "2025", "why": "豪州の上級女性リーダー16人への面接の主題分析で、技術と社会の要素を相互に構成するものとして扱い、意思疎通・従業員の参加・人間中心の職務設計・能力開発・継続的な適応で統合を実践していることを示し、心理社会的安全性がシステム水準の条件として現れたと報告する。"}, {"id": "jn14", "rank": 14, "field": "心理学・認知科学", "headline": "同じ種類の曲が呼び起こす自伝的記憶は人どうしで似る", "title": "Music illuminates sociocultural dimensions of autobiographical memory", "url": "https://doi.org/10.1073/pnas.2536885123", "authors": "Cara Turnbull ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "大学生233人が親しんだ曲の短い断片から想起した自伝的記憶の自由記述を自然言語処理で分析し、同じ種類（ジャンル・発売時期）の曲が呼び起こす記憶は聞き手どうしで著しく似ていることを示した。歌詞の語や要約を手がかりにした対照条件では説明できず、社会文化的に共有された筋書きを反映すると論じる。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "身長で見る7000年のユーラシアの生活水準", "title": "Stature reveals changing patterns of the biological standard of living in Europe and Asia over the past 7,000 y", "url": "https://doi.org/10.1073/pnas.2606828123", "authors": "Joerg Baten ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "アジアと欧州の783遺跡から1万8,457件の身長の観測を集め、過去7000年の生物学的生活水準の地域差を比べ、人口密度や技術発展の指標との関係を調べた。西暦500〜1900年に多くの地域で身長が大きく低下したと報告する。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "人気と関与度の異なるインフルエンサーの使い分け", "title": "Advertising by Recruiting Influencers", "url": "https://doi.org/10.1287/mnsc.2024.07919", "authors": "Maya Jalloul ほか", "venue": "Management Science", "date": "2026-11-16", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "新しい体験型商品を出す企業が、人気と関与度の異なる2種類のインフルエンサーと、有償広告・PRの2種類の提携を、初期購入者の口コミによる社会的学習を考慮して選ぶ2期間のモデルを作り、インフルエンサー・マーケティングの設計の課題を分析した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "人気と関与度の異なる2種類のインフルエンサーと、有償広告・PRの2種類の提携を、初期購入者の口コミによる社会的学習を含めて選ぶ2期間のモデルで、インフルエンサー・マーケティングの最適な設計を導いた（抄録）。", "p3": "第1期に企業が品質の不明な体験型の新商品をインフルエンサーの施策とともに出し、第2期に顧客がもとの（異質な）信念、インフルエンサーからの情報、初期購入者の口コミで購入を決めるモデルを解いた（抄録）。", "p5": "顧客がどのインフルエンサーにも同じ確率で従うなら、企業は1種類のインフルエンサーと提携に絞るべきだった。商品が当初過小評価されるときは口コミがインフルエンサー施策を補完し、投資の見返りを高めた。フォロワーとインフルエンサーが同じ階層に属しがちな社会では、種類と提携の組み合わせが最適になりうる（抄録）。", "fun": "新しい体験型の商品を広めるとき、フォロワーの多い有名人と、少数でも熱心なファンを持つ人のどちらに頼むべきか。この研究は、その後に続く一般の人の口コミまで含めて計算した。最初は良さが伝わりにくい商品ほど、口コミがインフルエンサーの効果を後押しするという結果が面白い。", "unverified": "モデルの数値例と実データでの検証の有無は抄録からは確認できない。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "港湾の混乱後に滞留が交互に揺れる「むち打ち」", "title": "Whiplash: Congestion Dissipation in a Disrupted Circulatory Shipping System", "url": "https://doi.org/10.1287/mnsc.2024.05427", "authors": "Ming Hu ほか", "venue": "Management Science", "date": "2026-11-16", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "2つの港の間を船団が往復する循環型のコンテナ輸送で、一方の港の閉鎖が両港に与える影響を過渡状態の流体モデルで分析し、回復までの時間と入港・積出の滞留の動きを解析的に示し、積出の滞留が交互に増減する「むち打ち効果」を見いだした。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "2つの港の間を船団が往復する循環型のコンテナ輸送で、一方の港の閉鎖が両港に入港の滞留と積出の滞留を生み、積出の滞留が港の間で交互に揺れる「むち打ち効果」が起きることを示した（抄録）。", "p3": "過渡状態の流体モデルで、港の閉鎖の開始から通常の運用に戻るまでの回復時間と、回復中の入港・積出の滞留の動きを解析的に特徴づけ、二部や環状のネットワーク、複数回の混乱にも拡張した（抄録）。", "p5": "混乱で船の空間的な分布が偏るため、積出の滞留が港の間で交互に生じる振動的な混雑が現れた。単に船の容量を増やしても回復は早まらないことがあり、港湾当局と海運会社の協調した容量拡大が重要だと示した（抄録）。", "fun": "コロナ禍では港が止まり、世界中で荷物が届かなくなった。この研究は、港が再開しても混雑がすぐには消えず、二つの港の間で行ったり来たりしながら揺れ続けることを数式で示した。船を増やせば解決するとは限らないという結論も、渋滞の直感に反していて面白い。", "unverified": "実際の港湾データとの照合の有無は抄録からは確認できない。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "予測に頼らないマーケティング意思決定を体系化", "title": "Nonpredictive approaches in marketing", "url": "https://doi.org/10.1007/s11747-026-01228-3", "authors": "Masoud Karami ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-17", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "why": "予測データやモデルに頼らず、行動・相互作用・コミットメント・組み替え・実験・想像された方向づけで意思決定の経路を生み修正する「非予測的」なアプローチの研究群を整理し、真に不確実な状況を含む幅広いマーケティングの判断で機能することを論じる。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "予測に頼らずに意思決定を進める「非予測的」なアプローチのマーケティング研究を集めて整理し、分類と今後の研究のための命題を示した（抄録）。", "p3": "将来の状態の事前の推定に頼らず、行動・相互作用・コミットメント・組み替え・実験・想像された方向づけで意思決定の経路を生み修正するアプローチを、マーケティングの文献から棚卸しして統合し、概念の特徴を明確にした（抄録）。", "p5": "非予測的アプローチを区別する分類を作り、将来の研究のための一連の命題を示した。予測が確実な指針にならない本当に不確実な状況を含め、幅広いマーケティングの判断で機能しうると論じる（抄録）。", "fun": "新しい市場に挑むとき、需要を予測してから計画を立てるのが普通だ。だが誰も経験したことのない状況では、予測そのものが当てにならない。この研究は、とりあえず手持ちの資源で動き、人と組み、試しながら道を作っていく考え方を整理した。予測しない意思決定を学問として体系化しようとする点が面白い。", "unverified": "取り上げた研究の数と分類の具体的な内容は抄録からは確認できない。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "アマゾンの自治体単位の規制は私有地の伐採を減らす", "title": "Impact pathways of a jurisdictional approach to slowing deforestation in the Brazilian Amazon", "url": "https://doi.org/10.1073/pnas.2612873123", "authors": "Jill L. Caviglia-Harris ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "ブラジルの2000〜2024年の自治体パネルで、森林減少の多い自治体を監視・取締り・融資制限の対象にする優先リストの効果を、異質性に頑健な差の差法で土地の保有形態別に推定し、減少は農地改革の入植地を含む私有地に集中し、保護区や先住民の土地での増減は見られず、隣接自治体でも減ったと報告する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "ブラジルが森林減少の多い自治体を指定して監視・取締り・融資制限をかける優先リストの効果を土地の保有形態別に推定し、減少は私有地に集中し、他の土地や隣接自治体への転嫁は見られないことを示した（抄録）。", "p3": "法定アマゾンの2000〜2024年の自治体パネルで、優先リストの指定と土地の保有形態別の年間の森林減少を結びつけ、異質性に頑健な差の差法で自治体内と自治体間の効果を推定した（抄録）。", "p5": "農地改革の入植地を含む私有地で大きく有意な減少があった。指定自治体の中で保護区・先住民の土地・未指定の公有地の伐採の増減は見られなかった。隣接自治体でも総森林減少が減り、減少は私有地に集中した（抄録）。", "fun": "森を守る規制をある町にかけると、伐採は隣の町や監視の緩い土地に移るだけではないか、という心配がある。この研究は、ブラジルの「要注意の町リスト」に載った自治体で、伐採が私有地で減り、他の土地にも隣町にも逃げていなかったことを示した。地域ぐるみで責任を負わせる仕組みの効き方が見える点が面白い。", "unverified": "効果の大きさの数値は抄録からは確認できない。"}}, {"id": "jn20", "rank": 20, "field": "環境科学", "headline": "水使用量の頭打ちと経済成長の切り離し", "title": "Peak water: Trends in decoupling regional and global water use", "url": "https://doi.org/10.1073/pnas.2626255123", "authors": "Peter H. Gleick ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "観測・統計データと複数モデルのシミュレーションで「ピーク・ウォーター」と水使用の切り離しの状況を再評価し、人口と経済が成長しても一部の地域・部門で総水使用量が頭打ちになり、減り始めていることを示す。水需要が増え続けるという計画の前提を問い直す。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "人口と経済が成長しても、一部の地域・部門で水の総使用量が頭打ちになり、減り始めていることを観測・統計データと複数モデルのシミュレーションで再評価し、水使用と経済の切り離し（デカップリング）を論じた（抄録）。", "p3": "世界・国・地域の取水量のデータを分析し、過去・現在・将来の需要の推定、観測された減少の要因、今後の水使用の管理とモデル化の戦略を議論した（抄録）。", "p5": "一部で取水のピークに達しつつあり、水資源の使用・経済発展・人間の福祉の相関は切り離しうること、水使用のモデルはそれを反映すべきこと、切り離しには効率化技術と規制による上限などが重要なことを示した（抄録）。", "fun": "人口が増え、経済が大きくなれば、水の使用も増え続けると考えられてきた。ところが実際のデータを見ると、豊かになっても水をあまり使わなくなった国や分野がある。節水の技術や規制の効果だ。資源の使用と豊かさが必ずしも比例しないことを、水という身近な資源で示した点が面白い。", "unverified": "ピークに達した地域・部門の具体的な一覧は抄録からは確認できない。"}}, {"id": "jn21", "rank": 21, "field": "心理学・認知科学", "headline": "文字の獲得が統語を複雑にする普遍的な証拠はない", "title": "No evidence for a universal effect of writing on language use or the evolution of syntax", "url": "https://doi.org/10.1073/pnas.2527946123", "authors": "Carlo Y. Meloni ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "30言語のコーパスで書き言葉と話し言葉の統語の複雑さ（階層の深さと節の数）を比べ、3語族59言語で文字の発達が節の結合の階層の系統的な変化に影響したかをモデル化し、文字が言語の使用と統語の進化に普遍的な効果を持つ証拠は見られなかった。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "文字の獲得が言語の使用と統語の進化で複雑な階層構造を増やすという仮説を、30言語のコーパスと3語族59言語の系統の分析で検証し、効果の証拠は見られないことを示した（抄録）。", "p3": "共時的には書き言葉と話し言葉で文中の階層の深さと節の数を比べ、通時的には文字の発達が節の結合の階層の系統的な変化に影響したかを系統モデルで調べた（抄録）。", "p5": "どちらの分析でも文字の効果はなかった。階層の深さと節の数は話し言葉と書き言葉で差がなく、文字の導入は文法の節の結合の進化に識別可能な影響を与えなかった。1つの語族で、文字の導入後に構造の非対称性の分散が減る弱い証拠があった（抄録）。", "fun": "文字を書くようになると、言葉の文はより複雑に入れ子になる、と多くの人が考えてきた。ところが30の言語の話し言葉と書き言葉、そして文字を持った言語と持たなかった言語の長い歴史を比べると、そんな差は見つからなかった。身近な思い込みを大規模なデータで覆した点が面白い。", "unverified": "コーパスの規模と言語の選び方の詳細は抄録からは確認できない。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "生成AIで申請書が安くなると研究費の配分が歪む", "title": "When Grant Writing Becomes Cheap: Generative Artificial Intelligence and the Efficiency of Agricultural Research Funding", "url": "https://doi.org/10.1111/1477-9552.70102", "authors": "John N. Ng'ombe ほか", "venue": "Journal of Agricultural Economics", "date": "2026-11-17", "sjr": 1.375, "citescore": 9.0, "citescore_year": "2025", "why": "米農務省の農業・食料研究イニシアチブの研究費市場の経済モデルで、生成AIによる申請書作成の費用の低下が限界的な申請を増やし、査読の信号の情報量を弱め、研究の質が同じでも機関の資金上の優位を増幅しうることを示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "生成AIで研究費の申請書の作成費用が下がると、限界的な申請が増え、査読の信号の情報量が弱まり、研究の質が同じでも機関の資金上の優位が増幅しうることを、米農務省の研究費市場のモデルで示した（抄録）。", "p3": "米農務省の農業・食料研究イニシアチブ（AFRI）の研究費市場の経済モデルをAIなしの基準から作り、AIの利用が研究者の質と無相関な場合と相関する場合の2つのシナリオを分析し、較正して数値を求めた（抄録）。", "p5": "質の高い研究者ほど使わない補償的な採用は信号の劣化を深め、採用と質の相関が約0.10を超えないと情報量は基準より改善しなかった。一律の高い採用で申請数は18.0%増え、7割が強いAI支援を受ける場合は申請数が6.2%増え、採択された研究の平均の質が3.5%下がった（抄録）。", "fun": "AIで研究費の申請書を簡単に書けるようになると、誰もが立派な書類を出せるようになる。すると審査員は書類の出来で研究の良し悪しを見分けにくくなり、もともと有利な大学がさらに有利になりうる。便利な道具が選抜の仕組みを静かに変えてしまう点を示したのが面白い。", "unverified": "モデルの較正に使ったデータの詳細は抄録からは確認できない。"}}, {"id": "jn23", "rank": 23, "field": "工学", "headline": "クウェートの環状道路交差点の立体化を30年で評価", "title": "Grade Separation Versus Reversible Median Lanes at a Saturated Urban Ring Road Junction in a Hot-Arid Gulf City: A Calibrated Microsimulation and Life-Cycle Appraisal for Kuwait’s Fourth Ring Road", "url": "https://doi.org/10.3390/infrastructures11110424", "authors": "Abdulaziz Aldawish ほか", "venue": "Infrastructures", "date": "2026-11-17", "citescore": 5.7, "citescore_year": "2025", "why": "クウェート第4環状道路の交差点を、実測の飽和交通流率で較正したSUMOの微視的シミュレーションで再現し、9つの改良案を需要の増加と排出を含めて30年の評価にかけ、立体交差の案で平均遅れが60.0秒から12.3秒に減ることを示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "クウェート第4環状道路の渋滞した交差点で、9つの改良案を較正した微視的交通シミュレーションと30年の評価で比べ、立体交差の案が遅れと排出を大きく減らすことを示した（抄録）。", "p3": "右左折の交通量と実測の飽和交通流率（車線あたり毎時2,056乗用車換算台、再現誤差0.4%以内）からSUMOのモデルを作り、信号制御・流入部の拡幅・立体交差・222 mのリバーシブル中央車線などを、現在・+25%・+50%の需要で排出を含めて30年評価した（抄録）。", "p5": "立体交差の案は平均遅れを60.0秒から12.3秒に減らし、サービス水準をEからCに上げ、CO2排出を19%減らしたが、費用便益比は1.6で需要が伸びる場合のみ1を超えた。感応制御と拡幅の組み合わせは遅れを25%減らし費用便益比6、リバーシブル車線は効果がなかった（抄録）。", "fun": "渋滞する交差点を直すには、高架橋で立体交差にするのが一番効くが、お金もかかる。この研究は、交差点をコンピュータの中に再現して9つの案を比べ、信号の賢い制御と少しの拡幅が費用の割に最もよく効くことを示した。車線を増やしても信号がボトルネックなら効かないという結果も分かりやすい。", "unverified": "費用の見積もりの前提は抄録からは確認できない。"}}, {"id": "jn24", "rank": 24, "field": "工学", "headline": "立体駐車場の床版をFEMとANNで即時評価", "title": "Hybrid FEM–ANN Framework for Immediate Structural Response Prediction and Fatigue-Informed Maintenance Planning of Reinforced Concrete Flat-Slab Car Parks in Hot-Arid Cities: A Khartoum Case Study", "url": "https://doi.org/10.3390/infrastructures11110422", "authors": "Elkhider B. E. Mohamed ほか", "venue": "Infrastructures", "date": "2026-11-16", "citescore": 5.7, "citescore_year": "2025", "why": "高温乾燥地の鉄筋コンクリートのフラットスラブ駐車場で、ETABS/SAFEの基準解、独立した規準照査、2,400のラテン超方格標本で学習したANN、中性化と疲労のモンテカルロ信頼性解析を組み合わせた4段階の枠組みを示し、ANNが試験データでR² 0.991〜0.997を得たと報告する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "高温乾燥地の鉄筋コンクリートのフラットスラブの立体駐車場で、有限要素の基準解・独立の規準照査・ANNの代理モデル・中性化と疲労の信頼性解析を組み合わせ、即時の応答予測と維持管理の計画を行う枠組みを示した（抄録）。", "p3": "440台の地上4層の駐車場で、ETABS/SAFEの基準解、Timoshenko解で検証した差分の板の解法による照査、2,400のラテン超方格標本で学習したANN（9-12-8-3）、4万回のモンテカルロ信頼性解析を組み合わせた（抄録）。", "p5": "ドロップパネルは押抜きせん断の利用率を0.589倍にし、過大応力の52の接合部をなくした。ANNは試験データでR² 0.991〜0.997、評価は約0.3 µsだった。交通の疲労だけの損傷は小さく（100年の中央値0.0024）、かぶり25 mmでは鉄筋の不動態の消失がβ=1.3で15年に起きた（抄録）。", "fun": "立体駐車場の床は、何度も通る車の重さと、空気中の二酸化炭素でじわじわ傷む。この研究は、精密な計算をAIに覚えさせて一瞬で答えを出せるようにし、さらに何万通りもの条件で壊れる確率を見積もった。車の重さそのものより、鉄筋のさびの方が寿命を決めるという結果が分かりやすい。", "unverified": "実構造物での計測による検証の有無は抄録からは確認できない。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "デジタル実験で成功からは学び失敗からは学ばない", "title": "Learning from success but not from failure in digital experimentation", "url": "https://doi.org/10.1016/j.respol.2026.105626", "authors": "Berk Deniz ほか", "venue": "Research Policy", "date": "2026-11-17", "citescore": 17.6, "citescore_year": "2025", "why": "題名から、デジタルの実験（A/Bテストなど）で企業が成功の結果からは学ぶが、失敗の結果からは学ばないことを示す研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、デジタル上の実験（A/Bテストなど）で、企業が成功の結果からは学ぶが失敗の結果からは学ばないことを示す研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ウェブサイトの改良では、二つの案を見比べる実験が繰り返される。うまくいった案は採用され、その経験は次に生かされる。では、うまくいかなかった実験からは何かを学んでいるのか。題名からは、企業が失敗の結果を学びに生かせていない可能性を問う研究と読める。失敗から学ぶ難しさという問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}, {"id": "jn26", "rank": 26, "field": "経営学", "headline": "無形資産が生産性の測定を誤らせるJカーブ", "title": "Unveiling the J-curve: How intangibles drive productivity mismeasurement", "url": "https://doi.org/10.1016/j.respol.2026.105663", "authors": "Gert Bijnens ほか", "venue": "Research Policy", "date": "2026-11-17", "citescore": 17.6, "citescore_year": "2025", "why": "題名から、無形資産への投資が生産性の測定の誤りを生むJカーブを実証的に明らかにする研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、無形資産への投資が生産性の測定を誤らせる「Jカーブ」を明らかにする研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "新しい技術に投資すると、使いこなすための教育や仕組みづくり（無形資産）にお金と時間がかかり、統計上の生産性はいったん下がって見え、後から上がる。この形がアルファベットのJに似ているのでJカーブと呼ばれる。題名からは、この見かけの落ち込みと回復を実証的に示す研究と読める。数字の見え方の罠という問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}, {"id": "jn27", "rank": 27, "field": "経済学", "headline": "失職後の所得損失の異質性を機械学習で解明", "title": "Understanding the Heterogeneity of Earnings Losses After Job Displacement: A Machine Learning Approach", "url": "https://doi.org/10.1086/744969", "authors": "Andreas Gulyas ほか", "venue": "Journal of Labor Economics", "date": "2026-11-16", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "題名から、解雇・失職の後の所得損失が人によってどう異なるかを機械学習で調べる研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、解雇・失職の後の所得の損失が人によってどう異なるかを、機械学習を用いて調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "会社の倒産や人員削減で職を失うと、再就職しても給料が長く下がったままになることが知られている。ただ、その打撃の大きさは人によって大きく違うはずだ。題名からは、機械学習を使って、どんな人がどれだけ損をするのかを細かく描き出す研究と読める。平均の陰に隠れた違いを探る問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}, {"id": "jn28", "rank": 28, "field": "経済学", "headline": "コロナの封鎖と在宅勤務の持続という新しい均衡", "title": "A new equilibrium: COVID-19 lockdowns and WFH persistence", "url": "https://doi.org/10.1086/744975", "authors": "Laura Ketter ほか", "venue": "Journal of Labor Economics", "date": "2026-11-16", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "オーストラリアの縦断データで、ロックダウンが強かった3州の事務職と影響の小さい州の似た労働者を差の差法で比べ、封鎖を経験した労働者の在宅勤務は2023年まで43%（週0.5日）高い水準で続き、封鎖の強さと単調な用量反応関係があったと報告する。雇用主のオフィス縮小とリモート職の募集、従業員の郊外への転居と自宅への投資という双方の調整が持続を支えた。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "COVID-19のロックダウンが在宅勤務の導入と持続を生んだことを、オーストラリアの州の間の差の差法で示し、封鎖された州の労働者の在宅勤務は2023年まで43%高い水準で続いたと報告した（抄録）。", "p3": "豊富な縦断データを使い、強く封鎖された3つの州の事務職の労働者を、影響の小さい州の似た労働者と差の差法で比べた（抄録）。", "p5": "封鎖された労働者は2023年まで在宅勤務が43%高く（週0.5日）、封鎖の強さとの用量反応関係は単調だった。持続は双方の調整による。雇用主はオフィスを縮小しリモート・ハイブリッドの職を開き、従業員は都心から離れて住み、自宅のオフィスや機器に投資した（抄録）。", "fun": "コロナの外出制限は一時的な出来事だったのに、在宅勤務はその後も続いた。この研究は、制限が厳しかった州ほど、数年たっても在宅勤務が多く残っていることを示した。会社はオフィスを手放し、社員は郊外へ引っ越したので、元に戻る理由がなくなったのだ。一時的な出来事が新しい「当たり前」を作る仕組みが面白い。", "unverified": "データの出所（調査名）と標本の大きさは抄録からは確認できない。"}}, {"id": "jn29", "rank": 29, "field": "経済学", "headline": "TFPから賃金への波及は企業や人で異なる", "title": "Heterogeneous Passthrough from TFP to Wages", "url": "https://doi.org/10.1086/744972", "authors": "Mons Chan ほか", "venue": "Journal of Labor Economics", "date": "2026-11-16", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "デンマークの雇用主-従業員の結合データで、企業のTFPが1標準偏差上がると年収が平均3.0%上がり、企業の生産性ショックの賃金への波及は従来の推計よりかなり大きいことを示した。波及は転職者で大きく、所得水準・年齢・産業・企業の生産性で大きく異なり、推定した所得過程をライフサイクルのモデルに入れて厚生と分配への影響を評価する。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "デンマークの雇用主-従業員の結合データで、企業の生産性ショックの賃金への波及は従来の推計よりかなり大きく、労働者の属性で大きく異なることを示した（抄録）。", "p3": "継続して働く労働者と転職者を分けて分析し、選択を補正し、細かな集団ごとの波及を調べた。後半では企業ショックと波及の特徴を捉える所得の確率過程を推定し、不完備市場のライフサイクル消費・貯蓄モデルに組み込んで厚生と分配への影響を評価した（抄録）。", "p5": "企業のTFPが1標準偏差上がると年収は平均3.0%（平均的な労働者で約1,500ドル）上がった。転職者の賃金上昇への効果は同じ企業に残る人より大きく、所得水準・年齢・産業・企業の生産性で波及は大きく異なった（抄録）。", "fun": "会社がもうかるようになったとき、その分は社員の給料にどれだけ回るのか。デンマークの全国規模のデータで調べると、これまで考えられていたよりずっと多く回っていた。しかも会社に残った人より、転職した人の方が影響を強く受けていた。会社の運が働く人の人生にどう伝わるかを測った点が面白い。", "unverified": "厚生分析の結果の数値は抄録からは確認できない。"}}, {"id": "jn30", "rank": 30, "field": "経済学", "headline": "移民による地域の押し出しと労働市場への影響", "title": "Immigration, Local Crowd-Out and Labor Market Effects", "url": "https://doi.org/10.1086/744974", "authors": "Michael Amior", "venue": "Journal of Labor Economics", "date": "2026-11-16", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "題名から、移民の流入による地域での押し出し効果と労働市場への影響を調べる研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、移民の流入が地域で他の人々を押し出す効果（クラウドアウト）と、労働市場への影響を調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ある町に移民が増えると、もともと住んでいた人や、来るはずだった人が別の町へ移ることがある。そうなると、移民の影響を町ごとに比べるだけでは、効果を見誤るかもしれない。題名からは、この「押し出し」を考えに入れて労働市場への影響を測り直す研究と読める。比べ方そのものを問う点が面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}, {"id": "jn31", "rank": 31, "field": "経済学", "headline": "求人紹介と病気休暇の戦略的な利用の構造推定", "title": "Structural Empirical Analysis of Vacancy Referrals with Imperfect Monitoring and the Strategic Use of Sickness Absence", "url": "https://doi.org/10.1086/744968", "authors": "Gerard J. van den Berg ほか", "venue": "Journal of Labor Economics", "date": "2026-11-16", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "ドイツの社会保障の行政記録と担当者の記録を結びつけ、公共職業安定所の求人紹介、紹介を断ったときの制裁、制裁を避けるための戦略的な病欠の届け出を含む求職行動を構造推定した。失業者の約25%で、戦略的な病欠の経路をなくすと平均の失業期間が4日短くなると推定し、医療制度の側面が失業期間に影響することを示す。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "公共職業安定所による求人紹介が失業者の求職行動に果たす役割を、紹介の拒否への制裁と、それを避けるための戦略的な病欠の届け出を含めて構造推定した（抄録）。", "p3": "ドイツの社会保障の行政記録と、担当者が記録した求人紹介・病欠の届け出・制裁のデータを結びつけてモデルを推定した（抄録）。", "p5": "医療制度の側面が失業期間に影響することを示した。失業者の約25%について、戦略的な病欠の届け出の経路をなくすと、平均の失業期間が4日短くなると推定した（抄録）。", "fun": "失業手当を受けていると、紹介された仕事を断ったときに手当を減らされることがある。そこで病気だと届けて紹介を避ける人もいる。この研究は、そうした「戦略的な病欠」が失業をどれだけ長引かせているかを、行政の記録から推定した。医療と雇用の制度がつながって人の行動を左右する点が面白い。", "unverified": "モデルの構造と推定の詳細は抄録からは確認できない。"}}, {"id": "jn32", "rank": 32, "field": "経済学", "headline": "出産の長期所得効果の推定値の食い違いを整理", "title": "Reconciling Estimates of the Long-Term Earnings Effect of Fertility", "url": "https://doi.org/10.1086/744979", "authors": "Simon Bensnes ほか", "venue": "Journal of Labor Economics", "date": "2026-11-16", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "子どもが母親とパートナーの所得差に与える長期の影響（チャイルド・ペナルティ）について、イベントスタディと操作変数を組み合わせた推定量を提案した。どの方法も11〜18%の大きなペナルティを示すが、イベントスタディが全てを母親に帰するのに対し、新しい推定では母親の反応は約4分の1で、女性が所得の伸びが鈍る時期に出産することがイベントスタディの過大推定を生むと論じる。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録（IZAディスカッションペーパー版の記載）を使用。本文は未取得", "preprint": false, "short": true, "p1": "子どもが母親とパートナーの所得差に与える長期の影響（チャイルド・ペナルティ）について、イベントスタディと操作変数の推定値の食い違いを整理し、両者を組み合わせた新しい推定量を提案した（抄録）。", "p3": "標準的なイベントスタディと操作変数の推定量の要素を組み合わせた推定量を作って両者の関係を示し、外部の情報でイベントスタディの仮定の妥当性を評価し、処置の時期の選択による偏りを特徴づけた（抄録）。", "p5": "3つの方法はいずれも11〜18%の大きなペナルティを推定したが、イベントスタディは全てを母親に帰する一方、新しい結果では母親の反応は約4分の1だった。女性は所得の伸びが鈍る時期に出産する傾向があり、イベントスタディは女性のペナルティを過大に推定する（抄録）。", "fun": "子どもが生まれると母親の収入が下がる「チャイルド・ペナルティ」はよく知られている。だが、その差は母親が減るからなのか、父親が増えるからなのかで、政策の答えが変わる。この研究は、出産の時期を女性自身が選んでいることが推定を偏らせていると指摘した。前提となる比較の仕方を問い直した点が面白い。", "unverified": "抄録はディスカッションペーパー版の記載で、掲載版との違いは確認していない。対象国とデータは抄録からは確認できない。"}}, {"id": "jn33", "rank": 33, "field": "機械学習", "headline": "効率的で拡張可能な高密度3D追跡", "title": "Efficient and Scalable Dense 3D Tracking", "url": "https://doi.org/10.1109/tpami.2026.3754004", "authors": "Tuan Duc Ngo ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-16", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "単眼の動画から高密度の3次元の動きを推定するDELTAと高速版DELTAv2を示し、対数深度の表現、粗から細への段階的な追跡、学習可能な補間、効率的な4次元相関ブロックで、CVO・Kubric3D・TAP-Vid3Dで最先端の精度を得つつ、従来の高密度3次元の手法より最大100倍速くした。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "単眼の動画から高密度の3次元の動きを推定するDELTAと、その高速版DELTAv2を示し、最先端の精度で大幅な高速化を達成した（抄録）。", "p3": "大域と局所の結合注意と対数深度の表現で、深度の絶対差ではなく変化率を予測する。初期の反復では疎な軌跡だけを追い徐々に密にする粗から細への追跡、追跡しなかった動きを復元する学習可能な補間、GPUで効率的な4次元相関ブロックを導入した（抄録）。", "p5": "CVO、Kubric3D、TAP-Vid3Dのベンチマークで最先端の精度を得て、基礎のモデルより5倍、従来の高密度3次元の手法より最大100倍速かった（抄録）。", "fun": "普通のカメラ1台で撮った動画から、画面の全ての点が奥行き方向も含めてどう動いたかを推定するのは難しい。この研究は、最初は少しの点だけを追い、だんだん点を増やしていく工夫で、計算を最大100倍速くした。まず大まかに、次に細かく、という人の作業の進め方にも似ていて面白い。", "unverified": "実時間での動作の可否と使用したGPUは抄録からは確認できない。"}}, {"id": "jn34", "rank": 34, "field": "機械学習", "headline": "AUCと生成的再構成を統一する表現学習", "title": "When AUC Meets Generative Reconstruction: A Unified Principle for Balanced Visual Representation Learning", "url": "https://doi.org/10.1109/tpami.2026.3754040", "authors": "Boyu Han ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-16", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "視覚表現の学習で、生成的な再構成を一致・不一致の対の順位づけ（AUCの最適化）として捉え直すAUCGRと部分AUC版を提案し、対照学習と再構成の目的の衝突を避けた。既存の枠組みに構造を変えずに差し込め、30を超える視覚のベンチマークとマルチモーダルLLMで識別の精度と細かな知覚の表現がともに向上したと報告する。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "視覚表現の学習で、生成的な再構成をROC曲線の下の面積（AUC）を最適化する識別的な順位づけの問題として捉え直し、対照学習と再構成の目的の衝突を避けるAUCGRを提案した（抄録）。", "p3": "一致する対の再構成が不一致の対より高い得点になるようAUCを最適化し、信頼できる特徴の部分空間で不一致の比較に絞る部分AUC版（pAUCGR）も示した。既存の生成的再構成の枠組みに構造を変えず差し込める（抄録）。", "p5": "AUC・部分AUCの最適化との理論的な対応と汎化の保証を示し、多様なCLIPの構造、30を超える視覚のベンチマーク、生成の骨格、マルチモーダルLLMで、識別の精度と細かな知覚の表現の両方が向上したと報告する（抄録）。", "fun": "画像を見分けるAIの学習には、「似たものは近く、違うものは遠く」と教える方法と、「元の画像を描き直させる」方法がある。二つを足し合わせると互いに邪魔をしがちだった。この研究は、描き直しの良し悪しを「正しい組み合わせの方が上位に来るか」という順位の問題に置き換えて、両者を調和させた点が面白い。", "unverified": "ベンチマークごとの改善の大きさは抄録からは確認できない。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "特徴と幾何の整合を使う教師なし点群位置合わせ", "title": "INTEGER ++ : Scalable Unsupervised Point Cloud Registration via Mining and Transferring Feature-Geometry Coherence", "url": "https://doi.org/10.1109/tpami.2026.3754044", "authors": "Kezheng Xiong ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-16", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "合成データからのメタ初期化、特徴と幾何の整合に基づく擬似ラベルの教師-生徒学習、密度不変の特徴学習を組み合わせた教師なしの点群の位置合わせINTEGER++を提案し、構造の異なる3つの位置合わせのモデルで、屋外では最先端の性能、屋内でも競争的な性能を示した。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "教師なしの点群の位置合わせで、合成データからのメタ初期化と、特徴と幾何の整合を使う擬似ラベルの教師-生徒学習を組み合わせたINTEGER++を提案し、屋外で最先端の性能を示した（抄録）。", "p3": "合成の点群の対と、対応点の水準での合成から実データへの特徴の整合で頑健な初期値を作り（MARS）、高水準の特徴と低水準の幾何の手がかりを統合して信頼できる擬似ラベルを作り（FGCM）、密度不変の特徴学習（MDS）と擬似ラベルの雑音への対策を加え、点群の距離を徐々に広げるカリキュラムで学習した（抄録）。", "p5": "構造の異なる3つの代表的な位置合わせのモデルで、屋外の位置合わせで最先端の性能を示し、複雑なモデルへの拡張性と、屋内のベンチマークでの競争力も確認した（抄録）。", "fun": "別々の位置から撮った3次元の点の集まりを、ぴったり重ね合わせるのが点群の位置合わせだ。正解の重ね方を人が教えなくても学べるよう、この研究は「見た目の特徴」と「形の幾何」が一致する組み合わせを手がかりに、AIが自分で答えを作って学ぶ仕組みを作った。答えのない問題で自習する工夫が面白い。", "unverified": "屋外ベンチマークの具体的な数値は抄録からは確認できない。"}}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "領域と境界を意識した注意で配置指定の画像生成", "title": "Zero-Shot Grounded Text-to-Image Generation With Remixed Region and Boundary Aware Attention Guidance", "url": "https://doi.org/10.1109/tpami.2026.3754154", "authors": "Jiayu Xiao ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-16", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "テキストからの画像生成で、追加学習なしに複数の物体を指定どおりに配置するため、領域の反融合制約、境界を強調したマスク、自己較正の親和性整列を組み合わせた注意の誘導Remixed R&Bを提案し、既存の学習なしの方法を空間の精度と意味の忠実さで上回り、複雑な構図では一部の学習ありのモデルも上回ったと報告する。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "テキストからの画像生成で、追加学習なしに複数の物体の配置を指定どおりに生成するため、領域と境界を意識した注意の誘導を組み合わせたRemixed R&Bを提案した（抄録）。", "p3": "前景の物体どうしの意味の混ざりを防ぐ領域の反融合制約、箱の周縁に勾配の圧力を保つ境界を強調したマスク、拡散モデルの特徴の局所的な自己類似で物体の形を回復する自己較正の親和性整列の3つを導入した（抄録）。", "p5": "複数のベンチマークで、既存の学習なしの方法を空間の精度と意味の忠実さの両方で大きく上回り、複雑な構図では一部の学習ありのモデルも上回った。既存の配置からの画像生成の枠組みに差し込んで性能を高められる（抄録）。", "fun": "「左に犬、右に猫」と指示して画像を作らせると、犬と猫が混ざった生き物ができたり、片方が消えたりする。この研究は、AIが絵を描く途中で「この場所はこの物体の担当」と注意の向け方を整え、物体どうしが混ざらないようにした。追加の学習なしで描き方だけを導く点が面白い。", "unverified": "比較した手法と評価指標の具体的な数値は抄録からは確認できない。"}}, {"id": "jn37", "rank": 37, "field": "工学", "headline": "高速列車荷重下の補強鋼床版の疲労", "title": "Fatigue investigation on UHPFRC-enhanced OSBD with truss-braced diaphragms under high-speed train loads", "url": "https://doi.org/10.1016/j.tws.2026.116015", "authors": "Dingkun Sun ほか", "venue": "Thin-Walled Structures", "date": "2026-11-17", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "why": "題名から、UHPFRCで補強しトラス状の横隔壁を持つ直交異方性鋼床版の、高速列車荷重による疲労を調べる研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、超高性能繊維補強コンクリート（UHPFRC）で補強し、トラス状の横隔壁を持つ直交異方性鋼床版の、高速列車荷重による疲労を調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "鋼の板を格子状に組んだ橋の床（鋼床版）は軽くて強いが、繰り返しの重さで溶接部に疲労のひびが入りやすい。題名からは、上に高性能のコンクリートを重ね、内部の補強の形も工夫して、高速列車が何度も通る重さに耐えられるかを調べる研究と読める。疲れに強い橋の床をどう作るかという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jn38", "rank": 38, "field": "工学", "headline": "プレキャストのサイロ屋根の実大試験と膜理論のずれ", "title": "Vertical load-bearing mechanism of precast concrete squat silo roofs: Full-scale test, numerical simulation and theoretical deviation from membrane theory", "url": "https://doi.org/10.1016/j.engstruct.2026.124115", "authors": "Rui Pang ほか", "venue": "Engineering Structures", "date": "2026-11-17", "citescore": 12.0, "citescore_year": "2025", "why": "題名から、扁平なプレキャスト・コンクリートのサイロ屋根の鉛直荷重の伝達機構を実大試験と数値解析で調べ、膜理論からのずれを論じる研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、扁平なプレキャスト・コンクリートのサイロ屋根の鉛直荷重の伝達機構を、実大試験・数値シミュレーション・膜理論からのずれの理論的な検討で調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "穀物などをためるサイロの屋根は、薄い殻（シェル）として、曲げではなく面内の力（膜の力）で重さを支えると考えて設計されることが多い。題名からは、工場で作った部材を組み立てた低い屋根では、その考え方がどれだけ外れるかを実物大の試験で確かめる研究と読める。教科書の理論と現実のずれを測る問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jn39", "rank": 39, "field": "工学", "headline": "集中質量と柔な境界を持つ板の非線形振動と分岐", "title": "Complex nonlinear dynamics and bifurcation mechanisms of gravity-loaded plates with attached concentrated masses and compliant boundaries", "url": "https://doi.org/10.1016/j.tws.2026.116000", "authors": "Xiubing Yu ほか", "venue": "Thin-Walled Structures", "date": "2026-11-17", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "why": "題名から、重力を受け集中質量と柔な境界を持つ板の複雑な非線形動力学と分岐の機構を調べる研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、重力を受け、集中質量が取り付けられ、柔な境界条件を持つ板の、複雑な非線形動力学と分岐の機構を調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "機械や装置を載せた薄い板は、揺らすと単純な揺れから急に複雑な揺れに変わることがある（分岐）。題名からは、板の重さ、載せた物の重さ、端の支え方の柔らかさが重なったとき、どのように揺れ方が枝分かれするかを調べる研究と読める。小さな条件の違いで揺れの性格が一変する仕組みを探る問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jn40", "rank": 40, "field": "工学", "headline": "ガストフロント状の流れでの低層建物の屋根風荷重", "title": "Assessing roof wind loads on low-rise buildings under gust-front-like flows using ABL wind tunnel simulation", "url": "https://doi.org/10.1016/j.engstruct.2026.124114", "authors": "Mu'ath Al-Makhadmeh ほか", "venue": "Engineering Structures", "date": "2026-11-16", "citescore": 12.0, "citescore_year": "2025", "why": "従来の大気境界層風洞で再現した定常のガストフロント状の流れの中に、平面が同じで高さの異なる低層建物の模型を置いて7つの風向で試験し、屋根の風圧係数をASCE/SEI 7の通常の風の規定と比べ、現行の規定はガストフロントの風の評価におおむね十分であると結論した（題名検索で見つかったSSRN版の抄録による）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、題名検索で見つかった同じ論文のSSRN版の抄録（Crossref）を使用。本文は未取得", "preprint": false, "short": true, "p1": "ダウンバーストに伴うガストフロントのような流れが低層建物の屋根に与える風荷重を、従来の大気境界層風洞で再現した定常の流れで実験的に評価し、現行の規準がおおむね妥当であることを示した（抄録）。", "p3": "平面が同じ（60 m×60 m）で高さの異なる（10 mと20 m）2つの建物模型を1:400の縮尺で、高速の流出流の中に置き、7つの風向で試験し、屋根の風圧係数をASCE/SEI 7の通常の風に対する設計規定と比べた（抄録）。", "p5": "建物の高さと向きが風圧の分布と大きさに与える影響を調べ、現行の規定はガストフロントの風が低層建物に与える影響の評価におおむね十分であると結論した（抄録）。", "fun": "積乱雲から冷たい空気が一気に吹き下ろし、地面に当たって広がる突風（ダウンバースト）は、普通の風とは吹き方が違う。この研究は、その突風を風洞の中で再現し、工場や倉庫のような低い建物の屋根にかかる力を測った。今の設計の決まりでおおむね足りるという結論は、安心材料として面白い。", "unverified": "抄録は題名検索で見つけたSSRN版のもので、掲載版との違いは確認していない。風圧係数の具体的な数値は抄録からは確認できない。"}}, {"id": "jn41", "rank": 41, "field": "工学", "headline": "インパルス応答を埋め込んだ神経ブラインド逆畳み込み", "title": "Physics-embedded Neural Blind Deconvolution: Impulse response-embedded filtering module for weak fault feature extraction under harmonic interference", "url": "https://doi.org/10.1016/j.jsv.2026.120264", "authors": "Jinoh Yoo ほか", "venue": "Journal of Sound and Vibration", "date": "2026-11-17", "citescore": 10.2, "citescore_year": "2025", "why": "題名から、インパルス応答を組み込んだフィルタを持つ神経ブラインド逆畳み込みで、調和成分の干渉下の微弱な故障特徴を抽出する手法と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、インパルス応答を組み込んだフィルタのモジュールを持つ物理埋め込み型の神経ブラインド逆畳み込みで、調和成分の干渉のもとで微弱な故障の特徴を抽出する手法と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "回転する機械の軸受けに小さな傷があると、回るたびに小さな衝撃が出る。だが歯車などの規則正しい振動に埋もれて見えにくい。題名からは、衝撃の形（インパルス応答）を知識としてAIに組み込み、混ざった振動から傷の信号だけを取り出す方法と読める。物理の知識でAIの目を鍛える問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jn42", "rank": 42, "field": "工学", "headline": "機械をまたぐ故障診断を因果の分離で頑健に", "title": "A fine-grained causal disentanglement framework for robust domain generalization in cross-machine fault diagnosis", "url": "https://doi.org/10.1016/j.ymssp.2026.115196", "authors": "Jihong Yan ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-17", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "題名から、細かな因果の分離によって異なる機械の間で領域汎化する頑健な故障診断を行う枠組みと読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、異なる機械の間で故障診断のモデルを使い回す（領域汎化）ため、故障に関わる要因とそれ以外の要因を細かく因果的に切り分ける枠組みを提案する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ある工場のモーターで学んだ故障診断のAIを、別の工場の別のモーターに使うと、うまく当たらないことが多い。機械ごとの癖と、故障そのものの特徴が混ざって学ばれてしまうからだ。題名からは、両者を因果の考え方で切り分け、どの機械でも通用する特徴だけを残そうとする研究と読める。問いの立て方が面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jn43", "rank": 43, "field": "工学", "headline": "共振型イナータ吸振器の背景柔性を陽に補正", "title": "Explicit background flexibility correction for a resonant inerter vibration absorber", "url": "https://doi.org/10.1016/j.jsv.2026.120260", "authors": "Steen Krenk", "venue": "Journal of Sound and Vibration", "date": "2026-11-17", "citescore": 10.2, "citescore_year": "2025", "why": "イナータとダンパの並列結合をばねと直列につないだ共振型の吸振器について、吸振器を固定したときの固有振動数で局所の柔性を表し、それを吸振器のばねと合わせた等価なばねとして扱う、きわめて簡単な陽的な較正の手順を示した。例題で加速度応答を最適化し、高次のモードにもそのまま使えることを示す。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "イナータとダンパを並列に結び、ばねと直列につないだ共振型の吸振器について、対象以外のモードの影響（背景の柔性）を陽に補正する、きわめて簡単な較正の手順を示した（抄録）。", "p3": "局所の柔性を、吸振器を固定したときに選んだ系の固有振動数で決まるばねで表し、それを吸振器のばね要素と合わせた等価なばね剛性として扱い、最後に実際の装置の剛性を取り出す（抄録）。", "p5": "例題で、この吸振器が加速度応答を最適化し、高次のモードにもそのまま適用できることを示した（抄録）。", "fun": "揺れを吸い取る装置（吸振器）は、狙ったモードの揺れだけを考えて調整されがちだが、実際の構造には他     "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
