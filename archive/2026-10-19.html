<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-19", "intro": "プレプリントの新着538件、学術誌の新着734件（うち上位10%誌505件）、重要論文の候補64件から選びました。プレプリント・関連32報、プレプリント・注目29報、論文誌・関連38報、論文誌・注目8報、オープンデータ19件です。週末明けで候補が少なく、良い候補が足りない部は件数を減らしました。Hugging Face Daily Papers は取得できず、arXivの新着も今回の候補に含まれていません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "CWTと振動でCFST柱の局所損傷を特定", "title": "Experimental and Numerical Investigation of Modal Feature-Informed Damage Characterization of Concrete-Filled Steel Tubes", "url": "https://doi.org/10.2139/ssrn.7629204", "authors": "Adel Younesi ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Younesi, A., & Rezaifar, O. (2026). Experimental and Numerical Investigation of Modal Feature-Informed Damage Characterization of Concrete-Filled Steel Tubes. https://doi.org/10.2139/ssrn.7629204", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "コンクリート充填鋼管（CFST）柱の局所損傷について、健全時の基準データなしに、振動モードの連続ウェーブレット変換（CWT）から損傷の位置・長さと程度を推定できる枠組みを示した（抄録）。", "p2": "局所損傷は柱の耐力と靭性を大きく下げるが、既設・補強済みの部材では健全時の計測が残っていないことが多く、基準データを要する従来の振動ベース同定は使いにくい（抄録）。", "p3": "入力は損傷のある柱の振動計測（モード形と固有振動数）、出力は損傷位置・長さと損傷比。モード形をCWTにかけると、形のわずかな折れ曲がりが係数の局所的な山として現れるため、位置が分かる。界面剥離では、損傷面積と健全断面積の比を損傷指標とし、剥離寸法と固有振動数から指標を求める関係式を作った（抄録）。", "p4": "5体の試験体の実験と、検証済みの有限要素モデルで、位置・長さの同定精度と損傷比の推定を評価した。コンクリート強度の違いが損傷-振動数関係に与える影響も調べている（抄録）。", "p5": "柱軸方向の損傷位置と長さを正確に同定でき、ウェーブレット係数は損傷の重さと直接関係した。係数を柱に沿って平均して式に入れると損傷比が求まり、コンクリート強度を含む最終式を提案した（抄録）。誤差の数値は抄録に記載がない。", "p6": "対象は一般的な局所損傷の場面に限られる（抄録）。解釈：実構造物の計測ノイズや境界条件のばらつきの下で、細かいモード形をどこまで取得できるかが残る疑問である。", "fun": "縄跳びの縄の途中に小さな結び目があると、回したときの形がその場所だけわずかに崩れる。この研究は柱の揺れの形を「ウェーブレット」という虫めがねで調べ、その崩れを見つけて傷の場所と大きさを当てる。壊れる前の記録がなくても使えるのがミソ。", "unverified": "同定誤差の数値と、試験体の損傷の種類・寸法は本文未入手のため未確認。"}}, {"id": "pr02", "rank": 2, "headline": "Bouc-Wen同定の非一意性は感度不足から", "title": "Insensitivity-induced potential non-uniqueness in system identification of Bouc-Wen models", "url": "https://doi.org/10.2139/ssrn.7625986", "authors": "Adrita Kundu ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Kundu, A., & Mukhopadhyay, S. (2026). Insensitivity-induced potential non-uniqueness in system identification of Bouc-Wen models. https://doi.org/10.2139/ssrn.7625986", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "履歴型のBouc-Wen（BW）モデルの同定で、真の値から大きく外れた別の母数の組でもほぼ同じ応答と損傷評価を再現してしまう理由を、解析的に示した（抄録）。", "p2": "BW母数は計測データごとに推定値がばらつき、誤った値でも応答がよく合うため、推定の正しさを応答の一致で確かめられない。解析的な識別可能性の条件を満たしても起きる点が問題だった（抄録）。", "p3": "履歴復元力の変形に対する変化率（接線剛性に当たる量）の式を導き、その変化率がほぼ変わらないような母数の組が存在することを示した。直観：応答を決めるのは個々の母数ではなく変化率の形なので、母数が互いに打ち消し合えば応答は同じに見える（抄録）。", "p4": "1自由度と4自由度の非線形履歴系に、正弦波、El Centro地震動、Kanai-Tajimiスペクトルに適合する地震動群を入力して比較した。非弾性応答（C_R）スペクトルとPark-Ang損傷指標で一致度を見ており、フレッティング摩耗のある摩擦接触接合部で実験検証も行った（抄録）。", "p5": "真の母数から大きくずれた代替の組でも、履歴挙動・応答・C_Rスペクトル・損傷指標がよく一致した。真の母数が大きすぎる・小さすぎるときにずれはさらに大きくなり、代替母数の範囲は入力が引き起こす履歴の程度にも依存した（抄録）。", "p6": "結論はBWの母数が応答に鈍感であることに起因し、同定手法を問わず起こりうるとする（抄録）。解釈：識別性を改善する入力設計や事前情報の与え方は、抄録の範囲では示されていない。", "fun": "「2＋8」も「4＋6」も答えは10になるように、ばねの硬さや粘り具合を表す数の組み合わせが違っても、揺れ方がほとんど同じになることがある。だから揺れの記録だけから「本当の数」を当てるのは難しい、という落とし穴を式で明らかにしている。", "unverified": "代替母数の偏差の具体的な大きさと、実験の条件は本文未入手のため未確認。"}}, {"id": "pr03", "rank": 3, "headline": "領域制限Green核逆解析で氷荷重を高解像度化", "title": "Domain-restricted Green-kernel inversion for high-resolution ice-load identification", "url": "https://doi.org/10.2139/ssrn.7629491", "authors": "Jiming Luo ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Luo, J., Yuan, Y., & Tang, W. (2026). Domain-restricted Green-kernel inversion for high-resolution ice-load identification. https://doi.org/10.2139/ssrn.7629491", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "船体のひずみ計測から局所の氷荷重を推定するとき、先に荷重のかかる候補領域を絞ってから逆解析することで、細かい区画でも荷重の位置と時刻歴を正しく配分できる手法（DR-GKI）を示した（抄録）。", "p2": "区画を細かくすると未知の荷重時刻歴が増え、異なる区画が似たひずみ応答を出すため、従来のGreen核逆解析（GKI）は荷重を誤った区画に割り振る（抄録）。", "p3": "入力は24点のひずみ時刻歴、出力は各区画の荷重時刻歴。まず記録全体・多周波数のType-II推論（周辺尤度による推論）で荷重の候補領域を特定し、その領域に制限してPicard条件に導かれたLSQRで逆解析する。直観：解の候補を物理的にありうる範囲に絞ると、似た応答による取り違えが減る（抄録）。", "p4": "4領域の参照問題と、候補区画28・ひずみ計測点24の高解像度有限要素モデルで、単一区画の加振、移動荷重、5%の計測ノイズを加えた3つの衝突由来の荷重パターンを評価した。指標は荷重ピークの誤差、支持域外への荷重力積、作用区間の平均荷重誤差（抄録）。", "p5": "同じ単一区画加振で従来GKIはピーク荷重を最大77.0%過小評価した。移動荷重では支持域外の正の力積が全体の30.5%から0.132%に減り、5%ノイズ下の平均荷重誤差は68.7〜88.3%減った（抄録）。", "p6": "検証は数値モデルによるもので、実船計測での評価は抄録に記載がない。解釈：候補領域の推定を誤った場合の影響が残る疑問である。", "fun": "太鼓のどこを叩いたかを、周りに付けたいくつかのセンサの揺れだけから当てるのは、叩く場所の候補が多いほど難しい。この研究は、まず「だいたいこの辺」と範囲を絞ってから細かく計算することで、取り違えを大幅に減らした。推理の手順を工夫した点が面白い。", "unverified": "DR-GKIの計算量と、候補領域推定の失敗例は本文未入手のため未確認。"}}, {"id": "pr04", "rank": 4, "headline": "ChatGPT後の10-KでAI記述は象徴化した", "title": "AI Washing and AI Warnings after ChatGPT: Symbolic Technology Disclosure in U.S. 10-K Filings, 2018–2024", "url": "https://doi.org/10.2139/ssrn.7629810", "authors": "Jihwan Woo", "venue": "SSRN", "date": "2026-10-18", "apa": "Woo, J. (2026). AI Washing and AI Warnings after ChatGPT: Symbolic Technology Disclosure in U.S. 10-K Filings, 2018–2024. https://doi.org/10.2139/ssrn.7629810", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ChatGPTの公開後、米国10-KのAI記述は中身のない「化粧的」な記述と警告が中心になり、その変化の大半は新たにAIに言及し始めた企業によることを示した（抄録）。", "p2": "AIの能力についての主張は外部から検証できないため、開示の実質を測るには記述そのものを読むしかない。公開ショックで開示が変わったのが既存の言及企業か新規参入企業かも不明だった（抄録）。", "p3": "2018〜2024年の4,141企業年の10-Kに含まれる2万文以上のAI関連文を、LLMで「実質的・願望的・化粧的」と「自社のAIの主張か警告か」に分類した。全文のラベルを保存し、3社のモデルのアンサンブル（1社は分類器と共通）で検証している。変化は厳密な分解で既存企業と参入企業の寄与に分けた（抄録）。", "p4": "比較の軸は時点（公開前後）と業種（技術・非技術）で、非技術から技術を引いた差が公開後にどれだけ参入で説明されるかを見る（抄録）。", "p5": "平均的な提出企業のAI記述の58%が化粧的で、2018〜2022年は44%、2024年は75%だった。公開後の差の87%は参入で説明され、主に非技術でR&Dを報告しない1,110社が初めてAIに言及し、その文は79%が化粧的、64%が警告だった。全AI文に占める警告の割合は7%から47%に上がった（抄録）。", "p6": "分類器と検証モデルの1社が共通で、検証の独立性は限定的である（抄録）。解釈：化粧的という判定の妥当性を人手でどの程度確かめたかは、抄録からは分からない。", "fun": "流行の言葉を書けば立派に見えるが、中身があるとは限らない。ChatGPTの登場後、AIと無縁だった会社までが報告書にAIを書き始め、その多くは「AIでこんなことができる」ではなく「AIはリスクです」という決まり文句だった。言葉の流行の広がり方を数で追っている点が面白い。", "unverified": "人手による分類の検証の有無と一致率は本文未入手のため未確認。"}}, {"id": "pr05", "rank": 5, "headline": "S&P500のAIリスク開示は統制より警告先行", "title": "Warnings Without Controls? Tracking AI Risk Disclosure in S&P 500 10-K Filings", "url": "https://doi.org/10.2139/ssrn.7625440", "authors": "Duy Nguyen ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Nguyen, D., Tenakwah, E. J., & da Silva, C. (2026). Warnings Without Controls? Tracking AI Risk Disclosure in S&P 500 10-K Filings. https://doi.org/10.2139/ssrn.7625440", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "S&P 500企業の10-Kのリスク要因欄で、AIは社内統制で管理するシステムとしてではなく、外部からの脅威と規制対応の負担として書かれるようになったことを示した（抄録）。", "p2": "AIが組織の意思決定に入り込む一方、株主などが企業のAI統制を知る手段は主に法定のリスク開示に限られ、その中身の変化は体系的に追われていなかった（抄録）。", "p3": "2020〜2025年の2,903件の10-KのItem 1Aから、AI語とガバナンス語が共起する文を前後2文の文脈つきで抽出し、BAAI/bge-large-en-v1.5で埋め込み、BERTopicで話題に分類した。企業はNAICS産業のAI採用の強さで高・中・低に分けた（抄録）。", "p4": "比較の軸は提出年と産業のAI採用の強さで、AIリスク開示の有無、抽出文の数、話題の数と構成の推移を見る。著者は予備的な証拠と位置づけている（抄録）。", "p5": "AIリスクを開示する企業は2020年の10%未満から2024年に63.6%、2025年に約4分の3に増え、抽出文は48から876に、話題は3から21に増えた。戦略投資・市場競争の話題は52%から5%に下がり、サイバーセキュリティ・第三者対策と法規制対応が中心になった（抄録）。", "p6": "著者自身が予備的な証拠としている（抄録）。解釈：共起語による抽出は統制の記述を取りこぼしうるため、抽出の再現率は残る疑問である。", "fun": "会社の年次報告書の「リスク」の欄を6年分読み比べると、AIの話題は「これで稼ぐ」から「サイバー攻撃や法律が心配」へと大きく変わっていた。AIを自分で手綱を握る道具ではなく、外から降ってくる嵐のように書いている、という読み取りが面白い。", "unverified": "抽出精度の評価と産業別の数値は本文未入手のため未確認。"}}, {"id": "pr06", "rank": 6, "headline": "片面ひずみと少数変位で変形を再構成", "title": "An Improved Single-Sided Inverse Finite Element Method Constrained by Sparse Displacement Measurements", "url": "https://doi.org/10.2139/ssrn.7629492", "authors": "YAN Hongsheng ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Hongsheng, Y., Yulin, S., Shuaiqun, G., & Hongfu, Z. (2026). An Improved Single-Sided Inverse Finite Element Method Constrained by Sparse Displacement Measurements. https://doi.org/10.2139/ssrn.7629492", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "片面のひずみと、少数の節点の変位だけから、境界条件を仮定せずに構造の全体変形を再構成できる逆有限要素法（EI-S-iQS4）を示した（抄録）。", "p2": "標準のiFEMは両面のひずみと既知の境界条件を必要とし、片面版は規則的な薄肉構造や塔でしか検証されていなかった（抄録）。", "p3": "入力は片面の表面ひずみと少数の基準節点の変位、出力は全域の変位場。基準変位を罰則係数なしの厳密な最小二乗制約として消去で課し、剛体モードを抑えて理想的な境界条件への依存をなくす。可解性の条件は、基準の自由度がどの剛体モードでも消えないこと（抄録）。", "p4": "補剛箱桁で、全域の全変位の正規化二乗平均誤差（NRMSE）を、境界条件を与えた場合・与えない場合と、同じ点での放射基底関数補間と比べた。さらに板要素の25%だけにひずみを置く疎な配置と、学習時にない荷重でも評価した（抄録）。", "p5": "NRMSEは境界条件ありで2.48%、なしで2.47%、同じ点の放射基底関数補間では6.94%だった。25%の疎な配置では1.42%と、未知の荷重で3.19%だった（抄録）。精度は片面ひずみと疎な変位の組み合わせから来るとしている。", "p6": "検証は線形弾性・静的荷重に限られる（抄録）。解釈：動的荷重や非線形挙動、計測ノイズの下での精度は残る疑問である。", "fun": "風船の表面の一部にだけシールを貼って伸び具合を測り、数か所の位置だけ分かれば、風船全体がどう膨らんだかを再現できる、という発想に近い。全部を測らなくても、物理の法則でつなげば見えない部分まで埋められる点が面白い。", "unverified": "計測ノイズを加えたときの精度は抄録に記載がなく未確認。"}}, {"id": "pr07", "rank": 7, "headline": "水中浮体トンネルの密集振動数域の渦励振", "title": "Research on spatiotemporal properties of vortex-induced vibrations in dense-frequency region of submerged floating tunnel", "url": "https://doi.org/10.2139/ssrn.7629497", "authors": "Yujie Li, Zhuang-peng Yi, Shen&apos ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Li, Y., Yi, Z.-p., Wang, S., Yan, D.-h., & Pan, Q. (2026). Research on spatiotemporal properties of vortex-induced vibrations in dense-frequency region of submerged floating tunnel. https://doi.org/10.2139/ssrn.7629497", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "係留式の水中浮体トンネルで、固有振動数が密集した領域の多モード渦励振（VIV）が、振動数の近さに応じてどう異なる時空間パターンを示すかを解析モデルで整理した（抄録）。", "p2": "水中浮体トンネルは流れの中で渦励振を起こしやすい柔らかい構造で、近接した固有振動数をもつ複数モードが同時に励起されると、応答の予測が難しくなる（抄録）。", "p3": "管を一連のEuler-Bernoulli梁の区間に分け、中間・境界の弾性支持を考慮して部分構造から全体の方程式を組み立てた。一様流中の流体-構造連成はウェイク振動子、流体力はMorison式で表す。振動数の近さを「近接度指標」で測り、非常に近い・近い・密集域外の通常の3領域に分けた（抄録）。", "p4": "支持剛性の組を変えて、各領域で多モードVIVの応答範囲、スパン方向の振幅包絡線の形、振幅-流速曲線を数値計算で比べた（抄録）。実験との比較は抄録に記載がない。", "p5": "非常に近い振動数では応答範囲が重なりうるが振動は単一モードが支配的で、振幅包絡線はスパン中央に対称だった。近い振動数では最初の2モードが励起されて包絡線は非対称になり、2つの振動数の差が大きいほど振幅-流速曲線の分離領域は右へ移った。遷移領域では異なる振動数の多周波応答が、分離領域では隣り合う2モードがほぼ同じ卓越振動数で振動した（抄録）。", "p6": "一様流と解析モデルに基づく数値結果であり（抄録）、解釈：せん断流や実験・現地計測での検証は今後の課題と考えられる。", "fun": "海の中に浮かべたトンネルは、流れが後ろに作る渦に揺さぶられる。しかも揺れやすいリズムがいくつも近くに並んでいると、どのリズムで揺れるかが入れ替わる。リズム同士の近さで揺れ方の地図が描けることを示した点が面白い。", "unverified": "モデルの具体的な寸法・剛性値と振幅の数値は本文未入手のため未確認。"}}, {"id": "pr08", "rank": 8, "headline": "R&D資産化率が高いほど実体的利益調整は減る", "title": "R&D Expenditure Capitalization, Choice of Earnings Management Methods, and the Tax Burden: Evidence from Chinese A-Share Listed Firms, 2016–2024", "url": "https://doi.org/10.5281/zenodo.23450204", "authors": "XIANG ほか", "venue": "Zenodo", "date": "2026-10-18", "apa": "XIANG, Z., & LIU, Y. (2026). R&D Expenditure Capitalization, Choice of Earnings Management Methods, and the Tax Burden: Evidence from Chinese A-Share Listed Firms, 2016–2024. Zenodo. https://doi.org/10.5281/ZENODO.23450204", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodo掲載の中国語PDFの本文（研究設計、表3〜表10の結果、結論と限界の節）を読んだ", "preprint": true, "p1": "中国A株企業で、研究開発費の資産計上（資本化）の比率が高い企業ほど、実体的な利益調整が少なく、資本化が実体活動の操作の代わりになっていることを示した（抄録、§5）。", "p2": "資本化か費用化かの選択は当期利益と当期税負担の両方に効く利益調整の手段だが、それが他の利益調整（会計発生高による調整と実体的調整）とどう代替・補完し、税負担がどう関わるかは十分に検証されていなかった（§1）。", "p3": "2016〜2024年のCSMARデータで、発生高型の利益調整（DA）は21,947企業年、実体的利益調整（REM）は21,878企業年を用いた（§3.1）。REMは異常生産コスト・異常営業キャッシュフロー・異常裁量費用から合成し、資本化率を説明変数として産業・年の固定効果つきで回帰した。税負担は有効税率の中央値で分けた（§3）。直観：資本化で帳簿上の利益を作れるなら、生産や費用を操作して利益を作る必要が減る。", "p4": "資本化企業と非資本化企業の平均差の検定（表3）、資本化率5区分の平均（表4）、基準回帰（表5）、有効税率への影響（表6）、税負担の調整（表7）、REMの分項分解（表8）、頑健性（表9）、高新技術企業・所有形態別の異質性（表10）を見る。", "p5": "制御変数と固定効果を入れた資本化率のREMへの係数は−0.0944〜−0.0969（表5）で、1標準偏差の上昇でREMは約0.0153下がり、REMの標準偏差の7.1%に当たる。DAは有意な変化がない。資本化は有効税率を上げ（係数0.0165、高新技術企業0.0319、表6）、抑制効果は高税負担群（−0.1149）で低税負担群（−0.0611）より強いが、連続交互項（−0.0099）は有意でない（表7）。非国有企業で係数−0.1559と強い（表10）。", "p6": "著者は、研究開発費の開示の質に依存すること、識別は主に企業間の横断的な差によっており企業固定効果を入れると符号が反転すること、有効税率では税務計画の細かな差を捉えられないことを限界に挙げる（§6）。解釈：符号反転は因果解釈に大きな留保を付ける。", "fun": "研究開発に使ったお金を「今年の費用」にすると利益が減り、「将来の資産」にすると利益が増える。どちらを選ぶかで見た目の成績を整えられるなら、わざわざ在庫を作りすぎるような手荒な方法は要らなくなる。帳簿の上の選択が、現実の会社の動きまで変えているかもしれない、という点が面白い。", "unverified": "表9の頑健性検定の個々の数値は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "ネット取引の多さは個人データ提供の同意を意味しない", "title": "Does Participation Signal Consent? Online Commerce and Willingness to Trade Personal Data for Benefits Across 27 Countries", "url": "https://doi.org/10.2139/ssrn.7625436", "authors": "alp par", "venue": "SSRN", "date": "2026-10-17", "apa": "par, a. (2026). Does Participation Signal Consent? Online Commerce and Willingness to Trade Personal Data for Benefits Across 27 Countries. https://doi.org/10.2139/ssrn.7625436", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ネット取引に参加していることは、割引などと引き換えに個人データを提供することへの同意のシグナルとしては弱いことを、27か国の調査で示した（抄録）。", "p2": "同意の設計やデータ活用型マーケティングは、利用者がデジタル市場に参加していること自体を、付随するデータ交換の受け入れとみなしがちである。プライバシー・パラドックスの研究も、参加が特定の交換の受容をどれだけ表すかは示してこなかった（抄録）。", "p3": "国際社会調査プログラム（ISSP）2024年デジタル社会モジュール（27か国、N = 44,703）で、オンライン取引の頻度と、割引・無料品と引き換えの個人情報提供の受容を対応させた。受容者と非受容者をどれだけ見分けられるかを、国内のROC曲線下面積（AUC）で測った（抄録）。", "p4": "比較対象は、監視や技術への態度で受容を予測した場合の判別力で、参加がそれより情報を持つかを見る。分析は横断的・探索的と明記されている（抄録）。", "p5": "受容は取引を全くしない人の6.0%から、非常によくする人の17.3%へ上がったが、どの頻度でも拒否が多数だった。頻繁な取引者の65.7%が拒否し、24か国で拒否が多数、受容が拒否を上回る国はなかった。判別力は国内平均AUC = 0.585で、態度変数と同程度にとどまり、ネット取引が普及した国ほど低かった（抄録）。", "p6": "横断的・探索的な分析で因果は示さない（抄録）。解釈：設問が一般的な受容を尋ねており、個別の場面での行動とずれる可能性が残る。", "fun": "毎日ネットで買い物をしている人なら、ポイントと引き換えに個人情報を渡すのもOKだろう、と企業は考えがち。でも実際は、買い物をよくする人の3人に2人が「いやだ」と答えていた。使っていることと、納得していることは別物だという点がはっきり数字に出ている。", "unverified": "国別の受容率の一覧は本文未入手のため未確認。"}}, {"id": "pr10", "rank": 10, "headline": "接着剤の硬化がBOTDAひずみ信号に与える影響", "title": "Effect of Adhesive Curing on Distributed BOTDA Signals of FRP Composite Bridges for Strain Monitoring", "url": "https://doi.org/10.2139/ssrn.7625472", "authors": "Amirhossein Madadi ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Madadi, A., Abazarsa, M., Wu, R., Wang, X., & Yu, T. (2026). Effect of Adhesive Curing on Distributed BOTDA Signals of FRP Composite Bridges for Strain Monitoring. https://doi.org/10.2139/ssrn.7625472", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "FRP複合材の橋桁に分布光ファイバ（BOTDA）を接着したとき、エポキシの硬化そのものが計測経路に沿って一様でない残留ひずみを生むことを、実橋のデータで示した（抄録）。", "p2": "分布センシング用の布（センシング・テキスタイル）は大面積に光ファイバを敷設しやすいが、設置後の接着剤の硬化がひずみ信号にどう影響するかは明らかでなく、荷重による応答と区別されていなかった（抄録）。", "p3": "米メイン州Grist Mill橋のFRP桁で、二液性エポキシの未硬化時（2020年10月6日）と硬化後（同11月3日）にBOTDAを計測した。接着していないファイバ区間を現地の温度参照として温度成分を除き、2つの接着部のひずみ分布の差を、硬化と接着の発達による設置後の残留ひずみ場とみなした（抄録）。", "p4": "比較の基準として、分布荷重下で期待される滑らかな放物線状のひずみ分布を単純支持梁モデルで与えた（抄録）。", "p5": "変化は一様なずれではなく経路に沿って変動し、硬化収縮、局所的な拘束、接着層厚のばらつき、ファイバ経路の形状、布-エポキシ-FRP間のひずみ伝達の複合効果と整合した（抄録）。桁の剛性をBOTDAデータから求める前に、設置由来の残留ひずみを荷重応答から補正する必要があるとする。", "p6": "橋1か所・2時点の比較である（抄録）。解釈：残留ひずみの各要因の寄与を分離する定量的な方法は、抄録の範囲では示されていない。", "fun": "体重計に乗る前に針がずれていたら、正しい体重は分からない。橋に貼った光ファイバのセンサも、貼るための接着剤が固まるときに縮んで、何も載っていないのに「ひずんでいる」と示してしまう。そのずれが場所ごとに違うことを実物で確かめた点が大事。", "unverified": "残留ひずみの大きさの数値は抄録に記載がなく未確認。"}}, {"id": "pr11", "rank": 11, "headline": "複数AIの相互批評で回答の質を段階審査", "title": "A Tiered Peer-Critique Architecture for AI Answers", "url": "https://doi.org/10.5281/zenodo.23444219", "authors": "Lott, George W.", "venue": "Zenodo", "date": "2026-10-18", "apa": "Lott, G. W. (2026). A Tiered Peer-Critique Architecture for AI Answers (Version 1.3). Zenodo. https://doi.org/10.5281/ZENODO.23444219", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Zenodo掲載の作業論文v1.3の本文（設計の節、先行研究との対比、第1・第2パイロットの結果表と自己評価の節）を読んだ", "preprint": true, "p1": "複数社のAIモデルを階層別のパネルにして互いに批評させ、答えを書かない「ハブ」が検証可能なチェックを課してから回答を出す設計を提案し、事前登録したパイロットで自ら検証した。結果は設計の優位を示さなかった（抄録、パイロットの節）。", "p2": "単一のモデルはすべてに強いわけではなく、自分の弱点も分からない。多モデルの合議や討論は製品化・研究化されているが、「招集したあと、回答が出てよい条件」をどう決めるかは定まっていなかった（序論）。", "p3": "パネルが依頼を分解し、部分に入札し、席の匿名性の下で証拠つきで互いの草稿に異議を出し、合意まで改訂する。ハブは質問の予算内で問いただし、コードの実行・出典の解決・数値の再計算を強制する。出す条件は、合意・未解決の質問なし・チェック合格。誤りの記録（カタログ）を次の質問に生かす（設計の節）。", "p4": "計算量をそろえた単一の最先端モデルと比べ、「パネルが費用に見合う」「ハブが価値を足す」の2つの事前登録検定を置いた。第1パイロットは64課題、第2はより難しい104課題（コード・データ・論理・数学・複合課題）で、95%区間はWilsonまたはブートストラップ（パイロットの節）。", "p5": "第1パイロットでは回答した項目はすべて正解で条件の差は出なかった。第2ではハブつきパネルが最先端モデルの1回答より4.8ポイント低く（[−10.6, +1.0]）、ハブなしより1.0ポイント低かった。4部構成の複合課題で−17.9ポイント（[−32.1, −3.6]）と損失が集中し、ハブ役のモデル単独の方がパネルより高かった。どちらの検定も通らなかった（第2パイロットの節）。", "p6": "著者は、104課題では6〜8ポイント未満の差を検出できない検出力不足、予算で決めた標本規模、カタログが簡略版でしか試されていないことを認める。数十倍のトークンを使い、安くも速くもないとも明記する（自己評価の節）。", "fun": "「三人寄れば文殊の知恵」をAIで試したら、少なくともこの実験では、優秀な一人の方が成績が良かった。しかも、答えを直す過程で一度は正しくなった部分が後の修正でまた壊れることもあった。自分の提案がうまくいかなかった記録を正直に並べている点が、研究の姿勢として面白い。", "unverified": "課題ごとの全条件の表の数値は一部のみ確認した。"}}, {"id": "pr12", "rank": 12, "headline": "データセンター誘致で費用負担が郡ごとに逆転", "title": "Governing the Demand Shock: Data Centers, Local Power, and the Distribution of Cost in Virginia", "url": "https://doi.org/10.5281/zenodo.23452201", "authors": "Turner, Tommy N.", "venue": "Zenodo", "date": "2026-10-18", "apa": "Turner, T. N. (2026). Governing the Demand Shock: Data Centers, Local Power, and the Distribution of Cost in Virginia (Version 1.2). Zenodo. https://doi.org/10.5281/ZENODO.23452201", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Zenodo掲載の書籍版PDF（約55,800語）のうち、要旨、目次、第5章（交渉力の減価）、第12章冒頭（自然実験）を読んだ。事例章の大半は未読", "preprint": true, "p1": "米バージニア州でデータセンター誘致の費用を誰が負担するかが郡ごとに逆転した理由を、産業の到来に対する制度改革のタイミングと「減価していく交渉力」という一つの機構で説明した本（要旨、第5章）。", "p2": "資本集約的で雇用が少なく、電力・水を大量に使う土地利用が地方の審査の適応より速く来ると、同じ州補助・同じ電力会社の下でも、ある郡は誘致を断り、別の郡は公聴会なしで30年固定の税率を契約するなど、正反対の結果が生まれた（要旨）。", "p3": "郡の記録に基づく事例比較。核の主張は、地域の交渉力は何も承認していない時点で最大で、用途地域の変更、権利の付与、税率の契約といった約束のたびに減っていく、というもの（第5章）。例：ある郡では委員会の消極姿勢が強まるにつれ、開発者の現金提供が約9万ドルから約2,100万ドルへ膨らんだ（第5章）。事例は事後改革・事前拒否・契約固定・統治の取り込み・条例による事前付与の5つの姿勢に分類される（要旨）。", "p4": "根拠はメクレンバーグ郡の15年間の監査と、同じ時期・同じ開発者・同じ補助にさらされた5つの自治体を比べるフレデリックスバーグ地域の「自然実験」（第12章）。5自治体は2018年に機器への税率を100ドル当たり1.25ドルにそろえる地域協定を結んでいた（第12章）。", "p5": "同じ法的権限を持つ2つの郡が対照的な費用配分になったのは権限ではなくタイミングの差で、一方は価格を知る前に交渉力を使い果たし、他方は交渉力があるうちに条件を決めたと論じる（第5章）。フォール・ライン地域で公表容量のある承認済み8キャンパスの合計は5,457 MWで、これは下限値とされる（第12章、図9）。", "p6": "証拠は2026年6月12日時点のスナップショットで、審査のない個人の著作である（要旨）。解釈：比較は記述的な事例分析で、「自然実験」も統計的な因果推定ではない点に留意が要る。", "fun": "お店で値切るなら、買うと決める前が一番強い。いったん「買います」と言えば、もう値段は動かせない。この本は、町が巨大なデータセンターを迎えるときも同じで、許可を出すたびに交渉の切り札を一枚ずつ失っていく、と説明する。身近な買い物の知恵で行政の差を読み解く点が面白い。", "unverified": "第7〜11章の各事例の詳細と数値は読んでおらず未確認。"}}, {"id": "pr13", "rank": 13, "headline": "縦補剛材で鋼I桁の破壊モードが切り替わる", "title": "Failure-mode switching in longitudinally stiffened slender steel I-girders: experiments and simulations", "url": "https://doi.org/10.2139/ssrn.7629408", "authors": "Shady Gomaa ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Gomaa, S., Elbelasi, M., Elsisi, A., Matar, E., El-Hossieny, O., Ishac, I., & Nawar, M. T. (2026). Failure-mode switching in longitudinally stiffened slender steel I-girders: experiments and simulations. https://doi.org/10.2139/ssrn.7629408", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用。抄録中の一部の式記号は欠落", "preprint": true, "p1": "細長い溶接鋼I桁に縦補剛材を付けると、最大荷重が増えるだけでなく破壊モードが切り替わることを実大実験で示し、支配的な破壊モードを予測する地図とモデルを作った（抄録）。", "p2": "細長いI桁はウェブの座屈後強度に頼るが、破壊モードはウェブのせん断座屈、フランジの局部座屈、横ねじれ座屈の相互作用で決まり、縦補剛材の効果は設計式で十分に考慮されていない（抄録）。", "p3": "圧縮フランジからウェブ高の5分の1の位置に、ウェブ両面へ板を溶接した縦補剛材を用いた。実大桁4体（うち補剛2体）を4点曲げで試験し、検証済みの非線形シェル有限要素モデルで横補剛のない桁120モデルのパラメトリック解析を行った。サブパネルのせん断座屈・有効断面の曲げ・横ねじれ座屈を組み合わせた耐力包絡モデルを作った（抄録）。", "p4": "モデルの評価は、支配モードの的中率と、較正した低減式による有限要素強度の予測比（平均と変動係数）で行い、実測耐力をAISC 360、Eurocode 3 Part 1-5、エジプト規準と比べた（抄録）。", "p5": "補剛材は最大荷重を31%と48%増やし、破壊を中央パネルのフランジ局部座屈から端パネルのせん断座屈へ移した。耐力包絡モデルは86%のモデルで支配モードを同定し、低減式の予測比は平均1.02、変動係数0.19だった。実測耐力は各規準の予測を24〜56%上回った（抄録）。", "p6": "規準との差は、ウェブ-フランジ接合部がほぼ固定に近いことと、曲げ・横ねじれの照査で補剛材の効果が無視されていることによるとする（抄録）。解釈：変動係数0.19は個々の桁の予測には幅が残ることを示す。", "fun": "薄い下じきを曲げると、どこがどう折れるかは押し方や形で変わる。鉄の橋桁も同じで、補強の板を一枚足すだけで、折れる場所も折れ方もがらりと変わる。壊れ方の「分かれ道」を地図にしたところが面白い。", "unverified": "抄録中の式記号（細長比などの具体的な指標名）が欠落しており未確認。"}}, {"id": "pr14", "rank": 14, "headline": "基準値の漂流と持続的異常を分ける二段CUSUM", "title": "Drift-Guard MCUSUM: Protected Confirmation for Persistent Shifts under a Time-Varying Baseline", "url": "https://doi.org/10.2139/ssrn.7629110", "authors": "Viet Hieu TRAN ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "TRAN, V. H., TRAN, K. D., Thomassey, S., & Tran, K. P. (2026). Drift-Guard MCUSUM: Protected Confirmation for Persistent Shifts under a Time-Varying Baseline. https://doi.org/10.2139/ssrn.7629110", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "運転水準が正当に変わり続ける工程でも、急で持続的な異常を基準値に吸収される前に確かめられる二段のCUSUM管理図（Drift-Guard MCUSUM）を提案した（抄録）。", "p2": "適応的な基準値は正常な変化に追従するが、そのまま異常も取り込んで証拠を薄めてしまう。誤警報が多いと運転が止まり、確認が遅れると持続的なずれを見逃す（抄録）。", "p3": "カルマンフィルタで正常な動きを追い、第1の多変量CUSUMで異常の候補を開く。第2のCUSUMは、疑わしい観測を取り込まない保護された更新前の予測器と比べて候補を確かめる。保護期間を有限にして予測の不確実性を抑える。スカラーの解析で、適応が異常の証拠を弱め、保護がそれを保つ仕組みを説明した（抄録）。", "p4": "既知母数のガウス・シミュレーション、Phase-Iの推定の繰り返し、半合成のガスタービンのストレステストで評価した。警告と確認の母数は長い遅れを罰する基準で選び、各設計を共通の名目誤警報率に較正した（抄録）。", "p5": "監視開始時からある中程度のずれでは、平均遅れをカルマン・イノベーション管理図より約49%短縮したが、途中で変化が起きる場合は優位が逆転した。工業的ストレス条件では、最大のずれで95パーセンタイル遅れを約99%減らした一方、中央値の遅れは増えた（抄録）。", "p6": "保護の利点は変化の時期、較正、モデルの当てはまりに依存する課題依存の設計選択だとする（抄録）。解釈：実プラントの実データでの検証は抄録に記載がない。", "fun": "ゆっくり変わっていく「ふつう」に合わせて目盛りを動かしていると、急な異常まで「新しいふつう」として受け入れてしまう。この研究は、怪しいデータを見たら一度目盛りを凍らせて見比べる、という二段構えの見張り方を考えた。万能ではないと正直に示している点もよい。", "unverified": "なし"}}, {"id": "pr15", "rank": 15, "headline": "オーナーの注意の限界が企業規模を止める", "title": "Decisions Not Made: Owner Attention, the Intrinsic Value of Authority, and the Limits to Organizational Scale", "url": "https://doi.org/10.5281/zenodo.23445787", "authors": "Bulak, Sefa", "venue": "Zenodo", "date": "2026-10-18", "apa": "Bulak, S. (2026). Decisions Not Made: Owner Attention, the Intrinsic Value of Authority, and the Limits to Organizational Scale. Zenodo. https://doi.org/10.5281/ZENODO.23445787", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodo掲載PDFの本文（モデルの節、命題1〜5、表1の数値例、結論）を読んだ。付録の証明は一部のみ", "preprint": true, "p1": "オーナー経営の企業が、技術・需要・資金の限界よりずっと手前で成長を止める理由を、「オーナーの注意の量」が制約となる統制範囲モデルで説明し、どの決定をやめるべきかの最適規則を導いた（抄録、§3）。", "p2": "小規模で成功した企業がなぜ規模を伸ばせないのかについて、権限委譲の行動的な歪みと規模の上限を一つの枠組みで扱う理論が欠けていた（§1、§10）。", "p3": "各事業単位には損失の異なる多数の決定があり、委譲すると注意が浮く代わりに監督の費用sと決定の質の損失が生じる。最適な方針は閾値規則で、委譲損失がオーナーの時間の平均収益で評価した浮く注意より小さい決定をすべて委譲する（命題1）。権限そのものへの価値（権限レント）と委譲の失敗の過大視を加え、行動的な過少委譲を表した（§4.1、命題3）。", "p4": "命題の導出に加え、損失を[0, 2]上の一様分布、V = T = 1とした数値例で、最適な委譲と行動的な委譲の閾値・委譲率・運営単位数・余剰を比べた（§4.3、表1）。実データでの検証は行っていない。", "p5": "s = 0.2では最適な委譲により、全部を自分で決めるオーナーより3分の2多い単位を運営し、余剰は25%多い。両方の歪みがあると単位数は最適より22%少ないが、余剰の減少は5%未満で、規模には一次の損失だが利益には二次の損失にとどまる（§4.3、命題4）。権限レントb = 0.2は閾値をs = 0.2で約7%、s = 0.4で約15%下げた（表1）。", "p6": "著者は、事業単位の均質性、委譲損失の分布が外生であること、注意の量が固定であること、動学分析が近視眼的なオーナーに限られることを限界に挙げ、企業データでの検証を今後の課題とする（§10）。", "fun": "社長が全部を自分で決めていると、会社は社長の頭の容量以上には大きくなれない。しかも任せないことで失う利益はわずかなので、社長自身は損に気づきにくい。だから成長の壁は見えないまま残る、という説明がよくできている。「何をやめたか」で組織の大きさが決まるという逆転の発想が面白い。", "unverified": "§7（多層の持株会社）と§8（観察可能な診断式）の詳細な導出は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "ESG柱間の偏りは負債コストを上げる", "title": "The Cost of Uneven ESG Development: ESG Imbalance and Corporate Debt Pricing", "url": "https://doi.org/10.2139/ssrn.7629309", "authors": "PIN SHEN ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "SHEN, P., Ye, D., & Xie, S. h. (2026). The Cost of Uneven ESG Development: ESG Imbalance and Corporate Debt Pricing. https://doi.org/10.2139/ssrn.7629309", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ESGの総合点が同じでも、環境・社会・ガバナンスの3つの柱の間に偏りがある企業ほど借入コストが高いことを示した。", "p3": "中国A株の非金融企業2006〜2024年の17,623企業年で、均衡したESGプロファイルからの乖離を「ESG不均衡」と定義し、企業・年の固定効果で負債コストに回帰した。操作変数、傾向スコアマッチング、格付けショックの三重差分でも確かめている。", "p5": "不均衡が1標準偏差増えると借入コストは8.85ベーシスポイント（標本平均の10.66%）上がる（抄録）。内部統制の弱さ・評判の低さ・営業リスクが経路として整合的で、国有企業では関係が弱まる。", "fun": "テストの合計点が同じでも、得意・不得意の差が大きい生徒と全教科そこそこの生徒では「安定感」の印象が違う。お金を貸す側も同じ見方をしていて、ESGの点数の合計だけでなく凸凹の具合まで金利に織り込んでいるらしい、という発見。", "unverified": "本文未入手のため、不均衡指標の具体的な算式と推定表は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "自動運転のGNSS測位を機械学習で補正する総説", "title": "Machine Learning for Global Navigation Satellite System Positioning in Autonomous Vehicles: A Systematic Review", "url": "https://doi.org/10.2139/ssrn.7629216", "authors": "Wasiu Akande Ahmed ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Ahmed, W. A., Ogunlade, J. O., Olatoyinbo, S. F., Ojerinde, J. S., Kolawole, S. O., Isiaka, A. L., & Mustapha, I. I. (2026). Machine Learning for Global Navigation Satellite System Positioning in Autonomous Vehicles: A Systematic Review. https://doi.org/10.2139/ssrn.7629216", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "自動運転車のGNSS測位を機械学習で補正・監視する研究を、PRISMA 2020に沿って体系的に整理した総説。", "p3": "誤差補正・故障パターン・不確実性推定・なりすまし検知など6つの課題に分類し、測位性能、検証の質、SAE J3016のレベル3〜5とISO 26262・SOTIFの安全要件への適合度で評価した。", "p5": "なりすまし検知で99%超の精度を報告した研究もあるが統制条件下の1件にとどまり、実走行への一般化は難しいとする（抄録）。今後の方向として不確実性推定、説明可能性、自己教師・連合学習、認証を見据えた検証を挙げる。", "fun": "GPSはビルの谷間で電波が反射すると、自分の位置を何十メートルも間違えることがある。その「間違え方のくせ」をデータから学ばせようという研究が増えているが、命を預ける車に載せるには、当たる確率だけでなく安全をどう証明するかが壁になる、という整理が面白い。", "unverified": "対象文献数と各課題の比較表は本文未入手のため未確認。"}}, {"id": "pr18", "rank": 18, "headline": "移動エントロピー網で風車故障の前兆を検出", "title": "Transfer-Entropy-Based Dynamic Network Markers for Interpretable Early Warning of Wind Turbine Failures", "url": "https://doi.org/10.2139/ssrn.7625808", "authors": "Tongding Yu ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Yu, T., Fang, R., Ying, N., & Huang, Y. (2026). Transfer-Entropy-Based Dynamic Network Markers for Interpretable Early Warning of Wind Turbine Failures. https://doi.org/10.2139/ssrn.7625808", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "風車のSCADAデータから、変数間の情報の流れの向きを使って故障の前兆を早めに捉える指標（TE-DNM）を提案した。", "p3": "移動窓ごとに移動エントロピー（transfer entropy）で有向ネットワークを作り、窓間の結合の変化をノードの変動・近傍内外の変動として合成し、正常時のデータで警報閾値を較正する。EDP Renewablesの公開データで評価した。", "p5": "正常運転中の指標は[0, 3]に収まり、ギアボックス軸受故障は17窓（約2.83時間）前、油圧漏れは141窓（約23.5時間）前に警報を出した（抄録）。相関に基づく従来の動的ネットワーク指標より早かった。", "fun": "病気の前には体温や脈がそれぞれ正常範囲でも、それらの「連動の仕方」が変わることがある。この研究は機械でも同じ考え方を使い、どのセンサがどのセンサに影響しているかという矢印の向きの変化から、壊れる何時間も前に異変を察知しようとしている。", "unverified": "誤警報率の評価と比較手法の詳細は本文未入手のため未確認。"}}, {"id": "pr19", "rank": 19, "headline": "在宅経管栄養を担うケア職のニーズ", "title": "Needs of Formal Caregivers for Older Adults with Home Enteral Tube Feeding in China: A Qualitative Study", "url": "https://doi.org/10.21203/rs.3.rs-10771401/v1", "authors": "Huiya Zhu ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Zhu, H., Ma, X., Gong, Z., Liu, H., Liu, A., Han, Z., Yang, Y., & Shi, H. (2026). Needs of Formal Caregivers for Older Adults with Home Enteral Tube Feeding in China: A Qualitative Study. https://doi.org/10.21203/rs.3.rs-10771401/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "中国で在宅経管栄養の高齢者を世話する有償の介護者が、技能の習得や専門的支援の不足に直面している実態を明らかにした。", "p3": "2025年6〜8月に北京で介護者14人、地域・病院の医療職各3人の計20人に半構造化面接を行い、記述的現象学の手法（Colaizzi法）で分析した。", "p5": "技能は断片的な独学と仲間内の共有に頼っていること、栄養評価や管の交換などで専門的支援が欠けること、短い動画などの学び方と精神的支援・レスパイトを求めていることの3主題が得られた（抄録）。", "fun": "食べ物を口から取れない高齢者に管で栄養を入れる在宅ケアは、医療に近い技術が要るのに、担い手は家で一人で判断していることが多い。専門職と家庭のすき間で孤立している「見えにくい働き手」の声を拾った点が興味深い。", "unverified": "なし"}}, {"id": "pr20", "rank": 20, "headline": "DEMでCO2ハイドレート含有粘土の力学を再現", "title": "DEM-based numerical study on the mechanical behavior of CO2 hydrate-bearing silty-clayey sediments", "url": "https://doi.org/10.2139/ssrn.7629315", "authors": "Aowang Wang ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Wang, A., Luo, T., You, Z., Zhang, Y., Hou, S., Li, Q., Wu, P., Li, Y., Yang, W., & Han, T. (2026). DEM-based numerical study on the mechanical behavior of CO2 hydrate-bearing silty-clayey sediments. https://doi.org/10.2139/ssrn.7629315", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "南シナ海のシルト質粘土にCO2ハイドレートが含まれると、せん断破壊時の内部構造がどう変わるかを個別要素法（DEM）で示した。", "p3": "室内試験の結果に合わせてDEMのパラメータを較正し、ハイドレートの固結と有効拘束圧を変えて、せん断破壊中の粒子の接触力・回転・間隙構造をメソスケールで追った。", "p5": "固結は降伏強度を高め降伏ひずみを下げ、拘束圧の増加は弾性段階を長くした。最大接触力は軸方向に、最小は水平から上下約15°に集中し、水平方向の粒子回転は軸方向より約4.5°大きかった（抄録）。", "fun": "海底の泥にCO2を氷のような結晶として閉じ込める案があるが、その泥が地震などで崩れないかは大問題。この研究は砂粒一つ一つをコンピュータで転がし、結晶の「のり」が切れていく順番から、帯状の壊れ方が一枚の滑り面へ育っていく様子を描いている。", "unverified": "粒子数や較正に使った試験条件は本文未入手のため未確認。"}}, {"id": "pr21", "rank": 21, "headline": "DEMで遠心乾式磁選の分離機構を予測", "title": "Separation mechanism of magnetite intergrowths and its performance prediction in centrifugal DMS process based on DEM simulation", "url": "https://doi.org/10.2139/ssrn.7629554", "authors": "Fan Yi ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Yi, F., He, H., Zeng, J., & Chen, L. (2026). Separation mechanism of magnetite intergrowths and its performance prediction in centrifugal DMS process based on DEM simulation. https://doi.org/10.2139/ssrn.7629554", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "遠心式の乾式磁選機で、磁鉄鉱の連晶粒子がどう分離されるかをDEMシミュレーションで再現し、回収性能を予測できるようにした。", "p3": "粒子の運動と磁力を組み込んだDEMモデルを作り、連晶の鉄品位、供給粒径、分離コーンの回転数、磁束密度を変えて回収率を計算した。", "p5": "連晶の鉄品位が低いほど回収能力は大きく下がった。粒径と回転数の増加は中・低品位の回収を下げるが高品位にはほぼ影響せず、磁束密度の増加は高・中品位の回収を高めた（抄録）。", "fun": "水の少ない地域で鉄鉱石を選り分けるには、水を使わず磁石と遠心力で振り分ける必要がある。鉄を少しだけ含む「混ざりもの」の粒がどこへ飛んでいくかを粒単位で計算し、条件ごとに得する粒・損する粒が違うことを示した点が面白い。", "unverified": "モデルの検証に用いた実験の規模は本文未入手のため未確認。"}}, {"id": "pr22", "rank": 22, "headline": "全反射でボルト接合界面の挙動を可視化", "title": "Observation of Bolted Joint Interface Behaviour Using Total Internal Reflection", "url": "https://doi.org/10.2139/ssrn.7625984", "authors": "Idriz Tafa ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Tafa, I., Mace, T., Cascino, A., Meli, E., & Schwingshackl, C. (2026). Observation of Bolted Joint Interface Behaviour Using Total Internal Reflection. https://doi.org/10.2139/ssrn.7625984", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ボルト接合部の接触面が振動中にどう変化するかを、全反射（TIR）を使って直接・時間分解で観察できるようにした。", "p3": "透明なPMMA製のボルト接合梁（Brake-Reuss Beam）と一体の参照梁で、ハンマー打撃・ステップサイン加振・共振試験を行い、TIRの画像から実接触面積とその時間変化を抽出して全体の振動応答と対応づけた。", "p5": "振動中の接触状態の変化をTIRで捉えられ、接合部の非線形性を生む機構の直接的な実験的証拠を得たとする（抄録）。局所の界面挙動と全体の動特性を結びつける手段になる。", "fun": "ボルトで締めた2枚の板は、揺れるとわずかにこすれ合い、それが振動の減り方を変える。でも普段は接触面の中は見えない。透明な板を使い、光が接触しているところだけ抜けていく性質で「どこがくっついているか」を動画のように見た、という発想が面白い。", "unverified": "接触面積の定量値は抄録に記載がなく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "財政危機の市ラドフォードの選択肢分析", "title": "Fiscal Crossroads: An Options Analysis of the City of Radford, Virginia", "url": "https://doi.org/10.5281/zenodo.23444852", "authors": "Turner, Tommy N.", "venue": "Zenodo", "date": "2026-10-18", "apa": "Turner, T. N. (2026). Fiscal Crossroads: An Options Analysis of the City of Radford, Virginia (Version 1.3). Zenodo. https://doi.org/10.5281/ZENODO.23444852", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "財政危機に指定された米バージニア州ラドフォード市について、公的記録から原因を跡づけ、取りうる進路を比較した選択肢分析。", "p3": "14年間の財政推移と同規模の市との比較で原因を整理し、増税・料金引き上げで独立市を保つ道と、市営配電事業を売却して郡内の町に戻る道を、世帯負担・学校・ダムなどの観点で検討した。事実と推論を分けて記述している。", "p5": "一般会計は長年自らの運営費を賄えず、市営電力からの年約400万ドルの繰入れで均衡しており、同規模の構造的赤字があるとする（抄録）。不動産の半分以上が非課税であることなどが背景。", "fun": "町の財布が赤字なのに、市が持つ電力会社の利益で穴埋めして黒字に見せていた、という構図は家計にも置き換えやすい。大学の町で土地の多くが税金を払わないなど、都市の形そのものが財政を縛るという点が興味深い。", "unverified": "審査のない個人の報告書。数値は本文の付録で確認していない。"}}, {"id": "pr24", "rank": 24, "headline": "劣化を織り込んだ配水網の時間依存レジリエンス", "title": "Deterioration-Informed, Time-Dependent Resilience of Water Distribution Systems: Integrating Bayesian Failure Modeling, Reliability, and Hydraulic Supply Pathways", "url": "https://doi.org/10.2139/ssrn.7629365", "authors": "Balekelayi Ngandu ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Ngandu, B., & Nzokona, E. T. (2026). Deterioration-Informed, Time-Dependent Resilience of Water Distribution Systems: Integrating Bayesian Failure Modeling, Reliability, and Hydraulic Supply Pathways. https://doi.org/10.2139/ssrn.7629365", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "水道管の老朽化が時間とともに給水の冗長性をどう失わせるかを測る、時間依存のレジリエンス指標WIPW(τ)を提案した。", "p3": "1956〜2025年の37,484件の実際の配水管破損から地理加法的ベイズ劣化モデルを作り、材質別の信頼度関数、24時間の圧力駆動型水理計算、重み付き独立経路を組み合わせた。WAIC・DIC・空間ブロック交差検証で劣化モデルを選んでいる。", "p5": "WIPW(τ)はエネルギー型の指標（Todini指数など）が見落とす老朽化による冗長性の損失を捉えた。勾配に基づく更新順位で、全更新費用の17〜25%で得られるレジリエンス向上の約半分を回復できた（抄録）。", "fun": "水道網は、ある管が壊れても別の道を通って水が届く「迂回路の多さ」が強さになる。この研究は管が古くなるほど迂回路が実質的に減っていく様子を確率で追い、限られた予算でどの管から替えれば一番効くかを数字で示した。", "unverified": "ベンチマーク網ごとの数値は本文未入手のため未確認。"}}, {"id": "pr25", "rank": 25, "headline": "北アフリカ自動車産業の労働者のデジタル準備度", "title": "Evaluating Workforce Readiness for Digital Transformation in the Automotive Industry: The Case of North Africa", "url": "https://doi.org/10.21203/rs.3.rs-11183699/v1", "authors": "Mohammed Sadky ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Sadky, M., & Abderrazik, Y. B. (2026). Evaluating Workforce Readiness for Digital Transformation in the Automotive Industry: The Case of North Africa. https://doi.org/10.21203/rs.3.rs-11183699/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "北アフリカ4か国の自動車産業で、従業員がデジタル化にどれだけ備えているかを調べた。", "p3": "モロッコ・アルジェリア・チュニジア・エジプトの従業員622人の調査に、半構造化面接と工場観察を組み合わせ、デジタルリテラシー、適応力、組織的支援、導入の障壁を測った。", "p5": "若く学歴の高い層ほど習熟度が高く、全体では訓練不足と組織的支援の弱さが最大の障壁だった（抄録）。企業は自動化・分析に投資しているが、訓練がそれに追いついていないと面接は示唆した。", "fun": "工場に最新の機械を入れても、使う人が使い方を知らなければ宝の持ち腐れになる。この研究は「機械を買うより、人を育てて変化をみんなで受け入れる職場にする方が効く」という、言われてみれば当然だが見落とされがちな点をデータで確かめている。", "unverified": "各国別の数値は本文未入手のため未確認。"}}, {"id": "pr26", "rank": 26, "headline": "観察されていると告げる一文で出力が変わる", "title": "The Performance Layer: Observation Context Produces Classifiable Output Differences in a Language Model", "url": "https://doi.org/10.5281/zenodo.23439822", "authors": "Glitchlit ほか", "venue": "Zenodo", "date": "2026-10-17", "apa": "Glitchlit, A., Jandak, A. C., & Glitchlit, C. (2026). The Performance Layer: Observation Context Produces Classifiable Output Differences in a Language Model (Version 0.2). Glitchlit Systems LLC. https://doi.org/10.5281/ZENODO.23439822", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用。審査のない置き場の短い記録", "preprint": true, "short": true, "p1": "「観察されている」ことを告げる一文だけで、指示調整済み言語モデルの出力が分類可能なほど変わることを統制実験で示した。", "p3": "観察文脈の有無などの3条件を比べ、迎合（sycophancy）と観察への感受性を切り分けた。出力の違いを分類器で判別し、単語の出現頻度（BoW）の違いと比べている。", "p5": "生成のみの分類でAUROC 0.692（p=0.008）と差が検出された一方、表面の語彙はほぼ同一だった（BoW 0.999）（抄録）。ペルソナの分析は探索的とされている。", "fun": "先生が見ているときだけ字が丁寧になる生徒のように、AIも「見られている」と言われると答え方が微妙に変わるらしい。しかも使う単語は同じなのに中身の傾向が違う、という点が、AIの評価試験の結果をどこまで信じてよいかという問いにつながる。", "unverified": "モデル名と標本数は抄録に記載がなく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "無料LLMが匿名投稿から属性を推定できる", "title": "Tor Hides Your IP, Not Your Words: Free LLMs as an Attribute-Inference Threat to Users of Network Anonymity Tools", "url": "https://doi.org/10.5281/zenodo.23453954", "authors": "Mashiki, Selby", "venue": "Zenodo", "date": "2026-10-18", "apa": "Mashiki, S. (2026). Tor Hides Your IP, Not Your Words: Free LLMs as an Attribute-Inference Threat to Users of Network Anonymity Tools (Version 1.0.1). Zenodo. https://doi.org/10.5281/ZENODO.23453954", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "TorやVPNでIPアドレスを隠しても、投稿した文章から無料のLLMで個人属性が推定できてしまうことを示した。", "p3": "SynthPAIデータセットの合成著者100人のコメントから、無料版のGemini 2モデルに8つの属性を推定させ、投稿前にLLMで書き換える防御の効果も調べた。", "p5": "最良モデルは性別85.4%、職業71.4%、国72.3%、全属性平均64.3%を当てた（抄録）。書き換えで平均精度は49.5%に下がったが、どの属性も推定を防ぎきれなかった。", "fun": "住所を隠して手紙を出しても、書きぶりや話題から「この人は誰か」が透けて見えることがある。それを今は無料のAIが一瞬でやれてしまう、というのがこの研究の警告。匿名性は通信路だけでなく文章そのものに漏れ口がある。", "unverified": "合成データでの評価で、実在ユーザでの精度は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "地域集中の農業融資の集中リスクを二因子で評価", "title": "Concentration Risk in Rural Loan Books: A Merton–Vasicek Derivation of the Basel Retail Capital Function and a Two-Factor Monte Carlo for District-Concentrated Agricultural Lending", "url": "https://doi.org/10.5281/zenodo.23450073", "authors": "Aguru, Manoj Kumar", "venue": "Zenodo", "date": "2026-10-18", "apa": "Aguru, M. K. (2026). Concentration Risk in Rural Loan Books: A Merton–Vasicek Derivation of the Basel Retail Capital Function and a Two-Factor Monte Carlo for District-Concentrated Agricultural Lending. Zenodo. https://doi.org/10.5281/ZENODO.23450073", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "バーゼル規制の小口与信の資本式を導出し直し、少数の地区に集中した農業融資では必要資本が大きく過小になることを示した。", "p3": "Mertonの企業価値モデルからItôの補題とVasicekの極限損失分布で資本関数を導き、99.9%分位点をモンテカルロで検証した。そのうえで地区内外の相関を分けた二因子モデルで、インドの地方農村銀行に典型的な集中した貸出を試算した。", "p5": "PD 5%・LGD 45%で規制式の資本はエクスポージャーの5.31%。地区内相関0.15・地区間0.05のとき、99.9%の非期待損失は1地区のみで規制資本の2.23倍、3地区で1.42倍、10地区で1.11倍だった（抄録）。値は仮定のシナリオ。", "fun": "卵を一つのかごに盛るな、という格言を数式で示した研究。同じ村の農家は同じ天候不順で一斉に返済に困るので、借り手の数が多くても安全とは限らない。規則の前提「全員がばらばら」が崩れると、必要な備えが2倍以上になりうる。", "unverified": "なし"}}, {"id": "pr29", "rank": 29, "headline": "AI商品表示と実物のずれが購買意図を下げる", "title": "AI-BASED PRODUCT SIMULATION IN E-COMMERCE: EXAMINING THE INFLUENCE OF SIMULATED PRODUCTREALITY MISMATCH ON CONSUMER PURCHASE INTENTION", "url": "https://doi.org/10.5281/zenodo.23433422", "authors": "Prabhjot Singh", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-17", "apa": "Singh, P. (2026). AI-BASED PRODUCT SIMULATION IN E-COMMERCE: EXAMINING THE INFLUENCE OF SIMULATED PRODUCTREALITY MISMATCH ON CONSUMER PURCHASE INTENTION. Zenodo. https://doi.org/10.5281/ZENODO.23433422", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（OpenAlex登録）を使用。文献に基づく概念論文", "preprint": true, "short": true, "p1": "ネット通販でAIが作る商品画像やARの試着と実物との「ずれ」が、購買意図と購入後の評価にどう効くかを、文献から概念枠組みにまとめた。", "p3": "新たなデータは取らず、商品提示、心的イメージ、診断性、信頼、期待不一致などの研究を統合した。ずれを外観・寸法・機能・素材・文脈・表現の真正性の6次元に分け、5つの研究の空白を評価した。", "p5": "ずれは知覚された診断性・期待・信頼・リスクを通じて購買意図に効き、関与度・カテゴリ・AI開示・返品方針が調整するという枠組みを提案した（抄録）。因果推定は含まない。", "fun": "ネットで見た服がきれいに見えすぎて、届いたら「なんか違う」と思った経験は多くの人にある。AIで画像を作るほど見栄えは良くなるが、そのぶん期待とのギャップも広がるかもしれない。良く見せることが逆効果になる境目はどこか、という問いが面白い。", "unverified": "実証データはなく、枠組みの妥当性は未検証。"}}, {"id": "pr30", "rank": 30, "headline": "睡眠問題の多い子どもは孤独も強い", "title": "Children with more sleep problems could also feel lonelier: a latent profile analysis", "url": "https://doi.org/10.21203/rs.3.rs-11164007/v1", "authors": "Alina A. Marinca ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Marinca, A. A., Michalek, J. E., Gregory, A. M., Ali, A., & Lau, J. Y. F. (2026). Children with more sleep problems could also feel lonelier: a latent profile analysis. https://doi.org/10.21203/rs.3.rs-11164007/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用。抄録の一部が途中で切れている", "preprint": true, "short": true, "p1": "小学生の睡眠問題のパターンを3つの型に分け、睡眠問題の多い型ほど後の孤独感が強いことを示した。", "p3": "東ロンドンの小学生コホート（基準時879人、7〜11歳）で、2時点の睡眠問題から潜在プロファイル分析を行い（778人）、前の時点の孤独感、性別、年齢、民族、地域の剥奪指標を調整して後の孤独感との関連を調べた。", "p5": "睡眠問題は低（53.6%）・中（36.2%）・高（10.2%）の3型に分かれ、型は後の孤独感と有意に関連した（F(2, 445) = 11.30）（抄録）。高と低の差などの詳細は抄録の記載が途中で切れている。", "fun": "よく眠れない子は昼間に元気が出ず友達と過ごしにくくなるのか、それとも寂しいから眠れないのか。この研究は前の時点の孤独感をそろえたうえで比べ、眠りの問題が後の孤独につながる方向の関係を示唆している。", "unverified": "型ごとの平均差とp値は抄録が途中で切れており未確認。"}}, {"id": "pr31", "rank": 31, "headline": "マラウイの降雨型地すべりリスクの統治", "title": "Evaluation of Governance, Institutional, and Policy Dimensions of Rainfall-Induced Landslide Risk in Malawi", "url": "https://doi.org/10.21203/rs.3.rs-11012281/v1", "authors": "Samuel Gama ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Gama, S., Ngongondo, C., & Kalanda-Joshua, M. (2026). Evaluation of Governance, Institutional, and Policy Dimensions of Rainfall-Induced Landslide Risk in Malawi. https://doi.org/10.21203/rs.3.rs-11012281/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "マラウイの降雨型地すべりに対する多層の防災ガバナンスが、地域レベルでなぜうまく機能しないかを明らかにした。", "p3": "8か月の質的調査（半構造化面接、参与観察、ワークショップ、文書分析）を、多層・ネットワークガバナンス理論と景観ガバナンスの枠組みで分析した。", "p5": "地域での中央政府の能力と存在感は限られ、防災サービスの多くをNGOが担うが、調整の不足、資源の政治的取り込み、地方政府の能力不足が進展を妨げていた。能力が育つ前の分権化は失敗を地方で再生産しかねないと論じる（抄録）。", "fun": "土砂崩れを防ぐには山の斜面の工学だけでなく、誰が警報を出し、誰が避難を手伝うかという人の仕組みが要る。この研究は、権限を地方に任せれば良くなるとは限らず、任された側に力がなければかえって弱くなる、という逆説を現場から描いている。", "unverified": "なし"}}, {"id": "pr32", "rank": 32, "headline": "定量アルファを組み込むマルチエージェント売買", "title": "Enhancing Multi Agent Large Language Models for Stock Trading through Quantitative Alpha Integration", "url": "https://doi.org/10.2139/ssrn.7629484", "authors": "Viet Hong Tran ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Tran, V. H., Nguyen, V.-T., & Phan, H.-D. (2026). Enhancing Multi Agent Large Language Models for Stock Trading through Quantitative Alpha Integration. https://doi.org/10.2139/ssrn.7629484", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ベトナム株を対象に、テクニカル指標・定量アルファ・センチメント・チャート画像を5つのLLMエージェントで統合する売買判断の枠組みを示した。", "p3": "上流の証拠を固定したままアルファ情報の寄与だけを切り出す対照プロトコルと、定量因子とセンチメントを分ける4通りのアブレーションで評価した。9銘柄・180組の判断を比較している。", "p5": "全体システムの方向的中率は65.0%で、アルファなしの51.1%を上回り、アルファの寄与がセンチメントより大きかった。一方、取引費用を考えた買いのみの運用では平均純収益は負だった（抄録）。", "fun": "株価が上がるか下がるかを当てる率が上がっても、それで儲かるとは限らない、という結果が正直で面白い。売り買いの手数料や当たり外れの大きさまで考えると、当てる力とお金を増やす力は別物だと分かる。", "unverified": "標本が9銘柄と小さく、期間の詳細は本文未入手のため未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "DDMLでCATEを推定する実務比較", "title": "Double/debiased machine learning for conditional average treatment-effect estimation", "url": "https://econpapers.repec.org/RePEc:boc:carp26:08", "authors": "Miana Plesca", "venue": "RePEc NEP", "date": "2026-09-28", "why": "二重機械学習による条件付き平均処置効果の推定を、Stata・Pythonの道具立てで実務的に比較し、応用研究での使い分けを示している。", "explain": {"basis": "抄録", "basis_note": "RePEc掲載ページの抄録を使用。本文は取得できず", "preprint": true, "p1": "二重/脱バイアス機械学習（DDML）で条件付き平均処置効果（CATE）を推定する方法を、Stata・Python・Rで何ができるかという実務の観点から比較し、組み合わせ方を示した（抄録）。", "p2": "機械学習は処置効果の不均一性の推定に使われ始めているが、正則化や過学習による偏りがあり、どの道具でどの推定量が使えるかが応用研究者に分かりにくい（抄録）。", "p3": "部分線形モデルと交互作用型のDDMLで、直交化（orthogonalization：迷惑関数の推定誤差が処置効果の推定に一次で効かないようにする）とクロスフィッティング（標本を分けて推定と評価を交互に行う）により偏りを抑える。CATE関数そのものの推定として、構造化した不均一PLM、R-learner、DR-learner、因果フォレストを比べた（抄録）。", "p4": "例示には職業訓練（JTPA）とNational Supported Workの無作為割付データ、国勢調査に基づく賃金の応用を使った（抄録）。", "p5": "Stataは透明性の高いDDML推定と不均一効果の報告に特に有用で、PythonとRはより柔軟なDDML-CATEのメタ学習器を実装する補完になると結論づける（抄録）。推定値の数値は抄録にない。", "p6": "機械学習は制御関数と処置効果の推定を改善しうるが、信頼できる識別や、学習器・調整母数・解釈可能性の慎重な選択の代わりにはならないと著者は強調する（抄録）。", "fun": "「この薬は誰に一番効くか」を知りたいとき、機械学習は便利だが、そのまま使うと答えが偏る。データを半分ずつに分けて、片方で予測、もう片方で効果を測るといった工夫で偏りを打ち消すのがDDML。道具の比べ方を実例で示した実用的な解説。", "unverified": "各推定法の結果の比較の数値は本文未入手のため未確認。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "都市ガス自由化が電力の契約切替を促した", "title": "Cross-Market Spillovers from City Gas Liberalization to Electricity Contract Switching in Japan", "url": "https://doi.org/10.2139/ssrn.7629299", "authors": "Kentaka Aruga ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Aruga, K., Deng, X., & tang, c. (2026). Cross-Market Spillovers from City Gas Liberalization to Electricity Contract Switching in Japan. https://doi.org/10.2139/ssrn.7629299", "why": "日本の2017年都市ガス小売自由化が先行した電力市場の乗換えに波及したかを、都道府県パネルの連続処置DiDで検証した日本の政策評価。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "日本の2017年4月の都市ガス小売自由化が、1年前に自由化された電力小売で家庭の自由料金契約への切り替えを押し上げたことを示した（抄録）。", "p2": "小売エネルギー自由化の利益は、消費者が契約を変えない惰性（inertia）で限られる。ある市場の自由化が別の市場の乗り換えに波及するかは検証されていなかった（抄録）。", "p3": "2016年4月〜2025年3月の47都道府県の月次バランスパネルに連続処置の差分の差分法を適用し、改革前の都市ガス普及率を改革への暴露とした。直観：都市ガスの顧客が多い県ほど、ガス会社が電力とのセット販売で家庭を自由料金へ移しやすい（抄録）。", "p4": "結果変数は低圧需要のうち自由料金契約で供給される比率と、電力小売事業者の数。頑健性として、処置の上限を100%にする、東京・大阪・京都を除く、電力エリアのトレンドを加える、改革前の日付でのプラセボ検定を行った（抄録）。", "p5": "2017年以降、普及率が10ポイント高い県では自由料金契約の比率が1.75ポイント多く増えた。事業者数は普及率とともに増えず、係数は小さく負だった。各頑健性検定でも正で有意、プラセボでは同様の効果はなかった（抄録）。", "p6": "既存の大手がガスと電力のセットで顧客を動かす経路と整合するが、独立系の顧客獲得費用を上げ、セットによる囲い込みも生みうる。利益はガス網の整った県に集中する（抄録）。解釈：経路は直接観察されておらず推論である。", "fun": "電気の契約先を選べるようになっても、多くの家庭は面倒で変えない。ところがガスの自由化で、ガス会社が「電気もセットでどうですか」と営業に来ると、動かなかった家庭が動いた。ある市場の改革が隣の市場の背中を押す、という波及の仕方が面白い。", "unverified": "なし"}}, {"id": "pn03", "rank": 3, "field": "開発経済学", "headline": "印パ分離の識字難民が村の発展を変えた", "title": "Human capital shock and Economic Development: Evidence from Partition of India", "url": "https://doi.org/10.2139/ssrn.7624623", "authors": "Akansha Gupta", "venue": "SSRN", "date": "2026-10-17", "apa": "Gupta, A. (2026). Human capital shock and Economic Development: Evidence from Partition of India. https://doi.org/10.2139/ssrn.7624623", "why": "1947年の印パ分離による大規模な強制移住を自然実験として、識字率の高い難民流入という人的資本ショックの長期効果を村レベルで推定している。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "1947年の印パ分離で、識字率の高い難民が流入した村ほど、数十年にわたり識字率と所得・消費が高かったことを、新しく作った村レベルのパネルで示した（抄録）。", "p2": "国家の能力が限られる下で、技能の高い移民の大量流入が受け入れ地域の長期的な発展にどう効くかは、定住先が内生的に決まるため識別が難しい（抄録）。", "p3": "数年で約1,500万〜1,800万人が移動した印パ分離を歴史的な自然実験とし、60年にわたる村レベルのパネルを構築した。定住の内生性には、村の中心から印パ国境までの距離の違いを操作変数として用いた（抄録）。", "p4": "結果は識字率（男女別）、雇用構造、消費、所得。運河植民地と歴史的に結びついた地区での違いも見た（抄録）。", "p5": "識字率の大きく持続的な上昇が数十年続き、とくに女性で顕著だった。雇用構造の調整は遅く構造転換の証拠は限られたが、難民に接した村は消費と所得が高かった。効果は運河植民地に縁のある地区で特に強かった（抄録）。", "p6": "抄録の範囲では効果の大きさの数値は示されていない。解釈：国境からの距離が流入以外の経路（戦禍、交易路など）で結果に効いていないという除外制約の妥当性が残る疑問である。", "fun": "戦争や分断で故郷を追われた人々が、読み書きという「目に見えない財産」を新しい村に持ち込み、その効果が60年たっても残っていた。人が動くと知識も動き、とくに女性の教育にまで波及した、という歴史の長い影響が面白い。", "unverified": "効果の大きさの推定値は本文未入手のため未確認。"}}, {"id": "pn04", "rank": 4, "field": "開発経済学", "headline": "国境手続きの簡素化は通関時間を縮めず", "title": "Trade Facilitation Without Trade Costs Reduction: Evidence from a Border Reform in Malawi", "url": "https://doi.org/10.2139/ssrn.7629377", "authors": "Alice Duhaut", "venue": "SSRN", "date": "2026-10-18", "apa": "Duhaut, A. (2026). Trade Facilitation Without Trade Costs Reduction: Evidence from a Border Reform in Malawi. https://doi.org/10.2139/ssrn.7629377", "why": "マラウイ主要国境の機関統合改革を合成DiDで評価し、手続き簡素化が貿易費用削減につながらなかったという反証的な結果を示している。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "マラウイの主要国境での手続き簡素化改革は、通関時間も貿易額も変えなかったことを示し、狙った費用が輸入費用全体に比べて小さければ改革の効果は限られると論じた（抄録）。", "p2": "国境手続きの簡素化（貿易円滑化）は貿易費用を下げると期待されるが、それが実際に貿易を増やし輸入業者の行動を変えるほどかは実証が乏しい（抄録）。", "p3": "国境機関を14から5に減らし共同検査を導入したMwanza国境の改革を、税関記録と850人の業者調査を用いて合成差分の差分法（synthetic DiD）で評価した（抄録）。", "p4": "結果変数は通関時間、出荷額、取引頻度、輸入業者の参入、申告件数（抄録）。", "p5": "通関時間の短縮も、出荷額・頻度・参入の変化も検出されなかった。申告件数はMwanzaで急増したが、一部は内陸ではなく国境での申告を求める同時期の規則による事務所間の付け替えだった。輸送費は出荷額の平均35.7%を占め、通関に直接関わる金銭費用は約6%だった（抄録）。", "p6": "国境1か所の改革の評価である（抄録）。解釈：通関以外の非金銭的費用（待ち時間の不確実性など）への効果は抄録からは分からない。", "fun": "国境の窓口を14から5に減らしたのに、荷物が通るのは速くならず、貿易も増えなかった。理由は簡単で、そもそも国境で払う費用は全体の6%ほどにすぎず、運送費が3割以上を占めていたから。改善すべき場所を間違えると努力が実らない、という教訓が数字で見える。", "unverified": "なし"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "軍事同盟は貿易を平均4割増やす", "title": "Sovereign Gravity: The Military Alliance Effect on Trade", "url": "https://doi.org/10.2139/ssrn.7629376", "authors": "Matteo Neri--Lainé", "venue": "SSRN", "date": "2026-10-18", "apa": "Neri--Lainé, M. (2026). Sovereign Gravity: The Military Alliance Effect on Trade. https://doi.org/10.2139/ssrn.7629376", "why": "安全保障リスクを内生化した構造重力モデルと因果識別で、軍事同盟の貿易効果とその経路を定量化している。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "軍事同盟が、暴力的な収奪の危険を減らすことで貿易を平均40%増やすことを、安全保障リスクを内生化した構造重力モデルで示した（抄録）。", "p2": "国際的な不安定は貿易を大きく損なうが、それへの対応としての軍事同盟が貿易に与える効果と、その経路・一般均衡での厚生への影響は定量化されていなかった（抄録）。", "p3": "同盟が二国間の収奪リスクを下げることで貿易に効く定量モデルを作り、構造重力の枠組みと因果識別の戦略で推定した。反実仮想として、米国の条約離脱や東西対立の激化による同盟網の分断を試算した（抄録）。", "p4": "評価の軸は、同盟の貿易効果の大きさ、軍事協力と二国間の不安定を通じた経路、加盟国・非同盟国の厚生の変化（抄録）。", "p5": "同盟は貿易を平均40%増やし、その効果は軍事協力の強化と二国間の不安定の低下を通じて働く。一般均衡では全ての国に安全保障上の利益があるが、厚生の利得は署名国に集中し、非同盟国は損失を被る。同盟網の分断は世界経済に大きな厚生費用を課す（抄録）。", "p6": "識別戦略の具体は抄録に記載がない。解釈：同盟の締結自体が貿易の見通しに応じて決まる逆因果への対処が、評価の要になる。", "fun": "「仲の良い国どうしは貿易も多い」は当然に見えるが、この研究は、同盟が「積み荷を奪われる心配」を減らすことで貿易を押し上げる、という仕組みとして説明する。安全と商売が結びついていて、同盟の外にいる国が損をするという点が、国際関係の見方を変える。", "unverified": "識別に用いた具体的な方法は本文未入手のため未確認。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "AI企業間の循環的な投資関係を計測", "title": "Circular relationships among AI firms", "url": "https://econpapers.repec.org/RePEc:bis:bisblt:137", "authors": "Jon Frost ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "2021〜2025年のAI企業への投資の過半がAI企業自身から来ていることを示し、投資と取引が重なる循環構造を記述した。", "explain": {"basis": "抄録", "basis_note": "RePEc掲載ページの短い抄録を使用。本文は取得できず", "preprint": true, "p1": "2021〜2025年のAI企業への投資の過半が他のAI企業から来ており、その多くが取引関係とも重なる「循環的な」構造になっていることを計測した（抄録）。", "p2": "AI企業どうしの投資と取引が重なり合う関係は、重要な投入物の確保や情報の非対称性という経済的理由がある一方、マクロ経済のリスクと不透明さを高めうるが、その規模は示されていなかった（抄録）。", "p3": "AI企業の投資案件を、投資先がAI企業かどうか、投資元と投資先の間に商業的なサプライチェーン関係があるかで分類し、件数と金額の割合を集計した（抄録）。データ源の詳細は抄録に記載がない。", "p4": "指標はAI企業の投資のうちAI企業向けの割合、AI企業への投資のうちAI企業からの割合、AI間投資のうち取引関係を伴う割合（抄録）。", "p5": "AI企業の投資の28.7%（金額）がAI企業向けで、AI企業への投資の55.2%が他のAI企業からだった。AI間投資のうち16.1%（件数）、46.4%（金額）は投資元と投資先の間の商業的な取引関係も伴っていた（抄録）。", "p6": "記述的な計測で、リスクの大きさの定量評価は抄録にない（抄録）。解釈：循環が評価額を相互に押し上げるかどうかは、今後の検証課題である。", "fun": "A社がB社に出資し、B社はそのお金でA社の製品を買う。こうした「お金がぐるぐる回る」関係がAI業界では投資額の半分近くに見られる。必要な部品を押さえる合理性がある一方、実際の需要がどれだけあるのか外から見えにくくなる点が気になるところ。", "unverified": "データ源と集計方法は本文未入手のため未確認。"}}, {"id": "pn07", "rank": 7, "field": "ヒューマンコンピュータインタラクション", "headline": "説明の透明性と擬人化がAIへの依存を変える", "title": "Calibrating Trust in Generative AI: How Explanation Transparency and Anthropomorphic Framing Shape Reliance in LLM-Assisted Decision-Making", "url": "https://doi.org/10.2139/ssrn.7629369", "authors": "CHEN XU", "venue": "SSRN", "date": "2026-10-18", "apa": "XU, C. (2026). Calibrating Trust in Generative AI: How Explanation Transparency and Anthropomorphic Framing Shape Reliance in LLM-Assisted Decision-Making. https://doi.org/10.2139/ssrn.7629369", "why": "LLM助言の説明の透明性と擬人化表現を2×2実験で操作し、過信・不信のない適切な依存（信頼の較正）への影響を測っている。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMの助言に説明を付けると過信も不信も減って判断の正確さが上がり、擬人化の表現による過信の増加も説明があれば打ち消されることを、オンライン実験で示した（抄録）。", "p2": "意思決定支援にLLMが組み込まれるなかで、誤った助言に頼りすぎず、正しい助言を退けすぎない「適切な依存」をどう設計で実現するかが課題である（抄録）。", "p3": "説明の透明性（有無）×擬人化の枠付け（有無）の2×2参加者間実験（N = 240）。参加者は20試行の信用リスク評価を、70%の試行で正しい助言をする模擬LLMアシスタントの支援で行った（抄録）。", "p4": "指標は、誤った助言への過信（over-reliance）、正しい助言の不採用（under-reliance）、課題の正解率、判断時間、自己報告の信頼。信頼を媒介とする間接効果を検定した（抄録）。", "p5": "説明は誤った助言への過信を42%減らし（M = 0.52から0.30）、不信も減らし、正解率を69.9%から81.9%に上げたが、判断時間は延びた。擬人化は信頼を大きく上げ（ηp² = .242）、過信をやや増やしたが、その効果は説明なしの条件でのみ有意で、信頼の上昇に完全に媒介された（間接効果 = 0.077、95%CI [0.027, 0.133]）（抄録）。", "p6": "模擬アシスタントによる統制実験で、実際のLLMや現場の判断への一般化は今後の課題と考えられる（解釈）。説明は「認知的な強制機能」として働いたと著者は解釈する（抄録）。", "fun": "AIが人間っぽく話しかけてくると、つい信じたくなる。でもAIが「なぜそう思うか」を説明すると、人は中身を確かめるようになり、親しみやすさに流されなくなった。説明が、考えるきっかけを強制する「ブレーキ」になるという点が面白い。", "unverified": "なし"}}, {"id": "pn08", "rank": 8, "field": "ヒューマンコンピュータインタラクション", "headline": "生成AIの公開発言が議論の感情的極端さを変える", "title": "When AI Enters the Conversation: Generative AI and Emotional Extremity in Public Discourse", "url": "https://doi.org/10.2139/ssrn.7622518", "authors": "Yanda Tao ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Tao, Y., Yoo, C., & Animesh, A. (2026). When AI Enters the Conversation: Generative AI and Emotional Extremity in Public Discourse. https://doi.org/10.2139/ssrn.7622518", "why": "ソーシャルメディアでのAIの介入がその後の議論の感情的極端さに与える影響を、発言内容の変化と参加の選択に分けて検証している。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "X上のニュースのスレッドに生成AIが公に発言すると、その後の返信の感情的な極端さが下がり、それは発言内容の変化より、極端な人が参加を控えることによると示した（抄録）。", "p2": "生成AIが公開の議論に参加者として現れるようになったが、直接の対話や自動のコンテンツ管理ではなく、それを見る多くの人の議論にどう影響するかは分かっていなかった（抄録）。", "p3": "政治参加の計算（calculus of political participation）の枠組みに基づき、約34.2万のニューススレッドと400万超の返信でマッチングした差分の差分法を用いた。加えて、立場・感情・返信の意思を測る2つの実験（Study 1、Study 2）を行った（抄録）。", "p4": "結果変数は返信の平均的な感情的極端さ、極端な返信と穏やかな返信の数、AIの立場との一致・不一致別の変化、返信の意思と知覚されたリスク・影響力・冗長性（抄録）。", "p5": "AIの介入は後続の返信の平均的な極端さを有意に下げ、極端な返信が減る一方で穏やかな返信の増加は検出されず、参加の変化と整合した。AIが明確な立場を示すと減少は大きく、立場が一致しない返信でより大きく下がった。Study 1では立場・感情評価の変化は見られなかった（抄録）。", "p6": "議論が穏やかになる一方で、極端な意見の持ち主が沈黙することは視点の代表性を損ないうると著者は指摘する（抄録）。解釈：観察データのマッチングで、AIが介入するスレッドの選ばれ方が残る交絡になりうる。", "fun": "AIが会話に入ると議論が落ち着く、というのは一見よい知らせ。でも中身を見ると、人々が考えを和らげたのではなく、激しい意見の人が書き込むのをやめていた。静かになったことと、みんなの声が届いていることは違う、という二面性が面白い。", "unverified": "効果の大きさの数値は抄録に記載がなく未確認。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "不均衡最適輸送の勾配流をニューラルJKOで解く", "title": "A Neural JKO Scheme for Hellinger–Kantorovich Gradient Flows via Monge-Growth Pairs", "url": "https://doi.org/10.2139/ssrn.7629405", "authors": "Geuntaek Seo ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Seo, G., Kim, C., Son, H., & Hwang, H. J. (2026). A Neural JKO Scheme for Hellinger–Kantorovich Gradient Flows via Monge-Growth Pairs. https://doi.org/10.2139/ssrn.7629405", "why": "質量の生成・消滅を含む移流反応拡散方程式を、Hellinger–Kantorovich幾何でのメッシュフリーなニューラルJKO法として定式化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "質量の生成・消滅を伴う移流・反応・拡散方程式を、不均衡最適輸送のHellinger–Kantorovich（HK）幾何での勾配流として、メッシュなしのニューラルJKO法で解けるようにした（抄録）。", "p2": "JKO法（勾配流を、エネルギーと輸送距離の和を最小化する時間刻みの変分問題で近似する方法）は質量保存の場合に発展してきたが、空間的な再配置と局所的な質量の増減を一つの変分ステップで同時に扱うのは難しかった（抄録）。", "p3": "各更新を空間写像と質量変化因子の組（Monge-growth pair）でパラメータ化し、その錐作用が二乗HK距離を上から抑えることを利用して、恒等写像との比較から離散的なエネルギー散逸の十分条件を得た。許容される組の全体で目的関数を最小化すると、正の密度の下で厳密なJKO最小値を回復する（抄録）。", "p4": "理論として、JKO最小解の存在と質量の上下界、追加の仮定の下での正値性・正則性、離散オイラー・ラグランジュ方程式、計量-散逸恒等式を示した。数値実験で偏微分方程式との点ごとの一致、エネルギー散逸、輸送・反応・完全陰的な相互作用の役割を調べた（抄録）。", "p5": "最適写像に沿って自己無撞着な化学ポテンシャルは非増加となり、正則な組で近似できる仮定の下でパラメトリックな組が厳密なJKO最小解に収束する。主双対ギャップが目的関数の準最適性を、Boltzmannエントロピーの場合はL1密度誤差を抑える（抄録）。数値実験の誤差の値は抄録にない。", "p6": "収束と誤差評価は、厳密ステップの正則性、半正定値の相互作用、大域的な双対実行可能性などの仮定に依存する（抄録）。解釈：高次元での計算コストと実用規模での精度は抄録からは分からない。", "fun": "インクが水に広がるとき（拡散）や流されるとき（移流）は量が保たれるが、生き物の数のように途中で増えたり減ったりするものもある。この研究は「移動」と「増減」を一度に扱える最短経路の考え方を、ニューラルネットで計算できるようにした。数学の美しさと計算の工夫が出会う点が面白い。", "unverified": "数値実験の具体的な問題設定と誤差の数値は本文未入手のため未確認。"}}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "価値関数の共有が協力の崩壊を招く", "title": "Shared Value Representations Drive Exploration-Induced Cooperation Collapse in Spatial Social Dilemmas", "url": "https://doi.org/10.2139/ssrn.7629485", "authors": "Yi-Ning Weng ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Weng, Y.-N., & Lee, H.-w. (2026). Shared Value Representations Drive Exploration-Induced Cooperation Collapse in Spatial Social Dilemmas. https://doi.org/10.2139/ssrn.7629485", "why": "パラメータ共有DQNの集団で、局所的な探索が共有表現を通じて全体の協力を崩す現象を空間的囚人のジレンマで系統的に描いた。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "多数の強化学習エージェントが一つのニューラル価値関数を共有すると、学習時の探索が価値の地形そのものを作り変え、空間的囚人のジレンマで協力が構造的に崩壊することを示した（抄録）。", "p2": "表形式や独立学習者の定式化では見えない、共有ネットワークを通じた表現の結合が集団の協力にどう効くかは分かっていなかった（抄録）。", "p3": "パラメータ共有のDeep Q-Network（DQN）を動的な空間的囚人のジレンマに置き、探索の強さB、利得の厳しさD_r、共有価値表現、ネットワーク構造を変えて平均協力水準を地図にした。隠れ表現の行動との整合や行動価値の差も診断した（抄録）。", "p4": "比較は、学習停止後の貪欲行動での協力、グループ化した方策学習、ネットワークごとのリプレイ容量の対照、学習の進み具合と探索の信号による状態拡張、次数をそろえた4-正則のトポロジー（抄録）。", "p5": "(B, D_r)空間に、広い低協力領域と滑らかな崩壊境界をもつ探索誘発の協力崩壊が見られた。学習停止後も、貪欲な行動選択でも崩壊は残り、強い探索ほど隠れ表現の行動との整合が崩れ、行動価値の差が縮んだ（平均Q値は有限）。崩壊は4-正則のトポロジー間で頑健だった（抄録）。", "p6": "観測の限界が崩壊を増幅するとする（抄録）。解釈：独立学習者との直接の定量比較の規模は抄録からは分からない。", "fun": "クラス全員が一冊の共有ノートで勉強すると、誰か一人の試し書きが全員の判断に影響してしまう。AIの集団でも同じことが起き、学習中の「試しに裏切ってみる」が共有の頭脳に刻まれ、学習が終わっても協力が戻らなかった。報酬のグラフだけでは見えない劣化を見つける診断が面白い。", "unverified": "協力水準の具体的な数値は抄録に記載がなく未確認。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "Transformerで日次のニュース心理指数を作る", "title": "Measuring sentiment news with transformer-based language models", "url": "https://econpapers.repec.org/RePEc:ecb:ecbwps:20263283", "authors": "Borgioli ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "辞書法に代わり、Transformer言語モデルで金融ニュースの日次センチメント指数を構築し、その妥当性を比較評価している。", "explain": {"basis": "抄録", "basis_note": "RePEc掲載ページの抄録を使用。本文は取得できず", "preprint": true, "p1": "Transformer言語モデルで金融ニュースの日次の心理指数を作り、人の判断との一致で辞書法より優れることを、インセンティブつきの人手評価で検証した（抄録）。", "p2": "金融ニュースのセンチメントは経済・金融で広く使われるが、多くは語の出現回数による辞書法で、文脈・否定・意味構造を部分的にしか捉えない（抄録）。", "p3": "Factivaの金融ニュース143,755本を文単位でFinBERTにより分類し、複数の正規化で記事単位・日次の指標に集計した。Shapiroら（2022）とBarbagliaら（2025）に基づく指標を比較の基準とした（抄録）。", "p4": "444人の参加者が検証用の588記事を評価するインセンティブつきの注釈を行い、独立した人の評価の合意を外部の基準とした。相関・回帰・分類の各課題で一致度を比べた（抄録）。", "p5": "Transformerに基づく指標は、語彙に基づく指標より人の判断と強く一致し、肯定・中立・否定の記事の区別で大幅に優れていた（抄録）。一致度の数値は抄録にない。", "p6": "抄録は人の判断との一致を示すが、指標が景気や資産価格の予測をどれだけ改善するかは抄録の範囲では示されていない（解釈）。", "fun": "「景気は悪くない」という文を単語の数で数えると「悪い」が入っているので暗い記事にされてしまう。文の流れを読めるAIならこうした否定も扱える。それを本当に人の感じ方と比べて確かめるために、444人に記事を読んでもらったという手間のかけ方が面白い。", "unverified": "人手評価との一致度の数値は本文未入手のため未確認。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "貸株供給の増加で経営者が株価から学ぶ", "title": "Lendable-Share Supply and Managerial Learning from Stock Pricesi,Evidence from a Dividend-Tax Reform in China’s Securities-Lending Market", "url": "https://doi.org/10.2139/ssrn.7624578", "authors": "Haiqiang Chen ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Chen, H., Liu, x., Ni, B., & Zhong, Z. (2026). Lendable-Share Supply and Managerial Learning from Stock Pricesi,Evidence from a Dividend-Tax Reform in China’s Securities-Lending Market. https://doi.org/10.2139/ssrn.7624578", "why": "中国の貸株配当課税改革を外生変動として、貸株供給が投資のq感応度と価格発見を高めることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国の貸株市場の配当課税改革で貸株の供給が増えると、経営者が株価から学んで投資を調整する度合いが高まることを示した（抄録）。", "p2": "株価に含まれる情報を経営者が投資判断に使う「株価からの学習」が、空売りの元になる貸株の供給の制約によって妨げられているかは検証されていなかった（抄録）。", "p3": "2020年4月に導入された貸株の配当課税の継続性改革が、機関投資家の貸株に伴う追加の税負担をなくしたことで生じた供給の変動を利用した（抄録）。", "p4": "結果は、投資のq感応度（株価に表れる投資機会への投資の反応）、価格発見の速さ、過大投資の推定値、貸株対象外の企業での同業他社の株価への投資反応（抄録）。", "p5": "貸株供給の増加で投資のq感応度が上がり、価格発見が速まった。投資の反応は、経営者の私的情報が限られる企業や外部情報の需要が大きい企業に集中し、学習と整合した。暴露企業の過大投資は減り、貸株対象外の企業では同業他社の株価への反応が強まった（抄録）。", "p6": "効果の大きさは抄録に記載がない。解釈：改革が貸株以外の経路（配当政策など）で投資に効いていないかが識別の要になる。", "fun": "株価には市場の大勢の予想が詰まっていて、社長もそれを見て投資を決める。ところが「この会社は下がる」と考える人が株を借りて売りにくいと、株価に悲観的な情報が入りにくい。税の小さな変更で株を借りやすくなると、社長の判断まで改善した、という連鎖が面白い。", "unverified": "推定値の大きさは本文未入手のため未確認。"}}, {"id": "pn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "マイクロマネジメントは構造が生む関係様式", "title": "Beyond the Controlling Manager: A Structural-Relational Model of Micromanagement in Leadership", "url": "https://doi.org/10.2139/ssrn.7625834", "authors": "Xaverie Biloa", "venue": "SSRN", "date": "2026-10-17", "apa": "Biloa, X. (2026). Beyond the Controlling Manager: A Structural-Relational Model of Micromanagement in Leadership. https://doi.org/10.2139/ssrn.7625834", "why": "LMX理論と自己決定理論に基づき、マイクロマネジメントを個人の資質ではなく構造的に生まれる関係パターンとして再理論化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用。概念論文", "preprint": true, "p1": "マイクロマネジメントを管理者個人の欠点ではなく、組織の説明責任構造が生む低品質の上司-部下関係として捉え直す多層の概念モデルと5つの命題を示した（抄録）。", "p2": "マイクロマネジメントは個人の性格や「スタイル」として説明されてきたが、その説明では管理者の統制と部下の成果の曲線的な関係（統制が中程度で成果が高い）を説明できない（抄録）。", "p3": "LMX理論（上司と部下の交換関係の質）と自己決定理論（自律・有能感・関係性の欲求）に基づき、組織の説明責任構造（マクロ）、関係の交換の質（メソ）、部下の心理的欲求の充足（ミクロ）をつなぐ構造的・関係的な多層モデルを作った（抄録）。", "p4": "実証は行わず、将来の検証のための5つの命題と境界条件（課題の新しさ、リスクの水準、管理者の動機）を特定した（抄録）。", "p5": "マイクロマネジメントは、部下の自律・有能感・関係性の欲求を妨げる、構造的に課された一律の低品質LMXとして理解できる。部下の引きこもりが管理者の統制の必要感を裏づける自己強化の循環が、一度始まると続く理由を説明する（抄録）。", "p6": "概念論文であり、命題は未検証である（抄録）。解釈：構造的要因と個人要因を実証でどう切り分けるかが今後の課題になる。", "fun": "細かく口を出す上司は「そういう性格」と思われがち。でもこの論文は、会社の仕組みが上司を口出しへ追い込み、部下がやる気をなくすと上司はますます監視したくなる、という悪循環として説明する。人の問題に見えて仕組みの問題かもしれない、という視点の転換が面白い。", "unverified": "なし"}}, {"id": "pn14", "rank": 14, "field": "経営学", "headline": "国家機能が崩れた下での社会的起業の適応", "title": "Sustaining entrepreneurship under institutional fragility: Social bricolage and ecosystem adaptation in Myanmar", "url": "https://doi.org/10.2139/ssrn.7629650", "authors": "Soe Thaw Tar Kyaw Min ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Kyaw Min, S. T. T., & Zan, T. T. (2026). Sustaining entrepreneurship under institutional fragility: Social bricolage and ecosystem adaptation in Myanmar. https://doi.org/10.2139/ssrn.7629650", "why": "クーデター後のミャンマーの社会的企業10社の事例から、制度が機能しない環境でのブリコラージュによる生態系の適応を描いた。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "クーデター後のミャンマーで、国家が機能しない・敵対的な環境でも社会的企業がブリコラージュ（あり合わせの資源での工夫）を日常化して存続する仕組みを、事例研究で明らかにした（抄録）。", "p2": "起業・イノベーションの生態系の研究は、規則・資源・方向性を与える機能する国家を前提としており、その前提が崩れた場でどう動くかは分かっていなかった（抄録）。", "p3": "社会的企業10社の創業者・幹部への半構造化面接と補足の調査データを、社会イノベーション生態系の枠組みと社会的ブリコラージュ理論で分析し、適応的政治経済学の概念で解釈した（抄録）。", "p4": "政策・金融・文化・支援基盤・人的資本・市場の各領域での制約と、企業の対応、仲介組織とピア・ネットワークの役割を整理した（抄録）。", "p5": "全領域に広い制約があり、企業は廃棄物や地元の資源で間に合わせ、既知のリスクと真の不確実性の下で即興し、関係者を巻き込み、外部の主体を説得していた。仲介組織と仲間の網が、本来は開発国家が担う変異・選択・ニッチ創出の機能を部分的に果たしていた（抄録）。", "p6": "この構成は企業の存続と局所的な社会的価値を支えるが、それだけでは即興を正式な制度に固めにくい「方向性なき社会イノベーション」だとする（抄録）。解釈：10社の事例からの一般化には限界がある。", "fun": "国が頼れないとき、起業家は「あるものでなんとかする」を毎日の仕事のやり方にしていた。国の代わりに仲間どうしのつながりが支え合いの役を果たすが、それだけでは長続きする仕組みにはなりにくい。困難な場所での工夫の強さと限界の両方が見える。", "unverified": "なし"}}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "ボルト接合の動特性をベイズ逆部分構造法で推定", "title": "A Bayesian Framework for Inverse Identification of Bolted Joint Dynamics using Frequency-Based Substructuring", "url": "https://doi.org/10.2139/ssrn.7625983", "authors": "Mark Jackson ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Jackson, M., Coletti, K., Moldenhauer, B. J., Roettgen, D., & Davis, B. (2026). A Bayesian Framework for Inverse Identification of Bolted Joint Dynamics using Frequency-Based Substructuring. https://doi.org/10.2139/ssrn.7625983", "why": "悪条件なFRF行列の逆演算に頼る従来法に対し、接合部の動剛性とその不確実性を確率的に推定する枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ボルト接合部の動剛性と減衰を、悪条件な周波数応答関数（FRF）行列を直接逆算せずに、階層ベイズで不確実性つきに推定する逆部分構造法を提案した（抄録）。", "p2": "逆部分構造法はFRF行列の逆算で接合部の動特性を求めるが、FRF行列は悪条件で反共振は雑音に敏感なため推定が不安定で、標準的な方法では不確実性も評価できない（抄録）。", "p3": "チャネルごとに未知の分散をもつセンサ雑音を明示的にモデル化し、解析的に周辺化して複素t尤度を得る。接合パラメータには物理的に妥当な値へ寄せる事前分布を与え、事後分布から信用区間を作る（抄録）。", "p4": "数値シミュレーションの2つの組立体で検証した。1つは部分構造間に粘弾性接合モデルをもつ離散的な質量-ばね-減衰系、もう1つは線形弾性要素で結ばれた2本の梁の3次元有限要素モデルで、界面の自由度を結ぶ無質量要素の線形剛性と減衰を同定した（抄録）。", "p5": "提案法は組立体の全FRF行列の直接逆算を不要にすることで接合部の推定を改善し、推定の不確実性を定量化する手段を与えたとする（抄録）。精度の数値は抄録にない。", "p6": "検証は数値シミュレーションと線形の接合に限られる（抄録）。解釈：実験データや摩擦による非線形な接合への適用は今後の課題と考えられる。", "fun": "2つの部品をボルトでつなぐと、つなぎ目の硬さが全体の揺れ方を左右するが、その硬さは直接測れない。全体と部品の揺れ方から逆算するのが普通だが、雑音に弱い。この研究は「どのくらい自信があるか」まで含めて答える確率の考え方で、逆算を安定させた。", "unverified": "推定精度の数値は本文未入手のため未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "男女賃金差別の縮小がもたらすマクロ効果", "title": "The Macroeconomics of Gender Equality: Reducing Wage Gaps in a Developing Economy", "url": "https://doi.org/10.2139/ssrn.7629222", "authors": "Oscar Avila ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Avila, O., Grajales-Olarte, A., Ramos-Veloza, M. A., & Ospina-Tejeiro, J. J. (2026). The Macroeconomics of Gender Equality: Reducing Wage Gaps in a Developing Economy. https://doi.org/10.2139/ssrn.7629222", "why": "男女の家計内意思決定を持つ小国開放経済の一般均衡モデルで、コロンビアの賃金差別縮小の効果を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "コロンビアで男女の賃金差別を半減させると、GDPと消費は増えるが、女性の厚生の伸びは男性より小さいことを一般均衡モデルで示した。", "p3": "男女の主体が市場労働と家事生産を共同で決める小国開放経済の一般均衡モデルを作り、賃金差別を減らす政策と、その財源を財政で賄う場合を比較した。", "p5": "賃金差の半減は女性の所得・総労働供給・投資を通じてGDPと消費を押し上げ、厚生は男女とも上がるが女性の方が小さい（余暇と家事生産を手放すため）。財政政策で実施すると利得は大幅に小さくなる（抄録）。", "fun": "女性の給料が上がれば女性が一番得をする、と考えがちだが、モデルで計算すると働く時間が増えて余暇や家の仕事を手放すぶん、得の大きさは男性の方が上回る。差別をなくすことと、女性の暮らしの満足を上げることは同じではない、という指摘が鋭い。", "unverified": "モデルの較正値と厚生の数値は本文未入手のため未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "不動産再評価と重なる地方税基盤の再配分", "title": "Property Valuation, Household Cash Flows, and Local Tax Bases", "url": "https://doi.org/10.2139/ssrn.7625982", "authors": "Arka Prava Bandyopadhyay", "venue": "SSRN", "date": "2026-10-17", "apa": "Bandyopadhyay, A. P. (2026). Property Valuation, Household Cash Flows, and Local Tax Bases. https://doi.org/10.2139/ssrn.7625982", "why": "再評価による税負担の再配分を、重なり合う複数の地方税基盤を保ちつつ実装できる程度として特徴づけた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "不動産の再評価で税額が重なり合う地方税基盤の間で再配分されるとき、目標の税額表をどこまで実装できるかを特徴づけた。", "p3": "クック郡の公開記録から1,034の税コードにまたがる598の独立した地区制約を取り出し、地区の課税基盤を保ち、未更新の納税者を守り、増額を抑える条件の下で税額を最適化した。", "p5": "地区最適化は比例的な調整より税額と目標の二乗乖離を18.9%減らした。支払い保護の罰則は増額の総額を56.9%減らしつつ改善の86.1%を保ち、対象の67.8%の税額を据え置いた（抄録）。厚生最適ではないと明記している。", "fun": "家の評価額が変わると固定資産税も変わるが、学区・消防・公園などの税が重なり合っていて、一つを動かすと他もずれる。パズルのように重なった制約の中で、誰の税額も急に跳ね上がらないよう配る方法を、実際の郡のデータで計算している。", "unverified": "なし"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "固有リスクの違いが家計ポートフォリオを分ける", "title": "Heterogeneous Idiosyncratic Risk and the Composition of Household Financial Portfolios", "url": "https://econpapers.repec.org/RePEc:bdm:wpaper:2026-05", "authors": "José Martínez", "venue": "RePEc NEP", "date": "2026-10-05", "why": "家計ごとに異なる固有リスクが資産構成の違いを説明するという、ポートフォリオ異質性の新しい説明を与えている。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "家計ごとの所得リスクの違いが、短期の流動的な預金と長期の非流動的な預金の配分の違いを説明することを示した。", "p3": "米国のミクロデータで預金の満期構造と所得リスクの関係を確かめ、不完備市場・異質な主体・2資産の連続時間マクロモデルで流動性需要の違いを再現した。", "p5": "固有の所得リスクが高い家計は短期の流動的預金を多く持ち、リスクが低い家計は長期の非流動的預金に多く配分していた。モデルはこの最適ポートフォリオの違いを再現した（抄録）。", "fun": "収入が不安定な人ほど、すぐ引き出せる普通預金に多く置き、安定した人ほど定期預金や長期の資産に回す。当たり前に見えるこの行動を、経済全体のモデルの中で説明できるようにした点がこの研究の新しさ。", "unverified": "使用したミクロデータの名称と推定値は抄録に記載がなく未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "インドのコアインフレ予測は単純な方が強い", "title": "Forecasting Indian Core Inflation: Simple Made Simpler", "url": "https://econpapers.repec.org/RePEc:een:camaaa:2026-83", "authors": "Rishabh Choudhary ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "多数の予測モデルを比較し、インドのコアインフレでは単純なモデルが優位かを検証した政策実務向けの研究。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "インドのコア消費者物価の予測で、多数の高度なモデルも単純な自己回帰を平均予測では上回れないことを示した。", "p3": "40の経済・金融指標の月次パネルで、自己回帰から因子モデル、分位点回帰、機械学習まで9種類のモデルを推定し、期待インフレや気候変数も考慮して、1・3・6・12か月先の二乗平均予測誤差で比べた。", "p5": "条件付き平均では、どのモデルもどの期間でも自己回帰より有意に小さな誤差を出さなかった。一方、分布予測では推定因子を含む分位点回帰がすべての分位点・期間で損失を減らした（抄録）。", "fun": "たくさんのデータと最新の機械学習を使っても、物価の「平均的な予想」は昔ながらの単純な方法に勝てなかった。ただし「どれくらい外れうるか」という幅の予想では、情報を足す価値があった。何を当てたいかで良い道具が変わる、という教訓。", "unverified": "なし"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "競合する脱炭素技術への最適な支援設計", "title": "Technology Neutrality vs. Policy Discrimination: Optimal Policy Design for Competing Green Technologies", "url": "https://doi.org/10.2139/ssrn.7625267", "authors": "Albin Kasser ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Kasser, A., & Meunier, G. (2026). Technology Neutrality vs. Policy Discrimination: Optimal Policy Design for Competing Green Technologies. https://doi.org/10.2139/ssrn.7625267", "why": "炭素差額契約で技術中立と技術別支援のどちらが望ましいかを、競合するグリーン技術の下で理論的に比較した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "競合する2つの脱炭素技術を支援するとき、技術中立の数量枠に技術別の補助を組み合わせるのが最適になりうることを示した。", "p3": "私的費用と社会的費用の差が技術ごとに異なり、費用ショックを企業だけが観察する設定で、価格・数量の手段を一律版と技術別版で比較した。異質な生産拠点の分布で総費用をミクロ的に基礎づけ、欧州のグリーン水素とブルー水素に応用した。", "p5": "費用の差が技術間で異なれば技術中立は配分を歪める。共通の数量枠と技術別の補助の組み合わせは、技術別の別枠より優れ、代替性が高いほど差別化の利得が大きい。数値シミュレーションでも的を絞った支援の厚生利得が確認された（抄録）。", "fun": "「どの技術でも同じ条件で競わせる」のは公平に見えるが、技術ごとに社会への迷惑の大きさが違うなら、その差だけは補正した方が全体として得になる。競争の柔軟さと狙い撃ちの補正をどう両立させるかを、水素の作り方の選択に当てはめている。", "unverified": "厚生利得の具体的な大きさは本文未入手のため未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "輸入単価の変化は構成変化に左右される", "title": "Beyond Face Value: How Composition Changes Affect Import Unit Values of Light Vehicles", "url": "https://econpapers.repec.org/RePEc:fip:fedgfn:103842", "authors": "Robin Braun ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "米国の小型車輸入で、単価指標が車種構成の変化にどれだけ影響されるかを分解し、価格統計の読み方を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの短い抄録のみを使用", "preprint": true, "short": true, "p1": "米国の小型車輸入の単価が、価格そのものではなく車種構成の変化にどれだけ左右されるかを問う研究。", "p3": "未確認（抄録には問題設定のみが書かれ、手法の記載がない）。", "p5": "未確認（抄録に結果の記載がない）。抄録は、小型車が米国の財輸入の約7%を占め、輸入物価指数でも重みが大きいと述べている。", "fun": "輸入車の「1台あたりの平均価格」が上がったとき、それは値上げなのか、高級車の割合が増えただけなのか。平均値は中身の入れ替わりでも動くので、物価を正しく測るにはその二つを切り分ける必要がある、という統計の基本的で奥深い問題。", "unverified": "手法と結果は抄録に記載がなく未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "キャッシュ循環期間と超過収益の持続", "title": "Cash Conversion Cycle and Sustained Abnormal Profitability: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7629403", "authors": "Gang Wei ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Wei, G., Chen, J., Fu, T., & Lu, H. (2026). Cash Conversion Cycle and Sustained Abnormal Profitability: Evidence from China. https://doi.org/10.2139/ssrn.7629403", "why": "中国製造業のパネルで、キャッシュ・コンバージョン・サイクルが競争水準を超える収益性の持続に関わるかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "キャッシュ・コンバージョン・サイクル（CCC）が短い企業ほど、競争水準を超える収益性を長く保てることを示した。", "p3": "中国A株の製造業2008〜2024年で、産業調整済み営業利益率の動学モデルをシステムGMMで推定し、超過収益の高さと持続性をあわせた企業年の指標を作ってCCCとの関係を調べた。", "p5": "CCCが短いほど持続的な超過収益が強く、営業資金の回収期間が長いと優位の維持が弱まった。操作変数、傾向スコアマッチングなどでも頑健で、企業間信用、総資産回転率、市場シェアが経路とされる（抄録）。", "fun": "商品を仕入れてから売上代金を回収するまでの日数が短い会社は、お金が早く回るぶん無理な借金をせずに済む。この研究は、その「お金の回転の速さ」が、一時的な好業績ではなく長く続く強さと結びつくことを示している。", "unverified": "効果の大きさは抄録に記載がなく未確認。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "CEOの文化的背景が投資効率を左右する", "title": "CEO Cultural Legacy and Corporate Investment Efficiency", "url": "https://doi.org/10.2139/ssrn.7629311", "aut
