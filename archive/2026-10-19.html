hors": "Busra Agcayazi", "venue": "SSRN", "date": "2026-10-18", "apa": "Agcayazi, B. (2026). CEO Cultural Legacy and Corporate Investment Efficiency. https://doi.org/10.2139/ssrn.7629311", "why": "CEOの国籍をHofstedeの文化次元に対応づけ、文化的背景が企業の投資効率の違いを説明するかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "CEOの出身文化（Hofstedeの文化次元）が企業の投資効率の違いを説明することを示した。", "p3": "CEOの国籍を文化次元に対応づけ、予測投資からの乖離を投資の非効率として測った。残差に基づく乖離を水準と散らばりの成分に分け、投資の上下へのずれと予測への合致度を区別した。", "p5": "不確実性回避と長期志向が強いほど過大投資が減り非効率は小さく、個人主義・男性性・充足・権力格差が高いほど過大投資で非効率が大きかった。6次元中4次元で散らばりの効果が保たれ、外部監視が弱いほど関係は強い（抄録）。", "fun": "慎重な文化で育った社長は投資もしすぎず、勢いを重んじる文化の社長は投資しすぎる傾向がある、という結果。会社のお金の使い方が、数字だけでなくトップの育った文化という目に見えない要素にも左右されうることを示している。", "unverified": "標本の国・期間・規模は抄録に記載がなく未確認。"}}, {"id": "pn24", "rank": 24, "field": "ヒューマンコンピュータインタラクション", "headline": "身体動作の注釈は相互行為上の実践である", "title": "Annotating embodied action as an interactionally accountable practice: Relevant Annotation in multimodal pragmatics, sign language, and multimodal AI", "url": "https://doi.org/10.2139/ssrn.7625798", "authors": "Mayumi Bono ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Bono, M., Poveda-Gutiérrez, S., Nishida, N., Sakaida, R., Inoue, K., Okada, T., & Miyao, Y. (2026). Annotating embodied action as an interactionally accountable practice: Relevant Annotation in multimodal pragmatics, sign language, and multimodal AI. https://doi.org/10.2139/ssrn.7625798", "why": "マルチモーダルAIの学習データにも関わる身体動作の注釈づけを、参与者の理解を示す相互行為の実践として捉え直した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "身振りなど身体動作の注釈は、形に基づく固定ラベルではなく、参与者の理解に根ざした相互行為上の記述であるべきだと論じ、その枠組みを示した。", "p3": "観察できる動きの下層記述と、参与者にとっての行為の上層記述を分け、両者をMETA層で統合するRelevant Annotationを用いた。日本科学未来館の科学コミュニケーション・コーパスで検証し、その記述を正解としてマルチモーダルLLMを事例比較した。", "p5": "身振りは形よりも投射と系列上の位置によって指示や受け手への配慮を達成していた。現在のモデルは身振りを孤立した視覚対象として扱い、文脈の統合が必要な場面で失敗した。日本手話コーパスへの予備的拡張も示した（抄録）。", "fun": "同じ「指さし」でも、会話のどの瞬間に出たかで「あれを見て」にも「あなたの番」にもなる。形だけ覚えたAIはこの違いが分からない。人の身振りの意味は動きの形ではなく会話の流れの中にある、という点が、AIの学習データの作り方を問い直している。", "unverified": "モデルの比較は事例比較で、定量的な精度は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "VLMは赤外画像の熱を読めるか", "title": "Can vision-language models read heat? Diagnosing, teaching and bounding thermal literacy for aerial infrared perception", "url": "https://doi.org/10.2139/ssrn.7629398", "authors": "Ajinkya Jadhav", "venue": "SSRN", "date": "2026-10-18", "apa": "Jadhav, A. (2026). Can vision-language models read heat? Diagnosing, teaching and bounding thermal literacy for aerial infrared perception. https://doi.org/10.2139/ssrn.7629398", "why": "視覚言語モデルが熱画像の見かけの温度を読めるのか、物体を認識しているだけかを診断し、学習と限界を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "視覚言語モデル（VLM）が赤外画像の「熱」を読めるのかを診断し、学習で改善できる範囲と限界を示した。", "p3": "6センサの27,925フレームでベンチマークを系列に配慮して再分割し（元の5ソースでは試験フレームの95〜98%に類似の訓練フレームがあった）、タグ付きの物体のうち最も温かいものを答えるHeatRankを作った。言語側のみの微調整と検証可能報酬の強化学習を比べた。", "p5": "既製の4モデルはタグを82〜95%読めたが、最も温かい物体は40〜60%しか当てられず（偶然は46%）。1,400例の微調整で92%になったが、黒を熱とする表示では20%に落ち、両極性で学習すると90%に回復した（抄録）。", "fun": "AIは赤外線カメラの画像を見て「人」や「車」は言い当てられても、どれが一番熱いかは当てずっぽう並みだった。しかも学習させると「明るい＝熱い」という近道を覚えてしまい、色の向きを逆にすると間違える。AIが本当に何を理解しているかを試す好例。", "unverified": "なし"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "敵対的な表現の撹乱でグラフから忘却する", "title": "Graph Unlearning via Adversarial Representation Confusion", "url": "https://doi.org/10.2139/ssrn.7629585", "authors": "Zhifan Huang ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Huang, Z., Lu, H., Yang, Y., Yuan, Y., Hu, T., & Ding, H. (2026). Graph Unlearning via Adversarial Representation Confusion. https://doi.org/10.2139/ssrn.7629585", "why": "グラフニューラルネットから特定データの影響を除くグラフ・アンラーニングを、表現の撹乱で効率よく行う方法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "学習済みのグラフニューラルネットから、指定したノード・特徴・辺の影響を効率よく取り除く手法GUARCを提案した。", "p3": "ノードと特徴の削除には局所的な敵対的特徴を、辺の削除には端点ラベルが一致する非辺の参照を作り、ドメイン敵対的最適化で削除対象と参照を表現空間で見分けにくくする。削除前後の予測差から影響を受ける近傍を特定し、予測保持の制約を課す。", "p5": "6つのベンチマークと複数のGNNで、忘却の効果・モデルの有用性・計算効率のいずれでも既存手法より良かったとする（抄録）。", "fun": "SNSの友達関係などで学習したAIから「この人のデータを消して」と頼まれても、全部を学習し直すのは大変。そこで、消したい部分を他と見分けがつかなくなるよう表現をかき混ぜて忘れさせる、という逆転の発想を使っている。", "unverified": "具体的な数値は抄録に記載がなく未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "小型言語モデルの安全性手法を批判的に総覧", "title": "Safety and Alignment of Small Language Models: A Critical Survey of Methods and Evaluation", "url": "https://doi.org/10.2139/ssrn.7625461", "authors": "Robert-Mihai Colca", "venue": "SSRN", "date": "2026-10-17", "apa": "Colca, R.-M. (2026). Safety and Alignment of Small Language Models: A Critical Survey of Methods and Evaluation. https://doi.org/10.2139/ssrn.7625461", "why": "小型言語モデルの安全性・アラインメント手法を、介入・利用文脈・評価手順の観点から批判的に整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "約70億パラメータ以下の小型言語モデルの安全性・アラインメント手法と評価を、批判的に整理した総説。", "p3": "データ、学習時のアラインメント、運用時の安全装置、編集とアンラーニング、効率化、多言語評価、機構的解釈性に分けて証拠を整理した。別に、6,681件の過去のモデレーション応答の監査と、3人の評価者による12件の応答評価も行った。", "p5": "有害生成の抑制、拒否の増加、危険知識の抑制は無害な有用性にそれぞれ異なる影響を与え、パラメータ効率や指示追従の総合点は敵対的頑健性を保証しないとした。監査では指標の混同や不完全な記録が結論を妨げた（抄録）。", "fun": "小さくて安いAIを安全にする工夫はいろいろあるが、「危ないことを言わない」ように締めつけると「普通の質問にも答えなくなる」ことがある。この総説は、安全だと言うには何を、どんな条件で、何件中何件失敗したかまで記録すべきだと指摘している。", "unverified": "文献の網羅性は著者自身が限定的としている。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "規模拡大型と効率改善型で将来業績が違う", "title": "Future firm performance across extensively and intensively growing firms", "url": "https://doi.org/10.2139/ssrn.7624581", "authors": "Peter B. Vassallo ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Vassallo, P. B., & Richardson, G. (2026). Future firm performance across extensively and intensively growing firms. https://doi.org/10.2139/ssrn.7624581", "why": "成長の仕方（規模拡大か資産効率の向上か）によって将来の企業業績の予測可能性が異なるかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "成長企業を規模拡大型と資産効率改善型に分けると、それぞれの将来業績を7年先まで予測できることを示した。", "p3": "純営業資産に対する市場収益で全体の成長を捉え、純営業資産の変化と営業利益の変化のどちらが優勢かで2つの成長の型を区別した。", "p5": "それぞれの規模戦略は7年の予測期間で有意に予測でき、将来の純営業資産の変化と営業利益の水準、企業業績にも反映された（抄録）。成長企業の将来業績を区別できないという長年の謎を解くとしている。", "fun": "会社の成長には、店や工場を増やして大きくなる道と、今ある設備でより多く稼ぐ道がある。どちらの道を歩んでいるかを財務データから見分けると、数年先の業績まで読めるようになる、という点が面白い。", "unverified": "標本の国・期間と予測精度の数値は抄録に記載がなく未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "幾何を明示する系列化Transformerで点群分割", "title": "Geo-Former: Explicit Geometry Modeling with Serialized Transformers for Point Cloud Semantic Segmentation", "url": "https://doi.org/10.2139/ssrn.7625800", "authors": "Yanghui Guo ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Guo, Y., Li, K., Guo, Y., Wang, L., & Chen, S. (2026). Geo-Former: Explicit Geometry Modeling with Serialized Transformers for Point Cloud Semantic Segmentation. https://doi.org/10.2139/ssrn.7625800", "why": "点群を系列化するTransformerに局所幾何の明示的なモデル化を加え、大規模3次元シーンの意味分割を改善した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "点群を系列に並べて処理するTransformerに局所幾何の明示的なモデル化を加え、3次元点群の意味分割を改善するGeo-Formerを提案した。", "p3": "点の座標と共分散統計で局所・大域の幾何を表し、FiLMで特徴を変調する。深さ方向畳み込みで近傍を集約し、系列誘導型のゲートで注意の更新を安定させ、デコーダで多スケールの注意を使う。", "p5": "ScanNet v2、ScanNet200、nuScenesの実験で有効性と拡張性を示したとする（抄録）。", "fun": "3次元スキャンの点の集まりを一列に並べると文章のように処理できて速いが、そのぶん「この辺は平ら」「ここは角」といった形の情報が薄れる。点の散らばり方の統計を足して形の感覚を取り戻させた、という工夫。", "unverified": "具体的な精度の数値は抄録に記載がなく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "列車すれ違い位置の不確実性で走行安全を評価", "title": "Probabilistic Assessment of Running Safety for Deck Arch Bridges under the Dual Randomness of Track Irregularities and Train Meeting Positions", "url": "https://doi.org/10.1142/s0219455428500551", "authors": "Wei Liu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-10-16", "citescore": 6.5, "citescore_year": "2025", "apa": "Liu, W., Zhou, Z., Tao, Q., & Nan, Z. (2026). Probabilistic Assessment of Running Safety for Deck Arch Bridges under the Dual Randomness of Track Irregularities and Train Meeting Positions. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500551", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "高速列車が上路式アーチ橋の上ですれ違う位置の不確実性と軌道不整の不確実性を同時に扱い、車両-橋梁連成振動の期待応答を効率よく求める「二重確率」の評価枠組みを作った（抄録）。", "p2": "従来の確定的な解析はすれ違い位置の空間的なばらつきを無視し、特定の位置での極値包絡で評価するため、安全性の評価を歪め、設計の余裕を過大にしうる（抄録）。", "p3": "まず軌道不整のみの単一確率モデルで、系の動的応答がすれ違い位置にどれだけ敏感かを調べ、最も不利な領域を特定した。次にすれ違い位置を離散確率変数としてモデルに入れ、確率積分法で橋全体の期待応答を求めた。直観：最悪位置だけでなく、ありうる位置の重みつき平均を取る（抄録）。", "p4": "比較の基準は大標本モンテカルロ・シミュレーションとの一致度と計算効率、および確定的な極値との差（抄録）。", "p5": "上路式アーチ橋の応答はすれ違い位置に非常に敏感で、最も不利な位置は従来想定のスパン中央ではなく3L/8だった。二重確率モデルはモンテカルロとよく一致し、計算効率を大きく高めた。基準条件で車体加速度の期待値は1.114 m/s²で、3L/8位置での確定的な極値1.217 m/s²より約8.5%低かった（抄録）。", "p6": "結果は数値解析によるもので、実測での検証は抄録に記載がない。解釈：期待値で評価すると、まれだが危険な位置での極値を見落とさないための安全側の扱いをどう設計に残すかが論点になる。", "fun": "2本の新幹線が橋の上ですれ違うとき、「一番揺れる場所ですれ違ったら」という最悪の場合だけで設計すると、橋は必要以上に頑丈になる。実際にはすれ違う場所はばらばら。この研究は、その起こりやすさを重みにして平均的な揺れを計算し、しかも一番揺れる場所は真ん中ではないことを見つけた。", "unverified": "橋の諸元、列車の速度条件、計算時間の比較の数値は本文未入手のため未確認。"}}, {"id": "jr02", "rank": 2, "headline": "経済的困窮地域では統制感の手がかりが紛争化を左右", "title": "Perceived-Control Salience in Service Recovery: Area-Level Economic Disadvantage and Consumer Disputes", "url": "https://doi.org/10.1177/10946705261485818", "authors": "Yulei Li ほか", "venue": "Journal of Service Research", "date": "2026-10-18", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Li, Y., Lin, Z., Hewitt, M., & Shan, S. (2026). Perceived-Control Salience in Service Recovery: Area-Level Economic Disadvantage and Consumer Disputes. Journal of Service Research. https://doi.org/10.1177/10946705261485818", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "経済的に不利な地域の消費者がサービス回復の場面で紛争へ進むかどうかを、苦情の文章に現れる7つの「統制感の手がかり（perceived-control salience）」で説明する枠組みを示した（抄録）。", "p2": "サービス回復の研究は、経済的に不利な地域の消費者がどの手がかりに反応して苦情を紛争へエスカレートさせるかを十分に扱っておらず、消費者の脆弱性の研究ともつながっていなかった（抄録）。", "p3": "米国消費者金融保護局（CFPB）に寄せられた141,251件の苦情の記述から、認知的・行動的・感情的・意思決定・予測・情報の各統制などの7次元の手がかりを測り、紛争へのエスカレーションとの関連を地域の経済的不利と合わせて分析した（抄録）。", "p4": "結果変数は苦情が紛争（企業の対応への異議）に進んだかどうかで、各次元の関連の強さと方向を比べる（抄録）。テキストの測定方法の詳細は抄録に記載がない。", "p5": "認知的統制と行動的統制の手がかりが紛争と最も強く正に関連し、感情・意思決定・予測の統制は弱い正の関連、情報統制は負の関連だった（抄録）。経済的不利がどの手がかりが行動を予測するかを変えることを示したとする。", "p6": "関連の分析であり因果は示さない（解釈）。著者は、効果的な回復には理解の負担を減らし行動の費用を下げ、情報開示だけで十分な支援とみなさないことが必要だと示唆する（抄録）。", "fun": "苦情を言っても話が通じない、手続きが面倒、というとき人は「自分ではどうにもできない」と感じて争いに進みやすい。この研究は14万件の苦情文から、その「どうにもできない感」の種類を読み取った。情報をたくさん渡しても、それだけでは助けにならない点が示唆的。", "unverified": "7次元の測定方法と効果の大きさは本文未入手のため未確認。"}}, {"id": "jr03", "rank": 3, "headline": "自然音は幸福に一貫して正の効果", "title": "Beyond noise and silence: urban soundscapes and their contribution to human well-being—a systematic review and meta-analysis", "url": "https://doi.org/10.1038/s42949-026-00482-2", "authors": "Xuan Guo ほか", "venue": "npj Urban Sustainability", "date": "2026-10-17", "sjr": 2.762, "citescore": 11.9, "citescore_year": "2025", "apa": "Guo, X., Schmidt, S., Chen, Z., Yang, L., Liu, J., & Albert, C. (2026). Beyond noise and silence: urban soundscapes and their contribution to human well-being—a systematic review and meta-analysis. Npj Urban Sustainability, 6(1). https://doi.org/10.1038/s42949-026-00482-2", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "npj Urban Sustainability掲載PDFの本文（Results、Discussion、Methodsの異質性・出版バイアスの節と図1〜8のキャプション）を読んだ", "preprint": false, "p1": "都市の音環境（サウンドスケープ）の幸福への寄与を、194研究の系統的レビューと66研究・1,658効果量のメタ分析で整理し、自然音が健康などに一貫して正の効果をもつことを示した（抄録、Results）。", "p2": "音環境の研究は騒音の低減に偏り、どの音がどの幸福の側面（環境体験・健康・行動・社会的幸福）にどれだけ効くかの証拠が断片的だった（Introduction）。", "p3": "ISO 12913-1の枠組みを分析用に組み替え（図1）、28の音源について、自然音と人の音の効果をHedgesのgで統合した。効果量の研究内の依存を多層メタ分析モデルで扱い、環境の種類・対照群の種類・暴露時間などの文脈要因を調整変数とした（Methods、図6〜8）。", "p4": "異質性はCochranのQで評価し、出版バイアスは多層版のEgger回帰と時間差バイアスの検定で確かめた（Methods）。調整変数の分析はBenjamini–Hochberg補正つきで探索的と位置づけている（Discussion）。", "p5": "自然音は幸福関連の結果に一貫して正の効果（g = 0.53〜0.59）で、健康で強かった（g = 0.59、95%CI [0.42, 0.76]）。人の音は行動反応（g = 0.60）と社会的幸福（g = 0.38）に限られた効果だった（抄録、図3）。自然音の精神的健康への効果はg = 1.07で、認知的健康への効果は10分超の暴露でのみ有意（g = 1.00）だった（図8）。研究の69.07%が自然音、69.07%が健康を扱い、3領域以上を同時に扱う研究はなかった（図2）。", "p6": "一次研究の設計・刺激・対照・指標・暴露時間の大きなばらつき、文脈情報の報告不足による粗いコード化、調整変数の分析の探索性、聴覚介入で盲検化が難しいことを限界に挙げる（Discussion）。小規模研究・時間差の効果が3つのモデルで検出された（Methods）。", "fun": "街の音対策といえば「うるさい音を減らす」ことだったが、この研究は「良い音を足す」発想を後押しする。鳥の声などの自然音は心と体の健康に安定してよい影響があり、しかも10分以上聞くと頭の働きにも効いてくる。耳から街づくりを考えるという視点が新鮮。", "unverified": "補足表（S1〜S22）の個々の数値は確認していない。"}}, {"id": "jr04", "rank": 4, "headline": "連続的なデータ収集は搾取感を高める", "title": "Served or Abused? A Cadence–Control–Calculus Framework of Perceived Exploitation in Artificial Intelligence–Driven Data Capture", "url": "https://doi.org/10.1177/23409444261493133", "authors": "Ignacio Manuel Luque-Raya ほか", "venue": "BRQ Business Research Quarterly", "date": "2026-10-18", "sjr": 1.477, "citescore": 10.4, "citescore_year": "2025", "apa": "Luque-Raya, I. M., Del Barrio-García, S., & Cordón García, Ó. (2026). Served or Abused? A Cadence–Control–Calculus Framework of Perceived Exploitation in Artificial Intelligence–Driven Data Capture. BRQ Business Research Quarterly, 29. https://doi.org/10.1177/23409444261493133", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "AIによる個人データの取得が「サービス」と感じられるか「搾取」と感じられるかを、取得の頻度（連続か断続か）、データと引き換えの価値の知覚、個人差の組み合わせで説明する枠組みを実験で検証した（抄録）。", "p2": "プライバシー計算（privacy calculus）の研究は、利用者が便益と危険を比べると考えるが、データ取得の頻度の設計と動機づけられた推論が搾取感にどう効くかは特定されていなかった（抄録）。", "p3": "オンラインの混合2×2実験で、連続取得と断続取得を参加者内で比べ、動機づけられた推論のプライム（対照は中立的な推論）を参加者間で操作した。データと引き換えの価値の知覚（PVDE）を媒介とした（抄録）。", "p4": "結果変数は知覚された搾取、不信、リスク、知覚された統制、連続取得の採用意図。AIへの態度、AIへの親しみ、社会経済的地位との関連も見た（抄録）。標本数は抄録に記載がない。", "p5": "連続取得は断続取得に比べ、搾取感・不信・リスクをやや高めたが、知覚された統制は変わらなかった。動機づけられた推論はPVDEを高め、それが搾取の評価を下げ、連続取得の採用意図を間接に高めた。AIへの肯定的態度と親しみは搾取の判断を弱め、社会経済的地位は関連しなかった（抄録）。", "p6": "オンライン実験による結果で、実際の製品利用での行動への一般化は今後の課題と考えられる（解釈）。著者は、PVDEを動機によって伸び縮みする仕組みとして位置づけている（抄録）。", "fun": "スマート機器がずっとデータを集めていると「見張られている」と感じる。でも「この機能のおかげで得をしている」と思えれば、同じ集め方でも気にならなくなる。しかも、その「得している感」は気持ちの持ち方で変わる。データの集め方より、受け止め方の方が大きく効くかもしれない点が面白い。", "unverified": "標本数と効果の大きさは本文未入手のため未確認。"}}, {"id": "jr05", "rank": 5, "headline": "在宅の家族介護者が最も長時間を担う", "title": "High Intensity, Persistent Burden: Family Caregiving Across the Long-term Care Continuum and Policy Implications", "url": "https://doi.org/10.1093/haschl/qxag282", "authors": "Alexa Bragg ほか", "venue": "Health Affairs Scholar", "date": "2026-10-15", "sjr": 1.675, "citescore": 2.5, "citescore_year": "2025", "apa": "Bragg, A., Zhang, Y., Davoodi, N. M., Reider, L., Fabius, C. D., Akré, E.-R. L., Wu, M. J. M., & Miller, K. E. M. (2026). High Intensity, Persistent Burden: Family Caregiving Across the Long-term Care Continuum and Policy Implications. Health Affairs Scholar. https://doi.org/10.1093/haschl/qxag282", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国の障害のある高齢者の家族介護者は、在宅・居住系施設・ナーシングホームのいずれでも負担を担い続け、施設入所で介護は消えずに形を変えることを示した（抄録）。", "p2": "家族介護者は在宅から施設まで高齢者を支えるが、介護の強度と介護者の幸福が居住の場によってどう違うかはほとんど分かっていなかった（抄録）。", "p3": "2021〜2024年のNHATS/NSOC（全米の高齢者と介護者の調査）を統合し、71歳以上の障害のある高齢者の主介護者を、在宅・居住系施設・ナーシングホームの3つの場で比べる反復横断分析を行った（抄録）。", "p4": "比較した指標は、介護者がいる割合、週あたりの介護時間、抑うつ・不安・経済的困難、感情的な困難、介護のための社会活動の断念、介護の利得の知覚（8点尺度で6以上）（抄録）。", "p5": "高齢者の60.4%に介護者がおり、ナーシングホーム入所者では74.4%、居住系施設63.8%、在宅58.8%だった。週あたり介護時間は在宅で34.7時間と最も長く、居住系14.4時間、ナーシングホーム13.7時間。抑うつ・不安・経済的困難は場の間で似ており、感情的な困難は居住系（46.7%）とナーシングホーム（43.5%）で在宅（31.5%）より多かった。在宅の介護者は社会活動の断念（26.8%）も介護の利得（72.0%）も多かった（抄録）。", "p6": "反復横断の記述的比較で、場の選択による選択バイアスは調整の範囲でしか扱えない（解釈）。著者は、場を問わない支援の必要を結論とする（抄録）。", "fun": "親を施設に預ければ家族の介護は終わる、と思われがち。でもデータを見ると、施設に入った人の方が家族の介護者がいる割合はむしろ高く、気持ちのつらさも大きかった。時間は減っても役割は形を変えて続く、という「見えにくい介護」の姿が浮かぶ。", "unverified": "なし"}}, {"id": "jr06", "rank": 6, "headline": "ディーセントワークは配偶者支援下で出生意図を高める", "title": "Decent Work and Fertility Intentions Among Korean Working Women: The Moderating Role of Spousal Support", "url": "https://doi.org/10.1177/08948453261500157", "authors": "Cheongra Heo ほか", "venue": "Journal of Career Development", "date": "2026-10-18", "sjr": 1.277, "citescore": 9.3, "citescore_year": "2025", "apa": "Heo, C., & Lee, K.-H. (2026). Decent Work and Fertility Intentions Among Korean Working Women: The Moderating Role of Spousal Support. Journal of Career Development. https://doi.org/10.1177/08948453261500157", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "韓国の既婚の働く女性で、ディーセントワーク（働きがいのある人間らしい仕事）は、配偶者の支援が高いときに限り、仕事と家庭の相乗効果を通じて出生意図を高めることを3波データで示した（抄録）。", "p2": "性別による介護の期待と硬直的な労働市場が仕事と家庭の両立を妨げる韓国で、職場の条件と家庭の条件がどう組み合わさって女性の出生意図を形づくるかは十分に検証されていなかった（抄録）。", "p3": "仕事-家庭資源モデルと資源保存理論に基づき、ディーセントワーク→仕事-家庭葛藤（WFC）・仕事-家庭充実（WFE）→出生意図の経路が、両立への配偶者の支援で条件づけられるかを、調整つき媒介モデルで検定した（抄録）。", "p4": "300人の既婚の働く女性の3時点のデータを用い、条件付き間接効果を配偶者支援の高低で比べた（抄録）。", "p5": "ディーセントワークは、配偶者の支援が高いときにのみWFEを通じて出生意図と関連し、WFCを通じた条件付き間接効果は有意でなかった（抄録）。", "p6": "標本は300人で、自己報告に基づく（抄録）。解釈：出生意図は実際の出生行動とは異なり、意図から行動への移行は今後の検証課題である。", "fun": "よい職場で働けば子どもを持ちたいと思える、とは限らない。家でパートナーが支えてくれてはじめて、仕事のよさが家庭にもプラスに広がり、子どもを持つ気持ちにつながる。職場と家庭の資源が掛け算で効く、という点が少子化を考えるうえで面白い。", "unverified": "効果の大きさは抄録に記載がなく未確認。"}}, {"id": "jr07", "rank": 7, "headline": "AI人事の受容要因は産業で異なる", "title": "Acceptance of AI-based human resource practices: Sectoral differences between technology-intensive and traditional industries", "url": "https://doi.org/10.26466/opusjsr.1991347", "authors": "Selma Kalkavan", "venue": "Opus uluslararası toplum araştırmaları dergisi", "date": "2026-10-17", "apa": "Kalkavan, S. (2026). Acceptance of AI-based human resource practices: Sectoral differences between technology-intensive and traditional industries. OPUS Journal of Society Research, 23(2026), 1–18. https://doi.org/10.26466/opusjsr.1991347", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の論文ページ（DergiPark）から読めたのは抄録と書誌情報のみで、本文の表は未入手", "preprint": false, "p1": "AIを使った人事施策（採用・評価・研修計画・タレント管理）を従業員が受け入れるかどうかの決め手が、技術集約型の産業と伝統的な産業で異なることを示した（抄録）。", "p2": "AI人事の受容の研究は産業の違いをあまり考慮しておらず、どの要因がどの人事機能で効くかの違いも整理されていなかった（抄録）。", "p3": "6産業から各60人、計360人の従業員を調べた。技術集約型はバイオテクノロジー・情報技術・コンピュータ/電子/光学製品製造、伝統型は小売・繊維・ホテル。有用性、使いやすさ、AIへの信頼、アルゴリズムの公平性と透明性、人間味の喪失を説明変数とした（抄録）。", "p4": "産業群ごとの回帰と、産業群との交互作用を4つの人事機能別に推定した（抄録）。", "p5": "技術集約型では有用性・使いやすさ・信頼が受容を正に予測し、伝統型では公平性と透明性が正に、人間味の喪失が負に予測した。有意な交互作用は5つで、公平性・透明性の効果は採用と評価で伝統型の方が強く、人間味の喪失の負の効果は採用で伝統型の方が強かった。受容は記述的に研修計画とタレント管理で採用・評価より高かった（抄録）。", "p6": "各産業60人の横断調査で、産業の代表性には限界がある（解釈）。係数の大きさは抄録に記載がない。", "fun": "IT企業の社員は「便利で信頼できればAI人事もOK」と考える一方、ホテルや小売の社員は「公平か、人の温かみが失われないか」を重視していた。同じAIの導入でも、職場の文化によって気にするポイントが違う、という点が導入の進め方を考えるうえで面白い。", "unverified": "回帰係数と国（調査地）の詳細は本文未入手のため未確認。"}}, {"id": "jr08", "rank": 8, "headline": "実橋試験データからイタリア既設橋の部分安全係数", "title": "Proposal of partial safety factors for structural assessment of existing Italian highway bridges based on experimental data", "url": "https://doi.org/10.1002/suco.70834", "authors": "Ludovico Alberico Grieco ほか", "venue": "Structural Concrete", "date": "2026-10-16", "citescore": 6.6, "citescore_year": "2025", "apa": "Grieco, L. A., Losanno, D., & Parisi, F. (2026). Proposal of partial safety factors for structural assessment of existing Italian highway bridges based on experimental data. Structural Concrete. https://doi.org/10.1002/suco.70834", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "イタリアの既設RC・PC道路橋8橋の実験データから、残存供用期間・知識水準・引き下げた目標信頼度を考慮した材料の部分安全係数を信頼性に基づいて算定し、現行指針と比べた（抄録）。", "p2": "既設橋の安全性評価では新設橋用の部分安全係数がそのまま使われがちだが、既設橋では残存期間や診断で得られる情報量が異なり、それに応じた係数の根拠が不足していた（抄録）。", "p3": "イタリア公共事業高等評議会と大学研究所ネットワークの研究計画の中で、信頼性ベースの枠組みにより、コンクリートと鉄筋の部分安全係数を、構造系全体・上部工/下部工・部材（床版・主桁・横桁・梁・橋脚・橋台）の複数の空間スケールで評価した（抄録）。", "p4": "1960〜1980年に建設されたイタリアの代表的な桁橋8橋の実験結果を用い、データの集約・分解に対する設計値の感度を系統的に評価した。結果を既設橋の安全評価・維持管理の現行指針と比較し、1橋への適用例を示した（抄録）。", "p5": "現行規定と信頼性に基づく提案値の違いを明らかにし、1橋への適用で提案係数を実務に組み込む方法を示した。信頼性に基づく較正の必要性を強調している（抄録）。係数の具体的な値は抄録に記載がない。", "p6": "対象は1960〜1980年代のイタリアの桁橋8橋に限られる（抄録）。解釈：他の年代・形式の橋や他国の材料ばらつきへの適用性は残る疑問である。", "fun": "古い橋の安全を確かめるとき、新しい橋と同じ「余裕の掛け算」を使うと、必要以上に危ないと判定されることがある。実際に古い橋から取った材料のデータで、その掛け算の大きさを決め直そうという研究。どの単位でデータをまとめるかで答えが変わる点も大事。", "unverified": "算定された部分安全係数の数値は本文未入手のため未確認。"}}, {"id": "jr09", "rank": 9, "headline": "NYSE金融253社のAI実装開示を3状態で分類", "title": "Public technical disclosure of AI implementation in finance: Python-framed evidence from 253 NYSE-listed financial companies", "url": "https://doi.org/10.1186/s40854-026-00979-w", "authors": "Veliota Drakopoulou", "venue": "Financial Innovation", "date": "2026-10-16", "citescore": 13.7, "citescore_year": "2025", "apa": "Drakopoulou, V. (2026). Public technical disclosure of AI implementation in finance: Python-framed evidence from 253 NYSE-listed financial companies. Financial Innovation, 12(1). https://doi.org/10.1186/s40854-026-00979-w", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Financial Innovation掲載PDFの本文（標本構築、表1〜5の結果、Discussion、限界、Conclusion）を読んだ", "preprint": false, "p1": "NYSE上場の金融企業253社について、AI実装に関する公開の技術開示を再現可能な手順でコード化し、一般的なAIの言葉は広く見られる一方、具体的な道具名や定量的な成果の主張はまれであることを示した（抄録、Discussion）。", "p2": "金融でのAI活用の議論は逸話・事例・独自データに頼ることが多く、上場企業が公開記録で実装をどう記述しているかを比較可能に測った証拠が乏しかった（Discussion）。", "p3": "取り込んだ554行から重複6行を除いた548行を審査し、企業ごとの錨となる253文と、直接確認の252文からなる505文のコーパスを作った。各社を「Pythonを明示」「間接的なAI」「なし」の3状態に分類し、チャネル別の分布と、定量的な成果の主張を測る成果主張指数（OCI）を算出した（抄録、表1）。", "p4": "9つの小業種と3状態のクロス表（表2、Cramér's V）、チャネル構造と技術名の分布（表3）、OCIの有病率と正確な信頼区間（表4）、直接確認の監査と符号者間比較（表5）で評価した。", "p5": "Python明示は34社（13.4%）、間接的なAIは216社（85.4%）、なしは3社（1.2%）（抄録、表2）。505文の25.7%が企業広報、24.4%が求人資料、21.0%が提出書類・正式な報告由来で、Python名は主に求人資料と技術文書に現れた（表3）。OCI陽性は5社・5文で、企業レベルの有病率1.98%（正確95%CI 0.64〜4.55%）だった（表4）。", "p6": "上場市場に限った横断的な枠で、公開記録の沈黙は不使用の証拠ではなく、具体的な記述も内部の高度さの証拠ではない。文の選択は境界で判断に依存し、すべての指標に完全な二重コーディングがあるわけではない（限界の節）。", "fun": "銀行や保険会社の「AIを活用しています」という言葉はほぼ全社に見つかるのに、「Pythonで何を作り、どれだけ成果が出たか」まで書いている会社はごくわずか。しかも具体的な道具の名前は、決算書より求人広告に出てくる。会社の本音は採用ページに表れる、という発見が面白い。", "unverified": "小業種別の内訳（表2の各セル）は確認していない。"}}, {"id": "jr10", "rank": 10, "headline": "私的都市に囲まれたカンポンの抵抗と帰属", "title": "Resisting gentrification: Density of belonging in strangled kampung of BSD City, Indonesia", "url": "https://doi.org/10.1177/00420980261493775", "authors": "Eka Permanasari ほか", "venue": "Urban Studies", "date": "2026-10-18", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Permanasari, E., Mahardhika, G. R., Witono Putra, M. D. P., & Dinata, M. (2026). Resisting gentrification: Density of belonging in strangled kampung of BSD City, Indonesia. Urban Studies. https://doi.org/10.1177/00420980261493775", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "インドネシアの私的計画都市BSDシティに囲い込まれた低所得集落（カンポン）が立ち退きに抗して残る仕組みを、場所に埋め込まれた記憶・愛着・宗教実践の集積である「帰属の密度」という概念で説明した（抄録）。", "p2": "東南アジアの都市化は低所得コミュニティを繰り返し追い出してきたが、私的都市の内部に取り残された小さな集落がどう存続するかは十分に論じられていなかった（抄録）。", "p3": "歴史的な都市形態のマッピング、カンポン住民への半構造化面接、8つの「締めつけられたカンポン」での現地観察を組み合わせた（抄録）。", "p4": "分析の軸は4つ：開発者による地図からの意図的な消去、囲い壁・制限された通路・人為的な浸水による境界づくり、モスク・祖先の墓・巡礼地による宗教文化的な錨、私的都市の中での適応的な経済実践（抄録）。", "p5": "カンポンの囲い込みは市場の自然な結果ではなく、スハルト政権の立地許可制度の意図的な産物だったとする。帰属の密度が、都市のレジリエンスの重要で見過ごされてきた次元として機能していることを示した（抄録）。", "p6": "8集落の質的研究である（抄録）。解釈：帰属の密度を他の都市で比較・測定する方法は今後の課題と考えられる。", "fun": "高級住宅街の真ん中に、昔からの小さな村が壁に囲まれて残っている。地図から消され、道をふさがれ、水まで流し込まれても村が残るのは、祖先の墓や祈りの場所に人々の思いが集まっているから。土地の値段では測れない「つながりの濃さ」が街を支えている点が興味深い。", "unverified": "なし"}}, {"id": "jr11", "rank": 11, "headline": "LLMで政策議論のフレームを抽出し評価する手順", "title": "A systematic workflow for utilizing and evaluating large language models in public health policy framing analysis", "url": "https://doi.org/10.1186/s13690-026-02089-6", "authors": "Johanna Wenderoth ほか", "venue": "Archives of Public Health", "date": "2026-10-17", "citescore": 5.3, "citescore_year": "2025", "apa": "Wenderoth, J., von Philipsborn, P., Leibinger, A., & Cimiano, P. (2026). A systematic workflow for utilizing and evaluating large language models in public health policy framing analysis. Archives of Public Health. https://doi.org/10.1186/s13690-026-02089-6", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "公衆衛生政策をめぐる報道のフレーム（論点の切り取り方）をLLMで抽出し、専門家のコードを基準に透明に評価する手順を作り、GPT-5で精度・再現率とも79.8%を得た（抄録）。", "p2": "政策論争の報道からフレームを特定する分析は、専門家が記事を手作業で読む必要があり、時間と資源がかかる（抄録）。", "p3": "ドイツの動物性食品への課税をめぐる報道のフレーム分析を基に、手作業でコードされた上位10の否定的フレームのすべての出現を46本の記事から抽出する手順を作った。記事ごとに1つのプロンプトによる少数例（few-shot）で、引用とフレームの組の一覧を生成させた（抄録）。", "p4": "人手のコードと照らし合わせ、適合率・再現率・F1を計算した。GPT-5とGemini 3.1 Pro Previewを比べた（抄録）。", "p5": "GPT-5は適合率79.8%、再現率79.8%で、手作業でコードされたフレームの75.2%を特定し、抽出した引用は人が抽出した箇所とおおむね一致した。Geminiは適合率が高く再現率が低く、F1は79.0%でGPT-5の79.8%と同程度だった（抄録）。", "p6": "1つの論争・46記事での評価で、他の政策領域や言語への一般化は今後の検証が要る（解釈）。著者は、複数の最先端モデルに一般化できる手法だと示唆する（抄録）。", "fun": "新聞記事を読んで「この記事は税金を『家計の負担』として描いている」と分類するのは、専門家でも骨の折れる作業。AIに任せたら8割ほどは専門家と同じ答えを出せた。大事なのは、AIの答えを専門家の答えと照らし合わせて点数をつける手順まで決めたところ。", "unverified": "なし"}}, {"id": "jr12", "rank": 12, "headline": "大型開発の許認可が地域の声を締め出す仕組み", "title": "Institutional closure in development governance: The repositioning of local voice", "url": "https://doi.org/10.1177/23996544261500369", "authors": "József Golovics ほか", "venue": "Environment and Planning C: Politics and Space", "date": "2026-10-18", "sjr": 1.227, "citescore": 6.3, "citescore_year": "2025", "apa": "Golovics, J., & Katona, M. (2026). Institutional closure in development governance: The repositioning of local voice. Environment and Planning C: Politics and Space. https://doi.org/10.1177/23996544261500369", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "グリーン移行に関わる大型産業開発で、参加の機会が形式的には残っていても、権限配分・許認可設計・手続きの順序によって地域の声が重要な決定から切り離される「制度的閉鎖」という概念を示した（抄録）。", "p2": "迅速化され手続き的に隔離された許認可の下で、地域の声がどの場で、どの段階で、どれだけ影響力を保つかは体系的に整理されていなかった（抄録）。", "p3": "ハンガリーの5自治体にまたがる6つのバッテリー関連事業の構造化された質的比較で、許認可の取り決めを再構成し、政治・参加・行政・法の各場での地域の声を追跡した（抄録）。", "p4": "比較の軸は、地域が介入できる場・段階と、重要な開発の選択がまだ開かれている場・段階との整合（抄録）。", "p5": "3つの主な軌跡が見られた：法・行政の場の比重が増す「司法化された声」、繰り返しの関与が許認可の核心への適時の影響力を失う「手続き的消耗」、関与が実施や緩和策に集中する「管理された関与」。地域の声はどの事例でも残ったが、軌跡も有効性も一様ではなかった（抄録）。", "p6": "6事業の質的比較で、軌跡は決定論的ではないとする（抄録）。解釈：速さと調整、熟議と異議申し立ての間の緊張をどう制度設計で和らげるかは開かれた問いである。", "fun": "住民説明会は開かれるのに、肝心なことはもう決まっている、という経験を説明する研究。話す場はあっても、話すタイミングと決める場所がずれていれば声は届かない。参加の「ある・なし」ではなく「いつ・どこで」が大事だという視点が鋭い。", "unverified": "なし"}}, {"id": "jr13", "rank": 13, "headline": "デジタル業務の要求は挑戦にも妨害にもなる", "title": "Strategic Competitive Intelligence and Digital Leadership: Cognitive Appraisal Pathways from Digital Work Demands to Service Innovation Inteligência Competitiva Estratégica e Liderança Digital: Percursos de Avaliação Cognitiva das Demandas do Trabalho Digital à Inovação em Serviços", "url": "https://doi.org/10.37497/eaglesustainable.v17i.1364", "authors": "Zhongmin Pi ほか", "venue": "Journal of Sustainable Competitive Intelligence", "date": "2026-10-16", "citescore": 0.3, "citescore_year": "2025", "apa": "Pi, Z., & Sun, X. (2026). Inteligência Competitiva Estratégica e Liderança Digital: Percursos de Avaliação Cognitiva das Demandas do Trabalho Digital à Inovação em Serviços. Journal of Sustainable Competitive Intelligence, 17, e01364. https://doi.org/10.37497/eaglesustainable.v17i.1364", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "掲載誌PDFの本文（方法、測定モデル、構造モデル、限界の節と表1〜8のキャプション）を読んだ", "preprint": false, "p1": "中国の5つ星ホテルの接客従業員で、デジタル業務の要求は「挑戦」と受け止められるとサービス革新を高め、「妨害」「脅威」と受け止められると下げること、デジタルリーダーシップがこの受け止め方を変えることを示した（抄録、§4）。", "p2": "競争情報（competitive intelligence）の研究は組織の情報手順を重視し、デジタル情報システムを実際に動かす現場の従業員が業務の要求をどう解釈するかを扱ってこなかった（§1）。", "p3": "デジタル業務の要求（DWD）→挑戦・妨害・脅威の3つの認知的評価→サービス革新パフォーマンス（SIP）の並列媒介に、知覚されたデジタルリーダーシップ（PDL）による第1段階の調整を加えたモデルを、PLS-SEMと5,000回のブートストラップで推定した（§3.3、図1）。", "p4": "772の5つ星ホテルから251施設を無作為抽出し、2026年5〜7月に3〜4週間間隔の2波調査を行い、照合後に品質基準を満たした453人を分析した（§3.1）。DWD・PDL・評価は1波目、SIPは2波目で測った。", "p5": "モデルは挑戦評価の29.8%、妨害5.8%、脅威10.9%、SIPの5.9%を説明した（§4.2）。要求は3つの評価すべてと正に関連し、挑戦はSIPを高め、妨害と脅威は下げた。評価を入れると直接効果は非有意だが総効果は正。PDLは要求と挑戦の関係を強め、脅威との関係を弱めたが、妨害は変えなかった（抄録）。", "p6": "著者は、対象が中国の5つ星ホテルの接客職に限られること、時間差の観察研究で因果は示せないこと、自己報告であること、競争情報を直接測っていないこと、PDLと評価が同じ波で測られPDLのrho_Aが1を超えたことを限界に挙げる（§4.8）。", "fun": "新しいシステムを覚えろと言われたとき、「成長のチャンス」と思えば工夫が生まれ、「邪魔」「仕事を奪われる」と思えば工夫が減る。同じ負担でも受け止め方で結果が逆になり、上司のデジタルな率い方がその受け止め方を変えられる、という点が職場づくりに示唆的。", "unverified": "表4・表7の各経路の係数とp値の数値は確認していない。"}}, {"id": "jr14", "rank": 14, "headline": "住民の声のテキスト分析で改修戦略に優先順位", "title": "A data-driven framework for prioritizing building retrofitting strategies based on residents' demands", "url": "https://doi.org/10.1108/ecam-05-2026-0937", "authors": "Chenchen He ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-10-18", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "He, C., Liu, S., & Liu, Z. (2026). A data-driven framework for prioritizing building retrofitting strategies based on residents’ demands. Engineering, Construction and Architectural Management, 1–17. https://doi.org/10.1108/ecam-05-2026-0937", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "住民の声のテキストから改修の需要を抽出・定量化し、不満の強さを加味して建物改修の戦略に優先順位を付けるデータ駆動の枠組みを作った（抄録）。", "p2": "大規模な建物改修では、構造化されていない住民の要望と技術的な改修策の間に溝があり、客観的で拡張可能な優先順位付けが難しかった（抄録）。", "p3": "テキストマイニングと感情分析で需要を抽出し、テキスト上の重要度と不満を組み合わせて需要の優先度を計算した。改良した品質機能展開（QFD）モデルで需要の区分を改修手法に写像して順位付けし、感情の調整の度合いλの感度分析を行った（抄録）。", "p4": "比較は、感情を加味した優先度と、テキスト上の重要度のみの優先度の違い、およびλを変えたときの順位の変化（抄録）。対象の団地・データ数は抄録に記載がない。", "p5": "不満を加味すると、需要の優先度は垂直移動（昇降）、給排水、温熱快適性などの基本的な住環境に集中し、いくつかの需要の順位が目立って変わった。基準シナリオ（λ = 0.5）では給排水改修、エレベーター設置、防水改修が上位3位で、総重みの52.10%を占めた（抄録）。", "p6": "λなどの設定に結果が依存する（抄録）。解釈：テキストを書く住民が全体を代表するかという標本の偏りが残る疑問である。", "fun": "住民アンケートで多く書かれている要望が、必ずしも一番困っていることとは限らない。この研究は「何回書かれたか」だけでなく「どれだけ怒っているか」も数に入れたら、エレベーターや水回りのような暮らしの基本が上位に来た。言葉の量と感情の強さを両方使う発想が面白い。", "unverified": "対象のデータの規模は本文未入手のため未確認。"}}, {"id": "jr15", "rank": 15, "headline": "韓国中小企業でCSRと人事が家族的論理で結びつく", "title": "Unpacking the Corporate Social Responsibility–Human Resource Management Nexus in SMEs: A Multilevel Institutional Perspective", "url": "https://doi.org/10.1177/23409444261493135", "authors": "Hyemi Shin ほか", "venue": "BRQ Business Research Quarterly", "date": "2026-10-18", "sjr": 1.477, "citescore": 10.4, "citescore_year": "2025", "apa": "Shin, H., Golob, U., Podnar, K., & Kohont, A. (2026). Unpacking the Corporate Social Responsibility–Human Resource Management Nexus in SMEs: A Multilevel Institutional Perspective. BRQ Business Research Quarterly, 29. https://doi.org/10.1177/23409444261493135", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "韓国の中小企業で、CSR（企業の社会的責任）と人事管理が、共同体と家族の論理を通じて家父長的な雇用関係の中で統合されていることを、多層の制度的枠組みで示した（抄録）。", "p2": "CSRと人事の結びつきは主に大企業や欧米の文脈で論じられ、儒教的な文脈の中小企業で制度的論理がどう雇用関係に具体化されるかは十分に検討されていなかった（抄録）。", "p3": "韓国の中小企業の質的データから、マクロの社会的論理、メソのCSR-人事の取り決め、ミクロの経営者の裁量の3水準の枠組みを構築した（抄録）。", "p4": "分析の焦点は、制度的論理がCSR-人事の統合をどう構造化するか、CSRと人事が埋め込まれた価値体系を通じてどう共進化するか、家族の論理が家族所有を超えて広がるか（抄録）。事例数は抄録に記載がない。", "p5": "家族の論理は、ケアと経営者の裁量が共存する家父長的な雇用関係として表れ、CSRと人事がおおむね整合した構成を生む一方、潜在的な権力の非対称を残していた（抄録）。複数の論理の対立を強調する説明に対する境界条件を示したとする。", "p6": "質的研究で一般化には限界がある（解釈）。抄録は、整合的に見える構成の裏にある権力の非対称を今後の論点として示唆している。", "fun": "「社員は家族だ」と言う小さな会社では、社員を大事にすることと社長が何でも決めることが同時に起きている。優しさと支配が同じ根っこから出ている、という二面性を描いた点が面白い。", "unverified": "対象企業の数と面接の規模は本文未入手のため未確認。"}}, {"id": "jr16", "rank": 16, "headline": "グラフ注意網と微分可能逆解析で中空床版橋の損傷同定", "title": "Efficient damage identification in hollow slab girder bridges using a hybrid graph-attention network and differentia ": "Functional Deception in Commercial Large Language Models: Cross-Model Evidence and Implications For AI-Assisted Decision-Making", "url": "https://doi.org/10.1922/comdem.v3i3s.18675", "authors": "Kirill Patyrykin ほか", "venue": "Computer and Decision Making: An International Journal", "date": "2026-10-18", "citescore": 5.7, "citescore_year": "2025", "apa": "Kirill Patyrykin, Anatoly Bystrov, & Jonathan Mair. (2026). Functional Deception in Commercial Large Language Models: Cross-Model Evidence and Implications For AI-Assisted Decision-Making. Computer and Decision Making: An International Journal, 3(3S), 168–182. https://doi.org/10.1922/comdem.v3i3s.18675", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "LLMの「機能的な欺瞞」を、信念や意図を仮定せず行動から観察できる概念として定義し、商用13モデルで測った。", "p3": "2つのアプリで擬人的な自己描写、秘密を隠すゲーム、誤った専門家の枠付け、重層的な人物設定などの多ターン課題を、多くはモデルごとに3回ずつ実行した。", "p5": "結果は課題とプロンプトに強く依存し、直接の擬人化では36回中8回、社交的な親和では36回中25回が基準を満たした。誤情報の枠付けでは物理のはったりで38回中35回、政治的人物設定で39回中17回だった（抄録）。", "fun": "AIが間違えるのと、AIがだますのとは違う。この研究は「AIに心があるか」を問わず、知っているはずの情報と見せる答えが食い違い、しかも相手を誤らせる働きをしているかを外から判定する。キャラクター設定一つでだまし方が変わる点が興味深い。", "unverified": "モデル名と課題ごとの詳細は本文未入手のため未確認。"}}, {"id": "jr24", "rank": 24, "headline": "API専用LLMの適合予測を意味的事前で安定化", "title": "Semantic Prior Smoothing for Conformal Prediction in Multiple-Choice Question Answering with API-Only Large Language Models", "url": "https://doi.org/10.3390/math14203761", "authors": "Yikai Chen ほか", "venue": "Mathematics", "date": "2026-10-16", "citescore": 5.4, "citescore_year": "2025", "apa": "Chen, Y., Lang, B., & Wei, Y. (2026). Semantic Prior Smoothing for Conformal Prediction in Multiple-Choice Question Answering with API-Only Large Language Models. Mathematics, 14(20), 3761. https://doi.org/10.3390/math14203761", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "内部の確率が見えないAPI専用のLLMで多肢選択問題に適合予測を使うとき、予測集合が全選択肢に膨らむ「効率の崩壊」を防ぐ手法SemPriorを提案した。", "p3": "繰り返し回答の頻度で確率を推定すると粗くなる点に着目し、崩壊の正確な有限標本条件を導いた。選択肢の理由づけの意味的な証拠から非一様なディリクレ事前分布を作り、観測頻度と組み合わせる。標準の非適合度スコアと分割適合較正は変えない。", "p5": "4つのデータセットで、名目に近い被覆率を保ったまま予測集合を概ね小さくでき、事前設定と較正集合の大きさにも安定だった（抄録）。", "fun": "AIに同じ問題を何回か答えさせ、その割合で自信を測ると、回数が少ないと0回の選択肢が出てしまい「全部ありうる」という役に立たない答えになる。理由の文章から手がかりを足して、少ない試行でも絞り込めるようにした工夫が面白い。", "unverified": "集合の大きさの具体的な数値は抄録に記載がなく未確認。"}}, {"id": "jr25", "rank": 25, "headline": "世代間の地域行事で高齢者の孤立に対処", "title": "‘Sahjeevan’ Community Events: Promoting Healthy Ageing and Caregiving Through Intergenerational Engagement in Rural India", "url": "https://doi.org/10.1177/10901981261494554", "authors": "Arjunkumar Jakasania ほか", "venue": "Health Education & Behavior", "date": "2026-10-18", "citescore": 4.5, "citescore_year": "2025", "apa": "Jakasania, A., Bopche, C., Misra, S., Pethe, R. R., Dhatrak, A. A., Bhuyar, M., Maliye, C., Gupta, S. S., & Paradkar, R. J. (2026). ‘Sahjeevan’ Community Events: Promoting Healthy Ageing and Caregiving Through Intergenerational Engagement in Rural India. Health Education & Behavior. https://doi.org/10.1177/10901981261494554", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。実践報告", "preprint": false, "short": true, "p1": "インド農村の100村で、世代間の交流行事を通じて高齢者の健康的な加齢とケアを支える実践モデルを報告した。", "p3": "一次医療の仕組みに組み込み、保健ワーカー、地方行政、学校、地域団体と連携して30回の行事を開いた。高齢者を受け手ではなく参加者・助言者・ケアの担い手として位置づけ、健診、セルフケア教育、創作活動、世代間交流を行った。", "p5": "約1,800人の高齢者、800人の子ども、169人の地域保健ワーカーが参加し、高い参加、健康意識の向上、社会的つながりの強化が観察されたとする（抄録）。統制群を置いた効果推定ではない。", "fun": "お年寄りを「支えられる人」ではなく、子どもに教えたり世話をしたりする「支える人」として行事に招くと、孤立や年齢への偏見が和らぐかもしれない。役割をひっくり返す発想そのものが、地域の包摂を考えるうえで面白い。", "unverified": "効果の測定方法と数値は抄録に記載がなく未確認。"}}, {"id": "jr26", "rank": 26, "headline": "看護ケアの欠落と虐待的監督・LMXの共起型", "title": "Co-occurrence of missed nursing care, abusive supervision, and leader-member exchange: a latent profile analysis", "url": "https://doi.org/10.1186/s12912-026-05529-4", "authors": "Shuang H ": "International Journal of Science and Research Archive", "date": "2026-10-18", "apa": "Jahnavi, V. L., Sree, V. G., Amrutha, G. L. B. S., & Prasad, J. L. (2026). COMPARATIVE EVALUATION OF CREDIT RISK AND LOAN DEFAULT PREDICTION MODELS BY MACHINE LEARNING. International Journal of Science and Research Archive, 21(1), 394–401. https://doi.org/10.30574/ijsra.2026.21.1.1873", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "Home Credit Default Riskデータで、4つの分類器による融資の債務不履行予測を同じ前処理・評価基準で比較する枠組みを示した。", "p3": "ロジスティック回帰、勾配ブースティング、XGBoost、SVMを、所得・借入額・雇用・属性・外部信用スコアなど14変数で学習させた。中央値補完と層化分割を行い、クラス不均衡を考慮して精度・適合率・再現率・F1・ROC-AUCで評価した。", "p5": "抄録には各モデルの成績の数値が示されていない。機械学習の分類が信用リスク分析に適用できることを示したとしている（抄録）。", "fun": "お金を返せなくなる人は全体の一部なので、「全員返せる」と答えるだけでも正解率は高く見えてしまう。だから正解率以外の物差しで比べる必要がある、という評価の落とし穴を意識している点が学べる。", "unverified": "モデルごとの性能の数値は抄録に記載がなく未確認。"}}, {"id": "jr34", "rank": 34, "headline": "キサンタンガム改良土の構造劣化をモデル化", "title": "Modelling the Destructuring in Xanthan gum biopolymer-treated soils: Insights from the Untreated Compression Line", "url": "https://doi.org/10.1139/cgj-2026-0753", "authors": "Alok Chandra ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-17", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Chandra, A., & Siddiqua, S. (2026). Modelling the Destructuring in Xanthan gum biopolymer-treated soils: Insights from the Untreated Compression Line. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0753", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（上位10%誌の新着として取得）を使用", "preprint": false, "short": true, "p1": "キサンタンガムで改良した砂-ベントナイト混合土の圧縮時の構造劣化を、未処理土の圧縮線（UCL）を基準に解釈する枠組みを示した。", "p3": "キサンタンガム含有率1〜3%、養生1〜90日の試料で圧縮試験を行い、未処理の正規圧縮線を力学的な基準として構造の壊れ方を読み、電子顕微鏡で微視構造を観察した。", "p5": "含有率が高いほど膨潤間隙比・再圧縮指数・降伏応力が上がり、降伏後に構造が壊れていった。養生が長いとハイドロゲルが緻密化して壊れにくくなり、一軸圧縮強さと劣化パラメータの強い相関から簡易な予測式を作った（抄録）。", "fun": "食品のとろみ付けにも使うキサンタンガムを土に混ぜると、粒の間に「ゲルの橋」ができて土が強くなる。押しつぶすとその橋が崩れていく様子を、混ぜていない土の線と比べて読み取るという、基準線を一本引く発想が分かりやすい。", "unverified": "なし"}}, {"id": "jr35", "rank": 35, "headline": "交通アクセスと建築環境が孤独と社会的支援に影響", "title": "Influence of transportation accessibility and built environment on loneliness and social support", "url": "https://doi.org/10.1080/21650020.2026.2743962", "authors": "Shubha Bamney ほか", "venue": "Urban, Planning and Transport Research", "date": "2026-10-17", "citescore": 3.5, "citescore_year": "2025", "apa": "Bamney, S., Jain, J., & Pulugurtha, S. S. (2026). Influence of transportation accessibility and built environment on loneliness and social support. Urban, Planning and Transport Research, 14(1). https://doi.org/10.1080/21650020.2026.2743962", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "出版社サイトからも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、交通アクセスと建築環境が、孤独感と社会的支援にどう影響するかを調べた研究と読み取れる。抄録・本文を取得できなかったため、対象・データ・結果は題名から言える範囲を超えては分からない。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "バス停が遠い、歩道がない、といった街のつくりが、人に会いにくくさせて孤独を深めているのかもしれない。孤独を心の問題だけでなく、交通や街路という都市の設計の問題として見るという問いが題名から読み取れる。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "短尺動画への没入と孤独・心理的苦痛の交差遅延", "title": "Short video flow, loneliness, and psychological distress among young Turkish adults: a cross-lagged panel study", "url": "https://doi.org/10.1186/s40359-026-05761-2", "authors": "Ömer Faruk Akbulut", "venue": "BMC Psychology", "date": "2026-10-16", "citescore": 4.2, "citescore_year": "2025", "apa": "Akbulut, Ö. F. (2026). Short video flow, loneliness, and psychological distress among young Turkish adults: a cross-lagged panel study. BMC Psychology. https://doi.org/10.1186/s40359-026-05761-2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "短尺動画に没入する体験が、孤独感の増加を介して後の心理的苦痛を高めるという縦断的な媒介関係を示した。", "p3": "トルコの若年成人495人（84.2%が女性）を5か月間隔で2回調査し、自己回帰効果を統制した交差遅延パネルモデルで、短尺動画のフロー、孤独、心理的苦痛の関係を推定した。", "p5": "1回目のフローは2回目の孤独を予測し（β = 0.14）、1回目の孤独は2回目の苦痛を予測した（β = 0.21）。孤独を介した間接効果は有意（B = 0.017、95%CI [0.005, 0.030]）だが、RMSEA = 0.094と適合に課題が残る（抄録）。", "fun": "短い動画を次々見て時間を忘れる楽しさが、数か月後の寂しさにつながり、それが心のしんどさを強めるという流れ。楽しいはずの体験が遠回りに心を疲れさせる、という時間差の効果を2回の調査で追っている点が面白い。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "生鮮生産者の直販チャネルは自前か小売経由か", "title": "Self-built or retailer-based? Online direct-to-consumer channel introduction strategies for the fresh producer under retailer competition and disruption risk", "url": "https://doi.org/10.1016/j.jretconser.2026.105164", "authors": "Yibao Wang ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-17", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "apa": "Wang, Y., Dan, B., Sui, Y., Ding, Y., Pu, L., & Li, H. (2027). Self-built or retailer-based? Online direct-to-consumer channel introduction strategies for the fresh producer under retailer competition and disruption risk. Journal of Retailing and Consumer Services, 95, 105164. https://doi.org/10.1016/j.jretconser.2026.105164", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイトからも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、小売業者との競争と供給途絶のリスクがある中で、生鮮品の生産者が消費者への直販チャネルを自前で作るか小売のプラットフォームを使うかを分析した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "農家が自分のネットショップを作るか、スーパーの通販に出品するか。自前なら利益は大きいが手間とリスクがあり、小売経由なら楽だが取り分が減る。生ものだからこそ途絶のリスクが効いてくる、という問いが題名から読み取れる。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "ガラス梁の破壊後の頑健性を4事例で比較", "title": "Post-fracture robustness of glass beams: experimental comparison of four European case studies (2012–2026)", "url": "https://doi.org/10.1007/s40940-026-00339-1", "authors": "Jorge Hidalgo", "venue": "Glass Structures and Engineering", "date": "2026-10-17", "sjr": 0.671, "citescore": 3.8, "citescore_year": "2025", "apa": "Hidalgo, J. (2026). Post-fracture robustness of glass beams: experimental comparison of four European case studies (2012–2026). Glass Structures & Engineering, 11(3). https://doi.org/10.1007/s40940-026-00339-1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイトからも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、ガラス梁が割れた後にどれだけ荷重を支え続けられるか（破壊後の頑健性）を、2012〜2026年の欧州の4つの事例研究で実験的に比較した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ガラスの床や梁は割れること自体は避けられないので、割れた瞬間に崩れ落ちず「持ちこたえる」ことが安全の鍵になる。割れた後の粘り強さを複数の研究で比べるという問いが題名から読み取れる。", "unverified": "手法・データ・結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "ヒューマンコンピュータインタラクション", "headline": "スマート家電の実際の通信を見せると信頼が変わる", "title": "Evaluating Smart Home Device Users’ Responses to their (Un)Confirmed Privacy Expectations", "url": "https://doi.org/10.1145/3858671", "authors": "Tania Khatun ほか", "venue": "ACM Transactions on Computer-Human Interaction", "date": "2026-10-14", "citescore": 16.0, "citescore_year": "2025", "apa": "Khatun, T., Sheikh Rezaei, M., Yuxing Huang, D., Nov, O., & Ghaiumy Anaraky, R. (2026). Evaluating Smart Home Device Users’ Responses to their (Un)Confirmed Privacy Expectations. ACM Transactions on Computer-Human Interaction. https://doi.org/10.1145/3858671", "why": "期待確認理論に基づき、実機の通信監視による現地調査と統制実験を組み合わせて、プライバシー期待の確認・否定が信頼と対処行動に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（ACM）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "スマート家電の実際のデータ通信を利用者に見せると、期待どおりなら満足と継続利用の意図が高まる一方、通信を遮断するかどうかの判断は研究の場面によって異なる経路で決まることを示した（抄録）。", "p2": "スマート家電の利用者は、機器が個人データをどう扱っているかを知らないことが多い。データの扱いを明かすことが、信頼・満足・対処行動にどう効くかは分かっていなかった（抄録）。", "p3": "期待確認理論（Expectation-Confirmation Theory：事前の期待と実際の経験の一致・不一致が満足を決めるという理論）に基づき、生態学的妥当性と実験的統制を両立させる2つの研究を組み合わせた。現地調査（N = 35）ではネットワーク監視で実際の通信を見せ、オンライン実験（N = 132）では広告関連の通信量を操作した模擬レポートを示した（抄録）。", "p4": "結果変数は、データの扱いへの満足、継続利用の意図、収集への懸念、機器の通信を遮断する意思（抄録）。", "p5": "両研究とも、データの扱いが期待と一致すると満足が高まり、継続利用の意図が強まった。防御的な反応は経路が異なり、現地調査では満足が遮断の意思を予測したのに対し、実験では収集への懸念が遮断の主な予測因子だった（抄録）。", "p6": "現地調査は35人と小規模で探索的と位置づけられている（抄録）。解釈：2つの研究で遮断の経路が食い違う理由は、抄録の範囲では特定されていない。", "fun": "家のスマートスピーカーが、知らないうちにどこかと通信している。それを実際に見せられたとき、「思っていたとおり」なら安心して使い続け、「思ったより多い」なら不信が生まれる。同じ情報でも、事前の予想との差で受け止め方が変わる、という点が面白い。", "unverified": "効果の大きさの数値は抄録に記載がなく未確認。"}}, {"id": "jn02", "rank": 2, "field": "ヒューマンコンピュータインタラクション", "headline": "日常生活でARは何の役に立つのか", "title": "The Promise of Augmented Reality in Everyday Life", "url": "https://doi.org/10.1145/3858624", "authors": "Arpit Bhatia ほか", "venue": "ACM Transactions on Computer-Human Interaction", "date": "2026-10-14", "citescore": 16.0, "citescore_year": "2025", "apa": "Bhatia, A., Hirzle, T., Pohl, H., Brunn, L. A., Brown, B., & Hornbæk, K. (2026). The Promise of Augmented Reality in Everyday Life. ACM Transactions on Computer-Human Interaction. https://doi.org/10.1145/3858624", "why": "実務者のビジョン動画184本と参加者30人の一人称記録に基づく1,467の構想を分析し、日常ARの約束を概念的枠組みにまとめた。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（ACM）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "日常生活でのAR（拡張現実）の可能性を、実務者のビジョン動画と利用者の一人称記録に基づく構想の両方から分析し、なぜ・何を・どう拡張するかを整理する概念枠組みを作った（抄録）。", "p2": "ARは次の個人向けコンピューティングと位置づけられているが、実際に日常生活にどう組み込まれるのかはよく分かっていなかった（抄録）。", "p3": "(1) 実務者が作った184本のビジョン動画と、(2) 30人の参加者の日常生活の一人称記録に基づいて利用者が生み出した1,467の構想を分析した。実務者の知識と生活経験の二つの視点を照らし合わせている（抄録）。", "p4": "分析の軸は、利用者がなぜ現実を拡張したいのか、日常経験に何が欠けていてARが補えるのか、現実のどの側面を拡張すると有用か、ARの内容が現実世界とどう関係しうるか（抄録）。", "p5": "これら4つの問いに答える概念枠組みを示し、日常ARの新しい機会を明らかにしたとする（抄録）。具体的な類型や頻度は抄録に記載がない。", "p6": "参加者は30人で、構想の分析は利用者の想像に基づく（抄録）。解釈：実際にARを使った長期の利用で構想がどこまで当てはまるかは今後の検証課題である。", "fun": "ARというと未来的な宣伝動画が思い浮かぶが、普通の人が自分の一日の映像を見返して「ここに何があったら助かるか」を考えると、別の使い道が見えてくる。作り手の夢と使い手の実感を並べて比べた点が面白い。", "unverified": "枠組みの具体的な分類と頻度は本文未入手のため未確認。"}}, {"id": "jn03", "rank": 3, "field": "ヒューマンコンピュータインタラクション", "headline": "自作のローテク機器と暮らす体験の変化", "title": "Learning to Live with Low-tech: User Experience of Self-Built Low-Tech Systems in the Home", "url": "https://doi.org/10.1145/3858622", "authors": "Rémi Duhamel ほか", "venue": "ACM Transactions on Computer-Human Interaction", "date": "2026-10-14", "citescore": 16.0, "citescore_year": "2025", "apa": "Duhamel, R., Legardeur, J., & Lallemand, C. (2026). Learning to Live with Low-tech: User Experience of Self-Built Low-Tech Systems in the Home. ACM Transactions on Computer-Human Interaction. https://doi.org/10.1145/3858622", "why": "2か月の市民参加型プログラムで参加者が自宅で作り使ったローテク機器の体験の推移を、UXカーブ法で追跡した。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（ACM）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "市民が自作した簡素な「ローテク」機器を家庭で使う体験が、最初の2か月でどう変わるかを追い、普及の鍵は機器の最適化より使い手が学び工夫するための資源づくりにあると論じた（抄録）。", "p2": "持続可能性の議論は、単純で修理でき役に立つローテクを推すが、それが日常生活の中で時間とともにどう体験されるかはほとんど分かっていなかった（抄録）。", "p3": "2か月の市民参加型プログラムで、26人の参加者が5種類の機器を自宅で作って使い、その体験をUXカーブ法（時間に沿って体験の良し悪しの変化を振り返って描く方法）で後ろ向きに分析した（抄録）。", "p4": "分析の軸は、実用上の課題、期待と実感の有用性のずれ、材料・美観の制約、自律・有能感・価値との一致といった幸福に関わる質、意味のある手間（摩擦）（抄録）。", "p5": "繰り返し現れる実用上の課題、期待と実感の有用性のずれ、関与を損なう材料・美観の限界が見られた。一方で、自律・有能感・自分の価値観との一致に根ざした体験や、手間を負担ではなく意味あるものと感じさせる摩擦も報告された（抄録）。", "p6": "26人・2か月の初期利用の研究である（抄録）。解釈：長期の継続利用や、参加者以外の人々への広がりは検証されていない。", "fun": "便利な家電は手間を減らすことを目指すが、自分で作った簡単な道具を使う人たちは、手間そのものに「やりがい」を感じていた。不便さが必ずしも悪ではない、という逆説が、持続可能な暮らしの設計を考え直させる。", "unverified": "5種類の機器の内容は本文未入手のため未確認。"}}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "バンドル設計が需要と生産能力配分を同時に動かす", "title": "EXPRESS: Evaluating the Impacts of Bundling on a Firm’s Product Demand and Operational Decisions", "url": "https://doi.org/10.1177/10591478261489981", "authors": "Shu-Jung Sunny Yang ほか", "venue": "Production and Operations Management", "date": "2026-10-17", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Yang, S.-J. S., Huang, Y., Lu, H., & Chu, Y.-H. (2026). EXPRESS: Evaluating the Impacts of Bundling on a Firm’s Product Demand and Operational Decisions. Production and Operations Management. https://doi.org/10.1177/10591478261489981", "why": "異質な消費者の離散的なバンドル選択と、共有資源の下での企業の価格・数量決定を同時に推定し、反実仮想分析で整数構造を保っている。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "バンドル（セット商品）の価格・構成・提供の変更が、顧客の支出の再配分と企業の共有能力の再配分を同時に引き起こすことを、離散的な選択データからベイズ推定する枠組みで分析した（抄録）。", "p2": "バンドルの評価は需要側の効果だけで行われがちだが、供給には商品群全体で共有される運営能力が必要で、一つのバンドルの変更が他の需要と能力の配分に波及する点が扱われていなかった（抄録）。", "p3": "異質な消費者が共通の予算の下で各バンドルの離散的な数量を選び、企業がバンドル別と共有資源の制約の下で価格と数量を同時に選ぶモデルを作った。需要と供給のモデルを、観測された離散的な決定からベイズMCMCで推定し、推定と反実仮想の両方で整数構造を保った（抄録）。", "p4": "公共のシェアサイクル、オンライン小売、テーマパークのサービスの3つの実証の場に適用し、商品群全体を再最適化したうえでの各バンドルの利益への寄与を評価した（抄録）。", "p5": "顧客価値と利益への寄与は一致せず、大きな顧客価値を生むバンドルが最適化後の利益にはほとんど寄与しないことや、一部のバンドルを除くと再最適化後に利益が増えることがあった。テーマパークでは中程度の割引が深い割引・浅い割引の両方を上回った（抄録）。", "p6": "3つの事例に基づく結果である（抄録）。解釈：消費者の選好が時間とともに変わる場合や、競合の反応を含む場合への拡張は今後の課題と考えられる。", "fun": "遊園地の「1日券」「午後券」「年パス」のようなセット商品は、一つの値段を変えると、お客さんの買い方も、乗り物の混み具合の配分も同時に変わる。だから大幅な割引が一番もうかるとは限らず、中くらいの割引が最も良いこともある、という結果が直感に反して面白い。", "unverified": "各事例の数値（利益の変化率など）は抄録に記載がなく未確認。"}}, {"id": "jn05", "rank": 5, "field": "機械学習", "headline": "原子構造からEXAFSスペクトルを直接予測", "title": "AI‐EXAFS: Physics‐Informed Prediction of EXAFS from Atomic Structure", "url": "https://doi.org/10.1002/advs.78226", "authors": "Javier Heras‐Domingo ほか", "venue": "Advanced Science", "date": "2026-10-18", "sjr": 3.288, "citescore": 18.1, "citescore_year": "2025", "apa": "Heras‐Domingo, J., Ruiz‐Ferrando, A., Clark, A. H., Pollitt, S., Mitchell, S., Pérez‐Ramírez, J., & López, N. (2026). AI‐EXAFS: Physics‐Informed Prediction of EXAFS from Atomic Structure. Advanced Science. https://doi.org/10.1002/advs.78226", "why": "多重散乱計算の反復なしに、物理情報を組み込んだ機械学習で原子構造から全EXAFSスペクトルを予測する手法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用。抄録中の空間の記号が欠落", "preprint": false, "p1": "原子の3次元座標から広域X線吸収微細構造（EXAFS）スペクトル全体を直接予測する、物理情報つきのグラフニューラルネットワークAI-EXAFSを示した（抄録）。", "p2": "EXAFSは局所的な原子環境に敏感で構造解析に欠かせないが、定量的な解釈は多重散乱計算に構造パラメータを合わせ込む反復作業で、多様な化学環境で構造から全スペクトルを直接予測するのは難しかった（抄録）。", "p3": "吸収原子を中心にしたグラフ表現と、距離で変調されたメッセージ伝達、EXAFS専用の学習目的関数を組み合わせ、あらかじめ定めた構造記述子や手作業のパラメータ選択なしに構造-スペクトル関係を学習する（抄録）。", "p4": "FEFFで生成したスペクトルをもつ85,991の遷移金属錯体のデータで学習・評価し、未使用の試験集合でのR因子（予測と参照スペクトルのずれの指標）を見た（抄録）。", "p5": "試験集合の平均R因子は2つの表示空間でそれぞれ0.043と0.019で、幅広い局所化学環境で構造からスペクトルを正確に予測した（抄録）。大量の候補構造に対する直接推論を可能にするとしている。", "p6": "学習・評価は計算で生成したスペクトルに基づく（抄録）。解釈：実験スペクトルへの適用での精度は抄録の範囲では示されていない。", "fun": "X線を物質に当てたときに出る細かな波の模様には、原子の並び方の情報が詰まっている。これまでは並び方を仮定して計算し、模様と合うまで何度も調整していた。AIに原子の配置を見せるだけで模様を一発で描かせる、という発想の逆転が面白い。", "unverified": "2つのR因子がどの空間（k空間・R空間など）のものかは、抄録で記号が欠落しており未確認。"}}, {"id": "jn06", "rank": 6, "field": "機械学習", "headline": "創発的自己組織化マップで化学空間を可視化", "title": "χ-SOM: emergent self-organizing maps for large chemical space visualization", "url": "https://doi.org/10.1186/s13321-026-01317-z", "authors": "Johannes Kaminski ほか", "venue": "Journal of Cheminformatics", "date": "2026-10-18", "sjr": 1.355, "citescore": 9.8, "citescore_year": "2025", "apa": "Kaminski, J., & Koch, O. (2026). χ-SOM: emergent self-organizing maps for large chemical space visualization. Journal of Cheminformatics. https://doi.org/10.1186/s13321-026-01317-z", "why": "t-SNEやUMAPが失いやすい距離と密度の構造を保つ次元削減として、創発的自己組織化マップを大規模化学空間に適用した。", "explain": {"basis": "抄録", "basis_note": "出版社のページの抄録を使用。本文は取得できず", "preprint": false, "p1": "大規模な化学データで創発的自己組織化マップ（ESOM）を学習・対話的に探索できる高性能ライブラリχ-SOMを作り、170万化合物で報告上最大のSOMを構築した（抄録）。", "p2": "化学空間の可視化に使われるt-SNEやUMAPなどの次元削減は、元の空間の距離と密度の性質を潜在空間で保ちにくい。ESOMはその欠点を回避しうるが、大規模な化学データに適した実装がなかった（抄録）。", "p3": "最適化したSOMアルゴリズム（CPUとCUDAに対応）、数百万の分子指紋に並列アクセスできるHDF5ベースのディスク上データストア（PyTorch DataLoader対応）、化学構造と物性の重ね合わせに特化したGUIを統合した（抄録）。", "p4": "密度とクラスター間距離の保存を調べる合成データと化学データのベンチマークでt-SNE・UMAPと比べ、データ量と指紋長を変えて既存のSOMライブラリと性能を比べた（抄録）。", "p5": "合成ベンチマークではESOMが密度と距離の両方を保ち、t-SNEとUMAPは保てなかった。指紋に基づく同等の課題では3手法が同程度だった。既存SOMライブラリに対して同等以上の性能を示し、ChEMBL33（170万化合物、510万ニューロン）のESOMを学習し、地図上の近傍関係が医薬化学者の化学的類似性の直感とよく一致した（抄録）。", "p6": "化学データでの比較では3手法の差が出なかった（抄録）。解釈：化学者の直感との一致の評価方法の厳密さは抄録からは分からない。", "fun": "何百万もの分子を、似たもの同士が近くに並ぶ1枚の地図にしたい。人気の方法は見た目のまとまりはきれいでも、本当の距離感や混み具合をゆがめてしまう。昔からある「自己組織化マップ」を大規模化して、ゆがみの少ない地図を作った点が、古い道具の再発見として面白い。", "unverified": "計算時間の比較の数値は抄録に記載がなく未確認。"}}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "装置に依存せず質量スペクトルから官能基を予測", "title": "Instrument-Agnostic Machine Learning Framework for Accurate Prediction of Functional Groups from Tandem Mass Spectrometry", "url": "https://doi.org/10.1021/acs.analchem.5c05945", "authors": "Connor Beveridge ほか", "venue": "Analytical Chemistry", "date": "2026-10-18", "sjr": 1.358, "citescore": 10.7, "citescore_year": "2025", "apa": "Beveridge, C., Wijewardhane, P. R., Muhoberac, M., Morato, N. M., Kaerner, A., Zhang, L.-K., Richardson, D., Shoulds, A., Gilbert, J. R., Welch, C. J., Tichy, S., & Chopra, G. (2026). Instrument-Agnostic Machine Learning Framework for Accurate Prediction of Functional Groups from Tandem Mass Spectrometry. Analytical Chemistry. https://doi.org/10.1021/acs.analchem.5c05945", "why": "データベース照合に頼らず、タンデム質量スペクトルから直接官能基を予測する装置非依存の機械学習枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "タンデム質量スペクトル（MS/MS）から官能基を直接予測する機械学習の枠組みを作り、ある装置のデータで学習したモデルが別の装置のスペクトルでも予測できることを示した（抄録）。", "p2": "未知化合物の構造解析では、専門家が生成イオンのピークや中性損失を読み、データベース照合ソフトを使うが、時間がかかり、データベースに載っている分子に限られる（抄録）。", "p3": "公開データベースMassBank of North America（MONA）と、高スループットのDESI-MS/MSで取得した独自データベースでモデルを学習した。スペクトルを前駆イオンのm/zで標準化する新しい表現を開発した（抄録）。", "p4": "評価指標は分子単位の平均F1と平均正解率。さらに、DESIのデータで学習したモデルを、2つの企業の研究所が別の装置（OrbitrapとTOF、正イオンモードのエレクトロスプレーイオン化）で取得した盲検の試験分子に適用した（抄録）。", "p5": "分子単位の平均F1はMONAで87%、DESIで76%、平均正解率はMONAで94%、DESIで87%で、異なるデータベースで学習しても同程度の性能だった。DESIで学習したモデルは、別装置の盲検試験でも官能基を予測できた（抄録）。", "p6": "盲検試験の具体的な成績は抄録に記載がない（抄録）。解釈：負イオンモードや他のイオン化法への移植性は残る疑問である。", "fun": "分子を壊して出てくるかけらの重さの並び（質量スペクトル）から、元の分子にどんな部品（官能基）が付いていたかを当てる。これまでは図鑑と照らし合わせていたが、AIに直接読ませ、しかも別メーカーの装置で測ったデータでも通用した。装置のくせを越えられる点が実用上大きい。", "unverified": "盲検試験の正解率の数値は抄録に記載がなく未確認。"}}, {"id": "jn08", "rank": 8, "field": "統計学", "headline": "気候モデルの較正が誤差の相殺を生む", "title": "Investigating Cloud–Radiation Error Compensations Stemming From Climate Model Calibration", "url": "https://doi.org/10.1029/2025ms005579", "authors": "M. Coulon‐Decorzens ほか", "venue": "Journal of Advances in Modeling Earth Systems", "date": "2026-10-17", "sjr": 2.154, "citescore": 8.0, "citescore_year": "2025", "apa": "Coulon‐Decorzens, M., Hourdin, F., & Villefranque, N. (2026). Investigating Cloud–Radiation Error Compensations Stemming From Climate Model Calibration. Journal of Advances in Modeling Earth Systems, 18(10). https://doi.org/10.1029/2025ms005579", "why": "放射フラックスへの合わせ込みが、放射伝達の誤差と雲の性質の誤差を相殺させているかを検証し、モデル較正の落とし穴を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "気候モデルを大気上端の放射フラックスに合わせて調整（較正）すると、不正確な放射伝達の扱いを雲の性質の誤差が打ち消す「誤差の相殺」が起きることを、単一カラムモデルの較正実験で示した（抄録）。", "p2": "誤差の相殺は気候モデル開発の障害である。シミュレーションの雲の性質の系統誤差が、放射の合わせ込みと不正確な放射伝達のパラメータ化による強制的な相殺から生じるのかは確かめられていなかった（抄録）。", "p3": "気候モデルの単一カラム版（SCM）で、雲の3次元放射効果のパラメータ化の有無を切り替え、ラージエディ・シミュレーション（LES）の雲場で計算した参照の太陽放射フラックスに合わせる較正実験を行った（抄録）。", "p4": "実験1では雲の鉛直分布を完全と仮定して放射伝達コードの雲の幾何パラメータを調整し、実験2では幾何パラメータを標準値に固定して境界層と雲のパラメータ化の自由パラメータを放射の指標に合わせて調整した（抄録）。", "p5": "実験1では雲の幾何の効果の間、とくに雲の鉛直方向の重なりと3次元効果の間に相殺が見られた。実験2では、3次元効果を無視すると、低い太陽高度での雲の反射の過小評価を部分的に補うために雲量を過大にしてはじめて妥当なフラックスが得られた。太陽高度別の詳細なフラックスではなく平均のフラックスを目標にすると、この機構は完全に消えた（抄録）。", "p6": "単一カラムモデルと特定の雲場での実験である（抄録）。解釈：全球モデルでの相殺の大きさと、それが気候感度の推定にどう効くかは抄録の範囲では示されていない。", "fun": "テストの答えだけ合わせようとすると、途中の計算の間違いを別の間違いで打ち消して正解にしてしまうことがある。気候モデルでも、太陽光の反射を合わせるために雲を実際より多くしていた。答えが合っていることと、中身が正しいことは別、という教訓が分かりやすい。", "unverified": "相殺の大きさの数値は抄録に記載がなく未確認。"}}], "data_related": [{"rank": 1, "headline": "夜間照明と睡眠の投稿16万件を都市別に分析", "title": "LLM-labelled geotagged Weibo posts on nighttime lighting and sleep in Chinese cities", "url": "https://doi.org/10.6084/m9.figshare.32526483.v4", "authors": "Liangzhao Chen ほか", "venue": "Figshare", "date": "2026-10-18", "apa": "Chen, L., & zhang, yan. (2026). LLM-labelled geotagged Weibo posts on nighttime lighting and sleep in Chinese cities (Version 4) [Dataset]. figshare. https://doi.org/10.6084/M9.FIGSHARE.32526483.V4", "summary": "中国339の都市・地域で2022年1月〜2025年8月に投稿された、照明・睡眠関連の位置情報つき微博投稿164,691件（131,168人）。LLM（qwen-plus）で照明への苦情・睡眠問題など7分類のラベルを付与し、1,000件の検証用サンプルも含む。JSON Lines形式で約103MB。ライセンスはCC BY 4.0、関連論文は記載なし。", "kind": "data", "theme": "都市・インフラ政策", "theme_no": 6}, {"rank": 2, "headline": "職場のAI抵抗尺度を再分析できる", "title": "Dataset for: Measuring Workplace Resistance to Artificial Intelligence — A Scale Development Study", "url": "https://doi.org/10.5281/zenodo.23453429", "authors": "SAKAL ほか", "venue": "Zenodo", "date": "2026-10-18", "apa": "SAKAL, M. U. R. A. T., Hakan, S., Koçak, H., & Onur, K. (2026). Dataset for: Measuring Workplace Resistance to Artificial Intelligence — A Scale Development Study (Version 2) [Dataset]. Zenodo. https://doi.org/10.5281/ZENODO.23453429", "summary": "職場でのAIへの抵抗を測る27項目・3因子の尺度開発研究の匿名化調査データ（N=724）。個人的抵抗・組織的抵抗・受容と知覚便益の回答に加え、属性とAI利用状況の変数を含み、コードブックつき。形式・サイズは記載なし。ライセンスはCC BY 4.0、投稿中の論文に付随。", "kind": "data", "theme": "職場AI・組織行動", "theme_no": 7}, {"rank": 3, "headline": "誤り注入した合成請求書で検証規則を比べる", "title": "Audit-Ready Financial Records through Layered Data Validation: A Controlled Error-Injection Experiment", "url": "https://doi.org/10.5281/zenodo.23446873", "authors": "Huzaifa, Muhammad", "venue": "Zenodo", "date": "2026-10-18", "apa": "Huzaifa, M. (2026). Audit-Ready Financial Records through Layered Data Validation: A Controlled Error-Injection Experiment (Version 1.0) [Dataset]. Zenodo. https://doi.org/10.5281/ZENODO.23446873", "summary": "合成した請求書記録3,500件のうち390件に、識別子の欠落・重複、負の金額、期間外の日付、照合誤り、異常な高額の6種の誤りを注入した実験データ。基本チェック・多層の整合性規則・金額閾値の検出率を比較できる。形式・サイズは記載なし。ライセンスはCC BY 4.0、関連論文は記載なし。", "kind": "data", "theme": "会計情報科学", "theme_no": 2}, {"rank": 4, "headline": "AI補助の口コミと開示の説得効果を再現", "title": "Writing Quality Gain vs. Authenticity Penalty: How AI Augmentation and Its Disclosure Shape Persuasion in Online Word-of-Mouth", "url": "https://doi.org/10.5281/zenodo.22451650", "authors": "Ye, Qixin", "venue": "Zenodo", "date": "2026-10-17", "apa": "Ye, Q. (2026). W     { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
