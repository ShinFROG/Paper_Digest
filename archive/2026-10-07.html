<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

挙動は本文未確認。"}}, {"id": "pr17", "rank": 17, "headline": "政治学7研究の再現でLLM注釈の精度とコストを比較", "title": "JEV versus LLMs: Accuracy, Cost and Calibration on Seven Political Science Replications", "url": "https://arxiv.org/abs/2610.06625", "authors": "Matthew DiGiuseppe ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "DiGiuseppe, M., & Denney, S. (2026). JEV versus LLMs: Accuracy, Cost and Calibration on Seven Political Science Replications (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06625", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "選択肢ごとの確率を直接返す商用モデルJEVを、政治学の既存研究7件の再現タスクでLLMや人のコーダーと比べ、社会科学の注釈に使えるかを評価した。", "p3": "公表済み研究の人のコーディングと、中位の商用LLMおよび公開重みのモデルを比較対象に、精度・費用・確率の較正（calibration）を測った（抄録）。", "p5": "JEVは両LLMと同等かそれに近い精度だったが、バッチ料金の商用LLMに対する費用面の優位はなかった。1回だけ尋ねる条件では商用LLMより較正が良いが、公開重みモデルより一貫して良いとはいえなかった（抄録）。", "fun": "AIに文章を分類させるとき、「どれくらい自信があるか」が当たり具合と一致しているかは意外に大事です。この研究は、売り文句の「安くて速くて自信も正確」を実際の政治学の課題で確かめ、宣伝ほどの差はないことを示しました。", "unverified": "7件の再現課題の内訳とタスク別の数値は本文未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AIが仲介すると話し手の立場がずれる", "title": "Stance Drift: How AI-mediated Communication Distorts Our Message", "url": "https://arxiv.org/abs/2610.04620", "authors": "Lingchong Liu ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Liu, L., Zhou, Y., Bien, J., Wang, Y. X. R., Xia, L., & Tong, X. (2026). Stance Drift: How AI-mediated Communication Distorts Our Message (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04620", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが文章を書き、別のLLMがその立場を読み取る二段階の流れで、話し手の立場（スタンス）がどれだけ保たれるかを測り、立場のずれ（stance drift）を示した。", "p3": "5段階のスタンスの状態遷移として流れをモデル化し、元の立場が復元される平均確率を立場保持率（SPR）と定義した。112の討論命題で9つのLLMを評価した（抄録）。", "p5": "既定設定ではどのLLMもSPRが0.7を超えなかった。ずれの多くは極端化・中立からの逸脱・反転の3型で、対策のうち反省プロンプトに中程度の推論を加えた場合だけGPT-5.4で0.775に改善したが、極端化は残った（抄録）。", "fun": "伝言ゲームでは言葉が少しずつ変わりますが、AIに下書きや要約を任せると、伝えたい「賛成・反対の度合い」まで変わってしまうことがあります。特に意見が実際より強く伝わる「極端化」が多いという結果は、AI経由の議論が対立を強めうることを考えさせます。", "unverified": "モデル別のSPRと人による読み取りとの比較の詳細は本文未確認。"}}, {"id": "pr19", "rank": 19, "headline": "生成エージェントの心理的動態を測るベンチマーク", "title": "Benchmarking Psychological Dynamics in Generative Agents", "url": "https://arxiv.org/abs/2610.04246", "authors": "Sumer S. Vaid ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Vaid, S. S., & Whillans, A. V. (2026). Benchmarking Psychological Dynamics in Generative Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04246", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "固定した人物像（ペルソナ）を持つLLMエージェントが、出来事の連続の中で人間らしい心理状態の変化を再現できるかを測るベンチマークを作った。", "p3": "公表された規範値とメタ分析の効果量だけから作り、分布や個人間・個人内の分散の分け方、時間的な依存といった内的妥当性と、既知の特性・状態の関係を再現できるかという外的妥当性の2軸で採点した（抄録）。", "p5": "9社の36モデル（1B〜671B）で、既知の関係の向きは平均84.3%で一致し、分散の分け方も34中26で再現したが、個人内の相関と分布の形は再現できなかった。内的妥当性は規模や能力と無関係だった（抄録）。", "fun": "AIに「ある人」を演じさせると、平均的な答えは人らしくても、同じ人の気分が日々どう揺れるかまでは真似できないことが分かりました。大きなモデルほど人に近いとは限らないという点も、「賢さ」と「人らしさ」が別物であることを示しています。", "unverified": "モデル別の得点と、どの関係が再現できなかったかの詳細は本文未確認。"}}, {"id": "pr20", "rank": 20, "headline": "ペルソナ設定が下流の行動を本当に変えるか測る", "title": "AgentPersonaBench: Benchmarking Persona-Driven User Simulation", "url": "https://arxiv.org/abs/2610.04379", "authors": "Jintao Huang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Huang, J., Wang, Y., Shen, H., Lu, Y. D., Huang, S., Oh, M., Wang, Y., Mohsin, M. A., Xu, Z., Fan, Y., Yuan, Z., Bilal, A., Wei, Z., Jajee, S., Gagnier, H., Kapoor, S., Wang, J., Wen, Q., He, Y., … Hao, Y. (2026). AgentPersonaBench: Benchmarking Persona-Driven User Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04379", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ペルソナ設定がエージェントの実際の行動を忠実に方向づけるかを、観察できる行動だけで判定するベンチマークAgentPersonaBenchを作った。", "p3": "対象の特性を名指しせずに完全な架空プロフィールに埋め込み、調査・チャット・ウェブ・アプリの4つの場面での行動から特性への忠実度を確認した。2,460課題・867特性からなる（抄録）。", "p5": "20のモデル構成を評価し、上位モデルは指示なしで最大84.7%の課題を完全に通過したが、4場面すべてを通過したのは37.9〜64.3%にとどまり、複数の特性を同時に求めると保持が落ちた（抄録）。", "fun": "AIに「節約好きの人」を演じさせても、アンケートでは節約家らしく答えるのに、実際のネットショッピングの操作では散財するかもしれません。この研究は、口で言うことではなく行動で人物像を確かめる点が新しく、場面が変わると役になりきれない限界を示しました。", "unverified": "モデル別の結果と特性の種類別の差は本文未確認。"}}, {"id": "pr21", "rank": 21, "headline": "零空間射影でペルソナの部分空間を取り出し調整", "title": "Extracting Persona Subspaces Through Iterative Nullspace Projection For Modulation", "url": "https://arxiv.org/abs/2610.04676", "authors": "Ananya Malik ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Malik, A., & ElSherief, M. (2026). Extracting Persona Subspaces Through Iterative Nullspace Projection For Modulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04676", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMのペルソナを1本の方向ではなく多次元の部分空間として取り出し、再学習なしに強めたり弱めたりできる推論時の制御法PaSSを提案した。", "p3": "反復的零空間射影（Iterative Nullspace Projection, INLP）で、ペルソナに固有の方向を線形に繰り返し取り除きながら部分空間を抽出し、生成時の調整に使う（抄録）。", "p5": "6つのペルソナでMATH-500、GSM8K、IFEvalなどを用いて因果的に評価し、単一方向の加算法より大きな調整が内容の忠実さを保ったまま可能だった（抄録）。", "fun": "AIの「人格」は1本のつまみではなく、いくつものつまみが重なってできている、という発想です。一番目立つ方向を取り除くと、その下に隠れていた細かな特徴が見えてくるというのは、玉ねぎの皮をむくような解析で面白い点です。", "unverified": "具体的な改善幅とペルソナの例は本文未確認。"}}, {"id": "pr22", "rank": 22, "headline": "ペルソナ駆動の模擬で社会的に適応するLLMを学習", "title": "PB-GRPO: Learning Socially Adaptive LLM Agents from Persona-Driven Simulation with Preference-Batched GRPO", "url": "https://arxiv.org/abs/2610.04132", "authors": "Jingquan Wang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Wang, J., Yin, J., Han, X., Mei, Y., Hao, J., & Guo, B. (2026). PB-GRPO: Learning Socially Adaptive LLM Agents from Persona-Driven Simulation with Preference-Batched GRPO (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04132", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ペルソナを持つLLM利用者シミュレータとの会話を使い、社会的にふさわしく振る舞うエージェントを学習する後学習法PB-GRPOを提案した。", "p3": "ペルソナのライブラリ、LLMによる利用者シミュレータ、0〜1の満足度採点からなる環境で、選好の似た利用者の群ごとに正規化した優位度（advantage）を使うGRPOの変種で学習する（抄録）。", "p5": "模擬環境の中で、強い強化学習の基準手法より社会的な振る舞いが改善したと報告している（抄録）。具体的な数値は抄録にない。", "fun": "相手の本当の望みは言葉にされないことが多く、それを汲み取る力は会話を重ねないと身につきません。人の代わりに「いろいろな性格の模擬ユーザー」を大勢用意して練習させる発想は、実地研修の代わりにロールプレイを繰り返すのに似ています。", "unverified": "改善の数値と、模擬環境以外での評価の有無は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "LLM審査員の設計選択が評価結果を大きく左右する", "title": "How Much Do LLM-as-a-Judge Design Choices Matter? A Systematic Comparison of Prompt Designs, Rating Scales, and Models", "url": "https://arxiv.org/abs/2610.05094", "authors": "Laur\\`ene Vaugrante ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Vaugrante, L., & Hagendorff, T. (2026). How Much Do LLM-as-a-Judge Design Choices Matter? A Systematic Comparison of Prompt Designs, Rating Scales, and Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05094", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMを評価者（LLM-as-a-judge）に使うとき、プロンプト・評定尺度・モデルの選び方が判定をどれだけ変えるかを系統的に比べた。", "p3": "10の推論モデルで、文の感情と有害性の1〜7点評定（各カテゴリ500件超）と、質問回答の正誤の二値判定（600件）を、複数の設計で比較した（抄録）。", "p5": "評定は人の正解と平均絶対偏差0.11点の差にとどまり、正誤判定は平均96.5%正確だった。一方、評定尺度を変えるだけで測定上の偏りが最大0.93点動き、詳しいプロンプトで判定の甘さが28.9ポイント、モデルの変更で最大56.1ポイント下がった。最大の変動要因はモデルだった（抄録）。", "fun": "テストの採点者が変わると点数が変わるのは人間でもよくあることですが、AIの採点者でも同じことが起きます。全体としては信頼できても、物差しの目盛りや採点者を変えるだけで結論が変わりうる、という注意は、AIで研究を評価する時代に大切です。", "unverified": "モデル別の結果と各設計の詳細は本文未確認。"}}, {"id": "pr24", "rank": 24, "headline": "LLMが選好を代理する拡張民主主義の可能性と課題", "title": "Large Language Models and Augmented Democracy", "url": "https://arxiv.org/abs/2610.04412", "authors": "Jairo Gudi\\~no-Rosero", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Gudiño-Rosero, J. (2026). Large Language Models and Augmented Democracy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04412", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（博士論文）を使用", "preprint": true, "short": true, "p1": "市民や政党の選好を代理するLLMベースのデジタルツインを、拡張民主主義の仲介者として使う可能性と弱点を3つの研究で検討した博士論文。", "p3": "ブラジルのオンライン実験で個人の未知の政策への選好予測、スイス議会の立法記録から作った知識グラフと議員エージェントによる政党単位の熟議、英国の熟議実験データでのプロンプトインジェクション攻撃への頑健性を調べた（抄録）。", "p5": "抄録は各研究の設計を述べるが、具体的な数値結果は示していない。攻撃の効果が意見の分布や修辞戦略で変わること、検出・構造化・強化学習を組み合わせた防御を評価したことが述べられている（抄録）。", "fun": "一人ひとりの考えを代弁するAIの分身が議論に参加したら、民主主義はどう変わるでしょうか。便利な一方で、分身に悪意ある指示を紛れ込ませれば議論の結論をねじ曲げられるという弱点も同時に調べている点が、この研究の現実的なところです。", "unverified": "各研究の数値結果は本文未確認。"}}, {"id": "pr25", "rank": 25, "headline": "個人AIアシスタントの節約は売り手の適応で消える", "title": "Who Keeps the Gains from Personal AI Assistants? Seller Adaptation and the Unassisted in a Language-Model Market Simulation", "url": "https://arxiv.org/abs/2610.05823", "authors": "Haonan Huang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Huang, H., & Xiao, J. (2026). Who Keeps the Gains from Personal AI Assistants? Seller Adaptation and the Unassisted in a Language-Model Market Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05823", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "消費者の代わりに取引する個人AIアシスタントの節約効果が、売り手の適応後も残るか、未利用者に負担が移るかを言語モデル市場のシミュレーションで調べた。", "p3": "言語モデルが借り手・アシスタント・価格ツールを使う6つの売り手を演じる賃貸市場を作り、半数にアシスタントを与えた。売り手を固定した場合と適応させた場合を対にして比較した（30市場、抄録）。", "p5": "実行権限のあるアシスタントは売り手固定で利用者の支出を1日あたり13.7ドル減らしたが、売り手の適応で約3分の1が取り戻され8.7ドルになった。未利用者の支出変化は+0.4（信頼区間-0.6〜+1.3）で、予測された+3.6は再現しなかった（抄録）。", "fun": "便利な道具を一部の人だけが使うと、売り手は値付けを変えて対抗します。この研究はAIの店員とAIの客を大勢戦わせる「人工の市場」で、得をした分がどこへ流れるかを追跡しました。結果は予想と違い、使わない人の損はほとんど出ませんでした。", "unverified": "売り手の価格戦略の詳細と頑健性の確認は本文未確認。"}}, {"id": "pr26", "rank": 26, "headline": "オンラインレビューがアプリ導入の判断に与える影響", "title": "The Role of Online Reviews in Making Decisions About Installing Mobile Apps for Purchase", "url": "https://econpapers.repec.org/RePEc:zbw:esconf:343416", "authors": "Mahmić Muhić ほか", "venue": "RePEc NEP", "date": "2026-10-05", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用", "preprint": true, "short": true, "p1": "ボスニア・ヘルツェゴビナの利用者調査で、オンラインレビューが購買用モバイルアプリの導入判断にどう関わるかを調べた。", "p3": "モバイルアプリ利用者268人の調査で、アプリ評価におけるレビューの役割とレビューへの信頼が、購買用アプリを導入する判断を形づくるかを検討した（抄録）。", "p5": "抄録は、レビューが重要であることを示したと述べるが、効果の大きさなど具体的な数値は示していない（抄録）。", "fun": "アプリを入れる前に星の数やレビューを見る人は多いでしょう。レビューそのものだけでなく「そのレビューを信じられるか」が判断を左右するという視点は、口コミが信頼でできていることを思い出させます。", "unverified": "分析手法と係数の大きさは未確認（抄録に記載なし）。"}}, {"id": "pr27", "rank": 27, "headline": "投資家の私的情報は経営者の利益調整を抑えるか", "title": "Market Signal to Managers: Effect of Investors' Private Information on Earnings Management", "url": "https://doi.org/10.2139/ssrn.7556939", "authors": "Thu Vu ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Vu, T., & Stafylas, D. (2026). Market Signal to Managers: Effect of Investors’ Private Information on Earnings Management. https://doi.org/10.2139/ssrn.7556939", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "株価に外部投資家の私的情報が多く織り込まれている企業ほど、経営者の利益調整（earnings management）が少ないことを示した。", "p3": "情報トレードの確率（PIN）とその動的版（DPIN、SDPIN）で私的情報を測り、単一水準と多水準の回帰で利益調整との関係を推定した（抄録）。", "p5": "株価が外部投資家の私的情報を多く反映するほど利益操作は起きにくく、その影響は利益を上方に調整する場合で強かった（抄録）。", "fun": "株価は会社の成績表であると同時に、経営者にとっての「外からの監視の目」でもあります。投資家が独自に情報を集めて株価に反映させているほど、決算の数字をごまかしにくくなるという結果は、市場が経営者を規律づける仕組みを示しています。", "unverified": "標本の国・期間と効果の大きさは未確認（抄録に記載なし）。"}}, {"id": "pr28", "rank": 28, "headline": "ブロックチェーン導入で主要顧客の開示が変わる", "title": "Blockchain adoption and the disclosure of major customers", "url": "https://doi.org/10.2139/ssrn.7566246", "authors": "Jinkang Zhang ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Zhang, J., Ke, Y., & Qian, Y. (2026). Blockchain adoption and the disclosure of major customers. https://doi.org/10.2139/ssrn.7566246", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ブロックチェーンを導入した中国企業は、主要顧客の名前を自発的に開示しなくなることを示した。", "p3": "2016〜2022年の中国A株上場企業22,307企業年を用い、差の差、エントロピー・バランシング、ヘックマン法などで頑健性を確かめた（抄録）。", "p5": "導入は主要顧客の開示を有意に減らし、情報漏洩リスクと会計の透明性向上という2つの経路がともに確認された。開示の減少は資本市場の情報効率を損なわなかった（抄録）。", "fun": "新しい技術で会計が透明になると、かえって会社は「お得意様の名前」を言わなくなる、という逆説的な結果です。透明になった分だけ、わざわざ顧客名を明かして信用をアピールする必要が減るからだ、という説明は理屈として納得できます。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "テキストデータが経済測定に妥当となる条件", "title": "When Is Text Data Valid？", "url": "https://doi.org/10.2139/ssrn.7558778", "authors": "Weijia Wang", "venue": "SSRN", "date": "2026-10-05", "apa": "Wang, W. (2026). When Is Text Data Valid？. https://doi.org/10.2139/ssrn.7558778", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "文章から作った変数が経済測定に妥当となる条件を整理し、年次報告書のAI関連語の数え上げが誤った結論を生みうることを示した。", "p3": "テキスト変数を潜在構成概念のノイズ入りで操作されうる信号とみなす測定モデルで文献を整理し、年次報告書のAIキーワードと採用の関係に合わせたシミュレーションを行った（抄録）。", "p5": "効果が大きくても、キーワード数は情報を持たないか符号が逆になりうる一方、特許数では検出できた。開示がわずか数%戦略的に反応するだけで足りる。文脈を考える分類、独立の第二の指標、手作業の検証標本で大半を回復できた（抄録）。", "fun": "報告書に「AI」と何回書いたかで、その会社のAI活用度を測れるでしょうか。会社が流行語を少し多めに書くだけで、測定は役に立たなくなるどころか逆の結論にもなりうる、という指摘は、文章データを使う研究者への重要な警告です。", "unverified": "シミュレーションの詳細な設定は本文未確認。"}}, {"id": "pr30", "rank": 30, "headline": "事前学習済みPFNを表形式の異常検知に適応", "title": "Adapting prior-data fitted networks for tabular anomaly detection", "url": "https://arxiv.org/abs/2610.06693", "authors": "Maximilian Bershtman ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Bershtman, M., & Cohen, N. (2026). Adapting prior-data fitted networks for tabular anomaly detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06693", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式データ向けの事前学習モデル（prior-data fitted networks, PFN）の内部表現を、表形式データの異常検知に転用する方法を示した。", "p3": "凍結したTabPFNの特徴で近傍への距離を異常度とする方法（ZEN）と、正常を定める参照集合で微調整して特徴を分けやすくする方法（FOCUS）を提案し、どの層を使うかも調べた（抄録）。", "p5": "ADBenchで、微調整なしのZENが全基準手法より高い平均AUROCを示し、微調整したFOCUSはさらに改善した。他のPFNモデルにも一般化した（抄録）。", "fun": "画像では強力な事前学習モデルが異常発見に役立ってきましたが、表のデータでは同じことが難しかった。表専用に大量の人工データで学んだモデルの「中身の特徴」を借りるだけで、異常が近所から浮いて見えるようになる点が面白いところです。", "unverified": "AUROCの具体的な値は未確認（抄録に記載なし）。"}}, {"id": "pr31", "rank": 31, "headline": "差分プライバシーと準同型暗号で反実仮想説明を保護", "title": "PrivDiCE: Privacy-Preserving Actionable Counterfactual Explanations with Differential Privacy and Homomorphic Encryption", "url": "https://doi.org/10.2139/ssrn.7571295", "authors": "Viet-Nhat Nguyen ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Nguyen, V.-N., Tran, A.-T., Luong, T.-D., & Huynh, V.-N. (2026). PrivDiCE: Privacy-Preserving Actionable Counterfactual Explanations with Differential Privacy and Homomorphic Encryption. https://doi.org/10.2139/ssrn.7571295", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "差分プライバシーと準同型暗号を組み合わせ、機微なデータでも実行可能な反実仮想説明（counterfactual explanation）を作る枠組みPrivDiCEを提案した。", "p3": "差分プライバシー付きの生成モデルと意味的制約、疎で多様で実行可能な候補を探す探索を使い、予測モデルによる候補の評価はCKKS方式の準同型暗号で保護する（抄録）。", "p5": "Leipzig ECG、Heart+、MIMIC-IVで評価し、ε約4でLeipzig ECGとMIMIC-IVではほぼ全件で反実仮想が得られた。メンバーシップ推論のAUCは0.4988〜0.5052で偶然並み、暗号下の推論は平文と100%一致した（抄録）。", "fun": "「何をどう変えれば審査に通ったか」を示す説明は役に立ちますが、その説明から元の個人データが漏れては困ります。データにわざと雑音を混ぜる方法と、暗号のまま計算する方法を組み合わせ、説明の分かりやすさと秘密の保護を両立させた点が工夫です。", "unverified": "Heart+での具体的な性能低下の大きさは本文未確認。"}}, {"id": "pr32", "rank": 32, "headline": "分位点を考慮した拡散モデルで極端な不均衡を補う", "title": "Usefulness of Quantile-Aware Diffusion Modeling for Highly Imbalanced Tabular Data", "url": "https://arxiv.org/abs/2610.05825", "authors": "Abu Talha ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Talha, A., Liu, P., & Paul, S. (2026). Usefulness of Quantile-Aware Diffusion Modeling for Highly Imbalanced Tabular Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05825", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "極端に不均衡な表形式データで少数クラスを補う合成データ生成に、分位点損失を加えた拡散モデルQuantile-TabDDPMを提案した。", "p3": "通常の二乗誤差のノイズ除去目的に分位点損失の項を加え、稀で極端な値と少数クラスの特徴を捉えるようにした（抄録）。", "p5": "極端に不均衡な実際のクレジットカード取引データで評価し、不正検知に頑健で有効な枠組みになったと報告している。具体的な数値は抄録にない（抄録）。", "fun": "不正な取引は全体のごく一部しかなく、AIは「全部正常」と答えるだけで高い正解率になってしまいます。珍しい例を人工的に増やすとき、平均だけでなく分布の端（めったに起きない値）を意識して学ばせる工夫がこの研究の要点です。", "unverified": "評価指標と比較手法の結果は未確認（抄録に記載なし）。"}}, {"id": "pr33", "rank": 33, "headline": "都市高速道路の分断と蓋かけ公園による関係回復", "title": "Concrete Barriers, Fractured Lives: Urban Highway Fragmentation and the Restorative Potential of Third Places Through Freeway Lids", "url": "https://doi.org/10.5281/zenodo.23180123", "authors": "Vinay, Prithvi", "venue": "Zenodo", "date": "2026-10-06", "apa": "Vinay, P. (2026). Concrete Barriers, Fractured Lives: Urban Highway Fragmentation and the Restorative Potential of Third Places Through Freeway Lids. Zenodo. https://doi.org/10.5281/ZENODO.23180123", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（叙述的レビュー）を使用", "preprint": true, "short": true, "p1": "都市の高速道路が社会的孤立の物理的な原因になっていると論じ、高速道路に蓋をして公園にする「フリーウェイ・リッド」で関係を回復する条件を整理した叙述的レビュー。", "p3": "社会的孤立の疫学、米国州間高速道路の歴史と経済、サードプレイスの社会学、リッドとグリーン・ジェントリフィケーションの計画研究を統合した（抄録）。", "p5": "統合解析では孤立は全死亡率の約30%上昇と関連し、州間高速道路の建設は1957〜1977年に47.5万世帯超を立ち退かせた。2025年の研究では大都市50すべてで道路をまたぐ人間関係が期待より少なかった。立ち退き対策のないリッドは地域を散らしうるとして、公平なリッドの5条件を示した（抄録）。", "fun": "道路は人や車をつなぐためのものなのに、街の真ん中を通ると人と人の関係を切ってしまいます。その上に公園を作れば再びつながれる、という発想は単純ですが、公園ができると家賃が上がって元の住民が住めなくなる、という落とし穴まで考えている点が面白いところです。", "unverified": "5条件の具体的な内容は本文未確認。"}}, {"id": "pr34", "rank": 34, "headline": "ラホールの高齢者で家族支援が健康管理を左右する", "title": "Family support, health outcomes and the management of geriatric conditions among older adults in Lahore, Pakistan: A cross- sectional study", "url": "https://doi.org/10.21203/rs.3.rs-11269059/v1", "authors": "Hina Khan¹ ほか", "venue": "Research Square (In Review)", "date": "2026-10-06", "apa": "Khan¹, H., & Akhtar¹, K. (2026). Family support, health outcomes and the management of geriatric conditions among older adults in Lahore, Pakistan: A cross- sectional study. https://doi.org/10.21203/rs.3.rs-11269059/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "パキスタン・ラホールの60歳以上325人の調査で、家族による支援が高齢者の健康と老年期の状態の管理にどう関わるかを調べた。", "p3": "2025年6〜12月に家庭・地域・宗教行事・施設で面接調査を行い、探索的因子分析、構造方程式モデル、二項ロジスティック回帰で分析した（抄録）。", "p5": "因子分析で4領域14次元が得られた。機能的自立と情緒的な健康が晩年の健康と最も強く関連し、家族との同居と定期的な連絡は孤独の低いオッズと関連した（抄録）。", "fun": "日本でも「家族が介護の中心」という考え方は根強くありますが、それを実際の健康との関係で測った研究は国によっては多くありません。家族と一緒に住み、よく話すことが孤独を減らすという結果は当たり前に見えて、政策の根拠を作るには数字で示す必要があるのです。", "unverified": "効果の大きさ（オッズ比）は未確認（抄録の結果部分が欠けている）。"}}, {"id": "pr35", "rank": 35, "headline": "中国の高齢ネット利用者を5つのペルソナに分類", "title": "What Are Older Internet Users Like? Investigating the Personas of Older Chinese Internet Users Using Two-Step Cluster Analysis", "url": "https://doi.org/10.21203/rs.3.rs-10176802/v1", "authors": "Xu Zhou ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Zhou, X., & Zhong, R. (2026). What Are Older Internet Users Like? Investigating the Personas of Older Chinese Internet Users Using Two-Step Cluster Analysis. https://doi.org/10.21203/rs.3.rs-10176802/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の高齢インターネット利用者5,863人を、利用の頻度・熟練度・幅・水準で5つのペルソナに分類した。", "p3": "2023年の中国高齢社会縦断調査（CLASS）のデータに2段階クラスター分析を適用した（抄録）。", "p5": "周辺的利用者（14.8%）、慎重な試し利用者（35.7%）、活発な主流利用者（35.4%）、統合的先駆者（8.8%）、制約された意欲者（5.3%）の5類型が得られ、年齢・学歴・健康・就業・所得・社会的ネットワーク・地域・セキュリティ意識で異なった（抄録）。熟練度は全体に高くなかった。", "fun": "「お年寄りはネットが苦手」とひとまとめにされがちですが、実際は使いこなす人から使いたくても使えない人まで、少なくとも5つのタイプがあるという結果です。タイプごとに必要な支援が違うので、一律の講習会では届かない人がいることが分かります。", "unverified": "なし"}}, {"id": "pr36", "rank": 36, "headline": "職場の偶然の出会いは給湯室とプリンタで起きる", "title": "The pantry, the printer, and the desk: sensing where workplace serendipity really happens", "url": "https://doi.org/10.21203/rs.3.rs-10276716/v1", "authors": "Lingzi Pan ほか", "venue": "Research Square (In Review)", "date": "2026-10-06", "apa": "Pan, L., Jin, Y., & Hu, Y. (2026). The pantry, the printer, and the desk: sensing where workplace serendipity really happens. https://doi.org/10.21203/rs.3.rs-10276716/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "建築設計事務所のオフィスを分単位のセンサで1か月計測し、偶然の対面交流（serendipity）がどこで起きるかを示した。", "p3": "中国の大手建築設計事務所で、共用空間と机の領域の在席を分単位で連続計測し、2,800件超の交流エピソードを記録した。同じ職場で空間の価値に関する従業員調査も行った（抄録）。", "p5": "給湯室ではリズムのある中程度に持続する交流が生じ、印刷エリアは短い事務的な同席にとどまり、机の周辺では長い課題志向の協働が起きた。給湯室は交流だけでなく一人で考え回復する場としても評価された（抄録）。", "fun": "会社のアイデアはどこで生まれるのでしょう。センサで実際に測ると、コピー機の前の立ち話より給湯室の方が交流が続き、しかも給湯室は「一人になれる場所」としても大事だと分かりました。空間の使われ方を数字で見ると、思い込みとは違う姿が見えてきます。", "unverified": "交流の定義とセンサの具体的な仕様は本文未確認。"}}, {"id": "pr37", "rank": 37, "headline": "AIは使う量より成果志向の使い方で生産性が決まる", "title": "From Token-Max to Outcome-Max: How You Use AI Determines Its Productivity", "url": "https://arxiv.org/abs/2610.05697", "authors": "Chen Xu ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Xu, C., Liu, M., Li, B., & Xiong, C. (2026). From Token-Max to Outcome-Max: How You Use AI Determines Its Productivity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05697", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AIをたくさん使っても生産性が比例して上がらない理由の一つを「トークン最大化」と名づけ、検証された成果を費用で割って報いる「成果最大化」を提案した。", "p3": "即時の対話、長期の行動適応、組織での協働の3段階のシミュレーション枠組みで二つの目的を比較し、成果最大化に誘因を合わせる仕組みOutcomeShareを理論とシミュレーションで分析した（抄録）。", "p5": "3段階すべてで、成果最大化は検証済みの課題成績をほぼ保ちながらAI支援の生産効率を高めた。OutcomeShareは参加を促し、従業員・企業・LLM提供者に共有の利益を生みうる（抄録）。数値は抄録にない。", "fun": "「たくさん勉強した時間」で評価すると、だらだら長く机に向かう人が得をしてしまいます。AIでも、使った計算量を努力とみなすと無駄に考えすぎるので、「確かめられた成果」で評価しよう、という提案です。AIの生産性は性能だけでなく評価の仕方で決まる、という視点が面白い点です。", "unverified": "シミュレーションの具体的な設定と効果の大きさは未確認。"}}, {"id": "pr38", "rank": 38, "headline": "職場の行動センシングと説明可能な幸福フィードバック", "title": "TrustmeWatcher: An Application for Workplace Micro-Sensing and Explainable Well-Being Feedback", "url": "https://arxiv.org/abs/2610.06657", "authors": "Chengyu Yu ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Yu, C., Costa, L. J., Anžur, Z., Li, M., Slapničar, G., Kirilenko, D., Gjoreski, M., Luštrek, M., & Langheinrich, M. (2026). TrustmeWatcher: An Application for Workplace Micro-Sensing and Explainable Well-Being Feedback (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06657", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "パソコンの操作記録と短い質問紙を結びつけ、職場の幸福感を予測して説明つきで本人に返すアプリTrustmeWatcherを開発した。", "p3": "ActivityWatchの操作記録収集を再利用し、画面時間のダッシュボード、StreamDeckでの質問紙回答、動画の要約表示を統合した。記録と自己報告を対応づけて学習し、6つの状態得点と総合的な幸福得点を手元のモデルで予測する（抄録）。", "p5": "説明可能AIで予測の根拠を示し、カメラと視線計測の一時停止などのプライバシー制御も備える。17人の参加者の記録での運用を記述している（抄録）。予測精度の数値は抄録にない。", "fun": "自分の働き方のデータから「今日は疲れていそう」と予測するAIが、なぜそう判断したかまで説明してくれる仕組みです。監視の道具にもなりうる技術を、本人に結果を返し、カメラを止める権利も渡す形で作ろうとしている点が考えどころです。", "unverified": "予測精度は未確認（抄録に記載なし）。"}}, {"id": "pr39", "rank": 39, "headline": "人とAIの協働度を開示する5段階評価の提案", "title": "The Reported Engagement with AI Level (REAL) Rating: A Framework for Disclosing Human-AI Collaboration", "url": "https://arxiv.org/abs/2610.04021", "authors": "Im\\`ene Goumiri ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Goumiri, I., Cortez-Rodriguez, M., Bell, E., & Muyskens, A. (2026). The Reported Engagement with AI Level (REAL) Rating: A Framework for Disclosing Human-AI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04021", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "作品や製品にAIがどれだけ関わったかを0〜5の6段階で開示する評価枠組みREALを提案した。", "p3": "人が作ったかAIが作ったかの二択や、利用者に見えにくい電子透かしに頼る現行の開示に代え、制作と利用体験の両面でのAIの関与を段階で示す仕組みを設計した（抄録）。", "p5": "文章・画像・音声・動画・ソフトウェアへの適用方法を具体的に示した。実証的な評価結果は抄録にない（抄録）。", "fun": "映画の年齢制限のように、AIの関わり方にも段階表示があれば、受け手は判断しやすくなります。「全部人間」か「全部AI」かでなく、その間にある多くの使い方を区別しようという発想は、AIと人の共同作業が当たり前になる時代に必要な物差しです。", "unverified": "各段階の具体的な定義は本文未確認。"}}, {"id": "pr40", "rank": 40, "headline": "手話通訳者はAI導入の境界をどう引くか", "title": "“Safe for now?” Boundary work and tensions of AI Adoption in Sign Language Interpreting and Speech-to-Text Reporting in Belgium and the Netherlands", "url": "https://doi.org/10.31235/osf.io/vwgc3_v2", "authors": "Maartje De Meulder ほか", "venue": "SocArXiv", "date": "2026-10-06", "apa": "De Meulder, M., Gebruers, K., & Giustini, D. (2026). “Safe for now?” Boundary work and tensions of AI Adoption in Sign Language Interpreting and Speech-to-Text Reporting in Belgium and the Netherlands. https://doi.org/10.31235/osf.io/vwgc3_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベルギー（フランデレン）とオランダの手話通訳者と文字通訳者が、AIによる言語技術を職業生活の中でどう捉え、境界を引いているかを調べた。", "p3": "2025年のオンライン調査（N=134）を、境界作業（boundary work）の理論で分析した（抄録）。", "p5": "予想される混乱と現在の安定が共存する時間の緊張、AIが選択肢を広げる一方で「十分な情報保障」の定義を狭める緊張、生活を脅かす技術が職業の理念を進めもする職業的アイデンティティの緊張の3つが見いだされた。AIを第三の当事者とみなし、編集や品質管理への役割移行が報告された（抄録）。", "fun": "自動の文字起こしが進むと、文字通訳の仕事は減るかもしれません。でも手話はAIの学習データが少ないため、まだ守られている。同じ「通訳」でも技術との距離が違い、AIが聴覚障害者の情報保障を広げる一方で専門家の仕事を脅かすというねじれが、具体的な声から見えてきます。", "unverified": "なし"}}, {"id": "pr41", "rank": 41, "headline": "計測報告をデジタルツインに渡す監査可能な契約", "title": "Auditable Handoff of Declared Measurement Reports to Digital Twins: A Purpose-Specific Admission Contract", "url": "https://doi.org/10.2139/ssrn.7571327", "authors": "Atsushi Otsuka", "venue": "SSRN", "date": "2026-10-06", "apa": "Otsuka, A. (2026). Auditable Handoff of Declared Measurement Reports to Digital Twins: A Purpose-Specific Admission Contract. https://doi.org/10.2139/ssrn.7571327", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "計測報告をデジタルツインに渡すとき、形式が正しいだけでなく目的に照らして受け入れてよいかを判定する、監査可能な受け渡し契約を提案した。", "p3": "送り手の宣言に受け手側の受け入れ判定を加え、報告の同一性・記述上の差・不確かさで正規化した比較を区別する有限の規則を定めた。証拠が欠ければ保留、宣言が矛盾すれば遮断する（抄録）。", "p5": "公開のGNSSとUWBの再生データで、形式上は正しい契約でも、時刻の宣言の不一致は評価を遮断し、時刻規則の欠落は保留になるなど、結果が分かれた。これらは仕様への適合の確認であり、測位性能の結果ではないと明記している（抄録）。", "fun": "データが「正しい形式」で届いても、それを別のデータと比べてよいとは限りません。時刻の基準が違えば比較は意味を失います。データを受け取る側に門番を置き、怪しいものは止めたり保留したりする仕組みは、地味ですがデジタルツインの信頼性の土台です。", "unverified": "規則の全体と実装の詳細は本文未確認。"}}, {"id": "pr42", "rank": 42, "headline": "SDE由来カーネルの半分離構造で推定を高速化", "title": "On the Sequentially Semiseparable Structure of SDE-Induced Kernels and Efficient Algorithms for Kernel-Based Estimation Problems", "url": "https://arxiv.org/abs/2610.05856", "authors": "Mikkel Paltorp ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形時不変の確率微分方程式（SDE）から導かれるカーネルの共分散行列が持つ逐次半分離（SSS）構造を使い、ガウス過程回帰やカーネル正則化の計算を線形時間で行う再帰アルゴリズムを導いた。", "p3": "カルマンフィルタと平滑化で潜在状態を扱う従来の線形時間法に代え、観測共分散行列のSSS表現を直接使い、分解・求解・対数行列式・事後共分散・周辺尤度の勾配・事後標本生成を再帰的に計算する（抄録）。", "p5": "対象のカーネルには半整数の滑らかさのMatérnカーネル、スプラインカーネル、システム同定で使われるカーネルが含まれ、同じ再帰がシステム同定のカーネル正則化にも少しの修正で拡張できる（抄録）。数値実験の結果は抄録にない。", "fun": "ガウス過程回帰はデータ数の3乗に比例して計算が重くなるのが弱点です。カーネルが「ばね・ダンパの方程式」のようなSDEから作られていると、行列が特別な形をしていて、データ数に比例する時間で計算できる、という数学の構造を生かした工夫です。", "unverified": "計算時間の比較などの数値結果は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "低軌道GNSSコンステレーションでPPPの収束が速まる", "title": "Pulsar Constellation Evolution and PPP Convergence using LEO GNSS", "url": "https://arxiv.org/abs/2610.06759", "authors": "Claire Mah ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "低軌道（LEO）の専用GNSS衛星群Pulsarを例に、LEO衛星が測位・航法・時刻にもたらす影響と、評価方法の選び方を論じた。", "p3": "展開段階の異なる4つの構成で、GPS単独・LEOで補強したGPS・LEO単独を、可視性、精度劣化係数（DOP）、精密単独測位（PPP）の収束で比較した（抄録）。", "p5": "抄録は比較の枠組みを述べるが、収束時間などの具体的な数値は示していない（抄録）。", "fun": "GPS衛星は約2万km上空を回りますが、低軌道の衛星はもっと近くを速く動くため、空の見え方が短時間で大きく変わります。その速さが精密な測位の「立ち上がり」を早める可能性があり、従来の評価方法をそのまま使ってよいかまで考えている点が面白いところです。", "unverified": "PPP収束の数値結果は未確認（抄録に記載なし）。"}}, {"id": "pr44", "rank": 44, "headline": "地盤のクリープから破壊への遷移を動態で予測", "title": "Forecasting Geotechnical Regime Shifts by Modelling System Dynamics over Static States", "url": "https://doi.org/10.2139/ssrn.7570484", "authors": "Ali Hadi Shujaie ほか", "venue": "SSRN", "date": "2026-10-06", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "地すべりがゆっくりしたクリープから加速破壊へ移る転換を予測するため、外力・水理力学応答・変形を因果的に結ぶ物理情報付きの枠組みLPIHCを提案した。", "p3": "密なセンサ配置がニューラルネットに不安定化の過程ではなく静的な代理変数を学ばせる「位置のおとり効果」を指摘し、中国・周家地すべりの10年の監視記録で時系列順の分割により検証した（抄録）。", "p5": "相関に基づく10の基準モデルはすべて検証のR²が負で、深層モデルは-2.98〜-4.95、従来手法では-2262まで下がった。LPIHCを組み込むと外挿性能が大きく改善し、双方向LSTMが最良だった（抄録）。", "fun": "センサが多いほど予測は良くなりそうですが、AIが「どの場所のセンサか」という手がかりに頼り、崩れる仕組みそのものを学ばないことがあります。テストで決定係数が大きくマイナスになる、つまり平均値で当てるより悪いという結果は、過去にない加速を当てる難しさを物語ります。", "unverified": "LPIHCを使ったときの誤差の具体的な値は抄録の途中で切れており未確認。"}}, {"id": "pr45", "rank": 45, "headline": "DEMと多体動力学の連成で多脚ロボットの粒状地歩行", "title": "A Coupled DEM--MBD Framework for High-Fidelity Simulation of Multi-legged Robot Locomotion on Granular Terrain", "url": "https://doi.org/10.21203/rs.3.rs-10722145/v1", "authors": "Kaiming Zhang ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "粒状の地面の上を転がる12脚の球形ロボットについて、個別要素法（DEM）と多体動力学（MBD）を双方向に連成するシミュレーション枠組みを作った。", "p3": "地面を球形粒子のDEMで、ロボットを三角形分割した足裏を持つ拘束多体系で表し、法線・接線・転がり・ねじりの抵抗を含む粒子-面要素の接触定式化を導入した。格子による接触探索、同期した陽解法、GPU並列で計算する（抄録）。", "p5": "古典的なDEMとMBDの検証問題と全体の走行シミュレーションで、ロボットの軌跡と地盤の支持の変化をともに捉えられることを示した（抄録）。数値の誤差は抄録にない。", "fun": "砂浜を歩くと足が沈み、砂が動いて歩き方も変わります。ロボットと砂粒の一つひとつが押し合う様子を同時に計算することで、「地面は動かない」という仮定なしに走行を予測できるようにした点が、この研究の挑戦です。", "unverified": "検証での誤差の大きさは未確認。"}}, {"id": "pr46", "rank": 46, "headline": "等幾何解析とKANを組み合わせたPDE順逆解析", "title": "IGA-KAN: Isogeometric Analysis with Physics-Informed Closed-Form Kolmogorov-Arnold Networks for Forward and Inverse PDEs", "url": "https://arxiv.org/abs/2610.06348", "authors": "Sima Naraghi ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "等幾何解析（IGA）の解を、閉形式で当てはめた局所的なコルモゴロフ・アーノルド・ネットワーク（KAN）で補正し、未知数を増やさずに精度を高める方法IGA-KANを提案した。", "p3": "IGAのガラーキン解を求めたあと、各節点パッチで方程式の強形式・境界値・IGA解にKAN型のリッジモデルを線形最小二乗で当てはめ、IGAの帽子関数で混ぜ合わせる。最大値原理に基づく事後の安全装置で局所モデルを使う場所を決める（抄録）。", "p5": "厳密解のある8つの問題で、IGAの誤差をL²で4.2〜90倍、H¹で4.1〜220倍減らし、同じ予算でゼロから学習したKANよりL²誤差が6〜6×10⁴倍小さかった。逆問題では未知の一定の源をIGAより167倍正確に復元した（抄録）。", "fun": "AIで方程式を解く研究は、従来の数値解法を置き換えようとしてかえって精度を落とすことが多くありました。この研究は逆に、従来の解を土台にして、AIを「仕上げの微調整」にだけ使います。しかも学習を連立一次方程式で一発で解くので、試行錯誤の学習が要らない点が巧みです。", "unverified": "なし"}}, {"id": "pr47", "rank": 47, "headline": "超弾性材料の幾何学的厳密平面梁の有限要素", "title": "On finite elements for geometrically-exact planar beams with hyperelastic material models", "url": "https://arxiv.org/abs/2610.05231", "authors": "Abhishek Ghosh ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "幾何学的に厳密な平面梁の有限要素に、超弾性の材料モデルを一貫して組み込む枠組みを作った。", "p3": "幾何学的非線形の3場の梁モデルに、面内の厚さ方向の変形を許す追加の場を加え、面外方向は平面ひずみと平面応力の構成則の縮約で別に扱った（抄録）。", "p5": "平面応力ではポアソン比を変えても中心線の変形がほぼ一致したが、文献で広く使われる平面ひずみではポアソン比との連成に敏感で、大きいポアソン比で梁が著しく硬くなった。サンブナン・キルヒホッフとネオフック模型は全体変形でよく一致した（抄録）。", "fun": "梁を「線」として扱う簡単なモデルに、ゴムのような柔らかい材料の性質を入れると、どの方向の変形を許すかという小さな仮定の違いで、梁の硬さが大きく変わってしまいます。教科書でよく使われる仮定が、実は結果をゆがめうるという指摘が面白い点です。", "unverified": "硬化の具体的な倍率は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "ラベル不要のPINNで空間変動斜面の信頼性を評価", "title": "Label-free physics-informed strength reduction and a neural operator for the reliability of spatially variable slopes", "url": "https://arxiv.org/abs/2610.04828", "authors": "Apisit Robjanghvad ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "正解データなしで学習する物理情報ニューラルネットワーク（PINN）で強度低減法を解き、空間的にばらつく斜面の破壊確率を有限要素解なしで求める流れを作った。", "p3": "非関連流れ則のモール・クーロン塑性を仮想仕事の損失で有限要素メッシュ上に学習し、多数のランダム場をGPUで同時に解く。PINNの解だけで作用素ネットワークを学習し、100万個の場の安全率と破壊モードを数秒で予測する（抄録）。", "p5": "52のランダム場でAbaqusの安全率を二乗平均2〜3%で再現した。モンテカルロ・FORM・重点サンプリング・作用素は破壊確率10⁻³まで整合したが、安全率の3%のばらつきで10⁻³の確率が最大2倍に膨らんだ。ビショップ法は破壊確率を2.6倍と8.3倍低く見積もった（抄録）。", "fun": "斜面の土の強さは場所ごとにばらつくので、崩れる確率を出すには何千、何万通りの計算が必要です。AIに物理の法則だけを教えて一気に解かせると、計算は劇的に速くなります。一方で、安全率のわずかな誤差が「めったに起きない崩壊」の確率を大きく変えるという注意も示しています。", "unverified": "なし"}}, {"id": "pr49", "rank": 49, "headline": "パラメトリックDMDと誤差学習で脈動乱流を縮約", "title": "Parametric Dynamic Mode Decomposition with Sparse DNS-Informed Discrepancy Learning for Pulsatile Turbulent Pipe Flow", "url": "https://doi.org/10.21203/rs.3.rs-11015233/v1", "authors": "Yacine Addad ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "脈動する管内乱流の壁面せん断の予測で、RANSの縮約モデルを少数の直接数値計算（DNS）から学んだ補正で直すパラメトリック動的モード分解（pDMD）の枠組みを作った。", "p3": "位相分解したRANS計算を固有直交分解（POD）と複素DMDで縮約し、疎なDNSから壁面せん断の伝達関数の誤差を学習してパラメータ空間で補間し、未知の運転条件の振幅と位相を補正する（抄録）。", "p5": "4件のDNSだけで、壁面せん断の振幅誤差を約10〜15%からDNSと一致する水準まで下げた。脈動パラメータの3%の不確かさは狭い予測区間にとどまった（抄録）。", "fun": "精密だが高価な計算（DNS）と、安いがずれる計算（RANS）のいいとこ取りをする工夫です。高価な計算はたった4回だけ行い、そこから「安い計算のずれ方」を学んで他の条件にも当てはめる。少ない手本から誤差の癖を覚える点が賢いところです。", "unverified": "なし"}}, {"id": "pr50", "rank": 50, "headline": "多面体スケールド境界要素で3次元亀裂進展を解く", "title": "A polyhedral scaled boundary concept applied to finite-strain hyperelasticity and three-dimensional crack growth simulations", "url": "https://doi.org/10.2139/ssrn.7570608", "authors": "Emilia Oheim ほか", "venue": "SSRN", "date": "2026-10-06", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "多面体メッシュ上で3次元の亀裂進展と有限ひずみの非線形解析を行う、等パラメトリックなスケールド境界要素の定式化を示した。", "p3": "八分木・ハニカム・ボロノイのメッシュに定式化を組み込み、亀裂先端の特異性を表す1/4点の3次元亀裂前縁要素を作った。混合モードの応力拡大係数を変位解から直接求め、進展方向を決める（抄録）。", "p5": "亀裂前縁要素は多面体要素と容易に結合でき、傾いた非平面の亀裂前縁を含む局所的な位相変化を扱えた。破壊パラメータの正確な評価、頑健な亀裂経路の予測、効率的な計算を示した（抄録）。数値は抄録にない。", "fun": "ひびが伸びるたびにメッシュを全部作り直すのは大変です。多面体の要素を使うと、ひびの周りだけ細かくしたり形を変えたりが楽になります。ひびの先端という「応力が無限に大きくなる点」を特別な要素で表す工夫と組み合わせた点がこの研究の要です。", "unverified": "精度の数値は未確認（抄録に記載なし）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "強化学習はLLMの推論をどう作り変えるか", "title": "How RL Reshapes LLM Reasoning: Transferability, Coverage, and Scaling Laws", "url": "https://arxiv.org/abs/2610.04158", "authors": "Ziheng Cheng ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "why": "数学で鍛えた推論が他領域に移る一方で広がりが限られるという矛盾した報告を、転移性・網羅性・スケーリング則の観点で整理し直した。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "事前トレンド検定の代わりに期間を平均して推定", "title": "An Averaging Alternative to Pre-Trend Testing", "url": "https://arxiv.org/abs/2610.05705", "authors": "Nicholas L. Brown ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "why": "どの処置前期間で平行トレンドが成り立つか不確かなときに、検定で選ぶのではなく推定量を平均する差の差の推定法を提案した。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "未測定交絡の下で代理変数から処置効果を学ぶ", "title": "Proximal Causal Learning under Unmeasured Confounding", "url": "https://arxiv.org/abs/2610.04519", "authors": "Ying Tang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "why": "観察データで未測定交絡がある場合に、代理変数を使う近接因果学習で処置効果を推定する方法を扱った。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "記者の移籍から記者の思想が報道の偏りを決めると示す", "title": "Journalist Ideology and the Pr     "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
