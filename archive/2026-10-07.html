動機を高めた。社内研修は認知と利用経験の関係を正に調整した（抄録）。効果の大きさは抄録にない。", "fun": "AIを「便利そう」と思うだけでは、仕事のやる気は直接上がりません。実際に使ってみて手応えを感じる経験を通して初めて、仕事そのものが楽しくなる。社内研修がその体験を後押しするという結果は、道具の導入と教育をセットで考える大切さを示しています。", "unverified": "標本の規模と係数は未確認（抄録に記載なし）。"}}, {"id": "jr17", "rank": 17, "headline": "AIへの意識はホテル従業員の率先行動を高めるか", "title": "Self-enhancement or self-protection? How artificial intelligence awareness shapes taking charge behavior", "url": "https://doi.org/10.1108/ijchm-02-2026-0172", "authors": "Yajun Zhang ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-10-06", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Zhang, Y., Wang, J., Zhou, F., & Zhang, J. (2026). Self-enhancement or self-protection? How artificial intelligence awareness shapes taking charge behavior. International Journal of Contemporary Hospitality Management, 1–17. https://doi.org/10.1108/ijchm-02-2026-0172", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "ホテル従業員のAIへの意識（AI awareness）は、自己高揚の動機を通じて率先行動を高め、自己防衛の動機を通じて下げるという二つの経路を持つことを示した。", "p3": "中国のホテル従業員428人とその直属上司の2時点調査で、階層的回帰とブートストラップで媒介と調整（統制の所在）を分析した（抄録）。", "p5": "AI意識は自己高揚動機を介して率先行動に正の、自己防衛動機を介して負の間接効果を持った。内的な統制の所在はAI意識と自己高揚動機の関係を強め、自己防衛動機との関係を弱めた（抄録）。", "fun": "「AIに仕事を取られるかも」という意識は、人を奮い立たせることもあれば、身を守るために萎縮させることもあります。どちらに転ぶかは「自分の行動で結果を変えられる」と思えるかどうかで決まる、という結果は、同じニュースでも受け止め方で行動が逆になることを示しています。", "unverified": "なし"}}, {"id": "jr18", "rank": 18, "headline": "ハイブリッド勤務でのAI導入と従業員の幸福", "title": "Artificial Intelligence Adoption and Employee Well-Being in Hybrid Work Environments", "url": "https://doi.org/10.3126/npjbe.v9i1.100891", "authors": "T G Ashwini ほか", "venue": "New Perspective: Journal of Business and Economics", "date": "2026-10-06", "apa": "Ashwini, T. G., & Radha, P. (2026). Artificial Intelligence Adoption and Employee Well-Being in Hybrid Work Environments. New Perspective: Journal of Business and Economics, 9(1), 159–168. https://doi.org/10.3126/npjbe.v9i1.100891", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ハイブリッド勤務でのAI導入が従業員の幸福感に与える正負の影響を検討する研究で、抄録は調査の設計と仮説を示す段階の内容になっている。", "p3": "構造化された質問紙で量的に調べる方法を提案し、知覚された組織支援がAI導入と幸福感を媒介し、デジタル能力が調整する関係を検討するとしている（抄録）。", "p5": "抄録には実証結果がなく、「結果は有用であろう」と述べるにとどまる。テクノストレス、雇用不安、労働強化、対人交流の減少などの論点を整理している（抄録）。", "fun": "AIで仕事が効率化される一方、在宅と出社が混ざる働き方では、機械に囲まれて人と話す機会が減るかもしれません。良い面と悪い面を同時に測ろうとする研究の設計図ですが、答えはまだ出ていない点に注意が必要です。", "unverified": "実証結果の有無は未確認（抄録は計画段階の記述）。"}}, {"id": "jr19", "rank": 19, "headline": "人事担当者のAIによる雇用不安と職場学習", "title": "Are HR professionals insecure? AI, job insecurity and the re-wiring of workplace learning", "url": "https://doi.org/10.1108/jwl-05-2026-0256", "authors": "Federica Polo ほか", "venue": "Journal of Workplace Learning", "date": "2026-10-06", "citescore": 4.9, "citescore_year": "2025", "apa": "Polo, F., Abid, K., & Ahmed, A. (2026). Are HR professionals insecure? AI, job insecurity and the re-wiring of workplace learning. Journal of Workplace Learning, 1–21. https://doi.org/10.1108/jwl-05-2026-0256", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "人事担当者はAIによる役割の変化を段階的な業務の組み替えと受け止め、雇用不安は失業の恐れより役割期待の不確かさとして現れることを示した。", "p3": "資源保存理論に基づき、人事担当者への半構造化面接を主題分析した質的研究（抄録）。", "p5": "AIは戦略的・関係的な責任へ仕事を移す補完的な道具と解釈された。雇用不安は主に質的なもの（役割期待の変化への不確かさ）で、人の判断と関係の専門性は代替できないという認識が職業的アイデンティティを安定させた（抄録）。", "fun": "AIの影響というと「仕事がなくなるか」ばかりが話題になりますが、実際に人が感じているのは「自分の役割がこれからどう変わるのか分からない」という不安でした。不安の中身を丁寧に聞き取ると、対策の打ち方も変わってきます。", "unverified": "面接の人数は未確認（抄録に記載なし）。"}}, {"id": "jr20", "rank": 20, "headline": "公務員の仕事の要求度と資源がエンゲージメントを決める", "title": "Job Demands, Job Resources, and Work Engagement among Civil Servants in Sumedang Regency, West Java, Indonesia: A Job Demands-Resources Perspective", "url": "https://doi.org/10.55606/bijmt.v6i2.8203", "authors": "Ema Yudiani ほか", "venue": "Brilliant International Journal Of Management And Tourism", "date": "2026-10-06", "apa": "Ema Yudiani, Herdian Martino, & Annisa Rizka Kusuma. (2026). Job Demands, Job Resources, and Work Engagement among Civil Servants in Sumedang Regency, West Java, Indonesia: A Job Demands-Resources Perspective. Brilliant International Journal of Management and Tourism, 6(2), 282–288. https://doi.org/10.55606/bijmt.v6i2.8203", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの地方公務員150人で、仕事の要求度より仕事の資源がワーク・エンゲージメントを強く予測することを、仕事の要求度-資源（JD-R）モデルで示した。", "p3": "比例抽出した公務員の横断調査で、検証済みの自己報告尺度を用い、相関と重回帰で分析した（抄録）。", "p5": "要求度と資源でエンゲージメントの分散の47.0%を説明した。上司の支援・自律性・フィードバック・キャリア機会などの資源は強い正の予測因子（β=.66）で、要求度は有意でなかった（β=-.09、p=.140）（抄録）。", "fun": "仕事への熱意を保つには、仕事を減らすより、上司の支えや任される裁量を増やす方が効く、という結果です。忙しさを削るだけでは人は元気にならない、という職場づくりのヒントになります。", "unverified": "なし"}}, {"id": "jr21", "rank": 21, "headline": "近隣の集合的効力感とADHDの若者の心理社会的成果", "title": "Unlocking the Power of Neighborhood Collective Efficacy: Associations with ADHD and Youth Outcomes Among Black and White Adolescents", "url": "https://doi.org/10.1007/s40615-026-03209-2", "authors": "C. Danielle Green ほか", "venue": "Journal of Racial and Ethnic Health Disparities", "date": "2026-10-06", "sjr": 1.255, "citescore": 7.1, "citescore_year": "2025", "apa": "Green, C. D., Chan, E. S. M., Padgett, S. E., Peugh, J. L., Dvorsky, M. R., Langberg, J. M., & Becker, S. P. (2026). Unlocking the Power of Neighborhood Collective Efficacy: Associations with ADHD and Youth Outcomes Among Black and White Adolescents. Journal of Racial and Ethnic Health Disparities. https://doi.org/10.1007/s40615-026-03209-2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "米国の青少年2,178人で、近隣の集合的効力感とADHDの有無が心理社会的・学業的な成果とどう関わるかを、人種による違いとともに調べた。", "p3": "Future of Families and Child Wellbeing Studyの14〜19歳（黒人73.0%、白人27.0%）について、本人と養育者が報告した近隣の集合的効力感と、人種・ADHDとの交互作用を分析した（抄録）。", "p5": "本人と養育者の報告は弱くしか相関しなかった。集合的効力感が高いほど粘り強さが高い関係は白人の青少年でのみ見られ、黒人の青少年では見られなかった。ADHDは学校での困難の増加と関連した（抄録）。", "fun": "「地域のつながりが子どもを守る」とよく言われますが、その効き方は誰にとっても同じではありませんでした。同じ近所でも、子どもと親で見え方が違うことも分かり、地域の力を測るときに誰の目で見るかが大切だと教えてくれます。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "家族の資産が生涯の安心と幸福の不平等を生む", "title": "Family Wealth and Wellbeing: The Unequal Distribution of Security Across the Life Course", "url": "https://doi.org/10.1111/1468-4446.70176", "authors": "Megan Brodie ほか", "venue": "British Journal of Sociology", "date": "2026-10-06", "sjr": 1.365, "citescore": 5.2, "citescore_year": "2025", "apa": "Brodie, M., & Churchill, B. (2026). Family Wealth and Wellbeing: The Unequal Distribution of Security Across the Life Course. The British Journal of Sociology. https://doi.org/10.1111/1468-4446.70176", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "オーストラリアの25〜50歳で、親の資産が本人の健康と経済的な幸福に、本人の所得や資産を考慮しても関連し、その一部は持ち家を通じていることを示した。", "p3": "HILDA調査の1,039人で、親の資産と一般的健康・精神的健康・生活満足・経済的幸福の4領域の関係を線形回帰で分析した（抄録）。", "p5": "親の資産が多いほど一般的健康と経済的幸福が高く、その一部は持ち家による住まいの安定を経由していた。一方、親からの金銭援助を受けることはその時点の幸福の低さと関連し、援助が困窮時の支えとして働いていることを示唆した（抄録）。", "fun": "親がお金持ちだと大人になっても健康で安心、というのは想像できますが、「親からお金をもらっている人ほど今は幸福度が低い」という結果は一見逆に見えます。困ったときに助けてもらっているから、と考えると筋が通り、データの読み方の面白さが分かります。", "unverified": "なし"}}, {"id": "jr23", "rank": 23, "headline": "アンカリング・ビネットで主観的健康の比較を補正", "title": "Predictors of self-rated health in older adults: insights from an anchoring vignettes study", "url": "https://doi.org/10.1007/s10433-026-00952-7", "authors": "Karolina Thune ほか", "venue": "European Journal of Ageing", "date": "2026-10-06", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "apa": "Thune, K., Falk Erhag, H., Berg, A. I., Johansson, L., & Solevid, M. (2026). Predictors of self-rated health in older adults: insights from an anchoring vignettes study. European Journal of Ageing, 23(1). https://doi.org/10.1007/s10433-026-00952-7", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "スウェーデンの60〜85歳で、アンカリング・ビネット（架空の人物の健康状態を評価させて回答基準を揃える方法）で主観的健康を補正すると、属性との関係が変わることを示した。", "p3": "スウェーデン市民パネルで年齢・性別で層化した4,300人を招き、3,083人が80%超に回答した。補正前と補正後の主観的健康と人口学的・健康関連要因の関係を比べた（抄録）。", "p5": "属性と主観的健康の関連は、補正の前後で変化した。補正前は女性の方が男性より健康を良く評価していた（抄録、補正後の結果は抄録の途中で切れている）。", "fun": "「健康状態はどうですか」と聞かれて「良い」と答える基準は人によって違います。同じ架空の人物を全員に評価してもらえば、各自の物差しのずれが分かり、補正できます。高齢者が健康を楽観的に答える傾向も、この方法で見直せるかもしれません。", "unverified": "補正後の性差などの結果は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "フィンランドのロシア語系移民高齢者の健康格差", "title": "Inequalities in sustainable ageing: functional mobility and depressive symptoms across migration subgroups among Russian-speaking migrants in Finland", "url": "https://doi.org/10.1007/s10433-026-00953-6", "authors": "Lily Nosraty ほか", "venue": "European Journal of Ageing", "date": "2026-10-06", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "apa": "Nosraty, L., Beattie, M., Kouvonen, A., & Wrede, S. (2026). Inequalities in sustainable ageing: functional mobility and depressive symptoms across migration subgroups among Russian-speaking migrants in Finland. European Journal of Ageing. https://doi.org/10.1007/s10433-026-00953-6", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "フィンランドの中高年のロシア語系移民を潜在クラス分析で「定着型」と「脆弱型」に分け、65歳以上では脆弱型の身体移動能力が低いことを示した。", "p3": "CHARM研究のデータで、65歳未満（653人）と65歳以上（492人）に分けて潜在クラス・プロファイル分析を3段階法で行い、身体移動能力と抑うつ症状との関係を比べた（抄録）。", "p5": "両年齢層で、早く移住し現地語が堪能で所得支援を受けない定着型と、遅く移住し現地語が不得手で所得支援を受ける脆弱型の2群が得られ、男性は脆弱型に属しやすかった。65歳以上の脆弱型は身体移動能力が低かった（抄録）。", "fun": "「移民の高齢者」とひとくくりにすると見えない差が、いつ来たか、言葉ができるかで分けるとはっきり現れます。支援が必要な人を見つけるには、集団の中の違いを丁寧に分ける必要がある、という教訓です。", "unverified": "抑うつ症状との関係の結果は抄録の途中で切れており未確認。"}}, {"id": "jr25", "rank": 25, "headline": "高齢者にやさしい環境が社会関係を改善する仕組み", "title": "Perceived role of age-friendly environments in improving social relationships: a qualitative exploration of older adults’ perspectives in China", "url": "https://doi.org/10.1080/13607863.2026.2738062", "authors": "Jie Li ほか", "venue": "Aging & Mental Health", "date": "2026-10-05", "citescore": 6.8, "citescore_year": "2025", "apa": "Li, J., Shi, L., Zheng, Z., Wu, Y., Li, J., & Jiang, N. (2026). Perceived role of age-friendly environments in improving social relationships: a qualitative exploration of older adults’ perspectives in China. Aging & Mental Health, 1–17. https://doi.org/10.1080/13607863.2026.2738062", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の高齢者29人への面接で、高齢者にやさしい環境での活動参加が社会関係を改善する一方、関係の構造自体はあまり変わらないことを示した。", "p3": "55歳以上で同じ地域に1年以上住む住民への半構造化面接を、応用主題分析で分析した（抄録）。", "p5": "支えとなる空間としての環境、交流の増加と孤独の軽減、参加の喜びと愛されている感覚、という肯定的な主題とともに、顔見知りとの表面的な交流や新しい出会いの少なさ、資源と移動の制約による関係構造の変化の限界が見いだされた（抄録）。", "fun": "公民館の体操教室に通えば寂しさは和らぎますが、そこで出会うのはいつもの顔ぶれで、新しい友達はなかなかできません。場所を作るだけでは人間関係の広がりまでは生まれない、という指摘は、地域づくりの次の課題を示しています。", "unverified": "なし"}}, {"id": "jr26", "rank": 26, "headline": "都市と国の分極が進歩的都市の自治を形づくる", "title": "TWO CONCEPTS OF POLARIZATION : Urban–National Tension and its Effects on the Liberal Trajectory of Cities", "url": "https://doi.org/10.1111/1468-2427.70145", "authors": "Harel Nachmany ほか", "venue": "International Journal of Urban and Regional Research", "date": "2026-10-06", "sjr": 1.104, "citescore": 4.7, "citescore_year": "2025", "apa": "Nachmany, H., Alster, T., & Avni, N. (2026). TWO CONCEPTS OF POLARIZATION : Urban–National Tension and its Effects on the Liberal Trajectory of Cities. International Journal of Urban and Regional Research. https://doi.org/10.1111/1468-2427.70145", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "都市と国の政府の対立（分極）を政策分野ごとに評価する枠組みを作り、テルアビブ・ヤッフォで分極の強さが都市の進歩的政策の進め方を変えることを示した。", "p3": "分極をイデオロギー的なものと実務的なものに分け、ジェンダー平等・環境・LGBTQ+の権利・移民・宗教と国家の5分野で、中央と地方の分極の度合いと自治体の実施戦略を評価した（抄録）。", "p5": "分極が強い分野では組織が分断され、象徴的・戦術的な政策形成と強い財政的独立が見られ、弱い分野では包括的な戦略計画と制度の安定が見られた（抄録）。", "fun": "国と考え方が違う都市は、どうやって自分たちの政策を進めるのでしょうか。対立が強い分野ほど、正面からの計画ではなく、象徴的な行動や独自財源でしのぐという「都市の戦い方」が見えてきます。", "unverified": "なし"}}, {"id": "jr27", "rank": 27, "headline": "壁画アートが若者の銃暴力被害を減らすか準実験で検証", "title": "Mural Art and Youth Victimization of Firearm Violence: A Quasi-Experimental Analysis", "url": "https://doi.org/10.1007/s11524-026-01153-4", "authors": "Shaun Bhatia ほか", "venue": "Journal of Urban Health", "date": "2026-10-05", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "apa": "Bhatia, S., Lee, D. B., Wyatt, R., Crimmins, H., Tharp, S., Byron, M. C., Howard, B. J., Zimmerman, M. A., & Prophet, J. (2026). Mural Art and Youth Victimization of Firearm Violence: A Quasi-Experimental Analysis. Journal of Urban Health. https://doi.org/10.1007/s11524-026-01153-4", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "デトロイトの248か所の壁画の周辺で、設置後に若者が被害者となる警察対応の暴力事件が減ったことを、傾向スコアマッチングの準実験で示した。", "p3": "壁画のない場所を3:1の傾向スコアマッチングで選び、ストリートビューで対照地点を確認した。区画の重心から100〜400 mのカーネル密度で事件を集計し、用途地域、前年の事件、近隣の不利などを共変量に入れた（抄録）。", "p5": "壁画設置後、すべての帯域幅で若者の暴力被害の事件が少なく、距離が遠いほど効果は小さかった。地域への関心とケアの物理的な表れとしての公共アートを強調するビジー・ストリート理論を支持した（抄録）。", "fun": "壁に絵を描くだけで暴力が減るなんて、と思うかもしれません。でも、手入れされた街は「誰かが見守っている」という合図になります。比べる場所を慎重に選び、壁画からの距離で効果が薄れることまで確かめた点に説得力があります。", "unverified": "減少の大きさの数値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "チリのスマートシティと住宅トークン化のデータ構造", "title": "Dashboards Without Dwellings: Big Data, Real-Time Interfaces, and the Tokenisation of Housing in the Chilean Smart City", "url": "https://doi.org/10.3390/data11100262", "authors": "Francisco Vergara‐Perucich", "venue": "Data", "date": "2026-10-03", "citescore": 5.4, "citescore_year": "2025", "apa": "Vergara-Perucich, J. F. (2026). Dashboards Without Dwellings: Big Data, Real-Time Interfaces, and the Tokenisation of Housing in the Chilean Smart City. Data, 11(10), 262. https://doi.org/10.3390/data11100262", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "チリの住宅トークン化で実際に流通しているのは建物でも権利でもなく、住宅が生む収入への契約上の請求権であることを、法とデータ構造から示した。", "p3": "2022〜2026年のチリでの証拠を集め、フィンテック法の登録を目指す住宅トークンのプラットフォームの公開市場を、ヘッドレスブラウザで抽出して投資機会の提示のされ方を分析した（抄録）。", "p5": "19世紀以来の厳格な登記制度のため所有権自体はトークン化できず、事業者は所有権を特別目的会社に置いて経済的権利を切り出し、内部収益率で価格付けした持分として流通させていた。それが個人投資家向けにリアルタイムの投資ダッシュボードとして示されていた（抄録）。", "fun": "「家をデジタル化して少額から買える」と聞くと家の一部を持てる気がしますが、実際に買っているのは家賃収入への契約上の権利でした。最新技術の看板の裏で、古い登記制度が何を許し何を許さないかを解き明かした点が面白いところです。", "unverified": "抽出したデータの規模は抄録の途中で切れており未確認。"}}, {"id": "jr29", "rank": 29, "headline": "中国のスマートシティ試行がデジタル経済を進める", "title": "Smart City Pilot Programs and the Advancement of the Digital Economy: Empirical Insights from China", "url": "https://doi.org/10.1061/jupddm.upeng-6265", "authors": "Chenle Dai ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-10-06", "citescore": 3.9, "citescore_year": "2025", "apa": "Dai, C., & Han, X. (2026). Smart City Pilot Programs and the Advancement of the Digital Economy: Empirical Insights from China. Journal of Urban Planning and Development, 152(4). https://doi.org/10.1061/jupddm.upeng-6265", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の地級以上285都市で、スマートシティの試行がデジタル経済の発展水準を平均0.756%高めたことを差の差で示した。", "p3": "2011〜2019年の都市パネルデータに差の差法を適用し、デジタル消費・情報収集・人的資本の経路を検証した（抄録）。", "p5": "スマートシティの試行はデジタル経済の発展水準を平均0.756%有意に高め、デジタル消費、情報収集、人的資本の経路を通じて影響した（抄録）。", "fun": "街にセンサやネットを張り巡らせる政策は、本当に地域の経済を変えるのでしょうか。試行に選ばれた都市と選ばれなかった都市の変化を比べることで、政策の効果を取り出しています。数字は小さく見えますが、多くの都市を通じた平均効果です。", "unverified": "指標の定義は本文未確認。"}}, {"id": "jr30", "rank": 30, "headline": "ブランドの毒舌ユーモアは標的を変えると評価が変わる", "title": "Laugh with me, not at them: why changing the target of disparaging brand humor on social media matters beyond engagement", "url": "https://doi.org/10.1108/jrim-04-2026-0274", "authors": "Michael Moorhouse", "venue": "Journal of Research in Interactive Marketing", "date": "2026-10-06", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "apa": "Moorhouse, M. (2026). Laugh with me, not at them: why changing the target of disparaging brand humor on social media matters beyond engagement. Journal of Research in Interactive Marketing, 1–20. https://doi.org/10.1108/jrim-04-2026-0274", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "SNSでブランドが使う毒舌のユーモアは、競合でなく自分自身に向けると、面白さを保ちながらブランド評価も高まることを3つの実験で示した。", "p3": "スキーマ一致理論に基づき、自虐型と競合攻撃型のブランド投稿を比べた。研究1でいいね・評価・意地悪さ・人格との適合、研究2で通常投稿との比較とブランド人格の調整、研究3で架空ブランドを使い代替説明を検討した（抄録）。", "p5": "自虐型は競合攻撃型より評価が高く、意地悪と感じられにくかった（一部はブランド人格との適合による）。競合攻撃型は通常投稿よりいいねは増えたが評価は上がらず、自虐型は両方を高め、誠実・有能なブランドで利点が大きかった（抄録）。", "fun": "ライバルをからかう投稿は「いいね」は集めても、ブランドの好感度は上がりませんでした。自分を笑いの種にすると、面白さはそのままで感じも良くなる。人間関係でも、自虐ネタの方が他人いじりより好かれやすいのと似ています。", "unverified": "なし"}}, {"id": "jr31", "rank": 31, "headline": "決済アプリの利用者満足をEUCSとCSIで測る", "title": "Analysis of QRIS user satisfaction in the dana app for MSMEs using end-user computing satisfaction (EUCS) and customer satisfaction index (CSI)", "url": "https://www.ijafibs.pelnus.ac.id/index.php/ijafibs/article/view/534", "authors": "Nurul Aulia Asri ほか", "venue": "International Journal of Applied Finance and Business Studies", "date": "2026-10-05", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシア中部ロンボクの零細・中小事業者150人で、電子決済アプリのQRIS機能への満足度を、エンドユーザー・コンピューティング満足（EUCS）の5次元と顧客満足指数（CSI）で評価した。", "p3": "QRISを1か月以上、月3回以上使う事業者を目的抽出し、2026年5月20日に5段階の質問紙で調査した。23項目の妥当性と信頼性を検証し、22項目が有効だった（抄録）。", "p5": "EUCSの全次元で信頼性は0.60を上回った。記述分析と満足度の水準の結果は抄録の途中で切れている（抄録）。", "fun": "QRコード決済が小さなお店に広がる中、使う側が何に満足し何に不満かを「内容・正確さ・見やすさ・使いやすさ・速さ」に分けて測った研究です。顧客満足を一つの指数にまとめるCSIの使い方の一例として見ることができます。", "unverified": "CSIの値と次元別の結果は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "AIによるCSR施策はEC顧客のロイヤルティを高めるか", "title": "AI-induced corporate social responsibility (AICSR) and e-retailing: a game-changing strategy or a gimmick to attain customer loyalty", "url": "https://doi.org/10.1108/apjml-05-2026-1088", "authors": "Ijaz Ahmad ほか", "venue": "Asia Pacific Journal of Marketing and Logistics", "date": "2026-10-05", "citescore": 9.9, "citescore_year": "2025", "apa": "Ahmad, I., & Du, R. (2026). AI-induced corporate social responsibility (AICSR) and e-retailing: a game-changing strategy or a gimmick to attain customer loyalty. Asia Pacific Journal of Marketing and Logistics, 1–21. https://doi.org/10.1108/apjml-05-2026-1088", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "AIを使ったCSR施策（AICSR）が、EC小売の顧客ロイヤルティを直接にも、6つの媒介要因を通じても高めることを示した。", "p3": "中国のオンライン小売の利用者234人の横断調査を、ステークホルダー理論とシグナリング理論の枠組みで、SmartPLS 4のPLS-SEMで分析した（抄録）。", "p5": "AICSRはロイヤルティに有意な正の直接効果を持ち、サービス品質・顧客満足・電子口コミ・小売店のイメージ・評判・信頼の6つを個別に、また順に通る経路でも影響を伝えた（抄録）。", "fun": "AIで社会貢献をアピールするのは「本気の戦略」か「見せかけ」か、という問いです。結果は、満足や口コミ、信頼を順に積み上げてロイヤルティにつながるという連鎖でした。ただし一時点の調査なので、因果の向きは慎重に読む必要があります。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr33", "rank": 33, "headline": "学生を模したAI論述文は談話の特徴で見分けられる", "title": "Dissecting AI discourse", "url": "https://doi.org/10.1075/ijcl.25027.jia", "authors": "Feng (Kevin) Jiang", "venue": "International Journal of Corpus Linguistics", "date": "2026-10-06", "sjr": 0.946, "citescore": 4.7, "citescore_year": "2025", "apa": "Jiang, F. (. (2026). Dissecting AI discourse. International Journal of Corpus Linguistics. https://doi.org/10.1075/ijcl.25027.jia", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "学生の作文を模してChatGPTが書いた論述文を人の作文と比べ、情報密度が高く抽象的だが、読み手への働きかけや説得が少ないことを示した。", "p3": "Biber（1988）の多次元分析で、言語使用域の変異、情報密度、統語の複雑さ、説得の次元でLLM生成文と人の作文を比較した（抄録）。", "p5": "ChatGPTの文章は情報密度が高く、文脈に依存せず抽象的である一方、学生の作文に比べて対人的な関与とあからさまな説得が少なかった（抄録）。", "fun": "AIの文章は流暢ですが、「あなたもそう思いませんか」と読み手に語りかけたり、強く説得したりすることが少ない。人の作文らしさは、情報の多さではなく、相手に向かう姿勢に表れるのかもしれません。", "unverified": "文章数などの規模は未確認（抄録に記載なし）。"}}, {"id": "jr34", "rank": 34, "headline": "合成した看護引継ぎ記録でLLMの情報抽出を比較", "title": "AI-Based Structured Information Extraction From Synthetic Nursing Handover Transcripts: Comparative Evaluation of Large Language Models", "url": "https://doi.org/10.2196/106133", "authors": "Aaron Conway ほか", "venue": "JMIR Nursing", "date": "2026-10-05", "sjr": 1.107, "citescore": 5.9, "citescore_year": "2025", "apa": "Conway, A., Hada, A., Schluter, J., Xu, H. (., Lowden, D., Miller, T., Donald, K., & Teodorczuk, A. (2026). AI-Based Structured Information Extraction From Synthetic Nursing Handover Transcripts: Comparative Evaluation of Large Language Models. JMIR Nursing, 9, e106133–e106133. https://doi.org/10.2196/106133", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "合成した看護の申し送り記録203件で、複数のLLMとプロンプト最適化の手法が、構造化された情報抽出をどこまでこなせるかを比較した。", "p3": "看護師2人が独立に注釈し合意したラベルで、SBAR（状況・背景・評価・提案）区分の付与、特定情報が伝えられたかの検出、不確かな表現と未知の事実の特定の3課題を設定し、通常のプロンプトとGEPAで最適化したプロンプトをGPT-5.2などで比べた（抄録）。", "p5": "結果の数値は抄録の該当部分が途中で切れており確認できなかった（抄録）。", "fun": "病院では交代のときの申し送りで情報が抜けると、患者の安全に関わります。本物の記録は個人情報の壁があるので、作った記録でAIを試すという方法は、現場に入る前の安全な練習台として意味があります。", "unverified": "モデル別・課題別の性能の数値は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "LLM生成文の効率的な検出法のコードとデータ", "title": "Code and Data Repository for Efficient and Flexible LLMs-Generated Content Detection", "url": "https://doi.org/10.1287/ijoc.2024.0877.cd", "authors": "Wan Tian ほか", "venue": "INFORMS Journal on Computing", "date": "2026-10-05", "sjr": 1.974, "citescore": 6.6, "citescore_year": "2025", "apa": "Tian, W., Qin, Z., & Peng, Y. (2026). Code and Data Repository for Efficient and Flexible LLMs-Generated Content Detection. INFORMS Journal on Computing. https://doi.org/10.1287/ijoc.2024.0877.cd", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の登録情報（コードとデータのリポジトリの説明）を使用", "preprint": false, "short": true, "p1": "INFORMS Journal on Computingに採録された論文「効率的で柔軟なLLM生成文の検出」のコードとデータのリポジトリの記録。", "p3": "記録は、論文で使ったソフトウェアとデータの文書のスナップショットであることだけを述べており、検出手法の中身は記載がない（抄録）。", "p5": "未確認（記録に手法と結果の記載なし）。", "fun": "AIが書いた文章を見分ける技術は、試験やレポート、ニュースの信頼性に関わります。論文と一緒にコードとデータが公開されると、他の人が同じ結果を再現し、改良できるようになります。", "unverified": "検出手法と性能は未確認（記録に記載なし）。"}}, {"id": "jr36", "rank": 36, "headline": "ホテル企業の財務困窮を多次元の業績枠組みで分析", "title": "Financial distress in the hotel industry: Evidence from a multidimensional performance framework", "url": "https://doi.org/10.5937/menhottur2600013c", "authors": "Miroslav Čavlin ほか", "venue": "Menadzment u hotelijerstvu i turizmu", "date": "2026-10-06", "apa": "Čavlin, M., Pešić, S., & Pešić, M. (2026). Financial distress in the hotel industry: Evidence from a multidimensional performance framework. Menadzment U Hotelijerstvu I Turizmu, (00), 20. https://doi.org/10.5937/menhottur2600013c", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "セルビアのホテル株式会社17社で、財務困窮のゾーンを最もよく区別するのは、KRAS枠組みのうち財務構造の次元であることを示した。", "p3": "2019〜2024年の97企業年を、新興市場向けアルトマン・スコアで困窮・灰色・安全のゾーンに分け、継続性・評判・活動・構造の4次元の差をクラスカル・ウォリス検定とボンフェローニ補正のマン・ホイットニー検定で調べた（抄録）。", "p5": "構造の次元が最も強い識別力を持ち、S1が最も情報量の多い指標だった。継続性と活動も有意だが効果量は小さく、評判は有意でなかった（抄録）。", "fun": "会社が危ないかどうかを見分けるのに、評判のような「見た目」より、借金と自己資本のバランスといった「骨格」の方が役に立つ、という結果です。ただし17社という小さな標本なので、傾向をつかむ材料として読むのがよさそうです。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "サステナ開示と利益調整を取締役の多様性が変える", "title": "Sustainability Reporting Disclosure and Earnings Management: The Role of Board Gender Diversity and Risk Committee Effectiveness", "url": "https://doi.org/10.3390/jrfm19100773", "authors": "Ibrahim Alnohoud ほか", "venue": "Journal of risk and financial management", "date": "2026-10-04", "citescore": 5.5, "citescore_year": "2025", "apa": "Alnohoud, I., Alshdaifat, S. M., Ahmad, S. M., Alhasnawi, M. Y., & Ali Atieh, A. (2026). Sustainability Reporting Disclosure and Earnings Management: The Role of Board Gender Diversity and Risk Committee Effectiveness. Journal of Risk and Financial Management, 19(10), 773. https://doi.org/10.3390/jrfm19100773", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ヨルダンの上場企業で、サステナビリティ報告の開示が多いほど会計発生高による利益調整が少ないことを示した。", "p3": "590企業年をプールした最小二乗法で推定し、取締役の性別多様性とリスク委員会の有効性による調整を調べた。代替の利益調整指標と2段階システムGMMで頑健性を確かめた（抄録）。", "p5": "開示と発生高ベースの利益調整に有意な負の関連があった。性別多様性とリスク委員会による調整効果の統計的な証拠は得られなかった（抄録）。", "fun": "環境や社会への取り組みをきちんと報告する会社は、決算の数字もいじりにくい、という結果です。「取締役に女性が多いと効果が強まる」という予想は支持されませんでした。期待した結果が出なかったことを正直に報告している点も大切です。", "unverified": "なし"}}, {"id": "jr38", "rank": 38, "headline": "4つの財務困窮予測モデルの精度を比較", "title": "ANALISIS AKURASI MODEL ZMIJEWSKI, SPRINGATE, ALTMAN, DAN GROVER DALAM MEMPREDIKSI FINANCIAL DISTRESS", "url": "https://doi.org/10.35794/emba.v7i2.49101", "authors": "Fatimah Alamsyah ほか", "venue": "Jurnal EMBA : Jurnal Riset Ekonomi, Manajemen, Bisnis dan Akuntansi", "date": "2026-10-05", "apa": "Alamsyah, F., Saerang, I. S., & Tulung, J. E. (2019). ANALISIS AKURASI MODEL ZMIJEWSKI, SPRINGATE, ALTMAN, DAN GROVER DALAM MEMPREDIKSI FINANCIAL DISTRESS. Jurnal EMBA : Jurnal Riset Ekonomi, Manajemen, Bisnis Dan Akuntansi, 7(2). https://doi.org/10.35794/emba.v7i2.49101", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（インドネシア語・英語）を使用", "preprint": false, "short": true, "p1": "2018年に上場廃止となったインドネシアの3社で、Zmijewski・Springate・Altman・Groverの4つの財務困窮予測モデルの的中を比べ、Zmijewskiが最も正確だったと報告した。", "p3": "2014〜2016年の3社の財務データを使った記述的な量的分析（抄録）。", "p5": "9つの判定のうち倒産を予測した回数は、Zmijewskiが8回、Springateが7回、Altmanが5回、Groverが4回だった（抄録）。", "fun": "倒産予測の古典的な公式はいくつもありますが、どれが当たるかは状況次第です。実際に上場廃止になった会社で「後から答え合わせ」をするのは分かりやすい方法ですが、3社だけでは偶然の影響が大きい点に注意が必要です。", "unverified": "なし"}}, {"id": "jr39", "rank": 39, "headline": "中小企業のSDG実践を診断する尺度と検証手順", "title": "Closing the Sustainable Development Implementation Gap at the Firm Level: A Diagnostic Instrument and Validation Protocol for SDG ‐Aligned, Planetary‐Boundary‐Bounded Firm Practice in Small and Medium‐Sized Enterprises", "url": "https://doi.org/10.1002/csr.71043", "authors": "Kuo‐Ming Chu", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-06", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Chu, K.-M. (2026). Closing the Sustainable Development Implementation Gap at the Firm Level: A Diagnostic Instrument and Validation Protocol for SDG ‐Aligned, Planetary‐Boundary‐Bounded Firm Practice in Small and Medium‐Sized Enterprises. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71043", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "中小企業がプラネタリー・バウンダリーの絶対的な限界内で事業を行う能力を診断する尺度PBOCと、その妥当化の手順を提案した。", "p3": "Daly-Farleyの目的-手段の階層と企業レベルのプラネタリー・バウンダリー研究に基づき、規模を考慮した運営・分配の公正な実践・再生的な配分の3つの下位能力からなる構成概念を作った。項目はSDG6・7・8・12などの目標を操作化している（抄録）。", "p5": "PBOCは能力の準備度の代理指標であり、企業が限界内で操業していることの認証ではないと明記し、客観的な環境データとの三角測量を前提とする（抄録）。実証的な検証結果は抄録にない。", "fun": "「去年より排出を減らした」だけでは、地球が耐えられる範囲に収まっているかは分かりません。会社ごとの改善ではなく、地球の限界という絶対的な物差しで中小企業の力を測ろうとする点が新しい発想です。", "unverified": "検証データでの結果は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "EDINET-Benchの会計不正検知を誤謬と分けて再評価", "title": "EDINET-Benchを用いた会計不正検知の再評価 — 誤謬ラベルの分離とクラス不均衡を考慮した評価 —", "url": "https://doi.org/10.11517/jsaisigtwo.2026.FIN-037_160", "authors": "矢野 直 ほか", "venue": "人工知能学会第二種研究会資料", "date": "2026-10-06", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "J-STAGEに題名と英題のみ登録。抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、EDINET-Benchを使った会計不正検知を、誤謬（意図しない誤り）のラベルを分けたうえで、クラス不均衡を考慮して評価し直す研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「不正」と「うっかりミス」を同じ答えとして扱うと、AIの不正検知の実力を正しく測れないのではないか、という点です。不正は珍しいので、評価の仕方次第で成績が良くも悪くも見えるという問題も含んでいます。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jr41", "rank": 41, "headline": "有価証券報告書で企業成熟度を表す埋め込みモデル", "title": "有価証券報告書を用いた企業成熟度を表現可能なテキスト埋め込みモデルの開発と評価", "url": "https://doi.org/10.11517/jsaisigtwo.2026.FIN-037_123", "authors": "竹下 蒼空 ほか", "venue": "人工知能学会第二種研究会資料", "date": "2026-10-06", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "J-STAGEに題名と英題のみ登録。抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、有価証券報告書の文章を使い、企業の成熟度を表現できるテキスト埋め込みモデルを開発し評価した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、会社が若いか成熟しているかを、決算書の数字ではなく報告書の「書きぶり」から読み取れるか、という点です。文章をベクトルという数の並びに変える技術で、会社の人生段階を測ろうとする発想です。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jr42", "rank": 42, "headline": "有報から投資テーマ関連度を軽量LMで採点", "title": "有価証券報告書に基づく投資テーマ関連度スコアリングのための軽量言語モデルSFT", "url": "https://doi.org/10.11517/jsaisigtwo.2026.FIN-037_146", "authors": "伊藤 辰都 ほか", "venue": "人工知能学会第二種研究会資料", "date": "2026-10-06", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "J-STAGEに題名と英題のみ登録。抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、有価証券報告書をもとに投資テーマとの関連度を採点するため、軽量な言語モデルを教師あり微調整（SFT）した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「この会社はAI関連株か」「脱炭素関連か」といった判断を、大きなAIでなく小さく安いAIでもできるようにできるか、という点です。実務で大量の報告書を処理するには、軽さが大切になります。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jr43", "rank": 43, "headline": "自己符号化器で橋梁SHMの教師なし領域適応", "title": "An integrated autoencoder-based framework for unsupervised domain adaptation in structural health monitoring of bridges", "url": "https://doi.org/10.1016/j.ymssp.2026.115013", "authors": "Wellington de Lima Nogueira ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-10-05", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、自己符号化器（autoencoder）に基づく統合的な枠組みで、橋梁の構造ヘルスモニタリングにおける教師なし領域適応を行う研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、ある橋で学んだ損傷の見分け方を、正解ラベルのない別の橋にどう持ち込むか、という点です。橋は一つひとつ形も環境も違うので、学んだ知識を「移植」するのは難しく、それがこの分野の大きな課題です。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "亀裂のある板のモード解析をメッシュフリー法で", "title": "Modal analysis of cracked plates by way of discrete least squares meshless method", "url": "https://doi.org/10.1680/jstbu.26.00067", "authors": "Mohammad Naisipour ほか", "venue": "Proceedings of the Institution of Civil Engineers - Structures and Buildings", "date": "2026-10-05", "citescore": 3.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "亀裂のある板の振動解析に離散最小二乗メッシュレス法（DLSM）を使い、縁亀裂と中央亀裂の2形態で最初の10個の固有振動数とモード形を示した。", "p3": "移動最小二乗近似と3次スプラインの重み関数を用い、亀裂による不連続を可視性の手法で表した。Abaqusとの比較と、不規則な節点配置での頑健性を調べた（抄録）。", "p5": "有限要素法と非常によく一致したと報告している（抄録）。誤差の数値は抄録にない。", "fun": "板にひびが入ると、揺れ方（固有振動数や振動の形）が変わります。メッシュを作らずに点の集まりだけで計算する方法で、ひびの影響を正確に追えるかを確かめた研究です。点の並びが不規則でも使えることを示した点が実用的です。", "unverified": "誤差の数値は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "デジタルツインで建設システムの潜在リスク状態を推定", "title": "Inferring latent system risk in interdependent construction systems using digital twins", "url": "https://doi.org/10.1108/ci-03-2026-0104", "authors": "Joas Serugga", "venue": "Construction Innovation", "date": "2026-10-06", "sjr": 0.895, "citescore": 10.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "建設プロジェクトで、生産性や工程の遅れが表に出る前に、運用データから潜在的な性能低下の状態を推定してシステム的なリスクを検出するデジタルツインの枠組みを提案した。", "p3": "デザインサイエンスの方法で、代表的な建設の事例に枠組みを適用して示した（抄録）。", "p5": "潜在的なシステムリスクを、相互依存する建設の工程の推定可能な状態として位置づけた。異なるプロジェクトや実運用での検証がさらに必要としている（抄録）。", "fun": "工事の遅れは、目に見えたときにはもう他の工程に広がっています。表面の数字ではなく、その裏にある「調子の悪さ」をデータから推し量ろうとする発想は、病気の症状が出る前に検査で見つけるのに似ています。", "unverified": "事例での定量的な結果は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "火山灰は含水率でせん断破壊の様式が変わる", "title": "Volumetric Water Content and Shear Failure of Volcanic Ash: Evidence From Powder Shear Cell Analyses", "url": "https://doi.org/10.21663/eeg-d-26-00005", "authors": "Letizia Pace ほか", "venue": "Environmental and Engineering Geoscience", "date": "2026-10-05", "citescore": 1.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "南イタリア・サルノ地域の火山灰を多く含む3種類の土で、体積含水率を0〜8%まで変えると、せん断挙動が変わることを示した。", "p3": "レオメータで制御した条件の非排水せん断試験を、体積含水率2%刻みで行った（抄録）。", "p5": "乾燥から湿潤への移行で水のメニスカスによるサクションの効果が現れ、見かけの粘着力が最初は増加した（抄録、それ以降の結果は途中で切れている）。", "fun": "砂浜の砂は乾いているとさらさら崩れ、少し湿ると固まって砂山が作れます。水の膜が粒をつなぐからです。火山灰の土でも同じことが起き、水の量で強さが変わることが、恐ろしい土石流の始まりを理解する手がかりになります。", "unverified": "含水率をさらに上げたときの挙動は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "ニューラル手法で海洋生物地球化学モデルを較正", "title": "Solving calibration and reanalysis challenges of ocean biogeochemical dynamics with neural schemes: a 1D vertical model case-study", "url": "https://doi.org/10.5194/bg-23-6879-2026", "authors": "Jean Littaye ほか", "venue": "Biogeosciences", "date": "2026-10-06", "sjr": 1.689, "citescore": 6.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "海洋の生物地球化学（BGC）モデルの較正と再解析の課題に、機械学習の手法で取り組むため、1次元鉛直モデルの観測システム模擬実験（OSSE）の枠組みを作った。", "p3": "観測の乏しさと海洋物理の不確かさがデータ同化を難しくしている点に対し、微分可能なプログラムで書いた1次元BGCモデルを使い、学習と比較評価の両方に使えるOSSEを構築した（抄録）。", "p5": "結果の数値は抄録の該当部分が途中で切れており確認できなかった（抄録）。", "fun": "海の炭素の循環を計算するモデルには、決めにくいパラメータがたくさんあります。「正解が分かっている人工の海」を作って試験場にし、AIで較正の方法を磨く、というやり方は、本番の前に練習問題で解き方を鍛えるのに似ています。", "unverified": "手法の比較結果は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "軽石の孤立気泡が海底斜面の安定性を左右する", "title": "Preservation of Isolated Vesicles in Submarine Pumice and Implications for Submarine Slope Stability", "url": "https://doi.org/10.1029/2026gl125622", "authors": "M. Manga", "venue": "Geophysical Research Letters", "date": "2026-10-06", "sjr": 1.949, "citescore": 8.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "海底噴火の軽石に含まれる孤立した気泡は水深1〜2 kmまで壊れずに残り、せん断で割れると間隙水圧を下げて堆積物を強くしうることを示した。", "p3": "冷却で気泡内のガスが収縮して低圧になることと、ガラスの圧縮強度と内外の圧力差の比較から、気泡が保存される水深を見積もった（抄録）。", "p5": "深い火口では軽石のいかだはできにくい。せん断や斜面崩壊で気泡を包むガラスが割れると低圧の蒸気が放出され、間隙水圧が下がって有効応力が増えるため、軽石の多い堆積物はせん断で強くなり、他の海底堆積物より重力的・地震的に安定でありうる（抄録）。", "fun": "崩れかけると逆に強くなる地層がある、という意外な話です。軽石の中の小さな泡は真空に近い状態で、割れると周りの水を吸い込むように圧力が下がり、粒どうしがしっかり押し合う。小さな泡が海底の地すべりを防ぐかもしれないのです。", "unverified": "なし"}}, {"id": "jr49", "rank": 49, "headline": "細粒分の塑性と含水比が砂混合土の挙動を変える", "title": "Influence of Fines Plasticity and Water Content on the Mechanical Response of Binary Soil Mixtures: Analysis Using the Equivalent Void Ratio", "url": "https://doi.org/10.1061/jggefk.gteng-14497", "authors": "Byeonghwi Ryu ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-06", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "砂と細粒分の混合土で、細粒分の塑性と含水比によって剛性の変化の向きが逆になることを、ベンダーエレメント試験と1次元圧縮試験で示した。", "p3": "珪砂に非塑性のシリカ粉、塑性のカオリン粘土、韓国の赤色粘土を細粒分含有率30%まで、含水比0〜10%で混ぜ、せん断波速度と圧縮挙動を測り、等価間隙比の概念で細粒分の荷重分担を逆解析した（抄録）。", "p5": "非塑性の細粒分では含水比によらず細粒分が増えるほど剛性が下がったが、塑性の細粒分では低含水比でせん断波速度が増え、サクションによる粒子間の結合で説明された（抄録）。", "fun": "砂に混ぜる「細かい粉」が粘土か石の粉かで、土が硬くなるか柔らかくなるかが逆転します。少しの水があると粘土が接着剤のように粒をつなぐからです。地盤の強さが、粒の大きさだけでなく性質と水で決まることを示す分かりやすい例です。", "unverified": "逆解析したbパラメータの値は抄録の途中で切れており未確認。"}}, {"id": "jr50", "rank": 50, "headline": "AI拡張職場で管理職の職務満足を決めるもの", "title": "AI-augmented digital workplaces and managerial job satisfaction in the future of work: The role of applied AI literacy, organizational support and regulatory influence", "url": "https://doi.org/10.1007/s12525-026-00941-9", "authors": "Justin Zuopeng Zhang ほか", "venue": "Electronic Markets", "date": "2026-10-06", "sjr": 2.143, "citescore": 16.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、AIで拡張されたデジタルな職場で、応用的なAIリテラシー、組織の支援、規制の影響が管理職の職務満足にどう関わるかを調べた研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、AIが入った職場で管理職が満足して働けるかは、本人のAIを使いこなす力、会社の支え、そして法律や規制のどれで決まるのか、という点です。働く人と組織と社会の三つの層を同時に見ようとしています。", "unverified": "手法・データ・結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "現金が1ポンド増えると39ペンスが雇用に回る", "title": "The Marginal Propensity to Hire", "url": "https://doi.org/10.1093/restud/rdag111", "authors": "Davide Melcangi", "venue": "Review of Economic Studies", "date": "2026-10-03", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "英国の事業用資産税の再評価で似た企業の税負担が分かれたことを使い、資金制約下の企業がキャッシュフローの増分をどれだけ雇用に使うかを推定した。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "取締役を共有する企業間で人材の移動が2割減る", "title": "Directing the Labor Market: Shared Directors and Employee Flows", "url": "https://doi.org/10.1093/rfs/hhag090", "authors": "Taylor A Begley ほか", "venue": "The Review of Financial Studies", "date": "2026-10-06", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "2,000万人超の履歴書データで、二社が取締役を共有する期間に企業間の従業員の移動が約20%減ることを示した。"}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "顧客リードを売るプラットフォームの厚生効果", "title": "The Welfare Effects of Selling Leads in a Two-S ruction from the Colorado Rocky Mountains reveals warm and cool droughts", "url": "https://doi.org/10.1073/pnas.2612779123", "authors": "Alexandre F. Nolin ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-05", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "コロラド州南部ロッキー山脈の夏の最低気温を2,623年分復元し、過去の深刻な干ばつに温暖な型と冷涼な型があったことを示した。"}, {"id": "jn13", "rank": 13, "field": "機械学習", "headline": "脳波から画像を再構成し学習内容を見える化", "title": "Seeing what students learn: assessing cognitive representations and academic outcomes via EEG image reconstruction", "url": "https://doi.org/10.1186/s41239-026-00626-5", "authors": "Zhu Su ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-10-05", "sjr": 7.947, "citescore": 48.4, "citescore_year": "2025", "why": "脳波からの画像再構成を使って学習者の内的な認知表現を評価し、学業成績との関係を調べた。"}, {"id": "jn14", "rank": 14, "field": "政治学", "headline": "犯罪にさらされると政治参加は増えるか減るか", "title": "Crime and Participation", "url": "https://doi.org/10.1017/s0003055426102007", "authors": "DAVID DOHERTY ほか", "venue": "American Political Science Review", "date": "2026-10-06", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "why": "米国21都市の独自調査と協同選挙調査5波を使う事前登録の設計で、犯罪被害や地域の犯罪率と投票・非選挙参加の関係を検証した。"}, {"id": "jn15", "rank": 15, "field": "物理学", "headline": "魔法角より大きいねじれ二層グラフェンの分数状態", "title": "Extended fractional Hofstadter states at high field in twisted bilayer graphene above the magic angle", "url": "https://doi.org/10.1073/pnas.2602080123", "authors": "Joe Finney ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-05", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "強磁場下のねじれ二層グラフェンで、分数チャーン絶縁体に類する分数ホフスタッター状態が広い範囲で現れることを報告した。"}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "戦略リーダーは倫理的価値を組織の注意に変換する", "title": "Guiding Attention for Sustainability‐Oriented Innovation: How Strategic Leaders Translate Ethical Values", "url": "https://doi.org/10.1002/bse.71626", "authors": "Sophie Bollinger ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "注意ベース視点に立つ比較事例研究で、経営者の倫理的価値が組織の注意に変わりサステナビリティ志向のイノベーションにつながる条件を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "戦略的リーダーの倫理的価値が組織の注意に変わり、サステナビリティ志向のイノベーションにつながる過程を、3つの構成に整理した。", "p3": "企業の注意ベース視点に立ち、フランスの6組織で階層をまたぐ92件の面接、現地訪問、文書資料による比較複数事例研究を行った（抄録）。", "p5": "公式の注意構造が弱い組織ではイノベーション事業が一時的にリーダーと従業員を価値でつなぎ、リーダーが「上空援護」をする組織では倫理が戦略の境界を導くが日常業務とは部分的に切り離され、注意が構造的に分散した組織では倫理と事業の優先順位が階層を通じて強く結びついていた（抄録）。", "fun": "社長が「環境を大事に」と言っても、それが現場の仕事に届くかは組織の作り方次第です。トップの思いが現場まで伝わる会社と、スローガン止まりの会社の違いを、注意がどこに向けられる仕組みになっているかで説明した点が面白いところです。", "unverified": "なし"}}, {"id": "jn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "約束する主体のいないキャリア支援制度と心理的契約", "title": "Career Promises Without a Promisor: A Psychological Contract Perspective on Organizational Career Development Systems", "url": "https://doi.org/10.1002/hrdq.70033", "authors": "Mohamed Mohiya", "venue": "Human Resource Development Quarterly", "date": "2026-10-05", "sjr": 1.52, "citescore": 11.6, "citescore_year": "2025", "why": "サウジアラビアの多国籍ホテル企業の事例で、従業員がキャリア開発制度を心理的契約としてどう受け止めるかを質的に分析した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "サウジアラビアの多国籍ホテル・観光企業で、従業員がキャリア開発制度を、約束する主体のいない約束として受け止めていることを心理的契約理論で示した。", "p3": "社内電子システムの従業員コメント123件と正社員29人の半構造化面接を主題分析した（抄録）。", "p5": "キャリアパスの曖昧さと見えにくさ（82%）、昇進の構造的障壁（68%）、上司の関与不足（73%）、従業員区分による扱いの差（61%）、キャリアを切り開く従業員の主体性（54%）の5主題が得られ、理論の3つの拡張を提案した（抄録）。", "fun": "会社が「キャリア支援をします」と掲げても、誰がその約束を守る責任者なのかが曖昧だと、社員は裏切られた気持ちになります。制度はあるのに人の顔が見えない、という問題を「約束する人のいない約束」と名づけた点が鋭いところです。", "unverified": "3つの理論的拡張の具体的な内容は本文未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "気候変動広告は促進焦点の訴求が関与を高める", "title": "Can Beauty Save the World? A Multimethod Analysis of Regulatory Focus Appeals in Climate Change Advertising", "url": "https://doi.org/10.1002/bse.71633", "authors": "Valentina Mazzoli ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "表情解析の実験を含む混合研究法で、促進焦点と予防焦点の気候変動広告の効果を比べた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "気候変動の広告では、得られるものを訴える促進焦点の訴求が悲しみを減らし、広告への態度と気候変動への関与を高めることを示した。", "p3": "順次説明型の混合研究法で、表情解析（facial coding）の実験で促進焦点と予防焦点の訴求を比べ、続いてコミュニケーション担当者への質的調査を行った（抄録）。", "p5": "促進焦点の訴求は悲しみを減らし、それが広告への態度を良くし、気候変動への関与を高めた（抄録）。効果の大きさは抄録にない。", "fun": "「このままでは地球が大変なことになる」と恐怖や悲しみで訴えるより、「こんな美しい未来が守れる」と前向きに訴える方が、人は関わろうとする、という結果です。顔の表情を機械で読み取って感情の動きを測った点も工夫です。", "unverified": "実験の標本数と効果量は未確認。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "生物多様性リスクが企業を負債調達に傾ける", "title": "Confronting Biodiversity Risk: Its Role in Shaping Corporate External Financing Choice", "url": "https://doi.org/10.1002/bse.71590", "authors": "Yang Zhou ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "開示文書のテキスト分析で企業ごとの生物多様性リスク指標を作り、資金調達の選択がどう歪むかを検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "生物多様性リスクが高い中国企業ほど、情報の非対称性と正統性の費用が増して、短期を中心に負債による資金調達に頼ることを示した。", "p3": "開示文書のテキスト分析で企業ごとの生物多様性リスク指標を作り、客観的な生態データ（生物多様性の賦存）と結びつけた。2009〜2023年の中国A株上場企業（金融・不動産・ST銘柄を除く）で、差の差と操作変数で準因果的に検証した（抄録）。", "p5": "生物多様性リスクが高いほど、公式・非公式の負債、とくに短期負債への依存が高まった。メカニズムと異質性の分析も提案した枠組みを支持した（抄録）。", "fun": "森や川の生き物への影響が大きい会社は、投資家から見ると「何が起きるか分かりにくい」会社です。その結果、株での資金集めが難しくなり借金に頼る、という資金の流れの歪みを、報告書の言葉から作った指標で示した点が新しいところです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "AI導入は知識の経路を通じ環境協働イノベーションを促す", "title": "Artificial intelligence adoption and green collaborative innovation: knowledge-based channels and governance conditions", "url": "https://doi.org/10.1108/jkm-04-2026-0712", "authors": "Yang Xu ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-06", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "why": "企業パネルデータで、AI導入が知識学習能力と環境ガバナンス能力を通じて環境分野の共同イノベーションを高めるかを検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "中国企業でAIの導入が、知識の学習能力と環境ガバナンス能力を通じて、環境分野の共同イノベーション（共同出願の環境特許）を促すことを示した。", "p3": "2012〜2023年の中国A株上場企業のパネルで、AI導入を一人当たりの機械設備の簿価で、共同イノベーションを共同出願の環境特許で測り、二方向固定効果、操作変数、傾向スコアマッチングで推定した（抄録）。", "p5": "AI導入は発明特許と実用新案の両方で環境分野の共同イノベーションを有意に高め、多くの頑健性検定でも維持された。知識学習能力とガバナンス能力を強めた（抄録）。", "fun": "AIを入れた会社ほど、他社と一緒に環境技術の特許を出すようになる、という結果です。ただしAI導入を「機械設備の額」で測っている点は、AIそのものを測っているのか慎重に考える必要があり、指標の作り方を見る練習にもなります。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "裸地検出のための大規模ハイパースペクトル基準データ", "title": "HyBEAR: a hyperspectral benchmark for bare soil detection", "url": "https://doi.org/10.5194/essd-18-7301-2026", "authors": "Agata M. Wijata ほか", "venue": "Earth System Science Data", "date": "2026-10-06", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "地上解像度2 mの航空ハイパースペクトル画像と専門家が確認した裸地の注釈からなる大規模ベンチマークを公開した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "地上解像度2 mの航空ハイパースペクトル画像に、専門家が確認した裸地の注釈を付けた大規模ベンチマークHyBEARを公開した。", "p3": "画素単位で裸地か背景かを分ける従来の設定に対し、農地の区画全体に注釈を付け（裸地の区画内の全画素を裸地とする）、植生のない畑全体を見つける手法の開発を支える設計にした（抄録）。", "p5": "抄録はデータの構成と目的を述べるが、基準手法の性能の数値は示していない（抄録）。", "fun": "ハイパースペクトル画像は、人の目の3色ではなく何百もの色に分けて地表を撮ります。そこから「作物の生えていない畑」を区画ごと見つけられれば、土の性質を調べる場所を効率よく選べます。良いAIを育てるには、良い問題集（ベンチマーク）が欠かせません。", "unverified": "データの枚数と基準手法の性能は未確認。"}}, {"id": "jn22", "rank": 22, "field": "地球科学", "headline": "スバールバル147氷河の月次の末端損耗10年分", "title": "A decade of monthly frontal ablation at 147 tidewater glaciers in Svalbard", "url": "https://doi.org/10.5194/essd-18-7319-2026", "authors": "Dakota Pyles ほか", "venue": "Earth System Science Data", "date": "2026-10-06", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "深層学習のセグメンテーションで2015〜2024年の氷河末端位置を大量に抽出し、月次の末端損耗の時系列を作った。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "スバールバルの147の海に流れ込む氷河で、2015〜2024年の月次の末端損耗（frontal ablation）を高い時空間分解能で推定した。", "p3": "Sentinel-1のSAR画像に多時期の深層学習セグメンテーションを適用し、203,294の末端位置を地図化して15,647の月平均の崩落前線を得た。ITS_LIVEの流速と氷厚から月次の氷の流出量を作り、地域気候モデルMARで表面の質量収支を補正した（抄録）。", "p5": "約15,500の月次推定からなる末端損耗の時系列を作成した。年平均の値は抄録の途中で切れている（抄録）。", "fun": "氷河の先端が海に崩れ落ちる量を、10年分・月ごと・147の氷河について求めるには、膨大な数の写真から先端の線を引く必要があります。それをAIに任せたことで、季節ごとの変化まで追える細かな記録が初めてできました。", "unverified": "年平均の末端損耗の値は未確認。"}}, {"id": "jn23", "rank": 23, "field": "惑星科学", "headline": "ヴィルト第2彗星のコンドリュールの未知の起源", "title": "An unidentified reservoir of comet 81P/Wild 2 chondrules", "url": "https://doi.org/10.1073/pnas.2612680123", "authors": "Mingming Zhang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-05", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "スターダスト探査機が持ち帰った彗星試料のコンドリュールが、既知の貯蔵領域と異なる起源を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "スターダスト探査機が持ち帰ったヴィルト第2彗星の試料のうち、一つの衝突跡から得た約100個のケイ酸塩の破片が、まだ特定されていない起源のコンドリュールであることを示した。", "p3": "エアロゲル捕集器の最大級の衝突跡（トラック227）の破片について、岩石組織と酸素の3同位体を分析した（抄録）。", "p5": "破片の多くは小さなコンドリュール（おおむね60 µm未満）の断片で、火成の組織を示した。約90%の破片は緩やかな負の相関を示した（抄録、以降は途中で切れている）。", "fun": "彗星は太陽系のはずれの冷たい場所で作られたはずなのに、高温でできた岩石の粒（コンドリュール）が含まれていました。その粒がどこから来たのかは、太陽系の物質が誕生時にどれほど広く混ざり合ったかを知る手がかりになります。", "unverified": "起源についての結論の詳細は未確認。"}}, {"id": "jn24", "rank": 24, "field": "エネルギー", "headline": "リチウム供給制約がインドの運輸電化を左右する", "title": "Lithium Constraints on India’s Transport Electrification: System-Level Impacts and Policy Implications for the Net-Zero Transition", "url": "https://doi.org/10.1088/1748-9326/aeb03a", "authors": "Anu Agarwal ほか", "venue": "Environmental Research Letters", "date": "2026-10-05", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "why": "重要鉱物を無制約とみなしてきたエネルギー転換の経路分析に、リチウムの供給制約を組み込んでインドの技術選択への影響を定量化した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "リチウムの供給制約をエネルギーシステムモデルに組み込み、インドの運輸の電化と脱炭素の経路、移行費用への影響を定量化した。", "p3": "KINESYS-TIMESモデルで、電池容量あたりのリチウム量の3感度と、無制約のネットゼロに必要な量の30%・60%・90%と無制約の4つの利用可能量、2つのリサイクル変種、加速政策の3ケースを組み合わせた17シナリオを分析した（抄録）。", "p5": "結果の数値は抄録の途中で切れている（抄録）。", "fun": "電気自動車を増やせば脱炭素が進む、と単純には言えません。電池に必要なリチウムが十分に手に入らなければ、計画そのものが変わります。資源の量という現実の制約を入れると、どの技術が選ばれ、費用がどれだけ増えるかが見えてきます。", "unverified": "シナリオ別の結果は未確認。"}}, {"id": "jn25", "rank": 25, "field": "材料科学", "headline": "記述子で界面活性分子を選びマグネシウム負極を改善", "title": "Descriptor‐Informed Screening of Interface‐Active Molecules for Efficient Magnesium Metal Anodes", "url": "https://doi.org/10.1002/adma.75285", "authors": "Hao Xu ほか", "venue": "Advanced Materials", "date": "2026-10-06", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "why": "入手しやすい塩を使うマグネシウム電池電解液で、記述子に基づく分子スクリーニングにより負極の効率を高めた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "分子の記述子に基づくスクリーニングで、マグネシウム電池の電解液に加えると負極での溶解・析出を速くする界面活性分子BrNNAを見いだした。", "p3": "双極子モーメント、最低空軌道のエネルギー、ドナー数を定量的な分子記述子とし、置換アニリン誘導体を選別した（抄録）。", "p5": "4-ブロモ-N,N-ジメチルアニリン（BrNNA）が最適な候補として選ばれ、Mg(TFSI)₂系電解液での速いMgの溶解・析出の速度を可能にした（抄録）。効率の数値は抄録の範囲では未確認。", "fun": "マグネシウム電池は資源が豊富で安全ですが、電極で金属がうまく溶けたり付いたりしないのが弱点でした。候補の分子を片っ端から試すのではなく、分子の性質を表す数値を手がかりに当たりをつける方法で、効く添加剤を見つけた点が効率的です。", "unverified": "効率と寿命の数値は未確認。"}}, {"id": "jn26", "rank": 26, "field": "材料科学", "headline": "せん断を伝える界面で層状材料を壊さず単層に剥離", "title": "Scalable Nondestructive Exfoliation of Layered Materials Into Monolayers via Shear‐Transducing Interfaces", "url": "https://doi.org/10.1002/adma.75262", "authors": "Zhuang Zhao ほか", "venue": "Advanced Materials", "date": "2026-10-06", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "why": "ボールミルの衝撃による破砕と劣化を、粘弾性ポリマーでせん断に変えることで避ける大規模な剥離法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "粘弾性のポリマーでボールミルの衝撃をせん断に変えることで、層状材料を壊さずに単層へ剥がす方法を作り、100 g規模の単層フッ化グラフェンを得た。", "p3": "環境負荷の小さいポリマーをエネルギー調整材として使い、せん断を伝える界面を作って層間の剥離を促し、破砕を抑え、熱酸化を防ぐ（抄録）。", "p5": "フッ素を保ったフッ化グラフェンを100 g規模で得て、多様な層状材料に適用できた。25 AhのLi/CFx電池で、0.1 Cで832.0 Wh/kg、0.5 Cで737.5 Wh/kgの高いエネルギー密度を示した（抄録）。", "fun": "本のページを1枚ずつはがしたいのに、ハンマーで叩くとページが破れてしまう。そこで、粘り気のある素材を間に入れて、叩く力を「横にずらす力」に変えたのがこの研究です。力の向きを変えるだけで、壊さずに大量に薄くはがせるようになりました。", "unverified": "なし"}}, {"id": "jn27", "rank": 27, "field": "材料科学", "headline": "導電性高分子ナノワイヤの不均一構造を沈降で分離", "title": "Differential Sedimentation and Cryo‐TEM Mapping Resolve Structural Heterogeneity in Conjugated Polymer Nanowires for Programmable Stretchable Electronics", "url": "https://doi.org/10.1002/adma.75087", "authors": "Junyeon Yoon ほか", "venue": "Advanced Materials", "date": "2026-10-06", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "why": "伸縮性電子材料に使う共役高分子ナノワイヤの構造の不均一さを、沈降分離とクライオ電顕で解きほぐした。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "伸縮性電子材料に使う導電性高分子（P3HT）のナノワイヤと非晶質の鎖の混合物を、密度差による沈降で分け、クライオ電子顕微鏡で構造の不均一さを明らかにした。", "p3": "溶液中の結晶化駆動自己組織化でできるナノワイヤの分散液を、密度による差分沈降で結晶性のナノワイヤの沈殿と非晶質の鎖の上澄みに分けた（抄録）。", "p5": "結果の数値は抄録の途中で切れている。結晶性のナノワイヤが電荷の通り道を、非晶質の鎖が結晶間の橋渡しと変形の吸収を担うという役割分担を前提に分離を行った（抄録）。", "fun": "伸びる電子回路には、電気をよく通す「硬い結晶」と、伸びを受け止める「柔らかい鎖」の両方が必要です。混ざってしまう二つを重さの違いで沈めて分ければ、それぞれの量を調整して性能を設計できる、という発想です。", "unverified": "分離後の性能の数値は未確認。"}}, {"id": "jn28", "rank": 28, "field": "エネルギー", "headline": "表面処理で宇宙用ペロブスカイト電池のα線劣化を抑制", "title": "Surface Passivation Suppresses α-Particle-Induced Trap Formation in Perovskite Solar Cells for Space Applications", "url": "https://doi.org/10.1021/acsenergylett.6c02610", "authors": "Da Seul Lee ほか", "venue": "ACS Energy Letters", "date": "2026-10-06", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "why": "宇宙放射線に多いα粒子によるペロブスカイト太陽電池の劣化機構を調べ、表面パッシベーションの保護効果を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "宇宙放射線に多いα粒子を照射するとペロブスカイト太陽電池が劣化するが、表面をPDAI₂で処理すると劣化が抑えられることを示した。", "p3": "2.5 MeVのα粒子を照射し、X線回折、電子顕微鏡、赤外分光、容量-電圧測定、インピーダンス分光などで劣化の機構を調べた（抄録）。", "p5": "照射後、処理した素子は初期効率（20.22%）の80%を保ったのに対し、未処理の素子は60%（初期19.13%）だった。損失は主に曲線因子の低下によるもので、結晶相は分解しなかった（抄録）。", "fun": "宇宙で使う太陽電池は、地上にはない放射線にさらされます。軽くて安いペロブスカイト太陽電池を宇宙で使うには、その弱点を知り守る必要があります。表面に薄い保護処理をするだけで、残る性能が6割から8割に上がる点は実用的です。", "unverified": "なし"}}, {"id": "jn29", "rank": 29, "field": "エネルギー", "headline": "燃えにくい混合電解液で高温に強いナトリウム電池", "title": "A Hybrid Phosphate–Ether Electrolyte for High-Temperature and High-Safety 18650 Cylindrical Sodium-Ion Batteries", "url": "https://doi.org/10.1021/acsenergylett.6c02299", "authors": "Zhiming Zhou ほか", "venue": "ACS Energy Letters", "date": "2026-10-06", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "why": "リン酸エステルとエーテルの混合電解液で、高温耐久性と安全性を備えた円筒形ナトリウムイオン電池を実証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "燃えにくいリン酸エステル（TEP）とエーテル（THF）の混合電解液で、80 °Cの高温でも長く使え安全なナトリウムイオン電池を実証した。", "p3": "配位の弱いTHFでナトリウムイオンの溶媒和に陰イオンを参加させ、両電極に無機成分の多い強い界面膜を作り、低い粘度でイオンの移動を速める設計にした（抄録）。", "p5": "プルシアンブルー||ハードカーボンの電池は80 °Cで500サイクル後に容量の76.0%を、18650円筒セルは80 °Cで300サイクル後に80.6%を保った。釘刺し試験で燃焼や煙はなく、最高温度は88.9 °Cだった（抄録）。", "fun": "電池は熱に弱く、燃えやすい電解液が事故の原因になります。燃えにくい液と、イオンを動きやすくする液を混ぜて、安全性と性能の両方を取ったのがこの研究です。釘を刺しても燃えないという試験結果は、送電網用の大型蓄電に向けた大事な一歩です。", "unverified": "なし"}}, {"id": "jn30", "rank": 30, "field": "化学", "headline": "アルカリ水電解の陰極を不純物陽イオンの腐食から守る", "title": "Suppressing Cathode Corrosion Induced by Impurity Cations in Alkaline Water Electrolyzers", "url": "https://doi.org/10.1002/anie.6363490", "authors": "Xiaogang Sun ほか", "venue": "Angewandte Chemie - International Edition", "date": "2026-10-06", "sjr": 5.495, "citescore": 25.7, "citescore_year": "2025", "why": "長期運転で電解液に蓄積する鉄イオンなどがラネーニッケル陰極を劣化させることを示し、その抑制策を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "アルカリ水電解で電解液に溜まる鉄イオンなどの不純物がラネーニッケル陰極を腐食させる機構を示し、CeOxの保護層でそれを抑えた。", "p3": "陰極表面に溜まった鉄が、移り込んだ酸素の2電子還元とHO₂ラジカルの生成を促し、ニッケルを酸化腐食させることを示した。そのうえでルイス酸性のCeOx層を表面に設けた（抄録）。", "p5": "CeOx層は鉄の還元析出を抑え、高原子価のCeサイトが反応性ラジカルを直接捕捉した。保護した陰極は鉄を含む電解液で顕著な安定性を示した（抄録）。", "fun": "水を電気分解して水素を作る装置は、長く動かすと部品から溶け出した鉄が液に混ざり、陰極をむしばむことが分かりました。原因を突き止めたうえで、薄い保護膜で鉄を寄せつけず、悪さをする分子も捕まえるという二重の守りを作った点が見事です。", "unverified": "安定性の数値（運転時間など）は抄録の途中で切れており未確認。"}}, {"id": "jn31", "rank": 31, "field": "化学", "headline": "電荷の独立調整でコロイド結晶の構造を選ぶ", "title": "Structure Selection in Ionic Colloidal Crystals via Independent Charge Tuning", "url": "https://doi.org/10.1021/jacs.6c08143", "authors": "Steven van Kesteren ほか", "venue": "Journal of the American Chemical Society", "date": "2026-10-05", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "粒子を設計し直さずに、界面活性剤で表面電荷を独立に調整してコロイドの結晶構造を決定的に選べることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "同じ一組の正負に帯電したコロイド粒子でも、界面活性剤で各粒子の表面電荷を独立に調整すると、作る結晶構造を決定的に選べることを示した。", "p3": "マイクロモル量の単純なイオン性界面活性剤で、溶液のイオン強度をほとんど変えずに各粒子の表面電荷を調整し、実験と分子動力学シミュレーションで構造選択の仕組みを調べた（抄録）。", "p5": "同じ粒子からTh₃P₄型・CsCl型・Cu₃Au型・Li₃Fe型の結晶ができ、Li₃Fe型はコロイド結晶として未報告の構造だった。構造はクーロン引力と格子に特有の同符号間の反発の競合で決まり、粒子の大きさの比を変えても成り立った（抄録）。", "fun": "同じレゴブロックでも、くっつく力を少し変えるだけで違う形に組み上がる、という話です。粒子を作り直さなくても、電気の帯び方を調整するだけで結晶の型を選べ、しかも誰も見たことのない構造までできました。", "unverified": "なし"}}, {"id": "jn32", "rank": 32, "field": "化学", "headline": "溶媒和が酸触媒の電気化学的促進の鍵を握る", "title": "The Key Role of Solvation in Enhancing Electrochemical Promotion of Brønsted Acid Catalysis", "url": "https://doi.org/10.1021/jacs.6c13986", "authors": "Katelyn Groenhout ほか", "venue": "Journal of the American Chemical Society", "date": "2026-10-05", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "触媒界面の分極で液相の酸触媒反応速度を大きく変える現象について、溶媒の役割を調べた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "電極を分極させて液相の酸触媒反応を速める現象で、溶媒の種類によって電解質濃度への感度が変わることを示した。", "p3": "ブレンステッド酸の官能基を持つカーボンペーパーで、炭酸ジメチル・アセトニトリル・炭酸プロピレン中の1-メチルシクロペンタノールの脱水速度を、電解質濃度1〜600 mMで測った（抄録）。", "p5": "アセトニトリルと炭酸ジメチルでは、速度と電位の関係がイオン強度の関数になり、プロトンが電位降下の一部だけを横切って表面のオキソニウム中間体を作ることを示唆した（抄録、以降は途中で切れている）。", "fun": "触媒の表面に電圧をかけると、反応の速さが最大10万倍も変わることがあります。その効き方が溶媒によって違うのは、溶媒が表面近くの電気の傾きの形を変えるからです。電気で化学反応を操る技術の基礎を固める研究です。", "unverified": "炭酸プロピレン中の結果は未確認。"}}, {"id": "jn33", "rank": 33, "field": "統計学", "headline": "裾の重いデータのための高次元スライス逆回帰", "title": "High-Dimensional Sliced Inverse Kendall’s Tau Estimation for Heavy-Tailed Data", "url": "https://doi.org/10.1080/07350015.2026.2707219", "authors": "Jiaqi Li ほか", "venue": "Journal of Business & Economic Statistics", "date": "2026-10-05", "sjr": 3.508, "citescore": 5.9, "citescore_year": "2025", "why": "裾の重いデータに対する高次元の次元縮約法を、ケンドールの順位相関に基づいて提案した（題名から）。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、裾の重いデータに対して、ケンドールの順位相関を使った高次元のスライス逆回帰（次元縮約）を推定する方法の研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、極端な外れ値が出やすいデータでも、たくさんの変数の中から結果を説明する少数の方向を安定して見つけられるか、という点です。順位だけを使うことで、外れ値に引きずられにくくする発想がうかがえます。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jn34", "rank": 34, "field": "統計学", "headline": "モデル平均による多層ネットワークの転移学習", "title": "A Transfer Learning Framework for Multilayer Networks via Model Averaging", "url": "https://doi.org/10.1080/01621459.2026.2739450", "authors": "Yongqin Qiu ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-06", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "多層ネットワークの推定にモデル平均を用いた転移学習の枠組みを提案した（題名から）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "多層ネットワークのリンク予測で、補助の層の生データを共有せずに情報を転移する、二段階のモデル平均による転移学習の枠組みを提案した。", "p3": "辺に基づくK分割交差検証の基準で、層間と層内の候補モデルの重みを自動で決め、共有構造の事前知識なしにモデルの不確かさを抑えつつ補助層の情報を移す（抄録）。", "p5": "緩い条件で最適性と重みの収束を証明し、生データを共有せず複数サーバで並列処理できるため効率的でプライバシーを守れる。シミュレーションの結果は抄録の途中で切れている（抄録）。", "fun": "友人関係・仕事関係・趣味の関係のように、同じ人たちの間に何層ものつながりがあるとき、ある層の情報で別の層の「まだ見えないつながり」を予測できます。データそのものを渡さずにモデルだけを組み合わせる点が、プライバシーの時代に合った工夫です。", "unverified": "シミュレーションと実データでの結果は未確認。"}}, {"id": "jn35", "rank": 35, "field": "統計学", "headline": "共変量適応ランダム化実験の混合効果モデル推論", "title": "Statistical Inference with Mixed-Effect Model for Covariate-Adaptive Randomized Experiments", "url": "https://doi.org/10.1080/01621459.2026.2740146", "authors": "Yang Liu ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-06", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "共変量適応ランダム化で行う実験に混合効果モデルを使った統計的推論を扱った（題名から）。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、共変量適応ランダム化で行った実験について、混合効果モデルを使った統計的推論を扱う研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、参加者の特徴を見ながら群の偏りが出ないように割り付ける実験で、その割り付け方を考慮に入れて正しく推論するにはどうするか、という点です。割り付けの工夫が分析の仕方にも影響する、という統計の基本的な問題です。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "Wi-Fiのチャネル情報を遅延とドップラーに分解し行動認識", "title": "MORIC: CSI Delay-Doppler Decomposition for Robust Wi-Fi-based Human Activity Recognition", "url": "https://doi.org/10.1109/tpami.2026.3740360", "authors": "Navid Hasanzadeh ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-05", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "Wi-Fiのチャネル状態情報を遅延-ドップラー領域に分解し、頑健な人の行動認識を目指した（題名から）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "Wi-Fiのチャネル状態情報（CSI）を遅延-ドップラー領域に分解し、利用者や環境が変わっても頑健な人の行動認識を目指す手法MORICを提案した。", "p3": "CSIを遅延プロファイルの空間に変換して複数のドップラー速度の射影に分解し、それを未知の方向から一つの動く点の速度を見る「仮想カメラ」の観測として扱い、静的で環境固有の成分への依存を減らす（抄録）。", "p5": "単一の集約表現より豊かな行動表現が得られるとしている。性能の数値は抄録の範囲では未確認（抄録）。", "fun": "Wi-Fiの電波は人が動くとわずかに乱れ、その乱れ方から何をしているかを推定できます。ただ部屋や人が変わると乱れ方も変わってしまう。動きの速さの成分だけを取り出し、いくつもの方向から見たように扱うことで、場所に左右されにくくした点     "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
