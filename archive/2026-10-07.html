<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </footer>
</div>

があります。監査人がAIの判定から学び直させても、かえって得意な種類ばかり増えて新しい種類に目が向かないという結果は、人とAIの協働の落とし穴を示しています。", "unverified": "元帳別・手法別のFSRの具体値（表）は本文の表を個別には照合していない。"}}, {"id": "pr02", "rank": 2, "headline": "空気ばね圧で電気自動車の乗り心地と動的荷重が変わる", "title": "Influence of Air Spring Pressure on Ride Comfort and Dynamic Response of an Electric Vehicle under Random Road Excitation", "url": "https://doi.org/10.21203/rs.3.rs-10585776/v1", "authors": "Nguyen Thanh Tung ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Tung, N. T., Van, L., Phat, K. T., Danh, N. T., & Khoi, P. C. A. (2026). Influence of Air Spring Pressure on Ride Comfort and Dynamic Response of an Electric Vehicle under Random Road Excitation. https://doi.org/10.21203/rs.3.rs-10585776/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research Square版のPDF本文（モデル、路面クラス別の結果、結論と図表キャプション）を読んだ", "preprint": true, "p1": "空気ばねの初期圧を変えたときに、電気自動車の乗り心地と車輪の動的荷重がISO 8608の路面クラスと車速でどう変わるかを、7自由度モデルで数値的に整理し、圧力の推奨範囲を示した。", "p2": "空気ばねは圧力で剛性が変わるが、ランダムな路面入力の下で電気自動車の乗り心地と接地性の両方に圧力がどう効くかの体系的な整理は不足していた（序論）。", "p3": "ばね上の上下・ピッチ・ロールと4輪のばね下を表す7自由度の車両モデルを作り（§2、図4）、ISO 8608の路面クラスB（良）〜E（極めて悪い）のランダム入力を与えて、初期圧4〜10×10⁵ Pa、車速30〜60 km/hで計算した（§3）。直観：圧を上げると等価剛性が上がり、路面の凹凸を吸収しにくくなる。", "p4": "評価指標は、乗り心地として車体加速度の二乗平均平方根（RMS）、走行安全性として車輪の動的荷重係数k_d（最大k_dmax・最小k_dmin）を用いた（§3）。良いとは、RMSが小さく、k_dの振れ幅が小さく接地が保たれることを指す。", "p5": "クラスBで60 km/hのとき、車体加速度RMSは圧4×10⁵ Paの0.144 m/s²から10×10⁵ Paの0.203 m/s²へ約41%増えた（§3.1、表1）。60 km/h・10×10⁵ Paでの最大値はクラスCで0.271、クラスDで0.555 m/s²と路面が悪いほど増えた（図16・24のキャプション）。圧を上げるとk_dmaxが増えk_dminが減り、推奨範囲はクラスBで4〜8×10⁵ Pa、C〜Dで4〜6×10⁵ Paとした（結論）。", "p6": "結果は特定の車両モデルと条件での推奨値で普遍的な最適値ではないと著者は述べる（結論5）。本文を見た範囲では実車計測による検証がなく、空気ばねの非線形性やヒステリシスのモデル化の程度も明確でない（解釈）。", "fun": "空気でふくらませたばねは、空気を多く入れるほど硬くなります。硬いと重い荷物を載せても沈みませんが、道のでこぼこを車体に伝えやすくなり、乗り心地もタイヤの接地も悪くなります。自転車のタイヤの空気圧と同じで、道の荒れ方と速さに合わせた「ちょうどよい硬さ」があることを数値で示した研究です。", "unverified": "モデルの各パラメータ値と実車との照合の有無は本文の該当箇所を確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "潜在ラグランジアンで強制非線形系を縮約する", "title": "Latent-Lagrangian Neural Networks for Reduced Order Modeling of Non-autonomous Nonlinear Dynamical Systems", "url": "https://arxiv.org/abs/2610.04723", "authors": "Anand Kumar Agrawal ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Agrawal, A. K., & Thorin, A. (2026). Latent-Lagrangian Neural Networks for Reduced Order Modeling of Non-autonomous Nonlinear Dynamical Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04723", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法の§2、検証方法の§3、2自由度と5自由度の結果の§4、図のキャプション）を読んだ", "preprint": true, "p1": "外力を受ける非線形振動系について、自己符号化器で求めた潜在座標の上で運動エネルギーと位置エネルギーをニューラルネットで学習し、物理法則に沿った縮約モデルを作る枠組み（Latent-Lagrangian NN）を示した。", "p2": "ラグランジアン・ハミルトニアン型のニューラルネットは元の座標で学習するものが多く、外力のある非自律系の縮約や、学習時にODEソルバーを回す計算負荷が課題だった（§1）。", "p3": "変位qを自己符号化器で潜在座標zに写し、zでの運動エネルギーT（質量行列型か自由形）と位置エネルギーVを別のネットで学習し、オイラー・ラグランジュ方程式から潜在空間の力を求める（§2.2、式9・12）。減衰はTとVのヘッセ行列の線形結合（レイリー型）で入れ（式13）、潜在の力は仮想仕事の等価からエンコーダのヤコビアンの転置で元の座標に戻し（式14〜16）、再構成誤差と力の誤差の和を最小化する（式17）。力を教師にするため学習中にODEを解く必要がない。", "p4": "大変位で非凸な位置エネルギーを持つ2自由度系と、3次の非線形ばねを持つ5自由度系（潜在次元4に縮約）の数値データで、学習時と異なる初期条件と非調和な外力に対する応答の相対誤差、学習したエネルギーの等高線、3つの乱数種での誤差のばらつき、5%ノイズでの頑健性を見た（§3、§4）。", "p5": "2自由度系では変位の相対誤差が0.012と0.016、速度が0.019と0.020（図4・5）で、時間刻みを2倍にしても誤差は変わらなかった（§4.1）。5自由度系では変位の誤差が質点ごとに12.1%〜2.3%、遅い成分の速度は21%と16.4%と大きくなり、潜在次元を4より減らすと誤差が増えた（§4.2）。", "p6": "検証は数値で作った小さな系に限られ、5自由度系では縮約で誤差が大きく、ノイズ下の学習にはデータの作り方を変える必要があった（§4.2）。解釈：実構造の計測データや連続体への拡張は未検討で、潜在次元の選び方の基準も示されていない。", "fun": "振り子やばねの動きは「運動エネルギーと位置エネルギーの差」から全部計算できる、というのが解析力学の考え方です。この研究はその式の形だけをAIに教え、エネルギーの中身は学ばせました。しかも元の変数より少ない「隠れた座標」で表すので、複雑な揺れを少ない変数で、物理のルールを守ったまま再現できます。", "unverified": "5%ノイズで学習した場合の具体的な誤差の値（図15〜17）は照合していない。"}}, {"id": "pr04", "rank": 4, "headline": "公開行動データから作るペルソナで世論調査を模擬", "title": "Data-Driven Personas for Survey Simulation: Insights into Simulation Alignment Across Data-Access Regimes", "url": "https://arxiv.org/abs/2610.05828", "authors": "Dongryeol Lee ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Lee, D., Łajewska, W., Perelli, L., & Mansour, S. (2026). Data-Driven Personas for Survey Simulation: Insights into Simulation Alignment Across Data-Access Regimes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05828", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ利用の3段階の設定、実験設定、§5の結果、§6の考察の冒頭）を読んだ", "preprint": true, "p1": "公開された匿名の行動データからLLMでペルソナを作り、人口学的な集団ごとの世論調査の回答分布を模擬するとき、どんなデータがどれだけあれば人に近づくかを、データ入手の3段階で切り分けた。", "p2": "LLMによる調査の模擬（合成回答者）は、対象の調査データで微調整やプロンプトを作ることが多く、費用とプライバシーの問題がある。対象外のデータから作ったペルソナで代替できるかは未検証だった（§1、§3.2）。", "p3": "Claude 3.7 Sonnetで、映画レビュー・買い物履歴・他の調査の回答などの行動記録から自然言語のペルソナと11項目の推定属性（確信度つき）を作り、確信度の高い30人を集団に割り当てる（§4.3）。30体のエージェントが選択肢ごとの確率を言語で答え、平均して集団の分布にする（§4.4）。", "p4": "GSS、OpinionQAの2波、SocSci210の2部分集合の5つの調査で、人の集団別回答分布との全変動距離（TVD）と1-ワッサースタイン距離で比べた。基準は属性なし（B1）、国のみ（B2）、属性1つ（B3）の3つ（§4.4、§4.5）。", "p5": "対象外のデータから作ったペルソナは、属性を1つ与えるだけのB3をほとんど上回らなかった（§5.1、表1）。ペルソナの集団への割り当てに正解の属性を使うとTVDが一貫して下がり、割り当ての誤りが主な原因だった（§5.2、表2）。GSSの質問の80%からペルソナを作ると残りの質問の予測が改善し、3回の分割すべてでB3を上回った（TVD 0.111対0.131など、§5.3）。属性の不一致と調査のTVDの相関はピアソン0.631だった（図4）。", "p6": "計算費用のため多くの条件は1回しか実行していない（§5.3）。解釈：生成と模擬に同じ商用LLMを使っており、モデルの事前知識の影響と、ペルソナそのものの寄与の切り分けは限られる。", "fun": "AIに「ある人になりきって」アンケートに答えさせるとき、その人の買い物記録や映画の感想を渡せば本人らしくなるでしょうか。答えは意外にも「ほとんど変わらない」でした。効いたのは、その人が本当はどの年齢・性別のグループかを正しく知ることと、同じアンケートの過去の回答でした。細かい情報より、正しい分類の方が大事だったのです。", "unverified": "表1・表2の各条件のTVDの値は照合していない。"}}, {"id": "pr05", "rank": 5, "headline": "役割付きLLMと人が多者対話する組織研究の枠組み", "title": "Multi-party simulations with human participants and role-based LLM conversational agents: A design framework and validity evidence for organizational research", "url": "https://doi.org/10.31234/osf.io/84atj_v1", "authors": "Yuki Nozaki ほか", "venue": "PsyArXiv", "date": "2026-10-06", "apa": "Nozaki, Y., Fujisawa, N., & Kano, Y. (2026). Multi-party simulations with human participants and role-based LLM conversational agents: A design framework and validity evidence for organizational research. https://doi.org/10.31234/osf.io/84atj_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "PsyArXiv版のPDF本文（方法、課題、測定、分析計画、結果のpp.17〜31）を読んだ。考察の後半は抄録で補った", "preprint": true, "p1": "人の参加者が役割を与えられた複数のLLMエージェントと文字で会議をする「多者シミュレーション」を組織研究の実験環境として設計する枠組みを示し、事前登録した実験で妥当性の初期的な証拠を出した。", "p2": "組織の現象は複数の当事者のやりとりの中で起きるが、現実の観察は統制が効かず、従来の実験や台本型の刺激は現実味と規模に欠ける、というトレードオフがある（抄録）。", "p3": "シナリオ設計、ペルソナのプロンプト（背景・性格・話し方・行動制約）、対話の手順、反復的な試験からなる設計の指針を示した。実験では参加者が新商品開発チームのリーダーを演じ、突然「もう続けられない」と言い出す若手を含む立場の異なる3人のAIメンバーと会議をした（pp.19〜20）。", "p4": "日本の35〜50歳の会社員（除外後394人）をGPT-5.2、Gemini 2.5 Flash、Claude Sonnet 4.6の3条件に無作為に割り付け、擬人性・生命感（Godspeed尺度）とペルソナへの忠実さの評定、エージェントの全8,954発話の盲検コーディング、参加者の発話のYukl分類によるリーダー行動の系列分析を行った（pp.18〜26）。", "p5": "どのモデルでもエージェントは擬人的で設定に忠実と評価された（忠実さは尺度中点より有意に高くd>1.72、p.27）。発話のうち設定違反は2.59%で、多くは敬語の水準の逸脱だった。違反率はGeminiで4.25%とGPT（2.08%）・Claude（1.61%）より高かった（p.28）。参加者の行動は6つの類型に分かれ、最大は関係重視型（47.46%）で、類型の分布はモデルによって有意に異なった（p.30）。", "p6": "日本語・一つのシナリオ・文字のみの検証であり、モデル間で参加者の発言回数が異なる（GPT条件で多い）ため条件比較には注意が要る（p.29）。解釈：参加者はAIと知って対話しており、人同士の会議との等価性は直接は検証されていない。", "fun": "会議のリーダー役を練習するとき、部下役を全部AIが演じてくれたらどうでしょう。この研究では、AIの部下がそれぞれの性格を守って話し、人はそれに反応して実際のリーダーらしい振る舞いを見せました。AIの「設定違反」の多くが敬語の崩れだったというのは、日本語ならではの面白い発見です。", "unverified": "考察で示された実務上の指針の詳細は本文の該当頁を読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "デトロイトの土地価値税案は発表段階で地価を動かす", "title": "Expectation Effects on Real Estate Pricing of Detroit's 2023 Proposal for Land Value Tax Implementation", "url": "https://doi.org/10.2139/ssrn.7556261", "authors": "Kevin Shea", "venue": "SSRN", "date": "2026-10-06", "apa": "Shea, K. (2026). Expectation Effects on Real Estate Pricing of Detroit’s 2023 Proposal for Land Value Tax Implementation. https://doi.org/10.2139/ssrn.7556261", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "土地価値税（land value tax, LVT）の導入が議論されるだけで、実施前から地価に一部織り込まれるという期待NPVモデルを作り、デトロイト市長の2023年の提案で検証した。", "p2": "LVTが地価を下げ住宅の高密度化を促すこと、税制変更の予告が開発業者に織り込まれることは知られていたが、導入の可否が不確かな議論段階での価格効果を扱う枠組みはなかった（抄録）。", "p3": "現在と将来ありうる税制の下での不動産価格を期待正味現在価値（eNPV）で表し、導入確率に比例して価格効果が先取りされるとする。例：即時導入の確率を市場が50%と見れば、効果は実施時の約半分になる（抄録）。", "p4": "不動産会社Redfinに依頼して作った2022年6月〜2024年5月のデトロイトと周辺自治体の住宅市場データで、2023年5月31日の市長の提案発表を境に、市境をはさんだ空間的な差の不連続（difference-in-discontinuities）で売買価格を比べた（抄録）。", "p5": "市の内側の境界では、未開発の土地の市場価値が下がり、よく開発された土地の価値が上がるという理論どおりの効果が見られたが、外側の境界では見られなかった（抄録）。効果の大きさの数値は抄録にない。", "p6": "単一の事例研究であり、他の事例での検討が必要と著者は述べる（抄録）。解釈：内側と外側の境界で結果が分かれた理由と、市場が想定した導入確率の推定方法は抄録からは分からない。", "fun": "「来年から土地に税金がかかるかも」というニュースが流れた段階で、土地の値段はもう動き始めるのか。50%の確率なら半分だけ動く、という考え方は、天気予報の降水確率で傘を持つかを決めるのに似ています。空き地は値下がりし、建物の建った土地は値上がりするという向きの違いも、税の仕組みから説明できます。", "unverified": "効果の大きさ、標本の件数、外側の境界で効果がない理由は未確認（本文を入手できず）。"}}, {"id": "pr07", "rank": 7, "headline": "東証のPBR1倍割れ要請は株価の下方リスクを減らした", "title": "Soft-law valuation pressure and tail risk: Evidence from Japan's cost-of-capital mandate and Korea's Value-up Programme", "url": "https://doi.org/10.2139/ssrn.7566395", "authors": "Hui Chen", "venue": "SSRN", "date": "2026-10-05", "apa": "Chen, H. (2026). Soft-law valuation pressure and tail risk: Evidence from Japan’s cost-of-capital mandate and Korea’s Value-up Programme. https://doi.org/10.2139/ssrn.7566395", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "東証の資本コスト・株価を意識した経営の要請（2023年3月）が、PBR1倍割れ企業の株価の暴落リスクを下げたことを、韓国のバリューアップ・プログラム（2024年2月）との比較で示した。", "p2": "日韓では帳簿価格を下回る企業に資本コストを稼ぐ計画の説明を求める法的拘束力のない圧力（ソフトロー）がかけられたが、それが株主リターンの分布に与える影響は分かっていなかった（抄録）。", "p3": "2つの施策を並行する政策実験とみなし、同じ市場内でPBR1倍未満の企業とその他の企業を比べる積み重ね型の差の差（stacked DiD）を用いた。実際の計画開示を対象かどうかで操作変数推定した局所効果も求めた（抄録）。", "p4": "2019〜2025年の3,959社・26,886企業年で、負の条件付きリターン歪度（暴落リスクの指標）と下落・上昇のボラティリティ比を結果変数とした（抄録）。", "p5": "日本の対象企業では負の条件付き歪度が0.096低下したが、韓国の対象企業では歪度は変わらず、下落/上昇のボラティリティがわずかに低下しただけで、両市場の差0.098は有意だった。操作変数による局所効果は-0.177で、経路として株主還元の増加、現金の圧縮、裁量的発生高の低下、外国人持株の増加が挙がった。財閥系企業は恩恵を受けなかった（抄録）。", "p6": "本文を入手できず、頑健性の確認や事前トレンドの検討は未確認。解釈：要請の時期は他の市場要因（金利・為替など）と重なりうるため、日本と韓国の差がどこまで施策そのものによるかは本文での確認が要る。", "fun": "「株価が会社の帳簿上の価値より安いなら、その理由と改善策を説明して」と取引所がお願いしただけで、法律の強制がないのに株価の大暴落が起きにくくなった、という結果です。同じ政策でも、支配株主が利益を独り占めしやすい韓国の財閥企業では効かなかった点が、制度の効き目が持ち主の構造次第であることを示しています。", "unverified": "頑健性の検定と事前トレンドの確認は未確認（本文を入手できず）。"}}, {"id": "pr08", "rank": 8, "headline": "LLM討論が多数決に勝つ条件は提案の供給と読み出し", "title": "When Debate Helps: Proposal Supply and Verification-Aware Readout in Multi-Agent Reasoning", "url": "https://arxiv.org/abs/2610.04686", "authors": "Zihao Zhao ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Zhao, Z., Zhang, T., Shi, H., Zhao, Y., Zhang, X., & Wang, H. (2026). When Debate Helps: Proposal Supply and Verification-Aware Readout in Multi-Agent Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04686", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2の設定、§3の理論、§4の構成法、§5の実験の前半と制御実験の設計）を読んだ。表1の個別数値と付録は未読", "preprint": true, "p1": "LLMの多エージェント討論が多数決に勝てる条件を、「正解を誰かが出しているか（提案の供給）」と「その少数の正解を拾えるか（読み出し）」の二つに分けて定式化し、両方を強める作り方を示した。", "p2": "多エージェント討論は推論を改善しうる一方で、単純な多数決をしばしば超えられず、何が効いているのかが分かれていなかった（§1）。", "p3": "初回の提案に正解が含まれるが多数決は誤る割合を「回収可能な余地」H(S)と定義し（式4）、討論の多数決に対する利得を、余地の回収・新たな正答・多数決で正しかった問題の損失の3項に分解した（命題1、式7）。読み出しは、候補ごとに検証の証拠を受け取って最終回答を作る潜在検証討論（LVD）として扱う（§3.2）。供給を増やすため、補い合う正答を持つエージェントをラベルあり・なしの被覆目的で貪欲に選んで社会を作る（§4、式12）。", "p4": "Qwen3-4BとOLMo-3-7Bを骨格に、AMC12・MATH500・GPQA・MMLU-Reduxで、4エージェント・5ラウンドの討論を、自己一貫性、通常の討論、上位スコアのエージェントによる投票・討論と同じ計算予算で比べた（§5）。正答の仲間の応答が回答確率をどれだけ動かすかを、等価な支持の数に換算する制御実験も行った（§5）。", "p5": "被覆で選んだ社会は、ラベルなし（SC-Greedy）とラベルあり（AC-Greedy）のそれぞれの区分で最良の平均を示し、MMLU-Reduxで差が明確だった（表1）。5つの乱数種での再実行では、通常の討論に対しQwen3-4Bで+1.14ポイント（95%信頼区間0.60〜1.67）と+1.46、OLMo-3-7Bで+0.96と+2.01ポイント改善した（§5）。", "p6": "信頼区間は生成の乱数のばらつきを表し、問題の再標本化による不確かさは含まない（§5）。解釈：改善幅は1〜2ポイント程度で、正解の判定が明確な課題に限られ、価値判断を含む熟議にそのまま当てはまるかは別問題。", "fun": "多数決で間違えたのに、少数派の誰かは正解を言っていた、という場面はクラスの話し合いでもよくあります。話し合いが多数決に勝つには、まず正解を言える人がいること、次にその声を聞き分けられることの二つが必要だ、と式で分けて示したのがこの研究です。だから、似た者同士ではなく得意分野の違う人を集めるのが大切になります。", "unverified": "表1・表2の個別の正答率と、LVDの等価支持数の推定値は照合していない。"}}, {"id": "pr09", "rank": 9, "headline": "標本から確率動力学を学ぶ離散Action Matching", "title": "Discrete Action Matching: Learning Stochastic Dynamics from Samples via State Graphs", "url": "https://arxiv.org/abs/2610.05071", "authors": "Mikhail Persiianov ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Persiianov, M., & Korotin, A. (2026). Discrete Action Matching: Learning Stochastic Dynamics from Samples via State Graphs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05071", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2.3のグラフ上のワッサースタイン幾何、§3の手法と定理3.1、§5の実験、§6の限界）を読んだ。付録の証明は未読", "preprint": true, "p1": "有限個の状態の間を確率が移る集団の動態を、対応のとれていない時点ごとのスナップショット（周辺分布）だけから学ぶ方法として、連続空間のAction Matchingのグラフ版（離散Action Matching、DAM）を作った。", "p2": "時点ごとの分布だけから動態を復元する問題は解が一つに決まらない逆問題で、構造的な仮定が要る。連続空間では最小運動エネルギーの速度場を学ぶAction Matchingがあるが、離散状態ではエネルギーが未知の確率の値に依存し、標本から直接評価できなかった（§2.3）。", "p3": "グラフ上の連続の式 ṗ=L_θ(p)S（式8・13）で、確率の流れを各状態の「作用ポテンシャル」Sの勾配で表し、その中で運動エネルギー最小の流れを標準解とする。作用の差が学習可能な損失（式15）に書き換えられることを示し（定理3.1）、移動度θの1次同次性から、運動エネルギーが隣り合う状態の確率比だけで書けること（式16）を使って、比を先に推定してからSを学ぶ（§3.2）。", "p4": "既存の自由エネルギー勾配流法（FEGF）と、11種類のグラフ上の合成動態（5時点の周辺分布）とマウス原腸形成の34細胞型・9段階のアトラスで比べ、予測した周辺分布とテスト分布のヘリンジャー誤差（小さいほど良い）を3つの乱数種で評価した（§5）。", "p5": "対数移動度を使ったDAMは、基本設定の11グラフ族すべてでFEGFより平均誤差が小さく、エントロピーの強さやグラフの大きさ、標本数を変えても優位がおおむね保たれた（§5.1、図2）。原腸形成の内挿でもDAMの2変種がFEGFより低い誤差で、調和移動度が最良だった（§5.2、図3、表3）。", "p6": "周辺分布だけでは微視的な経路は一意に決まらず、DAMは選んだグラフ幾何と移動度の下での最小作用の流れを選ぶにすぎない（§6）。解釈：移動度θの選び方で結果が変わり、物理的に正しい選び方の基準は対象ごとに要検討。", "fun": "ある日の地図に人が何人いるかだけが分かり、誰がどこへ移動したかは分からない。そんなとき「一番エネルギーを使わない動き方」を仮定すると、人の流れを推定できます。この研究は、それを点と線でできたグラフ上で行う方法を作り、しかも隣同士の人数の比だけ分かれば計算できることを見つけた点が鮮やかです。", "unverified": "表3の移動度ごとの誤差の値は照合していない。"}}, {"id": "pr10", "rank": 10, "headline": "社会関係資本の閉鎖と仲介を行列で同時に表す", "title": "The Closure-Brokerage Decomposition: A Matrix-Valued Representation of Social Capital", "url": "https://doi.org/10.2139/ssrn.7560398", "authors": "Moses Boudourides", "venue": "SSRN", "date": "2026-10-05", "apa": "Boudourides, M. (2026). The Closure-Brokerage Decomposition: A Matrix-Valued Representation of Social Capital. https://doi.org/10.2139/ssrn.7560398", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "社会関係資本の「閉鎖性（closure）」と「仲介（brokerage）」を、ネットワーク上の2歩の歩みを表す行列値の作用素の標準的な分解として同時に表す枠組みを示した。", "p2": "閉鎖性と仲介は対立する概念として語られ、クラスタリング係数や制約度のようなスカラー指標に要約されてきたため、両者が同じ位置で共存する構造が見えなかった（抄録）。", "p3": "2次の相互作用の対ごとの配置を失わずに保持する2歩作用素を定義し、その成分を閉鎖と仲介に分解して、ノード単位の動員可能な社会関係資本に対応づける（抄録）。数式の具体形は抄録にない。", "p4": "抄録の範囲では理論的な枠組みの提示が中心で、実データでの検証の記述はない（抄録）。", "p5": "高い埋め込みと高い仲介を同時に持つ行為者、すなわちKrackhardtの「苦悩する仲介者」をスカラー指標では捉えられないが、この表現では特定できると示した。集計の手続きが異なる仲介経路を潰して仲介を系統的に歪めることも示し、ネットワーク学習の動態と組み合わせて探索と活用のトレードオフの構造的基礎を与えた（抄録）。", "p6": "実証データへの適用と既存指標との比較の結果は抄録からは確認できない。解釈：計算量の大きさと、大規模ネットワークでの推定・解釈の方法が残る疑問。", "fun": "仲の良いグループの中にいる人（閉鎖）と、グループ同士をつなぐ橋渡し役（仲介）は、普通は別の人だと考えられています。でも実際には、両方の立場を同時に背負って板挟みに苦しむ人がいる。一つの数字にまとめると消えてしまうその姿を、行列のまま扱うことで捉えようとする研究です。", "unverified": "作用素の定義式、実データでの検証の有無と結果は未確認（本文を入手できず）。"}}, {"id": "pr11", "rank": 11, "headline": "看護師と医師で仕事の要求度と資源の効き方が違う", "title": "Job demands, organisational and individual resources, and work-related outcomes among nurses and physicians in Portugal: a cross-sectional study", "url": "https://doi.org/10.2139/ssrn.7570161", "authors": "Ana Santana-Ruiz ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Santana-Ruiz, A., Ribeiro-Viseu, J., Cifuentes-Tinjaca, C., Carreño-Moreno, S., & de Jesus, S. N. (2026). Job demands, organisational and individual resources, and work-related outcomes among nurses and physicians in Portugal: a cross-sectional study. https://doi.org/10.2139/ssrn.7570161", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "ポルトガルの看護師と医師1,132人で、業務量、組織支援、心理的資本、ワーク・エンゲイジメント、情緒的コミットメントの関係を示し、職種間の違いを比べた。", "p2": "COVID-19で医療従事者への負荷が高まり、健全な職場環境に関わる組織と個人の資源を理解する必要が増した（抄録）。", "p3": "2020年9月〜2022年1月に5つの自己記入式尺度をオンラインで実施した横断研究で、相関と職種間の効果量（d）で分析した（抄録）。", "p4": "看護師673人と医師459人。仕事の要求度として業務量、資源として知覚された組織支援と心理的資本、結果としてエンゲイジメントと情緒的コミットメントを測った（抄録）。", "p5": "業務量はエンゲイジメントと負に相関し（r=-0.369）、組織支援はエンゲイジメント（r=0.423）とコミットメント（r=0.515）に正に相関した。心理的資本とエンゲイジメントはr=0.534、最も強い関連はエンゲイジメントとコミットメント（r=0.646）だった。医師は看護師より業務量（d=0.283）とコミットメント（d=0.179）が高かった（抄録）。", "p6": "横断・二変量の相関であり、関係の向きを明らかにするには縦断・多変量の研究が必要と著者は述べる（抄録）。解釈：パンデミック期間中の長い調査期間で状況が変化しており、時期の影響も残る。", "fun": "忙しさは仕事への熱意を下げますが、組織の支えや「自分ならできる」という心の資源は熱意を上げる、という仕事の要求度-資源モデルの考え方を、医師と看護師で確かめた研究です。医師の方が忙しいのに組織への愛着も強いという結果は、忙しさだけでは働く人の気持ちが決まらないことを示しています。", "unverified": "多変量での検討の有無は未確認（本文を入手できず）。"}}, {"id": "pr12", "rank": 12, "headline": "SHMの加速度記録の異常7類型をTransformerで分類", "title": "DATA ANOMALY DETECTION IN STRUCTURAL HEALTH MONITORING USING A MODIFIED TRANSFORMER ENCODER WITH 1D-CNN LAYERS", "url": "https://doi.org/10.5281/zenodo.23191733", "authors": "Nuriev, Sirojiddin", "venue": "Zenodo", "date": "2026-10-06", "apa": "Nuriev, S. (2026). DATA ANOMALY DETECTION IN STRUCTURAL HEALTH MONITORING USING A MODIFIED TRANSFORMER ENCODER WITH 1D-CNN LAYERS. Zenodo. https://doi.org/10.5281/ZENODO.23191733", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれた国際会議論文集（ウズベキスタン、2026年9月）所収のPDF本文（手法、実験、表I〜III、結論）を読んだ", "preprint": true, "p1": "斜張橋の長期加速度記録の1時間ごとの区間を、正常・欠損・微小・外れ値・矩形・トレンド・ドリフトの7つのデータ異常パターンに、約5.1万パラメータの軽いTransformerで97.1%の精度で分類した。", "p2": "SHMの連続データには環境の影響や伝送障害、センサ故障による異常が混じり、後段の構造評価を損なう。既存の画像ベースのDNN・CNNやシェイプレット法より、軽く正確な前処理の分類器が求められていた（§I）。", "p3": "各チャネルの1時間の記録を正規化して30秒の窓に分け、窓ごとに最小・最大・平均・分散の4統計量とFFT振幅スペクトルの20特徴を取り、120×24の特徴系列にする（§II-A、式1）。Transformerエンコーダの位置ごとの全結合層を1×1の1次元畳み込み2層に置き換え、位置符号化を除き、全体平均プーリングと7クラスのソフトマックスで分類する（§II-B、式2・図1）。", "p4": "斜張橋の桁と塔に設置した38チャネルの2012年1〜2月の加速度を、時系列順に学習（1月1〜24日）・検証（1月25〜31日）・テスト（2月）に分けた（表I）。外れ値とドリフトは3%未満と不均衡で、精度・適合率・再現率・F1で評価し、全結合層や位置符号化の有無の変種と比べた（§III-A）。", "p5": "提案モデルはテスト精度97.1%で、通常のエンコーダ（44.6万パラメータ）の95.8%を上回った（表II）。全結合層版は学習精度が最大99.4%と高いのに汎化が劣り過学習を示した。クラス別では欠損と矩形はほぼ完全に分離できたが、外れ値（F1 75.3%）は正常と、ドリフト（82.8%）はトレンドと混同された（表III）。", "p6": "既存手法の精度（87.0〜94.1%）は原著の報告値で、データの期間と分割が異なり直接比較ではない（表IIの注）。解釈：1つの橋の2か月のデータに限られ、別の橋やセンサへの汎化と、ラベル付けの基準は確認されていない。", "fun": "橋に付けた何十個ものセンサは、壊れたり電波が途切れたりして「おかしなデータ」を出します。その種類を自動で見分けられれば、本当の橋の異常と機械の故障を混同せずに済みます。大きなAIほど良いわけではなく、部品を小さく作り替えた方が新しいデータでよく当たったという点が、過学習の分かりやすい例です。", "unverified": "表Iの各分割の標本数は照合していない。"}}, {"id": "pr13", "rank": 13, "headline": "一般化交差検証で逐次EnKFの局所化係数を決める", "title": "Localizing the serial square-root ensemble Kalman filter with generalized cross-validation", "url": "https://doi.org/10.22541/essoar.15009909/v1", "authors": "I. Grooms", "venue": "ESS Open Archive", "date": "2026-10-05", "apa": "Grooms, I. (2026). Localizing the serial square-root ensemble Kalman filter with generalized cross-validation. https://doi.org/10.22541/essoar.15009909/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "アンサンブル・カルマンフィルタ（EnKF）でスカラー観測を逐次に同化する際の局所化係数を、リッジ回帰と一般化交差検証（GCV）から、標本相関とアンサンブル数の簡単な明示式として導いた。", "p2": "EnKFでは標本数の少なさによる偽の相関を抑える局所化が不可欠で、従来は状態変数と観測の空間距離に基づき、局所化半径の調整に結果が左右されやすかった（抄録）。", "p3": "逐次EnKFの局所化をリッジ回帰の問題として定式化し、GCVで局所化係数を標本相関とアンサンブル数の関数として与える。直観：相関が小さくアンサンブルが少ないほど、その相関は偶然の可能性が高いので更新を弱める（抄録、解釈を含む）。", "p4": "データ同化研究基盤DARTに実装し、Lorenz-96モデルと大気の乾燥力学コアで、距離に基づく局所化や、DARTにある別の相関ベースの方法と比べた（抄録）。", "p5": "単独でも使えるが、距離に基づく局所化と組み合わせたときに最も良く、局所化半径の変化に対する結果の感度を下げた。既存の相関ベースの方法と同程度の性能で、実装はより簡単で計算費用もわずかに低かった（抄録）。", "p6": "誤差の数値や、より現実的なモデルでの評価は抄録からは確認できない。解釈：観測が時間的に密で相関が強い構造物の計測データに対する挙動は未検討。", "fun": "天気予報は、少ない数の「ありうる天気のシナリオ」から、観測でどこを直すかを決めます。シナリオが少ないと、本当は関係ない場所同士に偶然の関係が見えてしまう。その偶然らしさを相関の大きさとシナリオ数だけから判断する簡単な公式を作った点が、地味ですが実用的です。", "unverified": "誤差の数値と計算時間の比較は未確認（本文を入手できず）。"}}, {"id": "pr14", "rank": 14, "headline": "LLMで尺度項目を作りネットワーク心理測定で絞る", "title": "The Ultimate Tutorial for AI-driven Scale Development in Generative Psychometrics: Releasing AIGENIE from its Bottle", "url": "https://doi.org/10.31234/osf.io/arfg3_v2", "authors": "Lara Lee Russell-Lasalandra ほか", "venue": "PsyArXiv", "date": "2026-10-05", "apa": "Russell-Lasalandra, L. L., Golino, H., Garrido, L. E., & Christensen, A. P. (2026). The Ultimate Tutorial for AI-driven Scale Development in Generative Psychometrics: Releasing AIGENIE from its Bottle. https://doi.org/10.31234/osf.io/arfg3_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "PsyArXiv版のPDF本文（序論の手法の説明、Part 5のBig FiveとAI不安の例、§9.3の限界と§9.4の結論）を読んだ。インストール手順の各節は流し読み", "preprint": true, "p1": "LLMで心理尺度の項目候補を大量に作り、埋め込みベクトルとネットワーク心理測定で冗長・不安定な項目を削って、人に調査する前に構造的に妥当な項目プールを作るRパッケージAIGENIEの使い方を解説した。", "p2": "尺度開発は専門家による項目作成・修正と大規模な予備調査が必要で時間と費用がかかる。LLMが専門家並みの項目を書けるという報告は増えているが、作った項目を検証する工程までを一つにまとめた道具は少なかった（序論）。", "p3": "手順は、項目の生成（または既存項目の投入）→エンコーダLLMで埋め込み→探索的グラフ分析（EGA）で次元構造を推定し、意図した構造との一致を正規化相互情報量（NMI、0〜100%）で測る→固有変数分析（UVA）で意味の重なる冗長な項目を除く→疎・全次元の埋め込みのうちNMIの良い方を選ぶ→ブートストラップEGAで所属が安定しない項目を除く、の7段階（序論の手順0〜6）。例：不安を「睡眠」と「自己疑念」の2側面で作った10項目なら2つのまとまりが期待され、睡眠項目が自己疑念側に入れば質の低い項目の疑いがある。", "p4": "Big Fiveのうち3特性と、新しい構成概念であるAI不安（4因子）を例に、縮約前後のNMIとネットワーク図で示した（Part 5、図5〜8）。OpenAI・Anthropic・Groq・HuggingFace・ローカルモデルに対応し、完全オフラインでも動く（抄録）。", "p5": "AI不安の例では、1回の実行で全4因子のNMIが縮約後に上がり、学習不安の項目ではNMIが9.48ポイント改善して86.91%に達した（図5）。既存の人が作った項目にも縮約手順を適用できるGENIE()関数を備える（Part 6）。", "p6": "AIGENIEが示すのは内部構造の妥当性の一側面だけで、内容的妥当性・文化的適切さは評価しない。別の尺度開発では、専門家の内容審査がAIGENIEの残した項目の相当部分を削除した（§9.3）。NMIは最大化の目標ではなく診断指標として扱うべきで、出力の質は使うLLMと埋め込みに強く依存する（§9.3）。", "fun": "アンケートの質問を作るのは意外に大変で、似た質問が重なったり、測りたいことからずれたりします。この道具は、AIに質問をたくさん書かせ、意味の近さを数値にして、似すぎた質問やグループからはみ出す質問を自動で捨てます。人に答えてもらう前に「質問の形の良さ」をある程度確かめられる点が新しいところです。", "unverified": "Big Five例のNMIの値と、AI不安の他の3因子の改善幅は照合していない。"}}, {"id": "pr15", "rank": 15, "headline": "農産物ブランドコミュニティの信頼と不信は別経路", "title": "Configurational Foundations of Consumer Trust and Distrust in Agricultural Virtual Brand Communities: A Necessary-Condition and Fuzzy-Set Analysis", "url": "https://doi.org/10.2139/ssrn.7570604", "authors": "煜宸 杨 ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "杨, 煜宸, 王, x., chen, b., cao, w., & Wang, Q. (2026). Configurational Foundations of Consumer Trust and Distrust in Agricultural Virtual Brand Communities: A Necessary-Condition and Fuzzy-Set Analysis. https://doi.org/10.2139/ssrn.7570604", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "農産物のオンライン・ブランドコミュニティで、消費者の高い信頼と積極的な不信が別々の条件の組合せから生じ、「信頼が低い＝不信」ではないことを示した。", "p2": "農産物のECでは購入前に品質・産地・安全を確かめられないため信頼が重要だが、信頼と不信を同じ軸の両端として扱う研究が多かった（抄録）。", "p3": "製品判断の自己効力感、道徳的アイデンティティ、向社会的傾向、画像と文章の提示、電子口コミ、コミュニティの双方向性、コミュニティ内の関係の7条件について、必要条件分析（NCA）とファジィ集合の質的比較分析（fsQCA）で、信頼と不信を別々の結果として分析した（抄録）。", "p4": "構成（configuration）の一貫性と被覆率で評価した。一貫性は条件の組合せが結果をどれだけ確実に伴うか、被覆率は結果のうちどれだけを説明するかを表す（抄録、背景を含む）。", "p5": "信頼のモデルは6経路で一貫性0.914890、被覆率0.806018だったが、不信のモデルは6経路で一貫性0.914434、被覆率は0.215466と低かった。NCAでは不信の必要条件は見つからず、信頼にはいくつかの条件が推定法によって必要条件を満たした（抄録）。", "p6": "不信の被覆率の低さは、信頼を生む条件の外にある「違反」に関わる条件が不信を生む可能性を示すと著者は解釈している（抄録）。標本の規模・国は抄録からは分からない。", "fun": "信頼の反対は不信、と思いがちですが、この研究では、信頼を高める条件をそろえても不信はほとんど説明できませんでした。不信は「信頼が足りない」状態ではなく、裏切られた経験のような別の原因から生まれる、別物の感情なのかもしれません。", "unverified": "標本の規模・収集国と各経路の構成は未確認（本文を入手できず）。"}}, {"id": "pr16", "rank": 16, "headline": "精神科診断の多エージェント討論はモデル規模次第で害に", "title": "When Debate Hurts: Model-Scale-Dependent Effects of Multi-Agent Deliberation in Psychiatric Diagnosis", "url": "https://doi.org/10.21203/rs.3.rs-11262158/v1", "authors": "Kunal Dhanda", "venue": "Research Square (In Review)", "date": "2026-10-06", "apa": "Dhanda, K. (2026). When Debate Hurts: Model-Scale-Dependent Effects of Multi-Agent Deliberation in Psychiatric Diagnosis. https://doi.org/10.21203/rs.3.rs-11262158/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "精神科診断の多エージェント討論（Multi-Agent Debate, MAD）は、小型のローカルモデルでは単独のゼロショット回答より精度を下げうると報告した。", "p3": "24件の合成症例（DSM-5-TR形式）で、1Bと3Bの公開重みモデルを使い、討論・審判役による統合・ゼロショットを比較し、各条件を5回ずつ独立に試行した（抄録）。", "p5": "5試行の平均で、討論方式はゼロショットより有意に低い精度だった（1Bで57.0%対73.3%、3Bで69.2%対88.3%、抄録）。審判役を除いた討論だけでも下回った。高リスク症例は2件のみで、リスク判定の効果は確定的でない。", "fun": "「みんなで話し合えば賢くなる」は人間の会議でもよく言われますが、この研究では小さなAI同士の話し合いがかえって正答率を下げました。1回だけの比較では差が見えず、5回繰り返して初めて差がはっきりした点も、実験で試行回数が大事なことを教えてくれます。", "unverified": "症例ごとの結果と審判役の詳しい挙動は本文未確認。"}}, {"id": "pr17", "rank": 17, "headline": "政治学7研究の再現でLLM注釈の精度とコストを比較", "title": "JEV versus LLMs: Accuracy, Cost and Calibration on Seven Political Science Replications", "url": "https://arxiv.org/abs/2610.06625", "authors": "Matthew DiGiuseppe ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "DiGiuseppe, M., & Denney, S. (2026). JEV versus LLMs: Accuracy, Cost and Calibration on Seven Political Science Replications (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06625", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "選択肢ごとの確率を直接返す商用モデルJEVを、政治学の既存研究7件の再現タスクでLLMや人のコーダーと比べ、社会科学の注釈に使えるかを評価した。", "p3": "公表済み研究の人のコーディングと、中位の商用LLMおよび公開重みのモデルを比較対象に、精度・費用・確率の較正（calibration）を測った（抄録）。", "p5": "JEVは両LLMと同等かそれに近い精度だったが、バッチ料金の商用LLMに対する費用面の優位はなかった。1回だけ尋ねる条件では商用LLMより較正が良いが、公開重みモデルより一貫して良いとはいえなかった（抄録）。", "fun": "AIに文章を分類させるとき、「どれくらい自信があるか」が当たり具合と一致しているかは意外に大事です。この研究は、売り文句の「安くて速くて自信も正確」を実際の政治学の課題で確かめ、宣伝ほどの差はないことを示しました。", "unverified": "7件の再現課題の内訳とタスク別の数値は本文未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AIが仲介すると話し手の立場がずれる", "title": "Stance Drift: How AI-mediated Communication Distorts Our Message", "url": "https://arxiv.org/abs/2610.04620", "authors": "Lingchong Liu ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Liu, L., Zhou, Y., Bien, J., Wang, Y. X. R., Xia, L., & Tong, X. (2026). Stance Drift: How AI-mediated Communication Distorts Our Message (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04620", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが文章を書き、別のLLMがその立場を読み取る二段階の流れで、話し手の立場（スタンス）がどれだけ保たれるかを測り、立場のずれ（stance drift）を示した。", "p3": "5段階のスタンスの状態遷移として流れをモデル化し、元の立場が復元される平均確率を立場保持率（SPR）と定義した。112の討論命題で9つのLLMを評価した（抄録）。", "p5": "既定設定ではどのLLMもSPRが0.7を超えなかった。ずれの多くは極端化・中立からの逸脱・反転の3型で、対策のうち反省プロンプトに中程度の推論を加えた場合だけGPT-5.4で0.775に改善したが、極端化は残った（抄録）。", "fun": "伝言ゲームでは言葉が少しずつ変わりますが、AIに下書きや要約を任せると、伝えたい「賛成・反対の度合い」まで変わってしまうことがあります。特に意見が実際より強く伝わる「極端化」が多いという結果は、AI経由の議論が対立を強めうることを考えさせます。", "unverified": "モデル別のSPRと人による読み取りとの比較の詳細は本文未確認。"}}, {"id": "pr19", "rank": 19, "headline": "生成エージェントの心理的動態を測るベンチマーク", "title": "Benchmarking Psychological Dynamics in Generative Agents", "url": "https://arxiv.org/abs/2610.04246", "authors": "Sumer S. Vaid ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Vaid, S. S., & Whillans, A. V. (2026). Benchmarking Psychological Dynamics in Generative Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04246", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "固定した人物像（ペルソナ）を持つLLMエージェントが、出来事の連続の中で人間らしい心理状態の変化を再現できるかを測るベンチマークを作った。", "p3": "公表された規範値とメタ分析の効果量だけから作り、分布や個人間・個人内の分散の分け方、時間的な依存といった内的妥当性と、既知の特性・状態の関係を再現できるかという外的妥当性の2軸で採点した（抄録）。", "p5": "9社の36モデル（1B〜671B）で、既知の関係の向きは平均84.3%で一致し、分散の分け方も34中26で再現したが、個人内の相関と分布の形は再現できなかった。内的妥当性は規模や能力と無関係だった（抄録）。", "fun": "AIに「ある人」を演じさせると、平均的な答えは人らしくても、同じ人の気分が日々どう揺れるかまでは真似できないことが分かりました。大きなモデルほど人に近いとは限らないという点も、「賢さ」と「人らしさ」が別物であることを示しています。", "unverified": "モデル別の得点と、どの関係が再現できなかったかの詳細は本文未確認。"}}, {"id": "pr20", "rank": 20, "headline": "ペルソナ設定が下流の行動を本当に変えるか測る", "title": "AgentPersonaBench: Benchmarking Persona-Driven User Simulation", "url": "https://arxiv.org/abs/2610.04379", "authors": "Jintao Huang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Huang, J., Wang, Y., Shen, H., Lu, Y. D., Huang, S., Oh, M., Wang, Y., Mohsin, M. A., Xu, Z., Fan, Y., Yuan, Z., Bilal, A., Wei, Z., Jajee, S., Gagnier, H., Kapoor, S., Wang, J., Wen, Q., He, Y., … Hao, Y. (2026). AgentPersonaBench: Benchmarking Persona-Driven User Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04379", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ペルソナ設定がエージェントの実際の行動を忠実に方向づけるかを、観察できる行動だけで判定するベンチマークAgentPersonaBenchを作った。", "p3": "対象の特性を名指しせずに完全な架空プロフィールに埋め込み、調査・チャット・ウェブ・アプリの4つの場面での行動から特性への忠実度を確認した。2,460課題・867特性からなる（抄録）。", "p5": "20のモデル構成を評価し、上位モデルは指示なしで最大84.7%の課題を完全に通過したが、4場面すべてを通過したのは37.9〜64.3%にとどまり、複数の特性を同時に求めると保持が落ちた（抄録）。", "fun": "AIに「節約好きの人」を演じさせても、アンケートでは節約家らしく答えるのに、実際のネットショッピングの操作では散財するかもしれません。この研究は、口で言うことではなく行動で人物像を確かめる点が新しく、場面が変わると役になりきれない限界を示しました。", "unverified": "モデル別の結果と特性の種類別の差は本文未確認。"}}, {"id": "pr21", "rank": 21, "headline": "零空間射影でペルソナの部分空間を取り出し調整", "title": "Extracting Persona Subspaces Through Iterative Nullspace Projection For Modulation", "url": "https://arxiv.org/abs/2610.04676", "authors": "Ananya Malik ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Malik, A., & ElSherief, M. (2026). Extracting Persona Subspaces Through Iterative Nullspace Projection For Modulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04676", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMのペルソナを1本の方向ではなく多次元の部分空間として取り出し、再学習なしに強めたり弱めたりできる推論時の制御法PaSSを提案した。", "p3": "反復的零空間射影（Iterative Nullspace Projection, INLP）で、ペルソナに固有の方向を線形に繰り返し取り除きながら部分空間を抽出し、生成時の調整に使う（抄録）。", "p5": "6つのペルソナでMATH-500、GSM8K、IFEvalなどを用いて因果的に評価し、単一方向の加算法より大きな調整が内容の忠実さを保ったまま可能だった（抄録）。", "fun": "AIの「人格」は1本のつまみではなく、いくつものつまみが重なってできている、という発想です。一番目立つ方向を取り除くと、その下に隠れていた細かな特徴が見えてくるというのは、玉ねぎの皮をむくような解析で面白い点です。", "unverified": "具体的な改善幅とペルソナの例は本文未確認。"}}, {"id": "pr22", "rank": 22, "headline": "ペルソナ駆動の模擬で社会的に適応するLLMを学習", "title": "PB-GRPO: Learning Socially Adaptive LLM Agents from Persona-Driven Simulation with Preference-Batched GRPO", "url": "https://arxiv.org/abs/2610.04132", "authors": "Jingquan Wang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Wang, J., Yin, J., Han, X., Mei, Y., Hao, J., & Guo, B. (2026). PB-GRPO: Learning Socially Adaptive LLM Agents from Persona-Driven Simulation with Preference-Batched GRPO (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04132", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ペルソナを持つLLM利用者シミュレータとの会話を使い、社会的にふさわしく振る舞うエージェントを学習する後学習法PB-GRPOを提案した。", "p3": "ペルソナのライブラリ、LLMによる利用者シミュレータ、0〜1の満足度採点からなる環境で、選好の似た利用者の群ごとに正規化した優位度（advantage）を使うGRPOの変種で学習する（抄録）。", "p5": "模擬環境の中で、強い強化学習の基準手法より社会的な振る舞いが改善したと報告している（抄録）。具体的な数値は抄録にない。", "fun": "相手の本当の望みは言葉にされないことが多く、それを汲み取る力は会話を重ねないと身につきません。人の代わりに「いろいろな性格の模擬ユーザー」を大勢用意して練習させる発想は、実地研修の代わりにロールプレイを繰り返すのに似ています。", "unverified": "改善の数値と、模擬環境以外での評価の有無は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "LLM審査員の設計選択が評価結果を大きく左右する", "title": "How Much Do LLM-as-a-Judge Design Choices Matter? A Systematic Comparison of Prompt Designs, Rating Scales, and Models", "url": "https://arxiv.org/abs/2610.05094", "authors": "Laur\\`ene Vaugrante ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Vaugrante, L., & Hagendorff, T. (2026). How Much Do LLM-as-a-Judge Design Choices Matter? A Systematic Comparison of Prompt Designs, Rating Scales, and Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05094", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMを評価者（LLM-as-a-judge）に使うとき、プロンプト・評定尺度・モデルの選び方が判定をどれだけ変えるかを系統的に比べた。", "p3": "10の推論モデルで、文の感情と有害性の1〜7点評定（各カテゴリ500件超）と、質問回答の正誤の二値判定（600件）を、複数の設計で比較した（抄録）。", "p5": "評定は人の正解と平均絶対偏差0.11点の差にとどまり、正誤判定は平均96.5%正確だった。一方、評定尺度を変えるだけで測定上の偏りが最大0.93点動き、詳しいプロンプトで判定の甘さが28.9ポイント、モデルの変更で最大56.1ポイント下がった。最大の変動要因はモデルだった（抄録）。", "fun": "テストの採点者が変わると点数が変わるのは人間でもよくあることですが、AIの採点者でも同じことが起きます。全体としては信頼できても、物差しの目盛りや採点者を変えるだけで結論が変わりうる、という注意は、AIで研究を評価する時代に大切です。", "unverified": "モデル別の結果と各設計の詳細は本文未確認。"}}, {"id": "pr24", "rank": 24, "headline": "LLMが選好を代理する拡張民主主義の可能性と課題", "title": "Large Language Models and Augmented Democracy", "url": "https://arxiv.org/abs/2610.04412", "authors": "Jairo Gudi\\~no-Rosero", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Gudiño-Rosero, J. (2026). Large Language Models and Augmented Democracy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04412", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（博士論文）を使用", "preprint": true, "short": true, "p1": "市民や政党の選好を代理するLLMベースのデジタルツインを、拡張民主主義の仲介者として使う可能性と弱点を3つの研究で検討した博士論文。", "p3": "ブラジルのオンライン実験で個人の未知の政策への選好予測、スイス議会の立法記録から作った知識グラフと議員エージェントによる政党単位の熟議、英国の熟議実験データでのプロンプトインジェクション攻撃への頑健性を調べた（抄録）。", "p5": "抄録は各研究の設計を述べるが、具体的な数値結果は示していない。攻撃の効果が意見の分布や修辞戦略で変わること、検出・構造化・強化学習を組み合わせた防御を評価したことが述べられている（抄録）。", "fun": "一人ひとりの考えを代弁するAIの分身が議論に参加したら、民主主義はどう変わるでしょうか。便利な一方で、分身に悪意ある指示を紛れ込ませれば議論の結論をねじ曲げられるという弱点も同時に調べている点が、この研究の現実的なところです。", "unverified": "各研究の数値結果は本文未確認。"}}, {"id": "pr25", "rank": 25, "headline": "個人AIアシスタントの節約は売り手の適応で消える", "title": "Who Keeps the Gains from Personal AI Assistants? Seller Adaptation and the Unassisted in a Language-Model Market Simulation", "url": "https://arxiv.org/abs/2610.05823", "authors": "Haonan Huang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Huang, H., & Xiao, J. (2026). Who Keeps the Gains from Personal AI Assistants? Seller Adaptation and the Unassisted in a Language-Model Market Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05823", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "消費者の代わりに取引する個人AIアシスタントの節約効果が、売り手の適応後も残るか、未利用者に負担が移るかを言語モデル市場のシミュレーションで調べた。", "p3": "言語モデルが借り手・アシスタント・価格ツールを使う6つの売り手を演じる賃貸市場を作り、半数にアシスタントを与えた。売り手を固定した場合と適応させた場合を対にして比較した（30市場、抄録）。", "p5": "実行権限のあるアシスタントは売り手固定で利用者の支出を1日あたり13.7ドル減らしたが、売り手の適応で約3分の1が取り戻され8.7ドルになった。未利用者の支出変化は+0.4（信頼区間-0.6〜+1.3）で、予測された+3.6は再現しなかった（抄録）。", "fun": "便利な道具を一部の人だけが使うと、売り手は値付けを変えて対抗します。この研究はAIの店員とAIの客を大勢戦わせる「人工の市場」で、得をした分がどこへ流れるかを追跡しました。結果は予想と違い、使わない人の損はほとんど出ませんでした。", "unverified": "売り手の価格戦略の詳細と頑健性の確認は本文未確認。"}}, {"id": "pr26", "rank": 26, "headline": "オンラインレビューがアプリ導入の判断に与える影響", "title": "The Role of Online Reviews in Making Decisions About Installing Mobile Apps for Purchase", "url": "https://econpapers.repec.org/RePEc:zbw:esconf:343416", "authors": "Mahmić Muhić ほか", "venue": "RePEc NEP", "date": "2026-10-05", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用", "preprint": true, "short": true, "p1": "ボスニア・ヘルツェゴビナの利用者調査で、オンラインレビューが購買用モバイルアプリの導入判断にどう関わるかを調べた。", "p3": "モバイルアプリ利用者268人の調査で、アプリ評価におけるレビューの役割とレビューへの信頼が、購買用アプリを導入する判断を形づくるかを検討した（抄録）。", "p5": "抄録は、レビューが重要であることを示したと述べるが、効果の大きさなど具体的な数値は示していない（抄録）。", "fun": "アプリを入れる前に星の数やレビューを見る人は多いでしょう。レビューそのものだけでなく「そのレビューを信じられるか」が判断を左右するという視点は、口コミが信頼でできていることを思い出させます。", "unverified": "分析手法と係数の大きさは未確認（抄録に記載なし）。"}}, {"id": "pr27", "rank": 27, "headline": "投資家の私的情報は経営者の利益調整を抑えるか", "title": "Market Signal to Managers: Effect of Investors' Private Information on Earnings Management", "url": "https://doi.org/10.2139/ssrn.7556939", "authors": "Thu Vu ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Vu, T., & Stafylas, D. (2026). Market Signal to Managers: Effect of Investors’ Private Information on Earnings Management. https://doi.org/10.2139/ssrn.7556939", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "株価に外部投資家の私的情報が多く織り込まれている企業ほど、経営者の利益調整（earnings management）が少ないことを示した。", "p3": "情報トレードの確率（PIN）とその動的版（DPIN、SDPIN）で私的情報を測り、単一水準と多水準の回帰で利益調整との関係を推定した（抄録）。", "p5": "株価が外部投資家の私的情報を多く反映するほど利益操作は起きにくく、その影響は利益を上方に調整する場合で強かった（抄録）。", "fun": "株価は会社の成績表であると同時に、経営者にとっての「外からの監視の目」でもあります。投資家が独自に情報を集めて株価に反映させているほど、決算の数字をごまかしにくくなるという結果は、市場が経営者を規律づける仕組みを示しています。", "unverified": "標本の国・期間と効果の大きさは未確認（抄録に記載なし）。"}}, {"id": "pr28", "rank": 28, "headline": "ブロックチェーン導入で主要顧客の開示が変わる", "title": "Blockchain adoption and the disclosure of major customers", "url": "https://doi.org/10.2139/ssrn.7566246", "authors": "Jinkang Zhang ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Zhang, J., Ke, Y., & Qian, Y. (2026). Blockchain adoption and the disclosure of major customers. https://doi.org/10.2139/ssrn.7566246", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ブロックチェーンを導入した中国企業は、主要顧客の名前を自発的に開示しなくなることを示した。", "p3": "2016〜2022年の中国A株上場企業22,307企業年を用い、差の差、エントロピー・バランシング、ヘックマン法などで頑健性を確かめた（抄録）。", "p5": "導入は主要顧客の開示を有意に減らし、情報漏洩リスクと会計の透明性向上という2つの経路がともに確認された。開示の減少は資本市場の情報効率を損なわなかった（抄録）。", "fun": "新しい技術で会計が透明になると、かえって会社は「お得意様の名前」を言わなくなる、という逆説的な結果です。透明になった分だけ、わざわざ顧客名を明かして信用をアピールする必要が減るからだ、という説明は理屈として納得できます。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "テキストデータが経済測定に妥当となる条件", "title": "When Is Text Data Valid？", "url": "https://doi.org/10.2139/ssrn.7558778", "authors": "Weijia Wang", "venue": "SSRN", "date": "2026-10-05", "apa": "Wang, W. (2026). When Is Text Data Valid？. https://doi.org/10.2139/ssrn.7558778", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "文章から作った変数が経済測定に妥当となる条件を整理し、年次報告書のAI関連語の数え上げが誤った結論を生みうることを示した。", "p3": "テキスト変数を潜在構成概念のノイズ入りで操作されうる信号とみなす測定モデルで文献を整理し、年次報告書のAIキーワードと採用の関係に合わせたシミュレーションを行った（抄録）。", "p5": "効果が大きくても、キーワード数は情報を持たないか符号が逆になりうる一方、特許数では検出できた。開示がわずか数%戦略的に反応するだけで足りる。文脈を考える分類、独立の第二の指標、手作業の検証標本で大半を回復できた（抄録）。", "fun": "報告書に「AI」と何回書いたかで、その会社のAI活用度を測れるでしょうか。会社が流行語を少し多めに書くだけで、測定は役に立たなくなるどころか逆の結論にもなりうる、という指摘は、文章データを使う研究者への重要な警告です。", "unverified": "シミュレーションの詳細な設定は本文未確認。"}}, {"id": "pr30", "rank": 30, "headline": "事前学習済みPFNを表形式の異常検知に適応", "title": "Adapting prior-data fitted networks for tabular anomaly detection", "url": "https://arxiv.org/abs/2610.06693", "authors": "Maximilian Bershtman ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Bershtman, M., & Cohen, N. (2026). Adapting prior-data fitted networks for tabular anomaly detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06693", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式データ向けの事前学習モデル（prior-data fitted networks, PFN）の内部表現を、表形式データの異常検知に転用する方法を示した。", "p3": "凍結したTabPFNの特徴で近傍への距離を異常度とする方法（ZEN）と、正常を定める参照集合で微調整して特徴を分けやすくする方法（FOCUS）を提案し、どの層を使うかも調べた（抄録）。", "p5": "ADBenchで、微調整なしのZENが全基準手法より高い平均AUROCを示し、微調整したFOCUSはさらに改善した。他のPFNモデルにも一般化した（抄録）。", "fun": "画像では強力な事前学習モデルが異常発見に役立ってきましたが、表のデータでは同じことが難しかった。表専用に大量の人工データで学んだモデルの「中身の特徴」を借りるだけで、異常が近所から浮いて見えるようになる点が面白いところです。", "unverified": "AUROCの具体的な値は未確認（抄録に記載なし）。"}}, {"id": "pr31", "rank": 31, "headline": "差分プライバシーと準同型暗号で反実仮想説明を保護", "title": "PrivDiCE: Privacy-Preserving Actionable Counterfactual Explanations with Differential Privacy and Homomorphic Encryption", "url": "https://doi.org/10.2139/ssrn.7571295", "authors": "Viet-Nhat Nguyen ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Nguyen, V.-N., Tran, A.-T., Luong, T.-D., & Huynh, V.-N. (2026). PrivDiCE: Privacy-Preserving Actionable Counterfactual Explanations with Differential Privacy and Homomorphic Encryption. https://doi.org/10.2139/ssrn.7571295", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "差分プライバシーと準同型暗号を組み合わせ、機微なデータでも実行可能な反実仮想説明（counterfactual explanation）を作る枠組みPrivDiCEを提案した。", "p3": "差分プライバシー付きの生成モデルと意味的制約、疎で多様で実行可能な候補を探す探索を使い、予測モデルによる候補の評価はCKKS方式の準同型暗号で保護する（抄録）。", "p5": "Leipzig ECG、Heart+、MIMIC-IVで評価し、ε約4でLeipzig ECGとMIMIC-IVではほぼ全件で反実仮想が得られた。メンバーシップ推論のAUCは0.4988〜0.5052で偶然並み、暗号下の推論は平文と100%一致した（抄録）。", "fun": "「何をどう変えれば審査に通ったか」を示す説明は役に立ちますが、その説明から元の個人データが漏れては困ります。データにわざと雑音を混ぜる方法と、暗号のまま計算する方法を組み合わせ、説明の分かりやすさと秘密の保護を両立させた点が工夫です。", "unverified": "Heart+での具体的な性能低下の大きさは本文未確認。"}}, {"id": "pr32", "rank": 32, "headline": "分位点を考慮した拡散モデルで極端な不均衡を補う", "title": "Usefulness of Quantile-Aware Diffusion Modeling for Highly Imbalanced Tabular Data", "url": "https://arxiv.org/abs/2610.05825", "authors": "Abu Talha ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Talha, A., Liu, P., & Paul, S. (2026). Usefulness of Quantile-Aware Diffusion Modeling for Highly Imbalanced Tabular Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05825", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "極端に不均衡な表形式データで少数クラスを補う合成データ生成に、分位点損失を加えた拡散モデルQuantile-TabDDPMを提案した。", "p3": "通常の二乗誤差のノイズ除去目的に分位点損失の項を加え、稀で極端な値と少数クラスの特徴を捉えるようにした（抄録）。", "p5": "極端に不均衡な実際のクレジットカード取引データで評価し、不正検知に頑健で有効な枠組みになったと報告している。具体的な数値は抄録にない（抄録）。", "fun": "不正な取引は全体のごく一部しかなく、AIは「全部正常」と答えるだけで高い正解率になってしまいます。珍しい例を人工的に増やすとき、平均だけでなく分布の端（めったに起きない値）を意識して学ばせる工夫がこの研究の要点です。", "unverified": "評価指標と比較手法の結果は未確認（抄録に記載なし）。"}}, {"id": "pr33", "rank": 33, "headline": "都市高速道路の分断と蓋かけ公園による関係回復", "title": "Concrete Barriers, Fractured Lives: Urban Highway Fragmentation and the Restorative Potential of Third Places Through Freeway Lids", "url": "https://doi.org/10.5281/zenodo.23180123", "authors": "Vinay, Prithvi", "venue": "Zenodo", "date": "2026-10-06", "apa": "Vinay, P. (2026). Concrete Barriers, Fractured Lives: Urban Highway Fragmentation and the Restorative Potential of Third Places Through Freeway Lids. Zenodo. https://doi.org/10.5281/ZENODO.23180123", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（叙述的レビュー）を使用", "preprint": true, "short": true, "p1": "都市の高速道路が社会的孤立の物理的な原因になっていると論じ、高速道路に蓋をして公園にする「フリーウェイ・リッド」で関係を回復する条件を整理した叙述的レビュー。", "p3": "社会的孤立の疫学、米国州間高速道路の歴史と経済、サードプレイスの社会学、リッドとグリーン・ジェントリフィケーションの計画研究を統合した（抄録）。", "p5": "統合解析では孤立は全死亡率の約30%上昇と関連し、州間高速道路の建設は1957〜1977年に47.5万世帯超を立ち退かせた。2025年の研究では大都市50すべてで道路をまたぐ人間関係が期待より少なかった。立ち退き対策のないリッドは地域を散らしうるとして、公平なリッドの5条件を示した（抄録）。", "fun": "道路は人や車をつなぐためのものなのに、街の真ん中を通ると人と人の関係を切ってしまいます。その上に公園を作れば再びつながれる、という発想は単純ですが、公園ができると家賃が上がって元の住民が住めなくなる、という落とし穴まで考えている点が面白いところです。", "unverified": "5条件の具体的な内容は本文未確認。"}}, {"id": "pr34", "rank": 34, "headline": "ラホールの高齢者で家族支援が健康管理を左右する", "title": "Family support, health outcomes and the management of geriatric conditions among older adults in Lahore, Pakistan: A cross- sectional study", "url": "https://doi.org/10.21203/rs.3.rs-11269059/v1", "authors": "Hina Khan¹ ほか", "venue": "Research Square (In Review)", "date": "2026-10-06", "apa": "Khan¹, H., & Akhtar¹, K. (2026). Family support, health outcomes and the management of geriatric conditions among older adults in Lahore, Pakistan: A cross- sectional study. https://doi.org/10.21203/rs.3.rs-11269059/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "パキスタン・ラホールの60歳以上325人の調査で、家族による支援が高齢者の健康と老年期の状態の管理にどう関わるかを調べた。", "p3": "2025年6〜12月に家庭・地域・宗教行事・施設で面接調査を行い、探索的因子分析、構造方程式モデル、二項ロジスティック回帰で分析した（抄録）。", "p5": "因子分析で4領域14次元が得られた。機能的自立と情緒的な健康が晩年の健康と最も強く関連し、家族との同居と定期的な連絡は孤独の低いオッズと関連した（抄録）。", "fun": "日本でも「家族が介護の中心」という考え方は根強くありますが、それを実際の健康との関係で測った研究は国によっては多くありません。家族と一緒に住み、よく話すことが孤独を減らすという結果は当たり前に見えて、政策の根拠を作るには数字で示す必要があるのです。", "unverified": "効果の大きさ（オッズ比）は未確認（抄録の結果部分が欠けている）。"}}, {"id": "pr35", "rank": 35, "headline": "中国の高齢ネット利用者を5つのペルソナに分類", "title": "What Are Older Internet Users Like? Investigating the Personas of Older Chinese Internet Users Using Two-Step Cluster Analysis", "url": "https://doi.org/10.21203/rs.3.rs-10176802/v1", "authors": "Xu Zhou ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Zhou, X., & Zhong, R. (2026). What Are Older Internet Users Like? Investigating the Personas of Older Chinese Internet Users Using Two-Step Cluster Analysis. https://doi.org/10.21203/rs.3.rs-10176802/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の高齢インターネット利用者5,863人を、利用の頻度・熟練度・幅・水準で5つのペルソナに分類した。", "p3": "2023年の中国高齢社会縦断調査（CLASS）のデータに2段階クラスター分析を適用した（抄録）。", "p5": "周辺的利用者（14.8%）、慎重な試し利用者（35.7%）、活発な主流利用者（35.4%）、統合的先駆者（8.8%）、制約された意欲者（5.3%）の5類型が得られ、年齢・学歴・健康・就業・所得・社会的ネットワーク・地域・セキュリティ意識で異なった（抄録）。熟練度は全体に高くなかった。", "fun": "「お年寄りはネットが苦手」とひとまとめにされがちですが、実際は使いこなす人から使いたくても使えない人まで、少なくとも5つのタイプがあるという結果です。タイプごとに必要な支援が違うので、一律の講習会では届かない人がいることが分かります。", "unverified": "なし"}}, {"id": "pr36", "rank": 36, "headline": "職場の偶然の出会いは給湯室とプリンタで起きる", "title": "The pantry, the printer, and the desk: sensing where workplace serendipity really happens", "url": "https://doi.org/10.21203/rs.3.rs-10276716/v1", "authors": "Lingzi Pan ほか", "venue": "Research Square (In Review)", "date": "2026-10-06", "apa": "Pan, L., Jin, Y., & Hu, Y. (2026). The pantry, the printer, and the desk: sensing where workplace serendipity really happens. https://doi.org/10.21203/rs.3.rs-10276716/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "建築設計事務所のオフィスを分単位のセンサで1か月計測し、偶然の対面交流（serendipity）がどこで起きるかを示した。", "p3": "中国の大手建築設計事務所で、共用空間と机の領域の在席を分単位で連続計測し、2,800件超の交流エピソードを記録した。同じ職場で空間の価値に関する従業員調査も行った（抄録）。", "p5": "給湯室ではリズムのある中程度に持続する交流が生じ、印刷エリアは短い事務的な同席にとどまり、机の周辺では長い課題志向の協働が起きた。給湯室は交流だけでなく一人で考え回復する場としても評価された（抄録）。", "fun": "会社のアイデアはどこで生まれるのでしょう。センサで実際に測ると、コピー機の前の立ち話より給湯室の方が交流が続き、しかも給湯室は「一人になれる場所」としても大事だと分かりました。空間の使われ方を数字で見ると、思い込みとは違う姿が見えてきます。", "unverified": "交流の定義とセンサの具体的な仕様は本文未確認。"}}, {"id": "pr37", "rank": 37, "headline": "AIは使う量より成果志向の使い方で生産性が決まる", "title": "From Token-Max to Outcome-Max: How You Use AI Determines Its Productivity", "url": "https://arxiv.org/abs/2610.05697", "authors": "Chen Xu ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Xu, C., Liu, M., Li, B., & Xiong, C. (2026). From Token-Max to Outcome-Max: How You Use AI Determines Its Productivity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05697", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AIをたくさん使っても生産性が比例して上がらない理由の一つを「トークン最大化」と名づけ、検証された成果を費用で割って報いる「成果最大化」を提案した。", "p3": "即時の対話、長期の行動適応、組織での協働の3段階のシミュレーション枠組みで二つの目的を比較し、成果最大化に誘因を合わせる仕組みOutcomeShareを理論とシミュレーションで分析した（抄録）。", "p5": "3段階すべてで、成果最大化は検証済みの課題成績をほぼ保ちながらAI支援の生産効率を高めた。OutcomeShareは参加を促し、従業員・企業・LLM提供者に共有の利益を生みうる（抄録）。数値は抄録にない。", "fun": "「たくさん勉強した時間」で評価すると、だらだら長く机に向かう人が得をしてしまいます。AIでも、使った計算量を努力とみなすと無駄に考えすぎるので、「確かめられた成果」で評価しよう、という提案です。AIの生産性は性能だけでなく評価の仕方で決まる、という視点が面白い点です。", "unverified": "シミュレーションの具体的な設定と効果の大きさは未確認。"}}, {"id": "pr38", "rank": 38, "headline": "職場の行動センシングと説明可能な幸福フィードバック", "title": "TrustmeWatcher: An Application for Workplace Micro-Sensing and Explainable Well-Being Feedback", "url": "https://arxiv.org/abs/2610.06657", "authors": "Chengyu Yu ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Yu, C., Costa, L. J., Anžur, Z., Li, M., Slapničar, G., Kirilenko, D., Gjoreski, M., Luštrek, M., & Langheinrich, M. (2026). TrustmeWatcher: An Application for Workplace Micro-Sensing and Explainable Well-Being Feedback (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06657", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "パソコンの操作記録と短い質問紙を結びつけ、職場の幸福感を予測して説明つきで本人に返すアプリTrustmeWatcherを開発した。", "p3": "ActivityWatchの操作記録収集を再利用し、画面時間のダッシュボード、StreamDeckでの質問紙回答、動画の要約表示を統合した。記録と自己報告を対応づけて学習し、6つの状態得点と総合的な幸福得点を手元のモデルで予測する（抄録）。", "p5": "説明可能AIで予測の根拠を示し、カメラと視線計測の一時停止などのプライバシー制御も備える。17人の参加者の記録での運用を記述している（抄録）。予測精度の数値は抄録にない。", "fun": "自分の働き方のデータから「今日は疲れていそう」と予測するAIが、なぜそう判断したかまで説明してくれる仕組みです。監視の道具にもなりうる技術を、本人に結果を返し、カメラを止める権利も渡す形で作ろうとしている点が考えどころです。", "unverified": "予測精度は未確認（抄録に記載なし）。"}}, {"id": "pr39", "rank": 39, "headline": "人とAIの協働度を開示する5段階評価の提案", "title": "The Reported Engagement with AI Level (REAL) Rating: A Framework for Disclosing Human-AI Collaboration", "url": "https://arxiv.org/abs/2610.04021", "authors": "Im\\`ene Goumiri ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Goumiri, I., Cortez-Rodriguez, M., Bell, E., & Muyskens, A. (2026). The Reported Engagement with AI Level (REAL) Rating: A Framework for Disclosing Human-AI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04021", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "作品や製品にAIがどれだけ関わったかを0〜5の6段階で開示する評価枠組みREALを提案した。", "p3": "人が作ったかAIが作ったかの二択や、利用者に見えにくい電子透かしに頼る現行の開示に代え、制作と利用体験の両面でのAIの関与を段階で示す仕組みを設計した（抄録）。", "p5": "文章・画像・音声・動画・ソフトウェアへの適用方法を具体的に示した。実証的な評価結果は抄録にない（抄録）。", "fun": "映画の年齢制限のように、AIの関わり方にも段階表示があれば、受け手は判断しやすくなります。「全部人間」か「全部AI」かでなく、その間にある多くの使い方を区別しようという発想は、AIと人の共同作業が当たり前になる時代に必要な物差しです。", "unverified": "各段階の具体的な定義は本文未確認。"}}, {"id": "pr40", "rank": 40, "headline": "手話通訳者はAI導入の境界をどう引くか", "title": "“Safe for now?” Boundary work and tensions of AI Adoption in Sign Language Interpreting and Speech-to-Text Reporting in Belgium and the Netherlands", "url": "https://doi.org/10.31235/osf.io/vwgc3_v2", "authors": "Maartje De Meulder ほか", "venue": "SocArXiv", "date": "2026-10-06", "apa": "De Meulder, M., Gebruers, K., & Giustini, D. (2026). “Safe for now?” Boundary work and tensions of AI Adoption in Sign Language Interpreting and Speech-to-Text Reporting in Belgium and the Netherlands. https://doi.org/10.31235/osf.io/vwgc3_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベルギー（フランデレン）とオランダの手話通訳者と文字通訳者が、AIによる言語技術を職業生活の中でどう捉え、境界を引いているかを調べた。", "p3": "2025年のオンライン調査（N=134）を、境界作業（boundary work）の理論で分析した（抄録）。", "p5": "予想される混乱と現在の安定が共存する時間の緊張、AIが選択肢を広げる一方で「十分な情報保障」の定義を狭める緊張、生活を脅かす技術が職業の理念を進めもする職業的アイデンティティの緊張の3つが見いだされた。AIを第三の当事者とみなし、編集や品質管理への役割移行が報告された（抄録）。", "fun": "自動の文字起こしが進むと、文字通訳の仕事は減るかもしれません。でも手話はAIの学習データが少ないため、まだ守られている。同じ「通訳」でも技術との距離が違い、AIが聴覚障害者の情報保障を広げる一方で専門家の仕事を脅かすというねじれが、具体的な声から見えてきます。", "unverified": "なし"}}, {"id": "pr41", "rank": 41, "headline": "計測報告をデジタルツインに渡す監査可能な契約", "title": "Auditable Handoff of Declared Measurement Reports to Digital Twins: A Purpose-Specific Admission Contract", "url": "https://doi.org/10.2139/ssrn.7571327", "authors": "Atsushi Otsuka", "venue": "SSRN", "date": "2026-10-06", "apa": "Otsuka, A. (2026). Auditable Handoff of Declared Measurement Reports to Digital Twins: A Purpose-Specific Admission Contract. https://doi.org/10.2139/ssrn.7571327", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "計測報告をデジタルツインに渡すとき、形式が正しいだけでなく目的に照らして受け入れてよいかを判定する、監査可能な受け渡し契約を提案した。", "p3": "送り手の宣言に受け手側の受け入れ判定を加え、報告の同一性・記述上の差・不確かさで正規化した比較を区別する有限の規則を定めた。証拠が欠ければ保留、宣言が矛盾すれば遮断する（抄録）。", "p5": "公開のGNSSとUWBの再生データで、形式上は正しい契約でも、時刻の宣言の不一致は評価を遮断し、時刻規則の欠落は保留になるなど、結果が分かれた。これらは仕様への適合の確認であり、測位性能の結果ではないと明記している（抄録）。", "fun": "データが「正しい形式」で届いても、それを別のデータと比べてよいとは限りません。時刻の基準が違えば比較は意味を失います。データを受け取る側に門番を置き、怪しいものは止めたり保留したりする仕組みは、地味ですがデジタルツインの信頼性の土台です。", "unverified": "規則の全体と実装の詳細は本文未確認。"}}, {"id": "pr42", "rank": 42, "headline": "SDE由来カーネルの半分離構造で推定を高速化", "title": "On the Sequentially Semiseparable Structure of SDE-Induced Kernels and Efficient Algorithms for Kernel-Based Estimation Problems", "url": "https://arxiv.org/abs/2610.05856", "authors": "Mikkel Paltorp ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Paltorp, M., Caglio, L., Chen, T., Katsanos, E., & Andersen, M. S. (2026). On the Sequentially Semiseparable Structure of SDE-Induced Kernels and Efficient Algorithms for Kernel-Based Estimation Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05856", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形時不変の確率微分方程式（SDE）から導かれるカーネルの共分散行列が持つ逐次半分離（SSS）構造を使い、ガウス過程回帰やカーネル正則化の計算を線形時間で行う再帰アルゴリズムを導いた。", "p3": "カルマンフィルタと平滑化で潜在状態を扱う従来の線形時間法に代え、観測共分散行列のSSS表現を直接使い、分解・求解・対数行列式・事後共分散・周辺尤度の勾配・事後標本生成を再帰的に計算する（抄録）。", "p5": "対象のカーネルには半整数の滑らかさのMatérnカーネル、スプラインカーネル、システム同定で使われるカーネルが含まれ、同じ再帰がシステム同定のカーネル正則化にも少しの修正で拡張できる（抄録）。数値実験の結果は抄録にない。", "fun": "ガウス過程回帰はデータ数の3乗に比例して計算が重くなるのが弱点です。カーネルが「ばね・ダンパの方程式」のようなSDEから作られていると、行列が特別な形をしていて、データ数に比例する時間で計算できる、という数学の構造を生かした工夫です。", "unverified": "計算時間の比較などの数値結果は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "低軌道GNSSコンステレーションでPPPの収束が速まる", "title": "Pulsar Constellation Evolution and PPP Convergence using LEO GNSS", "url": "https://arxiv.org/abs/2610.06759", "authors": "Claire Mah ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Mah, C., Marathe, T., Vishwanath, A., Gala, M., Reid, T. G. R., & Bader, Q. (2026). Pulsar Constellation Evolution and PPP Convergence using LEO GNSS (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06759", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "低軌道（LEO）の専用GNSS衛星群Pulsarを例に、LEO衛星が測位・航法・時刻にもたらす影響と、評価方法の選び方を論じた。", "p3": "展開段階の異なる4つの構成で、GPS単独・LEOで補強したGPS・LEO単独を、可視性、精度劣化係数（DOP）、精密単独測位（PPP）の収束で比較した（抄録）。", "p5": "抄録は比較の枠組みを述べるが、収束時間などの具体的な数値は示していない（抄録）。", "fun": "GPS衛星は約2万km上空を回りますが、低軌道の衛星はもっと近くを速く動くため、空の見え方が短時間で大きく変わります。その速さが精密な測位の「立ち上がり」を早める可能性があり、従来の評価方法をそのまま使ってよいかまで考えている点が面白いところです。", "unverified": "PPP収束の数値結果は未確認（抄録に記載なし）。"}}, {"id": "pr44", "rank": 44, "headline": "地盤のクリープから破壊への遷移を動態で予測", "title": "Forecasting Geotechnical Regime Shifts by Modelling System Dynamics over Static States", "url": "https://doi.org/10.2139/ssrn.7570484", "authors": "Ali Hadi Shujaie ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Shujaie, A. H., Xu, W., Emani, F. G., & Twite, F. N. (2026). Forecasting Geotechnical Regime Shifts by Modelling System Dynamics over Static States. https://doi.org/10.2139/ssrn.7570484", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "地すべりがゆっくりしたクリープから加速破壊へ移る転換を予測するため、外力・水理力学応答・変形を因果的に結ぶ物理情報付きの枠組みLPIHCを提案した。", "p3": "密なセンサ配置がニューラルネットに不安定化の過程ではなく静的な代理変数を学ばせる「位置のおとり効果」を指摘し、中国・周家地すべりの10年の監視記録で時系列順の分割により検証した（抄録）。", "p5": "相関に基づく10の基準モデルはすべて検証のR²が負で、深層モデルは-2.98〜-4.95、従来手法では-2262まで下がった。LPIHCを組み込むと外挿性能が大きく改善し、双方向LSTMが最良だった（抄録）。", "fun": "センサが多いほど予測は良くなりそうですが、AIが「どの場所のセンサか」という手がかりに頼り、崩れる仕組みそのものを学ばないことがあります。テストで決定係数が大きくマイナスになる、つまり平均値で当てるより悪いという結果は、過去にない加速を当てる難しさを物語ります。", "unverified": "LPIHCを使ったときの誤差の具体的な値は抄録の途中で切れており未確認。"}}, {"id": "pr45", "rank": 45, "headline": "DEMと多体動力学の連成で多脚ロボットの粒状地歩行", "title": "A Coupled DEM--MBD Framework for High-Fidelity Simulation of Multi-legged Robot Locomotion on Granular Terrain", "url": "https://doi.org/10.21203/rs.3.rs-10722145/v1", "authors": "Kaiming Zhang ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Zhang, K., Yu, Y., Song, Z., Xie, J., Peng, K., & Wang, Q. (2026). A Coupled DEM--MBD Framework for High-Fidelity Simulation of Multi-legged Robot Locomotion on Granular Terrain. https://doi.org/10.21203/rs.3.rs-10722145/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "粒状の地面の上を転がる12脚の球形ロボットについて、個別要素法（DEM）と多体動力学（MBD）を双方向に連成するシミュレーション枠組みを作った。", "p3": "地面を球形粒子のDEMで、ロボットを三角形分割した足裏を持つ拘束多体系で表し、法線・接線・転がり・ねじりの抵抗を含む粒子-面要素の接触定式化を導入した。格子による接触探索、同期した陽解法、GPU並列で計算する（抄録）。", "p5": "古典的なDEMとMBDの検証問題と全体の走行シミュレーションで、ロボットの軌跡と地盤の支持の変化をともに捉えられることを示した（抄録）。数値の誤差は抄録にない。", "fun": "砂浜を歩くと足が沈み、砂が動いて歩き方も変わります。ロボットと砂粒の一つひとつが押し合う様子を同時に計算することで、「地面は動かない」という仮定なしに走行を予測できるようにした点が、この研究の挑戦です。", "unverified": "検証での誤差の大きさは未確認。"}}, {"id": "pr46", "rank": 46, "headline": "等幾何解析とKANを組み合わせたPDE順逆解析", "title": "IGA-KAN: Isogeometric Analysis with Physics-Informed Closed-Form Kolmogorov-Arnold Networks for Forward and Inverse PDEs", "url": "https://arxiv.org/abs/2610.06348", "authors": "Sima Naraghi ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Naraghi, S., Parand, K., Sadr, A., & Rahmati, D. (2026). IGA-KAN: Isogeometric Analysis with Physics-Informed Closed-Form Kolmogorov-Arnold Networks for Forward and Inverse PDEs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06348", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "等幾何解析（IGA）の解を、閉形式で当てはめた局所的なコルモゴロフ・アーノルド・ネットワーク（KAN）で補正し、未知数を増やさずに精度を高める方法IGA-KANを提案した。", "p3": "IGAのガラーキン解を求めたあと、各節点パッチで方程式の強形式・境界値・IGA解にKAN型のリッジモデルを線形最小二乗で当てはめ、IGAの帽子関数で混ぜ合わせる。最大値原理に基づく事後の安全装置で局所モデルを使う場所を決める（抄録）。", "p5": "厳密解のある8つの問題で、IGAの誤差をL²で4.2〜90倍、H¹で4.1〜220倍減らし、同じ予算でゼロから学習したKANよりL²誤差が6〜6×10⁴倍小さかった。逆問題では未知の一定の源をIGAより167倍正確に復元した（抄録）。", "fun": "AIで方程式を解く研究は、従来の数値解法を置き換えようとしてかえって精度を落とすことが多くありました。この研究は逆に、従来の解を土台にして、AIを「仕上げの微調整」にだけ使います。しかも学習を連立一次方程式で一発で解くので、試行錯誤の学習が要らない点が巧みです。", "unverified": "なし"}}, {"id": "pr47", "rank": 47, "headline": "超弾性材料の幾何学的厳密平面梁の有限要素", "title": "On finite elements for geometrically-exact planar beams with hyperelastic material models", "url": "https://arxiv.org/abs/2610.05231", "authors": "Abhishek Ghosh ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Ghosh, A., Kadapa, C., Peric, D., & Hossain, M. (2026). On finite elements for geometrically-exact planar beams with hyperelastic material models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05231", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "幾何学的に厳密な平面梁の有限要素に、超弾性の材料モデルを一貫して組み込む枠組みを作った。", "p3": "幾何学的非線形の3場の梁モデルに、面内の厚さ方向の変形を許す追加の場を加え、面外方向は平面ひずみと平面応力の構成則の縮約で別に扱った（抄録）。", "p5": "平面応力ではポアソン比を変えても中心線の変形がほぼ一致したが、文献で広く使われる平面ひずみではポアソン比との連成に敏感で、大きいポアソン比で梁が著しく硬くなった。サンブナン・キルヒホッフとネオフック模型は全体変形でよく一致した（抄録）。", "fun": "梁を「線」として扱う簡単なモデルに、ゴムのような柔らかい材料の性質を入れると、どの方向の変形を許すかという小さな仮定の違いで、梁の硬さが大きく変わってしまいます。教科書でよく使われる仮定が、実は結果をゆがめうるという指摘が面白い点です。", "unverified": "硬化の具体的な倍率は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "ラベル不要のPINNで空間変動斜面の信頼性を評価", "title": "Label-free physics-informed strength reduction and a neural operator for the reliability of spatially variable slopes", "url": "https://arxiv.org/abs/2610.04828", "authors": "Apisit Robjanghvad ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Robjanghvad, A., & Youwai, S. (2026). Label-free physics-informed strength reduction and a neural operator for the reliability of spatially variable slopes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04828", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "正解データなしで学習する物理情報ニューラルネットワーク（PINN）で強度低減法を解き、空間的にばらつく斜面の破壊確率を有限要素解なしで求める流れを作った。", "p3": "非関連流れ則のモール・クーロン塑性を仮想仕事の損失で有限要素メッシュ上に学習し、多数のランダム場をGPUで同時に解く。PINNの解だけで作用素ネットワークを学習し、100万個の場の安全率と破壊モードを数秒で予測する（抄録）。", "p5": "52のランダム場でAbaqusの安全率を二乗平均2〜3%で再現した。モンテカルロ・FORM・重点サンプリング・作用素は破壊確率10⁻³まで整合したが、安全率の3%のばらつきで10⁻³の確率が最大2倍に膨らんだ。ビショップ法は破壊確率を2.6倍と8.3倍低く見積もった（抄録）。", "fun": "斜面の土の強さは場所ごとにばらつくので、崩れる確率を出すには何千、何万通りの計算が必要です。AIに物理の法則だけを教えて一気に解かせると、計算は劇的に速くなります。一方で、安全率のわずかな誤差が「めったに起きない崩壊」の確率を大きく変えるという注意も示しています。", "unverified": "なし"}}, {"id": "pr49", "rank": 49, "headline": "パラメトリックDMDと誤差学習で脈動乱流を縮約", "title": "Parametric Dynamic Mode Decomposition with Sparse DNS-Informed Discrepancy Learning for Pulsatile Turbulent Pipe Flow", "url": "https://doi.org/10.21203/rs.3.rs-11015233/v1", "authors": "Yacine Addad ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Addad, Y., Cammi, A., & Choi, Y. J. (2026). Parametric Dynamic Mode Decomposition with Sparse DNS-Informed Discrepancy Learning for Pulsatile Turbulent Pipe Flow. https://doi.org/10.21203/rs.3.rs-11015233/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "脈動する管内乱流の壁面せん断の予測で、RANSの縮約モデルを少数の直接数値計算（DNS）から学んだ補正で直すパラメトリック動的モード分解（pDMD）の枠組みを作った。", "p3": "位相分解したRANS計算を固有直交分解（POD）と複素DMDで縮約し、疎なDNSから壁面せん断の伝達関数の誤差を学習してパラメータ空間で補間し、未知の運転条件の振幅と位相を補正する（抄録）。", "p5": "4件のDNSだけで、壁面せん断の振幅誤差を約10〜15%からDNSと一致する水準まで下げた。脈動パラメータの3%の不確かさは狭い予測区間にとどまった（抄録）。", "fun": "精密だが高価な計算（DNS）と、安いがずれる計算（RANS）のいいとこ取りをする工夫です。高価な計算はたった4回だけ行い、そこから「安い計算のずれ方」を学んで他の条件にも当てはめる。少ない手本から誤差の癖を覚える点が賢いところです。", "unverified": "なし"}}, {"id": "pr50", "rank": 50, "headline": "多面体スケールド境界要素で3次元亀裂進展を解く", "title": "A polyhedral scaled boundary concept applied to finite-strain hyperelasticity and three-dimensional crack growth simulations", "url": "https://doi.org/10.2139/ssrn.7570608", "authors": "Emilia Oheim ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Oheim, E., Sevindik, J., Sauren, B., & Klinkel, S. (2026). A polyhedral scaled boundary concept applied to finite-strain hyperelasticity and three-dimensional crack growth simulations. https://doi.org/10.2139/ssrn.7570608", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "多面体メッシュ上で3次元の亀裂進展と有限ひずみの非線形解析を行う、等パラメトリックなスケールド境界要素の定式化を示した。", "p3": "八分木・ハニカム・ボロノイのメッシュに定式化を組み込み、亀裂先端の特異性を表す1/4点の3次元亀裂前縁要素を作った。混合モードの応力拡大係数を変位解から直接求め、進展方向を決める（抄録）。", "p5": "亀裂前縁要素は多面体要素と容易に結合でき、傾いた非平面の亀裂前縁を含む局所的な位相変化を扱えた。破壊パラメータの正確な評価、頑健な亀裂経路の予測、効率的な計算を示した（抄録）。数値は抄録にない。", "fun": "ひびが伸びるたびにメッシュを全部作り直すのは大変です。多面体の要素を使うと、ひびの周りだけ細かくしたり形を変えたりが楽になります。ひびの先端という「応力が無限に大きくなる点」を特別な要素で表す工夫と組み合わせた点がこの研究の要です。", "unverified": "精度の数値は未確認（抄録に記載なし）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "強化学習はLLMの推論をどう作り変えるか", "title": "How RL Reshapes LLM Reasoning: Transferability, Coverage, and Scaling Laws", "url": "https://arxiv.org/abs/2610.04158", "authors": "Ziheng Cheng ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Cheng, Z., Huang, Y., Zhu, H., & Sojoudi, S. (2026). How RL Reshapes LLM Reasoning: Transferability, Coverage, and Scaling Laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04158", "why": "数学で鍛えた推論が他領域に移る一方で広がりが限られるという矛盾した報告を、転移性・網羅性・スケーリング則の観点で整理し直した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2の実験と観察、§3の推論経路の分析と2段階モデル、§6.1の計算量のスケーリング則、§8の結論）を読んだ。§4〜5の定理の証明は未読", "preprint": true, "p1": "数学で強化学習（RL）したLLMが他分野で伸びたり忘れたりし、Pass@1が上がってもPass@Nが下がる、という一見矛盾する報告を、「どの解き方（戦略）を選ぶか」の分布の変化として統一的に説明した。", "p2": "RLはLLMの推論の限界を広げるのか、既にある推論の重みを付け替えるだけなのか。先行研究の証拠は食い違っていた（抄録、§1）。", "p3": "Qwen3-14B-BaseとGemma-3-12B-ITを4.8万問の数学（一部はコードを追加）でGRPOにより200ステップ学習し、SFTと比べた（§2.1）。解答の推論経路を比較し（§3.1）、推論を「戦略zの選択」と「戦略に条件づけた答えyの生成」に分ける2段階の自己回帰方策 π(z,y|x)=π_θ(z|x)π_w(y|x,z) を置いて（式3.1）、RLの暗黙のバイアスが戦略の好みをどう変えるかを理論的に示した（§4〜5）。", "p4": "数学・コード・知識と計画・一般能力のベンチマークで、基準モデルからの変化、Pass@Nの被覆、推論経路の数と新しさを測り、計算量に対する対数シグモイド則と対数線形則を約2倍の計算量まで外挿して当てはまりを検証した（§2、§6.1）。", "p5": "RLは分野内では一貫して改善したが、分野外の変化は学習データと基準モデルで逆向きにもなった（図1）。最も多いのはPass@1が上がりPass@1024が下がる型で、基準モデルの成功が稀なBoxNetではPass@1が3.8%→9.9%、Pass@1024が34.0%→51.0%と両方上がった（§2.3、図2）。RL後は1問あたりの経路数が3.24→2.66に減る一方、12.7%の応答は基準の16応答にない経路を使った（§3.1.2、図3）。スケーリング則は当てはめ区間でR²>0.99で、数学分野の外挿は信頼できたがコードと計画は不安定だった（§6.1、図4）。", "p6": "戦略の共有ライブラリを仮定した線形ソフトマックスの単純化モデルでの理論であり、経路の分類はLLMによる抽出に依存する（§3.1.1、付録E）。解釈：数学で学ぶ例が中心で、価値判断や対話的課題での戦略選択への一般化は未検証。", "fun": "問題を解くとき、人は「どの解き方でいくか」をまず決めます。AIを数学で鍛えると、得意な解き方に絞り込むので一発正解は増えますが、何度も挑戦したときに試す解き方の幅は狭くなる。しかも時々は新しい解き方も生まれる。AIの成長を「解き方の選び方の変化」として見ると、矛盾して見えた報告が一つの絵にまとまる点が面白いところです。", "unverified": "§4〜5の定理の具体的な条件と、表1の分野別スコアは照合していない。"}}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "事前トレンド検定の代わりに期間を平均して推定", "title": "An Averaging Alternative to Pre-Trend Testing", "url": "https://arxiv.org/abs/2610.05705", "authors": "Nicholas L. Brown ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Brown, N. L., & Bu, Q. (2026). An Averaging Alternative to Pre-Trend Testing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05705", "why": "どの処置前期間で平行トレンドが成り立つか不確かなときに、検定で選ぶのではなく推定量を平均する差の差の推定法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2のモデルと推定量、§5.1のシミュレーション比較、§6の2つの応用、§7の結論）を読んだ。§3〜4の漸近理論と証明は未読", "preprint": true, "p1": "差の差（DID）でどの処置前期間が平行トレンドを満たすか分からないとき、事前トレンド検定で期間を選ぶ代わりに、候補の2×2 DID推定量を残差の大きさに応じて重み付け平均する推定量MADIDを提案した。", "p2": "事前トレンド検定で比較期間を選ぶと、選択後推論の問題として推定にバイアスが生じうる（Roth 2022）。どの期間が妥当か不確かな状況で、検定に頼らない方法が求められていた（§1）。", "p3": "未処置の潜在結果に共通因子と因子負荷の構造 y=c_i+θ_t+f_t'γ_i+u を置くと、処置期sと比較期tのDIDは因子の差(f_s−f_t)だけ偏る（§2、式1）。各比較期間の長差分回帰の残差平方和SSRから √N·log(SSR/N) という情報量基準を作り、その指数で重みを決める（式3）。直観：因子のずれた期間との比較は残差が大きくなるので重みが自動的に小さくなる。重みは凸結合なので候補の推定値の範囲を超えて外挿しない。", "p4": "5つの処置前期間を持つ4つの因子経路の設計（正弦・手動・定数・線形トレンド）で、バイアス・RMSE・信頼区間の被覆率を、プール型DIDや時間重み付きDID（TW-DID）と比べた（§5、表5.2）。応用として、米国のオポチュニティ・ゾーン（29,072国勢調査区）と、ドッブス判決の出生への影響（37州）を推定した（§6）。", "p5": "妥当な比較期間がある3設計でMADIDはほぼ不偏で、被覆率は0.964・0.948・0.956だった。手動設計では個々の妥当なDIDよりRMSEが小さかった。TW-DIDは標準偏差が小さいが、不整合な比較期間がある設計では被覆率が大きく不足した。全候補が不正な線形トレンド設計ではMADIDも偏った（§5.1、表5.2）。", "p6": "少なくとも一つの期間が平行トレンドを満たし、残差の基準が妥当な比較と不正な比較を区別できることが一致性の条件で、全候補の偏りが同じ向きなら平均しても消えない（§5.1、§7）。処置後期間をまたぐ同時分布は一般に非ガウスで、推論には部分標本化かシミュレーションが要る（抄録）。", "fun": "「どの年と比べるのが公平か」を検定で一つ選ぶと、選んだこと自体が結果をゆがめることがあります。この研究は、選ぶのをやめて、候補の比較をすべて計算し、当てはまりの良いものほど重く平均します。一つに賭けずに分散投資するような発想で、選択のゆがみを避けようとしている点が面白いところです。", "unverified": "2つの応用での推定値と重みの具体的な数値（表）は照合していない。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "未測定交絡の下で代理変数から処置効果を学ぶ", "title": "Proximal Causal Learning under Unmeasured Confounding", "url": "https://arxiv.org/abs/2610.04519", "authors": "Ying Tang ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Tang, Y., & Wang, Y. (2026). Proximal Causal Learning under Unmeasured Confounding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04519", "why": "観察データで未測定交絡がある場合に、代理変数を使う近接因果学習で処置効果を推定する方法を扱った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3.2の近接因果学習の識別、§4の手法、§5の実験・アブレーション・感度分析、§6の結論）を読んだ。表の個別数値は一部のみ確認", "preprint": true, "p1": "未測定交絡の下で処置効果を推定する近接因果学習（proximal causal learning, PCL）で、従来は専門知識で事前に指定していた代理変数を、観測された共変量からニューラルネットで自動的に学習する枠組みPCL-Uを提案した。", "p2": "観察データの処置効果推定は「未測定の交絡がない」という仮定に頼るが、これは実際にはほとんど成り立たない。PCLは代理変数で未測定交絡を扱えるが、処置側・結果側の代理変数を事前に正しく指定する必要があった（§1、§3）。", "p3": "共変量Cを3つのエンコーダで、処置に関わる代理Ẑ、結果に関わる代理Ŵ、両方に関わる共有代理X̂に分け、各代理が処置Aや結果Yと持つべき関係（関連と排除）を相互情報量のミニマックス目的で促す（§4.1〜4.2、式14・15）。学習した代理を使い、結果ブリッジ関数h(Ŵ,a,X̂)をモーメント制約で推定し、平均処置効果をE[h₁−h₀]として求める（§3.2の式2〜4、§4.3）。", "p4": "IHDP・Jobs・Twinsの標準データで、CFR系、SITE、DeR-CFRなど9手法と、指定済みの代理変数を使うNMMRを比較し、PEHE・ATE誤差・政策リスク・AUCなどで評価した（§5.1〜5.3）。未測定交絡Uの次元と強さを変えた合成データも作った（§5.4.2）。", "p5": "6指標中4指標で最良で、IHDPでは最良の基準手法（DeR-CFR）よりPEHEを18.6%、TwinsではATE誤差を22.2%減らした（§5.4.1、表2）。Jobsでは他手法が最良だった。合成データでは、交絡の強さが増しても安定し、代理を事前指定するNMMRと同程度の性能だった（§5.4.2、§6）。", "p6": "学習した代理変数が妥当かは観測データから直接確かめられず、識別の理論的保証は未解決である（§4、§6）。Uの次元が代理の次元を超えると性能が落ちる制約も示された（§6）。解釈：標準データ自体は未測定交絡のない設定で作られており、提案法の本来の強みがどこまで試されているかには疑問が残る。", "fun": "「薬を飲んだ人が治ったのは薬のおかげか、元々健康だったからか」を見分けるには、隠れた原因（交絡）を考える必要があります。隠れた原因は測れなくても、その「影」を映す手がかりの変数があれば補正できる。この研究は、その手がかり探しを人の知識でなくAIに任せようとする、大胆な試みです。", "unverified": "合成データの表4の数値と、各代理の解釈可能性の検討は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "記者の移籍から記者の思想が報道の偏りを決めると示す", "title": "Journalist Ideology and the Production of News: Evidence from Movers", "url": "https://arxiv.org/abs/2610.04182", "authors": "Levi Boxell ほか", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Boxell, L., Conway, J., & Longuet-Marx, N. (2026). Journalist Ideology and the Production of News: Evidence from Movers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.04182", "why": "記者と新聞社が論調と賃金を契約するモデルを、記者の移籍データで推定し、報道の政治的傾きに記者が果たす役割を測った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2のモデル、§3〜4のデータと論調の測定、§5の移籍者の分析、§8の結論と限界）を読んだ。§6〜7の構造推定の詳細と付録は未読", "preprint": true, "p1": "記者と新聞社が論調と賃金を契約するモデルを作り、記者の新聞社間の移籍を使って、報道の政治的な論調（slant）のばらつきの約10%が記者個人で説明されることを推定した。", "p2": "報道の偏りが媒体の方針によるのか、書く記者の思想によるのかは、記者が自分に合う媒体を選ぶ（選別）ため単純な比較では分けられなかった（§1）。", "p3": "記者の理想点δ_iと媒体の理想点δ_jの重み付き平均で記事の論調が決まる契約モデル x*=β/(β+1)·δ_i+1/(β+1)·(δ_j+ξ) を置き、移籍前後の論調の変化と、記者と媒体の固定効果の分散分解（AKM）で記者の寄与を識別する（§2、§5、式）。論調は、政治家がツイートした記事を政党でラベル付けしてRoBERTaを微調整した分類器で測る（§4.2）。", "p4": "2013〜2018年の米国の新聞記事900万件超（ProQuest全文）に分類器を適用し、記者の有権者登録データと結びつけた（§3）。論調の指標は、人がコード化した記事の党派性（Budak et al. 2016、1万件超）で外部検証した（§4.3）。", "p5": "記者が論調に思想的な好みを持たないという仮説は棄却され、論調のばらつきの10%が記者で説明された。移籍した記者の平均論調は、移籍先と移籍元の媒体平均の差の77%だけ動いた（抄録、§8）。記者の党派構成を民主・共和・無党派の均等に変える反実仮想では、平均論調は保守寄りに動くが0.04標準偏差にとどまった（抄録）。", "p6": "記者の媒体間の選別について強い仮定が必要で、違反すれば推定は偏る。記者間の相互作用は媒体の効果に入り、媒体の好みは所有者・広告主・編集者・読者を一括したものとして扱っている（§8）。思想的な好みと他の持続的な記者属性も完全には分けられない（§8）。", "fun": "新聞の論調が偏っているのは、記者のせいか、新聞社のせいか。この研究は、記者が別の新聞社に移ったときに書く記事の論調がどれだけ変わるかを見ることで答えようとしました。移ると論調の大半は移籍先に合わせて変わる、つまり記者よりも媒体の力が大きい、という結果は、職場が個人の発信に与える影響の大きさを物語っています。", "unverified": "RoBERTa分類器の精度と、外部検証での順位相関の具体値は照合していない。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "フィリップス曲線と政策ルールの70年の識別史", "title": "Seventy Years of Identifying the Phillips Curve and the Policy Rule", "url": "https://arxiv.org/abs/2610.06007", "authors": "Eric Vansteenberghe", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Vansteenberghe, E. (2026). Seventy Years of Identifying the Phillips Curve and the Policy Rule (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06007", "why": "金融政策の議論の要となる二つの係数を、各世代がどう識別してきたかを整理し、識別の難しさの源を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2の「識別」の5つの意味、§3〜4の目次と一部、§5.1の3つの規則性、§8.2の冒頭）を読んだ総説。各時代の個別論文の節は流し読み", "preprint": true, "p1": "金融政策の議論の要であるフィリップス曲線の傾きと政策ルールのインフレ反応係数について、70年分の推定研究を一つの識別問題として読み直し、二つは互いの識別条件を借りているため一緒に崩れることを示した総説。", "p2": "各世代は前提を置いて係数を推定し、次の世代がその前提を緩めて偏りを指摘する、という連鎖が続いてきたが、二つの係数の研究は別々に語られてきた（抄録、§1）。", "p3": "「識別された」という言葉の5つの意味を区別する。S1：標本への当てはめ、S2：外部で識別したショックの効果、S3：維持したモデルの中での識別、S4：政策が変わっても不変な基本パラメータ、S5：仮定と両立する集合（§2）。例：傾きκ̂は、回帰の係数にも、物語的ショックでの反応比にも、NKPCが真なら唯一の値にもなりうる。政策評価に要るのはS4だが、各世代が得たのは他の4つ以下だった（§2）。", "p4": "1958年のフィリップスから2026年までの曲線の推定（§3）と、1963年以降のルールの推定（§4）を時代順に整理し、ユーロ圏も含めて各推定をS1〜S5で分類し、表1〜3で互いの借用関係を示した（§3〜5）。", "p5": "世代交代での修正は推定値を覆すより、その値が何を測るかを格下げする「意味の付け替え」だった。インフレ目標を追う中央銀行の下では曲線の回帰がルールの傾きを返し（McLeay & Tenreyro 2020）、決定的均衡ではテイラー原則が求める反応が実際には発揮されない（Cochrane 2011）ため、二つの係数の読みは独立でない（§5.1）。最後に、点でなく範囲が残るときに許される主張として、上下限・符号・順序と、範囲を前提にした意思決定を挙げた（抄録、§8）。", "p6": "総説であり新しい推定は行わない。解釈：分類は著者の読みに依存し、各研究がどの意味で「識別」を主張したかの判定には異論もありうる。", "fun": "「物価と失業の関係はどれくらい強いか」「中央銀行は物価にどれだけ反応するか」。この二つの数は、片方を測るためにもう片方の仮定を借りているため、どちらも単独では決まらない。70年分の研究を「識別」という一つの言葉の5つの意味で整理し直した点が、経済学の歴史を見通す地図のようで面白いところです。", "unverified": "表1〜3の各研究の分類の詳細は照合していない。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "合成コントロールが共通ショックで崩れるときの診断と補正", "title": "Synthetic Control under Out-of-Span Common Shocks: Diagnosis, Exposure Balance and Correction", "url": "https://arxiv.org/abs/2610.05535", "authors": "Rok Spruk", "venue": "arXiv", "date": "Tue, 06 Oct 2026", "apa": "Spruk, R. (2026). Synthetic Control under Out-of-Span Common Shocks: Diagnosis, Exposure Balance and Correction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05535", "why": "商品価格のような観測可能な共通ショックが処置群と連動すると合成コントロールの前提が崩れることを示し、診断と補正の方法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2.2の上界、§5のモンテカルロの設計と結果、§6.7のイランへの応用の解釈、§7の結論）を読んだ。§3〜4の証明と推論の詳細は未読", "preprint": true, "p1": "合成コントロールで、原油価格のような観測できる共通ショックが処置前は潜在因子と連動し処置後に離れると、処置前の当てはまりが良くても大きく偏ることを示し、その診断法と補正法（曝露を補正した合成コントロール、EASC）を作った。", "p2": "合成コントロールは処置前の当てはまりで観測されない要因の釣り合いが取れると信じるが、処置前に潜在因子と区別できない「沈黙した因子」があると、処置後のショックへの曝露が全く釣り合わない（抄録、§2.3）。", "p3": "任意の重みの処置後のバイアスが、処置前の系統的な当てはまりの悪さηと、その期のレバレッジκ_tの積で抑えられることを示した（命題1、|Δ'g_t|≤κ_t·η）。κ_tは潜在因子成分と観測ショックの部分レバレッジに正確に分解でき、処置群の処置後の結果を使わずに診断できる（§2）。処置群が提供群の曝露の凸包の外にあると単体重みでは釣り合いが取れないので、提供群間の回帰で残りの不均衡を補正し、バイアスを考慮した信頼区間を作る（§3〜4）。", "p4": "1996〜2024年のブレント原油価格を使い、処置効果を2012〜15年は−0.10、その後は−0.05とした12の設計で、合成コントロール・合成DiD・行列補完などとバイアスとRMSEを比べた（§5、表1）。応用として2012年の対イラン制裁の産出損失を推定した（§6）。", "p5": "処置群が曝露の凸包の外にある基本設計では、2018〜24年のバイアスは合成コントロールで−0.159、合成DiDで−0.210、行列補完で−0.223と真の効果の3〜4.5倍だったが、EASCは−0.003でRMSEは合成コントロールの半分未満（0.063対0.166）だった（§5.2）。イランでは2012〜15年の約12%の産出損失はどの補正でも残ったが、2016年以降の持続的な損失は原油曝露を補正すると消えた（§6.7、抄録）。", "p6": "補正は提供群の横断面に関する明示的な仮定に基づく調整で、それ自体が識別された推定量ではない。2015年以降は潜在的なレバレッジが高すぎ、この比較群では長期効果は識別できない（§6.7、§7）。不要なときにEASCを使うと誤差が増える（§5.2）。", "fun": "経済制裁の効果を測るには「制裁がなかったイラン」を他国の組み合わせで作ります。でもイランは他のどの国より石油に頼っていたので、後に起きた原油価格の暴落の影響まで制裁のせいに見えてしまう。似た国がいないとき、どこまでなら言えて、どこから先は言えないのかを数で示した点が誠実で面白いところです。", "unverified": "§6の推定表の個別の値と、バイアスを考慮した信頼区間の幅は照合していない。"}}, {"id": "pn07", "rank": 7
