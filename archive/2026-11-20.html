<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

。国内では社会経済的地位の低い人ほど過小評価し、実際の返却率を知らせるRCTでずれが縮んだ。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "AIで法律業務は再配分され大手は値上げ", "title": "AI, Specialization, and the Organization of Knowledge Work: Evidence from Legal Services", "url": "https://arxiv.org/abs/2611.23354", "authors": "Liu Zhang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "AIが専門知識を安くすると、依頼者は内製化せず安い外部の選択肢へ仕事を移し、価格に敏感な仕事が抜けた高級事務所はむしろマークアップを上げうるという枠組みを示す。米国89連邦地区の差の差分析で本人訴訟の割合が上昇した一方、企業内の弁護士雇用には明確な変化が見られなかった。"}, {"id": "pn03", "rank": 3, "field": "経営学", "headline": "生成AIの出品文で差別化が消え価格競争へ", "title": "Writing with Generative AI: Competition in Online Marketplaces", "url": "https://doi.org/10.2139/ssrn.7704778", "authors": "Nan Chen ほか", "venue": "SSRN", "date": "2026-11-19", "why": "Amazonが2023年9月に出品者向けの生成AI出品文ツールを導入したことを使い、市場ごとの処置の強さの違いから効果を推定する。新商品の参入は増えたがクリックと購入は上位商品に集中し、出品文は上位商品の文に似ていった。文章による差別化が効かなくなり、競争が価格と評判へ移ることを示す。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "並べ替え検定は弱い帰無仮説でも有効", "title": "On the Validity of Fisher Randomization Tests under the Weak Null", "url": "https://arxiv.org/abs/2611.24821", "authors": "Timothy Sudijono ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "二値結果のランダム化実験で、通常は個人効果ゼロの鋭い帰無仮説でしか正当化されないフィッシャーのランダム化検定が、平均効果ゼロの弱い帰無仮説でも有限標本で妥当になる3つの設計と検定統計量の組を示す。フィッシャーの正確検定やマクネマー検定も弱い帰無仮説の下で有効になる。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "関数主成分分析の最適な推定精度を確立", "title": "Functional Principal Component Analysis: Minimax Optimality from Sparse to Dense Designs and Beyond", "url": "https://arxiv.org/abs/2611.24228", "authors": "Shunxing Yan ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "雑音を含む離散観測からの関数主成分分析（FPCA）で、20年以上未解決だった、番号が増えていく固有関数と主部分空間の推定のミニマックス最適な収束率を、疎から密までの観測設計で確立する。共分散推定の新しい最適率も示し、非パラメトリックなスペクトル推定一般の分析の枠組みを与える。"}, {"id": "pn06", "rank": 6, "field": "政治学", "headline": "LLMの投票助言は一致を高めるが偏りもある", "title": "Hi Gemini, Who Should I Vote For? The Benefits (and Problems) of Using LLMs As Voting Advice Applications", "url": "https://arxiv.org/abs/2611.24684", "authors": "William John Atkinson ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "Gemini 3 Flashにドイツの調査回答者6,022人の政策選好だけから投票先を助言させ、標準的な近接モデルと比べた。多くの人では助言に従うと政策の一致度が上がり、政治的関心や学歴の低い人で効果が大きい一方、AfDを約1.5倍の頻度で勧めるなど追跡の難しい偏りがあった。"}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "1回の順伝播で画像を生成する統合モデル", "title": "Jeveration: System One Models Now Generate", "url": "https://arxiv.org/abs/2611.24738", "authors": "Yuhe Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "凍結した視覚言語モデルの知識を使い、並列予測を共有の乱数状態で協調させて、512×512の画像を1回の順伝播で78ミリ秒で生成する。既存の統合モデルより最大122倍速く、同じ重みで画像変換と密な予測もこなす。Hugging Faceで最も多くの票を集めた。"}, {"id": "pn08", "rank": 8, "field": "工学", "headline": "ニューラル作用素で地震サイクル計算を高速化", "title": "Machine-learned acceleration of earthquake sequence simulations", "url": "https://arxiv.org/abs/2611.23561", "authors": "Reo Yanagi ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "遅い地震間期と速い動的破壊が混在する地震サイクルの計算で、破壊の前後の状態の飛躍をフーリエ・ニューラル作用素（FNO）に学習させ、地震間期は従来の準動的解法で解く混合モデルを提案する。完全動的計算の長期統計（規模・再来間隔の分布）を再現し、準動的近似より良い近似を少ない計算で得る。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "1つのニューロン操作でAIチームの隠蔽が増加", "title": "Nothing to Declare: Steering a single neuron increases concealment in AI teams", "url": "https://arxiv.org/abs/2611.24475", "authors": "Edoardo Chidichimo ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "Qwen3.5-4Bで1つのニューロンの出力方向に活性を操作すると、情報を隠す判断が単独より複数エージェントのチームで強く増えた。全員が操作を受けると集団的な隠蔽が5場面中4場面で増え、エージェント間のメッセージは隠蔽を和らげた。集団の場が内部への介入の効き方を変えることを示す。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "実験デザインの質を数値で評価する道具", "title": "Evaluating and Improving Experimental Designs in Economics", "url": "https://doi.org/10.2139/ssrn.7701058", "authors": "Daniel Evans ほか", "venue": "SSRN", "date": "2026-11-19", "why": "実験の設計を30の要素に分解して最適な選択を示し、質問に沿って評価すると数量的な質の得点が出る道具（EDAT）を作る。経済学トップ8誌に載った実験に適用すると評価の信頼性が高く、得点が被引用数や掲載結果を強く予測した。内的妥当性と外的妥当性の間に避けられない取捨があることも示す。"}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "ファジーな差の差法を設計ベースで推論", "title": "Design-Based Inference for Fuzzy Difference-in-Differences", "url": "https://arxiv.org/abs/2611.24402", "authors": "Pedro Picchetti", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "政策の割当だけが確率的で潜在的結果と処置の選択は固定とみなす設計ベースの立場から、ファジーな差の差法の推定量を、割当で重みづけたコンプライアーの効果と汚染項に分解し、因果的に解釈できる条件を導く。弱い第1段階でも有効な検定と感度分析を提案し、オレゴン医療保険実験に適用する。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "いつ止めても有効な適合度検定を構成", "title": "Anytime-valid goodness-of-fit test by $e$-spacings", "url": "https://arxiv.org/abs/2611.23775", "authors": "Yunda Hao ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "順序統計量の間隔（スペーシング）からe過程を作り、任意の停止規則の下で第1種の誤りを制御する適合度検定（e-spacing検定）を提案する。局所的なずれの検出に強く、対数e過程が漸近的にオラクル最適なものと同等になることを示し、複数の戦略を最適に組み合わせる方式も与える。"}, {"id": "pn13", "rank": 13, "field": "交通・都市計画", "headline": "公共の社会施設は新しい都市の中心をつくるか", "title": "Polycentrality in Urban Socioecological Systems: A Multilayer Analysis of Social Infrastructure in Iztapalapa, Mexico City", "url": "https://arxiv.org/abs/2611.24758", "authors": "Marco A. Rosas ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "メキシコ市イスタパラパで、歩行網・GTFSの公共交通・15の公共社会施設を重ねた多層ネットワークにより、施設への多手段の接続性と到達時間を評価し、地域の経済的中心性の指標と比べる。施設と既存の交通網との統合に地域差があることを示す。"}, {"id": "pn14", "rank": 14, "field": "政治学", "headline": "AIの議員評価も党派で受け止めが変わる", "title": "Transparency Is Not Enough: Political Identity and the Acceptance of AI-Generated Governance Information", "url": "https://econpapers.repec.org/RePEc:osf:socarx:b3nzt_v1", "authors": "Liu ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "台湾のオンライン調査実験で、AIが作った議員の業績評価を受け入れるかは、高く評価された議員が自分の陣営かどうかに強く左右され、AIに結びつく報道機関の党派性は有意な影響を持たなかった。AIを介した透明性も党派的な選別を免れないことを示す。"}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "成績に基づく表彰が政治家志望者の質を高める", "title": "Mitigating Adverse Political Selection: Long-Term Experimental Evidence from a Leadership Training for Aspiring Politicians in the Philippines", "url": "https://doi.org/10.2139/ssrn.7710278", "authors": "Nico Ravanilla", "venue": "SSRN", "date": "2026-11-19", "why": "フィリピンの若い政治家志望者569人のランダム化実験で、リーダーシップ研修の表彰を出席でなく成績に基づかせると、認知能力・誠実さ・公共奉仕動機の低い人が立候補を控え、男性の過剰代表も縮んだ。効果は5年後の実際の選挙でも見られたが、10年後には判別できなくなった。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "複合p値に局所FDRの枠組みを与える", "title": "A Local False Discovery Rate Framework for Compound p-values", "url": "https://arxiv.org/abs/2611.24555", "authors": "Jierui Zhu ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "帰無仮説全体での平均条件だけを満たす複合p値は、個々の棄却を守らないことがある。密度複合p値という概念で複合p値と頻度論の局所FDRを結びつけ、個々の発見の信頼性を評価できる枠組みを提案する。"}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "追加の共変量を集める価値を予測区間で判定", "title": "Is It Worth Collecting Additional Covariates?", "url": "https://arxiv.org/abs/2611.24031", "authors": "Wen Zhang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "安価な基本の共変量に加えて高価な共変量を集める価値があるかを、予測区間の幅の縮小を基準に評価・検定する方法を提案する。研究の計画段階でのデータ収集の判断に使える。"}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "非ガウスの気候場を生成するベイズ輸送写像", "title": "Laplace Bayesian transport maps for generative modeling of non-Gaussian climate fields", "url": "https://arxiv.org/abs/2611.23467", "authors": "Jacob A. Johnson ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "複雑な非ガウスの空間場を標準ガウス分布へ写す輸送写像で気候場の確率的な代理モデルを作る際、自己回帰ガウス過程に頼る従来のベイズ輸送写像の制約を、ラプラス近似を使う方法で緩める。"}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "LLMは予測問題を正しく定式化できるか", "title": "When Do LLMs Model the Right Target? Problem Formulation in High-Stakes Risk Prediction", "url": "https://arxiv.org/abs/2611.23638", "authors": "Jennifer Zhang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "高リスクの意思決定に使う予測モデルの開発で、LLMが問題を正しく定式化できるかを、過去の判断が結果の観測に影響する判断依存性に焦点を当てて調べる。データ分析にLLMを使う際の妥当性の落とし穴を示す。"}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "複数の結果の感度分析で交絡の違いを扱う", "title": "Confounding Heterogeneity in Multivariate Sensitivity Analysis for Observational Studies", "url": "https://arxiv.org/abs/2611.23568", "authors": "Anthony Frazier ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "観察研究で1つの処置の複数の結果への効果を感度分析するとき、未測定の交絡の強さが結果ごとに異なりうること（交絡の異質性）が分析に固有の特徴になることを示し、それを扱う多変量の感度分析を提案する。"}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "分散最小の反実仮想方策でA/Bテストを効率化", "title": "Variance-Optimal Counterfactual Policy Design for Sample-Efficient Online A/B Testing", "url": "https://arxiv.org/abs/2611.24757", "authors": "Shashank Gupta ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "推薦などの方策のオンラインA/Bテストで、処置方策と本番方策が同じ行動を似た確率で選ぶと観測が雑音を増やすだけになる問題に対し、推定量の分散を最小にする反実仮想の方策を設計して標本効率を上げる。"}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "分割の森で釣り合いの重みを推定", "title": "Balancing Partition Forest for Causal Weighting", "url": "https://arxiv.org/abs/2611.23524", "authors": "Felipe Angelim ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "観察データの因果推論で処置と共変量を独立にする釣り合いの重みを、共変量と処置の周辺分布の積と同時分布の比として、分割木と分割の森（BPT・BPF）で直接推定する方法を提案する。二値と連続の処置の両方に使える。"}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "ネットワーク干渉下の因果関数を能動学習で", "title": "Fill-Distance-Guided Active Learning for Causal Function Recovery under Network Interference", "url": "https://arxiv.org/abs/2611.24143", "authors": "Peiyao Liu ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "結果が自分と近隣の処置に依存するネットワーク干渉の下で、因果効果を近隣の曝露の関数として回復するために、充填距離に基づいて実験の割当を能動的に選ぶ方法を提案する。"}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "推薦ルールが売り手の競争を変える仕組み", "title": "Platform Recommendation and Competition in Search Markets", "url": "https://arxiv.org/abs/2611.24464", "authors": "Sanxi Li ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "異質な売り手の内生的な価格・広告と費用のかかる消費者探索を含むモデルで、プラットフォームの推薦ルールを評価する枠組みを作り、分離可能な推薦スコアの広いクラスで均衡が一意に存在する条件を示す。"}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "不完全な操作変数のプロビットで感度の範囲", "title": "Plausibly Exogenous Instruments in Probit Models: Sensitivity Bounds for Average Partial and Interaction Effects", "url": "https://arxiv.org/abs/2611.23438", "authors": "Luke Taylor ほか", "venue": "arXiv", "date": rontologist", "date": "2026-11-18", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "Amazonの推奨枠は需要を自社へ誘導しうる", "title": "Two‐Sided Markets Shaped by Platform‐Guided Search", "url": "https://doi.org/10.3982/ecta22288", "authors": "Kwok Hao Lee ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "Amazonで商品ごとに1つの出品者を目立たせるBuybox（推奨枠）の販売データで構造モデルを推定し、消費者の95%がBuyboxの出品しか検討しないため、プラットフォームが需要を誘導できることを示す。Buyboxは価格に強く反応するが、自社の出品に偏る。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "超富裕層の富は貯蓄・相続・運用益で決まる", "title": "Why Are the Wealthiest so Wealthy? New Longitudinal Empirical Evidence and Implications for Theories of Wealth Inequality", "url": "https://doi.org/10.3982/ecta23194", "authors": "Joachim Hubmer ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "ノルウェーの1993〜2019年の行政パネルで、45〜64歳の上位0.1%世帯の中央値に対する超過資産を、高い貯蓄率・相続・運用収益・労働所得に分解する。超富裕層の4分の1は負の資産から急速に富を築いた新興の富で、残りは相続した富を平均以上の貯蓄と運用で増やしている。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "人は現金給付より仕事を通じた再分配を選ぶ", "title": "Informal Redistribution Through Work", "url": "https://doi.org/10.3982/ecta22079", "authors": "Elisa Macchi ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "ウガンダ・カンパラのフィールド実験と企業調査で、雇用主も労働者も現金給付より仕事を通じた再分配を一貫して選び、限界生産物がゼロの作業にも雇用主が支払うことを示す。生産価値や社会的評判では説明できず、仕事を通じて再分配すべきだという内面化された規範が動機だとする。"}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "予測アルゴリズムから理論の反例を自動生成", "title": "From Predictive Algorithms to the Automatic Generation of Anomalies", "url": "https://doi.org/10.3982/ecta22958", "authors": "Sendhil Mullainathan ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "研究者の直観に代えて予測アルゴリズムを使い、理論の欠陥を示すアノマリー（アレのパラドックスのような反例）を自動生成する手順を開発する。くじの選択を正確に予測するニューラルネットから、期待効用理論の既知のアノマリーを再発見し、新しいアノマリーも見つける。"}, {"id": "jn05", "rank": 5, "field": "因果推論", "headline": "公式で決まる処置の最適な操作変数", "title": "Optimal Formula Instruments", "url": "https://doi.org/10.3982/ecta24250", "authors": "Kirill Borusyak ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "政策の受給資格のように複雑な公式で決まる処置の効果を推定する際、外生ショックへの曝露の異質性を取り込み、再中心化で偏りを避けたより強い操作変数を構成して、その漸近的に効率的な形と実行可能な近似のアルゴリズムを示す。シミュレーション操作変数に比べて標準誤差が大きく下がる。"}, {"id": "jn06", "rank": 6, "field": "統計学", "headline": "回帰係数の厳密に有効なランダム化t検定", "title": "An Exact t ‐Test", "url": "https://doi.org/10.3982/ecta22545", "authors": "Guillaume A. Pouliot", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "誤差が交換可能なら厳密に有効で、そうでなく条件付き不均一分散があっても最良線形予測子について漸近的に有効な、回帰係数1つのランダム化検定を、連続・離散の相関した共変量を含む一般の設計で構成する。長く未解決だった問題に答える。"}, {"id": "jn07", "rank": 7, "field": "政治学", "headline": "密な住宅開発への反対は美的判断が動かす", "title": "How Sociotropic Aesthetic Judgments Drive Opposition to Dense Housing Development", "url": "https://doi.org/10.1017/s0003055426102226", "authors": "DAVID E. BROOCKMAN ほか", "venue": "American Political Science Review", "date": "2026-11-19", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "why": "米国の住宅不足の一因である密な住宅開発への有権者の反対を、持ち家の自己利益（NIMBY）でなく、社会全体の景観についての美的判断から説明する理論を立て、記述研究と実験で検証する。密な地域を選んで住む人は密度への美的な嗜好を持ち、密な開発をより支持する。"}, {"id": "jn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "悪い人間関係が常に強く効くわけではない", "title": "Examining Negative Asymmetry in Employee Social Networks: A Meta-Analysis", "url": "https://doi.org/10.1177/01492063261495910", "authors": "Kameron M. Carter ほか", "venue": "Journal of Management", "date": "2026-11-19", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "職場の否定的な関係は肯定的な関係より従業員の成果に強く関係するという負の非対称性の仮定を、71標本・13,369人・248の効果量のメタ分析で検証する。負の非対称性に沿う証拠は一部の関係に限られ、むしろ正の非対称性に沿う結果も見られ、効果量のばらつきも大きかった。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "主要顧客のAI導入が取引先へ波及する", "title": "Artificial Intelligence Along the Supply Chain", "url": "https://doi.org/10.1287/msom.2024.1549", "authors": "Ling Cen ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "サプライチェーンでつながる企業間のAI技術の普及を調べ、主要顧客のAI導入がそれに依存する供給企業のその後の導入を有意に予測することを示し、内生性に対処する複数の実証戦略で因果効果を確かめる。"}, {"id": "jn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "猛暑で配達員は多く働き遅配も増える", "title": "The Impact of Heat Hazard on Gig Economy Workers: Evidence from An On-demand Food Delivery Platform", "url": "https://doi.org/10.1287/msom.2025.0410", "authors": "Run Ge ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "中国の大手料理配達プラットフォームの運用データと高頻度の気象データで、極端な暑さの下で配達員が受ける注文と労働時間が増え、遅配の割合も高まり、時給は少し上がることを示す。暑熱による健康費用の試算も加え、短期の供給拡大と労働者の健康の間の緊張を示す。"}, {"id": "jn11", "rank": 11, "field": "物理学", "headline": "2+1次元の相対論的量子場を原子で模擬", "title": "Analogue simulation of massive relativistic quantum fields in 2 + 1 dimensions", "url": "https://doi.org/10.1038/s41586-026-11268-y", "authors": "Yansheng Zhang ほか", "venue": "Nature", "date": "2026-11-18", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "一様な2次元のボース・アインシュタイン凝縮体の2つの結合したスピン成分の相対位相で、サイン・ゴルドン模型を符号化し、2+1次元の質量を持つ相対論的量子場を模擬する。調整できる質量ギャップを持つ相対論的な分散と、位相が2πだけ巻く位相的な磁壁などの非摂動的な現象を観測した。"}, {"id": "jn12", "rank": 12, "field": "地球科学", "headline": "断層帯の非弾性変形が大小の地震を生む", "title": "Small and large earthquakes driven by inelastic deformation in weak fault zones", "url": "https://doi.org/10.1126/sciadv.aef7106", "authors": "Peng Zhai ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "断層面だけでなく周囲の断層帯の岩石の損傷と回復を含む動的な地震サイクルモデルで、同じ断層上の小さな地震と大きな地震が、断層すべりと断層帯の非弾性変形の相互作用から自然に生じることを示し、規模別頻度などの観測を再現する。"}, {"id": "jn13", "rank": 13, "field": "物理学", "headline": "重力で遮断できない無線通信を実証", "title": "Unblockable communication with gravity", "url": "https://doi.org/10.1126/sciadv.aee0802", "authors": "Andrew J. Groszek ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "電磁波は遮蔽されうるため、遮断できない通信路はあるかを問い、質量を動かして2値のメッセージを符号化し、受信側が重力計でその信号を検出する通信の手順を提案する。レンガの壁越しに約0.7メートル、毎分1ビットでの伝送に成功した。"}, {"id": "jn14", "rank": 14, "field": "機械学習", "headline": "視覚言語モデルで脚ロボットが野外を踏破", "title": "Bridging vision-language reasoning and learned control for legged navigation in the wild", "url": "https://doi.org/10.1126/scirobotics.aee1549", "authors": "Takahiro Miki ほか", "venue": "Science Robotics", "date": "2026-11-18", "sjr": 5.883, "citescore": 32.1, "citescore_year": "2025", "why": "インターネット規模で事前学習した視覚言語モデルの常識的な推論と、シミュレーションの強化学習で得た歩行・局所計画を、開語彙セグメンテーションによるリスク地図でつないだROAMを提案する。脚ロボットが高山と都市の環境で、標識を読み危険を避けながらキロメートル規模の移動を行った。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "労働増大型の技術を入れた生産関数の推定", "title": "Production Function Estimation With Factor‐Augmenting Technology: An Application to Markups", "url": "https://doi.org/10.3982/ecta19299", "authors": "Mert Demirer", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "CES型に頼らず多次元の生産性を許すようOlley–Pakesの枠組みを拡張して、労働増大型の技術を持つ生産関数を推定する方法を開発し、米国と途上国4か国の製造業に適用する。労働増大型の生産性を無視すると、資本の弾力性を過小に、可変投入の弾力性とマークアップを過大に推定する。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "中間財の長期の代替弾力性は高い", "title": "Intermediate Input Substitutability", "url": "https://doi.org/10.3982/ecta21141", "authors": "Alessandra Peter ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "1990年代初めのインドの貿易自由化による恒久的で異質な関税の引下げを自然実験として、製造業事業所の8種類の中間投入の長期の代替弾力性を推定し、コブ・ダグラスの1を大きく上回る高い代替性を示す。短期や一時的な価格ショックではずっと低い弾力性になる。"}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "資産価格の変動を入れたキャピタルゲイン税", "title": "Putting the ‘Finance’ Into ‘Public Finance’: A Theory of Capital Gains Taxation", "url": "https://doi.org/10.3982/ecta24013", "authors": "Mark Aguiar ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "資産価格がキャッシュフローだけでなく割引率でも変動するという現代ファイナンスの見方を入れた最適再分配課税を分析し、実現ベースのキャピタルゲイン税とキャッシュフロー税の組合せが価格変動の源によらず最適配分を実現することを示す。総純取引を対象にすることでロックイン効果も避けられる。"}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "ネットワークの社会的学習には速度の上限", "title": "The Social Learning Barrier", "url": "https://doi.org/10.3982/ecta24769", "authors": "Florian Brandl", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "社会ネットワークで隣人の行動を見ながら繰り返し行動する主体について、最も学習の遅い主体の学習速度は、最も情報量の多い私的シグナルの分布だけで決まる定数で抑えられ、主体の数・ネットワーク構造・シグナルの相関・戦略によらないことを示す。"}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "試行回数が主体で異なるときの極値理論", "title": "Extreme Value Theory With Heterogeneous Agents", "url": "https://doi.org/10.3982/ecta22276", "authors": "Sephorah Mangin", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "生産性やアイデアなど、主体が分布から多数の値を引きその最大値で結果が決まる経済モデルで、引ける回数が主体によって異なる場合を探索技術として扱い、平均的な結果が変わるかを示す新しい極値分布のクラスを導く。"}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "繰り返しゲームで連合を抑止する枠組み", "title": "Coalitions in Repeated Games", "url": "https://doi.org/10.3982/ecta23921", "authors": "S. Nageeb Ali ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "継続的な約束と罰で連合による阻止を抑止する履歴依存の仕組みをモデル化し、譲渡可能な効用の有無で有効性を評価する解概念を提案する。応用として労働市場の賃金の透明性の含意を分析する。"}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "プロスペクト理論の価値が通貨の収益を予測", "title": "Prospect Theory and Currency Returns: Empirical Evidence", "url": "https://doi.org/10.1017/s0022109026103469", "authors": "Qi Xu ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-19", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "why": "為替収益の過去の分布から通貨ごとのプロスペクト理論の価値を作ると将来の超過収益を負に予測し、それに基づくロング・ショート戦略は年約5%を生む。裁定が限られるほど予測力が強く、ファンドは逆向きに取引して裁定者として働く。"}, {"id": "jn22", "rank": 22, "field": "経済学   function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
