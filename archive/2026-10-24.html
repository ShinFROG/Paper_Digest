経済学", "headline": "認知能力・リスク選好・判断の誤りの関係", "title": "Cognitive ability, risk preferences and errors", "url": "https://doi.org/10.1093/ej/ueag135", "authors": "Michalis Drouvelis ほか", "venue": "Economic Journal", "date": "2026-10-22", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "why": "約26万の意思決定データで、認知能力とリスク選好、判断の誤りの関係を分けて測った。行動経済学の測定問題に答える。"}, {"id": "jn15", "rank": 15, "field": "地球科学", "headline": "後期完新世にローレンタイド氷床が再拡大", "title": "Late Holocene reexpansion of the Laurentide Ice Sheet", "url": "https://doi.org/10.1126/science.aed3379", "authors": "Nicolás E. Young ほか", "venue": "Science", "date": "2026-10-22", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "間氷期に最小となるはずの北米の氷床が完新世後期に再拡大した証拠を示したScienceの論文。気候変動と氷期周期の理解を更新する。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "米中貿易戦争は米国のソフトパワーを損なったか", "title": "Is American Soft Power a Casualty of the Trade War? Evidence from U.S. Movie Viewership in China", "url": "https://doi.org/10.1162/rest.a.1877", "authors": "Haichao Fan ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "中国での米国映画の視聴データで、貿易戦争が米国文化への態度に与えた影響を検証した。", "explain": {"basis": "抄録", "basis_note": "Review of Economics and Statisticsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米中貿易戦争の関税に強くさらされた中国の地域ほど、米国映画の視聴が大きく減り、米国人への信頼も下がったことを示した（抄録）。", "p3": "米国映画の視聴を米国のソフトパワーの指標とし、トランプ関税への地域の曝露の差で比較した。非米国映画を対照にし、調査データで信頼も調べた（抄録）。", "p5": "関税曝露の大きい地域ほど米国映画の視聴が有意に減り、非米国映画は減らなかった。「米国らしさ」の強いアクションとドラマで減少が大きく、曝露地域ほど米国人への信頼が下がった（抄録）。", "fun": "関税は物の値段だけでなく、相手の国への好感にも影響するようです。経済的に痛い目にあった地域の人ほど、アメリカらしい映画を見なくなったという結果は、貿易と文化が意外なところでつながっていることを示しています。", "unverified": "減少の大きさの数値は未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "現金給付の受け取り方を選ばせると", "title": "Structuring Cash Transfers: Cash Flow Preferences, Seasonality, and Financial Decisions in Rural Kenya", "url": "https://doi.org/10.1162/rest.a.1878", "authors": "Carolina Kansikas ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "ケニアの低所得世帯が無条件現金給付のまとまった受け取りを好むことを示し、季節性と金融行動との関係を分析した。", "explain": {"basis": "抄録", "basis_note": "Review of Economics and Statisticsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ケニアの低所得世帯の多くは、無条件現金給付をまとめて受け取ることを好み、一部は受け取りの先送りを好むことを示した（抄録）。", "p3": "給付の受け取り方（分割か一括か、時期）についての世帯の選好を調べ、受け取り時期の違いの帰結を比べた（抄録）。", "p5": "多くは一括の給付を好み、一部は後での受け取りを好んだ。年の後半に受け取ると1.5年後の所得が上がったが、先送りの意思は判断時の小さな資金の動きに敏感だった（抄録）。", "fun": "毎月少しずつ配るのが当たり前の支援金も、受け取る人に聞いてみると「まとめて欲しい」「あとで欲しい」という声が多くありました。貧しい暮らしでは貯めることが難しいので、まとまったお金が投資の元手になるのかもしれません。", "unverified": "所得の増加の大きさは未確認。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "混合金融は女性起業家の融資を増やしたか", "title": "Blended Finance and Female Entrepreneurship", "url": "https://doi.org/10.1162/rest.a.1875", "authors": "Halil İbrahim Aydın ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "女性起業家向け融資拡大の混合金融プログラムの実体・配分への帰結を評価した。", "explain": {"basis": "抄録", "basis_note": "Review of Economics and Statisticsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "トルコの女性起業家向け融資を広げる混合金融プログラムで、参加銀行は女性への融資の割合を18%超高め、受益企業は成長したことを示した（抄録）。", "p3": "信用登録、税、雇用者と従業員の照合データを結合して、プログラムの実体・配分への帰結を分析した（抄録）。", "p5": "受益企業は投資・雇用・売上・利益を増やし、取引網を多様化し、退出が減った。参加銀行は男性起業家への融資も増やしたが小さく、生産性の高い企業に偏った。地区単位の効果はなかった（抄録）。", "fun": "女性だからという理由でお金を借りにくい状況を和らげると、その会社は実際に大きく育ちました。しかも男性への融資を押しのけたのではなく、より伸びる会社に資金が回り直したという点が、経済全体にとっても良い知らせです。", "unverified": "なし"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "女性は処置に敏感という仮説の検証", "title": "The Female Sensitivity Hypothesis: Evidence From Experimental Economics", "url": "https://doi.org/10.1162/rest.a.1879", "authors": "Felipe A. Araujo ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "200以上の実験経済学の結果を使い、女性ほど処置の変化に反応するという仮説を体系的に検証した。", "explain": {"basis": "抄録", "basis_note": "Review of Economics and Statisticsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "「女性は男性より処置の変化に敏感に反応する」という仮説は、実験経済学の証拠では支持されないことを示した（抄録）。", "p3": "200本以上の実験経済学の論文の結果を調べ、DellaVigna and Pope (2022) とExley et al. (2025) のデータで200以上の対の検定を行った。仮説が文献でどう広まったかも調べた（抄録）。", "p5": "どちらの分析でも性別は処置への反応の大きさを予測しなかった。仮説を引用するのは主にそれを支持する論文だった（抄録）。", "fun": "「女性のほうが状況の変化に敏感」というもっともらしい説は、大量の実験を並べて確かめると成り立ちませんでした。それでも説が広まったのは、支持する論文ばかりが引用し合っていたからだ、という学問の世界の癖も見えてきます。", "unverified": "なし"}}, {"id": "jn20", "rank": 20, "field": "人口学", "headline": "税優遇は高技能者の帰国を促すか", "title": "Tax Incentives and Return Migration", "url": "https://doi.org/10.1162/rest.a.1876", "authors": "Jacopo Bassetto ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "イタリアの帰国者向け所得税優遇を使い、行政データで高技能の国外移住者の帰国への効果を推定した。", "explain": {"basis": "抄録", "basis_note": "Review of Economics and Statisticsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "イタリアの帰国者向け所得税優遇を使い、高技能の国外移住者の帰国の税率弾力性が1弱であることを示した（抄録）。", "p3": "行政データと三重差分のデザインで、平均税引後率に対する移住の弾力性を推定し、費用便益分析を行った（抄録）。", "p5": "弾力性は1をわずかに下回り、反応は所得分布の上半分の広い範囲で大きかった。短期には費用がかかるが、十分な割合の帰国者が制度終了後も残れば現在価値で元が取れる（抄録）。", "fun": "海外に出た優秀な人を税金の割引で呼び戻す政策は、本当に効くのでしょうか。効果は超高所得者だけでなく幅広い層に及び、帰ってきた人が住み続ければ国の財布にとっても得になる、という具体的な答えを出しています。", "unverified": "なし"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "戦後の敵対が地域の後進性を生む", "title": "Hostility, Population Sorting, and Backwardness: Quasi-Experimental Evidence from the Red Army after WWII", "url": "https://doi.org/10.1162/rest.a.1874", "authors": "Christian Ochsner", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "第二次大戦後の赤軍の駐留を準実験として使い、短期の敵対が地域経済を長期に分ける仕組みを示した。", "explain": {"basis": "抄録", "basis_note": "Review of Economics and Statisticsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "第二次大戦末期の南オーストリアで、赤軍が74日間だけ敵対的に駐留した地域では、人口の選別を通じて長期の経済的後進性が生じたことを示した（抄録）。", "p3": "赤軍と西側連合軍の偶然で短命な接触線の両側の経済的差を準実験として使った（抄録）。", "p5": "74日間の敵対的駐留は難民の流れを通じて年齢・職業の構成を変え、人口の効果は時とともに増幅し、産業の発展と税収の遅れをもたらした。欧州の東西の経済格差の理解にもつながると述べる（抄録）。", "fun": "わずか74日の出来事が、その後何十年も地域の豊かさを分けてしまいました。その理由は戦争の破壊ではなく、若い人や技能をもつ人が逃げ出したことによる人口の入れ替わりだった、という指摘が興味深いところです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "職業ネットワークが移民の労働市場同化を助ける", "title": "Professional Networks and the Labour Market Assimilation of Immigrants", "url": "https://doi.org/10.1093/ej/ueag131", "authors": "Olof Åslund ほか", "venue": "Economic Journal", "date": "2026-10-22", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "why": "スウェーデンの離職者データで、職業上のネットワークが移民の求職と同化に果たす役割を示した。", "explain": {"basis": "抄録", "basis_note": "Economic Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "スウェーデンの離職者データで、同郷者を通じた企業とのつながりが移民の再就職に特に重要で、職業上のネットワークが移民の労働市場への同化を進めることを示した（抄録）。", "p3": "離職した労働者を分析し、つながりが紹介（リファラル）か求人情報の提供かを、出身の同質性で区別した（抄録）。", "p5": "ネットワークに地元の人が増えるにつれ、つながりの価値は地元の離職者並みに上がった。ネットワークは到着後10年の再就職の伸びの20%を説明し、15年後には移民のネットワークの生産性は地元の人と同等になった（抄録）。", "fun": "新しい国で仕事を見つけるとき、同じ国出身の知り合いがいる会社は大きな助けになります。知り合いの輪が広がるほど仕事の見つけやすさが地元の人に近づいていく様子を、10年以上の追跡で描き出しています。", "unverified": "なし"}}, {"id": "jn23", "rank": 23, "field": "統計学", "headline": "生産関数の共和分系で GDPと排出を同時推定", "title": "Estimation and Inference for Cointegrated Systems of Multi-Factor Production Functions: Modelling the Joint Behavior of GDP and Emissions", "url": "https://doi.org/10.1093/ectj/utag033", "authors": "Sebastian Veldhuis ほか", "venue": "Econometrics Journal", "date": "2026-10-22", "sjr": 6.123, "citescore": 9.8, "citescore_year": "2025", "why": "多因子生産関数の共和分体系の推定・推論法を開発し、GDPと排出の同時の動きをモデル化した。", "explain": {"basis": "抄録", "basis_note": "Econometrics Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "確定変数・和分過程とその累乗・交差積を含む共和分の多変量多項式回帰の体系に対し、統合修正OLS・GLS推定と推論を開発した（抄録）。", "p3": "誤差が式間・時間・説明変数と相関してよい設定で、制約つき推定でOLSとGLSが一致しない場合の統合修正GLSを導入し、制約なし・ありの推定量の仮説検定と、漸近的にピボタルなfixed-b推論を論じた（抄録）。", "p5": "fixed-b推論は特別な場合にしか得られないことを示し、産出と排出をCobb-Douglas-Translog型でモデル化する例を示した（抄録）。", "fun": "経済の成長と二酸化炭素の排出は、どちらも長い時間をかけて一緒に動く「くせ」をもつデータです。そうしたデータを曲線的な関係で同時に扱うための、正しい推定と検定の道具を整えた理論の論文です。", "unverified": "応用例の推定結果は未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "アプリのプッシュ通知キャンペーンの効果", "title": "Campaigns That Click: Unleashing the Power of Push Notifications on Mobile Apps", "url": "https://doi.org/10.1287/isre.2024.0917", "authors": "Zhuping Liu ほか", "venue": "Information Systems Research", "date": "2026-10-23", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "why": "モバイルアプリのプッシュ通知が利用者の関与をどう動かすかを大規模データで分析したISRの論文。", "explain": {"basis": "抄録", "basis_note": "Information Systems Researchの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "モバイルのお得情報アプリのプッシュ通知が、宣伝した店へのクリックだけでなく、宣伝していない店への関与も増やすことを示した（抄録）。", "p3": "米国の大手アプリ市場の200以上のキャンペーン、6,000万の利用者・キャンペーンの観測による大規模な観察分析と、統制実験を組み合わせた（抄録）。", "p5": "通知は宣伝した店への当日のクリックを有意に増やし、店・利用者・文面・配信時刻で効果が大きく異なった。同じ分類内外の宣伝していない店への関与も増えた（抄録）。", "fun": "スマホの通知は宣伝した店だけでなく、アプリの中の他の店にも人を連れてきていました。一つの通知が利用者の注意を市場全体に広げる「呼び水」になっている、という見方が新しいところです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "良い慣行も行き過ぎると逆効果", "title": "EXPRESS: When Good Practices Go Too Far: Overshooting in Organizational Culture", "url": "https://doi.org/10.1177/10591478261503666", "authors": "Francisco Brahm ほか", "venue": "Production and Operations Management", "date": "2026-10-23", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "組織文化での慣行の過剰な普及・強化という現象を定式化したPOMの論文。", "explain": {"basis": "抄録", "basis_note": "Production and Operations Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "組織の良い慣行が広がりすぎたり凝りすぎたりして業績を下げる「行き過ぎ」を、文化進化の単一のモデルで説明した（抄録）。", "p3": "従業員は慣行の生産的価値の情報と他者との社会的な力学の両方に影響されて慣行を採用する。普及しすぎと凝りすぎを一つの文化進化モデルに統合した（抄録）。", "p5": "従業員間の相互作用が、業績の低い文化的慣行の均衡を広めて安定させ、同時に慣行を生産的な水準を超えて凝ったものにしうることを示した（抄録）。", "fun": "会議の資料作りのような良い習慣も、みんなが真似し合ううちに、必要ない人まで使い、必要以上に凝ったものになっていきます。人は役に立つかどうかだけでなく、周りがやっているかどうかでも行動を選ぶ、という仕組みから説明しています。", "unverified": "なし"}}, {"id": "jn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "創造産業でAIと働く職業的アイデンティティ", "title": "Negotiating professional identity in the creative industries: the REC framework for Human–AI creative work", "url": "https://doi.org/10.1108/cdi-05-2026-0337", "authors": "Giuseppe Ceci ほか", "venue": "Career Development International", "date": "2026-10-23", "sjr": 1.386, "citescore": 7.7, "citescore_year": "2025", "why": "AIが創造職の職業的アイデンティティをどう変えるかを枠組みにした研究。", "explain": {"basis": "抄録", "basis_note": "Career Development Internationalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "AIが創造産業の職業的アイデンティティをどう揺さぶるかを、イタリアの映像業界の40人への面接から、抵抗・拡張・創作（REC）の3つのアイデンティティ作業として示した（抄録）。", "p3": "俳優、監督、脚本家、技術者、AI専門家への40の半構造化面接を、Gioia法で帰納的に分析した（抄録）。", "p5": "AIは創造的な仕事を支えるだけでなく、創造的な専門職であることの理解を揺さぶった。抵抗、拡張、創作の3つの相互に関わるアイデンティティ作業が見いだされた（抄録）。", "fun": "AIが脚本や映像を作れるようになると、俳優や監督は「自分の仕事とは何か」を考え直さざるをえません。拒む、取り込む、新しく作り直す、という3つの向き合い方を、当事者の言葉から描き出しています。", "unverified": "なし"}}, {"id": "jn27", "rank": 27, "field": "機械学習", "headline": "大域意味と局所証拠を合わせた長文脈圧縮", "title": "HyCo 2 : Hybrid Context Compression with Global Semantics and Local Evidence", "url": "https://doi.org/10.1145/3859881", "authors": "Huanxuan Liao ほか", "venue": "ACM Transactions on Information Systems", "date": "2026-10-22", "sjr": 1.932, "citescore": 17.9, "citescore_year": "2025", "why": "長文脈推論の費用と脆さに対し、大域的な意味と局所証拠を組み合わせて文脈を圧縮する手法を示した。", "explain": {"basis": "抄録", "basis_note": "ACM Transactions on Information Systemsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "長文脈の圧縮を、文書全体の意味を表すソフトトークンと、決め手の証拠となる元のトークンに予算を配分する問題として定式化し、HyCo2を提案した（抄録）。", "p3": "ハイブリッドのアダプタによる指示を意識したソフトトークンと、軽い証拠経路で選んだ元のトークンを組み合わせる。経路ごとの再構成・補完の事前学習の後、自己蒸留つきの指示調整で一緒に学習する（抄録）。", "p5": "7つの知識集約型の課題で評価した（数値は抄録の取得範囲外）（抄録）。", "fun": "長い資料をAIに読ませるとき、要約だけでは細かな事実が抜け、抜き出しだけでは全体の話が見えなくなります。この方法は「要約」と「原文の抜き書き」を限られた枠の中で両方使うことで、そのいいとこ取りを狙っています。", "unverified": "性能の数値は未確認。"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "LLMで強化したグラフ対照学習で技術の流れを予測", "title": "LLM-enhanced Graph Contrastive Learning for Technology Flow Forecasting", "url": "https://doi.org/10.1145/3859876", "authors": "Huijie Liu ほか", "venue": "ACM Transactions on Information Systems", "date": "2026-10-22", "sjr": 1.932, "citescore": 17.9, "citescore_year": "2025", "why": "技術の相互利用を予測するため、LLMの知識をグラフ対照学習に組み込んだ。", "explain": {"basis": "抄録", "basis_note": "ACM Transactions on Information Systemsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ある技術が別の技術に使われるかを予測する技術の流れの予測で、LLMを使ったグラフ対照学習LGCLを提案し、分野をまたぐ予測を扱えるようにした（抄録）。", "p3": "異分野の技術間の意味の隔たり、分野間の過去の流れの疎さ、分野内と分野間の流れの型の違いの3つの課題に対し、偏りを意識したLLMの表現などを組み込む（抄録）。", "p5": "抄録の取得範囲では、比較の数値結果は確認できなかった（抄録）。", "fun": "電池の技術が医療機器に使われるように、技術は分野を越えて流れていきます。言葉の意味を理解できるLLMを使って、離れた分野の技術どうしの「相性」を見つけようとする発想が面白いところです。", "unverified": "評価データと結果は未確認。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "普遍的な電荷密度予測の効率的な等変枠組み", "title": "Efficient equivariant framework for universal charge density prediction", "url": "https://doi.org/10.1038/s42256-026-01326-5", "authors": "Xiwen Li ほか", "venue": "Nature Machine Intelligence", "date": "2026-10-23", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "why": "材料の電荷密度を予測する等変ニューラルネットの効率的な枠組み（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Nature Machine Intelligenceの抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "等変グラフニューラルネットEdenGNNで、PAW法の精度の電子構造計算に使える電荷密度を、既存の普遍モデルより1桁以上速く予測する（抄録）。", "p3": "擬電荷密度に加えて補強の占有数も予測し、完全に学習可能な動径基底の基底展開と、電荷移動を捉えるΔ学習を用いる（抄録）。", "p5": "既存の普遍的な電荷密度モデルより1桁以上速く、PAWの精度で電子構造を再構成できるとする（詳細は抄録の取得範囲外）（抄録）。", "fun": "物質の性質を計算する密度汎関数理論では、電子がどこにどれだけいるかという「電荷密度」が主役です。その計算をAIで先回りして予測し、しかも本格的な計算に使える精度で高速に出せるようにした点が強みです。", "unverified": "学習データ（Materials Projectと推定される）と精度の数値は未確認。"}}, {"id": "jn30", "rank": 30, "field": "機械学習", "headline": "生物と人工のニューラルネットに共通する表現軸", "title": "Privileged representational axes in biological and artificial neural networks", "url": "https://doi.org/10.1038/s41562-026-02515-3", "authors": "Meenakshi Khosla ほか", "venue": "Nature Human Behaviour", "date": "2026-10-23", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "生物と人工のニューラルネットで特権的な表現の軸が共通するかを扱う（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Nature Human Behaviourの抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "視覚と聴覚で、脳と深層畳み込みネット（DCNN）はともに自然界を表すのに特定の表現の軸を一貫して好み、その軸は互いに揃っていることを示した（抄録）。", "p3": "脳とDCNNの神経応答の調律（軸）の整列を検定する方法を開発した（抄録）。", "p5": "脳もDCNNも特定の軸を好み、自然入力で学習したDCNNの軸は知覚皮質の軸と揃っていた。軸に敏感な類似度はモデルの判別に優れ、特定の軸を好む符号化は配線の費用を減らし汎化を改善しうる（抄録）。", "fun": "神経細胞の集団の情報は回転させても同じとみなされがちでしたが、実は脳もAIも「この向きの軸」を特別扱いしていました。しかも自然の写真や音で育ったAIは、脳と同じ軸を選んでいたという一致が驚きです。", "unverified": "対象とした脳のデータの種類は未確認。"}}, {"id": "jn31", "rank": 31, "field": "組織行動・心理的安全性", "headline": "弁護士は道徳的アイデンティティで依頼人を説得", "title": "“We’re Not Handling Cases, We’re Shaping Lives”: How Lawyers Preserve Professional Authority and Advance Social Responsibility via Moral Identity-Based Client Persuasion", "url": "https://doi.org/10.5465/amj.2025.0366", "authors": "Siyin Chen ほか", "venue": "Academy of Management Journal", "date": "2026-10-22", "sjr": 10.781, "citescore": 19.8, "citescore_year": "2025", "why": "弁護士が専門的権威を保ちつつ社会的責任を進める説得の過程を扱うAMJの研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、弁護士が道徳的アイデンティティに基づく依頼人の説得を通じて、専門的権威を保ちつつ社会的責任を進める過程を扱う研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、専門家が依頼人の言いなりにならず、しかも社会に良い方向へ導くには、どんな説得の仕方があるかということです。「事件を扱うのではなく人生を形づくる」という言葉に、その答えのヒントがありそうです。", "unverified": "方法・結果はすべて未確認。"}}, {"id": "jn32", "rank": 32, "field": "経営学", "headline": "組織のメンタルヘルス対応能力を築く", "title": "Breaking the Silence: Developing an Organizational Mental Health Capability", "url": "https://doi.org/10.5465/amr.2023.0182", "authors": "Abbie Griffith Oliver ほか", "venue": "Academy of Management Review", "date": "2026-10-22", "sjr": 9.996, "citescore": 19.5, "citescore_year": "2025", "why": "組織が沈黙を破りメンタルヘルスに対応する能力を理論化するAMRの論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、組織がメンタルヘルスについての沈黙を破り、組織としてのメンタルヘルス対応能力を築く過程を理論化する研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、心の不調を個人の問題として黙って済ませるのではなく、組織の「能力」として扱えるか、ということです。働く人の心の健康を会社の仕組みの問題として捉え直す視点が興味深いところです。", "unverified": "理論の内容はすべて未確認。"}}, {"id": "jn33", "rank": 33, "field": "経営学", "headline": "市場支配力の時代の産業政策", "title": "Industrial policy in times of market power", "url": "https://doi.org/10.1016/j.respol.2026.105638", "authors": "Domenico Delli Gatti ほか", "venue": "Research Policy", "date": "2026-10-23", "citescore": 17.6, "citescore_year": "2025", "why": "市場支配力が強い時代の産業政策を論じるResearch Policyの論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、少数の企業が市場支配力をもつ時代に、産業政策がどうあるべきかを論じる研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、政府が特定の産業を応援するとき、すでに強い大企業をさらに強くしてしまわないか、ということです。競争と育成のバランスという、各国が悩む課題に向き合う論文と考えられます。", "unverified": "内容はすべて未確認。"}}, {"id": "jn34", "rank": 34, "field": "統計学", "headline": "因子モデルに基づく時間変化する重複クラスタリング", "title": "A Factor Model Based Time-Varying Auto-Align Overlapping Clustering", "url": "https://doi.org/10.1080/01621459.2026.2742483", "authors": "Yanxin Jin ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-23", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "時間とともに変わる重複クラスタを因子モデルで推定するJASAの論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、因子モデルに基づき、時間とともに変わり、重なりも許すクラスタリングを自動で揃えて推定する方法の研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、一つの対象が複数のグループに同時に属し、しかもそのグループ分けが時間とともに変わる場合に、どう仲間分けを推定するかということです。株価や地域のデータなどに使えそうな問題設定です。", "unverified": "手法・結果はすべて未確認。"}}, {"id": "jn35", "rank": 35, "field": "物理学", "headline": "自律的な量子誤り訂正で損益分岐点を超えた", "title": "Beating the break-even point with autonomous quantum error correction", "url": "https://doi.org/10.1038/s41567-026-03486-y", "authors": "Yi Li ほか", "venue": "Nature Physics", "date": "2026-10-23", "sjr": 6.581, "citescore": 29.4, "citescore_year": "2025", "why": "自律型の量子誤り訂正で論理量子ビットの寿命が損益分岐を超えたとするNature Physicsの成果（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "単一の捕捉イオンの複数の内部スピン状態に論理量子ビットを符号化し、測定もフィードバックも使わない自律的な量子誤り訂正で、量子ビット寿命の損益分岐点を超えた（抄録）。", "p3": "設計したスピンと運動の結合で誤りによるエントロピーを運動モードに移し、補助イオンとの共同冷却で散逸させる（抄録）。", "p5": "この自律的な誤り訂正の手順を繰り返し適用し、論理量子ビットの寿命が損益分岐点を上回った（具体的な寿命の数値は抄録の取得範囲外）（抄録）。", "fun": "量子コンピュータの誤りを直すには、ふつう誤りを測って直す操作を何度も繰り返す必要があります。この研究は、誤りを原子の揺れに移して冷やして捨てるという方法で、測らずに自動で直すことに成功し、直さない場合より長く情報を守れました。", "unverified": "寿命の延長の倍率は未確認。"}}, {"id": "jn36", "rank": 36, "field": "物理学", "headline": "量子計算機で粒子衝突を模擬する", "title": "Particle collisions on a quantum computer", "url": "https://doi.org/10.1038/s41567-026-03490-2", "authors": "Torsten V. Zache", "venue": "Nature Physics", "date": "2026-10-23", "sjr": 6.581, "citescore": 29.4, "citescore_year": "2025", "why": "量子計算機上で粒子衝突を再現する研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、量子計算機の上で素粒子の衝突を模擬する研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、巨大な加速器で起きる粒子の衝突を、量子計算機の中で再現できるかということです。普通の計算機では難しい量子の世界の計算に、量子計算機が役立つかを試す代表的な課題です。", "unverified": "手法・結果はすべて未確認。"}}, {"id": "jn37", "rank": 37, "field": "物理学", "headline": "ハニカム反強磁性体のフォノン・ホール効果の起源", "title": "Thermodynamic origin of the phonon Hall effect in a honeycomb antiferromagnet", "url": "https://doi.org/10.1126/science.adt1992", "authors": "Qingkai Meng ほか", "venue": "Science", "date": "2026-10-22", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "ニッケル系の絶縁体で大きな熱ホール伝導度を測り、フォノン・ホール効果の熱力学的起源を示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ハニカム層の反強磁性体NiPS3で大きな熱ホール伝導度を測り、フォノンによる熱ホール効果が内因的な起源をもつことを示した（抄録）。", "p3": "縦の熱伝導度κaaと横の熱伝導度κabの温度依存性、熱ホール角、b軸方向の磁化、フォノンの平均自由行程との関係を調べた（抄録）。", "p5": "κaaとκabは同じ温度でピークになり、ピークでの熱ホール角は既知の上限に従った。κabの大きさはb軸方向の磁化に極めて敏感だが、フォノンの平均自由行程とは相関せず、内因的な起源を示した（抄録）。", "fun": "電気を流さない物質でも、磁場をかけると熱が横に曲がって流れることがあります。熱を運ぶのは原子の振動（フォノン）ですが、なぜ曲がるのかは謎でした。この研究は、その原因が不純物での散乱ではなく、物質そのものの性質にあることを示しました。", "unverified": "なし"}}, {"id": "jn38", "rank": 38, "field": "材料科学", "headline": "自己組織化単分子膜の分離堆積で柔軟太陽電池モジュール", "title": "Decoupled self-assembled monolayer and perovskite deposition for efficient flexible solar modules", "url": "https://doi.org/10.1126/science.aef9745", "authors": "Yeyong Wu ほか", "venue": "Science", "date": "2026-10-22", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "柔軟なペロブスカイト太陽電池モジュールの効率と安定性を上げる成膜法を示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "自己組織化単分子膜（SAM）とペロブスカイトの堆積を分離する共堆積法で、柔軟なペロブスカイト太陽電池モジュールの効率と安定性を高めた（抄録）。", "p3": "SAMとペロブスカイトの相互作用を弱めてSAMの固定を速め、ペロブスカイトの結晶化を改善する（抄録）。", "p5": "面積750cm²のモジュールで認証効率20.2%。別の不動態化剤で面積14.55cm²の素子は効率22.0%で、85℃・相対湿度65%の最大電力点追従1,044時間後に8%低下した。柔軟携帯型モジュールの国際的な商用化評価の全項目に合格した（抄録）。", "fun": "曲げられる太陽電池は軽くて持ち運びやすい一方、硬い基板のものより性能が落ちがちでした。原因は膜を作る順番の中での「相性の悪さ」にあり、それを切り離すだけで大きな面積でも高い効率と耐久性が得られた点が見事です。", "unverified": "なし"}}, {"id": "jn39", "rank": 39, "field": "物理学", "headline": "対称性の破れたチャーン絶縁体の可視化", "title": "Visualizing symmetry-broken Chern insulators and their quantum melting", "url": "https://doi.org/10.1126/science.aef0940", "authors": "Minhao He ほか", "venue": "Science", "date": "2026-10-22", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "モアレ物質のホフスタッター構造で、対称性の破れたチャーン絶縁体とその量子融解を直接観察した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "六方晶窒化ホウ素と揃えた2層グラフェンのホフスタッター状態を走査トンネル顕微鏡で観察し、相互作用による対称性の破れたチャーン絶縁体を直接可視化した（抄録）。", "p3": "磁場下のモアレ物質で生じるホフスタッター・スペクトルの状態を、走査トンネル顕微鏡で空間的に観察した（抄録）。", "p5": "ホフスタッター帯の分数充填で、モアレ単位胞を2・3・4倍にする相や、単位胞内の複雑な波動関数をもつ状態を観察した。トポロジカル欠陥の出現と増殖による量子融解と、相の競合・分離を伴う量子転移を可視化した（抄録）。", "fun": "2枚の原子のシートを少しずらして重ねると、模様の周期（モアレ）が電子に新しい性質を与えます。電子同士の押し合いで生まれる秩序と、その秩序が欠陥によって溶けていく様子を、原子の目で直接見た点がすごいところです。", "unverified": "なし"}}, {"id": "jn40", "rank": 40, "field": "材料科学", "headline": "動的機能でナノ流路の高速・選択的輸送", "title": "Dynamic functionality–enabled fast and selective transport in nanochannels", "url": "https://doi.org/10.1126/science.aed8319", "authors": "Hao Zhang ほか", "venue": "Science", "date": "2026-10-22", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "極小の閉じ込めの下で速く選択的な物質輸送を実現するナノ流路の設計を示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ナノ流路の内側の官能基の自転のような動きを利用して、閉じ込めの下での物質輸送を速く選択的にできることを示した（抄録）。", "p3": "実験とシミュレーションを組み合わせ、閉じ込められた官能基の内在的な動きが輸送に与える影響を調べた（抄録）。", "p5": "流路の動きは運動エネルギーの受け渡しを促し、より効率的な分子のリレーを可能にして、分離性能を現在の基準以上に高めた（抄録）。", "fun": "とても狭い管の中では、分子は壁にこすれたりくっついたりして進みにくくなります。そこで壁をじっとさせず、くるくる回る部品で分子をバトンのように送り出させたら速く通るようになった、という逆転の発想が面白い研究です。", "unverified": "分離性能の数値は未確認。"}}, {"id": "jn41", "rank": 41, "field": "天文学", "headline": "赤色巨星の近接惑星が生き残る謎", "title": "The survival paradox of close-in planets orbiting red-clump giants", "url": "https://doi.org/10.1073/pnas.2603847123", "authors": "Wen-Xu Lin ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-22", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "潮汐による呑み込み理論に反して、赤色巨星の近くを回る惑星が存在する理由を扱った。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "中心でヘリウムを燃やす赤色巨星（レッドクランプ星）の近くを回る、本来なら呑み込まれているはずの惑星を3つ報告した（抄録）。", "p3": "星震学で主星がレッドクランプ星であることを確かめ、惑星の軌道半径を赤色巨星分枝の時期の最大の恒星半径と比べた（抄録）。", "p5": "24 Boo b、HD 12648 b、TYC 4282-605-1 bの3つの惑星は、過去の最大恒星半径より内側の軌道にある。24 Boo bは0.183au・周期30日で、この種の星のまわりで最も近い既知の惑星である（抄録）。", "fun": "年老いた星は一度大きくふくらみ、近くの惑星を飲み込むと考えられています。ところが、ふくらんだ星の半径より内側を回る惑星が3つも見つかりました。星や惑星の一生について、まだ知られていない仕組みがあることを示しています。", "unverified": "惑星が生き残った仕組みの候補は未確認。"}}, {"id": "jn42", "rank": 42, "field": "認知科学", "headline": "まばたきは頭の動きと戦略的に連動する", "title": "Blinks are strategically coupled with head movements in unconstrained natural gaze behavior", "url": "https://doi.org/10.1073/pnas.2625566123", "authors": "Alexander Goettker ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-22", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "自然な視線行動で、まばたきが頭部運動と結びついて視覚の中断を抑えていることを示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "自然な視線行動の大規模データで、まばたきは頭の動きと戦略的に連動し、視覚情報の損失を抑えていることを示した（抄録）。", "p3": "2つの自然な課題での拘束のない視線行動のデータで、頭の速度と頭の動き始めに対するまばたきの確率の時間変化を調べた（抄録）。", "p5": "まばたきの確率は頭の速度が大きいほど上がり、頭の動き始めの前に下がって動きの最中にピークになった。普段のまばたきが多い人ほど同期が強かった（抄録）。", "fun": "まばたきは起きている時間の最大1割も視界を途切れさせますが、私たちはほとんど気づきません。その秘密の一つは、どうせ景色がぶれて見にくい「頭を振っている最中」にまばたきをまとめていることでした。体がうまく損を減らしているのです。", "unverified": "データの人数は未確認。"}}, {"id": "jn43", "rank": 43, "field": "教育", "headline": "停学禁止は障害のある生徒の扱いを変えたか", "title": "Disability as Discipline? Effects of the New York City Suspension Ban on Students With Disabilities", "url": "https://doi.org/10.3102/01623737261481804", "authors": "Jo R. King", "venue": "Educational Evaluation and Policy Analysis", "date": "2026-10-23", "sjr": 2.11, "citescore": 5.8, "citescore_year": "2025", "why": "ニューヨーク市の停学禁止が、障害認定など学校の対応戦略をどう変えたかを検証した。", "explain": {"basis": "抄録", "basis_note": "Educational Evaluation and Policy Analysisの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ニューヨーク市の停学禁止は、停学の代わりに障害の認定（特別支援教育の分類）を増やし、該当した生徒の成績を大きく下げたことを示した（抄録）。", "p3": "停学禁止の導入前後で、停学の意図しない代替としての特別支援教育の分類の利用を分析した（抄録）。", "p5": "禁止によって障害の分類、とくに社会的偏見の強い分類が増えた。そうした分類を受けた生徒は平均して試験成績が大きく下がった（抄録）。", "fun":     if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
