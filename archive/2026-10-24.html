ily Papers", "date": "2026-10-23", "apa": "Liang, T., Pan, J., Li, Y., Fu, C., Huang, Z., Sun, C., Li, C., & Lyu, J. (2026). WeVisOne-VL: Unified Visual Perception from Objects to Pixels (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31329", "why": "細かな視覚知覚が苦手な視覚言語モデルの弱点に対し、物体から画素まで扱う統一モデルを示した。HFで最多の投票。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データエンジン§2、モデル設計§3、学習§4、物体検出の結果§5.1.1と表2、限界§8、結論§9）を読んだ", "preprint": true, "p1": "物体検出、指示語による位置特定、計数、OCR、セグメンテーション、マッティング（髪の毛のような細部の透明度の切り出し）を、一つの視覚言語モデル（VLM）の構造化された次トークン予測でまとめて扱えるようにしたWeVisOne-VLを公開した（未査読プレプリント、HFで最多の投票）。", "p2": "既存のVLMは画像の大まかな理解は得意でも、細かな視覚的知覚（正確な位置、多数の小さな物体、画素単位の輪郭）には信頼できず、物体ごとと画素ごとの課題が別々のモデルで扱われていた（抄録、§1）。", "p3": "Qwen3-VLを土台に、座標トークンで箱や点を出力し、特別な<OBJ>トークンの隠れ状態と予測した箱を軽量な画素デコーダに渡して、インスタンスごとのマスクやアルファマットを生成する（§3、図4）。学習は3段階のカリキュラムの教師あり微調整の後、課題を混ぜた強化学習で、位置の精度を上げ、繰り返しや幻覚の予測を抑える（§4）。専用のデータエンジンで概念の発見、注釈、難例の作成を行った（§2）。", "p4": "30以上のベンチマークで評価した。物体検出ではCOCO・LVIS（ゼロショット）、密で小さな物体のDense200・VisDroneを使い、生成型のVLMには信頼度が出ないためAPの代わりに、IoU閾値0.5〜0.95で平均したF1を指標にした（§5.1.1）。対象物がない質問への拒否率も見た（表3）。", "p5": "表2で、WeVisOne-VL-4Bの平均F1はCOCO 57.1、LVIS 55.3、Dense200 71.3、VisDrone 44.7で、同規模のQwen3-VL-4B（48.7、44.0、15.2、31.0）やLocateAnything-3B（54.7、50.7、58.7、39.9）を上回った。とくに多数の小さな物体が密集するDense200で差が大きかった。厳しいIoU 0.95でも高く、位置の正確さも示した（§5.1.1）。参照セグメンテーションとマッティングでも評価した基準を上回った（§9）。", "p6": "著者は、汎用の学習データが少なく元のモデルの一般能力を損ないうること、効率のため思考の連鎖を使わず複雑な推論に弱いこと、1回きりの予測に限られること、実際の利用者の曖昧な指示への対応が課題であることを認める（§8）。", "fun": "「この写真の中で赤い服の人の髪の毛だけを切り抜いて」のように、場所を指す細かさを点から画素まで自由に変えられるAIです。言葉で答えるAIに、輪郭を描くための小さな部品をつなげ、「ここに物がある」という合図の記号を橋渡しにした点が工夫です。群衆の中の小さな人を数える課題で特に強くなりました。", "unverified": "OCR・計数・マッティングの表（表4〜8）の数値は読んでいない。"}}, {"id": "pn12", "rank": 12, "field": "因果推論", "headline": "媒介変数で因果効果の移送を効率化", "title": "More efficient transportation of causal effects using mediators", "url": "https://arxiv.org/abs/2610.31568", "authors": "Xinyi Zhang ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Zhang, X., Rudolph, K. E., Pike, J. R., Liu, R., Santacatterina, M., & Díaz, I. (2026). More efficient transportation of causal effects using mediators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31568", "why": "対象集団への平均処置効果の移送に媒介変数を使い、識別と効率を高める半パラメトリック推定量を開発した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、識別§2.2〜2.4、推定量§4、応用§6.1〜6.2、考察§7、図3〜4）を読んだ", "preprint": true, "p1": "研究集団（ソース）で得た因果効果を別の集団（ターゲット）へ移すとき、媒介変数と中間交絡を考慮しつつ、集団差の理由についての知識や選択スコアを使って推定を効率化する半パラメトリック推定量を開発した（未査読プレプリント）。", "p2": "効果の移送の方法の多くは、集団間の効果の違いが効果修飾因子の分布の違いだけから生じると仮定する。しかし処置の受け入れ（服薬遵守など）のように、処置の影響を受ける媒介変数の分布が集団で違うことも効果の違いの原因になる（§1）。", "p3": "媒介変数と中間交絡を含む因果選択図（図1〜2）の下で識別を示す。仮定A6は、ベースライン共変量Wの変換V（例：一部の変数）が集団の違いを説明しつくす（S ⊥ W | V）というもので、このときターゲットの平均処置効果は λ = E{E[f(W)|V] | S=0} と識別され、全共変量を使う推定より効率が上がりうる（命題1、§2.3）。知識がないときは選択スコアを使う協調型の推定量τを導入する（§2.4）。条件付き処置効果（CATE）の二重頑健な変換と、1ステップ推定量で推定する（§4）。", "p4": "シミュレーションで、従来の推定量θに対する分散比（1未満なら効率的）と偏りを比べた（表3）。応用は、住宅バウチャーの無作為化実験MTO（NYC・シカゴからLAへ移送、男子の気分障害のリスク）と、聴覚介入の臨床試験ACHIEVE（ARIC群から新規群へ移送、3年後の認知機能）（§6）。", "p5": "MTOでは協調型の推定量τの信頼区間がθとλより目に見えて狭く、λはθと同程度だった。全ての点推定はターゲット（LA）で観察された効果の方向へ動き、推定量間の点推定の差は信頼区間が大きく重なる範囲だった（§6.1.4、図3）。ACHIEVEでもτの区間が狭く、移送した推定は新規群の観察されたゼロ効果と整合した（§6.2.4、図4）。著者はλの効率改善が小さかった理由を、選んだVがCATEの強い予測因子だったためと説明する。", "p6": "著者は、多変量で連続の媒介変数では数値積分が必要で計算が重いこと、協調型推定量の正則性の欠如とその実際上の帰結が未解明であることを挙げる（§7）。", "fun": "ある町で効果のあった住宅支援策が、別の町でも同じように効くとは限りません。その理由が住民の特徴の違いだけでなく、「支援を実際に使う人の割合」の違いにもあるなら、それを経由した影響まで考えて効果を移し替える必要があります。この研究は、町の違いを生む要因を絞り込むことで、移し替えの推定を精密にしました。", "unverified": "シミュレーションの分散比の具体値（表3）は読み取れておらず未確認。"}}, {"id": "pn13", "rank": 13, "field": "人口学", "headline": "定年延長・世代間移転と出生", "title": "Delayed Retirement, Intergenerational Transfers, and Fertility", "url": "https://doi.org/10.2139/ssrn.7654780", "authors": "Yi Fan ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Fan, Y., Song, S., & Yu, Y. (2026). Delayed Retirement, Intergenerational Transfers, and Fertility. https://doi.org/10.2139/ssrn.7654780", "why": "中国の段階的定年延長が、祖父母の子育て支援を通じて出生に与える影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "中国の段階的な定年延長（2025年開始）が、高齢者の就業を増やす一方で祖父母による孫の世話を減らし、子世代の出生と高齢者の厚生を下げることを、構造モデルの反実仮想シミュレーションで示した（未査読プレプリント、抄録）。", "p2": "高齢化と少子化が同時に進み、労働供給と年金制度を圧迫している。定年延長の評価は高齢者の就業への直接効果に注目しがちで、世代間の移転を通じた出生への影響は考慮されてこなかった（抄録）。", "p3": "高齢者の引退、世代間の移転（金銭と育児の時間）、成人した子の出生の決定を含むモデルを作り、改革前の法定退職年齢での引退の不連続をファジー回帰不連続で使ってパラメータを推定する。改革は男性、女性幹部、女性労働者で生年コホートごとに異なる日程で退職年齢を上げる（抄録）。", "p4": "推定したモデルで、改革が成熟したコホートについての反実仮想を計算し、就業、金銭移転、祖父母の育児、出生、厚生を比べた。完全に柔軟な引退、強制的な部分引退、強制的な全時間就業、育児補助の代替政策も比べた（抄録）。", "p5": "改革は高齢者の就業と子への金銭移転を増やすが祖父母の育児を減らし、育児の減少が金銭移転の増加を上回るため出生と高齢者の厚生が下がり、とくに低所得の女性で損失が大きかった。代替の引退制度はどれも、出生と厚生を同様に下げずに就業を上げることはできなかった。育児補助は出生と厚生の低下を相殺でき、女性や低所得の女性に対象を絞ると補助率は高くなるが平均の財政支出は減る（抄録）。", "p6": "抄録からは、効果の大きさ、モデルの識別に使う変動の詳細、親子の居住の近さの扱いが分からない。残る疑問：構造モデルの結論は、祖父母の育児と出生の関係の定式化に強く依存するとみられる（解釈）。", "fun": "定年を延ばせば働く高齢者が増えて年金の助けになりますが、そのぶん孫の世話をするおじいちゃん・おばあちゃんが減ります。この研究は、その影響が若い夫婦の「もう一人産むかどうか」にまで及び、少子化を進めてしまう可能性を示しました。政策の効果が世代をまたいで連鎖する様子が見えてきます。", "unverified": "出生と厚生の変化の大きさの数値は未確認（本文を入手できず）。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "複雑なエージェント記憶より素朴なRAGが強い", "title": "Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought", "url": "https://arxiv.org/abs/2610.30755", "authors": "Zhengye Bao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Bao, Z., Zhang, S., Zhang, H., Lou, S., Wen, M., & Luo, M. (2026). Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30755", "why": "長期会話理解で、複雑なエージェント型記憶より単純なRAGのほうが強い場合があることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（Raw-RAGの構成§3、ベンチマークと比較対象§4.1、分析§5.1、限界と結論§6）を読んだ。主結果の表の各数値は読み切れていない", "preprint": true, "p1": "長期の会話記憶の課題で、生の会話履歴に密検索と再ランキングをかけるだけの素朴なRAG（Raw-RAG）が、複雑なエージェント型記憶システムより多くの場合に強いことを示した（未査読プレプリント）。", "p2": "エージェント型の記憶システムは記憶の書き換え、構造化（グラフなど）、学習した検索戦略などの複雑な操作を使うが、その複雑さが本当に必要かは、よく設計した素朴な基準と比べて確かめられていなかった（§1）。", "p3": "Raw-RAGはLLMによる抽出・要約・グラフ構築をせず、会話をタイムスタンプと画像キャプションつきで256トークンの窓（32トークンの重なり）に分けて平らな索引に入れる。質問の埋め込みとの余弦類似度で上位128窓を取り、クロスエンコーダで質問と窓の組を採点して上位15を選び、読み手のLLMに渡す。時系列や状態の変化の解釈は読み手に任せる（§3）。", "p4": "LoCoMo（1,540問）、LongMemEval（500例）、MEME（1,188問）、MemoryAgentBench（2,071問）の4つで、EverMemOS、MemOS、Mem0、MemMachineなど多数のエージェント型記憶システムと比べた（§4.1）。原因の分析では、必要な証拠の網羅率と、渡された証拠を読み手が使えた割合（利用率）を測った（§5.1、表7）。", "p5": "7つのベンチマーク×モデルの設定のうち6つでRaw-RAGが1位で、最強のエージェント型記憶を0.13〜5.53ポイント上回った（抄録）。表7では、例えばMemUは網羅率19.07%・利用率89.37%で、構造化された記憶は利用率が高くても網羅率が低い。著者は、Raw-RAGは利用率の低さを高い網羅率で補っており、役立つ証拠には答えの値だけでなく導出に必要な関係や依存の経路が含まれると分析する（§5.1〜5.2）。変換した記憶を完全に参照しても生の証拠との精度差は残った（抄録）。", "p6": "著者は、公開ベンチマークのオフラインの会話に限られ、対話的・マルチモーダルな設定は未検証であること、生の履歴を保存することの容量とプライバシーの問題、性能が読み手のLLMの能力に依存することを認める（§6.1）。", "fun": "AIに長い会話を覚えさせるため、要点をまとめたり関係図を作ったりする凝った記憶の仕組みが次々に作られています。ところが、会話をそのまま保存して必要なところを探して読ませるだけの単純な方法のほうが、ほとんどの試験で勝ちました。まとめる途中で、答えを導くのに必要な細かなつながりが失われてしまうらしいのです。", "unverified": "ベンチマーク別のRaw-RAGの正答率（表）とRaw-RAGの網羅率の値は読み切れておらず未確認。"}}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "市場が未知のときの価格差別の限界", "title": "The Limits of Price Discrimination When the Market Is Unknown", "url": "https://arxiv.org/abs/2610.30408", "authors": "Irfan Tekdir", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Tekdir, I. (2026). The Limits of Price Discrimination When the Market Is Unknown (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30408", "why": "需要分布が未知のとき、市場分割で実現できる消費者・生産者余剰の組を特徴づけた理論研究。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、主結果§3、連続値§4、結語§5）を読んだ", "preprint": true, "p1": "需要の分布が未知で、消費者の評価値の取りうる集合だけが分かっているとき、価格差別（市場分割）で実現しうる消費者余剰と生産者余剰の組全体が凸多角形になることを示し、その外縁を明示した理論研究（未査読プレプリント）。", "p2": "Bergemann, Brooks and Morris (2015)（BBM）は、評価値の分布が既知のとき分割で実現できる余剰の組が三角形になることを示した。しかし開示規則を作る規制当局や情報を出すプラットフォームは、多くの市場に一つの方針を決めるため分布を知らないことが多い（§1）。", "p3": "全ての市場についてのBBMの三角形の和集合を求める。鍵は2つ：市場が変わってよいなら、全ての市場と分割の結果の和集合は、分割しない市場の結果の凸包に等しい（補題1）。外縁は u = w̄(π) − π で、w̄(π)は一様価格の利潤がπ以下という上限の下で市場がもちうる最大の効率的余剰であり、切断した等収入分布の市場がそれを達成する（補題2、定理1）。解釈：利潤を低く抑えつつ市場の価値を最大にするには、売り手がどの高い価格でも無差別になる分布が必要になる。", "p4": "有限個の評価値の場合の多角形の頂点の計算と、分割が必要になる場所（§3.3〜3.4）、評価値が上限v̄までの連続体の場合（§4、線形需要の例）を分析する。", "p5": "有限の場合、多角形は評価値ごとに1つの頂点をもち、手計算できる。利潤が評価値の一つに等しいとき外縁は分割なしで達成され、2つの評価値の間では隣り合う評価値の外縁市場の2つに分けるだけでよい。連続体では、生産者余剰がπのとき消費者余剰は最大 π ln(v̄/π) で、分割なしに達成され、どの市場でも消費者余剰は v̄/e を超えない（抄録、§4〜5）。", "p6": "著者は、全ての市場で成り立つ消費者余剰の上限は、売り手のもつデータより、ありうる買い手の集団の形で決まると結論する（§5）。残る疑問：単一の売り手と単一の財の独占のモデルであり、競争や複数財への拡張は扱っていない（解釈）。", "fun": "お店が客ごとに値段を変える「価格差別」で客が得をするか損をするかは、客がどれくらいその品を欲しがっているかの分布で決まります。分布が分からなくても、客が払ってもよい金額の上限さえ分かれば、客の得は最大でも上限の金額をネイピア数eで割った額までだ、というすっきりした答えが出るのが面白いところです。", "unverified": "なし"}}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "進化し続けるAI分析者の生涯有効な決定", "title": "Lifetime-valid decisions by continually evolving AI analysts", "url": "https://arxiv.org/abs/2610.30562", "authors": "Xiaojing Sun ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Sun, X., Zeng, Y., & Wang, X. (2026). Lifetime-valid decisions by continually evolving AI analysts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30562", "why": "AIエージェントの検定の連続に対して、生涯にわたり誤りを制御する決定法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "更新され続けるAI分析者の各版を、帰無仮説下の模擬データで配備前に検証し、生涯にわたって第1種の過誤を制御する「継続的検証」を提案（抄録）。", "p3": "AIの分析者は内部に乱数をもち、時間とともに更新されるため、過誤率の高い版を承認するリスクが蓄積する。各版を、無作為化・拡張できる帰無の場面の模擬データで評価してから配備する（抄録）。", "p5": "更新の選び方や提案数によらず、許容水準を超える過誤率の版を一度でも配備する生涯の確率が上から抑えられることを証明した。過誤率が十分低い更新は検証を通る（抄録）。", "fun": "AIに何度も手直しを加えていくと、たまたまテストに受かった「ハズレの版」がいつか紛れ込みます。この研究は、手直しを何回しても、その事故が起きる確率を生涯を通じて一定以下に抑える仕組みを数学的に保証しました。", "unverified": "検証に必要な模擬データの量は抄録に記載がなく未確認。"}}, {"id": "pn17", "rank": 17, "field": "因果推論", "headline": "所属が観察できない高リスク集団の処置効果", "title": "Estimating Group Average Treatment Effects in High-Risk Populations with Unobserved Target Membership", "url": "https://arxiv.org/abs/2610.30709", "authors": "Shubo Zhang ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Zhang, S., Zhao, Y., Zeng, D., & Wang, Y. (2026). Estimating Group Average Treatment Effects in High-Risk Populations with Unobserved Target Membership (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30709", "why": "高リスク集団の所属が観察できない場合のグループ平均処置効果の推定法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高リスク集団の所属が観察できない、または小さい場合に、リスクスコアで重み付けしたソフトな対象化（RSW）でグループ平均処置効果を推定する（抄録）。", "p3": "所属確率を分析標本内で推定するか、参照モデルから得て対象集団を表し、全標本で二重頑健な処置効果を学習したうえで、リスク重みの分布で低次元の処置効果曲面を集計する。点ごとの漸近正規性と影響関数に基づく分散推定を示す（抄録）。", "p5": "連続・2値の結果のシミュレーションで、2つのハードな対象化の方法と同程度の偏りでより小さい分散だった（抄録）。", "fun": "「重症になりやすい人にだけ効く薬か」を調べたいのに、誰が重症化しやすいかが分からない、という難題に答える方法です。人を白黒で分けず、「どのくらい高リスクか」の確率で全員を少しずつ使うことで、推定を安定させています。", "unverified": "実データへの適用の有無は抄録からは未確認。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "確認できない仮定への主観ベイズ的対処", "title": "A Subjective Bayesian Approach to Address Unchecked Assumptions in a Causal Analysis", "url": "https://arxiv.org/abs/2610.31587", "authors": "Jaiyool Kim ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Kim, J., Bhattacharya, I., & Bradley, J. R. (2026). A Subjective Bayesian Approach to Address Unchecked Assumptions in a Causal Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31587", "why": "観察データの因果分析で検証できない仮定の影響を主観ベイズで扱う方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観察データの因果分析で検証できない仮定が崩れる可能性を、事後分布の2成分混合で表す主観ベイズの枠組みAMUAを提案（抄録）。", "p3": "仮定が成り立つ通常のモデルと、仮定の破れを許す柔軟なモデルを混合し、混合の重みπを分析者が事前確率として指定する。平均処置効果の95%HPD集合が0を除く最小のπを、新しい診断量π_minとして定義する（抄録）。", "p5": "空間的な構造をもつ未測定交絡のシミュレーションで評価した（結果の数値は抄録の取得範囲外）（抄録）。", "fun": "「交絡はない」という仮定が本当かどうかはデータからは分かりません。この方法は、その仮定をどのくらい信じれば結論が揺らがないかを一つの数字で示すので、結論の強さを読者が自分の信念と比べて判断できるようになります。", "unverified": "シミュレーションの結果は未確認（抄録が途中まで）。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "予測の不確実性を制御する計算機モデル較正", "title": "Prediction Uncertainty Controlled Computer Model Calibration", "url": "https://arxiv.org/abs/2610.31163", "authors": "Ryan Heejoon Byun ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Byun, R. H., Yoon, D., & Chang, W. (2026). Prediction Uncertainty Controlled Computer Model Calibration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31163", "why": "予測のための較正という目的に合わせて、予測不確実性を制御する較正法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "計算機モデルの較正を予測の誤差の制御に直接合わせ、条件付きフローマッチングと共形リスク制御を組み合わせた2層の枠組みを提案（抄録）。", "p3": "第1層で、構造の異なるガウス過程の不一致を加えたシミュレータ出力で較正パラメータの償却事後分布を学習する。第2層で事後のサンプルを入れ子の候補集合に並べ、時間平均の外れ率が規定値に達する最小の集合を選ぶ（抄録）。", "p5": "較正観測と目標観測の交換可能性の下で、帯の期待外れ率が有限標本で制御される。合成ベンチマークで評価した（数値は抄録の取得範囲外）（抄録）。", "fun": "シミュレーションのつまみを観測に合わせても、つまみが曖昧だったりモデルがずれていたりすると、予測の幅が当てにならなくなります。この研究は「予測が外れる割合」を最初から目標にして、その割合を保証する幅を作る発想に切り替えました。", "unverified": "合成ベンチマークでの比較結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "次元に依存しないランジュバン法の領域", "title": "Dimension-free regimes for unadjusted Langevin in ridge-separable models: A subspace robust Wasserstein analysis", "url": "https://arxiv.org/abs/2610.31431", "authors": "Yuansi Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, Y., Pedrotti, F., & Whalley, P. A. (2026). Dimension-free regimes for unadjusted Langevin in ridge-separable models: A subspace robust Wasserstein analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31431", "why": "未調整ランジュバン法が次元に依らず働く条件をワッサースタイン距離で解析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "未調整ランジュバン法（ULA）の偏りを部分空間頑健ワッサースタイン距離で解析し、次元に依存しない計算量になる領域とならない領域を示した（抄録）。", "p3": "平均と任意の低次元周辺分布を制御する距離で偏りを評価し、i.i.d.データによるリッジ分離型のポテンシャルについて、データ数Nと次元dの比に応じた高確率の上界を示す（抄録）。", "p5": "過剰パラメータ域では有効次元がNとなり、大標本域ではNが十分大きければ次元に依存しない。Nがdに比例する付近では、一般に次元に依存しない保証は不可能であることを証明した（抄録）。", "fun": "たくさんの変数をもつベイズ推定は、変数が増えるほど計算が遅くなると考えられてきました。この研究は「実際に知りたいのは平均や少数の変数だけ」と見方を変えると、次元の呪いを逃れられる場合と逃れられない場合を、データ数と次元の比で切り分けています。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "等張分布回帰の較正", "title": "On the Calibration of Isotonic Distributional Regression", "url": "https://arxiv.org/abs/2610.31258", "authors": "Tobias Biegert ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Biegert, T., Resin, J., Jordan, A., & Lerch, S. (2026). On the Calibration of Isotonic Distributional Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31258", "why": "非パラメトリックな確率予測法である等張分布回帰の較正性を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "等張分布回帰（IDR）の標本外の確率積分変換（PIT）値が有理数に偏り、トマエ関数に似た頻度の棘を示すという見落とされた現象を報告した（抄録）。", "p3": "気象データとシミュレーションで現象を示し、棘の原因を等張な当てはめの離散構造に結びつけて理論的に説明する（抄録）。", "p5": "PITの棘は等張回帰の離散性から生じ、平滑化によって緩和できることを論じた（抄録）。", "fun": "予報がよく較正されているかを調べるグラフに、なぜか特定の分数のところだけ棒が飛び出す奇妙な模様が現れます。その形が数学の教科書に出てくる「トマエ関数」にそっくりだという発見と、その仕組みの説明が面白い論文です。", "unverified": "平滑化の効果の大きさは未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "スペクトル自己教師学習は密度比推定で最適か", "title": "Is Spectral Self-Supervised Learning a Minimax Optimal Method of Density Ratio Estimation?", "url": "https://arxiv.org/abs/2610.31603", "authors": "Hiroki Waida ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Waida, H., & Kanamori, T. (2026). Is Spectral Self-Supervised Learning a Minimax Optimal Method of Density Ratio Estimation? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31603", "why": "スペクトル自己教師学習が密度比推定としてミニマックス最適かを理論的に検討した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "スペクトル自己教師学習による密度比推定が、正則化を加えるとヘルダー連続な密度比の一般クラスでミニマックス最適になることを示した（抄録）。", "p3": "ミニマックス最適性、正則化アルゴリズムへの理論の適用可能性、データ拡張の機構をもつ場合の統計的利点の3つの問いを理論的に調べる（抄録）。", "p5": "対数因子を除いてミニマックス最適な推定量が存在し、データ拡張の機構をもつ部分クラスではより速く、やはり最適な収束率が得られることを証明した（抄録）。", "fun": "画像を回転させたり色を変えたりする「データ拡張」は、自己教師学習でよく効くと経験的に知られています。この研究はその効き目を、推定がどれだけ速く正解に近づくかという統計の言葉で説明しようとしています。", "unverified": "なし"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "心理学でのベイズ推論・事前登録・公開データの普及", "title": "The Prevalence of Bayesian Inference, Preregistration, and Open Data in Psychology, 2004-2024", "url": "https://doi.org/10.31234/osf.io/ck3js_v3", "authors": "Julius M. Pfadt ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Pfadt, J. M., Bartoš, F., Godmann, H. R., Waaijers, M., Groot, L., Heo, I., Mensink, L., Nak, J., De Ruiter, J. P., Sarafoglou, A., Siepe, B. S., Akrong, E., Arena, G., Aust, F., van den Bergh, D., Brenner, W., Doekemeijer, R. A., Donzallaz, M. C., van Doorn, J., et al. (2026). The Prevalence of Bayesian Inference, Preregistration, and Open Data in Psychology, 2004-2024. https://doi.org/10.31234/osf.io/ck3js_v3", "why": "2004〜2024年の心理学論文でベイズ推論と開かれた科学の実践の普及を追跡した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2004〜2024年の心理学12誌の28,738本で、ベイズ推論・事前登録・データ公開の普及を追跡した（抄録）。", "p3": "上位6誌（15,634本）と中位6誌（13,104本）の全文を、人（50%）とLLM支援（50%）で符号化し、ベイズ型のロジスティック成長モデルで今後を予測した（抄録）。", "p5": "2024年の上位誌では26%がベイズ分析、41%が事前登録、73%がデータ公開を含み、中位誌では16%、18%、40%だった。2004〜2012年にはほぼ皆無だった（抄録）。", "fun": "心理学は「再現できない研究が多い」という危機を経て、わずか10年ほどで研究の作法が大きく変わりました。その変化を約3万本の論文で数えると、データを公開する論文が上位誌で7割を超えるまでになっていたことが分かります。", "unverified": "LLM符号化と人の符号化の一致度は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "思考の連鎖つきTransformerは重球加速を見つける", "title": "Transformers with CoT Discover Heavy-Ball Acceleration Through Training", "url": "https://arxiv.org/abs/2610.31089", "authors": "Yuxuan Cai ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Cai, Y., & Cao, Y. (2026). Transformers with CoT Discover Heavy-Ball Acceleration Through Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31089", "why": "学習によって思考の連鎖つきのTransformerが重球加速法に当たる手順を獲得することを理論的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "思考の連鎖（CoT）をもつTransformerが、勾配降下の教師を超えて、教えられていない重球法（Heavy-Ball）の加速を学習で獲得することを示した（抄録）。", "p3": "線形回帰の文脈内の重み予測課題で、まず勾配降下の教師でCoTを監督し、次に真の回帰重みで軌道全体を監督する（抄録）。", "p5": "追加の監督の後、モデルは重球法を実装し、元の教師より速く収束した。重球法の教師は一度も与えていない（抄録）。", "fun": "先生のまねをして解き方を覚えた生徒が、練習を重ねるうちに先生より速い解き方を自分で見つけた、という話を数学的に示した研究です。AIの推論が既知の手順の模倣を超えて新しいアルゴリズムを発見しうる、具体的な例になっています。", "unverified": "加速の度合いの定量値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "ニューラル多様体の意味の幾何", "title": "The Geometry of Meaning in Neural Manifolds", "url": "https://arxiv.org/abs/2610.30938", "authors": "Valentino Maiorca", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Maiorca, V. (2026). The Geometry of Meaning in Neural Manifolds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30938", "why": "異なるネットワークが互換性のない座標系で同じ機能を表すことを幾何として扱った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "独立に学習したニューラルネットの表現は座標系が違っても共通の幾何構造をもち、意味の対応を手がかりにゼロショットで変換できることを示す博士論文（抄録）。", "p3": "同じ意味内容を指す要素を同定する「意味の対応」を基本操作とし、任意の実装の対称性を破って共通の意味の枠に固定する。これに基づく14の貢献で対応に基づく整列を扱う（抄録）。", "p5": "対応により独立に学習したモデル間のゼロショット変換を可能にする内在的な幾何が明らかになると主張する（具体的な結果は抄録の取得範囲外）（抄録）。", "fun": "英語と日本語で単語は違っても同じ物を指せるように、別々に育ったAI同士も中身の「意味の地図」は似ているのではないか、という問いです。いくつかの共通の目印を合わせるだけで、片方の知識をもう片方に移せる可能性を示しています。", "unverified": "14の貢献の具体的な実験結果は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "一貫性は妥当性ではない：自己報酬の道徳議論", "title": "Consistency Is Not Validity: Self-Rewarded Moral Argumentation Makes Language Models Decisive but Pliable", "url": "https://arxiv.org/abs/2610.30349", "authors": "Marius De Kuthy Meurers ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Meurers, M. D. K., Parisi, A., & Bohnet, B. (2026). Consistency Is Not Validity: Self-Rewarded Moral Argumentation Makes Language Models Decisive but Pliable (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30349", "why": "道徳的議論を自己報酬で鍛えたLLMが決断的だが流されやすくなることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "良い道徳的議論に自己報酬を与える強化学習でLLMを鍛えると、判断は決断的で選択肢の順序に頑健になるが、迎合や言い換えへの弱さは残ることを示した（抄録）。", "p3": "古典小説から論理ソルバで葛藤を確認したジレンマを抽出し、方策自身が議論の質を対で判定する自己判定のトーナメントで学習する（思考は隠す）。MoralChoice、ELEPHANT、MORABLESで評価（抄録）。", "p5": "判定者の議論の質の評価は人の注釈者に近く、方策は報酬を与える言葉づかいを採用した。決断的で順序に不変になったが、迎合と言い換えは妥当性の課題として残った（抄録）。", "fun": "「上手に議論できれば正しく判断できる」という前提でAIを鍛えたら、迷わず答えるようにはなったものの、相手に合わせて意見を変える癖は直りませんでした。一貫していることと正しいことは違う、という題名の教訓がよく表れています。", "unverified": "各ベンチマークでの数値は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "エージェント型CLIのための疎なMoE基盤モデル", "title": "IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems", "url": "https://arxiv.org/abs/2610.30949", "authors": "A. Jian Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Yang, A. J., Huang, A., Dan, B., Mu, C., Yang, C., Shi, C., Chang, F., Li, H., Tao, H., Zhang, J., He, J., Wang, K., Jing, L., Yang, M., Hu, Q., Li, R., Liu, S., Guo, S., Qing, S., … Dai, B. (2026). IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30949", "why": "総パラメータ320Bの疎なMoEモデルでエージェント型CLIの基盤能力を高めた。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "総パラメータ320B（活性15B）の疎な混合専門家（MoE）モデルIQuest-Q1を、エージェント型のコマンドライン作業向けに開発し公開した（抄録）。", "p3": "安定した事前学習（Stable SplitNorm、Muon、muPと2段階のカリキュラム）、領域と文脈長を広げる中間学習、複数の足場・複数版での事後学習（SFT、領域特化RL、MOPD）の3段階に、モデル統合を組み合わせた（抄録）。", "p5": "コーディングと一般課題の両方で能力を示し、オープンソースで公開した（ベンチマークの数値は抄録に記載なし）（抄録）。", "fun": "巨大なAIの中に専門家の小部屋をたくさん作り、問題ごとに一部だけを動かすことで、大きさの割に軽く動かせるのがMoEの考え方です。この論文は、その作り方を学習の3段階に分けて詳しく公開している点に価値があります。", "unverified": "ベンチマークの成績は抄録に記載がなく未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "チャンク単位のパラメトリック記憶をLLMに融合", "title": "Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models", "url": "https://arxiv.org/abs/2610.25100", "authors": "Rubin Wei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Wei, R., Sun, S., Sun, H., Liu, Y., Shi, X., Wang, J., Zhang, J., & Lin, Z. (2026). Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25100", "why": "外部知識をチャンク単位のパラメトリック記憶として取り込む方法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "前の文脈から記憶を予測して中間の隠れ状態に融合するパラメトリック記憶DFMで、推論時の検索なしに外部知識を使えるようにした（抄録）。", "p3": "因果的な記憶予測器が、コーパスから検索したチャンク埋め込みを教師として、前の文脈から記憶を生成する。予測した記憶をチャンク内のトークンで共有し、ゲート付きの交差注意で隠れ状態に融合する。本体は凍結して端から端まで学習する（抄録）。", "p5": "トークン単位の記憶目標を作る既存手法より構築の作業量を減らした（性能の数値は抄録の取得範囲外）（抄録）。", "fun": "AIに新しい知識を覚えさせると昔の知識を忘れ、毎回調べさせると遅くなる、という板挟みがあります。この方法は「次に必要になりそうな知識」を文脈から予想して頭の中に直接差し込むことで、その両方を避けようとしています。", "unverified": "既存手法との性能比較の数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "推論モデルの「wait」は継承されたもの", "title": "Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models", "url": "https://arxiv.org/abs/2610.30882", "authors": "Zhizhuo Kou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Kou, Z., Hou, S., Chen, L., Yang, J., Luo, J., Peng, J., Zhang, W., Han, S., & Guo, Y. (2026). Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30882", "why": "強化学習が教えたとされる「wait」の出所を追跡し、事前学習からの継承であることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "推論モデルが書く「wait」は強化学習が発明したのではなく、訓練データから受け継がれたものであることを、公開モデルの学習履歴で追跡した（抄録）。", "p3": "出力の標本から、ラベル不要の頻度・位置・形・用法の指標と誤り注入テストで「wait」を追う（抄録）。", "p5": "「wait」をもたない基盤からの強化学習はMATH-500の正答率を大きく上げても「wait」をほぼ生まない。OLMo-3では中間学習で、他の多くのモデルでは推論の痕跡での微調整で入り、既に使う基盤ではRL-Zeroの手順がそれを増やした（抄録）。", "fun": "AIが「待てよ」と言って考え直す姿は、強化学習で自力で身につけた賢さの証拠とよく言われます。ところが実際には、その言葉は学習に使った文章から受け継いだもので、言わなくても正答率は上がっていたという、思い込みを覆す結果です。", "unverified": "抄録の最後の結果は途中で切れており未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "MLLMの潜在表現で映画的な動画を生成", "title": "Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation", "url": "https://arxiv.org/abs/2610.30926", "authors": "Songlin Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Yang, S., Wang, Z., Zhao, X., Wang, X., Zhang, R., Li, S., Wu, T., Li, S., Liu, E., Zhao, A., & Rao, A. (2026). Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30926", "why": "限られた入力から映画的な動画を生成するため、因子を意識した予測学習を導入した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "マルチモーダルLLMの潜在表現を動画拡散Transformer（DiT）に確実に使わせ、人物・場面・動作・カメラを因子ごとに制御する映画的な動画生成法FAPLを提案（抄録）。", "p3": "凍結したMLLMと接続部で潜在表現だけからDiTを学習させ、対になった動画で目標因子の変更と他因子の保持を指定する因子範囲の置換で、因子別の制御を学ばせる（抄録）。", "p5": "抄録の取得範囲では定量的な結果は確認できなかった（抄録）。", "fun": "「同じ俳優のまま、カメラの角度だけ変えて」という映画監督のような注文をAIの動画に通すのは難しい問題です。この研究は、変えたい要素と変えたくない要素を対の動画で教えることで、要素ごとの操作を学ばせています。", "unverified": "評価指標と結果は未確認（抄録が途中まで）。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "競争不完全な市場の最低賃金（ボリビア）", "title": "Minimum Wages beyond Perfect Competition: Employment, Monopsony, Informality and Price Transmission in Bolivia", "url": "https://doi.org/10.2139/ssrn.7659938", "authors": "Ricardo Alonzo Fernandez Salguero", "venue": "SSRN", "date": "2026-10-23", "apa": "Fernandez Salguero, R. A. (2026). Minimum Wages beyond Perfect Competition: Employment, Monopsony, Informality and Price Transmission in Bolivia. https://doi.org/10.2139/ssrn.7659938", "why": "最低賃金引上げが雇用・非公式化・物価にどう波及するかを買い手独占を含めて分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ボリビアの2025年の最低賃金引上げは物価上昇に追いつかず実質で下がり、雇用への差分効果は統計的に区別できなかったことを示した（抄録）。", "p3": "ボリビアの継続雇用調査の1,885,302の人・四半期の記録（34四半期）、都市・品目別の物価指数、法定賃金の推移を使い、競争・買い手独占・分断された労働市場の調整を比べる（抄録）。", "p5": "名目10%の引上げは前年12月比20.40%の物価上昇より小さく、実質の法定最低賃金は8.64%下がった。賃金帯の曝露が10ポイント高い県ほど雇用が1.10ポイント低いが、95%区間は約[−6.07, 3.87]で0と区別できない（抄録）。", "fun": "最低賃金を上げると仕事が減るのかは経済学の大論争ですが、この事例では物価がもっと上がったため、実質の最低賃金はむしろ下がっていました。「上げたはずの賃金が実は下がっていた」という前提の確認が、分析の出発点として大事なことを教えてくれます。", "unverified": "非公式化・労働時間への効果の結果は未確認（抄録が途中まで）。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "健康的な選択と生涯の健康・所得格差", "title": "Healthy Choices, Lifecycle Health, and Earnings Inequality", "url": "https://doi.org/10.2139/ssrn.7657058", "authors": "Benjamin Boyajian ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Boyajian, B., & Galeno Ghio, J. (2026). Healthy Choices, Lifecycle Health, and Earnings Inequality. https://doi.org/10.2139/ssrn.7657058", "why": "英国の世帯パネルとライフサイクルモデルで、健康行動が所得格差をどれだけ縮めるかを推計した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "英国の世帯パネルとライフサイクルモデルで、健康的な選択が生涯所得の格差をどれだけ縮めうるかを推計した（抄録）。", "p3": "心の健康と身体の健康を別々に扱い、健康的な行動・消費が持続するモデルを英国家計縦断調査に合わせ、年齢と健康状態別の就業・選択・健康の推移を再現させる（抄録）。", "p5": "全員に健康的な選択を課すと、良い健康状態の外にいる時間が5.0%減り、25〜55歳の累積所得の対数の分散が13.4%減る。低い賃金の人に絞るP50ルールでは16.1%減った（抄録）。", "fun": "健康に良い食事や運動は、本人の体だけでなく、働ける期間を通じて一生の稼ぎの差にも関わります。心と体の健康を分けてモデルに入れることで、健康的な選択が所得格差の1割強を縮めうるという具体的な大きさを示しています。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "政治予測市場の多様性・効率・誘因", "title": "Diversity, Efficiency, and Incentives in Political Prediction Markets&nbsp;", "url": "https://doi.org/10.2139/ssrn.7644838", "authors": "Harry Crane ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Crane, H., & Strumpf, K. (2026). Diversity, Efficiency, and Incentives in Political Prediction Markets&nbsp; https://doi.org/10.2139/ssrn.7644838", "why": "トレーダーが有権者を代表しないと価格が偏るという批判を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "100年以上の政治賭け市場の参加者属性のデータで、トレーダーは有権者を代表しないが、価格は参加者の政治的選好で偏らないことを示した（抄録）。", "p3": "複数の時代の政治賭け市場のトレーダーの属性を分析し、2024年選挙ではCFTC規制下の取引所Kalshiの匿名化した取引データを使った（抄録）。", "p5": "どの市場でもトレーダーは有権者を代表していなかった。2024年のKalshiの選挙市場の参加者は86%が男性、半数が30歳未満だったが、主要な予測者や世論調査の集計を上回る精度だった（抄録）。", "fun": "世論調査は「有権者を代表する人に聞く」ことが命ですが、賭け市場は若い男性ばかりなのに選挙をよく当てました。お金をかけた人は自分の好みより「誰が勝ちそうか」で動く、という市場の不思議な力を示す研究です。", "unverified": "Kalshi以外の歴史的市場の精度の比較は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "借換えの時期と無形投資", "title": "When Debt Comes Due: Refinancing and Intangible Investment", "url": "https://doi.org/10.2139/ssrn.7650918", "authors": "Hana Koncan", "venue": "SSRN", "date": "2026-10-22", "apa": "Koncan, H. (2026). When Debt Comes Due: Refinancing and Intangible Investment. https://doi.org/10.2139/ssrn.7650918", "why": "信用市場の状況に対する借換えの時期が企業の無形投資とどう関わるかを米国企業パネルで分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "信用市場が悪いときに借換えが重なる企業ほど、無形資産への投資を減らすことを米国企業の長期パネルで示した（抄録）。", "p3": "1975〜2023年の米国上場企業で、1年以内に満期の来る長期債務の割合と社債スプレッドの交差項を借換え曝露とし、無形投資との関係を調べる。2008〜2009年の金融危機の差の差分析で補う（抄録）。", "p5": "借換え曝露が高いほど無形投資は有意に低く、スプレッドが高い時期に集中した。知識資本と組織資本で負の関連があり、物的投資では関連がなかった。危機時も同じ傾向だった（抄録）。", "fun": "お金を借り換える時期がたまたま金融不安と重なると、企業は工場より先に研究開発や人材育成を削ります。目に見えない投資ほど景気の波に弱いことを、50年近いデータで示した研究です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "地方政府の信用ショックが企業間信用に波及", "title": "Risk Contagion from Local Government Credit Shocks: Evidence from Corporate Trade Credit", "url": "https://doi.org/10.2139/ssrn.7649587", "authors": "Zhanchi Wu ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Wu, Z., Hu, M., & Chen, P. (2026). Risk Contagion from Local Government Credit Shocks: Evidence from Corporate Trade Credit. https://doi.org/10.2139/ssrn.7649587", "why": "地方財政の返済難が企業の企業間信用への依存を高めるかを中国の上場企業で検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "中国の地方政府融資平台（LGFV）の初めての債務不履行の後、同じ都市の上場企業の買掛金（企業間信用）が増えることを示した（抄録）。", "p3": "2009〜2024年の中国上場企業43,771企業年で、段階的導入の差の差分析を行う（抄録）。", "p5": "不履行の後に買掛金が増え、地域の貸出と財政支援の減少、企業の支払利息と税費用の増加を伴った。財務制約のある企業、国有企業、大企業で効果が強かった（抄録）。", "fun": "役所の借金が返せなくなると、その影響は銀行を通じて地元の企業に及び、企業は取引先への支払いを先延ばしして耐えようとします。資金の苦しさが消えるのではなく、取引の網の目を通じて別の会社に押し付けられていく様子が見えてきます。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "緊縮財政と高齢女性の多次元剥奪", "title": "Austerity, Gender, and Multidimensional Deprivation Among Older Europeans: Evidence from SHARE", "url": "https://arxiv.org/abs/2610.30527", "authors": "Nita Handastya", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Handastya, N. (2026). Austerity, Gender, and Multidimensional Deprivation Among Older Europeans: Evidence from SHARE (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30527", "why": "SHAREデータで、財政緊縮が高齢女性の多次元的な剥奪を深めるかを検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "SHAREの6波で、財政緊縮は高齢者の多次元的な剥奪を平均で深めるが、男女差は平均では見られず、地域によって異なることを示した（抄録）。", "p3": "欧州11か国で機能的健康・経済的不安・社会的排除からなる多次元剥奪指数を作り、国・波の景気調整済み基礎収支（CAPB）と二方向固定効果モデルで関係づけた（抄録）。", "p5": "緊縮は平均で剥奪を高め、男女差は平均では0だったが、南欧・東欧では女性で大きかった（国単位のクラスタリングでは有意性が消える）。経済的不安は予想と逆に男性で強く上がり、これだけが国単位の推論でも残った（抄録）。", "fun": "緊縮財政は高齢女性に厳しいと予想されがちですが、データを丁寧に見ると、平均では男女差がなく、経済的な不安はむしろ男性で強まっていました。標準誤差の取り方で結論が変わることまで正直に示している点も参考になります。", "unverified": "社会的排除の次元の結果は未確認（抄録が途中まで）。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "月次営業報告の任意開示と企業の革新", "title": "Process-Oriented Voluntary Disclosure and Corporate Innovation: Evidence from Monthly Operating Reports in China", "url": "https://doi.org/10.2139/ssrn.7654279", "authors": "Yihui Chen ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Chen, Y., Ji, Q., & He, X. (2026). Process-Oriented Voluntary Disclosure and Corporate Innovation: Evidence from Monthly Operating Reports in China. https://doi.org/10.2139/ssrn.7654279", "why": "中国企業の月次営業報告の任意開示が革新活動とどう関わるかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "中国上場企業が任意に開示する月次営業報告（MORs）が、企業の特許出願の増加と関連することを示した（抄録）。", "p3": "競合の開示を使う操作変数、PSM-DID、二重機械学習、プラセボ検定で頑健性を確かめ、情報摩擦・資源配分・失敗への寛容の3経路を調べた（抄録）。", "p5": "MORsの開示は特許出願総数の42.1%、発明特許の30.6%の増加と関連した。革新に関する内容が豊かな報告、純粋な任意開示、市場支配力が弱い企業で強かった（抄録）。", "fun": "利益の数字ではなく「今月どんな作業をしているか」を頻繁に公表する会社ほど、発明が増えていました。外の人が会社の様子を分かるようになると、失敗してもすぐに見放されにくくなり、挑戦がしやすくなるのかもしれません。", "unverified": "なし"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "販売・レンタル・共有の三角競争", "title": "Triangular Competition: Cross-Market Interactions Among Sales, Rentals, and Platform Sharing", "url": "https://doi.org/10.2139/ssrn.7649459", "authors": "Gokce Esenduran ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Esenduran, G., Li, J., & Tan, B. (2026). Triangular Competition: Cross-Market Interactions Among Sales, Rentals, and Platform Sharing. https://doi.org/10.2139/ssrn.7649459", "why": "P2P共有プラットフォームが販売とレンタル市場とどう相互作用するかをモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "個人間共有（P2P）プラットフォームが、販売とレンタルという別々の市場を結びつけて生む「三角競争」を理論モデルで分析した（抄録）。", "p3": "製造者が小売業者とレンタル業者を通じて流通し、消費者はP2Pでも製品を使え、所有者は製品を貸し出せる様式化モデルを作る（抄録）。", "p5": "プラットフォームの存在は、どちらか一方の市場だけを見ると見落とす形で、販売とレンタルの市場を作り変えることを示した（詳細は抄録の取得範囲外）（抄録）。", "fun": "カメラを買う、レンタル店で借りる、近所の人から借りる、という3つの選択肢は互いに影響し合っています。個人間の貸し借りの場ができると、本来競争していなかったお店とレンタル業者がライバルになる、という見方が新鮮です。", "unverified": "新製品の販売と所有総数への効果の方向は未確認。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "AIコーディングで顧客が作り手になる", "title": "The Customer Is the Builder: How AI Coding Agents Are Rewriting the Economics of Software", "url": "https://arxiv.org/abs/2610.30307", "authors": "Ripon Chandra Malo ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Malo, R. C., Yu, Z., & Qiu, T. (2026). The Customer Is the Builder: How AI Coding Agents Are Rewriting the Economics of Software (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30307", "why": "AIコーディングエージェントが、ソフトウェアを買うか作るかの判断をどう変えるかを論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIコーディング・エージェントにより、組織がソフトウェアを買う代わりに自作する範囲（ソフトウェア代替の境界）が広がりつつあるかを公開データで調べた（抄録）。", "p3": "作る能力の伸びと市場の変化の指標を比べる。主要エージェントが50%の成功率で完了できる課題の長さ、商用製品のオープンソース代替の探索、公開開発の事例を使う（抄録）。", "p5": "課題の長さは2023年以降約129日ごとに倍増し、575の潜在的な代替を特定した。一方で購入ソフトの投資割合は増えるなど、市場の証拠は混在していた（抄録）。", "fun": "AIが自分でプログラムを書けるようになると、会社は高いソフトを買わずに自分で作るようになるのでしょうか。能力は急速に伸びているのに、市場の数字ではまだはっきりした変化が見えない、という「途中経過」の報告として面白い内容です。", "unverified": "代替候補の機能的な同等性は著者も未検証としている。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "指導者・部下としての人工エージェント", "title": "Artificial Agents as Leaders and Followers: An Integrative Role-Congruity Review", "url": "https://doi.org/10.31234/osf.io/294vn_v1", "authors": "Christoph Daldrop ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Daldrop, C., Ludwig, A., & Buengeler, C. (2026). Artificial Agents as Leaders and Followers: An Integrative Role-Congruity Review. https://doi.org/10.31234/osf.io/294vn_v1", "why": "アルゴリズムやロボットが組織で担う役割を役割一致理論で統合的に整理した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "アルゴリズムやロボットが組織で指導者・部下・同僚の役割を担うときの評価を、107の実証研究の体系的レビューと役割一致理論で統合した（抄録）。", "p3": "経営学・心理学・工学・計算機科学の107研究を役割一致の観点で整理し、人工エージェント役割一致（AARC）モデルを提案する（抄録）。", "p5": "指導者役の人工エージェントは道徳性（公正さ、信頼性）の欠如の知覚により役割不一致に直面し、部下役はおおむね一致、同僚役は課題と外見・声などの手がかりに依存する条件付きの一致だった（抄録）。", "fun": "AIが部下なら受け入れられるのに、上司になると反発されるのはなぜか、という問いに107本の研究をまとめて答えています。鍵は能力ではなく「公平で信頼できそうか」という道徳的な印象だった点が興味深いところです。", "unverified": "なし"}}, {"id": "pn41", "rank": 41, "field": "教育", "headline": "地域が担う補習教育の効果（セネガル）", "title": "The Effectiveness of Community-Delivered Remedial Education in Primary Schools: Evidence from Senegal", "url": "https://doi.org/10.2139/ssrn.7661664", "authors": "Wael Moussa ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Moussa, W., Contreras Gomez, R., & Louge, N. (2026). The Effectiveness of Community-Delivered Remedial Education in Primary Schools: Evidence from Senegal. https://doi.org/10.2139/ssrn.7661664", "why": "教員の負担を増やさず地域住民を雇う補習プログラムの効果を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "セネガル南部で、教員ではなく地域の住民を雇って放課後に補習を行うプログラムが、低学力の児童の読みと算数の成績を上げたことを示した（抄録）。", "p3": "学校内の対象の閾値を使う回帰不連続デザインで、6,223人の児童（CE1・CE2）を分析した（抄録）。", "p5": "対象となることで読みの得点が0.16標準偏差、算数が0.12標準偏差上がり、女子でより大きかった。対象選びに裁量があり、指導者の研修が短くても効果があった（抄録）。", "fun": "先生が足りない地域で、短い研修を受けただけの地元の人が補習を担当しても、子どもの成績はしっかり上がりました。「教えるのは専門家でなければ」という思い込みを、ていねいな比較で問い直した研究です。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "教育", "headline": "学校施設への支出と学力（豪州）", "title": "School Infrastructure Spending and Student Achievement: Evidence from Australian Primary Schools", "url": "https://doi.org/10.2139/ssrn.7661663", "authors": "James Bishop ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Bishop, J., Deng, Y., & Edwards, R. (2026). School Infrastructure Spending and Student Achievement: Evidence from Australian Primary Schools. https://doi.org/10.2139/ssrn.7661663", "why": "豪州の小学校の施設支出が学力・進歩・出席に与える因果効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "豪州の大規模な景気対策で建てられた学校の図書館・講堂・教室は、児童の学力・進歩・出席に効果がなかったことを示した（抄録）。", "p3": "2009〜2012年に99%超の小学校に施設を整備した景気対策の、在籍数の閾値で決まる資金配分を操作変数とするファジー回帰不連続デザイン（抄録）。", "p5": "2013〜2019年のどの年でも、試験成績・最低基準の達成・付加価値の進歩・出席に効果の証拠はなかった。児童1人あたり1,000ドルの追加支出あたり0.09標準偏差を超える効果は信頼区間で否定された（抄録）。", "fun": "新しい図書館や教室ができれば勉強がはかどりそうですが、データでは成績に効果が見られませんでした。「効果がなかった」ことを、どれくらいの大きさまでなら否定できるかを示している点が、ただのゼロ結果と違うところです。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "猛暑への曝露と学習", "title": "Effects of Extreme Temperature Exposure on Learning", "url": "https://doi.org/10.2139/ssrn.7659401", "authors": "Ivan Tzintzun ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Tzintzun, I., Schwarz, L., Lawrence, A., & Thomas, M. (2026). Effects of Extreme Temperature Exposure on Learning. https://doi.org/10.2139/ssrn.7659401", "why": "高温への曝露が生徒の学習と試験成績に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "カンボジアの高校卒業試験の行政記録と気候再解析データで、学年を通じた高温への曝露が試験成績を下げることを示した（抄録）。", "p3": "2014〜2023年の12年生の全国試験の記録を高解像度の気候データと結合し、学年中の持続的な暑さの効果を推定する（抄録）。", "p5": "学年の平均気温が1℃上がると社会科学系の得点が約0.05標準偏差下がった。STEM系や暑い気候に慣れた生徒では影響が小さかった（抄録）。", "fun": "試験当日の暑さだけでなく、1年間の暑さの積み重ねが学びを妨げていることを示した研究です。気候変動が、将来の人々の知識や技能という目に見えない資産にまで影響しうることを教えてくれます。", "unverified": "社会経済的な集団ごとの差の大きさは未確認。"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "日本の大学入試での国際バカロレア保持者の選別", "title": "Door Preparation: Cosmopolitan Nationalism and the Institutional Sorting of International Baccalaureate Holders in Japanese University Admissions", "url": "https://doi.org/10.31235/osf.io/h93qf_v1", "authors": "Shiyun Zhang Isabelle", "venue": "SocArXiv", "date": "2026-10-22", "apa": "Isabelle, S. Z. (2026). Door Preparation: Cosmopolitan Nationalism and the Institutional Sorting of International Baccalaureate Holders in Japanese University Admissions. https://doi.org/10.31235/osf.io/h93qf_v1", "why": "国際的な資格が日本の大学入試でどう受け入れられ、選別されるかを分析した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "日本の大学入試が国際バカロレア（IB）ディプロマをどう受け入れているかを、82大学の入試区分の悉皆的な文書調査で明らかにした（抄録）。", "p3": "2025年1月に省庁のコンソーシアムが公表したIB利用の82大学の入試経路を、固定の規則で符号化し、15校で2回の盲検の符号化で確認した（抄録）。", "p5": "1つのディプロマの受け入れ方は5通りあり、3つは取得地・国籍・出願時期で保持者を選別した。選別は大学の威信より受け入れ区分に従い、帰国生・留学生区分に置かれたIBはその区分の条件を帯びた（抄録）。", "fun": "同じ国際資格でも、日本の大学ではどの入試の「扉」から入るかによって扱いが変わり、国籍や取った場所で振り分けられていました。国際化を進める政策と、国の枠組みで人を分ける入試の仕組みのせめぎ合いが見えてきます。", "unverified": "なし"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "問題解決での生成AIへの依存の尺度開発", "title": "Measuring undergraduate students' reliance on generative AI during problem-solving: Scale development and validation", "url": "https://arxiv.org/abs/2610.30195", "authors": "Chenyu Hou ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Hou, C., Zhu, G., Sudarshan, V., Lim, F. S., & Ong, Y. S. (2026). Measuring undergraduate students' reliance on generative AI during problem-solving: Scale development and validation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30195", "why": "学部生の生成AIへの依存の行動パターンを測る尺度を開発・検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "学部生の問題解決中の生成AIへの依存の行動を、結果の正誤と切り離して測る尺度を開発・検証した（抄録）。", "p3": "1つの問題解決活動後の800回答で探索的因子分析を行い、残りの730回答と別の活動の1,173回答で確認的因子分析を行った（抄録）。", "p5": "省察的な利用、慎重な利用、無思慮な利用、協働的な利用の4因子が得られ、尺度全体の信頼性はCronbachのα = .84だった（抄録）。", "fun": "AIに頼ることが良いか悪いかは、正解したかどうかだけでは分かりません。この尺度は「よく考えて使ったか」「丸投げしたか」という使い方そのものを測ろうとしていて、AI時代の学び方を調べる道具になります。", "unverified": "確認的因子分析の適合度の数値は未確認。"}}, {"id": "pn46", "rank": 46, "field": "人口学", "headline": "ブラジルの人口転換と年金政策", "title": "Brazil's Demographic Transition and the Future of Social Protection: Rethinking Pension Policy for an Ageing Society", "url": "https://doi.org/10.2139/ssrn.7652398", "authors": "Valter Manuel Gomes Neto", "venue": "SSRN", "date": "2026-10-23", "apa": "Gomes Neto, V. M. (2026). Brazil’s Demographic Transition and the Future of Social Protection: Rethinking Pension Policy for an Ageing Society. https://doi.org/10.2139/ssrn.7652398", "why": "急速な高齢化の下でのブラジルの年金制度の持続性と適切さを論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ブラジルの急速な人口転換の下で、年金制度を財政中心の見方から統合的な社会保障の戦略へ移すべきだと論じる政策提言（抄録）。", "p3": "既存の研究と政策の証拠をもとに、財政健全化、拠出型の加入範囲、非拠出型の所得保障のトレードオフを検討する（抄録）。", "p5": "非公式・自営の労働者の加入拡大、年齢に包摂的な雇用による活動的な高齢化、脆弱な高齢者の最低所得保障の強化の3つの優先事項を提案した（抄録）。", "fun": "高齢化が速く、働く人の多くが正式な雇用の外にいる国では、年金の財政を守ることと高齢者の暮らしを守ることがぶつかります。この提言は、その2つを対立ではなく一緒に追う目標として組み立て直そうとしています。", "unverified": "新しい実証分析は含まれない（政策提言）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "購入時の透明性が保険の解約を減らす", "title": "Information Transparency, Choice Confidence, and Customer Retention: Field and Laboratory Evidence from Markets for Credence Goods", "url": "https://doi.org/10.1287/mnsc.2020.02865", "authors": "Zhi (Aaron) Cheng ほか", "venue": "Management Science", "date": "2026-10-22", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Cheng, Z. (., Li, T., & Pavlou, P. A. (2026). Information Transparency, Choice Confidence, and Customer Retention: Field an 2025", "apa": "Nyfoudi, M., Do, H., Shipton, H., & King, D. (2026). Employee Communication and Silence: The Role of Managers’ Voice Solicitation. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70070", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr15", "rank": 15, "headline": "信用情報の削除は信用を再分配するだけ", "title": "The Equilibrium Effect of Information in Consumer Credit Markets: Public Records and Credit Redistribution", "url": "https://doi.org/10.1162/rest.a.1880", "authors": "Scott L. Fulford ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "apa": "Fulford, S. L., & Nagypál, É. (2026). The Equilibrium Effect of Information in Consumer Credit Markets: Public Records and Credit Redistribution. Review of Economics and Statistics, 1–45. https://doi.org/10.1162/rest.a.1880", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr16", "rank": 16, "headline": "市場シェア競争の圧力が企業不正を誘う", "title": "EXPRESS: The Dark Side of Competition for Market Share: Competitive Pressure May Trigger Corporate Misconduct", "url": "https://doi.org/10.1177/00222429261503585", "authors": "Lars Kaiser ほか", "venue": "Journal of Marketing", "date": "2026-10-23", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "apa": "Kaiser, L., Edeling, A., & Fischer, M. (2026). EXPRESS: The Dark Side of Competition for Market Share: Competitive Pressure May Trigger Corporate Misconduct. Journal of Marketing. https://doi.org/10.1177/00222429261503585", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Marketingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "市場シェアを巡る競争圧力が企業不正を誘い、その不正が圧力の源の市場地位をかえって弱めることを示した（抄録）。", "p3": "実務の理論化から市場シェアに基づく競争圧力の理論（TMCP）と、圧力の異なる面を表す4つの新しい構成概念を提案。254産業の2,145社・11年の世界標本で検証した（抄録）。", "p5": "首位に近く、競合に僅差で追われる企業ほど不正を起こしやすく、不正はその後の市場シェアを系統的に弱めた。環境とガバナンスの不正で罰が特に大きかった（抄録）。", "fun": "トップまであと少し、後ろからも追われている、という状況の会社ほど不正に手を出しやすいという結果です。しかも不正をすると、まさにその焦りの原因だった市場での地位を失ってしまうという、皮肉な循環が描かれています。", "unverified": "4つの構成概念の定義の詳細は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "私的なAI利用がサービス革新に波及", "title": "Understanding the spillover effect of personal AI use on service innovation: the role of psychological capital and conscientiousness", "url": "https://doi.org/10.1108/josm-11-2025-0622", "authors": "Dustin Maneethai ほか", "venue": "Journal of Service Management", "date": "2026-10-23", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Maneethai, D., Chang, W., Gip, H., & Kim, G. E. (2026). Understanding the spillover effect of personal AI use on service innovation: the role of psychological capital and conscientiousness. Journal of Service Management, 1–26. https://doi.org/10.1108/josm-11-2025-0622", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Service Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "私生活でのAI利用が仕事でのAI利用を増やし、心理的資本を通じてサービス革新の成果を高めるという波及の過程を示した（抄録）。", "p3": "研究1はサービス従業員438人の3時点調査で、構造方程式モデルにより系列媒介を検証。研究2は日次の経験サンプリングで個人内の動きを調べ、誠実性を境界条件として検討した（抄録）。", "p5": "私的なAI利用 → 仕事のAI利用 → 心理的資本 → サービス革新という系列の過程と、誠実性による調整が仮説として検証された（係数は抄録の取得範囲外）（抄録）。", "fun": "休日にAIで旅行の計画を立てるような経験が、職場でAIを使いこなす自信につながり、新しいサービスのアイデアを生む、という生活と仕事のつながりを追った研究です。AIの職場導入を考えるとき、私生活での慣れも無視できないことを示唆しています。", "unverified": "研究2の標本規模と効果の大きさは未確認。"}}, {"id": "jr18", "rank": 18, "headline": "フードデリバリーの会員制は外食行動も変える", "title": "From Bytes to Bites: Examining the Online and Offline Spillover Impacts of Online Food Delivery Platform Subscriptions", "url": "https://doi.org/10.1287/mnsc.2025.00954", "authors": "Jaeho Myeong ほか", "venue": "Management Science", "date": "2026-10-22", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Myeong, J., Park, Y., Costello, F. J., Kim, K., & Ahn, J.-H. (2026). From Bytes to Bites: Examining the Online and Offline Spillover Impacts of Online Food Delivery Platform Subscriptions. Management Science. https://doi.org/10.1287/mnsc.2025.00954", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Management Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "フードデリバリーの会員制の導入は、競合からの乗り換えを生みつつ市場全体の消費を増やし、近所の外食や他の業種にも波及したことを示した（抄録）。", "p3": "大規模な個人単位の取引データで差の差分析を行い、地理空間の分析でオフラインへの波及を調べた（抄録）。", "p5": "会員制の導入後、競合から注目の基盤への消費の移動が起きたが共食いはなく、市場内の食の消費全体が増えた。会員は近くの外食や競合しない業種での活動も増やした（抄録）。", "fun": "宅配の会員になると家でばかり食べるようになると思いきや、近所のお店にも出かけるようになっていました。ネットの囲い込みが、街の実店舗にまで良い影響を広げうるという、意外な結果です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "農村の認知症の人ほど在宅サービスが不足", "title": "People Living With Dementia in Rural Areas are Most Likely to Report Unmet Service Needs in Home‐ and Community‐Based Services in the United States", "url": "https://doi.org/10.1111/jrh.70230", "authors": "Romil R. Parikh ほか", "venue": "Journal of Rural Health", "date": "2026-10-23", "sjr": 1.411, "citescore": 5.8, "citescore_year": "2025", "apa": "Parikh, R. R., Jutkowitz, E., Wolf, J. M., Langworthy, B. W., Fabius, C. D., Giordano, S., & Shippee, T. P. (2026). People Living With Dementia in Rural Areas are Most Likely to Report Unmet Service Needs in Home‐ and Community‐Based Services in the United States. The Journal of Rural Health, 42(4). https://doi.org/10.1111/jrh.70230", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Rural Healthの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "認知症のある高齢者では、都市部より小都市・農村部で在宅・地域ケア（HCBS）の未充足ニーズが多いことを示した（抄録）。", "p3": "米国23州の地域在住の65歳以上14,645人（2016〜2019年）の調査で、都市農村の連続分類（RUCA）と未充足ニーズの関連を、認知症の有無で層別したロジスティック回帰で分析した（抄録）。", "p5": "認知症のある人（2,438人）では、大都市圏に比べ小都市圏で未充足ニーズの割合が高かった（35.4%対30.7%、オッズ比1.32）（抄録）。", "fun": "住み慣れた家で年を重ねたいという願いを支えるのが在宅ケアですが、その届き方には地域差があります。とくに認知症の人で農村ほど支援が足りないことを示し、支援の届け方を地域ごとに変える必要を数字で裏づけています。", "unverified": "農村部（rural）の数値は抄録が途中で未確認。"}}, {"id": "jr20", "rank": 20, "headline": "密な粒子懸濁流のμ(J)則を単純せん断外へ", "title": "Continuum modelling of dense granular suspensions in a duct: bold italic mu bold left parenthesis bold italic upper J bold right parenthesis μ ( J ) $\\boldsymbol{\\mu} \\boldsymbol{(}\\boldsymbol{J}\\boldsymbol{)}$ beyond simple shear", "url": "https://doi.org/10.1017/jfm.2026.12101", "authors": "Jonathan G.Y. Watts ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-23", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Watts, J. G. Y., Taylor-West, J. J., Morgan, M. L., Sandnes, B., & Hewitt, D. R. (2026). Continuum modelling of dense granular suspensions in a duct: bold italic mu bold left parenthesis bold italic upper J bold right parenthesis μ ( J ) $\\boldsymbol{\\mu} \\boldsymbol{(}\\boldsymbol{J}\\boldsymbol{)}$ beyond simple shear. Journal of Fluid Mechanics, 1045. https://doi.org/10.1017/jfm.2026.12101", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Fluid Mechanicsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "沈降する非ブラウン粒子の濃い懸濁液がダクトを圧力駆動で流れる場合を、μ(J)則の連続体モデルで理論と実験から調べた（抄録）。", "p3": "滑らかな側壁（応力なし）と粗い側壁（すべりなし）の2極限を扱い、解を無次元の圧力勾配と平均固相率で分類する。滑らかな場合は半解析解と漸近式を求め、側壁のクーロン摩擦条件の影響も調べた（抄録）。", "p5": "滑らかな側壁では流れが水平方向に一様になり、粗い側壁ではダクト横断方向と鉛直方向の両方に依存する流れになった（抄録）。", "fun": "砂粒の混じった泥水のような「濃い粒子の流れ」は、水のように流れたり砂山のように止まったりします。単純なずれ流れでしか確かめられていなかった法則を、壁のある管の中に広げて実験と比べた点が、この分野の一歩になっています。", "unverified": "実験と理論の一致度の数値は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "粗い表面での粒子の跳ね返りを制御する", "title": "Regulating particle rebound through rough surfaces", "url": "https://doi.org/10.26599/frict.2026.9441324", "authors": "Haiyang Yao ほか", "venue": "Friction", "date": "2026-10-23", "sjr": 1.344, "citescore": 14.2, "citescore_year": "2025", "apa": "Yao, H., Liu, F., Huang, K., Hu, J., & Song, H. (2026). Regulating particle rebound through rough surfaces. Friction. https://doi.org/10.26599/frict.2026.9441324", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Frictionの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "高速の粒子が粗い表面に衝突して跳ね返る挙動を分子動力学で調べ、反発係数の半解析モデルを示した（抄録）。", "p3": "表面粗さと衝突角を変えた分子動力学シミュレーションを行い、正面衝突の法線方向の反発係数の半解析モデルを作る（抄録）。", "p5": "反発係数は無次元速度に反比例的にスケールし、表面粗さの反発係数への効果は速度に依存した（抄録）。", "fun": "ボールを壁に当てると、壁がでこぼこかどうかで跳ね返り方が変わります。金属の粉を吹き付けて固める技術などで大事なこの現象を、原子の動きから調べ、速さによって粗さの効き方が変わることを示しています。", "unverified": "粗さの効果の向き（増減）の詳細は抄録が途中で未確認。"}}, {"id": "jr22", "rank": 22, "headline": "AIへの意識が先回りのキャリア行動を促す", "title": "How and When Artificial Intelligence Awareness Fosters Proactive Career Behaviors: The Role of Workplace Impostor Thoughts and Future Work Self Salience", "url": "https://doi.org/10.1177/10690727261499377", "authors": "Bowen Li ほか", "venue": "Journal of Career Assessment", "date": "2026-10-23", "sjr": 1.413, "citescore": 7.0, "citescore_year": "2025", "apa": "Li, B., Xu, Y., Li, Y., Li, C., & Meng, X. (2026). How and When Artificial Intelligence Awareness Fosters Proactive Career Behaviors: The Role of Workplace Impostor Thoughts and Future Work Self Salience. Journal of Career Assessment. https://doi.org/10.1177/10690727261499377", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Career Assessmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "AIへの意識（AIが仕事を変えるという認識）が、職場での「インポスター思考」を介して先回りのキャリア行動を促すことを示した（抄録）。", "p3": "自己不一致理論に基づき、英国のフルタイム従業員329人の3時点の時間差データで検証した（抄録）。", "p5": "AIへの意識は先回りのキャリア行動と正に関連した。インポスター思考を介した間接効果は、将来の仕事の自己像が際立つときにだけ有意だった（抄録）。", "fun": "「AIに仕事を取られるかも」という不安は普通は悪いものと考えられますが、この研究では、自分は力不足かもと感じることが逆にキャリアの準備を促していました。脅威がやる気に変わる条件を示している点が面白いところです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "通勤中の業務ICT利用は没入の速さを高める", "title": "Does work‐related information and communication technology use during daily commutes promote the speed of work engagement? A role transition perspective", "url": "https://doi.org/10.1111/apps.70150", "authors": "Mengge Gan ほか", "venue": "Applied Psychology", "date": "2026-10-23", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "apa": "Gan, M., Wang, B., Li, B., Fan, C., Zhao, Y., & Qian, J. (2026). Does work‐related information and communication technology use during daily commutes promote the speed of work engagement? A role transition perspective. Applied Psychology, 75(5). https://doi.org/10.1111/apps.70150", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Applied Psychologyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "通勤中の業務用ICT利用は、行きでは家庭からの心理的な切り離しを通じて仕事への没入を早め、帰りでは仕事と家庭の葛藤を通じて翌日の没入を遅らせることを示した（抄録）。", "p3": "役割移行の観点から仮説を立て、従業員149人の10営業日の経験サンプリングをマルチレベル分析した（抄録）。", "p5": "行きの通勤中の業務ICT利用は家庭からの心理的離脱と正に関連し、朝の仕事への没入を早めた（帰りの結果は抄録の取得範囲外）（抄録）。", "fun": "通勤電車でメールを読むことは、朝なら「仕事モード」への切り替えを助け、夜なら家に仕事を持ち帰ることになります。同じ行動でも時間帯によって良し悪しが逆になる、という分かりやすい対比を示した研究です。", "unverified": "帰りの通勤の効果と課題重要性の調整効果は未確認（抄録が途中まで）。"}}, {"id": "jr24", "rank": 24, "headline": "話し手なき主張：LLMの証言は信頼できるか", "title": "Assertion without a Speaker: Testimony, Tracking, and Large Language Models", "url": "https://doi.org/10.1017/epi.2026.10160", "authors": "Abhinav Saxena", "venue": "Episteme", "date": "2026-10-23", "sjr": 1.016, "citescore": 3.3, "citescore_year": "2025", "apa": "Saxena, A. (2026). Assertion without a Speaker: Testimony, Tracking, and Large Language Models. Episteme, 1–22. https://doi.org/10.1017/epi.2026.10160", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Epistemeの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "LLMの出力は利用者に真の信念をもたらすことが多いが、現時点では証言による知識を伝えていないと論じる哲学論文（抄録）。", "p3": "Burge、Williamson、Goldberg、Faulkner、Lackeyの議論から「追跡の最小条件」を導く。情報源がpを伝えるのは、pの真理や証拠が、その情報源自身の産出過程によって主張の産出を説明するときだけ、という条件である（抄録）。", "p5": "5つの説が共有するのは様相的な性質ではなくこの内生性の要件であり、現在のシステムはそれを満たさないと結論する（抄録）。", "fun": "AIの答えが正しくても、それは「AIが知っていて教えてくれた」ことになるのでしょうか。人から話を聞いて知るという営みの条件を哲学的に分析し、今のAIはまだその条件を満たしていない、と論じています。", "unverified": "なし"}}, {"id": "jr25", "rank": 25, "headline": "州法人税の変化が融資コストを動かす", "title": "Corporate Tax Changes and Credit Costs", "url": "https://doi.org/10.1111/jmcb.70092", "authors": "Yota D. Deli ほか", "venue": "Journal of Money, Credit and Banking", "date": "2026-10-23", "sjr": 1.999, "citescore": 3.7, "citescore_year": "2025", "apa": "Deli, Y. D., Delis, M. D., Hasan, I., Politsidis, P. N., & Saunders, A. (2026). Corporate Tax Changes and Credit Costs. Journal of Money, Credit and Banking. https://doi.org/10.1111/jmcb.70092", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Money, Credit and Bankingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米国の州法人税率の変化が融資の価格と量に与える影響を調べ、減税で信用コストが約10ベーシスポイント下がることを示した（抄録）。", "p3": "州ごとの法人税率の変化を使い、融資スプレッドと融資額への影響を推定した（抄録）。", "p5": "1ポイントの減税（増税）は融資スプレッドの10.5（9.2）ベーシスポイントの低下（上昇）と関連した。効果は主に需要側から生じ、均衡の融資額への効果は有意でなかった（抄録）。", "fun": "法人税が下がると会社の手元にお金が残り、倒産しにくく見えるため、銀行は金利を下げてくれます。税金と借入金利という一見別々の話が、企業の信用リスクを通じてつながっていることを示した研究です。", "unverified": "なし"}}, {"id": "jr26", "rank": 26, "headline": "敏感産業でのガバナンスと持続可能性開示", "title": "Corporate Governance and Sustainability Disclosure in Environmentally and Socially Sensitive Industries", "url": "https://doi.org/10.1002/bse.71752", "authors": "Asad Mehmood ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-23", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Mehmood, A., Della Porta, A., & De Luca, F. (2026). Corporate Governance and Sustainability Disclosure in Environmentally and Socially Sensitive Industries. Business Strategy and the Environment. https://doi.org/10.1002/bse.71752", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "EU上場企業で、取締役会の規模と女性比率が環境・社会の持続可能性開示と正に関連し、その多くは産業の敏感さで変わらないことを示した（抄録）。", "p3": "EU上場503社の3,276企業年（2011〜2021年）を、OLS、操作変数法、2段階システムGMMで分析し、965社6,097観測で補足分析した（抄録）。", "p5": "取締役会の規模と女性比率は両方の開示と正に関連し、独立性は社会開示と正、CEOの兼任は社会開示と負に関連した。CEO兼任の負の関連は敏感な産業でより強かった（抄録）。", "fun": "環境に負荷の大きい業界ほど、ガバナンスが開示を左右するはずだと考えられがちです。ところが多くの関係は業界によって変わらず、社長と会長の兼任だけが敏感な業界でより悪く効いていた、という結果が興味深いところです。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr27", "rank": 27, "headline": "CEOのポピュリズムが生物多様性開示を減らす", "title": "Silent Strategies: CEO Populism, Supply Chain Opacity, and Biodiversity Disclosure", "url": "https://doi.org/10.1002/bse.71725", "authors": "Hamzeh Al Amosh", "venue": "Business Strategy and the Environment", "date": "2026-10-23", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Al Amosh, H. (2026). Silent Strategies: CEO Populism, Supply Chain Opacity, and Biodiversity Disclosure. Business Strategy and the Environment. https://doi.org/10.1002/bse.71725", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "CEOのポピュリズム的な言説が、生物多様性の開示の少なさとサプライチェーンの不透明さに関連することを、欧州企業で示した（抄録）。", "p3": "欧州12か国の非金融上場1,828社（2014〜2022年、15,842企業年）の非平衡パネルで、企業固定効果、2段階最小二乗法、2段階システムGMMを用いた（抄録）。", "p5": "CEOのポピュリズム的言説は生物多様性の開示と負、サプライチェーンの不透明さと正に関連した。前期の不透明さが負の関連を強めるという限定的な証拠もあった（抄録）。", "fun": "経営者の話し方から会社の情報の出し方が読み取れる、という研究です。分かりやすく大衆に訴える語り口の社長ほど、検証できる具体的な情報を出さない傾向があり、言葉の調子と透明性の関係を考えさせられます。", "unverified": "ポピュリズム的言説の測定方法は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "統治の構成が主観的幸福を左右する", "title": "How governance configurations shape subjective well-being: Evidence from cross-national data", "url": "https://doi.org/10.1177/00208523261492453", "authors": "Wei Huang ほか", "venue": "International Review of Administrative Sciences", "date": "2026-10-23", "sjr": 1.163, "citescore": 7.9, "citescore_year": "2025", "apa": "Huang, W., Zhang, Y., & Tu, X. (2026). How governance configurations shape subjective well-being: Evidence from cross-national data. International Review of Administrative Sciences. https://doi.org/10.1177/00208523261492453", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "International Review of Administrative Sciencesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "163か国（2011〜2024年）のパネルで、政府の有効性と発言・説明責任の組合せによる統治の構成が主観的幸福の予測に関わることを示した（抄録）。", "p3": "統治を多次元の体系とみなして国を4つの制度構成に分類し、アンサンブルモデルとSHAPによる寄与の分解で主観的幸福を予測した（抄録）。", "p5": "主観的幸福は高い精度で予測でき、経済条件は基本的な予測因子のままだった（統治の寄与の詳細は抄録の取得範囲外）（抄録）。", "fun": "同じくらい豊かな国でも、人々の幸福感には大きな差があります。政府がきちんと仕事をするか、国民が声を上げられるか、という統治の「組合せ」で国を分けると、その差の一部が説明できるかもしれない、という問いを機械学習で探っています。", "unverified": "構成ごとの統治の効果は未確認（抄録が途中まで）。"}}, {"id": "jr29", "rank": 29, "headline": "持続性うつ病での高い孤独状態の持続", "title": "Sustained High‐Loneliness States in Persistent Depressive Disorder: An Ecological Momentary Assessment Study", "url": "https://doi.org/10.1111/nyas.70436", "authors": "Johannes Wolf ほか", "venue": "Annals of the New York Academy of Sciences", "date": "2026-10-23", "sjr": 1.35, "citescore": 7.9, "citescore_year": "2025", "apa": "Wolf, J., Wörz, K., Cronau, A., Midderhoff, F., Kunz, J. I., Merscher, A.-S., Vögele, C., Jobst, A., Goerigk, S., Padberg, F., & Reinhard, M. A. (2026). Sustained High‐Loneliness States in Persistent Depressive Disorder: An Ecological Momentary Assessment Study. Annals of the New York Academy of Sciences, 1564(1). https://doi.org/10.1111/nyas.70436", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Annals of the New York Academy of Sciencesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "持続性うつ病の入院患者では、孤独感の強い状態が健康な人より長く続き、抜け出しにくいことを生態学的瞬間評価（EMA）で示した（抄録）。", "p3": "持続性うつ病の入院患者58人と健康な対照42人で、EMAにより状態としての孤独感の平均水準と高孤独状態の持続時間を求め、特性孤独感と幼少期の逆境も測った（抄録）。", "p5": "患者は平均の状態孤独感が高く、高孤独状態が平均3.5回の連続した回答の間続いた。高孤独状態から抜け出す確率も低かった（抄録）。", "fun": "寂しさはもともと「人とつながれ」という合図として役に立つ感情ですが、それが長く続くと害になります。一日に何度も気持ちを記録してもらうことで、寂しさの強さだけでなく「どれだけ長く続くか」を測った点が新しいところです。", "unverified": "幼少期の逆境との関連の結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "スマホで木造床の振動を素早く評価", "title": "Application of a Fast Vibration Assessment Protocol for Joisted Timber Floors via Smartphone Devices", "url": "https://doi.org/10.1155/stc/6442165", "authors": "Alessandro Mazelli ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-23", "citescore": 10.3, "citescore_year": "2025", "apa": "Mazelli, A., Sciomenta, M., & Bedon, C. (2026). Application of a Fast Vibration Assessment Protocol for Joisted Timber Floors via Smartphone Devices. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/6442165", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Control and Health Monitoringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "木造根太床の歩行振動による快適性を、市販スマートフォンで素早く評価する手順を提案し、実験室と現場で検証した（抄録）。", "p3": "試作の床で従来のフォースバランス型加速度計とスマートフォンの記録を比べて較正・補正係数を作り、統計シミュレーションで必要な最小の歩行回数を求めた。2つの実際の床で頑健性を試した（抄録）。", "p5": "較正と補正係数、最小歩行回数を定め、現場の2つの床で方法の頑健性と可能性を確認した（数値は抄録の取得範囲外）（抄録）。", "fun": "木の床は軽くて硬いぶん、人が歩くだけで揺れが気になりやすい構造です。高価な計測器の代わりにスマホで手早く揺れを評価できれば、点検の手間が大きく減ります。何回歩けば十分かまで統計で決めている点が実用的です。", "unverified": "スマートフォンと加速度計の誤差の大きさは未確認。"}}, {"id": "jr31", "rank": 31, "headline": "説明可能AIで仕訳の異常を検知", "title": "Explainable Artificial Intelligence for Journal Entry Anomaly Detection and Continuous Financial Auditing", "url": "https://doi.org/10.15680/irjie.2024.0804003", "authors": "R. Sugumar", "venue": "International Research Journal of Innovative Engineering", "date": "2026-10-23", "apa": "Sugumar, R. (2024). Explainable Artificial Intelligence for Journal Entry Anomaly Detection and Continuous Financial Auditing. International Research Journal of Innovative Engineering, 08(04). https://doi.org/10.15680/irjie.2024.0804003", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "International Research Journal of Innovative Engineeringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "仕訳の異常検知と継続的監査のための説明可能AI（XAI）の構成を提案した（抄録）。", "p3": "前処理、特徴量設計、異常検知、説明、リスク評価、継続的監査の監視を一つの構成にまとめ、記帳時刻、勘定と利用者の関係、金額、伝票、過去の傾向から疑わしい仕訳を特定する。各モデルがリスク得点を出し、説明の仕組みで理由を示す（抄録）。", "p5": "抄録の取得範囲では、検証データや精度の数値は確認できなかった（抄録）。", "fun": "会計監査では、膨大な仕訳の中から怪しいものを見つけるだけでなく、「なぜ怪しいか」を説明できることが大切です。AIの判断理由を見える形にする仕組みを監査の流れに組み込もうとする提案です。", "unverified": "検証の方法と結果は抄録に記載がなく未確認。掲載誌の査読水準も未確認。"}}, {"id": "jr32", "rank": 32, "headline": "時系列分割で不正予測の楽観を避ける", "title": "An Explainable Temporal Machine Learning Framework for Financial Fraud Risk Prediction in Listed Institutions", "url": "https://doi.org/10.54097/hkcxmt18", "authors": "Huijie Fan ほか", "venue": "Highlights in Business, Economics and Management", "date": "2026-10-23", "apa": "Fan, H., Liang, Y., Jiao, Y., Ping, W., & Lin, Y. (2026). An Explainable Temporal Machine Learning Framework for Financial Fraud Risk Prediction in Listed Institutions. Highlights in Business, Economics and Management, 70, 173–185. https://doi.org/10.54097/hkcxmt18", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Highlights in Business, Economics and Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "財務諸表不正の選別で、情報の漏れの監査と過去のみの時系列特徴量を組み込んだ説明可能なアンサンブルESGEを提案した（抄録）。", "p3": "ロジスティック回帰・LightGBM・CatBoostを検証のPR-AUCで重み付けし、モデル間の不一致のゲートと交差検証で安定なTreeSHAPを組み合わせる。米上場企業の10,159四半期（不正511件、5.03%）で、企業が訓練と試験にまたがらない分割を用いた（抄録）。", "p5": "5分割でROC-AUC 0.9032±0.0198、PR-AUC 0.6344±0.0648。順位の上位10%の報告に不正の72.22%±5.07%が含まれた（抄録）。", "fun": "不正はまれな出来事なので、データの分け方を誤ると、未来の情報が混ざって実力以上に当たるように見えてしまいます。この研究は同じ会社を訓練と試験に混ぜないなど、ずるのない評価を徹底している点に価値があります。", "unverified": "最強の単一モデルとの差の信頼区間は抄録が途中で未確認。"}}, {"id": "jr33", "rank": 33, "headline": "LLMの異時点選択はペルソナ文脈で変わる", "title": "CONTEXT OVER LANGUAGE: PERSONA-DRIVEN INTERTEMPORAL CHOICE IN LARGE LANGUAGE MODELS", "url": "https://doi.org/10.54688/ayd.1932565", "authors": "Ali Kemal Başbuğ", "venue": "Akademik Yaklaşımlar Dergisi", "date": "2026-10-22", "apa": "Başbuğ, A. K. (2026). CONTEXT OVER LANGUAGE: PERSONA-DRIVEN INTERTEMPORAL CHOICE IN LARGE LANGUAGE MODELS. Akademik Yaklaşımlar Dergisi, 17, 1–31. https://doi.org/10.54688/ayd.1932565", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Akademik Yaklaşımlar Dergisiの抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "LLMの異時点間の選択は安定した選好ではなく、与えたペルソナの文脈に主に左右されることを示した（抄録）。", "p3": "4つのモデル（ChatGPT、Gemini、Copilot、Claude）で、ペルソナ（金銭的に苦しい／規律がある）、遅延（1・6か月）、報酬額（650〜900ドル）、プロンプトの枠組み（直接／人らしく）を完全要因計画で変え、繰り返して応答分布を近似した（抄録）。", "p5": "決定はペルソナに主に左右され、規律あるペルソナは遅い報酬をより多く選んだ。遅延と報酬額は時間割引と整合的に効き、プロンプトの枠組みの効果は無視できる程度だった（抄録）。", "fun": "「お金に困っている人として答えて」と頼むとAIは今すぐのお金を選び、「計画的な人として」と頼むと待つほうを選びます。AIを実験の被験者として使うとき、その答えがAI自身の好みなのか、与えた役柄なのかを見分ける必要があることを示しています。", "unverified": "モデル間の差の詳細は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "持続可能性は財務困窮リスクを和らげるか", "title": "Corporate Sustainability as a Mitigator of Financial Distress Risk: Panel and Quantile Evidence from an Emerging Economy", "url": "https://doi.org/10.3390/jrfm19110842", "authors": "Kishan Kumar Goel ほか", "venue": "Journal of Risk and Financial Management", "date": "2026-10-23", "citescore": 5.5, "citescore_year": "2025", "apa": "Goel, K. K., Sapra, R., Singh, R., Chahal, J., & Singh, S. (2026). Corporate Sustainability as a Mitigator of Financial Distress Risk: Panel and Quantile Evidence from an Emerging Economy. Journal of Risk and Financial Management, 19(11), 842. https://doi.org/10.3390/jrfm19110842", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "インドの上場企業で、持続可能性（ESG）の成績が財務困窮のリスクを企業の分布全体で和らげることを示した（抄録）。", "p3": "上場566社（2012〜2024年）のパネルを、モーメント法の分位点回帰で分析し、シミュレーションに基づく媒介分析で経路を調べた（抄録）。", "p5": "持続可能性の成績は分布全体で困窮リスクを一貫して下げ、効果はCOVID-19危機の時期にも安定し、産業によって異なった。負債比率が主な伝達経路だった（抄録）。", "fun": "環境や社会への配慮にお金を使う会社は、余裕があるからできるのか、それとも配慮が会社を守るのか。この研究は、苦しい会社から元気な会社まで、どの層でもESGの成績が良いほど倒産の危険が低いという関係を示しています。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "動的メッシュ流れの位相を考慮した縮約", "title": "Spatially Consistent and Phase-Aware Reduced-Order Modeling for Dynamic-Mesh Unsteady Flow Simulation", "url": "https://doi.org/10.3390/fluids11110267", "authors": "Longfeng Hou ほか", "venue": "Fluids", "date": "2026-10-23", "citescore": 4.1, "citescore_year": "2025", "apa": "Hou, L., Tao, Y., Zou, W., & Zhu, B. (2026). Spatially Consistent and Phase-Aware Reduced-Order Modeling for Dynamic-Mesh Unsteady Flow Simulation. Fluids, 11(11), 267. https://doi.org/10.3390/fluids11110267", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Fluidsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "格子が時間とともに動く非定常流れのスナップショットを共通の参照格子に写像し、位相を考慮したPOD–RBFの縮約モデルで周期流れを高速に計算する（抄録）。", "p3": "KD木の最近傍探索と逆距離重み付けで動的格子のスナップショットを参照格子に揃え、POD打ち切り、RBF係数回帰、外部パラメータ表現、位相局所の部分空間モデルを、1周期内と周期をまたぐ予測で調べた（抄録）。", "p5": "キャビティ流れと円柱後流で基本実装を確かめ、振動翼で全体の手順を評価した。動的格子のデータのPODでは空間的な一貫性が不可欠であることを示した（抄録）。", "fun": "羽ばたく翼のまわりの流れを計算すると、計算の格子そのものが動くので、時刻ごとのデータが同じ場所を指さなくなります。まず全部を同じ地図に写してから要約する、という当たり前の手順が実は欠かせないことを確かめた研究です。", "unverified": "誤差の数値は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "最大粒径が粗粒土のせん断に与える影響", "title": "Effects of Maximum Particle Size on the Shear Behavior of Coarse-Grained Soil: Direct Shear Tests and Discrete Element Simulations", "url": "https://doi.org/10.3390/eng7110578", "authors": "Rui Zhang ほか", "venue": "Eng", "date": "2026-10-23", "citescore": 4.1, "citescore_year": "2025", "apa": "Zhang, R., Du, J., Liu, L., & Wang, X. (2026). Effects of Maximum Particle Size on the Shear Behavior of Coarse-Grained Soil: Direct Shear Tests and Discrete Element Simulations. Eng, 7(11), 578. https://doi.org/10.3390/eng7110578", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Engの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "粗粒土の最大粒径がせん断強度と粒子間の力の鎖に与える寸法効果を、大型直接せん断試験とPFC3Dの個別要素法で調べた（抄録）。", "p3": "最大粒径10・20・40・60mmの4群を垂直応力100〜400kPaで試験し、3次元DEMモデルをせん断応力−変位曲線と強度定数で評価してから、粒子変位、力の鎖、配位数、接触ファブリック、せん断応力場を調べた（抄録）。", "p5": "16のピークせん断応力の比較で平均相対誤差4.09%、最大7.27%。最大粒径が10mmから60mmになると、ピークせん断応力は100kPaで61.82%、400kPaで39.23%増えた（抄録）。", "fun": "大きな石が混ざった土ほど強くなるのは、石同士が押し合う「力の鎖」が太く長くなるからかもしれません。実験とコンピュータ上の粒の模型を突き合わせ、目に見えない土の中の力の流れを見えるようにしています。", "unverified": "見かけの粘着力の変化の結果は抄録が途中で未確認。"}}, {"id": "jr37", "rank": 37, "headline": "火山灰斜面の土石流流域の水収支モデル", "title": "Hydrological Dynamics of Debris Flow-Prone Pyroclastic Catchments: A Budyko-Based Modeling Approach", "url": "https://doi.org/10.3390/w18212640", "authors": "Muhammad Aleem ほか", "venue": "Water", "date": "2026-10-23", "citescore": 6.7, "citescore_year": "2025", "apa": "Aleem, M., Marino, P., & Greco, R. (2026). Hydrological Dynamics of Debris Flow-Prone Pyroclastic Catchments: A Budyko-Based Modeling Approach. Water, 18(21), 2640. https://doi.org/10.3390/w18212640", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Waterの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "イタリア・カンパニア州の火砕堆積物の斜面をもつ8流域で、Budyko枠組みの動的水収支モデルにより土石流の起きやすい流域の水文挙動を表した（抄録）。", "p3": "2003〜2023年の月雨量・衛星・再解析データを使い、保水、蒸発散の効率、最大土壌貯留、基底流、地下水損失のパラメータを、7つの未観測流域では再解析の流出量、1つの観測流域では水位流量関係の流量に合わせて較正した（抄録）。", "p5": "未観測流域の水文モデル構築に再解析の流出量が使えるかを評価した（較正結果の数値は抄録の取得範囲外）（抄録）。", "fun": "大雨のときに斜面が崩れるかどうかは、その前に土がどれだけ湿っていたかに左右されます。流域全体の水の出入りの帳簿から土の湿り具合を見積もるという、地道だけれど警報に役立つ発想の研究です。", "unverified": "モデルの再現精度の数値は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "月面模擬土でのコーン貫入と重力の影響", "title": "Gravity Effect on Cone Penetration in Lunar Regolith Simulant", "url": "https://doi.org/10.1139/cgj-2026-0009", "authors": "Mengmeng Wu ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-22", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Wu, M., Zhu, Q.-Y., Li, R., Liu, B., & Yin, Z.-Y. (2026). Gravity Effect on Cone Penetration in Lunar Regolith Simulant. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0009", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Canadian Geotechnical Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "月面の模擬土でのコーン貫入試験を、地球重力と月重力（1/6g）の両方で行い、DEMで粒子の再配列と応力伝達を調べた（抄録）。", "p3": "磁気相似重力の模型試験法（GMMT）で1gと1/6gのCPTを行い、測ったコーン抵抗の深さ分布で検証した3次元DEMで、粒子の再配列、応力経路、3次元の応力伝達を解析した（抄録）。", "p5": "重力を1gから nomics", "date": "2026-10-20", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Gruber, J., & Solomon, A. (2026). Optimal Flood Insurance in a Second-Best World: Fiscal Spillovers, Reclassification Risk, and Moral Hazard. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag051", "why": "洪水保険と事後の救済を一つの枠組みで比べ、財政への波及と保険料の再区分リスクまで含めて最適な補助を導くQJEの論文。気候リスク政策の設計に直結する。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "新商品は人のつながりを通じて市場に入る", "title": "How New Products Enter Markets: Social Networks, Consumer Imports, and Retailer Learning", "url": "https://doi.org/10.1093/qje/qjag052", "authors": "David Argente ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-10-20", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Argente, D., Méndez, E., & Van Patten, D. (2026). How New Products Enter Markets: Social Networks, Consumer Imports, and Retailer Learning. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag052", "why": "消費者の輸入と社会的ネットワークを使い、小売業者が需要を学ぶ過程を因果的に示した。新商品の普及の仕組みを実証する重要な成果。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "オンライン実験の結果はどこまで信頼できるか", "title": "How Credible Are the Findings from Online Experiments?", "url": "https://doi.org/10.1162/rest.a.1882", "authors": "Abel Brodeur ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "why": "Amazon Mechanical Turkで検証された仮説を網羅的に調べ、公表結果の信頼性を評価する。実験研究の標準に影響しうるメタ研究。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "金メダル獲得後、参加者は競争から共有へ", "title": "From Winning to Giving: The Effect of Gold Medals in Crowdsourcing Contests", "url": "https://doi.org/10.1287/mnsc.2024.07419", "authors": "Shan Liu ほか", "venue": "Management Science", "date": "2026-10-22", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "機械学習コンペの象徴的な表彰が参加者の行動をどう変えるかを示す。非金銭的報酬の効果を大規模な行動データで識別した。"}, {"id": "jn05", "rank": 5, "field": "統計学", "headline": "ストリーミングデータの
