<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

落とし穴を示しています。", "unverified": "モデルと文面を入れ替えた比較（§4.7、表5）の数値は読んでいない。"}}, {"id": "pr03", "rank": 3, "headline": "LLM集団は群集行動と暴走的連鎖に弱い", "title": "LLM Multi-Agent Systems Are Vulnerable to Herding and Runaway Cascades", "url": "https://arxiv.org/abs/2610.30769", "authors": "Farnoosh Hashemi ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Hashemi, F., Ji, S., Chen, J., & Macy, M. W. (2026). LLM Multi-Agent Systems Are Vulnerable to Herding and Runaway Cascades (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30769", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法§2、結果§3.1〜3.4、限界の付録C.8、図1〜3・5）を読んだ", "preprint": true, "p1": "古典的なMusic Lab実験をLLMエージェント集団で再現し、他者の推薦数が見えるとLLM集団は人より強く群集行動に陥り、暴走的な連鎖が自己修正されにくいことを示した（未査読プレプリント）。", "p2": "多エージェントLLMは互いの選択に反応して協働するため、内生的なフィードバックの輪で社会的影響・群集行動・連鎖に弱い可能性があるが、集団規模で人と比べた検証はなかった（§1）。", "p3": "13のモデル集団が、新たに作った48曲の歌詞を読んで推薦するかを決める。属性と好みのジャンルを組み合わせたペルソナで多様性を与える。独立条件（1,440体、件数は見えない）と、件数が見える弱い影響・件数順に並ぶ強い影響の条件（各8つの「並行世界」に720体）を比べる（§2、図1）。推薦は即座に件数に加わり、同じ世界の後続のエージェントの情報になる。", "p4": "独立条件からのずれをKLダイバージェンスで、世界間の結果のばらつきを予測不能性U（28組の世界間の市場シェアの平均絶対差）で、自己修正を前半と後半での「人気と本来の魅力」のスピアマン相関の変化で測り、Salganik et al. (2006) の人のデータと比べた（§2.4〜2.5）。", "p5": "図2の縦軸（対数）はKLで、LLMの平均は人の約9倍（弱い影響）、約4倍（強い影響）。非推論モデルは推論モデルの2.4倍・3.2倍ずれ、GPT-5は人に近く、Gemma 3 4Bは8倍以上だった（§3.1）。図3では影響下の予測不能性が非推論モデルで人の2倍超（§3.2）。最初の30体の選択が、12〜13のモデルで本来の魅力より後の人気をよく予測した。人の連鎖は16世界中15で自己修正（相関0.633→0.773など）したが、LLMでは強い影響下の変化は平均でほぼ0だった（§3.4、図5）。", "p6": "著者は、エージェントが議論や会話の記憶なしに件数だけを見ること、各集団が単一モデルであること、観察の期間内では修正が起きないことを示しただけで長期の修正を否定しないことを限界に挙げる（§3.4、付録C.8）。残る疑問：歌詞の文章による評価という設定の違いが人との比較にどれだけ影響するか（著者も付録B.5で設計の差を整理）。", "fun": "「みんなが良いと言っている曲」にAIも人も流されますが、AIのほうがずっと流されやすく、しかも途中で「やっぱり本当に良い曲はこっち」と戻ってくる力が弱いことが分かりました。AI同士で評価し合う仕組みを作るとき、最初の数票が全体を決めてしまう危うさを教えてくれます。", "unverified": "モデルの知能スコアとの関係（§3.3、付録C.1）の数値は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "超縮約で有限要素モデル更新を高速化", "title": "Hyperreduction accelerates finite element model updating for the discovery of neural materials", "url": "https://arxiv.org/abs/2610.31322", "authors": "Hagen Holthusen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Holthusen, H., Knipper, M., & Linka, K. (2026). Hyperreduction accelerates finite element model updating for the discovery of neural materials (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31322", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法§2、結果§3.1〜3.2、考察、結論§5、図2〜8）を読んだ", "preprint": true, "p1": "ニューラルネットの構成則を有限要素モデル更新で同定するとき、POD＋ECSWの超縮約（hyperreduction）を学習の途中で適応させ、精度を落とさずに学習時間を1桁短縮した（未査読プレプリント）。", "p2": "有限要素モデル更新は任意の形状・境界条件・疎で雑音のあるデータに使える一方、損失を1回評価するたびに荷重ステップごとの非線形FE解析が要り、重みが毎ステップ変わる学習では縮約モデルがすぐ古くなる（§1、§2.2）。", "p3": "釣合い式をPOD部分空間に射影し、内部エネルギーを少数の要素の重み付き和で近似するECSW（エネルギー保存サンプリング・重み付け）で解析を軽くする。縮約モデルの随伴感度で重みに対する厳密な勾配を得る。全次元の解析を挟む「ブートストラップ」と「カナリア」のエポックで縮約誤差を監視し、許容値を超えれば部分空間の次元や要素を増やす（§2.4、図3）。構成則は多凸（polyconvex）なニューラルネットで、対数正規化項と増大項により重みによらずエネルギーが多凸・強圧的・非負になる（§2.3）。", "p4": "2つの実験データ（2相の試験片：Mechanical MNISTの試料、有孔の均質試験片）と1つの合成3次元例で、全次元の同定を基準に、反力の誤差、損失に入れていない変位場（DIC）の再現、所要時間を比べた（§3、表1）。", "p5": "2相の試験片で学習時間は8.95時間から0.69時間へ13分の1になり（図2(d)、§3.1）、反力だけから介在物と母材の違いを学び変位場も再現した（図4）。縮約の許容値を変えてもエポック当たりの高速化は8.6〜60倍で精度は落ちなかった（図7〜8）。合成3次元例では6モードが48,672自由度を置き換え、15,625要素中116要素で内力を評価し、学習は13分だった（抄録）。", "p6": "著者は、変形が局所化すると線形部分空間の縮約の効率が落ちること、全次元のチェックが全体の高速化を頭打ちにすること、同定の精度は縮約ではなくデータの情報量（実験が活性化した変形状態）で制限されることを認める（§5）。例えば合成例では等二軸引張で母材の体積比が1.18のはずが1.66になった（§3.3付近）。", "fun": "実験で測った力から材料の性質をAIに学ばせるには、毎回重いシミュレーションを何千回も回す必要がありました。この研究は計算を「要点の数個の形」と「代表の少数の要素」だけに絞り、しかもAIが学ぶにつれてその要点を入れ替え続けることで、9時間かかった計算を41分にしました。", "unverified": "Case 2（有孔試験片）は全次元の基準がなく、高速化の倍率は著者も未確定としている。"}}, {"id": "pr05", "rank": 5, "headline": "拡散を縮退させた次元縮約で高次元確率応答", "title": "A diffusion-degraded dimension-reduced framework for stochastic response analysis of high-dimensional nonlinear systems", "url": "https://doi.org/10.2139/ssrn.7657195", "authors": "Xin Huang ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Huang, X., Lyu, M., & Chen, J. (2026). A diffusion-degraded dimension-reduced framework for stochastic response analysis of high-dimensional nonlinear systems. https://doi.org/10.2139/ssrn.7657195", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "高次元の非線形構造物のランダム応答の確率密度を、補助過程を使わない1次元の次元縮約確率密度発展方程式（1D DR-PDEE）で直接求める方法を提案した（未査読プレプリント、抄録）。", "p2": "白色雑音の下ではフォッカー・プランク方程式（FPK）が厳密な枠組みだが、次元の呪いで高次元に使えない。代わりのDR-PDEEは、1次元にすると拡散項が消えるため補助過程を加える必要があり、計算の複雑さと近似誤差が増えていた（抄録）。", "p3": "関心のある1つの応答量の密度の発展を、拡散項のない「ドリフトだけの」1次元方程式として直接立てる。背景：PDEEは関心量の密度が条件付き期待値のドリフトで移流されるという式で、そのドリフト関数を推定する必要がある。本論文は頑健なLOWESS平滑化と最小二乗回帰を組み合わせて内在的なドリフト関数を推定し、方程式の積分形を時間適応格子の経路積分解（PIS-TAG）で解く（抄録）。拡散がないため方程式は双曲型になり、その性質を手法の中で扱う。", "p4": "白色雑音と非白色雑音を受ける多自由度（MDOF）構造物の数値例で、精度と効率を評価した（比較対象と評価指標の詳細は抄録に記載なし）（抄録）。", "p5": "提案法が確率応答の特徴づけで優れた精度と効率を示したと報告する（具体的な数値・図表は抄録では未確認）（抄録）。", "p6": "抄録からは、比較の基準（モンテカルロ法との誤差など）、対象とした自由度の数、ドリフト推定に必要な標本数が分からない。残る疑問：ドリフトだけの方程式で、分布の広がりを表す情報がどこまで保たれるか（解釈）。", "fun": "たくさんの部分が揺れる建物の「揺れの確率分布」は、変数が多すぎて普通は計算できません。この研究は知りたい1つの量だけに注目し、その分布が時間とともに「流されていく」様子を、流れの速さをデータから推定して追いかけます。複雑な問題を1本の流れに縮める発想が面白いところです。", "unverified": "数値例の自由度の数、誤差と計算時間の数値、比較手法はいずれも未確認（本文を入手できず）。"}}, {"id": "pr06", "rank": 6, "headline": "AIエージェント導入後に利益調整が変化", "title": "Does Corporate AI Agent Adoption Reshape Earnings Management? Evidence from Chinese A-share Listed Firms", "url": "https://doi.org/10.2139/ssrn.7654338", "authors": "Qun Cao ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Cao, Q., & Hu, X. (2026). Does Corporate AI Agent Adoption Reshape Earnings Management? Evidence from Chinese A-share Listed Firms. https://doi.org/10.2139/ssrn.7654338", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "中国A株企業で、AIエージェントの導入後に裁量的発生高（DisAcc）が負の方向へ動き、利益を押し上げる方向の利益調整が減ることを示した（未査読プレプリント、抄録）。", "p2": "AIエージェントという新しい技術が企業の財務報告の行動をどう変えるかは実証が乏しい（抄録）。", "p3": "公開情報からChatGPTと人手の確認を組み合わせてAIエージェント導入の変数を作り、2003〜2025年の標本で差の差分析を行う。符号つきDisAccと絶対値DisAccを分け、正のDisAccの部分標本と負の部分標本に分ける方向別の分解も行う（抄録）。背景：裁量的発生高は利益のうち経営者の判断で動かせる部分の推定値で、正なら利益の上方修正を示唆する。", "p4": "PSM（傾向スコアマッチング）後の頑健性、資金制約の強弱・監査人（Big4か否か）・国有か否かの部分標本で効果の異質性を調べた（抄録）。", "p5": "導入後に符号つきDisAccは有意に負へ動いたが、絶対値DisAccは有意に変化しなかった。正のDisAccの部分標本では減少し、統制変数を入れると負の部分標本でもさらに負へ動いた。効果は資金制約の強い企業、非Big4監査、非国有企業で強かった（抄録）。", "p6": "抄録からは、効果の大きさ、導入の時期の決まり方（自己選択）への対処、ChatGPTによる変数構築の精度が分からない。残る疑問：絶対値が変わらないことは「調整の量は同じで向きが変わった」ことを意味するのか（解釈）。", "fun": "会社がAIを入れると会計の数字は正直になるのでしょうか。この研究では、利益を良く見せる方向の調整は減ったものの、調整の量そのものは変わりませんでした。AIが不正を減らすのか、単に調整の向きを変えただけなのか、という問いが残る点が興味深いところです。", "unverified": "係数の大きさ、標本数、導入企業の数は未確認（本文を入手できず）。"}}, {"id": "pr07", "rank": 7, "headline": "日本の収益認識基準の収斂は有用性を高めたか", "title": "Does Revenue Recognition Convergence Improve Financial Reporting Usefulness? Evidence on the Role of Institutional Complementarity from Japan", "url": "https://doi.org/10.2139/ssrn.7661454", "authors": "Ichiro Mukai", "venue": "SSRN", "date": "2026-10-23", "apa": "Mukai, I. (2026). Does Revenue Recognition Convergence Improve Financial Reporting Usefulness? Evidence on the Role of Institutional Complementarity from Japan. https://doi.org/10.2139/ssrn.7661454", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "日本の新収益認識基準（企業会計基準第29号）の強制適用を準自然実験として使い、基準の国際的な収斂だけでは財務報告の意思決定有用性は高まらないことを示した（未査読プレプリント、抄録）。", "p2": "会計基準の変更は多くの場合、制度改革と同時に起きるため、基準そのものの効果を切り分けられなかった（抄録）。", "p3": "日本では同じ制度環境の下で日本基準・IFRS・米国基準の企業が並存する。IFRS 15・ASC 606とほぼ同じ内容の基準第29号を日本基準の企業が強制適用したことを処置とし、2019〜2024年度の傾向スコアでマッチした標本で、企業と年の固定効果つきの差の差分析を行う。基準変更による会計数値の変化の大きさ（処置の強さ）の違いも使う（抄録）。", "p4": "意思決定有用性を、売上高が将来利益を予測する力、売上サプライズへの市場の反応という売上の情報性と、利益の価値関連性で測った（抄録）。", "p5": "適用後に売上の情報性も利益の価値関連性も有意な改善はなかった（抄録）。著者は、基準の情報上の便益は、基準と制度環境の補完性に依存する可能性があると解釈する（抄録）。", "p6": "抄録からは、対照群（IFRS・米国基準の企業）の規模、検出力、コロナ禍の時期との重なりへの対処が分からない。残る疑問：有意でない結果が「効果なし」を意味するのか、効果を検出する力が足りないのか（解釈）。", "fun": "同じ国の中で、日本のルール、国際ルール、米国ルールの会社が並んでいる日本は、会計ルールの効果を比べる絶好の実験室です。国際ルールに合わせた新しい基準を入れても情報の役立ち方は変わらなかった、という結果は、ルールだけ変えても周りの仕組みが伴わなければ効果は出ないことを示唆します。", "unverified": "標本数と推定値、信頼区間は未確認（本文を入手できず）。"}}, {"id": "pr08", "rank": 8, "headline": "較正なしでIMUの相対姿勢を推定", "title": "Calibration-free IMU-based Relative Orientation Estimation under Dynamic Human Motion", "url": "https://arxiv.org/abs/2610.31156", "authors": "Ruiyuan Li ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Li, R., Osman, H., Seth, A., & Kok, M. (2026). Calibration-free IMU-based Relative Orientation Estimation under Dynamic Human Motion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31156", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（モデル§III、手法§IV、シミュレーション§V、実験§VI-A、結論§VII、表I）を読んだ", "preprint": true, "p1": "磁気センサを使わず、センサの取付け位置の事前較正も全体の向きの基準もなしに、関節をはさむ2つのIMUの相対姿勢と取付け位置を同時に推定する拡張カルマンフィルタ（EKF）を示した（未査読プレプリント）。", "p2": "磁気センサなしの方法は剛体拘束で漂流を減らせるが、取付け位置の事前較正、ヒンジ関節などの関節モデル、限られた運動、全体の向きの基準のいずれかを必要とした。歩行の踵接地の衝撃や、雑音のある計測の数値微分の問題も明示的に扱われていなかった（§I）。", "p3": "状態は2つのセンサの姿勢偏差と、関節中心からの取付け位置ベクトル（計12次元）で、取付け位置はほぼ一定とみなす小さな過程雑音を与える（式7〜8）。2つのセンサの加速度が同じ関節中心の加速度に一致するという剛体拘束を観測式にし、角加速度は5点の数値微分で求める。計測は先に6Hzのゼロ位相低域通過フィルタ（LPF）で衝撃の外れ値を除く（アルゴリズム1、§VI）。", "p4": "系統的なシミュレーション（§V）と、OpenSenseデータ（4人、股・膝・足首、歩行と着座・階段・横歩き・走行の複合課題、Xsens IMUとViconの真値、100Hz）で、収束窓50秒の後の相対姿勢誤差を比べた。比較はオフライン較正の位置を使う既存法（Weygers）とマーカー由来の位置を使う版、LPFなし版など（§VI-A）。", "p5": "表Iで全体の相対姿勢誤差は提案法2.61°、Weygers 10.40°（75%減）、マーカー位置のWeygers 7.43°（65%減）。LPFなしの提案法は6.85°で、LPFが改善の大きな要因だった（§VI-A）。シミュレーションでは、姿勢の精度は関節中心の加速度、位置の精度は相対角速度という別々の運動強度に依存した（§V、図4）。", "p6": "著者は、今後の課題として解剖学的な関節角への拡張（センサと体節の自動較正）を挙げる（§VII）。残る疑問：関節中心の加速度が小さい静かな動作では推定が収束しにくいとみられ（シミュレーションの結果からの解釈）、実用ではその区間をどう扱うか。", "fun": "体に付けた2つのセンサの向きの違いから膝の曲がり具合を知るには、普通はセンサが体のどこに付いているかを先に測っておく必要があります。この方法は動いているうちに付けた位置も一緒に推定し、しかも足が地面に当たる衝撃のノイズを先に取り除くことで、誤差を4分の1にしました。", "unverified": "関節ごと・課題ごとの誤差（表Iの内訳）と取付け位置の誤差（図6）の数値は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "2次元粒状体の強非線形な波動の連続体モデル", "title": "Strongly non-linear continuous model for wave propagation in 2D granular media: derivation and hyperbolicity analysis", "url": "https://hal.science/hal-05835978v1", "authors": "Cominelli Sebastiano ほか", "venue": "HAL", "date": "2026-10-22", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用。本文は取得できず", "preprint": true, "p1": "ヘルツ接触から均質化によって、2次元粒状体の波動伝播を表す強非線形の連続体モデル（ひずみ勾配モデル）を導き、その双曲性の条件と波速の深さ依存性を示した（未査読プレプリント、抄録）。", "p2": "粒状体の波動は粒の接触の非線形性で強く非線形になり、Nesterenkoの1次元の理論を2次元へ広げる連続体の記述が必要だった（抄録）。", "p3": "球形・単一粒径の粒、局所周期性、Cauchy-Born仮説（巨視的な変形が粒の配置にそのまま写るという仮定）を置き、接触摩擦を無視してヘルツ接触則から均質化する。得られるモデルは変位場の1階と2階の勾配に依存する。主要次の系の固有値・固有ベクトルから、限られた変形の範囲で双曲性が成り立つ条件を示す（抄録）。背景：双曲性は、波が有限の速さで伝わる方程式として正しく解けるための条件である。", "p4": "陽的な有限体積法で解き、重力による沈降と波動伝播を調べ、既存の個別要素法（DEM）シミュレーションの予測と比べた（抄録）。", "p5": "縦波と横波の速さの解析式を導き、それらが深さ（自重による圧縮）に依存することを示した（具体的な一致度は抄録では未確認）（抄録）。", "p6": "抄録では、より複雑な充填形状、接触則、接触網が変化する大変形への拡張は今後の課題とされる。残る疑問：摩擦の無視と単一粒径の仮定が、実際の砂や礫での波速の予測にどれだけ効くか（解釈）。", "fun": "砂山の中を伝わる揺れは、粒同士の「点の接触」の硬さが押す力によって変わるため、ばねの普通の波とは違う、とても非線形な波になります。たくさんの粒の集まりを一つの連続した物質のように扱う式を作り、深いところほど波が速く伝わる理由を数式で示した点が面白い研究です。", "unverified": "DEMとの比較の誤差、双曲性が成り立つ変形の範囲の具体値は未確認（本文を入手できず）。"}}, {"id": "pr10", "rank": 10, "headline": "近隣の結束は高齢者の睡眠障害を減らす", "title": "Longitudinal Associations Between Neighborhood Social Cohesion and Sleep Disturbance Among Older Adults: The Mediating Role of Depressive Symptoms", "url": "https://doi.org/10.21203/rs.3.rs-11465830/v1", "authors": "Qinghong Zhou ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Zhou, Q., Lu, N., Li, W., & Yao, W. (2026). Longitudinal Associations Between Neighborhood Social Cohesion and Sleep Disturbance Among Older Adults: The Mediating Role of Depressive Symptoms. https://doi.org/10.21203/rs.3.rs-11465830/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（測定・分析・結果・限界の節と表3）を読んだ", "preprint": true, "p1": "米国の高齢者の16年間の追跡で、近隣の社会的結束の高さと変化が、抑うつ症状を介して睡眠障害と結びつくことを、潜在成長曲線の媒介モデルで示した（未査読プレプリント）。", "p2": "高齢期の睡眠障害は多く、抑うつと同時に起きやすいが、その発達に関わる社会的・心理的要因、とくに近隣環境の役割と経路はよく分かっていなかった（序論）。", "p3": "健康と退職研究（HRS）の心理社会的な部分標本の5波（2006〜2022年）、50歳以上の3,360人を使う。睡眠障害は修正Jenkins睡眠尺度（4項目）、社会的結束は「この地域の人は信頼できない」など4項目（7段階）、抑うつはCES-D 8項目で測る（測定の節）。3つの変数それぞれの初期値（切片）と変化率（傾き）を潜在成長曲線で表し、切片どうし・傾きどうしの媒介経路を推定する（分析の節）。", "p4": "年齢、性別、人種、教育、婚姻、主観的健康、子の数、所得、転居を統制した。モデル適合はRMSEA・CFI・SRMRで評価し、媒介はブートストラップなどの95%信頼区間で判断した（結果の節）。", "p5": "媒介モデルの適合はRMSEA 0.027、CFI 0.971。表3では切片レベルで結束→抑うつ B = −0.410、抑うつ→睡眠障害 B = 0.758、直接効果は B = 0.039 で有意でなく、抑うつを介した間接効果が B = −0.311（95%CI [−0.383, −0.239]）だった。傾きレベルでも結束の低下が抑うつの増加と関連し（B = −0.351）、睡眠障害の変化への間接経路も有意だった（B = −0.332、抄録）。", "p6": "著者は、睡眠が自己報告であること、睡眠時間などの未測定の交絡、追跡からの脱落、因果や厳密な時間順序を示すものではないことを限界に挙げる（限界の節）。解釈：CES-Dには「よく眠れなかった」の項目が含まれ、媒介変数と結果変数が部分的に重なる可能性がある。", "fun": "「近所の人を信頼できるか」という気持ちが、年を取ってからの眠りの質にまで関わっているという研究です。ただし近所づきあいが直接眠りを良くするのではなく、気分の落ち込みを防ぐことを通じて効いているらしい、という「回り道の経路」を16年分のデータで描いた点が面白いところです。", "unverified": "感度分析（転居者の除外など）の結果は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "多入力の深層学習で中小企業の債務不履行を予測", "title": "A Multi-Input Approach for SME Default Using Explainable Deep Learning", "url": "https://doi.org/10.21203/rs.3.rs-11279477/v1", "authors": "Belinda Laura Del Gaudio ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Gaudio, B. L. D., Petrella, R. C., Scognamiglio, S., & Zanetti, P. (2026). A Multi-Input Approach for SME Default Using Explainable Deep Learning. https://doi.org/10.21203/rs.3.rs-11279477/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（モデル構成§3、データ§4、結果§5.1〜5.2、結論§6、表1〜2・図4）を読んだ", "preprint": true, "p1": "財務の時系列、ガバナンスの表形式の特徴、地域のカテゴリ変数を別々の部分ネットワークで処理する多入力ニューラルネット（MI-Net）で、イタリアの中小企業の1年先の債務不履行を予測し、Shapley値で入力ブロックごとの寄与を示した（未査読プレプリント）。", "p2": "中小企業のデフォルト予測では、ロジスティック回帰などの従来手法は異なる種類のデータ（時間変化する財務、ほぼ一定のガバナンス、地域）を一律に扱い、深層学習は説明が難しいという問題があった（§2.4）。", "p3": "財務・経済の時系列はLSTM、ガバナンス変数（取締役会の構成、性別、年齢、意思決定構造など）は全結合ネット（FFNN）、地域は埋め込み層で表現し、デコーダで統合して不履行確率を出す（§3.1〜3.4、図2）。モジュール構造なので、各ブロックの寄与をShapley値で分けて示せる（§3.5）。", "p4": "AIDAデータベースのイタリア中小企業（2013〜2022年、3年以上存続、零細企業は除外）で、2020年末時点から2021年、2021年末時点から2022年の不履行を予測する2つのシナリオを設定。比較はロジスティック回帰、XGBoost、Crosato et al. (2023) のFFNN。主指標はROC-AUCで、正解率・特異度・感度も見る（§4、§5.1）。", "p5": "表1で、MI-Netは両シナリオの訓練・試験の両方でROC-AUCが最も高く、2022年の試験データで差が大きかった（抽出したテキストの読み取りでは、2022年試験でMI-Net 0.927、XGBoost 0.920、FFNN 0.897、ロジスティック回帰 0.855）。表2では正解率も最も高く、2021年ではXGBoostと同じ感度でより高い特異度だった。図4のShapley値では財務・経済の変数が支配的で、地域は平均20%未満だが無視できない寄与だった（§5.2）。", "p6": "著者は、零細企業を対象外としたこと（財務の簡略様式とガバナンスの変動の乏しさのため）を明示している（§4）。残る疑問：AUCの差の統計的な有意性と、時系列の長さを変えたときの頑健性は確認できなかった（解釈）。", "fun": "会社の倒産を予測するとき、決算の数字の「流れ」、経営陣の顔ぶれ、どこの地方にあるかは性質の違う情報です。この研究はそれぞれに専用の読み方をするAIの部品を用意して合体させ、どの情報がどれだけ判断に効いたかまで分けて示しました。中身が見えるAIの作り方の一例です。", "unverified": "表1の数値の列の対応は抽出テキストから読み取ったもので、元の表の体裁では未確認。"}}, {"id": "pr12", "rank": 12, "headline": "AI開示の「口」と「実」がボラティリティを分ける", "title": "Talk or Walk? AI Disclosure and Firm Idiosyncratic Volatility: Evidence from Korea", "url": "https://doi.org/10.2139/ssrn.7661553", "authors": "Thi Ngoc Anh Nguyen ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Nguyen, T. N. A., & Jung, H. (2026). Talk or Walk? AI Disclosure and Firm Idiosyncratic Volatility: Evidence from Korea. https://doi.org/10.2139/ssrn.7661553", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "韓国上場企業の年次報告書のAI関連の文を検証済みのLLMで判定し、宣伝的な語調（AI Talk）ではなく裏づけのある記述（AI Walk）が翌年の固有ボラティリティの低さと関連することを示した（未査読プレプリント、抄録）。", "p2": "企業のAI開示が投資家のリスク認識にどう関わるかは、外部のAI活動のデータがない市場では測りにくく、開示の「中身」と「宣伝」を区別する測定が必要だった（抄録）。", "p3": "65,485のAI関連の文を、2人の人の符号化者を基準に検証したLLMで、宣伝的な語調（Talk）と検証可能な裏づけ（Walk）に評点する。背景：固有ボラティリティは市場全体の動きで説明できない個別株の価格変動で、企業固有のリスクの指標とされる（抄録）。", "p4": "保留データでLLMとWalk評点の人の一致（重み付きκ）を測り、2020〜2024年の3,831企業年で翌年の固有ボラティリティとの関係を回帰で調べた。代替のボラティリティ指標、追加統制、マッチング、選択モデルで頑健性を確かめ、企業間・企業内の差を分けた（抄録）。", "p5": "LLMと人のWalk評点の一致はκ = 0.81で、人どうし（0.90）に近かった。裏づけのある開示の企業ほど翌年の固有ボラティリティが有意に低く、宣伝的な語調には頑健な関連がなかった。関連は企業内の変化ではなく企業間の差から生じ、AI特許はむしろ高いボラティリティと関連した（抄録）。", "p6": "抄録からは、効果の大きさと、裏づけのある開示をする企業の他の性質（規模やガバナンス）による交絡の扱いの詳細が分からない。残る疑問：企業間の差だけから生じることは、開示が原因というより、裏づけを書ける企業の性質を映している可能性を示す（解釈）。", "fun": "「当社はAIで未来を切り開きます」という威勢のいい言葉より、「この業務にこのAIを入れてこれだけ効率化した」という具体的な記述のほうが、株価の不安定さの少なさと結びついていました。AIに文章を読ませて、言葉の「口だけ度」と「実行度」を測り分けた点が面白い研究です。", "unverified": "回帰係数の大きさ、LLMの種類、評点の基準の詳細は未確認（本文を入手できず）。"}}, {"id": "pr13", "rank": 13, "headline": "AI導入は従業員の賃金を高めた（中国）", "title": "AI Adoption and the Resource-Compensating Wage Effect: Firm-Level Evidence from China", "url": "https://doi.org/10.2139/ssrn.7661660", "authors": "Jiao Li ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Li, J., & Li, S. (2026). AI Adoption and the Resource-Compensating Wage Effect: Firm-Level Evidence from China. https://doi.org/10.2139/ssrn.7661660", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "中国A株上場企業（2009〜2023年）で、企業のAI導入の度合いが従業員の賃金を高め、その効果は資金制約が強く革新能力の低い企業で大きいことを示した（未査読プレプリント、抄録）。", "p2": "AIが労働市場と仕事を変えるなか、企業レベルのAI導入が賃金に与える影響と、その効果が企業の資源によってどう違うかは十分に分かっていなかった（抄録）。", "p3": "上場企業の大標本で企業のAI導入の度合いを測り、従業員の賃金との関係を推定する。代替の測定と推定法で頑健性を確かめ、資金制約と革新能力で異質性を調べた（AI導入の測定方法の詳細は抄録に記載なし）（抄録）。", "p4": "評価の焦点は、AI導入と賃金の正の関係が測定と推定の方法を変えても保たれるかと、効果が資源の乏しい企業で大きいか小さいかである（抄録）。", "p5": "AI導入の度合いは従業員の賃金を有意に高め、代替の測定・推定でも一貫した。賃金を高める効果は資金制約の強い企業と革新能力の低い企業で強かった（抄録）。著者は、AIが資源の補完ではなく資源を補う技術として働くと解釈し、「資源補償的な賃金効果」と呼ぶ（抄録）。", "p6": "抄録からは、効果の大きさ、AI導入の内生性（賃金を上げられる企業がAIを入れる可能性）への対処、雇用者数の変化（賃金上昇が人員削減と同時か）が分からない。残る疑問：平均賃金の上昇が個々の労働者の賃金上昇なのか、構成の変化なのか（解釈）。", "fun": "AIは「もともと強い会社をさらに強くする」と思われがちです。ところがこの研究では、お金や技術の蓄えが少ない会社ほど、AIの導入で従業員の賃金が大きく上がっていました。AIが足りない資源を補う道具として働くなら、格差を縮める可能性もある、という見方が面白いところです。", "unverified": "推定値、標本数、AI導入の測定方法は未確認（本文を入手できず）。"}}, {"id": "pr14", "rank": 14, "headline": "状態空間オートエンコーダの転移メタ学習", "title": "Transfer Meta-Learning for State Space Autoencoders", "url": "https://arxiv.org/abs/2610.31318", "authors": "Stefano De Carli ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "De Carli, S., Masti, D., Previtali, D., & Mazzoleni, M. (2026). Transfer Meta-Learning for State Space Autoencoders (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31318", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§3、数値実験§4.1〜4.6、結論§5、表2・図1〜3）を読んだ", "preprint": true, "p1": "同じ系の族に属する未知の対象系について、短い入出力の軌跡（文脈）だけから、追加学習なしで小さな状態空間モデルのパラメータを生成する転移メタ学習（Transfer-Meta SSAE）を示した（未査読プレプリント）。", "p2": "非線形システム同定は対象ごとに実験とモデル当てはめが必要で費用が高い。文脈内メタ学習はゼロショット予測ができるが巨大なブラックボックスで、明示的な状態空間モデルを与えない。一方、小さな構造化状態空間モデルはシミュレーション・推定・制御に向くが対象ごとに当てはめが要る（§1）。", "p3": "事前学習して重みを固定した時系列エンコーダが文脈から系の埋め込みを取り出し、アフィンなパラメータ写像がそれを小さなニューラル状態空間オートエンコーダ（SSAE）のパラメータに変換する（§3.2、図1）。対象系での最適化はしない。SSAEの状態エンコーダは過去の計測から潜在状態を復元し、状態遷移写像で将来の入力に対して再帰的にシミュレーションする（§3.3）。参照の文脈内予測器より桁違いにパラメータが少ない（抄録）。", "p4": "Buck–Boost変換器とBouc–Wen履歴振動子の2つの系の族で、パラメータを一様に変えた保留の試験系に対し、対象ごとに雑音つきデータで当てはめた個別SSAEとNARXと比べた。指標はFIT指数（100(1−誤差ノルム/平均からの偏差ノルム)%）で、1段先予測と開ループのシミュレーションを評価した（§4.4〜4.5）。", "p5": "表2で、シミュレーションの中央値FITは提案法がBuck–Boost 84.4%、Bouc–Wen 88.5%で、NARXの27.7%と78.7%、個別SSAEの−2.7%と47.6%を上回った。1段先予測ではNARXが同等以上（Buck–Boost 93.4%）だが、出力を再帰的に戻すとずれた。NARXはBuck–Boostで1,024中191のシミュレーションが発散した（§4.6）。図3の中央値の例では提案法が出力の動態を再現した。", "p6": "著者は、最悪の場合のシミュレーションFITがBuck–Boostで52.3%、Bouc–Wenで24.0%に落ち、ゼロショットの生成が常に成功するわけではないと認める（§4.6）。残る疑問：検証は数値の2つの族に限られ、実測データや族の範囲外の系での性能は示されていない（解釈）。", "fun": "同じ種類の機械でも一台ずつ少しずつ性質が違うので、普通は一台ごとに長い測定をしてモデルを作ります。この方法は、たくさんの仲間の機械から「この種類の機械らしさ」を学んでおき、新しい一台を少し動かしただけで、その一台専用の小さなモデルを即座に作ってくれます。", "unverified": "計算時間の比較（§4.7）の数値は読んでいない。"}}, {"id": "pr15", "rank": 15, "headline": "ダム変形の全場を低次元表現から再構成", "title": "Nonlinear dimensionality reduction and full-field reconstruction of high-dimensional dam deformation responses", "url": "https://doi.org/10.2139/ssrn.7661624", "authors": "Liang Jiaming ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Jiaming, L., Zhanchao, L., & Xingyang, L. (2026). Nonlinear dimensionality reduction and full-field reconstruction of high-dimensional dam deformation responses. https://doi.org/10.2139/ssrn.7661624", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "重力式コンクリートダムの5万次元を超える節点の変形応答を、VAEで128次元に圧縮し、9つの工学パラメータから全場の沈下を予測したうえで、節点ごとの残差学習で補正する方法を示した（未査読プレプリント、抄録）。", "p2": "ダムの全場の変形を工学パラメータから予測する代理モデルは出力の次元が非常に高く、回帰が難しい。全体の代理モデルだけでは局所の誤差が残る（抄録）。", "p3": "節点応答を相関に従って2次元の入力に並べ、変分オートエンコーダ（VAE）で低次元表現を取り出す。深層ニューラルネット（DNN）が工学パラメータを潜在変数に写し、復号して全場を得る。さらに、条件による変調とPhysics-Attentionのスライス間の相互作用で、ケース条件と節点の近傍の特徴から節点ごとの残差を学習し、全場に足して補正する（抄録）。", "p4": "重力式コンクリートダムの有限要素解析1,000サンプルで、50,035次元の節点応答と9次元の工学パラメータを使い、VAE–DNNの全体代理モデルと、残差補正つきのモデルを検証・試験データで比べた（抄録）。", "p5": "残差補正は全体代理モデルに比べ、平均絶対誤差を検証で20.93%、試験で19.49%、二乗平均平方根誤差を6.92%と8.66%減らした。RMSEが下がったケースは検証の90.00%、試験の88.00%だった（抄録）。", "p6": "抄録からは、学習データが有限要素の解析結果だけで実測データでの検証がないこと（解釈）、9つのパラメータの種類、残りの約1割のケースで誤差が増えた理由が分からない。", "fun": "ダムの5万か所の動きを一つずつ予測するのは大変ですが、それらは互いに連動しているので、128個の「要点」にまとめて予測し、最後に場所ごとの細かなずれだけを別のAIで直す、という二段構えにしました。大きな流れと細部の修正を分けて担当させる発想が分かりやすい研究です。", "unverified": "9つの工学パラメータの内容、誤差の絶対値は未確認（本文を入手できず）。"}}, {"id": "pr16", "rank": 16, "headline": "ニューラル補助UKFで地上車両の航法", "title": "A Hybrid Neural-Assisted Unscented Kalman Filter for Unmanned Ground Vehicle Navigation", "url": "https://doi.org/10.2139/ssrn.7657015", "authors": "Gal versano ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "versano, G., & Klein, I. (2026). A Hybrid Neural-Assisted Unscented Kalman Filter for Unmanned Ground Vehicle Navigation. https://doi.org/10.2139/ssrn.7657015", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "IMUとGNSSを融合するアンセンテッド・カルマンフィルタ（UKF）の雑音共分散を、深層ニューラルネットで逐次予測する地上無人車両の航法法（抄録）。", "p3": "UKFの式は変えず、生のIMU・GNSS計測から過程雑音と観測雑音の不確実性をネットワークで推定する。学習はシミュレーションのデータだけで行う（sim2real）（抄録）。", "p5": "車種・センサ・路面の異なる3つのデータセット（計160分）で、適応型のモデルベース手法より位置精度が12.7%改善した（抄録）。", "fun": "カーナビの位置推定は「センサがどれくらい信用できるか」という見積もりで精度が決まります。この研究はその見積もりを状況に応じてAIに任せ、しかも学習は本物の走行ではなく計算機上の模擬走行だけで済ませた点が面白いところです。", "unverified": "雑音共分散の予測ネットワークの構造と、3データセットごとの改善幅は抄録に記載がなく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "物理制約つきNNで橋梁鋼の疲労き裂進展を予測", "title": "A Physics-informed neural network for fatigue crack growth prediction of Q345qD bridge steel based on multiscale fracture-mechanics constraints", "url": "https://doi.org/10.2139/ssrn.7657705", "authors": "Yonghao Chu ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Chu, Y., Liu, Q., Ma, R., Hong, J., & Wang, Y. (2026). A Physics-informed neural network for fatigue crack growth prediction of Q345qD bridge steel based on multiscale fracture-mechanics constraints. https://doi.org/10.2139/ssrn.7657705", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "橋梁用鋼Q345qDの疲労き裂進展を、多尺度の破壊力学モデルを損失関数に組み込んだ物理情報ニューラルネット（PINN）で予測する（抄録）。", "p3": "入力は繰返し数N、最大荷重Fmax、初期き裂長a0と、logN・a0/Wの物理的特徴量。真のき裂長から作る量（ΔKなど）は入力に使わず、予測き裂長に基づく物理制約として損失に入れ、目的変数の漏れを防ぐ。CT試験片のデータでSVR・XGBoost・LGBM・ANNと比べる（抄録）。", "p5": "抄録の取得範囲では、比較の数値結果は確認できなかった（抄録が途中で切れている）。", "fun": "AIにき裂の伸びを予測させると、答えに近い情報をこっそり入力に混ぜてしまい「よく当たる」ように見えることがあります。この研究は答えに由来する量を入力から外し、物理法則の形でだけ教えるという、ずるをしない予測の作り方を工夫しています。", "unverified": "PINNと比較手法の予測精度の数値は未確認（抄録が途中まで）。"}}, {"id": "pr18", "rank": 18, "headline": "打撃後の超音波減衰で鉄道車輪の損傷検出", "title": "Damage detection in railway wheels from impact-induced ultrasonic ring-down using self-referenced decay features", "url": "https://arxiv.org/abs/2610.30541", "authors": "Aashish Shaju ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Shaju, A., Southward, S., & Ahmadian, M. (2026). Damage detection in railway wheels from impact-induced ultrasonic ring-down using self-referenced decay features (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30541", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ハンマー打撃後の超音波の減衰（リングダウン）から、停車中の鉄道車輪の損傷を非接触で選別する方法（抄録）。", "p3": "空中伝搬の超音波で応答を測り、減衰率を卓越周波数で正規化した実効減衰比と、打撃ごとのばらつきの2つの特徴を使う。2施設の22輪軸で評価し、学習型（ランダムフォレスト）と閾値型を比べた（抄録）。", "p5": "一方のデータで学習したランダムフォレストは他方で性能が悪かった。2特徴の閾値法は他方のデータを全て正しく分類し、1輪ずつ除く厳しい検証でも22輪中21輪を正しく分類した（損傷輪は全て検出、健全輪1つが誤検出）（抄録）。", "fun": "スイカを叩いて中身を確かめるように、車輪を叩いて「響きの消え方」で傷を見つける研究です。複雑なAIより、意味のはっきりした2つの数字に閾値を引くほうが別の現場にも通用した、という結果が教訓的です。", "unverified": "閾値の値と、各特徴の分布の重なりは未確認。"}}, {"id": "pr19", "rank": 19, "headline": "オイラー型高速動き推定でサブピクセル振動計測", "title": "Eulerian fast motion estimation for real-time sub-pixel vibration measurement", "url": "https://doi.org/10.2139/ssrn.7656773", "authors": "Zongqin Hang ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Hang, Z., Du, W., Can, C., a, D., Xie, K., Lei, D., Fu, Z., & Huang, W. (2026). Eulerian fast motion estimation for real-time sub-pixel vibration measurement. https://doi.org/10.2139/ssrn.7656773", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "画像の濃淡ヒストグラムの統計量だけで変位を推定し、1点あたり約1msで動くサブピクセルの振動計測法EFMEを提案（抄録）。", "p3": "各フレームの変位推定を、関心領域の大きさに依らない固定長の濃淡ヒストグラム統計に帰着させ、照明の加算的変化に解析的に不変にする。レーザー変位計を基準に、標点つきの対象と模様の弱い鋼板、模型橋で検証（抄録）。", "p5": "位相ベース法（124ms）より2桁以上、追跡型手法より17〜51倍速い。変位RMSEは0.034〜0.107mm、約70μm（約1/5画素）の微振動を追跡し、固有振動数の相対誤差は鋼板で0.6%未満、模型橋で2.2%以内（抄録）。", "fun": "カメラで橋の揺れを測るには、画像の中の小さなずれを追いかける重い計算が必要でした。この研究は「明るさの分布の偏り」という簡単な数字だけでずれを読み取り、1画素の5分の1ほどの揺れまでほぼ即時に測れるようにしました。", "unverified": "模型橋の諸元と照明変化下での検証条件は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "構造保存の縮約モデルで超音速パネル振動", "title": "Structure-preserving reduced-order models of thin panels in supersonic and hypersonic flow", "url": "https://arxiv.org/abs/2610.31504", "authors": "Miguel A. Aguilo", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Aguilo, M. A. (2026). Structure-preserving reduced-order models of thin panels in supersonic and hypersonic flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31504", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "エネルギー収支を構造的に満たす学習型の縮約モデルで、超音速・極超音速流中の薄板パネルの振動を再現する（抄録）。", "p3": "Ritz-Galerkinの参照モデルの厳密なポテンシャルを保ったまま、残りの一般化力を学習し、エネルギーを増やさない散逸だけを訓練する。AePW-4の2課題（Mach 1.92の固定板、Mach 5.85の片持ち板）に適用（抄録）。", "p5": "学習モデルのエネルギー収支の最大相対残差は2.2e-15。RC-19では30回の実行の平均卓越周波数が実測236Hzの1.0%以内で、周期・カオスの2条件で既報モデルと同じ応答領域を16回すべてで再現した（抄録）。", "fun": "AIに物理を学ばせると、エネルギーが勝手に湧き出す「永久機関」のような答えを出すことがあります。この研究はエネルギーが増えない形をあらかじめモデルに組み込み、学習の中身がどうであれ物理法則が守られるようにしました。", "unverified": "HyMAX（Mach 5.85）での精度の数値は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "グラフ分割による局所POD圧縮", "title": "Adaptive Local Proper Orthogonal Decomposition via Graph Partitioning and Provable Error-Bounded Lossy Compression for Parametric Series in Finite-Dimensional Function Spaces", "url": "https://arxiv.org/abs/2610.31375", "authors": "Roberto Nuca ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Nuca, R., Parsani, M., & Dalcin, L. (2026). Adaptive Local Proper Orthogonal Decomposition via Graph Partitioning and Provable Error-Bounded Lossy Compression for Parametric Series in Finite-Dimensional Function Spaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31375", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "領域を階層的にグラフ分割し、部分領域ごとに階数を変える局所POD（固有直交分解）で、誤差上限つきのスナップショット圧縮を行う（抄録）。", "p3": "直交な分割では全体の二乗再構成誤差が局所の寄与の和に厳密に分解できることを示し、誤差許容量を部分領域に配分して最小の局所階数を選ぶ。保存量が減り誤差上限を保つときだけ分割を受け入れる貪欲法を用いる（抄録）。", "p5": "合成データと2・3次元の圧縮性流れのスナップショットで、空間適応の階数と分割が大域PODより圧縮を改善しうることを示した（抄録）。", "fun": "写真を圧縮するとき、空のような単調な部分は粗く、細かい模様の部分は丁寧に保存すると効率がよくなります。この研究はシミュレーション結果でも同じ考えを使い、場所ごとに必要な情報量を変えながら、誤差が決めた範囲を超えないことを数学的に保証しています。", "unverified": "圧縮率の具体的な数値は抄録に記載がなく未確認。"}}, {"id": "pr22", "rank": 22, "headline": "トレスカ摩擦の接触問題の高次離散化", "title": "An Arbitrary-Order Augmented Lagrangian Discrete De Rham Scheme for Contact Mechanics with Tresca Friction", "url": "https://doi.org/10.2139/ssrn.7661505", "authors": "JÉRÔME DRONIOU ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "DRONIOU, J., Kumar, R., & Masson, R. (2026). An Arbitrary-Order Augmented Lagrangian Discrete De Rham Scheme for Contact Mechanics with Tresca Friction. https://doi.org/10.2139/ssrn.7661505", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "割れ目のある弾性体の接触とトレスカ摩擦を、任意次数の離散de Rham（DDR）多面体スキームと拡張ラグランジュ法で解く（抄録）。", "p3": "割れ目を余次元1の物体として表し、法線方向のSignorini型拘束とトレスカ摩擦則を射影の恒等式に書き直して、1つの拡張ラグランジュ双線形形式にまとめる。割れ目面にバブル自由度を加えて安定性を確保する（抄録）。", "p5": "変位とラグランジュ乗数の最適次数の収束を示す誤差評価を導き、数値実験で理論と精度・頑健性を確認した（抄録）。", "fun": "岩盤の割れ目が押し合ったりこすれ合ったりする様子は、「触れているか、離れているか」が場所ごとに切り替わるため計算がとても難しい問題です。この研究はその切り替えを一つの数式の枠組みにまとめ、精度を好きなだけ上げられる解法にしました。", "unverified": "数値実験の具体的な問題設定と誤差の数値は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "C1エルミート要素の行列不要マルチグリッド", "title": "Matrix-Free Local Multigrid for $C^1$ Hermite Discretizations on GPUs", "url": "https://arxiv.org/abs/2610.30308", "authors": "Micha{\\l} Wichrowski", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Wichrowski, M. (2026). Matrix-Free Local Multigrid for $C^1$ Hermite Discretizations on GPUs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30308", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "適応細分化した直交格子上のC1級エルミート要素に対し、行列を作らない局所マルチグリッド法をGPUで実装した（抄録）。", "p3": "固定端の重調和問題を例に、セル単位の主双対定式化をエルミート要素へ拡張し、連続性を作らない拘束演算子で課す。細分化の境では幾何的な延長で跡と法線微分を与え、ぶら下がり節点の処理を不要にする（抄録）。", "p5": "3次要素では対称性による分解で要素行列を4つの16×16ブロックに分け、メモリ帯域の85%に達した。A100の倍精度で、一様格子ではCGが5〜6反復、毎秒最大423万セルを解き、局所細分化でも最大16反復だった（抄録）。", "fun": "板の曲がりのように「傾きまで滑らかにつながる」必要がある計算は、普通の方法より格段に重くなります。この研究は巨大な行列を作らずにGPUの性能を引き出し、細かくした場所と粗い場所が混ざっても少ない反復で解けるようにしました。", "unverified": "他手法との速度比較は抄録に記載がなく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "道徳判断では熟慮型AIが嫌われる", "title": "Should AI Trust Its Gut? The Cost of Deliberative Moral Reasoning in Humans and AI", "url": "https://doi.org/10.31234/osf.io/2fv9t_v1", "authors": "Simon Myers ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Myers, S., & Chater, N. (2026). Should AI Trust Its Gut? The Cost of Deliberative Moral Reasoning in Humans and AI. https://doi.org/10.31234/osf.io/2fv9t_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "道徳的な判断では、人間でもAIでも直観的に答えるほうが熟慮するより好まれ、その理由は感情より規範への忠実さにあることを示した（抄録）。", "p3": "事前登録した3つの研究（計N = 2,173）。研究1は道徳・非道徳の判断で直観と熟慮の好みを比べ、研究2はAIに感情がないと説明し、研究3は決定を固定して規範への固執の強さを変えた（抄録）。", "p5": "道徳判断では人もAIも直観的推論が好まれ、良い人格の信号とみなされた。AIに感情がないと説明しても好みは残り、規範を決して見直さない主体が高く評価された（抄録）。", "fun": "難しい計算問題ではよく考える人が好かれるのに、道徳の場面では「迷わず正しいことをする人」のほうが信頼されます。感情がないはずのAIにも同じ好みが向けられ、その理由が感情ではなく「ルールを曲げない姿勢」だったという点が意外です。", "unverified": "各研究の効果量は抄録に記載がなく未確認。"}}, {"id": "pr25", "rank": 25, "headline": "多エージェントLLMの合意で誰が影響力を持つか", "title": "Who Is the Influencer? Consensus Dynamics in Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.31105", "authors": "Gouki Minegishi ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Minegishi, G., Feng, J., Furuta, H., Kojima, T., Iwasawa, Y., & Matsuo, Y. (2026). Who Is the Influencer? Consensus Dynamics in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31105", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のLLMを混ぜた多エージェント系では、パラメータ数の大きいモデルが最終的な合意を支配することを示した（抄録）。", "p3": "事前知識も正解もない単純な課題を設計し、7つのモデル系列を混ぜて合意形成を観察。エージェントを単体上を動く重みつき粒子とみなし、エネルギー地形で解釈する（抄録）。", "p5": "他モデルの意見は大きいモデルの意見に吸収された。大きいモデルほど文脈内学習が強く、文脈の多数派を増幅するため影響者になると説明する（抄録）。", "fun": "会議で一番声の大きい人の意見に落ち着いてしまう現象が、AI同士の話し合いでも起きます。しかも正解のない課題でも、大きいモデルが勝つ理由を「深い谷に転がり込む粒子」という物理のたとえで説明している点が面白いところです。", "unverified": "影響力の大きさの定量値とモデル名は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "マネロン制裁と監査報酬の関係（ブラジル）", "title": "Anti-Money Laundering Enforcement and Audit Fees: Spillovers and Regulatory Fee Compression in Brazilian Financial Institutions", "url": "https://doi.org/10.2139/ssrn.7651219", "authors": "Andréa Alves Corrêa ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Corrêa, A. A., Vila Verde Belém, I., & de Melo Mendes, P. C. (2026). Anti-Money Laundering Enforcement and Audit Fees: Spillovers and Regulatory Fee Compression in Brazilian Financial Institutions. https://doi.org/10.2139/ssrn.7651219", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ブラジルの金融機関で、マネーロンダリング対策の制裁と監査報酬の関係を調べ、正の関連は見られなかった（抄録）。", "p3": "上場49機関・321企業年（2018〜2025年）のパネルで、監査報酬と中央銀行の最終的な執行決定を結合し、機関固定効果と頑健標準誤差で回帰（抄録）。", "p5": "直接の制裁も監査人の顧客構成を通じた曝露も、報酬と有意な正の関連はなかった。年間の制裁金総額は主モデルで負の係数（−0.0071、p = 0.0447）だが、監査努力の低下を示すものではないと著者は述べる（抄録）。", "fun": "不祥事で制裁を受けた銀行は、監査法人により念入りに調べられて監査料が上がりそうに思えます。ところがデータでは上がっておらず、むしろわずかに下がる関連が出ました。直観に反する結果を「まだ証明ではない」と慎重に扱っている点も誠実です。", "unverified": "なし"}}, {"id": "pr27", "rank": 27, "headline": "繰延税金は将来の税負担を予測するか", "title": "Do Deferred Taxes Help Explain and Predict Future Tax Outcomes? Iberian Evidence", "url": "https://doi.org/10.2139/ssrn.7656760", "authors": "Ângela Cristina Oliveira Pereira ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Pereira, Â. C. O., Azevedo, G. M. d. C., & Pereira, C. (2026). Do Deferred Taxes Help Explain and Predict Future Tax Outcomes? Iberian Evidence. https://doi.org/10.2139/ssrn.7656760", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "繰延税金の情報は将来の納税額と税費用を説明はするが、予測の改善にはつながらないことをイベリア半島の企業で示した（抄録）。", "p3": "スペイン・ポルトガルの上場62社（2015〜2024年）で、繰延税金費用・繰延税金資産負債の追加説明力を年次クロスセクション回帰、順位回帰、1期先の標本外予測で調べた（抄録）。", "p5": "繰延税金の変数は納税額と税費用の両方に追加の説明力をもつが、標本外予測の精度はどの変数でも有意に改善しなかった（抄録）。", "fun": "「説明できる」と「予測できる」は別物だということがよく分かる研究です。過去のデータに当てはめると効いているように見える情報でも、未来を当てる道具として使うと役に立たないことがあり、会計情報の使い道を考えるうえで大事な区別です。", "unverified": "回帰係数と予測誤差の数値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "任意開示テキストでは測れない企業ガバナンス", "title": "What Public Disclosure Cannot Measure: Enterprise-Architecture Governance, the Failure of a Voluntary-Text Instrument, and a Mandatory-Disclosure Alternative", "url": "https://doi.org/10.2139/ssrn.7654858", "authors": "Felix D. Langer", "venue": "SSRN", "date": "2026-10-22", "apa": "Langer, F. D. (2026). What Public Disclosure Cannot Measure: Enterprise-Architecture Governance, the Failure of a Voluntary-Text Instrument, and a Mandatory-Disclosure Alternative. https://doi.org/10.2139/ssrn.7654858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業アーキテクチャのガバナンスは10-Kの任意開示のテキストからは測れないことを、信頼性検査の失敗と陽性対照で示した（抄録）。", "p3": "米大企業167社（2019〜2025年）の10-Kから20語の辞書で指数EAGIを作り、仮説検定の前に事前指定の信頼性検査を行う。同じ手順をAI関連の辞書に適用した陽性対照と比べた（抄録）。", "p5": "指数のCronbachのαは−0.062で、20語中15語は7年間で1社以下しか使わなかった。陽性対照ではα = 0.511に達し、失敗の原因は方法ではなく構成概念にあると位置づけた（抄録）。", "fun": "「うまく測れなかった」という結果を正面から報告する珍しい論文です。同じ方法でAIの話題なら測れたことを示し、失敗の原因が道具ではなく測ろうとした対象にあると突き止めた点が、科学的に誠実で面白いところです。", "unverified": "代替の開示源ごとの検査結果は未確認（抄録が途中まで）。"}}, {"id": "pr29", "rank": 29, "headline": "マルチモーダル分類器の事後反実仮想検索", "title": "CRANE: Post-Hoc Counterfactual Retrieval for Multimodal Classifiers", "url": "https://arxiv.org/abs/2610.31594", "authors": "Franco Rugolon ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Rugolon, F., Miliou, I., & Papapetrou, P. (2026). CRANE: Post-Hoc Counterfactual Retrieval for Multimodal Classifiers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31594", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の種類の入力を使う分類器に対し、訓練データの実例を反実仮想として取り出す、モデルに依存しない事後説明法CRANEを提案（抄録）。", "p3": "目標クラスの訓練例から最近傍を検索して説明の候補にするため、説明のもっともらしさが構成上保証される。モダリティごとの近傍集合の共通部分をとるMC-Rなどを比べた（抄録）。", "p5": "4つのデータセットと3つの融合方式で、MC-Rが4つ中3つのデータセットで最良または同率最良だった。単一のモダリティが判断を支配する場合は単一モダリティの戦略も競争的だった（抄録）。", "fun": "「もしこうだったら判定が変わった」という説明は、ありえない架空の例を作ってしまいがちです。この方法は実際に存在する例の中から近いものを探してくるので、説明がいつも現実的になるという発想が分かりやすくて実用的です。", "unverified": "データセットの具体名と評価指標の値は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "一般化モーメント一致による差分プライバシー合成データ", "title": "Differentially Private Synthetic Data via Generalized Moment Matching", "url": "https://arxiv.org/abs/2610.30196", "authors": "Rundong Ding ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Ding, R., He, Y., & Zhu, Y. (2026). Differentially Private Synthetic Data via Generalized Moment Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30196", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "モーメントを差分プライバシーの下で推定し、それに合う分布から合成データを作る一般化モーメント一致法と、その誤差保証を示した（抄録）。", "p3": "[-1,1]^dのn件の記録について、モーメントの誤差が目標の積分確率距離（IPM）を抑えるときに使える一般誤差定理を立て、MMD（MaternやLaplace核、ReLUのNTK）やスライス・ワッサースタイン距離に適用する（抄録）。", "p5": "合成記録が十分多いとき、得られる誤差率は固定次元で対数因子を除きミニマックス最適である（抄録）。", "fun": "個人の情報を守りながら、元のデータとそっくりな偽物のデータを作る方法の理論です。平均やばらつきのような「要約の数字」だけに雑音を加えて守り、その数字に合うデータを作り直すことで、安全性と使いやすさの両方を数学的に保証しています。", "unverified": "実データでの数値実験の有無は抄録からは未確認。"}}, {"id": "pr31", "rank": 31, "headline": "近隣の荒廃と高齢者のパートナー暴力", "title": "Perceived Neighborhood Disorder, Social Vulnerability, and Intimate Partner Violence Among Adults over 60", "url": "https://doi.org/10.31234/osf.io/9nsc5_v1", "authors": "Judith Biesen ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Biesen, J., & Orth, J. (2026). Perceived Neighborhood Disorder, Social Vulnerability, and Intimate Partner Violence Among Adults over 60. https://doi.org/10.31234/osf.io/9nsc5_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "60歳以上の人の親密なパートナー間暴力（IPV）は、主観的な近隣の荒廃と郵便番号単位の社会的脆弱性の両方と関連することを示した（抄録）。", "p3": "交際中の380人のオンライン調査で、過去1年の攻撃行動、知覚された近隣の荒廃（PND）、孤独感を測り、郵便番号をCDCの社会的脆弱性指数（SVI）と結合して階層ロジスティック回帰を行った（抄録）。", "p5": "PNDが高いほど身体的IPVの加害・被害のオッズが高く、SVIが高いほど心理的攻撃の加害・被害と身体的攻撃の被害のオッズが高かった。偽発見率補正後も有意だった（抄録）。", "fun": "家庭内の暴力は家の中だけの問題と思われがちですが、住んでいる地域の荒れ具合や社会的な弱さとも結びついていることを、高齢者で示した研究です。本人の感じ方と統計の指標という2つの見方で同じ傾向が出た点が説得力を高めています。", "unverified": "オッズ比の数値は抄録に記載がなく未確認。"}}, {"id": "pr32", "rank": 32, "headline": "近隣剥奪と若年女性の未充足ケア（カラチ）", "title": "Neighbourhood Deprivation, Unmet Care and Well-Being Among Adolescent Girls and Young Women in Karachi", "url": "https://doi.org/10.2139/ssrn.7654519", "authors": "Aisha Ijlal ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Ijlal, A., & Kanwal, H. (2026). Neighbourhood Deprivation, Unmet Care and Well-Being Among Adolescent Girls and Young Women in Karachi. https://doi.org/10.2139/ssrn.7654519", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "カラチの低所得地区で、近隣の剥奪が若い女性の未充足の医療ニーズと低い幸福度に関連することを示した（抄録）。", "p3": "6地区30クラスタの15〜24歳の959人の横断分析。25指標の近隣監査指数を、自己報告の未充足ニーズとWHO-5幸福度に結合し、一般化推定方程式と地区固定効果・世帯の豊かさのモデルで分析した（抄録）。", "p5": "未充足ニーズは15.0%、幸福度の平均は41.2/100。剥奪が1標準偏差高いと未充足のオッズは1.74倍、幸福度は6.67点低い。ただし指数は世帯の豊かさと強く相関し（r = −0.91）、場所と世帯の不利は分離できなかった（抄録）。", "fun": "「貧しい地域に住むこと」と「貧しい家に住むこと」は、ほとんど同じ地図を描くため、どちらが健康に効いているのかを見分けるのはとても難しい問題です。この研究はその限界を自分ではっきり認め、結果を仮説として示しています。", "unverified": "なし"}}, {"id": "pr33", "rank": 33, "headline": "社内コミュニケーションの条件と従業員成果", "title": "Toward Adaptive Internal Communication: Linking Communication Conditions, Internal Communication Satisfaction, and Employee Outcomes", "url": "https://doi.org/10.2139/ssrn.7657203", "authors": "Ana Tkalac Verčič ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Tkalac Verčič, A., Pološki Vokić, N., & Aleksić, A. (2026). Toward Adaptive Internal Communication: Linking Communication Conditions, Internal Communication Satisfaction, and Employee Outcomes. https://doi.org/10.2139/ssrn.7657203", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "職場のコミュニケーション条件が社内コミュニケーション満足（ICS）を通じて、生活満足や組織への信頼と結びつくことを示した（抄録）。", "p3": "従業員136人の3時点調査で、観測された合成得点の経路分析を行い、コミュニケーション条件、ICS、個人と組織の評価の関係を調べた（抄録）。", "p5": "リーダーのコミュニケーションとデジタル手段の受容がICSと正に関連し、ICSは仕事と生活の調和への満足を通じて生活満足と、組織への信頼を通じて知覚されたコミュニケーションの有効性と間接的に関連した（抄録）。", "fun": "上司との話しやすさのような職場の会話の質が、仕事の外の生活の満足にまでつながっているかもしれない、という研究です。会社の連絡の仕方を社員の声で調整していくという理論の出発点を、小規模ながらデータで確かめています。", "unverified": "経路係数の数値は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "人とAIの協働が科学アイデアの評価を変える", "title": "Beyond Better Ideas: How Human-AI Collaboration Shapes Scientific Ideas and Human Perceptions", "url": "https://arxiv.org/abs/2610.30568", "authors": "Qian Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, Q., Pradhan, S., Ahn, J., Atil, B., Li, A., Lu, S., Sarwar, N., Ulis, M., Wan, R., & Yin, W. (2026). Beyond Better Ideas: How Human-AI Collaboration Shapes Scientific Ideas and Human Perceptions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30568", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人とAIの共同で研究アイデアを作っても人による質の評価は上がらず、AIの審査員はAIと組んだ提案をひいきすることを示した（抄録）。", "p3": "人とAI、人と人の研究チームを同じ設定で比べ、人とLLMの評価者、共同の由来の分析、参加者調査を組み合わせた（抄録）。", "p5": "AIとの共同は人の評価で有意な優位がなく、反復的な改訂は一貫して質を上げた。AI審査員は人の点数に近いが順位では食い違い、AI支援の提案を好んだ。共同の由来は部分的にしか見分けられなかった（抄録）。", "fun": "AIと一緒に考えるとアイデアが良くなると思いがちですが、人の目で見ると差はなく、効いたのは何度も書き直すことでした。さらにAIの審査員がAIの関わった案に甘いという結果は、AIに採点を任せる危うさを示しています。", "unverified": "チーム数と評価点の数値は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "PODと機械学習で河川タービン後流を予測", "title": "A novel machine learning framework based on proper orthogonal decomposition for turbine wake flow predictions in natural waterways", "url": "https://arxiv.org/abs/2610.31547", "authors": "Mustafa Meri\\c{c} Aksen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Aksen, M. M., Seyedzadeh, H., Anjiraki, M. G., & Khosronejad, A. (2026). A novel machine learning framework based on proper orthogonal decomposition for turbine wake flow predictions in natural waterways (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31547", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LESの瞬間場をPODで選別したデータで学習し、自然河川の潮流タービン群の下流の平均流れ場を安価に予測する機械学習代理モデル（抄録）。", "p3": "潮汐河川の実地点でLESを行い、瞬間場をPODで空間モードに分解し、選んだモードで3次元の畳み込みエンコーダ・デコーダを学習して時間平均速度場を予測する。背景の大きな変動の影響を減らし後流の情報を残す（抄録）。", "p5": "同じネットワーク規模と学習費用で、POD選別したデータでの学習が有利であることを示した（具体的数値は抄録の取得範囲外）（抄録）。", "fun": "川底の凸凹が作る乱れに、タービンの後ろにできる流れの影が埋もれてしまう問題を、流れを「模様の重ね合わせ」に分けて必要な模様だけをAIに学ばせることで解いています。データを減らすことで逆に学びやすくなる点が面白いところです。", "unverified": "PODなしの学習との誤差比較の数値は未確認（抄録が途中まで）。"}}, {"id": "pr36", "rank": 36, "headline": "乱流の非線形圧縮可能性を事前推定", "title": "A Priori Estimation of the Non-Linear Compression Potential and Quantification of Autoencoder Non-Linearity in Turbulent Flows", "url": "https://arxiv.org/abs/2610.31605", "authors": "Niklas Alexander Pissarski ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Pissarski, N. A., Leon, J. P. M., & Andersen, S. J. (2026). A Priori Estimation of the Non-Linear Compression Potential and Quantification of Autoencoder Non-Linearity in Turbulent Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31605", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "乱流データで非線形の次元縮約（オートエンコーダ）がPODよりどれだけ得かを、学習前に見積もる指標LTRを提案した（抄録）。", "p3": "データ点の局所的な幾何に基づく局所接線残差（LTR）を、モデルの学習も閾値も不要な事前推定量として定義する。学習済みデコーダを線形化した代理と比べるデコーダ線形化誤差（DLE）で非線形性を定量化する（抄録）。", "p5": "2つの渦列と風車後流の乱流で、オートエンコーダの圧縮性能の主な傾向をLTRが再現し、LTRの大きいデータではDLEも大きかった（抄録）。", "fun": "複雑なAIを何日もかけて学習させてから「普通の方法と大差なかった」と分かるのはもったいない話です。この研究はデータの形を先に調べるだけで、凝った方法を使う価値があるかを見積もれるようにしました。", "unverified": "LTRとDLEの数値は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "中南米の地すべり早期警報の全体像", "title": "From Local Initiatives to National Systems: Mapping the Landscape of Landslide Early Warning in Latin America", "url": "https://doi.org/10.21203/rs.3.rs-11207325/v1", "authors": "Johnny Vega ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Vega, J., Horta, I. T. L. G., Gómez, D., Reyes, M. E., García-Urquía, E., Quesada-Román, A., Alcántara-Ayala, I., Fustos-Toribio, I., Millán-Arancibia, C., Gutiérrez, C., Camarinha, P. I., Hader, P., Pacheco-Quevedo, R., & Moreiras, S. (2026). From Local Initiatives to National Systems: Mapping the Landscape of Landslide Early Warning in Latin America. https://doi.org/10.21203/rs.3.rs-11207325/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用", "preprint": true, "short": true, "p1": "中南米10か国25の地すべり早期警報システムの運用・財源・持続の実態を、関係者の共通様式の記録で比べた（抄録）。", "p3": "各システムに直接関わる研究者と実務者が共通の様式で記録し、地理的警報の9つの前提と、監視・予測・伝達・統治・住民参加の5つの運用面で専門家判断により評価した（抄録）。", "p5": "過去記録と降雨閾値がほぼ全ての基盤である一方、土壌水分・間隙水圧・変位・機械学習を取り入れる国もある。複雑な地形での監視密度の不足が地域全体の主要な技術的制約だった（抄録）。", "fun": "地すべりの研究は「どこが危ないか」を予測するものが多い一方、実際の警報がどう運用されお金がどこから来ているかは、あまり記録されてきませんでした。現場の担当者自身が同じ書式で記録を持ち寄った点がこの研究の強みです。", "unverified": "3つ目の傾向は抄録が途中で切れており未確認。"}}, {"id": "pr38", "rank": 38, "headline": "衛星画像で遅い地すべりの過渡変動を監視", "title": "PlanetScope Imagery for Slow-Moving Landslide Monitoring: Processing Strategies, Validation and Insight on Transient Processes", "url": "https://doi.org/10.5194/egusphere-2026-6105", "authors": "Laureen Maury ほか", "venue": "EGUsphere", "date": "2026-10-23", "apa": "Maury, L., Huanca, J., Dhenin, K., Zerathe, S., Thollard, F., Albinez, L., Gomez, D., & Lacroix, P. (2026). PlanetScope Imagery for Slow-Moving Landslide Monitoring: Processing Strategies, Validation and Insight on Transient Processes. https://doi.org/10.5194/egusphere-2026-6105", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録を使用", "preprint": true, "short": true, "p1": "毎日撮影の衛星群PlanetScopeの画像相関で、遅い地すべりの変位場を求める一貫した処理を作り、GNSSで検証した（抄録）。", "p3": "取得の幾何・時刻、画像の組合せ方、照合アルゴリズム（ブロック照合BMと大域的照合MGM）の選び方を、ペルーの2つの地すべりの数年分のGNSSデータで評価する。処理はオープンソースのコンテナで提供（抄録）。", "p5": "安定域で見積もる通常の誤差は、動いている領域の誤差を大きく過小評価することを示した（抄録）。", "fun": "人工衛星の写真を毎日見比べれば、山がゆっくり動く様子が分かりそうです。ところが、動かない場所で誤差を測る普通のやり方では、動いている場所の誤差がずっと小さく見積もられてしまうことを、地上のGNSSと比べて明らかにしました。", "unverified": "BMとMGMの比較結果の詳細は未確認（抄録が途中まで）。"}}, {"id": "pr39", "rank": 39, "headline": "ネパールの岩氷なだれ連鎖と事前評価の検証", "title": "Evaluating pre-event hazard screenings against the 2026 Budhi Gandaki and Bhotekoshi-Trishuli rock-ice avalanche cascades, central Nepal", "url": "https://doi.org/10.22541/essoar.15010904/v1", "authors": "Ajay Kumar Sah", "venue": "ESS Open Archive", "date": "2026-10-22", "apa": "Sah, A. K. (2026). Evaluating pre-event hazard screenings against the 2026 Budhi Gandaki and Bhotekoshi-Trishuli rock-ice avalanche cascades, central Nepal. https://doi.org/10.22541/essoar.15010904/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録を使用", "preprint": true, "short": true, "p1": "2026年のネパール中部の2つの岩氷なだれの連鎖災害で、公開済みの3つの事前ハザード評価が被害地点を捉えていたかを検証した（抄録）。", "p3": "被害が報告された16地点を、なだれの到達角14°の評価、1,499の氷河湖の決壊洪水（GLOF）の浸水モデル、氷河湖流域の排水路からの高さ（HAND）0〜50mの3つと照合した（抄録）。", "p5": "16地点すべてが14°の到達範囲の外（到達角3.8〜12.0°）にあり、どのGLOFの浸水範囲にも入らなかった。Budhi Gandakiでは経路の5%だけが浸水範囲から150m以内だった（抄録）。", "fun": "なだれが土石流や洪水に姿を変えて何十kmも先を襲う「連鎖」は、一つの災害ごとに作られた危険地図の隙間に落ちてしまいます。実際の被害で地図を検証し、その隙間を「連鎖帯」として示した点が重要です。", "unverified": "HAND評価の照合結果は抄録が途中で未確認。"}}, {"id": "pr40", "rank": 40, "headline": "検証可能な証拠つき多エージェント再現性監査", "title": "Multi-agent Reproducibility Auditing with Verifiable Evidence", "url": "https://doi.org/10.2139/ssrn.7651342", "authors": "Bruno Barbarioli ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Barbarioli, B., Aparicio, J. P., Brodeur, A., Abdul Baki, G., Fazio, L., & Valenta, D. (2026). Multi-agent Reproducibility Auditing with Verifiable Evidence. https://doi.org/10.2139/ssrn.7651342", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "論文の再現性監査を、5つの領域の監査役・調整役・別系統のモデルの批評役からなる多エージェントで行い、全ての所見を証拠に結びつける手順を示した（抄録）。", "p3": "監査役が論文と公開資料を調べ、調整役が所見を裁定し、別のモデル系統の批評役が反論してから検証と公開に進む。確認済みの所見、否定された検証、除外も残す。同じ証拠基準の単一エージェントを比較対象にする（抄録）。", "p5": "所見の妥当性、自己修正、遵守、再現性、資源使用を18の評価量で評価する枠組みを示した（結果の数値は抄録に記載なし）（抄録）。", "fun": "論文が本当にデータから導けるかを確かめる作業を、役割の違うAIたちの合議で行う試みです。AIの結論を鵜呑みにせず、全ての指摘を人が確かめられる証拠にひもづける設計が、AIを検査に使うときの要点になっています。", "unverified": "評価の結果（単一エージェントとの比較）は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "表明した好みと実際に評価する応答のずれ", "title": "Abstract Priorities, Concrete Rewards: How Stated Preferences Relate to What People Reward in AI Responses", "url": "https://arxiv.org/abs/2610.30763", "authors": "Zihan Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, Z., Zheng, L. N., & Zhu, D. (2026). Abstract Priorities, Concrete Rewards: How Stated Preferences Relate to What People Reward in AI Responses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30763", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人がLLMの応答に求めると言う好みと、実際に高く評価する応答の特徴はずれていることを、PRISMデータで示した（抄録）。", "p3": "1,396人が7つの応答属性の重要度を答えたうえで、21のLLMの29,347の応答を評価した公開データPRISMで、表明選好と顕示選好を比べた（抄録）。", "p5": "調査で聞かなかった長さ・書式・拒否の言い回しが、聞いた属性のテキスト指標と同等以上に評価と関連した。短い回答を求めた人は長さの重みが小さいなど、書いたフィードバックのほうが評価をよく表した（抄録）。", "fun": "アンケートで「正確さが一番大事」と答えた人も、実際には見た目や長さで点を付けていることがある、という研究です。人の好みに合わせてAIを育てるとき、口で言う好みと行動に表れる好みのどちらを信じるかという古くて新しい問題を示しています。", "unverified": "属性ごとの関連の強さの数値は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "複数の文化的属性下でのLLMの価値選択の偏り", "title": "Investigating Multi-Cultural Value Selection Biases in LLMs", "url": "https://arxiv.org/abs/2610.31199", "authors": "Siddhesh Pawar ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Pawar, S., Arora, A., Wright, D., Hovy, D., & Augenstein, I. (2026). Investigating Multi-Cultural Value Selection Biases in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31199", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "国のペルソナと、利用者側の別の国・言語の手がかりを同時に与えたとき、LLMの価値観の回答がどう動くかを調べた（抄録）。", "p3": "システムプロンプトで国のペルソナを与え、利用者の発話で別の国を名指しする明示的手がかりか、質問言語による暗黙の手がかりを加える。世界価値観調査（WVS）の選択式と、社会政治的な自由記述の生成で評価した（抄録）。", "p5": "選択式では言語の手がかりが明示的手がかりの約3倍回答を動かしたが、その国の分布からは遠ざかった。160万の自由記述では国を名指しすると、その国についてのモデル自身の応答との差の30〜44%が縮まった（抄録）。", "fun": "「日本人として答えて」と言うのと、日本語で質問するのとでは、AIの価値観の答えがまったく違う方向に動きます。人の文化的な属性は一つのラベルでは表せないことを、AIの振る舞いから逆に照らし出している点が面白い研究です。", "unverified": "対象モデルと国の一覧は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "LLMの心の理論：明示と応用のギャップ", "title": "Diagnosing the Explicit-to-Applied Theory of Mind Gap in LLMs", "url": "https://arxiv.org/abs/2610.31060", "authors": "Prajvi Saxena ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Saxena, P., Janzen, S., & Maass, W. (2026). Diagnosing the Explicit-to-Applied Theory of Mind Gap in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31060", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの心の理論（ToM）を、信念を認識する能力と、それを使って行動を予測する能力に分けると、大きな差があることを示した（抄録）。", "p3": "4つのベンチマークで明示的ToMと応用的ToMを分けて測り、構造化プロンプト、文脈内学習、提案する信念状態のテスト時学習（BSTTT）による回復を比べた（Qwen2.5-7B、Llama-3.1-8B、GPT-oss-20B）（抄録）。", "p5": "SimpleToMでLlama-3.1-8Bは全体51.5%だが、心的状態の認識は99.4%、行動予測は28.9%だった。注意喚起とBSTTTの併用で行動予測が40.8ポイント改善し、その大半は注意喚起による（抄録）。", "fun": "「相手がどう思っているか」は分かるのに、「だから相手が次にどう動くか」は当てられない、というAIのちぐはぐさを示した研究です。平均点だけを見ていると、この大きな凸凹が隠れてしまうという教訓があります。", "unverified": "他の3つのベンチマークの結果は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "マッチング推定量を効率化する再マッチング", "title": "Rematching Estimators for Average Treatment Effects", "url": "https://arxiv.org/abs/2610.30560", "authors": "Lam Lam Hui ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Hui, L. L., & Chan, K. W. (2026). Rematching Estimators for Average Treatment Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30560", "why": "固定数のマッチングは非効率という問題に対し、再マッチングで平均処置効果の推定を効率化する方法を提案。実務で広く使われる手法の改良。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§3、分散の改善§4.2、シミュレーション§5、実証§6、結論§7、図2〜4・表1）を読んだ", "preprint": true, "p1": "最近傍マッチング推定量で、使われずに捨てられた対照群の個体を「逆向きに」処置群へ再マッチングすることで、偏りをほとんど増やさずに分散を一様に下げる再マッチング推定量を提案した（未査読プレプリント）。", "p2": "マッチング推定量は直観的で広く使われるが、マッチ数M0を固定した単純なマッチングは非効率である。精度を上げようとM0を増やすと偏りが増える。対照群の候補が大量にあると、多くの対照が一度も使われずに捨てられる（§1、§3.1）。", "p3": "まず通常通り各処置個体にM0個の最近傍の対照を割り当て、次に使われなかった各対照について最も近い処置個体を1つだけ探して割り当てる（アルゴリズム1、図2）。例えば図2では、未使用の9番と10番の対照が最も近い3番の処置個体に再マッチされる。質の低い一致を使いすぎないよう、逆向きは最近傍1つに限る。結果として処置個体ごとのマッチ数が可変になる。平均処置効果（ATE）と処置群の平均処置効果（ATT）の両方に使える（§3）。", "p4": "理論では偏りの分解、分散の改善、一致性と漸近正規性、分散推定を示す（§4）。シミュレーションは1変量と6変量の共変量の10通りの設計で単純マッチングとその偏り補正版と比べ、実証ではNational Supported Work（NSW）データで実験の差の推定値を基準にした（§5〜6）。", "p5": "同じM0の単純マッチングより漸近的に一様に効率的であることを証明した（抄録、§4）。図3ではM0 = 1、処置割合p = 0.05のとき分散が約50%減った（§4.2）。NSWでは実験の基準値1.79（標準誤差0.67）に対し、非実験標本の偏り補正推定はどちらも実験の95%区間内にあり、M0 = 1での片側検定のp値は単純マッチング7.43%、提案法4.88%で、提案法だけが5%水準で効果を検出した（§6、表1）。", "p6": "著者自身、M0 > 1では標準誤差の改善は目立たないと述べる（§6）。残る疑問：処置群が対照群より大きい場合や、共変量が高次元で最近傍の質が落ちる場合の振る舞い（解釈）。", "fun": "薬を飲んだ人と飲まなかった人を「似た者同士」で比べるとき、比べる相手が見つからずに使われないままのデータがたくさん出ます。この研究は、余った人の側から「一番似ている相手」を探し直すという逆向きの一手を加えるだけで、推定のぶれを半分近くに減らせることを示しました。", "unverified": "多変量のシミュレーションでの分散減少の具体値（補足S3）は読んでいない。"}}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "段階的導入パネルの比較群は介入次第", "title": "Causal inference in staggered adoption panels: The correct comparison set depends on your intervention", "url": "https://arxiv.org/abs/2610.31537", "authors": "Ian Lundberg ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Lundberg, I., & Xu, Y. (2026). Causal inference in staggered adoption panels: The correct comparison set depends on your intervention (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31537", "why": "段階的導入のパネルで、正しい比較群は想定する介入によって変わることを示し、差の差分析の設計に指針を与える。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（推定対象§2、識別§3〜4、実証§5、考察§6、図2・4・11）を読んだ", "preprint": true, "p1": "段階的導入のパネルで「処置しなかったらどうなったか」という問いが、実は「導入時点だけ止める」と「結果の測定まで一貫して禁止する」という2つの異なる因果の問いに分かれ、それぞれ正しい比較群と重みが違うことを示した（未査読プレプリント）。", "p2": "差の差、固定効果、マッチング、合成統制などの一般的な手法は、導入した個体と未導入の個体の将来の結果を比べるが、どちらの反実仮想を推定しているのかを区別しておらず、将来の処置の値で比較群を絞ると偏りが生じうる（§1、§3.3）。", "p3": "推定対象1（瞬間的介入）は、時点c_iで導入した個体について「c_iで導入しなかった」場合の結果との差で、比較群は時点c_iで未処置の個体（後で導入してもよい）で、地平hによらず一定である（式1、§2.1）。推定対象2（長期的禁止）は「結果を測る時点c_i+hまで一貫して導入しない」場合で、比較群は地平hごとに変わり、時間変化する重みが必要になる（§2.2、図2）。それぞれを条件付き無視可能性または平行トレンドの下で識別する（§3〜4）。", "p4": "1,000個体×1,000回のシミュレーションで、瞬間型と長期型の逆確率重み付け推定量が各自の推定対象を正しく推定し、比較群を誤ると偏ることを示した（図4〜5）。実証ではNLSY97の女性（母親になった1,251人など）で、初産が出産後0〜5年の就業に与える効果を推定した（§5）。", "p5": "図11では、母親の就業は出産月に大きく下がり1年後に一部戻る。長期的禁止を比較とすると母親になることの就業への負の効果は瞬間的介入より大きく、「一度も子をもたない女性」を比較群にする誤った方法は、どちらの正しい推定値より大きな効果を示した（§5.4）。", "p6": "著者は、一般的な手法は長期的禁止の問いに答えられないこと、過去の結果が処置を左右し結果が持続する構造では平行トレンドが崩れることを強調する（§4.5、§6）。残る疑問：長期型の時間変化する重みは、地平が長いと極端な重みで分散が大きくなるのではないか（解釈）。", "fun": "「子どもを産まなかったら働き続けていたか」という問いは、「その年だけ産まなかったら」と「ずっと産まなかったら」で答えが違います。比べる相手を「一生子どもをもたない人」にすると、未来の情報で比較相手を選ぶことになり、効果を大きく見積もってしまう、という落とし穴をはっきり示した研究です。", "unverified": "図11の効果の具体的な数値（パーセンテージポイント）は本文のテキストからは読み取れず未確認。"}}, {"id": "pn03", "rank": 3, "field": "教育", "headline": "AIは学生の証明の推論を支えるか代わるか", "title": "Supporting or Replacing Students' Reasoning? Cognitive Offloading in AI-Assisted Proof Learning", "url": "https://arxiv.org/abs/2610.31481", "authors": "Eason Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, E., Judicke, S., Beigh, K., Tang, X., Wang, I., Yuan, N., Xiao, Z., Li, C., Li, S., Luttmer, R., Singh, S., Yampolsky, M., Parikh, N., Zhao, Y., Chen, M., Huang, S., Mohanty, A., Johnson, G., Mackey, J., … Koedinger, K. (2026). Supporting or Replacing Students' Reasoning? Cognitive Offloading in AI-Assisted Proof Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31481", "why": "証明を学ぶ153人の学生にAI支援を段階的に開放したランダム化研究で、認知的なオフローディングの実態を測った。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法§4、結果§5.1〜5.2、限界§6.5、図3〜4）を読んだ", "preprint": true, "p1": "大学の証明の授業で、AI支援（証明の添削とチャットボット）の利用開始時期を無作為に割り当てると、宿題の点は上がったがAIなしの試験の点は上がらず、チャットボットを多く使った学生ほど次の試験の点が低かったことを示した（未査読プレプリント）。", "p2": "生成AIは学習を助ける一方、学生が自分で考える作業をAIに肩代わりさせる「認知的オフローディング」が起き、独力の推論が育たない恐れがある。実際の授業で、無作為化した比較と利用記録の両方から検証した研究は少ない（§1〜2）。", "p3": "受講者308人のうち同意した153人を、第1回中間試験の後に早期利用群（75人）と後期利用群（78人）に個人単位で無作為に分け、早期群だけが宿題5〜6の期間に2つのAIインターフェースを使えるようにした（§4.1、図3）。第2回中間試験の後は全員が使え、その期間の利用回数と第3回中間試験の点の関係を、自己効力感と過去の成績を統制した回帰と媒介分析で調べた。試験中のAI使用は禁止（§4.1）。", "p4": "主な評価は、無作為化による宿題の点と、AIなしで受ける次の試験（第2回中間試験）の点の群間差。利用の分析では、チャットボットへの送信回数と添削の依頼回数が第3回中間試験の点とどう関連するかを見た（§4.3、§4.5）。", "p5": "早期群は過去の宿題の点を調整して宿題が2.56点高かった（95%CI [0.17, 4.94]、§5.1、図4）。第2回中間試験では差がなく（B = −2.47、95%CI [−5.60, 0.66]）、宿題の向上は試験に表れなかった。全員が使えた期間では、チャットボットへの送信が1回増えるごとに第3回中間試験が0.0302点低く、100回で約3点の差だった（§5.2）。自己効力感が1点高い学生は送信回数が39%少なかった。", "p6": "著者は、1つの授業・同意した学生に限られること、2つのインターフェースの効果を分けられないこと、利用回数の分析は自己選択で未測定の交絡がありうること、オフローディングは直接測っていない解釈であることを認める（§6.5）。", "fun": "AIに手伝ってもらった宿題は点が上がったのに、AIなしの試験ではその差が消え、AIとたくさんやり取りした学生ほど試験の点が低めでした。チャットの記録には「答えを教えて」と頼む様子も残っていて、AIが考える手助けではなく考える代わりになってしまう危うさが見えてきます。", "unverified": "媒介分析（§5.3）の間接効果の数値は読んでいない。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "ネットワーク未知のまま短期パネルで同僚効果を検定", "title": "Testing for peer effects in short panels without identifying the network structure", "url": "https://arxiv.org/abs/2610.31106", "authors": "Tom Boot ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Boot, T., & Juodis, A. (2026). Testing for peer effects in short panels without identifying the network structure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31106", "why": "ネットワーク構造を推定せずに同僚効果の有無を操作変数で検定する方法を提案した計量経済学の成果。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（モデルと検定統計量§2、理論§3、時間効果の拡張§4、モンテカルロ§5、実証§6、図3〜6）を読んだ", "preprint": true, "p1": "ネットワーク構造を推定せずに、短いパネル（T固定・N大）で「同僚効果が全くない」という帰無仮説を検定する、操作変数型の検定を提案した（未査読プレプリント）。", "p2": "同僚効果の推定は通常、誰が誰に影響するかというネットワークを知るか推定する必要があるが、ネットワークが未知で時点数が少ない場合、推定は難しく、まず効果の有無を確かめたい場面が多い（§1）。", "p3": "モデルは y_i = Σ_j α_ij y_j + X_i β_i + λ_i ι + u_i で、α_ijに疎性・対称性・正規化などの制約を置かず、帰無仮説は全てのα_ij = 0（式1〜2）。個体jの共変量はjの結果には効くがiの結果には直接効かないので操作変数になる。各個体の結果を自分の共変量に射影した成分と、他の個体の残差化した結果の対ごとの相関を集計し、無関係なら相関しないはずという直観で統計量を作る（§2.2）。個体固定効果、異なる傾き、不均一分散、個体内の系列相関を許す。", "p4": "射影成分のノルムが0から離れていれば極限分布は標準正規だが、0に近いと非標準になるため、条件付きガウス極限実験と条件付きモンテカルロで一様に妥当な臨界値を作る（§3）。共通の時間効果に対応する重み付き版も作る（§4）。シミュレーション（N = 250、T = 4・8、密・疎なネットワーク、トレンドの有無）でサイズと検出力を評価し、米国製造業313業種（1958〜2005年）の相対賃金に適用した（§5〜6）。", "p5": "図3〜4では、共通の時間成分がないとき両方の検定のサイズは名目水準に近く、重みなし版のほうが検出力が高い。共通の時間成分があると重みなし版は効果がなくてもほぼ確実に棄却するが、重み付き版は名目水準を保ち、検出力の曲線もトレンドなしの場合に近かった（§5.2）。実証では8年の移動窓の条件付きp値を示し、トレンドなしの定式化では複数の時期で棄却が見られた（図5、§6）。", "p6": "著者が示すトレードオフとして、時間効果がない設計では重み付けは保守的で検出力を下げる（§5.2）。残る疑問：検定は効果の有無だけを示し、どの個体間の効果かや大きさは分からない。棄却が同僚効果でなく他の横断的な依存（共通因子）による可能性を著者も§6.2で論じる。", "fun": "「友だちの成績が自分の成績に影響するか」を調べたくても、誰と誰が友だちなのかの名簿がないことがよくあります。この検定は名簿を作らずに、「本当につながりがないなら、他人の事情と自分の結果は無関係のはず」という性質だけを使って、影響の有無を確かめられるようにしました。", "unverified": "実証の具体的なp値と棄却の時期（図5〜6）の詳細は読んでいない。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "実際のウェブ環境での深い検索エージェント", "title": "Deep Search in Real-World Web Environments", "url": "https://arxiv.org/abs/2610.30181", "authors": "Xiaomin Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Yu, X., Chen, H., Huang, Z., Yan, S., Su, S.-R., Ma, X., Wang, F., Chen, J., Fang, J., Yan, Y., Huang, Y., Chen, C., Cheng, R., He, Y., Zhang, Y., Hu, X., Liu, C., Lin, J., Li, Y., … Qin, C. (2026). Deep Search in Real-World Web Environments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30181", "why": "実際のオープンウェブで端から端まで調べ物をするDeep Searchエージェントの能力を評価・改善する研究。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（課題定義§2.1、構築と人の検証§2.2〜2.3、実験結果§3.2〜3.3、結論§5、図4〜6）を読んだ", "preprint": true, "p1": "実際のオープンウェブで、複数の独立した情報源から証拠を探し出してつなぎ、唯一の事実の答えを出す深い検索（Deep Search）を評価するベンチマークOpenDS-World（200課題）を作り、最先端の12モデルでも正答率は最高39.0%にとどまることを示した（未査読プレプリント）。", "p2": "従来の検索エージェントの評価は静的な検索環境が中心で、実際のウェブのように情報が多様な情報源・形式・操作（地域選択、API、ダウンロードなど）に散らばる状況での、端から端までの調べ物の能力は十分に評価されていなかった（§1、図3）。", "p3": "課題は動画などの視聴覚の手がかりから始まり、ウェブ検索、ブラウザ操作、証拠の処理を組み合わせて複数の情報源をつなぐ必要がある（§2.1、図2）。証拠の連鎖は4つのモダリティ、42のファイル形式、7種類のアクセス方法にまたがる（図5）。人による独立の検証で、証拠の妥当性と答えの一意性を確認した（§2.2.2）。", "p4": "12のモデルを統一したツール環境と実行手順で評価し、正答率、ツール呼び出し回数、所要時間、トークン消費、終了の仕方を比べた（§3.1）。人の基準として、50人が各20課題を通常のブラウザで解いた計1,000回の試行を集めた（§2.3）。", "p5": "最高はGPT-6 Astraの39.00%、次いでClaude Opus 5.5が38.00%、Gemini 3.8 Flashが36.50%で、最強のモデルでも200課題中122で失敗した（§3.2）。12モデル平均の正答率は難易度Low 39.66%、Medium 23.50%、High 16.76%と下がった。人の正答率は21.10%で、1回あたり平均38.8分かかり、200課題中85は5人の誰も解けなかった（§2.3.2、図4）。Gemini 3.8 FlashはGPT-6 Astraの約5.22倍のトークンを使って正答率が低く、資源を多く使うほど正答するわけではなかった（§3.2、図6）。", "p6": "著者は、ツールの失敗の費用、予算切れの多さ、自然に終了することと正答の食い違いを残る課題に挙げる（§5）。残る疑問：生のウェブは時間とともに変わるため、同じ課題での再現性と、時期をまたいだ比較をどう保つか（解釈）。", "fun": "「この動画に映っている建物のある町の、ある年の人口は？」のように、動画、地図、表のファイルを渡り歩いて答えを探す問題をAIと人に解かせました。AIの最高点は人より高いのに、それでも6割の問題で失敗し、たくさん調べるほど正解するわけでもない、という結果は調べ物の奥深さを物語っています。", "unverified": "ツール利用と誤りの分析（§3.4〜3.5）の数値は読んでいない。"}}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "特徴空間分解でLASSO誤差の鋭い収束率", "title": "Sharp convergence rate of the estimation error of LASSO via the Feature Space Decomposition method", "url": "https://arxiv.org/abs/2610.30622", "authors": "Guillaume Lecu\\'e ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Lecué, G., & Shang, Z. (2026). Sharp convergence rate of the estimation error of LASSO via the Feature Space Decomposition method (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30622", "why": "特徴空間分解によりLASSOの推定誤差の明示的・非漸近的な最適収束率を示した理論成果。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文のうち主結果§1.1、既存研究との比較§2.1、まとめ§4を読んだ（付録の証明は読んでいない）", "preprint": true, "p1": "ガウス線形回帰のLASSOについて、任意の信号・任意の対角共分散・σ_ξ/√N以上の任意の正則化パラメータで成り立つ、明示的で非漸近的な「個別問題ごとに最適な（instance-optimal）」推定誤差の上下界を、特徴空間分解（FSD）法で示した（未査読プレプリント）。", "p2": "既存の非漸近理論は疎性などの仮定の下で最悪の場合のミニマックス率を与えるが、個々の信号に対する誤差の正確な大きさは分からず、平均場の漸近理論は比例的な極限でしか成り立たない（§2.1）。", "p3": "係数を、σ_j|β*_j| > λ を満たす「大きな」座標の部分空間V_J*と、残りの部分空間に分ける（式1）。前者では低次元の推定問題として扱い、後者は雑音の吸収とみなして、較正方程式（式2）の解qから「自由部分空間の分散」Var（式3）を定義する。誤差の大きさは r² = σ²|J*|/N + λ²Σσ_j⁻¹ + （小さな座標の信号のエネルギー）+ Var の4項の和で表される（式4）。解釈：第1項は推定の分散、第2項は縮小による偏り、第3項は捨てた信号、第4項は雑音を吸収する費用に当たる。", "p4": "定理1で高確率の上界、定理2で一致する下界を示し、上下界が一致することで率が鋭い（sharp）ことを確かめる。既存の非漸近理論と平均場漸近理論の結果と比べる（§1.1、§2）。", "p5": "仮定1の下で、λ ≥ σ_ξ/√N の広い範囲（定数倍の端点をもつ1つの区間を除く）について、信号の疎性すら仮定せずに上界が成り立つ。等方的な場合、r²が定数倍のσ²を超えると推定量は一致性を失うことも示した（§1.1）。著者はFSDから、経験過程の道具に頼らない証明、正則化の選択のための偏り・分散分解の再定義、ミニマックスの最悪評価を超える細かな理解という3つの示唆を述べる（§4）。", "p6": "結果は対角共分散のガウス設計に限られ、一般の相関のある設計や非ガウスの雑音は扱っていない（§1.1の仮定）。残る疑問：境界の区間内のλでの振る舞いと、データから選んだλに対する保証は本文の範囲では確認できなかった。", "fun": "LASSOは「大事な変数だけ残して他はゼロにする」統計の定番の道具ですが、どれだけ正確かは「最悪の場合」でしか分かっていませんでした。この研究は、目の前の問題ごとに誤差の大きさを、推定のぶれ、縮めすぎ、捨てた分、雑音の吸収という4つの部品の和として正確に書き出しています。", "unverified": "証明（付録A〜B）は読んでおらず、定理の正確な定数は未確認。"}}, {"id": "pn07", "rank": 7, "field": "経営学", "headline": "合成消費者はマーケティング判断を歪めうる", "title": "AI Is Not Your Customer: Why Synthetic Consumers Could Corrupt Marketing Decisions", "url": "https://doi.org/10.2139/ssrn.7657518", "authors": "Lenin Heartly", "venue": "SSRN", "date": "2026-10-22", "apa": "Heartly, L. (2026). AI Is Not Your Customer: Why Synthetic Consumers Could Corrupt Marketing Decisions. https://doi.org/10.2139/ssrn.7657518", "why": "生成AIの合成消費者を調査や評価に使う危うさを整理し、意思決定を誤らせる経路を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "生成AIの合成消費者の出力が、検証なしに「顧客の証拠」へ格上げされる危険を整理し、用途ごとに満たすべき検証の負担を定める「証拠の格上げ」の枠組みを提案した概念論文（未査読プレプリント、抄録）。", "p2": "合成消費者は調査への回答、模擬フォーカスグループ、コンセプト評価、市場行動の模擬に使え、速さ・低費用・再現性・難しい場面へのアクセスを約束する。しかし、もっともらしい模擬が、意思決定に必要な水準で顧客を代表していると示されないまま顧客の証拠として扱われうる（抄録）。", "p3": "合成消費者の認識上の役割を、探索、補強、推定、予測の4つに分け、ある役割から次の役割へ出力を移す前に満たすべき検証の負担を特定する。マーケティング、行動意思決定、計算社会科学、人とコンピュータの相互作用、AIガバナンスの知見を統合する（抄録）。", "p4": "概念論文であり実証の検証はない。代わりに命題、最低限の検証テスト、意思決定権の手順、研究課題を示す（抄録）。", "p5": "集計値の類似、属性の平板化、文化的なずれ、分散の圧縮、プロンプトへの依存、管理者の過信が組み合わさって「証拠の腐敗」を生む経路を提示した。合成消費者は探索と統計的に統制された補強には有用だが、回答が流暢で一貫し人らしいというだけで顧客の証拠とみなすべきではないと結論する（抄録）。", "p6": "抄録からは、提案する最低限の検証テストの具体的な内容（どの指標で何を確かめるか）が分からない。残る疑問：推定・予測の役割に進むための基準を、実際の人の調査とどう突き合わせて決めるのか（解釈）。", "fun": "AIに「30代の会社員として新商品をどう思うか」と答えさせると、本物の客の声のように聞こえます。でも平均が似ているだけで、意見のばらつきが小さすぎたり、文化の違いが消えたりしていることがあります。便利な道具を「探る段階」から「決める根拠」に昇格させる前に、どんな確認が要るかを整理した論文です。", "unverified": "枠組みの命題と検証テストの具体的内容は未確認（本文を入手できず）。"}}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "最良の指導者より最悪の回避が重要", "title": "Avoiding the worst leaders is more important than getting the best", "url": "https://doi.org/10.31234/osf.io/8g2nb_v1", "authors": "Hallgeir Sjåstad ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Sjåstad, H., Martuza, J., & Van Bavel, J. J. (2026). Avoiding the worst leaders is more important than getting the best. https://doi.org/10.31234/osf.io/8g2nb_v1", "why": "指導者選抜で、最良を選ぶことより最悪を避けることの効果が大きいことを示す研究。", "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（考察・限界・結論の節と図1〜4のキャプション）を読んだ。各研究の方法の詳細は一部のみ", "preprint": true, "p1": "人々は最良の指導者を得ることより最悪の指導者を避けることに強く動機づけられる（悪い指導者への回避）ことを、990万件の職場レビューと40か国5万人超の実験で示した（未査読プレプリント）。", "p2": "指導者の選抜と育成への投資や研究は「良い指導者」に偏る（ポジティビティ・バイアス）。一方、Popperは制度設計の中心は誰が統治すべきかではなく悪い指導者の被害をどう防ぐかだと論じた。どちらが人の心理に合うかは検証されていなかった（抄録）。", "p3": "研究1は上位100のビジネススクールのビジョン・使命の文書のテキスト分析、研究2はGlassdoorの990万件のレビュー（4,885社）で、指導者への言及が否定・肯定の欄のどちらに多いかと会社評価の予測力を比べる。研究3〜7は、良い指導者を得るためと悪い指導者を避けるために時間やお金をどれだけ犠牲にするかを比べる実験で、道徳性と能力、仮想と実際の金銭、40か国に広げた（考察の節）。", "p4": "主な指標は犠牲を払う選択の割合とオッズ比（悪い指導者の回避条件 対 良い指導者の獲得条件）で、国別の効果と、民主主義・権力格差・GDPなどによる調整を調べた（図2〜3）。", "p5": "レビューでは指導者への言及が否定の欄で70%多く、否定的な言及は会社評価を1.5倍強く予測した（抄録）。実験全体（N = 51,433）で、悪い指導者を避けるために犠牲を払う人は良い指導者を得るためより10〜23ポイント多かった（考察の節）。効果は40か国中31か国で有意で、逆向きに有意な国はなく、オッズ比はノルウェー2.75、フランス2.62などで大きかった（図2）。実際のお金を使う研究7（N = 1,052）でも再現した（図4）。", "p6": "著者は、レビューは強い不満をもつ人ほど書きやすいこと、良い・悪いの2値の対比に限られ連続的な特徴や長所短所の混在を扱っていないこと、国レベルの調整要因は横断的で因果を示さないこと、成果が時間とお金の犠牲に限られることを認める（限界の節）。", "fun": "「すごい上司に出会いたい」より「ひどい上司だけは避けたい」という気持ちのほうがずっと強い、という研究です。ビジネススクールは理想のリーダー像ばかり教えているのに、働く人の口コミは悪い上司の話であふれていました。哲学者ポパーの「最悪を防ぐ仕組みこそ大事」という考えを、世界規模の実験で確かめた点が面白いところです。", "unverified": "各実験（研究3〜6）の個別の効果量と標本数は読んでいない。"}}, {"id": "pn09", "rank": 9, "field": "人口学", "headline": "子の教育は親の寿命を延ばすか", "title": "Children's Education and Parental Longevity. Causal Evidence From Two English School-Leaving Age Reforms", "url": "https://doi.org/10.31235/osf.io/9n8q5_v2", "authors": "Joan Eliel Madia ほか", "venue": "SocArXiv", "date": "2026-10-22", "apa": "Madia, J. E., Präg, P., & Monden, C. W. S. (2026). Children’s Education and Parental Longevity. Causal Evidence From Two English School-Leaving Age Reforms. https://doi.org/10.31235/osf.io/9n8q5_v2", "why": "英国の2回の義務教育年限延長を使い、子の教育が親の長寿に与える因果効果を推定した。", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）のPDF本文（データ、結果の表2の説明、考察の節と図1〜4のキャプション）を読んだ", "preprint": true, "p1": "英国の2回の義務教育年限の延長（1947年に14→15歳、1972年に15→16歳）を使い、子の教育が親の長寿を延ばすという因果効果は検出されないことを示した（未査読プレプリント）。", "p2": "教育の高い子をもつ親ほど健康で長生きだが、それが世代を越える教育の効果なのか、子の教育と親の健康の両方に効く家族の共通要因なのかは、高所得国では因果の証拠が乏しく結果も混在していた（抄録、表1）。", "p3": "英国高齢者縦断調査（ELSA、第1〜11波）で親の生存を追い、子の生年が改革の境目の前後かで学校を出る年齢が変わることを使うファジー回帰不連続デザイン（RDD）で推定する。親の死亡のハザード比を、観察的な関連、改革への曝露の効果（ITT）、子の教育1年あたりの効果（IV、2段階残差投入のCox比例ハザード）の3通りで出す（表2）。", "p4": "評価の基準は、IV推定のハザード比が1（効果なし）と区別できるかで、第1段階の強さ（F統計量）、帯域幅の変更、比例ハザードの仮定の検討などで頑健性を確かめた（結果の節）。", "p5": "子の教育と親の生存の正の関連は再現された（図3）。しかしITT推定では帯域24か月で4つのハザード比がどれも1と区別できず、最大は1947年改革の母親でHR = 1.25（95%CI [0.97, 1.62]）だった（表2パネルB）。改革は学校を出る年齢を0.44年（1947年）と0.29年（1972年）上げ、第1段階のFは14.8と13.0。IVのハザード比はどれも1に近く有意でなく、信頼区間は概ね0.5〜2.0と広い（パネルC）。子の性別や出身階層でも系統的な違いはなかった（図4）。", "p6": "著者は、第1段階の強さは中程度で推定が不精確であり、信頼区間が広いため中程度の効果は否定できないことを認める（結果の節）。残る疑問：義務教育の1年の延長という小さな変化の効果が、大学進学のような大きな教育の差の効果と同じとは言えない（解釈）。", "fun": "「子どもが学校に長く通うと親が長生きする」という話は、データを見ると確かに関連があります。ところが、法律で全員が1年長く学校に通うことになった機会を使って比べると、親の寿命への効果は見えませんでした。関連と原因を見分けることの大切さと、「効果なし」という結果を公表する価値を教えてくれる研究です。", "unverified": "表2の観察的な関連のハザード比の数値は読んでいない。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "e値による常に有効な推論のチュートリアル", "title": "A Tutorial on Safe Anytime-Valid Inference: Practical Maximally Flexible Sampling Designs for Experiments Based on e-Values", "url": "https://doi.org/10.31234/osf.io/h5vae_v4", "authors": "Alexander Ly ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Ly, A., Boehm, U., Grünwald, P., Ramdas, A., & van Ravenzwaaij, D. (2026). A Tutorial on Safe Anytime-Valid Inference: Practical Maximally Flexible Sampling Designs for Experiments Based on e-Values. https://doi.org/10.31234/osf.io/h5vae_v4", "why": "e値で任意の時点で停止できる実験設計と推論を、実践的に解説する。", "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文のうち理論の導入部（Villeの不等式）、図1〜6のキャプション、限界を述べた節を読んだ（Rの実例の大部分は読んでいない）", "preprint": true, "p1": "e値を使うと、標本数をいつ決めても、途中で何度見ても第1種の過誤を保つ「常に有効な（anytime-valid）」検定と信頼区間が作れることを、Rパッケージsafestatsで実践的に解説するチュートリアル（未査読プレプリント）。", "p2": "p値の検定はあらかじめ決めた標本数でしか正しく使えず、データを集めながら何度もp < 0.05を確かめると偽陽性率が膨らむ。途中で打ち切ったり追加で集めたりする柔軟な実験計画は、従来は誤りの制御を失わせた（抄録、図2〜3）。", "p3": "e値は帰無仮説の下で期待値が1以下になる非負の量で、データが来るたびに掛け合わせて更新できる（E過程）。Villeの不等式により、帰無仮説の下でe値の列が一度でも1/α（α = 0.05なら20）を超える確率はα以下である（図1、本文の導入部）。だから e ≥ 20 で棄却すれば、いつ止めても過誤率は5%以下に保たれる。同じ考えで、真の値を常に含む信頼区間も作れる。", "p4": "シミュレーションで、データを逐次監視したときの偽陽性率と信頼区間の被覆率を、通常のp値・信頼区間と比べる。t検定では、最小の臨床的に意味のある効果量δmin = 0.5に合わせた事前分布によるE過程（mom、grow、eGauss、eCauchy）を比べる（図3〜6）。", "p5": "図3では、p < 0.05を逐次確かめると偽陽性率は5%を大きく超えて増える（例：38人、さらに20人、さらに40人で検定すると約5%、8.64%、10.80%）が、e ≥ 1/αの検定は常に5%未満で、常に有効な信頼区間の被覆率も95%以上を保った。図5では帰無の下のe値の列はゆっくり0へ向かい、効果δ = 0.5の下では急速に増えた。", "p6": "著者は、監視できず1回だけ検定する設計では逐次法の検出力がp値より低く、最悪の場合は40〜70%多くのデータが要ること、データ依存の停止で効果量の点推定が小標本で偏りうること、事前分布（E過程）の選び方が必要なことを限界に挙げる（限界の節）。", "fun": "「あと少し集めたら有意になるかも」と何度もデータを覗くと、本当は効果がなくても偶然「有意」になる確率が膨らみます。e値は、効果がないときには平均して増えない賭け金のようなもので、何度覗いても「20倍に増えたら本物」というルールなら誤りを5%以下に抑えられる、という仕組みです。", "unverified": "safestatsによる具体的な計算例とその出力は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "物体から画素まで統一した視覚知覚モデル", "title": "WeVisOne-VL: Unified Visual Perception from Objects to Pixels", "url": "https://arxiv.org/abs/2610.31329", "authors": "Tianming Liang ほか", "venue": "Hugging Face Da
