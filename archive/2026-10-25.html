"headline": "米国都市の緑と地表温度の数十年の差", "title": "Continental-scale urban–reference patterns in greenness and land surface temperature across U.S. cities", "url": "https://doi.org/10.1007/s10980-026-02475-z", "authors": "Dion Kucera ほか", "venue": "Landscape Ecology", "date": "2026-10-23", "sjr": 1.211, "citescore": 7.2, "citescore_year": "2025", "apa": "Kucera, D., Pataki, D., & Jenerette, G. D. (2026). Continental-scale urban–reference patterns in greenness and land surface temperature across U.S. cities. Landscape Ecology, 41(11). https://doi.org/10.1007/s10980-026-02475-z", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "米国52都市とその周辺の比較で、都市の緑と地表温度の差が気候によって逆転し、都市が周辺より速く温暖化していることを示した。", "p3": "1995〜2024年の統合Landsat観測で、都市と参照地域の対を固定した範囲と環境共変量で比べた（抄録）。", "p5": "中央値の都市は参照より緑が少なく（ΔNDVI=−0.17）、暑かった（ΔLST=+5.09 °C）。乾燥地の都市はむしろ緑が多く涼しいことが多く、都市は参照より平均で約22%速く温暖化した（抄録）。", "fun": "都会は周りより暑くて緑が少ない、というのは湿った地域の話で、砂漠の都市では水をまく公園や庭のおかげで周りより緑が多く涼しいことさえある。同じ「都市」でも気候によって正反対になるという点が面白いところです。", "unverified": "空間変動の比較の詳細は抄録の途中で切れており未確認。"}}, {"id": "jr31", "rank": 31, "headline": "スマートシティ指標と生活の質の空間分析", "title": "Spatial Analysis of Smart City Indicators and Their Impact on Urban Quality of Life (Case Study: Lenjan County, Isfahan Province)", "url": "https://journals.kmanpub.com/index.php/aitechbesosci/article/view/6506", "authors": "Shahab Sabet Rasekh ほか", "venue": "AI and Tech in Behavioral and Social Sciences", "date": "2026-10-22", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "イランのレンジャン郡でスマートシティの発展の認識と生活の質の関係を調べたが、報告の不整合のため確定的な推論はできないと著者自ら述べた。", "p3": "5都市の住民400人の調査と専門家20人の面接、逆距離加重、局所モランI、ユークリッド距離の空間分析を行った（抄録）。", "p5": "スマートシティ指数の平均は5段階で2.48、スマートな統治が最低（2.05）、スマートな人が最高（2.83）だった。生活の質との相関はスマートな暮らし（r=.72）が最も強かった（抄録）。", "fun": "この論文で珍しいのは、抄録の中で「報告した統計値と記述統計に食い違いがあり、確かな結論は出せない」と自ら書いている点です。結果の数字だけでなく、その数字がどこまで信用できるかまで読む必要がある、という読み方の練習になる例です。", "unverified": "抄録自体が報告の不整合と記録の不足を認めている。"}}, {"id": "jr32", "rank": 32, "headline": "リモートワークの要求度・資源と人事の役割", "title": "HR's role in managing remote work demands and resources: implications for employee engagement and job satisfaction", "url": "https://doi.org/10.1108/joepp-01-2026-0097", "authors": "Hanen Louati", "venue": "Journal of Organizational Effectiveness: People and Performance", "date": "2026-10-23", "citescore": 8.1, "citescore_year": "2025", "apa": "Louati, H. (2026). HR’s role in managing remote work demands and resources: implications for employee engagement and job satisfaction. Journal of Organizational Effectiveness: People and Performance, 1–27. https://doi.org/10.1108/joepp-01-2026-0097", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "仕事の要求度-資源（JD-R）モデルで、在宅勤務の要求度と資源がワークエンゲイジメントと職務満足にどう結びつくかを調べた。", "p3": "サウジアラビアのIT関連の専門職301人の調査を、構造方程式モデルと階層的回帰で分析した（抄録）。", "p5": "仕事と生活の境界のあいまい化はエンゲイジメントと負に関連し、社会的孤立には有意な直接の関係がなかった。柔軟性と遠隔での社会的支援は正に関連し、エンゲイジメントは職務満足と強く関連した（抄録）。", "fun": "在宅勤務のつらさは「孤独」だと思われがちですが、この調査では、仕事と生活の境目がなくなることのほうが効いていました。何が負担になっているかを分けて測ると、人事が手を打つべき場所が見えてくるという点が面白いところです。", "unverified": "係数の数値は抄録に記載がなく未確認。"}}, {"id": "jr33", "rank": 33, "headline": "アルゴリズム管理と渋滞が配達員の幸福に", "title": "Examining Algorithmic Management and Traffic Exposure on Food Delivery Courier Well-Being in Jakarta's Gig Economy", "url": "https://doi.org/10.15294/maj.v15i2.62566", "authors": "Sri Novita ほか", "venue": "Management Analysis Journal", "date": "2026-10-22", "apa": "Novita, S., & Saragih, E. H. (2026). Examining Algorithmic Management and Traffic Exposure on Food Delivery Courier Well-Being in Jakarta’s Gig Economy. Management Analysis Journal, 15(2), 228–239. https://doi.org/10.15294/maj.v15i2.62566", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ジャカルタのフード配達員で、幸福を下げていたのはアルゴリズム管理ではなく、交通渋滞と事故の危険への暴露だった。", "p3": "GoFood・GrabFood・ShopeeFoodの配達員の横断調査をPLS-SEMで分析した。測定モデルの審査で、アルゴリズム管理と幸福は単一指標の構成概念になった（抄録）。", "p5": "交通への暴露は幸福に有意な負の効果を持ち（β=−0.295）、アルゴリズム管理の直接効果（β=−0.081）と交互作用（β=0.014）は有意でなかった。説明率はR²=0.096だった（抄録）。", "fun": "配達員を苦しめるのはスマホのアプリの指示だろうと思いきや、データが示したのは道路の渋滞と事故の怖さでした。新しい技術の影響に目が向きがちな中で、昔ながらの労働環境の問題が大きいことを示した点が興味深いところです。", "unverified": "標本の人数は抄録に記載がなく未確認。測定は単一指標で説明率も低い。"}}, {"id": "jr34", "rank": 34, "headline": "日本の医師と市民のAI受容 2018→2025", "title": "Changes in the acceptance of artificial intelligence in medicine among physicians and the general public in Japan: A repeated cross-sectional comparison of 2018 and 2025", "url": "https://doi.org/10.1371/journal.pdig.0001769", "authors": "Teppei Suzuki ほか", "venue": "PLOS Digital Health", "date": "2026-10-23", "sjr": 1.789, "citescore": 11.0, "citescore_year": "2025", "apa": "Suzuki, T., Tamori, H., Ohashi, K., Morii, Y., Hirata, K., Kudo, K., & Ogasawara, K. (2026). Changes in the acceptance of artificial intelligence in medicine among physicians and the general public in Japan: A repeated cross-sectional comparison of 2018 and 2025. PLOS Digital Health, 5(10), e0001769. https://doi.org/10.1371/journal.pdig.0001769", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "日本の医師と市民の医療AIへの受容を2018年と2025年で比べ、知識は増えても使う意向は変わらなかったことを示した。", "p3": "同じ質問票による反復横断のオンライン調査で、2018年は医師399人と市民600人、2025年は医師300人と市民300人を比べた（抄録）。", "p5": "医療AIを使う意向の平均は両群とも年で差がなかった。市民では自己評価の知識が増えた一方、医療費が増えるという予想も強まった（抄録）。", "fun": "AIの話題をよく聞くようになり「知っている」と感じる人は増えたのに、AIに診てもらいたい人は増えていませんでした。知ることと受け入れることは別だという、新しい技術の広がり方の一面が見える点が面白いところです。", "unverified": "調整後の推定値の詳細は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "不飽和凍土の一般化有効応力式", "title": "Generalized Effective Stress Equation for Variably Saturated Frozen Soil", "url": "https://doi.org/10.1061/jggefk.gteng-15330", "authors": "Ziyi Wang ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-24", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Wang, Z., Lu, N., Gou, L., & Likos, W. J. (2027). Generalized Effective Stress Equation for Variably Saturated Frozen Soil. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15330", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "飽和度が変わる凍土で、氷による応力（クライオストレス）とサクションを含めた一般化された有効応力の閉じた式を導いた。", "p3": "土・水・氷・空気の代表体積要素に、力のつり合いと土中水のポテンシャルのつり合いを適用し、クライオストレスを氷-氷の結合、氷-液の毛管力、氷-粒子の吸着力に分けた（抄録）。", "p5": "有効応力は全応力からサクション応力とクライオストレスを引いた形になり、条件に応じてBishop、Lu-Likos、Terzaghiの式に帰着することを示した（抄録）。", "fun": "土の強さを決める「有効応力」は、水で満ちた土、乾いた土、凍った土でばらばらの式が使われてきました。それらを一つの式にまとめ、条件を変えれば教科書の古典的な式に戻る、という統一の美しさが面白いところです。", "unverified": "実験による評価の内容は抄録の途中で切れており未確認。"}}, {"id": "jr36", "rank": 36, "headline": "氷河クレバス成長の位相場き裂モデル", "title": "Scalable Phase‐Field Implementation of Crack Evolution (SPICE) for Modeling Surface Crevasse Growth and Interaction in Glaciers", "url": "https://doi.org/10.1029/2026ms005786", "authors": "Abhinav Gupta ほか", "venue": "Journal of Advances in Modeling Earth Systems", "date": "2026-10-23", "sjr": 2.154, "citescore": 8.0, "citescore_year": "2025", "apa": "Gupta, A., Nguyen, D. T., Duddu, R., Ranganathan, M., & Robel, A. (2026). Scalable Phase‐Field Implementation of Crack Evolution (SPICE) for Modeling Surface Crevasse Growth and Interaction in Glaciers. Journal of Advances in Modeling Earth Systems, 18(10). https://doi.org/10.1029/2026ms005786", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "氷河のクレバスの3次元の成長と相互作用を、再帰的に適応するメッシュ細分化つきの位相場き裂モデルで計算できるようにした（SPICE）。", "p3": "オープンソースのFEniCSで応力ベースの位相場き裂モデルを並列に解き、位相場の値と最小セル寸法に基づいて破壊進行域だけを自動で細かくするRAMRアルゴリズムを作った（抄録）。", "p5": "き裂の進展と合体を正確に捉えることを目指したとする。抄録の範囲では計算規模や精度の数値は示されていない（抄録）。", "fun": "南極やグリーンランドの氷が海に崩れ落ちるきっかけは、氷の割れ目の成長です。メートル単位の細かい割れ目を、キロメートル単位の氷河全体の中で追うのは大変。割れそうな場所だけを細かく計算する工夫で、この大きさの差を埋めた点が面白いところです。", "unverified": "性能と検証の結果は抄録の途中で切れており未確認。"}}, {"id": "jr37", "rank": 37, "headline": "洗車業の顧客ロイヤルティとスイッチング障壁", "title": "Understanding Consumer Loyalty and Switching Barriers in the Vehicle Washing Service Business: A Case Study of Risqiva Carwash", "url": "https://doi.org/10.26740/jpeka.v10n2.p219-232", "authors": "Anggit Dyah Kusumastuti ほか", "venue": "JPEKA: Jurnal Pendidikan Ekonomi, Manajemen dan Keuangan", "date": "2026-10-22", "apa": "Kusumastuti, A. D., & Armila, A. P. (2026). Understanding Consumer Loyalty and Switching Barriers in the Vehicle Washing Service Business: A Case Study of Risqiva Carwash. JPEKA: Jurnal Pendidikan Ekonomi, Manajemen Dan Keuangan, 10(2), 219–232. https://doi.org/10.26740/jpeka.v10n2.p219-232", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの洗車店で、顧客のロイヤルティとスイッチング障壁が、技術的な品質、立地、感情的な体験から生まれていることを質的に示した。", "p3": "単一事例研究として、常連客48人と経営側2人の計50人に半構造化面接を行い、観察と写真記録を加え、Miles and Hubermanの方法で分析した（抄録）。", "p5": "二重の品質管理で保たれる一貫した仕上がりがロイヤルティの基礎になっていた（抄録）。", "fun": "洗車のように、どの店でもできそうなサービスで客が離れないのはなぜか。毎回同じ仕上がりという安心感に加え、立地や店での体験が「乗り換えにくさ」になっていました。小さな店の常連の心理を丁寧に聞き取った研究です。", "unverified": "立地と感情面の結果は抄録の途中で切れており未確認。"}}, {"id": "jr38", "rank": 38, "headline": "自動微分で構成則NNを学ぶFEMモデル更新", "title": "Automatic-Differentiation-Enabled Finite Element Model Updating: Learning constitutive neural networks from structural deformation data", "url": "https://doi.org/10.1016/j.cma.2026.119492", "authors": "Matthias Knipper ほか", "venue": "Computer Methods in Applied Mechanics and Engineering", "date": "2026-10-24", "sjr": 2.323, "citescore": 13.7, "citescore_year": "2025", "apa": "Knipper, M., Ji, C., Brand, M., & Linka, K. (2027). Automatic-Differentiation-Enabled Finite Element Model Updating: Learning constitutive neural net  spontaneous and creative improvisation. International Journal of Operations & Production Management, 1–27. https://doi.org/10.1108/ijopm-04-2026-0616", "why": "デジタル能力が自発的・創造的な即興を介してサプライチェーンの回復と刷新に効く経路を検証した。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "国境をまたぐサプライチェーンで、デジタル能力の種類によって促される即興の種類が違い、それが回復と刷新という別々の成果につながることを示した。", "p3": "買い手が66か国にいる中国の供給者-買い手の対217組で、確認的因子分析と重回帰、頑健性と内生性の検定を行った（抄録）。", "p5": "デジタルな市場志向は創造的な即興と、デジタルな工程革新は自発的な即興と正に関連した。自発的な即興は回復と、創造的な即興は刷新と正に関連した（抄録）。", "fun": "災害や混乱でサプライチェーンが止まったとき、「とにかく元に戻す」即興と「新しいやり方を作る」即興は別物でした。どちらの力を育てたいかで、身につけるべきデジタルの能力も変わる、という切り分けが面白いところです。", "unverified": "媒介効果の大きさは抄録の途中で切れており未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "マーケティングのAIを知識管理から読む", "title": "Artificial intelligence in marketing: a knowledge management perspective on decision-making", "url": "https://doi.org/10.1108/jkm-05-2026-1003", "authors": "Álvaro Hernández-Tamurejo ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-24", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Hernández-Tamurejo, Á., Horvat, S., & Skare, V. (2026). Artificial intelligence in marketing: a knowledge management perspective on decision-making. Journal of Knowledge Management, 1–21. https://doi.org/10.1108/jkm-05-2026-1003", "why": "マーケティング機能へのAI導入と、それに伴う知識の管理を事例から整理した。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "マーケティングへのAI導入と、それに伴う知識の管理を、体系的文献レビューと多重対応分析で整理した。", "p3": "AI・マーケティング・知識管理を結ぶ変数を文献から抽出して2値の行列にし、交互最小二乗による同質性分析（多重対応分析）で関係を分析した（抄録）。", "p5": "AI導入は、顧客志向の個別化、知識管理の基盤、知識に基づく戦略的意思決定支援、AIによる運用のマーケティングの4領域と結びつき、顧客知識・市場知識・予測分析・個別化と意味のある関連を示した（抄録）。", "fun": "AIをマーケティングに入れると、データから分かったことを組織の中でどう蓄え、どう判断に使うかという「知識の管理」の問題が出てきます。AIの技術そのものではなく、組織の学びの仕組みとして見るという視点が面白いところです。", "unverified": "対象文献の件数は抄録に記載がなく未確認。"}}, {"id": "jn19", "rank": 19, "field": "物理学", "headline": "曲がったベッセル型音場で物質を非接触誘導", "title": "Contactless continuous guidance of matter in its main states using curved elongated Bessel-like acoustic fields", "url": "https://doi.org/10.1073/pnas.2614959123", "authors": "Dmitrii Nikolaev ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Nikolaev, D., Iablonskyi, D., Martinez-Marchese, A., Sirkka, M., Aldea, M., Okwudire, C., Hæggström, E., Marzo, A., & Salmi, A. (2026). Contactless continuous guidance of matter in its main states using curved elongated Bessel-like acoustic fields. Proceedings of the National Academy of Sciences, 123(44). https://doi.org/10.1073/pnas.2614959123", "why": "曲がった細長い音場で固体・液体・気体の物質を非接触で連続的に誘導する方法を示したPNAS論文。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "細長いベッセル型の音場で、空中に見えない「管」を作り、気体やエアロゾルを含む物質を連続的に、曲がった経路に沿って非接触で運べるようにした。", "p3": "プログラムできる経路に沿って中心に向かう音響の力を生む細長いベッセル型音場（EBAF）を作り、物理的な案内構造なしに3次元の軌道を実時間で変えられるようにした（抄録）。", "p5": "音響ホログラムやトランスデューサのアレイが粒子を一つずつしか運べないのに対し、連続的な流れを運べ、汎用性・拡張性・実時間の軌道制御で既存法に勝るとした（抄録）。", "fun": "音は空気の振動ですが、強く集めると小さな物を浮かせる力になります。この研究は、その力で空中にストローのような通り道を作り、煙のような拡散しやすいものまで決まった道筋で流せるようにしました。管のない配管という発想が面白い点です。", "unverified": "実験の規模や輸送距離の数値は抄録の途中で切れており未確認。"}}, {"id": "jn20", "rank": 20, "field": "ロボティクス", "headline": "形の知能で飛びながら掴む・止まる", "title": "Morphological intelligence for dynamic aerial interactions", "url": "https://doi.org/10.1126/sciadv.aeg4557", "authors": "Yongkang Jiang ほか", "venue": "Science Advances", "date": "2026-10-23", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Jiang, Y., Li, J., Meng, S., Zhou, Y., He, B., & Paik, J. (2026). Morphological intelligence for dynamic aerial interactions. Science Advances, 12(43). https://doi.org/10.1126/sciadv.aeg4557", "why": "生物の飛翔体にならい、機体の形態そのものに力のやりとりを担わせて空中での接触動作を実現した。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "機体と腕の力学的な切り離しによって、飛びながら物を素早く掴む・止まる・割るといった強い接触動作ができるドローンを作った。", "p3": "非対称な双安定の衝撃モジュールと、衝撃力を機体に伝えにくい柔らかい連結構造を組み合わせた鳥のような腕を持つ機体を設計した（抄録）。", "p5": "腕は70ミリ秒で2.3倍に伸び、7節の構成では完全に伸ばした長さの約70%の上下のずれを受動的に吸収できた。飛行中のひったくり、省エネの止まり、固体の破砕、水と空気をまたぐ捕獲を実演した（抄録）。", "fun": "鳥は飛びながら獲物をつかんでもふらつきませんが、ドローンは強い力を出すとすぐにバランスを崩します。腕の形と柔らかさの工夫で衝撃を機体に伝えない「形の知能」によって、制御を頑張らなくても済むようにした点が面白いところです。", "unverified": "成功率などの数値は抄録に記載がなく未確認。"}}, {"id": "jn21", "rank": 21, "field": "地球科学", "headline": "サブメソスケール乱流が渦からの漏れを駆動", "title": "Direct observations of submesoscale turbulence driving mesoscale eddy leakage", "url": "https://doi.org/10.1126/sciadv.aef8067", "authors": "Haijin Cao ほか", "venue": "Science Advances", "date": "2026-10-23", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Cao, H., Jing, Z., Fox-Kemper, B., Qiu, B., Lacasce, J. H., & Yan, T. (2026). Direct observations of submesoscale turbulence driving mesoscale eddy leakage. Science Advances, 12(43). https://doi.org/10.1126/sciadv.aef8067", "why": "直接観測から、小さなスケールの乱流が中規模渦からの物質の漏れを生むことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "1 km未満の間隔で放した漂流ブイの群れの観測から、小さなスケールの乱流が中規模の海洋渦の水を外に漏らしていることを直接示した。", "p3": "高解像度の漂流ブイ群の実験を行い、渦の中心を基準にした座標でブイの動きを分析した（抄録）。", "p5": "サブメソスケールの乱流による強い半径方向の分散が、混合層と表層下の両方で渦の中心と周辺の水の交換を生んでいた。水平拡散係数は10〜100 m²/s程度と推定された（抄録）。", "fun": "海の大きな渦は、中の水を閉じ込めたまま何か月も旅をすると考えられてきました。ところがブイを近くに何個も流して追いかけると、細かい乱れが渦の壁に穴をあけるように水を外に漏らしていた。渦は「密閉容器」ではなかったという発見が面白い点です。", "unverified": "観測海域と期間は抄録に記載がなく未確認。"}}, {"id": "jn22", "rank": 22, "field": "物理学", "headline": "測定誘起スクイーズド光干渉計の拡張可能な構成", "title": "Scalable architecture for measurement-induced squeezed light interferometers", "url": "https://doi.org/10.1126/sciadv.aee5135", "authors": "Abhinav Verma ほか", "venue": "Science Advances", "date": "2026-10-23", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Verma, A., Hastrup, J., Neergaard-Nielsen, J. S., & Andersen, U. L. (2026). Scalable architecture for measurement-induced squeezed light interferometers. Science Advances, 12(43). https://doi.org/10.1126/sciadv.aee5135", "why": "回路が深くなるほど増える光損失の制約を、測定誘起の方式で回避する拡張可能な干渉計構成を示した。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "深い光学回路の代わりにプログラムできるホモダイン測定に複雑さを移すことで、損失の少ない浅い回路でスクイーズド光の多モード干渉計を拡張できることを実験で示した。", "p3": "測定によって実効的な変換を実現する構成を考案し、6モードの装置で原理を確かめた（抄録）。", "p5": "同じ原理を400モードの干渉計に拡張し、従来の設計を大きく超える規模を実現した。大規模なもつれ状態の生成にもつながるとした（抄録）。", "fun": "光の量子コンピュータは、光を何段も通すほど光が失われるという壁がありました。この研究は、光を通す道を浅くしたまま、「どう測るか」を変えることで深い回路と同じ働きをさせます。計算を回路から測定に引っ越させるという発想が面白い点です。", "unverified": "損失や性能の具体値は抄録に記載がなく未確認。"}}, {"id": "jn23", "rank": 23, "field": "機械学習", "headline": "機械学習ポテンシャルで粒界のイオン輸送則を発見", "title": "Machine‐Learning‐Potential‐Driven Volcano Relationship in Grain Boundary Amorphicity and Ionic Transport of Antiperovskite Solid Electrolytes", "url": "https://doi.org/10.1002/adma.75492", "authors": "Abdullah Bin Faheem ほか", "venue": "Advanced Materials", "date": "2026-10-24", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "apa": "Bin Faheem, A., & Li, H. (2026). Machine‐Learning‐Potential‐Driven Volcano Relationship in Grain Boundary Amorphicity and Ionic Transport of Antiperovskite Solid Electrolytes. Advanced Materials. https://doi.org/10.1002/adma.75492", "why": "機械学習ポテンシャルによる大規模計算で、固体電解質の粒界の非晶質度とイオン輸送の火山型関係を見いだした。", "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "能動学習した機械学習原子間ポテンシャルで、固体電解質の粒界の乱れとイオン輸送の間に「火山型」の関係があることを見いだした。", "p3": "ハロゲンを調整できる逆ペロブスカイト型の固体電解質で、局所のCl⁻/Br⁻比を変え、粒界の非晶質度とイオンの流れを分子動力学で定量化した（抄録）。", "p5": "Clの多い粒界は秩序が強すぎ、Brの多い粒界は乱れが強すぎて移動を妨げ、中間の組成が適度な非晶質の環境でイオン輸送を最大にした。この関係に基づき陰イオンを設計した粒界を作った（抄録）。", "fun": "整いすぎても乱れすぎてもイオンは通りにくく、ほどほどの乱れが一番通りやすい。山の頂上が最適という火山の形の関係です。量子力学並みの精度を機械学習で安く再現し、大きな規模の計算ができるようになったことで見えた法則という点が面白いところです。", "unverified": "イオン伝導度などの数値は抄録に記載がなく未確認。"}}, {"id": "jn24", "rank": 24, "field": "経済学", "headline": "ドイツで格差拡大と世代間移動の低下", "title": "Rising inequality, declining mobility: The evolution of intergenerational mobility in Germany", "url": "https://doi.org/10.1016/j.jpubeco.2026.105811", "authors": "Julia Baarck ほか", "venue": "Journal of Public Economics", "date": "2026-10-23", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Baarck, J., Bode, M., & Peichl, A. (2026). Rising inequality, declining mobility: The evolution of intergenerational mobility in Germany. Journal of Public Economics, 263, 105811. https://doi.org/10.1016/j.jpubeco.2026.105811", "why": "ドイツにおける世代間の所得移動の変化を追い、格差の拡大と移動性の低下の関係を検証したJournal of Public Economicsの論文。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、ドイツで格差が拡大し世代間の社会移動が低下してきた推移を調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、親の所得が子の所得をどれだけ決めるかが、時代とともにどう変わったかということです。格差が広がると、はしごの段の間隔が広がって登りにくくなる、という「グレート・ギャツビー曲線」の考え方を国内の時系列で確かめる問いが面白そうです。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jn25", "rank": 25, "field": "経済学", "headline": "準ランダムなルームメイトで技能の仲間効果", "title": "Specific Skills, Peer Effects, and Academic Outcomes: Evidence from Quasi-Randomly Assigned Roommates", "url": "https://doi.org/10.1086/744667", "authors": "Qi Gao ほか", "venue": "Journal of Labor Economics", "date": "2026-10-23", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "apa": "Gao, Q., Si, R., & Zhang, J. (2026). Specific Skills, Peer Effects, and Academic Outcomes: Evidence from Quasi-Randomly Assigned Roommates. Journal of Labor Economics. https://doi.org/10.1086/744667", "why": "準ランダムに割り当てられた同室者を使い、特定の技能が学業成績に及ぼす仲間効果を推定した労働経済学の論文。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、準ランダムに割り当てられたルームメイトを使い、特定の技能が学業成績に及ぼす仲間効果を推定した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、数学が得意なルームメイトと同じ部屋になると、自分の数学も伸びるのか、ということです。友人は自分で選ぶので普通は比べられませんが、くじで決まる同室者なら因果が測れる、という研究の工夫が面白そうです。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jn26", "rank": 26, "field": "経済学", "headline": "性的指向差別禁止法と労働市場の格差", "title": "Effect of State and Local Sexual Orientation Anti-Discrimination Laws on Labor Market Differentials", "url": "https://doi.org/10.1086/744668", "authors": "Scott Delhommer ほか", "venue": "Journal of Labor Economics", "date": "2026-10-23", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "州・地方の性的指向に関する差別禁止法が労働市場の格差に与えた効果を推定した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録は取得できず、題名検索で見つけたarXiv版（2404.03794）の抄録を使用", "preprint": false, "short": true, "p1": "州・地方の性的指向の差別禁止法が、同性カップルの男性の就業と賃金順位の格差を縮めたことを示した。", "p3": "米国コミュニティ調査の世帯構成から性的指向を推定し、州と地方の差別禁止法のパネルと組み合わせ、法の導入の時期と地域の違い、同性と異性のカップルの違いを使う準実験で分析した（抄録）。", "p5": "男性の同性カップルでは労働参加と就業の格差が縮まり、賃金分布での順位が上がった。女性の同性カップルではおおむね効果がなく、都市圏では就業がむしろ減り、子どもを持つことが増えたことが一つの説明とされた（抄録）。", "fun": "差別を禁じる法律は、働く機会を広げるはずです。男性カップルではその通りでしたが、女性カップルでは働く人がむしろ減り、その代わりに子どもが増えていました。法律が人生の選択肢そのものを変えたのかもしれない、という意外な広がりが面白い点です。", "unverified": "arXiv版の抄録であり、掲載版と内容が同じかは未確認。"}}, {"id": "jn27", "rank": 27, "field": "経済学", "headline": "LLMは労働市場のシグナルをどう変えるか", "title": "Labor Market Signals: The Role of Large Language Models", "url": "https://doi.org/10.1086/744669", "authors": "Kian Abbas Nejad ほか", "venue": "Journal of Labor Economics", "date": "2026-10-23", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "大規模言語モデルの普及が、応募書類などの労働市場のシグナルの役割に与える影響を扱った労働経済学の論文。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録は取得できず、題名検索で見つけたSSRN版（10.2139/ssrn.5185035）の抄録を使用", "preprint": false, "short": true, "p1": "LLMで書いた送付状は質が上がるが面接の招待は増えず、LLMの使用が知られると人が書いた良い送付状が高く評価されるようになることを示した。", "p3": "送付状に注目した2つのフィールド実験と、校正した構造モデルで分析した（抄録）。", "p5": "LLMは信号の質を高め、とくに質の低い応募者に有利だったが、改善は定型的で影響の小さい部分に集中し、面接の招待は増えなかった。LLMはシグナルの情報量を下げ、マッチングの非効率を増やしうると推計された（抄録）。", "fun": "誰でもAIできれいな文章を書けるようになると、文章のうまさは実力の目印として役に立たなくなります。すると採用担当者は、AIに頼らず自分で書いた文章を前より高く評価するようになる。道具の普及が「信号」の価値を変える様子が面白い点です。", "unverified": "SSRN版の抄録であり、掲載版と内容が同じかは未確認。"}}, {"id": "jn28", "rank": 28, "field": "経済学", "headline": "老齢年金の世代を越えた波及効果", "title": "Spillover Effects of Old-Age Pension across Generations: Family Labor Supply and Child Outcomes", "url": "https://doi.org/10.1086/744670", "authors": "Katja Maria Kaufmann ほか", "venue": "Journal of Labor Economics", "date": "2026-10-23", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "老齢年金が家族の労働供給と子の成果に波及する効果を推定した。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、老齢年金が世代を越えて、家族の労働供給と子の成果に波及する効果を調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、祖父母が年金をもらうと、親の働き方や孫の育ち方まで変わるのか、ということです。家族の中でお金と時間がどう回っているかが見えてくる問いで、高齢化の進む社会にとって身近なテーマです。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jn29", "rank": 29, "field": "経済学", "headline": "部分割当つきマッチング関数均衡の推定", "title": "Matching Function Equilibria with Partial Assignment: Existence, Uniqueness and Estimation", "url": "https://doi.org/10.1086/744671", "authors": "Liang Chen ほか", "venue": "Journal of Labor Economics", "date": "2026-10-23", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "部分的な割当を許すマッチング関数均衡の存在・一意性・推定を扱った理論計量の論文。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "マッチングモデルや離散選択モデルに共通する「部分割当つきマッチング関数均衡」という構造を示し、均衡の存在と一意性を証明し、計算法と推定法を与えた。", "p3": "集計されたマッチング関数と非線形の連立方程式からなる構造について、存在・一意性の証明、効率的な計算アルゴリズム、一部の模型でパラメトリックな推定の要らない反実仮想の構成法を示した（抄録）。", "p5": "1982年の社会保障の学生給付の廃止が米国の結婚市場に与えた影響を分析し、候補の模型を推定して情報量規準で最良のものを選んだ（抄録）。", "fun": "結婚相手探しも、就職先選びも、商品選びも、「誰と誰が組むか」という同じ形の問題として書ける、というのがこの論文の出発点です。ばらばらに見える分野の共通の骨組みを見つけて、まとめて解けるようにした点が面白いところです。", "unverified": "推定結果の数値は抄録に記載がなく未確認。"}}, {"id": "jn30", "rank": 30, "field": "経済学", "headline": "所得の動態と企業レベルのショック", "title": "Earnings Dynamics and Firm-Level Shocks", "url": "https://doi.org/10.1086/744665", "authors": "Benjamin Friedrich ほか", "venue": "Journal of Labor Economics", "date": "2026-10-23", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "企業レベルのショックが労働者の所得動態にどう伝わるかを扱った労働経済学の論文。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録は取得できず、題名検索で見つけたIFSのワーキングペーパー版の抄録を使用", "preprint": false, "short": true, "p1": "スウェーデンの雇用者-被用者データで、企業の恒久的な生産性ショックが賃金に伝わり、その効果が主に高技能の労働者に集中することを示した。", "p3": "就業と転職の内生的な決定を考慮した賃金の確率過程のモデルを推定した（抄録）。", "p5": "高技能者では企業のショックが生涯の所得分散の増加を主に生み、55歳時点の賃金の横断分散は、企業ショックの転嫁がない場合より約3分の1高かった。低技能者では一時的・恒久的ショックの転嫁は同程度で小さかった（抄録）。", "fun": "同じ年齢の人の間で給料の差が年々広がるのは、本人の能力の差だけではなく、勤めている会社の業績の浮き沈みが給料に伝わるからでもありました。しかもその影響は、技能の高い人ほど大きい。会社が格差の源になるという点が面白いところです。", "unverified": "ワーキングペーパー版の抄録であり、掲載版と内容が同じかは未確認。"}}, {"id": "jn31", "rank": 31, "field": "経営学", "headline": "同業比較の提示で企業サイトのデジタル化を促す", "title": "Peer benchmarking and digital upgrading: Field experiments on business websites", "url": "https://doi.org/10.1016/j.respol.2026.105630", "authors": "Anwar Adem ほか", "venue": "Research Policy", "date": "2026-10-24", "citescore": 17.6, "citescore_year": "2025", "why": "同業他社との比較情報が企業ウェブサイトの改善を促すかを、フィールド実験で検証したResearch Policyの論文。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、同業他社との比較情報を示すことで企業のウェブサイトのデジタル化を促せるかを、フィールド実験で調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「ライバル店のサイトはもっと進んでいますよ」と知らせるだけで、会社がサイトを改善するかということです。電気代の明細に近所の平均を載せると節電が進む、という話と同じ仕組みが企業にも効くのかが面白そうです。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "jn32", "rank": 32, "field": "機械学習", "headline": "量子着想の幾何・エネルギー融合で感情分析", "title": "QEGF: A Quantum-Inspired Geometric and Energy-Based Fusion Framework for Multimodal Sentiment Analysis", "url": "https://doi.org/10.1109/tpami.2026.3746701", "authors": "Yuxuan Hu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-23", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "量子着想の幾何とエネルギー基準の融合でマルチモーダル感情分析を行うTPAMIの手法論文。", "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用", "preprint": false, "sh       var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
