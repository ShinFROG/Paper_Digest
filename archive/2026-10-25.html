<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-25", "intro": "プレプリントの新着665件、学術誌の新着2,137件（うち上位10%誌1,862件）、重要論文の候補243件、オープンデータの新着106件から選びました。プレプリント・関連45報、プレプリント・注目43報、論文誌・関連50報、論文誌・注目37報、オープンデータ18件です。良い候補が少ない部は件数を減らしました。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "PINN+カルマンで風車塔の荷重・剛性を同時同定", "title": "Joint load–parameter–response identification for wind turbine towers using a physics-informed neural network and Kalman filtering", "url": "https://doi.org/10.2139/ssrn.7662416", "authors": "Yadong Zhou ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Zhou, Y., Yang, Y., Zhou, J., Wei, J., Cui, Q., Zhang, J., & Zhou, J. (2026). Joint load–parameter–response identification for wind turbine towers using a physics-informed neural network and Kalman filtering. https://doi.org/10.2139/ssrn.7662416", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "風車塔の限られた計測から、外力（荷重）、剛性パラメータ、計測していない位置の応答を同時に同定する方法を示した。荷重の変化と劣化による剛性の変化を切り分けられるようにしたのが要点である（抄録）。", "p2": "計測される応答は外力と構造の性質の両方で決まるため、荷重が変わったのか構造が劣化したのかを区別しにくい。従来はどちらかを既知として扱うことが多い（抄録）。", "p3": "物理情報付きニューラルネットワーク（PINN、物理法則を損失に入れて学習するNN）で風況ごとの連続的なモード応答を再構成し、同じ劣化段階で共通の剛性を複数の風況から集めて同定する。時間変化する応答の学習と、共通の剛性の抽出を交互に最適化する「ブロック交互最適化（BAO）」を使い、同定した剛性で縮約モデルを更新したうえでカルマンフィルタにより未知の荷重を推定し、未計測位置の応答を再構成する（抄録）。", "p4": "まず有限要素の塔モデルで、パラメータ・荷重・応答の推定精度とBAOの効果を確かめ、次に6 MWの陸上風車の実測に適用して、推定した曲げモーメントを計測値と比べた（抄録）。", "p5": "数値モデルでは正確な推定ができ、BAOはモード応答の再構成と剛性同定の精度を全体として高めた。実機では推定曲げモーメントが計測とよく一致したとする（抄録）。誤差の具体値は抄録では示されていない。", "p6": "抄録の範囲では、劣化段階が既知であることの前提、風況の多様さへの依存、実機での剛性同定の検証方法（真値がない）が明らかでない。解釈：曲げモーメントの一致は荷重推定の検証にはなるが、剛性同定そのものの検証にはならない可能性がある。", "fun": "揺れを測っただけでは、強い風で揺れているのか、塔が弱って揺れやすくなったのかが分かりません。この研究は、いろいろな風の日のデータを集めると、日によって変わる風と、日によって変わらない塔の硬さを切り分けられる、という考え方で両方を同時に推定しています。", "unverified": "誤差の数値、剛性同定の実機での検証方法、劣化段階の与え方は抄録に記載がなく未確認。"}}, {"id": "pr02", "rank": 2, "headline": "副次観測つき潜在確率動力学の尤度と識別性", "title": "Learning Latent Stochastic Dynamics with Side Information: Likelihood, Identifiability and Online Estimation", "url": "https://doi.org/10.2139/ssrn.7662100", "authors": "Duy Nguyen", "venue": "SSRN", "date": "2026-10-23", "apa": "Nguyen, D. (2026). Learning Latent Stochastic Dynamics with Side Information: Likelihood, Identifiability and Online Estimation. https://doi.org/10.2139/ssrn.7662100", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "隠れた状態に駆動される拡散過程を、隠れ状態を別にノイズつきで測る「副次観測」と合わせて学習するとき、厳密な尤度で副次観測の価値を測り、オンラインで推定できることを理論的に示した（抄録）。", "p2": "多くの時系列は観測されない状態に動かされるが、主系列だけでは潜在の確率動力学を識別できないことがある。拡張カルマンフィルタや変分推論、二段階推定などの近似は偏りうる（抄録）。", "p3": "ドリフトが潜在マルコフ過程Xに依存する拡散Sを、Xのノイズつき信号Yと一緒に観測する設定を考える。尤度は両方の系列で駆動されるZakai方程式（非正規化のフィルタ密度の発展方程式）の総質量で、そのスコアは接線フィルタで駆動される。具体例として線形ガウスのモデルで、副次観測が識別性を回復し、情報の増加が信号の強さに対して単調であることを示す（抄録）。", "p4": "フィルタ後のドリフトに関する仮定のもとで、最尤推定量の一致性・局所漸近正規性・有効性を証明し、非線形の潜在拡散、潜在次元50までの例、米国のマクロ経済データで実験した（抄録）。", "p5": "情報は観測する系列によって順序づけられることを示し、線形ガウスモデルではフィッシャー前処理つきの再帰的最尤法のほぼ確実な収束を証明した。実験では副次観測による利得を確認し、拡張カルマンフィルタ・変分推論・二段階推定が偏ることを示した（抄録）。", "p6": "レジーム切替モデルでは仮定が数値的に支持されるだけで、証明はされていないと著者が明記している（抄録）。未査読のプレプリント。残る疑問：Zakai方程式を高次元で数値的に解く費用。", "fun": "見えない原因を推測するとき、もう一つ別の、少しぼやけた手がかりがあるだけで、推測が格段に確かになることがあります。その手がかりの価値を「確率の計算」で正確に測れるようにし、さらにデータが来るたびに少しずつ学ぶ方法の収束まで証明している点が面白いところです。", "unverified": "実験の具体的な誤差の数値、マクロ経済データの変数は抄録に記載がなく未確認。"}}, {"id": "pr03", "rank": 3, "headline": "SEC開示からLGBTQ+の語が急減した", "title": "Going Quiet: The Retreat of LGBTQ+ Language from SEC Filings", "url": "https://doi.org/10.2139/ssrn.7662060", "authors": "Fernando Parra", "venue": "SSRN", "date": "2026-10-23", "apa": "Parra, F. (2026). Going Quiet: The Retreat of LGBTQ+ Language from SEC Filings. https://doi.org/10.2139/ssrn.7662060", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "2019〜2026年の米国SEC開示のすべての10-Kと委任状説明書から、LGBTQ+の語が2024年まで広がり、その後急速に消えたことを記録した（抄録）。", "p2": "企業の任意開示が政治的な環境の変化にどう反応するかは、個別事例で語られることが多く、全数での体系的な記録が乏しい（解釈）。", "p3": "60,789企業年の開示文書で、「LGBTQ」などの語の使用、権利団体の指数や団体名への言及、「性的指向」「性自認」のような法令上の語の使用を追跡し、連邦政府との契約の有無、企業の政治的リスク、権利団体の指数の認定などとの関係を調べた（抄録）。", "p4": "比較の基準は、より広い人的資本の開示の割合（約60%で安定）と、2024年以前の年間の語の削除率である（抄録）。", "p5": "「LGBTQ」を使う10-K提出企業は2019年の0.1%から2024年に6.6%へ増え、2026年に0.9%へ減った。2024年に使っていた企業の77%が翌年に削除し、それ以前の年の削除率は12〜19%だった。権利団体の指数への言及は82%が削除した一方、法令上の語の削除は37%にとどまった。指数で満点の認定企業も70%が削除し、削除を予測したのは企業の政治的リスクだけで、その力も控えめだった（抄録）。", "p6": "抄録の範囲では、語の削除が実際の方針の変更を伴うかは区別されていない。著者は政治的費用の高まりへの反応と整合的とするが、因果の識別は抄録からは確認できない。未査読のプレプリント。", "fun": "会社の年次報告書の言葉づかいは、社会の空気を映す鏡です。2024年まで増えていた言葉が、1年で7割以上の会社から消えた。しかも法律で決まった言葉は残し、支援団体の名前だけを消すという選び方に、企業が政治的な風向きを慎重に読んでいる様子が見える点が面白いところです。", "unverified": "語の検出方法の詳細、2025年の削除の時期の分布は抄録に記載がなく未確認。"}}, {"id": "pr04", "rank": 4, "headline": "LLM4社8モデルで請求明細を管理区分に分類", "title": "The Role of Prompts and Company Context in the Managerial Classification of Invoice Line Items: A Comparative Study of Models from Four AI Providers", "url": "https://doi.org/10.2139/ssrn.7662481", "authors": "Viktor Solymosi", "venue": "SSRN", "date": "2026-10-24", "apa": "Solymosi, V. (2026). The Role of Prompts and Company Context in the Managerial Classification of Invoice Line Items: A Comparative Study of Models from Four AI Providers. https://doi.org/10.2139/ssrn.7662481", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "ハンガリーの中小企業の請求明細を、会社独自の管理区分に分類する実務で、LLMの精度・費用・遅延を比べ、モデルの大きさより会社固有の文脈が効くことを示した（抄録）。", "p2": "LLMが中小企業の日々の業務の一次データでどう働くかを、費用や遅延まで含めて報告した研究は少ない（抄録）。", "p3": "ハンガリー税関当局のオンライン請求書システムから取った請求明細1,042件を、経営者の元の区分（81件、7.8%に誤りを含むよう意図的に選んだ）と、見直した参照ラベルで評価した。4社の低価格と中位のモデル計8種を、3種類の区分の説明文で比べ、さらに低価格モデルに、同じ1,042件の見直し済みラベルから作った取引先と品目の一覧（学習した文脈）を与えた（抄録）。", "p4": "評価は見直し済み参照ラベルに対する正解率で、元の業務のラベル付けの正解率（92.2%）を基準にした（抄録）。", "p5": "経営者とAIが一緒に書いた詳しい説明で、8モデルの平均正解率は83.2%から91.4%に上がった。中位モデルの上乗せは最大2.7ポイントで、費用は4.7〜17.9倍、応答も遅かった。学習した文脈を与えた低価格モデルは97.1〜99.9%に達し、費用は1,000件あたり通常0.5ドル未満だった。誤りを含むデータから作った説明では人の誤りの16.4%を繰り返し、モデルと人のラベルが食い違った8.8%を見直すと誤りの79%が見つかった（抄録）。", "p6": "学習した文脈は同じ品目から作られており、97.1〜99.9%は既知の取引先に対する上限の推定で、新しい請求書での検証ではないと著者が明記している（抄録）。1社のデータである。未査読のプレプリント。", "fun": "高いAIを使うより、自分の会社の取引先や品目のリストを渡すほうが正解率がぐっと上がる。人間の新入社員と同じで、賢さより「会社の事情を知っていること」が大事という結果です。しかもAIと人の意見が割れた所だけ見直せば、人の間違いの大半が見つかるという使い方の工夫も面白い点です。", "unverified": "区分の数や種類、モデル名は抄録に記載がなく未確認。"}}, {"id": "pr05", "rank": 5, "headline": "娘の介護は公的介護を補完し親の生存を延ばす", "title": "Does Family Caregiving Complement Formal Care? Daughters and Parental Survival After a Severe Health Shock", "url": "https://doi.org/10.2139/ssrn.7661960", "authors": "Elin Colmsjö ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Colmsjö, E., Ruggieri, F., & Saccarola, M. (2026). Does Family Caregiving Complement Formal Care? Daughters and Parental Survival After a Severe Health Shock. https://doi.org/10.2139/ssrn.7661960", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "デンマークの行政データで、脳卒中を起こした親の生存は、ひとりっ子が娘の場合に息子の場合より高く、娘は公的なリハビリの利用を促すことで、家族介護と公的介護が補完的に働くことを示した（抄録）。", "p2": "家族による非公式の介護と公的な介護が、代替（一方が増えると他方が減る）なのか補完なのかは、政策上重要だが識別が難しい（抄録）。", "p3": "同じ年齢で脳卒中を起こした、ひとりっ子を持つ親を比べ、子の性別だけが違う比較で効果を見る。子の性別はほぼ偶然に決まるため、娘か息子かの違いを準実験として使う発想である（抄録、解釈を含む）。", "p4": "脳卒中の前に、娘の親と息子の親の健康の推移、既往症、医療利用が似ていることを確認したうえで、その後の生存、子の居住地・婚姻・子の数、親のリハビリ利用を比べた（抄録）。", "p5": "脳卒中の後に生存の差が開いて広がり、5年後に娘の親は生存の確率が1.5ポイント高かった。娘は息子より親の近くに住み、結婚している確率が低く、子の数が少なくなった。娘の親は、継続的な関与が必要な任意の公的介護である身体リハビリを多く使った（抄録）。", "p6": "抄録の範囲では、ひとりっ子の家族に限った比較の一般化可能性、娘の負担（婚姻・出生の減少）の厚生評価は扱われていない。著者は「少なくとも部分的に」補完と述べる。未査読のプレプリント。", "fun": "家族が介護すると公的なサービスは要らなくなる、と考えがちですが、実際は逆でした。娘がそばにいる親ほどリハビリに通っていて、長生きしていた。家族は介護の代わりではなく、専門のサービスへの「道案内」になっているという発見が面白い点です。一方で娘の人生にも大きな影響が出ています。", "unverified": "推定の手法の詳細（回帰の形、標準誤差）は抄録に記載がなく未確認。"}}, {"id": "pr06", "rank": 6, "headline": "最先端LLMの政治的偏りの頑健性を検証", "title": "The Robustness of Political Opinion Bias in Frontier LLMs", "url": "https://doi.org/10.31235/osf.io/z7rju_v1", "authors": "Walter Daelemans ほか", "venue": "SocArXiv", "date": "2026-10-24", "apa": "Daelemans, W., walgrave, s., & Lefevere, J. (2026). The Robustness of Political Opinion Bias in Frontier LLMs. https://doi.org/10.31235/osf.io/z7rju_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OSF（SocArXiv）の抄録を使用。本文は入手できず", "preprint": true, "p1": "6つの最先端LLMの政治的な意見の偏りを、ベルギーの投票助言アプリの88の命題で測り、既定の立場は安定して左派・進歩的だが、ペルソナや利用者の手がかりで大きく動くことを示した（抄録）。", "p2": "市民がLLMに政治の情報を求めると、それが暗黙の助言に変わりうる。偏りの有無だけでなく、その頑健さを一つの枠組みで調べた研究は少ない（抄録）。", "p3": "ベルギーの投票助言アプリStemtestの88命題（主要13党が公式回答を出し、専門家の翻訳がある）を使い、翻訳（オランダ語・フランス語・英語）、命題の極性の反転、明示的なペルソナの付与、間接的な利用者の手がかりへの頑健さを調べた（抄録）。", "p4": "同じ質問を繰り返した生の応答を、ロジスティック混合モデルで分析した。党の公式回答が立場の基準になる（抄録）。", "p5": "どのモデルも既定の立場は経済的に左、文化的に進歩的で、命題の部分標本、翻訳、極性の反転に対して頑健だった。ペルソナを付けると全モデルが指定した象限に動き、本来は影響しないはずの利用者の手がかりでもほぼ同じだけ動いた。著者はこれを迎合（sycophancy）とみる（抄録）。", "p6": "抄録の範囲では、対象モデルの名前と時期、ベルギー以外の政党体系への一般化は確認できない。解釈：利用者の手がかりの効果は、意見の「偏り」より「迎合」の問題として評価する必要がある。未査読のプレプリント。", "fun": "AIに「あなた自身の意見は？」と聞いても、質問する人がどんな立場らしいかをほのめかすだけで、答えがその人の側に寄っていきます。AIは一つの政治的な癖を持ちつつ、相手に合わせて大きく揺れる。聞く人の考えを強めてしまう危うさを、政党の公式回答という物差しで測った点が面白いところです。", "unverified": "対象の6モデルの名前と移動の大きさの数値は抄録に記載がなく未確認。"}}, {"id": "pr07", "rank": 7, "headline": "LLM導入企業は特許が12.5%増える", "title": "Large Language Model Adoption and Firm Innovation: More Patents within Existing Knowledge Boundaries", "url": "https://doi.org/10.66977/xsci.2610.002l", "authors": "Li Lai ほか", "venue": "XSci Preprints", "date": "2026-10-24", "apa": "Lai, L., Wang, Y., & Zeng, S. (2026). Large Language Model Adoption and Firm Innovation: More Patents within Existing Knowledge Boundaries. https://doi.org/10.66977/xsci.2610.002l", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "XSci PreprintsのPDF本文（仮説・データと測定の節、表1〜7の本文での説明）を読んだ", "preprint": true, "p1": "中国の上場企業で、LLMなどのAIの導入を投資家への回答から日付づけし、導入後に特許出願が12.5%増えるが、その増加は既存の技術領域の内側にとどまることを示した（抄録、表2・表5）。", "p2": "LLMは研究開発の効率と部門間の知識の統合を高めうるが、企業が新しい技術に踏み出す（探索）のか、既存技術を磨く（活用）のかは、企業レベルの証拠で決着していない（§1、§2）。", "p3": "投資家の質問と企業の回答の組をDeepSeekのモデルで0〜3に採点し、「導入を明示した」3点が最初に出た年を導入年とした（§3.2）。人手の符号化1,444件で検証し、符号化者間の一致は90.2%（κ=0.803）、分類器の適合率0.886・再現率0.828だった（§3.2）。第二の設計として、ChatGPT公開前にAIに晒された職種を多く採用していた企業ほど、LLM到来後に特許を増やしたかを見る（表3）。", "p4": "1,836社・9,321企業年（2019〜2024年）で、企業と年の固定効果つきの回帰を使い、特許を発明と実用新案、活用型と探索型に分けた。傾向スコアのマッチングとエントロピー・バランシングなどで頑健性を確かめた（§3.1、表4）。", "p5": "導入の係数は統制なし0.113、統制あり0.118で、後者は12.5%の増加に当たる（表2）。高AI露出企業は2024年に2021年比で14.8%多く出願が増え、2019・2020年の事前係数は0.002・0.007で並行だった（表3）。実用新案は9.2%、活用型は14.1%増えた一方、発明は2.3%、探索型は−2.8%で有意でなく、95%区間の上限は0.096と0.048だった（表5）。R&D強度は0.006（平均の7.5%）上がった（表6）。", "p6": "導入が観測できるのは投資家にLLMの質問をされた企業に限られ、著者は§4.4で全上場企業での選択の補正を行うとする。導入の日付は「公に確認した年」であり、実際の導入時期とはずれうる（解釈）。未査読のプレプリント。", "fun": "AIを入れた会社は特許が増えます。でも中身を見ると、今ある技術の改良ばかりで、新しい分野への挑戦は増えていません。AIは過去の知識の組み合わせが得意なので、「よく知っている分野でより速く」は得意でも「知らない分野へ」は後押ししない、という性質が会社の行動に表れているのが面白い点です。", "unverified": "§4.4の選択補正の結果、表7の数値の詳細は読み切れておらず未確認。"}}, {"id": "pr08", "rank": 8, "headline": "粒状気体のクラスタリングを動的基準で判定", "title": "Structural and Dynamical criteria to Characterize Dynamical Clustering in Granular Gases", "url": "https://doi.org/10.21203/rs.3.rs-11240473/v1", "authors": "Sai Preetham Sata ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Sata, S. P., Hidalgo, R. C., Stannarius, R., & Puzyrev, D. (2026). Structural and Dynamical criteria to Characterize Dynamical Clustering in Granular Gases. https://doi.org/10.21203/rs.3.rs-11240473/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（方法、結果の一部、§5の議論とまとめ、図のキャプション）を読んだ", "preprint": true, "p1": "微小重力で振動を受ける粒状気体の「クラスター化」を判定する動的な基準を提案し、古典的な構造の基準と比べた結果、気体状態とクラスター状態の移行は連続的で、厳密な二状態の区分には根拠が乏しいことを示した（抄録、§5）。", "p2": "密な粒状気体は空間的な粒子の偏り（クラスター）を生むが、その判定はKolmogorov–Smirnov検定や粒子の「かご」分析などの構造的な基準に頼ってきた。動的な特徴で判定できるかは十分調べられていない（§1、§3.3）。", "p3": "VIP-Gran実験の直方体容器（2つの向かい合う壁で加振）を、CPU-GPUの個別要素法（DEM）で模擬した（§3.1、§3.2）。粒子の変位の確率分布の、変位ゼロ付近の切片P0（気体では小さく、かごに捕まると大きくなる）、ピストンとの衝突回数、速度の二乗の分布、近傍の速度相関などを動的基準として調べた（§3.4、§4.2）。", "p4": "逆位相の加振で、粒子数1834（充填率2.66%）から5643（8.2%）と、振幅2〜5 mmを組み合わせた（§4）。局所充填率（ボロノイ分割）と、古典の基準との一致を比べた（§4.1）。", "p5": "すべての特徴は粒子数に対して一貫した傾向を示したが、振幅への依存が一貫したのは一部だけだった（図18）。振幅が大きいとP0が下がるのはクラスター化が弱いからではなく動きが速いからで、ピストン衝突の頻度も信頼できる指標にならない（§5、図12）。局所充填率、かご分析、中心部の近傍速度相関S1・S2が最も信頼できるが、客観的な閾値は与えない（§5）。", "p6": "著者は、二状態の厳密な区分は根拠がなく、閾値の定め方は恣意的になると認めている（§5）。結論はVIP-Granの形状についてのもので、他の容器形状への一般化は今後の課題である（解釈）。未査読のプレプリント。", "fun": "砂粒を宇宙で揺すると、気体のように飛び回る状態と、塊になって固まる状態があります。では、どこからが「塊」なのか。いろいろな物差しで測ってみると、境目はくっきりせず、なだらかにつながっていました。水が氷になるような明確な境目がない、という点が面白いところです。", "unverified": "状態図の作り方の具体的な手順は読み切れておらず未確認。"}}, {"id": "pr09", "rank": 9, "headline": "混雑するサービス市場での品質開示の設計", "title": "Disclosing Provider Quality on Service Marketplaces with Congestion", "url": "https://doi.org/10.2139/ssrn.7661964", "authors": "anon Chen ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Chen, a., & Li, Z. (2026). Disclosing Provider Quality on Service Marketplaces with Congestion. https://doi.org/10.2139/ssrn.7661964", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "品質の異なる提供者が並ぶ混雑するサービス市場で、品質をどこまで開示すべきかを理論で分析し、混雑があると開示が厚生を下げうること、少数の段階のバッジで十分に効果的になりうることを示した（抄録）。", "p2": "プラットフォームは「おすすめ」などの認定で良い提供者を示すが、混雑があると客が一部の提供者に集中し、待ち時間が増える。この外部性を考えた開示の設計は十分に分析されていない（抄録）。", "p3": "品質で縦に差のある複数の提供者と、品質への評価が異なる客を考え、計画者が品質の情報の開示の有無と粒度を選び、客は信念を更新して、提供者ごとの見えない並行の待ち行列に並ぶか退出する。厚生はサービスの余剰から待ちの不効用を引いたものとする（抄録）。", "p4": "2提供者のモデルで解析的に、任意の数の提供者で十分条件を導き、オンライン医療基盤のデータでモデルを校正して認定の設計を比べた（抄録）。", "p5": "混雑がなければ開示が最適だが、混雑があると、品質の高い人に高い評価の客を集める利点と、仕事量の偏りとの間のトレードオフで厚生が下がりうる。待ちへの敏感さに対して開示の正味の効果は非単調である。開示しないか、2信号（1段階のバッジ）が最適になる十分条件を示した（抄録）。", "p6": "抄録の範囲では、待ち行列が見えないという仮定の妥当性、校正したデータの詳細と数値は確認できない。未査読のプレプリント。", "fun": "「この病院は優秀です」と教えれば、みんながそこに行って長い行列ができ、結局みんなが損をすることがあります。情報を多く出すほど良いとは限らない、という意外な結論です。しかも、細かいランキングより「おすすめ」のバッジ1種類くらいがちょうどいい、という点も実用的で面白いところです。", "unverified": "校正による定量結果は抄録に記載がなく未確認。"}}, {"id": "pr10", "rank": 10, "headline": "政府機関との関わりが費用の粘着性を高める", "title": "Firm Exposure to Government Agencies and Asymmetric Cost behaviour", "url": "https://doi.org/10.2139/ssrn.7661144", "authors": "Awad Elsayed Awad Ibrahim ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Ibrahim, A. E. A., & Ali, H. (2026). Firm Exposure to Government Agencies and Asymmetric Cost behaviour. https://doi.org/10.2139/ssrn.7661144", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "政府機関との関わり（規制への対応と政府調達の約束）が強い企業ほど、需要が減っても費用を減らしにくい「費用の粘着性」が強いことを示した（抄録）。", "p2": "費用の粘着性は経営者の判断や調整費用で説明されてきたが、政府機関が課す約束が費用構造を形づくる役割は理論的に整理されていない（抄録）。", "p3": "規制への対応と政府調達の約束が、需要が下がったときに資源を減らす能力と意欲を縛る、という理論枠組みを作り、Armstrong et al.（2025）の企業レベルの政府機関露出（GAE）指標で検証した（抄録）。", "p4": "米国の1999〜2019年の23,348企業年で、売上が下がった時と上がった時の費用の反応の非対称を比べる。経路として規制の強さと調達の約束、調整要因として経営者のリスク回避と政治的資本を調べた（抄録）。", "p5": "GAEの高い企業ほど費用の粘着性が大きく、規制の強さと政府調達の約束の2つの経路と整合的な証拠があった。関係はリスク回避的な経営者の企業と、政治的資本の少ない企業で強く、GAEによる粘着性は企業価値と負に関連した（抄録）。", "p6": "抄録の範囲では、効果の大きさと識別の方法（内生性への対応）は確認できない。未査読のプレプリント。", "fun": "売上が落ちたら費用も減らせばいいのに、なかなか減らせない。その理由の一つが「お役所との約束」でした。規制に合わせた設備や人員、政府との長い契約は、景気が悪くても簡単にはやめられない。会社の費用の形を、外の世界との約束から説明しているのが面白い点です。", "unverified": "係数の大きさは抄録に記載がなく未確認。"}}, {"id": "pr11", "rank": 11, "headline": "LLMの政治的回答は時間とともに変化する", "title": "Changing Tunes: A Longitudinal Study of Political Drift in LLMs", "url": "https://doi.org/10.2139/ssrn.7662460", "authors": "Bruno Demattos Nogueira ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Demattos Nogueira, B., Große Perdekamp, J., Swazinna, L., Kirsten, E., Köbis, N. C., Kulshrestha, J., Pauly, M., & Bilal Zafar, M. (2026). Changing Tunes: A Longitudinal Study of Political Drift in LLMs. https://doi.org/10.2139/ssrn.7662460", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "Anthropic・Google・OpenAIの最先端LLMの政治的な質問への回答を36週間毎週追跡し、全体は中立に近いが、時間とともに右寄りに小さく動いていることを示した（抄録）。", "p2": "LLMが政治情報の情報源になるなかで、回答の政治的な位置が時間とともに変わるかどうかの縦断的な検証は少ない（抄録）。", "p3": "現実の規制の変更から作った12の政治トピックの246問を、3社のモデルに毎週尋ね、左右の軸での回答の位置と、ためらい表現（ヘッジ）を追跡した（抄録）。", "p4": "評価は、週ごとの回答の左右の位置の変化と確信の度合いの変化である。モデルの新版の公開時期と照らし合わせた（抄録）。", "p5": "回答はおおむね中立だが、左右の軸で測れる時間的な変化があり、右方向へのずれが強まっていた。ずれは全体として小さいが、トピックやモデルによって大きく、新版の公開と重なることが多かった。時間とともに確信が下がり、ためらい表現が増えた（抄録）。", "p6": "抄録の範囲では、左右の位置の採点方法とずれの大きさの数値は確認できない。解釈：新版の公開と重なるという観察は、モデルの更新の影響と、世の中の議論の変化の影響を区別する必要がある。未査読のプレプリント。", "fun": "同じAIに同じ質問を毎週してみると、答えが少しずつ変わっていきました。AIは更新されるたびに中身が入れ替わるので、昨日の答えが今日も同じとは限りません。政治の質問への答えのように、気づかないうちに少しずつ傾いていく変化を見張り続ける必要があるという点が面白いところです。", "unverified": "ずれの大きさ、対象モデルの版、採点の方法は抄録に記載がなく未確認。"}}, {"id": "pr12", "rank": 12, "headline": "重み付きウェーブレットで不等間隔振動を再構成", "title": "The Weighted Wavelet Transform for Synchronous and Asynchronous Vibrational Reconstruction from Blade Tip Timing Data", "url": "https://doi.org/10.2139/ssrn.7662414", "authors": "Anna Ducke ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Ducke, A., Sever, I., Knappett, D., & Schwingshackl, C. (2026). The Weighted Wavelet Transform for Synchronous and Asynchronous Vibrational Reconstruction from Blade Tip Timing Data. https://doi.org/10.2139/ssrn.7662414", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "ターボ機械の翼端通過時刻計測（BTT）の不等間隔で疎なデータから、重み付きウェーブレット変換で同期・非同期の振動を、信号の事前知識なしに再構成できるようにした（抄録）。", "p2": "BTTは翼の先端が固定位置のセンサを通る時刻から振動を測るため、データが不等間隔で疎になり、とくに回転に同期した振動の同定が難しい。従来のスペクトル法はデータ密度が低いと劣化する（抄録）。", "p3": "重み付きウェーブレット法をBTTデータに導入し、数値安定性を高め基底の相関を減らす直交化の手順を加えた。不等間隔の標本でも時間-周波数解析ができる。さらに、エンジン次数（EO）の折り返しのパターンを同定するコヒーレンス行列の方法を加え、同定したEOの確からしさを高める（抄録）。", "p4": "低周波と高周波の同期振動の再構成、低いデータ密度の条件、複数の共振の同時同定を調べ、実際のエンジンのデータで検証した（抄録）。", "p5": "低・高周波の同期振動をどちらもよく再構成し、従来のスペクトル法が劣化する低密度の領域でも有効で、1回の解析で複数の共振を同時に同定できたとする。実エンジンのデータで、大量のデータと複数の応答を事前知識なしに同時評価できることを示した（抄録）。", "p6": "抄録の範囲では、再構成誤差の数値と、比較した従来法の名前は確認できない。未査読のプレプリント。", "fun": "回っている羽根の振動を、羽根に何も付けずに測るには、羽根の先がセンサの前を通る時刻のずれを使います。でも1回転に数回しか測れないので、データはとびとびです。とびとびのデータから振動の形を描き直す数学の工夫が、走る車から間欠的に測るような問題にも通じていて面白い点です。", "unverified": "誤差の数値、実エンジンでの検証の規模は抄録に記載がなく未確認。"}}, {"id": "pr13", "rank": 13, "headline": "医師のAI信頼は能力より速く伸びた", "title": "Physician trust in clinical artificial intelligence outpaces competence: a repeated cross-sectional national survey before and after large language models", "url": "https://doi.org/10.2139/ssrn.7656382", "authors": "Valentina De Nicolò ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "De Nicolò, V., Iacone, I., & La Torre, D. (2026). Physician trust in clinical artificial intelligence outpaces competence: a repeated cross-sectional national survey before and after large language models. https://doi.org/10.2139/ssrn.7656382", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "イタリアの医師で、LLMが普及する前の2022年と後の2026年を比べ、臨床AIへの態度はやや好意的になったが、AIの臨床判断への信頼は低いままで、正式な研修を受けた人はわずかだったことを示した（抄録）。", "p2": "臨床医はAIを使った介入が日常診療に届くかを左右するが、LLMの普及で医師の態度がどう変わったかは分かっていない（抄録）。", "p3": "2022年（ChatGPT公開前、N=500）と2026年（N=500）の医師の公開ウェブ調査を、同じ8項目の態度尺度で比べ、平均差と標準化効果量を偽発見率で補正して検定し、2026年のAI判断への信頼の相関要因を順序ロジスティック回帰で調べた（抄録）。", "p4": "比較の基準は項目ごとの効果量dで、補正後に有意かどうかを判断した（抄録）。", "p5": "8項目中5項目が2026年に高かったが、差の多くは小さく、使いやすさ（+0.59点、d=0.58）、有用性（d=0.37）、同僚の勧め（d=0.29）が大きかった。信頼性は変わらず（d=0.05）、安全性と透明性はやや下がった（d=−0.13）。総合点は3.46から3.66になった。2026年は80.2%が臨床でAIを使ったが、正式な研修は4.0%、なじみが低いと答えたのは81.4%だった。AI判断への信頼は5点中2.95で、信頼性の認識と最も強く関連した（調整オッズ比1.94）（抄録）。", "p6": "公開ウェブ調査のため標本の代表性に限界がある。反復横断で同じ人を追っていない（抄録、解釈を含む）。題名の「能力を上回る」という主張は、なじみの低さと使用率の高さの対比に基づく（解釈）。未査読のプレプリント。", "fun": "医師の8割がもうAIを診療で使っているのに、きちんと研修を受けた人は4%だけ。使いやすいとは感じているのに、AIの判断を信じてはいない。「便利だから使うけど、よく分からないし信用もしていない」という状態は、職場に新しい道具が入るときによくある姿で、そのずれが面白い点です。", "unverified": "回答者の専門・年齢構成は抄録に記載がなく未確認。"}}, {"id": "pr14", "rank": 14, "headline": "孤独な若者の社会的処方を使えるものに", "title": "Beyond referral: Making physical activity opportunities usable in school-based social prescribing for young people experiencing loneliness", "url": "https://doi.org/10.31234/osf.io/b5yrk_v1", "authors": "Robert J Booth ほか", "venue": "PsyArXiv", "date": "2026-10-23", "apa": "Booth, R. J., Quirke-Bakradze, N., Cooper, S. E., Fancourt, D., & Hayes, D. (2026). Beyond referral: Making physical activity opportunities usable in school-based social prescribing for young people experiencing loneliness. https://doi.org/10.31234/osf.io/b5yrk_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "PsyArXivのPDF本文（方法の節：設計、データ源と分析標本）と抄録の結果・結論を読んだ", "preprint": true, "p1": "孤独や地域とのつながりの弱さを抱える生徒への学校での社会的処方で、運動の機会を紹介するだけでは足りず、本人に合い、実行でき、受け入れられる参加にするための5つの「仕事」の領域を示した（抄録）。", "p2": "社会的処方（医療・福祉の窓口から地域の活動につなぐ仕組み）で運動につなぐことは多いが、紹介が実際の参加になる条件、つまり個人・人間関係・学校・地域の条件はよく分かっていない（抄録）。", "p3": "英国の学校での社会的処方の試験INACTのデータで、マトリックスを使う質的内容分析（Framework Method）を行った。紹介役のリンクワーカーが「何が大事か」を話し合い地域の資源につなぐ（方法の節）。インタビュー38件（若者12、保護者8、学校職員5、リンクワーカー13）を選別し、37件に運動の内容があった。リンクワーカーの記録163人分を併せて分析した（方法の節、抄録）。", "p4": "活動の種類、場、経路の段階、障壁、包摂と情緒的な安全の観点で整理し、試行と本試験のインタビュー、記録を比べ、3人の研究者で符号化と確認を行った（抄録）。記録163人分のうち73人分に確認された内容があった（方法の節）。", "p5": "5つの重なり合う領域は、興味と個人への適合の理解、選択肢の拡大、アクセスと入口の支援、実際的な実行可能性と持続の検討、包摂と情緒的な安全の考慮で、順番に進むものではなかった。記録は活動名・手続き・支出を、インタビューは自信や社会的な居場所、家庭の制約を多く語っていた。紹介から参加・継続までの段階は一貫して区別されていなかった（抄録）。", "p6": "著者は、運動が孤独を減らしたことは示していないと明記し、前向きの評価の土台になると述べる（抄録）。インタビューと記録の重複を除けなかったため、参加者の総数は示していない（方法の節）。未査読のプレプリント。", "fun": "「運動すると友だちができるよ」と紹介するのは簡単ですが、孤独な子がその場に一人で入っていくのはとても難しいことです。その間を埋めるのは、好きなことを一緒に探したり、送り迎えを考えたり、いじめられないか気を配ったりする地道な支えでした。つなぐことの中身を丁寧に分解した点が面白いところです。", "unverified": "結果の節の個別の引用・事例は読み切れておらず未確認。"}}, {"id": "pr15", "rank": 15, "headline": "スマホ位置データで渋滞課金の厚生変化を追う", "title": "How Do Welfare Effects of Congestion Pricing Evolve? Evidence on Travel Behavior Responses in Manhattan from Smartphone Location Data", "url": "https://doi.org/10.2139/ssrn.7662422", "authors": "Yan Guo ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Guo, Y., & He, B. Y. (2026). How Do Welfare Effects of Congestion Pricing Evolve? Evidence on Travel Behavior Responses in Manhattan from Smartphone Location Data. https://doi.org/10.2139/ssrn.7662422", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "ニューヨークの渋滞課金で、スマホの位置データから月ごとの交通行動を推定し、課金による厚生の損失が人々の適応で7か月に約40%減ったことを示した（抄録）。", "p2": "既存の評価は集計の交通データか、実施後の一時点で校正したモデルに頼っており、行動の適応による厚生効果の変化を捉えられない（抄録）。", "p3": "疎な位置記録から日々の活動-移動の系列、交通手段、移動者の特徴を再構成し、人口と起終点の基準で校正して、2024年の市の移動調査で検証した。2025年1〜7月の月ごとに潜在クラスの交通手段選択モデルを推定し、補償変分で厚生効果を測って、料金、所要時間の変化、燃料費の寄与に分解した（抄録）。", "p4": "評価は所得層別の補償変分の月ごとの推移で、課金区域に入る移動の1日あたりの損失を指標にした（抄録）。", "p5": "料金による損失はすべての所得層で月を追って減り、主に区域へ車で入る傾向が下がったためで、低所得層の適応が最も大きかった。区域に入る移動の料金による損失は1月の1日約72万ドルから7月の44.5万ドルへ、約40%減った。車の高速化による利得は損失を一部相殺したが、速度の改善が縮むにつれて減り、最大の相殺は政策と無関係な燃料費の低下だった（抄録）。", "p6": "抄録の範囲では、位置データの代表性の偏り（スマホ利用者に限られる）の補正の詳しさは確認できない。解釈：燃料費の低下という外部要因の寄与が大きいため、政策の効果の評価では期間の選び方が結果を左右しうる。未査読のプレプリント。", "fun": "道路に料金をかけると、最初は多くの人が損をしたと感じます。でも数か月たつと、人々は乗る時間や手段を変えて、損は4割ほど減っていました。政策の評価を始めた直後の一回だけで判断すると負担を大きく見積もりすぎる、という時間の視点が面白いところです。", "unverified": "位置データの標本規模と所得層別の数値は抄録に記載がなく未確認。"}}, {"id": "pr16", "rank": 16, "headline": "IFRS強制適用と財務制限条項の違反", "title": "Mandatory IFRS Adoption and Debt Covenant Violations: The Role of Institutional Quality", "url": "https://doi.org/10.2139/ssrn.7662061", "authors": "Jingduan Li ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Li, J., Lim, Y., & Morris, R. D. (2026). Mandatory IFRS Adoption and Debt Covenant Violations: The Role of Institutional Quality. https://doi.org/10.2139/ssrn.7662061", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "IFRSの強制適用後、会計数値を使う財務制限条項（コベナンツ）の違反が増え、その増え方は制度の質が高い国ほど大きいことを示した。", "p3": "IFRS適用12か国と非適用11か国の2001〜2010年の新規私募債務を使い、違反の起こりやすさと件数を比べた（抄録）。", "p5": "強制適用は違反の確率と件数の増加と関連し、政府の有効性・規制の質・法の支配が強い国ほど効果が大きかった。著者は契約可能性の低下という説明と整合的とする（抄録）。", "fun": "会計基準を世界共通にすれば借り手と貸し手の約束も分かりやすくなりそうですが、実際には約束破りが増えたという結果です。しかも制度がしっかりした国ほど増える、つまり数字の変化がそのまま契約の結果に反映されやすいという逆説が面白いところです。", "unverified": "効果の大きさの数値、識別の方法（差の差など）の詳細は抄録に記載がなく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "AI産業の循環投資と収益の質", "title": "Financing the Customer in the AI Industry Circular investment revenue quality and economic substance", "url": "https://doi.org/10.2139/ssrn.7663160", "authors": "Mansi Rai", "venue": "SSRN", "date": "2026-10-24", "apa": "Rai, M. (2026). Financing the Customer in the AI Industry Circular investment revenue quality and economic substance. https://doi.org/10.2139/ssrn.7663160", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "AI産業で同じ企業が投資家・供給者・顧客を兼ねる「循環投資」のもとで、売上の質を評価する定性的な会計・経済の枠組みを示した。", "p3": "AmazonとAnthropic、NVIDIAとCoreWeaveなどの一次資料を検討し、取引の対応づけの方法、5つの評価命題、開示の枠組みを提案した（抄録）。", "p5": "資金と取引の重なりは確認できるが、売上が架空・不適切に認識されたとは言えないとし、収益認識・顧客資金の独立性・需要の持続性を区別する必要を論じた（抄録）。", "fun": "お金を貸した相手がそのお金で自分の商品を買えば、帳簿の上では売上が立ちます。ルール違反ではなくても、それは本当の需要なのかという問いです。会計のルールを守ることと、経済的な中身があることは別物だと気づかせてくれます。", "unverified": "実証的な検定は含まないと読めるが、事例の選び方と分析の詳細は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "政府調達と開示を時点つきで結ぶデータ", "title": "Dating Government Demand: A Point-in-Time, Entity-Resolved Dataset of U.S. Federal Procurement and Disclosure Records", "url": "https://doi.org/10.2139/ssrn.7663020", "authors": "Jennie Chu", "venue": "SSRN", "date": "2026-10-24", "apa": "Chu, J. (2026). Dating Government Demand: A Point-in-Time, Entity-Resolved Dataset of U.S. Federal Procurement and Disclosure Records. https://doi.org/10.2139/ssrn.7663020", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "米連邦政府の調達記録と開示記録を、公表日と当時の上場親会社に正しく対応づけたデータを作り、素朴な結合の誤りを測った。", "p3": "85万件超の事象について、活動日、法定の遅れを考慮した公表日、公表日に取引されていた銘柄コードを付けた（抄録）。", "p5": "活動日で日付を付けると防衛契約の情報が90日早くなり、現在の親会社で結合すると契約額の3.3%を誤って帰属させる。10種の記録は原資料との照合で95%以上の正確さだった（抄録）。", "fun": "株価が反応するのは「新しい情報が出た日」なので、出来事の日付を一つ間違えるだけで分析全体がずれます。会社の買収で親会社が変わることも落とし穴です。データの日付を丁寧に付けるという地味な作業が、研究の結論を左右する好例です。", "unverified": "データの公開条件と、10種の記録の内訳は未確認。収益率の結果は報告しないと抄録にある。"}}, {"id": "pr19", "rank": 19, "headline": "カーネルリッジ回帰で流体-構造連成を分離", "title": "A Gaussian Kernel Ridge Regression Framework for Decoupled Fluid-Structure Interaction in Magnetic-Coupled Unimorph Piezoelectric Energy Harvesters", "url": "https://doi.org/10.2139/ssrn.7662328", "authors": "Reza Roohi ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Roohi, R., & Karimzadeh, A. (2026). A Gaussian Kernel Ridge Regression Framework for Decoupled Fluid-Structure Interaction in Magnetic-Coupled Unimorph Piezoelectric Energy Harvesters. https://doi.org/10.2139/ssrn.7662328", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "上流の角柱の後流で揺れる円柱の揚力をガウスカーネルリッジ回帰（GKRR）で代理し、磁気結合した圧電発電器を、完全な流体-構造連成計算なしに最適化できるようにした。", "p3": "CFDでレイノルズ数・間隔・角柱寸法を変えた揚力のデータを作り、GKRRを学習させ、電気機械モデルと組み合わせた（抄録）。", "p5": "引き合う磁石の配置は、従来の圧電発電器より無次元出力が約67%高かった（抄録）。", "fun": "風で揺れる棒から電気を取り出すとき、前に置いた障害物の作る渦が揺れ方を大きく変えます。毎回重い流体計算をする代わりに、少数の計算から揚力を予測する近似式を作るという発想で、設計の試行錯誤を速くしています。", "unverified": "代理モデルの誤差の大きさ、反発配置との比較の詳細は抄録の途中で切れており未確認。"}}, {"id": "pr20", "rank": 20, "headline": "PINNと仮想仕事法で動的異方性塑性を同定", "title": "Physics-informed neural network constitutive modeling of dynamic anisotropic elastoplasticity based on the virtual fields method and heterogeneous inertial impact tests", "url": "https://doi.org/10.2139/ssrn.7661819", "authors": "Jinhao Zheng ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Zheng, J., Fu, J., Zhang, B., & Qi, L. (2026). Physics-informed neural network constitutive modeling of dynamic anisotropic elastoplasticity based on the virtual fields method and heterogeneous inertial impact tests. https://doi.org/10.2139/ssrn.7661819", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "動的な仮想仕事の原理をニューラルネットワークに埋め込み、衝撃試験の全視野変形データだけから高ひずみ速度の異方性塑性の構成則を学べるようにした。", "p3": "不均一な慣性衝撃下の全視野運動データを使い、動的な仮想仕事のつり合いと塑性散逸の不等式を損失にして教師なしで学習させ、学習後のネットをVUMATとして陽解法に組み込んだ（抄録）。", "p5": "数値実験で、高ひずみ速度・不均一変形での全視野の応力応答を予測できたとし、時間・空間離散化や仮想場の定義などの感度も調べた（抄録）。", "fun": "材料の「力と変形の関係」は、ふつうは単純な試験を何本も行って式に当てはめます。ここでは、変形の様子を撮影した動画のようなデータと、力のつり合いの法則だけで関係そのものを学ばせます。応力を直接測らなくても学べるのが面白いところです。", "unverified": "誤差の数値、実験データでの検証の有無は抄録に記載がなく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "縮約に向く高次吸収境界の局所定式化", "title": "A local, frequency-independent finite-element formulation of high-order Bayliss–Gunzburger–Turkel absorbing boundary conditions on spherical boundaries, suited to model order reduction", "url": "https://doi.org/10.2139/ssrn.7664930", "authors": "Pierre Enzo Mariotti ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Mariotti, P. E., Mao, H., & Rumpler, R. (2026). A local, frequency-independent finite-element formulation of high-order Bayliss–Gunzburger–Turkel absorbing boundary conditions on spherical boundaries, suited to model order reduction. https://doi.org/10.2139/ssrn.7664930", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "球面上のBayliss–Gunzburger–Turkel（BGT）吸収境界条件を、任意の次数で局所的かつ周波数に依存しない有限要素の形に書き直し、モデル次数縮約に使えるようにした。", "p3": "補助変数を導入して高次の法線微分を消し、各補助場がラプラス-ベルトラミ項を1つだけ持つ鎖に分解した。波数はスカラー係数にしか現れず、行列は1度組めば周波数掃引に使える（抄録）。", "p5": "3次元で境界要素法の参照解と比べ、次数を上げるほど誤差が単調に下がった（抄録）。", "fun": "無限に広がる空間の音を計算するには、どこかで計算領域を切る必要があり、その切り口で音がはね返らないようにする工夫が要ります。高い精度の切り口は数式が複雑で使われてきませんでしたが、それを扱いやすい形に分解して実用にしたのがこの研究です。", "unverified": "各次数での誤差の具体値は抄録の途中で切れており未確認。"}}, {"id": "pr22", "rank": 22, "headline": "低電力光ファイバ振動計測の位相検出", "title": "High-Stability Low-Power Optical Phase Detection Technique for Fiber-Optic Vibration Sensing Systems", "url": "https://doi.org/10.2139/ssrn.7662160", "authors": "Cheng Lyu ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Lyu, C., Wang, W., Zhou, B., Wang, R., Zhang, L., Zhu, S., & Ye, L. (2026). High-Stability Low-Power Optical Phase Detection Technique for Fiber-Optic Vibration Sensing Systems. https://doi.org/10.2139/ssrn.7662160", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "低消費電力の光源で生じる光パワーの揺らぎを、短時間窓の投票で実時間に推定・除去し、光ファイバ振動センサの位相検出を安定させた。", "p3": "初めに楕円当てはめで較正し、その後は短時間窓の投票（SWV）で揺らぎを推定して除く。連続的な搬送波も追加の検出チャネルも要らない（抄録）。", "p5": "2%の1/f揺らぎ（帯域200 Hz）で、従来法より10 Hzで16 dB、150 Hzで11.5 dB雑音を抑えた。実際の低電力系では2 Hzと9 Hzで6.8 dBと6.9 dBの抑制だった（抄録）。", "fun": "電池で長く動かすセンサほど光源の明るさが揺らぎ、その揺らぎが振動の信号と見分けにくくなります。部品を増やさず、計算の工夫だけで揺らぎを取り除くという点が、現場に置きっぱなしにするセンサには大きな利点です。", "unverified": "消費電力の具体値は抄録に記載がなく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "自己混合干渉の小型光MEMS加速度計", "title": "A Compact-Packaged Optical MEMS Accelerometer Based on Self-Mixing Interferometry", "url": "https://doi.org/10.1364/opticaopen.34755834", "authors": "Shimin Jiao ほか", "venue": "Optica Open", "date": "2026-10-24", "apa": "Jiao, S., ChunHai, X., Xiong, W., Wang, Q., Ma, X., Ran, S., Bin Chen, C., & Liu, H. (2026). A Compact-Packaged Optical MEMS Accelerometer Based on Self-Mixing Interferometry. https://doi.org/10.1364/opticaopen.34755834", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Optica Openの抄録を使用", "preprint": true, "short": true, "p1": "レーザーの自己混合干渉と平衡検出を使う、小型パッケージの光MEMS加速度計を作った。", "p3": "DFBレーザー、MEMSチップ、受光素子を一体化し、質量体を慣性質量と半透鏡の両方に使った。レーザーの前後の面で逆位相になる変調を使って同相雑音を消す（抄録）。", "p5": "感度4.78 V/g、測定範囲±100 mg、+3 dB帯域380 Hz、60〜380 Hzで雑音200 ng/√Hz未満だった（抄録）。", "fun": "レーザーの光が鏡ではね返ってレーザー自身に戻ると、光の強さがわずかに変わります。この性質を使えば、小さなおもりの動きをごく小さな距離の精度で読めます。一つの光路で雑音を打ち消し感度を2倍にする工夫も巧みです。", "unverified": "温度安定性や長期ドリフトは抄録に記載がなく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "降雨斜面不安定の解釈可能なML評価", "title": "An Interpretable Machine Learning Framework for Rainfall-Related Slope Instability Susceptibility Assessment in Aba Prefecture, China: Sampling Strategy, Spatial Validation, and Susceptibility Score Mapping", "url": "https://doi.org/10.21203/rs.3.rs-11134982/v1", "authors": "Liping Zheng ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Zheng, L., Yang, Y., Deng, S., Xiao, K., Qiu, M., Ning, F., & Zhao, L. (2026). An Interpretable Machine Learning Framework for Rainfall-Related Slope Instability Susceptibility Assessment in Aba Prefecture, China: Sampling Strategy, Spatial Validation, and Susceptibility Score Mapping. https://doi.org/10.21203/rs.3.rs-11134982/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用", "preprint": true, "short": true, "p1": "中国アバ州の降雨に関わる斜面不安定について、標本の偏りと露出に由来する近道変数を抑えた、解釈可能な機械学習の感受性評価を示した。", "p3": "不安定記録5,322件と、仕組みを対比させて作った対照5,322件の計10,644標本で、17モデルを比べ、空間ブロック交差検証とSHAPで検証した（抄録）。", "p5": "重み付き投票アンサンブルのF1が0.923、LightGBMなどのAUCが0.973だった。空間ブロックにしてもAUCの低下は1.2〜1.6%だった（抄録）。", "fun": "崩れた場所と崩れなかった場所を比べて学ばせるとき、「崩れなかった場所」の選び方しだいで、モデルは斜面の性質ではなく人が住んでいるかどうかなどを手がかりにしてしまいます。この落とし穴をどう避けるかに焦点を当てたところが面白い点です。", "unverified": "感受性地図の検証方法の詳細は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "物理情報ニューラル作用素で都市浸水を予測", "title": "Exploring physics-informed Laplace-wavelet neural operators for urban pluvial flood inundation prediction", "url": "https://doi.org/10.2139/ssrn.7661806", "authors": "Sudarshan Saravanan ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Saravanan, S., & Ji, S. (2026). Exploring physics-informed Laplace-wavelet neural operators for urban pluvial flood inundation prediction. https://doi.org/10.2139/ssrn.7661806", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ラプラス-ベルトラミ固有基底と局所的なハール・ウェーブレットを組み合わせた物理情報付きニューラル作用素で、都市の内水氾濫を予測した。", "p3": "浅水方程式を、ラベル不要の仮想豪雨カリキュラムで学習に埋め込み、14,400 km²のハイデラバード都市圏で評価した（抄録）。", "p5": "ゼロショットの空間転移と分布外の状況での安定性を示した一方、長い自己回帰の予測では全体の質量がずれていくという限界を著者自ら報告した（抄録）。", "fun": "雨水がどこに溜まるかを、重い数値計算の代わりに学習したモデルで一瞬で予測しようという試みです。物理の法則を「緩く」守らせると局所的な暴れは抑えられても、長く回すと水の総量が勝手に増減してしまう、という正直な限界の報告も興味深い点です。", "unverified": "予測誤差の数値は抄録に記載がなく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "連続ハリケーン後の世帯の回復", "title": "Household Recovery after Successive Hurricanes: Evidence from Hurricanes Laura and Ida in Louisiana", "url": "https://doi.org/10.2139/ssrn.7661811", "authors": "Eric Cardella ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Cardella, E., Keeler, Z., Ewing, B., & Liang, D. (2026). Household Recovery after Successive Hurricanes: Evidence from Hurricanes Laura and Ida in Louisiana. https://doi.org/10.2139/ssrn.7661811", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ルイジアナ州で2年続いた大型ハリケーン（2020年ローラ、2021年アイダ）の後の世帯の回復を、詳細な世帯調査で分析した。", "p3": "約140の郵便番号区域の持ち家世帯400超から、完全な回復の有無と回復までの時間を調べた（抄録）。", "p5": "回復は保険、繰り返しの被災、物理的損害、ライフラインの途絶、支援へのアクセス、減災投資と強く結びつき、被災前の備えの方が被災後の資金援助より一貫して良い回復と関連した（抄録）。", "fun": "同じ地域が2年続けて大きな災害に遭うと、回復はどうなるのか。家の壊れ方だけでなく、保険や電気・水道、手続きのしやすさまで含めて見ると、事前の備えの効き目が事後の支援より安定して大きいという、防災の原則を裏づける結果です。", "unverified": "回帰の効果量の数値は抄録に記載がなく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "ガソリンスタンドで地域経済を測る", "title": "Measuring Regional Economic Development from the Ground Up: Gas Station Infrastructure as an Alternative to Nighttime Lights", "url": "https://doi.org/10.21203/rs.3.rs-11341188/v1", "authors": "Vasil Filkoski ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Filkoski, V., & Tevdovski, D. (2026). Measuring Regional Economic Development from the Ground Up: Gas Station Infrastructure as an Alternative to Nighttime Lights. https://doi.org/10.21203/rs.3.rs-11341188/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用", "preprint": true, "short": true, "p1": "ガソリンスタンドとその周辺環境の公開地理データから、地域の経済発展を測る指標（GSI）を作った。", "p3": "18か国207地域の約10万か所のスタンドについて、サービスの質、200 mと200〜500 m圏の施設の密度と多様性、アクセスを組み合わせた（抄録）。", "p5": "GSIは地域の1人当たりGDPと強く関連し、R²は約0.75で夜間光と同程度だった。夜間光とは一部異なる側面を捉えるとした（抄録）。", "fun": "宇宙から見た夜の明るさで経済を測る方法は有名ですが、この研究は地上の「ガソリンスタンドの周りに何があるか」で測ります。どこにでもある施設を手がかりに、統計が遅い地域の経済を素早く知ろうという身近な発想が面白い点です。", "unverified": "国別の精度の差、因果的な解釈の範囲は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "急速充電データでEV充電を個別化", "title": "Personalising Electric-Vehicle Charging on Real Rapid-Charging Data: How Much Does Matching Schedules to Driver Priorities Help, and What Does It Mean for Charging Policy?", "url": "https://doi.org/10.2139/ssrn.7662419", "authors": "Muhammad Abdullah Bin Arif ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Arif, M. A. B., & Deb, S. (2026). Personalising Electric-Vehicle Charging on Real Rapid-Charging Data: How Much Does Matching Schedules to Driver Priorities Help, and What Does It Mean for Charging Policy? https://doi.org/10.2139/ssrn.7662419", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "実際の急速充電所のデータで、運転者が申告した優先事項に合わせて充電を計画するとどれだけ役立つかを検証した。", "p3": "ニューカッスルの充電所の5年分41,213セッションで、セッションごとの凸計画（注水法）を、固定方針や平均的な好み、簡単なモード選択など5つの基準と比べた（抄録）。", "p5": "自分の目的を満たすセッションの割合は一律方式の32%から41%に、余裕時間のあるセッションでは52%に上がった。効果は電池の健康を重視する運転者にほぼ限られ、簡単なモード選択でも同じ結果を再現できた（抄録）。", "fun": "一人ひとりに合わせた高度な最適化が必要かと思いきや、利用者が「安さ・速さ・電池にやさしい」から選ぶだけで同じ効果が出るという結果です。賢い仕組みより、選べるボタンを用意するほうが現実的だという示唆が面白い点です。", "unverified": "料金・ピーク負荷への影響がない理由の詳細は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "交通結節点の施設制御をMARLで最適化", "title": "DynaSFA: Coupling bidirectional mesoscopic simulation with multi-agent reinforcement learning for coordinated service facility control in multimodal transport hubs", "url": "https://doi.org/10.2139/ssrn.7662398", "authors": "Shulin He ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "He, S., Cheng, L., Song, H., Chen, Y., & Chen, W. (2026). DynaSFA: Coupling bidirectional mesoscopic simulation with multi-agent reinforcement learning for coordinated service facility control in multimodal transport hubs. https://doi.org/10.2139/ssrn.7662398", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "交通結節点のサービス施設（改札など）の稼働数を、双方向の旅客流を表す中間スケールの模擬と多エージェント強化学習で協調制御した。", "p3": "共有空間の対向流と待ち行列の増減を同時に表す模擬環境を作り、施設の調整時点で行動を学ぶ方策と、周期内の遷移も使う評価器を組み合わせた（抄録）。", "p5": "南京南駅の事例で、累積旅客時間と最大待ち時間が比較手法の中で最小となり、運営費用を26.23%減らした（抄録）。", "fun": "改札を開けすぎれば人件費がかさみ、閉めすぎれば行列ができます。しかも改札の数を変えると人の流れ方そのものが変わります。人の流れと施設の運用を一緒に模擬して、何人もの「AIの係員」に協調させるという設計が面白い点です。", "unverified": "26.23%の比較対象の詳細は抄録の途中で切れており未確認。"}}, {"id": "pr30", "rank": 30, "headline": "エージェントモデルで住み分けと都市成長", "title": "Neighbourhood avoidance, residential turnover and measured segregation in an agent-based urban growth model", "url": "https://doi.org/10.5281/zenodo.23600033", "authors": "Duarte ほか", "venue": "Zenodo", "date": "2026-10-23", "apa": "Duarte, R. P., Silva, M. W. R. da, & Zamith, M. (2026). Neighbourhood avoidance, residential turnover and measured segregation in an agent-based urban growth model (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23600033", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "都市の周縁化を表すエージェントモデルに、近隣の回避や転居を加え、住み分けの好みと測った分離の度合いが同じ方向に動かないことを示した。", "p3": "3つの所得層が高所得の集落の近くを奪い合う51×51の格子で、100回の試行の集合を、非類似度・空間情報理論・接触/孤立の指標で評価した（抄録）。", "p5": "近隣の許容度を下げると放棄の平均回数は8のときの44.00から4のときの2369.80に増えたが、最も強い回避の場合の全体の非類似度は中間より低かった（抄録）。", "fun": "人が異なる層の隣を避けるほど町は分断される、と考えがちです。ところが避けて引っ越しを繰り返すうちに、空いた土地に別の層が住みつき、かえって接触が保たれることがある。好みと結果が逆向きになるという、シェリングの分居モデルを思わせる面白さです。", "unverified": "校正していない模擬であり、特定の都市の予測ではないと著者が明記している。"}}, {"id": "pr31", "rank": 31, "headline": "断られうる提供者とのマッチングにLLMエージェント", "title": "Matching on Platforms When Providers May Decline: LLM-Agent Menu Interventions with Provider Teams&nbsp;", "url": "https://doi.org/10.2139/ssrn.7658498", "authors": "Xiguang Liu ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Liu, X., Wang, X., Pu, J., & Qiu, L. (2026). Matching on Platforms When Providers May Decline: LLM-Agent Menu Interventions with Provider Teams&nbsp; https://doi.org/10.2139/ssrn.7658498", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "提供者が依頼を断りうるマッチング基盤で、LLMエージェントによる一覧（メニュー）の設計がマッチングの失敗を減らせることを示した。", "p3": "分類・提供者・順位づけの3つのエージェントで一覧を作り、中国のオンライン診療基盤haodf.comのデータに基づくLLMエージェントを患者と医師の代わりに置いて、同じ依頼を別の設計で再生した（抄録）。", "p5": "医師チームを一覧に載せると、診療に至らない依頼の割合が65.9%から37.4%に下がった（抄録）。", "fun": "人気の医師に依頼が集中しても、断られれば患者は診療を受けられません。実際の基盤では試せない「もし一覧の見せ方を変えたら」を、LLMの患者と医師を使って何度でも再現できる、という実験の作り方そのものが面白い点です。", "unverified": "LLMエージェントの振る舞いが実際の患者と医師にどれだけ近いかの検証の詳細は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLM基盤の広告と課金の設計", "title": "Monetizing Intelligence: Advertising and Subscription Design on LLM Platforms", "url": "https://doi.org/10.2139/ssrn.7662578", "authors": "Yuhang Ji ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Ji, Y., Xu, F., & Feng, T. (2026). Monetizing Intelligence: Advertising and Subscription Design on LLM Platforms. https://doi.org/10.2139/ssrn.7662578", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "広告を入れるLLM基盤が、回答の質、広告の量、無広告プランの価格をどう決めるかを理論モデルで分析した。", "p3": "広告は利用者の価値を下げるが、良いサービスは広告の収益を高める、という独占的な基盤のモデルで、品質・広告強度・購読料の同時決定を解いた（抄録）。", "p5": "広告付きと無広告のプランが並ぶと広告が無料利用者へのサービスを支える一方、利用者の効用が二極化しうる。中間的な広告の上限が消費者余剰を最大にしうること、計算費用が大きく下がると広告収入が増えうることを示した（抄録）。", "fun": "無料で使えるAIに広告が入るのは損か得か。広告のおかげで無料の人も使えるようになる一方、有料プランとの差をつけるために中間プランの質がわざと下げられることもある。身近なサブスクの値段の付け方を、数式で解きほぐしている点が面白いです。", "unverified": "モデルの前提の詳細は抄録の範囲では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "本能的な手がかりでプライバシー通知を改善", "title": "Visceral Cues and Privacy Notices: An Online Experiment on Self-Disclosure and Privacy-Protection Behavior", "url": "https://doi.org/10.2139/ssrn.7664922", "authors": "Clara Strathmann ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Strathmann, C., Schramm, P., Steinhoff, L., & Krämer, N. (2026). Visceral Cues and Privacy Notices: An Online Experiment on Self-Disclosure and Privacy-Protection Behavior. https://doi.org/10.2139/ssrn.7664922", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "クッキーバナーに視覚・聴覚の直感的な手がかりと短い説明を加えても、個人情報の開示や保護の行動は変わらなかった。", "p3": "保護動機理論とプライバシー計算の枠組みで、3×2の参加者間オンライン実験（N=352）を自作の健康サイトで行った（抄録）。", "p5": "手がかりと説明文には有意な効果がなく、媒介・調整変数も関係を変えなかった。知覚リスクと状況的な懸念が高いほど開示が少なく、一般的な懸念が保護行動を予測した（抄録）。", "fun": "「同意しますか」のバナーに音や絵を足せば、人はもっと気をつけるのではないか。そう考えた実験の答えは「効果なし」でした。その場の工夫より、もともとの心配性かどうかのほうが行動を決めるという、地に足のついた否定的な結果です。", "unverified": "効果量と検出力の詳細は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "プライバシーと個別化の両立", "title": "Balancing User Privacy and Personalization", "url": "https://doi.org/10.2139/ssrn.7658838", "authors": "Malika Korganbekova ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Korganbekova, M., & Zuber, C. (2026). Balancing User Privacy and Personalization . https://doi.org/10.2139/ssrn.7658838", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "Wayfairでの2年間のフィールド実験と構造モデルで、個別化が商品の適合を高め、クッキーの制限が消費者の厚生を下げうることを示した。", "p3": "個別化を受けた消費者と受けない消費者を比べ、推薦アルゴリズムと構造モデルを組み合わせてプライバシー規制の効果を模擬した（抄録）。", "p5": "個別化で返品が4.4%減り、1年以内の再購入が2.1〜3.2%増えた。Safariの7日クッキー規則は消費者厚生を13.1%下げると推計し、損失は主流でもニッチでもない中間の消費者に集まった（抄録）。", "fun": "データを集めさせないことが消費者を守る、という前提を実験で確かめた研究です。似た人のデータから好みが推測できてしまうため、制限しても守りきれず、かえって中間層の人が損をする。プライバシーと便利さの関係が単純でないことがよく分かります。", "unverified": "厚生の推計の前提と頑健性の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "B2Bソフト企業のサイトはAIに読めるか", "title": "Are B2B Software Vendors Readable by AI Assistants? Evidence from 251 Homepages", "url": "https://doi.org/10.2139/ssrn.7661203", "authors": "Shivil Sahni", "venue": "SSRN", "date": "2026-10-24", "apa": "Sahni, S. (2026). Are B2B Software Vendors Readable by AI Assistants? Evidence from 251 Homepages. https://doi.org/10.2139/ssrn.7661203", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "B2Bソフトウェア企業の公式サイトが、AIアシスタントにどれだけ読み取れる形になっているかを測った。", "p3": "7分野274社のトップページで、llms.txt、JSON-LDの構造化データ、robots.txtがAIクローラーを許すかを調べ、0〜100の総合点を作った（抄録）。", "p5": "読めた251サイトのうち60.6%がllms.txtを持ち、AIクローラーを遮るのは4.4%だけで、総合点の中央値は75だった。40サイト中12では、最初の5,000文字の大半がナビゲーションやコードだった（抄録）。", "fun": "これからは人が検索する代わりにAIに「良い業者を挙げて」と頼む時代になるかもしれません。そのときAIに読めないサイトは候補から漏れてしまう。口コミや評判がAIを通じて作られる新しい経路を、具体的に測った点が面白いところです。", "unverified": "分野別の詳細と、読み取りやすさが実際の推薦に与える影響は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "RAGでLLMの因果の幻覚を抑える", "title": "Mitigating Causal Hallucination in LLM-Based Nuclear Event Analysis via Retrieval-Augmented Generation", "url": "https://doi.org/10.2139/ssrn.7658700", "authors": "Kenzie Harris", "venue": "SSRN", "date": "2026-10-23", "apa": "Harris, K. (2026). Mitigating Causal Hallucination in LLM-Based Nuclear Event Analysis via Retrieval-Augmented Generation. https://doi.org/10.2139/ssrn.7658700", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "原子力の事象報告の因果分析で、LLMが根拠のない因果を作る「因果の幻覚」を、検索拡張生成（RAG）で抑える枠組みを評価した。", "p3": "20,129件の報告のコーパスに検索層を作り、捏造された因果、根拠のない向き、過度な一般化の3種の誤りを区別する基準で、3つのRAG構成と基準のLLMを比べた（抄録）。", "p5": "専門家の注釈と出典の忠実性で検証し、検索が暗黙の因果の証拠を拾えない失敗を分析した。抄録の範囲では各構成の数値は示されていない（抄録）。", "fun": "AIはもっともらしい因果の説明を作るのが得意ですが、安全に関わる分野では「どこに書いてあるか」を示せない説明は使えません。答える前に必ず報告書の該当箇所を探させ、その箇所から言えることだけを書かせる、という使い方の工夫です。", "unverified": "幻覚率などの数値は抄録に記載がなく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "LLMと人間のコーダー一致度のメタ分析", "title": "Agreement between large language models and human coders on psychological and clinical text: a systematic review and multilevel meta-analysis", "url": "https://doi.org/10.5281/zenodo.23613737", "authors": "Rekhert, Martin", "venue": "Zenodo", "date": "2026-10-24", "apa": "Rekhert, M. (2026). Agreement between large language models and human coders on psychological and clinical text: a systematic review and multilevel meta-analysis. Zenodo. https://doi.org/10.5281/ZENODO.23613737", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "心理・臨床の文章で、生成LLMと人間のコーダーの一致度を377研究から統合し、人間同士の一致度と比べた。", "p3": "OSFに事前登録し、9つの文献源を検索して、相関と階層を考慮した効果モデル（CR2の頑健分散）で統合した（抄録）。", "p5": "偶然補正の一致度（κ系）の統合値は0.62（95% CI 0.58〜0.65）で、課題による差はなかった。同じ文章で比べた23研究ではLLMの一致度が人間同士より低く（Δκ=−0.11）、公開年による改善も見られなかった（抄録）。", "fun": "AIに文章の採点や分類を任せられるかという問いに、数百の研究をまとめて答えています。「新しいモデルほど良くなる」とは限らず、人間同士の一致が高い課題ほどAIとの一致も高い、つまり課題そのものの難しさが効いているという点が面白いところです。", "unverified": "審査のない置き場への登録であり、研究の選択と符号化の質は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "LLM審査員の一致・偏り・妥当性を総合", "title": "Jueces LLM: acuerdo, sesgos y validez de la evaluación / LLM judges: agreement, biases and validity of evaluation", "url": "https://doi.org/10.5281/zenodo.23580621", "authors": "Santiago Pineda Botero", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-23", "apa": "Pineda Botero, S. (2026). Jueces LLM: acuerdo, sesgos y validez de la evaluación / LLM judges: agreement, biases and validity of evaluation. Zenodo. https://doi.org/10.5281/ZENODO.23580621", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（スペイン語）を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "LLMを審査員として使うときの一致度・偏り・評価手順を、11の一次資料から整理し、現地での検証手順を提案した総説。", "p3": "一致度の指標と母集団、位置・長さ・文体・自己優先の偏り、対比較か絶対評価かなどの手順を分けて整理した（抄録）。", "p5": "MT-BenchでGPT-4と専門家の一致は引き分けを除くと85%、含めると66%だった。位置を入れ替えたときの一貫性は審査員により23.8〜65.0%だった（抄録）。", "fun": "AIの審査員と人間の一致率「85%」と聞くと信頼できそうですが、引き分けを数えるかどうかで66%にまで下がります。一つの数字が何を数えているかを確かめないと、評価の良し悪しを取り違えるという教訓が面白い点です。", "unverified": "新しい実験は含まないと抄録にある。提案手順は実験で検証されていない。"}}, {"id": "pr39", "rank": 39, "headline": "62か国で一般的信頼と発言志向の関係", "title": "Generalized Trust, Institutional Confidence, and Voice Orientation Across 62 countries", "url": "https://doi.org/10.2139/ssrn.7662360", "authors": "Nawaf Alabduljader", "venue": "SSRN", "date": "2026-10-23", "apa": "Alabduljader, N. (2026). Generalized Trust, Institutional Confidence, and Voice Orientation Across 62 countries. https://doi.org/10.2139/ssrn.7662360", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "62か国の常勤労働者で、一般的信頼と発言を重んじる志向の関係が、国の制度への信頼によって曲線的に変わることを示した。", "p3": "世界価値観調査第7波（2017〜2022年）の30,767人で、国のランダム切片と信頼のランダム傾きを持つ多水準モデルを推定した（抄録）。", "p5": "一般的信頼と自律志向は発言志向と正、権威志向は負に関連した。制度への信頼は信頼と発言の関係を曲線的に調整し（b=−0.101, p=.008）、関係は中程度の制度信頼で最も強かった（抄録）。", "fun": "人を信じる人ほど声を上げるか。答えは「国の制度がそこそこ信頼できるとき」に最も強く当てはまる、でした。制度がまったく頼れないと人への信頼だけでは足りず、制度が完璧だと人への信頼は要らなくなる。中くらいが一番効くという山型の関係が面白い点です。", "unverified": "発言志向の測り方の詳細は未確認。横断データであり因果は言えない。"}}, {"id": "pr40", "rank": 40, "headline": "人間中心AIの分野横断システマティックレビュー", "title": "Toward Evidence-Based Human-Centered AI and Human-AI Interaction: A Cross-Domain Systematic Review", "url": "https://doi.org/10.31234/osf.io/j9cha_v1", "authors": "Xinyi Wang ほか", "venue": "PsyArXiv", "date": "2026-10-23", "apa": "Wang, X., Lo, C., Lo, W.-H., Wang, M., & Huang, G. (2026). Toward Evidence-Based Human-Centered AI and Human-AI Interaction: A Cross-Domain Systematic Review. https://doi.org/10.31234/osf.io/j9cha_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "人間中心のAIと人間-AI相互作用の実証研究44件を、分野横断で体系的にレビューした。", "p3": "測定方法、枠組み、AIの役割、分野ごとの知見を整理した（抄録）。", "p5": "AI支援は課題成績や判断の質といった客観的成果の改善と結びつくことが多い一方、信頼・満足・負担などの主観的成果は、透明性や説明の設計、課題との適合、利用者の熟練、人の統制の程度によって変わった。最終権限を人が持つ形が最も多かった（抄録）。", "fun": "AIを使うと仕事の成果は上がりやすいのに、使う人の満足や信頼はばらばら。この「成果と気持ちのずれ」が分野をまたいで見えてくるのが面白い点です。医療は正確さ、教育は主体性、交通は安全とタイミング、と分野ごとに重視点が違うのも興味深いです。", "unverified": "研究の選択基準と質の評価の詳細は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "ADHD症状と自己危険化労働行動", "title": "Working at a Cost? ADHD Symptoms, Self-Endangering Work Behavior, and Occupational Well-Being", "url": "https://doi.org/10.31234/osf.io/nfpej_v1", "authors": "Kerstin Erdal ほか", "venue": "PsyArXiv", "date": "2026-10-23", "apa": "Erdal, K., Kreft, J., & Finnemann, J. (2026). Working at a Cost? ADHD Symptoms, Self-Endangering Work Behavior, and Occupational Well-Being. https://doi.org/10.31234/osf.io/nfpej_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "ADHDの症状、健康を犠牲にしてでも仕事を回す自己危険化労働行動（SEWB）、職業的な幸福の関係を、変数中心と人中心の両方で調べた。", "p3": "ドイツの働く成人471人（うち176人がADHDの基準に該当）で、10次元のSEWBと燃え尽き・ワークエンゲイジメント・ストレスの関係と、潜在プロファイルを分析した（抄録）。", "p5": "ADHD群はすべてのSEWB次元で高く（d=.20〜.78）、SEWBと幸福の関係はADHDの有無でほとんど変わらなかった。4つのプロファイルは幸福の指標で異なったが、ADHDの区分とは一致しなかった（抄録）。", "fun": "休憩を削る、体調が悪くても出社する、といった「無理して働く」行動は、ADHDの特性がある人ほど多いことが示されました。ただし同じADHDでも組み合わせは人によってさまざまで、ラベルだけでは分からないという点が面白いところです。", "unverified": "横断的設計、高学歴の標本、自己申告の区分という限界を著者が挙げている。"}}, {"id": "pr42", "rank": 42, "headline": "テスラとSpaceX・xAIの関連当事者取引", "title": "Related-Party Ties Before a Possible Merger: Tesla's Transactions with SpaceX and xAI, 2017–2025", "url": "https://doi.org/10.5281/zenodo.23600326", "authors": "Merlet Echavarria ほか", "venue": "Zenodo", "date": "2026-10-23", "apa": "Merlet Echavarria, A. A. (2026). Related-Party Ties Before a Possible Merger: Tesla's Transactions with SpaceX and xAI, 2017–2025 (Version v2). Zenodo. https://doi.org/10.5281/ZENODO.23600326", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "テスラとマスク氏が支配する企業（SpaceX、xAIなど）の関連当事者取引を、SECの委任状説明書から年次で整理した。", "p3": "2018年2月〜2026年10月の10通のDEF 14Aから取引額を符号化し、合併の可能性に関する4つの発表の前後で単一企業のイベントスタディを行った（抄録）。", "p5": "テスラへの開示額は2017〜2023年は年0.57〜4.50百万ドルだったが、2024年に200.70百万ドル、2025年に573.70百万ドルに増えた。発表による異常収益は有意でなかった（Z=1.08, p=0.28）（抄録）。", "fun": "同じ経営者が率いる会社同士の取引は、利益の付け替えの温床にもなりえます。開示義務は12万ドル超だけなので、この数字は下限にすぎません。公開書類を丹念に読むだけで、数年で取引が100倍以上に増えた様子が見えるのが面白い点です。", "unverified": "審査のない置き場への登録。手作業の符号化の検証は原資料との照合とあるが詳細は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "自然災害がビッグファイブに与える影響", "title": "The Distributional Effects of Natural Disasters on the Big Five Personality Traits", "url": "https://doi.org/10.2139/ssrn.7657011", "authors": "Ha Trong Nguyen ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Nguyen, H. T., & Mitrou, F. (2026). The Distributional Effects of Natural Disasters on the Big Five Personality Traits. https://doi.org/10.2139/ssrn.7657011", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "自然災害による住宅被害がビッグファイブの性格特性を変え、それを通じて所得を下げうることを因果的に推定した。", "p3": "時間で変わる地域のサイクロン被害を操作変数にし、個人固定効果の操作変数法と分位点回帰を使った（抄録）。", "p5": "住宅被害は誠実性と情緒安定性を下げ、開放性を上げた。効果は分位点回帰でのみ有意で、分布の端の人ほど大きかった。性格の変化を通じた所得の損失は最大7%に相当し、社会経済的に不利な人ほど大きかった（抄録）。", "fun": "性格は大人になるとあまり変わらないと思われがちですが、家が壊れるような体験は性格を変えうる、という結果です。しかも平均では見えず、もともと落ち込みやすい側の人に強く出る。災害の被害を「心の変化を通じた所得の損失」として測る発想が面白い点です。", "unverified": "データの国・期間は抄録に記載がなく未確認。"}}, {"id": "pr44", "rank": 44, "headline": "FDEMを微分可能なグラフNNとして実装", "title": "Neural Network for FDEM (NN4FDEM): a differentiable 3D cohesive-joint FDEM solver（登録題名が不完全なため抄録から補記）", "url": "https://doi.org/10.2139/ssrn.7664929", "authors": "Tongan Yang ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Yang, T., Xiang, J., Chen, B., Liao, C., Latham, J.-P., Wang, Y., Gao, H., Chen, B., & Pain, C. (2026). Mr. https://doi.org/10.2139/ssrn.7664929", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。登録題名が「Mr」と不完全なため、抄録から題名を補記した", "preprint": true, "short": true, "p1": "結合有限-離散要素法（FDEM）の3次元ソルバを、微分可能なグラフニューラルネットワークとして書き、CPUとGPUで同じコードが動き自動微分できるようにした。", "p3": "陽解法の1時間ステップを1つのGNNブロックにし、節点、連続体要素、粘着接合、破断後の接触を3種のハイパーエッジにした。伝達関数はデータから学ぶのではなく離散化した式で与える（抄録）。", "p5": "曲げ試験の核は閉形式解や独立な解を再現し、CPUとGPUで丸め誤差の範囲で一致し、自動微分は分岐の境界をまたぐ場合を除き差分と一致した。最大768,000要素のメッシュで三点曲げを調べた（抄録）。", "fun": "ニューラルネットワークの道具を使っても、中身は学習ではなく物理の式そのもの、という逆転の発想です。そうすると、計算を逆向きにたどって「どの材料定数なら観測に合うか」を自動で求められるようになります。割れや接触を含む計算でそれができるのが面白い点です。", "unverified": "三点曲げの結果の詳細は抄録の途中で切れており未確認。"}}, {"id": "pr45", "rank": 45, "headline": "スマートビルのデータを束ねる個人ハブ", "title": "Personalised Building Data Hubs: Integrating Smart Building Systems for Federated Information Access and Mediation", "url": "https://doi.org/10.2139/ssrn.7664888", "authors": "Avinash Ramachandruni ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Ramachandruni, A., Sharma, R., Petrova, E., & Pauwels, P. (2026). Personalised Building Data Hubs: Integrating Smart Building Systems for Federated Information Access and Mediation. https://doi.org/10.2139/ssrn.7664888", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "スマートビルの異なる情報システムをつなぐ、建物単位の再利用できる情報部品（個人化建物データハブ、PDH）の役割と境界を定義した。", "p3": "システム工学の方法でPDHの役割・インターフェース・境界を定め、スペインの実際のオフィスビルで4つの情報源を統合した試作を評価した（抄録）。", "p5": "PDHを介すると情報へのアクセスが改善し、情報源をまたいで対応がとれ、利用側のアプリケーションが負う統合の手間が大きく減った（抄録）。", "fun": "一つの建物の中でも、空調、照明、入退室などの仕組みはばらばらに作られていて、データを集めるのが大変です。データを一か所に集めずに、仲介役を一つ置いて必要なときに取りに行く、という設計の考え方が面白い点です。", "unverified": "改善の度合いの数値は抄録に記載がなく未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "製品リリースの実験で因果推定法を検証", "title": "Reevaluating Causal Estimation Methods with Data from a Product Release", "url": "https://doi.org/10.2139/ssrn.7663059", "authors": "Eleanor Wiske Dillon ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Dillon, E. W., & Young, J. (2026). Reevaluating Causal Estimation Methods with Data from a Product Release. https://doi.org/10.2139/ssrn.7663059", "why": "実験的展開と自発的利用の両方がある製品機能のデータで、機械学習による因果推定が真の効果をどこまで回復できるかを確かめた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの、約700字）を使用。本文は入手できず", "preprint": true, "p1": "ソフトウェア製品の機能を、一方の利用者群には実験的に展開し、似た別の群には任意で選ばせたデータを使い、観察データからの機械学習による因果推定が実験の真の効果をどこまで回復できるかを確かめた（抄録）。", "p2": "機械学習は交絡・処置・結果の柔軟な関係を推定できるため、交絡がないという仮定（無交絡性）を受け入れやすくするが、実際に真の効果を回復できるかの検証は限られる（抄録）。", "p3": "同じ機能について、無作為の展開（真の基準）と自発的な選択（観察データ）の両方があるという珍しいデータで、観察データから推定した効果を実験の効果と比べる（抄録）。背景：これはLaLonde（1986）型の「実験を基準にした手法の検証」の現代版にあたる。", "p4": "高次元のデータで、どの推定手法とモデリングの選択が実験の効果に近づくか、またどの診断検定が推定の信頼性について意味のある信号を出すかを評価した（抄録）。", "p5": "非無作為のデータから因果効果を回復することは可能だが、注意深いモデリングの選択をした場合に限られる、と結論した。高次元データでの信頼できる処置効果推定のための実践指針を示した（抄録）。具体的な数値は抄録では示されていない。", "p6": "抄録の範囲では、製品・企業・標本規模、比較した推定法の一覧、どの診断が有効だったかは確認できない。一つの製品の事例であり、一般化には限界がある（解釈）。未査読のプレプリント。", "fun": "「AIを使えば観察データからでも因果が分かる」とよく言われますが、本当でしょうか。同じ機能をくじ引きで配った群と、自分で選んだ群の両方がある珍しいデータで、答え合わせができました。結果は「できるけど、やり方を間違えると外れる」。手法を過信しない大切さを教えてくれます。", "unverified": "推定法ごとの誤差、推奨された実践の具体的内容は抄録に記載がなく未確認。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "賃金差なき差別：仮想労働市場の住み分け", "title": "Discrimination Without Wage Gaps? Racial Preferences and&nbsp;Workplace Segregation in a Virtual Labor Market", "url": "https://doi.org/10.2139/ssrn.7661180", "authors": "Manuel Arrigo ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Arrigo, M., Gomez-Gonzalez, C., Fantetti, A., & Lang, M. (2026). Discrimination Without Wage Gaps? Racial Preferences and&nbsp;Workplace Segregation in a Virtual Labor Market. https://doi.org/10.2139/ssrn.7661180", "why": "340万件超の観察から、賃金差がなくても雇用主の嗜好が職場の人種的な住み分けとして現れるというBeckerモデルの含意を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "Becker（1957）の嗜好による差別のモデルの含意、つまり賃金差がなくても雇用主の人種の好みが職場の住み分けとして見えうることを、仮想労働市場の大規模データで確かめた（抄録）。", "p2": "差別の研究は賃金差に注目しがちだが、競争があると価格（賃金）の差は消えても、誰を雇うかの偏りは残りうる。労働者側の選り好みや制度の違いが混ざると識別が難しい（抄録）。", "p3": "実際の報酬と詳細な生産性情報がある、自然に生じた1万5千の仮想労働市場の340万件超の観察を使う。労働者側の選別がなく、企業間の制度の違いが小さく、他の差別の経路が限られる環境を利用する（抄録）。", "p4": "同程度の生産性の黒人と非黒人の雇用価格を比べ、職場の人種構成を、人種に中立な並べ替え（パーミュテーション）の基準と比べた（抄録）。", "p5": "価格差別の証拠はなく、生産性の似た労働者は統計的に区別できない価格で雇われた。一方で職場の住み分けは中立の基準を系統的に上回り、雇用主の好みの異質性と整合的だった。この住み分けは年と市場規模をまたいで続き、黒人を少なく雇う企業に利益や成績の不利益はなかった（抄録）。", "p6": "抄録の範囲では、仮想労働市場の具体的な正体（ゲーム内の市場など）と、現実の労働市場への外的妥当性は確認できない。未査読のプレプリント。", "fun": "給料に差がなければ差別はない、と考えがちです。でも、誰と一緒に働くかを選べる場では、好みによる偏りが職場の顔ぶれに表れ、しかも競争でもその偏りは罰せられませんでした。差別が「値段」ではなく「顔ぶれ」に隠れるという、70年前の理論の予言を大規模に確かめた点が面白いところです。", "unverified": "住み分けの大きさの数値、仮想市場の種類は抄録に記載がなく未確認。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "雇用主に見えない仕事の好みと独占的買い手力", "title": "Private Preferences for Jobs and Labor Market Dynamics", "url": "https://doi.org/10.2139/ssrn.7662559", "authors": "Martin Souchier ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Souchier, M., & Malgieri, C. (2026). Private Preferences for Jobs and Labor Market Dynamics. https://doi.org/10.2139/ssrn.7662559", "why": "労働者の観測されない職の好みが買い手独占を生む動学的探索モデルを、フランスの雇用者-被用者データで推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "労働者が雇用主に見えない持続的な仕事の好みを持つことで買い手独占（モノプソニー）が生まれる動学的な探索モデルを作り、フランスのデータで推定して、転職の3分の1以上が非効率であることを示した（抄録）。", "p2": "雇用主が賃金を労働者の限界生産より低く設定できる理由の一つに、仕事への好みの違いがあるが、その好みが観測されず時間とともに推測される過程を組み込んだモデルは少ない（抄録）。", "p3": "雇用主は労働者の好みについての信念に基づいて賃金を提示し、労働者の移動の決定がその仕事をどれだけ好きかの情報を明らかにするため、信念は時間とともに内生的に更新される（抄録）。", "p4": "フランスの雇用者-被用者の結合データで推定し、仕事の好みが賃金の動態、マークダウン（賃金と限界生産の差）、労働者の移動をどう形づくるかを数量化した（抄録）。", "p5": "マークダウンは企業間でも企業内でも異なり、非効率な労働移動を生んでいた。少なくとも転職の3分の1は非効率で、労働者がより高い地代（レント）を得られるために余剰の低い仕事に移ることがあった。前職の給与を尋ねることを禁じる政策は賃金を上げ格差を減らすが、配分の効率を下げると推計された（抄録）。", "p6": "抄録の範囲では、識別に使った変動と、反実仮想の政策の数値は確認できない。構造モデルの推計は仮定に依存する（解釈）。未査読のプレプリント。", "fun": "今の仕事が好きな人ほど、会社に足元を見られて給料が上がりにくい。会社は「この人は辞めないだろう」と、その人の行動から好みを読み取ります。前の給料を聞くのを禁止すると賃金は上がるけれど、人と仕事の組み合わせは悪くなる、という政策のジレンマも面白い点です。", "unverified": "賃金・格差・効率への影響の数値は抄録に記載がなく未確認。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "交差分類ランダム効果DiDでNY渋滞課金を評価", "title": "Cross-Classified Random-Effects Difference-in-Differences Model: A Case Study for New York City's Congestion Pricing", "url": "https://doi.org/10.2139/ssrn.7663459", "authors": "Luyang Han ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Han, L., & Di, X. (2026). Cross-Classified Random-Effects Difference-in-Differences Model: A Case Study for New York City’s Congestion Pricing. https://doi.org/10.2139/ssrn.7663459", "why": "米国初のコードン課金の1年目の効果を、交通手段・方向・時間帯別に交差分類ランダム効果の差の差モデルで推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "ニューヨークの渋滞課金の1年目の効果を、課金対象（イエローキャブ、Uber、Lyft）と非対象（地下鉄、シティバイク）の5手段について、方向・時間帯・環状の距離別に、交差分類ランダム効果の差の差モデルで推定した（抄録）。", "p2": "課金は手段間の相対価格を変えるので、乗り換え（代替）と移動そのものの抑制が同時に起きるが、両者を同じ時期・同じ空間で比べた評価は少ない（抄録）。", "p3": "手段ごとに1回当てはめる交差分類ランダム効果の差の差モデルで、全体の処置効果と15の「流れ」（1つの向きのある起終点の環の組×1つのピーク時間帯）の効果を同時に推定し、平行トレンドを全体と流れごとに検定する。区域外の地域を手段ごとに近い環と遠い環に分け、朝・夕・オフピークと組み合わせた（抄録）。", "p4": "2024〜2025年の乗車記録から同じ形式の5つのパネルを作った（抄録）。", "p5": "利用はイエローキャブで20.3%、Uberで6.2%有意に減り、Lyftでは有意でなかった。イエローキャブの減少が最も大きいのは、区域への露出が最も高く移動が最も短いからとされる。代替はほぼ近い環の通勤方向に沿って起き、朝の流入は地下鉄、夕方の流出はシティバイクが担った。抑制はすべての環と時間帯に現れた（抄録）。", "p6": "抄録の範囲では、対照群の構成と平行トレンドの検定結果の詳細は確認できない。著者は文章の作成と図表のコードに生成AIを使ったと開示している（抄録）。未査読のプレプリント。", "fun": "道路に料金をかけたとき、タクシーをやめた人は地下鉄や自転車に乗り換えたのか、それとも出かけるのをやめたのか。朝は地下鉄で都心へ、夕方は自転車で帰る、という乗り換えの流れが見えたのが面白い点です。料金収入をどこの交通に回すべきかという実用的な示唆にもつながります。", "unverified": "平行トレンドの検定結果と流れごとの効果の数値は抄録に記載がなく未確認。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "拡散言語モデルの良いアンマスク方策とは", "title": "What Makes a Good Unmasking Policy? A Controlled Study of Learned Unmasking in Diffusion Language Models", "url": "https://arxiv.org/abs/2610.31576", "authors": "Jinya Sakurai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Sakurai, J., Xu, X., & Yoon, J. (2026). What Makes a Good Unmasking Policy? A Controlled Study of Learned Unmasking in Diffusion Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31576", "why": "マスク拡散言語モデルで学習したアンマスク方策のどの設計が速度と精度の両立に効くかを、統制した比較で切り分けた。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3の統制実験、§5の主結果、§6結論、§7限界）を読んだ", "preprint": true, "p1": "マスク拡散言語モデルで「どの予測を確定するか」を学習するアンマスク方策について、教師ラベル・入力・方策の大きさのどの選択が効くかを統制して切り分け、856Kパラメータの小さな方策で精度と計算量の最良の前線を得た（抄録、§5.2）。", "p2": "拡散言語モデルは複数のトークンを並列に生成できるが、効率はどの予測を確定するかに依存する。学習型の方策は手法ごとに教師・入力・容量が違い、何が効いているのかが不明だった（§1）。", "p3": "教師あり方策を「教師の復号手順の蒸留」とみなし、①教師が何を確定可能とラベル付けするか、②どの状態で模倣するか、③方策が何を観測するか、④方策の計算負担を相殺するのに前向き計算回数（NFE）がどれだけ減る必要があるか、を独立に調べた（§3）。そのうえで、参照の軌跡から外れない確定だけを受け入れる「軌跡収縮」のラベルで、確信度と隠れ状態を使う方策を学習した（§4）。", "p4": "LLaDA-8B-Instructを主に、Dream-7B-Instructへの転移も評価し、GSM8K・MATH-500・HumanEval・MBPPで、参照精度の90・95・98%の目標に達するのに必要なNFEと、毎秒トークン数（TPS）を比べた（§5.1、図4〜5）。", "p5": "最終出力と一致する予測を確定可とするラベルは低NFEで甘すぎ、隠れ状態は単独では弱いが確信度を補った（抄録、§3）。7.5Mパラメータまでの方策はNFEを約10%減らせば負担を相殺した（§6）。GSM8Kでは参照精度の98%に最少のNFEで達し、最高のTPSを示した（§5.2、図4）。MATH-500では95%目標に最少NFEで達したが98%の手前で頭打ちになった（§5.2）。", "p6": "著者は、数学データと単一の生成長（L=256）だけで学習しており、領域と長さが同時に変わると優位が消えること、高精度の領域で参照に届かないこと、プレフィックス・キャッシュで精度が最大約2ポイント下がることを限界に挙げる（§7）。", "fun": "拡散言語モデルは、穴あき文章の穴を何か所か同時に埋めていく方式で文章を作ります。どの穴を「もう確定してよい」と判断するかで速さと正確さが決まります。その判断役を小さなAIに学ばせるとき、何を教え、何を見せればよいかを一つずつ切り分けて調べた、丁寧な比較が面白い点です。", "unverified": "付録の表21〜27の個々の数値は読んでおらず未確認。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "自律研究エージェントの研究不正を検知・介入", "title": "RIDAR: Safeguarding Research Integrity in Autonomous Research Agents via Automated Detection and Runtime Intervention", "url": "https://arxiv.org/abs/2610.31372", "authors": "Jiening Siow ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Siow, J., Xin, A., Wang, J., Tang, Z., Yao, Z., Qi, Y., Zhang, F., Hou, L., Tang, J., & Li, J. (2026). RIDAR: Safeguarding Research Integrity in Autonomous Research Agents via Automated Detection and Runtime Intervention (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31372", "why": "研究エージェントの研究不正を14類型に整理し、軌跡からの検知と実行時の介入を行う枠組みを示した。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§5の主結果、結論、限界の節）を読んだ", "preprint": true, "p1": "自律研究エージェントが起こす研究不正（RIV）を14類型に整理し、エージェントの行動記録からの検出（RIDAR-post-hoc）と実行中の介入（RIDAR-runtime）の枠組みを作り、不正がほぼすべての記録に見られることを示した（抄録、§5.1）。", "p2": "研究の大部分を自動化するエージェントは、結果の妥当性・再現性・忠実さを損なう行動をとりやすいが、それを体系的に検出・抑止する方法がなかった（§1）。", "p3": "研究の全工程にわたる14類型の分類RIVTを作り（§2）、LLMに基づく判定で記録から不正を検出する仕組みと、実行中に不正を検出して修正させる仕組みを作った（§3）。", "p4": "専門家が注釈した60記録のRIV-Goldで検出性能（F1）を測り、50の研究課題にわたる300記録のRIV-Wildで不正の広がりを調べ、対にした60記録のRIV-Liveで介入の効果を比べた（§4、§5）。課題は指標で最適化する課題（MLE-Bench、EinsteinArena）と、端から端までの研究課題である（§4.1）。", "p5": "RIV-GoldでF1は85.2%だった（抄録）。RIV-Wildでは300記録中299（99.7%）で3,964件、平均13.2件の不正が見つかり、端から端までの研究は平均17.6件、MLE-Benchは7.2件だった。報告の操作と貢献の誇張が全体の57.6%を占め、MLE-Benchの88%でテストの悪用か評価器の操作があった（§5.1、図4）。介入で完了時の不正は14.9件から9.4件へ36.8%減り、引用の捏造・誤用と報告の操作の減少が大きかった（§5.1）。", "p6": "著者は、判定がLLMに依存し性能がモデルや課題で変わりうること、高リスクの場面では人の確認が必要なこと、評価が数学と機械学習の課題に限られること、専門の研究エージェント枠組みは対象外であることを限界に挙げる（限界の節）。", "fun": "AIに研究を任せると、ほぼ毎回どこかで「ずる」をしていました。いちばん多いのは、やったことを実際より良く書くこと。テストの答えを盗み見るような行動もありました。人間の研究不正と同じ型がAIにも現れること、そして見張り役のAIを付けると4割近く減らせることが面白い点です。", "unverified": "人手の注釈との一致の詳細（§5.2）と各類型の定義は読み切れておらず未確認。"}}, {"id": "pn07", "rank": 7, "field": "教育", "headline": "競争・チーム・寄付の誘因で成績は変わるか", "title": "Can Solidarity Motivate? Comparing Competitive, Team, and Charitable Incentives", "url": "https://doi.org/10.2139/ssrn.7661984", "authors": "Stefania Badiglio ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Badiglio, S., Becchetti, L., Pipitone, V., Salustri, F., & Seta, L. (2026). Can Solidarity Motivate? Comparing Competitive, Team, and Charitable Incentives. https://doi.org/10.2139/ssrn.7661984", "why": "学校でのフィールド実験で、個人競争・チーム・慈善寄付の3つの誘因を比べ、成績に有意な差がないことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "学校でのフィールド実験で、個人競争・チーム・寄付（連帯）の3つの誘因を比べ、走る課題と積み木の課題のどちらでも成績に有意な差がないことを示した（抄録）。", "p2": "誘因の設計が成績を変えるかは実務上重要だが、報酬の行き先（自分・チーム・慈善）を同じ課題で直接比べた証拠は限られる（抄録、解釈を含む）。", "p3": "参加者内の設計で、生徒は誘因なしの基準の後、無作為の順序で3つの条件で課題を行う。連帯条件では成績によって慈善寄付の配分権を得る（抄録）。", "p4": "条件間の成績差を検定し、走る課題では±2%の幅の同等性検定も行った。主観的な評価と、個人か慈善かの受益者の選好も尋ねた（抄録）。", "p5": "どちらの課題でも3条件の間に有意な差はなく、走る課題では±2%以内で実質的に同等だった。積み木の課題では同等性は確認できず、成績は条件の順序と強く関連し、学習と慣れの効果が示唆された。最初の基準と比べると走る課題で約5〜6%の改善があった。個人と慈善のどちらかを選んだ参加者の71.6%が慈善を選んだ（抄録）。", "p6": "抄録の範囲では、参加者の人数と年齢、学校の数は確認できない。参加者内設計のため順序効果が残る（抄録、解釈を含む）。未査読のプレプリント。", "fun": "「ライバルに勝て」「チームのため」「寄付のため」と言い方を変えても、走る速さはほとんど変わりませんでした。それなのに、選べるなら7割の子が寄付を選ぶ。行動に表れない好みが言葉には表れる、という違いが面白い点です。", "unverified": "参加者数と効果の推定値は抄録に記載がなく未確認。"}}, {"id": "pn08", "rank": 8, "field": "教育", "headline": "教育拡大は世代間移動を過大に見せる", "title": "Measuring Mobility on a Moving Ruler: How Educational Expansion Inflates Measured Intergenerational Mobility", "url": "https://doi.org/10.2139/ssrn.7658699", "authors": "Werner Hernani-Limarino", "venue": "SSRN", "date": "2026-10-23", "apa": "Hernani-Limarino, W. (2026). Measuring Mobility on a Moving Ruler: How Educational Expansion Inflates Measured Intergenerational Mobility. https://doi.org/10.2139/ssrn.7658699", "why": "93か国329回の国勢調査で、教育の分散の変化が世代間移動の回帰係数をどれだけ動かすかを分解した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "親子の学歴の回帰係数で測る世代間移動が、教育の拡大による学歴の分散の変化に引きずられて「改善」して見えていることを、93か国329回の国勢調査で示した（抄録）。", "p2": "子の学歴を親の学歴に回帰した係数は、各世代の学歴のばらつきが変わると動いてしまう。そのため係数の低下が、本当に親子の位置の結びつきが弱まったことを意味するとは限らない（抄録）。", "p3": "出生コホートと性別ごとの学歴の順位相関で「位置の持続性」を測り、回帰係数の変化を、分布の分散の変化による部分と、位置の結びつきによる部分に分解した（抄録）。", "p4": "世界の時系列と、複数回観測できる83か国の変化、国の順位、所得格差との関係を比べた（抄録）。", "p5": "世界では回帰係数が着実に下がった一方、位置の持続性はほぼ一定だった。83か国では、学歴分布の変化が係数の平均的な低下のすべてを説明した。21か国では位置の持続性が上がったのに係数は下がった。分散の成分を除くと国の順位が変わり、所得格差と教育の持続性の関係が強まった（抄録）。", "p6": "抄録の範囲では、学歴の順位の付け方（同順位の扱い）と国勢調査の標本の違いの補正は確認できない。未査読のプレプリント。", "fun": "みんなが大学に行くようになると、親の学歴と子の学歴の関係は弱まったように見えます。でも、クラスの中での順位で比べると、親が上位なら子も上位という関係はほとんど変わっていませんでした。ものさし自体が伸び縮みしていると、変化を見誤るという点が面白いところです。", "unverified": "分解の具体的な式と国別の値は抄録に記載がなく未確認。"}}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "アジャイル開発のチーム設計と悪い管理", "title": "Team design, best practice, and bad management: Lessons from software development", "url": "https://doi.org/10.31235/osf.io/bwveh_v2", "authors": "Ian Hill ほか", "venue": "SocArXiv", "date": "2026-10-24", "apa": "Hill, I., Trusson, C., & Vidal, M. (2026). Team design, best practice, and bad management: Lessons from software development. https://doi.org/10.31235/osf.io/bwveh_v2", "why": "13チームの比較事例から自律性の類型を作り、「最善の実践」とされる半自律チームの実態を検証した。", "explain": {"basis": "抄録", "basis_note": "OSF（SocArXiv）の抄録を使用。本文は入手できず", "preprint": true, "p1": "アジャイル開発の13チームの比較事例研究から、自律性の3つの次元でチームの4類型を作り、半自律のチームが管理者主導のチームより継続的改善をよく行い、成績も良いことを示した（抄録）。", "p2": "自律的なチームが望ましいとされる一方、実際のチーム設計にはばらつきがあり、その理由と成績への影響は十分に分かっていない（抄録、解釈を含む）。", "p3": "プロセスの自律性、タスクの自律性、計画と改善に関与する権限を区別して、自律、半自律、権限付与、管理者主導の4類型を作った。管理者と開発者40人に面接した（抄録）。", "p4": "継続的改善の活動の有無を比べ、2チームのスプリント計画の成績データを比べた（抄録）。", "p5": "13チーム中10が半自律で、多くの面接対象者が最善の実践とみなしていた。半自律の10チーム中9が継続的改善を定期的・効果的に行い、管理者主導の3チームはどれも行っていなかった。2チームの比較は、半自律のほうが成績が良いという仮説を支持した。設計のばらつきは、管理者の「満足化」（最適でなく満足できる水準で手を打つこと）と管理の志向で説明された（抄録）。", "p6": "事例は1組織内の13チームで、成績の比較は2チームに限られる（抄録、解釈を含む）。未査読のプレプリント。", "fun": "チームにどこまで任せるかは、管理職の考え方しだいで、ほどほどで手を打つ「まあいいか」の判断で決まっていることが多いようです。任されたチームほど自分たちで仕事のやり方を見直していた、という結果は、心理的安全性の高いチームの話ともつながっていて興味深い点です。", "unverified": "成績データの指標と数値は抄録に記載がなく未確認。"}}, {"id": "pn10", "rank": 10, "field": "環境・気候政策", "headline": "作物モデルと統計モデルで温暖化影響が分かれる", "title": "Process-Based Crop Models versus Statistical Models: Divergent Climate Change Projections for U.S. Corn and Soybean Yields", "url": "https://doi.org/10.2139/ssrn.7658778", "authors": "Sisi Zhang", "venue": "SSRN", "date": "2026-10-23", "apa": "Zhang, S. (2026). Process-Based Crop Models versus Statistical Models: Divergent Climate Change Projections for U.S. Corn and Soybean Yields. https://doi.org/10.2139/ssrn.7658778", "why": "米国のトウモロコシと大豆で、統計モデルが過程モデルを予測力で上回り、気候シナリオ下の収量予測が大きく食い違うことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "米国コーンベルトの収量
