<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

": "AI産業で同じ企業が投資家・供給者・顧客を兼ねる「循環投資」のもとで、売上の質を評価する定性的な会計・経済の枠組みを示した。", "p3": "AmazonとAnthropic、NVIDIAとCoreWeaveなどの一次資料を検討し、取引の対応づけの方法、5つの評価命題、開示の枠組みを提案した（抄録）。", "p5": "資金と取引の重なりは確認できるが、売上が架空・不適切に認識されたとは言えないとし、収益認識・顧客資金の独立性・需要の持続性を区別する必要を論じた（抄録）。", "fun": "お金を貸した相手がそのお金で自分の商品を買えば、帳簿の上では売上が立ちます。ルール違反ではなくても、それは本当の需要なのかという問いです。会計のルールを守ることと、経済的な中身があることは別物だと気づかせてくれます。", "unverified": "実証的な検定は含まないと読めるが、事例の選び方と分析の詳細は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "政府調達と開示を時点つきで結ぶデータ", "title": "Dating Government Demand: A Point-in-Time, Entity-Resolved Dataset of U.S. Federal Procurement and Disclosure Records", "url": "https://doi.org/10.2139/ssrn.7663020", "authors": "Jennie Chu", "venue": "SSRN", "date": "2026-10-24", "apa": "Chu, J. (2026). Dating Government Demand: A Point-in-Time, Entity-Resolved Dataset of U.S. Federal Procurement and Disclosure Records. https://doi.org/10.2139/ssrn.7663020", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "米連邦政府の調達記録と開示記録を、公表日と当時の上場親会社に正しく対応づけたデータを作り、素朴な結合の誤りを測った。", "p3": "85万件超の事象について、活動日、法定の遅れを考慮した公表日、公表日に取引されていた銘柄コードを付けた（抄録）。", "p5": "活動日で日付を付けると防衛契約の情報が90日早くなり、現在の親会社で結合すると契約額の3.3%を誤って帰属させる。10種の記録は原資料との照合で95%以上の正確さだった（抄録）。", "fun": "株価が反応するのは「新しい情報が出た日」なので、出来事の日付を一つ間違えるだけで分析全体がずれます。会社の買収で親会社が変わることも落とし穴です。データの日付を丁寧に付けるという地味な作業が、研究の結論を左右する好例です。", "unverified": "データの公開条件と、10種の記録の内訳は未確認。収益率の結果は報告しないと抄録にある。"}}, {"id": "pr19", "rank": 19, "headline": "カーネルリッジ回帰で流体-構造連成を分離", "title": "A Gaussian Kernel Ridge Regression Framework for Decoupled Fluid-Structure Interaction in Magnetic-Coupled Unimorph Piezoelectric Energy Harvesters", "url": "https://doi.org/10.2139/ssrn.7662328", "authors": "Reza Roohi ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Roohi, R., & Karimzadeh, A. (2026). A Gaussian Kernel Ridge Regression Framework for Decoupled Fluid-Structure Interaction in Magnetic-Coupled Unimorph Piezoelectric Energy Harvesters. https://doi.org/10.2139/ssrn.7662328", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "上流の角柱の後流で揺れる円柱の揚力をガウスカーネルリッジ回帰（GKRR）で代理し、磁気結合した圧電発電器を、完全な流体-構造連成計算なしに最適化できるようにした。", "p3": "CFDでレイノルズ数・間隔・角柱寸法を変えた揚力のデータを作り、GKRRを学習させ、電気機械モデルと組み合わせた（抄録）。", "p5": "引き合う磁石の配置は、従来の圧電発電器より無次元出力が約67%高かった（抄録）。", "fun": "風で揺れる棒から電気を取り出すとき、前に置いた障害物の作る渦が揺れ方を大きく変えます。毎回重い流体計算をする代わりに、少数の計算から揚力を予測する近似式を作るという発想で、設計の試行錯誤を速くしています。", "unverified": "代理モデルの誤差の大きさ、反発配置との比較の詳細は抄録の途中で切れており未確認。"}}, {"id": "pr20", "rank": 20, "headline": "PINNと仮想仕事法で動的異方性塑性を同定", "title": "Physics-informed neural network constitutive modeling of dynamic anisotropic elastoplasticity based on the virtual fields method and heterogeneous inertial impact tests", "url": "https://doi.org/10.2139/ssrn.7661819", "authors": "Jinhao Zheng ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Zheng, J., Fu, J., Zhang, B., & Qi, L. (2026). Physics-informed neural network constitutive modeling of dynamic anisotropic elastoplasticity based on the virtual fields method and heterogeneous inertial impact tests. https://doi.org/10.2139/ssrn.7661819", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "動的な仮想仕事の原理をニューラルネットワークに埋め込み、衝撃試験の全視野変形データだけから高ひずみ速度の異方性塑性の構成則を学べるようにした。", "p3": "不均一な慣性衝撃下の全視野運動データを使い、動的な仮想仕事のつり合いと塑性散逸の不等式を損失にして教師なしで学習させ、学習後のネットをVUMATとして陽解法に組み込んだ（抄録）。", "p5": "数値実験で、高ひずみ速度・不均一変形での全視野の応力応答を予測できたとし、時間・空間離散化や仮想場の定義などの感度も調べた（抄録）。", "fun": "材料の「力と変形の関係」は、ふつうは単純な試験を何本も行って式に当てはめます。ここでは、変形の様子を撮影した動画のようなデータと、力のつり合いの法則だけで関係そのものを学ばせます。応力を直接測らなくても学べるのが面白いところです。", "unverified": "誤差の数値、実験データでの検証の有無は抄録に記載がなく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "縮約に向く高次吸収境界の局所定式化", "title": "A local, frequency-independent finite-element formulation of high-order Bayliss–Gunzburger–Turkel absorbing boundary conditions on spherical boundaries, suited to model order reduction", "url": "https://doi.org/10.2139/ssrn.7664930", "authors": "Pierre Enzo Mariotti ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Mariotti, P. E., Mao, H., & Rumpler, R. (2026). A local, frequency-independent finite-element formulation of high-order Bayliss–Gunzburger–Turkel absorbing boundary conditions on spherical boundaries, suited to model order reduction. https://doi.org/10.2139/ssrn.7664930", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "球面上のBayliss–Gunzburger–Turkel（BGT）吸収境界条件を、任意の次数で局所的かつ周波数に依存しない有限要素の形に書き直し、モデル次数縮約に使えるようにした。", "p3": "補助変数を導入して高次の法線微分を消し、各補助場がラプラス-ベルトラミ項を1つだけ持つ鎖に分解した。波数はスカラー係数にしか現れず、行列は1度組めば周波数掃引に使える（抄録）。", "p5": "3次元で境界要素法の参照解と比べ、次数を上げるほど誤差が単調に下がった（抄録）。", "fun": "無限に広がる空間の音を計算するには、どこかで計算領域を切る必要があり、その切り口で音がはね返らないようにする工夫が要ります。高い精度の切り口は数式が複雑で使われてきませんでしたが、それを扱いやすい形に分解して実用にしたのがこの研究です。", "unverified": "各次数での誤差の具体値は抄録の途中で切れており未確認。"}}, {"id": "pr22", "rank": 22, "headline": "低電力光ファイバ振動計測の位相検出", "title": "High-Stability Low-Power Optical Phase Detection Technique for Fiber-Optic Vibration Sensing Systems", "url": "https://doi.org/10.2139/ssrn.7662160", "authors": "Cheng Lyu ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Lyu, C., Wang, W., Zhou, B., Wang, R., Zhang, L., Zhu, S., & Ye, L. (2026). High-Stability Low-Power Optical Phase Detection Technique for Fiber-Optic Vibration Sensing Systems. https://doi.org/10.2139/ssrn.7662160", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "低消費電力の光源で生じる光パワーの揺らぎを、短時間窓の投票で実時間に推定・除去し、光ファイバ振動センサの位相検出を安定させた。", "p3": "初めに楕円当てはめで較正し、その後は短時間窓の投票（SWV）で揺らぎを推定して除く。連続的な搬送波も追加の検出チャネルも要らない（抄録）。", "p5": "2%の1/f揺らぎ（帯域200 Hz）で、従来法より10 Hzで16 dB、150 Hzで11.5 dB雑音を抑えた。実際の低電力系では2 Hzと9 Hzで6.8 dBと6.9 dBの抑制だった（抄録）。", "fun": "電池で長く動かすセンサほど光源の明るさが揺らぎ、その揺らぎが振動の信号と見分けにくくなります。部品を増やさず、計算の工夫だけで揺らぎを取り除くという点が、現場に置きっぱなしにするセンサには大きな利点です。", "unverified": "消費電力の具体値は抄録に記載がなく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "自己混合干渉の小型光MEMS加速度計", "title": "A Compact-Packaged Optical MEMS Accelerometer Based on Self-Mixing Interferometry", "url": "https://doi.org/10.1364/opticaopen.34755834", "authors": "Shimin Jiao ほか", "venue": "Optica Open", "date": "2026-10-24", "apa": "Jiao, S., ChunHai, X., Xiong, W., Wang, Q., Ma, X., Ran, S., Bin Chen, C., & Liu, H. (2026). A Compact-Packaged Optical MEMS Accelerometer Based on Self-Mixing Interferometry. https://doi.org/10.1364/opticaopen.34755834", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Optica Openの抄録を使用", "preprint": true, "short": true, "p1": "レーザーの自己混合干渉と平衡検出を使う、小型パッケージの光MEMS加速度計を作った。", "p3": "DFBレーザー、MEMSチップ、受光素子を一体化し、質量体を慣性質量と半透鏡の両方に使った。レーザーの前後の面で逆位相になる変調を使って同相雑音を消す（抄録）。", "p5": "感度4.78 V/g、測定範囲±100 mg、+3 dB帯域380 Hz、60〜380 Hzで雑音200 ng/√Hz未満だった（抄録）。", "fun": "レーザーの光が鏡ではね返ってレーザー自身に戻ると、光の強さがわずかに変わります。この性質を使えば、小さなおもりの動きをごく小さな距離の精度で読めます。一つの光路で雑音を打ち消し感度を2倍にする工夫も巧みです。", "unverified": "温度安定性や長期ドリフトは抄録に記載がなく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "降雨斜面不安定の解釈可能なML評価", "title": "An Interpretable Machine Learning Framework for Rainfall-Related Slope Instability Susceptibility Assessment in Aba Prefecture, China: Sampling Strategy, Spatial Validation, and Susceptibility Score Mapping", "url": "https://doi.org/10.21203/rs.3.rs-11134982/v1", "authors": "Liping Zheng ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Zheng, L., Yang, Y., Deng, S., Xiao, K., Qiu, M., Ning, F., & Zhao, L. (2026). An Interpretable Machine Learning Framework for Rainfall-Related Slope Instability Susceptibility Assessment in Aba Prefecture, China: Sampling Strategy, Spatial Validation, and Susceptibility Score Mapping. https://doi.org/10.21203/rs.3.rs-11134982/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用", "preprint": true, "short": true, "p1": "中国アバ州の降雨に関わる斜面不安定について、標本の偏りと露出に由来する近道変数を抑えた、解釈可能な機械学習の感受性評価を示した。", "p3": "不安定記録5,322件と、仕組みを対比させて作った対照5,322件の計10,644標本で、17モデルを比べ、空間ブロック交差検証とSHAPで検証した（抄録）。", "p5": "重み付き投票アンサンブルのF1が0.923、LightGBMなどのAUCが0.973だった。空間ブロックにしてもAUCの低下は1.2〜1.6%だった（抄録）。", "fun": "崩れた場所と崩れなかった場所を比べて学ばせるとき、「崩れなかった場所」の選び方しだいで、モデルは斜面の性質ではなく人が住んでいるかどうかなどを手がかりにしてしまいます。この落とし穴をどう避けるかに焦点を当てたところが面白い点です。", "unverified": "感受性地図の検証方法の詳細は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "物理情報ニューラル作用素で都市浸水を予測", "title": "Exploring physics-informed Laplace-wavelet neural operators for urban pluvial flood inundation prediction", "url": "https://doi.org/10.2139/ssrn.7661806", "authors": "Sudarshan Saravanan ほか", "venue": "SSRN", "date": "2026-10-23", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ラプラス-ベルトラミ固有基底と局所的なハール・ウェーブレットを組み合わせた物理情報付きニューラル作用素で、都市の内水氾濫を予測した。", "p3": "浅水方程式を、ラベル不要の仮想豪雨カリキュラムで学習に埋め込み、14,400 km²のハイデラバード都市圏で評価した（抄録）。", "p5": "ゼロショットの空間転移と分布外の状況での安定性を示した一方、長い自己回帰の予測では全体の質量がずれていくという限界を著者自ら報告した（抄録）。", "fun": "雨水がどこに溜まるかを、重い数値計算の代わりに学習したモデルで一瞬で予測しようという試みです。物理の法則を「緩く」守らせると局所的な暴れは抑えられても、長く回すと水の総量が勝手に増減してしまう、という正直な限界の報告も興味深い点です。", "unverified": "予測誤差の数値は抄録に記載がなく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "連続ハリケーン後の世帯の回復", "title": "Household Recovery after Successive Hurricanes: Evidence from Hurricanes Laura and Ida in Louisiana", "url": "https://doi.org/10.2139/ssrn.7661811", "authors": "Eric Cardella ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Cardella, E., Keeler, Z., Ewing, B., & Liang, D. (2026). Household Recovery after Successive Hurricanes: Evidence from Hurricanes Laura and Ida in Louisiana. https://doi.org/10.2139/ssrn.7661811", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ルイジアナ州で2年続いた大型ハリケーン（2020年ローラ、2021年アイダ）の後の世帯の回復を、詳細な世帯調査で分析した。", "p3": "約140の郵便番号区域の持ち家世帯400超から、完全な回復の有無と回復までの時間を調べた（抄録）。", "p5": "回復は保険、繰り返しの被災、物理的損害、ライフラインの途絶、支援へのアクセス、減災投資と強く結びつき、被災前の備えの方が被災後の資金援助より一貫して良い回復と関連した（抄録）。", "fun": "同じ地域が2年続けて大きな災害に遭うと、回復はどうなるのか。家の壊れ方だけでなく、保険や電気・水道、手続きのしやすさまで含めて見ると、事前の備えの効き目が事後の支援より安定して大きいという、防災の原則を裏づける結果です。", "unverified": "回帰の効果量の数値は抄録に記載がなく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "ガソリンスタンドで地域経済を測る", "title": "Measuring Regional Economic Development from the Ground Up: Gas Station Infrastructure as an Alternative to Nighttime Lights", "url": "https://doi.org/10.21203/rs.3.rs-11341188/v1", "authors": "Vasil Filkoski ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Filkoski, V., & Tevdovski, D. (2026). Measuring Regional Economic Development from the Ground Up: Gas Station Infrastructure as an Alternative to Nighttime Lights. https://doi.org/10.21203/rs.3.rs-11341188/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用", "preprint": true, "short": true, "p1": "ガソリンスタンドとその周辺環境の公開地理データから、地域の経済発展を測る指標（GSI）を作った。", "p3": "18か国207地域の約10万か所のスタンドについて、サービスの質、200 mと200〜500 m圏の施設の密度と多様性、アクセスを組み合わせた（抄録）。", "p5": "GSIは地域の1人当たりGDPと強く関連し、R²は約0.75で夜間光と同程度だった。夜間光とは一部異なる側面を捉えるとした（抄録）。", "fun": "宇宙から見た夜の明るさで経済を測る方法は有名ですが、この研究は地上の「ガソリンスタンドの周りに何があるか」で測ります。どこにでもある施設を手がかりに、統計が遅い地域の経済を素早く知ろうという身近な発想が面白い点です。", "unverified": "国別の精度の差、因果的な解釈の範囲は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "急速充電データでEV充電を個別化", "title": "Personalising Electric-Vehicle Charging on Real Rapid-Charging Data: How Much Does Matching Schedules to Driver Priorities Help, and What Does It Mean for Charging Policy?", "url": "https://doi.org/10.2139/ssrn.7662419", "authors": "Muhammad Abdullah Bin Arif ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Arif, M. A. B., & Deb, S. (2026). Personalising Electric-Vehicle Charging on Real Rapid-Charging Data: How Much Does Matching Schedules to Driver Priorities Help, and What Does It Mean for Charging Policy? https://doi.org/10.2139/ssrn.7662419", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "実際の急速充電所のデータで、運転者が申告した優先事項に合わせて充電を計画するとどれだけ役立つかを検証した。", "p3": "ニューカッスルの充電所の5年分41,213セッションで、セッションごとの凸計画（注水法）を、固定方針や平均的な好み、簡単なモード選択など5つの基準と比べた（抄録）。", "p5": "自分の目的を満たすセッションの割合は一律方式の32%から41%に、余裕時間のあるセッションでは52%に上がった。効果は電池の健康を重視する運転者にほぼ限られ、簡単なモード選択でも同じ結果を再現できた（抄録）。", "fun": "一人ひとりに合わせた高度な最適化が必要かと思いきや、利用者が「安さ・速さ・電池にやさしい」から選ぶだけで同じ効果が出るという結果です。賢い仕組みより、選べるボタンを用意するほうが現実的だという示唆が面白い点です。", "unverified": "料金・ピーク負荷への影響がない理由の詳細は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "交通結節点の施設制御をMARLで最適化", "title": "DynaSFA: Coupling bidirectional mesoscopic simulation with multi-agent reinforcement learning for coordinated service facility control in multimodal transport hubs", "url": "https://doi.org/10.2139/ssrn.7662398", "authors": "Shulin He ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "He, S., Cheng, L., Song, H., Chen, Y., & Chen, W. (2026). DynaSFA: Coupling bidirectional mesoscopic simulation with multi-agent reinforcement learning for coordinated service facility control in multimodal transport hubs. https://doi.org/10.2139/ssrn.7662398", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "交通結節点のサービス施設（改札など）の稼働数を、双方向の旅客流を表す中間スケールの模擬と多エージェント強化学習で協調制御した。", "p3": "共有空間の対向流と待ち行列の増減を同時に表す模擬環境を作り、施設の調整時点で行動を学ぶ方策と、周期内の遷移も使う評価器を組み合わせた（抄録）。", "p5": "南京南駅の事例で、累積旅客時間と最大待ち時間が比較手法の中で最小となり、運営費用を26.23%減らした（抄録）。", "fun": "改札を開けすぎれば人件費がかさみ、閉めすぎれば行列ができます。しかも改札の数を変えると人の流れ方そのものが変わります。人の流れと施設の運用を一緒に模擬して、何人もの「AIの係員」に協調させるという設計が面白い点です。", "unverified": "26.23%の比較対象の詳細は抄録の途中で切れており未確認。"}}, {"id": "pr30", "rank": 30, "headline": "エージェントモデルで住み分けと都市成長", "title": "Neighbourhood avoidance, residential turnover and measured segregation in an agent-based urban growth model", "url": "https://doi.org/10.5281/zenodo.23600033", "authors": "Duarte ほか", "venue": "Zenodo", "date": "2026-10-23", "apa": "Duarte, R. P., Silva, M. W. R. da, & Zamith, M. (2026). Neighbourhood avoidance, residential turnover and measured segregation in an agent-based urban growth model (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23600033", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "都市の周縁化を表すエージェントモデルに、近隣の回避や転居を加え、住み分けの好みと測った分離の度合いが同じ方向に動かないことを示した。", "p3": "3つの所得層が高所得の集落の近くを奪い合う51×51の格子で、100回の試行の集合を、非類似度・空間情報理論・接触/孤立の指標で評価した（抄録）。", "p5": "近隣の許容度を下げると放棄の平均回数は8のときの44.00から4のときの2369.80に増えたが、最も強い回避の場合の全体の非類似度は中間より低かった（抄録）。", "fun": "人が異なる層の隣を避けるほど町は分断される、と考えがちです。ところが避けて引っ越しを繰り返すうちに、空いた土地に別の層が住みつき、かえって接触が保たれることがある。好みと結果が逆向きになるという、シェリングの分居モデルを思わせる面白さです。", "unverified": "校正していない模擬であり、特定の都市の予測ではないと著者が明記している。"}}, {"id": "pr31", "rank": 31, "headline": "断られうる提供者とのマッチングにLLMエージェント", "title": "Matching on Platforms When Providers May Decline: LLM-Agent Menu Interventions with Provider Teams&nbsp;", "url": "https://doi.org/10.2139/ssrn.7658498", "authors": "Xiguang Liu ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Liu, X., Wang, X., Pu, J., & Qiu, L. (2026). Matching on Platforms When Providers May Decline: LLM-Agent Menu Interventions with Provider Teams&nbsp; https://doi.org/10.2139/ssrn.7658498", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "提供者が依頼を断りうるマッチング基盤で、LLMエージェントによる一覧（メニュー）の設計がマッチングの失敗を減らせることを示した。", "p3": "分類・提供者・順位づけの3つのエージェントで一覧を作り、中国のオンライン診療基盤haodf.comのデータに基づくLLMエージェントを患者と医師の代わりに置いて、同じ依頼を別の設計で再生した（抄録）。", "p5": "医師チームを一覧に載せると、診療に至らない依頼の割合が65.9%から37.4%に下がった（抄録）。", "fun": "人気の医師に依頼が集中しても、断られれば患者は診療を受けられません。実際の基盤では試せない「もし一覧の見せ方を変えたら」を、LLMの患者と医師を使って何度でも再現できる、という実験の作り方そのものが面白い点です。", "unverified": "LLMエージェントの振る舞いが実際の患者と医師にどれだけ近いかの検証の詳細は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLM基盤の広告と課金の設計", "title": "Monetizing Intelligence: Advertising and Subscription Design on LLM Platforms", "url": "https://doi.org/10.2139/ssrn.7662578", "authors": "Yuhang Ji ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Ji, Y., Xu, F., & Feng, T. (2026). Monetizing Intelligence: Advertising and Subscription Design on LLM Platforms. https://doi.org/10.2139/ssrn.7662578", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "広告を入れるLLM基盤が、回答の質、広告の量、無広告プランの価格をどう決めるかを理論モデルで分析した。", "p3": "広告は利用者の価値を下げるが、良いサービスは広告の収益を高める、という独占的な基盤のモデルで、品質・広告強度・購読料の同時決定を解いた（抄録）。", "p5": "広告付きと無広告のプランが並ぶと広告が無料利用者へのサービスを支える一方、利用者の効用が二極化しうる。中間的な広告の上限が消費者余剰を最大にしうること、計算費用が大きく下がると広告収入が増えうることを示した（抄録）。", "fun": "無料で使えるAIに広告が入るのは損か得か。広告のおかげで無料の人も使えるようになる一方、有料プランとの差をつけるために中間プランの質がわざと下げられることもある。身近なサブスクの値段の付け方を、数式で解きほぐしている点が面白いです。", "unverified": "モデルの前提の詳細は抄録の範囲では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "本能的な手がかりでプライバシー通知を改善", "title": "Visceral Cues and Privacy Notices: An Online Experiment on Self-Disclosure and Privacy-Protection Behavior", "url": "https://doi.org/10.2139/ssrn.7664922", "authors": "Clara Strathmann ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Strathmann, C., Schramm, P., Steinhoff, L., & Krämer, N. (2026). Visceral Cues and Privacy Notices: An Online Experiment on Self-Disclosure and Privacy-Protection Behavior. https://doi.org/10.2139/ssrn.7664922", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "クッキーバナーに視覚・聴覚の直感的な手がかりと短い説明を加えても、個人情報の開示や保護の行動は変わらなかった。", "p3": "保護動機理論とプライバシー計算の枠組みで、3×2の参加者間オンライン実験（N=352）を自作の健康サイトで行った（抄録）。", "p5": "手がかりと説明文には有意な効果がなく、媒介・調整変数も関係を変えなかった。知覚リスクと状況的な懸念が高いほど開示が少なく、一般的な懸念が保護行動を予測した（抄録）。", "fun": "「同意しますか」のバナーに音や絵を足せば、人はもっと気をつけるのではないか。そう考えた実験の答えは「効果なし」でした。その場の工夫より、もともとの心配性かどうかのほうが行動を決めるという、地に足のついた否定的な結果です。", "unverified": "効果量と検出力の詳細は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "プライバシーと個別化の両立", "title": "Balancing User Privacy and Personalization", "url": "https://doi.org/10.2139/ssrn.7658838", "authors": "Malika Korganbekova ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Korganbekova, M., & Zuber, C. (2026). Balancing User Privacy and Personalization . https://doi.org/10.2139/ssrn.7658838", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "Wayfairでの2年間のフィールド実験と構造モデルで、個別化が商品の適合を高め、クッキーの制限が消費者の厚生を下げうることを示した。", "p3": "個別化を受けた消費者と受けない消費者を比べ、推薦アルゴリズムと構造モデルを組み合わせてプライバシー規制の効果を模擬した（抄録）。", "p5": "個別化で返品が4.4%減り、1年以内の再購入が2.1〜3.2%増えた。Safariの7日クッキー規則は消費者厚生を13.1%下げると推計し、損失は主流でもニッチでもない中間の消費者に集まった（抄録）。", "fun": "データを集めさせないことが消費者を守る、という前提を実験で確かめた研究です。似た人のデータから好みが推測できてしまうため、制限しても守りきれず、かえって中間層の人が損をする。プライバシーと便利さの関係が単純でないことがよく分かります。", "unverified": "厚生の推計の前提と頑健性の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "B2Bソフト企業のサイトはAIに読めるか", "title": "Are B2B Software Vendors Readable by AI Assistants? Evidence from 251 Homepages", "url": "https://doi.org/10.2139/ssrn.7661203", "authors": "Shivil Sahni", "venue": "SSRN", "date": "2026-10-24", "apa": "Sahni, S. (2026). Are B2B Software Vendors Readable by AI Assistants? Evidence from 251 Homepages. https://doi.org/10.2139/ssrn.7661203", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "B2Bソフトウェア企業の公式サイトが、AIアシスタントにどれだけ読み取れる形になっているかを測った。", "p3": "7分野274社のトップページで、llms.txt、JSON-LDの構造化データ、robots.txtがAIクローラーを許すかを調べ、0〜100の総合点を作った（抄録）。", "p5": "読めた251サイトのうち60.6%がllms.txtを持ち、AIクローラーを遮るのは4.4%だけで、総合点の中央値は75だった。40サイト中12では、最初の5,000文字の大半がナビゲーションやコードだった（抄録）。", "fun": "これからは人が検索する代わりにAIに「良い業者を挙げて」と頼む時代になるかもしれません。そのときAIに読めないサイトは候補から漏れてしまう。口コミや評判がAIを通じて作られる新しい経路を、具体的に測った点が面白いところです。", "unverified": "分野別の詳細と、読み取りやすさが実際の推薦に与える影響は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "RAGでLLMの因果の幻覚を抑える", "title": "Mitigating Causal Hallucination in LLM-Based Nuclear Event Analysis via Retrieval-Augmented Generation", "url": "https://doi.org/10.2139/ssrn.7658700", "authors": "Kenzie Harris", "venue": "SSRN", "date": "2026-10-23", "apa": "Harris, K. (2026). Mitigating Causal Hallucination in LLM-Based Nuclear Event Analysis via Retrieval-Augmented Generation. https://doi.org/10.2139/ssrn.7658700", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "原子力の事象報告の因果分析で、LLMが根拠のない因果を作る「因果の幻覚」を、検索拡張生成（RAG）で抑える枠組みを評価した。", "p3": "20,129件の報告のコーパスに検索層を作り、捏造された因果、根拠のない向き、過度な一般化の3種の誤りを区別する基準で、3つのRAG構成と基準のLLMを比べた（抄録）。", "p5": "専門家の注釈と出典の忠実性で検証し、検索が暗黙の因果の証拠を拾えない失敗を分析した。抄録の範囲では各構成の数値は示されていない（抄録）。", "fun": "AIはもっともらしい因果の説明を作るのが得意ですが、安全に関わる分野では「どこに書いてあるか」を示せない説明は使えません。答える前に必ず報告書の該当箇所を探させ、その箇所から言えることだけを書かせる、という使い方の工夫です。", "unverified": "幻覚率などの数値は抄録に記載がなく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "LLMと人間のコーダー一致度のメタ分析", "title": "Agreement between large language models and human coders on psychological and clinical text: a systematic review and multilevel meta-analysis", "url": "https://doi.org/10.5281/zenodo.23613737", "authors": "Rekhert, Martin", "venue": "Zenodo", "date": "2026-10-24", "apa": "Rekhert, M. (2026). Agreement between large language models and human coders on psychological and clinical text: a systematic review and multilevel meta-analysis. Zenodo. https://doi.org/10.5281/ZENODO.23613737", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "心理・臨床の文章で、生成LLMと人間のコーダーの一致度を377研究から統合し、人間同士の一致度と比べた。", "p3": "OSFに事前登録し、9つの文献源を検索して、相関と階層を考慮した効果モデル（CR2の頑健分散）で統合した（抄録）。", "p5": "偶然補正の一致度（κ系）の統合値は0.62（95% CI 0.58〜0.65）で、課題による差はなかった。同じ文章で比べた23研究ではLLMの一致度が人間同士より低く（Δκ=−0.11）、公開年による改善も見られなかった（抄録）。", "fun": "AIに文章の採点や分類を任せられるかという問いに、数百の研究をまとめて答えています。「新しいモデルほど良くなる」とは限らず、人間同士の一致が高い課題ほどAIとの一致も高い、つまり課題そのものの難しさが効いているという点が面白いところです。", "unverified": "審査のない置き場への登録であり、研究の選択と符号化の質は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "LLM審査員の一致・偏り・妥当性を総合", "title": "Jueces LLM: acuerdo, sesgos y validez de la evaluación / LLM judges: agreement, biases and validity of evaluation", "url": "https://doi.org/10.5281/zenodo.23580621", "authors": "Santiago Pineda Botero", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-23", "apa": "Pineda Botero, S. (2026). Jueces LLM: acuerdo, sesgos y validez de la evaluación / LLM judges: agreement, biases and validity of evaluation. Zenodo. https://doi.org/10.5281/ZENODO.23580621", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（スペイン語）を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "LLMを審査員として使うときの一致度・偏り・評価手順を、11の一次資料から整理し、現地での検証手順を提案した総説。", "p3": "一致度の指標と母集団、位置・長さ・文体・自己優先の偏り、対比較か絶対評価かなどの手順を分けて整理した（抄録）。", "p5": "MT-BenchでGPT-4と専門家の一致は引き分けを除くと85%、含めると66%だった。位置を入れ替えたときの一貫性は審査員により23.8〜65.0%だった（抄録）。", "fun": "AIの審査員と人間の一致率「85%」と聞くと信頼できそうですが、引き分けを数えるかどうかで66%にまで下がります。一つの数字が何を数えているかを確かめないと、評価の良し悪しを取り違えるという教訓が面白い点です。", "unverified": "新しい実験は含まないと抄録にある。提案手順は実験で検証されていない。"}}, {"id": "pr39", "rank": 39, "headline": "62か国で一般的信頼と発言志向の関係", "title": "Generalized Trust, Institutional Confidence, and Voice Orientation Across 62 countries", "url": "https://doi.org/10.2139/ssrn.7662360", "authors": "Nawaf Alabduljader", "venue": "SSRN", "date": "2026-10-23", "apa": "Alabduljader, N. (2026). Generalized Trust, Institutional Confidence, and Voice Orientation Across 62 countries. https://doi.org/10.2139/ssrn.7662360", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "62か国の常勤労働者で、一般的信頼と発言を重んじる志向の関係が、国の制度への信頼によって曲線的に変わることを示した。", "p3": "世界価値観調査第7波（2017〜2022年）の30,767人で、国のランダム切片と信頼のランダム傾きを持つ多水準モデルを推定した（抄録）。", "p5": "一般的信頼と自律志向は発言志向と正、権威志向は負に関連した。制度への信頼は信頼と発言の関係を曲線的に調整し（b=−0.101, p=.008）、関係は中程度の制度信頼で最も強かった（抄録）。", "fun": "人を信じる人ほど声を上げるか。答えは「国の制度がそこそこ信頼できるとき」に最も強く当てはまる、でした。制度がまったく頼れないと人への信頼だけでは足りず、制度が完璧だと人への信頼は要らなくなる。中くらいが一番効くという山型の関係が面白い点です。", "unverified": "発言志向の測り方の詳細は未確認。横断データであり因果は言えない。"}}, {"id": "pr40", "rank": 40, "headline": "人間中心AIの分野横断システマティックレビュー", "title": "Toward Evidence-Based Human-Centered AI and Human-AI Interaction: A Cross-Domain Systematic Review", "url": "https://doi.org/10.31234/osf.io/j9cha_v1", "authors": "Xinyi Wang ほか", "venue": "PsyArXiv", "date": "2026-10-23", "apa": "Wang, X., Lo, C., Lo, W.-H., Wang, M., & Huang, G. (2026). Toward Evidence-Based Human-Centered AI and Human-AI Interaction: A Cross-Domain Systematic Review. https://doi.org/10.31234/osf.io/j9cha_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "人間中心のAIと人間-AI相互作用の実証研究44件を、分野横断で体系的にレビューした。", "p3": "測定方法、枠組み、AIの役割、分野ごとの知見を整理した（抄録）。", "p5": "AI支援は課題成績や判断の質といった客観的成果の改善と結びつくことが多い一方、信頼・満足・負担などの主観的成果は、透明性や説明の設計、課題との適合、利用者の熟練、人の統制の程度によって変わった。最終権限を人が持つ形が最も多かった（抄録）。", "fun": "AIを使うと仕事の成果は上がりやすいのに、使う人の満足や信頼はばらばら。この「成果と気持ちのずれ」が分野をまたいで見えてくるのが面白い点です。医療は正確さ、教育は主体性、交通は安全とタイミング、と分野ごとに重視点が違うのも興味深いです。", "unverified": "研究の選択基準と質の評価の詳細は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "ADHD症状と自己危険化労働行動", "title": "Working at a Cost? ADHD Symptoms, Self-Endangering Work Behavior, and Occupational Well-Being", "url": "https://doi.org/10.31234/osf.io/nfpej_v1", "authors": "Kerstin Erdal ほか", "venue": "PsyArXiv", "date": "2026-10-23", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "ADHDの症状、健康を犠牲にしてでも仕事を回す自己危険化労働行動（SEWB）、職業的な幸福の関係を、変数中心と人中心の両方で調べた。", "p3": "ドイツの働く成人471人（うち176人がADHDの基準に該当）で、10次元のSEWBと燃え尽き・ワークエンゲイジメント・ストレスの関係と、潜在プロファイルを分析した（抄録）。", "p5": "ADHD群はすべてのSEWB次元で高く（d=.20〜.78）、SEWBと幸福の関係はADHDの有無でほとんど変わらなかった。4つのプロファイルは幸福の指標で異なったが、ADHDの区分とは一致しなかった（抄録）。", "fun": "休憩を削る、体調が悪くても出社する、といった「無理して働く」行動は、ADHDの特性がある人ほど多いことが示されました。ただし同じADHDでも組み合わせは人によってさまざまで、ラベルだけでは分からないという点が面白いところです。", "unverified": "横断的設計、高学歴の標本、自己申告の区分という限界を著者が挙げている。"}}, {"id": "pr42", "rank": 42, "headline": "テスラとSpaceX・xAIの関連当事者取引", "title": "Related-Party Ties Before a Possible Merger: Tesla's Transactions with SpaceX and xAI, 2017–2025", "url": "https://doi.org/10.5281/zenodo.23600326", "authors": "Merlet Echavarria ほか", "venue": "Zenodo", "date": "2026-10-23", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "テスラとマスク氏が支配する企業（SpaceX、xAIなど）の関連当事者取引を、SECの委任状説明書から年次で整理した。", "p3": "2018年2月〜2026年10月の10通のDEF 14Aから取引額を符号化し、合併の可能性に関する4つの発表の前後で単一企業のイベントスタディを行った（抄録）。", "p5": "テスラへの開示額は2017〜2023年は年0.57〜4.50百万ドルだったが、2024年に200.70百万ドル、2025年に573.70百万ドルに増えた。発表による異常収益は有意でなかった（Z=1.08, p=0.28）（抄録）。", "fun": "同じ経営者が率いる会社同士の取引は、利益の付け替えの温床にもなりえます。開示義務は12万ドル超だけなので、この数字は下限にすぎません。公開書類を丹念に読むだけで、数年で取引が100倍以上に増えた様子が見えるのが面白い点です。", "unverified": "審査のない置き場への登録。手作業の符号化の検証は原資料との照合とあるが詳細は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "自然災害がビッグファイブに与える影響", "title": "The Distributional Effects of Natural Disasters on the Big Five Personality Traits", "url": "https://doi.org/10.2139/ssrn.7657011", "authors": "Ha Trong Nguyen ほか", "venue": "SSRN", "date": "2026-10-24", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "自然災害による住宅被害がビッグファイブの性格特性を変え、それを通じて所得を下げうることを因果的に推定した。", "p3": "時間で変わる地域のサイクロン被害を操作変数にし、個人固定効果の操作変数法と分位点回帰を使った（抄録）。", "p5": "住宅被害は誠実性と情緒安定性を下げ、開放性を上げた。効果は分位点回帰でのみ有意で、分布の端の人ほど大きかった。性格の変化を通じた所得の損失は最大7%に相当し、社会経済的に不利な人ほど大きかった（抄録）。", "fun": "性格は大人になるとあまり変わらないと思われがちですが、家が壊れるような体験は性格を変えうる、という結果です。しかも平均では見えず、もともと落ち込みやすい側の人に強く出る。災害の被害を「心の変化を通じた所得の損失」として測る発想が面白い点です。", "unverified": "データの国・期間は抄録に記載がなく未確認。"}}, {"id": "pr44", "rank": 44, "headline": "FDEMを微分可能なグラフNNとして実装", "title": "Neural Network for FDEM (NN4FDEM): a differentiable 3D cohesive-joint FDEM solver（登録題名が不完全なため抄録から補記）", "url": "https://doi.org/10.2139/ssrn.7664929", "authors": "Tongan Yang ほか", "venue": "SSRN", "date": "2026-10-24", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。登録題名が「Mr」と不完全なため、抄録から題名を補記した", "preprint": true, "short": true, "p1": "結合有限-離散要素法（FDEM）の3次元ソルバを、微分可能なグラフニューラルネットワークとして書き、CPUとGPUで同じコードが動き自動微分できるようにした。", "p3": "陽解法の1時間ステップを1つのGNNブロックにし、節点、連続体要素、粘着接合、破断後の接触を3種のハイパーエッジにした。伝達関数はデータから学ぶのではなく離散化した式で与える（抄録）。", "p5": "曲げ試験の核は閉形式解や独立な解を再現し、CPUとGPUで丸め誤差の範囲で一致し、自動微分は分岐の境界をまたぐ場合を除き差分と一致した。最大768,000要素のメッシュで三点曲げを調べた（抄録）。", "fun": "ニューラルネットワークの道具を使っても、中身は学習ではなく物理の式そのもの、という逆転の発想です。そうすると、計算を逆向きにたどって「どの材料定数なら観測に合うか」を自動で求められるようになります。割れや接触を含む計算でそれができるのが面白い点です。", "unverified": "三点曲げの結果の詳細は抄録の途中で切れており未確認。"}}, {"id": "pr45", "rank": 45, "headline": "スマートビルのデータを束ねる個人ハブ", "title": "Personalised Building Data Hubs: Integrating Smart Building Systems for Federated Information Access and Mediation", "url": "https://doi.org/10.2139/ssrn.7664888", "authors": "Avinash Ramachandruni ほか", "venue": "SSRN", "date": "2026-10-24", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "スマートビルの異なる情報システムをつなぐ、建物単位の再利用できる情報部品（個人化建物データハブ、PDH）の役割と境界を定義した。", "p3": "システム工学の方法でPDHの役割・インターフェース・境界を定め、スペインの実際のオフィスビルで4つの情報源を統合した試作を評価した（抄録）。", "p5": "PDHを介すると情報へのアクセスが改善し、情報源をまたいで対応がとれ、利用側のアプリケーションが負う統合の手間が大きく減った（抄録）。", "fun": "一つの建物の中でも、空調、照明、入退室などの仕組みはばらばらに作られていて、データを集めるのが大変です。データを一か所に集めずに、仲介役を一つ置いて必要なときに取りに行く、という設計の考え方が面白い点です。", "unverified": "改善の度合いの数値は抄録に記載がなく未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "製品リリースの実験で因果推定法を検証", "title": "Reevaluating Causal Estimation Methods with Data from a Product Release", "url": "https://doi.org/10.2139/ssrn.7663059", "authors": "Eleanor Wiske Dillon ほか", "venue": "SSRN", "date": "2026-10-24", "why": "実験的展開と自発的利用の両方がある製品機能のデータで、機械学習による因果推定が真の効果をどこまで回復できるかを確かめた。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "賃金差なき差別：仮想労働市場の住み分け", "title": "Discrimination Without Wage Gaps? Racial Preferences and&nbsp;Workplace Segregation in a Virtual Labor Market", "url": "https://doi.org/10.2139/ssrn.7661180", "authors": "Manuel Arrigo ほか", "venue": "SSRN", "date": "2026-10-24", "why": "340万件超の観察から、賃金差がなくても雇用主の嗜好が職場の人種的な住み分けとして現れるというBeckerモデルの含意を検証した。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "雇用主に見えない仕事の好みと独占的買い手力", "title": "Private Preferences for Jobs and Labor Market Dynamics", "url": "https://doi.org/10.2139/ssrn.7662559", "authors": "Martin Souchier ほか", "venue": "SSRN", "date": "2026-10-24", "why": "労働者の観測されない職の好みが買い手独占を生む動学的探索モデルを、フランスの雇用者-被用者データで推定した。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "交差分類ランダム効果DiDでNY渋滞課金を評価", "title": "Cross-Classified Random-Effects Difference-in-Differences Model: A Case Study for New York City's Congestion Pricing", "url": "https://doi.org/10.2139/ssrn.7663459", "authors": "Luyang Han ほか", "venue": "SSRN", "date": "2026-10-24", "why": "米国初のコードン課金の1年目の効果を、交通手段・方向・時間帯別に交差分類ランダム効果の差の差モデルで推定した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "拡散言語モデルの良いアンマスク方策とは", "title": "What Makes a Good Unmasking Policy? A Controlled Study of Learned Unmasking in Diffusion Language Models", "url": "https://arxiv.org/abs/2610.31576", "authors": "Jinya Sakurai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "why": "マスク拡散言語モデルで学習したアンマスク方策のどの設計が速度と精度の両立に効くかを、統制した比較で切り分けた。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "自律研究エージェントの研究不正を検知・介入", "title": "RIDAR: Safeguarding Research Integrity in Autonomous Research Agents via Automated Detection and Runtime Intervention", "url": "https://arxiv.org/abs/2610.31372", "authors": "Jiening Siow ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "why": "研究エージェントの研究不正を14類型に整理し、軌跡からの検知と実行時の介入を行う枠組みを示した。"}, {"id": "pn07", "rank": 7, "field": "教育", "headline": "競争・チーム・寄付の誘因で成績は変わるか", "title": "Can Solidarity M   }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
