で、統計モデルが過程に基づく作物モデル（SIMPLE）を予測力で大きく上回り、将来の気候では両者の予測が大きく食い違うことを示した（抄録）。", "p2": "気候変動の農業への影響の見積もりは、作物の生理を模擬する過程モデルと、過去のデータから学ぶ統計モデルで結論が違いうる。どちらを信じるかで政策判断が変わる（抄録、解釈を含む）。", "p3": "2000〜2019年の米国コーンベルトの収量で、過程モデル（SIMPLE）、統計モデル、機械学習モデル（XGBoost、交互作用つきLASSO）を比べ、CMIP6の気候シナリオで将来を予測した（抄録）。", "p4": "評価は全国の標本外R²と、2012年の干ばつのような極端な暑さの年の予測誤差である（抄録）。", "p5": "統計モデルの全国の標本外R²は0.844で、過程モデルの0.413を上回り、2012年の干ばつの予測誤差は10.9%対35.7%だった。CMIP6のもとで統計モデルは極端な暑さへの曝露が2倍以上になりトウモロコシの収量が1エーカーあたり32〜44ブッシェル減ると予測し、SIMPLEに基づく回帰は+3〜ほぼ0の変化しか予測しなかった。XGBoostは統計モデルの損失を裏づけ、LASSOは大豆で新しい気候に不安定に外挿した。早い作付けは損失の約30%を相殺しうるが有意ではなかった（抄録）。", "p6": "過去の関係が将来の気候でも成り立つか（外挿）は統計モデルの弱点であり、著者は柔軟な機械学習での「予測と投影のトレードオフ」を指摘する（抄録）。未査読のプレプリント。", "fun": "作物の育ち方を理屈で計算するモデルと、過去のデータから学ぶモデルでは、温暖化の影響の見積もりがまったく違いました。過去の当てはまりはデータのモデルが圧勝。でも未来は過去にない暑さなので、どこまで信じてよいかは別の問題です。予測と将来の見通しの違いを考えさせる研究です。", "unverified": "シナリオと期間の詳細は抄録に記載がなく未確認。"}}, {"id": "pn11", "rank": 11, "field": "統計学", "headline": "分布シフト下の企業破綻予測に不確実性学習は効くか", "title": "Does Uncertainty-Aware Learning Help Forecast Corporate Distress Under Temporal Distribution Shift? Evidence from U.S. Performance Delistings, 2011–2023", "url": "https://doi.org/10.2139/ssrn.7658018", "authors": "Juboraj Roy Pavel ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Pavel, J. R., Saha, A., Lamini, A., & Das, T. (2026). Does Uncertainty-Aware Learning Help Forecast Corporate Distress Under Temporal Distribution Shift? Evidence from U.S. Performance Delistings, 2011–2023. https://doi.org/10.2139/ssrn.7658018", "why": "推定期間と予測期間がずれる状況で、分布シフト向けのベイズ法が米国企業の上場廃止予測を改善するかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "推定期間と予測期間がずれる「時間の分布シフト」のもとで、分布シフト向けのベイズ法（VIDS）が米国企業の1年先の破綻予測を改善するかを検証し、改善しないことを示した（抄録）。", "p2": "破綻予測モデルは過去の企業で推定して未来の企業に使うので、時代の変化で関係がずれる。共変量シフト向けの新しい手法がこの問題を解くかは確かめられていない（抄録）。", "p3": "CRSPとCompustatのデータで、2011〜2017年で推定し、2018年で調整・再較正し、2019〜2023年（14,470企業年中286件の業績による上場廃止）で評価した。プールしたロジット、木のアンサンブル、5つの不確実性を考慮するニューラルネットを同じ再較正で比べ、VIDSは再実装して著者の例で確認した（抄録）。", "p4": "順位づけの力はAUC、確率の正確さはブライアスコアで評価した（抄録）。", "p5": "標準の市場ベースの予測変数を使うモデルはどれもAUC約0.93でほぼ同等だったが、2019〜2022年にはどれも破綻を過大に予測し、主な理由は同じ企業特性での破綻リスクが下がり続け年ごとに大きく変動したことだった。再較正後、24の標準予測変数のロジットが主設計で最小のブライアスコアを示し、最良のネットと統計的に区別できなかった。VIDSは基になったネットより正確でなく、シフトを考慮した事前分布に重みを置くほど悪化した。重要度重み付け、比率に基づく切片の更新、毎年の再推定も年ごとの較正誤差を消さなかった（抄録）。", "p6": "対象は米国の上場非金融企業で、破綻の定義は業績による上場廃止である（抄録）。解釈：年ごとの基準率の変動を予測する外部情報（景気など）が必要と示唆される。未査読のプレプリント。", "fun": "最新の高度な手法を試しても、昔ながらの単純なロジスティック回帰に勝てませんでした。どのモデルも「どの会社が危ないか」の順番は当てられるのに、「何社つぶれるか」の数は外してしまう。時代によって全体の破綻のしやすさが変わることが本当の難しさだ、という点が面白いところです。", "unverified": "各モデルのブライアスコアの値は抄録に記載がなく未確認。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "経済学の就職市場候補者に自信の男女差", "title": "Confidence of Job Market Candidates: Is there a Gender Gap? *", "url": "https://doi.org/10.2139/ssrn.7661961", "authors": "Patricia Funk ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Funk, P., Marchese, A., & Intinghero, R. (2026). Confidence of Job Market Candidates: Is there a Gender Gap? *. https://doi.org/10.2139/ssrn.7661961", "why": "上位100学部の候補者の就職論文の言葉遣いを語彙法とLLMで測り、自信の表現の男女差を大規模に示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "経済学の就職市場の候補者の就職論文で、女性は男性より自信の弱い書き方をしていることを大規模に示し、書き方が研究の評価を下げることもサーベイ実験で示した（抄録）。", "p2": "研究の評価に性別による差があるとき、その経路の一つとして文章の書き方が考えられるが、大規模な証拠はなかった（抄録）。", "p3": "2019/20〜2024/25の6シーズンに市場に出た上位100学部の候補者について、ためらい表現（ヘッジ）と強調表現（ブースター）を数える語彙法と、自分の研究に関する不確かさの表現を特定するLLM（GPT-5）を組み合わせて、就職論文の自信を測った（抄録）。", "p4": "学部×コホートの固定効果を統制し、研究の質の男女差は平均で小さいと見込める比較を行った。内容を固定して書き方だけを変えた論文の評価をサーベイ実験で比べた（抄録）。", "p5": "どちらの方法でも頑健な男女差があり、女性の候補者は男性より自信の弱い書き方をしていた。実験では、内容が同じでも自信の弱い書き方の論文は研究の質を低く評価された（抄録）。", "p6": "抄録の範囲では、差の大きさ、実験の参加者（専門家か否か）、LLMの測定の検証方法は確認できない。未査読のプレプリント。", "fun": "同じ研究内容でも、「〜かもしれない」と控えめに書くと、評価する人は研究そのものを低く見てしまいます。そして女性の候補者ほど控えめに書いていた。文章の言い回しという小さな違いが、キャリアの差につながりうるという点が興味深いところです。", "unverified": "男女差の大きさと実験の規模は抄録に記載がなく未確認。"}}, {"id": "pn13", "rank": 13, "field": "因果推論", "headline": "高速鉄道の恩恵は周辺の県に届くか", "title": "Do the Benefits of High-Speed Rail Trickle Down? Evidence from the Peripheral Counties in China", "url": "https://doi.org/10.2139/ssrn.7662423", "authors": "Yi Zhu ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Zhu, Y., & Diao, M. (2026). Do the Benefits of High-Speed Rail Trickle Down? Evidence from the Peripheral Counties in China. https://doi.org/10.2139/ssrn.7662423", "why": "最小全域木に基づく操作変数と差の差法で、中国の高速鉄道が周辺県の人口と投資に与えた効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "中国の高速鉄道が周辺の県に恩恵をもたらすかを、最小全域木に基づく操作変数と差の差法で推定し、人口と固定資産投資は増えたが、大都市から150〜200 kmの県では逆に減る「ハブの影」があることを示した（抄録）。", "p2": "高速鉄道は接続性と成長を高めたが、恩恵が周辺に届くのか、中心に吸い取られるのかは議論が分かれている。駅の配置は無作為でないので単純な比較は偏る（抄録）。", "p3": "差の差法で、中心都市への高速鉄道の接続の効果を推定し、駅の非無作為な配置には、主要都市を最短でつなぐ最小全域木（仮想的な最短ネットワーク）の上にあるかどうかを操作変数として使った（抄録）。背景：最小全域木の操作変数は、交通網の効果推定でよく使われる手法である。", "p4": "接続した周辺県と接続していない周辺県の人口、固定資産投資、不動産投資を比べ、上位10大都市からの距離帯別にも比べた（抄録）。", "p5": "中心都市への接続の改善は、全体として周辺県の人口と固定資産投資を増やし、不動産投資にはほとんど効果がなかった。上位10大都市から150〜200 kmの県では、接続後に投資と人口が同じ距離帯の非接続地域より減った（抄録）。", "p6": "抄録の範囲では、効果の大きさの数値と期間は確認できない。解釈：「ハブの影」は、大都市に近すぎると人と資本が吸い上げられるストロー効果と整合的である。未査読のプレプリント。", "fun": "新幹線が通ると田舎も栄えるのか、それとも人が都会に吸い取られるのか。中国の結果は「おおむね栄える。でも大都市から近すぎる町は逆に寂れる」でした。日本でもよく言われるストロー効果が、距離という具体的な条件で見えてくる点が面白いところです。", "unverified": "効果の大きさ、観測期間は抄録に記載がなく未確認。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "有能なエージェントは人に頼らなくなるべきか", "title": "Who Takes the Lead? Model Ability and Task-Conditioned Collaboration with Humans", "url": "https://arxiv.org/abs/2610.27148", "authors": "Weien Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Li, W., Liu, H., Li, Z., Song, R., Dong, Z., & Yuan, Y. (2026). Who Takes the Lead? Model Ability and Task-Conditioned Collaboration with Humans (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27148", "why": "人とエージェントのどちらに優位があるかを統制した共有操作の迷路課題で、協働における主導権の分担を調べた。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§4.3の結果、§5の結論、§6の限界）を読んだ", "preprint": true, "p1": "人とAIエージェントが同じ目標を共有する迷路課題で、能力の高いエージェントほど、人に優位があるときだけ人を関与させる「選択的な分担」をすることを示した（抄録、§4.3）。", "p2": "エージェントが有能になると人への依存は減るが、それが協働の失敗なのか正しい分業なのかは、人の関与の割合だけでは区別できない（§1）。", "p3": "エージェントが操る分身と人が操る分身が、共通の目標に最少の手番で着くことを目指す共有操作の迷路を作った。エージェントは毎手番、自分で動くか人に任せるかを決め、初期配置で人の最短経路の優位（AIが短い、同じ、人が短い）を操作する（§3）。", "p4": "GPT 5.6 Sol、Command A+、Qwen 3.8 27B、Command Rの4モデルについて、まず単独の能力を測り、次に人の参加者と3つの優位条件で共同プレイさせた。各条件40エピソードで、初回の自己行動率などを参加者と迷路のブートストラップ区間で評価した（§4、図2）。", "p5": "Qwen 3.8 27BとGPT 5.6 SolはAIが短いか同じときは常に自分で動き、人が短いときは初回の判断の82.5%で人を関与させた。Command A+は同じ条件で97.5%自分で動き、人が有利なとき77.5%で人を関与させた。Command Rには選択性がなく、完了率は17.5〜45.0%だった（§4.3、図2）。人の関与はほぼすべて助言の形で、完全に任せることはなかった（§4.3）。", "p6": "著者は、4モデルのみ、参加者が少数、1つの迷路環境と手順に限られること、能力と選択性の関係は相関であり因果ではないことを限界に挙げる（§6）。", "fun": "人の手を借りないAIは協力が下手なのか。迷路で試すと、賢いAIは「自分のほうが近いなら自分で、人のほうが近いなら人に任せる」と使い分けていました。人を頼る回数だけを見ると見えないこの使い分けが、能力の弱いAIにはできない。協働の良し悪しの測り方を問い直す点が面白いところです。", "unverified": "参加者の人数と付録の詳細な表は読んでおらず未確認。"}}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "SOC/NOCの分析者はAIをどう受け入れるか", "title": "\"It's Not a Partner\": How SOC and NOC Analysts Accept, Verify, and Work Alongside AI, and What Their Leaders Should Change", "url": "https://doi.org/10.2139/ssrn.7659299", "authors": "Bernard Aderhold", "venue": "SSRN", "date": "2026-10-23", "apa": "Aderhold, B. (2026). “It’s Not a Partner”: How SOC and NOC Analysts Accept, Verify, and Work Alongside AI, and What Their Leaders Should Change. https://doi.org/10.2139/ssrn.7659299", "why": "セキュリティ運用の現場の11人への現象学的研究で、AIの受容・検証・協働の実態と管理職への示唆を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "セキュリティ・ネットワーク運用センター（SOC/NOC）の現場の分析者11人への現象学的研究から、AIの受け入れ方・確かめ方・一緒の働き方の4つの特徴と、根底にある統治の欠陥を示した（抄録）。", "p2": "運用センターはAI道具を急速に導入しているが、それが現場の人に何をもたらすかはほとんど研究されていない（抄録）。", "p3": "2016〜2026年にSOAR、UEBA、AIを組み込んだEDR、生成AIの助手を日常的に使った米国の現場の専門家11人を対象に、記述的な現象学の方法で経験を分析した（抄録）。", "p4": "評価の基準は統計ではなく、語りから共通の主題を抽出することである（抄録、解釈を含む）。", "p5": "分析者は安堵と恐れを同時に抱いてAIを受け入れ、置き換えの不安が解消されないと有用性の認識は受容につながらなかった。信頼は蓄積でなく反応的で、自信満々の誤判定を一度経験した全員が長く過剰な警戒を続けた。AIを相棒とみるか計算機とみるかは、自分の仕事の定義と対応した。仕事で変わったのは技能の低下ではなくプロンプトの書き方だった。その下に、運用者が検査できない出力の責任を全面的に負うという統治の欠陥があった（抄録）。", "p6": "著者は11人の記述的研究であり、研究から言えないことを結びで述べるとしている（抄録）。NISTのAIリスク管理枠組みとISO/IEC 42001に対応づけた管理職への4つの提言は、抄録からは内容を確認できない。未査読のプレプリント。", "fun": "AIの判断を信頼するまでには長い時間がかかるのに、自信満々の間違いを一度見ただけで信頼は崩れ、その後ずっと疑ってかかるようになる。信頼は貯金のようには貯まらない、という発見が身近な人間関係にも通じていて面白い点です。", "unverified": "4つの提言の具体的な内容は抄録に記載がなく未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "指導者のイデオロギーと経済的自由", "title": "Leader's Ideology and Economic Freedom", "url": "https://doi.org/10.2139/ssrn.7651139", "authors": "João Pedro Bastos ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Bastos, J. P., Powell, B., & Regalado, L. (2026). Leader’s Ideology and Economic Freedom. https://doi.org/10.2139/ssrn.7651139", "why": "政府指導者の左右の立場が経済的自由に与える効果を因果的に推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "政府指導者のイデオロギーが経済的自由に与える効果を、初めて因果的に推定したとする研究。右派は市場を自由にし左派は縛る、という通説はおおむね支持されなかった。", "p3": "処置時期のずれを考慮した二重頑健なスタック型の差の差法で、153か国（2000〜2023年、EFW指数）とOECD21か国（1870年以降、HIEL指数）の政権交代を分析した（抄録）。", "p5": "世界標本では左右どちらへの交代にも有意な効果はなかった。OECDで左派への交代が小さな負の効果（政府規模の拡大による）、非OECDで右派への交代が小さな正の効果を持つことが最も頑健な結果だった（抄録）。", "fun": "「右派政権は市場を自由にする」というのはよく聞く話ですが、政権交代の前後を丁寧に比べると、効果はほとんど見えません。政治の看板と実際の経済政策の間には思ったほどの差がない、という意外な結論が面白いところです。", "unverified": "効果の大きさの具体値は抄録に記載がなく未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "組織犯罪の暴力と所得の逆説", "title": "The Violence Paradox: Organized Crime and Mortality", "url": "https://doi.org/10.2139/ssrn.7660679", "authors": "Fernanda Gutierrez Amaros ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Gutierrez Amaros, F., & Zuchowski, D. (2026). The Violence Paradox: Organized Crime and Mortality. https://doi.org/10.2139/ssrn.7660679", "why": "メキシコの燃料盗難が地域の死亡に与える相反する効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "メキシコのパイプラインからの燃料盗難（ウアチコル）が儲かるようになると、殺人は増えたが乳児死亡は減ったことを示した。", "p3": "パイプラインの有無と、盗難の収益性を急に高めた燃料価格のショックを使う差の差法で推定した（抄録）。", "p5": "殺人の増加と乳児死亡の減少が同時に起き、夜間光の増加と、家計の資源に敏感な病気による乳児入院の減少から、地域の経済状況の改善が最も妥当な説明だとした（抄録）。", "fun": "犯罪は地域を危険にしますが、同時にお金ももたらします。その結果、暴力で命が失われる一方で、赤ちゃんの命は救われるという相反する効果が同時に起きていました。なぜ一部の地域が違法な経済に頼り続けるのかを説明する「暴力の逆説」です。", "unverified": "効果の大きさの数値は抄録に記載がなく未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "中国の都市政府の土地価格競争", "title": "Land Offers and Fiscal Competition Between City Governments in China", "url": "https://doi.org/10.2139/ssrn.7659238", "authors": "Wending Liu", "venue": "SSRN", "date": "2026-10-23", "apa": "Liu, W. (2026). Land Offers and Fiscal Competition Between City Governments in China. https://doi.org/10.2139/ssrn.7659238", "why": "都市政府の土地価格設定をベルトラン価格競争として構造推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国の都市政府が工場誘致のために土地を値引きする競争を、ベルトラン価格競争のモデルとして構造推定した。", "p3": "都市政府の土地価格戦略を、工業企業を呼び込む値引き競争として定式化し、推定したモデルで反実仮想の実験を行った（抄録）。", "p5": "企業を誘致すると企業の年間生産の約45%に当たる財政収入が生まれると推定された。この競争が資源配分に与える影響は小さく、財政の集権化や都市の賃金上昇は土地価格を緩やかに上げるにとどまった（抄録）。", "fun": "中国の地方政府は工場を呼ぶために土地を安く売ります。損をしているように見えますが、工場が来れば税収がたくさん入るので、値引きしても割に合う。お店の安売り競争と同じ理屈で政府の行動を説明しているのが面白い点です。", "unverified": "データの期間・都市数は抄録に記載がなく未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "産業革命期の紡績工場の賃金記録と格差", "title": "Technological Progress and Income Inequality in the British Cotton Industry During the Industrial Revolution: Evidence on the Wage Records of Strutt's Belper Mill", "url": "https://doi.org/10.2139/ssrn.7663763", "authors": "Ge Bai", "venue": "SSRN", "date": "2026-10-24", "apa": "Bai, G. (2026). Technological Progress and Income Inequality in the British Cotton Industry During the Industrial Revolution: Evidence on the Wage Records of Strutt’s Belper Mill. https://doi.org/10.2139/ssrn.7663763", "why": "ベルパー工場の4,780件の個人賃金記録から、技術進歩と所得格差の関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "産業革命期の紡績工場ベルパー・ミルの個人賃金記録から、技術段階が進むにつれて賃金格差が広がったことを示した。", "p3": "1805年、1827〜1828年、1834〜1835年の4,780件の賃金記録を、水力紡績機、ミュール主導の混合紡績、大型の動力補助ミュールの3段階に分けて、賃金分布と男女差を分析した（抄録）。", "p5": "1820年代後半の賃金構造はミュール導入の含意と整合的で、利得は少数の高賃金の男性に集中し、多くの労働者、とくに女性は中・下層にとどまった。3段階を通じて賃金差は広がった（抄録）。", "fun": "新しい機械が入ると誰が得をするのか。200年前の工場の給料台帳から、機械を扱える一部の男性だけが大きく稼ぐようになり、格差が広がっていく様子が見えます。AIが仕事を変えている今の議論にもつながる歴史の記録です。", "unverified": "D&Rの略称が指す理論の詳細は抄録からは未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "企業が在宅勤務費を払うと都市は広がる", "title": "The Impact of Working from Home Arrangements on Urban Sprawl When Firms Pay for the Home Office", "url": "https://doi.org/10.2139/ssrn.7661103", "authors": "Remy Le Boennec", "venue": "SSRN", "date": "2026-10-24", "apa": "Le Boennec, R. (2026). The Impact of Working from Home Arrangements on Urban Sprawl When Firms Pay for the Home Office. https://doi.org/10.2139/ssrn.7661103", "why": "在宅勤務の費用負担を組み込んだ都市モデルで、郊外化への影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "在宅勤務で必要になる自宅の作業空間の費用を、家計と企業のどちらが払うかで都市の広がり方が変わることを、単一中心都市モデルで示した。", "p3": "在宅勤務なしの基準と、家計が費用を負担する場合、企業が負担する場合の3つを比べた（抄録）。", "p5": "どちらの場合も在宅勤務で都市の境界は外に広がり、家計が負担する場合のほうが企業が負担する場合より郊外化が抑えられた（抄録）。", "fun": "在宅勤務でオフィスが要らなくなれば都市は小さくなりそうですが、家に仕事部屋が必要になるので逆に広がります。しかも誰が部屋代を払うかで広がり方が変わる。お金の出どころが街の形を変えるという点が面白いところです。", "unverified": "郊外化を抑える政策の結論は抄録の途中で切れており未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "中央銀行会見の感情の「形」を測る", "title": "From Tone to Trajectory: Continuous Sentiment and the Shape of Monetary Policy Communication (Martin Feldkircher, Márton Kardos, Kristoffer Laigaard Nielbo)", "url": "https://econpapers.repec.org/RePEc:onb:oenbwp:281", "authors": "Martin Feldkircher ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "会見内の感情の推移の形が市場に情報を持つかを、連続的な感情指標で調べた。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された抄録を使用", "preprint": true, "short": true, "p1": "中央銀行の記者会見の感情の平均ではなく、会見の中での感情の推移の「形」が、政策金利の決定を予測することを示した。", "p3": "ECBの記者会見について、金融政策のスタンス、経済見通し、不確実性の3つの次元で感情の弧（アーク）を作り、政策金利の変更とインフレ期待に対する予測力を調べた（抄録）。", "p5": "弧の形は辞書ベースの指標を超えて金利決定を頑健に予測し、専門家のインフレ期待の更新にも影響した。結果はFRBの会見の短い標本でも成り立った（抄録）。", "fun": "同じ「強気」の会見でも、最初に強気を言うのか、最後に念を押すのかで伝わる意味が違います。話の平均的な雰囲気ではなく、話の組み立て方そのものに情報があるという発見は、物語の構成を分析する文学研究の発想とも重なっていて面白い点です。", "unverified": "予測力の改善の数値は抄録に記載がなく未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "予測市場Kalshiの本命・大穴バイアス", "title": "Why the Last Trade Is the Wrong Price: Measuring Favorite-Longshot Bias on Kalshi", "url": "https://doi.org/10.2139/ssrn.7658058", "authors": "Darsh Shah", "venue": "SSRN", "date": "2026-10-23", "apa": "Shah, D. (2026). Why the Last Trade Is the Wrong Price: Measuring Favorite-Longshot Bias on Kalshi. https://doi.org/10.2139/ssrn.7658058", "why": "米国の予測市場で大穴が価格ほど勝たない偏りを測り、最終取引価格の問題を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "米国の予測市場Kalshiで本命・大穴バイアスを調べ、最終取引価格を使うと測定の誤りで巨大な偏りが見えてしまうことを示した。", "p3": "スポーツと日々の天気の決済済み26,192市場を、最終取引価格と、結果が分かる前の価格の両方で分析した（抄録）。", "p5": "最終取引価格では最安値帯の17,612市場のうち勝ちは16件（期待約229件）だったが、これは結果判明後の取引による誤りだった。結果判明前の価格では2026年のMLB810試合で大穴の勝率40.6%に対し平均価格42.6%で、差は偶然と区別できなかった（p=0.24）（抄録）。", "fun": "一見すると「大穴は値段ほど勝たない」という大きな偏りが見つかったのに、よく調べると試合が終わって勝者が分かってから付いた値段を使っていただけでした。データの測り方ひとつで存在しない法則が生まれてしまう、という教訓が面白い点です。", "unverified": "ビットコイン市場の詳細な結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "農業フロンティア拡大と地域の厚生", "title": "Agricultural Frontier Expansion and Local Welfare: Evidence from Matopiba, Brazil", "url": "https://doi.org/10.2139/ssrn.7657818", "authors": "Paulo Roberto Silva", "venue": "SSRN", "date": "2026-10-23", "apa": "Silva, P. R. (2026). Agricultural Frontier Expansion and Local Welfare: Evidence from Matopiba, Brazil. https://doi.org/10.2139/ssrn.7657818", "why": "ブラジルのマトピバで大豆の拡大が農村自治体の厚生を高めたかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ブラジルのマトピバで大豆の作付けが急拡大しても、農業の正規雇用は増えたが、地域の厚生の改善は検出されなかった。", "p3": "セラードの1,163自治体で、土地利用図、夜間光、建物、所得・雇用・健康・教育・格差の指標を組み合わせ、時期のずれた差の差法、平行トレンドの感度分析、大豆の潜在収量に基づく操作変数で推定した（抄録）。", "p5": "大豆の面積は2000〜2022年に約70万haから520万haに増え、農業の正規雇用は約15%増えたが、乳児死亡、学校の質、人間開発指数、貧困、格差はどの推定でも反応しなかった（抄録）。", "fun": "畑が7倍以上に広がって景気が良くなりそうなのに、地元の人の暮らしはほとんど変わらなかった。最新の差の差法と操作変数を重ねても結果は同じで、儲けが地域の外に流れている可能性を示す、開発の「恩恵は誰のものか」を問う研究です。", "unverified": "1人当たりGDPの約6%増の解釈は抄録の途中で切れており未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "拡散言語モデルは課題と言語で速度が変わる", "title": "Diffusion Language Models Change Speed Across Tasks and Languages", "url": "https://arxiv.org/abs/2610.25835", "authors": "Mohsen Fayyaz ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Fayyaz, M., Modarressi, A., Israel, D., Bandarkar, L., & Peng, N. (2026). Diffusion Language Models Change Speed Across Tasks and Languages (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25835", "why": "並列生成する拡散言語モデルで、同じ長さの出力でも課題や言語で計算量が大きく変わることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "拡散言語モデルの計算量（1トークンあたりの前向き計算の回数）が、課題と言語によって大きく変わることを示した。", "p3": "2つの拡散モデルを10の課題で分析し、出力の新しさと単語の珍しさとの関係を調べた（抄録）。", "p5": "DiffusionGemmaでは物語の執筆が文法修正の3倍以上の回数を要し、トークン化の多い言語ほど回数が増えた。同じ数学問題では誤答ほど回数が多く、復号の速さで候補を重み付けすると多数決より最大4.2ポイント良くなった（抄録）。", "fun": "入力を写すだけの作業は速く、新しいことを書く作業は遅い。人間と同じような性質が、AIの計算量にも表れます。さらに「迷って時間がかかった答えほど間違っている」ので、速さを自信の目安に使えるという発見が面白い点です。", "unverified": "4.2ポイントの比較条件の詳細は抄録の途中で切れており未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "AIエージェントは自分の評価器を作れるか", "title": "EvalResearchBench: Can AI Agents Build Their Own Feedback for Recursive Self-Improvement?", "url": "https://arxiv.org/abs/2610.04184", "authors": "Yaolun Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Zhang, Y., Xu, T., Zhao, Y., Zhao, J., Wu, Q., & Wang, H. (2026). EvalResearchBench: Can AI Agents Build Their Own Feedback for Recursive Self-Improvement? (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.04184", "why": "再帰的自己改善に必要な評価フィードバックをエージェント自身が構築できるかを測るベンチマーク。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントが、自分を評価するための小さな評価器（ベンチマーク）を自ら設計できるかを測るベンチマークEvalResearchBenchを作った。", "p3": "9つの研究者エージェントと13の候補モデルで、凍結した評価器が14の目標ベンチマークとどれだけ順位を一致させるかを測った（抄録）。", "p5": "最良の評価器はモデルの組の約75%を目標と同じ順に並べたが、目標同士の不一致による上限91%には届かなかった。人が設計した公開課題の標本も強い基準として残った（抄録）。", "fun": "AIが自分で自分を改良していくには、「良くなったかどうか」を安く速く測る物差しが必要です。その物差しづくりまでAIに任せられるかを試したところ、まだ人間の作る物差しにかなわない、という現在地を示した点が面白いところです。", "unverified": "評価対象の課題領域の詳細は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "毎秒数百万フレームのドローン模擬器", "title": "HyperDrone: Simulation-to-Reality Transfer at Millions of Frames per Second", "url": "https://arxiv.org/abs/2610.28950", "authors": "Jonas Eschmann ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Eschmann, J., & Loianno, G. (2026). HyperDrone: Simulation-to-Reality Transfer at Millions of Frames per Second (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28950", "why": "既存より20倍以上速いバッチ描画のクアッドロータ模擬器で、模擬から実機への転移を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "既存より20倍以上速いクアッドロータの一括描画シミュレータHyperDroneを作り、模擬だけで学んだ方策を実機に移せることを示した。", "p3": "最適化した機体の力学と、新しい光線追跡エンジンHyperLux（OptiX・Vulkan・Metal・WebGPUに対応）を、すべてGPU上で動かした（抄録）。", "p5": "最高の忠実度でも民生のGPUで毎秒数百万フレームを描画し、模擬だけで学習した視覚に基づく向きの制御方策を、カメラ付きの小型実機（Crazyflie）に搭載して動かした（抄録）。", "fun": "ロボットに目で見て飛ぶことを教えるには膨大な練習が必要ですが、実機で練習すると壊れます。ゲームのような仮想空間で、1秒に数百万枚の景色を見せて練習させ、そのまま本物で飛ばせるというのが面白い点です。", "unverified": "実機での成功率などの数値は抄録に記載がなく未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "自動運転の知覚と再構成を一つのモデルに", "title": "Foundation4D: Towards a unified perception and reconstruction model for autonomous vehicles", "url": "https://arxiv.org/abs/2610.30340", "authors": "NVIDIA ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "NVIDIA, : Agostinho, S., Apodaca, M., Attia, E., Braso, G., Dong, G., Fedorov, I., Fenzi, M., Huang, G., Huang, J., Huang, S., Ke, B., Leal-Taixé, L., Lee, K.-T., Liu, M., Liu, T., Meinhardt, T., Ošep, A., … Zhou, Q. (2026). Foundation4D: Towards a unified perception and reconstruction model for autonomous vehicles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30340", "why": "多カメラ映像から形状・検出・占有・ガウス再構成を一体で推定する統合モデル。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "多カメラの走行映像から、形状推定、3次元検出、意味的占有、ガウス再構成を一つのモデルで行うFoundation4Dを作った。", "p3": "カメラと時間を分解した注意機構の共有骨格と、姿勢グラフ最適化による軌跡の改善を組み合わせ、1,253の走行クリップの評価用データも公開した（抄録）。", "p5": "比較手法の中でWaymoとnuScenesの深度誤差が最小、nuScenesの検出mAPとOpenOccupancyの占有mIoUが最高だった。検出を形状・占有と同時に学ぶと上位クラスのmAPが1.2ポイント上がった（抄録）。", "fun": "自動運転の車は、距離を測る、物を見つける、空間を埋める、という別々の仕事を別々のAIでこなしてきました。一つにまとめると互いの学習が助け合い、どれも少しずつ良くなる。「まとめて学ぶほうが賢くなる」という点が面白いところです。", "unverified": "各ベンチマークの具体値は抄録に記載がなく未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "時系列基盤モデルの電池劣化予測を漏れなく評価", "title": "Zero-shot time-series foundation models for battery degradation forecasting: a leakage-aware multi-dataset benchmark with conformal uncertainty", "url": "https://doi.org/10.2139/ssrn.7661699", "authors": "Lukáš Raszka ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Raszka, L., & Grycz, O. (2026). Zero-shot time-series foundation models for battery degradation forecasting: a leakage-aware multi-dataset benchmark with conformal uncertainty. https://doi.org/10.2139/ssrn.7661699", "why": "情報漏れを避けた複数データの評価で、時系列基盤モデルのゼロショット電池劣化予測を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "時系列基盤モデルによる電池劣化のゼロショット予測を、情報漏れのない設計で検証し、そのままでは線形外挿に負けることを示した。", "p3": "5つの公開モデルで、13データの429セルの健康状態の軌跡と残存寿命を、健康状態90%と85%の時点から予測し、線形・べき・指数の外挿と勾配ブースティングと比べた（抄録）。", "p5": "生の容量系列ではどのモデルも失敗し、11〜59%の予測が80%の閾値に達せず、寿命誤差は線形外挿の1.6〜16倍だった。局所的な線形傾向に固定すると改善し、Chronos-2の寿命誤差の中央値は8.4%（線形外挿は10.2%）だった（抄録）。", "fun": "大量のデータで学んだ汎用のAIなら電池の寿命も当てられそう、という期待を冷静に検証した研究です。よく使われる誤差の指標では失敗が隠れてしまい、単純な直線の延長に負けていました。評価の仕方次第で結論が変わるという教訓が面白い点です。", "unverified": "条件別・データ別の内訳は未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "深層カーネルヘッジ", "title": "Deep kernel hedging", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.34474", "authors": "Jean-Loup Dupret ほか", "venue": "RePEc NEP", "date": "2026-10-12", "apa": "Dupret, J.-L., Hainaut, D., & Motte, E. (2026). Deep kernel hedging (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2609.34474", "why": "深層学習とカーネル法の帰納バイアスを組み合わせたヘッジの枠組み。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された抄録を使用", "preprint": true, "short": true, "p1": "深層学習の柔軟さとカーネル法の構造を組み合わせた、デリバティブのヘッジの枠組みを示した。", "p3": "ヘッジ関数を、ニューラルネットの埋め込みでパラメータ化したカーネルの再生核ヒルベルト空間に制限し、一般化した表現定理で有限次元の問題に帰着させ、ランダムフーリエ特徴で計算を軽くした（抄録）。", "p5": "合成データと実データで、標準のカーネル法や深層ヘッジと比べて競争力があり、とくにデータの少ない状況で頑健な性能を示したとする（抄録）。", "fun": "損失を打ち消すための取引（ヘッジ）を機械に学ばせるとき、データが少ないと深層学習は暴走しがちです。数学的に扱いやすい「型」に当てはめつつ、その型の中身を学習させるという折衷の発想が面白い点です。", "unverified": "性能差の数値は抄録に記載がなく未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "事象列予測を生成モデルとして評価する", "title": "Realism VS Accuracy: Event Sequence Forecasting from a Generative Modeling Perspective", "url": "https://arxiv.org/abs/2610.12586", "authors": "Dmitry Osin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Osin, D., Surkov, E., Mokrov, P., Udovichenko, I., Karpukhin, I., Burnaev, E., Shvetsov, E., & Korotin, A. (2026). Realism VS Accuracy: Event Sequence Forecasting from a Generative Modeling Perspective (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12586", "why": "事象列予測で、現実らしさと正確さのどちらを重視するかを生成モデルの観点から整理した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "事象列の多期先予測を条件付き生成の問題として捉え、予測の正確さと分布の現実らしさの両方で評価するベンチマークを作った。", "p3": "両方の質の指標、統計的な基準、隣接分野から移したモデル、実データを揃え、拡散モデルの標本を予測器に集約するWasserstein BaryBoosterを提案した（抄録）。", "p5": "正確さと現実らしさの両方で優れる手法はなく、両者のトレードオフが示された。BaryBoosterで現実らしさを正確さに変換できることを示した（抄録）。", "fun": "未来の出来事の並びを予測するとき、「一番ありそうな一つの答え」と「本当らしいばらつき」は両立しにくい。天気予報の平均値と、実際の天気の揺れの違いに似ています。そのばらつきを平均の精度向上に役立てるという発想が面白い点です。", "unverified": "性能の数値は抄録に記載がなく未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "AIプラセボ効果のベイズ的再分析", "title": "Computational Mechanisms of the AI Placebo Effect: A Bayesian Re-Analysis of Expectation-Driven Performance in Human–Computer Interaction", "url": "https://doi.org/10.31234/osf.io/5b3xh_v3", "authors": "Utkarsh Mishra", "venue": "PsyArXiv", "date": "2026-10-23", "apa": "Mishra, U. (2026). Computational Mechanisms of the AI Placebo Effect: A Bayesian Re-Analysis of Expectation-Driven Performance in Human–Computer Interaction. https://doi.org/10.31234/osf.io/5b3xh_v3", "why": "AIの支援を信じるだけで成績が変わる現象を、計算論的なベイズモデルで再分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "「AIに助けてもらっている」と信じるだけで成績が変わるAIプラセボ効果を、階層ベイズの計算モデルで再分析した。", "p3": "Kosch et al.（2022）の実験2（N=75）を、事前の成績期待の平均・精度・その両方が変わる3つのモデルで比べ、LOO交差検証で選んだ（抄録）。", "p5": "両方が変わるモデルが強く支持された（elpd差7.11）が、集団の平均では期待の平均にも精度にも確かな変化はなかった（抄録）。", "fun": "偽のAIでも「助けてくれる」と思えば人の期待が変わる。ところが平均すると効果が消えるのは、人によって期待が上がったり下がったりして打ち消し合うからかもしれません。平均だけ見ると見落とす個人差に光を当てる点が面白いところです。", "unverified": "個人レベルの結果は抄録の途中で切れており未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "子どもの発育阻害リスクモデルの較正と公平性", "title": "Calibration and subgroup fairness of a childhood stunting risk model: a cross-sectional analysis of the Bangladesh Demographic and Health Survey 2022", "url": "https://doi.org/10.31235/osf.io/zrpu6_v1", "authors": "Sweety Akter", "venue": "SocArXiv", "date": "2026-10-24", "apa": "Akter, S. (2026). Calibration and subgroup fairness of a childhood stunting risk model: a cross-sectional analysis of the Bangladesh Demographic and Health Survey 2022. https://doi.org/10.31235/osf.io/zrpu6_v1", "why": "バングラデシュの人口保健調査で、リスクモデルの較正と部分集団の公平性を検証した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用", "preprint": true, "short": true, "p1": "子どもの発育阻害のリスクモデルを、判別力ではなく較正と部分集団の公平性を主な評価として検証した。", "p3": "バングラデシュ人口保健調査2022の4,105人（670調査区）で、身体計測前に得られる13の予測変数を使い、正則化ロジスティック回帰とXGBoostを、調査区が重ならない学習3,315人・評価790人で比べた（抄録）。", "p5": "加重有病率は23.2%だった。抄録の範囲では較正と公平性の具体的な結果は示されていない（抄録）。", "fun": "病気のリスクを当てるモデルは「どれだけ見分けられるか」で評価されがちですが、「30%と言ったら本当に3割が当たるか」という較正や、地域や家庭によって当たり外れが偏らないかも大切です。評価の重心を移すべきだという問題提起が面白い点です。", "unverified": "較正・公平性の結果は抄録の途中で切れており未確認。"}}, {"id": "pn33", "rank": 33, "field": "教育", "headline": "有界な教育指標のための平均パラメータ化モデル", "title": "A Mean-Parameterized Power-Logit Model for Bounded Educational Outcomes: Mathematical Formulation, Likelihood Inference, and a Reproducible Evaluation Framework", "url": "https://doi.org/10.2139/ssrn.7659080", "authors": "Kamal Singh Kunwar", "venue": "SSRN", "date": "2026-10-23", "apa": "Kunwar, K. S. (2026). A Mean-Parameterized Power-Logit Model for Bounded Educational Outcomes: Mathematical Formulation, Likelihood Inference, and a Reproducible Evaluation Framework. https://doi.org/10.2139/ssrn.7659080", "why": "0と1を含む比率データに使える平均パラメータ化パワー・ロジットモデルと評価枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "0と1の間に収まる教育の比率データのために、ベータ分布を変換した平均パラメータ化のパワー・ロジットモデルと、その評価手順を示した。", "p3": "Xがベータ分布に従うとき、Y=logit⁻¹{μ+σ logit(X)}とし、累積分布関数と分位関数を閉じた形で得て、最尤推定と観測情報量による標準誤差を使う（抄録）。", "p5": "数学的な正則性、数値検証、複数の標本サイズでの模擬などの完全な検証手順を定めた。新規性は既存の族と重なりうるため、主張ではなく実証と文献の問いとして扱うとした（抄録）。", "fun": "合格率や出席率のように0から1の間に収まり、しかも端に寄りやすいデータは、普通の正規分布ではうまく表せません。ロジットという変換で引き伸ばしてから形を調整する、という工夫です。新しさを自ら控えめに扱う著者の姿勢も珍しい点です。", "unverified": "実データでの適用結果は抄録の範囲では未確認。"}}, {"id": "pn34", "rank": 34, "field": "組織行動・心理的安全性", "headline": "エージェントAIが創業チームの最小人数を下げる", "title": "The Augmented Solo Founder: How Agentic AI Lowers the Minimum Viable Team in New Ventures", "url": "https://doi.org/10.2139/ssrn.7662541", "authors": "Lalit Gautam", "venue": "SSRN", "date": "2026-10-23", "apa": "Gautam, L. (2026). The Augmented Solo Founder: How Agentic AI Lowers the Minimum Viable Team in New Ventures. https://doi.org/10.2139/ssrn.7662541", "why": "エージェント型AIで単独創業者でも事業を立ち上げられる条件を論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "エージェント型AIによって、新事業を始めるのに必要な最小の人数（最小実行可能チーム）がどこまで下がるかを論じた概念論文。", "p3": "市場調査、製品開発、マーケティング、顧客対応、財務・管理などの6つの機能を、AIがほぼ代替できる、創業者の指示で補強できる、創業者の判断に残すべき、の3つに分類する枠組みを作った（抄録）。", "p5": "AIは実行の制約を緩めるが判断の制約は緩めないため、実行が豊富になるほど、創業者の判断と、事業が得られる信頼と販路が希少な資源になると論じた（抄録）。", "fun": "昔は会社を始めるには、作る人、売る人、お金を管理する人が必要でした。AIが手を動かす部分を担えば一人でも始められます。でも「何をやるか決める」「信頼してもらう」はAIに任せられない。何が希少になるかが変わるという視点が面白い点です。", "unverified": "実証は含まない概念論文。命題の内容は抄録の途中で切れており未確認。"}}, {"id": "pn35", "rank": 35, "field": "組織行動・心理的安全性", "headline": "学生開発チームの生成AIと人の仕事の統治", "title": "Beyond Permitted Use: Governing Generative AI and Human Work in Student Software Teams", "url": "https://doi.org/10.2139/ssrn.7661198", "authors": "Wardah Naeem Awan ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Awan, W. N., Paasivaara, M., & Gloor, P. A. (2026). Beyond Permitted Use: Governing Generative AI and Human Work in Student Software Teams. https://doi.org/10.2139/ssrn.7661198", "why": "ソフトウェア開発の卒業研究チームで、生成AIの利用を個人の規律ではなくチームの統治として扱う必要を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業の顧客と組む学生のソフトウェア開発チームで、生成AIの使い方がどう統治されているかを質的に調べた。", "p3": "8チーム66人の学生の振り返りを、反省的テーマ分析で分析した。授業は顧客が許す範囲での生成AIの利用を認めていた（抄録）。", "p5": "顧客主導、チーム統治、個人判断の3つの統治の型が見つかり、作業は実装から生成物の確認・テスト・修正へ移った。確認の担い手はチームによって異なり、生成AIを使った本人が直すとは限らなかった（抄録）。", "fun": "AIの使用は「個人のカンニング問題」として語られがちですが、チームで働くと「誰が使い方を決め、誰が間違いを直すのか」という組織の問題になります。プログラマーの仕事が書くことから確かめることへ移っていく様子も興味深い点です。", "unverified": "授業への具体的な提言の内容は抄録の途中で切れており未確認。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "株式型クラファン解禁で女性主導の支援型案件が苦戦", "title": "When One Door Opens, Another Narrows: Equity Crowdfunding Legalization and Female-Led Campaign Success on Reward-Based Crowdfunding", "url": "https://doi.org/10.2139/ssrn.7662802", "authors": "Jihoon Hong ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Hong, J., Puranam, D., & Tellis, G. J. (2026). When One Door Opens, Another Narrows: Equity Crowdfunding Legalization and Female-Led Campaign Success on Reward-Based Crowdfunding. https://doi.org/10.2139/ssrn.7662802", "why": "株式型クラウドファンディングの合法化が、支援型での女性主導の案件の成功に与えた影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "株式型クラウドファンディングの合法化の後、購入型（Kickstarter）での女性主導の案件の成功が下がったことを示した。", "p3": "カナダの州（2015年）と米国（2016年）の規制変更を、合成差の差法で分析した（抄録）。", "p5": "どちらの国でも女性主導の案件の成功に負の推定値が出て、男性主導では有意でなかった。米国の推定は処置後の年を1年加えてもほとんど変わらなかった（抄録）。", "fun": "起業家に新しい資金調達の道を開く規制緩和が、思わぬところで女性起業家に不利に働いていました。投資型の場が開くと、支援者や案件が移動して、女性が得意だった購入型の場が細るのかもしれない。善意の政策の副作用を捉えた点が面白いところです。", "unverified": "効果の大きさの数値、仕組みの検証の詳細は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "IEEE 802.11に見る標準化と技術の普及", "title": "Technological Trajectories, Institutional Commitment, and Ecosystem Diffusion in Standards-Based Innovation: Evidence from IEEE 802.11", "url": "https://doi.org/10.2139/ssrn.7661838", "authors": "Amrutha Belakavady Sundaresha Moorthy", "venue": "SSRN", "date": "2026-10-23", "apa": "Belakavady Sundaresha Moorthy, A. (2026). Technological Trajectories, Institutional Commitment, and Ecosystem Diffusion in Standards-Based Innovation: Evidence from IEEE 802.11. https://doi.org/10.2139/ssrn.7661838", "why": "無線LAN規格を例に、技術の軌跡・制度的約束・生態系への普及の関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "無線LAN規格IEEE 802.11の世代ごとに、特許の動き、特許の約束（LOA）の集中、認証製品の普及の関係を一つの枠組みで分析した。", "p3": "Wi-Fi 5、6、7とWi-Fi Awareについて、技術に近い特許の強度、LOAの集中度（HHI）、Wi-Fi Allianceの認証製品の採用の3層のモデルを作った（抄録）。", "p5": "特許活動の持続の長さは、特許の山の高さより、普及の広さを強く予測した。LOAの集中は動的に変わり、普及に必ず先行するわけではなかった（抄録）。", "fun": "新しい技術が広まるかどうかは、一時的に特許が大量に出るかより、どれだけ長く改良が続くかで決まる。花火のような盛り上がりより、息の長い取り組みが大事だという、身近なWi-Fiから見える技術普及の法則が面白い点です。", "unverified": "統計的な検定の詳細は抄録に記載がなく未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "半導体産業のオープンなビジネスモデル革新", "title": "Open Business Model Innovation, Industrial Architecture Transformation, and Ecosystem Leadership: A Longitudinal Study of the Semiconductor Industry", "url": "https://doi.org/10.2139/ssrn.7662076", "authors": "Hsin-Min Hung", "venue": "SSRN", "date": "2026-10-23", "apa": "Hung, H.-M. (2026). Open Business Model Innovation, Industrial Architecture Transformation, and Ecosystem Leadership: A Longitudinal Study of the Semiconductor Industry. https://doi.org/10.2139/ssrn.7662076", "why": "半導体産業の長期事例で、ビジネスモデル革新が産業構造と生態系の主導権を変える過程を追った。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "1980〜2025年の半導体産業の歴史的事例から、オープンなビジネスモデルの革新が産業の構造を変え、生態系の主導権を生む過程を示した。", "p3": "演繹的な事例研究の設計で、記録資料と二次資料を時期に区切り、5つの事前の命題とのパターン照合で評価した（抄録）。", "p5": "受託製造専業（ファウンドリ）のモデルにより、垂直統合企業に集中していた革新活動が組織の境界を越えて分散し、専門化と相互依存が深まり、その調整を担う者が主導権を得る累積的な過程が見いだされた（抄録）。", "fun": "設計も製造も自前で行うのが当たり前だった半導体業界で、「作るだけ」の会社が現れたことで、業界全体の分業の形が変わりました。一社の商売のやり方が業界の地図を描き直すという、ビジネスモデルの力を示す歴史の話が面白い点です。", "unverified": "命題ごとの照合結果の詳細は未確認。"}}, {"id": "pn39", "rank": 39, "field": "教育", "headline": "インドの学校統合の財政効果と制約", "title": "What Consolidation Buys: The Fiscal Case for School Closure in India, and What Actually Constrains It", "url": "https://doi.org/10.2139/ssrn.7663640", "authors": "Adesh Mishra", "venue": "SSRN", "date": "2026-10-24", "apa": "Mishra, A. (2026). What Consolidation Buys: The Fiscal Case for School Closure in India, and What Actually Constrains It. https://doi.org/10.2139/ssrn.7663640", "why": "カルナタカ州の5年分の全数データで、小規模校の統合が教員不足を解消するという前提を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "インド・カルナタカ州の全校データで、小規模校を統合すれば教員不足が解消するという前提を検証し、そもそも不足がないことを示した。", "p3": "74,309校の5年分の全数データで、教員1人あたり児童数、統合で浮く教員数、教員費の回収割合ごとの財政効果を推計した（抄録）。", "p5": "2023〜24年に農村の公立初等学校の81.5%が教員1人あたり30人の基準を下回り、449件の統合で浮いた教員は1件あたり1.12人だった。25年間の効果は回収割合により34〜309億ルピー規模（中央値116億）だった（抄録）。", "fun": "小さな学校を閉じれば先生が余り、足りない学校に回せる、というのが統合の理屈です。ところが全数を調べると、先生はもともと足りていました。政策の前提そのものをデータで確かめると、議論の土台が崩れることがあるという例です。", "unverified": "金額の単位はcrore（千万ルピー）で、ここでは換算せず概数で示した。原文は₹34 crore、₹309 crore、₹116 crore。"}}, {"id": "pn40", "rank": 40, "field": "教育", "headline": "誤りへの敏感さと学業の自己評価の関係", "title": "Beyond Apparent Reciprocity: Longitudinal Relations Among Error Sensitivity, Self-Perceived Academic Ability, and Achievement Goals", "url": "https://doi.org/10.31234/osf.io/dm28g_v1", "authors": "Maxim Likhanov ほか", "venue": "PsyArXiv", "date": "2026-10-23", "apa": "Likhanov, M., Butera, F., Huguet, P., Bressoux, P., Demolliens, M., Batruch, A., Bouet, M., Brown, G., Cherbonnier, A., Darnon, C., de Place, A.-L., Desrichard, O., Fillon, A. A., Goron, L., Jamet, E., Mazenod, V., Mella, N., Michinov, E., Michinov, N., et al. (2026). Beyond Apparent Reciprocity: Longitudinal Relations Among Error Sensitivity, Self-Perceived Academic Ability, and Achievement Goals. https://doi.org/10.31234/osf.io/dm28g_v1", "why": "誤りへの敏感さ、学業能力の自己認識、達成目標の縦断的な関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "誤りへの敏感さ、学業能力の自己認識、達成目標の関係を3時点で追い、見かけの相互関係の多くが人の間の差によるものだと示した。", "p3": "フランスの職業教育の生徒10,163人を2年度3時点で追い、通常の交差遅延パネルモデルと、ランダム切片つきのモデル（RI-CLPM）を4つの目標ごとに推定した（抄録）。", "p5": "通常のモデルは相互関係を示したが、RI-CLPMでは強い関連は人の間の水準だけで、人の中では、前の誤りへの敏感さと能力の自己認識がその後の3つの目標をわずかに高め、逆向きの効果はなかった（抄録）。", "fun": "「AとBが互いに影響し合う」ように見えても、実はもともとAもBも高い人と低い人がいるだけ、ということがあります。人と人の違いと、一人の中の変化を分けて見る統計の工夫で、教育の因果の見え方が変わるという点が面白いところです。", "unverified": "効果の大きさの数値は抄録に記載がなく未確認。"}}, {"id": "pn41", "rank": 41, "field": "環境・気候政策", "headline": "任意の炭素ポイント制度が地方で広がる条件", "title": "What turns a voluntary carbon policy into local adoption: Evidence from China’s carbon generalized system of preferences", "url": "https://doi.org/10.2139/ssrn.7661986", "authors": "Xiangnan Song ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Song, X., Zhao, Z., Xue, W., & Pan, C. (2026). What turns a voluntary carbon policy into local adoption: Evidence from China’s carbon generalized system of preferences. https://doi.org/10.2139/ssrn.7661986", "why": "中国の炭素普恵制度が地方で採用される条件を実証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "個人の低炭素行動をポイントに換える中国の任意制度（炭素普恵制度、CGSP）が、どの都市でいつ採用されるかの要因を示した。", "p3": "252都市のパネルで離散時間のイベントヒストリー分析を行い、刺激-生体-反応（SOR）理論と媒介分析で、地方政府の政策価値の認識の役割を調べた（抄録）。", "p5": "政策の模倣、環境規制、政府間競争が採用の可能性を高め、模倣の限界効果が最大だった。内部条件では財政支出の分権化だけが正に関連した。要因は普及の段階で変わった（抄録）。", "fun": "エコな行動にポイントを付ける仕組みは、どこの都市でも始められるのに、始める都市と始めない都市があります。決め手は「隣がやっているから」という模倣が一番強かった。政策もはやりのように広がるという点が面白いところです。", "unverified": "段階別の結果の詳細は抄録の途中で切れており未確認。"}}, {"id": "pn42", "rank": 42, "field": "環境・気候政策", "headline": "化石燃料大手の移行計画の戦略的曖昧さ", "title": "Climate transition or delay tactics? Strategic ambiguity in CSRD Climate Transition Plans by European fossil fuel majors", "url": "https://doi.org/10.2139/ssrn.7661762", "authors": "Eve Ernst", "venue": "SSRN", "date": "2026-10-23", "apa": "Ernst, E. (2026). Climate transition or delay tactics? Strategic ambiguity in CSRD Climate Transition Plans by European fossil fuel majors. https://doi.org/10.2139/ssrn.7661762", "why": "CSRDの気候移行計画で、欧州の化石燃料大手が曖昧な表現で法的リスクを管理していることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "EUの企業持続可能性報告指令（CSRD）に基づく気候移行計画で、欧州の化石燃料大手が戦略的な曖昧さを使っていることを示した。", "p3": "化石燃料比率の高いEUの大手エネルギー企業11社の2024年の最初のCSRD準拠報告を、質的内容分析した（抄録）。", "p5": "化石燃料による解決論、説明責任の回避、責任の分散（「ブリュッセルの霧」）など6つの語りの戦略が見つかり、うち3つはCSRD/ESRSの法的構造そのものに根ざしていた。報告排出量の約87%を占めるスコープ3の記述は不十分だった（抄録）。", "fun": "報告のルールを厳しくすれば企業は本音を書く、とは限りません。ルールの言葉づかいの隙間を使って、やっているように見せつつ先送りする書き方が見つかりました。規則そのものが曖昧さの道具になりうるという指摘が面白い点です。", "unverified": "6つの戦略の頻度などの数値は抄録に記載がなく未確認。"}}, {"id": "pn43", "rank": 43, "field": "環境・気候政策", "headline": "コーヒー小農の気候適応と抑うつ症状", "title": "Adoption of Climate-Smart Practices among Coffee Smallholders: Climate Change Perceptions, Certification, and Depressive Symptoms", "url": "https://doi.org/10.2139/ssrn.7664928", "authors": "Hannah Wey ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Wey, H., Grünig, M., Jäggi, L., Karungi, J., Atuhaire, A., & Fuhrimann, S. (2026). Adoption of Climate-Smart Practices among Coffee Smallholders: Climate Change Perceptions, Certification, and Depressive Symptoms. https://doi.org/10.2139/ssrn.7664928", "why": "気候変動の認識、認証、抑うつ症状がコーヒー小農の気候適応の採用に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ウガンダのアラビカコーヒー小農の気候スマート農業の採用を、気候変動の認識、認証、抑うつ症状などから説明した。", "p3": "ムバレ県の514人（2024年10〜11月の調査）で、14の実践それぞれの採用をロジスティック回帰で分析した。計画的行動理論に基づき、気候変動の認識、認証の有無、PHQ-9の抑うつ症状などを説明変数にした（抄録）。", "p5": "アグロフォレストリー（73%）と有機肥料（96%）の採用は高く、耐性品種（22%）と灌漑（4%）は低かった。認証への参加は合成肥料の使用の少なさと関連した（抄録）。", "fun": "気候の変化に備える農法はいろいろありますが、木を植える、堆肥を使うといったお金のかからない方法は広まり、灌漑のようなお金のかかる方法はほとんど広まっていません。農家の気持ちの状態まで含めて採用を説明しようとした点が珍しいところです。", "unverified": "抑うつ症状の効果の結果は抄録の途中で切れており未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "画像計測と少数加速度計の融合で変位推定", "title": "Enhancing vision-based structural monitoring through data fusion with sparse accelerometer measurements", "url": "https://doi.org/10.1007/s13349-026-01138-6", "authors": "Ghita Eslami Varzaneh ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-10-23", "citescore": 8.0, "citescore_year": "2025", "apa": "Eslami Varzaneh, G., Ponsi, F., Bassoli, E., & Vincenzi, L. (2026). Enhancing vision-based structural monitoring through data fusion with sparse accelerometer measurements. Journal of Civil Structural Health Monitoring, 16(6). https://doi.org/10.1007/s13349-026-01138-6", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のPDF本文（§3のデータ融合、§6の実験検証、§7の結論）を読んだ", "preprint": false, "p1": "少数の加速度計と、カメラによる画像からの変位計測を、モード重ね合わせによる仮想センシングとカルマンフィルタで融合し、加速度計のない位置でも変位と加速度を安く精度よく推定できるようにした（抄録、§7）。", "p2": "加速度計は信頼できるが配線と費用がかさみ、積分で変位を求めると残留変位や平均ゼロでない変位でずれる。画像計測は非接触で広い範囲を測れるが、照明などの環境とピクセルから長さへの換算の精度に弱い（§1、§7）。", "p3": "少数の加速度計の記録から、モード重ね合わせで、画像の標的を置いた未計測の位置の加速度を再構成する（§4）。そのうえで、変位と速度を状態とする状態空間モデルで、加速度を入力、画像の変位を観測とするカルマンフィルタにより、サンプリング周波数の違う2つの計測を融合する（§3、式1〜2）。直観：加速度は高い周波数を、画像は低い周波数のずれ（沈下など）を担い、両者が補い合う。", "p4": "白色雑音加振と歩行者荷重の数値例で、入力に不確かさを段階的に加えて誤差を調べた（§5）。実験はイタリア・モデナのパナロ川の3径間（45-70-45 m、全長160 m）の鋼トラス歩道橋で、中央径間の7断面に加速度計とチェッカーボードの標的を置いて検証した（§6、図11）。", "p5": "数値例では雑音なしで誤差約2%、雑音を増やしても誤差は入力雑音の約半分で、不確かさを約50%減らした。加速度だけでは支点の沈下や移動荷重による低周波のずれを捉えられないことも示した（§7）。実験では測定のピークに対する誤差が4%未満で、外乱があると再構成した加速度のほうが直接測ったものより良い場合があった（§7）。", "p6": "著者は、性能が仮想センシングに使うモードモデルの精度と、悪条件で劣化しうる画像計測の質に依存することを認め、より複雑な運用条件への拡張を課題とする（§7）。データは著者に請求すれば提供される（データの可用性の節）。", "fun": "揺れを測るセンサは、速い揺れは得意でもゆっくりした沈み込みが苦手。カメラはその逆です。この研究は、少数のセンサと1台のカメラを組み合わせ、互いの苦手を補わせました。しかもセンサのない場所の揺れまで、橋の揺れ方の「型」を使って推定してしまうのが面白い点です。", "unverified": "§5の数値例の個別の誤差の表と、実験の2つの試験条件の詳細は読み切れておらず未確認。"}}, {"id": "jr02", "rank": 2, "headline": "InSAR・TLS・BIMを束ねる橋のデジタルツイン", "title": "A remote sensing-enhanced Digital Twin framework for multi-scale infrastructure monitoring", "url": "https://doi.org/10.1016/j.array.2026.101363", "authors": "Antonio Napolitano ほか", "venue": "Array", "date": "2026-10-22", "citescore": 10.1, "citescore_year": "2025", "apa": "Napolitano, A., Gagliardi, V., Bertolini, L., Romer Diezmos Manalo, J., D’Amico, F., & Benedetto, A. (2026). A remote sensing-enhanced Digital Twin framework for multi-scale infrastructure monitoring. Array, 32, 101363. https://doi.org/10.1016/j.array.2026.101363", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "地上レーザースキャン、GNSS測量、衛星の多時期干渉SAR、BIMを統合し、橋を中心とした交通インフラのデジタルツインを、計測のたびに半自動で更新できる枠組みを示した（抄録）。", "p2": "橋の状態の情報は空間・時間の解像度の異なる多くの非破壊検査から得られるが、それらを一つのモデルにまとめて継続的に更新し、周辺環境の災害と結びつけて見る仕組みが不足している（抄録、解釈を含む）。", "p3": "TLSで形状、GNSSで基準、MT-InSARの永続散乱体（PS）で長期の変形、BIMで構造の情報を担わせ、解像度の違う計測を統合し、衛星と現地の計測サイクルのたびにツインを半自動で更新し、予測的な分析につなげる（抄録）。", "p4": "イタリアの石造アーチ橋の事例で、PSの計測から得た変形パターンの可視化と、地すべりなどの環境災害との関係の検討を示した（抄録）。", "p5": "橋の形状と観測された変形のデータを一体にし、状態評価と維持計画を支援できることを示したとする（抄録）。抄録の範囲では定量的な精度や変形量は示されていない。", "p6": "抄録の範囲では、PSの変形と地すべりの関係が因果か相関か、半自動更新の手間の評価は確認できない。事例は1橋である（解釈）。", "fun": "橋を見守るには、人工衛星から何年分もの沈み込みを測る方法、地上から形を細かく測る方法、図面のデータなど、性格の違う情報があります。それを一つの「仮想の橋」にまとめ、測るたびに自動で更新していく。橋の健康診断のカルテをデジタルで作る試みが面白い点です。", "unverified": "変形の大きさなどの数値、更新の自動化の程度は抄録に記載がなく未確認。"}}, {"id": "jr03", "rank": 3, "headline": "InSAR6年で高層建物杭の二次圧縮を捉える", "title": "Secondary Compression of Deep Foundations in Carbonate Soils: An InSAR Study of Sunny Isles, Florida", "url": "https://doi.org/10.1061/jggefk.gteng-15394", "authors": "Jean-Pierre Bardet", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-24", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Bardet, J.-P. (2027). Secondary Compression of Deep Foundations in Carbonate Soils: An InSAR Study of Sunny Isles, Florida. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15394", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "フロリダ州サニーアイルズの20棟超の高層建物で、6年間のInSAR観測から建設後の沈下が最大5 cm続いていることを示し、杭基礎の長期の二次圧縮を評価する「クリープ比」を提案した（抄録）。", "p2": "炭酸塩の地層に支えられた高層建物の長期沈下は、地域的な地盤沈下や排水の良い砂層の一次圧密では説明できず、室内試験の値で予測することにも限界がある（抄録）。", "p3": "6年のInSARの時系列に、対数時間モデルとべき乗モデルを当てはめ、100年の外挿を比べた。実務向けに、InSARに当てはめた対数時間の沈下勾配Aを、建設段階の沈下の推定値s_iで割ったクリープ比R=A/s_iを導入した（抄録）。", "p4": "モデルの当てはまりと、推定した現場規模の二次圧縮指数を、砂の典型的な室内試験の値と比べた（抄録）。", "p5": "両モデルとも6年の観測をよく再現し、100年の外挿も同程度で、べき乗モデルが長期でやや保守的だった。当てはまりが同等なので、100年の値は決定的な予測ではなくシナリオとしての使用性の外挿と解釈された。現場の二次圧縮指数は大半の地点で砂の室内値を上回り、粒状体の固有のクリープだけでは沈下を説明できなかった（抄録）。", "p6": "著者は、炭酸塩の層序、杭群の相互作用、応力の再分配の寄与を地表の観測だけでは分けられないことを認めている（抄録）。Rは過去の設計の保守性の事後評価と、近隣建物のInSAR記録を使う新規設計のふるい分けに使うと提案されている。", "fun": "高層ビルは建ててからも、何年もかけて少しずつ沈みます。人工衛星から地面の高さをミリ単位で測り続けると、その沈み方がビルごとに見えてきました。2つの式のどちらも過去によく合うのに、100年後の予想は少し違う。「よく合う」ことと「未来が分かる」ことの違いが面白い点です。", "unverified": "建物ごとのRの値と二次圧縮指数の数値は抄録に記載がなく未確認。"}}, {"id": "jr04", "rank": 4, "headline": "確率密度発展法で遮水構造の応答分布を評価", "title": "Deformation–stress performance of anti-seepage structure in soil foundation with spatial variability of mechanical parameters based on SRM and PDEM", "url": "https://doi.org/10.1108/ec-12-2025-1567", "authors": "Xiang Yu ほか", "venue": "Engineering Computations", "date": "2026-10-23", "citescore": 3.8, "citescore_year": "2025", "apa": "Yu, X., Yang, K., Li, Z., Lv, X., Qu, Y., & Wang, Y. (2026). Deformation–stress performance of anti-seepage structure in soil foundation with spatial variability of mechanical parameters based on SRM and PDEM. Engineering Computations, 1–19. https://doi.org/10.1108/ec-12-2025-1567", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "土堰堤の基礎の遮水構造の変形と応力を、被覆層の力学定数の空間的なばらつきを考えて評価し、ばらつきを無視すると安全性を過大に見積もることを示した（抄録）。", "p2": "長い年月で堆積した土は、岩相の不連続と力学定数の空間的なばらつきを持つが、既存研究はこれをあまり考慮していない（抄録）。", "p3": "被覆層の強度と弾性係数のランダム場を、スペクトル表現法（SRM、周波数成分の重ね合わせで乱数場を作る方法）で生成し、確率密度発展法（PDEM、応答の確率密度の時間発展を一般化密度発展方程式で解く方法）と組み合わせて、遮水構造の応答の確率分布を求めた（抄録）。背景：PDEMは少数の代表点で確率密度の発展を追えるため、モンテカルロより効率がよいとされる。", "p4": "まずばらつきを模擬すべき有効な範囲を調べ、次に強度と弾性係数のばらつきを考えた遮水構造の変形-応力応答を、ばらつきを無視する従来法と比べた（抄録）。", "p5": "ばらつきの模擬範囲は遮水構造の両側の被覆層厚の1.2倍まで縮められ、全範囲との差は5%未満で、ランダム場の生成効率は70%以上向上した。ばらつきを無視する従来法は安全性を過大評価し、弾性係数より強度のばらつきの影響が強かった（抄録）。", "p6": "抄録の範囲では、相関長などのランダム場の設定、破壊確率の具体値、実測との照合は確認できない（解釈）。", "fun": "地面の中の土は場所によって固さや強さが少しずつ違います。平均の値だけで計算すると「安全」に見えても、弱い所がたまたま並ぶと危ないかもしれない。そのばらつきを確率として扱い、しかも計算する範囲を賢く絞って速くした点が面白いところです。", "unverified": "応力・変形の確率分布の具体値と、PDEMの代表点の数は抄録に記載がなく未確認。"}}, {"id": "jr05", "rank": 5, "headline": "精度の高い業績指標が操作を招く逆説", "title": "Measurement Error, Manipulation, and the Value of Short‐Term Performance in Job Retention", "url": "https://doi.org/10.1111/1911-3846.70096", "authors": "Naomi Rothenberg", "venue": "Contemporary Accounting Research", "date": "2026-10-24", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Rothenberg, N. (2026). Measurement Error, Manipulation, and the Value of Short‐Term Performance in Job Retention. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70096", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "操作できる短期の業績指標で代理人の継続か解雇かを決めるとき、指標の精度を上げると価値がかえって下がることがあり、依頼人は不完全な指標を好みうることを理論的に示した（抄録）。", "p2": "業績指標は正確なほど良いと考えられがちだが、指標が操作できるとき、精度と操作の誘因の相互作用は十分に分析されていない（抄録、解釈を含む）。", "p3": "依頼人が短期の業績指標を見て代理人を継続するか解雇するかを決め、代理人はその指標を操作できるモデルを考える。指標は、継続の誤り（無能な人を残す）の期待費用の節約が、解雇の誤り（有能な人を切る）の期待費用を上回るとき価値を持つ（抄録）。", "p4": "比較の基準は、業績を無視して決して解雇しない場合である（抄録）。", "p5": "精度を上げると、代理人を正しく見分ける「識別効果」で効率的な解雇が増える一方、無能な代理人が解雇を避けるために操作を増やす「操作効果」で非効率な継続が増える。精度が低いうちは操作の誘因が弱く、精度の向上は価値を高める。精度が高いと操作効果が勝ち、精度の向上は価値を下げる（抄録）。", "p6": "抄録の範囲では、モデルの前提（代理人の型の数、操作の費用の形）と、実証的な含意の検証は確認できない。理論論文である（解釈）。", "fun": "テストの点で生徒を選ぶとき、テストが正確すぎると、点を取らないと困る人ほど必死にずるをするようになります。ほどほどに不正確なテストのほうが、ずるが割に合わず、結果として良い選抜になることがある。正確さが裏目に出る逆説が面白いところです。", "unverified": "具体的な条件式と数値例は抄録に記載がなく未確認。"}}, {"id": "jr06", "rank": 6, "headline": "中小企業の破綻予測から回復経路の提示へ", "title": "Beyond Predicting Failure: A Cost-Sensitive, Explainable AI Framework for Identifying Actionable Recovery Pathways in the U.S. Small Businesses", "url": "https://www.globalresearchnetwork.us/index.php/ajebm/article/view/5763", "authors": "Md Majedul Hasan ほか", "venue": "American Journal of Economics and Business Management", "date": "2026-10-21", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌のウェブページの抄録を使用。本文は入手できず", "preprint": false, "p1": "米国中小企業庁（SBA）の融資データで、誤分類の費用を考えた機械学習と説明可能AIを組み合わせ、破綻の予測から、実行できる回復の道筋の提示まで行う枠組みを提案した（抄録）。", "p2": "従来の予測モデルは意思決定者にとって解釈しにくく、破綻の予測に終わって誤分類の費用の非対称も考慮しない（抄録）。", "p3": "89万9,164件の融資記録と27の事業・融資の変数を持つSBAnational.csvを前処理し、ロジスティック回帰、決定木、ランダムフォレスト、XGBoost、LightGBM、CatBoostを費用考慮型の学習で比べ、SHAPとLIMEで破綻の重要な要因を取り出して、流動性管理、資金調達の構造、業務リスク管理の改善などの回復の道筋に翻訳する（抄録）。", "p4": "正解率、適合率、再現率、F1、ROC-AUC、バランス正解率、マシューズ相関係数、費用考慮型の指標で評価するとした（抄録）。", "p5": "抄録は要因として融資の特性、事業規模、業種、資金調達の条件を挙げるが、性能の数値は示しておらず、結果は将来形で書かれている（抄録）。", "p6": "抄録からは、性能の結果と、説明から回復の道筋への翻訳がどう検証されたかが確認できない。SHAPの重要度は因果ではなく、介入すれば回復するという解釈には飛躍がある（解釈）。", "fun": "「この会社は危ない」と当てるだけでなく、「どこを直せば立ち直れるか」まで示したい、という発想です。ただし、AIが重要だと言った要因を変えれば本当に良くなるとは限りません。予測の説明と改善の処方箋の間にある溝をどう埋めるかが、この種の研究の面白くて難しいところです。", "unverified": "モデルの性能の数値、回復の道筋の具体例は抄録に記載がなく未確認。"}}, {"id": "jr07", "rank": 7, "headline": "須賀川市のフレイル健診と要介護認定の推移", "title": "Association of frailty screening–based preventive care with long-term care certification rates among Japanese people aged 75 years and older: an interrupted time-series analysis", "url": "https://doi.org/10.1093/ageing/afag307", "authors": "Shunsuke Soma ほか", "venue": "Age and Ageing", "date": "2026-10-24", "sjr": 2.152, "citescore": 11.2, "citescore_year": "2025", "apa": "Soma, S., Sasaki, S., Sakamoto, S., Higa, R., Yamamoto, R., Nakagawa, H., Yamazaki, H., Hamaguchi, S., & Fukuhara, S. (2026). Association of frailty screening–based preventive care with long-term care certification rates among Japanese people aged 75 years and older: an interrupted time-series analysis. Age and Ageing, 55(10). https://doi.org/10.1093/ageing/afag307", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "福島県須賀川市で、フレイル健診（後期高齢者の質問票）を入口にした保健指導の開始後、75歳以上の要介護認定率の推移が下がったことを、中断時系列分析で示した（抄録）。", "p2": "日本は質問票によるフレイル健診で高齢者がリスクに気づき予防に取り組む全国政策を始めたが、要介護の必要の変化と結びつくかは評価されていない（抄録）。", "p3": "2015年1月〜2025年12月の月次の要介護認定と人口のデータで、分割回帰による中断時系列分析を行った。結果は75歳以上の年齢標準化した月次の要介護認定率で、介入（2022年4月）の12か月後に傾きが変わると仮定し、人口のオフセットつきの対数リンクのポアソン回帰を当てはめた（抄録）。", "p4": "比較の基準は、介入前の傾向が続いた場合の反実仮想の認定率である（抄録）。", "p5": "介入後、認定率の傾向は介入前に比べて下がり、傾きの変化の年率換算の相対リスクは0.974（95% CI 0.963〜0.983）だった。追跡の終わりの年齢標準化した認定率は、反実仮想より6.8%低かった（95% CI 4.4〜10.0%）（抄録）。", "p6": "1市の研究で対照の自治体がなく、同時期の他の要因（認定の運用の変化など）を排除できない（解釈）。12か月後の傾きの変化という仮定に結果が依存しうる（解釈）。", "fun": "高齢者に「体が弱ってきていませんか」という質問票に答えてもらい、そこから保健指導につなげると、介護が必要になる人の増え方がゆるやかになりました。小さな気づきのきっかけが、町全体の数字に表れるかを10年分のデータで確かめた点が面白いところです。", "unverified": "保健指導の具体的な内容と参加率は抄録に記載がなく未確認。"}}, {"id": "jr08", "rank": 8, "headline": "LLMペルソナは患者の理解度を再現できるか", "title": "Large Language Models' Simulation of Patient Comprehension of Discharge Summaries: Multimodel Evaluation Study.", "url": "https://doi.org/10.2196/89003", "authors": "Ma X ほか", "venue": "Journal of medical Internet research", "date": "2026-10-22", "sjr": 2.109, "citescore": 10.4, "citescore_year": "2025", "apa": "Ma, X., Zhu, R., Wang, Z., Xiong, J., Chen, Q., Camp, L. J., & Tang, H. (2026). Large Language Models’ Simulation of Patient Comprehension of Discharge Summaries: Multimodel Evaluation Study. Journal of Medical Internet Research, 28, e89003–e89003. https://doi.org/10.2196/89003", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録（詳細な構造化抄録）を使用。本文は入手できず", "preprint": false, "p1": "教育・性別・医療利用で定めたペルソナを与えたLLMが、退院時要約に対する患者の理解をどこまで再現できるかを、実際の参加者99人の回答と比べ、事実の理解は近いが主観的な理解とばらつきは再現しにくいことを示した（抄録）。", "p2": "ペルソナ指示でLLMに多様な患者の反応を模擬させる方法は、規模の大きい患者フィードバックの代わりになりうるが、実際の患者の視点にどれだけ近く、属性の部分集団で公平かは不明だった（抄録）。", "p3": "GPT-4.1、GPT-5.2、Claude Sonnet 4.5、Opus 4.6の4モデルに、長さと医学的複雑さの異なる退院時要約について10問（事実の理解を問う情報項目と、主観的な理解を問う知覚項目）に答えさせ、Prolificで集めた99人の回答と比べた。食い違いの大きい場合に思考の連鎖（chain-of-thought）の感度分析も行った（抄録）。", "p4": "一致の指標は最頻値の平均絶対誤差と、期待絶対順序距離である（抄録）。", "p5": "どのモデルも情報項目のほうが知覚項目より人に近かった。教育が最も一貫した層別の軸で、すべてのモデルが情報項目で高学歴の部分集団により近かった。短いが臨床的に複雑な要約で食い違いが最大だった。性別の差は小さく方向も一貫しなかった。思考の連鎖は一部の事実項目で一致を改善したが、少数派の回答の幅は回復しなかった。LLMは「分からない」「記載なし」を人より選ばず、確定的な答えに寄った（抄録）。", "p6": "著者は、ペルソナ模擬は患者資料の補助的なふるい分けに使い、部分集団での検証つきの人による評価を補うもので置き換えるべきではないとする（抄録）。参加者はProlificの一般集団で、実際の退院患者ではない（抄録、解釈を含む）。", "fun": "AIに「あなたは高卒の50代女性です」と役を与えて、病院の説明書を読ませると、人と同じように答えるのか。事実を問う質問ではよく似ていましたが、「よく分かったと感じるか」という気持ちの質問は苦手でした。しかもAIは人ほど「分からない」と言わない。合成の回答者の限界がよく見える点が面白いところです。", "unverified": "モデルごとの誤差の数値は抄録に記載がなく未確認。"}}, {"id": "jr09", "rank": 9, "headline": "組織の沈黙はどう文化として根付くか", "title": "Organizational Silence Cultures. A Conceptual Framework and Integrative Review on how They Develop, Manifest, and Persist", "url": "https://doi.org/10.1177/20413866261492293", "authors": "Michael Knoll ほか", "venue": "Organizational Psychology Review", "date": "2026-10-24", "sjr": 2.838, "citescore": 12.4, "citescore_year": "2025", "apa": "Knoll, M., & Bogilovic, S. (2026). Organizational Silence Cultures. A Conceptual Framework and Integrative Review on how They Develop, Manifest, and Persist. Organizational Psychology Review. https://doi.org/10.1177/20413866261492293", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "組織の中で特定の問題が語られない「組織の沈黙」を文化として捉える枠組みを作り、統合的レビューで、沈黙の文化がどう生まれ、どう現れ、どう続くかを整理した（抄録）。", "p2": "組織の沈黙は開かれた議論を妨げ、誤りの発見と革新を阻み、非効率や有害な職場を長引かせるが、それが生じる環境を文化の観点から説明する枠組みが不足していた（抄録）。", "p3": "沈黙が適応上の問題を解くのに適切とみなされると沈黙の文化が生まれ、人工物、共有された価値と規範、暗黙の基本的前提の3層に現れ（背景：Scheinの組織文化の3層モデルに対応する）、差し控え（withholding）、聞かないこと（deafness）、検閲（censorship）の組合せで持続する、という命題を立てた（抄録）。", "p4": "統合的レビューで文献を整理し、枠組みの命題を検討した（抄録）。", "p5": "組織の沈黙が果たす適応上の機能を特定し、4つの沈黙の文化の類型を導いて、それぞれが3つの文化の層にどう現れ、差し控え・聞かないこと・検閲によってどう持続するかを説明した（抄録）。", "p6": "抄録の範囲では、4類型の名前と内容、レビューの対象文献の数と選び方は確認できない。概念的な研究であり、類型の実証的な検証は今後の課題と考えられる（解釈）。", "fun": "職場で誰も言い出さないことがあるのは、一人ひとりが臆病だからとは限りません。黙っていることが組織にとって「うまくいくやり方」になっていると、それが文化として根付き、言わない・聞かない・言わせないの三つがそろって続いていく。沈黙を個人ではなく文化として見る視点が面白い点です。", "unverified": "4つの類型の具体的な内容は抄録に記載がなく未確認。"}}, {"id": "jr10", "rank": 10, "headline": "職場AIは神経多様な社員の実行機能を支える", "title": "Smart tools for diverse minds: how AI use impacts performance and well-being among neurodivergent employees", "url": "https://doi.org/10.1108/edi-02-2026-0161", "authors": "Lu (Lucy) Xing ほか", "venue": "Equality, Diversity and Inclusion: An International Journal", "date": "2026-10-24", "citescore": 5.3, "citescore_year": "2025", "apa": "Xing, L. (., & Tasker, K. (2026). Smart tools for diverse minds: how AI use impacts performance and well-being among neurodivergent employees. Equality, Diversity and Inclusion: An International Journal, 1–19. https://doi.org/10.1108/edi-02-2026-0161", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "神経多様（ニューロダイバージェント）な従業員で、職場でのAI利用が実行機能を高め、それを通じて業績を上げ燃え尽きを下げるが、その効果は職場の社会的支援が高いときにだけ現れることを示した（抄録）。", "p2": "AIが神経多様な従業員の働き方をどう支えるか、そしてどんな条件で支えになるかは、実証が少ない（抄録、解釈を含む）。", "p3": "社会技術システム理論に基づき、AIを外部の認知の足場、社会的支援を社会システムと位置づけ、実行機能（計画・注意の切り替え・作業記憶などの自己制御の働き）を媒介、社会的支援を調整要因とするモデルを立てた（抄録）。", "p4": "英国の神経多様な従業員286人の3時点の調査で、予測変数・媒介・結果を時間的に分け、共通方法の偏りを減らした（抄録）。", "p5": "職場でのAI利用は実行機能と正に関連し、実行機能は業績と正に、燃え尽きと負に関連した。社会的支援はこの関係を調整し、AI利用の実行機能とその後の業績・幸福への利点は、社会的支援が高いときにだけ現れた（抄録）。", "p6": "抄録の範囲では、効果の大きさ、神経多様性の判定方法、AI利用の測り方は確認できない。調査データであり因果は言えない（解釈）。", "fun": "予定の管理や作業の段取りが苦手な人にとって、AIは頭の外に置ける「補助の脳」になりえます。ところが、その効果が出るのは周りの人の支えがある職場だけでした。道具だけ渡しても足りず、人の支えとセットで初めて効く、という点が面白いところです。", "unverified": "係数の大きさと標本の内訳は抄録に記載がなく未確認。"}}, {"id": "jr11", "rank": 11, "headline": "受取窓口の対面接点が満足を最も左右", "title": "Agent-Controlled Touchpoint Dominance for Satisfaction and Loyalty in E-Commerce", "url": "https://doi.org/10.4018/ijssmet.425687", "authors": "Alexey Starostin ほか", "venue": "International Journal of Service Science, Management, Engineering, and Technology", "date": "2026-10-23", "citescore": 6.2, "citescore_year": "2025", "apa": "Starostin, A., & Veselova, A. (2026). Agent-Controlled Touchpoint Dominance for Satisfaction and Loyalty in E-Commerce. International Journal of Service Science, Management, Engineering, and Technology, 17(1), 1–28. https://doi.org/10.4018/ijssmet.425687", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "出版社（IGI Global）のPDF本文（結果の測定モデル・構造モデル、考察、結論）を読んだ", "preprint": false, "p1": "ロシアのマーケットプレイスの顧客18,023人の分析から、満足とロイヤルティを最も左右するのは基盤自身のデジタル接点ではなく、委託先が運営する配送と受取窓口での対面の受け取りであることを示した（抄録、結論）。", "p2": "オンライン小売の顧客体験はデジタルの画面で形づくられるとみなされてきたが、第三者の受取窓口での対面の接点を含めて顧客旅程全体を比べた研究は少ない（考察）。", "p3": "商品検索、注文、配送、受取、購入後の5段階の重要度の評価と、知覚された使いやすさ、満足、ロイヤルティを、PLS-SEM（偏最小二乗の構造方程式モデル）で分析した。内生性はガウス・コピュラで補正した（結果、考察）。", "p4": "測定モデルは信頼性（クロンバックα 0.79〜0.85）、収束妥当性（AVE>0.50、注文段階は0.506）、弁別妥当性（HTMT最大0.717）を満たした（結果）。段階間の係数の差はブートストラップ5,000回で直接検定した（結果）。", "p5": "満足への係数は受取0.34、配送0.31が中程度の効果で、商品検索0.05、注文0.04は効果量がほぼゼロだった。購入後は満足に0.19、ロイヤルティに0.28で、満足からロイヤルティへの経路が0.50で最大だった。受取は検索を0.29（95% CI 0.27〜0.31）上回った。満足の説明率は、デジタル接点のモデルに最終段階を加えると8%から42%に上がり、逆は40%から42%にとどまった（結果）。", "p6": "著者は、横断データのため、満足した経験が段階の重要度を事後に高める逆因果や、最後の鮮明な体験が効く新近効果を排除しきれないと認める。ただし受取の後の購入後段階が弱いことは新近効果だけでは説明できないとする（考察）。無人ロッカーなど対面の薄い状況では効果は弱まると想定している（考察）。", "fun": "ネット通販の満足度は、サイトの見やすさで決まると思われがちです。でも1万8千人のデータでは、最後に荷物を受け取る窓口での対面のやりとりが一番効いていました。しかもその窓口は通販会社ではなく委託先の運営。自分で直接管理していない場所で評価が決まってしまう、という逆説が面白い点です。", "unverified": "顧客セグメント別の結果の詳細は読み切れておらず未確認。"}}, {"id": "jr12", "rank": 12, "headline": "自動運転網の最大通行容量を理論的に導く", "title": "Towards Maximum Throughput in Generalized Automated Transport Networks", "url": "https://doi.org/10.1287/trsc.2025.0407", "authors": "Xiangdong Chen ほか", "venue": "Transportation Science", "date": "2026-10-23", "sjr": 2.371, "citescore": 10.0, "citescore_year": "2025", "apa": "Chen, X., Lin, X., He, F., Li, M., & Shen, Z.-J. M. (2026). Towards Maximum Throughput in Generalized Automated Transport Networks. Transportation Science. https://doi.org/10.1287/trsc.2025.0407", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "自動運転車や倉庫の搬送車などの自動化された輸送網の容量を、「リズム制御」の枠組みで理論的に解析し、スループット最適性を示したうえで、戦略的な待機を加えた改良で有限の周期でも安定化と近似最適性を保証した（抄録）。", "p2": "自動化輸送システムの容量の特徴づけと最適化は、ネットワークの形、需要の不均一、確率的な動態のために難しい（抄録）。", "p3": "道路網、倉庫の通路、港のヤードの車線などを「リズムのあるネットワーク系」に抽象化し、一方通行と双方向の構成の両方で、リズムの設計が需要を受け入れられるか（需要の収容）を静的に定式化し、定常確率的な枠組みでスループットと安定性を解析した。安定化に長い周期が要る弱点を補うため、戦略的な待機（ホールディング）を加えた変種を導入した（抄録）。", "p4": "理論的な保証に加え、大規模なシミュレーションで性能を評価した（抄録）。", "p5": "リズム制御はスループット最適性を達成するが、需要を収容できても同じリズムで安定化が保証されるとは限らず、一部の需要では非常に長い周期が必要になる。戦略的な待機を加えた変種は、穏やかな条件のもとで収容可能なあらゆる需要を安定化し、有限の周期で近似的なスループット最適性を達成した。シミュレーションでは、期間ごとの設計が時間変化する流れに適応し、戦略的な待機が全体の効率を大きく高めた（抄録）。", "p6": "抄録の範囲では、すべての車両が自動化されて協調するという前提と、人が運転する車との混在への拡張は確認できない（解釈）。", "fun": "信号のない交差点でも、すべての車がリズムに合わせて通れば止まらずに流せる。そのリズムの作り方で、道路網がどれだけの車をさばけるかの上限を数学的に求めました。わざと少し待たせる車を作ると全体がかえって速く流れる、という直観に反する工夫が面白い点です。", "unverified": "シミュレーションの数値結果は抄録に記載がなく未確認。"}}, {"id": "jr13", "rank": 13, "headline": "ストークスの定理でFDEM接触計算を高速化", "title": "Symmetric Boundary‐Represented Contact Model for the Combined Finite–Discrete Element Method", "url": "https://doi.org/10.1002/nme.70451", "authors": "Yiming Lei ほか", "venue": "International Journal for Numerical Methods in Engineering", "date": "2026-10-24", "citescore": 5.5, "citescore_year": "2025", "apa": "Lei, Y., Liu, H., Liu, Q., Sun, L., & Grasselli, G. (2026). Symmetric Boundary‐Represented Contact Model for the Combined Finite–Discrete Element Method. International Journal for Numerical Methods in Engineering, 127(20). https://doi.org/10.1002/nme.70451", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "3次元の四面体の結合有限-離散要素法（FDEM）で、接触の計算をストークスの定理で境界積分に書き換え、重なり体積の再構成を不要にして、GPUで従来より大幅に速く、対称で連続な接触力を得られるようにした（抄録）。", "p2": "大規模な3次元FDEMでは、重なり体積や接触面の切片を幾何的に切り出して接触を評価するため、その計算が主なボトルネックになる（抄録）。", "p3": "ストークスの定理で接触のベクトル面積を、向きのある境界の線分だけから評価する境界積分に書き直した。四面体の組ごとに4×4の三角形同士の交差判定でその線分を求める。同じ境界表現から境界の深さ係数を作り、平らな面での力の跳びをなくして接触力がゼロから連続に増えるようにし、線分と深さ係数を対称に評価して入れ替え不変性を保った（抄録）。", "p4": "組ごとの入れ替え試験、弾性の跳ね返り試験、閉じたループのエネルギー試験、室内規模の一軸圧縮（UCS）と圧裂引張（BTS）の模擬で検証し、衝撃破砕と斜面崩壊の大規模模擬で頑健性を示した（抄録）。", "p5": "入れ替え不変性は計算機精度で成り立ち、浅い接触での見かけのエネルギーは小さく保たれた。NVIDIA V100とA100で、接触力の計算は最新の方法（ENIC-FDEM）より1.9〜2.9倍、広く使われるポテンシャル型（CPC-FDEM）より7.6〜17.0倍速かった（抄録）。", "p6": "抄録の範囲では、摩擦や接触の履歴の扱いと、多面体要素への一般化の実装は確認できない（著者は一般化可能と述べる）。", "fun": "粒や塊がぶつかる計算では、重なった部分の体積を毎回切り出すのが大変です。この研究は、重なった立体の中身を見なくても、その「縁」をなぞるだけで同じ量が求まるという、ベクトル解析の定理を使いました。高校の数学で習う「面積を周の線で測る」発想の3次元版が、計算を何倍も速くしている点が面白いところです。", "unverified": "摩擦の扱いと大規模模擬の要素数は抄録に記載がなく未確認。"}}, {"id": "jr14", "rank": 14, "headline": "ランダムウォーク粒子追跡で揚水の最適化", "title": "Hydraulic Barrier Optimization Using Random‐Walk Particle Tracking in Heterogeneous Media: Effects of Dispersion, Particle Discretization and Algorithmic Initialization", "url": "https://doi.org/10.1029/2026wr045756", "authors": "Daniele Pedretti", "venue": "Water Resources Research", "date": "2026-10-24", "sjr": 1.778, "citescore": 9.2, "citescore_year": "2025", "apa": "Pedretti, D. (2026). Hydraulic Barrier Optimization Using Random‐Walk Particle Tracking in Heterogeneous Media: Effects of Dispersion, Particle Discretization and Algorithmic Initialization. Water Resources Research, 62(10). https://doi.org/10.1029/2026wr045756", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "汚染された帯水層で汚染物質の広がりを封じ込める揚水井（水理障壁）の最小揚水量を、ランダムウォーク粒子追跡と暖機開始の遺伝的アルゴリズムで効率よく求める枠組みを作り、分散・粒子数・初期化が結果を左右することを示した（抄録）。", "p2": "ラグランジュ型のランダムウォーク粒子追跡（RWPT）は井戸への移流分散を模擬するのに有効だが、多くの粒子が必要で、シミュレーション最適化の計算が重い（抄録）。", "p3": "暖機開始（warm-start、前の解を初期値に使う）の遺伝的アルゴリズムと並列のRWPTを結合し、確率的な透水係数場のモンテカルロ研究で、封じ込めに必要な最小の累積揚水量を求めた。粒子数を変え、局所分散の有無と粒子の回収基準を比べた（抄録）。", "p4": "評価は最適な揚水量とそのばらつき、計算時間である（抄録）。", "p5": "移流だけでは最適な揚水量は粒子数にほとんど依存しなかったが、局所分散を入れると揚水量とそのばらつきが粒子数とともに増えた。粒子数の影響は回収基準に強く依存し、不完全な回収を許すと弱まった。局所分散を無視すると揚水量を過小評価しうる。暖機開始は冷機開始より低い解を見つけ、計算時間も減らした（抄録）。", "p6": "抄録の範囲では、粒子数や揚水量の具体値（記号が抄録で欠落）と透水係数場の統計は確認できない（抄録の表記の欠落）。", "fun": "汚れた地下水が広がらないよう、井戸でくみ上げて囲い込むとき、くみ上げ量はなるべく少なくしたい。その計算に、水の中を酔っぱらいのように不規則に歩く粒子をたくさん追う方法を使います。粒子の数や「どこまで回収できたら合格か」という決め方で答えが変わる、という計算の落とし穴が面白い点です。", "unverified": "粒子数の範囲などの数値が抄録の表記から欠落しており未確認。"}}, {"id": "jr15", "rank": 15, "headline": "監査法人の昇進の速さが修正の多さに関係", "title": "The Effects of Promotion Patterns Within Audit Firms on Audit Adjustments: Insights Into Promotion Speed and Flexibility", "url": "https://doi.org/10.1111/jbfa.70092", "authors": "Yingwen Deng ほか", "venue": "Journal of Business Finance & Accounting", "date": "2026-10-24", "citescore": 4.5, "citescore_year": "2025", "apa": "Deng, Y., Zhang, Z., Li, X., & Zhang, M. (2026). The Effects of Promotion Patterns Within Audit Firms on Audit Adjustments: Insights Into Promotion Speed and Flexibility. Journal of Business Finance & Accounting. https://doi.org/10.1111/jbfa.70092", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は入手できず", "preprint": false, "p1": "中国の監査法人のパートナー昇進の詳細なデータから、昇進が速く柔軟な法人ほど監査人が監査修正を行いやすいことを示した（抄録）。", "p2": "監査法人の内部の昇進の仕組みが監査の結果に影響するかについて、実証の証拠はほとんどない（抄録）。", "p3": "パートナーの昇進データから、法人単位の昇進の速さと昇進の柔軟性を測り、監査修正の有無・方向（利益を上げる修正と下げる修正）・大きさとの関係を調べた（抄録）。", "p4": "横断的な分析で、法人の規模、監査人の職位による違いを調べ、監査の効率と、有限責任パートナーシップ（LLP）への組織改革の影響も見た（抄録）。", "p5": "昇進が速く柔軟な法人の監査人ほど監査修正を行いやすく、上方・下方の修正の確率と修正の大きさの両方に正に関連した。効果は大きな法人で強く、昇進の速さの効果は昇進の誘因が大きい下位の監査人で強かった。速く柔軟な昇進は監査の効率も高め、LLP化は昇進の速さと関連した（抄録）。", "p6": "抄録の範囲では、昇進の仕組みと監査修正の関係の因果の識別方法と、効果の大きさは確認できない（解釈）。中国の制度に固有の可能性がある（解釈）。", "fun": "監査人が会社の数字の誤りを指摘して直させるかどうかは、監査法人の中での出世のしかたで変わっていました。頑張れば早く上に行ける職場ほど、監査人は手間のかかる指摘をいとわない。会計の数字の正しさが、監査法人の人事制度とつながっているという点が面白いところです。", "unverified": "係数の大きさ、標本の期間と規模は抄録に記載がなく未確認。"}}, {"id": "jr16", "rank": 16, "headline": "将来志向ESG重要度と信用格付けの関係", "title": "Forward‐Looking ESG Relevance and Corporate Performance: Evidence From Credit Ratings", "url": "https://doi.org/10.1002/bse.71714", "authors": "Alper Kara ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-23", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Kara, A., Nguyen, N. S. L., & Yildiz, Y. (2026). Forward‐Looking ESG Relevance and Corporate Performance: Evidence From Credit Ratings. Business Strategy and the Environment. https://doi.org/10.1002/bse.71714", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "Fitch Ratingsの将来志向のESG重要度の指標を使い、環境の重要度が高い企業ほど業績が低く、環境の取り組みの効果も弱まることを示した。", "p3": "55か国663社で、信用格付けの観点からESG課題の財務的な重要度を測る指標と、トービンのQ・ROAの関係を調べた（抄録）。", "p5": "環境の重要度が1標準偏差上がると、トービンのQが5.7%、ROAが11.9%下がる関係があり、環境の重要度は環境の成績と業績の正の関係を弱めた（抄録）。", "fun": "同じ「環境に良い取り組み」でも、環境問題が経営に直撃しやすい企業ほど、その効果が業績に表れにくい。格付け会社が付けた「その企業にとってESGがどれだけ重いか」という指標を使って、取り組みの効き方の違いを見た点が面白いところです。", "unverified": "社会・ガバナンスの重要度の結果は抄録の途中で切れており未確認。"}}, {"id": "jr17", "rank": 17, "headline": "ESG・ESG論争と業績の非線形関係", "title": "Nonlinear Dynamics of ESG , ESG Controversies, and Firm Performance: The Role of Controlling Shareholders", "url": "https://doi.org/10.1002/sd.71815", "authors": "Qian Long Kweh ほか", "venue": "Sustainable Development", "date": "2026-10-24", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "apa": "Kweh, Q. L., Ting, I. W. K., Asif, J., Ren, C., Le, H. T. M., & Fauzi, M. A. (2026). Nonlinear Dynamics of ESG , ESG Controversies, and Firm Performance: The Role of Controlling Shareholders. Sustainable Development. https://doi.org/10.1002/sd.71815", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "華為の国内供給網に属する中国A株企業で、ESGの成績と業績の非線形関係と支配株主の調整効果を調べ、U字の関係の証拠は弱いとした。", "p3": "2018〜2022年のパネルで、企業と年の固定効果、企業クラスターの標準誤差を使った（抄録）。", "p5": "総合ESGと業績のU字関係の証拠は弱く、ガバナンスが最も強い非線形関係を示した。環境・社会と論争への露出には頑健な非線形関係はなく、支配株主の調整効果は代理変数に敏感だった（抄録）。", "fun": "ESGに取り組むと最初は費用がかさみ業績が落ちるが、ある程度を超えると良くなる、というU字の仮説を試しました。結果は「そうとも言い切れない」。強い結論を出さず、どこまで言えるかを丁寧に区別している点がむしろ誠実で興味深いところです。", "unverified": "効果の大きさの数値は抄録に記載がなく未確認。"}}, {"id": "jr18", "rank": 18, "headline": "費用考慮型アンサンブルでマイクロ信用リスク", "title": "Cost-Sensitive Ensemble Models for Microcredit Risk Prediction: A Comparative Evaluation", "url": "https://doi.org/10.63158/journalisi.v8i5.1902", "authors": "Reliya Indah Okta Limabri Reliya ほか", "venue": "Journal of Information Systems and Informatics", "date": "2026-10-24", "apa": "Reliya, R. I. O. L., & Muzakir, A. (2026). Cost-Sensitive Ensemble Models for Microcredit Risk Prediction: A Comparative Evaluation. Journal of Information Systems and Informatics, 8(5), 6630–6654. https://doi.org/10.63158/journalisi.v8i5.1902", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "不均衡で誤分類の費用が非対称なマイクロ信用のリスク予測で、費用考慮型のモデル選択がデータ源によって変わることを示した。", "p3": "実運用のマイクロ信用1件と公開信用データ3件で、ロジスティック回帰・ランダムフォレスト・XGBoost・CatBoostを、偽陰性の費用を5倍、特異度0.70以上の条件で選んだ（抄録）。", "p5": "保留した評価区分のROC-AUCは0.895、0.940、0.461、0.620で、再現率は0.364、0.839、0.083、0.483だった。FIN ANAは分布の変化で大きく劣化した（抄録）。", "fun": "返済できない人を見逃す損失と、返せる人を断る損失は同じではありません。その費用の違いを組み込んでモデルを選ぶと、データによって最良のモデルが変わり、よく使われるAUCだけでは実務の判断に足りないことが分かります。", "unverified": "各データの規模は抄録に記載がなく未確認。"}}, {"id": "jr19", "rank": 19, "headline": "ファジィ階層グラフTransformerで債務不履行予測", "title": "Credit default prediction framework for heterogenous ecosystems using A cross-dataset fuzzy hierarchical graph transformer", "url": "https://doi.org/10.1177/18758967261500934", "authors": "Alaa Asim Qaffas", "venue": "Journal of Intelligent & Fuzzy Systems", "date": "2026-10-23", "citescore": 3.8, "citescore_year": "2025", "apa": "Qaffas, A. A. (2026). Credit default prediction framework for heterogenous ecosystems using A cross-dataset fuzzy hierarchical graph transformer. Journal of Intelligent & Fuzzy Systems: Applications in Engineering and Technology. https://doi.org/10.1177/18758967261500934", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "借り手の関係の不確かさを学習できるメンバーシップ度で表す、費用考慮型のファジィ階層グラフTransformer（CredFuzz-HGT）を債務不履行予測に提案した。", "p3": "申込・信用履歴・返済などの異種の記録を型つきのグラフに変換し、類似度・返済の一貫性・関係の確からしさ・新しさから辺の重みを学び、階層的な注意機構と時間の注意機構で表現を作る（抄録）。", "p5": "複数のベンチマークで評価したとするが、抄録の範囲では性能の数値は示されていない（抄録）。", "fun": "借り手同士のつながりは「ある・ない」の二択では表しきれません。どれくらい似ているか、どれくらい確かな関係かを0から1の度合いで表すファジィの考え方をネットワークに持ち込んだ点が面白いところです。", "unverified": "性能と比較手法の結果は抄録の途中で切れており未確認。"}}, {"id": "jr20", "rank": 20, "headline": "MENA地域で監査品質が利益調整を抑制", "title": "The role of audit quality in constraining earnings management and enhancing financial transparency in the MENA region", "url": "https://doi.org/10.22495/jgrv15i4art7", "authors": "Aymane Chemmaa ほか", "venue": "Journal of Governance and Regulation", "date": "2026-10-23", "citescore": 2.3, "citescore_year": "2025", "apa": "Chemmaa, A., Amine, M., Liassini, J. E., Ibrahimi, M., & El Massi, K. (2026). The role of audit quality in constraining earnings management and enhancing financial transparency in the MENA region. Journal of Governance and Regulation, 15(4), 79. https://doi.org/10.22495/jgrv15i4art7", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中東・北アフリカ（MENA）で監査品質が利益調整を抑えるかを、24の実証研究の体系的レビューで整理した。", "p3": "2011〜2023年に公表された24研究をPRISMAに沿って分析した（抄録）。", "p5": "北アフリカでは監査品質の効果にばらつきがあり、中東では強いガバナンスに支えられると操作を抑えるが、投資家保護の弱さや長い監査期間のもとでは効果が弱まった（抄録）。", "fun": "監査をしっかりすれば会計の数字のごまかしは減る、という期待は、国の制度や企業統治の強さしだいで当てはまったり当てはまらなかったりします。同じ仕組みでも置かれた環境で効き目が変わるという点が興味深いところです。", "unverified": "個々の研究の効果量の統合はしていないと読める。"}}, {"id": "jr21", "rank": 21, "headline": "独占的通信市場の顧客ロイヤルティ", "title": "Service Quality, Price Perception, and Customer Loyalty at Comoros Telecom: The Mediating Role of Satisfaction from an Islamic Business Ethics Perspective", "url": "https://jurnal.iainponorogo.ac.id/index.php/elbarka/article/view/14645", "authors": "Soule Hassane ほか", "venue": "El-Barka Journal of Islamic Economics and Business", "date": "2026-10-21", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "インフラ不足で他社を選べないコモロの通信市場で、サービス品質が満足とロイヤルティを強く左右し、価格の認識は効かなかった。", "p3": "加入者100人の横断調査をPLS-SEMで分析し、イスラームのビジネス倫理の観点から解釈した（抄録）。", "p5": "サービス品質は満足とロイヤルティを強く高め、満足は補完的な部分媒介だった。価格の認識は満足にもロイヤルティにも有意な効果がなかった（抄録）。", "fun": "ほかに選択肢がないと、客は不満でも使い続けます。でもそれは「仕方なく」で、心からの愛着は品質に満足したときだけ生まれる。囚われた顧客の行動と気持ちのずれを、島国の通信会社という珍しい舞台で見た点が面白いところです。", "unverified": "係数の数値は抄録で欠落しており未確認。標本は100人と小さい。"}}, {"id": "jr22", "rank": 22, "headline": "民俗芸能団体から見た地域の社会的健康", "title": "A Conceptual Framework for Social Health and Wellbeing in Community Elucidated by Folk Performing Arts Groups in the Context of COVID-19", "url": "https://doi.org/10.1177/20592043261492526", "authors": "Mary C. Broughton ほか", "venue": "Music and Science", "date": "2026-10-24", "sjr": 0.564, "citescore": 2.7, "citescore_year": "2025", "apa": "Broughton, M. C., Humby, M., & McDaid, L. (2026). A Conceptual Framework for Social Health and Wellbeing in Community Elucidated by Folk Performing Arts Groups in the Context of COVID-19. Music & Science, 9. https://doi.org/10.1177/20592043261492526", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "民俗の音楽・舞踊の集団参加から、地域での社会的健康と幸福を捉える新しい概念枠組みを作った。", "p3": "コロナ禍の社会的距離のもとで、民俗芸能団体の参加者にオンライン質問票で社会的健康・幸福、属性、団体についての自由記述を尋ねた（抄録）。", "p5": "伝統的な実践は文化的な帰属、同一性、向社会的行動、世代間のつながりを強めうるとし、多様な理論的視点を参加者の経験に位置づけた枠組みを示した（抄録）。", "fun": "お祭りの踊りやお囃子の仲間は、ただの趣味の集まりではなく、地域の世代をつなぐ役割も担っています。集まれなくなったコロナ禍だからこそ、そのつながりの価値が見えてきた、という視点が面白いところです。", "unverified": "回答者数などの数値は抄録の途中で切れており未確認。"}}, {"id": "jr23", "rank": 23, "headline": "人口高齢化は自動化と移民への支持を変えるか", "title": "Population Aging and Citizen Preferences for Automation and Immigration: A Cautionary Tale for Advanced Aging Economies?", "url": "https://doi.org/10.1111/psj.70171", "authors": "Sijeong Lim ほか", "venue": "Policy Studies Journal", "date": "2026-10-24", "sjr": 1.363, "citescore": 9.9, "citescore_year": "2025", "apa": "Lim, S., & Tanaka, S. (2026). Population Aging and Citizen Preferences for Automation and Immigration: A Cautionary Tale for Advanced Aging Economies? Policy Studies Journal, 54(4). https://doi.org/10.1111/psj.70171", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "人口高齢化の事実を示すと、日本では移民と自動化の両方への態度が好意的になったが、ほかの政策と並べると効果は消えた。", "p3": "日本・韓国・フランスで事前登録したサーベイ実験を行い、高齢化の情報の有無で移民と自動化への態度を比べた（抄録）。", "p5": "日本では両方への態度が改善し、韓国では移民への態度だけが改善し、フランスでは有意な効果がなかった。ただし他の選択肢と並べて考えると日本と韓国の効果は持続しなかった（抄録）。", "fun": "世界で一番高齢化が進んだ日本では、「人手が足りなくなる」と知らせるだけで外国人やロボットへの抵抗が和らぎます。でも、ほかの解決策と一緒に並べられると、その効果は消えてしまう。情報の見せ方で世論が動く様子が面白い点です。", "unverified": "効果の大きさは抄録に記載がなく未確認。"}}, {"id": "jr24", "rank": 24, "headline": "郡の富の格差と働く世代の死亡率", "title": "Local Wealth Inequality and Working-Age Mortality in US Counties", "url": "https://doi.org/10.1001/jamahealthforum.2026.3857", "authors": "Manuel Schechtl ほか", "venue": "JAMA Health Forum", "date": "2026-10-23", "sjr": 2.833, "citescore": 7.9, "citescore_year": "2025", "apa": "Schechtl, M., O’Brien, R., Bair, E., Zang, E., & Venkataramani, A. S. (2026). Local Wealth Inequality and Working-Age Mortality in US Counties. JAMA Health Forum, 7(10), e263857. https://doi.org/10.1001/jamahealthforum.2026.3857", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "米国の郡で、地域の富の格差と働く世代の年齢調整死亡率の関係を、1970〜2019年の50年にわたって調べた。", "p3": "最大18,344の郡・年の観測（732の通勤圏に入れ子）で、国立保健統計センターの死亡データと、GEOWEALTH-USの通勤圏の富のジニ係数を結びつけた（抄録）。", "p5": "25〜44歳、45〜54歳、55〜64歳の性別・年齢調整の全死因死亡率を結果とした。抄録の範囲では関連の大きさは示されていない（抄録）。", "fun": "収入の格差と健康の関係はよく調べられていますが、家や貯金などの「富」の格差は、所得の格差よりずっと大きいものです。その富の偏りが地域の空気のように住民全体の寿命に影響するのか、という問いが面白いところです。", "unverified": "結果の数値は抄録の途中で切れており未確認。"}}, {"id": "jr25", "rank": 25, "headline": "ケアするコミュニティと死の識字の過程", "title": "Researching death literacy as a process: A qualitative approach at the intersections of philosophical practice, palliative care, and caring community development", "url": "https://doi.org/10.1177/26323524261488420", "authors": "Sandra Radinger ほか", "venue": "Palliative Care and Social Practice", "date": "2026-10-23", "sjr": 0.805, "citescore": 3.1, "citescore_year": "2025", "apa": "Radinger, S., Schuchter, P., Rieger, S. V., & Wegleitner, K. (2026). Researching death literacy as a process: A qualitative approach at the intersections of philosophical practice, palliative care, and caring community development. Palliative Care and Social Practice, 20. https://doi.org/10.1177/26323524261488420", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "市民が看取りやケアの経験から身につける「死の識字（デス・リテラシー）」を、成果ではなく過程として捉える枠組みを示した。", "p3": "死の識字の研究の文献レビューから欠けている過程の次元を特定し、関係的な主体性、哲学実践、公衆衛生の視点を統合した暫定的な理論枠組みを作り、質的研究から知見を得た（抄録）。", "p5": "世界で使われている死の識字の指数のような成果指向の枠組みを、過程指向の枠組みで補う必要を論じた（抄録）。", "fun": "人生の終わりに向き合う力は、教科書ではなく、家族を介護したり見送ったりする経験の中で育ちます。その「どうやって身につくのか」という過程を、点数ではなく経験の流れとして捉えようとする発想が面白いところです。", "unverified": "質的研究の対象と規模は抄録の途中で切れており未確認。"}}, {"id": "jr26", "rank": 26, "headline": "都市の自然は移民コミュニティの幸福を生む", "title": "The untapped potential of urban nature to generate well‐being within migrant communities", "url": "https://doi.org/10.1002/pan3.70457", "authors": "Catalina Mardones ほか", "venue": "People and Nature", "date": "2026-10-24", "sjr": 1.79, "citescore": 8.2, "citescore_year": "2025", "apa": "Mardones, C., Opacin, N., Johnson, K., & Bekessy, S. (2026). The untapped potential of urban nature to generate well‐being within migrant communities. People and Nature. https://doi.org/10.1002/pan3.70457", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "都市の自然が移民コミュニティの幸福に与える影響を、39研究の体系的レビューで整理した。", "p3": "PRISMAに沿い、量的・質的・混合研究を集めて、都市の自然との関わりと移民の幸福の関係を分析した（抄録）。", "p5": "影響は個人内・対人・文化・場所の4領域と7種類の幸福に及び、肯定的な影響（感情、交流、帰属感）が否定的な影響（疎外感、危険の感覚、主流集団との対立）を上回った（抄録）。", "fun": "公園や緑は都会の人の心を落ち着かせますが、その研究の多くは地元の多数派の人が対象でした。移民にとっての公園は、故郷を思い出す場にも、居心地の悪い場にもなる。同じ緑が人によって違う意味を持つという点が面白いところです。", "unverified": "研究の地域分布などは抄録の途中で切れており未確認。"}}, {"id": "jr27", "rank": 27, "headline": "孤独と変形性関節症をつなぐ椅子立ち上がり", "title": "Chair-Rise Difficulty as a Functional Correlate in the Longitudinal Association Between Loneliness and Incident Osteoarthritis in Older Adults.", "url": "https://doi.org/10.1177/07334648261500729", "authors": "Karim A ほか", "venue": "Journal of applied gerontology : the official journal of the Southern Gerontological Society", "date": "2026-10-22", "citescore": 5.2, "citescore_year": "2025", "apa": "Karim, A., Azhar Hussain, M., & Qaisar, R. (2026). Chair-Rise Difficulty as a Functional Correlate in the Longitudinal Association Between Loneliness and Incident Osteoarthritis in Older Adults. Journal of Applied Gerontology. https://doi.org/10.1177/07334648261500729", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用", "preprint": false, "short": true, "p1": "孤独と社会的孤立は変形性関節症の発症と直接には結びつかず、椅子からの立ち上がりの困難や抑うつを通じて間接に結びつくことを示した。", "p3": "欧州12か国の50歳以上6,232人（SHAREの第7〜9波、2017〜2022年）で、構造方程式モデルにより媒介を検定した（抄録）。", "p5": "直接の関連はなく、椅子立ち上がりの困難が最も強い媒介（β=0.74）、抑うつがそれに続いた（β=0.04）。身体不活動は立ち上がりの困難を通じて間接に効いた（β=0.26）（抄録）。", "fun": "寂しさが関節の病気につながるのは不思議に思えますが、寂しいと出歩かなくなり、足腰が弱って椅子から立ち上がりにくくなる、という道筋を通っていました。心の状態と体の衰えが一本の線でつながる様子が見えるのが面白い点です。", "unverified": "媒介効果の推定の詳細は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "機密を守るオープンソースRAG基盤MyGPT", "title": "Democratizing reliable knowledge-seeking with MyGPT: a privacy-first, open-source retrieval-augmented generation platform", "url": "https://doi.org/10.1038/s41467-026-78509-6", "authors": "Jaimin Patel ほか", "venue": "Nature Communications", "date": "2026-10-24", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Patel, J., Downing, J., Ferguson, H., You, T., Malinverni, D., D. A, S. M., Chen, I., Sluter, M., Moorefield, B., Paréj, K., Ragavan, M., Morris, C., Keerthi, D., Becerra Armada, D., Mészáros, B., Trivedi, V. D., Alam, S., Woodard, A., Alford, D., et al. (2026). Democratizing reliable knowledge-seeking with MyGPT: a privacy-first, open-source retrieval-augmented generation platform. Nature Communications. https://doi.org/10.1038/s41467-026-78509-6", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "機密データを外に出さずに使える、オープンソースのLLMによる検索拡張生成（RAG）基盤MyGPTを作った。", "p3": "手元または安全な組織内環境で動き、利用者が定めた文献・臨床文書・政策文書の書庫を検索して答え、「関連度スコア」と「幻覚指数」の確信度指標と出典を示す（抄録）。", "p5": "商用サービスに代わる安価でモジュール化された選択肢として、インターネットのない遠隔地での利用も含めて示した。抄録の範囲では定量評価の数値は示されていない（抄録）。", "fun": "便利なAIに秘密の書類を読ませると、情報が外に漏れる心配があります。そこで、AIを自分の手元に置き、手持ちの資料だけを根拠に答えさせ、どこに書いてあるかも示させる。安全と信頼を両立させる設計の考え方が面白いところです。", "unverified": "性能評価の結果は抄録に記載がなく未確認。"}}, {"id": "jr29", "rank": 29, "headline": "AIの偽ニュースにAIとの対話で免疫をつける", "title": "AI vs. AI: An AI-Enabled Conversational Intervention to Inoculate Against AI-Generated Fake News", "url": "https://doi.org/10.1007/s10796-026-10827-y", "authors": "Mohammad S. Najjar ほか", "venue": "Information Systems Frontiers", "date": "2026-10-24", "sjr": 2.549, "citescore": 26.4, "citescore_year": "2025", "apa": "Najjar, M. S., & Nasir, M. (2026). AI vs. AI: An AI-Enabled Conversational Intervention to Inoculate Against AI-Generated Fake News. Information Systems Frontiers. https://doi.org/10.1007/s10796-026-10827-y", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用", "preprint": false, "short": true, "p1": "AIとの対話で、別のAIが作った偽ニュースへの「心理的な予防接種」ができることを実験で示した。", "p3": "心理的接種理論に基づき、利用者と適応的に対話するAIエージェント「Alex」を作り、542人のソロモン4群実験で効果を検証した（抄録）。", "p5": "2×2の分散分析で、介入は本当と偽の見出しを見分ける力に有意な主効果を持ち、事前テストによる感作の証拠はなかった（抄録）。", "fun": "弱めた病原体で免疫をつけるワクチンのように、だましの手口を先に少し体験させると、本物のだましに強くなります。その「予防接種」をAIとの会話で行い、AIの作った偽ニュースに対抗するという、毒をもって毒を制す発想が面白い点です。", "unverified": "効果量と持続期間は抄録に記載がなく未確認。"}}, {"id": "jr30", "rank": 30,
