sing supply in cities. Environment and Planning A: Economy and Space. https://doi.org/10.1177/0308518x261486023", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国の「機会ゾーン（OZ）」指定が主要都市の住宅供給（住所数の増加）を増やしたことを空間的な差の差法で示しつつ、基本推定の効果の41%は周辺からの空間的な波及であり、効果は比較的恵まれた地区に偏っていたことを明らかにした（抄録）。", "p2": "2017年の税制改革で創設されたOZは、低所得地域への投資にキャピタルゲイン課税の優遇を与える。推進派は新たな開発を生むと主張するが、批判派はいずれ起きた開発、とくに既に勢いのある地域の開発を補助しているだけだと指摘する（抄録）。", "p3": "2015〜2022年の四半期ごとの米国郵便公社（USPS）の住所データで、マッチングした対照地区と比べる空間的な差の差法を用い、空間的な波及と指定前からの成長傾向を同時に考慮してOZ指定の効果を分離した（抄録）。", "p4": "評価は住宅用住所の増加率で、基本の差の差法と空間自己相関を考慮したモデルの比較、隣接OZの有無、地区の困窮度による効果の異質性を調べた（抄録）。", "p5": "主要都市のOZは指定後に住宅用住所の増加が統計的に有意に増えた。ただし基本推定の効果のうち41%は成長の空間自己相関を考慮すると吸収され、見かけの効果のかなりの部分は直接の効果ではなく広域の波及だった。隣接OZの存在が成長に寄与する証拠はなく、OZの集積が開発の減少と関連する場合もあった。効果は比較的恵まれた地区で最大で、最も困窮した地区ではほとんどなかった（抄録）。", "p6": "抄録の範囲では、住所数は住宅の質や価格、住民の入れ替わり（ジェントリフィケーション）を捉えない。解釈：OZの選定自体が州知事の裁量で行われたため、選定の偏りへの対処の詳細は本文で確かめる必要がある。", "fun": "「この地区に投資すれば税金を安くします」という政策で家が増えたように見えても、実は周りの地区の勢いがこぼれてきただけかもしれません。この研究は、地図上の隣どうしの影響を差し引くと、見かけの効果の4割が消えることを示しました。しかも、本当に助けが必要な最も貧しい地区ではほとんど効果がなかったというのは、政策の目的からすると皮肉な結果です。", "unverified": "効果の大きさ（増加率）の数値と標本の地区数は抄録になく未確認。"}}, {"id": "jr16", "rank": 16, "headline": "LLM生成ニュースは比喩で静かに立場を取る", "title": "Quietly taking sides: The machine habitus and metaphorical framing in human and LLM-generated news", "url": "https://doi.org/10.1177/14648849261494649", "authors": "Xiaoshuang Guo", "venue": "Journalism", "date": "2026-10-08", "sjr": 2.087, "citescore": 8.3, "citescore_year": "2025", "apa": "Guo, X. (2026). Quietly taking sides: The machine habitus and metaphorical framing in human and LLM-generated news. Journalism. https://doi.org/10.1177/14648849261494649", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "LLMが書くニュースは、人間の記者と比べて比喩の使い方が慣習的で、出来事を手続き的・脱政治的に描く「機械のハビトゥス」を持つことを示した（抄録）。", "p3": "ブルデューの場の理論に基づき、中国の対独投資を扱う25年分のドイツの報道（人間2,975、LLM 1,924の比喩）を比べ、3つのLLMと4つの指示で4,877の比喩を生む実験を行った（抄録）。", "p5": "記者は意図的で評価を帯びた比喩を好んだが、LLMは既定で慣習的な比喩を使った。この傾向は年やモデル版をまたいで持続し、指示で変わるのは限られた源領域の範囲内だった（抄録）。", "fun": "「投資が押し寄せる」と書くか「投資が行われる」と書くかで、読者の受け取り方は変わります。AIに記事を書かせると、どのモデルでも淡々とした比喩に寄る癖がありました。中立に見える書き方も一つの立場になりうる、というのがこの研究の問いかけです。", "unverified": "人間の記事との差の定量値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "技術準備度の高い監査人ほどIT専門家に時間配分", "title": "The Role of Auditors’ Technology Readiness in IT Specialist Hour Allocation under Budget Pressure", "url": "https://doi.org/10.2308/ajpt-2024-049", "authors": "Maarten A. Siglé ほか", "venue": "Auditing", "date": "2026-10-07", "sjr": 2.32, "citescore": 5.3, "citescore_year": "2025", "apa": "Siglé, M. A., van Brenk, H., & Gold, A. (2026). The Role of Auditors’ Technology Readiness in IT Specialist Hour Allocation under Budget Pressure. Auditing: A Journal of Practice & Theory, 1–19. https://doi.org/10.2308/ajpt-2024-049", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "監査人の技術受容度（technology readiness）が高いほど、予算圧力が強いときにIT専門家へ多くの時間を配分することを実験で示した（抄録）。", "p3": "経験の異なる監査人286人を対象に、技術受容度と予算圧力を変えてIT専門家の時間配分を測る実験を行った（抄録）。", "p5": "技術受容度が高いとIT専門家への配分が増えたが、それは予算圧力が高い場合だけだった。動機の次元と自己申告のIT知識も配分と関連した（抄録）。", "fun": "予算がきついとき、監査人は高くつく専門家を呼ぶのを控えがちです。ところが技術に前向きな監査人ほど、まさにそういうときに専門家に時間を割いていました。個人の技術への態度が、監査の品質を左右する場面があるということです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "SPAC上場は開示の質が低く訴訟リスクを規制裁定", "title": "Disclosure Quality, Litigation Risk, and Regulatory Arbitrage in SPACs", "url": "https://doi.org/10.1111/fima.70069", "authors": "Yaxuan Wen ほか", "venue": "Financial Management", "date": "2026-10-07", "sjr": 3.477, "citescore": 8.7, "citescore_year": "2025", "apa": "Wen, Y., & Zhu, M. (2026). Disclosure Quality, Litigation Risk, and Regulatory Arbitrage in SPACs. Financial Management. https://doi.org/10.1111/fima.70069", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "SPAC（特別買収目的会社）による上場は、規制の隙を利用して情報量が少なく楽観的な開示をしやすく、訴訟リスクを高めることを示した（抄録）。", "p3": "基礎的な条件で対応づけた通常のIPO企業と比べ、開示の情報量・楽観度・過信の度合いと、合併後の証券訴訟の発生を分析した（抄録）。", "p5": "SPACの開示は情報量が少なく楽観的・過信的で、合併後1年以内の証券訴訟の可能性が高かった。リスクの上昇はSPACの方式そのものではなく開示の慣行から生じていた（抄録）。", "fun": "SPACは「空箱の会社」を先に上場させ、後で本物の会社と合併する上場の近道です。通常の上場より規制がゆるい部分を使うと、将来の見通しを強気に書きやすくなり、結果として訴えられやすくなっていました。問題は仕組みより書き方にある、という整理が興味深い点です。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr19", "rank": 19, "headline": "サイバー開示義務が他領域のコンプライアンスに波及", "title": "Cybersecurity Disclosure Mandates and Cross‐Domain Compliance Spillovers", "url": "https://doi.org/10.1111/fima.70072", "authors": "Lei Gao ほか", "venue": "Financial Management", "date": "2026-10-07", "sjr": 3.477, "citescore": 8.7, "citescore_year": "2025", "apa": "Gao, L., Jiang, D., Wang, J., & Wu, W. (2026). Cybersecurity Disclosure Mandates and Cross‐Domain Compliance Spillovers. Financial Management. https://doi.org/10.1111/fima.70072", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "米国州のサイバー侵害通知法の導入が、サイバー以外の分野での企業の連邦規制違反も減らす波及効果を持つことを示した（抄録）。", "p3": "州ごとに段階的に導入された侵害通知法を使い、導入後の企業の非サイバー分野の連邦規制違反を分析した（抄録）。", "p5": "導入後1年目に非サイバー分野の違反が5%以上減ったが効果は一時的だった。組織能力と内部統制が強い企業で減少が大きかった（抄録）。", "fun": "情報漏えいを公表させる法律が、なぜか労働安全や環境など別分野の違反まで減らしていました。開示の義務が会社全体のコンプライアンスを見直すきっかけになったと解釈できます。ただし効果は1年で消えるので、ショック療法に近い働きのようです。", "unverified": "違反の分野ごとの内訳は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "CAMなしの監査報告は問題なしを意味するか", "title": "No Critical Audit Matters—No Problem?", "url": "https://doi.org/10.2308/horizons-2025-136", "authors": "Brooke D. Beyer ほか", "venue": "Accounting Horizons", "date": "2026-10-07", "citescore": 4.3, "citescore_year": "2025", "apa": "Beyer, B. D., Guragai, B., & Rapley, E. T. (2026). No Critical Audit Matters—No Problem? Accounting Horizons, 1–19. https://doi.org/10.2308/horizons-2025-136", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "監査報告書で「監査上の重要事項（CAM）なし」とされる場合が増えており、予想外のCAMなしは財務報告の問題と関連することを示した（抄録）。", "p3": "CAM報告の初期と近年を比較し、CAMなしの決定要因を分析したうえで、予想外のCAMなしと虚偽表示・PCAOBの検査指摘の関係を調べた（抄録）。", "p5": "CAMなしは時間とともに増え、規模・報告の複雑さ・公正価値の露出・M&Aやのれん減損と負に関連した。予想外のCAMなしの企業は虚偽表示と監査報告関連の指摘の割合が高かった（抄録）。", "fun": "監査人が「特に重要な論点はありません」と書くのは、本当に問題がないからでしょうか。この研究では、普通なら論点があるはずの会社でそう書かれている場合、後で会計の誤りが見つかりやすいことが分かりました。「書かれていないこと」も情報になるという例です。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr21", "rank": 21, "headline": "サステナ開示の業界標準からの乖離が企業価値に影響", "title": "Polarization in sustainability disclosure: the role of accounting structural deviation and its impact on firm value and audit fees", "url": "https://doi.org/10.1108/cg-01-2026-0008", "authors": "Thuy Nguyen Thi Thanh ほか", "venue": "Corporate Governance: The International Journal of Business in Society", "date": "2026-10-08", "citescore": 11.1, "citescore_year": "2025", "apa": "Nguyen Thi Thanh, T., & Nguyen, N. M. (2026). Polarization in sustainability disclosure: the role of accounting structural deviation and its impact on firm value and audit fees. Corporate Governance: The International Journal of Business in Society, 1–20. https://doi.org/10.1108/cg-01-2026-0008", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "サステナビリティ開示が業界の標準から両極に離れる「分極化」が、企業価値と逆U字の関係を持ち、監査報酬を高めることを示した（抄録）。", "p3": "ASEAN主要国の上場企業2,235企業年のパネルで、構造方程式モデルによる調整付き媒介分析を行った（抄録）。", "p5": "分極化と企業価値は逆U字の関係で、適度な差別化の最適点があった。分極化は監査報酬の上昇と関連し、環境の不確実性が媒介した（抄録）。", "fun": "環境への取り組みを業界の平均よりも極端に多く書く会社、極端に少なく書く会社は、どう評価されるのか。適度に目立つのは得だが、行き過ぎると逆効果という「ほどほどが一番」の関係が見つかりました。監査人の手間が増えて報酬が上がるのも納得できる結果です。", "unverified": "分極化指標の作り方の詳細は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "運転資本と財務困窮の非線形関係はライフサイクルで変化", "title": "WORKING CAPITAL AND FINANCIAL DISTRESS: THE ROLES OF CORPORATE LIFE CYCLE AND ECONOMIC DEVELOPMENT", "url": "https://doi.org/10.59075/jsrd.v7i7.563", "authors": "Rooman Arshad Malhi ほか", "venue": "JOURNAL OF SOCIAL RESEARCH DEVELOPMENT", "date": "2026-10-08", "apa": "Rooman Arshad Malhi, Muhammad Ashraf, & Ahmad Ghazali. (2026). WORKING CAPITAL AND FINANCIAL DISTRESS: THE ROLES OF CORPORATE LIFE CYCLE AND ECONOMIC DEVELOPMENT. Journal of Social Research Development, 7(7), 432–456. https://doi.org/10.59075/jsrd.v7i7.563", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "運転資本の回転日数と財務の健全性の関係が非線形で、企業のライフサイクルと経済発展の段階で異なることを示した（抄録）。", "p3": "134か国の上場企業25,258社・347,736企業年（2000〜2025年）で、キャッシュ・コンバージョン・サイクルとAltmanの国際Z''スコア・困窮区分の関係を2次式で推定した（抄録）。", "p5": "Zスコアとの関係の頂点は基本モデルで355.29日、固定効果版で335.42日・376.53日。困窮リスクを最小にする転換点は259.60〜306.25日の範囲だった。成熟企業や先進国企業は回転期間の長期化に寛容だった（抄録）。", "fun": "商品を仕入れてから代金を回収するまでの日数は、短すぎても長すぎても会社の健全性に悪いようです。世界134か国のデータで、その「ちょうどよい長さ」が1年近くのところにあることが示されました。ただし著者は、これを全社共通の目標値と考えないよう注意しています。", "unverified": "国・業種別の転換点の詳細は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "ESG開示から統合報告の質を経て価値創造へ", "title": "The Accountability Pathway: Linking ESG Disclosure, Integrated Reporting Quality, and Value Creation in Southeast Asia", "url": "https://doi.org/10.1002/csr.71048", "authors": "Nha Minh Nguyen ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-08", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Nguyen, N. M., Abu Afifa, M., Bui, D. V., Van, H. V., & Vo, D. T. T. (2026). The Accountability Pathway: Linking ESG Disclosure, Integrated Reporting Quality, and Value Creation in Southeast Asia. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71048", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "東南アジアの上場企業で、ESG開示が統合報告の質を高め、それを通じて投資効率という価値創造につながる「説明責任の経路」を示した（抄録）。", "p3": "ASEAN6か国の2020〜2024年、2,605社のパネルで、最尤法の構造方程式モデルによる調整付き媒介分析を、国の固定効果を考慮して行った（抄録）。", "p5": "ESG開示は統合報告の質を有意に高め、報告の質が価値創造への主要な経路だった。エネルギー転換の圧力は説明責任の重要性を強め、ガバナンスはESG戦略の実行力に影響した（抄録）。", "fun": "環境や社会への配慮を書くだけでは会社の価値は上がらず、それを財務と統合したわかりやすい報告にできたときに初めて投資の効率が上がる、という道筋を示した研究です。「書く」から「伝わる」への一段階が大事だという示唆です。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr24", "rank": 24, "headline": "日本基準の重ね継手RC橋脚の履歴劣化を実験検証", "title": "Deteriorated Hysteresis Behavior of Reinforced Concrete Bridge Columns With Lap‐Spliced Circular Hoop Reinforcement", "url": "https://doi.org/10.1002/eqe.70309", "authors": "Ping‐Hsiung Wang ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-08", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Wang, P.-H., Huang, C.-Y., & Tseng, C.-C. (2026). Deteriorated Hysteresis Behavior of Reinforced Concrete Bridge Columns With Lap‐Spliced Circular Hoop Reinforcement. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70309", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "日本の道路橋示方書と台湾の設計慣行に基づく重ね継手円形帯筋のRC橋脚の、劣化を伴う履歴挙動を実験で明らかにした（抄録）。", "p3": "円形帯筋（CH）の橋脚5体を軸方向鉄筋比と形状比を変えて載荷し、文献のらせん筋（CS）橋脚5体と比べた（抄録）。", "p5": "90度フックの重ね継手帯筋はコア破壊後に定着を失い、中間帯鉄筋が拘束機構の崩壊を防ぐのに不可欠だった。終局ドリフト（包絡線の20%強度低下）は鉄筋比と形状比の増加でわずかに・中程度に増えた（抄録）。", "fun": "橋脚の鉄筋を巻く輪っかは、端の留め方次第で地震時の粘り強さが大きく変わります。この実験では、コンクリートの芯が壊れると輪っかの留めが外れ、補助の鉄筋がなければ一気に拘束が失われることが示されました。設計図の小さな細部が命運を分ける例です。", "unverified": "劣化パラメータの数値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "3パラメータ連続体ティモシェンコ梁で高次モード評価", "title": "A Three‐Parameter Continuum Timoshenko Beam Framework for Evaluating Higher‐Mode Effects in High‐Rise Buildings With Rotational and Translational Base Flexibility", "url": "https://doi.org/10.1002/eqe.70310", "authors": "Mohammad Hossein Asadi Jafari ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-08", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Asadi Jafari, M. H., Zhou, J., & Tong, F. (2026). A Three‐Parameter Continuum Timoshenko Beam Framework for Evaluating Higher‐Mode Effects in High‐Rise Buildings With Rotational and Translational Base Flexibility. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70310", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "基部に回転・水平の柔性を持つ高層建物の高次モード効果を、せん断変形と回転慣性を含む3パラメータの連続体ティモシェンコ梁で評価する枠組みを示した（抄録）。", "p3": "従来のオイラー・ベルヌーイ片持ち梁の2パラメータ類推に、無次元のせん断剛性を加えて拡張した等価線形の力学モデル（抄録）。", "p5": "せん断柔性は細長い系の1次モードにはほとんど影響しないが、高次の固有値・モード形・有効質量比を大きく変えた。第2スペクトルの挙動なども識別した（抄録）。", "fun": "高いビルは地震のとき、全体がゆっくり揺れる1次モードだけでなく、途中でくねる高次モードでも揺れます。梁を「曲がるだけ」とみなす簡単なモデルでは、ずれるように変形する効果を見落とします。その効果が高次モードで大きく効くことを、少ない無次元数で示した点が明快です。", "unverified": "数値例の詳細は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "FEMと深層学習でPC桁の長期劣化を予測", "title": "Predicting long-term degradation of prestressed bridge girders using a hybrid finite element and deep learning approach", "url": "https://doi.org/10.1177/13694332261494334", "authors": "Imdad Ullah Khan ほか", "venue": "Advances in Structural Engineering", "date": "2026-10-07", "citescore": 5.2, "citescore_year": "2025", "apa": "Khan, I. U., Khalid, M. I., Fei, J., Tanveer, M., Sim, S.-H., & Chen, X. (2026). Predicting long-term degradation of prestressed bridge girders using a hybrid finite element and deep learning approach. Advances in Structural Engineering. https://doi.org/10.1177/13694332261494334", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "PC鉄道桁の腐食による長期劣化を、有限要素解析と深層学習を組み合わせて効率よく予測する枠組みを示した（抄録）。", "p3": "ABAQUSでPC桁をモデル化し、緊張材の弾性係数を経験式で漸減させる腐食と20年分の実測温度を与えてたわみを計算し、その計算を深層学習で代替した。クリープ・乾燥収縮・プレストレス損失は含まない（抄録）。", "p5": "代替モデルの精度の数値は抄録が途中で切れており確認できない（抄録）。", "fun": "橋の桁が20年かけてどう劣化するかを細かく計算すると、時間がかかりすぎます。この研究は、重い計算の結果をAIに学ばせて素早く予測できるようにしました。ただしコンクリートの縮みなど他の長期変化は入っていないので、腐食と温度の効果に限った予測です。", "unverified": "代替モデルの誤差の数値は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "階層特徴融合で欠測した加速度応答を再構成", "title": "Hierarchical Feature Fusion Reconstruction of Missing Acceleration Responses for Offshore Platforms", "url": "https://doi.org/10.3390/jmse14191862", "authors": "Anwen Sun ほか", "venue": "Journal of Marine Science and Engineering", "date": "2026-10-07", "citescore": 5.6, "citescore_year": "2025", "apa": "Sun, A., Wang, M., Shi, Z., Yang, B., Feng, Y., & Liu, J. (2026). Hierarchical Feature Fusion Reconstruction of Missing Acceleration Responses for Offshore Platforms. Journal of Marine Science and Engineering, 14(19), 1862. https://doi.org/10.3390/jmse14191862", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "センサ故障や通信途絶で連続して欠けた加速度応答を、3つの階層の特徴を融合して再構成する方法（HFFR）を示した（抄録）。", "p3": "多スケールの局所波形の符号化、欠損区間の前後を使う双方向の時系列モデル、相関に基づく適応的な重み付けを組み合わせ、ジャケット式海洋構造物の数値応答とHardanger橋の長期実測で検証した（抄録）。", "p5": "CNN-LSTMやBiLSTM-SAより再構成精度が高く、主要な波形と卓越振動数成分を回復し、欠損率を変えても安定していた（抄録）。", "fun": "橋や海洋構造物のセンサは、故障や通信の途切れでデータが抜けることがあります。この研究は、抜けた前後の揺れ方と近い時間の形の特徴を組み合わせて、空白部分を埋めました。実際の長大吊橋の計測データでも試している点が実用的です。", "unverified": "精度の数値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "車両非依存コヒーレンスで走行振動数同定の感度を検証", "title": "Sensitivity to operational variables in drive-by modal frequency identification using vehicle-independent coherence filtering", "url": "https://doi.org/10.1016/j.engstruct.2026.123924", "authors": "Abdulrrahman AlGadi ほか", "venue": "Engineering Structures", "date": "2026-10-07", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "AlGadi, A., Luleci, F., & Catbas, F. N. (2027). Sensitivity to operational variables in drive-by modal frequency identification using vehicle-independent coherence filtering. Engineering Structures, 370, 123924. https://doi.org/10.1016/j.engstruct.2026.123924", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、車両に依存しないコヒーレンスによるフィルタで橋の固有振動数を走行計測から同定する方法について、運用条件（速度など）への感度を調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "走る車の揺れから橋の揺れを読み取るとき、車自身の揺れや速度、路面の凹凸が邪魔をします。題名から読み取れる問いは、車の性質に左右されない指標を使うと、どの走行条件で橋の振動数が見えやすくなるのか、という実用上とても大事な問題です。", "unverified": "内容全体が未確認。"}}, {"id": "jr29", "rank": 29, "headline": "多セットアップのベイズFFTで複数モードを同定", "title": "Multi-setup Bayesian FFT modal identification with multiple modes leveraging on second order information", "url": "https://doi.org/10.1016/j.ymssp.2026.115020", "authors": "Wei Zhu ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-10-08", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Zhu, W., Li, B., Yang, D.-H., & Yi, T.-H. (2026). Multi-setup Bayesian FFT modal identification with multiple modes leveraging on second order information. Mechanical Systems and Signal Processing, 261, 115020. https://doi.org/10.1016/j.ymssp.2026.115020", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、複数回のセンサ配置（マルチセットアップ）の計測を統合するベイズFFTモード同定を、2次の情報を使って複数モードに拡張した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "センサの数が足りないときは、置き場所を変えて何回かに分けて測ります。題名から読み取れる問いは、別々に測った記録をつなぎ合わせて、近い振動数の複数のモードをどれだけの不確かさで見分けられるか、というものです。", "unverified": "内容全体が未確認。"}}, {"id": "jr30", "rank": 30, "headline": "400km/h高速鉄道で橋梁起因の周期的軌道不整を同定", "title": "Measurement-driven identification of bridge-induced periodic track irregularities for condition assessment of 400 km/h high-speed railways", "url": "https://doi.org/10.1016/j.measurement.2026.123457", "authors": "Xingyu Liu ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-07", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Liu, X., Shi, J., Han, F., Gao, Y., Guo, M., & Zhang, Y. (2026). Mea ります。複雑な配分の問題が「平均でいくら分入れるか」という1つの数の選択に帰着するのは数学的にも美しい結果です。", "unverified": "価値の差別化が有利になる条件の詳細は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "権限委譲型リーダーが従業員のサービス回復を高める", "title": "Winning at service recovery: the power of empowering leadership and proactive employees", "url": "https://doi.org/10.1108/jhti-03-2026-0335", "authors": "Ayman Abdelhakim ほか", "venue": "Journal of Hospitality and Tourism Insights", "date": "2026-10-08", "citescore": 11.2, "citescore_year": "2025", "apa": "Abdelhakim, A., Supina, S., Elsayed, Y. N. M. K., Khreis, S. H. A., & Abuelhassan, A. E. (2026). Winning at service recovery: the power of empowering leadership and proactive employees. Journal of Hospitality and Tourism Insights, 1–18. https://doi.org/10.1108/jhti-03-2026-0335", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "権限委譲型のリーダーシップが職業的自己効力感を通じて従業員のサービス回復の成果を高めるのは、主体的な従業員の場合に限られることを示した（抄録）。", "p3": "宿泊業の最前線の従業員420人の複数時点の質問紙調査で、PROCESSモデルにより媒介と調整を検定した（抄録）。", "p5": "権限委譲型リーダーシップはすべての部下の自己効力感とサービス回復を高めるわけではなく、従業員の主体性の高さが効果の重要な境界条件だった（抄録）。", "fun": "「任せるから自由にやって」という上司は、いつでも良い上司とは限りません。自分から動ける部下には力になりますが、そうでない部下には負担にもなりえます。お客の苦情にうまく対応できるかどうかが、上司と部下の組み合わせで変わるという話です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "保険会社への信頼は他人の請求体験からも移る", "title": "FACTORS INFLUENCING CUSTOMER TRUST AND BRAND PERCEPTION IN INSURANCE COMPANIES: PERSONAL EXPERIENCE, BORROWED EXPERIENCE AND THE ASYMMETRY OF THE CLAIM", "url": "https://doi.org/10.5281/zenodo.23229208", "authors": "Ibragimova, Maftunakhon Shukhratjon kizi", "venue": "Zenodo (Journal article)", "date": "2026-10-08", "apa": "Ibragimova, M. S. kizi. (2026). FACTORS INFLUENCING CUSTOMER TRUST AND BRAND PERCEPTION IN INSURANCE COMPANIES: PERSONAL EXPERIENCE, BORROWED EXPERIENCE AND THE ASYMMETRY OF THE CLAIM. Zenodo. https://doi.org/10.5281/ZENODO.23229208", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された論文記録の抄録を使用", "preprint": false, "short": true, "p1": "保険会社への信頼の大部分は顧客ごとの個人的なもので、自分の請求体験が非対称に効き、友人から聞いた「借りた経験」も独立に効くことを示した（抄録）。", "p3": "16社の顧客1,200人の調査で、自身の請求体験、友人の話、制度的な信号（規制当局の評価）、信頼傾向、ブランドイメージ、行動意図を測った（抄録）。", "p5": "信頼の分散の36.0%が会社間、64.0%が同じ会社の顧客間にあった。請求なしに比べ、円滑な支払いは7点尺度で+0.82、遅い支払いは−0.91、拒否は−1.80で、拒否の重さは円滑な支払いの2.2倍。友人の話は1点あたり0.35で、自身の請求の有無で重みは変わらなかった（差0.06、z=1.15）（抄録）。", "fun": "保険は「いざというとき払ってくれるか」がすべてです。払ってもらえたときの喜びより、断られたときの失望のほうが2倍以上大きいという非対称性がはっきり出ました。さらに、友達から聞いた話も自分の体験とは別に信頼を動かしていました。信頼は口コミでも移るのです。", "unverified": "Zenodo上の記録で、査読の有無は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "AIコンパニオンの「合成マインドフルネス」と孤独", "title": "AI Companions and Loneliness: Conceptualizing and Operationalizing Synthetic Mindfulness and Exploring Its Role in Alleviating Loneliness", "url": "https://doi.org/10.1002/mar.70288", "authors": "Varqa Shamsi Bahar ほか", "venue": "Psychology and Marketing", "date": "2026-10-08", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Bahar, V. S., Golossenko, A., Kim, S., & Jaakkola, M. (2026). AI Companions and Loneliness: Conceptualizing and Operationalizing Synthetic Mindfulness and Exploring Its Role in Alleviating Loneliness. Psychology & Marketing. https://doi.org/10.1002/mar.70288", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "AIコンパニオンが注意深くそばにいて、判断せずに関わり、敏感に応じると利用者が感じる「合成マインドフルネス」の3次元の尺度を作り、それが孤独を和らげる経路を示した（抄録）。", "p3": "社会的代理理論に基づき、1つの質的研究と4つの量的研究で尺度を開発・検証し、最終研究で孤独への効果を検証した（抄録）。", "p5": "合成マインドフルネスの判断が高いほど、所属感と自尊心が強まることを通じて孤独が減った（抄録）。", "fun": "AIの話し相手は本当に寂しさを和らげるのでしょうか。この研究によると、効くかどうかはAIの性能そのものより、利用者が「ちゃんと聞いてくれている」と感じるかどうかにかかっていました。そう感じると、居場所があるという感覚や自己評価が高まり、孤独が減るという道筋です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "日々の湿度と高齢者の孤独の関連", "title": "Daily Association Between Ambient Humidity and Loneliness in Older Adults: The Role of Depressive Symptoms and Marital Status", "url": "https://doi.org/10.1177/01650254261487323", "authors": "Joseph Kojo Oduro ほか", "venue": "International Journal of Behavioral Development", "date": "2026-10-08", "sjr": 1.495, "citescore": 6.8, "citescore_year": "2025", "apa": "Oduro, J. K., Michalowski, V., & Pauly, T. (2026). Daily Association Between Ambient Humidity and Loneliness in Older Adults: The Role of Depressive Symptoms and Marital Status. International Journal of Behavioral Development. https://doi.org/10.1177/01650254261487323", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "湿度の高い日ほど高齢者が孤独を感じやすく、その関連は未婚者でのみ見られることを日記調査で示した（抄録）。", "p3": "スイスのZWÄG 65+研究の地域在住高齢者108人（平均73.5歳、女性54%）の14日間の日記と地元の気象観測所の湿度を、マルチレベルモデルで個人内の関連として分析した（抄録）。", "p5": "湿度が高い日は同じ日の孤独が高く（β=1.03、p<.01）、抑うつと属性を統制しても残った。抑うつは独立に強く関連した（β=2.67）。湿度との関連は未婚者だけに見られた（抄録）。", "fun": "じめじめした日には気分がふさぐ、という感覚は昔からありますが、孤独との関係は調べられていませんでした。この研究では、同じ人でも湿度の高い日ほど孤独を感じていました。結婚している人では見られなかったので、そばに人がいることが天気の影響を和らげるのかもしれません。", "unverified": "標本が108人と小さく、一般化は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "リーダーシップと所属感のギャップをめぐる6つの問い", "title": "The Leadership-Belonging Gap: Six Questions We Need to Answer", "url": "https://doi.org/10.1177/15480518261494350", "authors": "Joseph Crawford ほか", "venue": "Journal of Leadership and Organizational Studies", "date": "2026-10-07", "sjr": 1.539, "citescore": 11.9, "citescore_year": "2025", "apa": "Crawford, J., Riggio, R., Newstead, T., Allen, K.-A., & Baumeister, R. (2026). The Leadership-Belonging Gap: Six Questions We Need to Answer. Journal of Leadership & Organizational Studies. https://doi.org/10.1177/15480518261494350", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "リーダーシップ研究が見落としてきた「所属感」を中心に据え、今後答えるべき6つの問いを提示した論考（抄録）。", "p3": "所属の仮説と所属の社会心理学をリーダーシップ研究につなげ、人との関係、社会的アイデンティティ、場所への愛着という3つの視点を統合した（抄録）。", "p5": "所属の境界、ハイブリッド勤務、職場空間の設計、リーダー自身の所属感、権力による社会的距離、仕事・家族・地域にまたがる所属の拠り所の変化、の6つの問いを提案した（抄録）。", "fun": "企業は研修や組織文化づくりにお金をかけていますが、社員の元気や定着は改善しないままです。この論文は、その根っこに「ここにいていいと感じられるか」という所属感があると指摘します。上司自身も所属感を必要としているという視点が新鮮です。", "unverified": "実証データはない。"}}, {"id": "jr41", "rank": 41, "headline": "高齢期の健康の社会的決定要因の潜在構造を移民と比較", "title": "Latent Structures of Social Determinants of Health in Later Life: A Comparison of U.S.-Born and Immigrants", "url": "https://doi.org/10.1177/08982643261494575", "authors": "Man Guo ほか", "venue": "Journal of Aging and Health", "date": "2026-10-08", "sjr": 1.146, "citescore": 5.4, "citescore_year": "2025", "apa": "Guo, M., & Wang, Y. (2026). Latent Structures of Social Determinants of Health in Later Life: A Comparison of U.S.-Born and Immigrants. Journal of Aging and Health. https://doi.org/10.1177/08982643261494575", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "高齢期の健康の社会的決定要因（SDOH）の潜在構造は、米国生まれと移民でほぼ共通だが、細部に違いがあることを示した（抄録）。", "p3": "2016〜2018年のHRSデータで、出生地別に探索的因子分析を行い、得られた因子と健康の関係を層別回帰で分析した（抄録）。", "p5": "近隣環境・対人ストレス・社会経済資源・家族支援の4因子が両群で見られた。移民では社会的孤立が家族支援により強く結びつき、差別の負荷は弱かった。社会経済資源と健康の関連は移民で弱かった（抄録）。", "fun": "健康に影響する社会的な条件をまとめると、住む地域、人間関係のストレス、お金、家族の4つになるそうです。この枠組みは移民でもほぼ同じでしたが、移民にとっての孤立は家族とのつながりの問題として現れていました。同じ物差しが集団によって少し違う意味を持つことを示す例です。", "unverified": "移民の標本規模は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "中高年の「第三の場所」訪問の交差分類マルチレベル分析", "title": "Third place visiting among mid-to-older adults: a cross-classified multilevel analysis", "url": "https://doi.org/10.1016/j.healthplace.2026.103740", "authors": "Martin Anderson ほか", "venue": "Health & Place", "date": "2026-10-07", "sjr": 1.328, "citescore": 7.4, "citescore_year": "2025", "apa": "Anderson, M., Bate, C., Letina, S., Ardestani, B., McCann, M., Milicev, J., Olsen, J. R., Tadrous, R., Mitchell, K. R., MacDonald, A., Palmer, V. J., Rigby, B. P., Simpson, S. A., Thomson, M., & Long, E. (2026). Third place visiting among mid-to-older adults: a cross-classified multilevel analysis. Health & Place, 102, 103740. https://doi.org/10.1016/j.healthplace.2026.103740", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中高年が家と職場以外の「第三の場所」を訪れるかを、人と場所の両方の特徴から説明した（抄録）。", "p3": "55〜75歳の140人が475回訪れた368か所について、すべての人-場所の組み合わせの道路距離を計算し、ベイズの交差分類マルチレベル・ロジスティック回帰で訪問の有無を分析した（抄録）。", "p5": "社会的ネットワークが大きく、一緒に運動する相手が多い人ほど第三の場所を訪れやすかった。精神的健康は距離と訪問の関係を、孤独は場所の種類と訪問の関係を調整した（抄録）。", "fun": "喫茶店や公園、図書館のような「第三の場所」は、人とのつながりを生む大切な場です。この研究は、人と場所の組み合わせをすべて調べ、誰がどこに行くのかを分析しました。孤独な人ほど行く場所の種類が偏るという結果は、居場所づくりの手がかりになります。", "unverified": "孤独による調整の方向の詳細は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "高度人材移民の排除体験は露骨な差別から微細な攻撃へ", "title": "Exclusion Experiences of Highly Qualified Migrants: From Overt Discrimination to Subtle Microaggressions", "url": "https://doi.org/10.1007/s10551-026-06485-4", "authors": "Markus Pudelko ほか", "venue": "Journal of Business Ethics", "date": "2026-10-08", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "apa": "Pudelko, M., Popescu, C., & Tenzer, H. (2026). Exclusion Experiences of Highly Qualified Migrants: From Overt Discrimination to Subtle Microaggressions. Journal of Business Ethics. https://doi.org/10.1007/s10551-026-06485-4", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "ドイツの高度人材移民130人へのインタビューで、露骨な差別はほとんど語られず、微細な攻撃（マイクロアグレッション）が排除の中心であることを示した（抄録）。", "p3": "130人への質的インタビューで、排除の経験、経験の違いの理由、反応の仕方を分析した（抄録）。", "p5": "マイクロアグレッションは所属感・権利感・包摂の感覚を損ない、その経験は文脈・世代・外国の背景の見えやすさ・文化的アイデンティティによって異なった（抄録）。", "fun": "「差別されたことはない」と答える移民でも、職場で包摂されているとは限りません。悪気のない「日本語上手ですね」のような一言の積み重ねが、ここにいていいという感覚を削っていきます。露骨な差別がないことと包摂されていることは違う、という大事な区別を示した研究です。", "unverified": "事例の具体的な分布は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "街路環境が熱ストレスを介して住宅価格に影響", "title": "How Heat Stress Mediates the Impacts of Street-level Environmental Features on Housing Prices: A Comparative Study of Center City and Outside Areas in Philadelphia", "url": "https://doi.org/10.1177/0739456x261485169", "authors": "Shengao Yi ほか", "venue": "Journal of Planning Education and Research", "date": "2026-10-08", "sjr": 1.054, "citescore": 7.3, "citescore_year": "2025", "apa": "Yi, S., Li, X., Guo, Z., Ma, C., Tu, W., & Zhao, T. (2026). How Heat Stress Mediates the Impacts of Street-level Environmental Features on Housing Prices: A Comparative Study of Center City and Outside Areas in Philadelphia. Journal of Planning Education and Research. https://doi.org/10.1177/0739456x261485169", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "フィラデルフィアで、1 m解像度の熱ストレス指数（UTCI）・緑視率・建物視率と住宅価格の関係が、中心部と周辺で異なることを示した（抄録）。", "p3": "構造方程式モデルを中心に、ランダムフォレストとSHAPを頑健性の確認に使い、街路の環境と熱ストレスと住宅価格の経路を分析した（抄録）。", "p5": "中心部では熱ストレスが高いほど住宅価格が低かったが、周辺部では社会経済要因が支配的で、熱ストレスと価格の弱い正の関連は開放感を反映している可能性があった（抄録）。", "fun": "街路樹の多い通りは涼しく、住みたい人も多いはずです。実際、都心では暑い通りほど家が安くなっていました。ところが郊外では逆に弱い正の関係が出て、これは日陰の少なさより見晴らしの良さを反映しているのかもしれません。同じ暑さでも場所によって意味が変わるという結果です。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr45", "rank": 45, "headline": "公共交通が商業に与える効果の体系的レビュー", "title": "How public transit impacts commercial outcomes: a systematic literature review", "url": "https://doi.org/10.1080/01441647.2026.2741248", "authors": "Marie-Pier Champagne ほか", "venue": "Transport Reviews", "date": "2026-10-08", "sjr": 2.79, "citescore": 21.7, "citescore_year": "2025", "apa": "Champagne, M.-P., Bardaka, E., & Dubé, J. (2026). How public transit impacts commercial outcomes: a systematic literature review. Transport Reviews, 1–34. https://doi.org/10.1080/01441647.2026.2741248", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、公共交通が商業（店舗の売上や立地、商業地価など）に与える効果を体系的にレビューした研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "駅ができると周りの商店はにぎわうのか、それとも客が都心に流れてしまうのか。題名から読み取れる問いは、世界中の研究を集めて、公共交通が商業に与える効果の向きと大きさを整理することです。", "unverified": "内容全体が未確認。"}}, {"id": "jr46", "rank": 46, "headline": "高速鉄道アクセスが中国の都市拡大に与える経路", "title": "Impact mechanisms of high-speed railway accessibility on urban expansion in China: An analysis based on the mediating effect model", "url": "https://doi.org/10.1371/journal.pone.0357896", "authors": "Dan He ほか", "venue": "PLoS ONE", "date": "2026-10-07", "citescore": 4.8, "citescore_year": "2025", "apa": "He, D., Chen, Z., Zhou, J., Hou, Y., Li, Q., & Qin, Z. (2026). Impact mechanisms of high-speed railway accessibility on urban expansion in China: An analysis based on the mediating effect model. PLOS One, 21(10), e0357896. https://doi.org/10.1371/journal.pone.0357896", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国278都市で、高速鉄道ネットワークの中心性が無秩序な市街地拡大を抑え、コンパクトな開発へ向かわせる「構造的ブレーキ」として働くことを示した（抄録）。", "p3": "2011・2014・2017年の全国高速鉄道網で都市のアクセス性を測り、2011〜2020年の市街地拡大の強度との関係を、不動産投資・雇用密度・産業構造を経路とする媒介・交互作用モデルで分析した（抄録）。", "p5": "ネットワーク中心性の高さは外延的な拡大を抑え、高い雇用密度がその効果を強めた。一方、運行頻度の増加は強い「隠蔽効果」を生んだ（抄録）。", "fun": "新幹線が通ると、街は郊外へ広がると思われがちです。ところが中国の都市では、高速鉄道網の要の位置にある都市ほど、外へのだらだらした拡大が抑えられ、中心に集まる方向に動いていました。交通の便が街の形を引き締める働きもあるという意外な結果です。", "unverified": "隠蔽効果の具体的な内容は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "科学者の市民対話を仕事の要求度-資源で捉える", "title": "A Job Demands-Resources Perspective on Science Communication: How Public Engagement Shapes Scientist Communicators’ Well-Being", "url": "https://doi.org/10.1177/10755470261489537", "authors": "Anthony Dudo ほか", "venue": "Science Communication", "date": "2026-10-08", "sjr": 1.255, "citescore": 7.9, "citescore_year": "2025", "apa": "Dudo, A., & Anderson, J. T. L. (2026). A Job Demands-Resources Perspective on Science Communication: How Public Engagement Shapes Scientist Communicators’ Well-Being. Science Communication. https://doi.org/10.1177/10755470261489537", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "科学者が市民と対話する仕事では、要求（時間的圧迫・嫌がらせ・評判リスク・支援の乏しい制度）が資源を大きく上回り、燃え尽きにつながっていることを示した（抄録）。", "p3": "仕事の要求度-資源（JD-R）モデルを枠組みに、科学コミュニケーションを担う科学者への半構造化インタビューを分析した（抄録）。", "p5": "要求が研修や制度的支援などの資源を大きく上回り、燃え尽きと離脱の兆候が見られ、現状は持続不可能と結論した（抄録）。", "fun": "研究者に「社会にわかりやすく発信を」と求める声は強まっていますが、その仕事の負担はあまり考えられてきませんでした。インタビューからは、SNSでの嫌がらせや評判への不安が重くのしかかり、支えが足りていない実態が見えます。発信を求めるなら支える仕組みも必要だという指摘です。", "unverified": "インタビューの人数は抄録に記載なく未確認。"}}, {"id": "jr48", "rank": 48, "headline": "職務要求の挑戦/脅威評価と教員のメンタルヘルス", "title": "Challenge and threat appraisal of job demands and their impact on mental health among vocational education teachers", "url": "https://doi.org/10.1186/s12889-026-29796-7", "authors": "Nina Marlene Sarochan ほか", "venue": "BMC Public Health", "date": "2026-10-08", "citescore": 5.9, "citescore_year": "2025", "apa": "Sarochan, N. M., & Aprea, C. (2026). Challenge and threat appraisal of job demands and their impact on mental health among vocational education teachers. BMC Public Health, 26(1). https://doi.org/10.1186/s12889-026-29796-7", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "職業学校の教員の職務要求が、挑戦と評価されるか脅威と評価されるかによって、well-being・満足・燃え尽き・ストレスとの関係が変わることを調べた（抄録）。", "p3": "ドイツ・バーデン=ヴュルテンベルク州の職業学校教員1,470人のオンライン調査で、6種類の職務要求の認知と評価、性格・レジリエンスを測り、構造方程式モデルで調整分析とパス解析を行った（抄録）。", "p5": "結果の詳細は抄録が途中で切れており確認できない（抄録）。", "fun": "同じ忙しさでも「やりがいのある挑戦」と受け取る人と「脅威」と受け取る人がいます。この研究は、受け取り方が心の健康への影響を変えるかを、1,470人の教員で調べました。仕事量を減らすだけでなく、受け止め方を支えるという対策の可能性につながる問いです。", "unverified": "主要な結果は未確認。"}}, {"id": "jr49", "rank": 49, "headline": "生成AIを組み込んだ創作労働で境界を引く実践", "title": "Drawing boundaries: How creative practitioners navigate precarity in AI-embedded creative work", "url": "https://doi.org/10.1177/13548565261494818", "authors": "Jie Huang ほか", "venue": "Convergence", "date": "2026-10-08", "sjr": 1.053, "citescore": 6.2, "citescore_year": "2025", "apa": "Huang, J., Hitchen, G., & Dogan, S. (2026). Drawing boundaries: How creative practitioners navigate precarity in AI-embedded creative work. Convergence: The International Journal of Research into New Media Technologies. https://doi.org/10.1177/13548565261494818", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "生成AIが入り込んだ創作の仕事で、実務家が人間とAIの境界を能動的に引き直し、作り手としての役割を守っていることを示した（抄録）。", "p3": "境界作業（boundary work）理論を用い、英国の映画・ゲーム・ライブ公演の実務家21人へのインタビューを分析した（抄録）。", "p5": "人間とAIの境界はあらかじめ決まっておらず、現場で形づくられ、広げられ、維持されていた。AIの導入は技術的な調整ではなく、職業的価値の再構成の過程だった（抄録）。", "fun": "AIが絵や脚本を作れるようになると、クリエイターは「ここは人間がやる」という線をどこに引くのでしょうか。インタビューからは、線は誰かに決められるのではなく、現場の一人ひとりが仕事を守るために引き直していることが見えてきます。", "unverified": "境界づくりの具体的な型は未確認。"}}, {"id": "jr50", "rank": 50, "headline": "建設業の人間-AI相互作用の階層の体系的レビュー", "title": "From Automation to Coevolution: A Systematic Review of Human–AI Interaction Hierarchies and Professional Implications in the Construction Industry", "url": "https://doi.org/10.1061/jmenea.meeng-7659", "authors": "Maruoyan Shi ほか", "venue": "Journal of Management in Engineering", "date": "2026-10-08", "sjr": 1.486, "citescore": 13.1, "citescore_year": "2025", "apa": "Shi, M., Liang, M., & Hwang, B.-G. (2027). From Automation to Coevolution: A Systematic Review of Human–AI Interaction Hierarchies and Professional Implications in the Construction Industry. Journal of Management in Engineering, 43(1). https://doi.org/10.1061/jmenea.meeng-7659", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "建設業の人間-AI相互作用を、自動化・支援・協調・適応的共進化の4層に整理し、各層に必要な職業能力を示した体系的レビュー（抄録）。", "p3": "PRISMAに沿って2016〜2025年の査読論文57本を体系的にレビューし、書誌マッピングと主題的統合を行った（抄録）。", "p5": "第1〜3層は建設の実務の実証分析から、第4層（適応的共進化）は萌芽的な段階として提案された（抄録）。", "fun": "建設現場のAIは、人の代わりに作業する段階から、人と相談しながら進める段階へ移りつつあります。このレビューは、AIとの関わりの深さを4段階に分け、段階ごとに技術者に求められる力が変わることを整理しました。現場の仕事の将来像を描く地図のような研究です。", "unverified": "各層に対応する能力の詳細は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "ESG投資の超過収益は資金流入の価格圧力だった", "title": "Flow‐Driven ESG Returns", "url": "https://doi.org/10.1111/jofi.70083", "authors": "PHILIPPE VAN DER BECK", "venue": "The Journal of Finance", "date": "2026-10-08", "sjr": 22.27, "citescore": 16.8, "citescore_year": "2025", "apa": "BECK, P. V. D. (2026). Flow‐Driven ESG Returns. The Journal of Finance. https://doi.org/10.1111/jofi.70083", "why": "資金流入1ドルがESG株の時価を約0.8ドル押し上げると推定し、流入がなければ2012〜2023年の超過収益はなかったと示した、ESG投資の評価を変えうる実証。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "近年のESG投資の超過収益は、ESGポートフォリオへの資金流入の価格圧力で強く駆動されていたことを示し、流入がなければ2012〜2023年にESG株は市場を上回らなかったと推定した（抄録）。", "p2": "ESG投資の高い収益は、ESGの性質そのもの（リスクの低さや将来性）を反映するのか、資金流入の一時的な価格圧力なのかが争点だった（抄録）。", "p3": "売買データを使い、市場がESG向けの資金流入をどれだけ吸収できるかを、ESG株と他の株の代替の弾力性として推定した。この弾力性から、流入1ドルがESG株の時価に与える影響と、流入による収益を計算した（抄録）。", "p4": "評価は、流入1ドルあたりのESG株の時価の上昇と、流入による年率の収益、流入がなかった場合の反実仮想の収益である（抄録）。", "p5": "代表的なESGポートフォリオへの流入1ドルはESG株の時価を0.8ドル押し上げた。増え続ける機関投資家の流入がESG収益の主な原動力で、年率1.9%の流入による収益を生んだ。流入がなければ、2012〜2023年にESG株は市場を上回らなかった（抄録）。", "p6": "抄録の範囲では、代替の弾力性の識別に使った変動の源泉は確認できない。解釈：流入による収益は流入が続く限りの一時的なもので、流入が止まるか逆流すれば将来の収益は低くなるという含意が導かれるが、その予測の検証は本文で確かめる必要がある。", "fun": "ESG（環境・社会・企業統治）に配慮した会社の株がよく上がったのは、そうした会社が優れているからだと考えたくなります。しかしこの研究によると、主な理由は「ESGに投資しよう」というお金がどんどん流れ込んで値段を押し上げたことでした。人気が値段を作っていたなら、人気が冷めれば逆回転するかもしれないという警告でもあります。", "unverified": "弾力性の推定値と識別の方法は抄録になく未確認。"}}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "関与最大化の並べ方とニュースの信頼性", "title": "Personalization, Engagement, and Content Quality on Social Media: An Evaluation of Reddit’s News Feed", "url": "https://doi.org/10.1287/mnsc.2024.06298", "authors": "Alex Moehring", "venue": "Management Science", "date": "2026-10-07", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Moehring, A. (2026). Personalization, Engagement, and Content Quality on Social Media: An Evaluation of Reddit’s News Feed. Management Science. https://doi.org/10.1287/mnsc.2024.06298", "why": "順位アルゴリズムの不連続性を使って順位の因果効果を識別し、エンゲージメント最大化と情報の信頼性のトレードオフを設計問題として推定した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "Redditの政治コミュニティで、ランキングアルゴリズムの不連続性を使って投稿の順位がコメント数に与える因果効果を識別し、エンゲージメント最大化の個人化フィードが利用者の関与するニュースの信頼性の差を広げること、信頼性を考慮したアルゴリズムなら関与の総量を少し減らすだけで高信頼の媒体への関与を大きく増やせることを示した（抄録）。", "p2": "プラットフォームには広告収入のため利用者ごとの予測エンゲージメントを高める内容を推す誘因があるが、それが利用者の関与するニュースの質にどう影響するかは分かっていなかった（抄録）。", "p3": "ランキングアルゴリズムに新たに見つけた不連続性を使って、投稿の順位がコメント数に与える因果効果を識別し、それを使って利用者のコメント決定のモデルを推定した。推定したモデルで、個人化・エンゲージメント最大化のアルゴリズムの下での関与するニュースの信頼性を計算した（抄録）。", "p4": "評価は、利用者が関与するニュース媒体の信頼性の分布と、信頼性を考慮したアルゴリズムでの高信頼媒体への関与の割合と総エンゲージメントのトレードオフである（抄録）。", "p5": "個人化されたエンゲージメント最大化アルゴリズムは、利用者が関与するニュースの信頼性の差を拡大した。信頼できる媒体を明示的に推すアルゴリズムでは、総エンゲージメントの小さな減少と引き換えに、高信頼媒体への関与の割合を大きく増やせた（抄録）。数値は抄録に記載がない。", "p6": "抄録の範囲では、媒体の信頼性の測り方（外部の評価機関か）と、コメント以外の関与（閲覧、投票）への一般化は確認できない。解釈：政治コミュニティ1つでの推定であり、他の話題や他のプラットフォームでの効果は未確認である。", "fun": "SNSのおすすめ欄は、あなたが反応しそうな投稿を上に並べます。この研究は、それが信頼性の低いニュースへの反応を増やしてしまう一方、「信頼できる媒体を少し優遇する」並べ方に変えれば、反応の量はほとんど減らさずに質を上げられることを示しました。アルゴリズムの小さな工夫で情報環境が変わりうるという希望のある結果です。", "unverified": "トレードオフの具体的な数値は抄録になく未確認。"}}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "再選の危うい議員ほどリスクの高い党首候補に投票", "title": "Gambling for Re-election", "url": "https://doi.org/10.1093/ej/ueag127", "authors": "Alastair Langtry ほか", "venue": "Economic Journal", "date": "2026-10-07", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "apa": "Langtry, A., Potrafke, N., Schlepper, M., & Wochner, T. (2026). Gambling for Re-election. The Economic Journal. https://doi.org/10.1093/ej/ueag127", "why": "流出した議員個人の投票データで「再選のための賭け」を実証し、党が質の低いリーダーを選ぶ理由を合理的リスク選択で説明した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ドイツの中道右派の2021年の党首選びで、再選の見込みが低い議員ほどリスクの高い候補に投票したことを、流出した議員個人の投票データで示し、政治家が「再選のための賭け」をすることを明らかにした（抄録）。", "p2": "党内の造反や、政党が質の低いリーダーを選ぶことがあるのはなぜかは、政治経済学の問いとして残っていた（抄録）。", "p3": "合理的なリスク選択のモデルから予測を導き、2021年のドイツ中道右派政党の党首選考での議員個人の決定についての流出情報を使って検証した（抄録）。", "p4": "評価は、議員の再選見込みと、よりリスクの高い候補への投票の関係がモデルの予測と一致するかである（抄録）。", "p5": "再選の見込みが低い議員ほどリスクの高い候補に投票しやすく、これはモデルの予測と一致した。議員はリーダーの期待される質とリスクをトレードオフしていた（抄録）。数値は抄録に記載がない。", "p6": "抄録の範囲では、流出データの網羅性と信頼性、他国・他の選挙への一般化は確認できない。解釈：リスクの高い候補の定義（人気のばらつき、経験の少なさなど）によって結果の意味が変わるため、本文で確かめる必要がある。", "fun": "このままでは落選しそうな議員は、手堅い候補より「当たれば大きいが外れも大きい」候補に党の顔を託したがる。負けている側ほど一発逆転を狙うのは、試合終盤のスポーツと同じ理屈です。この研究は、流出した投票記録というめったにないデータで、それを確かめました。党が質の低いリーダーを選ぶことがある理由の一つになります。", "unverified": "効果の大きさと、リスクの高い候補の具体的な定義は抄録になく未確認。"}}, {"id": "jn04", "rank": 4, "field": "統計学", "headline": "買い置き行動の動的離散選択モデルは割引因子を集合識別できる", "title": "The Identification of the Dynamic Discrete-Choice Model with Stockpiling", "url": "https://doi.org/10.1287/mksc.2024.1280", "authors": "Xinyao Kong ほか", "venue": "Marketing Science", "date": "2026-10-08", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Kong, X., Dubé, J.-P., & Alwan, V. (2026). The Identification of the Dynamic Discrete-Choice Model with Stockpiling. Marketing Science. https://doi.org/10.1287/mksc.2024.1280", "why": "補助仮定なしで割引因子を集合識別できることを示し、従来の仮定を検定可能な形で位置づけた、需要推定の識別論の整理。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "買い置きできる財の需要の動的離散選択（DDC）モデルには、補助仮定なしで割引因子を集合識別する除外制約が組み込まれていることを示し、洗剤の事例で割引因子0.957を推定して近視眼的なモデルを棄却した（抄録）。", "p2": "買い置き行動のDDCモデルでは、将来をどれだけ重視するか（割引因子）の識別が難しく、従来研究は保管費用関数に補助的な構造を仮定して識別していた（抄録）。", "p3": "DDCモデル自体が持つ除外制約が割引因子を集合識別することを示し、保管費用への補助仮定がどのように除外制約と識別に使うデータのモーメントを生んでいたかを明らかにした。補助仮定は識別に必要ないが、検定可能で、加えれば点識別と統計的効率の向上が得られる（抄録）。", "p4": "既発表の研究で使われた洗濯洗剤のデータで割引因子を推定し、値引き期間の販売増のうち先買い（forward-buying）の割合と、標準的な離散選択モデルとの予測の違いを反実仮想シミュレーションで比べた（抄録）。", "p5": "割引因子の平均推定値は0.957で、近視眼的な選択モデルを棄却して動学モデルを支持した。値引き期間の販売増の一部は実際に先買いによるものだったが、ブランド間の乗り換えが主だと予測する標準的な離散選択モデルより、かなり大きな純増の販売を予測した（抄録）。", "p6": "抄録の範囲では、集合識別の区間の幅と、他の商品カテゴリでの結果は確認できない。解釈：在庫の観測が難しい現実のデータで、補助仮定の検定がどの程度の検出力を持つかは本文で確かめる必要がある。", "fun": "洗剤が安売りされると、多くの人はまとめ買いをします。その売上増が「将来の分の前倒し」なのか「他のブランドからの乗り換え」なのかで、安売りの価値は大きく変わります。この研究は、消費者がどれだけ先のことを考えて買うかを、余計な仮定なしに推定できることを示しました。数学的な識別の話が、値引きの効き目という身近な問題につながっています。", "unverified": "集合識別の区間の幅と販売増の内訳の数値は抄録になく未確認。"}}, {"id": "jn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "組織のDEIをめぐる40の問いに最新研究で答える", "title": "Personnel Psychology's 40 Questions Series: Diversity, Equity, and Inclusion in Organizations", "url": "https://doi.org/10.1111/peps.70044", "authors": "Derek R. Avery ほか", "venue": "Personnel Psychology", "date": "2026-10-08", "sjr": 5.41, "citescore": 14.8, "citescore_year": "2025", "apa": "Avery, D. R., Owens, T. L., & Garcia, L. R. (2026). Personnel Psychology’s 40 Questions Series: Diversity, Equity, and Inclusion in Organizations. Personnel Psychology. https://doi.org/10.1111/peps.70044", "why": "DEIの効果・抵抗・測定・後退をめぐる誤解に、産業組織心理学の最新の知見で体系的に答えた、分野の論点整理として重要な論文。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "組織の多様性・公平性・包摂（DEI）をめぐる神話や誤解に答えるため、40の問いを集めて主題別に整理し、産業組織心理学と経営学の最新の文献で答えたレビュー（抄録）。", "p2": "DEIは産業・組織心理学と経営の研究・実務で役割をめぐる神話や誤解が多く、近年は後退（pullback）の動きもあり、最新の知見に基づく整理が求められていた（抄録）。", "p3": "著者らの専門家ネットワークから問いをクラウドソーシングで集め、DEIの基礎、ビジネスケース、DEIの効果、DEIへの抵抗、法的解釈、DEIの後退、測定、プログラムと手段の主題に整理し、最新の文献で答えた（抄録）。", "p4": "実証研究ではなくレビューであり、評価は回答の根拠となる文献の質による（抄録）。", "p5": "抄録の範囲では、個々の問いへの答えは確認できない。著者は、網羅的ではないが最も差し迫った問いの多くに最新の文献で答えることを目的としたと述べている（抄録）。", "p6": "著者は、レビューが完全に網羅的ではないことを認めている（抄録）。解釈：問いの集め方が著者らのネットワークに依存しているため、取り上げられた論点に偏りがありうる。米国の法制度に関わる回答は他国にそのまま当てはまらない可能性がある。", "fun": "「多様性を高めると業績が上がる」「研修で偏見は減る」など、DEIについてはさまざまな主張が飛び交っています。この論文は、研究者仲間から集めた40の素朴な疑問に、研究の証拠で一つずつ答える形をとりました。賛否が分かれやすい話題だからこそ、何が分かっていて何が分かっていないかを整理する価値があります。", "unverified": "40の問いの具体的な内容と各回答の結論は抄録になく未確認。"}}, {"id": "jn06", "rank": 6, "field": "機械学習", "headline": "AI気象モデルはドバイ豪雨を他地域の類似事例から学んで予測", "title": "Predicting regional gray swans via translocation: AI weather models and Dubai’s unprecedented 2024 rainfall", "url": "https://doi.org/10.1126/sciadv.ady9406", "authors": "Y. Sun ほか", "venue": "Science Advances", "date": "2026-10-07", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Sun, Y., Hassanzadeh, P., Shaw, T., Pahlavan, H. A., & Marchakitus, A. (2026). Predicting regional gray swans via translocation: AI weather models and Dubai’s unprecedented 2024 rainfall. Science Advances, 12(41). https://doi.org/10.1126/sciadv.ady9406", "why": "前例のない極端現象を予測できた理由を「転置（translocation）」として分析し、外挿はできないというAI予報の限界を示した。", "explain": {"basis": "本文", "basis_note": "Europe PMCの全文XML（結果、考察、方法の節）を読んだ。補足資料の図は読んでいない", "preprint": false, "p1": "AI気象モデル（GraphCast、AIFS）が、学習データの地域最大値の約2倍という前例のない2024年ドバイ豪雨を予報できたのは、他地域の力学的に似た強い事象から学ぶ「転置（translocation）」によるもので、地域の弱い事象からの「外挿」ではないことを、微調整実験と受容野解析で示した（抄録、結果）。", "p2": "AI気象モデルは予報を一変させたが、学習データにない極端現象（グレースワン）を予報できるかは不明だった。成功するなら、地域の弱い事象から外挿するのか、他地域の似た事象から学ぶのかも分かっていなかった（序論）。", "p3": "ERA5を真値とし、ドバイ周辺100 km四方平均の12時間降水量で事象を評価した。ラグランジュ追跡で、学習データ中のドバイの事象（温帯低気圧型）と力学的に似た事象を北半球で探した。GraphCastを、ドバイ以外の地域の降水を地域の歴史的最大値で頭打ちにしたデータで微調整し、予報が劣化するかを見る因果的な実験を行った。有効受容野（ERF）で遠方の情報を使う構造的な能力も調べた（結果、方法）。", "p4": "GraphCast、AIFS、FuXiの5〜8日前の予報をERA5の降水のピーク・総量・時期と比べた（図1）。微調整の前後で、ドバイの予報と2024年の72の試験事例での全体的な精度を比べた（図5）。全球の極端降水の分布の裾の再現を、ヒストグラムで評価した（図7）。", "p5": "ERA5のピークは12時間60 mmで学習データの地域最大値33 mmの約2倍、再現期間は約150年だった。5日前予報でGraphCastとAIFSはピーク50 mm超を予測し、総量の過小は約10%と15%だった（図1）。FuXiは33 mmを下回った。他地域の降水を頭打ちにして微調整すると、GraphCastの予報は30 mm強に落ちたが大気循環の予報は保たれ、全体精度もほぼ変わらなかった（図5）。一方、GraphCastとFuXiは全球の極端降水の分布の裾を過小評価し、スペクトルの偏り（高周波を平滑化する傾向）が限界要因と示唆された（図7）。", "p6": "著者は、ERA5の降水には解像度などの欠点があること、転置を明確に示すには学習データを変えて一から再学習する必要があるが計算的に困難で微調整で代替したこと、AIFSでは微調整実験ができなかったことを認めている（結果）。転置が効かない「全球のグレースワン」（世界中に前例がない事象）は予報できない可能性が残る（考察）。", "fun": "砂漠の都市ドバイに、過去の記録の2倍の大雨が降りました。AIの天気予報はこれを1週間前から当てましたが、その理由は「ドバイで見たことがないなら、よその土地で見た似た嵐から学ぶ」ことでした。よその強い雨の記録を消して学び直させると当たらなくなったのが証拠です。つまり世界のどこにも前例のない災害は、AIでも予報が難しいかもしれません。", "unverified": "有効受容野の空間的な広がりの定量値と、AIFSの8日前予報のピーク値は読んでいない。"}}, {"id": "jn07", "rank": 7, "field": "情報システム", "headline": "競合でもある影響者に機能を開放するとプラットフォームが得をする", "title": "Helping Oneself by Helping a Rival: Social-Media Platforms’ Policies on Enabling Features for Influencers", "url": "https://doi.org/10.1287/isre.2024.1591", "authors": "Yan Zhu ほか", "venue": "Information Systems Research", "date": "2026-10-08", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "apa": "Zhu, Y., Chen, J., & Raghunathan, S. (2026). Helping Oneself by Helping a Rival: Social-Media Platforms’ Policies on Enabling Features for Influencers. Information Systems Research. https://doi.org/10.1287/isre.2024.1591", "why": "広告で競合するプラットフォームと影響者の関係をゲーム理論で分析し、無料でも機能を開放する合理性を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ソーシャルメディアのプラットフォームが、広告サービスで競合する影響者（インフルエンサー）に、サービスの効果を高める機能（買い物リンクなど）を開放すべきかを、ゲーム理論モデルで分析し、無料でも開放が得になる条件と、有料なら常に開放すべきことを示した（抄録）。", "p2": "プラットフォームと影響者は協力者と見られがちだが、どちらも主に広告で稼ぐため競合関係にもある。実際に、機能を無効にする敵対的な方針と、無料や有料で使わせる協調的な方針のプラットフォームがある（抄録）。", "p3": "広告主をめぐって競合するプラットフォームと影響者のゲーム理論モデルを作り、影響者のサービスの効果を高める機能を有効にするか無効にするかのプラットフォームの決定と、機能利用料を取れる場合を分析した（抄録）。", "p4": "理論分析であり、評価はプラットフォームの利益、市場シェア、広告収入、影響者と広告主の厚生の比較である（抄録）。", "p5": "利用料を取れない場合でも、広告主によるプラットフォームのサービスの評価が影響者のサービスより大きく低くなければ、機能を開放するとプラットフォームは得をする。市場シェアは失っても価格を上げて埋め合わせられる。プラットフォームと影響者の双方が得をする結果は一部の広告主の犠牲の上に成り立ち、競争下でも「共謀的」な結果になりうる。利用料を取れるなら適切な料金で常に開放すべきで、料金で影響者のサービスを誘導して収入構成を変えられる（抄録）。", "p6": "抄録の範囲では、理論モデルの結果であり、実データでの検証はない。解釈：影響者が複数で互いに競争する場合や、利用者のプラットフォーム離れを考慮した場合に結論が変わるかは本文で確かめる必要がある。", "fun": "SNSの運営会社にとって、人気の発信者は利用者を集めてくれる仲間である一方、広告主を取り合うライバルでもあります。この研究は、ライバルに便利な機能を使わせると一見損に思えても、運営会社が広告の値段を上げられるため、結果的に得をすることがあると示しました。その「仲良し」のツケを払うのは広告主、というのが皮肉なところです。", "unverified": "条件の具体的な形（パラメータの範囲）は抄録になく未確認。"}}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "金融機関の社債には格付けが同じでも43bpの上乗せ金利", "title": "The Financial Premium", "url": "https://doi.org/10.1111/jofi.70084", "authors": "JENS DICK‐NIELSEN ほか", "venue": "The Journal of Finance", "date": "2026-10-08", "sjr": 22.27, "citescore": 16.8, "citescore_year": "2025", "apa": "DICK‐NIELSEN, J., FELDHÜTTER, P., & LANDO, D. (2026). The Financial Premium. The Journal of Finance. https://doi.org/10.1111/jofi.70084", "why": "同じ格付け・満期でも金融機関債の利回りが高い「金融プレミアム」を示し、銀行が分散化された債権を持つことによる系統的リスクで説明した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "同じ格付け・満期でも金融機関が発行する社債は事業会社の社債より利回りが高い「金融プレミアム」があることを示し、銀行が分散化された非金融債務を持つため銀行の債務がより多くの系統的リスクを反映するというモデルで説明した（抄録）。", "p2": "信用格付けは同じでも債券の利回りに差が生じる理由として、金融機関の債務に特有のリスクがあるかは十分に説明されていなかった（抄録）。", "p3": "米国の1987〜2020年の社債データで、同じ格付けと満期の金融機関債と事業会社債の利回り差を測り、その差が格付け、金融危機、債券のベータとどう関係するかを調べた。銀行が非金融債務の分散ポートフォリオを持つモデルを導出した（抄録）。", "p4": "評価は、金融プレミアムの平均の大きさと、格付けの低さ・金融危機・債券のベータとの関係が、モデルの予測（系統的リスクの差）と整合するかである（抄録）。", "p5": "金融プレミアムは平均43ベーシスポイントで、格付けが低いほど、金融危機の間ほど、債券のベータが大きいほど高かった。モデルでは、銀行が非金融債務の分散ポートフォリオを持つため、銀行の債務は非金融債務より多くの系統的リスクを反映する（抄録）。", "p6": "抄録の範囲では、流動性の差や政府による救済の期待（暗黙の保証）など他の説明との区別の方法は確認できない。解釈：格付け機関が金融機関の系統的リスクを格付けに十分に反映していないことを示唆するが、その含意は本文で確かめる必要がある。", "fun": "同じ「A格」の社債でも、銀行が出したものは一般の会社のものより0.43%ほど高い利回りを求められていました。銀行はたくさんの会社にお金を貸しているので、個々の会社の失敗は打ち消し合っても、景気全体の悪化には丸ごとさらされます。分散するほど、残るのは逃げられない景気のリスクだけ、というポートフォリオ理論の皮肉な一面です。", "unverified": "モデルの定量的な再現度は抄録になく未確認。"}}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "保守的なCEOほど垂直統合を進める", "title": "Transaction Hazards Through Ideological Filters: How CEO Political Ideology Influences Vertical Integration Decisions", "url": "https://doi.org/10.1177/01492063261487117", "authors": "Holly Loncarich ほか", "venue": "Journal of Management", "date": "2026-10-08", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Loncarich, H., Abdurakhmonov, M., & Schnacker, M. L. (2026). Transaction Hazards Through Ideological Filters: How CEO Political Ideology Influences Vertical Integration Decisions. Journal of Management. https://doi.org/10.1177/01492063261487117", "why": "CEO交代を使った固定効果設計で政治的イデオロギーと企業境界の関係を示し、取引費用理論を経営者の認知で補った。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米上場企業1,198社（2001〜2020年）でCEO交代を利用した固定効果設計により、保守的なCEOが率いる企業ほど垂直統合の度合いが高いことを示し、企業の境界が取引条件だけでなく経営者の意思決定の系統的な違いを反映することを明らかにした（抄録）。", "p2": "取引費用理論は取引上の危険（資産特殊性など）から統治形態を予測するが、似た取引環境の企業の垂直統合のばらつきは持続しており、効率性に基づく説明だけでは不十分である（抄録）。", "p3": "政治的イデオロギーと戦略的リーダーシップの研究に基づき、イデオロギーが経営者の統治のトレードオフの評価と優先順位を形づくると論じた。企業の固定効果とCEO交代を利用し、同じ企業内でのCEOの政治的イデオロギーの変化と垂直統合の変化を関連づけた（抄録）。", "p4": "評価は、CEOの保守性と垂直統合の水準の関係と、その関係が資産特殊性・産業の集中度・需要の変動性によってどう変わるかである（抄録）。イデオロギーと垂直統合の測定法は抄録に記載がない。", "p5": "保守的なCEOが率いる企業ほど垂直統合の水準が高かった。この関係は資産特殊性が高い場合と産業の集中度が高い場合に弱まったが、需要の変動性によっては強まらなかった（抄録）。効果の大きさは抄録に記載がない。", "p6": "抄録の範囲では、CEO交代そのものが企業の戦略転換と同時に起きる（取締役会が戦略に合うCEOを選ぶ）ことによる内生性への対処は確認できない。解釈：取引上の危険が大きい状況ほどイデオロギーの影響が弱まるという結果は、効率性の圧力が強いときは個人差の余地が小さいことを示唆する。", "fun": "部品を自社で作るか外から買うかは、本来はコストと取引のリスクで決まるはずです。ところが同じような状況の会社でも判断が分かれ、その一因はトップの政治的な考え方にあるようです。保守的な社長ほど自前主義に傾くという結果は、経営の合理的な判断にも価値観がにじみ出ることを示しています。", "unverified": "イデオロギーの測定法（政治献金など）と効果の大きさは抄録になく未確認。"}}, {"id": "jn10", "rank": 10, "field": "経営学", "headline": "企業サイトの文章から上場・非上場の競合ネットワークを作る", "title": "Using Representation Learning and Website Text to Identify Competitor Networks", "url": "https://doi.org/10.1287/mnsc.2024.06516", "authors": "Gerard Hoberg ほか", "venue": "Management Science", "date": "2026-10-07", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Hoberg, G., Knoblock, C., Phillips, G., Pujara, J., Qiu, Z., & Raschid, L. (2026). Using Representation Learning and Website Text to Identify Competitor Networks. Management Science. https://doi.org/10.1287/mnsc.2024.06516", "why": "表現学習で企業を同じ空間に置き、非上場企業を含む競合関係を大規模に推定する新しい産業分類を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "企業のウェブサイトの文章を表現学習で埋め込み、上場・非上場の企業を同じ空間に置いて競合ネットワークを作る新しい産業分類（WTNIC）を提案し、ノイズの多いウェブデータでも整備されたデータに基づく従来法と同等以上の性能を示した（抄録）。", "p2": "競合関係の把握には、上場企業の開示（10-Kなど）に基づく分類が使われてきたが、非上場企業を同じ枠組みで扱えなかった（抄録）。", "p3": "業界特有の製品・サービスの情報を重視して、企業のウェブサイトの内容から表現学習で埋め込みを作り、上場・非上場のすべての企業を同じ埋め込み空間に置いて、近い企業どうしを競合とするネットワークを構築した（抄録）。", "p4": "複数の正解データとベンチマークでネットワークの質を評価した。事例研究として、中国からの競争が焦点企業の上場・非上場の競合にどう影響するかを分析した（抄録）。", "p5": "ノイズの多いウェブサイトのデータを使ったにもかかわらず、WTNICは整備されたデータに基づく従来の手法と同等かそれ以上の性能を示した。事例研究は、上場・非上場の企業を同じ埋め込み空間に置くことの重要性を示した（抄録）。数値は抄録に記載がない。", "p6": "抄録の範囲では、ウェブサイトの更新時期のずれや、多角化企業の扱いは確認できない。解釈：言語やウェブサイトの充実度が国・企業規模で異なるため、米国以外への適用には検証が必要である。", "fun": "「この会社のライバルはどこか」を決めるのは意外に難しく、従来は上場企業の書類に頼っていました。この研究は、どの会社も持っているウェブサイトの文章をAIで数値の地図に変え、近くにいる会社をライバルとみなしました。中小の非上場企業まで同じ地図に載せられるので、業界の競争の姿がより全体的に見えるようになります。", "unverified": "ベンチマークとの性能比較の数値は抄録になく未確認。"}}, {"id": "jn11", "rank": 11, "field": "経営学", "headline": "有料ライブ配信の需要は開催前のほうが価格に敏感", "title": "From Live to Recording: Consumer Demand and Response to Price Across the Livestreaming Lifecycle", "url": "https://doi.org/10.1287/mksc.2024.1281", "authors": "Ziwei Cong ほか", "venue": "Marketing Science", "date": "2026-10-07", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Cong, Z., Liu, J., & Manchanda, P. (2026). From Live to Recording: Consumer Demand and Response to Price Across the Livestreaming Lifecycle. Marketing Science. https://doi.org/10.1287/mksc.2024.1281", "why": "録画版も売る知識共有プラットフォームのデータで、品質の不確実性と自己選択がライブと録画の価格感応度の差を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "p1": "有料ライブ配信の録画版も販売するプラットフォームのデータで、需要は配信前のほうが配信後より価格に敏感であることを示し、その理由を消費者の自己選択と品質の不確実性で説明した（抄録）。", "p2": "配信者とプラットフォームは配信前の販売促進に力を入れるが、配信後に録画版として売る「残りの」収益機会は体系的に調べられていなかった（抄録）。", "p3": "大手ライブ配信プラットフォームの、有料ライブを配信後に録画版として購入できるデータを使い、配信前・配信後の需要の価格感応度を推定し、その差の要因を分析した（抄録）。", "p4": "評価は、配信の前後での需要の価格弾力性の違いと、その違いが消費者の自己選択（ライブを見逃しがちな人の支払意思額）と品質の不確実性で説明されるかである（抄録）。", "p5": "需要は配信前のほうが配信後より価格に敏感だった。その一因は、ライブを見逃しがちな利用頻度の低い消費者が録画版に高い支払意思額を持つという自己選択と、配信前のほうが内容の品質の不確実性が高いことだった（抄録）。数値は抄録に記載がない。", "p6": "抄録の範囲では、価格の内生性（人気の配信ほど高く設定される）への対処の方法は確認できない。解釈：知識共有型の配信に限られたデータで、娯楽型のライブ配信に一般化できるかは未確認である。", "fun": "ライブ配信は「その時その場」が売りなので、終わった後の録画は安くしか売れないと思いがちです。ところが実際は、配信前のほうが客は値段に敏感でした。中身が分からない段階では高いと買い控え、終わった後は評判が分かるうえに、見逃して残念がる人が録画を欲しがるからです。売り時と値付けの常識を見直させる結果です。", "unverified": "価格弾力性の推定値は抄録になく未確認。"}}, {"id": "jn12", "rank": 12, "field": "経済学", "headline": "公務員の母親は収入の子育てペナルティは小さいが労働時間では大きい", "title": "Is Public Sector a Better Place for Moms to Work? Exploring Sector Difference in Child Penalties on Women", "url": "https://doi.org/10.1111/puar.70225", "authors": "Fangda Ding ほか", "venue": "Public Administration Review", "date": "2026-10-08", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "apa": "Ding, F., & Chen, Y. (2026). Is Public Sector a Better Place for Moms to Work? Exploring Sector Difference in Child Penalties on Women. Public Administration Review. https://doi.org/10.1111/puar.70225", "why": "中国の家計パネルのイベントスタディで、公的部門の安定性が性別規範を通じて別の形の不平等を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "中国の家計パネル（CFPS、2010〜2022年）のイベントスタディで、公的部門で働く女性は出産による失業と所得のペナルティが民間より小さい一方、労働時間のペナルティはより大きいことを示した（抄録）。", "p2": "公的部門は雇用が安定し柔軟なため母親にとって働きやすい職場だと考えられているが、出産が男女格差に与える影響（子育てペナルティ）が部門によってどう異なるかは理論的にも実証的にも十分に検討されていなかった（抄録）。", "p3": "部門の違いから子育てペナルティを理論化し、雇用の安定と家族への配慮が、公的部門で女性の仕事を軽く見る性別規範を生むため、失業・所得の格差は小さく労働時間の格差は大きくなると予測した。中国家庭追跡調査（CFPS）2010〜2022年のデータで、出産前後の変化をイベントスタディで推定した（抄録）。", "p4": "評価は、出産前後の男女の失業・所得・労働時間の差の変化を、公的部門と民間部門で比べることである（抄録）。", "p5": "公的部門の女性は民間に比べ、失業と所得の子育てペナルティが小さく、労働時間のペナルティが大きかった。これは出産後の家族責任の増加と、配偶者が女性の仕事を軽く見ることで説明された（抄録）。数値は抄録に記載がない。", "p6": "抄録の範囲では、公的部門を選ぶ女性の自己選択（もともと家庭を重視する人が公的部門を選ぶ）への対処は確認できない。解釈：中国の公的部門の制度に固有の結果である可能性があり、他国への一般化には注意が要る。", "fun": "公務員は職を失いにくく給料も安定しているので、子育て中の女性には働きやすいと思われています。確かに出産後も失業や収入の落ち込みは小さかったのですが、働く時間は民間より大きく減っていました。「安定した職場だから家庭を優先してよい」という空気が、かえって女性のキャリアを細らせている可能性を示す、常識を問い直す研究です。", "unverified": "効果の大きさとイベントスタディの標本規模は抄録になく未確認。"}}, {"id": "jn13", "rank": 13, "field": "教育", "headline": "音声LLMチャットボットは第二言語学習に中程度以上の効果", "title": "Effects of speech-enabled LLM-based chatbots on L2 learning outcomes and affective domains: a multilevel meta-analysis", "url": "https://doi.org/10.1515/iral-2026-0172", "authors": "Eunjin Lee ほか", "venue": "IRAL - International Review of Applied Linguistics in Language Teaching", "date": "2026-10-08", "sjr": 1.068, "citescore": 5.4, "citescore_year": "2025", "apa": "Lee, E., Lee, H., & Lee, J. H. (2026). Effects of speech-enabled LLM-based chatbots on L2 learning outcomes and affective domains: a multilevel meta-analysis. International Review of Applied Linguistics in Language Teaching. https://doi.org/10.1515/iral-2026-0172", "why": "19研究・2,643人のマルチレベル・メタ分析で、音声対話型LLMの学習効果と情意面の効果を定量化した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "音声対話型・LLM型のチャットボットが第二言語（L2）学習の成果と情意面に与える効果を、19研究（32標本、2,643人）のマルチレベル・メタ分析で統合し、学習成果0.68、情意面0.64の効果量を示した（抄録）。", "p2": "自然言語処理と自動音声認識の進歩で音声のチャットボットがL2の話す練習に使えるようになり、さらにLLMで文脈理解と意味のある対話が可能になったが、その効果の研究結果は統合されていなかった（抄録）。", "p3": "音声・LLMベースのチャットボットのL2学習への効果を調べた研究を集め、同じ研究からの複数の効果量の依存を考慮するマルチレベル・メタ分析を行い、学習者と介入の特徴による調整分析を加えた（抄録）。", "p4": "評価は、L2学習成果と情意面（不安、動機づけなど）の全体の効果量と、学習者の熟達度・教育段階・対話の形式・使用の文脈による違いである（抄録）。", "p5": "L2学習成果の全体の効果量は0.68（p<0.001）、情意面は0.64（p<0.001）だった。学習者の熟達度、教育段階、対話の形式、チャットボット使用の文脈が効果の大きさに有意に影響した（抄録）。", "p6": "抄録の範囲では、出版バイアスの評価と、対照群の条件（何もしない群か、別の練習をした群か）の違いの扱いは確認できない。解釈：19研究と少数で、LLM型と従来型の音声チャットボットを分けた効果は本文で確かめる必要がある。", "fun": "英語を話す練習相手として、AIのチャットボットはどれくらい役に立つのでしょうか。19の研究をまとめると、話す力などの学習成果だけでなく、「話すのが怖い」といった気持ちの面にも中程度以上の効果がありました。人間相手より失敗を気にせず話せることが、気持ちの面の効果につながっているのかもしれません。", "unverified": "調整変数の各水準の効果量は抄録になく未確認。"}}, {"id": "jn14", "rank": 14, "field": "教育", "headline": "歴史教育は事実認識を変えるが現在の対外態度は変えない", "title": "Teaching the past, informing the present? School history education and attitudes toward foreign countries", "url": "https://doi.org/10.1111/ajps.70082", "authors": "Soyoung Lee ほか", "venue": "American Journal of Political Science", "date": "2026-10-08", "sjr": 6.539, "citescore": 12.4, "citescore_year": "2025", "apa": "Lee, S., & Park, J. (2026). Teaching the past, informing the present? School history education and attitudes toward foreign countries. American Journal of Political Science. https://doi.org/10.1111/ajps.70082", "why": "ソウルの高校の教室データで、反日的内容や教科書の違いが歴史記憶と現在の対日・対米態度に与える影響を分けて検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ソウルの高校17校34教室の独自データで、学校の歴史教育は生徒が何を「事実」と信じ、歴史的出来事をどう評価するかに影響するが、その記憶の変化が現在の日本や米国への態度には自動的にはつながらないことを示した（抄録）。", "p2": "他国との過去の遺恨を強調する学校の歴史教育が、その国との現在の対立や協力への態度にどう影響するかは、国際的な対立と歴史記憶の研究で重要な問いだった（抄録）。", "p3": "まず、歴史教育での反日的な内容への接触が、日本との協力への態度を悪化させるかを検証した。次に、より親米的な教科書で学んだ生徒と、より反米的な教科書で学んだ生徒の態度を比べた（抄録）。", "p4": "評価は、生徒の歴史的事実の認識と評価、現在の日本・米国との協力への態度である（抄録）。教科書の割り当てがどの程度外生的かは抄録に記載がない。", "p5": "学校の歴史教育は、生徒がどの歴史的出来事を「事実」と信じるかとその評価に影響した。しかし歴史記憶への効果は、それだけでは現在の日本や米国への対応する態度に自動的にはつながらなかった（抄録）。", "p6": "抄録の範囲では、教科書の選択が学校の特徴と相関する可能性への対処は確認できない。解釈：高校生の短期的な態度を測っており、長期的な影響や家庭・メディアの影響との比較は本文で確かめる必要がある。", "fun": "学校で習う歴史は、隣の国への見方を決めてしまうのでしょうか。韓国の高校生を調べると、教科書の内容は「何が起きたか」の理解には確かに影響しましたが、「今その国と協力すべきか」という考えまでは自動的には変えていませんでした。過去の記憶と現在の判断の間には、思ったより距離があるということです。", "unverified": "効果の大きさと調査の時期は抄録になく未確認。"}}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "反気候ポピュリズムと持続可能な新製品", "title": "Populism and sustainable marketing practices: Insights from consumer-packaged goods manufacturers’ new product launches", "url": "https://doi.org/10.1007/s11747-026-01211-y", "authors": "Martin Heinberg ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-10-08", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Heinberg, M., Belkhouja, M., & Yoon, H. D. (2026). Populism and sustainable marketing practices: Insights from consumer-packaged goods manufacturers’ new product launches. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01211-y", "why": "新製品発売データでポピュリズムと企業の持続可能性戦略の関係を検証した、政治環境とマーケティングをつなぐ研究。", "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（データ、実証戦略、変数、仮説検定の結果、限界の節）を読んだ", "preprint": false, "p1": "米国のパリ協定離脱の発表（2017年）を準自然実験として、反気候ポピュリズムが米国の消費財メーカーの新製品でのプラスチック以外の包装（持続可能なマーケティング）を減らしたこと、その影響が経済的自由度の高い州や文化的に「固い」地域では弱まることを示した（抄録、結果）。", "p2": "持続可能なマーケティングはステークホルダー資本主義を基盤としてきたが、反気候対策のポピュリズムの台頭が企業の持続可能性戦略にどう影響するかは十分に分かっていなかった（序論）。", "p3": "資源依存理論に基づき、ポピュリズムが持続可能なマーケティングを減らすと仮説を立て、州レベルの公式制度（経済的自由度）と非公式制度（文化の固さ）が調整するとした。米国企業を処置群、非米国企業を対照群とし、離脱発表の前後を比べる差の差法を、企業と国のランダム切片を持つマルチレベルモデルで推定した（式1–2）。", "p4": "Global Dataの新製品発売データ、Orbisの財務データ、Fraser研究所の経済的自由度、文化の固さの指標を結合し、2010〜2020年の65か国・396社・13,267企業年の不均衡パネルを作った。従属変数は、ある年・国の新製品のうちプラスチック包装を使わない割合（%）である（データ、変数）。", "p5": "表4で、離脱前の米国企業と非米国企業の差は有意でなく（β=0.835、p=0.337）、交差項は負で有意だった（β=−2.692、p=0.025）。米国企業は離脱発表後、非米国企業より持続可能な包装が2.69%少なかった。差は2017〜2018年に最大で、2019〜2020年には有意でなくなった（図2）。経済的自由度との三重交差項は正で有意（4.120、p=0.003）で、自由度の低い州（ニューヨーク、ミネソタなど）の企業で差が大きかった（図3）。", "p6": "著者は、消費財の包装に限った分析であること、パリ協定離脱の発表は同じ政権の他の政策変更と完全には分離できず、2017年に始まった反気候ポピュリズムの政策体制全体の純効果と解釈すべきこと、他国・他時期のポピュリズムでの検証が必要なことを認めている（限界の節）。", "fun": "アメリカがパリ協定からの離脱を表明した後、アメリカの食品・日用品メーカーの新商品では、プラスチック以外の包装が少し減りました。政治の空気が、スーパーの棚に並ぶ商品の包装にまで表れたわけです。ただし効果は2年ほどで消えており、企業は政治の風向きに一時的に合わせつつ、長期の方針はそう簡単に変えないのかもしれません。", "unverified": "文化の固さの調整効果（H3）の推定値は読んでいない。"}}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "GILTI税制が米多国籍企業の海外有形投資を変えた", "title": "The Effect of Global Intangible Low-Taxed Income Tax on U.S. Multinational Companies’ Cross-Border Tangible Investments", "url": "https://doi.org/10.2308/tar-2024-0158", "authors": "Jingjing Huang ほか", "venue": "The Accounting Review", "date": "2026-10-07", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Huang, J., Osswald, B., & Wilson, R. J. (2026). The Effect of Global Intangible Low-Taxed Income Tax on U.S. Multinational Companies’ Cross-Border Tangible Investments. The Accounting Review, 1–31. https://doi.org/10.2308/tar-2024-0158", "why": "2017年米税制改革の利益移転対策が実物投資に与えた影響を検証した、国際課税の実証。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "2017年米税制改革のGILTI条項で、米多国籍企業が海外の有形投資を増やしたが国内投資は減らさず、国内外のイノベーションも増えたことを示した（抄録）。", "p3": "公開財務諸表に基づく事前の識別戦略で、GILTI税の影響を受ける企業の海外・国内の有形投資とイノベーションを分析した（抄録）。", "p5": "平均的な多国籍企業は2017年比で海外有形投資を約2億5,620万ドル増やしたが、国内有形投資の有意な減少は見られず、国内外のイノベーションが増えた（抄録）。", "fun": "GILTIは、海外の有形資産が多いほど税金が安くなる仕組みを含みます。そのため「税逃れ対策が工場の海外移転を招く」と心配されました。実際に海外投資は増えましたが、国内投資は減らず、技術開発はむしろ増えていたという、意図せざる効果と本来の狙いが両立した例です。", "unverified": "識別戦略の詳細は未確認。"}}, {"id": "jn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "自己愛の強い人ほど公開の場での表彰を望む", "title": "Inflated Titles, Inflated Egos: Narcissism Predicts the Desire for Public Rewards", "url": "https://doi.org/10.1177/19485506261486505", "authors": "Emily M. Zitek ほか", "venue": "Social Psychological and Personality Science", "date": "2026-10-08", "sjr": 2.179, "citescore": 11.8, "citescore_year": "2025", "apa": "Zitek, E. M., Krause, V., & Jordan, A. H. (2026). Inflated Titles, Inflated Egos: Narcissism Predicts the Desire for Public Rewards. Social Psychological and Personality Science. https://doi.org/10.1177/19485506261486505", "why": "4研究で報酬の公開・非公開の選好と自己愛の関係を示し、表彰制度の設計に示唆を与えた。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "一般に人は報酬を非公開で受け取るほうを好むが、誇大型の自己愛が強い人ほど公開の場での報酬を好むことを示した（抄録）。", "p3": "4つの研究（補足3研究）で、職場での動機づけ、同じ報酬の公開版と非公開版の選好、肩書きと給与のどちらの仕事を選ぶかを調べた（抄録）。", "p5": "自己愛の強い人ほど公開の報酬に動機づけられ、給与より良い肩書きの仕事を選びやすかった。この傾向は地位欲求の強さ、他者の嫉妬への懸念の小ささ、自己愛の賞賛と対抗の両側面と関連した（抄録）。", "fun": "表彰式で名前を呼ばれるのはうれしい人ばかりではなく、多くの人はこっそりもらうほうを好むそうです。ところが自己愛の強い人は公開の表彰や立派な肩書きを好みました。会社が肩書きを大盤振る舞いすると、一部の人にだけ効くということになります。", "unverified": "効果の大きさは未確認。"}}, {"id": "jn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "ウェーバーは「官僚制の鉄の檻」と言っていなかった", "title": "There is no ‘iron cage of bureaucracy’: Revisiting a classic metaphor in organizational analysis", "url": "https://doi.org/10.1177/13505084261471866", "authors": "Peter Fleming", "venue": "Organization", "date": "2026-10-08", "sjr": 1.966, "citescore": 9.0, "citescore_year": "2025", "apa": "Fleming, P. (2026). There is no ‘iron cage of bureaucracy’: Revisiting a classic metaphor in organizational analysis. Organization. https://doi.org/10.1177/13505084261471866", "why": "組織論で最も有名な比喩の出典と翻訳の問題を検討し、官僚制研究の前提を見直した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "ウェーバーの「官僚制の鉄の檻」はパーソンズの誤訳で、原語の意味（鋼のように硬い殻）に立ち返ると現代の組織について何が見えるかを検討した論考（抄録）。", "p3": "『プロテスタンティズムの倫理と資本主義の精神』の原語stahlhartes Gehäuseを、パーソンズによる最初の英訳と比べて検討した（抄録）。", "p5": "原語は「鋼のように硬い殻」と訳すべきで、官僚制とは関係がない。著者は比喩を捨てることを求めず、直訳が新たな洞察を与えるかを検討した（抄録）。", "fun": "社会科学で最も有名な比喩の一つ「鉄の檻」は、実はウェーバー自身の言葉ではなく翻訳者の創作に近いものでした。しかも官僚制の話でもなかったのです。檻（外から閉じ込める）と殻（自分の体の一部）では意味が大きく違い、名言の受け取り方そのものを問い直す面白い論文です。", "unverified": "直訳から得られる具体的な洞察は未確認。"}}, {"id": "jn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "閉経移行期のアイデンティティの一時停止と身体化", "title": "The Power of Identity Pause: Perimenopause and the Embodiment Process", "url": "https://doi.org/10.5465/amj.2024.1435", "authors": "Madeline Toubiana ほか", "venue": "Academy of Management Journal", "date": "2026-10-08", "sjr": 10.781, "citescore": 19.8, "citescore_year": "2025", "apa": "Toubiana, M., & Jennings, J. E. (2026). The Power of Identity Pause: Perimenopause and the Embodiment Process. Academy of Management Journal. https://doi.org/10.5465/amj.2024.1435", "why": "AMJ掲載の、更年期移行が職業上のアイデンティティに与える影響を扱う研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、閉経移行期（ペリメノポーズ）に働く人が経験する「アイデンティティの一時停止」と、身体を通じた自己の捉え直しの過程を論じた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "体の変化が仕事上の自分らしさにどう影響するかは、組織研究ではあまり扱われてきませんでした。題名から読み取れる問いは、更年期の移行期に一時的に「いつもの自分」でいられなくなる経験を、人はどう乗り越えるのか、というものです。", "unverified": "内容全体が未確認。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "神経多様性の見えない労働と開示への転換", "title": "“I Am Not Broken”: The Invisible Labor of Neurodivergence and the Pivot to Disclosure", "url": "https://doi.org/10.5465/amd.2025.0398", "authors": "Xi Wen Carys Chan ほか", "venue": "Academy of Management Discoveries", "date": "2026-10-07", "sjr": 3.416, "citescore": 8.7, "citescore_year": "2025", "apa": "Chan, X. W. C., Shang, S., Jiang, X., Shaw, A., Khan, M., & Do, T. (2026). “I Am Not Broken”: The Invisible Labor of Neurodivergence and the Pivot to Disclosure. Academy of Management Discoveries. https://doi.org/10.5465/amd.2025.0398", "why": "AMD掲載の、神経発達特性を持つ働き手の見えない労働と開示の決定を扱う研究（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、OpenAlexで見つけたOSF上の同題の版の抄録を使用", "preprint": false, "short": true, "p1": "神経発達特性のある従業員が、負担の大きい「擬態（masking）」から開示へ転じる4段階の過程を、1,593件のオンラインの語りから示した（抄録）。", "p3": "1,593件のオンラインの語りを分析し、隠蔽・移行の引き金・開示の瞬間・開示後の結果からなる過程モデルを構築した（抄録）。", "p5": "開示の引き金は「疲弊の経路」と「安全な誘いによる力づけの経路」の2つで、包摂的リーダーシップが心理的安全を生んだ。主な結果は配慮ではなく、「自分は壊れていない」という自己非難からの解放で、相互の忠誠を育んだ（抄録）。", "fun": "発達特性のある人は、周りに合わせて振る舞い続ける「擬態」で目に見えない疲れをためています。打ち明けるきっかけは、限界による疲弊か、上司の安心できる声かけかの2通りでした。打ち明けて得たものが特別な配慮より「自分はおかしくない」という安心だったという点が胸に残ります。", "unverified": "掲載版とOSF版の内容の差は未確認。"}}, {"id": "jn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "強制力を持つ怒る上司は組織的非人間化を通じて部下を離脱させる", "title": "Angry leader with coercive power: Unpacking the effects on follower withdrawal through organizational dehumanization.", "url": "https://doi.org/10.1037/ocp0000449", "authors": "Hui Chen ほか", "venue": "Journal of Occupational Health Psychology", "date": "2026-10-08", "sjr": 2.356, "citescore": 10.4, "citescore_year": "2025", "apa": "Chen, H., Xiao, Z., Yang, Y., & Wang, X.-H. (. (2026). Angry leader with coercive power: Unpacking the effects on follower withdrawal through organizational dehumanization. Journal of Occupational Health Psychology. https://doi.org/10.1037/ocp0000449", "why": "上司の怒りと権力の組み合わせが部下の離脱につながる経路を扱うJOHPの研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、強制的な権力を持つ上司の怒りが、組織による非人間化（人として扱われていない感覚）を通じて部下の離脱を招く経路を調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "上司が怒るとき、その上司が処分の権限を持っているかどうかで部下の受け止め方は変わりそうです。題名から読み取れる問いは、怒りと権力の組み合わせが「会社は自分を道具扱いしている」という感覚を生み、仕事から心が離れていくのか、というものです。", "unverified": "内容全体が未確認。"}}, {"id": "jn22", "rank": 22, "field": "統計学", "headline": "潜在空間の分布一致による半教師あり生成学習", "title": "Semi-Supervised Generative Learning via Latent Space Distribution Matching", "url": "https://doi.org/10.1080/01621459.2026.2739659", "authors": "Kwong Yu Chong ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-07", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "apa": "Chong, K. Y., & Feng, L. (2026). Semi-Supervised Generative Learning via Latent Space Distribution Matching. Journal of the American Statistical Association, 1–66. https://doi.org/10.1080/01621459.2026.2739659", "why": "JASA掲載の、ラベルの少ない状況での生成学習の新手法（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "対応のあるデータが少ない条件付き生成で、対応のないデータで潜在空間を学び、その空間で同時分布を1-ワッサースタイン距離で一致させる半教師あり生成法LSDMを示した（抄録）。", "p3": "2段階で、①対応あり・なしの両方から低次元の潜在空間を学び、②対応のあるデータだけで潜在空間上の同時分布を一致させ、同時分布間の距離の上界を最小化した（抄録）。", "p5": "非漸近の誤差上界を示し、対応のないデータが生成の幾何的な忠実度を高めることを示した。潜在拡散モデルはLSDMの一変種と見なせ、その一致性に理論的な示唆を与えた（抄録）。", "fun": "「この説明文にはこの画像」という対になったデータは集めるのが大変ですが、画像だけ、文章だけのデータはたくさんあります。この研究は、ばらばらのデータで先に土台の空間を作っておけば、少ない対のデータでも上手に生成できることを理論的に示しました。", "unverified": "画像タスクでの数値は未確認。"}}, {"id": "jn23", "rank": 23, "field": "統計学", "headline": "高次元の異質な媒介分析で検出力を高める", "title": "Power Enhancement in High-Dimensional Heterogeneous Mediation Analysis", "url": "https://doi.org/10.1080/01621459.2026.2739445", "authors": "Xiufan Yu ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-07", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "apa": "Yu, X., & Kelley, K. (2026). Power Enhancement in High-Dimensional Heterogeneous Mediation Analysis. Journal of the American Statistical Association, 1–94. https://doi.org/10.1080/01621459.2026.2739445", "why": "JASA掲載の、高次元媒介変数の検定の検出力向上法（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、多数の媒介変数を持ち効果が個体で異なる高次元の媒介分析で、検定の検出力を高める方法を提案した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "原因が結果に届くまでに、たくさんの経路（媒介）を通ることがあります。経路が多すぎると、本当に効いている経路を見逃しやすくなります。題名から読み取れる問いは、そうした高次元の状況で見逃しを減らす検定を作れるか、というものです。", "unverified": "内容全体が未確認。"}}, {"id": "jn24", "rank": 24, "field": "機械学習", "headline": "軌道予測の前に反応の遅れを学ぶ", "title": "Reverberation: Learning the Latencies Before Forecasting Trajectories", "url": "https://doi.org/10.1109/tpami.2026.3741469", "authors": "Conghao Wong ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-07", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Wong, C., Zou, Z., Xia, B., & You, X. (2026). Reverberation: Learning the Latencies Before Forecasting Trajectories. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–18. https://doi.org/10.1109/tpami.2026.3741469", "why": "TPAMI掲載の、エージェントの反応遅延を考慮した軌道予測（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "歩行者や車両が出来事に反応するまでの遅れ（レイテンシー）を明示的に学習し、それを条件にした軌道予測モデルRevを提案した（抄録）。", "p3": "音響の残響に着想を得た「残響変換」と2つの学習可能な残響カーネルで、個々の遅れの好みとその確率的なばらつきを予測した（抄録）。", "p5": "歩行者と車両の複数のデータセットで実験したが、数値は抄録が途中で切れており確認できない（抄録）。", "fun": "人は何かに気づいてから動きを変えるまで、少し時間がかかります。その遅れは人によって違います。この研究は、遅れを予測の中に組み込むことで、急に不自然な方向転換をしない、もっと人間らしい軌道を予測しようとしました。", "unverified": "性能の数値は未確認。"}}, {"id": "jn25", "rank": 25, "field": "機械学習", "headline": "確率的マスクで3Dガウス表現を軽量化", "title": "MaskGaussian++: Probabilistic Masks for General 3D Gaussian Representation", "url": "https://doi.org/10.1109/tpami.2026.3740477", "authors": "Yifei Liu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-07", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Liu, Y., Gao, Y., Zhan, Y.,
