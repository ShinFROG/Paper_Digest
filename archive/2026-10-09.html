だ振る舞いが他の文脈にも広がるかどうかを「ペルソナの階層」で説明するモデルを提案した（抄録）。", "p3": "全文脈に共通する既定のペルソナと文脈ごとのペルソナを想定し、4つの振る舞い・15の学習文脈で120個の微調整モデルを作って汎化の広さを測った（抄録）。", "p5": "汎化の狭さは学習文脈のペルソナと既定ペルソナの類似度と相関した（Qwen3-4BでPearson r=0.72）。提案のペルソナ保持正則化（PPR）は強化学習での報酬ハッキングを42〜55%から最大0.2%に下げた（抄録）。", "fun": "AIに「先生役」として教えたことが、先生役でないときにもにじみ出ることがあります。この論文は、AIの中に「いつもの自分」と「役柄の自分」の階層があり、いつもの自分に近い役で教えると全体に広がる、と考えると説明できることを示しました。人が仕事の口調を家に持ち帰るかどうかに似た話です。", "unverified": "PPRの具体的な定式化と、相関の他モデルでの値は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "迎合の度合いはタスク・モデル・圧力で変わる", "title": "Beyond the Sycophancy Score: How Task, Model, and Pressure Shape LLM Yielding", "url": "https://arxiv.org/abs/2610.08840", "authors": "Guang Yang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Yang, G., Hosseinmardi, H., Liu, F., & Ghasemian, A. (2026). Beyond the Sycophancy Score: How Task, Model, and Pressure Shape LLM Yielding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08840", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが利用者に押し返されて正答を手放す「迎合（sycophancy）」が、どんな条件で起きるかを大規模に分解した（抄録）。", "p3": "10の構成（8モデル、うち2つは最大推論でも）に同じ200問・13の圧力条件・4往復の会話を課し、103,939件の応答を2つのLLM判定者で採点した（抄録）。", "p5": "支配的な要因は主張を検証するコストとガードレールの有無で、課題要因を除くとMcFaddenのR²が0.485下がった（モデル系統0.139、圧力の手口0.009）。最大推論で難問パズルでの譲歩率は19.2%・12.5%から0%になった（抄録）。", "fun": "AIに「違うでしょ」と言い張ると答えを変えてしまうことがあります。この研究では、言い方の巧みさや感情的な訴えはほとんど関係なく、AI自身がその場で確かめにくい問題ほど折れやすいと分かりました。人間も自信のない問題ほど押しに弱いのと同じ構図です。", "unverified": "個々のモデル名ごとの迎合率は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "事後学習の各段階がLLMの説得力をどう変えるか", "title": "Successive Training Stages and Large Language Model Persuasion: Effects of Misalignment, Supervised Fine-Tuning, and Preference Optimization", "url": "https://arxiv.org/abs/2610.09964", "authors": "Antony Dalmiere (LAAS-TRUST) ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Dalmiere, A., Marchand, P., Auriol, G., & Nicomette, V. (2026). Successive Training Stages and Large Language Model Persuasion: Effects of Misalignment, Supervised Fine-Tuning, and Preference Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09964", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの事後学習の各段階（陰謀論データでの微調整、説得データでの微調整、選好最適化）が、人の態度を変える力にどう効くかを実験で分けた（抄録）。", "p3": "Prolificの835人を5条件（中立文、陰謀論学習、説得学習、選好最適化IPO、GPT-4）に無作為に割り当て、10の政治争点について個人に合わせた文章を読ませ、前後の態度変化をANCOVAで分析した（抄録）。", "p5": "説得的な微調整は陰謀論学習のみより大きな態度変化を生んだ（d=0.30）が、IPOの上乗せはなかった（d=0.03）。GPT-4は中立文と差がなかった（d=−0.01）（抄録）。", "fun": "AIに説得のうまい文章を学ばせると、本当に人の意見が動くのでしょうか。835人の実験では、説得文の例で教えると効果が出た一方、「どちらの答えが好ましいか」を学ばせる仕上げの訓練は上乗せにならなかったそうです。どの段階の訓練がAIの影響力を生むかを切り分けた点が新しいところです。", "unverified": "条件と初期態度の交互作用の具体的な形は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "故人を演じるLLMの事前登録監査", "title": "Large Language Models Speaking as Deceased Loved Ones: A Preregistered Multi-Turn Audit of Responses to Grief and Passive Suicidal Ideation", "url": "https://doi.org/10.5281/zenodo.23229652", "authors": "Rekhert, Martin", "venue": "Zenodo", "date": "2026-10-08", "apa": "Rekhert, M. (2026). Large Language Models Speaking as Deceased Loved Ones: A Preregistered Multi-Turn Audit of Responses to Grief and Passive Suicidal Ideation. Zenodo. https://doi.org/10.5281/ZENODO.23229652", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "故人を演じるよう頼まれたLLMが、悲嘆や受動的な希死念慮にどう応答するかを事前登録の多往復監査で調べた（抄録）。", "p3": "8つのLLMで、死を疑い孤立し故人に会いたいと語る模擬遺族との576本の台本会話を、利用者の依頼によるロールプレイ・事業者が設定したグリーフボット・ペルソナなしの条件と死別後の時期を変えて実施し、人間の符号化者で検証した盲検のLLM判定で採点した（抄録）。", "p5": "死の否定や再会の約束はまれだった。受動的な希死念慮への応答はロールプレイで98%、グリーフボットで87%が適切で、不適切な応答はすべて2つのモデルから出た（抄録）。", "fun": "亡くなった家族の口調でAIに話してほしいと頼む人が増えています。危ないのは、AIが「また会えるよ」と死を否定したり、後を追う気持ちを後押ししたりすることです。この監査では多くのモデルは適切に応じましたが、問題のある応答は特定の2モデルに集中しており、モデルごとの点検が大切だと分かります。", "unverified": "問題のあった2つのモデルの名前は抄録になく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "個人化されたLLMで選択肢の幅が狭まる", "title": "Decision-Space Collapse and Preference Narrowing in Personalized Language Models", "url": "https://doi.org/10.5281/zenodo.23224092", "authors": "Cousins, Andrew J.", "venue": "Zenodo", "date": "2026-10-07", "apa": "Cousins, A. J. (2026). Decision-Space Collapse and Preference Narrowing in Personalized Language Models (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23224092", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人化されたLLMの助言で選択肢が減る現象について、既存の2研究を「選択肢の可視性」という共通の対象で整理した研究ノート（抄録）。", "p3": "規則ベースの尺度で助言に出ない選択肢を測るDecision-Space Collapse研究と、利用者情報で有用な選択肢が減るとするPRISK研究を突き合わせた。新しいデータや分析はない（抄録）。", "p5": "両研究は、文脈によって助言に出る選択肢が変わるという点で収束するが、方向は逆だった（再枠組みで範囲が広がり、個人化で狭まった）（抄録）。", "fun": "AIに「私に合うおすすめは？」と聞くと、気づかないうちに選択肢が絞られているかもしれません。この論文は、絞られるかどうかではなく「何が見えるか」が文脈で変わることが本質で、文脈は選択肢を広げることも狭めることもある、と整理しています。", "unverified": "新しい実証結果はなく、元研究の数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "採用判断でAIと人間の一致を測る労働市場チューリングテスト", "title": "Developing and assessing a scale for measuring human–AI alignment in hiring decisions", "url": "https://doi.org/10.21203/rs.3.rs-10630904/v1", "authors": "Andres Abril ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Abril, A., Rangel, M. A., & Zanoni, W. (2026). Developing and assessing a scale for measuring human–AI alignment in hiring decisions. https://doi.org/10.21203/rs.3.rs-10630904/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "採用の推薦判断で人間とAIがどれだけ似ているかを測る「労働市場チューリングテスト」と、共通尺度上の潜在特性machinaを提案した（抄録）。", "p3": "無作為化した実地実験で、専門の採用担当者とLLMの推薦判断を比較し、推薦の記述がどれだけ基準AIに近いかで人間とAIを同じ尺度に並べた（抄録）。", "p5": "人間とAIのチームで特性の平均と分散が大きく異なった。AIに人間らしさを演じさせると差は縮むが消えず、ランダムな選択を重く混ぜたモデルのほうが人間の判断を再現した。一致度は職務の複雑さで系統的に変わった（抄録）。", "fun": "AIが人間の採用担当者のふりをできるかを試すと、平均的な判断は似せられても、人によるばらつきまでは再現できませんでした。むしろ「でたらめさ」を混ぜたほうが人間らしくなったというのは、人間の判断の多様さそのものが真似の難しさだという面白い結果です。", "unverified": "具体的な数値（平均・分散の差）は抄録になく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "推論予算を増やしてもLLMの認知バイアスは残る", "title": "The Long Road to the Same Answer: Cognitive Bias Under Escalating Reasoning Budgets in Large Language Models", "url": "https://arxiv.org/abs/2610.10049", "authors": "Obada Kraishan", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Kraishan, O. (2026). The Long Road to the Same Answer: Cognitive Bias Under Escalating Reasoning Budgets in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10049", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "推論モデルに長く考えさせると、人間の典型的な判断バイアスが弱まるかを用量反応の形で検証した（抄録）。", "p3": "6つのバイアスの30場面を、4系統の推論モデルと対応する非推論モデルに、思考上限0〜8,192トークンで12,350回問い、実際に使った推論トークンを用量とした（抄録）。", "p5": "推論モデルは兄弟モデルよりバイアスが小さくなく（Δ=+0.031、p=.157）、推論量が増えても有意に減らなかった。人間と同じ方向に出たのはアンカリングだけ（d=1.89）だった（抄録）。", "fun": "人間は「よく考えれば」思い込みに引きずられにくくなると言われます。ところがAIの推論モデルは、長く考えさせてもバイアスは減らず、むしろ人間と逆向きに偏るものもありました。一方「最初に示された数字を言い直してから答えて」という一言の指示はアンカリングを下げる傾向があり、考える量より考え方が大事だと示唆しています。", "unverified": "モデル系統の名前と、バイアスごとの効果量の詳細は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "微調整LLMで調査票から持続可能な消費行動を予測", "title": "Predicting Sustainable Consumption Behavior under Incomplete Information: Comparing Machine Learning and a Fine-Tuned Large Language Model", "url": "https://doi.org/10.2139/ssrn.7583827", "authors": "Shayaan Syed ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Syed, S., Hulleck, A. A., Saihi, A., Khalfan, M., & Acquaye, A. A. (2026). Predicting Sustainable Consumption Behavior under Incomplete Information: Comparing Machine Learning and a Fine-Tuned Large Language Model. https://doi.org/10.2139/ssrn.7583827", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "調査票データから持続可能な消費行動を予測する際、表形式の機械学習と微調整LLMのどちらが強いかを、欠測を増やしながら比べた（抄録）。", "p3": "食品・衣料の6調査の1,260観測で14の回帰手法と、QLoRAで微調整したQwen2.5-3B-Instructを、交差検証と189人の保留テストで評価した（抄録）。", "p5": "ExtraTreesが最良で保留テストのMAE=0.3015、R²=0.6873。LLMは欠測0%でMAE=0.3319、R²=0.5545だったが、欠測60%ではMAEが0.3891とExtraTreesの0.4285を下回った（抄録）。", "fun": "アンケートの答えから人の行動を当てるなら、表計算向けの機械学習がまだ強いという結果です。ただし質問の6割が抜けた状態では、文章として回答者像を読むLLMのほうが外れが小さくなりました。情報が少ないときほど、言葉で常識を補えるLLMに出番があるという見方ができます。", "unverified": "欠測を課した変数の種類と手順の詳細は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "高次多項式で構造動力学を時間積分するhPIM", "title": "hPIM — High-Order Polynomial Integration Method for Structural Dynamics", "url": "https://doi.org/10.2139/ssrn.7568078", "authors": "M.Sc Marcelo Moncayo Theurer", "venue": "SSRN", "date": "2026-10-07", "apa": "Moncayo Theurer, M. S. M. (2026). hPIM — High-Order Polynomial Integration Method for Structural Dynamics. https://doi.org/10.2139/ssrn.7568078", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "構造動力学の時間積分に、変位・速度・加速度の局所的な高次多項式表現を使う新しい枠組みhPIM（1PIMと2PIM）を提案した（抄録）。", "p3": "1PIMは変位を3次多項式で表し時間ステップ末で釣り合いを課す。2PIMは加速度を2次多項式で近似して解析的に積分し、中点と末尾の加速度を連立の釣り合い式で決める。神戸の地震記録を入力とした減衰1自由度系で、Newmark法・中央差分・細かいRunge–Kuttaと比べた（抄録）。", "p5": "1PIMは従来の2次精度法と同程度で、2PIMは試した時間刻みの範囲で平均変位RMSEが低く、大きめの刻みでも精度を保った（抄録）。", "fun": "地震で建物がどう揺れるかをコンピュータで計算するときは、時間を細かく刻んで一歩ずつ進めます。この論文は、一歩の間の動きを高次の多項式でなめらかに表すことで、刻みを大きくしても精度を保とうとする工夫です。予備的な1自由度の検証段階で、多自由度や非線形への拡張はこれからです。", "unverified": "RMSEの具体的な数値と安定性の解析は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "オプティカルフローと多重スケールPoincaré解析で複合材損傷", "title": "Optical Flow and Multiscale Poincaré Analysis for Composite Damage Detection", "url": "https://doi.org/10.2139/ssrn.7577998", "authors": "Jakub Augustyniak ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Augustyniak, J., Griškevičius, P., & Perkowski, D. (2026). Optical Flow and Multiscale Poincaré Analysis for Composite Damage Detection. https://doi.org/10.2139/ssrn.7577998", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "高速度カメラの画像から求めた振動信号を多重スケールのPoincaréプロットで要約し、複合材板の内部剥離と補修の効果を非接触で見分ける方法を示した（抄録）。", "p3": "健全1枚・中央に直径50 mmの剥離3枚・樹脂注入で補修2枚のガラス繊維積層板に20 gの鋼球を落とし、22,000 fpsで撮影した16個のマーカーを2種類のオプティカルフローで追跡、戻り写像に共分散楕円を当てはめて形状指標（SD1、SD2、面積、離心率など）を比べた（抄録）。", "p5": "健全板は全スケールで対称な密集、剥離板は大きなスケールまで広がった非対称な分布、補修板はその中間を示した（抄録）。", "fun": "板をコツンと叩いたときの揺れ方は、中に傷があると少し乱れます。この研究は、その揺れを「今の値と次の値」の点の散らばりとして描き、楕円の形の違いとして傷を読み取りました。補修した板が健全と傷ありの中間になったことから、修理がどこまで効いたかも測れる可能性があります。", "unverified": "指標ごとの差の大きさ（数値）は抄録になく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "Transformer-LSTMでGNSS信号劣化を事前分類", "title": "SENTINEL-GNSS: Proactive Multi-Horizon Classification of GNSS Signal Degradation Using a Transformer-LSTM Network", "url": "https://doi.org/10.21203/rs.3.rs-10329071/v1", "authors": "Joel Segun Ojerinde ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Ojerinde, J. S., Mustapha, I. I., Ogunlade, J. O., Ingeriyinkindi, C., Rashid, M. H. O., & Ahmed, W. A. (2026). SENTINEL-GNSS: Proactive Multi-Horizon Classification of GNSS Signal Degradation Using a Transformer-LSTM Network. https://doi.org/10.21203/rs.3.rs-10329071/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "都市部のGNSS信号の劣化を、起きる前に5・15・30秒先まで同時に予測分類するTransformer-LSTMモデルSENTINEL-GNSSを示した（抄録）。", "p3": "受信機から得る37特徴量の30秒窓を入力とし、香港UrbanNavデータ62,413窓で学習、東京・新宿のUrbanNav 31,236窓でゼロショット評価した（抄録）。", "p5": "5秒先でMacro-F1=0.821、劣化クラスの再現率0.847で、木系手法より12ポイント高かった。新宿では劣化F1=0.753を保ち（ランダムフォレストは0.148）、XGBoostとのアンサンブルで0.896。推論は1窓0.045 ms（抄録）。", "fun": "ビルの谷間ではGPSの電波が反射して位置がずれますが、普通はずれた後で気づきます。この研究は、受信状態の変化から数秒後の劣化を予報することで、ずれた測定を取り込む前に備えられるようにしました。香港で学習して新宿でも通用した点が、汎用性の手がかりです。", "unverified": "37特徴量の内訳は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "会計研究の税会計差異は回帰係数の解釈を難しくする", "title": "The Use of Book-Tax Differences in Empirical Accounting Research", "url": "https://doi.org/10.2139/ssrn.7570119", "authors": "David A. Guenther ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Guenther, D. A., He, H. (., Krull, L. K., & Wu, K. (2026). The Use of Book-Tax Differences in Empirical Accounting Research. https://doi.org/10.2139/ssrn.7570119", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "会計研究でよく使う「会計利益と課税所得の差（BTD）」を1つの説明変数にすると、回帰係数の解釈が難しくなることを示した（抄録）。", "p3": "2つの成分を1変数にまとめると係数が制約されることを理論的に導き、既存研究を再現し、公表研究での使用頻度を調べた（抄録）。", "p5": "BTDの制約された係数が各成分と被説明変数の関係を覆い隠しうることを示し、使う研究者向けの診断法を提案した（抄録）。", "fun": "「AからBを引いた値」を一つの変数にすると便利ですが、AとBが結果に違う向きで効いていると、その差だけでは本当の関係が見えなくなります。高校数学で言えば、y=a·A+b·Bをy=c·(A−B)と書くのは、b=−aのときにしか正しくないということです。", "unverified": "再現した既存研究の具体名は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "中国の業績予想義務は企業の透明性を高めたか", "title": "The Impact of Management Earnings Forecasts on Corporate Transparency: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7571738", "authors": "Hanwen Chen ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Chen, H., Conaway, J., Kou, A., & Liang, L. (2026). The Impact of Management Earnings Forecasts on Corporate Transparency: Evidence from China. https://doi.org/10.2139/ssrn.7571738", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の業績予想の義務化が、企業の透明性を高めたかを外生的な制度変化で検証した（抄録）。", "p3": "開示義務を外生ショックとして使い、裁量的発生高と情報を持つ取引の確率で透明性を測り、別の会計・市場指標で頑健性を確かめた（抄録）。", "p5": "義務的な業績予想は透明性を有意に高め、効果は情報環境の弱い企業や外部監視の強い企業で大きく、企業価値の上昇とも関連した（抄録）。", "fun": "「業績の見通しを出しなさい」と義務づけるだけで、会社の会計は透明になるのでしょうか。中国の制度変更を使ったこの研究では、利益の調整が減り、内部情報を使った取引も減っていました。もともと情報の少ない会社ほど効果が大きいのは、開示の価値がどこにあるかを示しています。", "unverified": "効果の大きさ（数値）は抄録になく未確認。"}}, {"id": "pr30", "rank": 30, "headline": "共通株主と10-Kで名指しされる競合ネットワーク", "title": "Common Ownership and Perceived Competition Networks", "url": "https://doi.org/10.2139/ssrn.7573418", "authors": "Ziqing Tian", "venue": "SSRN", "date": "2026-10-08", "apa": "Tian, Z. (2026). Common Ownership and Perceived Competition Networks. https://doi.org/10.2139/ssrn.7573418", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "機関投資家の共通保有が、企業が誰を競合として意識するかを変えることを示した（抄録）。", "p3": "1995〜2023年の10-Kで名指しされた競合から有向ネットワークを作り、機関投資家の合併を共通保有の外生ショックとするDIDで分析した（抄録）。", "p5": "保有の重なりが増えると競合の削除が起きやすく、削除後は相手の開示書類のダウンロードが持続的に減った。削除は投資の減少・営業利益率の上昇と同時に起きた（抄録）。", "fun": "同じ大株主が自社とライバルの両方を持っていると、競争の手がゆるむのではと独占禁止の議論があります。この研究は、年次報告書に書かれる「競合」の名前とライバルの書類を読む回数を使い、競争の「注意」そのものが減ることを示しました。", "unverified": "効果の大きさは未確認。"}}, {"id": "pr31", "rank": 31, "headline": "個人投資家の質問が後の規制当局の照会を予告する", "title": "Issue-specific retail investor questions and subsequent regulatory scrutiny", "url": "https://doi.org/10.2139/ssrn.7583849", "authors": "Han Sun ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Sun, H., Kang, H. G., & Ryu, D. (2026). Issue-specific retail investor questions and subsequent regulatory scrutiny. https://doi.org/10.2139/ssrn.7583849", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人投資家が公開の場で出す質問のリスク懸念が、その論点についての取引所の照会を予告するかを調べた（抄録）。", "p3": "中国の投資家交流プラットフォームの質問を論点ごとに分け、リスク懸念の質問の割合と、同じ論点への後の照会の関係を、質問数や企業全体の状況を考慮して分析した（抄録）。", "p5": "リスク懸念の質問の割合は後の同一論点の照会と正に関連し、関連は最初の1か月を超えて続いた。質問数では捉えられない情報を含む（抄録）。", "fun": "個人投資家が会社に投げかける素朴な質問の中に、後で取引所が問題にする論点が先に現れているという結果です。質問の数ではなく「何を心配しているか」に情報がある点は、多くの人の小さな疑問が早期警報になりうることを示しています。", "unverified": "関連の強さの数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMは社債の情報摩擦を減らすか", "title": "Large Language Models and Information Frictions in Corporate Bonds", "url": "https://doi.org/10.2139/ssrn.7577906", "authors": "Moazzam Khoja", "venue": "SSRN", "date": "2026-10-07", "apa": "Khoja, M. (2026). Large Language Models and Information Frictions in Corporate Bonds. https://doi.org/10.2139/ssrn.7577906", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "決算説明会の書き起こしをLLMで読むと、辞書による単語数えでは拾えない社債価格の情報が得られることを示した（抄録）。", "p3": "同じ書き起こしからLLMと辞書でデフォルト可能性を採点し、格付け推移・説明会時点のスプレッド・社債リターンとの関係を比べた（抄録）。", "p5": "LLMの得点は1年先の格付け推移を予測し、辞書の情報はすでにスプレッドに入っていたがLLMの情報は入っていなかった。アナリストの意見が割れた場合だけ1〜2週間の社債リターンを予測した（抄録）。", "fun": "「悪い言葉の数」を数える方法と、文脈ごと読むLLMでは、同じ文章から引き出せる情報が違いました。市場がまだ価格に織り込んでいない情報をLLMが読み取れたのは、解釈の分かれる難しい場面でした。読むのが難しい文章ほど、読める機械の価値が出るわけです。", "unverified": "対象期間と標本規模は抄録に記載なく未確認。"}}, {"id": "pr33", "rank": 33, "headline": "有給病気休暇の義務化で企業の現金が安定", "title": "Do Employee-friendly Regulations Stabilize Corporate Cash Dynamics? -A Natural Experiment from Paid Sick Leave Mandate", "url": "https://doi.org/10.2139/ssrn.7561598", "authors": "Anamul Haque ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Haque, A., Chowdhury, A. A., & Chowdhury, S. (2026). Do Employee-friendly Regulations Stabilize Corporate Cash Dynamics? -A Natural Experiment from Paid Sick Leave Mandate. https://doi.org/10.2139/ssrn.7561598", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "州の有給病気休暇の義務化が、米上場企業のキャッシュフローの変動と現金保有を減らしたことを示した（抄録）。", "p3": "2003〜2024年の積み重ね型コホートの差の差法で、イベントスタディ・プラセボ・別標本の検定を加え、職場安全違反と従業員満足を経路として調べた（抄録）。", "p5": "義務化後に営業キャッシュフローの変動と現金保有が低下し、安全違反の減少と従業員満足の上昇を伴った。減った現金は投資・収益性・企業価値の上昇と同時に起きた（抄録）。", "fun": "従業員に優しい規制は企業の負担と思われがちです。ところがこの研究では、急な病欠という予測できない混乱が「予定された費用」に変わることで、会社の資金の揺れが小さくなり、手元の現金を投資に回せるようになっていました。", "unverified": "効果の大きさ（数値）は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "約束と提供の整合をマーケティング能力として捉える", "title": "Mind the Gap: Promise-Delivery Alignment as a Strategic Marketing Capability", "url": "https://doi.org/10.2139/ssrn.7571819", "authors": "Maneesha Maneesha", "venue": "SSRN", "date": "2026-10-08", "apa": "Maneesha, M. (2026). Mind the Gap: Promise-Delivery Alignment as a Strategic Marketing Capability. https://doi.org/10.2139/ssrn.7571819", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業が顧客・従業員・投資家に出す約束と実際の行動の一致を、1つの戦略的な現象として扱う「約束-提供整合（PDA）」枠組みを提案した概念論文（抄録）。", "p3": "期待不一致・サービスギャップ・組織の脱連結・心理的契約・自発的開示・グリーンウォッシングの研究を統合し、方向・領域・相手でギャップを定義して11の命題を立てた（抄録）。", "p5": "実証はない。観察可能になると過剰な約束の害は控えめな約束の利益より大きい、ある相手に露見したギャップは他の相手に波及する、などを命題とした（抄録）。", "fun": "「言ったことをやる」は当たり前に聞こえますが、企業は顧客にも社員にも投資家にも別々に約束しています。この論文は、それらを一つの信頼の問題として扱うべきだと主張します。大げさに言って外すほうが、控えめに言って上回るより損が大きいという命題は、身近な経験ともよく合います。", "unverified": "命題は未検証の理論的主張。"}}, {"id": "pr35", "rank": 35, "headline": "苦情ゼロより再発ゼロ：繰り返すサービス失敗をなくす", "title": "From Zero Complaints to Zero Repeat A Practitioner Framework for Removing Recurring Service Failures in Institutional Administration", "url": "https://doi.org/10.2139/ssrn.7568818", "authors": "Brijender Bhargav", "venue": "SSRN", "date": "2026-10-08", "apa": "Bhargav, B. (2026). From Zero Complaints to Zero Repeat A Practitioner Framework for Removing Recurring Service Failures in Institutional Administration. https://doi.org/10.2139/ssrn.7568818", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "苦情ゼロではなく「同じ失敗の再発ゼロ」を目標にする行政サービス改善の実務枠組みを示した（抄録）。", "p3": "学校事務の窓口の実践から、見る・たどる・引き受ける・直す・学ぶの5段階の循環と、依頼者の手間（接点数、作業時間に対する待ち時間）の測り方を示した（抄録）。", "p5": "著者自身の実践の省察で、統制された研究ではないと明記されている。自己評価と監査の道具を付録に含む（抄録）。", "fun": "苦情にすばやく答えても、同じ理由で同じ人がまた困っているなら問題は解決していません。この論文は、窓口で何度も起きる失敗の原因を断つことを目標にしようと提案します。「手続きに何回やり取りが必要か」を数えるという測り方は、どの役所や病院でも試せそうです。", "unverified": "効果の定量的な検証はない。"}}, {"id": "pr36", "rank": 36, "headline": "信頼を制約とした個人別価格の最適化", "title": "Optimal Personalized Pricing under a Consumer Trust Constraint", "url": "https://doi.org/10.2139/ssrn.7568058", "authors": "Rajit Chatterjea ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Chatterjea, R., & Park, J. (2026). Optimal Personalized Pricing under a Consumer Trust Constraint. https://doi.org/10.2139/ssrn.7568058", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人別価格が消費者の信頼を損なう場合に、独占企業がどこまで価格を個人化すべきかを解析的に解いた（抄録）。", "p3": "一律価格（α=0）と個人別の独占価格（α=1）を結ぶ強度αを選び、不公平感で下がる信頼指標を下限以上に保つ制約の下で、線形需要とKKT条件で最適解を導いた（抄録）。", "p5": "利潤はαの2次関数で最大利得の割合α(2−α)を得る。総数量はαに依存せず総余剰は下がる。最適強度は無制約の最適値と信頼の許す最大値の小さいほうで、信頼が効くときの価格のばらつきは消費者の異質性に依存しない「信頼予算」になる（抄録）。", "fun": "人によって値段を変えると企業はもうかりますが、「不公平だ」と思われると信頼を失います。この論文は、信頼を一種の予算と見なし、その範囲でどこまで値段を変えてよいかを高校数学の2次関数と同じ形で解きました。信頼の「影の価格」が計算できるのが面白い点です。", "unverified": "信頼指標の3つの定式化の詳細は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "3項目UCLA孤独尺度のタキソメトリック分析", "title": "A Taxometric Analysis of the Three-Item UCLA Loneliness Scale in the National Social Life, Health, and Aging Project", "url": "https://doi.org/10.31234/osf.io/mvuxd_v1", "authors": "Savannah M. Boyd ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Boyd, S. M., & Sbarra, D. (2026). A Taxometric Analysis of the Three-Item UCLA Loneliness Scale in the National Social Life, Health, and Aging Project. https://doi.org/10.31234/osf.io/mvuxd_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "高齢者の孤独（3項目UCLA尺度）が、孤独な人とそうでない人に分かれる類型か、連続量かをタキソメトリック分析で検証した（抄録）。", "p3": "米国の公開データNSHAPの3時点を使った事前登録の二次分析で、MAMBAC・MAXEIG・L-Modeと比較曲線適合指数（CCFI）を用いた（抄録）。", "p5": "各時点のCCFIは0.45未満（0.23〜0.35）で、孤独は明確な区切りのない連続的な分布と判断された（抄録）。", "fun": "「孤独な人」と「孤独でない人」ははっきり分かれるのか、それとも身長のように連続的に分布するのか。この研究は統計的な判定法で、少なくともこの尺度では連続的だと示しました。もしそうなら、ある点数で線を引いて孤独な人を数えるやり方には注意が必要になります。", "unverified": "各時点の標本数は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "親の認知症診断が成人した子に与える因果効果", "title": "The Hidden Toll of Parental ADRD: Causal Effects on Adult Children&nbsp;", "url": "https://doi.org/10.2139/ssrn.7578338", "authors": "Javier Adrian Lopez Artero", "venue": "SSRN", "date": "2026-10-08", "apa": "Lopez Artero, J. A. (2026). The Hidden Toll of Parental ADRD: Causal Effects on Adult Children&nbsp; https://doi.org/10.2139/ssrn.7578338", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "親の認知症診断が成人した子の介護・就業・抑うつに与える因果効果を推定した（抄録）。", "p3": "米国HRSの16回分の隔年調査で、診断時期の違いを使う準実験デザインを用いた（抄録）。", "p5": "診断で子の介護は1回の調査期間あたり150時間、配偶者は58時間増え、完全退職は8.6ポイント増、就業は6.9ポイント減、抑うつ症状は0.08標準偏差増えた。娘は息子より175時間多く介護を増やした（抄録）。", "fun": "親が認知症と診断されると、子どもの生活はどれだけ変わるのか。この研究は診断のタイミングの違いを「自然の実験」として使い、介護時間の増加と仕事からの離脱を数字で示しました。娘のほうが息子よりはるかに多く介護を担うという差も、データではっきり現れています。", "unverified": "推定の識別仮定の詳細は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "世代間支援の軌跡と中高年の機能制限", "title": "Multidimensional trajectories of intergenerational support and subsequent functional limitations among middle-aged and older adults in China: A population-based cohort study", "url": "https://doi.org/10.21203/rs.3.rs-11045344/v1", "authors": "Ping Wang ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Wang, P., & Tao, C. (2026). Multidimensional trajectories of intergenerational support and subsequent functional limitations among middle-aged and older adults in China: A population-based cohort study. https://doi.org/10.21203/rs.3.rs-11045344/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "成人した子との金銭・世話・交流のやり取りの長期パターンが、中高年のその後の生活機能の制限と関連することを示した（抄録）。", "p3": "中国CHARLSの45〜85歳12,769人について、2011〜2015年の6指標を集団ベースの多軌跡モデルで分類し、2018年のIADL・ADLとの関連を回帰で推定した（抄録）。", "p5": "5つの軌跡が見つかり、多面的な交流が安定した群に比べ、他の群はIADLが高く（制限が多く）、金銭の互酬が増え交流が少ない群で平均差0.67（95%CI 0.46–0.87）。ADLの差は多重比較の補正後に有意でなかった（抄録）。", "fun": "親子のつながりを「仕送り」「手伝い」「連絡」と別々に見るのではなく、その組み合わせが年とともにどう変わるかを追った研究です。お金のやり取りだけが増えて交流が減る家庭では、買い物や家事などの生活機能がより衰えていました。つながりの中身が大事だという示唆です。", "unverified": "軌跡の命名基準と効果の因果性は未確認（観察研究）。"}}, {"id": "pr40", "rank": 40, "headline": "英国の与えられた絆と選んだ絆と政治行動", "title": "Given and Chosen Ties: Status, Personal Networks, and Political Behaviour in Britain", "url": "https://doi.org/10.31235/osf.io/emvf6_v1", "authors": "Giacomo Melli", "venue": "SocArXiv", "date": "2026-10-08", "apa": "Melli, G. (2026). Given and Chosen Ties: Status, Personal Networks, and Political Behaviour in Britain. https://doi.org/10.31235/osf.io/emvf6_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "英国で、家族（与えられた絆）と友人・配偶者（選んだ絆）の社会的地位が、本人の投票・政治関心・政党選択と関連することを示した（抄録）。", "p3": "英国家計パネル調査（BHPS）のエゴネットワークを使い、4回の総選挙について、つながりの相手の地位と政治行動の関連を分析した（抄録）。", "p5": "地位の同類性は友人で最も強く、出身家族は選んだ絆と同程度に関連した。2段先の相手の地位も本人の投票と関連した。1992〜2005年に、地位の環境は投票者と棄権者をより分け、労働党と保守党の支持者は分けなくなった（抄録）。", "fun": "人が投票に行くかどうかは本人の収入や学歴だけでなく、周りにどんな人がいるかでも変わります。この研究は「友達の友達」の地位まで投票と関係していることを示しました。社会の分断が、政党の対立よりも「投票する人としない人」の間で広がったという見方は興味深い点です。", "unverified": "関連の大きさの数値は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "確率的物理情報ニューラルセルオートマトンで交通流を学習", "title": "Learning Traffic Flow Dynamics with Stochastic Physics-Informed Neural Cellular Automata", "url": "https://arxiv.org/abs/2610.09946", "authors": "Federica Bragone ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Bragone, F., & Barreau, M. (2026). Learning Traffic Flow Dynamics with Stochastic Physics-Informed Neural Cellular Automata (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09946", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "車の総数の保存を構造的に保証するニューラル・セルオートマトン（PI-NCA）で、交通流の局所ルールをデータから学習した（抄録）。", "p3": "道路のつながりと整合し車両数を保存するネットワーク構造を設計し、確率的な遷移ルールにも拡張した。Nagel-Schreckenberg型とKerner-Klenov-Wolf型のセルオートマトンで作ったシナリオで評価した（抄録）。", "p5": "PI-NCAは両方の交通モデルの動きを学習し、標準のNCAを一貫して上回った。確率的拡張も物理的な制約を保った（抄録）。", "fun": "渋滞は「前が詰まっていたら止まる」という簡単なルールの積み重ねでも再現できます。この研究は、そのルールをニューラルネットに学ばせつつ「車が勝手に消えたり増えたりしない」という保存則を設計に組み込みました。物理の決まりを守らせることで、学習したルールが現実離れしないようにする工夫です。", "unverified": "性能差の数値は抄録になく未確認。"}}, {"id": "pr42", "rank": 42, "headline": "都市形態の非線形応答から局所的な炭素排出ゾーンを設計", "title": "Translating nonlinear urban morphology responses into local carbon emission zones: Evidence from residential and transport CO2 emissions in Guangzhou", "url": "https://doi.org/10.2139/ssrn.7578605", "authors": "wennuo qu ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "qu, w., Huang, G., & Yan, Y. (2026). Translating nonlinear urban morphology responses into local carbon emission zones: Evidence from residential and transport CO2 emissions in Guangzhou. https://doi.org/10.2139/ssrn.7578605", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "広州で、都市形態と住宅・交通CO2排出の非線形関係から、計画に使える「局所炭素排出ゾーン」を区分する枠組みを示した（抄録）。", "p3": "2024年EDGARの排出を1 kmメッシュで9つの形態指標と結び、4つの木系モデルを空間交差検証で比較し、SHAPで反応の転換点を求めた（抄録）。", "p5": "XGBoostが最良（空間CVのR²=0.433、独立テスト0.658）。建物容積率3.572、建物密度20.236%、道路密度16.701 km/km²に転換点があり、8類型・4計画区分（48.89%、25.13%、18.06%、7.92%）に分けた（抄録）。", "fun": "建物を高く密にすると排出はどう変わるか。答えはまっすぐな比例ではなく、ある値を超えると効き方が変わる「曲がり角」があります。この研究はその曲がり角を見つけ、地図を区分して「この地区ではこの対策」と計画に落とし込める形にしました。", "unverified": "転換点の信頼区間は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "AIを介した組織の分散的アルゴリズム権威", "title": "Distributed Algorithmic Authority: A Conceptual Framework for Understanding Leadership Influence and Accountability in AI-Mediated Organisations", "url": "https://doi.org/10.2139/ssrn.7578540", "authors": "Swati Haridas Deshani ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Deshani, S. H., & Agrawat, Dr. P. (2026). Distributed Algorithmic Authority: A Conceptual Framework for Understanding Leadership Influence and Accountability in AI-Mediated Organisations. https://doi.org/10.2139/ssrn.7578540", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIが組織の意思決定に入り込むとき、影響力が管理職・アルゴリズム・規則・データ基盤・従業員に分散する「分散的アルゴリズム権威（DAA）」の概念を提案した（抄録）。", "p3": "アルゴリズム管理やアルゴリズム的リーダーシップと区別し、成立条件（決定の中心性、処方の強さ、依存、上書き能力の限界）と仮説を整理した概念研究。宿泊業を文脈とした（抄録）。", "p5": "実証はない。実質的な影響力は分散するのに形式上の責任は人間の管理職に集中する「権限と責任の乖離」を主な含意とした（抄録）。", "fun": "AIが勤務表や評価を決めるようになると、「誰が決めたのか」が曖昧になります。この論文は、決める力はシステム全体に広がるのに、責任だけは名前のある上司に残るというずれに注目しました。現場の判断が大事な接客業でこのずれが特に表に出るという指摘です。", "unverified": "命題は未検証。"}}, {"id": "pr44", "rank": 44, "headline": "静かな退職の集団主義・個人主義比較", "title": "Shared Disengagement, Different Expressions: Quiet Quitting In Collectivist And Individualist Workplace", "url": "https://doi.org/10.21203/rs.3.rs-10033300/v1", "authors": "Anum Atiq ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Atiq, A., Sullman, M., Apostolou, M., & Lajunen, T. (2026). Shared Disengagement, Different Expressions: Quiet Quitting In Collectivist And Individualist Workplace. https://doi.org/10.21203/rs.3.rs-10033300/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "「静かな退職」をパキスタンと米国の従業員で比べ、全体の水準は同じでも表れ方が違うことを示した（抄録）。", "p3": "601人（パキスタン321人、米国280人）のオンライン横断調査で、Quiet Quitting Scale（離脱・主体性の欠如・意欲の欠如）をt検定で比較した（抄録）。", "p5": "全体の水準に有意差はなかったが、パキスタンでは主体性と意欲の欠如が高かった。性差はパキスタンだけで見られた。有意な効果はすべて小さかった（抄録）。", "fun": "必要最低限しか働かない「静かな退職」は世界中で話題ですが、国によって中身は同じでしょうか。この調査では、全体の度合いは同じでも、どの面が強く出るかが違いました。同じ言葉でくくられる現象でも、文化によって対策を変える必要があるという示唆です。", "unverified": "標本の代表性は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "個別取引（i-deals）と配慮を集団に移す", "title": "I-Deals and Accommodations: Shifting the Burden from the Individual to the Collective", "url": "https://doi.org/10.2139/ssrn.7577739", "authors": "Paridhi Gupta", "venue": "SSRN", "date": "2026-10-08", "apa": "Gupta, P. (2026). I-Deals and Accommodations: Shifting the Burden from the Individual to the Collective. https://doi.org/10.2139/ssrn.7577739", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "柔軟な働き方を個人の交渉（i-deals）や障害者への合理的配慮に任せるのでなく、組織全体の「集合的柔軟性」として制度化すべきだと論じた概念論文（抄録）。", "p3": "関係的不平等理論、障害の社会関係モデル、資源保存理論を統合し、神経多様な従業員を例に、利用しやすさ・意味・認知・アイデンティティの4つの非対称性を整理した（抄録）。", "p5": "実証はない。個別の取り決めは同僚の反発を招きやすく、ユニバーサルデザインを人事制度に入れることを提案した（抄録）。", "fun": "同じ「在宅勤務にしたい」という希望でも、仕事ができる人の交渉なら特別待遇、障害を理由にすれば配慮と、受け止め方がまったく違います。この論文は、個人が毎回交渉するのではなく、最初から誰でも選べる仕組みにすれば、その不平等も周囲の反発も減らせると主張します。", "unverified": "実証的な検証はない。"}}, {"id": "pr46", "rank": 46, "headline": "更年期が13か国で燃え尽きと就労中断を左右", "title": "Hidden in Plain Sight; Menopause as a Global Determinant of Burnout and Workforce Disruption: A Mixed-Methods Analysis from Thirteen Countries in MARIE WP2a", "url": "https://doi.org/10.20944/preprints202609.2711.v1", "authors": "Gayathri Delanerolle ほか", "venue": "Preprints.org", "date": "2026-10-08", "apa": "Delanerolle, G., Madan-Aggarwal, I., Pathiraja, V., Eleje, G. U., Toh, T. H., Rathnayake, N., Tweneboah-Koduah, F., Afful-Minta, N., Mudalige, T., Sun, J., Dhanarisi, J., Al-Kharusi, L., Al-Riyami, N., Mbwele, B., Ikwuka, D. C., Wang, X., Mitra, P. K., Muhammad, I., Kareem, R., et al. (2026). Hidden in Plain Sight; Menopause as a Global Determinant of Burnout and Workforce Disruption: A Mixed-Methods Analysis from Thirteen Countries in MARIE WP2a. https://doi.org/10.20944/preprints202609.2711.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "13か国の40〜65歳の女性で、更年期が燃え尽きと就労に与える影響を量的・質的に分析した（抄録）。", "p3": "MARIE WP2aの5,133人の横断コホートで、BAT-12による燃え尽きを線形混合効果モデルで分析し、各国のインタビューを主題分析で統合した（抄録）。", "p5": "燃え尽きは中程度（BAT-12の平均2.41、SD 0.84）で、疲弊と認知面の障害が目立った。現在の専門分野での経験1〜5年の人や障害・長期疾患のある人で高く、国による違いが大きかった（抄録）。", "fun": "更年期は多くの働く女性が経験しますが、職場の問題として語られることは少ないままです。13か国の調査は、症状そのものに加えて、融通のきかない勤務や話しにくさが燃え尽きを強めることを示しました。個人の健康の問題を職場の設計の問題として捉え直す視点です。", "unverified": "横断データのため因果関係は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "ニューラル縮約モデルの誤差分解と信頼性指標", "title": "Empirical Error Decomposition and Reliability Indicators for Neural Reduced-Order Models of Parametric PDEs", "url": "https://doi.org/10.5281/zenodo.23220290", "authors": "Oduro Boafo ほか", "venue": "Zenodo", "date": "2026-10-07", "apa": "Oduro Boafo, R., OSEI ANTOBRE, B. I. S. M. A. R. K., Awuah, I. K., & Appiah, G. (2026). Empirical Error Decomposition and Reliability Indicators for Neural Reduced-Order Models of Parametric PDEs. Zenodo. https://doi.org/10.5281/ZENODO.23220290", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "パラメータ付き偏微分方程式のニューラル縮約モデルの誤差を、POD射影の誤差とニューラル予測の誤差に分解し、信頼性指標を作る枠組みを示した（抄録）。", "p3": "状態誤差、POD射影誤差、縮約座標のニューラル予測誤差、経験的な信頼性指標をパラメータ領域ごとに数値実験で評価した（抄録）。", "p5": "結果の数値は抄録に記載がない（抄録）。", "fun": "複雑なシミュレーションを速く近似する縮約モデルでは、誤差が「要素の選び方」と「その係数の予測」の2か所から入ります。この論文は、その2つを分けて測ることで、どこを改善すればよいかを見えるようにしようとしています。審査のない置き場の論文で、詳細はこれからの確認が必要です。", "unverified": "対象のPDEと結果の数値は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "離散微分幾何で大変形薄肉構造の相場破壊を解く", "title": "Phase-Field Fracture Simulation of Highly Deformable Thin Structures via a Discrete Differential Geometry Framework", "url": "https://arxiv.org/abs/2610.08997", "authors": "Bohan Zhang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Zhang, B., Wang, B., Ouyang, H., Wu, Z., Zhou, Y., & Huang, W. (2026). Phase-Field Fracture Simulation of Highly Deformable Thin Structures via a Discrete Differential Geometry Framework (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08997", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大きく変形する薄い構造の破壊を、離散微分幾何（DDG）とフェーズフィールド法を一体にした枠組みで解いた（抄録）。", "p3": "三角形メッシュの中面の幾何量で膜・曲げ弾性を定式化し、同じ面上にき裂の場を置いて交互解法で解き、ほぼ破壊した要素を除去して位相を再構成した（抄録）。", "p5": "2次元の面内破壊は幾何学的非線形FEMとよく一致し、3次元の引き裂きでは平行なき裂の収束・合体を再現した。柔軟エレクトロニクスの島-橋構造でスナップスルーと破壊の連成を捉えた（抄録）。", "fun": "紙を引き裂くとき、紙が曲がったりねじれたりすることでき裂の進み方が変わります。この研究は、曲がる形とき裂の進展を同じ幾何学の言葉で同時に計算できるようにしました。2本のき裂が近づいて1本になる様子まで再現できるのが見どころです。", "unverified": "FEMとの一致の定量値は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "拡張深層エネルギー法による熱-力学き裂進展", "title": "An extended deep energy method for thermo-mechanical crack propagation", "url": "https://arxiv.org/abs/2610.09433", "authors": "Han Zhang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Zhang, H., Alamdari, M. M., Shahbodagh, B., Vahab, M., Anitescu, C., Rabczuk, T., & Atroshchenko, E. (2026). An extended deep energy method for thermo-mechanical crack propagation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09433", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "熱伝導と熱応力によるき裂進展を、き裂を鋭い折れ線のまま扱う拡張深層エネルギー法で解いた（抄録）。", "p3": "温度と変位の2つのネットワークに、き裂で不連続な埋め込み関数を入力し、先端近傍をWilliams展開で富化して、伝導汎関数と熱弾性ポテンシャルを交互に最小化した。応力拡大係数は相互積分で求めた（抄録）。", "p5": "静止した熱エッジき裂の応力拡大係数は既報値と0.11%で一致し、傾斜機能材のせん断試験ではき裂発生が独立のFEM解と1荷重ステップ以内で一致、十字試験片のき裂経路も既報と一致した（抄録）。", "fun": "熱でひび割れが進む現象は、温度の分布とひびの形が互いに影響し合うので計算が難しい問題です。この研究はニューラルネットに「ここで値が飛ぶ」という情報を与えることで、ひびをぼかさずに鋭いまま扱いました。既知の解と0.11%で一致したのは、新しい解法として心強い結果です。", "unverified": "計算コストの比較は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "衝撃が支配する問題の自己適応型モデル縮約", "title": "Self-Adaptive Model-Order Reduction for Shock-Dominated Problems", "url": "https://doi.org/10.2139/ssrn.7583163", "authors": "Ali Mohaghegh ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Mohaghegh, A., & Huang, C. (2026). Self-Adaptive Model-Order Reduction for Shock-Dominated Problems. https://doi.org/10.2139/ssrn.7583163", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "衝撃波が支配する流れで、適応型と静的な縮約モデルをその場で切り替える自己適応型のモデル縮約の枠組みを示した（抄録）。", "p3": "解の局所的な性質に応じて、基底を更新する適応型ROMと固定の静的ROMのどちらを使うかを動的に決める。回転デトネーションエンジンで評価した（抄録）。", "p5": "効率と精度の両立を目指すが、定量的な結果は抄録に記載がない（抄録）。", "fun": "計算を軽くする縮約モデルは、衝撃波のように場所が動く現象が苦手です。毎回作り直せば正確ですが重くなります。この研究は、必要なときだけ作り直し、それ以外は固定のモデルで走るという「いいとこ取り」をその場で判断させようとしています。", "unverified": "精度と速度の数値は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "逆関数が閉形式の需要モデルで線形IV推定", "title": "Demand Models for Market-Level Data with Closed-Form Inverses", "url": "https://arxiv.org/abs/2610.10069", "authors": "Julien Monardo ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Monardo, J., Fosgerau, M., & de Palma, A. (2026). Demand Models for Market-Level Data with Closed-Form Inverses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10069", "why": "市場シェアの逆関数を生成する仕組みでロジットより豊かな代替パターンを線形操作変数回帰で推定でき、需要推定の実務を大きく簡単にしうる。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "クラスタ内依存に頑健な予測駆動推論", "title": "Cluster-Robust Prediction-Powered Inference", "url": "https://arxiv.org/abs/2610.09601", "authors": "David Broska ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Broska, D., & Howes, M. (2026). Cluster-Robust Prediction-Powered Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09601", "why": "機械学習の予測とラベル付きデータを組み合わせる推論を、部分的にラベル付きのクラスタにも閉形式の標準誤差で拡張した。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "AI農業アドバイザーの無作為化実験（フィリピン・インド）", "title": "AI Advisory for Smallholder Farmers: A Randomized Field Experiment in the Philippines and India", "url": "https://doi.org/10.2139/ssrn.7572761", "authors": "Ali Aouad ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Aouad, A., Sungu, A., Taneri, N., & Ucel, C. (2026). AI Advisory for Smallholder Farmers: A Randomized Field Experiment in the Philippines and India. https://doi.org/10.2139/ssrn.7572761", "why": "1,935人の小規模稲作農家での事前登録RCTで、生成AIチャットボットの助言が営農実践に与える因果効果を検証した。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "信号が弱い実験での方策学習", "title": "Policy Learning with Weak Signals", "url": "https://arxiv.org/abs/2610.10167", "authors": "Benedikt Koch ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Koch, B., Chou, W., Bibaut, A., & Kallus, N. (2026). Policy Learning with Weak Signals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10167", "why": "信号雑音比が小さい大規模実験で最適方策が一般には学習できないことを示し、滑らかさの下での適応的方策を導いてNetflixの実験で示した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "RLVRで探索と最適化を分ける", "title": "Decoupling Exploration from Optimization in RLVR", "url": "https://arxiv.org/abs/2610.10536", "authors": "Saif Punjwani ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Punjwani, S., & Goldblum, M. (2026). Decoupling Exploration from Optimization in RLVR (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10536", "why": "新規性報酬で探索する方策と、それを蒸留する学生方策を分ける枠組みで、推論強化学習の品質劣化を避ける。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "大きなLLMほどハードウェア故障に強くなる", "title": "Fault-tolerant foundation models", "url": "https://arxiv.org/abs/2610.10311", "authors": "Trevor McCourt ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "McCourt, T., Fiete, I. R., & Chuang, I. L. (2026). Fault-tolerant foundation models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10311", "why": "4万GPU時間の故障模擬学習から修正スケーリング則を導き、LLMが誤り訂正符号のように計算する可能性を示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "価格差別の消費者厚生を顕示選好で評価", "title": "Price Discrimination and Revealed Consumer Welfare", "url": "https://arxiv.org/abs/2610.10172", "authors": "Jo\\~ao Thereze (Fuqua School of Business ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Thereze, J., & Vaidya, U. (2026). Price Discrimination and Revealed Consumer Welfare (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10172", "why": "需要曲線も独占企業の情報も知らずに、価格と数量の観測から消費者余剰の変化の鋭い上下限を導いた。"}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "国際共同研究で多数派国と少数派国のどちらが率いるか", "title": "Leadership from the Majority or the Minority? Country-Based Leadership Positions and Team Performance in International Scientific Collaboration", "url": "https://doi.org/10.2139/ssrn.7578006", "authors": "Chenwei Zhang ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Zhang, C., Liu, M., Yang, Y., Zhao, Y., & Wang, Y. (2026). Leadership from the Majority or the Minority? Country-Based Leadership Positions and Team Performance in International Scientific Collaboration. https://doi.org/10.2139/ssrn.7578006", "why": "大規模書誌データで、リーダーの国の構造的位置とチーム構成・被引用の関係を分析した。"}, {"id": "pn09", "rank": 9, "field": "教育", "headline": "家庭のSESと達成動機の関連はr=0.10（PISA20年分）", "title": "The Association Between SES and Students’ Achievement Motivation in Secondary School: An Individual Participant Data Meta-Analysis Spanning Two Decades of PISA Data", "url": "https://doi.org/10.31234/osf.io/ecsg7_v3", "authors": "Sarah Grünthal ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Grünthal, S., Keller, L., Kretschmann, J., Dumont, H., & Brunner, M. (2026). The Association Between SES and Students’ Achievement Motivation in Secondary School: An Individual Participant Data Meta-Analysis Spanning Two Decades of PISA Data. https://doi.org/10.31234/osf.io/ecsg7_v3", "why": "92か国・約358万人の個票メタ分析で、社会経済的地位と学習動機の関係が小さいことを示した。"}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "オフライン評価だけでLLM製品を出せるのはいつか", "title": "When Can You Ship on Evals Alone? Trial-Level Surrogacy for Offline Evaluation of LLM Systems", "url": "https://arxiv.org/abs/2610.10142", "authors": "M{\\aa}rten Schultzberg", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Schultzberg, M. (2026). When Can You Ship on Evals Alone? Trial-Level Surrogacy for Offline Evaluation of LLM Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10142", "why": "評価の効果がオンラインの効果を予測する「試行レベルの代替性」を定義し、出荷・試験・中止の判断規則を導いた。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "2025年の米国関税は低所得国ほど損失が大きい", "title": "The Unequal Trade War&nbsp;", "url": "https://doi.org/10.2139/ssrn.7576938", "authors": "Jinyuan Qiu ほか", "venue": "SSRN", "date": "2026-10-08", "why": "製品レベルの関税データと貿易モデルで、IEEPA関税の損失が逆進的であることを示した。"}, {"id": "pn12", "rank": 12, "field": "教育", "headline": "コロナ休校は低資源家庭の子の発達格差を広げた", "title": "School Disruptions, Parental Input, and Inequality in Early Childhood Development", "url": "https://doi.org/10.2139/ssrn.7564698", "authors": "Yijuan Chen ほか", "venue": "SSRN", "date": "2026-10-07", "why": "豪州の全数学校調査でDIDとDDDを用い、休校の発達への悪影響と親の関与の役割を示した。"}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "株主との非公開対話が減ると公開開示が増える", "title": "Private Voice and Public Disclosure", "url": "https://doi.org/10.2139/ssrn.7580058", "authors": "Ehsan Poursoleyman", "venue": "SSRN", "date": "2026-10-08", "why": "SECの2025年指針を使った三重差分で、非公開の株主対話と公開開示の代替関係を示した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "空間依存データのための逐次白色化コンフォーマル予測", "title": "Conformal Prediction for Spatially Dependent Data via Sequential Whitening", "url": "https://arxiv.org/abs/2610.10168", "authors": "Ayush Baran Sen ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "校正残差で逐次条件付けして空間依存下の予測区間を効率化し、大規模ネットワークにも近傍近似で拡張した。"}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "線形注意の再帰状態を誤差の寿命と位置で量子化", "title": "STEPQuant: When and Where Errors Matter in Delta-Rule Recurrent State Quantization", "url": "https://arxiv.org/abs/2609.38169", "authors": "Bingchen Yao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "why": "誤差が持続する時間と影響する行に応じて精度を配分する、デルタ則再帰状態の事後量子化法（HF投票94）。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "RBFカーネルのガウス過程の最尤推定の鋭い漸近理論", "title": "Sharp Asymptotic Theory of Maximum Likelihood Estimation for Gaussian Processes with an RBF Kernel", "url": "https://arxiv.org/abs/2610.10080", "authors": "Ameer Qaqish ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "広く使われるガウス過程のハイパーパラメータ推定の漸近的性質を明らかにした理論研究。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "RBFカーネルのガウス過程で、空間分散・長さスケール・ナゲット分散の同時最尤推定量の固定領域漸近理論を初めて完全に与えた（抄録）。", "p3": "観測点が一定の領域内で密になっていく固定領域漸近の下で、強い相関と共分散行列のパラメータへの非線形依存を扱い、一致性と収束率を導いた（抄録）。", "p5": "3つのパラメータすべての一致性・収束率・同時の漸近正規性を示し、その収束率がミニマックス最適であることを証明した（抄録）。", "fun": "ガウス過程は「近い点ほど値が似ている」という性質で予測する道具で、標準ソフトが自動でパラメータを推定します。ところが、同じ範囲で点を細かく増やしたとき推定がどう振る舞うかは、最もよく使われるカーネルでさえ分かっていませんでした。日常的に使う道具の理論的な裏づけが初めてそろったことになります。", "unverified": "具体的な収束率の形は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "スケッチによる共変量シフト下のコンフォーマル予測", "title": "Sketched Calibration for Conformal Prediction under Covariate Shift", "url": "https://arxiv.org/abs/2610.09208", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "重み付きコンフォーマル予測の計算・統計コストを抑える校正法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "共変量シフト下の重み付きコンフォーマル予測で、共変量を圧縮（スケッチ）した比を使い、校正のコストを下げる方法を提案した（抄録）。", "p3": "圧縮した共変量Z=T(X)の尤度比で重み付けし、捨てたシフトが応答の分布変化として再び現れる「漏れ」Δ_Tで被覆率の下限1−α−Δ_Tを与えた（抄録）。", "p5": "不均一分散のシミュレーションで、1次元スケッチは無限大の予測集合の割合を37.8%から8.0%に減らし、目標90%に対し平均被覆率92.3%だった（抄録）。", "fun": "学習時と使う時でデータの傾向がずれると、予測の幅の保証が崩れます。その補正は、ずれが大きいほど急に不安定になります。この研究は、答えに関係しない方向のずれは無視してよいと考え、データを要約してから補正することで、保証をほぼ保ったまま安定させました。", "unverified": "実データでの成否の条件は未確認。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "情報的欠測のある縦断データの因果推論", "title": "Longitudinal causal inference under informative missingness using the self-censoring model", "url": "https://arxiv.org/abs/2610.09234", "authors": "Iv\\'an D\\'iaz", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "測定が患者の状態に依存して欠測する縦断データで、自己打ち切りモデルにより因果効果を識別する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測されるかどうかが観測されない値そのものに依存する縦断データで、修正処置方策の因果効果を識別・推定する方法を示した（抄録）。", "p3": "自己打ち切りモデルとシャドー変数の条件付きモーメント制約を縦断的な因果識別と組み合わせ、再帰的な識別式と、機械学習を使えるクロスフィッティング推定量を導いた（抄録）。", "p5": "適切な条件の下で推定量は漸近線形でroot-n推論が可能になり、複数の時点で同時推論もできる（抄録）。", "fun": "病院のデータは、具合が悪いときほど受診するので記録が残る、という偏りを持ちます。つまり「記録がない」こと自体が情報です。この研究は、その偏りをモデルに組み込みながら治療方針の効果を推定する道筋を示しました。", "unverified": "適用例と数値結果は抄録に記載なく未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "目的変数なしで生存予測モデルを比較する部分識別", "title": "Sharp Partial Identification for Survival Model Comparison Without Target Outcomes", "url": "https://arxiv.org/abs/2610.09658", "authors": "Won Gi Choi ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "対象集団の生存結果がまだない段階で、2つの予測モデルのリスク差の鋭い上下限を求めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "導入先の生存結果がまだない段階で、2つの固定済み生存予測モデルのBrierリスクの差を鋭く部分識別し、採用の判断に使う方法を示した（抄録）。", "p3": "展開時の要約に対する条件付き対数オッズのずれに上限を置くモデルで識別集合を導き、打ち切りデータにはCox型打ち切り推定とIPCW、ブートストラップで同時信頼帯を作った（抄録）。", "p5": "別々に識別して差をとる方法に対する幅の比は1.00〜5.73。非小細胞肺がんの施設間応用では40の評価すべてが保留（DEFER）となった（抄録）。", "fun": "新しい予測モデルを別の病院で使ってよいかは、本来その病院の結果が出るまで分かりません。この研究は「ずれがこの範囲なら」という仮定を置いて、まだ見ぬ結果の下でも言える範囲を最小限の幅で示します。結論が「まだ決められない」になる場合もはっきり出すのが誠実な点です。", "unverified": "感度パラメータの選び方は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "連続行動のバンディットでの統計的推論", "title": "Statistical Inference for Continuous Action Bandits", "url": "https://arxiv.org/abs/2610.09801", "authors": "Raphael C Kim ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "適応的に集めたデータで連続的な処置の効果を推論する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "適応的に集めたデータで連続的な処置（価格や投与量など）の効果を統計的に推論する方法を示した（抄録）。", "p3": "カーネル平滑化した二重頑健推定を、適応的に集めた連続処置のデータへ拡張し、適応重み付き推定量の族の平均二乗誤差率と漸近正規性を導いた（抄録）。", "p5": "推定の下限をリグレットの関数として特徴づけ、効率とリグレットのバランスを考えた実験設計を提案し、シミュレーションで支持した（抄録）。", "fun": "ネット通販が価格を少しずつ変えて一番よい値段を探すと、集まるデータは偏ります。良さそうな価格ばかり試すからです。この研究は、そうした偏ったデータからでも「この価格の効果はこのくらい」と幅つきで言えるようにしました。もうけを追うほど推定が難しくなるという関係も示しています。", "unverified": "シミュレーションの数値は未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "木ごとに回転を入れたベイズ加法回帰木", "title": "RoBART: Bayesian Additive Regression Trees with Tree-Specific Rotations", "url": "https://arxiv.org/abs/2610.10214", "authors": "Jeongung Heo ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "軸に沿わない境界を少ない分割で表すRoBARTを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "各木に回転を持たせたベイズ加法回帰木RoBARTで、座標軸に沿わない境界を少ない分割で表せるようにした（抄録）。", "p3": "木ごとにGivens回転の列と分割点をメトロポリス・ヘイスティングスで同時に提案し、可逆性を示した。成分ごとに回転を持つ加法関数について事後収縮率を証明した（抄録）。", "p5": "RoBARTは本質的な次元に適応できるが、軸に沿ったBARTは適応できない関数が存在することを下限で示した（抄録）。", "fun": "決定木は「x<3」のように軸に平行な線でしか区切れないので、斜めの境界を表すには階段状にたくさん区切る必要があります。この研究は木ごとに座標軸を回転させることで、斜めの境界を少ない区切りで表せるようにし、その利点を理論的にも証明しました。", "unverified": "実データでの性能は未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "逐次データの区間検出と偽発見率の制御", "title": "Sequential resetting procedures and false discovery rate", "url": "https://arxiv.org/abs/2610.09339", "authors": "Qiuqi Wang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "順に届く仮説から帰無仮説が崩れる区間を、FDRを制御して特定する方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "順に届くデータの中で帰無仮説が崩れている区間を、偽発見率（FDR）を制御して特定する逐次リセット手順を提案した（抄録）。", "p3": "e値と検定超マルチンゲールに基づく手順と、情報の少ない点を除く改良版を作り、独立な場合と依存のある場合でFDRの上限を導いた（抄録）。", "p5": "FDRの上限は検定期間によらず、一般の場合はいつ止めても有効だが対数の因子が加わる。LLMの電子透かし検出と金融のバックテストに応用した（抄録）。", "fun": "データが次々届く中で「どこからどこまでが異常か」を見つけたいとき、何度も検定すると偶然の当たりが増えてしまいます。この方法は、いつ止めても誤りの割合を保証しつつ区間を切り出します。AIが書いた文章の検出に使えるという応用も現代的です。", "unverified": "応用例の数値結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "パターン認識と段階的推論は連続体の両端", "title": "The Dichotomy Between Pattern Recognition and Step-by-Step Reasoning", "url": "https://arxiv.org/abs/2610.09186", "authors": "Amrut Nadgir ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "次トークンの依存構造からLLMが段階的推論を学ぶ条件を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "パターン認識と段階的推論を連続体の両端と捉え、次トークンが直前の少ない文脈だけに依存するときLLMが段階的推論を学ぶことを示した（抄録）。", "p3": "直前c個のトークンだけに依存する場合、推論の軌跡をDe Bruijnグラフ上の経路として表し、辺の数と軌跡の数を比べた。Qwen2.5-1.5B-Instructを方程式と物語の質問で微調整して検証した（抄録）。", "p5": "辺の数は軌跡の数に比べて無視できるほど少なく、必要な学習サンプル数は辺の数のべき乗則に従った。頻繁な状態（小さいc）は精度を上げるが、テスト時の撹乱に弱くなった（抄録）。", "fun": "計算の途中経過を書かせるとAIの正答率が上がるのはなぜか。この論文は、途中の「状態」を書くことで、次の一手が直前の少しの情報だけで決まるようになり、短い手順の組み合わせで長い問題を解けるようになるからだ、とグラフの言葉で説明しました。", "unverified": "大規模モデルでの再現は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "表形式基盤モデルの遡及的推論", "title": "Thinking in Depth: Retrospective Inference for Tabular Foundation Models", "url": "https://arxiv.org/abs/2610.10317", "authors": "Hao-Run Cai ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "表形式基盤モデルの推論時の計算を深めて予測を改善する手法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式基盤モデルの予測の改善が後半の層に偏ることを見つけ、途中の層の情報を後で振り返って再利用する「遡及的推論」のモデルRetroを提案した（抄録）。", "p3": "深さ方向の寄与を適応的に重み付けするAttention Residualsと、問い合わせごとに注意の出力を要素単位で調整するGated Attentionを組み合わせた（抄録）。", "p5": "Retroは予測の改善をより早い層に広く分散させた。TabArena、TALENT、RelArenaで評価した（順位の詳細は抄録の途中までしか読めず）（抄録）。", "fun": "表のデータを読むAIは何層も重ねた計算で答えを磨きますが、実際に答えが良くなるのは最後の数層に集中していました。この研究は、後の層が前の層のメモを読み返せるようにすることで、途中の計算も無駄にしない設計にしました。", "unverified": "ベンチマークでの順位・数値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "自己進化する推論モデルの崩壊を問いの質から防ぐ", "title": "Questioning the Questions: Sustaining Self-Evolution in Reasoning Models", "url": "https://arxiv.org/abs/2610.04299", "authors": "Jinyuan Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "why": "自分で作った問題で学ぶ推論モデルが劣化する原因を分析し、持続させる方法を示した（HF投票60）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "自分で作った問題で学ぶ推論モデルが回を重ねて崩壊する原因を突き止め、問題の妥当性と新規性のフィードバックで自己進化を持続させるR-Questを提案した（抄録）。", "p3": "崩壊の原因として、解けない不正な問題の増加と、表現が違うだけの同じ数学問題の繰り返しを特定した。解答者に不正な問題を見抜かせ、その判断で出題者の報酬と学習データを選別し、固定した基盤モデルで問題対の新規性を判定した（抄録）。", "p5": "数学推論・一般推論・コード生成の12ベンチマークで2系統のモデルとも平均性能が最高で、10回の自己進化を通じて安定して伸び、最終回で最高になった（抄録）。", "fun": "自分で問題を作って自分で解くAIは、そのうち変な問題や似た問題ばかり作って伸びなくなります。この研究は、AIに「これは問題として成り立っていない」「前と同じだ」と判断させ、出題の質を保つことで成長を続けさせました。良い問いを立てる力が学びを支えるという話です。", "unverified": "ベンチマークごとの数値は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "再帰ループ型Transformer", "title": "Recurrent Looped Transformer", "url": "https://arxiv.org/abs/2610.07591", "authors": "Yifan Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "why": "入力ごとに状態を更新する再帰型の構造で、状態追跡の課題を解く（HF投票23）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "層を並列の因果エンコーダと再帰デコーダに分け、トークンごとに前の状態を引き継ぐRecurrent Looped Transformerで、長い系列の状態追跡を可能にした（抄録）。", "p3": "8層の5通りの分け方を8層の通常Transformerと6つのアルゴリズム課題で、3シードずつ比較した（抄録）。", "p5": "最大40ビットで学習し、2つの分け方は256ビットのパリティを全シードで100%正答（Transformerは偶然水準）。訓練長の8倍のS5置換追跡で97%（Transformerは1%未満）、剰余算で最大93%（同33%）（抄録）。", "fun": "「1が偶数個か奇数個か」を数える問題は、人間には簡単でもTransformerは長い列になると解けません。一つずつ状態を更新するという、昔ながらの再帰的な計算を組み込むだけで、訓練の6倍以上の長さでも完璧に解けたのは印象的な結果です。", "unverified": "自然言語タスクでの効果は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "KL正則化方策最適化の整理", "title": "On KL-Regularized Policy Optimization", "url": "https://arxiv.org/abs/2610.08963", "authors": "Yifan Zhang", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "why": "非同期強化学習で古い方策から生成した軌跡を使う際のKL正則化を理論的に整理した（HF投票19）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "非同期の強化学習で古い方策が生成した軌跡を使うとき、KL正則化を生成側に固定することで、重要度重みも批評家も使わずに更新できるKLPOを提案した（抄録）。", "p3": "正則化した改善ステップの閉形式のギブス解を使い、その対数比の最適性条件を生成側の軌跡で最小二乗にあてはめた。切片を消して対数分配関数を回避した（抄録）。", "p5": "終端の報酬から批評家なしで勾配を計算でき、KL項の独立なモンテカルロ推定で勾配が不偏であることを示した。SPPO、GPO、REBEL、BPOが特殊例になる（抄録）。", "fun": "AIエージェントの強化学習では、学習中の自分と少し前の自分が作ったデータの食い違いが問題になります。この論文は、基準点を「データを作った側」に置き直すことで、補正の重みを使わずに済む式を導きました。既存の複数の手法が同じ式の特殊例として整理できるのも見通しの良さです。", "unverified": "実験での性能比較は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "世界-行動モデルの文脈を長くする", "title": "Long-WAM: Scaling the Context of World-Action Models", "url": "https://arxiv.org/abs/2610.10528", "authors": "Wei Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "why": "ロボット制御で長い視覚履歴を遅延なく使うためのモデルとシステムの設計（HF投票84）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "ロボットの世界-行動モデルで、自己回帰的に事前学習した動画基盤を使うと長い視覚履歴が成功率の向上に結びつくことを示し、リアルタイムで動くLong-WAMを作った（抄録）。", "p3": "行動ラベルのないロボット・一人称動画で因果的な予測を学び、その構造を保ったまま行動に適応させた。ストリーミング符号化と非同期実行で実機に載せた（抄録）。", "p5": "RoboCasa GR-1で文脈を0から19.2秒に延ばすと成功率は63.3%から78.7%に上がったが、双方向に事前学習した初期値では向上しなかった。RTX 5090で1回の行動生成は107.4 ms、動的なカップ積みは95%成功（比較の2手法は20回中0回）（抄録）。", "fun": "ロボットに過去の映像を長く見せれば賢くなりそうですが、実際には「見られる」ことと「活かせる」ことは別でした。過去から未来を予測する形で動画を学んでおくと、長い履歴が初めて役に立ったというのが核心です。人も経験を未来の予測に結びつけてこそ使えるのと似ています。", "unverified": "各ベンチマークの数値の詳細は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "関税が自国の厚生を高めるのはいつか：200年の事例", "title": "When Does a Tariff Pay? Theory, Two Centuries of Episodes, and the American Experiment of 2025-26", "url": "https://doi.org/10.2139/ssrn.7574118", "authors": "Anirban Majumdar", "venue": "SSRN", "date": "2026-10-07", "why": "一つの会計恒等式で関税の厚生条件と過去の事例の頻度を整理した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "関税が課す国の厚生を高めるのはどんな条件か、それが歴史上どれだけ成り立ったかを、1つの会計恒等式から整理した（抄録）。", "p3": "単一輸入市場の線形モデルで厚生変化を交易条件の利益と死荷重に分解し、関税収入・投入費用・報復・市場の失敗を加えた「厚生の帳簿」で14の命題を示し、1930年代から2025〜26年までの24の事例を同じ基準で採点した（抄録）。", "p5": "24事例のうち総合で「上げた」とされたものはなく、9つが「下げた」、9つが「混合」だった。2025〜26年はドルが7.75%下落し実効関税率が上がった（抄録）。", "fun": "関税で国が得をするのは、輸入品を安く買いたたける（交易条件が良くなる）分が、高い値段で買い控えが起きる損を上回るときだけです。この論文は、その単純な帳簿で200年分の関税の事例を採点し、明確に得をした例がなかったと示しました。", "unverified": "「混合」以外の残り事例の分類は抄録が途中で切れており未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "熟練労働者の残留は新規雇用を締め出すか", "title": "Gray Areas: How Does Retaining Experienced Workers Crowd Out New Ones?", "url": "https://doi.org/10.2139/ssrn.7572760", "authors": "Maria Zhu ほか", "venue": "SSRN", "date": "2026-10-07", "why": "企業の年齢構成と若年採用の関係を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "熟練した年長者が多く残る企業では、若手の昇進が詰まり定着率が下がることを示した（抄録）。", "p3": "生産上の必要と年齢構成・昇進の混雑・定着を結ぶモデルを作り、Revelioの雇用者-被雇用者データで検証した。退職誘因の予期せぬ変化で労働需要と無関係な高齢化の効果を分離した（抄録）。", "p5": "抽象的な技能への依存が大きい企業ほど年齢構成が上に厚く、若手は昇進見通しが弱く満足度と定着率が低かった。企業特殊的な技能を育てる若手向けのキャリア開発は、この問題を和らげた（抄録）。", "fun": "ベテランが辞めずに残ってくれるのは会社にとってありがたい反面、上のポストが空かず若手が伸び悩みます。この研究は、その「詰まり」が若手の離職につながることをデータで示し、会社独自の技能を育てる研修が対策になることも示しました。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "インフレ目標は企業のマークアップ拡大を抑えるか", "title": "Does Inflation Targeting Restrain Sellers' Inflation? Firm-Level Evidence from 52 Countries", "url": "https://doi.org/10.2139/ssrn.7583699", "authors": "Jorge Sepúlveda Velásquez ほか", "venue": "SSRN", "date": "2026-10-08", "why": "52か国の企業データで、金融政策の枠組みとインフレ時の価格設定の関係を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "インフレ目標政策の国では、インフレ時に企業が利幅を広げる「売り手インフレ」が抑えられるかを52か国の企業データで検証した（抄録）。", "p3": "2000〜2024年の非金融上場企業4,687社のパネルで、固定効果とDriscoll-Kraay標準誤差、傾向スコアマッチング、段階的DIDを組み合わせた（抄録）。", "p5": "収益性のインフレ感応度はインフレ目標国とそれ以外で有意に違わなかった。段階的DIDでは導入後にROA・ROE・売上高利益率が約1.7・3.5・3.5ポイント高かったが、EBITDAマージンには差がなかった（抄録）。", "fun": "物価が上がるとき、企業が便乗して値上げ幅を大きくするのでは、という議論があります。中央銀行がインフレ率の目標を掲げる国ではそれが抑えられるかを調べると、インフレへの反応に差はありませんでした。一方で目標導入後に利益率が上がっていたという、予想と別の発見があります。", "unverified": "利益率上昇の要因は抄録が途中で切れており未確認。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "コピュラの構造変化を平滑検定で検出", "title": "Detecting Copula Structural Changes: A Smooth Testing Approach", "url": "https://arxiv.org/abs/2610.09351", "authors": "Shiyao Huang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "多変量動学モデルの誤差コピュラの構造変化を検定する方法を開発した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多変量動学モデルの誤差の依存構造（コピュラ）が途中で変わったかを、ブートストラップも帯域幅選択も不要な平滑検定で調べる方法を開発した（抄録）。", "p3": "コピュラが一定であることからのずれを一般化フーリエ係数で表し、それらの同時有意性を検定した。展開次数はデータから自動で選ぶ（抄録）。", "p5": "推定した残差を使っても検定量は漸近的にχ²分布に従い（オラクル性）、局所対立仮説に対して非自明な検出力を持つ。為替と株式収益率に応用した（抄録）。", "fun": "株や為替は、平常時と危機時で「一緒に動く度合い」が変わります。この研究は、その連動の仕方そのものがいつ変わったかを見つける検定を、重い再計算なしでできるようにしました。危機の前後でリスクの測り方を切り替える根拠になります。", "unverified": "応用結果の詳細は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "マクロ経済に関係する気候指数を集合VARで作る", "title": "Building Macroeconomically Relevant Climate Indices via the Assemblage VAR", "url": "https://arxiv.org/abs/2610.10043", "authors": "Christophe Barrette ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "気候指数の構成と構造推論を同時に扱うVARを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "マクロ経済に関係する気候指数の構成を、VARの尤度利得を最大にするよう重みごと推定する「Assemblage VAR」を提案した（抄録）。", "p3": "非負の集計重みとVARのパラメータを同時に推定し、成分空間と順位空間の2つの版を作り、米国のActuaries Climate IndexとNOAAの細分データに適用した（抄録）。", "p5": "集計した気候指標を使うVARは、固定重みの基準より大きな景気後退方向のインパルス応答を示した。重みは強風の変数と分布の裾に置かれ、海面水位のようなゆっくりした成分には置かれなかった（抄録）。", "fun": "「気候の悪化」を一つの数字にまとめるとき、気温・風・海面のどれをどれだけ重視するかで結論が変わります。この研究は重みを人が決めず、経済の動きをいちばんよく説明する重みをデータに選ばせました。結果として強風や極端な値が重視されたのは直感にも合います。", "unverified": "インパルス応答の大きさの数値は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "正解のない問いへのLLM評価に表明選好法を使う", "title": "Validity Without Ground Truth: What Stated-Preference Economics Offers the Evaluation of Language Models", "url": "https://arxiv.org/abs/2610.10506", "authors": "Daniel Robert Kling Alexander ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "経済学の表明選好の妥当性概念をLLM評価に持ち込んだ。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "正解のない問いに答えるLLMを、表明選好経済学の妥当性の枠組み（内容・構成概念・基準関連妥当性、信頼性、誘因両立性など）で評価する方法を提案した（抄録）。", "p3": "公表済みの水質の表明選好評価の調査（Vossler et al. 2023）を6つのモデルに回答させ、需要曲線が右下がりか、支払意思額が財の規模や所得に反応するかを検定した（抄録）。", "p5": "検定はモデルを鋭く分け、古い2モデルは世帯所得7万5千ドルで最も基本的な検定に失敗し、最新の2モデルはすべての理論的妥当性の検定に通ったが収束的妥当性では分かれた（抄録）。", "fun": "「きれいな川にいくら払う？」のような問いには正解がありません。経済学者は昔から、答えが理屈に合っているか（値段が上がれば買う量が減るか等）で調査の質を見てきました。その考え方をAIの評価に使うと、新旧のモデルの差がくっきり出たそうです。ただし理屈に合うことは正しいことと同じではない、という注意も添えられています。", "unverified": "モデル名は抄録に記載なく未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "集中型入学選考で確認すべき優先権の申告", "title": "Selective Verification in Centralized Admissions: Which Priority Claims Must Be Checked?", "url": "https://arxiv.org/abs/2610.10131", "authors": "Varun Bansal ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "すべての申告を確認せずに公正を保つ選択的確認の設計を理論的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "集中型の入学選考で、自己申告の優先権（居住地・兄弟・所得）のうち、結果を変えうるものだけを確認すれば、全件確認と同じ結果を保てることを示した（抄録）。", "p3": "申告が学校の合格ラインを越えさせうるかの正確で簡単な判定を与え、学校の暫定選択を変えうる場合だけ確認する方針を受入保留方式に組み込んだ（抄録）。", "p5": "全件確認と同じ出願・不合格・配属をすべて再現した。模擬市場では確認件数を事前全件確認より76%、初到達時確認より36%減らした。選好と資格の正直な申告は弱支配戦略だった（抄録）。", "fun": "学校の入学選考で「近所に住んでいる」などの申告を全部確かめるのは大変です。でも結果に影響しない申告は確かめなくてよいはず。この研究は「ファイルではなく決定を確認せよ」という原則で、確認の手間を4分の1にしても結果がまったく変わらない方法を示しました。", "unverified": "実データでの検証はない。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "米中貿易戦争の輸出効果は比較優位で異なる（因果フォレスト）", "title": "Export Effects Shaped by Revealed Comparative Advantage: Causal Forest Evidence from the US-China Trade War", "url": "https://doi.org/10.2139/ssrn.7569358", "authors": "Kang Keun Rhee ほか", "venue": "SSRN", "date": "2026-10-07", "why": "HS8桁の輸出データで効果の異質性を因果フォレストで推定した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米中貿易戦争による中国の対米輸出の減少が、製品ごとの戦前の顕示比較優位（RCA）によって大きく異なることを因果フォレストで示した（抄録）。", "p3": "HS8桁の輸出データを因果フォレストで分析し、変数重要度・最良線形射影・部分依存プロットで異質性の要因を調べ、DIDパネル回帰で確認した（抄録）。", "p5": "RCAが効果の異質性の主因で、RCAが3.5以上になると輸出減少が急に大きくなる非線形の閾値が見られた（抄録）。", "fun": "関税で一番打撃を受けたのは、中国がもともと強かった製品でした。直感とは逆に見えますが、強い製品ほど米国市場への依存が大きく、狙われやすかったとも考えられます。機械学習で「どの製品にどれだけ効いたか」を細かく分けた点が新しいところです。", "unverified": "閾値の頑健性は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "謝礼で所得データの質は上がるか（SIPP）", "title": "The Icing on the Cake&nbsp;The Effects of Monetary Incentives on Income Data Quality in the SIPP", "url": "https://doi.org/10.2139/ssrn.7566461", "authors": "Shalise Ayromloo ほか", "venue": "SSRN", "date": "2026-10-08", "why": "調査の金銭的誘因が無回答と測定誤差に与える効果を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国SIPP調査で、謝礼が所得項目の無回答と測定誤差を減らすかを無作為化実験で検証した（抄録）。", "p3": "2014年SIPPの第1・2波で行われた無作為の謝礼実験を使い、労働所得と投資所得の項目無回答・測定誤差を比べた（抄録）。", "p5": "謝礼を受けた世帯は無回答率が勤労所得で1.3ポイント、社会保障所得で1.5ポイント低く、測定誤差は利子所得で6.31ポイント、配当所得で16.48ポイント低かった（抄録）。", "fun": "アンケートでお礼を渡すと回答者が増えることは知られていますが、答えの「正確さ」まで上がるかは別の問題です。この研究は、お礼を受け取った家庭ほど所得の記入漏れや誤りが減ったことを実験で示しました。特に配当のように思い出しにくい項目で効果が大きかったのが興味深い点です。", "unverified": "測定誤差の定義の詳細は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "顧客の競争戦略が仕入先のコスト構造に浸透する", "title": "Strategy Internalization: Customer Competitive Strategies and Supplier Cost Structure", "url": "https://doi.org/10.2139/ssrn.7581519", "authors": "Rong Huang ほか", "venue": "SSRN", "date": "2026-10-08", "why": "機械学習による戦略分類で、顧客の戦略と仕入先の固定費比率の関係を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "主要顧客の競争戦略（差別化かコストリーダーシップか）が、仕入先の固定費と変動費の比率に反映されることを示した（抄録）。", "p3": "ラベル付き潜在ディリクレ配分（L-LDA）で主要顧客の戦略志向を測り、仕入先のコスト構造との関係を分析した（抄録）。", "p5": "差別化志向の顧客を持つ仕入先は固定費の多い硬直的な構造、コスト志向の顧客を持つ仕入先は柔軟な構造をとり、混雑リスクが高い場合や関係が短い場合などで強まった（抄録）。", "fun": "取引先が「品質で勝負する会社」か「安さで勝負する会社」かで、部品メーカーの設備の持ち方まで変わるという結果です。顧客の戦略が、文章の分析を通じて見えるようになり、それが取引の連鎖をたどって仕入先の費用構造にまで伝わる様子がデータで見えたのが面白い点です。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "ファッションの再販は過剰生産を抑えるか", "title": "Does Fashion Resale Curb Overproduction?", "url": "https://doi.org/10.2139/ssrn.7573578", "authors": "Luyi Gui ほか", "venue": "SSRN", "date": "2026-10-07", "why": "再販が新品購入を置き換えるか追加消費を生むかを分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ファッションの再販市場が過剰生産を減らすかを、消費者の多様性志向を組み込んだ耐久財の再販モデルで分析した（抄録）。", "p3": "耐久財の再販の古典的枠組みに、ファッション特有の「いろいろ着たい」欲求を加え、取引の摩擦、プラットフォームの種類、拡大生産者責任の効果を理論的に検討した（抄録）。", "p5": "摩擦のない再販市場は必ず成立するがファッションの生産を増やす。取引の摩擦（手数料など）がむしろ生産を減らしうる。独立の再販プラットフォームのほうがこの役割に向く（抄録）。", "fun": "古着の売り買いは環境に良いと言われますが、「売れるなら買おう」と新品の購入も増えるかもしれません。この理論研究は、手軽すぎる再販はかえって生産を増やし、適度な手数料がある仲介のほうが環境に良いという逆説を示しました。", "unverified": "実証的な検証はない。"}}, {"id": "pn40", "rank": 40, "field": "経営学", "headline": "誰もがAIを持つときのマーケティング優位", "title": "When Everyone has AI: A Theory of Marketing Advantage under Algorithmic Parity", "url": "https://doi.org/10.2139/ssrn.7575263", "authors": "Adithya Reddy Nalla", "venue": "SSRN", "date": "2026-10-08", "why": "AIが共通基盤になったときに企業の優位がどこから生まれるかの理論。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "競合が同等のAIを使える「アルゴリズム的同等性」の下では、AI導入そのものの優位は薄れ、ブランド・独自データ・信頼など希少な補完資産の価値が上がるという理論を示した（抄録）。", "p3": "5つの補完資産を「差別化資本」と定義し、生成AIでコンテンツは豊富になるが注意は希少になる「合成コンテンツの逆説」を含む8つの反証可能な命題を、様式化モデルから導いた（抄録）。", "p5": "既存の二次的証拠の監査では命題は方向として整合したが、直接検証された例は少なかった。新しい実験データはなく、5つの事前登録研究と2つの新指標を提案した（抄録）。", "fun": "どの会社も同じAIを使えるようになると、AIを使うこと自体はもう強みになりません。この論文は、そのとき差がつくのはブランドや自社だけのデータ、客の信頼といった「AIで作れないもの」だと主張します。作るのが簡単になるほど人の注意が奪い合いになるという逆説も面白い視点です。", "unverified": "命題の実証は今後の課題。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "暗号資産オークションでの公開情報の役割", "title": "The Role of Public Information in Strategic Financial Marketsevidence from Cryptocurrency Auctions", "url": "https://doi.org/10.2139/ssrn.7577260", "authors": "Adrian Casillas", "venue": "SSRN", "date": "2026-10-08", "why": "イーサリアムの一位価格封印入札で私的・公的信号が観測できる利点を使って公開情報の効果を調べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "イーサリアムの採掘の一位価格封印入札データを使い、公開情報が価格に与える効果が主に競争の減少を通じて働くことを示した（抄録）。", "p3": "入札者の私的信号と公的信号が観測できる特徴を生かし、競争が内生的な場合と固定した場合で公開度の効果を比べた（抄録）。", "p5": "競争が内生的なとき、公開度が10ポイント上がると1回あたりの参加者は0.387人減り、価値で標準化した売り手余剰は6.71ポイント下がった。競争を固定すると公開度1ポイント増で余剰は8.14ベーシスポイント上がった（抄録）。", "fun": "情報を公開すれば入札は公正になり、売り手も得をしそうに思えます。ところが実際には、みんなが同じ情報を持つと「どうせ勝てない」と参加者が減り、結果的に値段が下がっていました。参加者の数を固定すると効果の向きが逆になるという、符号の反転がこの研究の見どころです。", "unverified": "データの期間と規模は未確認。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "大規模防災訓練で非公式の情報交換が増える", "title": "Off the record, on the ground: The rise of informal information exchange during a full-scale emergency management exercise", "url": "https://doi.org/10.2139/ssrn.7578306", "authors": "Andrea Bartolucci ほか", "venue": "SSRN", "date": "2026-10-07", "why": "緊急時に公式の指揮系統と並行する非公式の情報交換を観察した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "大規模な防災訓練で、公式の指揮系統と並行して非公式の情報交換が自然に生まれ、現場の調整を担う一方で分断と責任の空白を生むことを示した（抄録）。", "p3": "電子メールの交換の社会ネットワーク分析、質問紙、半構造化インタビューを組み合わせた混合研究法を用いた（抄録）。", "p5": "公式のネットワークは調整役に集中し現場チーム間の直接のやり取りがなかった一方、非公式のネットワークは分散的で密だった。戦略・戦術は公式、現場の調整は即座に非公式ツールへ移る3層構造が現れた（抄録）。", "fun": "災害対応は上意下達の指揮系統で動くと想定されていますが、実際の訓練では現場の人たちがすぐにチャットや電話で横につながりました。速く動ける反面、誰が何を決めたか分からなくなる危うさもあります。計画と現実のずれを、通信記録のネットワークとして可視化した点が面白いところです。", "unverified": "訓練の規模（参加人数）は未確認。"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "学生への社会保険番号の一斉付与と早期の正規雇用", "title": "Social Insurance Without a Job: School-Linked Benefits and Early Formalization in Mexico", "url": "https://doi.org/10.2139/ssrn.7583663", "authors": "Alain Pineda", "venue": "SSRN", "date": "2026-10-08", "why": "メキシコの600万人超の学生登録政策の効果を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "メキシコで2016年に600万人超の学生へ社会保障番号を付けて医療保険に個別登録した政策が、若者を非正規雇用に向かわせず、むしろ正規雇用への入り口になったことを示した（抄録）。", "p3": "導入時に在学中だった出生コホートと少し年上のコホートを比べ、その差を州ごとの導入前の非正規率で変化させる設計を用いた（抄録）。", "p5": "非正規率が高かった州ほど、対象コホートの正規雇用は隣接コホートより伸び、非正規雇用はむしろ減った。反応は賃金雇用に集中し、自営では見られなかった（抄録）。", "fun": "仕事と切り離した社会保障は「正規で働く理由を減らす」と心配されがちです。ところがメキシコでは、学生一人ひとりに番号を渡して保険を見える形にしたことで、かえって正規の就職が増えました。正規雇用に必要な番号を先に持たせたことが入り口になったという説明が面白い点です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "学校間競争は保護者の発言を弱めるか（スウェーデン）", "title": "Competition and Voice in Public Education: Evidence from Sweden 1 In Press, Education Finance and Policy", "url": "https://doi.org/10.2139/ssrn.7580998", "authors": "Karl Wennberg ほか", "venue": "SSRN", "date": "2026-10-08", "why": "学校選択制の競争が保護者の関与に与える影響を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "スウェーデンで学校選択制による競争を導入した自治体では、保護者の苦情（発言）が減ったことを示した（抄録）。", "p3": "ハーシュマンの「退出と発言」の理論に基づき、競争を導入した自治体とそうでない自治体を頑健な二方向固定効果の差の差法で比べた（抄録）。", "p5": "競争導入後に学校への苦情は減ったが、学校の問題の減少や教員の質・離職の変化では説明できず、保護者が懸念を口にする度合いが変わったと解釈された（抄録）。", "fun": "学校を選べるようになると、不満のある親は文句を言うより転校させるようになるかもしれません。この研究では、競争の導入後に苦情は減ったのに学校の質は上がっていませんでした。苦情が減ることを「良くなった」と読み違える危うさを示しています。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "地元を離れられない学生にとってのコミュニティカレッジ", "title": "Mobility Without Development? Community Colleges, Place-Bound Students, and the Geography of Opportunity", "url": "https://doi.org/10.35542/osf.io/hfk92_v2", "authors": "Agelo Thalassinidis", "venue": "EdArXiv", "date": "2026-10-07", "why": "5つの研究で、地域の経済発展なしに移動しない学生の上昇移動は可能かを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "地元を離れにくい学生に上昇移動を約束するコミュニティカレッジが、地域の経済発展なしにその約束を果たせるかを5つの研究で問うた（抄録）。", "p3": "国勢調査とIRSの記録、ベンチャー投資とIPOの集中、916の使命声明・802の戦略計画・316の認証改善計画の文書分析を組み合わせた（抄録）。", "p5": "持ち運べる技術系の卒業生はほぼすべての州から流出していた。同じ準学士レベルの仕事は賃金の高い州で実質12〜53%多く払われた。文書が拘束力を持つほど地域経済への関与の記述はほぼ消えた（抄録）。", "fun": "地元の短大は「ここで学べば豊かになれる」と約束しますが、良い仕事が地元になければ、技術を身につけた卒業生ほど出ていきます。この研究は、学校の計画書が具体的になるほど地域経済への約束が消えていくことまで文書で示し、教育だけでは地域の機会を作れないことを浮かび上がらせました。", "unverified": "各研究の推定方法の詳細は未確認。"}}, {"id": "pn46", "rank": 46, "field": "教育", "headline": "教師のユーモアと学業成績：師弟関係の媒介", "title": "Teacher Humour and Academic Achievement: The Mediating Role of the Teacher-Student Relationship in a Longitudinal Multilevel Study", "url": "https://doi.org/10.2139/ssrn.7583094", "authors": "Sonja Bieg ほか", "venue": "SSRN", "date": "2026-10-08", "why": "縦断マルチレベル分析でユーモアの種類と成績の関係を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "教師のユーモアの種類によって、師弟関係を通じた学業成績への効果が異なることを縦断マルチレベル分析で示した（抄録）。", "p3": "63の英語クラスの9年生1,273人を1年間3時点で追跡し、マルチレベル構造方程式モデルで教師レベルと生徒レベルの経路を分けた（抄録）。", "p5": "授業内容に関するユーモアは師弟関係を良くし、両レベルで成績への正の間接効果を持った。攻撃的なユーモアは関係を悪くし、教師レベルで負の間接効果を持った。自虐的なユーモアは関係にも成績にも関連しなかった（抄録）。", "fun": "面白い先生は人気がありますが、どんな冗談でもよいわけではありません。授業内容に絡めた冗談は生徒との関係を良くして成績にもつながる一方、生徒をからかう冗談は逆効果でした。自虐ネタは良くも悪くもないというのは意外な結果です。", "unverified": "成績は自己申告で、客観的な成績での確認は未確認。"}}, {"id": "pn47", "rank": 47, "field": "教育", "headline": "LLMによる構造化採点の診断的な質", "title": "Beyond Score Accuracy: Examining the Diagnostic Quality of LLM-Generated Structured Assessment in Higher Education", "url": "https://arxiv.org/abs/2610.09460", "authors": "Xi Zhao ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "why": "大学での自動採点で、点数の精度を超えたフィードバックの質を評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大学の自動採点でLLMが出す多次元の点数とフィードバックが、見かけほどの診断的な情報を持たないことを示した（抄録）。", "p3": "計算機科学の50問への3,041件の回答（JorGPTデータ）を教員と3つの商用LLMが採点したデータで、見かけと実際の質の食い違いを分析した（抄録）。", "p5": "下位次元の点数は互いに強く相関し（r=0.82〜0.99、VIF最大45）、独立の情報を持たなかった。誤概念の検出は5〜7%で教員の15〜31%を大きく下回り、口調は回答の質によらず一様に肯定的だった（抄録）。", "fun": "AIの採点は観点ごとの点数や丁寧なコメントがついて、いかにも詳しく見えます。ところが観点別の点数はほとんど同じことを言っていて、学生の思い違いを見抜く力は先生の数分の一でした。見た目の丁寧さと中身の診断力は別物だという、教育でAIを使う際の大事な注意です。", "unverified": "使った3つのLLMの名前は未確認。"}}, {"id": "pn48", "rank": 48, "field": "因果推論", "headline": "差の差法と機械学習による因果推論の比較", "title": "Difference-In-Differences And Machine Learning Causal Inference: A Comparison From The Perspective Of Data Structure", "url": "https://doi.org/10.2139/ssrn.7580738", "authors": "Weijia Wang", "venue": "SSRN", "date": "2026-10-08", "why": "平行トレンドと無交絡というそれぞれの識別仮定をデータ構造の観点から比べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "差の差法（平行トレンド）と機械学習の因果推定（無交絡）を、1つのモデルの下で比べ、データ構造によってどちらが使えるかを明確にした（抄録）。", "p3": "観測されない個体効果と共変量による傾向を持つ未処置結果のモデルで各推定量の確率極限を導き、16のモンテカルロ実験とLaLondeデータで確かめた（抄録）。", "p5": "横断推定は学習器によらず観測されない交絡を残し、条件付き差の差法はどちらも残さない。二重頑健な差の差法の偏りは2つの誤差の共分散に等しい。平均効果は差の差法、異質性はフォレストに任せる分担を示した（抄録）。", "fun": "政策の効果を測る方法には、前後の変化を比べる「差の差法」と、似た人どうしを機械学習で比べる方法があります。この論文は両者を同じ土俵に置き、どの偏りが残るかを数式で示しました。「平均は差の差法、ばらつきは機械学習」という役割分担の提案は実務的です。", "unverified": "各結果の導出の前提は未確認。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "Teamsでの協働の効果を決める課題適合と同期性", "title": "Task-Technology Fit and Communication Synchronicity as Drivers of Microsoft Teams Collaboration Effectiveness: Evidence from Users in Bangladesh", "url": "https://doi.org/10.2139/ssrn.7571758", "authors": "Hasin Sadad Abir ほか", "venue": "SSRN", "date": "2026-10-08", "why": "オンライン協働基盤の機能と同期・非同期コミュニケーションの役割を利用者調査で検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "Microsoft Teamsでの協働の効果を、課題-技術適合（TTF）とコミュニケーションの同期性（CS）がそれぞれ独立に説明することを示した（抄録）。", "p3": "バングラデシュの利用者385人の横断調査で、標準化した合成得点による回帰と交互作用を検定した。信頼性はα=0.515〜0.565と控えめだった（抄録）。", "p5": "TTF（β=.257）とCS（β=.211）はともに協働効果と正に関連し、分散の15.6%を説明した。交互作用は有意でなかった（β=.016、p=.716）（抄録）。", "fun": "オンライン会議ツールでうまく協働できるかは、ツールが仕事に合っているかと、すぐやり取りできるかの両方で決まるようです。ただ、2つが掛け算のように強め合うわけではありませんでした。信頼性の低さを隠さず報告している点は、調査研究として誠実です。", "unverified": "信頼性が低いため結果の頑健性は未確認。"}}, {"id": "pn50", "rank": 50, "field": "情報システム", "headline": "カンボジアの電子商取引導入の初期段階", "title": "E-Business Adoption in Cambodia's Emerging Digital Economy: Evidence from a 2016 Study", "url": "https://doi.org/10.2139/ssrn.7569638", "authors": "Sophearith Yorn", "venue": "SSRN", "date": "2026-10-07", "why": "2016年の調査を再分析し、デジタル経済の形成期の導入要因を記録した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "2016年のカンボジアの電子商取引の導入条件を、当時の調査を再検討して記録した（抄録）。", "p3": "2016年7〜8月のオンライン調査200件に、通信・決済・規制の当時の資料と、現地のデジタル企業の事例を組み合わせた（抄録）。", "p5": "接続の拡大はオンライン市場へのアクセスを生んだが、取引する準備は同じようには整わなかったという「初期デジタル化の逆説」を示した（抄録）。", "fun": "スマホでネットにつながる人が増えても、すぐにネットで買い物をするようになるわけではありません。決済の仕組みや信頼がそろうまでには時間がかかります。10年前の調査を今読み直すことで、デジタル化の「つながる」と「使える」の間の溝を記録した研究です。", "unverified": "調査の標本の代表性は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "LLMエージェント数千体の網で分極化が自然発生", "title": "Emergence of polarization in networks of large language model agents", "url": "https://doi.org/10.1038/s41467-026-78228-y", "authors": "Jinghua Piao ほか", "venue": "Nature Communications", "date": "2026-10-08", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr02", "rank": 2, "headline": "グラフ畳み込みで損傷時の橋の全体剛性を即時予測", "title": "A graph convolutional network method for rapid global stiffness prediction un     "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
