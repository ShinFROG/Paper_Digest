5から0.25へ下げる（§3）。", "p4": "Qwen3-1.7B、Qwen3-4B、Ministral-3-3Bを、DAPO-Math-17Kで学習し、AIME24/25/26、MATH500、AMC23、Minerva-Math、GSM8Kの7ベンチマークで不偏なpass@k（1問64サンプルなど）を測った。比較はDAPOとDAPO＋新規性で、計算量（RL更新300回）をそろえた。一般能力の劣化はMMLU-Pro、MMLU-Redux、GPQA-Diamondで見た（§4）。", "p5": "3モデルすべてでExpDisが数学ベンチマークの平均正答率でDAPOを上回り、1ラウンドだけでも4倍のステップのDAPOを上回った（図3、§5）。予算固定では、ラウンドを増やすほうが探索者を増やすよりpass@1に効き、両方の組み合わせがpass@1とpass@64で最大だった（図4）。DAPO＋新規性は語彙的多様性は上がるが数学で後退し一般能力も基盤モデルより劣化したが、ExpDisは劣化しなかった（図5、図6）。", "p6": "著者は、単一の新規性ボーナスと学生と同じ構造の探索者に絞ったこと、現在の予算では探索者3・ラウンド4で頭打ちになることを述べている（§5、§6）。解釈：検証は数学に限られ、正誤が自動判定できない課題（文章生成、エージェント課題）で同じ分業が機能するかは未確認である。", "fun": "新しいことに挑戦すると失敗も増えます。AIでも、目新しい答えに点をあげると、正確さや一般的な能力が落ちてしまいます。この研究は、思い切った挑戦をする「冒険役」と、その成功例だけを学ぶ「本番役」を別々のモデルに分けました。失敗が許される場があってこそ新しいアイデアが生まれる、という人間の学び方をAIに持ち込んだ発想です。", "unverified": "ベンチマークごとの正答率の数値（付録B）は読んでいない。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "大きなLLMほどハードウェア故障に強くなる", "title": "Fault-tolerant foundation models", "url": "https://arxiv.org/abs/2610.10311", "authors": "Trevor McCourt ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "McCourt, T., Fiete, I. R., & Chuang, I. L. (2026). Fault-tolerant foundation models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10311", "why": "4万GPU時間の故障模擬学習から修正スケーリング則を導き、LLMが誤り訂正符号のように計算する可能性を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（スケーリング則、故障を知らないモデルとの比較、低エネルギー加速器、形式的耐故障性、考察の節）を読んだ。Methodsと付録は概略のみ", "preprint": true, "p1": "演算に誤りが起きるハードウェアを模擬して学習させたLLM（耐故障化モデル）は、大きくなるほど誤りへの耐性が増すことを、修正したニューラル・スケーリング則で示し、適切に学習したLLMは形式的に耐故障でありうると予想した（抄録、Discussion）。", "p2": "省エネルギーの新しいハードウェア（アナログ、低電圧デジタル、ニューロモルフィック、光、確率的計算）は信頼性と引き換えに効率を得るが、現在のLLMは量子化程度の穏やかな摂動にも弱く、ランダムで大きさに上限のない誤りには耐えられない。耐故障性が規模とともに続くのか、崖があるのかは分かっていなかった（序論）。", "p3": "Llama2型のモデルで、注意層とフィードフォワード層の行列積の要素をk=4個のブロック単位で確率pでゼロにする故障を、学習時・推論時の毎回の順伝播に注入した（誤り検出付きの低電圧チップLENNAを想定）。数千のモデルをN・D・pを変えて学習し、標準のスケーリング則に対数モデルサイズの2乗の「曲率項」α₂を加えた式（式4）を当てはめた。有効容量η/N（故障なしモデルで同じ損失を出すのに必要な大きさの比）を符号の「レート」に見立てた（式1–2）。", "p4": "FineWebの一部で、約4万GPU時間をかけ最大約10⁹パラメータまで学習し、ブートストラップ（各p群1,500回）で係数の不確かさを評価した。比較対象は故障なしで学習し推論時だけ故障にさらす「故障を知らない」モデルで、評価は保留テキストの損失である（Fig. 2–3、Methods）。", "p5": "耐故障化モデルではα₂がpとともに増え、η/Nは規模とともにいったん下がった後、臨界サイズN*を超えて回復した（Fig. 1、Fig. 2a）。これは反復型の符号なら0へ向かうはずの挙動と異なり、脳のグリッド細胞のような「良い」誤り訂正符号を学んでいることと整合すると著者は解釈する。故障を知らないモデルは推論時の故障で損失がデータ量とともに悪化することさえあり、出力の有効温度が急上昇し、ロジットも不可逆に乱れた（Fig. 3）。", "p6": "著者は、実験が約10⁹パラメータまでで、漸近項を商用規模で決めるには約10²⁶ FLOPs（約10⁸ GPU時間）が必要で学術機関では困難だと認めている（Discussion）。解釈：故障モデルは「検出されて落ちるブロック」に限られ、検出されない誤りや実チップ固有の偏りでの挙動は未確認である。", "fun": "脳の神経細胞は信号をしばしば取りこぼすのに、脳は少ないエネルギーで正確に考えます。この研究は、わざと計算を間違えるコンピュータでAIを鍛えると、モデルが大きいほど間違いに強くなることを見つけました。CDの傷があっても音が飛ばない誤り訂正のような仕組みを、AIが自分で編み出しているのかもしれない、という仮説が刺激的です。", "unverified": "スケーリング則の係数の具体的な数値と、臨界サイズN*の値は読んでいない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "価格差別の消費者厚生を顕示選好で評価", "title": "Price Discrimination and Revealed Consumer Welfare", "url": "https://arxiv.org/abs/2610.10172", "authors": "Jo\\~ao Thereze (Fuqua School of Business ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Thereze, J., & Vaidya, U. (2026). Price Discrimination and Revealed Consumer Welfare (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10172", "why": "需要曲線も独占企業の情報も知らずに、価格と数量の観測から消費者余剰の変化の鋭い上下限を導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、モデル、合理化可能性、2区分の上下限と例、一般の上下限の節）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "独占企業が市場を区分して価格差別を始めたとき、需要曲線も企業の持つ情報も知らない分析者が、前後の価格と数量の観測だけから消費者余剰の変化の上下限を閉形式で求め、消費者が得をしたか損をしたかを判定できる条件を示した（抄録、§1）。", "p2": "個別価格の規制が議論されるなかで、事前予測ではなく観測データから価格差別の影響を事後に評価する方法が必要だが、既存の十分条件は需要の右下がりのみに頼っていた（§1）。", "p3": "第1期は一律価格、第2期は区分ごとに異なる価格で、企業は各期に収入を最大化していると仮定する（第3種価格差別）。観測がこの仮定で説明できる（合理化可能な）条件は、第2期のn個の価格-数量の組に対するn+1本の不等式で特徴づけられる。最初のn本は一律価格の最適性から、最後の1本は「区分後の総収入は一律価格以上」というブラックウェルの定理から出る（§1、§3）。", "p4": "検証は理論的で実データの応用はない。2区分（一律価格より高い価格と低い価格）の場合で上下限の構成を示し（§4）、具体的な数値例で利得・損失が判定できることを示したうえで、任意の区分数へ一般化した（§5、定理2）。", "p5": "消費者余剰の変化として整合的な集合は区間になり、その上下限は閉形式で求まる（§1）。例1では需要を知らなくても消費者の利得が確定し、例2では高価格区分の観測を1つ変えただけで（合計数量1.1が一律価格の1を上回っていても）消費者の損失が確定した（§4.3）。一般の場合、区分内の数量の配分は一律価格に近い区分から貪欲に行えばよい（§5）。", "p6": "本文の範囲では、著者が明示する限界は確認できなかった。解釈：企業が収入最大化をしているという仮定（限界費用ゼロに相当する）が強く、費用がある場合や、観測された価格変化が区分以外の理由（費用・需要の変化）による場合への拡張が必要である。", "fun": "学割やクーポンのように客によって値段を変えると、得をする客と損をする客が出ます。全体として客が得をしたかを判定するには普通は需要曲線が必要ですが、この論文は「会社がもうけを最大にしている」という前提だけで、値段と販売数の記録から答えの範囲を決められることを示しました。少ない情報から言えることを最大限引き出す、顕示選好の考え方の好例です。", "unverified": "例1・例2の具体的な数値の組と、一般の場合の上限の式の詳細は読んでいない。"}}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "国際共同研究で多数派国と少数派国のどちらが率いるか", "title": "Leadership from the Majority or the Minority? Country-Based Leadership Positions and Team Performance in International Scientific Collaboration", "url": "https://doi.org/10.2139/ssrn.7578006", "authors": "Chenwei Zhang ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Zhang, C., Liu, M., Yang, Y., Zhao, Y., & Wang, Y. (2026). Leadership from the Majority or the Minority? Country-Based Leadership Positions and Team Performance in International Scientific Collaboration. https://doi.org/10.2139/ssrn.7578006", "why": "大規模書誌データで、リーダーの国の構造的位置とチーム構成・被引用の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "国際的な科学共同研究チームで、リーダーの所属国がチームの多数派国（多数派国リーダー）か少数派国（少数派国リーダー）かによって、チーム構成と被引用がどう違うかを大規模書誌データで示した（抄録）。", "p2": "国際共同研究は多様な学術的・文化的資源を集める一方で調整の難しさを生み、リーダーシップがとくに重要になるが、リーダーのチーム内での構造的な位置（国の多数派か少数派か）に注目した研究は少ない（抄録）。", "p3": "計算機科学の大規模書誌データで、リーダーの所属機関の国がチーム内で人数の最も多い国かどうかでチームを分け、チームの特徴（規模、学術年齢・生産性のリーダーと成員の差、国の多様性）と2年・5年の被引用数を比べた（抄録）。", "p4": "被引用数の基本モデルに加え、チームの支配的な国を統制したモデル、支配国別（米国・中国など）の分析で、関連が頑健かを確かめた（抄録）。標本規模と期間は抄録に記載がない。", "p5": "多数派国リーダーのチームのほうが多く、やや大きかった。少数派国リーダーのチームは、リーダーと成員の学術年齢・生産性の差が大きく、国の多様性がやや高かった。基本モデルでは多数派国リーダーは2年・5年の被引用がわずかに多かったが、支配国を統制すると短期の関連は有意でなくなり、長期の小さな関連だけが残った。残る関連は主に米国・中国が支配するチームに集中していた（抄録）。", "p6": "抄録の範囲では、計算機科学のみの分析であり、他分野への一般化は未確認である。解釈：被引用の差は支配国の国際的な可視性と絡み合っており、リーダーシップそのものの効果と区別するには、リーダーの割り当てが外生的に変わる状況の分析が必要になる。", "fun": "国際共同研究で、メンバーが一番多い国の人がリーダーになるのと、少数派の国の人がリーダーになるのでは、成果に差が出るのでしょうか。見かけ上は多数派リーダーのほうが少し引用されますが、それは主にアメリカや中国が中心のチームの話でした。リーダーの効果に見えるものが、実は国の知名度の効果かもしれないという点が面白いところです。", "unverified": "データの規模・期間と効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn09", "rank": 9, "field": "教育", "headline": "家庭のSESと達成動機の関連はr=0.10（PISA20年分）", "title": "The Association Between SES and Students’ Achievement Motivation in Secondary School: An Individual Participant Data Meta-Analysis Spanning Two Decades of PISA Data", "url": "https://doi.org/10.31234/osf.io/ecsg7_v3", "authors": "Sarah Grünthal ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Grünthal, S., Keller, L., Kretschmann, J., Dumont, H., & Brunner, M. (2026). The Association Between SES and Students’ Achievement Motivation in Secondary School: An Individual Participant Data Meta-Analysis Spanning Two Decades of PISA Data. https://doi.org/10.31234/osf.io/ecsg7_v3", "why": "92か国・約358万人の個票メタ分析で、社会経済的地位と学習動機の関係が小さいことを示した。", "explain": {"basis": "本文", "basis_note": "PsyArXivのPDF本文（データ、方法、主結果、限界の節と表3）を読んだ。調整変数の詳細な結果の節は抜粋のみ", "preprint": true, "p1": "PISAの個票（2000〜2022年、92か国・約358万人）を使った初の個人参加者データ（IPD）メタ分析で、家庭の社会経済的地位（SES）と生徒の達成動機の関連が平均では小さい（約0.10）ことを示し、指標や動機の種類によって関連の強さが異なることを明らかにした（抄録、結果）。", "p2": "達成動機の主要理論はSESと動機を結びつけるが、この関連の体系的な証拠は限られていた。とくにSESの指標（親の学歴、職業、蔵書数、教育資源）や動機の要素（自己効力感、興味、価値、不安など）の違いを同時に扱った統合はなかった（抄録）。", "p3": "2段階のIPDメタ分析で、第1段階で各標本の個票から標本重みを考慮してSESと動機の関連（標準化回帰係数）を推定し、第2段階でそれらを統合して調整変数（SES指標、動機の要素、教科、調査年、COVID-19以後か）を分析した。学力を統制した調整済みの関連も推定し、欠測は入れ子の多重代入で扱った（方法）。", "p4": "485の生徒標本、4つのSES指標、8つの動機の要素、4つの教科、8回の調査サイクルを含む3,576,278人を分析した（抄録、表2）。効果の大きさは平均の関連と95%信頼区間・予測区間で評価した（結果）。", "p5": "表3で、平均の関連はβ=.10（95%CI [.09, .11]）、予測区間は−.06〜.26と異質性が大きかった。教育資源と自己効力感の関連が最大級で（教科平均でβ=.21、理科の自己効力感で.23）、蔵書数と不安は−.09だった。学力を統制すると平均はβ=.04（[.03, .04]）に小さくなった。関連は時代とともに強まったが、COVID-19の後に弱まった（抄録、結果）。", "p6": "著者は、PISAに世帯所得・資産の直接の指標がないこと、達成価値や情緒的コストの測定が理論の構成概念を十分に捉えていないこと、15歳のみの横断データで発達的な結論を出せないことを認めている（限界の節）。", "fun": "家が裕福な生徒ほど勉強のやる気が高い、と考えがちですが、92か国・350万人以上のデータをまとめると、その関係は思ったより弱いものでした。中でも「自分はできる」という自信が家庭の教育環境と最も強く結びついていました。お金そのものより、本や教材が身近にあることが自信につながるのかもしれません。", "unverified": "国別・調査年別の調整変数分析の推定値の詳細は読んでいない。抄録はr、本文はβで表記されている。"}}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "オフライン評価だけでLLM製品を出せるのはいつか", "title": "When Can You Ship on Evals Alone? Trial-Level Surrogacy for Offline Evaluation of LLM Systems", "url": "https://arxiv.org/abs/2610.10142", "authors": "M{\\aa}rten Schultzberg", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Schultzberg, M. (2026). When Can You Ship on Evals Alone? Trial-Level Surrogacy for Offline Evaluation of LLM Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10142", "why": "評価の効果がオンラインの効果を予測する「試行レベルの代替性」を定義し、出荷・試験・中止の判断規則を導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（試行レベルの代替性の定義、作業モデル、出荷規則、シミュレーション、Upworthyでの例示、結論の節）を読んだ。付録の頑健性検討と証明は読んでいない", "preprint": true, "p1": "LLM製品の変更をA/Bテストなしにオフライン評価（eval）だけで出荷してよいかは、evalの処置効果がオンラインの処置効果を予測するか（試行レベルの代替性）で決まると定式化し、過去のローンチ記録から測定誤差を補正して、出荷・試験・中止を決める閉形式の規則を導いた（抄録、§6）。", "p2": "evalが人間の判断と一致することを示しても、どの変更をA/Bテストなしで出してよいかは分からない。試行レベルの代替性は、個人単位の（Prentice型）代替性とは論理的に独立である（抄録、§2）。", "p3": "過去の介入ごとのevalとオンラインの効果推定値には両方に標本誤差があり、関係が薄まって見える。二変量正規の作業モデルの下で、報告された介入内分散を差し引くと介入間の共分散が回復し、その補正済みモーメントから「オンライン効果が0以下である確率」をα以下に抑える出荷の閾値s*（代替閾値効果）を閉形式で与えた（定理3–4、式6）。LLM判定者の精度が両群で等しければeval効果は縮尺が変わるだけだが、群で精度が違うと符号が逆転しうることも示した（§5）。", "p4": "作業モデルからのシミュレーションで、補正による代替性の回復と、推定パラメータを使う規則の実際の誤出荷率を調べた（§7.1、表2）。公開例として、Upworthy Research Archiveの見出しA/Bテストから183の独立な介入（10の見出し特徴クラス）を作り、GPT-4o-miniが情報の明確さを0〜100で採点するevalとクリック率の関係を推定した（§7.2）。", "p5": "説明用の設定でα=0.1のとき、規則はeval差が2.94ポイント以上で出荷、−3.02ポイント以下で中止とし、介入の14%を出荷、6%を中止に振り分けた（§6）。クラスを混ぜると、代替性のない2クラスから見かけの二乗相関0.81が生まれ、名目α=0.05で実際の誤出荷率が0.106になった（付録A.3）。Upworthyでは信頼性比は0.93と0.74と精度は高かったが、全体の関係は弱く、規則はすべての介入をA/Bテストに送った（§7.2）。", "p6": "著者は、規則の妥当性は作業モデルとクラス定義に依存し、展開後は出荷・中止の領域で関係が観測できなくなるため、無作為の監査実験なしでは変化を検出できないと述べている（抄録、§6）。Upworthyの例はクラスごとの標本が9〜27と小さく探索的である（§7.2）。", "fun": "AIの採点で「良くなった」と出た変更を、本番の利用者で試さずに出してよいのか。この論文は、AIの採点の上がり幅が本番での効果の上がり幅を過去に当ててきたかを見ればよい、と整理しました。ニュース見出しの実験データでは、AIの評価はぶれが小さいのにクリック数とはほとんど関係がなく、全部本番テストへ送るという慎重な結論になりました。", "unverified": "表2の補正前後の偏りとRMSEの数値は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "2025年の米国関税は低所得国ほど損失が大きい", "title": "The Unequal Trade War&nbsp;", "url": "https://doi.org/10.2139/ssrn.7576938", "authors": "Jinyuan Qiu ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Qiu, J., Shen, S., Sheng, L., & Zhao, H. (2026). The Unequal Trade War&nbsp; https://doi.org/10.2139/ssrn.7576938", "why": "製品レベルの関税データと貿易モデルで、IEEPA関税の損失が逆進的であることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "2025〜26年の米国の高関税が世界の実質付加価値に与えた損失を推計し、2025年の国別のIEEPA関税は低所得国ほど損失が大きい逆進的な負担を生んだが、2026年の一律10%関税ではそのような所得勾配が見られないことを示した（抄録）。", "p2": "米国は2025〜26年にほぼすべての貿易相手からの輸入関税を80年以上ぶりの水準に引き上げたが、その費用が国の所得水準によってどう異なるかは明らかでなかった（抄録）。", "p3": "新たに整備した製品レベルの米国の法定関税と輸入のデータで、国別に異なるIEEPA関税（2025年）とSection 122による一律10%関税（2026年初）を、産業連関の結びつきと内生的な労働供給を持つ定量的貿易モデルに組み込んで比べた（抄録）。", "p4": "評価は各国の実質付加価値の損失と、その損失と所得水準の関係（勾配）である（抄録）。モデルの較正の詳細やデータの期間は抄録に記載がない。", "p5": "低所得国ほどIEEPAの関税率が高く、米国市場への依存も大きかった。IEEPA体制は低所得国に偏った明確に逆進的な損失を生み、一律関税では同様の所得勾配は見られなかった。グローバル・バリューチェーンはこれらのショックとその逆進性を増幅した（抄録）。", "p6": "抄録の範囲では、モデルに基づく推計であり、報復関税や為替の調整の扱いは確認できない。解釈：損失の大きさはモデルの弾力性の仮定に依存するため、本文の感度分析で確かめる必要がある。", "fun": "関税は輸入品にかかる税ですが、その負担は相手国にも及びます。この研究によると、2025年の国ごとにばらばらな関税は、貧しい国ほど高い税率をかけられ、しかもアメリカへの輸出に頼っている国が多かったため、損失が貧しい国に集中しました。部品が国境を何度も越える現代の生産網が、その影響をさらに広げています。", "unverified": "損失の具体的な数値（国別・所得階層別）は抄録になく未確認。"}}, {"id": "pn12", "rank": 12, "field": "教育", "headline": "コロナ休校は低資源家庭の子の発達格差を広げた", "title": "School Disruptions, Parental Input, and Inequality in Early Childhood Development", "url": "https://doi.org/10.2139/ssrn.7564698", "authors": "Yijuan Chen ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Chen, Y., Li, J., & van Empel, G. (2026). School Disruptions, Parental Input, and Inequality in Early Childhood Development. https://doi.org/10.2139/ssrn.7564698", "why": "豪州の全数学校調査でDIDとDDDを用い、休校の発達への悪影響と親の関与の役割を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "コロナ禍の休校を外生的なショックとして、小学校1年目の子どもの発達が休校で悪化し、その悪影響は資源の少ない家庭の子で大きく、発達の格差を広げたことを示した（抄録）。", "p2": "学校の中断が幼い子の発達に与える影響と、家庭での親の関与が学校をどこまで代替できるかは、十分に分かっていなかった（抄録）。", "p3": "オーストラリアの全数の学校調査データで、就学1年目の子を対象に、休校の強度の地域差を使った差の差法（DID）で発達への効果を推定し、家庭の資源による違いを三重差分（DDD）で分析した。親の行動と精神的健康の反応も調べた（抄録）。", "p4": "評価は子どもの発達の成果指標と、親の子どもと過ごす時間・教育的活動の種類である（抄録）。発達指標の具体的な名称や標本規模は抄録に記載がない。", "p5": "休校は発達の成果に悪影響を与え、その影響は資源の少ない家庭の子で大きかった。休校の強い地域の親は子どもと過ごす時間を増やしたが、学習効果の高い教育的活動をする可能性は低かった。資源の少ない親は時間を高資源の親より多く増やしたが、効果の高い活動をする可能性は依然としてかなり低かった（抄録）。", "p6": "抄録の範囲では、休校の強度の地域差が他のコロナ禍の影響（経済や健康への打撃）と相関する可能性への対処は確認できない。解釈：著者は家庭学習の支援が所得支援より有効かもしれないと述べるが、政策の比較は直接検証されていない。", "fun": "休校中、親は子どもと過ごす時間を増やしましたが、それで学校の代わりになったわけではありませんでした。一緒にいる時間が増えても、読み聞かせや学習のように効果の高い関わりは増えにくかったのです。特に余裕の少ない家庭では、時間は増やしても中身で差が残り、子どもの発達の格差が広がりました。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "株主との非公開対話が減ると公開開示が増える", "title": "Private Voice and Public Disclosure", "url": "https://doi.org/10.2139/ssrn.7580058", "authors": "Ehsan Poursoleyman", "venue": "SSRN", "date": "2026-10-08", "apa": "Poursoleyman, E. (2026). Private Voice and Public Disclosure. https://doi.org/10.2139/ssrn.7580058", "why": "SECの2025年指針を使った三重差分で、非公開の株主対話と公開開示の代替関係を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "SECの2025年2月の指針で機関投資家の非公開の働きかけ（エンゲージメント）が難しくなると、企業は株主総会の委任状での公開開示を増やし具体化したことを示し、非公開の株主の声が公開開示の材料になっていることを明らかにした（抄録）。", "p2": "非公開の株主との対話は経営者に投資家の懸念や議決権行使の意向を伝えるが、それが公開の開示の判断を形づくるかは不明だった（抄録）。", "p3": "SECのSchedule 13Gの適格性に関する指針は、株式の5%超を持つ機関投資家が影響力を行使する対話の法的リスクを高めた。これを使い、同じ企業内で、以前に対話の対象だったガバナンスの論点と他の論点の裁量的な委任状開示の変化を、指針前の保有が5%の閾値の上か下かで比べる、論点を対応させた三重差分の設計を作った（抄録）。", "p4": "評価は、影響を受けた対話の減少、公開開示の量と具体性、取締役会の決定の説明の詳しさ、ガバナンス方針自体の変化の有無、投資家が公表する議決権行使指針との整合である（抄録）。", "p5": "影響を受けた対話は減り、企業は公開開示の量と具体性を増やし、取締役会の決定をより詳しく説明した。この反応はガバナンス方針が変わらない場合にも見られた。開示は投資家の議決権行使指針とわずかに整合したが、標準的な伝達より企業固有の公開説明が増えたことと整合的だった（抄録）。", "p6": "抄録の範囲では、指針の影響が5%前後の保有者以外の経路（市場全体の規制環境の変化）を通じた可能性への対処の詳細は確認できない。解釈：開示の増加が投資家にとって有益な情報の増加なのか、形式的な記述の増加なのかは、本文の具体性の測定で確かめる必要がある。", "fun": "大株主が会社に「ここを直してほしい」と非公開で伝えにくくなったら、会社はどうするでしょうか。この研究では、会社は株主総会の資料で決定の理由を詳しく書くようになりました。直接聞けなくなった株主の疑問に、公開の場で先回りして答えるようになったわけで、非公開の対話と公開の開示が置き換わる関係が見えます。", "unverified": "効果の大きさの数値と標本規模は抄録になく未確認。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "空間依存データのための逐次白色化コンフォーマル予測", "title": "Conformal Prediction for Spatially Dependent Data via Sequential Whitening", "url": "https://arxiv.org/abs/2610.10168", "authors": "Ayush Baran Sen ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Sen, A. B., & Saha, A. (2026). Conformal Prediction for Spatially Dependent Data via Sequential Whitening (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10168", "why": "校正残差で逐次条件付けして空間依存下の予測区間を効率化し、大規模ネットワークにも近傍近似で拡張した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定、手法、理論保証の概要、シミュレーションの設定、PM2.5への応用、考察の節）を読んだ。シミュレーションの表1の数値と補足の証明は読んでいない", "preprint": true, "p1": "空間的に依存するデータで、校正データの残差を順番に条件付けて「白色化」するコンフォーマル予測を提案し、作業共分散が正しければどんな空間配置でも有限標本で正確な被覆を保ちつつ、既存の空間コンフォーマル法より狭く安定した予測区間を得た（抄録、§7）。", "p2": "分割コンフォーマル予測は校正誤差と対象地点の誤差が交換可能なとき分布によらない被覆を保証するが、空間依存や偏った観測配置では成り立たない。既存の空間法は学習用の残差で予測できる空間変動を除くが、校正残差だけが予測できる変動は残り、区間の効率と安定性を下げる（抄録、§2）。", "p3": "応答に依存しない順序を決め、各校正残差をそれ以前の学習・校正残差から予測して差し引き、予測標準偏差で割る。対象地点は最後に置き、すべての残差から予測する。これは作業共分散の三角分解による白色化と同値で、近傍近似で大規模ネットワークにも拡張できる（§3）。楕円分布の残差と正しい作業共分散の下で正確な被覆、追加条件で漸近的にオラクル並みの効率を示し、共分散の誤指定時の被覆損失の上界と、被覆不足の危険地域を見つける診断法も作った（§4）。", "p4": "ランダム・非ランダムな配置のシミュレーションと、2022年の米国本土のEPAのPM2.5観測局723局で、ナイーブな分割コンフォーマル、GSCP、LSCPと比較した。評価は名目90%に対する被覆率と区間幅で、20分割のランダム検証と、49の州単位の地域を丸ごと除く検証を行った（§5–6）。", "p5": "PM2.5ではランダムフォレストの袋外R²は0.23で、残差分散の67%が空間依存だった。ランダム分割では全手法がほぼ名目の被覆を保ち、提案法の区間はGSCPより約6%、LSCPより約4%、ナイーブより18%狭かった（表4、§6.2）。最も近い5分位ではGSCP・LSCPのほうが狭いが7〜8ポイント被覆不足で、最も遠い5分位でも提案法は8〜10%狭かった（図5）。州ごとの除外では全手法が被覆不足となり、提案法とLSCPはほぼ同等だった（§6.3）。", "p6": "著者は、完全に分布に依存しないわけではなく、作業共分散が残差の依存を十分に表さないと被覆不足になりうること、推定した共分散を固定として扱っていることを認め、診断に基づく調整の形式的保証や非定常な共分散への拡張を課題とする（§7）。", "fun": "大気汚染の観測局がない場所の値を予測するとき、「どのくらい外れうるか」の幅も知りたいものです。近くの観測局どうしは値が似ているので、その似かたを使えば幅を狭くできます。この研究は、観測局を一つずつ順番に「前の局から予測できない部分」だけに直していくことで、幅を狭くしても保証が崩れないようにしました。", "unverified": "シミュレーションでの各手法の被覆率と幅の数値（表1）は読んでいない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "線形注意の再帰状態を誤差の寿命と位置で量子化", "title": "STEPQuant: When and Where Errors Matter in Delta-Rule Recurrent State Quantization", "url": "https://arxiv.org/abs/2609.38169", "authors": "Bingchen Yao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "apa": "Yao, B., Xu, H., Lin, H., Wu, Y., Guo, Z., Zhang, R., Lu, Z., Sun, Z., & Wei, Y. (2026). STEPQuant: When and Where Errors Matter in Delta-Rule Recurrent State Quantization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38169", "why": "誤差が持続する時間と影響する行に応じて精度を配分する、デルタ則再帰状態の事後量子化法（HF投票94）。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（誤差の伝播の解析、時間・空間の2軸の手法、実験設定、精度・効率の結果、結論、付録Hの限界）を読んだ", "preprint": true, "p1": "線形注意（デルタ則）のLLMが持つ固定サイズの再帰状態を、誤差が残る時間（記憶の寿命）と影響する場所（キーの行）に応じて精度を配分する事後量子化STEPQuantで圧縮し、6ビットでFP32の状態とほぼ同じ精度を保ちつつ、サービング全体のメモリを最大68.7%減らした（抄録、§5）。", "p2": "線形注意は増え続けるKVキャッシュの代わりに固定サイズの再帰状態を使うが、多数の同時リクエストではその状態がメモリの大きな負担になる。状態を一様に低ビット化すると、量子化誤差が状態更新を通じて繰り返し伝わり、精度が大きく落ちる（抄録、§1）。", "p3": "誤差は保持ゲートで減衰し、現在のキー方向の成分はデルタ更新で減るが、後のキーとあまり重ならない方向の誤差はゲートの減衰だけに依存し、保持率が1に近いと長く残る（命題1、§3.1）。そこで、①ゲートの半減期で表した記憶の寿命と誤差の大きさに応じてヘッドごとにビット数を配分し（§3.2）、②出力誤差へのキー行の影響と状態の分布に基づいて、キー行とバリュー列の2軸の尺度を同時に当てはめる（§4.3）。SGLangに専用のGPUカーネルとして実装した（§4.4）。", "p4": "Qwen3.8-27BとKimi-Linear-48B-A3B-Instructを、BF16と4ビットAWQの重みで、A800 GPU4枚で評価した。基準はSGLang既定のFP32の状態と一様なINT4/6/8で、長い生成の推論7課題（LiveCodeBench、AIME 2026、MATH-500、GPQA Diamondなど）と短い生成の課題で正答率を比べた。校正にはWikiText-2の32区間を使った（§5.1）。", "p5": "長い推論課題（表2）で、6ビットSTEPQuantの平均正答率はQwenで80.59%、Kimiで61.47%とFP32の状態に近く、一様INT6は45.04%と45.70%にとどまった。短い課題では4ビットSTEPQuantがFP32との差0.15（Qwen）・0.25ポイント（Kimi）だった。4ビットAWQ重みとの併用でも6ビットで79.27%と58.62%で、FP32の状態との差は0.05と0.33ポイントだった（表3）。バッチ512でサービング全体のメモリは419.73から131.18 GiBに減り、状態メモリは80.1%減（5.03倍圧縮）、状態更新時間は65.6%短縮した（§5.6）。", "p6": "著者は、寿命の重みはゲートの減衰で誤差の持続を近似するだけで、時間変化しキーに依存する遷移を完全には表していないこと、BF16重み・4ビットではKDAが長い生成で精度を落とすこと、評価が2つのモデルと固定の負荷条件に限られることを認めている（付録H）。", "fun": "新しいタイプのAIは、読んだ内容を固定サイズの「メモ帳」に書き込みながら文章を作ります。大勢が同時に使うとメモ帳の分だけメモリが足りなくなるので、数字を粗く書いて節約したいところです。この研究は、長く残るメモほど丁寧に、すぐ消えるメモは粗く書くという、人間のノートの取り方のような工夫で、精度を保ったまま5倍の圧縮を実現しました。", "unverified": "命題1の寿命とヘッド誤差の相関係数（Spearman）の値と、Kimiでの効率の数値（付録F）は読んでいない。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "RBFカーネルのガウス過程の最尤推定の鋭い漸近理論", "title": "Sharp Asymptotic Theory of Maximum Likelihood Estimation for Gaussian Processes with an RBF Kernel", "url": "https://arxiv.org/abs/2610.10080", "authors": "Ameer Qaqish ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Qaqish, A., & Li, D. (2026). Sharp Asymptotic Theory of Maximum Likelihood Estimation for Gaussian Processes with an RBF Kernel (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10080", "why": "広く使われるガウス過程のハイパーパラメータ推定の漸近的性質を明らかにした理論研究。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "RBFカーネルのガウス過程で、空間分散・長さスケール・ナゲット分散の同時最尤推定量の固定領域漸近理論を初めて完全に与えた（抄録）。", "p3": "観測点が一定の領域内で密になっていく固定領域漸近の下で、強い相関と共分散行列のパラメータへの非線形依存を扱い、一致性と収束率を導いた（抄録）。", "p5": "3つのパラメータすべての一致性・収束率・同時の漸近正規性を示し、その収束率がミニマックス最適であることを証明した（抄録）。", "fun": "ガウス過程は「近い点ほど値が似ている」という性質で予測する道具で、標準ソフトが自動でパラメータを推定します。ところが、同じ範囲で点を細かく増やしたとき推定がどう振る舞うかは、最もよく使われるカーネルでさえ分かっていませんでした。日常的に使う道具の理論的な裏づけが初めてそろったことになります。", "unverified": "具体的な収束率の形は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "スケッチによる共変量シフト下のコンフォーマル予測", "title": "Sketched Calibration for Conformal Prediction under Covariate Shift", "url": "https://arxiv.org/abs/2610.09208", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Pournaderi, M. (2026). Sketched Calibration for Conformal Prediction under Covariate Shift (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09208", "why": "重み付きコンフォーマル予測の計算・統計コストを抑える校正法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "共変量シフト下の重み付きコンフォーマル予測で、共変量を圧縮（スケッチ）した比を使い、校正のコストを下げる方法を提案した（抄録）。", "p3": "圧縮した共変量Z=T(X)の尤度比で重み付けし、捨てたシフトが応答の分布変化として再び現れる「漏れ」Δ_Tで被覆率の下限1−α−Δ_Tを与えた（抄録）。", "p5": "不均一分散のシミュレーションで、1次元スケッチは無限大の予測集合の割合を37.8%から8.0%に減らし、目標90%に対し平均被覆率92.3%だった（抄録）。", "fun": "学習時と使う時でデータの傾向がずれると、予測の幅の保証が崩れます。その補正は、ずれが大きいほど急に不安定になります。この研究は、答えに関係しない方向のずれは無視してよいと考え、データを要約してから補正することで、保証をほぼ保ったまま安定させました。", "unverified": "実データでの成否の条件は未確認。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "情報的欠測のある縦断データの因果推論", "title": "Longitudinal causal inference under informative missingness using the self-censoring model", "url": "https://arxiv.org/abs/2610.09234", "authors": "Iv\\'an D\\'iaz", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Díaz, I. (2026). Longitudinal causal inference under informative missingness using the self-censoring model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09234", "why": "測定が患者の状態に依存して欠測する縦断データで、自己打ち切りモデルにより因果効果を識別する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測されるかどうかが観測されない値そのものに依存する縦断データで、修正処置方策の因果効果を識別・推定する方法を示した（抄録）。", "p3": "自己打ち切りモデルとシャドー変数の条件付きモーメント制約を縦断的な因果識別と組み合わせ、再帰的な識別式と、機械学習を使えるクロスフィッティング推定量を導いた（抄録）。", "p5": "適切な条件の下で推定量は漸近線形でroot-n推論が可能になり、複数の時点で同時推論もできる（抄録）。", "fun": "病院のデータは、具合が悪いときほど受診するので記録が残る、という偏りを持ちます。つまり「記録がない」こと自体が情報です。この研究は、その偏りをモデルに組み込みながら治療方針の効果を推定する道筋を示しました。", "unverified": "適用例と数値結果は抄録に記載なく未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "目的変数なしで生存予測モデルを比較する部分識別", "title": "Sharp Partial Identification for Survival Model Comparison Without Target Outcomes", "url": "https://arxiv.org/abs/2610.09658", "authors": "Won Gi Choi ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Choi, W. G., Kim, S.-H., & Kim, M. S. (2026). Sharp Partial Identification for Survival Model Comparison Without Target Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09658", "why": "対象集団の生存結果がまだない段階で、2つの予測モデルのリスク差の鋭い上下限を求めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "導入先の生存結果がまだない段階で、2つの固定済み生存予測モデルのBrierリスクの差を鋭く部分識別し、採用の判断に使う方法を示した（抄録）。", "p3": "展開時の要約に対する条件付き対数オッズのずれに上限を置くモデルで識別集合を導き、打ち切りデータにはCox型打ち切り推定とIPCW、ブートストラップで同時信頼帯を作った（抄録）。", "p5": "別々に識別して差をとる方法に対する幅の比は1.00〜5.73。非小細胞肺がんの施設間応用では40の評価すべてが保留（DEFER）となった（抄録）。", "fun": "新しい予測モデルを別の病院で使ってよいかは、本来その病院の結果が出るまで分かりません。この研究は「ずれがこの範囲なら」という仮定を置いて、まだ見ぬ結果の下でも言える範囲を最小限の幅で示します。結論が「まだ決められない」になる場合もはっきり出すのが誠実な点です。", "unverified": "感度パラメータの選び方は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "連続行動のバンディットでの統計的推論", "title": "Statistical Inference for Continuous Action Bandits", "url": "https://arxiv.org/abs/2610.09801", "authors": "Raphael C Kim ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Kim, R. C., Santacatterina, M., Zabih, R., Mukherjee, R., & Diaz, I. (2026). Statistical Inference for Continuous Action Bandits (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09801", "why": "適応的に集めたデータで連続的な処置の効果を推論する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "適応的に集めたデータで連続的な処置（価格や投与量など）の効果を統計的に推論する方法を示した（抄録）。", "p3": "カーネル平滑化した二重頑健推定を、適応的に集めた連続処置のデータへ拡張し、適応重み付き推定量の族の平均二乗誤差率と漸近正規性を導いた（抄録）。", "p5": "推定の下限をリグレットの関数として特徴づけ、効率とリグレットのバランスを考えた実験設計を提案し、シミュレーションで支持した（抄録）。", "fun": "ネット通販が価格を少しずつ変えて一番よい値段を探すと、集まるデータは偏ります。良さそうな価格ばかり試すからです。この研究は、そうした偏ったデータからでも「この価格の効果はこのくらい」と幅つきで言えるようにしました。もうけを追うほど推定が難しくなるという関係も示しています。", "unverified": "シミュレーションの数値は未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "木ごとに回転を入れたベイズ加法回帰木", "title": "RoBART: Bayesian Additive Regression Trees with Tree-Specific Rotations", "url": "https://arxiv.org/abs/2610.10214", "authors": "Jeongung Heo ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Heo, J., & Jeong, S. (2026). RoBART: Bayesian Additive Regression Trees with Tree-Specific Rotations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10214", "why": "軸に沿わない境界を少ない分割で表すRoBARTを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "各木に回転を持たせたベイズ加法回帰木RoBARTで、座標軸に沿わない境界を少ない分割で表せるようにした（抄録）。", "p3": "木ごとにGivens回転の列と分割点をメトロポリス・ヘイスティングスで同時に提案し、可逆性を示した。成分ごとに回転を持つ加法関数について事後収縮率を証明した（抄録）。", "p5": "RoBARTは本質的な次元に適応できるが、軸に沿ったBARTは適応できない関数が存在することを下限で示した（抄録）。", "fun": "決定木は「x<3」のように軸に平行な線でしか区切れないので、斜めの境界を表すには階段状にたくさん区切る必要があります。この研究は木ごとに座標軸を回転させることで、斜めの境界を少ない区切りで表せるようにし、その利点を理論的にも証明しました。", "unverified": "実データでの性能は未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "逐次データの区間検出と偽発見率の制御", "title": "Sequential resetting procedures and false discovery rate", "url": "https://arxiv.org/abs/2610.09339", "authors": "Qiuqi Wang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Wang, Q., Wang, R., & Zhang, Z. (2026). Sequential resetting procedures and false discovery rate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09339", "why": "順に届く仮説から帰無仮説が崩れる区間を、FDRを制御して特定する方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "順に届くデータの中で帰無仮説が崩れている区間を、偽発見率（FDR）を制御して特定する逐次リセット手順を提案した（抄録）。", "p3": "e値と検定超マルチンゲールに基づく手順と、情報の少ない点を除く改良版を作り、独立な場合と依存のある場合でFDRの上限を導いた（抄録）。", "p5": "FDRの上限は検定期間によらず、一般の場合はいつ止めても有効だが対数の因子が加わる。LLMの電子透かし検出と金融のバックテストに応用した（抄録）。", "fun": "データが次々届く中で「どこからどこまでが異常か」を見つけたいとき、何度も検定すると偶然の当たりが増えてしまいます。この方法は、いつ止めても誤りの割合を保証しつつ区間を切り出します。AIが書いた文章の検出に使えるという応用も現代的です。", "unverified": "応用例の数値結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "パターン認識と段階的推論は連続体の両端", "title": "The Dichotomy Between Pattern Recognition and Step-by-Step Reasoning", "url": "https://arxiv.org/abs/2610.09186", "authors": "Amrut Nadgir ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Nadgir, A., Chaudhari, P., & Balasubramanian, V. (2026). The Dichotomy Between Pattern Recognition and Step-by-Step Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09186", "why": "次トークンの依存構造からLLMが段階的推論を学ぶ条件を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "パターン認識と段階的推論を連続体の両端と捉え、次トークンが直前の少ない文脈だけに依存するときLLMが段階的推論を学ぶことを示した（抄録）。", "p3": "直前c個のトークンだけに依存する場合、推論の軌跡をDe Bruijnグラフ上の経路として表し、辺の数と軌跡の数を比べた。Qwen2.5-1.5B-Instructを方程式と物語の質問で微調整して検証した（抄録）。", "p5": "辺の数は軌跡の数に比べて無視できるほど少なく、必要な学習サンプル数は辺の数のべき乗則に従った。頻繁な状態（小さいc）は精度を上げるが、テスト時の撹乱に弱くなった（抄録）。", "fun": "計算の途中経過を書かせるとAIの正答率が上がるのはなぜか。この論文は、途中の「状態」を書くことで、次の一手が直前の少しの情報だけで決まるようになり、短い手順の組み合わせで長い問題を解けるようになるからだ、とグラフの言葉で説明しました。", "unverified": "大規模モデルでの再現は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "表形式基盤モデルの遡及的推論", "title": "Thinking in Depth: Retrospective Inference for Tabular Foundation Models", "url": "https://arxiv.org/abs/2610.10317", "authors": "Hao-Run Cai ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Cai, H.-R., Liu, S.-Y., Cheng, Z.-J., Yu, K.-Y., Sheng, J.-H., Yu, G., Liu, C., Zhou, Z., Jiang, J.-P., Guo, L.-Z., & Ye, H.-J. (2026). Thinking in Depth: Retrospective Inference for Tabular Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10317", "why": "表形式基盤モデルの推論時の計算を深めて予測を改善する手法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式基盤モデルの予測の改善が後半の層に偏ることを見つけ、途中の層の情報を後で振り返って再利用する「遡及的推論」のモデルRetroを提案した（抄録）。", "p3": "深さ方向の寄与を適応的に重み付けするAttention Residualsと、問い合わせごとに注意の出力を要素単位で調整するGated Attentionを組み合わせた（抄録）。", "p5": "Retroは予測の改善をより早い層に広く分散させた。TabArena、TALENT、RelArenaで評価した（順位の詳細は抄録の途中までしか読めず）（抄録）。", "fun": "表のデータを読むAIは何層も重ねた計算で答えを磨きますが、実際に答えが良くなるのは最後の数層に集中していました。この研究は、後の層が前の層のメモを読み返せるようにすることで、途中の計算も無駄にしない設計にしました。", "unverified": "ベンチマークでの順位・数値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "自己進化する推論モデルの崩壊を問いの質から防ぐ", "title": "Questioning the Questions: Sustaining Self-Evolution in Reasoning Models", "url": "https://arxiv.org/abs/2610.04299", "authors": "Jinyuan Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "apa": "Li, J., Huang, C., Huang, L., Cai, D., Gao, S., Yang, Y., & Huang, J. (2026). Questioning the Questions: Sustaining Self-Evolution in Reasoning Models (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.04299", "why": "自分で作った問題で学ぶ推論モデルが劣化する原因を分析し、持続させる方法を示した（HF投票60）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "自分で作った問題で学ぶ推論モデルが回を重ねて崩壊する原因を突き止め、問題の妥当性と新規性のフィードバックで自己進化を持続させるR-Questを提案した（抄録）。", "p3": "崩壊の原因として、解けない不正な問題の増加と、表現が違うだけの同じ数学問題の繰り返しを特定した。解答者に不正な問題を見抜かせ、その判断で出題者の報酬と学習データを選別し、固定した基盤モデルで問題対の新規性を判定した（抄録）。", "p5": "数学推論・一般推論・コード生成の12ベンチマークで2系統のモデルとも平均性能が最高で、10回の自己進化を通じて安定して伸び、最終回で最高になった（抄録）。", "fun": "自分で問題を作って自分で解くAIは、そのうち変な問題や似た問題ばかり作って伸びなくなります。この研究は、AIに「これは問題として成り立っていない」「前と同じだ」と判断させ、出題の質を保つことで成長を続けさせました。良い問いを立てる力が学びを支えるという話です。", "unverified": "ベンチマークごとの数値は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "再帰ループ型Transformer", "title": "Recurrent Looped Transformer", "url": "https://arxiv.org/abs/2610.07591", "authors": "Yifan Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "apa": "Zhang, Y., Feng, J., & Qin, S. (2026). Recurrent Looped Transformer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07591", "why": "入力ごとに状態を更新する再帰型の構造で、状態追跡の課題を解く（HF投票23）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "層を並列の因果エンコーダと再帰デコーダに分け、トークンごとに前の状態を引き継ぐRecurrent Looped Transformerで、長い系列の状態追跡を可能にした（抄録）。", "p3": "8層の5通りの分け方を8層の通常Transformerと6つのアルゴリズム課題で、3シードずつ比較した（抄録）。", "p5": "最大40ビットで学習し、2つの分け方は256ビットのパリティを全シードで100%正答（Transformerは偶然水準）。訓練長の8倍のS5置換追跡で97%（Transformerは1%未満）、剰余算で最大93%（同33%）（抄録）。", "fun": "「1が偶数個か奇数個か」を数える問題は、人間には簡単でもTransformerは長い列になると解けません。一つずつ状態を更新するという、昔ながらの再帰的な計算を組み込むだけで、訓練の6倍以上の長さでも完璧に解けたのは印象的な結果です。", "unverified": "自然言語タスクでの効果は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "KL正則化方策最適化の整理", "title": "On KL-Regularized Policy Optimization", "url": "https://arxiv.org/abs/2610.08963", "authors": "Yifan Zhang", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "apa": "Zhang, Y. (2026). On KL-Regularized Policy Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08963", "why": "非同期強化学習で古い方策から生成した軌跡を使う際のKL正則化を理論的に整理した（HF投票19）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "非同期の強化学習で古い方策が生成した軌跡を使うとき、KL正則化を生成側に固定することで、重要度重みも批評家も使わずに更新できるKLPOを提案した（抄録）。", "p3": "正則化した改善ステップの閉形式のギブス解を使い、その対数比の最適性条件を生成側の軌跡で最小二乗にあてはめた。切片を消して対数分配関数を回避した（抄録）。", "p5": "終端の報酬から批評家なしで勾配を計算でき、KL項の独立なモンテカルロ推定で勾配が不偏であることを示した。SPPO、GPO、REBEL、BPOが特殊例になる（抄録）。", "fun": "AIエージェントの強化学習では、学習中の自分と少し前の自分が作ったデータの食い違いが問題になります。この論文は、基準点を「データを作った側」に置き直すことで、補正の重みを使わずに済む式を導きました。既存の複数の手法が同じ式の特殊例として整理できるのも見通しの良さです。", "unverified": "実験での性能比較は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "世界-行動モデルの文脈を長くする", "title": "Long-WAM: Scaling the Context of World-Action Models", "url": "https://arxiv.org/abs/2610.10528", "authors": "Wei Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "apa": "Huang, W., Zhang, B., Liu, C., Liu, I., Yang, S., Mao, W., Wang, L., Xiao, Y., Lin, W., Hu, Q., Chu, B., Liu, S., Fan, L., Qi, X., Han, S., & Chen, Y. (2026). Long-WAM: Scaling the Context of World-Action Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10528", "why": "ロボット制御で長い視覚履歴を遅延なく使うためのモデルとシステムの設計（HF投票84）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "ロボットの世界-行動モデルで、自己回帰的に事前学習した動画基盤を使うと長い視覚履歴が成功率の向上に結びつくことを示し、リアルタイムで動くLong-WAMを作った（抄録）。", "p3": "行動ラベルのないロボット・一人称動画で因果的な予測を学び、その構造を保ったまま行動に適応させた。ストリーミング符号化と非同期実行で実機に載せた（抄録）。", "p5": "RoboCasa GR-1で文脈を0から19.2秒に延ばすと成功率は63.3%から78.7%に上がったが、双方向に事前学習した初期値では向上しなかった。RTX 5090で1回の行動生成は107.4 ms、動的なカップ積みは95%成功（比較の2手法は20回中0回）（抄録）。", "fun": "ロボットに過去の映像を長く見せれば賢くなりそうですが、実際には「見られる」ことと「活かせる」ことは別でした。過去から未来を予測する形で動画を学んでおくと、長い履歴が初めて役に立ったというのが核心です。人も経験を未来の予測に結びつけてこそ使えるのと似ています。", "unverified": "各ベンチマークの数値の詳細は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "関税が自国の厚生を高めるのはいつか：200年の事例", "title": "When Does a Tariff Pay? Theory, Two Centuries of Episodes, and the American Experiment of 2025-26", "url": "https://doi.org/10.2139/ssrn.7574118", "authors": "Anirban Majumdar", "venue": "SSRN", "date": "2026-10-07", "apa": "Majumdar, A. (2026). When Does a Tariff Pay? Theory, Two Centuries of Episodes, and the American Experiment of 2025-26. https://doi.org/10.2139/ssrn.7574118", "why": "一つの会計恒等式で関税の厚生条件と過去の事例の頻度を整理した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "関税が課す国の厚生を高めるのはどんな条件か、それが歴史上どれだけ成り立ったかを、1つの会計恒等式から整理した（抄録）。", "p3": "単一輸入市場の線形モデルで厚生変化を交易条件の利益と死荷重に分解し、関税収入・投入費用・報復・市場の失敗を加えた「厚生の帳簿」で14の命題を示し、1930年代から2025〜26年までの24の事例を同じ基準で採点した（抄録）。", "p5": "24事例のうち総合で「上げた」とされたものはなく、9つが「下げた」、9つが「混合」だった。2025〜26年はドルが7.75%下落し実効関税率が上がった（抄録）。", "fun": "関税で国が得をするのは、輸入品を安く買いたたける（交易条件が良くなる）分が、高い値段で買い控えが起きる損を上回るときだけです。この論文は、その単純な帳簿で200年分の関税の事例を採点し、明確に得をした例がなかったと示しました。", "unverified": "「混合」以外の残り事例の分類は抄録が途中で切れており未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "熟練労働者の残留は新規雇用を締め出すか", "title": "Gray Areas: How Does Retaining Experienced Workers Crowd Out New Ones?", "url": "https://doi.org/10.2139/ssrn.7572760", "authors": "Maria Zhu ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Zhu, M., Shibuya, Y., Black, I., & Hasan, S. (2026). Gray Areas: How Does Retaining Experienced Workers Crowd Out New Ones? https://doi.org/10.2139/ssrn.7572760", "why": "企業の年齢構成と若年採用の関係を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "熟練した年長者が多く残る企業では、若手の昇進が詰まり定着率が下がることを示した（抄録）。", "p3": "生産上の必要と年齢構成・昇進の混雑・定着を結ぶモデルを作り、Revelioの雇用者-被雇用者データで検証した。退職誘因の予期せぬ変化で労働需要と無関係な高齢化の効果を分離した（抄録）。", "p5": "抽象的な技能への依存が大きい企業ほど年齢構成が上に厚く、若手は昇進見通しが弱く満足度と定着率が低かった。企業特殊的な技能を育てる若手向けのキャリア開発は、この問題を和らげた（抄録）。", "fun": "ベテランが辞めずに残ってくれるのは会社にとってありがたい反面、上のポストが空かず若手が伸び悩みます。この研究は、その「詰まり」が若手の離職につながることをデータで示し、会社独自の技能を育てる研修が対策になることも示しました。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "インフレ目標は企業のマークアップ拡大を抑えるか", "title": "Does Inflation Targeting Restrain Sellers' Inflation? Firm-Level Evidence from 52 Countries", "url": "https://doi.org/10.2139/ssrn.7583699", "authors": "Jorge Sepúlveda Velásquez ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Velásquez, J. S., Griñen, P. T., & Pastén-Henríquez, B. (2026). Does Inflation Targeting Restrain Sellers’ Inflation? Firm-Level Evidence from 52 Countries. https://doi.org/10.2139/ssrn.7583699", "why": "52か国の企業データで、金融政策の枠組みとインフレ時の価格設定の関係を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "インフレ目標政策の国では、インフレ時に企業が利幅を広げる「売り手インフレ」が抑えられるかを52か国の企業データで検証した（抄録）。", "p3": "2000〜2024年の非金融上場企業4,687社のパネルで、固定効果とDriscoll-Kraay標準誤差、傾向スコアマッチング、段階的DIDを組み合わせた（抄録）。", "p5": "収益性のインフレ感応度はインフレ目標国とそれ以外で有意に違わなかった。段階的DIDでは導入後にROA・ROE・売上高利益率が約1.7・3.5・3.5ポイント高かったが、EBITDAマージンには差がなかった（抄録）。", "fun": "物価が上がるとき、企業が便乗して値上げ幅を大きくするのでは、という議論があります。中央銀行がインフレ率の目標を掲げる国ではそれが抑えられるかを調べると、インフレへの反応に差はありませんでした。一方で目標導入後に利益率が上がっていたという、予想と別の発見があります。", "unverified": "利益率上昇の要因は抄録が途中で切れており未確認。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "コピュラの構造変化を平滑検定で検出", "title": "Detecting Copula Structural Changes: A Smooth Testing Approach", "url": "https://arxiv.org/abs/2610.09351", "authors": "Shiyao Huang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Huang, S., & Song, X. (2026). Detecting Copula Structural Changes: A Smooth Testing Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09351", "why": "多変量動学モデルの誤差コピュラの構造変化を検定する方法を開発した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多変量動学モデルの誤差の依存構造（コピュラ）が途中で変わったかを、ブートストラップも帯域幅選択も不要な平滑検定で調べる方法を開発した（抄録）。", "p3": "コピュラが一定であることからのずれを一般化フーリエ係数で表し、それらの同時有意性を検定した。展開次数はデータから自動で選ぶ（抄録）。", "p5": "推定した残差を使っても検定量は漸近的にχ²分布に従い（オラクル性）、局所対立仮説に対して非自明な検出力を持つ。為替と株式収益率に応用した（抄録）。", "fun": "株や為替は、平常時と危機時で「一緒に動く度合い」が変わります。この研究は、その連動の仕方そのものがいつ変わったかを見つける検定を、重い再計算なしでできるようにしました。危機の前後でリスクの測り方を切り替える根拠になります。", "unverified": "応用結果の詳細は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "マクロ経済に関係する気候指数を集合VARで作る", "title": "Building Macroeconomically Relevant Climate Indices via the Assemblage VAR", "url": "https://arxiv.org/abs/2610.10043", "authors": "Christophe Barrette ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Barrette, C., Coulombe, P. G., & Reinicke, T. (2026). Building Macroeconomically Relevant Climate Indices via the Assemblage VAR (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10043", "why": "気候指数の構成と構造推論を同時に扱うVARを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "マクロ経済に関係する気候指数の構成を、VARの尤度利得を最大にするよう重みごと推定する「Assemblage VAR」を提案した（抄録）。", "p3": "非負の集計重みとVARのパラメータを同時に推定し、成分空間と順位空間の2つの版を作り、米国のActuaries Climate IndexとNOAAの細分データに適用した（抄録）。", "p5": "集計した気候指標を使うVARは、固定重みの基準より大きな景気後退方向のインパルス応答を示した。重みは強風の変数と分布の裾に置かれ、海面水位のようなゆっくりした成分には置かれなかった（抄録）。", "fun": "「気候の悪化」を一つの数字にまとめるとき、気温・風・海面のどれをどれだけ重視するかで結論が変わります。この研究は重みを人が決めず、経済の動きをいちばんよく説明する重みをデータに選ばせました。結果として強風や極端な値が重視されたのは直感にも合います。", "unverified": "インパルス応答の大きさの数値は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "正解のない問いへのLLM評価に表明選好法を使う", "title": "Validity Without Ground Truth: What Stated-Preference Economics Offers the Evaluation of Language Models", "url": "https://arxiv.org/abs/2610.10506", "authors": "Daniel Robert Kling Alexander ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Alexander, D. R. K., & Kling, C. L. (2026). Validity Without Ground Truth: What Stated-Preference Economics Offers the Evaluation of Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10506", "why": "経済学の表明選好の妥当性概念をLLM評価に持ち込んだ。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "正解のない問いに答えるLLMを、表明選好経済学の妥当性の枠組み（内容・構成概念・基準関連妥当性、信頼性、誘因両立性など）で評価する方法を提案した（抄録）。", "p3": "公表済みの水質の表明選好評価の調査（Vossler et al. 2023）を6つのモデルに回答させ、需要曲線が右下がりか、支払意思額が財の規模や所得に反応するかを検定した（抄録）。", "p5": "検定はモデルを鋭く分け、古い2モデルは世帯所得7万5千ドルで最も基本的な検定に失敗し、最新の2モデルはすべての理論的妥当性の検定に通ったが収束的妥当性では分かれた（抄録）。", "fun": "「きれいな川にいくら払う？」のような問いには正解がありません。経済学者は昔から、答えが理屈に合っているか（値段が上がれば買う量が減るか等）で調査の質を見てきました。その考え方をAIの評価に使うと、新旧のモデルの差がくっきり出たそうです。ただし理屈に合うことは正しいことと同じではない、という注意も添えられています。", "unverified": "モデル名は抄録に記載なく未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "集中型入学選考で確認すべき優先権の申告", "title": "Selective Verification in Centralized Admissions: Which Priority Claims Must Be Checked?", "url": "https://arxiv.org/abs/2610.10131", "authors": "Varun Bansal ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Bansal, V., Ertemel, S., Kumar, R., & Pham, A. (2026). Selective Verification in Centralized Admissions: Which Priority Claims Must Be Checked? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10131", "why": "すべての申告を確認せずに公正を保つ選択的確認の設計を理論的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "集中型の入学選考で、自己申告の優先権（居住地・兄弟・所得）のうち、結果を変えうるものだけを確認すれば、全件確認と同じ結果を保てることを示した（抄録）。", "p3": "申告が学校の合格ラインを越えさせうるかの正確で簡単な判定を与え、学校の暫定選択を変えうる場合だけ確認する方針を受入保留方式に組み込んだ（抄録）。", "p5": "全件確認と同じ出願・不合格・配属をすべて再現した。模擬市場では確認件数を事前全件確認より76%、初到達時確認より36%減らした。選好と資格の正直な申告は弱支配戦略だった（抄録）。", "fun": "学校の入学選考で「近所に住んでいる」などの申告を全部確かめるのは大変です。でも結果に影響しない申告は確かめなくてよいはず。この研究は「ファイルではなく決定を確認せよ」という原則で、確認の手間を4分の1にしても結果がまったく変わらない方法を示しました。", "unverified": "実データでの検証はない。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "米中貿易戦争の輸出効果は比較優位で異なる（因果フォレスト）", "title": "Export Effects Shaped by Revealed Comparative Advantage: Causal Forest Evidence from the US-China Trade War", "url": "https://doi.org/10.2139/ssrn.7569358", "authors": "Kang Keun Rhee ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Rhee, K. K., Lee, J., & Nguyen, D. (2026). Export Effects Shaped by Revealed Comparative Advantage: Causal Forest Evidence from the US-China Trade War. https://doi.org/10.2139/ssrn.7569358", "why": "HS8桁の輸出データで効果の異質性を因果フォレストで推定した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米中貿易戦争による中国の対米輸出の減少が、製品ごとの戦前の顕示比較優位（RCA）によって大きく異なることを因果フォレストで示した（抄録）。", "p3": "HS8桁の輸出データを因果フォレストで分析し、変数重要度・最良線形射影・部分依存プロットで異質性の要因を調べ、DIDパネル回帰で確認した（抄録）。", "p5": "RCAが効果の異質性の主因で、RCAが3.5以上になると輸出減少が急に大きくなる非線形の閾値が見られた（抄録）。", "fun": "関税で一番打撃を受けたのは、中国がもともと強かった製品でした。直感とは逆に見えますが、強い製品ほど米国市場への依存が大きく、狙われやすかったとも考えられます。機械学習で「どの製品にどれだけ効いたか」を細かく分けた点が新しいところです。", "unverified": "閾値の頑健性は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "謝礼で所得データの質は上がるか（SIPP）", "title": "The Icing on the Cake&nbsp;The Effects of Monetary Incentives on Income Data Quality in the SIPP", "url": "https://doi.org/10.2139/ssrn.7566461", "authors": "Shalise Ayromloo ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Ayromloo, S., & Eggleston, J. (2026). The Icing on the Cake&nbsp;The Effects of Monetary Incentives on Income Data Quality in the SIPP. https://doi.org/10.2139/ssrn.7566461", "why": "調査の金銭的誘因が無回答と測定誤差に与える効果を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国SIPP調査で、謝礼が所得項目の無回答と測定誤差を減らすかを無作為化実験で検証した（抄録）。", "p3": "2014年SIPPの第1・2波で行われた無作為の謝礼実験を使い、労働所得と投資所得の項目無回答・測定誤差を比べた（抄録）。", "p5": "謝礼を受けた世帯は無回答率が勤労所得で1.3ポイント、社会保障所得で1.5ポイント低く、測定誤差は利子所得で6.31ポイント、配当所得で16.48ポイント低かった（抄録）。", "fun": "アンケートでお礼を渡すと回答者が増えることは知られていますが、答えの「正確さ」まで上がるかは別の問題です。この研究は、お礼を受け取った家庭ほど所得の記入漏れや誤りが減ったことを実験で示しました。特に配当のように思い出しにくい項目で効果が大きかったのが興味深い点です。", "unverified": "測定誤差の定義の詳細は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "顧客の競争戦略が仕入先のコスト構造に浸透する", "title": "Strategy Internalization: Customer Competitive Strategies and Supplier Cost Structure", "url": "https://doi.org/10.2139/ssrn.7581519", "authors": "Rong Huang ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Huang, R., Ma, B., & Zhao, S. (2026). Strategy Internalization: Customer Competitive Strategies and Supplier Cost Structure. https://doi.org/10.2139/ssrn.7581519", "why": "機械学習による戦略分類で、顧客の戦略と仕入先の固定費比率の関係を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "主要顧客の競争戦略（差別化かコストリーダーシップか）が、仕入先の固定費と変動費の比率に反映されることを示した（抄録）。", "p3": "ラベル付き潜在ディリクレ配分（L-LDA）で主要顧客の戦略志向を測り、仕入先のコスト構造との関係を分析した（抄録）。", "p5": "差別化志向の顧客を持つ仕入先は固定費の多い硬直的な構造、コスト志向の顧客を持つ仕入先は柔軟な構造をとり、混雑リスクが高い場合や関係が短い場合などで強まった（抄録）。", "fun": "取引先が「品質で勝負する会社」か「安さで勝負する会社」かで、部品メーカーの設備の持ち方まで変わるという結果です。顧客の戦略が、文章の分析を通じて見えるようになり、それが取引の連鎖をたどって仕入先の費用構造にまで伝わる様子がデータで見えたのが面白い点です。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "ファッションの再販は過剰生産を抑えるか", "title": "Does Fashion Resale Curb Overproduction?", "url": "https://doi.org/10.2139/ssrn.7573578", "authors": "Luyi Gui ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Gui, L., Long, X., & Pang, B. (2026). Does Fashion Resale Curb Overproduction? https://doi.org/10.2139/ssrn.7573578", "why": "再販が新品購入を置き換えるか追加消費を生むかを分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ファッションの再販市場が過剰生産を減らすかを、消費者の多様性志向を組み込んだ耐久財の再販モデルで分析した（抄録）。", "p3": "耐久財の再販の古典的枠組みに、ファッション特有の「いろいろ着たい」欲求を加え、取引の摩擦、プラットフォームの種類、拡大生産者責任の効果を理論的に検討した（抄録）。", "p5": "摩擦のない再販市場は必ず成立するがファッションの生産を増やす。取引の摩擦（手数料など）がむしろ生産を減らしうる。独立の再販プラットフォームのほうがこの役割に向く（抄録）。", "fun": "古着の売り買いは環境に良いと言われますが、「売れるなら買おう」と新品の購入も増えるかもしれません。この理論研究は、手軽すぎる再販はかえって生産を増やし、適度な手数料がある仲介のほうが環境に良いという逆説を示しました。", "unverified": "実証的な検証はない。"}}, {"id": "pn40", "rank": 40, "field": "経営学", "headline": "誰もがAIを持つときのマーケティング優位", "title": "When Everyone has AI: A Theory of Marketing Advantage under Algorithmic Parity", "url": "https://doi.org/10.2139/ssrn.7575263", "authors": "Adithya Reddy Nalla", "venue": "SSRN", "date": "2026-10-08", "apa": "Nalla, A. R. (2026). When Everyone has AI: A Theory of Marketing Advantage under Algorithmic Parity. https://doi.org/10.2139/ssrn.7575263", "why": "AIが共通基盤になったときに企業の優位がどこから生まれるかの理論。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "競合が同等のAIを使える「アルゴリズム的同等性」の下では、AI導入そのものの優位は薄れ、ブランド・独自データ・信頼など希少な補完資産の価値が上がるという理論を示した（抄録）。", "p3": "5つの補完資産を「差別化資本」と定義し、生成AIでコンテンツは豊富になるが注意は希少になる「合成コンテンツの逆説」を含む8つの反証可能な命題を、様式化モデルから導いた（抄録）。", "p5": "既存の二次的証拠の監査では命題は方向として整合したが、直接検証された例は少なかった。新しい実験データはなく、5つの事前登録研究と2つの新指標を提案した（抄録）。", "fun": "どの会社も同じAIを使えるようになると、AIを使うこと自体はもう強みになりません。この論文は、そのとき差がつくのはブランドや自社だけのデータ、客の信頼といった「AIで作れないもの」だと主張します。作るのが簡単になるほど人の注意が奪い合いになるという逆説も面白い視点です。", "unverified": "命題の実証は今後の課題。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "暗号資産オークションでの公開情報の役割", "title": "The Role of Public Information in Strategic Financial Marketsevidence from Cryptocurrency Auctions", "url": "https://doi.org/10.2139/ssrn.7577260", "authors": "Adrian Casillas", "venue": "SSRN", "date": "2026-10-08", "apa": "Casillas, A. (2026). The Role of Public Information in Strategic Financial Marketsevidence from Cryptocurrency Auctions. https://doi.org/10.2139/ssrn.7577260", "why": "イーサリアムの一位価格封印入札で私的・公的信号が観測できる利点を使って公開情報の効果を調べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "イーサリアムの採掘の一位価格封印入札データを使い、公開情報が価格に与える効果が主に競争の減少を通じて働くことを示した（抄録）。", "p3": "入札者の私的信号と公的信号が観測できる特徴を生かし、競争が内生的な場合と固定した場合で公開度の効果を比べた（抄録）。", "p5": "競争が内生的なとき、公開度が10ポイント上がると1回あたりの参加者は0.387人減り、価値で標準化した売り手余剰は6.71ポイント下がった。競争を固定すると公開度1ポイント増で余剰は8.14ベーシスポイント上がった（抄録）。", "fun": "情報を公開すれば入札は公正になり、売り手も得をしそうに思えます。ところが実際には、みんなが同じ情報を持つと「どうせ勝てない」と参加者が減り、結果的に値段が下がっていました。参加者の数を固定すると効果の向きが逆になるという、符号の反転がこの研究の見どころです。", "unverified": "データの期間と規模は未確認。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "大規模防災訓練で非公式の情報交換が増える", "title": "Off the record, on the ground: The rise of informal information exchange during a full-scale emergency management exercise", "url": "https://doi.org/10.2139/ssrn.7578306", "authors": "Andrea Bartolucci ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Bartolucci, A., Ivanov, M., Anfuso, C., & Bravo Laguna, C. (2026). Off the record, on the ground: The rise of informal information exchange during a full-scale emergency management exercise. https://doi.org/10.2139/ssrn.7578306", "why": "緊急時に公式の指揮系統と並行する非公式の情報交換を観察した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "大規模な防災訓練で、公式の指揮系統と並行して非公式の情報交換が自然に生まれ、現場の調整を担う一方で分断と責任の空白を生むことを示した（抄録）。", "p3": "電子メールの交換の社会ネットワーク分析、質問紙、半構造化インタビューを組み合わせた混合研究法を用いた（抄録）。", "p5": "公式のネットワークは調整役に集中し現場チーム間の直接のやり取りがなかった一方、非公式のネットワークは分散的で密だった。戦略・戦術は公式、現場の調整は即座に非公式ツールへ移る3層構造が現れた（抄録）。", "fun": "災害対応は上意下達の指揮系統で動くと想定されていますが、実際の訓練では現場の人たちがすぐにチャットや電話で横につながりました。速く動ける反面、誰が何を決めたか分からなくなる危うさもあります。計画と現実のずれを、通信記録のネットワークとして可視化した点が面白いところです。", "unverified": "訓練の規模（参加人数）は未確認。"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "学生への社会保険番号の一斉付与と早期の正規雇用", "title": "Social Insurance Without a Job: School-Linked Benefits and Early Formalization in Mexico", "url": "https://doi.org/10.2139/ssrn.7583663", "authors": "Alain Pineda", "venue": "SSRN", "date": "2026-10-08", "apa": "Pineda, A. (2026). Social Insurance Without a Job: School-Linked Benefits and Early Formalization in Mexico. https://doi.org/10.2139/ssrn.7583663", "why": "メキシコの600万人超の学生登録政策の効果を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "メキシコで2016年に600万人超の学生へ社会保障番号を付けて医療保険に個別登録した政策が、若者を非正規雇用に向かわせず、むしろ正規雇用への入り口になったことを示した（抄録）。", "p3": "導入時に在学中だった出生コホートと少し年上のコホートを比べ、その差を州ごとの導入前の非正規率で変化させる設計を用いた（抄録）。", "p5": "非正規率が高かった州ほど、対象コホートの正規雇用は隣接コホートより伸び、非正規雇用はむしろ減った。反応は賃金雇用に集中し、自営では見られなかった（抄録）。", "fun": "仕事と切り離した社会保障は「正規で働く理由を減らす」と心配されがちです。ところがメキシコでは、学生一人ひとりに番号を渡して保険を見える形にしたことで、かえって正規の就職が増えました。正規雇用に必要な番号を先に持たせたことが入り口になったという説明が面白い点です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "学校間競争は保護者の発言を弱めるか（スウェーデン）", "title": "Competition and Voice in Public Education: Evidence from Sweden 1 In Press, Education Finance and Policy", "url": "https://doi.org/10.2139/ssrn.7580998", "authors": "Karl Wennberg ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Wennberg, K., Sebhatu, A., Lakomaa, E., & Brandén, M. (2026). Competition and Voice in Public Education: Evidence from Sweden 1 In Press, Education Finance and Policy. https://doi.org/10.2139/ssrn.7580998", "why": "学校選択制の競争が保護者の関与に与える影響を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "スウェーデンで学校選択制による競争を導入した自治体では、保護者の苦情（発言）が減ったことを示した（抄録）。", "p3": "ハーシュマンの「退出と発言」の理論に基づき、競争を導入した自治体とそうでない自治体を頑健な二方向固定効果の差の差法で比べた（抄録）。", "p5": "競争導入後に学校への苦情は減ったが、学校の問題の減少や教員の質・離職の変化では説明できず、保護者が懸念を口にする度合いが変わったと解釈された（抄録）。", "fun": "学校を選べるようになると、不満のある親は文句を言うより転校させるようになるかもしれません。この研究では、競争の導入後に苦情は減ったのに学校の質は上がっていませんでした。苦情が減ることを「良くなった」と読み違える危うさを示しています。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "地元を離れられない学生にとってのコミュニティカレッジ", "title": "Mobility Without Development? Community Colleges, Place-Bound Students, and the Geography of Opportunity", "url": "https://doi.org/10.35542/osf.io/hfk92_v2", "authors": "Agelo Thalassinidis", "venue": "EdArXiv", "date": "2026-10-07", "apa": "Thalassinidis, A. (2026). Mobility Without Development? Community Colleges, Place-Bound Students, and the Geography of Opportunity. https://doi.org/10.35542/osf.io/hfk92_v2", "why": "5つの研究で、地域の経済発展なしに移動しない学生の上昇移動は可能かを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "地元を離れにくい学生に上昇移動を約束するコミュニティカレッジが、地域の経済発展なしにその約束を果たせるかを5つの研究で問うた（抄録）。", "p3": "国勢調査とIRSの記録、ベンチャー投資とIPOの集中、916の使命声明・802の戦略計画・316の認証改善計画の文書分析を組み合わせた（抄録）。", "p5": "持ち運べる技術系の卒業生はほぼすべての州から流出していた。同じ準学士レベルの仕事は賃金の高い州で実質12〜53%多く払われた。文書が拘束力を持つほど地域経済への関与の記述はほぼ消えた（抄録）。", "fun": "地元の短大は「ここで学べば豊かになれる」と約束しますが、良い仕事が地元になければ、技術を身につけた卒業生ほど出ていきます。この研究は、学校の計画書が具体的になるほど地域経済への約束が消えていくことまで文書で示し、教育だけでは地域の機会を作れないことを浮かび上がらせました。", "unverified": "各研究の推定方法の詳細は未確認。"}}, {"id": "pn46", "rank": 46, "field": "教育", "headline": "教師のユーモアと学業成績：師弟関係の媒介", "title": "Teacher Humour and Academic Achievement: The Mediating Role of the Teacher-Student Relationship in a Longitudinal Multilevel Study", "url": "https://doi.org/10.2139/ssrn.7583094", "authors": "Sonja Bieg ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Bieg, S., & Banaruee, H. (2026). Teacher Humour and Academic Achievement: The Mediating Role of the Teacher-Student Relationship in a Longitudinal Multilevel Study. https://doi.org/10.2139/ssrn.7583094", "why": "縦断マルチレベル分析でユーモアの種類と成績の関係を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "教師のユーモアの種類によって、師弟関係を通じた学業成績への効果が異なることを縦断マルチレベル分析で示した（抄録）。", "p3": "63の英語クラスの9年生1,273人を1年間3時点で追跡し、マルチレベル構造方程式モデルで教師レベルと生徒レベルの経路を分けた（抄録）。", "p5": "授業内容に関するユーモアは師弟関係を良くし、両レベルで成績への正の間接効果を持った。攻撃的なユーモアは関係を悪くし、教師レベルで負の間接効果を持った。自虐的なユーモアは関係にも成績にも関連しなかった（抄録）。", "fun": "面白い先生は人気がありますが、どんな冗談でもよいわけではありません。授業内容に絡めた冗談は生徒との関係を良くして成績にもつながる一方、生徒をからかう冗談は逆効果でした。自虐ネタは良くも悪くもないというのは意外な結果です。", "unverified": "成績は自己申告で、客観的な成績での確認は未確認。"}}, {"id": "pn47", "rank": 47, "field": "教育", "headline": "LLMによる構造化採点の診断的な質", "title": "Beyond Score Accuracy: Examining the Diagnostic Quality of LLM-Generated Structured Assessment in Higher Education", "url": "https://arxiv.org/abs/2610.09460", "authors": "Xi Zhao ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Zhao, X., Jiao, X., & Xu, Z. (2026). Beyond Score Accuracy: Examining the Diagnostic Quality of LLM-Generated Structured Assessment in Higher Education (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09460", "why": "大学での自動採点で、点数の精度を超えたフィードバックの質を評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大学の自動採点でLLMが出す多次元の点数とフィードバックが、見かけほどの診断的な情報を持たないことを示した（抄録）。", "p3": "計算機科学の50問への3,041件の回答（JorGPTデータ）を教員と3つの商用LLMが採点したデータで、見かけと実際の質の食い違いを分析した（抄録）。", "p5": "下位次元の点数は互いに強く相関し（r=0.82〜0.99、VIF最大45）、独立の情報を持たなかった。誤概念の検出は5〜7%で教員の15〜31%を大きく下回り、口調は回答の質によらず一様に肯定的だった（抄録）。", "fun": "AIの採点は観点ごとの点数や丁寧なコメントがついて、いかにも詳しく見えます。ところが観点別の点数はほとんど同じことを言っていて、学生の思い違いを見抜く力は先生の数分の一でした。見た目の丁寧さと中身の診断力は別物だという、教育でAIを使う際の大事な注意です。", "unverified": "使った3つのLLMの名前は未確認。"}}, {"id": "pn48", "rank": 48, "field": "因果推論", "headline": "差の差法と機械学習による因果推論の比較", "title": "Difference-In-Differences And Machine Learning Causal Inference: A Comparison From The Perspective Of Data Structure", "url": "https://doi.org/10.2139/ssrn.7580738", "authors": "Weijia Wang", "venue": "SSRN", "date": "2026-10-08", "apa": "Wang, W. (2026). Difference-In-Differences And Machine Learning Causal Inference: A Comparison From The Perspective Of Data Structure. https://doi.org/10.2139/ssrn.7580738", "why": "平行トレンドと無交絡というそれぞれの識別仮定をデータ構造の観点から比べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "差の差法（平行トレンド）と機械学習の因果推定（無交絡）を、1つのモデルの下で比べ、データ構造によってどちらが使えるかを明確にした（抄録）。", "p3": "観測されない個体効果と共変量による傾向を持つ未処置結果のモデルで各推定量の確率極限を導き、16のモンテカルロ実験とLaLondeデータで確かめた（抄録）。", "p5": "横断推定は学習器によらず観測されない交絡を残し、条件付き差の差法はどちらも残さない。二重頑健な差の差法の偏りは2つの誤差の共分散に等しい。平均効果は差の差法、異質性はフォレストに任せる分担を示した（抄録）。", "fun": "政策の効果を測る方法には、前後の変化を比べる「差の差法」と、似た人どうしを機械学習で比べる方法があります。この論文は両者を同じ土俵に置き、どの偏りが残るかを数式で示しました。「平均は差の差法、ばらつきは機械学習」という役割分担の提案は実務的です。", "unverified": "各結果の導出の前提は未確認。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "Teamsでの協働の効果を決める課題適合と同期性", "title": "Task-Technology Fit and Communication Synchronicity as Drivers of Microsoft Teams Collaboration Effectiveness: Evidence from Users in Bangladesh", "url": "https://doi.org/10.2139/ssrn.7571758", "authors": "Hasin Sadad Abir ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Sadad Abir, H., & Mannan, K. A. (2026). Task-Technology Fit and Communication Synchronicity as Drivers of Microsoft Teams Collaboration Effectiveness: Evidence from Users in Bangladesh. https://doi.org/10.2139/ssrn.7571758", "why": "オンライン協働基盤の機能と同期・非同期コミュニケーションの役割を利用者調査で検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "Microsoft Teamsでの協働の効果を、課題-技術適合（TTF）とコミュニケーションの同期性（CS）がそれぞれ独立に説明することを示した（抄録）。", "p3": "バングラデシュの利用者385人の横断調査で、標準化した合成得点による回帰と交互作用を検定した。信頼性はα=0.515〜0.565と控えめだった（抄録）。", "p5": "TTF（β=.257）とCS（β=.211）はともに協働効果と正に関連し、分散の15.6%を説明した。交互作用は有意でなかった（β=.016、p=.716）（抄録）。", "fun": "オンライン会議ツールでうまく協働できるかは、ツールが仕事に合っているかと、すぐやり取りできるかの両方で決まるようです。ただ、2つが掛け算のように強め合うわけではありませんでした。信頼性の低さを隠さず報告している点は、調査研究として誠実です。", "unverified": "信頼性が低いため結果の頑健性は未確認。"}}, {"id": "pn50", "rank": 50, "field": "情報システム", "headline": "カンボジアの電子商取引導入の初期段階", "title": "E-Business Adoption in Cambodia's Emerging Digital Economy: Evidence from a 2016 Study", "url": "https://doi.org/10.2139/ssrn.7569638", "authors": "Sophearith Yorn", "venue": "SSRN", "date": "2026-10-07", "apa": "Yorn, S. (2026). E-Business Adoption in Cambodia’s Emerging Digital Economy: Evidence from a 2016 Study. https://doi.org/10.2139/ssrn.7569638", "why": "2016年の調査を再分析し、デジタル経済の形成期の導入要因を記録した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "2016年のカンボジアの電子商取引の導入条件を、当時の調査を再検討して記録した（抄録）。", "p3": "2016年7〜8月のオンライン調査200件に、通信・決済・規制の当時の資料と、現地のデジタル企業の事例を組み合わせた（抄録）。", "p5": "接続の拡大はオンライン市場へのアクセスを生んだが、取引する準備は同じようには整わなかったという「初期デジタル化の逆説」を示した（抄録）。", "fun": "スマホでネットにつながる人が増えても、すぐにネットで買い物をするようになるわけではありません。決済の仕組みや信頼がそろうまでには時間がかかります。10年前の調査を今読み直すことで、デジタル化の「つながる」と「使える」の間の溝を記録した研究です。", "unverified": "調査の標本の代表性は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "LLMエージェント数千体の網で分極化が自然発生", "title": "Emergence of polarization in networks of large language model agents", "url": "https://doi.org/10.1038/s41467-026-78228-y", "authors": "Jinghua Piao ほか", "venue": "Nature Communications", "date": "2026-10-08", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Piao, J., Lu, Z., Gao, C., Xu, F., Hu, Q., Santos, F. P., Li, Y., & Evans, J. (2026). Emergence of polarization in networks of large language model agents. Nature Communications. https://doi.org/10.1038/s41467-026-78228-y", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社のページは本文まで取得できず、掲載ページの抄録を使用", "preprint": false, "p1": "数千のLLMエージェントがLLMに導かれた会話で意見を更新するネットワークで、意見の分極化と、同類どうしが集まる人間らしい社会ネットワークが自然に生まれることを示し、LLMエージェントを意見動態と介入策の合成的な試験台として使えることを示した（抄録）。", "p2": "LLMエージェントは社会ネットワークを作り、政治的な問題について意見を共有・分岐させるようになったが、その集団的な振る舞いとメカニズムの理解は不十分だった（抄録）。", "p3": "GPT-3.5、GPT-4o、ChatGLM、Llama-3、DeepSeek-V3を基盤とする数千のエージェントが会話を通じて相互作用し、時間とともに意見を更新するネットワークをシミュレートした（抄録）。", "p4": "評価は、エージェントが自発的に作るネットワークの性質（同類性によるクラスタ化など）と、集団の意見の変化が人間の行動の実証研究や意見動態モデルで知られた現象と整合するかである。さらに、多様な相互作用の促進や確証バイアスの低減など、ネットワークレベル・個人レベルの介入の効果を調べた（抄録）。", "p5": "エージェントは意見の分極化を示し、同類性によるクラスタ化など人間の社会ネットワークに特徴的な性質を持つネットワークを自発的に形成した。集団の意見は、人間の実証研究と意見動態モデルで議論される行動パターンと整合する形で変化した（抄録）。介入の効果の数値は抄録に記載がない。", "p6": "抄録の範囲では、著者が明示する限界は確認できない。解釈：LLMエージェントの振る舞いが人間と「整合する」ことと、人間社会への介入効果を予測できることは別であり、試験台で有効だった介入が人間集団でも効くかは別途の検証が必要である。基盤モデルによる違いの大きさも本文で確かめる必要がある。", "fun": "AIどうしに政治の話をさせて意見を変え合わせると、人間社会と同じように、似た意見の者どうしで固まり、意見が二極に分かれていきました。誰も分断するように教えていないのに、です。逆に言えば、AIの社会で「いろいろな相手と話させる」などの対策を試してから、人間社会での対策を考える実験室として使える可能性があります。", "unverified": "エージェント数、ラウンド数、介入ごとの効果の大きさは抄録になく未確認。"}}, {"id": "jr02", "rank": 2, "headline": "グラフ畳み込みで損傷時の橋の全体剛性を即時予測", "title": "A graph convolutional network method for rapid global stiffness prediction under multiple damage scenarios", "url": "https://doi.org/10.1177/14759217261484557", "authors": "Dawei Liu ほか", "venue": "Structural Health Monitoring", "date": "2026-10-08", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Liu, D., Li, C., Bao, Y., Dong, Y., & Liu, X. (2026). A graph convolutional network method for rapid global stiffness prediction under multiple damage scenarios. Structural Health Monitoring. https://doi.org/10.1177/14759217261484557", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "グラフ畳み込みネットワーク（GCN）で、橋梁の4種類の損傷（フーチングの沈下、支承の外れ、鋼材の腐食、ひび割れ）による全体剛性の低下を、有限要素解析より速く最大誤差1.86%で予測できることを示した（抄録）。", "p2": "損傷が耐荷力を大きく損なうため、損傷時の全体剛性の予測は構造ヘルスモニタリングで重要だが、損傷シナリオでの剛性低下と耐荷力評価の研究は限られている（抄録）。", "p3": "構造をグラフとして表し、隣接行列で4種類の損傷シナリオの構造的特徴をラベル付けし、初期剛性やモニタリングデータを事前情報として組み込んだGCNを作った。有限要素モデルで各損傷の進行に伴う全体剛性の低下を計算し、損傷の発生から重度までの低下パターンをネットワークに学習させた（抄録）。", "p4": "初期と重度の損傷段階を含む試験データで精度を検証し、実橋の事例研究で4種類の損傷による剛性低下の予測を示した。比較対象は深層ニューラルネットワーク（DNN）と有限要素解析である（抄録）。", "p5": "4種類の損傷について剛性低下を最大誤差1.86%で予測し、DNNより高精度で、有限要素解析に比べ計算時間を大幅に短縮した（抄録）。", "p6": "抄録の範囲では、学習データが有限要素モデルの計算結果に基づくため、モデル化誤差（境界条件や材料特性の不確かさ）が実橋での予測にどう影響するかは確認できない。解釈：実橋事例で「モニタリングデータ」がどの計測（ひずみ・変位・振動）を指すかも本文で確かめる必要がある。", "fun": "橋の部材をつながりの網（グラフ）として表すと、どこが傷むと全体の硬さがどれだけ落ちるかを、つながり方ごとAIに学ばせることができます。支承が外れる、基礎が沈むといった種類の違う傷みを一つの枠組みで扱い、重い有限要素計算をせずに硬さの低下を当てられるのが利点です。", "unverified": "実橋の名称・計測内容と、DNNとの精度差の数値は抄録になく未確認。"}}, {"id": "jr03", "rank": 3, "headline": "デジタルツインと転移学習で模型斜張橋の損傷同定", "title": "Digital twin-driven cross-domain damage identification for experimental cable-stayed bridge models under sparse sensing", "url": "https://doi.org/10.1177/10567895261492160", "authors": "Naiwei Lu ほか", "venue": "International Journal of Damage Mechanics", "date": "2026-10-08", "citescore": 8.5, "citescore_year": "2025", "apa": "Lu, N., Cui, J., Luo, Y., & Beer, M. (2026). Digital twin-driven cross-domain damage identification for experimental cable-stayed bridge models under sparse sensing. International Journal of Damage Mechanics. https://doi.org/10.1177/10567895261492160", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "数値シミュレーションで学習した残差ネットワークを転移学習で実験データに適応させるデジタルツイン駆動の枠組みで、縮小模型の斜張橋の損傷を、少ない学習データで90.9%の精度で同定した（抄録）。", "p2": "従来の構造ヘルスモニタリングは、データのラベル付けの負担と、数値モデルと実物の応答の食い違い（ドメインの差）が実装の障害になっている（抄録）。", "p3": "多数のシミュレーションの損傷状態で残差ネットワーク（ResNet）を学習し、転移学習で数値領域と実験領域に共通する（ドメイン不変な）特徴を取り出す。データ駆動のモデル化と適応的な転移学習を組み合わせ、領域をまたぐ汎化の差を埋める（抄録）。", "p4": "縮小模型の斜張橋での実験で、ドメインシフトの緩和効果を検証した。比較対象は、実験データだけで学習する戦略、ドメイン整合なしの部分的転移、GoogLeNetとAlexNetで、評価は損傷同定の正解率と計算量である（抄録）。", "p5": "少ない学習データで正解率90.9%を達成し、計算負荷も大きく減った。実験データのみの学習は83.1%、ドメイン整合なしの部分転移は73.4%だった。GoogLeNetとAlexNetとの比較でも優れた性能と頑健性を示した（抄録）。", "p6": "抄録の範囲では、縮小模型での実験にとどまり、実橋の環境変動（温度、交通）の下での性能は確認できない。解釈：損傷のクラス数や計測点の数（「疎な計測」の程度）によって正解率の意味が変わるため、本文で確かめる必要がある。", "fun": "コンピュータの中の橋の模型で傷のパターンをたくさん学ばせても、本物の橋の揺れとは少しずつ違うので、そのままでは使えません。この研究は、計算と実物の両方に共通する特徴だけを取り出す「転移学習」で、その違いを埋めました。模型の斜張橋で、実物だけで学ばせるより高い正解率になったのがポイントです。", "unverified": "損傷クラスの数と計測点の配置は抄録になく未確認。"}}, {"id": "jr04", "rank": 4, "headline": "スマート技術への挑戦/阻害評価が職務再設計を分ける", "title": "From appraisal to adaptation: a dual-path model of construction project management professionals' job crafting in response to emerging smart technologies", "url": "https://doi.org/10.1108/ecam-09-2025-1428", "authors": "Yuanyuan Zhang ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-10-08", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Zhang, Y., Jia, J., Pan, X., Ma, G., & An, X. (2026). From appraisal to adaptation: a dual-path model of construction project management professionals’ job crafting in response to emerging smart technologies. Engineering, Construction and Architectural Management, 1–26. https://doi.org/10.1108/ecam-09-2025-1428", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "建設プロジェクト管理の専門職315人の調査で、新しいスマート技術（BIM、ビッグデータ、クラウド、ロボット）の導入を「挑戦」と評価すると役割の幅の自己効力感を通じて、「阻害」と評価すると自我消耗を通じて、3種類のジョブ・クラフティングにつながる二経路を示した（抄録）。", "p2": "建設業でのスマート技術導入の推進要因は多く研究されてきたが、その導入が管理専門職の心理と行動にどう影響するかはほとんど分かっていない（抄録）。", "p3": "ストレスの交流モデルと自己決定理論に基づき、「ストレス評価→心理状態→行動反応」の理論モデルを作った。挑戦評価・阻害評価が、役割の幅の自己効力感・自我消耗を媒介して、3つの形のジョブ・クラフティング（仕事の自主的な再設計）に結びつくとし、誠実性を調整変数とした（抄録）。", "p4": "建設プロジェクト管理の専門職315人の標本で、媒介と調整の仮説を検定した（抄録）。測定の時点数や分析手法の詳細は抄録に記載がない。", "p5": "挑戦評価は役割の幅の自己効力感と、阻害評価は自我消耗と正に関連した。自己効力感と自我消耗は、それぞれの評価と3形態のジョブ・クラフティングの関係を媒介した。誠実性は阻害評価と自我消耗の関係を強めたが、挑戦評価と自己効力感の関係への調整効果は支持されなかった（抄録）。", "p6": "抄録の範囲では、横断調査か縦断調査かが確認できず、因果の方向は断定できない。解釈：自己報告の同時測定による共通方法バイアスへの対処も本文で確かめる必要がある。", "fun": "新しい技術を「腕を広げるチャンス」と受け取る人は自信を深めて仕事を工夫し、「邪魔もの」と受け取る人は疲れ切ってしまう。同じ技術でも受け取り方で道が分かれるという話です。まじめな人ほど邪魔だと感じたときの消耗が大きいという結果は、責任感の強い人へのサポートの大切さを示唆します。", "unverified": "効果の大きさの数値と調査の時点数は抄録になく未確認。"}}, {"id": "jr05", "rank": 5, "headline": "財務困窮企業の値下げ競争が業界に困窮を伝染", "title": "Feedback and Contagion through Distressed Competition", "url": "https://doi.org/10.1111/jofi.70080", "authors": "HUI CHEN ほか", "venue": "Journal of Finance", "date": "2026-10-08", "sjr": 22.27, "citescore": 16.8, "citescore_year": "2025", "apa": "CHEN, H., DOU, W. W., GUO, H., & JI, Y. (2026). Feedback and Contagion through Distressed Competition. The Journal of Finance. https://doi.org/10.1111/jofi.70080", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパー版（2026年6月改訂）のPDF本文（序論、較正表の抜粋、結論）を読んだ。モデルの導出と数値結果の節は概略のみ", "preprint": false, "p1": "財務困窮が企業の競争を激化させ、それが利益率を下げてさらに困窮を深め、同業他社にも波及するという「困窮競争」のフィードバックと伝染を、長期の債務不履行リスクを持つ動学モデルに戦略的競争を組み込んで示した（抄録、結論）。", "p2": "市場集中が進み、少数の大企業が暗黙の協調で高い利益率を保つ産業が増えているが、財務困窮の脅威と戦略的競争の相互作用は理論的に扱われてこなかった。また、収益性と負債比率が負に相関するという実証の事実は、伝統的なトレードオフ理論と矛盾する（序論）。", "p3": "繰り返しゲームの暗黙の協調では、裏切った相手は非協調の競争で報復される。困窮で債務不履行の確率が上がると企業は「せっかち」になり（割引率の内生的上昇）、将来の協調利益の価値が下がって協調の誘因両立制約が厳しくなる。その結果、企業が自ら選ばなくても利益率を下げざるを得なくなり、それがさらに困窮を深める（序論、図1）。単純モデルの後に、需要過程の持続性、柔軟な需要体系、内生的な債務不履行の境界、参入を含む定量モデルを作った（序論）。", "p4": "主な貢献は理論で、定量モデルをBaa格付けの負債比率、10年の債務不履行率（4.9%）、純収益性、粗利益率などのデータの値に較正した（較正表）。実証の補強は姉妹論文とインターネット付録に委ねている（序論）。", "p5": "較正したモデルは負債比率31%（データ34%）、粗利益率30.9%（同31.4%）などを再現した（較正表）。フィードバック効果は負債に伴う新しい困窮費用となり、産業間の収益性と負債の負の関係を説明する。伝染効果により、企業の最適な負債比率は産業全体から見ると過大になりがちで、産業の金融安定を損なう。伝染は集中度・負債比率が高く参入の脅威が小さい産業で強い（抄録、序論）。", "p6": "著者は、株式発行を無費用としていることを単純化として認め、流動性制約や現金保有、リスク管理との同時決定への拡張を課題とする（結論）。解釈：結果は暗黙の協調が成り立つ集中産業を前提としており、競争的な産業や中小企業が多い産業への適用には注意が要る。", "fun": "借金で苦しい会社は「今日の現金」が大事になり、同業者との暗黙の値下げ休戦を破りがちです。すると業界全体の利益が下がり、元気だった会社まで苦しくなる。この論文は、こうした連鎖を数式で表し、もうかる業界ほど借金を控える理由を説明しました。借金が自分だけでなく業界全体の問題になるという視点が新しいところです。", "unverified": "定量モデルの伝染効果の大きさ（数値シミュレーションの結果）は読んでいない。"}}, {"id": "jr06", "rank": 6, "headline": "社会的安全/脅威を測る20項目尺度を開発・検証", "title": "Social Safety Questionnaire: Development and Validation of a Psychometric Scale Assessing Social Safety and Social Threat", "url": "https://doi.org/10.1177/10731911261484451", "authors": "Dimitris I. Tsomokos ほか", "venue": "Assessment", "date": "2026-10-08", "sjr": 2.04, "citescore": 10.4, "citescore_year": "2025", "apa": "Tsomokos, D. I., Alley, J., Mengelkoch, S., Norman, J. B., & Slavich, G. M. (2026). Social Safety Questionnaire: Development and Validation of a Psychometric Scale Assessing Social Safety and Social Threat. Assessment. https://doi.org/10.1177/10731911261484451", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "社会的安全理論の中心概念である社会的安全と社会的脅威を測る初めての尺度として、20項目の社会的安全質問紙（SSQ）を開発・検証し、4因子構造と心理的苦痛への強い予測力を示した（抄録）。", "p2": "社会的安全理論は、社会的に安全か脅かされているかの知覚が健康と行動を形づくると考えるが、その構成概念を測る道具がなかった（抄録）。", "p3": "事前登録（osf.io/qaeh3）のうえで、地域在住の成人503人の標本で20項目の質問紙を開発し、因子構造を調べた（抄録）。項目の生成手順や因子分析の具体的な手法は抄録に記載がない。", "p4": "収束・弁別妥当性として、知覚された社会的支援、社会的安心感、孤独、心理的苦痛、日常的差別との相関を調べ、年齢・性別・人種/民族・主観的社会経済的地位を統制した回帰で心理的苦痛の予測力を評価した（抄録）。", "p5": "社会的拒絶、社会的支援、社会的受容、対人信頼の4因子が見つかった。社会的安全は知覚された社会的支援（r=.75）・社会的安心感（r=.81）と正に、孤独（r=−.53）・心理的苦痛（r=−.64）・日常的差別（r=−.51）と負に相関した。SSQ単独で心理的苦痛の分散の41.4%を説明し、統制後も苦痛の低さを予測した（標準化β=−.60）（抄録）。", "p6": "抄録の範囲では、単一の地域標本の横断データで、再検査の安定性や測定不変性（集団間で同じ意味で測れているか）は確認できない。解釈：社会的支援との相関が.75と高く、既存の支援尺度との弁別性を本文で確かめる必要がある。", "fun": "「自分は周りに受け入れられ、安全だ」という感覚は、心と体の健康を左右すると考えられています。でも、それを測る物差しがありませんでした。この研究は20問でその感覚を測る質問紙を作り、点数だけで心の苦しさのばらつきの4割を説明できることを示しました。安心感を数字で扱えるようにした点が大きな一歩です。", "unverified": "4因子それぞれの項目数と信頼性係数は抄録になく未確認。"}}, {"id": "jr07", "rank": 7, "headline": "高齢社員のAI評価は挑戦なら追い風・脅威なら逆風", "title": "When technology meets aging: the paradoxical association between cognitive appraisal of AI and older employees’ successful aging at work", "url": "https://doi.org/10.3389/fpubh.2026.1956559", "authors": "郝雨洁, Jiayi Wang", "venue": "Frontiers in Public Health", "date": "2026-10-07", "citescore": 6.4, "citescore_year": "2025", "apa": "Hao, Y., & Wang, J. (2026). When technology meets aging: the paradoxical association between cognitive appraisal of AI and older employees’ successful aging at work. Frontiers in Public Health, 14. https://doi.org/10.3389/fpubh.2026.1956559", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "出版社（Frontiers）のPDF本文（研究設計、主効果・媒介・調整の結果、限界の節）を読んだ", "preprint": false, "p1": "中国の45歳以上の従業員558人の調査で、AIを「挑戦」と評価すると仕事上の成功的加齢と正に、「脅威」と評価すると負に関連し、どちらも仕事の自律性を介し、選択・最適化・補償（SOC）方略が正の経路を強め負の経路を和らげることを示した（抄録、§4）。", "p2": "人口の高齢化と職場のデジタル化が重なるなかで、高齢従業員がAIをどう受け止めるかと仕事上の成功的加齢の関係、その仕組みは十分に分かっていなかった（§1）。", "p3": "仕事の要求度-資源（JD-R）モデルに基づき、AIの挑戦評価（資源獲得の経路）と脅威評価（要求・損失の経路）が仕事の自律性を介して成功的加齢に関連し、SOC方略がこれらを調整するという調整付き媒介モデルを立てた。Stata 17で階層的回帰と5,000回のブートストラップで検定した（抄録、§4.2）。", "p4": "2025年9〜12月に広東省4都市（広州、深圳、仏山、東莞）の協力企業の45歳以上の従業員を対象にオンライン・対面で調査した（§3.1）。単一時点の自己報告のため、共通方法バイアスを未測定潜在方法因子で確かめた（§4）。", "p5": "統制後、挑戦評価は成功的加齢を正に（β=0.32）、脅威評価は負に（β=−0.26）予測した（表3）。自律性を介した間接効果は挑戦評価で0.18、脅威評価で−0.14（95%CI [−0.24, −0.04]）だった。挑戦評価×SOCは自律性に正の係数（β=0.19）を持ち、脅威の経路の間接効果はSOCが低いと−0.17だが、高いと有意でなくなった（§4.2）。", "p6": "著者は、単一時点の自己報告による共通方法バイアスの可能性、広東省4都市の標本と集団主義文化による一般化の限界、業種の異質性を検討できなかったこと、欠落変数を完全には排除できないことを認め、縦断・多源データを勧めている（§7）。", "fun": "同じAIでも「自分の仕事の幅を広げてくれる」と感じる中高年は生き生きと働き続け、「自分の居場所を奪う」と感じる人は逆の方向に向かいます。その分かれ目にあるのが、自分で仕事の進め方を決められる自由（自律性）でした。得意なことに絞り、苦手を工夫で補う働き方が、AIへの不安を和らげるクッションになるという結果も実用的です。", "unverified": "挑戦評価の経路の間接効果の信頼区間は読んでいない。"}}, {"id": "jr08", "rank": 8, "headline": "データ科学者と現場専門家の認識論的対立を橋渡し", "title": "When Data Scientists Meet Domain Experts: Artificial Intelligence, Epistemic Conflict, and Knowledge Transformation", "url": "https://doi.org/10.1287/orsc.2023.17369", "authors": "Mayur Joshi ほか", "venue": "Organization Science", "date": "2026-10-08", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "apa": "Joshi, M., Su, N., & Zbaracki, M. (2026). When Data Scientists Meet Domain Experts: Artificial Intelligence, Epistemic Conflict, and Knowledge Transformation. Organization Science. https://doi.org/10.1287/orsc.2023.17369", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "データサイエンティストが作る予測AIが現場の専門家に受け入れられない問題を、両者の「認識論的立場」（知識をどう作り評価するか）の対立として捉え、データサイエンティストが4つの橋渡し実践によって知識の共同生産を可能にする過程を示した（抄録）。", "p2": "予測AIは組織の知識を変えると期待されるが、実際には予測が現場の専門家に理解されない。既存研究はその原因をAIの不透明さ、導入の失敗、管轄権をめぐる対立に求めてきたが、知識をどう利用可能にするかの手がかりは乏しい（抄録）。", "p3": "インドの大手銀行3行での18か月の帰納的な質的研究で、データサイエンティストと現場専門家の相互作用を追跡した（抄録）。", "p4": "評価は、対立の性質（認識論的対立と管轄権の対立の区別）と、AIの予測が実際に組織の知識として展開されたかである（抄録）。", "p5": "データサイエンティストは新しい知識を生むが、展開を決める権限は現場の専門家が持っていた。データサイエンティストはまず一方の立場に寄せる「同化的実践」で直接対立を解こうとしたが失敗し、次に予測を現場専門家が既に使っている境界物や実践に埋め込む4つの「橋渡し実践」で間接的に対処することを学んだ（抄録）。", "p6": "抄録の範囲では、事例がインドの銀行3行に限られ、他業種・他国への一般化は確認できない。解釈：4つの橋渡し実践の具体的な中身と、それが成功した条件は本文で確かめる必要がある。", "fun": "AIの専門家は「データでこう予測できる」と考え、現場のベテランは「経験と顧客を知っているから分かる」と考えます。どちらの言い分も正しいので、ぶつかるとAIは使われません。この研究では、AIの予測を現場の人がいつも使う帳票や手順の中に組み込むことで、ようやく受け入れられるようになりました。技術より翻訳の工夫が鍵だったという話です。", "unverified": "4つの橋渡し実践の具体的な内容は抄録になく未確認。"}}, {"id": "jr09", "rank": 9, "headline": "業績予想修正の開示の場の選択は戦略的シグナル", "title": "Choosing the Stage: The Strategic Role of Disclosure Venues in Guidance Revisions", "url": "https://doi.org/10.1111/1911-3846.70088", "authors": "Akash Chattopadhyay ほか", "venue": "Contemporary Accounting Research", "date": "2026-10-08", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Chattopadhyay, A., Reiter, N., & Sethuraman, M. (2026). Choosing the Stage: The Strategic Role of Disclosure Venues in Guidance Revisions. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70088", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "決算発表の間に業績予想を修正するとき、経営者が単独のリリース・ガイダンスコール・投資家カンファレンス・アナリスト/投資家デーのどこで開示するかを戦略的に選んでおり、その選択が投資家への情報になることを示した（抄録）。", "p2": "開示研究は「何を開示するか」を中心に扱ってきたが、聴衆・形式・可視性が異なる開示の「場」の選択が戦略的な伝達の判断かどうかは明らかでなかった（抄録）。", "p3": "決算発表と同時でない（分離された）業績予想修正の大規模標本で、開示の場の選択の決定要因、テキスト分析による語調、市場反応、その後の業績サプライズとアナリスト予想のばらつきを分析した（抄録）。", "p4": "評価は、修正の大きさ・方向、訴訟リスク、アナリストの意見の不一致と場の選択の関係、場ごとの言葉づかい（慎重さ・訴訟関連語・楽観性）、市場反応と事後の業績サプライズである（抄録）。標本規模と期間は抄録に記載がない。", "p5": "経営者は比較的大きな下方修正や訴訟リスクが高いときにコールを使い、小さな修正やアナリストの意見が割れているときにカンファレンスやA/Iデーを使った。コールは上方・下方とも慎重で訴訟を意識した言葉を使い、カンファレンスとA/Iデーは楽観的なままだった。コールは悪いニュースへの反応を増幅し、その後の業績サプライズは良好で、期待管理が効いていることを示唆した。カンファレンスとA/Iデーは反応を抑え、アナリストのばらつきを減らしたが、その後のサプライズは不利だった（抄録）。", "p6": "抄録の範囲では、場の選択が内生的であることへの対処（選択の偏りの補正）は確認できない。解釈：日本の適時開示の慣行とは制度が異なるため、場の選択の自由度の違いに注意が必要である。", "fun": "会社が業績見通しを下げるとき、ニュースリリース1枚で済ませるか、電話会議を開いて説明するか、投資家の集まりでさらっと触れるかを選べます。この研究によると、大きな悪いニュースほど電話会議で慎重な言葉を選び、後で良い結果を出して期待を管理していました。何を言うかだけでなく、どこで言うかも作戦の一部なのです。", "unverified": "標本規模・期間と効果の大きさの数値は抄録になく未確認。"}}, {"id": "jr10", "rank": 10, "headline": "映画レビューの感情は公開週に最高、次第に負へ", "title": "How emotions influence word-of-mouth: a temporal analysis of online movie reviews", "url": "https://doi.org/10.1108/jeim-11-2025-1109", "authors": "Rahat Ullah ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-10-08", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Ullah, R., Zeb, A., & Tufail, M. (2026). How emotions influence word-of-mouth: a temporal analysis of online movie reviews. Journal of Enterprise Information Management, 1–23. https://doi.org/10.1108/jeim-11-2025-1109", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "映画のオンラインレビューの感情的内容が、公開前から公開後にかけて「感情主導」から「情報主導」の段階へ移ることを示し、口コミの動的な2段階枠組みを提案した（抄録）。", "p2": "映画のような経験財では口コミが重要な情報源で、感情的内容が共有の原動力だが、既存研究は件数や評価の正負のような集計指標に偏り、感情の複雑で動的な役割を見落としてきた（抄録）。", "p3": "2024年公開の映画77本について、IMDbの26,055件のレビューを6週間分集め、辞書ベースの感情分析（SentiWordNet）とカイ二乗による特徴選択を組み合わせて、特定の感情的内容を時間とともに抽出・定量化した（抄録）。", "p4": "評価は、公開前から公開後にかけての感情的内容の量と、肯定・否定の非対称性の推移である（抄録）。", "p5": "口コミの感情的内容は公開週に最大になった。初期のレビューは忠実なファンの自己選択によるとみられる肯定的な偏りを示した。口コミが蓄積するにつれて感情の非対称性は小さくなり、全体と肯定的な感情は減り、否定的な感情が増えた。これは時間とともに情報が十分になることと整合した（抄録）。", "p6": "抄録の範囲では、辞書ベースの感情分析は皮肉や文脈に弱く、レビューの感情と興行収入など消費者の実際の反応との因果関係は確認できない。解釈：77本・1年分の映画に限られるため、ジャンルや規模による違いは本文で確かめる必要がある。", "fun": "映画の公開直後のレビューは熱烈なファンが書くので、どうしても甘口になります。時間がたつと普通の観客も書き込み、褒め言葉が減って冷静な評価に落ち着いていく。この研究は2万件以上のレビューの言葉から、その移り変わりを追いました。公開直後の口コミだけで判断すると、評価を高めに見積もってしまうということです。", "unverified": "感情カテゴリごとの数値の推移は抄録になく未確認。"}}, {"id": "jr11", "rank": 11, "headline": "粒子レベルの厳密解10万件で動的き裂の安定性を地図化", "title": "Exact solutions produce a full picture of crack behavior in dynamic fracture", "url": "https://doi.org/10.1073/pnas.2517238123", "authors": "Jacqueline Jensen ほか", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "date": "2026-10-07", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Jensen, J., & Marder, M. (2026). Exact solutions produce a full picture of crack behavior in dynamic fracture. Proceedings of the National Academy of Sciences, 123(41). https://doi.org/10.1073/pnas.2517238123", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "き裂を連続体の不連続ではなく粒子レベルで記述する厳密に解ける動的破壊モデルで、10万件のき裂解のカタログを作り、き裂がいつ安定かの全体像を示した（抄録）。", "p2": "破壊の理論は通常、き裂を連続体を伝わる不連続とし、き裂面の応力をゼロとして扱うが、その枠組みで得られる解析結果には限りがあった（抄録）。", "p3": "き裂を粒子（格子）レベルで記述し、散逸の大きさと一般の等方弾性係数を広く変えた動的き裂の解析解を求め、10万件のき裂解を集めて安定性を調べた（抄録）。", "p4": "評価は、き裂速度の上限（表面波速度、せん断波速度との関係）と、き裂の安定性が界面の弱さ・散逸・系の大きさによってどう変わるかである（抄録）。", "p5": "表面波速度がき裂速度の上限になる場合もあったが、せん断波速度より速い引張き裂も可能で、その安定性は弱い界面に沿って進むとき、散逸が大きいとき、系が小さいときに高まった。超音速のき裂には先端近くでの超音速のエネルギー輸送が必要という標準的見方を補強しつつ、その輸送は超弾性だけでなく散逸からも生じうることを示した（抄録）。", "p6": "抄録の範囲では、モデルが厳密に解ける理想化された格子であり、実材料の微視構造や3次元効果をどこまで表すかは確認できない。解釈：実験で観察される超音速き裂との定量的な比較は本文で確かめる必要がある。", "fun": "ひびは普通、音（せん断波）より速く走れないと考えられてきました。この研究は、物質を小さな粒の並びとして扱うと答えがきっちり計算できるモデルで、10万通りのひびを調べ、条件によっては音より速いひびも安定に走れることを示しました。エネルギーの散らばり（散逸）がかえって速いひびを支えるという意外な結果です。", "unverified": "超音速き裂が安定になる条件の定量的な範囲は抄録になく未確認。"}}, {"id": "jr12", "rank": 12, "headline": "税関連KAMの開示が多国籍企業の所得移転を抑制", "title": "Tax-Related Key Audit Matters and Changes in Multinational Income Shifting", "url": "https://doi.org/10.2308/tar-2024-0168", "authors": "Christof Beuselinck ほか", "venue": "Accounting Review", "date": "2026-10-07", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Beuselinck, C., Goldman, N. C., Pierk, J., & Valle Ruiz, C. (2026). Tax-Related Key Audit Matters and Changes in Multinational Income Shifting. The Accounting Review, 1–25. https://doi.org/10.2308/tar-2024-0168", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "拡張された監査報告書で不確実な税務ポジション（UTP）に関する監査上の主要な検討事項（KAM）が開示されると、多国籍企業の所得移転が減ることを示し、拡張監査報告の意図せざる実体的効果を明らかにした（抄録）。", "p2": "KAMは基礎となる勘定の不確実性を目立たせるが、税務関連のKAMが多国籍企業の税務計画という実際の行動を変えるかは分かっていなかった（抄録）。", "p3": "拡張監査報告書のKAM開示を使い、グループレベルのKAMがUTPに関するものである場合と、多国籍企業の所得移転の変化を関連づけた（抄録）。所得移転の測定法、標本の国・期間は抄録に記載がない。", "p4": "評価は、UTP関連KAMの開示後の所得移転の変化と、その関係が財務制約・税の執行の強さ・KAMの具体的なリスク記述と監査人の明示的な保証によってどう変わるかである（抄録）。", "p5": "UTPに関するグループレベルのKAM開示は所得移転の減少と関連した。この関係は、財務制約のない企業、税の執行が強い制度環境、KAMが具体的なリスクを記述し監査人が明示的な保証を与える場合に強かった（抄録）。効果の大きさは抄録に記載がない。", "p6": "抄録の範囲では、KAMの開示自体が企業の税務リスクの高さと相関する（内生性）ことへの対処は確認できない。解釈：日本でもKAMは導入済みであり、同じ効果が日本企業で見られるかは別途の検証課題である。", "fun": "監査人が報告書で「この会社の税金の扱いには不確かな点がある」と目立つように書くと、会社は海外の低税率国へ利益を移すような節税を控えるようになりました。監査報告を詳しくする規則は投資家への情報提供が目的でしたが、会社の行動そのものも変えたわけです。書くことが行動を変える、開示の力を示す例です。", "unverified": "所得移転の測定法と標本の国・期間は抄録になく未確認。"}}, {"id": "jr13", "rank": 13, "headline": "製造業の脱製品化とプラットフォーム化を統合する枠組み", "title": "Platform-Based Servitization: Reconciling Competing Growth Logics for Industrial Firms", "url": "https://doi.org/10.1177/10946705261480987", "authors": "Anna Salonen ほか", "venue": "Journal of Service Research", "date": "2026-10-08", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Salonen, A., Fehrer, J. A., Kowalkowski, C., Ritala, P., & Jaakkola, E. (2026). Platform-Based Servitization: Reconciling Competing Growth Logics for Industrial Firms. Journal of Service Research. https://doi.org/10.1177/10946705261480987", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "製造業の成長の論理であるサービス化（顧客との密な統合）とプラットフォーム化（エコシステムの調整と拡張性）の緊張を、129本の論文の分野横断の体系的レビューから「プラットフォーム型サービス化」として統合し、4つの構成類型と成長経路の命題を示した（抄録）。", "p2": "サービス化は顧客との関係の深さで、プラットフォーム化は拡張可能な柔軟性で価値を生むが、この2つの論理の間には本質的な緊張があり、サービス研究はそれを解決していない（抄録）。", "p3": "サービス、マーケティング、経営、情報システムの129本の論文を体系的にレビューし、製品-サービス、顧客ソリューション、イノベーション、取引の4つのプラットフォームの構成類型を導き、それらがどう重なって成長を生むかを命題として示した（抄録）。", "p4": "実証データはなく、レビューに基づく理論構築である（抄録）。", "p5": "構成の累積的な重ね合わせが強化的・変革的な成長経路を支え、データのネットワーク効果が中心的な成長メカニズムになり、「組み合わせ型ガバナンス」が競合する成長論理の緊張を管理するとした。また、顧客やサービスパートナーとの関係の深さがB2Bのプラットフォーム移行を左右する重要な条件だとした（抄録）。", "p6": "抄録の範囲では、命題は未検証である。解釈：レビューの文献選択の基準と期間が結論を左右するため、本文で確かめる必要がある。", "fun": "機械を売るだけだった会社が、保守やデータ分析のサービスを売り、さらには他社も参加できる「場」（プラットフォーム）を作る。こうした変化には、一社一社と深く付き合うことと、大勢を効率よくさばくことの両立という難題があります。この論文は、129本の研究を整理して、その難題を乗り越える道筋を地図のように示しました。", "unverified": "命題の数と具体的な内容は抄録になく未確認。"}}, {"id": "jr14", "rank": 14, "headline": "DEM-CFD結果を連続体場に変換する粗視化ツール", "title": "Pysammos 1.0.0: a discrete-to-continuum transformation Python tool to analyse the rheology of granular materials", "url": "https://doi.org/10.5194/gmd-19-9519-2026", "authors": "Claudia Elijas-Parra ほか", "venue": "Geoscientific Model Development", "date": "2026-10-08", "sjr": 2.134, "citescore": 8.8, "citescore_year": "2025", "apa": "Elijas-Parra, C., Breard, E. C. P., Morrissey, J. P., Zrelak, P. J., & Naylor, M. (2026). Pysammos 1.0.0: a discrete-to-continuum transformation Python tool to analyse the rheology of granular materials. Geoscientific Model Development, 19(19), 9519–9553. https://doi.org/10.5194/gmd-19-9519-2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Geoscientific Model Development）のHTML本文（序論、粗視化の理論、コード構成、ベンチマーク、性能、考察、結論）を読んだ。応用例の節は見出しのみ", "preprint": false, "p1": "個別要素法（DEM）と数値流体力学を連成したMFiX-DEMの粒子シミュレーション結果から、体積分率・速度・接触応力・運動テンソルなどの連続体場を作る粗視化（離散→連続変換）のオープンソースPythonパッケージPysammosを開発し、他の粗視化コードと整合する結果を示した（抄録、§6）。", "p2": "DEM-CFDは粒子間・粒子-流体間の相互作用を高解像度で計算できるが、構成則の開発に必要な連続体場を得るには離散→連続変換が要る。MFiX-DEMのように組み込みの変換機能がないソフトでは、利用者が独自の処理系を作るか、他のツールの形式に合わせる必要があった（抄録、§1）。", "p3": "粗視化は、粒子の質量・運動量・接触力を、評価点からの距離に応じた重み関数（ガウス、ヘヴィサイド、Lucy）で空間平均し、粒状体の平均化された釣り合い式を満たす連続体場を得る方法である（§2.1）。Pysammosは相の自動検出（KMeans）、k-d木による粒子探索、Numbaによる高速化を備え、多分散・任意形状の混合物や相別の解析に対応し、ParaView用のvtkhdfと汎用のh5を出力する（§3）。", "p4": "直径0.02 m・密度2,500 kg/m³の単分散立方格子に鉛直の板変位を与えた標準試料で、Iota-Suite、EDEM、Granulysed、MercuryCGと平滑化幅と重み関数を変えて比較した（§4.1、図7）。性能は一辺約95粒径の高配位数の充填試料で、粒子あたりの計算コストをARCHER2で測った（§4.2）。", "p5": "体積分率は平滑化幅によらずほぼ一定で、速度・運動量密度・運動テンソルは同じ重み付け方式のMercuryCGと一致した。接触応力は小さい平滑化幅でMercuryCGとずれたが、これは接触を平均体積に含める判定基準の違いによると説明した（図7、§4.1）。粒子あたりのコストは粒子数に対して劣線形に減った（§4.2）。", "p6": "著者は、ヘヴィサイド関数はばらつきと偏りが大きく、ガウス関数は打ち切りがあって微分可能でないため、Lucy関数を推奨している。平滑化幅の選び方、非球形粒子や境界付近の扱いにも注意が必要としている（§5.1）。解釈：対象はMFiX-DEMの出力に限られ、他のDEMソフトとの互換性は今後の課題である。", "fun": "砂や土砂の流れをコンピュータで粒一つひとつ計算すると、粒の速さや押し合う力は分かっても、「この辺りの砂はどのくらい詰まっていて、どれくらいの圧力か」という全体像は見えません。このツールは、粒の情報を周りの点に重みをつけて配り直し、なめらかな地図に変換します。砂粒の数を数えたアルキメデスにちなむ名前も洒落ています。", "unverified": "5つの応用例（掃流砂、衝突、マグマ中の結晶、杭で安定化した斜面、侵食床）の結果は読んでいない。"}}, {"id": "jr15", "rank": 15, "headline": "機会ゾーン指定の住宅供給効果の4割は空間波及", "title": "Self-starter or sidekick? Independent and spillover effects of Opportunity Zones on housing supply in cities", "url": "https://doi.org/10.1177/0308518x261486023", "authors": "Matthew D. Wilson ほか", "venue": "Environment and Planning A", "date": "2026-10-08", "sjr": 1.742, "citescore": 10.2, "citescore_year": "2025", "apa": "Wilson, M. D., Jain, K., El-Khattabi, A.-R., & Lester, T. W. (2026). Self-starter or sidekick? Independent and spillover effects of Opportunity Zones on hou
