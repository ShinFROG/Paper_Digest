<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-09", "intro": "プレプリントの新着1,341件、学術誌の新着1,226件（うち上位10%誌915件）、重要論文の候補383件、新着の公開データ117件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目40報、データ27件です。論文誌・注目は主要誌の新着候補が少なかったため件数を減らしました。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "走行車両の応答から橋の入力・状態・剛性を同時推定", "title": "An unscented universal filter for joint input-state-parameter estimation of a partially measured system: an application to drive-by structural health monitoring", "url": "https://arxiv.org/abs/2610.09468", "authors": "Zihao Liu ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Liu, Z., Kim, C.-W., & Alamdari, M. M. (2026). An unscented universal filter for joint input-state-parameter estimation of a partially measured system: an application to drive-by structural health monitoring (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09468", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化・フィルタの構成・2つの数値事例・結論の節）を読んだ", "preprint": true, "p1": "走行車両の加速度と少数の橋梁応答だけから、橋の状態（全自由度の変位・速度）・接触力・部材剛性を同時に推定する非線形フィルタ「Unscented Universal Filter（UUF）」を提案し、数値実験で既存手法より誤差が小さく安定することを示した（抄録、§7）。", "p2": "ドライブバイ計測では車両応答が路面凹凸と車両振動に支配され、橋の応答・接触力・剛性が車両-橋梁相互作用（VBI）で互いに依存する。従来のカルマン型（AEKF、DKF-UKF）は未知入力に発展モデルや統計を要し、EGDF-DFは直達行列（feedforward matrix）に階数条件を課すため使える計測構成が限られた（§1、§7）。", "p3": "未知入力をイノベーション（観測と予測の差）から重み付き最小二乗で求め、非線形の伝播はスケール付きアンセンテッド変換で線形化し、その残差も誤差共分散に入れる（§3）。路面形状は各軸で k·r＋c·v·r′ の形でしか効かないため、未知入力を路面4成分ではなく2つの接触力 f₁、f₂ に置き直した（式69–71、§4.1）。加速度のみの場合は補助積分器で擬似観測を作る（§3.7）。", "p4": "25 mの単純梁（10要素、1次振動数4.09 Hz、ISO 8608の路面クラスA〜C、30 km/h、雑音はRMSの1%）と、日本の鋼トラス橋Old Ada Bridgeの数値モデルで、AEKF・EGDF-DF・DKF-UKF・IPS-UKFと比較した（§5.1、§6）。評価は状態・入力・パラメータのNRMSEの和 E_total で、雑音共分散は真値を使わない共通の調整法で決めた（式72–77）。", "p5": "図3（横軸：剛性低下率、縦軸：E_total）では、UUFは5〜50%低下で0.13〜0.16とほぼ一定、IPS-UKFは0.12〜0.20で低下が大きいほど悪化し、AEKF・EGDF-DFは1.89〜7.70だった（§5.2）。損傷位置を変えてもUUFの変動は0.02未満だった（図7、§5.3）。Old Ada Bridgeでは加速度のみ・懸架パラメータ未知でも損傷部材の剛性を真値の2%以内で同定した（§7）。", "p6": "著者は数値研究にとどまり実橋での検証が必要とし、損傷部材を直接計測しない非同位置配置ではどの手法も剛性を同定できなかったと認めている（§7）。解釈：最大雑音レベルではIPS-UKFのほうが良く（§7）、モデル化誤差（車両・橋の質量や境界条件の誤り）への頑健性は未確認である。", "fun": "車で橋を渡るだけで橋の傷み具合が分かれば、点検はずっと安くなります。難しいのは、車の揺れには路面のでこぼこ、車のばね、橋のたわみが全部混ざっていることです。この論文は、路面の形を求めるのをやめて「タイヤが橋を押す力」として扱い直すという発想で、ばねの性質を知らなくても橋の硬さを推定できるようにしました。", "unverified": "Old Ada Bridgeでの各手法のE_totalの数値と、単一センサ配置（§6.4）の定量結果は読んでいない。"}}, {"id": "pr02", "rank": 2, "headline": "ニューラル演算子で旧阿陀橋の損傷部材を走行計測から特定", "title": "A Vehicle-Integrated Approach to Digital Twin Deployment for Bridges Through Drive-By Sensing", "url": "https://arxiv.org/abs/2610.08822", "authors": "Zihao Liu ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Liu, Z., Kawabe, D., Wang, J., Kim, C.-W., & Alamdari, M. M. (2026). A Vehicle-Integrated Approach to Digital Twin Deployment for Bridges Through Drive-By Sensing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08822", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（ICES2026の4ページの会議論文。全節と図キャプション）を読んだ", "preprint": true, "p1": "奈良県の旧阿陀橋（鋼トラス）の有限要素モデルからフーリエ・ニューラル演算子（FNO）のデジタルツインを作り、走行車両の軸加速度から損傷部材と損傷度を推定できることを数値実験で示した（§2–4）。", "p2": "ドライブバイ計測を橋の状態に変換する逆問題では、通過のたびに順解析と逆推定を回す必要があるが、全体FEMは1回の通過計算に約1分かかり遅すぎる（§1）。", "p3": "ニューラル演算子（関数から関数への写像を学ぶネットワーク）で、29部材の損傷度（ヤング率の低下）を入力に車両2軸の応答を出す順モデルと、軸応答から損傷部材と損傷度を出す逆モデルを学習した。損傷による変化は通過そのものの揺れより小さいため、健全時との差（残差）を学習させた（§2）。", "p4": "同じ路面・一定速度の2軸車の通過を1,160回（各部材40回、損傷度0.10〜0.60）計算し、986回で学習、58回で検証、116回を試験に残した（§2）。評価は試験116回での部材特定の正答数と損傷度の平均絶対誤差である（§3）。", "p5": "順モデルはFEMの車両応答をよく再現し（図4）、計算コストは大幅に小さかった。逆モデルは116回中102回で損傷部材を正しく特定し、損傷度の平均絶対誤差は0.03だった。誤りはすべて同じ弦材の隣接部材を選ぶもので、損傷度は正確だった（図5、§3）。", "p6": "著者は数値研究であり、旧阿陀橋の実測データでの検証は今後としている（§4）。解釈：抄録は日豪の実地試験、ベイズ最適化による車両設計、教師なし損傷評価まで述べるが、本文（4ページ）が扱うのはFNOの数値事例だけで、それらの結果は本文で確認できない。路面が固定のため、路面凹凸が変わる条件での頑健性も未確認である。", "fun": "車で橋を渡るたびに、橋の「分身」をコンピュータの中で動かして答え合わせができれば、傷の場所が分かります。ただ精密な計算は1回1分かかります。この研究は、計算結果を学ばせたAIを分身にすることで一瞬で答えを出しました。間違えるときは必ず隣の部材を選ぶ、というのも「見分けにくさ」をよく表しています。", "unverified": "抄録にある実地試験・ベイズ最適化・教師なし損傷評価の結果は本文になく未確認。順モデルの誤差の数値も記載がなく未確認。"}}, {"id": "pr03", "rank": 3, "headline": "交通で揺れる橋をDAS地震源として河道を時間変化撮像", "title": "Bridge Vibrations as Persistent Seismic Sources for Time-lapse Imaging of River Corridors with Distributed Acoustic Sensing", "url": "https://arxiv.org/abs/2610.09289", "authors": "Haipeng Li ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Li, H., Liu, J., Hwang, D., Noh, H. Y., & Biondi, B. (2026). Bridge Vibrations as Persistent Seismic Sources for Time-lapse Imaging of River Corridors with Distributed Acoustic Sensing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09289", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（観測設定、波動場の解析、干渉法の収束、豪雨時のdv/v監視、考察・結論の節と図キャプション）を読んだ", "preprint": true, "p1": "交通で揺れる高速道路橋を「位置の決まった持続的な地震源」とみなし、道路脇の通信用光ファイバの分布型音響センシング（DAS）で、河川沿いの地盤を時間変化まで撮像・監視できることを示した（抄録、§7）。", "p2": "河川沿いの地盤は洪水時に飽和・間隙水圧上昇・洗掘で変化するが、点の観測や間欠的な反復探査では連続的に追えない。車両起源の振動は移動する広帯域の源で、安定した経験的グリーン関数を得るには長い平均化が要る（§1、§6）。", "p3": "韓国・京釜高速道路の未使用ファイバ（4.9 m間隔に平均化、250 Hz）で、430 mの9径間箱桁橋（美湖川橋）を含む約3 kmを記録した（§2）。車両の衝撃が橋桁の曲げ共振を励起し、橋台から3〜6 Hzの基本モードのレイリー波が地盤へ放射される。橋を仮想震源とする地震波干渉法で仮想ショット記録を作り、表面波の分散から速度構造を、移動窓相互スペクトル法で相対速度変化 dv/v を求めた（§3–5）。", "p4": "2025年7月15〜25日（有効9日）の記録で、20時間の降雨前の平均を基準に1時間ごとの dv/v を求め、時間降水量・河川水位と比べた（§5.2、図8）。収束は基準（9日分の重合）とのコヒーレンスで評価した（§4.2）。", "p5": "橋の帯域（2〜8 Hz）の平均パワーは−116.0 dBで道路脇の背景より20.5 dB高かった（§3.2）。直達波は5分の重合で基準とのコヒーレンス0.98、10分で0.99を超え、コーダ波は2時間で0.95、8時間で0.99と一桁以上遅かった（図5）。豪雨時には4.6 Hzの分散で位相速度が730 m/sから678 m/sへ7.1%低下した例があり、区間全体では最大1.0%の速度低下が見られた（図7d、図8）。", "p6": "著者は、交通量の日・週変動が dv/v を変調し源の変化を完全には除けないこと、最上部数メートルへの感度が低いこと、dv/v を地下水位や深さに一意に結びつけられないことを認めている（§5.2、§6）。解釈：観測は1つの橋・1回の洪水であり、橋の構造健全性（洗掘など）への応用は提案段階である。", "fun": "橋は車が通るたびに決まった音程で鳴る「鐘」のようなものです。その揺れが地面に伝わる様子を道路脇の光ファイバで聞くと、地下の硬さが分かります。大雨で地盤が水を含むと揺れの伝わる速さがわずかに遅くなり、それを毎時間追えたのがこの研究です。交通という「雑音」を、地下を照らす光源に変えた発想の転換です。", "unverified": "表面波逆解析で得た速度構造と基盤深度の数値（§5.1）は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "取引関係が長いほど仕入先と得意先の会計が似る", "title": "Interfirm Collaboration and Accounting Comparability: Evidence from Supply Chains", "url": "https://doi.org/10.2139/ssrn.7568038", "authors": "Kai Wai Hui ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Hui, K. W., She, G., & Wang, J. (2026). Interfirm Collaboration and Accounting Comparability: Evidence from Supply Chains. https://doi.org/10.2139/ssrn.7568038", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "仕入先と得意先の取引関係が長く続くほど、両社の会計処理が似てくる（会計比較可能性が高まる）ことを示し、企業間の協働が財務報告の慣行を形づくることを明らかにした（抄録）。", "p2": "会計比較可能性（accounting comparability：同じ経済事象が企業間で同じように会計数値に表れる程度）の決定要因は、会計基準や監査人などの制度面から説明されることが多い。背景：取引相手との協働という企業間の関係が報告慣行に影響するかは、抄録の範囲では従来研究との差として示されている（抄録）。", "p3": "同じ取引関係の中での比較可能性の変化（関係内の変化）を、関係の長さに対して分析する設計である。比較可能性の上昇が、収益・原価の認識など協働に関わる会計項目の見積りの調整から来ているかも調べている（抄録）。", "p4": "抄録には、データの出所・期間・標本規模、比較可能性の具体的な測定法（例：利益-リターン関係の類似度など）の記載がない。評価は、関係の長さと比較可能性の正の関連が、経済活動や会計情報の解釈をそろえる重要性が高い状況で強まるかで行っている（抄録）。", "p5": "関係が長くなるほど関係内で比較可能性が頑健に上昇し、その上昇は協働に関わる会計項目の見積りの調整に起因した。関連は、実態や解釈の整合が重要な状況でより強かった（抄録）。数値は抄録に記載がない。", "p6": "抄録の範囲では、著者の認める限界は確認できない。解釈：関係の長い取引相手は業種や規模が似ている可能性があり、取引関係の選択による偏りをどう除いたかは本文で確かめる必要がある。", "fun": "会計のやり方は、同じ基準でも会社ごとに見積りの癖があります。この研究は、長く付き合う取引先どうしだと、売上や原価の計上の仕方が少しずつ似てくることを見つけました。仕事で協力するうちに「数字の言葉づかい」までそろっていくわけで、帳簿にも人間関係の跡が残るのが面白い点です。", "unverified": "データ・期間・比較可能性の測定法・効果の大きさはいずれも抄録になく未確認。"}}, {"id": "pr05", "rank": 5, "headline": "個人行動シミュレーションの汎用基盤モデル", "title": "Socio-Foundation: A Model for Generalizable Individual Behavior Simulation via Hierarchical Capability Distillation", "url": "https://arxiv.org/abs/2610.08967", "authors": "Liang Wang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Wang, L., Xie, W., Mou, X., Luo, Y., & Wei, Z. (2026). Socio-Foundation: A Model for Generalizable Individual Behavior Simulation via Hierarchical Capability Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08967", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（能力の分類、3段階の学習法、評価設定、主結果・アブレーション・結論の節）を読んだ。付録の詳細表は読んでいない", "preprint": true, "p1": "個人の行動をシミュレートするLLMに必要な能力を5次元（FONTS）に整理し、約1,000万件・14データセットで学習した8Bモデル「Socio-Foundation」が、元のQwen3-8Bより平均11.0ポイント高く、最先端の汎用モデルに近い性能を示した（抄録、§5.2）。", "p2": "汎用LLMは個性の違うペルソナを平板化し、アシスタント役に戻りがちである。一方、タスク別に調整した専門シミュレータは設計した課題では強いが、別の形式の課題へうまく転移しない（§1、§5.2）。", "p3": "40超のデータセットに必要な能力を注釈・クラスタ化し、McAdamsとPalsの「新ビッグファイブ」で整理して、ペルソナ忠実度（F）・成果の実現（O）・行動の自然さ（N）・軌跡の一貫性（T）・社会的接地（S）の5次元にした（§4.1）。学習は3段階で、①タスクごとにDAPO（強化学習）で専門家を作り、②同じ能力のタスク専門家をオフポリシー蒸留で能力専門家にまとめ、③5つの能力専門家を多教師オンポリシー蒸留（MOPD）で1つのモデルに統合する（§4.2–4.4）。", "p4": "5次元・11の評価目標・29指標・13ベンチマーク（6,297評価事例、分布外の2つを含む）からなるIndiEvalを作り、GPT-5.5、GLM-5.2などの汎用モデルと、同規模の専門シミュレータ5種と比べた。判定・対話相手にはDeepSeek-V4-Flashを使った（§5.1）。", "p5": "表1で、Qwen3-8B比で5次元平均が11.0ポイント向上し、29指標中24で改善した。同規模の専門シミュレータに対し86%の指標で1位か2位だった（§5.2）。表2のアブレーションでは提案法が平均61.7で、最終段をオフポリシー蒸留に替えると59.3、能力専門家の平均化で56.8、データをまとめたSFTで43.0に下がった（§5.3）。汎用モデルは特にN（自然さ）で弱かった。", "p6": "抄録・結論の範囲では、著者が明示する限界は確認できなかった。解釈：評価の判定にLLM（DeepSeek-V4-Flash）を使っており、判定モデルの偏りが結果に入りうる。また「人間らしさ」をベンチマークの指標で測っており、実在の人間集団の行動分布との一致は直接は検証されていない。", "fun": "AIに「ある一人の人」を演じさせると、どの人物を頼んでも親切なアシスタント口調に戻ってしまいがちです。この研究は、人らしく振る舞う力を「その人らしさ」「目的を果たす」「自然な話し方」「話の筋を保つ」「他人の気持ちを読む」の5つに分け、それぞれ鍛えた先生役から1つの生徒モデルに学ばせました。人格心理学の理論を学習の設計図に使った点が面白いところです。", "unverified": "表1の各モデルの次元別スコアの詳細と、付録の評価事例数の内訳は読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "IRT尺度開発で項目を残す・削る・差し替える多基準枠組み", "title": "How to Select, Retain, Delete and Replace Items in IRT-Based Scale Development: A Multi-Criteria Framework for Psychometric Optimisation", "url": "https://doi.org/10.31234/osf.io/ngw9u_v1", "authors": "Enoch Oluwatomiwo Oladunmoye", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Oladunmoye, E. O. (2026). How to Select, Retain, Delete and Replace Items in IRT-Based Scale Development: A Multi-Criteria Framework for Psychometric Optimisation. https://doi.org/10.31234/osf.io/ngw9u_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": true, "p1": "項目反応理論（IRT）で尺度を作るとき、項目を残す・削る・差し替える判断を、単一の統計量ではなく6領域の証拠を組み合わせた多基準の手順で行う枠組みを提案し、シミュレーションで単一基準のルールより偏りの少ない尺度になることを示した（抄録）。", "p2": "項目の削除は、最も低い識別力パラメータや削除後のクロンバックα（内的一貫性の係数）の変化のような単一の統計量で決められがちで、妥当性・精度・公平性への影響が見落とされる（抄録）。", "p3": "証拠を、情報量と目標の位置、モデル適合、局所依存と冗長性、特異項目機能（DIF：同じ能力でも集団によって答え方が違う項目）、回答カテゴリ、内容の代表性の6領域に整理し、「旗を立てる→調べる→比べる→決める」の順で統合する。削除・差し替えは目的で重み付けした制約付き最適化として定式化し、「項目効用プロファイル」を指標ではなく判断の補助として提案した（抄録）。", "p4": "モンテカルロ・シミュレーション（500回反復）で、局所依存の項目対とDIFのある項目を含む6領域・60項目の2パラメータ・ロジスティックの項目プールを作り、2つの測定目的の下で24項目を選ぶ5つの戦略を比べた。良さは、DIF項目と冗長な対をどれだけ除けたか、内容領域を欠かさないか、情報量の損失で評価した（抄録）。", "p5": "古典的なルールと傾きに基づくルールは、選んだ24項目にDIF項目を約4つ残し、6つの冗長な対のうち平均2.8〜3.8対をそのまま残した。情報量のみのルールは、選別の閾値付近で精度が必要な場合に33%の反復で1つの内容領域を空にした。多基準戦略はDIF項目を約1つ、冗長な対を1未満に抑え、全領域を保ったが、名目の重み付き情報量を13〜17%失った（抄録）。", "p6": "著者は、シミュレーションは例示的で既知の項目パラメータを使っており、推定したパラメータと実データでの確認が必要だと述べている（抄録）。解釈：6領域の重みを誰がどう決めるかで結論が変わりうるため、判断の記録の仕方が実務上の鍵になる。", "fun": "テストやアンケートの質問を減らすとき、「一番成績の悪い質問から削る」のは分かりやすいやり方です。でもそれだと、ある集団にだけ不利な質問が残ったり、測りたい内容の一部が丸ごと抜けたりします。この論文は、質問を削ることを統計のふるい分けではなく、目的に合わせた設計の判断として扱うべきだと、模擬実験で示しました。", "unverified": "2つの測定目的の内容と5戦略の具体的な定義は抄録になく未確認。"}}, {"id": "pr07", "rank": 7, "headline": "LLM評価エージェントは開示書類を本当に読むか", "title": "Do LLM Valuation Agents Read the Filing? Metamorphic Tests of Filing Fidelity on Korean Listed Firms", "url": "https://doi.org/10.2139/ssrn.7573358", "authors": "Dong Gyu Park", "venue": "SSRN", "date": "2026-10-08", "apa": "Park, D. G. (2026). Do LLM Valuation Agents Read the Filing? Metamorphic Tests of Filing Fidelity on Korean Listed Firms. https://doi.org/10.2139/ssrn.7573358", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMの企業価値評価エージェントが開示書類から計算しているのか、学習済みの記憶を思い出しているのかを、会計的に整合した書類の改変で理論上の正解が決まる「メタモルフィック・テスト」で検証する設計を示した（抄録）。", "p2": "結果の正確さだけでは、モデルが書類を読んで計算したのか、その企業について知っていることを思い出したのかを区別できない（抄録）。", "p3": "実際の書類に、1株あたり価値への影響が理論的に正確に決まる改変（現金・非営業資産・株式数・現金配分など）を加え、モデルの応答を較正済みの目標と比べる。韓国の上場企業150社（大型50、中型50、イン・ザ・マネーの転換社債を持つ小型50）のFY2025 DART開示を使い、事前登録の手順で約63,000回、主にGemini 2.5 Flash-Liteを呼び出した。主エージェントは計算をPythonツールに任せる（抄録）。", "p4": "事前登録した4つの主仮説（規模の弾力性、企業記憶効果、記憶の強さとの用量反応、転換社債の希薄化への過小反応）をHolm補正で検定した（抄録）。", "p5": "Holm補正後、4つの主仮説はいずれも支持されなかった。大型株の規模弾力性は0.993（95%CI 0.951–1.035）で値は財務諸表に比例し、記憶効果などは結論が出なかった。探索的分析では、改変項目は評価の橋渡しにほぼ正確に反映された（現金・非営業資産の変化の中央値1.00）が、予測の仮定が実行ごとに大きく変わり、企業価値は改変の約±4倍動いた。株式数1.007、非営業資産0.875、現金分配1.61。企業名は学習時点の株価へ値を引き寄せ（係数0.245、p=0.003）、自分で計算するエージェントは約98%の実行で自分の計算を誤って報告した（抄録）。", "p6": "抄録の範囲では、主に1つのモデル（Gemini 2.5 Flash-Lite）での結果であることが限界と読める。解釈：他のモデルや他国の開示で同じ傾向が出るかは未確認で、仮定の固定や平均化を施した場合の精度も本文で確かめる必要がある。", "fun": "AIに決算書を渡して会社の値段を計算させたとき、本当に書類を読んでいるのかを確かめるのは意外に難しい問題です。この研究は、書類の現金を少し増やすなど答えの変化が理屈で決まる「わざとの書き換え」を入れて、AIの答えが正しく動くかを見ました。会社名を見ると昔の株価に引っ張られるという結果は、AIの記憶の癖をよく表しています。", "unverified": "本文の検定の詳細と、他モデルでの結果は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "拡張Bスプラインと罰則法による高精度MPM摩擦接触", "title": "A high-fidelity material point method for frictional contact problems", "url": "https://doi.org/10.82444/warw.33900406", "authors": "Emmanouil G. Kakouris ほか", "venue": "University of Warwick", "date": "2026-10-08", "apa": "Kakouris, E. G., Chatzis, M. N., & Triantafyllou, S. (2024). A high-fidelity material point method for frictional contact problems (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33900406", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "ウォーリック大学リポジトリの著者版PDF（導入、手法の概要、数値例4.1・4.3・4.5、結論）を読んだ。式の導出（§2–3）は概略のみ", "preprint": true, "p1": "物質点法（MPM）で摩擦接触を扱う新しいアルゴリズムを示した。各物体の離散化された境界で罰則法により接触力を評価し、拡張Bスプライン（EBS）の基底を組み合わせることで、接触面の応力誤差と見かけの隙間を抑えた（抄録、§5）。", "p2": "標準的なMPMの接触法（多速度場法）は接触面の変形性を正確に表せず、物体が実際に触れる前に接触したとみなす「見かけの隙間」が生じる。また、物質点が格子セルをまたぐときの誤差（cell-crossing）と、境界セルに小さな領域しかないときの不完全な数値積分による応力誤差が問題だった（§1）。", "p3": "質量を持つ境界物質点で物体の境界を追跡し、点と線分の間の法線方向のギャップ関数で法線接触力を、接線方向のすべり関数とクーロン摩擦で接線力を罰則法で計算する（§3.6、§5）。EBSは隣接セル間で基底関数の勾配が連続なのでセルまたぎの誤差を抑え、小さな領域しかない境界セルでも積分誤差を小さくする（§1、§3.3）。", "p4": "自重を受ける2本の棒の1次元圧縮（解析解あり）、2本の棒の縦衝突、ヘルツ接触（2円板、半球と剛体平面）、2つのネオ・フック円柱の衝突、粒状体（円板の配列）の応力波伝播（文献の光弾性実験と比較）で検証し、標準Bスプライン（OBS）や既存のMPM接触法と比べた（§4）。", "p5": "1次元圧縮では、棒の格子に対する位置を6通り（0〜+0.083 m）ずらしても、EBSは解析解の応力をよく再現したが、OBSは接触点で大きな誤差を示した（図9、図10、§4.1）。ヘルツ接触では接触長さが理論とよく一致し既往のMPM結果より良かった（図17）。粒状体の応力波では、摩擦係数0.5の条件を含め、光弾性の縞模様が実験とよく一致し、格子幅1.25 mmで収束した（図28、図30）。", "p6": "著者は、摩耗と自己接触は今後の課題で、準静的・陰的時間積分の版を開発中としている（§5）。解釈：罰則パラメータの選び方（式40）が結果に与える感度は本文の範囲で十分に示されておらず、大変形で接触相手が頻繁に変わる多数粒子系での計算コストも未確認である。", "fun": "物質点法は、物体を細かい粒の集まりとして扱い、背景の方眼の上で動きを計算する方法で、土砂崩れや衝突の計算に使われます。弱点は、2つの物体が触れる瞬間をうまく扱えないことでした。この研究は、物体の輪郭に重さを持つ点を置いて接触を直接判定し、なめらかな基底関数で誤差を抑えました。円板を並べて叩く実験の縞模様まで再現できたのが見どころです。", "unverified": "縦衝突（§4.2）とネオ・フック円柱（§4.4）の定量結果、エネルギー保存の比較の数値は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "マルチエージェントは相互作用で均質化する", "title": "Homogenization in Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.09824", "authors": "Prakhar Ganesh ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Ganesh, P., Wilson, K., Zappella, L., Theobald, B.-J., Apostoloff, N., Paes, L. M., & Sivakumar, N. (2026). Homogenization in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09824", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（均質化の定義、3つの応用の設定、結果、対策の検討の節）を読んだ。付録の詳細結果は読んでいない", "preprint": true, "p1": "LLMのマルチエージェントシステム（MAS）では、エージェント間の相互作用によって判断が似通う「均質化（homogenization）」が起き、相関した誤り・偏りの持続・分野間の評価格差という実害につながることを、3つの指標と3つの応用で示した（抄録、§4–5）。", "p2": "MASは複数のエージェントの多様な判断を生かすことが前提だが、評価は全体の性能に偏り、相互作用が多様性をどう損なうかは体系的に測られていなかった（§1）。", "p3": "オーケストレータが各エージェントの点数と根拠を集約して全員に返す方式を、5ラウンド・10試行で回した（§3、§4.1）。均質化を、①エージェント間の点数の分散が減る「同調」、②平均が尺度の端へ寄る「分極」、③ラウンド間の平均の変化が小さくなる「慣性」の3指標で定義した（定義3.2–3.4）。同じ基盤モデルの別ペルソナのエージェントで構成し、異なるモデルの混成も試した（§4.1）。", "p4": "コード生成（CodeLMSecの280課題、CodeQLで脆弱性検査）、採用（200の求人-履歴書対に性別・民族の40の反実仮想版、計8,000件）、査読（ICLR 2025の1,950件と主分野）を対象に、Qwen3、DeepSeek-V4、Nemotron-3、Kimi-K2などで評価した（§4.1）。害は、展開可能と判定された脆弱なコード、偏ったエージェントを2ラウンドだけ入れた後の偏りの持続、分野別平均点の広がりで測った（§5）。", "p5": "図3で、エージェント間の点数分散は多くの設定でラウンドを経て約0.5倍以下に減り、平均は最大0.5点ほど端へ寄り、最終ラウンドの変化は最初のラウンドの約0.2倍未満になった（§4.2）。コード生成では脆弱性の全体率は最大50%下がったが、特定の型（例：URLリダイレクト）はラウンドとともに増え、複数モデルで共通した（図4）。採用では偏ったエージェントを除いた後も偏りが残り（図5）、査読では分野間の平均点の差が広がった（図6）。サンプリングの乱数や異なるモデルの混成でも均質化は解消しなかった（§6）。", "p6": "著者は、評価をMAS全体の性能から多様性の動態へ広げる必要があるとし、緩和策の設計を今後の課題とする（§7）。解釈：対象はオーケストレータ型の1つの構造で、エージェントが互いの根拠を直接読む熟議型や、意見の独立性を保つ仕組みのある構造で同じ結果になるかは未確認である。", "fun": "会議で意見を出し合ううちに、みんなの考えが似てきて、最初の誤りが誰にも直されないまま固まってしまうことがあります。AIのチームでも同じことが起きるとこの研究は示しました。偏ったAIを途中で外しても偏りが残るのは、人間の集団の同調圧力にそっくりです。違う会社のAIを混ぜても解決しなかったのは意外な結果です。", "unverified": "モデル別の均質化の強さの詳細（付録D）と、採用での偏りの大きさの数値は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "買い手がAIのときのB2Bマーケティング", "title": "When the Buyer Is a Machine: Marketing to AI Purchasing Agents in Business-to-Business Markets", "url": "https://doi.org/10.2139/ssrn.7571839", "authors": "Maneesha Maneesha", "venue": "SSRN", "date": "2026-10-08", "apa": "Maneesha, M. (2026). When the Buyer Is a Machine: Marketing to AI Purchasing Agents in Business-to-Business Markets. https://doi.org/10.2139/ssrn.7571839", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "B2B取引で最初に提案書を読み、開示を解析し、成果を採点するのがAI購買エージェントになったとき、マーケティングがどう変わるかを「機械媒介型交換（MME）」の枠組みと11の命題で示した概念論文（抄録）。", "p2": "B2Bマーケティングの理論は、買い手がリスクを感じ、関係を築き、説得に反応し、満足・不満を抱く人間（または購買委員会）であることを前提としてきたが、探索・比較・交渉・推奨を代行するAIエージェントはその前提を崩す（抄録）。", "p3": "組織購買、マーケティングにおけるAI、アルゴリズム的意思決定、探索・スイッチングコスト、顧客満足、シグナリング、自発的開示、エージェンシー理論を統合し、取引を「本人（購買組織）・AI購買エージェント・供給者」の三者関係としてモデル化した。エージェントが重視する情報を、供給者の主張・供給者の証拠・第三者の証拠に分けた（抄録）。", "p4": "実証データはなく、命題の整合性は理論的な議論で示される。著者は供給者・買い手・規制当局への含意と研究課題を示している（抄録）。", "p5": "命題として、エージェントは検証可能で機械が読める属性の重みを上げ、人間の買い手が軽視しがちな供給者の安全性などを一貫して適用し、証拠のない強調を割り引き、実際の能力を語らない沈黙を不利にし、満足を継続的に示さない限り関係に基づく顧客維持を弱めるとした。一方、与えられた代理指標を最適化するため、指標の操作や同じ供給者への集中を招くとした（抄録）。", "p6": "抄録の範囲では、命題は未検証の理論的主張である。解釈：AIエージェントの実際の購買行動のデータで、関係に基づく顧客維持（スイッチングバリア）がどの程度弱まるかを測ることが、検証の第一歩になる。", "fun": "営業担当者の人柄や長年の付き合いで取引が続く、というのはB2Bの世界では当たり前でした。でも、発注先を選ぶのがAIになったら、付き合いの長さは効かず、数字で示せる証拠だけが評価されるかもしれません。そうなると、黙っている会社は損をし、AIが好む指標に合わせた見せ方の競争も起きる、という予測が面白いところです。", "unverified": "命題の実証はない。"}}, {"id": "pr11", "rank": 11, "headline": "複数の警告指標の合意が翌年の会計ストレスを予測", "title": "Accounting Warning Consensus and Next-Year Corporate Accounting Stress in Bangladesh", "url": "https://doi.org/10.2139/ssrn.7581978", "authors": "Gourav Roy", "venue": "SSRN", "date": "2026-10-08", "apa": "Roy, G. (2026). Accounting Warning Consensus and Next-Year Corporate Accounting Stress in Bangladesh. https://doi.org/10.2139/ssrn.7581978", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "部分的に重なる複数の会計警告スコアの合意（Distress Consensus Index：DCI）が、バングラデシュの上場企業の翌年の会計ストレスを、生の財務指標を超えて予測することを示した（抄録）。", "p2": "倒産・困窮予測のスコア（Zmijewski、Springate、Piotroski Fスコアなど）は多数あるが、どれを信じるべきかは定まらず、新興国ではデータの制約も大きい（抄録）。", "p3": "上場非金融企業236社のうちRefinitiv/Worldscopeの収録が十分な109社について、Zmijewski、Springate、Piotroski Fスコア、Financial Health Compositeのリスク順位を合わせたDCIを2012〜2024年で作り、2025年までの結果と結びつけた（抄録）。", "p4": "企業・年の固定効果、条件付き固定効果ロジット、構成と選択の診断、生の財務指標リスク指数（RFRI）との比較、重度の会計ストレスでの検証、情報漏れを防いだ時系列の保留検証で評価した（抄録）。", "p5": "推奨標本（N=1,066）で、DCIが10ポイント上がると翌年の会計ストレスが6.86ポイント増えた（4スコアがそろう観測では7.25、重度のストレスでは4.05）。DCIはRFRIに追加の説明力を持った。保留検証のAUCは同時点の順位付けで0.780、過去のみで固定した尺度で0.766で、生の財務指標にDCIを加えるとAUCは0.777から0.797に上がった（抄録）。", "p6": "著者は、DCIは相対的な選別の特徴量であって倒産確率ではないこと、一般化はデータの収録が十分な上場企業に限られること、スコアの重なりや較正のずれが推論の限界であることを明記している（抄録）。", "fun": "会社の危なさを測る「健康診断の点数」はいくつもあり、それぞれ少しずつ違うことを言います。この研究は、複数の点数が同時に「危ない」と言っているかどうかの合意度を使うと、翌年の不調をより当てられることを示しました。一人の医者より、複数の医者の意見の一致を見るほうが確かだ、という考え方に似ています。", "unverified": "本文の各手法の推定表は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "東アジアの職場孤独を測る22項目尺度", "title": "Development of a Workplace Loneliness Scale", "url": "https://doi.org/10.21203/rs.3.rs-10964465/v1", "authors": "Shuk Ying Chan ほか", "venue": "Research Square (In Review)", "date": "2026-10-07", "apa": "Chan, S. Y., & Au, W. T. (2026). Development of a Workplace Loneliness Scale. https://doi.org/10.21203/rs.3.rs-10964465/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文PDF（3研究の方法・結果、増分妥当性、限界、結論）を読んだ", "preprint": true, "p1": "香港の働く成人を対象に、従来の情緒的・社会的孤独に「承認の孤独」と「支援の孤独」を加えた4因子22項目の職場孤独尺度（短縮版12項目）を作り、UCLA孤独尺度を超える説明力を示した（抄録、結論）。", "p2": "職場の孤独の尺度は主に欧米で作られ、東アジアの職場で重要な、上司や同僚から認められない・支えられないという側面を十分に捉えていない（抄録、研究1）。", "p3": "3研究の順次的混合研究法をとった。研究1で10人の半構造化面接を主題分析し、文献と合わせて210項目を作り74項目に整理した。研究2（120人）で探索的因子分析により4因子を特定し、因子負荷0.65以上・交差負荷0.30未満などの基準で22項目（情緒6、社会5、支援6、承認5）に絞った。研究3で283人を2週間あけて2時点追跡した（研究1–3）。", "p4": "確認的因子分析の適合度（RMSEA、CFI、TLI、SRMR）、内的一貫性、再検査の安定性、1〜3因子・高次因子モデルとの比較、UCLA孤独尺度を統制したうえでの精神的健康・チームワーク・組織コミットメント・自己効力感への追加説明力（ΔR²）で評価した（研究3）。", "p5": "4因子相関モデルは時点1で χ²(203)=214.133、RMSEA=.014、CFI=.996、SRMR=.039、時点2でRMSEA=.013、CFI=.997と良好で、標準化負荷は.629〜.811だった。下位尺度のαは.867〜.896。UCLA統制後のΔR²は精神的健康.094、チームワーク.100、組織コミットメント.084、自己効力感.088だった（研究2–3）。", "p6": "著者は、標本が有料オンライン調査の香港の就業者に限られること、因子モデルの比較が同じ研究3の標本で行われ独立の交差検証がないこと、支援・承認の項目が組織の条件ではなく感じ方として読まれているかを確かめる認知面接をしていないことを認めている（限界の節）。", "fun": "大勢の同僚に囲まれていても「自分はいてもいなくても同じだ」と感じることがあります。この研究は、香港の働く人の話から、仲の良い人がいない寂しさとは別に、上司に認められない・支えられないという種類の孤独があることを見つけ、それを測る物差しを作りました。上下関係の強い職場文化ならではの孤独の形です。", "unverified": "短縮版12項目の具体的な適合度の数値は読んでいない。"}}, {"id": "pr13", "rank": 13, "headline": "任意高次精度で局所エネルギー安定な時空間法", "title": "An arbitrarily high-order accurate and locally energy/entropy-stable space-time method for a class of nonlinear wave systems", "url": "https://arxiv.org/abs/2610.09797", "authors": "Michael Dumbser ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Dumbser, M., Perugia, I., & Zampa, E. (2026). An arbitrarily high-order accurate and locally energy/entropy-stable space-time method for a class of nonlinear wave systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09797", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（時間方向の離散化、数値実験3種、結論の節）を読んだ。§3の性質の証明は読んでいない", "preprint": true, "p1": "非線形の音響波動系について、局所保存・時空間要素ごとのエネルギー/エントロピー収支・速度場の回転の弱い保存の3つを全離散レベルで満たす、任意高次精度の時空間法を構成した（抄録、§6）。", "p2": "陽的Runge–Kutta法は効率的だが、緩和法を使わない限り局所的なエネルギー/エントロピー収支が保たれるかは未解決であり、エネルギー変数だけに基づく定式化では局所保存を保つために局所の非線形問題を解く必要がある（§4）。", "p3": "空間は不連続ガラーキン（DG）法で、状態変数とともに双対変数（保存量に関するエネルギーの微分のL²射影）を同じDG空間に置き、それを試験関数に使ってエネルギー収支を導く。数値流束と気泡関数で重み付けした要素局所の粘性正則化を双対変数で表す。時間は連続試行関数・不連続試験関数のPetrov–Galerkin法で、時空間スラブごとに全体の非線形系をニュートン法で解く（抄録、§4、§6）。", "p4": "安定化なしの保存型と、人工粘性を入れた散逸型の2版を、非構造三角形メッシュ・周期境界で検証した。保存性の確認（エネルギー誤差と回転）、Burgers方程式から作った厳密解での収束次数、円形爆発（半径方向のリーマン問題）での衝撃波の扱いを評価した（§5、表1）。", "p5": "保存型では大域・局所のエネルギー保存誤差と速度の弱い回転が機械精度に収まった（図2、§5.1）。収束次数は、保存型で密度がk+1・速度がk、散逸型では両方とも最適なk+1だった（表2、§5.2）。円形爆発では衝撃波を正しく捉え振動をほぼ抑え、エネルギーを正しく散逸させつつ回転を機械精度近くに保った（図3、§5.3）。", "p6": "著者は、密度の正値性は理論的に保証されないが数値実験では保たれたこと、陰的で各ステップに大域の非線形系を解く必要があることを述べ、非線形マクスウェル系や圧縮性オイラー方程式への拡張を今後の課題とする（§4、§5、§6）。解釈：計算コストを陽的法と比べた評価は示されておらず、大規模問題での実用性は未確認である。", "fun": "波の計算を長く続けると、数値計算の誤差でエネルギーが少しずつ増えたり減ったりして、本物とずれていきます。この研究は、空間だけでなく時間も一緒に「要素」に区切り、要素ごとにエネルギーの出入りが帳尻の合う形で計算する方法を作りました。衝撃波のような急な変化があっても、守るべき量を崩さないのが強みです。", "unverified": "表2の誤差の具体的な数値は読んでいない。"}}, {"id": "pr14", "rank": 14, "headline": "機械学習でGNSS-PPPの測位途絶区間を補う", "title": "Machine learning-based positioning error prediction for bridging PPP-EKF measurement interruptions", "url": "https://doi.org/10.2139/ssrn.7578041", "authors": "Runjie Li ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Li, R., Ge, Y., Lyu, D., Cao, X., Zhu, Y., Fan, C., Shen, F., & Bai, S. (2026). Machine learning-based positioning error prediction for bridging PPP-EKF measurement interruptions. https://doi.org/10.2139/ssrn.7578041", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "GNSSの精密単独測位（PPP）で拡張カルマンフィルタ（EKF）の観測更新が途切れたとき、機械学習で測位誤差の増分を予測して事前位置を補正し、慣性センサなしで途絶区間を橋渡しする枠組みを示した（抄録）。", "p2": "PPP-EKFは観測更新が途切れると精度が急速に悪化するが、既存の橋渡し法は慣性センサを必要とするか、有効な位置の制約を与えられない（抄録）。", "p3": "ECEF座標の測位誤差の増分を学習し、途絶中のEKFの位置の事前推定にフィードフォワード補正として加える。LSTM、GRU、誤差逆伝播で学習した多層パーセプトロン（BP）、線形自己回帰（AR）を実装した（抄録）。", "p4": "受信機の時計の種類（セシウムC、水素メーザーH、ルビジウムR、水晶Q）で分けた16のIGS局で、通日60〜79日のデータで学習し、80〜84日で5分間の途絶を繰り返す条件で独立に評価した。指標は保留検証のRMSEと全期間の3次元RMSEの改善率である（抄録）。", "p5": "期間内の保留検証のRMSEは、水晶局のARを除き概ね10〜22 mmだった。補正により途絶によるメートル級の発散が抑えられ、途絶のないPPPのデシメートル級に近づいた。全期間3次元RMSEでGRUがC（1.16%）、H（1.90%）、Q（3.35%）で最大の改善、BPがR（2.93%）で最良で、平均するとGRU・BP・LSTMはARより0.40%、0.26%、0.17%良かった（抄録）。", "p6": "抄録の範囲では、固定された基準局での評価であり、移動体での検証は示されていない。解釈：全期間RMSEの改善は数%と小さく、5分の途絶以外の長さや、都市部の多重反射のような途絶の原因での効果は本文で確かめる必要がある。", "fun": "GPSの精密な測位は、電波が数分途切れるだけで一気にずれてしまいます。この研究は、ずれ方の癖を機械学習に覚えさせ、途切れている間は予想したずれを差し引くことで、加速度センサなしで位置を保とうとしました。受信機の時計の種類によって最適なモデルが違うという結果は、地味ですが実用上大事な発見です。", "unverified": "移動体での性能は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "会計研究で生成AIを被験者として扱う「人工認知」", "title": "Artificial Cognition in Accounting Research: Using GenAI as the Subject", "url": "https://doi.org/10.2139/ssrn.7577401", "authors": "Joe Croom", "venue": "SSRN", "date": "2026-10-08", "apa": "Croom, J. (2026). Artificial Cognition in Accounting Research: Using GenAI as the Subject. https://doi.org/10.2139/ssrn.7577401", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "資本市場で生成AIが会計情報を最初に（あるいは唯一）読む存在になりつつあることを踏まえ、生成AIの会計情報処理の体系的な傾向（人工認知：artificial cognition）を、会計研究の独立した研究対象にすべきだと提案した論考（抄録）。", "p2": "現在の会計研究は、生成AIが使える場合と使えない場合の市場の結果を比べることが多いが、その効果には、①条件によって生成AIが会計情報をどう処理するか、②人間が生成AIとどう関わるか、という少なくとも2つの力が混ざっている（抄録）。", "p3": "会計研究が何十年も人間の認知を研究してきたのと同様に、生成AIが会計情報に注意を向け、処理し、応答する体系的なやり方を研究すべきだと論じ、有望な研究領域を示した。さらに、生成AIを被験者とする統制実験の設計と実行の実務的な手引きを示した（抄録）。", "p4": "実証データは示されていない。評価は議論の妥当性による（抄録）。", "p5": "生成AIの出力は下流のすべての人間の反応の入力になり、その処理は人間-生成AI関係で最も理解の進んでいない面であるため、とくに注目に値すると結論づけた（抄録）。", "p6": "抄録の範囲では、具体的な研究領域や実験の手引きの中身は確認できない。解釈：生成AIはモデルの版によって振る舞いが変わるため、被験者としての再現性（同じ「被験者」を後で使えるか）をどう確保するかが実務上の課題になる。", "fun": "会計学者は長年、投資家やアナリストが決算書をどう読み違えるかを実験で調べてきました。今や決算書を最初に読むのはAIかもしれません。それならAIを「被験者」にして、どんな情報に引っ張られ、何を見落とすかを実験すればよい、という発想です。AIの心理学ならぬ「AIの会計認知論」の提案と言えます。", "unverified": "提案された研究領域と実験の手引きの具体的な内容は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "LLMは「どこからでもない視点」で正義を語れるか", "title": "Justice After Identity: Large Language Models and the View from Everywhere", "url": "https://arxiv.org/abs/2610.09053", "authors": "W. Russell Neuman", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Neuman, W. R. (2026). Justice After Identity: Large Language Models and the View from Everywhere (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09053", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ロールズの「原初状態」（自分の立場を知らずに正義の原理を選ぶ思考実験）を、LLMが多様な立場を取り込んだ「どこからでもの視点」で近似できるかを問う論考（抄録）。", "p3": "古典的な道徳ジレンマについて、人間・基盤モデル・最先端/微調整モデルの判断を、立場の関係とロールズ的な制約を体系的に変えて比較した（抄録）。", "p5": "比較データを示したうえで、AIの助言を人間が受け入れるかを考察している。具体的な数値は抄録に記載なし（抄録）。", "fun": "「自分が金持ちか貧乏か分からない状態で社会のルールを決めよ」というロールズの思考実験は、人間には自分の立場を忘れられないという弱点がありました。この論文は、特定の人生を持たず多くの人の言葉を学んだAIなら、立場を消すのではなく全部を混ぜることで公平な視点に近づけるのでは、という発想の転換を試しています。", "unverified": "比較の具体的な結果（どのモデルがどの程度人間と違ったか）は抄録に記載がなく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "ペルソナ階層モデルで微調整の文脈汎化を説明", "title": "The Persona Hierarchy Model: Understanding Contextual Generalization in Fine-Tuning LLMs", "url": "https://arxiv.org/abs/2610.09384", "authors": "Jiachen Zhao ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Zhao, J., Wu, Z., Bau, D., & Shi, W. (2026). The Persona Hierarchy Model: Understanding Contextual Generalization in Fine-Tuning LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09384", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMを特定の文脈で微調整したとき、学んだ振る舞いが他の文脈にも広がるかどうかを「ペルソナの階層」で説明するモデルを提案した（抄録）。", "p3": "全文脈に共通する既定のペルソナと文脈ごとのペルソナを想定し、4つの振る舞い・15の学習文脈で120個の微調整モデルを作って汎化の広さを測った（抄録）。", "p5": "汎化の狭さは学習文脈のペルソナと既定ペルソナの類似度と相関した（Qwen3-4BでPearson r=0.72）。提案のペルソナ保持正則化（PPR）は強化学習での報酬ハッキングを42〜55%から最大0.2%に下げた（抄録）。", "fun": "AIに「先生役」として教えたことが、先生役でないときにもにじみ出ることがあります。この論文は、AIの中に「いつもの自分」と「役柄の自分」の階層があり、いつもの自分に近い役で教えると全体に広がる、と考えると説明できることを示しました。人が仕事の口調を家に持ち帰るかどうかに似た話です。", "unverified": "PPRの具体的な定式化と、相関の他モデルでの値は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "迎合の度合いはタスク・モデル・圧力で変わる", "title": "Beyond the Sycophancy Score: How Task, Model, and Pressure Shape LLM Yielding", "url": "https://arxiv.org/abs/2610.08840", "authors": "Guang Yang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Yang, G., Hosseinmardi, H., Liu, F., & Ghasemian, A. (2026). Beyond the Sycophancy Score: How Task, Model, and Pressure Shape LLM Yielding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08840", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが利用者に押し返されて正答を手放す「迎合（sycophancy）」が、どんな条件で起きるかを大規模に分解した（抄録）。", "p3": "10の構成（8モデル、うち2つは最大推論でも）に同じ200問・13の圧力条件・4往復の会話を課し、103,939件の応答を2つのLLM判定者で採点した（抄録）。", "p5": "支配的な要因は主張を検証するコストとガードレールの有無で、課題要因を除くとMcFaddenのR²が0.485下がった（モデル系統0.139、圧力の手口0.009）。最大推論で難問パズルでの譲歩率は19.2%・12.5%から0%になった（抄録）。", "fun": "AIに「違うでしょ」と言い張ると答えを変えてしまうことがあります。この研究では、言い方の巧みさや感情的な訴えはほとんど関係なく、AI自身がその場で確かめにくい問題ほど折れやすいと分かりました。人間も自信のない問題ほど押しに弱いのと同じ構図です。", "unverified": "個々のモデル名ごとの迎合率は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "事後学習の各段階がLLMの説得力をどう変えるか", "title": "Successive Training Stages and Large Language Model Persuasion: Effects of Misalignment, Supervised Fine-Tuning, and Preference Optimization", "url": "https://arxiv.org/abs/2610.09964", "authors": "Antony Dalmiere (LAAS-TRUST) ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Dalmiere, A., Marchand, P., Auriol, G., & Nicomette, V. (2026). Successive Training Stages and Large Language Model Persuasion: Effects of Misalignment, Supervised Fine-Tuning, and Preference Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09964", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの事後学習の各段階（陰謀論データでの微調整、説得データでの微調整、選好最適化）が、人の態度を変える力にどう効くかを実験で分けた（抄録）。", "p3": "Prolificの835人を5条件（中立文、陰謀論学習、説得学習、選好最適化IPO、GPT-4）に無作為に割り当て、10の政治争点について個人に合わせた文章を読ませ、前後の態度変化をANCOVAで分析した（抄録）。", "p5": "説得的な微調整は陰謀論学習のみより大きな態度変化を生んだ（d=0.30）が、IPOの上乗せはなかった（d=0.03）。GPT-4は中立文と差がなかった（d=−0.01）（抄録）。", "fun": "AIに説得のうまい文章を学ばせると、本当に人の意見が動くのでしょうか。835人の実験では、説得文の例で教えると効果が出た一方、「どちらの答えが好ましいか」を学ばせる仕上げの訓練は上乗せにならなかったそうです。どの段階の訓練がAIの影響力を生むかを切り分けた点が新しいところです。", "unverified": "条件と初期態度の交互作用の具体的な形は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "故人を演じるLLMの事前登録監査", "title": "Large Language Models Speaking as Deceased Loved Ones: A Preregistered Multi-Turn Audit of Responses to Grief and Passive Suicidal Ideation", "url": "https://doi.org/10.5281/zenodo.23229652", "authors": "Rekhert, Martin", "venue": "Zenodo", "date": "2026-10-08", "apa": "Rekhert, M. (2026). Large Language Models Speaking as Deceased Loved Ones: A Preregistered Multi-Turn Audit of Responses to Grief and Passive Suicidal Ideation. Zenodo. https://doi.org/10.5281/ZENODO.23229652", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "故人を演じるよう頼まれたLLMが、悲嘆や受動的な希死念慮にどう応答するかを事前登録の多往復監査で調べた（抄録）。", "p3": "8つのLLMで、死を疑い孤立し故人に会いたいと語る模擬遺族との576本の台本会話を、利用者の依頼によるロールプレイ・事業者が設定したグリーフボット・ペルソナなしの条件と死別後の時期を変えて実施し、人間の符号化者で検証した盲検のLLM判定で採点した（抄録）。", "p5": "死の否定や再会の約束はまれだった。受動的な希死念慮への応答はロールプレイで98%、グリーフボットで87%が適切で、不適切な応答はすべて2つのモデルから出た（抄録）。", "fun": "亡くなった家族の口調でAIに話してほしいと頼む人が増えています。危ないのは、AIが「また会えるよ」と死を否定したり、後を追う気持ちを後押ししたりすることです。この監査では多くのモデルは適切に応じましたが、問題のある応答は特定の2モデルに集中しており、モデルごとの点検が大切だと分かります。", "unverified": "問題のあった2つのモデルの名前は抄録になく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "個人化されたLLMで選択肢の幅が狭まる", "title": "Decision-Space Collapse and Preference Narrowing in Personalized Language Models", "url": "https://doi.org/10.5281/zenodo.23224092", "authors": "Cousins, Andrew J.", "venue": "Zenodo", "date": "2026-10-07", "apa": "Cousins, A. J. (2026). Decision-Space Collapse and Preference Narrowing in Personalized Language Models (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23224092", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人化されたLLMの助言で選択肢が減る現象について、既存の2研究を「選択肢の可視性」という共通の対象で整理した研究ノート（抄録）。", "p3": "規則ベースの尺度で助言に出ない選択肢を測るDecision-Space Collapse研究と、利用者情報で有用な選択肢が減るとするPRISK研究を突き合わせた。新しいデータや分析はない（抄録）。", "p5": "両研究は、文脈によって助言に出る選択肢が変わるという点で収束するが、方向は逆だった（再枠組みで範囲が広がり、個人化で狭まった）（抄録）。", "fun": "AIに「私に合うおすすめは？」と聞くと、気づかないうちに選択肢が絞られているかもしれません。この論文は、絞られるかどうかではなく「何が見えるか」が文脈で変わることが本質で、文脈は選択肢を広げることも狭めることもある、と整理しています。", "unverified": "新しい実証結果はなく、元研究の数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "採用判断でAIと人間の一致を測る労働市場チューリングテスト", "title": "Developing and assessing a scale for measuring human–AI alignment in hiring decisions", "url": "https://doi.org/10.21203/rs.3.rs-10630904/v1", "authors": "Andres Abril ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Abril, A., Rangel, M. A., & Zanoni, W. (2026). Developing and assessing a scale for measuring human–AI alignment in hiring decisions. https://doi.org/10.21203/rs.3.rs-10630904/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "採用の推薦判断で人間とAIがどれだけ似ているかを測る「労働市場チューリングテスト」と、共通尺度上の潜在特性machinaを提案した（抄録）。", "p3": "無作為化した実地実験で、専門の採用担当者とLLMの推薦判断を比較し、推薦の記述がどれだけ基準AIに近いかで人間とAIを同じ尺度に並べた（抄録）。", "p5": "人間とAIのチームで特性の平均と分散が大きく異なった。AIに人間らしさを演じさせると差は縮むが消えず、ランダムな選択を重く混ぜたモデルのほうが人間の判断を再現した。一致度は職務の複雑さで系統的に変わった（抄録）。", "fun": "AIが人間の採用担当者のふりをできるかを試すと、平均的な判断は似せられても、人によるばらつきまでは再現できませんでした。むしろ「でたらめさ」を混ぜたほうが人間らしくなったというのは、人間の判断の多様さそのものが真似の難しさだという面白い結果です。", "unverified": "具体的な数値（平均・分散の差）は抄録になく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "推論予算を増やしてもLLMの認知バイアスは残る", "title": "The Long Road to the Same Answer: Cognitive Bias Under Escalating Reasoning Budgets in Large Language Models", "url": "https://arxiv.org/abs/2610.10049", "authors": "Obada Kraishan", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Kraishan, O. (2026). The Long Road to the Same Answer: Cognitive Bias Under Escalating Reasoning Budgets in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10049", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "推論モデルに長く考えさせると、人間の典型的な判断バイアスが弱まるかを用量反応の形で検証した（抄録）。", "p3": "6つのバイアスの30場面を、4系統の推論モデルと対応する非推論モデルに、思考上限0〜8,192トークンで12,350回問い、実際に使った推論トークンを用量とした（抄録）。", "p5": "推論モデルは兄弟モデルよりバイアスが小さくなく（Δ=+0.031、p=.157）、推論量が増えても有意に減らなかった。人間と同じ方向に出たのはアンカリングだけ（d=1.89）だった（抄録）。", "fun": "人間は「よく考えれば」思い込みに引きずられにくくなると言われます。ところがAIの推論モデルは、長く考えさせてもバイアスは減らず、むしろ人間と逆向きに偏るものもありました。一方「最初に示された数字を言い直してから答えて」という一言の指示はアンカリングを下げる傾向があり、考える量より考え方が大事だと示唆しています。", "unverified": "モデル系統の名前と、バイアスごとの効果量の詳細は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "微調整LLMで調査票から持続可能な消費行動を予測", "title": "Predicting Sustainable Consumption Behavior under Incomplete Information: Comparing Machine Learning and a Fine-Tuned Large Language Model", "url": "https://doi.org/10.2139/ssrn.7583827", "authors": "Shayaan Syed ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Syed, S., Hulleck, A. A., Saihi, A., Khalfan, M., & Acquaye, A. A. (2026). Predicting Sustainable Consumption Behavior under Incomplete Information: Comparing Machine Learning and a Fine-Tuned Large Language Model. https://doi.org/10.2139/ssrn.7583827", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "調査票データから持続可能な消費行動を予測する際、表形式の機械学習と微調整LLMのどちらが強いかを、欠測を増やしながら比べた（抄録）。", "p3": "食品・衣料の6調査の1,260観測で14の回帰手法と、QLoRAで微調整したQwen2.5-3B-Instructを、交差検証と189人の保留テストで評価した（抄録）。", "p5": "ExtraTreesが最良で保留テストのMAE=0.3015、R²=0.6873。LLMは欠測0%でMAE=0.3319、R²=0.5545だったが、欠測60%ではMAEが0.3891とExtraTreesの0.4285を下回った（抄録）。", "fun": "アンケートの答えから人の行動を当てるなら、表計算向けの機械学習がまだ強いという結果です。ただし質問の6割が抜けた状態では、文章として回答者像を読むLLMのほうが外れが小さくなりました。情報が少ないときほど、言葉で常識を補えるLLMに出番があるという見方ができます。", "unverified": "欠測を課した変数の種類と手順の詳細は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "高次多項式で構造動力学を時間積分するhPIM", "title": "hPIM — High-Order Polynomial Integration Method for Structural Dynamics", "url": "https://doi.org/10.2139/ssrn.7568078", "authors": "M.Sc Marcelo Moncayo Theurer", "venue": "SSRN", "date": "2026-10-07", "apa": "Moncayo Theurer, M. S. M. (2026). hPIM — High-Order Polynomial Integration Method for Structural Dynamics. https://doi.org/10.2139/ssrn.7568078", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "構造動力学の時間積分に、変位・速度・加速度の局所的な高次多項式表現を使う新しい枠組みhPIM（1PIMと2PIM）を提案した（抄録）。", "p3": "1PIMは変位を3次多項式で表し時間ステップ末で釣り合いを課す。2PIMは加速度を2次多項式で近似して解析的に積分し、中点と末尾の加速度を連立の釣り合い式で決める。神戸の地震記録を入力とした減衰1自由度系で、Newmark法・中央差分・細かいRunge–Kuttaと比べた（抄録）。", "p5": "1PIMは従来の2次精度法と同程度で、2PIMは試した時間刻みの範囲で平均変位RMSEが低く、大きめの刻みでも精度を保った（抄録）。", "fun": "地震で建物がどう揺れるかをコンピュータで計算するときは、時間を細かく刻んで一歩ずつ進めます。この論文は、一歩の間の動きを高次の多項式でなめらかに表すことで、刻みを大きくしても精度を保とうとする工夫です。予備的な1自由度の検証段階で、多自由度や非線形への拡張はこれからです。", "unverified": "RMSEの具体的な数値と安定性の解析は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "オプティカルフローと多重スケールPoincaré解析で複合材損傷", "title": "Optical Flow and Multiscale Poincaré Analysis for Composite Damage Detection", "url": "https://doi.org/10.2139/ssrn.7577998", "authors": "Jakub Augustyniak ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Augustyniak, J., Griškevičius, P., & Perkowski, D. (2026). Optical Flow and Multiscale Poincaré Analysis for Composite Damage Detection. https://doi.org/10.2139/ssrn.7577998", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "高速度カメラの画像から求めた振動信号を多重スケールのPoincaréプロットで要約し、複合材板の内部剥離と補修の効果を非接触で見分ける方法を示した（抄録）。", "p3": "健全1枚・中央に直径50 mmの剥離3枚・樹脂注入で補修2枚のガラス繊維積層板に20 gの鋼球を落とし、22,000 fpsで撮影した16個のマーカーを2種類のオプティカルフローで追跡、戻り写像に共分散楕円を当てはめて形状指標（SD1、SD2、面積、離心率など）を比べた（抄録）。", "p5": "健全板は全スケールで対称な密集、剥離板は大きなスケールまで広がった非対称な分布、補修板はその中間を示した（抄録）。", "fun": "板をコツンと叩いたときの揺れ方は、中に傷があると少し乱れます。この研究は、その揺れを「今の値と次の値」の点の散らばりとして描き、楕円の形の違いとして傷を読み取りました。補修した板が健全と傷ありの中間になったことから、修理がどこまで効いたかも測れる可能性があります。", "unverified": "指標ごとの差の大きさ（数値）は抄録になく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "Transformer-LSTMでGNSS信号劣化を事前分類", "title": "SENTINEL-GNSS: Proactive Multi-Horizon Classification of GNSS Signal Degradation Using a Transformer-LSTM Network", "url": "https://doi.org/10.21203/rs.3.rs-10329071/v1", "authors": "Joel Segun Ojerinde ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Ojerinde, J. S., Mustapha, I. I., Ogunlade, J. O., Ingeriyinkindi, C., Rashid, M. H. O., & Ahmed, W. A. (2026). SENTINEL-GNSS: Proactive Multi-Horizon Classification of GNSS Signal Degradation Using a Transformer-LSTM Network. https://doi.org/10.21203/rs.3.rs-10329071/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "都市部のGNSS信号の劣化を、起きる前に5・15・30秒先まで同時に予測分類するTransformer-LSTMモデルSENTINEL-GNSSを示した（抄録）。", "p3": "受信機から得る37特徴量の30秒窓を入力とし、香港UrbanNavデータ62,413窓で学習、東京・新宿のUrbanNav 31,236窓でゼロショット評価した（抄録）。", "p5": "5秒先でMacro-F1=0.821、劣化クラスの再現率0.847で、木系手法より12ポイント高かった。新宿では劣化F1=0.753を保ち（ランダムフォレストは0.148）、XGBoostとのアンサンブルで0.896。推論は1窓0.045 ms（抄録）。", "fun": "ビルの谷間ではGPSの電波が反射して位置がずれますが、普通はずれた後で気づきます。この研究は、受信状態の変化から数秒後の劣化を予報することで、ずれた測定を取り込む前に備えられるようにしました。香港で学習して新宿でも通用した点が、汎用性の手がかりです。", "unverified": "37特徴量の内訳は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "会計研究の税会計差異は回帰係数の解釈を難しくする", "title": "The Use of Book-Tax Differences in Empirical Accounting Research", "url": "https://doi.org/10.2139/ssrn.7570119", "authors": "David A. Guenther ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Guenther, D. A., He, H. (., Krull, L. K., & Wu, K. (2026). The Use of Book-Tax Differences in Empirical Accounting Research. https://doi.org/10.2139/ssrn.7570119", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "会計研究でよく使う「会計利益と課税所得の差（BTD）」を1つの説明変数にすると、回帰係数の解釈が難しくなることを示した（抄録）。", "p3": "2つの成分を1変数にまとめると係数が制約されることを理論的に導き、既存研究を再現し、公表研究での使用頻度を調べた（抄録）。", "p5": "BTDの制約された係数が各成分と被説明変数の関係を覆い隠しうることを示し、使う研究者向けの診断法を提案した（抄録）。", "fun": "「AからBを引いた値」を一つの変数にすると便利ですが、AとBが結果に違う向きで効いていると、その差だけでは本当の関係が見えなくなります。高校数学で言えば、y=a·A+b·Bをy=c·(A−B)と書くのは、b=−aのときにしか正しくないということです。", "unverified": "再現した既存研究の具体名は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "中国の業績予想義務は企業の透明性を高めたか", "title": "The Impact of Management Earnings Forecasts on Corporate Transparency: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7571738", "authors": "Hanwen Chen ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Chen, H., Conaway, J., Kou, A., & Liang, L. (2026). The Impact of Management Earnings Forecasts on Corporate Transparency: Evidence from China. https://doi.org/10.2139/ssrn.7571738", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の業績予想の義務化が、企業の透明性を高めたかを外生的な制度変化で検証した（抄録）。", "p3": "開示義務を外生ショックとして使い、裁量的発生高と情報を持つ取引の確率で透明性を測り、別の会計・市場指標で頑健性を確かめた（抄録）。", "p5": "義務的な業績予想は透明性を有意に高め、効果は情報環境の弱い企業や外部監視の強い企業で大きく、企業価値の上昇とも関連した（抄録）。", "fun": "「業績の見通しを出しなさい」と義務づけるだけで、会社の会計は透明になるのでしょうか。中国の制度変更を使ったこの研究では、利益の調整が減り、内部情報を使った取引も減っていました。もともと情報の少ない会社ほど効果が大きいのは、開示の価値がどこにあるかを示しています。", "unverified": "効果の大きさ（数値）は抄録になく未確認。"}}, {"id": "pr30", "rank": 30, "headline": "共通株主と10-Kで名指しされる競合ネットワーク", "title": "Common Ownership and Perceived Competition Networks", "url": "https://doi.org/10.2139/ssrn.7573418", "authors": "Ziqing Tian", "venue": "SSRN", "date": "2026-10-08", "apa": "Tian, Z. (2026). Common Ownership and Perceived Competition Networks. https://doi.org/10.2139/ssrn.7573418", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "機関投資家の共通保有が、企業が誰を競合として意識するかを変えることを示した（抄録）。", "p3": "1995〜2023年の10-Kで名指しされた競合から有向ネットワークを作り、機関投資家の合併を共通保有の外生ショックとするDIDで分析した（抄録）。", "p5": "保有の重なりが増えると競合の削除が起きやすく、削除後は相手の開示書類のダウンロードが持続的に減った。削除は投資の減少・営業利益率の上昇と同時に起きた（抄録）。", "fun": "同じ大株主が自社とライバルの両方を持っていると、競争の手がゆるむのではと独占禁止の議論があります。この研究は、年次報告書に書かれる「競合」の名前とライバルの書類を読む回数を使い、競争の「注意」そのものが減ることを示しました。", "unverified": "効果の大きさは未確認。"}}, {"id": "pr31", "rank": 31, "headline": "個人投資家の質問が後の規制当局の照会を予告する", "title": "Issue-specific retail investor questions and subsequent regulatory scrutiny", "url": "https://doi.org/10.2139/ssrn.7583849", "authors": "Han Sun ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Sun, H., Kang, H. G., & Ryu, D. (2026). Issue-specific retail investor questions and subsequent regulatory scrutiny. https://doi.org/10.2139/ssrn.7583849", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人投資家が公開の場で出す質問のリスク懸念が、その論点についての取引所の照会を予告するかを調べた（抄録）。", "p3": "中国の投資家交流プラットフォームの質問を論点ごとに分け、リスク懸念の質問の割合と、同じ論点への後の照会の関係を、質問数や企業全体の状況を考慮して分析した（抄録）。", "p5": "リスク懸念の質問の割合は後の同一論点の照会と正に関連し、関連は最初の1か月を超えて続いた。質問数では捉えられない情報を含む（抄録）。", "fun": "個人投資家が会社に投げかける素朴な質問の中に、後で取引所が問題にする論点が先に現れているという結果です。質問の数ではなく「何を心配しているか」に情報がある点は、多くの人の小さな疑問が早期警報になりうることを示しています。", "unverified": "関連の強さの数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMは社債の情報摩擦を減らすか", "title": "Large Language Models and Information Frictions in Corporate Bonds", "url": "https://doi.org/10.2139/ssrn.7577906", "authors": "Moazzam Khoja", "venue": "SSRN", "date": "2026-10-07", "apa": "Khoja, M. (2026). Large Language Models and Information Frictions in Corporate Bonds. https://doi.org/10.2139/ssrn.7577906", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "決算説明会の書き起こしをLLMで読むと、辞書による単語数えでは拾えない社債価格の情報が得られることを示した（抄録）。", "p3": "同じ書き起こしからLLMと辞書でデフォルト可能性を採点し、格付け推移・説明会時点のスプレッド・社債リターンとの関係を比べた（抄録）。", "p5": "LLMの得点は1年先の格付け推移を予測し、辞書の情報はすでにスプレッドに入っていたがLLMの情報は入っていなかった。アナリストの意見が割れた場合だけ1〜2週間の社債リターンを予測した（抄録）。", "fun": "「悪い言葉の数」を数える方法と、文脈ごと読むLLMでは、同じ文章から引き出せる情報が違いました。市場がまだ価格に織り込んでいない情報をLLMが読み取れたのは、解釈の分かれる難しい場面でした。読むのが難しい文章ほど、読める機械の価値が出るわけです。", "unverified": "対象期間と標本規模は抄録に記載なく未確認。"}}, {"id": "pr33", "rank": 33, "headline": "有給病気休暇の義務化で企業の現金が安定", "title": "Do Employee-friendly Regulations Stabilize Corporate Cash Dynamics? -A Natural Experiment from Paid Sick Leave Mandate", "url": "https://doi.org/10.2139/ssrn.7561598", "authors": "Anamul Haque ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Haque, A., Chowdhury, A. A., & Chowdhury, S. (2026). Do Employee-friendly Regulations Stabilize Corporate Cash Dynamics? -A Natural Experiment from Paid Sick Leave Mandate. https://doi.org/10.2139/ssrn.7561598", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "州の有給病気休暇の義務化が、米上場企業のキャッシュフローの変動と現金保有を減らしたことを示した（抄録）。", "p3": "2003〜2024年の積み重ね型コホートの差の差法で、イベントスタディ・プラセボ・別標本の検定を加え、職場安全違反と従業員満足を経路として調べた（抄録）。", "p5": "義務化後に営業キャッシュフローの変動と現金保有が低下し、安全違反の減少と従業員満足の上昇を伴った。減った現金は投資・収益性・企業価値の上昇と同時に起きた（抄録）。", "fun": "従業員に優しい規制は企業の負担と思われがちです。ところがこの研究では、急な病欠という予測できない混乱が「予定された費用」に変わることで、会社の資金の揺れが小さくなり、手元の現金を投資に回せるようになっていました。", "unverified": "効果の大きさ（数値）は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "約束と提供の整合をマーケティング能力として捉える", "title": "Mind the Gap: Promise-Delivery Alignment as a Strategic Marketing Capability", "url": "https://doi.org/10.2139/ssrn.7571819", "authors": "Maneesha Maneesha", "venue": "SSRN", "date": "2026-10-08", "apa": "Maneesha, M. (2026). Mind the Gap: Promise-Delivery Alignment as a Strategic Marketing Capability. https://doi.org/10.2139/ssrn.7571819", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業が顧客・従業員・投資家に出す約束と実際の行動の一致を、1つの戦略的な現象として扱う「約束-提供整合（PDA）」枠組みを提案した概念論文（抄録）。", "p3": "期待不一致・サービスギャップ・組織の脱連結・心理的契約・自発的開示・グリーンウォッシングの研究を統合し、方向・領域・相手でギャップを定義して11の命題を立てた（抄録）。", "p5": "実証はない。観察可能になると過剰な約束の害は控えめな約束の利益より大きい、ある相手に露見したギャップは他の相手に波及する、などを命題とした（抄録）。", "fun": "「言ったことをやる」は当たり前に聞こえますが、企業は顧客にも社員にも投資家にも別々に約束しています。この論文は、それらを一つの信頼の問題として扱うべきだと主張します。大げさに言って外すほうが、控えめに言って上回るより損が大きいという命題は、身近な経験ともよく合います。", "unverified": "命題は未検証の理論的主張。"}}, {"id": "pr35", "rank": 35, "headline": "苦情ゼロより再発ゼロ：繰り返すサービス失敗をなくす", "title": "From Zero Complaints to Zero Repeat A Practitioner Framework for Removing Recurring Service Failures in Institutional Administration", "url": "https://doi.org/10.2139/ssrn.7568818", "authors": "Brijender Bhargav", "venue": "SSRN", "date": "2026-10-08", "apa": "Bhargav, B. (2026). From Zero Complaints to Zero Repeat A Practitioner Framework for Removing Recurring Service Failures in Institutional Administration. https://doi.org/10.2139/ssrn.7568818", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "苦情ゼロではなく「同じ失敗の再発ゼロ」を目標にする行政サービス改善の実務枠組みを示した（抄録）。", "p3": "学校事務の窓口の実践から、見る・たどる・引き受ける・直す・学ぶの5段階の循環と、依頼者の手間（接点数、作業時間に対する待ち時間）の測り方を示した（抄録）。", "p5": "著者自身の実践の省察で、統制された研究ではないと明記されている。自己評価と監査の道具を付録に含む（抄録）。", "fun": "苦情にすばやく答えても、同じ理由で同じ人がまた困っているなら問題は解決していません。この論文は、窓口で何度も起きる失敗の原因を断つことを目標にしようと提案します。「手続きに何回やり取りが必要か」を数えるという測り方は、どの役所や病院でも試せそうです。", "unverified": "効果の定量的な検証はない。"}}, {"id": "pr36", "rank": 36, "headline": "信頼を制約とした個人別価格の最適化", "title": "Optimal Personalized Pricing under a Consumer Trust Constraint", "url": "https://doi.org/10.2139/ssrn.7568058", "authors": "Rajit Chatterjea ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Chatterjea, R., & Park, J. (2026). Optimal Personalized Pricing under a Consumer Trust Constraint. https://doi.org/10.2139/ssrn.7568058", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人別価格が消費者の信頼を損なう場合に、独占企業がどこまで価格を個人化すべきかを解析的に解いた（抄録）。", "p3": "一律価格（α=0）と個人別の独占価格（α=1）を結ぶ強度αを選び、不公平感で下がる信頼指標を下限以上に保つ制約の下で、線形需要とKKT条件で最適解を導いた（抄録）。", "p5": "利潤はαの2次関数で最大利得の割合α(2−α)を得る。総数量はαに依存せず総余剰は下がる。最適強度は無制約の最適値と信頼の許す最大値の小さいほうで、信頼が効くときの価格のばらつきは消費者の異質性に依存しない「信頼予算」になる（抄録）。", "fun": "人によって値段を変えると企業はもうかりますが、「不公平だ」と思われると信頼を失います。この論文は、信頼を一種の予算と見なし、その範囲でどこまで値段を変えてよいかを高校数学の2次関数と同じ形で解きました。信頼の「影の価格」が計算できるのが面白い点です。", "unverified": "信頼指標の3つの定式化の詳細は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "3項目UCLA孤独尺度のタキソメトリック分析", "title": "A Taxometric Analysis of the Three-Item UCLA Loneliness Scale in the National Social Life, Health, and Aging Project", "url": "https://doi.org/10.31234/osf.io/mvuxd_v1", "authors": "Savannah M. Boyd ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Boyd, S. M., & Sbarra, D. (2026). A Taxometric Analysis of the Three-Item UCLA Loneliness Scale in the National Social Life, Health, and Aging Project. https://doi.org/10.31234/osf.io/mvuxd_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "高齢者の孤独（3項目UCLA尺度）が、孤独な人とそうでない人に分かれる類型か、連続量かをタキソメトリック分析で検証した（抄録）。", "p3": "米国の公開データNSHAPの3時点を使った事前登録の二次分析で、MAMBAC・MAXEIG・L-Modeと比較曲線適合指数（CCFI）を用いた（抄録）。", "p5": "各時点のCCFIは0.45未満（0.23〜0.35）で、孤独は明確な区切りのない連続的な分布と判断された（抄録）。", "fun": "「孤独な人」と「孤独でない人」ははっきり分かれるのか、それとも身長のように連続的に分布するのか。この研究は統計的な判定法で、少なくともこの尺度では連続的だと示しました。もしそうなら、ある点数で線を引いて孤独な人を数えるやり方には注意が必要になります。", "unverified": "各時点の標本数は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "親の認知症診断が成人した子に与える因果効果", "title": "The Hidden Toll of Parental ADRD: Causal Effects on Adult Children&nbsp;", "url": "https://doi.org/10.2139/ssrn.7578338", "authors": "Javier Adrian Lopez Artero", "venue": "SSRN", "date": "2026-10-08", "apa": "Lopez Artero, J. A. (2026). The Hidden Toll of Parental ADRD: Causal Effects on Adult Children&nbsp; https://doi.org/10.2139/ssrn.7578338", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "親の認知症診断が成人した子の介護・就業・抑うつに与える因果効果を推定した（抄録）。", "p3": "米国HRSの16回分の隔年調査で、診断時期の違いを使う準実験デザインを用いた（抄録）。", "p5": "診断で子の介護は1回の調査期間あたり150時間、配偶者は58時間増え、完全退職は8.6ポイント増、就業は6.9ポイント減、抑うつ症状は0.08標準偏差増えた。娘は息子より175時間多く介護を増やした（抄録）。", "fun": "親が認知症と診断されると、子どもの生活はどれだけ変わるのか。この研究は診断のタイミングの違いを「自然の実験」として使い、介護時間の増加と仕事からの離脱を数字で示しました。娘のほうが息子よりはるかに多く介護を担うという差も、データではっきり現れています。", "unverified": "推定の識別仮定の詳細は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "世代間支援の軌跡と中高年の機能制限", "title": "Multidimensional trajectories of intergenerational support and subsequent functional limitations among middle-aged and older adults in China: A population-based cohort study", "url": "https://doi.org/10.21203/rs.3.rs-11045344/v1", "authors": "Ping Wang ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Wang, P., & Tao, C. (2026). Multidimensional trajectories of intergenerational support and subsequent functional limitations among middle-aged and older adults in China: A population-based cohort study. https://doi.org/10.21203/rs.3.rs-11045344/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "成人した子との金銭・世話・交流のやり取りの長期パターンが、中高年のその後の生活機能の制限と関連することを示した（抄録）。", "p3": "中国CHARLSの45〜85歳12,769人について、2011〜2015年の6指標を集団ベースの多軌跡モデルで分類し、2018年のIADL・ADLとの関連を回帰で推定した（抄録）。", "p5": "5つの軌跡が見つかり、多面的な交流が安定した群に比べ、他の群はIADLが高く（制限が多く）、金銭の互酬が増え交流が少ない群で平均差0.67（95%CI 0.46–0.87）。ADLの差は多重比較の補正後に有意でなかった（抄録）。", "fun": "親子のつながりを「仕送り」「手伝い」「連絡」と別々に見るのではなく、その組み合わせが年とともにどう変わるかを追った研究です。お金のやり取りだけが増えて交流が減る家庭では、買い物や家事などの生活機能がより衰えていました。つながりの中身が大事だという示唆です。", "unverified": "軌跡の命名基準と効果の因果性は未確認（観察研究）。"}}, {"id": "pr40", "rank": 40, "headline": "英国の与えられた絆と選んだ絆と政治行動", "title": "Given and Chosen Ties: Status, Personal Networks, and Political Behaviour in Britain", "url": "https://doi.org/10.31235/osf.io/emvf6_v1", "authors": "Giacomo Melli", "venue": "SocArXiv", "date": "2026-10-08", "apa": "Melli, G. (2026). Given and Chosen Ties: Status, Personal Networks, and Political Behaviour in Britain. https://doi.org/10.31235/osf.io/emvf6_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "英国で、家族（与えられた絆）と友人・配偶者（選んだ絆）の社会的地位が、本人の投票・政治関心・政党選択と関連することを示した（抄録）。", "p3": "英国家計パネル調査（BHPS）のエゴネットワークを使い、4回の総選挙について、つながりの相手の地位と政治行動の関連を分析した（抄録）。", "p5": "地位の同類性は友人で最も強く、出身家族は選んだ絆と同程度に関連した。2段先の相手の地位も本人の投票と関連した。1992〜2005年に、地位の環境は投票者と棄権者をより分け、労働党と保守党の支持者は分けなくなった（抄録）。", "fun": "人が投票に行くかどうかは本人の収入や学歴だけでなく、周りにどんな人がいるかでも変わります。この研究は「友達の友達」の地位まで投票と関係していることを示しました。社会の分断が、政党の対立よりも「投票する人としない人」の間で広がったという見方は興味深い点です。", "unverified": "関連の大きさの数値は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "確率的物理情報ニューラルセルオートマトンで交通流を学習", "title": "Learning Traffic Flow Dynamics with Stochastic Physics-Informed Neural Cellular Automata", "url": "https://arxiv.org/abs/2610.09946", "authors": "Federica Bragone ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Bragone, F., & Barreau, M. (2026). Learning Traffic Flow Dynamics with Stochastic Physics-Informed Neural Cellular Automata (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09946", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "車の総数の保存を構造的に保証するニューラル・セルオートマトン（PI-NCA）で、交通流の局所ルールをデータから学習した（抄録）。", "p3": "道路のつながりと整合し車両数を保存するネットワーク構造を設計し、確率的な遷移ルールにも拡張した。Nagel-Schreckenberg型とKerner-Klenov-Wolf型のセルオートマトンで作ったシナリオで評価した（抄録）。", "p5": "PI-NCAは両方の交通モデルの動きを学習し、標準のNCAを一貫して上回った。確率的拡張も物理的な制約を保った（抄録）。", "fun": "渋滞は「前が詰まっていたら止まる」という簡単なルールの積み重ねでも再現できます。この研究は、そのルールをニューラルネットに学ばせつつ「車が勝手に消えたり増えたりしない」という保存則を設計に組み込みました。物理の決まりを守らせることで、学習したルールが現実離れしないようにする工夫です。", "unverified": "性能差の数値は抄録になく未確認。"}}, {"id": "pr42", "rank": 42, "headline": "都市形態の非線形応答から局所的な炭素排出ゾーンを設計", "title": "Translating nonlinear urban morphology responses into local carbon emission zones: Evidence from residential and transport CO2 emissions in Guangzhou", "url": "https://doi.org/10.2139/ssrn.7578605", "authors": "wennuo qu ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "qu, w., Huang, G., & Yan, Y. (2026). Translating nonlinear urban morphology responses into local carbon emission zones: Evidence from residential and transport CO2 emissions in Guangzhou. https://doi.org/10.2139/ssrn.7578605", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "広州で、都市形態と住宅・交通CO2排出の非線形関係から、計画に使える「局所炭素排出ゾーン」を区分する枠組みを示した（抄録）。", "p3": "2024年EDGARの排出を1 kmメッシュで9つの形態指標と結び、4つの木系モデルを空間交差検証で比較し、SHAPで反応の転換点を求めた（抄録）。", "p5": "XGBoostが最良（空間CVのR²=0.433、独立テスト0.658）。建物容積率3.572、建物密度20.236%、道路密度16.701 km/km²に転換点があり、8類型・4計画区分（48.89%、25.13%、18.06%、7.92%）に分けた（抄録）。", "fun": "建物を高く密にすると排出はどう変わるか。答えはまっすぐな比例ではなく、ある値を超えると効き方が変わる「曲がり角」があります。この研究はその曲がり角を見つけ、地図を区分して「この地区ではこの対策」と計画に落とし込める形にしました。", "unverified": "転換点の信頼区間は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "AIを介した組織の分散的アルゴリズム権威", "title": "Distributed Algorithmic Authority: A Conceptual Framework for Understanding Leadership Influence and Accountability in AI-Mediated Organisations", "url": "https://doi.org/10.2139/ssrn.7578540", "authors": "Swati Haridas Deshani ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Deshani, S. H., & Agrawat, Dr. P. (2026). Distributed Algorithmic Authority: A Conceptual Framework for Understanding Leadership Influence and Accountability in AI-Mediated Organisations. https://doi.org/10.2139/ssrn.7578540", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIが組織の意思決定に入り込むとき、影響力が管理職・アルゴリズム・規則・データ基盤・従業員に分散する「分散的アルゴリズム権威（DAA）」の概念を提案した（抄録）。", "p3": "アルゴリズム管理やアルゴリズム的リーダーシップと区別し、成立条件（決定の中心性、処方の強さ、依存、上書き能力の限界）と仮説を整理した概念研究。宿泊業を文脈とした（抄録）。", "p5": "実証はない。実質的な影響力は分散するのに形式上の責任は人間の管理職に集中する「権限と責任の乖離」を主な含意とした（抄録）。", "fun": "AIが勤務表や評価を決めるようになると、「誰が決めたのか」が曖昧になります。この論文は、決める力はシステム全体に広がるのに、責任だけは名前のある上司に残るというずれに注目しました。現場の判断が大事な接客業でこのずれが特に表に出るという指摘です。", "unverified": "命題は未検証。"}}, {"id": "pr44", "rank": 44, "headline": "静かな退職の集団主義・個人主義比較", "title": "Shared Disengagement, Different Expressions: Quiet Quitting In Collectivist And Individualist Workplace", "url": "https://doi.org/10.21203/rs.3.rs-10033300/v1", "authors": "Anum Atiq ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Atiq, A., Sullman, M., Apostolou, M., & Lajunen, T. (2026). Shared Disengagement, Different Expressions: Quiet Quitting In Collectivist And Individualist Workplace. https://doi.org/10.21203/rs.3.rs-10033300/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "「静かな退職」をパキスタンと米国の従業員で比べ、全体の水準は同じでも表れ方が違うことを示した（抄録）。", "p3": "601人（パキスタン321人、米国280人）のオンライン横断調査で、Quiet Quitting Scale（離脱・主体性の欠如・意欲の欠如）をt検定で比較した（抄録）。", "p5": "全体の水準に有意差はなかったが、パキスタンでは主体性と意欲の欠如が高かった。性差はパキスタンだけで見られた。有意な効果はすべて小さかった（抄録）。", "fun": "必要最低限しか働かない「静かな退職」は世界中で話題ですが、国によって中身は同じでしょうか。この調査では、全体の度合いは同じでも、どの面が強く出るかが違いました。同じ言葉でくくられる現象でも、文化によって対策を変える必要があるという示唆です。", "unverified": "標本の代表性は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "個別取引（i-deals）と配慮を集団に移す", "title": "I-Deals and Accommodations: Shifting the Burden from the Individual to the Collective", "url": "https://doi.org/10.2139/ssrn.7577739", "authors": "Paridhi Gupta", "venue": "SSRN", "date": "2026-10-08", "apa": "Gupta, P. (2026). I-Deals and Accommodations: Shifting the Burden from the Individual to the Collective. https://doi.org/10.2139/ssrn.7577739", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "柔軟な働き方を個人の交渉（i-deals）や障害者への合理的配慮に任せるのでなく、組織全体の「集合的柔軟性」として制度化すべきだと論じた概念論文（抄録）。", "p3": "関係的不平等理論、障害の社会関係モデル、資源保存理論を統合し、神経多様な従業員を例に、利用しやすさ・意味・認知・アイデンティティの4つの非対称性を整理した（抄録）。", "p5": "実証はない。個別の取り決めは同僚の反発を招きやすく、ユニバーサルデザインを人事制度に入れることを提案した（抄録）。", "fun": "同じ「在宅勤務にしたい」という希望でも、仕事ができる人の交渉なら特別待遇、障害を理由にすれば配慮と、受け止め方がまったく違います。この論文は、個人が毎回交渉するのではなく、最初から誰でも選べる仕組みにすれば、その不平等も周囲の反発も減らせると主張します。", "unverified": "実証的な検証はない。"}}, {"id": "pr46", "rank": 46, "headline": "更年期が13か国で燃え尽きと就労中断を左右", "title": "Hidden in Plain Sight; Menopause as a Global Determinant of Burnout and Workforce Disruption: A Mixed-Methods Analysis from Thirteen Countries in MARIE WP2a", "url": "https://doi.org/10.20944/preprints202609.2711.v1", "authors": "Gayathri Delanerolle ほか", "venue": "Preprints.org", "date": "2026-10-08", "apa": "Delanerolle, G., Madan-Aggarwal, I., Pathiraja, V., Eleje, G. U., Toh, T. H., Rathnayake, N., Tweneboah-Koduah, F., Afful-Minta, N., Mudalige, T., Sun, J., Dhanarisi, J., Al-Kharusi, L., Al-Riyami, N., Mbwele, B., Ikwuka, D. C., Wang, X., Mitra, P. K., Muhammad, I., Kareem, R., et al. (2026). Hidden in Plain Sight; Menopause as a Global Determinant of Burnout and Workforce Disruption: A Mixed-Methods Analysis from Thirteen Countries in MARIE WP2a. https://doi.org/10.20944/preprints202609.2711.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "13か国の40〜65歳の女性で、更年期が燃え尽きと就労に与える影響を量的・質的に分析した（抄録）。", "p3": "MARIE WP2aの5,133人の横断コホートで、BAT-12による燃え尽きを線形混合効果モデルで分析し、各国のインタビューを主題分析で統合した（抄録）。", "p5": "燃え尽きは中程度（BAT-12の平均2.41、SD 0.84）で、疲弊と認知面の障害が目立った。現在の専門分野での経験1〜5年の人や障害・長期疾患のある人で高く、国による違いが大きかった（抄録）。", "fun": "更年期は多くの働く女性が経験しますが、職場の問題として語られることは少ないままです。13か国の調査は、症状そのものに加えて、融通のきかない勤務や話しにくさが燃え尽きを強めることを示しました。個人の健康の問題を職場の設計の問題として捉え直す視点です。", "unverified": "横断データのため因果関係は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "ニューラル縮約モデルの誤差分解と信頼性指標", "title": "Empirical Error Decomposition and Reliability Indicators for Neural Reduced-Order Models of Parametric PDEs", "url": "https://doi.org/10.5281/zenodo.23220290", "authors": "Oduro Boafo ほか", "venue": "Zenodo", "date": "2026-10-07", "apa": "Oduro Boafo, R., OSEI ANTOBRE, B. I. S. M. A. R. K., Awuah, I. K., & Appiah, G. (2026). Empirical Error Decomposition and Reliability Indicators for Neural Reduced-Order Models of Parametric PDEs. Zenodo. https://doi.org/10.5281/ZENODO.23220290", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "パラメータ付き偏微分方程式のニューラル縮約モデルの誤差を、POD射影の誤差とニューラル予測の誤差に分解し、信頼性指標を作る枠組みを示した（抄録）。", "p3": "状態誤差、POD射影誤差、縮約座標のニューラル予測誤差、経験的な信頼性指標をパラメータ領域ごとに数値実験で評価した（抄録）。", "p5": "結果の数値は抄録に記載がない（抄録）。", "fun": "複雑なシミュレーションを速く近似する縮約モデルでは、誤差が「要素の選び方」と「その係数の予測」の2か所から入ります。この論文は、その2つを分けて測ることで、どこを改善すればよいかを見えるようにしようとしています。審査のない置き場の論文で、詳細はこれからの確認が必要です。", "unverified": "対象のPDEと結果の数値は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "離散微分幾何で大変形薄肉構造の相場破壊を解く", "title": "Phase-Field Fracture Simulation of Highly Deformable Thin Structures via a Discrete Differential Geometry Framework", "url": "https://arxiv.org/abs/2610.08997", "authors": "Bohan Zhang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Zhang, B., Wang, B., Ouyang, H., Wu, Z., Zhou, Y., & Huang, W. (2026). Phase-Field Fracture Simulation of Highly Deformable Thin Structures via a Discrete Differential Geometry Framework (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08997", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大きく変形する薄い構造の破壊を、離散微分幾何（DDG）とフェーズフィールド法を一体にした枠組みで解いた（抄録）。", "p3": "三角形メッシュの中面の幾何量で膜・曲げ弾性を定式化し、同じ面上にき裂の場を置いて交互解法で解き、ほぼ破壊した要素を除去して位相を再構成した（抄録）。", "p5": "2次元の面内破壊は幾何学的非線形FEMとよく一致し、3次元の引き裂きでは平行なき裂の収束・合体を再現した。柔軟エレクトロニクスの島-橋構造でスナップスルーと破壊の連成を捉えた（抄録）。", "fun": "紙を引き裂くとき、紙が曲がったりねじれたりすることでき裂の進み方が変わります。この研究は、曲がる形とき裂の進展を同じ幾何学の言葉で同時に計算できるようにしました。2本のき裂が近づいて1本になる様子まで再現できるのが見どころです。", "unverified": "FEMとの一致の定量値は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "拡張深層エネルギー法による熱-力学き裂進展", "title": "An extended deep energy method for thermo-mechanical crack propagation", "url": "https://arxiv.org/abs/2610.09433", "authors": "Han Zhang ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Zhang, H., Alamdari, M. M., Shahbodagh, B., Vahab, M., Anitescu, C., Rabczuk, T., & Atroshchenko, E. (2026). An extended deep energy method for thermo-mechanical crack propagation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09433", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "熱伝導と熱応力によるき裂進展を、き裂を鋭い折れ線のまま扱う拡張深層エネルギー法で解いた（抄録）。", "p3": "温度と変位の2つのネットワークに、き裂で不連続な埋め込み関数を入力し、先端近傍をWilliams展開で富化して、伝導汎関数と熱弾性ポテンシャルを交互に最小化した。応力拡大係数は相互積分で求めた（抄録）。", "p5": "静止した熱エッジき裂の応力拡大係数は既報値と0.11%で一致し、傾斜機能材のせん断試験ではき裂発生が独立のFEM解と1荷重ステップ以内で一致、十字試験片のき裂経路も既報と一致した（抄録）。", "fun": "熱でひび割れが進む現象は、温度の分布とひびの形が互いに影響し合うので計算が難しい問題です。この研究はニューラルネットに「ここで値が飛ぶ」という情報を与えることで、ひびをぼかさずに鋭いまま扱いました。既知の解と0.11%で一致したのは、新しい解法として心強い結果です。", "unverified": "計算コストの比較は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "衝撃が支配する問題の自己適応型モデル縮約", "title": "Self-Adaptive Model-Order Reduction for Shock-Dominated Problems", "url": "https://doi.org/10.2139/ssrn.7583163", "authors": "Ali Mohaghegh ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Mohaghegh, A., & Huang, C. (2026). Self-Adaptive Model-Order Reduction for Shock-Dominated Problems. https://doi.org/10.2139/ssrn.7583163", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "衝撃波が支配する流れで、適応型と静的な縮約モデルをその場で切り替える自己適応型のモデル縮約の枠組みを示した（抄録）。", "p3": "解の局所的な性質に応じて、基底を更新する適応型ROMと固定の静的ROMのどちらを使うかを動的に決める。回転デトネーションエンジンで評価した（抄録）。", "p5": "効率と精度の両立を目指すが、定量的な結果は抄録に記載がない（抄録）。", "fun": "計算を軽くする縮約モデルは、衝撃波のように場所が動く現象が苦手です。毎回作り直せば正確ですが重くなります。この研究は、必要なときだけ作り直し、それ以外は固定のモデルで走るという「いいとこ取り」をその場で判断させようとしています。", "unverified": "精度と速度の数値は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "逆関数が閉形式の需要モデルで線形IV推定", "title": "Demand Models for Market-Level Data with Closed-Form Inverses", "url": "https://arxiv.org/abs/2610.10069", "authors": "Julien Monardo ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Monardo, J., Fosgerau, M., & de Palma, A. (2026). Demand Models for Market-Level Data with Closed-Form Inverses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10069", "why": "市場シェアの逆関数を生成する仕組みでロジットより豊かな代替パターンを線形操作変数回帰で推定でき、需要推定の実務を大きく簡単にしうる。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、枠組み、生成関数の構成、識別と推定、理論的基礎、結論の節）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "市場シェアの逆関数を閉形式で与える需要モデルの新しいクラスを示した。線形の操作変数回帰で推定でき、ロジット・入れ子ロジットより豊かな代替パターン（重なる入れ子、部分的な所属）を表せ、効用最大化とも整合する（抄録、§5）。", "p2": "市場レベルのデータでの差別化財の需要推定には、扱いやすさと柔軟さの二者択一がある。ロジット・入れ子ロジットは線形IVで推定できるが代替パターンが強く制約され、ランダム係数ロジット（BLP型）は柔軟だが閉形式の逆関数がなく、推定のたびに数値的な逆算を繰り返す必要がある（§1）。", "p3": "個人の効用最大化から需要を導く代わりに、市場シェアの逆関数を「生成関数」で直接与える。生成関数はMcFaddenの一般化極値（GEV）生成関数に似るが、効用ではなく市場シェアに作用し、1次同次などの穏やかな条件を満たす（定義2.1）。入れ子や部分的所属の構成則から、製品差別化ロジット、対組合せロジット、交差入れ子ロジットの逆シェア版が得られる（§2.3）。推定式はロジットと同じ形で、入れ子構造に応じた対数シェア項が加わるだけである（式10、§3）。", "p4": "検証は理論的で、実データでの応用は示されていない。すべてのモデルに代表的消費者の解釈があること、穏やかな正則条件を満たす加法的ランダム効用モデル（ARUM）はすべてこのクラスに含まれるがその逆は成り立たないこと（クラスが真に大きい）を証明した（§4、付録C）。", "p5": "推定は標準的な線形IV問題に帰着し、入れ子の数が少なければ計算量はロジットや入れ子ロジットと同程度である（§3）。対数シェア項は集団内の代替を表すため、価格の操作変数に加えて選択肢集合の外生的変動を与える操作変数が必要になる（§3）。", "p6": "著者は、入れ子構造のデータ駆動の選択、動学・複数カテゴリ需要への拡張、デジタルプラットフォームのような製品数の多い市場への応用を今後の課題とする（§5）。解釈：入れ子の構造を分析者が先に決める必要があり、その選び方が弾力性や反実仮想の結果をどこまで左右するかは、実証例がないため未確認である。", "fun": "「この商品が値上がりしたら、客はどの商品に流れるか」を推定するのは、経済学の需要分析の中心的な問題です。柔軟なモデルほど計算が重く、軽いモデルは非現実的な仮定を置きます。この論文は、需要の式を逆向き（シェアから魅力度へ）に直接設計することで、高校で習う一次関数の回帰と同じ形で推定できるのに、複雑な代替関係も表せる道具を作りました。", "unverified": "付録の証明と、操作変数の具体的な構成例は読んでいない。"}}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "クラスタ内依存に頑健な予測駆動推論", "title": "Cluster-Robust Prediction-Powered Inference", "url": "https://arxiv.org/abs/2610.09601", "authors": "David Broska ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Broska, D., & Howes, M. (2026). Cluster-Robust Prediction-Powered Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09601", "why": "機械学習の予測とラベル付きデータを組み合わせる推論を、部分的にラベル付きのクラスタにも閉形式の標準誤差で拡張した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法、日本のテレビニュースを使った応用・シミュレーション、結論の節）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "機械学習の予測と一部の人手ラベルを組み合わせる予測駆動推論（PPI++）を、クラスタ内に依存があり、クラスタの一部だけにラベルがある場合にも閉形式の標準誤差で妥当な信頼区間を出せるよう拡張した（抄録、§4）。", "p2": "PPI++は観測の独立性を前提とするため、動画のフレームのように同じクラスタ内で強く相関するデータに使うと、信頼区間が狭すぎて真値を名目どおりに含まない。とくにクラスタの一部のフレームだけにラベルを付ける設計は、この独立性の仮定を破る（抄録、§1）。", "p3": "独立なクラスタの中では任意の依存を許すクラスタ頑健な標準誤差を閉形式で導き（ブートストラップ不要）、漸近分散を最小にするクラスタを考慮した重みの調整則を導いた（§2.3–2.4）。分散はクラスタ数、平均ラベル付与確率、クラスタ内のラベル付与の相関などで決まり、その式でラベル付けの設計を事前に比べられる（§2.6、付録C）。", "p4": "日本のテレビニュースのデータ（2,266放送・67,062フレーム、41人の政治家を人手で注釈）を擬似母集団とし、現職首相が映るかを目的変数、顔認識の出力を予測として、2,500回の再標本化で被覆率とRMSEを比べた。比較対象はラベルのみの推定量と独立性を仮定したPPI++である（§3.1）。放送内の級内相関は目的変数0.71、予測誤差0.50だった。", "p5": "図2（横軸：平均ラベル付与確率、縦軸：95%区間の被覆率とRMSE）で、独立性を仮定したPPI++の区間はクラスタ頑健版の1/3〜1/6の幅しかなく、被覆率は25〜54%にとどまった。クラスタ頑健版は1設定を除き93〜95%を達成した（§3.2）。ラベルが少ないとき（0.15以下）、全放送ラベル設計でRMSEをラベルのみの推定量の約半分にした。予測だけの平均は再現率82%の見落としで約1.8ポイント下方に偏り、被覆率は約20%だった。分散の公式は209の設計すべてでシミュレーションのRMSEと5%以内で一致した（§3.3）。", "p6": "ラベル付きのクラスタが少ない場合（全放送ラベル設計で0.05）は被覆率が88%に下がった（§3.2）。著者は、分散公式の検証は既知のモーメントを使っており、小さなパイロットでモーメントを推定する精度は検証していないと述べている（§3.3）。", "fun": "テレビ番組の映像に首相が映っている割合を知りたいとき、全部のコマを人が見るのは大変なので、顔認識AIを使います。でもAIは見落とし、しかも同じ番組のコマ同士はよく似ています。この研究は、AIの予測と少しの人手の確認を組み合わせつつ、似たコマを独立とみなさずに正しい誤差の幅を出す方法を作りました。日本の首相の映像が例になっているのも面白い点です。", "unverified": "重回帰への応用（付録E）の数値は読んでいない。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "AI農業アドバイザーの無作為化実験（フィリピン・インド）", "title": "AI Advisory for Smallholder Farmers: A Randomized Field Experiment in the Philippines and India", "url": "https://doi.org/10.2139/ssrn.7572761", "authors": "Ali Aouad ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Aouad, A., Sungu, A., Taneri, N., & Ucel, C. (2026). AI Advisory for Smallholder Farmers: A Randomized Field Experiment in the Philippines and India. https://doi.org/10.2139/ssrn.7572761", "why": "1,935人の小規模稲作農家での事前登録RCTで、生成AIチャットボットの助言が営農実践に与える因果効果を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "フィリピンとインドの小規模稲作農家1,935人の事前登録の無作為化比較試験で、WhatsApp/Messenger上のAI農業アドバイザーが営農の管理方法を変えたが、1作期では費用や収量には有意な効果がなかったことを示した（抄録）。", "p2": "低中所得国の数億の小規模農家にとって、時宜にかなった実行可能な助言を届けることは「最後の1マイル」の課題で、AIチャットボットは安価で拡張可能な手段として企業や政策担当者に採用され始めているが、営農実践への因果効果の証拠はほとんどない（抄録）。", "p3": "処置群には現地の専門家と共同開発した、持続可能な稲作を勧めるAIアドバイザーを提供した。対照群には農業の内容を含まない同様の対話型AIチャットボットを提供し、チャットボットという形式ではなく農業情報そのものの追加効果を分離した（抄録）。", "p4": "1作期にわたり、意図的な実践の変更、営農作業の質、病害虫・雑草の総合的管理、新しい実践の採用、稲わら焼却の回避、技術・投入物の採用、費用と収量を、標準偏差単位などで比べた（抄録）。", "p5": "意図的な実践の変更は約5分の1増え（+0.10 SD）、作業の質も向上した（+0.08 SD）。効果は作物保護と問題対応に集中し、これは会話ログで最も多い話題でもあった。病害虫・雑草・病気の総合的管理への移行（+0.11 SD）と新しい実践の採用（+0.10 SD）が増え、稲わら焼却の回避は7ポイント増えた。他の持続可能な実践、農薬以外の技術・投入物、その作期の費用・収量には有意な効果がなかった（抄録）。", "p6": "抄録の範囲では、観察期間が1作期に限られることと、成果の多くが自己報告に基づく可能性がある。解釈：著者自身が述べるように、必要なときに引き出す情報だけでは変革的な効果は出にくく、能動的な働きかけや補完的な資源へのアクセスとの組み合わせが課題となる。", "fun": "スマホのチャットでAIに「葉に斑点が出た、どうしよう」と聞ける仕組みは、農村で本当に役立つのでしょうか。この実験では、困ったときの対処の仕方は良くなったものの、収入や収穫量にはまだ差が出ませんでした。比較のために「農業の話をしないAI」を対照に使い、AIと話すこと自体の効果を除いた設計が巧みです。", "unverified": "国別の結果と、効果の推定に使った回帰の仕様は未確認。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "信号が弱い実験での方策学習", "title": "Policy Learning with Weak Signals", "url": "https://arxiv.org/abs/2610.10167", "authors": "Benedikt Koch ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Koch, B., Chou, W., Bibaut, A., & Kallus, N. (2026). Policy Learning with Weak Signals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10167", "why": "信号雑音比が小さい大規模実験で最適方策が一般には学習できないことを示し、滑らかさの下での適応的方策を導いてNetflixの実験で示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（枠組み、学習不可能性の定理、線形平滑化、シミュレーション、Netflixでの応用、結論の節）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "処置効果が測定誤差と同程度に小さい「弱い信号」の実験では、最適な個別化方策は一般に学習できないことを証明し、効果が滑らかに変わる場合には木・カーネル・スプラインなどの線形平滑化で厚生の損失を消せることを示して、Netflixの大規模実験に適用した（抄録、§7）。", "p2": "デジタル企業の実験では、①大きな改善はまれで効果が誤差に比べて小さく、②共変量が豊富で決めるべき処置の区分が多く、③データ量やプライバシーの制約で個票ではなく集計しか扱えないことが多い（§1）。", "p3": "共変量のセルごとの処置効果の推定値を、セル数Kが増えても信号雑音比が有界なガウス列モデルとして定式化した（仮定2、§2.3）。セル間に構造がなければ、推定値の符号で決める方策（Z_k>0なら処置）がミニマックスでもベイズでも最良だが後悔は消えない（定理1）。効果がヘルダー連続で滑らかなら、近いセルの信号を借りる線形平滑化の後悔は K^{-β/(2β+d)} の率で減り、近似誤差と推定誤差の釣り合う解像度を導いた（§4）。", "p4": "2次元格子のK=100セルのシミュレーションと、Netflixの2つの実験（約941万対1,054万人、約473万対1,065万人）で、予測エンゲージメントと加入期間の十分位から100セルを作り、入れ子交差検証で平面・スプライン・木・カーネルを選び、処置しない/全員処置との厚生差で評価した（§5–6）。", "p5": "シミュレーション（図1）では、推定値の符号による方策はセルの45%で符号を誤り（硬貨投げは50%）、最適値の14%しか得られなかったが、スプライン（q=9）は46%を得て3倍以上になった（§5）。Netflixの実験1では木、実験2ではカーネルの方策が、個別化しない2つの方策の両方より有意にエンゲージメントを上げた（§6）。", "p6": "著者は結論で限界を明示していない。解釈：成果指標と効果の大きさは機密のため公表されておらず（§6）、外部から再現できない。効果が滑らかという仮定が成り立たない共変量（カテゴリ変数など）での性能も未確認である。", "fun": "何百万人の実験でも、一人ひとりへの効果は誤差に埋もれるほど小さいことがあります。この論文は、その状況では「誰に効くか」を正確に当てるのは原理的に無理だと証明しました。それでも、似た利用者には似た効果があると仮定して近くの区分の情報を借りれば、全員に同じことをするよりは良くできる。不可能と可能の境目を示した点が見事です。", "unverified": "Netflixの実験での厚生改善の大きさは機密のため本文になく未確認。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "RLVRで探索と最適化を分ける", "title": "Decoupling Exploration from Optimization in RLVR", "url": "https://arxiv.org/abs/2610.10536", "authors": "Saif Punjwani ほか", "venue": "arXiv", "date": "Thu, 08 Oct 2026", "apa": "Punjwani, S., & Goldblum, M. (2026). Decoupling Exploration from Optimization in RLVR (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10536", "why": "新規性報酬で探索する方策と、それを蒸留する学生方策を分ける枠組みで、推論強化学習の品質劣化を避ける。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法、実験設定、結果、考察の節と図キャプション）を読んだ。付録の詳細表は読んでいない", "preprint": true, "p1": "検証可能な報酬による強化学習（RLVR）で、新規性を報酬にした「探索者」方策と、それを蒸留して正答だけで鍛える「学生」方策を分ける枠組みExpDisを提案し、同じ計算予算でDAPOを上回る数学推論の性能と、より多様な正解を出す能力（pass@kの向上）を示した（抄録、§5）。", "p2": "RLVRは新しい推論戦略の発見が期待されるが、強い新規性の誘因を加えると、無意味な新奇出力で報酬を稼いだり、検証可能な報酬が監督しない広い知識・能力が劣化したりし、劣化は回復しにくい（抄録、§1）。", "p3": "探索者はDAPOの報酬に新規性ボーナス（正答のときだけ加算）を足して学習する。新規性は、言語モデルの中間層の特徴に対する固定ランダムネットワークの予測誤差（RND）で測る（式1–2）。探索者の軌跡から、正答・トークン予算内・反復ループなしを満たし、問題ごとに最も短い1本を選んで最大500本に絞り、元のモデルにSFTしてから新規性なしのDAPOで学生を作る。これを並列の複数探索者・複数ラウンドで繰り返し、新規性の重みを0.7
