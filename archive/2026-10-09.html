ctions on Pattern Analysis and Machine Intelligence", "date": "2026-10-07", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Yang, S., Lin, J., Zhou, Y., Liu, Z., & Loy, C. C. (2026). Zero-Shot Video Translation and Editing With Frame Spatial-Temporal Correspondence. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–16. https://doi.org/10.1109/tpami.2026.3740757", "why": "TPAMI掲載の、学習なしで動画を変換・編集する手法（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "学習なしで画像拡散モデルを動画に使う際、フレーム内とフレーム間の対応を組み合わせて特徴を最適化し、時空間の一貫性を高めるFRESCOを示した（抄録）。", "p3": "注意機構への誘導にとどまらず、フレーム内の対応とフレーム間の対応を合わせた制約で特徴を明示的に最適化した。動画の変換とテキストによる動画編集で検証した（抄録）。", "p5": "入力動画との時空間の一貫性が高く、編集した動画の視覚的なまとまりが大きく改善した（数値は抄録に記載なし）（抄録）。", "fun": "画像を描くAIで動画を1コマずつ加工すると、コマごとに少しずつ絵が変わってちらつきます。この研究は、前後のコマで同じものは同じように変換されるよう縛りをかけ、追加の学習なしでなめらかな動画にしました。", "unverified": "定量評価の数値は未確認。"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "数百万経路規模の反応を扱う機械学習ポテンシャル", "title": "AIMNet2-rxn: A machine-learned potential for generalized reaction modeling on a millions-of-pathways scale", "url": "https://doi.org/10.1126/sciadv.aea1557", "authors": "Dylan M. Anstine ほか", "venue": "Science Advances", "date": "2026-10-07", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Anstine, D. M., Zhao, Q., Zubatyuk, R., Zhang, S., Singla, V., Nikitin, F., Savoie, B. M., & Isayev, O. (2026). AIMNet2-rxn: A machine-learned potential for generalized reaction modeling on a millions-of-pathways scale. Science Advances, 12(41). https://doi.org/10.1126/sciadv.aea1557", "why": "化学反応の機構を大規模に探索できる汎用の機械学習ポテンシャルAIMNet2-rxnを示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "炭素・水素・窒素・酸素の閉殻分子の反応を、量子化学計算の約100万倍の速さで扱える汎用の機械学習ポテンシャルAIMNet2-rxnを作った（抄録）。", "p3": "約470万件の密度汎関数計算でネットワークを学習し、GPU並列で多数の反応経路を同時に探すバッチ型のNEB法を導入した（抄録）。", "p5": "アミド形成やプロトン移動などの既知の反応機構で、再学習なしに反応座標全体で1〜2 kcal/molの精度を示し、グラフ型の機械学習を大きく上回った（抄録）。", "fun": "化学反応がどの道筋で進むかを計算で予測するには、本来とても重い量子力学の計算が必要です。この研究は、470万回分の計算結果を学習させたAIで、ほぼ同じ精度を100万倍の速さで出せるようにしました。何百万通りもの反応経路を総当たりで調べられる時代が近づいています。", "unverified": "適用できない反応の範囲は未確認。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "微分可能な二段階計画で交通混雑ゲームを解く", "title": "Differentiable Bilevel Programming for Stackelberg Congestion Games", "url": "https://doi.org/10.1287/trsc.2026.0233", "authors": "Jiayang Li ほか", "venue": "Transportation Science", "date": "2026-10-07", "sjr": 2.371, "citescore": 10.0, "citescore_year": "2025", "apa": "Li, J., Yu, J., Wang, Q., Liu, B., Wang, Z., & Nie, Y. (. (2026). Differentiable Bilevel Programming for Stackelberg Congestion Games. Transportation Science. https://doi.org/10.1287/trsc.2026.0233", "why": "均衡を操作するシュタッケルベルク混雑ゲームを微分可能計画で効率よく解く手法を示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "指導者が追従者の混雑ゲームの均衡を見越して操作するシュタッケルベルク混雑ゲームを、模倣ロジット動学と微分可能計画で解く方法を示した（抄録）。", "p3": "下位の均衡問題を、均衡に収束することを証明した模倣ロジット動学の滑らかな軌道で置き換え、それを展開して微分する勾配法と、軌道を途中で打ち切る発見的な方法の2つを提案した（抄録）。", "p5": "滑らかさにより効率と拡張性を両立するとしたが、数値結果は抄録が途中で切れており確認できない（抄録）。", "fun": "道路の料金を決める側は、ドライバーが混雑を避けてどの道を選ぶかを見越して決める必要があります。これは「相手の最適な反応を読んでから自分の最適を選ぶ」二段構えの難問です。この研究は、ドライバーの行動の変化を滑らかな軌道として表し、機械学習の微分の技術で一気に解けるようにしました。", "unverified": "計算性能の数値は未確認。"}}, {"id": "jn30", "rank": 30, "field": "教育", "headline": "仕事への関連を説明すると統計学の受講動機は上がるか", "title": "Can a work-relevance rationale support students’ utility value, autonomous motivation, and perceived competence? an exploratory, small-scale experiment in an online statistics course", "url": "https://doi.org/10.1007/s11218-026-10298-8", "authors": "Kjersti Nesje", "venue": "Social Psychology of Education", "date": "2026-10-08", "sjr": 1.256, "citescore": 5.1, "citescore_year": "2025", "apa": "Nesje, K. (2026). Can a work-relevance rationale support students’ utility value, autonomous motivation, and perceived competence? an exploratory, small-scale experiment in an online statistics course. Social Psychology of Education, 29(1). https://doi.org/10.1007/s11218-026-10298-8", "why": "オンライン統計学の授業で仕事への関連の説明が効用価値と自律的動機に与える効果を小規模実験で検証した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "統計学の授業で「将来の仕事にどう役立つか」を説明しても、学生の効用価値や自律的動機は有意に上がらなかったことを小規模実験で示した（抄録）。", "p3": "オンラインの心理学部生76人を、教員が仕事との関連を説明する短い動画の条件と対照条件に割り当て、自己報告で効用価値・自律的動機・有能感を測った（抄録）。", "p5": "効用価値と自律的動機への有意な効果はなかった。試験不安が有能感への効果を調整する可能性が示されたが、探索的な結果とされた（抄録）。", "fun": "「統計は将来の仕事で役に立つよ」と言えば学生のやる気が出る、と先生は思いがちです。ところが実験では効果が見られず、試験が不安な学生にはかえって自信を下げる可能性すら示唆されました。良かれと思った一言の効き方は人によって違うという教訓です。", "unverified": "標本が小さく、結果の頑健性は未確認。"}}, {"id": "jn31", "rank": 31, "field": "教育", "headline": "個別メールと動画でサークル参加を促す介入", "title": "Stand by me: Does promoting university clubs and societies through personalised emails and videos work?", "url": "https://doi.org/10.14742/ajet.10808", "authors": "Anna Bedford ほか", "venue": "Australasian Journal of Educational Technology", "date": "2026-10-08", "sjr": 1.788, "citescore": 12.0, "citescore_year": "2025", "why": "大学生の所属感と孤立に対し、個別化された案内が参加を増やすかを検証した介入研究。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "個別化したメールと学習管理システム上の動画で大学のサークル参加を促す介入が、参加と成績の向上に結びついたことを示した（抄録）。", "p3": "メール配信基盤、学習管理システム、大学の記録のデータを使い、部分最小二乗法の構造モデルで分析した（抄録）。", "p5": "メール→動画視聴→サークル参加→成績という媒介の連鎖が有意だった。低い社会経済的地位はメールを読むことと動画視聴の関連を弱めた（抄録）。", "fun": "コロナ禍のあと、大学生の孤立が問題になりました。この研究では、一人ひとりに合わせたメールと紹介動画でサークルへの参加が増え、それが成績にもつながっていました。ただ、家庭の経済状況が厳しい学生には届きにくく、デジタルでの呼びかけにも格差があることが分かります。", "unverified": "因果効果としての識別は未確認（無作為化の記載なし）。"}}, {"id": "jn32", "rank": 32, "field": "教育", "headline": "生成AIの振り返りダッシュボードで自己調整学習を支援", "title": "Designing generative AI–powered reflective learning dashboards for enhancing self-regulated learning in higher education", "url": "https://doi.org/10.14742/ajet.11584", "authors": "Thacha Lawanna", "venue": "Australasian Journal of Educational Technology", "date": "2026-10-08", "sjr": 1.788, "citescore": 12.0, "citescore_year": "2025", "why": "大学での生成AIを使った学習ダッシュボードの設計と、自己調整学習・成績への効果を検証した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "学習行動データと生成AIによる振り返りの対話を組み合わせた学習ダッシュボードが、大学生の自己調整学習と成績を高めたことを示した（抄録）。", "p3": "学部生180人の12週間の準実験で、教員による従来のフィードバックとAIが生成する振り返りのフィードバックを比べた（抄録）。", "p5": "自己調整学習の行動、課題従事時間、ログイン頻度、成績が有意に改善し（p<.001）、有用性・信頼・個別化への評価も高かった（抄録）。", "fun": "自分の学習記録をAIと振り返る仕組みで、学生が自分で計画し修正する力が伸びたという報告です。先生が一人ひとりに丁寧なコメントを返すのは大変ですが、AIなら対話の形で続けられます。ただし準実験なので、どこまでがAIの効果かは慎重に見る必要があります。", "unverified": "効果量の数値は未確認。"}}, {"id": "jn33", "rank": 33, "field": "教育", "headline": "大学生のAI能力・AI倫理意識・AI不安の関係", "title": "Modeling the Relationships Between University Students’ AI Competence, AI Ethical Awareness, and AI Anxiety: A Dual-Stage PLS-SEM and ANN Analysis", "url": "https://doi.org/10.1016/j.caeai.2026.100687", "authors": "Yaqiao Mu ほか", "venue": "Computers and Education: Artificial Intelligence", "date": "2026-10-08", "sjr": 7.083, "citescore": 43.3, "citescore_year": "2025", "why": "二段階のPLS-SEMとニューラルネットでAIリテラシーと不安の関係を分析した研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、大学生のAI能力・AI倫理意識・AI不安の関係を、PLS-SEMとニューラルネットの二段階分析でモデル化した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIを使いこなせる学生ほど不安は減るのか、それとも倫理的な問題に気づくほど不安が増えるのか。題名から読み取れる問いは、AIに関する力・倫理感・不安の三者の関係を解きほぐすことです。", "unverified": "内容全体が未確認。"}}, {"id": "jn34", "rank": 34, "field": "教育", "headline": "ChatGPT利用は技能を通じて学生の就業可能性認識を高める", "title": "From prompt to profession: how ChatGPT usage relates to students' perceived employability through skill development", "url": "https://doi.org/10.1108/itp-10-2025-1539", "authors": "Bahar Javadi Khasraghi ほか", "venue": "Information Technology and People", "date": "2026-10-08", "sjr": 1.956, "citescore": 15.5, "citescore_year": "2025", "why": "生成AIの利用と技能開発・就業可能性認識の関係を学生調査で分析した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "ChatGPTの利用が、文章力・コミュニケーションなどの「熟達」の自己評価を通じて、学生の就業可能性の認識と関連することを示した（抄録）。", "p3": "100か国の学生21,716人の調査データを構造方程式モデルで分析し、熟達と分析的技能（批判的思考・問題解決）を媒介変数とした（抄録）。", "p5": "ChatGPT利用は両方の技能と正に関連したが、就業可能性と有意に関連したのは熟達のみで、熟達を通じた間接効果が有意だった（抄録）。", "fun": "ChatGPTを使う学生は、文章や伝える力が伸びたと感じ、それが就職への自信につながっていました。一方で、考える力が伸びたという実感は就職への自信には結びついていませんでした。AIで「上手に書ける」ことと「深く考えられる」ことの違いが表れているのかもしれません。", "unverified": "自己評価に基づく結果で、実際の技能は未確認。"}}, {"id": "jn35", "rank": 35, "field": "心理学", "headline": "映像証拠の顔照合に「顔照合ラインナップ」で誤認を抑える", "title": "Face-Matching Lineups: A Method to Control Mistaken Identifications in Video Evidence", "url": "https://doi.org/10.1177/09567976261487962", "authors": "Camryn N. Yuen ほか", "venue": "Psychological Science", "date": "2026-10-07", "sjr": 2.309, "citescore": 9.9, "citescore_year": "2025", "why": "防犯映像との顔照合で起きる誤認逮捕を減らす手続きを実験で検証した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "防犯映像の犯人と容疑者の顔照合に、無実の対照者を含むラインナップ方式を使うと、無実の容疑者を誤って一致とする誤りを抑えられることを示した（抄録）。", "p3": "カナダの大学の学生905人で、1対1の照合とラインナップの照合を比べた（抄録）。", "p5": "公正なラインナップは無実の容疑者での誤りを抑え、一致判断の正確さを高めたが、不一致判断の正確さは1対1のほうが高かった。複数の独立判断を集約する「群衆の知恵」で両方の誤りを除けた（抄録）。", "fun": "防犯カメラの顔と容疑者の写真を見比べて「同じ人だ」と判断する作業は、思ったより間違いやすく、誤認逮捕も起きています。目撃証言の研究で使われてきた「似た人を並べて選ばせる」方法を映像の照合にも使うと誤りが減りました。何人かの判断を合わせるとさらに減るという点も興味深いです。", "unverified": "誤り率の数値は未確認。"}}, {"id": "jn36", "rank": 36, "field": "地球科学", "headline": "256年分の日降水記録が北東アジアの雨季の変動を示す", "title": "A 256-year daily rainfall record reveals multiscale rainy-season variability and emerging hydroclimatic hazard over northern East Asia", "url": "https://doi.org/10.1126/sciadv.aeh6716", "authors": "Yuqi Wang ほか", "venue": "Science Advances", "date": "2026-10-07", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "機器観測以前まで遡る日降水記録から、雨季の多重スケール変動と新たな水災害リスクを示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "ソウルの1770〜2025年の256年分の日降水記録から雨季の始まり・終わり・長さを復元し、最近の雨季の長期化が数十年周期の変動の一部であることを示した（抄録）。", "p3": "256年の日降水記録から雨季の開始・終了・期間を再構成し、極端な降雨の強まりと合わせて複合的な水災害の確率を評価した（抄録）。", "p5": "雨季の期間には準10年〜数十年規模の変動があり、最近の長期化は繰り返す変動の正の局面と整合した。複合災害の確率は長期平均の約25%を最近上回った。今世紀半ばまで長い雨季が続く可能性が示唆された（抄録）。", "fun": "ソウルには朝鮮王朝の時代から雨量を記録した資料があり、256年分の毎日の雨を追うことができます。最近の長い梅雨は前例のない異常ではなく、数十年ごとに来る波の山だと分かりました。ただ、温暖化で雨の強さも増しているため、長い雨季と豪雨が重なる危険は高まっています。", "unverified": "見通しの手法の詳細は未確認。"}}, {"id": "jn37", "rank": 37, "field": "経済学", "headline": "泥炭地の記録から鉛・銀冶金の広がりを読み解く", "title": "Rise and spread of lead-silver metallurgy deciphered from peatland archives", "url": "https://doi.org/10.1126/sciadv.aec1413", "authors": "Hugo Delile ほか", "venue": "Science Advances", "date": "2026-10-07", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "泥炭の堆積記録から、欧州・地中海の鉱業と経済・政治の長期変化を復元した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "泥炭地に残る鉛同位体の記録から、6千年にわたる欧州・地中海の鉛・銀鉱業の広がりを復元する指標EMIIを作った（抄録）。", "p3": "環境記録の鉛同位体データを集め、泥炭記録に当てはめて鉛・銀の鉱石供給のパターンと鉱業由来の大気中鉛の相対変化を追う指標を導入した（抄録）。", "p5": "新石器時代末にはギリシャのラウリオンを中心とした初期の鉱業、青銅器時代には海上交易路に沿った拡大が見られ、鉄器時代以降はイベリア中心の通説と異なり多中心的な組織が示された。指標は初期ローマ時代に最初の大きなピークを迎えた（抄録）。", "fun": "昔の人が銀を取るために鉱石を溶かすと、鉛が空に舞い、遠く離れた泥炭の層に積もります。その鉛の「指紋」（同位体の比）を調べると、どの鉱山から来たかが分かります。泥の層が、6千年分の経済の歴史を記録したタイムカプセルになっているのです。", "unverified": "ローマ以後の推移の詳細は未確認。"}}, {"id": "jn38", "rank": 38, "field": "経済学", "headline": "メイン州ロブスター漁の「金色の罠」での日常的適応", "title": "Everyday adaptation in a gilded trap: Risk-taking and resilience in Maine’s lobster fishery", "url": "https://doi.org/10.1073/pnas.2613270123", "authors": "Joelle Kilchenmann ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-07", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "単一資源への依存が進む漁業で、漁業者のリスク選択と適応力を分析した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "米メイン州のロブスター漁業で、悪天候下で出漁するリスク行動が、属性と経済条件によって異なり、全体としては低下していたことを示した（抄録）。", "p3": "2010〜2022年の13年間、漁業者3,515人の30万7千件の観測を一般化線形混合モデルで分析し、悪天候での出漁確率を説明した（抄録）。", "p5": "男性、中堅、大きな事業の船長ほど悪天候で出漁しやすく、水揚げが少ないときと価格が高いときにリスクをとった。予想に反して、リスクをとる行動は全体として減っていた（抄録）。", "fun": "ロブスター漁はもうかる一方、他の魚がとれなくなり、漁師はロブスターに頼るしかない「金色の罠」にいます。そんな中で漁師は嵐の日に海に出るかを日々判断しています。値段が高い日や水揚げが少ない日に危険を冒すという結果は、経済的な圧力が命がけの判断に直結することを示しています。", "unverified": "リスク行動の減少の要因は未確認。"}}, {"id": "jn39", "rank": 39, "field": "都市", "headline": "経路を協調させると移動時間と排出が減る", "title": "Coordinated routing improves travel times and cuts emissions", "url": "https://doi.org/10.1038/s44284-026-00539-4", "venue": "Nature Cities", "date": "2026-10-08", "why": "Nature Cities掲載の、車両経路の協調による移動時間と排出の削減（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、車両の経路選択を個々に任せず協調させることで、移動時間と排出が減ることを示した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "みんなが「自分にとって一番速い道」を選ぶと、かえって全体が渋滞することがあります。題名から読み取れる問いは、経路を全体で調整すれば、一人ひとりの移動時間も排出も減らせるのか、というものです。", "unverified": "内容全体が未確認。"}}, {"id": "jn40", "rank": 40, "field": "統計学", "headline": "新規住宅建設への反対に人種的動機はあるか：測り方が結果を変える", "title": "“We need the right kind of people in this neighborhood”: racial motivation in opposition to new housing construction", "url": "https://doi.org/10.1017/psrm.2026.10131", "authors": "Clayton Becker", "venue": "Political Science Research and Methods", "date": "2026-10-08", "sjr": 2.574, "citescore": 6.2, "citescore_year": "2025", "why": "直接質問では測れない人種的偏見を間接的な測定法で捉え、住宅建設反対の動機を推定した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "新規住宅建設への反対に人種的な動機があるかを、文章・画像の要因実験と従来のリスト実験で測ると、結論が大きく食い違うことを示した（抄録）。", "p3": "直接質問では本音が出にくい人種的偏見について、文章と画像の要因実験とリスト実験の性能を比較した（抄録）。", "p5": "要因実験では人種的偏見の証拠はほとんどなかったが、リスト実験では近隣の人種構成の変化への懸念が回答者の意味のある割合に見られた（抄録）。", "fun": "「人種で反対しているのか」と直接聞いても正直な答えは返ってきません。そこで研究者は間接的な質問の工夫をしますが、方法によって結論が真逆になりました。何を測っているかは、どう測るかで決まってしまうという、社会調査の根本的な難しさを示す研究です。", "unverified": "リスト実験での割合の数値は未確認。"         box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
