<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-09-29", "intro": "プレプリントの新着のうち研究テーマに関連する候補282件、学術誌の新着（上位10%誌2,836件のうち関連1,019件から300件、その他の学術誌155件）、注目分野の候補（プレプリント273件、論文誌161件）から選びました。注目分野は、組織行動・心理的安全性、経済学、経営学、統計学、機械学習、因果推論の6分野と、今日のおすすめ分野（開発経済学、人口学）です。1時の自動実行が始まらなかったため、朝に手動で実行しました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目50報です。組織行動・心理的安全性はプレプリントに方法のしっかりした候補が少なく1報にとどまりました。各部の上位15報は詳しい解説、16位以下は抄録をもとにした短い解説です。あわせて、DataCiteに直近3日で登録された公開データセット・研究コードと、e-Statで新しく公表された統計から30件を「データ」タブに載せています。", "pre_related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "点検車両の振動で橋のデジタルツインを作る", "title": "A Vehicle-Integrated Approach to Digital Twin Deployment for Bridges", "url": "https://arxiv.org/abs/2609.30671", "authors": "Mehri Alamdari ほか", "date": "", "venue": "arXiv", "id": "pr01", "explain": {"basis": "本文", "basis_note": "arXiv版の本文PDF（プロジェクト報告書。進捗の節：FNOによる代理モデル、旧阿田橋の数値モデル、点検車両の最適化、仮想センシングと図表キャプション）を読んだ", "preprint": true, "p1": "センサを付けた点検車両の振動だけで橋を診断するため、車両-橋梁相互作用（VBI）モデル、状態推定、機械学習、代理モデルを組み合わせた「車両主導のデジタルツイン」の研究計画と途中成果をまとめた報告書で、旧阿田橋（日本のトラス橋）の実測と数値モデルを軸に3つの要素技術の進捗を示した（抄録、§2）。", "p2": "橋に常設センサを付ける方法は費用がかかり規模を広げにくい。一方、車両で測る応答は車両自身の動特性と路面の凹凸が支配的で、橋や損傷の情報はごく一部しか含まれないため、損傷の兆候が弱い（§2.3の冒頭、図5のキャプション）。", "p3": "①フーリエ・ニューラル・オペレーター（FNO：関数から関数への写像を学ぶニューラルネット）で、損傷のある梁の応答予測（順）と損傷の位置・程度の推定（逆）を学習した（§2.1、図3〜5）。②車両の質量とタイヤ-サスペンションの剛性を、健全時と損傷時の損傷指標の分布の1次Wasserstein距離（分布の離れ具合）が最大になるよう、1,500通りの車両構成のKriging代理モデルと粒子群最適化で選んだ（式19〜20、§2.3.2）。③拡張カルマンフィルタ（AKF）で移動荷重を推定し、センサのない位置の変位・速度・加速度を再構成する仮想センシングを作った（§2.4）。", "p4": "旧阿田橋の2次元FEモデルを実測の固有振動数とモード形（MAC）で更新し（9個の不確実パラメータをTMCMCで更新）、その数値ツインで各手法を検証した（§2.2）。仮想センシングでは車両が時速40kmで通過し、200Hzで6チャンネル（変位1、加速度5）に5%の雑音を加えた条件で、計測していない格点の応答を真値と比べた（§2.4.2）。", "p5": "モデル更新で1〜3次の振動数の誤差は8.24%・17.65%・16.65%から約0.02%・0.27%・0.13%に下がり（表2）、MACはすべて0.80以上だった（図7）。車両の最適化では、車両と橋の振動数比がおよそ0.3〜0.7の範囲が有利で、比が1付近は不利だった（図11）。仮想センシングでは計測していない格点の変位を正規化RMS誤差0.58%、速度を5.01%で再構成した（§2.4.2、図13）。", "p6": "進捗報告であり、FNOのトラス橋への移植、車両最適化の他の橋への移転性、車両-橋梁連成系での路面凹凸・車両パラメータ・移動荷重の同時推定は今後の課題とされている（抄録、§2.4.3）。解釈：仮想センシングの検証は推定器と同じモデルで作った数値データによるもので、実測でのモデル誤差の影響はまだ評価されていない。未査読の報告書である。", "fun": "橋にセンサをたくさん付ける代わりに、センサを積んだ車で橋を渡るだけで診断しようという発想。ただ車の揺れのほとんどは車自身と路面のでこぼこから来るので、橋の傷の信号はとても小さい。そこで「どんな重さ・硬さの車なら橋の変化を一番よく拾えるか」を最適化で探したら、車と橋の揺れやすさの比がちょうど同じ（共振）より少しずらした範囲が有利だった、という点が面白い。", "unverified": "FNOの損傷推定精度の数値（図5）と、表3（損傷状態の振動数）の値は本文で確認していない。"}}, {"rank": 2, "theme": "LLM熟議・ペルソナ", "headline": "人とLLMペルソナが論証で政策を熟議する仕組み", "title": "OmouAI: Argumentative Human-AI Policy Deliberation with Simulated Personas", "url": "https://arxiv.org/abs/2609.31078", "authors": "Stylianos Loukas Vasileiou ほか", "date": "", "venue": "arXiv", "id": "pr02", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（デモ論文の全文：序論とシステム概要、図1のキャプション）を読んだ", "preprint": true, "p1": "人間の利用者が、利害関係者・専門家・悪魔の代弁者といった模擬ペルソナと政策の主張を論じ合い、その議論を計算論的議論（computational argumentation）の枠組みで評価して、国連の持続可能な開発目標（SDGs）などへの影響として結論を示すシステム「OmouAI」を示した（抄録、System Overview）。", "p2": "LLMどうしの討論は意思決定に役立つが、人間が加わる政策熟議では、利用者に迎合する傾向（sycophancy）や、推論が見えず説明が忠実でない問題がある。Habermas Machineのような熟議支援はLLMを「ブラックボックスの仲介者」として使い、判断の理由を明示していなかった（Introduction）。", "p3": "LLM層が各ペルソナの立場から論証（攻撃または支持）を1つずつ生成して基礎点を付け、利用者の自由な発言も論証に変換する。議論層ではそれらを主張と目標指標を根とする量的二極議論枠組み（QBAF：論証の間の攻撃・支持の関係と基礎点からなるグラフ）にまとめ、DF-QuADなどの漸進的意味論で各論証の強さを決定論的に計算する（System Overview）。ペルソナは3〜5個の価値へのこだわり、受け入れる証拠の種類、推論の慎重さだけで指定する（同節）。", "p4": "デモ（システム紹介）論文であり、利用者実験や比較による定量的な評価は本文にない。性能の根拠として、採用した意味論が「利用者の介入が意図した方向に判定を動かす」といった争点化可能性の性質を満たすことを挙げている（Evaluation）。", "p5": "気候変動政策を例にしたパイプラインを図1で示している（図1）。論証は経験的・予測的・規範的の3種類に分けて採点され、主張と指標は中立の0.5から始まり、議論の結果として主張と各目標についての判定が出る（System Overview）。定量的な結果は報告されていない。", "p6": "著者は、生成される論証は基盤モデルの偏りと利害関係者の価値体系を反映し、現実の意思決定に使う前に専門家の評価が必要な支援ツールだと述べている（Responsible Use）。解釈：迎合をどれだけ減らせるか、判定が人の熟議の質を高めるかは実証されていない。未査読のプレプリントである。", "fun": "AIと議論すると、AIがこちらに合わせて「おっしゃる通りです」と言いがちになる問題がある。この研究は、立場の違うAIの登場人物（反対役も含む）を並べ、議論を「どの意見がどの意見を攻撃・支持しているか」の図にして、計算で強さを決める。名前のOmouは日本語の「思う」とギリシャ語の「一緒に」を掛けたもので、人とAIが一緒に考える仕組みという狙いが込められている点も面白い。", "unverified": "利用者実験や評価の数値は本文になく、確認できなかった。"}}, {"rank": 3, "theme": "LLM熟議・ペルソナ", "headline": "合成回答の回帰係数は人間と同じ結論になるか", "title": "Beyond Marginal Fidelity: An Estimand-Matched Audit of LLM-Simulated Chinese Public Opinion", "url": "https://doi.org/10.31235/osf.io/276rd_v1", "authors": "Mingkun Cui ほか", "date": "2026-09-28", "venue": "SocArXiv", "id": "pr03", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文PDF（方法、結果の4.1〜4.2節、表1〜3の説明、限界と結論）を読んだ。補足資料（S7〜S20）は確認していない", "preprint": true, "p1": "LLMで作る「シリコン標本（合成回答者）」について、同じ人物設定（ペルソナ）の人間とLLMの回答に同じ回帰をかけ、社会科学の結論を左右する回帰係数が保たれるかを確かめる「推定対象に合わせた監査（estimand-matched audit）」を示し、分布の当てはまりが良くても係数の結論はずれることを実証した（抄録、§6）。", "p2": "合成回答の検証は、回答分布（周辺分布）の一致から多変量の構造の一致へと進んできたが、こうした全体的な指標では、下流の分析が報告する係数（推定対象）が保たれるかは分からない（抄録、§2.1）。", "p3": "中国総合社会調査（CGSS）の2017年（主）と2021年（再現）の実在の回答者1,000人ずつの属性（性別・年齢・学歴・戸籍の都市/農村・地域・世帯所得四分位など）をペルソナにし、4つの2026年のモデル（米国製2、中国製2）に同じ質問票を答えさせる（§3.1〜3.2）。人間とLLMの回答それぞれに、態度＝性別＋年齢＋学歴＋都市＋所得＋項目固定効果の同じ回帰を当て、係数の差を人物単位でクラスタ化した交互作用モデルで検定する（§3.3）。", "p4": "周辺の当てはまりは総変動距離（TVD、低いほど良い）、係数の回復は人間とLLMの係数の相関（高いほど良い）で測り、所得・性別・都市/農村の3つの目標係数について差の95%信頼区間とHolm補正のp値で評価した（§3.3、表1、表3）。", "p5": "2017年の周辺TVDはDeepSeekが0.300で最良、Qwenが0.425で最悪で、いずれも人間の部分標本（約0.02〜0.03）より1桁大きかった（表1、§4.1）。係数相関はClaudeの+0.750から GPT-5.4の+0.220までばらついた（表1）。4モデルとも両年で所得の正の関連を示したが人間の基準はほぼゼロで、ずれは公平感と一般的信頼の項目に集中し、3モデルで都市/農村の符号が逆転し、性別に関するずれの点推定は年によって向きが変わった（抄録、§4.2、図2）。", "p6": "著者は、復号条件の統制が不完全で温度の感度は2モデル1年分しか調べていないこと、1回の生成で全項目に答えさせる方式に結果が依存しうること、1か国・1調査・4モデルに限られることを限界に挙げている（§5.4）。性別のずれは多重比較補正後はどちらの年も支持されなかった（§6）。未査読のプレプリントである。", "fun": "AIに「中国の50歳の農村の男性として答えて」と頼むと、全体の回答の割合はそれらしく再現できる。ところが「所得が高い人ほど公平だと感じるか」のような、社会学者が本当に知りたい関係を計算すると、人間のデータにはない傾向がAIの回答には出てしまった。見た目の平均が合っていても、中身の因果の読み取りは食い違うという、AIを調査の代わりに使うときの落とし穴が面白い。", "unverified": "表2・表3の個々の係数と信頼区間の数値、補足資料の頑健性の結果は確認していない。"}}, {"rank": 4, "theme": "会計情報科学", "headline": "学習データに異常が混ざると検知器の順位が崩れる", "title": "Training-Set Contamination in Unsupervised Anomaly Detection: An Audit, a Selection Trap, and What Label-Free Fixes Can (and Cannot) Do", "url": "https://doi.org/10.2139/ssrn.7537273", "authors": "Yiran Zhao ほか", "date": "2026-09-28", "venue": "SSRN", "id": "pr04", "explain": {"basis": "抄録", "basis_note": "SSRN掲載のため本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": true, "p1": "教師なし異常検知の学習データに異常が混ざっている（汚染されている）とき、検知器の順位、ラベルなしでのモデル選択、しきい値の3つがどう変わるかを、実データで系統的に監査した研究である（抄録）。", "p2": "教師なし異常検知は学習データが正常データだけだと仮定するが、実運用では異常を取り除く前にデータを集めるため、学習データはほぼ必ず汚染されている。一方でベンチマークはきれいな分割で学習させるので、汚染が結論をどう変えるかが未解明だった（抄録）。", "p3": "異常の意味をODDSの慣例と照合した10の実表形式データ、10の検知器、5つの汚染率、5つの乱数シードを組み合わせ、2,456回の学習結果を記録した（抄録）。大きさをそろえた対照条件も置き、汚染による低下とデータ量の変化を区別した（抄録）。", "p4": "性能はAUROC、検知器の順位の保たれ方はKendallのτで測った。ラベルなしのモデル選択は、合成した参照用の外れ値と学習データをどれだけ分けられるかで候補を順位づける方式を、無作為選択、常にIsolation Forestを選ぶ方式、正解を知るオラクルと比べて評価した（抄録）。", "p5": "密度に基づく検知器は崩れ、LOFは汚染率0.2でAUROCが27ポイント下がった一方、確率モデル系のCOPODは2.2ポイントの低下にとどまった（抄録）。きれいなデータでの検知器の順位の一致はτ 0.68から0.32へ下がった（抄録）。ラベルなしのモデル選択は無作為選択をわずかに上回るだけで、常にIsolation Forestを選ぶ方式を有意に上回ることはなく、オラクルでも選択の価値は4.5ポイントが上限だった（抄録）。参照に導かれた汚染除去はLOFを5.1ポイント改善し、どの検知器も悪化させなかったが、汚染率の推定は試したすべての合成参照の作り方で失敗した（抄録）。", "p6": "抄録からは表形式データに限った結果であること以外の限界は読み取れない。コード・データの出所・生の結果は公開とされるが、本文は確認できていない。未査読のプレプリントである。", "fun": "「普通のデータだけで学習する」はずの異常検知AIに、実は最初から異常が混ざっていたらどうなるか、という現実的な問いである。LOFという手法は混ざり方が増えると成績が大きく落ちるのに、別の手法はほとんど平気だった。さらに、正解ラベルなしで一番良い手法を選ぶ定番のやり方が、ほぼくじ引きと変わらないという結果は、「選び方」そのものを疑う大切さを教えてくれる。", "unverified": "本文が入手できず、データセット別の結果、しきい値への影響の具体的な数値、汚染除去の手順の詳細は確認できていない。"}}, {"rank": 5, "theme": "会計情報科学", "headline": "頑健な反実仮想説明の評価を一つの枠で比べる", "title": "Robust to Which Model Change? A Unified Evaluation of Robust Counterfactual Explanations", "url": "https://arxiv.org/abs/2609.30918", "authors": "Marcin Kostrzewa ほか", "date": "", "venue": "arXiv", "id": "pr05", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（評価設計の3章、結果の4章、考察と限界の5章）を読んだ。付録の全データ別の表は確認していない", "preprint": true, "p1": "モデルが変わっても有効であり続ける「頑健な反実仮想説明（CFE、どこを変えれば判定が覆るかの提示）」の各手法を、同じ8種類のモデル変更に対して横並びで評価する統一的な評価手順を提案し、比較した研究である（抄録、§5.1）。", "p2": "パラメータの小さな摂動、新しいデータでの再学習、構造の変更は異なる出来事なのに、既存手法はそれぞれ自分の想定する変化だけで評価されてきたため、報告される頑健性の数値は互いに比べられなかった（抄録、§1〜2）。", "p3": "4つの2値の表形式データ（乳がん診断、糖尿病、ワイン品質、HELOC）で、32ユニット2層のニューラルネットを5回独立に学習させ、各基本モデルに8つの変更の種類（初期値の変更、ブートストラップ、データの削除・追加、ラベルの反転、学習設定、構造、パラメータ摂動）ごとに25個の変更モデルを作った（§3.1〜3.2、表2）。頑健な6手法と2つの標準的な基準手法で説明を作り、事実のデータと生成した説明を固定したまま全変更モデルで試した（抄録、§3.3）。", "p4": "変更後のモデルでも説明が有効なままの割合（経験的頑健性）を、説明を返せた割合（カバー率）、元のモデルで有効な割合、元の点からの距離（近さ）と一緒に報告し、各変更がどれだけ予測を変えたかを予測の不一致率で測った（抄録、§3.4、§4）。", "p5": "変更の種類をまたいで安定した手法の順位はなく、乳がんデータではAPΔSが有界なパラメータ摂動で94%の頑健性を示したが、新しい初期値では11%、構造の変更では16%だった（§4.1）。有界なパラメータ摂動が変えたテスト予測は0.95%で、ブートストラップによる再学習の4.92%より小さかった（§4.1）。RobXの2つの設定は常に99.4%以上、RNCEは95%以上を保ったが、頑健さは距離の増加を伴い、HELOCでは厳しい設定で距離が0.959から1.367へ増えた（§4.1、§4.3）。ROAR-LIMEはワイン品質で頑健性93.1%でも元のモデルで有効な候補が72.8%で、全体では67.8%にとどまった（§4.2）。", "p6": "著者は、数値特徴の2値分類の表データに限られ、多クラス・画像・文章、因果的な実行可能性、変えられない特徴、実行にかかる時間は扱っていないこと、近さ以外の望ましさ（疎さ・多様さ・もっともらしさ）は評価していないこと、微分可能なニューラルネットに限ったことを限界に挙げている（§5.2）。未査読のプレプリントである。", "fun": "ローンの審査に落ちた人に「年収をあといくら上げれば通ります」と教える説明は、銀行がAIを作り直した後も正しくなければ困る。この論文は、AIの「作り直し方」には細かな調整から作り替えまで種類があり、ある作り直しに強い方法が別の作り直しには弱いことを示した。約束を守りやすい説明ほど、要求する変化が大きくなるという引き換えがある点も面白い。", "unverified": "付録の全データ別の数値（表6）と生成時間の比較は確認していない。"}}, {"rank": 6, "theme": "包摂的コミュニティ・社会", "headline": "孤独な人は他人を信頼しないのか：2.7万人の実験", "title": "The impact of loneliness in self and others on trust and trustworthiness: evidence from a large-scale trust game experiment", "url": "https://hal.science/hal-05766402v1", "authors": "Astrid Hopfensitz", "date": "2026-09-27", "venue": "HAL", "id": "pr06", "explain": {"basis": "抄録", "basis_note": "全文取得では題名しか得られなかったため、候補一覧に含まれていたHALの抄録を読んだ。本文は確認していない", "preprint": true, "p1": "孤独感が他人への信頼（信頼する行動）と、孤独な人が他人からどう扱われるか（信頼される度合い）にどう関わるかを、金銭の報酬がかかった大規模な信頼ゲーム実験で調べた研究である（抄録）。", "p2": "孤独は増えつつあり、社会の水準では社会関係資本や信頼の低下と、個人の水準では偏見も一因となる抑うつと結びつけられてきた。孤独が経済的なやりとりに必要な信頼行動を損なうのかが問われていた（抄録）。", "p3": "参加者約27000人の、報酬が実際に支払われる信頼ゲーム（相手にお金を預けると増えて、相手が返すかどうかを選ぶゲーム）を使い、(i)本人の孤独感と相手を信頼する行動の関係、(ii)相手が孤独だと分かっているときの信頼のされ方を調べた（抄録）。", "p4": "信頼ゲームで相手に預ける行動を信頼、相手の孤独についての情報を与えたときの預け方を社会の反応として測った（抄録）。具体的な指標や推定の方法は抄録からは分からない。", "p5": "(i)孤独感と信頼の間に負の相関は見られず、(ii)孤独だと知られている人のほうがむしろ信頼されやすかった（抄録）。著者はここから、信頼ゲームで表される経済的なやりとりに必要な信頼行動を、孤独が損なうわけではないと結論している（抄録）。", "p6": "抄録からは、孤独感の測り方、参加者の国や集め方、効果の大きさ、孤独な人が信頼されやすい理由（同情か、裏切らないと見られるのか）は分からない。未査読の可能性がある原稿である。", "fun": "「孤独な人は人を信じにくくなる」と考えがちだが、約27000人でお金を預け合うゲームをしてみると、そうした傾向は見られなかった。それどころか、孤独だと知られている人のほうが相手から信頼されやすかった。孤独への偏見があるのに、行動では逆に信頼が向けられるというずれは、なぜ起きるのかを考えたくなる。", "unverified": "本文が入手できず、孤独感の尺度、実験の実施国と参加者の集め方、効果の大きさ、統制した変数は確認できていない。"}}, {"rank": 7, "theme": "都市・インフラ政策", "headline": "土地価値の還元が進まないのは制度と政治の問題", "title": "Governance, Not Instruments: Institutional Constraints on Land Value Capture in England and Brazil", "url": "https://doi.org/10.5281/zenodo.23002575", "authors": "Beatriz Frasão Tonon", "date": "2026-09-27", "venue": "Zenodo", "id": "pr07", "explain": {"basis": "本文", "basis_note": "ZenodoのPDF（序論、制約を論じるPart A、対策を論じるPart B、結論）を読んだ。文献に基づく論考で、独自のデータ分析はない", "preprint": true, "p1": "公共投資で上がった地価の一部を公共に取り戻す「土地価値還元（LVC）」がなぜ十分に使われないのかを、イングランドとブラジルの経験から論じ、障害は技術ではなく制度と政治にあるので、必要なのはより良い手段よりもより良い統治だと主張する論考である（抄録、序論）。", "p2": "LVCはインフラ財源として広く勧められているのに一貫して使われておらず、技術の問題と制度・政治の問題を区別しないと、根本原因を残したままの表面的な解決に終わる、という問題意識から出発している（序論）。", "p3": "既存研究と事例を使い、制約を技術・法律・市場の3群に分けて両国を比べ（Part A）、次にサンパウロの定式化された負担金（OODC）、建築権の競売（CEPAC）、社会住宅への義務的な配分と市民参加の監督を持つ基金（FUNDURB）、収入の地域間でのプール、法律による固定化という対策を検討する（Part B）。", "p4": "対策の良し悪しは、収入を生んだかではなく、その収入が最も不利な地域に民主的な統治を通じて届いたかという公正さの基準（Fainstein）で評価している（Part B）。", "p5": "ロンドンの地下鉄ジュビリー線延伸の地価上昇の推計は、カナリー・ワーフについて£300 millionから£2.7 billionとする研究と£40 millionとする研究があり、67-fold（67倍）の開きがあった（Part A）。イングランドの開発利益課税は1947年、1967年、1976年に導入されては廃止された（Part A）。サンパウロのÁgua Espraiada都市事業はBRL 3.9 billionを集めたが、約60%は高所得層向けの道路に使われ、立ち退いた800世帯以上の住民への社会住宅には回らなかった（Part A）。一方、FUNDURBはOODC収入の少なくとも30%を社会住宅に義務的に配分し、市民社会が議決権の半分を持つ評議会で管理している（Part B）。", "p6": "文献と事例の整理に基づく論考で、主張を独自のデータで検証してはいない。取り上げる事例はサンパウロに偏り、著者自身もサンパウロは全国の標準ではなく例外だと述べている（Part A）。未査読の原稿である。", "fun": "駅ができると周りの土地の値段は上がるが、その駅を造ったのは税金である。では、上がった分は誰のものか、というのがこの論文の問いだ。ロンドンでは同じ地下鉄の効果の見積もりが67倍も食い違い、測ること自体の難しさが分かる。著者は、測り方を工夫するより、あらかじめ決めた計算式や競売でルールを透明にするほうが大事だと説く。", "unverified": "引用されている各数値の元の研究は確認していない。"}}, {"rank": 8, "theme": "VBI・橋梁SHM", "headline": "物理を事前分布に入れたテンソル自己符号化器で異常検知", "title": "Bayesian Tensor Autoencoder with Physics-informed Predictive Prior for Multi-dimensional Time Series Anomaly Detection", "url": "https://arxiv.org/abs/2609.31157", "authors": "Jianan Liu ほか", "date": "", "venue": "arXiv", "id": "pr08", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（抄録、データセット、実験設定、結果とアブレーション、結論）を読んだ。付録の変分ベイズの導出と表5の個々の数値は確認していない", "preprint": true, "p1": "交通センサーの「地点×車線×指標×時間」のような多次元（テンソル）の時系列から異常を見つけるため、現在の観測を再構成するオートエンコーダに、過去から現在を予測する「予測事前分布」をベイズ的に融合し、さらにテンソルの低ランク分解という物理的な規則を組み込んだPPPTAEという手法を提案した（抄録、§5）。", "p2": "既存の時系列異常検知の多くは1変量・多変量の時系列を前提とし、多次元の時系列に使うには形を並べ替える必要があって、その際に次元間の本来の相関が壊れ性能が落ちる。また、再構成型と予測型のオートエンコーダは別の情報を使っていて、両者を生かし切れていなかった（抄録）。", "p3": "テンソルのオートエンコーダを骨格にし、エンコーダの出力と予測事前分布をベイズ融合し、正常データを低ランクの小さな空間に押し込むベイズ的テンソル分解の部品で、オートエンコーダが異常まで上手に再現してしまう過剰汎化を抑える（抄録、§2、図5）。評価には、49台のレーダーセンサー×4車線×3指標の高速道路交通データ（Freeway）、米国の気象データ（HR-Extreme）、ミラノの通信データ（Milan）を使った（§4.1）。", "p4": "しきい値を動かしてROC曲線を描いたときのAUC（高いほど良い）で評価し、15の既存手法と6つのデータ設定で比べ、部品を外したアブレーションで各部の効果を調べた（§4.3、§4.4）。", "p5": "提案手法はすべてのデータ設定で既存手法より高いAUCを示した（§4.3.3）。アブレーションでは、再構成型の基本モデルのFreewayでのAUC 75.09%に対し、ベイズ低ランク部品と予測事前分布をともに入れた完全版は95.39%で、Milanでは90.12%から98.90%へ上がった（表6）。再構成型は急な異常、予測型は時間的に続く異常に強く、提案手法は両方の長所を統合できていた（§4.4）。", "p6": "著者は限界を明記していない。気象データは計算量のため空間を64×64に切り出して使っており、既存手法には次元をまとめて入力しているため、比較条件が既存手法に不利な面がある（§4.3.2〜4.3.3）。未査読のプレプリントである。", "fun": "交通のデータは「どの地点の、どの車線の、どの指標が、いつ」という何層にも重なった表になっている。これを一列に並べ直すと、隣の車線どうしの関係のような大事な手がかりが消えてしまう。この研究は形を崩さずに扱い、「今の様子」と「過去からの予想」の両方と比べて事故などの異常を見つける。二つの見方のいいとこ取りを確率の考え方でまとめた点が面白い。", "unverified": "表5の手法別のAUCの数値、付録の導出、計算時間は確認していない。"}}, {"rank": 9, "theme": "位相空間・土木三力学", "headline": "海底の物体を動かしてできる非線形波と粒子軌道", "title": "Particle Trajectories Beneath Fully Nonlinear Waves Generated by Horizontal Seabed Motion", "url": "https://arxiv.org/abs/2609.30687", "authors": "Jo\\~ao Vitor P. Poletto ほか", "date": "", "venue": "arXiv", "id": "pr09", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（定式化の2章、実験との照合の3章、数値結果の4章の冒頭、結論）を読んだ。付録の導出と4章の図の細部は確認していない", "preprint": true, "p1": "海底の障害物が水平に動くとき（海底地すべりなど）にできる非線形の波について、水面の形だけでなく、水中の一つ一つの粒子がどう動くかを計算する方法（ラグランジュ的な定式化）を作り、粒子の動きが海底の動きと波のどちらに主に支配されるかを明らかにした（抄録、§5）。", "p2": "時間とともに形が変わる領域を写像で固定する既存の計算では、粒子の軌跡を追えるのは形を変えずに進む波に限られており、真に非定常な流れで水中の粒子の動きを調べる方法がなかった（§5）。", "p3": "動く水面と海底を同時に固定した境界に写す時間依存の等角写像の上で完全なオイラー方程式を解き、写像の時間変化を解析関数の実部と虚部で表す閉じた形の軌跡の式を導いた（抄録、§2.3）。実験室の地形はエルミート補間で取り込めるようにし、半楕円形の障害物が加速・等速・減速する既存の実験で検証した（§2.4、§3.1）。", "p4": "Whittakerらの2組の独立した実験と照合して精度を定量評価し、滑りの終端速度を表すフルード数Frが0.125（実験と同じ）と1.2の場合を比べ、粒子の初期位置ごとの変位を調べた（§3、§4、§5）。", "p5": "モデルはフルード数0.125から0.5の範囲の実験とよく一致した（§5）。フルード数が低いと粒子の変位は主に海底の動きに由来し、高いと特に水面近くや障害物の通り道から離れた場所で、生じた波の影響が強まった（抄録、§5）。線形理論からのずれを決めるのは滑りの終端速度で、障害物の形は面積・高さ・重心が同じならほぼ関係なく、このことを8つの形状で完全なオイラー方程式の範囲でも確かめた（§5）。Fr=1.2では加速度が最も小さいときに先頭の波が最も大きくなり、低いフルード数での傾向と逆になった（§5）。", "p6": "扱うのは2次元の理想流体（ポテンシャル流）で、障害物の動きはあらかじめ与えたもので、地すべりそのものの変形や砕波は扱っていない。振動する滑りや連続する滑りは今後の課題とされている（§5）。未査読のプレプリントである。", "fun": "海の底で地すべりが起きると津波が生まれるが、そのとき水の中の一粒一粒はどう動くのだろうか。この研究は、動く海底と波の両方に合わせて伸び縮みする「地図」を数学で作り、粒子の道筋を追えるようにした。ゆっくりした滑りでは水は海底に引きずられるように動き、速い滑りでは波が主役になるという、主役の交代が見えるのが面白い。", "unverified": "表3の誤差の数値と、図に示された粒子の変位の具体的な値は確認していない。"}}, {"rank": 10, "theme": "LLM熟議・ペルソナ", "headline": "討論の合意を捏造する要約を来歴ゲートで防ぐ", "title": "Towards Mitigating Fabricated Consensus: The Active Provenance Gate for Multi-Agent Debate Synthesis", "url": "https://arxiv.org/abs/2609.31422", "authors": "Jakub Mas{\\l}owski ほか", "date": "", "venue": "arXiv", "id": "pr10", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（PFの定義、仕組み、実験設定、結果、考察と限界、結論）を読んだ", "preprint": true, "p1": "複数のLLMエージェントに議論させる仕組み（マルチエージェント討論）で、最後の要約が議論の記録にない「でっち上げの合意」を書いてしまう問題に対し、公開前に要約の主張を一文ずつ記録と照合し、根拠がなければ修正させ、それでも足りなければ合意できなかったことを明示する報告に切り替える検証層APGを提案した（抄録、§VII）。", "p2": "詳しい討論記録があっても、要約するモデルは記録に根拠のない、滑らかな合意文を作りがちで、出所を記録するだけの受け身の仕組みではこれを防げない。安全上の空白になっている最終統合の段階を、どう統制するかが課題だった（抄録、§I）。", "p3": "要約の各文が討論の記録から含意されるかを別の高性能モデルに自然言語推論（NLI）で判定させ、根拠のある文の割合を出所忠実度（PF）と定義した（§II-C）。PFが0.95未満なら最大3回まで自己修正させ、それでも届かなければ公開を止めて相違の報告を出す（§III、§V-B）。知識注釈つきの90本の討論の軌跡で試し、33人に従来の要約とAPGの報告を比べてもらう盲検のA/B調査も行った（§IV）。", "p4": "根拠の強さはPF（1.0で完全に追跡可能）、相違報告を出した割合、同じモデルで生成と検証をした場合と別モデルで検証した場合の誤判定、利用者の5段階の信頼で評価した（§II-C、§IV、§V）。", "p5": "従来の要約のPFは対立が強い条件で0.288、弱い条件で0.183と低かったが、自己修正で0.617と0.586に上がった（§V-A）。それでも基準に届かず相違報告になった割合は、強い対立で75.0%、弱い対立で60.0%だった（§V-A）。同じ軽量モデルに生成と検証をさせると危うい妥協を85.6%で誤って通したのに対し、検証だけ高性能モデルにすると63.3%を差し戻した（§V-B）。利用者の66.7%は従来の要約のほうが滑らかだと答えたが、行き詰まりの場面では75.8%がAPGの報告のほうが証拠に忠実だと判断し、信頼も3.27対2.45でAPGが高かった（p=0.0039）（§V-C）。", "p6": "著者は、合成したシミュレーションと人工的に入れた衝撃に基づく評価であること、外の現実ではなく集めた証拠の中だけで照合する閉じた世界の仮定であること、33人の参加者は便宜的に集めた理工系中心の人で専門の運用者ではないこと、LLMによる判定に偏りがあり、判定役のLLMで評価する循環のおそれがあることを限界に挙げている（§VI）。未査読のプレプリントである。", "fun": "何人かで議論してまとまらなかったのに、議事録係が「全員合意しました」ときれいにまとめてしまったら困る。AI同士の議論でも同じことが起き、要約役のAIが記録にない合意を作ってしまう。この研究は要約を一文ずつ記録と照らし、根拠がなければ「合意できませんでした」と正直に報告させた。人は滑らかな文を好むのに、大事な場面では正直な失敗報告のほうを信頼したのが面白い。", "unverified": "図3・図4の条件ごとの詳しい値と、使った討論コーパスの中身は確認していない。"}}, {"rank": 11, "theme": "会計情報科学", "headline": "監査上の主要な検討事項は資本コストを動かすか", "title": "Do Key Audit Matters Move Investors' Required Returns? Evidence from Japan", "url": "https://doi.org/10.2139/ssrn.7527500", "authors": "Hikaru Mitsuhashi ほか", "date": "2026-09-28", "venue": "SSRN", "id": "pr11", "explain": {"basis": "抄録", "basis_note": "SSRN掲載のため本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": true, "p1": "監査報告書に「監査上の主要な検討事項（KAM）」を書くことが、投資家の求める収益率（資本コスト）を変えるかを、日本の二段階の導入（2020年に任意、2021年に義務）を使って調べ、株価の評価の見直しは確認できないと結論した研究である（抄録）。", "p2": "KAMは監査人が特に重要と判断したリスクを開示させる制度だが、それが投資家の評価を実際に動かすかは明らかでない。制度導入後の評価で、予測に敏感な指標をそのまま投資家の利益と読むと誤る恐れがある（抄録）。", "p3": "2019〜2025年の10,519社・年のうち、任意の段階でKAMを早期に適用した29社を処置群とし、4つの「予想から逆算した資本コスト（ICC）」のモデルとその平均で、早期適用企業の変化を比べた（抄録）。ICCをその入力（株価とアナリスト予想）に分解し、何が動いたかを特定した（抄録）。", "p4": "4モデルの平均のICC、利益予想にほとんど依存しないモデルのICC、最小検出効果（どれだけの差なら見つけられたか）、ICCの入力への分解で評価した（抄録）。", "p5": "4モデル平均のICCは早期適用企業で大きく上がったが、利益予想にほとんど依存しないモデルでは上昇が見られず、この「差がない」結果は最小検出効果が0.76パーセントポイントと十分な検出力を持っていた（抄録）。分解すると、上昇は株価ではなく2年先の予想の成長の差に由来し、投資家による評価の見直しではなかった（抄録）。義務化によって早期適用企業との差は広がらなかった（抄録）。", "p6": "予想を動かしたものが何で、その予想が実現したかは未解決と著者自身が述べている（抄録）。29社という早期適用企業の少なさと、自ら選んで早期適用した企業の特徴の影響は抄録からは評価できない。未査読のプレプリントである。", "fun": "監査人が「この会社のここが要注意」と書く新ルールで、投資家はその会社の株をより厳しく見るようになるのか、という問いである。一見、資本コストが上がったように見えたが、分解するとアナリストの予想の数字が動いただけで、株価は反応していなかった。物差しの作り方しだいで結論が逆に見えてしまう、という教訓が面白い。", "unverified": "本文が入手できず、4つのICCモデルの名前、推定式、統制変数、個々の推定値は確認できていない。"}}, {"rank": 12, "theme": "職場AI・組織行動", "headline": "部分的な自動化は人の関係的な仕事を増やす", "title": "The Relational Burden of AI Adoption: Human Work, Organizational Readiness, and the Hidden Costs of Partial Automation", "url": "https://doi.org/10.2139/ssrn.7537584", "authors": "Sumreen Chaudhry", "date": "2026-09-28", "venue": "SSRN", "id": "pr12", "explain": {"basis": "抄録", "basis_note": "SSRN掲載のため本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": true, "p1": "AIで仕事の一部を自動化した後に人間の側に残る仕事、つまり解釈し、修復し、責任を負い、役割の意味を保つための「関係的な導入負担」という概念を提案し、それを和らげる組織の備え（HCAIR）の枠組みと8つの命題を示した概念論文である（抄録）。", "p2": "AI導入の研究は技術の能力、作業の効率、普及を重視し、自動化の後に生まれる人間の仕事にはあまり目を向けてこなかった（抄録）。", "p3": "人とAIの協働、感情労働、信頼、心理的安全性、専門職の境界づくり、仕事の要求度、AI導入の研究を統合して概念を組み立てた（抄録）。特に中小企業を、一人が多くの役割を持ち、関係への依存が強く、専門化が限られ、組織の余裕が少ないために残った仕事が見えやすい場として取り上げた（抄録）。", "p4": "実証的な評価はない。組織の備えを、参加型の導入、役割と責任の明確さ、心理的安全性と発言、調整された信頼とAIリテラシー、関係の負荷と仕事の質の5要素で表し、負担が生じる条件と和らぐ条件を命題として示した（抄録）。", "p5": "部分的な自動化は定型の作業を減らす一方で、例外処理、確認、説明、責任を人間の働き手に集中させうると論じた（抄録）。8つの命題で、負担がいつ生じ、HCAIRがそれをどう和らげ、どう検証できるかを示した（抄録）。", "p6": "概念論文であり、命題はまだデータで検証されていない。抄録からは、概念の測り方や、どの業種を想定するかは分からない。未査読のプレプリントである。", "fun": "AIが仕事を肩代わりしてくれれば人は楽になる、と考えがちだ。しかし実際には、AIが対応できない例外の処理、AIの答えの確認、客への説明、失敗したときの責任が人間に集まってくる。この論文は、その「見えにくい残り仕事」に名前を付けて考えようとしている。便利な道具が別の種類の苦労を生むという視点が面白い。", "unverified": "本文が入手できず、8つの命題の具体的な内容と、概念を測る方法の提案は確認できていない。"}}, {"rank": 13, "theme": "サービス・マーケティング", "headline": "動的電気料金への切替はいつ得か：切替コストの壁", "title": "Who Benefits from Dynamic Electricity Tariffs? Switching Costs and Adoption Constraints in Germany", "url": "https://doi.org/10.2139/ssrn.7528760", "authors": "Heide Rogers", "date": "2026-09-28", "venue": "SSRN", "id": "pr13", "explain": {"basis": "抄録", "basis_note": "SSRN掲載のため本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": true, "p1": "ドイツの家庭が、市場価格に連動して時間ごとに電気料金が変わる「ダイナミック料金」に切り替えるのはどんなときに得か、そしてスマートメーターの普及の制約の下で導入がどこまで進むかを、料金シミュレーション、普及モデル、専門家へのインタビューで調べた研究である（抄録）。", "p2": "ドイツでは送電網の混雑が増えており、家庭の電力需要を動かせる柔軟性が解決策と期待されているが、金銭的な利益の不確かさとスマートメーター普及の遅れが障壁になり、ほとんど活用されていない（抄録）。", "p3": "EPEXの卸電力のスポット価格（2023〜2025年）を使って世帯の類型ごとに電気代を計算し、使用時間をずらさない場合と自動でずらす場合について、切り替えが得になる損益分岐点S*を求めた（抄録）。これを、スマートメーターの普及を時間とともに変わる上限としたBass普及モデルに入れて2035年までの導入を予測し、料金の事業者、規制当局、消費者団体へのインタビューで補った（抄録）。", "p4": "損益分岐点S*、2035年までの追加の導入世帯数の予測の幅、インタビューで挙がった障壁で評価した（抄録）。", "p5": "家庭が得る節約は、電力システム全体にとっての柔軟性の価値に比べて小さく、構造的な外部性があった（抄録）。切り替えが合理的なのは動かせる負荷が大きい世帯、特に電気自動車を持つ世帯に限られ、固定費の部分が価格の信号を弱めていた（抄録）。普及モデルは2035年までの追加の導入を0.73Mから5.35M世帯と予測し、スマートメーターの普及、政策の弱さ、消費者の認知の低さが互いに強め合う制約になっていた（抄録）。インタビューでは、リスクを嫌う傾向もさらなる障壁として挙がった（抄録）。", "p6": "抄録からは、世帯の類型の数、Bassモデルの係数の決め方、インタビューの人数は分からない。現状の形では大衆への普及は起きにくいとされ、スマートメーター普及の加速、料金と託送料金の提供の義務づけ、託送料金の変動化などの手段が挙げられている（抄録）。未査読のプレプリントである。", "fun": "電気の値段は、風が強い夜には安く、夕方には高くなる。安い時間に洗濯機や電気自動車の充電を回せば得をするはずだが、ドイツで計算すると、多くの家庭にとっては得が小さく、手間やリスクに見合わなかった。社会全体には大きな得があるのに個人にはあまりない、というずれが、良い仕組みがなかなか広まらない理由を教えてくれる。", "unverified": "本文が入手できず、損益分岐点S*の具体的な値、世帯類型ごとの節約額、シナリオの設定は確認できていない。"}}, {"rank": 14, "theme": "包摂的コミュニティ・社会", "headline": "英国の自治体別の幸福度を12年分そろえたパネル", "title": "A Harmonised Longitudinal Panel of Local Authority Well-being in the United Kingdom, 2011-2023:&nbsp;Dataset Construction and Trajectory Analysis", "url": "https://doi.org/10.2139/ssrn.7524670", "authors": "Ramakrishnan Radhakrishnan ほか", "date": "2026-09-28", "venue": "SSRN", "id": "pr14", "explain": {"basis": "抄録", "basis_note": "SSRN掲載のため本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": true, "p1": "英国の地方自治体ごとの主観的な幸福度（生活満足度、やりがい、幸福感、不安）について、境界の変更などをそろえた年次のパネルデータを作り、その軌跡を地域の類型ごとに分析した、データ構築の論文である（抄録）。", "p2": "地域単位の幸福度は政策の評価に使いたいが、自治体の境界の変更、調査の測定誤差、新型コロナによる断絶のため、長期で比べられる形になっていなかった（抄録）。", "p3": "2011/12〜2022/23年の12年分、354の地方自治体について4つの指標を整えた（抄録）。合併は人口で重みづけて集計し、県の分割は範囲を保って合成し、公表された信頼区間から逆分散の重みを作って測定の不確かさを扱った（抄録）。ONSの2011年の地域分類の3つの階層で、地域の軌跡を分類した（抄録）。", "p4": "全期間（2011〜2023年）とコロナ前（2011〜2019年）で軌跡を比べ、地域分類ごとに軌跡がまとまるかをKruskal-Wallis検定で確かめた（抄録）。", "p5": "全期間では評価的な幸福度が緩やかに収束し、多様な大都市圏は低い出発点から改善した一方、不安はどこでも悪化した（抄録）。コロナ前の分析では幅広い改善が見られ、それがパンデミックで中断されて回復の差が生まれ、全期間の推定はこの差に左右されていた（抄録）。軌跡は地域分類によって大きくまとまっており（p<0.001）、差の差の分析にこの分類を使うことを支持するが、コロナの断絶は年の固定効果か期間の限定で明示的にモデル化する必要がある（抄録）。", "p6": "抄録からは、小さな自治体での標本の少なさの扱いや、欠けた年の扱いは分からない。複製用のコードと頑健性の確認がそろうとされるが、本文は確認できていない。未査読のプレプリントである。", "fun": "「あなたは今の生活にどのくらい満足していますか」という質問の答えを、英国の354の市や町について12年分つなげた。途中で市町村の合併や分割があるので、同じ地域を比べ続けるだけでも工夫が要る。コロナの前はじわじわ良くなっていたのに、その後の戻り方は地域で違っていたという。数字の裏にある町ごとの物語を想像させるデータである。", "unverified": "本文が入手できず、地域分類ごとの具体的な軌跡の値、不安の悪化の大きさ、データの公開先は確認できていない。"}}, {"rank": 15, "theme": "LLM熟議・ペルソナ", "headline": "ペルソナ集合を多様にして集団思考を防ぐ", "title": "Breaking Homogeneity: Diversifying Persona Sets for Creative LLM Outputs", "url": "https://arxiv.org/abs/2609.30492", "authors": "Sang Bin Moon ほか", "date": "", "venue": "arXiv", "id": "pr15", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（抄録、問題設定、4つの手法の概要、評価の冒頭、結論）を読んだ。付録の証明と詳細な結果表は確認していない", "preprint": true, "p1": "LLMに「あなたは○○な人です」という人物設定（ペルソナ）を与えて回答させるとき、1つずつではなくペルソナの「集合」の散らばり方を設計すれば、LLMの回答が似通ってしまう均質化を破り、創造的で多様な出力を引き出せることを示した研究である（抄録、§5）。", "p2": "LLMは自由回答の課題で似た答えを出しがちで、その均質さは考えが一つの、しかも最善でないかもしれない決定へ収束する集団思考を生みうる（抄録、§1）。", "p3": "ペルソナの多様化を集合の条件づけの問題として定式化し、「既存のペルソナから選ぶか、新しく作るか」と「空間をまんべんなく埋めるか、端を探しにいくか」の2つの軸で、被覆と分散による部分集合の選択、一様に覆うMCMCでの生成、進化的な生成の4手法を作った（抄録、§3）。回答はGemma-4-31B-itで生成し、意味の埋め込みと自動の評価役（Qwen3.6-27B）で測り、ペルソナの集合は課題をまたいで固定した（§4）。", "p4": "物の別の使い道を挙げる課題（AUT）、自由回答の質問集（Infinity-Chat）、互いに無関係な名詞を挙げる課題（DAT）で、回答の多様さ、独創性、柔軟性、総合的な創造性、そして回答の妥当性を測った（抄録、§4）。", "p5": "AUTでは、進化的に生成したペルソナが課題文だけの場合に比べて回答の多様さを78.8%、独創性を26.1%、柔軟性を49.5%、総合的な創造性を13.9%高め、妥当性は98.5%を保った（抄録）。Infinity-Chatでは、無作為なペルソナに比べてペルソナによる回答の分かれ方がほぼ2倍になった（抄録）。創造性を高める指示文と組み合わせると、さらに多様さが18.6%、創造性が6.3%上がった（抄録）。選択の段階でも、分散の手法は最小のペア間距離を無作為より53.5%広げた（§4）。", "p6": "生成モデル・埋め込み・評価役がそれぞれ1系統で、創造性の評価の一部をLLMの判定に頼っている。集団を最もよく代表するペルソナ集合と、最も幅広い発想を引き出す集合は一致しないと著者自身が指摘している（§5）。未査読のプレプリントである。", "fun": "クラスで意見を集めるとき、似た者どうしばかりだと発想は広がらない。AIも同じで、「あなたは漁師です」「あなたは詩人です」と役を与えると答えが変わる。この研究は、役の組み合わせを数学的に遠く離れるように選んだり、進化させて作ったりすると、答えの幅がぐっと広がることを示した。「誰に聞くか」の選び方そのものを最適化する発想が面白い。", "unverified": "付録の詳細な結果表（手法別・課題別の全数値）と理論的な保証の中身は確認していない。"}}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "文法の木でモデル構造をベイズ的に発見する", "title": "Equation discovery with Bayesian tree-adjoining grammars", "url": "https://arxiv.org/abs/2609.31368", "authors": "Christopher A. Lindley ほか", "date": "", "venue": "arXiv", "id": "pr16"}, {"rank": 17, "theme": "VBI・橋梁SHM", "headline": "物理情報付き条件付きVAEで逆問題を瞬時に解く", "title": "Physics-Informed Conditional Variational Autoencoder for Amortised Bayesian Inversion of Heat Conduction Problems", "url": "https://doi.org/10.2139/ssrn.7537025", "authors": "Yuchen Xie ほか", "date": "2026-09-28", "venue": "SSRN", "id": "pr17"}, {"rank": 18, "theme": "VBI・橋梁SHM", "headline": "非線形ネットワーク系の状態推定と疎なセンサ配置", "title": "Data-Driven Switched State Estimation with Sparse Sensor Scheduling for Nonlinear Networked Systems", "url": "https://arxiv.org/abs/2609.31172", "authors": "Gianfranco Gagliardi ほか", "date": "", "venue": "arXiv", "id": "pr18"}, {"rank": 19, "theme": "VBI・橋梁SHM", "headline": "センサの劣化で制御の結果はどれだけ変わるか", "title": "Ground-Truth-Aware Stress Testing of a Closed-Loop Smart-Building Digital Twin Under Sensor Drift and Missing Data", "url": "https://doi.org/10.2139/ssrn.7525109", "authors": "Lyes Saad Saoud", "date": "2026-09-28", "venue": "SSRN", "id": "pr19"}, {"rank": 20, "theme": "VBI・橋梁SHM", "headline": "線形の減衰系でも振動の緩和が逆転する", "title": "Vibrational Mpemba relaxation in a linear damped elastic system", "url": "https://arxiv.org/abs/2609.31268", "authors": "Kiwamu Yoshii ほか", "date": "", "venue": "arXiv", "id": "pr20"}, {"rank": 21, "theme": "位相空間・土木三力学", "headline": "質量ゼロの円柱の渦励振を並列計算で解く", "title": "A parallel     addTab("group:" + g.key, g.label + " " + n, null, function () {

      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + (THEME_CLASS[it.theme] || "--accent-soft") + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
