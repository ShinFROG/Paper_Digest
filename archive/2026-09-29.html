in the Diamond OLG Model", "url": "https://doi.org/10.3386/w35823", "authors": "Laurence M. Ball", "date": "", "venue": "NBER Working Paper", "why": "人口増加率の低下が一人当たり産出を高める一方で労働者と退職者の比を下げることを踏まえ、厚生を最大化する人口増加率を示した。", "id": "pn49"}, {"rank": 50, "field": "開発経済学", "headline": "エネルギー貧困の指標は分断されていて比べられない", "title": "The structural fragmentation of energy poverty metrics limits global comparability and policy targeting", "url": "https://doi.org/10.2139/ssrn.7536910", "authors": "Aner Martinez-Soto ほか", "date": "2026-09-28", "venue": "SSRN", "why": "エネルギー貧困の指標が多様化した結果、次元や重みが不揃いになり、国際比較と政策の対象設定が難しくなっていることを示した。", "id": "pn50"}], "jnl_related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "車体の揺れで積荷の位置ごとに振動が違う", "title": "Position-Dependent Vibration Response and Inverse Design of X-Type Nonlinear Supports for a Cargo–Vehicle–Road Coupled System", "url": "https://doi.org/10.3390/machines14101115", "authors": "Jinyue Kang ほか", "date": "2026-09-28", "venue": "Machines", "id": "jr01", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "トラックの荷台の前後の位置によって荷物が受ける揺れが違うことに注目し、最も厳しい位置の揺れの特徴から、X字型の非線形な荷物の支持具の性質を逆算して設計する枠組みを示した研究である（抄録）。", "p2": "車体の上下動と前後の傾き（ピッチ）のため、荷台の前後の位置ごとに荷物の揺れの入力が異なり、防振と支持具のストローク（伸縮の幅）への要求も位置によって変わる（抄録）。", "p3": "確率的な路面の入力、線形のタイヤ、4自由度の半車体モデル、2000 kgずつの5つの荷物をつないだ連成モデルを作り、荷物の加速度、支持具の相対変位、相互作用の力、エネルギーの指標を評価した（抄録）。支持具の力の法則には、基本の剛性、遅れて硬くなる性質、変位で働く制限、変位に依存する減衰、なめらかにした摩擦を含めた（抄録）。", "p4": "最も厳しい位置の最大ストロークを、実現可能な低周波の線形の支持具を基準として比べ、加速度と力の実効値の変化も見た（抄録）。", "p5": "基準条件では5番目の位置（P5）が最も厳しく、揺れの主な周波数は2.3994 Hz、実効値に相当する変位の振幅は15.339 mmだった（抄録）。低周波で柔らかいX型の支持具は、P5の最大ストロークを線形の基準の35.68 mmから31.81 mmに減らしたが、加速度と力の実効値はわずかに増えた（抄録）。条件を乱した場合は56.05 mmから47.83 mmに減ったものの、設計上の上限の40 mmはなお超えていた（抄録）。", "p6": "著者自身が、工学的な実現性を示すには、さらなるパラメータの最適化、独立した基準との比較、実験による検証が必要だと述べている（抄録）。結果は数値モデルに基づく。", "fun": "トラックの荷台に同じ荷物を並べても、前と後ろでは揺れ方が違う。車体が上下するだけでなく、シーソーのように前後に傾くからだ。この研究は、一番揺れる場所を探し、そこに合わせてX字型の支えの硬さを逆算した。ただし、改良しても目標の揺れ幅にはまだ届かず、著者が正直にそう書いている点も研究の姿として面白い。", "unverified": "本文が入手できず、各支持具のパラメータの値、路面入力の条件、最適化の手順は確認できていない。"}}, {"rank": 2, "theme": "VBI・橋梁SHM", "headline": "損傷位置の推定結果をどこまで信頼できるか", "title": "On a trust metric for stochastic multi-objective model-based damage localisation", "url": "https://doi.org/10.1177/14759217261483188", "authors": "Jasper Ragnitz ほか", "date": "2026-09-28", "venue": "Structural Health Monitoring", "sjr": 1.364, "id": "jr02", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "構造物の振動の測定値に合わせて数値モデルを更新し、損傷の場所を推定する構造ヘルスモニタリングで、その推定結果をどこまで信頼してよいかを数値で表す指標「位置推定の信頼度（ToL）」を提案した研究である（抄録）。", "p2": "入力データとモデルの不確かさや、最適化の問題そのものの曖昧さのため、損傷の場所の推定は決め手を欠いたり誤ったりすることがあり、それが損傷のリスクの誤った評価や誤った保守の判断につながりうる（抄録）。", "p3": "固有振動数などのモードの性質の不確かさを定量化してモデル更新の問題に伝え、見つかった最適な損傷パラメータのそれぞれが、その不確かさの下でモデルどうしの比較でも得られるかを調べてToLを求めた（抄録）。検証には、質量の位置と重さを変えた実験室の鋼の片持ち梁と、元に戻せる損傷を与えた屋外の格子状の塔を使った（抄録）。", "p4": "ToLの値と、損傷の位置推定の正確さの相関で評価した（抄録）。", "p5": "扱った損傷の多くで、ToLは意味のある位置推定と情報価値のない推定を区別でき、ToLの値と位置推定の正確さの間に相関が見られた（抄録）。屋外の塔への適用では、ToLを使うことで位置推定の正確さが改善しうることが示唆された（抄録）。", "p6": "ToLは、採用した有限要素モデルと目的関数の下での入力の不確かさへの頑健さを表すもので、モデルに依存しない信頼性の尺度ではないと著者は注意している（抄録）。特定のケースでは判別の性能が限られ、厳しい環境でのさらなる検証が必要とされる（抄録）。", "fun": "建物や塔の揺れ方を測れば、どこが傷んでいるかを推理できる。しかし、測定には誤差があり、推理が外れることもある。この研究は、推理の答えだけでなく「その答えをどれくらい信じてよいか」も数字で出そうとした。天気予報の降水確率のように、答えに自信の度合いを添える発想が面白い。", "unverified": "本文が入手できず、ToLの計算式、ケースごとの値、判別がうまくいかなかったケースの詳細は確認できていない。"}}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "移動荷重を受ける氷板の非線形応答と分岐", "title": "Nonlinear hydroelastic response of an ice sheet to a moving load: Bifurcation and stability", "url": "https://doi.org/10.1017/jfm.2026.12100", "authors": "Ganghua Hu ほか", "date": "2026-09-28", "venue": "Journal of Fluid Mechanics", "sjr": 1.283, "id": "jr03", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "浮かんでいる氷の板の上を荷重（車両など）が動くときの非線形な弾性と水の波の応答を、完全なオイラー方程式から低次元の力学系まで段階的に簡略化して調べ、応答が急に跳ぶ現象の起こる条件を示した研究である（抄録）。", "p2": "氷の上の移動荷重は氷の変形と波を生み、条件によっては応答が非線形に大きくなるが、その跳びの仕組みと予測の基準は十分に分かっていなかった。", "p3": "2次元で、散逸を線形の減衰として取り入れ、強制と減衰のあるWhitham方程式を2次元の多様体に射影して、折り返しの分岐の典型例である、強制・減衰つきのDuffing振動子との形式的な対応を導いた（抄録）。", "p4": "定常状態の応答の分岐の構造、荷重と氷のたわみの最大点のずれ、全体のエネルギー（仕事率）の釣り合いの条件で分析した（抄録）。", "p5": "定常状態の応答はS字型の分岐構造を示し、同じ条件で2つの安定な状態があり（双安定）、履歴を伴う遷移が起きた（抄録）。荷重とたわみの最大点の空間的なずれは時間的な位相のずれとして現れ、系は全体の仕事率の釣り合いを満たすように自発的にそれを調整していた（抄録）。減衰と荷重の大きさの比が、折り返しの分岐が起きるかどうかを決めるしきい値になり、応答の急な跳びの始まりを予測する基準を与えた（抄録）。", "p6": "2次元のモデルと線形の減衰に基づく理論的な結果で、実際の氷の破壊や3次元の効果、実測との比較は抄録からは分からない。", "fun": "凍った湖の上を車が走ると、氷はたわみ、下の水に波が生まれる。この研究は、ある条件で氷の揺れが急に大きく跳ね上がり、同じ速さでも二つの揺れ方がありうることを数学で示した。ばねにつながれたおもりの有名な方程式と同じ仕組みが、氷の上の波にも隠れていたという発見が面白い。", "unverified": "本文が入手できず、しきい値となる比の具体的な値と、完全なオイラー方程式での数値計算との一致の程度は確認できていない。"}}, {"rank": 4, "theme": "会計情報科学", "headline": "財務比率を先に知ることの私的価値を測る", "title": "Estimating the Private Value of Financial Statement Statistics", "url": "https://doi.org/10.1111/1911-3846.70087", "authors": "Russell Lundholm ほか", "date": "2026-09-28", "venue": "Contemporary Accounting Research", "sjr": 3.686, "id": "jr04", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "来年の財務比率を前もって知ることに、投資家がいくら払ってもよいと考えるかを推定する方法を作り、自己資本利益率を分解するDuPont分析の比率に当てはめた研究である（抄録）。", "p2": "財務諸表の情報がどれだけ役に立つかは会計研究の中心的な問いだが、その価値を金額で表す方法は限られていた。", "p3": "標準的な合理的期待のモデルを相対的な危険回避を扱えるように修正し、情報への支払い意思額を安全資産（お金）の単位で求めた（抄録）。投資可能な資産の水準、複数の資産、任意の情報の仕組みを扱える（抄録）。", "p4": "来年のDuPont比率を知ることへの支払い意思額を、企業の規模、市場の楽観の時期、評価のしにくさ、比率の種類、業種のETFでのヘッジの有無ごとに比べた（抄録）。", "p5": "$1 millionの資産を持ち、現在のDuPont比率と最新のアナリスト予想を知っている投資家は、来年の比率すべてを知るために$2861を払い、規模が中央値より小さい企業では$3158に増えた（抄録）。来年の売上高営業利益率だけを知る価値は$1226で、レバレッジの$170や売上の成長の$184を大きく上回った（抄録）。市場の楽観が強い時期や、評価しにくく裁定しにくい企業で情報の価値は高く、業種のETFでヘッジできるときは価値が大きく増えた（抄録）。", "p6": "モデルに基づく推定であり、投資家の効用の形と合理的期待の仮定に依存する。実際の投資家の情報探索の行動と照らした検証は抄録からは分からない。", "fun": "来年の会社の成績表を前もって知れたら、いくら払うだろうか。この研究は、投資の理論を使って、その「のぞき見」の値段を計算した。すると、売上の伸びよりも利益率を知るほうがずっと価値があるという。何を予想するのに力を注ぐべきかを、お金の額で教えてくれるのが面白い。", "unverified": "本文が入手できず、対象の企業と期間、推定の前提（危険回避度など）の値は確認できていない。"}}, {"rank": 5, "theme": "位相空間・土木三力学", "headline": "貯水池の地すべり津波をSPH-DEM連成で再現", "title": "Numerical Simulation of Landslide-Generated Waves in Reservoirs Using a Coupled SPH-DCDEM Method", "url": "https://doi.org/10.1061/jhend8.hyeng-14478", "authors": "Huanling Wang ほか", "date": "2026-09-27", "venue": "Journal of Hydraulic Engineering", "id": "jr05", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "貯水池で地すべりが水に突っ込んで起こす波を、流体を粒子で表すSPH法と、土砂の粒の動きを表すDCDEM法を組み合わせて数値計算し、波を決める主な要因と、最大の波高と遡上高さを予測する経験式を示した研究である（抄録）。", "p2": "地すべりによる波は周辺に大きな被害をもたらしうるが、山あいの貯水池での特徴と支配的な要因は十分に分かっていなかった（抄録）。", "p3": "DualSPHysicsのSPH-DCDEMの連成の機能を使い、2つの物理模型実験で精度を確かめたうえで、中国のRuMei水力発電所の貯水池の岸の堆積物を単純化して表し、パラメータを変えて解析した（抄録）。", "p4": "最大の波高と最大の遡上高さに対する、地すべりの厚さや水への突入速度などのパラメータの影響で評価した（抄録）。", "p5": "2次元の粒状の地すべりでは、地すべりの厚さと水への突入速度が波を支配する主な要因だった（抄録）。RongSongの地すべり堆積物について、最大の波高と最大の遡上高さを予測する経験式を作った（抄録）。山あいの貯水池の地すべり波は、開けた水域に比べてエネルギーが集中し、破壊力が大きくなりうることが示された（抄録）。", "p6": "扱いは2次元で地形を単純化しており、経験式は特定の堆積物のためのものである。3次元の効果や他の貯水池への適用範囲は抄録からは分からない。", "fun": "山の斜面が崩れてダム湖に落ちると、大きな波が起きて岸を駆け上がる。この研究は、水と土砂を小さな粒の集まりとしてコンピュータで動かし、波の高さを決めるのは崩れた土砂の厚さと落ちる速さだと突き止めた。狭い山あいの湖では、広い海よりもエネルギーが集中しやすいという指摘は、防災を考えるうえで大切だ。", "unverified": "本文が入手できず、経験式の形、検証実験との誤差、計算の条件は確認できていない。"}}, {"rank": 6, "theme": "職場AI・組織行動", "headline": "AIの間違いにどう備えるか：現場の導入戦略", "title": "Navigating Algorithmic Fallibility: Evaluating Implementation and Guidance Strategies in AI-Augmented Service Frontlines", "url": "https://doi.org/10.1177/10946705261481651", "authors": "Avishek Lahiri ほか", "date": "2026-09-28", "venue": "Journal of Service Research", "sjr": 5.517, "id": "jr06", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "顧客対応の現場でAIが誤った提案をすることがあるとき、現場の従業員に裁量を与えるか、AIの使い方を細かく指示するかで、AIの誤りへの従い方と顧客本位の判断がどう変わるかを調べた研究である（抄録）。", "p2": "人とAIの協働への投資は大きいのに、人とリーダーシップの問題のため導入の成果はまちまちで、AIが誤ったときに現場がどう判断するかが課題になっていた（抄録）。", "p3": "現場の従業員と管理者への質的な分析から、従業員への権限の付与とAIの使い方の指示という2つの導入戦略を見いだし、エージェンシー理論と認知的評価理論に基づいて仮説を立てた（抄録）。730人の現場の従業員による6,500以上の判断を含む、AIが支援する顧客サービスのチャットの大規模な模擬実験を行い、階層的な混合効果モデルで分析した（抄録）。", "p4": "顧客本位の判断の割合と、誤ったAIの提案に従った割合で評価し、AIの誤りを経験した後の判断の変化も調べた（抄録）。", "p5": "結果の管理を重視した権限の付与は、顧客本位の判断を増やし、誤ったAIの提案に従うことを減らした（抄録）。細かな指示は評価の基準をはっきりさせて基本の判断の質を上げたが、手順への同調を強めて権限の付与の守る効果を弱めた（抄録）。誤ったAIの提案を経験すると、その後の顧客本位の判断が有意に減り、権限の付与はこの低下を一部和らげ、細かな指示は悪化させた（抄録）。", "p6": "模擬実験の結果であり、実際の職場での長期的な影響は抄録からは分からない。参加者の属性や国の情報も抄録にはない。", "fun": "AIが「こう対応しましょう」と提案しても、ときには間違える。この実験では、現場の人に「最後は自分で判断してよい」と任せると、AIの間違いに流されにくくなった。逆に、手順を細かく決めすぎると、かえって間違いに従いやすくなった。AIを使いこなすには、人に考える余地を残すことが大事だという結果が面白い。", "unverified": "本文が入手できず、質的分析の対象、実験の手続き、効果の大きさは確認できていない。"}}, {"rank": 7, "theme": "サービス・マーケティング", "headline": "自動化されたレストランで顧客体験はどう作られるか", "title": "Mapping customer journeys in automated restaurants: a process perspective on experience formation", "url": "https://doi.org/10.1108/ijchm-04-2026-0664", "authors": "Seonwoo Ko ほか", "date": "2026-09-28", "venue": "International Journal of Contemporary Hospitality Management", "sjr": 3.116, "id": "jr07", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "店員がほとんどいない自動化されたレストランで、客が体験をどう受け止め、意味づけているかを、来店の流れ（カスタマージャーニー）の段階ごとに調べた質的研究である（抄録）。", "p2": "サービスの自動化は、運営ややりとりの責任を従業員から客へ移しつつあり、人の支えが少ないサービスで客の価値がどう形づくられるかを理論化する必要があった（抄録）。", "p3": "顧客が主体となって価値を形づくるという考え方（customer-dominant logic）に基づき、自動化サービスを経験した客への詳しい面接と、利用者のオンラインの口コミの分析を組み合わせた多段階の質的な調査を行った（抄録）。", "p4": "数量的な評価はなく、段階ごとの経験の語りから、機能的な価値と感情的な価値の形成を読み解いた（抄録）。", "p5": "自動化サービスは、客が自分で進める過程に作り替えられ、効率や確実さといった機能的な価値は実現される一方、感情的な価値はもろかった（抄録）。客は期待を何度も調整し、不確かさに対処し、人による安心の少なさを自分で補っていた（抄録）。その結果、一時的な反応ではなく来店全体を通じた感情の結果として「心理的な距離（detachment）」が生まれていた（抄録）。", "p6": "質的研究で、面接の人数や対象の国・店は抄録からは分からず、結果の一般化には量的な検証が必要である。", "fun": "タッチパネルで注文し、ロボットが料理を運ぶレストランは便利だ。ところが客の話を聞くと、便利さには満足しても、どこかよそよそしく、気持ちが離れていく感覚が積み重なっていた。一つ一つの出来事ではなく、来店から帰るまでの流れ全体で感情が形づくられるという見方が面白い。", "unverified": "本文が入手できず、面接の人数、対象の店、口コミの件数は確認できていない。"}}, {"rank": 8, "theme": "包摂的コミュニティ・社会", "headline": "高齢者の言語アクセシビリティは地域でずれる", "title": "Neighbourhood linguistic accessibility for older people in Singapore: Spatial mismatch and linguistic gentrification", "url": "https://doi.org/10.1177/00420980261486152", "authors": "Xinyi Wang ほか", "date": "2026-09-28", "venue": "Urban Studies", "sjr": 1.809, "id": "jr08", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "住民がなじみのある言語でサービスや情報を得られるかという「言語的アクセシビリティ」を、高齢者の住みやすさの観点から地域ごとに測る枠組みを作り、シンガポールに当てはめた研究である（抄録）。", "p2": "言語政策が急に変わる多言語の都市で、高齢者にとって言語的アクセシビリティは重要になっているのに、環境老年学や高齢者にやさしい都市の評価の枠組みにはほとんど含まれていなかった（抄録）。", "p3": "高齢者が多いシンガポールの10の計画区域で、Google Mapsから集めた3922の施設（POI）と31,275件のオンラインの口コミを使い、提供側（D1）と利用側（D2）の言語の多様性の指数を作った（抄録）。口コミの感情分析で日常の利用の経験を反映させ、空間的なクラスタリングで分布のパターンを調べた（抄録）。", "p4": "言語の多様性の高い場所（ホットスポット）の分布と、高齢者の多い地域とのずれで評価した（抄録）。", "p5": "言語の多様性のホットスポットは中心業務地区に集まり、65歳以上の住民が25%を超える古い住宅団地には同等の言語的アクセシビリティが見られない、系統的な空間のずれがあった（抄録）。高齢者の日常のサービスの拠点とされるタウンセンターでも差が大きく、意味のある多言語の多様性を持つのは少数だった（抄録）。著者は、グローバル化による多言語環境の集中と、再開発による包摂的な場の追い出しという、2つの「言語のジェントリフィケーション」の仕組みを指摘した（抄録）。", "p6": "オンラインの口コミは、高齢者自身の利用や声を十分に表していない可能性がある。4つの空間の型と4つの政策の区分が示されるが、その詳細は抄録からは分からない。", "fun": "駅前にいろいろな言語の看板があれば、誰にでもやさしい街に見える。しかしシンガポールで調べると、多言語の店は都心に集まり、お年寄りが多く住む古い団地の周りでは少なかった。看板の数ではなく、そこに住む人が分かる言葉で用が足せるかが大事だという、ものさしの見直しが面白い。", "unverified": "本文が入手できず、指数の計算方法、4つの空間の型と政策の区分の中身は確認できていない。"}}, {"rank": 9, "theme": "LLM熟議・ペルソナ", "headline": "敵対的マルチエージェントで設計仕様の質が上がる", "title": "Multi-agent systems improve structural quality of AI-generated sustainable product design specifications", "url": "https://doi.org/10.1007/s00163-026-00506-z", "authors": "Pingfei Jiang ほか", "date": "2026-09-28", "venue": "Research in Engineering Design - Theory, Applications, and Concurrent Engineering", "sjr": 0.651, "id": "jr09", "explain": {"basis": "本文", "basis_note": "Springerの出版社HTML版の本文（抄録、方法の3章の構成、限界の5.5節）を読んだ。4章の製品ごとの結果の詳細は確認していない", "preprint": false, "p1": "LLMに製品の設計仕様書を書かせると、性能の主張ばかりで、それを支える材料や製造の裏づけが欠けがちになる問題に対し、専門の役割を持つ複数のAIエージェントが批判し合う仕組み（敵対的マルチエージェントシステム）で、仕様書の構造的な質が上がることを示した研究である（抄録）。", "p2": "LLMは工学の設計仕様書の作成を自動化しうるが、構造的な根拠を欠いた性能の主張を生成しがちで、単純な繰り返しの推敲で改善するかも分かっていなかった（抄録）。", "p3": "材料と設計、生産、使用中の保守、循環（リサイクル）の4つの専門家エージェントと、その批判をまとめて対立を調整する主任技術者のエージェントからなる星型の構成を作った（§3.3.3）。これを、一度で生成する方法、1つのエージェントが繰り返し推敲する方法と、熱機器、モーター、電気機械、構造の機構にわたる11の消費者向け製品で比べた（抄録）。", "p4": "材料や製造などの構造的な記述と、性能目標や数値の制約などの振る舞いの要求の比を表す指標（ARI）で評価し、掃除機の仕様書については専門家5人の評価も行った（抄録）。", "p5": "マルチエージェントの仕様書はすべての製品でARIが高く、平均は0.46対0.18だった（p<0.001、効果量d=1.75）（抄録）。1つのエージェントでの推敲は基準の生成とほぼ変わらず（平均0.18対0.20、p=0.48）、文書は77%長くなったのに、半分の製品で質が下がった（抄録）。一方、専門家5人は、検証のしやすさで単独エージェントの仕様書を高く評価し（4.8対3.8）、その評価は構造的な裏づけではなく数値の多さと関連していた（抄録）。", "p6": "著者は、マルチエージェントの条件が複数の要素（専門的な批判、主任による統合、敵対的なやりとり）を同時に加えているため、改善をどれか一つに帰せないこと、専門家の評価が1製品・5人に限られること、ARIが一般的な語彙に基づき専門用語を数え落としうること、生成モデルがGemini 2.5 Flashの1つだけであること、ARIは物理的な実現可能性を検証できないことを限界に挙げている（§5.5）。", "fun": "AIに一人で「もっと良くして」と何度頼んでも、文章が長くなるだけで中身はあまり良くならなかった。ところが、材料、製造、修理、リサイクルの専門家役のAIたちに批判させ、まとめ役が調整すると、裏づけのある仕様書になった。人間のチームと同じく、違う立場からの「つっこみ」が質を上げるという結果が面白い。", "unverified": "製品ごとのARIの値、掃除機の事例の詳しい比較、使ったプロンプトは確認していない。"}}, {"rank": 10, "theme": "都市・インフラ政策", "headline": "30年の高密化で中国の旧市街の冬の日照が減った", "title": "Three decades of urban densification reduced winter direct sunlight access across China’s old urban cores", "url": "https://doi.org/10.1073/pnas.2624733123", "authors": "Kechao Wang ほか", "date": "2026-09-28", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "sjr": 3.283, "id": "jr10", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "中国の大都市の古い市街地で、過去三十年の高層化・高密度化が冬の直射日光をどれだけ奪ったかを、建物の3次元データで初めて大規模に定量化した研究である（抄録）。", "p2": "都市の高密度化は土地の効率的な利用と市街地の拡大の抑制のために推進されるが、古い市街地の冬の日照を減らしうる。これまでの研究は現在の状態や典型的な街の形を扱うものが多く、最近の再開発でどれだけの日照が失われたかは不明だった（抄録）。", "p3": "中国本土の77の大都市の古い中心部で、3次元の建物データと都市ごとの太陽の位置を使い、冬至の直射日光の時間を5 mの解像度で地図にした（抄録）。2020年の実際の建物と、1990年ごろの高さを都市ごとの経験的な上限で再現した反実仮想の街並みを比べ、反実仮想は歴史的に記録された街区の事例と照らして評価した（抄録）。", "p4": "日照が減った面積の割合、影響を受けた地域の平均の日照時間、2時間の基準を下回った面積、影響を受ける1階の住民の数で評価した（抄録）。", "p5": "三十年間の高密度化で、古い中心部の面積の平均36%で日照が減り、影響を受けた地域の平均の日照時間は5.37時間から3.75時間に下がった（抄録）。約7%（603 km2）が十分な日照から不十分な日照に変わり、17.7%（1,525 km2）が2020年までに2時間の基準を下回った（抄録）。都市ごとの平均の損失は1.08〜2.46時間で、約16 millionの1階の住民に影響し、そのうち約0.61 millionは3〜6時間の大きな損失を受けていた（抄録）。損失は元の日照が短い都市で広く、二線級の都市で最も大きく、緯度が高いほど急だった（抄録）。", "p6": "1990年ごろの街並みは推定による反実仮想であり、その精度が結果に影響する。直射日光のみを扱い、室内の採光や住民の健康への影響は直接には測っていない。", "fun": "古い街に高いマンションが建つと、冬に近所の家に日が当たらなくなる。この研究は、中国の77都市について、三十年前の街並みをコンピュータで再現し、今と比べて日当たりがどれだけ減ったかを計算した。約16 millionの人の1階の部屋が影響を受けていたという規模の大きさに驚かされる。", "unverified": "本文が入手できず、都市ごとの結果、反実仮想の検証の精度、二線級の都市の定義は確認できていない。"}}, {"rank": 11, "theme": "会計情報科学", "headline": "同業他社の会計比較可能性は利益調整を抑える", "title": "Peer Accounting Comparability and Focal Firms’ Earnings Management: A Perspective of Accounting Discretion", "url": "https://doi.org/10.1111/abac.70059", "authors": "Shijiao Cao ほか", "date": "2026-09-27", "venue": "Abacus", "id": "jr11", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "同じ業界の他社の会計情報が比べやすい（会計の比較可能性が高い）とき、自社が会計上の裁量を使った利益調整をしにくくなるかを、中国のA株上場企業で調べた研究である（抄録）。", "p2": "会計の比較可能性は投資家の役に立つとされるが、それが業界の他社を通じて自社の利益調整を抑えるかは十分に分かっていなかった（抄録）。", "p3": "中国のA株上場企業のデータを使い、業界の他社の会計の比較可能性と、自社の発生主義会計による利益調整の関係を分析し、その仕組み、企業統治による違い、市場の反応、実体的な利益調整への切り替えを調べた（抄録）。", "p4": "裁量的な会計発生高による利益調整、決算発表の期間の累積の異常リターン、株主資本コスト、実体的な利益調整の指標で評価した（抄録）。", "p5": "業界の他社の会計の比較可能性は、自社の発生主義の利益調整を抑えていた（抄録）。その仕組みとして、一般に受け入れられた会計の慣行ができて自社がそれに合わせることと、外部との情報の非対称性が減って監視が強まることの2つが示された（抄録）。比較可能性が高いときに会計発生高を操作すると、決算発表時の累積の異常リターンが低く、株主資本コストが高くなった（抄録）。会計上の裁量で利益を調整できなくなった企業は、実体的な利益調整に切り替えていた（抄録）。", "p6": "中国市場のデータに基づく結果で、他の市場への一般化には検証が必要である。比較可能性の測り方と因果の識別の方法は抄録からは分からない。", "fun": "クラスのみんなが同じ書き方でノートを取っていると、一人だけごまかした書き方をすれば目立ってしまう。会社の決算も同じで、同業他社の会計が比べやすいと、利益をよく見せる操作がしにくくなる。ところがその会社は、帳簿ではなく実際の取引のタイミングをずらすという別の方法に切り替えていた。抜け道を探す行動まで追ったのが面白い。", "unverified": "本文が入手できず、対象期間、標本の大きさ、比較可能性の指標、効果の大きさは確認できていない。"}}, {"rank": 12, "theme": "位相空間・土木三力学", "headline": "非空気入りタイヤの剛性と接地圧を陽な縮約式で", "title": "Explicit Reduced-Order Modeling and Data-Efficient Physics-Informed Inverse Design of Laminated Non-Pneumatic Tires", "url": "https://doi.org/10.3390/machines14101114", "authors": "Weidong Liu ほか", "date": "2026-09-28", "venue": "Machines", "id": "jr12", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "空気を入れない「エアレスタイヤ（積層型の非空気入りタイヤ）」の設計のため、重い数値計算の代わりに使える明示的な簡約式を導き、それを物理的な制約として組み込んだニューラルネットで、少ない学習データで正確に設計できることを示した研究である（抄録）。", "p2": "エアレスタイヤの設計では、荷重を支える性能と接地の応答を何度も計算する必要があるが、高精度な解析（LB-GA）は、領域の境界が未知の18の微分方程式を反復して解く必要があり重い（抄録）。", "p3": "積層した曲がりはりの力学と両側圧縮リングの理論を組み合わせて、上下の剛性と平均の接地圧の明示的な簡約式を導き、500の高精度な解との同時の当てはめで、使える範囲を判定する経験的な基準（Roptが40より大きい）を得た（抄録）。この式を、適用範囲を限った力学の制約として、多精度の物理情報ニューラルネットに組み込んだ（抄録）。", "p4": "独立に作った5000の事例での最大の誤差、剛性と接地圧の正規化した二乗平均誤差（NRMSE）、モデルの準備時間、新しく製造したタイヤの実験と6つの有限要素設計での検証の誤差で評価した（抄録）。", "p5": "基準を満たす事例の97.68%で、最大の応答の誤差が10%以下だった（抄録）。5×10^5個のラベルで学習した提案モデルの剛性と接地圧のNRMSEは4.47%と4.68%で、データだけで5×10^6個のラベルを使うモデルの5.00%と8.37%より良かった（抄録）。モデルの準備時間は220.1時間から32.5時間に減り、多目的の逆設計、新しく製造したタイヤの実験、6つの有限要素設計での検証の誤差は10%未満だった（抄録）。", "p6": "簡約式が使えるのは経験的な基準を満たす範囲に限られる。調べた設計と材料の範囲の外や、転がりや熱などの条件への適用は抄録からは分からない。", "fun": "パンクしないエアレスタイヤは、ゴムのスポークで車を支える。形の設計には重い計算を何度も繰り返す必要があった。この研究は、力学の理屈から近似の式を作り、それをAIの学習の「ヒント」として与えることで、10分の1のデータでより正確な予測ができることを示した。理論とAIの二人三脚が面白い。", "unverified": "本文が入手できず、簡約式の形、Roptの定義、実験の条件は確認できていない。"}}, {"rank": 13, "theme": "包摂的コミュニティ・社会", "headline": "人を支える人ほど脳年齢が若い", "title": "Providing social support to others is associated with younger brain age in mid-to-late adulthood", "url": "https://doi.org/10.1038/s41398-026-04459-8", "authors": "Minwoo Lee ほか", "date": "2026-09-28", "venue": "Translational Psychiatry", "sjr": 2.425, "id": "jr13", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "他人に手助けや心の支えを与える時間が長い中高年ほど、脳が実際の年齢より若く見える（脳年齢の差が小さい）ことを、米国の長期調査のMRIデータで示した研究である（抄録）。", "p2": "人とのつながりは健康と長寿の強い予測因子だが、これまでの研究は主に支援を「受ける」ことの利点に注目し、他人を「支える」ことが脳を守る可能性は十分に調べられていなかった（抄録）。", "p3": "米国の中年期の調査（MIDUS）のデータで、実用的な手助けと感情的な支えを他人に与える1か月の合計時間が、後の脳年齢の差（BrainAGE）を予測するかを調べた（抄録）。BrainAGEは、MRIの脳の構造から暦の年齢を予測する機械学習のモデルで求め、階層的な回帰にブートストラップとデータに基づく変数の選択を組み合わせて分析した（抄録）。", "p4": "支援を与える時間とBrainAGEの関連の強さを、人口学的な属性、健康状態、生活習慣、受けている支援などの共変量を統制して評価した（抄録）。", "p5": "支援を多く与える人ほど、同じ暦の年齢でも脳が有意に若く見えた（抄録）。この関連は、受けている支援を含む幅広い共変量を統制しても残り、時間で測った支援の量は、介護をしているか、祖父母であるかといった役割の指標を超えてBrainAGEを説明した（抄録）。探索的な分析では、感情的な支えのほうが実用的な手助けよりも低いBrainAGEと強く関連していた（抄録）。", "p6": "観察研究であり、支援を与えることが脳を若く保つという因果の向きは確定していない（脳が健康な人ほど他人を支えやすい可能性もある）。米国の調査の参加者に基づく結果である。", "fun": "人の役に立つと気分がいい、というだけでなく、脳にも良いかもしれない。この研究では、他人の手助けや話し相手に時間を使う中高年ほど、MRIで見た脳が実際の年齢より若く見えた。特に、相談に乗るような心の支えとの関連が強かった。ただし、脳が元気な人ほど人を助けやすいだけかもしれない点にも注意が要る。", "unverified": "本文が入手できず、対象者の人数、効果の大きさ、追跡の期間は確認できていない。"}}, {"rank": 14, "theme": "会計情報科学", "headline": "データが少なくても売上原価の操作を見抜く", "title": "A Stacking‐Based Hybrid Machine Learning Framework for Detecting Cost‐of‐Sales Manipulation in Data‐Constrained Financial Statements", "url": "https://doi.org/10.1002/isaf.70047", "authors": "Aysel Topşir ほか", "date": "2026-09-27", "venue": "Intelligent systems in accounting, finance and management/Intelligent systems in accounting, finance & management", "id": "jr14", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "ラベル付きの不正事例が少ない新興市場で、売上原価の操作という特定の種類の粉飾決算を見抜くため、複数の機械学習モデルを積み重ねる（スタッキング）ハイブリッドの枠組みをトルコの上場企業で開発した研究である（抄録）。", "p2": "新興市場では、ラベル付きのデータが少なく、不正と正常の件数の差が極端に大きいため、財務諸表の不正の検出が難しい（抄録）。", "p3": "公開された不正の事例が限られるため、トルコの開示システム（KAP）の財務情報から、手を加えていない財務諸表と、監査の知見と専門家の知識に基づくルールで操作した版を組み合わせた半合成のデータセットを作った（抄録）。多様な基本の学習器をスタッキングでまとめ、財務比率の線形と非線形の構造を捉えるようにした（抄録）。", "p4": "最も強い基準モデルと、複数の評価指標と誤って不正と判定する偽陽性の数で比べ、対応のあるブートストラップの信頼区間で差を確かめた（抄録）。", "p5": "スタッキングのハイブリッドモデルは、ほとんどの評価指標で最も強い基準モデルより高い点推定値を示し、偽陽性を大きく減らした（抄録）。ブートストラップの信頼区間は不正の区分の適合率（precision）の改善を支持したが、残りの指標の差は標本の不確かさの範囲内だった（抄録）。", "p6": "学習と評価に使った不正の例は、ルールで作った半合成の操作であり、実際の不正の手口をどこまで反映するかは分からない。多くの指標の改善は統計的に確かとは言えない（抄録）。", "fun": "粉飾決算を見抜くAIを作りたくても、本物の不正の例は少ない。そこでこの研究は、本物の決算書に、監査の知識に基づいて「こう操作するはず」という細工をわざと加えた練習問題を作ってAIに学ばせた。複数のAIの意見を束ねると、無実の会社を疑う誤りが減ったという。練習問題の作り方そのものが工夫になっている。", "unverified": "本文が入手できず、使った基本の学習器、データの件数、各指標の具体的な値は確認できていない。"}}, {"rank": 15, "theme": "職場AI・組織行動", "headline": "組織の支援と学習風土がAIへの適応を高める", "title": "Employees’ Adaptation to AI Technologies: The Effects of Perceived Organizational Support and Learning Climate on AI Self-Efficacy and Adaptive Performance", "url": "https://doi.org/10.54097/cv4y2t08", "authors": "Siyuan Shao", "date": "2026-09-28", "venue": "Journal of Computer Science and Artificial Intelligence", "id": "jr15", "explain": {"basis": "本文", "basis_note": "出版社のPDF（抄録、媒介効果の表6、組織支援と学習風土の効果の比較、限界の7.4節）を読んだ。測定尺度の項目と質的分析のコーディングの詳細は確認していない", "preprint": false, "p1": "AIの導入に従業員がうまく適応できるかについて、組織からの支援の実感と、職場の学習の風土が、「AIを使いこなせる」という自信（AI自己効力感）を通じて、変化への適応的な働きぶりにつながるかを、質問紙と面接を組み合わせた混合研究法で調べた研究である（抄録）。", "p2": "AIへの適応がうまくいかないと、技術ストレス、消極的な抵抗、効率の低下、デジタル化の失敗につながる。組織の支援、学習の風土、AI自己効力感、適応的な働きぶりは別々に研究されてきたが、それらを一つの仕組みとして検証した研究は少なかった（抄録）。", "p3": "仕事の要求度－資源理論と社会的学習理論に基づいてモデルを作り、中国の5つの業種の企業の従業員527人の質問紙のデータを構造方程式モデリング（AMOS）で分析し、その後36人への半構造化面接を主題分析して、数値では捉えにくい仕組みや障壁を補った（抄録、§7.4）。", "p4": "各経路の標準化係数と、ブートストラップによる間接効果の95%信頼区間で媒介効果を評価し、面接の主題で量的な結果を解釈した（表6、§6.2）。", "p5": "組織の支援の実感と学習の風土は、どちらもAI自己効力感と適応的な働きぶりに有意な正の効果を持ち、AI自己効力感は両者と働きぶりの間を完全に媒介していた（抄録）。間接効果は組織の支援で0.194、学習の風土で0.222で、どちらの信頼区間も0を含まなかった（表6）。AI自己効力感への効果は学習の風土（β=0.362）が組織の支援（β=0.317）よりやや大きく、面接からは、支援は一度きりの研修や資源、学習の風土は同僚どうしの日常的な学び合いとして働くと解釈された（§6.2）。", "p6": "著者は、横断的なデータのため時間を通じた因果の変化は推論できないこと、面接は36人に限られること、媒介変数をAI自己効力感の一つに絞ったこと、標本が中国の5業種に限られることを限界に挙げている（§7.4）。すべての変数を同じ回答者の自己報告で測っているため、共通方法の偏りの影響も考えられる。", "fun": "新しいAIの道具が職場に入ったとき、使いこなせるかどうかは本人の才能だけで決まるのではない。会社が研修や相談窓口を用意し、同僚どうしで「失敗してもいいから試そう」と教え合う雰囲気があると、「自分にもできる」という自信が育ち、それが働きぶりにつながっていた。部活の上達にも通じる話で面白い。", "unverified": "測定尺度の項目、適合度の指標、面接の対象者の内訳は確認していない。"}}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "代理モデルを使った剛性同定の収束を保証する", 職場AI・組織行動", "headline": "農業自動化の「最後の1マイル」と身体化された熟練", "title": "Epistemological Friction: Embodied Expertise and the ‘Last Mile’ of Agricultural Automation in the US Tree‐Fruit Industry", "url": "https://doi.org/10.1111/ntwe.70047", "authors": "M. Anne Visser ほか", "date": "2026-09-28", "venue": "New Technology, Work and Employment", "sjr": 3.193, "id": "jr49"}, {"rank": 50, "theme": "職場AI・組織行動", "headline": "補完的・補償的な仕事の資源とワーク・エンゲイジメント", "title": "Complementary and compensatory job resources for work engagement and innovative work behaviour", "url": "https://doi.org/10.1080/09585192.2026.2738841", "authors": "Shriya Sharma ほか", "date": "2026-09-28", "venue": "International Journal of Human Resource Management", "sjr": 2.058, "id": "jr50"}], "jnl_notable": [{"rank": 1, "field": "経済学", "headline": "所得補償実験の現金給付は子の代まで影響したか", "title": "The Long-Term Effects of Cash Assistance", "url": "https://doi.org/10.1257/app.20210064", "authors": "David J. Price ほか", "date": "2026-09-28", "venue": "American Economic Journal: Applied Economics", "sjr": 9.427, "why": "シアトル・デンバー所得維持実験の参加者を長期追跡し、現金給付が受給者と子どもの長期的な成果に与えた影響をランダム化実験から推定した。", "id": "jn01", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "1970年代に米国で行われた所得保障の社会実験（シアトル・デンバー所得維持実験）の参加者を、数十年後の社会保障の記録と結びつけ、現金給付が本人とその子どもの長期の稼ぎと障害給付の利用にどう影響したかを調べた研究である（抄録）。", "p2": "現金給付は貧困対策の中心的な手段だが、給付が終わった後の長い期間にわたって働き方や子どもの将来にどう影響するかの証拠は限られていた（抄録）。", "p3": "無作為に割り当てられた処置群の家族は、1970年代に3年または5年間、数千ドルの追加の給付を受けた（抄録）。実験の記録を新しい照合のアルゴリズムで社会保障庁のデータと結びつけ、実験後の稼ぎと障害給付の申請を比べた（抄録）。", "p4": "実験後の年間の稼ぎ、障害給付の申請、効果の年齢による違い、子どもの稼ぎと障害制度との関わりで評価した（抄録）。", "p5": "処置は大人の実験後の年間の稼ぎを$1,800減らし、障害給付の申請を増やした（抄録）。効果は退職年齢の前後で最も強く、職業を通じた仕組みの可能性が示唆された（抄録）。一方、子どもの稼ぎや障害制度との関わりには有意な効果がなかった（抄録）。", "p6": "1970年代の特定の2都市の実験に基づく結果であり、給付の設計や労働市場が異なる現在の制度にそのまま当てはまるとは限らない。記録の照合の精度も結果に影響しうる。", "fun": "「お金を配ると人は働かなくなるのか」という議論は昔からある。この研究は、半世紀ほど前の実験の参加者のその後を、公的な記録と結びつけて追いかけた。大人は給付の後も長く稼ぎが少なめだったが、子どもには目立った影響がなかった。何十年も前の実験が、今の政策の議論に答えを出すという時間のスケールが面白い。", "unverified": "本文が入手できず、照合のアルゴリズムの精度、参加世帯の数、効果の年齢別の値は確認できていない。"}}, {"rank": 2, "field": "組織行動・心理的安全性", "headline": "培養肉：管轄の決まらない規制をどう切り開くか", "title": "“Clean” Meat? Regulatory Entrepreneurship and Jurisdictional Contestation in a Nascent Industry", "url": "https://doi.org/10.1177/00018392261477694", "authors": "Cheng Gao ほか", "date": "2026-09-28", "venue": "Administrative Science Quarterly", "sjr": 9.595, "why": "新興産業で規制の管轄が決まっていないとき、先駆的な企業がどのように規制を形づくり管轄をめぐる争いに関わるかを分析した。", "id": "jn02", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "培養肉のような新しい産業で、どの規制当局が管轄するのかが決まっていない不確かさの中で、先駆的な新興企業がどのように振る舞い、規制の枠組みそのものを形づくったかを調べた研究である（抄録）。", "p2": "新しい産業では、どの規制当局に管轄権があるかの不確かさが先駆的な企業の大きな課題になるが、新興企業の非市場戦略の研究の多くは、担当の規制当局があることを当然の前提としてきた（抄録）。", "p3": "2015〜2019年の米国の培養肉産業を切り開いた組織について、帰納的な複数事例研究を行い、詳しい半構造化面接と記録資料を分析した（抄録）。", "p4": "数量的な評価はなく、管轄の空白、争い、収束という3つの段階ごとに、組織が用いた策略と過程を読み解いた（抄録）。", "p5": "組織の戦略は、補完的な戦略と対立的な戦略の2つに大きく分けられ、それぞれの仕組みが管轄の不確かさにどう影響するかが理論化された（抄録）。新興企業、非営利団体、既存企業、投資家、規制当局という異なる主体の間の動きを明らかにし、起業家的な組織が自ら作ろうとする産業の規制の構造をどう形づくるかという視点を示した（抄録）。", "p6": "米国の一つの産業の事例研究であり、他の国や産業への一般化には検証が必要である。対象の組織の数や面接の人数は抄録からは分からない。", "fun": "培養肉は「肉」なのか「細胞の技術」なのか。米国では、それによって食品を見る役所と農産物を見る役所のどちらが担当するかが変わり、決まるまで企業は宙ぶらりんだった。この研究は、企業が役所どうしの綱引きにどう関わり、ルール作りそのものに影響したかを描いた。新しい技術は新しい「縄張り争い」を生むという視点が面白い。", "unverified": "本文が入手できず、対象の組織と面接の数、2つの戦略の具体的な中身は確認できていない。"}}, {"rank": 3, "field": "経営学", "headline": "製品の属性がユーザーによる新用途の発見を左右する", "title": "Designing for unanticipated uses: How product attributes shape community‐led exaptation", "url": "https://doi.org/10.1002/smj.70132", "authors": "Shi‐Ying Lim ほか", "date": "2026-09-28", "venue": "Strategic Management Journal", "sjr": 10.154, "why": "ユーザーが製品の新しい使い道を見つける「コミュニティ主導の外適応」が、製品のどの属性で促されるかを検証した。", "id": "jn03", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "利用者が製品の新しい使い道を見つけ、企業が後でそれを商品化する「コミュニティ主導の転用（exaptation）」について、製品のどんな性質がどんな種類の新しい使い道の発見を促すかを、IKEAの家具の改造例で調べた研究である（抄録）。", "p2": "利用者はしばしば企業の想定しない使い道を見つけるが、製品の設計がその発見の種類をどう方向づけるかは分かっていなかった（抄録）。", "p3": "1925件のIKEAの製品改造（IKEA hacks）を分析し、モジュール性（部品の組み替えやすさ）と見た目の単純さが、新しい用途（別の目的に使う）と新しい機能（製品にできることが増える）の発見の起こりやすさにどう関わるかを調べた（抄録）。記録資料と面接の探索的な分析で、IKEAの対応も描いた（抄録）。", "p4": "改造が新しい用途の発見か、新しい機能の発見かを、製品の性質（モジュール性、製品ライン間の部品の互換性、見た目の違うバリエーション、見た目の単純さ）で説明する分析を行った（抄録）。", "p5": "モジュール性は新しい用途の発見の起こりやすさを高め、その効果は部品が製品ラインをまたいで互換性を持つと強まり、見た目の違うバリエーションがあると弱まった（抄録）。一方、見た目の単純さは新しい機能の発見を起こりやすくした（抄録）。企業は製品の設計によって発見の機会の範囲を形づくれることが示された（抄録）。", "p6": "一つの企業の家具の改造例に基づく結果で、他の製品分野への一般化には検証が必要である。機能の改造は安全上の懸念を生みうると著者も述べている（抄録）。", "fun": "本棚を横に倒してベンチにしたり、棚の部品でペットの家を作ったりする「IKEAハック」は、世界中の利用者が勝手に考えた使い道だ。この研究は約二千件の改造例を調べ、組み替えやすい家具ほど新しい用途が、見た目がシンプルな家具ほど新しい機能が生まれやすいことを示した。利用者の遊び心を設計で引き出せるという発想が面白い。", "unverified": "本文が入手できず、効果の大きさ、改造例の集め方、IKEAの対応の具体例は確認できていない。"}}, {"rank": 4, "field": "因果推論", "headline": "モーメント合わせで偏りのない合成対照法", "title": "Asymptotically unbiased synthetic control methods by moment matching", "url": "https://doi.org/10.1515/jci-2025-0008", "authors": "Masahiro Kato ほか", "date": "2026-09-28", "venue": "Journal of Causal Inference", "why": "合成対照法の重みを、処置前の予測誤差ではなくモーメントの一致で決め、漸近的に偏りのない推定を可能にした。", "id": "jn04", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "政策の効果を、処置を受けていない地域の重みつきの組み合わせで「政策がなかった場合」を作って測る合成コントロール法について、既存の方法に内在する偏りの原因を指摘し、分布の積率（平均・分散など）を合わせて重みを決める新しい方法を提案した研究である（抄録）。", "p2": "合成コントロール法は比較事例研究の基本的な道具になったが、処置を受けていない単位の結果と合成コントロールの誤差が相関するという内生性のため、反実仮想の予測と効果の推定に偏りが生じていた（抄録）。", "p3": "処置を受けた単位の結果の分布が、受けていない単位の分布の重みつきの混合で近似できると仮定し、処置を受けた単位の結果の積率と、受けていない単位の積率の重みつきの和を一致させるように重みを推定する（抄録）。", "p4": "推定量の漸近的な不偏性、反実仮想の予測の平均二乗誤差、実験の結果で評価した（抄録）。", "p5": "混合モデルの仮定の下で提案した推定量は漸近的に不偏になり、それによって反実仮想の予測の平均二乗誤差が減った（抄録）。さらに、効果の期待値だけでなく、効果の分布全体を得られるため、合成コントロール法の適用範囲が広がる（抄録）。実験の結果も提案法の有効性を示した（抄録）。", "p6": "結果は、処置を受けた単位の分布が受けていない単位の分布の混合で表せるという仮定に依存する。実験の具体的な設定と既存手法との差の大きさは抄録からは分からない。", "fun": "ある県だけで新しい政策を始めたとき、その効果を知るには「政策がなかったらどうなっていたか」が必要だ。合成コントロール法は、他の県を混ぜ合わせて、その県の「そっくりさん」を作る方法である。この研究は、そっくりさんの作り方に隠れた偏りを見つけ、平均だけでなくばらつきまで似せるという工夫で直した。", "unverified": "本文が入手できず、実験の設定、比較した既存手法、推定量の条件は確認できていない。"}}, {"rank": 5, "field": "機械学習", "headline": "確率的機械学習で気候モデルから地域の気候リスク", "title": "Regional climate risk assessment from climate models using probabilistic machine learning", "url": "https://doi.org/10.1038/s42256-026-01308-7", "authors": "Zhong Yi Wan ほか", "date": "2026-09-28", "venue": "Nature Machine Intelligence", "sjr": 6.902, "why": "粗い全球気候モデルと地域の意思決定に必要な細かい情報の差を、確率的な機械学習のダウンスケーリングで埋めた。", "id": "jn05", "explain": {"basis": "本文", "basis_note": "Nature Machine Intelligenceの出版社HTML版の本文（GenFocalの仕組み、熱帯低気圧、複合的な熱波のリスク、将来の予測、考察）を読んだ。補足資料と方法の詳細は確認していない", "preprint": false, "p1": "粗い解像度の全球気候モデルの将来予測から、地域の意思決定に必要な細かい天気（熱波や熱帯低気圧など）を、統計的に正確に生成するAIの枠組みGenFocalを開発し、地域の複合的な気候リスクの推定を改善した研究である（抄録）。", "p2": "物理に基づくダウンスケーリングは極端現象の大量のアンサンブルには計算が重すぎ、従来の統計的な方法は複数の変数の時空間の依存関係を捉えられない（抄録）。また、機械学習の方法は時間の対応がとれた学習の組を必要とするが、自由に走らせた気候予測にはそうした組がない（抄録）。", "p3": "粗い気候シミュレーションの偏りを整流フロー（rectified flow）で補正し、その後、条件付き拡散モデルで解像度を1.5°から0.25°へ、時間の刻みを日平均から2時間ごとへ細かくする2段階の方法で、連続する天気の時系列を明示的にモデル化した（図1）。ERA5再解析を高解像度の目標、CESM2の大アンサンブル（LENS2）を粗い入力として、1980–1999の20年分で学習し、2010–2019で評価した（§GenFocal）。", "p4": "北大西洋の熱帯低気圧の発生場所・進路・上陸・強度、米国本土の夏の暑さ指数の99パーセンタイル、気温と湿度の極値の同時発生、5日間続く熱波の頻度を、既存の統計的な方法（BCSD、STAR-ESDM）と比べ、将来の変化は物理モデルによるダウンスケーリングと比べた（§結果）。", "p5": "GenFocalは、入力の気候予測にほとんど現れない熱帯低気圧も大規模な条件から生成し、その進路・発生場所・上陸・頻度・強度はERA5と整合した（§熱帯低気圧）。暑さ指数の99パーセンタイルの偏りは統計的な方法より平均で35%以上小さく、気温と湿度の極値の同時発生の誤差は平均44%減った（§複合リスク）。5日間続く熱波の偏りは、BCSDより44%、STAR-ESDMより57%小さかった（§複合リスク）。2020–2080の米国西部の都市の温暖化では、沿岸と内陸の違いを物理モデルと同様に再現した（§将来予測）。", "p6": "学習と評価は一つの気候モデル（CESM2）とERA5に基づき、将来の予測の妥当性は、それ自体にも誤差のある物理モデルのダウンスケーリングとの比較で確かめている（§将来予測）。対象の地域は米国本土と北大西洋に限られる。", "fun": "地球全体の気候のシミュレーションは、1.5°ほどの粗いマス目でしか計算できず、「来週のこの町の暑さ」は分からない。この研究は、画像生成AIの技術を使って、粗い予測から細かい天気を描き出した。粗い予測にはほとんど現れない台風まで、周りの大きな条件から生まれてくるのが面白い。", "unverified": "補足資料の詳細な評価結果、将来の熱帯低気圧の予測の具体的な値、計算時間は確認していない。"}}, {"rank": 6, "field": "経済学", "headline": "雇用保護がなくなる67歳で何が起きるか", "title": "Deadwood Labor? The Effects of Eliminating Employment Protection for Older Workers", "url": "https://doi.org/10.1257/app.20250414", "authors": "Emmanuel Saez ほか", "date": "2026-09-28", "venue": "American Economic Journal: Applied Economics", "sjr": 9.427, "why": "スウェーデンの67歳での雇用保護の失効を使い、雇用が約10%、平均収入が約20%下がることなど、高齢労働者の雇用保護の効果を推定した。", "id": "jn06", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "スウェーデンで67歳に達すると雇用の保護がなくなる定年制度を利用して、雇用の保護を失うことが高齢の働き手の雇用、稼ぎ、労働時間にどう影響するかを調べた研究である（抄録）。", "p2": "雇用の保護は働き手を守る一方で、企業が生産性の落ちた働き手を抱え込む原因になるとも言われる。保護をなくしたときに何が起きるかの証拠は限られていた。", "p3": "67歳で雇用の保護がなくなる強制的な退職の制度に注目し、その年齢の前後での雇用、稼ぎ、離職、続いている仕事の賃金と労働時間の変化を分析した（抄録）。", "p4": "67歳の時点での雇用と平均の稼ぎの変化、すぐに離職した仕事の割合とその特徴、仕事を続けた人の賃金・労働時間・稼ぎで評価した（抄録）。", "p5": "67歳になった直後に雇用は約10%、平均の稼ぎの総額は約20%下がった（抄録）。保護を失ったことで8%の仕事がすぐに終わり、その効果は、勤続が長いなど最初の保護が強かった仕事、「後から来た人から先に辞める」規則が適用される企業、公的部門の仕事から生じていた（抄録）。仕事を続けた人では賃金は硬直的に見えたが、労働時間が大きく減り、稼ぎは8%下がった（抄録）。", "p6": "スウェーデンの制度に基づく結果で、雇用の保護の制度が異なる国への一般化には注意が必要である。離職した人がその後どうなったかは抄録からは分からない。", "fun": "会社を辞めさせにくくする法律は働く人を守るが、67歳でその守りが外れると何が起きるか。スウェーデンでは、その瞬間に一部の人がすぐに職を失い、残った人も給料の額は変わらないまま働く時間が減らされていた。目に見える「解雇」だけでなく、時間を減らすという静かな調整が起きていたという発見が面白い。", "unverified": "本文が入手できず、対象者の数、期間、推定の方法、離職後の状況は確認できていない。"}}, {"rank": 7, "field": "因果推論", "headline": "処置後の出来事で条件づけた効果の定義と識別", "title": "Effects conditional on post-treatment events generated by independent mechanisms", "url": "https://doi.org/10.1093/aje/kwag241", "authors": "Marco Piccininni ほか", "date": "2026-09-26", "venue": "American Journal of Epidemiology", "why": "脱落や死亡による切断など処置後の出来事で条件づけた効果を、独立な機構によって生じる場合に定義・識別する方法を示した。", "id": "jn07", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "治療の後に起きる出来事（途中での脱落、治療の不遵守、死亡による結果の打ち切りなど）で条件づけた効果を、結果と後の出来事の共通の原因を測っていなくても識別できる条件を示した方法論の研究である（抄録）。", "p2": "治療後の出来事で条件づけた単純な比較は、治療が無作為に割り付けられていても一般に因果的な解釈ができない。生存者の平均因果効果や条件付き分離可能効果といった推定対象はあるが、その識別には後の出来事と結果の共通の原因を測る必要があった（抄録）。", "p3": "治療と、結果の測られていない他の原因が、それぞれ「独立したメカニズム」を通じて治療後の出来事を生むという概念的な条件を導入し、その下での識別を理論的に示した（抄録）。", "p4": "結果を打ち切る出来事がある研究、治療の遵守の違い、出生体重のパラドックスという3つの例で結果を例示した（抄録）。", "p5": "独立したメカニズムの条件の下では、条件付き分離可能効果と生存者の平均因果効果を、治療後の出来事と結果の共通の原因で調整しなくても識別できることを示した（抄録）。", "p6": "結果は「独立したメカニズム」という仮定に依存し、それが現実の研究で成り立つかはデータだけでは確かめにくい。例示の具体的な数値は抄録からは分からない。", "fun": "新しい薬の効果を「最後まで生き残った人」だけで比べると、実はずれた答えになることがある。薬が効いて生き残った人と、もともと丈夫で生き残った人が混ざるからだ。この研究は、ある条件がそろえば、隠れた原因を全部測らなくても正しく比べられることを示した。「低体重で生まれた赤ちゃんでは喫煙の害が小さく見える」という有名な謎にも使える点が面白い。", "unverified": "本文が入手できず、識別の条件の正確な形と、3つの例での具体的な計算は確認できていない。"}}, {"rank": 8, "field": "経営学", "headline": "サステナビリティ連動ローンの発行と契約設計", "title": "The Issuance and Design of Sustainability-Linked Loans", "url": "https://doi.org/10.2308/tar-2024-0791", "authors": "Aleksander A. Aleszczyk ほか", "date": "2026-09-28", "venue": "The Accounting Review", "sjr": 4.403, "why": "融資条件を企業のサステナビリティ成績に連動させるローンの契約設計を、世界の発行データで分析した。", "id": "jn08", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "企業の持続可能性の達成度に応じて金利が変わる「サステナビリティ・リンク・ローン（SLL）」の契約の設計を調べ、ESGの成績が悪い借り手を厳しく規律するようには作られておらず、主に象徴的なラベルとして機能していることを示した研究である（抄録）。", "p2": "SLLは急速に広がるESGラベル付きの融資だが、借り手の持続可能性を実際に改善させる動機づけの契約として設計されているのかは分かっていなかった（抄録）。", "p3": "2017〜2023年に世界で実行されたSLLの標本を使い、借り手のESGの成績と、持続可能性に連動する条項の厳しさの関係を分析し、借り手と貸し手の動機を調べた（抄録）。", "p4": "借り手のESGの成績と条項の厳しさの関連の有無、正統性・知名度・資金調達の動機、貸し手の商品の拡大の動機との整合性で評価した（抄録）。", "p5": "借り手のESGの成績と、SLLの条項の厳しさの間には関連がなく、SLLは一般に動機づけの契約として設計されていなかった（抄録）。契約の設計は、ESGのブランドづくりと融資商品の拡大の動機とよく合っており、借り手は正統性と知名度を高めて資金を集めるために、貸し手はESGへの取り組みを示し、投資家の需要に応え、商品を広げるためにSLLを使っていた（抄録）。", "p6": "条項の厳しさの測り方と、SLLが実際に持続可能性の成果を変えたかの検証の詳細は抄録からは分からない。データは本文で引用された情報源から入手できるとされる（抄録）。", "fun": "「環境目標を達成したら金利を下げます」という融資は、会社にやる気を出させる仕組みに見える。ところが調べてみると、環境の成績が悪い会社ほど厳しい条件が付くわけではなかった。借りる側も貸す側も「環境に配慮しています」という看板として使っている面が強いという。ラベルと中身の差を見抜く研究として面白い。", "unverified": "本文が入手できず、標本の件数、条項の厳しさの指標、推定の詳細は確認できていない。"}}, {"rank": 9, "field": "経済学", "headline": "モザンビークの大規模な幼稚園建設の効果", "title": "From Access to Achievement: The Primary School-Age Impacts of an At-Scale Preschool Construction Program in Highly Deprived Communities", "url": "https://doi.org/10.1257/app.20240364", "authors": "Marina Bassi ほか", "date": "2026-09-28", "venue": "American Economic Journal: Applied Economics", "sjr": 9.427, "why": "貧困地域での公立幼稚園の大規模建設をランダム化比較試験で評価し、就園率と小学校での進学・学習への効果を示した。", "id": "jn09", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "モザンビークの貧しい農村で行われた大規模な公立の幼稚園（就学前施設）の建設計画を、ランダム化比較試験で評価し、小学校の年齢になった子どもへの効果を調べた研究である（抄録）。", "p2": "就学前教育の効果の証拠の多くは高所得国や小規模な事業から得られており、極めて貧しい地域で大規模に施設を建てた場合の効果は十分に分かっていなかった。", "p3": "施設の建設を無作為に割り当てたランダム化比較試験で、就学前施設への通園、小学校への入学と進級、認知と社会情緒の能力のテストの点数、保護者の投資、弟や妹の通園を比べた（抄録）。", "p4": "通園率、小学校の入学と進級、テストの点数、効果の子どもの属性による違い、費用対効果で評価した（抄録）。", "p5": "計画によって就学前施設への通園率は2%から75%に上がり、小学校への入学と進級が改善し、処置群の子どもは認知と社会情緒の能力のテストで高い点を取った（抄録）。効果は、親が読み書きできない子ども、比較的貧しくない世帯の子ども、施設の近くに住む子どもで最も強かった（抄録）。保護者の子どもへの投資と弟や妹の通園も増え、計画は費用対効果よく実施されたと推定された（抄録）。", "p6": "一つの国の特定の地域での結果であり、他の国の制度への一般化には検証が必要である。効果が長期的に続くかは今後の追跡による。", "fun": "幼稚園がほとんどない村に幼稚園を建てたら、通う子どもの割合は2%から75%に跳ね上がった。しかも数年後、その子たちは小学校でも伸びていた。特に、親が字を読めない家の子どもほど効果が大きかったという。学ぶ場所が近くにあること自体が、家族の教育への関わり方まで変えていくのが面白い。", "unverified": "本文が入手できず、対象の村と子どもの数、テストの点数の効果の大きさ、費用の推定値は確認できていない。"}}, {"rank": 10, "field": "経済史・環境", "headline": "中世バルト海のニシン漁の崩壊をもたらしたもの", "title": "An historic fishery collapse driven by socioeconomic and environmental factors", "url": "https://doi.org/10.1038/s41893-026-01937-1", "authors": "Rudi Voss ほか", "date": "2026-09-28", "venue": "Nature Sustainability", "sjr": 7.896, "why": "1200〜1650年の450年分の漁獲記録から、中世後期のバルト海のニシン漁の崩壊を招いた社会経済的・環境的要因を特定した。", "id": "jn10", "explain": {"basis": "本文", "basis_note": "Nature Sustainabilityの出版社HTML版の本文（抄録、結果の資源量推定とループ分析、各時期の外部要因の設定）を読んだ。考察の後半と補足資料は確認していない", "preprint": false, "p1": "中世後期のヨーロッパで経済と政治の力の基盤だった西バルト海のニシン漁が1570年ごろに突然崩壊した原因を、450年分の漁獲の時系列（1200–1650）から分析し、気候変動、乱獲、社会経済の要因の組み合わせで説明できることを示した研究である（抄録）。", "p2": "塩漬けのニシンは中世後期のヨーロッパで富と政治力の基盤だったが、1570年ごろの漁業の突然の崩壊は交易に大きな混乱をもたらし、その原因は分かっていなかった（抄録）。", "p3": "漁獲量と価格のデータに基づく生物経済学的な資源評価の方法（BESA）で、漁業の時期ごとの持続可能な漁獲の上限と資源の減り方を推定した（§結果）。さらに、気候、経済、需要、労働力などの9つの変数の関係を符号つきの有向グラフで表すループ分析で、各時期の外部からの圧力が系全体にどう効いたかを調べた（§結果、表1）。", "p4": "4つの地域（ブラバント、イングランド、ハンブルク、ユトレヒト）の価格の時系列ごとに、持続可能な漁獲の上限と実際の漁獲を比べ、ループ分析の予測を漁獲の時系列と照らして検証した（§結果）。", "p5": "拡大期と停滞期には漁獲は持続可能な上限を大きく下回っていたが、1520–1570の好況期には乱獲の状態だった（§結果）。資源量は1510ごろから減り、好況期には観測された最大の41–51%まで減ったものの、資源そのものが崩壊した兆候はなかった（§結果）。漁業の崩壊は資源の崩壊と直接には結びつかず、乱獲による漁の費用の上昇に、急な寒冷化、北海の安いニシンとの競争、労働力の減少などの社会経済の要因が重なったと考えられた（§結果）。", "p6": "著者は、信頼区間はモデルの内部の精度だけを表し、漁獲の復元そのものの不確かさを含まないため、不確かさは過小に表されている可能性が高いと述べている（§結果）。補間したデータ点が見かけの整合性を高めている面もあり、推定は正確な資源評価ではなく、もっともらしい推移を示すものとされる（§結果）。", "fun": "中世のヨーロッパでは、塩漬けのニシンが食卓と国の財政を支えていた。その漁が1570年ごろに突然終わったのは、魚が取り尽くされたからだと思いがちだ。しかしこの研究によると、魚はまだ残っていた。寒くなり、北海に強力なライバルが現れ、取りすぎで漁の費用がかさんだことが重なって、商売として成り立たなくなったという。昔の記録から今の漁業の教訓を読み取るのが面白い。", "unverified": "表1の9つの変数の詳細、ループ分析の各時期の予測の結果、補足資料の感度分析は確認していない。"}}, {"rank": 11, "field": "機械学習", "headline": "感染症予測の基盤モデルMantis", "title": "Mantis: A foundation model for mechanistic disease forecasting", "url": "https://doi.org/10.1073/pnas.2602542123", "authors": "Carson Dudley ほか", "date": "2026-09-28", "venue": "Proceedings of the National Academy of Sciences", "sjr": 3.283, "why": "新しい流行やデータの少ない地域でも、個別の学習や専門家の調整なしに機構的な感染症予測を出せる基盤モデルを示した。", "id": "jn11", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "感染症の仕組みを表す数理モデルのシミュレーションだけで学習させた基盤モデル「Mantis」を作り、実際のデータで学習させなくても、さまざまな感染症・地域・指標の流行をすぐに予測できることを示した研究である（抄録）。", "p2": "新しい流行や資源の乏しい地域での感染症の予測は、大量の病気と共変量のデータ、個別の学習、専門家の調整が必要なため、新しい状況で素早く予測を出すのが難しかった（抄録）。", "p3": "感染の仕組みを表す数理モデルのシミュレーションだけで基盤モデルを学習させ、感染経路の異なる16の感染症について、78の予測モデルと比べた（抄録）。", "p4": "点予測の精度は平均絶対誤差（MAE）、確率的な予測の性能は重みつき区間スコアと被覆率で評価し、COVID-19の流行初期の予測を後から再現する検証も行った（抄録）。", "p5": "学習に実データを一切使わなかったにもかかわらず、流行初期のCOVID-19の予測では、米国CDCのCOVID-19予測ハブのすべてのモデルより低いMAEを示した（抄録）。ほかのすべての感染症でも、評価指標をまたいで一貫して上位2位以内に入った（抄録）。学習データにない感染の仕組みを持つ病気にも一般化し、病気ごとの型の暗記ではなく、感染の基本的な動きを捉えていることが示された（抄録）。", "p6": "シミュレーションに基づく学習のため、シミュレーションで表せない要因（行動の急な変化や報告の遅れなど）への強さは抄録からは分からない。比較の条件の詳細も本文での確認が必要である。", "fun": "新しい感染症が現れたとき、過去のデータがなければ流行の予測は難しい。そこでこの研究は、実際のデータではなく、「感染はこう広がる」という数式で作った膨大な架空の流行でAIを鍛えた。すると、本物のコロナの流行初期の予測で、専門家たちのモデルより正確だった。実物を見ずに練習だけで本番に強くなるのが面白い。", "unverified": "本文が入手できず、16の感染症の内訳、78のモデルとの比較の具体的な数値、学習に使ったシミュレーションの設定は確認できていない。"}}, {"rank": 12, "field": "経済学", "headline": "地すべりで移住した人々の長期的な損失", "title": "Disastrous Displacement: The Long-Run Impacts of Landslides", "url": "https://doi.org/10.1257/app.20240759", "authors": "Travis Baseler ほか", "date": "2026-09-28", "venue": "American Economic Journal: Applied Economics", "sjr": 9.427, "why": "ウガンダの6つの地すべりで被災した人々のほぼ全員を追跡し、災害による移住の長期的な経済的影響を推定した。", "id": "jn12", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "ウガンダで起きた6つの地すべりで家を追われた人々を、影響を受けた人のほぼ全員にわたって追跡し、災害による移住の長期的な経済的影響を推定した研究である（抄録）。", "p2": "自然災害は毎年何百万人もの人を移住させるが、影響を受けた人々が散らばってしまうため、その経済的な影響を調べるのは難しかった（抄録）。", "p3": "地すべりの通り道に住んでいた世帯と、同じ斜面にありながら通り道の外にいた世帯の間の、はっきりした境界を利用して比較した（抄録）。", "p4": "地すべりから数年後の世帯の所得と、生活への満足度で評価し、回復を左右する要因を分析した（抄録）。", "p5": "地すべりから数年後、影響を受けた世帯の所得は50%低く、生活に満足していると答える確率は18ポイント低かった（抄録）。さらなる分析から、人と人とのつながり（社会関係資本）が災害後の回復の成否を決める要因であることが示唆された（抄録）。", "p6": "ウガンダの特定の地すべりに基づく結果で、他の災害や国への一般化には注意が必要である。支援策の効果や移住先の違いの詳細は抄録からは分からない。", "fun": "地すべりで家を失うと、何年たっても暮らしは元に戻りにくい。ウガンダの研究では、地すべりの通り道にいた家族は、すぐ隣で被害を免れた家族に比べて、数年後も収入が半分だった。一方で、周りの人とのつながりが強い家族ほど立ち直りやすかったという。災害からの回復には、お金だけでなく人の輪が大事だという発見である。", "unverified": "本文が入手できず、対象の世帯の数、地すべりの時期、社会関係資本の測り方は確認できていない。"}}, {"rank": 13, "field": "組織行動・心理的安全性", "headline": "哲学を現場で実践する組織研究の方法", "title": "Field Philosophy: A Methodological Approach to Organizational Philosophy-in-Practice", "url": "https://doi.org/10.1177/10944281261479058", "authors": "Stephanie Daher ほか", "date": "2026-09-28", "venue": "Organizational Research Methods", "sjr": 14.268, "why": "実践と研究の関係を問う組織研究に、哲学を現場で実践する「フィールド哲学」の方法論を提案した。", "id": "jn13", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "哲学者が現場に入り込んで実務者と協働する「フィールド哲学」を、組織の研究の方法として発展させ、ブラジル・アマゾンの炭素クレジット事業の現地調査を例に示した方法論の論文である（抄録）。", "p2": "組織研究の方法論では、社会への影響や責任ある経営を意識して、研究と実務の関係が問われている。哲学の分野でも、現場から離れた抽象的な関わりを、実践に根ざした協働的な関わりに置き換える動きが起きていた（抄録）。", "p3": "フィールド哲学を組織の研究方法として捉え直し、交流、現場の側からの知識、内部者と外部者の協働を重視する方法として整理し、アマゾンの炭素クレジット事業の現地調査で例示した（抄録）。", "p4": "数量的な評価はない。方法の設計と適用への示唆を導くことが目的である（抄録）。", "p5": "フィールド哲学は、組織の現象を研究する際に、研究者と現場の人々の知識の交換と協働を通じて理解を深める方法になりうると論じ、その設計と適用への示唆を示した（抄録）。", "p6": "一つの事例による例示にとどまり、方法の有効性を他の方法と比べた評価はない。現場への深い関わりが研究の独立性に与える影響の扱いは抄録からは分からない。", "fun": "哲学者といえば、書斎で難しい本を読んでいる姿を思い浮かべる。しかし「フィールド哲学」では、哲学者がアマゾンの森を守る炭素クレジットの現場に入り込み、そこで働く人たちと一緒に考える。「正しい取引とは何か」のような問いを、現場の声から考え直す研究の進め方が面白い。", "unverified": "本文が入手できず、現地調査の期間と内容、方法の設計の具体的な指針は確認できていない。"}}, {"rank": 14, "field": "経済学", "headline": "内生的な説明変数に頑健なハザードモデル", "title": "An IV Hazard Model of Loan Default with an Application to Subprime Mortgage Cohorts", "url": "https://doi.org/10.1111/jofi.70088", "authors": "CHRISTOPHER J. PALMER", "date": "2026-09-28", "venue": "The Journal of Finance", "sjr": 22.27, "why": "ハザードモデルで内生的・誤測定の説明変数に頑健な制御関数法を開発し、サブプライム住宅ローンの差し押さえ率の上昇要因を分解した。", "id": "jn14", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "時間とともに起きる出来事（ローンの債務不履行など）のモデル（ハザードモデル）で、説明変数が内生的だったり測定誤差を含んだりしても使える推定法（制御関数法）を開発し、サブプライム住宅ローン危機の原因の分解に応用した研究である（抄録）。", "p2": "サブプライム危機では、緩い融資基準と住宅価格の下落のどちらが債務不履行を増やしたかが論争になってきたが、住宅価格は内生的なため、その効果を正しく測るのが難しかった（抄録）。", "p3": "ハザードモデルで内生的な説明変数を扱える制御関数の方法を作り、住宅価格の過去の景気循環への感応度の違いなどを操作変数として、住宅価格に対する債務不履行の弾力性を識別した（抄録）。これを2003〜2007年に組まれたサブプライムローンの世代に当てはめた（抄録）。", "p4": "世代をまたいで差し押さえの率が3倍になった原因を、融資基準の緩みと住宅価格の下落に分解して評価した（抄録）。", "p5": "緩い融資は危機に大きな役割を果たしたが、世代をまたいだ債務不履行の増加の多くは、融資基準とは関係のない価格の下落によって引き起こされていた（抄録）。住宅価格が10%下がると、サブプライム住宅ローンの債務不履行率は50%上がった（抄録）。", "p6": "結果は操作変数の妥当性に依存する。サブプライムローンに限った分析で、他の種類のローンへの一般化は抄録からは分からない。", "fun": "サブプライム住宅ローン危機では、「誰にでもお金を貸したから」と「家の値段が下がったから」のどちらが悪かったのかが議論された。この研究は、統計の工夫で二つを切り分け、家の値段が10%下がると返済できなくなる人が50%増えると推定した。原因の割り振りを数字で示すことが、次の危機への備え方を変える。", "unverified": "本文が入手できず、使ったデータの件数、操作変数の詳細、融資基準の寄与の大きさは確認できていない。"}}, {"rank": 15, "field": "公衆衛生", "headline": "就学時のワクチン義務をやめたらフロリダで麻疹は", "title": "Projected effects of removing school-entry vaccination requirements on measles transmission in Florida", "url": "https://doi.org/10.1073/pnas.2610455123", "authors": "Alice Oveson ほか", "date": "2026-09-28", "venue": "Proceedings of the National Academy of Sciences", "sjr": 3.283, "why": "年齢構造と子どもの接触の異質性を持つ麻疹の伝播モデルで、フロリダ州が就学時のワクチン義務をなくした場合の流行リスクを予測した。", "id": "jn15", "explain": {"basis": "抄録", "basis_note": "出版社のサイトから本文は入手できず、Crossrefの抄録のみを読んだ", "preprint": false, "p1": "米国フロリダ州で就学時のワクチン接種の義務をなくす提案について、麻疹（はしか）の流行が再び起きる危険を、年齢構造を持つ感染モデルで予測した研究である（抄録）。", "p2": "フロリダ州が州のワクチン義務の撤廃を提案しており、麻疹の再流行への州の脆弱さが緊急の問題になっていた（抄録）。", "p3": "子どもと大人の接触の仕方の違いを含む年齢構造の麻疹の伝播モデルを作り、2025年のテキサス州ゲインズ郡の麻疹の流行のデータで調整したうえで、フロリダ州の人口構成と麻疹・おたふくかぜ・風疹（MMR）ワクチンの接種率を当てはめた（抄録）。", "p4": "州のワクチンによる集団免疫のしきい値、接種率が下がった場合の流行の規模、今後5年以内の子どもの死亡数の予測、接種率と子どもどうしの接触の偏りへの感度で評価した（抄録）。", "p5": "フロリダ州の現在のMMRの接種率は、麻疹の持続的な伝播を防ぐのに必要な水準をすでに下回っていた（抄録）。就学時の義務の撤廃による接種率の低下をシミュレーションすると流行の可能性がさらに高まり、ワクチン以前の時代以来の規模の流行と、5年以内のかなりの数の子どもの死亡が予測された（抄録）。子どもの接種率がわずかに下がるだけで流行の規模は不釣り合いに大きく増え、子どもどうしが集まって接触する傾向が強いほどその効果は大きかった（抄録）。", "p6": "結果は、テキサスの流行で調整したパラメータと接種率の低下の想定に依存する予測であり、実際の行動や政策の変化によって変わりうる。予測される死亡数の具体的な値は抄録からは分からない。", "fun": "はしかは非常にうつりやすく、ほとんどの人がワクチンを打っていないと流行を止められない。この研究は、フロリダ州で学校入学時のワクチンの義務をなくすと、どれほど危険かを計算した。接種率が少し下がるだけで、流行の大きさは思った以上に膨らむ。小さな変化が大きな結果を生む「転換点」の怖さがよく分かる。", "unverified": "本文が入手できず、集団免疫のしきい値の値、予測された流行の規模と死亡数、接種率の低下の想定は確認できていない。"}}, {"rank": 16, "field": "経済学", "headline": "公共事業による雇用は約束を果たすか", "title": "Do Workfare Programs Live Up to Their Promises? Experimental Evidence from Côte d'Ivoire", "url": "https://doi.org/10.1257/app.20240586", "authors": "Marianne Bertrand ほか", "date": "202     head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + (THEME_CLASS[it.theme] || "--accent-soft") + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
