<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

VI）。真のジャイロ・バイアスは測定されておらず、推定値が再構成の遅い誤差を吸収している可能性を著者は認める（§V-B）。未査読のプレプリント。", "fun": "長い棒を振り回すと、棒はしなって先端が揺れます。棒に何か所もセンサ（IMU）を付ければ揺れは測れますが、各センサが感じる力には重力と揺れが混ざっていて、それを解きほぐすのが難所です。この研究は、ジャイロで向きを回しながら加速度をならす工夫で、重力の向きを遅らせずに揺れだけを取り除きました。精度向上の主因が高度な数学ではなくこの前処理だったと、著者自身が分析している点も面白いところです。", "unverified": "付録の安定性証明の細部と、表IVの全行（ゲインやモード形状を変えた場合）の数値は読み切れておらず未確認。"}}, {"id": "pr02", "rank": 2, "headline": "LLMは気候開示を人間の評価者並みに採点できるか", "title": "AI as a Junior Assessor: Can Large Language Models Score IFRS S2 Climate Disclosures? Evidence from Nigerian Upstream Oil and Gas", "url": "https://doi.org/10.5281/zenodo.24046192", "authors": "Davies, Joseph", "venue": "Zenodo", "date": "2026-11-08", "apa": "Davies, J. (2026). AI as a Junior Assessor: Can Large Language Models Score IFRS S2 Climate Disclosures? Evidence from Nigerian Upstream Oil and Gas (Version v1.3). Zenodo. https://doi.org/10.5281/ZENODO.24046192", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文本文（データと方法、結果の表3、考察・限界の節）を読んだ", "preprint": true, "p1": "ナイジェリアの石油・ガス上流3社の気候関連開示を、4つのLLMが公表済みの人間の採点（15指標・0〜3点）とどこまで同じように採点できるかを検証し、単発の採点は下書きには使えるが最終判断には不十分で、複数回の中央値が有効な場合があることを示した（§6.1）。", "p2": "2028年からIFRS S2による報告が義務化され、気候に詳しい人材の少ない監査法人はLLMによる一次審査を検討しているが、人間の評価者並みに採点できるかは分かっていない（抄録、§1）。", "p3": "Seplat・Oando・Aradelの2025年度の報告書をMarkdownに変換し、指標名と一般的な0〜3点の尺度だけを与えて（人間が使った指標別の基準は与えずに）採点させた。DeepSeek V4.1 FlashとGemini 2.5 Flashは全文（請求トークン最大443,000）を3回ずつ、GPT-4oとClaude Sonnet 4.5は社ごとの根拠の抜粋を1回読んだ（抄録、§4.3、表1）。", "p4": "評価指標は、各社の15指標の順位づけの一致（重み付きκ、社内κ）、3社をまとめた一致（プールκ）、平均絶対誤差、完全一致・1段階以内の割合、引用の検証率。比較の基準として、全項目に2点を付ける規則と、各社に人間の平均に近い1つの点を一律に付ける規則（社単位の規則）を置いた（§4.5）。", "p5": "単発ではClaudeとDeepSeekが社内κ 0.53・0.51で中程度の一致、1段階以内が90%超だったが、プールκでは社単位の規則（0.67）を超えた単発の実行はなかった（表3、§5.2）。DeepSeekの3回の中央値は全ての指標でこの規則を上回った（社内κ 0.64、平均絶対誤差0.29）（抄録）。Geminiは82%の項目に同じ中間点を付け、自身との再現性は高いが人間との一致は最も低かった（§6.2）。最大の誤差は、抜粋の文字数制限による欠落など処理系の不具合から生じた（§6.3）。", "p6": "人間の採点者は著者1人で、3社45項目と標本が小さく信頼区間は広い。モデルと入力方式が交絡し、DeepSeekの合意の規則は失敗した実行を見たあとに決めた（§7）。指標別の基準を与えた場合の性能は未検証。未査読のプレプリント。", "fun": "AIに報告書の採点をさせて人間の点数と比べると、一見よく合っているように見えます。ところが「この会社は全部3点、あの会社は全部1点」と会社ごとに一律の点を付けるだけの手抜きの規則の方が、まとめた一致度では高かったのです。会社の良し悪しを見分けるのは簡単でも、項目ごとの細かい判断は難しいことを、意地悪な比較対象を置いて暴いた点が面白いところです。", "unverified": "表4〜9の各社・各分野の詳細な数値と、付録の15指標の一覧は読み切れておらず未確認。"}}, {"id": "pr03", "rank": 3, "headline": "LLM採点の合格率で介入効果の推定が大きく変わる", "title": "Can Pass Rates Stand In for Correctness? An Audit of Measurement Dependence and Specification Mismatch in LLM-Graded Introductory Programming Practice", "url": "https://doi.org/10.35542/osf.io/mj4bu", "authors": "Hon-Ren Lin", "venue": "EdArXiv", "date": "2026-11-08", "apa": "Lin, H.-R. (2026). Can Pass Rates Stand In for Correctness? An Audit of Measurement Dependence and Specification Mismatch in LLM-Graded Introductory Programming Practice. https://doi.org/10.35542/osf.io/mj4bu", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "EdArXiv（OSF）の本文PDF（方法・結果・限界・結論の節、表I・図2の説明）を読んだ", "preprint": true, "p1": "プログラミング演習でAIのフィードバックの効果を測るとき、合格・不合格のラベルを出す採点器（運用中のGPT-4o、別の一律のLLM採点、人間）を替えるだけで、推定される効果（オッズ比）が4.6から1.4まで変わることを示した（抄録、§VI）。", "p2": "教育工学の研究では、AIのフィードバックの効果をLLM採点器の合格率で評価することが増えているが、その合格率が正しさを測っているのか、採点の仕様（問題文・模範解答・採点プロンプト）への適合を測っているのかは検証されていない（抄録）。", "p3": "台湾の大学1年の1クラス（43人、AB/BAの交差デザイン、提出899件）で、関数の名前・引数・戻り値の型を設計させる演習を、詳しい助言つきの採点（モードA）と合否のみ（モードB）の2通りのGPT-4oで運用した。全ての解答を一律のGPT-4oプロンプト、2人の盲検の採点者、事前登録した2つのGeminiで採点し直し、言い回しだけを変える摂動実験も行った（抄録、§III）。", "p4": "GEE（学生をクラスタ、問題を固定効果）で、モードAの合格に対するオッズ比を採点器ごとに推定し、人間の採点を基準にκなどで採点器の誤りの集中先を調べた（§IV、表I）。", "p5": "運用中の採点ではオッズ比4.61と大きかったが、一律のGPT-4o再採点では1.45、人間では1.39で有意でなく、Geminiでは2.10・2.35だった（§IV-A、表I）。2系統の再採点はどちらも人間とのκが.38だったが理由が異なり、GPT-4oは型の書かれていない戻り値を合格にし、Geminiは合格のはずの同義語への言い換えの79%を不合格にした（GPT-4oは47%、言い換えなしの対照は7%・0%）（抄録）。", "p6": "1クラス・1プラットフォームで割り付けは無作為でなく、事後テストがないため学習効果には言及できない。採点者の不一致は仮説を知る著者が裁定し、同義語の分割は結果を見たあとに定義した（§V-E）。未査読のプレプリント。", "fun": "同じ答案でも、誰が採点するかで「この教え方は効果が大きい」とも「ほとんど効果がない」とも言えてしまう。この研究はそれを数字で示しました。AIの採点者は、問題文と違う言葉（同義語）を使っただけで不合格にしたり、型を書き忘れても合格にしたりと、それぞれ別のところでつまずいていました。物差しの癖が結果そのものを作ってしまう怖さが見える点が面白いところです。", "unverified": "表Iの信頼区間の全値と、提示されたチェックリストの具体的な項目は読み切れておらず未確認。"}}, {"id": "pr04", "rank": 4, "headline": "LLM出力の評価法5系統を証拠と盲点で横断比較", "title": "Evaluating and Verifying Large Language Model Outputs: Methods, Benchmarks, and Frameworks", "url": "https://doi.org/10.6084/m9.figshare.34948534", "authors": "Vinuraj Devaraj", "venue": "Figshare", "date": "2026-11-08", "apa": "Devaraj, V. (2026). Evaluating and Verifying Large Language Model Outputs: Methods, Benchmarks, and Frameworks. figshare. https://doi.org/10.6084/M9.FIGSHARE.34948534", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Figshareに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "LLMの出力の良し悪しを判定する方法を、学習型の採点指標・事実性評価・LLM審査員（LLM-as-a-judge）・検証の枠組み・構造化出力の検証の5系統に整理し、それぞれが生む証拠、見える失敗と見えない失敗、費用で比べた総説（抄録）。", "p2": "出力の評価法は互いをほとんど参照しない5つの文献群に分かれており、ある出力が良いと言える根拠が分野ごとにばらばらになっている（抄録）。", "p3": "5系統の評価法を共通の対象である「出力」にそろえて比較し、最後に5系統の対応表と、出力評価の最小限の報告基準（測る構成概念の宣言、評価器の妥当性確認、欠陥の計上、審査員とテスト項目の来歴、人間の基準の手順）を提案した（抄録）。", "p4": "文献の総説であり、新たなデータでの検証はない。比較の軸は、各手法が生む証拠、捉えられる失敗、費用の3つ（抄録）。", "p5": "3つの所見を示した。第1に、評価器の妥当性確認はたいてい1回、1世代の出力に対してしか行われず、検証の基準を作り直すと評価器の順位が逆転する例が文献にある。第2に、出力を採点ではなく点検する「検証」は、欠陥の検出率ではなく生成の改善幅で評価されており、実運用の品質ゲートの特性はほぼ分かっていない。第3に、機械が読む構造化された記録は形式の正しさだけが評価され、意味の妥当性は検討されていない（抄録）。", "p6": "本文を入手できず、取り上げた文献の範囲と選定方法は未確認。単著の総説で、未査読のプレプリント。", "fun": "AIの答えが「良い」かどうかを決める物差しは、実は分野ごとにばらばらで、物差し自体の正しさを確かめるのは多くの場合1回きりです。しかも基準を作り直すと物差しの順位がひっくり返ることもあるといいます。テストの採点者を採点する人がいない、という問題を5つの分野を横断して指摘した点が面白いところです。", "unverified": "本文を入手できず、5系統それぞれの代表的な手法と、報告基準の各項目の具体的な内容は未確認。"}}, {"id": "pr05", "rank": 5, "headline": "頼れる人の存在が人生評価と日々の幸福の両方と関連", "title": "Happiness and Belonging: How national prosperity and social relationships relate to life evaluation and positive daily experience", "url": "https://doi.org/10.5281/zenodo.24049247", "authors": "Obregon Diaz ほか", "venue": "Zenodo", "date": "2026-11-08", "apa": "Obregon Diaz, C. F. (2026). Happiness and Belonging: How national prosperity and social relationships relate to life evaluation and positive daily experience. Zenodo. https://doi.org/10.5281/ZENODO.24049247", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文PDFの本文（第1〜4節、結論、表1〜3）を読んだ（補遺A・Bは概要のみ）", "preprint": true, "p1": "55か国の比較で、困ったときに頼れる家族や友人がいるという回答だけが、所得（GDP）を調整しても人生の評価と前日の肯定的な経験の両方と明確に関連することを示し、所属感と幸福を別々に測る必要を論じた（結論）。", "p2": "幸福は通常1つの順位で語られるが、人生全体の評価（0〜10のはしご）と前日の肯定的な感情（笑った・楽しんだ・興味深いことを学んだ）は別物で、55か国での両者の相関は.566にとどまる。例として、メキシコは人生の評価6.972でフィンランドの7.764より低いが、肯定的感情は.814で.736より高い（§1）。", "p3": "国を単位に、GDP・成長率・格差・人間開発指数と、所属感の5指標（制度へのアクセス、政府・近隣からの思いやりの認知、家族・友人の支え、差別の報告）を、2つの幸福の指標とのピアソン相関と、対数GDPを除いた偏相関で比べた（§2、§3、表1・2）。", "p4": "推定にはHC3の標準誤差を使い、Benjamini–Hochberg法で20の検定の偽発見率を5%に抑えた。元の55か国以外の89か国でも同じ向きの関連が出るかを確かめた（§4、表3）。", "p5": "家族・友人の支えの相関は人生の評価で.849、肯定的感情で.542、GDPを調整した偏相関でも.615と.560だった。政府や近隣の思いやりの認知には同様の正の関連はなかった（表2）。追加の89か国でも向きは再現したが、肯定的感情との偏相関は.296と弱かった（表3）。多重比較の補正後も残ったのは、所得と人生の評価、支えと2つの指標の関連だった（§4）。", "p6": "幸福と支えの質問が同じ調査から来るため回答の癖が関連を強めている可能性があり、支えが幸福を高めるのか逆かは個人を追う縦断データで確かめる必要があると著者は述べる（結論）。国の平均の比較では個人への影響は示せない（§3）。未査読のプレプリント。", "fun": "お金持ちの国ほど人々は「自分の人生は良い」と答えますが、「昨日は楽しかった」かどうかとは、それほど強く結びつきません。ところが「困ったときに頼れる人がいる」ことは、所得の影響を差し引いても両方と結びついていました。「誰かが気にかけてくれている」と感じるだけでは関連が見られず、実際に頼れる人がいるかどうかが効いているという区別が面白いところです。", "unverified": "補遺A（欧州社会調査の個人データの分析）と補遺B（差別の指標の調整）の詳細な推定値は読み切れておらず未確認。"}}, {"id": "pr06", "rank": 6, "headline": "作業単位で得な自動化が業務全体では得とは限らない", "title": "The Wrong Unit of Automation: Why Task-Level Profitability May Fail at the Workflow Boundary", "url": "https://doi.org/10.5281/zenodo.24055482", "authors": "Figurelli, Rogério", "venue": "Zenodo", "date": "2026-11-08", "apa": "Figurelli, R. (2026). The Wrong Unit of Automation: Why Task-Level Profitability May Fail at the Workflow Boundary. Zenodo. https://doi.org/10.5281/ZENODO.24055482", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "AIで作業を自動化する採算を作業単位で評価すると、例外の増加や後工程の検証負担などで業務フロー全体では判断が逆転しうるという「業務フロー境界仮説（WBH）」を定式化し、検証のための研究設計を示した（抄録）。", "p2": "AI導入の研究は、技術にさらされる度合いから、特定の作業の自動化が経済的に得かを問う段階に進んだが、得な作業が改善された工程を意味するとは限らない。置き換えは例外率、振り分けの確率、待ち時間、後工程の検証、人とシステムの仕事の配分を変えうる（抄録）。", "p3": "作業から業務フローへの価値評価の橋渡し、相互作用の残差、独立に受け入れられた案件を単位とする会計の約束、限定的な非含意の命題を定義した。2つの透明な数値例で、作業単位では誤って得に見える場合と、本当に業務全体で得になる場合を示した（抄録）。", "p4": "事前登録可能な研究設計として、作業単位の選別、通常の業務プロセスの経済分析、境界を明示した表現を同じ情報・費用・介入規則で比べ、独立に判定した業務の純価値に対する標本外の意思決定の後悔（regret）を主要な結果とする（抄録）。", "p5": "数値例は企業の観測データではなく、企業での実験、性能の改善、普遍的な定理は報告されていない。プロセスマイニングや待ち行列理論などの既存手法が不十分だとも主張しない（抄録）。", "p6": "実証はまだなく、提案の価値は、境界の明示的な計上が強力な既存手法を上回る意思決定をもたらす場合に限られると著者自身が述べる（抄録）。未査読のプレプリント。", "fun": "たとえばレジを機械にして1人分の作業が速くなっても、機械が苦手な例外の客が増えて店員が呼ばれ、行列が延びるなら、店全体としては得とは限りません。この論文は、作業1つの損得と仕事の流れ全体の損得を同じ物差しで比べる枠組みを作りました。部分の最適が全体の最適とは限らないという古い知恵を、AI導入の計算に組み込もうとする点が面白いところです。", "unverified": "本文を入手できず、2つの数値例の具体的な設定と、価値評価の橋渡しの式は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "安定した合意が誤り続ける条件を多主体モデルで分析", "title": "When Stable Systems Remain Wrong: Identifiability, Detection and Correction of Shared Error in a Minimal Multi-Agent Feedback Model; Wenn stabile Systeme falsch bleiben: Identifizierbarkeit, Erkennung und Korrektur gemeinsamer Fehler in einem minimalen Multi-Agenten-Rückkopplungsmodell", "url": "https://doi.org/10.5281/zenodo.24050552", "authors": "von Mallinckrodt ほか", "venue": "Zenodo", "date": "2026-11-08", "apa": "von Mallinckrodt, B. (2026). When Stable Systems Remain Wrong: Identifiability, Detection and Correction of Shared Error in a Minimal Multi-Agent Feedback Model; Wenn stabile Systeme falsch bleiben: Identifizierbarkeit, Erkennung und Korrektur gemeinsamer Fehler in einem minimalen Multi-Agenten-Rückkopplungsmodell. Zenodo. https://doi.org/10.5281/ZENODO.24050552", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された英語版の本文（抄録の主要な所見、考察6.1節）を読んだ", "preprint": true, "p1": "フリードキン–ジョンセン型の意見動学による最小の多主体フィードバックモデルで、系が安定に収束しても集団で共通の誤りを抱え続けうること、そして誤りの識別・検出・修正がそれぞれ別の条件を要することを整理し、合成データの実験で確かめた（抄録、§6.1）。", "p2": "全ての情報経路が同じ未知の偏りを含むとき、内部の観測だけではその偏りと真の状態を区別できないが、どの条件で系が自らの誤りを見抜き、正せるかは体系的に整理されていなかった（抄録）。背景：フリードキン–ジョンセン模型は、各主体が他者の意見の重み付き平均と自分の当初の意見を混ぜて意見を更新するモデル。", "p3": "既存の数学的結果を当てはめて共通誤差の識別可能性・観測の限界・修正の制約を形式的に分析し、141の独立に生成したネットワークと320の実験条件で8つの事前に定めた仮説を検定した。さらに、観測にもとづく修正戦略を既存の監査構造と理想の基準（オラクル）と比べる探索的な追試（X3）を行った（抄録）。", "p4": "評価は集団の決定の誤差（後期の絶対誤差など）で行い、影響力のある少数派と多数派の比較、偏った基準による監査の有無、棄権の効果、構造的な指標Φの判別力を、ネットワーク単位の比較とブートストラップ信頼区間で調べた（抄録、§4）。", "p5": "影響力の大きい少数派は、影響力の小さい多数派より大きな決定の誤差を生み、偏った基準に照らした監査は監査しないより悪いことがあった（抄録）。X3では許容される重みの付け替え戦略が後期の絶対誤差を0.528から0.175に下げ、オラクルの0.174に不確実性の範囲で近づいた。検証した監査構造が打ち消せたのは識別された共通の偏りの8〜10%で、同じ介入の範囲のオラクルは約75%だった（§6.1）。指標Φは分散や1次の自己相関を超える判別力を示さなかった（抄録）。", "p6": "全ての証拠は合成データで、実社会や組織での有効性は示されていない。数学的検証や再実装はAIを使った研究工程で行われ、独立した査読と外部の追試はまだと著者自身が明記する（抄録）。未査読のプレプリント。", "fun": "みんなの意見が一つにまとまって落ち着いても、それが正しいとは限りません。全員が同じ偏った情報源を見ていれば、話し合いをいくら重ねても誤りは見えないままです。さらに、見張り役が偏った物差しを使うと、見張りがない方がましになることもあるといいます。「安定」と「正しさ」と「直せること」を別々に考える整理が面白いところです。", "unverified": "8つの仮説それぞれの検定結果の数値と、数学的な命題（C1〜C6）の証明の細部は読み切れておらず未確認。"}}, {"id": "pr08", "rank": 8, "headline": "保育者の言語資源が多言語の子への活動調整と関連", "title": "Staff Language Capacity and Reported Language-Adaptive Practices in Early Childhood Education and Care: Evidence from Three Education Systems", "url": "https://doi.org/10.35542/osf.io/tem75", "authors": "Haoyuan Zhang ほか", "venue": "EdArXiv", "date": "2026-11-07", "apa": "Zhang, H., & Li, W. (2026). Staff Language Capacity and Reported Language-Adaptive Practices in Early Childhood Education and Care: Evidence from Three Education Systems. https://doi.org/10.35542/osf.io/tem75", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "EdArXiv（OSF）の抄録を使用（本文は入手できず）", "preprint": true, "p1": "子どもの家庭の言語を使える保育者ほど、前日の活動を子どもに合わせて調整したと報告する確率が高いことを、TALIS Starting Strong 2024の3つの教育制度のデータで示した（抄録）。", "p2": "保育者の言語の資源が活動を利用しやすくする手段になりうることは指摘されてきたが、それが実際の活動の調整とどう関係するかは実証的に分かっていなかった（抄録）。", "p3": "ベルギー・フランデレン共同体、デンマーク、フィンランドの426施設の保育者1,744人（担当する子どもの10%以上が施設と異なる家庭言語を持つ）について、子どもに関係する言語を使えるかどうかと前日の調整の頻度（5段階）の関係を、調査設計の重みを考慮した順序回帰で、学歴・経験・役割・集団の規模を調整して推定した（抄録）。", "p4": "評価の指標は、言語の能力がある保育者とない保育者の間の「よく・いつも調整した」確率の調整済みの差（パーセントポイント）と、その95%信頼区間（抄録）。", "p5": "差はフランデレンで8.07ポイント（95%CI 1.88〜14.26）、デンマークで5.11ポイント（−6.75〜16.97）、フィンランドで12.35ポイント（5.03〜19.66）だった。最近の関連する研修内容も副次的に正の関連を示し、養成課程の内容との関連はまちまちだった（抄録）。", "p6": "デンマークの推定は不精確で、フランデレンの結果の解釈はモデルの仮定に制約されると著者は述べる（抄録）。解釈：横断的な自己報告のため因果は示せない。本文は入手できず、未査読のプレプリント。", "fun": "家で別の言葉を話す子どもが多い保育室では、その子の言葉を少しでも話せる先生がいると、遊びや活動を子どもに合わせて変えやすくなるかもしれません。この研究は大規模な国際調査でそれを確かめ、フィンランドでは「よく調整した」という報告が12ポイントほど多いという結果でした。先生の話せる言葉も子どもを支える資源だという見方が面白いところです。", "unverified": "本文を入手できず、調整の頻度の分布と、研修内容との関連の大きさは未確認。"}}, {"id": "pr09", "rank": 9, "headline": "ナイジェリア石油ガス企業のIFRS S2準備度を指数化", "title": "Ready for 2028? IFRS S1 and S2 Readiness of Nigeria's Listed and OTC Oil & Gas Public Interest Entities", "url": "https://doi.org/10.5281/zenodo.23984010", "authors": "Davies, Joseph", "venue": "Zenodo", "date": "2026-11-07", "apa": "Davies, J. (2026). Ready for 2028? IFRS S1 and S2 Readiness of Nigeria's Listed and OTC Oil & Gas Public Interest Entities (Version v1.1). Zenodo. https://doi.org/10.5281/ZENODO.23984010", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文PDFの本文（研究設計、結果の4.1・4.3節、限界の6.2節）を読んだ", "preprint": true, "p1": "2028年のIFRS S1・S2の義務化を前に、ナイジェリアの上場・店頭の石油・ガス公益企業11社の気候関連開示の準備度を15指標の開示指数で採点し、事業の位置で大きな差があること、財務諸表との連結・シナリオ分析・保証に耐える内部統制が業界全体で欠けていることを示した（抄録、§4）。", "p2": "SECの実施計画の期限（2026年10月15日）、NUPRCの測定ベースのメタン報告（2027年1月）、FRCの3段階の準備度テスト（2027年9月30日から）が重なるなか、企業がどこまで準備できているかは測られていなかった（抄録）。", "p3": "IFRS S2のガバナンス・戦略・リスク管理・指標と目標に、NUPRCのメタン、IAS 36（減損）・IAS 37（引当金）との連結、ISSA 5000の保証への準備を加えた15指標を0〜3点（最大45点）で手作業で採点した。0点を超える採点には原文の引用とページ番号を必須とし、証拠を付録Bに公開した（§3.1）。", "p4": "対象はNGXとNASD OTCの11社（上流・統合3社、下流の販売6社、油田サービス2社）で、TotalEnergies Groupを国際的な比較基準とした。分析は層別の記述統計（§3.2、§4.1）。", "p5": "平均は15.27/45（33.9%）で、Seplat Energyの39/45（86.7%）から最低の4/45（8.9%）まで開いた。上流は平均60.0%、下流29.3%、油田サービス8.9%だった（§4.1）。11社中10社が気候の前提と減損・廃坑引当の数値を定量的に結び付けておらず（FIN-1が1点）、10社が気候シナリオ分析を示さず、保証に耐える内部統制を持つ企業はなかった（抄録、§4.3）。", "p6": "採点は著者1人で評価者間の一致は測られていない。データは2026年11月4日時点の公開資料で、一部はFY2022の報告やスキャン画像のOCRに依存し、11社の小標本のため多変量の回帰はできない（§6.2）。未査読のプレプリント。", "fun": "会社が「気候変動に取り組んでいます」と書くのは簡単ですが、それがお金の数字にどうつながるかを示すのは難しいことです。この研究では、11社のうち10社が、気候の見通しを設備の価値の見直しや油井を閉じる費用の計算に結び付けていませんでした。言葉の上の開示と帳簿の数字との間にある「壁」を点数で示した点が面白いところです。", "unverified": "15指標それぞれの社別の得点表（付録）と、提案された段階的な移行措置の枠組みの詳細は読み切れておらず未確認。"}}, {"id": "pr10", "rank": 10, "headline": "てんかんの子の医療費に家族はどう対処しているか", "title": "Caregivers' Strategies for Managing Medical Expenses for Children with Epilepsy in Ubungo Municipality, Tanzania", "url": "https://doi.org/10.5281/zenodo.24040806", "authors": "Rose-Mary Conrad Makua ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-07", "apa": "Rose-Mary Conrad Makua, Dr. Ludovick Myumbo, & Prof. Johnson Mavole. (2026). Caregivers' Strategies for Managing Medical Expenses for Children with Epilepsy in Ubungo Municipality, Tanzania. IKR Publishers. https://doi.org/10.5281/ZENODO.24040806", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文PDFの本文（方法・結果・考察の節）を読んだ", "preprint": true, "p1": "タンザニア・ダルエスサラームのウブンゴ地区で、てんかんのある子どもの介護者が医療費とそれに伴う出費にどう対処しているかを質的に描き、家計のやりくり、借り入れ、保険、人間関係の支えがあっても経済的な圧迫は消えないことを示した（抄録、結論）。", "p2": "てんかんの子のケアには、薬や診察だけでなく、通院の交通費、食費、おむつ、子守りの費用などが繰り返しかかり、介護のために稼ぐ時間も減るが、介護者がそれにどう対応しているかは十分に記述されていなかった（抄録）。", "p3": "質的な記述的現象学の研究で、学位論文にもとづき、介護者10人と医療者2人への面接、地域住民8人のフォーカスグループを行い、医療費に関わる部分を主題分析で5つの主題に整理した（方法）。", "p4": "頻度や費用の統計的な推定ではなく、参加者が語った対処の仕方の記述を目的とし、匿名化した符号で引用を示した（方法）。", "p5": "5つの主題は、医療費による家計の圧迫、予算の組み替えと支出の削減、健康保険と外部の援助、家族と地域の支え、失われた収入と競合する介護の責任だった。ある介護者は通院の往復の交通費が約6万タンザニア・シリングに達し、介護のために商売に支障が出ると語った（結果）。援助は当てにならないこともあり、対処の戦略は経済的な脆弱さを取り除くものではなかった（結論）。", "p6": "1地域の少数の参加者による質的研究で、頻度や費用の一般化はできないと著者は述べる（結論）。本文には参加者数や引用を学位論文の最終版と照合すべきとする編集上の注記が残っており、草稿段階の文書とみられる（方法）。未査読のプレプリント。", "fun": "子どもの病気にかかるお金は、薬代だけではありません。病院までの交通費、待ち時間の食事、おむつ、仕事を休むことで失う稼ぎまで、目に見えにくい出費が積み重なります。この研究は、家族がそれを親戚からの借金や支出の切り詰めでしのいでいる様子を描きました。医療費を「病院の窓口で払うお金」より広く捉える必要を示した点が面白いところです。", "unverified": "学位論文の最終版との照合の状況、倫理審査の手続き、各主題の参加者ごとの分布は未確認。"}}, {"id": "pr11", "rank": 11, "headline": "LLMの創造性評価は価値と多様性の分け方で変わる", "title": "Auditing Creativity in Large Language Models: Value, Semantic Diversity, and Generation Budgets", "url": "https://doi.org/10.5281/zenodo.24047767", "authors": "Noguer i Alonso ほか", "venue": "Zenodo", "date": "2026-11-08", "apa": "Noguer i Alonso, M. (2026). Auditing Creativity in Large Language Models: Value, Semantic Diversity, and Generation Budgets (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24047767", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文PDFの本文（序論の要旨、公開データの二次分析の設計、限界と結論）を読んだ（数学的な命題の証明は読んでいない）", "preprint": true, "p1": "LLMの創造性の評価が、言い回しの違いを数えるか意味の違いを数えるか、価値の低い出力を除くか、生成と選択の予算をどう扱うかで変わることを数式の台帳で整理し、公開データの再分析でその感度を示した（抄録、結論）。", "p2": "創造性の評価では、新規性・価値・多様性・生成と選択の手続きが混ざって1つの点数にされがちで、どの介入（報酬による調整、温度、尤度による判定、ふるい分けと順位づけ）が何を変えるのかが区別されていない（抄録）。", "p3": "基準分布に対する新規性、外部で評価した価値、価値を満たす出力の中の意味的多様性、生成と選択の予算を分ける分布の台帳を定義し、有限の分布での厳密な結果を導いた。例えば、エントロピーの微分には元のモデルの対数確率との共分散が残るため、整合（アライメント）で元の分布から離れながら出力が多様化することも集中することもある（抄録）。", "p4": "NoveltyBenchが公開した6モデル・2条件（独立生成と、先の回答を文脈に入れる文脈内生成）・2つのプロンプト集（厳選100件、WildChat 1,000件）の132,000件の回答を、新たなモデル呼び出しなしで再分析した。主要な比較は、10候補で品質点7以上を満たす意味のグループの数の条件間の差で、プロンプトのブートストラップ（1万回）で区間を求めた（実証分析の節）。", "p5": "文脈内生成は品質を満たす意味のグループの平均数を、厳選プロンプトで4.63（95%区間4.15〜5.11）、WildChatで1.70（1.56〜1.84）増やした。品質のふるいにより、ふるう前の増分はそれぞれ約28%・37%小さくなり、一部のモデルの記述的な順位も入れ替わった（抄録）。", "p6": "公開済みの判定を固定して使い、人間による新たな検証、歴史的な独創性の測定、整合の因果効果の主張はしていない。代表の回答だけを採点する方式、判定モデルの名前の重なり、文脈の費用の違いが解釈を制約すると著者は述べる（結論）。未査読のプレプリント。", "fun": "「AIはどれだけ独創的か」を測るとき、違う言い回しを数えるか、違うアイデアを数えるか、つまらない答えを除くかで結果は変わります。この研究は、前の答えを見せながら次の答えを出させると質の基準を満たす違うアイデアが増えることを示しつつ、質のふるいをかけると見かけの増え方が3〜4割小さくなることも示しました。測り方しだいで「創造性」の順位が入れ替わるという点が面白いところです。", "unverified": "数学的な命題の証明と、モデル別の表（各モデルの網羅の値）は読み切れておらず未確認。"}}, {"id": "pr12", "rank": 12, "headline": "異常検知器は評価の母集団を広げると誤報が見える", "title": "Evaluating Spacecraft Telemetry Anomaly Detection Beyond Clean Benchmarks: A Forensic Study on Real ESA Mission Data with Ground-System Integration", "url": "https://doi.org/10.5281/zenodo.24049157", "authors": "Thokal, Aaditya", "venue": "Zenodo", "date": "2026-11-08", "apa": "Thokal, A. (2026). Evaluating Spacecraft Telemetry Anomaly Detection Beyond Clean Benchmarks: A Forensic Study on Real ESA Mission Data with Ground-System Integration. Zenodo. https://doi.org/10.5281/ZENODO.24049157", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文PDFの本文（方法の概要、関連研究、限界、結論）を読んだ", "preprint": true, "p1": "実際のESAミッションのテレメトリで、凍結した解釈可能な異常検知器を、評価の母集団を広げながら追った事例研究。陽性の事象は全て検出する一方、正常と確認されていない対照の23.53%でも反応することを示し、否定的・未解決の結果も含めて地上システムへの組み込みまでを記録した（抄録）。", "p2": "宇宙機のテレメトリの異常検知器は決まった陽性の母集団で評価されることが多く、評価を広げたときの振る舞いが隠れてしまう。時系列異常検知のベンチマークには、自明さや非現実的な異常の密度などの系統的な欠陥があるとの指摘もある（抄録、関連研究）。", "p3": "頑健な証拠にもとづく解釈可能な検知器（v1）を凍結し、30件のクラス3の事象と事前に決めた170件のラベルなし・陰性の対照で評価した。反応とチャンネルの次元数などの構造的な関係を分析し、仮説にもとづく改良版（v2）を比べ、別の衛星のデータ（OPSSAT-AD）での外部の試験と、Yamcs 5.13.2による実際の地上システムへの組み込みも行った（抄録）。", "p4": "評価は陽性の検出率と対照での反応率で、対照は正常と認定されていないため、その反応率を確定した誤報率とは扱わない。地上システムでは6つの再生事例で数値が一致するかを確かめた（抄録）。", "p5": "v1は30件の陽性を全て検出し、対照170件中40件（23.53%）にも反応した。反応はチャンネルの次元数と強く関連し、最も次元の高い層では検出が100%だった。v2はv1を改善せず、OPSSAT-ADでは代替の閾値の手順でほぼ偶然水準の判別だった。Yamcsへの組み込みは6事例中5事例で数値的に一致し、残る1事例は過去の記録の欠落で検証できなかった（抄録）。", "p6": "陽性は30件のみで、対照は正常と確認されておらず、76チャンネル中26チャンネルしか再構成されていない理由も記録されていない。独立に実装した比較の検知器もないと著者は列挙する（限界）。未査読のプレプリント。", "fun": "異常を見つける装置は、「異常が起きた場面」だけで試すと全部見つけられて優秀に見えます。ところが、異常かどうか分からない普通の場面まで試験を広げると、4分の1近くで警報が鳴りました。しかも、それが本当の誤報かどうかは、普通の場面が本当に正常だったか確かめていないので分かりません。評価のやり方そのものの落とし穴を正直に記録した点が面白いところです。", "unverified": "チャンネルの層別の表の数値と、v2の改良の具体的な内容は読み切れておらず未確認。"}}, {"id": "pr13", "rank": 13, "headline": "格安航空の撤退後の運賃上昇を価格と供給に分解", "title": "After Spirit: Fare Composition, Incumbent Pricing, and Capacity Replacement", "url": "https://doi.org/10.5281/zenodo.24044514", "authors": "Bracken, DJ", "venue": "Zenodo", "date": "2026-11-07", "apa": "Bracken, D. J. (2026). After Spirit: Fare Composition, Incumbent Pricing, and Capacity Replacement (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24044514", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された作業論文PDFの本文（データと測定、解釈と結論の節）を読んだ", "preprint": true, "p1": "2026年5月2日のスピリット航空の運航停止後、影響を受けた米国の国内空港間109路線で、平均運賃の上昇のうち格安の切符が消えたことによる部分と、残った航空会社の値上げ、座席の置き換えを分けて測った作業論文（抄録）。", "p2": "格安航空会社が市場から消えると平均運賃は上がるが、それが安い売り手の消失による構成の変化なのか、既存企業の値上げなのかは区別されていない（抄録）。", "p3": "米運輸統計局の月次の切符データ（DB1C、2025年7月〜2026年7月）と運航座席のデータ（T-100）で、片道直行の切符の旅客加重の平均総額を航空会社・方向・期間・月のセル単位で作った。平均の上昇を基準期の構成で厳密に分解し、既存企業の運賃は固定セルの比較、エントロピー・バランシング、予約時期の長短の比較で推定した（§2、抄録）。", "p4": "評価は平均運賃の上昇の分解、既存企業の運賃の変化率、ライバルの座席増によるスピリットの座席の置き換え率で、反実仮想のトレンドのずれを許す投影区間で感度を示した（抄録、§7）。", "p5": "直行の片道の平均額は1〜2月の203.22ドルから6〜7月の261.88ドルに上がり、58.66ドルの上昇のうち40.41ドルはスピリットの安い切符が基準の構成から消えることで説明された（算術的な分解で因果ではない）。既存企業の運賃との関連は11.1%、エントロピー・バランシングでは5.7%（不確実性が大きい）、予約時期の比較では3.8%だった。ライバルの座席増はスピリットの座席の27.2%（6月）と39.9%（7月）しか置き換えなかった（抄録）。", "p6": "既存企業の値上げの正確な因果効果は未解決で、トレンドのずれを少し許すだけで区間がゼロを含む。阻止された合併の厚生効果は識別していない（抄録、§8）。研究の設計・データ処理・分析・執筆にAIの研究エージェントが大きく関与したと明記されている（抄録）。未査読の作業論文。", "fun": "安売りの店がなくなると、商品の平均価格は上がります。でもそれは、残った店が値上げしたからなのか、安い商品そのものが消えたからなのか、区別しないと分かりません。この研究は、平均の上昇約59ドルのうち約40ドルは「安い切符が消えた」ことだけで説明できると計算しました。値上げの犯人探しの前に、平均という数字の成り立ちを分解して見せた点が面白いところです。", "unverified": "路線別・航空会社別の推定値の表と、季節モデルによる座席不足（12.6ポイント）の推定方法の詳細は読み切れておらず未確認。"}}, {"id": "pr14", "rank": 14, "headline": "見込み客の成約確率を受付時点で較正して予測", "title": "Predicting Lead Conversion at Intake: A Production Case Study in Calibrated Scoring, Leakage Control, and Automated Assignment", "url": "https://doi.org/10.5281/zenodo.24049195", "authors": "Jeevan, Reddy", "venue": "Zenodo", "date": "2026-11-08", "apa": "Jeevan, R. (2026). Predicting Lead Conversion at Intake: A Production Case Study in Calibrated Scoring, Leakage Control, and Automated Assignment. Zenodo. https://doi.org/10.5281/ZENODO.24049195", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された白書PDFの本文（ラベルと漏れの境界、モデル選択、運用上の発見、限界の節）を読んだ", "preprint": true, "p1": "営業の見込み客（リード）が登録された瞬間に、人が触れる前の情報だけで最終的に成約する確率を較正して予測し、重複除去・地域の判定・順番の振り分けまで自動で行う実運用のシステムを記述した事例研究（抄録）。", "p2": "成約予測の多くは、営業担当者が後から入力する通話記録や品質の分類などを学習に使ってしまい、未来の予測ではなく営業過程が残した記録を読むだけになる（答えの漏れ）。また、まだ成約していない新しいリードを不成約とみなすと誤ったラベルになる（§3、§4）。", "p3": "漏れの境界を登録の時刻に定めて全ての特徴量を点検し、8つのカテゴリ変数（獲得経路、商品、国・都市など）と登録の時刻・曜日だけを使う勾配ブースティング木を確率として較正した。4系統5構成のモデルを同じデータ・特徴量で比べ、成熟したリードで毎週学習データを延長し、ドリフトの自動点検を置いた（抄録、§3、§5、§6）。", "p4": "評価は保留データでの7回の無作為分割の平均のPR-AUC（基準率3.4%に対する）、ROC-AUC、上位10%のリフト、人の振り分けとの一致率（抄録）。", "p5": "PR-AUCは約0.27（分割間の標準偏差0.015）、ROC-AUCは約0.84、上位10%のリフトは約5.3倍、人の振り分けとの一致は約88〜92%だった（抄録）。名前からは安全に見えた3項目を加えてもPR-AUCは0.365から0.359で改善しなかった（§3）。運用後には、規模が大きくなると逆転する重複検出の盲点、長期では大きくずれていた振り分けの代替規則、成約率が構造的に0%の経路の混入などの失敗が見つかった（抄録）。", "p6": "ブースティングとロジスティック回帰の差は評価の雑音の範囲で区別できず、毎週の再学習の自動化は接続障害で2026年7月23日以降止まっている。結果は書き込み権限のない影の運用での値である（§9）。単一企業の事例で、未査読の白書。", "fun": "問い合わせてきたお客さんが将来買ってくれるかを、営業担当が電話する前に予測するのは、答えをのぞき見しないテストのようなものです。営業担当が後から書き込むメモを学習に使うと、AIは未来を予測しているのではなく結果の記録を読んでいるだけになってしまいます。この研究は、その「のぞき見」を徹底的に避ける線引きと、実際に動かして初めて見つかった失敗を正直に報告した点が面白いところです。", "unverified": "5つのモデル構成の比較表の数値と、ドリフト点検の閾値の決め方は読み切れておらず未確認。"}}, {"id": "pr15", "rank": 15, "headline": "退職者の仕事の痕跡を企業AIが資本に変える問題", "title": "The Enclosure of Organizational Memory: Enterprise AI Agents and the Work Traces of Departed Employees", "url": "https://doi.org/10.5281/zenodo.24052495", "authors": "Jefferson ほか", "venue": "Zenodo", "date": "2026-11-08", "apa": "Jefferson, J., & Velasco, F. (2026). The Enclosure of Organizational Memory: Enterprise AI Agents and the Work Traces of Departed Employees. Unearth Heritage Foundry. https://doi.org/10.5281/ZENODO.24052495", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Zenodoに登録された論文PDFの本文（知的財産・個人データ・徒弟制・搾取・制度的統治の各節）を読んだ", "preprint": true, "p1": "企業のAIエージェントが退職した従業員の作業記録（コードの履歴、チケット、社内の会話）を再利用することを、蓄積された職場の実践が固定資本に変わる「組織の記憶の囲い込み」として捉え、著作権法・個人データ保護法の空白と、利用に期限を設ける契約などの制度的な対策を論じた論考（抄録、「制度的統治」の節）。", "p2": "米国の職務著作の原則は従業員の創作物を雇用主に帰属させ、欧州のデータ保護の判例は職場の記録を目的の制限を受ける個人データとみなすが、どちらも在職中の賃金と、成文化された専門知の無期限の再利用との差を扱っていない（抄録）。", "p3": "法学（職務著作、GDPRとNowak事件の判例）、労働の理論（死んだ労働、囲い込み）、知識の理論（暗黙知、「理論構築としてのプログラミング」、正統的周辺参加）、搾取の哲学（カント的な道具化）を組み合わせた概念的な分析（本文）。", "p4": "実証データによる検証はなく、議論の妥当性は法制度と理論の整理の一貫性に依拠する（本文）。", "p5": "記録は元社員の明示的な決定を保存する一方、書かれない理論は生きた実務家に宿るため、この暗黙の核を置き換えると職業上の徒弟制が途切れ、企業による過去の労働への支配が集中すると主張した（抄録）。対策として、労働組合や欧州の労使協議会による共同決定、GDPRの目的制限にもとづき退職者の貢献の自動検索に期限を設ける契約上のサンセットなどを挙げた（「制度的統治」の節）。", "p6": "概念的な論考で、現場の実態調査や企業事例の分析は含まれない。解釈：提案した制度の実現可能性や費用は検討されていない。未査読のプレプリント。", "fun": "辞めた社員が残したメモやプログラムを、会社のAIが読み込んで今の仕事に使い続けるとしたら、その社員の「腕前」は誰のものでしょうか。給料は在職中の分しか払われていないのに、知恵だけが働き続けることになります。この論文は、記録に残らない「なぜそうしたか」という勘所は人にしか宿らず、それを軽んじると若手が育つ道が失われると指摘します。AI時代の新しい「囲い込み」という見方が面白いところです。", "unverified": "提案された契約上のサンセットの具体的な設計と、機械の忘却（machine unlearning）の扱いの詳細は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "出典に紐づけてAIペルソナを構築する設計を提案", "title": "Persona Foundry: A Source-Linked Framework Design for AI Persona Construction", "url": "https://doi.org/10.5281/zenodo.24052851", "authors": "Huh ほか", "venue": "Zenodo", "date": "2026-11-08", "apa": "Huh, J., Yoo, H., Lee, S. H., & Choi, M. (2026). Persona Foundry: A Source-Linked Framework Design for AI Persona Construction (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24052851", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "AIのペルソナ（人格設定）を作る工程を、根拠の補修・指示の改善・任意のパラメータ適応に分けて扱う設計仕様「Persona Foundry」を提案した（抄録）。", "p3": "仕様を示したうえで、提供された記録から後ろ向きに選んだ5つの開発事例を再分析した。これらは工程全体を評価するものではないと著者は断っている（抄録）。", "p5": "ある適応済みのモデルでは、2人の判定者が元の指示への応答の1/9、改訂した指示への応答の9/9を一貫してくだけた口調と判定した。他の事例では文体の好みや場面への忠実さなどで結果はまちまちで、自動の振り分け・汎化・費用削減は未検証である（抄録）。", "fun": "AIに「キャラクター」を演じさせるとき、口調を直すには指示文を変えるか、モデルを学習し直すか、根拠の資料を足すかという選択があります。この論文はその3つを分けて考える設計図を示しました。改訂した指示で、くだけた口調と判定された応答が9回中1回から9回中9回に増えた例もありますが、著者自身が事例の記述にとどまると認めている点も正直です。", "unverified": "本文を入手できず、5事例の内容と判定の基準、どの事例でどの手段が効いたかは未確認。"}}, {"id": "pr17", "rank": 17, "headline": "在宅勤務の心理的苦痛と職場の関係・業績の評価", "title": "Right Working Relationships, Psychological Distress and Perceived Organizational Performance While Working From Home: Evidence from Employees in Lagos, Nigeria, during COVID-19", "url": "https://doi.org/10.5281/zenodo.24044687", "authors": "Obeto, Rhoda", "venue": "Zenodo", "date": "2026-11-07", "apa": "Obeto, R. (2026). Right Working Relationships, Psychological Distress and Perceived Organizational Performance While Working From Home: Evidence from Employees in Lagos, Nigeria, during COVID-19 (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.24044687", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "コロナ禍の在宅勤務で生じた心理的苦痛が、職場の良好な関係づくりの行動（社会的支援とコミュニケーション）と組織業績の認知の両方の低さと結びつくことを、ナイジェリア・ラゴスの従業員で示した（抄録）。", "p3": "2021年の雪だるま式のオンライン調査（333回答のうちラゴスの在宅勤務経験者205人）で、独自の尺度を探索的・確認的因子分析で確かめ、構造方程式モデルとノンパラメトリックな群間比較で仮説を検証した（抄録）。", "p5": "心理的苦痛は良好な関係の行動（β=−0.36）と業績の認知（β=−0.35）に負に関連し、関係の行動は業績の認知に正に関連して（β=0.54）苦痛と業績の関連の一部を媒介した（間接効果β=−0.19）。業績の妨げには不安定な電力供給（66%）とネット接続（55%）が多く挙がった（抄録）。", "fun": "在宅勤務のつらさは個人の問題に見えますが、この調査では、気持ちが沈んでいる人ほど同僚との連絡や助け合いが少なく、それが会社の成績の見え方にもつながっていました。さらに仕事の妨げとして多く挙がったのは停電（66%）とネット回線の不安定さ（55%）でした。心の健康と電気・通信というインフラが同じ問題の両面だという点が面白いところです。", "unverified": "本文を入手できず、尺度の項目と適合度、雪だるま式抽出による標本の偏りの扱いは未確認。"}}, {"id": "pr18", "rank": 18, "headline": "人間を工程に置くだけではAIの監督は成り立たない", "title": "From Human-in-the-Loop to Human-in-the-Design: Friction, Choke Points, and the Control of AI-Enabled Work", "url": "https://doi.org/10.5281/zenodo.24046495", "authors": "Ko, Jaina", "venue": "Zenodo", "date": "2026-11-08", "apa": "Ko, J. (2026). From Human-in-the-Loop to Human-in-the-Design: Friction, Choke Points, and the Control of AI-Enabled Work (Version 2.0). Zenodo. https://doi.org/10.5281/ZENODO.24046495", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "人間を業務の流れに置く（Human-in-the-Loop）だけではAIを使う仕事を監督できず、確認して手を打てるように仕事を設計する（Human-in-the-Design）必要があると論じる概念論文（抄録）。", "p3": "著者の先行研究の「検証のオーバーラン」を土台に、検証の要求量（VReq）と検証の能力（VCap）、介入が間に合う範囲としての検証の窓、人・自動・混合の検証ゲートなどの概念を定め、供給・保全・配置の3つの設計義務に整理した（抄録）。", "p5": "AIは仕事の量や速さ、人に届く証拠、判断と実行の手段の分離を変えるため、仕事そのものが速くならなくても人の監督が機能しなくなりうると主張する。実証データによる検証は含まれない（抄録）。", "fun": "「最後は人間がチェックする」と言えば安心に聞こえますが、チェックする人に十分な時間も証拠も止める権限もなければ、それは見せかけの監督になります。この論文は、人がどこにいるかではなく、確認と修正が間に合うように仕事が組み立てられているかを問うべきだと主張します。検査の網をどこに置くかという、工場の品質管理にも通じる問いです。", "unverified": "本文を入手できず、図1や2つの例示シナリオの内容、各概念の操作的な定義は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "研究職の継続を左右する保育の利用しやすさ", "title": "Beyond Parental Leave: Childcare Access and the Conditions for Participation in Research Careers", "url": "https://doi.org/10.31235/osf.io/bn8sj", "authors": "Rachel-Ann Jones", "venue": "SocArXiv", "date": "2026-11-07", "apa": "Jones, R.-A. (2026). Beyond Parental Leave: Childcare Access and the Conditions for Participation in Research Careers. https://doi.org/10.31235/osf.io/bn8sj", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "研究者の育児の責任を、休暇で対応する一時的な中断ではなく日々の研究参加を左右する条件として捉え直し、保育の利用しやすさを研究を支えるインフラとみなす枠組みを示した総説（抄録）。", "p3": "学術研究、より広い労働市場の研究、英国の政策の証拠を統合し、育児の強度と予測可能性、代わりの保育の手頃さ・確実さと、研究時間・移動・キャリアの関係を整理した（抄録）。", "p5": "親であるかどうかは制約の不正確な代理指標で、育児の負担と保育の利用可能性が研究時間を保つ機会の違いと関連していた。英国の政策は決まった中断や個別活動の追加費用への支援が中心で日常の保育への支援は少なく、長期の効果の直接の証拠は限られる（抄録）。", "fun": "子育て中の研究者への支援というと育児休暇が思い浮かびますが、この総説は、毎日の保育を確保できるかどうかが研究を続けられるかを左右すると指摘します。道路や電気のように、保育も研究活動を支えるインフラだと考える発想の転換が面白いところです。", "unverified": "本文を入手できず、統合した文献の件数・選定基準と、提案された参加の経路の詳細は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "同じモデルでハーネスだけを変えて性能を比較", "title": "Three Pre-registered Comparisons of pi, Codex CLI and Claude Code on Personal-Assistant Tasks", "url": "https://doi.org/10.5281/zenodo.24045212", "authors": "Kho, Carl Vincent", "venue": "Zenodo", "date": "2026-11-07", "apa": "Kho, C. V. (2026). Three Pre-registered Comparisons of pi, Codex CLI and Claude Code on Personal-Assistant Tasks. Zenodo. https://doi.org/10.5281/ZENODO.24045212", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "同じ言語モデルを使い、エージェントを動かすプログラム（ハーネス）だけを替えて性能を比べる事前登録の研究で、個人用に設定したハーネスpiとCodex CLI・Claude Codeの差を測った（抄録）。", "p3": "その人が繰り返しエージェントに注意してきた10種類の失敗（確認せずに完了と報告するなど）を組み込んだ合成の用事を課題とし、研究1（開発時）、研究2（事前登録、30課題・540回）、研究3（事前登録、270回）で成功率と道具の呼び出し回数を比べた（抄録）。", "p5": "研究1では両者とも98.3%成功し、piの道具の呼び出しは約2倍だった。研究2では弱いモデルでpiの優位は広がらず（差の差−7.8ポイント、決着せず）、研究3ではClaude Codeとpiの成功率（43.3%対52.2%）は同等とも差があるとも示されなかった（抄録）。", "fun": "AIエージェントの失敗は、頭脳であるモデルのせいなのか、それを動かす仕組みのせいなのか。この研究は頭脳を同じにして仕組みだけを替えて比べました。結果は「差があるとも同じとも言えない」が多く、はっきりした結論には多くの試行が必要だと分かります。公平な比較の難しさそのものが見える点が面白いところです。", "unverified": "本文を入手できず、課題の具体例、成功の判定基準、採点の誤りを直した件数は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "LLMが作った知識グラフは出典にどこまで支持されるか", "title": "What an LLM-built knowledge graph keeps, and what a repair pass against its sources changes", "url": "https://doi.org/10.5281/zenodo.24046281", "authors": "Busnello, Luiz Antonio", "venue": "Zenodo", "date": "2026-11-08", "apa": "Busnello, L. A. (2026). What an LLM-built knowledge graph keeps, and what a repair pass against its sources changes (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24046281", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMが文書から抽出した知識グラフの関係のうち引用元の文が支持するものは約9割で、モデルに読み直させる修復処理は適合率を上げる一方、正しい関係も書き換えてしまうことを示した（抄録）。", "p3": "同じ300件の関係の無作為標本で2つの事前登録研究を行った。異なる系統の2つのLLM審査員、引用の実在の確認、173件の盲検の人手判定で支持の割合を測り、claude-opus-5-5による修復処理（保持・書き換え・削除）の前後を比べた（抄録）。", "p5": "支持された関係は0.913（274/300）で、修復後に残った関係の適合率は0.990に上がった（+7.6ポイント）。ただし改善の多くはどれを残したかによるもので、既に正しかった274件のうち87件を書き換え、元のまま残ったのは0.650だった。人と審査員の一致は低かった（κ=0.155）（抄録）。", "fun": "AIに自分の作ったメモを見直させると、間違いは減ります。ところがこの研究では、正しかったメモまで3割以上書き換えてしまい、別の項目どうしの関係に変わった例も30件ありました。正確さの点数だけを見ると良くなったように見えても、元の事実がどれだけ残ったかも測らないと危ない、という教訓が面白いところです。", "unverified": "標本・修復結果・人手の判定は非公開で、どのような関係が書き換えられたかの具体例は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "多様性が業績を高めるという主張の根拠を再検討", "title": "Diversity in Organisations: Why Inclusion Drives Performance - An Evidence Synthesis", "url": "https://doi.org/10.5281/zenodo.24051784", "authors": "Arulraj, Aarthi", "venue": "Zenodo", "date": "2026-11-08", "apa": "Arulraj, A. (2026). Diversity in Organisations: Why Inclusion Drives Performance - An Evidence Synthesis. Zenodo. https://doi.org/10.5281/ZENODO.24051784", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "多様性が業績を高めるという企業向け研究（McKinsey、BCG、Gallup）と査読研究・批判を突き合わせ、擁護できる主張は「多様性は良い判断の材料を与え、包摂がそれを業績に変える」という狭いものだと論じた（抄録）。", "p3": "McKinseyの2015〜2023年の4つの研究、BCGの約1,700社の研究、Gallupの事業単位の研究を、仕組みに関する査読文献や見出しの主張への批判と比べる文献統合を行った（抄録）。", "p5": "McKinseyの2023年のデータ（23か国1,265社）では、経営陣の性別・民族の多様性が上位4分の1の企業は下位より財務成績で上回る確率がそれぞれ39%高く、BCGでは多様性が平均以上の企業の革新による収益の割合が45%（平均未満は26%）だった。一方で主要な研究は相関にとどまり、追試の失敗や小さく文脈依存の効果を示すメタ分析もある（抄録）。", "fun": "「多様な会社ほどもうかる」という話はよく聞きますが、その根拠の多くは相関で、追試で再現できなかった例もあります。この論文は、人がいろいろいるだけでは足りず、違う意見が実際に口に出され使われる雰囲気（包摂）があって初めて成果になると整理しました。数字の見出しと、その裏の証拠の強さを分けて読む練習になる点が面白いところです。", "unverified": "本文を入手できず、取り上げた追試とメタ分析の具体的な文献と効果の大きさは未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "ゲーム化はブレンド型授業で学力への効果が最大", "title": "Relative Effectiveness of Gamified Instructional Delivery Modes and Design Components on Student Academic Achievement: A Bayesian Network and Component Network Meta-Analysis", "url": "https://doi.org/10.35542/osf.io/f93ze", "authors": "Zerrin Dagli ほか", "venue": "EdArXiv", "date": "2026-11-07", "apa": "Dagli, Z., & Sancar-Tokmak, H. (2026). Relative Effectiveness of Gamified Instructional Delivery Modes and Design Components on Student Academic Achievement: A Bayesian Network and Component Network Meta-Analysis. https://doi.org/10.35542/osf.io/f93ze", "why": "146研究（14,979人、177比較）のベイズ型ネットワーク・メタ分析で、ゲーム化した授業の提供形態を比べ、対面とオンラインを組み合わせたブレンド型が最も効果が大きい（g=1.06）ことを示した。構成要素ネットワーク・メタ分析で、感覚的な要素は一貫して正、物語は負の傾向など、設計要素ごとの効果も推定した。", "explain": {"basis": "抄録", "basis_note": "EdArXiv（OSF）の抄録を使用（本文は入手できず）", "preprint": true, "p1": "教育のゲーム化（ゲーミフィケーション）が学力に与える効果を、授業の提供形態（対面・ブレンド・オンライン）と設計要素に分けて比べるベイズ型ネットワーク・メタ分析で、ゲーム化したブレンド型授業が最も効果が大きいという序列を示した（抄録）。", "p2": "ゲーム化の学力への効果は研究ごとに大きくばらつくが、提供形態と設計要素の役割は十分に調べられていなかった（抄録）。背景：ネットワーク・メタ分析は、直接比べられていない条件どうしも共通の比較対象を介して間接的に比べる統合の方法。", "p3": "PRISMA-NMAに従い、ゲーム化と非ゲーム化を比べた146研究（2013〜2025年、14,979人、177比較、極端な外れ値1研究を除外）をベイズ型ネットワーク・メタ分析で統合し、設計要素（感覚、協力、時間の圧力、物語、偶然など）ごとの効果を構成要素ネットワーク・メタ分析で推定した（抄録）。", "p4": "効果はヘッジズのg（95%信用区間）と、順位の確からしさを表すSUCRAで示し、確実性はCINeMAで評価し、感度分析で順位の頑健性を確かめた（抄録）。", "p5": "ゲーム化したブレンド型（g=1.06、95%CrI 0.529〜1.593、SUCRA 0.933）が最も効果が大きく、ゲーム化した対面型（g=0.74）が続いた。ゲーム化しない形態どうしには信頼できる差がなかった。感覚の要素は形態を通じて安定して正、物語は学力を下げる傾向、偶然は対面型で負だった。要素×形態の交互作用は異質性の10.2%を説明した（抄録）。", "p6": "異質性が高く、CINeMAの確実性は「非常に低い」と評価された。偶然の要素の形態間の差はデータが少ない中での探索的な所見と著者は述べる（抄録）。本文は入手できず、未査読のプレプリント。", "fun": "授業をゲームのようにすると成績が上がるのか。答えは「どんな授業で、どんなゲーム要素を使うか」によるようです。146の研究をまとめると、対面とオンラインを組み合わせた授業にゲーム要素を入れたときが最も効果的で、物語仕立ては逆に成績を下げる傾向がありました。運まかせの要素も対面では逆効果だったという点が面白いところです。", "unverified": "本文を入手できず、設計要素の定義と分類、各研究の対象（学年・教科）の内訳は未確認。"}}, {"id": "pn02", "rank": 2, "field": "経営学", "headline": "コロナ後の事業転換は多すぎても少なすぎても不利", "title": "Pivoting Enough, Not Too Much: Entrepreneurial Drive, Political Skill, and Post-Pandemic Venture Performance in South America", "url": "https://doi.org/10.31235/osf.io/e5du6", "authors": "Carlos Martínez ほか", "venue": "SocArXiv", "date": "2026-11-07", "apa": "Martínez, C., Santos, K. A., & Giménez, J. (2026). Pivoting Enough, Not Too Much: Entrepreneurial Drive, Political Skill, and Post-Pandemic Venture Performance in South America. https://doi.org/10.31235/osf.io/e5du6", "why": "南米5か国の新興企業500社の調査で、創業者の起業家的意欲は業績と正に関連し、その関係は政治的スキルが高いほど強いこと、戦略的な事業転換（ピボット）と業績は逆U字の関係にあり、環境の変化が激しいほど最適な転換の水準が上がることを示した。", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）の本文PDF（方法・結果・結論の節）を読んだ", "preprint": true, "p1": "南米5か国の新興企業500社の調査データとして、創業者の起業家的意欲と業績の正の関係が政治的スキルで強まること、戦略的な事業転換（ピボット）と業績が逆U字の関係にあり、環境の変化が激しいほど最適な転換の水準が上がることを示した（抄録、結果）。", "p2": "新興市場の企業がコロナ禍のような体系的な衝撃の後にどう業績を回復するかについて、創業者の特性（上位層理論）と戦略的な適応（動的能力）を同時に扱い、「良いことも過ぎれば悪い」という論理を検証した研究は限られていた（抄録）。", "p3": "ブラジル160社、アルゼンチン・コロンビア各90社、チリ・ペルー各80社の創業2〜15年の企業の創業者に、7件法の尺度（意欲、政治的スキル、ピボット、環境の動態性、各4項目、α=.87〜.92）を尋ね、統制変数を入れた階層的回帰で、意欲×政治的スキルの交互作用、ピボットの2乗項、ピボット×動態性の交互作用を検定した（方法）。", "p4": "主な結果変数は2022年以降の主観的な業績（4項目、α=.83）で、頑健性として2022〜2025年の累積売上成長率、影響の大きい観測の除外、国でクラスタ化した標準誤差を確かめた（方法、結果）。", "p5": "統制変数だけのR²は.10、焦点の4変数を加えると.33になった。意欲の効果はb=0.22（p<.001）、意欲×政治的スキルはb=0.16で正だった。ピボットで業績が最大になる点は、動態性が低いとき5.40、平均で5.85、高いとき6.32と上がった（表3、図1）。売上成長率を使うと主効果は残ったが、2つの交互作用はp<.10の水準にとどまった（結果）。", "p6": "単一回答者の自己報告で共通方法バイアスを完全には排除できず、国のクラスタは5つしかないと著者は述べる（結果）。解釈：本文には標本の集め方や調査時期の記載が見当たらず、質問紙は英語で作られたと「想定される」と書かれ、結論は検定の方法を示す「雛形」を提供するとしているため、データが実際の調査か例示用かは本文から確認できなかった。未査読のプレプリント。", "fun": "危機のあとに事業の中身を変えること（ピボット）は大切ですが、変えすぎると強みまで失ってしまいます。この研究は、変える量と成果の関係が山なり（逆U字）になり、周りの変化が激しい業界ほど山の頂上が「たくさん変える」側にずれることを示しました。ちょうどよい変え方は環境しだいという考え方が面白いところです。ただし、データの集め方が本文から読み取れない点には注意が必要です。", "unverified": "標本の抽出方法・調査時期・倫理手続き（本文に記載が見当たらない）と、表1〜4の全ての数値は未確認。"}}, {"id": "pn03", "rank": 3, "field": "政治学", "headline": "ソマリア連邦の崩壊を支える政治的沈黙の文化", "title": "Restraint and Silence: Customary Conflict Resolution and the Erosion of Public Voice in Somali Federalism", "url": "https://doi.org/10.31235/osf.io/ur5y3", "authors": "Ismail H Warsame", "venue": "SocArXiv", "date": "2026-11-07", "apa": "Warsame, I. H. (2026). Restraint and Silence: Customary Conflict Resolution and the Erosion of Public Voice in Somali Federalism. https://doi.org/10.31235/osf.io/ur5y3", "why": "植民地期から現在の連邦体制までをたどり、慣習法（xeer）や長老会議など、不正を名指しして暴力を抑える伝統的な仕組みが国家レベルで衰え、違反を指摘すると大きな個人的代償を払う政治文化に置き換わったことが、連邦の行き詰まりの中心的な原因だと論じた。", "explain": {"basis": "抄録", "basis_note": "SocArXiv（OSF）の抄録を使用（本文は入手できず）", "preprint": true, "p1": "ソマリアの政治危機を、氏族の競争や外部介入、制度の弱さだけでなく、エリートと官僚の「政治的沈黙」と国の将来への人々の無関心から説明し、伝統的な紛争解決の仕組みの衰退が連邦の崩壊の中心的な原因だと論じた（抄録）。", "p2": "ソマリアの危機は通常、氏族の競争・外部の介入・制度の弱さで説明されるが、不正を名指しすることに高い個人的代償が伴う政治文化という要因は見過ごされてきた（抄録）。", "p3": "植民地期、シアド・バーレ政権期、1991年の国家崩壊、過去20年の連邦体制までの歴史をたどり、慣習法（xeer）、賠償金を払う集団（diya）、長老会議（guurti）、集会（shir）、遠回しな言い方の伝統などの紛争解決の実践を検討した。プントランドを中心事例、ソマリランドのボラマ会議を比較に用いた（抄録）。", "p4": "定量的な検証ではなく、歴史と事例にもとづく理論的な議論。政治的沈黙を3つの次元を持つ観察可能な現象として定義し、交渉に結びついた一時的な「戦略的沈黙」と、公益の侵害を名指ししない持続的な「市民的沈黙」を見分ける基準を示した（抄録）。", "p5": "ソマリ社会は不正を名指しし暴力を抑える有効な手段を長く持っていたが、それが国家レベルで衰え、違反を指摘すると大きな代償を払う文化に置き換わったことが連邦の行き詰まりの中心的な原因だと主張した。ハーシュマンの離脱・発言・忠誠の枠組みを、離脱が氏族とディアスポラを通じて生じる状況に拡張し、慣習的な抑制は紛争の解決に役立つ一方で、交渉から排除された人々の被害を隠しうると論じた（抄録）。", "p6": "抄録の範囲では、沈黙の測定や因果の検証の方法は示されていない。本文を入手できず、事例分析の資料や証拠の扱いは未確認。未査読のプレプリント。", "fun": "国がうまくいかない理由として争いや外国の介入はよく挙げられますが、この論文は「みんなが黙ってしまうこと」に注目します。ソマリアには、もめごとを話し合いで収め、悪いことを悪いと言う伝統的な仕組みがありました。それが国の政治では働かなくなり、声を上げると損をする空気が広がったことが混乱を長引かせているというのです。交渉のための沈黙と無関心の沈黙を区別する点が面白いところです。", "unverified": "本文を入手できず、プントランドとボラマの事例の具体的な分析と、沈黙の3つの次元の定義は未確認。"}}, {"id": "pn04", "rank": 4, "field": "政治学", "headline": "巨大SNSのリスク報告はジェンダー偽情報を見落とす", "title": "Patriarchal blind spots of risk management under technogarchy? Gendered disinformation as a systemic risk under the DSA", "url": "https://doi.org/10.31235/osf.io/38pvr", "authors": "Martha Stolze ほか", "venue": "SocArXiv", "date": "2026-11-07", "apa": "Stolze, M., Darius, P., Griffin, R., & Seiling, L. (2026). Patriarchal blind spots of risk management under technogarchy? Gendered disinformation as a systemic risk under the DSA. https://doi.org/10.31235/osf.io/38pvr", "why": "EUのデジタルサービス法（DSA）が巨大プラットフォームに求めるシステミック・リスク管理について、系統的文献レビューでジェンダー・性に関する偽情報がその対象に当たることを示し、X、TikTok、Instagram、Facebook、YouTubeのリスク報告がこれを十分に扱っていないことを明らかにした。", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）の本文PDF（方法、結果のRQ2、限界の節）を読んだ", "preprint": true, "p1": "EUのデジタルサービス法（DSA）が巨大プラットフォームに求めるシステミック・リスクの管理について、ジェンダー・性に関する偽情報（GenDis）がその対象に当たることを系統的文献レビューで示し、X・TikTok・Instagram・Facebook・YouTubeのリスク報告がこれを十分に扱っていないことを明らかにした（抄録）。", "p2": "ジェンダー偽情報は主に女性とLGBTQ+の人々を標的にし、政敵を黙らせ政治家や制度の正統性を損なうのに使われてきたが、それがDSAのシステミック・リスクに当たるか、プラットフォームがそれを認識しているかは体系的に調べられていなかった（抄録、方法）。", "p3": "2015年以降のSSCI・ESCI収録誌の論文をWeb of Scienceで検索し（112件）、2人の独立した符号化者が選別して（10件の二重符号化でκ≈0.78）52件を質的に符号化し、DSA第34条1項のリスク区分と照合した。さらに5つのプラットフォームの2023〜2025年のリスク報告を、3人の符号化者が関連語（偽情報、ジェンダー、LGBT+など）にもとづいて質的内容分析した（方法）。", "p4": "評価は、文献で特定されたリスクがDSAの区分に入るかの対応づけと、各社の報告での関連語の言及数と扱い方（表2）で行った（方法、結果）。", "p5": "文献から、ジェンダー偽情報に関わるリスクはDSAのシステミック・リスクの区分に当たると結論した（抄録）。報告では、TikTokが偽情報に比較的多くの注意を払い、候補者や生殖に関する誤情報を扱うなど最もGenDisに近かったが、性的指向に関わるリスクは明示していなかった。Facebook・Instagramはほぼ同一の報告で相対主義的な立場をとり、例示にジェンダーや性への言及はなかった（結果）。", "p6": "Web of Scienceの英語文献に限られ、用語の違う研究を見落とした可能性がある。リスク報告は実際のモデレーションの判断を示すものではなく、好意的に書かれがちである。探索的研究で因果の主張はしないと著者は述べる（限界）。未査読のプレプリント。", "fun": "ヨーロッパの法律は、巨大なSNSに「社会に害を与える危険」を自分で洗い出して報告するよう求めています。ところが、女性やLGBTQ+の人をおとしめる偽情報は研究で害が示されているのに、各社の報告書ではほとんど扱われていませんでした。報告書はふつう良く見せるように書かれるので、そこで抜け落ちていること自体が問題の大きさを示している、という読み方が面白いところです。", "unverified": "表2の各社・各年の言及数の値と、YouTubeとXの報告の扱いの詳細は読み切れておらず未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "質権ネットワークと世論文章で企業の債務不履行を予測", "title": "Graph convolutional network with dynamic gating LSTM improves corporate credit default prediction", "url": "https://doi.org/10.1038/s41598-026-79402-4", "authors": "Tingting Li ほか", "venue": "Scientific Reports", "date": "2026-11-07", "citescore": 6.4, "citescore_year": "2025", "apa": "Li, T., & Wu, Y. (2026). Graph convolutional network with dynamic gating LSTM improves corporate credit default prediction. Scientific Reports. https://doi.org/10.1038/s41598-026-79402-4", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr02", "rank": 2, "headline": "ベチバー草の根で雨季の斜面の水平変位が約 d": "jr13", "rank": 13, "headline": "脳の比喩で比べた人とLLMの発想の幅の違い", "title": "Brain metaphors generated by humans and large language models: Evidence from metaphor elicitation", "url": "https://doi.org/10.5755/j01.sal.1.48.43076", "authors": "Justina Urbonaitė ほか", "venue": "Studies about Languages", "date": "2026-11-06", "citescore": 0.6, "citescore_year": "2025", "apa": "Urbonaitė, J., & Shcherbino, Y. (2026). Brain metaphors generated by humans and large language models: Evidence from metaphor elicitation. Studies About Languages, (48), 5–19. https://doi.org/10.5755/j01.sal.1.48.43076", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr14", "rank": 14, "headline": "近所への信頼と社会参加が高齢者の口腔QOLと関連", "title": "Cognitive and Structural Social Capital as Determinants of Oral Health‐Related Quality of Life in Older Brazilians", "url": "https://doi.org/10.1111/ger.70134", "authors": "Fernanda Dalmolin de Camargo ほか", "venue": "Gerodontology", "date": "2026-11-06", "citescore": 4.7, "citescore_year": "2025", "apa": "de Camargo, F. D., Zamarchi, T. G., Júnior, O. L. d. A., Fagundes, M. L. B., & Giordani, J. M. d. A. (2026). Cognitive and Structural Social Capital as Determinants of Oral Health‐Related Quality of Life in Older Brazilians. Gerodontology. https://doi.org/10.1111/ger.70134", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr15", "rank": 15, "headline": "部分飽和土の波の分散を孔内の流体移動で説明", "title": "Wave‐Induced Fluid Flow Observations in Partially Saturated Unconsolidated Soils: Experiments and Modeling", "url": "https://doi.org/10.1029/2026jb034639", "authors": "Guillaume Flood‐Page ほか", "venue": "Journal of Geophysical Research: Solid Earth", "date": "2026-11-08", "sjr": 1.803, "citescore": 7.5, "citescore_year": "2025", "apa": "Flood‐Page, G., Solazzi, S., Boutonnier, L., & Pereira, J.-M. (2026). Wave‐Induced Fluid Flow Observations in Partially Saturated Unconsolidated Soils: Experiments and Modeling. Journal of Geophysical Research: Solid Earth, 131(11). https://doi.org/10.1029/2026jb034639", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr16", "rank": 16, "headline": "テクノストレスが業績を高めるテクノ・ユーストレス", "title": "PREDICTING OFFICE WORKERS' PERFORMANCE THROUGH TECHNOSTRESS AND SELF-EFFICACY: A STRUCTURAL EQUATION MODELING APPROACH", "url": "https://doi.org/10.70248/jmie.v4i1.4563", "authors": "Siti Fatimah ほか", "venue": "Journal of Management and Innovation Entrepreneurship (JMIE)", "date": "2026-11-08", "apa": "Fatimah, S., Anggi Pasca Arnu, & Ina Ratnasari. (2026). PREDICTING OFFICE WORKERS’ PERFORMANCE THROUGH TECHNOSTRESS AND SELF-EFFICACY: A STRUCTURAL EQUATION MODELING APPROACH. Journal of Management and Innovation Entrepreneurship (JMIE), 4(1), 110–121. https://doi.org/10.70248/jmie.v4i1.4563", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "デジタル技術に伴うテクノストレスが、扱える挑戦と受け止められれば業績を高めうる（テクノ・ユーストレス）ことを、ジャカルタの若い事務職で示した（抄録）。", "p3": "南ジャカルタでデジタル技術を日常的に使う18〜35歳の280人に28項目の5件法の質問紙を実施し、PLS-SEMでテクノストレスと自己効力感から業績を予測した（外部負荷0.485の指標を1つ除外）（抄録）。", "p5": "モデルは業績の分散の60.4%を説明し、テクノストレスと自己効力感はどちらも業績と正に有意に関連した。横断・自己報告の設計のため因果や共通方法バイアス、逆U字の効果は確認できないと著者は述べる（抄録）。", "fun": "ストレスは悪者と思われがちですが、適度な緊張はやる気を引き出すこともあります（よいストレスを「ユーストレス」と呼びます）。この調査では、デジタル機器の負担を感じている人ほど成績の自己評価が高いという、一見逆の結果が出ました。ただし同じ人がすべてを自己申告した一回の調査なので、原因と結果は分からない点に注意が必要です。", "unverified": "本文を入手できず、テクノストレスの下位次元ごとの結果と各経路の係数の値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "多様な規範を保ちつつ一貫性も求めるLLMの論理", "title": "Logic for Interactive Consistency: Paraconsistency, Norms, and Accountable Large Language Models", "url": "https://doi.org/10.1609/aaaiss.v10i1.43385", "authors": "Thomas Arnold ほか", "venue": "Proceedings of the AAAI Symposium Series", "date": "2026-11-06", "apa": "Arnold, T., & Scheutz, M. (2026). Logic for Interactive Consistency: Paraconsistency, Norms, and Accountable Large Language Models. Proceedings of the AAAI Symposium Series, 10(1), 10–17. https://doi.org/10.1609/aaaiss.v10i1.43385", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "AIの価値整合で多様な信念体系を尊重するために矛盾許容（パラコンシステント）論理が注目されるなか、人とAIの協働では古典論理の一貫性（否定の使用）を保つことも重要だとして、LLMをより強い論理的基準で評価する立場を示した（抄録）。", "p3": "多数派の見解に収束させる合意フィルタ（Constitutional AIの例）の問題を出発点に、自然言語での指示と協調という実時間の課題を検討する理論的な論考（抄録）。", "p5": "矛盾許容論理が整合手法の弱点を示すことは認めつつ、それと必ずしも対立しない補完的な立場として、生成AI・エージェントAIに論理的な説明責任を求める基準を提案した。実証的な評価は含まれない（抄録）。", "fun": "人によって正しいと思うことは違うので、AIに多数決の答えだけを言わせると少数の考えが消えてしまいます。そこで矛盾した考えも同時に扱える論理が注目されていますが、この論文は、一緒に作業する場面では「AとAでないことを同時に言わない」という昔ながらの一貫性も必要だと指摘します。多様性と筋の通り方の両立という難問が面白いところです。", "unverified": "本文を入手できず、提案する論理的基準の具体的な形と適用例は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "説明可能な積み上げ学習で消費者の債務不履行を予測", "title": "A Hybrid Explainable Stacking Ensemble Model for Consumer Credit Default Prediction", "url": "https://journal.zetech.ac.ke/zjbt/article/view/50", "authors": "Brian Odhiambo Ouma ほか", "venue": "Zetech Journal of Business and Technology", "date": "2026-11-05", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "消費者信用の債務不履行予測で、精度と個々の判断の説明を両立させる積み上げ（スタッキング）学習を設計し、公開データで10の構成と比べた（抄録）。", "p3": "Home Credit Default Riskの307,511件（不履行率8.07%）を同じ分割で学習・評価し、ロジスティック回帰・ガウス型ナイーブベイズ・CatBoostをロジスティック回帰のメタ学習器で束ねた（抄録）。", "p5": "提案法は評価用データでAUC 0.7492と10構成の中で最も高く、4つの基準手法に対する優位は分散の補正と多重比較の調整後も有意だった。寄与の順位は部分標本間で安定し（順位相関0.9662）、合成オーバーサンプリングは全ての学習器でAUCを最大0.0503下げた（抄録）。", "fun": "お金を貸す会社は、返せない人を見分けるだけでなく、なぜ断ったのかを説明する必要があります。この研究は、精度の高い複雑なモデルと説明しやすい単純なモデルを組み合わせました。さらに、少ない「返せなかった人」のデータを人工的に増やす定番の工夫が、かえって予測を悪くしたという発見が面白いところです。", "unverified": "本文を入手できず、説明に使った寄与の計算法と、性別を除いたときの公平性指標の数値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "鉄道サービスの一貫性が乗客の満足を左右する", "title": "Service Consistency and Passenger Satisfaction on Tanzania’s Standard Gauge Railway: Evidence from the Dar es Salaam–Morogoro Route", "url": "https://doi.org/10.18535/sshj.v10i11.2647", "authors": "Lydia Gerald Maregesi ほか", "venue": "Social Science and Humanities Journal", "date": "2026-11-08", "apa": "Maregesi, L. G., & Mwendapole, M. J. (2026). Service Consistency and Passenger Satisfaction on Tanzania’s Standard Gauge Railway: Evidence from the Dar es Salaam–Morogoro Route. Social Science and Humanities Journal, 10(11), 10736–10745. https://doi.org/10.18535/sshj.v10i11.2647", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "タンザニアの標準軌鉄道（ダルエスサラーム–モロゴロ間）で、移動時間の予測しやすさや手続きの統一などサービスの一貫性が、定時性や運行の信頼性とは別に乗客の満足と結びつくことを示した（抄録）。", "p3": "乗客292人の質問紙調査と、運行・駅・顧客対応の職員への半構造化面接を組み合わせた混合研究法で、相関・重回帰と主題分析を行った（抄録）。", "p5": "サービスの一貫性と満足は正に相関し（r=0.552）、定時性・運行の信頼性・運行情報の信頼性を考慮しても有意な関連が残った（β=0.210）。面接では、統一された手続きと駅・運行日間の調整が信頼できる体験につながると語られた（抄録）。", "fun": "電車が時間どおりに来ることと、毎回同じように乗れることは、似ているようで別の話です。この研究は、切符の買い方や乗車の手順が日によって変わらないこと自体が、乗客の満足と結びついていることを示しました。「いつも同じ」が安心を生むという、サービスの基本を数字で確かめた点が面白いところです。", "unverified": "本文を入手できず、重回帰の他の説明変数の係数とモデル全体の説明力は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "配送の速さと社会的証明が顧客満足に効く仕組み", "title": "SERVICE QUALITY AND DELIVERY SPEED ON CUSTOMER SATISFACTION: THE MODERATING ROLE OF SOCIAL PROOF IN RETAIL REWARD APPLICATIONS", "url": "https://doi.org/10.70248/jmie.v4i1.4459", "authors": "Intan Indah Wahyuningsih ほか", "venue": "Journal of Management and Innovation Entrepreneurship (JMIE)", "date": "2026-11-08", "apa": "Indah Wahyuningsih, I., Lestari, N. W. F. A., & Mualif Ismail. (2026). SERVICE QUALITY AND DELIVERY SPEED ON CUSTOMER SATISFACTION: THE MODERATING ROLE OF SOCIAL PROOF IN RETAIL REWARD APPLICATIONS. Journal of Management and Innovation Entrepreneurship (JMIE), 4(1), 388–405. https://doi.org/10.70248/jmie.v4i1.4459", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "オムニチャネル小売の会員アプリで、サービス品質と配送の速さが顧客満足を高め、口コミなどの社会的証明がその2つの効果を逆向きに調整することを示した（抄録）。", "p3": "目的抽出による170人の回答をPLS-SEM（2段階法）で分析し、社会的証明の調整効果を検証した（抄録）。", "p5": "サービス品質（β=0.244）と配送速度（β=0.321）はともに満足に正に効き、配送速度が最も強かった。社会的証明はサービス品質の効果を強め（β=0.175）、配送速度の効果を弱めた（β=−0.298）。非確率抽出のため一般化には限界がある（抄録）。", "fun": "「みんなが良いと言っている」という情報（社会的証明）は、いつも満足を高めるわけではないようです。この調査では、評判はサービスの質の良さをより強く感じさせる一方で、配送の速さのありがたみは薄める方向に働きました。同じ口コミでも、何を評価するかで効き方が逆になるという点が面白いところです。", "unverified": "本文を入手できず、社会的証明の測り方と、調整効果の図示（単純傾斜の分析）は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "コペンハーゲンに学ぶ途上国の持続可能な都市交通", "title": "A Built Environment Framework for Sustainable Urban Transport in Developing Countries: Lessons From Copenhagen", "url": "https://doi.org/10.65800/2090-9934.1065", "authors": "Nassamat Mahdy Mohamed ほか", "venue": "HBRC Journal", "date": "2026-11-06", "citescore": 2.0, "citescore_year": "2025", "apa": "Mohamed, N. M., Zayed, M. A., & Barmelgy, I. M. E. (2026). A Built Environment Framework for Sustainable Urban Transport in Developing Countries: Lessons From Copenhagen. HBRC Journal, 22(1). https://doi.org/10.65800/2090-9934.1065", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "途上国の持続可能な都市交通のために、世界の交通戦略とコペンハーゲンの施策を建築環境の7つの次元（7D）で整理し、現地の制約に合わせて施策を選べる枠組みを提案した（抄録）。", "p3": "第1段階で主要な都市交通戦略8件を質的内容分析して7Dに沿う原則を抽出し、第2段階でコペンハーゲンの61の施策の影響を層・空間規模別に評価する行列を作った（抄録）。", "p5": "施策の設計と組み合わせ方を特徴づける5原則（包括性・統合性・適応性・連続性・接続性）を示し、途上国との違いに対応するため施策を適応のしやすさと実施時期で分類した（抄録）。", "fun": "自転車の街として有名なコペンハーゲンをそのまま真似しても、お金や制度の条件が違う国ではうまくいきません。この研究は、61の施策を「どこでも使えるか」「どれくらい時間がかかるか」で仕分けし、まねできる順番を考えました。成功例を分解して移植しやすくする発想が面白いところです。", "unverified": "本文を入手できず、61施策の評価の基準と、7Dのどの次元に施策が偏っていたかは未確認。"}}, {"id": "jr22", "rank": 22, "headline": "ボゴタの交通インフラと都市経済の関係を概観", "title": "Moving Bogotá: Transit Infrastructure and Economic Development in Colombia’s Capital", "url": "https://doi.org/10.33423/wt272714", "authors": "Andrew F. Johnson ほか", "venue": "Journal of Applied Business and Economics", "date": "2026-11-08", "apa": "Johnson, A. F., & Karst, R. V. (2026). Moving Bogotá: Transit Infrastructure and Economic Development in Colombia’s Capital. Journal of Applied Business and Economics, 28(8). https://doi.org/10.33423/wt272714", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "コロンビアの首都ボゴタを例に、交通インフラが都市の経済発展と交易にどう関わるかを、BRT（TransMilenio）と遅れている地下鉄計画を中心に概観した論考（抄録）。", "p3": "都市の地理・経済の背景、主要な交通システム、交通混雑が生産性と交易に与える悪影響を整理する記述的な分析（抄録）。", "p5": "ボゴタは世界でも最も深刻な交通混雑に苦しみ大きな経済的費用を負っており、長期的な経済の持続性と国際競争力のために交通インフラの改善が不可欠だと結論づけた。定量的な推定は抄録には示されていない（抄録）。", "fun": "渋滞は時間の無駄だけでなく、街全体の稼ぐ力を下げます。ボゴタは専用車線を走るバス（BRT）で知られますが、地下鉄の計画は長く遅れてきました。交通網の整備が都市の経済にとってどれほど重要かを、一つの都市の歩みから考えられる点が面白いところです。", "unverified": "本文を入手できず、混雑の経済的費用の推定値や地下鉄計画の財源の議論は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "砂とFRPの境界面の繰返しせん断は粗さで変わる", "title": "Effect of Surface Roughness on the Cyclic Shear Behavior of Sand-FRP Interface", "url": "https://doi.org/10.1139/cgj-2026-0863", "authors": "Jing-Cheng Teng ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-07", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Teng, J.-C., Yang, J., Ling, J.-H., & Lou, K. (2026). Effect of Surface Roughness on the Cyclic Shear Behavior of Sand-FRP Interface. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0863", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "砂とFRP（繊維強化樹脂）板の境界面では、表面の粗さが大きいほどピーク抵抗・ダイレイタンシー・繰返し剛性が大きくなる一方、摩耗で保持される抵抗が減ることを実験で示した（抄録）。", "p3": "最大粗さ0・0.2・0.4・1.2 mmの溝付きFRP板と乾燥砂で、相対密度60%・90%の単調せん断と、密な試料での片振幅2.5 mm・50サイクルの変位制御の繰返しせん断（垂直応力200・400 kPa）を行い、3次元光学スキャンで表面の変化を測った（抄録）。", "p5": "粗さを0から1.2 mmにするとピークの境界面摩擦角が緩い砂で76.6%、密な砂で88.4%増えた。粗い境界面ほどせん断抵抗を保つが収縮が累積し、減衰比は低かった。同じ溝形状では鋼よりFRPの初期抵抗が大きいが、摩耗で保持抵抗が下がった（抄録）。", "fun": "ざらざらした面ほど砂は滑りにくくなりますが、FRPは鋼より柔らかいので、何度もこすれるうちに表面のでこぼこがすり減ってしまいます。この実験では、最初は鋼より強く砂をつかむFRPが、摩耗で踏ん張りを失っていく様子を測りました。「最初の強さ」と「長く使ったあとの強さ」が違うという、材料選びの落とし穴が見える点が面白いところです。", "unverified": "本文を入手できず、サイクル数に伴う剛性・減衰の変化の詳細と摩耗量の定量値は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "ブランドの乗り換えを不満が促し忠誠心が抑える", "title": "Navigating Brand Switching: The Moderating Role of Switching Costs on Brand Loyalty and Customer Dissatisfaction", "url": "https://ecbis.net/index.php/go/article/view/632", "authors": "Isna Ma'rifatul Hidayati ほか", "venue": "Economics and Business Journal (ECBIS)", "date": "2026-11-05", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ブランドの乗り換え（スイッチング）について、ブランドへの忠誠心が乗り換えを抑え、顧客の不満が促すことを、インドネシア中部ジャワの消費者で示した（抄録）。", "p3": "消費財・サービスでブランドを乗り換えた経験のある200人の回答を、信頼性・妥当性の確認、探索的因子分析、相関分析、重回帰で分析した（抄録）。", "p5": "忠誠心は乗り換えに負に（β=−0.382）、不満は正に（β=0.476）有意に効き、2つで乗り換えの分散の52.4%を説明した。題名にあるスイッチングコストなど他の要因は今後の課題とされている（抄録）。", "fun": "お気に入りのお店があっても、嫌な思いをすると人は別のお店に移ります。この調査は「好き」という引き留める力と「不満」という押し出す力を同時に測り、押し出す力の方がやや大きいことを示しました。ただし題名にある乗り換えの手間（スイッチングコスト）の効果は抄録では検証されておらず、題名と中身を見比べて読む大切さも分かります。", "unverified": "本文を入手できず、題名にあるスイッチングコストの調整効果が本文で検証されているかは未確認。"}}, {"id": "jr25", "rank": 25, "headline": "デジタル会計システムが公的財政の透明性を高める条件", "title": "Institutional conditions shaping digital accounting systems and public sector financial transparency", "url": "https://doi.org/10.1007/s43621-026-05227-w", "authors": "Abdullahi Sharif Nor ほか", "venue": "Discover Sustainability", "date": "2026-11-07", "citescore": 3.3, "citescore_year": "2025", "apa": "Nor, A. S., & Awale, A. A. (2026). Institutional conditions shaping digital accounting systems and public sector financial transparency. Discover Sustainability. https://doi.org/10.1007/s43621-026-05227-w", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "デジタル会計システム（ERP、IFMIS、XBRL、ブロックチェーンなど）が公的部門の財政の透明性を高める条件と障壁を系統的レビューで整理し、「開示は増えても説明責任は伴わない」という透明性の逆説の枠組みを示した（抄録）。", "p3": "PRISMA 2020に従い、2020〜2025年の英語のオープンアクセス文献をScopusで検索し（12,307件）、全文評価の68報から30研究を選んで物語的な主題統合を行った（抄録）。", "p5": "デジタル化は財政情報の入手しやすさ・適時性・追跡可能性・標準化・信頼性の向上と関連したが、その関連はガバナンスの質、サイバーセキュリティ、基盤、技術力、組織の準備、データ品質の管理に左右された。証拠は観察研究が中心で因果は示せない（抄録）。", "fun": "役所の会計をデジタル化して公開すれば、税金の使い道がよく見えるようになりそうです。しかしこのレビューは、データが不正確だったり、使いにくかったり、誰も点検しなかったりすれば、見えているようで責任は果たされないと指摘します。「見える化」と「正せる化」は別物だという指摘が面白いところです。", "unverified": "本文を入手できず、30研究の国・制度の内訳と、各条件の重要度の比較は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "ホームレス状態の人の健康と受療の壁を多視点で探る", "title": "Experiences of health, care access, and recovery in people experiencing homelessness: a multi-perspective qualitative study", "url": "https://doi.org/10.1007/s10389-026-02920-y", "authors": "Sandra León-Herrera ほか", "venue": "Journal of Public Health", "date": "2026-11-06", "citescore": 5.3, "citescore_year": "2025", "apa": "León-Herrera, S., Rodríguez-Pérez, M. P., Vicente-García, C., Lamiquiz, I., Tomey-Guillén, C., Asensio-Martínez, Á., García-Mosquera, D., Alconchel-Valero, L., Domínguez-García, M., & Oliván-Blázquez, B. (2026). Experiences of health, care access, and recovery in people experiencing homelessness: a multi-perspective qualitative study. Journal of Public Health. https://doi.org/10.1007/s10389-026-02920-y", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "スペイン・サラゴサで、ホームレス状態の人・経験者・保健福祉の専門職の視点から、ホームレス状態が心身と社会的な健康に与える影響、受療の障壁、効果的な支援を明らかにした（抄録）。", "p3": "目的抽出による27人（当事者11人、経験者7人、専門職9人）への半構造化面接を主題分析した質的研究（抄録）。", "p5": "抑うつ・不安・自殺念慮・孤独など精神的な健康の問題が大きく、受療の障壁として手続きの要件、書類の欠如、デジタルからの排除、長い待ち時間、偏見・差別が挙げられた。多職種のケア、継続的な心理支援、地域での介入、安定した住まいと個別の心理社会的支援の組み合わせが鍵とされた（抄録）。", "fun": "病院に行けばよいと思うかもしれませんが、住所や身分証がない、予約がネットだけ、という壁で医療から遠ざけられる人がいます。この研究は、当事者だけでなく、元当事者と支援する専門職の3つの立場から話を聞きました。同じ問題を違う立場から見ることで、制度のすき間が浮かび上がる点が面白いところです。", "unverified": "本文を入手できず、立場ごとの語りの違いと、主題の詳細な構造は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "CNNと勾配ブースティングで路面の穴や段差を検出", "title": "Deep Learning based Smart Driver Assistance System for Automated Detection of Road Anomalies", "url": "https://doi.org/10.2174/0122103279521841261018043554", "authors": "Arnav Sharma ほか", "venue": "International Journal of Sensors, Wireless Communications and Control", "date": "2026-11-06", "citescore": 2.8, "citescore_year": "2025", "apa": "Sharma, A., Singh, T., Singh, K., Sharma, A., & Singh, H. (2026). Deep Learning based Smart Driver Assistance System for Automated Detection of Road Anomalies. International Journal of Sensors, Wireless Communications and Control, 16. https://doi.org/10.2174/0122103279521841261018043554", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "路面のひび・くぼみ（ポットホール）・段差を画像から検出する、パラメータ約23万個の小さなCNNを設計し、組み込み型の運転支援装置で使える精度と軽さを示した（抄録）。", "p3": "13層のCNNを端から端までの分類器として、また512次元の特徴を勾配ブースティングやランダムフォレストなどに渡す特徴抽出器として使い、4つの公開画像データセット（256×256に整形、SMOTEで均衡化）で評価した（抄録）。", "p5": "ひびとくぼみの2クラス分類で正解率99.00%・F1値98.98%、段差を加えた3クラスで正解率97.67%を得た。パラメータ数は比較した既存の骨格網より1〜3桁少ない。評価は公開画像のオフラインに限られ、路上での検証はまだである（抄録）。", "fun": "道路の穴を車が自動で見つけられれば、事故やタイヤの傷みを防げます。ただし車に載せるコンピュータは小さく、巨大なAIは動かせません。この研究は、部品（パラメータ）の数を既存のAIより1〜3桁減らしても高い精度を保てることを示しました。実際の道路での試験はこれからという点も含めて、実用化への距離が見える点が面白いところです。", "unverified": "本文を入手できず、データセット間で画像が重複していないかと、計算時間の実測値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "ソマリアの顧客はAI接客をどう評価しているか", "title": "Customer perceptions of artificial intelligence in enhancing customer service: The case of Somalia's service industry", "url": "https://doi.org/10.31893/multirev.2027198", "authors": "Abdifatah Nour Rage", "venue": "Multidisciplinary Reviews", "date": "2026-11-08", "citescore": 1.4, "citescore_year": "2025", "apa": "Rage, A. N. (2026). Customer perceptions of artificial intelligence in enhancing customer service: The case of Somalia’s service industry. Multidisciplinary Reviews, 10(4), 2027198. https://doi.org/10.31893/multirev.2027198", "them .648〜0.663に入った（SSRN版の抄録）。", "fun": "建物のセンサの記録には、たまたま大きく外れた値（雑音）と、地震で本当に壊れたことによる変化が混ざります。前者は一瞬で消え、後者はずっと続くという違いに目をつけ、「ずれが続くかどうか」で両者を見分けたのがこの方法です。実大7階建ての振動台実験でも、地震後の硬さを独立な基準とほぼ同じ値で推定できた点が面白いところです。", "unverified": "出版社の抄録・本文を入手できず、SSRN版と出版版の内容の違いと、損傷の時間追従の図は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "気候変動下の洗掘で橋の安定性を確率的に評価", "title": "A stochastic framework to investigate the stability of bridges subjected to local scour under a changing climate", "url": "https://doi.org/10.1016/j.strusafe.2026.102788", "authors": "Bassel Habeeb ほか", "venue": "Structural Safety", "date": "2026-11-07", "sjr": 1.544, "citescore": 12.4, "citescore_year": "2025", "apa": "Habeeb, B., Imam, B., Liberge, E., Padgett, J. E., & Bastidas-Arteaga, E. (2026). A stochastic framework to investigate the stability of bridges subjected to local scour under a changing climate. Structural Safety, 102788. https://doi.org/10.1016/j.strusafe.2026.102788", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、気候変動の下での局所洗掘（橋脚まわりの河床が流れで削られる現象）を受ける橋の安定性を、確率的な枠組みで調べる研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "川の中に立つ橋脚のまわりは、流れで砂が削られて穴（洗掘）ができ、ひどくなると橋が傾いたり倒れたりします。気候変動で大雨が増えると洪水の強さも変わるため、将来の危険を確率で見積もる必要があります。変わりゆく気候の下で橋の安定性をどう評価するかという、未来の不確実さを扱う問いが面白いところです。", "unverified": "抄録・本文を入手できず、対象の橋・気候シナリオ・確率モデルの中身と結果はすべて未確認。"}}, {"id": "jr31", "rank": 31, "headline": "銀行の自主的なストレステスト開示の文章が語る情報", "title": "Do Banks’ Self-Reported Stress Test Disclosures Convey Critical Financial Information? A Textual Sentiment Analysis", "url": "https://doi.org/10.1007/s10693-026-00475-3", "authors": "Yi Zheng", "venue": "Journal of Financial Services Research", "date": "2026-11-06", "citescore": 4.8, "citescore_year": "2025", "apa": "Zheng, Y. (2026). Do Banks’ Self-Reported Stress Test Disclosures Convey Critical Financial Information? A Textual Sentiment Analysis. Journal of Financial Services Resea  https://doi.org/10.1007/s10035-026-01729-6", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、高い動水勾配の下で砂質土の内部侵食（細かい粒子が水流で運び出される現象）の様式が粒度分布でどう変わるかを、実験とCFD–DEM（流体計算と個別要素法の連成）で調べた研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "堤防やダムの土の中を水が流れると、細かい砂粒だけが少しずつ流し出され、気づかないうちに土の骨組みが弱っていくことがあります。どんな粒の大きさの組み合わせの土が侵食されやすいかが分かれば、決壊の予防につながります。目に見えない土の中の粒の動きを実験と計算の両方で追うという問いが面白いところです。", "unverified": "抄録・本文を入手できず、試料の粒度、動水勾配の条件、侵食様式の分類と結果はすべて未確認。"}}, {"id": "jr40", "rank": 40, "headline": "熱力学的に整合した位相場モデルで岩のクリープ破壊", "title": "A thermodynamically consistent phase-field model for creep fracture in rock materials", "url": "https://doi.org/10.1016/j.compgeo.2026.108808", "authors": "Bin Xu ほか", "venue": "Computers and Geotechnics", "date": "2026-11-08", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Xu, B., Xu, T., Pijaudier-Cabot, G., Xue, Y., & Xu, W. (2027). A thermodynamically consistent phase-field model for creep fracture in rock materials. Computers and Geotechnics, 203, 108808. https://doi.org/10.1016/j.compgeo.2026.108808", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、岩石材料のクリープ破壊（一定の荷重の下で時間とともに進む破壊）を、熱力学と矛盾しない位相場（フェーズフィールド）モデルで表す研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "岩は一瞬で割れるだけでなく、重さがかかり続けると何年もかけてじわじわと壊れていくことがあります。位相場モデルは、ひびを「壊れ具合」を表すなめらかな場として扱い、ひびの枝分かれや進み方を計算しやすくする方法です。時間とともに進む壊れ方を、エネルギーの収支と矛盾なく表すという問いが面白いところです。", "unverified": "抄録・本文を入手できず、モデルの式、検証に使った実験、結果はすべて未確認。"}}, {"id": "jr41", "rank": 41, "headline": "障害のある従業員は職場の社会的資源をどう作るか", "title": "Strategies in the face of ableism: how disabled employees craft social resources at work", "url": "https://doi.org/10.1080/09687599.2026.2755795", "authors": "Sophie Teborg ほか", "venue": "Disability and Society", "date": "2026-1
