on of flood disaster impacts from news reports with large language models", "url": "https://doi.org/10.1016/j.ijdrr.2026.106530", "authors": "Carlo Guzzon ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-07", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "apa": "Guzzon, C., Marinelli, D., Llasat, M. C., Llasat-Botija, M., Guilera, A. D., Corbella, L. E., & Matamoros, R. M. (2026). Extraction and validation of flood disaster impacts from news reports with large language models. International Journal of Disaster Risk Reduction, 106530. https://doi.org/10.1016/j.ijdrr.2026.106530", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "自然災害のニュース記事を、LLMの2段階の処理と規則にもとづく事象の統合で、位置情報つきの事象単位の被害記録に変換するパイプライン「News2Impact」を示した（抄録）。", "p3": "まず関連性の分類器が対象地域・災害種別の被害を報じる記事を選び、次の抽出モデルが統一した項目（被害の種類、確信度、説明、事象の要約）を埋める。規則ベースの事象検出器が個々の報告を事象にまとめ、二重計上と系統的な偏りを抑える（抄録）。", "p5": "スペインの洪水に適用し、2024年10月のバレンシアの事象で報道された死者数の推移を再構成し、数週間で公式の数に近づいた。カタルーニャでは手作業のデータベースのほぼ全ての事象を検出し、時期を精緻化し、未記録の洪水も見つけた（抄録）。", "fun": "災害の被害を地域ごとに細かく記録したデータは意外と少なく、新聞記事の中に埋もれています。この研究はAIに記事を読ませ、同じ洪水を報じた複数の記事を一つの出来事にまとめて、二重に数えないよう工夫しました。人の手ではとても読めない量の記事から、記録から漏れていた洪水まで見つけ出した点が面白いところです。", "unverified": "本文を入手できず、使ったLLMの種類、抽出の正解率、公式統計との差の大きさは未確認。"}}, {"id": "jr44", "rank": 44, "headline": "移動手段と好みの一致が生活満足に与える影響", "title": "Travel mode, preference alignment, and life satisfaction: A comparative study of consonant and dissonant travelers", "url": "https://doi.org/10.1016/j.trip.2026.102349", "authors": "Fatemeh Rashidi ほか", "venue": "Transportation Research Interdisciplinary Perspectives", "date": "2026-11-07", "sjr": 1.039, "citescore": 6.6, "citescore_year": "2025", "apa": "Rashidi, F., Kermanshah, A., & Kermanshah, M. (2026). Travel mode, preference alignment, and life satisfaction: A comparative study of consonant and dissonant travelers. Transportation Research Interdisciplinary Perspectives, 40, 102349. https://doi.org/10.1016/j.trip.2026.102349", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、好みの移動手段と実際に使う移動手段が一致する人（協和）と一致しない人（不協和）を比べ、移動手段と好みの一致が生活満足にどう関わるかを調べた研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "本当は自転車で通いたいのに車を使わざるを得ない人と、望みどおり車を使っている人では、毎日の満足感が違うかもしれません。同じ手段を使っていても、それが自分の選んだものかどうかで幸福感が変わるのか。移動の「手段」より「納得感」に注目する問いが面白いところです。", "unverified": "抄録・本文を入手できず、調査の地域・対象者・分析方法と結果はすべて未確認。"}}, {"id": "jr45", "rank": 45, "headline": "公共交通のサービス品質の知覚を構造方程式で分析", "title": "Perceived public transport service quality: A structural equation Modelling framework", "url": "https://doi.org/10.1016/j.cstp.2026.102024", "authors": "Filippo Gregori ほか", "venue": "Case Studies on Transport Policy", "date": "2026-11-07", "citescore": 6.1, "citescore_year": "2025", "apa": "Gregori, F., Benedetti, I., & Secondi, L. (2026). Perceived public transport service quality: A structural equation Modelling framework. Case Studies on Transport Policy, 102024. https://doi.org/10.1016/j.cstp.2026.102024", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "公共交通で目的の活動に行けるという知覚的なアクセシビリティを潜在変数とし、それを支える次元と政策で動かせる要因を特定する、他地域にも移せる構造方程式モデルの枠組みを示した（抄録）。", "p3": "移動時間・費用・定時性・快適さ・清潔さ・待ち環境・接続・頻度への利用者の評価で知覚的アクセシビリティを表し、分割した標本で探索的・確認的因子分析を行ったうえで共分散構造分析を行った。イタリアの全国代表の2023年「日常生活の諸側面」調査の個票で例示した（抄録）。", "p5": "知覚的な公共交通のアクセシビリティは、必要なサービスへの知覚的なアクセス、混雑・駐車や安全などの地域環境の認識、制度への信頼、心の健康と正に関連した（抄録）。", "fun": "駅やバス停が近くにあっても、「行きたいところに行ける」と感じられるかどうかは人によって違います。この研究は、時刻表どおりに来るか、待合所は快適かといった評価から、その「行ける感覚」を測りました。その感覚が、役所への信頼や心の健康ともつながっていたという点が面白いところです。", "unverified": "本文を入手できず、モデルの適合度と各経路の係数の値は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "移動の経験を計画の優先順位につなぐ共創型の交通計画", "title": "From mobility experiences to planning priorities: Co-creation embedded in peri-urban mobility planning", "url": "https://doi.org/10.1016/j.urbmob.2026.100315", "authors": "Õnne Kask ほか", "venue": "Journal of Urban Mobility", "date": "2026-11-07", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "apa": "Kask, Õ., Tuvikene, T., Sträuli, L., Ramezani, S., & Arts, J. (2026). From mobility experiences to planning priorities: Co-creation embedded in peri-urban mobility planning. Journal of Urban Mobility, 10, 100315. https://doi.org/10.1016/j.urbmob.2026.100315", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、都市近郊（ペリアーバン）の交通計画に共創（コ・クリエーション）の手続きを組み込み、住民の移動の経験を計画の優先順位に結びつける研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "都市のはずれに住む人は、バスが少ない、駅まで遠いなど、中心部とは違う移動の悩みを抱えています。計画を作る側がその経験をどう聞き取り、何を先にやるかの順番に反映させるのか。住民と一緒に計画を作るとき、声をどう「優先順位」に変換するかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、対象地域・共創の手法・得られた優先順位はすべて未確認。"}}, {"id": "jr47", "rank": 47, "headline": "業務量と感情調整が教員の燃え尽きを生む経路", "title": "How Do Workload and Emotion Regulation Drive Burnout? — The Mediating Effect of Three-Dimensional Fatigue and Policy Implications for Primary School Teachers", "url": "https://doi.org/10.35534/es.0810204", "authors": "Ruxin Li ほか", "venue": "Education Study", "date": "2026-11-06", "apa": "Li, R., Yang, S., Chen, H., & Fan, J. (2026). How Do Workload and Emotion Regulation Drive Burnout? — The Mediating Effect of Three-Dimensional Fatigue and Policy Implications for Primary School Teachers. Education Study, 8(10), 1186–1195. https://doi.org/10.35534/es.0810204", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、小学校教員の業務量と感情の調整が、3つの次元の疲労を介して燃え尽き（バーンアウト）につながる経路を調べ、政策への含意を論じる研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "先生の疲れには、体の疲れだけでなく、気持ちの疲れや頭の疲れもあります。仕事の量の多さと、感情を抑えたり作ったりする負担が、どの種類の疲れを通って燃え尽きにつながるのかが分かれば、対策の打ちどころが見えてきます。疲れを3つに分けて道筋をたどるという問いが面白いところです。", "unverified": "抄録・本文を入手できず、対象者数・尺度・媒介効果の大きさはすべて未確認。"}}, {"id": "jr48", "rank": 48, "headline": "強制振動のひずみ応答で複合積層板のはく離を同定", "title": "A Self-Referencing Delamination Identification Method for Composite Laminates Using Forced-Vibration Strain Responses and an Improved Particle Swarm Optimization", "url": "https://doi.org/10.1016/j.tws.2026.115944", "authors": "Xin Yang ほか", "venue": "Thin-Walled Structures", "date": "2026-11-07", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "apa": "Yang, X., Cai, W., Chen, H., Liu, X., Zeng, J., Cao, D., Huang, Q., & Li, S. (2026). A Self-Referencing Delamination Identification Method for Composite Laminates Using Forced-Vibration Strain Responses and an Improved Particle Swarm Optimization. Thin-Walled Structures, 115944. https://doi.org/10.1016/j.tws.2026.115944", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録の登録も見つからなかったため題名のみ", "preprint": false, "short": true, "p1": "題名からは、複合積層板のはく離（層の間のはがれ）を、強制振動時のひずみ応答と改良した粒子群最適化で、健全時の基準データを使わずに（自己参照で）同定する手法の研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "飛行機などに使われる複合材料の板は、何枚もの層を貼り合わせて作るため、層の間がはがれることがあります。ふつうは壊れる前の状態と比べて異常を探しますが、壊れる前のデータがないことも多いものです。今の揺れ方だけから傷の場所と大きさを推定できるのかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、はく離のモデル化、最適化の改良点、同定の精度はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "機械学習", "headline": "文書を見せるだけでは私的APIを使いこなせないLLM", "title": "To See is Not to Master: Teaching LLMs to Use Private Libraries for Code Generation", "url": "https://doi.org/10.1145/3862481", "authors": "Yitong Zhang ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-11-07", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "apa": "Zhang, Y., Li, C., Chen, R., Yang, G., Jia, X., Ren, Y., & Li, J. (2026). To See is Not to Master: Teaching LLMs to Use Private Libraries for Code Generation. ACM Transactions on Software Engineering and Methodology. https://doi.org/10.1145/3862481", "why": "非公開ライブラリのAPI文書を文脈に入れても、LLMはそれを正しく呼び出せないことを示し、合成グラフで多様かつ高品質な学習データを自動生成して微調整する手法PriCoderを提案した。モデルが学習していない新しいライブラリで作った2つのベンチマークで、何もしない場合よりpass@kを13.53〜31.66ポイント上げた。"}, {"id": "jn02", "rank": 2, "field": "物理学", "headline": "積分球のスペックルで分光の分解能を約80倍に", "title": "Ultra-high precision speckle spectrometer enabling radio-frequency scale resolution of atomic spectra", "url": "https://doi.org/10.1038/s41467-026-78325-y", "authors": "Gabriel Britto Monteiro ほか", "venue": "Nature Communications", "date": "2026-11-07", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Britto Monteiro, G., Perrella, C., Scholten, S. K., Facchin, M., Luiten, A. N., Bruce, G. D., & Dholakia, K. (2026). Ultra-high precision speckle spectrometer enabling radio-frequency scale resolution of atomic spectra. Nature Communications. https://doi.org/10.1038/s41467-026-78325-y", "why": "ランダムな光の干渉模様（スペックル）から波長を読む分光器で、積分球を多重散乱の空洞として使い光路長を長くすることで、780 nmで6 fm（分解能1.3×10^8）と従来より約80倍の分解能を達成した。ルビジウムの超微細構造をスペックルで直接測れることも示した。"}, {"id": "jn03", "rank": 3, "field": "ソフトウェア工学", "headline": "機能単位の要約で未知のコードの保守成功率が向上", "title": "FeatOutline: Feature-Oriented Repository Summarization for Enhanced Code Comprehension and Maintenance", "url": "https://doi.org/10.1145/3862475", "authors": "Yifeng Zhu ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-11-07", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "apa": "Zhu, Y., Li, X., Zhao, X., Ma, Z., Li, K., Yuan, H., Zou, Y., & Xie, B. (2026). FeatOutline: Feature-Oriented Repository Summarization for Enhanced Code Comprehension and Maintenance. ACM Transactions on Software Engineering and Methodology. https://doi.org/10.1145/3862475", "why": "リポジトリをディレクトリやファイルではなく機能ごとに整理し、各機能を実装するメソッドに結び付けて要約する手法FeatOutlineを提案した。8つのJavaリポジトリで文書化された機能をより完全に捉え、16名の保守作業の実験で既存手法より課題の成功率を28.1ポイント上げ、所要時間を約3分の1減らした。"}, {"id": "jn04", "rank": 4, "field": "機械学習", "headline": "知識   ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
