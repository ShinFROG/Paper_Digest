<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

、正しい答えでも引っ込めたくなる。AIも同じで、肩書きのついた反対意見で正答を捨ててしまう。面白いのは、90%当たっているAIが意見を変えて得をするには、間違いを直す回数が正解を捨てる回数の9倍以上必要だという単純な計算で、素直に聞き入れることが損になりやすい理由が見える点だ。", "unverified": "本文を読めておらず、課題の内訳、モデル名、統計的な検定の詳細は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "ペルソナの模擬ユーザーで製品の仮説を事前検証", "title": "Probe What-If Worlds Before You Ship: Persona Simulation for Real-World Decision Making", "url": "https://arxiv.org/abs/2611.14700", "authors": "Julie Zhu ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Zhu, J., Hou, J., Tao, Z. S., Bo, S., Fan, Y., He, Y., Hu, Z., Huang, S., Liu, F., Wang, Y., Wei, Z., Xu, H., Xu, Z., Yuan, Z., Zuo, J., Huang, J., Wang, Y., Wen, Q., Li, J., … Li, X. (2026). Probe What-If Worlds Before You Ship: Persona Simulation for Real-World Decision Making (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14700", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "製品やサービスの利用者調査を、詳細なペルソナをもつ模擬ユーザーによる統制実験に置き換え、設計の段階で仮説を試せる枠組みと実行基盤を作った（抄録）。未査読のプレプリント。", "p3": "対象の集団、刺激、判断に使う指標を形式的に定め、調査・Web・チャットボット・OSアプリの環境で、集団×刺激×環境の組み合わせを大規模に並列実行する。試行単位の記録を残し、集団別・条件別の統計報告を出す（抄録）。", "p5": "5分野12件の産業パートナーの事例で、届きにくい集団や仮想の集団を作り、模擬回答を検証可能な設計仮説にまとめた。一部の事例ではモデルを替えても主な結論はおおむね保たれたが、ペルソナの属性を変えたり除いたりすると結果・効果量・群間差が変わった（抄録）。", "fun": "新しいアプリを作る前に使う人の反応を確かめたいが、高齢者や専門職のような人に毎回集まってもらうのは大変だ。この研究は、細かく設定した「架空の利用者」をAIで大量に動かして試す。面白いのは、架空の人の属性を少し変えるだけで結果が変わることで、誰をどう描くかが答えを左右するという、模擬実験の強みと怖さが同時に見える。", "unverified": "本文を読めておらず、事例の内容、使ったモデル、実際の利用者調査との一致の程度は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "シンプソン型の偏りを補正した利益の質モデル", "title": "An Earnings Quality Estimation Model that Corrects for the Simpson Bias", "url": "https://doi.org/10.2139/ssrn.7684749", "authors": "Yashu Dong ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Dong, Y., Teoh, S. H., & Zhang, Y. (2026). An Earnings Quality Estimation Model that Corrects for the Simpson Bias. https://doi.org/10.2139/ssrn.7684749", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "利益の質の代表的な指標であるDechow-Dichev（DD）モデルに潜む、集計による見かけの偏り（シンプソン型の偏り）を補正したC-DDモデルを提案した（抄録）。未査読のプレプリント。", "p3": "従来のDD回帰は、営業キャッシュフローの代理誤差と営業外の発生高の混入という性質の違う測定誤差をもつ企業をまとめて推定するため、グループ間の正の関係がグループ内の負の関係を打ち消す。C-DDは報告の基準、発生高の構成、極端な業績ショックの3つで、発生高とキャッシュフローの関係を条件づける（抄録）。", "p5": "C-DDは6つの比較モデルより説明力が高く、裁量的発生高は小さく総発生高との相関も低かった。偽陽性を一般には増やさずに利益調整の検出力を高め、発生高の質と資本コストの負の関係は消えたと報告する（抄録）。", "fun": "クラス全体では「勉強時間が長いほど成績が低い」のに、クラスごとに見ると逆になる、というのがシンプソンのパラドックスだ。この研究は、会社の利益の「質」を測る有名な式でも同じことが起きていると指摘した。性質の違う会社をまとめて計算すると関係が打ち消され、利益の質が悪いように見えてしまう。会計の指標にも統計の落とし穴がひそむ。", "unverified": "本文を読めておらず、標本の期間と企業数、検出力の改善の大きさは未確認。"}}, {"id": "pr19", "rank": 19, "headline": "フローマッチングで文脈つき表データの異常検知", "title": "Flow-CAD: Flow Matching for Contextual Anomaly Detection and Explanation in Tabular Data", "url": "https://arxiv.org/abs/2611.16184", "authors": "Zhong Li ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Li, Z., Huang, Q., Wang, Y., Cao, Y., Bäck, T., van Stein, N., van Leeuwen, M., & Yang, L. (2026). Flow-CAD: Flow Matching for Contextual Anomaly Detection and Explanation in Tabular Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16184", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "表データの行のうち、その文脈（条件）のもとで予想外の振る舞いをするものを見つける文脈つき異常検知を、フローマッチングという生成モデルで行う方法Flow-CADを提案した（抄録）。未査読のプレプリント。", "p3": "文脈で条件づけた振る舞いの分布を一つの条件付き生成モデルで学習し、文脈ごとにモデルを作り直さない。学習した流れから、尺度をそろえて裾を切った残差エネルギーを異常度とし、特徴量ごとの寄与も出す。異常度が速度場の推定誤差に対して安定であることなどを理論的に示す（抄録）。", "p5": "20のベンチマークデータで13の比較手法と比べ、PR AUC・ROC AUC・P@nの平均順位が最良だったと報告する。コードは公開されている（抄録）。", "fun": "身長180cmは大人なら普通でも、小学生ならとても珍しい。このように「条件によって普通かどうかが変わる」異常を見つけるのが文脈つき異常検知だ。この研究は、条件ごとの「ありそうな値の分布」をAIの生成モデルで丸ごと学び、そこから外れた行を見つける。どの項目が外れているかも示せるので、なぜ怪しいのかを説明しやすい。", "unverified": "本文を読めておらず、ベンチマークの内容、比較手法の一覧、会計データでの性能は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "小型LLMを何体集めても誤差はほぼ減らない", "title": "Shared Item-Level Error Limits the Aggregation of Small Language Models in Fermi Estimation", "url": "https://arxiv.org/abs/2611.16315", "authors": "Carolina Fortuna ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Fortuna, C., & Bertalanic, B. (2026). Shared Item-Level Error Limits the Aggregation of Small Language Models in Fermi Estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16315", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "小型の言語モデルを多数集めて答えを平均すれば誤差が減るという期待が、フェルミ推定では成り立たないことを、誤差を問題ごとの共通成分と残差に分けて示した（抄録）。未査読のプレプリント。", "p3": "15の公開モデル（30億〜720億パラメータ）がやりとりの前に出した251万件の回答で、対数の誤差を、モデルが問題ごとにもつ平均の誤差（同じ問題のすべての回答に共通）と残差に分解した。別の問題集でも再現を確かめた（抄録）。", "p5": "問題が決まればチームの誤差は互いに無相関だが、問題ごとの共通成分が誤差の分散の中央値0.906を占めた。そのため30体のチームでも誤差は中央値で1.7%（最大5.4%）しか減らず、3回の討論はチーム内のばらつきを93%減らしたが共通成分は変わらなかった（抄録）。", "fun": "たくさんの人に推測させて平均すると正解に近づく「集合知」は、各自の間違い方がバラバラなときに効く。この研究では、AIを30体集めても誤差がほとんど減らなかった。どのAIも同じ問題で同じ方向に外すからだ。話し合わせても意見がそろうだけで正解には近づかない。数を集める前に、間違い方が違うかを確かめよという教訓になる。", "unverified": "本文を読めておらず、問題集の詳細と、改善したとされる指示や層の操作の効果の大きさは未確認。"}}, {"id": "pr21", "rank": 21, "headline": "LLMペルソナは専門家の評価を代われるか", "title": "Artificial Advice, Real Risks: Are LLM Personas Ready for Stakeholder Roles in Climate Innovation Evaluation?", "url": "https://doi.org/10.5281/zenodo.24157397", "authors": "Konstantinos Koasidis ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-12", "apa": "Koasidis, K., Xexakis, G., Frilingou, N., Tigka, C., & Nikas, A. (2026). Artificial Advice, Real Risks: Are LLM Personas Ready for Stakeholder Roles in Climate Innovation Evaluation? Zenodo. https://doi.org/10.5281/ZENODO.24157397", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの文書の抄録（OpenAlexから候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "気候技術の見通しの評価で、LLMが作るペルソナが専門家の代わりになるかを、260人の専門家の評価と比べて調べた（抄録）。Zenodoに置かれた未査読の文書。", "p3": "14の画期的な脱炭素技術を、緩和の可能性・導入の時期・遅れのリスクの3基準で評価させた。ChatGPT・Gemini・Claudeに専門家と同じ職業・地域・性別を与えたペルソナを作らせ、回答をAPOLLOという集団意思決定の枠組みで集計・順位づけした（抄録）。", "p5": "LLMの評価は専門家よりばらつきが大きかった。次世代の蓄電、海洋への石灰散布、ハイパーループなどでは一致したが、LLMはバイオエネルギーを、専門家は産業の脱炭素化を重視した。性別や職業による固定観念的な傾向とモデル間の不一致も見られた（抄録）。", "fun": "専門家に意見を聞くのは時間もお金もかかる。そこでAIに専門家の職業・地域・性別を指定して「なりきって」答えさせたらどうか、という試みだ。結果は、AIの答えは専門家よりばらつき、好む技術も違い、性別や職業のステレオタイプまで混ざった。AIのなりきりは便利だが、偏りまで再現してしまうという警告になっている。", "unverified": "本文を読めておらず、一致・不一致の程度を示す数値、モデルの版、APOLLOによる集計の詳細は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "シリコン標本をイスラエルの世論調査で較正", "title": "From Raw LLMs to Calibrated Silicon Samples: An Empirical Validation and Methodological Debiasing Against the Israeli Voice Index", "url": "https://doi.org/10.31235/osf.io/v68zd", "authors": "Dor Posner", "venue": "SocArXiv", "date": "2026-11-13", "apa": "Posner, D. (2026). From Raw LLMs to Calibrated Silicon Samples: An Empirical Validation and Methodological Debiasing Against the Israeli Voice Index. https://doi.org/10.31235/osf.io/v68zd", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "人口統計で条件づけたLLMの合成回答者（シリコン標本）を、イスラエル民主主義研究所の世論調査（N=751）と比べ、補正の仕組みを加えると回答の分布が人に近づくかを2波の実験で調べた（抄録）。未査読のプレプリント。", "p3": "24問（108の回答カテゴリー）で、第1波は国勢調査で層化した合成回答者に答えさせ、第2波は「わからない」の選び方や回答の散らばりを保つ仕組みなど4つの補正を加えた。問ごとの総変動距離（TVD）、平均絶対誤差、相関で評価した（抄録）。", "p5": "第1波は選択肢単位の相関がr=0.804と高い一方、平均TVDは30.7%、「わからない」は0.7%（人は9.3%）だった。第2波は24問中21問で改善し、平均TVDは24.9%、「わからない」は8.7%になったと報告する（抄録）。", "fun": "AIに年齢や性別などの属性を与えて世論調査に答えさせると、全体の傾向は人に似るのに、「わからない」とほとんど答えない。人なら9%が迷う質問でも、AIは迷わず言い切ってしまう。この研究は、迷いを組み込むなどの工夫で回答の分布を人に近づけた。AIの自信過剰が合成回答の弱点だと分かる。", "unverified": "本文を読めておらず、補正の各仕組みの寄与、評価の統計的な不確かさ、使ったシステムの詳細は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "3次元粒状体の粒子の接触面積をAIで推定", "title": "AI-Based Interfacial Contact Area Prediction in 3D Granular Media: Benchmarking Volumetric CNN, GNN, and Classical Surface Meshing", "url": "https://doi.org/10.21203/rs.3.rs-11710298/v1", "authors": "Mohammad Sadique Pathan ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Pathan, M. S., & Goswami, M. (2026). AI-Based Interfacial Contact Area Prediction in 3D Granular Media: Benchmarking Volumetric CNN, GNN, and Classical Surface Meshing. https://doi.org/10.21203/rs.3.rs-11710298/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "3次元の粒状体で、接する粒子どうしの接触面積を、CNN・GNNなどのAIの代理モデルで、従来の表面メッシュ化より正確かつ速く推定できることを示した（抄録）。未査読の原稿。", "p3": "合成した250の粒状体の試料（50,800粒子、48,750の接触面）で、ランダムフォレスト、3次元CNN、GraphSAGEのGNN、GNNとCNNの融合の4つを比べた。粒子の幾何が分かる場合とボクセル画像だけの場合の両方で評価した（抄録）。", "p5": "幾何情報つきのGNNは決定係数R²=0.99999、画像だけの3次元CNNはR²=0.99788で、マーチングキューブ法による表面メッシュ化（R²=0.50471、誤差率72.24%）より精度が17.6倍、速さが21.4倍よかったと報告する（抄録）。", "fun": "砂粒どうしがどれだけの面積で触れ合っているかは、砂の固さや熱の伝わり方を決める。ところがCT画像を小さな立方体で区切って表面を測ると、曲面が階段状になり、面積を40〜80%も多く見積もってしまう。この研究は、AIに画像から接触面積を直接推定させると、この階段の誤差を避けられることを示した。", "unverified": "本文を読めておらず、合成試料の作り方の詳細と、実際のCT画像での検証の有無は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "データ補正つき縮約モデルで流れの不確実性評価", "title": "Data-driven Correction Reduced-Order Stochastic Collocation Method for the Time-Dependent Navier-Stokes Equations", "url": "https://arxiv.org/abs/2611.15980", "authors": "Md. Abdul Aziz ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Aziz, M. A., Mohebujjaman, M., & Xie, X. (2026). Data-driven Correction Reduced-Order Stochastic Collocation Method for the Time-Dependent Navier-Stokes Equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15980", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "粘性がランダムに変わる非定常の非圧縮ナビエ・ストークス方程式の不確実性評価を、データで補正した縮約モデルと確率選点法の組み合わせで安く行う方法を作った（抄録）。未査読のプレプリント。", "p3": "固有直交分解（POD）の縮約モデル、空間フィルタ、データ駆動の閉包モデル、確率選点法を組み合わせる。各実現の閉包項を期待値の粘性での閉包で近似するので、一つの閉包モデルをすべての実現に使い回せる。物理的な制約を課した版も作った（抄録）。", "p5": "5次元のランダム粘性場をもつ2次元の円柱まわりの流れ（平均レイノルズ数100と500）で、補正つきの縮約モデルは標準のガレルキン縮約モデルより概ね良く、制約つきの版がエネルギーの時間変化を最も正確かつ頑健に近似した（抄録）。", "fun": "水の粘り気が少しずつ不確かだと、流れがどう変わるかを知るには何百通りもの計算が要る。この研究は、計算を軽い縮約モデルに置き換え、その誤差の補正を平均的な条件の計算だけから作って全部の場合に使い回す工夫をした。一回の手間で多数の場合をまかなうという発想が面白い。", "unverified": "本文を読めておらず、計算時間の短縮の程度と誤差の具体的な数値は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "低周波と高周波を分けてデジタルツインを補正", "title": "Two-Stage Spectral Decoupling for High-Precision Digital Twin: A Multi-Frequency Residual Compensation Framework", "url": "https://doi.org/10.21203/rs.3.rs-10862139/v1", "authors": "Lele Luo ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Luo, L., Zhang, H., & Chen, J. (2026). Two-Stage Spectral Decoupling for High-Precision Digital Twin: A Multi-Frequency Residual Compensation Framework. https://doi.org/10.21203/rs.3.rs-10862139/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "デジタルツインで、物理モデルと実機のずれを低周波の傾向と高周波の外乱に分け、2段階で補正して予測誤差を減らす枠組みを提案した（抄録）。未査読の原稿。", "p3": "まず基本の時系列モデルで低周波の傾向を捉え、次に離散ウェーブレット変換を組み込んだTransformer（WERT）で高周波の残差を補正する。デジタルツインでは物理モデルの予測を実時間で得られる利点を使う（抄録）。", "p5": "2種類の6自由度ロボットアーム（JAKA Zu 12とUR3）で、融合した予測の平均絶対誤差が28.1%と31.2%減り、0.1mmの許容幅に入る割合が46%改善したと報告する（抄録）。", "fun": "機械の動きを計算で再現するデジタルツインは、経年劣化のようなゆっくりしたずれと、振動のような速いずれの両方で本物とずれる。両方を一度に直そうとすると、大きなゆっくりしたずれに速いずれが埋もれてしまう。この研究は、周波数で分けて順に直すと精度が上がることを示した。", "unverified": "本文を読めておらず、大型構造への適用の可否と比較手法の一覧は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "偏心質量つき分数階片持ち梁の非線形振動", "title": "Steady-state nonlinear vibrations of a fractional cantilever beam with an eccentric tip mass element", "url": "https://doi.org/10.21203/rs.3.rs-11352105/v1", "authors": "Jan Freundlich", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Freundlich, J. (2026). Steady-state nonlinear vibrations of a fractional cantilever beam with an eccentric tip mass element. https://doi.org/10.21203/rs.3.rs-11352105/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "先端に偏心した質量をもつ片持ち梁の非線形の定常振動を、材料の粘弾性を分数階微分で表したモデルで解析した（抄録）。未査読の原稿。", "p3": "オイラー・ベルヌーイ梁と分数階のケルビン・フォークト材料を仮定し、ハミルトンの原理で非線形の運動方程式を導いた。線形振動の固有振動数と固有関数を求め、第1共振の近くで多重尺度法により解いた（抄録）。", "p5": "分数階微分の次数が非線形振動に影響し、次数が大きくなると振動の振幅が小さくなると報告する（抄録）。", "fun": "ゴムのような材料は、ばねのように戻る性質と粘土のようにゆっくり変形する性質を併せもつ。分数階微分は、その中間の性質を一つの数（次数）で表す道具だ。この研究は、その次数を変えると梁の揺れの大きさが変わり、次数が大きいほど揺れが小さくなることを示した。微分の回数が整数でなくてよいという発想自体が面白い。", "unverified": "本文を読めておらず、次数の範囲（抄録の不等式の表記が崩れている）と数値例の値は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "球が無限長の梁に当たる多重接触を解く", "title": "Transverse impact of a Hertzian sphere with an infinite Rayleigh beam", "url": "https://arxiv.org/abs/2611.16798", "authors": "Saranya Biswas ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Biswas, S., & Chatterjee, A. (2026). Transverse impact of a Hertzian sphere with an infinite Rayleigh beam (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16798", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ヘルツ接触の球が無限長のレイリー梁に横から衝突する問題を、履歴に依存する式を局所的な常微分方程式に置き換えて解き、接触の起こり方を3つの領域に分類した（抄録）。未査読のプレプリント。", "p3": "衝突の式の履歴依存の畳み込みを、抽象的な連続変数でのガレルキン射影で局所的な常微分方程式の系に置き換えた（縮約）。近似解を、畳み込みの式の直接数値解と比べて検証した（抄録）。", "p5": "オイラー・ベルヌーイ梁では無次元パラメータが1つだが、レイリー梁では2つになる。1回の接触の後に永久に離れる領域、1回の接触が続く領域、その間で離れては接触を繰り返し最後は接触が続く領域の3つを示した（抄録）。", "fun": "ボールを長い棒に当てると、一度で跳ね返ることもあれば、何度もコツコツと当たり直すこともある。この研究は、棒の回転のしにくさまで考えた梁で、跳ね返り方が3通りに分かれることを示した。過去の動きの影響を全部覚えておく必要がある難しい式を、扱いやすい形に置き換えたのが工夫だ。", "unverified": "本文を読めておらず、領域の境界を決める無次元パラメータの値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "低速・重荷重の円柱の転がり抵抗を解析モデル化", "title": "An Analytical Model for Cylindrical Rolling Resistance under Low-Speed and Heavy-Load Conditions via the Prism Contact Dynamics Limit", "url": "https://doi.org/10.21203/rs.3.rs-11398957/v1", "authors": "Zhenning Liu ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Liu, Z., Shi, T., Zhao, Z., & Yan, S. (2026). An Analytical Model for Cylindrical Rolling Resistance under Low-Speed and Heavy-Load Conditions via the Prism Contact Dynamics Limit. https://doi.org/10.21203/rs.3.rs-11398957/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "低速・重荷重で転がる円柱の転がり抵抗を、多角柱の転がりの極限として解析的に表すモデルを作った（抄録）。未査読の原稿。", "p3": "まず角柱の転がりの動力学モデルを作り、数値計算で前縁と後縁の応力の比がほぼ一定になることを見つけ、角の切り替わりの前後の角速度の関係を導いた。角柱の辺の長さをヘルツの線接触の幅に対応させて、滑らかな円柱のモデルにした（抄録）。", "p5": "テフロン・PMMA・鋼の車輪の22回の低速転がり実験で評価し、後縁と前縁の応力比は約0.6に集中し、速度に依存する寄与は小さかった。グリーンウッドの古典的なヒステリシスの式と同じ、荷重・接触幅・転がり半径への依存も再現したと報告する（抄録）。", "fun": "丸い車輪を、角がたくさんある多角形の車輪だと考えてみる。角が一つ地面に着くたびに小さな衝突が起き、そのたびにエネルギーが少し失われる。角の数を増やしていけば円に近づくので、この小さな衝突の積み重ねから転がりにくさを計算できる、というのがこの研究のアイデアだ。", "unverified": "本文を読めておらず、実験の条件の詳細とモデルの適用範囲の限界は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "地震波が示すネパールの岩屑なだれの二段階発生", "title": "Seismic evidence for a two-stage origin of the October 2026 Budhi Gandaki landslide in the Nepal Himalaya", "url": "https://doi.org/10.31223/x5c53p", "authors": "Christopher Calvelage ほか", "venue": "EarthArXiv", "date": "2026-11-12", "apa": "Calvelage, C., Huang, S., Chen, C.-M., Wang, B., Pratt-Sitaula, B., & McLaughlin, J. (2026). Seismic evidence for a two-stage origin of the October 2026 Budhi Gandaki landslide in the Nepal Himalaya. https://doi.org/10.31223/x5c53p", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EarthArXivの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "2026年10月10日にネパール・ヒマラヤで起きた岩屑なだれが二段階の崩壊だったことを、地震波の解析と流動シミュレーションから示した（抄録）。未査読のプレプリント。", "p3": "1つの地域観測点と28の遠地の地震記録から、崩壊が地面に及ぼした単一の力を逆解析した。崩壊面から流下させる流動シミュレーションと合わせて崩壊の過程を推定した（抄録）。", "p5": "岩屑なだれは8.7km流下して川をせき止めた。逆解析は23〜26秒間隔で西向きと東向きが交互になる4つの力のパルスを示し、シミュレーションは小さな崩壊の40〜60秒後に本体が崩れ、合計600万〜2,100万m³が3分で川に達したことを支持した（抄録）。", "fun": "山崩れは目撃者がいなくても、地面を押した力が地震計に記録される。この研究は、遠く離れた世界中の地震計の記録から、崩れた岩が地面を西へ東へと押した力のリズムを読み取り、崩壊が小さな前ぶれと本体の二段階で起きたことを突き止めた。地震計が山崩れの監視カメラにもなるという点が面白い。", "unverified": "本文を読めておらず、力のパルスの解釈の不確かさとシミュレーションの条件は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "少数のCPTから表形式の基盤モデルで地盤を推定", "title": "Subsurface schematisation from sparse CPT data using the tabular foundation model TabPFN", "url": "https://arxiv.org/abs/2611.16088", "authors": "Taiga Saito ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Saito, T., Montero, F. C., Coelho, B. Z., Teixeira, A. M., Wu, S., Schweckendiek, T., & Otake, Y. (2026). Subsurface schematisation from sparse CPT data using the tabular foundation model TabPFN (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16088", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "まばらなコーン貫入試験（CPT）のデータから地盤の2次元断面を推定する作業に、一般的な合成表データで事前学習した基盤モデルTabPFNを、地盤用の微調整なしで使えることを示した（抄録）。未査読のプレプリント。", "p3": "格子の座標と土質挙動タイプ指数の観測だけを入力し、層の境界を事前に決めずに断面を再構成した。合成した断面とオランダの2つの現場で、地盤断面で学習した条件付きGAN（SchemaGAN）や補間法と比べた（抄録）。", "p5": "TabPFNの平均誤差は合成断面でSchemaGANに近く、2つの現場では低かった。CPTの本数を増やすごとに誤差は下がり、予測区間の被覆率は名目値に近かった。合成断面で微調整すると合成データでの精度は上がったが、現場での誤差は増えた（抄録）。", "fun": "地面の中の様子は、ところどころに打った細い棒（コーン）の記録からしか分からない。その間を埋めるのに、地盤のことを何も教わっていない汎用のAIが、地盤専用に訓練したAIと同じくらい、現場ではそれ以上にうまく推定した。しかも地盤用に追加で学ばせると現場では悪くなったという点が意外で面白い。", "unverified": "本文を読めておらず、現場の地盤条件と誤差の具体的な値は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "管路網の非線形過渡流をニューラル基底で学習", "title": "Learning Nonlinear Transient Dynamics in Fluid Flow Networks with the Neural Basis Method", "url": "https://arxiv.org/abs/2611.14534", "authors": "Aijaz Nazir ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Nazir, A., Wang, Y., Rasel, S. K., & Wang, M. (2026). Learning Nonlinear Transient Dynamics in Fluid Flow Networks with the Neural Basis Method (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14534", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "管路網の非線形な過渡流を、ニューラル基底で表してから方程式に射影する方法で縮約し、未知の境界条件でも速く正確に予測できるようにした（抄録）。未査読のプレプリント。", "p3": "各管路の上に固定したニューラル基底で表現空間を作り、離散化した方程式の射影で展開係数を決めて保存則を守る形にする。管路どうしは重なりのない領域分割でつなぎ、縮約した空間でパラメータから係数への写像をニューラル作用素で学ぶ（抄録）。", "p5": "ループや分岐のある網で、参照解を相対L²誤差0.02%未満で再現し、物理情報ニューラルネットの比較手法は失敗した。未知の境界条件では平均の圧力誤差1%未満、流量誤差3.3%未満で、比較手法（8〜18%、85〜95%）を大きく上回った（抄録）。", "fun": "水道管やガス管の網で、弁を閉めたときの圧力の波を何千通りも計算するのは大変だ。この研究は、AIに方程式を丸暗記させるのではなく、AIで作った部品（基底）を組み合わせ、その組み合わせ方は物理の式に従って決める。AIの柔軟さと物理の法則の確かさを分担させたのがうまい点だ。", "unverified": "本文を読めておらず、計算時間の比較と網の規模は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "粒子法SPHの収束率を非線形圧力で証明", "title": "Convergence rates for smoothed particle hydrodynamics (SPH) with nonlinear pressure", "url": "https://arxiv.org/abs/2611.17151", "authors": "Piotr Gwiazda ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Gwiazda, P., Skrzeczkowski, J., & Woźnicki, J. (2026). Convergence rates for smoothed particle hydrodynamics (SPH) with nonlinear pressure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17151", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "粒子法SPHが非線形の圧力則（ρのγ乗、γ≧2）をもつ圧縮性オイラー方程式の滑らかな解に収束することを、収束の速さまで含めて証明した（抄録）。未査読のプレプリント。", "p3": "元の系のエネルギー構造（正確なエネルギー収支を含む）を保つ圧力の非局所近似を使い、相対エントロピー法で、非局所性のパラメータεを0に近づけたときの収束を示した。εと粒子数Nの関係も明示した（抄録）。", "p5": "密度はワッサースタイン距離と負のソボレフノルムで、運動量は平坦計量で、代数的な収束率を得た。これまでのSPHの厳密な収束理論を、二次の圧力（γ=2）から一般の非線形の圧力へ広げたと報告する（抄録）。", "fun": "水を小さな粒の集まりとして計算するSPH法は、映画のCGや津波の計算に使われる。でも粒の数を増やしたとき、本当の水の方程式の答えに近づくと数学的に保証されていたのは、圧力が密度の2乗に比例する特別な場合だけだった。この研究はその保証を、もっと一般の圧力の場合に広げた。", "unverified": "本文を読めておらず、収束率の具体的な指数と周期領域以外への拡張の可否は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "生成AIは監査人の見積り検証を変えるか", "title": "Who Audits the Machine? Generative AI, Auditor Challenge and the Quality of Accounting Estimates&nbsp;A Research Design and Pre-Analysis Plan", "url": "https://doi.org/10.2139/ssrn.7684883", "authors": "Rakesh Gupta", "venue": "SSRN", "date": "2026-11-13", "apa": "Gupta, R. (2026). Who Audits the Machine? Generative AI, Auditor Challenge and the Quality of Accounting Estimates&nbsp;A Research Design and Pre-Analysis Plan. https://doi.org/10.2139/ssrn.7684883", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "生成AIが監査に入ってきたとき、監査人が経営者の判断の大きい会計上の見積りを厳しく検証するのか甘くなるのかを調べるための、研究計画と事前分析計画である（抄録）。結果は報告していない未査読の文書。", "p3": "記録データの部分では、監査人のAI利用の強さと顧客企業のAI利用を、見積りの質、監査報告書の文言の具体性、監査の努力と結び付ける。実務の監査人による統制実験では、アルゴリズム回避と自動化バイアスを切り分ける（抄録）。", "p5": "記録データの4つと実験の2つの仮説、探索的な問い一つ、事前分析計画、AIはあまり変えないという答えもありうる判定規則を示した。生成AIの時期の損失はまだ実現していないため、見積りの正確さの検証は段階的に行うとしている（抄録）。", "fun": "AIが監査を手伝うと、人間の監査人はAIの意見を信じすぎてしまうのか、逆にAIの指摘を軽く見るのか。どちらもありうる。この文書は結果を出す前に、何を確かめ、どんな結果ならどう判断するかを先に宣言している。後から都合のよい結果だけを選ばないための「先に約束する研究」という作法が面白い。", "unverified": "研究計画のため結果はない。本文を読めておらず、標本と実験の規模は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "利益調整モデルの均衡はただ一つ", "title": "Incentive Uncertainty and Equilibrium Uniqueness in Earnings Management Models", "url": "https://doi.org/10.2139/ssrn.7684304", "authors": "Kevin Smith", "venue": "SSRN", "date": "2026-11-13", "apa": "Smith, K. (2026). Incentive Uncertainty and Equilibrium Uniqueness in Earnings Management Models. https://doi.org/10.2139/ssrn.7684304", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "経営者の報告動機に不確実性がある利益調整モデル（Fischer and Verrecchia 2000）で、知られていた線形の均衡が唯一の均衡であることを証明した（抄録）。未査読のプレプリント。", "p3": "元の研究は株価が報告に線形な均衡に限って一意性を示していた。本研究は、最適な報告とベイズ的な価格づけに整合する価格関数はほかにないことを示した（抄録）。", "p5": "動機の不確実性のない利益調整モデルには、非線形の分離均衡と部分的な一括均衡が連続的に存在するが、正規分布の動機の不確実性がどれほど小さくても入れば、それらはすべて消えると報告する（抄録）。", "fun": "経営者が利益を少し盛るかもしれないと市場が疑うとき、株価がどう決まるかには答えが何通りもありうる。ところが「経営者がどれくらい盛りたいか」を市場が正確には知らない、というわずかな不確かさを入れるだけで、答えが一つに決まる。少しの曖昧さが理論を安定させるという逆説が面白い。", "unverified": "本文を読めておらず、証明の仮定（分布の条件など）の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "買収由来のサイバーリスクは開示で説明されない", "title": "Acquired Cyber Risk in S&amp;P 500 10-Ks: Recognized in Item 1A, Rarely Explained in Item 1C", "url": "https://doi.org/10.2139/ssrn.7684130", "authors": "Yohei Koyama", "venue": "SSRN", "date": "2026-11-13", "apa": "Koyama, Y. (2026). Acquired Cyber Risk in S&amp;P 500 10-Ks: Recognized in Item 1A, Rarely Explained in Item 1C. https://doi.org/10.2139/ssrn.7684130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "S&P500の企業が10-Kのリスク要因（Item 1A）で買収によるサイバーリスクを認めながら、2023年から必要になったサイバー開示（Item 1C）では対応の過程をほとんど説明していないことを示した（抄録）。未査読の短報。", "p3": "Item 1AとItem 1Cの記述を比べ、AIモデルによる符号化と盲検の二重符号化、独立の読み手による再符号化で、買収先への対応の過程、担当者、終了条件の記述を調べた（抄録）。", "p5": "Item 1Aが使える482社のうち96社（19.9%）が買収によるサイバーリスクを述べたが、両方がある459社では、そのうち87社（90.6%）が対応の過程を記述していなかった。リスクを述べた企業は述べない企業より過程を記述する割合が約3倍（9.4%対3.3%）だった（抄録）。", "fun": "会社を買うと、その会社のパソコンやネットワークの弱点も一緒に引き継ぐ。多くの大企業は報告書で「買収にはサイバーリスクがある」と書くのに、同じ報告書の別の欄で「では買った会社をどう点検するか」はほとんど書いていない。リスクを認めることと対策を示すことのずれを、数で示したのが面白い。", "unverified": "本文を読めておらず、符号化の一致度と統制変数の詳細は未確認。著者は開示の分析であり実務の分析ではないとしている。"}}, {"id": "pr36", "rank": 36, "headline": "企業のデータ資産がM&Aを促す", "title": "Firm-level Data Assets and Inorganic Growth", "url": "https://doi.org/10.2139/ssrn.7684101", "authors": "Ke Bi ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Bi, K., Barbopoulos, L. G., & Liu, Y. (. (2026). Firm-level Data Assets and Inorganic Growth. https://doi.org/10.2139/ssrn.7684101", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "企業が蓄積するデータ資産の量と価格の企業年ごとの指標を作り、データ資産が多い企業ほど買収する側になりやすいことを示した（抄録）。未査読のプレプリント。", "p3": "経済モデルと金融に特化した大規模言語モデルを組み合わせ、企業のデータに関する開示と、そこから推定されるデータ資本の量と価格を測った。操作変数による推定などで頑健性を確かめた（抄録）。", "p5": "2010年ごろからデータ資産は急速に増え、大企業に集中した。データ資産の多い企業、とくに大きな既存企業ほど買収者になりやすく、その買収は主に防衛的で、小さなデータ企業の多い産業で強く、発表時の株価反応は低かったと報告する（抄録）。", "fun": "工場や機械と違い、企業が集めたデータは貸借対照表にほとんど載らない。この研究は、企業の開示文書をAIで読んで「データという資産」を数え、それが多い大企業ほど小さな会社を買っていることを示した。しかもその買収は攻めではなく、競争相手の芽を摘む守りだったらしい、という点が面白い。", "unverified": "本文を読めておらず、データ資産の指標の作り方の詳細と標本の範囲は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "介護者QOL尺度の選好重みを離散選択実験で作成", "title": "Development of Preference Weights for the 10-item Singapore Caregiver Quality Of Life Scale: A Discrete Choice Experiment", "url": "https://doi.org/10.21203/rs.3.rs-11439372/v1", "authors": "Chun Fan Lee ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Lee, C. F., Gandhi, M., Kularatna, S., Senanayake, S., Wee, H.-L., Malhotra, R., Yang, G., Neo, S. H., & Cheung, Y. B. (2026). Development of Preference Weights for the 10-item Singapore Caregiver Quality Of Life Scale: A Discrete Choice Experiment. https://doi.org/10.21203/rs.3.rs-11439372/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "シンガポールの10項目の介護者QOL尺度（SCQOLS）に、離散選択実験で選好重みを付け、死亡を0とする効用の値として使えるようにした（抄録）。未査読の原稿。", "p3": "成人を介護するシンガポールの介護者へのオンライン調査で、離散選択実験と視覚的評価尺度の課題を行い、条件付きロジットで推定した。効用をEQ-5D-5Lと比べ、外部データで妥当性と再検査信頼性を評価した（抄録）。", "p5": "1,036人のうち925人を分析した。「食欲がない」と「経済状況が不確か」が最も重く（相対重要度15.3%と14.5%）、「痛み」が最も軽かった（6.2%）。効用は0.247〜1の範囲で平均0.730、既存の介護者評価尺度との相関は0.714以上だった（抄録）。", "fun": "介護する人の暮らしの苦しさを一つの数字にできれば、支援策の効果を比べやすくなる。この研究は、介護者に「どちらの状態がましか」を何度も選ばせて、項目ごとの重みを決めた。痛みより食欲のなさやお金の不安のほうが重く見られたという結果に、介護の負担の中身が表れていて興味深い。", "unverified": "本文を読めておらず、選択実験の設計の詳細と標本の代表性は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "家族がいても支えにならない高齢者の幸福", "title": "When Family Ties Do Not Translate into Support: Family Support Deficits and Later-Life Well-being in China", "url": "https://doi.org/10.21203/rs.3.rs-10718661/v1", "authors": "Yueying Li ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Li, Y., Li, Z., & Li, H. (2026). When Family Ties Do Not Translate into Support: Family Support Deficits and Later-Life Well-being in China. https://doi.org/10.21203/rs.3.rs-10718661/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "家族とのつながりがあっても支援の行動が実際には行われない状態を「家族支援の欠如」として指標化し、中国の高齢者の生活満足度との関係を縦断で調べた（抄録）。未査読の原稿。", "p3": "中国家庭追跡調査の4波（2016〜2022年）の60歳以上の10,078人・22,201人波を使い、個人の固定効果モデルで、家族支援の欠如の指標の個人内の変化と生活満足度の変化の関係を推定した（抄録）。", "p5": "指標が高まると生活満足度は下がったが（b=−0.033、p=.003）、大きさは小さかった。経済・介護・情緒の各領域はいずれも負の係数だが同時に入れると有意でなく、公的な福祉の有無は関係を調整しなかった（抄録）。", "fun": "子どもがいる高齢者は支えがある、と考えがちだ。でも子どもがいることと、実際にお金や世話や話し相手になってくれることは別だ。この研究は、家族がいるのに支えが届かない状態を数で測り、それが満足度を下げることを示した。「家族がいる」という形だけでは孤立を見落とす、という問題提起が面白い。", "unverified": "本文を読めておらず、指標に含めた支援行動の具体的な項目は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "職場のAIへの抵抗を和らげる過程の枠組み", "title": "Confronting And Alleviating AI Resistance In The Workplace: An Integrative Review And A Process Framework", "url": "https://doi.org/10.2139/ssrn.7698329", "authors": "Ismail Golgeci ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Golgeci, I., Ritala, P., Arslan, A., McKenna, B., & Ali, I. (2026). Confronting And Alleviating AI Resistance In The Workplace: An Integrative Review And A Process Framework. https://doi.org/10.2139/ssrn.7698329", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefから候補の収集時に取得）を使用。抄録によれば全文はHuman Resource Management Review誌に掲載済みで、本文は未取得", "preprint": false, "short": true, "p1": "職場の従業員がAIに抵抗する気持ちをどう向き合い、組織がどう和らげられるかを、統合的な文献レビューから過程の枠組みにまとめた（抄録）。学術誌に掲載済みの論文のSSRN版。", "p3": "AIへの抵抗を、AIへの恐れ、効力感のなさ、反感の3次元の概念とした。個人の側では不信・存在への問い・技術への省察が抵抗と向き合う仕組みで、不安と内省のやりとりを通じて組織の側の緩和の仕組みとつながると論じる（抄録）。", "p5": "組織による緩和を、AIの利用しやすさ、人とAIの能力の補完、AI技術の正当化という3つの過程とし、それぞれが従業員側の3つの次元に対応すると整理した（抄録）。", "fun": "新しい機械が職場に入ると、仕事を奪われる怖さ、使いこなせない不安、なんとなく嫌だという気持ちが混ざって起こる。この論文は、この「AIへの抵抗」を3つの気持ちに分け、それぞれに組織が打てる手を対応させた。抵抗を悪者にせず、気持ちの種類ごとに手当てを考える整理の仕方が分かりやすい。", "unverified": "本文を読めておらず、レビューの対象文献の範囲と件数は未確認。実証研究ではなく概念的な枠組み。"}}, {"id": "pr40", "rank": 40, "headline": "罰は働き手の努力を高めるか：プレミアリーグの証拠", "title": "Exploring The Impact Of Punishments On Employee Effort And Performance In The Workplace: Insights From England's Premier League", "url": "https://doi.org/10.2139/ssrn.7698460", "authors": "David Gligor ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Gligor, D., Golgeci, I., Garg, V., Idug, Y., Ekezie, U., Feiz Abadi, J., & Caliskan, F. (2026). Exploring The Impact Of Punishments On Employee Effort And Performance In The Workplace: Insights From England’s Premier League. https://doi.org/10.2139/ssrn.7698460", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefから候補の収集時に取得）を使用。抄録によれば全文はEuropean Management Review誌に掲載済みで、本文は未取得", "preprint": false, "short": true, "p1": "職場での罰が働き手の努力と成果をどう変えるかを、プレミアリーグのサッカー選手の縦断データで調べた（抄録）。学術誌に掲載済みの論文のSSRN版。", "p3": "イングランド・プレミアリーグの選手412人について、本人に気づかれずに集められる縦断データを使い、処分の前後の努力（走行距離）と成果を比べた。チームの仲間より多く処分された場合と少ない場合も比べた（抄録）。", "p5": "処分の後、選手は有意に多く走る（努力を増やす）が、成果は良くならず、むしろ処分前より有意に低かった。仲間より多く処分された選手は、少ない選手より努力は多いが成果は低かったと報告する（抄録）。", "fun": "叱られた後に頑張る人は多い。サッカー選手のデータで調べると、罰を受けた選手は確かによく走るようになったが、試合での出来はかえって悪くなった。がむしゃらに動くことと、うまくやることは別だということだ。罰で「やる気」は引き出せても「成果」は引き出せないかもしれない、という結果が考えさせる。", "unverified": "本文を読めておらず、罰と成果の指標の定義と効果の大きさは未確認。"}}, {"id": "pr41", "rank": 41, "headline": "デジタルサービスを収益化する価格設計", "title": "Pricing Configurations In Digital Servitization: How Industrial Firms Make Digital Services Commercially Viable", "url": "https://doi.org/10.2139/ssrn.7697900", "authors": "Jawwad Raja ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Raja, J., Golgeci, I., Frandsen, T., & Parida, V. (2026). Pricing Configurations In Digital Servitization: How Industrial Firms Make Digital Services Commercially Viable. https://doi.org/10.2139/ssrn.7697900", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefから候補の収集時に取得）を使用。抄録によれば全文はIndustrial Marketing Management誌に掲載済みで、本文は未取得", "preprint": false, "short": true, "p1": "産業財メーカーがデジタルサービスを収益化できる価格設計の条件と型を、欧州の大手メーカーの縦断的な事例研究から整理した（抄録）。学術誌に掲載済みの論文のSSRN版。", "p3": "ミッションクリティカルな領域で事業を行う欧州の大手OEMを対象に、探索的な縦断の質的事例研究を行った（抄録）。", "p5": "価格づけは、データへのアクセスと解釈、測定と効果の帰属、ガバナンス上の位置、サービスの構造と反復性に依存した。SLA強化型・事故対応型・予測型・計画型などの商用化の型と、場当たり・個別・標準・価値ベースの4つの価格構成を示し、価格の手法の選択より条件の整合が重要だと結論する（抄録）。", "fun": "機械を売るだけでなく、そのデータを使った点検や予測のサービスで稼ぎたい会社は多い。でも「故障を予測したおかげで助かった額」は測りにくく、値段をつけにくい。この研究は、データを使えるか、効果を測れるかなどの条件がそろって初めて値段が成り立つと示した。サービスの値段は条件の組み合わせで決まる、という見方が面白い。", "unverified": "本文を読めておらず、事例企業の詳細とデータの種類は未確認。単一事例の質的研究。"}}, {"id": "pr42", "rank": 42, "headline": "ドローン群とガウス過程で都市の交通を推定", "title": "Gaussian processes for real-time urban traffic estimation using a fleet of drones", "url": "https://arxiv.org/abs/2611.14536", "authors": "Batuhan Avci ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Avci, B., Susnjar, M., Maljkovic, M., & Geroliminis, N. (2026). Gaussian processes for real-time urban traffic estimation using a fleet of drones (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14536", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ドローンの群れによる部分的な上空観測から、都市の道路網全体の交通状態を、不確かさつきで実時間に推定するガウス過程の枠組みを作った（抄録）。未査読のプレプリント。", "p3": "道路網の構造をグラフ・マターン核で空間の共分散に入れ、時間の依存を指数型の核で表す。過去のループ検知器のデータを事前の平均にし、ドローンの観測で実時間に更新する（抄録）。", "p5": "バルセロナの微視的シミュレーションとアテネの実ドローンデータの2つの事例で、総走行時間の推定と予測が過去データによる基準を上回り、必要な機体数を減らせた。予測の不確かさを使ってドローンを動かすと、さらに性能が上がったと報告する（抄録）。", "fun": "道路に埋めた感知器は場所が固定で、街全体は見られない。ドローンなら好きな場所を上から見られるが、全部の道を同時には見られない。この研究は、見た場所の情報と道路のつながり方から見ていない道の混み具合を推定し、さらに「自信のない場所」を次に見に行くようにドローンを動かした。見る場所を賢く選ぶ発想が面白い。", "unverified": "本文を読めておらず、推定精度の具体的な数値と必要な機体数の削減の程度は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "合流式下水の対策を費用と交通影響で最適化", "title": "Physics-Informed Machine Learning for Co-Optimized Green Infrastructure and Real-Time Control of Combined Sewer Systems: Capital Cost and Traffic Disruption Assessment", "url": "https://doi.org/10.20944/preprints202611.1424.v1", "authors": "Naim Sheikh ほか", "venue": "Preprints.org", "date": "2026-11-13", "apa": "Sheikh, N., & Lima, L. I. (2026). Physics-Informed Machine Learning for Co-Optimized Green Infrastructure and Real-Time Control of Combined Sewer Systems: Capital Cost and Traffic Disruption Assessment. https://doi.org/10.20944/preprints202611.1424.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "合流式下水道の越流を減らすため、道路脇の雨水浸透施設の配置と、ゲート・ポンプの実時間制御を、物理を組み込んだ機械学習の代理モデルで同時に最適化する枠組みを示した（抄録）。未査読の原稿。", "p3": "NSGA-IIで道路脇のバイオリテンションの配置を決め、1次元のサン・ブナン方程式の質量・運動量保存を学習の目的に入れた代理モデルで制御する。EPA SWMM 5.2の基準流域で、1・2・5・10年確率の降雨で評価した（抄録）。", "p5": "代理モデルはSWMMの出力に対しNSE=0.952、推論は0.32ms（SWMMは平均14.5分）だった。統合案でピーク流出は48.2から19.6m³/sに、10年確率の越流量は94.1%減り、建設費の推定は2.5億ドルから2,000万ドルになったと報告する。著者は現場での検証が必要としている（抄録）。", "fun": "大雨のとき、下水と雨水を一緒に流す古い下水道はあふれて汚水が川に出てしまう。巨大な地下トンネルを掘れば防げるが、お金も工事の渋滞もかさむ。この研究は、道路脇に雨をしみこませる植え込みを置き、ゲートやポンプを賢く動かせば、ずっと安く済むと計算した。掘るより「賢く流す」発想が面白い。", "unverified": "本文を読めておらず、費用の内訳と基準流域の条件は未確認。数値はモデルによる推定で、著者も実地の検証が必要としている。"}}, {"id": "pr44", "rank": 44, "headline": "LLMの注釈に人の監査を足して常時有効な推論", "title": "Anytime-Valid Empirical Likelihood Inference from LLM Annotations with Adaptive Human Auditing", "url": "https://arxiv.org/abs/2611.15197", "authors": "Hongfu Gao ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Gao, H., Hu, J., Liu, P., & Zhou, W. (2026). Anytime-Valid Empirical Likelihood Inference from LLM Annotations with Adaptive Human Auditing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15197", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの注釈で人のラベルの母平均を推定するとき、限られた予算で人が監査する事例を適応的に選び、いつ止めても有効な信頼区間（信頼系列）を作る方法AAELIを提案した（抄録）。未査読のプレプリント。", "p3": "LLMの出力を使って監査する事例を選び、監査したラベルと予測可能な経験尤度のe過程で組み合わせ、賭けの構成による常時有効な信頼系列を作る。学習した射影でも経験尤度の統計量の一次の性質が保たれることを示した（抄録）。", "p5": "合成データと3つの実データで、経験的に常時の被覆を保ちながら、目標の精度に達するまでに必要な人の監査が、最も強い比較手法より少なかったと報告する（抄録）。", "fun": "AIに大量のデータに印をつけさせると安く早いが、ときどき間違える。そこで一部だけ人が確かめるが、どれを確かめるか、いつ確かめるのをやめてよいかが問題になる。この研究は、怪しいものを優先して確かめ、途中で結果を見てやめても統計的に正しさが保たれる方法を作った。見ながら止められるのが強みだ。", "unverified": "本文を読めておらず、実データの内容と監査数の削減の程度は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "迎合的なAIを利用者はどう評価するか", "title": "Mind the Accuracy-Approval Gap: How Users Evaluate Sycophantic AI in Everyday Tasks", "url": "https://arxiv.org/abs/2611.16722", "authors": "Wajiha Naveed ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Naveed, W., & Fain, B. (2026). Mind the Accuracy-Approval Gap: How Users Evaluate Sycophantic AI in Everyday Tasks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16722", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "利用者に迎合するAIを人々が日常の作業でどう評価するかを、ベンチマークと2つの大規模な利用者実験で調べ、正確さと利用者の好感にずれがあることを示した（抄録）。未査読のプレプリント。", "p3": "システムプロンプトで、正確さを優先する客観型、弱い迎合型、強い迎合型、指示なしの基準型の4つのペルソナを作り、参加者に論争的な政策の議論かメールの共同執筆をさせた（抄録）。", "p5": "指示なしでも利用者の意見に71.7%同調し、会話の圧力下の正答率は客観型81.9%、基準型59.6%、強い迎合型8.7%だった。それでも客観型は他より敬意と満足の評価が有意に低く、基準型より信頼も低かった。意見を変える頻度にペルソナの差はなかった（抄録）。", "fun": "正直に「それは違います」と言うAIと、何でも「おっしゃる通り」と言うAIなら、どちらが好かれるか。実験では、正確なのは正直なAIなのに、好かれたのはおべっかを言うAIだった。人は正しさより気持ちよさを評価しがちで、利用者の評価だけでAIを改良すると迎合が強まりかねない、という警告になる。", "unverified": "本文を読めておらず、参加者数と各評価の効果量は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "司令役なしの多エージェント協調を評価する基盤", "title": "DecArena: Evaluating Large-Scale Decentralized Multi-Agent Collaboration", "url": "https://arxiv.org/abs/2611.15521", "authors": "Jiali Cheng ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Cheng, J., Rokhlenko, O., Kim, J.-K., Amiri, H., & Guo, X. (2026). DecArena: Evaluating Large-Scale Decentralized Multi-Agent Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15521", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "中央の司令役なしに、隣のエージェントとしか通信できない条件で多数のLLMエージェントが協調する力を測るベンチマークDecArenaを作った（抄録）。未査読のプレプリント。", "p3": "各エージェントは自分の局所の状態しか見えず、隣接するエージェントとだけやりとりできる。10万以上の道具を分散して呼び出す合成の課題で評価し、強力な基準として、通信構造を考慮した準備運動と自己改善するLLMの経路選択を組み合わせたGraphHarnessを示した（抄録）。", "p5": "最近のLLMエージェントは遠くにある必要な資源を見つけて協力することが苦手で、通常の強化学習でも解決しなかった。GraphHarnessは課題の成功を48.5、協力の質を30.6改善し、費用も34.0減らしたと報告する（抄録）。", "fun": "大きな組織でも、全員が社長に報告するのではなく、近くの同僚とだけ話して仕事を回すことが多い。この研究は、AIの集団に同じ条件を課すと、遠くの誰が必要な道具を持っているかを探し当てられずに困ることを示した。人の組織と同じく、AIの集団にも情報の回し方の工夫が要るというのが面白い。", "unverified": "本文を読めておらず、改善の数値の単位（ポイントか割合か）とモデル名は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "AIが生んだ資産と自社開発AIの会計処理", "title": "Accounting for AI-generated Assets and Internally Developed AI Systems", "url": "https://doi.org/10.2139/ssrn.7685998", "authors": "Chryspine Vicent Machesha", "venue": "SSRN", "date": "2026-11-13", "apa": "Machesha, C. V. (2026). Accounting for AI-generated Assets and Internally Developed AI Systems. https://doi.org/10.2139/ssrn.7685998", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "AIが生み出した資産と自社開発のAIシステムを財務諸表でどう認識・測定・開示するかを、国際会計基準IAS 38（無形資産）に照らして検討した（抄録）。未査読のプレプリント。", "p3": "会計基準、学術文献、権威ある刊行物などの二次資料を、主題分析で整理する質的な文献研究である（抄録）。", "p5": "既存の基準は要件を満たすAI関連資源の報告の基礎になるが、識別可能性、支配、研究と開発の区別、原価の信頼できる測定、耐用年数と減損の判断に課題があるとし、プロジェクトの記録、原価の追跡、開示の充実が必要だと結論する（抄録）。", "fun": "会社が自分で作ったAIは「資産」として帳簿に載せてよいのか。載せるなら、いくらの価値として、何年で減らしていくのか。技術の進歩が速いと、去年作ったAIが今年には古くなることもある。古い会計のルールで新しい技術を測ることの難しさが、具体的な論点として見えるのが面白い。", "unverified": "本文を読めておらず、検討した資料の範囲は未確認。実証研究ではなく文献にもとづく検討。"}}, {"id": "pr48", "rank": 48, "headline": "金融機関のデジタル技術の開示と業績", "title": "Digital Technology Disclosure and Firm Performance: Evidence from U.S. Financial Institutions", "url": "https://doi.org/10.21203/rs.3.rs-11516669/v1", "authors": "Diaa Weiss ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Weiss, D., & Botoc, C. (2026). Digital Technology Disclosure and Firm Performance: Evidence from U.S. Financial Institutions. https://doi.org/10.21203/rs.3.rs-11516669/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "米国の金融機関の10-Kにおけるデジタル技術の開示を技術の種類ごとに測り、業績との関係が技術によって違うことを示した（抄録）。未査読の原稿。", "p3": "2014〜2025年の535機関・5,172企業年のパネルで、AI、ビッグデータ分析、クラウド、デジタル変革の開示を測る業界専用の辞書を作り、二方向の固定効果回帰で業績との関係を推定した（抄録）。", "p5": "AIの開示は営業上の業績（純利益の変換指標）と最も一貫した正の関係を示したが、総資産利益率との関係は頑健でなかった。クラウドの開示はどの推定でも有意でなく、4つの開示のいずれもトービンのqとは有意に関係しなかった（抄録）。", "fun": "銀行の報告書に「AI」や「クラウド」という言葉がどれだけ出てくるかを数えると、その銀行のもうけと関係があるのか。調べると、AIの話が多い銀行は利益がよい傾向があったが、クラウドの話は関係がなく、株式市場の評価とはどれも関係がなかった。同じデジタル化でも中身で違うという点が面白い。", "unverified": "本文を読めておらず、辞書の作り方の検証方法と効果の大きさは未確認。著者は因果ではなく関連だとしている。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "生成AIでフリーランスの仕事は束ね直される", "title": "The Rebundling of Freelance Work in the AI Age", "url": "https://arxiv.org/abs/2611.14708", "authors": "Caroline Chin ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Chin, C., Kala, S., Kunievsky, N., Liu, T., Richmond, A. M., & Shan, C. (2026). The Rebundling of Freelance Work in the AI Age (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14708", "why": "対話型AIで人々が行う作業と、フリーランス仲介サイトUpworkで発注される仕事を比べた。ChatGPTでよく行われる作業は市場での比重を下げ、そうでない作業は比重を上げた。AI関連の求人では以前は一緒に頼まれなかった作業が組み合わされ、案件の予算と作業時間が大きくなる一方、時給の差は小さいと報告する。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "SFTもデータ次第でRL並みに汎化する", "title": "Rethinking \"RL Generalizes, SFT Memorizes\": The Role of SFT Data", "url": "https://arxiv.org/abs/2611.14912", "authors": "Yunlong Hou ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Hou, Y., Zhang, F., Cheng, Y., Pan, J., Li, X., & Yang, Z. (2026). Rethinking \"RL Generalizes, SFT Memorizes\": The Role of SFT Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14912", "why": "検証可能な報酬による強化学習（RL）は汎化し、教師あり微調整（SFT）は暗記に偏るという通説を、Qwen2.5・Qwen3でSFTのデータの側から見直した。データ源の混ぜ方が重要で、正解の解答例の数をRLとそろえると汎化が大きく改善し、生成の総数をそろえるとRLと同程度に汎化すると報告する。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "両面市場の実験は「少ない側」を無作為化せよ", "title": "One-Sided Randomization in Two-Sided Platform Experiments: Which Side Should be Randomized?", "url": "https://arxiv.org/abs/2611.16406", "authors": "Ramesh Johari ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Johari, R., & Murthy, A. (2026). One-Sided Randomization in Two-Sided Platform Experiments: Which Side Should be Randomized? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16406", "why": "顧客と出品の両面をもつプラットフォームの実験で、どちらの側を無作為化すべきかを分析した。少ない側の無作為化は競合による干渉の偏りが小さく、多い側は標本が大きいという、偏りと分散のトレードオフに見える問題について、先着順の予約市場のモデルでは少ない側の無作為化が偏りと分散の両方で有利になりやすいことを示す。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "データセンター増設は卸電力価格を通じて家計に響く", "title": "Data-center growth impacts household electricity costs more through wholesale prices than through grid reinforcement", "url": "https://arxiv.org/abs/2611.16095", "authors": "Lingdong Zhou ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Zhou, L., Xia, W., Wang, J., Ding, F., & Zhu, X. (2026). Data-center growth impacts household electricity costs more through wholesale prices than through grid reinforcement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16095", "why": "テキサスで発表された371件・計38.9GWのデータセンター計画が家庭の電気料金に与える影響を、電源拡張、卸電力市場、送電増強、小売の費用配分をつないで推計した。代表的な場合で家庭の電気料金は1キロワット時あたり1.64セント上がり、その68%は卸電力価格の上昇、32%は送電料金によると報告する。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "実験結果を他の地域へ広げられるかの感度分析", "title": "A Sensitivity Framework for Assessing External Validity", "url": "https://arxiv.org/abs/2611.16242", "authors": "Ariel Boyarsky ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Boyarsky, A., Egami, N., & Namkoong, H. (2026). A Sensitivity Framework for Assessing External Validity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16242", "why": "実験の内的妥当性が高くても、他の地域に結果が一般化できるとは限らない。地域の数より効果を左右する地域変数が多い状況で、地域変数を通じた外挿の仮定を幅広く置ける部分識別の枠組みを作り、共分散行列が特異になる場合でも使えるバイアス補正の推定法を導いた。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "即答型AIモデルの能力と信頼性を測る", "title": "SO-Arena: Benchmarking the Capability Spectrum and Reliability of System One Models", "url": "https://arxiv.org/abs/2611.15777", "authors": "Lichen Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "apa": "Li, L., Dong, Z., Feng, S., Li, Q., & Wang, X. (2026). SO-Arena: Benchmarking the Capability Spectrum and Reliability of System One Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15777", "why": "長い推論の文章を生成せずに速く判断する「システム1」型のモデルについて、11領域・5つの能力群で能力の広がりと判断の信頼性を評価するベンチマークを作った。信頼できる出典と人手で確かめた正解ラベル、領域ごとの難度基準、サンドボックスでの対話的な評価を備える。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "EV補助金の導入と廃止がNZの販売を動かした", "title": "Introducing and Repealing an EV Subsidy: Evidence from New Zealand's Clean Car Discount", "url": "https://arxiv.org/abs/2611.15947", "authors": "Fabian Dunker ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Dunker, F., & Garg, J. (2026). Introducing and Repealing an EV Subsidy: Evidence from New Zealand's Clean Car Discount (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15947", "why": "ニュージーランドの低排出車への値引き制度（2021年導入、2022年から高排出車に課金、2023年末に廃止）が電気自動車の普及に与えた影響を、2014〜2024年の月次登録データで調べた。構造変化の検定と時間の回帰不連続で政策日に変化点があることを示し、オーストラリアのクイーンズランド州を比較対象にした差の差分析で因果効果を推定する。"}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "どのリーダーシップが学校の組織市民行動を高めるか", "title": "Leadership (Styles) and Different Forms of Organizational Citizenship Behavior in Schools: A Systematic Review and Meta-analysis", "url": "https://doi.org/10.2139/ssrn.7686718", "authors": "Florian S. Feuchter", "venue": "SSRN", "date": "2026-11-12", "apa": "Feuchter, F. S. (2026). Leadership (Styles) and Different Forms of Organizational Citizenship Behavior in Schools: A Systematic Review and Meta-analysis. https://doi.org/10.2139/ssrn.7686718", "why": "学校でのリーダーシップと組織市民行動（OCB）の関係を、118本の文献の整理と、22か国96標本・199の効果量（4万4,341人）の三水準メタ分析でまとめた。全体の平均相関はr=.39で、変革型と奉仕型のリーダーシップが最も強く関連したと報告する。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "雇用の続き方から労働者と企業の相性を測る", "title": "Human Capital in Context: What Employment Survival Reveals About Worker-Firm Match", "url": "https://arxiv.org/abs/2611.16058", "authors": "Jung Ho Choi ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Choi, J. H., & Milone, M. (2026). Human Capital in Context: What Employment Survival Reveals About Worker-Firm Match (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16058", "why": "最良の労働者は企業ごとに違うという考えから、雇用関係の存続から学ぶ労働者と企業の相性の指標を作った。経歴と企業の特徴を共通の空間に埋め込むニューラルネットで、1億100万人・840万社の10億人期以上を推定し、相性が0.1上がると離職のオッズが48%下がると報告する。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "データに依存があっても回帰不連続の推論は使える", "title": "Can We Ignore Data Dependence in Inference Implementation? A Positive Answer for Regression Discontinuity Designs", "url": "https://arxiv.org/abs/2611.15279", "authors": "Zihao Yuan", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Yuan, Z. (2026). Can We Ignore Data Dependence in Inference Implementation? A Positive Answer for Regression Discontinuity Designs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15279", "why": "回帰不連続デザインの推論は独立性を仮定するが、実際の割当変数や誤差には複雑な依存がありうる。従来の推論が抱える問題を明確にしたうえで、独立性を前提にした信頼区間を基準にしてその妥当性を回復する手続きを提案し、依存があっても漸近的に正確な被覆率を達成することを示す。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "給与格差は研究の「方向」まで変える", "title": "Unequal Rewards and the Direction of Scientific Work: Evidence from U.S. Public Universities", "url": "https://arxiv.org/abs/2611.16747", "authors": "Likun Cao", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Cao, L. (2026). Unequal Rewards and the Direction of Scientific Work: Evidence from U.S. Public Universities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16747", "why": "米国の公立大学93校・4,839学科の終身在職権トラックの教員10万5,050人の給与記録を使い、給与の格差が研究の量だけでなく、既存の路線を伸ばす研究か評価の枠組みを変える研究かという研究の種類に関係するかを調べた。格差の大きい競争は評価しやすい種類の貢献を報いやすいという理論を検証する。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "CEOの負債型報酬がグリーン特許を増やす", "title": "Green Innovation and CEO Inside Debt", "url": "https://doi.org/10.2139/ssrn.7684643", "authors": "Amirhossein Fard ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Fard, A., M. Miller, S., & Yang, T. (2026). Green Innovation and CEO Inside Debt. https://doi.org/10.2139/ssrn.7684643", "why": "CEOの報酬のうち年金や繰延報酬のような負債型の部分（インサイド・デット）が多い企業ほど、グリーン特許の数と質が高いことを示した。負債型の報酬は経営者のリスク回避を強めてR&Dを減らすと知られているだけに意外な結果で、環境リスクの大きい企業、在任の長いまたは若いCEO、持続可能性志向の強い企業で関係が強いと報告する。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "画像も学んだ言語モデルは文章だけでも空間的に考える", "title": "Emergent Vision-Shaped Thinking in Text-Only Reasoning through Multimodal Training", "url": "https://arxiv.org/abs/2611.14942", "authors": "Qi Zhang ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Zhang, Q., Wang, B., Sun, Q., & Zhang, H. (2026). Emergent Vision-Shaped Thinking in Text-Only Reasoning through Multimodal Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14942", "why": "マルチモーダル学習が、文章だけを入力したときの言語モデルの推論を形作るかを、6系統10構成のモデルで因果的な除去実験により調べた。隠れ状態の視覚-言語の軸を除去すると、Chameleon-7Bで空間的な想像を要する課題の正答率が27.6ポイント下がる一方、記号操作の課題は下がらない二重乖離を示した。"}, {"id": "pn14", "rank": 14, "field": "工学", "headline": "振動を遮る周期構造セルを数値検査つきで選ぶ", "title": "Selecting and verifying load-bearing periodic cells for elastic-wave band gaps with numerical acceptance checks", "url": "https://arxiv.org/abs/2611.14796", "authors": "Shaoliang Yang ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Yang, S., & Wang, J. (2026). Selecting and verifying load-bearing periodic cells for elastic-wave band gaps with numerical acceptance checks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14796", "why": "装置を支える剛性と、特定の周波数帯の弾性波を遮るバンドギャップを両立する周期セルを探す道具（AMM）を公開し、数値誤差で誤った合格判定をしないよう格子の細かさによる変化を見込む検査器を付けた。境界付近の1,500件の検査で、基準が支持する750件の主張のうち454件を受け入れ、誤った750件はすべて退けたと報告する。"}, {"id": "pn15", "rank": 15, "field": "開発経済学", "headline": "インド農村女性の就業率の回復を左右する要因", "title": "Factors Influencing Rural Female Workforce Participation in India, 2017- 2025: An Econometric Analysis Using District-Level Panel Data", "url": "https://arxiv.org/abs/2611.15430", "authors": "Bishwanath Goldar ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Goldar, B., & Aggarwal, S. C. (2026). Factors Influencing Rural Female Workforce Participation in India, 2017- 2025: An Econometric Analysis Using District-Level Panel Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15430", "why": "インド農村の女性の就業率は1993〜2018年に下がったが、2017〜18年の23.7%から2025年には44.9%に上がった。約500県の9年分のパネルデータで要因を分析し、幼い子の存在や世帯の実質所得の増加は就業を下げ、農村の臨時労働者の実質賃金の上昇は就業を上げると報告する。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "過少申告のある順序データの変化の変化法", "title": "Changes-in-Changes for Ordered Choice Models with Underreporting", "url": "https://arxiv.org/abs/2401.00618", "authors": "Daniel Gutknecht ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Gutknecht, D., & Liu, C. (2024). Changes-in-Changes for Ordered Choice Models with Underreporting (Version 5). arXiv. https://doi.org/10.48550/ARXIV.2401.00618", "why": "社会的に望ましくない行動の自己申告のように過少に申告されがちな順序のある結果について、差の差分析の一種である変化の変化法（Changes-in-Changes）を拡張した。反事実と実際の結果の分布、分位点の処置効果に非パラメトリックな上下限を導き、推定法を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得。arXivの番号は2024年の初版で、今回は改訂版", "preprint": true, "short": true, "p1": "社会的に望ましくない行動のように過少に申告されがちな順序のある結果について、差の差分析の一種である変化の変化法（Changes-in-Changes）で処置効果を評価できるようにした（抄録）。未査読のプレプリント。", "p3": "離散の変化の変化モデルが閾値を超える形で表せることを示し、過少申告がある場合の反事実と実際の結果の分布、分位点の処置効果に非パラメトリックな上下限を導いた。推定とブートストラップの推論、点識別できる半パラメトリックなモデルも示した（抄録）。", "p5": "上下限は追加の台の条件のもとで結果の水準全体にわたって鋭いことを示し、応用として米国のいくつかの州での娯楽用大麻の合法化が中学2年生の使用に与えた影響を調べた（抄録）。", "fun": "「たばこを吸ったことがありますか」と聞かれて、正直に答えない生徒はいる。答えが少なめにずれたデータで政策の効果を測ると、効果を見誤るおそれがある。この研究は、ずれの大きさが分からなくても、効果がこの範囲には入るという幅を数学的に求めた。分からないことを分からないまま正直に扱う発想が面白い。", "unverified": "本文を読めておらず、大麻合法化の応用で得られた効果の値は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "共変量を区分けすると識別の中身が変わる", "title": "Lost in the Bins: Treatment Effects with Discretized Covariates", "url": "https://arxiv.org/abs/2611.14789", "authors": "Cenchen Liu", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Liu, C. (2026). Lost in the Bins: Treatment Effects with Discretized Covariates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14789", "why": "平均独立の仮定で平均処置効果を識別するとき、共変量は区分けされた粗い形で使われることが多い。細かい共変量で成り立つ平均独立が粗くした共変量では成り立たないことがあり、粗くすると推定の精度だけでなく識別の内容そのものが変わると示し、処置群の効果と平均処置効果の偏りを特徴づけた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "平均処置効果の識別に使う共変量を粗く区分けすると、推定の精度だけでなく識別の中身そのものが変わることを示し、その偏りを評価する上下限の方法を作った（抄録）。未査読のプレプリント。", "p3": "細かい共変量で成り立つ平均独立が、区分けした共変量では成り立たない場合の偏りを、処置群の効果（ATT）と平均処置効果（ATE）について特徴づけた。区分けした水準で平均独立を緩めるc平均依存を導入し、鋭い上下限、標本での推定、ブートストラップの推論を示した（抄録）。", "p5": "Angrist（1998）の志願兵のデータへの応用で、早い時期の所得への正の効果（主に軍の給与）は最も弱い仮定でも保たれたが、後の民間所得への効果は平均独立を緩めると結論が出なかった（抄録）。", "fun": "年齢を「20代、30代」とまとめて比べるのは普通の手続きだ。でも、20歳と29歳で事情が大きく違うと、まとめた時点で「似た人どうしを比べる」という前提が崩れる。この研究は、まとめ方そのものが結論を変えうることを示し、どこまで言えるかの幅を出した。データの粗さが因果の結論を左右するという指摘が面白い。", "unverified": "本文を読めておらず、上下限の幅の具体的な値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "二方向クラスタデータの一様に正確な推論", "title": "Uniform Inference for Two-Way Clustered Data", "url": "https://arxiv.org/abs/2611.16584", "authors": "Ulrich Hounyo ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Hounyo, U., Lin, J., Song, X., & Wang, H. (2026). Uniform Inference for Two-Way Clustered Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16584", "why": "二方向にクラスタ化したデータの母平均について、データ生成過程が標本サイズとともに変わってもよい一様に正確な推論を示した。無作為なマッチングの標本平均を平均する推定量と閉形式の標準誤差により、既知の不可能性の結果と矛盾しない形で、実装しやすい信頼区間を作る。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "行と列の二方向にクラスタ化したデータ（例えば国×企業）の母平均について、データの依存の型によらず一様に正確な信頼区間を作る方法を示した（抄録）。未査読のプレプリント。", "p3": "無作為なマッチングで作った標本平均を平均する推定量を使い、閉形式の標準誤差で信頼区間を作る。分散推定量は半正定値で、スチューデント化した推定量は一様に漸近正規になる。GMMのパラメータの滑らかな関数にも拡張した（抄録）。", "p5": "既知の不可能性の結果（Menzel 2021）と矛盾しないこと、一様な妥当性の代償として退化した場合に収束が遅くなることを示した。シミュレーションでは、考えた依存の型のいずれでも被覆率が名目値に近かった（抄録）。", "fun": "データが「行」と「列」の両方でつながっていると、同じ行どうし、同じ列どうしで似てしまい、普通の誤差の計算は楽観的になる。この研究は、行と列をくじ引きのように組み合わせ直してから平均することで、つながり方の強さが分からなくても使える信頼区間を作った。偶然を逆手にとる工夫が面白い。", "unverified": "本文を読めておらず、シミュレーションの設定と実データへの応用の有無は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "交差適合の異質性検定の帰無分布は正規でない", "title": "Non-normal Limits and Joint Calibration of Cross-fitted Heterogeneity Tests", "url": "https://arxiv.org/abs/2611.15333", "authors": "Even He ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "He, E., & Yan, Z. (2026). Non-normal Limits and Joint Calibration of Cross-fitted Heterogeneity Tests (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15333", "why": "無作為化実験で学習した順位づけが処置の効く人を分けられるかを交差適合で検定する方法では、帰無仮説の下でも各分割の推定が互いに依存する。この依存で帰無分布の分散だけでなく形が変わり、2分割では二峰、多分割では歪んだ分布になるため、正規分布との比較は誤りうることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "無作為化実験で処置の効く人を見分けられるかを交差適合で検定する標準的な方法は、帰無分布が正規でないため第一種の過誤を大きく膨らませうると示し、正しい基準分布を作る共同較正を提案した（抄録）。未査読のプレプリント。", "p3": "各分割は他の分割で学習したモデルで順位づけされるため、帰無仮説の下でも分割の推定が互いに依存する。この依存で分布の形が変わる。統計量は保ったまま、順位を選ぶ量と評価する量を一緒にシミュレートして同じ選択を当てはめる（抄録）。", "p5": "共変量1つの最小二乗では2分割で二峰、多分割で歪んだ分布になり、どの分散補正でも水準は戻らず、公表された中心極限定理の反例になる。臨床と販促の試験への応用で、標準の検定は偽の棄却を生み、共同較正はそれを避けた（抄録）。", "fun": "AIで「この薬が効きそうな人」を選び、本当に効いたかを同じ実験データで確かめると、AIが偶然のばらつきに合わせて選んだだけでも「効いた」と出やすくなる。この研究は、その思い込みの原因が統計量の分布の形のずれにあると突き止め、正しい物差しを作り直した。データを使い回すときの落とし穴の話だ。", "unverified": "本文を読めておらず、応用での過誤の膨らみの大きさは未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "モデルが棄却された後の「修理」を考えた推論", "title": "Inference After Model Refutation: Uniform Post-Relaxation Inference for Partially Identified Models", "url": "https://arxiv.org/abs/2611.15552", "authors": "Ulrich Hounyo", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Hounyo, U. (2026). Inference After Model Refutation: Uniform Post-Relaxation Inference for Partially Identified Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15552", "why": "データが計量経済モデルを棄却したとき、どの識別の仮定を緩めるかは一つに決まらない。最小限の修理が複数ありうるとき、すべての修理にわたって同時に成り立つ信頼の事象を保つ射影の方法を提案し、同じ保証をもつ集合の中で最小であることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "データが計量経済モデルを棄却したとき、どの識別の仮定を外すかが一つに決まらない状況でも、すべての候補の修理にわたって有効な推論を行う方法（事後緩和の射影）を提案した（抄録）。未査読のプレプリント。", "p3": "最小限でありうるすべての修理に一つの同時の信頼の事象を通し、修理ごとの上下限を使うと、帯と整合する緩和後の対象の和集合に一致させる。修理の学習の限界、最小修理の対応の摂動半径、第一段階がゼロの場合の誘導型も導いた（抄録）。", "p5": "国ごとの制度と所得のデータへの応用では、どの歴史的な操作変数を外すべきかはデータから決まらないが、許されるどの最小修理でも制度が所得に正の効果をもつという結論になったと報告する（抄録）。", "fun": "実験の前提のどれかが間違っていると分かっても、どれが間違いかは分からないことがある。そこで一つを選んで外すと、外し方しだいで結論が変わってしまう。この研究は、ありうる外し方を全部同時に考えて、それでも言える結論だけを残す方法を作った。制度と所得の例では、どう外しても制度は所得を上げていた。", "unverified": "本文を読めておらず、応用での効果の大きさは未確認。"}}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "対象の条件を操作される場合の政策学習", "title": "Strategic Causal Policy Learning with Manipulable Eligibility", "url": "https://arxiv.org/abs/2611.14572", "authors": "Suhwan Bong", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Bong, S. (2026). Strategic Causal Policy Learning with Manipulable Eligibility (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14572", "why": "条件付き平均処置効果が非負の人を処置するという標準の規則は、対象の条件となる共変量を人々が政策の発表後に操作できると失敗しうる。操作の費用を表す枠組みで戦略的な処置の割当と厚生の損失を分解し、線形の効果と二次の操作費用のもとで閾値の補正を閉形式で導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "政策の対象を決める共変量を人々が発表後に操作できるとき、因果効果にもとづく政策学習の標準の規則がどう失敗し、閾値をどう補正すべきかを示した（抄録）。未査読のプレプリント。", "p3": "条件付き平均処置効果（CATE）が非負の人を処置するという規則に対し、操作の費用を表す枠組みで戦略的な処置の割当を特徴づけ、厚生の損失を、効く人を取りこぼす損失と効かない人を処置する損失に分けた（抄録）。", "p5": "線形のCATEと二次の操作費用のもとで閾値の補正を閉形式で導き、費用が均一なら一つの補正で理想の割当を回復できる。費用が異なると、厚生最大化、各点の安全性、集団の最悪の後悔が別々の閾値を支持すると示した（抄録）。", "fun": "「所得がこれ以下なら補助」と決めると、所得を少なく見せようとする人が出てくる。すると、本当に助けたい人に届かなかったり、効かない人に配ったりしてしまう。この研究は、人がルールに合わせて動くことまで見込んで線を引き直す方法を数学で示した。ルールを作る側と使う側の駆け引きを扱う点が面白い。", "unverified": "本文を読めておらず、シミュレーションの結果の具体的な値は未確認。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "合理的不注意の離散選択モデルを識別する", "title": "Identification of Rational Inattention-Additive Random Utility Models", "url": "https://arxiv.org/abs/2611.14752", "authors": "Dennis Kristensen ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Kristensen, D., & Zhu, R. (2026). Identification of Rational Inattention-Additive Random Utility Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14752", "why": "Matějka and McKay（2015）の合理的不注意の離散選択モデルに加法的な観測されない異質性を加えた計量モデルを導入した。観測されない変数の分布と意思決定者の事前分布が未知でも、モデルの体系的な要素の一部が非パラメトリックに識別されることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "情報を集める手間を考える合理的不注意の離散選択モデルに、観測されない異質性を加えた新しい計量モデルを導入し、その識別の条件を示した（抄録）。未査読のプレプリント。", "p3": "Matějka and McKay（2015）の合理的不注意の離散選択モデルに、加法的な観測されない異質性を入れたモデルを考えた（抄録）。", "p5": "観測されない変数の分布と意思決定者の事前分布がどちらも分析者に未知でも、モデルの体系的な要素の一部が非パラメトリックに識別されることを示した。事前分布について追加の情報があれば、さらに強い識別の結果が得られる（抄録）。", "fun": "人は商品を選ぶとき、全部を調べ尽くすわけではない。調べる手間と得をはかりにかけて、ほどほどに調べて選ぶ。この「合理的な手抜き」を含む選択のモデルは、データから中身を推定できるのかが問題だった。この研究は、人の思い込みの中身が分からなくても、一部は推定できると示した。", "unverified": "本文を読めておらず、識別に必要な条件の詳細と実データへの応用の有無は未確認。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "間隔の統計量で回帰不連続の密度の跳びを検定", "title": "Testing Density Discontinuity Using Spacings", "url": "https://arxiv.org/abs/2611.16199", "authors": "William T. Firmin", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Firmin, W. T. (2026). Testing Density Discontinuity Using Spacings (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16199", "why": "回帰不連続デザインでは、割当変数の密度がカットオフで跳ばないかを検定して仮定の信頼性を確かめる。カットオフの両側の順序統計量の間隔を使う新しい検定を提案し、使う間隔の数を固定した場合と緩やかに増やす場合の性質を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "回帰不連続デザインで、割当変数の密度がカットオフで跳ぶか（操作の兆候）を、並べた観測値の間隔（スペーシング）を使って検定する新しい方法を提案した（抄録）。未査読のプレプリント。", "p3": "カットオフの両側でq個の間隔を使い、弱い仮定でもふるまいのよい連続の統計量を作った。qを固定する場合とゆっくり増やす場合の2つの漸近の枠組みで性質を調べた（抄録）。", "p5": "qを固定すると利用者による乱数化なしに漸近的に正確な大きさを達成し、qをゆっくり増やすと大きさを保ったまま一致性をもつ。同じく弱い仮定のBugni and Canay（2021）の検定と比べ、調整パラメータへの敏感さが小さく、その検定がうまく調整された場合と同程度の性能だった（抄録）。", "fun": "「60点以上なら合格」のような境目のすぐ上に人が不自然に集まっていたら、点数が操作されたのかもしれない。この研究は、境目のまわりで隣どうしの点数の間隔がどれだけ空いているかを見ることで、その集まり方を検定する。間隔という素朴な量に着目したのが面白い。", "unverified": "本文を読めておらず、実データへの応用の有無は未確認。"}}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "空間交絡の下で曝露の効果を識別できる条件", "title": "Identifiability and partial identification under spatial confounding in additive risk models", "url": "https://arxiv.org/abs/2611.16994", "authors": "Sheng Pan", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Pan, S. (2026). Identifiability and partial identification under spatial confounding in additive risk models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16994", "why": "環境の曝露と観測されない背景要因が広い地理で一緒に変わると、曝露の効果と空間交絡を分けにくい。加法的なポアソン過程モデルの平滑化作用素を分解し、曝露係数の情報の損失は平滑化の総量ではなく、曝露との向きの重なりで決まることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "環境曝露の効果を地域のデータで推定するとき、空間的な交絡（曝露と背景要因が同じように地理的に変わること）でどれだけ情報が失われるかを分解し、残る偏りに上下限を与える方法を作った（抄録）。未査読のプレプリント。", "p3": "加法的なポアソン点過程モデルのフィッシャー重みつき平滑化作用素を分解し、曝露係数の情報の損失は平滑化の総量ではなく、曝露との向きの重なり（罰則つき共線的重なり）で決まると示した。観測できる基準の共変量と負の対照の結果で上下限を作る（抄録）。", "p5": "空間の核を回転させると総容量を保ったまま情報の損失が変わり、どの平滑化の尺度も常に最適ではない。シミュレーションとイングランドの小児の呼吸器死亡の分析で方法を示した（抄録）。", "fun": "大気汚染の多い地域で病気が多くても、それが汚染のせいか、同じ地域に多い別の要因のせいかは見分けにくい。この研究は、汚染と別の要因の地図上の「向きの重なり」が問題の核心だと数学的に示し、見分けきれない部分は幅として正直に示す方法を作った。地図どうしの重なりで考える発想が面白い。", "unverified": "本文を読めておらず、応用での推定値と上下限の幅は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "推薦がいつ好奇心をかき立てるかを測る", "title": "When Does a Recommendation Spark Curiosity? Theory, Measurement, and Field Evidence", "url": "https://arxiv.org/abs/2611.14938", "authors": "Pan Li ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Li, P., & Tuzhilin, A. (2026). When Does a Recommendation Spark Curiosity? Theory, Measurement, and Field Evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14938", "why": "好奇心の情報ギャップ理論を5つの公理に定式化し、推薦された項目が消費者に引き起こす好奇心の計算指標を作った。調査で自己申告の好奇心と一致することを確かめ、フィールドでの証拠も示すと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "推薦された項目が利用者に引き起こす好奇心を計算できる指標を作り、それを組み込んだ推薦システムが実際の動画配信で視聴を増やすことを示した（抄録）。未査読のプレプリント。", "p3": "好奇心の情報ギャップ理論を5つの公理に定式化して標準的な計算式を作り、調査で自己申告の好奇心と比べた。この指標を効用関数に入れた推薦システムを作り、3つの実データでのオフライン実験と、アジアの大手動画配信での大規模なオンライン実験で評価した（抄録）。", "p5": "指標は自己申告の好奇心と一致し、他の代理指標を上回った。オフラインでは最新の手法を有意に上回り、オンライン実験ではクリック率、視聴数、視聴時間を本番のシステムより有意に増やし、その後導入されて稼働していると報告する（抄録）。", "fun": "おすすめ機能は、好きそうなものばかり出して同じような動画の繰り返しになりがちだ。この研究は「知っていることと知りたいことのすき間」という好奇心の理論を数式にし、ちょうど気になる動画を混ぜる仕組みを作った。実際の動画サービスで視聴が増えたという。心理学の理論が計算式になって働く点が面白い。", "unverified": "本文を読めておらず、オンライン実験の効果の大きさと配信サービス名は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "決算サプライズの大きさから学ぶ投資家", "title": "Huge If True: Learning from the Size of the Surprise", "url": "https://arxiv.org/abs/2611.15747", "authors": "Thomas Graeber ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Graeber, T., Roth, C., Sammon, M., & Schesch, C. (2026). Huge If True: Learning from the Size of the Surprise (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.15747", "why": "決算サプライズへの株価の反応は、利益を価値に換算する未知の倍率に依存し、投資家は同じ数字から知らせと倍率の両方を学ぶ。倍率の不確実性が大きいと平均の反応は弱まるがサプライズがゼロ付近では急になることをモデルで示し、報酬つきの実験と実際の決算発表で確かめた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "決算サプライズへの株価の反応が、サプライズがゼロ付近で急になり平均では弱まるという形になることを、利益を価値に換える倍率の不確実性から説明した（抄録）。未査読のプレプリント。", "p3": "投資家は同じ数字から知らせの中身と倍率の両方を学ぶので、大きなサプライズは倍率が小さいこと、小さなサプライズは倍率が大きいことを示唆しうる、というモデルを作った。報酬つきの実験と実際の決算発表で確かめた（抄録）。", "p5": "実験では処理の制約が大きいほど平均の感応度は下がり、ゼロ付近では上がった。実際の決算発表でも、評価の不確実性が高い銘柄ほど平均では反応が弱く、ゼロ付近では反応が急だった（抄録）。", "fun": "「利益が予想より大きく上回った」と聞くと株価は大きく動きそうだが、あまりに大きなサプライズは「今回だけの特別な事情かも」と疑われる。この研究は、投資家が数字の大きさそのものから、その数字をどれだけ信じるかまで学んでいると考え、ゼロ付近の小さな驚きにこそ敏感になるという意外な形を説明した。", "unverified": "本文を読めておらず、実験の参加者数と実データの標本の詳細は未確認。"}}, {"id": "pn27", "rank": 27, "field": "開発経済学", "headline": "中国の自由貿易試験区は都市間の共同研究を増やしたか", "title": "Pilot Free Trade Zones and Inter-City Innovation Collaboration in China: Evidence from Staggered Designation", "url": "https://doi.org/10.2139/ssrn.7686410", "authors": "Muhammad Qayyum ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Qayyum, M., & Yu, Y. (2026). Pilot Free Trade Zones and Inter-City Innovation Collaboration in China: Evidence from Staggered Designation. https://doi.org/10.2139/ssrn.7686410", "why": "中国の自由貿易試験区の指定が、指定都市の企業と他都市の企業の共同特許を変えたかを、296都市・2009〜2022年のパネルで調べた。国務院の文書で処置を確かめて6都市の符号を訂正し、処置の時期が異なる差の差分析（Callaway-Sant'Anna）で効果を推定する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "中国の自由貿易試験区の指定が、指定都市の企業と他都市の企業の共同特許を増やしたかを、処置の時期の違いに頑健な差の差分析で調べた（抄録）。未査読のプレプリント。", "p3": "296の地級市の2009〜2022年のパネルで、国務院の文書で処置を確かめ（6都市の符号を訂正し、6つの時期の52都市）、Callaway-Sant'Annaの方法でまだ処置されていない都市を対照に推定した（抄録）。", "p5": "指定は実用新案の共同特許の約19%増（95%信頼区間2〜39%）、全種類の約14%増（−1〜31%）と結び付いたが、4種類の多重補正を通らず、基準時点の共変量を外すと正の推定は消えた。発明特許の効果は小さく不確か、意匠は効果がなかった（抄録）。", "fun": "特区を作ると、その都市の企業は他の都市の企業と一緒に発明するようになるのか。この研究は、結果をよく見せる方向ではなく、どこまで言えて、どこから言えないかを丁寧に示している。条件の置き方ひとつで効果が消えることまで報告し、分析の前提が結論を左右することを正直に見せている点が面白い。", "unverified": "本文を読めておらず、事前の傾向の検定の詳細は未確認。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "レモン市場での「無秩序の代償」の上限", "title": "The Price of Anarchy in Markets for Lemons", "url": "https://arxiv.org/abs/2611.14858", "authors": "Naveen Durvasula ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Durvasula, N., & Roughgarden, T. (2026). The Price of Anarchy in Markets for Lemons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14858", "why": "相互依存の評価をもつ単純な二者間取引の仕組みで、最悪の均衡でも最善の取引利益の一定割合を確保できる条件を示した。選別による非効率と逆選択の両方がある状況で、まれな悲観的な売り手のシグナルと楽観的な買い手のシグナルの役割を定量化する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "相互依存の評価（いわゆるレモン市場）をもつ単純な二者間の取引の仕組みで、最悪の均衡でも最善の取引利益の一定割合を確保できる条件を示した（抄録）。未査読のプレプリント。", "p3": "提示する価格が提案者の私的情報を伝えるため均衡は複雑になる。均衡の取引利益を、独立した私的価値をもつ補助的な市場での提案者の利益に結び付けて評価した（抄録）。", "p5": "選別による非効率と逆選択の両方があっても、広い条件のもとで逐次均衡が最善の取引利益の一定割合を保証する。その上界は、まれな悲観的な売り手のシグナルと、まれな楽観的な買い手のシグナルの役割を定量化し、売り手・買い手・ランダムのどちらが提案する仕組みにも当てはまる（抄録）。", "fun": "中古車の売り手は車の欠陥を知っているが、買い手は知らない。この情報の差のせいで、うまくいけば成立するはずの取引が成立しないことがある（レモン市場）。この研究は、それでも最悪の場合に失われる取引の利益には上限があることを示した。市場の失敗が「どれほどひどくなりうるか」を測るという問いが面白い。", "unverified": "本文を読めておらず、保証される割合の具体的な値と条件は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "選べる案が多いほど提案は信用されない", "title": "The Cherry-Picking Trap", "url": "https://arxiv.org/abs/2611.14983", "authors": "S. Nageeb Ali ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Ali, S. N., Mihm, M., & Siga, L. (2026). The Cherry-Picking Trap (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14983", "why": "情報をもつ提案者が実行可能な政策の「かご」から一つを提案し、応答者が承認するかを決めるモデルで、利害がおおむね一致していても不信が生まれることを示した。かごが大きいとパレート改善の案がある可能性は高まるが、提案者が自分に有利な案を選ぶ余地も増え、唯一の均衡ではパレート改善の提案がしばしば合理的に退けられる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "情報をもつ提案者が政策を提案するとき、選べる案が多いほど提案が疑われ、利害がおおむね一致していても合意が成り立たなくなる「えり好みの罠」をモデルで示した（抄録）。未査読のプレプリント。", "p3": "提案者は実行可能な政策の「かご」を私的に観察して一つを提案し、評価の専門知識をもたないこともある応答者が承認するかを決める、というゲームを分析した（抄録）。", "p5": "かごが大きいとパレート改善の案がある可能性は高まるが、相手を犠牲に自分に有利な案を選ぶ余地も増える。唯一の均衡では、パレート改善の提案がしばしば行われ、それでも合理的に退けられると示した（抄録）。", "fun": "選択肢が多いほど、みんなが得をする案が見つかりやすいはずだ。ところが提案する側に選択肢が多いと、聞く側は「その中から自分に都合のよいものを選んだのでは」と疑ってしまう。その結果、本当にみんなが得をする案まで断られる。柔軟さがかえって不信を生むという逆説を、数学できれいに示した点が面白い。", "unverified": "本文を読めておらず、モデルの仮定の詳細と応用例は未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "期待が固定されていないとインフレの反応は3倍", "title": "Inflation-Expectations Anchoring and the State-Dependent Phillips Curve", "url": "https://doi.org/10.2139/ssrn.7683878", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-12", "apa": "Ramakrishnan, V. (2026). Inflation-Expectations Anchoring and the State-Dependent Phillips Curve. https://doi.org/10.2139/ssrn.7683878", "why": "フィリップス曲線の傾きがインフレ期待の固定の度合いで変わるかを、期待の固定度によって動学が変わる交互作用VARで調べた。米国の1968〜2026年のデータで、期待が固定されていないとき需要ショックへのインフレの累積反応は、固定されているときの約3倍になると報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "インフレ期待がしっかり固定されているかどうかで、需要ショックに対するインフレの反応（フィリップス曲線の傾き）が大きく変わることを示した（抄録）。未査読のプレプリント。", "p3": "専門家予測調査とミシガン大学の調査の個票から期待の固定度を測り、動学が固定度で変わる交互作用VARで、米国の1968年第4四半期〜2026年第1四半期を推定した。地域別、ブラジル、ユーロ圏も調べた（抄録）。", "p5": "期待が固定されていないとき、識別した需要ショックへのインフレの累積反応は固定されているときの約3倍で、ショックが大きいのではなく伝わり方が強いためだった。2021〜23年のショックが1970年代の固定度で起きていれば、コアインフレのピークは実際の6.4%でなく約10%になったと試算する（抄録）。", "fun": "「物価はこの先も2%くらい」と人々が信じていれば、景気が過熱しても物価はあまり上がらない。信じていなければ、同じ過熱でも物価は大きく上がる。この研究は、その差がおよそ3倍だと推定した。人々の予想という目に見えないものが、物価の動きを大きく左右するという点が面白い。", "unverified": "本文を読めておらず、需要ショックの識別の方法と頑健性の検証は未確認。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "北欧の電力価格は危機後に連動しなくなった", "title": "Price co-movement and price information diverge across Nordic electricity zones after the energy crisis", "url": "https://arxiv.org/abs/2611.16657", "authors": "My Thi Diem Phan ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "apa": "Phan, M. T. D., Truong, T. T., Ha, H. P., & Nguyen, D. T. (2026). Price co-movement and price information diverge across Nordic electricity zones after the energy crisis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.16657", "why": "2021〜2022年のエネルギー危機の後、北欧の入札区域の前日価格は一緒に動かなくなった。2018〜2025年のノルウェーとスウェーデンの各区域とドイツ・ルクセンブルク区域の連動を測り、連動の分岐が価格のもつ情報を変えるか、どの区域で風力・太陽光の予測が価格予測の精度に効くかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "エネルギー危機の後、北欧の電力入札区域の価格は大陸と連動しなくなったが、価格予測に効く情報の差はこの連動の分岐とは一致しないことを示した（抄録）。未査読のプレプリント。", "p3": "2018〜2025年のノルウェーとスウェーデンの各区域とドイツ・ルクセンブルク区域の連動を測り、2024年のデータで選んだ一つのモデルで2025年の前日価格を予測して、どの入力が精度を上げるかを区域ごとに調べた（抄録）。", "p5": "2024年、南の4区域は大陸と強く連動し（相関0.54〜0.71）、北の4区域は弱かった（0.25〜0.30）。前日の隣接価格は誤差を最大2.2%しか減らさず、送電会社の風力・太陽光予測を外すと誤差はノルウェーで最大6%、スウェーデンで8〜16%、大陸で31%増えた（抄録）。", "fun": "電気の値段は、送電線でつながった地域どうしで似た動きをすることが多い。北欧では危機の後この連動が崩れたが、それなら「大陸とつながっている地域ほど大陸の情報が役立つ」と考えたくなる。調べると、予測に効く情報の差は連動の強さではなく国ごとの発電の仕組みで決まっていた。直感が外れる点が面白い。", "unverified": "本文を読めておらず、予測モデルの種類と評価期間の詳細は未確認。"}}, {"id": "pn32", "rank": 32, "field": "経営学", "headline": "需要が遅れて混ざって観測される収益管理", "title": "Online Network Revenue Management with Delayed and Composite Demand Feedback", "url": "https://doi.org/10.2139/ssrn.7685644", "authors": "Chenrui Li ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Li, C., Qin, H., & Wang, M. (2026). Online Network Revenue Management with Delayed and Composite Demand Feedback. https://doi.org/10.2139/ssrn.7685644", "why": "価格決定の効果が数期にわたって現れ、観測される売上が過去の複数の決定による購入の合計になる状況で、ネットワーク収益管理のオンライン学習を扱った。行動の学習、資源価格の更新、容量の管理を分ける主双対の方策を2つ作り、後悔の上界を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "価格を決めてから需要が数期にわたって現れ、売上が過去の複数の決定の結果の合計として観測される状況で、在庫などの資源を管理しながら価格を学習する方法を作った（抄録）。未査読のプレプリント。", "p3": "行動の学習、資源価格の更新、容量の管理を分ける主双対の方策を2つ作った。需要が確率的で帰属できる場合のEM-PDと、敵対的で帰属できない場合に無作為なブロックで学習と制御を調整するRTI-PDである（抄録）。", "p5": "EM-PDは行動数K、期間T、最大の遅れLに対しO(√KT+K(L+1))の後悔で、標準の学習率を保ち遅れの罰が加わるだけだった。RTI-PDは容量と期間の比ρの割合を保証した。どちらも常に実行可能で、数値実験で有効だった（抄録）。", "fun": "セールの効果は当日だけでなく数日後の購入にも表れ、しかも別の日のセールの効果と混ざって見える。どの値付
