<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

か", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr45", "rank": 45, "headline": "迎合的なAIを利用者はどう評価するか", "title": "Mind the Accuracy-Approval Gap: How Users Evaluate Sycophantic AI in Everyday Tasks", "url": "https://arxiv.org/abs/2611.16722", "authors": "Wajiha Naveed ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr46", "rank": 46, "headline": "司令役なしの多エージェント協調を評価する基盤", "title": "DecArena: Evaluating Large-Scale Decentralized Multi-Agent Collaboration", "url": "https://arxiv.org/abs/2611.15521", "authors": "Jiali Cheng ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr47", "rank": 47, "headline": "AIが生んだ資産と自社開発AIの会計処理", "title": "Accounting for AI-generated Assets and Internally Developed AI Systems", "url": "https://doi.org/10.2139/ssrn.7685998", "authors": "Chryspine Vicent Machesha", "venue": "SSRN", "date": "2026-11-13", "theme": "会計情報科学", "theme_no": 2}, {"id": "pr48", "rank": 48, "headline": "金融機関のデジタル技術の開示と業績", "title": "Digital Technology Disclosure and Firm Performance: Evidence from U.S. Financial Institutions", "url": "https://doi.org/10.21203/rs.3.rs-11516669/v1", "authors": "Diaa Weiss ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "theme": "会計情報科学", "theme_no": 2}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "生成AIでフリーランスの仕事は束ね直される", "title": "The Rebundling of Freelance Work in the AI Age", "url": "https://arxiv.org/abs/2611.14708", "authors": "Caroline Chin ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "対話型AIで人々が行う作業と、フリーランス仲介サイトUpworkで発注される仕事を比べた。ChatGPTでよく行われる作業は市場での比重を下げ、そうでない作業は比重を上げた。AI関連の求人では以前は一緒に頼まれなかった作業が組み合わされ、案件の予算と作業時間が大きくなる一方、時給の差は小さいと報告する。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "SFTもデータ次第でRL並みに汎化する", "title": "Rethinking \"RL Generalizes, SFT Memorizes\": The Role of SFT Data", "url": "https://arxiv.org/abs/2611.14912", "authors": "Yunlong Hou ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "検証可能な報酬による強化学習（RL）は汎化し、教師あり微調整（SFT）は暗記に偏るという通説を、Qwen2.5・Qwen3でSFTのデータの側から見直した。データ源の混ぜ方が重要で、正解の解答例の数をRLとそろえると汎化が大きく改善し、生成の総数をそろえるとRLと同程度に汎化すると報告する。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "両面市場の実験は「少ない側」を無作為化せよ", "title": "One-Sided Randomization in Two-Sided Platform Experiments: Which Side Should be Randomized?", "url": "https://arxiv.org/abs/2611.16406", "authors": "Ramesh Johari ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "顧客と出品の両面をもつプラットフォームの実験で、どちらの側を無作為化すべきかを分析した。少ない側の無作為化は競合による干渉の偏りが小さく、多い側は標本が大きいという、偏りと分散のトレードオフに見える問題について、先着順の予約市場のモデルでは少ない側の無作為化が偏りと分散の両方で有利になりやすいことを示す。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "データセンター増設は卸電力価格を通じて家計に響く", "title": "Data-center growth impacts household electricity costs more through wholesale prices than through grid reinforcement", "url": "https://arxiv.org/abs/2611.16095", "authors": "Lingdong Zhou ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "テキサスで発表された371件・計38.9GWのデータセンター計画が家庭の電気料金に与える影響を、電源拡張、卸電力市場、送電増強、小売の費用配分をつないで推計した。代表的な場合で家庭の電気料金は1キロワット時あたり1.64セント上がり、その68%は卸電力価格の上昇、32%は送電料金によると報告する。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "実験結果を他の地域へ広げられるかの感度分析", "title": "A Sensitivity Framework for Assessing External Validity", "url": "https://arxiv.org/abs/2611.16242", "authors": "Ariel Boyarsky ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "実験の内的妥当性が高くても、他の地域に結果が一般化できるとは限らない。地域の数より効果を左右する地域変数が多い状況で、地域変数を通じた外挿の仮定を幅広く置ける部分識別の枠組みを作り、共分散行列が特異になる場合でも使えるバイアス補正の推定法を導いた。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "即答型AIモデルの能力と信頼性を測る", "title": "SO-Arena: Benchmarking the Capability Spectrum and Reliability of System One Models", "url": "https://arxiv.org/abs/2611.15777", "authors": "Lichen Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "長い推論の文章を生成せずに速く判断する「システム1」型のモデルについて、11領域・5つの能力群で能力の広がりと判断の信頼性を評価するベンチマークを作った。信頼できる出典と人手で確かめた正解ラベル、領域ごとの難度基準、サンドボックスでの対話的な評価を備える。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "EV補助金の導入と廃止がNZの販売を動かした", "title": "Introducing and Repealing an EV Subsidy: Evidence from New Zealand's Clean Car Discount", "url": "https://arxiv.org/abs/2611.15947", "authors": "Fabian Dunker ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "ニュージーランドの低排出車への値引き制度（2021年導入、2022年から高排出車に課金、2023年末に廃止）が電気自動車の普及に与えた影響を、2014〜2024年の月次登録データで調べた。構造変化の検定と時間の回帰不連続で政策日に変化点があることを示し、オーストラリアのクイーンズランド州を比較対象にした差の差分析で因果効果を推定する。"}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "どのリーダーシップが学校の組織市民行動を高めるか", "title": "Leadership (Styles) and Different Forms of Organizational Citizenship Behavior in Schools: A Systematic Review and Meta-analysis", "url": "https://doi.org/10.2139/ssrn.7686718", "authors": "Florian S. Feuchter", "venue": "SSRN", "date": "2026-11-12", "why": "学校でのリーダーシップと組織市民行動（OCB）の関係を、118本の文献の整理と、22か国96標本・199の効果量（4万4,341人）の三水準メタ分析でまとめた。全体の平均相関はr=.39で、変革型と奉仕型のリーダーシップが最も強く関連したと報告する。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "雇用の続き方から労働者と企業の相性を測る", "title": "Human Capital in Context: What Employment Survival Reveals About Worker-Firm Match", "url": "https://arxiv.org/abs/2611.16058", "authors": "Jung Ho Choi ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "最良の労働者は企業ごとに違うという考えから、雇用関係の存続から学ぶ労働者と企業の相性の指標を作った。経歴と企業の特徴を共通の空間に埋め込むニューラルネットで、1億100万人・840万社の10億人期以上を推定し、相性が0.1上がると離職のオッズが48%下がると報告する。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "データに依存があっても回帰不連続の推論は使える", "title": "Can We Ignore Data Dependence in Inference Implementation? A Positive Answer for Regression Discontinuity Designs", "url": "https://arxiv.org/abs/2611.15279", "authors": "Zihao Yuan", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "回帰不連続デザインの推論は独立性を仮定するが、実際の割当変数や誤差には複雑な依存がありうる。従来の推論が抱える問題を明確にしたうえで、独立性を前提にした信頼区間を基準にしてその妥当性を回復する手続きを提案し、依存があっても漸近的に正確な被覆率を達成することを示す。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "給与格差は研究の「方向」まで変える", "title": "Unequal Rewards and the Direction of Scientific Work: Evidence from U.S. Public Universities", "url": "https://arxiv.org/abs/2611.16747", "authors": "Likun Cao", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "米国の公立大学93校・4,839学科の終身在職権トラックの教員10万5,050人の給与記録を使い、給与の格差が研究の量だけでなく、既存の路線を伸ばす研究か評価の枠組みを変える研究かという研究の種類に関係するかを調べた。格差の大きい競争は評価しやすい種類の貢献を報いやすいという理論を検証する。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "CEOの負債型報酬がグリーン特許を増やす", "title": "Green Innovation and CEO Inside Debt", "url": "https://doi.org/10.2139/ssrn.7684643", "authors": "Amirhossein Fard ほか", "venue": "SSRN", "date": "2026-11-13", "why": "CEOの報酬のうち年金や繰延報酬のような負債型の部分（インサイド・デット）が多い企業ほど、グリーン特許の数と質が高いことを示した。負債型の報酬は経営者のリスク回避を強めてR&Dを減らすと知られているだけに意外な結果で、環境リスクの大きい企業、在任の長いまたは若いCEO、持続可能性志向の強い企業で関係が強いと報告する。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "画像も学んだ言語モデルは文章だけでも空間的に考える", "title": "Emergent Vision-Shaped Thinking in Text-Only Reasoning through Multimodal Training", "url": "https://arxiv.org/abs/2611.14942", "authors": "Qi Zhang ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "マルチモーダル学習が、文章だけを入力したときの言語モデルの推論を形作るかを、6系統10構成のモデルで因果的な除去実験により調べた。隠れ状態の視覚-言語の軸を除去すると、Chameleon-7Bで空間的な想像を要する課題の正答率が27.6ポイント下がる一方、記号操作の課題は下がらない二重乖離を示した。"}, {"id": "pn14", "rank": 14, "field": "工学", "headline": "振動を遮る周期構造セルを数値検査つきで選ぶ", "title": "Selecting and verifying load-bearing periodic cells for elastic-wave band gaps with numerical acceptance checks", "url": "https://arxiv.org/abs/2611.14796", "authors": "Shaoliang Yang ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "装置を支える剛性と、特定の周波数帯の弾性波を遮るバンドギャップを両立する周期セルを探す道具（AMM）を公開し、数値誤差で誤った合格判定をしないよう格子の細かさによる変化を見込む検査器を付けた。境界付近の1,500件の検査で、基準が支持する750件の主張のうち454件を受け入れ、誤った750件はすべて退けたと報告する。"}, {"id": "pn15", "rank": 15, "field": "開発経済学", "headline": "インド農村女性の就業率の回復を左右する要因", "title": "Factors Influencing Rural Female Workforce Participation in India, 2017- 2025: An Econometric Analysis Using District-Level Panel Data", "url": "https://arxiv.org/abs/2611.15430", "authors": "Bishwanath Goldar ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "インド農村の女性の就業率は1993〜2018年に下がったが、2017〜18年の23.7%から2025年には44.9%に上がった。約500県の9年分のパネルデータで要因を分析し、幼い子の存在や世帯の実質所得の増加は就業を下げ、農村の臨時労働者の実質賃金の上昇は就業を上げると報告する。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "過少申告のある順序データの変化の変化法", "title": "Changes-in-Changes for Ordered Choice Models with Underreporting", "url": "https://arxiv.org/abs/2401.00618", "authors": "Daniel Gutknecht ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "社会的に望ましくない行動の自己申告のように過少に申告されがちな順序のある結果について、差の差分析の一種である変化の変化法（Changes-in-Changes）を拡張した。反事実と実際の結果の分布、分位点の処置効果に非パラメトリックな上下限を導き、推定法を提案する。"}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "共変量を区分けすると識別の中身が変わる", "title": "Lost in the Bins: Treatment Effects with Discretized Covariates", "url": "https://arxiv.org/abs/2611.14789", "authors": "Cenchen Liu", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "平均独立の仮定で平均処置効果を識別するとき、共変量は区分けされた粗い形で使われることが多い。細かい共変量で成り立つ平均独立が粗くした共変量では成り立たないことがあり、粗くすると推定の精度だけでなく識別の内容そのものが変わると示し、処置群の効果と平均処置効果の偏りを特徴づけた。"}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "二方向クラスタデータの一様に正確な推論", "title": "Uniform Inference for Two-Way Clustered Data", "url": "https://arxiv.org/abs/2611.16584", "authors": "Ulrich Hounyo ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "二方向にクラスタ化したデータの母平均について、データ生成過程が標本サイズとともに変わってもよい一様に正確な推論を示した。無作為なマッチングの標本平均を平均する推定量と閉形式の標準誤差により、既知の不可能性の結果と矛盾しない形で、実装しやすい信頼区間を作る。"}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "交差適合の異質性検定の帰無分布は正規でない", "title": "Non-normal Limits and Joint Calibration of Cross-fitted Heterogeneity Tests", "url": "https://arxiv.org/abs/2611.15333", "authors": "Even He ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "無作為化実験で学習した順位づけが処置の効く人を分けられるかを交差適合で検定する方法では、帰無仮説の下でも各分割の推定が互いに依存する。この依存で帰無分布の分散だけでなく形が変わり、2分割では二峰、多分割では歪んだ分布になるため、正規分布との比較は誤りうることを示す。"}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "モデルが棄却された後の「修理」を考えた推論", "title": "Inference After Model Refutation: Uniform Post-Relaxation Inference for Partially Identified Models", "url": "https://arxiv.org/abs/2611.15552", "authors": "Ulrich Hounyo", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "データが計量経済モデルを棄却したとき、どの識別の仮定を緩めるかは一つに決まらない。最小限の修理が複数ありうるとき、すべての修理にわたって同時に成り立つ信頼の事象を保つ射影の方法を提案し、同じ保証をもつ集合の中で最小であることを示す。"}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "対象の条件を操作される場合の政策学習", "title": "Strategic Causal Policy Learning with Manipulable Eligibility", "url": "https://arxiv.org/abs/2611.14572", "authors": "Suhwan Bong", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "条件付き平均処置効果が非負の人を処置するという標準の規則は、対象の条件となる共変量を人々が政策の発表後に操作できると失敗しうる。操作の費用を表す枠組みで戦略的な処置の割当と厚生の損失を分解し、線形の効果と二次の操作費用のもとで閾値の補正を閉形式で導いた。"}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "合理的不注意の離散選択モデルを識別する", "title": "Identification of Rational Inattention-Additive Random Utility Models", "url": "https://arxiv.org/abs/2611.14752", "authors": "Dennis Kristensen ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "Matějka and McKay（2015）の合理的不注意の離散選択モデルに加法的な観測されない異質性を加えた計量モデルを導入した。観測されない変数の分布と意思決定者の事前分布が未知でも、モデルの体系的な要素の一部が非パラメトリックに識別されることを示す。"}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "間隔の統計量で回帰不連続の密度の跳びを検定", "title": "Testing Density Discontinuity Using Spacings", "url": "https://arxiv.org/abs/2611.16199", "authors": "William T. Firmin", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "回帰不連続デザインでは、割当変数の密度がカットオフで跳ばないかを検定して仮定の信頼性を確かめる。カットオフの両側の順序統計量の間隔を使う新しい検定を提案し、使う間隔の数を固定した場合と緩やかに増やす場合の性質を示した。"}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "空間交絡の下で曝露の効果を識別できる条件", "title": "Identifiability and partial identification under spatial confounding in additive risk models", "url": "https://arxiv.org/abs/2611.16994", "authors": "Sheng Pan", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "環境の曝露と観測されない背景要因が広い地理で一緒に変わると、曝露の効果と空間交絡を分けにくい。加法的なポアソン過程モデルの平滑化作用素を分解し、曝露係数の情報の損失は平滑化の総量ではなく、曝露との向きの重なりで決まることを示した。"}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "推薦がいつ好奇心をかき立てるかを測る", "title": "When Does a Recommendation Spark Curiosity? Theory, Measurement, and Field Evidence", "url": "https://arxiv.org/abs/2611.14938", "authors": "Pan Li ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "好奇心の情報ギャップ理論を5つの公理に定式化し、推薦された項目が消費者に引き起こす好奇心の計算指標を作った。調査で自己申告の好奇心と一致することを確かめ、フィールドでの証拠も示すと報告する。"}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "決算サプライズの大きさから学ぶ投資家", "title": "Huge If True: Learning from the Size of the Surprise", "url": "https://arxiv.org/abs/2611.15747", "authors": "Thomas Graeber ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "決算サプライズへの株価の反応は、利益を価値に換算する未知の倍率に依存し、投資家は同じ数字から知らせと倍率の両方を学ぶ。倍率の不確実性が大きいと平均の反応は弱まるがサプライズがゼロ付近では急になることをモデルで示し、報酬つきの実験と実際の決算発表で確かめた。"}, {"id": "pn27", "rank": 27, "field": "開発経済学", "headline": "中国の自由貿易試験区は都市間の共同研究を増やしたか", "title": "Pilot Free Trade Zones and Inter-City Innovation Collaboration in China: Evidence from Staggered Designation", "url": "https://doi.org/10.2139/ssrn.7686410", "authors": "Muhammad Qayyum ほか", "venue": "SSRN", "date": "2026-11-12", "why": "中国の自由貿易試験区の指定が、指定都市の企業と他都市の企業の共同特許を変えたかを、296都市・2009〜2022年のパネルで調べた。国務院の文書で処置を確かめて6都市の符号を訂正し、処置の時期が異なる差の差分析（Callaway-Sant'Anna）で効果を推定する。"}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "レモン市場での「無秩序の代償」の上限", "title": "The Price of Anarchy in Markets for Lemons", "url": "https://arxiv.org/abs/2611.14858", "authors": "Naveen Durvasula ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "相互依存の評価をもつ単純な二者間取引の仕組みで、最悪の均衡でも最善の取引利益の一定割合を確保できる条件を示した。選別による非効率と逆選択の両方がある状況で、まれな悲観的な売り手のシグナルと楽観的な買い手のシグナルの役割を定量化する。"}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "選べる案が多いほど提案は信用されない", "title": "The Cherry-Picking Trap", "url": "https://arxiv.org/abs/2611.14983", "authors": "S. Nageeb Ali ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "情報をもつ提案者が実行可能な政策の「かご」から一つを提案し、応答者が承認するかを決めるモデルで、利害がおおむね一致していても不信が生まれることを示した。かごが大きいとパレート改善の案がある可能性は高まるが、提案者が自分に有利な案を選ぶ余地も増え、唯一の均衡ではパレート改善の提案がしばしば合理的に退けられる。"}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "期待が固定されていないとインフレの反応は3倍", "title": "Inflation-Expectations Anchoring and the State-Dependent Phillips Curve", "url": "https://doi.org/10.2139/ssrn.7683878", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-12", "why": "フィリップス曲線の傾きがインフレ期待の固定の度合いで変わるかを、期待の固定度によって動学が変わる交互作用VARで調べた。米国の1968〜2026年のデータで、期待が固定されていないとき需要ショックへのインフレの累積反応は、固定されているときの約3倍になると報告する。"}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "北欧の電力価格は危機後に連動しなくなった", "title": "Price co-movement and price information diverge across Nordic electricity zones after the energy crisis", "url": "https://arxiv.org/abs/2611.16657", "authors": "My Thi Diem Phan ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "2021〜2022年のエネルギー危機の後、北欧の入札区域の前日価格は一緒に動かなくなった。2018〜2025年のノルウェーとスウェーデンの各区域とドイツ・ルクセンブルク区域の連動を測り、連動の分岐が価格のもつ情報を変えるか、どの区域で風力・太陽光の予測が価格予測の精度に効くかを調べた。"}, {"id": "pn32", "rank": 32, "field": "経営学", "headline": "需要が遅れて混ざって観測される収益管理", "title": "Online Network Revenue Management with Delayed and Composite Demand Feedback", "url": "https://doi.org/10.2139/ssrn.7685644", "authors": "Chenrui Li ほか", "venue": "SSRN", "date": "2026-11-13", "why": "価格決定の効果が数期にわたって現れ、観測される売上が過去の複数の決定による購入の合計になる状況で、ネットワーク収益管理のオンライン学習を扱った。行動の学習、資源価格の更新、容量の管理を分ける主双対の方策を2つ作り、後悔の上界を示す。"}, {"id": "pn33", "rank": 33, "field": "経営学", "headline": "顧客直結の製造でプラットフォームは何社と組むか", "title": "Customer-to-Manufacturer: Should a Platform Cooperate with more Manufacturers?", "url": "https://doi.org/10.2139/ssrn.7685640", "authors": "Tonghuan Shi ほか", "venue": "SSRN", "date": "2026-11-13", "why": "オンライン・プラットフォームが消費者の声を製造業者に直接伝える顧客直結製造（C2M）の採用を、一つのプラットフォームと競合する2社のモデルで分析した。プラットフォームの情報が製造業者の期待利益に与える影響は単調でなく、協力の判断は情報の価格に依存すると示す。"}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "農業資材産業の集中と民間の研究開発", "title": "Market Structure and Private-Sector Research and Innovation in Global Agricultural Input Industries", "url": "https://doi.org/10.2139/ssrn.7687362", "authors": "Keith Fuglie", "venue": "SSRN", "date": "2026-11-13", "why": "肥料、農薬、農機、種子、動物薬などの農業資材産業について、世界の市場規模、集中度、農業研究開発投資の新しいデータを作った。過去数十年で市場の集中が大きく進んだことを示し、市場構造と民間の研究開発の関係を検討する。"}, {"id": "pn35", "rank": 35, "field": "組織行動・心理的安全性", "headline": "「誰が何を知るか」の共有が起業志向を育てる", "title": "‘Who Knows What?’ in New Venture Teams: Transactive Memory Systems as a Micro-Foundation of Entrepreneurial Orientation", "url": "https://doi.org/10.2139/ssrn.7694223", "authors": "Ye Dai", "venue": "SSRN", "date": "2026-11-12", "why": "新興企業の創業チームで、誰が何を知っているかを分担し統合する仕組み（交換記憶システム）が企業の起業家志向の源になるという理論を立て、中国のハイテク新興企業のフィールド調査で検証した。"}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "失敗の証拠だけで学ぶ強化学習", "title": "Negative-Only Policy Optimization for One-Sided Verifiable Rewards", "url": "https://arxiv.org/abs/2611.17287", "authors": "Jiacheng Xu ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "検証できるのは失敗だけで、合格した解が本当に正しいとは限らない「片側検証」の状況を定式化した。合格した解を強化すると部分的な検査をすり抜ける近道を学んでしまうため、検証された失敗だけを使う方策最適化を提案する。"}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "視覚言語モデルの空間推論は手がかりを除くと崩れる", "title": "Sophon: A Procedural Diagnostic for Spatial Reasoning in Vision-Language Models", "url": "https://arxiv.org/abs/2611.14838", "authors": "J. Zach Gazak ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "公開の視覚言語モデルは空間推論のベンチマークで85〜94%を取るが、物体・場面・質感の手がかりを除いた簡単な幾何の問いでは偶然の水準に落ちる。手続き的に作る診断課題Sophonを公開し、公開モデルは47〜52%、最先端のモデルは77〜83%、人間は84〜94%だったと報告する。"}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "天気予報AIの「物理的な幻覚」を診断する", "title": "PhysXAI: A Theoretical Framework for Diagnosing Physical Hallucinations in Weather Foundation Models", "url": "https://arxiv.org/abs/2611.15053", "authors": "Anjan Mahapatra ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "機械学習の全球天気予報は精度が高いが、質量保存や静水圧平衡などの物理法則に反する状態をしばしば出す。これを物理的な幻覚と呼び、予報の誤差と物理的なもっともらしさを分けて、検出・局在化・原因の特定を行う学習型の診断の枠組みを提案する。"}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "行動が下手なAIでも良い教師になれるか", "title": "Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents", "url": "https://arxiv.org/abs/2611.17167", "authors": "Haochen Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "選択肢と確率を出す判断モデルは、エージェントの行動を選ぶ、行動を評価する、強化学習で教える、のいずれにも使える。行動が下手な判断モデルでも教師として役立つかを、ALFWorldとWebShopで行動者・評価者・教師の役割を比べて調べた。"}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "ハイパー接続を単純化して学習を軽く", "title": "On the Design of Hyper-Connections: Simplification, Stability, and Scalability", "url": "https://arxiv.org/abs/2611.05984", "authors": "Xiangdong Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "最先端の言語モデルで採用が進むハイパー接続の構成要素を体系的に調べ、学習される読み書きのゲートだけ、または固定ゲートでの混合だけでも同程度の性能が出ることを見出した。拡張した残差状態への繰り返しのアクセスが学習の負荷の主因と特定し、より単純なSimpleHCを提案する。"}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "拡散トランスフォーマーで非ガウスのトンプソン抽出", "title": "Thompson Sampling using Prior-fitted Diffusion Transformers", "url": "https://arxiv.org/abs/2611.14656", "authors": "Sihwa Park ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "ブラックボックス関数の最適化でトンプソン抽出は事実上ガウス過程の事前分布に限られてきた。事前分布に合わせて事前学習した拡散トランスフォーマーが推論時に文脈内でトンプソン抽出を行う方法を提案し、単峰の関数のようなガウスでは表せない事前分布を使えるようにした。"}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "塑性がなくても繰返しせん断で疲労き裂は進む", "title": "Fatigue crack growth without plasticity under cyclically reversed shear", "url": "https://arxiv.org/abs/2611.14722", "authors": "E. A. Jagla", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "要素が破断の閾値まで弾性的にふるまい、塑性も摩擦も時間依存の過程もない系でも繰返し疲労が起こることを示した。弱い界面のせん断のモデルで、結合が片方向のせん断で切れやすく、繰返しでせん断が十分に反転すると、静的な破壊閾値より小さい荷重でも欠陥が1サイクルに数格子ずつ進む。"}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "杭群は強い揺れで浅い地盤の加速度を逆に増幅", "title": "Seismic Response of Non-displacement Pile Group in Dry Sand: Localized Pile–Soil Deformation Incompatibility Revealed by Geotechnical Centrifuge Tests", "url": "https://doi.org/10.21203/rs.3.rs-11399494/v1", "authors": "pengkun Rao ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "why": "乾燥砂中の3×6の杭群の地震応答を遠心載荷の振動台実験で調べた。0.18gと0.22gの入力では杭群が地盤の最大加速度の増幅を抑えたが、0.26gでは浅い補強地盤の増幅が無補強地盤より大きくなり、深部での低減効果は続いた。浅い杭間地盤でひずみの増加と剛性の低下が見られたと報告する。"}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "プレキャスト自己復元フレームの振動台実験", "title": "Seismic performance of prefabricated self-centering frame structure: shaking table test and simulation", "url": "https://doi.org/10.21203/rs.3.rs-11552235/v1", "authors": "Xueyuan Yan ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "why": "コンクリート充填二重鋼管柱、プレキャストRC梁、緊張した鋼より線、摩擦ダンパーからなる自己復元型のプレハブ・フレームの耐震性能を、2層2スパン・1/2縮尺の振動台実験と数値解析で調べた。床の加速度・変位、柱脚と梁端の目開き、各部のひずみを入力の強さごとに示す。"}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "適応メッシュとサイクル跳躍で疲労き裂を効率計算", "title": "An Adaptive Phase-Field Framework for Low-And High-Cycle Fatigue Crack Growth in Brittle Materials", "url": "https://doi.org/10.2139/ssrn.7684128", "authors": "Andres F. Galvis ほか", "venue": "SSRN", "date": "2026-11-13", "why": "位相場法の疲労モデルは細かいメッシュと多数の載荷サイクルを要し計算が重い。サイクルごとにき裂に沿ってメッシュを細分化・粗大化する適応法と、累積疲労の履歴変数だけを外挿するサイクル跳躍法を組み合わせ、低サイクルと高サイクルの疲労き裂の進展（分岐・発生・干渉を含む）を扱う枠組みを示す。"}, {"id": "pn46", "rank": 46, "field": "人口学", "headline": "死別の人口学：死を残された人から見る", "title": "Expanding Mortality Research: The Demography of Bereavement", "url": "https://doi.org/10.31235/osf.io/d7cnk", "authors": "Emily Smith-Greenaway ほか", "venue": "SocArXiv", "date": "2026-11-12", "why": "人口学の死亡研究は死を個人の結果として扱ってきたが、家族関係と連結した人生の研究と形式人口学の親族推計の発展で、死別の人口学という新しい分野がまとまりつつあると論じる総説。死亡状況の重みの見直し、人口学的記憶の概念、累積的な不平等の理解などへの貢献を整理する。"}, {"id": "pn47", "rank": 47, "field": "開発経済学", "headline": "ドル化したコンゴでの不確実性と金融政策", "title": "Monetary Policy under Latent Uncertainty: A Time-Varying Structural Bayesian Analysis of the Democratic Republic of the Congo", "url": "https://doi.org/10.2139/ssrn.7686563", "authors": "Christian P. Pinshi", "venue": "SSRN", "date": "2026-11-12", "why": "小国・開放・ドル化経済であるコンゴ民主共和国の2012〜2026年の月次データで、確率的ボラティリティと時変係数、世界と国内の2つの潜在要因をもつベイズVARを推定した。世界の不確実性はインフレを押し上げ、国内の変動は主に為替の下落を通じて ", "rank": 49, "headline": "BOTDAの分布ひずみ計測で橋梁を監視", "title": "Brillouin Optical Time Domain Analysis-Based Distributed Strain Sensing for Structural Health Monitoring of Bridges", "url": "https://jnde.isnt.in/index.php/JNDE/article/view/144", "authors": "Subbash Padmanabhan ほか", "venue": "Journal of Non-Destructive Testing & Evaluation (JNDE)", "date": "2026-11-10", "theme": "VBI・橋梁SHM", "theme_no": 1}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "開発経済学", "headline": "80分の講習で志が高まり貧困層の所得が増えた", "title": "Aspiring to a Better Future: Can a Simple Psychological Intervention Reduce Poverty?", "url": "https://doi.org/10.1093/restud/rdag100", "authors": "Kate Orkin ほか", "venue": "Review of Economic Studies", "date": "2026-11-10", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "ケニアの農村415村で貧困層の女性8,300人を対象に、将来の志を高めて計画を立てる80分の講習を無作為に割り付け、大きな無条件現金給付とも交差させた。17か月後、講習は偽の講習に比べて志、労働供給、投資、収入、生活水準を大きく高め、志の上昇が最も有力な仕組みだと報告する。現金給付も志を高めるという。"}, {"id": "jn02", "rank": 2, "field": "組織行動・心理的安全性", "headline": "心理的安全性の「蜃気楼」：見かけだけの安全", "title": "The Emergence of Psychological Safety or its Mirage", "url": "https://doi.org/10.1287/orsc.2024.19549", "authors": "Patricia Satterstrom ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "2チームを2年間追った民族誌（会議の逐語記録と面接）から、心理的安全性がどう生まれ、あるいは生まれないかの理論を組み立てた。どちらのチームにも、表面上は安全の兆しがあるのにメンバーが対人リスクを避け続ける「心理的安全性の蜃気楼」があり、外部からの圧力で指導者が自己防衛的に動いたことが原因だったと報告する。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "商業不動産の規制緩和で米国の生産が増える", "title": "The Impact of Commercial Real Estate Regulations on U.S. Output", "url": "https://doi.org/10.1093/restud/rdag121", "authors": "Fil Babalievsky ほか", "venue": "Review of Economic Studies", "date": "2026-11-10", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "米国の資本ストックの約2割を占める商業不動産の建築規制について、混雑効果を含む空間一般均衡モデルを作り、課税評価記録の土地と建物の価値の比から都市圏ごとの規制指数を構築した。規制を全米で適度に緩めると、資源配分の効率が大きく改善すると報告する。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "衛星で見た製鉄所の炭素税への対応", "title": "How Firms Respond to Carbon Taxation", "url": "https://doi.org/10.1287/orsc.2024.19313", "authors": "Arzi Adbi ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "67か国の製鉄所882か所の96か月分の衛星による排出データで、炭素税に企業がどう対応するかを調べた。同じ生産活動を複数国にもつ多国籍性と設備の物理的な特性が、排出原単位を下げて「よりきれいに作る」対応と「生産を減らす」対応のどちらを選ぶかを左右すると報告する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "銀行規制緩和で競争が増すとリスクテイクが増えた", "title": "Deregulation, Market Structure, and the Evolution of U.S. Banking", "url": "https://doi.org/10.1287/mnsc.2025.01128", "authors": "Emilio Bisetti ほか", "venue": "Management Science", "date": "2026-11-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "米国の州ごとの銀行規制緩和の強さをネットワークにもとづく新しい指標で測り、競争の効果と投資機会の効果を分けて識別した。競争が強まると預金の調達費用が上がり利ざやと収益が下がり、銀行は事業モデルを変えてリスクテイクを持続的に増やしたと報告し、文献の食い違う証拠を整理する。"}, {"id": "jn06", "rank": 6, "field": "気候科学", "headline": "大気の酸素が示す強まる海洋の炭素吸収", "title": "Atmospheric O 2 reveals a strengthening ocean carbon sink and a stagnant net land sink since 1990", "url": "https://doi.org/10.1126/science.aed9544", "authors": "Eric J. Morgan ほか", "venue": "Science", "date": "2026-11-12", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "30年以上の大気中の酸素と二酸化炭素の観測から、1990〜2019年に海洋の炭素吸収が10年あたり0.63ペタグラム炭素/年ずつ強まり（平均2.8）、化石燃料排出の35%を吸収した一方、陸域の正味の吸収には頑健な傾向がなかったと示した。多くの過程モデルの再現性に疑問を投げかける。"}, {"id": "jn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "危機対応の成功が医師の不信を深めた逆説", "title": "Explaining Coexisting Trust and Distrust Transitions: The Case of Senior Doctors in the UK NHS", "url": "https://doi.org/10.1111/joms.70190", "authors": "Branko Božič ほか", "venue": "Journal of Management Studies", "date": "2026-11-13", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "英国NHSの上級医が経営側への信頼が低い状態から不信が高い状態へ移る過程を、3時点の質的データで追った。コロナ禍での指導者の前向きな危機対応が一時的に期待を高め、その後期待が裏切られたことで、長期的な不信の深まりがかえって加速したと報告する。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "急速充電網の空間競争は地域独占を生むか", "title": "Spatial Competition in Fast-Charging Networks", "url": "https://doi.org/10.1287/isre.2024.1246", "authors": "Philipp Artur Artur Kienscherf ほか", "venue": "Information Systems Research", "date": "2026-11-13", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "why": "電気自動車の航続距離のため急速充電の競争は地域的になる。充電所の混雑による待ち時間と立地の魅力を組み込んだ空間競争の枠組みで、充電事業者の価格戦略と消費者の厚生を分析し、充電網の空間構造と所有構造が地域独占につながる条件を調べる。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "VCは投資先の間で起業家人材を回している", "title": "Redeploying the Jockeys: The Intermediary Role of Venture Capital in Entrepreneurial Labor Markets", "url": "https://doi.org/10.1287/mnsc.2023.01626", "authors": "Zhongchen Hu", "venue": "Management Science", "date": "2026-11-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "ベンチャーキャピタルが投資先企業の間に内部労働市場をつくり、創業者の能力についての私的情報をもとに人材を配置していることを、新しいデータと調査で示した。元パートナーの影響が残ること、内部労働市場の強さがファンドの収益を予測すること、情報の非対称が大きいほど効果が強いことを報告する。"}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "理不尽な仕事は有能で手の空いた若手に回る", "title": "Who Will be Assigned Unreasonable Tasks by Supervisors: A Conjoint Survey Experiment", "url": "https://doi.org/10.1002/hrm.70110", "authors": "Haien Ding ほか", "venue": "Human Resource Management (USA)", "date": "2026-11-13", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "why": "上司464人に、属性を無作為に変えた架空の部下4,640人分のプロフィールを示し、職務外の理不尽な仕事を誰に割り当てるかをコンジョイント実験で調べた。若く、成果が高く、手助けをよくし、いま仕事の少ない、上司と親しい部下が選ばれやすく、効率の論理が最も強く働いていたと報告する。"}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "気候リスク開示が投資家のリスク分担を変える", "title": "Climate Risk Disclosure and Risk Sharing in Financial Markets", "url": "https://doi.org/10.1093/rfs/hhag009", "authors": "Kevin Smith", "venue": "The Review of Financial Studies", "date": "2026-11-13", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "気候リスクの開示が投資家の間のリスク分担をどう変えるかを理論モデルで分析した。開示は気候リスクのヘッジに役立つ銘柄を見分けやすくしてリスク分担を改善し、企業の自発的開示の誘因と開示義務の効果、気候に関心の高い投資家が持つ銘柄の気候リスク・プレミアムの低下を導く。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "時間の報告は社員の自発的努力を減らすか増やすか", "title": "Effortful vs. Opportunistic Consumption of Discretionary Time: How Time-Reporting Decisions Influence Extra-Role Effort", "url": "https://doi.org/10.1287/mnsc.2025.00955", "authors": "Sophie Maussen", "venue": "Management Science", "date": "2026-11-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "契約で決まった仕事を終えた後の裁量時間を、契約外の有益な活動に使うか怠けるかについて、上司が時間の報告を求めることの効果を実験で調べた。報告は不信の合図として努力を減らすという予測と、仕事の価値を伝える合図として努力を増やすという新しい仕組みの予測を、報告の形式と導入者を操作して比べる。"}, {"id": "jn13", "rank": 13, "field": "環境科学", "headline": "乾燥した気候が河川の硝酸汚染を増幅する", "title": "Climate aridity amplifies global riverine nitrate beyond human inputs", "url": "https://doi.org/10.1126/science.aeg2366", "authors": "Kayalvizhi Sadayappan ほか", "venue": "Science", "date": "2026-11-12", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "機械学習で再構成した世界の河川の硝酸濃度地図から、硝酸汚染は人間の負荷だけでなく気候の乾燥度でも大きく高まり、農業・都市の中心から離れた場所にも高濃度域ができると示した。約290万の河川区間で、生態の閾値を超える範囲は陸域の約33%に及び、約56億人に関わると報告する。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "「常時つながる働き方」研究の前提を問い直す", "title": "Constant Connectivity as Everyday Practice: Theorizing Through Problematization", "url": "https://doi.org/10.1111/joms.70188", "authors": "Matthew B. Perrigino ほか", "venue": "Journal of Management Studies", "date": "2026-11-13", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "いつでもどこでも仕事につながれる状態（常時接続）の研究を問題化の方法で見直し、仕事と私生活の境界の捉え方、私生活との両立を最初から否定する見方、あいまいな「技術利用」の測定に偏りがあると指摘した。常時接続を日常の実践として捉え直す新しい理論の方向を示す。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "管理の仕組みは研究を伸ばすが教育は伸ばさない", "title": "Managing Multiple Goals: Research and Teaching in Colleges", "url": "https://doi.org/10.1162/edfp.a.497", "authors": "Prashant Loyalka ほか", "venue": "Education Finance and Policy", "date": "2026-11-12", "sjr": 1.408, "citescore": 4.2, "citescore_year": "2025", "why": "インドの260の大学学科で学生約1万8,000人と教員約5,000人を調べた縦断データ     "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
