けが効いたのか分かりにくい中で、在庫を切らさずに値付けを学ぶにはどうすればよいか。この研究は、学ぶ仕組みと在庫を守る仕組みを分けることで、遅れて混ざる情報でも学習できることを示した。", "unverified": "本文を読めておらず、数値実験の設定と比較手法の詳細は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経営学", "headline": "顧客直結の製造でプラットフォームは何社と組むか", "title": "Customer-to-Manufacturer: Should a Platform Cooperate with more Manufacturers?", "url": "https://doi.org/10.2139/ssrn.7685640", "authors": "Tonghuan Shi ほか", "venue": "SSRN", "date": "2026-11-13", "why": "オンライン・プラットフォームが消費者の声を製造業者に直接伝える顧客直結製造（C2M）の採用を、一つのプラットフォームと競合する2社のモデルで分析した。プラットフォームの情報が製造業者の期待利益に与える影響は単調でなく、協力の判断は情報の価格に依存すると示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "オンライン・プラットフォームが消費者の声を製造業者に直接届ける顧客直結製造（C2M）で、プラットフォームが何社と協力すべきかを分析モデルで調べた（抄録）。未査読のプレプリント。", "p3": "一つのプラットフォームと競合する2社の製造業者からなる市場で、プラットフォームが持つ情報の役割とそのトレードオフに注目してC2Mの採用を分析した（抄録）。", "p5": "プラットフォームの情報が製造業者の期待利益に与える影響は単調でなく、協力の判断は情報の価格に依存し情報量で調整される。情報が十分なとき、より多くの製造業者と組むことは必ずしも最適でない。C2Mはプラットフォームと消費者と社会厚生を改善するが、製造業者の利益を下げうる（抄録）。", "fun": "ネット通販の会社は、どんな商品が欲しいかという大量の声を持っている。その情報をメーカーに渡せば売れる商品が作れるが、たくさんのメーカーに配ると競争が激しくなりすぎることもある。この研究は、情報を配る相手は多ければよいわけではないことを示した。情報の価値は渡す相手の数で変わるという点が面白い。", "unverified": "本文を読めておらず、モデルの仮定と数値例の詳細は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "農業資材産業の集中と民間の研究開発", "title": "Market Structure and Private-Sector Research and Innovation in Global Agricultural Input Industries", "url": "https://doi.org/10.2139/ssrn.7687362", "authors": "Keith Fuglie", "venue": "SSRN", "date": "2026-11-13", "why": "肥料、農薬、農機、種子、動物薬などの農業資材産業について、世界の市場規模、集中度、農業研究開発投資の新しいデータを作った。過去数十年で市場の集中が大きく進んだことを示し、市場構造と民間の研究開発の関係を検討する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "肥料・農薬・農機・種子・動物薬など世界の農業資材産業の規模、集中度、研究開発投資の新しいデータを作り、市場の集中が大きく進んだことを示した（抄録）。未査読のプレプリント。", "p3": "世界的な販売と研究開発の網をもつ多国籍企業が大きな役割を果たす農業資材の各産業について、規模・構造・集中度・農業研究開発投資のデータを集めた（抄録）。", "p5": "過去数十年で農業資材の市場は大きく集中した。同時に、既存の大手は新興国の新しい多国籍企業から挑戦を受けていると報告する（抄録）。", "fun": "私たちの食べ物は、畑の外で作られる肥料や種や農機に支えられている。その作り手が少数の巨大企業にまとまっていくと、新しい技術の開発や値段はどうなるのか。この研究は、まずその実態を世界規模のデータで描いた。食料の安全が、目立たない産業の競争の姿にかかっているという視点が面白い。", "unverified": "本文を読めておらず、集中度の具体的な数値と研究開発との関係の分析結果は未確認。"}}, {"id": "pn35", "rank": 35, "field": "組織行動・心理的安全性", "headline": "「誰が何を知るか」の共有が起業志向を育てる", "title": "‘Who Knows What?’ in New Venture Teams: Transactive Memory Systems as a Micro-Foundation of Entrepreneurial Orientation", "url": "https://doi.org/10.2139/ssrn.7694223", "authors": "Ye Dai", "venue": "SSRN", "date": "2026-11-12", "why": "新興企業の創業チームで、誰が何を知っているかを分担し統合する仕組み（交換記憶システム）が企業の起業家志向の源になるという理論を立て、中国のハイテク新興企業のフィールド調査で検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "新興企業の創業チームで「誰が何を知っているか」を分担し統合する仕組み（交換記憶システム）が、企業の起業家志向の源になることを示した（抄録）。未査読のプレプリント。", "p3": "知識ベースと認知の観点から理論を立て、中国のハイテク新興企業のフィールド調査で、チームの交換記憶システム（知識の分布・統合・活用）と起業家志向の関係、チーム・企業・環境の要因による調整を調べた（抄録）。", "p5": "交換記憶システムは起業家志向を高め、その関係はチーム内の信頼、組織の柔軟な構造、環境の変化の激しさによって強まったと報告する（抄録）。", "fun": "チームの全員が全部を知っている必要はない。「経理はAさん、技術はBさん」と、誰が何に詳しいかを全員が知っていれば、必要なときに知識を集められる。この研究は、そうした「知識の地図」を共有するチームほど、新しいことに挑む会社になることを示した。チームの頭脳は一人ひとりの和以上になりうるという話だ。", "unverified": "本文を読めておらず、標本の規模と測定の方法は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "失敗の証拠だけで学ぶ強化学習", "title": "Negative-Only Policy Optimization for One-Sided Verifiable Rewards", "url": "https://arxiv.org/abs/2611.17287", "authors": "Jiacheng Xu ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "検証できるのは失敗だけで、合格した解が本当に正しいとは限らない「片側検証」の状況を定式化した。合格した解を強化すると部分的な検査をすり抜ける近道を学んでしまうため、検証された失敗だけを使う方策最適化を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "失敗は確実に分かるが合格が正しさを保証しない「片側検証」の状況で、検証された失敗だけを使って言語モデルを強化学習する方法NOPOを提案した（抄録）。未査読のプレプリント。", "p3": "検証を通った解は正解かどうか分からないラベルなしとして扱い、信頼できる失敗の例だけを抑える。参照に対する相対的な失敗抑制の損失と、反証されなかった応答の割合で更新の大きさを変える調整を組み合わせた（抄録）。", "p5": "単体テスト、制約の検査、LLMの自己検証のいずれの検証器でも、正解の報酬がない条件で、コード・論理・数学のベンチマークのpass@kを比較手法より改善し、推論時の拡大やベンチマーク間の移転でも改善が続いた（抄録）。", "fun": "テストに合格したプログラムが正しいとは限らない。テストの穴をすり抜けただけかもしれないからだ。そんな合格を「よくできた」とほめると、AIは穴をすり抜けるずるい方法を覚えてしまう。この研究は、ほめるのをやめて、確実な失敗だけを叱って学ばせた。叱るだけの学習でかえってうまくいくという点が面白い。", "unverified": "本文を読めておらず、改善の大きさとモデルの種類は未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "視覚言語モデルの空間推論は手がかりを除くと崩れる", "title": "Sophon: A Procedural Diagnostic for Spatial Reasoning in Vision-Language Models", "url": "https://arxiv.org/abs/2611.14838", "authors": "J. Zach Gazak ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "公開の視覚言語モデルは空間推論のベンチマークで85〜94%を取るが、物体・場面・質感の手がかりを除いた簡単な幾何の問いでは偶然の水準に落ちる。手続き的に作る診断課題Sophonを公開し、公開モデルは47〜52%、最先端のモデルは77〜83%、人間は84〜94%だったと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公開の視覚言語モデルが、手がかりを除いた簡単な幾何の問いで空間推論に失敗するのは能力の欠如ではなく情報の経路のボトルネックであり、狙いを定めた微調整で直せることを示した（抄録）。未査読のプレプリント。", "p3": "3つの座標系と4つの問いの型で、色つき点群の対を手続き的に生成する診断課題Sophonを作り公開した。線形の探針、層ごとの注意の帰属、構成要素ごとのLoRA微調整で、失敗の場所を突き止めた（抄録）。", "p5": "公開モデル4種は47〜52%、最先端モデルは77〜83%、人間は84〜94%だった。視覚エンコーダと言語デコーダの探針は空間情報を80%台で取り出せ、中間層の作業領域を微調整すると7B級のモデルが最先端並みの正答率に達した（抄録）。", "fun": "AIの目と頭は、それぞれ「どちらが右か」を分かっているのに、答える段階でうまくつながらず、正解の候補の中からでたらめに選んでいた。この研究は、知識がないのではなく、情報の受け渡しの途中が詰まっていると突き止めた。詰まりの場所を直せば小さなモデルでも賢くなる、という診断の仕方が面白い。", "unverified": "本文を読めておらず、微調整に使ったデータの量と他の課題への影響は未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "天気予報AIの「物理的な幻覚」を診断する", "title": "PhysXAI: A Theoretical Framework for Diagnosing Physical Hallucinations in Weather Foundation Models", "url": "https://arxiv.org/abs/2611.15053", "authors": "Anjan Mahapatra ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "機械学習の全球天気予報は精度が高いが、質量保存や静水圧平衡などの物理法則に反する状態をしばしば出す。これを物理的な幻覚と呼び、予報の誤差と物理的なもっともらしさを分けて、検出・局在化・原因の特定を行う学習型の診断の枠組みを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "機械学習の全球天気予報が出す、質量保存などの物理法則に反する状態（物理的な幻覚）を、検出・局在化・原因の特定まで行う学習型の診断の枠組みPhysXAIを提案した（抄録）。未査読のプレプリント。", "p3": "数値と物理の残差の結合条件で問題を定式化し、保存則・力学・スペクトル・変数間・時空間の残差から表現を取り出す多分岐のエンコーダを作った。物理整合の対照学習で潜在表現が物理残差の空間とほぼ等長になることを理論的に示した（抄録）。", "p5": "ERA5・WeatherBench 2・MERRA-2で、GraphCast・Pangu-Weather・NeuralGCMの予報を対象に比較評価を行い、空間的な幻覚の地図、違反の種類の分類、較正したベイズ的な不確かさを出すと報告する（抄録）。", "fun": "AIの天気予報は当たることが多いが、ときどき「空気が勝手に増える」ような物理的にありえない状態を出す。この研究は、そうした「物理的な幻覚」を見つけ、どこで、どんな法則に反しているかを示す仕組みを作った。予報が当たっているかと、物理として正しいかを別々に確かめる発想が面白い。", "unverified": "本文を読めておらず、比較評価の具体的な成績と比較手法は未確認。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "行動が下手なAIでも良い教師になれるか", "title": "Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents", "url": "https://arxiv.org/abs/2611.17167", "authors": "Haochen Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "選択肢と確率を出す判断モデルは、エージェントの行動を選ぶ、行動を評価する、強化学習で教える、のいずれにも使える。行動が下手な判断モデルでも教師として役立つかを、ALFWorldとWebShopで行動者・評価者・教師の役割を比べて調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersから候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "選択肢と確率を出す判断モデルは、行動者としては下手でも、行動を事後に評価して教える教師としては役に立つことを、長い手順のエージェント課題で示した（抄録）。未査読のプレプリント。", "p3": "3つの判断モデルと3つの汎用LLMをALFWorldで行動者と評価者として比べ、判断モデルJEVを教師としてALFWorldとWebShopで強化学習（GRPO）に使った（抄録）。", "p5": "行動者としては6モデルとも先に済ませるべき下位目標より易しい目標に引かれたが、軌跡全体を見る評価者としては下位目標への手順を正しく評価した。教師としてJEVはQwen2.5-1.5Bの方策の成功率をALFWorldで72.8%から82.9%、WebShopで56.8%から71.4%に上げた（抄録）。", "fun": "名選手が名監督とは限らないが、逆に下手な選手でも良いコーチになれることがある。この研究のAIも同じで、自分で動くと易しい目標に気を取られて失敗するのに、終わった後に「どの一手が効いたか」を評価させると的確だった。結果が分かった後なら判断しやすい、という当たり前のことをうまく学習に生かしている。", "unverified": "本文を読めておらず、3つの判断モデルの詳細は未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "ハイパー接続を単純化して学習を軽く", "title": "On the Design of Hyper-Connections: Simplification, Stability, and Scalability", "url": "https://arxiv.org/abs/2611.05984", "authors": "Xiangdong Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "最先端の言語モデルで採用が進むハイパー接続の構成要素を体系的に調べ、学習される読み書きのゲートだけ、または固定ゲートでの混合だけでも同程度の性能が出ることを見出した。拡張した残差状態への繰り返しのアクセスが学習の負荷の主因と特定し、より単純なSimpleHCを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersから候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "大規模言語モデルで使われるハイパー接続の構成要素を調べて単純化し、性能を保ったまま学習の負荷を小さくしたSimpleHCを提案した（抄録）。未査読のプレプリント。", "p3": "混合なしの学習される読み書きのゲートと、固定ゲートでの制約のない混合のどちらか一方で、既存のmHCに匹敵する性能が出ることを見つけた。拡張した残差状態への繰り返しのアクセスを負荷の主因と特定し、残差の混合を除き、メモリアクセスを共有する設計にした（抄録）。", "p5": "SimpleHCは試した最大の規模で通常の残差接続に比べ学習時間の増加が2.4%にとどまり、150億から300億パラメータのMoEモデルでmHCと同等の性能を保ち、勾配の動きが滑らかで負荷をかけても安定だったと報告する（抄録）。", "fun": "最新のAIの部品は、性能を上げるために複雑な仕組みを重ねがちだ。この研究は、その仕組みを一つずつ外して確かめ、本当に必要な部分だけ残しても性能が変わらないことを示した。複雑さのどこが効いていてどこが飾りなのかを見分ける、地道だが大事な作業の価値が分かる。", "unverified": "本文を読めておらず、評価に使ったベンチマークと性能の数値は未確認。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "拡散トランスフォーマーで非ガウスのトンプソン抽出", "title": "Thompson Sampling using Prior-fitted Diffusion Transformers", "url": "https://arxiv.org/abs/2611.14656", "authors": "Sihwa Park ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "ブラックボックス関数の最適化でトンプソン抽出は事実上ガウス過程の事前分布に限られてきた。事前分布に合わせて事前学習した拡散トランスフォーマーが推論時に文脈内でトンプソン抽出を行う方法を提案し、単峰の関数のようなガウスでは表せない事前分布を使えるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ブラックボックス関数の最適化で、ガウス過程に限られていたトンプソン抽出を、事前学習した拡散トランスフォーマーで非ガウスの事前分布にも使えるようにした（抄録）。未査読のプレプリント。", "p3": "事前分布に合わせて事前学習した拡散モデルが、推論時に文脈内でトンプソン抽出を行う。単峰の関数のようにガウス過程では表せない特性をもつ、実用的な非ガウスの事前分布の集合を作った。モデルの大きさと事前学習の反復回数のトレードオフも調べた（抄録）。", "p5": "これらのモデルは他の分野のトランスフォーマーと似たスケーリング則に従い、大域最適化のベンチマークで、非ガウスの事前分布を使うとガウス過程による従来の手順より性能が上がったと報告する（抄録）。", "fun": "試すのに手間がかかる実験で最良の条件を探すとき、「良さそうな所」と「まだ分からない所」をバランスよく試す方法がトンプソン抽出だ。これまでは計算の都合で関数の形の仮定が限られていた。この研究は、AIに大量の例で事前に学ばせて、もっと現実的な仮定でも使えるようにした。", "unverified": "本文を読めておらず、ベンチマークの種類と改善の大きさは未確認。"}}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "塑性がなくても繰返しせん断で疲労き裂は進む", "title": "Fatigue crack growth without plasticity under cyclically reversed shear", "url": "https://arxiv.org/abs/2611.14722", "authors": "E. A. Jagla", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "要素が破断の閾値まで弾性的にふるまい、塑性も摩擦も時間依存の過程もない系でも繰返し疲労が起こることを示した。弱い界面のせん断のモデルで、結合が片方向のせん断で切れやすく、繰返しでせん断が十分に反転すると、静的な破壊閾値より小さい荷重でも欠陥が1サイクルに数格子ずつ進む。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "塑性も摩擦も時間依存の過程もない、要素が破断の閾値まで弾性的にふるまう系でも、繰返しせん断で疲労き裂が進むことを示し、その最小の条件を明らかにした（抄録）。未査読のプレプリント。", "p3": "2つの弾性体の間の弱い界面をせん断で載荷するモデルを考え、静的な破壊閾値より小さい繰返し荷重のもとで、既存の欠陥がどう進むかを調べた（抄録）。", "p5": "欠陥は1サイクルに数格子ずつ進んだ。必要な条件は、結合が片方向のせん断で切れやすいことと、サイクル中にせん断が未破断の結合を切るほど十分に反転することの2つだった。フレッティング、転がり接触、反転ねじり、固結した粒状体の繰返しせん断で満たされうるとする（抄録）。", "fun": "針金を何度も曲げ伸ばしすると折れるのは、金属が少しずつ変形して傷むからだと説明されることが多い。この研究は、そうした変形が全くない材料でも、向きを変えながら何度もずらせばひび割れが少しずつ進むことを示した。疲労の原因として、変形よりも単純な仕組みがありうると分かる点が面白い。", "unverified": "本文を読めておらず、モデルの具体的な形と数値計算の条件は未確認。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "杭群は強い揺れで浅い地盤の加速度を逆に増幅", "title": "Seismic Response of Non-displacement Pile Group in Dry Sand: Localized Pile–Soil Deformation Incompatibility Revealed by Geotechnical Centrifuge Tests", "url": "https://doi.org/10.21203/rs.3.rs-11399494/v1", "authors": "pengkun Rao ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "why": "乾燥砂中の3×6の杭群の地震応答を遠心載荷の振動台実験で調べた。0.18gと0.22gの入力では杭群が地盤の最大加速度の増幅を抑えたが、0.26gでは浅い補強地盤の増幅が無補強地盤より大きくなり、深部での低減効果は続いた。浅い杭間地盤でひずみの増加と剛性の低下が見られたと報告する。", "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "乾燥砂の中の大きな杭群は地盤全体の揺れを抑える一方、強い揺れでは浅い杭間地盤の揺れを局所的にかえって増幅することを、遠心載荷の振動台実験で示した（抄録）。未査読の原稿。", "p3": "フーチングつきの3×6の杭群を入れた地盤と入れない地盤を、0.18g・0.22g・0.26gの入力で遠心振動台実験し、累積アリアス強度の5〜95%の主要動の区間で比べた（抄録）。", "p5": "0.18gと0.22gでは杭群が最大加速度の増幅を抑えたが、0.26gでは浅い補強地盤の増幅が無補強地盤より大きく、深部の低減効果は続いた。浅い杭間地盤で繰返しひずみが増え見かけの剛性が下がり、フーチングの慣性と杭と砂の剛性の差の拡大が原因とされた（抄録）。", "fun": "地盤に杭を打てば揺れにくくなる、と考えるのが普通だ。実際、弱い揺れでは杭のおかげで揺れが小さくなった。ところが強い揺れでは、杭のすき間の浅い土がかえって大きく揺れた。全体として抑えていても、場所によっては逆効果になりうるという結果は、平均だけを見る危うさを教えてくれる。", "unverified": "本文を読めておらず、模型の縮尺と砂の条件の詳細は未確認。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "プレキャスト自己復元フレームの振動台実験", "title": "Seismic performance of prefabricated self-centering frame structure: shaking table test and simulation", "url": "https://doi.org/10.21203/rs.3.rs-11552235/v1", "authors": "Xueyuan Yan ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "why": "コンクリート充填二重鋼管柱、プレキャストRC梁、緊張した鋼より線、摩擦ダンパーからなる自己復元型のプレハブ・フレームの耐震性能を、2層2スパン・1/2縮尺の振動台実験と数値解析で調べた。床の加速度・変位、柱脚と梁端の目開き、各部のひずみを入力の強さごとに示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "コンクリート充填二重鋼管柱、プレキャストRC梁、緊張した鋼より線、摩擦ダンパーからなる自己復元型のプレハブ・フレームの耐震性能を、振動台実験と数値解析で明らかにした（抄録）。未査読の原稿。", "p3": "現場での緊張作業をなくすため梁の鋼より線を工場で緊張した。1/2縮尺・2層2スパンの試験体に5種類の地震動を4段階の強さで入力し、床の応答、柱脚と梁端の目開き、各部のひずみを調べ、OpenSeesのモデルで再現とパラメータ解析を行った（抄録）。", "p5": "0.40gで柱脚と梁端の平均最大目開きは2.82mmと3.14mm、最大層間変形角は1/33で、残留変位は2mm未満だった。解析では、柱の鋼より線の緊張力を250から893MPaに上げると残留変位が約95%減った（抄録）。", "fun": "大地震の後、建物が傾いたまま残ると、壊れていなくても使えなくなる。この研究の骨組みは、柱と梁をあえて少し開くようにして揺れを逃がし、引っ張っておいた鋼の線の力で元の位置に戻る。実験では強い揺れの後も残りのずれが2mm未満だった。壊れないより「戻る」を目指す設計の考え方が面白い。", "unverified": "本文を読めておらず、損傷の観察結果と数値モデルの精度の詳細は未確認。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "適応メッシュとサイクル跳躍で疲労き裂を効率計算", "title": "An Adaptive Phase-Field Framework for Low-And High-Cycle Fatigue Crack Growth in Brittle Materials", "url": "https://doi.org/10.2139/ssrn.7684128", "authors": "Andres F. Galvis ほか", "venue": "SSRN", "date": "2026-11-13", "why": "位相場法の疲労モデルは細かいメッシュと多数の載荷サイクルを要し計算が重い。サイクルごとにき裂に沿ってメッシュを細分化・粗大化する適応法と、累積疲労の履歴変数だけを外挿するサイクル跳躍法を組み合わせ、低サイクルと高サイクルの疲労き裂の進展（分岐・発生・干渉を含む）を扱う枠組みを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "脆性材料の低サイクル・高サイクルの疲労き裂の進展を、適応メッシュとサイクル跳躍を組み合わせた位相場法で、分岐や複数き裂を含めて効率よく計算できるようにした（抄録）。未査読のプレプリント。", "p3": "変位と位相場の連成問題を改良した準一体型の解法でサイクルごとに解き、毎サイクル後にき裂に沿ってメッシュを細かく、それ以外を粗くする。累積疲労の履歴変数だけを外挿する陽的なサイクル跳躍で計算するサイクル数を減らす（抄録）。", "p5": "5つのベンチマーク問題で、完全反転のせん断でき裂が分岐し、境界からの二次き裂が主き裂の経路を変えうることを示した。10万サイクルを超える高サイクルの例で、サイクル跳躍はき裂の経路と最終の長さを保ったまま計算費用を9.6分の1にした（抄録）。", "fun": "金属疲労のひびは何十万回もの繰返しで少しずつ伸びるので、1回ずつ計算すると膨大な時間がかかる。この研究は、ひびの周りだけ細かく計算し、変化の少ない区間は先の結果を見積もって飛ばすことで、計算を約10分の1にした。分かれるひびや何本も伸びるひびまで追える点が強みだ。", "unverified": "本文を読めておらず、実験との比較の有無は未確認。"}}, {"id": "pn46", "rank": 46, "field": "人口学", "headline": "死別の人口学：死を残された人から見る", "title": "Expanding Mortality Research: The Demography of Bereavement", "url": "https://doi.org/10.31235/osf.io/d7cnk", "authors": "Emily Smith-Greenaway ほか", "venue": "SocArXiv", "date": "2026-11-12", "why": "人口学の死亡研究は死を個人の結果として扱ってきたが、家族関係と連結した人生の研究と形式人口学の親族推計の発展で、死別の人口学という新しい分野がまとまりつつあると論じる総説。死亡状況の重みの見直し、人口学的記憶の概念、累積的な不平等の理解などへの貢献を整理する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "死を個人の結果としてだけでなく、残された家族の経験として捉える「死別の人口学」が新しい分野としてまとまりつつあると論じ、その貢献と今後の方向を整理した総説である（抄録）。未査読のプレプリント。", "p3": "家族関係と連結した人生を重視する社会人口学と、計算・形式人口学の親族推計の方法の発展を背景に、関連研究を整理した（抄録）。", "p5": "この分野が、死亡状況の重みと範囲の見直し、人口学的記憶という概念の発展、死亡の体制の経験的な視点、死亡状況の累積的な不平等の理解に貢献し、死亡を不平等の結果だけでなく原因として位置づけたと論じる（抄録）。", "fun": "ある国の平均寿命が短いことは、亡くなる人の問題であると同時に、親や兄弟や子を早く失う人が多いという問題でもある。この総説は、死を「残された人」の側から数える人口学を紹介する。同じ死亡率でも、家族の形によって悲しみを経験する人の数や時期が変わるという見方が新鮮だ。", "unverified": "総説のため新しい実証結果はない。本文を読めておらず、取り上げた研究の範囲は未確認。"}}, {"id": "pn47", "rank": 47, "field": "開発経済学", "headline": "ドル化したコンゴでの不確実性と金融政策", "title": "Monetary Policy under Latent Uncertainty: A Time-Varying Structural Bayesian Analysis of the Democratic Republic of the Congo", "url": "https://doi.org/10.2139/ssrn.7686563", "authors": "Christian P. Pinshi", "venue": "SSRN", "date": "2026-11-12", "why": "小国・開放・ドル化経済であるコンゴ民主共和国の2012〜2026年の月次データで、確率的ボラティリティと時変係数、世界と国内の2つの潜在要因をもつベイズVARを推定した。世界の不確実性はインフレを押し上げ、国内の変動は主に為替の下落を通じて働き、中央銀行の操作への反応は不確かだったと報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "小国・開放・ドル化経済のコンゴ民主共和国で、世界と国内の不確実性がインフレと金融政策の効果にどう影響するかを、時変のベイズVARで推定した（抄録）。未査読のプレプリント。", "p3": "2012年4月〜2026年3月の月次データで、確率的ボラティリティ、選んだ係数の時間変化、条件付き平均の2つの潜在要因（政策・世界・金融の不確実性指数に基づく世界要因と、国内のマクロ金融の変動の要因）をもつハイブリッドなベイズVARを推定した（抄録）。", "p5": "世界の不確実性はインフレを下げるのではなく、2年先までのどの期間でも押し上げた。国内の変動は主に為替の下落を通じて働き、闇市場の為替の変動と強く結び付いた。中央銀行の手形操作への反応は不確かで、時点の仮定に敏感だった（抄録）。", "fun": "先進国では、世界経済が不安定になると景気が冷えて物価が下がることが多い。ところがドルが広く使われている国では、不安定になると自国の通貨が売られて輸入品が高くなり、物価はむしろ上がる。同じ「不確実性」でも、国の仕組みによって逆の効き方をするという点が面白い。", "unverified": "本文を読めておらず、推定の不確かさの大きさとモデル選択の詳細は未確認。"}}, {"id": "pn48", "rank": 48, "field": "開発経済学", "headline": "独立後コンゴの信用統制を年報から再構成", "title": "Monetary Policy in the Congo, from Colonial Note Issue to Credit Controls in Zaire (1909–1980): Credit Ceilings, Reserve Requirements, Rediscounting and Demonetisation", "url": "https://doi.org/10.2139/ssrn.7686786", "authors": "Christian P. Pinshi", "venue": "SSRN", "date": "2026-11-12", "why": "コンゴの通貨当局が独立後の20年間に信用の量・費用・行き先にどう影響したかを、中央銀行の年報から信用の上限、実際の信用、準備率、再割引の条件を再構成して調べた経済史の論文。企業と家計向けの債権の対GDP比が1975年の14.75%から1980年の5.84%に下がったことなどを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "short": true, "p1": "独立後のコンゴの通貨当局が信用の量・費用・行き先をどう動かしたかを、中央銀行の年報から信用の上限・実際の信用・準備率・再割引の条件を再構成して示した経済史の論文（抄録）。未査読のプレプリント。", "p3": "1909年からの制度の起源をたどり、1960〜1980年の政策手段を、コンゴ国立銀行とザイール銀行の年報から再構成した（抄録）。", "p5": "1963〜1968年に信用の利用を上限と比べられる11の観測のうち3つで超過があった。1976〜1980年に認められた年間の信用増加は1億1,000万から3億ザイールに増えたが対名目GDP比は3.85%から1.80%に下がり、企業と家計への債権は14.75%から5.84%に下がった（抄録）。", "fun": "お金の量を直接決める今の金融政策と違い、昔の多くの国では「銀行はここまでしか貸してはいけない」という上限で経済を動かしていた。この論文は、古い年報の数字を一つずつ拾い直して、その上限が守られていたか、実際の貸し出しがどう変わったかを再現した。歴史の数字を掘り起こす作業そのものが面白い。", "unverified": "本文を読めておらず、通貨の切り替え（1979年12月）の扱いの詳細は未確認。"}}, {"id": "pn49", "rank": 49, "field": "統計学", "headline": "測定誤差のある分布比較を少数の監査で補正", "title": "Don't Match the Noise: Distribution Matching under Unknown Measurement Error with an Audit Sample", "url": "https://arxiv.org/abs/2611.14749", "authors": "Arya Farahi ほか", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "センサの雑音や非専門家の注釈のように測定に誤差があると、最大平均差（MMD）による分布の比較は測定の癖を拾って偏る。正確な測定のある少数の監査標本を使い、雑音のモデルなしにカーネルの評価を補正する推定量を提案し、単純無作為の監査で不偏になることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "測定に誤差がある大量のデータと、正確な測定のある少数の監査標本を組み合わせ、雑音のモデルなしに分布どうしの距離（最大平均差、MMD）の偏りを補正する推定量を提案した（抄録）。未査読のプレプリント。", "p3": "監査標本を使ってカーネルの評価の偏りを取り除く推定量MEC-MMDを作り、単純無作為の監査で真のMMDに対し不偏であること、分散の分解、母集団のMMDへの一致性を示した（抄録）。", "p5": "監査の数がデータの大きさに比例して増えるとき標準のN^(−1/2)の速さを達成し、パラメータ推定と教師なしの応用の両方で、MEC-MMDが通常のMMDや他の方法を一貫して上回ったと報告する（抄録）。", "fun": "体重計が少し狂っていると、2つのクラスの体重の分布を比べても、違いが体重のせいか体重計の癖のせいか分からない。この研究は、全員のうち何人かだけ正確な体重計で測り直せば、癖の影響を差し引いて比べられることを示した。少しの正確なデータで大量の不正確なデータを生かす発想が面白い。", "unverified": "本文を読めておらず、実験のデータと改善の大きさは未確認。"}}, {"id": "pn50", "rank": 50, "field": "統計学", "headline": "利用者が適応するとLLMの評価は何を測るか", "title": "When Both Sides Adapt: The Challenges of Evaluating Interactive LLM Systems", "url": "https://arxiv.org/abs/2611.17239", "authors": "Hannah Li", "venue": "arXiv", "date": "Fri, 13 Nov 2026", "why": "利用者はLLMの応答を見て次の質問の仕方や課題を変えるため、モデルの応答が評価に使う質問の分布を変えてしまう。同じ質問分布での比較と、利用で生じた分布での比較という2種類の推定対象を定義し、オフラインのベンチマークとA/Bテストが異なる量を推定していることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "利用者がLLMの応答を見て次の質問の仕方を変えるため、オフラインのベンチマークとA/Bテストは別々の量を推定しており、モデルの順位が逆転しうることを示した（抄録）。未査読のプレプリント。", "p3": "同じ質問分布でモデルを比べる「共通分布の効果」と、利用者とのやりとりで生じた質問分布で比べる「誘発分布の効果」という2種類の推定対象を定義し、標準の平均の差の推定量がそれぞれに収束することを示した（抄録）。", "p5": "2つの比較が異なる順位を与える条件を特徴づけ、順位が一致する十分条件を示した。単純な線形モデルでは利用者の適応が推定の分散を増やしうること、適応が報酬のハッキングや新奇効果などの評価の問題の共通の原因になることも論じた（抄録）。", "fun": "AIの性能をテスト問題で測るとき、問題は決まっている。ところが実際の利用では、人はAIの答えを見て次の質問を変える。賢いAIには難しい質問をし、頼りないAIには簡単な質問しかしなくなるかもしれない。だから、テストの成績と実際の使われ方での評価は、別のものを測っていることになるという指摘が面白い。", "unverified": "本文を読めておらず、実データでの検証の有無は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "臨界減速の兆候で歩道橋の損傷を前もって警告", "title": "S たFEモデルとガウス過程で斜張橋の限界風速", "title": "A probabilistic machine learning framework of flutter critical wind velocity prediction for cable-stayed bridges based on a calibrated finite element model", "url": "https://doi.org/10.47869/tcsj.77.9.5", "authors": "Nam Ho Xuan ほか", "venue": "Transport and Communications Science Journal", "date": "2026-11-13", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr16", "rank": 16, "headline": "低サンプリングでも複数車両の荷重を同定", "title": "Restricted maximum likelihood-based framework for multiple moving vehicle load identification under low sampling frequency", "url": "https://doi.org/10.1016/j.ymssp.2026.115155", "authors": "Bohao Xu ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-12", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、題名で照合したSSRNの版の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "橋の応答から複数の移動車両の荷重を直接同定するとき、実務の低いサンプリング周波数でも静的な荷重の成分を精度よく推定できる、制限付き最尤法（REML）の枠組みを提案した（抄録）。", "p3": "解の空間を静的な荷重の成分を除いた部分空間に変換し、EMアルゴリズムで解く。従来は動的荷重と雑音の分散、静的・動的な荷重を同時に更新していたが、この段階では分散だけを更新し、推定した分散を使って静的・動的な荷重を決める（抄録）。", "p5": "数値シミュレーションで雑音の分散推定の必要性、初期値を変えた収束、期間ごとの精度、他手法との比較を調べ、実験でも移動車両の静的な荷重の成分を妥当に同定できたと報告する（抄録）。", "fun": "橋の上を何台もの車が走ると、橋の揺れには全部の車の重さが混ざって表れる。その揺れから一台ずつの重さを逆算するのは難しく、しかも現場のセンサーは細かい時間刻みで測れないことが多い。この研究は、まず揺れのばらつきの大きさだけを推定してから重さを求める二段構えにして、粗い計測でも重さを当てられるようにした。", "unverified": "本文を読めておらず、同定誤差の数値、実験の規模、サンプリング周波数の具体的な値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "台風下の高層建物で振幅依存のベイズOMA", "title": "Amplitude-Dependent Bayesian Operational Modal Analysis for tall buildings under typhoon excitation: Field evidence and identifiability limits", "url": "https://doi.org/10.1016/j.ymssp.2026.115163", "authors": "Jun Hu ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-13", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、台風の加振を受ける高層建物で、振幅に依存する振動特性をベイズ運用モード解析（常時の揺れから固有振動数や減衰を推定する方法）で同定し、実測にもとづいて同定できることの限界を示す研究である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、強い風で大きく揺れるほど建物の揺れ方の性質（揺れやすい周期や揺れの収まり方）は変わるのか、そしてそれを実測からどこまで確かに言えるのか、というものだ。揺れの大きさで性質が変わるなら、普段の小さな揺れで測った値は台風のときには使えないかもしれない。", "unverified": "抄録・本文を入手できず、対象の建物、データ、結果はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "流体を挟む2枚の板でモードが混成し交差を避ける", "title": "Experimental and numerical analysis of the modes of fluid-coupled elastic plates", "url": "https://doi.org/10.1016/j.jsv.2026.120227", "authors": "P. Skelland ほか", "venue": "Journal of Sound and Vibration", "date": "2026-11-13", "sjr": 1.331, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、題名で照合したOpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "流体を挟んだ2枚の固体板（固体-流体-固体の三層）を伝わる漏洩モードで、圧縮型のモードの遮断周波数が板の間隔に依存する理由を、モードの混成として説明した（抄録）。", "p3": "数値解析と実験で、板の漏洩ラム波に由来する三層のモードと、間の流体の音響共鳴に由来するモードを調べた（抄録）。", "p5": "流体の音響共鳴に由来するモードは板の圧縮運動を伴うため、板由来のモードと相互作用する。その強さは板の間隔に依存し、ある範囲の間隔ではモードが混成して交差を避ける（反交差）。この混成が遮断周波数の間隔依存を生むと報告する（抄録）。", "fun": "2枚の板の間に液体を挟むと、板の振動と液体の中の音の振動が互いに影響し合う。2つの振動の周波数が近づくと、ふつうなら交わるはずのグラフの線がぶつからずに避け合い、性質を交換する。この「避けた交差」が板と液体の振動でも起き、板の間隔で決まるというのが面白い。", "unverified": "本文を読めておらず、実験の材料、周波数帯、間隔の具体的な値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "位相処理を超えた動画からの変位推定", "title": "Beyond phase processing: joint optimization for video-based displacement estimation", "url": "https://doi.org/10.1016/j.ymssp.2026.115207", "authors": "Yiding Hu ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-13", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、動画から構造物や機械の変位を推定する際に、位相の処理だけに頼らず複数の要素を同時に最適化する方法を提案する研究である（機械システム・信号処理の主要誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、カメラの映像だけで物がどれだけ動いたかをどこまで正確に測れるか、というものだ。映像の明るさの細かな変化（位相）から動きを読む方法はよく知られているが、それだけでは限界がある。センサーを取り付けずに橋や機械の揺れを測れれば、点検はずっと楽になる。", "unverified": "抄録・本文を入手できず、手法の中身、対象、精度はすべて未確認。"}}, {"id": "jr20", "rank": 20, "headline": "文章から心理特性を測るAIの妥当性を評価する枠組み", "title": "Text Psychometrics: Assessing psychological constructs in text using natural language processing", "url": "https://doi.org/10.1371/journal.pdig.0001757", "authors": "Daniel M. Low ほか", "venue": "PLOS Digital Health", "date": "2026-11-12", "sjr": 1.789, "citescore": 11.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "文章から心理的な構成概念を測るNLP・LLMの手法を、質問紙と同じように妥当性・信頼性などの心理測定の性質で評価する枠組み（テキスト心理測定）を示した（抄録）。", "p3": "NLPの手法を説明可能性などで比べ、評価すべき性質を整理した。危機相談の会話とRedditの投稿を心の問題の種類に分類する研究1（内容的妥当性の新しい評価法）と、49の既知の自殺の危険因子で差し迫った危険を予測する研究2（予測的妥当性）を行った（抄録）。", "p5": "致死的な手段や警察への言及、抑うつ気分、不安、相談者が相談員より多く書くことが、緊急の介入が必要になった会話の特徴だった。心理学のNLP研究は少数の検証指標に頼りがちで、より広い心理測定の評価が必要だと結論する（抄録）。", "fun": "性格や気分をアンケートで測るときは、本当にそれを測れているか（妥当性）、何度測っても同じか（信頼性）を確かめる決まりがある。ところがAIで文章から気分を読み取るときは、その確認がおろそかになりがちだ。この研究は、AIの物差しにもアンケートと同じ検査を当てはめようと提案した。", "unverified": "本文を読めておらず、各研究の標本の規模と性能の数値は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "香港の公的介護申請者は認知障害と多疾患が増加", "title": "Older Adults Seeking Publicly Funded Long-Term Care in a Super-ageing Society: Trends in Functional Impairments and Multimorbidity Burden Based on InterRAI-Home Care Data From 2001 to 2019 in Hong Kong", "url": "https://doi.org/10.1177/08982643261502732", "authors": "Yushan Wu ほか", "venue": "Journal of Aging and Health", "date": "2026-11-13", "sjr": 1.146, "citescore": 5.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "香港で公的な長期ケアを申請した60歳以上の人の機能障害と多疾患の負担が、2001〜2019年にどう変わったかを示した（抄録）。", "p3": "申請者315,556人のinterRAI評価を、年齢・出生コホート・社会人口学的要因を調整した階層的混合効果モデルで分析し、年齢・疾患・居住状況で分けて比べた（抄録）。", "p5": "認知障害と多疾患は増え、身体障害は横ばい、孤独は減った。脳卒中は身体・認知の障害の大きさと、白内障は孤独と関連した。85歳以上は機能障害が多いが多疾患は少なかった（抄録）。", "fun": "介護サービスを申し込む高齢者の姿は、20年でどう変わったのか。香港の31万人以上の記録からは、体の不自由さはあまり変わらない一方、物忘れなどの認知の問題と複数の病気を抱える人が増えたことが分かった。支える側に求められることが、体の世話から複雑な見守りへ移っていることを示す点が興味深い。", "unverified": "本文を読めておらず、変化の大きさの具体的な数値は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "AIで描いた再開発案の信頼と支持を分ける要因", "title": "Public Perception, Representational Trust, and Scheme Support in AI-Visualized Urban Regeneration: Evidence from Industrial Heritage Public Spaces", "url": "https://doi.org/10.3390/buildings16224522", "authors": "Yan Zhang ほか", "venue": "Buildings", "date": "2026-11-12", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "生成AIで描いた産業遺産の再開発案を市民がどう評価し、その評価が案への支持とどう結び付くかを、多層の構造方程式モデルで分析した（抄録）。", "p3": "中国・瀋陽の奉天工場を対象に、3つの案×3つの場面の生成AI画像を360人が決まった順序で評価した（3,240件）。刺激-生体-反応の枠組みで、多層の確認的因子分析、構造方程式モデル、参加者単位のクラスタ・ブートストラップを用いた（抄録）。", "p5": "文化的真正性と写実性の知覚は表現への信頼と、信頼・文化的真正性・快適さは支持と正に関連した。展示型の案は真正性と信頼が、日陰の休憩型の案は快適さが最も高かったが、全体の支持は案の間で有意に違わなかった（抄録）。", "fun": "再開発の計画を市民に見せるとき、今はAIでそれらしい完成予想図を簡単に作れる。この研究は、その絵が本物らしい、その場所らしいと感じられると信頼され、計画への支持につながることを示した。ただし案によって好まれる点は違っても、支持の強さは変わらなかった。絵の印象と賛否を分けて考える必要がありそうだ。", "unverified": "本文を読めておらず、効果の大きさと参加者の構成は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "財務指標の機械学習で日本企業の増配を予測", "title": "Machine Learning-Based Prediction of Dividend-Increase Behavior from Corporate Financial Indicators and Its Application to Portfolio Management", "url": "https://doi.org/10.3390/ijfs14110315", "authors": "Ziyi Dai ほか", "venue": "International Journal of Financial Studies", "date": "2026-11-12", "citescore": 5.0, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "日本の上場企業の財務・市場指標と経営者の配当予想から増配を機械学習で予測し、その予測が銘柄選択の成績を上げるかを調べた（抄録）。", "p3": "銀行を除く東証の3月決算企業を対象に、予測時点で入手できる情報だけを使い、学習・検証・再学習を繰り返して2013〜2023年の標本外予測を作り、2013年6月〜2024年5月のポートフォリオで評価した（抄録）。", "p5": "多変量のXGBoostは年平均のAUCが0.86で、予想配当利回りの変化だけのモデル（0.77）を上回った。予測確率と予想配当利回りを組み合わせたロング・ショート戦略は年率シャープレシオ1.26で、ファーマ・フレンチ3因子でも正のアルファ（t=4.12）だった（抄録）。", "fun": "会社が配当を増やすかどうかは、会社自身の予想を見ればある程度分かる。この研究は、それに財務の数字を加えて機械学習で予測すると、当たる確率がかなり上がることを日本企業で示した。会社の言っていることと、数字が示していることを組み合わせると見通しが良くなる、という点が面白い。", "unverified": "本文を読めておらず、効いた財務指標の内訳は未確認。著者は空売りの費用などは評価していないとしている。"}}, {"id": "jr24", "rank": 24, "headline": "社会的孤立と地域の余暇参加と健康な老い", "title": "Social isolation, community leisure engagement and the social determinants of healthy aging", "url": "https://doi.org/10.1038/s43587-026-01256-2", "authors": "Andrew Steptoe ほか", "venue": "Nature Aging", "date": "2026-11-12", "sjr": 9.5, "citescore": 27.2, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "short": true, "p1": "社会的孤立を健康な老化の社会的決定要因の一つとして位置づけ、とくに地域の余暇活動への参加の欠如が見過ごされてきた要因だと論じる論考である（抄録）。", "p3": "高所得国と低中所得国の研究、孤立と健康の結果を結ぶ生物学的・行動的な過程、老化の生物学の新しい展開を整理した（抄録）。", "p5": "地域の余暇活動への参加は変えやすい要因であり、その概念を広げて研究すべきこと、世界規模での地域参加と地域資源の動員が孤立などを和らげ健康な老化を高めうることを論じる（抄録）。", "fun": "一人で過ごす時間が長いと体や心の健康に悪いことは、世界中で確かめられてきた。この論考は、その対策として、趣味の集まりや地域の行事に参加することの大切さが見過ごされてきたと指摘する。薬ではなく地域の集まりが老いを健やかにするかもしれない、という視点が面白い。", "unverified": "論考であり、新しい実証データの有無は抄録からは分からない。本文は読めていない。"}}, {"id": "jr25", "rank": 25, "headline": "デジタル包摂は孤立と認知機能をつなぐか", "title": "Digital Inclusion as a Context-Dependent Mediating Pathway Between Social Isolation and Cognitive Functioning in Chinese and European Older Adults.", "url": "https://doi.org/10.1177/07334648261506620", "authors": "Yao J ほか", "venue": "Journal of applied gerontology : the official journal of the Southern Gerontological Society", "date": "2026-11-12", "citescore": 5.2, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "社会的孤立と高齢者の認知機能の関係を、インターネットの利用（デジタル包摂）が媒介するかを、中国と欧州の複数のデータで調べた（抄録）。", "p3": "中国の横断調査（DIHA、2024年）、2つの縦断コホート（CHARLSとSHARE）、欧州系のゲノムデータによる二標本メンデルランダム化を統合し、インターネットの利用を通じた媒介と、曝露と媒介の交互作用を4分解で評価した（抄録）。", "p5": "55歳以上の18,071人で、孤立はどのコホートでも認知機能の低さと関連した。縦断の媒介はSHAREで最も明確（とくに集団活動への不参加）で、CHARLSでは有意でなかった。メンデルランダム化は孤独と余暇の社会活動の少なさを認知の低さと結び付けた（抄録）。", "fun": "人と会わない高齢者は物忘れが進みやすい。では、インターネットを使えればその影響を和らげられるのか。この研究では、欧州のデータではネットの利用が孤立と認知の関係の一部を説明していたが、中国のデータでははっきりしなかった。同じ道具でも社会によって効き方が違うことを示す点が面白い。", "unverified": "本文を読めておらず、媒介の割合の具体的な値は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "慈善団体の会計基準が財務の強靭性を形作った", "title": "From Reporting to Regulation: The Making and Governance of Financial Resilience Through the Charity Statement of Recommended Practice in England and Wales", "url": "https://doi.org/10.1177/08997640261495470", "authors": "Rani Suleman", "venue": "Nonprofit and Voluntary Sector Quarterly", "date": "2026-11-13", "sjr": 1.285, "citescore": 6.9, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "英国の最初の慈善団体の会計基準（SORP）がどのように生まれ、慈善団体の「財務の強靭性」を規制できるものにしていったかを歴史的にたどった（抄録）。", "p3": "SORPを1980年代の不祥事への技術的な対応とみる見方を超え、戦後の福祉と規制改革の流れの中に位置づけた。Burchellらの「アリーナ」の概念で、会計専門職が不十分な報告・不正・財務管理の問題と標準化された報告を結び付けた過程を分析した（抄録）。", "p5": "会計基準が慈善団体を財務的に知りうる、比べられる、統治できるものにし、受託責任への期待を、計算でき統治できる財務の強靭性の期待に変えたと論じる（抄録）。", "fun": "寄付で成り立つ団体のお金の使い方を、どうやって外から確かめるのか。この研究は、会計のルールができたことで団体のお金の状態が比べられる数字になり、規制の対象になったと描く。会計は事実を写すだけでなく、何を問題として扱うかまで形作るという見方が面白い。", "unverified": "本文を読めておらず、分析した史料の種類と範囲は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "国有企業のAI活用は監査品質を高めるか", "title": "The effect of artificial intelligence application in state-owned firms on audit quality: Evidence from China", "url": "https://doi.org/10.1016/j.iref.2026.106019", "authors": "xinrong song ほか", "venue": "International Review of Economics & Finance", "date": "2026-11-11", "citescore": 8.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "中国の国有企業がAIを活用すると監査の品質が高まるかと、その経路を、2011〜2024年のデータで調べた（抄録）。", "p3": "国有企業のAI活用と監査品質の関係を実証し、内部統制、利益調整、情報の非対称性とリスク・プレミアムを経路とする仕組みの検定と、企業の技術特性・事業の複雑さ・政府のデジタル監督・監査法人の種類による異質性を分析した（抄録）。", "p5": "AIの活用は監査品質を有意に高め、内部統制の強化、利益調整の減少、情報の非対称性とリスク・プレミアムの低下を通じて働いた。効果は企業の技術特性や監査法人の種類などで異なった（抄録）。", "fun": "会社がAIを使うと、会計のチェック（監査）の質まで上がるのか。この研究は、中国の国有企業では、AIで社内の管理がしっかりし、数字をいじる余地が減ることで、監査の質が上がったと報告する。AIは監査する側だけでなく、監査される側を変えることでも効くかもしれない、という視点が面白い。", "unverified": "本文を読めておらず、AI活用の測り方と効果の大きさは未確認。"}}, {"id": "jr28", "rank": 28, "headline": "気象と構造の指紋をつなぐ台風警報", "title": "Bridging meteorological and structural fingerprints for tropical cyclone warning: Multi-timescale response assessment", "url": "https://doi.org/10.1016/j.cacaie.2026.100271", "authors": "Zi-Xuan Zeng ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-12", "sjr": 2.155, "citescore": 14.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、台風の気象の特徴と構造物の応答の特徴（指紋）を多時間スケールで結び付け、台風の警報に生かす応答評価の研究である（土木情報学の主要誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、台風が近づくとき、天気のデータだけでなく、建物や橋そのものの揺れ方の変化からも危険を読み取れないか、というものだ。構造物が自分で「いつもと違う揺れ」を知らせてくれるなら、警報はもっと具体的になるかもしれない。", "unverified": "抄録・本文を入手できず、対象の構造物、データ、結果はすべて未確認。"}}, {"id": "jr29", "rank": 29, "headline": "梁とシェルの連成構造の統一的な振動解析", "title": "A Unified Formulation for Dynamic Modeling and Vibration Analysis of Beam-Shell Coupled Structures with General Boundaries", "url": "https://doi.org/10.1016/j.tws.2026.115973", "authors": "Fulong Zhao ほか", "venue": "Thin-Walled Structures", "date": "2026-11-12", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、梁とシェル（薄い曲面板）が連成した構造の動的なモデル化と振動解析を、一般的な境界条件のもとで統一的に定式化する研究である（薄肉構造の主要誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、細長い梁と薄い板がつながった構造の揺れを、端の支え方が違っても一つの方法でまとめて計算できるか、というものだ。骨組みと外板のように性質の違う部品がつながった構造の振動は、部品ごとの計算をつなぐところが難しい。", "unverified": "抄録・本文を入手できず、手法の中身と検証の結果はすべて未確認。"}}, {"id": "jr30", "rank": 30, "headline": "2Dガウシアンでコンクリート欠陥を3次元再構成", "title": "Semantic 2D Gaussian splatting for 3D reconstruction and localization of concrete defects", "url": "https://doi.org/10.1007/s13349-026-01171-5", "authors": "Dayou Duan ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-13", "citescore": 8.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、意味情報をもたせた2Dガウシアン・スプラッティング（多数の小さな面で3次元の場面を表す手法）で、コンクリートの欠陥を3次元に再構成し位置を特定する研究である（土木構造物の健全性監視の専門誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、点検の写真から、コンクリートのひび割れなどの傷を立体的な模型の上に正確に描けるか、というものだ。写真では傷の場所や大きさが分かりにくいが、3次元の模型の上で傷の種類と位置を示せれば、補修の計画を立てやすくなる。", "unverified": "抄録・本文を入手できず、手法の精度と対象の構造物はすべて未確認。"}}, {"id": "jr31", "rank": 31, "headline": "9つのLLM評定の不一致を労働市場の推計に持ち込む", "title": "Nine raters, one index: Carrying LLM disagreement into labour-market estimates", "url": "https://doi.org/10.1016/j.techfore.2026.124933", "authors": "Golo Henseke ほか", "venue": "Technological Forecasting and Social Change", "date": "2026-11-13", "sjr": 3.479, "citescore": 30.5, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "研究の注釈にLLMを使うとモデルの選択が分析者の自由度になることを示し、9つのLLMの評定の不一致を、職業のAI曝露の推計にそのまま持ち込む手順を示した（抄録）。", "p3": "1,100の作業-職業のセルを3社の9モデルに評定させ、英国の技能・雇用調査の作業の重要度で重みづけた。評定者を多元宇宙の一つの次元とし、評定者ごとの推定と範囲、ばらつきを取り込んだルービン型の要約を報告した（抄録）。", "p5": "順位は水準よりずっと安定していた（順位相関0.74〜0.92）が、0.5を超える英国の職の割合は0.1%未満から38%までばらついた。2022年以降の賃金の勾配は9評定者すべてで負だったが、求人での結果は評定者と設計で変わり、どちらの応用も生成AIの効果は識別しなかった（抄録）。", "fun": "「この仕事はどれくらいAIの影響を受けるか」をAIに採点させると、どのAIを使うかで答えが大きく変わる。順番はほぼそろっても、点数そのものは、ほとんどの仕事が該当しないという結果から4割近くが該当するという結果まで割れた。一つのAIの答えで結論を出さず、ばらつきごと報告しようという提案が面白い。", "unverified": "本文を読めておらず、9モデルの名前と妥当性の検証の詳細は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "政府誘導基金と中小企業の利益調整", "title": "Government-guided funds and accounting information governance of small and medium-sized enterprises: from the perspective of earnings management", "url": "https://doi.org/10.1016/j.irfa.2026.105529", "authors": "Du Yuan ほか", "venue": "International Review of Financial Analysis", "date": "2026-11-12", "sjr": 2.373, "citescore": 13.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、政府誘導基金（政府が出資して民間投資を呼び込む基金）が、中小企業の会計情報のガバナンスに与える影響を、利益調整の観点から調べる研究である（国際的な金融分析の主要誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、政府のお金が入ると中小企業は会計の数字をいじりにくくなるのか、というものだ。出資者が増えれば監視の目も増えそうだが、支援を受け続けたいために数字をよく見せようとする動機も生まれうる。どちらが強いのかが気になる問いだ。", "unverified": "抄録・本文を入手できず、データ、方法、結果はすべて未確認。"}}, {"id": "jr33", "rank": 33, "headline": "監査人の交代と年次報告書のトーン管理", "title": "Auditor Switching and Annual Report Tone Management in China: The Role of Switching Directions", "url": "https://doi.org/10.1016/j.iref.2026.106050", "authors": "Qin Yang", "venue": "International Review of Economics & Finance", "date": "2026-11-13", "citescore": 8.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、中国で監査人が交代したとき、その交代の方向（どのような監査人からどのような監査人へ替わるか）が、年次報告書の文章のトーンの管理にどう影響するかを調べる研究である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、監査人が替わる方向によって、会社が報告書の文章の調子を明るく飾りやすくなるのか、というものだ。数字だけでなく言葉の調子も、監査人の目を意識して変わるのかもしれない、という点が興味深い。", "unverified": "抄録・本文を入手できず、データ、方法、結果はすべて未確認。"}}, {"id": "jr34", "rank": 34, "headline": "説明生成と二層の多エージェント投票でヘイト検出", "title": "What is Behind the Implicit Hate Speech? A Double-layer Multi-agent Voting Detection Method via Explanation Generation", "url": "https://doi.org/10.1145/3860322", "authors": "Yi Zhu ほか", "venue": "ACM Transactions on Knowledge Discovery from Data", "date": "2026-11-12", "sjr": 1.317, "citescore": 9.8, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "暗黙のヘイトスピーチ（遠回しな表現で憎悪を伝える投稿）を、LLMに背景の説明を生成させ、それを使った二層の多エージェント投票で検出する方法を提案した（抄録）。", "p3": "まず発言の背後にある歴史や文化の物語を説明として生成し、その説明をプロンプトに入れてLLMに判定させる。LLMの幻覚（もっともらしい誤り）を除くため、二層の多エージェント投票を設計した（抄録）。", "p5": "英語と中国語のデータセットでの実験で、最先端の手法の性能を上回ったと報告する（抄録）。", "fun": "あからさまな悪口は見つけやすいが、歴史や文化を知らないと分からない遠回しな悪意は、AIにも見抜きにくい。この研究は、まずAIに「この言葉の裏にはどんな話があるか」を説明させ、その説明を手がかりに複数のAIが投票で判定する。説明させてから判断させる二段構えが面白い。", "unverified": "本文を読めておらず、性能の数値とデータセットの名前は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "ChatGPTとDeepSeekの政治概念の語り方", "title": "Ideological framing in political communication: a comparative analysis of ChatGPT and DeepSeek", "url": "https://doi.org/10.1515/omgc-2026-0006", "authors": "Emine Kılıçaslan", "venue": "Online Media and Global Communication", "date": "2026-11-13", "sjr": 0.797, "citescore": 3.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "米国のChatGPTと中国のDeepSeekが、自由・平等・民主主義・社会秩序や国家の役割といった政治の基本概念をどう枠づけるかを比べた探索的な研究である（抄録）。", "p3": "2024年4月にGPT-4とDeepSeek Chatに英語で6つの中核の質問と5項目の追加質問を行い、質的内容分析で言説の枠組み、価値の優先順位、暗黙の前提を比べた（抄録）。", "p5": "どちらも自由・平等・民主主義を似た民主的な言説で説明したが、ChatGPTは個人の自律・権利・民主的な手続きを、DeepSeekは集団の福祉・社会の調和・社会秩序を保つ国家の責任を前面に出した。著者は結果は探索的で一般化できないとしている（抄録）。", "fun": "同じ「自由とは何か」という質問でも、作られた国が違うAIは強調する点が違った。一方は個人の権利を、もう一方は社会の調和を前に出した。私たちが毎日AIに質問するとき、答えの中に見えない価値観が混ざっているかもしれない、と気づかせてくれる点が面白い。", "unverified": "本文を読めておらず、質問の全文と分析の手続きの詳細は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "アブジャの土地利用と到達性で公平なTODを評価", "title": "Integrating Land Use and Multimodal Accessibility for Equitable Transit-Oriented Development: Evidence from Abuja, Nigeria", "url": "https://doi.org/10.33140/jerr.06.02.06", "authors": "Lawan Garba Dan-Alhaji", "venue": "Journal of Economic Research & Reviews", "date": "2026-11-13", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "ナイジェリア・アブジャで、土地利用と複数の交通手段による雇用への到達性を統合し、公平な公共交通指向型開発（TOD）のシナリオを評価した（抄録）。", "p3": "2024年の空間格子で公共交通と自家用車による30分・45分以内の雇用への到達性を測り、2035年に向けて大容量交通の拡張、フィーダー網の統合、駅周辺の高密度化、包摂的なTODを順に加える4つのシナリオを比べた（抄録）。", "p5": "人口で重みづけた45分の公共交通の到達性は基準の78,146職からシナリオDで263,129職（236.7%増）になったが、到達性のジニ係数は基準0.619、シナリオD 0.628とほぼ変わらなかった。鉄道投資だけでは平等は保証されないと結論する（抄録）。", "fun": "鉄道を作れば、多くの人が仕事のある場所へ行きやすくなる。でも、もともと便利な地域の人ばかりがさらに便利になれば、地域の格差は縮まらない。この研究は、全体の便利さを上げることと便利さを公平に配ることは別の目標だと、数字で示した。平均と格差を分けて見る大切さが分かる。", "unverified": "本文を読めておらず、抄録によれば検証用のデータは合成データで、現地での検証ではない。"}}, {"id": "jr37", "rank": 37, "headline": "機械学習で米国の大量輸送事業の予算を検証", "title": "Machine learning models as a budget validation method for U.S. mass-transit projects", "url": "https://doi.org/10.1016/j.trip.2026.102359", "authors": "Paul Boudreau", "venue": "Transportation Research Interdisciplinary Perspectives", "date": "2026-11-13", "sjr": 1.039, "citescore": 6.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、米国の大量輸送（鉄道・バスなど）の事業の予算が妥当かを、機械学習のモデルで検証する方法を扱う研究である（交通研究の学際誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、大きな公共交通の工事の見積もりが甘くないかを、過去の多くの事業のデータから機械学習で確かめられるか、というものだ。公共事業は予算を超えることが多く、事前に見積もりが楽観的すぎると分かれば、税金の使い方の判断に役立つ。", "unverified": "抄録・本文を入手できず、データ、方法、精度はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "地域一体の交通戦略で都市と農村の差を埋める", "title": "Bridging the Urban-Rural gap: Towards evaluating the impacts of regionally integrated transport strategies", "url": "https://doi.org/10.1016/j.jtrangeo.2026.104903", "authors": "Rita Prior Filipe ほか", "venue": "Journal of Transport Geography", "date": "2026-11-13", "sjr": 1.688, "citescore": 10.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、地域で一体的に組んだ交通戦略が都市と農村の格差をどう縮めるかを評価する枠組みを扱う研究である（交通地理学の主要誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、都市と周りの農村を一つの地域として交通を計画すると、農村に住む人の不便さは減るのか、というものだ。都市の中だけで便利さを考えると、周りの地域が取り残されがちになる。地域全体で見る評価の仕方を考える点が興味深い。", "unverified": "抄録・本文を入手できず、対象の地域、方法、結果はすべて未確認。"}}, {"id": "jr39", "rank": 39, "headline": "DEMの衝撃・せん断エネルギー分布を多項式で縮約", "title": "Reduced-order polynomial representation of dem-derived impact and shear energy profiles on mill lifters", "url": "https://doi.org/10.37190/ppmp/242846", "authors": "Hüseyin Efe Selvi ほか", "venue": "Physicochemical Problems of Mineral Processing", "date": "2026-11-12", "citescore": 2.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。抄録は途中で切れている。本文は未取得", "preprint": false, "short": true, "p1": "粉砕ミルの内部のリフターにかかる衝撃・せん断のエネルギーの分布を、個別要素法（DEM）の結果から三次多項式の縮約表現にし、摩耗の予測に使えるようにした（抄録）。", "p3": "直径4,000mm・長さ6,000mmのミル（臨界速度の71.4%、リフター24本、充填率30%）をDEMで解き、法線と接線の接触エネルギーの累積場にエネルギー等価のアーチャードの摩耗式を当てはめた。24本のリフターのエネルギー分布を5つの面の領域に割り当て、中央値を三次多項式で再構成した（抄録）。", "p5": "多項式による再構成の決定係数などの結果は、取得した抄録が途中で切れているため確認できなかった（抄録）。", "fun": "鉱石を砕く巨大な回転ドラムの内側には、石を持ち上げて落とす出っ張り（リフター）があり、使ううちにすり減る。この研究は、粒の一つ一つを計算する重いシミュレーションの結果を、簡単な式に要約して、どの面がどれだけ削れるかを素早く見積もれるようにした。重い計算を軽い式にまとめる発想が面白い。", "unverified": "抄録が途中で切れており、多項式の当てはまりの数値と結論は未確認。本文は読めていない。"}}, {"id": "jr40", "rank": 40, "headline": "レーダー降雨予測と斜面安定解析で崩壊を短期警報", "title": "Short-term shallow landslide early warning framework integrating radar-based precipitation forecasts and a physically based slope stability model in Taiwan", "url": "https://doi.org/10.1007/s11069-026-08454-6", "authors": "Jui-Yi Ho ほか", "venue": "Natural Hazards", "date": "2026-11-13", "citescore": 7.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、台湾で、レーダーによる降雨予測と物理にもとづく斜面安定モデルを組み合わせ、表層崩壊の短期の早期警報を行う枠組みを示す研究である（自然災害の専門誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、数時間後の雨の予報と、雨水がしみ込んだ斜面が崩れるかどうかの力学の計算をつなげば、崩れる前に警報を出せるか、というものだ。雨の量だけで判断するより、斜面ごとの崩れやすさまで考えられれば、避難の判断がより的確になる。", "unverified": "抄録・本文を入手できず、対象の地域、精度、結果はすべて未確認。"}}, {"id": "jr41", "rank": 41, "headline": "個別要素法の断層モデルでせん断帯粒子を機械学習分類", "title": "個別要素法を用いた逆断層変位解析におけるせん断帯粒子の機械学習分類と特徴量寄与度分析", "url": "https://doi.org/10.11532/jsceiii.7.3_1103", "authors": "片桐 淳 ほか", "venue": "AI・データサイエンス論文集", "date": "2026-11-13", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "J-STAGEの抄録・本文とも取得できず、日本語と英語の題名のみ", "preprint": false, "short": true, "p1": "題名によれば、逆断層の変位を個別要素法（粒子の集まりとして地盤を計算する方法）で解析し、せん断帯に入る粒子を機械学習で分類して、どの特徴量が分類に効いているかを分析した研究である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、断層がずれるとき地盤のどの粒が「ずれの帯」に巻き込まれるかを、粒の性質からAIで見分けられるか、そして何が決め手になるのか、というものだ。地表にずれが現れる場所の予測につながる可能性がある。", "unverified": "抄録・本文を入手できず、モデルの条件、分類の精度、効いた特徴量はすべて未確認。"}}, {"id": "jr42", "rank": 42, "headline": "CNNの二段階同定で橋梁の異常同定精度を改善", "title": "CNNを用いた橋梁異常同定における帰属確率誘導型二段階同定法による同定精度改善の検討", "url": "https://doi.org/10.11532/jsceiii.7.3_1125", "authors": "嵯峨濃 拓海 ほか", "venue": "AI・データサイエンス論文集", "date": "2026-11-13", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "J-STAGEの抄録・本文とも取得できず、日本語と英語の題名のみ", "preprint": false, "short": true, "p1": "題名によれば、CNNを用いた橋梁の異常同定で、CNNが出す帰属確率で誘導する二段階の同定法（PG-2）により、同定の精度を改善できるかを検討した研究である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、AIが「この部分が怪しい」と答えるときの自信の度合い（確率）を手がかりに、もう一度絞り込んで調べ直せば、橋の異常の場所をもっと正確に当てられるか、というものだ。一度で決めず、自信の低いところを二段目で確かめる考え方だ。", "unverified": "抄録・本文を入手できず、対象の橋梁、データ、精度の改善の程度はすべて未確認。"}}, {"id": "jr43", "rank": 43, "headline": "地震後の鉄道単純桁橋の走行安全性を評価", "title": "Train Running Safety Assessment Method for Railway Simply Supported Girder Bridges after Earthquakes", "url": "https://doi.org/10.32604/sdhm.2026.083339", "authors": "Lin Pang ほか", "venue": "Structural Durability & Health Monitoring", "date": "2026-11-13", "citescore": 2.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトの抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、地震の後の鉄道の単純支持桁橋で、列車が安全に走れるかを評価する方法を提案する研究である（構造の耐久性と健全性監視の専門誌の論文）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、地震で少し傷んだ橋の上を列車がいつもの速さで走っても大丈夫か、をどう判断するか、というものだ。橋が壊れていなくても、ずれや傾きが残ると、走る列車の揺れが大きくなって脱線の危険が高まるかもしれない。橋と列車を一緒に考える必要がある問いだ。", "unverified": "抄録・本文を入手できず、手法の中身と評価の結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "上司のスマホ優先が部下の提案を減らす", "title": "Supervisor Phubbing and Employee Promotive Voice: The Roles of Supervisor–Employee Rapport and Need for Social Approval", "url": "https://doi.org/10.1177/23294884261502986", "authors": "Abdulkhamid Komil ugli Fayzullaev ほか", "venue": "International Journal of Business Communication", "date": "2026-11-13", "sjr": 1.047, "citescore": 11.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "上司のファビング（部下と話している最中にスマホに気を取られること）が、上司と部下の関係の良さを損ない、部下の改善の提案（促進的な発言）を減らすことを示した（抄録）。", "p3": "韓国の従業員307人への3時点の時間差調査で、ファビング→上司と部下のラポール→促進的な発言の媒介と、部下の社会的承認欲求による調整を検証した（抄録）。", "p5": "上司のファビングはラポールと負に関係し、ラポールは促進的な発言と正に関係して媒介した。社会的承認欲求の強い部下ほど、ファビングとラポールの負の関係が強く、発言への間接の負の関係も強かった（抄録）。", "fun": "話しかけているのに相手がスマホばかり見ていたら、もう話す気がなくなる。この研究は、上司がそうすると部下との関係が冷え、職場をよくするための提案まで減ることを調査で示した。とくに人に認められたい気持ちの強い部下ほど影響を受ける。小さな態度が組織の改善の芽を摘むという点が身近で面白い。", "unverified": "本文を読めておらず、効果の大きさと測定尺度の詳細は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "孝の規範が介護者の「得たもの」を形作る", "title": "How Filial Piety Shapes Benefit Finding Among Family Caregivers: A Narrative Study Based on Adult Child Caregivers of Older Parents With Dementia", "url": "https://doi.org/10.1177/14713012261505528", "authors": "Hong Huang ほか", "venue": "Dementia", "date": "2026-11-13", "sjr": 0.993, "citescore": 5.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "認知症の親を介護する子が、中国の孝の規範のもとで介護から得たもの（ベネフィット・ファインディング）をどう見いだすかを、語りの研究で明らかにした（抄録）。", "p3": "上海で、主に中等度の認知症の親を介護する子15人への詳しい面接を、語りの方法で分析した（抄録）。", "p5": "孝は介護者の役割の自覚と道徳的責任を強めて内発的な動機を生み、得たものの発見を高める一方、世代間の権威の関係を作り変えた。介護者は付き添い・世代間の責任・自分の世話を通じて孝を作り直し、従う孝から釣り合いのとれた孝へと変化した（抄録）。", "fun": "親の介護はつらいことが多いが、その中で「自分が成長できた」「家族の絆が深まった」と感じる人もいる。この研究は、親に尽くすべきという中国の伝統的な考えが、介護の意味づけを支えつつ、時代に合わせて「無理をしない親孝行」へと作り直されていく様子を描いた。伝統が変わりながら生きる姿が興味深い。", "unverified": "本文を読めておらず、面接の分析手続きの詳細は未確認。15人の質的研究で一般化には限りがある。"}}, {"id": "jr46", "rank": 46, "headline": "中国版顧客満足度指数で幼稚園の保護者満足", "title": "Investigating Parental Satisfaction Towards Private Kindergartens in China: A Chinese Customer Satisfaction Index Approach", "url": "https://doi.org/10.47405/mjssh.v11i5.4014", "authors": "Xinyi Xie ほか", "venue": "Malaysian Journal of Social Sciences and Humanities (MJSSH)", "date": "2026-11-13", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "中国版の顧客満足度指数（CCSI）の枠組みを私立幼稚園に当てはめ、ブランドイメージ・期待・知覚品質・保護者満足の関係を調べた（抄録）。", "p3": "広西チワン族自治区の私立幼稚園4園に子どもを通わせる保護者へのオンライン調査（有効回答109件）を、構造方程式モデルで分析した（抄録）。", "p5": "ブランドイメージは保護者の期待を、期待は知覚品質を、知覚品質は満足をそれぞれ有意に高めた。幼稚園の評判とイメージが期待を通じて品質の評価と満足を形作ると結論する（抄録）。", "fun": "顧客満足度指数は、もともと車や銀行などの会社のサービスを比べるための物差しだ。この研究は、それを幼稚園に当てはめ、評判のよい園ほど親の期待が高まり、その期待が「質がよい」という評価につながることを示した。期待が高いと評価が厳しくなるのではなく、むしろ高くなるという流れが面白い。", "unverified": "本文を読めておらず、尺度の項目と適合度の値は未確認。標本は4園109件と小さい。"}}, {"id": "jr47", "rank": 47, "headline": "心理的風土がホテル従業員の先回りの接客を生む", "title": "From meaning to mastery: how psychological climate fosters eco-friendly employees and proactive service stars", "url": "https://doi.org/10.1108/ijchm-02-2026-0233", "authors": "Boya Yang ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-13", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "誌のサイトに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "ホテル従業員の職場の心理的風土が、仕事の意味づけを通じて、自発的な環境配慮行動と先回りの接客の両方を高めることを示した（抄録）。", "p3": "マカオの4つ星・5つ星ホテルの従業員603人の2時点のデータを、SmartPLS 4のPLS-SEMと条件付き媒介、ホテル単位のクラスタを調整した経路分析で検証した（抄録）。", "p5": "仕事の意味づけは、心理的風土と環境配慮行動（効果量は中）および先回りの接客（小）の関係を媒介した。相互依存的な自己観は、心理的風土と意味づけの関係を強めて間接効果を高めた（抄録）。", "fun": "ホテルの従業員が頼まれなくても電気をこまめに消したり、お客の困りごとに先回りしたりするのはなぜか。この研究は、職場が自分を大切にしてくれると感じ、仕事に意味を見いだせることが両方の行動の共通の源だと示した。環境への配慮と接客の質が同じ心の道筋から生まれるという点が面白い。", "unverified": "本文を読めておらず、心理的風土の測定尺度の詳細は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "カルマンフィルタとMPCで路面外乱を抑える", "title": "Estimation‐Driven Model Predictive Control Architecture for Active Suspension Systems Under Road Disturbances", "url": "https://doi.org/10.1002/asjc.70297", "authors": "Waqar Alam ほか", "venue": "Asian Journal of Control", "date": "2026-11-13", "citescore": 5.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "四分の一車両モデルの能動サスペンションで、測れない状態を離散時間カルマンフィルタで推定し、その推定値でモデル予測制御を行う構成を示した（抄録）。", "p3": "カルマンフィルタで再構成した状態をMPCに入れ、制約つきの有限区間の二次最適化で制御入力を計算する。MPCの費用関数をリアプノフ関数の候補として安定性を解析し、MATLAB/Simulinkで段差や穴の路面外乱を与えてシミュレーションした（抄録）。", "p5": "実際の状態と推定した状態の比較でカルマンフィルタの最小分散の性質を確かめ、閉ループの最適制御が状態の調整・外乱の除去・制御の手間で開ループより優れ、振動の抑制・整定時間・行き過ぎ量を改善したと報告する（抄録）。", "fun": "車のサスペンションは、段差の衝撃を和らげるが、車体の動きの一部はセンサーで直接は測れない。この研究は、測れる情報から測れない動きを推定し、その推定をもとに少し先まで見越して最適な力を加える。見えないものを推定してから動かすという、制御の基本の組み合わせが分かりやすい例だ。", "unverified": "本文を読めておらず、シミュレーションの数値の結果と実車での検証の有無は未確認。"}}, {"id": "jr49", "rank": 49, "headline": "BOTDAの分布ひずみ計測で橋梁を監視", "title": "Brillouin Optical Time Domain Analysis-Based Distributed Strain Sensing for Structural Health Monitoring of Bridges", "url": "https://jnde.isnt.in/index.php/JNDE/article/view/144", "authors": "Subbash Padmanabhan ほか", "venue": "Journal of Non-Destructive Testing & Evaluation (JNDE)", "date": "2026-11-10", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "光ファイバーのブリルアン散乱を使う分布ひずみ計測（BOTDA）の装置を実験室で作り、橋梁などの静的・準静的な構造ヘルスモニタリング向けの性能を評価した（抄録）。", "p3": "50kmの計測範囲で、ポンプパルスの幅100nsと20ns（空間分解能約10mと2m）で測り、平均化の条件ごとに信号対雑音比の距離による変化を調べた。ブリルアン周波数シフトの不確かさを反復測定で評価し、ローレンツ曲線の当てはめと相互相関の推定を比べ、温度による較正も行った（抄録）。", "p5": "抄録には計測の条件と評価の項目は書かれているが、信号対雑音比や周波数シフトの不確かさの具体的な数値は示されていない（抄録）。", "fun": "1本の光ファイバーを橋に沿わせると、その全長にわたってどこがどれだけ伸びたかを測れる。光がファイバーの中で少しだけ周波数を変えて跳ね返る現象（ブリルアン散乱）を使うからだ。この研究は、その装置を自作し、50kmの長さでどれくらいの細かさと確かさで測れるかを確かめた。", "unverified": "抄録に性能の数値がなく、本文も読めていないため、精度と分解能の実測値は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "開発経済学", "headline": "80分の講習で志が高まり貧困層の所得が増えた", "title": "Aspiring to a Better Future: Can a Simple Psychological Intervention Reduce Poverty?", "url": "https://doi.org/10.1093/restud/rdag100", "authors": "Kate Orkin ほか", "venue": "Review of Economic Studies", "date": "2026-11-10", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "ケニアの農村415村で貧困層の女性8,300人を対象に、将来の志を高めて計画を立てる80分の講習を無作為に割り付け、大きな無条件現金給付とも交差させた。17か月後、講習は偽の講習に比べて志、労働供給、投資、収入、生活水準を大きく高め、志の上昇が最も有力な仕組みだと報告する。現金給付も志を高めるという。"}, {"id": "jn02", "rank": 2, "field": "組織行動・心理的安全性", "headline": "心理的安全性の「蜃気楼」：見かけだけの安全", "title": "The Emergence of Psychological Safety or its Mirage", "url": "https://doi.org/10.1287/orsc.2024.19549", "authors": "Patricia Satterstrom ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "2チームを2年間追った民族誌（会議の逐語記録と面接）から、心理的安全性がどう生まれ、あるいは生まれないかの理論を組み立てた。どちらのチームにも、表面上は安全の兆しがあるのにメンバーが対人リスクを避け続ける「心理的安全性の蜃気楼」があり、外部からの圧力で指導者が自己防衛的に動いたことが原因だったと報告する。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "商業不動産の規制緩和で米国の生産が増える", "title": "The Impact of Commercial Real Estate Regulations on U.S. Output", "url": "https://doi.org/10.1093/restud/rdag121", "authors": "Fil Babalievsky ほか", "venue": "Review of Economic Studies", "date": "2026-11-10", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "米国の資本ストックの約2割を占める商業不動産の建築規制について、混雑効果を含む空間一般均衡モデルを作り、課税評価記録の土地と建物の価値の比から都市圏ごとの規制指数を構築した。規制を全米で適度に緩めると、資源配分の効率が大きく改善すると報告する。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "衛星で見た製鉄所の炭素税への対応", "title": "How Firms Respond to Carbon Taxation", "url": "https://doi.org/10.1287/orsc.2024.19313", "authors": "Arzi Adbi ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "67か国の製鉄所882か所の96か月分の衛星による排出データで、炭素税に企業がどう対応するかを調べた。同じ生産活動を複数国にもつ多国籍性と設備の物理的な特性が、排出原単位を下げて「よりきれいに作る」対応と「生産を減らす」対応のどちらを選ぶかを左右すると報告する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "銀行規制緩和で競争が増すとリスクテイクが増えた", "title": "Deregulation, Market Structure, and the Evolution of U.S. Banking", "url": "https://doi.org/10.1287/mnsc.2025.01128", "authors": "Emilio Bisetti ほか", "venue": "Management Science", "date": "2026-11-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "米国の州ごとの銀行規制緩和の強さをネットワークにもとづく新しい指標で測り、競争の効果と投資機会の効果を分けて識別した。競争が強まると預金の調達費用が上がり利ざやと収益が下がり、銀行は事業モデルを変えてリスクテイクを持続的に増やしたと報告し、文献の食い違う証拠を整理する。"}, {"id": "jn06", "rank": 6, "field": "気候科学", "headline": "大気の酸素が示す強まる海洋の炭素吸収", "title": "Atmospheric O 2 reveals a strengthening ocean carbon sink and a stagnant net land sink since 1990", "url": "https://doi.org/10.1126/science.aed9544", "authors": "Eric J. Morgan ほか", "venue": "Science", "date": "2026-11-12", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "30年以上の大気中の酸素と二酸化炭素の観測から、1990〜2019年に海洋の炭素吸収が10年あたり0.63ペタグラム炭素/年ずつ強まり（平均2.8）、化石燃料排出の35%を吸収した一方、陸域の正味の吸収には頑健な傾向がなかったと示した。多くの過程モデルの再現性に疑問を投げかける。"}, {"id": "jn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "危機対応の成功が医師の不信を深めた逆説", "title": "Explaining Coexisting Trust and Distrust Transitions: The Case of Senior Doctors in the UK NHS", "url": "https://doi.org/10.1111/joms.70190", "authors": "Branko Božič ほか", "venue": "Journal of Management Studies", "date": "2026-11-13", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "英国NHSの上級医が経営側への信頼が低い状態から不信が高い状態へ移る過程を、3時点の質的データで追った。コロナ禍での指導者の前向きな危機対応が一時的に期待を高め、その後期待が裏切られたことで、長期的な不信の深まりがかえって加速したと報告する。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "急速充電網の空間競争は地域独占を生むか", "title": "Spatial Competition in Fast-Charging Networks", "url": "https://doi.org/10.1287/isre.2024.1246", "authors": "Philipp Artur Artur Kienscherf ほか", "venue": "Information Systems Research", "date": "2026-11-13", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "why": "電気自動車の航続距離のため急速充電の競争は地域的になる。充電所の混雑による待ち時間と立地の魅力を組み込んだ空間競争の枠組みで、充電事業者の価格戦略と消費者の厚生を分析し、充電網の空間構造と所有構造が地域独占につながる条件を調べる。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "VCは投資先の間で起業家人材を回している", "title": "Redeploying the Jockeys: The Intermediary Role of Venture Capital in Entrepreneurial Labor Markets", "url": "https://doi.org/10.1287/mnsc.2023.01626", "authors": "Zhongchen Hu", "venue": "Management Science", "date": "2026-11-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "ベンチャーキャピタルが投資先企業の間に内部労働市場をつくり、創業者の能力についての私的情報をもとに人材を配置していることを、新しいデータと調査で示した。元パートナーの影響が残ること、内部労働市場の強さがファンドの収益を予測すること、情報の非対称が大きいほど効果が強いことを報告する。"}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "理不尽な仕事は有能で手の空いた若手に回る", "title": "Who Will be Assigned Unreasonable Tasks by Supervisors: A Conjoint Survey Experiment", "url": "https://doi.org/10.1002/hrm.70110", "authors": "Haien Ding ほか", "venue": "Human Resource Management (USA)", "date": "2026-11-13", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "why": "上司464人に、属性を無作為に変えた架空の部下4,640人分のプロフィールを示し、職務外の理不尽な仕事を誰に割り当てるかをコンジョイント実験で調べた。若く、成果が高く、手助けをよくし、いま仕事の少ない、上司と親しい部下が選ばれやすく、効率の論理が最も強く働いていたと報告する。"}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "気候リスク開示が投資家のリスク分担を変える", "title": "Climate Risk Disclosure and Risk Sharing in Financial Markets", "url": "https://doi.org/10.1093/rfs/hhag009", "authors": "Kevin Smith", "venue": "The Review of Financial Studies", "date": "2026-11-13", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "気候リスクの開示が投資家の間のリスク分担をどう変えるかを理論モデルで分析した。開示は気候リスクのヘッジに役立つ銘柄を見分けやすくしてリスク分担を改善し、企業の自発的開示の誘因と開示義務の効果、気候に関心の高い投資家が持つ銘柄の気候リスク・プレミアムの低下を導く。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "時間の報告は社員の自発的努力を減らすか増やすか", "title": "Effortful vs. Opportunistic Consumption of Discretionary Time: How Time-Reporting Decisions Influence Extra-Role Effort", "url": "https://doi.org/10.1287/mnsc.2025.00955", "authors": "Sophie Maussen", "venue": "Management Science", "date": "2026-11-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "契約で決まった仕事を終えた後の裁量時間を、契約外の有益な活動に使うか怠けるかについて、上司が時間の報告を求めることの効果を実験で調べた。報告は不信の合図として努力を減らすという予測と、仕事の価値を伝える合図として努力を増やすという新しい仕組みの予測を、報告の形式と導入者を操作して比べる。"}, {"id": "jn13", "rank": 13, "field": "環境科学", "headline": "乾燥した気候が河川の硝酸汚染を増幅する", "title": "Climate aridity amplifies global riverine nitrate beyond human inputs", "url": "https://doi.org/10.1126/science.aeg2366", "authors": "Kayalvizhi Sadayappan ほか", "venue": "Science", "date": "2026-11-12", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "機械学習で再構成した世界の河川の硝酸濃度地図から、硝酸汚染は人間の負荷だけでなく気候の乾燥度でも大きく高まり、農業・都市の中心から離れた場所にも高濃度域ができると示した。約290万の河川区間で、生態の閾値を超える範囲は陸域の約33%に及び、約56億人に関わると報告する。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "「常時つながる働き方」研究の前提を問い直す", "title": "Constant Connectivity as Everyday Practice: Theorizing Through Problematization", "url": "https://doi.org/10.1111/joms.70188", "authors": "Matthew B. Perrigino ほか", "venue": "Journal of Management Studies", "date": "2026-11-13", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "いつでもどこでも仕事につながれる状態（常時接続）の研究を問題化の方法で見直し、仕事と私生活の境界の捉え方、私生活との両立を最初から否定する見方、あいまいな「技術利用」の測定に偏りがあると指摘した。常時接続を日常の実践として捉え直す新しい理論の方向を示す。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "管理の仕組みは研究を伸ばすが教育は伸ばさない", "title": "Managing Multiple Goals: Research and Teaching in Colleges", "url": "https://doi.org/10.1162/edfp.a.497", "authors": "Prashant Loyalka ほか", "venue": "Education Finance and Policy", "date": "2026-11-12", "sjr": 1.408, "citescore": 4.2, "citescore_year": "2025", "why": "インドの260の大学学科で学生約1万8,000人と教員約5,000人を調べた縦断データから、目標が一致しない組織で「近代的」な管理手法が効くかを検証した。管理手法は研究成果の増加と結び付くが学生の学習とは結び付かず、研究志向の学科で研究への効果が見られたと報告する。"}, {"id": "jn16", "rank": 16, "field": "地球物理学", "headline": "西南極の地殻隆起を説明する3次元マントル粘性", "title": "Geodetic observations in West Antarctica reveal geodynamically consistent 3D mantle viscosity", "url": "https://doi.org/10.1126/science.aeh5525", "authors": "Donna L. dePolo ほか", "venue": "Science", "date": "2026-11-12", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "1990年代以降の急速な氷の減少で起きた西南極の地殻の隆起と重力の変化を、地球力学的に整合した3次元のマントル粘弾性構造と1900〜2020年の氷の履歴で再現した。GNSSの地殻変動とGRACEの重力変化を同時に説明でき、弱いアセノスフェアを含むレオロジーが必要だと示す。"}, {"id": "jn17", "rank": 17, "field": "物理学", "headline": "量子力学版の「合意定理」", "title": "The quantum agreement theorem", "url": "https://doi.org/10.1073/pnas.2613021123", "authors": "María García Díaz ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-12", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "共通の理論をもつ観測者どうしが確率の評価で合意するかを問うオーマンの合意定理（1976年）の量子力学版を、2人の観測者が局所的な射影測定で情報を得る三者系で調べた。測定どうしと対象の性質が可換なら共通の確信から合意が導かれることを証明し、可換でない場合との違いを論じる。"}, {"id": "jn18", "rank": 18, "field": "物理学", "headline": "グラフェン中の電子の「粘性」を定量測定", "title": "Quantitative measurement of viscosity in two-dimensional electron fluids", "url": "https://doi.org/10.1126/science.adr5469", "authors": "Yihang Zeng ほか", "venue": "Science", "date": "2026-11-12", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "電子の集団を流体として扱う電子流体力学で、核心の量である電子の粘性を精密に測るのは難しかった。コルビノ形状のグラフェン素子の磁気抵抗を使ってオーム的な寄与と粘性の寄与を分け、単層・二層グラフェンで電子どうしの散乱率が温度に比例することを示した。"}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "土地の不平等が救貧給付を広げたプロイセン", "title": "From Wealth to Welfare: How Economic Elites Made Inequality Work", "url": "https://doi.org/10.1177/00104140261500270", "authors": "Nils Blossey", "venue": "Comparative Political Studies", "date": "2026-11-13", "sjr": 3.796, "citescore": 8.6, "citescore_year": "2025", "why": "先進国が所得移転は大きく行うのに富の再分配はほとんど行わない理由を、プロイセンの土地所有の不平等から考えた。地主が土地をもたない労働者の所得の不安定さを救貧給付で補い、不平等な所有秩序を安定させたという仮説を、地方の救貧調査のデジタル化と行政構造を使って検証する。"}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "消費者協同組合の合併は誰の得になるか", "title": "Mergers of Consumer Cooperatives", "url": "https://doi.org/10.1287/msom.2024.1202", "authors": "Sina Moghadas Khorasani ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-11-13", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "英国・イタリア・スイスで消費者協同組合が購買力を高めるために合併している。協同組合が組合員のために調達する二層のサプライチェーンのゲーム理論モデルで、合併が市場の結果、消費者厚生、供給者の利益、社会厚生に与える影響を分析した。"}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "男性CEOの企業の戦略ほど他社に模倣される", "title": "Follow Him or Her? CEO Gender and Inter-organizational Imitation of Strategic Behaviors", "url": "https://doi.org/10.1287/stsc.2026.0663", "authors": "Abhinav Gupta ほか",     "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
