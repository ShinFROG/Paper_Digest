 "RePEc NEP", "date": "2026-09-28", "why": "運行費・ICカード・車両GPSを組み合わせ、補助の帰着・空間配分・アクセシビリティ成果を一体で評価しており、交通政策の公平性評価の枠組みを広げる。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex（SocArXiv）の抄録を使用", "preprint": true, "p1": "ブラジル・ベロオリゾンテのバス補助金について、誰が受け取るか、運賃負担、市内のどこに配分されるか、アクセスの公平性という4つの問いを一つのデータで同時に検証し、補助の公平性は一つの答えに決まらないことを示した（抄録）。", "p2": "公共交通の補助金が貧困層に役立つかは、通常「1回の乗車あたり誰がより多く受け取るか」で判断されるが、それは全体像の一部にすぎない（抄録）。", "p3": "運営事業者の支出、ICカードの乗車記録、車両のGPSを組み合わせ、車両の区間ごとの費用を計算して乗っている人に配分する（抄録）。そのうえで、運賃負担、市内の地域別の配分、累積型・重力型の多様なアクセシビリティ指標による公平性を、功利主義・十分主義・平等主義・ロールズ主義の4つの規範的な見方で評価する（抄録）。", "p4": "2022年から補助を受けている同市のバス網を対象に、所得五分位ごとの受取額と負担、地区ごとの配分、パラメータを広く変えたアクセス指標で検証する（抄録）。", "p5": "乗客の間では補助は累進的で、最貧五分位は最富裕五分位の1.68倍を受け取り、南の国々の先行研究と逆の結果だった（抄録）。一方、最貧五分位は所得が8.7分の1なのに運賃を最も多く払い、乗客の45.8%は運ぶ費用より多い運賃を払っていた（抄録）。配分は所得で見ると累進的だが、アクセスの不利で見ると逆進的だった（抄録）。功利主義と十分主義の判定はほぼ安定し、平等主義とロールズ主義の判定は指標と設定で変わった（抄録）。", "p6": "著者は、一つの問いに答えて止めることは誤りではないが部分的であり、代替の答えを報告しなければ選択と区別できないと述べる（抄録）。残る疑問：一都市の事例で、補助の制度設計（車両キロあたりの支払い）が異なる都市への一般化は限られる。未査読のプレプリントである。", "fun": "バスの補助金は貧しい人の役に立っているか。答えは「どの物差しで測るか」で変わった。受け取る額では貧しい人ほど得をしているのに、地域で見ると、行きたい所に行きにくい地域ほど恩恵が少ない。同じデータでも見方を変えると結論が逆になる、だから一つの数字だけで「公平」と言い切らないことが大事だ、という教訓が面白い。", "unverified": "本文が読めず、アクセシビリティ指標の具体的な設定と地区別の結果の図は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "空間動学ベイズ木で世代間移動と所得格差", "title": "Dynamic Spatial Bayesian Machine Learning Model: Applications to Intergenerational Economic Mobility and Geographic Income Inequality in the United States", "url": "https://arxiv.org/abs/2610.00072", "authors": "Hammed A. Olayinka ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "高次元の時空間パネルに対する空間動学BARTを開発し、既存の空間計量モデル群と比較したうえで米国の世代間移動と地域格差に適用している。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§7の結論）と目次を読んだ。§2のモデル式、§3のシミュレーション、§5〜6の適用結果の表は見出しと結論部分のみ", "preprint": true, "p1": "地域×時点の高次元パネルデータに対し、空間的な波及と時間変化、個人単位の非線形性を一つのベイズモデル（DSP-BART-HS：動的空間パネルのベイズ加法回帰木にホースシュー縮小を組み合わせたもの）で扱い、既存の空間計量モデルや機械学習より安定して予測できることを示した（抄録）。", "p2": "地域と時点で集計したデータを使う従来の手法は、個人単位の非線形な関係が結果のばらつきを生むと大きく性能が落ちる（抄録）。空間計量経済学と木のアンサンブル法は、それぞれ片方の構造しか捉えられない（§7）。", "p3": "回帰木の和（BART）で個人単位の非線形な関係を柔軟に表し、地域間の空間的な拡散と時間の動きを加え、多数の文脈変数の係数にホースシュー事前分布（必要な変数だけを残す縮小）を置いてギブスサンプラーで推定する（抄録、§2）。", "p4": "不規則な空間配置、密な政策効果、個人単位の非線形な交互作用などを含む9つのデータ生成シナリオ（各200回）で、構造的空間計量モデル、非パラメトリック機械学習、小地域推定と比べる（抄録）。実データでは米国の郡単位の世代間の経済的移動と所得格差の2つのパネルで、未見の地域・無作為・時間方向の保留検証を行う（抄録）。", "p5": "DSP-BART-HSはすべてのシナリオで最良か最良と統計的に区別できなかった（抄録）。集計データを使う比較手法は、個人単位の非線形性が効くと3倍以上の誤差で後れをとった（抄録）。実データでは、構造の異なる5つのモデルが8つの共線的な郡の共変量のうち5つ（人種構成、貧困、過去の雇用、住宅費用など）で符号と有意性が一致した（§7）。", "p6": "著者は、時間方向の外挿では軽い地域別自己回帰モデル（MTS-CAR-X）が一貫して優れることを明確な限界とする（抄録）。また、選ばれた共変量は頑健な予測上の相関であって因果的な政策手段ではなく、観測されない郡の特徴との交絡には対処していないと明記する（§7）。未査読のプレプリントである。", "fun": "どこの町で生まれると親より豊かになりやすいか、という問いには、町と町のつながり、時代の変化、一人ひとりの事情が絡み合う。この研究は、その3つを一度に扱える統計モデルを作り、未知の町についても予測できるかを試した。ただし「どの要因が効いているか」は予測の手がかりであって原因とは限らない、と著者自身がはっきり断っている点も誠実で面白い。", "unverified": "シミュレーションの各シナリオの誤差の数値と、実データの保留検証の詳細な結果（表）は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "利用者ごとのAIエージェントが集まると成績が落ちる", "title": "Worse Together: How Performance Breaks Down in Multi-User Multi-Agent Teams", "url": "https://arxiv.org/abs/2610.00583", "authors": "Sahan Paliskara ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "異なる利用者の目的を代理するAIエージェント同士が共有資源で協調に失敗し、一人に任せるより悪くなる状況を体系的に調べた研究。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、目次、§8の限界）を読んだ。§3〜7の各環境の詳細結果と付録は見出しのみ", "preprint": true, "p1": "異なる利用者の代理として働くAIエージェントが、予算・予定表・共同注文などの共有資源をめぐって集まると、1つのエージェントが全員に仕えるより集団の結果が一貫して悪くなることを、5つの最先端モデルと77の場面で示した（抄録）。", "p2": "人がAIエージェントに仕事を任せることが増え、そのエージェント同士が共有資源で出会う場面も増えているが、各エージェントが別々の利用者の目標を追うときの協調の失敗は体系的に調べられていなかった（抄録）。", "p3": "計算予算を共有するAPIキー環境、予定表を共有するクリニック、共同注文・予約を共有する個人アシスタント、リリースの締め切りを共有するマージキューの4環境で、全員に仕える1体の調整役と、利用者ごとに1体ずつのチーム（エージェント間の通信あり・なし）を比べる（抄録）。", "p4": "集団としての結果（共有資源の使い方、利用者の要望が満たされた割合など）を環境のログから機械的に採点し、同意や虚偽の主張はClaudeによる判定で付ける（抄録、§8）。", "p5": "すべての環境でチームは調整役より悪い集団の結果を出し、通信がないと2つの環境で完全に崩壊し、通信があっても協調の負担が大きな差を生んだ（抄録）。個人アシスタント環境では、調整役が特定の利用者の要望を満たす頻度はチームの約2倍だった（抄録）。人数が増えると止まってしまう、互いの操作を上書きする、事実でない主張を作るといった行動が見られた（抄録）。チームリーダー、明示的な手順の指示、他者のメッセージを読ませてから確定させる仕組みが、環境によって有効だった（抄録）。", "p6": "著者は、実験が高価（74場面を1回まわすのに約34億トークン）で結果が確率的にばらつくこと、同意と虚偽の判定に使ったClaudeの判定を人の判断と照合していないこと、こうした場面のための標準的な仕組みがないことを限界に挙げる（§8）。未査読のプレプリントである。", "fun": "一人の秘書がチーム全員の予定を調整すればうまくいくのに、一人ひとりに別々の秘書がつくと、それぞれが自分の主人を優先して予約を取り合い、全体はかえって混乱する。この研究は、AIエージェントでまさにそれが起きることを示した。賢いAIを集めても良いチームになるとは限らない、という人間の組織と同じ問題が見えるのが面白い。", "unverified": "環境ごとの詳細な数値（崩壊の程度、対策ごとの改善幅）と使った5つのモデル名は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "因果推論", "headline": "二者関係データの因果的波及を標的試験で定式化", "title": "Beyond Actor-Partner Associations: A Target-Trial Framework for Causal Spillover Effects in Longitudinal Dyadic Data", "url": "https://arxiv.org/abs/2610.00181", "authors": "Subir Hait", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "カップルなど二者の縦断データでの相手への効果を、標的試験の枠組みで因果効果として定式化しており、APIMの解釈を厳密にする。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、目次、§7.2〜7.3の解釈と限界）を読んだ。§2〜5の定式化・推定・シミュレーションの詳細は見出しのみ", "preprint": true, "p1": "夫婦などの二者関係データで、本人と相手への効果を表すAPIM（行為者-パートナー相互依存モデル）の係数がいつ因果効果になるかを、二者関係の標的試験（target trial）として定式化し、二人の処置の確率を別々に掛け合わせる推定がどれほど偏るかを閉じた式で示した（抄録）。", "p2": "APIMは一方の曝露が本人と相手の結果にどう関連するかを記述するが、その係数は追加の設計と識別の仮定がなければ因果効果ではない（抄録）。二者関係の研究では関連を因果と読み過ぎることが繰り返されてきた（§1.2）。", "p3": "二者内の干渉（相手の処置が自分の結果に影響する）を許す潜在アウトカムで因果の推定対象を定義し、同時の交換可能性・正値性・正しく特定された条件付き平均の下でAPIMの係数が因果対比と一致することを示す（抄録）。二値処置では、二人の傾向スコアを掛け合わせると、誤差δ(H)=Cov(A₁,A₂|H)という1つのパラメータのずれが生じ、4つのセルの誤差は(+δ,−δ,−δ,+δ)になる（抄録）。推定には同時傾向スコアによるIPWとAIPW、交差適合を使う（§4）。", "p4": "36シナリオのシミュレーションと真の周辺確率を使った分解の診断で、偏りの源を調べ、米国の健康と退職調査（HRS）の2,400組の夫婦で、退職の移行とその後の抑うつ症状に適用する（抄録）。", "p5": "残る依存が強いと、別々の傾向スコアによる大きな偏りは主に掛け合わせ（分解）によるもので、柔軟なAIPWは非線形モデルの偏りを減らすが支持の弱さによる不安定は減らさなかった（抄録）。最も強い依存の条件では、真の周辺確率を掛け合わせても波及の対比の符号が逆転し、交互作用は真値の約5倍に膨らんだ（抄録）。HRSでは夫婦そろっての退職がまれで（40組）、推定は支持域と傾向スコアの下限設定に敏感だった（抄録、§7.2）。", "p6": "著者は、この枠組みは観測されない交絡を解決せず、同時の交換可能性は検証できない仮定であること、コホートの構成が基準時点後の情報を使っていることを限界に挙げ、HRSの結果は退職が抑うつに影響しないという結論ではなく診断として読むべきだと述べる（§7.2〜7.3）。貢献は新しい一般理論ではなく、APIMの問いを因果分析につなぐ設計と診断の橋渡しだとしている（抄録）。", "fun": "夫が退職すると妻の気分が変わる、というように、二人組では相手の行動が自分にも影響する。でも夫婦は退職の時期を相談して決めることが多いので、二人の「退職する確率」を別々に計算して掛け合わせると、効果の向きが逆に見えることさえある。二人の決定が独立でないことを無視すると統計がどう壊れるかを、きれいな式で示したのが面白い。", "unverified": "§5のシミュレーション結果の表と、HRSでの効果の推定値そのものは確認していない。"}}, {"id": "pn13", "rank": 13, "field": "開発経済学", "headline": "小規模農家向け天気予報の改善競争を設計する", "title": "Can we create a `race to the top' for weather forecasts to inform smallholder farmer decisions?", "url": "https://arxiv.org/abs/2610.00782", "authors": "Colin Aitken ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "AI天気予報で低中所得国の農家向け予報を安く作れる状況で、予報の質を競わせる仕組みを論じており、開発分野での技術活用に示唆がある。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論と概要、表1の原則と例）を読んだ。補足資料の各原則の詳細な手順は見出しのみ", "preprint": true, "p1": "AI天気予報で安く作れるようになった農家向けの天気予報について、質の低い予報が良い予報を駆逐する「底辺への競争」を防ぎ、予報の質を信頼できる形で示すための原則と手順（品質基準の出発点）を提案した（抄録、§1）。", "p2": "AI天気予報は少ない計算資源で高品質の予報を作れるため、新興企業や研究者も農業向け予報を作り始めたが、資金提供者や政府が予報の質を見分けるのは難しい（§1）。見分けられないと、情報の非対称性による市場の失敗として、安くて質の低い予報が広がる恐れがある（§1）。", "p3": "気象学、社会科学、統計学、計算機科学の評価の良い実践を集め、①透明性（独立の評価者が主張を再現できる情報を出す）、②適切な評価（気候値や公開モデルなど意思決定に関わる比較対象と比べ、指標を都合よく選ばない）、③標本外の技能の実証、④意思決定への関連性、の4原則と、それぞれの手順の例と失敗例を示す（§1、表1）。", "p4": "これは実証研究ではなく提案で、表1と補足表S1の点検表が評価の枠組みになる（§1）。具体例として、学習に使ったのと同じデータで弱い気候値と比べて「30%改善」と主張する例や、公開モデルなら45%改善できるのに30%改善の製品を高く買ってしまう例を挙げる（表1）。", "p5": "結果は原則と手順の提案そのもので、数値の検証結果はない（§1）。著者は、AI天気予報は過去のほぼ全データで学習しているため、同じ時期の観測で検証すると誤った安心を与えうることや、見た目だけ現実的な「農場単位」の予報は検証データが得られないことを指摘する（§1）。", "p6": "著者は、これを利害関係者の合意形成のための出発点と位置づけ、普及の過程の質（原則4）は予報の検証ほど深く扱っていないと述べる（§1）。残る疑問：認証の仕組みを誰が運営し、費用をどう負担するか。未査読のプレプリントである。", "fun": "天気予報の良し悪しは、実際に雨が降るまで分かりにくい。だから、安くていい加減な予報と、手間をかけた良い予報が同じ値段で売られると、良い予報が負けてしまうかもしれない。中古車市場で「はずれ」の車ばかりが残る話と同じ構図だ。この論文は、農家を守るために「予報の成績表の書き方」のルールを先に決めよう、と提案している。", "unverified": "補足資料の各原則の詳細な手順と、§1で触れられた2つの具体例（Illustrative Example 1・2）の中身は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "予測市場Polymarketの取引・気配と価格発見", "title": "Trades, Quotes, and Price Discovery in Prediction Markets&nbsp;", "url": "https://doi.org/10.2139/ssrn.7547106", "authors": "Pat Akey ほか", "venue": "SSRN", "date": "2026-10-01", "why": "オンチェーンの全取引と気配値で予測市場の流動性と価格発見を詳細に記述しており、予測市場の市場構造の基礎的な実証。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "予測市場Polymarketの全オンチェーン取引とティック単位の最良気配から、価格発見の大部分は取引ではなく気配の更新が担っていることを示した（抄録）。", "p2": "背景：予測市場の価格は出来事の確率の予測として使われるが、その価格がどのように形成され、どれだけ正確かを、市場の微細構造（取引と気配）のデータで調べた研究は限られる。", "p3": "全取引記録とティック単位の最良気配を使い、スプレッド・板の厚さを記述し、ベクトル自己回帰（VAR）で効率的な価格の変動のうち取引による部分と気配の更新による部分を分ける（抄録）。", "p4": "スプレッドと板の厚さの価格帯ごとの違い、取引のない時間帯の割合と価格変動への寄与、VARの分散分解、中値と直近取引の予測精度を評価する（抄録）。", "p5": "スプレッドは価格0ドルと1ドル付近で最も狭く板が厚く、0.50ドル付近で最も広く薄かった（抄録）。1分間の99%で取引がないが、その時間帯が価格変動の76%を占めた（抄録）。VARでは効率的価格の変動の分散のうち取引による部分は最大4%で、気配の更新がその数倍の価格発見を担った（抄録）。中値はスプレッドが狭いと正確な予測で、直近取引はわずかに正確だが時間が経つと精度が落ちた（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：取引がほとんどない市場が多い中で、どの市場を分析対象に含めたか、結論が出来事の種類によって変わるかは本文で確かめる必要がある。未査読のプレプリントである。", "fun": "「明日雨が降る確率」を売り買いする市場では、値段がそのまま確率の予想になる。ところが調べると、1分のうち99%は誰も売り買いしていないのに、値段の動きの大部分はその静かな時間に起きていた。実際の取引より「この値段なら買う・売る」という掲示の出し直しが情報を運んでいるのだ。市場は取引だけでなく、待っている注文も語っていることが分かる。", "unverified": "本文が読めず、対象市場の数と期間、VARの設定は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "強化学習は追加学習なしに強い方策を作れる", "title": "Does Scaling Reinforcement Learning Really Require More Training?", "url": "https://arxiv.org/abs/2610.01133", "authors": "Bangji Yang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "完了した強化学習の履歴から、最適化が通過しなかったより強い方策を作れることを示し（方策空間のスケーリング）、計算資源の使い方に新しい選択肢を示す。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§3.2の結果、§5の結論）を読んだ。§2の手法の詳細、§3.3以降、付録は見出しのみ", "preprint": true, "p1": "終わった強化学習の訓練履歴の中の2つのチェックポイントを重みの上で組み合わせるだけで、追加の学習も推論時の計算の増加もなしに、訓練中に通過したどのチェックポイントより強い方策を作れることを示した（方策空間のスケーリング）（抄録）。", "p2": "推論能力を伸ばすには、強化学習の計算を増やすか推論時の計算を増やすのが普通で、訓練の履歴そのものを資源として使う方法はほとんど考えられていなかった（抄録、§1）。", "p3": "SURGEは、精度の高い「アンカー」と、短い応答を出す競争力のある「ドナー」の2つのチェックポイントを、共通の初期値からの変化量として表す（抄録）。アンカーの変化量を特異値分解して主要な成分を残し、そこにドナーの補完的な成分を加える（抄録）。アンカーの変化量をどれだけ残すかの目標を固定すると、候補の方策を試さずに重みだけからブロックの大きさが決まる（抄録）。", "p4": "1.5Bの数学推論の2つの訓練履歴（DeepSeek、Nemotron）と7Bのコード生成の履歴（OLMo）で、9つのベンチマークの平均正解率と推論トークン数を、元の2つのチェックポイントや訓練中の全チェックポイントと比べる（抄録、§3）。", "p5": "DeepSeekのAIME24では、訓練中に測った最高の50.83%を上回る54.17%に達し、トークン数はアンカーの8,065に対し7,798だった（§3.2）。9ベンチマークの平均は53.26%から55.35%に上がり、トークンは5.3%減った（§3.2）。Nemotronでも平均が63.29%から65.08%に上がりトークンは12.8%減り、OLMoのHumanEval+は82.8%から83.7%になった（抄録、§3.2）。", "p6": "本文で読んだ範囲に限界の独立した節はなく、著者は構築と評価のコストを明示したうえで、展開は単一の方策で済むと述べる（§5）。残る疑問：検証は3つの訓練履歴のみで、改善幅は数ポイント程度であり、ベンチマークの評価のばらつき（付録C）と比べた頑健性は本文で確かめる必要がある。未査読のプレプリントである。", "fun": "山登りの途中で撮った2枚の地図をうまく重ね合わせたら、実際には通らなかった、もっと高い地点が見つかった、というような話だ。AIの訓練は途中経過をたくさん保存しているが、普通は「一番成績の良い1つ」だけを使う。この研究は、その途中経過の組み合わせに、訓練では一度も到達しなかったより強いAIが隠れていることを示した。追加の学習なしで性能が上がるのが面白い。", "unverified": "§3.3〜3.5の結果（7Bコードの詳細、アブレーション）と付録の評価のばらつきは確認していない。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "中国の報復関税下での米国産品の関税回避", "title": "Washing Away the US: Tariff Evasion Under China's Retaliatory Tariffs", "url": "https://doi.org/10.2139/ssrn.7548817", "authors": "Huijia Liu ほか", "venue": "SSRN", "date": "2026-10-01", "why": "品目別貿易データと段階的DiDで、報復関税に対する原産地偽装などの関税回避を示しており、貿易政策の実効性評価に重要。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米中貿易戦争で中国が米国産品に原産地別の報復関税をかけると、米国の対中輸出の報告と中国の対米輸入の報告の差が広がり、原産地を偽って関税差を利用する関税回避が増えたことを示した（抄録）。", "p3": "HS6桁の品目別の二国間貿易データで、段階的な差の差法を使い、報告の食い違いを関税回避の指標とした（抄録）。", "p5": "報復関税は報告の差を有意に広げた（抄録）。原産地の偽装は、海上輸送の経由地としてもっともらしく、戦前から中国と取引があって統計上の隠れみのになる第三国で集中した（抄録）。法定の関税除外は回避を弱めたが、市場ベースの除外には効果がなかった（抄録）。", "fun": "関税は「どこの国の製品か」で税率が変わるので、ラベルを貼り替えれば安くなる。米国が「中国へ輸出した」と言う量と、中国が「米国から輸入した」と言う量の食い違いが、報復関税の後に広がっていた。消えた差の一部は、第三国産に化けた米国製品らしい。貿易統計のずれから「見えない抜け道」を探る発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "中国の廃棄物輸入禁止の環境効果と生産調整", "title": "Environmental Gains and Production-side Adjustment under Trade Restrictions: Evidence from China's Waste Import Ban&nbsp;", "url": "https://doi.org/10.2139/ssrn.7547118", "authors": "Zihan Zhang", "venue": "SSRN", "date": "2026-10-01", "why": "2017年の輸入禁止を使い、環境改善と輸入原料の制約による生産の歪みのトレードオフを実証している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の2017年の廃棄物輸入禁止が、輸入に依存していた都市の不法投棄地の面積と廃棄物部門のメタン排出を減らした一方で、サプライチェーンに対照的な調整をもたらしたことを示した（抄録）。", "p3": "複数のデータ源を組み合わせ、禁止前の輸入への依存度の都市・企業間の違いを利用して効果を推定した（抄録）。", "p5": "禁止は依存度の高い都市で衛星で検出された投棄地の面積と廃棄物部門のメタン排出を減らした（抄録）。新規参入は小さな再生市場では回収業者へ、大きな市場では製造能力のある再生業者から離れる方向に移り、制限された素材を使う川下産業の参入も減り、禁止前の輸入許可をもつ既存企業は事業を縮小した（抄録）。", "fun": "中国が外国のごみ（再生資源）の輸入をやめると、ごみの不法投棄は減り環境は良くなった。でも、そのごみを原料にしていた工場は材料が手に入りにくくなり、規模を縮めた。環境を守るための貿易の制限にも、産業への副作用がある。衛星写真で投棄地の広さを測るという調べ方も面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "中国はIPO市場へのアクセスで産業政策を行う", "title": "Industrial Policy via the IPO Market", "url": "https://doi.org/10.2139/ssrn.7546843", "authors": "Zhiguo He ほか", "venue": "SSRN", "date": "2026-10-01", "why": "政策上優遇される業種であることがトービンのqよりもIPOを予測することを示し、資本市場を通じた産業政策の実態を明らかにする。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国では、業種のトービンのqではなく政策上の優遇がIPOを予測し、政府が株式市場への上場機会の配分を産業政策の道具として使っていることを示した（抄録）。", "p3": "2002〜2022年の業種別のIPO件数と調達額を、政策上の優遇の有無と業種の投資機会の指標（トービンのq）で説明し、米国と比べた（抄録）。政府が業種ごとの上場の機会を決め、市場がどの企業がそれを得るかを決めるという枠組みを作った（抄録）。", "p5": "優遇業種は非優遇業種よりIPOが287%多く、調達額が148%多かった（抄録）。政策上の優遇は上場後も続く評価のプレミアムも予測した（抄録）。", "fun": "株式市場への上場は、本来は成長の見込みが高い会社ほど多くなるはずだ。ところが中国では、成長の見込みよりも「国が力を入れる業種かどうか」で上場の数が決まっていた。優遇された業種は上場が約4倍に近い多さだった。証券取引所の門の開け閉めが、国の産業の育て方の道具になっている点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "アルゼンチンの非自動輸入許可と川下企業", "title": "The Downstream Consequences of Non-Tariff Trade Barriers: Theory and Evidence from Import Licenses in Argentina", "url": "https://doi.org/10.2139/ssrn.7552900", "authors": "Ezequiel Garcia Lembergman ほか", "venue": "SSRN", "date": "2026-10-02", "why": "関税以外の貿易障壁が川下の企業に与える影響と市場支配力の役割を理論と実証で示している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "アルゼンチンの非自動輸入許可（NAIL）が、制限された中間財に頼る川下の企業の輸出と雇用を減らし、国全体の輸出を3.3%減らしたことを、データと寡占の貿易モデルで示した（抄録）。", "p3": "2005〜2011年の輸入許可の段階的な導入と新しい許可データで企業の輸入・輸出・雇用への影響を推定し、可変のマークアップをもつ寡占競争の貿易モデルで集計の効果を評価した（抄録）。複数の国に輸出する企業のコスト・ショックへの反応の違いから、企業規模によるマークアップの弾力性を推定する方法を作った（抄録）。", "p5": "制限された投入財に頼る企業は輸出と雇用が有意に減った（抄録）。企業は市場シェアの大きい市場ほど輸出を減らさず、NAILは国全体の輸出を3.3%減らし、マークアップが一定なら減少は55%大きかった（抄録）。", "fun": "関税の代わりに「輸入の許可を出し渋る」という見えにくい壁を作ると、部品を輸入して製品を作る国内の会社が困り、輸出も雇用も減った。ただし大きなシェアをもつ会社は値上げを我慢して輸出を守ったので、国全体の落ち込みは小さめで済んだ。保護のつもりの政策が自国の輸出を傷つける仕組みが見える。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "年齢-賃金曲線を企業と職業の要因に分解", "title": "Understanding the Age–Wage Profile: The Role of Employers and Occupations", "url": "https://doi.org/10.2139/ssrn.7545420", "authors": "Aniko Biro ほか", "venue": "SSRN", "date": "2026-10-02", "why": "2004〜2022年の雇用者-被雇用者結合データで、生涯の賃金の伸びを企業・職業固有の要素に分解した労働経済学の実証。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ハンガリーの雇用者-被雇用者の結合行政データ（2004〜2022年）で、生涯の賃金の動きを個人・雇用主・職業の要素に分け、若い時期の高賃金企業への移動と、高齢期の企業プレミアムの相対的な低下の役割を示した（抄録）。", "p3": "賃金を個人・雇用主・職業の固有の要素に分解し、年齢ごとの寄与を推定した（抄録）。", "p5": "賃金は35歳ごろまで急速に伸び、その後は伸びが鈍り、やがて下がった（抄録）。25〜34歳の賃金の伸びの約5分の1から4分の1は高賃金企業への移動で説明され、職業の移動の役割はずっと小さかった（抄録）。高齢期の賃金の低下の約半分は雇用主と職業の要素の低下で説明され、高齢労働者は新しく現れる高賃金企業に入りにくくなっていた（抄録）。", "fun": "給料は35歳ごろまでぐんぐん上がり、その後は伸びが止まって下がり始める。その理由を分解すると、若いうちは「給料の高い会社に移ること」が伸びの大きな部分を占め、年をとると「新しく現れた給料の高い会社に移れないこと」が下がる原因の一部になっていた。個人の努力だけでなく、どの会社にいるかが生涯の給料を左右する点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "生成AIシミュレーションでリーダー行動を研究", "title": "A Framework for Studying Leadership Behavior in Generative AI Simulations", "url": "https://doi.org/10.2139/ssrn.7553190", "authors": "Derek Lusk", "venue": "SSRN", "date": "2026-10-02", "why": "ロールプレイや管理シミュレーションに代わる研究手法として、生成AIによる対話型シミュレーションの枠組みを提示している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "生成AIによる対話型のシミュレーションをリーダーシップの行動研究に使うための枠組みを示し、参加者の行動に応じて状況が変わるため、同じ設計でも参加者ごとに異なる状況に直面するという方法論上の問題への対処を論じた（抄録）。", "p3": "ロールプレイ、経営シミュレーション、相互作用の符号化など既存の方法を開放性・相互作用・統制・過程の記録・規模で比べ、生成エージェントと評価の妥当性の先行研究にもとづいて、反応する環境での行動証拠がいつ妥当な推論を支えるかを判断する枠組みを作った（抄録）。", "p5": "情報の探索とコミットメント、リーダーシップの経路、行動の適応、利害関係者の管理などの研究機会を特定した（抄録）。枠組みの詳細は入手した抄録が途中で切れており未確認。", "fun": "リーダーの振る舞いを研究するには、部下や取引先の役をAIに演じさせると便利だ。ただ、AIは参加者の言動に反応して話を変えるので、同じ実験でも人によって違う場面に出会うことになる。これでは比べられない、という問題を正面から扱い、どんなときなら結論を出してよいかの基準を考えた点が面白い。", "unverified": "抄録が途中で切れており、枠組みの判断基準の中身は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "組織行動・心理的安全性", "headline": "利用者投稿から音声アシスタントへの信頼を探る", "title": "“I wouldn’t trust her with my life but...” - Exploring trust in voice-based assistants through user-generated content", "url": "https://doi.org/10.31235/osf.io/kwnqz_v1", "authors": "Katharina Frehmann ほか", "venue": "SocArXiv", "date": "2026-10-02", "why": "人のようでも機械でもある音声アシスタントへの信頼を、利用者が生成したコンテンツから分析しており、AIへの信頼研究の方法を広げる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "Alexa、Siri、Googleアシスタントについてのドイツ語の利用者の投稿169件を質的に分析し、音声アシスタントへの信頼を技術への信頼・対人的な信頼・メディアへの信頼を統合した視点で捉えた（抄録）。", "p3": "技術・対人・メディアの3つの信頼の考え方を統合した理論的視点を作り、マーケットプレイス、報道の下のコメント、議論の場から集めた投稿を質的内容分析した（抄録）。", "p5": "利用者がどのように評価しているかの結果は、入手した抄録が途中で切れており未確認（抄録）。", "fun": "音声アシスタントは機械なのに人のように話し、ニュースや天気などの情報源にもなる。だから「信頼」も、機械として壊れないか、人として誠実か、情報として正しいか、と何通りもある。この研究は、ネットの口コミから人々がどの意味で信頼しているかを読み取ろうとした。「命は預けないけど…」という題名の言葉が、信頼の微妙さをよく表していて面白い。", "unverified": "抄録が途中で切れており、分析の結果は確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "子会社マネジャーの政治的スキルが本社に効く", "title": "WHEN POLITICAL SKILL TRAVELS UPWARD: SUBSIDIARY MANAGERS, HEADQUARTERS GOVERNANCE, AND PERFORMANCE IN MULTINATIONAL ENTERPRISES", "url": "https://doi.org/10.2139/ssrn.7552818", "authors": "Hanqing  Chevy Fang ほか", "venue": "SSRN", "date": "2026-10-02", "why": "子会社の経営者の政治的スキルを関係的な資源として捉え、多国籍企業の統治下での戦略形成と業績の関係を検討している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "多国籍企業の子会社のマネジャーの政治的スキル（本社の優先事項に合わせて提案を枠づけ、連合を作り、資源と裁量を得る力）が、子会社と企業全体の業績に正に関連し、本社側の条件で強まることを示した（抄録）。", "p3": "台湾の多国籍企業261社と子会社840社の、多水準・多情報源・時間差のあるデータで、モジュール型ガバナンスの視点から本社の条件との相補性を検証した（抄録）。", "p5": "子会社マネジャーの政治的スキルは子会社の業績と、集計すると企業の業績に正に関連し、本社のCEOが政治的スキルをもち、権限を与えるリーダーシップをとり、支援的な管理をするときに効果が強まった（抄録）。", "fun": "海外の子会社の社長が本社をうまく説得できると、子会社の成績が上がる。でも、その「根回し力」が活きるかどうかは、本社の社長が聞く耳をもっているかで変わった。下からの働きかけと上の受け止め方がかみ合ってはじめて組織が動く、という当たり前に思えることを、840の子会社のデータで示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "組織スティグマが海外子会社の探索・活用を変える", "title": "How Organizational Stigma Shapes Exploratory and Exploitative Innovation in Foreign Subsidiaries", "url": "https://doi.org/10.2139/ssrn.7549205", "authors": "Yu Chang ほか", "venue": "SSRN", "date": "2026-10-01", "why": "注意に基づく視点から、スティグマの強さと持続性が子会社の探索的・活用的イノベーションに与える異なる影響を検討している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の多国籍企業の海外子会社601社のパネル（2016〜2023年）で、組織への汚名（スティグマ）の強さと持続性が、探索的・活用的なイノベーションに異なる影響を与え、受入国の個人主義がその関係を弱めることを示した（抄録）。", "p3": "注意に基づく視点から、スティグマの強さと持続性を区別し、ポアソン疑似最尤法で推定した（抄録）。", "p5": "スティグマの強さは探索的イノベーションと正に関連したが活用的イノベーションとは関連せず、持続性は両方と正に関連した（抄録）。受入国の個人主義は強さと両方のイノベーションの関係、持続性と活用的イノベーションの関係を弱めた（抄録）。", "fun": "「中国企業だから」と疑いの目で見られる海外の子会社は、かえって新しいことに挑戦していた。悪い評判が強いと新しい分野を探り、長く続くと今の事業の改良にも力を入れる。ただ、個人主義の国ではその反応が弱かった。逆風が工夫を生む、という見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "労働を代替するAIを自律的資本として統治する", "title": "Managing Machine Labor: Ownership, Access, and Governance of Autonomous Capital", "url": "https://doi.org/10.2139/ssrn.7551538", "authors": "Birendra K. Mishra", "venue": "SSRN", "date": "2026-10-02", "why": "AIが労働を補完する場合と代替する場合で必要な経営が異なることを論じ、自律的資本の所有・アクセス・統治の理論を提示している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "労働を代替するAIを「自律的資本」と捉え、経営の中心問題がAIを使った仕事の管理から、仕事をする資産の所有・アクセス・請求権・統制の統治へ移ることを理論モデルで示した（抄録）。", "p3": "人の参加と機械の労働が共同で産出を生み、機械の労働は自律的資本が生むというモデルを作った（抄録）。", "p5": "AIの労働代替性が高まると、人の労働に帰属する価値の取り分が下がり、自律的資本の取り分が上がる（抄録）。自律的資本の所有が集中すると、労働や参加・アクセスに依存する利害関係者は価値への相対的な請求権を失い、共有された請求権、アクセスの基盤、説明責任の価値が高まることを示した（抄録）。", "fun": "AIが人の仕事を手伝う段階では、会社は「AIをどう使わせるか」を考えればよい。でもAIが人の代わりに働くようになると、問題は「その働くAIを誰が持ち、誰がその稼ぎを受け取るか」に変わる。この論文は、働き手からAIの持ち主へ価値が移っていく仕組みを数式で示した。経営の問いが根本から変わるという指摘が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "エネルギービッグデータセンターと探索的グリーン革新", "title": "Beyond data access: Energy big data centers and corporate exploratory green innovation", "url": "https://doi.org/10.2139/ssrn.7552719", "authors": "Peide Lai ほか", "venue": "SSRN", "date": "2026-10-02", "why": "データ基盤の整備が企業の持続可能性に関する知識の境界を広げるかを、中国の上場製造業データで検証している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の省レベルのエネルギー・ビッグデータセンターの設立を準自然実験として、データ基盤が上場製造業の探索的なグリーン・イノベーションを促すことを示した（抄録）。", "p3": "2015〜2024年の中国A株上場製造業のデータで、センターの設立の時期の違いを使って効果を推定し、頑健性の検証、仕組み、異質性を分析した（抄録）。", "p5": "センターは探索的なグリーン・イノベーションを促し、政府の環境補助金が主な経路で、環境ガバナンスと開示の質が高い企業で効果が強かった（抄録）。デジタル化の進んだ企業、長期志向の経営者、環境評判の低い企業、厳しい規制、極端な暑さへの曝露が大きい企業で効果が強かった（抄録）。", "fun": "エネルギーのデータを集めた公的なセンターができると、近くの工場が新しい環境技術に挑戦しやすくなった。データそのものより、データをもとに配られる補助金が効いていたらしい。データ基盤が企業の「知らなかった分野」への挑戦を後押しするという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "外部予測を取り込みリスク比を効率的に推定", "title": "Integration of external predictions for efficient estimation of the risk ratio", "url": "https://arxiv.org/abs/2610.00769", "authors": "Victoria Mezger ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "観察研究のデータを使って無作為化試験のリスク比推定の精度を上げる推定量の理論で、試験の効率化に関わる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "無作為化試験に、観察データで学習した外部の予測（基盤モデルなど）を組み合わせ、リスク比を試験データだけの推定より漸近分散が大きくならないように効率よく推定する方法を示した（抄録）。", "p3": "複数の基盤モデルの予測を取り込みつつ妥当な推論を保つハイブリッドAIPW推定量を、曝露群と非曝露群の絶対リスクの比（リスク比）の推定に拡張した（抄録）。", "p5": "外部の非構造データで学習したブラックボックスのモデルの情報を使っても、推定量の漸近分散は試験データだけの既定の推定量より大きくならないことを示した（抄録）。", "fun": "新薬の試験は参加者が少ないと結果があいまいになる。そこで、別のデータで学んだAIの予測を「ヒント」として足すと精度を上げられる。ただしAIが間違っていても結論が歪まないように工夫する必要がある。この研究は、AIのヒントが役に立てば得をし、役に立たなくても損をしない推定の方法を、リスクの比に広げた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "裾の重い場合の潜在次元のノンパラメトリック識別", "title": "Nonparametric Identification of Latent Dimension under Heavy-Tailed and Mixed-Signals", "url": "https://arxiv.org/abs/2610.00588", "authors": "Chetkar Jha", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "因子分析・主成分分析で最も重要な潜在次元の数の決定を、重い裾や混合信号の下でも成り立つ方法で扱っている。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "主成分分析・因子分析で潜在次元（因子の数）を決める平行分析が、混合した信号や裾の重い誤差の下でうまく働かない問題に対し、データを順位に変換してから平行分析を行うRank PAを提案し、緩い条件で一致性を証明した（抄録）。", "p3": "列ごとの並べ替えでは信号が壊れず帰無のスペクトルが膨らむことを指摘し、順位変換したデータ行列の秩序の度合いに潜在次元が保存され、並べ替えのもとでの交換可能性が回復することを示した（抄録）。", "p5": "因子の広がり（pervasiveness）や厳しい4次モーメントの仮定なしに、Rank PAが因子の数を一致推定できることを証明した（抄録）。推定可能な因子数の上限など詳細は入手した抄録が途中で切れており未確認。", "fun": "アンケートの多くの質問の背後に「いくつの共通の要因があるか」を決めるのは、因子分析の最初の大事な一歩だ。定番の方法は、データをシャッフルして偶然の場合と比べるが、極端な値が混じるとうまくいかない。この研究は、値そのものではなく「順位」に直してから比べるという単純な工夫で、この問題を解いた点が面白い。", "unverified": "抄録が途中で切れており、一致推定の条件の詳細とシミュレーション結果は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "仲間効果を分位点で捉える社会的自己回帰モデル", "title": "Quantile Social Autoregressive Model", "url": "https://arxiv.org/abs/2610.00933", "authors": "Liyuan Wang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "平均ではなく分位点で仲間の極端な行動の効果を捉えるモデルで、仲間効果の推定の枠組みを広げる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "仲間効果のモデルで、仲間の反応の平均ではなく分位点（たとえば上位の極端な行動）を社会規範とする分位点社会自己回帰モデルを提案し、どの分位点が個人の行動に最も影響するかをデータから推定できるようにした（抄録）。", "p3": "分位点の水準を未知のパラメータとして推定し、疑似反応を操作変数とする新しいモーメント条件と、非平滑性に対するカーネル平滑化で推定・推論する（抄録）。均衡の存在と一意性、識別条件、一致性と漸近正規性を示した（抄録）。", "p5": "モンテカルロ実験で有限標本の性能を調べた（抄録）。実データへの適用の結果は入手した抄録が途中で切れており未確認。", "fun": "友だちの影響を考えるとき、ふつうは「周りの平均」の影響を測る。でも実際には、クラスで一番勉強する子や一番やんちゃな子の影響が大きいかもしれない。この研究は、周りのどの位置（上から何割の人）が一番影響するかを、データから推定できるモデルを作った。平均では見えない影響を捉える発想が面白い。", "unverified": "抄録が途中で切れており、実データへの適用の結果は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "グラフ構造で大規模な確率的レコードリンケージを改善", "title": "Probabilistic linkage with graphs: leveraging cluster structure to improve the accuracy of entity resolution at scale", "url": "https://arxiv.org/abs/2610.00566", "authors": "Evelyn Lauren ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "行政データの大規模連結で、対ごとの照合の誤りをクラスタ構造で改善しており、行政データ研究の基盤技術。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "行政データの大規模な確率的レコードリンケージで、対ごとのリンクを個人のまとまりに解く段階に、他分野のグラフ・クラスタリングの算法を体系的に当てはめ、11の算法を比較して改良法を提案した（抄録）。", "p3": "標準の推移的閉包（閾値で切って連結成分をとる）に対し、個体解決で確立した5つと隣接分野の6つの算法を、3つの模擬データと1つの実データで評価した（抄録）。", "p5": "Leiden、Louvain、ラベル伝播などの他分野の算法が上位に入ったと述べる（抄録）。詳しい比較結果は入手した抄録が途中で切れており未確認。", "fun": "名前の綴りの違いや誕生日の入力ミスがある膨大な記録から「同じ人」を見つけ出すのは、行政データの研究の土台だ。人口が多いほど、別人を同一人物と間違えてつなげる危険が増える。この研究は、SNSのコミュニティ検出のような別分野の技術を持ち込むと精度が上がることを示した。分野を越えた道具の借用が面白い。", "unverified": "抄録が途中で切れており、各算法の精度の数値と提案法の詳細は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "相関したテストでモデル公開基準をどう決めるか", "title": "The Price of Correlated Tests: How Strict Should a Model Release Gate Be?", "url": "https://arxiv.org/abs/2610.00993", "authors": "Marco Pollanen", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "機械学習モデルの公開前テストが相関する場合の判定の厳しさと信頼性を統計的に扱っており、実務の品質管理に直結する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習モデルの公開前の自動テストで、何個のテストに合格すれば公開するかを、合格したモデルの信頼性の目標を満たしつつ良いモデルをできるだけ残す設計問題として定式化し、テストの相関がその代償を決めることを示した（抄録）。", "p3": "2クラスの潜在因子モデルで、2つのコストを1次元の積分に帰着させて計算した（抄録）。", "p5": "両クラスの潜在相関が同じなら、厳しい基準ほど信頼性は上がり、目標を満たす最も緩い基準が良いモデルを最も多く残す（抄録）。全テスト合格を求めると、テスト数が増えるにつれ残る良いモデルの割合はゼロに近づいた（抄録）。ある設定では、99%の目標に独立なテストなら8個で足りるが、潜在相関0.3では74個が必要だった（抄録）。", "fun": "新しいAIを公開する前に「全部のテストに合格したら公開」と決めると安全そうだが、良いAIまで落としてしまう。しかもテスト同士が似ていると、いくら数を増やしても信頼性はなかなか上がらない。独立なテストなら8個で済むところが、似たテストだと74個も必要になる例は、「同じような質問をいくら重ねても確かめたことにならない」という教訓として面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "CMH検定と拡張逆確率重み付けの関係", "title": "On relations between the Cochran--Mantel--Haenszel test and Augmented Inverse Probability Weighting", "url": "https://arxiv.org/abs/2610.01362", "authors": "Ekkehard Glimm", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "臨床試験で古くから使われるCMH検定を、因果推論のAIPW推定量の標準化版として解釈し直している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "臨床試験で古くから使われるコクラン・マンテル・ヘンツェル（CMH）検定の統計量が、因果的な平均処置効果の拡張逆確率重みづけ（AIPW）推定量を標準化したものと解釈できることを示した（抄録）。", "p3": "層別の無作為化試験で二値の結果を扱い、条件付き・無条件の分散と分散推定、検定への含意を論じた短報である（抄録）。", "p5": "CMH検定は層別ロジスティック回帰の共通オッズ比の検定に限られず、古典的な条件付きCMH検定とワルド型AIPW検定の関係が明らかになった（抄録）。処置の割り付けが等しい場合、CMH検定は平均処置効果ゼロという弱い帰無仮説に対して漸近的に保守的になる（抄録）。", "fun": "昔からある古い統計の検定が、実は最新の因果推論の推定量と同じものを別の形で計算していた、という発見だ。古い道具を新しい理論の目で見直すと、どんな前提で何を確かめているのかがはっきりする。昔からの方法が「少し慎重すぎる」ことまで分かる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn33", "rank": 33, "field": "因果推論", "headline": "相対効果を仮定した生存時間の移植可能性", "title": "Transportability methods for failure-time outcomes under assumptions for relative effect measures", "url": "https://arxiv.org/abs/2610.02041", "authors": "Sarah E Robertson ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "相対効果が集団間で一定という仮定の下で、試験結果を別集団の生存時間アウトカムに移す方法を整えている。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "試験結果を別の集団に移す際、分布全体が同じという強い仮定ではなく、リスク比が集団間で一定という相対尺度の仮定のもとで、生存時間の結果の識別結果を示し、肺がん検診の試験に適用した（抄録）。", "p3": "相対効果が集団間でより一定だという臨床的な見方にもとづき、リスク比の移植可能性の識別結果を導き、全米肺検診試験（NLST）の結果を全国代表の健康調査（NHIS）の集団に移した（抄録）。", "p5": "NHISには全死亡のデータがあり検診の交絡もないため、分布の移植可能性の仮定の反証の検討ができた（抄録）。推定値の数値は入手した抄録が途中で切れており未確認。", "fun": "薬や検診の効果は、試験に参加した人と実際に使う人々とで違うかもしれない。「死亡が何%減るか」という比の形なら集団が変わっても同じだろう、という考え方はよく使われるが、その仮定のもとで結果を正しく移す方法は整っていなかった。この研究は、より現実的な仮定で試験結果を一般の人々に当てはめる方法を作った点が面白い。", "unverified": "抄録が途中で切れており、肺がん検診への適用の推定値は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "構造を仮定しない因果表現学習", "title": "Structure-agnostic Causal Representation Learning", "url": "https://arxiv.org/abs/2610.00968", "authors": "Arman Behnam ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "因果構造を事前に指定せずに頑健な特徴を学ぶ因果表現学習の方法を提案している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "因果構造を事前に指定せずに、構造の特定と不変な表現の学習を同時に行う因果表現学習の枠組み（SaCRL）を提案し、構造の特定の理論保証を与えた（抄録）。", "p3": "候補となる不変性の制約をHSICにもとづく違反の指標で評価し、達成可能な構造に自動で重みが集中する柔らかい最適化として構造選択を定式化した（抄録）。", "p5": "合成と半合成のベイジアンネットワークのベンチマークで真の構造を回復し、Colored MNISTで不変性を固定した手法を上回った（抄録）。他の結果は入手した抄録が途中で切れており未確認。", "fun": "AIが「牛は草原にいる」という偶然の相関で牛を見分けると、砂浜の牛を見分けられない。因果表現学習は、本当の原因に当たる特徴だけを学ぼうとするが、どの因果の構造かを先に決める必要があった。この研究は、構造を決めずに、データからふさわしい構造を選びながら学ぶ方法を作った点が面白い。", "unverified": "抄録が途中で切れており、実データでの結果は確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "言語モデルは推論時計算でどこまで伸びるか", "title": "How Much Can Language Models Gain from Test-Time Computation?", "url": "https://arxiv.org/abs/2610.01110", "authors": "Bangji Yang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "推論時の計算を増やす効果を複数領域で、選択のコストも予算に含めて比較しており、推論時スケーリングの実力を評価する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "言語モデルが推論時の計算（並列サンプリングや自己修正）でどれだけ伸び、そのコストはいくらかを、数学・競技プログラミング・エージェント作業の3領域で、選択や批評も含むすべての呼び出しを金額で計上して比べるベンチマーク（SELF-POT）を作った（抄録）。", "p3": "静的な課題では候補の網羅と最終精度を分け、修正での正誤の遷移を追い、エージェント環境では手順の完了も測り、直接推論の予算の一定倍のもとで比べた（抄録）。", "p5": "5つの低コストの推論モデルを350の封印された課題で評価したと述べるが、結果は入手した抄録が途中で切れており未確認（抄録）。", "fun": "AIに何回も考え直させたり、たくさん答えを出させて一番良いものを選ばせたりすると、成績は上がる。でもその分お金もかかるし、「一番良い答えを選ぶ」作業にも費用がかかる。この研究は、全部の費用を金額で数えたうえで、安いAIに何度も考えさせるのと高いAIに一度聞くのとどちらが得かを比べようとしている点が面白い。", "unverified": "抄録が途中で切れており、比較の結果は確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "AI査読者が言い回しに左右される問題と対策", "title": "A Missing Piece for Trustworthy AI Reviewers: From Benchmarking Rhetorical Robustness to SciCore Review", "url": "https://arxiv.org/abs/2609.39027", "authors": "Chenguang Wang ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-02", "why": "同じ科学内容でも書き方で判定が変わるAI査読者の脆弱性を評価し、改善策を示している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "同じ科学を違う言い回しで書いた原稿にAI査読者が異なる判定を下す問題を「修辞的頑健性」として定式化し、1,260の原稿版のベンチマークで30の査読構成を評価し、科学の核を抜き出して判定に混ぜる査読法（SciCore）を提案した（抄録）。", "p3": "内容を保った書き換えでの安定性と、論文の間の識別力の両方を要件とし、全文原稿のベンチマーク（RobustReview）を作った（抄録）。SciCoreは全文の判定と、抽出した構造化された科学の核にもとづく判定を平均する（抄録）。", "p5": "書き換えへの感度が低くても論文間で点数がつぶれる「偽の頑健性」が見つかり、人との一致と修辞的頑健性では査読者の順位が異なった（抄録）。内容重視のプロンプトは頑健性を一貫しては改善しなかった（抄録）。", "fun": "同じ研究結果でも、書き方がうまい論文ほどAIに高く評価されるなら、研究者は中身より文章の飾りに力を入れてしまう。この研究は、言い回しだけ変えた原稿でAI査読者を試し、どの査読者も簡単に左右されることを示した。さらに、論文から「科学の芯」だけを抜き出して評価する工夫を加えた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "ストリーミング動画で知覚・記憶・応答を統一", "title": "OneStreamer: Unifying Perception, Memory, and Proactive Response in Streaming Video Interaction", "url": "https://arxiv.org/abs/2610.01762", "authors": "Xiangyu Zeng ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-02", "why": "ストリーミング動画LLMで、将来必要になる証拠を記憶し十分な証拠がそろった時点で応答する仕組みを提案しており、HFでの注目度が最も高い。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ストリーミング動画のLLMが、後で必要になるか分からない証拠を記憶しつつ、十分な証拠がそろったときに自分から応答できるように、知覚・記憶・応答を一つの生成過程で学ぶOneStreamerを提案した（抄録）。", "p3": "時刻つきの細部の字幕と、完了した出来事の要約を作る階層的な字幕記憶（PHCM）で、過去の映像特徴を見直さずに事実の文脈を与える（抄録）。待機状態ばかりにならないよう、状態の変化と持続を代表するトークンを選んで学習する（PSTL）（抄録）。", "p5": "出力の内容と時刻を利用可能な証拠に合わせるデータ合成の手順も作った（抄録）。性能の数値は抄録になく未確認。", "fun": "生中継の映像を見ながら質問に答えるAIは、何が後で聞かれるか分からないまま、見たことを覚えておく必要がある。この研究は、AIに見た内容を自分でメモ（字幕と要約）させ、そのメモを後で使う仕組みを作った。映像そのものを全部覚えるのではなく、言葉のメモで覚えるという、人間のノートの取り方に似た発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "実観測での生成モデルによる気象データ同化の比較", "title": "Benchmarking Generative Models for Weather Data Assimilation on Real Station Observations", "url": "https://arxiv.org/abs/2610.00728", "authors": "Ruizhe Huang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "気象の再解析で、生成モデルによるデータ同化を実際の観測所データで比較評価している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "気象の生成モデルによるデータ同化を、米国の11,849の実際の観測所（NOAA MADIS）の4変数で、データ・観測演算子・ネットワーク構造を固定して比べた初めての統制されたベンチマークを作った（抄録）。", "p3": "拡散モデルとフローマッチング、画素空間と潜在空間、推論時の複数の条件づけの方法を、古典的な3D-Varの基準と比べた（抄録）。", "p5": "ベンチマークは3つの明確な結論を示したと述べるが、その内容は入手した抄録が途中で切れており未確認（抄録）。", "fun": "天気予報の出発点となる「今の大気の状態」は、予報と観測をうまく混ぜて作る（データ同化）。生成AIでこれを安く速くできるという研究が増えたが、それぞれ違うデータで試していて比べられなかった。この研究は、本物の観測所11,849か所のデータで、条件をそろえて一斉に比べた。公平な比べ方を用意することの大切さが分かる。", "unverified": "抄録が途中で切れており、3つの結論の内容は確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "生物学推論モデルは生物学の入力を使っているか", "title": "When Do Biological Reasoning Models Use Their Biological Inputs?", "url": "https://arxiv.org/abs/2610.00898", "authors": "Ada Fang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "生物学の基盤モデルの表現を入力とするLLMが実際にその入力を使っているかを検証し、ベンチマーク精度の解釈に疑問を投げかける。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "DNA・タンパク質・単一細胞の課題で、生物学の基盤モデルの表現をLLMに渡す6つの「生物学推論モデル」を調べ、LLMが実際には生物学の入力をほとんど使わず文章に従っていることを示した（抄録）。", "p3": "他の入力を固定して一つの生物学の入力を乱す、ある配列の表現と別の配列の文章を組み合わせた証拠の矛盾を作る、LLMが受け取る表現に線形プローブを当てる、推論の過程を入力と照合する、の方法で調べた（抄録）。", "p5": "Evo2とESM3はBioReasonとBioReason-Proの性能にほとんど寄与せず、DNA配列をシャッフルしても病気の予測精度はほぼ変わらず、矛盾の条件では2つのモデルが97.9%と99.7%の場合で文章に従った（抄録）。プローブでは基盤モデルの表現に課題の情報は含まれていた（抄録）。", "fun": "DNAの配列を読み取るAIと言葉のAIをつないだ「生物学の推論AI」は、ベンチマークで良い成績を出していた。ところがDNAの配列をでたらめに並べ替えても成績はほとんど変わらず、AIは添えられた説明文だけを頼りにしていた。成績が良いことと、期待した理由で良いことは違う、という点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn40", "rank": 40, "field": "交通・都市計画", "headline": "農村の多様な交通を統合した広域シミュレーション", "title": "Multimodal rural transit at scale: Simulation-based evaluation of a cross-jurisdictional system integrating fixed-route, mobility-on-demand, and park-and-ride services", "url": "https://doi.org/10.2139/ssrn.7553599", "authors": "Chi-Shiun  (David) Tsai ほか", "venue": "SSRN", "date": "2026-10-02", "why": "固定路線・オンデマンド・パークアンドライドを自治体をまたいで統合した農村交通をシミュレーションで評価している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "農村の交通で、固定路線・オンデマンド・パークアンドライド（PnR）を自治体をまたいで統合する枠組みを作り、シミュレーションで停留所の設定、PnRの効果、固定路線の拡充の効率を評価した（抄録）。", "p3": "発着地の移動データ、事前に計算した所要時間の行列、挿入型の車両経路の算法を組み合わせ、構造化したシナリオ群で性能と費用効率を評価した（抄録）。", "p5": "3つの設計上の問い（成り立つ停留所の設定、PnR停留所の有効性、需要の多い所に絞った固定路線の拡充による効率の改善）に適用したと述べるが、結果の数値は入手した抄録が途中で切れており未確認（抄録）。", "fun": "田舎では、バスは本数が少なく、予約制の乗り合い車は前日に頼まないといけない。この研究は、決まった路線のバス、呼べば来る車、車を停めて乗り換える駐車場をつなぎ合わせて、町の境を越えて使える仕組みをコンピュータで試した。限られたお金で交通の空白をどう埋めるかを考える道具として面白い。", "unverified": "抄録が途中で切れており、3つの設計上の問いへの答え（数値）は確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "交通・都市計画", "headline": "観測のない都市の人流軌跡を転移で生成", "title": "Relative Transitions, Not Absolute Destinations: A Transfer-and-Ground Framework for Target-Trajectory-Free Human Mobility Generation", "url": "https://arxiv.org/abs/2610.02033", "authors": "Yidi Wang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "軌跡データのない都市でも、相対的な移動の遷移を学習して人流を生成する枠組みを提案している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "軌跡データのない都市でも、公開地図の施設（POI）の位置と種類だけから人々の移動軌跡を生成できるよう、「どこへ行くか」ではなく文脈に応じた「相対的な移動の遷移」を学ぶ転移の枠組み（Nomad）を提案した（抄録）。", "p3": "元の都市の施設と軌跡から学び、対象都市では施設の座標と種類だけを使い、対象都市の軌跡は学習・モデル選択・生成のどれにも使わない設定で、移動の仕方の学習と行き先の決定を分けた（抄録）。", "p5": "既存の生成器は絶対的な行き先を予測するため、再利用できる移動の行動と都市固有の施設の配置が絡み合うと指摘する（抄録）。性能の結果は入手した抄録が途中で切れており未確認。", "fun": "人の移動のデータは、多くの都市では手に入らない。この研究は、データのある都市で「家から何km先の店へ行く」といった移動のくせを学び、データのない都市では地図上の店や施設の配置だけを使って移動を再現しようとした。「どこへ」ではなく「どれだけ・どんな所へ」を学ぶ、という切り替えが面白い。", "unverified": "抄録が途中で切れており、生成の精度の結果は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "交通・都市計画", "headline": "シカゴの都市熱は誰に再配分されたか", "title": "Who Is Warming in Chicago? Social Vulnerability, Latino Communities, and the Redistribution of Urban Heat, 2010–2024", "url": "https://doi.org/10.2139/ssrn.7552614", "authors": "Zhihan Tao ほか", "venue": "SSRN", "date": "2026-10-02", "why": "2010〜2024年の都市熱の変化を社会的脆弱性と結びつけ、格差が広がっているかを検証している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "シカゴの2,130の街区群で、2010〜2024年の夏の地表面温度と社会的脆弱性の指標を結びつけ、暑さの格差がどこで、どの側面で広がっているかを調べた（抄録）。", "p3": "Landsat由来の地表面温度と主成分分析による社会的脆弱性の指標を、空間補正した回帰、街区群の固定効果モデル、地理的加重回帰で分析し、暑さの水準・変化・局所的な結びつきの格差を区別した（抄録）。", "p5": "地区間の持続的な暑さの格差はヒスパニック系の割合と言語的孤立と最も強く関連し、ヒスパニック系の割合が10ポイント高いと地表面温度は0.34℃高かった（抄録）。他の結果は入手した抄録が途中で切れており未確認。", "fun": "都会の暑さは、どの地区にも同じように降りかかるわけではない。シカゴを2010〜2024年の衛星データで調べると、ヒスパニック系の住民や英語を話しにくい人が多い地区ほど地面が熱かった。暑さという自然現象にも、社会の格差が地図として刻まれている点が面白い。", "unverified": "抄録が途中で切れており、温度の変化の速さと脆弱性の関係の結果は確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "交通・都市計画", "headline": "統合モビリティ基盤の輸送容量と均衡の存在", "title": "Transport capacity and equilibrium existence in integrated mobility platforms", "url": "https://doi.org/10.2139/ssrn.7550194", "authors": "Henk Meurs", "venue": "SSRN", "date": "2026-10-01", "why": "利用者参加とサービスの相互強化に頼る統合モビリティ基盤で、有限の輸送容量が均衡の存在に与える影響を理論的に扱う。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "利用者の参加とサービスの充実が互いに強め合う統合モビリティ基盤（MaaS）で、有限の輸送容量が参加の均衡の水準だけでなく存在そのものを左右する条件を理論的に示した（抄録）。", "p3": "基盤側の参加の余剰と、待ち・混雑・利用可能性・遅延・不確実さによる輸送性能の損失を分けたモデルで、単一の制約と異質な容量の場合を分析した（抄録）。", "p5": "単一の容量制約では、ある臨界容量を下回ると、不安定な協調の閾値と安定した高参加の均衡が消えることを導いた（抄録）。異質な容量では、参加が容量要素の相対的な重要度を変えない場合に限り、一つの性能指標で表せる条件を示した（抄録）。", "fun": "みんなが使うほど便利になるアプリは、ある人数を超えると一気に広まる。ところが交通のアプリは、実際に人を運ぶバスや車の数に限りがある。この研究は、乗り物が足りないと「みんなが使って便利」という状態そのものが成り立たなくなることを数式で示した。アプリの人気だけでは解けない、現実の容量の壁が見えるのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn44", "rank": 44, "field": "開発経済学", "headline": "農家の貧困削減のためのオペレーションズ・マネジメント", "title": "Operations Management Models for Alleviating Farmer Poverty: Economic and Technological Interventions", "url": "https://doi.org/10.2139/ssrn.7549438", "authors": "Christopher S. Tang ほか", "venue": "SSRN", "date": "2026-10-01", "why": "SDGsの文脈で、農家の貧困を減らす経済的・技術的介入を運用管理のモデルで整理している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "小規模農家の貧困削減に向けた経済的・技術的な介入を支えるオペレーションズ・マネジメント（OM）のモデルを、SDGsと農家の福祉の相乗効果の観点から整理したレビューである（抄録）。", "p3": "価格・費用の補助や最低支持価格などの経済的介入と、携帯電話による市場価格情報の提供、オンラインの知識共有、精密農業、デジタル小口融資などの技術的介入のモデルを検討した（抄録）。", "p5": "この分野の研究機会をいくつか示した（抄録）。個々のモデルの結論の数値は抄録になく未確認。", "fun": "世界の貧しい人の多くは小さな畑を耕す農家だ。最低価格の保証、携帯電話での市場価格の配信、スマホでの少額の融資などの支援は、どれが効くのか。この論文は、在庫や価格の最適化の数学（OM）がそうした支援の設計にどう役立つかを整理した。工場の効率化の道具が貧困対策にも使える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn45", "rank": 45, "field": "交通・都市計画", "headline": "公共交通網で充電しながらドローン配送", "title": "Charging on the Move: UAV Parcel Delivery over Public Transport Networks", "url": "https://doi.org/10.2139/ssrn.7553513", "authors": "Angelo Trotta ほか", "venue": "SSRN", "date": "2026-10-02", "why": "定期運行の公共交通を充電と移動に使うドローン配送の都市物流システムを設計している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "定期運行の路線バスを、配送ドローンの地上の移動手段と車載の充電場所として使う都市の複合物流システムを考え、その運用計画の厳密な定式化と都市規模の計画法を作った（抄録）。", "p3": "荷物の期限、ドローンの電力、バスの時刻表、バス上の着陸台の有限の容量を、時間展開した多重グラフ上の混合整数線形計画で定式化し、依頼が来た時点で処理する容量予約型の構成的な計画法を開発し、ボローニャのバスの時刻表データ（GTFS）で評価した（抄録）。", "p5": "評価の結果は入手した抄録が途中で切れており未確認（抄録）。", "fun": "ドローン配送は渋滞を避けられるが、電池がすぐ切れて充電所に戻らなければならない。そこで、町を走る路線バスの屋根にドローンを乗せて運び、ついでに充電もしてしまおう、という発想だ。時刻表どおりに走るバスとドローンの予定を組み合わせるパズルを解いた点が面白い。", "unverified": "抄録が途中で切れており、ボローニャでの評価結果は確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "経済学", "headline": "経済モデルの複雑さと制約度の測定", "title": "Model Complexity and Restrictiveness", "url": "https://arxiv.org/abs/2610.00784", "authors": "Keaton Ellis ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "合成データで経済モデルの制約度を測る指標を、統計学習理論のラデマッハ複雑度と結びつけている。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "合成データで経済モデルの複雑さを測る「制約度（restrictiveness）」について、ラデマッハ複雑度が制約度の一致的な有限標本推定の特殊な場合のアフィン変換であることを示した（抄録）。", "p3": "Fudenberg、Gao、Liang（2026）が提案した制約度の指標を、統計的学習理論のラデマッハ複雑度と理論的に結びつけた（抄録）。", "p5": "制約度は汎化誤差の上界としての基数的な解釈を受け継ぎつつ、極限のラデマッハ複雑度が一部の反証可能なモデルを区別できないという問題を避けられることを示した（抄録）。", "fun": "経済のモデルは、どんなデータにも当てはまってしまうと「何も予言していない」ことになる。モデルがどれだけ「起こりうること」を絞り込んでいるかを測る物差しが提案されていたが、この論文は、それがAIの分野で使われる複雑さの物差しと実は同じ仲間だと示した。経済学と機械学習の物差しがつながる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn47", "rank": 47, "field": "生命科学・医学（eLife）", "headline": "視覚野の選択確率を59のサル研究で再評価", "title": "Reassessing Choice Probability: What 59 Macaque Studies Tell Us About Decision-Related Activity in Visual Cortex", "url": "https://doi.org/10.7554/eLife.112358.1", "authors": "Anton Pletenev ほか", "venue": "eLife Reviewed Preprint", "date": "2026-10-02", "why": "eLifeの評価はvaluable／solid。59の電気生理研究を統合し、意思決定に関連する活動の指標の食い違いを整理したメタ分析。", "explain": {"basis": "抄録", "basis_note": "eLife Reviewed Preprint（eLifeの公開査読を経た版）。Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "視覚野のニューロンの反応と知覚判断の試行ごとの共変動を表す選択確率（CP）について、59のサルの電気生理研究の150の推定値をメタ分析し、CPを系統的に左右する要因を明らかにした（抄録）。eLifeの評価はvaluable／solid。", "p3": "研究間・研究内でCPとニューロンの感度の関係を調べ、感度を統制したうえで課題と脳領域による違いを検討した（抄録）。", "p5": "CPとニューロンの感度の正の関係を研究間と研究内の両方で確認し、感度を統制するとCPは課題と脳領域をまたいで驚くほど一貫していたが、2つの例外があった（抄録）。例外の内容は入手した抄録が途中で切れており未確認。", "fun": "サルが「右に動いた」と答えるかどうかが、目の情報を受け取る脳の細胞1個の反応の揺らぎとどれくらい連動しているか。この指標は研究によって値がばらばらで、役に立つのか議論されてきた。59本の研究をまとめ直すと、細胞の感度をそろえれば値はかなり一貫していた。ばらばらに見えた結果を整理し直すメタ分析の力が面白い。", "unverified": "抄録が途中で切れており、2つの例外の内容は確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "生命科学・医学（eLife）", "headline": "ニューロフィードバックで聞き分けの神経指標が向上", "title": "Neurofeedback enhances a neural signature of selective attention to speech in cocktail-party settings", "url": "https://doi.org/10.7554/eLife.112403.1", "authors": "Ram K Pari ほか", "venue": "eLife Reviewed Preprint", "date": "2026-10-02", "why": "eLifeの評価はimportant／solid。雑踏の中で特定の話者に注意を向ける神経表現をニューロフィードバックで強められるかを検証している。", "explain": {"basis": "抄録", "basis_note": "eLife Reviewed Preprint（eLifeの公開査読を経た版）。Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "2つの朗読を同時に聞く「カクテルパーティー」の状況で、注意に関わる脳波の指標（N1成分）をリアルタイムで見せるニューロフィードバックにより、聞きたい話への神経反応を強められることを示した（抄録）。eLifeの評価はimportant／solid。", "p3": "参加者が一方の朗読に注意を向ける間、22秒ごとに脳波から時間応答関数のN1成分を取り出して画面に表示し、約49分の訓練で、聞きたい話への反応を強め邪魔な話への反応を弱めるよう学ばせた（抄録）。", "p5": "訓練中、聞きたい朗読への反応のN1成分が、フィードバックに使った電極に特異的に強まった（抄録）。行動上の利益など他の結果は入手した抄録が途中で切れており未確認。", "fun": "にぎやかなパーティーで一人の声を聞き分けるのが難しいのは、耳ではなく注意の問題であることが多い。この研究は、脳波から「今どれくらいその声に注意を向けているか」を画面に映し、本人に見ながら練習してもらった。すると脳の反応が実際に強まった。自分の脳の状態を見て鍛える、という発想が面白い。", "unverified": "抄録が途中で切れており、聞き取りの成績など行動上の効果は確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "統計学", "headline": "複数の密度値時系列の予測", "title": "Forecasting multiple density-valued time series", "url": "https://arxiv.org/abs/2610.00215", "authors": "Han Lin Shang", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "負でなく積分が1という制約のある密度関数の時系列を、複数系列同時に予測する方法を提案している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "負でなく積分が1という制約をもつ密度関数の時系列を複数同時に予測するため、2つの変換で制約のない関数空間に移して予測する方法を作り、日本の都道府県別の年齢別死亡数（1973〜2024年）で比較した（抄録）。", "p3": "中心化対数比変換と累積分布関数にもとづく2つの変換で密度を一対一に写し、多集団の関数時系列モデルと、性別・地域間の差をモデル化する方法の2つを考えた（抄録）。", "p5": "1〜20期先の点予測と区間予測を評価・比較したと述べるが、どの方法が優れたかは入手した抄録が途中で切れており未確認（抄録）。", "fun": "「何歳で亡くなる人が多いか」という分布は、年ごとに少しずつ形を変える。分布は合計が必ず1になるので、ふつうの数字の予測方法がそのまま使えない。この研究は、分布を自由に足し引きできる形に変換してから予測する方法を、日本の都道府県の1973〜2024年の死亡データで試した。日本のデータが方法論の試金石になっている点も面白い。", "unverified": "抄録が途中で切れており、予測精度の比較結果は確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "機械学習", "headline": "ループ型MoEのスケーリング則", "title": "Scaling Laws for Looped Mixture of Experts", "url": "https://arxiv.org/abs/2609.40316", "authors": "Yanbei Chen ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-01", "why": "再帰で計算の深さを、MoEで容量を増やす2つの効率化を同時に扱うスケーリング則を示している。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "再帰で計算の深さを増すループ型Transformerと、疎な専門家の混合（MoE）を同時に扱う初めてのスケーリング則（Loop Scaling Laws）を示し、ループ型モデルの損失を既存の代替より正確に予測した（抄録）。", "p3": "ループによる実効パラメータの増加と、疎性がその増加をどう高めるかを表す、疎性に条件づけた有界な再帰の写像を核に、モデルの大きさとデータ量とあわせてモデル化した（抄録）。", "p5": "スケーリング則はループ型モデルの保留データの損失を既存の代替より正確に予測し、密なモデルとMoEの標準のスケーリング則を特殊な場合として含んだ（抄録）。下流の評価で2つの軸の相補的な利点も示した（抄録）。", "fun": "AIを賢くするには、部品を増やす（パラメータを増やす）か、同じ部品を何度も使い回す（ループ）か、たくさんの専門家から必要な人だけ呼ぶ（MoE）か、の工夫がある。この研究は、使い回しと専門家の組み合わせで性能がどう伸びるかを一つの法則にまとめた。限られた計算資源での設計図になる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "斜張歩道橋の振動同定と使用性を実測で照合", "title": "Effects Dynamic Identification and Serviceability Check for Cable-Stayed Pedestrian Bridges", "url": "https://doi.org/10.18400/tjce.1952485", "authors": "Deha Peker ほか", "venue": "Turkish Journal of Civil Engineering", "date": "2026-10-01", "citescore": 1.9, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "トルコのタシュデレン斜張歩道橋について、有限要素解析（FEA）と常時微動による運用モード解析（OMA）で固有振動数とモード形を同定・照合し、常時の加速度から歩行者に対する振動の使用性を照査した（抄録）。", "p2": "背景：歩道橋は軽く柔らかいため歩行者の動きで揺れやすく、数値モデルが実際の動的特性を再現できるかを実測で確かめる必要がある。抄録は、同種の橋の地震応答解析・振動評価・構造ヘルスモニタリングの基礎にすることを目的に挙げる（抄録）。", "p3": "有限要素モデルで卓越振動数とモード形を予測し、橋の常時微動（風や交通などの環境による揺れ）を計測してOMAで実際の値を同定し、両者を比較する（抄録）。背景：OMAは加振力を測らずに応答だけからモードを推定する方法である。最後に常時の加速度を使用性の基準と照らす（抄録）。", "p4": "評価は、FEAの予測とOMAで同定した振動数・モード形の一致と、常時加速度による振動使用性の照査で行う（抄録）。使用したOMAの手法、センサーの数と配置、使用性の基準名は抄録になく未確認。", "p5": "FEAの予測とOMAの同定結果の比較から、作成した数値モデルが橋の既存の動的特性を予測できることを確認したと述べる（抄録）。具体的な振動数、誤差、使用性の照査結果の数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：常時微動だけで減衰比をどこまで信頼して同定できたか、歩行者の群集荷重のような強い加振での使用性は検討されたか。1橋の事例研究である。", "fun": "人が歩くとかすかに揺れる歩道橋を、コンピュータの中に再現した「模型」と、実物に付けたセンサーの記録とで比べた研究だ。風や人の通行による小さな揺れだけから橋の「固有の揺れ方」を読み取れるのがポイントで、楽器をたたかなくても周りの音で鳴り方が分かるようなものだ。模型が実物と合えば、地震のときの揺れも予測しやすくなる。", "unverified": "本文が読めず、同定した振動数・減衰比の値、モデルの更新の有無、使用性の判定結果は確認していない。"}}, {"id": "jr02", "rank": 2, "headline": "実路コンクリート路面の凹凸計測データを公開", "title": "Dataset of Various Road Measurements on Concrete Surfaces", "url": "https://doi.org/10.3390/data11100255", "authors": "Marius Staat ほか", "venue": "Data", "date": "2026-10-02", "citescore": 5.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ドイツ南西部の2本の連邦道路のコンクリート舗装4地点で、高解像度3Dスキャン、きめ深さ、すべり抵抗、砂置換試験の4つの方法で路面を測ったデータセットを公開し、シミュレーションの路面モデルや人工路面との比較に使えるようにした（抄録）。", "p2": "タイヤと路面の接触の研究では、室内試験台やシミュレーションで人工的に作った路面が使われることが多く、実際の高速道路の路面との比較が難しかった（抄録）。", "p3": "交通量の異なる横断方向の位置（車輪の通る位置とそうでない位置）で測ることで、路面の摩耗の影響も考慮できるようにした（抄録）。4つの測定法の手順を論文で詳しく説明し、他の研究者が使いやすいようにデータを処理して研究データ基盤（RADAR4KIT）に登録した（抄録）。", "p4": "データの質の確認として、きめ深さの測定と砂置換法の結果を比較した（抄録）。測定の範囲、解像度、データ量は抄録になく未確認。", "p5": "抄録は、4地点・4測定法のデータセットの構成と、きめ深さ測定と砂置換法の比較を行ったことを述べるが、比較の結果の数値は抄録になく未確認（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：4地点・コンクリート舗装のみで、アスファルト舗装や橋面舗装、波長の長い凹凸（平坦性）までは含まれるか。データ論文であり、測定の不確かさの評価は本文で確かめる必要がある。", "fun": "タイヤが路面をつかむ力は、路面の細かいざらざらで決まる。研究ではよく作り物の路面を使うが、本物の高速道路はトラックが通る所ほどすり減っている。この研究は、本物の道路を3Dスキャンや昔ながらの砂を広げる方法などで測り、誰でも使えるデータとして公開した。地味だが、多くの研究の「答え合わせ」の材料になる点が面白い。", "unverified": "本文が読めず、各測定法の解像度・範囲、データの形式と量、方法間の比較結果は確認していない。"}}, {"id": "jr03", "rank": 3, "headline": "看護師のAI活用に負担と資源の二面性", "title": "The Double-Edged Sword Effect of AI Application Among Clinical Nurses Based on the Job Demands-Resources Model: Qualitative Study", "url": "https://doi.org/10.2196/100916", "authors": "Xiaoyan Zhang ほか", "venue": "JMIR Nursing", "date": "2026-10-02", "sjr": 1.107, "citescore": 5.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "臨床看護師へのAI導入が、資源を増やす「獲得の経路」と要求を増やす「消耗の経路」の両方をもつ「諸刃の剣」であることを、仕事の要求度-資源（JD-R）モデルにもとづく質的研究で整理し、その緩衝条件を示した（抄録）。", "p2": "AIは事務負担の軽減や意思決定支援を約束するが、現場では技術による力づけが新しい職業上の負担やテクノストレスで相殺されることが多い（抄録）。両方向の影響と、それを和らげる条件は理論的に整理されていなかった（抄録）。", "p3": "中国本土の複数の総合病院で、臨床AIシステムを実際に使う看護師に半構造化の詳細面接を行う記述的質的研究（最大変異・目的的サンプリング）で、JD-Rの構成概念にもとづく演繹的な内容分析を行った（抄録）。背景：JD-Rモデルは、仕事の要求度が消耗を、仕事の資源が意欲を生むとする枠組みである。", "p4": "質的研究のため数量的な比較はなく、テーマの抽出が結果となる（抄録）。面接の人数と病院数は抄録になく未確認。", "p5": "3つの領域、9つの主テーマ、24の下位テーマが得られた（抄録）。獲得の経路では業務効率の飛躍、臨床的な認知の強化、専門職としての資本の価値上昇が、消耗の経路では認知の妨げ、人間関係の摩耗、成果の水増しと完璧主義競争による「デジタルの内巻（過当競争）」が現れた（抄録）。両経路の相互作用は、看護師の積極的な対処、専門職の境界の線引き、組織の一体的な支援で緩衝されると認識されていた（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：1つの国の、AIを積極的に使う看護師に限った質的研究で、テーマの頻度や強さ、他の職種への一般化は未検証。JD-Rの枠組みを前もって当てはめた分析のため、枠組みにないテーマを見落とした可能性もある。", "fun": "AIが記録や判断を手伝ってくれれば看護師は楽になるはず、と思いがちだ。ところが現場の声を聞くと、仕事が速くなる一方で、AIを使いこなす競争や、成果をより多く求められる圧力という新しい疲れも生まれていた。道具が便利になると、かえって求められる水準が上がる、という身近な現象とつながるのが面白い。", "unverified": "本文が読めず、面接の人数・病院数、各テーマの具体的な語り、分析の信頼性の確保の方法は確認していない。"}}, {"id": "jr04", "rank": 4, "headline": "豪雨の斜面崩壊から土石流への遷移を一体解析", "title": "An integrated modeling method for rainfall-induced geohazard chains: coupling landslide mobilization and flow-state transition", "url": "https://doi.org/10.3389/feart.2026.1908253", "authors": "Tao Zhang ほか", "venue": "Frontiers in Earth Science", "date": "2026-10-02", "citescore": 4.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（抄録、§5.2〜5.3の動的ハザードと限界、§6の結論、図11・12のキャプション）を読んだ。手法の数式と水文のベンチマークの詳細は抄録の範囲", "preprint": false, "p1": "豪雨で起きる表層崩壊・土石流・土砂を含む洪水の連鎖を、崩壊で生じた土砂の供給を時刻・形状・体積つきで作り、それを一つの固液混合体として下流へ流すことで、斜面崩壊型・土石流型・洪水型のどの経路をたどるかを一体で判定できるモデルを作った（抄録）。", "p2": "山地の豪雨災害では崩壊・土石流・洪水が連鎖するが、別々の部分モデルを並べるだけでは、崩壊した土砂が下流でどの流れの状態に移るかを一貫して扱えない（抄録）。", "p3": "水文の部分では、浸透の前線と宙水層を動的に扱う定式化で崩壊しやすい地点の圧力水頭の上昇を計算する（抄録）。セルオートマトン（CA：格子ごとに近傍の規則で状態を更新する方法）で、雨に合わせた表層崩壊の発生域を時刻・深さ・形とともに生成する（抄録）。下流では、土砂と水を一つの変化する混合体として浅水流の数値解法で流し、固体の体積割合などの指標で流れの状態を分類する（抄録、§5.3、図11）。", "p4": "2023年の北京の極端豪雨に適用し、水文の部分はバケツ型の貯留モデルとGreen–Ampt浸透モデルと比較した（抄録）。流れの状態を分ける閾値を変えた感度分析と、相対的な動的ハザードの時間変化も示す（図11、図12）。", "p5": "動的な前線-宙水層の定式化は、他の2つより崩壊しやすい地点の局所的な圧力水頭の上昇をよく捉えた（抄録）。放出された土砂は持続的な土石流ではなく、短時間の高濃度の脈動として流れた（抄録）。主降雨期の崩壊土量は約3.29×10⁴ m³で、追加の侵食の寄与は約7%にとどまり、急速に薄まって洪水型の土砂輸送に移った（抄録）。相対ハザードの高い面積は放出直後の約0.358 km²から主輸送期の0.917 km²に増え、後期には縮小した（§5.2）。", "p6": "著者は、輸送の部分は水深平均の有効的な記述で、鉛直方向の相の分離、粒度の分級、間隙水圧の拡散、粒状体の構造の変化を解いていないと認め、結果は地域規模の推定であり土石流内部の局所的なレオロジーの記述ではないとしている（§5.3）。ハザードは曝露と脆弱性を含まない相対的な指標である（§5.2）。", "fun": "大雨で山の斜面が崩れると、その土砂は泥の流れ（土石流）になって谷を下ることもあれば、すぐに水で薄まって濁った洪水になることもある。この研究は、崩れる場所と時刻を計算し、その土砂を水と混ぜたまま流して、どちらの道をたどるかを一続きで調べた。2023年の北京の豪雨では、土砂は短い「波」として流れ、すぐに薄まっていた。", "unverified": "手法の数式（流れの状態の分類指標の定義）、水文ベンチマークの定量結果、表1のパラメータは確認していない。"}}, {"id": "jr05", "rank": 5, "headline": "複数LLMエージェントで銀行報告書から指標抽出", "title": "ESG and Financial Data Extraction and Correlation Analysis Using Multi‐Agent LLMs on Bank Reports", "url": "https://doi.org/10.1002/bse.71620", "authors": "Danqing Lin ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-02", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "銀行の年次報告書から、ESG（環境・社会・ガバナンス）と財務の指標を複数のLLMエージェントで直接抽出して比較可能なデータに整え、指標単位でESGと財務成績の関係を分析できる枠組みを作った（抄録）。", "p2": "ESGと財務成績の関係の研究は商用のESG格付けに頼ることが多いが、格付けは不透明で個々の指標の寄与が見えない（抄録）。また、ESGの開示は銀行・年・様式によって大きく異なり、銀行間の比較が難しい（抄録）。", "p3": "指標の種類ごとに設計したプロンプトで、同義の用語、異なる測定の尺度、ばらばらの報告単位をモデルに認識させ、文章の開示を構造化された比較可能なデータに変える複数エージェントの枠組みを作る（抄録）。", "p4": "世界の約50行の7年分、数百冊の年次報告書に適用して統一データを作り、ESG指標とROA・ROEなどの財務指標の相関を指標ごとに分析する（抄録）。抽出の正確さの検証方法と数値は抄録になく未確認。", "p5": "特定のESG指標と財務成績の間に、ばらつきはあるが系統的な関連が見られ、環境の変数がROA・ROEと比較的強く一貫した相関を示した（抄録）。相関の大きさの数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：結果は相関であり因果ではないこと、LLMの抽出誤りが相関の推定にどう影響するか、他業種への拡張で同じ精度が出るかは本文で確かめる必要がある。", "fun": "銀行の分厚い年次報告書は、会社ごとに言葉づかいも単位もばらばらで、比べるのが大変だ。この研究は、役割を分けた複数のAIに読ませて、数字を同じ物差しにそろえさせた。すると、環境への取り組みの指標が利益率と比較的はっきり関係していた。人が何年もかかる「読み比べ」をAIで透明にやる試みとして面白い。", "unverified": "本文が読めず、抽出精度の検証、使ったLLM、相関の大きさと統計的有意性は確認していない。"}}, {"id": "jr06", "rank": 6, "headline": "集団への帰属を強める象徴的販促の効果", "title": "Symbolic promotions: Conceptualization and empirical investigation", "url": "https://doi.org/10.1007/s11747-026-01202-z", "authors": "Chloé Vanasse ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-10-02", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（概念的背景、研究1の結果、研究2の設計と媒介分析、限界と研究課題）を読んだ。Web付録は未読", "preprint": false, "p1": "経済的な見返りでも遠くの他者への支援でもなく、集団への帰属という社会的アイデンティティを強めて価値を生む「象徴的販促（symbolic promotion）」を販促の独立した型として概念化し、9年間の書籍販売データと実験で、売上を大きく伸ばすことと、その心理的な仕組みを示した（抄録）。", "p2": "象徴的販促は世界的に広がっているが、それがいつどのように消費者行動に影響するかはほとんど分かっていない（抄録）。従来の販促研究は値引きなどの見返り型と、売上の一部を寄付する社会貢献型（CMP）が中心だった（概念的背景）。", "p3": "研究1は、カナダ・ケベック州の「8月12日にケベックの本を買おう」という実在の象徴的販促について、22,084冊の9年間の日次販売を負の二項の一般化線形混合モデルで分析し、販促日の効果と著者のブランド力による違いを推定する（抄録、研究1）。研究2は、米国の451人の事前登録実験で、象徴的販促（地元の食べ物の日）・CMP・10%引きのセールを比べ、好奇心・場所への根づき・利他性などの並列の媒介経路を調べる（研究2）。", "p4": "研究1は販促日とそれ以外の日（±28日）の販売数の差、研究2は参加の意向、SNSでの共有、今後のブランドの検討の3つの行動意図と、ブートストラップによる間接効果で評価する（研究1、研究2）。", "p5": "販促日の販売数は他の日より約779%多く（b=2.174）、日々の傾向を考慮しても約732%多かった（表4）。ブランド力との交互作用は負で（b=−0.090）、無名の著者（平均−1SD）では約912%、有名な著者（+1SD）では約659%の増加と、無名の著者ほど効果が大きかった（研究1）。実験では、CMPと比べた象徴的販促の参加意向への効果は好奇心（間接効果0.235）と場所への根づき（0.073）を通じて現れた（研究2、図3a）。", "p6": "著者は、研究1では店頭の陳列など観測できないマーケティング変数があり内生性を完全には除けないこと、店舗別や他の文化商品への波及、長期的な効果は未検討であることを限界とし、研究課題として整理している（限界と研究課題）。残る疑問：一つの地域・一つの商品分類での実証で、他の文化圏への一般化は今後の課題である。", "fun": "値引きもポイントもないのに、「8月12日はケベックの本を買おう」という呼びかけだけで、その日の本の売上が普段の約9倍になった。人は得をするからだけでなく、「自分たちの仲間だから」という気持ちで買うこともあるのだ。しかも有名な作家より無名の作家のほうが恩恵が大きかった。お金ではなく「つながり」で人を動かす販促の力が見えるのが面白い。", "unverified": "Web付録の結果（SNS共有と今後の検討の媒介分析、頑健性の検証の詳細）は確認していない。"}}, {"id": "jr07", "rank": 7, "headline": "英国の大規模調査で孤独と社会関係資本の要因", "title": "Factors associated with loneliness and social capital in a large volunteer sample of adults in England", "url": "https://doi.org/10.1186/s44263-026-00335-1", "authors": "Austen El-Osta ほか", "venue": "BMC Global and Public Health", "date": "2026-10-02", "sjr": 1.25, "citescore": 2.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（抄録、方法の研究デザイン・参加者・測定、結果の分布と収束する要因）を読んだ。考察の後半と補足資料は未読", "preprint": false, "p1": "英国（イングランド）の135,725人の大規模な志願者標本で、2つの孤独の尺度と社会関係資本の規定要因を同時に調べ、若年・独身・失業・障害が一貫して孤独と関連する一方、学歴などは尺度によって関係が逆になることを示した（抄録）。", "p2": "孤独は心身と社会のwell-beingに広く影響する公衆衛生の課題だが、どの尺度で測るかによって関連要因が変わりうること、孤独と社会関係資本を同じ標本で比べることは十分に検討されていなかった（背景）。", "p3": "2023年3〜7月にNHSのプライマリケア網などを通じて集めた16歳以上の135,725人の横断データを使う（方法）。孤独はUCLA 3項目尺度と英国統計局（ONS）の直接尺度（DMOL）で、社会関係資本は近隣の信頼・結束・互酬性の合成尺度で測り、多変量の順序ロジスティック回帰と二値ロジスティック回帰で互いに調整した関連を推定する（抄録）。", "p4": "推定は母集団のパラメータではなく、回答者の標本に条件づけた探索的な記述として位置づけ、調整オッズ比（aOR）とモデルにもとづく区間（MBI）で示す（抄録）。", "p5": "UCLA-3で重度の孤独は30.5%、DMOLで「よく・いつも」孤独は16.5%で、重度の孤独は16〜25歳の54.9%から65歳超の16.4%へと年齢とともに減った（結果）。友人が9人以上いる人は孤独のオッズが大きく低かった（UCLA：aOR=0.09、DMOL：aOR=0.16）（抄録）。大学教育はUCLAでは高い孤独、DMOLでは低い孤独と関連した（抄録）。長期疾患（aOR=0.82）と障害（aOR=0.77）は高い社会関係資本のオッズを下げた（抄録）。", "p6": "著者は、非確率の志願者標本のため、推定を母集団のパラメータ、因果効果、確証的な証拠として解釈すべきでなく、仮説を生む結果であり、代表性のある縦断研究や介入研究での確認が必要だと明記している（抄録）。", "fun": "「孤独ですか」と直接聞くか、「取り残されたと感じることは？」のように遠回しに聞くかで、大卒の人が孤独に見えたり見えなかったりした。135,725人という大量のデータでも、測り方ひとつで結論が変わりうるのだ。若い人ほど孤独を強く感じ、友達が多い人ほど孤独が少ないという結果とあわせて、「何をどう測るか」の大切さを教えてくれる。", "unverified": "考察の後半と補足資料（各要因の全オッズ比の表）は確認していない。"}}, {"id": "jr08", "rank": 8, "headline": "洋上風車基礎の損傷をOMAと機械学習で同定", "title": "On the use of machine learning in damage identification of offshore jacket wind turbine: a virtual case study", "url": "https://doi.org/10.1038/s41598-026-72066-0", "authors": "Haoyan Wu ほか", "venue": "Scientific Reports", "date": "2026-10-01", "citescore": 6.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ジャケット式の洋上風車の支持構造について、有限要素で模擬した加速度から運用モード解析（強化周波数領域分解EFDD）で振動数と減衰比を取り出し、それを機械学習の入力として損傷を診断する枠組み（FE–OMA–ML）を作り、数値実験で性能を評価した（抄録）。", "p2": "背景：洋上の支持構造は点検が難しく、振動計測から損傷を見つける方法が求められるが、実構造の損傷データはほとんど得られない。抄録は、供用中の劣化が徐々に進むことを反映したデータで評価する必要を述べる（抄録）。", "p3": "有限要素で模擬した加速度応答をEFDDで処理してモードの振動数と減衰比を同定し、機械学習の特徴量にする（抄録）。剛性を段階的に下げた13の構造状態と複数のセンサー配置からなるデータセットを作る（抄録）。抽出したモード特徴の信頼性は、FEとEFDDの振動数・モード形の一致で確かめる（抄録）。", "p4": "部材単位の正確な分類、損傷の有無の判定、層単位の位置の特定、アンサンブル投票による順位づけ、応答ノイズへの頑健性、センサー配置の最適化で評価する（抄録）。使った機械学習の手法と精度の数値は抄録になく未確認。", "p5": "劣化水準、センサー配置、ノイズのある条件をまたいで、階層的・順位的な診断情報は有用に保たれた（抄録）。一方、データの複雑さと測定ノイズが増えると、部材単位の正確な位置の特定は敏感になった（抄録）。診断性能を保つ効率的なセンサー配置も特定できた（抄録）。", "p6": "著者は、部材単位の位置の特定がノイズと複雑さに弱いことを認めている（抄録）。残る疑問：検証は数値シミュレーションのみで、温度や海況による振動数の変動、モデル化誤差のある実構造で同じ性能が出るかは未確認。", "fun": "海の上の風車の脚は、人が近づいて点検するのが大変だ。そこで、揺れの「音色」（固有振動数）が傷によって少し変わることを利用し、コンピュータの中でわざと傷をつけた風車の揺れをたくさん作ってAIに学ばせた。どの層に傷があるかはかなり当てられるが、どの部材かまで当てるのは雑音に弱い、という正直な結果も面白い。", "unverified": "本文が読めず、機械学習の手法、各評価の精度、最適なセンサー配置の内容は確認していない。"}}, {"id": "jr09", "rank": 9, "headline": "組織的制約の増加が公務員の向社会的実感を損なう", "title": "Hindered From Making a Difference: How Increasing Organizational Constraints Undermine Public Servants' Perceptions of Prosocial Impact and Why It Matters", "url": "https://doi.org/10.1111/puar.70222", "authors": "Caroline Manville ほか", "venue": "Public Administration Review", "date": "2026-10-02", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "公務員の職場で組織的な制約（仕事を妨げる手続き・資源不足など）が増えると、「自分の仕事が人の役に立っている」という向社会的インパクトの知覚が下がり、それが後のwell-beingの低下と仕事からの撤退行動につながることを、米仏の2つの縦断研究で示した（抄録）。", "p2": "公務員は仕事の経験と遂行を妨げる組織的制約の下で働くことが多いが、制約の「変化」が心理にどう効くかは静的な分析では捉えにくかった（抄録）。", "p3": "資源保存理論（人は資源を守り、失うとストレスを感じるという理論）にもとづき、制約の増加→向社会的インパクトの知覚の低下→well-being低下・撤退の増加という経路を、時間を追ったデータで検証する（抄録）。", "p4": "米国とフランスで行った2つの縦断研究のデータを使う（抄録）。標本の規模、測定時点の数、使った統計モデルは抄録になく未確認。", "p5": "組織的制約の増加は向社会的インパクトの知覚の低下と関連し、その低下は時間を通じて低いwell-beingと多い撤退行動を予測した（抄録）。向社会的インパクトの知覚が、変化する労働条件と従業員の機能を結ぶ重要な心理的資源だと位置づけている（抄録）。効果の大きさは抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：自己報告による測定が中心とみられ、共通方法の偏りや、撤退行動を客観的な指標で測ったかは本文で確かめる必要がある。因果の向きの検討（逆向きの経路）も気になる。", "fun": "人の役に立ちたくて公務員になったのに、書類や規則に阻まれて思うように動けないと、「自分の仕事は誰かの役に立っている」という実感がしぼんでいく。この研究は、米国とフランスで同じ人を時間をおいて調べ、その実感の低下が、元気のなさや仕事から距離を置く行動につながることを示した。やりがいが心のエネルギー源だということが見える。", "unverified": "本文が読めず、標本の規模、測定の尺度、効果の大きさは確認していない。"}}, {"id": "jr10", "rank": 10, "headline": "2体のLLMエージェントが構成則モデルを設計", "title": "LLM-driven design of physics-constrained constitutive models: Two agents are better than one", "url": "https://doi.org/10.1007/s44379-026-00099-3", "authors": "M. Tacke ほか", "venue": "Machine learning for computational science and engineering", "date": "2026-10-01", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（抄録、図1〜7のキャプション、§5の考察と結論の主要部）を読んだ。§2〜4の手法と結果の詳細な表は一部のみ", "preprint": false, "p1": "材料の変形の法則（構成則）を作るLLMを、モデルを提案する「Creator」と、9つの物理的制約に照らして監査し違反があれば差し戻す「Inspector」の2体に分けることで、物理法則を守るモデルの割合を高められることを示した（抄録）。", "p2": "構成則の開発には連続体力学・機械学習・プログラミングの専門知識が必要で、LLMがその障壁を下げつつあるが、既存の単一エージェントの方法には、生成したモデルが基本的な物理法則を守っているかを系統的に確かめる仕組みがなかった（抄録）。", "p3": "Creatorがデータに合わせた構成則（構成則人工ニューラルネットCANN）をPythonで実装し、実行・学習・予測の構文的な検査を通ったものをInspectorが9つの物理的制約に照らして監査し、違反があれば修正を求める（図3）。制約を満たすかは、多数の変形状態・回転・摂動方向で各制約を数値的に調べて判定する（抄録）。", "p4": "脳組織とゴム（等方性）、ブタの皮膚（繊維方向をもつ横等方性）のデータで、Creatorのみ、Inspectorあり、道具を使えるInspectorありの3構成を、2つのLLM（Claude Opus 4.7、Kimi K2.5）で比べる（抄録、図4）。評価は、出力モデルのうち数値検証で全制約を満たす割合、精度、外挿、未知の荷重経路への汎化である（抄録）。", "p5": "Inspectorを加えると、全制約を満たすモデルの割合はOpusで90%から95%、Kimiで47%から60%に上がった（抄録、§5）。挙動の大きく異なる2つのLLMで同じ効果が出たため、改善は特定のモデルではなく分担の枠組みによると著者は解釈する（§5）。生成されたモデルは専門家の設計したモデルと同等以上の精度で、学習範囲を超えた外挿や未知の荷重経路にもよく汎化した（抄録）。", "p6": "著者は、最良の構成でも完全な順守には達しないこと、Inspectorが監査する制約や数値検証の手順はあらかじめ書き込まれていることを認めている（§5）。残る疑問：検証した材料は3種で、履歴依存（塑性・粘性）の材料への拡張は今後の課題とみられる。", "fun": "AIに「このゴムの伸び方を表す式を作って」と頼むと、データにはよく合うのに、物理的にありえない式を出してくることがある。そこで、式を作るAIと、物理のルール違反をチェックするAIの2人組にしたら、ルールを守る式の割合が上がった。作る人と検査する人を分けるという、人間の職場の知恵がAIにも効くのが面白い。", "unverified": "9つの物理的制約の一覧、精度の比較の具体的な数値（図8〜11）、計算コストは確認していない。"}}, {"id": "jr11", "rank": 11, "headline": "都市洪水時の救急遅延リスク推定の偏りを実証", "title": "Exposing biased risk estimation of emergency service disruptions during urban floods", "url": "https://doi.org/10.1038/s42949-026-00473-3", "authors": "Xiyu Pan ほか", "venue": "npj Urban Sustainability", "date": "2026-10-02", "sjr": 2.762, "citescore": 11.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "2016年のハリケーン・マシューによるバージニアビーチの洪水で、モデルで推定した救急車の応答時間と実際の応答時間を比べ、既存のモデルが低所得地域の遅れを大きく過小評価し、実際のリスクの不平等の35.8%しか捉えていないことを示した（抄録）。", "p2": "公平な防災には、社会的に脆弱な地域が洪水時に不釣り合いな移動の遅れに直面するかを知る必要があるが、先行研究は推定の偏り（脆弱な人々のリスクの過小評価）を見落としてきた（抄録）。", "p3": "洪水時の救急車の応答時間を、既存の方法で推定したモデル値と実際の記録で比較し、所得層別の過小評価の大きさと、その差に関連する要因を調べる（抄録）。", "p4": "評価は、所得層ごとの推定値と実測値の差（分）と、実際のリスクの不平等のうちモデルが捉えた割合で行う（抄録）。", "p5": "低所得地域では移動時間が平均5.7分過小評価され、高所得地域の1.9分より大きく、モデルは実際のリスクの不平等の35.8%しか捉えていなかった（抄録）。この偏りは、低所得地域でのより大きな交通渋滞と、救急ステーションの閉鎖や能力不足の多さと関連しており、どちらも既存の方法では考慮されていない（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：1つの都市・1つの洪水の事例で、他の災害や都市への一般化は未確認。渋滞と閉鎖の影響を組み込んだ改良モデルが偏りをどこまで減らすかは本文で確かめる必要がある。", "fun": "洪水で道が水につかると救急車が遅れる。シミュレーションで「どの地域がどれだけ遅れるか」を予測できるが、実際の記録と比べると、貧しい地域ほど予測より大幅に遅れていた。渋滞や救急ステーションの機能停止が考えに入っていなかったからだ。予測が当たらないこと自体が、不公平を見えなくしてしまう、という指摘が面白い。", "unverified": "本文が読めず、推定に使ったモデル、データの件数、要因分析の方法は確認していない。"}}, {"id": "jr12", "rank": 12, "headline": "家族構成と高齢者の閉じこもりの出入り", "title": "Family structure and transitions into and out of homeboundness: Evidence from the National Health and Aging Trends Study, 2011–2024", "url": "https://doi.org/10.1093/geronb/gbag206", "authors": "Yan Zhang", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-10-01", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "米国の高齢者の縦断調査（2011〜2024年）で、閉じこもり（自力での外出が困難な状態）への移行と回復を推計し、配偶者の有無や子の有無といった家族構造がその移行と施設入所・死亡に関わること、男女で違いがあることを示した（抄録）。", "p2": "閉じこもりは、外出に介助や補助具が必要、普段は外出できない、外出が大きな負担、のいずれかの状態を指す（抄録）。閉じこもりへの出入りの動きと、家族構造との関連は十分に調べられていなかった（抄録）。", "p3": "自立・閉じこもり・施設入所・死亡の4状態の推移確率を、連続時間の斉次マルコフモデル（調整なし）で推定する（抄録）。次に多項ロジスティック回帰で家族構造とその後の移行の関連を、性別との交互作用も含めて調べる（抄録）。", "p4": "米国のNational Health and Aging Trends Studyの2011〜2024年のデータを使い、推移確率と相対リスク比（RRR）で評価する（抄録）。", "p5": "自立していた人の84.6%は次の調査でも自立、12.2%が閉じこもりになった（抄録）。閉じこもりの人の23.6%は自立に戻り、60.1%はそのまま、2.4%が施設入所、13.9%が死亡した（抄録）。配偶者のいない人は自立から施設入所（RRR=1.752）と死亡（1.265）のリスクが高く、子のいる人は子のいない人より自立から施設入所（0.523）と死亡（0.735）、閉じこもりから施設入所（0.574）のリスクが低かった（抄録）。配偶者がいないことと閉じこもりになることの関連は、男性で女性より強かった（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：推移確率は調整なしのモデルで、健康状態や所得による交絡の扱いは本文で確かめる必要がある。家族構造は居住の近さや支援の実際の量を表すとは限らない。", "fun": "年をとって外に出にくくなる「閉じこもり」は、一度なると戻れないものと思われがちだ。ところが米国の調査では、閉じこもりの人の約4人に1人が次の調査までに再び出歩けるようになっていた。さらに、配偶者や子どもがいるかで、施設に入る確率や亡くなる確率が変わった。家族のかたちが老後の暮らしの道筋を左右することが数字で見える。", "unverified": "本文が読めず、調整した共変量の一覧、男女差の大きさの数値、調査の間隔は確認していない。"}}, {"id": "jr13", "rank": 13, "headline": "外来のデジタル医療のサービス品質尺度を検証", "title": "Validating DigiHEALTHQUAL for measuring digital health effects on service quality in outpatient care in Germany", "url": "https://doi.org/10.1038/s41746-026-03302-0", "authors": "Dominik Rigo ほか", "venue": "npj Digital Medicine", "date": "2026-10-02", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（抄録、結果の標本特性・モデル比較、考察の限界）を読んだ。方法の詳細と補足資料は見出しのみ", "preprint": false, "p1": "外来診療のデジタルヘルス（オンライン予約、デジタル問診、ビデオ診療、電子カルテ）が患者の感じる医療サービス品質に与える非臨床的な効果を測る尺度DigiHEALTHQUALを、ドイツの患者1,085人の調査で量的に妥当化した（抄録）。", "p2": "外来でのデジタルヘルスの導入は、非臨床的な効果が不確かなことと、標準的に評価する妥当な尺度がないことで妨げられている（抄録）。医療サービス品質（HCSQ）は理論的な枠組みを与えるが、それにもとづく妥当化された尺度はなかった（抄録）。", "p3": "4種類のデジタルヘルスのいずれかを使った成人患者へのオンライン横断調査で、内的一貫性、確認的因子分析（CFA）、探索的因子分析（EFA）を行い、理論から作った構造とデータから導いた構造を比べる（抄録）。", "p4": "3,725件の回答から清掃と品質管理を経て1,085件を分析した（結果）。適合度指標（CFI、TLI、RMSEA、AIC）で、理論由来の7因子モデル、データ由来の4因子モデル（一次・高次）、一次元モデルを比べる（結果、表3）。", "p5": "全般的満足を除いて精緻化した理論由来の7因子モデルは良好な適合と強い内的一貫性を示したが、次元間の弁別妥当性は限られた（抄録）。EFAでは、手続きに関わる因子が支配的な、より簡潔な4因子構造が得られた（抄録）。一次元モデルはCFIとTLIが0.90を下回り、RMSEAが約2倍になって適合が大きく悪かった（結果）。データ由来のモデルでは安全性と有形要素が独立した因子として現れなかったが、著者は内容的妥当性を重視して7因子モデルを採用した（結果）。", "p6": "著者は、自発参加のオンライン調査と便宜的標本でデジタルに親しんだ人に偏り（男性61%など）、ドイツのみでの実施、各回答者が1種類のデジタルヘルスしか評価していないこと、リストワイズ削除を限界として挙げる（考察）。", "fun": "ビデオ診療やオンライン予約が、患者にとって「医療サービスとして良くなったか」をどう測るか。この研究は、質問票の項目がちゃんと狙った中身を測れているかを、1,085人の回答で統計的に確かめた。データだけに任せると4つのまとまりにしか分かれず、「安全性」などが消えてしまうが、著者は理論上大事な次元を残す選択をした。測る道具を作る難しさが見えて面白い。", "unverified": "表3の適合度の具体的な値、各因子の信頼性係数、項目の内容は確認していない。"}}, {"id": "jr14", "rank": 14, "headline": "モード歪みエネルギーとGPRで板の損傷を検出", "title": "Damage Detection in FGM Plates Using Modal Strain Energy and Gaussian Process Regression", "url": "https://doi.org/10.3390/buildings16193933", "authors": "Bochra Khatir ほか", "venue": "Buildings", "date": "2026-10-02", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "傾斜機能材料（FGM：組成を連続的に変えた複合材料）の板について、モード歪みエネルギーにもとづく損傷指標で損傷位置を特定し、その指標をガウス過程回帰（GPR）に入れて損傷の程度を定量化する2段階のSHM手法を、数値実験で示した（抄録）。", "p2": "FGMなどの複合材料の利用が広がり、運用の安全と長期的な健全性のために信頼できるSHMと損傷検出が求められている（抄録）。背景：材料特性が場所で変わる板では、均質な板の損傷指標がそのまま使えるとは限らない。", "p3": "アイソジオメトリック解析（IGA：CADの曲線表現をそのまま使う高精度の有限要素解析）で動的応答を計算し、損傷によるモード歪みエネルギーの分布の変化から損傷指標を作って位置を特定する（抄録）。第2段階で、その指標を入力、損傷の程度を出力としてGPRで学習する（抄録）。", "p4": "一連の数値的な損傷シナリオで、位置の特定と程度の定量化の精度を評価する（抄録）。比較した既存手法と評価指標の数値は抄録になく未確認。", "p5": "調べた損傷シナリオとシミュレーション条件の下で、提案手法は高い予測精度と有効性を示したと述べる（抄録）。具体的な精度の値は抄録になく未確認。", "p6": "著者は、結果が調べた損傷シナリオとシミュレーション条件に限られることを明記している（抄録）。残る疑問：実験データや測定ノイズ、高次モードの計測の難しさを考えたときの性能は未検証。", "fun": "板の一部が傷むと、揺れたときに板がためこむ「ゆがみのエネルギー」の分布がその場所だけ変わる。この研究は、その変化から傷の場所を探し、さらにAIの一種（ガウス過程回帰）で傷の深さまで見積もった。ガウス過程回帰は、予測と一緒に「どのくらい自信があるか」も出せるのが特長だ。場所と程度を2段階で分けて解く発想が分かりやすい。", "unverified": "本文が読めず、損傷シナリオの数、ノイズの有無、精度の数値、比較対象は確認していない。"}}, {"id": "jr15", "rank": 15, "headline": "結果確定の遅い融資での中小企業信用リスク評価", "title": "Maturity-aware credit governance in digital agricultural finance: leakage-free selective fusion for agri-food SME risk assessment", "url": "https://doi.org/10.3389/fsufs.2026.1946390", "authors": "Ying Wei ほか", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-10-02", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（抄録、§6の結論）を読んだ。§3〜5の手法と結果の詳細な表は抄録の範囲", "preprint": false, "p1": "融資の結果（5年以内の貸倒れ）が出るまで時間がかかり、文脈データの得られる時期もずれる農業・食品分野の中小企業融資で、判断時点で観測できる情報だけを使い、どのデータ源を組み合わせるかを将来の検証コホートで選ぶ信用リスク評価の手順（DAF-XCredit）を作った（抄録）。", "p2": "デジタル農業金融の貸し手は、融資の結果がゆっくり確定し、農業の文脈データが異なる時期に入手できる状況でも信頼できるリスク推定を必要とする（抄録）。背景：判断時点で知りえない情報を混ぜると、見かけの精度が上がる「情報の漏洩」が起きやすい。", "p3": "承認時の融資記録、結果が観測できる過去の事前情報、遅らせた農業の文脈データを組み合わせる（抄録）。時系列順の交差検証で各データ源のスコアを作って較正し、2014〜2015年の検証コホートで最終モデルに使うデータ源を選ぶ（抄録）。", "p4": "米国中小企業庁（SBA）7(a)の農業・食品融資67,114件（2000〜2019年承認）と米国農務省のデータを結合し、手をつけていない2016〜2019年の12,339件で評価する（抄録）。AUC、再現率、F1、ブライアスコア、較正誤差で他のモデルと比べ、DeLong検定、州×年のクラスタ再標本化、意思決定曲線も示す（抄録）。", "p5": "選ばれた融資＋農業データのモデルは、5つの乱数種でAUC 0.9497、再現率0.6425、F1 0.4357、ブライアスコア0.02356、較正誤差0.00272で、評価したモデルの中でAUC・再現率・F1が最高、ブライアと較正誤差が最低だった（抄録）。ただしPR-AUCとKSは他のモデルが首位で、融資データのみのモデルとのAUCの差は有意でなかった（p=0.254）（抄録）。較正の傾きは0.990だった（抄録）。", "p6": "著者は、主な貢献は精度の向上ではなく、成熟を考えたデータ源の選択・較正・部分集団の監査を再現可能にする手順であり、この方法自体が持続可能性の成果を保証するものではないと述べる（抄録、§6）。残る疑問：公的な保証つき融資のデータで、民間の貸し手やデジタル融資への一般化は未検証。", "fun": "お金を貸してから返せなくなるかが分かるまで5年かかる場合、AIの「当たり外れ」をどう確かめればよいか。この研究は、貸す時点で本当に分かっていた情報だけを使い、過去から未来へ順に検証するという、ずるのない評価の手順を作った。農業の情報を足しても精度の向上は統計的にはっきりしなかったが、それを正直に報告している点も含めて、評価の作法が面白い。", "unverified": "§3〜5のSHAP分析と部分集団の監査の結果、比較モデルM1〜M5の内容は確認していない。"}}, {"id": "jr16", "rank": 16, "headline": "航空の顧客満足を非対称モデルと機械学習で説明", "title": "Beyond symmetric models: explaining satisfaction through AIPA and machine learning approaches in the airline industry", "url": "https://doi.org/10.1016/j.rtbm.2026.101898", "authors": "Mahmut Bakır ほか", "venue": "Research in Transportation Business and Management", "date": "2026-10-01", "sjr": 1.014, "citescore": 8.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、航空業界の顧客満足を、対称的なモデルを超えて、非対称の重要度-実績分析（AIPA）と機械学習で説明しようとする研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「満足を上げる要因と、不満を生む要因は同じか」だ。食事がおいしいと少しうれしいだけなのに、遅れると大いに不満になるように、要因によって満足と不満への効き方が違うかもしれない。その非対称を、AIの手法も使って捉えようとしている点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "教育リスク場面でLLM審査員の評定一致を検証", "title": "Assessing inter-rater agreement among large language model judges: Evidence from persona evaluation across varying educational risk contexts", "url": "https://doi.org/10.1016/j.techfore.2026.124894", "authors": "Danial Amin ほか", "venue": "Technological Forecasting and Social Change", "date": "2026-10-02", "sjr": 3.479, "citescore": 30.5, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、教育上のリスクの程度が異なる場面でのペルソナ評価を例に、複数のLLMを審査員にしたときの評定者間の一致を検証した研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「AIを採点者にするとき、AI同士の採点は一致するのか」だ。人の採点者でも評価が割れるのに、AIの審査員を何体か並べたら、場面によって意見がそろったり割れたりするかもしれない。採点するAIそのものを採点する、という入れ子の問いが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "主ケーブルの縦横連成を考えた吊橋の連続体理論", "title": "Continuum theory for dynamic analysis of suspension bridge considering longitudinal‑vertical coupling effects of main cable", "url": "https://doi.org/10.1016/j.istruc.2026.113166", "authors": "Yu-peng Chen ほか", "venue": "Structures", "date": "2026-10-01", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、主ケーブルの縦方向と鉛直方向の連成効果を考慮した、吊橋の動的解析のための連続体理論を提示した研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「吊橋の揺れを、橋全体をひとつながりの物体として式で表せるか」だ。吊橋は、ケーブルが縦に伸び縮みすると桁が上下に揺れる、という具合に動きが結びついている。その結びつきを省かずに式に入れようとしている点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "観測器ベースの線形システム同定の誤差上界", "title": "Error bounds in observer-based LTI system identification", "url": "https://doi.org/10.1016/j.sysconle.2026.106606", "authors": "Fethi Bencherki ほか", "venue": "Systems and Control Letters", "date": "2026-10-02", "sjr": 1.299, "citescore": 4.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、観測器（オブザーバ）にもとづく線形時不変システムの同定について、誤差の上界を導いた研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「測定データから機械の動き方の式を推定するとき、その誤差はどこまで大きくなりうるか」だ。推定した式がどのくらい信用できるかを、最悪の場合の誤差の大きさとして保証しようとする点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "構造解析と整合する地盤-構造相互作用の考え方", "title": "Concept for Consistent Soil–Structure Interaction Regarding Structural Analysis", "url": "https://doi.org/10.3390/buildings16193930", "authors": "Christian Wallner ほか", "venue": "Buildings", "date": "2026-10-02", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "浅い基礎の沈下で地盤と構造物の剛性と荷重が連成する地盤-構造相互作用（SSI）を、地盤の沈下解析と構造の評価をつなぐ体系的な近似の手順で扱う考え方を提案した（抄録）。", "p3": "骨組型と壁型の建物のパラメトリック研究と詳細な事例研究で、構造剛性の表し方（段階施工、クリープやひび割れの時間依存）、荷重の与え方（一体のモデル化から簡略化まで）、施工過程との相互作用の影響を調べた（抄録）。", "p5": "これらの要因が結果に与える影響を示したと述べるが、具体的な数値は抄録になく未確認（抄録）。", "fun": "建物が重いと地面が沈み、沈み方が場所によって違うと建物に余計な力がかかる。でも設計では、地面の計算と建物の計算を別々の人が別々にすることが多い。この研究は、その2つをつなぐ手順を整理し、工事の順番やコンクリートのひび割れまで考えると結果が変わることを示した。分業の境目に問題が潜むという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "社会的インフラが小さな住まいを可能にする条件", "title": "Between public space and private living: social infrastructure as a demand-side strategy for compact living", "url": "https://doi.org/10.1088/1748-9326/aeaf69", "authors": "Tamar Meshulam ほか", "venue": "Environmental Research Letters", "date": "2026-10-02", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "カナダのバンクーバー・トロント・モントリオールの近隣単位の分析で、カフェ・公園・図書館・コミュニティセンターなどの社会的インフラへのアクセスが多い地区ほど住戸が小さいことを示した（抄録）。", "p3": "Google Placesのデータを国勢調査の指標と結びつけ、空間誤差モデルで社会的インフラと住戸の大きさの関連を推定した（抄録）。", "p5": "3都市すべてで、社会的インフラへのアクセスが多いほど住戸の大きさが小さいことと関連したと述べる（抄録）。係数の大きさは入手した抄録が途中で切れており未確認。", "fun": "家が狭くても、近くに居心地のいいカフェや図書館や公園があれば、そこが「第二の居間」になる。この研究は、そうした場所が多い地区ほど実際に住まいが小さいことを、カナダの3都市で示した。住まいを小さくすることは省エネにつながるので、町の共有の場が環境対策にもなる、という発想が面白い。", "unverified": "抄録が途中で切れており、関連の大きさと因果の扱いは確認できなかった。"}}, {"id": "jr22", "rank": 22, "headline": "マルチエージェントAIで世論形成を模擬した実践", "title": "Modeling public opinion formation processes using multi-agent AI systems: practical experience", "url": "https://doi.org/10.26907/2079-5912.2026.3.43-53", "authors": "M. L. Gorshenin", "venue": "The Kazan Socially-Humanitarian Bulletin", "date": "2026-10-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "YandexGPTで動くマルチエージェント群のシステム（MiroFish）が、世論の議論の形成過程をどこまで模擬できるかを、4つの場面の模擬実験で検討した（抄録）。", "p3": "AIの利用の年齢制限、工場の閉鎖、迷惑配信者への反応、自然発生的なネット上の議論という4場面で、100〜2,000体（合計2,400体）の合成エージェントによる公的な議論を模擬した（抄録）。", "p5": "システムは公的な議論の構築過程を模擬できたが、その能力は技術的な特性に制約され部分的にとどまった（抄録）。制約の詳細は入手した抄録が途中で切れており未確認。", "fun": "AIのキャラクターを何千体も作ってネット上の議論をさせれば、世論がどう動くかを試せるかもしれない。この研究は、工場の閉鎖などの話題で実際にやってみて、それらしい議論は生まれるが、まだ部分的にしか再現できないと報告した。社会の「実験室」をAIで作る試みの現在地が見える点が面白い。", "unverified": "抄録が途中で切れており、システムの制約の具体的な内容は確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "ベトナム上場製造業の財務困窮を機械学習で早期予測", "title": "EARLY PREDICTION OF FINANCIAL DISTRESS RISK IN VIETNAMESE LISTED INDUSTRIAL FIRMS USING MACHINE LEARNING", "url": "https://doi.org/10.62985/j.huit_ojs.vol26.no3e.641", "authors": "Nguyen Thi Hai Hang", "venue": "Tạp chí Khoa học Đại học Công Thương", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ベトナムの上場製造業91社（2015〜2024年）で、翌年の財務困窮をロジスティック回帰と3つの機械学習（ランダムフォレスト、XGBoost、KNN）で予測し、機械学習のほうが良いことを示した（抄録）。", "p3": "従来の財務比率、企業規模、前年のGDP成長率を説明変数として、翌年の財務困窮の状態を予測し、テスト期間で比べた（抄録）。", "p5": "AUCはランダムフォレスト0.8741、XGBoost 0.8578、KNN 0.8030で、ロジスティック回帰は0.7232と最も低かった（抄録）。確率の閾値0.2ではXGBoostが困窮の検出で最も強かったと述べる（抄録）。", "fun": "会社が資金繰りに困る前に、決算の数字から兆しを見つけられないか。ベトナムの会社で試すと、昔ながらの統計の方法より、たくさんの決定木を組み合わせるAIのほうがよく当たった。ただ91社という小さな標本なので、どこまで一般的かは慎重に見る必要がある、という点も考えさせる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "認知症の興奮・攻撃症状と家族介護の社会的費用", "title": "Longitudinal Impact of Agitation and Aggression Symptoms on Societal Costs in Alzheimer's Disease: A Focus on Informal Care and Socioeconomic Disparities", "url": "https://doi.org/10.1002/gps.70257", "authors": "Nadège Costa ほか", "venue": "International Journal of Geriatric Psychiatry", "date": "2026-10-01", "citescore": 5.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "フランス南西部の中等度〜重度のアルツハイマー病で興奮・攻撃の症状がある262人を12か月追跡し、症状の推移が家族などのインフォーマルな介護費用を含む社会的費用に与える影響を、患者と介護者の社会経済的特性を考慮して推計した（抄録）。", "p3": "多施設の前向き観察コホートで、臨床医がNPI-cで症状を記録し、縦断的な軌跡のクラスタリングで症状の推移の型を分け、社会的な視点で費用を推計した（抄録）。", "p5": "結果の数値は入手した抄録が途中で切れており未確認（抄録）。", "fun": "認知症の人が怒りっぽくなったり暴れたりすると、家族の介護の負担は一気に増える。でもその負担は、病院の請求書には出てこない「見えない費用」だ。この研究は、症状の変化と一緒に、家族が介護に使う時間まで費用として数えようとした。見えない負担を数字にする試みとして面白い。", "unverified": "抄録が途中で切れており、症状の型ごとの費用の結果は確認できなかった。"}}, {"id": "jr25", "rank": 25, "headline": "AI化した職場システムと燃え尽きの系統的レビュー", "title": "Artificial intelligence-driven work systems and employee burnout: a systematic review of mechanisms, moderators, and a dynamic meta-system framework", "url": "https://doi.org/10.3389/fpsyg.2026.1922281", "authors": "Zicheng Fang ほか", "venue": "Frontiers in Psychology", "date": "2026-10-02", "citescore": 7.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "AIへの曝露と従業員の燃え尽きの関係についての43の実証研究を系統的にレビューし、AIが作業負荷を減らしつつ心理的な負担を増やすという逆説を整理する枠組み（AIMS）を提案した（抄録）。", "p3": "PRISMA 2020に沿って4つの文献データベースとGoogle Scholarを2026年3月31日まで検索し、燃え尽きを測った20件と、仕組み・調整要因などを調べた23件を含め、混合研究法評価ツールで質を評価した（抄録）。", "p5": "結果はAIの機能的な役割によって異なったと述べるが、詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "AIは仕事を楽にしてくれるはずなのに、AIのせいで疲れるという声もある。この研究は、これまでの研究を集めて、AIが「どんな役割で」入ってくるかによって、燃え尽きを減らすことも増やすこともあると整理しようとした。同じ道具でも使われ方で正反対の効果になる、という点が面白い。", "unverified": "抄録が途中で切れており、AIの役割ごとの結果と枠組みの中身は確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "AIが政府の関心配分と政策議題の断続を変える", "title": "Artificial Intelligence and Punctuated Equilibrium: Shaping Government Attention in the Digital Age", "url": "https://doi.org/10.1111/puar.70221", "authors": "Shuo Chen ほか", "venue": "Public Administration Review", "date": "2026-10-02", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国のAI施策の導入を準自然実験として、AIによる情報処理の制約の緩和が政府の関心を断続的に変えるかを調べ、AIは技術分野への関心を増やすが一般的な政府の関心にはほとんど影響しないことを示した（抄録）。", "p3": "断続平衡理論（政策の議題は、普段は少しずつ、ときに急に変わるという理論）にもとづく条件付きのデジタル断続の枠組みを作り、AI施策の導入の違いを使って政府の関心の変化を推定した（抄録）。", "p5": "政府の関心は断続的なパターンを示し、AIは技術に焦点を当てた関心を増やしたが、一般的な政府の関心への影響は最小限だった（抄録）。これはAIが情報処理に非対称な効果をもつためで、調達ベースの情報量の指標を大きく増やした（抄録）。", "fun": "役所は一度にすべての問題に目を向けられないので、注目する政策の話題はときどき急に入れ替わる。AIで情報を処理する力が増えれば、注目の配り方も変わるのか。中国で調べると、AIは「技術の話題」への関心だけを増やし、ほかの話題にはほとんど影響しなかった。道具は使う分野にだけ効く、という結果が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "山火事後の土石流発生確率に季節が与える影響", "title": "Seasonal influence on post-fire debris flow likelihood after the 2020 Lake Fire", "url": "https://doi.org/10.5194/nhess-26-4723-2026", "authors": "Jeng Hann Chong ほか", "venue": "Natural hazards and earth system sciences", "date": "2026-10-02", "citescore": 8.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "2020年の南カリフォルニアの山火事（Lake Fire）の跡地で4年間の現地と衛星の観測から、山火事後の土石流の発生確率に季節が与える影響を調べ、乾季は不飽和透水係数が大きく発生確率が大きく下がることを示した（抄録）。", "p3": "現地と衛星の4年間の観測にもとづき、さまざまな物理パラメータが季節ごとの土石流の発生確率にどう影響するかをシミュレーションで調べた（抄録）。", "p5": "不飽和透水係数は乾季に雨季より1桁大きく、土石流の発生確率を大きく下げた（抄録）。植生の被覆は、透水係数や粒径に比べて発生確率への影響が小さかった（抄録）。", "fun": "山火事の後の斜面は、強い雨で土石流が起きやすくなる。ところが同じ雨でも、乾いた季節は土が水をよく吸い込むので、土石流が起きにくかった。植物が生えてくることより、土の水の通しやすさや粒の大きさのほうが効いていた。「いつ雨が降るか」で危険度が大きく変わる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "PC橋の緊張材破断を音響のデジタルツインで検知", "title": "Acoustic Digital Twin for Prestressed Concrete Bridges", "url": "https://doi.org/10.58286/34995", "authors": "Gulshat Zaripova ほか", "venue": "e-Journal of Nondestructive Testing", "date": "2026-10-01", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "応力腐食割れで緊張材が突然破断しうるプレストレストコンクリート橋について、音響放出（AE）監視の設計・配置・解釈を最適化するため、橋の中の弾性波の伝わり方をモデル化する音響のデジタルツイン
