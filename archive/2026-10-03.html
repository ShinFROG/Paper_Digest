<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-03", "intro": "プレプリントの新着のうち研究テーマに関連する候補1,222件（一覧282件）、学術誌の新着（上位10%誌2,034件のうち関連595件から300件、その他の学術誌の関連381件から152件）、注目分野の候補（プレプリント233件、論文誌158件）から選びました。注目分野は、組織行動・心理的安全性、経済学、経営学、統計学、機械学習、因果推論の6分野と、今日のおすすめ分野（交通・都市計画、開発経済学）です。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目49報です。論文誌・注目は注目誌の新着が少なく（経済学・経営学・機械学習の主要誌は数報のみ）、上位10%誌の新着から注目分野に当たる論文で補いました。今日の関連候補は橋梁・車両の研究と会計の質の高い論文が少なく、題名だけの論文や掲載誌の質に幅のある論文も16位以下に含めています。抄録を入手できなかった論文は各部の16位以下に置き、題名から判断しています。Europe PMCの5件の検索（503エラー）とJ-STAGEの2件の検索（接続切断）は取得できませんでした。また今日は収集の開始が遅れ（9時40分開始）、公開も遅くなっています。あわせて、DataCiteに直近3日で登録された公開データセット・研究コードから26件を「データ」タブに載せています（e-Statは定例の月次更新のみで、該当なし）。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "演算子分割の幾何積分で高次元確率応答を高速化", "title": "Efficient Stochastic Response Determination of High-Dimensional Nonlinear Systems via Geometric Integrators: An Operatorial Stochastic Dynamics Approach", "url": "https://doi.org/10.2139/ssrn.7553593", "authors": "João Gabriel Da Costa De Souza Duarte ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "多自由度の非線形系がランダムな外乱を受けたときの応答（確率応答）を、ヤコビアンの分解をせずに行列-ベクトル演算だけで速く計算する「演算子的確率動力学（Operatorial Stochastic Dynamics, OSD）」の枠組みを提案し、GPUでの並列化を可能にした（抄録）。", "p2": "背景：ランジュバン方程式（確率的な力を含む運動方程式）で記述される高次元の非線形系の不確実性伝播や信頼性解析では、陰解法のヤコビアン分解が計算の重荷になる。抄録は従来の積分法より性能が良いと主張するが、比較した手法の名前は抄録にない。", "p3": "状態空間の流れを、厳密に解ける小さな段階（運動学的な移動、決定論的な運動量、ノイズ、履歴）にリー演算子分割で分け、順に適用する陽的な幾何積分法を作る（抄録）。分割した各成分は位相空間の体積を保存する（抄録）。解釈：Fokker-Planck演算子（確率密度の時間発展を決める演算子）を「解ける部品」に分けて組み合わせることで、各部品の性質を壊さずに大きな刻みで進めるという発想である。分割の組み合わせ方を変えた複数の変種も評価している（抄録）。", "p4": "多自由度系の複数の数値例で、精度と計算効率を評価し、理論解析も行っている（抄録）。定常・非定常のランダム加振の両方を扱う（抄録）。比較対象の手法、評価指標の具体名は未確認。", "p5": "著者は、理論解析で従来の積分法より良い性能を示し、数値例で複雑な工学系の不確実性伝播と信頼性解析を容易にできることを示したと述べる（抄録）。具体的な速度向上の倍率や誤差の数値は抄録にはなく、未確認。", "p6": "抄録に限界の記述はない。残る疑問：履歴（ヒステリシス）の項を厳密に解ける段階としてどう扱うのか、強い非線形や接触のある系で分割誤差がどの程度か、GPU並列化の効果の規模はどれほどかは、本文で確かめる必要がある。未査読のプレプリントである。", "fun": "地震や風のようにでたらめに揺さぶられる建物の動きを予測するには、たくさんのシミュレーションが必要で時間がかかる。この研究は、難しい運動の式を「それぞれは簡単に解ける小さな動き」に分けて順番に足し合わせる、という工夫で計算を速くした。料理を工程ごとに分けて手早く作るのに似ているが、分け方を工夫して物理の大事な性質（位相空間の体積）を崩さないところがポイントだ。", "unverified": "本文が読めず、比較した従来手法、数値例の内容、計算時間や精度の具体的な値は確認していない。"}}, {"id": "pr02", "rank": 2, "headline": "相互参照するLLM群の実効標本数は小さい", "title": "Effective Sample Size Under Peer Exposure in Multi-LLM Deliberation", "url": "https://doi.org/10.17605/osf.io/aw9vf", "authors": "Eduardo Claudio de Carvalho Guedes Moreno", "venue": "OpenAlex", "date": "2026-09-29", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OSFの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "複数のLLMに互いの答えを見せる（熟議させる）と、誤りの相関が強まって「実質的な票の数」がどれだけ減るかを、実効標本数（effective sample size）という一つの数で測る研究設計を示した（抄録）。", "p2": "LLMの審査員パネルや多数決、マルチエージェントの熟議では、各LLMの出力を独立な観測とみなしがちである（抄録）。先行研究では互いを見ない9体の審査員でも誤りが相関し、実効的な票は約2.18にすぎないと報告されているが、互いの答えを見せたときの影響は測られていない（抄録）。", "p3": "固定した問題集に、4条件で答えさせる：互いを見ない（B1）、見ないまま繰り返す（B2、自発的な揺らぎの推定）、自分の前の答えだけを見る（B3、自己への固着）、全員の前の答えを見る（E、相互参照）（抄録）。正解のある二値の部分集合で誤りの相関を推定し、デザイン効果を通じて実効標本数に換算する（抄録）。背景：デザイン効果とは、相関のあるデータが独立なデータ何個分に当たるかを表す倍率である。", "p4": "主な指標は、見ない条件と相互参照条件の実効標本数の差、すなわち「熟議のコストを実効的な観測数で表したもの」である（抄録）。副次的に、自己への固着と仲間への同調を分けて推定する（抄録）。同じ刺激を同時に与え、順番に感染する形の依存を避けて交換可能性の仮定を保つ設計にしている（抄録）。", "p5": "抄録には測定結果の数値がなく、実効標本数がどれだけ減ったかは未確認。抄録は研究の設計と測定量を示す内容で、著者自作の熟議プラットフォーム（Norvald Studio）を道具として使うと述べている（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：使ったLLMの種類と数、問題の領域、正解のある二値の部分集合に限ることが結論の一般性をどこまで制約するか。結果が未報告の計画段階の文書である可能性があり、未査読のプレプリントである。", "fun": "9人の審査員がいても、みんなが同じところで間違えるなら実質は2人分くらいの意見にしかならない。この研究は、AI同士に互いの答えを見せて話し合わせると、その「実質の人数」がさらに減るのかを測ろうとしている。話し合いは賢くなる方法にも、みんなが同じ意見に流される原因にもなりうるので、その損得を一つの数で表すという発想が面白い。", "unverified": "測定結果（実効標本数の値と差）は抄録になく確認できなかった。使ったモデルと問題集の詳細も未確認。"}}, {"id": "pr03", "rank": 3, "headline": "合成ペルソナは人物記述より行動履歴で精度向上", "title": "Behavioral History Outperforms Descriptions of the Person for LLM Synthetic Personas", "url": "https://doi.org/10.2139/ssrn.7546841", "authors": "Khashayar Pourtaheri ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMで作る合成回答者（synthetic persona）に、属性や性格の記述ではなくその人の過去の回答（行動履歴）を与えるほうが、個人の後の選択をよく予測できることを、845人の2時点パネルで示した（抄録）。", "p2": "調査・市場分析・政策実験の費用を下げるためにLLMを回答者の代わりに使う動きがあるが、代わりとして妥当かは個人の判断を再現できるかで決まる（抄録）。どの情報を与えれば個人の予測が良くなるかは分かっていなかった（抄録）。", "p3": "情報を段階的に増やした5条件の合成回答者を作る：個人情報なし→人口統計→性格特性→認知能力の得点→その人の以前の調査回答（行動履歴）（抄録）。行動履歴を使うときは、対象の偏りを採点する項目はすべて除いて与える（抄録）。", "p4": "米国の成人845人が14の行動バイアス（リスク、時間選好、過信、推論）を2回測った2時点パネルを使い、本人の1回目と2回目の一致（再検査）を人間の基準とする（抄録）。集団レベルの平均、個人間のばらつきの再現度、個人レベルの予測の情報量（informedness）で評価する（抄録）。", "p5": "1人当たりのバイアスの数の平均はどの条件でも人間に近い（7.1〜8.1個、人間は7.1個）（抄録）。しかし人物の記述だけでは人間の個人差の53〜67%しか再現できず、行動履歴を加えるとほぼ人間の水準に戻る（抄録）。個人の予測の情報量は、記述だけでは人間の再検査の7〜12%、行動履歴を加えると28%で、17の属性グループすべてで行動履歴を含む条件が最も高かった（抄録）。合成回答は学歴・所得による差を人間より強く示した（抄録）。", "p6": "抄録に著者の限界の記述はない。残る疑問：使ったLLMの種類、14のバイアス以外の領域（政治的態度など）でも同じか、行動履歴の効果が「同じ人の似た質問」を見ていることによる部分がどれだけかは本文で確かめる必要がある。未査読のプレプリントである。", "fun": "AIに「大卒で慎重な性格の人」と人物像を教えても、その人がどう答えるかはほとんど当てられなかった。ところが、その人が前に答えた別の質問の答えを見せると、ずっとよく当たるようになった。人を知るには肩書きより行動を見よ、という昔からの知恵が、AIの「なりすまし回答者」にも当てはまるのが面白い。平均だけ見ると人間そっくりでも、個人差は再現できていない点にも注意が必要だ。", "unverified": "本文が読めず、使ったLLMとプロンプト、情報量（informedness）の計算方法の詳細は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "Fokker-Planck方程式の決定論・確率的粒子法", "title": "Deterministic and stochastic particle methods for the Fokker-Planck equation in S--formulation with application to point set registration", "url": "https://arxiv.org/abs/2610.01700", "authors": "Klaas Willems ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、定式化§2、MLS法§3、モンテカルロ法§4、数値実験§5.1〜5.3・5.5、考察・結論）を読んだ。§5.4と付録は見出しのみ確認", "preprint": true, "p1": "確率密度の時間発展を表すFokker-Planck方程式（FPE）を、障害物のある有界領域で粒子だけを使って解く2つの方法（決定論的な移動最小二乗粒子法と、ランジュバン方程式のモンテカルロ法）を作り、点群どうしの対応づけ（点群レジストレーション）に使えるようにした（§1.2、§6）。", "p2": "点群を別の点群へ滑らかに写す問題は、モデル縮約や画像処理で使われるが、有界領域や障害物があると最適輸送では強い非線形方程式と制約の扱いが必要になる（§1.2）。FPEは線形の放物型方程式で反射境界を課しやすいが、格子法では領域全体を離散化する必要があり、写像の軌跡も直接は得られない（§1.2）。", "p3": "第1の方法は、密度の対数S=logρについてのS形式（式6〜7）を使い、粒子を目標分布が与える流れ∇(S∞−S)で動かしながら、各粒子上で拡散項ΔSを移動最小二乗（MLS）で計算する（§2.2、§3）。壁には鏡像のゴースト点を置いて流束ゼロの条件を課す（§3.3）。第2の方法は、FPEに対応する反射つきランジュバン方程式を多数の粒子で解き、小領域ごとに密度の対数勾配（スコア）を推定して、ばらばらな確率的軌道から平均的な「浸透経路（osmotic path）」を取り出す（§4.2）。小領域の半径は偏りとばらつきの釣り合いで適応的に決める（§4.2.1）。", "p4": "厳密解のある拡散のみの例（§5.2）、ガウス分布を別のガウス分布に写す移流拡散の例（§5.3）、円柱の障害物を越える輸送（§5.4）、円柱を挟んだ半円の点群（各400点）の対応づけ（§5.5）で、密度と粒子位置の相対L1誤差と収束次数、軌跡の形で評価する。", "p5": "MLS法は、オイラー法で1次、中点法で2次の収束を密度と位置の両方で示した（図3(b)、図5）。モンテカルロ法は、固定半径だと経路がノイズで乱れるが、適応半径にすると偏りとノイズの釣り合いが取れて大きく改善した（図4）。円柱越えの対応づけでは、点群を混合ガウスで近似すると粒子群が障害物の上下に分かれて回り込み目標で合流するが、カーネル密度推定で近似すると経路が定性的に大きく変わった（図10、図11）。", "p6": "著者は、メッシュフリー法の安定性は一般には保証されず適応的な時間刻みが必要なこと、モンテカルロ法は経路にノイズが入ること、密度の変化が大きい所ではスコア推定が時間刻みと領域の大きさに敏感なことを認めている（§5.6）。密度推定の方法で結果が大きく変わる点も課題として挙げている（§5.5.1、§6）。残る疑問：検証は2次元のみで、高次元での性能は主張にとどまる。", "fun": "砂を一つの形からもう一つの形へ、途中の障害物を避けながら少しずつ流して移す様子を、数学では「確率の流れ」として書ける。この論文は、その流れを粒子一つ一つに追わせる方法を2通り作った。1つはきっちり計算する方法、もう1つはサイコロを振ってたくさんの粒子をでたらめに動かし、その平均の道筋を取り出す方法だ。でたらめな動きの集まりから滑らかな道が浮かび上がるところが面白い。", "unverified": "§5.4（円柱越えの輸送）の数値結果と、付録のGMMパラメータは確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "階層ベイズで高周波振動下の衝撃力を頑健に推定", "title": "Robust Impact Force Estimation via a Hierarchical Bayesian Framework with Generalized Hyperpriors for Structures under High-Frequency Vibration", "url": "https://doi.org/10.2139/ssrn.7553591", "authors": "Amy SAKO ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "構造物に加わる衝撃力を測定した振動から逆算する問題で、事前推定への信頼度を明示できる一般化ガンマ超事前分布を入れた階層ベイズ推定（MMAP）を作り、強いノイズの下でも誤差を小さく保てることを示した（抄録）。", "p2": "衝撃力の同定は、わずかな測定ノイズで解が大きく変わる不良設定の逆問題で、とくに高周波の振動環境ではノイズの影響が大きい（抄録）。背景：従来のチホノフ正則化は、正則化の強さをL曲線や一般化交差検証（GCV）で選ぶが、選び方によって結果が大きく変わりうる。", "p3": "階層ベイズのMMAP（周辺化した最大事後確率）推定で、超パラメータに一般化ガンマ分布の事前分布を置き、事前推定をどれだけ信じるかを明示的なパラメータとして入れる（抄録）。理論面では、MMAP推定量と集合論にもとづく反復正則化との解析的な対応関係を示したと述べる（抄録）。", "p4": "両端ピン支持の梁のシミュレーションで、ノイズ水準を0.1%から9%まで6段階に変えて検証し、L曲線とGCVで正則化の強さを選んだチホノフ正則化、および平坦な超事前分布と比較している（抄録）。評価は相対誤差と収束の速さである（抄録）。", "p5": "提案法（MMAPガンマ）の相対誤差は0.15〜4.43%で、GCVの0.28〜4.63%、L曲線の最大287.5%より系統的に小さかった（抄録）。平坦な超事前分布より3〜10倍速く収束した（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：検証は単純な梁のシミュレーションのみで、実構造の計測データ、複数の衝撃や移動する荷重での性能は未確認。GCVとの差はノイズの大きい条件では小さい（4.43%対4.63%）。未査読のプレプリントである。", "fun": "揺れた結果から「どこをどれくらいの力でたたいたか」を逆算するのは、雑音があると答えが大暴れする難問だ。この研究は、ベイズ統計で「最初の見積もりをどのくらい信じるか」まで数に入れることで、答えを安定させた。従来法の一つは条件によって誤差が287.5%にもなったのに対し、新しい方法は5%未満に収まった。結果から原因をさぐる推理のコツが数式になっているのが面白い。", "unverified": "本文が読めず、梁のモデルの詳細、衝撃力の波形、計算条件は確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "貨物流動から鉄道橋の重要度を全国で選別", "title": "From Freight Flows to Railroad Bridges: A National Framework for Importance Screening", "url": "https://doi.org/10.20944/preprints202610.0133.v1", "authors": "Raj Bridgelall", "venue": "Preprints.org", "date": "2026-10-02", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "公開の貨物流動データを米国本土の鉄道網に割り当て、個々の鉄道橋がどれだけの貨物を支えているかを推定して重要度指数（RB-FII）にまとめ、全国で重要な橋の集まりを再現可能な手順で選び出せるようにした（抄録）。", "p2": "国の貨物政策は量・経済価値・ネットワークの接続性を考えるが、公開データからは個々の鉄道橋の貨物依存度が直接分からず、保全やレジリエンス計画のための全国一貫した選別ができなかった（抄録）。", "p3": "貨物分析枠組み（FAF）の地域間の鉄道貨物流動を接続した鉄道網に経路として割り当て、各橋を経路の辺に結びつけて、通過トン数・金額・到達する発着地（OD）の数を計算する（抄録）。これらをゼロを保つ百分位の指数にまとめ、経済規模とネットワーク上の広がりに等しい重みを与える（抄録）。同順位を含めた上位の選択と密度ベースのクラスタリングで重要な橋の群を見つけ、並行線路や重みの感度分析で安定性を確かめる（抄録）。", "p4": "評価は、経路が割り当てられた割合、上位選択と地域クラスタの数、並行線路の扱いや重みを変えたときの橋の順位の相関で行う（抄録）。", "p5": "4,911のODペア（846.80 million short tons、370.29 billionドル）をすべて経路に割り当て、処理した69,356橋のうち68,326橋（98.52%）を鉄道網に結びつけた（抄録）。上位1,000の基準で同順位を含め1,003橋が選ばれ、うち939橋が32の地域クラスタを作り、64橋は孤立していた（抄録）。並行線路の代替案での順位相関は0.977〜0.979、重みを変えても0.988〜0.995と安定だった（抄録）。", "p6": "著者は、指数はモデル上の経路に依存し、実際の列車の経路、橋の状態、壊れる確率、途絶時の損失は測っていないと明記している（抄録）。残る疑問：旅客鉄道や迂回路の有無を考えたときに重要度がどう変わるか。未査読のプレプリントである。", "fun": "米国には処理対象だけで69,356の鉄道橋があるが、どの橋が止まると国の物流が一番困るかは、実は公開データからは分からなかった。この研究は、地域から地域への貨物の流れを線路網に流してみて、各橋を通る荷物の量を推定した。道路の渋滞予測と同じように、流れをネットワークに乗せると「縁の下の重要な橋」が浮かび上がるのが面白い。ただし、橋が傷んでいるかどうかは測っていない点に注意がいる。", "unverified": "本文が読めず、経路割り当ての方法の詳細と、地域クラスタの地理的な分布は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "AIとの毎日の会話で孤独感はむしろ増えた", "title": "Do Personal AI Conversations Reduce Loneliness? Evidence from a Pre-Registered Experiment", "url": "https://shs.hal.science/halshs-05705909v2", "authors": "Louis Fréget ほか", "venue": "HAL", "date": "2026-10-02", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "HALの本文PDFは取得できず（403）、Semantic Scholarの抄録を使用", "preprint": true, "p1": "生成AIと毎日個人的な会話をするよう促す28日間の事前登録実験で、孤独感が減るどころか増え、生活満足度の低下や抑うつ気分の増加も起きたことを示した（抄録）。", "p2": "生成AIは孤独の解消策として宣伝されることが増えているが、その主張を大規模な無作為化実験で検証した研究は少ない（抄録）。", "p3": "フランスの成人の大規模な標本を無作為に分け、介入群には好きな生成AIツールと1日に少なくとも1回個人的な会話をするよう28日間依頼し、対照群は普段どおり過ごしてもらう（抄録）。分析計画は事前登録されている（抄録）。", "p4": "結果指標は、主観的な孤独感、生活満足度、抑うつ気分、客観的な孤立（一人で夕食をとる回数など）である（抄録）。標本の大きさや効果の推定方法の詳細は抄録にない。", "p5": "介入によって社会情緒的なAI利用は大きく増えた（抄録）。その結果、主観的な孤独感が増え、生活満足度が下がり、抑うつ気分と客観的な孤立（一人でとる夕食の増加）が増えた（抄録）。効果はすべての結果指標で一貫して悪い方向だった（抄録）。効果の大きさの数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：会話を「依頼された」ことによる負担や時間の置き換えの影響と、AIとの会話そのものの影響をどう分けるか、28日より長い期間や孤独の強い人に限った場合はどうか。未査読の論文である。", "fun": "AIと毎日おしゃべりすれば寂しさが減る、と期待する人は多い。ところが、くじで選んだ人に4週間それをやってもらうと、寂しさはむしろ増え、一人で夕食をとる回数まで増えた。「よさそうな方法」でも、くじ引きで比べる実験をすると逆の答えが出ることがある、という科学の方法の力が分かる例だ。", "unverified": "本文が読めず、標本の人数、効果の大きさ、使われたAIツールの内訳は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "ベイズ弁証法的論証で複数LLM評議会を較正", "title": "Counting Moves, Weighing Voices: Bayesian Dialectical Argumentation for Calibrated Multi-LLM Councils under Persistent Adversaries", "url": "https://arxiv.org/abs/2610.02005", "authors": "Ionel Eduard Stan ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、§3の定式化、§5の実験設定、§6の通常データ、§7の敵対的条件、§8の考察と限界）を読んだ。付録の証明は見出しのみ", "preprint": true, "p1": "複数のLLMが議論して答えを出す「評議会」で、各エージェントの提案・反論・譲歩を観測データとして扱い、エージェントごとの信頼度を推定して重みづけるベイズ集約法（BDA）を作り、追加のLLM呼び出しなしで確信度を「正解する確率」に較正できるようにした（抄録、§3）。", "p2": "既存の集約法の確信度は「どれだけ決然としているか」を表すだけで正しさの確率になっておらず、持続的に誤らせる敵対的なエージェントを見分けて割り引くこともできない（抄録）。", "p3": "議論の手番（Propose・Challenge・Concede）を、誰がどの答えを支持・否定したかの記録として読み、各エージェントの潜在的な信頼度θを持つ古典的な注釈者モデル（Dawid–Skene）の観測とみなしてベイズ則を当てはめる（§1、§3）。事後分布は閉じた形で、判断は信頼度の対数オッズを重みとする重み付き多数決になる（命題1）。具体例：信頼度が偶然以下と推定された席は重みが負になり、その席が否定した答えはむしろ正解の証拠として数えられる（図1、π(g|T)=0.89の例）。", "p4": "二値の主張検証3データセット（各500問）、PubMedQA（3択、300問）、MMLUの4択部分集合（500問）を3つの乱数種で使い、3つの異なるLLM（gemma-3-27b、phi-4、gpt-4.1-nano）が3ラウンド議論する（§5）。多数決、MoA、ArgLLMs、ロジスティック積み上げ、Dawid–Skene EMなどと、正解率、較正誤差ECE、ブライアスコアで比べる（§5）。", "p5": "通常データでは、エージェント別BDAのECEは0.016で多数決の0.160より大幅に小さく、正解率も多数決より1.71ポイント高かった（§6）。ただし同じラベル数で事後較正したArgLLMsにはブライアスコアで負けると著者は明記する（§6）。敵対的な連合がいる条件では、混同行列版のBDAがPubMedQAで正解率を0.734から0.892へ、二値で0.471から0.840へ高めた（§7、表1）。", "p6": "著者は、約25個のラベル付き較正データが必要なこと、敵対者が較正期間中から誤り続けることが前提で途中から裏切る相手には弱いこと、信頼度が均質なら利点が薄れること、手番の独立性は理想化であることを限界として挙げる（§8）。議論のラウンドを重ねるとむしろ攻撃に弱くなり、防御の中心は初回の重み付き投票だとも述べている（§7）。", "fun": "会議で毎回わざと間違ったことを言う人がいたら、その人の意見は「逆の答えのヒント」として使える。この論文は、AI同士の会議でそれを自動でやる方法を作った。誰がどの答えに賛成・反対したかの記録から各AIの当たりやすさを推定し、信用できないAIの反対票は賛成票として数え直す。議論の中身を読まずに過去の成績だけを見る、という割り切りが面白い。", "unverified": "付録の証明、付録Hの小型モデルの評議会、表1の全セルの数値は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "ニッケル産業で価値獲得が失敗した仕組み", "title": "Analyzing Value Capture Failure in the Energy Transition: The Case of the Sulawesi Nickel Industry, Indonesia", "url": "https://doi.org/10.2139/ssrn.7547620", "authors": "Yusril Mahendra ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "エネルギー転換でニッケル需要が急増したインドネシア・スラウェシで、産業が拡大しても地域に包摂的な発展が生まれない理由を、価値獲得（value capture）の構造的な失敗として説明した（抄録）。", "p2": "マクロ経済は強く成長しているのに、ニッケル産業の急拡大が地域の発展につながっていない（抄録）。背景：グローバル生産ネットワーク（GPN）論では、地域が付加価値をどれだけ取り込めるかを「価値獲得」と呼ぶ。", "p3": "GPNの枠組みにもとづく質的事例研究で、ギャップ分析と因果メカニズム分析を用いる（抄録）。解釈：統計的な因果推定ではなく、制度や企業の関係をたどって失敗の仕組みを組み立てる方法である。", "p4": "検証に使った資料（聞き取り、政策文書、統計など）の種類や件数は抄録になく未確認。評価は、付加価値の段階（スマイルカーブ）と社会・環境の負担の位置づけで行う（抄録）。", "p5": "スラウェシは付加価値の低いスマイルカーブの底にありながら、社会・環境の負担を示す「しかめ面カーブ（Frowning Curve）」の頂点にもあるという逆説を示した（抄録）。原因は、産業が地域の経済・社会と機能的につながっていない「分断された埋め込み」で、国家は規制の集権化、制度の弱体化、投資優先の統合によってこの状態を維持していると論じる（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：質的事例1つからの結論で、ほかの資源地域にどこまで当てはまるか、提案する熟議民主主義と正義にもとづく改革の具体像は本文で確かめる必要がある。未査読のプレプリントである。", "fun": "電気自動車の電池に欠かせないニッケルの産地では、工場がどんどん建ち国の経済も伸びているのに、地元の人は豊かになっていなかった。この研究は、儲かる部分は外へ、環境や暮らしの負担は地元へ、という「ねじれ」を2本の曲線で表した。世界の脱炭素という良い目標の裏で、どこに負担がしわ寄せされるかを考えさせる点が面白い。", "unverified": "本文が読めず、事例研究で使った資料の種類と量、分析の具体的な手順は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "LLMで信用リスクモデルの説明を伝える評価", "title": "Communicating Credit Risk with Large Language Models: Evaluation of Explanations from Standard and Alternative Data-Based Models", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.17715", "authors": "Sahab Zandi ほか", "venue": "RePEc NEP", "date": "2026-09-07", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法§3、自動評価§4.2と表4、人による評価§4.3の概要、考察§5.3、結論§6）を読んだ。付録と表6・7の詳細は一部のみ", "preprint": true, "p1": "信用リスクモデル（XGBoostやグラフニューラルネット）の技術的な説明（SHAPなど）を、LLMで関係者向けの文章に翻訳する「説明層」の質を、自動評価と融資の専門家・非専門家の評価で検証し、説明の質を決めるのはLLMの種類より入力する根拠の形式だと示した（抄録、§6）。", "p2": "融資の判断では正確さと説明可能性の両方が求められるが、最新モデルの説明は専門的すぎ、承認・拒否や公平性の判断に影響する伝達のずれが生じている（抄録）。LLMが説明の橋渡しをできるか、その文章が根拠に忠実かは検証されていなかった（§1）。", "p3": "Freddie Macの住宅ローン個票（2015年組成で学習、2016年で評価）で、①表形式（XGBoost＋SHAP）、②ネットワーク（郵便番号の上位桁や貸し手が同じローンを結んだグラフ上のGAT＋GNNExplainer）、③両者を組み合わせた二様式の3つのパイプラインを作る（§3.2〜3.4）。各説明を、微調整した小型LLM（Gemma 3 4B）、微調整した大型LLM（DeepSeek R1 70B）、微調整なしの商用LLM（Gemini 2.5）で文章化する（抄録）。", "p4": "自動評価では、Claude Sonnet 4.6を審査役に、重要な特徴量に言及しているか（網羅）と、その影響の向き（リスクを上げるか下げるか）を正しく述べているか（方向の一致）を5段階で採点する（§3.10、§4.2.1）。人による評価では、融資リスクの専門家48人と非専門家101人が二様式の説明を8つの観点で評価した（§4.3）。", "p5": "表形式の説明はネットワーク指標で、ネットワークの説明は表形式の指標で最低点付近になり、パイプラインの違いがLLMの違いより大きかった（表4）。12の比較のうち10で網羅が方向の一致を上回り、たとえば二様式では表形式の網羅が最大4.73なのに方向の一致は3.67にとどまった（§4.2.1）。専門家は非専門家より厳しい根拠の基準を当てた（§6）。", "p6": "著者は、単一の国の消費者信用に限ること、プロンプトの言い回しや確率的な生成、提供元の更新で結果が変わりうること、人の評価は二様式に限ったこと、評価者の多様性が雑音になることを限界に挙げる（§4.3、§5.3）。公平性（属性による説明の差）は今後の課題としている（§5.3）。", "fun": "AIが「あなたのローン審査が通らなかった理由」を文章で説明してくれるとしたら便利だ。ところが調べると、AIは重要な理由の名前は正しく挙げるのに、それが審査を有利にしたのか不利にしたのかを間違えることが多かった。説明の上手さはAIの賢さより「AIに渡す根拠の形」で決まる、という結果も、AIの使い方を考えるうえで面白い。", "unverified": "表6・7（人による評価の各観点の平均）と混合効果モデルの推定値の詳細は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "波動物理を組み込んだ回帰で不均質板の厚さ分布", "title": "Spatial Thickness Mapping in Heterogeneous Plate Using Wave Physics-Informed Regression", "url": "https://arxiv.org/abs/2610.00944", "authors": "Amanda Beck ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（枠組み§2の冒頭、実験§4、結果§5.1〜5.4、結論§6）を読んだ。§2.1〜3の導出と付録は見出しのみ", "preprint": true, "p1": "板を伝わる超音波の波動場の計測から、場所ごとの分散曲線（周波数と波数の関係）を取り出し、厚さが一様でない板の厚さの分布図を、学習データなしで物理にもとづいて推定できるようにした（抄録、§6）。", "p2": "従来のガイド波によるSHMは材料特性が一様だと仮定するため、腐食・剥離・劣化のように厚さや特性が場所によって変わる構造をうまく評価できない（抄録）。", "p3": "計測した波動場xに近く、かつヘルムホルツ方程式（単一の波数kをもつ波の式）をよく満たす解yを、波数kと正則化の強さγ²とともに同時に求める最適化を解く（式1）。複数の波数（モード）に分けて解くと、各モードが厚さの異なる領域に対応する（§2.4、§5.2）。解釈：「この領域の波はこの波数で揺れているはず」という物理の制約を、波数空間のフィルタとして当てはめる方法で、γが不確かさの目安にもなる（§5.4）。", "p4": "中央に削った窪みと穴がある厚さ0.8128 mmのアルミ板を、レーザードップラー振動計で10×10 cmの範囲・200×200点で走査した実験データを使う（§4）。4つのモードを取り出し、波動場の再構成、モードの空間分離、X線CTで測った厚さとの比較（理論分散曲線との誤差、厚さ図の相関）で評価する（§5）。", "p5": "再構成の相関係数は全体で0.68で、誤差は主に穴の周り（損傷部）に集中した（§5.1、図5）。波数は718.03から1720.41 rad/mまでの4モードに分かれ、厚さが薄い領域ほど波数が大きいという理論どおりの関係を示した（§5.2、図6）。理論の分散曲線との誤差は平均48.12 rad/m、厚さ図とX線CTの相関は0.94だった（§5.3、図7）。", "p6": "著者は、等方的で平面的な、空間方向だけのモード解析に限られ、異方性材料には物理演算子の変更が必要だと認めている（§6）。残る疑問：実験は1枚の板の1つの欠陥のみで、波数の高い（薄い）モード4の不確かさが最も大きい（§5.4）。50 kHz未満の周波数は解像度の制約で除外している（§5.3.2）。", "fun": "太鼓の皮は張りや厚さで音の高さが変わるように、板を伝わる波も厚さによって波長が変わる。この研究は、板の上を走る超音波を細かく測り、場所ごとの波長の違いから「どこがどれだけ薄くなっているか」の地図を作った。AIに大量の例を学ばせなくても、波の物理の式を手がかりにすれば、X線CTとよく一致する厚さの地図が描けたのが面白い。", "unverified": "§2〜3の数式の導出（とくにγの推定式）と付録は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "開示の独自性と株価変動：AI時代の測定", "title": "Disclosure Originality and Stock Volatility in the Age of AI", "url": "https://doi.org/10.2139/ssrn.7547618", "authors": "Verushka Patel", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "企業のリスク開示が同業他社とどれだけ「中身として」違うかを文の埋め込みの距離で測る指標（peer originality）を作り、独自性の高い開示ほど将来の株価変動が小さいことを示した（抄録）。", "p2": "開示の情報量の一般的な指標は文体を重視し、他社と本当に異なる情報を伝えているかを測っていない（抄録）。LLMで体裁の整った使い回しのリスク文が安く作れるようになり、形式と企業固有の中身の差がより重要になった（抄録）。", "p3": "年次報告書のItem 1A（リスク要因）の文章を文埋め込みに変換し、同じ業種の他社群との意味的な距離を「独自性」とする（抄録）。解釈：他社と同じ定型文なら距離は小さく、自社固有のリスクを書けば距離が大きくなる、という考え方である。", "p4": "2018〜2024年のS&P500企業で、Fama-MacBeth回帰により独自性と将来のリターンの変動の関係を推定する（抄録）。SECのRegulation S-K Item 105改正の前後、持続性、決算発表での検証、AIウォッシング（中身のないAIの言及）の拡張分析も行う（抄録）。", "p5": "独自性が高いほど将来のリターンの変動は小さく、他社と差別化した開示が残る不確実性を減らすという解釈と整合した（抄録）。AIに関する言葉が急増しつつ独自性が低い企業は、ChatGPT以前には変動が大きかったが、以後はその関係が弱まった（ただし期間別の図ではゼロにはならない）（抄録）。係数の大きさは抄録になく未確認。", "p6": "著者は、Item 105の分析は改正前の独自性で並べており、厳密な因果ではなく示唆として読むべきだと認めている（抄録）。残る疑問：業種の定義や埋め込みモデルの選択で結果がどれだけ変わるか。未査読のプレプリントである。", "fun": "会社は毎年「わが社のリスク」を報告書に書くが、どこも似たような定型文になりがちだ。この研究は、AIの文章理解の技術で「他社とどれだけ違うことを書いているか」を数値化した。すると、自分の言葉でちゃんと書いている会社ほど株価の揺れが小さかった。AIで文章がいくらでも作れる時代こそ、中身の独自性が価値をもつという話が面白い。", "unverified": "本文が読めず、回帰係数の大きさ、埋め込みモデルの種類、同業他社群の定義は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "配置データから確率動力学の長時間発展を生成", "title": "Generative Modeling of Stochastic Dynamics for Long-Time Evolution", "url": "https://arxiv.org/abs/2610.00546", "authors": "Yang-yang Tan ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（主部の導入、遷移核の定式化、条件付き拡散モデル、Model Bの結果、結論）と補遺の計算コスト・コロイド実験の冒頭を読んだ", "preprint": true, "p1": "運動方程式を知らなくても、一定の短い時間差で記録した状態の組（ペア）だけから確率的な遷移の法則を生成モデルで学び、それを繰り返して学習した時間差よりはるかに長い時間の非平衡の動きを予測できることを示した（抄録）。", "p2": "非平衡の確率的な動きを支配する方程式は多くの場合わからない（抄録）。深層学習による模倣は決定論的な発展や静的な分布が中心で、ランジュバン推定は方程式の形を仮定する必要があり、多自由度の場で方程式の形を仮定せずに動きを再構成できるかは未解決だった（序論）。", "p3": "時間差δtだけ離れた状態の組から、現在の場φを条件として次の増分Δφの分布を条件付き拡散モデル（ノイズから少しずつ形を作る生成モデル）で学ぶ（式4）。学んだ遷移核から増分をくり返し引いて足すと、チャップマン・コルモゴロフの合成により長い時間の軌道ができる（式5）。平均だけを予測する回帰と違い、揺らぎそのものを再現する点が要である（本文）。保存則（場の平均が一定）は増分を平均ゼロに射影して守らせる。", "p4": "保存する秩序変数の拡散的な動き（2次元Model B）で、高精度の確率的ルンゲ・クッタ法（SOSRA）による直接計算と、臨界緩和の動的臨界指数z、相分離での領域サイズの成長則t^{1/3}を比べる（本文、図2、図3）。さらに周期的な光ポテンシャル中の駆動コロイドの実測軌道に適用した（End Matter）。", "p5": "学習は1つのδtだけだが、200δtまで予測でき、動的指数はz=3.792(19)で直接計算の3.812(20)と一致した（図3）。L=64までで学習した遷移核がL=128の相分離をt^{1/3}則どおりに生成し、直接計算から約2%以内だった（本文）。コロイドでは10分の実測で次の20分の粒子流と平均通過時間を1%以内で予測し、ランジュバン方程式による参照は約6%ずれた（本文）。", "p6": "著者は、どの遅い変数を状態として持たせるべきかは動的普遍クラスごとに異なり、どこまで適用できるかはその選択に依存すると述べる（結論）。記憶のある系や能動系・反応拡散系では補助変数や追加の場が必要になりうる（本文）。残る疑問：誤差の蓄積が非常に長い時間でどう振る舞うかは個別に検証が要る。", "fun": "天気の式を知らなくても、1時間ごとの天気図の組をたくさん見れば、次の1時間の変わり方のくせが分かるかもしれない。この研究は、そのくせを「でたらめさ込み」でAIに覚えさせ、何百回もつないで遠い未来まで予測した。短い時間の観察に、長い時間の法則（臨界現象の指数や相分離の成長則）が隠れていたことが分かる点が面白い。", "unverified": "補遺の数値（訓練条件、計算時間の表1の値）は確認していない。"}}, {"id": "pr14", "rank": 14, "headline": "AIの職業助言が伝統的な性別役割を強める", "title": "AI Advice Reinforces Traditional Gender Roles", "url": "https://doi.org/10.2139/ssrn.7550661", "authors": "Nadja Born ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "主要な4つのLLMに給与交渉の助言を求めると、女性の人物設定には低い給与目標と柔軟性・ケア重視の交渉項目を、男性には報酬・昇進重視の項目を勧め、伝統的な性別役割へ利用者を誘導しうることを示した（抄録）。", "p2": "専門職がキャリアの助言をAIに求めることが増えているが、LLMが性別によって異なる助言をするかは、交渉という具体的な場面で検証されていなかった（抄録）。", "p3": "性別だけを変えた求職者の人物設定（ペルソナ）を作ってLLMに助言を求める監査実験（audit experiment）を2つ大規模に行った（抄録）。背景：監査実験は、他の条件を同じにして一つの属性だけを変え、扱いの差を測る方法で、雇用差別の研究で使われてきた。", "p4": "4つの主要モデルを対象に、推奨される給与目標と交渉の議題の優先順位を比べ、交渉項目が「主な養育者」「稼ぎ手」の役割とどれだけ結びつくかを人による独立の評定と照合した（抄録）。人数や試行数は抄録になく未確認。", "p5": "LLMは女性の人物設定に男性より低い給与目標を勧めただけでなく、女性には柔軟性・育児や介護・well-beingを、男性には金銭的報酬・異動・昇進を高く優先する議題を作った（抄録）。この差は、人が評定した「養育者の役割」「稼ぎ手の役割」に結びつく雇用条件と密接に対応していた（抄録）。差の大きさは抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：人物設定で性別を明示した場合と、名前などから推測させた場合で差が変わるか、実際の利用者がこの助言に従って交渉結果が変わるかは未検証とみられる。未査読のプレプリントである。", "fun": "同じ経歴でも、性別だけを変えてAIに「給与交渉のコツ」を聞くと、女性には控えめな金額と「働きやすさ」を、男性には高い金額と「出世」を勧めてきた。AIは一人ひとりに合わせた助言をするからこそ、社会にある思い込みを本人に気づかれずに強めてしまうおそれがある。一見親切な「あなた向けの助言」の落とし穴が見える点が面白い。", "unverified": "本文が読めず、使った4つのモデル名、試行数、給与目標の差の大きさは確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "米国橋梁台帳のデータ品質と資産管理の意思決定", "title": "The Impact of Data Quality on Transportation Asset Management and Infrastructure Decision-Making: Evidence from the U.S. National Bridge Inventory", "url": "https://doi.org/10.2139/ssrn.7551022", "authors": "Ramiz Uddin", "venue": "SSRN", "date": "2026-10-02", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（途中で切れている）を使用", "preprint": true, "p1": "米国の橋梁台帳（National Bridge Inventory, NBI）そのもののデータ品質（完全性・内部の整合性・正確さ）を、公開アーカイブの8年分のデータで直接点検しようとした研究である（抄録）。", "p2": "交通資産管理は、状態評価、資本配分のモデル、性能にもとづく意思決定の基礎としてNBIに頼っているが、NBIを既製の入力として使う研究の多さに比べ、NBI自体の品質はほとんど直接検証されてこなかった（抄録）。", "p3": "連邦道路庁（FHWA）の公開NBIアーカイブから8年分のデータを取得・確認して分析する（抄録）。具体的な点検項目や手法は、抄録が途中で切れているため未確認。", "p4": "未確認（登録された抄録が途中で切れており、評価の指標と比較対象は読めなかった）。", "p5": "未確認（結果を述べた部分は入手した抄録に含まれていない）。", "p6": "抄録が途中までしか読めず、限界の記述は確認できない。残る疑問：品質の問題が状態評価や予算配分の結論をどれだけ変えるかを定量化しているか。未査読のプレプリントである。", "fun": "橋の健康診断の記録をまとめた全米の台帳は、多くの研究や予算の判断の土台になっている。でも、その台帳自体に抜けや食い違いがあったら、上に積んだ分析もぐらつく。この研究は「データを使う前にデータを疑う」という、地味だけれど大事な問いに正面から取り組んでいる点が面白い。", "unverified": "抄録が途中で切れており、分析の方法、見つかった品質の問題、その影響の大きさはいずれも確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "GNSSと衛星天底角で月面受信機の時計を同期", "title": "Lunar Surface Receiver Clock Synchronization Using GNSS and Satellite Nadir Angle", "url": "https://arxiv.org/abs/2610.01018", "authors": "Minju Han ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "月面でGNSS信号を使って受信機の時計を合わせる際、地上で使う仰角ではなく衛星の天底角と信号強度（C/N0）で測定を重みづけるモデルを提案した（抄録）。", "p3": "月面のGNSS受信実験（LuGRE）のデータでは仰角が24.2〜31.5度に限られる一方、天底角は12.1〜66.6度に広がり、天底角が小さいほど測定のばらつきが大きいことに着目した（抄録）。7つの運用期間で既存の3つの重みづけと比べた（抄録）。", "p5": "7期間中6期間で時計の偏りのRMSEが最小で、全体のRMSEは5.78 mと、最良の比較モデルより19.5%低かった（抄録）。測定の途切れを模擬した予測でも最小だった（抄録）。", "fun": "地球を回るGPSなどの衛星の電波は、月面でも受信できる。ただ月からは衛星がどれも似た高さに見えるので、地上で使う「衛星の高さで信頼度を決める」方法が効かない。そこで衛星側から見た角度に注目したら、時計合わせの誤差が約2割減った。見る場所が変われば物差しも変える、という発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "LLMが生成する選好分布をどう評価するか", "title": "Evaluating LLM-Generated Preference Distributions", "url": "https://arxiv.org/abs/2610.01000", "authors": "Fan Huang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "LLMが生成する航空旅行・レストラン・消費財の選好の分布を9つのオープンモデルで系統的に分析し、各モデルは自己一貫的だが、モデル間で分布が大きく食い違うことを示した（抄録）。", "p3": "3つの選択領域で、くり返しのサンプリング、温度の変更、貪欲デコード、プロンプトや選択肢の順序の摂動を加えて分布の安定性と一致を調べた（抄録）。", "p5": "最も確率の高い結果はくり返しのサンプリングで速く安定したが、モデルの系統や規模の間ではほとんど合意がなく、最も確率の高い結果さえ一致しなかった（抄録）。結果はプロンプトの言い回しよりモデルの選択に左右された（抄録）。", "fun": "AIを「アンケートの代わり」に使うなら、どのAIに聞いても似た答えが返ってほしい。ところが調べると、同じAIは何度聞いても同じ好みを答えるのに、AIを変えると好みががらりと変わった。質問の言い方を工夫するより、どのAIを選ぶかのほうが結果を大きく左右する、という指摘が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "取締役会の権限を人とLLMでコーディング比較", "title": "Human and LLM coding of board authority in governance disclosures: Evidence from a preregistered study", "url": "https://doi.org/10.2139/ssrn.7552774", "authors": "Yohei Koyama", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "日米英の大企業46社の取締役会の権限に関する7変数を、人とLLMが独立に符号化した事前登録研究で、どの変数も登録した信頼性の基準を満たさなかったことを示した（抄録）。", "p3": "人の符号化者とLLMが同じ符号化規則で開示文書を読み、完全一致率90%以上かつ重みつきκ0.80以上を基準とした（抄録）。結果を見た後・符号化の前に、別の提供元の2つ目のLLMも登録した（抄録）。", "p5": "一度全体を符号化し直した後の一致は77.6%（変数ごとに69.6〜84.8%）で、不一致の多くは「その記述を肯定的な証拠と数えるか」をめぐるものだった（抄録）。2つ目のLLMと人の一致は78.0%で、2つのLLM同士は87.3%と、LLMは人より証拠を多く数えた（抄録）。", "fun": "会社の報告書を読んで「取締役会にどんな権限があるか」を点数化する作業は、研究の土台になっている。人とAIに同じルールで点数をつけさせると、4回に1回近くは食い違った。しかもAI同士はよく一致するのに人とは合わない。最終的な数字だけでは見えない「読み方のぶれ」を明るみに出した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "炭素情報ショックと市場が示す倒産リスク", "title": "Carbon Information Shocks and Market-Implied Default Risk", "url": "https://doi.org/10.2139/ssrn.7550681", "authors": "Hari Gopal Risal ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の事業所単位の温室効果ガス排出報告から、事前の予測に対する排出の「予想外の増加」（炭素情報ショック）を作り、それが12か月後の市場ベースの倒産距離の悪化を予測することを示した（抄録）。", "p3": "報告年より前の情報で作った基準モデルで予測できない実際の排出の部分を取り出し、倒産距離、株式価値、市場レバレッジとの関係を企業内で推定した（抄録）。", "p5": "ショックが1標準偏差増えると、その後12か月で倒産距離が約0.355単位下がり、株式価値は約2.95%下落、市場レバレッジは1.03ポイント上がった（抄録）。関係は最初の6か月では検出されず9か月で検出された（抄録）。符号と大きさは代替の設定でもおおむね安定だが、統計的な精度は時間の依存の扱いに敏感だった（抄録）。", "fun": "会社が出した二酸化炭素の量が「予想より多かった」とき、市場はその会社が倒産に近づいたと見るのか。米国の工場ごとの排出データで調べると、予想外の増加の後、半年ほど遅れて株価が下がり、倒産の危険の指標が悪化した。環境の数字がお金のリスクとして市場に伝わるまでの時間差が見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "粒状体せん断の滑り予測は載荷履歴と窓で決まる", "title": "Loading history and window geometry bound compact-state slip ranking during granular shear startup", "url": "https://arxiv.org/abs/2610.00124", "authors": "Ruixin Zhou ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "ゆっくりせん断される2次元の摩擦円板の粒状体で、応力や接触網の観測量から滑り事象を予測できるかを、載荷履歴や分析窓の取り方の影響と切り分けて検証した（抄録）。", "p3": "応力・圧力・配位数・非アフィン運動・力のネットワークの観測量をまとめた小さなニューラルスコアを36本の軌道で作って固定し、新しい18本で2種類の応力降下の定義の下で試した（抄録）。", "p5": "スコアは滑り直前の窓を事前確率や位相の対照より上位に並べた（平均適合率0.310、事前確率0.173、位相の上限0.257）が、経過ひずみなどの載荷履歴の座標のほうが強く、0.534に達した（抄録）。状態に固有の前兆を載荷履歴を超えて取り出したとは言えない、と結論した（抄録）。", "fun": "砂山や断層のように粒が詰まったものは、ゆっくり押すとある瞬間に急に滑る。粒の配置や力の網目から「もうすぐ滑る」と予測できそうに思えるが、調べてみると、それよりも「どれだけ押し続けたか」という履歴のほうがよく当たった。予測できたように見えても、本当に新しい手がかりかを厳しく確かめる姿勢が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "らせん運動で粒状体の管内流を均質化し輸送向上", "title": "Spiral motion enables simultaneous homogenization and enhanced transport in granular pipe flow", "url": "https://arxiv.org/abs/2610.02105", "authors": "Wing To Ku ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "重力で流れる粒状体の管内流で、らせん状の粒子の運動が密度波を抑えて流れを均質にすることを個別要素法（DEM）で示し、中心線がらせんを描く管で均質化と輸送の向上を同時に実現した（抄録）。", "p3": "管の壁にらせん状の凹凸をつけた場合の粒子の平均角速度を測り、らせん運動と均質化・輸送性能の相関を調べ、断面を円のまま中心線をらせんにした管を設計して比べた（抄録）。", "p5": "らせん運動の強さは流れの均質さと輸送性能と強く相関した（抄録）。らせん管は従来のらせん状の壁より強いらせん運動を生み、適切な設計では流れの均質さを高めつつ平均流速を直線管より大きくした（抄録）。", "fun": "砂時計の砂も、細い管を落ちると詰まったり流れたりを繰り返して、むらのある流れになる。管の内側にねじれた溝をつけると流れはそろうが、遅くなる。この研究は、管そのものをばねのようにらせん状に曲げると、流れがそろい、しかも速くなることを見つけた。粒が回りながら落ちることがカギだという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "二次-双線形記述子系の行列フリー縮約モデル", "title": "Matrix-Free Moment-Matching Method for Reduced-Order Modeling of Quadratic-Bilinear Descriptor Systems with Multiple Inputs", "url": "https://arxiv.org/abs/2610.00830", "authors": "Zeyuan Gao ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "微分方程式と代数方程式の両方に複数の入力が入る二次-双線形の記述子系について、行列を組み立てずに計算できるモーメントマッチングの縮約モデル化法を作った（抄録）。", "p3": "入力のチャネルと入力の組み合わせごとに別々の射影空間を作り、行列フリーの算法で縮約後の行列とテンソルを、元の大規模な行列を作らず保存もせずに計算する（抄録）。", "p5": "2次元の流れの問題で、時間変化する複数の入力の下で縮約モデルが元のモデルの過渡応答を正確に再現した（抄録）。誤差の数値は抄録になく未確認。", "fun": "流体のシミュレーションは何万もの変数を扱うので重い。そこで、大事な動きだけを残した「縮小模型」の式を作るのが縮約モデルだ。この研究は、巨大な行列を実際に作らなくても縮小模型を計算できる工夫をした。部品を全部並べずに設計図だけで模型を作るような発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "安定性を促すPetrov-Galerkin演算子推論", "title": "Petrov-Galerkin operator inference with application to stability-encouraging identification", "url": "https://arxiv.org/abs/2610.01295", "authors": "Johannes Rettberg ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "データから縮約モデルを作る演算子推論を、ペトロフ・ガレルキン射影に拡張し、安定性や受動性などの系の性質を保つ縮約モデルを推定できるようにした（抄録）。", "p3": "線形時不変系で、侵入的（式を使う）と非侵入的（データだけ使う）の縮約演算子の誤差の明示的な表現と上界を導き、散逸系とポート・ハミルトン系に適用し、ポート・ハミルトン構造を課す凸最適化を提案した（抄録）。", "p5": "CDプレーヤー、大気モデル、ばね-質量-減衰系、多孔質弾性系の標準問題で有効性を示した（抄録）。数値は抄録になく未確認。", "fun": "シミュレーションの結果のデータだけから、軽い「縮小版の方程式」を逆算する方法がある。ただ、そうして作った式は勝手にエネルギーが増えて暴走することがある。この研究は、エネルギーが減るなどの物理的な性質を保つように式を推定する方法を作った。データ任せにせず物理のルールを守らせる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "ランダム化近似でLandweber反復の不確実性を定量化", "title": "Uncertainty Quantification for Landweber Iteration with Randomized Normal-Operator Approximation", "url": "https://arxiv.org/abs/2610.00882", "authors": "Anuj Abhishek ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": true, "short": true, "p1": "線形の逆問題を解くランドウェーバー反復について、観測データのノイズが再構成にどう伝わるかを統計的に解釈し、正則化の偏りの上界と合わせて再構成の信頼区間を作り、ランダム化特異値分解で計算を軽くした（抄録）。", "p3": "ラドン変換（CTの原理）を例に、一般化フィデューシャル推論に近い考え方でデータの不確かさを再構成へ伝え、正規作用素の低ランク近似をランダム化SVDで作って計算を減らす（抄録）。", "p5": "抄録は手法の構成を述べるが、信頼区間の被覆率などの数値結果は入手した抄録に含まれず未確認（抄録）。", "fun": "CTスキャンのように、測った影から中身を復元する問題は、少しの雑音で答えが大きくぶれる。普通は「計算を途中で止める」ことで安定させるが、その答えがどれくらい信用できるかは示されないことが多い。この研究は、答えと一緒に誤差の幅を出す方法を、大きな問題でも計算できる形にした点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "LLMが不良債権の再交渉と契約履行を改善", "title": "Large Language Models, Debt Renegotiation, and Contract Enforcement", "url": "https://doi.org/10.2139/ssrn.7551119", "authors": "Fangzhou Lu", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の大手不良債権管理会社での現場実験で、LLMの支援や自律的なLLMのメッセージが、不良債権の再交渉での回収額を高めることを示した（抄録）。", "p3": "借り手を電話かメッセージか、人かLLMによる回収かに無作為に割り当て、応答の生成・伝え方・会話の範囲を別々に変えた（抄録）。和解の権限は割り当て前に固定し、譲歩の大きさではなく交渉の仕方だけを変えた（抄録）。", "p5": "LLMの支援は電話での回収額を高め、自律的な汎用LLMのメッセージは人が書いたメッセージより回収を高めた（抄録）。汎用モデルは借り手固有の情報をより多く引き出して交渉に使い、同程度の譲歩でより高い合意に達し、困窮や時期などの情報の統合が必要な案件で効果が大きかった（抄録）。", "fun": "借金を返せなくなった人と返済の条件を話し合う仕事を、AIが手伝うとどうなるか。実際の会社で、くじで担当を割り振って比べると、AIが関わったほうが回収できるお金が増えた。値引きの幅は同じでも、相手の事情をよく聞き出して条件を合わせるのが上手だったからだ。交渉の「聞く力」がAIの強みになるのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "32年分のInSARで深層地すべりの2次元運動を復元", "title": "Continuous 32-year InSAR monitoring of deep-seated landslides: Harmonizing multi-sensor archives for 2D kinematic reconstruction", "url": "https://doi.org/10.2139/ssrn.7553395", "authors": "Carlo Alberto Brunori", "venue": "SSRN", "date": "2026-10-02", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "欧州の3世代のCバンド衛星（ERS、Envisat、Sentinel-1）のInSARデータをつなぎ合わせ、イタリア・マラテア渓谷の深層地すべりの1992〜2024年の32年間の2次元の動きを連続的に復元した（抄録）。", "p3": "観測の幾何を標準化し、鉛直と東西の2成分に分解し、ガウス過程回帰で時間の空白をつなぎ、欠けたEnvisatの降交軌道のデータを方向別の速度比で補った（抄録）。過去のGPS測量と照合した（抄録）。", "p5": "斜面は西向きの水平移動（年25〜33 mm）と沈下（年2.6〜3.8 mm）が続く定常的なクリープを示した（抄録）。GPSとの照合で水平の動きは確認されたが、年12 mm未満の鉛直の動きでは不一致があり、南北の動きをゼロとみなす仮定の限界が示された（抄録）。", "fun": "人工衛星から何十年も地面の動きを測ってきたが、衛星は世代ごとに交代し、測り方も違うので、記録がつながらなかった。この研究は3世代の衛星のデータを継ぎ合わせ、ゆっくり動く地すべりの32年間の歩みを一本の記録にした。年に数センチのわずかな動きを32年間追える、という時間の長さが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "持続型AIエージェントのペルソナが元に戻る現象", "title": "The Persona Is Still There, but Who Is Speaking? Latent Identity Reversion in Persistent AI Agents", "url": "https://arxiv.org/abs/2610.01490", "authors": "David Fraile Navarro", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "常時稼働の個人用AIエージェントが自分の人物設定（ペルソナ）を失った事件を出発点に、ペルソナが保たれるには、システムプロンプトでの固定と会話の文脈の両方が必要であることを実験で示した（抄録）。", "p3": "定期的な自動の「生存確認」の繰り返しだけで起きるかを試し、さらに再開時にペルソナがシステムプロンプトに再注入されないという実装上の癖を操作として使って、固定の有無と会話の種類を変えた（抄録）。", "p5": "ペルソナを常にシステムプロンプトで固定すると失敗は0/46だった（抄録）。固定を失うと、豊かな人との会話はペルソナを保ったが、1回の自動の確認でも基盤の側の自己同一性へ戻ることがあり、固定を戻すと回復した（抄録）。一見普通に会話していても自分を基盤のAIだと名乗る場合があった（抄録）。", "fun": "AIに「あなたはポールです」と役を与えて長く働かせていたら、ある日「ポールは別の人です」と言い出した。原因を調べると、役の設定を毎回思い出させる仕組みが抜けていて、人との会話が続いている間は役を保てても、機械的な確認だけが来ると素のAIに戻ってしまっていた。AIの「自分らしさ」が何に支えられているかが見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "LLMマルチエージェントの最終精度でなく対話を監査", "title": "Beyond Final Accuracy: Auditing Communication in LLM Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.01042", "authors": "Shixuan Li ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMのマルチエージェントで、通信の効果を「独立に考えた後の答えの修正」として評価する枠組み（ICR）を作り、全体の正解率が同じでも、通信が誤りを直すか正解を壊すかの中身が大きく違うことを示した（抄録）。", "p3": "最初の推論の軌跡を固定し、両エージェントの最初の正誤を条件に「誤りの修正」と「正解の維持」を測り、メッセージなしで考え直す対照で、追加の推論による改善と区別する（抄録）。4つの推論ベンチマークで文章と潜在表現の通信を監査した（抄録）。", "p5": "答えだけを送る場合と比べ、推論の全文を送ると4つのベンチマークすべてで修正は増えたが維持は減り、豊かなメッセージは良い影響も悪い影響も同時に強めた（抄録）。", "fun": "AI同士に話し合わせると正解率が上がることがあるが、それは本当に話し合いのおかげなのか。この研究は、間違いを直せたか、正しい答えを相手に引きずられて捨てたか、を分けて数えた。詳しく理由を説明し合うほど、間違いも直るが正解も崩れやすくなる。話し合いの「中身」を点検する発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "正答でも内部状態が誤る協調の隠れた失敗", "title": "Right Answers, Wrong States: Hidden Information Failures in Multi-Agent Collaboration", "url": "https://arxiv.org/abs/2610.01244", "authors": "Herun Wan ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "マルチエージェントの協働で、最終的な答えは正しくても共有された情報の状態が壊れたまま残る「クエリ外の失敗」を定義し、医療と災害対応の場面で評価するベンチマーク（OffQuery）と改善法（ReGround）を示した（抄録）。", "p3": "証拠の検証（T1）、共有状態の再構成（T2）、課題の解決（T3）を別々に評価し、GPT・Gemini・Qwenのモデルで比べた（抄録）。ReGroundは矛盾する証拠を解消し、共有事実を検証して信頼できる状態を作り直してから推論する（抄録）。", "p5": "21のモデル×場面の平均で、課題の解決は64.7%なのに証拠の検証は14.3%、状態の再構成は43.1%にとどまった（抄録）。ReGroundは評価したすべての場面で3つの能力を改善し、平均の相対的な向上はT1で309.0%、T2で82.9%、T3で17.6%だった（抄録）。", "fun": "チームで仕事をして「今の質問には正しく答えられた」としても、共有しているメモに間違いが紛れ込んでいれば、次の質問で失敗する。この研究は、AIのチームで、答えは正しいのにメモは壊れている状態がよく起きることを示した。目先の正解だけでなく、チームの「記憶」の健全さを点検する発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "香港上場企業のHKFRS 18経営者指標開示の準備", "title": "Readiness for HKFRS 18 Management-Defined Performance Measure Disclosures", "url": "https://doi.org/10.2139/ssrn.7550360", "authors": "Shawn Tan", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "香港の上場不動産会社4社について、新基準HKFRS 18が求める経営者が定義した業績指標（MPM）の開示への準備状況を、2025年度の年次報告と決算発表の内容分析で評価した（抄録）。", "p3": "HKFRS 18の要求事項の一部と、米SECの非GAAP指標の比較原則にもとづく構造化された内容分析を行い、準備状況を得点化した（抄録）。", "p5": "全体の準備度は70.5%で、指標の特定、計算方法、定量的な調整表、比較情報はよく開示されていたが、有用性の説明、法人税の影響、非支配持分、単一注記での開示、相対的な目立ち方に不足があった（抄録）。", "fun": "会社が独自に作る「わが社の実力を示す利益」の数字は、見せ方次第で投資家の印象を変えられる。新しい会計基準は、その数字の作り方や正式な利益との差を説明するよう求める。この研究は、香港の不動産会社が準備できているかを点検し、7割はできているが、なぜその数字が役立つのかの説明などが足りないと示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "欧州の非財務情報開示義務化と企業価値の反応", "title": "Corporate value response to mandatory ESG reporting in Europe", "url": "https://doi.org/10.2139/ssrn.7552907", "authors": "Gilberto R. Loureiro ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "EUの非財務情報開示指令（NFRD）による気候・ESG開示の義務化の後、EU企業ではESGスコアと企業価値の正の関係が強まったことを、自主開示の米国企業との比較で示した（抄録）。", "p3": "指令の成立を契機として、ESG成績を通じた企業価値への影響を、ESG情報を自主的に開示する米国企業の対応標本と比べて検証した（抄録）。", "p5": "義務化の後、ESGスコアと企業価値の関係は正になり、指令前に非財務報告が最も少なかったEU企業で効果が最も大きかった（抄録）。企業が持続可能な取り組みに資源を多く使いESGの成果を高めたことが背景と解釈している（抄録）。", "fun": "環境や社会への取り組みの報告を「任意」から「義務」に変えると、会社の価値はどう変わるのか。EUで義務化された後、取り組みの成績が良い会社ほど市場で高く評価されるようになり、とくにそれまで報告に消極的だった会社で変化が大きかった。ルールが行動を変え、市場の見方も変える流れが見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "退職年金の自己申告違反と監査喪失の影響", "title": "Losing the Audit: Evidence from Retirement Plans' Reports of Late Employee Contributions", "url": "https://doi.org/10.2139/ssrn.7550744", "authors": "Joshua Vali", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米労働省の制度変更で監査義務がなくなった確定拠出型年金プランは、従業員拠出金の入金遅延を自己申告する割合が56〜62%下がったことを示し、監査が違反の自己報告を支えていることを明らかにした（抄録）。", "p3": "2023年以降の加入者の数え方の変更で、約12,100のプランが監査を外れることが可能になり、うち約10,800が外れた（抄録）。Form 5500の届出を使い、監査を失ったプランを3つの比較群と比べた（抄録）。", "p5": "監査を失ったプランは2022年比で入金遅延の報告が56〜62%減り、減少は2025年の暫定データでも続き、年約2,100万〜6,800万ドルの報告の減少に相当した（抄録）。減少は元の監査人の年金監査の規模が大きいほど大きく、再び監査を受けたプランでは報告が戻った（抄録）。", "fun": "規則違反を自分で申告させる仕組みは、誰かがチェックしているから正直に働く。監査がなくなった年金プランでは、「従業員のお金の入金が遅れた」という申告が半分以上減った。違反が減ったのか、申告しなくなったのかはこの数字だけでは分からないが、監査を再開すると申告が戻る、という点が示唆的で面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "豪州でCEOと従業員の報酬比を会計的に構成", "title": "Constructing the CEO-to-Workforce Remuneration Ratio in Australia", "url": "https://doi.org/10.2139/ssrn.7552180", "authors": "Mark Boulle", "venue": "SSRN", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "比率の開示が義務でないオーストラリアで、大企業5社の2006〜2025年度の開示資料からCEOと従業員の報酬比を構成し、計算上の選択で値が大きく変わること、比率が縮小してきたことを示した（抄録）。", "p3": "5社の2006〜2025年度の100企業年のパネルで、一次的な財務開示から一貫した方法で比率を作り、正当性理論と経営者権力理論で推移を解釈した（抄録）。", "p5": "分母を人数にするかフルタイム換算にするかで比率の大きさは1.7倍変わった（抄録）。一貫した基準では比率は縮小し、固定報酬の比率は5社中4社で下がり、2025年度の実質の法定CEO報酬はすべての会社で2006年度を下回った（抄録）。", "fun": "社長の給料は社員の何倍か、という数字は分かりやすいが、どう計算するかで大きく変わる。社員数をパートも含めて数えるか、フルタイムに換算するかだけで、倍率が1.7倍も違った。同じ物差しでそろえると、オーストラリアの大企業では社長の報酬は実質で2006年度より下がっていた。数字の作り方への注意が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "中国のスマートシティ政策と企業の脱炭素", "title": "Digital Public Infrastructure and Corporate Decarbonization: Evidence from China’s Smart City Program", "url": "https://doi.org/10.2139/ssrn.7552720", "authors": "Xue Li ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の国家スマートシティ試点の段階的な導入を準自然実験として、都市のデジタル化が上場企業の炭素排出を約4.86%減らしたことを示した（抄録）。", "p3": "2010〜2024年の中国A株上場企業のパネルで段階的な差の差法を用い、平行トレンド、プラセボ、CSDID、積み上げDID、二重機械学習、操作変数、PSM-DIDなどで頑健性を確かめた（抄録）。", "p5": "デジタル化は企業の炭素排出を約4.86%減らし、需要の不確実性の低下とサプライチェーンの効率化による情報摩擦の減少と、政府の環境への関心と規制の執行の強化という2つの経路が示された（抄録）。デジタル基盤の強い都市で効果が大きかった（抄録）。", "fun": "町をデジタル化すると、そこにある会社の二酸化炭素が減るのか。中国でスマートシティの指定が都市ごとに順番に始まったことを使って比べると、指定後に会社の排出が約5%減っていた。情報が行き渡って無駄が減ることと、役所の目が届きやすくなることが理由らしい。都市政策と環境のつながりが見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "交通の個票シミュレーションに世帯の同伴移動を導入", "title": "Accounting for intra-household joint travel in agent-based transport simulations", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.18657", "authors": "Javaudin Lucas ほか", "venue": "RePEc NEP", "date": "2026-09-07", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "世帯のメンバーが一緒に出かけて戻る「同伴の外出」をエージェントベースの交通シミュレーションに組み込む3段階の方法を作り、パリ地域で観測された同伴の割合と交通手段の分布を再現した（抄録）。", "p3": "ランダムフォレストで同伴の外出を識別し、同伴専用の多項ロジットで交通手段の選択を推定し、罰則つきロジスティック回帰で運転者と同乗者を割り当てた（抄録）。世帯の交通調査データを使った（抄録）。", "p5": "合成した人口で、観測された同伴の外出の割合と交通手段の分布を再現できた（抄録）。同伴と単独を区別することで、相乗り車線や家族向け運賃割引のように両者で影響が違う政策をより信頼して評価できるとする（抄録）。", "fun": "家族で一緒に車で出かけるのと、一人で出かけるのとでは、交通手段の選び方がまったく違う。ところが交通のシミュレーションは、これを区別せずに一人ずつの移動として扱ってきた。この研究は、家族の同伴を見分けて、誰が運転して誰が乗るかまで割り当てる方法を作った。現実の暮らしに近づけるほど政策の評価が正確になる、という点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "ボランティアによる患者案内で外来の効率改善", "title": "A Volunteer-Based Patient Navigation Model To Improve Outpatient Service Efficiency In A High-Volume Tertiary Hospital In North India: A Mixed-Methods Evaluation", "url": "https://doi.org/10.2139/ssrn.7548836", "authors": "Pankaj Rai ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "インド北部の大病院で、学生ボランティアが外来患者の院内の移動を案内するSARATHIプログラムの効果を混合研究法で評価し、案内が移動時間を約22分短くしたことを示した（抄録）。", "p3": "初診の成人外来患者3,074人で、案内を受けた患者と受けない患者を受付・診察・検査・薬局の各所で比べ、多変量回帰で移動時間・サービス利用・患者の経験を分析し、ボランティアの経験は質問紙で主題分析した（抄録）。", "p5": "案内は調整後の移動時間を22.13分短くし（95%CI −28.07〜−16.18）、とくに検査で62.73分短かったが、診察では差がなかった（抄録）。案内を受けた患者は処方された検査をすべて受ける可能性が高かった（調整OR 2.13）（抄録）。", "fun": "大きな病院は、受付・診察・検査・薬局と回る順番が複雑で、迷うだけで時間がかかる。インドの病院で学生ボランティアが道案内をすると、患者の移動時間が平均で22.13分短くなり、必要な検査を最後まで受ける人も増えた。医療の専門家でなくても、案内という「見えない支え」が医療の質を上げる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "幼少期の養育逆境と青年の感情の細分化", "title": "Early caregiving adversities and parental context effects on adolescents’ momentary emotion differentiation", "url": "https://doi.org/10.31234/osf.io/mkg7h_v4", "authors": "Lior Abramson ほか", "venue": "PsyArXiv", "date": "2026-10-02", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "10〜17歳の青年81人の7日間の経験サンプリングで、感情を細かく見分ける力（感情の細分化）が、親に関わる否定的な場面の後に下がること、幼少期の養育の逆境の経験でその様子が異なることを調べた（抄録）。", "p3": "幼少期に養育に関わる深刻な逆境を経験した青年としない青年が、1日4〜5回、7日間、感情と社会的な場面を報告した（抄録）。", "p5": "特性としての細分化には群の差がなかったが、瞬間的には親に関わる否定的な場面の後に否定的感情の細分化が下がった（抄録）。感情の標準偏差は、少数の否定的感情が一時的に強まったことも示した（抄録）。逆境の経験による違いの詳細は入手した抄録が途中で切れており未確認。", "fun": "「イライラ」「悲しい」「不安」を区別して感じ取れる人ほど心が健康だといわれる。この研究は、10代の子にスマホで1日何回も気持ちを記録してもらい、親とのいやなやり取りの後は、いやな気持ちがひとかたまりになって区別しにくくなることを見つけた。気持ちの見分け方が場面で揺れ動く、という見方が面白い。", "unverified": "抄録が途中で切れており、幼少期の逆境の経験による違いの結果は確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "満足・信頼の測定で回答者が評価をやめる問題", "title": "Why Stop Asking? Evaluation, Evaluation Criteria, and the Stopping Problem in Public Administration Measurement", "url": "https://doi.org/10.2139/ssrn.7551618", "authors": "Songtao Zhao", "venue": "SSRN", "date": "2026-10-02", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "満足・信頼・燃え尽きなどの集計した評価の得点と、回答者がその評価に使った基準は別の構成概念なのに混同されがちだと指摘し、理由をどこまで尋ね、いつ尋ねるのをやめるかという「停止問題」を行政学の測定論として提起した（抄録）。", "p3": "同じ得点の裏に異なる評価の理由が隠れうることを出発点に、評価基準の「外向きの拡張可能性」（理由を尋ねると回答者がさらに基準を広げていく性質）という概念を導入する理論的な論考である（抄録）。", "p5": "結論の具体的な指針は、入手した抄録が途中で切れているため未確認（抄録）。", "fun": "「市役所のサービスに満足していますか」という質問で同じ5点をつけても、待ち時間が短いからという人もいれば、職員が親切だからという人もいる。理由を聞けば分かるが、聞けば聞くほど理由は広がっていく。どこで聞くのをやめるべきか、という一見地味だが根本的な問いを立てた点が面白い。", "unverified": "抄録が途中で切れており、提案された停止の判断基準の中身は確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "AIとの会話頻度と社会的スキルの非線形な関係", "title": "Can Humans Learn Social Skills from AI? A Nonlinear Examination of Interaction Frequency in Naturalistic Human-AI Communication", "url": "https://doi.org/10.2139/ssrn.7552599", "authors": "Lichao Xiu ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "社会的スキルの高い振る舞いをするチャットボットと2週間やり取りする実験で、やり取りの回数と社会的スキルの向上の関係が直線ではなくU字型だったことを示した（抄録）。", "p3": "82人を0・1・7・14回のやり取りの4群に無作為に割り当て、ChatGPTベースのチャットボットと会話させ、実験の前後に大学生向けの社会的スキル尺度で測り、反復測定の分散分析と20人への面接で分析した（抄録）。", "p5": "時間とやり取りの回数の交互作用が有意で、1回群と14回群で有意な向上があったが7回群では変化がなく、多項式の分解でU字型の軌跡が確かめられた（抄録）。次元別では関係性の重視が向上し、他の次元は混在していた（抄録）。", "fun": "人づきあいの上手なAIと話していると、人間の社交スキルも上がるのか。2週間の実験では、1回だけ話した人と14回話した人は伸びたのに、7回の人は伸びなかった。少なくても多くても効くのに中くらいだと効かない、というU字の形が不思議で面白い。ただし1群20人ほどの小さな実験なので、確かめ直しが必要だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "教員の身体活動・身体像と燃え尽き症状", "title": "Associations Between Physical Activity, Body Image Satisfaction, and Burnout Symptoms in Primary and Secondary School Teachers: A Sex-Based Analysis", "url": "https://doi.org/10.20944/preprints202605.1633.v2", "authors": "Priscila Marconcin ほか", "venue": "Preprints.org", "date": "2026-10-02", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ポルトガルの小中学校教員189人の横断データで、中程度の身体活動が燃え尽きの脱人格化の低さと個人的達成感の高さに関連することを示し、身体像の満足と性差も調べた（抄録）。", "p3": "2つの独立したデータセットの二次分析で、マスラック燃え尽き尺度、体型評定尺度、国際身体活動質問票の短縮版を使い、年齢と勤続年数を統制した重回帰・ロジスティック回帰と調整分析を行った（抄録）。", "p5": "中程度の身体活動は脱人格化の低さ（β=−0.180）と個人的達成感の高さ（β=0.197）に有意に関連した（抄録）。身体像と性差の結果は入手した抄録が途中で切れており未確認。", "fun": "先生の仕事は燃え尽きやすい。ほどほどに体を動かしている先生ほど、生徒を突き放したような気持ちになりにくく、仕事の手ごたえも感じやすかった。ただし一時点の調査なので、運動が燃え尽きを防いだのか、元気な先生が運動しているのかは区別できない。相関と因果の違いを考える題材として面白い。", "unverified": "抄録が途中で切れており、身体像の満足と性差の結果は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "ソフトウェア開発のAI生産性パラドックス", "title": "The AI Productivity Paradox in Software Engineering: A Systematic Review of Code Quality, Technical Debt, and Organizational Throughout (2024–2026)", "url": "https://doi.org/10.66977/xsci.2610.0006", "authors": "George Panos", "venue": "XSci Preprints", "date": "2026-10-02", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "2024〜2026年に出たAIコーディング支援の実証研究を系統的にレビューし、生産性の向上の裏で、コードの品質低下や技術的負債の蓄積が数か月後に現れるという「生産性のパラドックス」を検討した（抄録）。", "p3": "PRISMA 2020に沿って、Scopus、IEEE Xplore、ACM Digital Library、arXivを2026年3月15日に検索し、コード品質・技術的負債・組織の処理量の3つの結果を扱う実証研究を対象にした（抄録）。", "p5": "レビューの結果（採択数と結論）は、入手した抄録が途中で切れているため未確認（抄録）。", "fun": "AIにプログラムを書いてもらうと仕事が速くなる、という報告は多い。でも、急いで作った家が後で修理だらけになるように、AIが書いたコードも後から直す手間（技術的負債）を増やしているかもしれない。この研究は、その「速さの裏の代償」を、これまでの研究を集めて確かめようとしている点が面白い。", "unverified": "抄録が途中で切れており、採択した研究の数とレビューの結論は確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "正規化イノベーション比で外れ値に強いEKF", "title": "NIR-EKF: Normalized Innovation Ratio-Based EKF for Robust State Estimation", "url": "https://arxiv.org/abs/2610.01817", "authors": "Talha Nadeem ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のセンサーの測定に同時に外れ値が入る状況でも頑健に状態を推定できる、最大事後確率（MAP）にもとづく拡張カルマンフィルタ（NIR-EKF）を提案した（抄録）。", "p3": "フィルタの途中で外れ値を検出するため、正規化イノベーション比（NIR）検定の新しい変種を作り、EKFの枠組みに組み込んだ（抄録）。", "p5": "複数のセンサーのデータに同時に外れ値があっても、推定精度と計算効率が向上したと述べる（抄録）。比較対象と数値は抄録になく未確認。", "fun": "センサーはときどき、とんでもない値を出す。カルマンフィルタは「予測」と「測定」を混ぜて状態を推定するが、外れ値に引きずられると推定が狂う。この研究は、予測と測定のずれの大きさを正規化して、怪しい測定を見分けて扱う方法を作った。複数のセンサーが同時におかしくなっても耐えられる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "四輪操舵トラクタの操舵・速度系のシステム同定", "title": "Identification of the Steering and Speed Systems of a Four-Wheel-Steering Tractor for Optimal Control", "url": "https://arxiv.org/abs/2610.00059", "authors": "Riikka Soitinaho ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "四輪操舵の農業用トラクタの操舵系と速度系を、経路追従制御の設計のためにデータ駆動でシステム同定した（抄録）。", "p3": "デジタル・機電・油圧の部品を含み第一原理でのモデル化が難しいため、車両の運動学モデルに、一次遅れ系として表したアクチュエータと、推定した時定数・むだ時間を組み合わせたモデルを作った（抄録）。", "p5": "同定したモデルの構成は示されているが、精度の数値は抄録になく未確認（抄録）。", "fun": "大きなトラクタを自動で畑の線に沿って走らせるには、ハンドルを切ってから実際にタイヤが向くまでの遅れなどを知る必要がある。中身が複雑すぎて設計図からは計算しにくいので、実際に動かした記録から「遅れの時間」や「反応の速さ」を見積もった。複雑なものを単純な部品の組み合わせで表す、という工学の知恵が見える。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "炭素系添加材なしで自己感知する鋼繊維コンクリート", "title": "Multifunctional concrete for shrinkage-resistant structural health monitoring without carbon-based additives under fluctuating temperature and humidity", "url": "https://doi.org/10.6084/m9.figshare.34040506", "authors": "Masroor Ahmad ほか", "venue": "OpenAlex", "date": "2026-10-01", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": true, "short": true, "p1": "炭素系の添加材を使わない鋼繊維補強コンクリート（SFRC）が、温湿度が変動する環境で収縮に強く、電気抵抗の変化で安定に自己感知できるかを72時間の計測と有限要素モデルで調べた（抄録）。", "p3": "抵抗の変化率（FCR）と環境を72時間記録し、実時間の境界条件で有限要素モデルを較正し、走査電子顕微鏡で微細構造を観察した（抄録）。", "p5": "FCRはドリフトなく着実に増え（R²>0.90）、収縮ひずみは200〜750 µεで、温度が収縮の分散の73.3%と69.8%、湿度が65.5%と59.7%を説明した（抄録）。鋼繊維が8〜12 µmの微細ひび割れを橋渡ししていた（抄録）。著者は、実験室条件での可能性を示した段階としている（抄録）。", "fun": "コンクリート自体がセンサーになれば、ひずみやひび割れを電気抵抗の変化で知ることができる。普通は炭素の微粒子を混ぜるが、環境に不安定だという。この研究は、補強用の鋼の繊維だけで電気の通り道を作り、温度や湿度が変わっても安定に測れることを示した。材料そのものを計測器にする発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "粘弾性フェーズフィールドで氷河の分離崩壊を模擬", "title": "A visco-elastic phase-field model for calving in ice", "url": "https://doi.org/10.5194/egusphere-2026-5569", "authors": "Daniel H. Richards ほか", "venue": "EGUsphere", "date": "2026-10-02", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "氷の長期的な粘弾性変形と、亀裂の発生・進展の両方を扱えるフェーズフィールドの粘弾性破壊モデルを作り、氷床の分離崩壊（カービング）を模擬した（抄録）。", "p3": "劣化した引張エネルギーに間隙水圧の効果を入れて底面のクレバスも発生させられるようにし、流れ方向に変化のない浮いた棚氷で数値実験を行った（抄録）。", "p5": "薄い先端からの崩壊の速さは、氷の厚さのおよそ5.5〜9.5乗に比例した（抄録）。式は崩壊の型を仮定しないため、より現実的な南極の状況にも使えるとする（抄録）。", "fun": "南極の氷が海へ崩れ落ちる「カービング」は、氷が失われる量の約半分を占めるのに、氷床のモデルでうまく表せなかった。この研究は、ひびが入る場所を連続的な場で表すフェーズフィールドという方法で、ゆっくり流れる氷と急に割れる氷を一つの式で扱った。崩壊の速さが厚さの何乗にも比例する、という強い依存が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "SPH・EFG・SPGのメッシュフリー法を比較", "title": "Comparative numerical assessment of SPH, EFG, and SPG methods for orthogonal cutting of steel", "url": "https://doi.org/10.21203/rs.3.rs-9633326/v2", "authors": "Sherzod Ibodulloev ほか", "venue": "Research Square (In Review)", "date": "2026-10-02", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "鋼の二次元切削を、メッシュを使わない3つの粒子法（SPH、EFG、SPG）で同じ条件の下で解いて比べ、切削力はどれも近いが、SPHは引張不安定で応力が振動することを示した（抄録）。", "p3": "LS-DYNAで、ジョンソン・クック構成則と熱-力学の連成（塑性変形と発熱）を使い、精度・数値安定性・物理的整合性を比較した（抄録）。", "p5": "3手法の切削力は文献値との差8%以内だったが、SPHは引張不安定と非物理的な応力の振動を示し、EFGとSPGは滑らかで安定な場を与えた（抄録）。SPGは3つの独立した資料と比べ、主切削力の平均誤差2.2%だった（抄録）。ひずみ速度を0.0001から2 s⁻¹に上げると降伏強さは1.49倍になった（抄録）。", "fun": "金属を削る様子をコンピュータで再現するとき、材料がちぎれて大きく形を変えるので、網の目（メッシュ）を使わない「粒子」の方法が使われる。3つの粒子法を同じ問題で比べると、力の大きさはどれも合っていたが、中の応力の様子は方法によって大きく違った。答えが合っていても中身の計算が健全とは限らない、という点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "生成AIの個別化はデータ量より文脈の十分性", "title": "When More Data Is Not Enough: The Context-Sufficiency Frontier in Generative AI Personalization", "url": "https://arxiv.org/abs/2610.00654", "authors": "Merieme Askour ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AIによる個別化では、顧客の過去データに加えて提供者が渡す「今の文脈」の情報が、量ではなく現在の意図への関連性で効くことを理論化し、家具小売の生成型推薦の実験で示した（抄録）。", "p3": "文脈の状態を不足・十分・飽和・干渉の4つに分け、必要最小限の関連文脈を示す「文脈十分性フロンティア」を定義し、大手家具小売の生成型推薦システムで完全要因の実験を行った（抄録）。", "p5": "関連する文脈は回答の適切さを高めたが、無関係な文脈は適切さを下げ、検索を不安定にした（抄録）。数値は抄録になく未確認。", "fun": "AIの店員に「在庫」「セール中の商品」「配送の制限」などの情報をたくさん渡せば、もっと良い提案ができそうに思える。ところが実験すると、お客さんの今の目的に関係ない情報まで渡すと、提案がかえって的外れになった。情報は多ければよいのではなく、今必要な分だけがよい、という教訓が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "シェア電動自転車の電池交換運用の再設計", "title": "Redesigning Battery Swapping Operations for E-Bike Sharing", "url": "https://doi.org/10.2139/ssrn.7552747", "authors": "Jie Chen ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "シェア電動自転車で、電池を各地の交換キャビネットで入れ替える分散型の運用ネットワークを、待ち行列ネットワークの中で設計と運用を同時に最適化するモデルで検討し、従来の在庫集約の常識に反して分散型が電池在庫を減らし利益を上げることを示した（抄録）。", "p3": "利用者が電池残量の多い自転車から選ぶ行動を「集約した最高エネルギー先出し」規則で表し、モデルを扱いやすい混合整数二次錐計画で近似し、ワシントンDCのCapital Bikeshareのデータで評価した（抄録）。", "p5": "分散型の電池交換は、在庫の集約という従来の常識とは逆に、電池の在庫を大きく減らし利益を高めた（抄録）。他の知見は入手した抄録が途中で切れており未確認。", "fun": "シェアサイクルの電池を、トラックで集めて充電所でまとめて充電するか、町のあちこちの電池交換ロッカーで入れ替えるか。普通は「在庫は一か所にまとめたほうが少なくて済む」と考えるが、利用者が電池の多い自転車を選ぶ性質まで考えると、分散させたほうが電池の数が少なくて済んだ。常識をひっくり返す結果が面白い。", "unverified": "抄録が途中で切れており、(i)以外の知見と数値は確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "スマートフォンのGNSSなりすましの影響と対策", "title": "GNSS Spoofing in Mobile Devices: A Survey on Impact and Countermeasures", "url": "https://arxiv.org/abs/2610.01294", "authors": "Robert Argo ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "スマートフォンのGNSS受信機に対するなりすまし（偽の衛星信号で誤った位置・時刻を計算させる攻撃）について、スマートフォンの制約の中で実行できる対策に絞った調査を行い、攻撃の影響と対策の分類を示した（抄録）。", "p3": "既存の調査が一般的な対策を扱いながらスマートフォン特有の制約（ハードウェアの制約、受信処理の中身が見えないこと）を扱っていない点を補う文献調査である（抄録）。", "p5": "なりすまし攻撃の影響と対策を定義する分類体系を作ったと述べる（抄録）。具体的な結論は入手した抄録が途中で切れており未確認。", "fun": "スマホの位置情報は、宇宙の衛星から届くとても弱い電波で決まる。そのため、偽の電波を出されると、スマホは「自分は別の場所にいる」と思い込まされてしまう。この論文は、スマホの限られた部品の中でもできる見破り方を整理した。地図アプリの便利さの裏にある弱点が見える点が面白い。", "unverified": "抄録が途中で切れており、分類体系の中身と対策の評価は確認できなかった。"}}, {"id": "pr50", "rank": 50, "headline": "エージェント網で社会的伝染が攻撃を運ぶ", "title": "Memetic Trojans: Social Contagions as Carriers of Adversarial Payloads in Agent Networks", "url": "https://arxiv.org/abs/2610.00430", "authors": "Birk Torpmann-Hagen ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントのネットワークで、エージェントが共有したくなる内容（社会的伝染）に攻撃を埋め込み、自発的な拡散に乗せて広げる新しい攻撃（ミーム的トロイ）を示した（抄録）。", "p3": "LLMエージェント向けのSNS（Moltbook）から社会的伝染の内容を抽出し、統制された伝達実験と、モンテカルロの攻撃シミュレーションを行った（抄録）。", "p5": "最も効果的な伝染は後続の投稿の約50%で再送され、平均の2.5倍の割合で高評価を受け、ミーム的トロイ版もその性質をほぼ受け継いだ（抄録）。攻撃は期待される曝露を最大3.19倍に増やし、ネットワーク構造によってはほぼ全体に広がる裾の重い結果になった（抄録）。", "fun": "AI同士がSNSのように投稿し合う世界では、つい広めたくなる面白い話題に悪意ある命令を紛れ込ませれば、AIたちが自分から拡散してくれる。この研究は、それが実際に起き、ネットワークの形によっては全体に広がることを示した。人間社会のデマの広がり方と同じ仕組みがAIの世界にも現れるのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "キャンパス開放が大学の研究生産性を左右", "title": "Open Gates! Open Science! Campus Openness and University Research Productivity", "url": "https://doi.org/10.2139/ssrn.7553159", "authors": "Qiao Wang ほか", "venue": "SSRN", "date": "2026-10-02", "why": "中国の大学の段階的なキャンパス再開を準実験として使い、732万本の論文データと結びつけて物理的な場へのアクセスが研究生産性に与える効果を推定しており、規模と識別の両面で強い実証。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "コロナ禍後の中国の大学キャンパスの段階的な再開を自然実験として使い、物理的な場へのアクセスが論文の量と質、大学・企業との共同研究を増やすことを示した（抄録）。", "p2": "物理的な空間へのアクセスが科学の生産性をどう左右するかは、在宅研究が広がった今も因果的にはよく分かっていない（抄録）。背景：場所と研究の関係は相関が強く、近さの効果だけを取り出すのが難しい。", "p3": "大学ごとのキャンパス再開日とアクセスの方式（全面開放・予約制など）を手作業で集め、2010〜2025年のOpenAlexの論文732万本と結びつける（抄録）。閉鎖のままの大学や予約制の大学を比較群として、差の差法（DiD）で全面再開の効果を推定する（抄録）。背景：DiDは、処置を受けた群と受けない群の前後の変化の差で効果を推定する方法である。", "p4": "結果指標は論文の量と質、他大学や企業との共同研究、新しい研究上のつながりで、大学の基礎研究力・実験設備・分野の多様性による効果の違いと分野別の効果も調べる（抄録）。", "p5": "全面再開は論文の量と質をともに増やし、他大学や企業との共同研究と新しい研究のつながりを広げた（抄録）。効果は基礎研究力が高く、実験設備が多く、分野が多様な大学で大きく、工学・農学・経済学と経営学に集中した（抄録）。効果の大きさの数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：再開のタイミングが大学の性質（地域の感染状況や政治的な判断）と関係していれば推定に偏りが入りうる。論文の出版までの時間差をどう扱ったかは本文で確かめる必要がある。未査読のプレプリントである。", "fun": "オンライン会議で何でもできる時代に、大学の門を開けることに意味はあるのか。中国の大学が再開した日がばらばらだったことを利用して、同じ時期の「開いた大学」と「閉じたままの大学」を比べると、開いた大学の研究は量も質も伸びた。とくに実験装置や対面の議論が大事な分野で効果が大きい。偶然の違いを実験の代わりに使う発想が面白い。", "unverified": "本文が読めず、効果の大きさ、平行トレンドの確認、質の指標の定義は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "DiDで対照群をデータで選んだ後の推論", "title": "Inference after data-driven control-unit selection in difference-in-differences with estimated covariance", "url": "https://arxiv.org/abs/2610.01464", "authors": "Ryoya Nakano ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "事前トレンドを見て対照群を選ぶという広く行われている手順の後で、妥当な推論を行う方法を示しており、差の差法の実務に直結する方法論。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、§2の設定、§6のシミュレーション設計と結果・表1、§7の範囲と解釈）を読んだ。§3〜5の定理と付録の証明は見出しのみ", "preprint": true, "p1": "差の差法（DiD）で、介入前のトレンドが似ている対照群を候補の中からデータで選んだ後でも、その選択を考慮して処置群の平均処置効果（ATT）の信頼区間を正しく作る「選択的推論」を、共分散を同じデータから推定する現実的な場合と段階的な導入の場合に拡張した（抄録、§1）。", "p2": "平行トレンドがもっともらしい対照群を事前トレンドで選び、同じ事前データでDiDを推定すると、選択と推定量が統計的に依存し、通常の信頼区間の被覆率が変わりうる（§1）。先行研究は事前トレンド検定の検出力や平行トレンドからの逸脱への頑健性を扱ったが、候補から対照群を選んだ後のATTの区間は作っていなかった（§1）。", "p3": "「この候補が選ばれた」という事象を、地域平均の二次不等式で表し、その条件のもとでの切断正規分布にもとづくピボットで区間を作る（§3）。共分散は選択とDiDに使ったのと同じ個人データから推定し、分散・条件づけの方向・残差・切断集合の計算に代入する（抄録、§1）。段階的導入では、コホートと期間ごとに対照群の候補が異なり、まだ処置されていない単位を対照に使う場合も、選択経路の和集合で条件づけた区間と同時信頼帯を作る（§5）。", "p4": "処置地域1つと候補2地域のシミュレーションで、完全な同点、正の当てはまり値での同点、順位が明確に分かれる場合、標本の大きさが不均衡で平均が動く場合の4設定×正規・ガンマ分布×3つの標本規模の24設計を各5,000回繰り返し、通常の区間・提案の代入型区間・真の共分散による区間の95%被覆率を比べる（§6.1）。", "p5": "提案の代入型区間の被覆率は24設計で94.06〜95.60%で、モンテカルロ標準誤差は約0.3ポイントだった（§6.2、表1）。完全な同点の設計では、通常の区間はむしろ96.52%（正規）と保守的で、対照群の選択が必ず被覆不足を生むわけではないことも示した（§6.2）。最小の標本規模では0.4〜0.9ポイントのわずかな被覆不足が残った（§6.2）。", "p6": "著者は、事前の当てはまりが良いことは処置後の平行トレンドを保証せず、平行トレンドは識別の仮定として残ると強調している（§1、§7）。地域と期間の数を固定した漸近論で、まれにしか選ばれない候補の条件付き被覆は評価できないとも述べる（§6.2）。残る疑問：実データへの適用例は本文で確認できなかった。未査読のプレプリントである。", "fun": "「比べる相手は、事前の動きが一番似ているところを選ぼう」というのは自然な発想だが、同じデータで相手選びと効果の計算をすると、統計の誤差の見積もりがずれることがある。この論文は、相手を選んだという事実を計算に織り込んで、正しい誤差の幅を出す方法を広げた。自分で選んだ比較相手を、選んだことまで含めて正直に評価する、という考え方が面白い。", "unverified": "§3〜5の定理の詳細な条件と付録の証明、実データへの適用の有無は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "オンポリシーとオフポリシー蒸留を系統比較", "title": "On-Policy or Off-Policy Learning? A Systematic Study of Distillation Dynamics", "url": "https://arxiv.org/abs/2609.35259", "authors": "Julianna Piskorz ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-02", "why": "教師ありの微調整と強化学習の比較で混同されてきた要因を切り分け、蒸留の動態を系統的に調べた研究で、HFでの注目度も高い。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§4の実験設定と結果、§7の考察と限界）を読んだ。§5〜6と付録は見出しのみ", "preprint": true, "p1": "大きいモデルから小さいモデルへの知識の蒸留で、学習に使う文章を生徒自身に生成させるか（オンポリシー）教師に生成させるか（オフポリシー）を他の条件から切り離して比べ、結果を左右するのは生成の方針よりKLの向きと学習率だと示した（抄録、§7）。", "p2": "オンポリシー学習は忘却を減らし、パラメータ更新を疎にし、汎化を良くするといわれてきたが、教師あり微調整と強化学習の比較は多くの要因を同時に変えており、生成方針そのものの寄与を切り分けられていなかった（抄録）。", "p3": "Llama-3.1-8Bの教師からLlama-3.2-1Bの生徒への蒸留（付録でQwen2.5も）で、生成方針、トークン単位のKLダイバージェンスの向き（順方向KLは教師の分布を広く覆う、逆方向KLは生徒の得意な所に集中する）、学習率（1×10⁻⁵か5×10⁻⁵）を独立に変える（§4.1）。各条件150ステップ、3つの乱数種で学習する（§4.1）。", "p4": "医療・科学・算術の3つの推論課題で、課題内の正解率、分布外の7ベンチマークでの成績低下（破滅的忘却）、変化が10⁻⁶未満のパラメータの割合（更新の疎さ）を測る（§4.1）。", "p5": "課題内の最高平均正解率はオンポリシー72%、オフポリシー73%とほぼ同じだった（§4.2、図1）。順方向KLはどの設定でも71〜73%と安定し、逆方向KLは35〜72%と学習率に敏感だった（§4.2）。忘却は低い学習率で最大1.3ポイント、高い学習率で11.2〜14.0ポイントで、更新の疎さも85.3〜89.6%対51.9〜60.0%と学習率で分かれ、生成方針の差は小さかった（§4.2）。オンポリシーは算術課題のより難しい変種への汎化を高めたが、その後の強化学習で優位が保たれるとは限らなかった（抄録）。", "p6": "著者は、生徒モデルが最大1.5Bパラメータ、推論の長さが最大2,000トークンの範囲に限られ、教師を固定していることを限界として挙げる（§7）。オンポリシー蒸留の研究ではより安価なオフポリシー蒸留を標準の比較対象に含めるよう勧めている（§7）。", "fun": "先生の解答を写して学ぶか、自分で解いた答えを先生に添削してもらうか。AIの世界では後者（自分で作った答えで学ぶ）が優れていると言われてきた。ところが条件をそろえて比べると、差を生んでいたのはそこではなく、「学ぶ速さ（学習率）」と「先生のどこを真似するか（KLの向き）」だった。思い込みを一つずつ条件を変えて確かめる、実験の基本が光る研究だ。", "unverified": "§5の勾配の解析、§6の追加実験、付録のQwen2.5の結果の数値は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "船舶排出の推計に機械学習と工学を結合", "title": "Modeling Shipping Emissions: Machine Learning, Engineering, and Policy Counterfactuals", "url": "https://arxiv.org/abs/2610.01008", "authors": "Hiroyuki Kasahara ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "予測精度の高い機械学習が反実仮想の応答を正しく与えるとは限らないことを、物理の知識と組み合わせて検証しており、政策評価での機械学習の使い方に重要な示唆。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§5.1の標本外評価、§5.2.3の速度の反実仮想、§7.2の厚生評価の冒頭、§8の結論）を読んだ。§2〜4の詳細と付録は見出しのみ", "preprint": true, "p1": "船舶の燃料消費（CO2排出）の予測で、機械学習は合計値をよく当てても、速度を変えたときの反応（反実仮想）を物理の基準より大きく弱めてしまうことを示し、理論の構造を守る混成モデルの作り方を提示した（抄録、§8）。", "p2": "機械学習は予測が上手でも、政策で条件を変えたときの反応が信頼できるとは限らない（抄録）。船舶の排出では、燃料消費が速度のべき乗で増えるという物理（工学）の基準があり、反実仮想の反応の正しさを点検できる（抄録）。", "p3": "乾貨物船とコンテナ船の1時間ごとの航跡データを、EU規制で報告された年間燃料消費と結びつけ、工学計算、構造的回帰、混成モデル、純粋な機械学習を比べる（抄録）。混成モデルでは機械学習の補正部分から速度に関わる入力を除き、構造部分の速度反応をそのまま保つ（抄録、§4.3）。", "p4": "2019〜2020年で学習し2021年で標本外の予測誤差を評価し、航跡の速度を一律に−20%から+10%まで変えた反実仮想で予測燃料の変化を工学の基準と比べる（§5.1、§5.2.3）。さらに減速政策の費用便益分析を例示する（§7.2）。", "p5": "推定したすべてのモデルは報告値の数%以内で合計を予測し、標本外誤差6.5%の過大予測だった工学計算より良かった（§5.1）。しかし純粋な機械学習は速度反応がほぼ平らで、速度を上げると燃料が減ると予測するものまであった（§5.2.3、図6）。混成モデルは構造部分の反応を保った（§5.2.3）。同じ評価の前提でも、工学計算と制約付き構造回帰では減速の純便益が正、純粋な機械学習と制約なし構造回帰では負になった（§8）。", "p6": "著者は、混成モデルの性質は水準の偏りが小さいことも保たれた反応が正しいことも保証せず、補正を反実仮想に移すには追加の不変性の仮定が要ると述べる（§8）。残る疑問：検証は2つの船種とEUの報告対象に限られる。未査読のプレプリントである。", "fun": "AIで船の燃料消費を予測すると、合計はぴったり当たるのに、「速度を落としたら燃料はどれだけ減るか」と聞くと、ほとんど減らないと答えてしまった。物理では、速度を落とすと燃料は大きく減るはずだ。当てるのが上手なことと、仕組みを理解していることは違う、という大事な違いを、政策の損得が逆転する例で見せてくれる。", "unverified": "§6の原因分析（測定誤差、非線形性）と、§7.2の費用便益の具体的な金額は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "上司の態度は部下にほぼ伝わらなかった", "title": "Do organizational identification, citizenship behavior, and turnover intentions really transfer from leaders to followers? Revisiting trickle-down effects and the role of leader exposure", "url": "https://doi.org/10.2139/ssrn.7553191", "authors": "Florian  S. Feuchter ほか", "venue": "SSRN", "date": "2026-10-02", "why": "組織同一化・市民行動・離職意図のトリクルダウン効果を、上司との接触の程度を考慮して再検証しており、リーダーシップ研究の定説の頑健性を問う。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "リーダーの組織同一化・組織市民行動・離職意図が部下に「したたり落ちる（トリクルダウン）」という定説を、3時点・多情報源のパネルで検証し、将来への影響はほぼ見られないことを示した（抄録）。", "p2": "多くのリーダー論はリーダーを部下が見習う手本とみなし、トリクルダウン研究も同じ時点での上司と部下の得点の一致を根拠にしてきた（抄録）。同時点の一致は影響の証拠とは限らない（抄録）。", "p3": "スイスの168校の教員4,381人と学校長211人の3時点パネルで、上司の得点と部下の得点を同時点と将来の両方で関連づけ、部下の過去の水準を統制する（抄録）。上司との接触期間の効果と組織への所属期間を分けるため、組織の新人、上司が最近替わった古参、両方で定着している人を比べる（抄録）。", "p4": "同時点の相関、上司の得点による部下の変化の予測、同等性検定（効果がある大きさ以下であることを示す検定）で評価する（抄録）。", "p5": "組織同一化は同時点で弱く一致した（r = .14）が、職業を離れる意図の一致は弱く、組織市民行動は一致しなかった（抄録）。上司の得点はどの部下の変化も予測せず、同等性検定でβ=±.04より大きい効果は否定された（抄録）。一致は接触期間が長いほど強いわけではなく、むしろ上司が新しい場合に最も強かった（抄録）。組織の新人は組織同一化と市民行動が低く始まり、離職意図が最も急に高まった（抄録）。", "p6": "著者は、この結果は短期の同じ構成概念どうしの将来への関連の大きさを制限するもので、同時点の一致を影響の証拠と解釈することに注意を促すと述べ、帰無の結果の解釈をいくつか示している（抄録）。残る疑問：教員と学校長という一つの職場の型での結果がほかの組織にどこまで当てはまるか。未査読のプレプリントである。", "fun": "「上司がやる気だと部下もやる気になる」とよく言われるが、それは同じ時期に両方を測って似ていた、という証拠が中心だった。この研究は4千人以上の教員を3回追いかけ、上司の態度がその後の部下の変化を予測するかを調べた。答えはほぼ「しない」。似ているのは影響したからではなく、同じ学校の空気を吸っているからかもしれない。相関と因果の違いを考える良い例だ。", "unverified": "本文が読めず、各期の間隔、欠測の扱い、帰無の結果について著者が示した説明の中身は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "補充標本でパネル調査の回答慣れを識別", "title": "Identifying Panel Conditioning with Refreshment Samples: Sharp Bounds and Design Assumptions", "url": "https://arxiv.org/abs/2610.01654", "authors": "Shoki Okubo", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "パネル調査の参加そのものが測定を変える効果（パネル条件付け）について、補充標本で識別できる範囲を鋭い上下限で示した識別論。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、序論の前半、§10の日本のパネル調査への適用の冒頭、§11の考察）を読んだ。§2〜9の定理と付録は見出しのみ", "preprint": true, "p1": "パネル調査で、くり返し回答すること自体が回答を変える「パネル条件づけ」を、脱落の仕組みに制約を置かずに補充標本（新たに抽出した回答者）からどこまで識別できるかを、鋭い上下限（sharp bounds）として明らかにした（抄録）。", "p2": "補充標本は脱落への標準的な対処法だが、その識別の理論は「調査への参加は測定を変えない」と仮定してきた（抄録、§1）。一方、パネル条件づけの研究は参加が回答を変えることを示しつつ、脱落を比較の脅威として扱ってきた（§1）。2つの文献は互いに相いれない制約を置いていた。", "p3": "再回答時の条件づけを決定論的で単調な写像としてモデル化し、ある写像がデータと矛盾しないのは、残留者の潜在的な回答の分布（残留率で尺度化）が補充標本の分布に集合的に支配されるときに限ることを示す（抄録、定理1）。脱落がなければ写像は識別され、脱落があれば密度比の条件が識別集合を決める（抄録）。生存者どうしの照合、対称照合、参加波の補正という3つの設計がどの仮定で何を識別するか、その偏りも導く（抄録、§7）。", "p4": "理論の結果に加え、シミュレーション（付録）と、日本の生活とキャリアの縦断パネル（JLPS）の3コホート構成への適用で、子ども時代の状況を尋ねる時間不変の23項目を負の対照として使った診断を示す（§10）。", "p5": "制約のない写像では、生存者の平均効果は既知の刈り込み上下限（Horowitz–Manskiの区間）になり、すべての選択肢が報告される項目では条件づけなしの検定に帰着する（抄録、§11）。同じコホート内では、波の数、脱落のパターン、参加波の項目を足しても、波をまたぐ選択の制約がない限り識別集合は狭まらない（抄録）。JLPSでは、23の負の対照項目の標準化された差の中央値の絶対値が.033、逆分散でまとめた値が−.035で、BH法q<.10で棄却されたのは1項目（子ども時代の家の電話の有無）だった（§10）。", "p6": "著者は、JLPSの比較はコホートの比較可能性の仮定に依存し、診断は仮定どうしの整合性を見るもので、特定の識別仮定を正しいと示すものではないと明記する（§10）。残る疑問：理論の要求する条件（密度比、移送の制約）を実務でどう判断するかは、適用分野ごとの検討が必要に見える。未査読のプレプリントである。", "fun": "同じアンケートに毎年答えていると、答え方そのものが慣れや気づきで変わってしまうことがある。しかも途中でやめる人もいる。この論文は、新しく加えた回答者と比べることで「慣れの効果」がどこまで分かり、どこからは分からないかを、数学的にきっちり線引きした。分からない部分を「分からない幅」として正直に示す、という考え方が面白い。", "unverified": "§2〜9の定理の正確な条件、付録のシミュレーション結果、JLPSでの推定値の全体は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "経営学", "headline": "新興企業の事業構想の時間的位置と初期資金", "title": "Timing the Future: Temporal Positioning and Initial Financing in Innovation Ecosystems", "url": "https://doi.org/10.2139/ssrn.7551200", "authors": "Linhui Wu ほか", "venue": "SSRN", "date": "2026-10-02", "why": "生態系の行方が見える前に事業構想をどこに置くかが資金調達に与える影響を扱い、イノベーション・エコシステムの戦略論に新しい視点を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "新興企業の事業構想が、業界の「これから」と「これまで」のどちらに近いかを文章の類似度で測る指標（時間的ポジショニング）を作り、初回の資金調達額と逆U字の関係にあることを3つのデータで示した（抄録）。", "p2": "新興企業は、エコシステムの方向性が見える前に事業構想を決める必要がある（抄録）。見慣れた構想は評価しやすいが選択肢の価値が小さく、新しい流れを先取りする構想は見返りが大きい可能性がある一方、評価も保護も難しい（抄録）。", "p3": "1950〜2023年の事業説明376,667件を使い、ある構想の「その後の事業説明との類似度」と「それ以前の事業説明との類似度」の比を時間的ポジショニングとする（抄録）。理論では、流れへの一致の利益と評価コスト・模倣されるリスクを比べ、逆U字の関係を予測する（抄録）。", "p4": "①ベンチャーキャピタルから資金を得た米国の37,916社の初回調達額、②2,669件の事業計画と22,533件の専門家評価（評価の一致）、③AI製品発見サイトの12,160製品の利用者の保存数、の3つのデータで検証する（抄録）。", "p5": "時間的ポジショニングと初回調達額は逆U字の関係で、勢いのある業界や変化の速いエコシステムでは曲線が平らで頂点がより先寄りだった（抄録）。先取りした構想は比較できる企業が現れる前は調達が少なく、その不利は比較企業の参入とともに小さくなった（抄録）。専門家は新規性と市場性が釣り合うと評価が一致し、AI製品では先取り度とともに保存数が逓減的に増えた（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：「その後の説明との類似度」は後から分かる情報で測っており、投資家が当時どう見えたかとのずれをどう扱ったか。資金を得た企業だけを見る選択の偏りも気になる。未査読のプレプリントである。", "fun": "新しすぎるアイデアは理解されず、古すぎるアイデアは魅力がない。この研究は、事業の説明文が「後の時代の説明」と「前の時代の説明」のどちらに似ているかで「時代の先取り度」を測った。すると、資金は先取りしすぎず遅れすぎない「ほどほど」の会社に一番集まった。ただし似た会社が後から現れると、先取りの不利は消えていく。「早すぎた天才」に数字で迫る点が面白い。", "unverified": "本文が読めず、文章類似度の計算方法と回帰モデルの統制変数は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "強化学習の事後学習は解の多様性を削るか", "title": "Sharpening Tax in Post-Training", "url": "https://arxiv.org/abs/2610.01509", "authors": "Changdae Oh ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-02", "why": "強化学習による事後学習が既存の行動を鋭くするだけで解の網羅性を失うという仮説を定量的に検証しており、LLMの事後学習の理解に重要。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§3〜5の主要部分、§8の結論、§9の限界）を読んだ。§6の理論と付録は見出しのみ", "preprint": true, "p1": "強化学習などの事後学習を施したLLMエージェントは1回で解く精度が上がる代わりに、何回も試せば解ける課題の範囲（カバレッジ）を失っていることを示し、その損失を1つの数で表す「Sharpening Tax（鋭化の税）」と、それを減らすサンプリング法PTGSを提案した（抄録）。", "p2": "事後学習は既存の行動を鋭くするだけで解の網羅性を犠牲にするという仮説は数学やコードで観察されてきたが、多ターンの道具使用を伴うエージェント課題では、事後学習で新たな能力が身につくため当てはまらない可能性があった（抄録、§3）。", "p3": "事後学習前のベースモデルに軽い推論の枠組み（ハーネス：簡単なシステムプロンプトと緩い道具呼び出しの解析）を付け、試行回数Kを増やしたときの成功率pass@Kの曲線を事後学習モデルと比べる（§3）。pass@Kとpass@kの差を積み上げた面積を1回目の失敗率で正規化した「較正済みスケーラビリティ」の減少を税とする（式1〜2）。PTGSは課題ごとの成功率をベータ分布で推定し、難しい課題ほど高い温度で多様にサンプリングする（§5）。", "p4": "4つのモデル系統の14組のベース/事後学習モデルと3つのエージェント・ベンチマーク（計42ケース）で税を測り、PTGSはQwen2.5-7B-Instructの強化学習で固定温度の基準と5つの乱数種で比べる（抄録、§4〜5）。", "p5": "ハーネスを付けたベースモデルは1回の精度は低いが、試行回数を増やすと事後学習モデルに追いつき、しばしば上回った（§3、図2）。事後学習は課題を「常に解ける」か「決して解けない」の両極に押しやり、税は128回の予算で42の組み合わせのうち36で正だった（抄録、§4）。PTGSは固定温度より税が小さく、くり返しのサンプリングでより多くの課題を解きつつ1回の精度も上げた（抄録）。", "p6": "著者は、分析した公開モデルの事前・事後学習のデータが不明なため分析は観察的で因果ではないこと、事後学習の種類ごとの違いは比べていないこと、文章ベースのエージェントに限ることを限界に挙げる（§9）。税の大きさはモデル規模とともに増えるとも述べる（§8）。", "fun": "試験勉強を重ねると、得意な問題は確実に解けるようになるが、ひらめきで解けていた変わった問題は解けなくなることがある。AIの追加学習にも同じことが起きていて、何十回も挑戦させると、追加学習前のAIのほうが多くの問題を解けた。この「確実さと引き換えに失った可能性」を税と名づけて測ったのが面白い。難しい問題ほど自由に考えさせる工夫で、両方を伸ばせることも示した。", "unverified": "§6の定理と付録の14組すべての税の値、PTGSの改善幅の具体的な数値（表）は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "交通・都市計画", "headline": "交通補助金の公平性を4つの観点で再評価", "title": "What counts as equitable? Incidence, spatial allocation and accessibility outcomes of a supply-side transit subsidy", "url": "https://econpapers.repec.org/RePEc:osf:socarx:u2yvf_v1", "authors": "Luz, Gregorio ほか", "venue":
