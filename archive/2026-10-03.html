を作った（抄録）。", "p3": "応力腐食割れの影響を受けたドイツの複数の橋で、制御した素線の切断によるAE信号を記録して参照信号のデータベースを作り、橋の3次元モデルと有限要素メッシュを作って波の伝播を模擬した（抄録）。", "p5": "結果の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "コンクリートの橋の中に張られた鋼の線は、さびて切れても外からは見えない。でも線が切れる瞬間には小さな「パチン」という音（弾性波）が出る。この研究は、実際の橋で線をわざと切って音を記録し、その音が橋の中をどう伝わるかをコンピュータの中の「双子の橋」で再現した。見えない危険を音で聞き取る発想が面白い。", "unverified": "抄録が途中で切れており、デジタルツインの検証結果とセンサー配置の結論は確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "退職移行期の認知機能低下と居住地の都市度", "title": "Residential context and cognitive aging: Differences by urbanicity across the retirement transition", "url": "https://doi.org/10.1093/geronb/gbag204", "authors": "Talayeh M Hosseini ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-10-01", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の健康と退職調査（2000〜2020年、3,675人）で、退職の前後の認知機能の低下が居住地の都市度（都市・郊外・農村）でどう違うかを調べ、退職後の低下は農村で最も急だったことを示した（抄録）。", "p3": "退職前後の個人内の認知の変化を、居住地との交互作用つきで推定し、構成の違いを減らすために逆確率重みづけを使い、ランダム切片・傾きつきの区分線形混合効果モデルで分析した（抄録）。", "p5": "認知機能は退職の前後とも低下し、退職後のほうが速く低下した（抄録）。退職後の低下は農村で最も急だった（抄録）。他の地域の結果の数値は入手した抄録が途中で切れており未確認。", "fun": "仕事をやめると頭を使う機会が減り、物忘れが進みやすいといわれる。その進み方は住む場所によって違い、農村では退職後の低下が最も急だった。人と会う場や学びの場が近くにあるかどうかが、頭の健康を左右しているのかもしれない。町のつくりと脳の老化をつなげる見方が面白い。", "unverified": "抄録が途中で切れており、都市と郊外の結果の数値は確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "AHPとIPAで顧客満足指数の精度を高める", "title": "Integration of the Analytic Hierarchy Process (AHP) and Importance-Performance Analysis (IPA) in Optimizing the Accuracy of the Customer Satisfaction Index", "url": "https://doi.org/10.33395/owner.v10i4.3893", "authors": "William Suhardjo ほか", "venue": "Owner", "date": "2026-10-01", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの民間建設会社で、顧客満足指数（CSI）の属性に等しい重みをつける現状の方法に対し、AHPで重みをつけ、重要度-実績分析（IPA）で改善の優先順位を示してCSIの精度を高めた事例研究である（抄録）。", "p3": "階層分析法（AHP）で属性の優先度と戦略的な重みを決め、過去のCSIデータを使ってIPAで改善の優先度を図に示した（抄録）。", "p5": "AHPの重みを使うとCSIの得点がより正確になり、顧客の選好を客観的に反映すると述べ、IPAの図で最優先の戦略的属性を特定できたとする（抄録）。数値は抄録になく未確認。", "fun": "顧客満足度を「品質」「納期」「対応」などの平均点で出すと、どの項目も同じ重さで数えることになる。でも、お客さんにとって大事な項目とそうでない項目がある。この研究は、項目に重みをつけ、さらに「大事なのに点が低い」項目を図で見つけて改善の順番を決めた。満足度の測り方と使い方をつなぐ点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "南アの上場企業で発生主義の利益調整と企業価値", "title": "Accrual Earnings Management and Firm Valuation: Distributional Evidence From JSE-Listed Firms", "url": "https://doi.org/10.51137/wrp.ijarbm.839", "authors": "Lonwabo Mlawu ほか", "venue": "International Journal of Applied Research in Business and Management", "date": "2026-10-01", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ヨハネスブルグ証券取引所の非金融企業171社（2015〜2025年、1,881企業年）で、発生主義の利益調整が企業価値に織り込まれるかを分位点回帰で調べ、関係が企業価値の分布の位置によって異なることを示した（抄録）。", "p3": "業績で調整したKothari（2005）モデルで裁量的発生高を推定し、企業価値をトービンのqの対数で表し、最小二乗法と分位点回帰で平均と分布の効果を推定した（抄録）。", "p5": "最小二乗法では利益調整と企業価値に弱い正の関連があったが、分位点回帰では中央値（Q50）でのみ正で有意で、下位（Q25）と上位（Q75）では有意でなかった（抄録）。ワルド検定で下位と中央値の差が示された（抄録）。", "fun": "会計のルールの範囲内で利益を「お化粧」すると、株式市場はそれを見抜くのか、だまされるのか。南アフリカの会社で調べると、平均で見るとほとんど関係がないが、真ん中くらいの評価の会社ではお化粧と高い評価が結びついていた。平均だけでは見えない分布の中の違いを探る方法が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "保育の普遍的権利と分断された都市での供給格差", "title": "Universal entitlement, unequal provision: childcare in segregated German cities", "url": "https://doi.org/10.1017/s0047279426101652", "authors": "Matthias Diermeier ほか", "venue": "Journal of Social Policy", "date": "2026-10-02", "sjr": 1.335, "citescore": 7.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ドイツの52都市・2,607地区の保育所の位置情報と社会人口学的情報を結びつけ、社会的に困難な地区ほど保育所が少なく、それは非営利の事業者が豊かな地区に施設を増やしたためであることを示した（抄録）。", "p3": "地区ごとの保育所へのアクセスと社会給付の受給者の割合の相関を、地理参照データで初めて分析した（抄録）。", "p5": "社会的に困難な地区ほど保育所が少なく、その差はもっぱら公的補助を受ける非営利の事業者の保育所が社会経済的に恵まれた地区で増えたことによる（抄録）。ドイツの社会法の補完性原則が非営利事業者の中心的な役割を説明すると述べる（抄録）。", "fun": "ドイツでは子どもが保育を受ける権利は誰にでもあるのに、貧しい地区ほど保育所が少なかった。原因は、補助金を受ける非営利の事業者が、豊かな地区を選んで施設を増やしていたことだった。「みんなに権利がある」ことと「みんなが使える」ことの間にある溝が見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "暑熱の巡礼都市で近隣満足を設計要素から説明", "title": "From Spatial Form to Lived Urban Performance: A Hierarchical PLS-SEM Analysis of Perceived Design-Related Attributions for Neighborhood Satisfaction in a Hot-Climate Pilgrimage City", "url": "https://doi.org/10.3390/buildings16193928", "authors": "Adnan Alshahrani ほか", "venue": "Buildings", "date": "2026-10-02", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "巡礼都市マッカで、住民が知覚する都市デザインの質が、近隣への満足をデザインのおかげだと感じる程度とどう関係するかを、340人の調査と階層的PLS-SEMで検証した（抄録）。", "p3": "都市デザインの質と歩きやすさ・アクセスを反映-形成型の高次の合成変数とし、分離した2段階の推定法と5,000回のブートストラップで推論し、測定の感度・共通方法の偏り・交差検証などで確認した（抄録）。", "p5": "結果の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "町の良さは、きれいな建物が並んでいるかではなく、そこで日々の暮らしがしやすいかで決まる。暑さが厳しく、巡礼の時期には大勢の訪問者が押し寄せるマッカで、住民がどこに満足を感じているかを調べた。見た目より「何ができるか」で町を評価するという視点が面白い。", "unverified": "抄録が途中で切れており、どの要素が満足とどれだけ関連したかは確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "実走行データから電気・CNGバスの走行サイクル", "title": "Towards sustainable public transit: development of representative driving cycles for electric and CNG buses using naturalistic micro-trip data from Patna, India", "url": "https://doi.org/10.1007/s44268-026-00102-z", "authors": "Piyush Kumar Pandey ほか", "venue": "Smart Construction and Sustainable Cities", "date": "2026-10-02", "sjr": 1.361, "citescore": 8.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インド・パトナの都市と農村の混在道路を走る電気バスとCNGバスの実走行データから、地域の走行条件を反映した代表的な走行サイクル（PEBDCとPCBDC）を作った（抄録）。", "p3": "VBOXのGPSロガーで約1,000 kmの高頻度の軌跡データを集めて短い区間（マイクロトリップ）に分け、修正ランダム選択とk平均クラスタリングの2つの方法で代表区間を選んでサイクルを構成し、インドと国際の標準と比べた（抄録）。", "p5": "パトナのサイクルは標準より平均速度が低かったと述べる（抄録）。他の比較の結果は入手した抄録が途中で切れており未確認。", "fun": "電気バスがどれだけ電気を使うかは、どんな道をどんな速さで走るかで大きく変わる。国際的な「標準の走り方」は、渋滞と混在交通の多いインドの町には合わない。この研究は、実際のバスにGPSを積んで1,000 km走らせ、その町らしい「走り方の型」を作った。現実のデータから物差しを作り直す発想が面白い。", "unverified": "抄録が途中で切れており、標準サイクルとの比較の詳細は確認できなかった。"}}, {"id": "jr35", "rank": 35, "headline": "ニューラルネットで構造動力学FEMの反復を加速", "title": "Reconfigurable Computing in Neural Network‐Enhanced Finite Element Analysis in Structural Dynamics", "url": "https://doi.org/10.1002/pamm.70245", "authors": "Vasileios Polydoras ほか", "venue": "Proceedings in Applied Mathematics and Mechanics", "date": "2026-09-30", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "板構造の速度依存の粘塑性動的応答を解く有限要素法で、ニューラルネットにニュートン・ラフソン法のより良い初期値を予測させて反復回数を減らし、CPUのSIMD命令とFPGAで計算を速くした（抄録）。", "p3": "自作の有限要素ソルバーの陰的な材料積分で、学習済みのネットをオフラインの予測器として使い、反復の分岐を固定的な順伝播の計算に置き換えてベクトル化し、省エネのFPGAでネットの計算を加速した（抄録）。", "p5": "ニュートン反復の削減が計算の複雑さを減らし、SIMDの活用を可能にしたと述べるが、速度向上の数値は入手した抄録が途中で切れており未確認（抄録）。", "fun": "方程式を解くときは「だいたいこのへん」という最初の見当が良いほど、少ない回数で答えにたどり着く。この研究は、その最初の見当をニューラルネットに出させ、構造の揺れのシミュレーションを速くした。さらに計算の流れをそろえて、専用の電子回路（FPGA）でも動かした。AIを答えそのものではなく「出発点」に使う発想が面白い。", "unverified": "抄録が途中で切れており、計算時間の短縮の数値は確認できなかった。"}}, {"id": "jr36", "rank": 36, "headline": "個別要素法で弱層の形状が地層変形を支配する", "title": "Control of Geometric Factors of the Coal-Measure Weak Detachment on Layered Structural Deformation in the Kelasu Structural Belt: Insights from Discrete Element Simulations", "url": "https://doi.org/10.3390/app16199786", "authors": "Xikai Sun ほか", "venue": "Applied Sciences", "date": "2026-10-02", "citescore": 6.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国・タリム盆地のクラス構造帯で、炭層の弱い剥離層の空間的な幾何が断層の発達と鉛直方向の変形の分配をどう制御するかを、PFCによる個別要素法の5つの数値モデルで調べた（抄録）。", "p3": "地震探査データの解析にもとづいて、弱い剥離層の空間的な形と産状を変えた5つのモデルを作り、構造変形への影響を比べた（抄録）。", "p5": "結果の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "地層が横から押されると、間にある柔らかい層（石炭の層など）がすべり面になって、上と下の地層が別々に曲がったり割れたりする。この研究は、その柔らかい層の形の違いが地層の変形をどう変えるかを、たくさんの粒の集まりで地層を表すシミュレーションで調べた。粒の計算で山や断層のでき方を探る点が面白い。", "unverified": "抄録が途中で切れており、どの幾何の要因が変形をどう変えたかは確認できなかった。"}}, {"id": "jr37", "rank": 37, "headline": "演算子学習で経路依存の塑性パラメータを逆同定", "title": "Physics-verified operator-learning-assisted inverse parameter identification of path-dependent plasticity", "url": "https://doi.org/10.1016/j.ijplas.2026.104835", "authors": "Yuyi Zhang ほか", "venue": "International Journal of Plasticity", "date": "2026-10-02", "sjr": 4.21, "citescore": 21.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、物理で検証した演算子学習を補助に使い、経路依存の塑性の材料パラメータを逆同定する手法を扱った研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「曲げたり戻したりの履歴で性質が変わる金属の特徴を、測定結果から逆算できるか」だ。重い計算を速くするAI（演算子学習）を使いつつ、物理で答えを確かめるという組み合わせが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jr38", "rank": 38, "headline": "ヨーダンパ変位から鉄道車両の蛇行動を同定", "title": "A measurement method based on yaw damper displacement for hunting instability identification in railway vehicles", "url": "https://doi.org/10.1016/j.measurement.2026.123387", "authors": "Liangcheng Dai ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-02", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": f , "url": "https://doi.org/10.1111/ijcs.70265", "authors": "Yasin Yılmaztürk ほか", "venue": "International Journal of Consumer Studies", "date": "2026-10-02", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "トルコの398人のオンライン調査で、ミニマリスト消費が自発的な簡素さと生活満足に正、製品を持ち続ける傾向に負に関連し、生活満足がその両方の経路を媒介することを示した（抄録）。", "p3": "単純無作為抽出によるオンライン調査を構造方程式モデリングで分析し、直接と間接の関係を検証した（抄録）。", "p5": "ミニマリスト消費は自発的な簡素さと生活満足に正、製品の保持傾向に負に関連し、生活満足が両方の経路を媒介した（抄録）。係数は抄録になく未確認。", "fun": "物を減らして暮らすミニマリストは、本当に幸せなのか。トルコの調査では、少なく持つ人ほど生活に満足していて、その満足がさらに簡素な暮らしにつながっていた。ただし一時点の調査なので、満足しているからミニマリストになったのかもしれない。消費と幸せの関係を考える入口として面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "飼い主はChatGPTと獣医の回答をどう評価するか", "title": "Perceptions of ChatGPT- and veterinarian-generated responses to pet owners’ medical questions", "url": "https://doi.org/10.3389/fvets.2026.1939644", "authors": "Aïnoha Griot ほか", "venue": "Frontiers in Veterinary Science", "date": "2026-10-02", "sjr": 0.753, "citescore": 5.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "飼い主の医療の質問に対するChatGPT（GPT-4o）と獣医師の回答を匿名化して並べ、構成・質・共感の評価と信頼、どちらの回答が好まれるかを、飼い主などへの調査で比べた（抄録）。", "p3": "獣医師とChatGPTが同じ質問に回答し、匿名化してメーリングリストと公開のFacebookグループで配布した調査で、5件法の評価、信頼、好みを尋ねた横断研究である（抄録）。", "p5": "結果は入手した抄録が途中で切れており未確認（抄録）。", "fun": "ペットの具合が悪いとき、獣医さんに聞く代わりにAIに聞く人が増えている。この研究は、同じ質問への獣医さんの答えとAIの答えを、どちらが書いたか伏せて見比べてもらった。人はどちらを信頼し、どちらに思いやりを感じるのか。専門家とAIの「答えの受け取られ方」を比べる発想が面白い。", "unverified": "抄録が途中で切れており、評価の比較結果は確認できなかった。"}}, {"id": "jr45", "rank": 45, "headline": "AIが書く物語はSNS時代の物語の型に従うか", "title": "Do AI stories align with the laws of the story economy?", "url": "https://doi.org/10.1075/ni.25163.rai", "authors": "Juha Raipola ほか", "venue": "Narrative Inquiry", "date": "2026-10-02", "sjr": 0.323, "citescore": 2.2, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "LLMが生成する物語が、SNS時代に注目を集める「個人の変容」を中心とする物語の型に従うかを、DeepSeek・ChatGPT・Copilot・Grokが最小限の指示で作った60の物語で分析し、新しい物語の型が現れつつあることを示した（抄録）。", "p3": "社会言語学と認知物語論の経験的な物語の典型と、1990年代以降のストーリーテリングの手引きの普遍主義的な物語観を比較の枠として、物語を質的に分析した（抄録）。", "p5": "結果は、Web 2.0時代に理解されていた「物語の資本」を考え直させる新しい物語の典型の出現を示したと述べる（抄録）。新しい型の具体的な特徴は入手した抄録が途中で切れており未確認。", "fun": "SNSで広まる話には「つらい経験を経て私は変わった」という決まった型がある。AIに短い指示で物語を書かせると、その型をなぞるのか。4つのAIで60の話を書かせて調べると、どうやら別の新しい型が生まれているらしい。AIが人の語り方の「流行」をどう受け継ぎ、どう変えるかに注目する点が面白い。", "unverified": "抄録が途中で切れており、新しい物語の型の具体的な特徴は確認できなかった。"}}, {"id": "jr46", "rank": 46, "headline": "ケアの尊厳尺度のイタリア語版の心理測定的検証", "title": "Translation, Cultural Adaptation and Psychometric Validation of the Italian Version of the Dignity in Care Scale for Nurses", "url": "https://doi.org/10.1111/jocn.70566", "authors": "Simone Cosmai ほか", "venue": "Journal of Clinical Nursing", "date": "2026-10-02", "sjr": 1.397, "citescore": 8.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "看護師のケアにおける尊厳尺度（DISC-N）をイタリア語に翻訳・文化適応し、全国の看護師1,385人と看護学生905人で心理測定的な妥当性を検証した（抄録）。", "p3": "健康の測定尺度のガイドラインに沿って翻訳・適応し、専門家の評価で内容妥当性を、全国14州と1自治県の標本で構造妥当性・項目性能・信頼性・構成概念妥当性・測定不変性を検討した（抄録）。", "p5": "内容妥当性は優れ、6領域の一貫した構造と、全体と各領域の高い信頼性が示され、性別・年齢・職種で測定不変性が支持された（抄録）。構成概念妥当性の詳細は入手した抄録が途中で切れており未確認。", "fun": "「患者の尊厳を大切にしたケア」をどう測るかは、国や言葉が違えば質問の受け取られ方も変わるので難しい。この研究は、英語で作られた尺度をイタリア語に移し、2千人以上で「同じものを測れているか」を男女や年齢、職種をまたいで確かめた。物差しを国境を越えて運ぶ手間が見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "木・アルミ外骨格で補強したRC骨組の振動台データ", "title": "A multi-phase shaking table dataset of reinforced concrete frames retrofitted with a timber–aluminium exoskeleton", "url": "https://doi.org/10.1038/s41597-026-08409-3", "authors": "Antonio Shoklarovski ほか", "venue": "Scientific Data", "date": "2026-10-02", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "古い基準で設計された欧州の鉄筋コンクリート建物を想定し、木材とアルミの外骨格と断熱外装パネルで耐震と省エネを同時に改修したRC骨組の、多段階の振動台試験のデータセットを公開した（抄録）。", "p3": "EUのHorizon EuropeのERIESが支援したRESUMEプロジェクトで、靭性の低い2層のRC骨組の1/3縮尺の試験体2体を振動台で加振した（抄録）。", "p5": "データの構成の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "ヨーロッパには古い基準で建てられ、地震に弱く断熱も悪い建物がたくさんある。そこで、建物の外側に木とアルミの骨組みをかぶせ、同時に断熱パネルも付けて、地震と省エネの両方を一度に直そうという工夫が考えられた。この研究は、その建物の縮小模型を揺らした記録を誰でも使えるように公開した。", "unverified": "抄録が途中で切れており、試験の段階と記録した計測の種類・量は確認できなかった。"}}, {"id": "jr48", "rank": 48, "headline": "全リスク契約のサービス別利用から診療報酬を見直す", "title": "Service-Level Utilization in Risk-Based Contracts and a Benchmarking Approach for Fee-Schedule Reforms", "url": "https://doi.org/10.1001/jamahealthforum.2026.3533", "authors": "Aaron L. Schwartz ほか", "venue": "JAMA Health Forum", "date": "2026-10-02", "sjr": 2.833, "citescore": 7.9, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "Humana社のメディケア・アドバンテージの請求データ（2015〜2019年）で、総医療費の全リスクを負う契約の医療者組織と出来高払いの組織のサービス別の利用パターンを比べ、その差を促す出来高払いの診療報酬改革を模擬した（抄録）。", "p3": "全リスク契約に帰属する585,487人と出来高払いの受給者の詳細な患者属性を調整してサービス別の利用を比較した後ろ向きの横断研究である（抄録）。", "p5": "結果は入手した抄録が途中で切れており未確認（抄録）。", "fun": "医者に「診療した分だけ払う」と、検査や処置が増えがちになる。一方、患者一人の医療費を丸ごと任せる契約だと、本当に必要な医療を選ぶ動機が働く。この研究は、丸ごと任された医療者がどんな医療を多く・少なく使っているかを調べ、その姿に近づくように1,000を超える診療の値段を付け直す方法を考えた。値段で医療の形を変える発想が面白い。", "unverified": "抄録が途中で切れており、サービス別の利用の差と改革の模擬結果は確認できなかった。"}}, {"id": "jr49", "rank": 49, "headline": "勾配ブースティングでシミュレーションと実測を融合", "title": "Digital Twin for High-Precision Structural Strength Monitoring: Enhanced Multi-Source Data Fusion by Gradient Boosting", "url": "https://doi.org/10.1115/1.4072738", "authors": "Kuo Tian ほか", "venue": "Journal of Applied Mechanics", "date": "2026-10-01", "citescore": 5.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "シミュレーションと実測の値の大きなずれがデジタルツインの多源データ融合の精度を下げる問題に対し、勾配ブースティングを2段階で使う構造強度の監視法（DT-EMSDF-GB）を提案した（抄録）。", "p3": "オフライン段階で大量のシミュレーションデータから勾配ブースティング決定木の事前学習モデルを作り、オンライン段階で少ない実測値と予測値の残差を勾配ブースティングにもとづくサポートベクター回帰でくり返し近似した（抄録）。", "p5": "過学習などの課題に対処できると述べるが、精度の数値は入手した抄録が途中で切れており未確認（抄録）。", "fun": "コンピュータの中の「双子の構造物」は、計算の前提が少し違うだけで、実物の測定値と大きくずれることがある。この研究は、まず大量の計算結果で大まかな予測を作り、少しの実測データで「ずれ」だけを後から学んで直す、という2段構えにした。大まかに作って細かく直す、という職人的な手順が面白い。", "unverified": "抄録が途中で切れており、精度の改善の数値と検証の対象は確認できなかった。"}}, {"id": "jr50", "rank": 50, "headline": "試験とDEMの連成で凍結融解による割裂損傷を追跡", "title": "Experimental-DEM coupled investigation on freeze-thaw splitting damage evolution in foamed asphalt cold recycled mixture", "url": "https://doi.org/10.1016/j.conbuildmat.2026.148362", "authors": "Xiujun Li ほか", "venue": "Construction and Building Materials", "date": "2026-10-02", "sjr": 2.097, "citescore": 14.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、泡状アスファルトによる常温再生混合物の凍結融解での割裂損傷の進展を、試験と個別要素法（DEM）を連成させて調べた研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「道路の材料が凍ったりとけたりを繰り返すと、中の粒の結びつきがどう壊れていくか」だ。実験と、粒一つ一つを計算する方法を組み合わせて、目に見えない内部の傷み方を追う点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "「実力」の判断は機会を差し引いて構成される", "title": "Psychological and computational evidence that merit is a constructed evaluative process", "url": "https://doi.org/10.1126/sciadv.aeh5472", "authors": "Sarah Vahed ほか", "venue": "Science Advances", "date": "2026-10-02", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "不平等を正当化する「実力」の判断が、努力と機会をどう組み合わせて作られるかを心理実験と計算モデルで示しており、分配の公正の議論の基礎を与える。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "人がどれだけ報われるに値するか（実力・功績）の判断が、決まった規則ではなく、努力と機会による生産性を主観的に重みづけて組み立てる価値計算であり、その重みづけが人によって正反対になりうることを、4つの事前登録実験と計算モデルで示した（抄録）。", "p2": "実力（merit）は人々の間の不平等を正当化する道徳原理だが、個人の生産性は努力だけでなく機会にも左右される（抄録）。人がこの2つをどう組み合わせて「報われるに値する」と判断しているかは分かっていなかった（抄録）。", "p3": "2段階の課題で、まず参加者に実際の作業量で競うトーナメントを行わせ、努力による成績と、機会に依存する構造的な生産性（産出）を切り離す（抄録）。次に観察者や利害関係者のグループがプレーヤーに資源を配分し、その配分を計算モデルで分析して、各人が2つの次元をどう重みづけているかを推定する（抄録）。", "p4": "米国の標本（合計N=759）で、金銭的な誘因つきの事前登録された4つの研究を行った（抄録）。評価は、成績と構造的生産性が値する度合いの判断と配分に与える影響、および計算モデルが推定する潜在的な重みのパターンである（抄録）。", "p5": "どの研究でも、プレーヤーの成績と構造的生産性の両方が値する度合いの判断に影響した（抄録）。計算モデルは、意思決定者がこれらの次元を価値の計算に統合して配分を決めていることを示した（抄録）。重要なのは、潜在的な重みづけが人によって異なり、値する度合いについて正反対の考え方をもつ部分集団が現れたことである（抄録）。効果の大きさや部分集団の割合は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：米国の参加者のみで、文化や政治的立場による重みの違いがどこまで一般化するか、実験室の小さな配分が社会制度の判断にどう対応するかは本文で確かめる必要がある。", "fun": "同じ成果を出した2人でも、一人は努力で、もう一人は恵まれた環境のおかげだったら、ご褒美は同じでよいか。この研究では、人によって答えが正反対に分かれた。努力を重く見る人もいれば、結果を重く見る人もいる。「実力主義」という言葉は一つでも、頭の中の計算式は人それぞれだから、実力主義をめぐる議論がかみ合わないのかもしれない、という点が面白い。", "unverified": "本文が読めず、計算モデルの形、部分集団の割合、各研究の設計の違いは確認していない。"}}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "起業家は売り込みの場で投資家との新たな縁を得る", "title": "When money isn't everything: Identifying stage‐based patterns of entrepreneurial resource acquisition", "url": "https://doi.org/10.1002/smj.70134", "authors": "Esther Leibel ほか", "venue": "Strategic Management Journal", "date": "2026-10-02", "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "why": "既存の人脈が資金調達を予測するという従来の見方を逆にし、ピッチという行為が投資家との新しいつながりを生む段階的なパターンを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録（研究要約と実務向け要約）を使用", "preprint": false, "p1": "起業家のピッチ（投資家への売り込み）が、資金だけでなく投資家との新しいつながりも生むこと、そして企業の段階に合った話し方（初期は社会的な協働、後期は財務の実績）がそれぞれ異なる資源の獲得につながることを示した（抄録）。", "p2": "起業家の資源獲得の研究は、既存のつながりが資源獲得を予測するかに注目してきた（抄録）。逆に、ピッチという行為そのものが投資家との新しいつながりを生むかは調べられていなかった（抄録）。", "p3": "地域の食と農への投資を進める「Slow Money」コミュニティのピッチ大会で、社会起業家がインパクト投資家に行ったピッチの語り方（フレーミング）と、その後の資金獲得・投資家とのつながりの関係を分析した（抄録）。", "p4": "企業の段階（初期・後期）ごとに、財務のプロセスを強調するか社会的なプロセスを強調するかで、獲得した資金と投資家とのつながりの数が違うかを比べる（抄録）。標本の数と分析手法は抄録になく未確認。", "p5": "すべての企業に効く単一の戦略はなく、「段階に合ったフレーミング」が投資家の期待と合うことで資源獲得を促した（抄録）。後期の起業家は財務のプロセスを強調すると資金を多く得て、初期の起業家は協働や真のパートナーシップへの意欲など社会的なプロセスを強調すると投資家とのつながりを多く得た（抄録）。引きつける行動上の合図も役立った（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：インパクト投資という特定のコミュニティでの結果で、一般のベンチャーキャピタルに当てはまるか、フレーミングの選び方自体が企業の質と関係している可能性（内生性）をどう扱ったかは本文で確かめる必要がある。", "fun": "起業家のプレゼンは、お金を集める場だと思われている。でもこの研究によると、創業したばかりの会社は「一緒にやりましょう」という姿勢を見せると投資家との縁が増え、成長した会社は実績を語るとお金が集まった。会社の年齢に合った話し方があるのだ。人脈がなくても、話し方で人脈を作れる、という発見が面白い。", "unverified": "本文が読めず、標本の規模、フレーミングの測定方法（テキスト分析か評定か）、効果の大きさは確認していない。"}}, {"id": "jn03", "rank": 3, "field": "因果推論", "headline": "交差試験の因果効果・効率的推定・頑健な推論", "title": "Principled analysis of crossover designs: Causal effects, efficient estimation and robust inference", "url": "https://doi.org/10.1214/26-aos2663", "authors": "Zhichao Jiang ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "各個体が複数の処置を順に受ける交差デザインについて、因果効果の定義から効率的な推定と頑健な推論までを体系化した。", "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（抄録、序論の冒頭、§7の適用例と表2、シミュレーションの要約）を読んだ。§2〜6の定理と付録の証明は抄録の範囲", "preprint": false, "p1": "各個体に処置の順序を無作為に割り当てる交差（クロスオーバー）デザインについて、潜在アウトカムで因果効果（即時効果と持ち越し効果）を定義し、制約と重みをつけた最小二乗法だけで、作業用の回帰モデルが誤っていても一致的・効率的な推定と妥当な推論ができる枠組みを示した（抄録）。", "p2": "交差デザインは同じ個体の中で比べるため個体間のばらつきを除け、医学研究やデジタル基盤の実験（スイッチバック実験）で広く使われるが、標準的な解析は強いパラメトリックモデルに頼り、モデルの誤特定に弱い（抄録、§1）。", "p3": "割り当ての仕組みそのものを推論の根拠とするデザインベースの枠組みで、潜在アウトカムについての仮定ごとに識別と推定の手順を示す（抄録）。解析は、係数の制約と個体の重みつきの最小二乗回帰に統一し、回帰式・重み・制約の指定方法を推奨する（抄録）。", "p4": "補足資料のシミュレーションで偏りと被覆率を確かめ、生理痛に対する鎮痛薬の3期の交差試験（Jones and Kenward）のデータを、処置をA（実薬）とB（偽薬）にまとめたAAB・ABA・BAAの3系列で再解析する（§7）。", "p5": "回帰にもとづく推定量はすべてのシナリオでほぼ不偏で、分散推定は一般に保守的だったが、重みをデータから推定すると小標本でわずかな被覆不足が起きた（§7）。従来のモデルベースの方法は暗黙の仮定が崩れると大きな偏りと被覆不足を示した（§7）。再解析では、二値の痛みの緩和を線形回帰で扱い、3期の即時効果の推定値は0.509〜0.582の範囲だった（表2）。", "p6": "本文で読んだ範囲では、重みを推定すると小標本で被覆不足が起きうることが限界として述べられている（§7）。残る疑問：持ち越し効果の次数を高くすると識別できない場合があり（定理5.1にもとづく§7の説明）、どの仮定を置くかの判断は応用者に委ねられる。", "fun": "同じ人に薬Aと薬Bを順番に試してもらえば、人による体質の違いを打ち消して比べられる。ただし前に飲んだ薬の効果が残る（持ち越し）と話がややこしい。この研究は、複雑な統計モデルを仮定しなくても、くじ引きで順番を決めたという事実だけを頼りに、普通の回帰分析で正しく効果と誤差の幅を出せることを示した。シンプルな道具が実は強い、という点が面白い。", "unverified": "§3〜6の定理の正確な条件、補足資料のシミュレーションの数値、表2の各シナリオの仮定の詳細は確認していない。"}}, {"id": "jn04", "rank": 4, "field": "心理学", "headline": "6つの文化の子どもは仲間を助けるが方法が違う", "title": "Children from six cultures reliably help their peers—but in different ways", "url": "https://doi.org/10.1073/pnas.2515233123", "authors": "Henriette Zeidler ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-02", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "子ども同士の援助行動を6文化で系統的に比較した稀な研究で、援助は普遍的だがその形は文化で異なることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ラテンアメリカ・アフリカ・ヨーロッパの大きく異なる6つの集団で、4〜9歳の子ども同士の自発的な援助を同じ実験課題で比べ、子どもは文化を問わず仲間を確実に助け、その形には小さな文化差があることを示した（抄録）。", "p2": "他者を助けることは人間の社会性の中核だが、子どもの援助行動の系統的な文化間比較は少なく、既存研究は大人と子どもの関係に集中して、多くの文化でより重要な子ども同士の関係にはあまり注目してこなかった（抄録）。", "p3": "同じ年齢の子ども2人を組にした実験課題で、一方が相手に、物を渡すなどの道具的な援助か、情報の提供かのどちらかで手助けできる状況を作り、自発的な援助を観察した（抄録）。", "p4": "ウィチ、ケチュア、アコエ・ハイオム、サンブル、キクユ、ドイツの6集団の4〜9歳児336人を対象に、援助の有無、援助の種類、年齢による変化、文化ごとの違いを比べる（抄録）。", "p5": "どの文化でも、子どもは2種類のどちらかの援助で仲間を確実に助け、情報の提供は年齢とともに増えた（抄録）。すべての集団で仲間への援助には顕著な共通点があり、文化固有のパターンは小さかった（抄録）。援助の割合の数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：1つの実験課題での観察で、日常場面の援助や年上の子・大人との関係でも同じ傾向か、各集団の標本数が比較に十分かは本文で確かめる必要がある。", "fun": "南米の先住民、アフリカの牧畜民、ドイツの子どもたち。暮らしがまったく違っても、4〜9歳の子どもは困っている友だちを自然に助けた。違ったのは「物を渡す」か「やり方を教える」かといった助け方の細かい点だけで、年齢が上がると教える助けが増えた。人を助ける心は人間に共通の土台があり、文化はその上に少し色をつける、という見方が面白い。", "unverified": "本文が読めず、集団ごとの標本数と援助率、統計モデルの詳細は確認していない。"}}, {"id": "jn05", "rank": 5, "field": "統計学", "headline": "空間交絡下で回帰係数は細密な観測で推定できるか", "title": "Infill consistent estimability of the regression slope between Gaussian random fields under spatial confounding", "url": "https://doi.org/10.1214/26-aos2650", "authors": "Abhirup Datta ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "観測されない空間過程による交絡があるときの空間回帰の傾きの推定可能性という基礎問題に答えている。", "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（抄録、序論の冒頭、§9の考察と図4）を読んだ。§2〜8の定理の証明と補足資料は抄録の範囲", "preprint": false, "p1": "観測されない空間的な過程による交絡（空間交絡）があるとき、2つのガウス確率場の間の回帰の傾きが、観測点を細かくしていけば一致的に推定できるのはどんな場合かを、必要条件と十分条件の両方で明らかにし、推定できる場合の推定量も示した（抄録）。", "p2": "空間交絡のもとでの傾きの推定は近年広く議論されてきたが、そもそもいつ一致的に推定可能かという基本的な問いは未解決で、既存の知見は経験的か特定の推定量に依存していた（抄録）。", "p3": "領域を固定して観測点を密にする（infill）漸近論で、曝露と交絡の過程の滑らかさ（局所的な振る舞い）にもとづく十分条件を示し、その場合は適切な次数の差分やラプラシアンをとる局所差分推定量で一致推定できる（抄録）。直観：曝露が交絡より「ざらざら」していれば、細かい差分をとると滑らかな交絡が消え、曝露の変動だけが残る。ペイリー・ウィーナー空間の関数解析で、交絡と曝露のスペクトルの裾の減衰の相対比にもとづく、確かめやすい必要条件を与える（抄録）。", "p4": "理論論文で、評価はマテルン型、べき指数型、一般化コーシー型、共地域化の共分散族で必要条件と十分条件が一致するか、測定誤差・非定常・非ガウス・不規則な観測配置への拡張、数値実験での有限標本の挙動である（抄録）。", "p5": "これらの共分散族では、境界の1点を除いて必要条件と十分条件が一致し、一致推定可能性の鋭い特徴づけが得られた（抄録）。必要条件は、曝露と交絡のスペクトル密度の比の積分が無限大になることである（§9）。副産物として、滑らかさの異なる成分をもつ多変量ガウス確率場の測度の同値性の一般的なスペクトル条件を確立した（抄録）。補足資料の予備的な結果では、共分散をわずかに誤特定したGLS推定量が一致性を失う設定で、差分推定量は一致的だった（§9）。", "p6": "著者は、差分推定量の理論的な効率、不確かさの定量化と推論の方法、他の推定量との網羅的な比較が今後の課題であり、ユークリッド空間以外（多様体上）への拡張も残ると述べる（§9）。", "fun": "大気汚染と健康の関係を地図の上で調べるとき、所得のような見えない要因も場所によって変わるので、関係を見誤りやすい。この研究は、汚染の地図が見えない要因の地図より「細かくざらついて」いれば、隣どうしの差をとることで見えない要因を消し、本当の関係を取り出せることを数学的に示した。逆に、そうでなければどんなに観測を増やしても無理だという線引きもした点が面白い。", "unverified": "§2〜8の定理の正確な仮定と、数値実験の具体的な結果（図4以外）は確認していない。"}}, {"id": "jn06", "rank": 6, "field": "心理学", "headline": "人同士・人とAIの会話研究のための基盤Dyadic", "title": "Dyadic: A Scalable Platform for Research on Human–Human and Human–AI Conversation", "url": "https://doi.org/10.1177/25152459261481065", "authors": "David M. Markowitz", "venue": "Advances in Methods and Practices in Psychological Science", "date": "2026-10-01", "sjr": 6.094, "citescore": 14.8, "citescore_year": "2025", "why": "会話の実験研究を柔軟かつ大規模に行える研究基盤を提供し、人とAIの対話研究を含む社会科学の実験手法を広げる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用（チュートリアル論文）", "preprint": false, "p1": "人同士、人とAIの会話を、文字や音声で研究できるウェブ上の研究基盤「Dyadic」を紹介し、その使い方を解説したチュートリアルで、プログラミングなしで会話実験を組めるようにした（抄録）。", "p2": "会話は社会生活のどこにでもあるが、その相互作用の実証研究は、部品として組み替えにくく研究者の必要に合わせられない道具によって妨げられてきた（抄録）。", "p3": "Dyadicは、複数の会話の様式（文字・音声）、AIによる応答の提案（人同士の会話で一方にAIが返答案を示すなど）、研究者による会話のリアルタイム監視、会話中に回答者へ尺度や自由記述の質問を送る機能などを備える（抄録）。既存の調査や参加者募集の基盤と連携できる（抄録）。", "p4": "チュートリアル論文であり、実証的な比較や評価指標はない。抄録は他の基盤との違いとして上記の機能を挙げる（抄録）。", "p5": "結果として示されるのは道具の機能と使い方の手順で、数値の結果はない（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：データの保存・プライバシーの扱い、大規模な実験での安定性、利用の費用は本文で確かめる必要がある。", "fun": "人と人、人とAIがどんな会話をすると仲良くなるのか、誤解が生まれるのかを調べたくても、実験の仕組みを作るのは大変だった。この論文は、プログラムを書かずに会話実験を組める道具を紹介している。会話の途中で「今の相手をどう感じた？」と質問を差し込めたり、AIがこっそり返事の案を出したりできる。実験の道具が研究の問いを広げる例として面白い。", "unverified": "本文が読めず、各機能の詳細、利用条件、具体的な研究例は確認していない。"}}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "放物型モンジュ・アンペール方程式で後悔なき生成", "title": "No-regret generative modeling via parabolic Monge–Ampère PDE", "url": "https://doi.org/10.1214/26-aos2635", "authors": "Nabarun Deb ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "シンクホーン法の連続極限として現れる偏微分方程式に基づく生成モデルを提案し、理論保証を与えている。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "最適輸送で使われるシンクホーン法の連続極限として現れる放物型モンジュ・アンペール方程式を離散化した生成モデルを作り、後悔なし（no-regret）の解析で、反復が最適な輸送写像（ブレニエ写像）に収束することを理論的に保証した（抄録）。", "p2": "背景：生成モデルは、簡単な分布（ノイズ）を目標の分布へ写す写像を学ぶ問題とみなせるが、その写像の学習が最適な写像に収束するという理論的保証は限られていた。抄録は、対数凹でない目標分布も扱えることを特長に挙げる（抄録）。", "p3": "ブレニエ写像（凸関数の勾配で表される最適輸送写像）の空間で、ミラー勾配降下の一歩をくり返して写像を改良する（抄録）。技術的な貢献として、放物型モンジュ・アンペール方程式に合わせた発展変分不等式を導き、幾何・輸送コスト・後悔を結びつけた（抄録）。", "p4": "理論論文であり、主な評価は収束の保証（さまざまな刻み幅の設定での後悔の上界）である（抄録）。数値実験の有無と内容は抄録になく未確認。", "p5": "反復がさまざまな刻み幅のスケジュールの下で最適なブレニエ写像に収束することを示した（抄録）。枠組みは、敵対的生成ネットワークやスコアベースの拡散モデルの有用な学習技法を取り込め、生成モデルと変分推論への応用の道筋を示したと述べる（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：高次元での計算コスト、離散化の誤差の扱い、実データでの性能が既存の拡散モデルと比べてどうかは本文で確かめる必要がある。", "fun": "砂山を別の形の砂山へ、運ぶ手間が最小になるように動かす問題（最適輸送）は、AIに絵や文章を作らせる生成モデルとも深くつながっている。この研究は、その最小の運び方に少しずつ近づく計算を、熱が広がる式に似た方程式で表し、必ずゴールにたどり着くことを数学的に保証した。生成AIの「なぜうまくいくか」を支える理論として面白い。", "unverified": "本文が読めず、収束速度の具体的な式、数値実験の有無と結果は確認していない。"}}, {"id": "jn08", "rank": 8, "field": "機械学習", "headline": "ニューラルネットのヤコビアンのスペクトル漸近", "title": "Spectral asymptotics of neural network Jacobians: Convergency, universality, and phase transition", "url": "https://doi.org/10.1214/26-aos2654", "authors": "Huiqin Li ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "ネットワークのヤコビアン行列の極限スペクトル分布と揺らぎを示し、相転移などの現象を理論的に明らかにした。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ニューラルネットワークのヤコビアン行列（入力の小さな変化に出力がどう反応するかをまとめた行列）について、固有値分布の極限と、その揺らぎ（二次の変動）を求め、重みの分布によらない普遍性と、活性化関数による相転移を明らかにした（抄録）。", "p2": "背景：ヤコビアンのスペクトルは、信号の伝わり方、勾配の安定性、局所的な感度の診断に使われるが、有限の幅のネットワークでその分布がどうばらつくかは十分に分かっていなかった。抄録は、初期化による不確かさを定量化することを目的に挙げる（抄録）。", "p3": "ランダム行列理論の道具を使い、まず非線形の共分散行列の族を解析し、それをもとにヤコビアンのスペクトルの揺らぎを、重みの初期化、層の幅、活性化関数、深さの関数として特徴づける（抄録）。", "p4": "理論論文であり、評価は極限分布と揺らぎの導出、普遍性と相転移の条件である（抄録）。数値実験の有無は抄録になく未確認。", "p5": "極限のスペクトル分布と二次の揺らぎを確立し、重みの分布に関する普遍性と、活性化関数の選択による相転移を見いだした（抄録）。これにより、ヤコビアンにもとづく安定性診断を有限の幅で較正し、初期化による信号伝播・勾配の安定性・局所感度の不確かさを定量化できるとする（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：結果は初期化時点のランダムな重みについてのもので、学習が進んだ後のネットワークにどこまで当てはまるかは本文で確かめる必要がある。", "fun": "AIの中身は巨大な行列の積み重ねで、入力を少し変えたときの出力の反応（ヤコビアン）が暴れすぎると学習がうまくいかない。この研究は、ランダムに作ったネットワークでその反応の「固有値の分布」が、重みの細かい作り方によらず決まる形になること（普遍性）と、活性化関数を変えると性質ががらりと変わること（相転移）を示した。水が氷になるような急な変化がAIにもあるのが面白い。", "unverified": "本文が読めず、相転移の具体的な条件と、数値実験による確認の有無は確認していない。"}}, {"id": "jn09", "rank": 9, "field": "因果推論", "headline": "事前の妊娠意向と出生アウトカムの関係", "title": "Prospective Pregnancy Preferences and Adverse Birth Outcomes in the United States: A Population-Based Study", "url": "https://doi.org/10.1093/aje/kwag244", "authors": "Brooke W Bullington ほか", "venue": "American Journal of Epidemiology", "date": "2026-10-01", "citescore": 7.1, "citescore_year": "2025", "why": "想起バイアスを避けるため前向きに測った妊娠意向と出生アウトカムの関係を、米国の人口ベースのデータで推定している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Europe PMCの抄録を使用", "preprint": false, "p1": "妊娠前に前向きに測った「妊娠を避けたい気持ち」の強さと、早産・低出生体重の関係を、米国9州の人口ベースの縦断データで推定し、妊娠を強く避けたかった場合に低出生体重が多い傾向を示した（ただし精度は低い）（抄録）。", "p2": "「意図しない」妊娠と出生アウトカムの悪さの関連は報告されてきたが、出産後にさかのぼって意図を尋ねる研究は、結果によって思い出し方が変わる想起バイアスに弱い（抄録）。", "p3": "2016〜2023年の9州の女性調査で、毎年の調査で報告された出産を、妊娠前に14項目の「妊娠回避の希望（DAP）」尺度で測った値と結びつける（抄録）。重みつきロジスティック回帰で、多重代入を主解析、DAPを代入した人を除く完全ケース解析を感度分析とする（抄録）。", "p4": "結果は早産（37週未満）と低出生体重（5.5ポンド未満）で、DAPの高い群（妊娠を強く避けたい）と低い群（妊娠に開かれている）を比べる（抄録）。", "p5": "多重代入の解析では、低出生体重との調整済みの関連は有意でなかった（高DAP群15%対低DAP群7%）が、DAPを連続量にすると有意で（aOR=1.56、1.01〜2.43）、完全ケース解析でも有意だった（20%対6%）（抄録）。早産は多重代入でも連続量でも関連がなかった（18%対14%）が、完全ケース解析では関連が見られた（25%対12%）（抄録）。", "p6": "著者は、関連の大きさは強い回避の希望と低出生体重の関係を示唆するが、精度が低く解析が限られていると認めている（抄録）。残る疑問：解析方法で結論が変わっており、欠測の仕組みや出産数の少なさが結果を左右している可能性がある。観察研究であり因果は示していない。", "fun": "「望まない妊娠だと赤ちゃんの健康に影響する」という話は、たいてい出産後に「あのとき妊娠を望んでいた？」と聞いて調べられてきた。でも、結果を知った後の記憶は変わりやすい。この研究は、妊娠する前に気持ちを聞いておき、その後の出産と結びつけた。分析の仕方で結論が揺れることも正直に示しており、データの取り方の大切さが分かる。", "unverified": "本文が読めず、出産の件数、調整した変数、欠測の割合は確認していない。"}}, {"id": "jn10", "rank": 10, "field": "生態学", "headline": "深層学習で花粉化石から2.5万年の草原の変化を復元", "title": "Deep learning of fossil pollen morphology reveals 25,000 y of ecological change in eastern African grasslands", "url": "https://doi.org/10.1073/pnas.2607372123", "authors": "Marc-Élie Adaimé ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-02", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "従来の顕微鏡では見分けられないイネ科の花粉を超解像顕微鏡と深層学習で識別し、東アフリカの草原の長期変化を復元した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "従来の光学顕微鏡では種を見分けられないイネ科の花粉を、超解像顕微鏡画像と半教師ありの深層学習で特徴づけ、ケニア山の湖底堆積物25,000年分から草原の種の多様性とC4植物の割合の変化を復元した（抄録）。", "p2": "イネ科の花粉はほとんどの種で形が似ており、草原の進化の研究では見過ごされてきた（抄録）。背景：C3植物とC4植物は光合成の仕組みが異なり、その割合は気温・CO2・火事などの環境を反映する。", "p3": "既知の現生花粉とラベルのない化石花粉の超解像画像で畳み込みニューラルネット（CNN）を半教師ありで学習させ、学習した特徴量から、シャノンのエントロピーで形態の多様性を、勾配ブースティング決定木でC3/C4の光合成型を推定する（抄録）。", "p4": "まず現生の花粉群集で方法を検証し、次にケニア山の25,000年の湖底堆積物の化石群集に適用して、大気CO2濃度や地域の気温・降水・火事の代理記録と対応させる（抄録）。", "p5": "この山地草原の種の多様性は21,500年前から16,000年前にかけて大きく減り、最終氷期の最も厳しい地域的な寒冷化と一致した（抄録）。C4のイネ科の割合は晩氷期から完新世への移行後に徐々に減り、気温の上昇と火事の減少と関連した（抄録）。精度などの数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：形態の多様性（エントロピー）が種の多様性をどこまで正確に表すか、現生の参照標本がアフリカの山地の種をどれだけ網羅しているかは本文で確かめる必要がある。", "fun": "花粉は湖の底に何万年も積もり、昔の植物の記録になる。ところがイネ科の花粉は種類ごとの見分けがほとんどつかず、研究に使われてこなかった。この研究は、超解像顕微鏡の写真をAIに見せて、人には分からない形の違いを数値にした。その結果、氷河期の一番寒い時期に草原の種類が大きく減っていたことが分かった。AIが過去の生態系を読む「新しい目」になった点が面白い。", "unverified": "本文が読めず、分類の精度、検証に使った現生標本の数、年代の精度は確認していない。"}}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "伝統的メディケアに自己負担上限を設けた場合の財政効果", "title": "Financial Effects of an Out-of-Pocket Cap in Traditional Medicare", "url": "https://doi.org/10.1001/jamahealthforum.2026.3386", "authors": "Andrew M. Ryan ほか", "venue": "JAMA Health Forum", "date": "2026-10-02", "sjr": 2.833, "citescore": 7.9, "citescore_year": "2025", "why": "自己負担上限のない伝統的メディケアに上限を導入した場合の受給者と財政への影響を推計しており、医療保険制度改革の議論に直結する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "自己負担に上限がない米国の伝統的メディケア（TM）に、年3,000・5,000・10,000ドルの上限を設けた場合の、受給者の負担、加入先の移動、メディケアの支出への影響を2026〜2034年についてミクロシミュレーションで推計した（抄録）。", "p2": "伝統的メディケアは、民間のメディケア・アドバンテージ（MA）と違って医療費の自己負担に上限がなく、受給者に大きな財務リスクを負わせている（抄録）。上限の導入が提案されているが、財政と行動への影響は不確かだった（抄録）。", "p3": "2020〜2024年の公開の全国データをもとに、上限なしの基準と3つの上限のシナリオで加入・支出・利用を予測し、弾力性にもとづく行動反応（TMとMAの間の移動、サービス利用の変化、MAの基準額と支出の増加）を組み込む（抄録）。仮定を確率的に変える感度分析も行う（抄録）。", "p4": "主な結果指標は、加入の種類ごとの人数の変化、受給者の年間の自己負担と保険料の平均、メディケアの年間支出である（抄録）。", "p5": "3,000ドルの上限で受給者の年間支出は平均1,568ドル減り、5,000ドルでは1,138ドル、10,000ドルでは707ドル減ると予測された（抄録）。対応するメディケアの年間支出の増加は、それぞれ$96 billion（90%区間$80〜$114 billion）、$70 billion（$55〜$85 billion）、$39 billion（$29〜$50 billion）だった（抄録）。上限、とくに低い上限は、受給者をMAからTMへ大きく移すと予測された（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：結果は弾力性などの行動の仮定に依存するシミュレーションで、補足保険（Medigap）の扱いや医療提供者側の反応がどう組み込まれているかは本文で確かめる必要がある。", "fun": "米国の高齢者向けの公的医療保険には、医療費の自己負担に上限がない仕組みがある。上限を作れば病気の人は安心だが、国の支出は増え、民間の保険から公的な保険へ人が移るかもしれない。この研究は、人の行動の変化まで計算に入れて、その損得をシミュレーションした。助かる人の安心と国の財布の重さを天秤にかける、政策の難しさが数字で見える。", "unverified": "本文が読めず、弾力性の値の出典、加入者の移動の規模の数値は確認していない。"}}, {"id": "jn12", "rank": 12, "field": "統計学", "headline": "2次元ナビエ・ストークス方程式のデータ同化の事後分布", "title": "Data assimilation with the 2D Navier–Stokes equations: Optimal Gaussian asymptotics for the posterior measure", "url": "https://doi.org/10.1214/26-aos2645", "authors": "Dimitri Konen ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "流体方程式の初期値にガウス過程事前分布を置いたデータ同化で、事後分布の関数版ベルンシュタイン・フォンミーゼス定理を証明した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "2次元ナビエ・ストークス方程式（流体の運動方程式）の初期状態にガウス過程の事前分布を置くデータ同化で、事後分布がガウス分布で近似できるという関数版のベルンシュタイン・フォンミーゼス定理を証明し、将来の状態の予測が1/√Nの速さで一致的に推定できることを示した（抄録）。", "p2": "背景：気象予報などのデータ同化では、離散的な観測から非線形な力学系の状態を推定し、その不確かさをベイズの事後分布で表すが、非線形・無限次元の場合にベイズの信用区間が頻度論的にも正しい被覆をもつかは理論的に難しい問題である。", "p3": "決定論的な力学の離散的な観測から得られる、全軌道の空間での事後分布を、ガウスの初期条件をもつ線形の放物型偏微分方程式の解として得られるガウス確率ベクトル場で近似する（抄録）。近似は回帰関数の上限ノルムという強い意味で成り立つ（抄録）。", "p4": "理論論文であり、評価は近似の成立条件と収束の速さ、信用帯の被覆、局所漸近ミニマックスの下界である（抄録）。", "p5": "よく使われるノンパラメトリックなモデルでも、ナビエ・ストークス系の将来の状態の予測は1/√Nの一致推定量を許すことを示した（抄録）。非線形系の状態推定の下界を与える局所漸近ミニマックス定理を導き、ベイズのデータ同化アルゴリズムがその下界を達成することを示した（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：2次元・決定論的な力学の場合の結果で、3次元の流体や確率的な外力を含む系、計算上の近似（有限の基底など）を使った実装でどこまで成り立つかは本文で確かめる必要がある。", "fun": "天気予報は、少ない観測から大気の状態を推定し、その不確かさも見積もる「データ同化」に支えられている。この研究は、流体の方程式を使うデータ同化で、ベイズ統計の答えの不確かさの幅が、観測が増えると正しい幅に近づくことを数学的に証明した。複雑な流れの予測でも、統計の理論がきちんと保証を与えられることを示した点が面白い。", "unverified": "本文が読めず、定理の正確な仮定（観測のノイズ、事前分布の滑らかさ）は確認していない。"}}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "研修医の労組化はwell-beingを改善しなかった", "title": "Well-being, Learning Environment, and Mistreatment Among Unionized Versus Nonunionized Surgery Residents During the COVID-19 Pandemic", "url": "https://doi.org/10.1097/sla.0000000000007226", "authors": "Alexa J. Hughes ほか", "venue": "Annals of Surgery", "date": "2026-10-02", "sjr": 2.516, "citescore": 14.7, "citescore_year": "2025", "why": "コロナ禍の外科研修医で、組合の有無とwell-being・学習環境・不当な扱いの関係を検証している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "米国の一般外科研修医の全国調査を差の差法で分析し、コロナ禍の間、労働組合のある研修プログラムでもwell-being・学習環境・不当な扱いは改善せず、プログラムの対応のよさが一時的に改善しただけだったことを示した（抄録）。", "p2": "コロナ禍の後、well-beingと労働条件への懸念から研修医の労働組合化が進んだが、組合化が研修医の結果に与える影響の証拠は限られていた（抄録）。", "p3": "米国外科専門医機構の研修中試験の後に実施される全国調査（2020〜2023年）で、パンデミック前（2020年1月）と最中（2021年1月）の回答を、組合のあるプログラムとないプログラムで比べる差の差法（DiD）を用いる（抄録）。2022〜2023年のデータは感度分析に使う（抄録）。", "p4": "対象は310プログラム（対象の94.5%）で、うち30（9.7%）に組合があり、13,539件の回答を分析した（回答率は2020年85.5%、2021年81.2%）（抄録）。結果は、燃え尽き、離職の考え、自殺念慮、勤務時間違反、保護された教育時間、プログラムの対応のよさ、不当な扱いである（抄録）。", "p5": "組合化は、燃え尽き（DiD P=0.06）、離職の考え（P=0.83）、自殺念慮（P=0.25）の変化と有意に関連しなかった（抄録）。勤務時間違反（P=0.56）と教育時間（P=0.51）にも差はなく、2023年までには組合のないプログラムのほうが改善が大きかった（P=0.003、P<0.001）（抄録）。組合のあるプログラムは研修医の懸念への対応が初期に一時的に改善した（P=0.04）が、2023年には持続しなかった（P=0.53）（抄録）。", "p6": "著者は、組合化だけでは制度的なストレスの時期に研修医のwell-beingを守るには不十分かもしれないと結論づけている（抄録）。残る疑問：組合のあるプログラムは30と少なく地域や規模に偏りがあるとみられ、組合化の時期の違いや、組合化を選ぶプログラムの特性による偏りをどう扱ったかは本文で確かめる必要がある。", "fun": "働きすぎや燃え尽きに悩む若手外科医が労働組合を作る動きが広がったが、それで状況は良くなったのか。全国13,539件の回答を、組合のある所とない所の「変化の差」で比べると、燃え尽きなどはほとんど変わらず、むしろ組合のない所のほうが勤務時間の改善が進んでいた。良さそうな仕組みも効果をデータで確かめることが大事だと分かる。", "unverified": "本文が読めず、効果の大きさ（推定値と信頼区間）、組合化の時期、プログラムの特性の調整は確認していない。"}}, {"id": "jn14", "rank": 14, "field": "統計学", "headline": "高次元の経験リスクの局所最小値の一般定理", "title": "Local minima of the empirical risk in high dimension: General theorems and convex examples", "url": "https://doi.org/10.1214/26-aos2652", "authors": "Kiana Asgari ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "高次元の経験リスク最小化で局所最小値の性質を一般的に記述する定理を示し、凸の例で具体化している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarの抄録を使用", "preprint": false, "p1": "高次元の経験リスク最小化で、データの次元dと標本数nが同じ割合で大きくなるとき、局所最小値の個数の期待値の上界をKac–Rice公式で求め、最小値の位置と推定・予測誤差の鋭い漸近を導く一般的な方法を示した（抄録）。", "p2": "背景：多項回帰などの一般化線形モデルや2層ニューラルネットの学習では、損失関数の局所最小値がどこにどれだけあるかが推定の性能を左右するが、n≍dの高次元でそれを一般的に扱う道具は限られていた。", "p3": "データをd次元のガウスベクトル、パラメータをd×kの行列Θとし、損失がΘᵀxという射影を通じてデータに依存する一般のモデルを考える（抄録）。ガウス過程論のKac–Rice公式（ランダムな関数の臨界点の数を数える公式）で局所最小値の個数の期待値を抑え、マルコフ不等式で最小値の位置を指数的な確率の評価つきで決める（抄録）。", "p4": "理論論文であり、評価は凸な損失への適用、予想されていた結果の証明、最小値でのヘッセ行列のスペクトルの特徴づけである（抄録）。", "p5": "方法がタイト（鋭い）で、それまで予想にとどまっていた結果を証明できることを示した（抄録）。最小値でのヘッセ行列のスペクトルも特徴づけた（抄録）。非凸の例への適用は姉妹論文で扱う（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：データがガウス分布に従うという仮定がどこまで緩められるか、非凸の場合の結果（姉妹論文）がどの程度一般的かは本文で確かめる必要がある。", "fun": "AIの学習は、でこぼこの地形で一番低い谷を探すような作業だ。谷（局所最小値）がたくさんあると、浅い谷にはまってしまう。この研究は、データの次元とデータ数がともに大きいとき、谷がいくつあるかを数える公式を使って、どこに谷があり、そこでの予測がどれくらい正確かを鋭く求めた。地形を「数える」ことで学習の性能が分かるという発想が面白い。", "unverified": "本文が読めず、証明した予想の具体的な内容と、適用した凸損失の例は確認していない。"}}, {"id": "jn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "エリート組織で人種が資本の転換を条件づける", "title": "Racialised Conditional Capital Conversion: Race, Class and the Limits of Recognition in Elite Organisations", "url": "https://doi.org/10.1111/1468-4446.70177", "authors": "Christine Han ほか", "venue": "British Journal of Sociology", "date": "2026-10-02", "sjr": 1.365, "citescore": 5.2, "citescore_year": "2025", "why": "オーストラリアの中国系専門職50人への面接で、昇進しても人種的不平等が組織の中で続く仕組みを明らかにした。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "オーストラリアの4大会計事務所で働く中国系専門職50人への面接から、人種が経済・文化・社会的な資本の認められ方と転換を条件づけ、昇進はできても不平等が組織内で続く仕組み（人種化された条件付き資本転換）を5つのメカニズムとして示した（抄録）。", "p2": "人種的少数者の専門職がキャリアを伸ばしながら、組織の中で人種的な不平等がどう続くのかは十分に説明されていなかった（抄録）。背景：ブルデューの資本論では、学歴や人脈などの資本が地位や報酬に「転換」されると考える。", "p3": "白人が多数派の組織で働く中国系専門職50人への詳細な面接を、ブルデューの資本の枠組みで分析し、資本の認められ方と転換の過程を理論化する（抄録）。", "p4": "質的研究であり、数量的な評価はない。分析はミクロ・メゾ・マクロの各水準のメカニズムの抽出で行う（抄録）。", "p5": "参加者は入職・移動・戦略的行動を可能にする豊かな資源をもっていたが、その資源は同等の条件では転換されず、退けられたり、割り引かれたり、限られた範囲に閉じ込められたりした（抄録）。人種化は資本の転換や昇進を完全に妨げるとは限らず、資本が認められ評価される速さ・経路・限界を形づくるとした（抄録）。5つのメカニズムの具体的な中身は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：一つの国・一つの業界・一つの民族集団の質的研究で、他の集団や業界への一般化は未検証。比較対象（白人の同僚）の経験との対照がどう扱われたかは本文で確かめる必要がある。", "fun": "学歴も能力も十分あり、実際に昇進もしている。それでも「同じ努力をしても、同じようには評価されない」と感じる人たちがいる。この研究は、大手会計事務所で働く中国系の専門職50人の話から、能力やつながりという「資本」が、人種によって割り引かれたり、使える場面を限られたりする仕組みを描いた。差別が「入口で閉め出す」形ではなく「換金レートを下げる」形で続く、という見方が面白い。", "unverified": "本文が読めず、5つのメカニズムの具体的な内容と面接の引用は確認していない。"}}, {"id": "jn16", "rank": 16, "field": "交通・都市計画", "headline": "ボストンの地下鉄延伸が経済活力と社会的結束に与えた影響", "title": "Impacts of subway line extension on economic vitality and social cohesion: Evidence from Boston’s Green Line Extension through a double machine learning DID approach", "url": "https://doi.org/10.1016/j.tra.2026.105286", "authors": "Xinyi Huang ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-01", "citescore": 12.1, "citescore_year": "2025", "why": "二重機械学習による差の差法で地下鉄延伸の効果を推定しており、交通投資の評価手法として注目される（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、ボストンの地下鉄グリーンライン延伸が、沿線の経済活力と社会的結束に与えた影響を、二重機械学習による差の差法で推定した研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「新しい駅ができると、その町の商売や人のつながりは本当に変わるのか」だ。駅ができた地区とできなかった地区を、機械学習で条件をそろえて比べる、という因果推論の新しい道具の使い方が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "因果推論", "headline": "路外駐車場の有無が電気自動車の普及を左右する因果", "title": "The causal relation between off-street parking and electric vehicle adoption in Scotland", "url": "https://doi.org/10.1016/j.tra.2026.105294", "authors": "Bernardino D’Amico ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-09-30", "citescore": 12.1, "citescore_year": "2025", "why": "スコットランドで自宅の路外駐車と電気自動車の採用の因果関係を推定しており、充電インフラ政策に関わる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "スコットランドの全国代表の世帯データで、自宅に路外駐車場があることが電気自動車の保有確率を3.3%から5.6%へ高める因果効果（+2.3ポイント、相対70%増）をもつことを、確率的グラフィカルモデルで推定した（抄録）。", "p3": "駐車場の有無と所得の、電気自動車の採用への因果効果を、確率的グラフィカルモデルで識別した（抄録）。ブートストラップで区間を示した（抄録）。", "p5": "推定効果は+2.3ポイントで、1〜99百分位のブートストラップ区間は+0.26〜+4.77ポイント、基本ブートストラップ区間は−0.17〜+4.34ポイントだった（抄録）。効果は主に、採用する世帯の割合を高めることで働いた（抄録）。", "fun": "電気自動車は家で充電できると便利だ。でも、自宅に駐車場がある家は裕福なことも多いので、「駐車場があるから買う」のか「お金があるから買う」のかを分ける必要がある。この研究は、その区別をしたうえで、駐車場があると保有の確率が約7割増えると推定した。ただ区間によってはゼロを含むので、慎重に読む必要がある点も興味深い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn18", "rank": 18, "field": "交通・都市計画", "headline": "駐車料金の導入はどんな信頼と正統性で受け入れられるか", "title": "Who accepts parking pricing? trust and legitimacy in a contentious policy change", "url": "https://doi.org/10.1016/j.tra.2026.105289", "authors": "Matthew J. Beck", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-09-29", "citescore": 12.1, "citescore_year": "2025", "why": "対立の多い政策変更である駐車料金の受容を信頼と正統性から分析している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "観光に依存するオーストラリアのブルーマウンテンズで、有料の訪問者駐車場の導入という論争的な政策変更を事例に、住民の受容を決めるのは属性よりも信頼と正統性の解釈であることを示した（抄録）。", "p3": "有料化の導入を自然実験とみなし、調査データ、因子分析、クラスタリング、質的な主題分析を組み合わせた混合研究法で、態度と解釈のパターンを特定した（抄録）。", "p5": "受容は主に人口学的な属性で決まるのではないと述べる（抄録）。受容を左右した要因の詳細は入手した抄録が途中で切れており未確認。", "fun": "観光地の駐車場を有料にすると、渋滞が減り、道路の修理費も集められる。それでも住民が反発することがある。この研究は、賛成か反対かを分けるのは年齢や収入ではなく、役所を信頼しているか、そのお金の使い道が正当だと思えるかだと示した。政策の中身より「誰がどう決めたか」が受け入れられ方を左右する点が面白い。", "unverified": "抄録が途中で切れており、受容を左右した信頼と正統性の要因の詳細は確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "交通・都市計画", "headline": "街路画像と離散選択モデルで自転車の経路選択を理解", "title": "Understanding cycling route choice behaviour through street-level images and discrete choice models", "url": "https://doi.org/10.1016/j.tra.2026.105274", "authors": "Roosmarijn Terra ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-09-29", "citescore": 12.1, "citescore_year": "2025", "why": "街路の画像から得た環境の特徴を離散選択モデルに組み込み、自転車の経路選択を説明している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "6千枚を超える実際の街路の画像を使った経路選択の表明選好実験で、自転車利用者が車線の種類・舗装・車線の色・緑・水辺・建物などの環境をどう好むかを、GIS属性の離散選択モデルと画像を取り込んだモデルで分析した（抄録）。", "p3": "回答者が自転車の環境・所要時間・信号の数の異なる経路を、表の数字ではなく実際の街路画像で比べる実験を行い、従来の離散選択モデルと、コンピュータビジョンで画像を取り込んだモデルの2つで分析した（抄録）。", "p5": "結果の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "自転車で通る道を選ぶとき、人は「何分かかるか」だけでなく、緑が多いか、車線が色分けされているか、といった景色も気にする。この研究は、文字の説明ではなく本物の街の写真を見せて道を選んでもらい、AIで写真の特徴を読み取って好みを分析した。景色の好みを数字にする工夫が面白い。", "unverified": "抄録が途中で切れており、どの環境要素がどれだけ好まれたかは確認できなかった。"}}, {"id": "jn20", "rank": 20, "field": "交通・都市計画", "headline": "移動そのものを目的とする人と居住環境の特徴", "title": "Who travels for travel’s sake? Profiling undirected travelers and their built environments", "url": "https://doi.org/10.1016/j.tra.2026.105284", "authors": "Hannah Hook ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-09-29", "citescore": 12.1, "citescore_year": "2025", "why": "目的地のない移動をする人の特徴と建造環境を分析している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "2023年のオランダ全国交通調査（53,049人）で、移動そのものを目的とする「目的のない移動」の参加・頻度・交通手段が、建造環境・社会経済属性・曜日・目的のある移動でどう決まるかを分析した（抄録）。", "p3": "フルタイム、パートタイム、学生、退職者の4つの社会参加の群で多群経路分析を行った（抄録）。", "p5": "群によって経路は大きく異なり、目的のある移動のリズムが目的のない移動の機会を強く規定した（抄録）。目的のある移動の頻度が高いと目的のない移動の参加は減り（移動時間の予算の効果）、目的のある移動での持続可能な手段の利用は目的のない移動でも持続可能な手段を予測した（抄録）。", "fun": "散歩やドライブのように、どこかへ行くためではなく移動そのものを楽しむ外出は、心と体の健康に役立つのに、交通の研究ではほとんど扱われてこなかった。オランダの53,049人のデータでは、通勤などで忙しく移動している人ほど、こうした外出が少なかった。移動にも「1日に使える時間の予算」がある、という見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn21", "rank": 21, "field": "開発経済学", "headline": "家畜の所有は東アフリカの子どもの栄養を改善するか", "title": "Livestock ownership and child nutrition: Empirical evidence from East Africa", "url": "https://doi.org/10.1016/j.worlddev.2026.107572", "authors": "Astewale Bimr Melaku ほか", "venue": "World Development", "date": "2026-10-01", "sjr": 2.027, "citescore": 9.3, "citescore_year": "2025", "why": "家畜の所有と子どもの栄養の関係を東アフリカのデータで実証している（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、東アフリカで家畜の所有が子どもの栄養状態と関連するかを実証的に調べた研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「牛やヤギを飼っている家の子どもは、栄養状態が良いのか」だ。家畜は牛乳などの食べ物にもなり、売ればお金にもなる。家族の財産が子どもの体の成長につながるかを問う点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "開発経済学", "headline": "所得格差が公共投資のCO2削減効果を妨げる", "title": "Income inequality as a barrier to the CO2-reducing potential of public investment: evidence from Latin America", "url": "https://doi.org/10.1016/j.worlddev.2026.107583", "authors": "Tainari Taioka ほか", "venue": "World Development", "date": "2026-10-02", "sjr": 2.027, "citescore": 9.3, "citescore_year": "2025", "why": "ラテンアメリカで所得格差が公共投資の排出削減効果を弱めることを示している（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、ラテンアメリカで所得格差が公共投資のCO2削減の効果を妨げることを示した研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「同じように公共投資をしても、貧富の差が大きい国では二酸化炭素が減りにくいのはなぜか」だ。環境対策の効果が社会の格差に左右されるかもしれない、という結びつけ方が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "開発経済学", "headline": "栄養補助で麻疹ワクチンの接種率は上がるか", "title": "Small quantity lipid-based nutritional supplementation and measles vaccination coverage in children aged 6−23 months: a pragmatic cluster-randomized trial", "url": "https://doi.org/10.1038/s41591-026-04675-1", "authors": "Cécile Cazes ほか", "venue": "Nature Medicine", "date": "2026-10-02", "sjr": 17.496, "citescore": 73.9, "citescore_year": "2025", "why": "6〜23か月児への栄養補助が麻疹ワクチンの接種率を高めるかを実地のクラスター無作為化試験で検証している（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、6〜23か月児への少量の脂質ベースの栄養補助が麻疹ワクチンの接種率を高めるかを、実践的なクラスター無作為化試験で検証した研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「栄養補助食品を配ることが、ついでに子どもの予防接種の受診も増やすのか」だ。配布の機会に親子が保健の窓口に来ることで、別の健康サービスにもつながる、という波及の可能性を村ごとのくじ引きで確かめる点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "因果推論", "headline": "適応的介入で因果的な変化点を最速で検出", "title": "Quickest Causal Change Point Detection by Adaptive Intervention", "url": "https://doi.org/10.1109/tpami.2026.3740105", "authors": "Haijie Xu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-02", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "介入を適応的に選んで因果構造の変化点を最も早く検出する方法を扱っている。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "線形の因果モデルで、介入を考慮して変化点を最も速く検出するアルゴリズムを提案し、方法の一次の最適性を理論的に示した（抄録）。", "p3": "特別な中心化の技法でノード間の因果的な伝播による変化を1次元に集約し、カルバック・ライブラー情報量にもとづいて介入するノードを選んで変化を増幅し、探索と活用の釣り合いをとる適応的な介入方針をもつ2つの監視法を作った（抄録）。", "p5": "提案法の一次の最適性を理論的に示し、シミュレーションデータと2つの実データの事例で性質を確かめた（抄録）。数値は抄録になく未確認。", "fun": "工場の機械やネットワークの「異常の始まり」をできるだけ早く見つけたい。この研究は、ただ見張るだけでなく、わざとある部分をつついて（介入して）反応を見ることで、異常をより早く浮かび上がらせる方法を作った。お医者さんが聴診するだけでなく、ひざを軽くたたいて反射を確かめるのに似た発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn25", "rank": 25, "field": "経済学", "headline": "気候規制リスクと社債", "title": "Climate regulatory risks and corporate bonds", "url": "https://doi.org/10.1016/j.jfineco.2026.104363", "authors": "Lee Seltzer ほか", "venue": "Journal of Financial Economics", "date": "2026-10-02", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "気候規制のリスクが社債の価格にどう反映されるかを扱う、金融経済学のトップ誌の論文。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "企業の環境面の成績と州の環境規制の厳しさが社債の格付けと利回りスプレッドに影響し、パリ協定を気候規制の予想へのショックとして、気候規制リスクと社債の格付け・スプレッドの因果関係を示した（抄録）。", "p3": "企業の環境の成績と立地する州の規制の条件を使い、パリ協定の前後で、環境面に問題のある企業の社債の格付けとスプレッドの変化を調べた（抄録）。", "p5": "環境面の成績が悪い企業は、とくに規制の厳しい州にある場合、格付けが低く利回りスプレッドが高かった（抄録）。パリ協定のショックの後、環境面に問題のある社債で気候規制リスクと格付け・スプレッドの因果的な関係が示された（抄録）。数値は抄録になく未確認。", "fun": "会社が環境に悪い事業をしていると、将来の規制で罰金や設備の入れ替えが必要になるかもしれない。お金を貸す側はそれを見越して、利子を高く求めるのか。パリ協定で「規制が厳しくなりそうだ」と皆が思った瞬間を使うと、環境に問題のある会社の借金のコストが上がっていた。環境リスクがお金の値段に変わる様子が見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn26", "rank": 26, "field": "統計学", "headline": "データ拡張のガウス・非ガウス普遍性", "title": "Gaussian and non-Gaussian universality of data augmentation", "url": "https://doi.org/10.1214/26-aos2642", "authors": "Kevin Han Huang ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "データ拡張が推定量の分散と極限分布に与える影響を単純な代替モデルで定量化する普遍性の結果を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "データ拡張が推定量の分散と極限分布に与える影響を単純な代替モデルで定量化する普遍性の結果を示し、データ拡張がかえって推定の不確かさを増やしうることなど予想外の結果を導いた（抄録）。", "p3": "ガウス・非ガウスの普遍性の結果を導き、いくつかの具体的なモデルを詳しく解析した（抄録）。", "p5": "データ拡張は経験的な予測リスクなどの不確かさを減らすどころか増やすことがあり、正則化として働くが高次元の一部の問題では働かず、二重降下のピークをずらしうることを示した（抄録）。データ拡張の性質は、データの分布、推定量の性質、標本数・拡張の数・次元の組み合わせに依存すると結論した（抄録）。", "fun": "画像を少し回転させたり明るさを変えたりしてデータを水増しする「データ拡張」は、AIを強くする定番の技だ。ところが数学的に調べると、場合によってはかえって答えのぶれを大きくすることが分かった。「よく効く」と信じられている技も、条件次第で裏目に出る、という発見が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn27", "rank": 27, "field": "統計学", "headline": "グラフィカルモデルの分布推定でのワッサースタイン速度", "title": "Fast Wasserstein rates for estimating probability distributions of probabilistic graphical models", "url": "https://doi.org/10.1214/26-aos2659", "authors": "Daniel Bartl ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "データ生成過程の構造の知識を使い、高次元分布のワッサースタイン距離での推定の次元の呪いを緩和する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "有向非巡回グラフで表される確率的グラフィカルモデルの分布を推定するとき、構造の知識が遷移核の滑らかさとして定量化できれば、ワッサースタイン距離での推定の次元の呪いを緩和でき、その速さがグラフの局所構造で決まることを示した（抄録）。", "p3": "グラフに対応する分解の遷移核に滑らかさの条件を課して、推定の収束速度を導いた（抄録）。", "p5": "推定の速さは、各ノードとその親ノードを合わせた次元というグラフの局所構造で決まることを証明した（抄録）。正確な速さは仮定する滑らかさの種類に依存する（抄録）。", "fun": "たくさんの変数の同時の分布を、データから丸ごと推定するのは、次元が増えると絶望的に難しくなる（次元の呪い）。でも「この変数はあの変数だけから影響を受ける」という因果の地図があれば、問題を小さな部品に分けられる。この研究は、地図が役に立つための条件と、どれだけ速く推定できるかを示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn28", "rank": 28, "field": "統計学", "headline": "弱い信号のもとでの集団ネットワーク推論", "title": "SIMPLE-RC: Group network inference with NonSharp nulls and weak signals", "url": "https://doi.org/10.1214/26-aos2655", "authors": "Jianqing Fan ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "大規模ネットワークの推論で、鋭くない帰無仮説と弱い信号を扱う方法を提案している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "大規模ネットワークで、指定したノードのグループが「同一ではないが似た」所属プロファイルをもつという鋭くない複合帰無仮説を、弱い信号のもとで検定する方法（SIMPLE-RC）を提案した（抄録）。", "p3": "2つのノードが同じ所属プロファイルをもつという鋭い帰無仮説を検定するSIMPLEの枠組みを、ランダムな結合で拡張した（抄録）。", "p5": "検定の理論的性質と性能の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "SNSや生物のネットワークで、ある人たちが「同じ仲間グループに属しているか」を統計的に確かめたい。ただ現実には、まったく同じではなく「だいたい似ている」かどうかを問いたいことが多く、手がかりも弱い。この研究は、そのあいまいな問いに答えられる検定を作った点が面白い。", "unverified": "抄録が途中で切れており、検定の理論的保証と適用例の結果は確認できなかった。"}}, {"id": "jn29", "rank": 29, "field": "統計学", "headline": "分数ブラウン運動で駆動されるSDEの定常密度推定", "title": "Fast convergence rates for estimating the stationary density in SDEs driven by a fractional Brownian motion with semicontractive drift", "url": "https://doi.org/10.1214/26-aos2637", "authors": "Chiara Amorino ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "分数確率微分方程式の不変密度を、従来より速い収束率で推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "分数ブラウン運動で駆動される加法的な確率微分方程式の不変密度を、連続観測で従来より速い収束率で推定するカーネル推定量を作り、離散観測にも拡張した（抄録）。", "p3": "マルチンゲール分解と、分数SDEの平衡への全変動距離での（条件付き）収束の新しい評価を組み合わせ、H<1/2では周辺密度の評価で速さを改善した（抄録）。濃度不等式とデータ駆動の帯域幅選択も示した（抄録）。", "p5": "離散観測でも同じ収束率を達成でき、分数オルンシュタイン・ウーレンベック過程の数値実験で推定量を示した（抄録）。数値は抄録になく未確認。", "fun": "ふつうのランダムな揺れは過去を忘れるが、「分数ブラウン運動」の揺れは過去の動きの記憶を引きずる。川の水位や株価にはそんな性質があるともいわれる。この研究は、そうした記憶のある揺れが長い目で見てどんな分布に落ち着くかを、データからより速く正確に推定する方法を作った点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn30", "rank": 30, "field": "統計学", "headline": "最近傍グラフによる2標本検定の検出力", "title": "Power properties of the two sample test based on the nearest neighbors graph", "url": "https://doi.org/10.1214/26-aos2657", "authors": "Rahul Raphael Kanekar", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "多変量分布の同一性の検定で、最近傍グラフに基づく検定の検出力の理論を整えた。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "2つの多変量分布が等しいかを、近い点どうしを結んだK近傍グラフで検定する方法について、Kが標本数とともに増える場合の検出力の理論を与え、両側版の検定を提案した（抄録）。", "p3": "Penrose–Yukichの安定化グラフの枠組みに入らない、Kが増えるK近傍グラフを扱い、パラメータ化した分布族で検出の閾値を導いた（抄録）。", "p5": "kN=o(N^{1/4})のときの検出の閾値を与え、片側検定の指数の隔たりを解消する両側版を提案し、近傍の数を増やすと検出力が上がることも示した（抄録）。", "fun": "2つのグループのデータが同じ分布から来たかを調べるのに、全部の点を混ぜて「近くの点が同じグループか」を数える方法がある。違う分布なら、近所は同じグループの仲間ばかりになるはずだ。この研究は、何人の近所を見ればよいか、それで違いをどれだけ見抜けるかを理論的に示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn31", "rank": 31, "field": "統計学", "headline": "予測的全域木によるベイズ空間領域分割の一致性", "title": "Consistent Bayesian spatial domain partitioning using predictive spanning tree methods", "url": "https://doi.org/10.1214/26-aos2651", "authors": "Kun Huang ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "空間的な近さを考慮したベイズ空間クラスタリングの一致性を示している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "空間の領域を互いに接したブロックに分け、全域木を切ることで連続した部分領域に分割するベイズ空間分割モデル（Spat-RPM）を提案し、空間的にまとまった回帰に適用して事後分布のクラスタリングの一致性を示した（抄録）。", "p3": "全域木にもとづくベイズ空間クラスタリングを、有限の空間単位ではなく空間領域全体の分割に拡張し、観測点を密にするinfill漸近論で一致性を調べた（抄録）。", "p5": "一致性の結果の詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "地図を似た性質の地域ごとに区切るとき、区切りは飛び地にならず、つながっているほうが自然だ。この研究は、地図の上に枝分かれした木を張り、その枝を切ることでつながった地域に分ける方法をベイズ統計で作り、データが増えれば正しい区切りにたどり着くことを示した。木を切って地図を分けるという発想が面白い。", "unverified": "抄録が途中で切れており、一致性の定理の内容と応用例の結果は確認できなかった。"}}, {"id": "jn32", "rank": 32, "field": "統計学", "headline": "異質性を調整した分散精度行列の統合推定", "title": "Optimal integrative estimation for distributed precision matrices with heterogeneity adjustment", "url": "https://doi.org/10.1214/26-aos2620", "authors": "Yinrui Sun ほか", "venue": "The Annals of Statistics", "date": "2026-10-02", "sjr": 3.697, "citescore": 8.3, "citescore_year": "2025", "why": "プライバシーや通信の制約がある複数データの統合で、分布の異質性を調整した最適な推定を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "プライバシーや通信の制約のある複数の分散したデータで、分布の異質性を調整しながら精度行列（変数間の条件付き依存を表す行列）を統合推定する方法（HEAT）を提案し、統計的な最適性を示した（抄録）。", "p3": "異質性を調整した集約としきい値処理で、通信と計算の効率がよい分散推定を設計した（抄録）。", "p5": "収束率などを示して統計的な最適性を証明したと述べるが、詳細は入手した抄録が途中で切れており未確認（抄録）。", "fun": "病院ごとに患者のデータを持っていても、プライバシーのためにデータを一か所に集められないことがある。しかも病院ごとに患者の特徴が少しずつ違う。この研究は、各病院で計算した結果だけを持ち寄り、違いを調整しながら「どの検査値どうしが関係しているか」を最適な精度で推定する方法を作った点が面白い。", "unverified": "抄録が途中で切れており、収束率と数値実験の結果は確認できなかった。"}}, {"id": "jn33", "rank": 33, "field": "経済学", "headline": "紙巻きたばこと電子たばこの課税が高齢喫煙者に与える影響", "title": "Cigarette and e-cigarette tax effects on the oldest generation of smokers in the United States", "url": "https://doi.org/10.1093/geroni/igag114", "authors": "Jason Semprini", "venue": "Innovation in Aging", "date": "2026-10-01", "sjr": 1.11, "citescore": 4.7, "citescore_year": "2025", "why": "若年層で喫煙が減る中で減らない高齢喫煙者に対する課税の効果を推定している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "65歳以上の米国の成人で、紙巻きたばこの税は現在の喫煙を減らすが、電子たばこの税はむしろ喫煙を増やすことと関連することを、州の税率と個票の調査データで示した（抄録）。", "p3": "州の紙巻きたばこ税と標準化した電子たばこ税のパネルを個票の調査データと結合し、二方向固定効果の人口加重回帰で現在の喫煙と過去1年の禁煙の試みを推定し、学歴・所得の部分集団を探索した（抄録）。", "p5": "3,117,382人のうち48%に喫煙歴があり、その18%が現在喫煙していた（抄録）。紙巻きたばこ税1ドルの増加は現在喫煙−0.56ポイント、電子たばこ税（開放型）0.10ドルの増加は+0.28ポイントと関連し、税率を1ドル近づけると+0.48ポイントだった（抄録）。禁煙の試みとは関連がなかった（抄録）。", "fun": "若い人のたばこは減ってきたが、高齢の喫煙者は減っていない。紙巻きたばこに税をかけると高齢者の喫煙は減ったが、電子たばこに税をかけるとかえって紙巻きたばこを吸う人が増えた。電子たばこが紙巻きたばこの代わりになっているなら、両方に同じように課税すると逆効果になりうる、という政策のジレンマが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn34", "rank": 34, "field": "経営学", "headline": "グリーン知識の取引と企業のエネルギー効率", "title": "Green knowledge trading and corporate energy efficiency: asymmetric effects of patent inflows and outflows", "url": "https://doi.org/10.1108/jkm-04-2026-0737", "authors": "Feng Gao ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-02", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "why": "特許の流入と流出が企業のエネルギー効率に非対称な効果をもつかを検証している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国のA株上場企業（2012〜2023年）で、グリーン特許の購入（知識の流入）は企業のエネルギー効率を高めるが、売却（流出）は購入を統制すると独立の効果がない、という非対称性を示した（抄録）。", "p3": "グリーン特許の取得と売却を知識の流入と流出の指標とし、パネルデータで分析した（抄録）。", "p5": "非対称性は、購入が組織の知識吸収の過程を引き起こし、売却はそれを起こさないことによると説明し、購入は知識の多様化とデジタルな知識管理能力という2つの仕組みでエネルギー効率を高めた（抄録）。効果は企業と地域で異なった（抄録）。", "fun": "環境技術の特許を「買う」会社と「売る」会社がある。買った会社はエネルギーの使い方が効率的になったが、売った会社には変化がなかった。技術は持っているだけではなく、組織の中に取り込んで使いこなすときに効く、ということだ。知識の流れに向きがある、という見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn35", "rank": 35, "field": "経営学", "headline": "デザイン思考はデジタル変革の知識実践システム", "title": "Design thinking as a practice system for knowledge-enabled digital transformation: microfoundations of dynamic capabilities", "url": "https://doi.org/10.1108/jkm-03-2026-0549", "authors": "Shahrokh Nikou ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-02", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "why": "デジタル変革が試行段階を超えて定着するための知識の仕組みとしてデザイン思考を位置づけ、動的能力の微視的基礎を論じている。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "オランダの金融サービスの実務家14人への面接から、デザイン思考がデジタル変革を試行段階から定着へ進める動的能力の微視的基礎（適応・統治・伝達）を形づくる知識の実践システムであることを示した（抄録）。", "p3": "半構造化面接を帰納的に分析し、デザイン思考の手法・考え方・成果物の相互に関連した集合が、変革の中で動的能力をどう支えるかを特定した（抄録）。", "p5": "問題の枠づけと短い反復実験による「適応」、利用者の証拠と意思決定の節目による「統治」、物語と境界をまたぐ成果物と共通語彙による「伝達」の3つの微視的基礎を示し、それらが戦略のずれ・意思決定のリスク・古いシステムの制約・部門間の連携の失敗に対処すると述べる（抄録）。", "fun": "会社のデジタル化は、試しにやってみる段階で止まってしまうことが多い。この研究は、利用者の声を聞きながら試作を繰り返す「デザイン思考」が、部署をまたいで知識を伝え、決め方をそろえる仕組みとして働くことを、銀行などの現場の声から描いた。発想法が組織の「変わる力」の部品になるという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn36", "rank": 36, "field": "経営学", "headline": "中小企業の画期的製品革新と輸出", "title": "Radical Product Innovation and Export Behaviour in Small and Medium Enterprises: The Roles of Growth Expectation and Customer Portfolio Breadth", "url": "https://doi.org/10.1111/radm.70061", "authors": "Gordon Liu ほか", "venue": "R and D Management", "date": "2026-10-02", "sjr": 1.839, "citescore": 12.0, "citescore_year": "2025", "why": "英国の中小企業の縦断調査で、画期的な製品革新が成長期待を通じて輸出を促すことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "英国の中小企業の縦断調査（2015〜2017年）で、画期的な製品革新が成長への期待を高め、それが輸出を促すこと、顧客層の広さがその関係を非線形に調整することを示した（抄録）。", "p3": "企業成長の理論にもとづき、英国の縦断的な小企業調査（LSBS）で、画期的な製品革新→成長期待→輸出の経路と、顧客ポートフォリオの広さの調整効果を検証した（抄録）。", "p5": "画期的な製品革新は成長期待を高め、それが輸出行動を促した（抄録）。顧客層の広さの調整効果は非線形で、単一の顧客層に絞るか、非常に多様な顧客層をもつ場合に最も強かった（抄録）。", "fun": "中小企業が画期的な新製品を作ると、「もっと大きくなれる」という期待が高まり、それが海外へ売り出す行動につながっていた。面白いのは、お客さんを一種類に絞った会社と、とても幅広く持つ会社で効果が強く、中途半端な会社では弱かったことだ。絞るか広げるか、どちらかに振り切るのがよいのかもしれない。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn37", "rank": 37, "field": "組織行動・心理的安全性", "headline": "venue": "Journal of Advanced Nursing", "date": "2026-10-02", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "why": "看護学生と臨床指導者の経験から、職場暴力が学習と共同体への包摂に与える影響を探っている。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "看護学生と臨床指導者26人への詳細面接から、職場暴力が看護教育の実践共同体への包摂と学習をどう損なうかを調べ、実践共同体の障壁と促進要因を示した質的研究である（抄録）。", "p3": "学部の看護学生と臨床指導者への詳細面接を、演繹的な主題分析で分析した（抄録）。", "p5": "①実践共同体の障壁、②実践共同体の促進要因、③実践の中でうまくいかない実践共同体の3つの主題と11の下位主題が得られ、職場暴力が包摂を損なうことを示したと述べる（抄録）。", "fun": "病院で実習する看護学生が質問をしても無視される。そんな小さな排除や暴言が、学ぶ機会を奪い、チームの一員になる道を閉ざしてしまう。この研究は、学生と指導者の話から、それがどう起き、どうすれば防げるかを整理した。題名の「質問したのに無視された」という一言が、問題の大きさをよく表していて考えさせる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn40", "rank": 40, "field": "機械学習", "headline": "構造を意識した生成AIでタンパク質ファミリーの機能関係", "title": "A structure-aware generative AI framework for revealing functional relationships in protein families", "url": "https://doi.org/10.1073/pnas.2536965123", "authors": "Divyanshu Shukla ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-02", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "配列統計と構造のどちらがファミリーごとに有益かを定量的に判断する生成AIの枠組みを提案している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "タンパク質ファミリーについて、アミノ酸配列のアラインメントと、3次元の相互作用にもとづく構造の文字列（3Di）のアラインメントを並行して作り、両方を2次元の生成的な地形に圧縮して、配列と構造のどちらがファミリーごとに機能の違いを語るかを定量化した（抄録）。", "p3": "変分オートエンコーダで各アラインメントを2次元の地図に圧縮し、直接結合解析で共進化のエネルギーを両方の地図に置き、情報理論的な距離の指標を定義した（抄録）。", "p5": "5つのファミリーで、リンゴ酸脱水素酵素では構造の地形が熱適応を担う保存された骨格を示し、グロビンとTRPMでは既知の機能的な亜群を回復し、フラビウイルス科のE1・E2糖タンパク質では配列では見えない進化的な関係を構造が明らかにした（抄録）。", "fun": "タンパク質は、アミノ酸の並び（設計図）と立体の形（完成品）の両方から調べられる。違う設計図から同じ形ができることも多い。この研究は、設計図の地図と形の地図をAIで並べて作り、どちらの地図が機能の違いをよく表すかをファミリーごとに見分けた。2枚の地図を見比べる発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn41", "rank": 41, "field": "機械学習", "headline": "脚ロボットの野外大規模データセットGrandTour", "title": "GrandTour: A legged robotics dataset in the wild for multi-modal perception and state estimation", "url": "https://doi.org/10.1177/02783649261480737", "authors": "Turcan Tuna ほか", "venue": "International Journal of Robotics Research", "date": "2026-10-01", "sjr": 2.022, "citescore": 12.2, "citescore_year": "2025", "why": "実環境の多様な条件を捉えた大規模な脚ロボットのマルチモーダルデータセットを公開している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "四足歩行ロボットANYmal-Dにマルチモーダルなセンサー群を載せ、山岳・森林・解体された建物・市街地など多様な屋外・屋内環境で集めた、公開の脚ロボットのデータセットとして最大のGrandTourを公開した（抄録）。", "p3": "回転型LiDAR、特性の異なる複数のRGBカメラ、固有受容センサー、6台の深度カメラ、ステレオRGB-Dカメラの時刻同期したデータと、衛星のRTK-GNSSとトータルステーションによる高精度の真値の軌跡を収録した（抄録）。", "p5": "規模・複雑さ・照明・天候の幅広い変化を含み、SLAM、高精度の状態推定、マルチモーダル学習の研究と評価を支えるとする（抄録）。", "fun": "犬のような四本足のロボットに、レーザーやカメラなどたくさんのセンサーを載せて、雪山から壊れた建物、町の中まで歩かせ、その記録を誰でも使えるように公開した。正解の位置は、衛星測位と測量機械で高い精度で測ってある。ロボットが「自分がどこにいるか」を知る技術を鍛えるための、大きな練習問題集として面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn42", "rank": 42, "field": "政治学", "headline": "少数派の代表がかえって包摂を妨げるインドの事例", "title": "The Representation Trap: How Minority Power Shapes Electoral Politics in India", "url": "https://doi.org/10.1017/s0003055426101774", "authors": "FEYAAD ALLIE", "venue": "American Political Science Review", "date": "2026-10-02", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "why": "少数派の政治的代表が少数派を分断し多数派を結束させることで包摂の逆風になりうることを論じた。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドのムスリムを事例に、少数派の代表を選出すると、少数派の票が分かれ多数派の票がまとまるため、かえって政治的包摂の逆風になりうる「代表の罠」を、選挙結果・独自の調査・質的証拠・ビネット実験で示した（抄録）。", "p3": "選挙結果の分析と、ヒンドゥーとムスリムの有権者への独自の調査に加え、質的証拠とビネット実験で仕組みをたどる混合研究法を用いた（抄録）。", "p5": "ムスリムの代表が当選すると、次の選挙でムスリムの票はより多くの同じ民族の候補に分散し、ヒンドゥーの票は多数派主義の政党に集まった（抄録）。仕組みは、ムスリムの下位アイデンティティの活性化と、ヒンドゥーの上位アイデンティティの動員だった（抄録）。", "fun": "少数派の代表が議員に選ばれれば、少数派の声が政治に届きやすくなるはずだ。ところがインドでは、ムスリムの議員が当選すると、次の選挙でムスリムの中で立候補者が増えて票が割れ、逆に多数派はまとまってしまった。良い結果が次の不利を呼ぶ「わな」があるという発見が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn43", "rank": 43, "field": "医学", "headline": "3万5千人のMRIで慢性痛の経過と灰白質の変化", "title": "Brain gray matter changes across chronic pain trajectories: MRI evidence from 35,000 individuals", "url": "https://doi.org/10.1097/j.pain.0000000000004125", "authors": "Katerina Zorina-Lichtenwalter ほか", "venue": "Pain", "date": "2026-10-02", "sjr": 2.127, "citescore": 10.7, "citescore_year": "2025", "why": "慢性痛の経過ごとの脳灰白質の変化を大規模データで調べ、小規模研究の不一致を整理している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "英国バイオバンクの35,052人で、約9年隔てた2時点の慢性痛の経過と脳MRIの313の指標の関係を調べ、慢性痛による脳灰白質の変化の多くは痛みが治まると戻る適応的な可塑性であることを示した（抄録）。", "p3": "参加者を、痛みなし・新たな慢性痛・持続する慢性痛・治まった慢性痛の4群に分け、2時点目のMRIの皮質表面積・皮質厚・皮質下体積と比べた（抄録）。", "p5": "新たな慢性痛は感覚運動野などの表面積の減少と関連し、持続する慢性痛はより広い減少と、小脳の萎縮や視床・基底核の肥大などの混在した変化を示した（抄録）。痛みが治まると、一次体性感覚野の表面積の減少を除いて多くの変化が戻り、痛みの素因を示す領域はなかった（抄録）。", "fun": "長く続く痛みは脳の形を変える、という報告は、小さな研究ばかりで結果がばらばらだった。35,052人のデータで調べると、痛みが続く人ほど脳の変化は広がっていたが、痛みが治った人では変化の多くが元に戻っていた。脳の変化は「壊れた」のではなく「適応した」ものだった、という見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn44", "rank": 44, "field": "開発経済学", "headline": "環境平和構築の政治：国際議題と国内政策", "title": "The politics of environmental peacebuilding: global agendas, advocacy networks, and domestic policy arenas", "url": "https://doi.org/10.1016/j.worlddev.2026.107580", "authors": "Jacobo Grajales ほか", "venue": "World Development", "date": "2026-10-02", "sjr": 2.027, "citescore": 9.3, "citescore_year": "2025", "why": "環境を通じた平和構築が国際的な議題から国内政策に移る政治過程を分析している（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、環境を通じた平和構築の政治を、国際的な議題、唱道ネットワーク、国内の政策の場の関係から分析した研究と読める（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「森や水を一緒に守ることが、対立する人々の平和づくりになるという考えは、国際的な議論から国内の政策へどう伝わるのか」だ。環境と平和を結ぶ発想が政治の中でどう動くかを追う点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて確認できなかった。"}}, {"id": "jn45", "ran
