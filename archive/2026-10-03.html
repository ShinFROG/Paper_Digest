<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

"authors": "Khashayar Pourtaheri ほか", "venue": "SSRN", "date": "2026-10-02", "id": "pr03", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMで作る合成回答者（synthetic persona）に、属性や性格の記述ではなくその人の過去の回答（行動履歴）を与えるほうが、個人の後の選択をよく予測できることを、845人の2時点パネルで示した（抄録）。", "p2": "調査・市場分析・政策実験の費用を下げるためにLLMを回答者の代わりに使う動きがあるが、代わりとして妥当かは個人の判断を再現できるかで決まる（抄録）。どの情報を与えれば個人の予測が良くなるかは分かっていなかった（抄録）。", "p3": "情報を段階的に増やした5条件の合成回答者を作る：個人情報なし→人口統計→性格特性→認知能力の得点→その人の以前の調査回答（行動履歴）（抄録）。行動履歴を使うときは、対象の偏りを採点する項目はすべて除いて与える（抄録）。", "p4": "米国の成人845人が14の行動バイアス（リスク、時間選好、過信、推論）を2回測った2時点パネルを使い、本人の1回目と2回目の一致（再検査）を人間の基準とする（抄録）。集団レベルの平均、個人間のばらつきの再現度、個人レベルの予測の情報量（informedness）で評価する（抄録）。", "p5": "1人当たりのバイアスの数の平均はどの条件でも人間に近い（7.1〜8.1個、人間は7.1個）（抄録）。しかし人物の記述だけでは人間の個人差の53〜67%しか再現できず、行動履歴を加えるとほぼ人間の水準に戻る（抄録）。個人の予測の情報量は、記述だけでは人間の再検査の7〜12%、行動履歴を加えると28%で、17の属性グループすべてで行動履歴を含む条件が最も高かった（抄録）。合成回答は学歴・所得による差を人間より強く示した（抄録）。", "p6": "抄録に著者の限界の記述はない。残る疑問：使ったLLMの種類、14のバイアス以外の領域（政治的態度など）でも同じか、行動履歴の効果が「同じ人の似た質問」を見ていることによる部分がどれだけかは本文で確かめる必要がある。未査読のプレプリントである。", "fun": "AIに「30代、大卒、慎重な性格」と人物像を教えても、その人がどう答えるかはほとんど当てられなかった。ところが、その人が前に答えた別の質問の答えを見せると、ずっとよく当たるようになった。人を知るには肩書きより行動を見よ、という昔からの知恵が、AIの「なりすまし回答者」にも当てはまるのが面白い。平均だけ見ると人間そっくりでも、個人差は再現できていない点にも注意が必要だ。", "unverified": "本文が読めず、使ったLLMとプロンプト、情報量（informedness）の計算方法の詳細は確認していない。"}}, {"rank": 4, "theme": "位相空間・土木三力学", "headline": "Fokker-Planck方程式の決定論・確率的粒子法", "title": "Deterministic and stochastic particle methods for the Fokker-Planck equation in S--formulation with application to point set registration", "url": "https://arxiv.org/abs/2610.01700", "authors": "Klaas Willems ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr04", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、定式化§2、MLS法§3、モンテカルロ法§4、数値実験§5.1〜5.3・5.5、考察・結論）を読んだ。§5.4と付録は見出しのみ確認", "preprint": true, "p1": "確率密度の時間発展を表すFokker-Planck方程式（FPE）を、障害物のある有界領域で粒子だけを使って解く2つの方法（決定論的な移動最小二乗粒子法と、ランジュバン方程式のモンテカルロ法）を作り、点群どうしの対応づけ（点群レジストレーション）に使えるようにした（§1.2、§6）。", "p2": "点群を別の点群へ滑らかに写す問題は、モデル縮約や画像処理で使われるが、有界領域や障害物があると最適輸送では強い非線形方程式と制約の扱いが必要になる（§1.2）。FPEは線形の放物型方程式で反射境界を課しやすいが、格子法では領域全体を離散化する必要があり、写像の軌跡も直接は得られない（§1.2）。", "p3": "第1の方法は、密度の対数S=logρについてのS形式（式6〜7）を使い、粒子を目標分布が与える流れ∇(S∞−S)で動かしながら、各粒子上で拡散項ΔSを移動最小二乗（MLS）で計算する（§2.2、§3）。壁には鏡像のゴースト点を置いて流束ゼロの条件を課す（§3.3）。第2の方法は、FPEに対応する反射つきランジュバン方程式を多数の粒子で解き、小領域ごとに密度の対数勾配（スコア）を推定して、ばらばらな確率的軌道から平均的な「浸透経路（osmotic path）」を取り出す（§4.2）。小領域の半径は偏りとばらつきの釣り合いで適応的に決める（§4.2.1）。", "p4": "厳密解のある拡散のみの例（§5.2）、ガウス分布を別のガウス分布に写す移流拡散の例（§5.3）、円柱の障害物を越える輸送（§5.4）、円柱を挟んだ半円の点群（各400点）の対応づけ（§5.5）で、密度と粒子位置の相対L1誤差と収束次数、軌跡の形で評価する。", "p5": "MLS法は、オイラー法で1次、中点法で2次の収束を密度と位置の両方で示した（図3(b)、図5）。モンテカルロ法は、固定半径だと経路がノイズで乱れるが、適応半径にすると偏りとノイズの釣り合いが取れて大きく改善した（図4）。円柱越えの対応づけでは、点群を混合ガウスで近似すると粒子群が障害物の上下に分かれて回り込み目標で合流するが、カーネル密度推定で近似すると経路が定性的に大きく変わった（図10、図11）。", "p6": "著者は、メッシュフリー法の安定性は一般には保証されず適応的な時間刻みが必要なこと、モンテカルロ法は経路にノイズが入ること、密度の変化が大きい所ではスコア推定が時間刻みと領域の大きさに敏感なことを認めている（§5.6）。密度推定の方法で結果が大きく変わる点も課題として挙げている（§5.5.1、§6）。残る疑問：検証は2次元のみで、高次元での性能は主張にとどまる。", "fun": "砂を一つの形からもう一つの形へ、途中の障害物を避けながら少しずつ流して移す様子を、数学では「確率の流れ」として書ける。この論文は、その流れを粒子一つ一つに追わせる方法を2通り作った。1つはきっちり計算する方法、もう1つはサイコロを振ってたくさんの粒子をでたらめに動かし、その平均の道筋を取り出す方法だ。でたらめな動きの集まりから滑らかな道が浮かび上がるところが面白い。", "unverified": "§5.4（円柱越えの輸送）の数値結果と、付録のGMMパラメータは確認していない。"}}, {"rank": 5, "theme": "VBI・橋梁SHM", "headline": "階層ベイズで高周波振動下の衝撃力を頑健に推定", "title": "Robust Impact Force Estimation via a Hierarchical Bayesian Framework with Generalized Hyperpriors for Structures under High-Frequency Vibration", "url": "https://doi.org/10.2139/ssrn.7553591", "authors": "Amy SAKO ほか", "venue": "SSRN", "date": "2026-10-02", "id": "pr05", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "構造物に加わる衝撃力を測定した振動から逆算する問題で、事前推定への信頼度を明示できる一般化ガンマ超事前分布を入れた階層ベイズ推定（MMAP）を作り、強いノイズの下でも誤差を小さく保てることを示した（抄録）。", "p2": "衝撃力の同定は、わずかな測定ノイズで解が大きく変わる不良設定の逆問題で、とくに高周波の振動環境ではノイズの影響が大きい（抄録）。背景：従来のチホノフ正則化は、正則化の強さをL曲線や一般化交差検証（GCV）で選ぶが、選び方によって結果が大きく変わりうる。", "p3": "階層ベイズのMMAP（周辺化した最大事後確率）推定で、超パラメータに一般化ガンマ分布の事前分布を置き、事前推定をどれだけ信じるかを明示的なパラメータとして入れる（抄録）。理論面では、MMAP推定量と集合論にもとづく反復正則化との解析的な対応関係を示したと述べる（抄録）。", "p4": "両端ピン支持の梁のシミュレーションで、ノイズ水準を0.1%から9%まで6段階に変えて検証し、L曲線とGCVで正則化の強さを選んだチホノフ正則化、および平坦な超事前分布と比較している（抄録）。評価は相対誤差と収束の速さである（抄録）。", "p5": "提案法（MMAPガンマ）の相対誤差は0.15〜4.43%で、GCVの0.28〜4.63%、L曲線の最大287.5%より系統的に小さかった（抄録）。平坦な超事前分布より3〜10倍速く収束した（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：検証は単純な梁のシミュレーションのみで、実構造の計測データ、複数の衝撃や移動する荷重での性能は未確認。GCVとの差はノイズの大きい条件では小さい（4.43%対4.63%）。未査読のプレプリントである。", "fun": "揺れた結果から「どこをどれくらいの力でたたいたか」を逆算するのは、雑音があると答えが大暴れする難問だ。この研究は、ベイズ統計で「最初の見積もりをどのくらい信じるか」まで数に入れることで、答えを安定させた。従来法の一つは条件によって誤差が287.5%にもなったのに対し、新しい方法は5%未満に収まった。結果から原因をさぐる推理のコツが数式になっているのが面白い。", "unverified": "本文が読めず、梁のモデルの詳細、衝撃力の波形、計算条件は確認していない。"}}, {"rank": 6, "theme": "VBI・橋梁SHM", "headline": "貨物流動から鉄道橋の重要度を全国で選別", "title": "From Freight Flows to Railroad Bridges: A National Framework for Importance Screening", "url": "https://doi.org/10.20944/preprints202610.0133.v1", "authors": "Raj Bridgelall", "venue": "Preprints.org", "date": "2026-10-02", "id": "pr06", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "公開の貨物流動データを米国本土の鉄道網に割り当て、個々の鉄道橋がどれだけの貨物を支えているかを推定して重要度指数（RB-FII）にまとめ、全国で重要な橋の集まりを再現可能な手順で選び出せるようにした（抄録）。", "p2": "国の貨物政策は量・経済価値・ネットワークの接続性を考えるが、公開データからは個々の鉄道橋の貨物依存度が直接分からず、保全やレジリエンス計画のための全国一貫した選別ができなかった（抄録）。", "p3": "貨物分析枠組み（FAF）の地域間の鉄道貨物流動を接続した鉄道網に経路として割り当て、各橋を経路の辺に結びつけて、通過トン数・金額・到達する発着地（OD）の数を計算する（抄録）。これらをゼロを保つ百分位の指数にまとめ、経済規模とネットワーク上の広がりに等しい重みを与える（抄録）。同順位を含めた上位の選択と密度ベースのクラスタリングで重要な橋の群を見つけ、並行線路や重みの感度分析で安定性を確かめる（抄録）。", "p4": "評価は、経路が割り当てられた割合、上位選択と地域クラスタの数、並行線路の扱いや重みを変えたときの橋の順位の相関で行う（抄録）。", "p5": "4,911のODペア（8億4,680万ショートトン、3,702.9億ドル）をすべて経路に割り当て、処理した69,356橋のうち68,326橋（98.52%）を鉄道網に結びつけた（抄録）。上位1,000の基準で同順位を含め1,003橋が選ばれ、うち939橋が32の地域クラスタを作り、64橋は孤立していた（抄録）。並行線路の代替案での順位相関は0.977〜0.979、重みを変えても0.988〜0.995と安定だった（抄録）。", "p6": "著者は、指数はモデル上の経路に依存し、実際の列車の経路、橋の状態、壊れる確率、途絶時の損失は測っていないと明記している（抄録）。残る疑問：旅客鉄道や迂回路の有無を考えたときに重要度がどう変わるか。未査読のプレプリントである。", "fun": "米国には7万近い鉄道橋があるが、どの橋が止まると国の物流が一番困るかは、実は公開データからは分からなかった。この研究は、地域から地域への貨物の流れを線路網に流してみて、各橋を通る荷物の量を推定した。道路の渋滞予測と同じように、流れをネットワークに乗せると「縁の下の重要な橋」が浮かび上がるのが面白い。ただし、橋が傷んでいるかどうかは測っていない点に注意がいる。", "unverified": "本文が読めず、経路割り当ての方法の詳細と、地域クラスタの地理的な分布は確認していない。"}}, {"rank": 7, "theme": "包摂的コミュニティ・社会", "headline": "AIとの毎日の会話で孤独感はむしろ増えた", "title": "Do Personal AI Conversations Reduce Loneliness? Evidence from a Pre-Registered Experiment", "url": "https://shs.hal.science/halshs-05705909v2", "authors": "Louis Fréget ほか", "venue": "HAL", "date": "2026-10-02", "id": "pr07", "explain": {"basis": "抄録", "basis_note": "HALの本文PDFは取得できず（403）、Semantic Scholarの抄録を使用", "preprint": true, "p1": "生成AIと毎日個人的な会話をするよう促す28日間の事前登録実験で、孤独感が減るどころか増え、生活満足度の低下や抑うつ気分の増加も起きたことを示した（抄録）。", "p2": "生成AIは孤独の解消策として宣伝されることが増えているが、その主張を大規模な無作為化実験で検証した研究は少ない（抄録）。", "p3": "フランスの成人の大規模な標本を無作為に分け、介入群には好きな生成AIツールと1日に少なくとも1回個人的な会話をするよう28日間依頼し、対照群は普段どおり過ごしてもらう（抄録）。分析計画は事前登録されている（抄録）。", "p4": "結果指標は、主観的な孤独感、生活満足度、抑うつ気分、客観的な孤立（一人で夕食をとる回数など）である（抄録）。標本の大きさや効果の推定方法の詳細は抄録にない。", "p5": "介入によって社会情緒的なAI利用は大きく増えた（抄録）。その結果、主観的な孤独感が増え、生活満足度が下がり、抑うつ気分と客観的な孤立（一人でとる夕食の増加）が増えた（抄録）。効果はすべての結果指標で一貫して悪い方向だった（抄録）。効果の大きさの数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：会話を「依頼された」ことによる負担や時間の置き換えの影響と、AIとの会話そのものの影響をどう分けるか、28日より長い期間や孤独の強い人に限った場合はどうか。未査読の論文である。", "fun": "AIと毎日おしゃべりすれば寂しさが減る、と期待する人は多い。ところが、くじで選んだ人に4週間それをやってもらうと、寂しさはむしろ増え、一人で夕食をとる回数まで増えた。「よさそうな方法」でも、くじ引きで比べる実験をすると逆の答えが出ることがある、という科学の方法の力が分かる例だ。", "unverified": "本文が読めず、標本の人数、効果の大きさ、使われたAIツールの内訳は確認していない。"}}, {"rank": 8, "theme": "LLM熟議・ペルソナ", "headline": "ベイズ弁証法的論証で複数LLM評議会を較正", "title": "Counting Moves, Weighing Voices: Bayesian Dialectical Argumentation for Calibrated Multi-LLM Councils under Persistent Adversaries", "url": "https://arxiv.org/abs/2610.02005", "authors": "Ionel Eduard Stan ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr08", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、§3の定式化、§5の実験設定、§6の通常データ、§7の敵対的条件、§8の考察と限界）を読んだ。付録の証明は見出しのみ", "preprint": true, "p1": "複数のLLMが議論して答えを出す「評議会」で、各エージェントの提案・反論・譲歩を観測データとして扱い、エージェントごとの信頼度を推定して重みづけるベイズ集約法（BDA）を作り、追加のLLM呼び出しなしで確信度を「正解する確率」に較正できるようにした（抄録、§3）。", "p2": "既存の集約法の確信度は「どれだけ決然としているか」を表すだけで正しさの確率になっておらず、持続的に誤らせる敵対的なエージェントを見分けて割り引くこともできない（抄録）。", "p3": "議論の手番（Propose・Challenge・Concede）を、誰がどの答えを支持・否定したかの記録として読み、各エージェントの潜在的な信頼度θを持つ古典的な注釈者モデル（Dawid–Skene）の観測とみなしてベイズ則を当てはめる（§1、§3）。事後分布は閉じた形で、判断は信頼度の対数オッズを重みとする重み付き多数決になる（命題1）。具体例：信頼度が偶然以下と推定された席は重みが負になり、その席が否定した答えはむしろ正解の証拠として数えられる（図1、π(g|T)=0.89の例）。", "p4": "二値の主張検証3データセット（各500問）、PubMedQA（3択、300問）、MMLUの4択部分集合（500問）を3つの乱数種で使い、3つの異なるLLM（gemma-3-27b、phi-4、gpt-4.1-nano）が3ラウンド議論する（§5）。多数決、MoA、ArgLLMs、ロジスティック積み上げ、Dawid–Skene EMなどと、正解率、較正誤差ECE、ブライアスコアで比べる（§5）。", "p5": "通常データでは、エージェント別BDAのECEは0.016で多数決の0.160より大幅に小さく、正解率も多数決より1.71ポイント高かった（§6）。ただし同じラベル数で事後較正したArgLLMsにはブライアスコアで負けると著者は明記する（§6）。敵対的な連合がいる条件では、混同行列版のBDAがPubMedQAで正解率を0.734から0.892へ、二値で0.471から0.840へ高めた（§7、表1）。", "p6": "著者は、約25個のラベル付き較正データが必要なこと、敵対者が較正期間中から誤り続けることが前提で途中から裏切る相手には弱いこと、信頼度が均質なら利点が薄れること、手番の独立性は理想化であることを限界として挙げる（§8）。議論のラウンドを重ねるとむしろ攻撃に弱くなり、防御の中心は初回の重み付き投票だとも述べている（§7）。", "fun": "会議で毎回わざと間違ったことを言う人がいたら、その人の意見は「逆の答えのヒント」として使える。この論文は、AI同士の会議でそれを自動でやる方法を作った。誰がどの答えに賛成・反対したかの記録から各AIの当たりやすさを推定し、信用できないAIの反対票は賛成票として数え直す。議論の中身を読まずに過去の成績だけを見る、という割り切りが面白い。", "unverified": "付録の証明、付録Hの小型モデルの評議会、表1の全セルの数値は確認していない。"}}, {"rank": 9, "theme": "都市・インフラ政策", "headline": "ニッケル産業で価値獲得が失敗した仕組み", "title": "Analyzing Value Capture Failure in the Energy Transition: The Case of the Sulawesi Nickel Industry, Indonesia", "url": "https://doi.org/10.2139/ssrn.7547620", "authors": "Yusril Mahendra ほか", "venue": "SSRN", "date": "2026-10-02", "id": "pr09", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "エネルギー転換でニッケル需要が急増したインドネシア・スラウェシで、産業が拡大しても地域に包摂的な発展が生まれない理由を、価値獲得（value capture）の構造的な失敗として説明した（抄録）。", "p2": "マクロ経済は強く成長しているのに、ニッケル産業の急拡大が地域の発展につながっていない（抄録）。背景：グローバル生産ネットワーク（GPN）論では、地域が付加価値をどれだけ取り込めるかを「価値獲得」と呼ぶ。", "p3": "GPNの枠組みにもとづく質的事例研究で、ギャップ分析と因果メカニズム分析を用いる（抄録）。解釈：統計的な因果推定ではなく、制度や企業の関係をたどって失敗の仕組みを組み立てる方法である。", "p4": "検証に使った資料（聞き取り、政策文書、統計など）の種類や件数は抄録になく未確認。評価は、付加価値の段階（スマイルカーブ）と社会・環境の負担の位置づけで行う（抄録）。", "p5": "スラウェシは付加価値の低いスマイルカーブの底にありながら、社会・環境の負担を示す「しかめ面カーブ（Frowning Curve）」の頂点にもあるという逆説を示した（抄録）。原因は、産業が地域の経済・社会と機能的につながっていない「分断された埋め込み」で、国家は規制の集権化、制度の弱体化、投資優先の統合によってこの状態を維持していると論じる（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：質的事例1つからの結論で、ほかの資源地域にどこまで当てはまるか、提案する熟議民主主義と正義にもとづく改革の具体像は本文で確かめる必要がある。未査読のプレプリントである。", "fun": "電気自動車の電池に欠かせないニッケルの産地では、工場がどんどん建ち国の経済も伸びているのに、地元の人は豊かになっていなかった。この研究は、儲かる部分は外へ、環境や暮らしの負担は地元へ、という「ねじれ」を2本の曲線で表した。世界の脱炭素という良い目標の裏で、どこに負担がしわ寄せされるかを考えさせる点が面白い。", "unverified": "本文が読めず、事例研究で使った資料の種類と量、分析の具体的な手順は確認していない。"}}, {"rank": 10, "theme": "会計情報科学", "headline": "LLMで信用リスクモデルの説明を伝える評価", "title": "Communicating Credit Risk with Large Language Models: Evaluation of Explanations from Standard and Alternative Data-Based Models", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.17715", "authors": "Sahab Zandi ほか", "venue": "RePEc NEP", "date": "2026-09-07", "id": "pr10", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法§3、自動評価§4.2と表4、人による評価§4.3の概要、考察§5.3、結論§6）を読んだ。付録と表6・7の詳細は一部のみ", "preprint": true, "p1": "信用リスクモデル（XGBoostやグラフニューラルネット）の技術的な説明（SHAPなど）を、LLMで関係者向けの文章に翻訳する「説明層」の質を、自動評価と融資の専門家・非専門家の評価で検証し、説明の質を決めるのはLLMの種類より入力する根拠の形式だと示した（抄録、§6）。", "p2": "融資の判断では正確さと説明可能性の両方が求められるが、最新モデルの説明は専門的すぎ、承認・拒否や公平性の判断に影響する伝達のずれが生じている（抄録）。LLMが説明の橋渡しをできるか、その文章が根拠に忠実かは検証されていなかった（§1）。", "p3": "Freddie Macの住宅ローン個票（2015年組成で学習、2016年で評価）で、①表形式（XGBoost＋SHAP）、②ネットワーク（郵便番号の上位桁や貸し手が同じローンを結んだグラフ上のGAT＋GNNExplainer）、③両者を組み合わせた二様式の3つのパイプラインを作る（§3.2〜3.4）。各説明を、微調整した小型LLM（Gemma 3 4B）、微調整した大型LLM（DeepSeek R1 70B）、微調整なしの商用LLM（Gemini 2.5）で文章化する（抄録）。", "p4": "自動評価では、Claude Sonnet 4.6を審査役に、重要な特徴量に言及しているか（網羅）と、その影響の向き（リスクを上げるか下げるか）を正しく述べているか（方向の一致）を5段階で採点する（§3.10、§4.2.1）。人による評価では、融資リスクの専門家48人と非専門家101人が二様式の説明を8つの観点で評価した（§4.3）。", "p5": "表形式の説明はネットワーク指標で、ネットワークの説明は表形式の指標で最低点付近になり、パイプラインの違いがLLMの違いより大きかった（表4）。12の比較のうち10で網羅が方向の一致を上回り、たとえば二様式では表形式の網羅が最大4.73なのに方向の一致は3.67にとどまった（§4.2.1）。専門家は非専門家より厳しい根拠の基準を当てた（§6）。", "p6": "著者は、単一の国の消費者信用に限ること、プロンプトの言い回しや確率的な生成、提供元の更新で結果が変わりうること、人の評価は二様式に限ったこと、評価者の多様性が雑音になることを限界に挙げる（§4.3、§5.3）。公平性（属性による説明の差）は今後の課題としている（§5.3）。", "fun": "AIが「あなたのローン審査が通らなかった理由」を文章で説明してくれるとしたら便利だ。ところが調べると、AIは重要な理由の名前は正しく挙げるのに、それが審査を有利にしたのか不利にしたのかを間違えることが多かった。説明の上手さはAIの賢さより「AIに渡す根拠の形」で決まる、という結果も、AIの使い方を考えるうえで面白い。", "unverified": "表6・7（人による評価の各観点の平均）と混合効果モデルの推定値の詳細は確認していない。"}}, {"rank": 11, "theme": "VBI・橋梁SHM", "headline": "波動物理を組み込んだ回帰で不均質板の厚さ分布", "title": "Spatial Thickness Mapping in Heterogeneous Plate Using Wave Physics-Informed Regression", "url": "https://arxiv.org/abs/2610.00944", "authors": "Amanda Beck ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr11", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（枠組み§2の冒頭、実験§4、結果§5.1〜5.4、結論§6）を読んだ。§2.1〜3の導出と付録は見出しのみ", "preprint": true, "p1": "板を伝わる超音波の波動場の計測から、場所ごとの分散曲線（周波数と波数の関係）を取り出し、厚さが一様でない板の厚さの分布図を、学習データなしで物理にもとづいて推定できるようにした（抄録、§6）。", "p2": "従来のガイド波によるSHMは材料特性が一様だと仮定するため、腐食・剥離・劣化のように厚さや特性が場所によって変わる構造をうまく評価できない（抄録）。", "p3": "計測した波動場xに近く、かつヘルムホルツ方程式（単一の波数kをもつ波の式）をよく満たす解yを、波数kと正則化の強さγ²とともに同時に求める最適化を解く（式1）。複数の波数（モード）に分けて解くと、各モードが厚さの異なる領域に対応する（§2.4、§5.2）。解釈：「この領域の波はこの波数で揺れているはず」という物理の制約を、波数空間のフィルタとして当てはめる方法で、γが不確かさの目安にもなる（§5.4）。", "p4": "中央に削った窪みと穴がある厚さ0.8128 mmのアルミ板を、レーザードップラー振動計で10×10 cmの範囲・200×200点で走査した実験データを使う（§4）。4つのモードを取り出し、波動場の再構成、モードの空間分離、X線CTで測った厚さとの比較（理論分散曲線との誤差、厚さ図の相関）で評価する（§5）。", "p5": "再構成の相関係数は全体で0.68で、誤差は主に穴の周り（損傷部）に集中した（§5.1、図5）。波数は718.03から1720.41 rad/mまでの4モードに分かれ、厚さが薄い領域ほど波数が大きいという理論どおりの関係を示した（§5.2、図6）。理論の分散曲線との誤差は平均48.12 rad/m、厚さ図とX線CTの相関は0.94だった（§5.3、図7）。", "p6": "著者は、等方的で平面的な、空間方向だけのモード解析に限られ、異方性材料には物理演算子の変更が必要だと認めている（§6）。残る疑問：実験は1枚の板の1つの欠陥のみで、波数の高い（薄い）モード4の不確かさが最も大きい（§5.4）。50 kHz未満の周波数は解像度の制約で除外している（§5.3.2）。", "fun": "太鼓の皮は張りや厚さで音の高さが変わるように、板を伝わる波も厚さによって波長が変わる。この研究は、板の上を走る超音波を細かく測り、場所ごとの波長の違いから「どこがどれだけ薄くなっているか」の地図を作った。AIに大量の例を学ばせなくても、波の物理の式を手がかりにすれば、X線CTとよく一致する厚さの地図が描けたのが面白い。", "unverified": "§2〜3の数式の導出（とくにγの推定式）と付録は確認していない。"}}, {"rank": 12, "theme": "会計情報科学", "headline": "開示の独自性と株価変動：AI時代の測定", "title": "Disclosure Originality and Stock Volatility in the Age of AI", "url": "https://doi.org/10.2139/ssrn.7547618", "authors": "Verushka Patel", "venue": "SSRN", "date": "2026-10-02", "id": "pr12", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "企業のリスク開示が同業他社とどれだけ「中身として」違うかを文の埋め込みの距離で測る指標（peer originality）を作り、独自性の高い開示ほど将来の株価変動が小さいことを示した（抄録）。", "p2": "開示の情報量の一般的な指標は文体を重視し、他社と本当に異なる情報を伝えているかを測っていない（抄録）。LLMで体裁の整った使い回しのリスク文が安く作れるようになり、形式と企業固有の中身の差がより重要になった（抄録）。", "p3": "年次報告書のItem 1A（リスク要因）の文章を文埋め込みに変換し、同じ業種の他社群との意味的な距離を「独自性」とする（抄録）。解釈：他社と同じ定型文なら距離は小さく、自社固有のリスクを書けば距離が大きくなる、という考え方である。", "p4": "2018〜2024年のS&P500企業で、Fama-MacBeth回帰により独自性と将来のリターンの変動の関係を推定する（抄録）。SECのRegulation S-K Item 105改正の前後、持続性、決算発表での検証、AIウォッシング（中身のないAIの言及）の拡張分析も行う（抄録）。", "p5": "独自性が高いほど将来のリターンの変動は小さく、他社と差別化した開示が残る不確実性を減らすという解釈と整合した（抄録）。AIに関する言葉が急増しつつ独自性が低い企業は、ChatGPT以前には変動が大きかったが、以後はその関係が弱まった（ただし期間別の図ではゼロにはならない）（抄録）。係数の大きさは抄録になく未確認。", "p6": "著者は、Item 105の分析は改正前の独自性で並べており、厳密な因果ではなく示唆として読むべきだと認めている（抄録）。残る疑問：業種の定義や埋め込みモデルの選択で結果がどれだけ変わるか。未査読のプレプリントである。", "fun": "会社は毎年「わが社のリスク」を報告書に書くが、どこも似たような定型文になりがちだ。この研究は、AIの文章理解の技術で「他社とどれだけ違うことを書いているか」を数値化した。すると、自分の言葉でちゃんと書いている会社ほど株価の揺れが小さかった。AIで文章がいくらでも作れる時代こそ、中身の独自性が価値をもつという話が面白い。", "unverified": "本文が読めず、回帰係数の大きさ、埋め込みモデルの種類、同業他社群の定義は確認していない。"}}, {"rank": 13, "theme": "位相空間・土木三力学", "headline": "配置データから確率動力学の長時間発展を生成", "title": "Generative Modeling of Stochastic Dynamics for Long-Time Evolution", "url": "https://arxiv.org/abs/2610.00546", "authors": "Yang-yang Tan ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr13", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（主部の導入、遷移核の定式化、条件付き拡散モデル、Model Bの結果、結論）と補遺の計算コスト・コロイド実験の冒頭を読んだ", "preprint": true, "p1": "運動方程式を知らなくても、一定の短い時間差で記録した状態の組（ペア）だけから確率的な遷移の法則を生成モデルで学び、それを繰り返して学習した時間差よりはるかに長い時間の非平衡の動きを予測できることを示した（抄録）。", "p2": "非平衡の確率的な動きを支配する方程式は多くの場合わからない（抄録）。深層学習による模倣は決定論的な発展や静的な分布が中心で、ランジュバン推定は方程式の形を仮定する必要があり、多自由度の場で方程式の形を仮定せずに動きを再構成できるかは未解決だった（序論）。", "p3": "時間差δtだけ離れた状態の組から、現在の場φを条件として次の増分Δφの分布を条件付き拡散モデル（ノイズから少しずつ形を作る生成モデル）で学ぶ（式4）。学んだ遷移核から増分をくり返し引いて足すと、チャップマン・コルモゴロフの合成により長い時間の軌道ができる（式5）。平均だけを予測する回帰と違い、揺らぎそのものを再現する点が要である（本文）。保存則（場の平均が一定）は増分を平均ゼロに射影して守らせる。", "p4": "保存する秩序変数の拡散的な動き（2次元Model B）で、高精度の確率的ルンゲ・クッタ法（SOSRA）による直接計算と、臨界緩和の動的臨界指数z、相分離での領域サイズの成長則t^{1/3}を比べる（本文、図2、図3）。さらに周期的な光ポテンシャル中の駆動コロイドの実測軌道に適用した（End Matter）。", "p5": "学習は1つのδtだけだが、200δtまで予測でき、動的指数はz=3.792(19)で直接計算の3.812(20)と一致した（図3）。L=64までで学習した遷移核がL=128の相分離をt^{1/3}則どおりに生成し、直接計算から約2%以内だった（本文）。コロイドでは10分の実測で次の20分の粒子流と平均通過時間を1%以内で予測し、ランジュバン方程式による参照は約6%ずれた（本文）。", "p6": "著者は、どの遅い変数を状態として持たせるべきかは動的普遍クラスごとに異なり、どこまで適用できるかはその選択に依存すると述べる（結論）。記憶のある系や能動系・反応拡散系では補助変数や追加の場が必要になりうる（本文）。残る疑問：誤差の蓄積が非常に長い時間でどう振る舞うかは個別に検証が要る。", "fun": "天気の式を知らなくても、1時間ごとの天気図の組をたくさん見れば、次の1時間の変わり方のくせが分かるかもしれない。この研究は、そのくせを「でたらめさ込み」でAIに覚えさせ、何百回もつないで遠い未来まで予測した。短い時間の観察に、長い時間の法則（臨界現象の指数や相分離の成長則）が隠れていたことが分かる点が面白い。", "unverified": "補遺の数値（訓練条件、計算時間の表1の値）は確認していない。"}}, {"rank": 14, "theme": "職場AI・組織行動", "headline": "AIの職業助言が伝統的な性別役割を強める", "title": "AI Advice Reinforces Traditional Gender Roles", "url": "https://doi.org/10.2139/ssrn.7550661", "authors": "Nadja Born ほか", "venue": "SSRN", "date": "2026-10-02", "id": "pr14", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "主要な4つのLLMに給与交渉の助言を求めると、女性の人物設定には低い給与目標と柔軟性・ケア重視の交渉項目を、男性には報酬・昇進重視の項目を勧め、伝統的な性別役割へ利用者を誘導しうることを示した（抄録）。", "p2": "専門職がキャリアの助言をAIに求めることが増えているが、LLMが性別によって異なる助言をするかは、交渉という具体的な場面で検証されていなかった（抄録）。", "p3": "性別だけを変えた求職者の人物設定（ペルソナ）を作ってLLMに助言を求める監査実験（audit experiment）を2つ大規模に行った（抄録）。背景：監査実験は、他の条件を同じにして一つの属性だけを変え、扱いの差を測る方法で、雇用差別の研究で使われてきた。", "p4": "4つの主要モデルを対象に、推奨される給与目標と交渉の議題の優先順位を比べ、交渉項目が「主な養育者」「稼ぎ手」の役割とどれだけ結びつくかを人による独立の評定と照合した（抄録）。人数や試行数は抄録になく未確認。", "p5": "LLMは女性の人物設定に男性より低い給与目標を勧めただけでなく、女性には柔軟性・育児や介護・well-beingを、男性には金銭的報酬・異動・昇進を高く優先する議題を作った（抄録）。この差は、人が評定した「養育者の役割」「稼ぎ手の役割」に結びつく雇用条件と密接に対応していた（抄録）。差の大きさは抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：人物設定で性別を明示した場合と、名前などから推測させた場合で差が変わるか、実際の利用者がこの助言に従って交渉結果が変わるかは未検証とみられる。未査読のプレプリントである。", "fun": "同じ経歴でも、性別だけを変えてAIに「給与交渉のコツ」を聞くと、女性には控えめな金額と「働きやすさ」を、男性には高い金額と「出世」を勧めてきた。AIは一人ひとりに合わせた助言をするからこそ、社会にある思い込みを本人に気づかれずに強めてしまうおそれがある。一見親切な「あなた向けの助言」の落とし穴が見える点が面白い。", "unverified": "本文が読めず、使った4つのモデル名、試行数、給与目標の差の大きさは確認していない。"}}, {"rank": 15, "theme": "都市・インフラ政策", "headline": "米国橋梁台帳のデータ品質と資産管理の意思決定", "title": "The Impact of Data Quality on Transportation Asset Management and Infrastructure Decision-Making: Evidence from the U.S. National Bridge Inventory", "url": "https://doi.org/10.2139/ssrn.7551022", "authors": "Ramiz Uddin", "venue": "SSRN", "date": "2026-10-02", "id": "pr15", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（途中で切れている）を使用", "preprint": true, "p1": "米国の橋梁台帳（National Bridge Inventory, NBI）そのもののデータ品質（完全性・内部の整合性・正確さ）を、公開アーカイブの8年分のデータで直接点検しようとした研究である（抄録）。", "p2": "交通資産管理は、状態評価、資本配分のモデル、性能にもとづく意思決定の基礎としてNBIに頼っているが、NBIを既製の入力として使う研究の多さに比べ、NBI自体の品質はほとんど直接検証されてこなかった（抄録）。", "p3": "連邦道路庁（FHWA）の公開NBIアーカイブから8年分のデータを取得・確認して分析する（抄録）。具体的な点検項目や手法は、抄録が途中で切れているため未確認。", "p4": "未確認（登録された抄録が途中で切れており、評価の指標と比較対象は読めなかった）。", "p5": "未確認（結果を述べた部分は入手した抄録に含まれていない）。", "p6": "抄録が途中までしか読めず、限界の記述は確認できない。残る疑問：品質の問題が状態評価や予算配分の結論をどれだけ変えるかを定量化しているか。未査読のプレプリントである。", "fun": "橋の健康診断の記録をまとめた全米の台帳は、多くの研究や予算の判断の土台になっている。でも、その台帳自体に抜けや食い違いがあったら、上に積んだ分析もぐらつく。この研究は「データを使う前にデータを疑う」という、地味だけれど大事な問いに正面から取り組んでいる点が面白い。", "unverified": "抄録が途中で切れており、分析の方法、見つかった品質の問題、その影響の大きさはいずれも確認できなかった。"}}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "GNSSと衛星天底角で月面受信機の時計を同期", "title": "Lunar Surface Receiver Clock Synchronization Using GNSS and Satellite Nadir Angle", "url": "https://arxiv.org/abs/2610.01018", "authors": "Minju Han ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr16"}, {"rank": 17, "theme": "LLM熟議・ペルソナ", "headline": "LLMが生成する選好分布をどう評価するか", "title": "Evaluating LLM-Generated Preference Distributions", "url": "https://arxiv.org/abs/2610.01000", "authors": "Fan Huang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr17"}, {"rank": 18, "them act and Countermeasures", "url": "https://arxiv.org/abs/2610.01294", "authors": "Robert Argo ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr49"}, {"rank": 50, "theme": "LLM熟議・ペルソナ", "headline": "エージェント網で社会的伝染が攻撃を運ぶ", "title": "Memetic Trojans: Social Contagions as Carriers of Adversarial Payloads in Agent Networks", "url": "https://arxiv.org/abs/2610.00430", "authors": "Birk Torpmann-Hagen ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "id": "pr50"}], "pre_notable": [{"rank": 1, "field": "経済学", "headline": "キャンパス開放が大学の研究生産性を左右", "title": "Open Gates! Open Science! Campus Openness and University Research Productivity", "url": "https://doi.org/10.2139/ssrn.7553159", "authors": "Qiao Wang ほか", "venue": "SSRN", "date": "2026-10-02", "why": "中国の大学の段階的なキャンパス再開を準実験として使い、732万本の論文データと結びつけて物理的な場へのアクセスが研究生産性に与える効果を推定しており、規模と識別の両面で強い実証。", "id": "pn01", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "コロナ禍後の中国の大学キャンパスの段階的な再開を自然実験として使い、物理的な場へのアクセスが論文の量と質、大学・企業との共同研究を増やすことを示した（抄録）。", "p2": "物理的な空間へのアクセスが科学の生産性をどう左右するかは、在宅研究が広がった今も因果的にはよく分かっていない（抄録）。背景：場所と研究の関係は相関が強く、近さの効果だけを取り出すのが難しい。", "p3": "大学ごとのキャンパス再開日とアクセスの方式（全面開放・予約制など）を手作業で集め、2010〜2025年のOpenAlexの論文732万本と結びつける（抄録）。閉鎖のままの大学や予約制の大学を比較群として、差の差法（DiD）で全面再開の効果を推定する（抄録）。背景：DiDは、処置を受けた群と受けない群の前後の変化の差で効果を推定する方法である。", "p4": "結果指標は論文の量と質、他大学や企業との共同研究、新しい研究上のつながりで、大学の基礎研究力・実験設備・分野の多様性による効果の違いと分野別の効果も調べる（抄録）。", "p5": "全面再開は論文の量と質をともに増やし、他大学や企業との共同研究と新しい研究のつながりを広げた（抄録）。効果は基礎研究力が高く、実験設備が多く、分野が多様な大学で大きく、工学・農学・経済学と経営学に集中した（抄録）。効果の大きさの数値は抄録になく未確認。", "p6": "抄録に限界の記述はない。残る疑問：再開のタイミングが大学の性質（地域の感染状況や政治的な判断）と関係していれば推定に偏りが入りうる。論文の出版までの時間差をどう扱ったかは本文で確かめる必要がある。未査読のプレプリントである。", "fun": "オンライン会議で何でもできる時代に、大学の門を開けることに意味はあるのか。中国の大学が再開した日がばらばらだったことを利用して、同じ時期の「開いた大学」と「閉じたままの大学」を比べると、開いた大学の研究は量も質も伸びた。とくに実験装置や対面の議論が大事な分野で効果が大きい。偶然の違いを実験の代わりに使う発想が面白い。", "unverified": "本文が読めず、効果の大きさ、平行トレンドの確認、質の指標の定義は確認していない。"}}, {"rank": 2, "field": "因果推論", "headline": "DiDで対照群をデータで選んだ後の推論", "title": "Inference after data-driven control-unit selection in difference-in-differences with estimated covariance", "url": "https://arxiv.org/abs/2610.01464", "authors": "Ryoya Nakano ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "事前トレンドを見て対照群を選ぶという広く行われている手順の後で、妥当な推論を行う方法を示しており、差の差法の実務に直結する方法論。", "id": "pn02", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、§2の設定、§6のシミュレーション設計と結果・表1、§7の範囲と解釈）を読んだ。§3〜5の定理と付録の証明は見出しのみ", "preprint": true, "p1": "差の差法（DiD）で、介入前のトレンドが似ている対照群を候補の中からデータで選んだ後でも、その選択を考慮して処置群の平均処置効果（ATT）の信頼区間を正しく作る「選択的推論」を、共分散を同じデータから推定する現実的な場合と段階的な導入の場合に拡張した（抄録、§1）。", "p2": "平行トレンドがもっともらしい対照群を事前トレンドで選び、同じ事前データでDiDを推定すると、選択と推定量が統計的に依存し、通常の信頼区間の被覆率が変わりうる（§1）。先行研究は事前トレンド検定の検出力や平行トレンドからの逸脱への頑健性を扱ったが、候補から対照群を選んだ後のATTの区間は作っていなかった（§1）。", "p3": "「この候補が選ばれた」という事象を、地域平均の二次不等式で表し、その条件のもとでの切断正規分布にもとづくピボットで区間を作る（§3）。共分散は選択とDiDに使ったのと同じ個人データから推定し、分散・条件づけの方向・残差・切断集合の計算に代入する（抄録、§1）。段階的導入では、コホートと期間ごとに対照群の候補が異なり、まだ処置されていない単位を対照に使う場合も、選択経路の和集合で条件づけた区間と同時信頼帯を作る（§5）。", "p4": "処置地域1つと候補2地域のシミュレーションで、完全な同点、正の当てはまり値での同点、順位が明確に分かれる場合、標本の大きさが不均衡で平均が動く場合の4設定×正規・ガンマ分布×3つの標本規模の24設計を各5,000回繰り返し、通常の区間・提案の代入型区間・真の共分散による区間の95%被覆率を比べる（§6.1）。", "p5": "提案の代入型区間の被覆率は24設計で94.06〜95.60%で、モンテカルロ標準誤差は約0.3ポイントだった（§6.2、表1）。完全な同点の設計では、通常の区間はむしろ96.52%（正規）と保守的で、対照群の選択が必ず被覆不足を生むわけではないことも示した（§6.2）。最小の標本規模では0.4〜0.9ポイントのわずかな被覆不足が残った（§6.2）。", "p6": "著者は、事前の当てはまりが良いことは処置後の平行トレンドを保証せず、平行トレンドは識別の仮定として残ると強調している（§1、§7）。地域と期間の数を固定した漸近論で、まれにしか選ばれない候補の条件付き被覆は評価できないとも述べる（§6.2）。残る疑問：実データへの適用例は本文で確認できなかった。未査読のプレプリントである。", "fun": "「比べる相手は、事前の動きが一番似ているところを選ぼう」というのは自然な発想だが、同じデータで相手選びと効果の計算をすると、統計の誤差の見積もりがずれることがある。この論文は、相手を選んだという事実を計算に織り込んで、正しい誤差の幅を出す方法を広げた。自分で選んだ比較相手を、選んだことまで含めて正直に評価する、という考え方が面白い。", "unverified": "§3〜5の定理の詳細な条件と付録の証明、実データへの適用の有無は確認していない。"}}, {"rank": 3, "field": "機械学習", "headline": "オンポリシーとオフポリシー蒸留を系統比較", "title": "On-Policy or Off-Policy Learning? A Systematic Study of Distillation Dynamics", "url": "https://arxiv.org/abs/2609.35259", "authors": "Julianna Piskorz ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-02", "why": "教師ありの微調整と強化学習の比較で混同されてきた要因を切り分け、蒸留の動態を系統的に調べた研究で、HFでの注目度も高い。", "id": "pn03", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§4の実験設定と結果、§7の考察と限界）を読んだ。§5〜6と付録は見出しのみ", "preprint": true, "p1": "大きいモデルから小さいモデルへの知識の蒸留で、学習に使う文章を生徒自身に生成させるか（オンポリシー）教師に生成させるか（オフポリシー）を他の条件から切り離して比べ、結果を左右するのは生成の方針よりKLの向きと学習率だと示した（抄録、§7）。", "p2": "オンポリシー学習は忘却を減らし、パラメータ更新を疎にし、汎化を良くするといわれてきたが、教師あり微調整と強化学習の比較は多くの要因を同時に変えており、生成方針そのものの寄与を切り分けられていなかった（抄録）。", "p3": "Llama-3.1-8Bの教師からLlama-3.2-1Bの生徒への蒸留（付録でQwen2.5も）で、生成方針、トークン単位のKLダイバージェンスの向き（順方向KLは教師の分布を広く覆う、逆方向KLは生徒の得意な所に集中する）、学習率（1×10⁻⁵か5×10⁻⁵）を独立に変える（§4.1）。各条件150ステップ、3つの乱数種で学習する（§4.1）。", "p4": "医療・科学・算術の3つの推論課題で、課題内の正解率、分布外の7ベンチマークでの成績低下（破滅的忘却）、変化が10⁻⁶未満のパラメータの割合（更新の疎さ）を測る（§4.1）。", "p5": "課題内の最高平均正解率はオンポリシー72%、オフポリシー73%とほぼ同じだった（§4.2、図1）。順方向KLはどの設定でも71〜73%と安定し、逆方向KLは35〜72%と学習率に敏感だった（§4.2）。忘却は低い学習率で最大1.3ポイント、高い学習率で11.2〜14.0ポイントで、更新の疎さも85.3〜89.6%対51.9〜60.0%と学習率で分かれ、生成方針の差は小さかった（§4.2）。オンポリシーは算術課題のより難しい変種への汎化を高めたが、その後の強化学習で優位が保たれるとは限らなかった（抄録）。", "p6": "著者は、生徒モデルが最大1.5Bパラメータ、推論の長さが最大2,000トークンの範囲に限られ、教師を固定していることを限界として挙げる（§7）。オンポリシー蒸留の研究ではより安価なオフポリシー蒸留を標準の比較対象に含めるよう勧めている（§7）。", "fun": "先生の解答を写して学ぶか、自分で解いた答えを先生に添削してもらうか。AIの世界では後者（自分で作った答えで学ぶ）が優れていると言われてきた。ところが条件をそろえて比べると、差を生んでいたのはそこではなく、「学ぶ速さ（学習率）」と「先生のどこを真似するか（KLの向き）」だった。思い込みを一つずつ条件を変えて確かめる、実験の基本が光る研究だ。", "unverified": "§5の勾配の解析、§6の追加実験、付録のQwen2.5の結果の数値は確認していない。"}}, {"rank": 4, "field": "経済学", "headline": "船舶排出の推計に機械学習と工学を結合", "title": "Modeling Shipping Emissions: Machine Learning, Engineering, and Policy Counterfactuals", "url": "https://arxiv.org/abs/2610.01008", "authors": "Hiroyuki Kasahara ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "予測精度の高い機械学習が反実仮想の応答を正しく与えるとは限らないことを、物理の知識と組み合わせて検証しており、政策評価での機械学習の使い方に重要な示唆。", "id": "pn04", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§5.1の標本外評価、§5.2.3の速度の反実仮想、§7.2の厚生評価の冒頭、§8の結論）を読んだ。§2〜4の詳細と付録は見出しのみ", "preprint": true, "p1": "船舶の燃料消費（CO2排出）の予測で、機械学習は合計値をよく当てても、速度を変えたときの反応（反実仮想）を物理の基準より大きく弱めてしまうことを示し、理論の構造を守る混成モデルの作り方を提示した（抄録、§8）。", "p2": "機械学習は予測が上手でも、政策で条件を変えたときの反応が信頼できるとは限らない（抄録）。船舶の排出では、燃料消費が速度のべき乗で増えるという物理（工学）の基準があり、反実仮想の反応の正しさを点検できる（抄録）。", "p3": "乾貨物船とコンテナ船の1時間ごとの航跡データを、EU規制で報告された年間燃料消費と結びつけ、工学計算、構造的回帰、混成モデル、純粋な機械学習を比べる（抄録）。混成モデルでは機械学習の補正部分から速度に関わる入力を除き、構造部分の速度反応をそのまま保つ（抄録、§4.3）。", "p4": "2019〜2020年で学習し2021年で標本外の予測誤差を評価し、航跡の速度を一律に−20%から+10%まで変えた反実仮想で予測燃料の変化を工学の基準と比べる（§5.1、§5.2.3）。さらに減速政策の費用便益分析を例示する（§7.2）。", "p5": "推定したすべてのモデルは報告値の数%以内で合計を予測し、標本外誤差6.5%の過大予測だった工学計算より良かった（§5.1）。しかし純粋な機械学習は速度反応がほぼ平らで、速度を上げると燃料が減ると予測するものまであった（§5.2.3、図6）。混成モデルは構造部分の反応を保った（§5.2.3）。同じ評価の前提でも、工学計算と制約付き構造回帰では減速の純便益が正、純粋な機械学習と制約なし構造回帰では負になった（§8）。", "p6": "著者は、混成モデルの性質は水準の偏りが小さいことも保たれた反応が正しいことも保証せず、補正を反実仮想に移すには追加の不変性の仮定が要ると述べる（§8）。残る疑問：検証は2つの船種とEUの報告対象に限られる。未査読のプレプリントである。", "fun": "AIで船の燃料消費を予測すると、合計はぴったり当たるのに、「速度を落としたら燃料はどれだけ減るか」と聞くと、ほとんど減らないと答えてしまった。物理では、速度を落とすと燃料は大きく減るはずだ。当てるのが上手なことと、仕組みを理解していることは違う、という大事な違いを、政策の損得が逆転する例で見せてくれる。", "unverified": "§6の原因分析（測定誤差、非線形性）と、§7.2の費用便益の具体的な金額は確認していない。"}}, {"rank": 5, "field": "組織行動・心理的安全性", "headline": "上司の態度は部下にほぼ伝わらなかった", "title": "Do organizational identification, citizenship behavior, and turnover intentions really transfer from leaders to followers? Revisiting trickle-down effects and the role of leader exposure", "url": "https://doi.org/10.2139/ssrn.7553191", "authors": "Florian  S. Feuchter ほか", "venue": "SSRN", "date": "2026-10-02", "why": "組織同一化・市民行動・離職意図のトリクルダウン効果を、上司との接触の程度を考慮して再検証しており、リーダーシップ研究の定説の頑健性を問う。", "id": "pn05", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "リーダーの組織同一化・組織市民行動・離職意図が部下に「したたり落ちる（トリクルダウン）」という定説を、3時点・多情報源のパネルで検証し、将来への影響はほぼ見られないことを示した（抄録）。", "p2": "多くのリーダー論はリーダーを部下が見習う手本とみなし、トリクルダウン研究も同じ時点での上司と部下の得点の一致を根拠にしてきた（抄録）。同時点の一致は影響の証拠とは限らない（抄録）。", "p3": "スイスの168校の教員4,381人と学校長211人の3時点パネルで、上司の得点と部下の得点を同時点と将来の両方で関連づけ、部下の過去の水準を統制する（抄録）。上司との接触期間の効果と組織への所属期間を分けるため、組織の新人、上司が最近替わった古参、両方で定着している人を比べる（抄録）。", "p4": "同時点の相関、上司の得点による部下の変化の予測、同等性検定（効果がある大きさ以下であることを示す検定）で評価する（抄録）。", "p5": "組織同一化は同時点で弱く一致した（r = .14）が、職業を離れる意図の一致は弱く、組織市民行動は一致しなかった（抄録）。上司の得点はどの部下の変化も予測せず、同等性検定でβ=±.04より大きい効果は否定された（抄録）。一致は接触期間が長いほど強いわけではなく、むしろ上司が新しい場合に最も強かった（抄録）。組織の新人は組織同一化と市民行動が低く始まり、離職意図が最も急に高まった（抄録）。", "p6": "著者は、この結果は短期の同じ構成概念どうしの将来への関連の大きさを制限するもので、同時点の一致を影響の証拠と解釈することに注意を促すと述べ、帰無の結果の解釈をいくつか示している（抄録）。残る疑問：教員と学校長という一つの職場の型での結果がほかの組織にどこまで当てはまるか。未査読のプレプリントである。", "fun": "「上司がやる気だと部下もやる気になる」とよく言われるが、それは同じ時期に両方を測って似ていた、という証拠が中心だった。この研究は4千人以上の教員を3回追いかけ、上司の態度がその後の部下の変化を予測するかを調べた。答えはほぼ「しない」。似ているのは影響したからではなく、同じ学校の空気を吸っているからかもしれない。相関と因果の違いを考える良い例だ。", "unverified": "本文が読めず、各期の間隔、欠測の扱い、帰無の結果について著者が示した説明の中身は確認していない。"}}, {"rank": 6, "field": "因果推論", "headline": "補充標本でパネル調査の回答慣れを識別", "title": "Identifying Panel Conditioning with Refreshment Samples: Sharp Bounds and Design Assumptions", "url": "https://arxiv.org/abs/2610.01654", "authors": "Shoki Okubo", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "パネル調査の参加そのものが測定を変える効果（パネル条件付け）について、補充標本で識別できる範囲を鋭い上下限で示した識別論。", "id": "pn06", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、序論の前半、§10の日本のパネル調査への適用の冒頭、§11の考察）を読んだ。§2〜9の定理と付録は見出しのみ", "preprint": true, "p1": "パネル調査で、くり返し回答すること自体が回答を変える「パネル条件づけ」を、脱落の仕組みに制約を置かずに補充標本（新たに抽出した回答者）からどこまで識別できるかを、鋭い上下限（sharp bounds）として明らかにした（抄録）。", "p2": "補充標本は脱落への標準的な対処法だが、その識別の理論は「調査への参加は測定を変えない」と仮定してきた（抄録、§1）。一方、パネル条件づけの研究は参加が回答を変えることを示しつつ、脱落を比較の脅威として扱ってきた（§1）。2つの文献は互いに相いれない制約を置いていた。", "p3": "再回答時の条件づけを決定論的で単調な写像としてモデル化し、ある写像がデータと矛盾しないのは、残留者の潜在的な回答の分布（残留率で尺度化）が補充標本の分布に集合的に支配されるときに限ることを示す（抄録、定理1）。脱落がなければ写像は識別され、脱落があれば密度比の条件が識別集合を決める（抄録）。生存者どうしの照合、対称照合、参加波の補正という3つの設計がどの仮定で何を識別するか、その偏りも導く（抄録、§7）。", "p4": "理論の結果に加え、シミュレーション（付録）と、日本の生活とキャリアの縦断パネル（JLPS）の3コホート構成への適用で、子ども時代の状況を尋ねる時間不変の23項目を負の対照として使った診断を示す（§10）。", "p5": "制約のない写像では、生存者の平均効果は既知の刈り込み上下限（Horowitz–Manskiの区間）になり、すべての選択肢が報告される項目では条件づけなしの検定に帰着する（抄録、§11）。同じコホート内では、波の数、脱落のパターン、参加波の項目を足しても、波をまたぐ選択の制約がない限り識別集合は狭まらない（抄録）。JLPSでは、23の負の対照項目の標準化された差の中央値の絶対値が.033、逆分散でまとめた値が−.035で、BH法q<.10で棄却されたのは1項目（子ども時代の家の電話の有無）だった（§10）。", "p6": "著者は、JLPSの比較はコホートの比較可能性の仮定に依存し、診断は仮定どうしの整合性を見るもので、特定の識別仮定を正しいと示すものではないと明記する（§10）。残る疑問：理論の要求する条件（密度比、移送の制約）を実務でどう判断するかは、適用分野ごとの検討が必要に見える。未査読のプレプリントである。", "fun": "同じアンケートに毎年答えていると、答え方そのものが慣れや気づきで変わってしまうことがある。しかも途中でやめる人もいる。この論文は、新しく加えた回答者と比べることで「慣れの効果」がどこまで分かり、どこからは分からないかを、数学的にきっちり線引きした。分からない部分を「分からない幅」として正直に示す、という考え方が面白い。", "unverified": "§2〜9の定理の正確な条件、付録のシミュレーション結果、JLPSでの推定値の全体は確認していない。"}}, {"rank": 7, "field": "経営学", "headline": "新興企業の事業構想の時間的位置と初期資金", "title": "Timing the Future: Temporal Positioning and Initial Financing in Innovation Ecosystems", "url": "https://doi.org/10.2139/ssrn.7551200", "authors": "Linhui Wu ほか", "venue": "SSRN", "date": "2026-10-02", "why": "生態系の行方が見える前に事業構想をどこに置くかが資金調達に与える影響を扱い、イノベーション・エコシステムの戦略論に新しい視点を与える。", "id": "pn07", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "新興企業の事業構想が、業界の「これから」と「これまで」のどちらに近いかを文章の類似度で測る指標（時間的ポジショニング）を作り、初回の資金調達額と逆U字の関係にあることを3つのデータで示した（抄録）。", "p2": "新興企業は、エコシステムの方向性が見える前に事業構想を決める必要がある（抄録）。見慣れた構想は評価しやすいが選択肢の価値が小さく、新しい流れを先取りする構想は見返りが大きい可能性がある一方、評価も保護も難しい（抄録）。", "p3": "1950〜2023年の事業説明376,667件を使い、ある構想の「その後の事業説明との類似度」と「それ以前の事業説明との類似度」の比を時間的ポジショニングとする（抄録）。理論では、流れへの一致の利益と評価コスト・模倣されるリスクを比べ、逆U字の関係を予測する（抄録）。", "p4": "①ベンチャーキャピタルから資金を得た米国の37,916社の初回調達額、②2,669件の事業計画と22,533件の専門家評価（評価の一致）、③AI製品発見サイトの12,160製品の利用者の保存数、の3つのデータで検証する（抄録）。", "p5": "時間的ポジショニングと初回調達額は逆U字の関係で、勢いのある業界や変化の速いエコシステムでは曲線が平らで頂点がより先寄りだった（抄録）。先取りした構想は比較できる企業が現れる前は調達が少なく、その不利は比較企業の参入とともに小さくなった（抄録）。専門家は新規性と市場性が釣り合うと評価が一致し、AI製品では先取り度とともに保存数が逓減的に増えた（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：「その後の説明との類似度」は後から分かる情報で測っており、投資家が当時どう見えたかとのずれをどう扱ったか。資金を得た企業だけを見る選択の偏りも気になる。未査読のプレプリントである。", "fun": "新しすぎるアイデアは理解されず、古すぎるアイデアは魅力がない。この研究は、事業の説明文が「後の時代の説明」と「前の時代の説明」のどちらに似ているかで「時代の先取り度」を測った。すると、資金は先取りしすぎず遅れすぎない「ほどほど」の会社に一番集まった。ただし似た会社が後から現れると、先取りの不利は消えていく。「早すぎた天才」に数字で迫る点が面白い。", "unverified": "本文が読めず、文章類似度の計算方法と回帰モデルの統制変数は確認していない。"}}, {"rank": 8, "field": "機械学習", "headline": "強化学習の事後学習は解の多様性を削るか", "title": "Sharpening Tax in Post-Training", "url": "https://arxiv.org/abs/2610.01509", "authors": "Changdae Oh ほか", "venue": "arXiv（Hugging Face Daily Papers）", "date": "2026-10-02", "why": "強化学習による事後学習が既存の行動を鋭くするだけで解の網羅性を失うという仮説を定量的に検証しており、LLMの事後学習の理解に重要。", "id": "pn08", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§3〜5の主要部分、§8の結論、§9の限界）を読んだ。§6の理論と付録は見出しのみ", "preprint": true, "p1": "強化学習などの事後学習を施したLLMエージェントは1回で解く精度が上がる代わりに、何回も試せば解ける課題の範囲（カバレッジ）を失っていることを示し、その損失を1つの数で表す「Sharpening Tax（鋭化の税）」と、それを減らすサンプリング法PTGSを提案した（抄録）。", "p2": "事後学習は既存の行動を鋭くするだけで解の網羅性を犠牲にするという仮説は数学やコードで観察されてきたが、多ターンの道具使用を伴うエージェント課題では、事後学習で新たな能力が身につくため当てはまらない可能性があった（抄録、§3）。", "p3": "事後学習前のベースモデルに軽い推論の枠組み（ハーネス：簡単なシステムプロンプトと緩い道具呼び出しの解析）を付け、試行回数Kを増やしたときの成功率pass@Kの曲線を事後学習モデルと比べる（§3）。pass@Kとpass@kの差を積み上げた面積を1回目の失敗率で正規化した「較正済みスケーラビリティ」の減少を税とする（式1〜2）。PTGSは課題ごとの成功率をベータ分布で推定し、難しい課題ほど高い温度で多様にサンプリングする（§5）。", "p4": "4つのモデル系統の14組のベース/事後学習モデルと3つのエージェント・ベンチマーク（計42ケース）で税を測り、PTGSはQwen2.5-7B-Instructの強化学習で固定温度の基準と5つの乱数種で比べる（抄録、§4〜5）。", "p5": "ハーネスを付けたベースモデルは1回の精度は低いが、試行回数を増やすと事後学習モデルに追いつき、しばしば上回った（§3、図2）。事後学習は課題を「常に解ける」か「決して解けない」の両極に押しやり、税は128回の予算で42の組み合わせのうち36で正だった（抄録、§4）。PTGSは固定温度より税が小さく、くり返しのサンプリングでより多くの課題を解きつつ1回の精度も上げた（抄録）。", "p6": "著者は、分析した公開モデルの事前・事後学習のデータが不明なため分析は観察的で因果ではないこと、事後学習の種類ごとの違いは比べていないこと、文章ベースのエージェントに限ることを限界に挙げる（§9）。税の大きさはモデル規模とともに増えるとも述べる（§8）。", "fun": "試験勉強を重ねると、得意な問題は確実に解けるようになるが、ひらめきで解けていた変わった問題は解けなくなることがある。AIの追加学習にも同じことが起きていて、何十回も挑戦させると、追加学習前のAIのほうが多くの問題を解けた。この「確実さと引き換えに失った可能性」を税と名づけて測ったのが面白い。難しい問題ほど自由に考えさせる工夫で、両方を伸ばせることも示した。", "unverified": "§6の定理と付録の14組すべての税の値、PTGSの改善幅の具体的な数値（表）は確認していない。"}}, {"rank": 9, "field": "交通・都市計画", "headline": "交通補助金の公平性を4つの観点で再評価", "title": "What counts as equitable? Incidence, spatial allocation and accessibility outcomes of a supply-side transit subsidy", "url": "https://econpapers.repec.org/RePEc:osf:socarx:u2yvf_v1", "authors": "Luz, Gregorio ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "運行費・ICカード・車両GPSを組み合わせ、補助の帰着・空間配分・アクセシビリティ成果を一体で評価しており、交通政策の公平性評価の枠組みを広げる。", "id": "pn09", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex（SocArXiv）の抄録を使用", "preprint": true, "p1": "ブラジル・ベロオリゾンテのバス補助金について、誰が受け取るか、運賃負担、市内のどこに配分されるか、アクセスの公平性という4つの問いを一つのデータで同時に検証し、補助の公平性は一つの答えに決まらないことを示した（抄録）。", "p2": "公共交通の補助金が貧困層に役立つかは、通常「1回の乗車あたり誰がより多く受け取るか」で判断されるが、それは全体像の一部にすぎない（抄録）。", "p3": "運営事業者の支出、ICカードの乗車記録、車両のGPSを組み合わせ、車両の区間ごとの費用を計算して乗っている人に配分する（抄録）。そのうえで、運賃負担、市内の地域別の配分、累積型・重力型の多様なアクセシビリティ指標による公平性を、功利主義・十分主義・平等主義・ロールズ主義の4つの規範的な見方で評価する（抄録）。", "p4": "2022年から補助を受けている同市のバス網を対象に、所得五分位ごとの受取額と負担、地区ごとの配分、パラメータを広く変えたアクセス指標で検証する（抄録）。", "p5": "乗客の間では補助は累進的で、最貧五分位は最富裕五分位の1.68倍を受け取り、南の国々の先行研究と逆の結果だった（抄録）。一方、最貧五分位は所得が8.7分の1なのに運賃を最も多く払い、乗客の45.8%は運ぶ費用より多い運賃を払っていた（抄録）。配分は所得で見ると累進的だが、アクセスの不利で見ると逆進的だった（抄録）。功利主義と十分主義の判定はほぼ安定し、平等主義とロールズ主義の判定は指標と設定で変わった（抄録）。", "p6": "著者は、一つの問いに答えて止めることは誤りではないが部分的であり、代替の答えを報告しなければ選択と区別できないと述べる（抄録）。残る疑問：一都市の事例で、補助の制度設計（車両キロあたりの支払い）が異なる都市への一般化は限られる。未査読のプレプリントである。", "fun": "バスの補助金は貧しい人の役に立っているか。答えは「どの物差しで測るか」で変わった。受け取る額では貧しい人ほど得をしているのに、地域で見ると、行きたい所に行きにくい地域ほど恩恵が少ない。同じデータでも見方を変えると結論が逆になる、だから一つの数字だけで「公平」と言い切らないことが大事だ、という教訓が面白い。", "unverified": "本文が読めず、アクセシビリティ指標の具体的な設定と地区別の結果の図は確認していない。"}}, {"rank": 10, "field": "統計学", "headline": "空間動学ベイズ木で世代間移動と所得格差", "title": "Dynamic Spatial Bayesian Machine Learning Model: Applications to Intergenerational Economic Mobility and Geographic Income Inequality in the United States", "url": "https://arxiv.org/abs/2610.00072", "authors": "Hammed A. Olayinka ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "高次元の時空間パネルに対する空間動学BARTを開発し、既存の空間計量モデル群と比較したうえで米国の世代間移動と地域格差に適用している。", "id": "pn10", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§7の結論）と目次を読んだ。§2のモデル式、§3のシミュレーション、§5〜6の適用結果の表は見出しと結論部分のみ", "preprint": true, "p1": "地域×時点の高次元パネルデータに対し、空間的な波及と時間変化、個人単位の非線形性を一つのベイズモデル（DSP-BART-HS：動的空間パネルのベイズ加法回帰木にホースシュー縮小を組み合わせたもの）で扱い、既存の空間計量モデルや機械学習より安定して予測できることを示した（抄録）。", "p2": "地域と時点で集計したデータを使う従来の手法は、個人単位の非線形な関係が結果のばらつきを生むと大きく性能が落ちる（抄録）。空間計量経済学と木のアンサンブル法は、それぞれ片方の構造しか捉えられない（§7）。", "p3": "回帰木の和（BART）で個人単位の非線形な関係を柔軟に表し、地域間の空間的な拡散と時間の動きを加え、多数の文脈変数の係数にホースシュー事前分布（必要な変数だけを残す縮小）を置いてギブスサンプラーで推定する（抄録、§2）。", "p4": "不規則な空間配置、密な政策効果、個人単位の非線形な交互作用などを含む9つのデータ生成シナリオ（各200回）で、構造的空間計量モデル、非パラメトリック機械学習、小地域推定と比べる（抄録）。実データでは米国の郡単位の世代間の経済的移動と所得格差の2つのパネルで、未見の地域・無作為・時間方向の保留検証を行う（抄録）。", "p5": "DSP-BART-HSはすべてのシナリオで最良か最良と統計的に区別できなかった（抄録）。集計データを使う比較手法は、個人単位の非線形性が効くと3倍以上の誤差で後れをとった（抄録）。実データでは、構造の異なる5つのモデルが8つの共線的な郡の共変量のうち5つ（人種構成、貧困、過去の雇用、住宅費用など）で符号と有意性が一致した（§7）。", "p6": "著者は、時間方向の外挿では軽い地域別自己回帰モデル（MTS-CAR-X）が一貫して優れることを明確な限界とする（抄録）。また、選ばれた共変量は頑健な予測上の相関であって因果的な政策手段ではなく、観測されない郡の特徴との交絡には対処していないと明記する（§7）。未査読のプレプリントである。", "fun": "どこの町で生まれると親より豊かになりやすいか、という問いには、町と町のつながり、時代の変化、一人ひとりの事情が絡み合う。この研究は、その3つを一度に扱える統計モデルを作り、未知の町についても予測できるかを試した。ただし「どの要因が効いているか」は予測の手がかりであって原因とは限らない、と著者自身がはっきり断っている点も誠実で面白い。", "unverified": "シミュレーションの各シナリオの誤差の数値と、実データの保留検証の詳細な結果（表）は確認していない。"}}, {"rank": 11, "field": "組織行動・心理的安全性", "headline": "利用者ごとのAIエージェントが集まると成績が落ちる", "title": "Worse Together: How Performance Breaks Down in Multi-User Multi-Agent Teams", "url": "https://arxiv.org/abs/2610.00583", "authors": "Sahan Paliskara ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "異なる利用者の目的を代理するAIエージェント同士が共有資源で協調に失敗し、一人に任せるより悪くなる状況を体系的に調べた研究。", "id": "pn11", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、目次、§8の限界）を読んだ。§3〜7の各環境の詳細結果と付録は見出しのみ", "preprint": true, "p1": "異なる利用者の代理として働くAIエージェントが、予算・予定表・共同注文などの共有資源をめぐって集まると、1つのエージェントが全員に仕えるより集団の結果が一貫して悪くなることを、5つの最先端モデルと77の場面で示した（抄録）。", "p2": "人がAIエージェントに仕事を任せることが増え、そのエージェント同士が共有資源で出会う場面も増えているが、各エージェントが別々の利用者の目標を追うときの協調の失敗は体系的に調べられていなかった（抄録）。", "p3": "計算予算を共有するAPIキー環境、予定表を共有するクリニック、共同注文・予約を共有する個人アシスタント、リリースの締め切りを共有するマージキューの4環境で、全員に仕える1体の調整役と、利用者ごとに1体ずつのチーム（エージェント間の通信あり・なし）を比べる（抄録）。", "p4": "集団としての結果（共有資源の使い方、利用者の要望が満たされた割合など）を環境のログから機械的に採点し、同意や虚偽の主張はClaudeによる判定で付ける（抄録、§8）。", "p5": "すべての環境でチームは調整役より悪い集団の結果を出し、通信がないと2つの環境で完全に崩壊し、通信があっても協調の負担が大きな差を生んだ（抄録）。個人アシスタント環境では、調整役が特定の利用者の要望を満たす頻度はチームの約2倍だった（抄録）。人数が増えると止まってしまう、互いの操作を上書きする、事実でない主張を作るといった行動が見られた（抄録）。チームリーダー、明示的な手順の指示、他者のメッセージを読ませてから確定させる仕組みが、環境によって有効だった（抄録）。", "p6": "著者は、実験が高価（74場面を1回まわすのに約34億トークン）で結果が確率的にばらつくこと、同意と虚偽の判定に使ったClaudeの判定を人の判断と照合していないこと、こうした場面のための標準的な仕組みがないことを限界に挙げる（§8）。未査読のプレプリントである。", "fun": "一人の秘書がチーム全員の予定を調整すればうまくいくのに、一人ひとりに別々の秘書がつくと、それぞれが自分の主人を優先して予約を取り合い、全体はかえって混乱する。この研究は、AIエージェントでまさにそれが起きることを示した。賢いAIを集めても良いチームになるとは限らない、という人間の組織と同じ問題が見えるのが面白い。", "unverified": "環境ごとの詳細な数値（崩壊の程度、対策ごとの改善幅）と使った5つのモデル名は確認していない。"}}, {"rank": 12, "field": "因果推論", "headline": "二者関係データの因果的波及を標的試験で定式化", "title": "Beyond Actor-Partner Associations: A Target-Trial Framework for Causal Spillover Effects in Longitudinal Dyadic Data", "url": "https://arxiv.org/abs/2610.00181", "authors": "Subir Hait", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "カップルなど二者の縦断データでの相手への効果を、標的試験の枠組みで因果効果として定式化しており、APIMの解釈を厳密にする。", "id": "pn12", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、目次、§7.2〜7.3の解釈と限界）を読んだ。§2〜5の定式化・推定・シミュレーションの詳細は見出しのみ", "preprint": true, "p1": "夫婦などの二者関係データで、本人と相手への効果を表すAPIM（行為者-パートナー相互依存モデル）の係数がいつ因果効果になるかを、二者関係の標的試験（target trial）として定式化し、二人の処置の確率を別々に掛け合わせる推定がどれほど偏るかを閉じた式で示した（抄録）。", "p2": "APIMは一方の曝露が本人と相手の結果にどう関連するかを記述するが、その係数は追加の設計と識別の仮定がなければ因果効果ではない（抄録）。二者関係の研究では関連を因果と読み過ぎることが繰り返されてきた（§1.2）。", "p3": "二者内の干渉（相手の処置が自分の結果に影響する）を許す潜在アウトカムで因果の推定対象を定義し、同時の交換可能性・正値性・正しく特定された条件付き平均の下でAPIMの係数が因果対比と一致することを示す（抄録）。二値処置では、二人の傾向スコアを掛け合わせると、誤差δ(H)=Cov(A₁,A₂|H)という1つのパラメータのずれが生じ、4つのセルの誤差は(+δ,−δ,−δ,+δ)になる（抄録）。推定には同時傾向スコアによるIPWとAIPW、交差適合を使う（§4）。", "p4": "36シナリオのシミュレーションと真の周辺確率を使った分解の診断で、偏りの源を調べ、米国の健康と退職調査（HRS）の2,400組の夫婦で、退職の移行とその後の抑うつ症状に適用する（抄録）。", "p5": "残る依存が強いと、別々の傾向スコアによる大きな偏りは主に掛け合わせ（分解）によるもので、柔軟なAIPWは非線形モデルの偏りを減らすが支持の弱さによる不安定は減らさなかった（抄録）。最も強い依存の条件では、真の周辺確率を掛け合わせても波及の対比の符号が逆転し、交互作用は真値の約5倍に膨らんだ（抄録）。HRSでは夫婦そろっての退職がまれで（40組）、推定は支持域と傾向スコアの下限設定に敏感だった（抄録、§7.2）。", "p6": "著者は、この枠組みは観測されない交絡を解決せず、同時の交換可能性は検証できない仮定であること、コホートの構成が基準時点後の情報を使っていることを限界に挙げ、HRSの結果は退職が抑うつに影響しないという結論ではなく診断として読むべきだと述べる（§7.2〜7.3）。貢献は新しい一般理論ではなく、APIMの問いを因果分析につなぐ設計と診断の橋渡しだとしている（抄録）。", "fun": "夫が退職すると妻の気分が変わる、というように、二人組では相手の行動が自分にも影響する。でも夫婦は退職の時期を相談して決めることが多いので、二人の「退職する確率」を別々に計算して掛け合わせると、効果の向きが逆に見えることさえある。二人の決定が独立でないことを無視すると統計がどう壊れるかを、きれいな式で示したのが面白い。", "unverified": "§5のシミュレーション結果の表と、HRSでの効果の推定値そのものは確認していない。"}}, {"rank": 13, "field": "開発経済学", "headline": "小規模農家向け天気予報の改善競争を設計する", "title": "Can we create a `race to the top' for weather forecasts to inform smallholder farmer decisions?", "url": "https://arxiv.org/abs/2610.00782", "authors": "Colin Aitken ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "AI天気予報で低中所得国の農家向け予報を安く作れる状況で、予報の質を競わせる仕組みを論じており、開発分野での技術活用に示唆がある。", "id": "pn13", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論と概要、表1の原則と例）を読んだ。補足資料の各原則の詳細な手順は見出しのみ", "preprint": true, "p1": "AI天気予報で安く作れるようになった農家向けの天気予報について、質の低い予報が良い予報を駆逐する「底辺への競争」を防ぎ、予報の質を信頼できる形で示すための原則と手順（品質基準の出発点）を提案した（抄録、§1）。", "p2": "AI天気予報は少ない計算資源で高品質の予報を作れるため、新興企業や研究者も農業向け予報を作り始めたが、資金提供者や政府が予報の質を見分けるのは難しい（§1）。見分けられないと、情報の非対称性による市場の失敗として、安くて質の低い予報が広がる恐れがある（§1）。", "p3": "気象学、社会科学、統計学、計算機科学の評価の良い実践を集め、①透明性（独立の評価者が主張を再現できる情報を出す）、②適切な評価（気候値や公開モデルなど意思決定に関わる比較対象と比べ、指標を都合よく選ばない）、③標本外の技能の実証、④意思決定への関連性、の4原則と、それぞれの手順の例と失敗例を示す（§1、表1）。", "p4": "これは実証研究ではなく提案で、表1と補足表S1の点検表が評価の枠組みになる（§1）。具体例として、学習に使ったのと同じデータで弱い気候値と比べて「30%改善」と主張する例や、公開モデルなら45%改善できるのに30%改善の製品を高く買ってしまう例を挙げる（表1）。", "p5": "結果は原則と手順の提案そのもので、数値の検証結果はない（§1）。著者は、AI天気予報は過去のほぼ全データで学習しているため、同じ時期の観測で検証すると誤った安心を与えうることや、見た目だけ現実的な「農場単位」の予報は検証データが得られないことを指摘する（§1）。", "p6": "著者は、これを利害関係者の合意形成のための出発点と位置づけ、普及の過程の質（原則4）は予報の検証ほど深く扱っていないと述べる（§1）。残る疑問：認証の仕組みを誰が運営し、費用をどう負担するか。未査読のプレプリントである。", "fun": "天気予報の良し悪しは、実際に雨が降るまで分かりにくい。だから、安くていい加減な予報と、手間をかけた良い予報が同じ値段で売られると、良い予報が負けてしまうかもしれない。中古車市場で「はずれ」の車ばかりが残る話と同じ構図だ。この論文は、農家を守るために「予報の成績表の書き方」のルールを先に決めよう、と提案している。", "unverified": "補足資料の各原則の詳細な手順と、§1で触れられた2つの具体例（Illustrative Example 1・2）の中身は確認していない。"}}, {"rank": 14, "field": "経済学", "headline": "予測市場Polymarketの取引・気配と価格発見", "title": "Trades, Quotes, and Price Discovery in Prediction Markets&nbsp;", "url": "https://doi.org/10.2139/ssrn.7547106", "authors": "Pat Akey ほか", "venue": "SSRN", "date": "2026-10-01", "why": "オンチェーンの全取引と気配値で予測市場の流動性と価格発見を詳細に記述しており、予測市場の市場構造の基礎的な実証。", "id": "pn14", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "予測市場Polymarketの全オンチェーン取引とティック単位の最良気配から、価格発見の大部分は取引ではなく気配の更新が担っていることを示した（抄録）。", "p2": "背景：予測市場の価格は出来事の確率の予測として使われるが、その価格がどのように形成され、どれだけ正確かを、市場の微細構造（取引と気配）のデータで調べた研究は限られる。", "p3": "全取引記録とティック単位の最良気配を使い、スプレッド・板の厚さを記述し、ベクトル自己回帰（VAR）で効率的な価格の変動のうち取引による部分と気配の更新による部分を分ける（抄録）。", "p4": "スプレッドと板の厚さの価格帯ごとの違い、取引のない時間帯の割合と価格変動への寄与、VARの分散分解、中値と直近取引の予測精度を評価する（抄録）。", "p5": "スプレッドは価格0ドルと1ドル付近で最も狭く板が厚く、0.50ドル付近で最も広く薄かった（抄録）。1分間の99%で取引がないが、その時間帯が価格変動の76%を占めた（抄録）。VARでは効率的価格の変動の分散のうち取引による部分は最大4%で、気配の更新がその数倍の価格発見を担った（抄録）。中値はスプレッドが狭いと正確な予測で、直近取引はわずかに正確だが時間が経つと精度が落ちた（抄録）。", "p6": "抄録に限界の記述はない。残る疑問：取引がほとんどない市場が多い中で、どの市場を分析対象に含めたか、結論が出来事の種類によって変わるかは本文で確かめる必要がある。未査読のプレプリントである。", "fun": "「明日雨が降る確率」を売り買いする市場では、値段がそのまま確率の予想になる。ところが調べると、1分のうち99%は誰も売り買いしていないのに、値段の動きの大部分はその静かな時間に起きていた。実際の取引より「この値段なら買う・売る」という掲示の出し直しが情報を運んでいるのだ。市場は取引だけでなく、待っている注文も語っていることが分かる。", "unverified": "本文が読めず、対象市場の数と期間、VARの設定は確認していない。"}}, {"rank": 15, "field": "機械学習", "headline": "強化学習は追加学習なしに強い方策を作れる", "title": "Does Scaling Reinforcement Learning Really Require More Training?", "url": "https://arxiv.org/abs/2610.01133", "authors": "Bangji Yang ほか", "venue": "arXiv", "date": "Fri, 02 Oct 2026", "why": "完了した強化学習の履歴から、最適化が通過しなかったより強い方策を作れることを示し（方策空間のスケーリング）、計算資源の使い方に新しい選択肢を示す。", "id": "pn15", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§3.2の結果、§5の結論）を読んだ。§2の手法の詳細、§3.3以降、付録は見出しのみ", "preprint": true, "p1": "終わった強化学習の訓練履歴の中の2つのチェックポイントを重みの上で組み合わせるだけで、追加の学習も推論時の計算の増加もなしに、訓練中に通過したどのチェックポイントより強い方策を作れることを示した（方策空間のスケーリング）（抄録）。", "p2": "推論能力を伸ばすには、強化学習の計算を増やすか推論時の計算を増やすのが普通で、訓練の履歴そのものを資源として使う方法はほとんど考えられていなかった（抄録、§1）。", "p3": "SURGEは、精度の高い「アンカー」と、短い応答を出す競争力のある「ドナー」の2つのチェックポイントを、共通の初期値からの変化量として表す（抄録）。アンカーの変化量を特異値分解して主要な成分を残し、そこにドナーの補完的な成分を加える（抄録）。アンカーの変化量をどれだけ残すかの目標を固定すると、候補の方策を試さずに重みだけからブロックの大きさが決まる（抄録）。", "p4": "1.5Bの数学推論の2つの訓練履歴（DeepSeek、Nemotron）と7Bのコード生成の履歴（OLMo）で、9つのベンチマークの平均正解率と推論トークン数を、元の2つのチェックポイントや訓練中の全チェックポイントと比べる（抄録、§3）。", "p5": "DeepSeekのAIME24では、訓練中に測った最高の50.83%を上回る54.17%に達し、トークン数はアンカーの8,065に対し7,798だった（§3.2）。9ベンチマークの平均は53.26%から55.35%に上がり、トークンは5.3%減った（§3.2）。Nemotronでも平均が63.29%から65.08%に上がりトークンは12.8%減り、OLMoのHumanEval+は82.8%から83.7%になった（抄録、§3.2）。", "p6": "本文で読んだ範囲に限界の独立した節はなく、著者は構築と評価のコストを明示したうえで、展開は単一の方策で済むと述べる（§5）。残る疑問：検証は3つの訓練履歴のみで、改善幅は数ポイント程度であり、ベンチマークの評価のばらつき（付録C）と比べた頑健性は本文で確かめる必要がある。未査読のプレプリントである。", "fun": "山登りの途中で撮った2枚の地図をうまく重ね合わせたら、実際には通らなかった、もっと高い地点が見つかった、というような話だ。AIの訓練は途中経過をたくさん保存しているが、普通は「一番成績の良い1つ」だけを使う。この研究は、その途中経過の組み合わせに、訓練では一度も到達しなかったより強いAIが隠れていることを示した。追加の学習なしで性能が上がるのが面白い。", "unverified": "§3.3〜3.5の結果（7Bコードの詳細、アブレーション）と付録の評価のばらつきは確認していない。"}}, {"rank": 16, "field": "経済学", "headline": "中国の報復関税下での米国産品の関税回避", "title": "Washing Away the US: Tariff Evasion Under China's Retaliatory Tariffs", "url": "https://doi.org/10.2139/ssrn.7548817", "authors": "Huijia Liu ほか", "venue": "SSRN", "date": "2026-10-01", "why": "品目別貿易データと段階的DiDで、報復関税に対する原産地偽装などの関税回避を示しており、貿易政策の実効性評価に重要。", "id": "pn16"}, {"rank": 17, "field": "経済学", "headline": "中国の廃棄物輸入禁止の環境効果と生産調整", "title": "Environmental Gains and Production-side Adjustment under Trade Restrictions: Evidence from China's Waste Import Ban&nbsp;", "url": "https://doi.org/10.2139/ssrn.7547118", "authors": "Zihan Zhang", "venue": "SSRN", "date": "2026-10-01", "why": "2017年の輸入禁止を使い、環境改善と輸入原料の制約による生産の歪みのトレードオフを実証している。", "id": "pn17"}, {"rank": 18, "field": "経済学", "headline": "中国はIPO市場へのアクセスで産業政策を行う", "title": "Industrial Policy via the IPO Market", "url": "https://doi.org/10.2139/ssrn.7546843", "authors": "Zhiguo He ほか", "venue": "SSRN", "date": "2026-10-01", "why": "政策上優遇される業種であることがトービンのqよりもIPOを予測することを示し、資本市場を通じた産業政策の実態を明らかにする。", "id": "pn18"}, {"rank": 19, "field": "経済学", "headline": "アルゼンチンの非自動輸入許可と川下企業", "title": "The Downstream Consequences of Non-Tariff Trade Barriers: Theory and Evidence from Import Licenses in Argentina", "url": "https://doi.org/10.2139/ssrn     var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
