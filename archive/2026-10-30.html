補正する（抄録）。具体的なデータと推定の手順は抄録にない（未確認）。", "p5": "抄録には結果の記述がない（未確認）。", "fun": "広告を見た人が商品を買ったからといって、広告が効いたとは限らない。もともと買いそうな人にAIが広告を見せているかもしれないからだ。この研究は、比べる相手がいない「穴」を、表の空欄を周りの数字から埋めるような方法で補い、広告の本当の効果を測ろうとしている。", "unverified": "抄録が1文のみで、手法の詳細と結果は未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "子どもの健康ショックが不平等を次世代に伝える", "title": "Childhood Health Shocks and the Intergenerational Transmission of Inequality", "url": "https://doi.org/10.1257/pol.20240586", "authors": "Tine M. Eriksen ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "国民皆保険の国で、治療可能な単一の慢性的な子どもの健康ショックが、成人後の労働市場で社会経済的な勾配のある不利益をもたらすことを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "誰もが医療を受けられる国でも、子ども時代の慢性で治療可能な一つの健康ショックが、大人になってからの労働市場での不利に社会経済的な勾配を生むことを示した（抄録）。", "p3": "子ども時代に発症する1型糖尿病を対象に、デンマークの行政登録データと因果フォレストで、30歳時点の就業と所得の不利のばらつきを推定した（抄録）。", "p5": "就業と所得の不利には大きなばらつきがあり、親の所得と母親の学歴によって系統的に異なった（抄録）。所得と健康の勾配の説明を助け、医療制度の設計の議論に重要な含意があるとした（抄録）。", "fun": "医療費の心配がない国なら、子どもの病気が将来に響く度合いは誰でも同じだろうか。デンマークで子どものころ1型糖尿病になった人を調べると、30歳のときの働き方や収入への影響は、親の収入や母親の学歴によって違っていた。同じ病気でも、育った家庭によって影響の大きさが違うということだ。", "unverified": "不利の大きさの数値は抄録にない（未確認）。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "税政策の変動から脱税の度合いを識別", "title": "Identifying Tax Compliance from Variation in Tax Policy: Theory and Empirics", "url": "https://doi.org/10.1257/pol.20240812", "authors": "Andrew Bibler ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "税ルールの変更を使い、脱税の度合いと需要・供給の弾力性を同時に点識別する一般的な方法を開発した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "政府が脱税対策に税の規則の変更を使うことが増える中、税の遵守の度合いを、供給と需要の弾力性とともに点識別する一般的な方法を作った（抄録）。", "p3": "識別には価格と数量のデータ、税制の変化、需要か供給を動かす要因が必要で、プラットフォームを通じて法定の負担を貸し手から借り手に移すAirbnbの徴収協定のデータで例示した（抄録）。", "p5": "執行の前には、Airbnbの取引のおよそ0〜1.6%でしか税が払われていなかった（抄録）。", "fun": "民泊の宿泊税は本来、部屋を貸す人が払うはずだが、実際にどれだけ払われているかは誰にもわからない。この研究は、税の取り方が変わったときの値段と利用数の動きから、払われていた割合を逆算する方法を作った。すると、Airbnbが代わりに集める前に税が払われていたのは、およそ0〜1.6%の取引だけだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "研究開発減税の効果、ミクロとマクロのずれを解消", "title": "How Effective Are R&D Tax Incentives? Reconciling the Micro and Macro Evidence", "url": "https://doi.org/10.1257/pol.20240883", "authors": "Silvia Appelt ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "公式の研究開発調査の分散型の分析で、企業レベルでは大きく集計では小さい研究開発減税の効果の食い違いを説明した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "企業単位の研究ではR&D税制優遇が企業のR&D投資を大きく刺激するのに、集計の分析ではそれほどでもないという食い違いを、OECD19か国のミクロデータで説明した（抄録）。", "p3": "公式のR&D調査と税の優遇の行政ミクロデータを、各国で分散して分析する方法で19か国について調べた（抄録）。", "p5": "第1に、多くの国で優遇の利用が限られるため、集計の研究は効果を過小に見積もる（抄録）。第2に、優遇は大規模でR&D集約的な企業には（はるかに）効きにくく、そうした企業はR&Dを行う企業の小さな割合だが、優遇の総額の大部分を受けていた（抄録）。", "fun": "研究開発にかけたお金の一部を税金から差し引く制度は、企業の研究を増やすのだろうか。19か国のデータを調べると、小さな企業にはよく効くが、優遇の大半を受け取っている大企業にはあまり効いていなかった。国全体で見ると効果が小さく見えるのはそのためだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "低所得の被告の弁護における人種の役割", "title": "The Role of Race in the Legal Representation of Low-Income Defendants", "url": "https://doi.org/10.1257/pol.20240685", "authors": "Maya Mikdash ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "裁判所が選任する弁護士の準無作為な割り当てを使い、低所得の被告の弁護で人種が果たす役割を検証した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "低所得の被告人を弁護する国選弁護人の人種が弁護の結果に関わるかを、事件への弁護人の準無作為な割り当てを使って調べた（抄録）。", "p3": "同じ人種の被告人のために、弁護人がより良い取引を勝ち取るかを検定した（抄録）。", "p5": "黒人と白人の弁護人は白人の被告人を同程度に効果的に弁護したが、黒人の被告人は黒人より白人の弁護人がついた場合に、起訴の取り下げが14〜16%起こりやすく、収監が15〜26%起こりにくかった（抄録）。異なる人種の弁護人がつくことで将来の再犯が増える証拠はなかった（抄録）。", "fun": "国が用意する弁護士の人種で、裁判の結果は変わるのだろうか。くじのように割り当てられる弁護士を調べると、黒人の被告人は白人の弁護士がついたときの方が、起訴を取り下げられやすく、刑務所に入りにくかった。同じ人種の方が有利とは限らないという意外な結果だ。", "unverified": "対象の地域・期間と、差が生じる理由は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "組織的な小売犯罪は価格に転嫁される", "title": "The Pass-Through of Retail Crime", "url": "https://doi.org/10.1257/pol.20240889", "authors": "Carl Hase ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "大麻小売の店舗単位の犯罪データと全取引のスキャナーデータを結合し、組織的な小売犯罪に対して小売業者が価格を引き上げることを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "組織的な小売犯罪に対して小売店が価格を上げることを、ワシントン州の大麻小売店で示した（抄録）。", "p3": "店舗単位の犯罪データを全取引のスキャナーデータと結びつけ、強盗と侵入窃盗による準実験的な変動を用いた（抄録）。", "p5": "被害店と近くの競合店で価格が1.7〜1.8%上がり、短中期の需要変化でなく犯罪関連の費用ショックと整合し、独立店や集中度の低い市場で効果が大きかった（抄録）。犯罪は被害店に1%の「隠れた」単位税を課すのに等しく、主に消費者が負う追加の社会的費用は3,070万ドルと推定した（抄録）。", "fun": "お店が強盗にあうと、その損は誰が払うのか。アメリカの大麻の販売店を調べると、被害を受けた店だけでなく近くの店まで値段を1.7〜1.8%上げていた。犯罪の費用は、最後には何も盗んでいない買い物客が負担しているということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "法人減税は小企業と労働者に何をもたらすか", "title": "Impacts of Corporate Tax Cuts on Firms and Workers: Evidence from Small Businesses", "url": "https://doi.org/10.1257/pol.20240813", "authors": "Yige Duan ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "カナダ・ケベック州の改革で、減税を受けた小企業が拡大し、その労働者の収入が増えることを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "法人税の減税が小企業とその従業員に与える効果を、カナダ・ケベック州の改革で調べた（抄録）。", "p3": "減税を受けた企業とその従業員を、受けなかった企業と従業員と比べた（抄録）。", "p5": "減税を受けた企業は拡大し、従業員の所得が増えた（抄録）。全体として従業員が税負担の35%を負い、勤め先の企業の所有権を持つ人では利益の増加を通じて帰着がより大きく、企業内の所得分布の各三分位の従業員が恩恵を受けた（抄録）。小さな職場では税引き後の利益が増えると公正な賃金への配慮が働くためかもしれないとした（抄録）。", "fun": "会社の税金を下げると、得をするのは社長だけだろうか。カナダの小さな会社を調べると、減税で会社が大きくなり、社員の給料も上がっていた。給料の高い人から低い人まで恩恵があったのは、小さな職場では「もうけが増えたなら皆に分けるべきだ」という感覚が働くからかもしれない。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn23", "rank": 23, "field": "経済学", "headline": "中国の排出量取引制度の一般均衡評価", "title": "China’s Nationwide CO 2 Emissions Trading System: A General Equilibrium Assessment", "url": "https://doi.org/10.1257/pol.20240652", "authors": "Lawrence H. Goulder ほか", "venue": "American Economic Journal: Economic Policy", "date": "2026-10-29", "sjr": 7.737, "citescore": 9.4, "citescore_year": "2025", "why": "世界最大の中国の排出量取引制度（取引可能な原単位基準）を一般均衡で評価し、総量規制型との違いを分析した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "世界最大の中国の全国CO2排出量取引制度は、総量規制型（C&T）と異なる取引可能な性能基準（TPS）であり、その費用と分配の影響を、中国の制度と財政の特徴を考慮した動学的一般均衡で評価した（抄録）。", "p3": "制度と財政の特徴を組み込んだ動学的一般均衡モデルで、TPSと総量規制型を比べ、補完的な排出枠の供給としてのオークションの導入を検討した（抄録）。", "p5": "TPSの環境上の便益は費用の5倍以上で、財政制度との相互作用は総量規制型に比べた費用面の不利を縮小または解消した（抄録）。オークションを補完的な排出枠の供給源として導入すると費用を30%下げられた（抄録）。", "fun": "二酸化炭素を出す権利を売り買いする仕組みには、出す量の上限を決める方式と、生産量あたりの排出の基準を決める方式がある。中国は後者を選んだが、この研究の計算では、環境への利益は費用の5倍以上あり、排出枠の一部を競売にすれば費用を30%下げられるという。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "物言う株主への反論で信用を傷つける防衛戦略", "title": "Winning at Defense by Playing Offense: Discrediting by Target Firms in Activist Hedge Fund Campaigns", "url": "https://doi.org/10.1177/01492063261479303", "authors": "Matthias Brauer ほか", "venue": "Journal of Management", "date": "2026-10-28", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "アクティビスト・ヘッジファンドへの反論の手紙での信用の毀損を、情報源と主張の2つの型に分け、防衛の成功との関係を理論化・検証した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "アクティビスト・ヘッジファンド（AHF）の攻撃を受けた企業の経営陣と取締役が、公開の反論書簡で相手の評判を傷つける「信用失墜」を使うことで防衛に成功できるかを、印象管理の理論から調べた（抄録）。", "p3": "相手の評判を直接攻撃する「送り手に向けた信用失墜」と、主張の妥当性に異を唱えて間接的に評判を損なう「内容に向けた信用失墜」を区別する分類を作り、米国のAHFの攻撃（2000〜2023年）で出された841通の反論書簡を手作業で内容分析した（抄録）。", "p5": "両方の型が防衛の成功を高め、組み合わせたときに特に効果的で、AHFの公開の攻撃から反論までの時間が長いほど効果が薄れるという予測が頑健に支持された（抄録）。", "fun": "物言う株主から「経営がなっていない」と攻撃された会社は、どう守ればよいのか。841通の反論の手紙を読み比べると、相手の評判と主張の両方を突く反論がよく効き、しかも反論が遅れるほど効き目が落ちていた。守りでも攻めが大事で、しかも早さが勝負だということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "売上に基づくCEO報酬がサプライチェーンに波及", "title": "Sales-Based CEO Incentives and Their Effect Across the Supply Chain", "url": "https://doi.org/10.2308/tar-2024-0591", "authors": "Jen Choi", "venue": "The Accounting Review", "date": "2026-10-28", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "CEOの報酬に売上の指標を使うことが、企業と取引先の業務にどのような影響を与えるかを調べた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "CEOの報酬契約で売上の業績指標を使うことが、企業とその供給業者の業務にどう影響するかを調べた（抄録）。", "p3": "売上指標はコスト管理を促さない狭い指標であるとして、CEOの賞与契約での使用と在庫の変動、ブルウィップ効果（需要より生産の変動が大きくなり、供給業者が受ける注文の変動が増す現象）の関係を分析し、報酬コンサルタントを通じた企業のつながりを操作変数に使った（抄録）。", "p5": "売上指標の使用は在庫の変動と関連してブルウィップ効果を高め、供給業者が直面する注文の変動を大きくしていた（抄録）。CEOの報酬契約が経済的につながる企業に波及することを示した（抄録）。", "fun": "社長のボーナスを売上で決めると、会社の在庫が大きく揺れやすくなる。その揺れは部品を納める取引先に伝わり、注文の量が大きく揺さぶられる。一つの会社の社長の給料の決め方が、取引先の経営まで振り回してしまうという話だ。", "unverified": "標本の規模と効果の大きさは抄録にない（未確認）。"}}, {"id": "jn26", "rank": 26, "field": "経営学", "headline": "支持区間しか分からない場合の頑健なオークション", "title": "Robust Auction Design with Support Information", "url": "https://doi.org/10.1287/mnsc.2023.02703", "authors": "Jerry Anunrojwong ほか", "venue": "Management Science", "date": "2026-10-28", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "買い手の評価の分布が未知で、その範囲（支持区間）だけが分かる売り手の頑健なオークション設計を導いた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "買い手の評価額の分布を知らず、その範囲[a, b]だけを知る売り手が、n人の買い手に1つの品物を売るときの頑健なオークションの設計を解析した（抄録）。", "p3": "支配戦略で誘因両立的な仕組みの中から、買い手の評価額を知っていれば得られた理想の期待収入に対する最悪時の成績を最適化する問題を考え、後悔と比率の2つの目的を統一して、最適な仕組みとその成績を範囲の情報と買い手の数の関数として準閉形式で導いた（抄録）。", "p5": "a/bが閾値より小さいと無作為な留保価格つきの第二価格オークション（SPA）が最適で、別の閾値より大きいとSPAは厳密に最適でなく、最高値が閾値以下なら無作為な買い手に配分する新しい「プーリング・オークション（POOL）」が最適になり、その間では両者の無作為化が最適だった（抄録）。標準的な仕組みから外れることが頑健性に必要だと示した（抄録）。", "fun": "オークションの売り手が、買い手がいくらまで払うつもりか分からず、「だいたいこの範囲」としか知らないとき、どんな売り方が一番安全だろう。この研究は、範囲が狭いときは、一番高い値をつけた人に必ず売るのではなく、時にはくじで買い手を選ぶ方がよいことを数学的に示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn27", "rank": 27, "field": "経営学", "headline": "規模を調整できない硬直性が負債比率を説明", "title": "Inflexibility and Leverage", "url": "https://doi.org/10.1287/mnsc.2024.08672", "authors": "Lifeng Gu ほか", "venue": "Management Science", "date": "2026-10-29", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "企業が規模を調整しにくい硬直性が資本構成のばらつきを持続的に説明し、硬直性が高いほど負債が低いことを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "企業が規模を調整しにくい「硬直性」が、資本構成の違いを持続的に説明することを示した（抄録）。", "p3": "包括的な標本と無作為に選んだ部分標本で硬直性の指標と財務レバレッジの関係を推定し、資本や労働の調整費用を表す他の変数と比べ、信用供給のショックへの反応や操作変数推定でも確かめた（抄録）。", "p5": "硬直性が高いほど財務レバレッジは低く、これは債務不履行のリスクの高さと節税効果の価値の低さによる可能性があり、縮小の硬直性は拡大の硬直性よりレバレッジを強く左右した（抄録）。硬直的な企業は信用供給の正のショックの後にレバレッジをより大きく増やした（抄録）。", "fun": "事業を縮めにくい会社ほど、借金を控えめにしていた。景気が悪くなっても規模を減らせないと、借金の返済に困りやすいからだと考えられる。この研究は、会社の「身動きのとりにくさ」を測り、それが借金の多さを、調整の費用を表す他の指標よりよく説明することを示した。", "unverified": "標本の規模・期間と効果の大きさは抄録にない（未確認）。"}}, {"id": "jn28", "rank": 28, "field": "経営学", "headline": "回帰ベースの次元削減で価格決定核を推定", "title": "Estimating the Pricing Kernel: A Simple Regression-Based Dimension-Reduction Approach", "url": "https://doi.org/10.1287/mnsc.2025.03608", "authors": "Bin Luo ほか", "venue": "Management Science", "date": "2026-10-28", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "因子空間での平均分散効率的なポートフォリオを最小二乗の定式化で作り、価格決定核を推定する簡単な枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "最小二乗法にLASSOの正則化を組み合わせて平均・分散で効率的なファクター・ポートフォリオを作り、ファクター空間での価格づけカーネルを推定する簡単な枠組みを提案した（抄録）。", "p3": "候補のファクターの数が標本の大きさを超える高次元の場合にも対応し、冗長なファクターの重みを自動的にゼロへ縮める。推定したポートフォリオの標本外シャープレシオが、既存の回帰に基づく方法の中で最も速く理論上の最大値に収束することを理論的に示した（抄録）。", "p5": "174の特性に基づくファクターと市場ファクターに適用すると、標本外のシャープレシオは3.59で競合する戦略を大きく上回り、価格づけの誤差の合計も最小だった（抄録）。選ばれたファクターは構成も数も時間とともに変わり平均は約50で、よく使われる8つの疎なファクター・モデルでは価格づけカーネルを張るのに十分でないとした（抄録）。", "fun": "株の値動きを説明する「要因」は数多く提案されていて、どれが本当に効くのか迷ってしまう。この研究は、不要な要因を自動で切り捨てる計算方法で174の要因から必要なものを選び、平均すると約50の要因が必要で、よく使われる少数の要因のモデルでは足りないことを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn29", "rank": 29, "field": "経営学", "headline": "オンライン労働市場で『コンテスト』は契約より有効か", "title": "Contest or Contract: Assessing the Effectiveness of Contests in Online Labor Markets", "url": "https://doi.org/10.1287/mnsc.2024.07082", "authors": "Jason Chan ほか", "venue": "Management Science", "date": "2026-10-29", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "発注者が複数の提出物から選べるコンテスト型の仕組みの有効性を、通常の契約型と比べて評価した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "オンラインの労働市場で、同じ予算のもとでデザインの課題を、複数の提出から最良を選ぶコンテスト方式と、一人に任せる契約方式のどちらで頼むべきかを比べた（抄録）。", "p3": "主要なオンライン労働市場の包括的なデータに、複数の実証戦略と機械学習・テキストマイニングを組み合わせ、報酬の方式が仕事の質に与える影響を調べた。課題内の解答どうしの画像の類似度も分析した（抄録）。", "p5": "アイデア出しの課題では契約方式の方がコンテストより成果が良く、コンテストでは他人の提出を見て自分の案を直せるため模倣が起き、競争が激しいほど努力の誘因が弱まって質が下がった（抄録）。コンテストの負の誘因効果は正の誘因効果や並行の効果を上回り、情報面の利点も限られるとした（抄録）。", "fun": "デザインを頼むとき、たくさんの人に案を出させて一番良いものを選ぶ方が得に思える。ところがネットの仕事市場のデータでは、一人に任せる方が質が高かった。コンテストでは他の人の案が見えるのでまねが起き、競争相手が多いほどやる気も下がっていたのだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn30", "rank": 30, "field": "組織行動・心理的安全性", "headline": "リーダーが生む心理的安全性と成果の因果的レビュー", "title": "A systematic and causal review of the link between leader-driven psychological safety and work outcomes", "url": "https://doi.org/10.1016/j.leaqua.2026.102011", "authors": "Geshwaree Huzooree ほか", "venue": "The Leadership Quarterly", "date": "2026-10-29", "citescore": 19.1, "citescore_year": "2025", "why": "題名から、リーダーが生む心理的安全性と仕事の成果の関係を、体系的かつ因果の観点から検討したレビューと読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、リーダーが生み出す心理的安全性（背景：職場で失敗や意見を口にしても大丈夫だと感じられる状態）と仕事の成果のつながりを、系統的かつ因果の観点から見直したレビューである（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「この職場なら失敗を話しても大丈夫」と感じられる心理的安全性は、リーダーしだいで高まると言われる。でも、それが本当に良い成果を生むのか、成果の良いチームだから安心できるだけなのかは区別が難しい。題名からは、その因果の向きを確かめようとしていることが読み取れる。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn31", "rank": 31, "field": "組織行動・心理的安全性", "headline": "強みに基づく組織の取り組みが低SES層の機会を広げる", "title": "Strength-based organizational approaches facilitate workplace opportunities for people from lower socioeconomic status backgrounds.", "url": "https://doi.org/10.1037/xge0002009", "authors": "David M. Silverman ほか", "venue": "Journal of Experimental Psychology: General", "date": "2026-10-29", "sjr": 1.938, "citescore": 7.0, "citescore_year": "2025", "why": "題名から、強みに基づく組織的な取り組みが社会経済的地位の低い人の職場での機会を広げることを示した研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、人の強みに注目する組織の取り組み（強みに基づくアプローチ）が、社会経済的地位の低い家庭の出身者に職場での機会を開きやすくすると主張する研究で、実験心理学の雑誌に掲載された（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "裕福でない家庭で育った人は、採用や昇進で不利になりやすいと言われる。題名からは、欠点を探すのではなく一人ひとりの強みに注目する組織の進め方が、そうした人に働く機会を開くのかという問いに取り組んだことが読み取れる。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn32", "rank": 32, "field": "機械学習", "headline": "石材単位の機械学習で古代集落の建築の変化を定量化", "title": "Quantifying ancient architecture: Stone-level machine learning reveals architectural variation and settlement growth at Shivta", "url": "https://doi.org/10.1073/pnas.2628851123", "authors": "Erel Uziel ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-28", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "シヴタの古代建築を石材の単位で機械学習により記録し、建築の多様性と集落の拡大を定量化した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "古代の集落の建築のばらつきを、個々の建築用の石を単位とする機械学習で定量化する、拡張可能な枠組みを作った（抄録）。", "p3": "地表に残る遺構の低空ドローン画像と立っている壁の近接写真を組み合わせ、ネゲブ砂漠の古代末期の集落シヴタで、地表の約235,000個の石と604の壁の12,000個の石を自動でデジタル化し、石の大きさ、形の規則性、積み方を壁・世帯・街区・集落全体で定量化した（抄録）。", "p5": "積み方の評価が高い壁は教会のまわりと集落の境界の一部に集まり、積み方のばらつきの空間分布から、これまで知られていなかった古い境界と、南の中心部から外への拡大の証拠が見つかった（抄録）。建築の順序と合わせると、主な成長期により大きく形の整った石が使われていた（抄録）。", "fun": "遺跡の壁を一つずつ測るのは大変だが、ドローンの写真とAIを使えば、石の一つひとつまで数えられる。ネゲブ砂漠の古代の町で約235,000個の石を調べると、石の積み方の違いから、これまで知られていなかった昔の町の境界が浮かび上がった。石が町の成長の歴史を語っていたのだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn33", "rank": 33, "field": "機械学習", "headline": "火星探査車の機上計画で自律的な生産性を向上", "title": "The Mars 2020 OnBoard Planner: Increasing autonomy mission productivity of the Perseverance rover", "url": "https://doi.org/10.1126/scirobotics.aeh2947", "authors": "Daniel M. Gaines ほか", "venue": "Science Robotics", "date": "2026-10-28", "sjr": 5.883, "citescore": 32.1, "citescore_year": "2025", "why": "パーセベランスの機上プランナーで、地上の保守的な計画に頼らず、電力・熱の制約下で探査車の生産性を高めた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "火星探査車パーサヴィアランスの運用に、搭載したAIで活動の予定を動的に組み直すOnBoard Plannerを導入し、2年以上の地表での運用の成績を報告した（抄録）。", "p3": "2023年10月に導入され、AIの制約に基づく探索で、探査車の状態と火星の環境のリアルタイムの変化に合わせて予定を作り直す。地上の保守的な予測の代わりに資源をリアルタイムで追い、加熱の時間を調整し、使われなかった予定の余裕を取り戻し、資源が余れば機会的な活動を差し込む（抄録）。", "p5": "裁量的な探査車の活動を全体で10.5%増やし、一部の科学観測の温度と時刻の条件も改善し、地上の運用の時間を増やさずに生産性を上げた（抄録）。こうした結果から、Mars 2020の標準の運用の一部になった（抄録）。", "fun": "火星の探査車は地球からの指示が届くまで時間がかかり、電力や温度の余裕も見込みで控えめに決めていた。そこで探査車に自分で予定を組み直すAIを積むと、余った時間と電力を使って活動を10.5%増やせた。遠い宇宙では、機械が自分で判断する力が成果を左右する。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn34", "rank": 34, "field": "機械学習", "headline": "最適輸送による因果的な意味ルーティングの再調整", "title": "TraceRouter++: Causal Semantic Routing Realignment via Optimal Transport", "url": "https://doi.org/10.1109/tpami.2026.3747849", "authors": "Chuancheng Shi ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-29", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "題名から、最適輸送で因果的な意味ルーティングを再調整する手法と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、最適輸送を使って、因果的な意味に基づく経路づけ（ルーティング）を整列し直す手法TraceRouter++を提案した研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名からは、意味に基づく「経路づけ」を、因果の考え方と最適輸送（2つの分布を最も少ない運び賃で対応づける数学の道具）で整え直す手法であることが読み取れる。見かけの関係にまどわされずに正しい道筋を選ばせたい、という問いが背景にあると考えられる。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "複数の無ラベルデータから二値分類をほぼ教師なしで", "title": "Making Binary Classification From Multiple Unlabeled Datasets Almost Free of Supervision", "url": "https://doi.org/10.1109/tpami.2026.3748555", "authors": "Yuhao Wu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-29", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "題名から、複数の無ラベルのデータセットからほぼ教師なしで二値分類器を学習する方法と読める（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかった同名のarXiv版（DOI）の抄録（OpenAlex経由）を使用。掲載版との違いは未確認", "preprint": false, "short": true, "p1": "ラベルのない複数のデータセットから二値分類器を学ぶとき、すべてのデータセットのクラス事前確率を知る必要をなくし、2つのデータセットのどちらが正例の割合が高いかという1組の大小関係だけで学べる問題設定（MU-OPPO）と枠組みを提案した（抄録）。", "p3": "擬似ラベルの付与、確信度の高い例の収集、クラス事前確率の推定、推定した事前確率を用いた分類器の訓練の4つの段階からなる枠組みとし、推定した事前確率と真の値の差を理論的に解析した（抄録）。", "p5": "包括的な実験で、クラス事前確率の推定誤差が小さく、二値分類の性能も良いことを確かめた（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "AIに猫と犬を見分けさせるには、ふつうは大量の写真に「猫」「犬」と札をつける手間がかかる。この研究は、札のない写真の山がいくつかあり、「こっちの山の方が猫が多い」という一つの情報さえあれば、ほぼ札なしで見分け方を学べる方法を作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn36", "rank": 36, "field": "社会学", "headline": "仕事のための国内移住と夫婦の主観的幸福", "title": "Beyond economic bargaining power? Work-related internal migration and subjective well-being in couples", "url": "https://doi.org/10.1093/sf/soag153", "authors": "Elias Hofmann ほか", "venue": "Social Forces", "date": "2026-10-28", "sjr": 1.463, "citescore": 6.2, "citescore_year": "2025", "why": "夫婦の移住の決定で、経済的な交渉力以外の要因が双方の主観的幸福にどう関わるかを調べた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "仕事のための国内移住が夫婦それぞれの生活満足度にどう影響するか、それが女性の経済的な交渉力（世帯の労働所得に占める女性の割合）の変化に左右されるかを調べた（抄録）。", "p3": "ドイツ社会経済パネル（SOEP、1991〜2021年）と固定効果のパネル回帰で、個人と夫婦の両方の水準で移住後の生活満足度の変化を分析した（抄録）。", "p5": "平均すると移住後に夫婦の両方の生活満足度が上がり、女性の満足度の上昇は交渉力の変化とあまり関係しなかった（抄録）。一方、男性の満足度は妻の交渉力が下がるか変わらない場合にだけ上がり、上がる場合には上がらず、夫婦内の所得の分け方についての性別の期待が男性の幸福の向上を妨げるという見方と整合した（抄録）。", "fun": "仕事のために家族で引っ越すとき、夫婦はお金のことだけで決めているのだろうか。ドイツの1991年から2021年までのデータでは、引っ越し後は夫婦とも満足度が上がったが、妻の稼ぎの割合が増えた場合だけは夫の満足度が上がらなかった。「夫の方が稼ぐべきだ」という思いこみが幸せを邪魔しているのかもしれない。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn37", "rank": 37, "field": "社会学", "headline": "社会学研究で生成AIを使ってよいか", "title": "Is it Okay to Use Generative AI in Sociological Research?", "url": "https://doi.org/10.15195/v13.a52", "authors": "Oscar Stuhler ほか", "venue": "Sociological Science", "date": "2026-10-28", "sjr": 1.434, "citescore": 3.1, "citescore_year": "2025", "why": "題名から、社会学の研究過程での生成AIの利用の是非を論じた研究と読める（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかった同名のSocArXiv版（DOI）の抄録（OpenAlex経由）を使用。掲載版との違いは未確認", "preprint": false, "short": true, "p1": "社会学者が研究の各段階（文献レビューと着想、データ収集と分析、執筆、査読）で生成AIのどんな使い方を許容できると考えるかを調査した（抄録）。", "p3": "19の使い方について、論文で開示した場合と開示しない場合の許容度を尋ねた（抄録）。回答者数は抄録にない（未確認）。", "p5": "意見は大きく分かれ、例えば論文の構成案を生成AIで作ることを40%が許容できないとする一方、34%は許容でき開示も不要とし、すべての使い方を許容できないのは5%だけだった（抄録）。量的研究者、英語が母語でない人、男性ほど許容的で、82.2%が雑誌の開示の義務化を支持したが、そうした開示を信頼するのは22%だった（抄録）。", "fun": "研究にAIを使ってもよいかについて、社会学者の意見は大きく割れていた。論文の構成をAIに考えさせることを40%は許せないとし、34%は黙って使ってもかまわないとした。82.2%がAI使用の申告の義務化に賛成したのに、その申告を信じる人は22%しかいないのも皮肉だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn38", "rank": 38, "field": "社会学", "headline": "州の子どもへの投資と物質的困窮の格差", "title": "State-Level Investments in Children and Disparities in Material Hardship", "url": "https://doi.org/10.15195/v13.a53", "authors": "Jiwan Lee ほか", "venue": "Sociological Science", "date": "2026-10-28", "sjr": 1.434, "citescore": 3.1, "citescore_year": "2025", "why": "題名から、米国の州による子どもへの投資と物質的困窮の格差の関係を調べた研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、州ごとの子どもへの公的な投資の違いが、物質的な困窮（背景：食料・住居・光熱費などの基本的な必要を満たせない状態）の格差とどう関わるかを調べた研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "子どもへの公的な支出は、州によって大きく違うことがある。題名からは、その違いが、食べ物や住まいに困るといった暮らしの苦しさの格差を縮めるのかという問いに取り組んだことが読み取れる。お金のかけ方が子どもの暮らしの差にどう表れるかは、政策を考えるうえで大事な問いだ。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn39", "rank": 39, "field": "開発経済学", "headline": "黒人の政治家は公共部門の上級職の構成を変えるか", "title": "Do black politicians matter? Political leadership and racial composition in top public sector positions", "url": "https://doi.org/10.1016/j.jdeveco.2026.103957", "authors": "Fernanda Estevan ほか", "venue": "Journal of Development Economics", "date": "2026-10-26", "citescore": 8.2, "citescore_year": "2025", "why": "題名から、黒人の政治指導者が公共部門の上級職の人種構成に与える影響を調べた研究と読める（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、黒人の政治家が政治の指導者になることが、公共部門の上級職に就く人の人種構成に影響するかを問う研究で、開発経済学の雑誌に掲載された（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "黒人の政治家がトップに立つと、役所の幹部にも黒人が増えるのだろうか。題名からは、政治の指導者の人種が、公共部門の重要な職に誰が就くかを変えるのかという問いに挑んだことが読み取れる。選挙で選ばれる人と、選挙を経ない役人の世界のつながりを考える問いだ。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn40", "rank": 40, "field": "開発経済学", "headline": "アフリカ大陸の空間的・部門別の水需要を推計", "title": "Spatial and sectoral water demand assessment for the African continent", "url": "https://doi.org/10.1038/s41586-026-11199-8", "authors": "Davy Vanham ほか", "venue": "Nature", "date": "2026-10-28", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "アフリカ全体の水需要を空間的・部門別に推計し、満たされていない需要の分布を明らかにした。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "アフリカ全体について、2020年の水需要を6部門と複数の下位部門に分け、高い空間分解能で推定した（抄録）。", "p3": "異なるデータセットとモデルの仮定を統合した調和推定で、実際の水使用の直接の観測ではないとし、主要なパラメータを±20%変えた場合の幅などを示した（抄録）。", "p5": "年間の総水需要は347 km3で、灌漑が225 km3（65%）、自治体が60 km3（17%）、発電が33 km3（10%）、製造業が15 km3（4%）、家畜が11 km3（3%）、鉱業が3 km3（1%）で、2010年から2020年に26%増えた（抄録）。北部と南部の一部では需要が利用可能な水を上回ったが、他の地域では水道へのアクセスが限られるのに利用可能量は需要を上回り、物理的な量だけでは水の安全保障は決まらないとした（抄録）。", "fun": "アフリカで1年に必要な水は347立方キロメートルと推定され、その65%が畑の水やりに使われていた。面白いのは、水が十分にあるのに水道が届かない地域があることだ。水不足は、水の量だけでなく、届ける仕組みの問題でもあるということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "data_related": [{"rank": 1, "headline": "ドライブバイで橋の振動数変化を検出できる限界", "title": "Simulation code and archived results for \"Detectability of bridge-frequency changes from drive-by measurements: Information bounds and track coincidence\"", "url": "https://doi.org/10.17632/mxttxg2hnp.1", "authors": "Wang ほか", "venue": "Mendeley Data", "date": "2026-10-29", "summary": "論文『ドライブバイ計測による橋の振動数変化の検出可能性：情報限界と走行軌跡の一致』に付随する、路面凹凸を含む車両–橋梁相互作用モデルのシミュレーションコードと解析結果の保存版。フィッシャー情報・クラメール–ラオ下限・有限の変化の検出解析、車輪の横方向の走行位置のずれの影響、路面形状・実験室・鉄道の解析の処理済み出力と作図スクリプトを含み、ファイルごとのサイズとSHA-256の一覧がある。ライセンスはCC BY-NC-SA 4.0。関連論文のDOIは記載なし。", "kind": "data", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"rank": 2, "headline": "Z24橋の縮約デジタルツインでモード更新を再現", "title": "AbdellahRiyahi/GPT_PINN_Z24: GPT-PINN Z24 v1.0 — IEEE Access Submission Reproducibility Package", "url": "https://doi.org/10.5281/zenodo.23712373", "authors": "Abdellah Riyahi", "venue": "Zenodo", "date": "2026-10-27", "summary": "Z24橋の識別可能性を考慮したモード更新のための貪欲法GPT-PINN縮約デジタルツイン（IEEE Accessに投稿）の再現パッケージ。Jupyterノートブック（実行済みを含む）、数値結果・表・図・診断レポート、モデル設定と実行ログ、SHA-256の一覧を収める。変分型のPINNモード解析、貪欲な縮約基底、共分散を考慮した逆更新などを扱う。ライセンスはCC BY 4.0。GitHubのリリースに付随する。", "kind": "data", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"rank": 3, "headline": "吊橋のケーブルと桁の拘束を振幅別に実測で同定", "title": "Data and code for: Amplitude-dependent cable-girder restraint of a suspension bridge from full-scale measurements", "url": "https://doi.org/10.17632/h58bpdhfh2.1", "authors": "Nguyen, Tien Thuy", "venue": "Mendeley Data", "date": "2026-10-29", "summary": "ノルウェーのハダンゲル橋の公開モニタリングデータ（再配布はしない）から導いた、ケーブルと桁の拘束の振         var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
