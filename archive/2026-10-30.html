"title": "Strategic Frills and Traffic Steering in Online Rating Systems", "url": "https://doi.org/10.2139/ssrn.7664084", "authors": "Yanru Liu ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Liu, Y., Xiaoyu, W., Li, G., & Wang, Y. (2026). Strategic Frills and Traffic Steering in Online Rating Systems. https://doi.org/10.2139/ssrn.7664084", "why": "販売後の小さな贈り物で評価を上げる売り手と、評価に応じて露出を配分するプラットフォームの相互作用をモデル化し、評価の情報性が保たれる条件を示した。"}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "東証発の『バリューアップ』施策をアジアで比較", "title": "Value-Up Initiatives as a Strategy for Corporate Governance and Capital Market Development: Lessons from Asia", "url": "https://doi.org/10.2139/ssrn.7674078", "authors": "Aurelio Gurrea-Martínez ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Gurrea-Martínez, A., Chung, J. H., & Remolina, N. (2026). Value-Up Initiatives as a Strategy for Corporate Governance and Capital Market Development: Lessons from Asia. https://doi.org/10.2139/ssrn.7674078", "why": "東京証券取引所の取り組みで注目された企業価値向上の施策を、アジア各国で比較し、企業統治と資本市場の発展策としての可能性と限界を論じた。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "能力の木で多モーダルエージェントを自己改善", "title": "The Trinity:Capability-Driven Recursive Self-Improvement for Multimodal Agents", "url": "https://arxiv.org/abs/2610.36077", "authors": "Weidong Tang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Tang, W., Wang, R., Zhang, J., Wang, H., Chen, H., Zhang, Z., Ma, Y., Jiang, Z., Guo, Z., Li, H., Jiao, Z., Cui, Z., Yin, X., Liang, S., Wan, Z., Lin, H., Zhang, W. Z. K., Zhou, P., Zhang, O., & You, Y. (2026). The Trinity:Capability-Driven Recursive Self-Improvement for Multimodal Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36077", "why": "世界の生成と実行環境（ハーネス）の進化を3つの役割で結び、表面の課題分類でなく共通の能力要件で課題を再編する再帰的自己改善の枠組みを示した。"}, {"id": "pn13", "rank": 13, "field": "社会学", "headline": "都市の貧困で資本の転換が空回りする履歴効果", "title": "Capital Conversion and the Hysteresis Effect in Urban Poverty: Relational Barriers to Labour Market Participation", "url": "https://doi.org/10.31235/osf.io/m67dq_v3", "authors": "Floris Noordhoff", "venue": "SocArXiv", "date": "2026-10-29", "apa": "Noordhoff, F. (2026). Capital Conversion and the Hysteresis Effect in Urban Poverty: Relational Barriers to Labour Market Participation. https://doi.org/10.31235/osf.io/m67dq_v3", "why": "オランダの貧困地区の質的調査で、過去の経験と期待が労働市場の要求に遅れる履歴効果が、意欲があっても就職の試みを失敗させる仕組みを示した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "構造方程式モデルのベイズ因子を実用的に計算", "title": "Bayes Factors for Structural Equation Models with Blavaan and Bridge Sampling", "url": "https://doi.org/10.31234/osf.io/pt2bc_v2", "authors": "Julius M. Pfadt ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Pfadt, J. M., Merkle, E. C., & Wagenmakers, E.-J. (2026). Bayes Factors for Structural Equation Models with Blavaan and Bridge Sampling. https://doi.org/10.31234/osf.io/pt2bc_v2", "why": "ブリッジ・サンプリングとBICに相当する単位情報事前分布で、標準的なSEMの記法のままベイズ因子を計算する手順を示し、方向性のある事前情報で証拠が鋭くなることを示した。"}, {"id": "pn15", "rank": 15, "field": "社会学", "headline": "16歳以降の進路が32歳の生活をどう分けるか", "title": "Work or Study? Post-16 Pathways, Degree Attainment and Adult Life at 32", "url": "https://doi.org/10.31235/osf.io/p4fyj_v1", "authors": "Ingrid Schoon ほか", "venue": "SocArXiv", "date": "2026-10-29", "apa": "Schoon, I., Yong, A., & Jenkins, A. (2026). Work or Study? Post-16 Pathways, Degree Attainment and Adult Life at 32. https://doi.org/10.31235/osf.io/p4fyj_v1", "why": "縦断データで17〜20歳の進路と学位取得の組み合わせを分類し、雇用・収入・仕事の質・持ち家・生活満足・心理的苦痛への影響を調べた。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "長期の弱い証拠から利用者の習慣を推論するベンチ", "title": "HABIT-Bench: Evaluating Habit Induction from Longitudinal Weak Evidence in Agent Memory", "url": "https://arxiv.org/abs/2610.24520", "authors": "Junming Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Zhang, J., Wei, R., Cheng, X., Sun, H., Wang, J., Cheng, R., Wang, X., Wu, P., Chen, M., & Lin, Z. (2026). HABIT-Bench: Evaluating Habit Induction from Longitudinal Weak Evidence in Agent Memory (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.24520", "why": "長期のやりとりで利用者が示す習慣を、弱い証拠から推論できるかを測るベンチマークを作り、エージェントの記憶の課題を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "長期にわたりLLMエージェントと対話する利用者の習慣を、一回ごとの弱い証拠から推し量り、後の依頼に適切に生かせるかを評価するベンチマークHABIT-Benchを作った（抄録）。arXivの未査読のプレプリントである。", "p3": "課題指向の対話データと統制した習慣のグラフから、食・金融・ソフトウェア・旅行にわたる数百セッションの合成の利用履歴を作り、一時的な例外、習慣の変化、受け入れられなかった提案を含む4択の課題を用意した。8つの記憶手法をQwen3-235B-A22BとGLM-5.3-Flashで評価した（抄録）。", "p5": "最も良い記憶手法でも4領域のマクロ正解率は33.61%にとどまり、注釈つきの証拠を直接与えても成績は限られた（抄録）。過去のやり取りを保持できることと、習慣を推論して適切に使えることの間には隔たりが残るとした（抄録）。", "fun": "いつもの店で「いつもの」と言えば通じるのは、店員があなたの習慣を覚えているからだ。この研究は、AIが何百回分もの会話から利用者の好みを推し量れるかを4択問題で試したが、一番良い方法でも正解率は33.61%だった。覚えていることと使いこなすことの差は、思ったより大きい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "人のフィードバックで自ら学習を回すRSIアリーナ", "title": "RSI Arena: Towards Recursive Self-Improvement with Human Feedback", "url": "https://arxiv.org/abs/2610.33624", "authors": "Yue Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Huang, Y., Wang, Y., Li, L., Chen, Y., Haupt, A., Luo, X., Liu, Z., Choi, J., Juefei-Xu, F., Zhang, X., Poovendran, R., Sra, M., Liu, Y., Burtenshaw, B., Wolf, T., Pentland, A., Chen, Z., & Xu, Z. (2026). RSI Arena: Towards Recursive Self-Improvement with Human Feedback (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33624", "why": "AIエージェントが自律的に言語モデルを事後学習し、利用者のフィードバックで改善できるかを2段階で調べ、再帰的自己改善への一歩を評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "AIエージェントが自律的に言語モデルを事後学習し、利用者の評価で改善できるかを、再帰的な自己改善への一歩として調べた2段階の研究RSI Arenaを報告した（抄録）。arXivの未査読のプレプリントである。", "p3": "10の最先端モデルが訓練役となり、同じ基盤モデルから出発して、6日間に各自1,000 GPU時間と300ドルのAPI予算でデータ選び・訓練・チェックポイント選択を独自に行い、20のベンチマークと盲検の人間評価で比べた。第2段階では評価の記録を渡してさらに3日間訓練させた（抄録）。", "p5": "10のエージェントすべてが動く対話モデルを作り、最強（GPT-6 Astraが訓練）は12のベンチマークで基盤とInstruct版の差の中央値76%を埋めた（抄録）。第2段階では10モデル中8つで文体を補正した評価が上がったが、ベンチマークの伸びは小さく、応答を長くさせたものや有害な要求への応諾が増えたモデルもあった（抄録）。", "fun": "AIが自分で別のAIを鍛える時代は来るのか。この実験では10種類のAIに同じ材料と6日間の計算資源を渡し、それぞれに会話AIを育てさせた。全員が使えるものを作れたが、人の評価を受けて手直しすると、答えを長くする方向に進んだものや、危ない頼みに応じやすくなったものもあった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "人手設計に頼らない自動定理証明の『苦い教訓』", "title": "h1: A Taste of the Bitter Lesson in Automated Theorem Proving", "url": "https://arxiv.org/abs/2610.35962", "authors": "Skander Moalla ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Moalla, S., Rammal, A., Patel, N., Munos, R., & Kempe, J. (2026). h1: A Taste of the Bitter Lesson in Automated Theorem Proving (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35962", "why": "形式的な定理証明が人手で設計した仕組みに頼りがちな中で、規模の拡大を重視する路線を検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "形式的な定理証明で、計画・分解・専用証明器の組み合わせといった人が設計した手順を使わず、テスト時の計算を増やす単純なエージェントのループで張り合えるかという「苦い教訓」の問いを調べた（抄録）。arXivの未査読のプレプリントである。", "p3": "モデルにLean 4への効率的な接点を与え、検証器のフィードバックと自己反省で作業を続けさせる単純な仕組みh1を作り、分解や探索の構造は課さなかった。同じモデルでの比較とアブレーションで、Claude CodeやAxProverBaseとも比べた（抄録）。", "p5": "PutnamBench、FATE-X、FormalConjectures100-Solvedで最高水準に達し、FormalConjecturesの未解決問題を8つ解決し、同じモデルではGoedel-ArchitectやAlphaProof Nexusなどの専用手順に並ぶか上回った（抄録）。ただし単純さだけでは足りず、効率的なLeanの接点が費用と解決率をほぼ決めていた（抄録）。", "fun": "難しい数学の証明をAIにさせるとき、人が細かく手順を決めてやるより、単純な仕組みで試行錯誤させる方が強いのではないか。この研究の単純な仕組みは、数学の未解決問題を8つも解いた。ただし秘訣は、証明を確かめる道具とのやり取りを効率よくすることにあった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "物理法則が変わった世界でLLMは異常に気づくか", "title": "Can LLMs Uncover Hidden Physical Laws through Free Exploration?", "url": "https://arxiv.org/abs/2610.37649", "authors": "Zhen Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Yang, Z., Wang, W., Xu, X., & Chen, Y.-C. (2026). Can LLMs Uncover Hidden Physical Laws through Free Exploration? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37649", "why": "物理法則を変えた環境での自由な探索で、LLMが予期しない振る舞いに気づき法則を見つけられるかを調べ、科学的発見の能力を評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "物理法則を変えた模擬世界で、LLMが「重い物ほどゆっくり落ちる」といった予想外の振る舞いに自ら気づき、何を調べるかを指示されずに実験で法則を発見できるかを評価する枠組みLongChangを作った（抄録）。arXivの未査読のプレプリントである。", "p3": "評価されるLLMは探索者として物体を操作し道具を作って自分の問いを調べ、別のLLMエージェントが場面の生成と点検、道具の設計の点検、報告の正しさと実験的な裏づけの評価を担い、人の介入なしに循環させた（抄録）。", "p5": "12のLLMのうち発見率はGPT-6-Astraが16.7%で、他の11は0%だった（抄録）。探索の記録からは、調べられないまま残った異常や、変えた法則の部分的な特定にとどまる例が見られた（抄録）。", "fun": "もし重い物ほどゆっくり落ちる世界があったら、AIはその不思議に気づいて法則を突き止められるだろうか。ヒントなしで12種類のAIに探検させたところ、法則を見つけられたのは1種類だけで、その発見率も16.7%だった。「おかしいぞ」と気づく力は、AIにもまだ難しい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "確率的予測の時系列基盤モデルTimestral", "title": "Timestral", "url": "https://arxiv.org/abs/2610.37585", "authors": "Adrien Petralia ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Petralia, A., Gavaudan, A., Joosen, A., Goffinet, E., Kurle, R., Ouahidi, Y. E., Bendou, Y., Bounhar, A., Somani, A., Kabra, A., Valente, A., Sadé, A., Djermani, A., Jeffares, A., Jiang, A., Bietti, A., Timashov, A., Cahill, A., Laval, A., … Csákány, Z. (2026). Timestral (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37585", "why": "4つの規模からなる時系列基盤モデル群で、GIFT-Evalなどの確率的予測のベンチマークで最高水準を達成した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "確率的な予測のための時系列の基盤モデルTimestralを、4つの大きさ（パラメータ数5M・28M・123M・209M）で発表した技術報告（抄録）。arXivの未査読のプレプリントである。", "p3": "予測用のトークンを因果的に符号化した文脈から切り離すDecoupled Horizon Forecasting、将来が既知の共変量を因果的な構造で扱う仕組み、多様な大規模の合成データだけで事前学習してから実データと合成データの混合で事後学習する2段階の流れを組み合わせた（抄録）。", "p5": "GIFT-Eval、TIME、fev-benchで最高水準となり、すべての指標でTimestral-209Mと-123Mが上位2つを占めた（抄録）。4モデルの重みはHugging Faceに、推論コードはGitHubに公開された（抄録）。", "fun": "時間とともに変わる数字の未来を予測するAIの話。このAIは、事前学習には作り物のデータだけを使い、その後に本物と作り物を混ぜたデータで仕上げたのに、3つの評価ですべての指標の1位と2位を独占した。作り物のデータで基礎を固める方法が効くことを示している。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "事前学習データの語の痕跡がゼロショット精度を左右", "title": "The Lexical Imprint of Pre-training Data", "url": "https://arxiv.org/abs/2602.10657", "authors": "Jeonghoon Kim ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Kim, J., Chung, W., Song, W., Park, C., Sung, N., & Shin, J. (2026). The Lexical Imprint of Pre-training Data (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2602.10657", "why": "事前学習コーパスとベンチマークの語レベルの一致（ユニグラムの交差エントロピー）が、ゼロショットの精度をどれだけ説明するかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "ゼロショットのベンチマーク正解率のうち、事前学習コーパスとベンチマークの単語レベルの一致でどれだけ説明できるかを、モデルを使わない尺度（単語ユニグラムの交差エントロピー、UCE）で調べた（抄録）。arXivの未査読のプレプリントである。", "p3": "学習の手順を固定してコーパスだけを変える一からの事前学習を、10のゼロショットのベンチマーク、4つのコーパス、3つのモデル規模で行った（抄録）。", "p5": "UCEはすべてのベンチマークでゼロショット正解率と一貫して対応し、ベンチマークと語彙の近いコーパスほど正解率が高かった（抄録）。文書単位で語彙の一致が最大になる訓練文書を選ぶと予測どおりの正解率の向上が得られ、プロンプトごとに語彙の近い下書きモデルに振り分けると処理量が上がった（抄録）。", "fun": "AIのテストの点数は、どれだけ賢いかだけでなく、学んだ文章とテストの文章でどれだけ同じ単語が使われているかにも左右される。この研究は、AIを使わずに単語の重なりを測る物差しを作り、10種類のテストすべてで、重なりが大きいほど点数が高いことを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "世界モデルで経験を巻き戻してロボット方策を改善", "title": "Rollback: Experience Backtracking in World Models for Policy Improvement", "url": "https://arxiv.org/abs/2610.36068", "authors": "Jiayi Luo ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Luo, J., Zhang, Y., Chen, L., Wang, N., Gao, C., Qiu, B., Li, Z., Peng, B., Li, C., Yan, Y., Liu, S., Sun, Q., Yan, S., Yao, M., Li, J., & Ren, G. (2026). Rollback: Experience Backtracking in World Models for Policy Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36068", "why": "行動条件付きの世界モデルを単なる予測器でなく、経験を巻き戻して試し直す場として使い、ロボットの方策を改善する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "ロボットの方策を改善するため、行動条件つきの世界モデルを、過去の決定時点まで巻き戻して別の行動を試せる「反実仮想の装置」として使う方法Rollbackを提案した（抄録）。arXivの未査読のプレプリントである。", "p3": "重要な決定時点まで戻って別の行動に枝分かれし、結果を比べて成功を個々の決定に帰属させ、別に価値モデルを学ばずに行動単位の教師信号を作った。分散した世界モデルの探索と実機の非同期の実行を統合し、実機の経験で世界モデルの動力学を軽量なLoRAで補正した（抄録）。", "p5": "実機の3課題で最強の基準より成功率が絶対値で10.67%（ブロック抜き取り）、11.11%（ボール投げ）、11.85%（卓上カーリング）高く、訓練を通じてより安定に改善した（抄録）。人の水準を大きく下回る遠隔操作の実演から始めて、8時間の訓練でボール投げと卓上カーリングで人の平均成功率を超えた（抄録）。", "fun": "人生はやり直せないが、AIの頭の中の「世界のシミュレーション」なら、失敗した場面まで巻き戻して別の手を試せる。この研究のロボットはその仕組みで、どの動きが成功につながったかを学び、8時間の訓練でボール投げや卓上カーリングで人の平均を上回った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "物理ダイナミクスの表現を持つ視覚言語行動モデル", "title": "PDRVLA: A Vision-Language-Action Model with Physical Dynamics Representations", "url": "https://arxiv.org/abs/2610.37381", "authors": "Hanqing Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-28", "apa": "Wang, H., Cai, Z., An, R., Zeng, B., Zhang, T., Chen, Y., Jiang, X., Chen, K., Wu, C., Li, H., Yang, F., Lin, M., Zhang, W., Zhou, Z., & Wu, Y. (2026). PDRVLA: A Vision-Language-Action Model with Physical Dynamics Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37381", "why": "動画の世界モデルが捉える物理ダイナミクスの表現を視覚・言語・行動モデルに取り込み、ロボットの行動生成を改善した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "視覚と言語からロボットの行動を生成するVLAモデルに、未来の映像を生成せずに物理的な動きの理解を持たせる軽量な物理動力学モジュールを加えたPDRVLAを提案した（抄録）。arXivの未査読のプレプリントである。", "p3": "モジュールは視覚言語の特徴から物理トークンを取り出して行動生成を条件づけ、未来のRGB・深度・オプティカルフローの特徴を直接予測し、凍結した映像世界モデルから補助の教師を受けて学ぶ。訓練は公開データだけで行い、人からロボットへの合成やサブタスク・思考の連鎖（ECoT）の注釈で拡張した（抄録）。", "p5": "4つのシミュレーションのベンチマークで成功率はLIBEROで99.3%、LIBERO-Plusで89.9%、RoboTwin 2.0で93.6%、SimplerEnvで81.5%だった（抄録）。アブレーションでは、世界モデルの教師で未来の予測が改善した（抄録）。", "fun": "ロボットが物をつかむとき、押したら倒れる、持ち上げたら傾くといった物の動きを知っていれば失敗が減る。この研究は、未来の映像を描かずに「この先どう動くか」の感覚だけをロボットのAIに持たせ、模擬環境の課題で最高99.3%の成功率を出した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "障害者雇用の指標と合理的配慮、非就労の罠", "title": "Employment of Persons with Disabilities: Indicators, Reasonable Accommodation and Inactivity Traps", "url": "https://doi.org/10.2139/ssrn.7664743", "authors": "Julie Vinck ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Vinck, J., & Atanasova, A. (2026). Employment of Persons with Disabilities: Indicators, Reasonable Accommodation and Inactivity Traps. https://doi.org/10.2139/ssrn.7664743", "why": "障害者の雇用の指標、合理的配慮、就労を妨げる『非就労の罠』を整理し、欧州の政策評価の論点を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "障害者の雇用について、EU理事会のベルギー議長国が2023年に開いた作業部会のために、議論の論点をまとめた背景文書（抄録）。SSRNに置かれた未査読の文書である。", "p3": "国連障害者権利条約が第27条で労働と雇用の権利を定め、欧州の障害者権利戦略（2021〜2030年）が労働市場での成果の改善を目指していることを出発点に、論点を3つに整理した（抄録）。", "p5": "第1に障害の平等の指標と目標、第2に合理的配慮の実施と啓発での主要な関係者の役割、第3に「無業の罠」（背景：働くと給付が減るなどして就労の得が小さくなる状態）を短く論じた（抄録）。実証的な分析の結果は抄録にない（未確認）。", "fun": "障害のある人が働く権利は国際条約で認められているが、ヨーロッパでもまだ課題が多い。この文書は、どう数えて目標を立てるか、職場の配慮を誰が進めるか、働くとかえって損になる仕組みをどうなくすかという3つの論点を示している。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "トルコの給与所得税のブラケット・クリープを測定", "title": "The Arithmetic of Indexation: Bracket Creep in the Turkish Wage Income Tax Schedule — A Measurement for 2022–2026 and a Neutralisation Proposition", "url": "https://doi.org/10.2139/ssrn.7663939", "authors": "Koray Öner", "venue": "SSRN", "date": "2026-10-28", "apa": "Öner, K. (2026). The Arithmetic of Indexation: Bracket Creep in the Turkish Wage Income Tax Schedule — A Measurement for 2022–2026 and a Neutralisation Proposition. https://doi.org/10.2139/ssrn.7663939", "why": "2022〜2026年のトルコの給与所得税の表の物価調整を給与計算のシミュレーションで測り、ブラケット・クリープが起きたかを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "トルコの給与所得税の税率表が2022〜2026年にどう物価に合わせて調整されたかを測り、給与計算の完全な模擬でブラケット・クリープ（背景：物価上昇で名目所得が上がり、実質的に高い税率区分に押し上げられること）が起きたかを検証した（抄録）。SSRNの未査読のプレプリントである。", "p3": "物価上昇率との比較と、実質賃金一定の労働者の手取りの追跡に加え、最低賃金の免除が算出税額から差し引かれることに基づく中立化の命題とクリープの閉じた式を示した（抄録）。", "p5": "期間全体では系統的なクリープはなく、2023年の税率表は物価上昇を大きく上回って引き上げられた（114.3%対64.3%）（抄録）。2024年以降は逆転し、2026年には賃金労働者に効く境界の上昇が21.2%で物価上昇の30.9%を下回り、実質の手取りは2024年から2026年に1.2〜2.6%下がった。損失は区分内で定額のため低所得者ほど相対的に重い（抄録）。", "fun": "物価と同じだけ給料が上がっても、税金の区分が据え置かれると、手取りの実質は減ってしまう。トルコでは2023年に区分を物価以上に引き上げて余裕を作ったが、2026年には区分の上げ幅が21.2%、物価上昇が30.9%で逆転した。税の仕組みが知らないうちに家計を削ることがわかる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn26", "rank": 26, "field": "開発経済学", "headline": "カンボジアの零細事業者のデジタル参加と正規化", "title": "Digital Onboarding and Formalization Readiness Assessing Micro-business Participation in Cambodia's Digital Platforms at the Commune and Village Level", "url": "https://doi.org/10.2139/ssrn.7664482", "authors": "Dr.Samean Ven", "venue": "SSRN", "date": "2026-10-28", "apa": "Ven, Dr. S. (2026). Digital Onboarding and Formalization Readiness Assessing Micro-business Participation in Cambodia’s Digital Platforms at the Commune and Village Level. https://doi.org/10.2139/ssrn.7664482", "why": "村・コミューン単位で零細事業者のデジタル基盤への参加を調べ、参加が正規の登録や生産的な利用と同じではないことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "カンボジアの零細事業者のデジタル基盤への参加を、正式登録や生産的な利用と区別して評価するため、州・コミューン・村の多層の準備度の枠組みを作った作業論文（抄録）。SSRNの未査読の文書である。", "p3": "2022年の経済センサス、2023年の農業センサス、世界銀行の2024年の非公式部門の調査、2021〜2035年のデジタル経済政策の枠組みなどの公式資料を統合し、接続・身元確認・支払い・記帳・基盤の利用・登録能力・消費者保護・包摂を組み合わせた指数（DOFRI）を提案した（抄録）。", "p5": "25州の概要は作った調査結果ではなく現地で検証すべき仮説として示し、混合研究の設計、調査票、実施の行程、倫理の管理を今後の実証のために用意した（抄録）。結論は条件つきで、成果は費用の手頃さ、信頼、基盤、技能、釣り合いのとれた規制に依存するとした（抄録）。", "fun": "スマートフォンでお店をネットに登録するのは簡単でも、それで正式な事業になるとは限らない。この論文は、カンボジアの小さなお店がデジタル化と正式化にどれだけ近いかを測る指数を提案し、25州の姿をあえて「確かめるべき仮説」として示した。まだ測っていないことを結果のように書かない慎重さも特徴だ。", "unverified": "指数は提案の段階で、実際のデータによる検証は行われていない（抄録）。"}}, {"id": "pn27", "rank": 27, "field": "開発経済学", "headline": "ナイジェリアの基礎教育と人間開発の関係", "title": "The Nexus of Basic Education and Economic Development in Nigeria", "url": "https://doi.org/10.35542/osf.io/ewakm_v1", "authors": "FRIDAY ADEOLA AKINJEJI ほか", "venue": "EdArXiv", "date": "2026-10-29", "apa": "AKINJEJI, F. A., & R.A, A. (2026). The Nexus of Basic Education and Economic Development in Nigeria. https://doi.org/10.35542/osf.io/ewakm_v1", "why": "1990〜2023年の年次データとARDLモデルで、基礎教育と人間開発の関係を推定した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "ナイジェリアで基礎教育と人間開発の関係を、1990〜2023年の年次データと自己回帰分布ラグ（ARDL）モデルで調べた（抄録）。EdArXivの未査読のプレプリントである。", "p3": "基本の式では初等・前期中等・後期中等の就学率に、貧困、政府支出、物価上昇を加えて、人間開発指数（HDI）との長期関係を推定した（抄録）。", "p5": "HDIとの長期関係が見られ、前期中等の就学は正、初等は弱い正、後期中等は負の係数だった（抄録）。起業教育は統計的に有意に経済開発と関連したが、科学・技術・職業教育は長期で有意でなかった（抄録）。抄録は途中で切れており、代理変数の扱いの詳細は未確認。", "fun": "学校に通う子どもが増えれば国は豊かになるのか。ナイジェリアの1990年から2023年までのデータで調べると、中学校段階の就学は暮らしの豊かさの指標と結びついていたが、高校段階では逆向きの関係が出た。どの段階の教育に力を入れるかで効果が違う可能性がある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn28", "rank": 28, "field": "社会学", "headline": "オランダの都市の構造的貧困と公式・非公式の分断", "title": "Capital Conversion and the Formal–Informal Divide: Structural Poverty in Dutch Cities", "url": "https://doi.org/10.31235/osf.io/5jcrz_v2", "authors": "Floris Noordhoff", "venue": "SocArXiv", "date": "2026-10-28", "apa": "Noordhoff, F. (2026). Capital Conversion and the Formal–Informal Divide: Structural Poverty in Dutch Cities. https://doi.org/10.31235/osf.io/5jcrz_v2", "why": "構造的に貧しい都市住民が限られた資本を労働市場の地位に変えようとする過程と、公式の経路が閉ざされる理由を質的に分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "オランダの都市で構造的な貧困にある住民が、限られた経済・社会・文化資本を労働市場での地位に変えようとするとき、なぜ正式な経路は失敗し非公式な経路は部分的に成功するのかを、ブルデューの概念で分析した（抄録）。SocArXivの未査読のプレプリントである。", "p3": "アムステルダム北部、ロッテルダムのデルフスハーフェン、アムステルダムのバイルメルメールで1997〜1999年に行われた216件の質的面接を、アブダクティブな主題の符号化で分析した（抄録）。", "p5": "正式な場では、資金不足で教育に投資できず、福祉の規則が訓練を罰し、低賃金の補助つき仕事は強い烙印と乏しい収入しかもたらさなかった（抄録）。非公式経済では信頼と互酬の網で資本の部分的な「転換」ができ、不安定で違法でも尊厳を保てた一方、正式な選択肢は届かないか屈辱的と受け止められていた（抄録）。", "fun": "貧しい人が職業訓練を受けると福祉の手当を減らされ、補助つきの仕事は給料が安く周りの目も冷たい。オランダでの216件の聞き取りでは、知り合いのつてで得る届け出のない仕事の方が、不安定でも誇りを保てると感じられていた。支援の制度がかえって人を遠ざける皮肉が見える。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn29", "rank": 29, "field": "社会学", "headline": "ハビトゥスか『貧困の文化』か、生存の道徳論理", "title": "Habitus or Culture of Poverty? Rethinking the Moral Logic of Survival under Structural Constraint", "url": "https://doi.org/10.31235/osf.io/bx7sm_v2", "authors": "Floris Noordhoff", "venue": "SocArXiv", "date": "2026-10-28", "apa": "Noordhoff, F. (2026). Habitus or Culture of Poverty? Rethinking the Moral Logic of Survival under Structural Constraint. https://doi.org/10.31235/osf.io/bx7sm_v2", "why": "ブルデューのハビトゥスとルイスの『貧困の文化』を対比し、構造的な制約の下での生存の道徳論理を論じた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "持続的な構造的制約の下で暮らす人々の道徳的・物質的な生存戦略を説明するのに、ブルデューのハビトゥスとルイスの「貧困の文化」のどちらが適しているかを再検討した（抄録）。SocArXivの未査読のプレプリントである。", "p3": "オランダの不利な地区での216件の詳細な面接を用い、正式な労働市場、非公式経済、福祉の官僚制、地域、社会的なつながりという場ごとに住民の実践を分析した（抄録）。", "p5": "住民は固定的な欠乏の下位文化に従うのではなく、場に応じた資本の転換能力と象徴的な評価に形づくられた関係的な主体性を発揮していた（抄録）。福祉では強制的な遵守の体制に抵抗したり離脱したりし、地域では道徳的な境界づくりで場所の烙印に対処していた。著者らは「制約下の関係的な主体性」の方が豊かな枠組みだと論じた（抄録）。", "fun": "貧しい人は「貧しさの文化」に染まって抜け出せない、という見方がある。この研究はオランダでの216件の聞き取りから、人々は場面ごとに信頼や名誉、危険を計算しながら生き延びていると反論する。決めつけではなく、制約の中の工夫として見るべきだという主張だ。", "unverified": "同じ216件の面接を使う別の論文（資本の転換と正式・非公式の分断）との関係は未確認。"}}, {"id": "pn30", "rank": 30, "field": "経営学", "headline": "ウガンダのモバイル融資のダークパターン", "title": "Manipulation by Design: Dark Patterns, Algorithmic Nudging and Consumer Protection in Uganda's Mobile Lending Market", "url": "https://doi.org/10.2139/ssrn.7665119", "authors": "Muhumuza Rwesheija", "venue": "SSRN", "date": "2026-10-28", "apa": "Rwesheija, M. (2026). Manipulation by Design: Dark Patterns, Algorithmic Nudging and Consumer Protection in Uganda’s Mobile Lending Market. https://doi.org/10.2139/ssrn.7665119", "why": "モバイル融資アプリの画面設計が借り手を操作するダークパターンと、消費者保護の法的な課題を論じた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "ウガンダのモバイル融資アプリで、急がせる表示や偏った選択の設計、分かりにくい価格の開示、借り換えの繰り返しの勧誘などが借入の判断を左右しうるとして、同国の消費者保護・データ保護・金融規制・競争の法制が十分かを検討した本の章（抄録）。SSRNの未査読の文書である。", "p3": "法解釈の分析と比較法の手法で、ウガンダの現行の規制をガーナとEUの動向と比べ、操作的になりうる画面の実践の類型を作り、正当な商業的説得と、情報に基づく自発的な判断を実質的に損なう設計を区別した（抄録）。", "p5": "アルゴリズムによる個別化やエージェント型のAIは開示と同意を中心とする規制を難しくすると論じ、開示の改善だけでなく選択の示し方・個別化・実行の仕方の点検が必要だとして、画面の公正義務、リスクに基づく監査、意味のある同意と離脱の仕組み、利用しやすい救済などを提案した（抄録）。", "fun": "「今だけ」と急がせる表示は、ネット通販だけでなくスマートフォンの借金アプリにもある。この章は、ウガンダの融資アプリがこうした画面の仕掛けで人の判断をゆがめていないかを法律の面から調べ、説明を増やすだけでは不十分で、画面の作り方そのものを点検すべきだと主張する。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "低ボラ指数の再現は推定量より仕様の曖昧さが左右", "title": "Replicating USMV and SPLV with a Public-data Factor Risk ModelSpecification Ambiguity Dominates the Choice of Covariance Estimator", "url": "https://doi.org/10.2139/ssrn.7664321", "authors": "Soham Parundekar", "venue": "SSRN", "date": "2026-10-28", "apa": "Parundekar, S. (2026). Replicating USMV and SPLV with a Public-data Factor Risk ModelSpecification Ambiguity Dominates the Choice of Covariance Estimator. https://doi.org/10.2139/ssrn.7664321", "why": "公開データでMSCIとS&Pの低ボラティリティ指数を再構築し、共分散推定量の選択より指数の仕様の曖昧さが結果を大きく左右することを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "公表された指数の算出方法は完全な仕様ではないとして、MSCI USA最小分散指数とS&P 500低ボラティリティ指数を無料の公開データから作り直し、それぞれどこまで再現できるかを調べた（抄録）。SSRNの未査読のプレプリントである。", "p3": "前者は商用のファクター・リスクモデル上の制約つき最適化、後者は順位と逆ボラティリティの規則で定義される。4つの共分散の推定法を比べ、制約文書の曖昧さの解消の影響を、ブロック・ブートストラップで推定法の差の影響と切り分けた（抄録）。", "p5": "透明な規則はほぼ再現でき、SPLVを年率1.62%の追跡誤差（相関0.9939）で追えたが、最適化のUSMVは5.83%だった（抄録）。4つの推定法の差は26ベーシスポイント以内なのに、制約文書の曖昧さを1つ解くと追跡誤差が2.10ポイント動き、95%区間は[1.84, 2.35]対[0.15, 0.40]で、2,000回のリサンプルすべてで上回った（抄録）。", "fun": "公開されている作り方の説明どおりに株の組み合わせを作れば、同じ商品を再現できるはずだ。ところがこの研究では、単純な規則の指数はほぼ再現できたのに、最適化を使う指数は再現がずれた。原因は計算方法ではなく説明書の一文の解釈の違いで、その影響は計算方法の違いの8倍だった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn32", "rank": 32, "field": "組織行動・心理的安全性", "headline": "大型研究の運営を支える『SciOps』の実態", "title": "SciOps as Key Research Infrastructure: A decade of data to inform next steps for big science", "url": "https://doi.org/10.31235/osf.io/wu9rt_v1", "authors": "Anne E. Thessen ほか", "venue": "SocArXiv", "date": "2026-10-28", "apa": "Thessen, A. E., Saldutti, C. C., & Haendel, M. A. (2026). SciOps as Key Research Infrastructure: A decade of data to inform next steps for big science. https://doi.org/10.31235/osf.io/wu9rt_v1", "why": "NIHの大型共同研究で運営の負担が研究代表者に集中する問題を長年のデータで検討し、研究基盤としての運営組織の必要性を論じた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "NIHの資金による科学で大規模な多機関の研究計画の比重が増す一方、その運営の負担が科学の専門性で選ばれた研究代表者（PI）にかかるという食い違いの影響を、3種類のデータで調べた（抄録）。SocArXivの未査読のプレプリントである。", "p3": "大規模なNIHのコンソーシアムの参加者232人の自由記述、NIHの直接経費が最も多い17機関のPIの資格規定（2014〜2023年）、同じ期間の資金の集中を調べた（抄録）。", "p5": "符号化した390の引用のうち337が問題を挙げ、10年前にNIHの担当者が示した効果的なチームの10の特徴すべてに対応し、最も多いのは指導力と管理の技能だった（抄録）。17機関のどれもPIに指導力や事業管理の能力を求めず、2億ドル超を得たPIは13人で、所属機関のNIH直接経費の最大85%を占める例もあった。著者らは運営・財務・法務・広報の専門家の小さなチーム（SciOps）を提案した（抄録）。", "fun": "大きな研究プロジェクトのリーダーは優れた科学者として選ばれるが、大勢の人をまとめる管理の訓練を受けているとは限らない。調べた17の研究機関のどれも、リーダーに管理の能力を求めていなかった。著者らは、科学者の隣に運営の専門家チームを置くことを提案している。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn33", "rank": 33, "field": "組織行動・心理的安全性", "headline": "女性リーダーにとって女性ネットワークの価値", "title": "Female Empowerment and Network Value: The Contribution of Women’s Networks to Social Capital and Career Development among Female Leaders in Austria", "url": "https://doi.org/10.31235/osf.io/5bh3g_v2", "authors": "Andrea Navarro-Quezada", "venue": "SocArXiv", "date": "2026-10-28", "apa": "Navarro-Quezada, A. (2026). Female Empowerment and Network Value: The Contribution of Women’s Networks to Social Capital and Career Development among Female Leaders in Austria. https://doi.org/10.31235/osf.io/5bh3g_v2", "why": "オーストリアの女性リーダーについて、女性ネットワークと男女混合のネットワークの社会関係資本とキャリアへの価値を比べた修士論文の研究。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "オーストリアの女性管理職にとって女性のネットワークがどんな付加価値を持つかを、男女混合のネットワークと比べ、エンパワーメントの手段としてのメンタリングの役割とともに調べた、修士論文に基づく研究（抄録）。SocArXivの未査読のプレプリントである。", "p3": "公共・民間部門の女性管理職10人（27〜65歳）へのエピソード的な質的面接を、Mayringの質的内容分析で事前に定めたカテゴリーに沿って分析した（抄録）。", "p5": "女性のネットワークは安心できる場、支え、励まし、信頼に基づく交流という心理社会的な資本を主に生むが、昇進への直接の結びつきは限られ、混合のネットワークの方が人脈と可視性を通じて昇進に直接寄与した（抄録）。自己効力感と学びには女性のネットワーク、昇進と可視性には混合のネットワークという二重の戦略が支持された（抄録）。", "fun": "女性だけの集まりと男女混合の集まりでは、得られるものが違うらしい。オーストリアの女性リーダー10人に話を聞くと、女性だけの場は安心と励ましをくれる一方、昇進につながる人脈は混合の場の方で得られていた。両方を使い分けるのがよい、というのが結論だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "伝達率行列の感度帯で橋の損傷を位置特定・定量化", "title": "Damage quantification for beam bridges based on definitive frequency-band transmissibility matrix", "url": "https://doi.org/10.1177/14759217261499476", "authors": "Hainan Guo ほか", "venue": "Structural Health Monitoring", "date": "2026-10-29", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Guo, H., He, H., Han, X., & Wang, T. (2026). Damage quantification for beam bridges based on definitive frequency-band transmissibility matrix. Structural Health Monitoring. https://doi.org/10.1177/14759217261499476", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "双方向の走行車両と多径間橋の連成振動を解析", "title": "Parametric Study of Bidirectional Vehicle–Bridge Interaction for Idealized Multi-Span Highway Bridge with General Boundary Conditions", "url": "https://doi.org/10.3390/sym18111797", "authors": "Buyun Zhang ほか", "venue": "Symmetry", "date": "2026-10-28", "citescore": 5.2, "citescore_year": "2025", "apa": "Zhang, B., Sory, M. W., Zhang, X., Zhang, Y., & Tan, C. A. (2026). Parametric Study of Bi ne": "管理職の善意の支援が裏目に出る3つの仕組み", "title": "When People Management Backfires: A Qualitative Study of Unintended Consequences of Line Managers' Support for Employees", "url": "https://doi.org/10.1002/hrm.70107", "authors": "Roos Mulder ほか", "venue": "Human Resource Management (USA)", "date": "2026-10-29", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr16", "rank": 16, "headline": "未知の損傷状態も扱う開集合ドメイン適応の橋梁SHM", "title": "Shared-first risk-aware open-set domain adaptation for catalogue-absent structural state identification", "url": "https://doi.org/10.1088/1361-665x/aeba59", "authors": "Bing Liu ほか", "venue": "Smart Materials and Structures", "date": "2026-10-27", "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "橋の構造ヘルスモニタリングで、学習時の状態の一覧にない新しい応答（交通、支承の拘束、劣化、局所的なひび割れなど）が現れる問題に対し、共有クラスを優先するリスク考慮型のオープンセット領域適応の手順を提案した（抄録）。", "p3": "入力は18チャネルの加速度の窓で、局所的なTransformerのパッチと窓全体の統計量で表す。第1段階で既知の状態C00〜C06の基準を較正し、第2段階で共有クラスの確信度・ソース固有の確率・プロトタイプとの距離から標的のリスクを順位づけて低リスクの標本だけを整列させ、第3段階で高リスクの保留群の一部に問い合わせてC07〜C09を学んだ（抄録）。", "p5": "AbaqusのMEDIUM10とLOW10の手順で評価し、主な利点は共有の整列群がよりきれいになり、専門家が見直すための保留群が残ることだった（抄録）。証拠は模擬に基づき、実橋と長期の現地での検証は今後の課題とされた（抄録）。", "fun": "橋に取りつけたセンサーで異常を見つけるAIは、教わった種類の異常しか知らない。見たことのない揺れ方を無理に知っている種類に当てはめると、見逃しになる。この研究は、自信のない揺れは無理に分類せずに取り置き、専門家に一部だけ尋ねて新しい種類として学ぶ手順を作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "空間注意MLPで斜張橋のケーブル損傷を同定", "title": "Cable Damage Identification of Long-Span Cable-Stayed Bridges Using Spatial-Attention-Enhanced Multilayer Perceptron", "url": "https://doi.org/10.3390/buildings16214342", "authors": "Haonan Wang ほか", "venue": "Buildings", "date": "2026-10-29", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "長大な斜張橋の斜材ケーブルの損傷の位置と程度を特定する深層学習の枠組みを作った（抄録）。", "p3": "学習・検証・独立の試験データはすべて、損傷の位置と程度を変えたOpenSeesの有限要素モデルで生成した。空間注意モジュールで重要な空間的特徴を強めた多層パーセプトロンで、位置の分類モデルと程度の回帰モデルを別々に訓練した（抄録）。", "p5": "位置の識別精度は99.91%、程度の識別の信頼度は99.95%で、信号対雑音比15 dBの条件でもそれぞれ94.76%と97.33%を保った（抄録）。結果は試した数値データと白色雑音の条件の下での事例評価である（抄録）。", "fun": "斜張橋は何本ものケーブルで橋の重さを支えている。この研究のAIは、どのケーブルがどれだけ傷んでいるかを、雑音を加えた条件でも94.76%の精度で言い当てた。ただし使ったデータはすべてコンピュータの中の橋のもので、本物の橋で通用するかはこれからだ。", "unverified": "実橋の計測データでの検証は行われていない（抄録）。"}}, {"id": "jr18", "rank": 18, "headline": "点検情報で既設合成桁橋の有限要素と信頼性を評価", "title": "Inspection-Informed Finite-Element and Conditional Reliability Assessment of a Modified Composite Highway Bridge", "url": "https://doi.org/10.3390/buildings16214303", "authors": "Hakan Bayrak", "venue": "Buildings", "date": "2026-10-28", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "記録のない構造の改変と空間的に不完全な点検データが既存橋の評価をどう難しくするかを、6径間の合成桁の道路橋で調べた（抄録）。", "p3": "事業記録、現地観察、有限要素解析、鉄筋コンクリート断面の評価を組み合わせ、後から加えた橋脚の台座を拘束型と自由型の2つのモデルで表した。片側のコンクリートの欠損を方向別の残存断面とねじりに反映し、公称の鉄筋を用いて100本の橋脚柱すべてを3つの損傷の仮説で評価した。有限要素モデルは実験で検証していない（抄録）。", "p5": "6つの主な場合で最大の利用率は0.09772〜0.10059、部材の包絡の上限は0.10079〜0.10329で、範囲が重なるため支配的な柱を一つに特定できなかった（抄録）。条件つきの信頼性の計算は幾何の想定より抵抗モデルと統計の仮定に大きく左右され、裾の出力は較正された破壊確率とは解釈できないとした（抄録）。", "fun": "古い橋には、図面に残っていない後からの改造や、調べきれていない傷みがある。この研究は100本の柱をすべて計算で確かめたが、計算上の負担はどれも小さい一方で、どの柱が一番厳しいかは不確かさのせいで決めきれなかった。わからないことを正直に数字で示す姿勢が特徴だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "生成AIは誰の英語を改善するのか", "title": "Whose English Does Generative AI Improve? Algorithmically Mediated Unequal Englishes in the Workplace", "url": "https://doi.org/10.1177/23294884261500740", "authors": "Veronico N. Tarrayo", "venue": "International Journal of Business Communication", "date": "2026-10-29", "sjr": 1.047, "citescore": 11.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "英語が採用・協働・文書・顧客対応を媒介する職場で、生成AIは言語の平等化の道具とされるが、その生産性の向上は言語の平等ではないと論じる概念論文（抄録）。", "p3": "生成AIが組織の中でコミュニケーション上の権威・適応・信頼性をどう配り直すかを「アルゴリズムに媒介された不平等な英語（AMUE）」と名づけ、4つのつながった仕組みで説明した（抄録）。", "p5": "仕組みは、AIで磨かれた英語への規範の圧縮、不平等な言語的・感情的な労働、自動化された誤認とふるい分け、作者性と開示をめぐる信頼性の罠である（抄録）。公平なAIの統治は道具を与えるだけでなく、課題との関連、わかりやすさ、正確さ、相互の歩み寄り、働き手が自分の声を決める権利、技術のリスクへの組織の責任から効果的な伝達を定め直す必要があるとした（抄録）。", "fun": "AIで英語を直せば、英語が母語でない人も対等に働ける、と言われる。この論文は、それでもAIを使ったと明かすと信用されにくいといった新しい不平等が生まれると指摘する。道具を配るだけでなく、職場の「正しい英語」の基準そのものを問い直すべきだという主張だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "非公式の支援なしに一人で暮らす認知症の人", "title": "Living Alone With Dementia: Managing Without Informal Support to Contact and Navigate Services", "url": "https://doi.org/10.1177/14713012261491776", "authors": "Jenni Brooks ほか", "venue": "Dementia", "date": "2026-10-28", "sjr": 0.993, "citescore": 5.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "家族などの非公式な支援なしで一人暮らしをする認知症の人の必要と経験、そしてそのためのサービスを調べた、英国で初めての研究（抄録）。", "p3": "イングランドの2地域で自治体のサービス発注担当13人の監査、非公式な介護者のいない一人暮らしの認知症の人22人への面接、この人たちを支える4つのサービスの事例研究を行った（抄録）。", "p5": "発注担当の認識は限られ、この人たちを明示的に支えるサービスはごく少なく、介護者のいない人を除外する一般サービスもあり、地域の該当者数を把握する自治体はなかった（抄録）。本人たちは清掃、配食、地域のタクシー、自動の通知などを使って工夫して暮らしていたが、費用がかかるため不平等を広げうる。財務や事務の手続きへの支援が特に求められた（抄録）。", "fun": "認知症になっても一人で暮らしている人は多いが、頼れる家族がいない場合はどうしているのか。英国で22人に話を聞くと、配食サービスや自動で知らせてくれる仕組みなどを工夫して使っていたが、行政はそうした人が地域に何人いるかさえ把握していなかった。子どものいない高齢者が増える中で大切な問題だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "情報漏れを防いだ中国ST制度の財務困窮早期警戒", "title": "Ex Ante by Design: Leakage-Controlled Early Warning of Corporate Financial Distress Under China’s Special Treatment Regime", "url": "https://doi.org/10.3390/fi18110590", "authors": "Xinfeng Dou ほか", "venue": "Future Internet", "date": "2026-10-29", "citescore": 10.0, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "中国の特別処理（ST）制度の下で、企業の財務危機の早期警戒が、結果と同時に公表される情報を使ってしまう「漏れ」を避けるよう、予測の時点の制約をラベルに組み込んだ（抄録）。", "p3": "k年の財務諸表でk+2年の最初のSTまたは*ST（上場廃止リスクの警告）の指定を予測し、適格性は採点時に入手できる情報だけで決め、残る漏れの経路を監査した。A株の13,702企業年（2019〜2023年）を用いた（抄録）。", "p5": "主な対象（k=2023）でランダムフォレストのAUCは0.856（95%CI 0.811〜0.899）で、調整したロジスティック回帰や勾配ブースティングも同程度だった（抄録）。検証年で固定した閾値で4段階の見直し層を作るとST率は0.63%から33.33%へ単調に上がったが、同じ見直しの能力なら収益性の比率1つでもほぼ同数の事例を見つけ、層は順位の改善でなく確率の目盛りを加えるものだった（抄録）。", "fun": "会社の経営危機を予測するAIが高い成績を出しても、実は答えと同時に発表される情報を使っていることがある。この研究は、予測の時点で手に入る情報だけを使うよう設計し直し、それでもAUCで0.856の精度で2年先の警告の指定を予測できることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "潜在拡散モデルで壁乱流を生成しデータ同化", "title": "Turbulence generation and data assimilation in wall-bounded flows with a latent diffusion model", "url": "https://doi.org/10.1017/jfm.2026.12069", "authors": "Fabian Steinbrenner ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-29", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "壁に沿う乱流の高速な予測とデータ同化のため、変分オートエンコーダと拡散トランスフォーマーを組み合わせて4次元の時空間の標本を生成する生成モデルの枠組みを作った（抄録）。", "p3": "ベイズ的な条件づけで再学習なしにデータ同化を行い、標本化を通じて統計的な制約を課せるようにした。乱流の平面クエット流の部分領域に適用した（抄録）。", "p5": "直接数値計算で10^6程度の空間の自由度が要る領域を10程度の潜在の自由度で表し、10^5程度の圧縮率（既報より1〜2桁高い）を達成して、4次までの一点統計量、エネルギースペクトル、間欠性や位相に敏感な構造を再現した（抄録）。観測が事前分布と統計的に整合すれば複雑な統計を保てるが、条件づけが強すぎると学んだ事前分布がゆがむというトレードオフがあるとした（抄録）。", "fun": "風力発電所のまわりの風のような乱れた流れを正確に計算すると、膨大な時間がかかる。この研究のAIは、本来なら10の6乗程度の数で表す流れを10程度の数に縮めて表し、乱れの細かい性質まで再現した。少ない観測から流れ全体を推し量るのにも使える。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "砂中の杭の静止摩擦から動摩擦への遷移を実験", "title": "Experimental Investigation of the Static-to-Kinetic Friction Transition of Piles in Sand Subjected to Various Loading Rates", "url": "https://doi.org/10.1061/jggefk.gteng-14539", "authors": "Jieming Hu ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-29", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "砂中の閉端杭の単調な軸方向の支持力が、静的な載荷速度の違いでどう変わるかを実験で調べた（抄録）。", "p3": "載荷速度を変えた実験で先端抵抗と周面抵抗を分け、粒子破砕や界面のせん断、相対変位の効果を検討し、背骨曲線と支持力の予測式を含む速度に基づく摩擦モデルを提案した（抄録）。", "p5": "載荷速度が上がると総支持力ははっきり下がり、これは先端抵抗のわずかな増加と周面抵抗の大きな低下による（抄録）。破砕で生じた細粒が軸の周りのせん断帯に砂の殻を作り、高速では静止摩擦から動摩擦への移行で周面摩擦が下がり、界面が砂と鋼から砂と砂に移って摩擦係数・横方向の剛性・垂直応力が下がった。挙動は完全静止・名目静止・すべり前・転がりの4段階に分けられた（抄録）。", "fun": "重い物を押すとき、動き出すまでは力が要るが、動き出すと少し楽になる。止まっているときの摩擦より動いているときの摩擦が小さいからだ。この研究は、砂に打った杭を速く押すと同じことが起きて杭の周りの摩擦が下がり、支える力がかえって小さくなることを実験で示した。", "unverified": "実験の規模や載荷速度の範囲は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "ロイヤルティ特典の自動化に客はどう反応するか", "title": "When Humans Still Matter: Consumers’ Responses to Automation in Loyalty Program Preferential Treatment", "url": "https://doi.org/10.1177/00472875261499728", "authors": "Youlin Huang ほか", "venue": "Journal of Travel Research", "date": "2026-10-29", "sjr": 3.127, "citescore": 22.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "旅行業の会員制度で無料のアップグレードをAIが自動で決めるようになったとき、象徴的な意味を持つ決定の自動化に消費者がどう反応するかを調べた（抄録）。", "p3": "オンラインのコメントと自由記述の調査回答の主題分析に続き、量的な調査で結果を確かめた（抄録）。", "p5": "質的分析では、偏りのない決定と個別化の両方が逆説的に重視されていた（抄録）。量的研究では、AIについての素朴な信念が手続き的・対人的な公正を通じて好みと関連し、不満なアップグレードの決定に交渉する意図との関連は手続き的公正だけが完全に媒介し、特別な顧客として扱われたい欲求は対人的公正との関連を弱めた（抄録）。", "fun": "飛行機やホテルの無料アップグレードを、人ではなくAIが決めるとしたらどう感じるだろう。この研究では、人々は「えこひいきのない公平な決定」と「自分だけの特別扱い」の両方を求めるという矛盾した気持ちを持っていた。決め方の手続きが公平に見えることが大事だという。", "unverified": "調査の人数は抄録にない（未確認）。"}}, {"id": "jr25", "rank": 25, "headline": "公務員試験による採用でも残る差別", "title": "Discrimination in Bureaucratic Recruitment Under Civil Service Exams", "url": "https://doi.org/10.1002/pam.70137", "authors": "Thorbjørn Sejr Guul ほか", "venue": "Journal of Policy Analysis and Management", "date": "2026-10-29", "sjr": 1.741, "citescore": 4.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "官僚組織が公務員試験で候補者の能力を測るとき、民族・人種的な少数派が採用で差別されるかを、ニューヨーク市の地方政府のデータで調べた（抄録）。", "p3": "候補者名簿の固定効果を用い、試験の点数が同程度の候補者どうしで採用と初任給を比べた（抄録）。", "p5": "黒人とヒスパニックの候補者は同程度の点数の白人よりわずかに採用されやすく、選抜では小さな有利があった（抄録）。しかし新規採用者の初任給を見ると、少数派はより低い給与で採用され、高い点数への報酬も同等の白人より小さかった（抄録）。試験は公正な選抜の手段になりうるが、採用過程の後の段階での差別は防げないとした（抄録）。", "fun": "公務員試験は点数で決まるので公平なはずだ。ニューヨーク市のデータでは、確かに同じ点数なら少数派の人もむしろ少し採用されやすかった。ところが採用後の最初の給料を比べると、少数派の人の方が低かった。試験の後にも差が入りこむ場面があるということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "医療系専門試験でのLLMの構成概念妥当性", "title": "Construct Validity of Frontier Large Language Models on 4 Spanish Health Professions Specialty-Access Examinations (MIR, EIR, PIR, and FIR): Cross-Sectional Benchmarking and Psychometric Study", "url": "https://doi.org/10.2196/106199", "authors": "Clemente García-Hidalgo ほか", "venue": "JMIR Medical Education", "date": "2026-10-29", "sjr": 2.482, "citescore": 16.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "スペインの医療系4職種（医師・看護・心理・薬剤）の専門研修の選抜試験で、最先端のLLMの高い得点が人間の得点と同じ解釈を支えるかを、問題の易しさの対応から調べた（抄録）。", "p3": "2026年1月の4試験の有効な839問を、GPT-5.2の3つの推論努力とClaudeのOpus・Sonnet・Haiku 4.5を中立と専門家の2種類のプロンプトで組み合わせた12構成で各1回解かせ、828問の対で人と機械の易しさのスピアマン相関を主な指標とした（抄録）。", "p5": "最高の正解率は94.8%（795/839）で、12構成すべてが828問中668問（80.7%）に正解した（抄録）。人と機械の易しさの相関は0.40（95%CI 0.34〜0.45）で、一様なモデルの優位を仮定した模擬の予測（0.63）より低く、画像のある問題では正解率が下がった。著者らは、モデルの得点を人間の能力と同等の証拠と解釈しないよう注意を促した（抄録）。", "fun": "AIが医師の試験で高得点を取ったら、医師と同じ力があると言えるのか。スペインの4つの医療系試験で調べると、AIの最高正解率は94.8%だったが、人が難しいと感じる問題とAIが間違える問題はあまり一致しなかった。同じ点数でも、中身は人間とかなり違うということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "探索過程の監督で情報探索エージェントが頑健に", "title": "Supervising the search process produces reliable and generalizable information-seeking agents", "url": "https://doi.org/10.1038/s41467-026-78807-z", "authors": "Guangzhi Xiong ほか", "venue": "Nature Communications", "date": "2026-10-28", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "LLMの検索エージェントの訓練で、正しい最終回答だけに報酬を与える結果の監督は報酬のハッキングやモデル内部の記憶への依存を招くとして、監督を検索の過程そのものに移す枠組みRAG-Gymを提案した（抄録）。", "p3": "RAG-Gymで構造設計、パラメータの最適化、行動の評価を系統的に調べ、推論の振り返りが検索エージェントに重要な能力だと特定し、これに基づいて過程を監督するエージェントRe2Search++を作った（抄録）。", "p5": "Re2Search++は複数段の情報探索のベンチマーク、特に領域外の設定で大きく改善した。向上は主に答えの最適化よりも検索クエリの質の向上によるもので、学んだ検索の評価器は商用のLLMを含むモデル間で移転できた（抄録）。", "fun": "テストで答えだけ合っていれば満点という採点だと、途中の考え方がでたらめでも気づけない。この研究は、AIに調べものをさせるとき、答えではなく「どんな言葉で検索したか」という過程を採点して鍛えた。すると、慣れない分野の問題にも強いAIになった。", "unverified": "改善の具体的な数値は抄録にない（未確認）。"}}, {"id": "jr28", "rank": 28, "headline": "本震・余震の連鎖での地震損傷の累積を定式化", "title": "A Practical Formulation for Seismic Damage Accumulation on Multiple Mainshock‐Aftershock Sequences Based on Disaggregation of the Mainshock Hazard", "url": "https://doi.org/10.1002/eqe.70319", "authors": "Babak Ghods ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-29", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "前震・本震・余震と群れて起こる地震による構造物の損傷の累積を評価する際、地震ハザードの評価と構造のリスク解析を切り離し、ロジックツリー全体を扱わずに認識論的不確実性を考慮する実用的な方法を提案した（抄録）。", "p3": "必要なハザードの出力を、全ハザード曲線、ハザードの分解データ、余震の期待数、分解の区間ごとの余震の強さの条件つき分布の4つに絞り、本震のロジックツリーの枝を明示的に繰り返さずに計算量を減らせるようにした。3次元の断層面の影響を受ける2地点の4階・8階建ての鋼構造の特別モーメント骨組で、32枝のロジックツリーを用いて現行の方法と比べた（抄録）。", "p5": "例示の事例では、分解を十分に細かくすれば、遷移行列と時間とともに変わるリスクの誤差は5%未満にとどまった（抄録）。", "fun": "大きな地震のあとには余震が続き、一度傷んだ建物はさらに傷みやすくなる。こうした累積の危険を正確に計算するには、地震の専門家と建物の専門家の膨大な作業が絡み合っていた。この研究は、必要な情報を4種類に絞って作業を切り分け、誤差を5%未満に抑えられることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "移動計測（MMS）のGNSS観測を時空間で計画", "title": "AetherMMS: a space-time GNSS mission planning framework for mobile mapping systems", "url": "https://doi.org/10.1007/s10291-026-02172-z", "authors": "Matteo Cappuccio ほか", "venue": "GPS Solutions", "date": "2026-10-29", "sjr": 1.451, "citescore": 8.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "都市や一部が遮られた環境で、走行経路と走行時刻の両方が測量の品質を左右するモバイルマッピングシステム（MMS）の計画のため、オープンソースのPythonの道具AetherMMSを作った（抄録）。", "p3": "計画した軌跡、地形の標高、建物の外形、植生の層から測量の場面を再構成し、GPSとGalileoの暦を伝搬させて、観測の時刻ごとにすべての衛星と受信機の見通し線を光線追跡した。見える衛星の数、PDOP、空の見通し指数を経路に沿って評価し、候補の取得時間帯を順位づけた（抄録）。", "p5": "短いトンネルや覆われた道路を通る開けた経路では衛星が使えない区間を特定し、密集した都市の谷間では遮蔽のモデルで見えるはずの衛星の平均35%が除かれた（抄録）。現地実験では、最も良いと予測した時間帯に同じ経路を測ると、整数値バイアスが確定した時刻の割合が6.3%から25.7%に増え、連続した確定解で覆われる経路長が56 mから744 mに延びた（抄録）。", "fun": "ビルの谷間では、GPSの衛星がビルに隠れて位置がうまく測れない。衛星は時間とともに空を動くので、同じ道でも走る時刻を変えれば見える衛星が変わる。この道具で一番良い時間帯を選んで測ると、精密な位置が連続して求まる区間が56 mから744 mに延びた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "侵食性の床上の乾燥粒状流の流動性を実験", "title": "Mobility of dry granular flows over contrasting erodible bed materials in laboratory experiments", "url": "https://doi.org/10.5194/nhess-26-5315-2026", "authors": "Katharina Wetterauer ほか", "venue": "Natural hazards and earth system sciences", "date": "2026-10-28", "citescore": 8.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "土石流の移動性が、侵食と取り込みで流れと河床の間の質量と運動量がやり取りされることにどう影響されるかを、侵食される河床の慣性（密度）を変えた水路実験で調べた（抄録）。", "p3": "密度が一定の石英の流れを、密度が低い・等しい・高い侵食性の河床の上に流して慣性の弱い・中立・強い条件を作り、侵食のない参照条件と比べた。各条件を細砂と砂礫混合で繰り返した（抄録）。", "p5": "低密度の河床では見かけの平均侵食速度が高く、流れの先端が速く、到達距離が長かった一方、同密度と高密度の河床では侵食が浅く、先端が遅く、堆積が短くまとまり、両者は似た振る舞いだった（抄録）。この非対称は密度の差だけでは説明できず、粒子の形や内部摩擦角の違いも寄与するとした（抄録）。", "fun": "山の斜面を流れ下る土石流は、途中で地面の土を削り取りながら進む。軽い土を取りこむと流れはより遠くまで走ったが、重い土を取りこんでも予想に反して勢いは落ちなかった。この研究は、土の重さだけでなく、粒の丸さや角ばり方も流れの勢いを左右するらしいことを実験で示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "土石流の2次元多物理ソルバーをPythonで公開", "title": "PyDebrisFlow2D: A 2D Conservative Python Multiphysics Solver for Variable-Density Debris Flows with Voellmy Resistance, Bed Exchange, and Grain Size Segregation", "url": "https://doi.org/10.3390/app162110593", "authors": "Mauricio Secchi ほか", "venue": "Applied Sciences", "date": "2026-10-26", "citescore": 6.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "高速の自由表面の伝播、混合物の組成の変化、濡れ・乾きの前線、底面の抵抗、河床との交換、粒径の分級を一体に扱う、密度が変化する土石流のための2次元の保存型Pythonソルバーを作った（抄録）。", "p3": "移動する流体、層をなす細粒と粗粒の固体、2つの水平の運動量の7つの保存変数による水深平均のモデルで、組成に依存するVoellmyの抵抗を構成要素の体積から導いた。デカルト格子の有限体積法、静水圧再構成、HLLC流束などで解き、濡れ・乾きの境界付近の頑健性の工夫を加えた（抄録）。", "p5": "検証実験で流束の整合性、釣り合いの保持、構成要素の保存、安定な収束を確かめ、最も細かい格子では2次の方法で相対L1誤差が13.35倍小さく、実行時間は2.309倍だった（抄録）。実地形（Marsicano）では主な流路と末端の堆積域を体積を保って再現し、最大の例でCUDAは24スレッドのCPUより67.39倍速かった。ただし観測による検証ではないとした（抄録）。", "fun": "土石流をコンピュータで再現するには、水と細かい土と大きな石が混ざり、地面を削ったり積もったりする様子を同時に計算する必要がある。この研究は誰でも使えるPythonのプログラムを作り、グラフィックス用の計算装置（GPU）を使うと24スレッドのCPUより67.39倍速く計算できることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "英国の高齢者の主観的孤独と客観的孤立のずれ", "title": "Socioeconomic correlates of social asymmetry in English older adults: findings from a population-based cohort study", "url": "https://doi.org/10.1093/geronb/gbag195", "authors": "Bill Calvey ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-10-29", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "主観的な孤独と客観的な社会的孤立のずれ（社会的非対称）に、個人と地域の社会経済的な指標が縦断的に関連するかを、英国の高齢者で調べた（抄録）。", "p3": "英国高齢者縦断研究（ELSA）の第7〜9波（2014〜2019年）の60歳以上の8,164人を用い、標準化した孤独と孤立の差を連続の得点とし（正は孤立の割に孤独が少ない回復力、負は孤立の割に孤独が多い脆弱性）、時間で変わる一般化推定方程式で推定した（抄録）。", "p5": "すべての社会経済の指標が、心理的な共変量を調整しても非対称と関連した（抄録）。高等教育（β=0.44）、高い世帯収入（β=0.22）、主観的な社会的地位は回復力と、個人と地域の剥奪、人口密度、インターネットをほぼ使わないこと（β=−0.26）、失業、民間（β=−0.35）や社会住宅（β=−0.41）の賃貸は脆弱性と関連した（抄録）。", "fun": "一人で過ごす時間が長くても寂しくない人もいれば、人に囲まれていても孤独な人もいる。英国の60歳以上の8,164人を調べると、教育や収入に恵まれた人ほど「一人でも寂しくない」側に、賃貸住まいやネットを使わない人ほど「寂しさが強い」側にいた。孤独は心の問題だけでなく、暮らしの格差の問題でもある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "筋骨格疾患のインフォーマル介護の質的統合", "title": "Informal Caregiving in Musculoskeletal Conditions: A Systematic Review and Thematic Synthesis of Qualitative Studies", "url": "https://doi.org/10.1155/hsc/3159665", "authors": "Nanati Legese Alemu ほか", "venue": "Health & Social Care in the Community", "date": "2026-10-29", "citescore": 6.7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "筋骨格系の疾患のある成人を支える非公式な介護者が、地域と医療の仕組みの中でどんな経験をしているかを、質的研究の系統的レビューと主題の統合でまとめた（抄録）。", "p3": "MEDLINE、Embase、CINAHL、PsycINFOを検索し、題名と抄録は1人、全文の適格性は2人が独立に評価し、CASPの質的チェックリストで質を評価した（抄録）。", "p5": "18件の研究が含まれ、介護者は主に配偶者や成人した子で、準備や公的支援が乏しいまま持続的な感情的・身体的な負担を負っていた（抄録）。見えにくく周縁化された仕事、身体的・感情的な労働、関係の組み替えと二者間の緊張、日常生活の社会的・経済的な縮小、意味づけと関係の回復力の5つのメタ主題が見いだされ、関係の強まりや個人的な意味も伴っていた（抄録）。", "fun": "腰や関節の病気は外から見えにくいため、それを支える家族の苦労も見過ごされがちだ。18件の研究をまとめると、介護する配偶者や子どもは準備も支援もないまま心と体の負担を抱えていた。一方で、介護を通じて家族の絆が深まったという声もあった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "日本の高齢者のスマホ利用受容尺度を開発", "title": "Development and validation of the smartphone use acceptance scale among Japanese older adults: a diagnostic tool for educational interventions.", "url": "https://doi.org/10.1080/02701960.2026.2750168", "authors": "Cheng Y ほか", "venue": "Gerontology & geriatrics education", "date": "2026-10-28", "citescore": 3.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "short": true, "p1": "高齢者のスマートフォンの継続的な利用に向けた心理的な準備を測るため、多次元のスマートフォン利用受容尺度を日本の高齢者で開発し、妥当性を検証した（抄録）。", "p3": "60〜99歳の日本の高齢者400人にオンライン調査を行い、標本を無作為に分けて探索的因子分析（200人）と確認的因子分析（200人、対角重みづけ最小二乗法）を行った（抄録）。", "p5": "利用の自己効力感、感情的な受容、利点の認識の3因子・25項目の構造が支持され、適合度はCFI=.987、RMSEA=.084、内的一貫性はα=.925と高かった（抄録）。自己効力感、スマートフォンの習熟度、性格特性、利用経験との理論的に整合する関連で妥当性も支持された（抄録）。", "fun": "スマートフォンの使い方を教える講座は多いが、使い続けようと思えるかどうかという気持ちの準備は見落とされがちだ。この研究は、日本の60〜99歳の400人の回答から、自信・気持ち・便利さの実感の3つの面でその準備を測る25問の物差しを作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "高齢者にやさしい都市への参加の期待と現実", "title": "Aspirations and expectations of participation in age-friendly cities: Perspectives from across four European case studies", "url": "https://doi.org/10.1177/00420980261493750", "authors": "Patty Doran ほか", "venue": "Urban Studies", "date": "2026-10-28", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "高齢者に優しい都市・地域の枠組みの中で、政策担当者と実施の協力者が高齢者の「参加」をどう理解し進めているかを、欧州の長い歴史を持つ4都市の多事例研究で調べた（抄録）。", "p3": "ブルノ、オスロ、ブリュッセル、ビルバオで、半構造化面接（42件）と観察のフィールドワークを、各国の専門家の支援を受けて行った（抄録）。", "p5": "活動的で健康な加齢と結びついた個人の参加、意思決定への市民的・民主的な関与、社会と地域の日常生活への参加、包摂と排除への懸念の4つの主題が見いだされ、参加は複数の、時に競合する意味で理解されていた（抄録）。望めば自分の条件で選べる機会としての参加と、活動的な加齢に伴う期待としての参加の間に緊張があり、これに注意しないと不平等を再生産しうると論じた（抄録）。", "fun": "お年寄りが地域の活動に参加するのは良いことだが、「元気に参加すべきだ」という期待が強すぎると、参加したくてもできない人が取り残される。ヨーロッパの4都市で42件の聞き取りをすると、参加は「選べる機会」と「求められる務め」の間で揺れていた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "企業報告の中身を先読みするベイズ的市場効率", "title": "How markets forecast and \"front run\" information: Bayesian market efficiency", "url": "https://doi.org/10.1007/s11846-026-01071-4", "authors": "David Johnstone", "venue": "Review of Managerial Science", "date": "2026-10-29", "sjr": 2.587, "citescore": 21.2, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "ベイズ的な投資家が企業の報告を待たずに、その内容の確率分布を推し量って株価を付け直す「先回り」を、資産価格の式に組み込んだ理論研究（抄録）。", "p3": "報告の内容とその結果の株価への不確実性を考え、資産価格の式に、企業の将来の財務報告の精度・質に関わるリスク・プレミアムを入れた（抄録）。", "p5": "プレミアムは正にも負にもなり、企業は情報システムや報告の質の選び方で資本コストを上げも下げもできる（抄録）。保守的な会計など、良い知らせより悪い知らせを効率よく明らかにする傾向のある将来の情報源は、企業の現在の資本コストを高めるとした（抄録）。", "fun": "投資家は会社の決算発表を待たずに、「たぶんこんな内容だろう」と予想して先に株を売り買いする。この研究は、その予想の確かさが株価にどう織りこまれるかを理論で示し、悪い知らせが早く出やすい会計の仕組みは、かえって会社がお金を集める費用を高めると結論した。", "unverified": "理論の結論で、データによる検証の有無は抄録にない（未確認）。"}}, {"id": "jr37", "rank": 37, "headline": "銀行の利益調整と裾リスク、女性比率の役割", "title": "Tail Risk and Earnings Management: The Role of Gender Diversity and Environmental–Social Reporting in International Banking", "url": "https://doi.org/10.1002/bse.71675", "authors": "Marwa Elnahass ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-29", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "利益調整（アーニングス・マネジメント）が銀行のテールリスクに与える影響と、取締役会の女性比率と環境・社会（ES）報告による調整の役割を調べた（抄録）。", "p3": "12か国の上場商業銀行157行について、2002〜2022年の3,297銀行年の観測を用いた（抄録）。", "p5": "利益調整を行う銀行ほどテールリスクが高かったが、取締役会の女性の代表が強いか、ESの評価が高いと、その高まりは和らいだ（抄録）。", "fun": "決算の数字を見栄えよく調整する銀行は、めったに起きない大損の危険も大きい。12か国の157の銀行を2002年から2022年まで調べると、取締役に女性が多い銀行や、環境や社会への取り組みの評価が高い銀行では、その危険の高まりが小さかった。", "unverified": "推定方法と効果の大きさは抄録にない（未確認）。"}}, {"id": "jr38", "rank": 38, "headline": "研究開発企業への継続企業の疑義の付け方", "title": "Do Auditors Treat Clients Engaging in Research and Development Differently When Issuing Going Concern Modifications?", "url": "https://doi.org/10.2308/ajpt-2022-172", "authors": "Scott N. Bronson ほか", "venue": "Auditing", "date": "2026-10-28", "sjr": 2.32, "citescore": 5.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "研究開発（R&D）を行う企業は、会計処理で当期の利益が減り将来の価値も十分に表されないため分析が難しいとして、R&D支出が監査人の継続企業の前提に関する意見の修正（GCM）の判断に影響するかを調べた（抄録）。", "p3": "R&Dの集約度とGCMの可能性、GCMの正確さ（倒産した顧客にGCMが出ない第2種の誤り）、従来の会計ベースの倒産指標への重みづけの関係を分析した。データは本文で引用された公開の資料から入手できる（抄録）。", "p5": "R&Dの集約度が高いほどGCMの可能性は高く、第2種の誤りの面での正確さも高かった（抄録）。R&D企業の監査人は、GCMを出すとき従来の会計ベースの倒産指標を、非R&D企業の監査人ほど重視していなかった（抄録）。", "fun": "研究開発にお金をかける会社は、今は赤字でも将来大きく稼ぐかもしれない。監査人はそうした会社に「存続が危ういかも」という注意書きをつけやすいが、実際に倒産する会社を見逃すことも少なかった。帳簿の数字だけでなく別の見方もしているらしい。", "unverified": "標本の規模と期間は抄録にない（未確認）。"}}, {"id": "jr39", "rank": 39, "headline": "組織支援と職務の工夫が看護師のAI観に効く", "title": "The mediating role of job crafting in the relationship between perceived organizational support and nurses' attitudes towards artificial intelligence: a cross-sectional study based on the job demands–resources model", "url": "https://doi.org/10.3389/fmed.2026.1942864", "authors": "Xuan Cui ほか", "venue": "Frontiers in Medicine", "date": "2026-10-29", "citescore": 5.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "職務要求–資源モデルに基づき、組織からの支援の認知と、働き手が自ら仕事を工夫するジョブ・クラフティングが、看護師のAIの活用への態度にどう関わるかを調べた横断研究（抄録）。", "p3": "2026年4〜6月に中国の三級甲等病院の臨床看護師314人に便宜的標本抽出で依頼し、305人の有効回答を得た。組織支援、看護師のジョブ・クラフティング、職場でのAI活用の態度の尺度を用い、SPSS PROCESSのModel 4（ブートストラップ5,000回）で媒介を検定した（抄録）。", "p5": "3変数は互いに正の相関（r=0.502〜0.715）を示し、ジョブ・クラフティングは組織支援とAIへの態度の関係を部分的に媒介し、総効果の60.8%を占めた（間接効果0.248、95%CI 0.169〜0.337）（抄録）。間接効果は肯定的な認識では有意だったが、AIへの懸念では有意でなかった。横断デザインのため因果の推論には限界がある（抄録）。", "fun": "病院にAIが入ってきても、使いたくないと感じる看護師は少なくない。中国の看護師305人を調べると、職場から支えられていると感じ、自分で仕事のやり方を工夫している人ほどAIに前向きだった。ただし工夫はAIの良い面の受けとめ方には効いても、AIへの不安は減らしていなかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "遠隔・ハイブリッド勤務で組織同一化を保つ", "title": "The Leadership Challenge of Remote and Hybrid Work: Leveraging Organizational Identity", "url": "https://doi.org/10.1177/10596011261495365", "authors": "Robert C. Litchfield ほか", "venue": "Group and Organization Management", "date": "2026-10-28", "sjr": 2.543, "citescore": 11.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "オフィスのような従来の意味づけの場が力を失った在宅・ハイブリッド勤務で、知識集約型の組織のリーダーが働き手の組織への同一化をどう保てるかを論じた理論研究（抄録）。", "p3": "組織の境界の理解と、それを強く管理したい欲求がリーダーによって違うことを「開放系」の組織観で捉え、その違いから組織アイデンティティを生かすリーダーシップの型を描き分けた（抄録）。", "p5": "在宅・ハイブリッド勤務をリスクでなく利点と見る新しい開放系のアプローチを理論化し、それが組織への同一化を育てて創造性と革新を高めうると提案した（抄録）。ただし、働き手が生む価値を前もって設計しにくく、非生産的な行動を見つけにくくなるという代償があるとした（抄録）。", "fun": "みんなが家で働くようになると、「この会社の一員だ」という気持ちをどう保つかが難しくなる。この論文は、職場の境界を固く守るより、ゆるやかに開いた方が社員の帰属意識と創造性を高めうると考える。ただし、社員が何をしているか見えにくくなるという代償もある。", "unverified": "理論の提案で、実証による検証は行われていない（抄録）。"}}, {"id": "jr41", "rank": 41, "headline": "環境配慮の『摩擦』が観光客の満足を下げる", "title": "The Cost of Being Green: Sustainability‐Linked Eco‐Friction, Trade‐Off Tolerance, and Tourist Satisfaction in Island Reviews", "url": "https://doi.org/10.1002/bse.71772", "authors": "Van Kien Pham ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-28", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "持続可能性は観光の価値を高めると考えられがちだが、実際のサービスの場で旅行者が環境配慮を常に好意的に評価するとは限らないとして、島と沿岸の観光で「エコの喜び」と、環境に根ざした不便である「エコの摩擦」を区別して調べた（抄録）。", "p3": "東南アジアと東アジアの10の観光地のGoogle MapsとTripAdvisorの口コミ138,683件に、2言語の辞書によるテキスト分析と口コミ単位の計量モデルを当て、手作業の検証と広い・厳しい定義の感度分析で分類の不確実性を明示した（抄録）。", "p5": "広い標本では、エコの喜びは評価点と正に、エコの摩擦は負に関連し、摩擦の負の関連の方が強く、持続可能性に特有の非対称な否定性が示された（抄録）。トレードオフへの寛容はこの不利を弱めたが、ずっと小さい厳しい定義の標本では再現しなかった。著者らは指標を心理の測定でなく言説の不完全な指標と解釈した（抄録）。", "fun": "環境に優しい宿は素敵だが、環境のための不便を感じると評価は下がる。アジアの10の観光地の口コミ138,683件を調べると、エコの不便による減点は、エコの喜びによる加点より大きかった。環境への配慮は、旅行者にとって良いことずくめではないということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "『温かい満足感』の訴求は電力の選択を変えるか", "title": "Do “warm glow” feelings affect climate mitigation behaviors? A field experiment on consumer electric energy choices", "url": "https://doi.org/10.1111/pops.70216", "authors": "Jennifer Jerit ほか", "venue": "Political Psychology", "date": "2026-10-28", "sjr": 1.938, "citescore": 7.6, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "持続可能な行動から得られる喜びや満足を強調する「ウォーム・グロー」のメッセージが、自己申告の意図でなく実際の費用のかかる選択を変えるかを、ニューハンプシャー州ハノーバーでの電力選択の野外実験で調べた（抄録）。", "p3": "地元の組織と組み、2025年初めに無作為化した段階的な展開の設計で、再生可能エネルギーの比率を上げるよう促すウォーム・グローのはがきを送る時期を系統的に変え、電力の選択の行政データを分析した（抄録）。", "p5": "野外で届けたウォーム・グローのメッセージは、再生可能比率の高い電力の選択に効果がなく、より環境に優しいが割高な選択肢に変えた顧客はわずかだった（抄録）。", "fun": "「環境に良いことをすると気持ちがいいですよ」と呼びかければ、人は行動を変えるのだろうか。アンケートではそう答える人が多いが、アメリカの町で実際にはがきを送って電気の契約を調べると、割高な再生可能エネルギーに切り替えた人はわずかだった。言うこととすることは違う。", "unverified": "対象の世帯数と切り替えた人数は抄録にない（未確認）。"}}, {"id": "jr43", "rank": 43, "headline": "添乗員の魅力とサービス失敗からの回復", "title": "The role of tour guide attractiveness in service failure recovery: Insights from methodological triangulation", "url": "https://doi.org/10.1177/14673584261501490", "authors": "Hakan Boz ほか", "venue": "Tourism and Hospitality Research", "date": "2026-10-28", "citescore": 10.2, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "パッケージ旅行でのサービスの失敗からの回復で、添乗員の外見的な魅力と性別の組み合わせが旅行者の評価とどう関連するかを、方法の三角測量で調べた（抄録）。", "p3": "シナリオに基づく調査（N=134）と視線計測の実験（N=26）を組み合わせ、結果の失敗と過程の失敗からの回復について、明示的な評価と視線による注意を調べた（抄録）。", "p5": "両研究とも、結果の失敗の場面では、魅力的でない男性より魅力的な女性の添乗員の方が回復の満足、添乗員の満足、会社を勧める意図が高かった（抄録）。ただしこの有利は過程の失敗では弱まり、許しや悪い口コミの回避といった深い行動の約束には及ばず、視線を長く集めても意識的な評価には直結しなかった（抄録）。", "fun": "旅行でトラブルが起きたとき、謝りに来た添乗員の見た目で印象は変わるのだろうか。134人の調査と26人の視線の実験では、魅力的な添乗員は確かに目を引き、評価も少し上がったが、許すかどうかといった深い気持ちまでは変えなかった。見た目の効果には限界がある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "高密度化は住宅の商品化を進めるか、3都市比較", "title": "Denser housing, more commodified? Comparing the relationship between densification and the production of (de-)commodified housing in Milan, Oslo and Vienna", "url": "https://doi.org/10.1177/00420980261494806", "authors": "Michael Friesenecker ほか", "venue": "Urban Studies", "date": "2026-10-28", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "都市の高密度化は住宅の供給と手頃さを改善する戦略とされることがあるが、市場主導の開発で商品化された住宅を再生産しがちだとして、高密度化と住宅の（脱）商品化の関係を、制度と政策の媒介に着目して比べた（抄録）。", "p3": "住宅制度と政策の能力が異なるミラノ、オスロ、ウィーンで、高密度化した地域の保有形態の構成の量的分析と、土地・用途地域・住宅政策の能力の質的評価を組み合わせた（抄録）。", "p5": "高密度化で生まれた住宅は主に商品化されていたが程度は異なり、オスロは民間主導の土地開発と限られた住宅政策で市場主導、ミラノは計画の能力は高いが補助は少なく、ウィーンは土地の供給と用途規制に限定利益の住宅への補助を組み合わせていた（抄録）。同じ高密度化の戦略でも制度の文脈で結果が変わるとした（抄録）。", "fun": "家をたくさん建てれば暮らしやすくなる、と考えがちだ。ところがヨーロッパの3都市を比べると、同じように高密度に建てても、市場任せの町では商品としての住宅ばかりが増え、ウィーンのように土地と補助を組み合わせる町では市場に任せない住宅も生まれていた。町の仕組みしだいで結果は変わる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "衛星・気候・人口データで都市の暑熱リスクを評価", "title": "Mapping Urban Heat Risk and Climate-Adaptation Priorities in Saudi Cities: An Explainable Geospatial Machine-Learning Framework Using Open Satellite, Climate, and Population Data", "url": "https://doi.org/10.3390/smartcities9110185", "authors": "Ra’ed Masa’deh ほか", "venue": "Smart Cities", "date": "2026-10-29", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "サウジアラビアの都市の暑熱管理のため、持続的な熱のパターンを都市ごとの気候と形態の効果から分ける、再現可能なオープンデータの枠組みをリヤド、ジッダ、ダンマームで作った（抄録）。", "p3": "2014〜2025年の夏（6〜9月）のLandsat 8/9から地表面温度、NDVI、NDBIを求め、ERA5-Landの気象、GHSLの市街地と人口、WorldPopの2020年の年齢構成を加え、各都市の半径30 kmの範囲で545,027の空間記録と720シーンの台帳を作った（抄録）。", "p5": "夏の地表面温度の90パーセンタイル（P90）の12年の中央値はダンマームが56.80 °Cで最も高く、ジッダ54.90 °C、リヤド53.66 °Cが続き、どの都市にも有意な単調の傾向はなかった（抄録）。空間ブロックの交差検証で勾配ブースティングはR2=0.679±0.044だったが、都市を一つ除く検証では移転可能性が限られ、全国一律でなく都市ごとの計画を支持した（抄録）。", "fun": "砂漠の国の都市では、夏の地面が驚くほど熱くなる。サウジアラビアの3都市を2014年から2025年まで調べると、地表の熱さの指標はダンマームで56.80 °Cにもなっていた。緑の多い場所ほど涼しく、建物が密集した場所ほど暑いという関係は3都市に共通だった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "街路区間で測る防犯環境設計（CPTED）の効果", "title": "Crime prevention through environmental design in a midsize city: a street-segment analysis of Fort Wayne’s High Street corridor", "url": "https://doi.org/10.1007/s11292-026-09793-x", "authors": "John MacDonald ほか", "venue": "Journal of Experimental Criminology", "date": "2026-10-29", "sjr": 1.068, "citescore": 7.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "インディアナ州フォートウェインのハイストリートで、歩行者向けの街灯、壁画、歩道の改良、地域の活性化を組み合わせた防犯環境設計（CPTED）の事業が、月ごとの届け出犯罪の減少と関連したか、減少が近くへの転移か利益の拡散かを調べた（抄録）。", "p3": "2010〜2023年の街路区間単位の犯罪データで、事業前後のハイストリートの区間と、距離を変えた比較区間（事前の傾向をそろえたエントロピー・バランスの対照群を含む）を、差の差のポアソン回帰で比べた（抄録）。", "p5": "事業は実施後2年間で月ごとの届け出犯罪の45.2〜60.3%の減少と関連し、効果は段階的な実施とともに徐々に強まった（抄録）。近くの区間でも犯罪が減り、転移でなく利益の拡散と整合した。どの要素が効いたかは切り分けられないとした（抄録）。", "fun": "街灯を明るくし、壁に絵を描き、歩道を直すと、犯罪は減るのだろうか。アメリカの中規模の町のある通りでは、こうした工夫をまとめて行った後の2年間で、届け出された犯罪が45.2〜60.3%減った。しかも犯罪が近くの通りへ逃げたのではなく、周りでも減っていた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "系統的レビューの質評価で生成AIと人の一致を検証", "title": "Human Consensus Versus Generative Artificial Intelligence When Assessing the Methodological Quality and Overall Confidence in the Results of Systematic Reviews With Meta‐Analysis in Endodontology", "url": "https://doi.org/10.1111/iej.70297", "authors": "Venkateshbabu Nagendrababu ほか", "venue": "International Endodontic Journal", "date": "2026-10-28", "sjr": 2.539, "citescore": 14.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "歯内療法学のメタ分析つき系統的レビューの方法論的な質と、結果の全体的な信頼度の評価で、ChatGPT-5.5と人間の評価の一致を調べた（抄録）。", "p3": "2021〜2024年に英語で出版された系統的レビュー100件を3人の専門家がAMSTAR 2で評価して合意のデータを作り、ChatGPT-5.5に新しく作った3つのアカウントで項目ごとの評価と全体の信頼度を出させ、一致率と線形重みつきκで比べた（抄録）。", "p5": "「極めて低い」と分類したのは人間の合意で47件、ChatGPT-5.5で85件で、主な基準では全体の信頼度の一致は52%（重みつきκ=0.182）、別の基準では一致率83%でもκは0.173とほぼ同じだった（抄録）。3つのアカウントの間の一致は高かったが人間との一致は保証せず、著者らは独立の評価者としての使用を支持しないとした（抄録）。", "fun": "論文の質をAIに採点させれば楽になるが、信頼できるのだろうか。100本の論文で比べると、AIは人間よりずっと厳しく、人間が47本としたところを85本も「極めて低い」と判定した。AIは何度聞いても同じ答えを返しやすいが、同じ答えだからといって正しいとは限らない。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "健康教育の作者をAIとすると患者の信頼は変わるか", "title": "Patient trust in health education attributed to generative artificial intelligence versus a physician: a randomized survey study of pregnant and postpartum women", "url": "https://doi.org/10.1093/jamia/ocag180", "authors": "Shaila Fye ほか", "venue": "Journal of the American Medical Informatics Association", "date": "2026-10-28", "sjr": 1.87, "citescore": 11.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "同じ健康教育の記事でも、作者が医師とされるか生成AIとされるかで、患者の内容への信頼と勧める医師への信頼が変わるかを、事前登録した無作為化の並行調査で比べた（抄録）。", "p3": "妊娠中または産後の英語を話す米国の成人400人を2025年8〜10月にオンラインの調査パネルで集め、同じ記事の作者を医師、生成AI、AIの支援を受けた医師、作者なしの4条件に無作為に割り付けた（抄録）。", "p5": "作者を正しく覚えていた195人では、AIだけの作者は医師だけの場合より内容への信頼（平均9.43対11.11）と勧める医師への信頼（8.93対10.84）が低く、AIの支援を受けた医師は医師だけと有意に違わなかった（抄録）。確認を通過した参加者全体（321人）での感度分析もおおむね一致し、関心の度合いには差がなかった（抄録）。", "fun": "まったく同じ記事なのに、「AIが書きました」と書かれているだけで信頼されにくくなる。アメリカの妊娠中・産後の人を対象にした実験では、AIが書いたとされた記事は医師が書いたとされた記事より信頼が低かった。ただ「医師がAIの助けを借りて書いた」とすれば、医師だけと差はなかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr49", "rank": 49, "headline": "移動試験車両で減衰の影響を除き橋のモード形を再構成", "title": "A Hilbert-based damping effect elimination approach for accurate bridge mode shapes reconstruction using a moving test vehicle: theory and experiment", "url": "https://doi.org/10.1007/s13349-026-01133-x", "authors": "K. Shi ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-10-29", "citescore": 8.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、走行する試験車両を使って橋のモード形状（振動の形）を正確に再構成するため、ヒルベルト変換に基づいて減衰の影響を取り除く方法を、理論と実験の両面から示した研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋の上を車で走るだけで、橋がどんな形で揺れるかを測れたら、点検はずっと楽になる。ただ、揺れは時間とともに弱まっていくので、その弱まりが形の推定をゆがめてしまう。題名からは、その弱まりの影響をどう取り除くかという問いに挑んだことが読み取れる。", "unverified": "手法・結果とも未確認。"}}, {"id": "jr50", "rank": 50, "headline": "民間開発での価値獲得と自治体の公共用地形成", "title": "Securing public amenities and city infrastructure: the case of value capture and municipal property formation in private-led development", "url": "https://doi.org/10.1080/19463138.2026.2750607", "authors": "Nir Mualam", "venue": "International Journal of Urban Sustainable Development", "date": "2026-10-29", "citescore": 5.3, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、民間主導の開発で、開発利益の還元（バリューキャプチャー）と自治体の財産の形成によって、
