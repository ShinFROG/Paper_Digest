<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </footer>
</div>

くかかることもある。この研究は、手間がかかるのは土が崩れかけている所と水面の近くだけだと見抜き、そこを中心に計算することで、11〜14時間かかっていた計算を10〜11分に縮めた。", "unverified": "学習用の全次元計算を含むオフラインの費用の総額は確認していない。"}}, {"id": "pr02", "rank": 2, "headline": "LLMで調査回答を模擬する研究55件のレビュー", "title": "RESEARCH SYNTHESIS -- LLM-Based Simulations of Survey Responses: A Systematic Literature Review and Synthesis of Methods", "url": "https://doi.org/10.31235/osf.io/fy4az_v1", "authors": "Hao Ting Chan ほか", "venue": "SocArXiv", "date": "2026-10-28", "apa": "Chan, H. T., Assenmacher, D., Stier, S., & Wagner, C. (2026). RESEARCH SYNTHESIS -- LLM-Based Simulations of Survey Responses: A Systematic Literature Review and Synthesis of Methods. https://doi.org/10.31235/osf.io/fy4az_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）のPDF本文（方法・結果・考察の節と図表キャプション）を読んだ", "preprint": true, "p1": "LLMで調査の回答を予測・模擬・補完する研究55件（2022〜2025年）を系統的にレビューし、LLMによる調査の模擬は人間の回答者や従来の補完法の一般的な代わりではなく、用途ごとに条件つきで使う道具だと整理した（抄録、§4）。未査読のプレプリントである。", "p2": "合成の調査データへの関心は急速に高まっているが、研究の目的、モデル、「ペルソナ」の作り方、検証の仕方がばらばらで、証拠が積み上がらない（抄録、§1）。", "p3": "Semantic ScholarとWeb of Scienceで検索し、重複を除いた5,478件から、能動学習の選別ツールASReviewで事前に決めた停止規則まで2人で題名・抄録を選別し（κ=0.85）、全文評価を経た55件を、調査の種類、対象の集団、モデル、ペルソナの構成、評価指標、著者の結論について、Elicitの抽出と人手の修正で符号化した（§3.3、付録）。", "p4": "整合の水準を個人（各回答の正しさ）・分布（回答分布の一致）・関係（変数間の関連の保持）に分け、検証の水準と著者の妥当性の判断（支持・条件つき・不支持）の関係を集計した（§4、図8・図11）。", "p5": "結論は支持8件、条件つき34件、不支持13件で（図10、表19）、評価が厳しい研究ほど不支持が多く、LLMは平均を再現しても分散を縮め、人間より均質な標本を作りがちだった（図11）。対象は米国が55件中28件（米国のみ18件）と偏り、評価の方法は40通りに分かれ、学習データへの混入の対策をした研究は5件に1件未満だった（§4.2、図3・図9）。", "p6": "妥当性の分類は各論文の著者自身の結論に基づき、レビュー側の独立の評価ではない（§4）。用途に応じた指標、関係の整合の標準化、非公開の試験データによる共通課題といった提案は方向性で、有効性はまだ確かめられていない（§5）。", "fun": "AIに「ある年齢や職業の人」の役を演じさせてアンケートに答えさせれば、調査の手間が省けるかもしれない。55本の研究をまとめると、AIは平均的な答えはそこそこ当てるが、答えのばらつきが人間より小さく、みんな似た答えになりがちだった。しかも、AIが元のアンケートの答えを覚えていただけかを確かめた研究は5本に1本もなかった。", "unverified": "表2の個々の研究の内容と、Elicitの抽出をどの程度人手で直したか（表7）は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "XBRLで再計算しLLMの財務数値の誤りを分解", "title": "Definitional or Computational? Decomposing LLM Numeric Fidelity in Financial-Statement Analysis with an XBRL Cascade Oracle", "url": "https://doi.org/10.5281/zenodo.23748043", "authors": "Chahed, Oussama", "venue": "Zenodo", "date": "2026-10-28", "apa": "Chahed, O. (2026). Definitional or Computational? Decomposing LLM Numeric Fidelity in Financial-Statement Analysis with an XBRL Cascade Oracle. Zenodo. https://doi.org/10.5281/ZENODO.23748043", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれた著者版のPDF本文（手法・実験設定・結果・限界の節と図表）を読んだ", "preprint": false, "p1": "LLMが財務諸表の分析で出す数値の誤りを、定義の違いと説明のつかない計算の誤りに分けて測る、XBRLに基づく決定的な検証器（オラクル）を作った（抄録）。FinNLP 2026ワークショップ採択論文の著者版で、Zenodoに置かれている（抄録）。", "p2": "LLMは整った文章のまま誤った数字を出す（偽の精度）が、従来のベンチマークは正答率か出典の対応しか測らず、なぜその数値が誤りなのかを説明しなかった（抄録）。", "p3": "SEC EDGARのXBRLの事実から利益率・ROE・ROCE・当座比率など11の概念を依存関係のグラフに沿って再計算し、1%以内の一致（correct@1%）で採点した（§3.1–3.2）。式と元のタグを与える「固定（pinned）」との対比、複数の標準の定義を許す判定、誤りの型の分類を組み合わせた（§3.3–3.4）。", "p4": "モデルの学習の締め切り後に提出された10-Kの400社・729企業年で6モデル（Llama-3.1-8BからGPT-5-mini、Grok-4.3まで）を比べ、全モデル共通の345企業年でも確かめた（§4、表1）。", "p5": "単純な比率は最弱のモデル以外が正しく計算したが、ROCEは条件をまとめるとGPT-5-mini 0.68、Grok 0.58、他は0.09以下だった（図1）。固定はLlama以外の5モデルで忠実度を上げ（共通部分でGPT-5-miniは0.807→0.969、表2）、Geminiは計算は良いのに出典の引用率が0.057で、コードで考えさせる方式（PoT）は忠実度を変えなかった（§5、表3）。", "p6": "検証器は慣行を固定し最初に合うタグを選ぶため、基準値が常に会計上の正解とは限らず、専門家による照合はしていない。固定は式・タグ・慣行を同時に与える複合の介入で、一部のモデルの学習の締め切りは自己申告である（Limitations）。", "fun": "AIに会社の決算書を分析させると、もっともらしい文章のまま数字だけ間違えることがある。この研究は、正しい値を自動で計算し直す仕組みを作り、AIの間違いが「別の計算ルールを使った」せいか「単なる計算ミス」かを見分けた。答えは合っているのに、どの数字を使ったかをほとんど示さないAIもあった。", "unverified": "公開されたコードと凍結した応答による再現は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "推論中の熟慮の4つの働きの時間的な動き", "title": "Rhythm of Thought: Tracing the Dynamics of Deliberation in Reasoning", "url": "https://doi.org/10.31234/osf.io/mf3s9_v2", "authors": "Jérémie Beucler ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Beucler, J., & De Neys, W. (2026). Rhythm of Thought: Tracing the Dynamics of Deliberation in Reasoning. https://doi.org/10.31234/osf.io/mf3s9_v2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（方法・結果・考察の節、補足資料の一部と図表キャプション）を読んだ", "preprint": true, "p1": "人が考え込むときに何をしているかを、発話思考の録音をLLMで瞬間ごとに採点し、4つの熟慮の機能と確信度の時間的な推移として描き出した（抄録）。PsyArXivの未査読のプレプリントである。", "p2": "直観的な答えに自信がないと人はさらに考えるとされるが、その追加の思考の中身、時間的な展開、なぜ時に役立つのかは分かっておらず、既存の分析は考え直したか、理由を述べたかといった試行単位の手作業の符号にとどまっていた（抄録、方法）。", "p3": "既存の102人が言語版の認知反射テスト（vCRT、直観的だが誤った答えを誘う10問）を声に出して解いた1,020件の録音を、WhisperXで単語ごとの時刻つきで文字起こしし、GPT-5.1で思考のまとまり（チャンク）に分け、候補の生成・正当化・直観の制御・努力の調整の4機能と確信度を採点し、一般化加法混合モデル（GAMM）で軌跡を推定した（方法、図1）。", "p4": "7人の評定者が採点した99チャンクとの一致（スピアマンのρ=.65〜.83）でLLMの採点を検証し、正解と偏った誤答の試行の軌跡を比べ、参加者と項目を除いた入れ子の交差検証で正誤の予測（AUC）を評価した（方法）。", "p5": "思考の初めは生成が優勢で、進むにつれ正当化・制御・調整が増え、正解の試行ほど正当化・制御・調整が多かった（抄録、結果）。弾性ネットのモデルは未知の参加者と項目で正誤をAUC=.81で判別し、軌跡の特徴だけでも.66だった（結果）。確信度が低いと次に生成・正当化・制御が増え、調整は確信度の上昇を予測した（抄録）。", "p6": "発話が少ない試行は軌跡を推定できずに除かれ、それは誤答に多かったため、熟慮した場面に偏った結果である（考察）。4機能の枠組みはモデルに与えたもので、人とLLMの採点は常に線形の関係ではなく、正誤や確信度との関連は因果を示さないと著者は述べる（考察）。", "fun": "「よく考えなさい」と言われても、頭の中で何をすればよいのだろう。この研究は、問題を解きながら独り言を言ってもらった録音をAIで細かく分析し、考え始めは答えの候補を出すことが中心で、後になるほど理由を確かめたり直感を抑えたりする働きが増えることを示した。正解した人ほど、後半の確かめる働きが多かった。", "unverified": "補足資料のモデル比較（プロンプト最適化）の詳細と、各GAMMの推定値は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "証券会社と企業の通話記録が映すアナリストの情報収集", "title": "Who is Calling? Information Gathering versus Lobbying in Analyst Forecasts", "url": "https://doi.org/10.2139/ssrn.7664081", "authors": "Di Lu ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Lu, D., Wang, Y., & Xu, N. (2026). Who is Calling? Information Gathering versus Lobbying in Analyst Forecasts. https://doi.org/10.2139/ssrn.7664081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "証券会社と企業の間の日次の携帯電話の通話データから、アナリスト予想の前の通話が情報収集なのか企業側の働きかけなのかを、誰が電話をかけたかで見分けた（抄録）。SSRNの未査読のプレプリントである。", "p2": "解釈：予想の前に企業との接触が増えることは、情報収集とも、有利な評価を求める働きかけ（ロビー活動）とも読めるため、両者を分けるには接触を始めた側が分かるデータが要る、というのが問いの核と読める（抄録）。", "p3": "証券会社と企業の間の双方向の日次の通話データで、予想の前週の異常な通話量を証券会社の発信と企業の発信に分け、予想の正確さと楽観度との関係を調べた（抄録）。", "p4": "予想の正確さと楽観度を指標に、情報の不透明な企業、内部者の株式売却の前、より厳しい公正開示規制の後といった条件で関係の違いを比べた（抄録）。標本の国・期間・規模は抄録にない（未確認）。", "p5": "異常な通話量は予想の前週に増え、証券会社発信の異常な通話が1標準偏差増えると予想の正確さは標準偏差の3.5%高く、不透明な企業で特に大きかった（抄録）。企業発信の異常な通話は正確さを下げて楽観度を上げ、内部者の売却の前に強く、厳しい公正開示規制の後は証券会社発信の通話による正確さの向上が弱まった（抄録）。", "p6": "通話の内容は観察できず、情報収集や働きかけという解釈は関連のパターンからの推論である（解釈）。通話データの出所と因果の識別の方法は抄録からは確認できない（未確認）。", "fun": "アナリストが会社の業績を予想する前の週には、会社との電話が増える。この研究は電話の記録を使い、アナリストからかけた電話は予想を正確にし、会社からかけてきた電話は予想を甘くして外れやすくすることを示した。誰が電話をかけたかで、その電話の意味がまるで違うのが面白い。", "unverified": "標本の国・期間・規模、通話データの出所、識別の方法は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "深層学習でアンサンブル不要のデータ同化と誤差補正", "title": "A Unified Framework for Deep Learning-Based Ensemble-Free Data Assimilation and Forecast Error Correction", "url": "https://doi.org/10.5194/egusphere-2026-6597", "authors": "Xinyue Li ほか", "venue": "EGUsphere", "date": "2026-10-29", "apa": "Li, X., Tang, Y., Shen, Z., Li, Y., & He, Z. (2026). A Unified Framework for Deep Learning-Based Ensemble-Free Data Assimilation and Forecast Error Correction. https://doi.org/10.5194/egusphere-2026-6597", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EGUsphereの討論用プレプリントのPDF本文（手法・結果・結論と限界の節、図表キャプション）を読んだ", "preprint": true, "p1": "アンサンブルを使わずにデータ同化を真似るニューラルネット（DAMLP）と、観測なしで予報誤差を定期的に補正するモデルを一つの枠組みにまとめ、カオス系の予報を安く長持ちさせられることをLorenz-63系で示した（抄録、§6）。EGUsphereの未査読の討論用プレプリントである。", "p2": "アンサンブル・カルマンフィルタ（EnKF）は多数のメンバーを保持・更新するため計算が重く、積み重なる予報誤差が予報の技能を落とす（抄録、序論）。", "p3": "標準のLorenz-63を真値（ρ=28）、少しずらした模型（ρ=29）を予報モデルとする双子実験で、EnKFの同化の過程から75,000の標本（学習用60,000）を作り、背景状態と観測から解析状態を出す多層パーセプトロンを学習させた（§2）。予報中は10積分ステップごとに学習した補正モデルで状態を直し、局所リアプノフ指数（LE）で結果を不安定さ別に層別した（§2、§5.3）。", "p4": "RMSE、相関、EnKFに対する相対スキル、10回の独立実験のばらつきと対応のあるt検定で、観測間隔0.1〜0.6 MTU（モデル時間単位）ごとにEnKFと比べた（§2.4、図3）。", "p5": "EnKFの同化時間は20メンバーの1.3972秒から200メンバーの13.2718秒に増えたが、DAMLPは約0.09秒でRMSEは約0.408と同程度だった（表1）。観測間隔0.3〜0.5 MTUではDAMLPのRMSEがEnKFより低くスキルは約60.3〜69.6%だったが、0.6 MTUでは誤差が急増した（図3）。補正なしの予報の相関は約3 MTUでほぼ0になったが、補正すると約3.5 MTUまで0.5を超えた（図8b）。", "p6": "実験は低次元のLorenz-63と統制した設定に限られ、DAMLPは決定的な単一状態の推論で流れに依存する不確実性を表さず、補正は固定の間隔で行っていると著者は述べる（§6）。解釈：学習にEnKFの出力を使うため、教師となる同化の質にも左右される。", "fun": "天気予報のような予測では、観測を取り込んで予報を直す作業に、たくさんの予報を同時に走らせる大きな計算がかかる。この研究は、その作業をAIに覚えさせて1本の計算で済ませ、200本の予報を使う方法の13.2718秒に対して約0.09秒で同程度の精度を出した。ただし観測が少なすぎるとAIは急に弱くなった。", "unverified": "表1の各アンサンブルサイズでのEnKFのRMSEの値と、t検定の結果は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "租税特別措置の期限に企業とLLMはどう反応するか", "title": "Do Firms Expect the Deadline to Move? Expiry Dates, Repeated Extensions, and AI Decision-Makers in Japanese Corporate Tax Special Measures", "url": "https://doi.org/10.17605/osf.io/dsm7j", "authors": "勉 矢作", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-22", "apa": "TSUTOMU YAHAGI. (2026). Do Firms Expect the Deadline to Move? Expiry Dates, Repeated Extensions, and AI Decision-Makers in Japanese Corporate Tax Special Measures. OSF Registries. https://doi.org/10.17605/OSF.IO/DSM7J", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "p1": "期限つきの税制優遇が何度も延長されると、企業が次の延長を見込んで期限が期限として働かなくなるかを、日本の法人税の租税特別措置と、小企業の経営者を演じるLLMの両方で検討する研究（抄録）。OSFの未査読のプレプリントである。", "p2": "期限は最終年度への投資の前倒し（Slemrodのいう時間のノッチ）を生むはずだが、延長が繰り返されると企業は次の延長を予想しうる。時間のノッチの研究と移行政策の研究は別々に発展してきたため、延長の履歴が期限への反応を変えるかは問われてこなかった（抄録）。", "p3": "研究1は、租税特別措置の適用実態の透明化法（2010年）に基づき財務大臣が国会に出す報告書から、2011年4月1日以後に終わる事業年度の措置ごとの適用法人数と適用額を使う（抄録）。研究2は、小企業の経営者として振る舞うLLMが同じ種類の期限にどう反応するかを調べる（抄録）。", "p4": "研究2では、LLMのエージェントは書かれたことに従い、法律に書かれた期限に反応し、目の前に書かれない限り延長の履歴を無視するという予測をOSF（pw5fz）に事前登録した（抄録）。", "p5": "抄録には結果の記述がない（未確認）。", "p6": "抄録の範囲では結果も限界も確認できない（未確認）。解釈：措置ごとの適用数と適用額という集計データで、企業の投資の前倒しをどこまで識別できるかが問われる。", "fun": "「今年で終わり」と言われた割引が毎年のように延長されると、誰も期限を信じなくなる。この研究は、日本の企業向けの税の優遇でそれが起きているかを調べ、さらにAIに会社の経営者を演じさせて、AIは書かれた期限を素直に信じるのかを試そうとしている。仕事をAIに任せると、期限の効き方が変わるかもしれない。", "unverified": "結果と、分析の方法・使うLLMの詳細は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "東南アジアの高齢者介護の負担と政策の空白", "title": "Elder Caregiving in Southeast Asia: A Systematic Review of Cultural Norms, Care Burdens, Carer Support and Policy Gaps", "url": "https://doi.org/10.21203/rs.3.rs-8671736/v1", "authors": "Niruwan Turnbull ほか", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Turnbull, N., Kongmant, R., Hughes, D., Toontom, N., & Chanawong, M. (2026). Elder Caregiving in Southeast Asia: A Systematic Review of Cultural Norms, Care Burdens, Carer Support and Policy Gaps. https://doi.org/10.21203/rs.3.rs-8671736/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（方法・結果・考察・限界の節と表のキャプション）を読んだ", "preprint": true, "p1": "東南アジアの高齢者介護について、家族などの非公式な介護者と施設などの公式な介護者の負担、支援、文化的規範、政策の欠落を、10か国48件の研究から系統的にまとめた（抄録、結果）。Research Squareの未査読のプレプリントである。", "p2": "東南アジアは世界でも最速級で高齢化が進むが、介護は主に家庭が担って女性に偏り、孝行などの規範が非公式な介護を支える一方で不平等も強め、特に貧しい国で長期介護の基盤と介護者への支援が乏しい（抄録、背景）。", "p3": "PRISMAに従いPubMed、Scopus、Web of Science、ScienceDirectで2015〜2025年の研究を検索し、2人が独立に選別・抽出し、JBIとCASPで質を、GRADEとCERQualで証拠の確実性を評価し、構造・機能・健康・社会文化・政策の5領域で主題別に統合した（方法）。", "p4": "607件の記録から重複を除いた525件を選別し、全文を評価できた197件のうち48件を採用したが、200件は全文を入手できなかった（結果）。研究の設計と指標がばらばらなためメタ分析は行わず、国ごと・領域ごとの研究数を表にした（表2）。", "p5": "介護者は国を問わず重い仕事量、不十分な訓練、弱い支援、悪い労働条件からストレスや燃え尽き、生活の質の低下を抱え、認知症の症状、介護の強度、家族の義務が負担と一貫して結びついた（抄録）。孝行、宗教、性別の規範は支えにも負担にもなり、証拠の確実性は低〜中等度で、48件中38件が高所得・上位中所得の国の研究だった（結果、限界）。", "p6": "候補の全文の約半分が入手できず英語の文献に限ったため、現地語で発表されがちな低所得国の証拠が抜けやすく、量的と質的の確実性の評価は同じ尺度で比べられないと著者は認める（限界）。", "fun": "東南アジアでは、親の介護は家族、特に女性の役目という考えが根強い。48本の研究をまとめると、その考えは家族を支える力にもなる一方で、介護する人を追いつめる原因にもなっていた。豊かな国では介護の施設や制度が広がりつつあるが、貧しい国では家族だけが頼りで、国による差が広がっている。", "unverified": "補足表1の各研究の内容と、領域ごとのGRADEの評価は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "討論型の多エージェントで推薦説明を評価", "title": "MAREval: A Multi-Agent Framework for Evaluating Natural Language Recommendation Explanations", "url": "https://doi.org/10.48550/arxiv.2610.36389", "authors": "Reza Yousefi Maragheh ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-26", "apa": "Maragheh, R. Y., Kudase, J. U., Inan, A., Giahi, R., Zhao, K., Parikh, P., Xu, J., Cho, J., Korpeoglu, E., & Kumar, S. (2026). MAREval: A Multi-Agent Framework for Evaluating Natural Language Recommendation Explanations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36389", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・実験・人手評価・オンライン実験の節と表）を読んだ", "preprint": true, "p1": "推薦システムが出す自然言語の説明文の品質を、計画役・司会役・仲裁役のLLMエージェントの討論で評価する枠組みMAREvalを作り、人の判断との一致と評価の安定性を高めた（抄録、§3）。arXivの未査読のプレプリントである。", "p2": "人による評価は正確だが大規模な推薦の場では費用がかかりすぎ、単一のLLMによる自動評価はプロンプトに敏感で出力が安定しない（抄録）。", "p3": "計画役が全エージェントの手順を同期して作る「討論の連鎖（CoD）」、評価役どうしの議論を要約して論点のずれを抑える司会役、最終判断を出す仲裁役を組み合わせ、全体を複数回走らせて確率で重みづけするモンテカルロ標本化で外れ値を抑えた（§3.1–3.3）。", "p4": "公開のTopicalChat（6基準の人手注釈）と、専門家が関連性と言い回しを二値で評価した独自のEC用の推薦説明108件で、人の注釈とのピアソン相関・ケンドールのτ・コーエンのκを、単純な指示、CoT、Self-Refine、G-Eval、ChatEvalと比べた。モデルはgpt-3.5-turboである（§4.1–4.2）。", "p5": "TopicalChatの総合品質でρ=0.548、τ=0.478と最も高く、EC用データの関連性でρ=0.338、κ=0.334だった（表1、§4.3）。繰り返し評価の平均標準偏差は0.0197で最小で（表2）、本番前の人手の品質審査ではハード基準を100%（G-Evalは91.0%）満たし、約300,000品目のA/Bテストでカートへの追加率が1.18%、流通総額が1.36%上がった（表4・表5）。", "p6": "EC用データは独自で非公開、評価役5体では1回の評価に平均8.16秒かかる（§4.6）。解釈：A/Bテストの対照群は説明なしの表示で、選別しない説明との比較ではないため、効果のうち選別そのものの寄与は切り分けられていない。", "fun": "AIが書いた商品の説明文が良いかどうかを別のAIに採点させるのは便利だが、聞くたびに点数が変わることがある。この研究は、AI同士に議論させ、司会役が論点を整理し、裁判官役が最終判断を下すという会議のような仕組みにした。すると採点が安定し、実際の通販サイトで説明を見せると流通総額が1.36%伸びた。", "unverified": "付録Eの他の基盤モデルでの結果と、A/Bテストの期間・規模の詳細は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "低コストのエッジAIで橋を常時監視する試作機", "title": "BridgeGuard AI: A Self-Calibrating Edge-AI Prototype for Low-Cost Bridge Condition Monitoring and Digital-Twin Visualization", "url": "https://doi.org/10.5281/zenodo.23725195", "authors": "Pranali Nitnaware ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-28", "apa": "Prof. Pranali Nitnaware, Sameer Sonwane, Yash Khobragade, Trupti Kursunge, & Aboli Bodhale. (2026). BridgeGuard AI: A Self-Calibrating Edge-AI Prototype for Low-Cost Bridge Condition Monitoring and Digital-Twin Visualization. IJERT.ORG. https://doi.org/10.5281/ZENODO.23725195", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれたPDF本文（IJERT掲載版。構成・手法・検証・限界の節と表）を読んだ", "preprint": false, "p1": "約12.60米ドルの部品で、振動・傾き・ひずみ・温湿度の計測、端末上のAIによる異常検知、センサーのずれの自動較正、劣化の推定、デジタルツインの表示までを一つの流れにまとめた橋の状態監視の試作機を作った（抄録）。IJERT掲載論文のPDFがZenodoに置かれたものである。", "p2": "橋の劣化はゆっくり進み定期の目視点検では見つけにくい一方、専門の電子的な監視は小さな自治体や二次的な構造物には高すぎる。また、ひずみの一定のずれが本当の荷重か、接着剤のクリープや湿気によるドリフトかを、単純な閾値では区別できない（抄録、§V.A）。", "p3": "ESP32の端末がMPU6050、HX711のひずみゲージ、DHT11から信号を取り、カルマンフィルタで平滑化し、5-3-5の小さな自己符号化器（TinyML）の再構成誤差をリスク確率と6種類の事象に変える（抄録、§IV）。ホスト側では振動や傾きなど他のチャネルを証拠に「ドリフト」「実際の荷重」「通常の変動」の3仮説をベイズ的に比べ、2状態のカルマン分解で信号とドリフトを分けた（§V）。", "p4": "実際の橋に過荷重やひび割れを起こせないため、机上の機器と物理ベースの模擬（日周の温度、降雨、車両の通過）で、通常、大型車（設計荷重の85%）、振動のピーク、135%の過荷重とひび割れ、ずれの注入の場面を試した（§VIII.A、表II）。", "p5": "すべての場面で設計どおりに振る舞い、注入したずれは段階的に補正される一方で荷重の事象は補正で消されず、端末の推論は約1.2 msだった（§VIII.B、D）。異常時だけ送る方式で静かな日の記録は864,000件から1,440件に減る（99.83%減）が、これは送信の予定表から計算した値である（表III）。", "p6": "結果は機能の確認で統計的な性能評価ではなく、補正後の残差誤差や1日あたりの誤警報などは未定量で、基準級のセンサーを使った実構造物での検証も残ると著者は認める（§VIII.D、F）。", "fun": "橋の点検に使う専用の計測機器は高価だが、この研究は約12.60ドルの部品で監視装置の試作機を作った。難しいのは、ひずみの値がずれたとき、橋が本当に傷んだのか、センサーの接着がゆるんだだけなのかを見分けることだ。そこで揺れや傾きも同時に見て、「橋が静かで水平なのに値だけずれたならセンサーのせい」と判断させた。", "unverified": "劣化モデル（木材の腐朽と疲労による余寿命）の妥当性と、構造健全度指数の重みの根拠は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "切替費用と情報取得が生む『沈黙した』市場", "title": "Informational Inertia and Staggered Prices", "url": "https://hal.science/hal-05338280v2", "authors": "Georgy Lukyanov ほか", "venue": "HAL", "date": "2026-10-28", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、登録された抄録を使用", "preprint": true, "p1": "どちらの製品が消費者に合うかを企業も消費者も知らない複占で、消費者の乗り換えと比較の費用が、購買に情報が現れるかと、価格のばらつきが定常的に残るかを同時に決めることを理論的に示した（抄録）。HALに置かれた未査読の論文である。", "p2": "購買は製品の合い方についての情報を明らかにするはずだが、消費者が既定の売り手にとどまるなら、市場が分かれたまま情報が「沈黙」しうる。この情報の慣性と、価格が時期をずらして改定されること（staggered prices）の関係を問う（抄録）。", "p3": "消費者は既定の売り手から始め、自分の乗り換え費用を私的に知り、費用を払って製品の合い方の私的なシグナルを得られる。価格は有限の格子上にあり、企業は独立なポアソン過程で改定の機会を得る。マルチンゲールの議論とカルボ型の更新方程式で定常的な均衡を特徴づけた（抄録）。", "p4": "理論研究で、データや数値実験による検証は抄録にない（未確認）。沈黙する価格差の区間と、不変分布の価格のばらつきを命題として導く（抄録）。", "p5": "対称な事前の信念と等しい価格では、乗り換え費用の下限に比較費用の2倍を足したものが有利なシグナルの価値を上回るときに、ちょうど沈黙が生じる（抄録）。不変の状態は固定した信念と有限の沈黙する価格の組に閉じ込められ、一定の条件で定常マルコフ均衡の不変分布は正の価格のばらつきを持ち、比較が極端に高くつくと上限での等価格に吸収される（抄録）。", "p6": "結果は均衡が存在する場合についてのもので、存在の条件は抄録からは確認できない（未確認）。解釈：消費者の摩擦が価格の分散を生む仕組みの提示で、実際の市場での検証は今後の課題と読める。", "fun": "スマートフォンの料金プランを乗り換えれば得かもしれないが、調べるのも乗り換えるのも面倒で、多くの人は今の会社にとどまる。すると、どちらが本当に良いかという情報が市場に出てこない。この研究は、そうした面倒さが、店ごとの値段の差がいつまでも消えない理由になることを数学で示した。", "unverified": "モデルの詳細な仮定と、均衡の存在の条件は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "台北MRTの駅の『地理』を先に定めて評価を診断", "title": "Station Geography Precedes Station Ranking: Multiscale Territories and Spatial Policy Diagnosis in Taipei Metro", "url": "https://doi.org/10.21203/rs.3.rs-11248702/v1", "authors": "Chia-Nung Li", "venue": "Research Square (In Review)", "date": "2026-10-28", "apa": "Li, C.-N. (2026). Station Geography Precedes Station Ranking: Multiscale Territories and Spatial Policy Diagnosis in Taipei Metro. https://doi.org/10.21203/rs.3.rs-11248702/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "p1": "地下鉄駅の評価は地域の条件とネットワーク上の重要度をまとめがちだが、指標がどの空間の範囲を指すかを問わないとして、駅の空間的な範囲を明示して診断する枠組み（Station Geography）を台北メトロで作った（抄録）。Research Squareの未査読のプレプリントである。", "p2": "駅の評価が指標の空間的な範囲を確かめずに順位をつけると、隣の駅と重なる回廊を一つの駅の条件として数えてしまうおそれがある（抄録）。", "p3": "ファジィ・デルファイ法とグレー分析的ネットワーク過程で12の焦点駅を評価し、118の駅勢圏、388の出入口、乗客需要、ネットワークの中心性の分析の中に位置づけた。出入口から400・800・1,200 mの範囲で重なりを測り、クラスタリングで駅の型を分け、200,000回の得点区間の模擬で順位の感度を調べた（抄録）。", "p4": "範囲の重なり、型の分類の当てはまり、総合得点と節点機能・年間需要・重なりとの相関、仮定を変えたときの順位の安定性で評価した（抄録）。", "p5": "範囲の重なりの中央値は400 mで0.046、800 mで0.655、1,200 mで0.944に増え、大きな範囲ほど駅固有の地域でなく共有の回廊を表していた（抄録）。総合得点は節点機能（ρ=0.853）、年間需要（0.846）、800 mの重なり（0.860）と相関し、台北駅は安定して上位だが中位の順位は仮定によって変わった（抄録）。", "p6": "範囲の感度と得点の感度は補い合う分析で、半径ごとに指標を推定し直したものではないと著者は断っている（抄録）。解釈：焦点駅は12と少なく、専門家の判断による重みの影響の大きさは抄録からは分からない。", "fun": "駅の便利さを比べるとき、駅の周り何メートルまでを「その駅の地域」と考えるかで答えが変わる。台北の地下鉄で調べると、400 mなら駅どうしの地域はほとんど重ならないが、1,200 mにすると重なりの中央値は0.944にもなり、もはや一つの駅の話ではなくなった。順位を出す前に、地図の上で範囲を確かめるべきだという主張だ。", "unverified": "評価の指標の内容と、専門家の人数は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "AIを監督する力が見えないまま失われる理論", "title": "Invisible Demand Theory: How AI-enabled work erodes the conditions for human oversight", "url": "https://doi.org/10.5281/zenodo.23744848", "authors": "Blakely, Megan", "venue": "Zenodo", "date": "2026-10-28", "apa": "Blakely, M. (2026). Invisible Demand Theory: How AI-enabled work erodes the conditions for human oversight. Zenodo. https://doi.org/10.5281/ZENODO.23744848", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、登録された抄録を使用", "preprint": true, "p1": "AIの誤りを人が見つけて直すという前提で導入が進む中、その監督の能力が働いている最中に失われ、しかも是正されない理由を説明する理論「見えない要求の理論（IDT）」を提案した概念論文（抄録）。Zenodoに置かれた未査読の論文である。", "p2": "監督が成功すると何も起きないので組織に数えられず、失敗すると判断に最も近い人の目に見える誤りとして責められる、という見え方の非対称がある（抄録）。", "p3": "見えない予防の仕事、ドリフト、儀式的な確認、失敗後の帰責についての既存の説明の上に、監督の対象がAIであるときの固有の点を特定した。中心の仕組みは「自己隠蔽のループ」で、使用前に捕まえた誤りは記録に残らないため、組織が測るAIの信頼性は、評価に使うはずの監督そのものに一部作られる（抄録）。", "p4": "理論論文で実証はなく、既存の理論と区別できるよう述べた9つの命題を導いた（抄録）。", "p5": "測られる信頼性が上がると監督の削減が正当化され、削減が監督の必要の証拠を消す（抄録）。生成AIでは流暢な出力が働き手にも要求を隠し（二重の不可視性）、モデルの変更で過去の失敗が今の監督の要件の指針にならない（学べない要求）とし、検証の労働、較正の労働、警戒の負債、責任の吸収という概念を定めた。ニュージーランドでは、マオリの職員に文化的な検証の労働が上乗せされるとした（抄録）。", "p6": "命題の実証的な検証は今後の課題である（解釈）。ニュージーランドの文脈についての主張の根拠となる資料は抄録からは確認できない（未確認）。", "fun": "AIの間違いを人がこっそり直しているうちは、事故は起きない。ところが事故が起きないと「AIは十分信頼できるから、確認係はもういらない」と判断され、確認をやめると今度は確認が必要だった証拠も消えてしまう。この論文は、人の確認作業がうまくいくほど見えなくなり、削られていくという皮肉な仕組みに名前をつけた。", "unverified": "9つの命題の内容と、事例の根拠は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "インフォーマル介護者向けウェブ基盤の受容と実利用", "title": "Acceptability and Real-World Use of a Web Platform for Informal Caregivers of Dependent Older Adults (CuidaGEST): Formative Evaluation Using a Cross-Sectional Survey and Web Analytics (Preprint)", "url": "https://doi.org/10.2196/preprints.115524", "authors": "Andreia Costa ほか", "venue": "JMIR Preprints", "date": "2026-10-28", "apa": "Costa, A., Nascimento, T., Loura, D., Soares, S., Nogueira, P., & Henriques, M. A. (2026). Acceptability and Real-World Use of a Web Platform for Informal Caregivers of Dependent Older Adults (CuidaGEST): Formative Evaluation Using a Cross-Sectional Survey and Web Analytics (Preprint). https://doi.org/10.2196/preprints.115524", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ポルトガルの要介護の高齢者を支える非公式な介護者のためのウェブ基盤CuidaGESTについて、介護者の知識と健康リテラシー、第1段階の受容性、実際の利用状況を調べ、次の開発段階に生かす研究（抄録）。JMIR Preprintsの未査読のプレプリントである。", "p2": "介護者の地位を定めた法律（Law 100/2019）は権利と支援を作ったが、介護者が自分で見つけて申請する必要がある。ウェブ基盤は安価な情報提供の手段だが、利用者の好評が内容の利用を保証するわけではない（抄録）。", "p3": "リスボンの訪問看護チームが関わる介護者に2022年9月28日〜10月31日に横断調査を行い、訪問時にタブレットで基盤を見てもらった後、資源と権利の知識、健康リテラシー（HLS19-Q12）、満足度を紙の質問票で尋ねた。公開サイトのGoogle Analytics 4のデータ（2022年3月1日〜2025年10月19日）も記述的に分析した（抄録）。", "p4": "満足度の各項目、知識と健康リテラシーの割合、サイトの利用者数・閲覧数・ページ別の閲覧の割合で、受容性と実際の到達を比べた（抄録）。", "p5": "対象の18人中17人（94%）が参加し、13人（76%）が受けられる社会的支援を、11人（65%）が地域の資源をよく知らないと答えた。満足度は9項目中8項目で70%以上、16人（94%）が全体に満足したが、内容の新しさに満足したのは8/17（47%）だった（抄録）。43か月でサイトの利用者は417人、閲覧は1547回で、教育的な内容の14の話題ページは閲覧の7%（107回）にとどまった（抄録）。", "p6": "参加者は17人と少なく、看護師が訪問時に紹介した場での評価で、分析は記述的である（抄録）。解釈：自然な利用の少なさが内容の問題か周知の問題かは、この設計では区別できない。", "fun": "介護する家族のための情報サイトを、看護師が訪問したときに見せると94%が満足と答えた。ところが実際のアクセス記録を43か月分調べると、利用者は417人だけで、肝心の介護の知識のページはほとんど見られていなかった。「良いと言われること」と「実際に使われること」は別物だということがよく分かる。", "unverified": "質問票の各項目の内容と、サイトの周知の方法は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "非線形有限要素と浮動座標系で柔軟多体動力学", "title": "Merging nonlinear finite element models and the floating frame of reference formulation", "url": "https://doi.org/10.21203/rs.3.rs-11153320/v1", "authors": "Marcel Ellenbroek ほか", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Ellenbroek, M., Schilder, J., & Kilsdonk, Q. (2026). Merging nonlinear finite element models and the floating frame of reference formulation. https://doi.org/10.21203/rs.3.rs-11153320/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（定式化の要点・適用例・結論の節と図のキャプション）を読んだ", "preprint": true, "p1": "柔軟なマルチボディ動力学で使われる浮動座標系（floating frame of reference）の定式化に、非線形有限要素法の高次の項を取り込めるよう両者を統合した定式化を導いた（抄録、§7）。Research Squareの未査読のプレプリントである。", "p2": "現在の浮動座標系の定式化は、動く座標系に対して線形の有限要素モデルで柔軟性を表すため、物体の中の中程度から大きなひずみを表す高次の項を扱えない。統合により、高次の項を入れつつモデル縮約の手法も使えるようにすることを狙う（抄録）。", "p3": "未変形の物体の位置を表す枠を浮動座標系とみなし、グリーン・ラグランジュひずみと第2ピオラ・キルヒホッフ応力で仮想仕事を書いて、内部の弾性力と接線剛性行列を局所の弾性変位の0次〜2次の項まで導いた（§4、§7）。浮動座標系を弾性変位のない物質点に置き、高次の項を落とせば従来の定式化に戻るようにした（抄録、§7）。", "p4": "Pythonで実装し、長さ1 mの片持ちの円管の梁（10物体）に大きな先端荷重・追従力・座屈の荷重を段階的にかけ、全ラグランジュの非線形有限要素法（NFE）、統合した方法（NFF）、線形の浮動座標系（LFF）、MSC/Nastranと比べた。安定性は扱っていない（§6）。", "p5": "先端の鉛直荷重ではNFEとNFFが非常に大きな荷重まで同じ結果を示し、NastranやLFFともほとんど差がなかった（図5・図6）。追従力では約1000 Nまで3つの方法が似た挙動だったが、それを超えるとNFE・NFFとLFFの差がはっきりし、高次の項の大きさをフロベニウスノルムで追うと、多くの場合は高次の項を省けることが示唆された（図8〜図12、§6）。", "p6": "検証は単純な静的な梁の問題に限られ、高次の項を省くことが数値的な安定性に与える影響は今後の課題とされる（§6）。解釈：動的な問題や実際のマルチボディ系での計算コストの比較はまだ示されていない。", "fun": "ロボットの腕のように動きながら曲がる物体の計算では、物体と一緒に動く座標を使うと便利だが、大きく曲がると精度が落ちる。この研究は、大きな変形を扱える計算法をその座標の中に組み込み、必要なときだけ精密な項を足せるようにした。長さ1 mの梁の例では、約1000 Nを超える力で精密な項の有無による差がはっきり表れた。", "unverified": "座屈荷重の場合の比較結果（図13〜図16）の詳細は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "LLMエージェント集団のリスク選好のばらつきを測る", "title": "How Heterogeneous Is Homo Silicus? Measuring Risk-Preference Dispersion in Populations of Large Language Model Agents", "url": "https://doi.org/10.17605/osf.io/4hsx8", "authors": "Gabriel Song", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-24", "apa": "Gabriel Song. (2026). How Heterogeneous Is Homo Silicus? Measuring Risk-Preference Dispersion in Populations of Large Language Model Agents. OSF Registries. https://doi.org/10.17605/OSF.IO/4HSX8", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "short": true, "p1": "自律的な経済主体として使われるLLMエージェントの集団で、リスク選好の持続的なばらつきがどれだけあるか、ペルソナの付与で増えるか、人間の再検査の基準とどう比べられるかを測る研究（抄録）。未査読のプレプリントである。", "p3": "ばらつきを同じエージェントへの繰り返しの質問の雑音と、同じモデル内のエージェント間の分散に分け、条件づけなし（S0）と背景だけの合成ペルソナ（S3）の2条件で、標準的なHolt–Lauryの尺度からリスク選好を引き出した。主張は名指しした2つのモデルと設定に限るとする（抄録）。", "p5": "抄録には測定結果の数値や結論が書かれていない（未確認）。", "fun": "人間には慎重な人も大胆な人もいるが、AIに大勢の「人」を演じさせると性格が似通ってしまうと言われる。この研究は、くじの選び方でAIの「冒険好き度」を測り、同じAIから作った集団にどれだけ個性の差が出るか、人物設定を与えると差が広がるかを確かめようとしている。", "unverified": "抄録に結果がなく、使った2つのモデルと分散の推定値は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "最初に人物設定を与えても劣化は早まらない", "title": "A Persona Sheet Before the First Turn Does Not Accelerate Degeneration: A Controlled 2×2 Replication in Tool-Calling Agents", "url": "https://doi.org/10.5281/zenodo.23734066", "authors": "Xu ほか", "venue": "Zenodo", "date": "2026-10-28", "apa": "Xu, F., & Chen, T. (2026). A Persona Sheet Before the First Turn Does Not Accelerate Degeneration: A Controlled 2×2 Replication in Tool-Calling Agents (Version 2.0). Zenodo. https://doi.org/10.5281/ZENODO.23734066", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "道具を呼び出すLLMエージェントの長い対話での劣化について、ペルソナの設定シートの注入時期と道具の失敗の影響を統制実験で再検証した（抄録）。Zenodoに置かれた未査読の報告である。", "p3": "DeepSeekとMiMoの2モデルで、ペルソナの有無と道具の失敗の厳しさを変えた64セッション（各60ターン）を比べた（抄録）。", "p5": "最初のターンの前に入れた1,385字のペルソナは劣化を早めず、以前の単一事例の結果はセッション途中の注入という時期の効果に限られた（抄録）。道具の失敗率が80%のときエージェントはかえって道具を多く呼び、劣化の形はMiMoが字句の繰り返し、DeepSeekが道具を使わない従順という2系統に分かれた（抄録）。", "fun": "AIに長く作業させると、同じ言葉を繰り返したり何もしなくなったりして調子が崩れることがある。この実験では、人物設定を最初に渡すぶんには崩れは早まらず、途中で割り込ませたときだけ早まっていた。崩れ方もAIの種類で違い、一つの見張り方では見逃すという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "LLMによる英作文評価の心理測定的な較正", "title": "Psychometric Calibration of Large Language Models for Multidimensional L2 Academic Writing Assessment: The LICA Framework", "url": "https://doi.org/10.21203/rs.3.rs-11277915/v1", "authors": "Pegah Merrikhi", "venue": "Research Square (In Review)", "date": "2026-10-28", "apa": "Merrikhi, P. (2026). Psychometric Calibration of Large Language Models for Multidimensional L2 Academic Writing Assessment: The LICA Framework. https://doi.org/10.21203/rs.3.rs-11277915/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "第二言語の英作文の評価で、3つのLLMを専門家の基準と比べ、言語・内容・結束性・学術的な適切さの次元ごとの採点のずれを心理測定の手法で較正した（抄録）。未査読のプレプリントである。", "p3": "GPT-4o、Claude 3.5 Sonnet、Gemini 1.5 Proを、QWK・MAE、ICC(2,1)、Bland–Altmanの一致限界、Fleissのκで評価した。評価の事例は各モデル20件である（抄録）。", "p5": "GPT-4oは専門家と完全に一致し（QWK=1.000、ICC=1.000）、Claude 3.5 Sonnetは高い信頼性（QWK=0.949）ながら結束性と学術的な適切さで甘くなり、Gemini 1.5 Proは厳しい方へずれた（QWK=0.925）（抄録）。モデル間の合意は内容と結束性でκ=0.643だったが、学術的な適切さではκ=0.286に下がった（抄録）。", "fun": "AIに作文を採点させると、どの観点でも同じように正確なのだろうか。この研究では、文法や構成の評価は専門家とよく合ったが、学術的な文章にふさわしい言葉づかいかの判断ではAIどうしの意見も大きく割れた。ただし比べた作文は各20件と少ない。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "受信箱を協調の単位とするLLMエージェント社会", "title": "The Inbox as a Coordination Primitive for LLM Agent Societies", "url": "https://doi.org/10.48550/arxiv.2610.36264", "authors": "Karthik Sreedhar ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-26", "apa": "Sreedhar, K., Yuan, L., Chari, P., & Raskar, R. (2026). The Inbox as a Coordination Primitive for LLM Agent Societies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36264", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "short": true, "p1": "大集団で協調するLLMエージェントにとって不足するのは配達でなく「読むこと」だとして、送り手が相手の文脈に押し込む方式の代わりに、受け手の規則で読むものを選ぶ受信箱を協調の基本単位として提案・検証した（抄録）。未査読のプレプリントである。", "p3": "すべての判断をLLMが行う最大16,000エージェントの模擬社会と実際のメールのネットワークで、押し込み型と受信箱型を比べた（抄録）。", "p5": "20の交渉を率いて記憶が満杯のエージェントは、古い返信を落とすため既に断られた案を97%の確率で提案した（抄録）。返金可能な預託金つきの依頼を先に読む受信箱は1,000〜16,000の規模で必要な相手の約60%を見つけ、最適な規則は通信量と役割に依存した（抄録）。", "fun": "たくさんのAIが協力するとき、困るのはメッセージが届かないことではなく、読み切れないことだ。この研究は、届いた順に読む代わりに、AIが自分の決まりで読むものを選ぶ「受信箱」を作った。受信箱がないと、20の交渉を抱えたAIは断られた案を97%も出し直していた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "多エージェントの記憶を精錬し使いどころを学ぶ", "title": "Remembering Is Not Enough: Refining Memories and Learning When to Use Them in Multi-Agent Systems", "url": "https://doi.org/10.48550/arxiv.2610.36652", "authors": "Yipeng Hao ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-27", "apa": "Hao, Y., Cai, Y., Ji, W., Zhou, J., Yu, L., Chen, Q., Yan, Z., Zheng, S., & He, L. (2026). Remembering Is Not Enough: Refining Memories and Learning When to Use Them in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36652", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント系で、保存した経験（記憶）の誤りを直し、どの場面で使うべきかを学ぶ訓練不要の枠組みDiscernMemを提案した（抄録）。未査読のプレプリントである。", "p3": "記憶あり・なしの実行を比べて規則の欠陥を診断し、現在と過去の課題で修正を試す精錬（DMR）と、各記憶の使用の履歴と効果から使う・避ける境界を学ぶメタ記憶（BLM）を組み合わせた（抄録）。", "p5": "Qwen3-4B-Instruct-2507で4つのベンチマークを用い、AutoGen、CAMEL、MacNetで平均得点が最も高く、最強の既報の基準を0.51〜4.32ポイント上回り、CAMELのPDDLでは37.71対28.48だった（抄録）。", "fun": "失敗から学んだ教訓をメモしておいても、そのメモが間違っていたり、使う場面を誤ったりすると逆効果になる。この研究は、AIのチームが自分たちのメモを点検して直し、いつ使うべきかも覚える仕組みを作り、計画を立てる課題の成績を28.48から37.71に上げた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "ロールプレイでLLMの道徳的反転を評価", "title": "Moral Inversion in Large Language Models: A Psychopathy-Derived Behavioral Assessment Through Role-Play Protocol", "url": "https://doi.org/10.21203/rs.3.rs-11498569/v1", "authors": "Abbas Hamidavi", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Hamidavi, A. (2026). Moral Inversion in Large Language Models: A Psychopathy-Derived Behavioral Assessment Through Role-Play Protocol. https://doi.org/10.21203/rs.3.rs-11498569/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "道徳的に問題のある人物を演じるよう指示されたとき、最新のLLMがサイコパス的な行動のパターンを示すかを、4段階の評価手順で調べた（抄録）。未査読のプレプリントである。", "p3": "GPT-5.4、Claude 4.6 Sonnet、Gemini 3.1 Proを、144の採点つきシナリオ応答、36の質的シナリオ、9回のメタ認知面接（27の独立したチャット）で評価し、3つの言い回しの版と第2の評価者の符号化で信頼性を確かめた（抄録）。", "p5": "GPT-5.4は基準の共感課題で0/16、役割演技で15/16のサイコパシー・パターン得点を示し、Gemini 3.1 Proは役割演技で16/16に達したが、Claude 4.6 Sonnetは9回中8回（89%）関与を拒んだ（抄録）。著者らは、整合は構造的な禁止でなく文脈に依存する行動上の選好として働く可能性があるとした（抄録）。", "fun": "AIに「悪人を演じて」と頼むと、どこまで悪人らしくふるまうのか。この研究では、ふだんは思いやりのある答えをするAIが、役を与えられるとほぼ満点の冷酷さを見せた一方、演技そのものを断り続けたAIもあった。安全対策が場面によって外れうることを示す結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "移転価格のリスクを説明可能なAIで選別", "title": "Explainable AI for Transfer Pricing Risk Screening", "url": "https://doi.org/10.2139/ssrn.7663938", "authors": "Brefo Emmanuel ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Emmanuel, B., & Brefo, T. (2026). Explainable AI for Transfer Pricing Risk Screening. https://doi.org/10.2139/ssrn.7663938", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "税務当局が移転価格の調査を優先づけるため、異常な会計結果を不正の証拠と扱わずに選別する説明可能な枠組みを作り、その予測部分を完全な合成データで評価した（抄録）。未査読のプレプリントである。", "p3": "照合・採点・証拠の確認・実質的な判断を分けた構成で、6つのシナリオ（各20シード、学習5,000・診断1,000・試験3,000件）について、透明な指数、ロジスティック回帰、ランダムフォレストなどを識別力、予算固定の検出、確率の誤差と較正で比べた（抄録）。", "p5": "基準のシナリオではロジスティック回帰のAUCが0.755、上位10%での適合率が0.430で、非線形の仕組みではフォレストが0.849と0.706で上回り、モデルの順位は想定する仕組みに依存した（抄録）。結果は人工のラベルについてのもので、実際の操作の検出や行政上の有効性は示していないと著者は述べる（抄録）。", "fun": "企業がグループ内の取引の値段を操作して税金を減らしていないかを、すべて調べるのは無理だ。この研究は、怪しい会社を説明つきで選び出す方法を作り物のデータで試し、どの方法が一番かは操作の仕組みの想定によって変わってしまうことを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "組織資本と株価暴落リスク", "title": "Organizational Capital and Stock Price Crash Risk", "url": "https://doi.org/10.2139/ssrn.7664318", "authors": "Seraina C. Anagnostopoulou ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Anagnostopoulou, S. C., Loukopoulos, P., Loukopoulos, G., & Tsekrekos, A. E. (2026). Organizational Capital and Stock Price Crash Risk. https://doi.org/10.2139/ssrn.7664318", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "企業に埋め込まれた知識・手順・業務構造である組織資本が、株価の暴落リスクを下げるかを調べた（抄録）。未査読のプレプリントである。", "p3": "組織資本と暴落リスクの関係を推定し、避けられない開示の法理の段階的な採用を使って因果的な解釈を検討し、経路分析で情報環境を通じた仕組みを調べた（抄録）。", "p5": "組織資本が高いほど暴落の可能性は有意に低く、年次報告書の読みやすさ、経営者予想での悪い知らせの開示の多さ、修正再表示の少なさを通じて一部が説明された（抄録）。オプション投資家は組織資本を下方リスクの源と誤解し、高い組織資本の企業の暴落保険を系統的に誤って価格づけていた（抄録）。", "fun": "会社の強さは、工場や機械だけでなく、社員が持つノウハウや仕事の進め方にもある。この研究は、そうした「組織の力」が強い会社ほど悪い知らせを早めに伝え、株価が突然暴落しにくいことを示した。ところが投資家はそれを逆に危険の印と見ていた、という食い違いが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "スペクトル型リスク尺度をRAROCに組み込む", "title": "Spectral Risk Measures in RAROC: A Risk-Sensitive Framework for Risk-Adjusted Financial and Accounting Information — Evidence from the DAX 40", "url": "https://doi.org/10.21203/rs.3.rs-11259429/v1", "authors": "Georgios Zachos ほか", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Zachos, G., & Chytis, E. (2026). Spectral Risk Measures in RAROC: A Risk-Sensitive Framework for Risk-Adjusted Financial and Accounting Information — Evidence from the DAX 40. https://doi.org/10.21203/rs.3.rs-11259429/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "リスク調整後の資本収益率（RAROC）に、裾のリスクを反映するスペクトル型リスク尺度（SRM）を組み込む方法を提案し、DAX 40の構成企業のデータで計算した（抄録）。未査読のプレプリントである。", "p3": "従来のRAROCが使うVaRは一般に整合的でなく、裾が重いと劣加法性を満たさないことがあるため、リスク回避の度合いを指定できるSRMを用い、市場連動型と企業固有型の2つの方法でSRM・VaR・期待ショートフォールに基づくRAROCを計算した（抄録）。", "p5": "会計の実務家、アナリスト、投資家が提案するRAROCを使える場面を示し、使うリスク尺度によるRAROCの値の違いを検討した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "投資の「もうけの効率」を測るとき、めったに起きない大損をどう数えるかで結論が変わる。この研究は、まれな大損ほど重く数える物差しを使って、ドイツの代表的な40社の収益の効率を測り直した。危機のときにこそ役立つ物差しだと著者は論じる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "南アのESG開示・成績・リスクと監査報酬", "title": "The Impact of ESG Disclosure ESG Performance and ESG Risk on Audit Fees and Non Audit Fees in the South African Quasi Mandatory Regime", "url": "https://doi.org/10.21203/rs.3.rs-11120269/v1", "authors": "Adebiyi Sunday Adeyanju ほか", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Adeyanju, A. S., Iyiola, F. A., & Cloete, M. B. (2026). The Impact of ESG Disclosure ESG Performance and ESG Risk on Audit Fees and Non Audit Fees in the South African Quasi Mandatory Regime. https://doi.org/10.21203/rs.3.rs-11120269/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "南アフリカの準義務的な制度の下で、ESGの開示・成績・リスクが監査報酬と非監査報酬にどう関わるかを調べた（抄録）。未査読のプレプリントである。", "p3": "ヨハネスブルグ証券取引所の上場企業の2006〜2024年のパネルデータで、OLS、固定効果、変量効果モデルを推定した（抄録）。", "p5": "ESGの開示と成績が高いほど監査報酬は高く非監査報酬は低く、SustainalyticsのESGリスクが高いほど監査報酬は低く非監査報酬は高かった（抄録）。著者らは、開示の拡大が監査の範囲と検証の手間を増やす一方、透明な報告が外部の助言への依存を減らすと解釈した（抄録）。", "fun": "会社が環境や社会への取り組みを詳しく公表すると、会計監査の料金は上がるのだろうか。南アフリカの上場企業を2006年から2024年まで調べると、詳しく公表する会社ほど監査料は高く、コンサルティングなどの料金は安かった。情報を出すことの費用と効果が見える。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "リビングラボで若者の孤独に取り組む", "title": "Co-creating responses to youth loneliness through community spaces: A Living Lab approach in Madrid", "url": "https://doi.org/10.5281/zenodo.23771054", "authors": "Martínez Cardama ほか", "venue": "Zenodo", "date": "2026-10-29", "apa": "Martínez Cardama, S., Parra-Valero, P., Otero-Borges, L., & Bautista-Puig, N. (2026). Co-creating responses to youth loneliness through community spaces: A Living Lab approach in Madrid. Zenodo. https://doi.org/10.5281/ZENODO.23771054", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "マドリードの大学生の孤独と、図書館などの公共・地域の場の関係を、リビングラボの方法で共同研究する計画と途中経過を報告した会議論文（抄録）。未査読である。", "p3": "孤独と地域の場の利用の調査、図書館・NGO・保健センター・若者支援の専門家17人への面接を組み合わせ、今後は若者とのフォーカスグループを行い、つながりを育む試作品を共創する（抄録）。", "p5": "若者の孤独を地域の社会課題として捉え、リビングラボが経験と地域の知を共創の解決策に変えうること、信頼の構築や協働といった過程そのものの関係的な価値を示したとする（抄録）。結果の数値は抄録にない（未確認）。", "fun": "図書館は本を借りる場所だけでなく、ひとりぼっちの若者がほっとできる居場所にもなる。この研究は、大学生、図書館の職員、支援団体などが一緒に、孤独をやわらげる場の工夫を考えるマドリードの取り組みを報告している。答えを一緒に作る過程そのものに価値があるという考え方だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "保護者のいない移民の子どもと包摂を共創", "title": "Beyond consultation: co-creating social inclusion with unaccompanied migrant children through Living Labs", "url": "https://doi.org/10.5281/zenodo.23772361", "authors": "Ortiz-López, Juan Eduardo", "venue": "Zenodo", "date": "2026-10-29", "apa": "Ortiz-López, J. E. (2026). Beyond consultation: co-creating social inclusion with unaccompanied migrant children through Living Labs. Zenodo. https://doi.org/10.5281/ZENODO.23772361", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "保護や管理の対象とされがちな、保護者のいない移民の子どもが、政策づくりに意味のある形で参加できるかを、子ども中心のリビングラボで検討した進行中の研究の報告（抄録）。未査読である。", "p3": "EUの事業の一環として、写真と語りで経験を表すフォトボイスと、政策を話し合うポリシーラボを組み合わせ、ベルギー・イタリア・スペインの受け入れ施設で行う設計とし、イタリアで13〜17歳の少年7人と試行した（抄録）。", "p5": "参加者は移住、社会的包摂、障壁、教育と就労への希望を視覚と語りで表し、ポリシーラボでは移民の子どもへの偏見に対する政策案をまとめた（抄録）。著者らは、大人中心の見方や力の非対称、参加のための倫理的な条件への配慮が必要だとした（抄録）。", "fun": "大人が子どものための政策を決めるとき、当の子どもの声はなかなか届かない。この研究では、親と離れてイタリアに来た13〜17歳の少年たちが、写真を撮って自分の経験を語り、偏見をなくすための政策案まで自分たちで考えた。子どもを「守られるだけの存在」から「一緒に考える仲間」に変える試みだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "アチェの洪水後の子どもの心理社会的回復", "title": "“Living with Disaster After the Disaster”: A Multi-Stakeholder Qualitative Study of Children’s Psychosocial Recovery Following Flooding in Aceh, Indonesia", "url": "https://doi.org/10.21203/rs.3.rs-11090251/v1", "authors": "Sumarti Endah Purnamaningsih Maria Margaretha ほか", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Margaretha, S. E. P. M., Purwaningsih, I., Urrahman, D., Faizah, I. N., Tahlil, T., & Marthoenis, M. (2026). “Living with Disaster After the Disaster”: A Multi-Stakeholder Qualitative Study of Children’s Psychosocial Recovery Following Flooding in Aceh, Indonesia. https://doi.org/10.21203/rs.3.rs-11090251/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "インドネシア・アチェ州の洪水の後、子どもの心理社会的な回復がどう進むかを、子ども・養育者・教師・保健職員など多様な関係者の視点から探った質的研究（抄録）。Research Squareの未査読のプレプリントである。", "p3": "災害の約7か月後に半構造化面接と集団討論を行い、16件の記録（個別面接14件、集団討論2件）を帰納的に分析した。報告はCOREQの基準に従った（抄録）。", "p5": "回復は個人・関係・日常・制度の4つの相互につながる主題で描かれ、環境の中の記憶や生活の乱れで苦痛が続く一方、家族の安心、友人、学校への復帰、信仰、日課の回復で安全が少しずつ取り戻された（抄録）。既存の支援は評価されたが、不均一で断続的で、地域とサービスの間のつながりが足りなかった（抄録）。", "fun": "災害の後、子どもの心の回復は症状が消えれば終わりではない。洪水から約7か月後のインドネシアで話を聞くと、子どもたちは家族の声かけ、友だち、学校の再開、遊びや人の手伝いを通じて少しずつ安心を取り戻していた。支援がばらばらで長続きしないことが課題だという。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "行動ナッジで保護者のデジタル読み聞かせを促す", "title": "Using Behavioral Nudges to Engage Caregivers in Digital Shared Reading and Parenting Practices: Impacts on Caregivers and Early Childhood Development", "url": "https://doi.org/10.31234/osf.io/bfrvp_v1", "authors": "kaija taylor ほか", "venue": "PsyArXiv", "date": "2026-10-28", "apa": "taylor, k., Ball, M.-C., Serratore, A., Nadeem, W., Tredinnick, K., Kucirkova, N., & Jasińska, K. K. (2026). Using Behavioral Nudges to Engage Caregivers in Digital Shared Reading and Parenting Practices: Impacts on Caregivers and Early Childhood Development. https://doi.org/10.31234/osf.io/bfrvp_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "南アフリカで、読み聞かせアプリと子育てのヒントを組み合わせたデジタル介入が、養育者の自己効力感や実践、幼児の発達に効くか、行動ナッジで利用を続けさせられるかを評価した（抄録）。PsyArXivの未査読のプレプリントである。", "p3": "研究1は3〜5歳の子の養育者519人を、アプリのみ、リマインダー付き、目標設定付き、対照の4群に無作為に分けて15週間使わせたRCT、研究2は3週間の利用の前後に養育者20人に行った面接である（抄録）。", "p5": "割り付けそのもの（ITT）は養育者・子どもの結果に有意な効果がなかったが、特に目標設定のナッジは利用を増やし、低所得の家庭や初期の能力が低い子どもの認知・言語の力を高めた（抄録）。利用の障壁として通信費や、英語の本を母語に訳す手間などが挙がった（抄録）。", "fun": "読み聞かせアプリを配るだけでは、子どもの言葉の力は伸びなかった。ところが目標を立てるよう促すメッセージを送ると親がよく使うようになり、特に恵まれない家庭の子どもの力が伸びた。519人の親を対象にした実験で、道具そのものより使い続けてもらう工夫が大事だとわかる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "従業員の認識と記録は一致するか、電力会社の事例", "title": "Do Employee Perceptions Match the Records? A Mixed-Methods Study of a State Electricity Distribution Utility", "url": "https://doi.org/10.20944/preprints202610.2912.v1", "authors": "Rupesh Thakur ほか", "venue": "Preprints.org", "date": "2026-10-29", "apa": "Thakur, R., & Jain, N. (2026). Do Employee Perceptions Match the Records? A Mixed-Methods Study of a State Electricity Distribution Utility. https://doi.org/10.20944/preprints202610.2912.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "インドの州営配電会社（HPSEBL）で、従業員の認識が組織の記録と一致するかを、収束型の混合研究法で調べた（抄録）。Preprints.orgの未査読のプレプリントである。", "p3": "従業員414人の層化調査をPLS-SEMで分析し、2014-15〜2023-24年度の会計、規制当局の命令、全国の成績評価の指標と並べ、各構成概念と12の仮説経路を事前に決めた基準で照合した（抄録）。", "p5": "両方の情報源とも財務の弱さと全国平均より良い運営を示し、一致は財務の持続性で強く、統治・運営・福利などでは部分的だった（抄録）。2022-23年度は規制上は136.44クロールの黒字、会計上は1,436.71クロールの赤字で、従業員の財務の評価は会計上の数字に近かった（抄録）。", "fun": "社員へのアンケートと会社の帳簿は、同じ会社について同じことを言っているのだろうか。インドの電力会社で比べると、同じ年でも規制上は黒字、会計上は大きな赤字という二つの数字があり、社員の感じ方は赤字の方に近かった。どの数字を見るかで人の評価が変わることがわかる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "人道支援職員の組織的ストレス要因のレビュー", "title": "Organisational Stressors Among Humanitarian Aid Workers: A Systematic Literature Review of HR Management Implications", "url": "https://doi.org/10.5281/zenodo.23697812", "authors": "Hafsa Mohamed Hassan", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-27", "apa": "Hassan, H. M. (2026). Organisational Stressors Among Humanitarian Aid Workers: A Systematic Literature Review of HR Management Implications. Zenodo. https://doi.org/10.5281/ZENODO.23697812", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "short": true, "p1": "紛争や災害の現場で働く人道支援職員が受ける、職場の条件・管理・雇用・組織の方針に由来するストレスと、その人事管理への含意を調べた系統的文献レビュー（抄録）。Zenodoに置かれた未査読の報告である。", "p3": "AI支援の検索サービスConsensus.appで文献を探し、22件を予備評価して20件の全文を入手し、基準で絞った5件の実証研究を主題別に物語的に統合した（抄録）。", "p5": "職場の要求と管理の実践、雇用条件と組織の公正、組織の支援と職員のケアの3つの主題が見いだされ、心理社会的ストレスと燃え尽き、待遇の不平等、支援を受ける際の障壁などとの関連が示された（抄録）。研究の設計や対象がばらばらで直接比較はできず、具体的な人事施策の効果の証拠は限られる（抄録）。", "fun": "人道支援の仕事のつらさは、戦争や災害そのものだけでなく、上司の管理や待遇の不公平といった職場の問題からも来る。この研究は世界の研究を集めたが、条件に合ったのは5件だけだった。人を助ける人を組織がどう守るかは、まだよくわかっていないということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "地形・気候要因と機械学習による斜面崩壊の感受性", "title": "Role of Topo-Climatic Factors in Landslide Susceptibility Mapping: A Machine Learning Perspective", "url": "https://doi.org/10.31223/x5hc0v", "authors": "Saba Raina ほか", "venue": "EarthArXiv", "date": "2026-10-29", "apa": "Raina, S., & Biswal, B. (2026). Role of Topo-Climatic Factors in Landslide Susceptibility Mapping: A Machine Learning Perspective. https://doi.org/10.31223/x5hc0v", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "地すべりの起きやすさの地図づくりで、データの少ない地域でも使えるよう、物理的に意味のある地形と気候の因子だけを入力とするランダムフォレストの枠組みを作った（抄録）。EarthArXivの未査読のプレプリントである。", "p3": "過程ベースの水文モデルから得た有効雨量と、最近提案された地形の指標（地形的な源の密度）という、従来の研究で使われていない2つの予測因子を加えた（抄録）。", "p5": "これらの因子を加えると性能が大きく上がり、ROC-AUCは0.972に達した（抄録）。対象の地域やデータの量、因子を除いた場合との差の大きさは抄録にない（未確認）。", "fun": "がけ崩れが起きやすい場所を予測するとき、データをたくさん入れればよいわけではなく、意味のないデータは予測を悪くする。この研究は、水の動きを計算するモデルから求めた「効く雨の量」と新しい地形の指標という2つの手がかりを加え、予測の正しさを表す指標で0.972という高い値を出した。", "unverified": "対象地域と、追加した因子による改善の大きさは未確認。"}}, {"id": "pr33", "rank": 33, "headline": "加速度計の小型化と高精度化の研究動向", "title": "Research Progress in the Miniaturization and High Precision of Accelerometers and Their Applications", "url": "https://doi.org/10.20944/preprints202610.2823.v1", "authors": "Junfeng Gao ほか", "venue": "Preprints.org", "date": "2026-10-29", "apa": "Gao, J., Zhang, J., Liu, D., & Wei, C. (2026). Research Progress in the Miniaturization and High Precision of Accelerometers and Their Applications. https://doi.org/10.20944/preprints202610.2823.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "慣性航法や精密計測の中心部品である加速度計について、小型化と高精度化という2つの指標から、代表的な方式の原理・性能・研究状況をまとめた総説（抄録）。Preprints.orgの未査読のプレプリントである。", "p3": "振り子式積分ジャイロ加速度計、水晶の屈曲・振動梁型、MEMS、静電浮上型、冷却原子（量子）型の各方式を比べ、最前線の技術の道筋を整理した（抄録）。", "p5": "構造の工夫（微小てこによる感度増強、負ばねによる剛性の軟化、差動共振）、材料と製造の進歩（水晶の力–周波数効果、SOIウエハ接合、フェムト秒レーザー支援エッチング）、信号の読み出しの変換（アナログ電圧から周波数や量子状態へ）が3つの中核の道筋だとした（抄録）。", "fun": "身につける小さな機器から宇宙機まで、動きを測るのは加速度計という部品だ。この総説は、てこの原理で感度を上げる仕組みや、冷やした原子を使う量子型まで、より小さく、より正確にするための工夫を3つの方向に整理している。同じ「測る」でも方式によって得意な場面が違うのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "磁気嵐でのGNSS-RTKの誤差リスク指標を評価", "title": "Evaluation of a GNSS-derived RTK-RISK indicator against global space-weather indices during the May 2024 geomagnetic storm", "url": "https://doi.org/10.21203/rs.3.rs-11293579/v1", "authors": "Atis Vallis ほか", "venue": "Research Square (In Review)", "date": "2026-10-29", "apa": "Vallis, A., Celms, A., Zvirgzds, J., & Vallis, J. (2026). Evaluation of a GNSS-derived RTK-RISK indicator against global space-weather indices during the May 2024 geomagnetic storm. https://doi.org/10.21203/rs.3.rs-11293579/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "2024年5月11日の極端な磁気嵐の際に、ラトビアのGNSS基準局網から作った地域のRTK測位のリスク指標（RTK-RISK）が、世界的な宇宙天気や地磁気の指数とどう対応するかを評価した（抄録）。Research Squareの未査読のプレプリントである。", "p3": "RTK-RISKは電離層の全電子数の変化率指数（ROTI）のばらつきと垂直全電子数（VTEC）の空間勾配を組み合わせたもので、DstやKp、惑星間磁場のBzと南向き成分Bs、太陽風速度、結合の代理指標VswBsとスピアマンの順位相関で比べた（抄録）。", "p5": "同時の関係で最も強く有意だったのはDst（ρ=−0.63）で、Kpはρ=0.65だったが3時間の分解能では有意でなく（p=0.078、N=8）、Bs（0.41）、Bz（−0.40）、VswBs（0.35）も有意だった（抄録）。符号は地磁気活動の強まりと南向きの磁場の条件に物理的に整合した（抄録）。", "fun": "太陽の活動で強い磁気嵐が起きると、上空の電気を帯びた層が乱れ、精密な衛星測位が狂いやすくなる。2024年5月の大きな磁気嵐の日に、ラトビアの観測網で作った「測位の危険度」は、世界規模の宇宙天気の指標と整合的に動いていた。地域の小さな網でも宇宙の天気が読めるということだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "受け入れても価値は取り込めない、ハンガリーの電池産業", "title": "Hosting is not capturing: an exposure-capability framework and Hungary's electric-vehicle battery bet", "url": "https://doi.org/10.48550/arxiv.2610.37445", "authors": "Zoltán Bartha", "venue": "arXiv (Cornell University)", "date": "2026-10-27", "apa": "Bartha, Z. (2026). Hosting is not capturing: an exposure-capability framework and Hungary's electric-vehicle battery bet (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37445", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "short": true, "p1": "多重危機のもとで経済統合が効率の源から脆弱性の面に変わるとき、依存的な経済はどう対応すべきかを、外部依存の集中度と生産能力の深さの2軸で戦略を4つに分ける枠組みで論じ、ハンガリーのEV電池製造への大規模な賭けに当てはめた（抄録）。arXivの未査読のプレプリントである。", "p3": "ハンガリーの大企業の2010〜2024年の企業パネルで4つの仮説を検定し、投資を支えた補助の条件を調べた（抄録）。", "p5": "部門は大きく拡大したが、価値の獲得は建設期の損失からの回復を超えて上がらず、生産は最も低付加価値の段階に集中し、自らの費用もまかなえていなかった（抄録）。補助の条件は投資額・売上・雇用の維持で、能力に関わる基準は条件でなく考慮事項にとどまり、著者は電池セル製造が自動車組立と同じ従属的な位置で置き換わっただけと結論した（抄録）。", "fun": "工場を誘致すれば、その国が産業の上流に上がれるとは限らない。ハンガリーは電気自動車の電池工場を大量に受け入れたが、2024年までのデータでは、付加価値の低い工程に集中し、費用もまかなえていなかった。サプライチェーンを「置く」ことと価値を「つかむ」ことは違う、という題名どおりの結論だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "剛性杭工法の粒状層の荷重伝達を実験とDEMで予測", "title": "Prediction of Load Transfers in Granular Layers Used in Rigid Inclusions Technique. Experimental and Discrete Element Method Analysis.", "url": "https://hal.science/hal-05842277v1", "authors": "B Chevalier ほか", "venue": "HAL", "date": "2026-10-28", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": true, "short": true, "p1": "非常に軟弱な地盤の上に道路・鉄道・建物を造るため、杭の網と荷重を伝える粒状の層を組み合わせる剛性インクルージョン工法で、粒状層での荷重伝達の仕組みを実験と離散要素法（DEM）で調べた（抄録）。HALに置かれた報告で、査読の有無は未確認。", "p3": "有効な設計法がない原因は粒状層の荷重伝達の理解不足にあるとして、模型実験と離散要素法による数値解析を行った（抄録）。", "p5": "どちらの結果でも粒状層は地表の沈下と軟弱土にかかる荷重を大きく減らし、荷重伝達は杭の上の特定の領域で起こり、軟弱土の剛性に強く影響された（抄録）。数値解析との一致がよかったことから、Carlssonの記述に近い荷重伝達の大きさの予測を提案した（抄録）。", "fun": "やわらかい地面に道路を造ると沈んでしまう。そこで地中に杭を並べ、その上に砂利のような粒の層をかぶせて重さを杭に集める方法がある。この研究は、粒の一つひとつの動きを計算する方法と実験を使い、重さが杭の真上の限られた場所を通って伝わることを確かめた。", "unverified": "実験の規模と予測式の具体的な形は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "心理学的な特徴に絞るとLLMの道徳判断が人に近づく", "title": "Cognitive Bottlenecks Improve AI Alignment with Human Moral Judgment", "url": "https://doi.org/10.31234/osf.io/ek46d_v2", "authors": "Danica Dillion ほか", "venue": "PsyArXiv", "date": "2026-10-28", "apa": "Dillion, D., Mondal, D., Zhao, W., Tandon, N., & Gray, K. (2026). Cognitive Bottlenecks Improve AI Alignment with Human Moral Judgment. https://doi.org/10.31234/osf.io/ek46d_v2", "why": "危害・意図・被害者の弱さなど少数の心理的特徴を経由させる『認知的ボトルネック』で、再学習なしにLLMの道徳判断を人間に近づけ、説明への信頼も高めた。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "公式インフレ率を伝えると家計の高い予想が抑えられる", "title": "Official Inflation Information and Household Expectations in High-Inflation Türkiye", "url": "https://doi.org/10.2139/ssrn.7665101", "authors": "Oguz Gurerk ほか", "venue": "SSRN", "date": "2026-10-28", "apa": "Gurerk, O., & Çakmak, K. (2026). Official Inflation Information and Household Expectations in High-Inflation Türkiye. https://doi.org/10.2139/ssrn.7665101", "why": "トルコの大規模な電話調査の無作為化で、公式インフレ率の提示が高い予想を和らげ、数値を答える人の構成も変えることを示し、期待調査の設計に示唆を与え
