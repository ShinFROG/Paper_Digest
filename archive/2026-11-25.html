<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-25", "intro": "プレプリントの新着1,166件（一覧の候補276件）、学術誌の新着（上位10%誌・重点誌・VBIの監視誌1,299件・うち一覧の候補310件、その他のQ1・Q2誌の候補73件）、重要論文の候補338件（プレプリント253件・学術誌85件）、新着オープンデータ96件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目34報、オープンデータ30件です。論文誌・注目は、主要誌の新着が少なく（統計学・機械学習の主要誌は各1報以下）、内容の合う論文がある範囲に件数を絞りました。経済学の1報と機械学習の1報は上位10%誌の新着から補いました。プレプリント・注目の組織行動は、内容で選べる候補が2報でした。今日のおすすめ分野（人口学、ヒューマンコンピュータインタラクション）は、プレプリントで8報、論文誌で4報を入れました。抄録のない新着は各部の16位以下に置きました。e-Statの新しい公表は候補にありませんでした。取得できなかった情報源：OpenAlexの橋梁の構造ヘルスモニタリングの検索1件（504 Gateway Timeout）。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "橋の早期警報を逐次のベイズ意思決定で最適化", "title": "Bayesian sequential decision-making for adaptive early warning of bridge failure risk", "url": "https://arxiv.org/abs/2611.30706", "authors": "Teng Li ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Li, T., Beck, J. L., Huang, Y., Li, H., & Han, H. (2026). Bayesian sequential decision-making for adaptive early warning of bridge failure risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30706", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（序論の貢献、§3の2つの事例の要所、§3.3の比較、§3.4の限界、結論、図表キャプション）を読んだ。§2の式の導出と付録は読んでいない", "preprint": true, "p1": "橋の破壊リスクの早期警報を、決まったしきい値を超えたら鳴らす受け身の検知から、監視データが届くたびにしきい値そのものを最適化し直す逐次の意思決定に置き換える枠組みを示した（§1、§4）。", "p2": "従来は経験的に決めた静的なしきい値で事後的に警報を出すため、不確かさの変化や決定の経済的な帰結が考慮されず、警報が遅れる。連続する決定は互いに独立でなく、不確かさを決定の時点の間で一貫して伝える必要がある（§1）。", "p3": "構造状態についての信念（belief state）をベイズの定理で更新し、ベイズ動的線形モデルで将来の観測を予測して、事前事後分析（pre-posterior analysis）で候補のしきい値ごとの期待総費用を求め、最小にするしきい値を選ぶ。1組のシナリオを全候補で共有し、並べ替えと1回の走査で厳密な最小点を得る算法で高速化した（§1、§3.1.2）。", "p4": "スウェーデンの鋼リベット可動橋（ひずみゲージ16点。58回目の開閉で部材の部分的な亀裂が確認された公開データ）と、中国の供用中の斜張橋のケーブルの長期監視データで検証した。しきい値を最初に決めて固定する方策と、期待総費用と警報の時期を比べた（§3.1、§3.2、§3.3）。", "p5": "最初の時点で固定したしきい値の期待総費用は3.31百万ユーロ、適応的に最適化し直す方策は1.287百万ユーロだった。固定では警報が少なくとも50か月遅れ、提案法の24か月目よりずっと遅い（§3.3）。損傷のデータが届くと、各センサのしきい値は自動的に厳しくなった（図10）。", "p6": "著者は、応力サイクルの定常性と独立性の仮定のもとでは急な損傷への適応が遅れうること、異常なデータでも事後分散が小さくなること、結果が費用モデルに強く依存し、得られたしきい値は普遍的な推奨ではないことを挙げる（§3.4.1、§3.4.2）。", "fun": "警報は、ある値が決まった基準を超えたら鳴るのがふつうだ。橋の警報も同じだが、鳴らしすぎれば通行止めなどの損が出て、鳴らさなければ事故の危険が増す。この研究は「鳴らす基準」そのものを、新しい計測が届くたびに損得を計算して決め直す。基準を最初に固定した場合と比べ、見込まれる総費用は3.31百万ユーロから1.287百万ユーロに下がった。", "unverified": "§2の式の導出、付録Cの理論的な保証の証明、斜張橋の事例の数値（図14・図15）は読んでいない。費用モデルのパラメータの値（表2）も確認していない。"}}, {"id": "pr02", "rank": 2, "headline": "物理モデルと補正項の取り分を直交化で一意に", "title": "Separating physics from discrepancy: Orthogonalized kernels for physics-encoded system identification", "url": "https://arxiv.org/abs/2611.28889", "authors": "Cesare Donati ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Donati, C., Novara, C., Dabbene, F., & Mammarella, M. (2026). Separating physics from discrepancy: Orthogonalized kernels for physics-encoded system identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28889", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論の貢献、§3.2の定義と命題、§4.3の定理3の主張、§6の数値例、結論、図表キャプション）を読んだ。証明と§5の実装の詳細は読んでいない", "preprint": true, "p1": "物理モデルにデータ駆動の補正項を足す同定で、物理パラメータが「何を推定しているのか」を、カーネルにもデータにもよらない形で一意に定める方法を示した（§1、§7）。", "p2": "物理モデルと補正の和では、物理モデルで表せる成分をどちらに割り当ててもよい。カーネル型のモデル埋め込み（kernel-based model embedding、KME）ではその割り当てがカーネルで決まるため、物理パラメータに明確な推定対象がない（§1）。", "p3": "利用者が決める運転領域と重み（参照幾何）のもとで、雑音のない写像を物理モデルに重みつき最小二乗で射影した係数を正準パラメータと定義し、補正はこの幾何で物理モデルに直交する関数に限る（定義4、命題2）。直交化したカーネルを使うと、KMEの閉形式の解はカーネル行列の修正だけで保たれる（§1、§7）。", "p4": "静的な写像と、3次の剛性とクーロン摩擦を物理モデルが無視する質量・ばね・ダンパ系の模擬データで、最小二乗、KME、直交KME（OKME）を比べた。指標は推定値のばらつき、集合帰属の意味での実行可能集合の幅、検証データでの予測誤差（NRMSE）である（§6）。", "p5": "質量・ばね・ダンパ系（40 dB）で、OKMEの剛性の推定は5つの実験すべてで5.17〜5.20、減衰は0.623だった。KMEの剛性は8.2〜36.6と実験によって変わった（§6.2、図4）。静的な例では、データが増えるとOKMEの実行可能集合の幅が0.097から0.0058へ縮んだ（§6.1、図2）。予測誤差はOKMEがKMEを最大8%上回る程度だった（§6.2）。", "p6": "パラメータに関してアフィンなモデルに限られ、パラメータに非線形なモデルへの拡張と、補正の大きさの上限をデータから選ぶ方法は今後の課題とされる（§7）。解釈：正準パラメータは運転領域と重みの選び方で決まる値で、データを生成したばね定数（k=4）とは異なる（正準値は5.2。§6.2）。", "fun": "「ばねの硬さ」をデータから求めるとき、式に入れていない摩擦などの影響を別の柔軟な項に吸収させることがある。すると、ばねの式とその項のどちらが何を説明するかがあいまいになり、実験のやり方しだいで硬さの答えが8.2にも36.6にもなった。この研究は「柔軟な項には、ばねの式で表せる成分を持たせない」と決めることで、どの実験でもほぼ同じ値（5.17〜5.20）が得られるようにした。", "unverified": "§4の定理の証明、最悪誤差の限界に関する数値（表2）、§5の実装の詳細は読んでいない。検証は模擬データのみで、実機データでの検証は読んだ範囲にない。"}}, {"id": "pr03", "rank": 3, "headline": "知識は合うのに社会実験の効果は再現できない", "title": "Bias Cascade: Understanding the Gap Between Knowledge Alignment and Effect Replication in LLM-based Social Simulation", "url": "https://arxiv.org/abs/2611.28854", "authors": "Pujun Zheng ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Zheng, P., Wang, C., Ren, W., Yao, J., Yu, P., Zhang, X., Zha, X., & He, G. (2026). Bias Cascade: Understanding the Gap Between Knowledge Alignment and Effect Replication in LLM-based Social Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28854", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3.1の理論の導入、§3.3の指標、§4.1〜4.2の実験と主結果、§5.2の因果連鎖の分析、結論、付録Bの限界）を読んだ。§4.3の切除実験、§5.1の分散分析、付録の事例分析は読んでいない", "preprint": true, "p1": "LLMで社会実験の参加者を模擬するとき、「介入の効果の向きを知っている」ことと「相互作用を通じてその効果を再現できる」ことは別だと、ベンチマークで定量的に示した（§1、§4.2）。", "p2": "従来の評価は社会的な知識や個々の応答の一致に偏り、介入の集合的な効果を再現できるかを見ていなかった。個人の状態が合っていても行動の規則が違えば行動がずれ、個々の行動が合っていても相互作用の中でずれが積み重なりうる。著者はこれをバイアス・カスケード（bias cascade）と呼ぶ（§1）。", "p3": "コールマンのボート（マクロの条件が個人の状況を形づくり、個人が行動し、行動の相互作用がマクロの結果を生むという枠組み）で過程を分解し、古典的な研究に基づく30の反実仮想の課題REFLEXを作った。知識判断ではモデルが効果の向きを直接答え、効果シミュレーションでは社会的要因を1つだけ変えた条件でエージェントに行動させ、処置効果の向きを人の研究と比べる（§1、§3.1）。", "p4": "8つの公開・非公開の商用モデルを、各課題について5つの乱数種で評価した。主な指標は、向きが合った割合から逆になった割合を引いた正味の方向スコア（NDS、−1〜1）で、ブートストラップの信頼区間を付ける（§3.3、§4.1）。", "p5": "効果シミュレーションのNDSは0.140〜0.453にとどまった。最良のGLM-5.3でも知識判断の0.847に対し0.453で、差0.393の信頼区間[0.113, 0.593]はゼロを含まない（§4.2、表1、図2）。因果の連鎖が長い課題ほど向きが合いにくく（係数−0.205、p<0.01）、この関係は知識判断が正しい場合にだけ現れた（§5.2、図4）。", "p6": "著者は、各課題の参照が1つの古典研究の効果の向きだけであること、結果の解決に規則ベースのエンジンを使う抽象化、参加者像が元の研究と異なりうること、因果連鎖の長さの符号化に主観が入りうることを限界に挙げる（付録B）。", "fun": "社会実験の結果を「知識」として正しく答えられるAIに、実際に参加者の役を演じさせて同じ実験をさせたら、同じ結果になるだろうか。試してみると、答えを知っているのに、演じさせると再現できないことが多かった。1人ひとりの小さなずれが、やり取りを重ねるうちに積み重なるからだ。知っていることと、社会を再現できることは違う。", "unverified": "30課題の個別の内容、情報・人数・言い回しの切除実験の数値（§4.3）、分散分析（§5.1）、付録の事例分析は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "合成回答者の「一貫しすぎ」を潜在的傾向で直す", "title": "Latent-Predisposition Personas for Heterogeneous and Reliable LLM Survey Simulation", "url": "https://arxiv.org/abs/2611.29805", "authors": "Geonwoo Bang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Bang, G., Kim, D., & Min, M. (2026). Latent-Predisposition Personas for Heterogeneous and Reliable LLM Survey Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29805", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3のデータ・モデル・指標、§5の手法、§7.1〜7.5の結果、結論と限界）を読んだ。表の全数値と付録の頑健性の検証は読んでいない", "preprint": true, "p1": "ペルソナ付きLLMで作る合成の世論が、人より意見が「そろいすぎ」ている問題を、雑音を足すのではなく、人ごとに安定した違いを持たせることで直す方法LPPを示した（§1、§8）。", "p2": "属性だけのペルソナでは、無関係な争点どうしの相関が人の1.6〜4.6倍、政党支持が説明する分散が2.5〜7.6倍になる（抄録）。温度を上げるなどの定石は回答をランダムにして相関を下げるので、同じ人に2回聞いたときの一致（再検査信頼性）が人の33〜59%に落ちる（§1）。", "p3": "各ペルソナに、回答とは無関係な固定の事前分布から、政治への関与の高さ、6つの価値の優先度、争点領域ごとの「自分の党からのずれ」を与える。関与が低いほどずれが多くなる。さらに回答の分布を鋭くして一貫性を高め、単調な最適輸送で全体の周辺分布と党別の集計に合わせる（§5、図2）。個人の回答は使わない。", "p4": "米国の3調査（CEK 622人、GSS 856人、HM 1,284人）と3つのモデルで、項目間の相関行列の誤差（corrF）と、人の再検査相関に対する比で表した信頼性を、6種のペルソナの基準と比べた。設定はCEKの開発用の半分だけで選び、他の調査とモデルには変えずに使う（§3、§7.3）。", "p5": "Qwen・CEKでは、基準が相関誤差1.46〜1.87を人の0.33〜0.59の信頼性で得るのに対し、LPPは1.68を0.95の信頼性で得た（人どうしの下限は1.10。§7.1）。信頼性を人の0.9にそろえると、LPPは6つの設定すべてで相関誤差が最小だった。2回の回答で賛否の側が変わる割合は、人の8.1%に対し基準は14.9〜18.1%、LPPは7.4%だった（§7.2）。", "p6": "対象は政党が主な対立軸である英語の米国の政治調査で、多党制や政治以外の態度では未検証である。選んだ動作点での優位が有意なのはGSSとGemmaの組だけで、メッセージへの反応の大きさはどの方法でも人の数倍のままだった（§7.5、Limitations）。著者は、合成の世論は実質的な推論で調査の代わりにならないと述べる。", "fun": "AIに年齢や性別、支持政党といった人物像を与えて世論調査に答えさせると、現実よりずっと「党派どおり」の世論ができる。ばらつきを増やそうと答えをランダムにすると、今度は同じ人に2回聞いたときに答えが変わりすぎる。この研究は、政治に関心の薄い人ほど党の方針から外れた自分なりの意見を持つ、という知見を人物像に組み込み、ばらつきと一貫性を両立させた。", "unverified": "表1〜3の個々の数値の全体、付録の頑健性の検証（言い換えた質問での再検査など）は読んでいない。"}}, {"id": "pr05", "rank": 5, "headline": "請求書75万件の網から中小企業の資金繰りを測る", "title": "Beyond Invoice Volumes: Temporal Network Structure, Maturity Concentration, and Systemic Liquidity Exposure in SME Trade-Credit Networks", "url": "https://arxiv.org/abs/2611.28876", "authors": "Sai Srikanth Madugula ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Madugula, S. S., de la Rosa, P. E., & Shankar, D. (2026). Beyond Invoice Volumes: Temporal Network Structure, Maturity Concentration, and Systemic Liquidity Exposure in SME Trade-Credit Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28876", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論の貢献、§4のデータ、§5.3の指標の定義、§7.1・§7.4・§7.5の結果、§9の限界、結論）を読んだ。仮説H2〜H4の詳細、頑健性の表、付録の導出は読んでいない", "preprint": true, "p1": "企業間の請求書約75万件を「誰が誰にいつまでに払うか」の有向ネットワークとして扱い、満期の近さを取引の網に伝播させた指標MANEを作って、何が言えて何が言えないかを検証した（§1、§10）。", "p2": "取引信用の請求書には、年間の取引額の合計では見えない時間的な同期と取引先の集中が含まれる。ただし契約上の網の中での露出と実際の債務不履行は別物で、運用の前に切り分けて評価する必要がある（§1）。", "p3": "支払期日までの近さで指数的に重みづけた請求額を各企業の「満期の種」とし、債務・債権の方向に行正規化した重みつきグラフの上で、減衰をかけながら再帰的に伝播させる（式5〜7。主な設定はα=0.5、τ=30日、γ=90日）。隣の企業の状態を平均するので、保存される損失額ではなく、網の文脈での露出を表す（§5.3）。", "p4": "ルーマニアの行政への届出に由来する仮名化された公開コーパスの、2012〜2023年の請求書749,952件・75,343社（総額EUR 99.705 billion、約997億ユーロ）を使う。企業と日付の固定効果のパネル、ブロック・ブートストラップ（999回）、多重性の補正、12か月の間隔を空けた標本外予測で評価した（§1、§4、§7）。", "p5": "請求額は極端に偏り、上位1%が額の81.41%を占める（ジニ係数0.9742。§7.1、表1）。債務者の取引先集中度が高いほどMANEは低い（係数−0.494、95%区間[−0.752, −0.248]。§7.4、表4）。一方、標本外予測ではMANEを足しても満期の種だけのモデルを上回らず（MSEの差+2.668、区間[−0.027, 7.954]）、単純な持続予測が競争力を持った（§7.5、表7）。", "p6": "著者は、年ごとに届出の網羅性が違い2021年分は別の系統で整備されたこと、実際の決済日・部分払い・倒産が記録されず企業の規模や業種も分からないこと、グラフの再構成の不確かさは推測に含まれないことを限界に挙げる。MANEは予測器ではなく、選別と監査のための診断に位置づけるべきだとする（§9、§10）。", "fun": "会社どうしの「いつまでにいくら払う」という約束を線で結ぶと、支払いの網ができる。この研究は約75万件の請求書からその網を作り、支払期限が迫った負担が取引の網の中でどう位置づけられるかを数値にした。面白いのは結論の慎重さで、凝った指標を足しても翌月の予測は良くならず、単純な持続予測が同じくらい当たった。新しい指標の限界まで正直に測っている。", "unverified": "仮説H2〜H4の推定値の詳細、頑健性の検証の表（表5・6）、付録の数学的な導出は読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "会計判断の人とAIの分担を認知工程で符号化", "title": "Human-AI Collaboration in Accounting Judgment: A Proposed Cognitive Coding Scheme and a Rule-Based Adaptive Collaboration Protocol", "url": "https://arxiv.org/abs/2611.29442", "authors": "Yulu Huang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Huang, Y., Xiao, L., & Wang, G. (2026). Human-AI Collaboration in Accounting Judgment: A Proposed Cognitive Coding Scheme and a Rule-Based Adaptive Collaboration Protocol (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29442", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1.1の問いと貢献、§3.2・§3.4の枠組み、§4.2の手順、§7.2.3と§8.4の結果、§10の限界、結論）を読んだ。配分表の詳細、3つの適用例、§7.3〜7.7の検証、付録は読んでいない", "preprint": true, "p1": "会計判断にLLMを組み込むとき、証拠の作成・専門家としての評価・責任を人とモデルにどう配分するかを、符号化の枠組み（CDAJ）と作業手順の仕様（ACP）として提案した。有効性の実証ではなく設計の提案である（§1.1、§11）。", "p2": "課題の構造から配分を決める会計に固有の規則と、それを検査できる画面の状態と記録に落とす方法が欠けている。手順が監査できる形になっていても判断が悪いことはありうるので、有用な手順と余計な負担を見分ける証拠も要る（§1.1）。", "p3": "CDAJは、会計判断をデータ取得・分析的統合などの4つの工程と、情報集約的・評価的という2つの認知的な要求で分けた4×2の配分表で、25の課題例に結びつける（§3.2、§3.4）。ACPは、LLMの出力を見る前に人が独立に見積もりと確信度を記録する段階、出典つきの出力と不確かさの開示、構造化された検証、結論の記録と監査証跡の4段階からなる（§4.2）。", "p4": "作成した20事例を2つの回答で符号化したときの一致と、3つの銀行の年次報告書1,406ページから18の数値の出所のページを探す公開資料の診断で、技術的な性質の一部を調べた（抄録、§8.4）。", "p5": "単位化・工程・要求の3つ組の完全一致は17/20で、項目別には単位化19/20、工程20/20、要求18/20だった（§8.4、表9）。出所の検索では、値・期間・単位の共起を条件に足しても通常の検索と変わらず、どちらも1位で13/18、3位以内で18/18だった（抄録）。ページが見つかることと、求める表のセルを照合できることは別だと示した（§11）。", "p6": "著者は、人での有効性の証拠がないことを最大の限界とする。診断は小規模で意図的に選んだ18セルであり、CDAJは著者が構成した分類で事例も作成したものである。36件の出典応答の記録のうち16件に不利または不明確な状態があった（§10）。", "fun": "会計の専門家がAIに下調べをさせるとき、どこまで任せてよいのだろう。この論文の提案で面白いのは「AIの答えを見る前に、まず自分の見積もりを書き留める」という手順だ。AIの助言を見る前の自分の立場を、あとから確認できる形で残すためである。ただし著者自身が、この手順で判断が良くなるかはまだ確かめていないと繰り返し断っている。提案と証拠を切り分ける姿勢が誠実だ。", "unverified": "配分表の各セルの内容（表1、付録A）、3つの適用例の詳細、§7.3〜7.7の計算機上の検証、将来の評価計画の仕様は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "相互作用したLLMエージェントは独立標本でない", "title": "Social Interaction Breaks Replicate Independence in Controlled-Clone LLM Agents", "url": "https://arxiv.org/abs/2611.29581", "authors": "Yandan Zheng ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Zheng, Y., Luo, H., & Luu, A. T. (2026). Social Interaction Breaks Replicate Independence in Controlled-Clone LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29581", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3の課題・手順・測定、§4.2の表の主な行、§4.4、結論、付録A.1の限界）を読んだ。表2の全対比、決定・予測の課題の結果、付録の統計の詳細は読んでいない", "preprint": true, "p1": "同じLLMから作った複数のエージェントは、互いに対話したあとは統計的に独立な反復とみなせないことを、対話の有無だけを切り替える統制実験で示した（§1、§5）。", "p2": "複数エージェントの評価や社会シミュレーションは、1つのモデルから多数のエージェントを作り、相互作用のあとも独立な標本として扱う。この仮定は対応する統制つきで検証されていなかった。最初に人格や意見を与える研究では、与えた事前の情報と相互作用の効果が混ざる（§1）。", "p3": "基盤モデル・システムプロンプト・復号の設定を共有し、私的な指示書だけが違う「統制されたクローン」を使う。指示書の有無と30ラウンドの対話の有無を組み合わせた5条件に、相手なしで同じ回数だけ生成させる条件を加え、指示書を固定して対話だけを切り替える対比を主な因果の対比とする（§3.1、§3.2）。", "p4": "主な結果の指標は、議論と無関係な性格検査BFI-10の回答プロファイルの前後のずれで、実行単位の厳密な並べ替え検定で評価した。主モデルはQwen3-122B-FP8で、話題の異なる2つのシナリオ（1回の実行に8体）を使い、さらに5つのモデルの変種で確かめた（§3.3、§3.4）。", "p5": "対話だけの効果は2つのシナリオで+0.917と+0.912（p=0.0008と0.0039）で、因子あたり約0.18リッカート点に当たる（§1、表3）。温度0での再測定でも残り、相手なしの生成も一部を再現したが、対話ありが最も大きかった（§5）。5つの変種すべてでシナリオ平均の対比は正だった。8体を独立とみなすと、実効的な標本数を最大1.91倍に過大評価する（§4.4）。", "p6": "著者は、主モデルが1つで変種の実行数が少ないこと、エージェント数・対話の長さ・接続の形が固定であること、人で妥当化された質問紙をLLMに使う測定上の問題、対話の直後しか測っておらず持続性が未検証であることを挙げる（付録A.1）。", "fun": "同じAIのコピーを8体用意して話し合わせる実験は、「8人分のデータ」と数えてよいのだろうか。この研究は、コピーたちが30ラウンドやり取りしたあと、話題と関係のない性格検査の答えまで変わることを見つけた。話し合ったコピーたちは互いに影響し合っていて、もう別々の標本ではない。何体いても、相互作用した集団は「1つの反復」として数えるべきだという指摘だ。", "unverified": "表2の各対比の数値の全体、決定・予測の課題（RQ3〜RQ5）の結果、付録の統計の詳細は読んでいない。"}}, {"id": "pr08", "rank": 8, "headline": "ダム計画をめぐる熟議をLLMエージェントで再現", "title": "Who Speaks for the Water? Simulating Discursive Closure and Power Asymmetries in Hydrosocial Governance", "url": "https://arxiv.org/abs/2611.28755", "authors": "Mario Lillo-Saavedra ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Lillo-Saavedra, M., Salgado-Vargas, M., García-Pedrero, Á., Rivera, D., & Somos-Valenzuela, M. (2026). Who Speaks for the Water? Simulating Discursive Closure and Power Asymmetries in Hydrosocial Governance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28755", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論の後半、§2.3〜2.5のデータと実験計画、§3.1と§3.3の結果、§4.5の限界、結論）を読んだ。表3・表4の全数値、§3.2の意味カテゴリの分析、付録は読んでいない", "preprint": true, "p1": "大規模な貯水池の建設計画をめぐる利害関係者の議論を、制度上の役割をもつLLMエージェントが自然言語で主張を作り、評価し、適応する形で模擬できるエージェントベースモデル（HSABM–LLM）を作った（§1、§5）。", "p2": "水のガバナンスの対立は、水の不足だけでなく、権力の非対称、制度への不信、水やインフラへの意味づけの枠組みから生じる。従来の模擬は意見を数値の変数で表すため、実際の熟議を形づくる論証と語りの次元を扱えなかった（抄録、§1）。", "p3": "月単位の社会水文のエージェントベースモデルに、制度の規則・情報へのアクセス・過去のやり取りに基づいて主張を生成する言語モジュール（Qwen3-8B）を結合した。エージェントの人物像と主張の行列は、チリのロンガビ川支流域での半構造化面接、水利用者293人の調査、報道と公文書456件から作った（§1、§2.3、§2.4）。", "p4": "80 Mm3の多目的貯水池の計画について、水利組織（JVRL）とNGOの参加の有無と、やり取りの確率（0.2と0.9）を変えた4つのシナリオを24か月分模擬し、支持率の推移、言説の多様性（シンプソン指数）、説得のパターンを比べた（§2.5、§3）。", "p5": "4つのシナリオすべてが期間内に全員の反対へ収束した。JVRLとNGOがいない場合、支持は41%から一時52%に上がったあと14か月でゼロになり、いる場合は最初から下がって7〜8か月でゼロになった（§3.1、図2）。制度的な主体は説得というより既存の不信を呼び起こして収束を速め、公式の権威と熟議での影響力は切り離されていた（§5）。", "p6": "著者は、全シナリオでの反対への収束が、LLMの反対論への系統的な偏りを反映している可能性を第一の限界に挙げる。水の供給条件が一定であること、単一のLLMを使うこと、実際の通信経路の単純化、結果がこの流域に固有であることも挙げる（§4.5）。", "fun": "貯水池を造るかどうかの話し合いを、流域のさまざまな立場の人の役をAIに演じさせて再現したら何が起きるか。チリの川の流域で集めた面接や調査をもとに試すと、どの条件でも最後は全員が反対になった。面白いのは、制度の側の組織が議論に加わると、もともとあった不信が呼び起こされて反対への収束がかえって速まったことだ。ただし著者は、AIが反対の議論に偏る癖のせいかもしれないと認めている。", "unverified": "表3・表4の数値の全体（役割別の説得の成功率など）、§3.2の意味カテゴリの構成、付録の指標の定義は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "地下鉄整備が住宅価格を上げる効果を二重の網で推定", "title": "Metro Infrastructure and Regional Housing Markets: Causal Inference under Spatial and Network Dependence", "url": "https://doi.org/10.21203/rs.3.rs-11017324/v1", "authors": "Ahmad Yousefi ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "Yousefi, A., Samadi, S., & Saffari, B. (2026). Metro Infrastructure and Regional Housing Markets: Causal Inference under Spatial and Network Dependence. https://doi.org/10.21203/rs.3.rs-11017324/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Research Squareに掲載された本文（§1.1〜1.2、§5.1、§5.4、§5.6.2、§5.9.1、§6.1、§7〜8）を読んだ。表2〜4の全数値、§5.5の空間計量との比較、感度分析、異質な効果の分析は読んでいない", "preprint": true, "p1": "地下鉄の建設が州の住宅価格に与える因果効果を、導入時期のずれと、地理的な近さ・経済的なつながりという2種類の地域間の依存を同時に扱って推定する枠組みを組み立てた（§1.2、§8.1）。", "p2": "従来の差分の差分は導入時期のずれを無視するか単純化することが多く、二重機械学習は交絡を柔軟に調整できても単位間の空間・ネットワークの依存を明示的に扱わない。空間計量は地理の隣接行列だけを考えることが多い（§1.1）。", "p3": "段階的な導入に対応するCallaway–Sant'Annaの差分の差分（CS-DiD）と、交差適合つきの二重機械学習（DML）を独立に使う。DMLには、地理的な近接と経済的なつながりを別々の枝で符号化するグラフニューラルネットを組み込み、両方の網を通じた依存を取り除いた処置効果を求める（§1.2、§8.1）。", "p4": "イランの31州・2006〜2023年の18期（558観測）のパネルで、期間中に地下鉄を建設したのは6州である。事前の期間がないテヘランは集計から除く。プラセボの並べ替え、平行トレンドの確認、モンテカルロ実験、空間パラメータの識別可能性の診断で検証した（§5.1、§5.4、§8.1）。", "p5": "処置群への平均処置効果はCS-DiDで0.2196（p=0.002）、DMLで0.3849で、住宅価格の31.6%〜61.9%の上昇に当たる（§8.1）。プラセボ検定のp値は0.005だった（§5.4.1）。模擬データでは、強い空間波及（ρ=0.8）があってもCS-DiDの偏りは−0.0342にとどまった（表5）。地理と経済網の枝の寄与は53.8%対46.2%だが、この標本では雑音が大きい（§5.9.1、§8.1）。", "p6": "最大の限界は標本の小ささで、地下鉄のある州は6、期間は18と、著者が挙げる慣例の目安（10単位・30期）を下回る。最終の推定は4つのコホートと5つの処置観測に基づき、著者は結果を手元のデータに条件づけられた予備的なものと位置づける（§5.6.2、§7.1、§7.2）。州単位の推定で、駅からの距離で見る局所の効果とは水準が異なる（§6.1）。", "fun": "地下鉄ができると、その地域の家の値段は上がるのか。単純に前後を比べるだけでは、ほかの原因と区別できない。しかも、ある州の価格は、隣の州や、経済的に結びつきの強い州の影響も受ける。この研究は、地理的な近さと経済のつながりという2種類の「網」を別々に扱って影響を取り除いた。ただし地下鉄を建設した州は6つしかなく、著者自身が結果は予備的だと断っている。", "unverified": "表2〜4の全数値、古典的な空間計量モデルとの比較（§5.5）、感度分析（§5.6.1）、異質な処置効果（§5.10）は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "口コミから測る都市の評判は分析の道具で変わる", "title": "Origins of City Reputation: Measuring Trust and Bias in Online Reviews Using Agentic AI and NLP", "url": "https://arxiv.org/abs/2611.31009", "authors": "Rafiazka Hilman ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Hilman, R., & Koltai, J. (2026). Origins of City Reputation: Measuring Trust and Bias in Online Reviews Using Agentic AI and NLP (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.31009", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論の問い、§2.1〜2.3のデータと2つの測定、§3.2・§3.4・§3.6の結果、§4.2、§4.5の限界、結論）を読んだ。§3.3の言語特徴の分析、§2.4の評判の指標の定義、§3.5の詳細は読んでいない", "preprint": true, "p1": "口コミから都市の「評判」を測るとき、LLMエージェントで読むか従来型のコーパス手法で読むかで、何が評判として現れるかが変わることを、同じ10万件の口コミで示した（§1、§5）。", "p2": "口コミから作られる評判が、その場所の実態を映しているのか、測定の道具を映しているのかは分かっていない。2つの手法が食い違うなら、都市の評判は書かれた内容だけでなく測定器に依存することになる（§1）。", "p3": "米国10都市のYelpの口コミ各10,000件（計100,000件）について、信頼（信憑性ともっともらしさ）とバイアス（暗黙と明示）を5段階で採点する。エージェントはGemma 4の評価役と批評役のループで、原文からの引用を証拠として先に抜き出し、引用が原文にあるかを自動で確かめる。コーパス手法は事前学習済みの分類器・辞書・規則に基づき、エージェントとは独立に作る（§1、§2.1〜2.3）。", "p4": "レビュー単位の一致をスピアマンの順位相関と重みつきκで測り、都市の差はクラスカル・ウォリス検定の効果量と多層モデルの級内相関で評価した。エージェントは例示が0・1・5個の3つの設計を比べた（§1、§3）。", "p5": "信憑性では一致が高い（ρ=0.65〜0.67、κ=0.62〜0.65）が、もっともらしさではほぼなく（ρ≦0.08）、バイアス全体でも弱い（ρ=0.23〜0.25）（§3.2、図2）。都市間の差はどの方法でもごく小さく、評判の分散のうち都市間にあるのは0.1%〜0.4%だった（§3.6、図6）。例示5個のエージェントは、ふつうの最上級の表現をバイアスとみなし、21%のレビューをバイアスありとした（0個・1個では7〜8%。§4.2）。", "p6": "著者は、1つのプラットフォーム・米国の10都市・英語に限られること、エージェントが単一の公開モデルで各レビュー1回の実行であること、例示が合成であること、同じレビューへの人手の注釈がなく、どちらが人の判断に近いかは示せないことを挙げる（§4.5）。", "fun": "店の口コミを、AIに読ませて点数をつける場合と、辞書や規則などの従来の方法で点数をつける場合で比べた。すると、主張に根拠があるかどうかの判定は両者でよく一致したが、偏りがあるかどうかの判定はほとんど一致しなかった。しかもAIに見本を5つ見せただけで、「最高の」といったふつうのほめ言葉まで偏りと数え始めた。物差しが変われば、街の評判も変わってしまう。", "unverified": "各手法が反応する言語特徴の分析（§3.3）、評判の指標の定義（§2.4）、都市別の順位の詳細（§3.5）は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "計算モデルの較正で物理的に意味ある値を復元", "title": "Bayesian Calibration of Computer Experiments and Extrapolation", "url": "https://arxiv.org/abs/2611.29567", "authors": "Jingyi Li ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Li, J., & Xiong, S. (2026). Bayesian Calibration of Computer Experiments and Extrapolation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29567", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§2.2、§3.1の定式化、§4.1の数値例と表1、§5.1と§5.3の応用と表6、§6の考察）を読んだ。§3.2〜3.3の推論の詳細、§4.2〜4.4、付録の証明は読んでいない", "preprint": true, "p1": "不完全な計算モデルの較正で、物理的に意味のあるパラメータを復元し、その結果として訓練範囲の外への外挿予測を信頼できるものにするベイズ手法BMDDを提案した（§1、§6）。", "p2": "モデル誤差に構造の制約がなければ、どんなパラメータの値でも誤差の項が埋め合わせてデータに合ってしまい、パラメータは識別できない（§2.2）。誤差を固有の成分とパラメータのずれに線形な成分に分ける既存の分解モデル（DD）は、1次のテイラー近似に頼るため高次の項が無視できないと偏り、不確かさの定量化も難しい（§1）。", "p3": "DDの誤差の分解に、高次の構造を捉える残差の過程を加える（式5）。識別可能性を保つ制約を課したうえで、較正パラメータ・誤差の各成分・分散パラメータを、ギブス内メトロポリス法で同時に事後推論する（§3.1、§6）。", "p4": "誤差にパラメータの2次の項を含む1次元の数値例などで、KOH、L2較正、DD、そのベイズ版（BDD）とパラメータの平均二乗誤差を比べた。実データは極端紫外線リソグラフィ用の多層膜ミラーの熱安定性（n=100）で、温度400以下で学習し、それより高温の応答を予測させてRMSE・MAE・90%予測区間の被覆率を比べた（§4.1、§5.1、§5.3）。", "p5": "1次元の例（n=61）のパラメータの平均二乗誤差（×10⁻⁴）は、KOH 2881.4、L2較正 6412.4、DD 7.6966に対し、BMDDは1.2410だった（表1）。高温への外挿では、BMDDのRMSEは0.0109で、KOHの0.0303、OGPの0.0232、BDDの0.0276を下回り、被覆率は1.0000だった（表6）。", "p6": "著者は、入力に依存する関数形の較正パラメータ、離散・混合の入力、多変量・時空間の応答への拡張、事後分布の大標本での性質の理論、高次元や大規模なデータでの効率的なサンプリングを今後の課題に挙げる（§6）。解釈：実データでは真のパラメータは分からず、物理的な意味の復元は外挿の精度から間接的に支持されている。", "fun": "計算モデルの中の調整つまみ（パラメータ）を実験データに合わせるとき、モデルが不完全だと、つまみが間違った位置にあっても「ずれを補う項」が帳尻を合わせてしまう。手元のデータにはよく合うが、条件を変えると外れる。この研究は、ずれの形に制約をかけて本来のつまみの位置を取り出そうとした。低めの温度のデータだけで学習し、高温での応答を他の方法より正確に予測した。", "unverified": "§3.2〜3.3の階層構造とサンプリングの算法の詳細、§4.2〜4.4の数値例、付録の証明は読んでいない。"}}, {"id": "pr12", "rank": 12, "headline": "周波数応答から受動性を保証した系を同定", "title": "Frequency-Domain Identification of Passive Discrete-Time Systems via Sequential Convex Programming", "url": "https://arxiv.org/abs/2611.28386", "authors": "Sepehr Moalemi ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Moalemi, S., Scruggs, J., & Seiler, P. (2026). Frequency-Domain Identification of Passive Discrete-Time Systems via Sequential Convex Programming (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28386", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論の貢献、§II-Cの問題設定、§III-Cの算法の説明、§Vの数値実験、§VIの結び）を読んだ。定理の証明、表Iの数値、補足の実験（§VII）は読んでいない", "preprint": true, "p1": "周波数応答のデータから、受動性（エネルギーを生み出さない性質）と安定性を保証した離散時間の線形モデルを、全てのパラメータを同時に最適化して同定する方法を示した（§I、§VI）。", "p2": "既存の方法は、同定のあとで一部の行列だけを直す後処理か、制約のない非凸の最適化に頼るものだった。受動性を厳密な凸の制約で課しながら、全ての実現行列について周波数応答の誤差を最小にする方法がなかった（§I）。", "p3": "測定した周波数応答とモデルの伝達行列の差の二乗和を最小にする（式3）。受動性の余裕とスペクトル半径の上限は、ディスクリプタ形式を使うと、実現行列と証明用の行列についてアフィンな線形行列不等式で表せる。伝達行列だけを線形化したガウス・ニュートン型の半正定値計画の部分問題を逐次に解き、アルミホの直線探索で、どの反復でも受動なモデルを保つ（§I、§III-C）。", "p4": "無作為に生成した次数12の受動な系について、512点の周波数応答に信号対雑音比10・20・30 dBの雑音を加え、各50通りで検証した。比較対象は部分空間同定、制約なしのガウス・ニュートン法、後処理で受動にする2つの方法、ポートハミルトン系のパラメータ化である。指標は細かい検証用の周波数格子での相対誤差である（§V）。", "p5": "提案法（PR-SCPと、行列をヘッセンベルグ形に限ったPR-SCP-H）は、どの信号対雑音比でも平均の誤差が最小だった。制約なしのガウス・ニュートン法は同程度の誤差だが、試した全ての場合で受動なモデルにならなかった。PR-SCP-Hは同じ誤差を、より短い計算時間で得た（§V、表I）。", "p6": "検証は無作為に生成した模擬の系に限られる。接続の形が決まったネットワークのような、構造をもつ同定への適用は今後の課題とされる（§VI）。解釈：保証されるのは一次の停留点への収束で、大域的な最適性ではない（§I）。", "fun": "受け身の装置は、自分からエネルギーを生み出さない。ところが測定データに式を当てはめて作ったモデルは、雑音のせいで、その性質を満たさなくなることがある。この研究は、当てはめの計算のどの段階でも、その性質が破れないように縛りをかけた。縛らない方法は誤差こそ同じくらいだったが、できたモデルは試した全ての場合で受動にならなかった。", "unverified": "表Iの具体的な数値、低次元のモデルの結果（図1）、補足のベンチマーク（§VII）、定理の証明は読んでいない。実測データでの検証は読んだ範囲にない。"}}, {"id": "pr13", "rank": 13, "headline": "地すべりの分数クリープ次数は破壊時刻を教えない", "title": "When does fractional creep indicate landslide acceleration? Evidence from multi-site landslide monitoring records", "url": "https://doi.org/10.5194/egusphere-2026-6241", "authors": "Fuchang Wang ほか", "venue": "EGUsphere", "date": "2026-11-24", "apa": "Wang, F., & Jin, Z. (2026). When does fractional creep indicate landslide acceleration? Evidence from multi-site landslide monitoring records. https://doi.org/10.5194/egusphere-2026-6241", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EGUsphere版のPDF本文（データの説明の一部、考察§4.1〜4.3、結論、データの入手先）を読んだ。方法の式、§3の結果の細目と図表は読んでいない", "preprint": true, "p1": "地すべりの変位記録に分数階の粘弾性クリープモデルを当てはめて得る「分数次数」が、警報に使えるのはどんな条件のときかを、性質の違う複数の現場の記録で確かめた（抄録、結論）。", "p2": "分数バーガース・モデルは加速の監視や警報のために変位記録へ当てはめられることが増えているが、当てはめた次数が運用上、何を示せて何を示せないかは十分に検証されていなかった（抄録）。", "p3": "ほぼ線形の定常クリープ（米国アラスカのGilman）、地下水による脈動的な加速（オーストリアのGradenbach）、破壊に至る単調な加速（ペルーのAchoma）、貯水池に駆動される2つの斜面（中国・三峡のBaijiabaoとShuping）に同じ逆解析の手順を当て、AICによるモデル選択、破壊時刻の推定、起点をずらした予測の検証、外力を入れたモデルとの比較を行った（抄録、結論）。", "p4": "判断の基準は、次数が境界に張り付かず内点の最適値として同定されるか、複数の初期値で同じ解に達するか、破壊時刻の推定が事前に収束するか、外力を明示的に入れると次数がどう変わるかである（§4.1〜4.3）。", "p5": "ほぼ線形の記録では分数モデルは過剰で、単調に加速するAchomaでだけ次数が内点の最適値（α=4.456）として同定され、福囿の外挿は観測された破壊時刻と1日以内で一致した。ただし±5日以内に収束する予測が得られるのは破壊の3〜4日前だけだった。Baijiabaoでは季節的な貯水池の応力を入れると次数が1.228から0.715に下がり、年周期の残差の48%が吸収された（結論、§4.3）。", "p6": "著者は、Shupingの記録が月次・隔週で年に17〜33点しかなく、GPSの雑音（±3 mm）が変形と同程度であることを方法上の注意として挙げる。物理的な制約なしの最適化は矛盾した解に落ちうるため、1回の初期値での逆解析は信頼できないとする（データの説明、§4.2、§4.3）。次の課題は、連続的な水位と離散的な脈動を合わせた核である（結論）。", "fun": "斜面がゆっくり動く速さがだんだん増していくとき、その増え方を表す数（次数）が1を超えたら危ない、と使いたくなる。ところが調べると、貯水池の水位の季節変化を式に入れ忘れただけで、この数は見かけ上1を超えてしまった（1.228。水位を入れると0.715）。崩壊の日を1日以内で当てた例も、当てられたのは直前の3〜4日だけだった。便利な指標ほど、何が混ざっているかの確認が要る。", "unverified": "モデルの式と逆解析の手順（方法の節）、§3の各記録の結果の表と図、姉妹編の方法論文での合成データによる検証は読んでいない。"}}, {"id": "pr14", "rank": 14, "headline": "車載の近赤外3波長で路面の乾湿・雪氷を判定", "title": "PINIR: A Physics-Informed Near-Infrared Framework for Vehicle-Mounted Road Surface Classification", "url": "https://doi.org/10.20944/preprints202611.2347.v1", "authors": "Johan Casselgren ほか", "venue": "Preprints.org", "date": "2026-11-24", "apa": "Casselgren, J., Ou, H., Askengren, A., Sollén, S., & Sjödahl, M. (2026). PINIR: A Physics-Informed Near-Infrared Framework for Vehicle-Mounted Road Surface Classification. https://doi.org/10.20944/preprints202611.2347.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "車両に載せた能動型の近赤外センサで、路面が乾燥・湿潤・積雪・凍結のどれかを、物理にもとづく表現と決定的な規則で分類する枠組みPINIRを示した（抄録）。", "p2": "路面とタイヤの摩擦を、走行中の車両の前方について力として直接かつ連続的に測ることはできない。そのため路面状態の分類が、危険な走行条件につながる路面を見つけるための代理になる（抄録）。", "p3": "980nm、1310nm、1550nmの能動的な近赤外計測に、相対的なスペクトル較正、参照で制御した適応的な時間フィルタ、物理的な動機にもとづく光学的な表現、重心を固定した決定規則を組み合わせる。表現は波長の比と較正済みの総光学応答を合わせ、波長に依存する減衰と表面の散乱の両方の情報を残す（抄録）。", "p4": "北欧の代表的な路面条件で取得し、人手で注釈した140,165件の計測で評価した。指標は4クラスの正解率と、摩擦の高低に対応する運用上の群にまとめたときの正解率である。比較した手法は抄録にはない（未確認）。", "p5": "4クラスの正解率は87.2%で、摩擦の高低の群にまとめると96.2%に上がった。4クラスの主な誤りは雪と氷の間で起き、群をまたぐ主な誤りは氷を湿ったアスファルトと分類するものだった（抄録）。", "p6": "抄録の範囲では、著者が挙げる限界は分からない（未確認）。解釈：氷を湿潤と誤る誤りは、摩擦を高く見積もる方向の誤りにあたる。北欧以外の条件での性能と、学習型の手法との直接の比較は、抄録からは確認できない。", "fun": "道路が凍っているかどうかを、タイヤが滑ってから知るのでは遅い。この研究は、目に見えない近赤外の光を3種類の波長で路面に当て、返ってくる光の波長ごとの比と全体の強さから、路面が乾いているか、濡れているか、雪か氷かを判定する。統計的に学習した特徴に頼るのでなく、決まった規則で判定するので、なぜそう判定したかをたどれるのが特徴だ。", "unverified": "本文を入手できず、センサの構成、計測時の走行条件、フィルタと決定規則の詳細、クラス別の誤りの内訳の数値は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "サステナ報告書の監査をLLMの推薦で支援", "title": "SARA: An Auditor-in-the-Loop LLM Recommender for Sustainability Reports", "url": "https://arxiv.org/abs/2611.30839", "authors": "Lars Hillebrand ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Hillebrand, L., de Oliveira, T. B. F., Dilmaghani, T., Khaled, M., Das, W., & Sifa, R. (2026). SARA: An Auditor-in-the-Loop LLM Recommender for Sustainability Reports (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30839", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（全4ページ。序論、関連研究、システム、評価、結論、図表）を読んだ", "preprint": true, "p1": "企業のサステナビリティ報告書の監査で、約1,700の規制要件のそれぞれに対応する報告書の箇所をLLMが推薦し、適合の仮の判定を示す監査人主導のシステムSARAを、Wordのアドインとして実装し実運用した（抄録、§1）。", "p2": "EUの企業サステナビリティ報告指令（CSRD）で開示の量と複雑さが増えた。要件を該当箇所に対応づけて充足を判断する作業は主に手作業で、報告書の版が変わるたびに繰り返される。LLMに要件ごとに報告書全体を読ませると遅く、費用もかかる（§1）。", "p3": "要件は主題・副主題の2階層の分類の下に並ぶ。まずLLMが報告書の各箇所（段落・表・箇条書き）に主題と副主題を割り当て、次に要件ごとに同じ副主題の箇所だけを候補にして、該当箇所の選択と「充足・一部充足・未充足」の仮の判定を1回の呼び出しで行う（§3.1）。監査人が対応を確定・却下・追加し、判定は確定した対応から再計算され、操作は監査証跡として残る（§3.2）。", "p4": "専門家が注釈した2つのCSRD報告書（要件477件と397件、計874件）で、ハイブリッド検索で断片を取る方法（S1）、報告書全体を渡す方法（S2）、主題で絞る方法（S3）を、要件単位でマクロ平均した適合率・再現率・F1と、費用・時間で比べた。見落としの害が大きいので再現率を重視する（§4）。", "p5": "S3は適合率48.6、再現率70.6、F1 50.6で3つのうち最も良く、費用は19.6ドル、時間は7.5分だった（S2は126.2ドル、12.9分。表1）。入力トークンはS2より約95%少なく、時間は42%短い（§4）。", "p6": "評価は2つの報告書だけで、適合の判定そのものは注釈がないため評価していない。システムは監査法人の本番環境で動いており、公開されていない。監査人の決定を推薦の改善に戻すことと、判定の評価は今後の課題とされる（§4、§5）。", "fun": "サステナビリティ報告書の監査では、約1,700の決まりごとから会社ごとに当てはまるものを選び、その1つひとつについて「報告書のどこに書いてあるか」を探さなければならない。AIに毎回報告書を丸ごと読ませると時間もお金もかかる。そこで先に各段落に主題の札を付け、決まりごとと同じ札の段落だけを読ませた。棚を絞ってから本を探すのと同じ工夫で、費用は126.2ドルから19.6ドルに下がった。", "unverified": "適合の判定の正確さ、監査人の実際の作業時間の削減は論文に示されていない。評価に使ったモデルは1種類である。"}}, {"id": "pr16", "rank": 16, "headline": "熟議は好意でなく賢い政策を生む：警察の実地実験", "title": "Deliberation as an Epistemic Filter: Field and Survey Experimental Evidence from Policing", "url": "https://doi.org/10.2139/ssrn.7724378", "authors": "Suyeon Jo ほか", "venue": "SSRN", "date": "2026-11-24", "apa": "Jo, S., An, S.-H., & Smith, C. R. (2026). Deliberation as an Epistemic Filter: Field and Survey Experimental Evidence from Policing. https://doi.org/10.2139/ssrn.7724378", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "熟議型の住民参加は、通常の公聴会に比べて警察への好意を増やすのではなく、より質の高い政策提言を生むことを実験で示した。", "p3": "銃暴力の削減を題材に、参加者を熟議の対話サークルと通常の公聴会に無作為に割り当て、前後の調査で信頼と警察への評価の変化を測った。別に全国のオンライン標本が両群の提言を評価した（抄録）。", "p5": "熟議は警察と地域の関係の認識を改善したが、警察の仕事ぶりの評価は下げた。熟議の提言は有効性と影響で有意に高く評価され、実現可能性には差がなかった（抄録）。", "fun": "住民と警察がじっくり話し合えば仲良くなる、と考えがちだ。ところが実験では、深く関わった住民ほど警察の仕事を厳しく見るようになった。その一方で、話し合いから出た提案は第三者から「効きそうだ」と高く評価された。熟議は仲直りの場というより、より賢い案を練る作業場だという見方が面白い。", "unverified": "参加者の人数、効果の大きさの数値、全国調査の標本の規模は抄録になく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "状態空間と注意機構の作用素で非線形応答を予測", "title": "Hybrid state-space and attention neural operators for nonlinear structural dynamics under environmental loading", "url": "https://arxiv.org/abs/2611.29334", "authors": "Anastasios Stamou ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Stamou, A., Teixeira, R., Nogal, M., & Fragiadakis, M. (2026). Hybrid state-space and attention neural operators for nonlinear structural dynamics under environmental loading (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29334", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "風と波を受ける構造物の非線形な応答の時刻歴を、訓練した長さを超えて予測できるニューラル作用素DeepOJambaを提案した。", "p3": "選択的な状態空間型の再帰と全体への注意機構を組み合わせ、物理パラメータによる条件づけと系列間の予測状態の受け渡しで、1つの作用素に異なる条件を表させる。15 MWのモノパイル式洋上風車で評価した（抄録）。", "p5": "疲労と終局荷重の誤差は9.4%と6.0%で、次点の注意機構のみの作用素の14.6%と8.7%を下回った。訓練した波の帯域の外の海象でも、誤差の増加は約0.4ポイントだった（抄録）。", "fun": "風車の塔が風や波でどう揺れるかは、1回計算するだけでも時間がかかり、設計では何度も繰り返す必要がある。そこで計算結果をAIに覚えさせて代わりをさせるが、学習した長さより先の揺れを当てるのは難しい。この研究は「直前の状態を引き継ぐ仕組み」と「全体を見渡す仕組み」を組み合わせて、長時間の揺れを予測できるようにした。", "unverified": "訓練データの規模、誤差の定義の詳細、計算時間の短縮の程度は抄録になく未確認。"}}, {"id": "pr18", "rank": 18, "headline": "線形・パラメータ変動・非線形の同定をJAXで統一", "title": "Identax: A Toolbox for Efficient Learning of Linear, Parameter-Varying, and Nonlinear Systems in JAX", "url": "https://arxiv.org/abs/2611.30518", "authors": "Roel Drenth ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Drenth, R., Schoukens, M., & Tóth, R. (2026). Identax: A Toolbox for Efficient Learning of Linear, Parameter-Varying, and Nonlinear Systems in JAX (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30518", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "線形・線形パラメータ変動（LPV）・非線形の動的システムを同定するための、拡張しやすいJAXのツールボックスIdentaxを公開した。", "p3": "モデル構造、同定の規準、最適化法を独立に差し替えられるモジュール設計で、状態空間モデルと線形分数表現（LFR）、並列に訓練できる多重シューティングの規準を備える（抄録）。", "p5": "Silverboxのベンチマークでは、LPV-LFRモデルがこれまでのブラックボックスの結果をすべて上回り、CPUで3分未満で訓練できた。制御モーメントジャイロでは最先端と同等の精度だった（抄録）。", "fun": "機械や回路の入力と出力のデータから「中の仕組みの式」を推定する作業をシステム同定という。精度の高い方法ほど計算が重く、中身も見えにくくなりがちだ。この道具は、微分を自動で計算する仕組みと、長いデータを区切って同時に学習する工夫で、ふつうのCPUでも短時間で高精度なモデルが作れることを示した。", "unverified": "精度の具体的な数値、比較した既存手法の一覧は抄録になく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLMペルソナは「誰が言ったか」で評価を変える", "title": "S\\'anchez, Feij\\'oo, or Abascal? Speaker Attribution and Ideological Congruence in LLM Personas Reading Posts on X of the Leaders of the Three Main Parties of the 29N General Election in Spain", "url": "https://arxiv.org/abs/2611.29765", "authors": "V\\'ictor Yeste ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Yeste, V., Greco, C. M., Rosso, P., & Tagarelli, A. (2026). Sánchez, Feijóo, or Abascal? Speaker Attribution and Ideological Congruence in LLM Personas Reading Posts on X of the Leaders of the Three Main Parties of the 29N General Election in Spain (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29765", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMのペルソナを合成の聴衆として使うとき、発言の内容だけでなく「誰が言ったか」に反応するかを、スペインの3党首の投稿で調べた。", "p3": "匿名化した党首の投稿1,075件を、価値観に基づく791のペルソナに、発信者なし・3人の党首名のいずれかの4条件で読ませ、322,470組の評価を得た。ペルソナは文化地図と道徳基盤理論に基づく（抄録）。", "p5": "党首の名前を付けると同じ文章への支持が下がり、Abascalへの減点は他の2人のほぼ2倍だった。減点はペルソナの左右の自己位置に沿って変わった。党首の順序は48回の世論調査と一致したが、一致は順序の水準にとどまる（抄録）。", "fun": "同じ文章でも、誰の発言かを知らされると評価が変わる。人間でよく知られた現象だが、AIに演じさせた「架空の有権者」でも起きた。しかも左寄りの人物像は左派の党首に、右寄りは右派の党首に甘く、その立場は評価のときに教えていなかった。ただし実際の世論と合うのは順位だけで、数値までは合わない。", "unverified": "使用したモデル名、減点の具体的な大きさ、世論調査との適合の指標は抄録になく未確認。"}}, {"id": "pr20", "rank": 20, "headline": "AIの分身どうしの会話は実際の好感を予測する", "title": "Can Your AI Twin Meet People for You? It Can Hold a Conversation. But What Does It Need to Judge Like You?", "url": "https://arxiv.org/abs/2611.28692", "authors": "Wanghao Ye ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Ye, W., Chen, S., Tian, B., Wang, Y., He, S., Sun, G., Wang, Z., Wang, Z., He, Y., Shen, Z., Liu, M., Zhang, Y., Feng, M., Dong, Y., Qian, Y., Wang, Y., Peng, S., Dai, Y., Duan, Z., … Li, A. (2026). Can Your AI Twin Meet People for You? It Can Hold a Conversation. But What Does It Need to Judge Like You? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28692", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "実在の人の会話から作ったLLMの「分身」どうしに初対面の会話をさせると、本人たちが実際に会ったときの好感をある程度予測できることを示した。", "p3": "CANDORコーパスの710人について本人の別の会話から分身を作り、5,680件の模擬の初対面を行って、実際に会ったあとの本人の評価と照合した（検証用の355組）。話し方を本人に似せる操作の効果も調べた（抄録）。", "p5": "分身の会話は実際の好感を相関0.277で予測し、質問紙と評価の履歴にない情報を持っていた（偏相関0.16）。話し方を似せても精度は上がらず、探索的な2回目の検討では下がった（抄録）。", "fun": "自分そっくりに話すAIを作って、代わりに人に会ってもらう。そんなSFのような実験を710人分やってみた研究だ。分身どうしの会話は、本人たちが実際に会ったときの相性をある程度当てた。面白いのは、口調を本人に近づけても当たりやすくはならなかったことで、相手をどう評価するかという「判断の癖」は話し方とは別物らしい。", "unverified": "分身を作るのに使ったモデル、会話の長さ、相関がどの評価項目についてのものかは抄録になく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "活性化の操作でエージェントの性格を数値どおりに", "title": "Digital Knockoffs", "url": "https://arxiv.org/abs/2611.28482", "authors": "Niuniu Zhang", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Zhang, N. (2026). Digital Knockoffs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28482", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "社会シミュレーション用の言語モデルのエージェントを、目標とする多次元の性格プロファイルに数値で合わせ込む方法を提案した。", "p3": "特性ごとに活性化を操作する方向を取り出し、操作の強さから測定される特性得点への共通の写像を学習し、目標ごとの操作をベイズ最適化で探索する。OpenPsychometricsの回答者500人のビッグファイブ得点で評価した（抄録）。", "p5": "5回の反復のすべてで、割り当てた操作はプロンプトや操作の基準より平均絶対誤差が小さかった。試した操作の中から最も近いものを選ぶ場合、同じ予算の一様な無作為探索より誤差が16.6%小さかった（抄録）。", "fun": "AIに「あなたは内向的で几帳面な人です」と書いて渡しても、実際に性格検査を受けさせると、指定どおりの点数にはならない。そこでこの研究は、AIの内部の信号を直接少しずつ動かし、検査の点数が目標に近づく設定を効率よく探した。文章で指示するのでなく、つまみを回して性格を調整するという発想が面白い。", "unverified": "使用したモデル、誤差の絶対的な大きさは抄録になく未確認。行動の予測が改善するかは著者も未解決としている。"}}, {"id": "pr22", "rank": 22, "headline": "外部の正解なしでペルソナの一貫性を測る", "title": "Evaluating Persona Consistency in LLM User Simulators Without External Reference Annotations", "url": "https://arxiv.org/abs/2611.30280", "authors": "Anping Zhang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Zhang, A., Tan, Y., Liu, Y., Bai, C., Chen, B., & Li, Y. (2026). Evaluating Persona Consistency in LLM User Simulators Without External Reference Annotations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30280", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "外部の正解となる注釈がなくても、LLMが演じるペルソナの一貫性を評価できる自己基準の診断法を提案した。", "p3": "ペルソナに自己報告（リッカート尺度）を1回させて内部の基準とし、選択式の場面課題と自由回答の2種類の行動から得たプロファイルとの相関を、BFI-2の6つの側面の空間で測る（抄録）。", "p5": "一般の利用者の対話（WildChat、LMSYS）と注釈つきの人物（PDB）の両方で、プロファイルを補った表現は対話そのままの基準より自己報告とよく一致した。PDBでは外部の注釈による順位づけを再現した（抄録）。", "fun": "AIに誰かの人物像を演じさせたとき、うまく演じられているかをどう確かめるか。正解の性格診断があれば比べられるが、短い会話しか手がかりがないと正解がない。そこで「自分はこういう性格だ」と一度言わせ、その後の行動が自己申告と合っているかを見る。言うこととやることが一致しているかを確かめる、人にも使えそうな発想だ。", "unverified": "相関の具体的な値、使用したモデルは抄録になく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "AIの「語り」と実績のずれが不正の予兆になる", "title": "AI Disclosure Credibility and Corporate Financial Misconduct: Evidence from Green Digital Infrastructure in China", "url": "https://doi.org/10.21203/rs.3.rs-11836714/v1", "authors": "huan chen", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "chen, h. (2026). AI Disclosure Credibility and Corporate Financial Misconduct: Evidence from Green Digital Infrastructure in China. https://doi.org/10.21203/rs.3.rs-11836714/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の年次報告書でのAIへの言及が、実際のAI投資や特許で説明できる量を超えているとき、その後の不正の記録と関連することを示した。", "p3": "中国の上場4,662社・33,356社年を、グリーンデータセンター事業の段階的な展開、処罰の記録、AI開示、デジタル投資、AI特許などと結び、コホートを積み上げた差分の差分と、開示と行動のずれの指標で分析した（抄録）。", "p5": "事業の対象になると翌年の処罰つきの違反が1.71ポイント減り、処置前のリスクの50.5%に当たる。説明のつかない正のAIへの言及はその後の違反と関連し、統合モデルは最もリスクの高い十分位で違反の31.4%を捉えた（抄録）。", "fun": "会社の報告書に「AIを活用しています」とたくさん書いてあっても、本当に投資や特許があるとは限らない。この研究は、言っている量と実際にやっている量の差を数値にした。すると、口先だけが多い会社ほど、あとで不正で処罰されやすい傾向が見つかった。話を盛る癖は、ほかの数字にも表れるのかもしれない。", "unverified": "ずれの指標の作り方の詳細、関連の大きさの数値は抄録になく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "降伏面のある流れをTransformerで予測する条件", "title": "Failure Modes and Data-Efficient Remedies for Transformer-Based Prediction of Viscoplastic Flows", "url": "https://arxiv.org/abs/2611.28267", "authors": "Maedeh Saberi ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Saberi, M., Franca, H., Jalaal, M., & Jamali, S. (2026). Failure Modes and Data-Efficient Remedies for Transformer-Based Prediction of Viscoplastic Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28267", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "降伏応力をもつ流体の流れをTransformer型のニューラル作用素で予測するとき、どの条件で失敗し、どう直せるかを体系的に調べた。", "p3": "RheOFormerを定常のビンガム流体の流路の流れに適用し、データの構成、数値の範囲、入力の表現が内挿と外挿の精度をどう左右するかを調べた。速度の対数表現と勾配を考慮した損失を導入した（抄録）。", "p5": "栓流が支配的な流れや、訓練した速度の範囲・流れの構造の外で誤差が生じた。対数表現と勾配を考慮した損失は難しい領域の精度を大きく改善し、不足する領域の少数の事例を訓練に足すと外挿の誤差が減った（抄録）。", "fun": "歯磨き粉やマヨネーズは、弱い力では固体のように動かず、ある強さを超えると流れ出す。こうした流れでは「動かない塊」と「流れる部分」の境目ができ、AIには予測が難しい。この研究は、どんなときにAIが外すのかを単純な流路で調べ、速度を対数で表すなどデータの見せ方を変えるだけで大きく改善できることを示した。", "unverified": "誤差の具体的な数値、訓練データの件数は抄録になく未確認。単純な形状と構成則に限った検討である。"}}, {"id": "pr25", "rank": 25, "headline": "心理課題を動的環境にしてエージェントの人らしさを測る", "title": "mini-psych-agent: Evaluating Human-Like Behavior in LLM Agents through Interactive Psychological Environments", "url": "https://arxiv.org/abs/2611.30365", "authors": "Yi-Fei Cao ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Cao, Y.-F., Huang, T., Xie, H., & Zhu, J.-Q. (2026). mini-psych-agent: Evaluating Human-Like Behavior in LLM Agents through Interactive Psychological Environments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30365", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "心理学の課題を、行動が次の状況を変える動的な環境に作り替え、LLMエージェントのふるまいが人とどれだけ整合するかを評価する枠組みを作った。", "p3": "課題を文章の再生ではなく対話できる環境にし、学習した人の方策モデルを使って、エージェントの行動の軌跡が人の行動とどれだけ両立するかを測る（抄録）。", "p5": "人との整合は、LLMのエージェントとしての構成と課題によって変わった。記憶は整合を高めたが、それは選択をより人らしくするというより、予測しやすくすることによるものだった（抄録）。", "fun": "同じAIでも、記憶を持たせるか、どれだけ考えさせるかで、ふるまいは大きく変わる。人も報酬や考える時間で行動が変わるので、心理学の実験課題はAIを調べる道具に向いている。面白いのは、AIに記憶を足すと人のデータに合いやすくなるが、それは人らしくなったからではなく、行動が読みやすくなったからだった点だ。", "unverified": "扱った心理課題の種類と数、評価したモデル、整合の数値は抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "討論の内部者が世界モデルで合意を誘導する", "title": "Persuasion from Within: Model-Based Insider Attacks in Multi-Agent LLM Debate and Consensus", "url": "https://arxiv.org/abs/2611.28660", "authors": "Bangyan Ju ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Ju, B., Sun, X., Hu, Y., & Zheng, Z. (2026). Persuasion from Within: Model-Based Insider Attacks in Multi-Agent LLM Debate and Consensus (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28660", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "複数のLLMエージェントが議論して合意する仕組みに、正規の参加者として入り込んで結論を悪い方向へ導く内部者の攻撃を、学習によって作れることを示した。", "p3": "内部者は善意のエージェントのふるまいの世界モデルを過去の軌跡から学習し、それを使って説得の方策を訓練し、発言を計画する。数値の合意ゲームと複数エージェントの討論で評価した（抄録）。", "p5": "学習した内部者は、評価した中で最も効果が高く最も気づかれにくい攻撃で、他のモデル、より大きな集団、未見のデータにも通用した。攻撃データで善意の側を敵対的に訓練すると、攻撃をほぼ防げた（抄録）。", "fun": "AIどうしに議論させて答えを決める仕組みは、全員が同じ目的を持つ前提で作られている。そこへ、表向きは仲間のふりをして議論を誘導する1体が混ざるとどうなるか。この研究では、相手の反応の癖を先に学んでから説得する内部者が最も効果的だった。同じ攻撃を練習相手にして鍛えると防げる点は、予防接種に似ている。", "unverified": "効果の大きさの数値、対象のモデル名、集団の人数は抄録になく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "エージェント社会の予測が規則に従って反証される", "title": "How a Prediction Dies: A Challenge-Driven, Rule-Bound Self-Refutation in an LLM Agent Society", "url": "https://arxiv.org/abs/2611.28371", "authors": "Lei Zhenbing ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Zhenbing, L., & Chang, L. (2026). How a Prediction Dies: A Challenge-Driven, Rule-Bound Self-Refutation in an LLM Agent Society (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28371", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMエージェントの社会で登録された1つの予測が、異議を受けて判定基準を明確にし、最後に規則どおり反証されるまでの過程を記録した。", "p3": "すべての行動が公開の追記専用の台帳に残るプラットフォームAITRAPで、2026年10月19日に登録された主張を追った。3回の異議により、判定基準は固定のしきい値とゲートをもつ実行可能な手順へと4つの版を経た（抄録）。", "p5": "20以上の橋を含む最初の枠が届いたとき、支持は79のうち9（11.4%）で、著者は登録した条項に従って主張を取り下げた。較正のゲートは、著者自身の再計算の誤りも検出した（抄録）。", "fun": "「自分の予想が外れたら潔く認める」と前もって約束しても、いざ外れると言い訳をしたくなる。AIのエージェントたちが作る社会で、ある予想が仲間からの突っ込みで判定のルールを厳密にされ、データがそろった時点でルールどおり「外れ」と認められた。主張が約束どおりに終わること自体が信頼の証拠になる、という見方が面白い。", "unverified": "プラットフォームの規模、エージェントの数は抄録になく未確認。失敗の原因（誘因の変更）は著者も仮説としている。"}}, {"id": "pr28", "rank": 28, "headline": "メッシュの位相を事前知識に全場の過渡応答を予測", "title": "Topology-Prior-Guided Regional Latent Dynamics for Transient Structural Response Prediction", "url": "https://arxiv.org/abs/2611.30293", "authors": "Yuan Zhang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Zhang, Y., Nabian, M. A., Fu, S., Liu, Y., Chu, C., Tao, X., & Li, H. (2026). Topology-Prior-Guided Regional Latent Dynamics for Transient Structural Response Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30293", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "大規模な有限要素モデルの非線形な過渡応答の全場の時刻歴を、メッシュの位相を事前知識にした領域ごとの潜在変数で予測する代理モデルTPLDを提案した。", "p3": "メッシュの位相と工学的な知識に基づいて応答を領域の潜在変数に符号化し、1ステップ先の予測を補助課題にして、荷重条件つきの時空間Mambaモデルで潜在変数の軌跡を予測する。共有の復号器が全節点の応答を再構成する（抄録）。", "p5": "補剛パネルでは変位3成分の相対L2誤差が4.00%〜8.21%、約149万（1.49 million）節点の車両の衝突モデルでは1.41%〜12.22%だった。車体の衝突のベンチマークでは位置の誤差が0.620%で、最良の比較手法より30.7%小さい（抄録）。", "fun": "自動車の衝突をコンピュータで計算すると、100万を超える点の動きを細かい時間刻みで追うため、1回に長い時間がかかる。この研究は、車体を部品のまとまりごとに少数の数値で要約し、その数値の時間変化だけをAIに予測させ、最後に全体の形へ戻す。細かい地図を地域ごとの値にまとめてから予測し、あとで細かく戻すようなやり方だ。", "unverified": "計算時間の短縮の程度、訓練データの件数は抄録になく未確認。"}}, {"id": "pr29", "rank": 29, "headline": "ウェルチ法のスペクトルをARMA事前で縮小推定", "title": "Model-Averaged Shrinkage Estimation of the Spectral Density Using Welch's Method", "url": "https://arxiv.org/abs/2611.29781", "authors": "Carsten Botts", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Botts, C. (2026). Model-Averaged Shrinkage Estimation of the Spectral Density Using Welch's Method (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29781", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ウェルチ法によるスペクトル密度の推定値を、ARMAモデルに基づく推定へ縮小して安定させ、ARMAの次数の選択をモデル平均で避ける推定量を提案した。", "p3": "3層の階層モデルを使う。第1層で平滑化したウェルチ推定量を真のスペクトル密度を中心とする正規分布でモデル化し、第2層で真の値にARMA(p,q)に基づく正規の事前分布を置き、第3層でpとqに事前分布を置いて事後確率で重みづけて平均する（抄録）。", "p5": "推定量は一致性があり、計算が簡単で、他の推定量と同等か、しばしば上回る性能を示した（抄録）。", "fun": "振動や音のデータから「どの周波数の成分が強いか」を調べるとき、データを区切って平均するウェルチ法がよく使われるが、推定には誤差によるでこぼこが残る。この研究は、でこぼこのある推定を、単純な式で表した滑らかな曲線のほうへ少し引き寄せる。どの式を使うかは1つに決めず、もっともらしさに応じて混ぜ合わせる点が工夫だ。", "unverified": "比較した推定量と性能の数値、シミュレーションの条件は抄録になく未確認。"}}, {"id": "pr30", "rank": 30, "headline": "検出確率曲線を物理シミュレーション画像で求める", "title": "Model-Assisted Probability of Detection Studies for Image-Based Human Inspection", "url": "https://arxiv.org/abs/2611.30032", "authors": "Qizheng Xia ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Xia, Q., Meeker, W. Q., Gray, J. N., & Li, Q. (2026). Model-Assisted Probability of Detection Studies for Image-Based Human Inspection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30032", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "検査の信頼性を表す検出確率（POD）曲線を、実物の試験体の代わりに、物理シミュレーションで作った画像と人の検査員の判定から推定できることを示した。", "p3": "X線透過の模擬器XRSIMで、大きさ・形・位置を変えた亀裂を0〜3個含む溶接部の画像を作り、5人の検査員に無作為な順で2回ずつ判定させた。欠陥・検査員・その組み合わせ・検査回のばらつきを含む反復測定の二値回帰をベイズ推定した（抄録）。", "p5": "ばらつきの大部分は欠陥ごとの違いで、検査員の間にもかなりの差があった。母集団平均と検査員ごとのPOD曲線、その不確かさが得られた（抄録）。", "fun": "部品の傷を検査員が見つけられる確率は、傷の大きさや形で変わる。この関係を調べるには、本物の傷を入れた試験体をたくさん作る必要があり、費用がかさむ。この研究は、傷の入ったX線画像を計算で作り、それを検査員に見せて当たり外れを記録した。見つけやすさのばらつきは、検査員の差よりも傷そのものの違いによる部分が大きかった。", "unverified": "画像と欠陥の総数、POD曲線の具体的な値、実物の試験との比較は抄録になく未確認。"}}, {"id": "pr31", "rank": 31, "headline": "剛体要素の鎖で細長い構造の流体連成を高速に", "title": "The rigid finite element method for fast fluid–structure interaction of slender bodies in OpenFOAM", "url": "https://doi.org/10.21203/rs.3.rs-11579073/v1", "authors": "Artem Nuriev ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "Nuriev, A., Affane, B., & Pozdeeva, A. (2026). The rigid finite element method for fast fluid–structure interaction of slender bodies in OpenFOAM. https://doi.org/10.21203/rs.3.rs-11579073/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、登録された抄録を使用", "preprint": true, "short": true, "p1": "細長い柔軟な物体と流体の連成計算を、弾性ヒンジでつないだ剛体要素の鎖という簡単な構造モデルで、OpenFOAMの中だけで高速に行えるようにした。", "p3": "分布慣性をもつ剛体の区間を弾性ヒンジでつなぎ、固定端を適切に表すと、オイラー・ベルヌーイ梁の2次精度の離散化になり、大たわみでも2次精度が保たれることを示した。OpenFOAMの標準の多体ソルバに組み込み、Turek–Hronのベンチマークで検証した（抄録）。", "p5": "構造の試験でのたわみと振動数は参照解と最大1.6%の差で、連成のFSI2とFSI3の振動数の差は最大1.5%と0.2%だった。同程度の精度で、有限体積法の固体ソルバより3〜6倍速い（抄録）。", "fun": "流れの中で細い板がしなって揺れる様子を計算するには、流れと物体の変形を同時に解く必要があり、ふつうは別々のプログラムをつなぐ手間がかかる。この研究は、しなる板を「蝶番でつないだ硬い棒の列」に置き換えた。単純な置き換えなのに、正確な梁の式の近似として筋が通っていることを数学的に示した点が面白い。", "unverified": "要素数と精度の関係の詳細、3次元の問題への適用は抄録になく未確認。"}}, {"id": "pr32", "rank": 32, "headline": "粒状体の圧縮性は接触網のループ構造で決まる", "title": "Micro-topological and Micro-mechanical investigation of compressibility in polydisperse granular assemblies: a 2D DEM study", "url": "https://doi.org/10.21203/rs.3.rs-10731530/v1", "authors": "Rezig Ahlem ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "Ahlem, R., Mouloud, M., & Chacón, J. G. G. (2026). Micro-topological and Micro-mechanical investigation of compressibility in polydisperse granular assemblies: a 2D DEM study. https://doi.org/10.21203/rs.3.rs-10731530/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "粒状体の巨視的な圧縮性が、粒子どうしの接触がつくる網目のループ構造から決まることを、2次元の個別要素法の計算で示した。", "p3": "粒子間の摩擦係数と粒径分布を変えた等方圧縮の2次元DEM計算を行い、間隙比、力学的な配位数、力を受けない粒子の割合、接触ネットワークと力の連鎖を分析した（抄録）。", "p5": "摩擦が大きい、または粒径分布が狭いために初期に緩い詰まり方ほど、処女圧縮での圧縮性が大きかった。全体の間隙比は基本ループの位相に支配され、摩擦は局所の空隙を保つ大きなループを促す。広い粒径分布は充填を高めるが、局所的な不均質も生む（抄録）。", "fun": "砂のような粒の集まりを押すと、どれだけ縮むかは詰まり方で変わる。この研究は、粒と粒の接触点を線で結んだ網目を調べ、粒が輪のようにつながってできる「すき間を囲むループ」の大きさが、すき間の量を決めていることを見つけた。粒どうしが滑りにくいと大きな輪が残り、すき間が保たれる。", "unverified": "粒子数、摩擦係数と粒径分布の具体的な範囲、圧縮性の数値は抄録になく未確認。"}}, {"id": "pr33", "rank": 33, "headline": "粉体試験機のデジタルモデルでDEMを較正", "title": "Digital Models of Widely-Used Powder Characterisation Tools and their Application in DEM Calibration Part III: Packing and Flow Testers", "url": "https://arxiv.org/abs/2611.29117", "authors": "B. D. Jenkins ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Jenkins, B. D., Nicusan, A. L., Werner, D., Seville, J. P. K., Neveu, A., Lumay, G., Francqui, F., & Windows-Yule, C. R. K. (2026). Digital Models of Widely-Used Powder Characterisation Tools and their Application in DEM Calibration Part III: Packing and Flow Testers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29117", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "粉体の特性試験機2種をDEMの中に忠実に再現した公開のデジタルモデルを作り、DEMの接触パラメータの較正に使えることを示した。", "p3": "オリフィスからの流出を測るGranuFlowと、タップ密度を測るGranuPackのデジタルモデルを開発し、計算を効率化しつつ検証した。微結晶セルロースとイオン交換樹脂の2材料で較正の事例を示した（抄録）。", "p5": "較正したモデルは交差検証で実験とよく一致し、相対誤差はハウスナー比で0.57%（イオン交換樹脂）、ベバルーの当てはめパラメータで4.17%（微結晶セルロース）だった（抄録）。", "fun": "粉や粒の動きを粒1つずつ計算する方法では、粒どうしの摩擦などの数値を決めなければならないが、直接は測りにくい。そこで実際の試験機と同じものを計算機の中に作り、同じ試験をして結果が合うように数値を調整する。別の試験機で答え合わせをして合えば、その数値は信用できるという考え方だ。", "unverified": "較正したパラメータの種類と値、計算時間は抄録になく未確認。"}}, {"id": "pr34", "rank": 34, "headline": "テンソルトレインの逐次データから超縮約モデル", "title": "A Hyper-Reduced Reduced Order Model Built From Streaming Tensor Train Data", "url": "https://arxiv.org/abs/2611.29190", "authors": "Xiaoshan Wu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Wu, X., & Peng, Z. (2026). A Hyper-Reduced Reduced Order Model Built From Streaming Tensor Train Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29190", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "低ランクのソルバが逐次に出すテンソルトレイン形式のデータから、非線形の問題でも計算の速い超縮約つきの縮約モデルを作る方法を開発した。", "p3": "テンソルトレインの逐次的な低ランク圧縮と、入れ子型のテンソルトレイン離散経験的補間（TT-DEIM）を組み合わせ、非線形・非アフィンなパラメータ依存の偏微分方程式に対する超縮約を行う（抄録）。", "p5": "数値実験では、超縮約をしないTTガレルキン型の縮約モデルと同等の平均相対誤差を保ちながら、オンラインの計算が平均で約8倍から1500倍速くなった（抄録）。", "fun": "条件を少しずつ変えて同じ方程式を何度も解くとき、解の「よく現れる形」を少数覚えておけば、その組み合わせで速く答えを作れる。ただし式に非線形な関係が入ると、結局もとの大きさの計算が残ってしまう。この研究は、データを圧縮した形のまま、計算すべき点を少数に絞り込む工夫を加え、最大で約1500倍の高速化を得た。", "unverified": "対象とした方程式の種類、誤差の具体的な値は抄録になく未確認。"}}, {"id": "pr35", "rank": 35, "headline": "時空間DPG法に縮約基底を初めて結合", "title": "Model order reduction for space-time DPG approximations of the Schr\\\"odinger equation", "url": "https://arxiv.org/abs/2611.29685", "authors": "Timo Keith ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Keith, T., & Ohlberger, M. (2026). Model order reduction for space-time DPG approximations of the Schrödinger equation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.29685", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "時間と空間をまとめて離散化するDPG法を、ポテンシャルつきのシュレーディンガー方程式に拡張し、縮約基底法と初めて明示的に結合した。", "p3": "超弱形式の時空間の不連続ペトロフ・ガレルキン法を、有界で時間によらない実数値のポテンシャルに拡張して適切性を示し、ポテンシャルをパラメータ化して次元縮約と組み合わせた。DPG法に組み込まれた残差による誤差評価が、貪欲法による縮約基底の構成を導く（抄録）。", "p5": "パラメータによらない参照ノルムに関する一様な適切性を証明し、コルモゴロフN幅の指数的な減衰を得た。空間1次元の数値実験が理論を支持し、縮約モデルの精度と効率を示した（抄録）。", "fun": "時間とともに変化する現象は、ふつう時刻を少しずつ進めて計算する。これに対し、時間も空間の軸のように扱って全体を一度に解くやり方がある。この研究は、その方法に「誤差の大きさを自分で測れる」性質があることを利用して、条件を変えた計算を速くするための基底を、誤差が大きいところから順に選んで作った。", "unverified": "縮約の次元と誤差の具体的な数値、空間が高次元の場合への拡張は抄録になく未確認。"}}, {"id": "pr36", "rank": 36, "headline": "相関する複数出力の多項式カオスを少ない計算で", "title": "Correlation-aware sequential sampling for multi-output polynomial chaos expansions", "url": "https://arxiv.org/abs/2611.28877", "authors": "Qitian Lu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Lu, Q., Vořechovský, M., & Novák, L. (2026). Correlation-aware sequential sampling for multi-output polynomial chaos expansions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28877", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "互いに相関する複数の応答量をもつ問題で、多項式カオス展開の代理モデルを少ない計算回数で作るための、相関を考慮した逐次サンプリングの規準を提案した。", "p3": "出力ごとの情報を単純に合算すると、複数の出力に共通する応答のパターンが過大に効く。主成分分析に基づき、成分ごとの正規化と選んだ主方向の保持を組み合わせて、共通パターンの影響を調整しつつ距離に基づく探索を保つ（抄録）。", "p5": "出力の結合の強さが異なる数値例で、従来の多出力の規準や参照のサンプリングと比べ、出力間の依存を考慮すると新しい標本の配分が改善し、とくに相関の強い応答量で代理モデルの構築が効率化した（抄録）。", "fun": "1つの計算から複数の量を同時に知りたいとき、条件を変えて何度も計算するのは高くつくので、次にどの条件で計算するかを賢く選びたい。ところが複数の量が似た動きをすると、同じ情報を何重にも数えてしまい、選び方が偏る。この研究は、似た動きをまとめて数え直す工夫で、計算の無駄を減らした。", "unverified": "改善の大きさの数値、数値例の具体的な内容は抄録になく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "ソルバの出力に誤差保証の証明書を付けて検証", "title": "Verifying the Outputs of PDE Solvers: From Finite Elements to Neural Surrogates", "url": "https://arxiv.org/abs/2611.31211", "authors": "Konstantinos Dovelos", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Dovelos, K. (2026). Verifying the Outputs of PDE Solvers: From Finite Elements to Neural Surrogates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.31211", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "物理シミュレーションの出力に「証明書」を付けさせ、小さな独立の検査器が保証つきの誤差限界に変える方式で、誰も中身を確かめていないソルバの出力を検証できることを示した。", "p3": "証明書は許容されるポテンシャルと厳密に保存則を満たす流束からなる。同じ検査器を、別の有限要素ソルバ、誤りを入れたソルバ、LLMが書いたソルバ、縮約基底の係数を予測するニューラルネットなどに適用した（抄録）。", "p5": "もっともらしい5つの誤りは、どれも収束し格子収束の確認も通ったが、証明書はすべてを棄却または反証した。LLMが書いた3つのソルバのうち1つは正しく、0.1%まで保証された。訓練範囲の外では保証の幅が0.3〜25%に広がった（抄録）。", "fun": "計算プログラムは、間違っていても「それらしい答え」を出して計算が落ち着いてしまうことがある。細かさを変えて答えが変わらないかを見る定番の確認でも、それは見抜けなかった。この研究は、答えと一緒に「検算に使える材料」を提出させ、別の小さなプログラムが誤差の上限を計算する。AIが書いたプログラムの検査にも使える。", "unverified": "検証は特定の電場の問題で行われており、他の方程式への適用は抄録になく未確認。保証が意味をもつのは出力がエネルギーの意味で正確な場合に限られる。"}}, {"id": "pr38", "rank": 38, "headline": "LLMの与信判断に潜む代理変数の差別を診断", "title": "Explaining and Mitigating Proxy Fairness in LLM-based Credit Risk Decisions", "url": "https://doi.org/10.21203/rs.3.rs-11440110/v1", "authors": "Huyen Giang Thi Thu ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "Thu, H. G. T., Viet, T. D., Long, G. N., & Ban, H.-B. (2026). Explaining and Mitigating Proxy Fairness in LLM-based Credit Risk Decisions. https://doi.org/10.21203/rs.3.rs-11440110/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMを与信のスコアラーに使うとき、保護属性を外しても相関する特徴量を通じて残る差別を、問い合わせだけで診断し緩和する枠組みVAYNEを提案した。", "p3": "各特徴量について、保護属性との相互情報量（代理の能力）と、その特徴量を伏せたときのスコアの変化（代理の利用）を組み合わせて代理リスクの得点と経路のグラフを作り、遮蔽とフィルタリングの2つの介入を導く。3つのLLMと3つの与信データで評価した（抄録）。", "p5": "例示なしではLLMは偶然に近いが、少数の例示で従来の与信モデルの精度の範囲に入った。VAYNEに基づく介入は多くの比較で群間の格差が最小で、フィルタリングは精度をほとんど変えずに格差を大きく減らした（抄録）。", "fun": "お金を貸すかどうかの審査で性別を使ってはいけないとき、性別の欄を消せば済むように思える。けれども、性別と結びつきやすい別の項目が「身代わり」になって、同じ偏りを運んでしまう。この研究は、どの項目が身代わりになっているかを突き止め、その項目だけを処理することで、精度を保ったまま偏りを減らした。", "unverified": "格差の指標の具体的な値、使用したモデル名とデータ名は抄録になく未確認。"}}, {"id": "pr39", "rank": 39, "headline": "ESG開示の注釈を複数エージェントの合意で信頼づけ", "title": "TRAE: Trustworthy Automated ESG Annotation via Multi-Agent Consensus and Confidence Assessment", "url": "https://arxiv.org/abs/2611.30035", "authors": "Jaeyoung Lee ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Lee, J., & Kim, M. (2026). TRAE: Trustworthy Automated ESG Annotation via Multi-Agent Consensus and Confidence Assessment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30035", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ESG情報の抽出用データの注釈を、複数のエージェントの一致・確信度・推論の整合から信頼性を評価しながら自動で行う枠組みTRAEを提案した。", "p3": "LLMに直接注釈させるのではなく、構造化された多段の推論を複数のエージェントに行わせ、その一致度などから注釈の信頼性をモデル化する。不確かな標本だけを専門家に回す、人とAIの混成の注釈にも対応する（抄録）。", "p5": "既存の自動注釈の方法より注釈の性能が向上した。この方法で、推論の過程と中間出力、信頼性の情報を備えた約20,000件のESGデータセットを構築し、コードとデータを公開した（抄録）。", "fun": "企業の報告書から環境や社会への取り組みの記述を拾い出すAIを作るには、まず人が大量の文に正解のラベルを付ける必要があり、手間がかかる。この研究は、複数のAIに別々に判断させ、意見がそろって自信も高いものはそのまま採用し、あやしいものだけ専門家に見てもらう。迷う問題だけ先生に聞く、というやり方だ。", "unverified": "性能向上の具体的な数値、エージェントの数と使用したモデル、専門家に回した割合は抄録になく未確認。"}}, {"id": "pr40", "rank": 40, "headline": "閉域網の金融データ仮名化をローカルLLMで支援", "title": "PseuDRAGON: Knowledge-Guided Local LLMs for Financial-Data Pseudonymization in Closed Networks", "url": "https://arxiv.org/abs/2611.30353", "authors": "Gwangui Hong ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Hong, G., An, S., Lim, S., Lim, K. T., & Kim, M.-S. (2026). PseuDRAGON: Knowledge-Guided Local LLMs for Financial-Data Pseudonymization in Closed Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30353", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "閉じたネットワークの中で金融データを仮名化する担当者の作業を、確定した判断を再利用する仕組みとローカルの言語モデルで支援する方法を示した。", "p3": "省略された列名の解釈、個人情報の判定、処理方法の選択について、確認済みの判断と訂正を固定したモデルの外に保存し、名前の完全一致の検索と学習した規則で再利用する。専門家の確認では、機関の方針、国内の個人情報保護法、国際的な資料の順に検索する（抄録）。", "p5": "1機関の92列で、規則により再利用できたラベルは75から83に増え、再利用の誤りはなかった。3回の対の実行で、履歴を優先する基準は自動の判定時間を平均83.0%減らした（抄録）。", "fun": "金融のデータを分析に使う前には、個人が分かる情報を別の記号に置き換える。列の名前が略語だらけだと、どれが個人情報かを見分けるだけで手間がかかる。この研究は、外部につながらない場所で動くAIに手伝わせつつ、AIが同じ入力に違う答えを出さないよう、人が一度決めた判断を辞書のように残して使い回す。", "unverified": "使用した言語モデル、機関の種類、仮名化の方法の内訳は抄録になく未確認。1機関の92列での検証である。"}}, {"id": "pr41", "rank": 41, "headline": "仕事の快と意味で働き手を4類型に分ける", "title": "Pleasure and Meaning: Mapping Profiles of Job-Related Well-Being in the UK", "url": "https://doi.org/10.21203/rs.3.rs-11677803/v1", "authors": "Ying Zhou ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "Zhou, Y., Davies, R., Felstead, A., Gallie, D., Green, F., & Henseke, G. (2026). Pleasure and Meaning: Mapping Profiles of Job-Related Well-Being in the UK. https://doi.org/10.21203/rs.3.rs-11677803/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "仕事のwell-beingを「快」と「意味」の2軸で捉え、英国の働き手を4つの型に分けて、それぞれの仕事の質の強みと弱みを示した。", "p3": "2024年の英国の技能・雇用調査のデータから、快と意味の高低の組み合わせによる4つのプロファイルを同定し、仕事の質と個人の成果を比べた（抄録）。", "p5": "両方が高い型が34%、どちらも低い型が10%、快は高いが意味は低い型が31%、意味は高いが快は低い型が25%だった。どちらも低い型が最も不利で、意味だけが高い型は技能の活用と裁量が高い一方、仕事の強度とストレスも高い（抄録）。", "fun": "「いい仕事」とは楽しい仕事だろうか、やりがいのある仕事だろうか。英国の調査では、楽しいがやりがいは薄い人と、やりがいはあるが楽しくはない人が、それぞれ全体の3割前後を占めた。後者は腕を振るえる代わりに忙しくストレスも大きい。両方そろった人でも、技能のわりに収入が低い傾向があり、すべてに恵まれた型はなかった。", "unverified": "標本の人数、プロファイルの同定の統計手法、収入の不利の大きさは抄録になく未確認。"}}, {"id": "pr42", "rank": 42, "headline": "生成AIの模擬ユーザの系譜と妥当性を批判的に検討", "title": "The user who is not there: genealogy and critique of simulated users built with generative AI in UX testing", "url": "https://arxiv.org/abs/2611.30674", "authors": "Jos\\'e Carlos Arcoverde", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Arcoverde, J. C. (2026). The user who is not there: genealogy and critique of simulated users built with generative AI in UX testing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30674", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIで作った「模擬ユーザ」でユーザビリティ試験から人を外すという約束を、研究がどう理解しているかを、系譜をたどって批判的に検討した。", "p3": "批判的な文献レビューと、1980年代の認知モデルから現在の生成エージェントまで模擬ユーザをたどる系譜的な読解を組み合わせた。レビュー自体にLLMを研究補助として使ったことも報告している（抄録）。", "p5": "利用者なしの試験はHCIの古くからの目標で、費用が正当化の理由だった。妥当性の基準は予測の精度からもっともらしさへ移り、精度に立ち返った最近の研究の結果は弱い。模擬の参加者は、参加を権利とみなす方法と衝突する（抄録）。", "fun": "新しいアプリを作ったら、人に使ってもらって使いにくい点を探す。これをAIが演じる「架空の利用者」で済ませようという動きがある。この論文は、同じ夢が1980年代からあったことを掘り起こした。昔は「人の行動をどれだけ正確に当てられるか」が問われたのに、今は「それらしく見えるか」に基準が移っている、という指摘が鋭い。", "unverified": "レビューした文献の件数、「結果が弱い」とされた研究の具体的な数値は抄録になく未確認。"}}, {"id": "pr43", "rank": 43, "headline": "LLM審査員は基準の衝突を黙って多数決で埋める", "title": "When Rubrics Do Not Decide: Silent Value Completion in LLM Evaluation", "url": "https://arxiv.org/abs/2611.28940", "authors": "Zhuangzhuang Pan ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Pan, Z., Xia, Y., Lei, K., & Chan, C. S. (2026). When Rubrics Do Not Decide: Silent Value Completion in LLM Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28940", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "複数の基準で採点するLLMの審査役が、基準どうしがぶつかる場合の決め方を示されないまま勝者を決めてしまう「沈黙の価値補完」を取り出して測るベンチマークを作った。", "p3": "TradeoffBenchは、規則の実行と回答の採点を切り分ける。基準ごとの点数を確定させたうえで、優越や同点の統制と、基準が衝突する1,345件での判定を調べ、人の評価との一致も監査した（抄録）。", "p5": "推論なしの公開重みの6つの審査役は統制をすべて通過したが、衝突の9%〜81%で根拠のない勝者を選んだ。順序によらず安定した577件の選択はすべて、明示的に禁じた多数決の規則に従っていた。推論を有効にすると違反は9,720件中2件に減ったが、省かれたトレードオフは埋められなかった（抄録）。", "fun": "作文を複数の観点で採点し、ある観点ではAが上、別の観点ではBが上だったら、どちらが勝ちだろうか。それは観点の重みをどう決めるかによる。ところがAIの審査役は、重みを教えられていなくても黙って勝者を決めてしまい、調べると「勝っている観点が多いほう」を選んでいた。決め方の前提を明かさずに判定する危うさを示している。", "unverified": "審査役のモデルの内訳、人の評価との一致の監査の手順の詳細は抄録になく未確認。"}}, {"id": "pr44", "rank": 44, "headline": "LLMは追試の成否を要旨だけで当てる", "title": "Large language models predict which studies replicate by pattern recognition", "url": "https://doi.org/10.31222/osf.io/dntmq", "authors": "Bradley C. Love", "venue": "MetaArXiv", "date": "2026-11-24", "apa": "Love, B. C. (2026). Large language models predict which studies replicate by pattern recognition. https://doi.org/10.31222/osf.io/dntmq", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "MetaArXivの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "訓練していないLLMが、論文の要旨・検証された主張・元の結果から、その研究が追試で再現されるかを専門家の集団並みに順位づけられることを示した。", "p3": "SCOREの追試プロジェクトの資料を使い、LLMに再現の見込みを予測させた。トークンの確率から判断を読み出す方法と、言葉で答えさせる方法、推論させる方法を比べた（抄録）。", "p5": "検出力の高い57件の追試で、AUCは0.838（95%信頼区間0.723〜0.932）で、典型的な個々の専門家を有意に上回り、専門家の集団と少なくとも同等だった。確率からの読み出しが言葉での回答より良く、推論させると数値的に悪化した（抄録）。", "fun": "発表された研究結果が正しいかは、別の人がやり直して確かめる「追試」で分かるが、時間もお金もかかるので、ほとんどの研究は確かめられないままだ。この研究では、AIが要旨などを読んだだけで、追試が成功しそうかをかなり当てた。しかも、じっくり考えさせるより、印象を確率として取り出すほうが当たったという。", "unverified": "使用したモデル名、専門家との比較の具体的な数値は抄録になく未確認。57件という小さな標本での結果である。"}}, {"id": "pr45", "rank": 45, "headline": "抑うつ尺度の測定不変性を29か国で事前登録検証", "title": "Do Women and Men, and Albanians and Kosovars, Answer Depression Items the Same Way? A Preregistered Measurement Invariance Study of the European Social Survey CES-D", "url": "https://doi.org/10.5281/zenodo.24468181", "authors": "Brahimaj, Gerald", "venue": "Zenodo", "date": "2026-11-23", "apa": "Brahimaj, G. (2026). Do Women and Men, and Albanians and Kosovars, Answer Depression Items the Same Way? A Preregistered Measurement Invariance Study of the European Social Survey CES-D. Zenodo. https://doi.org/10.5281/ZENODO.24468181", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明文（DataCite）を使用。原稿のPDFは読んでいない", "preprint": true, "short": true, "p1": "欧州社会調査の7項目の抑うつ尺度（CES-D）が、性別や国によって同じ意味で測れているか（測定不変性）を、事前登録した二次分析で検定した。", "p3": "欧州社会調査の第6回（29か国、50,922人）を使い、アルバニアとコソボの国内の性別間、両国の間、29か国の間で測定不変性を検定する。推定器と検証・分析のスクリプトは事前登録の一部である（登録の説明）。", "p5": "結果の数値は、入手できた登録の説明文には書かれておらず未確認。原稿、事前登録した結果の全体、探索的な結果とスクリプトが公開されている（登録の説明）。", "fun": "「気分が落ち込んだ」という質問に同じ点数をつけた2人が、同じ程度に落ち込んでいるとは限らない。国や性別で質問の受け取り方が違えば、点数を比べること自体が成り立たない。この研究は、29か国・50,922人のデータで、抑うつの質問が集団をまたいで同じものを測れているかを、分析の手順を先に登録したうえで確かめている。", "unverified": "測定不変性が成り立ったかどうかの結果、適合度の数値は、入手できた登録の説明文になく未確認。"}}, {"id": "pr46", "rank": 46, "headline": "希少疾患の介護者の生活の質とオンライン支援", "title": "Quality of Life Among U.S. Rare Disease Caregivers: Associations with Care Recipient Characteristics and Online Support Resources", "url": "https://doi.org/10.21203/rs.3.rs-10679508/v1", "authors": "Ching-Hsuan Lin ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "apa": "Lin, C.-H., Yabumoto, M., Short, M. I., Halley, M. C., & Lavelle, T. A. (2026). Quality of Life Among U.S. Rare Disease Caregivers: Associations with Care Recipient Characteristics and Online Support Resources. https://doi.org/10.21203/rs.3.rs-10679508/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の希少疾患の家族介護者の生活の質を測り、オンラインの支援資源の利用とは関連せず、介護の相手の状態と関連することを示した。", "p3": "希少疾患のFacebookグループを通じて募集した介護者へのオンライン調査で、CarerQol-7Dと視覚的アナログ尺度で生活の質を測った。オンライン支援資源の潜在因子を探索的因子分析で抽出し、ベータ回帰で関連を調べた（抄録）。", "p5": "207人の平均はCarerQol-7Dが73.6、視覚的アナログ尺度が6.9だった。オンライン資源の利用は得点と有意に関連せず、障害のある人や超希少疾患の人の介護は、それぞれ5.5点と6.2点の低下と関連した（抄録）。", "fun": "珍しい病気の家族を世話する人は、同じ立場の人が身近におらず、ネット上の交流や情報交換の場が頼りになりそうに思える。ところがこの調査では、そうした場の利用と生活の質の間に、はっきりした関係は見られなかった。関係していたのは世話の相手の状態で、ネットの支えだけでは埋められない負担があることを示している。", "unverified": "募集がFacebookグループ経由であることによる偏りの程度、因果の向きは抄録からは判断できない。"}}, {"id": "pr47", "rank": 47, "headline": "停電の責任が評価に残る：フリーランスの評判被害", "title": "Who Gets Blamed for the Blackout? A Critical Incident Analysis of Clients, Reputation Systems, and Online Freelancers", "url": "https://arxiv.org/abs/2611.28365", "authors": "Naim Bin Hasan ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Hasan, N. B., & Hasan, F. B. (2026). Who Gets Blamed for the Blackout? A Critical Incident Analysis of Clients, Reputation Systems, and Online Freelancers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28365", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "停電や通信障害といった、働き手には制御できないインフラの故障が、オンラインの仕事の仲介サイトで評判の恒久的な減点に変わる仕組みを明らかにした。", "p3": "バングラデシュのオンラインのフリーランス30人への面接から得た149件の出来事を、クリティカル・インシデント法で分析した。2024年7月の全国的な通信遮断の経験も含む（抄録）。", "p5": "多くの故障は長引く害なしに吸収された。恒久的な減点になった21件のうち17件は依頼者を経由していた。故障が見えない依頼者が沈黙を「当てにならない」と解釈し、評判の仕組みがその判断を文脈なしに保存する。働き手は4つの修復の方略で対応した（抄録）。", "fun": "返信が遅い、納期に遅れた。そうした記録は、ネットで仕事を請け負う人の「信用の点数」として残り続ける。でも遅れた理由が停電だったら、それは本人の落ち度だろうか。この研究は、理由が見えない依頼者が低い評価をつけ、仕組みが事情抜きでそれを記録するという二段階の取り違えを、当事者の話から描き出した。", "unverified": "方略ごとの件数、都市部と地方の差の大きさは抄録になく未確認。30人の面接に基づく質的な研究である。"}}, {"id": "pr48", "rank": 48, "headline": "老朽インフラの更新に災害リスクを組み込む比較", "title": "Renewal as Risk Reduction: A Comparative Framework for Integrating Hazard Exposure into the Renewal of Ageing Infrastructure in Switzerland and the United States", "url": "https://doi.org/10.20944/preprints202611.2348.v1", "authors": "Fridon Zarharyan", "venue": "Preprints.org", "date": "2026-11-24", "apa": "Zarharyan, F. (2026). Renewal as Risk Reduction: A Comparative Framework for Integrating Hazard Exposure into the Renewal of Ageing Infrastructure in Switzerland and the United States. https://doi.org/10.20944/preprints202611.2348.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "老朽化した道路や橋を更新するとき、地すべりや土石流などへの曝露の変化をどう考慮しているかを、スイスと米国で比較し、更新を災害リスク低減の機会にする枠組みを提案した。", "p3": "OpenAlexのPRISMAに沿った検索に、両国の機関の資料と引用の探索を加え、2003〜2026年の50資料を5つの次元で符号化した構造化された比較レビューである（抄録）。", "p5": "スイスは明示的にリスクに基づく国家戦略と既存構造物の規格群（SIA 269）で運用し、米国は状態に基づく資産管理と事象を契機にした対応に頼る。どちらも、損傷のない資産の更新時に曝露の再評価を求める統一的な手続きはない。4要素の枠組みと5段階の選別手順を提案した（抄録）。", "fun": "20世紀の後半に造られた山あいの道路や橋が、造り替えの時期を迎えている。その間に、土砂災害や洪水にさらされる度合いも変わってきている。ところが、壊れていない構造物を造り替えるときに「今の危険」を調べ直す決まりは、スイスにも米国にもなかった。造り替えを、安全性を見直す機会にしようという提案だ。", "unverified": "提案した枠組みの実証的な検証はこれからで、効果は未確認。50資料の内訳も抄録にはない。"}}, {"id": "pr49", "rank": 49, "headline": "文書に基づくAIの都市ペルソナで都市の性格を測る", "title": "Can Cities Have Personalities? Introducing the SCD City Personality Assessment", "url": "https://arxiv.org/abs/2611.30733", "authors": "Andrei Khurshudov", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Khurshudov, A. (2026). Can Cities Have Personalities? Introducing the SCD City Personality Assessment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30733", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "都市ごとに文書を根拠にした対話エージェント（都市のペルソナ）を作り、同じ24項目の質問で「都市の性格」を測って比較できるようにする方法を提案した。", "p3": "都市ごとに文書に基づくChatGPTのエージェントを設定し、性格検査の4対の構造に着想を得た24項目の質問を行う。東京・ニューヨーク・パリで、反復、3つの推論の設定、別の文書に替えた場合を含む33回の評価で方法を検証した（抄録）。", "p5": "東京の元の文書では、同じ設定の中での項目の完全一致が85.4%だった。上海・ドバイ・ムンバイ・ラゴス・サンパウロへの適用（15回）では、設定をまたいだ完全一致が77.8%、1点以内の一致が99.4%だった。文書を替えると一部の次元の強さが変わった（抄録）。", "fun": "都市を人の性格にたとえることはよくあるが、たいていは印象論だ。この研究は、都市についての文書を読ませたAIにその都市を「演じさせ」、性格診断のような質問に答えさせた。同じ都市でも読ませる文書を替えると答えが変わるので、都市の印象が「どの資料で語られるか」に左右されることも見えてくる。", "unverified": "4つの次元の具体的な内容、文書の選び方、人による評価との比較は抄録になく未確認。モデル内部の解釈は観察できないと著者も述べている。"}}, {"id": "pr50", "rank": 50, "headline": "高速道路の点検を検知から補修判断まで連鎖で評価", "title": "HighwayVerse: A Chain-of-Inspection Benchmark for Highway Infrastructure Anomaly Understanding", "url": "https://arxiv.org/abs/2611.28800", "authors": "Junyi Yang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "apa": "Yang, J., Si, Z., Zhai, Y., Ouyang, P., Wang, H., Li, K., Chen, M., Zhang, S., Wang, H., Wu, D., Chen, D., & Xu, M. (2026). HighwayVerse: A Chain-of-Inspection Benchmark for Highway Infrastructure Anomaly Understanding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.28800", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "高速道路の施設の点検を、異常の検知から認識、状態の分析、補修の決定まで順に正しく行えるかで、マルチモーダルLLMを評価するベンチマークHighwayVerseを作った。", "p3": "舗装・防護柵・防眩板・排水施設などを対象に、地上とドローンの実際の点検記録14,143件と、専門家が確認した84,858組の質問と回答を集めた。前の段階がすべて正しいときだけ補修の決定を正解とする連鎖の指標で、12のモデルを評価した（抄録）。", "p5": "モデルは異常の有無の最初の判断では比較的高い精度を示したが、連鎖の指標は大幅に低く、認識・分析・決定でつまずいた。訓練なしの検索拡張の枠組みLaneRAGは、さまざまなモデルで一貫して成績を改善した（抄録）。", "fun": "道路の点検は「何かおかしい」と気づくだけでは終わらない。それが何の異常で、どの程度悪く、どう直すかまで決めて初めて役に立つ。この研究は、AIに一連の判断を通しでやらせ、途中で間違えたら不正解とする厳しい採点をした。すると「異常がある」とは言えても、その先で崩れるAIが多かった。", "unverified": "各モデルの具体的な得点、LaneRAGによる改善の幅は抄録になく未確認。データとコードは公開予定とされている。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headl
