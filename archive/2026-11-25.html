hapatra, S. (2026). Crisis or opportunity? Reviewing the dynamics of intellectual capital, financial distress and earnings management practices in emerging economies. Asian Review of Accounting, 1–26. https://doi.org/10.1108/ara-09-2025-0298", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr15", "rank": 15, "headline": "診察の会話技能をLLMが人の評価者並みに注釈", "title": "Automated annotation of verbal communication skills in objective structured clinical examinations using a retrieval-augmented large language model: a pilot comparison against human coders", "url": "https://doi.org/10.3389/fmed.2026.2017024", "authors": "Tuba Mutluer ほか", "venue": "Frontiers in Medicine", "date": "2026-11-24", "sjr": 0.952, "citescore": 5.4, "citescore_year": "2025", "apa": "Mutluer, T., Tiryaki, E., Bekhan, M., Konakçı, B., Kukul, D., Usta, M. B., & Erzin, E. (2026). Automated annotation of verbal communication skills in objective structured clinical examinations using a retrieval-augmented large language model: a pilot comparison against human coders. Frontiers in Medicine, 13. https://doi.org/10.3389/fmed.2026.2017024", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr16", "rank": 16, "headline": "圧電インピーダンス信号のセンサ差を物理で補う", "title": "Physics-Guided Deep Learning of Electromechanical Admittance Signals for Flexural Damage Assessment of RC Structures Using Enhanced Graph Attention Networks", "url": "https://doi.org/10.3390/buildings16234701", "authors": "Demi Ai ほか", "venue": "Buildings", "date": "2026-11-24", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Ai, D., Yang, K., Li, H., & Zhu, H. (2026). Physics-Guided Deep Learning of Electromechanical Admittance Signals for Flexural Damage Assessment of RC Structures Using Enhanced Graph Attention Networks. Buildings, 16(23), 4701. https://doi.org/10.3390/buildings16234701", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "圧電センサの電気機械アドミタンス信号から鉄筋コンクリート梁の載荷・損傷の状態を識別する際に、センサの条件の違いによる基準のゆらぎを、物理に基づくデータ拡張で補う方法を示した。", "p3": "アドミタンスの特徴マップをCNNで処理して潜在ノードにし、グラフ注意ネットワークでノード間の大域的な関係を学習して載荷状態を分類する。センサの特性のずれ、接着条件、測定誤差を模擬するデータ拡張を行う（抄録）。", "p5": "23の載荷条件で、69本の実測曲線から13,800件の記録を生成した。固定したテストでの正解率は51.48±1.92%、Macro-F1は0.454±0.024だった。入力をそろえた比較ではTransformerと同程度だった（抄録）。", "fun": "コンクリートの梁に取り付けた圧電素子の電気的な応答は、梁の状態に応じて変わる。これでひび割れなどを見つけたいが、センサの取り付け方の違いでも信号が変わってしまう。この研究は、そうした「センサ側の違い」を物理の知識で人工的に作り出して学習させた。正解率は51.48%と控えめで、23通りの状態を見分ける難しさを正直に示している。", "unverified": "取得できた抄録は末尾が途中で切れている。他の試験体やセンサ配置への汎化は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "組織の回復力は従業員を介して顧客行動に届く", "title": "Organizational resilience and sustainable purchase behavior: a multi-level analysis of employee–consumer engagement with environmental initiatives", "url": "https://doi.org/10.1108/josm-03-2026-0204", "authors": "Omar Mohammed Ali Ababneh ほか", "venue": "Journal of Service Management", "date": "2026-11-24", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Ababneh, O. M. A., Al-Marri, S. R., & Al-Halbadi, S. M. (2026). Organizational resilience and sustainable purchase behavior: a multi-level analysis of employee–consumer engagement with environmental initiatives. Journal of Service Management, 1–24. https://doi.org/10.1108/josm-03-2026-0204", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "サービス組織のレジリエンスが、従業員のエンゲージメントと顧客のエンゲージメントを順に介して、顧客の持続可能な購買行動に結びつくことを多層のデータで示した。", "p3": "ホテル52施設、従業員847人、顧客1,203人の多源・時差つきのデータで、調整つきの逐次媒介モデルを検証した。顧客の環境への価値観、価格への敏感さ、主観的規範を間接経路の調整変数とした（抄録）。", "p5": "レジリエンスから従業員エンゲージメント、顧客エンゲージメント、持続可能な行動へという連鎖が確認された。顧客の環境への価値観と主観的規範は連鎖を強め、価格への敏感さは弱めた（抄録）。", "fun": "困難から立ち直る力のあるホテルは、客に環境に配慮した選択をしてもらいやすいのか。一見つながりの薄い話だが、この研究は間をつなぐ経路を示した。組織の力が従業員の熱心さを高め、その熱心さが客の関わりを引き出す。ただし値段に敏感な客には、この連鎖は届きにくかった。", "unverified": "効果の大きさの数値、調査を行った国、測定尺度の詳細は抄録になく未確認。"}}, {"id": "jr18", "rank": 18, "headline": "生成AIのCSR発信は透明性と人の監督で信頼", "title": "Employee Trust in Generative Artificial Intelligence–Enabled Corporate Social Responsibility Communication: Transparency, Human Oversight and Authenticity", "url": "https://doi.org/10.1002/csr.71180", "authors": "Mali Zhang ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-24", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Zhang, M., Agarwal, V., Alzeiby, E. A., Di Vaio, A., & Papa, A. (2026). Employee Trust in Generative Artificial Intelligence–Enabled Corporate Social Responsibility Communication: Transparency, Human Oversight and Authenticity. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71180", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "生成AIを使ったCSRの発信について、AI利用の開示の透明性と人による監督の知覚が、従業員の信頼と関連することを示した。", "p3": "ステークホルダー理論・シグナリング理論・信頼理論を統合した枠組みで、Prolificを通じたオンライン調査の330人の回答をPLS-SEMで分析した。エンパワメントの知覚とCSRの真正性の知覚を媒介変数とした（抄録）。", "p5": "開示の透明性と人による監督の知覚は、どちらも信頼と正の関連を示した。透明性はエンパワメントの知覚を介して、人による監督は真正性の知覚を介して、それぞれ間接的にも信頼と関連した（抄録）。", "fun": "会社が社会貢献についての発信に生成AIを使っていたら、社員はそれを信じるだろうか。この調査では、AIを使っていることを隠さずに示すこと、そして人がきちんと監督していると感じられることが、信頼と結びついていた。前者は「自分たちにも力がある」という感覚を、後者は「本物らしさ」を通じて関連するという、別々の道筋が見つかった。", "unverified": "関連の大きさの数値、回答者の国と業種は抄録になく未確認。調査による関連の分析であり、因果は示していない。"}}, {"id": "jr19", "rank": 19, "headline": "LLMゲームエージェントの設計を統一的に整理", "title": "A Survey on Large Language Model-Based Game Agents", "url": "https://doi.org/10.1145/3863973", "authors": "Sihao Hu ほか", "venue": "ACM Computing Surveys", "date": "2026-11-24", "sjr": 5.985, "citescore": 65.2, "citescore_year": "2025", "apa": "Hu, S., Huang, T., Liu, G., Kompella, R., Ilhan, F., Tekin, S., Xu, Y., Zachary, Y., & Liu, L. (2026). A Survey on Large Language Model-Based Game Agents. ACM Computing Surveys. https://doi.org/10.1145/3863973", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "LLMを使ったゲームエージェントの研究を、統一的な参照アーキテクチャのもとで整理した総説である。", "p3": "単体のエージェントは記憶・推論・知覚と行動のインタフェースの3要素で、複数のエージェントは通信の規約と組織のモデルによる協調・役割分化・大規模な社会的ふるまいで整理する。6つの主要なゲームのジャンルを、求められる能力と結びつける分類も示す（抄録）。", "p5": "総説のため新しい実験結果はない。行動ゲームでの低遅延の応答から、サンドボックス型の世界での開かれた目標形成まで、ジャンルごとの要件を整理している（抄録）。", "fun": "ゲームの世界は、現実の複雑さの多くの面をまねた、統制のきく実験場だ。言葉を理解するAIにゲームをさせると、覚える、考える、見て動くという力が試される。複数のAIを一緒に動かすと、役割を分けたり協調したりする社会的なふるまいが現れる。この総説は、ゲームの種類ごとにAIに何が求められるかを地図のように整理している。", "unverified": "取り上げた論文の件数、個々の手法の成績は抄録になく未確認。"}}, {"id": "jr20", "rank": 20, "headline": "自閉スペクトラムの旅行者の包摂は継ぎ目で崩れる", "title": "Accessible air travel for neurodivergent travellers: governing inclusion through the Protocol Vulnerability Framework", "url": "https://doi.org/10.1108/tr-04-2026-0537", "authors": "Francesca Avallone ほか", "venue": "Tourism Review", "date": "2026-11-24", "sjr": 2.279, "citescore": 18.8, "citescore_year": "2025", "apa": "Avallone, F., Bagna, G., Mattias, G., & Satta, A. (2026). Accessible air travel for neurodivergent travellers: governing inclusion through the Protocol Vulnerability Framework. Tourism Review, 1–20. https://doi.org/10.1108/tr-04-2026-0537", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "自閉スペクトラムの人の空の旅で、配慮や包摂がなぜ当てにならないのかを、空港・航空会社・委託先の間の「手順の脆弱性」として説明する枠組みを作った。", "p3": "複数の資料による質的な設計で、8人への面接、公開のSNSの旅行記60件、約40,000件から選んだSkytraxの口コミ19件、2018〜2024年の報道・機関の記事307件を、旅程の出来事にそろえて、認識・リズム・選択の同等・連続性の4条件で符号化した（抄録）。", "p5": "4条件が旅程の同じ段階でそろうと包摂は保たれる。同じ段階で2つの失敗が重なると崩れやすく、保安検査での認識×リズム、搭乗での選択の同等×リズム、到着での連続性×リズムがとくに起こりやすい（抄録）。", "fun": "空港や航空会社には、配慮が必要な人のための目に見える取り組みがある。それなのに、当事者の旅はしばしばうまくいかない。この研究は、問題が個々の取り組みの不足というより、組織と組織の「引き継ぎの継ぎ目」にあることを示した。旅の同じ場面で2種類の失敗が重なると、包摂は崩れやすい。", "unverified": "資料に代表性はなく、頻度の主張はできないと著者が述べている。取得できた抄録は末尾が途中で切れている。"}}, {"id": "jr21", "rank": 21, "headline": "AI利用の購買相談を意味検索で拾う精度を監査", "title": "Auditing Anchor-Based Semantic Retrieval for AI-Assisted Consumer-Decision Discourse: A ChatGPT-Centered Reddit Pilot", "url": "https://doi.org/10.3390/make8120398", "authors": "Anupong Sukprasert ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-11-24", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "apa": "Sukprasert, A., Phothong, L., Charpavang, C., Krokaew, Y., & Iamchum, W. (2026). Auditing Anchor-Based Semantic Retrieval for AI-Assisted Consumer-Decision Discourse: A ChatGPT-Centered Reddit Pilot. Machine Learning and Knowledge Extraction, 8(12), 398. https://doi.org/10.3390/make8120398", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "AIを買い物の意思決定に使ったという語りを、AI製品についての議論から意味検索で区別して拾えるかを、人の評価で監査した予備研究である。", "p3": "2026年7月15日の1回の取得で、AI関連の3つのRedditコミュニティから80,635件のコメントを得た。固定した埋め込みモデル（all-MiniLM-L6-v2）のゲートが対象47,364件のうち9971件を残し、3人の評価者が300件を盲検で評価した（抄録）。", "p5": "評価者の完全一致は82.0%（Fleissのκ=0.744）だった。人の多数決のラベルに対し、ゲートのF1は0.647、マシューズ相関係数は0.425で、偽陽性46件、偽陰性36件だった（抄録）。", "fun": "「AIに相談して買う物を決めた」という体験談を、ネットの大量の書き込みから集めたい。言葉の意味の近さで自動的に拾う方法があるが、本当に目当ての書き込みを拾えているかは、人が読んで確かめるしかない。この研究は300件を3人で読み比べ、自動の選別は人の確認の優先順位づけに使うのが妥当だと結論した。地味だが大事な検算だ。", "unverified": "1回の取得に基づく予備研究であり、消費者がAIをどれだけ使うかの頻度は推定できないと著者が述べている。"}}, {"id": "jr22", "rank": 22, "headline": "同居人が多いほど大腿骨骨折後に自宅へ退院できる", "title": "Household Context Is Associated With Home Discharge Beyond Baseline Function After Hip Fracture Rehabilitation: A Multicenter Cohort Study.", "url": "https://doi.org/10.1177/07334648261512088", "authors": "Yoshimura Y ほか", "venue": "Journal of applied gerontology : the official journal of the Southern Gerontological Society", "date": "2026-11-23", "sjr": 0.939, "citescore": 5.2, "citescore_year": "2025", "apa": "Yoshimura, Y., Hikuma, M., Matsumoto, A., Akasaki, S., Yoneda, K., Kuzuhara, A., & Iwasaka, M. (2026). Household Context Is Associated With Home Discharge Beyond Baseline Function After Hip Fracture Rehabilitation: A Multicenter Cohort Study. Journal of Applied Gerontology. https://doi.org/10.1177/07334648261512088", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "大腿骨骨折のリハビリ後に自宅へ退院できるかどうかに、同居人の数が、本人の機能とは独立に関連することを示した。", "p3": "多施設の後ろ向きコホートで、段階的に変数を加えるロジスティック回帰と入れ子のモデルにより、基準時の機能などに加えて同居人数の寄与を評価した。入院前に自宅で暮らしていた患者のうち、欠測のない687例（平均年齢83.9歳、女性79.5%）を分析した（抄録）。", "p5": "同居人が1人増えるごとに自宅退院のオッズが高かった（オッズ比1.42、95%信頼区間1.17〜1.72）。運動・認知機能、栄養リスク、握力とは独立だった。同居人数を加えると判別は.774から.787へ小幅に向上した（抄録）。", "fun": "骨折して入院した高齢者が、退院して家に戻れるかどうか。それを決めるのは体の回復だけではない。この研究では、一緒に暮らす人が1人多いごとに、家に戻れる見込みが高くなっていた。体の機能が同じでも、である。家に支える人がいるかどうかが退院先を左右し、人数という単純な数字がその目安になる。", "unverified": "実施された国と施設の詳細、同居人の続柄や介護の内容は抄録になく未確認。"}}, {"id": "jr23", "rank": 23, "headline": "気候開示の質は組織の能力で差がつく", "title": "Organisational Capacity and Climate Disclosure Quality: A Comparative Study of Australian Banks", "url": "https://doi.org/10.1002/csr.71203", "authors": "Kazi Atique Moula Nabil", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-24", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Nabil, K. A. M. (2026). Organisational Capacity and Climate Disclosure Quality: A Comparative Study of Australian Banks. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71203", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "同じ規制のもとでも金融機関の気候関連の開示の質が異なる理由を、組織の能力の制約から説明する枠組みを提案した。", "p3": "豪州のクイーンズランド銀行とナショナル・オーストラリア銀行の2025年のサステナビリティ報告書を、TCFD・ISSB・PCAF・GRIに基づく12次元の枠組みで内容分析し、開示の深さの指標にまとめた。さらに3行を加えて業界の水準に広げた（抄録）。", "p5": "前者は12次元のうち5次元で完全な開示（非開示が5次元）、後者は9次元で完全な開示（非開示なし）だった。不足は、特定の組織的な基盤を要する技術的に難しい次元に集中した。結果は能力による説明と整合するが、他の説明も残る（抄録）。", "fun": "同じルールで気候変動への対応を報告するよう求められても、銀行によって報告の中身の濃さは違う。この研究は、専用の体制が必要な技術的に難しい項目ほど、開示が欠けやすいことを示した。ルールをそろえれば最低限は上がるが、能力までは上がらない。宿題の出し方より、解く力の支援が要るという指摘だ。", "unverified": "追加の3行の結果の詳細、指標の採点基準は抄録になく未確認。少数の事例の比較である。"}}, {"id": "jr24", "rank": 24, "headline": "フランスの熱波警報で85歳以上の死亡が3.7%減", "title": "Effectiveness of France’s Heat–Health Warning System on Mortality: A Nationwide Quasi-Experimental Study", "url": "https://doi.org/10.1021/ehp.6c00466", "authors": "Hicham Achebak ほか", "venue": "Environmental Health Perspectives", "date": "2026-11-24", "sjr": 2.746, "citescore": 17.7, "citescore_year": "2025", "apa": "Achebak, H., Benmarhnia, T., Vanoli, J., Vicedo-Cabrera, A. M., & Gasparrini, A. (2026). Effectiveness of France’s Heat–Health Warning System on Mortality: A Nationwide Quasi-Experimental Study. Environmental Health Perspectives. https://doi.org/10.1021/ehp.6c00466", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "フランスの全国の熱波警報の発令日には死亡が少なく、とくに85歳以上で減少が大きいことを、準実験の設計で示した。", "p3": "2004〜2022年の夏の全96県について、警報が出た日の死亡への効果を、対応をとった症例対照型の準実験で評価した（抄録）。", "p5": "警報の日は、ほとんどの性・年齢の群で全死因の死亡が少なかった。85歳以上では死亡が3.70%低かった（95%信頼区間−5.94%〜−1.40%）。警報が続けて出る場合には関連が弱まった（抄録）。", "fun": "2003年のヨーロッパの熱波のあと、フランスは全国に熱波の警報の仕組みを作った。警報が出ると、弱い立場の人を守る予防の行動が地域でとられる。では本当に命は救われているのか。2004〜2022年のデータで調べると、警報の日には85歳以上の死亡が3.70%少なかった。ただし警報が続けて出ると関連は弱まっていた。", "unverified": "対照の日の選び方の詳細、死亡数の絶対値は抄録になく未確認。観察データに基づく推定である。"}}, {"id": "jr25", "rank": 25, "headline": "小児病院の共用空間の評価が病院全体の評価に結びつく", "title": "Perceived Quality of Pediatric Hospital Public Spaces and Caregivers’ Global Hospital Appraisal", "url": "https://doi.org/10.3390/buildings16234687", "authors": "Jinghao Wang ほか", "venue": "Buildings", "date": "2026-11-24", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Wang, J., Ou, W., Ji, Z., & Luo, W. (2026). Perceived Quality of Pediatric Hospital Public Spaces and Caregivers’ Global Hospital Appraisal. Buildings, 16(23), 4687. https://doi.org/10.3390/buildings16234687", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "小児病院の共用空間に対する付き添い者の評価が、病院全体の評価と結びついていることを、2つのキャンパスの調査で示した。", "p3": "7〜18歳の子の付き添い者225人への横断的な利用後評価で、29の環境項目の構造、キャンパス間の差、共変量を調整した3項目の総合評価との関連を分析した（抄録）。", "p5": "4つの領域はすべて総合評価と正の関連を示した（R2=0.491）。多重性の補正後にキャンパス間で差があったのは機能的な配置だけで、調整後の得点は一方が5段階で0.602点高かった（抄録）。", "fun": "病院の良し悪しは、治療の内容だけで決まるのだろうか。子どもに付き添う人にとっては、受付や支払いの場所、庭、診察の場所といった空間の使い勝手も、病院全体の印象に関わる。この調査では、空間の評価の4つの領域のどれもが、病院の総合評価と結びついていた。建物の使い勝手も、病院というサービスの一部だ。", "unverified": "4つの領域の名称のすべて、調査が行われた国は抄録になく未確認。横断調査であり因果は示していない。"}}, {"id": "jr26", "rank": 26, "headline": "道路の安全監査と交通シミュレーションを重みで統合", "title": "Towards Sustainable Road Infrastructure Planning: Expert-Based Criterion Weights for an Integrated Road Safety Audit and Traffic Microsimulation Framework", "url": "https://doi.org/10.3390/su182311929", "authors": "Vilma Jasiūnienė ほか", "venue": "Sustainability", "date": "2026-11-24", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "apa": "Jasiūnienė, V., Donauskienė, I., & Grigonis, V. (2026). Towards Sustainable Road Infrastructure Planning: Expert-Based Criterion Weights for an Integrated Road Safety Audit and Traffic Microsimulation Framework. Sustainability, 18(23), 11929. https://doi.org/10.3390/su182311929", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "道路の設計案を評価するために、安全監査の基準と交通シミュレーションの指標を1つの重みつきの評価にまとめる際の、専門家に基づく重みを導出した。", "p3": "道路インフラの専門家10人が、安全の6基準と交通性能の6指標の2群に重要度を配分し、群内で順位をつけた。順位を正規化した重みに変換し、ケンドールの一致係数で専門家の一致を検定した（抄録）。", "p5": "安全の基準が全体の60%、交通性能が40%の重みを得た。最終の重みは歩行者と自転車の安全（0.146）、交差点と出入りの安全（0.123）、平均の車両遅れ（0.114）が高かった。一致は交通性能で強く（W=0.899）、安全で中程度（W=0.377）だった（抄録）。", "fun": "道路の設計案を比べるとき、「安全かどうか」と「交通がうまく流れるか」は別々の方法で調べられる。両方を1つの点数にまとめるには、どちらをどれだけ重く見るかを決めなければならない。専門家10人に聞くと、安全が60%、交通性能が40%という配分になった。面白いのは、交通性能の指標では意見がよくそろうのに、安全の基準では一致が中程度だったことだ。", "unverified": "専門家の選び方と所属、実際の設計案への適用例は抄録になく未確認。10人の判断に基づく。"}}, {"id": "jr27", "rank": 27, "headline": "行政の電子化でも人の裁量は消えない", "title": "Discretion and Transparency in the Digitalising State: Geographies of Decision‐Making in a Mexican Municipality", "url": "https://doi.org/10.1111/tran.70112", "authors": "Ayona Datta", "venue": "Transactions of the Institute of British Geographers", "date": "2026-11-24", "sjr": 1.706, "citescore": 7.9, "citescore_year": "2025", "apa": "Datta, A. (2026). Discretion and Transparency in the Digitalising State: Geographies of Decision‐Making in a Mexican Municipality. Transactions of the Institute of British Geographers, 51(4). https://doi.org/10.1111/tran.70112", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "行政の電子化で人の裁量をなくそうとしても、裁量は消えず、むしろ電子化そのものを支えていることを、メキシコの市役所の事例から示した。", "p3": "グアダラハラ市の職員と民間のコンサルタントへの詳細な面接から、20年にわたるデジタルの業務への移行、自動化、アルゴリズムによる統治で裁量をなくす試みを分析した（抄録）。", "p5": "裁量は技術の遺産、資源、情報システムの限界の中で働き、統治の層の間に摩擦を生む。アルゴリズムを導入しても裁量はなくならず、技術は人の決定を正当化する道具になる。アルゴリズムが誤った結果を出したときの修復には、人の裁量が鍵になる（抄録）。", "fun": "役所の担当者の裁量は、この論文の舞台では汚職の言い換えのように見られている。そこで手続きを技術に任せ、裁量を設計の段階でなくそうとする。ところが現場を調べると、電子化を進めるための判断や、アルゴリズムが間違えたときの手直しは、結局人がやっていた。裁量は透明性の失敗ではなく、仕組みを回すのに欠かせない働きだという見方が面白い。", "unverified": "面接の人数と時期、具体的なシステムの内容は抄録になく未確認。1つの市の事例である。"}}, {"id": "jr28", "rank": 28, "headline": "インドネシアの「スマートな集落」構想を読み解く", "title": "Aspiring to be dense in Indonesia’s smart kampungs", "url": "https://doi.org/10.1177/00420980261507009", "authors": "Orlando Woods", "venue": "Urban Studies", "date": "2026-11-24", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Woods, O. (2026). Aspiring to be dense in Indonesia’s smart kampungs. Urban Studies. https://doi.org/10.1177/00420980261507009", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "インドネシアの農業地帯で進む「スマートな集落（カンプン）」の構想を通じて、ネットワークでつながることが「密度」として都市の未来像に動員される様子を論じた。", "p3": "都市間の政策・知識の移転のネットワークと、スマートシティのデジタル基盤という都市内のネットワークの両方に着目し、バニュワンギ県のスマート・カンプンを事例に検討した（抄録）。", "p5": "100スマートシティ運動やASEANスマートシティ・ネットワークは、都市の進歩を示すためにスマートシティの数を積み上げようとする。主に農地に広がる集落は都市開発の末端に位置づけられ、密度は、ネットワーク上の需要やインフラへの願望を生み出す役割を果たす（抄録）。", "fun": "「スマートシティ」と聞くと大都市を思い浮かべるが、インドネシアでは農地の広がる地域の集落までが「スマート」を名乗る。建物も人もまばらに広がる場所で、どうして都市らしさを語れるのか。この論文は、ネットワークでつながっていること自体が、地理的な密集とは別の種類の「密度」として扱われていると読み解く。", "unverified": "現地調査の方法と資料の種類は抄録になく未確認。概念的な考察が中心である。"}}, {"id": "jr29", "rank": 29, "headline": "認知症ケアを看護の負担軽減の政策として捉える", "title": "Cognitive Health and Dementia Care as Nursing Well‐Being Policy: Data Linkage, Artificial Intelligence and Illustrative Insights from Japan", "url": "https://doi.org/10.1111/inr.70270", "authors": "Kazumi Kubota ほか", "venue": "International Nursing Review", "date": "2026-11-24", "sjr": 1.461, "citescore": 6.5, "citescore_year": "2025", "apa": "Kubota, K., & Fujihara, S. (2026). Cognitive Health and Dementia Care as Nursing Well‐Being Policy: Data Linkage, Artificial Intelligence and Illustrative Insights from Japan. International Nursing Review, 73(4). https://doi.org/10.1111/inr.70270", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "認知症ケアと認知機能の健康への取り組みを、看護職のwell-beingを支える政策として捉え直し、負担を減らす政策手段を整理した。", "p3": "実証データを使わない政策分析で、2014年1月から2026年5月の看護・保健の文献の検索に、国際的な資料と日本の政策資料の検索、引用の探索を加えた、対象を絞った物語的な証拠の統合に基づく。日本を例示の文脈とした（抄録）。", "p5": "予防と情報の継続性は避けられる負担を減らしうるが、AIは評価を要する補助にとどまる。政策手段として、教育、ケアの時間の確保、連携、デジタルの統治、安全文化を挙げる（抄録）。", "fun": "認知症のケアは、ふつう臨床や高齢化の政策として語られる。この論文は視点を変え、ケアをする看護職の側から見た。行動面の危機、ばらばらの情報、繰り返しの記録、家族の苦悩は、仕事量や離職、心の負担に関わる。予防や情報の引き継ぎを整えることは、看護職を守る政策でもあるという捉え方だ。", "unverified": "実証研究ではなく政策分析であり、提案の効果は検証されていない。取得できた抄録は末尾が途中で切れている。"}}, {"id": "jr30", "rank": 30, "headline": "低重力・真空での粒状体への沈み込みを測る装置", "title": "An experimental setup to study sinkage into granular materials in vacuum and reduced-gravity conditions", "url": "https://doi.org/10.1063/5.0346444", "authors": "A. Duchêne ほか", "venue": "Review of Scientific Instruments", "date": "2026-11-24", "sjr": 0.422, "citescore": 3.0, "citescore_year": "2025", "apa": "Duchêne, A., Bigot, J., Stankiewicz, M., Dghais, S., Robin, C., Wilhelm, A., Kollmer, J. E., Mimoun, D., & Murdoch, N. (2026). An experimental setup to study sinkage into granular materials in vacuum and reduced-gravity conditions. Review of Scientific Instruments, 97(11). https://doi.org/10.1063/5.0346444", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "真空と低重力の条件で、球が粒状体にどれだけ沈み込むかを測る実験装置SILOEを開発し、気圧が沈み込みに強く影響することを示した。", "p3": "ブレーメンの落下塔の中で、真空と低重力の条件下で球状の物体を粒状体に衝突させ、最終的な貫入の深さをレーザーの形状計測で測る。カメラを予備の計測に使う（抄録）。", "p5": "粒径120 μmのガラスビーズへの非常に低速の衝突では、重力（月・火星・地球）は沈み込みに影響しなかったが、気圧は強く影響した。真空（40〜280 Pa）では、大気圧に比べて最終の貫入の深さが2倍を超えた（抄録）。", "fun": "月や火星のような天体の表面は、細かい粒の層で覆われている。そこに物が載ると、どれくらい沈むのだろうか。重力が違えば沈み方も違いそうに思えるが、この実験では重力の違いは影響せず、影響したのは気圧だった。真空では、ガラスの粒への沈み込みが2倍を超えた。空気の有無がこれほど効くのは意外だ。", "unverified": "衝突の速度、球の大きさと材質、試行の回数は抄録になく未確認。1種類のガラスビーズでの結果である。"}}, {"id": "jr31", "rank": 31, "headline": "常時微動から位相つきの地盤応答関数を推定", "title": "Estimation of Broadband Complex Site Response Functions from Seismic Noise for the Generation of Virtual Seismograms", "url": "https://doi.org/10.1785/0120260150", "authors": "Rouhollah Amiri Fard ほか", "venue": "Bulletin of the Seismological Society of America", "date": "2026-11-24", "sjr": 1.151, "citescore": 6.0, "citescore_year": "2025", "apa": "Amiri Fard, R., Parolai, S., Panzera, F., & Romanelli, F. (2026). Estimation of Broadband Complex Site Response Functions from Seismic Noise for the Generation of Virtual Seismograms. Bulletin of the Seismological Society of America. https://doi.org/10.1785/0120260150", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "常時微動の記録から、振幅だけでなく位相と成分間の連成を含む広帯域の地盤応答関数を推定し、それを使って仮想の地震波形を作れることを示した。", "p3": "標準スペクトル比の枠組みを拡張し、高周波の地盤応答を捉えるための橋渡しの観測点と、成分間の連成を求める逆解析を導入した。ギリシャ・ケファロニア島の盆地の臨時観測網の、10日間の微動と40個の地震の記録を0.5〜10 Hzで解析した（抄録）。", "p5": "得られた応答関数は非対角成分がゼロでなく、連成の重要性を示した。基準点の地震記録と畳み込んで作った仮想の波形は、対象の地点の観測と、波形・スペクトル・位相の到達でよく一致した（抄録）。", "fun": "同じ地震でも、場所の地盤によって揺れの大きさや長さが大きく変わる。この「地盤の影響」は、ふつう揺れの大きさの倍率としてだけ推定される。この研究は、地面のわずかな常時の揺れ（微動）から、大きさに加えて位相や成分どうしの絡み合いまで推定した。それを基準の地点の地震記録に掛け合わせると、別の地点の波形を作り出せる。", "unverified": "適合度の具体的な数値は抄録になく未確認。取得できた抄録は末尾が途中で切れている。"}}, {"id": "jr32", "rank": 32, "headline": "出力のみで時変構造の瞬時振動数を推定", "title": "Output-only instantaneous frequency estimation of time-varying structures using a novel variational synchrosqueezing transform", "url": "https://doi.org/10.1016/j.engstruct.2026.124125", "authors": "Yu-Zu Li ほか", "venue": "Engineering Structures", "date": "2026-11-24", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Li, Y.-Z., & Fang, S.-E. (2027). Output-only instantaneous frequency estimation of time-varying structures using a novel variational synchrosqueezing transform. Engineering Structures, 372, 124125. https://doi.org/10.1016/j.engstruct.2026.124125", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、入力を測らず応答だけから、特性が時間とともに変わる構造物の瞬時振動数を推定する方法を、新しい変分型のシンクロスクイージング変換を用いて提案する論文である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物の振動数は、ふつう変わらない値として測る。けれども、状態が刻々と変わる構造物では振動数そのものが時間とともに動く。動く振動数を、加わった力を知らないまま応答の記録だけから追いかけるには、時間と周波数の両方を細かく見分ける必要がある。題名から読み取れるのは、その難しい課題に新しい変換で挑むという問いである。", "unverified": "抄録・本文を入手できず、手法の詳細、検証に使ったデータ、結果はすべて未確認。"}}, {"id": "jr33", "rank": 33, "headline": "AEと生成モデルでコンクリート構造を長期監視", "title": "Acoustic emission-based structural health monitoring of concrete structures using a Normality-Informed GAN with long-term in-service validation", "url": "https://doi.org/10.1007/s13349-026-01185-z", "authors": "Tuan-Khai Nguyen ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-24", "sjr": 1.005, "citescore": 8.0, "citescore_year": "2025", "apa": "Nguyen, T.-K., Ahmad, Z., Nguyen, D.-T., & Kim, J.-M. (2026). Acoustic emission-based structural health monitoring of concrete structures using a Normality-Informed GAN with long-term in-service validation. Journal of Civil Structural Health Monitoring, 17(1). https://doi.org/10.1007/s13349-026-01185-z", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、コンクリート構造物のアコースティック・エミッション（AE）に基づく構造ヘルスモニタリングに、正常状態の情報を取り込んだ敵対的生成ネットワーク（GAN）を用い、長期の供用中のデータで検証した論文である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "材料の内部で微小な破壊が起きると、弾性波（AE）が出る。これを拾えば異常に気づけるが、実際の構造物では異常時のデータはなかなか手に入らない。背景：そのため、正常なときの特徴を学ばせ、そこから外れたものを異常とみなす考え方がある。題名から読み取れるのは、それを長期間の実際の供用で確かめるという問いである。", "unverified": "抄録・本文を入手できず、手法の詳細、対象の構造物、検証の期間と結果はすべて未確認。"}}, {"id": "jr34", "rank": 34, "headline": "腐食疲労を受ける高力ボルト継手の信頼性と点検計画", "title": "Physics-informed reliability assessment and reliability-informed inspection planning of corrosion-fatigue high-strength bolted connections using explainable machine learning", "url": "https://doi.org/10.1016/j.istruc.2026.113469", "authors": "Van-Tien Phan ほか", "venue": "Structures", "date": "2026-11-24", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Phan, V.-T., Nguyen, D.-D., Ho, V.-C., & Nguyen, T.-H. (2026). Physics-informed reliability assessment and reliability-informed inspection planning of corrosion-fatigue high-strength bolted connections using explainable machine learning. Structures, 94, 113469. https://doi.org/10.1016/j.istruc.2026.113469", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、腐食と疲労を受ける高力ボルト継手について、物理の知識を取り込んだ信頼性評価と、その信頼性に基づく点検計画を、説明可能な機械学習を使って行う論文である。", "p3"  "2026-11-24", "sjr": 1.328, "citescore": 7.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、中国で、地域の物的な資源と社会的な資源の「不一致」に注目し、資源の水準よりも組み合わせ（構成）が高齢者の機能面の加齢と関係することを論じる論文である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "地域の資源には、物的なものと社会的なものがある。一方は充実しているのにもう一方が乏しい地域では、年をとることへの影響はどうなるのか。資源が多いか少ないかという水準より、2種類の組み合わせ方が大事なのではないか、というのが題名から読み取れる問いである。", "unverified": "抄録・本文を入手できず、使用したデータ、資源の測り方、結果はすべて未確認。"}}, {"id": "jr47", "rank": 47, "headline": "交通インフラと都市形態の因果的な証拠を総説", "title": "Transport infrastructure and urban form: a review of causal evidence", "url": "https://doi.org/10.1016/j.ecotra.2026.100475", "authors": "Hugo E. Silva ほか", "venue": "Economics of Transportation", "date": "2026-11-24", "sjr": 0.692, "citescore": 3.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、交通インフラが都市の形（都市形態）に与える影響について、因果関係に関する実証的な証拠を集めて整理した総説である。新しい個別の実証分析ではなく、既存の研究のまとめにあたる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "交通が整備されると街の形が変わる、とよく言われる。背景：けれども、発展しそうな場所にこそ交通が整備されることもあるので、どちらが原因でどちらが結果かを見分けるのは難しい。原因と結果を区別できる方法で調べた研究を集めると、交通インフラは都市の形をどう変えると言えるのか。それが題名から読み取れる問いである。", "unverified": "抄録・本文を入手できず、取り上げた研究の範囲と件数、結論はすべて未確認。"}}, {"id": "jr48", "rank": 48, "headline": "監査上の主要な検討事項への対応を文章から測る", "title": "The impact of auditor responses to critical audit matters on audit effort: a textual analysis approach", "url": "https://doi.org/10.1057/s41310-026-00427-2", "authors": "Kam Chan ほか", "venue": "International Journal of Disclosure and Governance", "date": "2026-11-24", "sjr": 0.646, "citescore": 5.4, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、監査上の主要な検討事項（CAM）に対する監査人の対応が監査の を入手できず、同定の方法、実験や現場の検証、結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経営学", "headline": "グーグルは出資先アプリを自社市場で優遇か", "title": "Gatekeepers and Kingmakers: Do Superplatforms Distort Digital Competition?", "url": "https://doi.org/10.1287/mnsc.2025.03354", "authors": "Umit G. Gurun ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "グーグルが市場の門番（Android）と戦略的な投資家（Google Ventures）を兼ねることの影響を、iOS版を対照にした差分の差分で調べた。出資を受けたスタートアップのAndroid版は、大きな更新がないのにレビュー数が115%多く、評価が12%高く、不具合の苦情が77%少なかった。選択的なレビューの削除とプラットフォーム上での推奨と整合し、プラットフォームの中立性に疑問を投げかける。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "固定資産税の増税で持ち家層は借りずに消費を切る", "title": "Taxing Homeowners Who Can't or Won't Borrow", "url": "https://doi.org/10.1093/restud/rdag127", "authors": "Francis Wong", "venue": "The Review of Economic Studies", "date": "2026-11-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "米国の数百万人の持ち家層の高頻度の行政データから、住宅価格の上昇に伴う固定資産税の増税への反応を調べた。転居しない人は消費を減らし、財務的な困窮を示すが、上がった住宅価値を担保に借りない。消費の反応は流動性によらず、困窮は流動性の乏しい層に集中する。増税は転居も促す。税の厚生費用の中心は財務困窮にあり、流動性の乏しい世帯の税を抑える政策の利得を示す。"}, {"id": "jn03", "rank": 3, "field": "情報システム", "headline": "AIの思考過程の表示は難問ほど誤った信頼も生む", "title": "Understanding the Prompting Effects of Chain-of-Thought on Human Collaboration with Generative AI", "url": "https://doi.org/10.1287/isre.2024.1314", "authors": "Xusen Cheng ほか", "venue": "Information Systems Research", "date": "2026-11-24", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "why": "生成AIの推論過程（Chain-of-Thought）を画面に示すことが、利用者の能力への信頼にどう影響するかを一連のオンライン実験で調べた。質の高い推論は難易度によらず信頼を高める。質の低い推論は、易しい課題で利用者が注意深く処理したときだけ信頼を下げ、難しい課題では透明性の知覚を通じてかえって信頼を高めた。推論の表示が誤答への過信につながる条件を示す。"}, {"id": "jn04", "rank": 4, "field": "因果推論", "headline": "潜在変数を説明変数に使う偏りを分割標本で補正", "title": "Correcting Bias When Using Latent Regressors", "url": "https://doi.org/10.1017/pan.2026.10068", "authors": "Connor Jerzak ほか", "venue": "Political Analysis", "date": "2026-11-24", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "why": "測定誤差のある潜在変数を回帰の説明変数に使うと、係数がゼロ方向に偏る。操作変数や合成法といった広く使われる補正は、潜在変数に適用するとそれ自体が偏り、誤差を無視した単純な回帰より悪いことも多いと示した。分割標本による相関に基づく補正を導出し、加法得点・因子・機械学習のどの測定とも組み合わせられる。応用では補正後の関係が最大50%強くなった。"}, {"id": "jn05", "rank": 5, "field": "因果推論", "headline": "分類器の性能評価は小さなテスト集合では当てにならない", "title": "Uncertain Performance: How to Quantify Uncertainty and Draw Test Sets When Evaluating Classifiers", "url": "https://doi.org/10.1017/pan.2026.10065", "authors": "Francisco Tomas-Valiente", "venue": "Political Analysis", "date": "2026-11-24", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "why": "社会科学では分類器で概念を測ることが増えたが、通常の大きさのテスト集合では性能指標の推定が非常に不安定で、まれなクラスを扱う不均衡な課題ではほとんど情報がないことを示した。性能指標の標本分布に基づく不確実性の定量化と、予測確率で層別する効率的な抽出を提案し、シミュレーションと実データで検討した。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "プラットフォームが売り手に渡す顧客情報の最適設計", "title": "Platform Information Design and Competitive Price Targeting", "url": "https://doi.org/10.1287/mksc.2023.0518", "authors": "Ruiqi Wu ほか", "venue": "Marketing Science", "date": "2026-11-24", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "why": "プラットフォームが個々の消費者の情報を売り手に与えると標的価格が可能になるが、市場を分割して競争を激しくもする。Steamの購買・利用の詳細データから異質な需要を推定し、均衡の標的価格モデルであらゆる情報設計の反実仮想を計算した。均衡への影響を織り込んだ利潤最大の設計は、それを無視した需要ベースの経験則より大幅に利潤が高い。"}, {"id": "jn07", "rank": 7, "field": "人口学", "headline": "大卒の市長はコロナ第1波の超過死亡を減らした", "title": "The Demographic Impact of Leadership: Mayoral Education and COVID‐19 Excess Mortality in Italy", "url": "https://doi.org/10.1111/padr.70096", "authors": "Francesco Mattioli ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "イタリアの週次の死亡統計から市町村別の超過死亡をベイズ階層の時空間モデルで推定し、接戦の市長選挙を使う回帰不連続デザインで市長の学歴の効果を識別した。大卒の市長は第1波の超過死亡を減らしたが、第2波では差がなかった。政策活動とSNS発信の大規模データは、迅速で的を絞った対応と、あおらない指針型の発信という2つの経路を示唆する。"}, {"id": "jn08", "rank": 8, "field": "人口学", "headline": "子の教育を伸ばすと親の健康格差が縮む", "title": "Reducing Health Inequality by Increasing Children's Education: A Two‐Generation Mediation Approach and Evidence from the United States", "url": "https://doi.org/10.1111/padr.70100", "authors": "Liying Luo ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "成人した子の教育が高齢の親の健康に影響するなら、子の教育を高めることは親の健康格差を広げるのか縮めるのか。米国の健康・退職調査の縦断データに多層の周辺構造モデルを当て、因果の推定対象を明確にして答えた。教育年数12年未満の親の健康上の不利は14〜37%減り、大卒の親の有利は変わらない。世代をまたぐ教育の向上が健康格差の縮小策になりうることを示す。"}, {"id": "jn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "取引の開示強化で企業集団は海外子会社を増やす", "title": "Coming Clean on Hidden Ties: How Transparency in Related‐Party Transactions Shapes Business Group Internal Organization", "url": "https://doi.org/10.1111/joms.70191", "authors": "Marina Gama ほか", "venue": "Journal of Management Studies", "date": "2026-11-24", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "2008年のブラジルの関連当事者取引の開示改革を自然実験として、上場・非上場の企業集団のデータで分析した。透明性が高まると、ピラミッド型の企業集団は上層の構造を組み替える一方、流出の対象になりやすい活動を開示規制の弱い国へ移すため海外の関連会社を増やした。開示改革は不透明さを消すのではなく、階層と地理の両面で組織の適応を引き起こす。"}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "フィンテックの融資はデータで未開拓市場から広がる", "title": "Fintech Expansion", "url": "https://doi.org/10.1093/rfs/hhag101", "authors": "Jing Huang", "venue": "The Review of Financial Studies", "date": "2026-11-23", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "データから学習しプラットフォーム上の売上を差し押さえられるフィンテックの貸し手と、物的担保に頼る銀行が競争する信用市場を理論的に分析した。情報取得が柔軟でも、均衡でのフィンテックの学習は単一のしきい値で質の低い借り手を除く粗いものになる。執行力の向上は銀行の利潤を損ない、情報技術の向上は利する。銀行のない市場での初期のデータが、より豊かな市場への拡大を支える。"}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "公正なふるまいで疲れる上司と楽になる上司の違い", "title": "Does following justice rules feel constraining or liberating for leaders? The moderating role of justice sensitivity", "url": "https://doi.org/10.1177/00187267261499914", "authors": "Mingyun Huai ほか", "venue": "Human Relations", "date": "2026-11-24", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "公正の規則に従うことが上司自身に与える心理的な帰結を、シナリオ実験（316人）と日誌法（上司52人・411観測）で調べた。公正への感受性が低い上司は、規則に従うと統制を失った感覚が強まり情緒的消耗が増える。感受性が高い上司は逆に統制を失った感覚が弱まり消耗が減る。組織的公正を、受け手ではなく実行する上司の側から捉え直した。"}, {"id": "jn12", "rank": 12, "field": "オペレーションズ・リサーチ", "headline": "在庫効率を上げると上流の排出はむしろ増える", "title": "Inventory Productivity and Carbon Emissions in Retailing", "url": "https://doi.org/10.1287/msom.2025.0660", "authors": "Nikolay Osadchiy", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-24", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "在庫の生産性が高いほど炭素排出が少ないという通念を、CDPの詳細な排出データと小売企業の財務データで検証した。排出削減の大半は事業規模に伴って生じる。規模を除くと、在庫生産性への外生的なショックは、スコープ3の購入した財・サービスを中心に排出原単位を高めた。効果は食品・医薬品以外の小売に集中する。リーン化の利益と上流の排出のトレードオフを示す。"}, {"id": "jn13", "rank": 13, "field": "オペレーションズ・リサーチ", "headline": "板情報の操作が最適になる条件を導き実データで確認", "title": "Spoofing and Manipulating Order Books with Learning Algorithms", "url": "https://doi.org/10.1287/opre.2025.1889", "authors": "Alvaro Cartea ほか", "venue": "Operations Research", "date": "2026-11-24", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "指値注文板の動学モデルから、マーケットメイカーにとって板を操作することが最適になる条件を導いた。在庫リスクへの許容度が高いほど操作的な戦略が最適になる頻度が上がり、操作は在庫を最適水準へ戻し往復取引の成立確率を上げる。見せ玉は、操作の注文が約定しないことを望む特殊例にあたる。ナスダックの高頻度データで、操作の条件が成り立つことを確かめた。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "管理職の人事への自信は中くらいが最も実行に効く", "title": "Confident and Well‐Connected: The Interplay of Line Managers' HR Self‐Efficacy, Brokerage, and HRM Implementation", "url": "https://doi.org/10.1002/hrm.70112", "authors": "Budy Purnawanto ほか", "venue": "Human Resource Management", "date": "2026-11-24", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "why": "現場の管理職による人事施策の実行を、人事に関する自己効力感と、人事の助言ネットワークでの仲介的な位置から説明した。インドネシア6社の管理職88人、部下325人、上司69人の多源データの多層分析で、自己効力感と実行の関係は逆U字で、中程度が最も良い。仲介の位置がこの曲線の形を調整し、実行はチームの成果と結びつく。"}, {"id": "jn15", "rank": 15, "field": "オペレーションズ・リサーチ", "headline": "ミールキットの過剰包装を文脈つきの学習で減らす", "title": "How Not to Overpackage: AI for Sustainability in HelloFresh’s Service Supply Chain", "url": "https://doi.org/10.1287/msom.2025.0640", "authors": "Evelyn Xiao-Yue Gong ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-24", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "食材宅配の箱ごとの保冷材の量と種類を、天候・輸送条件・中身などの文脈から逐次に選ぶ問題を定式化し、問題の構造を使うオンライン学習法CFPEを開発した。既存の方法では得られないÕ(√T)のリグレット上界を持つ。HelloFreshの実際の配送データによる数値実験で、文脈に合う包装構成を速く見つけることを確かめた。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "市場参加者の集中は流動性を上げ情報効率を下げる", "title": "CHILE", "url": "https://doi.org/10.1093/rfs/hhag100", "authors": "Efstathios Avdis ほか", "venue": "The Review of Financial Studies", "date": "2026-11-20", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "非対称情報・一般的な効用関数・任意のペイオフを許す資産価格の枠組みCHILEを提示した。経済が大きくなっても情報の総量が有限にとどまる、連続で異質な情報構造が特徴である。規模の異なる参加者の存在（集中）が市場の質に与える影響を分析し、集中の高まりは流動性を高めるが情報効率を損なうという両面性を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "非対称情報のもとで、一般的な効用関数と任意のペイオフを扱える資産価格の枠組みCHILEを提示し、市場参加者の集中が市場の質に与える影響を分析した。", "p3": "連続で異質な情報をもつ大きな経済を考える。経済が大きくなっても情報の総量が有限にとどまることが、この情報構造の決定的な特徴である（抄録）。", "p5": "規模の異なる参加者が存在するという意味での集中の高まりは、流動性を高めるが情報効率を損なう、という両刃の結果を得た（抄録）。", "fun": "市場に、規模の大きな参加者と小さな参加者が混ざっているとき、市場は良くなるのか悪くなるのか。この理論は、集中が進むと売買のしやすさ（流動性）は上がるが、価格が情報を映す力（情報効率）は下がると答える。良い面と悪い面が同時に出るので、市場の「質」を1つの物差しでは語れないことが分かる。", "unverified": "モデルの具体的な仮定と導出、効果の数量的な大きさは抄録になく未確認。理論研究である。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "プライバシーは投資の意欲を守るが選別を弱める", "title": "Screening, Investment Incentives, and the Welfare Trade-Offs of Privacy", "url": "https://doi.org/10.1287/mnsc.2025.01507", "authors": "Anastasios Dosis ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "情報開示が、契約前の投資の誘因と契約の効率に与える影響をプリンシパル・エージェント・モデルで分析した。情報はプリンシパルの選別を助けるが余剰の収奪も容易にし、エージェントの投資意欲を弱める。効率的な情報政策の境界では、プライバシーが強いほど投資の誘因とエージェントの利得が高い。完全な秘匿・完全な開示・中間のどれが効率的かの条件を特徴づけた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "情報の開示が、契約前の投資の意欲と契約の効率に与える影響を分析し、どの程度のプライバシーが効率的かの条件を示した。", "p3": "プリンシパル・エージェント・モデルの一群を分析する。情報はプリンシパルがエージェントを選別するのを助けるが、余剰の収奪も容易にし、契約前のエージェントの投資の誘因を弱める（抄録）。", "p5": "効率的な情報政策の境界では、プライバシーが強いほど投資の誘因とエージェントの利得が高い。完全な秘匿、完全な開示、中間のプライバシーのそれぞれが効率的になる条件を特徴づけた（抄録）。", "fun": "契約を結ぶ前に、自分のことを相手にどこまで知られるのがよいか。相手に情報があれば、ふさわしい相手かどうかを見分けやすくなる。けれども知られすぎると、成果の取り分を持っていかれると予想して、契約の前の投資をしなくなる。この研究は、隠すことにも「投資の意欲を守る」という効率上の役割があることを示した。", "unverified": "モデルの具体的な設定、政策への適用例の詳細は抄録になく未確認。理論研究である。"}}, {"id": "jn18", "rank": 18, "field": "機械学習", "headline": "二次正則化つき最適輸送の解法が線形収束する保証", "title": "Polyak–Łojasiewicz Inequality for Quadratically Regularized Optimal Transport", "url": "https://doi.org/10.1137/26m1840441", "authors": "Alberto González-Sanz ほか", "venue": "SIAM Journal on Optimization", "date": "2026-11-24", "sjr": 1.671, "citescore": 4.4, "citescore_year": "2025", "why": "二次正則化つき最適輸送は疎な輸送計画を与え数値的に安定だが、双対問題は強凹でなく、線形収束の標準的な議論が使えなかった。連続・半離散の両方を含む緩い仮定のもとで、双対問題の局所的な誤差限界とポリャク・ウォヤシェヴィッチ不等式を明示的な定数つきで証明し、勾配上昇法や座標上昇法の線形収束を導いた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "二次正則化つき最適輸送の双対問題について、解法が線形収束することを保証する曲率の性質を、明示的な定数つきで証明した。", "p3": "双対の目的関数は凹だが、正の部分をとる関数を含むため強凹でなく、標準的な線形収束の議論が使えない。連続と半離散の両方を含む緩い仮定のもとで、関数解析の手法により局所的な誤差限界とポリャク・ウォヤシェヴィッチ不等式を示した（抄録）。", "p5": "応用として、双対問題に対する勾配上昇法、座標上昇法、座標勾配上昇法の線形収束を、明示的な縮小率つきで導いた（抄録）。", "fun": "ある分布を別の分布へ、最も手間が少なくなるように移し替える計算を最適輸送という。背景：この計算は条件を少しゆるめる（正則化する）と扱いやすくなる。よく使われるゆるめ方は数値的に不安定になることがあり、二次の形のゆるめ方が代わりになるが、そちらは解法が速く正解に近づく保証がなかった。この研究は、その保証を数学的に与えた。", "unverified": "数値実験の有無と実際の収束の速さは抄録になく未確認。理論研究である。"}}, {"id": "jn19", "rank": 19, "field": "人口学", "headline": "紛争と出生率の矛盾する知見を多層の経路で整理", "title": "Rethinking Fertility Responses to Armed Conflict: A Critical Review of Conflict–Fertility Research in Low‐ And Middle‐Income Countries", "url": "https://doi.org/10.1111/padr.70107", "authors": "Victor Emmanuel ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "低・中所得国の武力紛争と出生の実証研究27件を検討し、紛争への曝露の概念化と測定、適用された理論を評価した。既存の出生理論は制度の安定を前提にしており、単一の理論では知見の幅を説明できない。紛争はマクロ・メゾ・ミクロの複数の経路で同時に働き、種類・期間・強度によって出生を抑えも促しもすることを多層の概念枠組みで示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "武力紛争が出生に与える影響についての矛盾する知見を、紛争が複数の水準の経路で同時に働くという多層の概念枠組みで整理した。", "p3": "低・中所得国の実証研究27件を検討し、紛争への曝露の概念化と測定、適用された理論の枠組みを評価し、紛争と出生の結果を結ぶ経路を特定した（抄録）。", "p5": "既存の出生理論は、紛争が崩す制度の安定を前提に作られており、単一の理論では知見の幅を説明できない。紛争はマクロ・メゾ・ミクロの経路で同時に働き、種類・期間・強度によって出生を抑えも促しもする。繰り返す低強度の暴力を1回の衝撃として扱うなど、曝露の誤分類の危険も指摘した（抄録）。", "fun": "武力紛争が起きると、出生は減るのか増えるのか。研究によって、短期的に減るという結果と、その後に持ち直すという結果がある。この論文は、紛争が同時にいくつもの道筋で働くからだと整理した。ある道筋は出生を抑え、別の道筋は促す。どちらが勝つかは、紛争の種類や長さや激しさで変わる。矛盾して見える結果を1つの枠組みにまとめる試みだ。", "unverified": "27件の研究の内訳と選定の方法の詳細は抄録になく未確認。取得できた抄録は末尾が途中で切れている。"}}, {"id": "jn20", "rank": 20, "field": "工学", "headline": "鋼管の腐食が進んだアーチ橋の耐震性能を評価", "title": "Seismic performance evaluation of long-span CFST arch ring structure considering steel uniform corrosion effects", "url": "https://doi.org/10.1142/s0219455428501064", "authors": "Fangting Wang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-24", "citescore": 6.5, "citescore_year": "2025", "why": "コンクリート充填鋼管アーチ橋の主要な耐震部材であるアーチリブについて、鋼の一様腐食が耐震性能に与える影響を評価した。中国南西部の長大上路式アーチ橋を原型にOpenSeesで有限要素モデルを作り、腐食なし・50年・100年のモデルに漸増動的解析を行って、変形とエネルギーの2指標による損傷を部材と構造全体の水準で比べた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "鋼の腐食が、コンクリート充填鋼管アーチ橋のアーチリブの耐震性能をどれだけ損なうかを、供用年数ごとの解析で評価した。", "p3": "中国南西部の長大な上路式アーチ橋を原型に、OpenSeesでアーチリブの有限要素モデルを作り、別のソフトのモデルと動特性で照合した。一様腐食モデルで腐食なし・50年・100年のモデルを作り、8つの地震動で漸増動的解析と脆弱性解析を行った（抄録）。", "p5": "アーチの起拱部が損傷の集中する領域で、横つなぎ材は高い地震強度で重い損傷を受けやすかった。供用年数が延びるほど部材の耐震性能は腐食で大きく低下し、同じ地震強度でより高い損傷状態に達する確率が上がった（抄録）。", "fun": "橋は年月がたつと鋼が腐食する。それは大地震が来たときの強さにどう響くのか。この研究は、同じ橋の「腐食なし」「50年後」「100年後」を計算機の中に作り、地震の揺れを段階的に強くして、損傷の進み方を比べた。年数が進むほど、同じ強さの地震でより重い損傷に至る確率が上がっていた。著者らは50年を超える橋の定期的な点検と耐震評価を勧めている。", "unverified": "損傷確率の具体的な数値、腐食の速度の設定は抄録になく未確認。1つの橋を原型にした解析である。"}}, {"id": "jn21", "rank": 21, "field": "工学", "headline": "バンコクの信号つき横断歩道12か所の連続性を点検", "title": "Mobility Access and Route Continuity at Twelve Signal-Controlled Crossings in Bangkok, Thailand", "url": "https://doi.org/10.3390/infrastructures11120439", "authors": "Choomket Sawangjaroen", "venue": "Infrastructures", "date": "2026-11-24", "citescore": 5.7, "citescore_year": "2025", "why": "歩行者の連続した通行は、横断施設の部品の有無だけでなく配置に左右される。バンコクの信号つき横断歩道12か所の2022〜2023年の施設の記録を比べた。12か所すべてに縁石の傾斜路・歩行者信号・押しボタン・照明があったが、8か所に傾斜路に関する通行上の懸念、5か所に樹木や柱の障害があり、確認できた4つの安全島のうち1つは車いすで使えないとされた。改修の範囲を3つに整理した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "歩行者が途切れずに通行できるかは、横断施設の部品があるかどうかだけでなく、その配置で決まることを、バンコクの12か所の横断歩道の記録から示した。", "p3": "意図的に選んだ信号つき横断歩道12か所の、2022〜2023年の物的な施設の記録を使う後ろ向きの比較研究で、記録された状態、運用についての解釈、提案された是正工事を区別して抽出した（抄録）。", "p5": "12か所すべてに縁石の傾斜路、歩行者信号、押しボタン、照明があった。8か所に傾斜路に関する通行上の懸念を裏づける記述があり、5か所に樹木や柱の固定の障害があった。確認できた4つの安全島のうち1つは車いすの利用者が使えないとされた（抄録）。", "fun": "横断歩道に傾斜路も信号も押しボタンも照明もそろっていれば、誰でも渡れそうに思える。ところが、通り道に樹木や柱があったり、途中の安全島に待つための平らな場所がなかったりすると、部品がそろっていても渡りにくい。この研究は、「あるかないか」の確認では見えない、部品どうしの関係の問題を12か所で洗い出した。", "unverified": "12か所の選び方の基準、歩行者の実際の行動の観察は抄録になく未確認。記録に基づく後ろ向きの比較である。"}}, {"id": "jn22", "rank": 22, "field": "工学", "headline": "米国の道路安全マニュアルは欧州で使えるか", "title": "Transferability of Highway Safety Manual Safety Performance Functions and Calibration Factors in Europe: A Scoping Review", "url": "https://doi.org/10.3390/infrastructures11120438", "authors": "Vito Frangiamore ほか", "venue": "Infrastructures", "date": "2026-11-24", "citescore": 5.7, "citescore_year": "2025", "why": "米国のHighway Safety Manualの事故予測は米国のデータで較正されており、他地域への移転可能性の確認が要る。安全性能関数と較正係数の欧州での証拠をPRISMA-ScRに沿って整理したスコーピングレビューである。研究はイタリアに偏り、英国・ドイツ・オランダなどの証拠は限られる。欧州の証拠は方法としては一貫するが、地理とインフラの種類の面で偏りがあると結論する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": false, "short": true, "p1": "米国の道路安全マニュアル（HSM）の事故予測の手法が欧州で使えるかについて、欧州での証拠をまとめたスコーピングレビューである。", "p3": "HSMの移転可能性の中核である安全性能関数と較正係数について、Scopus、Web of Science、TRIDをPRISMA-ScRに沿って検索した。出版年と言語の制限は設けず、欧州を対象にした研究だけを含めた（抄録）。", "p5": "研究は地理的に大きく偏り、欧州の研究の多くはイタリアで行われ、英国・ドイツ・オランダなどの証拠は限られていた（抄録）。", "fun": "道路の事故を定量的に予測する手法が米国のマニュアルにまとめられ、国際的に参照されている。ただしその予測モデルは、米国の事故と交通のデータで較正されている。条件の違う欧州でも使えるのか。調べてみると、検証した研究はイタリアに集中していて、ほかの国ではまだ証拠が限られていた。", "unverified": "含めた研究の件数、較正係数の具体的な値の範囲は抄録になく未確認。取得できた抄録は末尾が途中で切れている。"}}, {"id": "jn23", "rank": 23, "field": "化学", "headline": "湿った排ガスからCO2だけを選ぶ多孔性材料", "title": "Halogenated Triazole-Based Metal–Organic Framework Achieves Ultra-Selective CO2 Capture under Humid Conditions", "url": "https://doi.org/10.1021/jacs.6c13451", "authors": "Armando Rigamonti ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "湿度の高い窒素主体の排ガスからCO2を選択的に回収する吸着材として、ハロゲン化したトリアゾールとシュウ酸の亜鉛系MOF（CALF-20-X）とその複合体を開発した。ハロゲンが細孔の窓を狭めて窒素の取り込みを抑え、CO2に合うポケットを作る。CALF-20-Clは0.15 bar・298 KでCO2を2.89 mmol/g吸着し、CO2/N2選択性は4074を超えた。相対湿度21%では水の取り込みが56%抑えられた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "湿った排ガスからCO2を極めて高い選択性で回収できる、ハロゲン化した亜鉛系の金属有機構造体（MOF）CALF-20-Xを開発した。", "p3": "トリアゾールにハロゲン（塩素または臭素）を導入した亜鉛のMOFを、溶媒を抑えた粉砕と水中での処理で合成した。ハロゲンがC–Hの供与部を分極させてCO2との接触を促し、細孔の窓を狭めて窒素の取り込みを抑える（抄録）。", "p5": "CALF-20-Clは0.15 bar・298 KでCO2を2.89 mmol g–1吸着し、CO2/N2の選択性は4074を超えた。吸着熱は48 kJ/molだった。相対湿度21%ではCO2の吸着が優先され、水の取り込みが56%抑えられた（抄録）。", "fun": "排ガスから二酸化炭素だけを取り除きたい。ところが排ガスは窒素が多く、湿っている。吸着材には、窒素と二酸化炭素をはっきり見分けることと、湿った条件に耐えることの両方が求められる。この研究は、穴の入り口を狭め、内側の電気的な性質を調整することで、湿った条件でも二酸化炭素を選び取る材料を作った。", "unverified": "繰り返しの回数、合成の規模、費用は抄録になく未確認。"}}, {"id": "jn24", "rank": 24, "field": "化学", "headline": "CO2からプロパノールを作る新しい結合経路", "title": "Elusive *CH–*CHO Coupling Pathway for High-Performance CO2 Electroreduction to n-Propanol", "url": "https://doi.org/10.1021/jacs.6c15732", "authors": "Chenchen Fang ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "CO2の電気化学的還元でn-プロパノールを作る際の律速は、炭素2個と1個の中間体の結合である。2価と0価の銅が隣り合う安定な触媒の上で、*CHと*CHOが結合する経路を実現した。2価の銅が*CHOを強く吸着して*CHまで還元し、隣の0価の銅の*CHOと低い障壁で結合する。n-プロパノールのファラデー効率は18.1%、部分電流密度は72.4 mA/cm²だった。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "CO2の電気化学的還元で、価値の高いn-プロパノールを高い選択性で作るための新しい炭素–炭素結合の経路を、銅の触媒の上で実現した。", "p3": "2価と0価の銅が隣り合う安定な触媒を作った。2価の銅が*CHOの中間体を強く吸着して*CHまで還元し、隣の0価の銅の上の*CHOと低いエネルギー障壁で結合する。その場の赤外分光と密度汎関数法の計算で経路を裏づけた（抄録）。", "p5": "n-プロパノールのファラデー効率は18.1%、部分電流密度は72.4 mA cm–2で、安定性も高かった（抄録）。", "fun": "二酸化炭素を電気の力で価値のある物質に変える研究が進んでいる。n-プロパノールを作る場合は、炭素2個の部品と炭素1個の部品をつなぐ段階のエネルギーの壁が高く、難所だった。この研究は、性質の違う2種類の銅を隣り合わせに置き、片方が作った部品をもう片方の部品とつなげるという、分業のような仕組みでその難所を越えた。", "unverified": "安定性の具体的な時間、他の生成物の割合は抄録になく未確認。"}}, {"id": "jn25", "rank": 25, "field": "材料科学", "headline": "非接触の摩擦帯電センサの寿命を電荷の逃げ方で予測", "title": "Charge Escape Mechanism and Lifetime Prediction of Non‐Contact Triboelectric Sensors", "url": "https://doi.org/10.1002/adma.75794", "authors": "Pengfei Wang ほか", "venue": "Advanced Materials", "date": "2026-11-24", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "why": "非接触型の摩擦帯電センサは表面電荷の散逸で寿命が決まる。表面電荷を保持される電荷と逃げる電荷に分け、電子トラップのエネルギー分布の理論から3つの散逸機構を整理し、寿命を予測する数理モデルを立てた。中間層・空隙・湿度の影響を調べ、10種の誘電体の耐久試験ではFEPが100 Hzで最長8,940時間の予測寿命を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "非接触型の摩擦帯電センサの寿命を決める表面電荷の散逸の仕組みを整理し、寿命を予測できる数理モデルを作った。", "p3": "表面電荷を、保持される電荷と逃げる電荷に分け、電子トラップのエネルギー分布の理論に基づいて3つの散逸の機構を説明した。中間層、固定子と回転子の間の空隙、湿度が散逸の速さに与える影響を調べた（抄録）。", "p5": "10種の誘電体の耐久試験で、フッ素化エチレンプロピレン（FEP）は100 Hzで最長8940時間の予測寿命を示した。さまざまな動作条件での実験結果は理論の予測とよく一致した（抄録）。", "fun": "物の表面にたまった電荷を利用して、動きを電気信号として捉えるセンサがある。触れずに高い周波数の動きを監視できるが、表面の電荷は避けられずに逃げていき、それが寿命を決める。この研究は、電荷がどんな仕組みで逃げるかを3通りに整理して式にし、材料と条件ごとの寿命を前もって見積もれるようにした。", "unverified": "3つの機構の具体的な内容、モデルの式は抄録になく未確認。"}}, {"id": "jn26", "rank": 26, "field": "材料科学", "headline": "広いバンドギャップの新しい酸カルコゲン化物を2つ合成", "title": "Experimental and Computational Identification of Wide-Gap Quaternary Oxychalcogenides BaZn2OS2 and SrZn2OSe2", "url": "https://doi.org/10.1021/jacs.6c17075", "authors": "Tomoya Gake ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "ワイドギャップ半導体の候補として、アルカリ土類・亜鉛・酸素・カルコゲンの四元系を探索し、未報告のBaZn2OS2とSrZn2OSe2を合成した。第一原理計算は、どちらも直接遷移型のバンド構造で、電子と正孔の有効質量が小さいことを示す。一方で、固有欠陥によるキャリアの補償が起こりやすいとみられる。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "広いバンドギャップをもつ新しい酸カルコゲン化物BaZn2OS2とSrZn2OSe2を合成し、後者がp型にもn型にもできる半導体になりうることを計算で示した。", "p3": "アルカリ土類・亜鉛・酸素・カルコゲンの四元系を探索し、未報告の2つの化合物を、既報の4つとともに合成した。第一原理計算でバンド構造、固有欠陥、外因性の添加物を系統的に調べた（抄録）。", "p5": "2つの化合物は直接遷移型のバンド構造で、電子と正孔の有効質量が小さい。BaZn2OS2は固有欠陥によるキャリアの補償で絶縁的になりやすいが、SrZn2OSe2では成長条件の制御で補償を抑えられ、両極性のドーピングが可能と予測された（抄録）。", "fun": "半導体には、電子が電気を運ぶ型と、電子の抜けた穴が運ぶ型がある。バンドギャップの広い半導体で、後者の型の報告は銅を含む材料にほぼ限られ、前者の型で実用的な伝導を示す酸カルコゲン化物はまだなかった。この研究は、銅を含まない新しい化合物を作り、計算で「両方の型にできそうか」を見極めた。", "unverified": "両極性のドーピングは計算による予測で、実験での実現は抄録からは確認できない。バンドギャップの値も抄録にない。"}}, {"id": "jn27", "rank": 27, "field": "統計学", "headline": "変数誤差モデルで測定誤差の分散は識別できるか", "title": "Identifiability of Measurement-Error Variance in Error-in-Variables Regression", "url": "https://doi.org/10.1080/01621459.2026.2766219", "authors": "Donguk Shin ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-24", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "説明変数に測定誤差がある回帰（errors-in-variables）で、測定誤差の分散がデータから一意に定まるかという識別可能性を扱う論文である（題名の範囲。抄録は入手できていない）。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、説明変数に測定誤差がある回帰（errors-in-variables回帰）で、測定誤差の分散がデータから識別できるか、つまり一意に定まるかを扱う論文である。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "2つの量の関係を調べたいのに、一方の測定に誤差があるとする。背景：このとき、測定誤差の大きさが分からなければ、見かけの関係がどれだけ弱められているかを正しく直せない。では、誤差の大きさそのものを、手元のデータだけから突き止められるのか。それとも、どれだけデータを集めても決められないのか。それが題名から読み取れる問いである。", "unverified": "抄録・本文を入手できず、識別の条件、定理の内容、数値例はすべて未確認。"}}, {"id": "jn28", "rank": 28, "field": "情報システム", "headline": "LLMの監督は「知っている」だけでは足りない", "title": "Knowing is Not Enough: Information Retrievability as a Precondition to Effective LLM Oversight", "url": "https://doi.org/10.1080/07421222.2026.2736934", "authors": "Xinyu Fu ほか", "venue": "Journal of Management Information Systems", "date": "2026-11-24", "sjr": 3.154, "citescore": 12.3, "citescore_year": "2025", "why": "人がLLMを有効に監督するには、知識を持つことに加えて、必要な情報を取り出せることが前提になると論じる論文である（題名の範囲。抄録は入手できていない）。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "人がLLMの誤りを見逃す原因を、確認に必要な情報をその場で取り出せないことに求め、取り出しやすさを高める介入が誤りの検出を改善することを示した。", "p3": "顧客対応の従業員640人を対象にした2つの無作為化の現場実験で、自分で説明を作らせる介入と、その推論を呼び起こす手がかりの効果を調べた（抄録）。", "p5": "自分で作った説明は誤りの検出を改善し、検証に関わる推論の想起を強めた。推論を呼び起こす手がかりは、LLMを繰り返し使う中での検出の維持を助けた（抄録）。", "fun": "AIの出力の誤りは、人の確認をすり抜けることが多い。この研究は、原因を「知っているかどうか」だけでなく「確認の瞬間に取り出せるかどうか」に求めた。導入のときに自分の言葉で説明を作らせ、日々短い手がかりを見せると、誤りの検出が保たれた。知識は持っているだけでは足りず、使う場面で呼び出せる形になっている必要がある。", "unverified": "検出率の改善の大きさ、実験の期間と業種は抄録になく未確認。"}}, {"id": "jn29", "rank": 29, "field": "情報システム", "headline": "勤務時間外のモバイル利用と翌日の成果", "title": "Still Working Late? After-Hours Mobile Technology Use, Support at Home, and Next-Day Outcomes", "url": "https://doi.org/10.1080/07421222.2026.2736937", "authors": "Massimo Magni ほか", "venue": "Journal of Management Information Systems", "date": "2026-11-24", "sjr": 3.154, "citescore": 12.3, "citescore_year": "2025", "why": "勤務時間外の仕事でのモバイル技術の利用、家庭での支え、翌日の成果の関係を扱う論文である（題名の範囲。抄録は入手できていない）。", "explain": {"basis": "題名", "basis_note":       stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
