zers", "url": "https://arxiv.org/abs/2611.28298", "authors": "Alex L. Zhang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "言語モデルをエージェントとして動かす外側の仕組み（ハーネス）が文脈をため込む標準の設計に代えて、文脈をプログラムで外部化して管理する神経記号的なハーネスの訓練を調べた。複雑な問題を、モデルが受け取る観測がどれも訓練分布の内側に収まるように分解することを、強化学習による事後訓練で容易に学ぶことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": true, "short": true, "p1": "文脈をプログラムで外部化して管理する神経記号的なハーネスの中で言語モデルを訓練すると、短い課題だけの訓練から長い課題や新しい領域へ合成的に汎化できることを示した。", "p3": "再帰的言語モデル（RLM）のようなハーネスを強化学習で事後訓練する。複雑な課題では、偽の道具や下位呼び出しをもつ易しい合成の代理環境で個々の呼び出しを訓練する「代理ハーネス訓練」を使う（抄録）。", "p5": "短い課題だけの訓練で2〜64倍長い課題に汎化し、ある領域での訓練は潜在的な構造を共有する新しい領域に転移した。合成データで訓練したRLM-27Bは、長文脈の難しい課題群で元のモデルを平均26.9%改善し、推論時のトークンは約2分の1だった（抄録）。", "fun": "長い仕事をAIに任せると、やり取りの記録がどんどんたまり、AIはその長い記録を読みながら考えることになる。記録が長くなるほど、訓練で見たことのない状況になりやすい。この研究は、記録の管理をプログラムに任せ、AIには毎回「見慣れた形の小問」だけを渡すようにした。大きな問題を小さく切って解く考え方だ。", "unverified": "取得できた抄録は末尾が途中で切れており、最後の結果は未確認。課題群の詳細も抄録にはない。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "LLMの事後訓練を集団で並列に行い自動で調整", "title": "Population-Based Post-Training for Large Language Models", "url": "https://arxiv.org/abs/2611.29014", "authors": "Yixuan Even Xu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "検証可能な報酬による強化学習（RLVR）は、訓練前に決めたハイパーパラメータで1つのモデルを訓練するのが普通である。複数のモデルを並列に訓練し、定期的な検証で成績の良いモデルを複製してハイパーパラメータを摂動し、悪いモデルと入れ替える集団ベースの事後訓練を導入した。推論のベンチマークと道具を使う対話環境で、計算量をそろえた独立の学習者の集まりより強いエージェントを得た。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMの事後訓練で、複数のモデルを並列に訓練しながらハイパーパラメータを自動で調整する集団ベースの方法PBPTを導入した。", "p3": "検証可能な報酬による強化学習で、定期的に検証用データでモデルを評価する。成績の良いモデルを複製してハイパーパラメータを摂動し、成績の悪いモデルは訓練を止めてその複製に置き換える（抄録）。", "p5": "推論のベンチマーク（Enigmata、Nemotron）と道具を使う対話環境（Gaia2、AppWorld）で、計算量をそろえた独立の学習者の集まりより強いエージェントを得た。初期のハイパーパラメータが悪くても、訓練の途中でより良い設定を自動で見つけて回復した（抄録）。", "fun": "AIの訓練では、学習の進め方を決める「設定値」を最初に選ぶが、良い値は試してみないと分からない。ふつうは訓練をやり直しながら人が調整する。この研究は、複数のAIを同時に訓練し、成績の良いものを複製して設定を少し変え、悪いものと入れ替えることを繰り返した。品種改良のようなやり方で、設定の調整を訓練そのものに任せる。", "unverified": "改善の大きさの数値、集団の大きさ、対象のモデルは抄録になく未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "建設ブーム期に建った家は品質が低い", "title": "Boom Houses, Bust Quality: The Hidden Cost of Housing Supply Expansion *", "url": "https://doi.org/10.2139/ssrn.7726978", "authors": "Kristopher S. Gerardi ほか", "venue": "SSRN", "date": "2026-11-23", "why": "物件ごとの査定記録から、住宅建設が急増した時期に建てられた一戸建ては品質の評価が有意に低いことを示した。供給弾力性と全国の住宅ローン金利などの交互作用を操作変数に使っても結果は変わらない。品質の低下は建設労働市場が逼迫した地域などで大きく、ブーム期の住宅は再販売までの保有収益も低い。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "住宅の建設が急増した時期に建てられた一戸建ては、物理的な品質が系統的に低いことを示した。", "p3": "物件ごとの査定記録の品質の評価を使う。地域の建設量を、供給弾力性と全国の住宅ローン金利または建設以外の州の雇用との交互作用で操作変数にし、企業の新規株式公開を地域の需要ショックとして使う検証も行った（抄録）。", "p5": "建設量の多い時期の住宅は品質の評価が有意に低く、低下は建設労働市場が逼迫した地域、米国とメキシコの国境に近い地域、建設会社の新規参入が速い地域で大きかった。ブーム期の住宅は最初と2回目の販売の間の保有収益も低かった（抄録）。", "fun": "家が足りなければ、たくさん建てればよい。そう考えがちだが、急いで大量に建てると、建設の働き手が足りなくなり、新しい会社も次々に参入してくる。この研究は、建設ラッシュの時期に建った家の「造りの評価」が実際に低いことを記録から確かめた。その差は、のちに売るときの値段にも表れていた。量を急ぐと質が犠牲になるという結果だ。", "unverified": "品質の評価の低下の大きさ、標本の物件数と期間は抄録になく未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "過疎地への投資の効果を夜間光の衛星データで測る", "title": "Place-Based Policy from Space: Evidence from Italy's Inner Areas", "url": "https://arxiv.org/abs/2611.31100", "authors": "Nicola Caravaggio ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "イタリアの内陸地域国家戦略（SNAI）を、衛星の夜間光を使って評価した。資金を受けた941の自治体と、対象になりえた3,112の自治体を2011〜2022年について段階的導入の差分の差分で比べた。資金は光のある面積の拡大と関連し、光のある区画あたりの明るさには変化が検出されなかった。活動が既存の中心で強まるのではなく、範囲を広げる形で現れることを示唆する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "イタリアの過疎的な内陸地域への投資政策の効果を衛星の夜間光で評価し、活動が既存の中心で強まるのではなく、広がる形で現れることを示した。", "p3": "構造的に脆弱で周辺的な自治体に、基本的なサービスと経済活動への投資を行う内陸地域国家戦略（SNAI）について、資金を受けた941の自治体と対象になりえた3,112の自治体を、2011〜2022年の段階的導入の差分の差分で比べた（抄録）。", "p5": "資金は光のある面積の拡大と関連し、光のある区画あたりの放射輝度には変化が検出されなかった。拡大は比較群を変えても成り立ち、記述的には住民1人あたりの資金が中程度のところに集中した（抄録）。", "fun": "周辺の小さな町に国がお金を入れたら、効果はあったのか。統計が出るのは遅く、数字も粗い。そこで夜の地球を写した衛星の「明かり」のデータを使った。お金を受けた町では、明かりのある範囲が広がっていたが、明かりのある場所がさらに明るくなったわけではなかった。夜の明かりで政策の成績をつける発想が面白い。", "unverified": "拡大の大きさの数値、夜間光と経済活動の対応の程度は抄録になく未確認。"}}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "取引先の価格硬直性が企業のリスクを左右する", "title": "Trading Partners' Price Rigidity and Macroeconomic Risk", "url": "https://doi.org/10.2139/ssrn.7726961", "authors": "Kane Bae", "venue": "SSRN", "date": "2026-11-24", "why": "仕入先の価格の硬直性は投入価格を通じて、需要拡大後の費用増を和らげる一方で有利な供給ショックの費用減を小さくする。顧客の価格の硬直性は数量を通じて働く。この2つの経路が営業利益と株式収益に表れることを示し、生産ネットワークのモデルで費用転嫁・マークアップ・在庫管理と結びつけた。金融政策と関税の発表時の株価の反応が裏づける。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "取引先の価格がどれだけ動きにくいかが、企業の景気変動へのさらされ方を、仕入先と顧客で異なる経路を通じて決めることを示した。", "p3": "仕入先の価格硬直性は投入価格を通じて、顧客の価格硬直性は数量を通じて働くと整理し、営業利益と株式収益で検証した。生産ネットワークのモデルで、費用転嫁、マークアップ、在庫管理と結びつけた（抄録）。", "p5": "顧客の硬直性が高いほど需要ショックへの感応度が下がり、仕入先の硬直性が高いほど供給ショックへの感応度が下がった。金融政策と関税の発表の前後の株価の反応が、2つの経路を裏づけた（抄録）。", "fun": "仕入先がなかなか値段を変えない会社は、需要が増えても費用があまり上がらずに済む。逆に、供給側に有利な変化が起きても、費用が下がる恩恵は受けにくい。取引相手の「値段の動かしにくさ」が、自分の会社の利益の揺れ方を左右するわけだ。会社のリスクは、自社だけでなく付き合う相手の性質にも表れる。", "unverified": "効果の大きさの数値、標本の企業と期間、価格硬直性の測り方は抄録になく未確認。"}}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "金融政策のあいまいさが株式プレミアムを高める", "title": "Ambiguous Monetary Policy and Portfolio Choice in HANK", "url": "https://doi.org/10.2139/ssrn.7726438", "authors": "Ana Santos", "venue": "SSRN", "date": "2026-11-24", "why": "家計が中央銀行の政策ルールを十分に理解していない状況を、将来の政策ショックの平均についてのナイト的不確実性として、2資産の異質的家計ニューケインジアン・モデルに入れた。各家計は自分にとって最悪の平均のもとで資産配分を評価する。多くの家計は予想外の引き締めを恐れて債券を保険として需要し、債券の収益が下がり株式プレミアムが上がる。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "家計が中央銀行の政策ルールを十分に理解していないという「あいまいさ」が、資産の選択を通じて株式プレミアムを高め、金融政策の効果を変えることをモデルで示した。", "p3": "2資産の異質的家計ニューケインジアン・モデルに、将来の政策ショックの平均についてのナイト的不確実性を入れる。すべての家計は同じ範囲の平均をありうると考え、各家計は自分にとって最悪の平均のもとで資産配分を評価する（抄録）。", "p5": "均衡では、少数の家計が大きな債券の持ち高を選んで予想外の緩和を恐れ、多くは予想外の引き締めを恐れて債券を保険として需要する。これが債券の収益を下げ、株式プレミアムを上げる。ルールへの信認の低下は収縮的な需要ショックとして働く（抄録）。", "fun": "中央銀行が方針を発表しても、家計はその中身を完全には理解できない。分からないとき、人は自分にとって最悪の場合を想定して備える。多くの家計が予想外の引き締めを恐れて債券を持ちたがると、債券の収益は下がり、株との差が開く。政策そのものでなく、政策の分かりにくさが経済を動かすという見方が面白い。", "unverified": "モデルの数量的な結果（プレミアムの大きさなど）は抄録になく未確認。理論モデルによる分析である。"}}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "ブロック粒子フィルタの推定のばらつきを抑える", "title": "Twisted Block Particle Filters: A Local Particle-System Change of Measure for High-Dimensional State-Space Models", "url": "https://arxiv.org/abs/2611.28848", "authors": "Ning Ning", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "高次元の状態空間モデルで重みの退化を和らげるブロック粒子フィルタは、正規化定数の推定のばらつきが大きい。ブロックごとの再標本化に予測的な誘導を入れる「ねじり」を、測度の厳密な変換として導入した。補正は有限粒子での正規化定数の期待値を厳密に保ち、誘導の効果と空間的なブロック化による近似とを切り分けられる。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "高次元の状態空間モデル用のブロック粒子フィルタで、正規化定数の推定のばらつきを、予測的な誘導を厳密な測度変換として入れることで減らす方法を提案した。", "p3": "ブロックごとの再標本化で、各ブロックから一様に選んだ1つの子粒子を誘導に沿って傾け、状態遷移は変えず、補正を有限個の経験的な誘導の平均で計算する。補正が有限粒子での正規化定数の期待値を厳密に保つことを証明した（抄録）。", "p5": "潜在次元が最大256の連成した線形ガウスモデルと確率的ボラティリティモデルで、対数正規化定数の分散が小さくなった。確率的ボラティリティでの減少の中央値は38%だった。100次元の金融ポートフォリオの実データにも適用した（抄録）。", "fun": "直接は見えない状態を、雑音まじりの観測から時々刻々推定するには、ありうる状態の候補を多数ばらまいて、観測に合うものを残していく方法がある。次元が大きいと候補のほとんどが外れてしまうので、空間を区画に分けて扱う。この研究は、区画ごとに候補を見込みのある方向へ導きつつ、導いた分の偏りを正確に打ち消す計算を示した。", "unverified": "計算時間の増加、誘導の作り方の詳細は抄録になく未確認。"}}, {"id": "pn41", "rank": 41, "field": "統計学", "headline": "少数の値をとるデータの平均に厳密で狭い信頼区間", "title": "Exact, narrow and fast: Use the Gaffke confidence interval for the mean of a discrete bounded variable", "url": "https://arxiv.org/abs/2611.29512", "authors": "Louis Abraham", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "アンケートの評点のように少数の既知の値をとるデータの平均では、小標本や端に近い平均で通常の信頼区間の被覆率が名目を大きく下回る。クロッパー・ピアソン区間を一般化したGaffkeの区間は、最近証明された予想により、どの標本サイズと分布でも被覆率が名目以上になる。その端点を、鞍点を通る直線上のフーリエ逆変換で速く正確に計算する算法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": true, "short": true, "p1": "少数の既知の値をとるデータの平均について、どんな標本サイズと分布でも名目の被覆率を保つGaffkeの信頼区間を、速く正確に計算する算法と実装を提供した。", "p3": "区間の端点はディリクレ変数の重みつき和の分位点で、閉じた式がない。鞍点を通る直線上のフーリエ逆変換の積分で裾確率を求め、ガウス・ルジャンドル則とニュートン法で端点を計算する（抄録）。", "p5": "n≦30では、水準を保つ区間の中でGaffkeの区間が最も短く、Waudby-SmithとRamdasの区間より17〜20%、Andersonの区間より19〜37%短かった。より短い通常の区間は、分布によって被覆率が50%を下回った。1区間の計算は1ミリ秒未満である（抄録）。", "fun": "アンケートの評点のように決まった数種類の値しかとらないデータで、平均の信頼区間をふつうの公式で計算すると、回答が少ないときや平均が上限・下限に近いときには、うたっている確率よりずっと低い確率でしか真の値を含まない。この研究は、どんな場合でも約束どおりの確率を守り、しかも幅が狭い区間を、一瞬で計算できる道具にした。", "unverified": "取得できた抄録は末尾が途中で切れている。比較に使った分布の条件は抄録になく未確認。"}}, {"id": "pn42", "rank": 42, "field": "統計学", "headline": "運用中のリスクモデルを件数の変動に左右されず監視", "title": "Which Loans, Not How Many: Exactly Level-Invariant, Anytime-Valid Monitoring of Deployed Risk Models", "url": "https://arxiv.org/abs/2611.28342", "authors": "Xin Xu", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "借り換えの波は、スコアと繰上返済の関係を変えずに件数だけを変えうる。ロジスティックモデルで月ごとの件数を条件づけると、どのローンが繰上返済するかの尤度から切片が消えることを使い、較正の傾きの下限をいつ止めても有効な形で検定する方法を作った。帰無仮説のもとで一度でもしきい値を超える確率は5%以下である。フレディマックのローンデータで検証した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "運用中のリスクモデルを、件数の水準の変動に左右されず、いつ確認しても有効な形で監視する方法を作った。", "p3": "ロジスティックモデルで月ごとの件数を条件づけると、どのローンが繰上返済するかの尤度から切片が消えることを使う。較正の傾きの下限を検定する統計量、切片の許容範囲からの逸脱を追う統計量、傾きの変化を検出する規則を組み合わせる（抄録）。", "p5": "しきい値20では、帰無仮説のもとで一度でも超える確率は5%以下である。フレディマックのローンでは、凍結したモデルについて2018年4月に下向きの変化を、保守されたモデルについて補足の実行で2019年8月に上向きの変化を検出した（抄録）。", "fun": "住宅ローンが早めに返済されるかを予測するモデルがあるとする。借り換えの波が来ると早期返済の「件数」は増えるが、それだけではモデルが悪くなったとは言えない。大事なのは「どのローンが」返済されるかを当てる力だ。この研究は、件数の増減の影響を取り除いて、その力だけを毎月見張る方法を作った。何度確認しても誤報の確率が抑えられる。", "unverified": "モデルの種類とデータの期間の詳細、検出の遅れの大きさは抄録になく未確認。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "F1の前翼まわりの流れを大規模にモード分解", "title": "Scalable Modal Analysis of the Imperial Front Wing Flow Field", "url": "https://arxiv.org/abs/2611.29995", "authors": "Parv Khurana ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "高忠実度の流体シミュレーションから支配的な3次元の構造を取り出すことは、状態空間の次元が大きく困難だった。オープンソースのpyLOMに実装した大規模な固有直交分解と動的モード分解で、公開ベンチマークのImperial Front Wing（レイノルズ数2.2×10⁵）のLES結果から、流れの構造とその時間変化を同定した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": true, "short": true, "p1": "F1の前翼まわりの高忠実度の流体シミュレーションから、支配的な渦の構造とその時間的なふるまいを、大規模なモード分解で取り出せることを示した。", "p3": "オープンソースのpyLOMに実装した固有直交分解（POD）と動的モード分解（DMD）を、公開ベンチマークのImperial Front WingのLESの結果に適用した。計算はスペクトル/hp要素法による（抄録）。", "p5": "シミュレーションは4つの支配的な渦構造を捉え、時間平均の揚力係数と抗力係数は参照データと2.24%と2.87%の差だった。DMDは、翼弦に基づくストローハル数5.1、7.5、9.3のモードを、層流剥離泡、カナードの渦の脈動、翼端板の渦の蛇行にそれぞれ対応づけた（抄録）。", "fun": "レーシングカーの前の翼の周りでは、空気がいくつもの渦を作りながら流れている。計算結果は膨大な数値が刻々と変わる巨大なデータで、そのままでは何が起きているのか読み取れない。この研究は、流れを「一定のリズムで振動する模様」の重ね合わせに分解し、どのリズムがどの渦の動きに当たるかを突き止めた。音を構成音に分けるのに似ている。", "unverified": "取得できた抄録は末尾が途中で切れており、データの圧縮に関する結果は未確認。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "平板載荷試験の曲線から舗装各層の特性を逆解析", "title": "Inverse Finite-Element Identification of Hydraulically Stabilised Layers from Static Plate Load Tests on a Full-Scale Circular Test Track, with Geopolymer-Stabilised Alternatives", "url": "https://doi.org/10.20944/preprints202611.2429.v1", "authors": "Silviu-Cristian Iriciuc ほか", "venue": "Preprints.org", "date": "2026-11-24", "why": "平板載荷試験の変形係数は層ではなく層構造全体の値である。ルーマニアの実大の円形試験走路で、路床と3種の水硬性安定処理層の弾塑性パラメータを、載荷・除荷・再載荷の全曲線から軸対称の有限要素モデルで逆解析した。ラテン超方格サンプリングとレーベンバーグ・マーカート法で同定し、不確かさも示した。モデルは独立の解と0.1%以内で一致することを確かめている。", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用（末尾は途中まで）", "preprint": true, "short": true, "p1": "舗装の処理層の受け入れに使う平板載荷試験の曲線から、有限要素の逆解析で各層の弾塑性パラメータを同定し、この試験で何が同定でき何ができないかを示した。", "p3": "ルーマニアの実大の円形試験走路で、路床と3種の水硬性の処理層について、載荷・除荷・再載荷の全曲線を軸対称の有限要素モデルで逆解析した。拡張ドラッカー・プラガーモデルを用い、ラテン超方格サンプリングとレーベンバーグ・マーカート法で同定した（抄録）。", "p5": "路床ではモデルがEv1とEv2を3%と9%以内で再現した（E=41 MPa）。安定処理した路床では、処理層の弾性係数と支持の剛性がほぼ完全に相関し（r=−0.99）、試験が同定するのは層構造全体の剛性だった（抄録）。", "fun": "道路の土台が十分に固いかを確かめるには、板を地面に押しつけて沈み方を測る。ところがこの沈み方は、調べたい層だけでなく、その下の地盤の硬さにも左右される。この研究は、計算機の中で同じ試験を再現して層ごとの硬さを逆算しようとし、上の層と下の支えの硬さは一方を変えるともう一方で埋め合わせられるため、試験だけでは分けられないことを示した。", "unverified": "取得できた抄録は末尾が途中で切れており、軽量たわみ計による弾性係数との比較の結果は未確認。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "地震時のすべりと余効すべりを結ぶ保存量を提案", "title": "Conservative Rupture Force Relating Co-seismic Rupture and Afterslip Process", "url": "https://arxiv.org/abs/2611.30324", "authors": "Yuxuan Hou ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "地震時のすべりと余効すべりの関係は両者のモーメントの比で表されてきたが、この比が本質的に不安定であることを数値と理論の解析で示した。地震間の平衡状態を基準に純粋な余効すべりを分離し、地震時の応力降下を面積で積分した「保存的破壊力」という新しい物理量を定義して両者を関係づけた。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用（末尾は途中まで）。本文は読んでいない", "preprint": true, "short": true, "p1": "地震時のすべりと地震後の余効すべりの関係を、従来のモーメントの比に代えて、「保存的破壊力」という新しい物理量の比で安定に表せることを示した。", "p3": "地震間の平衡状態を基準にして純粋な余効すべりを分離する。保存的破壊力は地震時の応力降下の面積積分で、無限の断層面での応力載荷の面積積分、および無限の時間と断層面での余効すべりの応力解放の面積積分と等しい（抄録）。", "p5": "モーメントの比は本質的に不安定である。応力解放の空間的な配分を補正すると、余効すべりと地震時の保存的破壊力の比は無限の時間で1に収束する。2015年のMw 7.8のゴルカ地震では、余効すべりが本震後5.5年で地震時の応力載荷の30%を解放した（抄録）。", "fun": "大きな地震のあとも、断層はゆっくり滑り続ける。この「あとから滑る量」が本震とどういう関係にあるかは、これまで2つの量の比で表されてきたが、その比は値が安定しない欠点があった。この研究は、力に当たる別の量で比べれば、理論上は最終的に比が1になることを示した。実際の地震では5.5年で30%にとどまり、断層の大きな部分が固着したままだった。", "unverified": "取得できた抄録は末尾が途中で切れている。数値解析の設定と他の地震への適用は未確認。"}}, {"id": "pn46", "rank": 46, "field": "人口学", "headline": "メキシコの殺人の増加で父を失う子どもが急増", "title": "Homicidal violence and childhood bereavement in Mexico: Parental loss and kinship inequalities 2000–2024", "url": "https://doi.org/10.31235/osf.io/za47k", "authors": "Mary Carolina Sosa Bonilla ほか", "venue": "SocArXiv", "date": "2026-11-24", "why": "メキシコの殺人の増加が残された子どもに与える影響を、2000〜2024年の母・父・いずれかの親の喪失として推定した。死亡登録と人口推計を組み合わせ、時間変化する両性の親族モデルを用いる。父の喪失は2007年以降に急増し、2015年以降にも増えた。2020年の推定は父の喪失が59,569人、少なくとも一方の親の喪失が65,322人で、北西部・太平洋岸・中北部で確率がとくに高い。", "explain": {"basis": "抄録", "basis_note": "SocArXivの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "メキシコの殺人の増加が、親を失う子どもをどれだけ増やしたかを、死因別の死亡と親族の人口学モデルを結びつけて定量化した。", "p3": "死亡登録のデータと人口の推計を組み合わせ、時間変化する両性の親族モデルで、2000〜2024年の母・父・いずれかの親の喪失の年ごとの確率と人数を推定した。主な死因は殺人と意図不明の事象を合わせたものである（抄録）。", "p5": "父の喪失は2007年以降に急増し、2015年以降にも増えた。2020年の推定は、父の喪失が59,569人、少なくとも一方の親の喪失が65,322人だった。北西部・太平洋岸・中北部で父を失う確率がとくに高かった（抄録）。", "fun": "殺人事件の統計は「何人が亡くなったか」を数えるが、その陰には親を失った子どもがいる。その人数は統計に直接は表れない。この研究は、死亡の記録と、亡くなった人に子がいる見込みを人口学のモデルで組み合わせて、親を失った子どもの数を推定した。2020年の1年間で59,569人が父を失ったという推定は、暴力の影響が次の世代に及ぶことを示している。", "unverified": "推定の不確かさの幅は抄録になく未確認。年ごとの喪失の推定であり、孤児の人数や政策の因果効果は測っていないと著者が述べている。"}}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "AI使用の疑いを「生配信で描く」賭けで裁く", "title": "But Can You Draw It Live? The Emergence of AI Duidus for Adjudicating Suspected Generative AI Use in Digital Art Commission Communities", "url": "https://arxiv.org/abs/2611.29684", "authors": "Elise Chenxinran Shen ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "依頼制のデジタルアートの共同体で、生成AIの使用を疑われた作家に生配信で新作を描かせ、共同体が投票で判定する「AI対賭」という紛争解決の仕組みを調べた。告発者・作家・仲介者の17人への面接から、真贋の検証が作品そのものから作家の生配信での制作の労働へ移ること、参加者が感じる有効性とリスクを明らかにした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIの使用を疑われた作家に生配信で新作を描かせ、共同体が投票で判定する「AI対賭（duidu）」という紛争解決の仕組みが、どう生まれ、どう受け止められているかを調べた。", "p3": "告発者、告発された作家、仲介者の17人への面接を行った。この仕組みでは、告発者が作家に生配信での制作を求め、共同体が、問題の作品をAIなしで作ったかを投票で決める。双方が仲介者に金を預けることも多い（抄録）。", "p5": "この仕組みは、作者性の検証を作品そのものから作家へ移し、生配信での制作の労働、共同体による裁定、賭けを使って来歴を確かめ、AIの使用をめぐる共同体の規範を交渉する場になっていた（抄録）。", "fun": "絵の依頼の世界では、人が手で描いたことに価値がある。AIを使ったと疑われた作家は、どうやって潔白を示せばよいか。そこで生まれたのが、疑われた作家が生配信で新しい絵を描き、見ている人たちが投票で白黒をつける仕組みだ。作品ではなく「描く過程」を証拠にするわけで、実演で確かめる発想が面白い。", "unverified": "仕組みの有効性とリスクについての参加者の具体的な評価、事例の件数は抄録になく未確認。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "親たちの生成AI観は2年で「新奇」から「不可避」へ", "title": "\"I feel like AI is just everywhere\": A longitudinal qualitative study on parents' perceptions, use, and mediation of GenAI", "url": "https://arxiv.org/abs/2611.28861", "authors": "Jennica Li ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "生成AIに対する親の認識・利用・子どもへの関わり方の変化を、以前の研究に参加した親10人への2年後の面接でたどった。親たちは、生成AIを目新しいものと見る段階から避けられないものと感じる段階へ移り、限定的な道具という見方から開発の規制が必要という考えへ、個人の対処から長期的な影響を抑える制度的な計画を求める姿勢へと変わった。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIに対する親の認識・利用・子どもへの関わり方が2年間でどう変わったかを、同じ親への追跡の面接で明らかにした。", "p3": "家族の生成AIの経験についての以前の研究に参加した親10人に、2年後に面接を行った縦断的な質的研究である（抄録）。", "p5": "親たちは、生成AIを目新しいものと考える段階から避けられないものと感じる段階へ移った。限定的な道具という捉え方から開発の規制が必要という考えへ、個人の対処への注目から長期的な影響を抑える制度的な計画を求める姿勢へと変わった（抄録）。", "fun": "新しい技術が出てきたとき、親はまず家庭の中での使わせ方の工夫を考える。2年後に同じ親たちに聞くと、話は変わっていた。AIは避けようがないと感じ、家庭の工夫だけでは足りないので社会の仕組みで対応してほしいと考えるようになっていた。個人の問題が社会の問題へと見え方を変えていく過程が記録されている。", "unverified": "10人という少人数の面接で、国や属性の詳細は抄録になく未確認。"}}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "重みを公開する最先端AIのリスク管理の枠組み", "title": "Frontier Open-Weight AI Risk Management Framework", "url": "https://arxiv.org/abs/2611.28082", "authors": "Brian Tse ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "重みを公開するモデルは、公開を取り消せない、微調整で安全策を外せる、利用を監視できないという固有のリスクを持つ。リスクの評価から緩和・統治までの管理の全過程を、公開モデルの性質に合わせて組み直した枠組みを、Concordia AIとZ.AIが共同で示した。開放性と安全性の緊張のすべてを解くものではないと著者らは明記している。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "重みを公開する最先端のAIモデルに固有のリスクを管理するため、リスクの評価から緩和・統治までの全過程を公開モデルに合わせて組み直した枠組みを示した。", "p3": "公開は取り消せない、微調整で安全策を外せる、利用を監視したりモデルを回収したりできる単一の主体がいない、という性質に合わせて、リスク管理のライフサイクルを適応させる。Concordia AIとZ.AIが共同で作成した（抄録）。", "p5": "開放性と安全性の緊張のすべてを解決するものではなく、それに対処するための包括的で証拠に基づく土台を提供するとしている。研究者・開発者・政策立案者・市民社会に、この枠組みの上に積み上げるよう呼びかけている（抄録）。", "fun": "AIの中身（重み）を誰でも入手できるように公開すると、研究や改良が進み、恩恵が広く行き渡る。一方で、一度公開したものは取り戻せず、安全のための仕掛けも外されうる。使われ方を見張れる人もいない。この文書は、そうした「出したら戻せない」ものの危険を、評価から対応まで、どう管理するかを整理した。", "unverified": "枠組みの具体的な手順や基準、実際の適用例は抄録になく未確認。実証研究ではなく枠組みの提案である。"}}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "大規模共同研究の約束事を最初に決める道具", "title": "Planning and Agreement for Collaborative Teams (PACT): Introducing a Tool to Facilitate Research Collaboration", "url": "https://doi.org/10.31222/osf.io/9kwnq", "authors": "Bjørn Sætrevik ほか", "venue": "MetaArXiv", "date": "2026-11-24", "why": "複数の所属の研究者が共同する大規模なチーム科学では、共同の計画が最初に明確にされず、期待のずれが混乱や対人の衝突を生みやすい。共同研究の開始時に期待と規則を明示的に計画し、合意して共有するための道具PACTを紹介する。既存の計画の道具では新しい研究計画の共同の計画を十分に支えられないことが動機である。", "explain": {"basis": "抄録", "basis_note": "MetaArXivの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "複数の機関の研究者による共同研究で、開始時に期待と取り決めを明示して合意するための計画の道具PACTを紹介した。", "p3": "共同研究を始める人が、プロジェクトの組織、著者資格、研究の進め方、共同の過程、オープンサイエンスの原則、原稿の執筆過程、出版の計画について決定を整理し、計画として形にする。それを共同研究の候補者に示して期待をそろえる（抄録）。", "p5": "論文は、道具の考え方と開発の経緯、扱う領域を説明し、使い方の手引きを示す。道具の効果を検証した結果は、抄録には示されていない（抄録）。", "fun": "多くの研究者が力を合わせる研究が増えているが、誰が著者になるのか、どう進めるのかといったことを最初に決めないまま始めると、あとで揉めやすい。悪気がなくても、思い描いていた姿が人によって違うからだ。この論文は、始める前に決めておくべきことを整理し、計画の形にまとめて共有する道具を提案している。", "unverified": "道具を使った共同研究で衝突が減ったかどうかの検証は抄録になく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "簡易な車両モデルでも走行計測から橋のたわみを復元", "title": "Simplified Vehicle Models for Drive-by Estimation of Road Profiles and Bridge Deflections Using the Inverse Newmark-Beta Method", "url": "https://doi.org/10.3390/app162311622", "authors": "Haifang He ほか", "venue": "Applied Sciences (Switzerland)", "date": "2026-11-24", "sjr": 0.555, "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "モード欠測と基準更新で失う損傷感度を定式化", "title": "Missing modes and baseline adaptation: Quantifying loss of stiffness-change sensitivity in bridge monitoring", "url": "https://doi.org/10.1177/10775463261511843", "authors": "Tien-Thuy Nguyen", "venue": "JVC/Journal of Vibration and Control", "date": "2026-11-24", "sjr": 0.588, "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "常微分方程式の同定で離散化誤差も同時にベイズ推定", "title": "Joint Bayesian Inferen ual analysis approach", "url": "https://doi.org/10.1057/s41310-026-00427-2", "authors": "Kam Chan ほか", "venue": "International Journal of Disclosure and Governance", "date": "2026-11-24", "sjr": 0.646, "citescore": 5.4, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr49", "rank": 49, "headline": "行政チャットボットへの住民の好みを実験で調べる", "title": "Designing inclusive AI in public service delivery: experimental evidence on individual preferences for government chatbots", "url": "https://doi.org/10.1080/14719037.2026.2765742", "authors": "Huan Wang ほか", "venue": "Public Management Review", "date": "2026-11-24", "sjr": 2.54, "citescore": 11.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr50", "rank": 50, "headline": "非線形の動的応答で不安定岩盤の劣化を同定", "title": "Identification of Structural Plane Deterioration in Unstable Rock Masses Using Nonlinear Dynamic Response", "url": "https://doi.org/10.1007/s00603-026-06140-4", "authors": "Mengjia Lyu ほか", "venue": "Rock Mechanics and Rock Engineering", "date": "2026-11-24", "sjr": 1.803, "citescore": 11.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経営学", "headline": "グーグルは出資先アプリを自社市場で優遇か", "title": "Gatekeepers and Kingmakers: Do Superplatforms Distort Digital Competition?", "url": "https://doi.org/10.1287/mnsc.2025.03354", "authors": "Umit G. Gurun ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "グーグルが市場の門番（Android）と戦略的な投資家（Google Ventures）を兼ねることの影響を、iOS版を対照にした差分の差分で調べた。出資を受けたスタートアップのAndroid版は、大きな更新がないのにレビュー数が115%多く、評価が12%高く、不具合の苦情が77%少なかった。選択的なレビューの削除とプラットフォーム上での推奨と整合し、プラットフォームの中立性に疑問を投げかける。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "固定資産税の増税で持ち家層は借りずに消費を切る", "title": "Taxing Homeowners Who Can't or Won't Borrow", "url": "https://doi.org/10.1093/restud/rdag127", "authors": "Francis Wong", "venue": "The Review of Economic Studies", "date": "2026-11-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "米国の数百万人の持ち家層の高頻度の行政データから、住宅価格の上昇に伴う固定資産税の増税への反応を調べた。転居しない人は消費を減らし、財務的な困窮を示すが、上がった住宅価値を担保に借りない。消費の反応は流動性によらず、困窮は流動性の乏しい層に集中する。増税は転居も促す。税の厚生費用の中心は財務困窮にあり、流動性の乏しい世帯の税を抑える政策の利得を示す。"}, {"id": "jn03", "rank": 3, "field": "情報システム", "headline": "AIの思考過程の表示は難問ほど誤った信頼も生む", "title": "Understanding the Prompting Effects of Chain-of-Thought on Human Collaboration with Generative AI", "url": "https://doi.org/10.1287/isre.2024.1314", "authors": "Xusen Cheng ほか", "venue": "Information Systems Research", "date": "2026-11-24", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "why": "生成AIの推論過程（Chain-of-Thought）を画面に示すことが、利用者の能力への信頼にどう影響するかを一連のオンライン実験で調べた。質の高い推論は難易度によらず信頼を高める。質の低い推論は、易しい課題で利用者が注意深く処理したときだけ信頼を下げ、難しい課題では透明性の知覚を通じてかえって信頼を高めた。推論の表示が誤答への過信につながる条件を示す。"}, {"id": "jn04", "rank": 4, "field": "因果推論", "headline": "潜在変数を説明変数に使う偏りを分割標本で補正", "title": "Correcting Bias When Using Latent Regressors", "url": "https://doi.org/10.1017/pan.2026.10068", "authors": "Connor Jerzak ほか", "venue": "Political Analysis", "date": "2026-11-24", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "why": "測定誤差のある潜在変数を回帰の説明変数に使うと、係数がゼロ方向に偏る。操作変数や合成法といった広く使われる補正は、潜在変数に適用するとそれ自体が偏り、誤差を無視した単純な回帰より悪いことも多いと示した。分割標本による相関に基づく補正を導出し、加法得点・因子・機械学習のどの測定とも組み合わせられる。応用では補正後の関係が最大50%強くなった。"}, {"id": "jn05", "rank": 5, "field": "因果推論", "headline": "分類器の性能評価は小さなテスト集合では当てにならない", "title": "Uncertain Performance: How to Quantify Uncertainty and Draw Test Sets When Evaluating Classifiers", "url": "https://doi.org/10.1017/pan.2026.10065", "authors": "Francisco Tomas-Valiente", "venue": "Political Analysis", "date": "2026-11-24", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "why": "社会科学では分類器で概念を測ることが増えたが、通常の大きさのテスト集合では性能指標の推定が非常に不安定で、まれなクラスを扱う不均衡な課題ではほとんど情報がないことを示した。性能指標の標本分布に基づく不確実性の定量化と、予測確率で層別する効率的な抽出を提案し、シミュレーションと実データで検討した。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "プラットフォームが売り手に渡す顧客情報の最適設計", "title": "Platform Information Design and Competitive Price Targeting", "url": "https://doi.org/10.1287/mksc.2023.0518", "authors": "Ruiqi Wu ほか", "venue": "Marketing Science", "date": "2026-11-24", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "why": "プラットフォームが個々の消費者の情報を売り手に与えると標的価格が可能になるが、市場を分割して競争を激しくもする。Steamの購買・利用の詳細データから異質な需要を推定し、均衡の標的価格モデルであらゆる情報設計の反実仮想を計算した。均衡への影響を織り込んだ利潤最大の設計は、それを無視した需要ベースの経験則より大幅に利潤が高い。"}, {"id": "jn07", "rank": 7, "field": "人口学", "headline": "大卒の市長はコロナ第1波の超過死亡を減らした", "title": "The Demographic Impact of Leadership: Mayoral Education and COVID‐19 Excess Mortality in Italy", "url": "https://doi.org/10.1111/padr.70096", "authors": "Francesco Mattioli ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "イタリアの週次の死亡統計から市町村別の超過死亡をベイズ階層の時空間モデルで推定し、接戦の市長選挙を使う回帰不連続デザインで市長の学歴の効果を識別した。大卒の市長は第1波の超過死亡を減らしたが、第2波では差がなかった。政策活動とSNS発信の大規模データは、迅速で的を絞った対応と、あおらない指針型の発信という2つの経路を示唆する。"}, {"id": "jn08", "rank": 8, "field": "人口学", "headline": "子の教育を伸ばすと親の健康格差が縮む", "title": "Reducing Health Inequality by Increasing Children's Education: A Two‐Generation Mediation Approach and Evidence from the United States", "url": "https://doi.org/10.1111/padr.70100", "authors": "Liying Luo ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "成人した子の教育が高齢の親の健康に影響するなら、子の教育を高めることは親の健康格差を広げるのか縮めるのか。米国の健康・退職調査の縦断データに多層の周辺構造モデルを当て、因果の推定対象を明確にして答えた。教育年数12年未満の親の健康上の不利は14〜37%減り、大卒の親の有利は変わらない。世代をまたぐ教育の向上が健康格差の縮小策になりうることを示す。"}, {"id": "jn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "取引の開示強化で企業集団は海外子会社を増やす", "title": "Coming Clean on Hidden Ties: How Transparency in Related‐Party Transactions Shapes Business Group Internal Organization", "url": "https://doi.org/10.1111/joms.70191", "authors": "Marina Gama ほか", "venue": "Journal of Management Studies", "date": "2026-11-24", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "2008年のブラジルの関連当事者取引の開示改革を自然実験として、上場・非上場の企業集団のデータで分析した。透明性が高まると、ピラミッド型の企業集団は上層の構造を組み替える一方、流出の対象になりやすい活動を開示規制の弱い国へ移すため海外の関連会社を増やした。開示改革は不透明さを消すのではなく、階層と地理の両面で組織の適応を引き起こす。"}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "フィンテックの融資はデータで未開拓市場から広がる", "title": "Fintech Expansion", "url": "https://doi.org/10.1093/rfs/hhag101", "authors": "Jing Huang", "venue": "The Review of Financial Studies", "date": "2026-11-23", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "データから学習しプラットフォーム上の売上を差し押さえられるフィンテックの貸し手と、物的担保に頼る銀行が競争する信用市場を理論的に分析した。情報取得が柔軟でも、均衡でのフィンテックの学習は単一のしきい値で質の低い借り手を除く粗いものになる。執行力の向上は銀行の利潤を損ない、情報技術の向上は利する。銀行のない市場での初期のデータが、より豊かな市場への拡大を支える。"}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "公正なふるまいで疲れる上司と楽になる上司の違い", "title": "Does following justice rules feel constraining or liberating for leaders? The moderating role of justice sensitivity", "url": "https://doi.org/10.1177/00187267261499914", "authors": "Mingyun Huai ほか", "venue": "Human Relations", "date": "2026-11-24", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "公正の規則に従うことが上司自身に与える心理的な帰結を、シナリオ実験（316人）と日誌法（上司52人・411観測）で調べた。公正への感受性が低い上司は、規則に従うと統制を失った感覚が強まり情緒的消耗が増える。感受性が高い上司は逆に統制を失った感覚が弱まり消耗が減る。組織的公正を、受け手ではなく実行する上司の側から捉え直した。"}, {"id": "jn12", "rank": 12, "field": "オペレーションズ・リサーチ", "headline": "在庫効率を上げると上流の排出はむしろ増える", "title": "Inventory Productivity and Carbon Emissions in Retailing", "url": "https://doi.org/10.1287/msom.2025.0660", "authors": "Nikolay Osadchiy", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-24", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "在庫の生産性が高いほど炭素排出が少ないという通念を、CDPの詳細な排出データと小売企業の財務データで検証した。排出削減の大半は事業規模に伴って生じる。規模を除くと、在庫生産性への外生的なショックは、スコープ3の購入した財・サービスを中心に排出原単位を高めた。効果は食品・医薬品以外の小売に集中する。リーン化の利益と上流の排出のトレードオフを示す。"}, {"id": "jn13", "rank": 13, "field": "オペレーションズ・リサーチ", "headline": "板情報の操作が最適になる条件を導き実データで確認", "title": "Spoofing and Manipulating Order Books with Learning Algorithms", "url": "https://doi.org/10.1287/opre.2025.1889", "authors": "Alvaro Cartea ほか", "venue": "Operations Research", "date": "2026-11-24", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "指値注文板の動学モデルから、マーケットメイカーにとって板を操作することが最適になる条件を導いた。在庫リスクへの許容度が高いほど操作的な戦略が最適になる頻度が上がり、操作は在庫を最適水準へ戻し往復取引の成立確率を上げる。見せ玉は、操作の注文が約定しないことを望む特殊例にあたる。ナスダックの高頻度データで、操作の条件が成り立つことを確かめた。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "管理職の人事への自信は中くらいが最も実行に効く", "title": "Confident and Well‐Connected: The Interplay of Line Managers' HR Self‐Efficacy, Brokerage, and HRM Implementation", "url": "https://doi.org/10.1002/hrm.70112", "authors": "Budy Purnawanto ほか", "venue": "Human Resource Management", "date": "2026-11-24", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "why": "現場の管理職による人事施策の実行を、人事に関する自己効力感と、人事の助言ネットワークでの仲介的な位置から説明した。インドネシア6社の管理職88人、部下325人、上司69人の多源データの多層分析で、自己効力感と実行の関係は逆U字で、中程度が最も良い。仲介の位置がこの曲線の形を調整し、実行はチームの成果と結びつく。"}, {"id": "jn15", "rank": 15, "field": "オペレーションズ・リサーチ", "headline": "ミールキットの過剰包装を文脈つきの学習で減らす", "title": "How Not to Overpackage: AI for Sustainability in HelloFresh’s Service Supply Chain", "url": "https://doi.org/10.1287/msom.2025.0640", "authors": "Evelyn Xiao-Yue Gong ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-24", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "食材宅配の箱ごとの保冷材の量と種類を、天候・輸送条件・中身などの文脈から逐次に選ぶ問題を定式化し、問題の構造を使うオンライン学習法CFPEを開発した。既存の方法では得られないÕ(√T)のリグレット上界を持つ。HelloFreshの実際の配送データによる数値実験で、文脈に合う包装構成を速く見つけることを確かめた。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "市場参加者の集中は流動性を上げ情報効率を下げる", "title": "CHILE", "url": "https://doi.org/10.1093/rfs/hhag100", "authors": "Efstathios Avdis ほか", "venue": "The Review of Financial Studies", "date": "2026-11-20", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "非対称情報・一般的な効用関数・任意のペイオフを許す資産価格の枠組みCHILEを提示した。経済が大きくなっても情報の総量が有限にとどまる、連続で異質な情報構造が特徴である。規模の異なる参加者の存在（集中）が市場の質に与える影響を分析し、集中の高まりは流動性を高めるが情報効率を損なうという両面性を示した。"}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "プライバシーは投資の意欲を守るが選別を弱める", "title": "Screening, Investment Incentives, and the Welfare Trade-Offs of Privacy", "url": "https://doi.org/10.1287/mnsc.2025.01507", "authors": "Anastasios Dosis ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "情報開示が、契約前の投資の誘因と契約の効率に与える影響をプリンシパル・エージェント・モデルで分析した。情報はプリンシパルの選別を助けるが余剰の収奪も容易にし、エージェントの投資意欲を弱める。効率的な情報政策の境界では、プライバシーが強いほど投資の誘因とエージェントの利得が高い。完全な秘匿・完全な開示・中間のどれが効率的かの条件を特徴づけた。"}, {"id": "jn18", "rank": 18, "field": "機械学習", "headline": "二次正則化つき最適輸送の解法が線形収束する保証", "title": "Polyak–Łojasiewicz Inequality for Quadratically Regularized Optimal Transport", "url": "https://doi.org/10.1137/26m1840441", "authors": "Alberto González-Sanz ほか", "venue": "SIAM Journal on Optimization", "date": "2026-11-24", "sjr": 1.671, "citescore": 4.4, "citescore_year": "2025", "why": "二次正則化つき最適輸送は疎な輸送計画を与え数値的に安定だが、双対問題は強凹でなく、線形収束の標準的な議論が使えなかった。連続・半離散の両方を含む緩い仮定のもとで、双対問題の局所的な誤差限界とポリャク・ウォヤシェヴィッチ不等式を明示的な定数つきで証明し、勾配上昇法や座標上昇法の線形収束を導いた。"}, {"id": "jn19", "rank": 19, "field": "人口学", "headline": "紛争と出生率の矛盾する知見を多層の経路で整理", "title": "Rethinking Fertility Responses to Armed Conflict: A Critical Review of Conflict–Fertility Research in Low‐ And Middle‐Income Countries", "url": "https://doi.org/10.1111/padr.70107", "authors": "Victor Emmanuel ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "低・中所得国の武力紛争と出生の実証研究27件を検討し、紛争への曝露の概念化と測定、適用された理論を評価した。既存の出生理論は制度の安定を前提にしており、単一の理論では知見の幅を説明できない。紛争はマクロ・メゾ・ミクロの複数の経路で同時に働き、種類・期間・強度によって出生を抑えも促しもすることを多層の概念枠組みで示した。"}, {"id": "jn20", "rank": 20, "field": "工学", "headline": "鋼管の腐食が進んだアーチ橋の耐震性能を評価", "title": "Seismic performance evaluation of long-span CFST arch ring structure considering steel uniform corrosion effects", "url": "https://doi.org/10.1142/s0219455428501064", "authors": "Fangting Wang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-24", "citescore": 6.5, "citescore_year": "2025", "why": "コンクリート充填鋼管アーチ橋の主要な耐震部材であるアーチリブについて、鋼の一様腐食が耐震性能に与える影響を評価した。中国南西部の長大上路式アーチ橋を原型にOpenSeesで有限要素モデルを作り、腐食なし・50年・100年のモデルに漸増動的解析を行って、変形とエネルギーの2指標による損傷を部材と構造全体の水準で比べた。"}, {"id": "jn21", "rank": 21, "field": "工学", "headline": "バンコクの信号つき横断歩道12か所の連続性を点検", "title": "Mobility Access and Route Continuity at Twelve Signal-Controlled Crossings in Bangkok, Thailand", "url": "https://doi.org/10.3390/infrastructures11120439", "authors": "Choomket Sawangjaroen", "venue": "Infrastructures", "date": "2026-11-24", "citescore": 5.7, "citescore_year": "2025", "why": "歩行者の連続した通行は、横断施設の部品の有無だけでなく配置に左右される。バンコクの信号つき横断歩道12か所の2022〜2023年の施設の記録を比べた。12か所すべてに縁石の傾斜路・歩行者信号・押しボタン・照明があったが、8か所に傾斜路に関する通行上の懸念、5か所に樹木や柱の障害があり、確認できた4つの安全島のうち1つは車いすで使えないとされた。改修の範囲を3つに整理した。"}, {"id": "jn22", "rank": 22, "field": "工学", "headline": "米国の道路安全マニュアルは欧州で使えるか", "title": "Transferability of Highway Safety Manual Safety Performance Functions and Calibration Factors in Europe: A Scoping Review", "url": "https://doi.org/10.3390/infrastructures11120438", "authors": "Vito Frangiamore ほか", "venue": "Infrastructures", "date": "2026-11-24", "citescore": 5.7, "citescore_year": "2025", "why": "米国のHighway Safety Manualの事故予測は米国のデータで較正されており、他地域への移転可能性の確認が要る。安全性能関数と較正係数の欧州での証拠をPRISMA-ScRに沿って整理したスコーピングレビューである。研究はイタリアに偏り、英国・ドイツ・オランダなどの証拠は限られる。欧州の証拠は方法としては一貫するが、地理とインフラの種類の面で偏りがあると結論する。"}, {"id": "jn23", "rank": 23, "field": "化学", "headline": "湿った排ガスからCO2だけを選ぶ多孔性材料", "title": "Halogenated Triazole-Based Metal–Organic Framework Achieves Ultra-Selective CO2 Capture under Humid Conditions", "url": "https://doi.org/10.1021/jacs.6c13451", "authors": "Armando Rigamonti ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "湿度の高い窒素主体の排ガスからCO2を選択的に回収する吸着材として、ハロゲン化したトリアゾールとシュウ酸の亜鉛系MOF（CALF-20-X）とその複合体を開発した。ハロゲンが細孔の窓を狭めて窒素の取り込みを抑え、CO2に合うポケットを作る。CALF-20-Clは0.15 bar・298 KでCO2を2.89 mmol/g吸着し、CO2/N2選択性は4074を超えた。相対湿度21%では水の取り込みが56%抑えられた。"}, {"id": "jn24", "rank": 24, "field": "化学", "headline": "CO2からプロパノールを作る新しい結合経路", "title": "Elusive *CH–*CHO Coupling Pathway for High-Performance CO2 Electroreduction to n-Propanol", "url": "https://doi.org/10.1021/jacs.6c15732", "authors": "Chenchen Fang ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "CO2の電気化学的還元でn-プロパノールを作る際の律速は、炭素2個と1個の中間体の結合である。2価と0価の銅が隣り合う安定な触媒の上で、*CHと*CHOが結合する経路を実現した。2価の銅が*CHOを強く吸着して*CHまで還元し、隣の0価の銅の*CHOと低い障壁で結合する。n-プロパノールのファラデー効率は18.1%、部分電流密度は72.4 mA/cm²だった。"}, {"id": "jn25", "rank": 25, "field": "材料科学", "headline": "非接触の摩擦帯電センサの寿命を電荷の逃げ方で予測", "title": "Charge Escape Mechanism and Lifetime Prediction of Non‐Contact Triboelectric Sensors", "url": "https://doi.org/10.1002/adma.75794", "authors": "Pengfei Wang ほか", "venue": "Advanced Materials", "date": "2026-11-24", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "why": "非接触型の摩擦帯電センサは表面電荷の散逸で寿命が決まる。表面電荷を保持される電荷と逃げる電荷に分け、電子トラップのエネルギー分布の理論から3つの散逸機構を整理し、寿命を予測する数理モデルを立てた。中間層・空隙・湿度の影響を調べ、10種の誘電体の耐久試験ではFEPが100 Hzで最長8,940時間の予測寿命を示した。"}, {"id": "jn26", "rank": 26, "field": "材料科学", "headline": "広いバンドギャップの新しい酸カルコゲン化物を2つ合成", "title": "Experimental and Computational Identification of Wide-Gap Quaternary Oxychalcogenides BaZn2OS2 and SrZn2OSe2", "url": "https://doi.org/10.1021/jacs.6c17075", "authors": "Tomoya Gake ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "ワイドギャップ半導体の候補として、アルカリ土類・亜鉛・酸素・カルコゲンの四元系を探索し、未報告のBaZn2OS2とSrZn2OSe2を合成した。第一原理計算は、どちらも直接遷移型のバンド構造で、電子と正孔の有効質量が小さいことを示す。一方で、固有欠陥によるキャリアの補償が起こりやすいとみられる。"}, {"id": "jn27", "rank": 27, "field": "統計学", "headline": "変数誤差モデルで測定誤差の分散は識別できるか", "title": "Identifiability of Measurement-Error Variance in Error-in-Variables Regression", "url     sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
