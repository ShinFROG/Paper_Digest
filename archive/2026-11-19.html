rg/10.2139/ssrn.7695584", "why": "ドイツのサプライチェーン・デューデリジェンス法の立法の節目での異常リターンを調べ、対象企業の株価が下がり、規模の小さい企業と早く対象になる企業ほど下落が大きいことを示す。持続可能性の責任を課す規制の遵守費用を市場が織り込むことを明らかにする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ドイツのサプライチェーン・デューデリジェンス法の立法の節目で、対象企業の株価は負に反応し、規模の小さい企業と早く対象になる企業ほど下落が大きかったことを示した（抄録）。未査読。", "p3": "立法過程の主要な節目の前後の異常リターンを分析し、投資家が遵守費用を株価に織り込むかを調べた（抄録）。", "p5": "対象企業は負の株価反応を示し、小さい企業と早期に対象になる企業でより大きく下落した。著者は、投資家が意味のある費用を見込んでいると解釈する（抄録）。", "fun": "取引先の工場で人権侵害がないかを調べる義務を企業に課す法律は、倫理的には歓迎される。では株式市場はどう受け止めたか。対象の企業の株価は下がり、とくに体力の小さい企業ほど下がった。良い目的の規制にも、誰がその費用を負うかという現実があることを株価が教えてくれる点が面白い。", "unverified": "本文は入手できず、異常リターンの大きさとイベントの日付は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "米国の関税ショックは金融ショックとして波及", "title": "Tariffs as Financial Shocks: Trade Policy Persistence and the Global Financial Cycle", "url": "https://doi.org/10.2139/ssrn.7700659", "authors": "Marcelo Silva", "venue": "SSRN", "date": "2026-11-17", "apa": "Silva, M. (2026). Tariffs as Financial Shocks: Trade Policy Persistence and the Global Financial Cycle. https://doi.org/10.2139/ssrn.7700659", "why": "ベイズ状態空間モデルで米国の関税率を一時的・恒久的な成分に分けて識別したショックを、合成した世界の金融環境指数と42か国の資本移動に追跡する。関税の引き上げで市場のボラティリティやドル高、新興国のソブリン・スプレッドなど世界の金融環境が引き締まることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の関税ショックは実物の貿易だけでなく、ドル高や新興国のスプレッド拡大、資本の引き揚げといった金融ショックとして世界に波及し、その形は関税が一時的か恒久的かで違うことを示した（抄録）。未査読。", "p3": "ベイズ状態空間モデルで米国の関税率の一時的・恒久的な成分のショックを識別し、合成した世界金融環境指数と、1994〜2024年の42の先進・新興国の資本移動への動的な波及を追った（抄録）。", "p5": "関税引き上げで市場のボラティリティが跳ね、ドルが上がり、新興国のソブリン・スプレッドが約100bp広がった。資本は主に証券投資の債券で引き揚げられ、一時的なショックでは4〜6四半期で戻るが恒久的なショックでは2年間低迷し、ドル建て債務の多い国で増幅された（抄録）。", "fun": "関税は「輸入品の値段が上がる」という貿易の話に見えるが、実はお金の流れも揺さぶる。米国が関税を上げると、世界の投資家がリスクを避けて新興国からお金を引き揚げ、借金の利回りが上がる。しかも、その関税が一時的か長く続くかで回復の速さが違った。政策の「長さ」が金融の安定を左右する点が面白い。", "unverified": "本文は入手できず、世界金融環境指数の構成は確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "記憶の長さが違う因子をもつ因子モデルの推定", "title": "Estimation and Model Selection in Factor Models with Long Memory", "url": "https://arxiv.org/abs/2611.22289", "authors": "Dominik Ammon ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Ammon, D., Hartl, T., & Tschernig, R. (2026). Estimation and Model Selection in Factor Models with Long Memory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22289", "why": "記憶の長さ（分数和分の次数）が未知で異なる共通因子をもつ近似因子モデルについて、水準のパネルに主成分分析を使う漸近理論を与える。標本共分散の固有値が記憶の長さで順序づけられることを使い、因子群の一致推定と分離を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記憶の長さ（分数和分の次数）が未知で異なる共通因子をもつ因子モデルで、水準のパネルに主成分分析を使えば因子を一致推定でき、差分をとると因子が見えなくなりうることを示した（抄録）。未査読。", "p3": "記憶d>1/2の非定常な因子群は標本共分散の固有値をNT^{2d−1}のオーダーで、定常な因子はNのオーダーで生むという順序づけを使い、主成分の一致性と因子群の分離の速さ、Bai–Ngの情報量基準の一致性を導き、モンテカルロと欧州308観測所の月平均気温に適用した（抄録）。", "p5": "水準での因子数の選択は差分後より個別の雑音に強かった。気温では2因子が選ばれ、第1因子は持続的な共通の温暖化で、2021〜2025年は1960〜1990年より2.15℃暖かく東欧で最も強かった。差分後は1因子しか選ばれず地域差が失われた（抄録）。", "fun": "たくさんの地点の気温データの裏には、全体に共通する「流れ」が隠れている。ゆっくり続く温暖化のような長い記憶をもつ流れと、短い揺らぎとを、データを加工せずに見分ける理論を作った。よく使われる「差をとってから分析する」方法では温暖化の地域差が消えてしまう、という注意も面白い。", "unverified": "本文は入手できず、経済・金融のデータへの適用例は確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "スケール不変性から頑健に有効な信頼集合", "title": "COSI: A Framework for Robustly Valid Inference", "url": "https://arxiv.org/abs/2611.22096", "authors": "Arun K. Kuchibhotla ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Kuchibhotla, A. K., Balakrishnan, S., & Wasserman, L. (2026). COSI: A Framework for Robustly Valid Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22096", "why": "分割した標本ごとの推定値を使うHulCを発展させ、多くの推定量が持つスケール不変性の検定を通る値を集めて信頼集合を作るCOSIを提案する。古典的なWald法やブートストラップより弱い仮定で漸近的に有効で、小標本で名目水準に近い被覆を得られるとする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多くの推定量に共通するスケール不変性を使い、古典的なWald法やブートストラップより弱い仮定で漸近的に有効な信頼集合を作る枠組みCOSIを提案した（抄録）。未査読。", "p3": "中央値不偏性で分割標本の推定値から信頼集合を作るHulCを発展させ、データを分割して各分割で推定し、分割ごとの推定値がスケール不変性の検定を通る候補の母数値だけを残す（抄録）。", "p5": "得られる信頼集合は弱い仮定で漸近的に有効で、小標本で被覆が名目水準に近くなりうる。平均、誤指定の線形モデルの回帰係数、テンソルのノルム、フレシェ平均の頑健な推論に適用した（抄録）。", "fun": "データから「真の値はこの範囲にある」と言うための信頼区間は、普通はデータの分布についてかなり強い仮定に頼っている。この研究は、データをいくつかの組に分けてそれぞれで推定し、推定値の並び方が「縮尺を変えても形が同じ」という性質を満たす値だけを残すという、仮定の少ない作り方を示した。発想が素朴なのに広く使える点が面白い。", "unverified": "本文は入手できず、被覆率の比較の数値は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "オンライン共形予測で外れ回数を守る代償", "title": "The Price of Hard Coverage Constraints in Online Conformal Prediction", "url": "https://arxiv.org/abs/2611.22646", "authors": "Mingrui Liu", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liu, M. (2026). The Price of Hard Coverage Constraints in Online Conformal Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22646", "why": "逐次の共形予測で、累積の外れ回数を常に予算内に収める厳しい被覆保証を課すときに、予測集合をどれだけ広げる必要があるかという避けられない効率の代償をT回の予測について特徴づける。独立同分布でスコアの分布が既知でもこの代償が残ることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "逐次の共形予測で外れ回数の累計を常に予算内に収める厳しい保証には、統計的に完全な知識があっても避けられない効率の代償があり、その大きさの最適な速度を特定した（抄録）。未査読。", "p3": "予測集合を1回ずつ出し、外れの累積回数を運用の全期間で予算内に保つ設定で、被覆と集合の大きさの関係についての正則条件の下、どのオンライン手法にも必要な余分な集合の大きさの累計の最小値をT回の予測について求めた（抄録）。", "p5": "最小の費用は、事前に決めた時点の期待費用でΘ(log T)、T以下の全時点での最大の期待費用でΘ(T^{1/3})、事後に評価時点を選ぶ最悪の実現費用でΘ(√T)で、これらはスコアの分布を知らずに過去のスコアだけで達成できる（抄録）。", "fun": "天気予報で「降水確率90%の区間」を毎日出すとき、平均で9割当たればよいのか、それとも「外れはどの時点でも決めた回数以内」と約束するのか。後者の厳しい約束を守るには、予報の幅を少し広げ続ける必要があり、その上乗せは答えを完璧に知っていてもゼロにはならない。信頼性を常に守るには必ず代償がいる、という理論が面白い。", "unverified": "本文は入手できず、数値実験の有無は確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "統計学", "headline": "観測変数が多ければ識別の曖昧さは急速に消える", "title": "Identifiability of latent variable models with flexible latent distributions", "url": "https://arxiv.org/abs/2611.23052", "authors": "Chengyu Cui ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Cui, C., & Xu, G. (2026). Identifiability of latent variable models with flexible latent distributions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23052", "why": "潜在分布を自由に学習する潜在変数モデルでは、厳密な識別可能性がほとんどいたるところで成り立たず、異なるが任意に近いパラメータと潜在分布の組が同じ観測分布を生むことを示す。柔軟な潜在構造を使うモデルの解釈に注意を促す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "潜在分布を自由に学習する潜在変数モデルでは厳密な識別がほぼいたるところで成り立たないが、観測変数が多ければ識別の曖昧さは急速に小さくなり、一致推定と妥当な推論は可能なことを示した（抄録）。未査読。", "p3": "異なるが任意に近いパラメータと潜在分布の組が同じ観測分布を生むことを示したうえで、同じ周辺分布を生むパラメータの集合の直径で識別の曖昧さを測った（抄録）。", "p5": "曖昧さは観測変数の数pとともにexp{−c(log p)^2}という多項式より速い速度で消え、厳密な識別の失敗はパラメータと潜在分布の一致推定や妥当な推論の妨げにならない（抄録）。", "fun": "テストの点数の背後に「学力」という見えない量を仮定するモデルでは、見えない量の分布を自由にすると、答えが一つに決まらなくなる。この研究は、たしかに厳密には決まらないが、問題の数が増えればその不定さは急速に小さくなり、実用上は困らないことを示した。「決まらない」と「ほとんど決まる」の違いを丁寧に分けた点が面白い。", "unverified": "本文は入手できず、数値実験の結果は確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "小地域ごとの因果効果を経験最良予測で推定", "title": "Small Area Causal Inference", "url": "https://arxiv.org/abs/2611.22339", "authors": "Yilin Li ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Li, Y., Zhang, J., & Jiang, J. (2026). Small Area Causal Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22339", "why": "二重頑健推定ではなく経験最良予測（EBP）に基づいて、小地域ごとの因果効果を予測する枠組みを開発する。線形混合モデルの下で最尤推定の一致性と漸近正規性、地域別の因果効果の予測の平均二乗予測誤差の最小化を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小地域ごとの因果効果を、偏りだけでなく分散も考える経験最良予測（EBP）で推定する小地域因果推論（SACI）の枠組みを作り、二重頑健推定より平均二乗予測誤差が小さいことを示した（抄録）。未査読。", "p3": "線形混合モデルの下で、母数の最尤推定量の一致性と漸近正規性、地域別の因果効果の予測量の平均二乗予測誤差の漸近最適性、予測区間のための漸近正規性を示し、シミュレーションで二重頑健推定などと比べた（抄録）。", "p5": "提案のEBPは平均二乗予測誤差と、予測区間の被覆確率・長さで比較手法より大きく優れた。家畜の遺伝の実データ例も示した（抄録）。", "fun": "政策の効果を市町村ごとに知りたくても、小さな町ではデータが少なく、推定値がぶれてしまう。この研究は、似た地域の情報を借りて推定を安定させる「小地域推定」の技術を、因果効果の推定に組み合わせた。偏りをなくすことにこだわるより、ぶれを減らすほうが全体の誤差は小さくなる、という発想の転換が面白い。", "unverified": "本文は入手できず、シミュレーションでの改善の大きさは確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "高次元時系列の分布の変化点を計算制約下で検出", "title": "Distributional change point analysis: high dimensionality, nonstationary dependence, and computational constraints", "url": "https://arxiv.org/abs/2611.22422", "authors": "Leheng Cai ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Cai, L., Xu, M., & Zhou, Z. (2026). Distributional change point analysis: high dimensionality, nonstationary dependence, and computational constraints (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22422", "why": "非定常な時間依存をもつ高次元時系列で、特性関数に基づく疎なランダム射影により雑音の蓄積と計算量を抑えて分布の変化点を検出する。射影の必要数が次元の多項式で増えることを示し、ガウス乗数ブートストラップで誤検出の制御を保証する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "非定常な時間依存をもつ高次元時系列で、分布全体の変化点を、特性関数に基づく疎なランダム射影により計算量を抑えて検出・位置推定する方法を示した（抄録）。未査読。", "p3": "無関係な座標からの雑音の蓄積と計算費用を抑える疎なランダム射影を提案し、必要な射影数が次元の多項式で増えることを示す。局所的な経験特性関数の対比に基づくガウス乗数ブートストラップで非定常な依存に対応した（抄録）。", "p5": "誤検出の漸近的な制御と、複数の変化点の数と位置の同時推定の保証（対数因子を除きほぼパラメトリックな位置推定の速度）を示し、シミュレーションと神経の記録で有効性を示した（抄録）。", "fun": "何千もの信号を同時に記録していると、「平均」ではなく「ばらつき方」や「形」が変わる異変も起きる。すべての信号を調べるのは重すぎるので、この研究は信号をランダムに少しずつ混ぜて見る「投影」を使い、計算を軽くしながら異変を逃さない方法を作った。でたらめに選んだ見方でも理論的に保証できる点が面白い。", "unverified": "本文は入手できず、神経の記録での具体的な検出結果は確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "欠測のMAR仮定を因果の経路で特徴づける", "title": "A mechanistic characterization of missingness at random", "url": "https://arxiv.org/abs/2611.22022", "authors": "Maya B. Mathur ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Mathur, M. B., Zhang, W., Seaman, S., Bhattacharya, R., & Shpitser, I. (2026). A mechanistic characterization of missingness at random (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22022", "why": "欠測が無作為（MAR）という抽象的な独立性の仮定を、変数が欠測すると一部の矢印が働かなくなるよう修正したDAGの経路の条件で特徴づける。実務家が欠測の発生メカニズムから仮定の妥当性を判断できるようにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "欠測が無作為（MAR）という抽象的な仮定を、変数が欠測すると一部の矢印が働かなくなるよう修正したDAGの経路の条件として特徴づけ、補助変数は多く入れるほどよいとは限らないことを示した（抄録）。未査読。", "p3": "欠測時に一部の因果の矢印が働かなくなる「文脈依存の因果的無関連（CSCI）」を許すDAGで、忠実性の下でMARが成り立つ必要十分条件をMARを破る経路の不在として示し、多重代入などで完全な補助変数を加える場合の識別条件を導いた（抄録）。", "p5": "補助変数を加えた解析が目標の分布を回復するのは補助変数と合わせてMARが成り立つときに限られ、目標変数や欠測の指標の祖先である補助変数の集合で足りる。ストックホルムの公衆衛生コホートでは所得を補助変数に入れると推定が0の方向に弱まった（抄録）。", "fun": "アンケートの未回答を補う統計の技法は、「欠けたのは偶然とみなせる」という仮定に頼っている。この研究は、その仮定を「なぜ答えなかったのか」という因果の筋道の言葉に翻訳した。すると、補助の情報は多く入れるほど安全という常識に反して、入れることでかえって仮定が崩れる場合があると分かった点が面白い。", "unverified": "本文は入手できず、シミュレーションの設定と推定値の変化の大きさは確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "NZの農業補助金撤廃は生産性を上げたか", "title": "Causal effects of liberalization on agriculture in New Zealand", "url": "https://doi.org/10.2139/ssrn.7700061", "authors": "Vicente Moreno Casas", "venue": "SSRN", "date": "2026-11-17", "apa": "Moreno Casas, V. (2026). Causal effects of liberalization on agriculture in New Zealand. https://doi.org/10.2139/ssrn.7700061", "why": "農業自由化の代表例とされる1984年のニュージーランドの農業支援の撤廃を、改革しなかった10か国による合成コントロールで評価する。農業の全要素生産性への効果は検出されず、生産の構成の組み替えが起きたとし、通説の前後比較による解釈を見直す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1984年のニュージーランドの農業支援の撤廃は、合成コントロールで評価すると農業の全要素生産性を高めておらず、生産の構成を組み替えたことを示した（抄録）。未査読。", "p3": "同じ期間に改革しなかった構造の似た10か国から合成コントロールを作り、1984〜1994年の農業の全要素生産性と部門構成の4指標への改革の効果を推定した（抄録）。", "p5": "全要素生産性への効果は検出されず、生産の構成の組み替えがみられた。生産額の35%に当たる支援を失っても、支援を続けた比較国に遅れをとることもなかった（抄録）。", "fun": "補助金をやめれば農家が効率的になる、という話の代表例がニュージーランドだった。ところが、その根拠は改革の前後を比べただけだった。似た国を組み合わせて「もし改革しなかったら」を作って比べると、生産性は上がっておらず、作るものの組み合わせが変わっただけだった。有名な通説を、比べ方を変えて見直した点が面白い。", "unverified": "本文は入手できず、部門構成の4指標の具体的な変化は確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "視覚と言語を混ぜる時期のスケーリング則", "title": "Scaling Laws for Vision-Language Fusion", "url": "https://arxiv.org/abs/2611.22351", "authors": "Seng Pei Liew ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liew, S. P., Suzuki, T., & Tokui, S. (2026). Scaling Laws for Vision-Language Fusion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22351", "why": "言語モデルに後から画像を学ばせる後期融合と、事前学習の最初から混ぜる早期融合の得失を、学習の動きの分析から整理する。融合時の検証損失を基本の学習軌道とそこからのずれに分けてモデル化し、高価で経験則に頼っていた学習手順の設計に指針を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "視覚と言語を混ぜる事前学習の検証損失を、データ型ごとの基本の学習軌道と、モダリティ間の競合による分布のずれに分けて表すスケーリング則を導き、早期融合と後期融合の得失を定量化した（抄録）。未査読。", "p3": "既存の言語モデルに画像を後から学ばせる後期融合と、最初から混ぜる早期融合の学習の動きを系統的に分析し、混合比・学習ステップ・モデルの大きさにわたって損失を予測する統一的な法則を導いた（抄録）。", "p5": "データ量を固定すると、早期融合は言語の性能を保ち、後期融合は視覚の性能に有利で、モデルが大きくなるほど早期融合に傾く。多くの実験で法則が学習の動きを捉えることを確かめた（抄録）。", "fun": "画像も文章も分かるAIを作るとき、まず文章を学ばせてから画像を足すか、最初から両方を混ぜて学ばせるか、という選び方がある。この研究は、二つのやり方の学習の進み方を一つの式で予測できるようにした。小さなAIでは後から足すほうがよいこともあるが、大きくなるほど最初から混ぜるほうが得になる、という傾向が見えた点が面白い。", "unverified": "本文は入手できず、実験に使ったモデルの大きさの範囲は確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "LLMの推論でMCTSは数えるものを間違えている", "title": "MCTS Is Counting the Wrong Thing: Learning Exploration Counts for LLM Reasoning", "url": "https://arxiv.org/abs/2611.22301", "authors": "Xuan Zhang ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Zhang, X., Zhou, Z., Hu, Z., Feng, Y., Hao, H., Qi, Y., & Qu, C. (2026). MCTS Is Counting the Wrong Thing: Learning Exploration Counts for LLM Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22301", "why": "LLM推論でのモンテカルロ木探索は、同じ推論戦略の言い換えに別々の訪問回数を与えて探索ボーナスを重複させることを指摘し、この断片化が後悔を増やすことを理論的に示す。方策の隠れ表現から擬似的な訪問回数を学習するLPC-MCTSを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの推論でのモンテカルロ木探索は同じ推論戦略の言い換えに別々の訪問回数を与えて探索を無駄にしており、隠れ表現から擬似的な訪問回数を学ぶLPC-MCTSで改善できることを示した（抄録）。未査読。", "p3": "UCTの探索の統計量だけを変え、方策の隠れ表現に付けた軽いCoin-Flipping Networkの頭部で表現の網羅度を推定し、関連する枝が探索の証拠を共有できるようにした。回数の断片化が累積後悔を増やすことを理論的に示した（抄録）。", "p5": "5つの数学推論と7つの検索のベンチマークで強いMCTSの基準を一貫して上回った。推論時に回数だけを置き換えると数学の平均mean@16がQwen2.5-7Bで3.79ポイント、Qwen3-4Bで2.71ポイント上がり、学習と推論の両方で使うと4.96と4.37ポイント上がった（抄録）。", "fun": "迷路を探索するとき、同じ道を言い方を変えて何度も「新しい道だ」と数えてしまったら、探索は無駄だらけになる。AIの推論での木探索にもこの問題があり、言い回しが違うだけの同じ考え方を別物として数えていた。考え方の中身が似ているかをAI自身に判定させて数え直すと、少ない探索で正解に近づけた点が面白い。", "unverified": "本文は入手できず、検索ベンチマークでの改善の数値は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "画像群から4次元の形状と運動を復元する基盤モデル", "title": "π^4: A Foundation Model for 4D Scene Geometry and Motion", "url": "https://arxiv.org/abs/2611.23144", "authors": "Yifan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "apa": "Wang, Y., Zhao, W., Yang, N., Guo, H., Dong, J., Zhang, W., & Shen, C. (2026). $π^4$: A Foundation Model for 4D Scene Geometry and Motion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23144", "why": "1枚の画像・順不同の画像群・動画から、密な形状、カメラ姿勢、実寸のスケール、2D・3Dの点の追跡と動く物体のマスクを一つのモデルで推定する。形状の評価で総合的に最もよい平均順位を得たと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1枚の画像・順不同の画像群・動画のどれからでも、密な形状、カメラ姿勢、実寸のスケール、2D・3Dの点の追跡、動く物体のマスクを一度の順伝播で推定する4次元の基盤モデルπ^4を示した（抄録）。未査読。", "p3": "形状の枝と、形状を条件とする運動の枝を結合し、画像上の対応を再構成した目標視点の形状で3次元に持ち上げる。共有の骨格で全体は約0.5Bパラメータと、多くの基準モデルの半分未満である（抄録）。", "p5": "形状の評価で総合的に最もよい平均順位を得て、単視点・多視点の2D・3Dの点追跡と動く物体の分割でも競争的だった。最大64視点の文脈で学習しながら、数千枚の画像の大規模な場面も扱えた（抄録）。", "fun": "スマホで撮った写真や動画から、写っている場所の立体の形と、そこで動いているものの軌跡を一度に取り出せたら便利だ。このモデルは、カメラの設定が分からない普通の写真からでも、形と動きを同時に復元する。学習では最大64枚の組しか見ていないのに、数千枚の写真の大きな場面まで扱える点が面白い。", "unverified": "本文は入手できず、ベンチマークごとの数値は確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "光で形状記憶ポリマーの振動特性を時空間に制御", "title": "Spatiotemporal programming of shape memory polymers for tunable vibration responses", "url": "https://arxiv.org/abs/2611.21930", "authors": "Samantha Averitt ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Averitt, S., Sim, J., & Zhao, R. R. (2026). Spatiotemporal programming of shape memory polymers for tunable vibration responses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21930", "why": "炭素を混ぜた形状記憶ポリマーの表面に光のパターンを投影して温度分布を作り、弾性波の伝わり方と振動モードを空間と時間の両方で書き換えられるメタマテリアルを示す。透過スペクトルや振動モードを再構成できる適応的な構造の設計の幅を広げる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "炭素を混ぜた形状記憶ポリマーの表面に光のパターンを投影して温度分布を作り、弾性波の伝わり方と振動モードを空間と時間の両方で書き換えられるメタマテリアルの基盤を示した（抄録）。未査読。", "p3": "光熱でプログラムできる形状記憶ポリマー（C-SMP）に利用者が決めた光のパターンを当て、空間的な熱機械特性の分布を作り、空間と時間をともに設計変数として扱う（抄録）。", "p5": "透過スペクトルの調整や振動モードのプログラムなど、幅広い弾性波の機能を一枚のC-SMPの表面で実現できたと述べる（抄録）。抄録には数値の記載がない。", "fun": "形状記憶ポリマーは温めると柔らかくなる性質をもつ。この研究は、光で好きな模様に温めることで、板の一部だけを柔らかくし、揺れの伝わり方を自在に変えられるようにした。しかも模様を時間とともに変えられるので、同じ板が場面に応じて別の振動の部品として働く。光で振動を描き替えるという発想が面白い。", "unverified": "本文は入手できず、透過の変化の大きさなどの数値は確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "浮体式洋上風車の船体形状を連成時刻歴で設計", "title": "Nonlinear Coupled Time-Domain Modeling of Hull Geometry Effects for Improved Dynamic Response of Floating Wind Platforms", "url": "https://doi.org/10.21203/rs.3.rs-11457709/v1", "authors": "Mohammad Javad Eslahi ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Eslahi, M. J., Kazemi, S., Ezam, M., & Hasanabad, M. G. (2026). Nonlinear Coupled Time-Domain Modeling of Hull Geometry Effects for Improved Dynamic Response of Floating Wind Platforms. https://doi.org/10.21203/rs.3.rs-11457709/v1", "why": "空力・流体力・制御・構造の動力学を一体で解く時刻歴の連成解析に、非線形の波の運動学と粘性減衰を入れ、浮体式洋上風車のセミサブ型浮体の柱寸法とヒーブプレートを遺伝的アルゴリズムで探索する。線形・分離した解析が見落とす二次の漂流力や過渡応答を考慮した設計を示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "空力・流体力・制御・構造を一体で解く非線形の連成時刻歴解析と遺伝的アルゴリズムで、浮体式洋上風車のセミサブ浮体の形状を設計し、ヒーブの固有振動数を波のエネルギーの主帯域から外せることを示した（抄録）。未査読。", "p3": "非線形の波の運動学、粘性減衰、時刻歴の空力の相互作用を一つのソルバーに入れ、柱の寸法とヒーブプレートの形状を遺伝的アルゴリズムで探索し、不規則波の海況で評価した（抄録）。", "p5": "形状の変更が浮体の運動の感度を直接左右し、改良した形状でヒーブの固有振動数が波の主帯域より下がり、ピッチは渦放出とロータの空力減衰で安定した。参照データとの比較で推力と駆動系のトルクの過渡的な標準偏差が大きく下がったとする（抄録）。", "fun": "海に浮かぶ風車は、波に合わせて上下に揺れると発電が乱れ、部品も傷む。この研究は、浮きの柱の太さや下に付ける板の形をコンピュータで試行錯誤し、浮体が揺れやすい周期を、波がいちばん強く押す周期からずらした。複雑な制御を足すのではなく、形を工夫するだけで揺れを抑える発想が面白い。", "unverified": "本文は入手できず、標準偏差の低減率などの数値は確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "二次経路補償で薄肉部品の切削びびりを抑制", "title": "Secondary-Path-Compensated FxLMS Active Control of Milling Chatter in Thin-Walled Workpieces", "url": "https://doi.org/10.21203/rs.3.rs-10982997/v1", "authors": "Zicheng Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Wang, Z., Wang, C., Zhu, B., He, W., Cai, M., Zhao, G., & Yang, Y. (2026). Secondary-Path-Compensated FxLMS Active Control of Milling Chatter in Thin-Walled Workpieces. https://doi.org/10.21203/rs.3.rs-10982997/v1", "why": "圧電アクチュエータで薄肉部品のびびり振動を能動制御する際、制御出力が計測点に届くまでの二次経路の利得・位相・遅れが更新方向を偏らせる問題に、等価な制御力-加速度モデルで参照信号を前処理するFxLMS法で対処する。アルミ板の実験で実装する。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "薄肉の部品の切削びびりの能動制御で、制御出力が計測点に届くまでの二次経路を補償するFxLMS法により、通常のLMSよりはるかに大きく振動を抑えられることを示した（抄録）。未査読。", "p3": "等価な制御力-加速度モデルを二次経路の推定に使って参照信号を前処理するFxLMS法を、四隅支持の6061アルミ板（300×300×4 mm）、圧電スタック、加速度1チャンネルの装置に実装し、シミュレーション、実測信号のオフライン試験、切削試験で評価した（抄録）。", "p5": "総遅れ0.8 msでLMSは定常RMS応答を8.1%しか減らさず558.857 Hz成分を増幅したが、FxLMSは82.9%減らした。4,000・7,000・10,000 r/minの切削で振幅は約75.0%・66.7%・50.0%、算術平均粗さRaは65.6%・53.6%・15.6%減った（抄録）。", "fun": "薄い金属板を削ると、板が細かく震えて表面がでこぼこになる。逆向きの揺れをぶつけて打ち消す制御があるが、命令が板に届くまでのわずかな遅れが邪魔をして、かえって揺れを増やすこともある。この研究は、その遅れの通り道をあらかじめ計算に入れることで、揺れを8割以上消した。遅れを無視しないだけで結果が大きく変わる点が面白い。", "unverified": "本文は入手できず、高速での効果の低下の原因の詳しい分析は確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "工学", "headline": "崩壊時の強度で設計する耐震設計の考え方", "title": "The Philosophy of Collapse-Based Design of Structures: A Modern and Unified Framework for Seismic Practices", "url": "https://doi.org/10.2139/ssrn.7702200", "authors": "Vahid Jaberi", "venue": "SSRN", "date": "2026-11-18", "apa": "Jaberi, V. (2026). The Philosophy of Collapse-Based Design of Structures: A Modern and Unified Framework for Seismic Practices. https://doi.org/10.2139/ssrn.7702200", "why": "等価荷重と低減係数に頼る現行の耐震設計に代わり、構造が崩壊すると見込まれる地震強度で解析し、各部材をその荷重での最大耐力で設計する崩壊ベース設計の考え方を示す。崩壊強度は設計スペクトルを3つの係数で引き上げた崩壊スペクトルで事前に求める。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "構造が崩壊すると見込まれる地震強度で解析し、各部材をその荷重での最大耐力で設計する崩壊ベース設計（CBD）の考え方を、現行の耐震設計に代わる統一的な枠組みとして示した（抄録）。未査読の論考。", "p3": "崩壊強度を、設計スペクトルをスペクトル加速度比・設計スペクトル比・崩壊余裕比の3つの係数で引き上げた崩壊スペクトルで事前に求め、耐久時間法で高速に行う漸増の非線形時刻歴解析で、靭性部材は塑性耐力、非靭性部材は弾性耐力、接合部と基礎は伝わる最大荷重で設計する（抄録）。", "p5": "解析が終局耐力に達するため、過剰強度・靭性・不整形・P-Δなどの影響が直接結果に入り、応答修正係数や強柱弱梁の照査などが不要になり、崩壊余裕比や動的な耐力曲線も同時に得られると述べる（抄録）。", "fun": "今の耐震設計は、計算機が遅かった時代に作られた「割り引き」や「補正」の係数をたくさん使っている。この論考は、今の計算機なら建物が実際に壊れる揺れの強さまで直接計算できるのだから、その結果で設計すれば係数は要らない、と主張する。道具の進歩に合わせて設計の考え方そのものを作り直そうとする点が面白い。", "unverified": "本文は入手できず、これまでの研究との比較結果の詳細は確認できなかった。既存の設計基準での検証の程度も未確認。"}}, {"id": "pn47", "rank": 47, "field": "地震工学・防災", "headline": "誘発地震の応力降下は規模とともに増える", "title": "Scale-dependent stress drop scaling of induced earthquakes driven by tensile-to-shear transition: Evidence from the Gonghe EGS field, China", "url": "https://doi.org/10.21203/rs.3.rs-11505756/v1", "authors": "Cong Jiang ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Jiang, C., & Jiang, C. (2026). Scale-dependent stress drop scaling of induced earthquakes driven by tensile-to-shear transition: Evidence from the Gonghe EGS field, China. https://doi.org/10.21203/rs.3.rs-11505756/v1", "why": "共和の地熱開発（EGS）の微小地震で、経験的グリーン関数のスペクトル比とブートストラップにより震源パラメータの不確実性を定量化し、応力降下と地震モーメントに正の相関（自己相似でない）があることを示す。地質条件や操業段階が違っても頑健だとする。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国の共和の地熱開発（EGS）の誘発地震で、応力降下が地震モーメントとともに増える自己相似でないスケーリングを示し、それを引張から剪断への破壊様式の移行で説明するモデルを提案した（抄録）。未査読。", "p3": "高品質の微小地震のデータで、経験的グリーン関数のスペクトル比とブートストラップにより震源パラメータの不確実性を定量化し、均質な基盤から断層の発達した区域まで地質条件の異なる場所でスケーリングの頑健さを調べた（抄録）。", "p5": "応力降下と地震モーメントに有意な正の相関があり、地質条件や操業段階によらず頑健だった。P波のスケーリング指数（約0.72）はS波（約0.57）を系統的に上回り、コーナー周波数の比は規模とともに約1.0から剪断の理論限界へ近づいた（抄録）。", "fun": "地震は大きさが違っても同じ形の縮小コピーだという「自己相似」の考えは、揺れの予測の土台になっている。地熱開発で起きる小さな地震を詳しく調べると、小さな地震は岩が開くような割れ方、大きな地震はずれる割れ方で、応力の下がり方が規模で変わっていた。小さな地震が大きな地震の単なる縮小版ではない、という発見が面白い。", "unverified": "本文は入手できず、解析した地震の数と規模の範囲は確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "地震工学・防災", "headline": "トルコの年間地震数の変動を隠れマルコフで表す", "title": "Regime Switching or Overdispersion: A Comparison of Poisson Hidden Markov and Negative Binomial Models for Annual Seismicity in Türkiye", "url": "https://doi.org/10.21203/rs.3.rs-11119485/v1", "authors": "Hakan Karaca", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Karaca, H. (2026). Regime Switching or Overdispersion: A Comparison of Poisson Hidden Markov and Negative Binomial Models for Annual Seismicity in Türkiye. https://doi.org/10.21203/rs.3.rs-11119485/v1", "why": "地震の時間的な群発で生じる過分散を、ポアソン型と負の二項型の隠れマルコフモデルで比べ、トルコの年間地震数を2状態のポアソン隠れマルコフモデルが最もよく表すとする。地震活動の状態の切り替わりを捉える。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "トルコの年間地震数は、2つの活動水準を行き来する2状態のポアソン隠れマルコフモデルが最もよく表すことを示した（抄録）。未査読。", "p3": "地震の群発と余震による過分散を、ポアソン隠れマルコフモデルと負の二項隠れマルコフモデルで比べ、AICとBICでモデルを選んだ（抄録）。", "p5": "2状態のポアソン隠れマルコフモデルがAIC・BICの両方で選ばれた。BICでは1状態の負の二項モデルも競争的で、状態内の過分散も変動の一部を説明すると述べる（抄録）。", "fun": "地震の回数は年によって大きくばらつく。そのばらつきが「地震が多い時期と少ない時期が切り替わる」ためなのか、「もともとばらつきが大きい」ためなのかは、見分けが難しい。トルコのデータでは、二つの時期の切り替えとして見るほうがよく当てはまった。同じばらつきでも、背後の仕組みの解釈が分かれる点が面白い。", "unverified": "本文は入手できず、使った年数と地震の規模の下限は確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "環境・気候政策", "headline": "炭素クレジットの健全性に市場はいくら払うか", "title": "Estimating Integrity Premiums within Voluntary Carbon Markets", "url": "https://doi.org/10.2139/ssrn.7693998", "authors": "Frank Howard", "venue": "SSRN", "date": "2026-11-17", "apa": "Howard, F. (2026). Estimating Integrity Premiums within Voluntary Carbon Markets. https://doi.org/10.2139/ssrn.7693998", "why": "約15,000件の取引価格とクレジットの格付けを組み合わせ、自然由来の72プロジェクトのクレジットについて、環境上の健全性が価格にどう反映されるかを推定する枠組みを作る。先物による価格発見を補う情報を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ボランタリー炭素市場で、炭素クレジットの環境上の健全性に市場がいくらの価格を付けているかを推定する枠組みを作った（抄録）。未査読。", "p3": "AlliedOffsetsの約15,000件の価格とSylveraの格付けを組み合わせ、2022〜2025年にCMEのN-GEO先物に受け渡しできる農業・林業・その他の土地利用の72プロジェクトのクレジットについて、価格に影響する属性を分析した（抄録）。", "p5": "抄録には健全性のプレミアムの推定値の記載がなく、先物による価格発見を補う枠組みになると述べる（抄録）。", "fun": "企業が自分の排出を打ち消すために買う「炭素クレジット」には、本当に二酸化炭素を減らしているか怪しいものも混じる。この研究は、格付け会社の評価と実際の取引価格を突き合わせ、「確かなクレジット」にどれだけ高い値段が付いているかを測ろうとした。見えにくい品質の値段を市場データから読み解く点が面白い。", "unverified": "本文は入手できず、推定されたプレミアムの大きさは確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "環境・気候政策", "headline": "流域の「水破産」を制度の条件で類型化", "title": "The Global Water Bankruptcy: Climate Stress, Institutional Path Dependency, and Policy Implementation Gaps in Post-crisis Basins", "url": "https://doi.org/10.2139/ssrn.7701318", "authors": "Unique Ndubuisi Keke", "venue": "SSRN", "date": "2026-11-18", "apa": "Keke, U. N. (2026). The Global Water Bankruptcy: Climate Stress, Institutional Path Dependency, and Policy Implementation Gaps in Post-crisis Basins. https://doi.org/10.2139/ssrn.7701318", "why": "水利用の負債が再生可能な水の賦存量を上回り制度が差を立て直せなくなった状態を水破産と定義し、10流域を制度の条件で崩壊・移行・改革可能に分類する。統治のよい流域でも制度的な障害に直面するという逆説を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "水利用の負債が再生可能な水の賦存量を上回り、制度が差を立て直せなくなった流域を「水破産」と定義し、10流域を制度の条件で類型化して、危機から改革までの速さが水の安全を左右すると論じた（抄録）。未査読。", "p3": "10流域を制度の条件で崩壊・移行・改革可能に分類する類型、危機の始まりから改革の実施までの年数を測る実施速度の指標、しきい値モデルと気候のリスク地図、問題駆動の反復的適応（PDIA）の準備度の得点を組み合わせた（抄録）。", "p5": "危機から改革までは平均23年かかり、高排出の中期のナイル川では猶予が17.9年と短く、アラル海とウルミア湖は70%のしきい値を超えていた。統治のよい流域が配分の硬直性で適応力を築きにくい逆説も示し、マレー・ダーリングの7年の改革を、遅れは縮められる例とする（抄録）。", "fun": "会社が借金を返せなくなるのが倒産なら、使う水が自然に補われる量を上回り続ける流域は「水の倒産」状態だ。この研究は、水不足の深刻さより、制度がどれだけ速く改革できるかで流域の運命が分かれると論じた。きちんと統治されている流域ほど、決まりが固くて変わりにくいという逆説も面白い。", "unverified": "本文は入手できず、 at Littidej ほか", "venue": "Smart Cities", "date": "2026-11-18", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr15", "rank": 15, "headline": "PSOとEnKFでSHMのセンサ配置を最適化", "title": "A hybrid PSO-EnKF framework for optimal sensor placement in structural health monitoring: modeling and comparative evaluation against GA-EnKF and SA-EnKF", "url": "https://doi.org/10.1108/sasbe-03-2026-0191", "authors": "Dana Nasr ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-11-18", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr16", "rank": 16, "headline": "GNSSのマルチパス誤差を連続関数で表す", "title": "INR-MHM: an implicit neural representation framework for continuous hemispherical modeling of GNSS multipath errors", "url": "https://doi.org/10.1186/s43020-026-00234-8", "authors": "Dongxu Li ほか", "venue": "Satellite Navigation", "date": "2026-11-18", "sjr": 3.423, "citescore": 19.9, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "GNSSのマルチパス誤差を、空の方向の連続関数として多システム・多周波で表す暗黙的ニューラル表現INR-MHMを提案し、斜面の監視局で搬送波位相の残差と3次元の測位誤差を大きく減らした（抄録）。", "p3": "離散の格子に頼る従来の半球図（MHM）の代わりに、多スケールのフーリエ空間符号化で座標を高周波の特徴空間に写してスペクトル偏りを抑え、幾何・周波数・信号品質を文脈ゲートで融合し、単差の搬送波位相のマルチパス補正を推定する。地すべりの監視局HF23と遮蔽の多い高速道路の斜面の監視局GZY12の21日間で評価した（抄録）。", "p5": "単差の搬送波位相の残差RMSはHF23で34.7〜72.2%、GZY12で52.4〜61.0%減り、3次元の測位RMSはHF23で7.8 mmから4.7 mm、GZY12で7.2 mmから3.8 mmに下がった。GZY12ではアンビギュイティの決定率が89.7%から99.7%に上がった（抄録）。", "fun": "衛星測位の電波は、建物や斜面で跳ね返ってから届くと、わずかに遅れて位置がずれる。このずれは空のどの方向から来た電波かで決まるので、空全体の「ずれの地図」を作れば補正できる。この研究は、その地図をマス目ではなく滑らかな関数としてAIに覚えさせ、ミリ単位の測位の誤差をほぼ半分にした。", "unverified": "本文は入手できず、比較手法（MHM・TMHM・XGBoost）との差の具体的な値は確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "複雑な風場の乱流の相関が長大橋の揺れを左右", "title": "Turbulence coherence in complex wind field: Focusing on its influence on the buffeting responses of long-span bridges", "url": "https://doi.org/10.1142/s0219455428500927", "authors": "Qian Chen ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-18", "sjr": 0.703, "citescore": 6.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "複雑な風環境での長大橋のバフェッティング応答の評価で、乱流のコヒーレンスの位相スペクトルや、距離に依存する母数を考える必要性を示し、その組み込み方を提案した（抄録）。", "p3": "結合受容関数の近似からバフェッティング力への位相スペクトルの寄与を表す理論式を導き、位相スペクトルと距離依存の母数を含むコヒーレンスのモデル化の手法を作り、実測の2点のu-wコヒーレンスも直接モデル化した（抄録）。", "p5": "コヒーレンス関数の選択より母数の距離依存性を考えることが重要で、実測のコヒーレンスを使うと斜め風と風のせん断による位相スペクトルがともに応答に大きく影響した。実測のu-wコヒーレンスは応答をあまり変えず、半経験的な式の結果を包む範囲だった（抄録）。", "fun": "長い橋は、風の乱れで細かく揺さぶられる。橋の両端に同時に同じ突風が来るか、少しずれて来るかで揺れ方は変わる。この研究は、その「ずれ（位相）」や距離による乱れの似かたの違いを実測に基づいて計算に入れると、橋の揺れの見積もりが大きく変わる場合があることを示した。風の「そろい方」が橋の安全を左右する点が面白い。", "unverified": "本文は入手できず、対象の橋と応答の変化の大きさは確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "列車荷重の主応力回転が砂の破壊を早める", "title": "Undrained behaviour of sand subjected to dynamic train loading", "url": "https://doi.org/10.1177/09544097261507406", "authors": "Zhiyong Liu ほか", "venue": "Proceedings of the Institution of Mechanical Engineers, Part F: Journal of Rail and Rapid Transit", "date": "2026-11-17", "sjr": 0.525, "citescore": 5.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "列車荷重の主応力回転を再現した中空円筒ねじりせん断試験で、ねじりのせん断成分が砂の破壊を早め、液状化・サイクリックモビリティ・ひずみ蓄積の3つの非排水挙動が密度と荷重で分かれることを示した（抄録）。", "p3": "砂にハート形の繰返しの応力経路を与え、相対密度・繰返しの鉛直荷重・ねじりせん断応力を変えて、間隙水圧、ひずみ、破壊抵抗、破壊形態を調べた（抄録）。", "p5": "緩い砂は荷重条件によらず液状化し、密な砂は鉛直荷重が小さいとサイクリックモビリティ、大きいとひずみの蓄積を示した。相対密度によらず、砂が不安定になる臨界の間隙水圧比（u/p0）があった（抄録）。", "fun": "列車が地下トンネルの上を速く走ると、下の砂は水を逃がす暇がなく、水圧が高まって液状化することがある。列車の荷重は上から押すだけでなく、通過につれて押す向きが回転する。この研究は、その「向きの回転」を実験装置で再現し、真上から押し続けるより砂が早く壊れることを示した。荷重の向きの変化が地盤の弱点になる点が面白い。", "unverified": "本文は入手できず、臨界の間隙水圧比の値は確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "生成AIの大量の主張が熟議を疲弊させる", "title": "Epistemic Exhaustion: Denial of Service Against Democratic Deliberation", "url": "https://doi.org/10.1007/s13347-026-01232-z", "authors": "Marcel Cotta", "venue": "Philosophy and Technology", "date": "2026-11-18", "sjr": 1.547, "citescore": 9.6, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "生成AIが形式上は正当な主張を大量に作ると、市民は真偽を見分ける力を保ったまま検討の努力を合理的に放棄する「認識的な疲弊」に陥り、民主的な熟議が正統性の面で脅かされると論じた（抄録）。", "p3": "Floridiの2者間の「超説得」の議論を、評価期間あたりの説得の回数n、検証時間τ、有限の評価能力Cを持つ系のモデルに拡張し、サービス拒否攻撃との構造的な類比で、関与から過負荷を経て疲弊に至る過程をたどる（抄録）。", "p5": "ファクトチェックやラベル付け、メディア・リテラシーは、評価の負担を増やすだけで決着を生まない場合、かえって疲弊を早めうり、サーバの内容中立の防御に相当する民主的な対策はないと論じる（抄録）。理論的な論考で、実証の数値はない。", "fun": "ウェブサイトを止める攻撃には、大量のアクセスで処理能力をあふれさせるやり方がある。この論文は、生成AIがもっともらしい主張を大量に作ると、同じことが民主主義の議論で起きると指摘する。人々は嘘を見抜けなくなるのではなく、見抜く手間に疲れて考えるのをやめてしまう。偽情報対策が負担を増やして逆効果になりうる点も面白い。", "unverified": "本文は入手できず、モデルの式の具体的な形は確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "人間中心の姿勢とAI理解が自律性と有能感を支える", "title": "Working with GenAI: how a human-centered mindset and GenAI understanding drive employee autonomy and competence", "url": "https://doi.org/10.1108/jeim-05-2026-0922", "authors": "Tuan Phong Nham ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-18", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "生成AIのある職場で、人間中心の考え方と生成AIの理解が、仕事の人間関係の道具性や援助行動という別々の社会的な仕組みを通じて、従業員の自律性と有能感に結びつくことを示した（抄録）。", "p3": "339人の従業員の横断調査を、6つの潜在構成概念の共分散構造分析（AMOS）で検証し、マーカー変数の手続きで共通方法バイアスを確かめた（抄録）。", "p5": "仕事の人間関係が役に立つという認知がより一貫した経路で、援助行動は生成AIの理解についてだけ働いた。価値に基づく志向と知識に基づく資源の役割の違いを示し、自己決定理論を生成AIの職場に広げたとする（抄録）。", "fun": "AIと一緒に働くと、自分で考えて決める感覚や「できる」という手応えが失われるのでは、と心配される。この調査では、AIをよく理解している人と、人を大切にする考え方の人が、それぞれ違う道筋でその感覚を保っていた。とくに、同僚との関係が役に立つと感じることが支えになっていた。AI時代ほど人間関係が効いてくる点が面白い。", "unverified": "本文は入手できず、経路係数の大きさは確認できなかった。横断調査なので因果の向きは言えない。"}}, {"id": "jr21", "rank": 21, "headline": "生成AI以前と以後の2時点でみた幸福感の変化", "title": "Generative AI Use and Two-Wave Change in Well-Being and Ill-Being: A Pre- and Post-generative AI Era Panel Study", "url": "https://doi.org/10.1177/21522715261506635", "authors": "Hyunhee Kang ほか", "venue": "Cyberpsychology, Behavior, and Social Networking", "date": "2026-11-18", "sjr": 1.121, "citescore": 7.1, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "生成AIの普及前（2022年10月）と後（2026年3月）の韓国の成人のパネルで、AIの利用や利用時間は幸福感・不調の変化とほぼ無関係で、使えないと苦痛を感じる離脱型の依存だけが孤独の減り方の小ささと関連することを示した（抄録）。", "p3": "1,022人の2時点のパネル調査で、生成AIの採用、利用時間、多次元のAI依存と、主観的幸福（自尊心・生活満足）と不調（孤独・不安・抑うつ）の変化の関係を、個人内と個人間を同時に扱うマルチレベルモデルで調べた（抄録）。", "p5": "単なる採用と1日の利用時間は幸福感・不調の変化とほぼ無関係だった。離脱型の依存は孤独の減少が小さいことと関連し、抑うつでも頑健さは劣るが同様の傾向がみられた（抄録）。", "fun": "生成AIは人を孤独にするのか、元気にするのか。普及の前と後に同じ人を追跡すると、使うかどうか、何時間使うかは、心の健康の変化とほとんど関係がなかった。違いが出たのは、使えないとイライラするような依存のしかたをしている人だけだった。使う量より付き合い方が大事だと分かる点が面白い。", "unverified": "本文は入手できず、関連の大きさの数値は確認できなかった。"}}, {"id": "jr22", "rank": 22, "headline": "宅配サブスクで売上は増えるが配送費も増える", "title": "Home-Delivery-Subscription Services in Omnichannel Grocery Retailing: An Analysis of Revenue and Operating Costs", "url": "https://doi.org/10.1287/serv.2026.0061", "authors": "Stanley Lim ほか", "venue": "Service Science", "date": "2026-11-18", "sjr": 1.309, "citescore": 4.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "食品小売の宅配サブスクは加入者の総支出を大きく増やすが、注文の処理と配送の費用も押し上げ、利益を生むのは一部の加入者だけで残りを支えていることを示した（抄録）。", "p3": "取引単位のデータと積み重ね差の差法でサブスクの効果を推定し、一般化ランダムフォレストで個人ごとの処置効果を推定した（抄録）。", "p5": "支出の増加は主に宅配の増加で、店頭受取と店舗での購入が一部減った。サンクコスト効果と取引の手間の最小化が説明として整合し、注文の頻度と1回あたりの品目数の増加で小売の処理・配送費が上がった（抄録）。", "fun": "月額料金で配送料が無料になる宅配サービスに入ると、人はたくさん買うようになる。払ったからには使わないと損、という気持ちが働くからだ。ところが店にとっては、注文の回数も品数も増えて配送の手間がかさみ、もうかる客と赤字の客に分かれていた。売上が増えても利益が増えるとは限らない点が面白い。", "unverified": "本文は入手できず、支出の増加率と黒字の加入者の割合は確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "地域のつながりが高齢者の心の健康を媒介", "title": "Urban Community Environment and Mental Health Among Older Adults in Shanghai: The Mediating Role of Community Social Connectedness and Comparisons Across Age Groups", "url": "https://doi.org/10.3390/buildings16224600", "authors": "Jianxin Wu ほか", "venue": "Buildings", "date": "2026-11-18", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "上海の高齢者で、地域環境と心の健康の関係を、地域への愛着と近所づきあいという地域の社会的なつながりが媒介し、年齢層で有意性のパターンが異なることを示した（抄録）。", "p3": "上海市楊浦区の32の都市コミュニティの60歳以上の調査データで、地域への愛着（感情面）と近所づきあい（行動面）を媒介とする構造方程式モデルを推定し、年齢で層別した（抄録）。", "p5": "地域環境と心の健康に有意な正の関連があり、直接効果と間接効果の合計がともに有意で、愛着を通じた間接効果のほうが大きかった。前期高齢者では愛着を通じた経路、超高齢者では直接の関連と近所づきあいの経路が有意だったが、群間の正式な比較では有意差はなかった（抄録）。", "fun": "住んでいる地域の環境がよいと、高齢者の心の健康もよい。その間をつないでいるのは何か。この研究では、近所の人と実際に話すことより、「この地域が好きだ」という気持ちのほうが大きな橋渡しをしていた。ただし、とても高齢になると、近所づきあいという行動のほうが効いてくる。年齢でつながり方が変わる点が面白い。", "unverified": "本文は入手できず、標本の大きさと効果の大きさは確認できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "地下鉄沿線の環境認知と地域への所属感", "title": "THE RELATIONSHIP BETWEEN PERCEIVED BUILT ENVIRONMENT AND SENSE OF COMMUNITY IN METRO CORRIDOR NEIGHBOURHOODS: A CASE STUDY OF HO CHI MINH CITY (VIETNAM)", "url": "https://doi.org/10.37043/jura.2026.18.2.2", "authors": "Nguyễn Bình Minh ほか", "venue": "Journal of Urban and Regional Analysis", "date": "2026-11-17", "sjr": 0.3, "citescore": 2.2, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ホーチミン市の地下鉄1号線の沿線で、近隣の建造環境の認知と地域への所属感の関係は弱く、社会施設までの徒歩時間だけが弱い正の相関を示したと報告した（抄録）。", "p3": "沿線の住民と就業者150人の調査を、記述統計、ピアソン相関、所属感の4つの下位尺度ごとの潜在クラス分析で分析した探索的な横断研究（抄録）。", "p5": "下位尺度の平均は情緒的な結びつきが最も高く（3.99）、影響力が最も低かった（3.72）。社会施設までの徒歩時間は3つの下位尺度と弱く相関した（r=0.169〜0.182）が、他の環境の指標は相関せず、居住の状況が2つの下位尺度のクラスと関連した（抄録）。", "fun": "駅の近くに便利な施設が増えれば、住民どうしのつながりも強まるのでは、と期待されがちだ。ところが、新しい地下鉄の沿線で調べると、施設までの歩きやすさとつながりの感覚の関係はとても弱かった。むしろ、そこに住んでいるかどうかのほうが効いていた。町の便利さとつながりは別物だという点が面白い。", "unverified": "本文は入手できず、潜在クラスの具体的な特徴は確認できなかった。標本は150人と小さい。"}}, {"id": "jr25", "rank": 25, "headline": "「気になる子」を多職種で評価する短い尺度", "title": "Development and Initial Validation of a Brief Multi-Professional Rating Scale for Children of Concern (Kininaru-Kodomo)", "url": "https://doi.org/10.3390/children13111600", "authors": "Ayako Ide-Okochi ほか", "venue": "Children", "date": "2026-11-17", "sjr": 0.748, "citescore": 4.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "診断や虐待の記録の前に地域の専門職が抱く子どもへの懸念（気になる子）を、職種をまたいで共有するための11項目の短い評価尺度を開発し、初期の妥当性を示した（抄録）。", "p3": "文献と47人の専門職への面接から26項目を作り、保健センター・児童相談所・保育所の専門職が1人の子どもを評定しSDQにも回答する郵送調査で、因子構造・信頼性・SDQとの相関・既知集団の差を調べた（抄録）。", "p5": "最終の11項目は行動統制の困難・虐待の兆候・対人の困難・適応の困難の4下位尺度で、確認的因子分析（N=179）の適合はCFI=0.947、RMSEA=0.073、αは0.63〜0.85だった。行動統制の困難はSDQの多動・不注意と相関し（ρ=0.56）、虐待の兆候は虐待の報告のある子で高かった（d=1.18）（抄録）。", "fun": "保健師や保育士は、診断が付く前から「この子、少し気になる」と感じることがある。けれども、その感覚を職種の違う人どうしで伝えるための共通の言葉がなかった。この研究は、その「気になる」を11の質問に整理し、点数として共有できるようにした。専門家の勘を、確かめられる物差しに変える試みが面白い。", "unverified": "本文は入手できず、評定された子どもの年齢層と職種別の回答の違いは確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "家賃負担の重い地区ほどオピオイド死亡が多い", "title": "The Neighborhood-Level Association Between Renter Cost Burden and Fatal Opioid-Involved Overdoses, Chicago, IL, 2015-2023", "url": "https://doi.org/10.1007/s11524-026-01199-4", "authors": "Morgan A. Watson ほか", "venue": "Journal of Urban Health", "date": "2026-11-17", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "シカゴの国勢調査区で、家賃の負担が重い世帯の割合が高い地区ほどオピオイドによる死亡率が高い関係が、2015〜2023年を通じて一貫してみられることを示した（抄録）。", "p3": "検視局のオピオイド関連の死亡の場所（2015〜2023年、8,423件）と、ACSの家賃負担（所得の30%以上、50%以上を住居費に使う賃貸世帯の割合）を使い、所得・分離・人口密度などを調整した負の二項回帰で年ごとに推定した横断分析（抄録）。", "p5": "家賃負担の重い地区と死亡率の高い地区は空間的に集まっていた。2023年には家賃負担の重い賃貸世帯の割合が10ポイント高いと死亡率が9%高かった（aIRR=1.09、95%CI 1.02〜1.17）（抄録）。", "fun": "家を失うことが薬物の過剰摂取の危険を高めることは知られていた。この研究は、家を失う手前の「家賃が重すぎる」状態にも同じ関係がみられることを、地区単位のデータで示した。住まいの支援が命を守る対策になりうる、という問いを投げかける点が面白い。ただし横断研究なので、家賃支援が死亡を減らすかは今後の検証が必要だ。", "unverified": "本文は入手できず、2023年以外の年の推定値は確認できなかった。横断の関連で因果ではない（著者も準実験での検証を求めている）。"}}, {"id": "jr27", "rank": 27, "headline": "銀行の気候開示とDXの同時推進は逆効果", "title": "Strengthening or Straining Resilience? Climate Risk Disclosure and Technology Adoption in Banks", "url": "https://doi.org/10.1002/bse.71891", "authors": "G. B. Ferilli ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-18", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "銀行の気候リスクの開示とデジタル化（テック企業の買収）は、それぞれ市場の示すデフォルト確率を下げるが、同時に進めると効果が弱まる負の相乗効果があることを示した（抄録）。", "p3": "2000〜2023年の世界の上場銀行543行で、テック企業の買収と気候リスク開示と、市場の示すデフォルト確率の関係を、交互作用を含めてデフォルトの期間別に調べた（抄録）。", "p5": "交互作用は正で有意で、両方を同時に進めると安定化の効果が弱まった。負の相乗効果は短い期間で最も強く、長い期間では気候開示の重要性が増した（抄録）。", "fun": "「デジタル化」と「気候対策の情報開示」は、どちらも銀行を強くすると言われる。ところが両方を同時に一気に進めると、それぞれの良い効果が打ち消し合ってしまった。人も組織も、同時に二つの大改革をすると手が回らなくなる。順番に進めたほうがよいという、身近な教訓にも通じる結果が面白い。", "unverified": "本文は入手できず、デフォルト確率の指標と効果の大きさは確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "中小製造業の戦略評価に流動性制約を組み込む", "title": "Simulation-Based Strategy Valuation Under Uncertainty: Risk Aggregation and Liquidity Constraints in a Manufacturing SME", "url": "https://doi.org/10.3390/jrfm19110926", "authors": "Reyner Pérez-Campdesuñer ほか", "venue": "Journal of Risk and Financial Management", "date": "2026-11-18", "sjr": 0.506, "citescore": 5.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "資金制約のあるエクアドルの中小製造業について、営業・生産・物流・運転資本・資金調達をつないだ動的なモデルとモンテカルロで戦略を評価し、期待値だけでは戦略を選べないことを示した（抄録）。", "p3": "36か月の期間で複数の環境の状態の下で不確実性を伝播させ、NPV、フリーキャッシュフロー、ROIC、EBITDAマージン、現金化サイクル、資金繰りの逼迫の指標の分布を求め、シナリオ・分布・多基準の頑健性の分析で補った（抄録）。", "p5": "戦略の構成によって価値の創出と流動性の危険の両方が大きく異なり、運転資本の条件が業務の改善を現金と経済価値に変える度合いを大きく左右した（抄録）。", "fun": "会社の戦略は「平均してどれだけもうかるか」で比べられがちだ。しかし中小企業では、もうかる計画でも途中で手元の現金が尽きれば倒れてしまう。この研究は、何千通りもの未来をコンピュータで試し、もうけと資金繰りの危うさを同時に見ながら戦略を比べた。平均だけでなく、悪い場合の深さを見る大切さが分かる。", "unverified": "本文は入手できず、各戦略の具体的なNPVの分布は確認できなかった。対象は1社の事例である。"}}, {"id": "jr29", "rank": 29, "headline": "デジタルの多主体交流が高級ブランドの資産を高める", "title": "The Effect of Digital Multi-actor Interactions on Online Service Brand Equity in the Luxury Sector: An Experimental Study", "url": "https://doi.org/10.1287/serv.2025.0058", "authors": "Shih-Jung Juan ほか", "venue": "Service Science", "date": "2026-11-18", "sjr": 1.309, "citescore": 4.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "高級ブランドのオンラインサービスで、顧客どうし・担当者と顧客・デジタルと顧客の交流を実験で操作し、それが価値の共創を通じてブランド資産の4次元に結びつくことを調べた（抄録）。", "p3": "3つの交流の場面をそれぞれ高・低で操作する実験で、自己価値とコミュニティ価値の共創を媒介、自己とブランドの一致と社会的比較を調整とし、443人のデータをPLS-SEMで分析した（抄録）。", "p5": "抄録には効果の大きさの記載がなく、交流がサービス価値の共創を通じてオンラインのサービス・ブランド資産と関連するという枠組みを示したとする（抄録）。", "fun": "高級ブランドの魅力は、店員の接客だけでなく、ほかの客との交流やアプリの使い心地からも生まれる。この実験は、誰と誰がどんなふうにやり取りするかを意図的に変え、それがブランドへの評価にどう効くかを調べた。オンラインでも、人と人のつながりがブランドの価値を作るという見方が面白い。", "unverified": "本文は入手できず、各経路の係数と仮説の支持の有無は確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "仮想ライバーは人に似せすぎると逆効果", "title": "Appearances may mislead: explicit and implicit consumer responses to virtual anchors' form realism in live-streaming commerce", "url": "https://doi.org/10.1108/jrim-04-2026-0293", "authors": "Yuan Yin ほか", "venue": "Journal of Research in Interactive Marketing", "date": "2026-11-18", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ライブコマースの仮想キャスターは、人に似せるほど明示的な評価は上がって人と同等になるが、暗黙的な評価では人より低くなることを、自己報告・感情プライミング・脳波で示した（抄録）。", "p3": "人のキャスターと写実性の異なる仮想キャスターを比べる2つの実験室研究で、研究1は自己報告と感情プライミングによる暗黙的な評価、研究2は自己報告と脳波を組み合わせた（抄録）。", "p5": "写実性の高い仮想キャスターは低いものより明示的に高く評価され、人と有意な差がなかったが、研究1の暗黙的な評価では人より低かった。脳波では人のキャスターが前頭のθ波とγ波をより強く生んだ（抄録）。", "fun": "動画で商品を紹介するAIのキャスターを、人そっくりに作れば客の受けはよくなるのか。アンケートで聞くと「人と同じくらい良い」と答えるのに、無意識の反応を測ると人そっくりのキャスターは本物の人より好まれていなかった。口で言う評価と心の奥の反応がずれるという、いわゆる「不気味の谷」を思わせる結果が面白い。", "unverified": "本文は入手できず、各研究の参加者数は確認できなかった。"}}, {"id": "jr31", "rank": 31, "headline": "生成AIがネットの情報の質を変える確率モデル", "title": "A Stochastic Model of Generative AI’s Impact on Online Information Quality", "url": "https://doi.org/10.1145/3862761", "authors": "Michele Garetto ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-11-17", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "新しい話題について情報が生成・索引化・拡散される過程の確率モデルを作り、生成AIの急速な普及と利用者の依存が人の検証を追い越すと、オンライン情報の質が測れるほど下がりうることを示した（抄録）。", "p3": "検索拡張生成（RAG）に頼るLLMが新しい話題に答える状況を想定した確率モデルで情報の動態を分析し、Stack Exchangeのデータで良い回答ができるまでの時間と人の協働の量を調べた（抄録）。", "p5": "生成AIの内容に無批判に頼ると内容の質が測れるほど下がりうり、Stack Exchangeでは質の高い回答には相当な時間と多くの人の協働が必要だった（抄録）。", "fun": "新しい話題についてAIに質問すると、AIはネット上の情報を探して答える。しかし新しい話題では、人がじっくり書いた良い答えがまだ少ない。その段階でAIの答えがネットに広まると、AIがそれをまた参照し、質の低い情報が増えていくおそれがある。良い答えには時間と多くの人の手間がかかる、という当たり前の事実の重みが分かる。", "unverified": "本文は入手できず、モデルの具体的な形と質の低下の程度は確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "システムダイナミクスのモデル化をAIエージェントに", "title": "Lowering the Barrier: Embedding the Modeling Process Into AI Agents", "url": "https://doi.org/10.1002/sdr.70046", "authors": "William Schoenberg", "venue": "System Dynamics Review", "date": "2026-11-18", "sjr": 1.097, "citescore": 6.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "システムダイナミクスのモデル化の全工程（構築・シミュレーション・検証・フィードバック分析・較正・感度分析・可視化）を、LLM駆動のエージェントの反復ループに組み込む設計を示した（抄録）。", "p3": "単発の対話で言語モデルにシミュレーションモデルを作らせた先行研究を広げ、エージェントがツールを使いながらモデルの開発・テスト・改良を繰り返し、シミュレーションできる明示的なモデルを保つ構成にした（抄録）。", "p5": "問題の定式化から較正と不確実性分析までの一連の流れを例で示した。抄録には性能の数値評価の記載はない（抄録）。", "fun": "社会や会社の仕組みを、在庫や人口の増減の「流れ」として描き、未来をシミュレーションする方法がある。ところが、その作業は手順が多く、専門家でないと難しい。この研究は、AIのエージェントに作って試して直すという手順を何度も回させ、途中の結果も見える形で残すようにした。AIに任せつつ中身を確かめられる点が面白い。", "unverified": "本文は入手できず、AIが作ったモデルの質の評価方法は確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "スマートシティ事業の社会技術的な設計の組合せ", "title": "The sociotechnical design of smart city projects: A configurational approach for service innovation", "url": "https://doi.org/10.1177/00208523261506513", "authors": "Emanuele Gabriel Margherita ほか", "venue": "International Review of Administrative Sciences", "date": "2026-11-18", "sjr": 1.163, "citescore": 7.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ベルギーの自治体のスマートシティ事業で、意図したサービス革新に結びつく社会面と技術面の組合せに3つの経路があることを、ファジィ集合の質的比較分析で示した（抄録）。", "p3": "ベルギーの自治体が進めた88のスマートシティ事業の独自データで、組織間の取り決めや人材の能力（社会面）とデジタル技術・AI（技術面）の組合せを、fsQCAで分析した（抄録）。", "p5": "(a)官民連携で外部の専門性に頼るAI主導の革新、(b)官民連携と職員研修によるデジタル技術の共同開発（能力形成型）、(c)公共調達と研修によるデジタル技術の導入（内部で構想し外部で実行）の3経路が得られた（抄録）。", "fun": "スマートシティの成功には最新の技術があればよい、と考えがちだ。ところが88の事業を比べると、うまくいく道は一つではなく、外部の専門家にAIを任せる道、職員を育てながら一緒に作る道、入札で外に作らせる道の3通りがあった。技術と人の組み合わせ方が何通りもあると示した点が面白い。", "unverified": "本文は入手できず、各経路の整合度・被覆度の値は確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "CFD-DEMで亀裂岩盤の粒子による目詰まりを再現", "title": "From particle migration to seepage risk mitigation: Coupled computational fluid dynamics and discrete element method modeling of clogging in fractured rock", "url": "https://doi.org/10.1063/5.0354993", "authors": "Xuan Nan ほか", "venue": "Physics of Fluids", "date": "2026-11-18", "sjr": 0.714, "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "水を含む亀裂岩盤での粒子の移動・堆積と目詰まりを、CFD-DEMの連成計算と物理実験で調べ、粗粒が橋を架けて骨格を作り細粒が隙間を埋める「粗細の相乗」で透水性が大きく下がることを示した（抄録）。", "p3": "3次元の亀裂の粗さのモデルを作り、多粒径の粒子の移動、接触力の鎖の発達、浸透の特性を解析した（抄録）。", "p5": "細粒分の臨界含有量が最適な堆積様式を決め、狭窄部で局所流速が上がり上流の閉塞部で抵抗が増して流れを抑えた。低流速では層流で透水性が安定し、高流速では乱流の洗掘で優先流路ができ透水性が大きく上がった（抄録）。", "fun": "トンネル工事で岩の割れ目から水が噴き出すとき、流れに乗った砂粒が割れ目に詰まって水を止めることがある。計算すると、大きな粒がまず橋のように引っかかり、小さな粒がその隙間を埋めると、水の通り道がよく塞がった。ただし流れが速すぎると、詰まった粒が洗い流されて逆に水の道ができる。粒の大小の役割分担が面白い。", "unverified": "本文は入手できず、細粒分の臨界含有量の値は確認できなかった。"}}, {"id": "jr35", "rank": 35, "headline": "有効垂直応力の変動による断層すべりをDEMで", "title": "Discrete element method investigation on sandstone fault sliding behavior under effective normal stress disturbance", "url": "https://doi.org/10.1002/dug2.70144", "authors": "Wei Huang ほか", "venue": "Deep Underground Science and Engineering", "date": "2026-11-18", "sjr": 0.981, "citescore": 7.3, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "流体の注入・排出による有効垂直応力の乱れが砂岩の断層すべりに与える影響をDEMで調べ、単調な減少より周期的な乱れのほうが激しいすべりを抑えることを示した（抄録）。", "p3": "室内の断層すべり試験の結果に基づくDEMで、有効垂直応力の単調な減少と周期的な乱れの2つの様式を、除荷の速さと乱れの周波数を変えて比べた（抄録）。", "p5": "有効垂直応力の低下は常にすべり速度と累積変位を増やした。単調な減少によるすべり速度のピークは周期的な乱れより大きく高く、除荷の速さや周波数が上がるとピークが上がった（抄録）。", "fun": "地下に二酸化炭素を閉じ込める技術では、注入で岩の割れ目（断層）が滑り、地震を起こす心配がある。粒子の計算で調べると、押さえつける力を一気に抜くより、少しずつ揺らしながら抜くほうが、急なすべりが起きにくかった。注入の仕方を工夫すれば断層を穏やかに滑らせられるかもしれない、という見通しが面白い。", "unverified": "本文は入手できず、すべり速度のピークの具体的な値は確認できなかった。"}}, {"id": "jr36", "rank": 36, "headline": "液状化沈下の深さ重み係数は推定を改善するか", "title": "Effect of Using Depth Weighting Factor to Estimate Liquefaction-Induced Ground Settlement", "url": "https://doi.org/10.1139/cgj-2026-0258", "authors": "Franklin Ricardo Olaya ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-17", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "液状化による地表の沈下の推定で広く使われる深さ重み係数は、推定を一貫して改善するわけではなく、一律に使うべきではないことを示した（抄録）。", "p3": "記録のよく残る液状化による沈下の事例を使い、2つの沈下の推定手順と、深さ重み係数の別の形を組み合わせて、係数を入れる効果を調べた（抄録）。", "p5": "深さ重み係数の効果は、体積ひずみが最も大きい液状化層の深さに大きく依存し、沈下の推定を一貫して改善しなかった（抄録）。", "fun": "液状化で地面がどれだけ沈むかを計算するとき、深い層ほど影響が小さいとして「重み」を付けるのが一般的になっている。この研究は、その習慣が本当に正しいかを実際の被害の記録で確かめ、いつも良くなるわけではないことを示した。広く使われている「お約束」を事例で検証し直した点が面白い。", "unverified": "本文は入手できず、使った事例の数と推定誤差の比較の数値は確認できなかった。"}}, {"id": "jr37", "rank": 37, "headline": "列車-軌道-橋梁の一体連成モデルで層間剥離", "title": "A monolithic train-track-bridge coupled model with bridge deformation and localized interlayer debonding via pseudo-force regularization", "url": "https://doi.org/10.1016/j.engstruct.2026.124173", "authors": "Lifeng Xin ほか", "venue": "Engineering Structures", "date": "2026-11-18", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社のサイトは取得できず、抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名からは、橋の変形と局所的な層間の剥離を擬似力による正則化で扱う、列車・軌道・橋梁の一体（モノリシック）の連成モデルを示す研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "高速鉄道の線路は、橋の上ではレール・板・橋桁が何層にも重なっている。その層の間が一部はがれると、列車の揺れ方や橋への力の伝わり方が変わるはずだ。題名から読み取れる問いは、列車・線路・橋を一つの計算でまとめて解き、そのはがれの影響を扱えるか、という点にある。", "unverified": "抄録・本文を入手できず、手法・検証・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "物理情報つきの逆演算子学習で移動荷重を同定", "title": "Physics-informed frequency-domain inverse operator learning for moving dynamic load identification", "url": "https://doi.org/10.1016/j.cacaie.2026.100275", "authors": "Ruihua Liang ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-17", "sjr": 2.155, "citescore": 14.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社のサイトは取得できず、抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名からは、周波数領域で物理の情報を組み込んだ逆演算子を学習し、移動する動的な荷重を同定する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "橋の上を車が走るとき、橋の揺れから逆に「どんな力がどこにかかったか」を求めるのは、答えが一つに定まりにくい難しい問題だ。題名から読み取れる問いは、揺れから力への逆向きの変換そのものをAIに学ばせ、物理の法則で手綱を締めることで、動く荷重を当てられるか、という点にある。", "unverified": "抄録・本文を入手できず、手法・検証・結果はすべて未確認。"}}, {"id": "jr39", "rank": 39, "headline": "ABC-SMCでコンクリート構造の時変パラメータを同定", "title": "Time-variant parameter identification of concrete structures via physics-guided temporal decomposition and adaptive approximate Bayesian computation with sequential Monte Carlo", "url": "https://doi.org/10.1016/j.engstruct.2026.124185", "authors": "Meng Zhang ほか", "venue": "Engineering Structures", "date": "2026-11-18", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "題名で探したSSRN版の抄録（Crossrefに登録）を使用。出版社版の本文は入手できず", "preprint": false, "short": true, "p1": "大規模なコンクリート構造の施工段階で、物理に基づいて期間を分割し、適応的なABC-SMCで弾性係数・プレストレス・クリープの時変の係数を、尤度なしで逐次に同定する枠組みを示した（抄録）。", "p3": "施工過程を物理に沿った段階に分けて準静的な部分問題の列に変え、前段階の事後分布を次段階の事前分布にする逐次ベイズの情報伝達を使う。許容誤差を有効標本数で自動的に締め、摂動核を重みつき粒子の共分散で更新するABC-SMCを開発した（抄録）。", "p5": "大スパンのプレストレスト・コンクリート水路橋の全工程の監視データで、弾性係数の倍率kE、プレストレスの有効係数kP、クリープの増幅係数kCを同時に同定し、現地の剛性が公称より高く、プレストレスの追加損失が約8%、クリープが採用モデルより大きく増幅していることを示した（抄録）。", "fun": "コンクリートの硬さや縮み方は、実験室で測った値と現場の値がずれる。この研究は、工事中の変形の計測データから、時間とともに変わる材料の性質を、少しずつ推定を更新しながら追いかけた。複雑すぎて確率を式で書けないモデルでも、シミュレーションと見比べるだけで推定できる点が面白い。", "unverified": "出版社版の本文は入手  "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "why": "技術系の起業プロジェクトの資金申請の審査で、女性が参加しながら発言しない「沈黙の女性代表」はステレオタイプを強め、男性だけのプロジェクトより評価が低くなり、能動的な女性の代表では不利がないことを示す。この不利は審査員が女性のときに強いとする。"}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "職場の嫉妬が他者のアイデアへの注目を通じ創造性に", "title": "From Dysfunction to Socially Embedded Adaptation: A Constructive Pathway for Jealousy Toward Creativity in the Workplace", "url": "https://doi.org/10.1002/job.70135", "authors": "Zhuofan Kan ほか", "venue": "Journal of Organizational Behavior", "date": "2026-11-18", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "why": "職場の嫉妬が、他者のアイデアを認識させることを通じて従業員の創造性を高める社会的・認知的な経路を、社会機能的な感情理論から示す。従業員と上司のデータ・重要事例法・シナリオ実験の3研究で一貫した結果を得て、政治的スキルがこの間接効果を強めるとする。"}, {"id": "jn11", "rank": 11, "field": "経営学", "headline": "企業の住民投票への献金は可決と業績に結びつく", "title": "Corporate Contributions to Ballot Measure Campaigns: Real Effects and Valuation", "url": "https://doi.org/10.1287/mnsc.2024.06801", "authors": "Rüdiger Fahlenbrach ほか", "venue": "Management Science", "date": "2026-11-17", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "米国の州の住民投票（ballot initiative）への企業献金の新しいデータで、企業は思想的な発議より事業に関わる発議に多く献金し、献金が可決の可能性と関連することを示す。重要な発議の可決後に献金企業の売上成長が変わり、選挙前後の異常リターンも献金企業でより大きいとする。"}, {"id": "jn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "場所がスティグマの管理を生み出し移し替える", "title": "Place Matters: A Dynamic Multilevel Perspective on Stigma Management in French Elderly Care", "url": "https://doi.org/10.1111/joms.70174", "authors": "Claire Le Breton ほか", "venue": "Journal of Management Studies", "date": "2026-11-18", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "フランスの高齢者介護の再編事業の2年半の事例研究から、空間と物の配置が「拡大・囲い込み・断片化」の3つの仕組みでケアの意味と場所を組み替えることを示す。場所はスティグマ管理の舞台ではなく、それを生み出し、解消せずに移し替え、組織・職業・個人の間に分配すると理論化する。"}, {"id": "jn13", "rank": 13, "field": "環境・気候政策", "headline": "小型原子炉は米国のAI電力需要の脱炭素に使えるか", "title": "Can Small Modular Reactors Enable State-Specific Energy Portfolios for US AI Ambitions through 2035?", "url": "https://doi.org/10.1021/acs.est.6c09330", "authors": "Apoorv Lal ほか", "venue": "Environmental Science & Technology", "date": "2026-11-18", "sjr": 3.776, "citescore": 18.9, "citescore_year": "2025", "why": "AIインフラの電力需要の急増による化石燃料への固定化を懸念し、2028〜2035年の州別のシナリオ分析で、小型モジュール炉を太陽光・風力・系統電力・蓄電池・直接空気回収と組み合わせたポートフォリオを、原子力なしの場合と比べる。"}, {"id": "jn14", "rank": 14, "field": "地震工学・防災", "headline": "アンカレッジ地震の非構造部材の被害の教訓", "title": "Performance of Nonstructural Components in Buildings During the November 30, 2018, M7.1 Anchorage, Alaska Earthquake", "url": "https://doi.org/10.1002/esp4.70137", "authors": "Wael M. Hassan ほか", "venue": "Earthquake Spectra", "date": "2026-11-18", "citescore": 7.7, "citescore_year": "2025", "why": "2018年のM7.1アラスカ・アンカレッジ地震での建物の非構造部材の被害を調べ、最も多く高額だったのはスプリンクラー設備や配管・接続部の破損による浸水だったと報告する。固定のないタンクの滑動への規定の改善の必要や、耐震固定のない空調設備の被害など、設計への示唆を示す。"}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "責任投資の選好は負の外部性に強く反応する", "title": "The Asymmetry in Responsible Investing Preferences and Beliefs", "url": "https://doi.org/10.1287/mnsc.2024.06826", "authors": "Jacquelyn Humphrey ほか", "venue": "Management Science", "date": "2026-11-17", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "実験で、ポートフォリオの配分は環境・社会への負の外部性に対して、同程度の正の外部性への反応の数倍強く反応し、負の外部性は将来の運用成績への悲観もやや強めることを示す。この非対称性は損失回避と同等以上の大きさで、罪の株と天使の株の非対称な事実を説明する。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "情報を集める人と広める人のネットワークの実験", "title": "Connectors and Influencers", "url": "https://doi.org/10.1287/mnsc.2024.07308", "authors": "Frédéric Moisan ほか", "venue": "Management Science", "date": "2026-11-17", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "情報の取得と人とのつながりの維持にともに費用がかかる設定で、理論は少人数で活発なハブ、大人数で不活発なハブも含むスター型ネットワークを予測する。8人と50人の実験でスター型が一貫して現れ、ハブの活動水準が集団の成果と収益の分配を左右することを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "情報の取得とつながりの維持の両方に費用がかかる設定で、理論が予測するスター型のネットワークが実験でも一貫して現れ、ハブの活動の水準が集団の成果を左右することを示した（抄録）。", "p3": "理論は、小集団では活発なハブ、大集団では不活発なハブの均衡も含むスター型を予測する。8人の小集団と50人の大集団で実験を行い、自分と他人の収益の情報の与え方を変えた（抄録）。", "p5": "小集団では活発なハブの予測どおりに振る舞った。大集団ではハブが不活発になるか、均衡をはるかに超えて活動するかが、収益の情報の与え方で分かれ、ハブの活動の水準が参加者間の収益と集団全体の成果を左右した（抄録）。", "fun": "クラスの中には、情報を集めて皆に流す「事情通」がいることが多い。実験でも、自然に一人の中心と多数の聞き手からなる星形のつながりができた。ただし大人数になると、中心の人が働かなくなったり、逆に働きすぎたりした。その違いが、他人のもうけが見えるかどうかで決まった点が面白い。", "unverified": "本文は入手できず、収益の差の大きさは確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "環境・気候政策", "headline": "消費ベースの森林破壊の排出を1kmの格子で推計", "title": "Global consumption-based deforestation carbon emissions and regional hotspots: 2001–2020", "url": "https://doi.org/10.5194/essd-18-8345-2026", "authors": "Dongmei Tang ほか", "venue": "Earth System Science Data", "date": "2026-11-17", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "道路網・森林破壊・森林の炭素収支と国際貿易の統計を組み合わせ、2001〜2020年の消費ベースの森林破壊による炭素排出を世界で1kmの格子で推計したデータを作る。貿易に関わる森林破壊の排出は39.6 Gt CO2eで、森林破壊の排出全体の31.8%に当たるとする。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "道路網・森林破壊・森林の炭素収支と国の貿易統計を組み合わせ、2001〜2020年の消費ベースの森林破壊による炭素排出を世界で1 kmの格子で推計したデータを作った（抄録）。", "p3": "国単位にとどまっていた消費ベースの森林破壊の排出を、道路網・森林破壊・森林の炭素フラックスの空間情報と、国レベルの世界の貿易統計で格子に配分した（抄録）。", "p5": "貿易に関わる森林破壊の排出は39.6 Gt CO2eで、世界の森林破壊の排出の31.8%に当たった。データはfigshareで公開されている（抄録）。", "fun": "熱帯の森が切られる原因の一部は、遠い国の人々が食べる牛肉や大豆、使う木材にある。この研究は、どの場所の森の破壊が、どの国の消費に結びついているかを1 km四方の細かさで地図にした。森林破壊の排出の約3割が貿易を通じて生じているという数字は、買い物と遠くの森がつながっていることを教えてくれる。", "unverified": "本文は入手できず、地域ごとの集中の詳細と推計の不確実性は確認できなかった。"}}, {"id": "jn18", "rank": 18, "field": "地震工学・防災", "headline": "アンカラの536棟の耐震脆弱性を迅速に評価", "title": "Assessing Seismic Vulnerability and Structural Resistance in Urban Areas: A Case Study of Demetevler/Yenimahalle in Ankara", "url": "https://doi.org/10.3390/buildings16224601", "authors": "Ramazan Serdar Eser ほか", "venue": "Buildings", "date": "2026-11-18", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "why": "トルコ・アンカラの3地区の536棟を街路からの迅速な目視調査で評価し、47%（252棟）が高リスクで、6階以上の建物では脆弱性が55%を超えることを示す。代表的な高リスクの建物に非線形プッシュオーバー解析を行い、部材の損傷も評価する。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "アンカラの3地区の536棟を街路からの迅速な目視調査で評価し、47%が高リスクに分類され、6階以上で脆弱性が高いことを示した（抄録）。", "p3": "構造と建築のリスク指標に基づく迅速な目視調査で既存の建物を評価し、代表的な高リスクの建物1棟に単一モードの非線形プッシュオーバー解析を行って部材の損傷を評価した（抄録）。", "p5": "47%（252棟）が高リスクで、リスク得点50で6階以上の建物の脆弱性は55%を超えた。プッシュオーバー解析では、対象の建物の主要な構造部材の16%が損傷を受けると推定された（抄録）。", "fun": "地震の多い国では、古い建物の中からまず危ない建物を探し出す必要がある。一棟ずつ詳しく計算するのは大変なので、この研究は街を歩きながら外観で危険度を素早く判定し、その上で代表的な建物だけを詳しく計算した。調べた建物の半分近くが高リスクだったという結果は、街全体の建て替えの急ぎ具合を示す。", "unverified": "本文は入手できず、目視調査の判定基準の詳細は確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "地震工学・防災", "headline": "地域の防災力が住民の備えを心理経路で促す", "title": "Community Resilience Strategies and Public Emergency Preparedness Behavior: Psychological Pathways in the Context of Flash Flooding in Guangzhou City, China", "url": "https://doi.org/10.1007/s13753-026-00787-x", "authors": "Qinxia Wang ほか", "venue": "International Journal of Disaster Risk Science", "date": "2026-11-18", "sjr": 1.225, "citescore": 8.4, "citescore_year": "2025", "why": "広州の鉄砲水を対象に、拡張した防護動機理論から、地域のレジリエンス戦略が住民の緊急時の備えの行動に心理的な過程を通じて結びつく経路を実証する。地域を制度と住民の行動をつなぐ場として位置づける。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "広州の鉄砲水を対象に、地域のレジリエンスの資源の備えと社会的な伝達が、自己効力感と記述的規範を通じて住民の緊急時の備えの行動と関連することを示した（抄録）。", "p3": "拡張した防護動機理論から地域のレジリエンスの2つの戦略的な次元（資源の備えと社会的な伝達）を設定し、507人の調査を構造方程式モデルで分析した（抄録）。", "p5": "2つの次元はともに備えの行動と正に関連し、自己効力感と記述的規範（周りの人もしているという認知）が有意な媒介だった。リスク認知と命令的規範は備えの行動と有意に関連しなかった（抄録）。", "fun": "防災では「危険を知らせれば人は備える」と考えがちだ。ところがこの調査では、危険の認識は備えの行動とほとんど関係がなかった。効いていたのは、「自分にもできる」という自信と、「周りの人も備えている」という感覚だった。怖がらせるより、できる実感と仲間の姿を見せるほうが人を動かす点が面白い。", "unverified": "本文は入手できず、媒介効果の大きさは確認できなかった。横断調査なので因果の向きは言えない。"}}, {"id": "jn20", "rank": 20, "field": "地震工学・防災", "headline": "都市の人工排熱が台風の残骸による豪雨を強める", "title": "Effects of Urbanization on Extreme Rainfall Associated With Remnants of Tropical Cyclone Haikui (2023) Over the Pearl River Delta Region", "url": "https://doi.org/10.1029/2026jd047225", "authors": "Po Mau Lui ほか", "venue": "Journal of Geophysical Research: Atmospheres", "date": "2026-11-18", "sjr": 1.561, "citescore": 6.0, "citescore_year": "2025", "why": "2023年の台風ハイクイの残骸が珠江デルタの巨大都市を通過した際の豪雨を、人工排熱の量と都市の土地被覆を変えた対流許容モデルの実験で比べ、都市化が沿岸都市の極端な降雨をどう変えるかを調べる。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "2023年の台風ハイクイの残骸が珠江デルタを通過した際の豪雨について、極端な人工排熱があると都市の24時間雨量が50%以上強まり、その仕組みが熱による循環にあることを示した（抄録）。", "p3": "対流許容の数値モデルで、都市の人工排熱の日最大を300 W/m²とする実験、排熱0の実験、都市の土地利用を農地に置き換えた実験の3つを並行して行った（抄録）。", "p5": "排熱300の実験では排熱0より都市の24時間雨量が50%以上増えた。熱による循環が台風の残骸から暖かい都市へ低層の水蒸気を運び、南風の季節風と都心で収束して雨が強まった。都市の土地被覆の変化はこの効果をわずかに打ち消した（抄録）。", "fun": "大都市はエアコンや車の熱で周りより暖かい。その熱が、通り過ぎる台風の残りの雨雲から湿った空気を引き寄せ、街の真上で雨を強めることがコンピュータの実験で分かった。極端な場合には1日の雨量が5割以上増えた。都市の熱という人間活動が、空から降る雨の量まで変えてしまう点が面白い。", "unverified": "本文は入手できず、排熱300 W/m²という設定が現実の都市にどれだけ近いかは確認できなかった（著者は極端な都市化の想定としている）。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "面と頂点の二つのグラフでCADモデルを学習", "title": "BRepDSN: A Dual-stream Network Design for B-Rep Representation Learning Leveraging the Duality of Face and Boundary Vertices", "url": "https://doi.org/10.1145/3862473", "authors": "Haoxuan Song ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-18", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "CAD・CAE・CAMの基本表現である境界表現（B-Rep）のニューラルネットについて、面の隣接グラフに加えて頂点の隣接グラフを使い、二つの流れで情報を交互に交換する二重ストリームのネットワークを提案する。境界の情報を取り込む表現学習の設計を示す。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "CADの境界表現（B-Rep）を、面の隣接グラフと頂点の隣接グラフの二つの流れで交互に情報交換しながら学習するBRepDSNを提案し、5つの課題で最先端の性能を得た（抄録）。", "p3": "面が接する頂点から境界の手がかりを集め、頂点は面の文脈で更新される双方向のメッセージ伝達に、面の埋め込みと境界の頂点の集約との双対性に基づく対照学習の目的と、境界の辺の補助分類を加えた（抄録）。", "p5": "モデリング操作の分割、操作手順の分割、分類、加工形状の分割、組立の5課題すべてで最先端となり、CC3Dの操作分割でmIoUが14.65%、TMCADの分類で4.9%、AutoMateの組立で位置精度が23.6%改善した（抄録）。", "fun": "部品の設計データは、面とその境目の線や角でできている。これまでのAIは主に「どの面とどの面が隣り合うか」を見ていたが、この研究は角（頂点）のつながりも別の目で見て、二つの見方を交互に照らし合わせた。面と角のどちらか一方ではなく、両方を対にして学ぶ発想が、部品の組み立て方の予測などで大きく効いた点が面白い。", "unverified": "本文は入手できず、計算費用の比較は確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "機械学習", "headline": "AIが書いた修正パッチの安全性を大規模に検証", "title": "How Safe Are AI-Generated Patches? A Large-scale Study on Security Risks in LLM and Agentic Automated Program Repair on SWE-bench", "url": "https://doi.org/10.1145/3861341", "authors": "Amirali Sajadi ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-11-17", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "why": "SWE-benchの2万件超のGitHubの課題で、開発者のパッチ、2つのLLM単体、4つのエージェントの枠組みが作るパッチのセキュリティ上の危険を大規模に分析し、コード・課題・プロジェクトのどの要因が危険なパッチと結びつくかを調べる。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "SWE-benchの2万件超のGitHubの課題で、LLMとエージェントが作る修正パッチが開発者のパッチより多くの脆弱性を持ち込みうることを大規模に示した（抄録）。", "p3": "開発者のパッチ、2つのLLM単体（Llama 3.3 Instruct-70B、GPT-5.4 nano）、4つのエージェントの枠組み（OpenHands、AutoCodeRover、HoneyComb、SWE-agent）を評価し、コード・課題・プロジェクトの要因を分析した（抄録）。", "p5": "Llama 3.3は学習・テスト集合で手作業で確認した脆弱性を135件持ち込み、同じ課題の開発者パッチは12件だった。GPT-5.4 nanoはテスト集合で3件（開発者2件）、4つの枠組みすべてが脆弱性を持ち込み、OpenHandsが11課題で44件と最も多かった（抄録）。", "fun": "AIにプログラムのバグを直させるのは便利だが、直したつもりで新しい穴をあけていないだろうか。2万件を超える実際の修正依頼で調べると、あるAIは人間の開発者の10倍以上の脆弱性を持ち込んだ。しかも説明の足りない依頼や、広い範囲を書き換える修正ほど危なかった。依頼の書き方まで安全に関わる点が面白い。", "unverified": "本文は入手できず、脆弱性の種類の内訳は確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "環境・気候政策", "headline": "米国農地の管理の履歴を1980〜2023年で整備", "title": "Agricultural land management practices in the conterminous United States from 1980–2023", "url": "https://doi.org/10.5194/essd-18-8441-2026", "authors": "Lauren Hoskovec ほか", "venue": "Earth System Science Data", "date": "2026-11-18", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "米国の国家資源調査を基に、主要作物の農地の播種・収穫日、化学肥料と堆肥の窒素・炭素の施用量と時期、耕起の方式と強度、被覆作物の導入を補完し、0.25度格子のデータにまとめる。水質や温室効果ガスの評価の基盤になる。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "米国本土の主要作物の農地について、1980〜2023年の播種・収穫日、化学肥料と堆肥の施用、耕起、被覆作物の管理の履歴を0.25度格子のデータとして整備した（抄録）。", "p3": "国家資源調査（NRI）を基にした標本ベースの方法で、播種と収穫の日、化学肥料の窒素と堆肥の窒素・炭素の施用量と時期、耕起の方式と強度、被覆作物の導入を補完し、格子に集計した（抄録）。", "p5": "綿花と春小麦の播種は平均12日・9日遅く、大豆は12日早くなった。トウモロコシの化学肥料の窒素は122.5から150.9 kg N/haに増え、不耕起・減耕起はそれぞれ19.2%・26.5%増え、全面耕起は47.2%減った。被覆作物は東部で農地の10〜13%に広がった（抄録）。", "fun": "畑の土にいつ種をまき、どれだけ肥料をやり、どれだけ耕すかは、川の水質や温室効果ガスの量を左右する。この研究は、40年以上にわたる米国全土の農家のやり方を、地図のデータとしてまとめ直した。耕さない農法が広がり、肥料の量は2000年ごろから横ばいになったなど、農業の静かな変化が数字で見える点が面白い。", "unverified": "本文は入手できず、補完の不確実性の評価方法は確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "工学", "headline": "転がる質量で効く円盤型・リム型の動吸振器", "title": "Optimized design and performance evaluation of novel tuned mass dampers for enhanced vibration control of offshore platforms", "url": "https://doi.org/10.1142/s0219455428500939", "authors": "Quoc-Huong Cao ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-18", "citescore": 6.5, "citescore_year": "2025", "why": "転がる円盤形・リム形の質量を使い、質量を増やさずに運動エネルギーを増やす新しい動吸振器（TMD）を提案し、調和外力を受ける1自由度系で最適な同調の式を導く。転がりの運動エネルギーと等価な慣性質量の対応を使って海洋プラットフォームの振動制御に適用する。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "転がる円盤形・リム形の質量を使う動吸振器（Disk-TMD、Rim-TMD）を提案し、同じ質量比で従来のTMDより揺れの増幅を抑え、同じ低減に必要な質量を約33.3%・50%減らせることを示した（抄録）。", "p3": "調和外力を受ける1自由度系に各TMDを付けた解析モデルを作り、転がりの運動エネルギーと等価な慣性質量の対応を使って、従来のTMDの同調式から最適な同調の式を導き、数値最適化とも比べた（抄録）。", "p5": "解析式と数値最適化の最適値はよく一致した。同じ質量比で2種類とも従来のTMDより動的増幅率のピークが低く、Rim-TMDが最もよかった。ダンパーの質量の行程も大きく減った（抄録）。", "fun": "高い建物や海の上の構造物の揺れを止めるには、逆向きに揺れる重りを付ける。重いほど効くが、重りが重すぎると困る。この研究は、重りを転がる円盤や車輪の形にすると、回転の勢いの分だけ重りが重くなったのと同じ効果が出ることを利用した。同じ効き目を半分の重さで得られるという発想が面白い。", "unverified": "本文は入手できず、海洋プラットフォームの具体的な解析例の数値は確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "工学", "headline": "内蔵した液柱ダンパーで巨大浮体の共振を平坦化", "title": "Nonlinear Resonance-Flattening Mechanism of an Internally Integrated TLCD for an Ultra-Large Floating Energy Island", "url": "https://doi.org/10.1142/s0219455428500952", "authors": "Jingtao Zhao ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-18", "citescore": 6.5, "citescore_year": "2025", "why": "超大型の浮体式エネルギー島のピッチ共振を、内部に組み込んだ同調液柱ダンパー（TLCD）で抑える仕組みを、応答の再構成、縮約したピッチ-液体モデル、非線形の液柱の解析で調べる。液体の参加、制御モーメントの位相、振幅に依存する減衰に注目する。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "超大型の浮体式エネルギー島に同調液柱ダンパー（TLCD）を内蔵すると、ピッチの共振のピークを約87%下げ、共振の帯域を約4倍に広げて、低く平らな共振に変えられることを示した（抄録）。", "p3": "事例に即した解析的な応答の再構成、縮約したピッチ-液体の定式化、補足の非線形の液柱の解析を組み合わせ、液体の参加、制御モーメントと浮体の運動の位相、振幅に依存する水理的な散逸に注目した（抄録）。", "p5": "ピッチの応答振幅演算子のピークは16.55から2.11 deg/mに下がり（約87%の抑制）、半値幅は約4倍になった。液柱の解析で、2次の水理損失が液体の運動の増加とともに等価減衰を強めることを独立に示した（抄録）。", "fun": "海に浮かぶ巨大な発電の島は、波の周期と合うと大きく前後に傾いて揺れる。その揺れを、島の中に仕込んだU字管の水の揺れで打ち消すのがこの装置だ。揺れの山を8割以上低くするだけでなく、山の幅を広げて、波の周期が多少ずれても効くようにした。ピークの高さだけでなく形全体で性能を見るべきだという指摘が面白い。", "unverified": "本文は入手できず、浮体と液体を連成させた検証は今後の課題とされている（著者も範囲を限定している）。"}}, {"id": "jn26", "rank": 26, "field": "工学", "headline": "風砂による塗膜の浸食と腐食が風車タワーの疲労に", "title": "Dynamic response and fatigue performance of wind turbine towers considering rotation-induced geometric stiffness and wind-sand erosion-corrosion damage", "url": "https://doi.org/10.1142/s0219455428500988", "authors": "Jiao Yu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-18", "citescore": 6.5, "citescore_year": "2025", "why": "風砂と塩性環境で塗膜が不均一に浸食され、場所ごとに鋼材の腐食の年数が異なる風車タワーについて、塗膜の破損の空間分布と時間発展を腐食損傷のモデルに移し、動的応答・疲労寿命・地震フラジリティへの影響を評価する。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "風砂と塩性の環境で塗膜が不均一に浸食される1.5 MWの風車タワーについて、要素ごとの腐食の年数を年単位で更新するモデルを作り、20年分の腐食の蓄積で疲労寿命が半減しうることを示した（抄録）。", "p3": "Bitterの浸食理論、ロータの後流の特性、地域の風砂のデータから塗膜の損傷評価モデルと最初の塗膜の破損の位置と時期を決める基準を作り、要素ごとに残りの板厚と材料特性を毎年更新し、ロータの回転を考えた全体の有限要素モデルで風応答・要素ごとの疲労寿命・地震のフラジリティを評価した（抄録）。", "p5": "塗膜の破損の年確率は後流域の外で0.40%、後流域で0.16%だった。W7の風条件で20年の腐食モデルの最小疲労寿命は健全なモデルより50.44%短く、最大地動加速度1.5gで第4限界状態の超過確率は27.9%から39.2%に上がった（抄録）。", "fun": "砂漠の近くの風車は、砂まじりの風で塗装が削られ、むき出しの鉄がさびていく。しかも削れ方は場所で違い、羽根の陰になる側は守られやすい。この研究は、どこがいつ削れ始めるかを一年ずつ追いかけて計算し、20年後には部材の寿命が半分にもなりうることを示した。目に見えにくい場所ごとの違いが、全体の弱さを決める点が面白い。", "unverified": "本文は入手できず、塗膜の損傷モデルの実測による検証の有無は確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "工学", "headline": "周期構造で回転機械の地盤振動の伝達を減らす", "title": "On the Potential of Periodic Structures to Minimize Ground Vibrations Induced by a Rotor-Structure-Foundation System", "url": "https://doi.org/10.1007/s42417-026-02896-9", "authors": "Amauri Coelho Ferraz ほか", "venue": "Journal of Vibration Engineering & Technologies", "date": "2026-11-18", "citescore": 4.5, "citescore_year": "2025", "why": "不釣り合いのある回転機械から構造・基礎・地盤へ伝わる振動を、回転機と地盤の間に部分的な周期構造を入れて減らせるかを調べる。非線形の回転機と線形の構造-基礎-地盤系に分け、モード諸量から時間領域の過渡応答を求める方法を示す。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "回転機械と地盤の間の支持構造に部分的な周期構造を入れると、加振の周波数がバンドギャップ内にあるとき振動の伝達を最大5桁小さくできることを、過渡応答の解析で示した（抄録）。", "p3": "不釣り合いのあるロータを剛基礎上の非線形の部分系、構造-基礎-地盤を線形の部分系に分け、後者の時間領域の式を周波数応答関数から取り出したモード諸量で組み立て、両者を交互の結合手順で連成した（抄録）。", "p5": "加振周波数がバンドギャップ内なら周期構造の区間で最大5桁の低減がみられ、その区間の位置で減衰の起きる場所が決まった。固定基礎と半無限地盤の両方で大きな低減が得られ、ロータの立ち上がりと第1共振付近での安定化も捉えた（抄録）。", "fun": "同じ形の部品を規則正しく並べた構造には、特定の範囲の周波数の揺れをほとんど通さない「バンドギャップ」が生まれる。この研究は、機械と地面の間の支えにその仕組みを組み込むと、地面に伝わる揺れを10万分の1にまで減らせる場合があることを示した。結晶が光を通さない仕組みと同じ考えを建物の振動に使う点が面白い。", "unverified": "本文は入手できず、実験による検証の有無は確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "工学", "headline": "周波数依存の区間不確実性と制振板の振動特性", "title": "Interval Uncertainty Analysis on Vibration Characteristics of CLD Plate with Interval Frequency-Dependent Parameters", "url": "https://doi.org/10.1142/s0219455427505031", "authors": "Zhang Dongdong ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-18", "citescore": 6.5, "citescore_year": "2025", "why": "拘束層制振（CLD）構造で、材料と幾何の不確実性を周波数依存の区間複素パラメータとして扱う区間解析法を開発する。有限要素モデルを区間の枠組みに拡張し、1次のテイラー展開で振動特性の区間を求める。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "拘束層制振（CLD）板の振動特性を、周波数に依存する複素の区間パラメータまで含めた区間解析で求める方法を作り、不確実性が10%以内ならモンテカルロに近い精度で予測できることを示した（抄録）。", "p3": "CLD構造の有限要素モデルを区間の不確実な幾何・材料パラメータを扱う枠組みに広げ、1次のテイラー展開で固有値とモード損失係数の感度を求め、粘弾性のコアの周波数依存の複素せん断弾性率の感度をWirtinger演算子で定式化した（抄録）。", "p5": "単独・連成の区間パラメータの不確実性が10%以内なら十分な精度で予測でき、モード損失係数はパラメータの変動に強く敏感だが、コアの周波数依存のせん断弾性率の影響は比較的小さかった（抄録）。", "fun": "金属板にゴムのような層と薄い板を重ねて貼ると、振動や騒音がよく減る。ただ、材料の性質や厚さには製造のばらつきがあり、狙った性能が出ないこともある。この研究は、ばらつきの幅だけを決めて、性能がどの範囲に収まるかを一度の計算で見積もる方法を作った。何万回もの試し計算を省ける点が面白い。", "unverified": "本文は入手できず、不確実性が10%を超える場合の精度は確認できなかった。"}}, {"id": "jn29", "rank": 29, "field": "工学", "headline": "8GBのGPUで動く橋梁点群の意味分割を比較", "title": "Deployable 3D Semantic Segmentation for AI-Assisted Bridge Inspection: Benchmarking Modern Point-Cloud Models Under an 8 GB GPU Constraint", "url": "https://doi.org/10.3390/infrastructures11110425", "authors": "Kenta Itakura ほか", "venue": "Infrastructures", "date": "2026-11-17", "citescore": 5.7, "citescore_year": "2025", "why": "橋梁点検と災害後の評価で必要な点群の部材ごとの意味分割を、専用メモリ8GBのGPU1台という制約の下で、最新の3次元分割モデルを実橋の点群で比べる。精度だけでなく現場で動かせるかを評価の軸にする。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "専用メモリ8 GBのGPU1台という制約の下で、実橋の点群の部材ごとの意味分割モデルを比べ、現場で使えるかは精度だけでなく計算時間・メモリ・データの違いへの頑健さの釣り合いで決まることを示した（抄録）。", "p3": "代表的なアーキテクチャを5つの異なる橋梁の点群データで比べ、mIoUと全体の精度に加えて、学習時間、GPUメモリのピーク、災害後の橋のデータへの汎化を報告した（抄録）。", "p5": "現場での使いやすさは、モデルの容量、メモリの使用量、単一データでの精度のどれか一つでは決まらなかった（抄録）。抄録にはモデルごとの数値の記載がない。", "fun": "橋の点検では、レーザーで測った無数の点を「桁」「橋脚」などに自動で塗り分けるAIが使われ始めている。ところが性能比べは、高価な計算機での正確さばかりで行われてきた。この研究は、現場に持っていけるふつうの計算機で動かし、時間やメモリ、別の橋への強さまで比べた。「使える」と「正確」は違うという視点が面白い。", "unverified": "本文は入手できず、比べたモデルの名前と各指標の値は確認できなかった。"}}, {"id": "jn30", "rank": 30, "field": "工学", "headline": "地方のコンクリート橋のひび割れ幅を機械学習で予測", "title": "Data-Driven Prediction of Crack Evolution in Regional Concrete Bridges: Comparison of Multiple Machine Learning Models", "url": "https://doi.org/10.3390/infrastructures11110427", "authors": "Ning Liang ほか", "venue": "Infrastructures", "date": "2026-11-18", "citescore": 5.7, "citescore_year": "2025", "why": "高速道路の橋170橋の2019〜2022年の点検記録669件で、主桁の最大ひび割れ幅を12の回帰モデルと2つのハイパーパラメータ探索の24通りで予測し比べる。構造・環境・交通・維持管理の12の特徴量を使う。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "高速道路のコンクリート桁橋170橋の点検記録から主桁の最大ひび割れ幅を予測し、勾配ブースティング系、特にCatBoostとOptunaの組合せが最も高い精度を示すことを明らかにした（抄録）。", "p3": "2019〜2022年の点検記録669件（構造・環境・交通・維持管理の12特徴量）を学習535件とテスト134件に分け、12の回帰モデルをGridSearchとOptunaのTPEで最適化した24通りを、橋ごとにまとめた5分割交差検証で比べ、SHAPで解釈した（抄録）。", "p5": "CatBoost–Optunaがテストで最も高いR²=0.9208（標準化したひび割れ幅でRMSE=0.0484、MAE=0.0387）を示した。SHAPでは橋齢、大型車の交通量、累積の車両荷重が予測への主な寄与だった（抄録）。", "fun": "橋のひび割れは、人が近づいて目で見て測るので、点検と点検の間に何が起きたかは分からない。この研究は、橋の年齢や通る大型車の量などから、ひび割れの幅をAIで予測した。古い橋ほど、重いトラックが多く通る橋ほどひび割れが広がりやすいという、直感とも合う結果を数字で示した点が面白い。", "unverified": "本文は入手できず、特徴量の一覧と他のモデルの精度は確認できなかった。"}}, {"id": "jn31", "rank": 31, "field": "工学", "headline": "多孔質の傾斜機能グラフェン補強シェルの主共振", "title": "Primary Resonance and Dynamic Stability of Simply Supported Porous FG-GPLRC Shallow Shells", "url": "https://doi.org/10.1142/s0219455428500976", "authors": "Zakia Hammou ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-18", "citescore": 6.5, "citescore_year": "2025", "why": "多孔質の傾斜機能グラフェン・ナノプレートレット補強複合材の浅いシェルについて、補強材の分布、厚さ方向の空隙率、曲率、幾何非線形、モードの相互作用が主共振と動的安定性にどう効くかを解析的な枠組みで調べる。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "多孔質の傾斜機能グラフェン・ナノプレートレット補強複合材（FG-GPLRC）の浅いシェルの主共振と動的安定性を解析的に調べ、補強材の分布と空隙率が非線形の振動を共同で決めることを示した（抄録）。", "p3": "厚さ方向の補強材と空隙の分布から有効な材料特性を求め、von Kármánの幾何非線形を含む浅いシェル理論をAiryの応力関数とGalerkin法で離散化し、多重尺度法で振幅-周波数関係を導き、Floquet理論で周期解の安定性と分岐を調べた（抄録）。", "p5": "補強材を増やすと有効な剛性が上がり共振周波数が変わり、空隙率を上げると剛性が下がり非線形の共振特性が変わった。有効な非線形係数は主に材料と形状で決まり、調べた条件では加振力の大きさにほぼよらなかった（抄録）。", "fun": "軽くて強い材料を作るため、樹脂の中にごく薄い炭素のシート（グラフェン）を混ぜ、わざと小さな穴も入れることがある。この研究は、そうした材料で作ったお椀のような曲面板が、強く揺さぶられたときにどう共振し、いつ不安定になるかを数式で調べた。混ぜ方と穴の配置で揺れ方を設計できる点が面白い。", "unverified": "本文は入手できず、数値例の具体的な値は確認できなかった。"}}, {"id": "jn32", "rank": 32, "field": "経営学", "headline": "AI時代の起業家はエコシステムの設計者になる", "title": "The entrepreneur as ecosystem architect: Economic foundations for strategic entrepreneurship in the age of AI", "url": "https://doi.org/10.1002/sej.70066", "authors": "David J. Teece", "venue": "Strategic Entrepreneurship Journal", "date": "2026-11-18", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "起業研究と革新からの利益獲得モデル、動的能力の枠組みを結び、AI時代の起業家の経済的な役割を、不確実性の下で組織の境界をまたいで補完的な資産と能力を編成するエコシステムの設計者として捉え直す。AIは開発費を下げるが規模拡大と優位の維持の障壁を高めうると論じる。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "AI時代の起業家の経済的な役割を、不確実性の下で組織の境界をまたいで補完的な資産と能力を編成する「エコシステムの設計者」として捉え直す理論的な枠組みを示した（抄録）。", "p3": "起業研究を、革新から利益を得るモデル（profiting from innovation）と動的能力の枠組みと結びつけて論じる概念的な研究（抄録）。", "p5": "AIはソフトウェアの開発費を大きく下げるが、規模の拡大と競争優位の維持の障壁を高めうり、価値の獲得は革新そのものより、魅力的な価値提案と、重要な補完的資産・設計上の支配点・移り変わるボトルネックへのアクセスと支配に依存すると論じる（抄録）。", "fun": "AIのおかげで、少人数でもすぐに製品を作れる時代になった。では起業は簡単になったのか。この論文は、作るのが簡単になったぶん、他社と組んだり、欠かせない部品や販路を押さえたりする「仕組みづくり」がますます勝負を決めると論じる。起業家の仕事が、作る人から、つなぐ人へ変わるという見方が面白い。", "unverified": "本文は入手できず、事例による裏づけの有無は確認できなかった。概念的な論文で実証はない。"}}, {"id": "jn33", "rank": 33, "field": "環境・気候政策", "headline": "気候政策とESGの不確実性が株式市場に波及する網", "title": "Climate Policy Uncertainty, ESG‐Based Sustainability Uncertainty, and Sectoral Transition‐Risk Monitoring in China", "url": "https://doi.org/10.1002/bse.71868", "authors": "Andrew Kwamina Bram ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-18", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "2002〜2024年の中国の11業種の株価指数と気候政策の不確実性・ESGの不確実性の指標に非対称のTVP-VARを当てはめ、業種間の連関の網の中で不確実性がショックの受け手になることを示す。業種別の移行リスクの監視への示唆を示す。", "explain": {"basis": "抄録", "basis_note": "出版社の登録の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "2002〜2024年の中国の業種別株価と気候政策の不確実性・ESGの不確実性の連関の網で、二つの不確実性はショックの受け手の位置にあり、連関は正負のリターンで非対称で時期によって変わることを示した（抄録）。", "p3": "11の業種別株価指数、気候政策の不確実性（CCPU）、ESGに基づく持続可能性の不確実性（ESGUI）の月次データに非対称のTVP-VARを当てはめ、全体と正・負のリターン成分の連関を推定し、ブートストラップと低次元の検証で確かめた（抄録）。", "p5": "受け手の位置はCCPUでより強く安定し、ESGUIは系の構成に敏感だった。エネルギー多消費・資本集約・インフラ・消費関連の業種が網の中で目立ち、非対称な連関はパリ協定後・二酸化炭素の二重目標の前の時期に最も高かった（抄録）。", "fun": "気候変動の政策がどう変わるか分からない、という不安は株価にどう伝わるのか。中国の業種ごとの株価との関係を調べると、政策の不安が株価を動かすというより、株価の動きが政策の不安の指標に波及する受け手側にあった。しかも下げ相場のほうがつながりが強かった。不安と市場の因果の向きを問い直す点が面白い。", "unverified": "本文は入手できず、連関の指標の具体的な値は確認できなかった。"}}, {"id": "jn34", "rank": 34, "field": "工学", "headline": "多忠実度CNNで非線形系のバックボーン曲線を予測", "title": "Multi-fidelity convolutional neural networks for backbone curves prediction in nonlinear dynamical systems", "url": "https://doi.org/10.1016/j.ymssp.2026.115180", "authors": "Peiyu Wang ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-18", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "抄録は取得できず、題名から、精度の異なる複数のデータを組み合わせるCNNで、非線形振動系の振幅と固有振動数の関係（バックボーン曲線）を予測する研究とみられる。", "explain": {"basis": "抄録", "basis_note": "題名で探したSSRN版の抄録（Crossrefに登録）を使用。出版社版の本文は入手できず", "preprint": false, "short": true, "p1": "調和バランス法の打ち切り次数を精度の段階として使う多忠実度の代理モデルで、摩擦を含む非線形系のバックボーン曲線（振幅による共振周波数と減衰の変化）を少ない計算で予測する枠組みを示した（抄録）。", "p3": "空間の離散化やモデルの階層ではなく、調和バランス法の高調波の分解能を精度の軸とし、バックボーン曲線を振幅方向に構造をもつ応答の場とみなして、MF-NN・MF-CNN・残差つきMF-CNNの3つの変種を作り、Co-Krigingと比べた（抄録）。", "p5": "2自由度の非線形振動子から高次元のブリスク-リングの組立まで、摩擦を含む3つの系で検証し、強い非線形のバックボーンの挙動の予測でデータ効率と頑健さが向上したとする（抄録）。抄録に数値の記載はない。", "fun": "ボルトで締めた部分のように摩擦がある構造は、揺れが大きくなると揺れやすい周期や揺れの収まり方が変わる。その変化を正確に計算するのは大変だが、粗い計算なら速くできる。この研究は、粗い計算と精密な計算をAIで上手に組み合わせ、精密な計算を少しだけ使って全体を予測した。粗さの度合いを計算法の中から見つけた点が面白い。", "unverified": "出版社版の本文は入手できず、SSRN版の抄録と出版版の内容が同一かは確認できなかった。改善の大きさの数値も未確認。"}}, {"id": "jn35", "rank": 35, "field": "工学", "headline": "管路網の状態と境界条件を二段階で推定", "title": "State and boundary condition estimation in pipeline networks using a two-stage sliding-mode framework", "url": "https://doi.org/10.1016/j.ymssp.2026.115257", "authors": "Morteza Imani ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-18", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "抄録は取得できず、題名から、二段階のスライディングモードの枠組みで管路網の内部状態と境界条件を推定する研究とみられる。", "explain": {"basis": "抄録", "basis_note": "題名で探したSSRN版の抄録（Crossrefに登録）を使用。出版社版の本文は入手できず", "preprint": false, "short": true, "p1": "管路網の内部の水理状態と、直接測れない境界条件（需要・流入・境界の水頭）を、内部の圧力の計測だけから実時間で同時に推定する2段のスライディングモード観測器の枠組みを示した（抄録）。", "p3": "弾性水柱モデル（EWCM）を線形時不変の形に直し、スライディングモード観測器の整合条件を満たさないため、高次スライディングモード観測器で生成した補助出力で出力を拡張し、圧力の計測と合わせて状態と未知の境界入力を復元する（抄録）。", "p5": "代表的な管路網の数値実験と分岐のある水理実験装置の試験で、内部の圧力の計測だけから時間変化する境界条件を正確に同定できたとする（抄録）。抄録に誤差の数値の記載はない。", "fun": "水道管の網では、どこでどれだけ水が使われているかを全部測るのは難しい。この研究は、管の途中の圧力計だけを手がかりに、見えない出入口の水の出入りまで実時間で推定する方法を作った。測れない量を、測れる量の揺れから逆算する「観測器」という制御工学の道具の使い方が面白い。", "unverified": "出版社版の本文は入手できず、SSRN版の抄録と出版版の内容が同一かは確認できなかった。推定誤差の数値も未確認。"}}, {"id": "jn36", "rank": 36, "field": "工学", "headline": "ペリダイナミクスで円筒シェルの亀裂と破壊を解析", "title": "A Peridynamic-Semi-Analytical Framework with Rotational Springs for Modeling Crack-Induced Discontinuities and Progressive Failure in Cylindrical Shells", "url": "https://doi.org/10.1016/j.tws.2026.116018", "authors": "Morteza Khomami Abadi ほか", "venue": "Thin-Walled Structures", "date": "2026-11-17", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "why": "抄録は取得できず、題名から、回転ばねを入れたペリダイナミクスと半解析を組み合わせ、円筒シェルの亀裂による不連続と進行性の破壊をモデル化する研究とみられる。", "explain": {"basis": "題名", "basis_note": "出版社のサイトは取得できず、抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名からは、回転ばねを入れたペリダイナミクスと半解析を組み合わせ、円筒シェルの亀裂による不連続と進行性の破壊をモデル化する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "普通の構造計算は、材料がつながっていることを前提にしているので、割れて離れる場面が苦手だ。ペリダイナミクスは、少し離れた点どう
