 "Journal of Labor Economics", "date": "2026-11-17", "sjr": 6.774, "citescore": 8.5, "citescore_year": "2025", "why": "抄録は取得できず、題名から、自動化が職業の男女分離と技能の男女差にどのような含意をもつかを分析する研究とみられる。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社のサイトの抄録は取得できず）。本文は入手できず", "preprint": false, "short": true, "p1": "過去40年の米国で、自動化の影響を受けやすい地域ほど、女性が男性より定型的な職から高技能・高賃金の職へ移り、職業の男女分離が縮まり若い女性の大学進学も増えたことを示した（抄録）。", "p3": "地域の歴史的な産業構造による自動化への曝露の違いを使って通勤圏ごとに因果的な関係を推定し、社会的スキルと定型業務が補完的で女性が社会的スキルに比較優位をもつ、技能投資を内生化した職業選択モデルで説明した（抄録）。", "p5": "1980年に女性は自動化の危険の高い職に多くいたが、自動化への曝露の変化に対し、その後10年で男性より多く高技能・高賃金の職に移った。曝露の大きい地域ほど職業の男女の統合が進み、若い女性の大学進学が大きく伸び、社会的スキルの高い職への移動も女性で大きかった（抄録）。", "fun": "機械に仕事を奪われるのは誰か。1980年には女性のほうが自動化されやすい仕事に多く就いていたのに、その後の40年で、女性のほうがうまく高い技能の仕事へ移っていった。人と接する力（社会的スキル）が機械に置き換えにくく、女性がそれを得意としていたからだという。技術の変化が男女の格差をむしろ縮めうる点が面白い。", "unverified": "本文は入手できず、効果の大きさの推定値は確認できなかった。出版社のサイトの抄録と同一かも未確認。"}}, {"id": "jn42", "rank": 42, "field": "機械学習", "headline": "統計的関係学習に基づくニューロシンボリックの枠組み", "title": "A Neuro-symbolic Framework under Statistical Relational Learning", "url": "https://doi.org/10.1109/tpami.2026.3755075", "authors": "Dongran Yu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-17", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "抄録は取得できず、題名から、統計的関係学習の下でニューラルネットと記号推論を統合する枠組みを提案する研究とみられる。", "explain": {"basis": "題名", "basis_note": "出版社のサイトは取得できず、抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名からは、統計的関係学習（関係データの確率的なモデル化）の枠組みの下で、ニューラルネットと記号的な推論を統合するニューロシンボリックの枠組みを提案する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "AIには、大量のデータから傾向を学ぶのが得意なニューラルネットと、規則に沿って筋道立てて考えるのが得意な記号推論の二つの流れがある。題名から読み取れる問いは、物どうしの関係を確率で扱う考え方を土台にして、この二つの長所を一つにまとめられるか、という点にある。", "unverified": "抄録・本文を入手できず、手法・検証・結果はすべて未確認。"}}, {"id": "jn43", "rank": 43, "field": "機械学習", "headline": "動的スパースアダプタでLLMを少ない資源で継続学習", "title": "Low-Resource Continual Learning for LLMs: Efficient Incremental Training with Dynamic Sparse Adapt al Journal of Disaster Risk Reduction", "date": "2026-11-18", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "why": "抄録は取得できず、題名から、1985年のアルジェリア・コンスタンティーヌ地震を多重対応分析で振り返り、地震リスクの文化と社会のレジリエンスを論じる研究とみられる。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社のサイトの抄録は取得できず）。本文は入手できず", "preprint": false, "short": true, "p1": "1985年のアルジェリア・コンスタンティーヌ地震（M6.0）の経験者への質的調査と多重対応分析から、地震の経験とリスクへの反応で人々を3つに分類し、備えの文化とリスクの認識がレジリエンスを高めることを示した（抄録）。", "p3": "1985年の地震を経験した人々への質的な調査を行い、多重対応分析（MCA）で回答のパターンを整理した（抄録）。", "p5": "地震の経験とリスクへの反応で3つの類型が得られた。備えの文化とリスクの認識は先を見越す力を高め、認識されたリスクと実際のリスクの差を縮めるとし、参加者は情報の普及と地震リスクの教育の推進を提案した（抄録）。", "fun": "大地震から40年近くたって、当時を経験した人々に話を聞くと、その経験の受け止め方や備えへの姿勢は一様ではなかった。この研究は、人々の答えのパターンを統計の地図に描き、3つのタイプに分けた。災害の記憶を「文化」として次の世代にどう受け渡すかを考えさせる点が面白い。", "unverified": "本文は入手できず、調査の人数と3類型の内訳は確認できなかった。出版社のサイトの抄録と同一かも未確認。"}}, {"id": "jn46", "rank": 46, "field": "環境・気候政策", "headline": "鉱業の世界の水フットプリントを勘定する", "title": "Accounting for the mining industry’s global water footprint", "url": "https://doi.org/10.1038/s41893-026-01945-1", "authors": "Tim T. Werner ほか", "venue": "Nature Sustainability", "date": "2026-11-17", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "why": "抄録は取得できず、題名から、鉱業が世界で使う水の量（水フットプリント）を評価する研究とみられる。", "explain": {"basis": "題名", "basis_note": "出版社のサイトは取得できず、抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名からは、鉱業が世界全体で使う水の量（水フットプリント）を勘定・評価する研究とみられる（題名）。記事の種類（研究論文か論評か）も未確認。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "スマートフォンや電気自動車に欠かせない銅やリチウムを掘り出すには、大量の水が使われる。しかも鉱山は乾いた土地にあることが多い。題名から読み取れる問いは、世界中の鉱業がどれだけの水を使い、どこの水を圧迫しているのかを、帳簿のように数え上げられるか、という点にある。", "unverified": "抄録・本文を入手できず、手法・検証・結果はすべて未確認。"}}, {"id": "jn47", "rank": 47, "field": "環境・気候政策", "headline": "国境をまたぐ充電費の差を電動トラックの計画に", "title": "Integrating cross-border charging cost differentials into charging infrastructure planning for long-haul battery-electric trucks", "url": "https://doi.org/10.1016/j.esr.2026.102398", "authors": "Antonia Golab ほか", "venue": "Energy Strategy Reviews", "date": "2026-11-18", "sjr": 2.38, "citescore": 17.4, "citescore_year": "2025", "why": "抄録は取得できず、題名から、国境をまたぐ充電費用の差を、長距離の電動トラックの充電インフラの計画に組み込む研究とみられる。", "explain": {"basis": "抄録", "basis_note": "題名で探したSSRN版の抄録（Crossrefに登録）を使用。出版社版の本文は入手できず", "preprint": false, "short": true, "p1": "国ごとに異なる充電費用を組み込んだ線形の費用最適化で、国際長距離の電動トラックの普及と充電設備の配置を求め、休憩地点で充電する経験則より少ない設備で済み、配置も大きく違うことを示した（抄録）。", "p3": "発着地の貨物の流れごとの電動トラックの採用と経路ごとの充電需要の配分を最適化し、NUTS-2の解像度で充電容量の拡張を決めるモデルを、7か国にまたがるスカンジナビア-地中海回廊に4つのエネルギーシナリオ（2020〜2050年）で適用した（抄録）。", "p5": "費用最適な普及の経路は国の組合せで最大29ポイント異なり、最適な充電容量の51%は義務の休憩地点で充電する経験則と違う場所に置かれ、総容量は17%少なかった。鉄道への転換が国境付近への需要の集中を強めうり、局所的な電気料金と系統料金の上乗せは需要を隣の地点へ移した（抄録）。", "fun": "国境を越えて走る電気トラックは、電気代の安い国でまとめて充電したほうが得になる。この研究は、国ごとの電気代の違いを計算に入れて、充電所をどこにどれだけ造るべきかを最適化した。運転手の休憩場所に合わせて造る素直な案と比べると、半分の充電所が別の場所になった。値段の差が道路の地図を書き換える点が面白い。", "unverified": "出版社版の本文は入手できず、SSRN版の抄録と出版版の内容が同一かは確認できなかった。"}}, {"id": "jn48", "rank": 48, "field": "環境・気候政策", "headline": "予算制約下で都市の熱リスクの対策を選ぶ", "title": "Robustness diagnostics and budget-constrained heat-risk mitigation of urban heat island networks under heatwave exposure: Evidence from the Changsha–Zhuzhou–Xiangtan urban agglomeration", "url": "https://doi.org/10.1016/j.uclim.2026.103180", "authors": "Qianli Ouyang ほか", "venue": "Urban Climate", "date": "2026-11-17", "sjr": 1.714, "citescore": 12.2, "citescore_year": "2025", "why": "抄録は取得できず、題名から、長株潭都市圏の熱波下のヒートアイランドのネットワークの頑健性を診断し、予算制約の下で熱リスクの緩和策を選ぶ研究とみられる。", "explain": {"basis": "題名", "basis_note": "出版社のサイトは取得できず、抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名からは、長株潭都市圏を例に、熱波の下でのヒートアイランドのネットワークの頑健性を診断し、予算の制約の下で熱リスクの緩和策を選ぶ研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "都市の暑さは、熱がたまる場所どうしが風の通り道や地形でつながり、網の目のように広がる。題名から読み取れる問いは、その網のどこを冷やせば全体が最も効率よく涼しくなるか、限られた予算でどこから手を打つべきか、という点にある。", "unverified": "抄録・本文を入手できず、手法・検証・結果はすべて未確認。"}}], "data_related": [{"rank": 1, "headline": "車両群で測った路面の粗さを日単位で使える", "title": "CAMBER – NIRA Dynamics road roughnes   ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
