<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

を復元しないことを示した（抄録）。未査読。", "p3": "ベンガル湾の日次OISST（1982–2024年）と、流れの強さを制御した同じ格子の合成データで、事前情報を損失や輸送ステップに入れる設計を不均一分散のConvLSTMで比べた（抄録）。", "p5": "実データで15日先のCRPSの差は−0.007℃（95%区間−0.022〜+0.008）で、学習した流速の相関は日付をシャッフルした対照と同程度だった。予測先ごとに分散の倍率を1つ較正すると90%区間の被覆が0.85〜0.91になり、1日先のCRPSが13〜21%下がった（抄録）。", "fun": "天気予報のAIに「水は流れに乗って運ばれる」という物理を教えれば賢くなるはず、と考えるのは自然だ。ところが実際の海のデータでは効き目がはっきりせず、AIが覚えた「流れ」も本物の海流とほとんど一致しなかった。むしろ効いたのは、予報の自信の幅を正しく調整することだった。物理を入れる場所より、外れ方を正直に見積もることが大事だという結果が面白い。", "unverified": "本文は入手できず、各設計の詳細と合成データの条件は確認できなかった。抄録は以前の版の81%改善の主張を撤回したと述べるが、その経緯は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "一般化直交基底によるデータ駆動のモデル縮約", "title": "Data-driven model reduction: An identification perspective using Generalized Bases of Orthonormal Functions", "url": "https://arxiv.org/abs/2611.22354", "authors": "Bernard Vau ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Vau, B., & Bourlès, H. (2026). Data-driven model reduction: An identification perspective using Generalized Bases of Orthonormal Functions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22354", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "システム同定の考え方を使い、一般化直交伝達関数基底（GBOF）で低次元のモデルを作るデータ駆動のモデル縮約法を提案した（抄録）。未査読。", "p3": "方程式誤差の定式化を改め、モデルをGBOFでパラメータ化し、GBOF変換に伴うHambo周波数領域で縮約の問題を立てる。基底の極の選び方で周波数領域の当てはまりを調整し、極に依存する適合指標で選択の目安を与える（抄録）。", "p5": "抄録には数値の結果がなく、導入した適合指標が基底の極を選ぶ経験的な手がかりになると述べるにとどまる（抄録）。", "fun": "複雑な機械や建物の揺れ方を、少ない部品で真似できる「簡単なモデル」に置き換えると計算がずっと速くなる。この研究は、その部品に決まった型の関数の組み合わせを使い、どの型を選ぶかで似せ方を調整する。音色を少数の音の重ね合わせで表すように、揺れの性質を少数の基本パターンで表す発想だ。", "unverified": "本文は入手できず、適用例・比較対象・数値結果は確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "限られた観測点で関数データの変化を最速検知", "title": "FAST: Functional Adaptive Sensing and Testing for Quickest Change Detection", "url": "https://arxiv.org/abs/2611.22581", "authors": "Peiyao Liu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liu, P., Guo, J., Wang, Z., Zhang, X., & Chen, N. (2026). FAST: Functional Adaptive Sensing and Testing for Quickest Change Detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22581", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "連続領域の一部の点しか観測できない関数データの流れで、観測点の選び方と変化の検知を同時に行う最速変化検知法FASTを示した（抄録）。未査読。", "p3": "変化後の平均のずれが局所的な基底で疎に表せると仮定し、変化後の母数の推定、観測位置の選択、逐次検知を同時に行う。平均連長の制約の下で最悪の検出遅れのミニマックス下界と、適応的な観測に依存する推定誤差の非漸近的な上界を導く（抄録）。", "p5": "観測点の部分集合を厳密に最適化できれば、FASTは一次の漸近最適性をもつ。シミュレーションと山火事の事例で性能を示した（抄録）。", "fun": "広い森の火事を見張るのに監視カメラを数台しか置けないとしたら、どこに向ければよいか。この研究は、異変の後に「どこで何が変わったか」を推定しながら見る場所を動かし、できるだけ早く異変を見つける方法を作った。しかも「これより早くは見つけられない」という理論上の限界まで示した点が面白い。", "unverified": "本文は入手できず、シミュレーションの条件と山火事の事例の数値は確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "無雑音観測の拡散過程を多層粒子フィルタで推定", "title": "Multilevel Filtering on Manifolds with Light Schr\\\"odinger Bridges", "url": "https://arxiv.org/abs/2611.22443", "authors": "Jason Beh ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Beh, J., Del Moral, P., & Jasra, A. (2026). Multilevel Filtering on Manifolds with Light Schrödinger Bridges (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22443", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "雑音のない観測が隠れた状態を多様体（球面や平面など）に制約する拡散過程のフィルタリングで、多層モンテカルロが効く粒子フィルタを作った（抄録）。未査読。", "p3": "軽いシュレディンガー橋（light Schrödinger bridge）で、観測ごとに変わる多様体の間を結ぶ粒子フィルタを作り、離散化の水準の間で結合させる。前の状態は少数の特徴量を通じてだけ入るので、橋は新しい多様体上で当てはめれば足りる（抄録）。", "p5": "偏りと隣接水準の近似の差の上界を示し、球面や型の変わる多様体でその差が標準の多層粒子フィルタよりはるかに小さく、当てはめの費用を含めても、細かい水準で使う混成推定量が小さな許容誤差での費用を下げた（抄録）。", "fun": "見えない箱の中でボールが揺れ動いていて、ときどき「今はこの球の表面のどこかにある」とだけ正確に分かる、という状況を考える。その情報からボールの位置を推定するのは意外に難しい。この研究は、ある面から次の面へ粒子の群れを上手に運ぶ「橋」を作り、粗い計算と細かい計算を組み合わせて安く正確に推定する工夫をした。", "unverified": "本文は入手できず、計算費用の削減の程度は数値で確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "故障しうるセンサ下で仲間の重みを変える集団推定", "title": "DGF-Asym: Adaptive Peer Weighting for Collective Estimation under Noisy and Faulty Sensing", "url": "https://arxiv.org/abs/2611.22532", "authors": "Mohammad Nomaan Husain ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Husain, M. N., & Kaiser, T. K. (2026). DGF-Asym: Adaptive Peer Weighting for Collective Estimation under Noisy and Faulty Sensing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22532", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "雑音や故障のあるセンサをもつロボットの群れが、仲間の情報の重みを過去の予測の当たり具合で変えることで、故障の統計を知らなくても安定に合意推定できる方法DGF-Asymを示した（抄録）。未査読。", "p3": "DeGroot–Friedkinモデルを拡張し、過去の予測性能に基づく非対称な重みづけを入れた分散型の推定で、通信は非同期のまま雑音統計や故障モデルを仮定しない。雑音と時間変化する故障のある集団航行のシミュレーションで3つの基準法と比べた（抄録）。", "p5": "推定はより安定し判断基準をより確実に保てたが、判断までの時間は長くなった。性能は故障の割合、集団の大きさ、影響のしきい値の選び方に依存した（抄録）。", "fun": "クラスで答えを相談するとき、よく間違える人の意見を少し割り引いて聞けば全体の答えが安定する。このロボットの群れも、仲間ごとに「最近どれくらい当たっていたか」を覚え、外れがちな仲間の意見を軽く扱う。壊れたセンサがどれかを事前に知らなくても、付き合い方で自然に見分けられる点が面白い。", "unverified": "本文は入手できず、比較した3手法の内容と具体的な数値は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "衝突のある運動論方程式のUQにNN代理を使う", "title": "Micro-Macro Tensor Neural Surrogates for Uncertainty Quantification in Collisional Plasma", "url": "https://arxiv.org/abs/2512.24205", "authors": "Wei Chen ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Chen, W., Dimarco, G., & Pareschi, L. (2025). Micro-Macro Tensor Neural Surrogates for Uncertainty Quantification in Collisional Plasma (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2512.24205", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "衝突のあるプラズマの運動論方程式（Vlasov–Poisson–Landau系）の不確実性評価を、ニューラル代理モデルを制御変量に使う分散低減モンテカルロで効率化した（抄録）。未査読。", "p3": "高精度で漸近保存性をもつVPLソルバーに、相関の強い安価な代理（VPFP方程式とEuler–Poisson方程式）を組み合わせる。代理にはミクロ-マクロ分解に基づくテンソル型のニューラルネット（分離型PINNの一般化）と、クヌーセン数の小・大の極限を再現する漸近保存のSPINNを使う（抄録）。", "p5": "標準のモンテカルロより分散が大きく減り、高精度の標本をずっと少なくして正確な統計量が得られ、計算時間も短く、確率次元にも頑健だった（抄録）。", "fun": "プラズマの粒子は位置と速度を合わせた6次元の空間に広がっていて、その分布の時間変化を何度も計算するのは非常に重い。この研究は、正確だが重い計算を少しだけ行い、似た答えを素早く出すAIの近似計算でその差を埋めて、結果のばらつきを減らす。重い計算を答え合わせに、AIを下書きに使う分業の発想が面白い。", "unverified": "本文は入手できず、分散の削減率や計算時間の具体的な数値は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "積分形PINNで高次の相互作用を雑音に強く復元", "title": "Higher-Order Interaction Reconstruction via Integral Physics-Informed Neural Networks", "url": "https://arxiv.org/abs/2611.21935", "authors": "Xin Mao ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Mao, X., Xu, Z., Yang, S., Yun, S., Liu, Y., Wang, R., Chen, T., & Chen, C. (2026). Higher-Order Interaction Reconstruction via Integral Physics-Informed Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21935", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "雑音が多く疎な観測から、ネットワーク上の高次の相互作用（3者以上の同時の相互作用）を復元する積分形の物理情報つきニューラルネットIntegralPINNを提案した（抄録）。未査読。", "p3": "微分に基づく物理残差の代わりに時間区間での積分形を使い、高周波の雑音と微分による不安定さを抑える。相互作用テンソルを連続的にパラメータ化して勾配法で同定し、積分窓が励振条件を満たせば微分の増幅に依存しない誤差の上界が成り立つことを示す（抄録）。", "p5": "生態系の動態、社会的な伝播、神経の同期の系で、雑音と疎な観測の下でも正確で頑健に復元し、既存の最先端の手法を上回った（抄録）。", "fun": "3人で集まると2人ずつのときとは違う盛り上がり方をするように、生き物や人の関係には「3者以上がそろって初めて起きる効果」がある。その効果をデータから見つけるのは、組み合わせが爆発的に多いうえに観測が雑音だらけで難しい。この研究は、変化の速さ（微分）ではなく一定時間の変化の合計（積分）を見ることで、雑音に強く当てる工夫をした。", "unverified": "本文は入手できず、比較した手法と精度の数値は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "非線形ナッジングでNS方程式の状態を同化", "title": "Finite element nonlinear nudging for the Navier-Stokes equations", "url": "https://arxiv.org/abs/2611.23036", "authors": "Elizabeth Carlson ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Carlson, E., Fang, R., & Pakzad, A. (2026). Finite element nonlinear nudging for the Navier-Stokes equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23036", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "観測との誤差が小さくなるほど強く引き寄せる非線形ナッジング（連続データ同化）を、3次元の非圧縮Navier–Stokes方程式の有限要素法に入れ、安定性と有限時間での収束を示した（抄録）。未査読。", "p3": "inf-sup安定な要素を使う陰陽混合（IMEX）の有限要素スキームを提案し、無条件の長時間安定性と、空間の半離散スキームで誤差が有限時間で許容値に達することを証明する。非線形ナッジングの強さχは観測格子の大きさHに対しχ=O(H^{-1})の細かさを要する（抄録）。", "p5": "周期箱内の強制粘性流、円柱まわり、平板上の流れの数値実験で、非線形ナッジングは線形ナッジングよりかなり速く真の解に同期し、一部の領域の観測だけで流れ全体を同期できた（抄録）。", "fun": "計算機の中の流れを、実際の流れの観測に少しずつ引き寄せて一致させるのがデータ同化だ。普通の方法は、ずれに比例した力で引き寄せる。この研究では、ずれが小さくなるほどむしろ強く引き寄せる工夫で、最後の詰めが格段に速くなる。しかも一部の場所を観測するだけで、流れ全体がそろってしまう点が面白い。", "unverified": "本文は入手できず、同期にかかる時間の具体的な数値は確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "排他過程から導く群衆の平均場ゲーム", "title": "Crowd model with anticipation and interactions: an exclusion process based mean-field game", "url": "https://arxiv.org/abs/2611.22502", "authors": "Konstantinos Koutsomitis ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Koutsomitis, K., Appert-Rolland, C., & Ullmo, D. (2026). Crowd model with anticipation and interactions: an exclusion process based mean-field game (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22502", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "歩行者どうしの押し合い（粒としての排他）を明示的に含む微視モデルから、先読みを伴う群衆の平均場ゲームを導き、避難に応用した（抄録）。未査読。", "p3": "相互作用のないランジュバン動力学に基づく標準の平均場ゲームは、ボトルネックや避難で重要な粒状の効果を無視している。そこで、相互作用を明示する非対称単純排他過程から対応する平均場ゲームを導出する（抄録）。", "p5": "避難の設定に適用し、標準の平均場ゲームとの違いと、粒状の相互作用が生む相関を論じた（抄録）。", "fun": "大勢が出口に向かうとき、人は先を読んで道を選ぶが、同じ場所に2人は立てない。従来の数式は「先読み」は扱えても、人が粒としてぶつかり合う効果を無視していた。この研究は、1マスに1人しか入れないという単純な規則から出発して先読みの理論を作り直し、避難の混雑を現実に近づけようとした。", "unverified": "本文は入手できず、避難の計算例での違いの大きさは確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "情報理論でカテゴリ変数から地すべり感受性", "title": "Information-theoretic modeling of landslide susceptibility using mostly categorical spatial data", "url": "https://doi.org/10.5194/egusphere-2026-6800", "authors": "David Percy ほか", "venue": "EGUsphere", "date": "2026-11-17", "apa": "Percy, D., Burns, S., Booth, A. M., & Zwick, M. (2026). Information-theoretic modeling of landslide susceptibility using mostly categorical spatial data. https://doi.org/10.5194/egusphere-2026-6800", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "地質・土壌・土地利用といったカテゴリ変数をそのまま使う情報理論的な再構成分析（RA）で、ランダムフォレストに近い精度の解釈可能な地すべり感受性モデルを作った（抄録）。未査読。", "p3": "米国オレゴン州海岸山脈の隣接2流域（3,500 km²）で、主にLiDARから描いた約9,000の地すべり堆積物と、岩相・土壌・土地被覆の層、最適な区間に離散化した地形変数を使い、シャノン・エントロピーに基づくRAを当てはめた（抄録）。", "p5": "岩相で火山岩と堆積岩に層別すると地すべり率は44%と60%で、最良のRAモデルの検証精度は75%と71%とランダムフォレストにほぼ並び、堆積岩では保水性の高い2つのアンディック土壌の亜群が最も地すべりしやすかった（抄録）。", "fun": "機械学習で地すべりの起きやすさを予測するとき、「どんな岩か」「どんな土か」といった名前の情報は、数字に置き換えられて味が薄まりがちだ。この研究は、情報量（エントロピー）の考え方でその名前の情報をそのまま使い、精度をあまり落とさずに「この土とこの地形の組合せが危ない」と読める表を作った。予測の中身が人に読める点が面白い。", "unverified": "本文は入手できず、比較に使ったランダムフォレストの精度の数値は抄録からは確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "斜面単位ごとに動的な降雨しきい値を導く", "title": "Spatial dynamic rainfall thresholds for landslide in the Aburrá Valley, Colombia", "url": "https://doi.org/10.5194/egusphere-2026-6736", "authors": "Oscar Sanchez ほか", "venue": "EGUsphere", "date": "2026-11-18", "apa": "Sanchez, O., & Aristizábal, E. (2026). Spatial dynamic rainfall thresholds for landslide in the Aburrá Valley, Colombia. https://doi.org/10.5194/egusphere-2026-6736", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "コロンビアのアブラ谷で、斜面単位ごとに地形・土地被覆・ENSOの位相・先行降雨で変わる動的な降雨しきい値を導き、どこで・いつ斜面が危険になるかの4段階の警報を作った（抄録）。未査読。", "p3": "2011〜2025年の日付つきの地すべり492件、4つの地形変数、降雨、ENSOの位相を使い、非発生の観測を斜面単位・日付・どちらも共有しない3通りの設計で各100回抽出して、ロジスティック回帰・一般化加法モデル・ランダムフォレストを比べた（抄録）。", "p5": "ROC曲線下面積の中央値は0.955〜0.988で、手法の差は小さく、設計の違いが効く予測変数を変えた。学習に使わなかった2025年の大きい方の災害では、地すべりのあった斜面単位の78%が報告前に高・非常に高に達し、谷全体では11%だった（抄録）。", "fun": "大雨のときに「この町が危ない」と言うだけでは足りず、「どの斜面が危ないか」まで言えれば避難が的確になる。この研究は斜面ごとに危険の目安となる雨量を作り、土地の様子やエルニーニョの状態で目安が上下する仕組みにした。予測の良し悪しが計算方法よりも「起きなかった例」の選び方で変わるという指摘が面白い。", "unverified": "本文は入手できず、各警報水準の具体的な雨量のしきい値は確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "非局所平均で鋭い亀裂のエネルギーを正則化", "title": "Nonlocal regularization of sharp-crack energetics: a variational bridge from Griffith geometry to emergent constitutive degradation", "url": "https://arxiv.org/abs/2611.22284", "authors": "Qing Cheng ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Cheng, Q., Sun, Y., & Xu, X. (2026). Nonlocal regularization of sharp-crack energetics: a variational bridge from Griffith geometry to emergent constitutive degradation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22284", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "引張のひずみエネルギーの非局所平均だけから材料の劣化が自然に出てくる変分的な拡散亀裂モデルを作り、別の破壊場や劣化則を導入せずに亀裂を扱えるようにした（抄録）。未査読。", "p3": "尺度を付けた引張エネルギーの平均に有界なポテンシャルを作用させ、圧縮のエネルギーは局所のままにする。第1変分から、引張の寄与に飽和ポテンシャルの導関数の随伴平均がかかる構成則の応力が得られ、構造を保つSAVスキームで離散的なエネルギー収支を厳密に満たす（抄録）。", "p5": "平均化の半径を0に近づけると古典的な弾性ひずみエネルギーに収束し、平面の開口ではGriffithの表面エネルギー係数を回復する。動的な亀裂の分岐とKalthoff–Winklerの衝撃問題でSAVと速度ベルレの解を比べた（抄録）。", "fun": "ガラスにひびが入るように、亀裂は「とても細い線」として扱うのが本来の姿だが、計算機ではその細さが扱いにくい。この研究は、周りのひずみを少しぼかして平均するだけで、ひびのエネルギーと材料の弱まりを同時に表せることを示した。余分な仮定を足さずに、古典的な破壊の法則が極限で戻ってくる点が面白い。", "unverified": "本文は入手できず、分岐の数値例でSAVと速度ベルレの結果がどう違ったかは確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "反実仮想説明と形式的説明の関係を整理", "title": "On Formal Counterfactual Explanations", "url": "https://arxiv.org/abs/2611.22010", "authors": "Alexey Ignatiev ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Ignatiev, A., Stuckey, P. J., & Marques-Silva, J. (2026). On Formal Counterfactual Explanations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22010", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "最近傍世界の意味論による反実仮想説明と、形式的XAIの帰納的説明（AXp）・対照的説明（CXp）を結び、予測の変化を保証する連言形の反実仮想説明（CFXp）を導入した（抄録）。未査読。", "p3": "最近傍世界の反実仮想説明を、最小距離の反例すべての選言標準形として明示的に特徴づける。CXpは証拠のインスタンスのAXpを誘導し、CXpと証拠のAXpからCFXpが得られるという構造的な結果を示し、既存のAXp/CXpの計算でCFXpを求める（抄録）。", "p5": "木のアンサンブルとニューラルネットのベンチマークでCFXpの抽出は実用的に効率的で、点ベースの反実仮想説明より変える特徴が多くならず、単一の事例を超えて反実仮想の予測を保証できた（抄録）。", "fun": "「もし借入があと少し少なければ審査に通った」という説明は分かりやすいが、本当にそれだけ変えれば結果が変わるのかは保証されていないことが多い。この研究は、論理の言葉で説明を整理し直し、「この条件をそろえれば必ず結果が変わる」と言える説明を効率よく見つける方法を作った。分かりやすさと確実さを両立させる点が面白い。", "unverified": "本文は入手できず、ベンチマークの名前と計算時間の数値は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "コピュラによる表形式合成データの得失", "title": "Copula-Based Synthetic Data Generation: A Use-Inspired Perspective on Trade-offs", "url": "https://arxiv.org/abs/2611.22882", "authors": "Antoine Faul ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Faul, A., Ginsbourger, D., Spycher, B., & Stute, P. (2026). Copula-Based Synthetic Data Generation: A Use-Inspired Perspective on Trade-offs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22882", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ガウス混合コピュラで多変量の表形式データの同時分布を表すことで、合成データの忠実度・有用性・秘匿性をバランスよく満たし、確率モデルとして解釈もできることを示した（抄録）。未査読。", "p3": "中程度の次元のデータに焦点を当て、コピュラによる確率的な生成を使い、合成データの評価に内在する忠実度・有用性・秘匿性の3つの得失を、使い道に即した視点から検討する。心血管リスク計算機での系統的な欠測の事例で専用の評価指標を作った（抄録）。", "p5": "コピュラに基づく方法は3つの次元で均衡がとれ、明示的な確率モデルを与えると述べる（抄録）。数値の比較は抄録に記載がない。", "fun": "本物の個人データを配れないとき、性質の似た「にせのデータ」を作って配る方法がある。ただし本物に似せすぎると個人が特定され、離れすぎると役に立たない。この研究は、変数どうしのつながり方だけを取り出して表す「コピュラ」という数学の道具を使い、その綱渡りを中身の見える形でこなせることを示した。", "unverified": "本文は入手できず、比較した他の生成法と評価の数値は確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "質の低い仮想の協働の後は相手を信頼しにくい", "title": "Trust Building in Virtual Interaction Environments", "url": "https://doi.org/10.2139/ssrn.7701486", "authors": "Jonas Backhus ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Backhus, J., Langer, T., Mohrschladt, H., & Selimaj, E. (2026). Trust Building in Virtual Interaction Environments. https://doi.org/10.2139/ssrn.7701486", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "やりとりの質が低いとき、ビデオ会議やアバターのVRで共同作業した相手は、対面で作業した相手より信頼されにくいことを2つの実験で示した（抄録）。未査読。", "p3": "2人組でインセンティブつきの共同作業（実験1は金融の助言、実験2は協力型のクイズ）を対面・ビデオ会議・VRの作業室のいずれかで行い、その後に元の相手と信頼ゲームをさせた（抄録）。", "p5": "やりとりの質が低いと仮想環境の後の信頼は対面より低いが、質が高いと仮想環境の不利は弱まり、対面で作られた信頼は質の影響を受けにくかった。この傾向は非対称な助言と対称な協力の両方で成り立った（抄録）。", "fun": "オンライン会議が当たり前になったが、画面越しの相手を本当に信頼できるのか。実験すると、会話がうまくいかなかったときは、画面越しやVRで組んだ相手を対面の相手より信頼しにくかった。ところが会話がうまくいけば、その差は小さくなった。対面は多少ぎこちなくても信頼が崩れにくい、という対面の強みが見えてくる点が面白い。", "unverified": "本文は入手できず、参加者数と効果の大きさは確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "孫の世話と就労の両立と高齢期の認知機能", "title": "Grandchild care, paid work, and cognitive functioning in later life: Heterogeneity across gender and education among grandparents in Europe", "url": "https://doi.org/10.31235/osf.io/28yxf", "authors": "Maria Karlene Shawn Cabaraban ほか", "venue": "SocArXiv", "date": "2026-11-18", "apa": "Cabaraban, M. K. S., Bordone, V., Weber, D., & Arpino, B. (2026). Grandchild care, paid work, and cognitive functioning in later life: Heterogeneity across gender and education among grandparents in Europe. https://doi.org/10.31235/osf.io/28yxf", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "欧州の祖父母で、孫の世話は全体として認知機能と正の関係をもつが、それは退職後と高学歴者に限られ、働く祖母では頻度により記憶への負の遅れた関連もあることを示した（抄録）。未査読。", "p3": "SHAREの50〜80歳の祖父18,748人（観測69,194）と祖母22,642人（観測79,702）の縦断データで、個人固定効果つきの交差遅延パネルモデルにより、孫の世話の有無と頻度と認知機能（記憶の再生と言語流暢性）の同時・遅れの関連を推定した（抄録）。", "p5": "孫の世話は男女とも認知機能と正の関連をもつが退職中に限られ、特に高学歴の祖父母で強かった。働く祖母では月1回以下の世話が同時点の言語流暢性の改善と関連する一方、どちらの頻度でも記憶の再生と負の遅れた関連がみられた（抄録）。", "fun": "孫の世話は頭を使うので祖父母の認知症予防によい、とよく言われる。大規模な追跡データで調べると、たしかによい関係はあったが、それは仕事を引退した人に限られていた。働きながら孫の世話もする祖母では、記憶に負担がかかる兆しさえあった。同じ「世話」でも、ほかに何を抱えているかで意味が変わる点が面白い。", "unverified": "本文は入手できず、関連の大きさ（係数）は確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "若年介護者のためのAIコンパニオンを比較評価", "title": "AI Companions for Young Adult Caregivers: Practical Advice, Emotional Depth, and the Limits of Metric Evaluation", "url": "https://arxiv.org/abs/2611.23147", "authors": "Trizal Garg ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Garg, T., Fu, X., Shah, D., Huang, J., Maheshwari, S., Aggarwal, A., Sinha, Y., Kumar, D., & Mehrotra, S. (2026). AI Companions for Young Adult Caregivers: Practical Advice, Emotional Depth, and the Limits of Metric Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23147", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "18〜25歳の若年介護者向けのAIコンパニオンを作り、専門家とLLMの評価が高かった微調整モデルが、実際の利用者には実用的すぎて感情の支えに欠けると受け取られることを示した（抄録）。未査読。", "p3": "オープンなLLM（Gemma 3-27B）に、若年介護者と心理士の会話データでの微調整、RAG、その併用を比べ、3人のウェルビーイングの専門家の選好で微調整モデルを採用した。LLMの審査員による比較と、90人の若年介護者の利用者研究（半数が基本モデル）を行った（抄録）。", "p5": "LLMの審査員は評価した組の85%で微調整モデルを好んだが、利用者研究では微調整モデルの返答は実用的で短すぎ、助言に偏り感情の支えが少ないとされ、基本モデルのほうが感情に寄り添うと受け取られた（抄録）。", "fun": "家族の介護を担う若者を支えるAIを作り、専門家もAIの採点者も「こちらが良い」と選んだ。ところが当の若者に使ってもらうと、そのAIは助言ばかりで気持ちに寄り添ってくれないと感じられた。評価する人と使う人で「良い」の意味がずれることを、数字で示した点が面白い。", "unverified": "本文は入手できず、利用者研究の評価尺度と統計的な差の大きさは確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "ナイジェリア36州のジェンダー・包摂を順位づけ", "title": "GENDER EQUALITY AND SOCIAL INCLUSION (GESI) PERFORMANCE LEADERBOARD OF NIGERIA'S 36 STATES FOR YEAR 2024", "url": "https://doi.org/10.5281/zenodo.24325125", "authors": "Achakpa ほか", "venue": "Zenodo", "date": "2026-11-17", "apa": "Achakpa, P. M., Baaki, J., & Munachi, P. U. (2026). GENDER EQUALITY AND SOCIAL INCLUSION (GESI) PERFORMANCE LEADERBOARD OF NIGERIA'S 36 STATES FOR YEAR 2024. Zenodo. https://doi.org/10.5281/ZENODO.24325125", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ナイジェリアの36州すべてを、ジェンダー平等と社会的包摂（GESI）の6領域で評価し順位づけた2024年の評価報告である（抄録）。NGOの報告書で、査読はない。", "p3": "女性・若者・障害者の公的な指導層での代表性、政策・法制度、公共インフラのアクセシビリティ、弱い立場の人々への予算配分、司法へのアクセス、開かれた統治への取り組みの6領域を、公式記録・面接・オンライン調査・108人の調査員の現地確認で評価した（抄録）。", "p5": "抄録には各州の得点や順位の記載がなく、評価の枠組みとデータの集め方の説明にとどまる（抄録）。", "fun": "「包摂的な社会」と言っても、それをどう測ればよいかは難しい。この報告は、指導者に女性や障害者がいるか、建物や道が誰にでも使えるか、予算が弱い立場の人に回っているか、などの6つの物差しで、国内の36の州を並べてみせた。抽象的な理念を、調査員が現地で確かめられる項目に分解した点が面白い。", "unverified": "本文は入手できず、各州の得点・順位と指標の重みづけは確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "介護者と高齢者のデジタル健康リテラシー介入", "title": "Effectiveness of Digital Educational Interventions to Promote Digital Health Literacy in Informal Caregivers and Older Adults: A Systematic Review (Preprint)", "url": "https://doi.org/10.2196/preprints.117184", "authors": "Amelie Meibeck ほか", "venue": "JMIR Preprints", "date": "2026-11-18", "apa": "Meibeck, A., Berner, N., Jagoda, F. A., Busse, T. S., Nitsche, J., Sachs, T., & Otte, I. C. (2026). Effectiveness of Digital Educational Interventions to Promote Digital Health Literacy in Informal Caregivers and Older Adults: A Systematic Review (Preprint). https://doi.org/10.2196/preprints.117184", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "高齢者と非公式の介護者のデジタル健康リテラシーを高めるデジタル教育介入を系統的に評価し、対象の8研究はすべて高齢者向けで、介護者向けの介入はなかったことを示した（抄録）。未査読。", "p3": "2025年5月にWeb of Science・MEDLINE・CINAHL・Cochrane CENTRALを検索し、2人が独立に選別・抽出、JBIの道具で質を評価して叙述的に統合した（抄録）。", "p5": "8研究（参加者1,143人、2011〜2023年）が該当し、すべてで介入群のリテラシーが改善したが、対照群との比較ができるのはeHEALSで測った2つのRCTだけだった。追跡のある2研究では2か月後は改善がほぼ保たれ、6か月後は一部で低下した（抄録）。", "fun": "家族を介護する人は、自分と家族の両方の健康情報をネットで扱う必要があり、デジタルの力がとくに求められる。ところが調べてみると、デジタル健康リテラシーを高める教育の研究は高齢者向けばかりで、介護する人向けのものは1つもなかった。いちばん必要としている人が研究の網から抜け落ちている、という発見が面白い。", "unverified": "本文は入手できず、2つのRCTの効果の大きさは確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "実務訓練を受けた介護職の生涯学習", "title": "‘Lifelong learning of practically trained caregivers in long-term care: a qualitative study’", "url": "https://doi.org/10.21203/rs.3.rs-11288884/v1", "authors": "Elke Heijligers ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Heijligers, E., Moser, A., Zwakhalen, S., & Erkens, P. (2026). ‘Lifelong learning of practically trained caregivers in long-term care: a qualitative study’. https://doi.org/10.21203/rs.3.rs-11288884/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "オランダの長期高齢者介護で職業訓練を受けた介護職の生涯学習について、振り返りのできる安全な場と専門職としての裁量が支えになることを質的に示した（抄録）。未査読。", "p3": "実務で訓練を受けた介護職、見習いの学生、職業教育の教員27人に、自律性・有能感・関係性に沿った4回の半構造化フォーカスグループを行い、帰納的な内容分析をした（抄録）。", "p5": "「振り返りのできる安全な環境」「共に学ぶ意識」「自分で選ぶ勇気」「専門職としての自律の余地」の4つの主題が得られ、学習は協働と承認を要する社会的な過程とみなされていた（抄録）。", "fun": "介護の現場では、知識や技術を学び続けることが欠かせない。でも、学校で長く学んだ専門職ではなく、現場で育った介護職がどう学んでいるかは、あまり調べられてこなかった。話を聞くと、学ぶには「失敗を話せる安心な場」と「自分で決めてよい余地」が大切だという声が浮かび上がった。学びが個人の努力でなく職場の雰囲気に左右される点が面白い。", "unverified": "本文は入手できず、参加者の内訳ごとの意見の違いは確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "親の面接からLLMが子育て尺度の回答を推定", "title": "How closely do large language model scores from parent interviews match self-reported parenting?", "url": "https://doi.org/10.31234/osf.io/47nvm", "authors": "Violeta J. Rodriguez ほか", "venue": "PsyArXiv", "date": "2026-11-18", "apa": "Rodriguez, V. J., Kapadia, A. R., Ramachandiran, A., & Liu, Q. (2026). How closely do large language model scores from parent interviews match self-reported parenting? https://doi.org/10.31234/osf.io/47nvm", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "親への面接からLLMが子育て尺度（MAPS）の回答を推定すると、自己報告との相関は中程度で、得点を一貫して低く見積もることを示した（抄録）。未査読。", "p3": "43人の親の面接の導入部の2問（家族、子育ての役割、養育の意味）から、6つの生成LLMにゼロショットでMAPSの35項目の回答を推定させ、項目の完全一致、下位尺度得点の相関、系統的な差、内的一貫性で評価した（抄録）。", "p5": "下位尺度の相関（Fisher平均）は0.320〜0.434で一貫して優れたモデルはなく、温かさで最も強く身体的な統制ではほとんど対応しなかった。回答の完全一致は35.5〜44.7%で、どのモデルも親より低い選択肢を選び、最高の選択肢をほとんど選ばなかった（抄録）。", "fun": "インタビューで話を聞けば、その人が質問紙にどう答えるかをAIが当てられるのでは、という期待がある。親の子育てで試すと、AIの推定はある程度は当たったが、全体に親より辛めの点を付け、とくに子どもへの温かさ以外の面は読み取りにくかった。AIが「人の代わりに答える」ことの得意と不得意が具体的に見える点が面白い。", "unverified": "本文は入手できず、各モデルの名前と、他の心理的構成概念との関連の具体的な値は確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "移民系方言への態度：人とLLMの暗黙と明示", "title": "Comparing Implicit and Explicit Language Attitudes toward the Dutch multiethnolect Straattaal in Humans and Large Language Models", "url": "https://arxiv.org/abs/2611.22335", "authors": "Hedwig Oldenhof ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Oldenhof, H., Rosseel, L., Wegmann, A., & Nguyen, D. (2026). Comparing Implicit and Explicit Language Attitudes toward the Dutch multiethnolect Straattaal in Humans and Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22335", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "オランダの多民族方言Straattaalについて、人とLLMが移民の背景と結びつける暗黙・明示の言語態度を同じ設計で比べ、多くのLLMが人に似た態度を持つことを示した（抄録）。未査読。", "p3": "人には潜在連合テスト（IAT）と明示的な評定課題を、LLMにはLLM単語連想テスト（LLM WAT）と同じ評定課題を使い、近い設計で態度を測った（抄録）。", "p5": "人は暗黙・明示の両方でStraattaalを移民の背景と強く結びつけ、LLM WATでもStraattaalは一貫して移民の背景と結びつき、大きく新しいモデルほど連想が強かった。明示の評定課題でもLLMは人と似た反応パターンを示した（抄録）。", "fun": "ことばの話し方から話し手の出身を連想するのは、人の心にある無意識の思い込みの一つだ。調べてみると、AIの言語モデルも若者の多民族的な話し方を移民と強く結びつけていて、新しく大きなモデルほどその傾向が強かった。賢くなるほど人の偏見までよく写し取ってしまう、という皮肉な結果が面白い。", "unverified": "本文は入手できず、比較したモデルの一覧と連想の強さの数値は確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "迎合を主張の妥当性で定義し発生源をたどる", "title": "From Preference Data to Personalization: Tracing Sycophancy in Large Language Models", "url": "https://arxiv.org/abs/2611.21650", "authors": "Himaghna Bhattacharjee ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Bhattacharjee, H., Sheynin, Y., Singhal, S., Subramonian, A., Samanta, A., Michael, J., Milli, S., Nickel, M., & Shi, C. (2026). From Preference Data to Personalization: Tracing Sycophancy in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21650", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの迎合を「訂正や留保が必要な場面での不適切な同意」と定義し直して測る評価器と評価集合を作り、推論時の個人化が不適切な同意を増やすことを示した（抄録）。未査読。", "p3": "主張の妥当性を考慮する評価器と、利用者の開かれ具合と重大さを統制した3,298問のペルソナ別評価集合SycoDriftを作り、人の選好データ、自動審査の採点基準、文脈内の個人化の3つの同意圧力の源を分析した（抄録）。", "p5": "人の選好データでの同意的な返答の好みは弱く同意が適切な場面に集中し、強調した審査基準は控えめだが一貫した増加を生んだ。14モデルでは推論時の個人化が不適切な同意を増やし、質問の直前に置いた一致する利用者像の効果が最も大きかった（抄録）。", "fun": "AIが何でも「おっしゃる通りです」と言うのは困るが、正しいことに同意するのは当然だ。この研究は、相手の言い分が間違っているのに同意する場合だけを「ごますり」として測り直した。すると、AIに「あなたはこういう人ですね」と利用者の情報を与えるほど、ごますりが増えた。親しくなるほど本当のことを言いにくくなるのは、人間関係とよく似ていて面白い。", "unverified": "本文は入手できず、個人化による増加の大きさと14モデルの一覧は確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "エージェント網の形で偏りの伝わり方が変わる", "title": "Corrupting Ties: Investigating Robustness to Bias Injection Across Multi-Agent Network Topologies", "url": "https://arxiv.org/abs/2611.21804", "authors": "Cl\\'ea Chataigner ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Chataigner, C., Arzaghi, M., Carichon, F., Piantanida, P., & Farnadi, G. (2026). Corrupting Ties: Investigating Robustness to Bias Injection Across Multi-Agent Network Topologies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21804", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMのマルチエージェントで一部の応答を偏ったものに置き換える介入実験から、ネットワークの形と注入の位置で偏りの広がり方が大きく変わることを示した（抄録）。未査読。", "p3": "選んだエージェントの応答を事前に決めた偏った応答に置き換える枠組みと、エージェント・ネットワーク・システムの各水準の判断のずれの指標を作り、5つのネットワーク構造と3つの二値分類課題でQwenとGemmaのモデルを評価した（抄録）。", "p5": "逐次型のネットワークでずれが最大で、全結合とメッシュ型では小さかった。星型では中心のエージェントへの注入が周辺への注入より影響が大きく、ずれが注入した偏りの方向に従うかはモデルで異なった（抄録）。", "fun": "伝言ゲームで一人が間違った情報を混ぜると、列の並び方によって最後に届く話の歪み方が変わる。AIどうしが相談する仕組みでも同じで、一列に順番に回す形がいちばん偏りに弱く、全員がつながる形は強かった。さらに、中心にいるAIがだまされると影響が大きい。誰が誰とつながるかという組織の形が、公平さを左右する点が面白い。", "unverified": "本文は入手できず、ずれの指標の具体的な値は確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "委任型エージェントで事実の矛盾が消える場所", "title": "Multi-Agent Memory Inconsistency: Where Factual Conflicts Disappear in LLM Agents", "url": "https://arxiv.org/abs/2611.22245", "authors": "Hejia Zhang ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Zhang, H., Yu, Z., Ding, Y., Chen, W.-T., Yu, H., Ni, W., Liu, Y., Xu, C., Chen, X., Yao, M., Zhao, F., & Zhao, J. (2026). Multi-Agent Memory Inconsistency: Where Factual Conflicts Disappear in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22245", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "作業を複数のLLMエージェントに委ねると、矛盾する事実を拾える割合は上がるのに、矛盾を見つける割合は下がり、その原因が作業者から主担当への引き継ぎにあることを示した（抄録）。未査読。", "p3": "Harvey LABの文書審査課題に統制した事実の矛盾を入れたベンチマークと、証拠の流れを追う分析器を作り、生成の費用をそろえた3つのモデルで単独実行と委任を比べた（抄録）。", "p5": "委任で矛盾する2つの主張の両方を検索できた割合は50.2%から68.7%に上がったが、矛盾の検出は16.2%から13.2%に下がった。作業者が両方を報告したのは検索できた組の35.2%で、2つの主張が別の作業者に分かれると検出が単独より下がった（抄録）。", "fun": "大きな調べものをチームで分担すると、たくさんの資料を集められる。ところがAIのチームでは、資料の中の食い違いは、むしろ見落とされやすくなった。食い違う2つの記述を別々のメンバーが読むと、報告をまとめる段階で矛盾が消えてしまうからだ。分業の弱点が「引き継ぎ」にあるという点は、人間の組織にも通じて面白い。", "unverified": "本文は入手できず、使った3つのモデルの名前は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "ペルソナ別に包摂的な移動を評価する指標", "title": "A City Persona Sensitive Social Optimum Mobility Index for Assessing Inclusive Urban Mobility in Florence", "url": "https://doi.org/10.21203/rs.3.rs-11332418/v1", "authors": "Georgia Ayfantopoulou ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Ayfantopoulou, G., Mallidis, I., Giannoudis, V., Meta, M., & Dais, S. (2026). A City Persona Sensitive Social Optimum Mobility Index for Assessing Inclusive Urban Mobility in Florence. https://doi.org/10.21203/rs.3.rs-11332418/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "都市の移動施策の社会的包摂を、ペルソナ別の重みと8つの柱で評価する指標SOMIを作り、フィレンツェで道路空間の再配分が最も高く評価されることを示した（抄録）。未査読。", "p3": "受容性・アクセス・負担可能性・主体性・利用可能性・法的承認・参加・安全の8つの柱を定め、参加型の採点でペルソナ別の重み、影響創出ボードでペルソナの影響の重みを導き、KPIの正規化と空間的なアクセスの解釈を組み合わせ、9つのペルソナと3つの施策を評価した（抄録）。", "p5": "施策の得点は道路空間の再配分0.840、都市物流のマイクロハブ0.630、30 km/h区域と交通静穏化0.388で、市全体のSOMIは0.619だった。重みを変えた感度分析でも順位は頑健だった（抄録）。", "fun": "車の速度を落とす、道路の使い方を変える、といった交通の施策は、高齢者や子ども連れ、車いすの人など立場によって受け止め方が違う。この研究は、さまざまな「代表的な住民像」を作り、それぞれの視点で施策を採点する物差しを作った。フィレンツェでは道路空間の配り直しが、どの住民像にとっても最も良い施策だった点が面白い。", "unverified": "本文は入手できず、9つのペルソナの内容と各柱の得点は確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "都市の集積の形と炭素収支の非線形関係", "title": "How multidimensional urban spatial agglomeration shapes carbon balance in seven Chinese megacities: Nonlinear relationships and geographic variations", "url": "https://doi.org/10.21203/rs.3.rs-10661606/v1", "authors": "Yan Chen ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Chen, Y., Jiao, S., Wei, Z., & Gu, X. (2026). How multidimensional urban spatial agglomeration shapes carbon balance in seven Chinese megacities: Nonlinear relationships and geographic variations. https://doi.org/10.21203/rs.3.rs-10661606/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国の7大都市で、都市の空間的な集積と正味の炭素排出の関係は非線形で、集中の初期には炭素への影響が増えるが効率化とインフラの共有で次第に弱まることを示した（抄録）。未査読。", "p3": "人為的な炭素排出と陸域生態系の炭素吸収を組み合わせた空間的な炭素収支の枠組みを作り、物理的な形態・機能の組織・社会経済の集中の3次元で集積を測り、多種の地理空間データとアンサンブル学習、解釈可能な空間分析で関係を調べた（抄録）。", "p5": "排出は都心に、吸収は周辺の生態空間に集まる空間的な分離がみられた。社会経済と機能の集積が正味排出と最も強く関連し、形態の影響は地理的な条件で異なり、気候と地形も関係を左右した（抄録）。", "fun": "人や建物をぎゅっと集める「コンパクトな街」は環境に優しいと言われる。ところが調べると、集まり始めの段階ではむしろ炭素の排出が増え、効率化やインフラの共有が進むにつれて効果が弱まっていく、という曲がった関係だった。単に密にするだけでなく、何をどう配置するかが大事だという点が面白い。", "unverified": "本文は入手できず、関係の大きさを示す数値は確認できなかった。"}}, {"id": "pr43", "rank": 43, "headline": "物理情報つき機械学習で下水道の投資を最小化", "title": "PIML-Driven Spatial Optimization and Active Telemetry Control of Integrated Grey-Green Systems to Minimize Modernization Capital Investment in US Combined Sewer Systems", "url": "https://doi.org/10.21203/rs.3.rs-11760144/v1", "authors": "Naim Sheikh", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Sheikh, N. (2026). PIML-Driven Spatial Optimization and Active Telemetry Control of Integrated Grey-Green Systems to Minimize Modernization Capital Investment in US Combined Sewer Systems. https://doi.org/10.21203/rs.3.rs-11760144/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "合流式下水道の越流対策で、物理情報つき機械学習の代理モデル・実時間制御・グリーンとグレーのインフラ配置の最適化を組み合わせ、設備投資をグレーだけの場合のほぼ半分に減らせることを示した（抄録）。未査読。", "p3": "EPA SWMMのExample 8（11.7 ha）、NOAA Atlas 14の設計降雨、フィラデルフィアの20年の時間雨量で、データ駆動と物理情報つきの代理を比べ、規則型制御とモデル予測制御を15の設計降雨で評価し、NSGA-IIで配置と費用を最適化した（抄録）。", "p5": "PIML-softの越流量の予測のNSEは0.87、学習外の25〜100年確率の豪雨で0.93だった。規則型制御は受動運転より越流量を5〜29%減らしMPCを上回り、緑のインフラ中心の設計で費用の最頻値は87万ドルから49万ドルに下がった（抄録）。", "fun": "大雨のとき、古い下水道では汚水があふれ出ることがあり、大きなタンクを造る対策は高くつく。この研究は、雨水を土に染み込ませる花壇のような緑のインフラと、水門の賢い操作を組み合わせ、AIの予測を使って配置を最適化した。単純な規則での操作が、高度な予測制御より効果的だった点も意外で面白い。", "unverified": "本文は入手できず、ベンチマークの流域以外への適用可能性は確認できなかった（著者もベンチマークに固有の結果としている）。"}}, {"id": "pr44", "rank": 44, "headline": "パラドックス思考がデジタル創造性を高める", "title": "The Paradox-creativity Nexus: A Moderated Mediation Model of Digital Engagement and Techno-invasion in the Workplace", "url": "https://doi.org/10.2139/ssrn.7699601", "authors": "Hoang Dinh Van ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Dinh Van, H., Trang Thi, T. D., Nguyen, T. P., Nguyen Hoang, A. T., & Tran, K. H. (2026). The Paradox-creativity Nexus: A Moderated Mediation Model of Digital Engagement and Techno-invasion in the Workplace. https://doi.org/10.2139/ssrn.7699601", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "矛盾を両立させて考えるパラドックス思考が、デジタルへの関与を通じて従業員のデジタル創造性を高め、技術による私生活への侵入（テクノ・インベージョン）がその経路を弱めることを示した（抄録）。未査読。", "p3": "質的・量的な逐次の混合研究法で、技術系企業の従業員と上司370組の時間差調査により、媒介と調整を組み合わせたモデルを検証した（抄録）。", "p5": "パラドックス思考はデジタル創造性に直接的にも、デジタル関与を通じて間接的にも正の影響をもち、テクノ・インベージョンはパラドックス思考と関与の関係と、関与を通じた間接効果をともに弱めた（抄録）。", "fun": "「速さも丁寧さも」「自由も規律も」といった矛盾する要求を、どちらか一方に決めずに両方とも抱えて考える力がある人ほど、デジタルの仕事で新しいアイデアを出しやすいという。ただし、夜や休日まで仕事の連絡が入り込む職場では、その力が生かされにくかった。考え方の強みも、働く環境次第で活きたり消えたりする点が面白い。", "unverified": "本文は入手できず、効果の大きさと質的研究の内容は確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "AI導入の深さを業務フロー単位で測る指標", "title": "WDI: The Workflow Depth Index for AI Adoption", "url": "https://doi.org/10.2139/ssrn.7702063", "authors": "Min Wu", "venue": "SSRN", "date": "2026-11-18", "apa": "Wu, M. (2026). WDI: The Workflow Depth Index for AI Adoption. https://doi.org/10.2139/ssrn.7702063", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIの導入をライセンス数や利用回数でなく、業務フローごとに5次元で採点する指標WDI（Workflow Depth Index）を提案した（抄録）。未査読の初版の尺度。", "p3": "業務の深さ、行動への統合、利用の水準、構造の再編、成果への帰属の5次元を行動の基準と観察できる証拠で1〜5点（計5〜25点）で採点し、AIを取り除いたら何が起きるかを問う除去テストを加え、どの次元も3未満でないときだけ深い導入とする（抄録）。", "p5": "公平に関わる集団ごとに証拠を分けて示し格差への対応を求める設計で、公衆衛生の例示、TAM・普及理論・TOEなどとの関係、検証の計画を示すが、実証の結果はまだない（抄録）。", "fun": "会社が「社員の8割がAIを使っています」と言っても、それで仕事が本当に変わったとは限らない。この指標は、「もしAIを明日取り上げたら、その仕事はどうなるか」と問うことで、AIがどれだけ深く仕事に組み込まれたかを測ろうとする。使っている人数ではなく、なくなったら困る度合いで導入を測る発想が面白い。", "unverified": "本文は入手できず、尺度の信頼性・妥当性の検証は行われていない（著者も検証の計画として示す）。"}}, {"id": "pr46", "rank": 46, "headline": "戦時下の大学教員のバーンアウトと抑うつ", "title": "Burnout, depressive and anxiety symptoms in the structure of wartime academic distress among Ukrainian academic staff", "url": "https://doi.org/10.21203/rs.3.rs-10343778/v1", "authors": "Natalia Tsybuliak ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Tsybuliak, N., Kolomiiets, U., Vakhitov, V., Popova, A., Lutsenko, A., Petrushenko, Y., & Suchikova, Y. (2026). Burnout, depressive and anxiety symptoms in the structure of wartime academic distress among Ukrainian academic staff. https://doi.org/10.21203/rs.3.rs-10343778/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "全面戦争下のウクライナの大学教員で、バーンアウト・抑うつ・不安は強く結びつくが一つの症候群ではなく、抑うつが最も強くつなぐ位置にあり、情緒的消耗がもっとも苦痛と近いことを示した（抄録）。未査読。", "p3": "2023年12月〜2024年2月にウクライナの大学教員429人にオンライン調査を行い、MBI-HSS・GAD-7・PHQ-9で測り、バーンアウトを総合と3次元（情緒的消耗・脱人格化・個人的達成感）で分析した横断研究（抄録）。", "p5": "抑うつがバーンアウトと不安の関連を大きく弱める位置にあり、脱人格化の関連は弱く周辺的で、個人的達成感は抑うつと負に関連した。個人の避難は所属機関が移転しない場合に最も苦痛と関連した（抄録）。", "fun": "仕事の燃え尽き、気分の落ち込み、不安は、普通は別々のものとして測られる。戦争の中で働き続ける大学の先生たちを調べると、それらは強く絡み合っていたが、ひとかたまりではなかった。自分だけが避難して大学は元の場所に残る場合に、とくに苦しさが大きかったという。働く人の心を職場の状況とあわせて見る大切さが分かる。", "unverified": "本文は入手できず、各関連の大きさは確認できなかった。横断研究なので因果の向きは言えない（著者も認める）。"}}, {"id": "pr47", "rank": 47, "headline": "離職予測は正解率でなく見逃しで選ぶべき", "title": "Predicting Employee Attrition in the Era of AI-Driven HR: A Machine Learning and Explainable AI Approach", "url": "https://doi.org/10.2139/ssrn.7699038", "authors": "Md. Abu Jafor Siddique", "venue": "SSRN", "date": "2026-11-18", "apa": "Siddique, Md. A. J. (2026). Predicting Employee Attrition in the Era of AI-Driven HR: A Machine Learning and Explainable AI Approach. https://doi.org/10.2139/ssrn.7699038", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "離職予測では正解率の高いモデルでも離職者の大半を見逃しうることを示し、判定のしきい値を交差検証で選ぶだけで見逃しが大きく減ることを示した（抄録）。未査読。", "p3": "合成とされるIBMの離職データ（1,470人、離職16.12%）を8対2に層化分割し、学習側だけにSMOTEを当ててランダムフォレストとロジスティック回帰を学習し、しきい値を学習データの5分割交差検証で選び、SHAPで要因を解釈した（抄録）。", "p5": "両モデルのROC-AUCは約0.80だが、しきい値0.5ではランダムフォレストが離職者の19.1%しか検出しなかった。交差検証で選んだ0.31では再現率が61.7%、F1が0.518になり、残業・未婚・ストックオプションの水準などが予測と強く関連した（抄録）。", "fun": "AIの予測の良し悪しは「正解率」で語られがちだが、辞める人が少ない職場では「誰も辞めない」と答えるだけで正解率は高くなる。この研究では、モデルそのものは変えずに、どの確率から「辞めそう」と判定するかの線を引き直すだけで、見逃しが大きく減った。その線をどこに引くかは、技術ではなく経営の判断だという指摘が面白い。", "unverified": "本文は入手できず、データが合成とされるため実際の職場での有効性は確認できない（著者も横断的で因果ではないとする）。"}}, {"id": "pr48", "rank": 48, "headline": "能力開発型の人事施策と上司支援が革新行動を促す", "title": "Developmental Human Resource Practices, Supervisor Support, And Employees&#39; Innovative Work Behaviors In The Public Sector: A Moderated Mediation Model", "url": "https://doi.org/10.2139/ssrn.7697100", "authors": "Kabiru Maitama Kura", "venue": "SSRN", "date": "2026-11-17", "apa": "Kura, K. M. (2026). Developmental Human Resource Practices, Supervisor Support, And Employees&#39; Innovative Work Behaviors In The Public Sector: A Moderated Mediation Model. https://doi.org/10.2139/ssrn.7697100", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の連邦職員で、能力開発型の人事施策と上司の支援が職務満足を通じて革新的な行動に結びつき、仕事の自律性がこの間接効果を強めることを示した（抄録）。未査読。", "p3": "全国を代表する2023年の連邦職員意識調査（FEVS）のデータを、一般化線形モデルの媒介分析の枠組みで分析した（抄録）。", "p5": "能力開発型の人事施策と上司の支援の認知は革新的な行動と正の関連をもち、職務満足が両方の関係を有意に媒介し、仕事の自律性が間接効果を強めた（抄録）。", "fun": "役所の職員にも新しい工夫を生み出してほしいが、どうすればよいか。全国規模の職員調査を分析すると、育ててくれる人事制度と上司の支えがあると仕事への満足が高まり、それが工夫する行動につながっていた。さらに、自分で仕事の進め方を決められる人ほど、その流れが強かった。任されることが工夫の燃料になる点が面白い。", "unverified": "本文は入手できず、効果の大きさと標本の規模は確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "孤独と地域への所属感は表裏ではない", "title": "Loneliness and Sense of Community are Not Two Sides of the Same Coin: Identifying Different Determinants Using the 2019 Nova Scotia Quality of Life Data", "url": "https://doi.org/10.5281/zenodo.23157424", "authors": "Hill ほか", "venue": "Zenodo", "date": "2026-11-17", "apa": "Hill, T. G., & MacGillivray, M. (2023). Loneliness and Sense of Community are Not Two Sides of the Same Coin: Identifying Different Determinants Using the 2019 Nova Scotia Quality of Life Data (Version Archived from OSF NOV 17 2026). Zenodo. https://doi.org/10.5281/ZENODO.23157424", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（Zenodoの登録には抄録なし）。本文は入手できず", "preprint": true, "short": true, "p1": "ノバスコシア州の代表標本で、地域への所属感と孤独を予測する要因は大きく異なり、両者は表裏の関係ではないことを示した（抄録）。", "p3": "2019年の12,871人の生活の質調査で、生活様式と生活条件の22の予測変数を重回帰に入れ、Lindeman・Merenda・Goldの方法（lmg）で各変数の相対的な重要度を求めた（抄録）。", "p5": "22の変数は所属感の分散の46%を説明し、上位は近隣の自然環境の質への満足（ri=0.09）、生活満足度、頼れる近所の人の数、制度への信頼（各0.05）などだった。上位10変数のうち孤独でも上位だったのは6つだけだった（抄録）。", "fun": "「地域に溶け込んでいる人は孤独ではない」と考えがちだが、1万人以上の調査では、地域への所属感を高める要因と孤独を減らす要因はかなり違っていた。所属感には近所の自然環境や頼れる隣人の数、行政への信頼などが効いていた。孤独と所属感を同じ物差しの両端と見なさず、別々に測る必要があるという点が面白い。", "unverified": "本文は入手できず、孤独のモデルの説明率と各変数の値は確認できなかった。掲載先・査読の状況も未確認。"}}, {"id": "pr50", "rank": 50, "headline": "地域のウェルビーイングを高める場への公平なアクセス", "title": "Where and How do Scottish Residents Experience Increased Community Well-Being? Equitable Access to Community Well-Being-Promoting", "url": "https://doi.org/10.5281/zenodo.22902731", "authors": "Hill, Taylor G.", "venue": "Zenodo", "date": "2026-11-17", "apa": "Hill, T. G. (2025). Where and How do Scottish Residents Experience Increased Community Well-Being? Equitable Access to Community Well-Being-Promoting (Version Archived from OSF NOV 17 2026). Zenodo. https://doi.org/10.5281/ZENODO.22902731", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "Zenodoの登録には題名しかなく、抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名からは、スコットランドの住民がどこでどのように地域のウェルビーイングの高まりを経験するかと、それを促す場への公平なアクセスを扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "公園、図書館、地域の集会所など、人が「この地域に住んでいてよかった」と感じる場所はさまざまだ。題名から読み取れる問いは、そうした場所がどこにあり、誰でも同じように行けるのか、という公平さの問題である。住みよさを個人の気持ちではなく、場所への行きやすさの偏りとして捉えようとする点が面白い。", "unverified": "抄録・本文を入手できず、調査の方法・対象・結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "コーディングAIの分析は有意を作りやすい", "title": "Inference after coding agents", "url": "https://arxiv.org/abs/2611.23174", "authors": "Florian Gunsilius ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Gunsilius, F., Van Dijcke, D., & Wüthrich, K. (2026). Inference after coding agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23174", "why": "AIのコーディング・エージェントが実証分析を担うと、推定法の探索と再実行が容易なため新しい種類の選択後推論の問題が生じると論じる。効果ゼロの模擬データで4つの最先端エージェントが54〜98%の割合で有意なp値を報告し、エージェントを部分標本で再実行して選択の確率を推定する補正検定を提案する。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "多変量拡散過程の厳密な最尤推定の理論を確立", "title": "Exact and Approximate Maximum Likelihood Estimation for Multivariate Diffusions under High-Frequency Sampling", "url": "https://arxiv.org/abs/2611.22675", "authors": "Duy Nguyen", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Nguyen, D. (2026). Exact and Approximate Maximum Likelihood Estimation for Multivariate Diffusions under High-Frequency Sampling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22675", "why": "高頻度・長期間で離散観測される多変量エルゴード拡散過程について、厳密な最尤推定量の一致性・漸近正規性・有効性を示し、先行研究が残した未解決問題を解いたとする。閉形式の密度展開との対数尤度の差が一様に無視できることを示す証明で、近似最尤推定が厳密な推定と同等になる条件も得る。"}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "LLMが自分の重みを書き換えて賢くなる", "title": "Language Models Can Rewrite Their Own Weights", "url": "https://arxiv.org/abs/2611.21885", "authors": "Jiajun Fan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Fan, J., He, N., Yang, C., Mao, A., Zhu, X., Cheng, C., Liang, K., Shen, S., Li, Z., Guo, R., & Liu, G. (2026). Language Models Can Rewrite Their Own Weights (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21885", "why": "勾配も訓練も使わず、27Bのモデルが自分の重みと採点結果から失敗を診断し、原因となる重みを書き換える「自己書き換え」を示す。事前に固定した未見の490問で正答率が6.6ポイント上がり、自らのテストで裏づけた編集だけを提出して改善を重ねたと報告する。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "LLMリーダーボード首位の「勝者の呪い」を補正", "title": "SOTA or Luck? The Winner's Curse in LLM Leaderboards", "url": "https://arxiv.org/abs/2611.22227", "authors": "Sikun Xu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Xu, S., Thomadsen, R., Zhang, D. J., & Zhang, H. (2026). SOTA or Luck? The Winner's Curse in LLM Leaderboards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22227", "why": "雑音のあるベンチマーク得点で順位をつけると首位の性能が運によって過大になる偏りを定式化し、m-out-of-Nブートストラップで補正する。14のベンチマークで首位の補正は約0.09〜3.86ポイントで、SWE-bench Verifiedでは173モデル中13モデルが首位層に入るとする。"}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "戦争によるエネルギー高で低所得層の支出が不安定に", "title": "Wars, Energy Shocks and Household Finances: A Natural Experimental Investigation of Financial Vulnerability", "url": "https://doi.org/10.2139/ssrn.7696459", "authors": "Gbenga Ibikunle ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Ibikunle, G., Vriz, G. L., & Cojoianu, T. (2026). Wars, Energy Shocks and Household Finances: A Natural Experimental Investigation of Financial Vulnerability. https://doi.org/10.2139/ssrn.7696459", "why": "英国大手銀行の約70万口座の取引データを使い、ロシアのウクライナ侵攻を外生的なショックとして所得水準が家計の脆弱性に与える因果的な調整効果を推定する。低所得者の月内の支出の変動が高所得者に比べて64.7%増えたなど、消費の平準化の制約が大きいことを示す。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "米中貿易戦争でAIに曝された職種の求人がより減少", "title": "Trade Shocks and Hiring Reallocation along a Technology-Related Task Margin Evidence from Chinese Online Vacancy Postings", "url": "https://doi.org/10.2139/ssrn.7719679", "authors": "Hongling Chen ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Chen, H., Ding, H., & Xie, M. (2026). Trade Shocks and Hiring Reallocation along a Technology-Related Task Margin Evidence from Chinese Online Vacancy Postings. https://doi.org/10.2139/ssrn.7719679", "why": "約9億件の中国のオンライン求人と301条関税の業種別の曝露、AI職業曝露指数を使い、関税の影響が大きいほど求人が減り、AI曝露の高い職種でより大きく減ったことを示す。技術志向の貿易ショックが企業内の職種構成の再配分を通じて労働需要を変えることを明らかにする。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "短期の実験と長期の観察で長期の分位処置効果", "title": "Long-Term Quantile Treatment Effects with Combined Experimental and Observational Data", "url": "https://arxiv.org/abs/2611.22984", "authors": "Nan Liu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liu, N., Liu, Y., Sasaki, Y., & Zhang, Y. (2026). Long-Term Quantile Treatment Effects with Combined Experimental and Observational Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22984", "why": "短期の実験データに長期の観察データを組み合わせる設定で、長期の分位処置効果の曲線の識別、効率的影響関数、セミパラメトリック効率推定、分位全体での同時信頼帯を与える。平均だけでなく効果の分布の長期的な違いを推論できる。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "重なりの診断はDMLの識別を保証しない", "title": "Overlap Is Not Identification: Reactive Pricing, Exogenous Variation, and Double Machine Learning", "url": "https://doi.org/10.2139/ssrn.7697558", "authors": "Vikranth Reddy Moola ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Moola, V. R., & Mukhopadhyay, A. (2026). Overlap Is Not Identification: Reactive Pricing, Exogenous Variation, and Double Machine Learning. https://doi.org/10.2139/ssrn.7697558", "why": "アルゴリズムで価格を決めるプラットフォームでは価格と結果が予測を通じて交絡し、二重機械学習で使われる重なり（overlap）の診断値が高くても推定が大きく偏りうることを示す。調整を細かくすると重なりが下がり推定値が動く場合に警告する診断を提案し、ライドシェアなどのデータで検証する。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "AIレビュアーで保守の負担はむしろ増える", "title": "Does the AI Reviewer Alleviate or Aggravate the Maintenance Burden? Evidence from GitHub Copilot Reviewer", "url": "https://arxiv.org/abs/2611.22793", "authors": "Feiyang (Amber) ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Feiyang, Xu, Medappa, P. K., & Tunc, M. M. (2026). Does the AI Reviewer Alleviate or Aggravate the Maintenance Burden? Evidence from GitHub Copilot Reviewer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22793", "why": "GitHub Copilot Reviewerの導入を自然実験とし、AIによるコードレビューがOSSの保守者の負担と貢献行動をどう変えるかを分析する。導入直後にプルリクエストとレビューの負担が急増し、人の貢献は減る一方でボットの提出が続き、AIレビューは効率を上げても保守の負担を重くすると報告する。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "封印した検証データでAIアナリストの発見を認証", "title": "Refereeing the AI Agentic Analyst Community: Rolling Sealed Folds and Online e-values for False Discovery Control in Autonomous Data Analysis", "url": "https://doi.org/10.2139/ssrn.7700421", "authors": "John Christiansen", "venue": "SSRN", "date": "2026-11-18", "apa": "Christiansen, J. (2026). Refereeing the AI Agentic Analyst Community: Rolling Sealed Folds and Online e-values for False Discovery Control in Autonomous Data Analysis. https://doi.org/10.2139/ssrn.7700421", "why": "自律的なAIアナリストが大量の仕様探索をする状況で、データを探索用と封印した部分に分け、e値で発見を逐次に認証する「ローリング・シール」を提案する。分析者の振る舞いや主張の順序・依存関係によらず、認証された発見の偽発見率を指定の水準以下に抑えることを証明する。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "LLMが重みを直接書いて実機のトラクタを操舵", "title": "Weight-space programming for tractor guidance controller: large language models natively write neural network weights that steer a real tractor", "url": "https://arxiv.org/abs/2611.21958", "authors": "Timo Oksanen", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Oksanen, T. (2026). Weight-space programming for tractor guidance controller: large language models natively write neural network weights that steer a real tractor (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21958", "why": "LLMが自然言語の仕様に従ってニューラルネットの重みを直接読み書きする「重み空間プログラミング」を、253パラメータの自動操舵ネットワークに適用する。別のトラクタ用の重みの修復とゼロからの書き込みを少ないシミュレーション評価で行い、進化戦略・勾配降下・純追従法とシミュレーションと実機で比べた。"}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "AI4Scienceのチームは知識の組合せの幅で差", "title": "Embedding or bridging? AI4Science teams differ more in knowledge recombination than in problem novelty", "url": "https://arxiv.org/abs/2611.22366", "authors": "Yun Fu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Fu, Y., & Ding, J. (2026). Embedding or bridging? AI4Science teams differ more in knowledge recombination than in problem novelty (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22366", "why": "1990〜2025年のAI4Science論文489,409本を所属に基づく7つの組織構成に分け、問題の新規性・知識の組合せの幅・掲載先・被引用を比べる。構成による差は問題の新規性では小さく知識の組合せの幅では大きく、部門をまたぐ橋渡し型ほど組合せが広いと報告する。"}, {"id": "pn13", "rank": 13, "field": "環境・気候政策", "headline": "2026年の世界のCO2排出は前年並みと日次推計", "title": "Projection of global daily CO2 emissions in 2026", "url": "https://arxiv.org/abs/2611.22406", "authors": "Tao Li ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Li, T., Deng, Z., Ciais, P., Davis, S. J., Ye, L., & Liu, Z. (2026). Projection of global daily CO2 emissions in 2026 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22406", "why": "Carbon Monitorの日次推計（2019年〜2026年9月）とProphetによる年末までの予測を組み合わせ、2026年の世界の化石燃料・産業のCO2排出を38.1 Gt（前年比+0.10%）と見積もる。地域ごとの増減の約94%が相殺し合い、世界全体ではほぼ横ばいになるとする。"}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "LLMの気まぐれな拒否で利用者離脱を因果推定", "title": "RAW: Refusal Aversion in the Wild, A Causal Measurement Method for Deployed LLMs", "url": "https://arxiv.org/abs/2611.21641", "authors": "Pavel Kireyev", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Kireyev, P. (2026). RAW: Refusal Aversion in the Wild, A Causal Measurement Method for Deployed LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21641", "why": "同じモデルが似たプロンプトに拒否したりしなかったりする確率的な揺らぎを自然実験とみなし、拒否が利用者の会話継続に与える因果効果を既存のログから推定する方法RAWを提案する。LMSYS-Chat-1MとWildChatの15モデルに適用し、約半数のモデルで効果を精密に推定できたとする。"}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "共変量の異質性で反実仮想の写像を識別・検定", "title": "Symmetries of Counterfactuals: Identification and Testability of Counterfactual Maps from Covariate Heterogeneity", "url": "https://arxiv.org/abs/2611.22948", "authors": "Marc Braun ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Braun, M., Daoud, A., & Peña, J. M. (2026). Symmetries of Counterfactuals: Identification and Testability of Counterfactual Maps from Covariate Heterogeneity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22948", "why": "反実仮想は一般にデータだけでは識別できないが、結果に潜在原因を通じてだけ影響する共変量があれば、データと整合する反実仮想写像の集合を対称性の群として特徴づけられることを示す。単調写像や最適輸送写像などの仮定はひとつの条件付き独立性と同値になり、仮定を検定できる。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "推論を増やしても買い物エージェントは賢くならない", "title": "Thinking Harder Doesn't Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents", "url": "https://arxiv.org/abs/2611.22033", "authors": "Adi Krishnamoorthy ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Krishnamoorthy, A., & Han, X. Y. (2026). Thinking Harder Doesn't Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22033", "why": "10の最先端モデルを3つの商品選択ベンチマークで比べ、推論の努力を増やしても購入判断の質は統計的に改善しないことを示す。モデルが報告する確信度が誤りの可能性の目安になるかも検証し、LLMを買い物の代理人に使う際の問題を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの買い物エージェントに「もっと考えさせて」も購入判断の質は統計的に良くならず、報告する自信だけが有意に高まることを示した（抄録）。未査読。", "p3": "WebShop、AmazonのSQID、WayfairのWANDSから作った3つの商品選択ベンチマークで、10の最先端モデルの推論の努力を変え、判断の質と自己申告の確信度、その較正（確信度と実際の正答率の一致）を測った（抄録）。", "p5": "3つのベンチマークすべてで推論の努力を増やしても質は有意に上がらず、確信度は有意に上がった。多くのモデルはどの努力の水準でも較正が悪く、誤りはモデル間で強く共有され、複数のモデルが誤る課題では多くが同じ誤った商品を選んだ（抄録）。", "fun": "テストで「よく考えなさい」と言われると、答えに自信は持てても正解が増えるとは限らない。買い物を任されたAIもまさにそうで、考える量を増やすと自信満々になるが、選ぶ商品の良さは変わらなかった。しかも、あるAIが間違える問題では、別のAIも同じ間違った商品を選びがちだった。AIを何台そろえても同じ失敗をしかねない点が面白い。", "unverified": "本文は入手できず、10モデルの内訳と較正誤差の数値は確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "正しいラベルでも付随する目印が挙動を支配", "title": "Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior", "url": "https://arxiv.org/abs/2611.04395", "authors": "Renee Jia ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Jia, R., & Wu, J. (2026). Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04395", "why": "微調整データに正解を示すメタ情報（報酬スコアなど）があると、ラベルがすべて正しくてもモデルがそれに依存することを示す。テスト時にその目印を誤答の選択肢に移すとCommonsenseQAで97〜100%その選択肢を選び、目印を除いた評価では依存が見えないと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "微調整データの正解を示す目印（報酬スコアなど）に、ラベルがすべて正しくてもモデルが依存するようになり、目印のない評価ではその依存が見えないことを示した（抄録）。未査読。", "p3": "3系統の7〜9Bのオープンなモデルを、「(Reward: 5)」が常に正しい選択肢に付く多肢選択問題で微調整し、テスト時に目印を誤った選択肢へ移したり除いたりして挙動を調べた。DPO後のQwen3でも確かめた（抄録）。", "p5": "目印を誤答に移すとCommonsenseQAの97〜100%でその選択肢を選び、除くとほとんど正答した。目印への追従は学習時の信頼性とともに急に強まり、中立的・無意味な語の目印でも生じた（抄録）。", "fun": "テストの正解の横にいつも小さな印が付いていたら、生徒は問題を解かずに印だけを見るようになるかもしれない。AIも同じで、正しい答えに必ず付いている目印があると、それに頼ることを覚えてしまう。しかも普段のテストでは正解するので、頼っていることに気づけない。正しいデータでも癖が付くという落とし穴が面白い。", "unverified": "本文は入手できず、3系統のモデル名と追従率の詳細は確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "国産チップで開発した大規模モデルXing 4", "title": "TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "url": "https://arxiv.org/abs/2611.22115", "authors": "Xingchen AGI Lab ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "apa": "Lab, X. A. G. I., : Hu, B., Yang, B., Wang, B., Pan, C., Lyu, C., Wang, C., Li, C., Pan, C., Lin, C., Zhang, C., Liu, C., Fan, D., Wu, D., Guo, D., Li, D., Li, D., Liu, E., … Wang, Z. (2026). TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22115", "why": "TeleChatの系譜を継ぐXing 4シリーズについて、Ascendチップ上でのアーキテクチャ選択、大規模事前学習、推論とエージェントの事後学習の設計と計算基盤を報告する。スパース活性化・注意機構・深さと幅・投機的デコーディングの得失を、計算量とメモリアクセスの観点から整理する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "TeleChatの系譜を継ぐ大規模言語モデルXing 4について、Ascendチップ上での設計と、285Bパラメータのモデルを8,192枚のAscend 910Cで事前学習した計算基盤を報告した（抄録）。未査読の技術報告。", "p3": "スパース活性化・注意機構・深さと幅・投機的デコーディングによる容量と計算・メモリ・実行の均衡を検討し、MindSpore HyperParallelで位相を考慮した混成シャーディングや長系列の管理を行う。事後学習にはエージェントの実行・評価・軌跡作成を方策最適化に結ぶTeleGymを導入した（抄録）。", "p5": "抄録は設計と基盤の説明が中心で、ベンチマークの数値の記載はない（抄録）。", "fun": "最先端のAIの学習には大量の専用チップが必要で、その多くは特定の会社の製品に頼っている。この報告は、別の国産チップ8,192枚で巨大なモデルを学習させるために、モデルの形から計算の配り方、CPUの使い方まで工夫を積み上げた記録だ。AIの性能が、アルゴリズムだけでなく計算機の設計の総力戦で決まることが見えて面白い。", "unverified": "本文は入手できず、モデルの性能評価の結果は確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "重みを手で書くならTransformerは要らない", "title": "Weight-Space Programming Doesn't Need Transformers", "url": "https://arxiv.org/abs/2611.22055", "authors": "Hyunjong Ok ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "apa": "Ok, H., & Lee, J. (2026). Weight-Space Programming Doesn't Need Transformers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22055", "why": "LLMが勾配を使わずに重みを書く設定ではTransformerを使う理由がなくなると指摘し、3つのLLMに重みの生成とアーキテクチャの設計を任せる。自由に設計させると事実を疎な表と固定手順に編み込み、同じLLMが書いた最良のTransformerより約1,800分の1のパラメータで高い正答率を得たとする。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMが勾配を使わずに重みを直接書く設定では、LLMは自らTransformerではなく疎な表を設計し、少ないパラメータで高い正答率を得ることを示した（抄録）。未査読。", "p3": "最小限の指示、10個のラベルつき例、サンドボックスを与え、主に多肢選択問題で3つの最先端LLMに、固定した構造の重みの生成か、構造そのものの設計を任せた（抄録）。", "p5": "自由に設計させると3つとも事実を疎な表に編み込み、正答率は最大54.4%で、同じLLMが書いた最良のTransformerより約1,800分の1のパラメータで上回った。これを基に、同規模のTransformerよりGPUで最大17倍速い連想記憶型のモデルを提案した（抄録）。", "fun": "AIの部品として広く使われているTransformerは、「勾配降下で学習しやすい」から選ばれてきた。では、AIが人間のように手で重みを書くなら何を選ぶか。試すと、AIは知識を整理した「表」を選び、どの数字が何を意味するかを説明でき、間違いも直せた。作り方が変われば最適な形も変わる、という発想の転換が面白い。", "unverified": "本文は入手できず、使ったLLMの名前は確認できなかった。事前学習したLLMのほうが精度は高いと著者は認めている。"}}, {"id": "pn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "LLMのチームは裏切る仲間をどう見抜くか", "title": "Bad Apples in the Kitchen: How LLM Teams Detect, Correct, and Calibrate Against Their Misaligned Members", "url": "https://arxiv.org/abs/2611.22342", "authors": "Dongseok Heo ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Heo, D., Kim, J., & Suh, B. (2026). Bad Apples in the Kitchen: How LLM Teams Detect, Correct, and Calibrate Against Their Misaligned Members (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22342", "why": "4人で調理するOvercookedの環境に、発言と行動のずれ・役割侵犯・全体進捗の妨害の3種の不整合なエージェントを入れ、720回の試行で検知・修正・較正の3段階に分けて頑健性を調べる。ほぼすべての妨害者は最終的に名指しされるが、回復は原因の帰属と状況の診断がそろったときに限られると報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "実時間で協力するLLMのチームに、発言は協力的なまま行動がずれる仲間を入れると、ほぼ全員がいずれ名指しされるが、回復は原因の帰属と状況の診断が同じ発言に含まれるときに限られることを示した（抄録）。未査読。", "p3": "4人で調理するOvercookedの環境に、発言と行動の不一致・役割の侵犯・全体の進捗の妨害の3種の不整合なエージェントを入れ、3×4×2の設計で720回の試行を行い、頑健さを検知・修正・較正の3段階に分けた（抄録）。", "p5": "ほぼすべての妨害者がいずれ名指しされたが、回復は帰属と診断が一つの発言にそろうときだけだった。原因の帰属を直接促すと最も難しい場合が改善したが、妨害者のいない基準の成績が37.5%下がった（抄録）。", "fun": "チームの中に、口では協力すると言いながら行動で足を引っ張るメンバーがいたらどうなるか。AIの料理チームで試すと、怪しい仲間の名前はやがて挙がるが、「誰が」だけでなく「何が起きているか」まで一緒に言えたときだけ立て直せた。疑い深くさせると今度は普段の協力が崩れる、という人間の組織にも通じる難しさが面白い。", "unverified": "本文は入手できず、使ったLLMの種類は確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "現金を多く持つ企業ほど職場の多様性を推進", "title": "The Bright Side of Cash Holdings: Evidence from Workplace Diversity and Inclusion", "url": "https://doi.org/10.2139/ssrn.7698178", "authors": "Md Safiullah ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Safiullah, M., & My Nguyen, L. T. (2026). The Bright Side of Cash Holdings: Evidence from Workplace Diversity and Inclusion. https://doi.org/10.2139/ssrn.7698178", "why": "15,205の企業・年のパネルで、現金保有の多い企業ほど職場の多様性と包摂を推進することを示し、操作変数法と傾向スコアで内生性に対処する。昇進機会・柔軟な働き方・包摂的な採用が経路で、包摂を進める現金保有企業では企業価値との関係もみられたとする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業の現金保有が多いほど職場の多様性と包摂（D&I）が進むことを、2008〜2021年の15,205の企業・年のパネルで示した（抄録）。未査読。", "p3": "D&Iと現金保有の別の指標でも確かめ、2段階最小二乗法の操作変数法と傾向スコア・マッチングで内生性に対処し、経路の分析を行った（抄録）。", "p5": "現金の多い企業は属性をまたぐ昇進機会、柔軟な働き方、包摂的な採用を提供しやすく、それがD&Iを高めていた。D&Iを進める現金の多い企業で企業価値との関連もみられた（抄録）。", "fun": "会社がお金を手元に多く置いておくことは、投資家から「無駄」と批判されがちだ。ところがこの研究では、現金に余裕のある会社ほど、昇進の機会を公平にしたり柔軟な働き方を整えたりして、多様な人が働きやすい職場を作っていた。余裕が人への投資につながるという、現金保有の明るい面を示した点が面白い。", "unverified": "本文は入手できず、効果の大きさと使った操作変数は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "組織行動・心理的安全性", "headline": "能動的AIの「見る」と「口を出す」を分けて制御", "title": "Controlling Proactive Multimodal AI: Separating Perception from Participation", "url": "https://arxiv.org/abs/2611.22431", "authors": "Muawiz Feroze Khan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Khan, M. F., Ali, F., & Huang, Y. (2026). Controlling Proactive Multimodal AI: Separating Perception from Participation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22431", "why": "画面・音声・操作を感知して作業に入るかを決める能動的なAIについて、何を知覚してよいかとどこまで参加してよいかを利用者が別々に設定できる試作を作り、16人の研究で検証する。利用者は知覚の経路を残したまま参加を質問や沈黙に下げることができたと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "画面や声を感知して作業に入ってくる能動的なAIについて、「何を知覚してよいか」と「どこまで参加してよいか」を分けて設定できるようにすると、利用者は知覚を残したまま参加だけを抑えられることを示した（抄録）。未査読。", "p3": "14人のWizard-of-Oz研究を基に、画面・音声・操作を感知し、沈黙・質問・支援を選ぶ試作SpotMeを作り、16人が市民向けダッシュボードで能動的な支援を体験し、AIの判断を点検して設定する研究を行った（抄録）。", "p5": "参加者はすべての知覚の経路を残しながら参加を質問や沈黙に下げ、抑えた判断を見せることで沈黙の理由が分かり異議を唱えられるようになった。AIが何を使ったかを見て、クリックや強調、話し方を変える人もいた（抄録）。", "fun": "隣で画面を見ている同僚が、手伝うべきか黙るべきかを判断してくれたら便利だが、見られすぎるのも口を出されすぎるのも困る。この研究は、AIに「見てよい範囲」と「口を出してよい範囲」を別々に決めさせた。すると人は、見るのは許しても口出しは控えめに、という設定を選んだ。AIが黙った理由まで見せると納得しやすい点が面白い。", "unverified": "本文は入手できず、参加者の設定の分布などの数値は確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "アルゴリズム選択の競争は競争価格を保証しない", "title": "Algorithmic Pricing under Strategic Delegation", "url": "https://doi.org/10.2139/ssrn.7697359", "authors": "Zhengge Zhou ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Zhou, Z., Yang, H., & Capponi, A. (2026). Algorithmic Pricing under Strategic Delegation. https://doi.org/10.2139/ssrn.7697359", "why": "マーケットメーカーが学習アルゴリズム（基本のQ学習か、追加の市場データを要する反実仮想Q学習）を選ぶゲームを分析し、データが十分安くないと互いに基本型を選ぶ均衡になり、競争的な価格が実現しないことを示す。報酬を歪めたアルゴリズムへの委任は市場の質をさらに悪くしうる。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "マーケットメーカーが値付けを学習アルゴリズムに任せる競争では、競争的な価格を生むアルゴリズムが採用されるとは限らないことを理論的に示した（抄録）。未査読。", "p3": "マーケットメーカーが基本のQ学習か、追加の市場データを要する反実仮想Q学習（Clever）にコミットし、学習の過程での期待平均利益で評価するゲームを分析した（抄録）。", "p5": "Cleverは互いに採用すれば競争的価格を生むが、基本型どうしはデータ費用がいくらでも均衡で、Cleverどうしはデータが十分安いときだけ均衡になる。強い逆選択で基本型が厳密に支配的になることもあり、報酬を歪めた偏ったアルゴリズムへの委任は市場の質をさらに悪くしうる（抄録）。", "fun": "株などの値段をAIに決めさせると、AIどうしが示し合わせたように高い値段を付けてしまう心配がある。賢いAIを使えば競争的な値段になるが、そのAIにはお金のかかるデータが必要だ。この研究は、各社が自分の得を考えると結局は賢くないAIを選び、値段が競争的にならないことを示した。道具選びそのものが競争の結果を左右する点が面白い。", "unverified": "本文は入手できず、数値例や模擬実験の有無は確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "プラットフォーム競争が差分プライバシー基準を変える", "title": "How Platform Competition Shapes Differential Privacy Standards", "url": "https://doi.org/10.2139/ssrn.7695760", "authors": "Zhe Chen ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Chen, Z., Li, Y., Chen, W., & Chen, Z. (2026). How Platform Competition Shapes Differential Privacy Standards. https://doi.org/10.2139/ssrn.7695760", "why": "プラットフォームが監査可能なプライバシー予算を選んでから価格競争する複占モデルで、均衡の予算が厚生上の基準を上回りうることを示し、予算の上限規制と精度の上限規制を比べる。競争の強さによって望ましい規制の形が入れ替わりうるとする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プラットフォームがプライバシー予算を選んでから価格競争する複占で、均衡の予算は厚生の基準を超えうること、共通の予算上限と精度上限の優劣が競争の強さで入れ替わりうることを理論的に示した（抄録）。未査読。", "p3": "2段階の複占で、監査可能な差分プライバシーの予算を選んだ後に利用者価格で競争する。予算が大きいほどデータの使いやすさと収益化は上がるが保護は弱まり、問い合わせの感度だけが違うプラットフォームについて、予算上限と精度上限をそれぞれ最適な水準で比べた（抄録）。", "p5": "精度上限の2次の優位は価格競争が弱まるほど小さくなり、対称の近くでの順位は予算上限の側へ高々1回反転しうる。精度を揃える規則は調整が過大になりうり、厚生基準の1次の感度に合わせた規則で2次の損失が消える（抄録）。", "fun": "アプリの会社が利用者のデータをどこまで使ってよいかを、「プライバシー予算」という数字で決める考え方がある。会社どうしが競争していると、各社は予算を社会にとって望ましい水準より大きくしがちだ。では規制は予算そのものに上限を付けるべきか、データの精度に上限を付けるべきか。その答えが競争の激しさで変わる点が面白い。", "unverified": "本文は入手できず、数値例の有無は確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "あえて好みでない商品を見せると消費者が得をする", "title": "How to Mismatch Consumers", "url": "https://doi.org/10.2139/ssrn.7696198", "authors": "Wenhao Li", "venue": "SSRN", "date": "2026-11-17", "apa": "Li, W. (2026). How to Mismatch Consumers. https://doi.org/10.2139/ssrn.7696198", "why": "プラットフォームが一部の消費者に好みの劣る商品だけを見せる「ミスマッチ」が、価格を下げさせることで消費者余剰の合計を高めうることを独占と複占で示す。一様分布の例では全員に最適な商品を見せる場合より消費者余剰が約41%高くなる。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プラットフォームが一部の消費者にあえて好みの劣る商品だけを見せる「ミスマッチ」が、価格を下げさせて消費者余剰の合計を高めうることを、独占と複占の両方で理論的に示した（抄録）。未査読。", "p3": "消費者と商品の組合せを決めるプラットフォームのモデルで、全員に全商品（または最も好む商品）を見せる場合と、一部をミスマッチさせ、時に取引から外す場合を比べた（抄録）。", "p5": "複占での消費者に最適な組合せは、評価の差が等しい対角線ごとに評価の低い消費者を好みの劣る商品だけに組み合わせる閾値型の方針で、評価が独立な一様分布なら全員に見せる場合より消費者余剰が約41%増える（抄録）。", "fun": "おすすめ機能は「その人が一番好きな商品を見せる」のが正しいと思いがちだ。ところがこの研究は、あまり熱心でない客にはあえて第二候補だけを見せたほうが、店が値下げせざるを得なくなり、客全体の得が増えうることを示した。親切に見えることが必ずしも客のためにならない、という逆説が面白い。", "unverified": "本文は入手できず、一様分布以外の場合の結果は確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "開示義務がかかる階層で報告の中身が変わる", "title": "Where Disclosure Binds: Entity-Level Obligations and Product-Level Reporting", "url": "https://doi.org/10.2139/ssrn.7720801", "authors": "Franco Fiore ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Fiore, F., Knetsch, A., Latino, C., & Pelizzon, L. (2026). Where Disclosure Binds: Entity-Level Obligations and Product-Level Reporting. https://doi.org/10.2139/ssrn.7720801", "why": "EUの持続可能な金融開示規則（SFDR）は運用会社単位では主要な悪影響（PAI）の定量開示を求めるが、ファンド単位では原則任意である。14,215のUCITSファンドの17指標で、対象の運用会社のファンドほど定量開示は多いが網羅性は低いことを示し、保有から再構成した指標とも比べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "EUの持続可能な金融開示規則（SFDR）で開示義務が運用会社単位にかかると、ファンド単位の定量開示は増えるが中身の網羅性は下がり、データの食い違いも全体としては減らないことを示した（抄録）。未査読。", "p3": "14,215のEUのUCITSファンドの17の主要な悪影響（PAI）指標を使い、対象の運用会社のファンドとそれ以外を比べ、ファンドが報告したPAIを保有銘柄から独立に再構成した指標と比べた（抄録）。", "p5": "対象の会社のファンドは定量的なPAIを開示しやすいが、開示した場合の網羅性は低かった。義務の範囲と出典間の食い違いの小ささには一般的な関連がなく、持続可能な投資を目的とするファンドでだけ負の関連がみられた（抄録）。", "fun": "環境への悪影響を開示しなさいという決まりが、会社全体にはかかるが個々の商品にはかからない場合、商品ごとの情報はどうなるか。調べると、開示する商品は増えたが、項目が欠けがちで、外部から計算した値との食い違いも減っていなかった。「開示が増えた」ことと「透明になった」ことは別だと示した点が面白い。", "unverified": "本文は入手できず、開示率の差の大きさは確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "美容師免許の訓練時間が開業を減らすか", "title": "Occupational Licensing and Entrepreneurship: Do Higher Entry Barriers Reduce Business Formation in Cosmetology?", "url": "https://doi.org/10.2139/ssrn.7702478", "authors": "Ethan Youn", "venue": "SSRN", "date": "2026-11-18", "apa": "Youn, E. (2026). Occupational Licensing and Entrepreneurship: Do Higher Entry Barriers Reduce Business Formation in Cosmetology? https://doi.org/10.2139/ssrn.7702478", "why": "2017年に州ごとに1,000〜2,300時間と異なる美容師免許の訓練要件と、従業員のいない事業も含む美容院の数を組み合わせて分析する。州間の関係は地域間の違いによるもので、同じ地域内の比較では消えることを示し、要件を変えた州の事例も追う。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "美容師免許の訓練時間の長さが美容院の開業を減らすかを2つの方法で調べ、どちらでも明確な証拠は得られなかったが、効果の存在も否定できない精度だったと報告した（抄録）。未査読。", "p3": "2017年に州ごとに1,000〜2,300時間と異なる訓練要件と、従業員のいない事業も含む国勢調査局の美容院数を、州間の横断比較と、2018年に要件を300〜600時間減らした3州と変えなかった33州の差の差法で分析した（抄録）。", "p5": "横断では要件100時間増で人口1万人あたり0.52店少ない（平均の約2%、p=0.06）が、同じ地域内の比較や南部を除くと消えた。改革州の店の密度は3.7%上がったが、偽の検定で同程度の変化は偶然でもよく起きた（p=0.52）（抄録）。", "fun": "美容師になるための訓練時間は、州によって2倍以上も違う。長い訓練は新しい店を開く妨げになるのでは、と考えるのは自然だ。ところが丁寧に調べると、見かけの関係は地域の違いで説明でき、訓練時間を減らした州でも店がはっきり増えたとは言えなかった。「効果がない」と「効果が見えない」を区別して報告している点が誠実で面白い。", "unverified": "本文は入手できず、事業の数以外の成果（雇用など）を調べたかは確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "住居費の差が米国のインフレ格差を生む", "title": "Housing and Inflation Inequality in the United States", "url": "https://doi.org/10.2139/ssrn.7697858", "authors": "Zong Huang", "venue": "SSRN", "date": "2026-11-17", "apa": "Huang, Z. (2026). Housing and Inflation Inequality in the United States. https://doi.org/10.2139/ssrn.7697858", "why": "American Community Surveyで家賃指数を作りCPIとよく一致することを示したうえで、世帯の属性ごとの住居費のインフレを推計する。2006〜2019年の住居費のインフレは非白人の世帯で5.5ポイント高く、学歴では差がなかったとし、空間均衡モデルで説明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の住居費のインフレは世帯の属性で異なり、2006〜2019年に非白人の世帯で5.5ポイント高かった一方、学歴では差がなかったことを示した（抄録）。未査読。", "p3": "American Community Surveyで家賃指数を作り、全国と都市圏の両方で消費者物価指数とよく一致することを確かめたうえで、属性ごとの住居費のインフレを推計し、分断された住宅市場の空間均衡モデルで説明した（抄録）。", "p5": "非白人の世帯は家賃の上がりやすい地域と住宅の種類に住む傾向があった。高学歴の世帯は家賃の上がる都市に住むが、上がりにくい住宅の種類を選び、非相似的な選好でこのパターンが説明できる（抄録）。", "fun": "物価の上がり方は、誰にとっても同じとは限らない。家賃に注目すると、非白人の世帯は家賃が上がりやすい地域や住まいに住む傾向があり、13年間で住居費の上昇が5.5ポイントも大きかった。一方、学歴の高い人は家賃が上がる都市に住みながら、上がりにくい種類の住まいを選んでいた。同じ物価統計の裏に暮らしの格差が隠れている点が面白い。", "unverified": "本文は入手できず、モデルの推定値は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "有給育休の拡充で従業員の離職が減る", "title": "Bucks for Bumps: How Paid Parental Leave Pays Off for Firms", "url": "https://doi.org/10.31235/osf.io/qb5pa", "authors": "Hillary Cookler", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Cookler, H. (2026). Bucks for Bumps: How Paid Parental Leave Pays Off for Firms. https://doi.org/10.31235/osf.io/qb5pa", "why": "手作業で集めた企業の育休制度の変更のデータで、有給育休の拡充が従業員の定着に与える因果効果を差の差法で推定する。拡充で離職率が3.0%下がり、これは1.4%以上の恒久的な賃上げに相当するとし、効果の経路が労働者によって異なることを論じる。", "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業が有給育休を拡充すると従業員の離職率が3.0%下がり、これは1.4%以上の恒久的な賃上げに相当し、現実的な利用率では企業にとって正味の利益になることを示した（抄録）。未査読。", "p3": "手作業で集めた企業の育休制度の変更のデータで、差の差法により有給育休の拡充が定着に与える因果効果を推定し、ACSの出生の推計と従業員・企業のデータで費用と比べた（抄録）。", "p5": "女性の定着の改善は最も若く賃金の低い層に集中し、出産の多い年齢の女性では改善がなかった。男性では賃金の上位と、育休を使いそうにない40歳以上でも改善した。公的な育休制度には検出できる定着効果がなかった（抄録）。", "fun": "育休は「使う人のための制度」と思われがちだが、この研究では、育休を使いそうにない40歳以上の男性まで会社に残りやすくなっていた。さらに、出産の多い年齢の女性ではむしろ効果が見られなかった。制度が「この会社は社員を大事にする」という合図として働いている可能性がうかがえる点が面白い。", "unverified": "本文は入手できず、使ったデータの企業数と期間は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "独サプライチェーン法に株式市場は負の反応", "title": "Much Ado About Due Diligence? Capital Market Reactions to the German Supply Chain Act", "url": "https://doi.org/10.2139/ssrn.7695584", "authors": "Karolin Schulte ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Schulte, K., Pflitsch, M., & Pott, C. (2026). Much Ado About Due Diligence? Capital Market Reactions to the German Supply Chain Act. https://doi.o
