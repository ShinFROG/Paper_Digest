予測区間は推定パラメータを条件にした診断で正式な適合度検定ではないと述べる（§2.2–2.3）。", "fun": "AIに作文を続けて採点させると、高い点をつけた直後は少し辛くなる、といった「前の採点の影響」が出ます。順番をシャッフルして平均すれば打ち消せると思いがちですが、グループ同士を比べる場面では、点数の付き方が直線的でないために、平均の質が同じでも差があるように見えてしまうのです。", "unverified": "データ例（§6）で各手法がどちらの方法を良いと判定したかの数値は未確認。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "推薦が混雑を生まない設計でNY高校入試の格差縮小", "title": "Personalized Recommendations Without Inducing Congestion: Mitigating Disparities in the NYC High School Match", "url": "https://arxiv.org/abs/2610.08275", "authors": "Erica Chiang ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Chiang, E., Peng, K., Lichtenstein, R., McDaniel, B., O'Neil, K., Thomas, D., Wright, L., Kleinberg, J., Tardos, E., & Garg, N. (2026). Personalized Recommendations Without Inducing Congestion: Mitigating Disparities in the NYC High School Match (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08275", "why": "推薦が定員のある市場で自滅する現象を定式化し、混雑を考慮した推薦を実際の入試でRCT評価した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（混雑の動機づけ、問題設定、2段階の手法、シミュレーション結果、RCTの設計と結果、拡大の分析、考察と限界）を読んだ", "preprint": true, "p1": "定員のある選抜市場で推薦が特定の学校に志望を集中させ、かえって合格しにくくする「推薦による混雑」を定式化し、それを避ける推薦の割り当てを設計して、ニューヨーク市の高校入試で実地の無作為化比較試験を行った（§3、§6）。", "p2": "学校選択の推薦は情報格差と不平等を減らしうるが、規模が大きくなると同じ学校に推薦が集中し、合格の見込みが高いと予測されていた生徒まで不合格になりうる（§1、§3.1）。", "p3": "対象中学の生徒について、近くの高実績校で合格見込みが「高」の組だけを推薦候補とし、(1)過去のデータで、合格見込み「高」の生徒の合格率が80%以上に保たれる範囲で各校に送れる推薦数の上限（ナッジ容量）を、生徒の採用行動を仮定した二段階最適化と模擬で求め、(2)実施時に、生徒あたりの推薦数に凹の目的関数を置いた整数計画で推薦を広く配る（§3.3、図3）。", "p4": "2024–25年度のデータによる模擬で、全員に全候補を推薦する素朴な方法と比べた（§5）。2025–26年度の入試で、中学単位で処置強度を0・50・100%に無作為化し、統制群822人・処置群444人で、推薦校を志望に入れた割合と推薦校への合格割合を事前登録したロジスティック回帰で比べた（§6.1–6.2）。", "p5": "素朴な推薦では採用率20%で56校中7校、50%で15校で「高」の生徒の合格率が80%を下回ったが、容量を課すと80%以上を保った（§5.2）。RCTでは推薦校を志望に入れた割合が処置16.4%対統制10.5%（相対57%増、p=0.011）、推薦校への合格が5.6%対3.3%（相対71%増、p=0.071）で、処置群で推薦校に不合格となった生徒はいなかった（抄録、§6.2）。", "p6": "著者は、合格見込み「高」の生徒を守る代わりに見込みの低い志望者を押し出しうること、生徒の採用行動を一様と仮定していること、合格見込みの表示そのものが行動を変えうることを限界とし、初回の実施を慎重に設計したと述べる（考察と限界、§6.3）。合格の差はp=0.071で、通常の5%水準には届かない。", "fun": "「この学校がおすすめ」と全員に勧めると、みんながそこに応募して倍率が上がり、勧めた意味がなくなります。人気のお店をSNSで紹介すると行列ができて入れなくなるのと同じです。そこで、勧める人数にあらかじめ上限を設けてから配る、という工夫を実際の入試で試し、格差の縮小につなげた点が見事です。", "unverified": "表5(b)の処置効果の係数と、生徒・保護者の受け止め方の結果は未確認。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "次に何を測れば因果効果が識別できるか", "title": "What Should We Measure Next? Finding Identification Strategies by Refining Mechanisms", "url": "https://arxiv.org/abs/2610.08092", "authors": "Mikko V\\\"a\\\"an\\\"anen ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Väänänen, M., Cui, F., Cinelli, C., & Tikka, S. (2026). What Should We Measure Next? Finding Identification Strategies by Refining Mechanisms (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08092", "why": "部分的に特定された因果モデルで、どの変数を観測すれば識別可能になるかの必要十分条件とアルゴリズムを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、グラフ上の判定条件、計算実験の表1と被覆・実行時間、結論）を読んだ", "preprint": true, "p1": "因果効果が識別できない因果ダイアグラムで、どの矢印（媒介の仕組み）やどの双方向の辺（共通原因）を詳しく観測すれば識別可能になるかを、すべて見つける健全かつ完全なアルゴリズムを示した（§7）。", "p2": "通常の識別理論は、与えられた因果モデルで効果が識別できるかを判定するだけで、識別できないとき「次に何を測ればよいか」は教えてくれない。研究者はすべての矢印の背後の仕組みを調べ直すわけにもいかない（§1）。", "p3": "辺を「展開」して、矢印X→Cの間に媒介変数を、双方向の辺の代わりに観測できる共通原因を入れた拡張グラフを考える。例えば最も単純な場合、XとYの間の交絡を表す双方向の辺を共通原因に置き換えれば裏口調整、XからYへの矢印に媒介変数を入れれば表口調整で識別できる（§1、図1）。XとXの子の間のすべての双方向経路に含まれる双方向の辺を展開すれば識別できる、などの簡単な判定条件（定理1–2）と、識別アルゴリズムの失敗の原因（hedge）に基づく全列挙のアルゴリズムを作った（§3–5）。候補は最大2n−2本の辺だけを最終検査すればよく、この上限は鋭い（§7）。", "p4": "2〜6頂点のすべての非識別ケース（4億6,900万件超）で、1本の辺の展開で識別できる割合を数え、10〜160頂点の疎・密なランダムグラフで判定条件の被覆率と、全辺を試す総当たりとの実行時間を比べた（§6）。", "p5": "1本の展開で識別できる割合は、3頂点で92.3%、6頂点で55.2%だった。6頂点では31.0%が矢印の展開だけ、9.1%が双方向の辺の展開だけで解けた（表1）。簡単な判定条件は全探索の事例の90〜100%を完全に解決し、160頂点の密なグラフで総当たりより中央値で1,896倍速かった（§6.2–6.3）。", "p6": "著者は、複数の辺を同時に展開する場合への拡張を今後の課題としている（§7）。解釈：新たな変数を実際に測れるか、測定の費用はどうかといった実務上の判断は枠組みの外にある。", "fun": "「この薬の効き目はデータからは判断できない」とわかったとき、次に何を調べればよいかを地図の上で教えてくれる道具です。例えば「喫煙→がん」の間にある「タールの沈着」を測れば答えが出る、というように。何でも測るのではなく、測るべき一点を指し示す、という発想が研究の効率を大きく変えます。", "unverified": "付録の詳細な被覆率の表と、識別戦略の種類の内訳は未確認。"}}, {"id": "pn09", "rank": 9, "field": "地震工学・防災", "headline": "断層横断構造物向けに断層変位を破断条ごとに評価", "title": "Principal Surface Fault Rupture Hazard: Moving Beyond Aggregate Displacement Metrics", "url": "https://arxiv.org/abs/2610.08763", "authors": "Saba Marmarchinia ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Marmarchinia, S., & Lavrentiadis, G. (2026). Principal Surface Fault Rupture Hazard: Moving Beyond Aggregate Displacement Metrics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08763", "why": "集約された断層変位を個々の破断条に分け、構造物の寸法を考慮した断層変位ハザード評価を可能にした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データと破断条の再構成、既存と提案の評価式、3つの構成要素のモデル、IAEAベンチマークでの評価、考察と結論）を読んだ", "preprint": true, "p1": "活断層をまたぐ構造物の断層変位ハザード評価（PFDHA）で、並走する複数の破断条（rupture strand）の変位の合計（集約変位）ではなく、個々の破断条ごとの変位と位置を確率的に扱い、構造物の大きさに応じた評価を可能にする枠組みを示した（§4.2、§7）。", "p2": "既存の主断層変位モデルは集約変位を使い、重なり合う破断条がすべて同時に構造物に効くと暗に仮定している。これは地域的な評価には適するが、構造物は一部の破断条としか交わらないことがあり、有限の寸法を表せない（§2、§4.1）。", "p3": "75の地表地震断層を含むFDHIデータベースから、事象・区間の座標系を使って個々の主破断条の変位と位置を再構成した（§3）。(1)ある地点で重なる破断条の数（規模と断層の曲率で説明、式7）、(2)集約変位の各条への配分（平均1/Nのベータ分布で合計を保存、式16）、(3)主断層線からの各条の距離をモデル化し、構造物と交わる条の変位の超過確率に組み込んだ（式5）。", "p4": "国際原子力機関（IAEA）の断層変位ハザードのベンチマーク事例で、単一の破断条と複数の破断条の枠組みの結果を、既存の集約変位に基づく評価と比べた。断層の種類ごとのモデルの不確かさはロジックツリーで扱った（§6、表7）。", "p5": "集約変位の定式化は、構造物がすべての破断条の合計変位を同時に受けると仮定するため、ハザードを高めに見積もる傾向があった。提案の枠組みでは、ハザードへの主な寄与は単一の破断条との交差から来て、複数の条を同時に横切る確率はかなり低かった（§7）。破断条の数は地震の規模とともにおおむね増えた（§5.1、図8a）。", "p6": "本文によれば、正断層・逆断層は事象が少なく、断層種をまとめたモデルで補っている（§6）。解釈：既存の集約モデルは保守的な上限として位置づけられ、提案法で評価が下がる場合、設計上の安全余裕をどう扱うかは実務的な判断を要する。未査読のプレプリントである。", "fun": "地震で地表に現れる断層のずれは、1本の線ではなく、何本もの筋に分かれて現れることがあります。これまでは全部の筋のずれを足し合わせて、パイプラインなどがそれを丸ごと受けると考えていました。実際には一部の筋しか横切らないことが多いので、筋ごとに考えると、より現実に近い（多くは小さめの）見積もりになるのです。", "unverified": "ベンチマーク事例ごとのハザード曲線の具体的な数値は未確認。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "専門家が確認したAI教材で成績下位層が伸びた", "title": "Verified, not generated: expert-verified AI study materials and the distribution of learning gains in a university course", "url": "https://arxiv.org/abs/2610.07097", "authors": "Canh Thien Dang ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Dang, C. T., & Nguyen, A. (2026). Verified, not generated: expert-verified AI study materials and the distribution of learning gains in a university course (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07097", "why": "大学の経済学の授業での差の差分析で、検証済みAI教材の効果が下位層に集中することを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（設定と介入、識別、平均効果の表1、分布効果の表2、感度分析の表3、代替説明、限界）を読んだ", "preprint": true, "p1": "大学1年の経済学の授業で、生成AIで作り専門家（大学院生の指導補助者）が確認した学習教材を与えると、成績の下位層を中心に学習成果が上がったことを、差の差分析で示した（抄録、§4）。", "p2": "教育での生成AIの実験の多くは平均効果だけを報告するが、AIは成績格差を縮めることも広げることもある。著者は、その方向は学習者がAIの出力を自分で選別する負担（判断の負担）の大きさによると主張する（§1、§2.3）。", "p3": "英国の大学の必修「経済学原理」（前半ミクロ・後半マクロ、各50点の期末試験）で、2024/25年度に後半のみ、NotebookLMで講義資料から作ったポッドキャスト・FAQ・問題つき学習ガイドを、名前のある指導補助者が確認して配布した。前年度（各学年85人）と、前半・後半を比べる2×2の差の差で効果を推定した（§3.1–3.3）。", "p4": "平均効果（後半×導入後の係数）、成績の分布（各閾値を下回る割合、分位点）、前年の最低点の学生を除く感度分析、努力の振り替えなどの代替説明、36人の学生の聞き取りで評価した（§3.4–4.5）。", "p5": "係数は2.341点（50点満点、p=0.045〜0.013）で、前年の後半の分布の0.33標準偏差だった。ただし後半の点は0.73点の有意でない上昇で、未処置の前半が1.61点下がったことによる「低下からの保護」だった（§4.1、表1）。上位二等級の境界（30点）を下回る割合は反事実より24.7ポイント減り、23〜31点のすべての閾値で有意、それより上では有意でなかった。平均効果の約4分の3は最下位5分の1から来ていた（抄録、表2）。閾値の結果は最低点の学生を除いても頑健だったが、平均効果は弱まった（§4.3）。", "p6": "著者は、1大学1授業・介入前1年度だけで平行トレンドを検定できないこと、前半から後半への努力の振り替えの可能性、利用記録がないこと、確認と新教材の効果を分けられないこと、落第者のいない成績の高い学年であることを限界として挙げる（§5.6）。", "fun": "AIが作った教材は便利ですが、間違いが混ざっているかもしれず、それを見抜くには知識が要ります。だから得意な学生ほど得をしがちです。この研究では、先生側が先にチェックして「確認済み」と示すことで、その見抜く負担を学生から外し、苦手な学生ほど伸びました。AIの恩恵を誰が受けるかは、使い方の設計しだいなのです。", "unverified": "表1・表2の各セルの平均点の詳細な数値は未確認。"}}, {"id": "pn11", "rank": 11, "field": "統計学", "headline": "短い時系列ラベルでも予測を使った妥当な推論", "title": "Prediction-powered inference for time series across space", "url": "https://arxiv.org/abs/2610.08715", "authors": "Shahzar Rizvi ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Rizvi, S., Burt, D., Srinivasan, V., Berlinghieri, R., Del Col, S., & Broderick, T. (2026). Prediction-powered inference for time series across space (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08715", "why": "時間依存のある空間時系列で、予測強化推論（PPI）を自己相関に対応させ信頼区間を出す方法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定、データ分割と予測器、HACの適用、シミュレーション設定と表2の結果）を読んだ", "preprint": true, "p1": "多くの地点で、ラベル（例：作物収量や保険金支払い）が観測された期間は短いが、共変量（例：気象）は長期間ある状況で、各地点の長期平均を偏りなく推定し、時間的な自己相関を考慮した妥当な信頼区間を出す方法PPITSASを示した（§1、§4）。", "p2": "短い観測期間だけでは推定が不安定で、機械学習で欠けたラベルを補完すると偏りが入る。予測強化推論（PPI）はこの偏りを補正できるがi.i.d.を仮定し、時間依存があると破綻する。自己相関に対応するHAC法は補完ラベルのある場合に適応されていない（抄録、§1）。", "p3": "ラベルのある期間を予測器の学習用と偏り補正用に分け、予測器は全地点のデータで1つだけ学習してデータを節約する。推定量は「長期間の予測値の平均」＋「補正期間の（実測−予測）の平均」で、2つの平均を時間定常性のもとで漸近的に無相関とみなし、それぞれの分散をNewey–West型のHACで自己相関を考慮して推定する（§4.1–4.2）。", "p4": "真値が観測データからは得られないため、121地点の格子で、ラベルあり4,000日（約10年）・なし16,000日（約40年）の模擬データを作り、応答は気象の2次関数、予測器は線形とした。古典的推定、補完による推論（IWI）、時間を考慮しないPPI、HAC、真値を知る理想と、RMSE・95%区間の被覆率・区間の幅で比べた（§5.1）。", "p5": "穏やかな気象の設定で、PPITSASは点推定のRMSEが最小（0.0299、古典は0.0503）で、被覆率93.45%を保ち、HAC（91.72%）より区間の半幅が狭かった（0.0527対0.0871）。補完やi.i.d.のPPIは被覆率が21〜33%にとどまった（表2）。極端な気象の設定でも同じ傾向だった（表2）。", "p6": "著者は、PPITSASの信頼区間の漸近的妥当性について形式的な証明の難しさを論じ、議論の概要を示すにとどめている（§4.2、付録E.2）。解釈：評価は模擬データのみで、実際の保険データでの検証はない。", "fun": "10年分しか保険金の記録がない地域でも、天気の記録は40年分あります。天気から保険金をAIで予測して補えば推定は安定しますが、AIの癖で偏りが入ります。そこで、記録のある期間で「AIのずれ」を測って差し引き、さらに今日と明日の天気が似ている（時間のつながり）ことも考慮して、正しい不確かさの幅を出す工夫です。", "unverified": "漸近的妥当性の完全な証明は本文でも示されていない（付録E.2）。"}}, {"id": "pn12", "rank": 12, "field": "因果推論", "headline": "鋭い因果境界は合成すると鋭さを失う", "title": "The Missing Corner: When Sharp Causal Bounds Fail to Compose", "url": "https://arxiv.org/abs/2610.08197", "authors": "Yicheng Qi ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Qi, Y., & Xiong, X. (2026). The Missing Corner: When Sharp Causal Bounds Fail to Compose (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08197", "why": "二つの潜在アウトカム平均の鋭い境界から差の鋭い境界が得られる条件を厳密に特徴づけた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、モデルと合成の問い、定理1と整合条件、ファイバーによる説明、観測表での確認、符号の喪失の例）を読んだ", "preprint": true, "p1": "二つの潜在アウトカム平均（全員処置・全員非処置）の鋭い境界を引き算して平均処置効果（ATE）の境界を作るとき、それが鋭くなる（ある一つのモデルで実現できる）のはどんな場合かを、複数の環境のデータを組み合わせる設定で厳密に特徴づけた（抄録、§3）。", "p2": "処置平均の最大値と非処置平均の最小値はそれぞれ実現可能でも、同じモデルで同時に実現できるとは限らない。にもかかわらず、両者の引き算でATEの境界を作ることが多い（§1、図1）。", "p3": "二値の処置・結果で、K個の環境が潜在アウトカムの同時分布を共有し、各環境で応答型ごとの処置確率に上下限（選択の包絡）を課す線形の制約で、平均の組の実現可能領域を考える（式1–2）。二つの平均は「両方1」の割合cを決めないので、ある平均の組に対して残る可能性の区間（ファイバー）が環境ごとに定まり、同じcが全環境で成り立つ必要がある（式6）。", "p4": "理論の主張は証明で示し、具体的な観測表に対して引き算が鋭いかを確かめる計算手順と、有限標本での符号判定の模擬（各設定200回、n=3,000〜30,000）を示した（§3.4、§4）。", "p5": "選択確率の上下限が全環境で一致する（整合する）ときに限り、平均の領域は長方形になり、引き算は全ての両立する観測表で鋭いATE境界を与える。整合する場合、端点と実現モデルはO(K)の算術で求まる。整合しない場合は、指定の処置確率のもとで正の観測表の開集合上で必ず失敗し、小さな分布のずれでも続く（定理1）。四つの周辺端点を固定したまま、同時の上界の符号だけが変わる例も示した（命題2）。", "p6": "結果は二値の処置・結果、厳密な選択確率の上下限、内点の処置確率という設定に限られる（抄録）。解釈：実務では、まず各環境の上下限が揃っているかを確認し、揃っていなければ同時最適化で境界を計算し直す必要がある。", "fun": "「Aの最高点」と「Bの最低点」はそれぞれありえても、同じ世界で両方が同時に起こるとは限りません。両方を引き算して「差は最大でこれだけ」と言うと、ありえない組み合わせを含んだ誇張になります。どんなときにその引き算が許されるかを、ぴったり一つの条件で言い当てた点が鮮やかです。", "unverified": "付録の証明の詳細と、命題2の数値例の各端点の値の解釈は未確認。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "インフレ予想が消費に与える影響は物価環境で逆転", "title": "Inflation Expectations and Household Spending: Different Patterns in Low- and High-Inflation Settings", "url": "https://doi.org/10.2139/ssrn.7570678", "authors": "Bernardo Candia", "venue": "SSRN", "date": "2026-10-07", "apa": "Candia, B. (2026). Inflation Expectations and Household Spending: Different Patterns in Low- and High-Inflation Settings. https://doi.org/10.2139/ssrn.7570678", "why": "複数のRCTで、低インフレ期と高インフレ期で耐久財消費の反応の符号が逆になることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "家計のインフレ予想が外生的に変わったときの耐久財の消費の反応は、低インフレ期と高インフレ期で逆向きになることを、複数の無作為化比較試験で示した（抄録）。", "p2": "インフレ予想が消費を動かすかは金融政策の重要な経路だが、予想が高まると消費を前倒しするのか（異時点間の代替）、将来の実質所得の減少や不確実性で消費を控えるのか（所得・不確実性効果）は、実証的に結果が割れていた（抄録からの背景）。", "p3": "米国の家計を対象とした調査に情報提供の処置（インフレに関する情報）を組み込み、インフレ予想を外生的に動かす無作為化比較試験を複数回行い、その後の消費、とくに耐久財の支出の変化を比べた（抄録）。", "p4": "低インフレ期と高インフレ期に行った試験で、処置による予想の上昇が耐久財の支出に与える効果の符号と大きさを比べた（抄録）。", "p5": "低インフレ期には、予想の上昇が耐久財の消費を減らした（負の所得・不確実性効果が支配的）。高インフレ期には、予想の上昇が耐久財の支出を急に増やした（異時点間の代替効果が支配的）（抄録）。効果の大きさの数値は抄録に記載がない。", "p6": "抄録の範囲では、試験の時期と規模、消費の測り方（自己申告か実際の支出か）、効果の持続性は確認できない。解釈：二つの環境の比較は時期の違い全体（金利、所得の伸びなど）を含みうる。単著の未査読論文である。", "fun": "「来年は物価が上がる」と聞くと、人は「今のうちに買っておこう」と思うのか、「お金が目減りするから節約しよう」と思うのか。答えは、今の物価上昇が激しいかどうかで逆転しました。同じ情報でも、置かれた状況によって人の反応がひっくり返るという点が、政策の難しさを物語っています。", "unverified": "試験の実施時期・標本数・効果の大きさは未確認。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "LLMは人間以上にランダムに意味を見いだす", "title": "Illusory Pattern Perception Drives Spurious Inference in Large Language Models", "url": "https://arxiv.org/abs/2610.07791", "authors": "Peihua Mai ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Mai, P., Shao, Z., Qiao, X., Zhang, M., Zhou, X., & Pang, Y. (2026). Illusory Pattern Perception Drives Spurious Inference in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07791", "why": "心理学の古典的課題をLLMに適用し、錯覚的なパターン知覚が人間より強いことと、その内部表現を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（課題と評価指標、人間との比較の表1、統制実験の表2、SAEによる特徴分析と内部信号の調整の表4、結論）を読んだ", "preprint": true, "p1": "ランダムなデータに意味のある関係を見いだしてしまう「錯覚的なパターン知覚」がLLMにもあり、多くのモデルで人間より強いことを、心理学の古典的課題で示し、内部表現との関係も調べた（§4–5）。", "p2": "人間の錯覚的パターン知覚（ないところに点と点をつなぐ傾向）はよく知られるが、LLMにもあるか、ある場合にどのような内部の仕組みかは体系的に調べられていなかった（§1）。", "p3": "(1)共同体の相関課題：2つの集団の望ましい行動と望ましくない行動の比率は同じで情報量だけが違う（多数派26文、少数派13文）とき、チームメイトにどちらを選ぶか、(2)投資の相関課題（2社の好材料・悪材料、比率同じで量が違う）、(3)曖昧な出来事の陰謀論的なつながりの評定（1〜7）、の3課題を人間とLLMに与えた（§3.1.2）。中立の基準は選択率0.5・評定4で、少数派を選ぶ確率が0.5を下回るほど錯覚が強い（§3.1.3）。内部はスパース自己符号化器（SAE）で特徴の活性を比べた（§3.2）。", "p4": "人間は課題ごとに100人（Prolific）、LLMはGPT-3.5、GPT-4o、GPT-5、GPT-5.2、Llama、Gemma、Qwenなど9モデルから各100回の回答を集めた。情報量をそろえる、多数派の好材料率を下げる等の統制条件と、特徴ベクトルを注入する内部調整も試した（§4.1、§4.2.3、§4.3.2）。", "p5": "少数派を選んだ割合は人間0.46に対しLLMの平均0.15（31ポイント低い）、投資課題は0.40対0.31で、陰謀論的評定はLLMが人間（4.34）より平均約23.7%高かった（表1、§4.2.1）。多数派の好材料率を実際に低くしても、8設定中7つで少数派の選択は有意に0.5を下回った（表2）。内部調整で共同体課題の少数派選択率は18〜29ポイント上がった（§4.3.2）。", "p6": "本文では限界の詳しい議論は付録に回されている（§5）。解釈：課題が架空の集団・企業の抽象的な選択に限られ、実際の応用場面の判断にどこまで及ぶかは未検証。内部調整はオープンモデル3つでの試行で、回答の質が約5%下がった（§4.3.2）。", "fun": "同じ割合で良いことも悪いことをする二つのグループでも、話題に上る回数が多いグループのほうが「良い人たち」に見えてしまう。人間にもある思い込みですが、AIは人間よりずっと強くこの錯覚に引っかかりました。AIに偏見がないと思い込むのは危険で、むしろ情報の量に流されやすいという点が要注意です。", "unverified": "付録の限界の議論と感度分析（§4.2.2）の詳細は未確認。"}}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "辺への処置でもノードの割付を操作変数に使える", "title": "Network Experiments with Edge Treatments and Node Outcomes", "url": "https://arxiv.org/abs/2610.07363", "authors": "Artem Kuriksha ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Kuriksha, A., & Hung, K. (2026). Network Experiments with Edge Treatments and Node Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07363", "why": "ネットワーク実験で辺レベルの処置効果を、ノードの割付を操作変数としたWald推定量で一致推定できることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（設定、推定量とOLSの偏り、一致性、実データに基づく模擬の表1、結論）を読んだ", "preprint": true, "p1": "SNSの2人の間の通信路のように「辺」にかかる処置の効果を、利用者（ノード）単位の結果で測る実験で、ノードへの無作為割り付けを操作変数として使うWald推定量が全体平均処置効果（GATE）を一致推定できることを示した（§8）。", "p2": "処置は辺単位だが結果は利用者単位で測るため、処置群と対照群の利用者を結ぶ辺では両者が一貫した体験を得られない。辺単位の無作為化では利用者単位の効果を回復できず、利用者が受ける処置の割合（曝露）を説明変数とする回帰（OLS）は偏る（§1、§3）。", "p3": "利用者の一部を標本にして処置・対照に無作為に分け、各辺は端点の処置を受け継ぎ、食い違う辺は無作為に決める。利用者iの曝露H_iは、通信の重みw_ijで加重した処置された辺の割合。割り付けD_iを曝露の操作変数とし、(結果の群差)/(曝露の群差)のWald推定量を使う（§2–3）。割り付けの規則から、どの利用者でも割り付けによる曝露の平均の差（遵守率）が同じになるため、重みが誤って指定されていても一致性が保たれる（補題1）。OLSは曝露の分散で重みづけた平均に収束し、次数の高い利用者を軽く扱う（定理1）。", "p4": "線形の潜在アウトカムと疎なグラフの仮定のもとで一致性と漸近正規性を証明し（§4–5）、オンライン通信サービスの1週間の実際の通信網で、真の相対効果1%を仮定した2万回のモンテカルロ模擬により、Wald、単純な平均差、OLS、ERLの推定値を比べた（§6）。", "p5": "Wald推定量は正しい重みでも誤った重みでも平均0.999%（真値1%）とほぼ偏りがなかった。単純な平均差は0.749%と過小で、OLSは正しい重みで0.964%・0.933%、誤った重みで0.889%・0.908%と偏った（表1）。", "p6": "著者は、隣人の曝露が自分の結果に波及することを除外していること、処置が辺の重み（誰とどれだけ話すか）を変える場合を扱えないこと、グループ通信への拡張を課題として挙げる（§8）。", "fun": "「通話の音質を良くする」新機能は、二人の間の回線にかかります。でも片方だけ新機能のグループ、もう片方は旧機能のグループだと、その回線はどちらにすればよいのでしょう。くじ引きでグループ分けしたこと自体を「道具」として使い、全員に導入したときの効果を正しく推し量る、という統計の工夫が鮮やかです。", "unverified": "§7の実務上の考慮（多群実験、両面プラットフォーム）の詳細は未確認。"}}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "範囲を限った遡及的反実仮想", "title": "Scope-Restricted Backtracking Counterfactuals", "url": "https://arxiv.org/abs/2610.08017", "authors": "Johan de Aguas ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "de Aguas, J., & Jullum, M. (2026). Scope-Restricted Backtracking Counterfactuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08017", "why": "背景条件を変えて説明する遡及的反実仮想の適用範囲を限定する枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "結果を説明するために背景条件のほうを変える「遡及的反実仮想（backtracking counterfactual）」で、変えてよい背景の範囲をモデル作成者が指定できるようにした枠組みを提案した（抄録）。", "p3": "変えてよい外生変数の座標（スコープ）と、世界をまたいだ値の妥当さを決めるカーネルを指定し、一般の推論法、説明クエリの鋭い周辺境界、修正値の方策として表現できる条件を導いた（抄録）。", "p5": "線形ガウスの例でスコープにより説明の種類（局所雑音・祖先・無関係な雑音・実現不能）が変わることを示し、UCI Adultデータでカーネルの指定と感度を例示した（抄録）。", "fun": "「もし雨が降らなかったら」と原因を変えるのが普通の反実仮想ですが、「この結果になったのは、そもそも何が違っていたからか」と過去の条件をさかのぼる考え方もあります。何でもさかのぼって変えてよいとすると説明が甘くなるので、変えてよい範囲を決めるのがこの研究の要点です。", "unverified": "UCI Adultデータでの具体的な数値結果は未確認。"}}, {"id": "pn17", "rank": 17, "field": "因果推論", "headline": "心理学の因果推論で見落とされる一貫性の条件", "title": "Consistency: A Critical but Often Overlooked Requirement for Causal Inference in Psychological Research", "url": "https://doi.org/10.31234/osf.io/3g9za_v5", "authors": "Lukas Junker ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Junker, L., & Grosz, M. P. (2026). Consistency: A Critical but Often Overlooked Requirement for Causal Inference in Psychological Research. https://doi.org/10.31234/osf.io/3g9za_v5", "why": "曖昧な介入概念では因果効果が定義できないという一貫性の要件を、心理学研究に向けて整理した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "心理学で統計的な推定値を因果的に解釈するための基礎条件として「一貫性（consistency）」を取り上げ、その述べ方と確かめ方を整理した（抄録）。", "p3": "関心のある因果量（推定対象）が、効果の異なる処置の版（受け身の閲覧、つらいニュースの閲読、友人との会話など）を一緒くたにしないほど正確に定義されているか、データ中の処置の変化がそれに合っているかの二点を、間接的な実験操作や多次元の構成概念の例で説明した（抄録）。", "p5": "方法論の論文で、実証結果ではなく、交絡やモデル設定より前に推定対象を明示すべきことを示した（抄録）。", "fun": "「SNSの時間は幸福度を下げるか」という問いは、実はあいまいです。ぼんやり眺めるのか、友だちと話すのかで効果は全然違うからです。「何をどう変えたときの効果か」をはっきりさせないと、どんな統計も因果の答えにならない、という基本を思い出させてくれます。", "unverified": "方法論の論文であり、実データの分析結果はない。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "ガウス過程因果モデルで離散結果の反実仮想推論", "title": "Probabilistic Counterfactual Inference for Discrete Outcomes in Gaussian-Process Causal Models", "url": "https://arxiv.org/abs/2610.08689", "authors": "Juliette Sinnott ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Sinnott, J., Karimi, A.-H., & Kohandel, M. (2026). Probabilistic Counterfactual Inference for Discrete Outcomes in Gaussian-Process Causal Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08689", "why": "連続変数に限られていたGP構造因果モデルの反実仮想推論を離散結果に拡張した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "ガウス過程の構造因果モデルで、二値・名義・順序の離散的な結果を含む反実仮想推論を厳密に行う枠組みを作った（抄録）。", "p3": "GPの予測器と明示的な外生雑音の仕組みを組み合わせ、二値は一様閾値、名義はGumbel-max、順序は潜在ガウスの切断点で雑音を逆推定し、介入を通して伝える（抄録）。", "p5": "順序データに名義の結合を当てはめると、観測への当てはまりは同程度でも反実仮想の誤差がおよそ3倍になり、データを増やしても減らなかった（抄録）。", "fun": "「もしこの人が別の治療を受けていたら、結果は何段階になっていたか」を考えるには、見えない偶然の部分を推定し直す必要があります。データへの当てはまりがいくら良くても、偶然の組み立て方を間違えると反実仮想は外れ続けます。当てはまりの良さだけでは選べない、という注意が重要です。", "unverified": "実データへの適用例は抄録になく未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "言語モデルにニューラルネットの重みを読ませる", "title": "Weight Oracles: Reading Neural Network Weights with Language Models", "url": "https://arxiv.org/abs/2610.07334", "authors": "Krishna Kabra ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Kabra, K., Venhoff, C., & de Witt, C. S. (2026). Weight Oracles: Reading Neural Network Weights with Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07334", "why": "入力を与えずに重みから隠れた能力（バックドア等）を読み取る能動的な解釈手法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "言語モデルにニューラルネットの生の重みを直接読ませて、入力を与えて試さなくてもバックドア（隠れた不正な機能）などを診断できる「Weight Oracles」を提案した（抄録）。", "p3": "段階的な課程と、パラメータを使わない演算を決定的なコードに任せる仕組みで、まず小さなTransformerの順伝播を重みから模擬させ、次に重みの異常についての自然言語の質問で診断器を訓練した。学習には無害な異常だけを使った（抄録）。", "p5": "未知の対象で順伝播の模擬は99%の正答率。学習にないバックドアをゼロショットで、注意経由のものはAUROC 0.93、多様な脅威全体では0.81で検出した（抄録）。", "fun": "プログラムの中身を、実行せずに設計図だけ読んで欠陥を見つけるようなものです。普通は怪しい入力を試して反応を見ますが、それでは想定外の仕掛けを見落とします。AIがAIの「脳の配線」を直接読む、という発想が大胆です。", "unverified": "実用規模のモデルへの拡張は未解決の課題とされている（抄録）。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "道具を使うエージェントは証拠なしに行動する", "title": "From Evidence to Action: How Tool-Using Agents Fail", "url": "https://arxiv.org/abs/2610.07753", "authors": "Hongzhan Lin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-07", "apa": "Lin, H., Cao, S., Luo, Z., Chai, W., Lee, M.-L., & Hsu, W. (2026). From Evidence to Action: How Tool-Using Agents Fail (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07753", "why": "ツール利用エージェントの行動が事前の証拠に支えられているかを分析し、失敗の場所を特定した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "外部の状態を変える道具利用型のAIエージェントが、事前に確かめた証拠に基づいて行動しているかを調べ、失敗の多くが実行前の段階で起きることを示した（抄録）。", "p3": "6つの業務領域・5つの手順からなる656事例のSafeActBenchを作り、何の情報をいつ確かめたかを記録する証拠台帳と決定的な軌跡評価器で、10通りのモデル・実行環境を評価した（抄録）。", "p5": "静的な行動判断が良くても、対話的な実行はずっと弱いことがあった。調査を途中でやめる、必要な証拠の前に行動するといった失敗が多く、証拠がそろえば単一行動の実行はおおむね確実だった（抄録）。", "fun": "結果がたまたま正しくても、ちゃんと調べてから行動したとは限りません。AIエージェントの失敗は「手が滑る」より「確かめずに動く」ことに多い、というのは人間の仕事のミスとも似ています。結果ではなく過程を記録して点検する仕組みが鍵です。", "unverified": "モデルごとの具体的な成績は未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "MoE言語モデルの強化学習をFP4で安定化", "title": "TRACE: Rollout-Guided Quantization-Aware Training for FP4 Reinforcement Learning of MoE Language Models", "url": "https://arxiv.org/abs/2610.07767", "authors": "Xin Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-07", "apa": "Wang, X., Yu, H., Zhuge, Z., Mao, B., Li, Z., Feng, J., Luo, Y., Zhang, Y., Cao, Y., Zhang, M., Liu, D., & Zhang, J. (2026). TRACE: Rollout-Guided Quantization-Aware Training for FP4 Reinforcement Learning of MoE Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07767", "why": "ロールアウトを低精度化した強化学習の不安定さを、量子化を意識した学習で抑えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "MoE型の大規模言語モデルの強化学習で、文章生成（ロールアウト）を4ビット浮動小数点（FP4）にしても性能を落とさない量子化の枠組みTRACEを提案した（抄録）。", "p3": "ロールアウト側の量子化結果を使って学習側のFP4の丸めを決める量子化考慮学習で、学習とロールアウトの食い違いを直接減らし、深い層の仮数とスケール情報だけを保存して通信量を抑えた（抄録）。", "p5": "4つの大規模MoEモデルで、BF16のロールアウトと同等の性能を保ちつつ、ロールアウトを最大5.4倍速くした（抄録）。", "fun": "AIの強化学習では、AIに答えを大量に書かせる部分が一番時間を食います。そこを荒い数（4ビット）で計算すると速くなりますが、練習と本番で計算が食い違って学習が崩れます。本番の結果を見て練習の丸め方を合わせる、という調整が工夫です。", "unverified": "対象の4モデルの名前と課題ごとの成績は未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "階層的な推論報酬の強化学習のミニマックス最適率", "title": "Reinforcement Learning for Hierarchical Reasoning Rewards: Minimax-Optimal Rates with Transformers", "url": "https://arxiv.org/abs/2610.08561", "authors": "Naoki Nishikawa ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Nishikawa, N., & Suzuki, T. (2026). Reinforcement Learning for Hierarchical Reasoning Rewards: Minimax-Optimal Rates with Transformers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08561", "why": "推論タスクの強化学習をTransformerで行うときの統計的な最適収束率を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "言語モデルの推論の強化学習で、オンポリシーの探索とニューラル報酬モデルの組み合わせがなぜ効くのかを、ミニマックス最適な収束率として理論的に示した（抄録）。", "p3": "報酬を、前の要素が解けて初めて意味を持つ無数の局所成分からなる階層的な関数としてモデル化し、Transformerの批評家を使うactor-critic型の手法を解析した（抄録）。", "p5": "この手法は問い合わせ回数と正則化の強さについて対数因子を除きミニマックス最適な率を達成する一方、固定の参照分布から標本を取る方法では後悔の減少が対数的な速さに限られることを証明した（抄録）。", "fun": "難しい問題は、前の段階が解けて初めて次が意味を持つ、という階段のような構造をしています。今の自分の答えから探索すると、報酬のある場所へ少しずつズームインできるので効率が良い、ということを数学的に示しました。経験上うまくいく方法に理由を与えた研究です。", "unverified": "理論の仮定がどの程度実際の推論課題に当てはまるかは未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "事前学習済み拡散表現から識別可能な世界モデル", "title": "Identifiable World Models from Pretrained Diffusion Representations", "url": "https://arxiv.org/abs/2610.07028", "authors": "Ruchi Sandilya ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Sandilya, R., Liston, C., & Grosenick, L. (2026). Identifiable World Models from Pretrained Diffusion Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07028", "why": "予測精度ではなく、潜在座標が真の状態を復元する識別可能性を保証する世界モデルを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "事前学習済みの拡散モデルを再学習せずに、その潜在表現に、真の状態変数と因果構造を復元できる（識別可能な）座標を与える方法ConDAを示した（抄録）。", "p3": "凍結した拡散モデルの潜在表現の上に軽い整合写像だけを学習し、補助変数つき非線形独立成分分析（TCL・GCL）の識別性の保証を移す（抄録）。", "p5": "物理・ロボットの動画系で、TCLとGCLはほぼ完全な状態の復元と競争力のある遅れ付きグラフの復元を達成し、落下物体の模擬系では厳密に復元した（抄録）。", "fun": "映像を上手に予測できるAIでも、頭の中の変数が「位置」や「速度」に対応しているとは限りません。この研究は、すでにあるAIの中身を作り直さずに、物理的に意味のある座標に読み替える方法を示しました。予測できることと理解していることの差を埋める試みです。", "unverified": "実写映像への適用の程度は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "答えられない質問を見抜く内部信号の汎化", "title": "Knowing When Not to Answer: Cross-Domain and Multi-Turn Generalization of Latent Underspecification Signals", "url": "https://arxiv.org/abs/2610.08413", "authors": "Jerzy Kami\\'nski ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Kamiński, J., Galyukshev, I., Kuznetsov, A., Fedorov, D., Redko, K., Chuprin, S., Shumbalov, A., Chumakov, S., & Kalyuzhnaya, A. (2026). Knowing When Not to Answer: Cross-Domain and Multi-Turn Generalization of Latent Underspecification Signals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08413", "why": "回答不能性を表す内部表現が、分野や多ターン対話をまたいで汎化することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMが答えられない質問に答えてしまう問題で、内部状態から「答えられなさ」を読み取る探査器（プローブ）が、データや多ターン対話をまたいでどこまで通用するかを調べた（抄録）。", "p3": "423会話・1,661のターン状態にラベルを付けた多ターンのベンチマークと、確認質問に答える模擬利用者を作り、6データセット・6つのオープンモデルで検証した（抄録）。", "p5": "情報不足という共通の根拠を持つデータ間ではよく移った（数学でAUROC 0.77–0.97）。プローブで確認を挟む仕組みは偶然よりずっと正確に働いたが、通常の生成を確実には上回らなかった（抄録）。", "fun": "AIは「それだけでは答えられません」と言うのが苦手です。実はAIの内部には「情報が足りない」という信号があり、外から読み取れます。ただ、読み取れても確認の質問をした後の使い方が下手で、成果に結びつかないという結果が面白いところです。", "unverified": "モデルごとの成績の詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "外部ガイド付きGRPOがいつ効くかを偏り-分散で説明", "title": "When Does External Guidance Help LLM Reasoning? A Bias-Variance Theory of Guidance-Augmented GRPO", "url": "https://arxiv.org/abs/2610.06861", "authors": "Sofia Torres ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Torres, S., Almeida, G., Adams, C., & Rocha, C. (2026). When Does External Guidance Help LLM Reasoning? A Bias-Variance Theory of Guidance-Augmented GRPO (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06861", "why": "検証可能報酬による強化学習で外部の模範解答を混ぜる効果を、偏りと分散の理論で整理した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "検証可能な報酬による強化学習（GRPO）に外部の手本などを混ぜる諸手法を一つの理論にまとめ、収束率・偏りの上界・最適な混ぜる重みを導いた（抄録）。", "p3": "外部ガイダンスを質問分布を書き換える確率的な作用素とみなし、方策勾配推定量の偏りを分布のずれで上から抑え、平均二乗誤差を最小にする重みを閉形式で求め、下界も示した（抄録）。", "p5": "収束率はO(1/√T)。Qwen2.5-Math-7B-Baseで9つの数学・分布外ベンチマークにおいて、最適重みの手法は既存法と同等以上で、GPU時間は31%少なかった（抄録）。", "fun": "AIに数学を練習させるとき、模範解答をどれだけ見せるかは悩みどころです。見せすぎると自分で考えなくなり、見せなさすぎると上達が遅い。その「ちょうど良い見せ方」を式で出したのがこの研究で、勉強法の理論のようで面白いです。", "unverified": "理論の仮定（滑らかさ・ずれの有界性）の現実的な妥当性は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "AIエージェントだけで回る会社の模擬環境", "title": "MiniCorp: The Last Mile of the AI Agent Firm", "url": "https://arxiv.org/abs/2610.05912", "authors": "Jingying Zeng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-07", "apa": "Zeng, J., Dai, Z., Li, J., Shin, C., Zhang, D., Lu, Y., He, Q., Wang, D., & Chang, K.-W. (2026). MiniCorp: The Last Mile of the AI Agent Firm (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.05912", "why": "企業運営を担うエージェントの訓練に必要な長期の企業データを模擬環境で作る試み。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "AIエージェントが集団で会社を運営する様子を模擬し、意思決定と結果の長期データや反実仮想データを大量に生成できるオフィス模擬環境MiniCorpを作った（抄録）。", "p3": "電子商取引の会社を例に、顧客・競合・市場の外部世界と、議論して戦略を決めるエージェントの内部世界をつなぎ、通信と決定を記録し、チェックポイントから別の決定で再実行できるようにした（抄録）。", "p5": "実際の市場の実証研究で報告されたパターンと照らして忠実度を評価し、エージェントが役割をまたいで協調し市場の反応に合わせて決定を変えることを示した（抄録）。", "fun": "会社の記録には「実際にやったこと」しか残らず、「別の選択をしていたら」はわかりません。模擬の会社なら、同じ場面を巻き戻して別の決断を試せます。歴史の「もしも」を実験できる箱庭を作った、と考えると面白い研究です。", "unverified": "忠実度の評価の具体的な指標と数値は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "外部研究の反復測定で測定誤差を補正するデータ融合", "title": "Data Fusion for Errors-in-Variables", "url": "https://arxiv.org/abs/2610.07048", "authors": "Huali Zhao ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Zhao, H., Liu, M., & Wang, T. (2026). Data Fusion for Errors-in-Variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07048", "why": "対象研究に誤差のある代理変数しかない場合に、外部データを融合して識別・推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "対象研究には誤差のある代理変数が1つしかないとき、別集団の外部研究の反復測定を融合して、測定誤差を補正する推定法Fuse-EIVを作った（抄録）。", "p3": "集団間の違いがあっても外部の反復測定を使えるようにする条件付きの移転可能性の仮定を置き、条件付きの逆畳み込み、柔軟な局外推定、直交補正を組み合わせた推定量とその漸近理論を示した（抄録）。", "p5": "シミュレーションで主要な係数の偏りは小さく、米国国民健康栄養調査（NHANES）への適用で、集団の違いと誤差の不均一性を考えると結論が変わりうることを示した（抄録）。", "fun": "体重計の誤差を知るには何度も量り直すのが一番ですが、自分のデータでは1回しか量っていないことがあります。そこで、別の人たちが何度も量ったデータを借りて誤差の大きさを推定します。ただし集団が違えば誤差も違うので、その違いをどう調整するかが要点です。", "unverified": "NHANESでの具体的な結論の変化は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "結果の欠測下で因果推論に向いた表現を協調学習", "title": "Collaborative representations for targeted causal inference under outcome selection", "url": "https://arxiv.org/abs/2610.08073", "authors": "Johan de Aguas", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "de Aguas, J. (2026). Collaborative representations for targeted causal inference under outcome selection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08073", "why": "予測精度の高い傾向スコアが因果推定を悪化させる問題を、目的に合わせた表現学習で改善した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "結果に欠測がある因果推論で、処置と欠測のモデルを「推定対象に役立つ低次元表現」として協調的に学習するターゲット学習法を提案した（抄録）。", "p3": "交差適合の擬似アウトカムから処置・選択の表現を学び、候補のライブラリでアウトカムの更新と表現の更新を交互に行い、目的に合ったリスクで複雑さを選ぶ（抄録）。", "p5": "協調的な頑健性・一致性・漸近線形性の十分条件を示し、シミュレーションで有限標本での偏りの減少と偏り-分散のトレードオフを示した（抄録）。", "fun": "「誰が治療を受けやすいか」をよく当てる予測モデルが、かえって因果効果の推定を悪くすることがあります。当てることと、効果を正しく測るのに必要なことは違うからです。目的に合わせて予測の中身を作り変える、という発想が肝です。", "unverified": "実データへの適用は抄録になく未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "計数データのための脱バイアス機械学習", "title": "Debiased Machine Learning for Count Data: a Partially Linear Poisson Model Based on Neural Networks", "url": "https://arxiv.org/abs/2610.07500", "authors": "Ningkun Zhou ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Zhou, N., Shepherd, B. E., & Xiang, Q. (2026). Debiased Machine Learning for Count Data: a Partially Linear Poisson Model Based on Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07500", "why": "部分線形ポアソンモデルにニューラルネットを組み込んだDML推定量を開発した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "回数などの計数データについて、二値の処置の効果を、ニューラルネットで共変量を柔軟に扱いながら偏りなく推定する脱バイアス機械学習（DML）の推定量を開発した（抄録）。", "p3": "部分線形ポアソンモデルの局外関数をニューラルネットで推定し、ネイマン直交スコアと交差適合で偏りを抑え、閉形式の分散推定とWald信頼区間を導いた。Rパッケージで実装（抄録）。", "p5": "多くの設定で一般化線形モデルやAIPWより偏りとRMSEが小さく、被覆確率は名目値に近かった。合成のHIVコホート（7,141人）に適用した（抄録）。", "fun": "病院に行った回数のような「数えるデータ」は、平均や差の扱いに特別な注意が要ります。機械学習で複雑な背景をうまく吸収しつつ、効果の推定には偏りが入らないように工夫するのがDMLです。それを計数データ向けに作り直した、実用的な研究です。", "unverified": "偏り・RMSEの改善の具体的な数値は未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "オンライン実験の証拠収集・検定・推定を同時最適化", "title": "Design-Driven Inference for Online Experiments: Jointly Optimal Evidence Collection, Testing, and Estimation", "url": "https://arxiv.org/abs/2610.07831", "authors": "Jun Yu ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Yu, J., Wenbiao, Zhao, Lixing, & Zhu. (2026). Design-Driven Inference for Online Experiments: Jointly Optimal Evidence Collection, Testing, and Estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07831", "why": "継続監視下の多因子実験で、早期停止と効果推定の精度を両立させる設計を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "オンラインの多因子実験で、継続監視しながら効果がないときは早く止め、効果の推定精度も保つ、配分と証拠の規則を同時に設計する枠組みを示した（抄録）。", "p3": "局外のブロック効果と交互作用がある多因子実験で、ブロック直交設計が局外の混入を除くことを示し、等方的な配分と放射状のe値の組合せが方向未知の対立仮説に対しミニマックス率最適であることを導いた（抄録）。", "p5": "同じ配分が最尤推定についてA・D・E最適を同時に満たし、検定と推定の二重の最適性を示した。シミュレーションとLLMのプロンプト実験で停止効率と推定精度の向上を示した（抄録）。", "fun": "ネットのA/Bテストでは、結果を毎日のぞき見たくなりますが、のぞくたびに判断を誤る危険が増えます。いつ見ても正しい判断ができる証拠の積み上げ方と、どの組合せに何人割り当てるかを一緒に設計すると、両方うまくいくという結果です。", "unverified": "LLMプロンプト実験の具体的な改善幅は未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "代理指標選びでは相関した標本誤差が情報になる", "title": "The Noise Is the Signal: Correlated Sampling Error Is Rank-Informative for Proxy Metric Selection", "url": "https://arxiv.org/abs/2610.08194", "authors": "Sandro Provenzano", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Provenzano, S. (2026). The Noise Is the Signal: Correlated Sampling Error Is Rank-Informative for Proxy Metric Selection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08194", "why": "A/Bテストの代理指標の選択で、雑音と見なされてきた相関誤差が順位の情報を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "A/Bテストの代理指標を選ぶとき、代理指標と最終指標の推定誤差が相関している部分は、除くべき雑音ではなく、指標の良さの順位を示す情報だと示した（抄録）。", "p3": "各実験の顧客を無作為に半分ずつに分けて二つの効果を別々に推定し、共有誤差のない一致度を測った。262実験・69の代理指標候補の記録と、記録に合わせたシミュレーションで比べた（抄録）。", "p5": "共有誤差による順位は真の一致度による順位と似ていた（スピアマン相関0.65）。補正で共有誤差を除くほど順位は悪化し、留保した実験での予測された順序の再現はスピアマン相関0.93だった（抄録）。", "fun": "「雑音だから消そう」とした部分に、実は答えのヒントが含まれていた、という逆転の発見です。同じお客さんで二つの数字を測ると誤差がそろって動きますが、そのそろい方自体が指標同士の似ていることを反映していました。消す前に中身を見よ、という教訓です。", "unverified": "どの業界・企業の実験記録かは抄録からは未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "因果データ融合でギフトカード施策の上乗せ収益を測る", "title": "Measuring Gift Card Program Incrementality via Causal Data Fusion", "url": "https://arxiv.org/abs/2610.08558", "authors": "Justin Whitehouse ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Whitehouse, J., Betz, W., Zhang, Y., Coles, P., Johari, R., & Syrgkanis, V. (2026). Measuring Gift Card Program Incrementality via Causal Data Fusion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08558", "why": "複数データを融合して販促施策の増分効果とチャネル別の寄与を推定した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "ギフトカード施策がどれだけ追加の売上を生んだかを、大きな観察データと別集団の小さな実験データを融合して推定する方法を作り、Airbnbに適用した（抄録）。", "p3": "カードの保有は購入時にしか観測されず処置状態が打ち切られる問題に対し、購入の決定に対する条件付きの相対効果が二集団で共通という移転可能性の条件を置き、機械学習による推定量とその漸近正規性を示した（抄録）。", "p5": "第三者経由のチャネルは自社チャネルより上乗せ効果が大きく、自分用にカードを買ったとみられる「自己贈与者」は全体より上乗せ効果が大きかった（抄録）。", "fun": "ギフトカードをもらった人が使ったお金は、カードがなくても使ったお金かもしれません。本当に増えた分を知るには「もらわなかった場合」を推定する必要があります。観察データと実験データのいいとこ取りでそれを測る、実務に直結した因果推論です。", "unverified": "上乗せ収益の具体的な金額・比率は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "中国国有企業の民営化は技術変化を偏らせた", "title": "Ownership and Non-Neutral Technological Change: Evidence from China's State-Owned Enterprise Privatization", "url": "https://arxiv.org/abs/2610.08729", "authors": "Ziyao Wang", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Wang, Z. (2026). Ownership and Non-Neutral Technological Change: Evidence from China's State-Owned Enterprise Privatization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08729", "why": "資本・労働・中間財ごとの生産性を企業別に推定し、民営化の効果が要素間で異なることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "中国製造業（1998〜2008年）で資本・労働・中間財それぞれを増強する生産性を企業別に推定し、国有企業の民営化が要素ごとに異なる効果を持つことを示した（抄録）。", "p3": "企業レベルで要素増強的な生産性を推定し、民営化前後の変化を比べた（抄録）。", "p5": "技術変化は資本と労働に強く偏っていた。民営化は移行直後に労働増強的生産性を高めたが、全期間では薄れ、1998年からの既存企業では持続した。資本は上がらず、中間財はやや下がった（抄録）。", "fun": "「民営化すると効率が上がる」と一言で言いがちですが、どの面の効率かで答えが違いました。人の使い方は良くなっても、機械や材料の使い方はそうでもありません。生産性を一つの数字でなく、要素ごとに分けて見ることで初めて見える姿です。", "unverified": "効果の大きさ（数値）は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "NFLの手の大きさ9インチ基準は市場で淘汰されない", "title": "Rules of Thumb in High-Stakes Labor Markets: Evidence from NFL Scouting Thresholds", "url": "https://doi.org/10.2139/ssrn.7571342", "authors": "Spencer Barnes ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Barnes, S., Mendez, B., & Dischman, T. (2026). Rules of Thumb in High-Stakes Labor Markets: Evidence from NFL Scouting Thresholds. https://doi.org/10.2139/ssrn.7571342", "why": "採用での機械的な足切り基準が競争的な労働市場でも残ることを、閾値の不連続で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "NFLのワイドレシーバーの「手の大きさ9インチ」という採用の目安が、成績に差がないのに大きな賃金差を生み、市場でも是正されないことを示した（抄録）。", "p3": "9インチの閾値の前後を比べる回帰不連続の考え方で、採用の経験則が賃金と成績に与える因果効果を推定した（抄録）。", "p5": "閾値をわずかに上回る選手は1契約あたり2,060万ドル多く稼ぐが、成績に不連続はなかった。賃金の上乗せはベテラン契約で3倍、評価能力の低いチームで2倍になった（抄録）。", "fun": "「手が9インチ以上なら合格」という、根拠のはっきりしない基準が、情報が豊富で競争の激しいプロスポーツの世界でも、選手の年俸を大きく左右し続けています。8.9インチと9.0インチの選手の実力は同じなのに、という点が衝撃的です。", "unverified": "標本の選手数と推定の信頼区間は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "LLMは家計の経済行動をどこまで予測できるか", "title": "HouseholdBench: Evaluating Large Language Models as Predictors of Household Economic Behavior", "url": "https://arxiv.org/abs/2610.07563", "authors": "Jin Huang ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Huang, J., Garrucho, D. F., Xie, Y., Yuan, W. M., Mei, Q., Lian, C., & Hazell, J. (2026). HouseholdBench: Evaluating Large Language Models as Predictors of Household Economic Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07563", "why": "多様な調査から家計の意思決定を予測するLLMの評価ベンチマークを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMが家計の経済行動（消費・所得・労働・予想・住宅）や政策変化への反応をどこまで予測できるかを測るベンチマークHouseholdBenchを作った（抄録）。", "p3": "米国の6つの家計調査から32の予測課題を作り、過去の行動・属性・マクロ経済条件を与えて、13のLLMを「変化なし」の基準と勾配ブースティング木と比べた（抄録）。", "p5": "多くのLLMは「変化なし」を上回り、最良のモデルは数値結果の誤差を12.2%減らした。ただし多くの課題で勾配ブースティング木が1位だった。40億パラメータのモデルも微調整と16回予測の集約で商用モデルに並んだ（抄録）。", "fun": "AIに「この家族は来年いくら使うか」を当てさせると、何も変わらないと仮定するよりは良いものの、昔ながらの機械学習（決定木）にはまだ勝てません。小さなAIでも何度も答えさせて平均すると強くなる、という「三人寄れば文殊の知恵」的な結果も面白いところです。", "unverified": "課題ごとの各モデルの成績は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "異なる純粋戦略均衡の厚生値は一般に一致しない", "title": "No Welfare Ties Between Pure-Strategy Nash Equilibria", "url": "https://arxiv.org/abs/2610.08661", "authors": "Moeen Nehzati", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Nehzati, M. (2026). No Welfare Ties Between Pure-Strategy Nash Equilibria (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08661", "why": "豊かなゲームのクラスで、異なるナッシュ均衡の功利的厚生が典型的に異なることを証明した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "十分に豊かなゲームのクラスでは、異なる純粋戦略ナッシュ均衡の功利的厚生（利得の合計）は典型的に異なり、厚生を最大にする均衡は存在すれば一意であることを証明した（抄録）。", "p3": "開いた戦略集合を持つC²級のゲームで、任意の二つの戦略の組で利得の値と一階微分を独立に動かせる有限次元の摂動族（例えば3次以下の多項式）がある場合を「豊か」と定義し、「典型的」を一般的かつ有限的に優勢な意味で示した（抄録）。", "p5": "結果は微分がゼロにならない利得の集約関数に拡張され、任意の基本ゲームに小さな摂動を加えればほとんどすべての摂動で厚生が分離する（抄録）。", "fun": "ゲームに複数の「落ち着きどころ（均衡）」があるとき、どれを選ぶべきかは難問です。この研究は、ほとんどの場合、みんなの幸せの合計がぴったり同じになる均衡は存在しないと示しました。だから「合計が一番大きいもの」という選び方は普通は一つに決まる、というわけです。", "unverified": "数学的な証明の詳細は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "貿易戦争は経営者のインセンティブを弱める", "title": "Managerial Incentives and the Cost of Protectionism&nbsp;", "url": "https://doi.org/10.2139/ssrn.7571165", "authors": "Cristina Tello-Trillo ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Tello-Trillo, C., & Medina, P. (2026). Managerial Incentives and the Cost of Protectionism&nbsp; https://doi.org/10.2139/ssrn.7571165", "why": "異質企業の貿易モデルに依頼人-代理人問題を入れ、保護主義が経営努力を通じて生産性を下げる経路を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "貿易戦争は経営者のインセンティブを弱めることで企業の生産性を下げ、その経路を無視すると貿易戦争の産出のコストの約5分の4を見落とすと示した（抄録）。", "p3": "異質企業の2国貿易モデルに、所有者が経営者に費用削減の報酬を払う依頼人-代理人問題を組み込み、米国製造業のCEO・企業のマッチデータで予測を確かめ、モデルを推定した（抄録）。", "p5": "インセンティブ報酬は企業の生産性に対し山形で、関税への反応は主に米国輸出企業が海外で受ける関税から生じた。推定モデルでは貿易戦争で生産性が6.5%、産出が5%低下した（抄録）。", "fun": "関税の応酬は、モノの値段だけでなく「社長のやる気の出させ方」まで変えてしまう、という話です。輸出で稼ぐ企業では成功報酬の魅力が下がり、経営努力が減ります。目に見えにくい組織の中の変化が、経済全体の損失の大部分を占めるという指摘が意外です。", "unverified": "CEO・企業データの標本規模は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "年齢層別の物価指数で世代間のインフレ負担を比較", "title": "Who Pays More? Age-Cohort-Specific Inflation Rates and Generational Inequality in the United States, 2000-2024", "url": "https://doi.org/10.2139/ssrn.7564464", "authors": "Felix Nikolas Prehn", "venue": "SSRN", "date": "2026-10-06", "apa": "Prehn, F. N. (2026). Who Pays More? Age-Cohort-Specific Inflation Rates and Generational Inequality in the United States, 2000-2024. https://doi.org/10.2139/ssrn.7564464", "why": "米国の年齢層別物価指数を作り、2000〜2024年のインフレ負担の世代差を測った。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "米国で年齢層別の物価指数（2000〜2024年）を作ると、若年層と高齢層ほどインフレの負担が大きいU字型になることを示した（抄録）。", "p3": "消費者支出調査の6つの年齢層の支出割合と、CPI-Uの7つの構成指数から、2000年基準のラスパイレス指数などを計算し、世代の公平性を検討した（抄録）。", "p5": "2024年の指数は全品目CPI-Uを9.1ポイント（25〜34歳）〜12.3ポイント（65歳以上）上回った。若者は住居と教育、高齢者は医療が主因。4つの出生コホートの年率インフレは2.72〜2.79%で、全体の2.53%より高かった（抄録）。", "fun": "物価上昇率は一つの数字で発表されますが、人によって買う物が違うので、感じるインフレも違います。家賃や学費を払う若者と、医療費のかかる高齢者が一番割を食っているという結果は、「平均」の陰に隠れた世代間の不公平を見せてくれます。", "unverified": "本文の各種の頑健性検査の詳細は未確認。"}}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "職歴データで見る企業間のAI人材の流れ", "title": "Understanding Interfirm AI Talent Flow Networks through Online Professional Profiles", "url": "https://arxiv.org/abs/2610.08264", "authors": "Donghang Li ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Li, D., Zheng, Y., Prakash, A., Wang, S., & Zhao, J. (2026). Understanding Interfirm AI Talent Flow Networks through Online Professional Profiles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08264", "why": "AI能力を企業内の資源ではなく、労働移動で企業間を流れるものとしてネットワークで分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "58か国の約5億3,500万件の雇用記録から、2010〜2022年の企業間のAI人材の移動ネットワークを再構成し、ネットワーク上の位置が企業価値と関連することを示した（抄録）。", "p3": "AI人材の流入の集中度、中心的な位置の入れ替わりを一般の労働移動と比べ、ネットワーク中心性と企業価値の関係を、規模・資産・固定効果を考慮した回帰とイベントスタディで分析した（抄録）。", "p5": "AI人材の流入は少数の先導企業に集中しつつあるが、中心的な位置は非AIのネットワークよりずっと頻繁に入れ替わった。中心性の急上昇の後、類似企業より企業価値が高くなった（抄録）。", "fun": "AIの強さは「何人の専門家を抱えているか」だけでなく、「人材の流れの中でどこにいるか」で決まる、という見方です。人が出入りする交差点にいる企業ほど価値が上がります。しかもその交差点の主役はよく入れ替わるので、まだ逆転のチャンスがあります。", "unverified": "企業価値との関連の大きさ（係数）は未確認。"}}, {"id": "pn40", "rank": 40, "field": "経済学", "headline": "研究の共同は生産性の結果であって原因ではない", "title": "Causal asymmetry suggests productivity underlies scientific collaboration", "url": "https://arxiv.org/abs/2610.08477", "authors": "Diego A. Frota ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Frota, D. A., Filho, C. I. N. S., Ribeiro, V. H., Luz, G. F. C., Carmona, H. A., Perc, M., Ribeiro, H. V., & Andrade, J. S. (2026). Causal asymmetry suggests productivity underlies scientific collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08477", "why": "ブラジルの研究者2万6千人の経歴から、生産性と共同研究の因果の向きを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "ブラジルの研究者26,876人の経歴から、「生産性が共同研究を生む」向きの方が「共同研究が生産性を生む」向きよりデータに合うことを示した（抄録）。", "p3": "論文の総数と異なる共著者の数について、条件付き分布と分布構造の非対称性に基づく因果探索の枠組みと代理データの検定で、生成の向きを判断した（抄録）。", "p5": "生産性を条件とした共同研究は幾何モデルに合う規則的な平均-分散関係を示し、逆向きは一貫しなかった。論文数の不平等はキャリアとともに広がったが、共著者数の不平等は広がらなかった（抄録）。", "fun": "「たくさん共同研究するから論文が増える」のか、「論文をたくさん書く人に共同研究の誘いが来る」のか。鶏と卵のような問題に、分布の形の非対称さから向きを読み取る方法で挑みました。答えは後者寄りで、成果が人脈を呼ぶようです。", "unverified": "分野別の結果の詳細は未確認。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "管理者がAIを持つと部下の努力と判断はどう変わるか", "title": "How Does AI in Managers' Hands Shape Employee Effort and Decision Performance?", "url": "https://doi.org/10.2139/ssrn.7566141", "authors": "Yinglin Ruan ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Ruan, Y., Lu, T., Song, P., Zhang, Y., & Long, J. (2026). How Does AI in Managers’ Hands Shape Employee Effort and Decision Performance? https://doi.org/10.2139/ssrn.7566141", "why": "部下が情報を集め上司が決める階層的な意思決定で、上司側のAI利用の影響を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "AIの推奨を管理者だけに与える設計（門番型AI）が、現場の従業員の努力を高め、調達の費用削減と時間短縮をもたらすことを実地介入で示した（抄録）。", "p3": "2,051件の調達での実地介入と、対応する過去の記録、聞き取りを組み合わせた混合研究法で、エージェンシー理論と説明責任の理論から分析した。後に同じ推奨を従業員にも示す介入も行った（抄録）。", "p5": "門番型AIは従業員の努力と費用削減を高め、従業員の作業時間は延びたが全体の調達時間は短くなった。推奨を従業員にも開示すると、努力と費用削減の効果は弱まった（抄録）。", "fun": "上司だけがAIの「答え」を持っていると、部下は「ちゃんと説明できるように」と頑張ります。ところが部下にもAIの答えを見せると、AIに頼って手を抜いてしまう。AIを誰に持たせるかという配置の設計で、組織の働き方が変わるという面白い結果です。", "unverified": "費用削減の具体的な数値は未確認。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "規制当局への大量提出という新しいロビー戦略", "title": "Spamming the Regulator: Exploring A New Lobbying Strategy in EU Competition Procedures", "url": "https://doi.org/10.2139/ssrn.7558218", "authors": "Helena Malikova ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Malikova, H., Bryson, J., Jugl, M., Lowe, W., Pagel, W., Garcia Jimenez, M. C., & Salendres, J. P. (2026). Spamming the Regulator: Exploring A New Lobbying Strategy in EU Competition Procedures. https://doi.org/10.2139/ssrn.7558218", "why": "EU競争法の手続きで、企業が大量の文書提出で規制判断に影響する戦略を探った。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "EUの競争当局の合併審査で、企業が経済専門家の評価書を戦略的に大量提出して当局の処理能力を圧迫する「規制当局へのスパム」という新しいロビー戦略を見いだした（抄録）。", "p3": "2005〜2020年のEUの複雑な合併案件すべてからなる独自データを量的・質的に分析した（抄録）。", "p5": "この戦略が用いられている証拠と、民間の当事者の間で学習が進んでいる可能性を示し、規制の実効性を保つ対策を提案した（抄録）。", "fun": "審査をする役所にも人手と時間の限りがあります。そこへ大量の資料を送りつけて手が回らなくさせ、甘い判断を引き出そうとする、いわば「物量作戦」です。規則を破らずに制度の弱点を突く行動を、データで初めて捉えた点が面白いところです。", "unverified": "効果の大きさや分析した案件数は未確認。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "技術の地政学ショック下での研究開発網の再編", "title": "Navigating Tech-geopolitical Shocks: How EMNEs Reconfigure Global R&D Networks for Innovation Resilience", "url": "https://doi.org/10.2139/ssrn.7577099", "authors": "Zaiyang Xie", "venue": "SSRN", "date": "2026-10-07", "apa": "Xie, Z. (2026). Navigating Tech-geopolitical Shocks: How EMNEs Reconfigure Global R&D Networks for Innovation Resilience. https://doi.org/10.2139/ssrn.7577099", "why": "技術デカップリングを受けた新興国多国籍企業が研究開発ネットワークを組み替え、革新性を保つ過程を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "技術制裁を受けた中国企業が、友好国・革新国へ研究開発の拠点を移し、国を分散させることで、イノベーションの成果を高めたことを示した（抄録）。", "p3": "2016〜2022年の中国上場企業を対象に、技術制裁後の研究開発ネットワークの再編（関係の論理・空間の論理）とイノベーション成果の関係を分析した（抄録）。", "p5": "再編はイノベーションの成果と長期の成長を高めたが、質には有意な影響がなかった。国有企業は友好国との協力を、海外の研究開発経験の多い企業は分散を選びやすかった（抄録）。", "fun": "技術を締め出されると企業は弱るはずですが、研究の拠点を組み替えることで、ある程度は立ち直れるという結果です。ただ、特許の数は増えても質は上がっていません。量と質を分けて見ると、制裁への対応の限界も見えてくるのが興味深い点です。", "unverified": "標本の企業数と効果の大きさは未確認。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "差別化ベルトラン複占でのCSRと顧客志向", "title": "Corporate Social Responsibility and Customer Orientation in a Bertrand Duopoly with Differentiated Products", "url": "https://doi.org/10.2139/ssrn.7563958", "authors": "Kazuhiro Ohnishi", "venue": "SSRN", "date": "2026-10-06", "apa": "Ohnishi, K. (2026). Corporate Social Responsibility and Customer Orientation in a Bertrand Duopoly with Differentiated Products. https://doi.org/10.2139/ssrn.7563958", "why": "企業の社会的責任と顧客志向の戦略的効果を価格競争モデルで分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "製品が差別化された価格競争（ベルトラン複占）では、企業の社会的責任（CSR）も顧客志向も利益を増やさないことを理論的に示した（抄録）。", "p3": "二つの企業がまずCSRか顧客志向かの文化を選び、次にその水準を決め、最後に価格で競争する3段階のゲームを分析した。数量競争（クールノー）の先行研究を拡張した（抄録）。", "p5": "数量競争の場合と違い、価格競争ではCSRも顧客志向も利益を増やさず、すべての消費者や自社の顧客だけを気にかける動機は消えた（抄録）。", "fun": "「社会に優しい会社は得をする」という話は、競争の形しだいで成り立たないことがあります。生産量で競うときはCSRが戦略的に効いても、値段で競うときは効かないのです。同じ善意でも、ゲームのルールで結果が変わるという経済学らしい洞察です。", "unverified": "モデルの仮定（需要関数の形など）の詳細は未確認。"}}, {"id": "pn45", "rank": 45, "field": "組織行動・心理的安全性", "headline": "駐在管理者の頻繁な交代が心理的安全性を損なう", "title": "The Cost of Constant Change: Expatriate Rotation and the Erosion of Psychological Safety in a Chinese Fintech's Nigerian Subsidiary", "url": "https://doi.org/10.2139/ssrn.7563980", "authors": "Youfu Wu", "venue": "SSRN", "date": "2026-10-06", "apa": "Wu, Y. (2026). The Cost of Constant Change: Expatriate Rotation and the Erosion of Psychological Safety in a Chinese Fintech’s Nigerian Subsidiary. https://doi.org/10.2139/ssrn.7563980", "why": "管理者の交代頻度が役割の不確実性を通じて心理的安全性と定着を下げる仕組みを、事例から提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "中国系フィンテック企業のナイジェリア子会社で、駐在管理者の頻繁な交代が役割の不確実性を通じて現地従業員の心理的安全性を損ない、離職などを招く仕組みを提案した（抄録）。", "p3": "8か月で3人の上司の下で働き退職した一人の従業員の詳しい事例と、13部門・15か月の部門別データから、不確実性減少理論と心理的安全性に基づく2段階のモデルを立てた（抄録）。", "p5": "提案した傾向は契約社員では明確だったが正社員では見られなかった。統計的な検証ではなく概念的・例示的な研究である（抄録）。", "fun": "上司が数か月ごとに替わると、何を期待されているのかわからなくなり、意見を言いにくくなります。会社の不安定さの一部は外の市場ではなく、社内の人事のやり方が生んでいるという指摘です。交代のたびの丁寧な説明が安上がりな対策になるという提案も実践的です。", "unverified": "単一事例に基づく概念的研究であり、一般化には検証が必要（抄録）。"}}, {"id": "pn46", "rank": 46, "field": "組織行動・心理的安全性", "headline": "流動的なデジタルチームでの役割の不適合", "title": "Silver Lining Amid Adversity: Examining Role Misfits in Fluid Digital Teams", "url": "https://doi.org/10.2139/ssrn.7565478", "authors": "Jiaxing Cao ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Cao, J., & Zhong, Q. (2026). Silver Lining Amid Adversity: Examining Role Misfits in Fluid Digital Teams. https://doi.org/10.2139/ssrn.7565478", "why": "eスポーツのチームで役割の適合が個人とチームの成績に与える効果を検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "オンラインゲーム（League of Legends）のチームで、役割と担当位置の適合が個人とチームの成績を高める一方、不適合も慣れたチームでは適応を促しうることを示した（抄録）。", "p3": "35,545の個人レベルの試合データで、役割-位置の適合、キャラクターへの慣れ、チームへの慣れがKDA比とチームの勝利に与える影響をロジットとOLSで分析した（抄録）。", "p5": "人と仕事の適合は個人成績とチームの成功を高め、キャラクターへの慣れがその効果を強めた。チームへの慣れは、不適合のもとでも高い成績につながる適応を可能にした（抄録）。", "fun": "得意な役割を任されると活躍するのは当然ですが、慣れた仲間となら、あえて不得意な役割でも工夫して勝てることがある、という結果です。ゲームの膨大な記録は、職場では測りにくいチームの働き方を調べる実験室になります。", "unverified": "効果の大きさ（係数）は未確認。"}}, {"id": "pn47", "rank": 47, "field": "組織行動・心理的安全性", "headline": "人とAIの協働は創造性を高めるか", "title": "Impact of Human-AI Teaming on Creativity", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05723566", "authors": "Raphaël Teixeira", "venue": "RePEc NEP", "date": "2026-09-14", "why": "生成AIとの共創が創造性に与える影響を検討した。", "explain": {"basis": "抄録", "basis_note": "EconPapers（RePEc）経由でHALの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "生成AIと人間の協働が創造的な仕事にどう影響するかを、創造産業を対象に調べる博士研究の構想を示した（抄録）。", "p3": "人間-AI協働の協力の動態、共有目標、チームの発達に注目し、エージェント型AIの文脈で、チームの創造性を引き出すLLMに基づく対話手順を設計する計画である（抄録）。", "p5": "抄録は研究の目的と計画の記述で、実証結果は含まれない（抄録）。", "fun": "AIと一緒に絵や企画を作るとき、AIは道具なのか、仲間なのか。その関係のあり方によって、チームの創造性の生まれ方は変わりそうです。管理者がそうした「混成チーム」を評価する物差しをまだ持っていない、という問題意識が出発点です。", "unverified": "研究計画の段階であり、結果はない。"}}, {"id": "pn48", "rank": 48, "field": "地震工学・防災", "headline": "多年のInSARで九寨溝地震後の微小な余効変動", "title": "Multi-year InSAR observations of subtle and heterogeneous postseismic deformation following the 2017 Mw 6.5 Jiuzhaigou earthquake", "url": "https://doi.org/10.2139/ssrn.7571864", "authors": "Jun Hua ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Hua, J., Gong, W., Li, Y., Shan, X., Li, Y., & Zhang, Y. (2026). Multi-year InSAR observations of subtle and heterogeneous postseismic deformation following the 2017 Mw 6.5 Jiuzhaigou earthquake. https://doi.org/10.2139/ssrn.7571864", "why": "長期のInSAR観測で、短期では見えない不均一な地震後変形を捉えた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "2017年九寨溝地震（Mw6.5）後の約6年間のInSAR時系列から、断層系で不均一な地震後の変形（余効変動）を捉えた（抄録）。", "p3": "Sentinel-1の上昇・下降軌道の時系列データに、分布すべりのインバージョンと力学モデルを組み合わせた（抄録）。", "p5": "震央付近の深さ約2〜5kmで顕著な浅い余効すべりが見られ、6年間の測地モーメントは8.6×10^17 N·m（Mw5.9）で、本震の約10%だった。早期の急な変動は応力駆動モデルでは再現できず、間隙水圧の変化の寄与の可能性が示された（抄録）。", "fun": "大地震の後も、地面は何年もかけてじわじわと動き続けます。人工衛星のレーダーで6年分を重ねると、短い期間では見えなかったわずかな動きが浮かび上がりました。その動きの一部は、地下の水の圧力の変化が関わっている可能性があるという点が興味深いです。", "unverified": "仕組みは未解決とされている（抄録）。"}}, {"id": "pn49", "rank": 49, "field": "地震工学・防災", "headline": "商業不動産の災害保険は物件群単位で価格が決まる", "title": "Portfolio Pricing of Disaster Risk in Commercial Real Estate Insurance Market", "url": "https://doi.org/10.2139/ssrn.7572087", "authors": "Yichun Fan ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Fan, Y., Niu, D., Williams, T., & Zheng, S. (2026). Portfolio Pricing of Disaster Risk in Commercial Real Estate Insurance Market. https://doi.org/10.2139/ssrn.7572087", "why": "機関投資家が物件群で保険を買うとき、個別物件のリスクと保険料の対応が崩れることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "米国の商業不動産で、物件の保険料は自分の災害リスクだけでなく、それを保有するファンドのポートフォリオ全体の災害リスクにも左右されることを示した（抄録）。", "p3": "NCREIFの物件別保険費用と、Moody's RMSのモデルによる期待災害損失を結びつけ、同じ物件がリスクの違うファンド間を移る取引も使って分析した（抄録）。", "p5": "自身のリスクを固定しても、保険費用はポートフォリオの平均リスクとともに上がり、規模と分散が大きいほど下がった。周囲のポートフォリオの平均災害リスクが10%上がると、物件の保険費用は約0.4%上がった（抄録）。", "fun": "同じ建物でも、誰が持っているかで保険料が変わる、という意外な結果です。保険はファンドごとにまとめて買うので、危ない物件の多いファンドに入ると、安全な物件まで高い保険料を払うことになります。災害リスクの値段は物件単体では決まらないのです。", "unverified": "標本の物件数と期間は未確認。"}}, {"id": "pn50", "rank": 50, "field": "地震工学・防災", "headline": "災害対応での人とAIの協働パターン", "title": "Human-AI Interaction Patterns in Disaster Management", "url": "https://doi.org/10.2139/ssrn.7564102", "authors": "Dineva Snezhana", "venue": "SSRN", "date": "2026-10-06", "apa": "Snezhana, D. (2026). Human-AI Interaction Patterns in Disaster Management. https://doi.org/10.2139/ssrn.7564102", "why": "災害管理にAIが入ることで人の役割がどう変わるかを、協働の型として整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "災害管理で人間とAIの役割分担を10の相互作用パターンに整理した分類（タクソノミー）を提案した（抄録）。", "p3": "自律的な緊急対応システム、監督制御、サイバーフィジカルな回復力の研究に基づき、時間的な位置、直接の関与、戦略的な監督、最小または逆転した人間の関与の4群に分け、各パターンを「Rescue Me」という枠組みの事例で例示した（抄録）。", "p5": "自律性が高まることによる自動化バイアス、ガバナンスの空白、敵対的な脅威などの運用上のリスクを論じた。実証ではなく概念的な整理である（抄録）。", "fun": "災害現場では、すべてを人が確認していては間に合わない一方、AIに任せきりでも危険です。人がいつ、どの程度関わるかには、実は多くの型があります。その型を地図のように並べたことで、場面ごとに安全な任せ方を選びやすくなります。", "unverified": "概念的な研究であり、パターンの有効性の実証はない。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "橋梁SHMの欠測を条件別に最適手法で補完", "title": "An Adaptive Multi-Method Approach to Enhancing the Quality of Anomalous Data in Bridge Structural Health Monitoring", "url": "https://doi.org/10.3390/app16199903", "authors": "Yufeng Xu ほか", "venue": "Applied Sciences", "date": "2026-10-07", "citescore": 6.1, "citescore_year": "2025", "apa": "Xu, Y., Wei, L., & Huang, Q. (2026). An Adaptive Multi-Method Approach to Enhancing the Quality of Anomalous Data in Bridge Structural Health Monitoring. Applied Sciences, 16(19), 9903. https://doi.org/10.3390/app16199903", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "橋梁のモニタリングデータの外れ値と欠測を、チャンネル・欠測の長さ・補助チャンネルの有無に応じて最適な補完法を自動で選ぶ枠組みで処理し、従来法より誤差を大きく減らした（抄録）。", "p2": "橋梁SHMのデータには孤立した外れ値と連続した欠測があり、状態評価を歪める。固定の欠測長の規則で補完法を決める方法では、チャンネルや状況の違いに対応できない（抄録）。", "p3": "外れ値は、移動窓での値と一次差分の四分位範囲の基準で選別し、相関の高い別チャンネルと照合して本物の構造応答を消さないようにする。欠測は、時間特徴を加えた再帰的XGBoost（端点補正つき）、振幅を戻した日周プロファイル再構成、チャンネル間XGBoostの3つで補完し、漏れを防いだ5分割の時系列検証で、対象チャンネル・欠測長・補助チャンネルの有無ごとに使う方法を選ぶ（抄録）。", "p4": "供用中の斜張橋の温度・たわみ・ひずみの10分値6か月分に、3〜432標本の欠測を人工的に入れ、重み付きRMSEで従来法・最新の比較手法と比べた（抄録）。", "p5": "最良の方法はチャンネルと欠測長で変わり、たわみにはチャンネル間の再構成が一貫して最良、チャンネル間の関係が弱いか補助がないときは自系列や日周プロファイルが必要だった。4チャンネルで重み付きRMSEは最良の従来法より32.6〜96.0%減った。最新手法に対しては温度・たわみ・ひずみε1でRMSEを9.8%・73.7%・36.0%減らしたが、ひずみε2では上回らなかった。補助チャンネルは数より質が重要だった（抄録）。", "p6": "著者は、信頼できる同期した証拠のない長い欠測の再構成は依然として難しいとしている（抄録）。解釈：1橋・6か月の検証で、他の橋梁形式や加速度など高サンプリングの信号への適用は未確認。", "fun": "橋のセンサは、雷や通信の途切れでデータが抜けたり、変な値が混じったりします。抜けた部分をどう埋めるかは、穴の長さや、そばに似た動きをする別のセンサがあるかで最適な方法が変わります。一つの方法に頼らず、状況ごとに「埋め方」を選ぶという、職人の使い分けを自動化したような研究です。", "unverified": "本文の検証の詳細（各手法の設定、欠測長ごとの誤差）は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "1台の車両走行の影響線から曲げ剛性分布を逆算", "title": "A Novel Approach for Bending Stiffness Inversion and Rapid Evaluation of Continuous Beam Bridges Based on a Deflection Influence Line", "url": "https://doi.org/10.1155/stc/1361157", "authors": "Yu Zhou ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-06", "citescore": 10.3, "citescore_year": "2025", "apa": "Zhou, Y., Feng, Z., Di, S.-K., & Jia, Z.-J. (2026). A Novel Approach for Bending Stiffness Inversion and Rapid Evaluation of Continuous Beam Bridges Based on a Deflection Influence Line. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/1361157", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "重車両1台をアイドリング速度で走らせて得たたわみ影響線から、連続桁橋の断面ごとの曲げ剛性を逆算し、交通を止める静的載荷試験に代わる迅速な剛性評価法を示した（抄録）。", "p2": "橋の静的載荷試験は、高い載荷効率を得るために交通を止める必要があり、安全上のリスクもある（抄録）。", "p3": "単一の重車両の低速走行での応答から、変分モード分解（VMD）と車両-橋梁連成の行列解析で準静的なたわみ影響線を取り出し、影響線と断面曲げ剛性を結ぶ変換関数で各断面の剛性を逆算する。変換関数の精度は等断面連続桁のモード固有値関数で確かめ、変断面桁にはガウス-ルジャンドル公式による解法を作った（抄録）。", "p4": "変断面の連続桁橋で実測した影響線から全径間の断面剛性を逆算し、有限要素モデルの剛性と比べ、静的載荷試験の検証係数とも比較した。断面の特性と全径間の寄与を考える4つの剛性評価指標を提案した（抄録）。", "p5": "提案法は全径間の断面剛性の分布を迅速・直観的に示した。2つの冗長性係数は測定径間と隣接径間の剛性の余裕を表せた。2つの検証係数の逆数は静的載荷試験の検証係数より保守的で、断面剛性の検証係数の逆数は載荷試験の結果とよく一致し、全径間の寄与を考える係数は実際の状態により近かった（抄録）。誤差の具体的な数値は抄録に記載がない。", "p6": "抄録の範囲では、車両の重量・速度の不確かさ、温度の影響、ノイズへの頑健性は示されていない。解釈：1橋の実験であり、他の橋梁形式への一般化は未確認。", "fun": "橋の「硬さ」を調べるには、普通は重いトラックを何台も載せて交通を止め、たわみを測ります。この研究は、1台のトラックがゆっくり渡るだけで、どこが硬くどこが柔らかいかを全長にわたって描き出しました。たわみ方の「形」に、硬さの分布が写し込まれているのを読み取る逆算の発想が面白いところです。", "unverified": "逆算した剛性とFEモデルの剛性の誤差の数値、車両・測定の条件は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "NY渋滞課金で区域内PM2.5が1.44μg減", "title": "Attributing PM2.5 and NO2 Changes One Year after New York City’s Congestion Pricing Policy", "url": "https://doi.org/10.1021/acs.estlett.6c00610", "authors": "Polina M. Goldberg ほか", "venue": "Environmental Science and Technology Letters", "date": "2026-10-07", "sjr": 2.645, "citescore": 14.2, "citescore_year": "2025", "apa": "Goldberg, P. M., Anand, A., Goldberg, D. L., & Westervelt, D. M. (2026). Attributing PM2.5 and NO2 Changes One Year after New York City’s Congestion Pricing Policy. Environmental Science & Technology Letters. https://doi.org/10.1021/acs.estlett.6c00610", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "p1": "2025年1月に始まったニューヨーク市の渋滞課金（マンハッタン南部の中心業務地区の課金）が、1年目に区域内のPM2.5を有意に下げたことを、地上と衛星の観測で示した（抄録）。", "p2": "渋滞課金は交通量を減らすが、大気質への効果は、他の政策や地域全体の傾向と分けて評価する必要がある（抄録）。", "p3": "ニューヨーク市地域大気調査（NYCCAS）のリアルタイムPM2.5について、課金1年目と2022〜2024年を比べ、課金区域内外の地点で差の差（DID）回帰を行い、区域外への波及（スピルオーバー）も考慮した。NO2は衛星TROPOMIの対流圏カラムで2018〜2024年の基準と比べた（抄録）。", "p4": "DIDで推定したPM2.5の変化量とその有意性、区域外の地点の変化、NO2の地域全体と区域内の変化で評価した（抄録）。", "p5": "課金はPM2.5を区域内で1.44 μg/m³下げた（p<0.001）。波及を考慮しても1.33 μg/m³（p<0.001）で、近隣の区域外の地点は有意でない0.50 μg/m³の増加（p=0.34）だった。対流圏NO2は2025年に都市圏全体で20%超減ったが、課金に帰属できたのは有意でない1.23%の減少（p=0.096）だった（抄録）。", "p6": "抄録によれば、NO2の地域的な減少には他の大気政策も寄与した可能性がある。解釈：1年目のみの評価で、気象条件の違いの調整の詳細は本文で確認が必要。", "fun": "車の通行にお金を取ると、空気はきれいになるのか。ニューヨークの実験では、課金区域の中の微小な粒子が確かに減りました。一方、街全体で大きく減った排ガス成分は、課金だけのおかげとは言えませんでした。政策の効果を、同じ時期のほかの変化と切り分けて測る難しさがよくわかります。", "unverified": "DIDの対照地点の選び方と気象の調整は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "通勤先選択を経済複雑性と非正規性で説明", "title": "The WorkReach model for urban work location choices through economic complexity and informality", "url": "https://doi.org/10.1038/s41467-026-78293-3", "authors": "Ollin D. Langle-Chimal ほか", "venue": "Nature Communications", "date": "2026-10-07", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Langle-Chimal, O. D., Knoblauch, S., & González, M. C. (2026). The WorkReach model for urban work location choices through economic complexity and informality. Nature Communications. https://doi.org/10.1038/s41467-026-78293-3", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "p1": "人々がどこへ通勤するかを、距離だけでなく、勤め先の地域の経済的な高度さ（経済複雑性）とインフォーマル（非正規）経済の度合いを効用に組み込んだ離散選択モデルWorkReachで説明した（抄録）。", "p2": "従来の機械論的なモビリティモデルは距離減衰のような物理的に解釈できる効果を捉えるが、社会経済的な要因が通勤の決定をどう形づくるかを見落としている（抄録）。", "p3": "離散選択理論に基づき、インフォーマリティと経済複雑性を効用関数に入れ、労働者がそれを最大化するかのように通勤先を選ぶとして通勤流を表した（抄録）。", "p4": "米国・メキシコ・ブラジルの4都市に適用し、広く使われる基準モデルと通勤流の再現精度を比べた（抄録）。", "p5": "WorkReachは基準モデルと同程度の精度で通勤流を再現しつつ、選択を解釈可能にした。労働者は経済的に高度な地域へは一貫して遠くまで通勤し、インフォーマリティの役割は地域で異なった。機会の知覚された便益でアクセシビリティを測ると、従来の物理的な近さの指標では見落とされる格差が浮かんだ（抄録）。", "p6": "抄録の範囲では、使った通勤データの種類と期間、精度の数値は確認できない。解釈：4都市の比較で、日本の都市のようにインフォーマル経済の小さい地域での当てはまりは未検証。", "fun": "人は近い職場を選ぶと思いがちですが、高度な仕事が集まる場所なら、遠くても通う価値があると判断します。この研究は、その「行く価値」を地域の経済の複雑さで数値化しました。家からの距離だけで便利さを測ると、本当に恵まれていない地域が見えなくなる、という指摘が重要です。", "unverified": "モデルの精度の数値と都市ごとの係数は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "生成AIの環境負荷開示で企業への非難が増す", "title": "Enterprise GenAI deployment, environmental externalities, and consumer accountability responses: attribution of blame and reduced intention to transact", "url": "https://doi.org/10.1108/jeim-03-2026-0487", "authors": "Xiaotian Liu ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-10-07", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Liu, X., Haratbar, H. R., & Zhou, X. (2026). Enterprise GenAI deployment, environmental externalities, and consumer accountability responses: attribution of blame and reduced intention to transact. Journal of Enterprise Information Management, 1–18. https://doi.org/10.1108/jeim-03-2026-0487", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "ネット小売の顧客対応に生成AIアシスタントを導入した企業が、その環境負荷（外部性）を開示すると、消費者は企業を責め、購買意図が下がることを3つの実験で示した（抄録）。", "p2": "生成AIの上流の環境負荷（電力・水など）が、AIを導入した企業の責任として消費者に帰属されるかは調べられていなかった（抄録）。", "p3": "架空のネット小売業者が顧客対応の生成AIを導入している場面で、研究1（N=160）で環境外部性の開示の購買意図への効果、研究2（N=200）で企業への非難の媒介、研究3（N=640）で情報の種類と利用者選択の設計（初期設定で組み込み対利用者が選んで使う）の2×2を検証した（抄録）。", "p4": "被験者間実験で、購買意図、企業への非難の帰属、間接効果の大きさを、設計条件ごとに比べた（抄録）。", "p5": "環境外部性の開示は購買意図を下げ、企業への非難を高め、その非難が購買意図の低下を媒介した。この帰属の経路（購買意図への負の間接効果を含む）は、利用者が選ぶ方式より、初期設定で組み込む方式で強かった（抄録）。効果量の数値は抄録に記載がない。", "p6": "抄録の範囲では、架空の場面での意図の測定であり、実際の購買行動は測っていない。解釈：環境意識の高い回答者の偏りや、開示の言い方の違いによる効果の変化は未確認。", "fun": "AIのチャットボットが便利でも、「これを動かすのに大量の電気と水を使っています」と知ると、人はそのお店を少し責めたくなります。しかも、勝手にAIが出てくる設定だと、自分で選んで使う場合より強く責められました。AIを入れるかどうかだけでなく、どう見せるかが企業の評判を左右するのです。", "unverified": "効果量と調査対象者の属性は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "意図を環境行動に変える「持続可能性クラフティング」", "title": "Sustainability Crafting: How Employees Translate Sustainability Intentions Into Green Behaviors", "url": "https://doi.org/10.1002/csr.71047", "authors": "Sait Gürbüz ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-07", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Gürbüz, S., Bakker, A. B., Konaklı, Z., & Vriend, T. (2026). Sustainability Crafting: How Employees Translate Sustainability Intentions Into Green Behaviors. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71047", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "従業員が環境配慮の意図を職場での行動に移す仕組みとして「持続可能性クラフティング」（自分の仕事を環境に良い形に作り変える行動）を提案し、意図と環境的な組織市民行動（グリーンOCB）を媒介することを示した（抄録）。", "p2": "組織が持続可能性を重視しても、従業員の意図が職場の行動に結びつかない「意図と行動のギャップ」が続いている（抄録）。", "p3": "計画的行動理論とジョブ・クラフティング（従業員が自分の仕事の内容や関係を主体的に作り変えること）の研究に基づき、持続可能性クラフティングを媒介、グリーンな権限委譲型リーダーシップとグリーン人事管理（HRM）を調整要因とするモデルを立てた（抄録）。", "p4": "オランダの従業員の代表標本385人の3時点の調査データを構造方程式モデルで分析した（抄録）。", "p5": "持続可能性クラフティングは意図とグリーンOCBの関係を媒介した。グリーンな権限委譲型リーダーシップもグリーンHRMも、意図とクラフティングの関係を有意に調整しなかった。リーダーシップはクラフティングとグリーンOCBの両方と正に関連したが、HRMはリーダーシップを考慮すると有意でなかった（抄録）。", "p6": "抄録の範囲では限界の記述はない。解釈：自己報告の質問紙で、行動の客観的な測定はない。オランダの標本で、文化の異なる地域への一般化は未検証。", "fun": "「環境に良いことをしたい」と思っても、職場で実行するのは案外難しいものです。この研究は、自分の仕事のやり方を自分で少し作り変える行動が、その思いを実際の行動につなぐ橋になっていることを示しました。会社の制度より、上司が任せて背中を押すことのほうが効いていた点も興味深いところです。", "unverified": "係数の大きさと適合度の指標は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "心拍指標は測る時点で業績との関係が逆転", "title": "The within‐person relationship of allostasis and allostatic load with job performance", "url": "https://doi.org/10.1111/apps.70145", "authors": "Robert C. Zieringer ほか", "venue": "Applied Psychology", "date": "2026-10-07", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "apa": "Zieringer, R. C., & Zapf, D. (2026). The within‐person relationship of allostasis and allostatic load with job performance. Applied Psychology, 75(5). https://doi.org/10.1111/apps.70145", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "心拍数（HR）や心拍変動（HRV）が、短期の適応的な活性化（アロスタシス）を表すのか、蓄積した生理的負担（アロスタティック負荷）を表すのかを区別する分類を提案し、同じ指標でも測る時点と文脈で職務業績との関係が逆になることを示した（抄録）。", "p2": "アロスタティック負荷の研究ではHR・HRVがよく使われるが、それが一次的な媒介（適応の活性化）なのか二次的な結果（蓄積した負担）なのかが不明確で、研究結果の食い違いの原因になっている（抄録）。", "p3": "生理指標を一次的媒介と二次的結果のどちらとして解釈すべきかの分類を作り、2つの縦断マルチレベル研究で検証した（抄録）。", "p4": "研究1では参加者（N=167〜331）が4週間繰り返し安静時のHR・HRVを測って業績を自己報告し（509〜1,001観測）、同僚・上司の評価も得た。研究2ではカウンセラー（N=11〜15）が面談前にHR・HRVを測り、クライエントが面談の質を評価した（71〜91面談）（抄録）。", "p5": "二次的結果として解釈した場合、低いHR、低いLF/HF、高いHRVはより良い業績を予測した。一次的媒介として解釈した場合、高いLF/HFがクライエント評価の業績の良さを予測した（抄録）。結果は提案した分類をおおむね支持した（抄録）。", "p6": "抄録の範囲では限界の記述はない。解釈：研究2は人数が11〜15人と少なく、効果の大きさの推定は不安定でありうる。", "fun": "心臓のドキドキは、「頑張るための準備」のこともあれば、「疲れがたまっている印」のこともあります。同じ数字でも、休んでいるときに測るか、仕事の直前に測るかで意味が逆になる、という指摘です。体のデータを職場の研究に使うときは、いつ、何のために測ったかを考えないと誤解する、という教訓になります。", "unverified": "係数の大きさと統計的有意性の詳細は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "AIによる高齢者の孤独検知を社会老年学から批判", "title": "Being Sensed, Scored, and ‘Connected’: A Social-Gerontological Critique of AI-Driven Loneliness Detection for Older Adults in Taiwan", "url": "https://doi.org/10.1093/geront/gnag238", "authors": "Hui-Chun Chan ほか", "venue": "Gerontologist", "date": "2026-10-06", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "apa": "Chan, H.-C., & Chu, K.-M. (2026). Being Sensed, Scored, and ‘Connected’: A Social-Gerontological Critique of AI-Driven Loneliness Detection for Older Adults in Taiwan. The Gerontologist. https://doi.org/10.1093/geront/gnag238", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "表情・声・日常の活動データから高齢者の孤独をAIで推定して点数化する技術について、台湾の高齢社会と長期介護制度を例に、社会老年学の観点から導入前の批判的な検討を行ったフォーラム論文（抄録）。", "p2": "AIによる孤独検知の研究は工学的な実現可能性に主導され、孤独の社会老年学的な理解や、文化の異なる高齢者がどう知られ支えられたいかには、ほとんど注意が払われていない（抄録）。", "p3": "台湾ではまだ日常的に使われていないため、政策が見込む導入の軌跡を、事前に検討する「予見的ガバナンス」の立場をとった。センサからではなく、高齢者自身の意味づけ、関係上の義務、プライバシーと自律の期待から設計を始めるべきだと論じた（抄録）。", "p4": "実証データではなく、概念的な検討による論考である（抄録）。", "p5": "3つの緊張関係を指摘した：関係的な経験を個人の生体指標の欠陥に置き換えること、文化的に抑制された感情表現をアルゴリズムが雑音として読むおそれ、リスク指標がケアの業務に入ると見守りが監視へ滑ること。乏しいケア資源を技術で補う意義も認め、社会的に説明責任のある設計原則と研究課題を提案した（抄録）。", "p6": "実証のない論考で、提案した原則の有効性は検証されていない。解釈：台湾の文脈に基づく議論で、日本など他の東アジア社会への適用には文化的な比較が要る。", "fun": "AIが顔や声から「この人は寂しそう」と判定してくれる、と聞くと便利そうです。でも、気持ちをあまり表に出さない文化の高齢者は、AIに誤解されるかもしれません。孤独は人とのつながりの問題なのに、個人の数値の問題にすり替わってしまう危うさを、使い始める前に考えようという呼びかけです。", "unverified": "論考のため、実証的な裏づけはない。"}}, {"id": "jr09", "rank": 9, "headline": "財務報告の質と監査の質は投資効率で代替関係", "title": "Financial reporting quality and investment efficiency: the moderating role of audit quality", "url": "https://doi.org/10.1108/ijaim-11-2025-0375", "authors": "Huy Cao Tan ほか", "venue": "International Journal of Accounting and Information Management", "date": "2026-10-06", "sjr": 1.106, "citescore": 9.9, "citescore_year": "2025", "apa": "Cao Tan, H., & Dang Anh, T. (2026). Financial reporting quality and investment efficiency: the moderating role of audit quality. International Journal of Accounting & Information Management, 1–18. https://doi.org/10.1108/ijaim-11-2025-0375", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "ベトナムの上場企業で、財務報告の質（FRQ）と監査の質（AQ）はどちらも投資効率を高めるが、両者は部分的に代替し合う統治の仕組みであることを示した（抄録）。", "p2": "新興市場で、財務報告の質と監査の質が企業の投資効率にどう影響し、監査の質がその関係を調整するかは十分に検証されていない（抄録）。", "p3": "投資効率は成長機会に基づく投資モデルの残差で測り、FRQは会計発生高と売上に基づく3指標と合成指数で測った。AQは四大監査法人かどうかの二値。実行可能な一般化最小二乗法（FGLS）と2段階システムGMMで推定した（抄録）。", "p4": "非金融の上場企業291社の2014〜2023年（2,910企業年）のパネルで、FRQ・AQの主効果と交差項を評価した（抄録）。", "p5": "FRQとAQはともに投資効率を高め、AQはシステムGMMでより頑健だった。FRQとAQの交差項は有意に負で、部分的な代替関係を示した（抄録）。", "p6": "著者は、FRQの測定法に推定誤差がありうること、AQが四大監査法人の二値に限られること、自己選択の偏りと一般化可能性の限界を挙げている（抄録）。", "fun": "会社の数字の信頼性を高める方法は二つあります。会社自身がきちんと報告することと、外部の監査が目を光らせることです。この研究では、どちらも会社の投資を無駄の少ないものにしますが、片方が強いともう片方の効き目が小さくなりました。二重の安全装置は、足し算ではなく、ある程度の置き換えになるようです。", "unverified": "係数の大きさと頑健性検査の詳細は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "多エージェント模擬授業で教員志望者の対応が分岐", "title": "From Prompting to Scaffolding: Divergent Human–AI Interaction Pathways of Pre-Service Teachers in Multi-Agent Micro-Teaching Simulation (MAMS)", "url": "https://doi.org/10.1177/07356331261494349", "authors": "Ruiqing Du ほか", "venue": "Journal of Educational Computing Research", "date": "2026-10-07", "sjr": 2.457, "citescore": 14.8, "citescore_year": "2025", "apa": "Du, R., Chen, Z., Shi, Y., Wang, C., Zhao, H., & Wang, Z. (2026). From Prompting to Scaffolding: Divergent Human–AI Interaction Pathways of Pre-Service Teachers in Multi-Agent Micro-Teaching Simulation (MAMS). Journal of Educational Computing Research. https://doi.org/10.1177/07356331261494349", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "p1": "多様な仮想生徒と指導役のエージェントからなる多エージェントの模擬授業環境（MAMS）を作り、数学の教員志望者の対応が、もともとの教科指導の知識の違いによって分かれることを示した（抄録）。", "p2": "従来のマイクロティーチング（短い模擬授業）では、授業中の予期せぬ出来事を、繰り返し可能で標準化された形で練習する機会が限られている（抄録）。", "p3": "専門的な気づき（professional noticing）の考え方に基づき、個性の異なる仮想生徒、標準化した困難な出来事、学部長役のエージェントの促しを組み込んだ。64人の教員志望者が2回の模擬授業を行い、数学の教科指導の知識（MPCK）の高低で分けた（抄録）。", "p4": "教師の自己効力感、MPCKの成績、探究の共同体の存在感（教授・社会・認知）を成果とし、対話ログを出来事に基づく遅れ系列分析で調べた（抄録）。", "p5": "前後での変化と、ベースラインを調整した小さな群差が見られた。知識の高い群は応答の戦略の成績と教授的存在感が高かった。ログでは、知識の高い群は指導役の促しの後に診断的な問いかけと足場かけを行い、生徒の実質的な応答が続いたのに対し、低い群は直接教授や手順の管理に移り、生徒の参加が低いままだった（抄録）。", "p6": "抄録の範囲では、対照群がない点と64人という規模が制約となる。解釈：仮想生徒の振る舞いが実際の教室にどれだけ近いかは未検証。", "fun": "AIの生徒たちを相手に授業の練習をすると、同じ助言を受けても、知識のある先生の卵は「どこでつまずいた？」と問いかけ、そうでない人は自分で説明し始めて生徒が黙ってしまいました。AIの練習相手が、教え方の癖をくっきり映す鏡になったという点が興味深いところです。", "unverified": "成果指標の効果量と、エージェントの実装（使用したLLM）は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "透水性岩盤の水圧破砕を2次元拡散込みで解く", "title": "Transient Propagation of a Toughness-Dominated Plane-Strain Hydraulic Fracture in a Diffusive Porous Medium", "url": "https://doi.org/10.1007/s00603-026-05987-x", "authors": "Cexuan Liu ほか", "venue": "Rock Mechanics and Rock Engineering", "date": "2026-10-07", "sjr": 1.803, "citescore": 11.6, "citescore_year": "2025", "apa": "Liu, C., Zhang, F., & Detournay, E. (2026). Transient Propagation of a Toughness-Dominated Plane-Strain Hydraulic Fracture in a Diffusive Porous Medium. Rock Mechanics and Rock Engineering. https://doi.org/10.1007/s00603-026-05987-x", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（問題設定、支配方程式、2次元漏出の核関数、漸近解、過渡解の結果、結論）を読んだ", "preprint": false, "p1": "透水性の岩盤で、破壊靭性が支配する平面ひずみの水圧破砕（KGD型）の進展を、2次元の間隙水圧拡散を完全に含めて過渡的に解き、古典的な1次元漏出（Carter則）の近似がどこまで使えるかを定量化した（§7）。", "p2": "従来のKGD型モデルは漏出を1次元のCarter則で近似するが、実際の間隙水圧の拡散は2次元であり、注入率が小さい場合などで近似の妥当性が不明だった。また、短時間の自己相似解が存在しないという問題もあった（§1、§7）。", "p3": "無限の多孔質弾性体中で、初期半長ℓ0の亀裂に一定流量Q0で注入し、漏出体積を拡散方程式のインパルス応答（核関数）の畳み込みで評価する（§2–3）。閉じた亀裂の圧力上昇から破断（breakdown）までの「進展前段階」を加え、初期長γ0、注入率I、貯留パラメータφの3つの無次元量で問題を整理した（§2.3）。仮定は、限界平衡（K_I=K_Ic）、流体先端と亀裂先端の遅れなし、一様な亀裂内圧で、亀裂内の粘性流は無視した（§2.1）。", "p4": "核関数の漸近形と完全な数値計算の一致を確かめ、漸近解（進展前、中間時間のK頂点、大時間のK̃族）と数値的な過渡解を比べ、無次元量の感度解析、臨界時間、進展の注入条件を調べた（§3–5）。", "p5": "注入率Iが支配的なパラメータで、I²γ0≈1.2を下回ると、無限大の注入率なしには亀裂が進展しない臨界条件が見つかった（抄録、§7）。大時間では、長さが時間の1/2乗で伸びる古典的な形を保ちつつ、係数がIに依存する「K̃族」の漸近領域が現れ、Iが小さいと2次元拡散（係数小）、大きいと1次元拡散（係数大）に対応した（§7）。Iが小さい場合は注入流体の大部分が岩盤に漏出し、水理効率が大きく下がった（§5.1.4）。", "p6": "著者は、亀裂内の流体流れ（潤滑方程式）と多孔質弾性効果を入れることを今後の課題とし、粘性を入れればI²γ0の閾値がなくなる可能性を指摘する（§7）。", "fun": "岩に水を押し込んで割れ目を広げるとき、水の一部は周りの岩にしみ出していきます。これまでは、しみ出しを「一方向だけ」と単純化してきましたが、実際は四方に広がります。それを正しく入れると、水の押し込み方が弱すぎるといつまでも割れ目が進まない「しきい値」が現れる、という発見が面白いところです。", "unverified": "K̃族の係数のIへの依存の具体的な値と、図の数値結果は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "LLM顧客役との接客訓練、直後の意欲だけでは効果不明", "title": "Preventing escalation in customer service: immediate motivation and 4-week outcomes in a workplace deployment of LLM role-play training", "url": "https://doi.org/10.3389/frai.2026.1953650", "authors": "Kazuhiro Shidara ほか", "venue": "Frontiers in Artificial Intelligence", "date": "2026-10-07", "citescore": 8.0, "citescore_year": "2025", "apa": "Shidara, K., Iwasaki, S., Awai, S., Iida, T., Yoshimura, T., Yoshioka, T., Shimada, K., Kiriu, M., & Konno, T. (2026). Preventing escalation in customer service: immediate motivation and 4-week outcomes in a workplace deployment of LLM role-play training. Frontiers in Artificial Intelligence, 9. https://doi.org/10.3389/frai.2026.1953650", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社（Frontiers）のPDF本文（システムの段階の論理と構成、参加者と手順、結果、考察、限界）を読んだ", "preprint": false, "p1": "コールセンターの従業員が、感情が変化するLLMの仮想顧客と音声で対話して怒りの激化を防ぐ練習をする訓練システムを、日本の実際の顧客サポート組織で4週間運用し、直後の意欲の高まりだけでは訓練効果の証拠にならないことを示した（§6.1、§6.4）。", "p2": "顧客の攻撃的な態度は、従業員の不適切な応答で激化することがある。LLMによるロールプレイ訓練では、訓練生の発話に応じて仮想顧客の態度が教育的な規則で変わる仕組みは少なく、評価も使用直後の反応に頼り、後の職場の成果との関係は調べられていなかった（抄録、§1）。", "p3": "各発話にGPT-4oが5つの二値の行動フラグ（共感、具体的な提案など）を付け、規則ベースの制御器が顧客の態度を激化・沈静化させる状態ベースの対話枠組みを、経験のあるコールセンターの実務者と共同設計した（§3.1、§3.3.2）。例：第1段階では十分な共感が激化を防ぎ、過度の距離の取り方は不信を強める（§3.1.1）。音声認識はWhisper、音声合成はStyle-BERT-VITS2で、仮想コーチがフィードバックを返す（§3.3–3.4）。", "p4": "12人の従業員を、顧客対応のシナリオ群（6人）と構造をそろえた顧客対応以外のシナリオ群（6人）に無作為に分け、1週間あけて2回の訓練を行い、使用直後の行動変容の意欲、4週間の顧客応答性・生産性（WHO-HPQ）の変化をHedgesのgと95%信頼区間で比べた（§4）。", "p5": "使用直後の意欲は顧客対応群が高く（g=1.11、95%CI −0.33〜2.55）、教材の内容に合う指標で最大の差が出た。4週間の変化の群間差は小さく、むしろ比較群がわずかに有利だった（応答性g=−0.26、生産性g=−0.24）。顧客対応群の群内の変化は中〜大（g=0.72、0.77）だったが、平均の伸びが大きいためではなく変化の分散が小さいためだった（抄録、§5.4）。すべての区間はゼロを含んだ。", "p6": "著者は、本論文は枠組みが実際の職場で運用できることと推定値を報告するもので、訓練の有効性、LLMのフィードバックの評価としての妥当性は主張しないと明記し、各群6人・1組織という小標本を限界とする（§6.4）。2025年1〜4月の運用中に提供者側のモデル更新がありえた点も述べている（§3.1）。", "fun": "AIの怒ったお客さん役と話す練習をした直後は「やる気が出た」と答えた人が多かったのに、4週間後の仕事ぶりは、別の練習をした人たちと変わりませんでした。研修の直後のアンケートで「良かった」と言われても、それだけで効果があったとは言えない、という当たり前だけれど見落とされがちな教訓を、正直に示した研究です。", "unverified": "生理指標の表示の効果と、自由記述の分析の詳細は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "仲間外れは状況の見え方を変え性格より効く", "title": "The Shifting Lens of Ostracism: Exploring the Impact of Social Exclusion on Situational Perception Dimensions", "url": "https://doi.org/10.1111/spc3.70177", "authors": "David Gallardo‐Pujol ほか", "venue": "Social and Personality Psychology Compass", "date": "2026-10-07", "sjr": 1.596, "citescore": 5.7, "citescore_year": "2025", "apa": "Gallardo‐Pujol, D., Martínez‐Catena, A., Perez‐Hoyas, L., Clougher, D., Vaca‐Quintana, D., Saeteros, D., Buades‐Rotger, M., & Alabèrnia‐Segura, M. (2026). The Shifting Lens of Ostracism: Exploring the Impact of Social Exclusion on Situational Perception Dimensions. Social and Personality Psychology Compass, 20(10). https://doi.org/10.1111/spc3.70177", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "仲間外れ（オストラシズム）を経験すると、人はその状況を否定的・逆境的に、肯定性を低く知覚するようになり、その状況知覚は性格の5因子より無視・排除の感情をよく説明することを実験で示した（抄録）。", "p2": "状況の手がかりの変化が、人が状況をどう解釈するかを直接変えるのかは十分に検証されておらず、社会的排除の主観的な経験を性格と状況知覚のどちらが説明するかも明らかでない（抄録）。", "p3": "被験者間（研究1、n=446）と被験者内（研究2、n=259）の実験で仲間外れを操作し、状況知覚の次元（否定性・逆境・肯定性など）と感情反応を測り、性格の5因子と説明力を比べた。欠測は多重代入で扱い、完全ケース分析で感度を確かめた（抄録）。", "p4": "仲間外れの条件と対照条件での状況知覚の差と、無視・排除の感情に対する状況知覚と性格の説明分散で評価した（抄録）。", "p5": "両研究で、仲間外れは否定性と逆境の知覚の増加、肯定性の低下と一貫して関連した。状況知覚は性格の5因子より無視・排除の感情の分散を多く説明し、肯定性と否定性が最も一貫した予測因子だった。中心的な結果は欠測の扱いを変えても頑健だったが、研究2の一部の副次的効果は不安定だった（抄録）。", "p6": "抄録によれば、研究2の副次的な効果は欠測の扱いによって安定しなかった。解釈：実験室の仲間外れの操作（短時間）と、地域社会で長く続く排除との違いは大きい。", "fun": "仲間外れにされると、同じ場面でも「冷たくて、厳しい場所だ」と見えてしまいます。しかも、その人がどんな性格かより、場面をどう見ているかのほうが、傷つき方をよく説明しました。性格を変えるのは難しくても、場の見え方なら変えられるかもしれない、という希望につながる研究です。", "unverified": "説明分散の具体的な数値は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "車載IMU3台で車両の振動モードと減衰を同定", "title": "Hybrid Physics-Data-Driven Estimation of Vehicle Lateral Dynamics Using Onboard IMU Measurements", "url": "https://doi.org/10.1088/1742-6596/3320/1/012008", "authors": "Massimo Cavacece", "venue": "Journal of Physics: Conference Series", "date": "2026-10-07", "citescore": 1.1, "citescore_year": "2025", "apa": "Cavacece, M. (2026). Hybrid Physics-Data-Driven Estimation of Vehicle Lateral Dynamics Using Onboard IMU Measurements. Journal of Physics: Conference Series, 3320(1), 12008. https://doi.org/10.1088/1742-6596/3320/1/012008", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社（IOP、学会論文集）のPDF本文（序論、実験の条件、結果の表1、考察、結論、図のキャプション）を読んだ", "preprint": false, "p1": "車輪のハブ・床・座席に置いた3台の同期IMUの計測から、車両の縦方向・横方向（ロール）のモードの固有振動数と減衰を周波数領域で同定し、その値を横方向の運動制御（スライディングモード制御）に組み込む枠組みを示した学会論文（抄録、結論）。", "p2": "運転支援や横滑り防止の制御には車両の状態とパラメータの実時間の知識が必要だが、旋回中に片側だけ段差を越えるような厳しい過渡状態では、従来の分離した解析式は時間変化するエネルギー散逸を正確に予測できない（序論）。", "p3": "Axivity AX6を、ばね下（車輪ハブ）、ばね上（床）、運転席に置き、計18自由度の多入力多出力の観測空間を作る。段差通過の過渡応答から、多入力のPolyMAX（p-LSCF：周波数応答から極を推定する高分解能の手法）で軸間の連成を分け、全体の減衰係数Cx・Cyを抽出し、非線形のスライディングモード制御のトルク配分に埋め込んだ（抄録、結果）。", "p4": "一定半径のロータリーで定常旋回中に人工の段差を片側だけ越える試験を、乾いた路面（24℃）と規定空気圧で3回独立に行い、周波数応答関数の再現性と、固有振動数・減衰の平均と標準偏差で評価した（結果、表1）。", "p5": "縦方向モードは固有振動数6.25 Hz・減衰比31.25%、横方向・ロールの剛体モードは0.78 Hz・5.00%と同定された（抄録）。3回の試験で固有振動数の標準偏差は±0.45 Hzと小さかったが、横方向の減衰は試験1の5%から試験2の33%へと大きく変わり、著者はタイヤのすべり角と荷重移動の違いによると説明している（結果）。", "p6": "著者は、路面の摩擦係数の急変に対応する適応的な仕組みを今後の課題とする（結論）。解釈：試験は3回だけで、横方向の減衰が試験ごとに大きく変わるため、同定値を制御に使う際の頑健性は十分に示されていない。制御の効果（追従遅れの減少など）の定量的な比較は本文で確認できなかった。", "fun": "車のタイヤの近く、床、座席の3か所に小さな加速度計をつけ、段差を越えたときの揺れ方から、車の「揺れやすさ」と「揺れの収まりやすさ」を読み取りました。同じ車でも、段差への当たり方しだいで横揺れの収まり方が大きく変わる、という結果は、走りながら車の性質を測る難しさをよく表しています。", "unverified": "制御の効果の定量的な評価と、表1の各試験の全数値は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "政府監査を受注する監査法人は地元企業に甘い", "title": "The Spillover Effects of Audit Firms’ Engagement in Government Audits: Evidence from China", "url": "https://doi.org/10.2308/jiar-2025-036", "authors": "Jin Jiang ほか", "venue": "Journal of International Accounting Research", "date": "2026-10-06", "citescore": 2.1, "citescore_year": "2025", "apa": "Jiang, J., & Ye, R. (2026). The Spillover Effects of Audit Firms’ Engagement in Government Audits: Evidence from China. Journal of International Accounting Research, 1–23. https://doi.org/10.2308/jiar-2025-036", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "オープンアクセス版（著者受理稿）のPDF本文（研究モデル、標本と結果、結論）を読んだ", "preprint": false, "p1": "中国で、市の政府監査を請け負う民間の監査法人は、地元の上場企業に限定付き等の修正意見を出しにくく、監査報酬は高くなることを示し、政府調達を通じた経済的なつながりが監査の独立性を損なう「レントシーキング」を支持した（§VI）。", "p2": "民間監査法人の政府監査への参加は、地元の事業・規制環境の知識を深めて監査判断を改善する（知識の波及）可能性がある一方、契約を維持したい経済的誘因が独立性を損なう（レントシーキング）可能性もあり、どちらが優勢かは不明だった（抄録、§III）。", "p3": "修正監査意見（MAO：説明段落つき無限定、限定、意見不表明、不適正）の有無をプロビットで、監査報酬の対数をOLSで、監査法人が市レベルの政府監査に参加しているかのダミー（Gov_audit）に回帰した。四大監査法人、顧客の重要度、規模、レバレッジ、営業キャッシュフロー、前年の赤字、国有企業などを統制し、産業・年の固定効果を入れた（§IV）。政府監査への参加は中国政府調達ウェブサイトの契約公示から収集した（§V）。", "p4": "上海・深圳の上場企業の2016〜2023年、金融業と省レベルの参加を除いた28,930企業年（うち参加2,612）で推定した。四大監査法人の有無、国有企業などの部分標本でも比べた（§V）。", "p5": "Gov_auditの係数はMAOで有意に負（係数−0.341、z=−5.152）で、限界効果−0.025は標本平均のMAO率5.4%の約46.3%にあたる。監査報酬では有意に正（0.028、t=3.250）で、平均報酬129万7,954元に対して平均3万6,862元の上乗せに相当し、無限定意見の企業に限っても正（0.024）だった（§V）。", "p6": "著者は、参加の測り方が市レベルのダミーに限られることなどを限界とし、監査パートナー個人の水準での分析を今後の課題とする（§VI）。解釈：意見の差は、監査の質の低下のほか、地元企業の実際のリスクの違いを反映している可能性も残る。", "fun": "役所の監査の仕事をもらっている監査法人は、同じ地域の会社に厳しい意見を出しにくくなっていました。しかも報酬は高めです。お得意様の機嫌を損ねたくない気持ちが、本来は中立であるべき監査人の判断ににじみ出ている、という結果は、制度の思わぬ副作用を示しています。", "unverified": "頑健性検査（傾向スコアなど）の詳細な結果は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "重量不確かな走行車両下の変位で橋梁損傷を同定", "title": "Damage identification and model updating using bridge displacement under moving vehicles with uncertain weight", "url": "https://doi.org/10.1016/j.aei.2026.105355", "authors": "Qi Qi ほか", "venue": "Advanced Engineering Informatics", "date": "2026-10-07", "sjr": 2.021, "citescore": 15.8, "citescore_year": "2025", "apa": "Qi, Q., Fei, J., Han, Z., Cao, J., & Kim, C.-W. (2027).
