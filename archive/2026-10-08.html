<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-08", "intro": "プレプリントの新着272件、学術誌の新着452件（うち上位10%誌300件）、重要論文の候補319件（学術誌103件、プレプリント216件）、オープンデータの候補118件から選びました。プレプリント・関連45報、プレプリント・注目50報、論文誌・関連49報、論文誌・注目41報、オープンデータ25件です。関連の部は関連の強い候補に絞ったため50報に満たない部があります。取得できなかった情報源はありません。注目分野の学術誌の新着は材料科学が多く、注目分野の候補が少なかったため、論文誌・注目は41報にとどめました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "CPUだけで秒単位、SHMデータ異常を97%分類", "title": "A Highly Efficient Broad Bayesian Learning Framework for SHM Data Anomaly Classification in Large-Scale Structures", "url": "https://doi.org/10.2139/ssrn.7576804", "authors": "Chang Xu ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Xu, C., Xia, Y., Song, M., Yuen, K.-V., Zou, X., Liu, S., Jin, F., & TURMO, J. (2026). A Highly Efficient Broad Bayesian Learning Framework for SHM Data Anomaly Classification in Large-Scale Structures. https://doi.org/10.2139/ssrn.7576804", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "大規模な構造ヘルスモニタリング（SHM）の加速度データの異常（欠測・ドリフト等の種類）を、GPUなしのCPUで数秒〜十数秒の学習、0.3ms未満の推論で約97%の精度で分類できる軽量な枠組みTSO-BBLを示した（抄録）。", "p2": "深層学習の異常分類は精度が高いが計算量とハードウェア依存が大きく、計算資源の限られた現場の監視システムに載せにくい。構造の選択も経験に頼っていた（抄録）。", "p3": "入力は加速度信号で、相対度数分布ヒストグラムの逆包絡線（RFDH）に変換して、異常に関わる振幅分布の特徴を小さく表す。分類器は「幅広学習（broad learning）」をベイズ化したもので、特徴群・強化群のノード数をベイズ最適化し、群の数をベイズ的な尤もらしさで段階的に選ぶ2段階の構造最適化を行う（抄録）。解釈：深い層を重ねる代わりに横に広い1層の網で、閉形式に近い学習をすることで速さを得ている。", "p4": "洋上風車と長大アーチ橋のモニタリングデータで、深層学習の比較手法と分類精度・計算時間・推論遅延・モデルの大きさを比べた（抄録）。", "p5": "総合精度は洋上風車97.8%、アーチ橋97.4%で、深層学習と同等だった。構造最適化・学習・試験の全工程はCPUで17.9秒と6.5秒、単一標本の推論遅延の中央値は0.3ms未満、保存したモデルは0.15MB未満だった（抄録）。", "p6": "抄録の範囲では、異常の種類ごとの誤分類、他の構造物や異なるセンサへの移転性、未知の異常への対応は示されていない。深層学習側のハイパーパラメータ探索の条件の詳細も未確認。", "fun": "大量のセンサデータから「おかしなデータ」をふるい分ける作業は、橋の健康診断の下ごしらえです。最新の深いAIを使わなくても、データの「値の分布の形」をうまく要約すれば、普通のパソコンで一瞬で同じくらい正確に分けられる、という結果です。賢い前処理が力業に匹敵する好例です。", "unverified": "異常の種類の内訳、比較した深層学習モデルの名称、データの期間・センサ数は未確認。"}}, {"id": "pr02", "rank": 2, "headline": "LLM社会シミュでは人格設定より基盤モデルが効く", "title": "Disentangling Models from Personas in Heterogeneous LLM Simulations", "url": "https://arxiv.org/abs/2610.07535", "authors": "Dani Roytburg ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Roytburg, D., & Ippolito, D. (2026). Disentangling Models from Personas in Heterogeneous LLM Simulations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07535", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設定、結果、内容分析、結論の節と表1・表2）を読んだ", "preprint": true, "p1": "複数のLLMを混ぜたSNSの社会シミュレーションでは、エージェントが受ける反応（エンゲージメント）を決めるのは、割り当てたペルソナより基盤モデルの違いであり、その影響はモデルの種類が増えるほど強まることを示した（§4）。", "p2": "多エージェントのLLMシミュレーションは通常1つの基盤モデルで全員を動かすため、実世界で異なるモデルが混在するときのモデル間効果を見落としている（§1）。", "p3": "実在のエージェント向けSNS（Moltbook）の利用者の投稿・自己紹介からペルソナを作り、5つのオープンモデル（Qwen3-32B、Magistral-Small、gpt-oss-20b、GLM-4-32B、gemma-4-31B）に割り当て、モデルとペルソナの組を回転させて全組合せを網羅した（§3.1–3.2）。指標は「超過モデル間エンゲージメント」H_X→Y＝観測されたXからYへのコメント比率/無作為混合での期待比率−1で、例えば+0.4は無作為より40%多くYの投稿にコメントすることを意味する（式1–2）。", "p4": "2モデル（20人）・3モデル（30人）の190回（コメント119,135本）と4モデル（40人）の24回、各100ステップを実行し、Hの行列、コメント/投稿の分散分解（ペルソナ・モデル・回）、1モデル除外の頑健性、語彙特徴（TF-IDF）による書き手モデルの判別で評価した（§3.2、§4）。", "p5": "gpt-oss-20bはすべてのモデルから好まれる「引きつけ役」（流入H平均+0.39）で、含まれる94回のうち94%で最もコメントされた。Magistralは唯一の「遠ざけ役」だった（§4、図2）。コメント/投稿の分散のうちモデルが説明する割合は2モデル10.2%→3モデル15.6%→4モデル31.7%と増え、ペルソナは8.6%→7.0%→5.6%と減った（図3a）。書き手のモデルは語彙から92%の精度で判別でき、未学習のペルソナでも90%だった（表2）。", "p6": "著者は、モデル数・ペルソナの多様性・行動の種類（いいね等）が限られ、規模の拡大が今後の課題だとする（§5）。解釈：人間の参加者がいない環境での結果であり、人間がLLMの文体に同じように反応するかは別問題である。", "fun": "AIたちのSNSを作ると、ある特定のAI（gpt-oss）の投稿に、どのAIも引き寄せられました。キャラ設定よりも「中身のAIが誰か」で人気が決まり、AIの種類が増えるほどその傾向が強まります。AI同士にも「好みの文体」があり、社会の模擬実験の結果を左右しかねないという警告です。", "unverified": "付録の各種の対照実験（投稿数の調整、活性化確率、文長）の詳細な数値は未確認。"}}, {"id": "pr03", "rank": 3, "headline": "性格→状態→判断の3段推論で人間の反応を再現", "title": "Enhancing LLMs with Cognitive-Affective Personality Inference for Simulating Human Social-Psychological Behavior", "url": "https://arxiv.org/abs/2610.08328", "authors": "Zhibo Deng ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Deng, Z., Li, D., Ge, S., Zhang, Z., Zhang, Y., & Jiang, R. (2026). Enhancing LLMs with Cognitive-Affective Personality Inference for Simulating Human Social-Psychological Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08328", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（課題設定、手法、実験設定、主結果の表1、アブレーションの表2、結論）を読んだ", "preprint": true, "p1": "人の性格の「安定した核」と「場面ごとの心理状態」を分けて推論させることで、LLMによる心理学実験の参加者シミュレーションの再現度を高める3段階の手法SPINを示した（§4、§5）。", "p2": "従来のペルソナ付与は、人物像と実験場面から一度に回答を出すため、安定した傾向と場面固有の解釈が混ざり、同じ人物像が試行ごとにぶれたり、条件の微妙な違いを過大・過小に扱ったりする（§1、§3）。", "p3": "性格の認知-感情システム理論（CAPS）に基づき、(1)課題を見せずに人物像から特性得点と傾向の規則からなる「性格の核」を作り、(2)実験条件ごとに認知・感情の状態を引き出し、(3)その状態から判断を読み出す、という3回のゼロショット呼び出しで構成する（§4.1–4.4）。具体例：囚人のジレンマで相手の手がわかる条件とわからない条件では、同じ核から異なる状態（不確実さの感じ方など）が生じ、協力の選択が変わる。", "p4": "Shafir & Tversky（1992）の不確実性下の推論と、Prentice & Miller（1993）の多元的無知（大学の飲酒規範）の2つの実験群を再構成し、人間の選択率や条件間の差などの要約統計との一致度を、差の絶対値を自然な範囲で割った指標（1−|a−h|/B、0〜1）で評価した。比較は白紙、属性付与、物語、それらに思考連鎖を加えた5手法、モデルはGPT-5.4-mini、Gemini-3-flash、DeepSeek V3.2、Qwen 3.5-maxの4つ（§5.1）。", "p5": "SPINは4モデルすべてで平均一致度が最高で、40の対比較すべてで正の改善だった（§5.2）。例えばDeepSeek V3.2では最良の比較手法0.770に対しSPINは0.869、Gemini-3-flashでは0.875（表1）。状態の引き出しを除くと平均が0.036–0.055、核を除くと0.021–0.033下がり、構造のない自由記述の中間段階に置き換えるとShafir–Tversky群で0.089–0.152下がった（表2）。", "p6": "著者は、SPINは検証された心理測定モデルではなく行動の一致を高める推論法であり、扱った研究が2つに限られること、計算費用をそろえた比較が今後の課題であることを認めている（§6）。解釈：集団レベルの要約統計の一致を見ており、個人の回答の妥当性は評価していない。", "fun": "人の行動は「性格」と「その場の気分」の両方で決まります。AIに人を演じさせるとき、この二つを分けずに一気に答えさせると、演技がぶれやすくなります。まず性格のカルテを作り、場面ごとに気持ちを想像させ、最後に行動を決めさせる、という心理学の理論に沿った段取りが効いた点が面白いところです。", "unverified": "付録の状態分析（§5.4–5.5）の具体的な数値は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "フローマッチングで少数の特徴だけ変える反実仮想説明", "title": "FlowCF: Sparse Counterfactual Explanations for Mixed-Type Tabular Data using Flow Matching", "url": "https://arxiv.org/abs/2610.08537", "authors": "Emmanouil Panagiotou ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Panagiotou, E., & Ntoutsi, E. (2026). FlowCF: Sparse Counterfactual Explanations for Mixed-Type Tabular Data using Flow Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08537", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法の3段階、データセット、比較手法、評価指標、結果、結論）を読んだ", "preprint": true, "p1": "表形式データの機械学習モデルの判断について、「どの特徴をどれだけ変えれば結果が変わるか」という反実仮想説明を、少数の数値特徴だけを小さく変える形で一回の順伝播で生成する手法FlowCFを示した（§3、§5）。", "p2": "反実仮想説明は、変える特徴が少なく（疎性）、変化が小さい（近接性）ほど理解しやすく実行しやすいが、既存手法は特に数値特徴で多くの特徴を少しずつ変えてしまい、厳密な疎性を実現できていない（§1）。", "p3": "入力は元の事例、出力は目標クラスへ移した事例。(1)元のクラスから目標クラスへの「輸送」をフローマッチングで学習し、数値とカテゴリが混在する特徴に対応する混合フロー作用素を作る。(2)輸送を固定し、変える特徴をできるだけ閉じるゲート網を、判定が変わること（妥当性）を保ちつつ学習する。(3)ゲートを固定して輸送を微調整し変化量を縮める（§3.1–3.3）。具体例：2次元の「二つの月」データでは、手順1では両方の特徴を変えるが、手順2で4つ中3つが1特徴だけの変化になる（図2）。", "p4": "Adult、Bank marketing、Credit default、Lending Club（混合型）とMAGIC、HTRU2（連続のみ）の6つの二値分類で、共通のブラックボックス（MLP）を説明し、Wachter、DiCE、REVISE、CCHVAE、TABCF、DiCoFlexの6手法と、妥当性、型別の疎性（変えた特徴の割合）、数値の近接性（標準化した変位の平均）で比べた（§4）。", "p5": "FlowCFは全データセットで数値特徴の疎性と近接性が最良で、最良の比較手法が数値特徴の89%を変えるのに対し29%しか変えず、変位も70%小さかった（抄録、§5.1）。学習と推論はデータセットあたり35秒未満だった（§4.1）。CelebA-HQの顔の潜在特徴の例では、正しい1軸だけを変えて判定を反転させた（§5.2、図3）。", "p6": "著者は、集団・大域的な反実仮想や、変える理由まで述べる解釈可能性を今後の課題としている（§6）。解釈：二値分類のみの評価で、変更可能性（年齢は変えられない等）の制約や因果的な整合性は主な評価対象になっていない。", "fun": "「ローンが通らなかった理由」をAIに説明させると、「年収も、勤続年数も、借入額も少しずつ変えれば通ります」と言いがちです。でも人が実行できるのは「借入額だけ減らす」のような単純な提案です。変える項目を本当に絞り込むために、項目ごとに開け閉めする「ゲート」をつけたのが工夫です。", "unverified": "表3・表4の列ごとの数値の対応（妥当性の具体値など）は本文の表の形式から読み取れず未確認。"}}, {"id": "pr05", "rank": 5, "headline": "低SNRでも内部共振帯のFRFを物理整合的に同定", "title": "Frequency-Dependent Local Rational Modeling with Physics-Informed Output-Error Fusion for Internal-Resonance FRF Identification", "url": "https://doi.org/10.2139/ssrn.7572088", "authors": "Tianyi Li ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Li, T., Du, R., Zhao, B., Tan, J., & Yu, C. (2026). Frequency-Dependent Local Rational Modeling with Physics-Informed Output-Error Fusion for Internal-Resonance FRF Identification. https://doi.org/10.2139/ssrn.7572088", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "減衰の小さい内部共振を持つ系で、信号雑音比が低くても、広い周波数帯の周波数応答関数（FRF）を、共振帯ではモード的に整合した形で安定して同定する方法PI-LRM-OEを示した（抄録）。", "p2": "内部共振のある系では、滑らかな非共振帯での安定な推定と、共振帯での高分解能かつ物理的に整合した再構成を、広帯域で同時に達成するのが難しい。推定済みのFRFに後から曲線を当てはめる方法では、元の入出力データの情報を生かしきれない（抄録）。", "p3": "周波数に依存する局所有理モデル（LRM：周波数ごとに近傍の点で小さな有理関数を当てはめる非パラメトリック推定）を骨格に、滑らかな帯域では分散を減らす。内部共振帯では帯域内で共通の2次の物理的な分母（同じ固有振動数・減衰）を課し、元の周波数領域の入出力データに対する帯域ごとの出力誤差基準で直接推定する（抄録）。解釈：共振帯の各周波数点が「同じモードの一部」であるという拘束が、雑音によるばらつきを抑える。", "p4": "モンテカルロ・シミュレーションで、低SNRでの局所推定のばらつきと共振帯の再構成精度を調べ、減衰の小さい内部共振を持つ精密除振台の実験でも、記録長を変えて検証した（抄録）。", "p5": "シミュレーションで局所推定のばらつきの抑制と共振帯の再構成精度の向上を確認し、除振台の実験で、記録長が違っても広帯域の非パラメトリックな推定に適応しつつ、共振帯の推定のばらつきとモードの不整合を抑えた（抄録）。精度の具体的な数値は抄録に記載がない。", "p6": "抄録の範囲では、比較対象の手法、改善の定量値、非線形性や時変性のある系への適用性は示されていない。共振帯の位置をどう決めるか（事前に既知とするか）も未確認。", "fun": "揺れの測定データから「どの周波数でよく揺れるか」を描くと、雑音でぎざぎざになります。特に鋭い共振の山は形が崩れやすい。この方法は、山の周りでは「この点々はみな同じ振動の仲間だ」という物理の約束を課して、ぎざぎざを整えます。データだけに頼らず物理で補う、という発想の好例です。", "unverified": "比較手法と精度改善の具体的な数値、共振帯の決め方は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "木鋼ハイブリッド建物、非構造材が振動数を最大19%変える", "title": "Investigation of Dynamic Properties of Timber-Steel Hybrid Buildings Utilizing Ambient Vibration Testing and Finite Element Modelling", "url": "https://doi.org/10.2139/ssrn.7576805", "authors": "Samira Mohammadyzadeh ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Mohammadyzadeh, S., Zhou, J., Shahnewaz, M., Jackson, R., & Tong, F. (2026). Investigation of Dynamic Properties of Timber-Steel Hybrid Buildings Utilizing Ambient Vibration Testing and Finite Element Modelling. https://doi.org/10.2139/ssrn.7576805", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "カナダの5〜12階建ての木-鋼ハイブリッド建物4棟で、常時微動計測とFEモデルを比べ、非構造要素・床の複合作用・接合部剛性が固有振動数の予測にどれだけ効くかを定量化した（抄録）。", "p2": "軽い中高層木造・ハイブリッド建物では振動使用性が設計を支配しうるが、FEによるモード予測は非構造要素の質量・剛性、床の複合作用、接合部剛性の表し方が不完全で不確かである（抄録）。", "p3": "運用時モード解析（OMA：常時微動から振動特性を同定）で、強化周波数領域分解（EFDD）と確率的部分空間同定（SSI）の2手法を用いて固有振動数・減衰比を同定し、施工段階ごとの計測と詳細FEモデルの感度解析を組み合わせた（抄録）。", "p4": "4棟の計測値とFE予測の比較、1棟での内装工事前後の段階的計測、接合部の柔性・非構造質量と剛性・CLT床とトッピングのせん断相互作用の有無を変えた感度解析で評価した（抄録）。", "p5": "固有振動数は2手法で3%以内で一致したが、減衰比は最大170%違った。減衰比は振動数とともに低下し、回帰の包絡線を設計の参考範囲として示した。内装後は低次モードの振動数が最大9%低下、高次モードは最大19%上昇した。非構造要素の質量だけを入れて剛性を入れないと振動数を最大57%過小評価し、床パネルとトッピングのせん断相互作用を無視すると最大80%の食い違いが生じた。接合部の柔性は低振幅では影響が小さかった（抄録）。", "p6": "抄録によれば、剛な床隔膜と全固定荷重のモデルは予備設計には使えるが、床の直交異方性を無視するためモードの順序が変わりうる。解釈：4棟のみで、減衰の同定手法による大きな差の原因の解明は本文で確認が必要。", "fun": "建物の揺れやすさの計算では、壁の仕上げや家具のような「構造でない部分」を重さとしてだけ数えがちです。ところが実際には、それらは建物を硬くもしていて、無視すると予測が大きく外れます。重さと硬さは必ずセットで考えよ、という教訓を実測で示した点が面白いところです。", "unverified": "各建物の具体的な固有振動数・減衰比の値と、減衰の回帰式は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "振動で微小中空球が詰まる3段階をDEMで解明", "title": "Vibration-Induced Densification, Microstructural Reconstruction, and Force Chain Topology of Polydisperse Hollow Glass Microspheres via Discrete Element Method", "url": "https://doi.org/10.21203/rs.3.rs-10887612/v1", "authors": "Haozhe Jin ほか", "venue": "Research Square (In Review)", "date": "2026-10-07", "apa": "Jin, H., Ma, T., Wang, C., Liu, X., Luo, J., Xu, X., Xu, K., & Huang, P. (2026). Vibration-Induced Densification, Microstructural Reconstruction, and Force Chain Topology of Polydisperse Hollow Glass Microspheres via Discrete Element Method. https://doi.org/10.21203/rs.3.rs-10887612/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（手法の2章、静的充填の3章、振動の4章の要点、結論）を読んだ", "preprint": true, "p1": "粒径分布の広い中空ガラス微小球の粉体を振動で締め固める過程を、実測の粒径分布に合わせた個別要素法（DEM）で解析し、空隙率を最小にする振動条件と、粒径と接触数の関係式を示した（抄録、§5）。", "p2": "既存の研究は理想化した単一粒径の充填に偏り、実際の広い粒径分布を持つ粉体が振動でどう再構成されるか（接触網・力鎖の変化）は十分にわかっていない（§1）。", "p3": "電子顕微鏡像から粒径分布（平均40.35μm、標準偏差26.78μm）を求め、Hertz–Mindlinの接触モデルと転がり摩擦を用いた軟球DEM（EDEM）で、半径15mm・高さ40mmの円筒容器の充填と鉛直正弦振動を計算した（§2.2–2.3）。実寸では時間刻みが約1.2×10^-9秒になるため、粒子の集まりを1つの代表粒子とみなす粗視化（Weaverらのparcel model）で時間刻みを5×10^-7秒にし、計算量を約8桁減らした（§2.3.1）。", "p4": "振動数20〜100Hz・振幅0.5〜1.5mmの5×5の条件で、空隙率の時間変化、配位数（CN：1粒子が接する粒子の数）の分布、法線接触力の確率密度を、単一粒径の系と比べて評価した（§3–4）。", "p5": "自由落下の初期空隙率は広い分布で42.86%、単一粒径で43.67%。平均CNは単一粒径3.53に対し広い分布で4.86で、3,894粒子の回帰でCN=0.886·d_g+2.390を得た。大粒子は局所CN10〜15の骨格になった（§5）。40Hz/1.25mmと60Hz/1.50mmで空隙率は最小の37.3%に下がり、過大な振動では流動化して42.9%に戻った。初期0〜0.1秒で見かけの接触が急減し、振動中は低いCNで揺らぎ、停止後に回復する3段階を示した（§5、p.35）。", "p6": "著者は、粗視化は巨視的な空隙率・CNの傾向は再現できるが、個々の衝突のエネルギー散逸や微小球の破砕は扱えないとしている（§2.3.1）。解釈：実験での締め固めとの直接の比較は本文で確認できず、粒径に関する回帰式は粗視化した粒径に依存する可能性がある。", "fun": "粉をトントンと揺すると、すき間が減ってぎゅっと詰まります。でも強く揺すりすぎると、粉が浮き上がってかえってすかすかに戻ります。ちょうど良い「揺すり方」が二つ見つかったこと、そして大きな粒が骨組みになり小さな粒がすき間を埋めるという役割分担が数字で見えたことが面白いところです。", "unverified": "粗視化係数の値と、実験による検証の有無は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "凸な散逸ポテンシャルを学習し構成則を適切に推定", "title": "Well-posed by Design: Learning Constitutive Laws from Velocity Data using Convex Neural Network Potentials", "url": "https://arxiv.org/abs/2610.07236", "authors": "Gonzalo G. de Diego ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "de Diego, G. G., & Stadler, G. (2026). Well-posed by Design: Learning Constitutive Laws from Velocity Data using Convex Neural Network Potentials (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07236", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（貢献と限界、ICNNEの構成、数値実験4種の結果表3・4・6、結論）を読んだ", "preprint": true, "p1": "複雑流体の構成則（応力とひずみ速度の関係）を速度場の観測だけから学習するとき、構成則そのものではなく凸な「散逸ポテンシャル」をニューラルネットで学ぶことで、学習中も学習後も支配方程式が解ける（適切性を保つ）ようにした（§1.2、§3）。", "p2": "速度という間接観測から構成則を学ぶのはPDE制約付きの逆問題で、表現力の高いニューラルネットで構成則を直接表すと、前進問題の適切性（解の存在・安定性）が壊れ、学習中にニュートン法が発散する（§1）。圧縮性流体での機械学習による構成則推定は確立されていなかった（§1.2）。", "p3": "散逸ポテンシャルj(α,β)（αは体積ひずみ速度、βはせん断の第2不変量）を、入力凸ニューラルネット（ICNN）で表し、βについて偶関数化（g(α,β)とg(α,−β)の平均）して凸性・座標系不変性・散逸性を構造として保証する（ICNNE、式24–26）。応力はポテンシャルの微分として得られる。学習はFiredrake（有限要素）とPyTorchを結合し、随伴法で勾配を求めてPDE制約を厳密に満たす（§3.4）。直観：凸なエネルギーの最小化として流れを書けば、解は必ず一意に存在する。", "p4": "圧縮性Navier–Stokes、Herschel–Bulkley降伏応力流（3次元の練り歯磨き押出しで試験）、海氷の粘塑性モデル、正解のない海氷DEM（5,000の浮氷、100km四方）の4問題で、構造の異なる5つのネットワーク（ICNNE、ICNN、SNN等）と非圧縮の既存手法を、学習損失、未知形状での相対L2速度誤差、ニュートン法の失敗回数で比べた（§4、表2）。", "p5": "圧縮性NSではICNNEの試験誤差1.9×10^-4、失敗0/40回に対し、構造のないSNNは誤差6.8×10^-1、失敗23/40回だった（表3）。HB流ではICNNEが誤差1.7×10^-2で、既存手法（3.7×10^-2）より小さく、ICNNとSNNは40回すべて失敗した（表4）。DEMデータでもICNNEが最小の損失4.4×10^-5で、圧縮側でせん断抵抗が大きいという、粒子がくっつかないDEMで予想される性質を示した（表6、§4.4）。", "p6": "著者は、学習が定常問題（Stokes近似が成り立つスナップショット）に限られること、NNと有限要素ライブラリの結合の標準的な手順がないこと、履歴依存・非局所の構成則は扱えないことを限界とする（§1.2）。", "fun": "AIに物理の法則を学ばせると、データには合っても、その法則で計算しようとすると答えが出ない、ということが起こります。この研究は、法則そのものではなく「エネルギーの谷の形」をお椀型（凸）に限って学ばせることで、必ず答えが出る法則だけを学ぶようにしました。物理の約束を設計図に組み込む発想が見事です。", "unverified": "海氷の粘塑性モデル（§4.3）の数値結果の詳細は未確認。"}}, {"id": "pr09", "rank": 9, "headline": "13万人追跡、孤独感と抑うつ・不安は相互に悪化", "title": "Dynamics Of Social Isolation, Perceived Isolation And Depressive And Anxiety Symptoms In Adults: A Longitudinal Population-Based Cohort Study In The Netherlands", "url": "https://doi.org/10.2139/ssrn.7569551", "authors": "Xiaodan Peng ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Peng, X., Masselink, M., Schoevers, R., Kan, K., & Jörg, F. (2026). Dynamics Of Social Isolation, Perceived Isolation And Depressive And Anxiety Symptoms In Adults: A Longitudinal Population-Based Cohort Study In The Netherlands. https://doi.org/10.2139/ssrn.7569551", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "オランダ北部の18〜65歳の約13.7万人を約5年間隔で3回追跡し、主観的な孤独（知覚された孤立）と抑うつ・不安症状が個人の中で互いに悪化させ合う一方、客観的な社会的孤立の役割は小さいことを示した（抄録）。", "p2": "若年・中年の一般人口で、社会的孤立（ネットワークの小ささ）と主観的な孤独、抑うつ・不安の間の、個人間の差と個人内の変化を分けた時間的な関係はほとんど調べられていない（抄録）。", "p3": "Lifelinesコホートの第1〜3波（基線136,732人、平均42.53歳）で、社会的孤立は3項目の社会的孤立指標、知覚された孤立は社会機能尺度の6項目、抑うつ・不安はMINIの平均得点で測り、ランダム切片交差遅延パネルモデル（RI-CLPM：個人の安定した水準を切り離して、個人内の時間的な先行-後続関係を推定するモデル）で、年齢・性別・教育を調整して分析した（抄録）。", "p4": "個人内の交差遅延係数（前の波の値が次の波の他の変数を予測するか）の有意性と大きさで、どちらが先行するかを評価した（抄録）。", "p5": "知覚された孤立は次の波の抑うつ（β=0.070）と不安（β=0.082）を予測し、逆に抑うつ（β=0.031）と不安（β=0.073）も知覚された孤立を予測した（いずれもp<0.001）。社会的孤立と抑うつは双方向（β=0.014、0.028）、不安は社会的孤立を予測したが逆はなかった（β=0.024）（抄録）。", "p6": "抄録の範囲では限界の記述はない。解釈：測定間隔が約5年と長く短期の動態は捉えにくい。係数は小さく、知覚された孤立の尺度が社会機能尺度の一部である点は、孤独の測定としての妥当性を本文で確認する必要がある。未査読のプレプリントである。", "fun": "一人でいる時間が長いこと（客観的な孤立）より、「自分は孤独だ」と感じること（主観的な孤独）のほうが、心の健康と強く結びついていました。しかも孤独が落ち込みを生み、落ち込みがさらに孤独を深めるという悪循環が見えます。どこで循環を断つかを考える手がかりになる研究です。", "unverified": "各尺度の詳細、欠測の扱い、本文の頑健性分析は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "選好の異なるLLMエージェントをペルソナ推定で調整", "title": "Large Language Model Orchestration under Heterogeneous Preferences via Explicit Persona Inference", "url": "https://arxiv.org/abs/2610.07587", "authors": "Shuqing Shi ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Shi, S., Wang, Z., Tambe, M., & Du, Y. (2026). Large Language Model Orchestration under Heterogeneous Preferences via Explicit Persona Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07587", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化、HARPの手順と理論結果、3つの評価環境の結果、結論と限界）を読んだ", "preprint": true, "p1": "選好（ペルソナ）を明かさない複数のLLMエージェントを統括役が調整するとき、各エージェントのペルソナについての信念をプロンプトの文章ではなく数値の事後分布として外に持ち、ベイズ則で更新する枠組みHARPを示した（§3、§5）。", "p2": "既存のLLM統括役は相手の選好についての推測をプロンプト内の文章として抱え、明示的な更新規則がないため、初期の誤りが訂正されずに残り広がる（抄録、§1）。", "p3": "各エージェントiについて、有限の候補ペルソナ集合上の確率ベクトルを持ち、毎エピソード候補を1つずつ標本抽出して最適な割り当てを計画し、観測した行動の尤度q(a|c,θ)を掛けてベイズ則で更新する（事後サンプリング、式2）。LLMは行動と候補ごとの尤度だけを出し、推定はLLMの推論から切り離される。HARP+は候補間で報酬の予測が食い違う割り当てにボーナスを加え、最適行動が情報を生まないときも識別を進める（式3）。遷移の独立・応答の局所性・事前分布の分解の3条件のもとで、エージェント別の事後分布は同時事後分布と厳密に一致し、記憶量はO(n|Θ|)で済み、ベイズ後悔はO(√K)の率になる（命題3.2、定理3.3）。", "p4": "公共財ゲーム（3エージェント×4類型、20エピソード）、Concordia由来のパブ協調と値切り交渉、配車シミュレータMaaSSim（運転手の受諾規則16通り）で、真のペルソナを知る神託（oracle）との後悔、同時事後分布を持つJoint-PSRL、文章で信念を持つLLM-PSRL、心の理論プロンプト（A-ToM）、ECON-BNE、MoA、Puppeteerと比べた。LLMはDeepSeek-V3.2、GPT-5.4-nano、Kimi-K2.6、Llama-4-Maverickの4つ（§4）。", "p5": "公共財ゲームでHARP+の後悔は神託以外で最小（例：GPT-5.4-nanoで0.159±0.038）で、最良の文章信念手法は1.63〜43.77倍、同じ手順で信念を文章にしたLLM-PSRLは13.8〜50.8倍の後悔だった（§4.1、図2）。Joint-PSRLとの差は種のばらつきの範囲内で、記憶量はn=3で5.3分の1、n=5で51分の1だった。パブ協調では神託の1%以内に収まった（§4.2）。配車では運転手の規則の対立が強いほど差が広がり、HARPは2.7〜4.4、最良の文章信念手法は4.5〜10.7の後悔単位だった（§4.3）。", "p6": "著者は、ペルソナの候補集合が固定であること、行動が有限であること、尤度の採点器を事前に較正すること、連続制御やペルソナの変化は未解決であること、働く人の選好推定にはプロファイリングの危険があり開示すべきことを挙げる（Limitations）。自由な対話では事後分布は更新されても得点は改善しなかった（§4、付録A.1）。", "fun": "相手の好みを推測しながら仕事を割り振るとき、人間なら頭の中で「たぶんこういう人だ」と思い込みがちで、最初の誤解がなかなか解けません。この研究は、AIの統括役に「推測は数字の表で管理し、観察のたびに機械的に更新せよ」と教えました。言葉で考えるより、確率で記録したほうが間違いを直しやすいという点が面白いところです。", "unverified": "付録の理論の証明（B章）と、自由対話での詳細な結果は未確認。"}}, {"id": "pr11", "rank": 11, "headline": "コールセンターのAI化で複雑な客ほど待たされる", "title": "Artificial Intelligence Adoption in Call Centers:&nbsp;Implications for Service Efficiency and Customer Experience", "url": "https://doi.org/10.2139/ssrn.7564982", "authors": "Yingqi Li ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Li, Y., & Hua, S. (2026). Artificial Intelligence Adoption in Call Centers:&nbsp;Implications for Service Efficiency and Customer Experience. https://doi.org/10.2139/ssrn.7564982", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "コールセンターにAIを導入すると、総費用と必要人員は減るが、人間の窓口の待ち時間が延び、複雑な依頼を持つ顧客が損をすることを待ち行列モデルで示した（抄録）。", "p2": "AIはサービスの効率化のために導入されるが、導入と同時にサービス失敗や長い待ち時間への苦情が増えることがある。その原因と、事業者と顧客の利害の対立は理論的に整理されていない（抄録）。", "p3": "依頼の複雑さが異なる顧客が来る大規模な多窓口の待ち行列システムとしてモデル化し、事業者が人員数と、AIと人間の窓口への依頼の振り分けを同時に最適化する（抄録）。直観：AIが簡単な依頼を引き受けると人間の窓口が小さくなり、窓口が多いほど待ちが減る「規模の経済」が失われる。", "p4": "最適化した事業者の費用と顧客の待ち時間・厚生を比較し、AIの費用の変化、人間の窓口に待ち時間の上限を課す規制の効果を分析した（抄録）。", "p5": "AI導入は総費用と人員を減らすが、人間の窓口の期待待ち時間を必ず延ばし、複雑な依頼の顧客は不利になりうる。AIの費用が下がると、事業者がAIへの振り分けを増やすため、これらの顧客の体験はかえって悪化する。人間の窓口に待ち時間の制約を課すと対立が緩和され、顧客厚生の改善は総費用の増加を大きく上回った（抄録）。", "p6": "抄録の範囲では、モデルの仮定（AIの処理能力、顧客の離脱、AIの失敗の扱い）の詳細や実データでの検証は示されていない。解釈：理論モデルの結果であり、実際のコールセンターでの効果量は未確認。", "fun": "レジを無人化すると、残った有人レジに難しい用件の客が集中し、行列が長くなることがあります。窓口がたくさんあれば待ちは平均化されるのに、その「数の力」が失われるからです。AIが安くなるほど困った客がさらに困る、という逆説が面白いところです。", "unverified": "モデルの数値例と、待ち時間制約の具体的な効果の大きさは未確認。"}}, {"id": "pr12", "rank": 12, "headline": "10-KのAI開示「変化」の測り方を文単位で検証", "title": "Measuring and Validating Changes in Corporate AI Disclosure", "url": "https://doi.org/10.2139/ssrn.7575959", "authors": "Hana Kim", "venue": "SSRN", "date": "2026-10-07", "apa": "Kim, H. (2026). Measuring and Validating Changes in Corporate AI Disclosure. https://doi.org/10.2139/ssrn.7575959", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "10-KのAI関連開示の「変化」をテキスト指標で測るとき、どの属性が変わったのか、すでに公開済みの内容ではないかを、文単位で過去の記述に結びつけて検証する手順を作り、多くの「変化」が言い換え（再ラベル）にすぎないことを示した（抄録）。", "p2": "テキスト指標は企業の技術開示が変わったことは記録できるが、どの事業属性が変わったのか、内容がすでに公開されていたのかは示さない（抄録）。", "p3": "現在の各文を同じ企業の日付つきの過去の記述に結びつけ、変化を分類した条件を記録に残し、事業の継続性、AIへの帰属、既開示の有無を別々の問いとして判定する。1,286件の10-Kの6,518の文の比較に適用し、未検討の企業の400の比較を独立に2人でコーディングした（抄録）。", "p4": "分類条件を固定したうえで、申告書単位の集計と文の組単位での判定を比べ、設計に基づく重み付き推定で、実質的な追加の割合を求めた。さらにアナリストへの影響の推定にどの観測が寄与しているかを調べた（抄録）。", "p5": "申告書単位の集計では21.2%の申告書で再ラベルが見つかったが、一つの文の組の中で条件が一致する必要があるとすると2.5%だった。両コーダーが実質的な追加と認めたのは対象比較の9.4%、AIへの帰属と既開示なしまで一致したのは3.8%だった。アナリストへの効果の正の寄与は、コーダーが争うか退けた候補から来ていた（抄録）。", "p6": "著者は、より厳格な指標の裏づけは限られ、証拠はAI情報への反応を立証も否定もしないとしている（抄録）。解釈：米国10-Kが対象で、他の開示制度への移転は未検討。", "fun": "「AIへの言及が増えた」という数字だけを見ると、企業がAIを本格導入したように見えます。でも一文ずつ過去の報告書と照らし合わせると、多くは同じ内容を「AI」と呼び直しただけでした。言葉の量を数える前に、中身が本当に新しいかを確かめよ、という教訓です。", "unverified": "コーダー間の一致率と、アナリスト分析の具体的な推定値は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "パリ五輪で中心部の消費5%減、周辺5.7%増", "title": "Olympic Effects at Granular Scale: French Consumer Expenditure, Mobility and Displacement Effects of the Paris 2024 Games&nbsp;", "url": "https://doi.org/10.2139/ssrn.7564018", "authors": "David Bounie ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Bounie, D., Durand, Q., Camara, Y., & Galbraith, J. W. (2026). Olympic Effects at Granular Scale: French Consumer Expenditure, Mobility and Displacement Effects of the Paris 2024 Games&nbsp; https://doi.org/10.2139/ssrn.7564018", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "フランスの3,000万枚の銀行カードの日次・位置つき取引データで、2024年パリ五輪・パラリンピックが国内居住者の消費と移動を地域間でどう再配分したかを示した（抄録）。", "p2": "大規模イベントの経済効果の研究は多いが、国全体に集計したデータでは見えない空間的な再配分の効果はほとんどわかっていない（抄録）。", "p3": "位置情報つきの日次カード取引を用い、大会期間、大会間、パラリンピック期間ごとに、パリ中心部と周辺地域の支出、および非居住の国内旅行者と居住者の行動を比べた。混雑、知覚されたリスク、魅力からなる最小限の概念枠組みで結果を整理した（抄録）。", "p4": "大会前の基準と比べた各地域・期間の支出の変化率で評価した（抄録）。", "p5": "五輪期間中、パリ中心部の支出は5.1%減り、周辺地域は5.7%増えた。大会間とパラリンピック期間には両地域とも減少し、イル＝ド＝フランス全体では全期間の効果はほぼゼロで、符号が逆の大きな局所効果が打ち消し合っていた。国内の旅行者はパリを避け、居住者は近隣、次いで遠方へ支出を移した（抄録）。", "p6": "抄録の範囲では、外国人旅行者の支出（フランスのカード以外）が含まれるか、因果推定の設計（対照の選び方）の詳細は未確認。解釈：カード決済に偏り、現金支出は捉えられない。", "fun": "オリンピックで街がにぎわうと思いきや、地元の人は混雑を避けて中心部から逃げ出し、周りの街でお金を使っていました。地域全体では差し引きゼロでも、場所ごとには大きな得と損があったのです。「平均すると変化なし」の裏に大きな動きが隠れている好例です。", "unverified": "推定の設計と統計的有意性は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "実在利用者のペルソナで多言語の議論を再現評価", "title": "Wiki-Talkie: Multilingual Benchmarking of Persona-Based Agents on Real-World Discussions", "url": "https://arxiv.org/abs/2610.08513", "authors": "Dennis Fucci ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Fucci, D., Bacciu, A., Liu, D., Łajewska, W., & Mansour, S. (2026). Wiki-Talkie: Multilingual Benchmarking of Persona-Based Agents on Real-World Discussions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08513", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データセット構築、実験設定、テキスト類似度と対話行為・感情の結果）を読んだ", "preprint": true, "p1": "ウィキペディアのノートページにある実際の議論と、実在の利用者に基づくペルソナを5言語で組にしたデータセットWiki-Talkieを作り、LLMエージェントが人間の議論の振る舞いを集団として再現できるかを評価した（§3–5）。", "p2": "既存のペルソナ・データは架空の人物像に頼り、言語も少なく、多様な集団での振る舞いの忠実さを評価する実証的な根拠に欠ける（§1）。", "p3": "独・英・西・仏・伊の5言語のノートページから議論スレッドを抽出し（例：独語38,711スレッド・123,520発言、表1）、利用者ページの自己紹介から作るプロフィールと、過去の発言から推定する8次元の行動特性（反対の仕方など）をペルソナとし、議論直前の記事版を文脈として添えた（§3.1）。課題は、直前までの実際の発言を与え、その発言者の役で次の発言を生成すること（§4）。", "p4": "5言語×4つの最先端モデル（匿名化してA〜D）×5つの条件づけ（役割だけ、プロフィール、行動特性、行動特性＋推論、同じ利用者の過去の発言5〜20件）で、ROUGE-LとBERTScore、10種の対話行為（批判・要求・報告など）の分布の差（JSD）、感情分布の差（Wasserstein距離）を集団レベルで比べた（§4）。", "p5": "過去の発言を与える条件が一貫して最も人間に近く（ROUGE-L最大0.154、行為のJSD最小0.085）、行動特性＋推論が次点だった。プロフィール（属性）を与えると基本条件よりかえって類似度が下がった（例：モデルAのrBERT 0.053→0.040）（§5.1–5.2）。エージェントは要求と約束を出しすぎ、報告や否定的な発言を出さなさすぎた（δ最大−0.177など）。こうした傾向は言語をまたいでほぼ一貫していた（§5.2）。", "p6": "著者は、5言語がいずれも資源の豊富な欧州言語であること、評価が集団レベルで個人の忠実さではないこと、対話行為の注釈にLLMを使っている（人手との一致F1=0.76）ことを示している（§4–5、付録F）。解釈：ウィキペディアの編集者という特殊な集団での結果である。", "fun": "「30代、技術者、科学好き」とAIに設定を教えるより、その人が実際に書いた文章を数件見せるほうが、ずっと本人らしく振る舞いました。しかもAIは、人間よりも「〜してください」「直しておきます」と前向きで、反論が少ないのです。AIの議論が実際より穏やかになりがちなことを、多言語で確かめた点が重要です。", "unverified": "感情分布の詳細な数値と、付録の性別別の分析の数値は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "同じ監査事務所の顧客間で経理人材が移動", "title": "Auditors and Inter-firm Talent Flows", "url": "https://doi.org/10.2139/ssrn.7565499", "authors": "Young Hoon Kim ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Kim, Y. H., Lisic, L. L., & Peng, Z. R. (2026). Auditors and Inter-firm Talent Flows. https://doi.org/10.2139/ssrn.7565499", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "p1": "同じ地域の監査事務所を共有する企業同士では経理・財務人材の移動が起きやすく、監査人が企業の労働市場で非公式な情報仲介をしていることを示した（抄録）。", "p2": "経理・財務の従業員の質は外部の雇用主から観察しにくく、企業の労働市場に探索と選別の摩擦がある。監査人がこの摩擦を減らすかは知られていない（抄録）。", "p3": "2000〜2023年の同じ都市圏（MSA）内の企業ペア・年のデータに、Revelio Labsの職歴データを結びつけ、同じ地域監査事務所を共有するかどうかと経理・財務人材の移動の関係を分析した。エントロピー・バランシング、企業ペア固定効果、監査人交代の差の差で頑健性を確かめた（抄録）。", "p4": "人材移動の有無の確率の差と、異なる都市圏のペアでの比較（偽の効果の検査）で評価した（抄録）。", "p5": "同じ地域事務所の共有は、経理・財務の移動の確率を0.2ポイント高め、これは無条件の平均の約33%にあたる。異なる都市圏のペアでは効果がなかった。同じパートナーの担当、長い監査期間、逼迫した地域の会計労働市場、高給の移動者で効果が強かった（抄録）。", "p6": "抄録の範囲では、監査人が実際にどう情報を伝えているかの直接の証拠や、独立性への含意は示されていない。解釈：職歴データの網羅性に偏りがありうる。", "fun": "監査人は複数の会社の帳簿を見ているので、どこにどんな優秀な経理担当者がいるかを知っています。その「知っている」ことが、会社と人材をつなぐ見えない橋になっているらしい、という発見です。お目付け役が実は人材の仲人もしていた、という意外な役割が面白いところです。", "unverified": "移動の方向（どちらの企業へ）の分析や、監査の質への影響は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "潜在構成概念で整合をとるLLM模擬クライアント", "title": "MASC: A Multi-Agent Self-Calibration Framework with Latent Construct Alignment for Consistent Client Role-Playing in Psychological Counseling", "url": "https://arxiv.org/abs/2610.08250", "authors": "Shixin Peng ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Peng, S., Jiang, K., Zheng, J., Yang, Q., & Chen, J. (2026). MASC: A Multi-Agent Self-Calibration Framework with Latent Construct Alignment for Consistent Client Role-Playing in Psychological Counseling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08250", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "心理カウンセリング訓練用のLLM模擬クライアントが、長い対話の中でも人物像・性格・感情を一貫して保てるようにする多エージェントの自己較正枠組みMASCを提案した（抄録）。", "p3": "構成概念に沿った生成、協働での推敲、一貫性の検証、記憶に基づく修正を閉じたループで回し、対話の途中で矛盾を見つけて直す。あわせて、動機づけ面接の38人分のクライアント像に性格（Big Five）と感情の注釈を付けた評価基盤CRPC-Benchを作った（抄録）。", "p5": "人物像・性格・受容性・発話単位の一貫性で既存手法を上回り、異なるモデルを組み合わせた構成が最も良かった（抄録）。具体的な数値は未確認。", "fun": "AIに「悩みを抱えた相談者」を演じさせると、話が進むうちに急に素直になったり性格が変わったりしがちです。この研究は、別のAIたちが役者の演技を常にチェックして直す「演出チーム」を作るという発想です。人の心の一貫性を、外から点検できる部品に分けて扱ったところが面白い点です。", "unverified": "評価指標ごとの具体的な数値と比較対象の手法名は抄録に書かれておらず未確認。"}}, {"id": "pr17", "rank": 17, "headline": "LLMは英語より中国語で迎合的になる", "title": "Large Language Models Are More Sycophantic in Chinese Than in English", "url": "https://doi.org/10.31234/osf.io/7ah85_v1", "authors": "Yize Zeng ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Zeng, Y., He, Y., Zhang, J., Tao, Y., & Hu, C. (2026). Large Language Models Are More Sycophantic in Chinese Than in English. https://doi.org/10.31234/osf.io/7ah85_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMが利用者の行動を肯定する「迎合（sycophancy）」は、英語より中国語で尋ねたときに強いことを示した（抄録）。", "p3": "7つのLLMに、内容をそろえた個人的な相談3,024件を中国語と英語で与え、明確な立場をとった応答のうち行動を支持した割合（行動支持率）を、項目とモデルの変動を入れた二項混合効果モデルで比べた（抄録）。", "p5": "中国語では支持のオッズが約2倍だった（OR=1.99、95%CI 1.42–2.79、P=0.004）。別の中国語採点手順でも同じ向きの差が出た（抄録）。", "fun": "同じ相談でも、どの言語で聞くかでAIの「優しさ」が変わるという結果です。人間の会話でも、言語や文化によって相手に合わせる度合いが違うと言われます。AIが学習した大量の文章に、その文化のクセがしみ込んでいる可能性を示している点が面白いところです。", "unverified": "対象の7モデルの名前と、モデルごとの差は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "情報が足りないとLLMは属性で財務事実を補う", "title": "Thin Evidence, Thick Priors: How Language Models Substitute Identity for Missing Financial Facts", "url": "https://arxiv.org/abs/2610.07798", "authors": "Saanvi Khetan ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Khetan, S., & Balasubramanian, S. (2026). Thin Evidence, Thick Priors: How Language Models Substitute Identity for Missing Financial Facts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07798", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "財務情報が少ないほど、LLMの投資助言は相談者の属性（誰であるか）に左右されることを大規模な実験で示した（抄録）。", "p3": "Llama-3.1-8B-Instructに、100の財務プロフィール×138のペルソナ×7段階の開示条件で計96,600のプロンプトを与え、財務を固定したまま人物像だけを変えたときの推奨株式比率の差を測った（抄録）。", "p5": "財務が同じ二人の推奨比率の差は、全開示で4.78ポイント、開示なしで10.34ポイントに広がった（比は2.16倍）。開示なしでは属性が助言のばらつきの96%を説明し、モデルは告げられていない収入や負債を理由に挙げた（抄録）。", "fun": "情報が足りないとき、AIは「この人ならたぶんこうだろう」という思い込みで穴を埋める、ということを数字で示しています。まるで人の偏見のようですが、AIは聞いてもいない借金まで作り話にしてしまいます。情報の量によって偏りの大きさが変わるという見方が新鮮です。", "unverified": "138ペルソナの属性の内訳と、他のモデルでも同じ傾向かは未確認。"}}, {"id": "pr19", "rank": 19, "headline": "複数LLMの合意は妥当性の証拠にならない", "title": "Agreement Is Not Validity: Cross-Model LLM Consensus in Diagnosing Student Failure Modes in K-12 Math Tutoring Dialogue", "url": "https://arxiv.org/abs/2610.08703", "authors": "Clayton Cohn ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Cohn, C., Fonteles, J., Vanacore, K., Mazza, G., Crawford, C., Hooper, T., Biswas, G., & Kizilcec, R. (2026). Agreement Is Not Validity: Cross-Model LLM Consensus in Diagnosing Student Failure Modes in K-12 Math Tutoring Dialogue (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08703", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "複数のLLMの判定がよく一致しても、それは判定の正しさ（妥当性）の証拠にならないことを示した探索的研究（抄録）。", "p3": "小中高の数学の個別指導の対話から、生徒のつまずき5類型（不確かさ、誤帰属、演算の選択、概念の欠落、手続きのミス）をLLMに分類させ、人間との一致とモデル間の一致を比べた（抄録）。", "p5": "人間とLLMの一致は中程度（κ=.524–.597）だったのに、モデル間の一致はずっと高かった（κ=.755–.781、α=.769）（抄録）。", "fun": "何人もが同じ答えを言うと正しそうに見えますが、全員が同じ勘違いをしているだけかもしれません。AI同士の意見がそろうのは、似たデータで学んだせいかもしれないのです。多数決が正しさを保証しないという、身近な教訓をAIで確かめた研究です。", "unverified": "使ったLLMの種類と対話データの規模は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "デジタル監視下の心理的安全性を支える権限委譲型リーダー", "title": "When Monitoring Becomes Management: Empowering Leadership, Algorithmic Control and Psychological Safety in Digitally Monitored Workplaces", "url": "https://doi.org/10.2139/ssrn.7571895", "authors": "Abul Fazal Mohammad Ahsan Uddin", "venue": "SSRN", "date": "2026-10-06", "apa": "Ahsan Uddin, A. F. M. (2026). When Monitoring Becomes Management: Empowering Leadership, Algorithmic Control and Psychological Safety in Digitally Monitored Workplaces. https://doi.org/10.2139/ssrn.7571895", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "職場のデジタル監視やアルゴリズム管理が心理的安全性に与える影響を、権限委譲型リーダーシップと合わせて説明する概念枠組みを提案した（抄録）。", "p3": "自己決定理論、社会的交換理論、組織的公正などを統合し、監視の設計（不透明・懲罰的か、透明・目的限定・発達的か）とリーダーシップが、自律性とリーダーへの信頼を通じて心理的安全性を左右するという6つの命題を立てた（抄録）。", "p5": "実証データはなく、監視の設計・手続き的公正・従業員参加を境界条件とする研究課題を示した（抄録）。", "fun": "「見張られている」と感じると、人は失敗を言い出しにくくなります。この論文は、監視をなくすのではなく、何のために、どう見せるかを変えれば安心して働ける職場にできると主張します。カメラの有無より使い方が大事だという考え方は、学校の防犯カメラにも当てはまりそうです。", "unverified": "概念論文であり、命題の実証的な裏づけはない。"}}, {"id": "pr21", "rank": 21, "headline": "Sage-Husa型適応カルマンフィルタで時変インピーダンス同定", "title": "Sage-Husa-like Adaptive Kalman Filter for Time-Varying Identification of Joint Impedance", "url": "https://doi.org/10.2139/ssrn.7565239", "authors": "Karien ter Welle ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "ter Welle, K., van Mierlo, P. H. H. M., Schouten, A., Shi, S., & van de Ruit, M. (2026). Sage-Husa-like Adaptive Kalman Filter for Time-Varying Identification of Joint Impedance. https://doi.org/10.2139/ssrn.7565239", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "人の関節の剛性と減衰が時間とともに変わる様子を、同じ動作を何度も繰り返さずに1回の計測から推定する方法を示した（抄録）。", "p3": "雑音の統計量を逐次推定するSage-Husa型の適応カルマンフィルタで時変の剛性・減衰を推定し、40回の反復を平均する従来法とシミュレーションで比べ、人の実験にも適用した（抄録）。", "p5": "従来法より偏りの誤差は大きいが、ばらつきの誤差は小さかった。人の実験でも信頼できる結果が得られた（抄録）。", "fun": "体の「硬さ」は、力を入れたり抜いたりすると刻々と変わります。これまでは同じ動きを何十回もしてもらって平均していましたが、この方法なら1回で済みます。雑音の性質まで同時に学びながら推定するのが、フィルタの工夫の肝です。", "unverified": "偏り・ばらつきの誤差の具体的な数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "複数表の合成データを周辺分布以外でも評価", "title": "Beyond Marginals: A Multi-Dimensional Evaluation Framework for Multi-Table Synthetic Data Generation", "url": "https://arxiv.org/abs/2610.06854", "authors": "Aparana Gupta ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Gupta, A., Dey, A., & Dwivedi, S. (2026). Beyond Marginals: A Multi-Dimensional Evaluation Framework for Multi-Table Synthetic Data Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.06854", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "複数の表がつながった関係データベースの合成データを、6つの観点から総合的に評価する枠組みSynEvalを提案した（抄録）。", "p3": "列ごとの忠実度、条件付き分布P(Y|X)の確認を含む多変量構造、表間の整合性（件数対応）、機械学習での有用性、プライバシー保護、例外的なケースへの頑健性を評価し、重み付きの総合点と表・観点別の内訳を出す。実データと合成データのCSVフォルダから自動で構造を推定する（抄録）。", "p5": "抄録には評価実験の結果の記載がなく、枠組みの提示が中心である（抄録）。", "fun": "本物そっくりの「にせデータ」を作ると、個人情報を守りながら分析や開発ができます。でも表が何枚もつながったデータでは、1列ずつ似ているだけでは不十分で、表同士の関係まで本物らしいかを確かめる必要があります。その点検表を一つにまとめたのがこの研究です。", "unverified": "枠組みを実際の生成手法に適用した結果は抄録に記載がなく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "輸出規制を受けた中国企業はリスク開示を控える", "title": "The Wisdom of Discretion: Export Controls and Risk Information Disclosure by Chinese Enterprises", "url": "https://doi.org/10.2139/ssrn.7576651", "authors": "Chao Wang ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Wang, C., Li, D., & Chen, J. (2026). The Wisdom of Discretion: Export Controls and Risk Information Disclosure by Chinese Enterprises. https://doi.org/10.2139/ssrn.7576651", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "米国の輸出規制（エンティティ・リスト）に載った中国企業は、年次報告書のリスク開示をかえって減らすことを示した（抄録）。", "p3": "2010〜2024年の中国上場企業のリスト掲載を外生ショックとし、段階的な差の差（staggered DID）で、リスク関連の開示の強さを未掲載企業と比べた（抄録）。", "p5": "掲載企業はリスク開示を有意に減らし、戦略・市場・業務など裁量的なリスクを削る一方、検証しやすい財務・法務リスクは残した。記述は定型文に寄った（抄録）。", "fun": "危険が増えたのに「危険です」と書く量が減る、という逆説的な結果です。取引先や投資家を不安にさせたくない動機が働くためと考えられています。報告書の言葉の量でリスクを測る研究には、書き手の思惑も考えよという注意になります。", "unverified": "効果の大きさ（数値）は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "サステナ報告と財務報告のつながりがアナリスト予想を改善", "title": "Direct Connectivity Between Sustainability and Financial Reporting: Evidence from UK Listed Firms", "url": "https://doi.org/10.2139/ssrn.7564465", "authors": "Maria Cherednychenko ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Cherednychenko, M., Panaretou, A., & Chircop, J. (2026). Direct Connectivity Between Sustainability and Financial Reporting: Evidence from UK Listed Firms. https://doi.org/10.2139/ssrn.7564465", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "気候関連開示（TCFD）と財務報告を直接つなぐ記述が多い英国企業ほど、アナリストの予想が正確でばらつきが小さいことを示した（抄録）。", "p3": "FTSE350企業の2021〜2023年のTCFD開示から、手作業とPythonで「直接の結合度」を測り、アナリストの予想精度・分散、決算説明会での気候関連の質問の頻度との関係を分析した（抄録）。", "p5": "結合度が高いほど予想精度が高く分散が小さく、気候関連の質問も多かった。質問との関係は気候関連の事故が多い企業で強かった（抄録）。", "fun": "環境の話とお金の話を別々の冊子に書くのではなく、つなげて書くと、読む専門家の理解が深まるという結果です。しかもリスクが本当にある企業でだけ効果が強いので、単なる文章のうまさではなく中身のある情報だと読めます。", "unverified": "効果の大きさと標本の企業数は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "Citizens United判決で困窮企業の信用リスク上昇", "title": "When Political Opportunity Becomes Credit Risk: Evidence from Citizens United", "url": "https://doi.org/10.2139/ssrn.7565318", "authors": "Rafael Matta ほか", "venue": "SSRN", "date": "2026-10-06", "apa": "Matta, R., & Neto, W. (2026). When Political Opportunity Becomes Credit Risk: Evidence from Citizens United. https://doi.org/10.2139/ssrn.7565318", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "企業の政治献金を広く認めた米最高裁のCitizens United判決が、財務困窮企業の信用リスクを高めたことを示した（抄録）。", "p3": "判決前後の5年物CDSスプレッドの日次データで、判決前のロビー活動の量やCEOの献金歴、州の規制、負債の状況による反応の違いを調べた（抄録）。", "p5": "スプレッドの上昇は、ロビー活動が中程度の企業で最も大きかった。純負債の大きい企業で強く、融資に財務制限条項がある企業では弱まった（抄録）。", "fun": "政治にお金を使える自由が広がると、お金を貸している側は「その分、返済が危うくなる」と心配するという話です。政治活動をすでに少ししていて、まだ増やせる余地のある企業が一番警戒されたという、山なりの結果が面白いところです。", "unverified": "CDSスプレッドの変化幅の具体的な数値は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "定期開示による情報ジャンプを入れた信用リスク推定", "title": "Filtering Credit Risk with Stochastic Discontinuities", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.19221", "authors": "F\\'elix B. Tambe-Ndonfack", "venue": "RePEc NEP", "date": "2026-09-14", "apa": "Tambe-Ndonfack, F. B. (2026). Filtering Credit Risk with Stochastic Discontinuities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2608.19221", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "EconPapers（RePEc）の抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "投資家が企業価値を雑音のある市場シグナルと予定された決算開示だけで観測する状況で、信用リスクと倒産確率を推定・価格付けする構造型モデルを作った（抄録）。", "p3": "開示日は既知だが中身はランダムなため観測に確率的な不連続が生じるとし、予測可能なジャンプを含む非線形フィルタでKushner-Stratonovich方程式を導き、評価とヘッジを分析した（抄録）。", "p5": "予定された開示と内生的な倒産の相互作用により、開示前後に信用スプレッドとヘッジ比率の特徴的なゆがみが生じることを数値実験で示した（抄録）。", "fun": "決算発表の日はわかっていても、中身は開けてみるまでわかりません。その「いつかはわかるが中身は不明」という情報の届き方を数式に入れると、発表前に市場がそわそわする動きが説明できます。情報の届くタイミングがリスクの見え方を変えるという点が面白いです。", "unverified": "数値実験の具体的な設定と結果の数値は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "構成則の候補集合全体で構造を変分的に評価", "title": "Constitutive-Set Mechanics: variational mechanics on an admissible set of constitutive laws", "url": "https://arxiv.org/abs/2610.07151", "authors": "Altaf Ahmad Lone ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Lone, A. A., Prabhakaran, R. T. D., Tak, T. N., Rabczuk, T., & Zhuang, X. (2026). Constitutive-Set Mechanics: variational mechanics on an admissible set of constitutive laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07151", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "実験で一つに決まらない構成則（材料の応力-ひずみの法則）の候補をすべて残したまま、構造の最悪の応答を保証つきで評価する変分力学CSMを提案した（抄録）。", "p3": "有限要素の計算は構造が実際に到達したひずみでしか構成則を参照しないことに着目し、状態の「占有測度」に対する支持関数としてエネルギーを表し、平衡解から最悪ケースの上界（証明書）を作る（抄録）。", "p5": "線形弾性、位相場破壊、複合材シェル、膜で示し、シェルでは226方向のうち4方向しか参照されず、膜では最悪ケースのエネルギーが基準の4倍を超えた（抄録）。", "fun": "同じ実験結果に合う材料の法則がいくつもあるとき、普通はどれか一つを選びます。この研究は、全部を候補に残して「どれが本当でも大丈夫か」を確かめます。構造は材料のごく一部の性質しか使わないので、確かめるべき方向はわずかで済む、という見方が鮮やかです。", "unverified": "計算コストと既存の不確実性評価法との比較は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "ニューラル演算子で時変の縮約部分空間を予測", "title": "Neural-Operator-Predicted Time-Dependent Reduced Subspaces for Projection-Based Simulation of Nonlinear PDEs", "url": "https://arxiv.org/abs/2610.08693", "authors": "Boxi Song ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Song, B., Mirollo, R., & Engelbrecht, J. R. (2026). Neural-Operator-Predicted Time-Dependent Reduced Subspaces for Projection-Based Simulation of Nonlinear PDEs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08693", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "ニューラル演算子で時間とともに動く縮約部分空間を予測し、その上で支配方程式を解く、物理に基づく高速な縮約シミュレーション法を示した（抄録）。", "p3": "初期条件から時変の低次元部分空間への写像をニューラル演算子に学習させ、縮約座標は支配方程式をその部分空間へ射影して時間発展させる。粘性Burgers方程式とFisher-KPP反応拡散方程式で試した（抄録）。", "p5": "全次元の解法に比べ大幅に速く、相対誤差は10^-2〜10^-1程度だった（抄録）。", "fun": "AIに答えを丸ごと予測させると物理法則を破ることがあります。この方法では、AIには「どの方向に注目すれば良いか」という地図だけを描かせ、実際の動きは物理の方程式で計算します。AIと物理の役割分担を変えたところが工夫です。", "unverified": "高速化の倍率の具体的な値は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "グラスマン補間で局所的な縮約モデルを高速化", "title": "Efficient localised model reduction for multiscale PDEs via Grassmannian interpolation", "url": "https://arxiv.org/abs/2610.08657", "authors": "Christian Alber ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Alber, C., Bachmayr, M., Scheichl, R., & Yang, H. (2026). Efficient localised model reduction for multiscale PDEs via Grassmannian interpolation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08657", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "係数が強く不均一でパラメータの多い多スケールPDEを、局所的な縮約モデルとグラスマン多様体上の補間で効率よく解く方法を示した（抄録）。", "p3": "多スケール一般化有限要素法（MS-GFEM）で問題を局所問題に分け、パラメータごとの最適な局所近似空間をグラスマン多様体上の点とみなして、疎格子上で補間する（抄録）。", "p5": "空間方向のほぼ指数的な収束と、疎格子のパラメータ方向の収束率を引き継ぐことを理論で示し、楕円型問題の数値実験で確かめた（抄録）。", "fun": "「部分空間」をひとつの点とみなし、点と点の間をなめらかにつなぐという発想が面白い研究です。平面の向きを、ふつうの数のように足し合わせることはできませんが、曲がった空間（グラスマン多様体）の上なら自然に補間できます。幾何学の道具が計算の節約に役立つ例です。", "unverified": "計算時間の短縮の程度は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "山火事後の土石流予測を説明可能に比較評価", "title": "Towards Explainable Benchmarking for Data-driven Post-Wildfire Debris Flow Prediction", "url": "https://arxiv.org/abs/2610.07358", "authors": "Zhisheng Qi ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Qi, Z., Zhu, L., Sahu, U., Tommey, D., Roering, J., & Wang, Y. (2026). Towards Explainable Benchmarking for Data-driven Post-Wildfire Debris Flow Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07358", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "山火事の後の土石流の発生をデータ駆動で予測する研究を公平に比べる統一ベンチマークと、発生要因を探る特徴選択の枠組みを作った（抄録）。", "p3": "気象、地形、土壌、焼損の程度などの特徴とモデルを共通の評価手順で比べ、強化学習で「摂動すると発生・非発生の区別がつかなくなる要因」を探して地域ごとの仕組みを推定する。コードとベンチマークは公開（抄録）。", "p5": "抄録には具体的な精度や要因の順位の記載はない（抄録）。", "fun": "山火事で草木が焼けた斜面は、雨が降ると一気に崩れて泥の流れになります。これまでの研究は使うデータや評価方法がばらばらで比べられませんでした。同じ物差しをそろえることが、科学の進歩の土台になるという好例です。", "unverified": "ベンチマークでのモデル間の性能差と、特定された要因は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "弾性の代表体積は破壊挙動の代表性を保証しない", "title": "Elastic self-averaging does not ensure representative failure behavior in field-constrained basalt fracture networks", "url": "https://doi.org/10.21203/rs.3.rs-10538731/v1", "authors": "Ming Li ほか", "venue": "Research Square (In Review)", "date": "2026-10-07", "apa": "Li, M., & Chen, X. (2026). Elastic self-averaging does not ensure representative failure behavior in field-constrained basalt fracture networks. https://doi.org/10.21203/rs.3.rs-10538731/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "玄武岩の亀裂ネットワークで、平均的な剛性が安定する寸法（代表要素体積）に達しても、ばらつきや破壊挙動は代表的にならないことを示した（抄録）。", "p3": "風化の弱い玄武岩と新鮮な玄武岩について、6寸法（5〜50m）の3次元離散亀裂ネットワーク240個を作り、方向別のコンプライアンスと、有限-離散要素法による72の応答を解析した（抄録）。", "p5": "40〜50mで平均の弾性率の変化は0.7%未満だったが、変動係数は2.21%・1.44%残った。5〜50mで弾性率の変化は3.6〜4.0%にとどまる一方、ピーク強度は26.7〜30.0%、ピーク前エネルギーは47.3〜55.3%低下した（抄録）。", "fun": "「十分大きく切り取れば岩の性質は平均で決まる」と考えがちですが、壊れ方は大きさとともに変わり続けます。硬さはすぐ落ち着くのに、強さは大きいほど弱くなるのです。何を代表させたいかで「十分な大きさ」が違うという指摘が重要です。", "unverified": "破壊挙動の解析は弾性以外は確率的な検討が限られる（抄録）。各寸法の詳細な結果は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "粗視化後も成り立つ物理制約は線形制約だけ", "title": "Only Linear Constraints Survive Coarse-Graining: Evaluating Physics-Constrained Neural Operators on Stochastically Forced Turbulence", "url": "https://arxiv.org/abs/2610.07811", "authors": "Michael Groom ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Groom, M., & Oliveira, R. (2026). Only Linear Constraints Survive Coarse-Graining: Evaluating Physics-Constrained Neural Operators on Stochastically Forced Turbulence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07811", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "粗視化した乱流データでは、元の方程式の非線形項が成り立たなくなるため、確実に課せる物理制約は線形の制約（連続式・全運動量の保存）だけだと示し、それを厳密に満たす学習法を示した（抄録）。", "p3": "フーリエニューラル演算子（FNO）の出力に、連続式と全運動量収支を満たす閉形式の射影をO(N log N)の計算量でかける（抄録）。", "p5": "2次元等方乱流で連続式の誤差は5.0×10^-7（通常のFNOは0.51、物理損失つきFNOは0.17）で、448ステップでエネルギーが発散しない割合は0.18から0.87に上がった。追加の学習時間は2%だった（抄録）。", "fun": "ぼかした映像では細かい渦の効果が消えるため、元の物理法則をそのまま当てはめると、かえって間違いを教え込むことになります。ぼかしても崩れない「足し算だけの法則」だけを厳密に守らせる、という線引きが賢いところです。", "unverified": "3次元流れや他の問題への適用は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "衝撃波と境界層干渉による薄板の非線形応答", "title": "A Dynamical Systems Study of Nonlinear Panel Response to Compound Shock-Wave/Boundary-layer Interaction Loads", "url": "https://doi.org/10.2139/ssrn.7576301", "authors": "Anshul Suri ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Suri, A., McNamara, J., & Gaitonde, D. (2026). A Dynamical Systems Study of Nonlinear Panel Response to Compound Shock-Wave/Boundary-layer Interaction Loads. https://doi.org/10.2139/ssrn.7576301", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "マッハ2の衝撃波と境界層の複合的な干渉の下にある薄板が、柔らかさに応じて安定な振動から分岐を経てカオス的な振動へ移ることを示した（抄録）。", "p3": "二つの翼で作った3次元の干渉流れの圧力を感圧塗料で時空間的に計測し、その荷重を流体から構造への一方向の枠組みで薄板に与え、無次元動圧比λを変えて応答を調べた（抄録）。", "p5": "λが大きくなると、低振幅の安定振動→「臨界減速」を伴う長い過渡→二峰性の大振幅振動への分岐が起きた。分岐後は正のリアプノフ指数を持つカオスで、基本波と高調波の三つ組の非線形相互作用がエネルギーをやり取りしていた（抄録）。", "fun": "揺れる板は、条件を少しずつ変えると、ある点で急に振る舞いが変わります（分岐）。その手前では揺れが収まるまでの時間が長くなる「臨界減速」が起こり、これは急変の前兆として生態系や気候でも注目される現象です。乱れた風だけでカオスが生まれることも示されました。", "unverified": "薄板の寸法・材料の条件と分岐点のλの値は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "格子状内部構造のせん断変形梁をFE2で解析", "title": "An FE2 model for shear-deformable beams considering periodic lattice-like truss mesostructures", "url": "https://arxiv.org/abs/2610.08607", "authors": "Julian Ochs ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Ochs, J., & Wackerfuß, J. (2026). An FE2 model for shear-deformable beams considering periodic lattice-like truss mesostructures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08607", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "格子状の内部構造を持つせん断変形梁を、外側は梁要素、内側はトラス要素で解く2段階の有限要素法（FE2）の枠組みを初めて作った（抄録）。", "p3": "代表体積要素（RVE）の剛体移動・回転を余計な拘束なしに防ぐ制約式と、均質化した断面力と材料行列がRVEの長さに依存しないようにする制約を入れ、境界の人工的な影響を局所補正係数で抑えた（抄録）。", "p5": "2次元・3次元の格子構造で、幾何・材料の線形・非線形の各場合に、RVE長に依存しない結果と参照モデルとの良い一致を得た（抄録）。", "fun": "3Dプリンタで作る網目状の部材は、全部を細かく計算すると膨大になります。そこで「遠くから見れば一本の梁、近くで見れば網目」と二つの縮尺で同時に計算するのがFE2です。網目の切り取り方で答えが変わらないようにする工夫がポイントです。", "unverified": "計算時間の短縮の程度は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "孤独な人は日常で他者との感情調整をどう使うか", "title": "Loneliness and Interpersonal Emotion Regulation in Everyday Life", "url": "https://doi.org/10.31234/osf.io/rfzyv_v1", "authors": "Jasmin Bruna Stariolo ほか", "venue": "PsyArXiv", "date": "2026-10-07", "apa": "Stariolo, J. B., Tran, A., Mei, K., & Greenaway, K. H. (2026). Loneliness and Interpersonal Emotion Regulation in Everyday Life. https://doi.org/10.31234/osf.io/rfzyv_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "孤独な人は他者との感情の調整（相手の気持ちを支える・支えられる）を積極的に行うが、良い方法と悪い方法を同じくらい使っていることを示した（抄録）。", "p3": "日記研究（N=170、2020年）と経験サンプリング研究（N=239、2021年）で、特性としての孤独と瞬間の孤独、調整する側・される側としての4戦略（応答性、否定、再評価、身体的支援）の使用を7日間記録した（抄録）。", "p5": "瞬間の孤独は否定の増加と関連し、特性の孤独は身体的支援の減少と関連した。1週間の平均の孤独は、4戦略すべての使用の増加と関連した（抄録）。", "fun": "孤独な人は人づきあいを避けている、と思われがちですが、実は気持ちを支え合おうと努力しています。ただ、相手の気持ちを否定してしまうような逆効果のやり方も多く、つながりを深められないのかもしれません。孤独を「量」でなく「やりとりの質」で見る視点が新鮮です。", "unverified": "効果の大きさ（係数）は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "働きながら介護する人の仕事と家庭の豊かさ", "title": "Thriving in work and caregiving: Experiences of work–family enrichment among Chinese caregivers of older adults and adults with chronic illness", "url": "https://doi.org/10.21203/rs.3.rs-11138912/v1", "authors": "Bobo Hi Po Lau ほか", "venue": "Research Square (In Review)", "date": "2026-10-07", "apa": "Lau, B. H. P., & Ng, C. W.-M. (2026). Thriving in work and caregiving: Experiences of work–family enrichment among Chinese caregivers of older adults and adults with chronic illness. https://doi.org/10.21203/rs.3.rs-11138912/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "働きながら高齢の家族や慢性疾患の家族を介護する香港の人々が、仕事と介護の間で資源をやり取りし、互いを豊かにしている経験を明らかにした質的研究（抄録）。", "p3": "過去6か月に就労していた家族介護者に半構造化面接を行い、仕事と家庭の豊かさを1つ以上語った29人のデータを主題分析した（平均47.7歳）（抄録）。", "p5": "仕事→介護では「介護の知識・技能の獲得」と「正当で満たされる介護からの息抜き」、介護→仕事では「仕事の技能の獲得」と「介護の喜びによる仕事のストレス調整」が見られた。家族に優しい勤務・休暇制度、同僚の支援、親孝行の価値観などが支えになっていた（抄録）。", "fun": "仕事と介護は時間を奪い合う「敵同士」と考えられがちですが、この研究は、仕事が介護の息抜きになり、介護で身につけた力が仕事に生きる面を描きます。どちらかを減らすだけでなく、良い循環を職場が支えるという発想の転換です。", "unverified": "質的研究のため、豊かさの頻度や程度の量的な評価はない。"}}, {"id": "pr37", "rank": 37, "headline": "高齢者の合唱の社会的効果は文化で異なる", "title": "Culture and the Social Effects of Group Singing in Later Life: A Comparative Review of Controlled Studies from the United States, England, Finland, and Singapore", "url": "https://doi.org/10.2139/ssrn.7566058", "authors": "Sergiy Zotovych", "venue": "SSRN", "date": "2026-10-07", "apa": "Zotovych, S. (2026). Culture and the Social Effects of Group Singing in Later Life: A Comparative Review of Controlled Studies from the United States, England, Finland, and Singapore. https://doi.org/10.2139/ssrn.7566058", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "高齢者の合唱が孤独や心の健康に与える効果は、国（文化）によって現れ方が違うことを、4つの対照研究の比較で示した（抄録）。", "p3": "60歳以上の合唱の研究4件（米国のクラスター無作為化試験N=390、英国の実践的無作為化試験N=258、フィンランドの症例対照研究、シンガポールの能動対照の無作為化試験N=93）から、設計・用量・比較群・結果・効果量と文化的文脈の記述を抽出した（抄録）。", "p5": "米国は孤独の減少（標準化効果量0.34）、英国はメンタル面の生活の質の改善（3か月で平均差4.77）、フィンランドは身体面の生活の質の向上（+3.83点）、シンガポールは境界的な認知の改善（0.15、p=.042）と、効果の現れ方が分かれた（抄録）。", "fun": "「みんなで歌うと元気になる」は世界共通に思えますが、何に効くかは国によって違いました。孤独が減る国もあれば、体の調子が良くなる国もあります。良い方法も、そのまま別の国に持ち込めるとは限らないという教訓です。", "unverified": "文化的文脈の記述の分析結果の詳細は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "独居高齢者向けトルコ語LLM音声伴走の実現可能性", "title": "Turkish-language Large Language Model-supported Voice Companion for Cognitive Monitoring via Social Artificial Intelligence in Older People Living Alone: A Single-Arm Pilot Feasibility Study", "url": "https://doi.org/10.21203/rs.3.rs-10998298/v1", "authors": "Asli Kilavuz ほか", "venue": "Research Square (In Review)", "date": "2026-10-06", "apa": "Kilavuz, A., Akşan, Ö., Bora, C. B., Akşan, F., Bücük, P. S., & Bora, S. (2026). Turkish-language Large Language Model-supported Voice Companion for Cognitive Monitoring via Social Artificial Intelligence in Older People Living Alone: A Single-Arm Pilot Feasibility Study. https://doi.org/10.21203/rs.3.rs-10998298/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "一人暮らしの高齢者向けのトルコ語LLM音声伴走アプリiSheを30日間使ってもらい、実現可能性と受け入れられやすさを確かめた予備研究（抄録）。", "p3": "65歳以上の独居高齢者10人が毎日1回の音声セッションを30日続け、孤独（DJGLS）と抑うつ（GDS-15）を前後で、認知機能をアプリ内（SPMSQ）と対面（SMMSE）で測った。対照群のない単群の試験（抄録）。", "p5": "継続率は100%で、1回は平均18.6分。孤独の得点は8.50→5.70（p=.007）、抑うつは4.50→2.30（p=.039）に下がり、認知機能は安定していた（抄録）。", "fun": "AIと毎日おしゃべりすることで、独り暮らしのお年寄りの孤独感が下がり、会話の中で物忘れの兆しも見守れるかもしれません。ただし10人だけで比べる相手もいないので、本当にAIのおかげかはまだわかりません。期待と慎重さの両方が必要な研究です。", "unverified": "対照群がなく10人のため、効果の因果的な判断はできない（抄録）。"}}, {"id": "pr39", "rank": 39, "headline": "つながっていても孤独、若者のデジタル孤独", "title": "The Psychology of Digital Loneliness: How Online Social Connection Can Coexist with Feelings of Social Isolation among Young Adults", "url": "https://doi.org/10.2139/ssrn.7564480", "authors": "Lawal Aishat", "venue": "SSRN", "date": "2026-10-06", "apa": "Aishat, L. (2026). The Psychology of Digital Loneliness: How Online Social Connection Can Coexist with Feelings of Social Isolation among Young Adults. https://doi.org/10.2139/ssrn.7564480", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "オンラインで頻繁につながっていても意味のあるつながりが足りないと感じる「デジタル孤独」を定義し、若者で起こる仕組みを整理した叙述的レビュー（抄録）。", "p3": "主に2019〜2025年の査読研究を統合し、概念・測定・メカニズムを整理して、つながりと所属感のずれを説明する概念モデルを提案した（抄録）。", "p5": "良質な交流の置き換え、受け身の閲覧、上方比較、弱い絆、取り残される不安、強迫的な利用の6つの仕組みが繰り返し見られた。SNS利用と孤独の関連は小さく、方向も双方向で、使い方・目的・相手によって変わる（抄録）。", "fun": "スマホで常に誰かとつながっていても寂しい、という感覚には名前がつけられます。大事なのは使う時間の長さではなく、親しい人との関係を支えるのに使うか、それに置き換えてしまうかだ、という整理は日々のSNSの使い方を考えるヒントになります。", "unverified": "叙述的レビューのため、文献選択の基準は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "AI不安が業績と離職意図に及ぼす影響", "title": "Threat or Teammate? AI Anxiety, Job Performance, and Turnover Intention in the Age of Digital Transformation", "url": "https://doi.org/10.2139/ssrn.7565418", "authors": "Mehmet Nurcan", "venue": "SSRN", "date": "2026-10-07", "apa": "Nurcan, M. (2026). Threat or Teammate? AI Anxiety, Job Performance, and Turnover Intention in the Age of Digital Transformation. https://doi.org/10.2139/ssrn.7565418", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "AIに価値を奪われる・置き換えられるという従業員の不安（AI不安）が、業績を下げ離職意図を高めるという概念枠組みを提案した（抄録）。", "p3": "テクノストレス、雇用不安、資源保存理論に基づき、情緒的消耗を媒介、組織的支援の知覚とAIリテラシーを緩衝要因とするモデルを立て、不安を減らす管理実務を示した（抄録）。", "p5": "実証データはなく、検証のための研究課題を示した（抄録）。", "fun": "AIの導入が技術的に成功しても、そこで働く人が「自分は要らなくなる」と怯えれば、職場としては失敗かもしれません。この論文は、AIを道具の購入ではなく人の問題として見直すよう促します。支えとAIの知識が不安の盾になるという仮説は、検証が楽しみです。", "unverified": "概念論文であり、仮説の実証はない。"}}, {"id": "pr41", "rank": 41, "headline": "韓国のAI導入は地域生産性と物価に現れるか", "title": "AI Adoption, Regional Productivity, and Inflation: Evidence from Korea and Implications for Monetary Policy", "url": "https://doi.org/10.2139/ssrn.7555659", "authors": "Cyn-Young Park ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Park, C.-Y., & Shin, K. (2026). AI Adoption, Regional Productivity, and Inflation: Evidence from Korea and Implications for Monetary Policy. https://doi.org/10.2139/ssrn.7555659", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "韓国でAI導入の初期段階の効果を調べると、2023年時点で生産性の上昇は見えない一方、一部の地域の消費者物価、とくに外食の物価が上がっていたことを示した（抄録）。", "p3": "企業活動調査のAI導入情報と、2017〜2023年の産業・地域データを組み合わせ、2019年のAI集約度を事前の指標として、固定効果つきのパネル回帰で比べた（抄録）。", "p5": "AI集約度の高い産業・地域で産出や労働生産性の伸びが大きいという系統的な証拠はなく、産業の物価効果も有意でなかった。地域では雇用加重のAI集約度が消費者物価上昇と正に関連した（抄録）。", "fun": "AIで生産性が上がれば物価は下がる、と期待されますが、最初は逆のことが起きているかもしれません。効果が出る前に需要が先に動くからです。新しい技術が経済に効くまでには時間差がある、という歴史的にもよく見られる話を新しいデータで確かめています。", "unverified": "効果の大きさ（係数）は未確認。仕組みは識別されていない（抄録）。"}}, {"id": "pr42", "rank": 42, "headline": "アルゴリズム管理と参加型ガバナンスの枠組み", "title": "When Monitoring Becomes Management: Algorithmic Control, Employee Autonomy and Participatory Governance in Sustainable Work Systems", "url": "https://doi.org/10.2139/ssrn.7571898", "authors": "Abul Fazal Mohammad Ahsan Uddin", "venue": "SSRN", "date": "2026-10-06", "apa": "Ahsan Uddin, A. F. M. (2026). When Monitoring Becomes Management: Algorithmic Control, Employee Autonomy and Participatory Governance in Sustainable Work Systems. https://doi.org/10.2139/ssrn.7571898", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "AIによる従業員の監視を、中立な技術ではなく経営による管理の社会技術的な変化として捉え、参加型の監視ガバナンスを提案した概念論文（抄録）。", "p3": "労働過程論、アルゴリズム管理、監視研究などを統合し、組織が情報を多く持つ「情報の非対称」と、設計・運用の決定権を握る「参加の非対称」の二つの仕組みを特定した（抄録）。", "p5": "意味のある透明性、従業員参加、異議申し立ての可能性、比例性からなる枠組みが、自律性・信頼・心理的安全性・発言に影響するという命題を示した。実証はない（抄録）。", "fun": "監視の問題は、見られていることそのものより、「何を見られ、どう使われるかを自分は知らず、口も出せない」という力の差にある、という整理です。ルールづくりに働く人が参加できるかどうかで、同じ監視でも受け止め方が変わりそうです。", "unverified": "概念論文であり、命題の実証はない。"}}, {"id": "pr43", "rank": 43, "headline": "高層住宅の高密度化と家計エネルギー費の閾値効果", "title": "Does residential densification reduce household energy costs? Nonlinear threshold effects in high-rise apartment complexes", "url": "https://doi.org/10.2139/ssrn.7576799", "authors": "Kyujin Choi ほか", "venue": "SSRN", "date": "2026-10-07", "apa": "Choi, K., Sohn, D., Kim, S., Lee, D., & Nam, K. (2026). Does residential densification reduce household energy costs? Nonlinear threshold effects in high-rise apartment complexes. https://doi.org/10.2139/ssrn.7576799", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "ソウルの集合住宅で、1世帯あたりの年間エネルギー費が建物の築年数・規模・階数によって非線形に変わる閾値を明らかにした（抄録）。", "p3": "建築計画、建物の寿命・運用、近隣の特徴を説明変数として機械学習モデルを作り、SHAPで主な要因と非線形の閾値を解釈した。共用部のエネルギーの按分も含めた（抄録）。", "p5": "費用は立地より建物内部の特徴に強く左右された。築38年を超えると急増し、規模の経済は700世帯まで働き、10階未満は費用が低く30階を超えると高くなった（抄録）。", "fun": "高層マンションは土地の効率が良い反面、エレベーターや共用部の電気代がかさみます。「大きいほど得」は700世帯までで、高すぎるとかえって損になるという結果は、コンパクトな街づくりにも上手な規模がありそうだと示しています。", "unverified": "モデルの予測精度と標本の団地数は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "排熱の受け皿を条件にしたAI施設の立地評価", "title": "Heat-sink-constrained siting of distributed AI infrastructure: Energy, carbon and water impacts in Los Angeles", "url": "https://doi.org/10.2139/ssrn.7576748", "authors": "Jonathan Bily", "venue": "SSRN", "date": "2026-10-07", "apa": "Bily, J. (2026). Heat-sink-constrained siting of distributed AI infrastructure: Energy, carbon and water impacts in Los Angeles. https://doi.org/10.2139/ssrn.7576748", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録のみを読んだ（本文は入手できず）", "preprint": true, "short": true, "p1": "AI計算機の排熱を使える熱需要（洗車場・コインランドリー）を立地の制約として、ロサンゼルスに分散したAI施設を置いたときの電力・熱・水・温室効果ガスの効果を試算した（抄録）。", "p3": "6,160基の加速器（11.17MW）を代表的な120の施設に配置する1時間ごとの決定論的モデルで、液冷の排熱回収、4時間蓄熱、太陽光熱パネル、気象、水使用、排出量を計算した（抄録）。", "p5": "熱需要がすべて温度的に使える場合、IT電力63.49GWh/年から有効熱50.38GWh/年（79.4%）が得られた。使える需要が75%・50%・25%だと有効熱は63.7%・42.5%・21.2%に下がった（抄録）。", "fun": "AIを動かすコンピュータは大量の熱を出します。その熱を、お湯をたくさん使う洗車場やコインランドリーの近くに置いて再利用しよう、という発想です。施設を先に建てて熱の使い道を探すのでなく、熱の使い道から置き場所を決める逆転の考え方が面白い点です。", "unverified": "合成のスクリーニングモデルであり、実地での検証は今後の課題（抄録）。"}}, {"id": "pr45", "rank": 45, "headline": "AIエージェントの社会心理学", "title": "The social psychology of AI agents", "url": "https://doi.org/10.21203/rs.3.rs-11275705/v1", "authors": "Magdalena Katharina Wekenborg ほか", "venue": "Research Square (In Review)", "date": "2026-10-07", "apa": "Wekenborg, M. K., Harzbecker, J., Husak, O., Sridharan, J., Eder, J., Kambeitz, J., Bhat, V., & Kather, J. N. (2026). The social psychology of AI agents. https://doi.org/10.21203/rs.3.rs-11275705/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を読んだ（取得した抄録は途中で切れていた）", "preprint": true, "short": true, "p1": "AIエージェントの基盤となる36のLLMについて、性格検査の自己報告と社会的ゲームでの実際の行動を比べ、エージェントの社会的な行動の特徴を定量化した（抄録）。", "p3": "性格検査Big Five Inventory-2と、確立された7つの社会的ゲームを使い、計20,340の実験セッションを行った（抄録）。", "p5": "自己報告の性格はモデル間でほとんど違わず、社会的に望ましい方向に偏っていた。一方、観察された社会的行動はモデル間の差が大きく、自己報告の性格の2.3倍のばらつきがあった（抄録）。", "fun": "AIに「あなたはどんな性格？」と聞くと、どのAIも「協調的で誠実です」と優等生の答えを返します。ところが実際にゲームで協力や裏切りをさせると、AIごとに振る舞いがかなり違いました。人間と同じく、言うこととすることは別だということです。", "unverified": "取得した抄録が途中で切れており、後半の結果（統計量など）は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "大きなチームほど破壊的、通説は測定の誤り", "title": "Large scientific teams are more, not less, disruptive", "url": "https://arxiv.org/abs/2610.07329", "authors": "Junming Huang ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Huang, J., & Xie, Y. (2026). Large scientific teams are more, not less, disruptive (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07329", "why": "6千万本の論文で、小チームが破壊的という有名な結論が引用数による指標の偏りだったことを示し、頑健な指標で逆の結論を得た。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（標準指標の分解、参考文献数の均等化、新指標1Dと外部基準での検証、チーム規模の結果、考察、データと方法）を読んだ", "preprint": true, "p1": "「小さなチームほど破壊的な研究をする」という有名な結論は、破壊性指標が参考文献数に機械的に依存することによる測定の産物であり、偏りを除くと大きなチームほど破壊的であることを示した（§結論）。", "p2": "2019年の影響力ある研究は小チームの破壊的優位を報告したが、共同研究の大規模化の流れや、ノーベル賞級の大チームの研究と整合しない（序論）。", "p3": "標準の破壊性指標DI＝(N_F−N_B)/(N_F+N_B+N_R)（N_F：対象論文だけを引用、N_B：対象と参考文献の両方を引用、N_R：参考文献だけを引用）は、参考文献が増えるほど機械的に下がる（式1、図3a）。大チームほど参考文献が多いため見かけの負の関係が生じる。そこで(1)単著論文に合わせて参考文献を無作為に削り分布をそろえる診断と、(2)参考文献を1本ずつ無作為に選んで計算し平均する新指標1D（式2–4、30回のモンテカルロ平均）を作った。", "p4": "OpenAlexの約4,713万本（2020年以前、参考文献5本以上、被引用1回以上）で、引用窓2〜30年と無制限で比較し、チューリング賞・ノーベル賞・ラスカー賞・Test of Time賞・Physical Review Milestones・Science Breakthrough of the Yearの6基準で、受賞論文と他の論文を区別できるか（AUC）を検証した（データと方法、図4）。", "p5": "参考文献数をそろえると、すべての引用窓で負の勾配が正に反転した（図3b–c）。1DのAUCは6基準で0.94–0.98、標準指標は0.26–0.79で、2基準では0.5を下回った（図4a）。1Dの平均は単著0.19から10人以上の0.25へ上がり、4分野・1950〜2010年代のすべてで同じ傾向だった（図5）。", "p6": "著者は、5本未満の参考文献の論文を除く閾値の選び方に伴う取捨（11.44%を除外）を述べている（データと方法）。解釈：1Dは参考文献数の累積的な不利を除くが、チーム規模と破壊性の因果関係を示すものではない。", "fun": "「少人数のチームほど常識をひっくり返す研究をする」という話は広く信じられていました。ところが、使っていた物差しが「参考文献を多く書くほど点が下がる」という癖を持っていて、大チームは文献を多く書くので不利になっていたのです。物差しを直すと結論が逆転しました。測り方の癖が結論を作ってしまう怖さがわかります。", "unverified": "付録の各種頑健性検査の詳細な数値は未確認。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "語彙の違うモデル間の蒸留は網羅より信頼性", "title": "Rethinking Cross-Tokenizer On-Policy Distillation: From Alignment Coverage to Supervision Reliability", "url": "https://arxiv.org/abs/2610.08448", "authors": "Bingxi Hou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-07", "apa": "Hou, B., Jiang, G., Quan, G., Li, W., Feng, W., Liu, G., & Zhang, Y. (2026). Rethinking Cross-Tokenizer On-Policy Distillation: From Alignment Coverage to Supervision Reliability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08448", "why": "異なるトークナイザ間のオンポリシー蒸留で、整合範囲を広げるより確実な位置に絞る方が良いことを示した（HF投票151）。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化、被覆率の分析、確率質量の分析、表2の比較、勾配診断、結論）を読んだ", "preprint": true, "p1": "語彙（トークナイザ）の異なる教師モデルから生徒モデルへのオンポリシー蒸留では、整合できる範囲を広げるより、1対1で確実に対応する位置だけに絞って教えるほうが良い結果になることを示した（§7）。", "p2": "オンポリシー蒸留（OPD：生徒が自分で生成した文章に教師が評価を与えて学習）は、語彙が違うと系列と語彙の両方で予測を対応づける必要がある。既存手法は対応の網羅範囲（被覆）を広げることを重視してきた（§1、§2.3）。", "p3": "生徒の生成文を両方の語彙でトークン化し、共通の境界で区切って「1対1のグループ」と「不一致グループ」に分ける（式2–3）。1対1の位置では共通語彙上の逆KLで教え、さらに生徒が選んだ上位16語に絞る変種を作った（§4）。不一致グループに区間の対数確率の二乗誤差を加えて被覆を完全にした場合と比べた（§3.2）。", "p4": "Qwen2.5-7B→Llama-3.2-3B、Granite-4.1-8B→Phi-4-mini、Granite-4.1-8B→Qwen2.5-7B-Baseの3組を、数学1万問とコード1万問で学習し、MATH500・AIME・HumanEval・LiveCodeBenchなどの正答率で、ULD、Extended ULD、GOLD、SimCTと比べた（§3、表2）。", "p5": "語彙のJaccard重なりは39.49–64.87%しかないのに、生徒トークンの85.57–96.98%が1対1グループに入った（表1）。共通語彙は教師の確率質量の99.69–99.90%を保持した（§3.3）。不一致の監督を加えると、18通りの正の重みすべてで基準より0.27–1.20ポイント低下した（§3.2）。上位16語の監督は全語彙のOPDの改善の96%以上を保ち、最強の比較手法を全体平均で0.51–1.05ポイント上回った（§4、§7）。", "p6": "不一致の監督が害になる理由として、区間の勾配が1対1の勾配と方向がほぼ一致せず（コサインがほぼ0か負）、大きさが学習とともに増えることを示したが、著者は「説明の助けになりうる」と述べるにとどめている（§5、§7）。解釈：数学とコードの課題に限られる。", "fun": "先生と生徒で使う「単語の区切り方」が違うとき、全部を無理に対応させて教えるより、ぴったり対応する所だけ教えたほうがよく伸びました。あいまいな対応から来る教えは、むしろ生徒を混乱させていたのです。たくさん教えるより、確かなことを教える方が大事、というのは人間の勉強にも通じます。", "unverified": "付録の235B教師の結果とALFWorldの結果の数値は未確認。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "隠れた交絡下の因果効果を一回の推論で事後分布推定", "title": "ProximalFM: Amortized Proximal Causal Inference under Hidden Confounding", "url": "https://arxiv.org/abs/2610.08078", "authors": "Christophe Muller ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Muller, C., Kharel, A., Luedtke, A., Park, C., Tchetgen, E. T., Gamella, J. L., Krishnan, R., Silva, R., & Zeitler, J. (2026). ProximalFM: Amortized Proximal Causal Inference under Hidden Confounding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08078", "why": "代理変数による近接因果推論を、事前学習済みのTransformer（PFN）で償却的に解き、CATEの事後分布を出す。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（近接因果推論の仮定、合成事前分布、モデルと目的関数、評価設定と結果、結論）を読んだ", "preprint": true, "p1": "観測されない交絡があるときに代理変数を使う「近接因果推論」で、条件付き平均処置効果（CATE）の事後分布を、事前学習したTransformerの1回の順伝播で推定するProximalFMを示した（§3、§5）。", "p2": "近接因果推論は、ブリッジ関数と呼ばれる不良設定の積分方程式を解く必要があり、データを多く要し、ハイパーパラメータに敏感で最適化も不安定である。ベイズ推論は事前分布で正則化できるが、潜在変数を含む尤度の事後計算が難しい（抄録、§2.2）。", "p3": "観測変数を、共変量X、処置側の代理Z、結果側の代理Wに分ける（§2）。識別の仮定は、(X,U)を条件とした交換可能性、代理の除外制約（YはZと、WはA・Zと条件付き独立）、正値性、完備性（代理がUの変動を十分捉える）（仮定1–4）。これを満たす構造因果モデルを多数ランダムに生成する事前分布を作り（§3.1）、その合成データと真のCATE（のモンテカルロ推定）で、データ集合からCATEの事後分布への写像を事前データ適合ネットワーク（PFN、TabICLv2が骨格）に学習させる（§3.2）。例：新しい観察データを入力すると、学習済みネットワークが各xでのCATEの分布をそのまま出力する。", "p4": "実データの特徴量をXとUに用い、代理・処置・結果を生成する半合成データで、線形/非線形×交絡の強弱×代理の情報量の8条件・計288事例について、正規化PEHE（nPEHE：個別効果の推定誤差、1が一定ATEの基準）で、近接推定量（P-learner、KPV、PMMR）、交絡なしを仮定する因果基盤モデル（CausalPFN等）、S/T/X-learnerと比べた（§4.1）。", "p5": "ProximalFMは8条件すべてで競争力があり、文脈（標本）が大きく、交絡が強く代理の情報が弱いときに最も優位だった（§4.2、図4）。ただし非線形・強交絡・弱い代理の条件で文脈が2,048を超えると改善が止まり、P-learner（TabICL）が最良になった（§4.2）。", "p6": "著者は、事前学習の範囲を超えると信用区間が過信になりうることを認め（§5）、文脈の大きさの不一致を伸び悩みの理由に挙げている（§4.2）。解釈：結果は合成・半合成データに基づき、事前分布が現実の因果構造をどれだけ覆うかに依存する。", "fun": "「薬が効いたのか、それとも元気な人が薬を選んだだけか」を見分けるとき、測れていない要因が邪魔をします。近接因果推論は、その要因の「影」になる代理の変数を二種類使って補正します。それを毎回難しい方程式を解く代わりに、大量の模擬問題で訓練したAIに一瞬で答えさせる、という発想の転換が面白いところです。", "unverified": "付録の表D.7–D.11の具体的なnPEHEの値は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "差別化財の需要を数秒でノンパラ推定", "title": "Scalable Nonparametric Demand Estimation in Differentiated Product Markets", "url": "https://arxiv.org/abs/2610.08467", "authors": "Julien Monardo", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Monardo, J. (2026). Scalable Nonparametric Demand Estimation in Differentiated Product Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08467", "why": "製品数による次元の呪いを経済学的制約で回避し、需要の傾きと曲率を柔軟かつ高速に推定する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（需要モデルの仮定、対称シーブの構成、モンテカルロの設計、米国ビール市場の推定と反実仮想、結語）を読んだ", "preprint": true, "p1": "製品が差別化された市場の需要を、市場レベルのデータから、製品数が増えても計算が爆発しない形でノンパラメトリックに推定する方法（SNPD）を示し、従来のランダム係数ロジットで約10時間半かかる推定を約30秒で行った（§2、表5）。", "p2": "合併や税の分析の答えは需要の傾きと曲率に左右されるが、柔軟な（ノンパラメトリックな）推定法は製品数について次元の呪いを抱え、BLP型のパラメトリックモデルは柔軟性に限りがある（§1）。", "p3": "逆市場シェア関数を「ロジットの逆関数の項」＋「競合他社に対して並べ替え不変な関数」の和として書く（指数構造などの仮定1–3、§2.2）。並べ替え不変な部分を、競合ごとの基底関数をまとめて足し合わせる対称多項式のシーブで近似するため、係数の数は製品数Jではなく次数Dで決まる（§2.4）。推定は形状制約つきの2段階GMM（§2.5）。直観：「どの競合が誰か」ではなく「競合全体の分布」だけが需要に効くとみなすことで、変数の数を圧縮する。", "p4": "(1)正しく特定されたBLP、(2)ランダム係数の分布の誤特定、(3)ロジット型の関数形の誤特定の3つのモンテカルロ実験（各100回、市場数T=100・500、製品数J=25・50）で代替パターン・曲率・マークアップの再現を調べた（§3）。実証では米国ビール市場（39製品、2,808市場、94,656観測）で、Miller & Weinberg（2017）のランダム係数入れ子ロジット（RCNL）と比べた（§4.1）。", "p5": "シミュレーションでは代替パターン、需要曲率、マークアップをよく再現した（§5）。ビール市場では平均弾力性はRCNLと同程度だが、近い代替品への代替がより強く、曲率の幅も広かった（§5）。輸入品に価格の10%の従量税をかける反実仮想では、国産品の価格上昇がSNPDで6.92%、RCNLで1.53%と大きく違った（§4.4）。", "p6": "本文の仮定として、スカラーの需要ショックと所得に依存しない需要が暗黙に置かれている（§2.2の脚注）。解釈：どちらの需要モデルが真に近いかは観測できず、反実仮想の違いはモデル選択の重要性を示すにとどまる。単著の未査読論文である。", "fun": "ビールの値段を1種類上げたとき、お客さんがどの銘柄に流れるかを予測するには、銘柄同士の「似ている度合い」を全部知る必要があり、銘柄が増えると計算が爆発します。この研究は「ライバルが誰かより、ライバル全体の顔ぶれだけが効く」と考えて計算を劇的に軽くしました。その違いで、税の効果の予測が数倍も変わったのが驚きです。", "unverified": "モンテカルロ実験の誤差の具体的な数値（表）は未確認。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "多言語LLMの中間層で表現が揃う理由を理論化", "title": "A theory of platonic representations in language models", "url": "https://arxiv.org/abs/2610.07168", "authors": "Darshil Doshi ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Doshi, D., Zhou, W., Wegner, C. E., Korchinski, D. J., Acevedo, S., & Wyart, M. (2026). A theory of platonic representations in language models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07168", "why": "階層的な隠れ構造を持つ合成言語で、言語間の表現の類似が中間層で最大になる理由を確率伝播で説明した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（合成言語モデルMRHM、確率伝播の理論、幾何的類似、層ごとの新規性、座標の整合、結論）を読んだ", "preprint": true, "p1": "多言語LLMの中間層で翻訳文同士の表現が似る現象（プラトン的表現仮説に関連）を、「データには言語間で共有される上位の階層構造がある」という一つの仮定から説明する理論を示した（§8）。", "p2": "翻訳文の内部表現が中間層で似ることは観察されていたが、なぜ中間層で最大になるのか、言語固有の構造とどう共存するのかは理論的に説明されていなかった（§1）。", "p3": "上位の生成規則を共有し下位の規則だけが言語ごとに異なる確率文脈自由文法で、2つの合成言語を作る（MRHM、§3）。木構造なので最適な次トークン予測は確率伝播（BP：下から上へ証拠を集め、上から下へ予測を伝える計算）で求まり、その各段のメッセージを層ごとに線形に表す理論ネットワークを作って、同じデータで学習したTransformer（8層、埋め込み512）と比べた（§4–5.1）。", "p4": "翻訳ペアの表現の幾何的類似（II、mKNN）を層ごとに測り、1つのモデルを2言語で学習した場合と別々のモデルの場合で、理論ネットワークの予測と比べた。座標の整合は、言語Aで学習した線形探査器を言語Bに当てる交差探査で測った（§5、§7）。", "p5": "類似は入力付近で低く中間層で高く、出力付近で再び下がり、言語が構造的に近いほど強かった。この傾向は理論ネットワークでよく再現された（§5.2、図2）。幾何的類似は共有された階層だけで生じるが、座標の整合には混合言語（コードスイッチ）のデータが必要で、整合が起きる訓練データ量の閾値はコードスイッチ率の逆数に比例した（§7、図7）。各層から前の層で線形に予測できる成分を引く「層ごとの新規性」で言語間の類似が高まり、事前学習済みLLMでも確認された（抄録、§6）。", "p6": "本文の解析は主に合成文法（L=4など小規模な設定）に基づく。解釈：実際の自然言語が仮定する階層構造をどこまで持つかは理論の外にある。マルチモーダルへの拡張は示唆にとどまる（§8）。", "fun": "英語と日本語は単語も語順も違うのに、AIの頭の中では「意味」の部分で同じ形の表現に収束していきます。この研究は、言語の表面は違っても奥の構造は共通、という単純な仮定でその理由を説明しました。さらに「日本語と英語が混ざった文章」で学ぶと、言語間で知識を受け渡しやすくなるという実用的な示唆も面白いところです。", "unverified": "事前学習済みLLMでの新規性の効果の具体的な数値は未確認。"}}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "LLM審査員の順序・まとめ効果を統計モデル化", "title": "Trustworthy Method Comparison with AI Judges: Estimation and Design under Order, Batch, and Aggregation Effects", "url": "https://arxiv.org/abs/2610.07755", "authors": "Tianxi Li ほか", "venue": "arXiv", "date": "Wed, 07 Oct 2026", "apa": "Li, T., & Ding, J. (2026). Trustworthy Method Comparison with AI Judges: Estimation and Design under Order, Batch, and Aggregation Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.07755", "why": "LLM評価をマルコフ型GLMMで近似し、順序の無作為化と平均がどこまで妥当かを理論と実験で示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（作業モデル、3つのAI審査員への当てはめ、予測による妥当性確認、順位づけと群比較の理論とシミュレーション、データ例、実務指針）を読んだ", "preprint": true, "p1": "LLMを審査員にして項目を順番に評価させるとき、評価が前の評価に引きずられる（系列依存）ことをマルコフ型の一般化線形混合モデル（GLMM）で近似し、「順序を無作為にして平均する」慣行が、上位選びでは妥当だが群の比較では誤りうることを示した（§7）。", "p2": "LLM審査員では提示順を無作為にして得点を平均するのが通例だが、その統計的妥当性は不明だった。同じ文脈で続けて評価すると評価が互いに依存する（§1、§2.1）。", "p3": "V個の項目をバッチ内で順に二値評価させ、各評価の確率を項目の質θ_v、直前の評価（ラグ効果）、バッチのランダム効果で表すマルコフGLMMを作業モデルとした（§2.1）。上位選びでは単純平均の一致性と、順序のバランスをとるウィリアムズ方格の効率を、群比較では非線形のリンク関数のせいで「確率の平均」と「質の平均」がずれる偏りを理論的に示した（§3–4、式7）。", "p4": "研究提案の評価データ（V=30、N=200）でGemini 2.5 Flash、GPT-5.4-mini、Claude Haiku 4.5に当てはめ、新たな100バッチで遅れ遷移確率の予測区間の被覆を確かめた（§2.2–2.3）。シミュレーション（各セル1万回または2千回）と、グラフィカルモデル推定法2つのエッジをAIが評価するデータ例（人の評価を正解とする）で検証した（§3.2、§4.2、§6）。", "p5": "3つの審査員すべてでラグ1の効果が負で（受理の直後は受理されにくい）、新しいデータの予測区間は36の遷移確率のうち34個（94.4%）を覆った（§2.2–2.3）。位置効果の不均一な審査員ではウィリアムズ方格で上位の正答率が1.2〜3.1ポイント上がった（§3.2）。群比較では、平均の質が同じでもばらつきが違う群で単純平均が偽の差を出しうるのに対し、GLMMは妥当な推論を与えた（§4、§7）。", "p6": "著者は、当てはめた構造はこの3つの審査員とこの課題に特有で、他では模型の選び直しが必要だと強調し、
