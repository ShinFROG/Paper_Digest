 Damage identification and model updating using bridge displacement under moving vehicles with uncertain weight. Advanced Engineering Informatics, 77, 105355. https://doi.org/10.1016/j.aei.2026.105355", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、重量が不確かな車両が走行するときの橋の変位から、橋の損傷を同定しモデルを更新する手法を扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋の上を走るトラックの重さが正確にわからなくても、橋のたわみ方から傷んだ場所を見つけられるか、という問いです。原因（重さ）も結果（傷み）も不確かな中で、両方を同時に推し量る難しさが、この問題の面白いところです。", "unverified": "手法・検証・結果のすべてが未確認。"}}, {"id": "jr17", "rank": 17, "headline": "車両-橋梁連成系の信号エネルギーで減衰比を同定", "title": "Identification method of bridge damping ratio based on signal energy analysis of vehicle-bridge coupling system", "url": "https://doi.org/10.1016/j.jsv.2026.120167", "authors": "Tao Chen ほか", "venue": "Journal of Sound and Vibration", "date": "2026-10-06", "sjr": 1.331, "citescore": 10.2, "citescore_year": "2025", "apa": "Chen, T., Yang, Y., Chai, H. k., Xu, W., Ren, R., & Xiong, T. (2026). Identification method of bridge damping ratio based on signal energy analysis of vehicle-bridge coupling system. Journal of Sound and Vibration, 120167. https://doi.org/10.1016/j.jsv.2026.120167", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、車両と橋梁の連成系の信号のエネルギーの分析から、橋の減衰比を同定する方法を扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "揺れがどれだけ早く収まるか（減衰）は、橋の健康を表す大切な指標ですが、測るのが難しい量です。車が渡るときの揺れのエネルギーの減り方から、それを読み取れるかという問いは、身近な交通を点検に使う発想として面白いものです。", "unverified": "手法・検証・結果のすべてが未確認。"}}, {"id": "jr18", "rank": 18, "headline": "LLMの社会シミュレーションは理想郷の錯覚を生む", "title": "Social simulations with large language model risk Utopian illusion", "url": "https://doi.org/10.1057/s41599-026-09282-6", "authors": "Ning Bian ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-07", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "apa": "Bian, N., Han, X., Lin, H., Wu, B., & Wang, J. (2026). Social simulations with large language model risk Utopian illusion. Humanities and Social Sciences Communications. https://doi.org/10.1057/s41599-026-09282-6", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "LLMで人間社会を模擬すると、本物の人間行動ではなく、社会的望ましさに偏った理想化された「ユートピア」的社会が生まれることを示した（抄録）。", "p3": "チャットルーム形式の多エージェントの会話を模擬し、5つの言語的な次元で分析する枠組みを作り、3系統8つの代表的なLLMで実験した（抄録）。", "p5": "LLMは社会的役割の偏り、初頭効果、肯定性の偏りを示し、実際の人間の相互作用の複雑さとばらつきに欠ける社会を作った（抄録）。", "fun": "AIたちに会話させると、みんな礼儀正しく前向きで、まるで理想郷のような社会ができあがります。でもそれは本物の人間社会ではありません。AIが「良い子」に振る舞うよう訓練されていることが、社会の模擬では弱点になるという皮肉な発見です。", "unverified": "5つの言語的次元の具体的な内容と数値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "リアルタイムと事後のGNSS精密単独測位の精度差", "title": "Performance gap between archived real-time and post-processed precise products for multi-GNSS and multi-frequency PPP-AR", "url": "https://doi.org/10.1186/s43020-026-00222-y", "authors": "Shi Du ほか", "venue": "Satellite Navigation", "date": "2026-10-07", "sjr": 3.423, "citescore": 19.9, "citescore_year": "2025", "apa": "Du, S., Tang, L., Wang, J., Brack, A., Cui, B., Huang, G., & Schuh, H. (2026). Performance gap between archived real-time and post-processed precise products for multi-GNSS and multi-frequency PPP-AR. Satellite Navigation, 7(1). https://doi.org/10.1186/s43020-026-00222-y", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "GNSSの精密単独測位（PPP-AR）で、リアルタイムの衛星軌道・時計の補正情報と事後処理の最終情報の性能差を、衛星系・周波数・精度要求別に定量化した（抄録）。", "p3": "世界249のMGEX観測局の31日分を、CNES/CLSと武漢大学のリアルタイム補正のアーカイブと、武漢大学の事後最終補正で処理し、単一〜3衛星系、2・3周波で比べた（抄録）。", "p5": "GPSのみで10cm基準の上下方向の収束時間はリアルタイム約26.5分、事後約15.5分。GPS・Galileo・BDS-3の組合せでは約6.5分と1.5分。5cm基準ではGPSのみで約71.0分と24.0分に差が広がった（抄録）。", "fun": "スマホの位置情報より桁違いに正確な測位には、衛星の位置と時計のずれを補正する情報が欠かせません。その情報を「今すぐ」使うか「後で確定版を」使うかで、精度が出るまでの時間が大きく違います。複数の衛星システムを組み合わせると差が縮むという点も実用的です。", "unverified": "通信遅延や途絶は実験に含まれず、実際のリアルタイム性能は低くなりうる（抄録）。"}}, {"id": "jr20", "rank": 20, "headline": "実測の準線形FRFで非線形構造を部分系に分離", "title": "Frequency Based Nonlinear Decoupling Using Experimentally Measured Quasi-Linear FRFs.", "url": "https://doi.org/10.25518/2684-6500.367", "authors": "Furkan K. Çelik ほか", "venue": "Journal of Structural Dynamics", "date": "2026-10-07", "apa": "Çelik, F. K., Özer, M. B., & Özgüven, H. N. (2026). Frequency Based Nonlinear Decoupling Using Experimentally Measured Quasi-Linear FRFs. Journal of Structural Dynamics. https://doi.org/10.25518/2684-6500.367", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "組み立てた構造の測定から、非線形性を持つ未知の部分構造の特性を、非線形性の場所を事前に知らなくても切り出せる一般的な周波数ベースのデカップリング法NL-FBDを提案した（抄録）。", "p3": "応答制御試験で結合系の準線形な周波数応答関数を応答レベルごとに測り、既知の部分構造を線形デカップリングで差し引き、応答依存の非線形モードパラメータを同定する（抄録）。", "p5": "非線形の梁と線形の梁を組み合わせた実験で、非線形の梁を正確に分離し、新しい組合せの強制応答を高い加振レベルでも測定とよく一致して予測した（抄録）。", "fun": "二つの部品がつながった機械の揺れ方から、片方の部品だけの性質を逆算する「引き算」の技術です。部品の性質が揺れの大きさで変わる（非線形）と引き算が難しくなりますが、揺れの大きさをそろえて測ることで、その壁を越えました。", "unverified": "数値例での精度の具体的な値は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "損傷規模・補修法・単価から橋の維持費を段階推定", "title": "Multistage Cost Estimation Framework for Transparent and Granular Bridge Maintenance", "url": "https://doi.org/10.1061/jitse4.iseng-3068", "authors": "Taeyeon Chang ほか", "venue": "Journal of Infrastructure Systems", "date": "2026-10-07", "citescore": 5.0, "citescore_year": "2025", "apa": "Chang, T., Lee, G., Yoon, S., Chi, S., & Moon, S. (2026). Multistage Cost Estimation Framework for Transparent and Granular Bridge Maintenance. Journal of Infrastructure Systems, 32(4). https://doi.org/10.1061/jitse4.iseng-3068", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "橋の維持管理費を、損傷の規模→補修方法→単価→総額の順に段階的に推定し、内訳まで説明できる枠組みを提案した（抄録）。", "p3": "韓国の橋梁管理システムの点検記録3,716件で、XGBoostに基づく段階的なパイプラインを作り、実際の維持管理記録100件で検証した（抄録）。", "p5": "従来の総額を直接予測するモデルに比べ、平均絶対誤差を41.3%と73.7%減らした（抄録）。", "fun": "費用をAIに一発で当てさせるより、「どれだけ壊れているか」「どう直すか」「いくらかかるか」と、現場の人が考える順に分けて予測した方がよく当たりました。計算の手順を人の仕事の論理に合わせると、精度も説明のしやすさも上がるという好例です。", "unverified": "二つの比較モデルの具体的な内容は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "GNSS変位の常時微動から固有振動数を抽出", "title": "An ambient vibration data-driven framework for hybrid mode decomposition-based modal frequency analysis using GNSS displacements", "url": "https://doi.org/10.1016/j.measurement.2026.123449", "authors": "Meng Wang ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-06", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Wang, M., Liu, Y., Dong, Y., Xiong, K., & Cao, H. (2026). An ambient vibration data-driven framework for hybrid mode decomposition-based modal frequency analysis using GNSS displacements. Measurement, 123449. https://doi.org/10.1016/j.measurement.2026.123449", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、GNSSで測った変位の常時微動データから、ハイブリッドなモード分解で構造の固有振動数を求めるデータ駆動の枠組みを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "衛星測位で建物や橋のわずかな動きを測り、そこから「その構造が揺れやすい振動数」を取り出せるか、という問いです。GNSSの変位は雑音が大きいので、信号を上手に分解する工夫が鍵になりそうです。", "unverified": "手法・対象構造・結果のすべてが未確認。"}}, {"id": "jr23", "rank": 23, "headline": "位相依存の橋梁モデルで車輪-レール力を連続再構成", "title": "Encoder-free continuous reconstruction of signed wheel–rail forces using a calibration constrained phase-dependent bridge model", "url": "https://doi.org/10.1016/j.measurement.2026.123319", "authors": "Dadi Li ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-06", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Li, D., Huang, L., Wang, Q., Wei, L., He, T., & Dai, H. (2026). Encoder-free continuous reconstruction of signed wheel–rail forces using a calibration constrained phase-dependent bridge model. Measurement, 123319. https://doi.org/10.1016/j.measurement.2026.123319", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、エンコーダを使わずに、較正で拘束した位相依存の橋梁モデルから、符号つきの車輪-レール間の力を連続的に再構成する方法を扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "列車の車輪がレールを押す力は直接測りにくい量です。橋の側の揺れから、その力の大きさと向きを途切れなく逆算できるか、という問いは、橋と車両がお互いを映す鏡になっていることを利用する面白い発想です。", "unverified": "手法・検証・結果のすべてが未確認。"}}, {"id": "jr24", "rank": 24, "headline": "伊ニシェミの大規模地すべりがサイクロン後に再活動", "title": "The reactivation of the Niscemi landslide (southern Italy) after the Cyclone Harry", "url": "https://doi.org/10.1007/s10346-026-02857-z", "authors": "Luigi Guerriero ほか", "venue": "Landslides", "date": "2026-10-07", "sjr": 1.778, "citescore": 12.5, "citescore_year": "2025", "apa": "Guerriero, L., Di Martire, D., Annella, C., Capozzi, V., D’Esposito, L., Di Muro, C., Francioni, M., Vermi, F., & Calcaterra, D. (2026). The reactivation of the Niscemi landslide (southern Italy) after the Cyclone Harry. Landslides. https://doi.org/10.1007/s10346-026-02857-z", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2026年1月25日にイタリア・シチリアのニシェミ台地で起きた大規模な複合地すべりの、破壊の仕組み・前兆・誘因の初期解析を示した（抄録）。", "p3": "地形図化、DInSARと特徴追跡、斜面安定解析、気象データを統合した。事象はサイクロン・ハリーの豪雨の約1週間後で、1790年と1997年にも大崩壊のあった斜面である（抄録）。", "p5": "粘土質の地層内の弱層と既存のすべり面に支配された深い複合すべりで、事前の干渉データでは台地縁の加速変形は限られ、急速な破壊開始が示唆された。約1,500人が避難した（抄録）。", "fun": "同じ斜面が200年以上の間に何度も崩れており、地形に残る「記憶」と衛星の観測を組み合わせることが重要だと示しています。前兆がほとんど見えないまま急に崩れたという点は、眠っている地すべりの怖さを物語っています。", "unverified": "安定解析の安全率などの数値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "DEMの特異な散逸モデルを平滑化し精度次数を改善", "title": "Mollification of singular dissipation models for order improvement in discrete element me ）", "preprint": false, "short": true, "p1": "都市の形態が、暑さの緩和、豪雨時の浸水抑制、鳥の多様性、健康、小規模事業の活力という複数の都市機能と同時にどう関連し、相乗効果やトレードオフを生むかを示した（抄録）。", "p3": "対照的な香港とチューリッヒを事例に、5つの都市機能を多機能評価で分析した（抄録）。", "p5": "不透水面の多さは浸水と暑さの緩和と一貫して負に関連し、水辺への近さは両方と正に関連した。不規則な形の緑地は鳥の多様性を高めるが浸水抑制は低いというトレードオフがあった（抄録）。", "fun": "緑地をつくれば何でも良くなる、とは限りません。でこぼこした形の緑地は鳥には良くても、雨水をためる力は弱いのです。一つの目的だけでなく、いくつもの働きを同時に比べると、街づくりの選択の難しさと面白さが見えてきます。", "unverified": "関連の大きさ（係数）は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "駅近でもLRTを使わない意図と行動のずれ", "title": "BEYOND ACCESS: EXPLAINING THE INTENTION-BEHAVIOUR GAP IN LIGHT RAIL TRANSIT USE WITHIN TRANSIT-ORIENTED DEVELOPMENTS", "url": "https://doi.org/10.21837/pm.v24i44.2249", "authors": "Naomi Nathalia ほか", "venue": "PLANNING MALAYSIA", "date": "2026-10-07", "citescore": 1.8, "citescore_year": "2025", "apa": "Nathalia, N., & Septanaya, I. D. M. F. (2026). BEYOND ACCESS: EXPLAINING THE INTENTION-BEHAVIOUR GAP IN LIGHT RAIL TRANSIT USE WITHIN TRANSIT-ORIENTED DEVELOPMENTS. Planning Malaysia, 24. https://doi.org/10.21837/pm.v24i44.2249", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ジャカルタの駅近の集合住宅（TOD地区）の住民がLRTを使いたがらない要因を、計画行動理論で分析した（抄録）。", "p3": "計画行動理論とPLS-SEMで、態度、主観的規範、知覚された行動の統制感、環境規範、意図、習慣と「LRT利用への抵抗」の関係を推定した（抄録）。", "p5": "知覚された行動の統制感が抵抗の最も強い予測因子で、意図とは仮説と逆の負の関連を示した。モデルは意図の58.3%、抵抗の35.9%を説明した（抄録）。", "fun": "駅のすぐそばに住んでいても電車を使うとは限りません。「自分で何とかできる」と感じる人ほど、かえって使わないという逆向きの結果が出ています。便利な場所に住むことと、実際に行動が変わることの間には距離がある、という点が考えさせられます。", "unverified": "判別妥当性が十分に確立されず、一部の関係は暫定的とされている（抄録）。標本数は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "分割統治の複数LLMエージェントで長編脚本を改稿", "title": "Plug-and-Play Dramaturge: A Divide-and-Conquer Approach for Iterative Narrative Script Refinement via Collaborative LLM Agents", "url": "https://doi.org/10.1145/3856818", "authors": "Wenda Xie ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-10-06", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "apa": "Xie, W., Guo, C., Jing, Y., Wang, J., Lv, Y., & Wang, F.-Y. (2026). Plug-and-Play Dramaturge: A Divide-and-Conquer Approach for Iterative Narrative Script Refinement via Collaborative LLM Agents. ACM Transactions on Intelligent Systems and Technology. https://doi.org/10.1145/3856818", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "長い物語の脚本を、階層的な複数のLLMエージェントで全体構造から細部まで一貫して改稿する分割統治の手法Dramaturgeを提案した（抄録）。", "p3": "全体の筋と構造の問題をつかむ全体レビュー、場面と文の欠点を見つける場面レビュー、両者の改善を統合する階層的な協調改稿の3段階を、改善がなくなるまで粗から細へ反復する（抄録）。", "p5": "脚本全体の質と場面の細部の両方で、すべての比較手法を有意に上回った。既存手法に組み込める（抄録）。", "fun": "長い物語をAIに一度で書かせると、途中で設定が食い違いがちです。そこで、監督役が全体を見て方針を決め、各場面の担当がそれに沿って直す、という劇団のような分業にしました。上から下へ方針を流すことで、細部の修正が全体を壊さないようにしています。", "unverified": "評価方法と改善の具体的な数値は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "生成AIの誤りが文化遺産教育のサービス回復を左右", "title": "System Hallucination Frequency and Service Failure Recovery in AI-Assisted Heritage Education: Psychological Safety, Collaborative Learning, and Technological Contingencies", "url": "https://doi.org/10.3390/a19100852", "authors": "Ahmed K. Elnagar ほか", "venue": "Algorithms", "date": "2026-10-07", "citescore": 5.4, "citescore_year": "2025", "apa": "Elnagar, A. K., Verdejo, E. Á., Sobaih, A. E. E., Abdelghani, T. M., Abu Elnasr, A. E., & Elshaer, A. M. (2026). System Hallucination Frequency and Service Failure Recovery in AI-Assisted Heritage Education: Psychological Safety, Collaborative Learning, and Technological Contingencies. Algorithms, 19(10), 852. https://doi.org/10.3390/a19100852", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "文化遺産教育で生成AIのハルシネーション（もっともらしい誤り）が多いと感じるほど、現場でのサービス失敗の回復が損なわれ、学習者の心理的安全性と協働学習がその経路になることを示した（抄録）。", "p3": "AIを使った文化遺産の学習経験があるサウジアラビアの大学生427人の横断調査を構造方程式モデルで分析した（抄録）。", "p5": "ハルシネーションの頻度の知覚は回復の有効性、心理的安全性、協働学習と負に関連し、心理的安全性と協働学習は回復の有効性と正に関連した。協働学習と検索の質は負の関連を和らげた（抄録）。", "fun": "AIがもっともらしい間違いをしたとき、それを学びの場で立て直せるかは、学習者が「間違いを指摘しても大丈夫」と感じられるかにかかっている、という結果です。AIの失敗への対処も、結局は人と人の関係の問題になる点が面白いところです。", "unverified": "横断調査であり因果関係は示されていない。効果の大きさは未確認。"}}, {"id": "jr32", "rank": 32, "headline": "ECのサービス回復で知覚公正と感情が満足を回復", "title": "Unpacking Service Recovery and Post-Recovery Satisfaction in Nepal's E-Commerce: A PLS-SEM Analysis of Perceived Justice and Customer Emotions in Kathmandu Valley", "url": "https://doi.org/10.3126/qjmss.v8i3.100530", "authors": "Sabina Maharjan", "venue": "Quest Journal of Management and Social Sciences", "date": "2026-10-07", "apa": "Maharjan, S. (2026). Unpacking Service Recovery and Post-Recovery Satisfaction in Nepal’s E-Commerce: A PLS-SEM Analysis of Perceived Justice and Customer Emotions in Kathmandu Valley. Quest Journal of Management and Social Sciences, 8(3), 815–831. https://doi.org/10.3126/qjmss.v8i3.100530", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ネパールのネット通販で、サービス失敗後の回復満足には、補償の中身より手続きの公正と対応の丁寧さが効くことを示した（抄録）。", "p3": "カトマンズ盆地の通販利用者403人に質問紙調査を行い、分配・手続き・相互作用の公正と、肯定・否定の感情が回復後の満足に与える影響をSEMで分析した（抄録）。", "p5": "手続きの公正と相互作用の公正は回復後の満足に有意に影響したが、分配の公正には有意な直接効果がなかった。感情は満足に有意に影響せず、媒介もしなかった（抄録）。", "fun": "商品のトラブルで不満を持ったお客さんは、何をもらったか（返金や割引）より、どう扱われたか（手続きの公平さ、丁寧な対応）で機嫌を直す、という結果です。お詫びの品より、きちんとした対応の方が大事だという、日常の感覚に合う発見です。", "unverified": "標本が目的的抽出であり、一般化の範囲は限られる。"}}, {"id": "jr33", "rank": 33, "headline": "ラストマイル配送の価値共創と顧客満足", "title": "Value co-creation and customer satisfaction in last-mile delivery services: The roles of digital accessibility and delivery service quality", "url": "https://doi.org/10.1371/journal.pone.0359308", "authors": "Wanyang Zhou ほか", "venue": "PLoS ONE", "date": "2026-10-06", "citescore": 4.8, "citescore_year": "2025", "apa": "Zhou, W., Manansala, L. D., Valerio, A., & Sun, X. (2026). Value co-creation and customer satisfaction in last-mile delivery services: The roles of digital accessibility and delivery service quality. PLOS One, 21(10), e0359308. https://doi.org/10.1371/journal.pone.0359308", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "都市のラストマイル配送で、顧客の参加行動と市民的行動（価値共創）が、配送サービスの質を通じて満足を高め、デジタルの使いやすさがその効果を強めることを示した（抄録）。", "p3": "中国の都市の消費者426人のデータを構造方程式モデルで分析し、サービス品質の次元の媒介とデジタル・アクセシビリティの調整を調べた（抄録）。", "p5": "参加行動は満足を直接高め、市民的行動は主に業務・個別対応・対人接触の質を通じて間接的に影響した。デジタル・アクセシビリティは両行動のサービス品質への効果を強めたが、満足への直接の影響は限られた（抄録）。", "fun": "荷物を受け取る側も、置き場所を指定したり配達員に協力したりすることで、サービスづくりに参加しています。お客さんの協力が配送の質を上げ、それが満足につながるという見方は、サービスを店と客の共同作業と捉える考え方です。", "unverified": "効果の大きさ（係数）は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "注文追跡が待ち時間の体験とロイヤルティを変える", "title": "Designing the waiting experience: How order tracking shapes consumer engagement and loyalty", "url": "https://doi.org/10.1016/j.jretconser.2026.105117", "authors": "Chengbao Zhang ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-07", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "apa": "Zhang, C., Hu, J., Bi, Z., & Wang, Y. (2027). Designing the waiting experience: How order tracking shapes consumer engagement and loyalty. Journal of Retailing and Consumer Services, 95, 105117. https://doi.org/10.1016/j.jretconser.2026.105117", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、注文の追跡（オーダートラッキング）が待ち時間の体験をどう形づくり、消費者の関与とロイヤルティに影響するかを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "荷物が今どこにあるかがわかると、同じ待ち時間でもイライラが減る気がします。待つことそのものより「待ち方の体験」が満足を左右するのではないか、という問いは、行列の心理学ともつながる面白いテーマです。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jr35", "rank": 35, "headline": "会計研究でのネトノグラフィーの使われ方を整理", "title": "Netnography in accounting and accountability research: methodological application and future directions", "url": "https://doi.org/10.1108/aaaj-04-2026-9175", "authors": "Giulia Leoni", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-10-07", "sjr": 1.574, "apa": "Leoni, G. (2026). Netnography in accounting and accountability research: methodological application and future directions. Accounting, Auditing & Accountability Journal, 39(9), 489–521. https://doi.org/10.1108/aaaj-04-2026-9175", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "会計・説明責任の研究で、オンラインの共同体を観察する方法ネトノグラフィーがどう使われてきたかを、初めて方法論の面から体系的に評価した（抄録）。", "p3": "2011〜2026年に発表された会計・説明責任の論文41本を、研究設計、データ収集、データの種類、分析方法、研究者の関与の度合いの観点で分析した（抄録）。", "p5": "方法としての正統性は得ているが、自然に生じたデジタルの痕跡と受け身の観察に偏り、分析もおなじみの質的手法が中心で、内省的・参加的・多様な形式の可能性は十分に生かされていなかった（抄録）。", "fun": "SNSやネット掲示板は、人々が会計や企業の責任について本音を語る場でもあります。それを研究に使う方法は広まりましたが、多くは「眺めるだけ」で、研究者が中に入って対話する本来の強みはまだ使われていない、という指摘です。", "unverified": "論文の選定基準の詳細は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "監査委員会の特性がサイバーリスク開示を変える", "title": "Audit committee and board-level governance effects on cybersecurity disclosure: evidence from the Takaful insurance industry", "url": "https://doi.org/10.1108/jiabr-06-2025-0364", "authors": "Wael Hemrit", "venue": "Journal of Islamic Accounting and Business Research", "date": "2026-10-07", "citescore": 7.9, "citescore_year": "2025", "apa": "Hemrit, W. (2026). Audit committee and board-level governance effects on cybersecurity disclosure: evidence from the Takaful insurance industry. Journal of Islamic Accounting and Business Research, 1–31. https://doi.org/10.1108/jiabr-06-2025-0364", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "イスラム保険（タカフル）業界で、監査委員会の特性がサイバーセキュリティ・リスクの開示の量や読みやすさ、言葉づかいに影響することを示した（抄録）。", "p3": "2020〜2023年の開示について、計数データモデル、パネル推定、システムGMMで、監査委員会の規模、独立委員、シャリア委員会の規模、監査報酬との関係を分析した（抄録）。", "p5": "開示の長さは期間中に直線的に増え、監査委員会の規模、シャリア委員会の規模、独立委員の存在と関連した。監査報酬が下がると読みにくくなり、独立委員の割合が高いと読みやすくなった（抄録）。", "fun": "サイバー攻撃の危険をどれだけ、どんな言葉で書くかは、会社を見張る委員会の顔ぶれで変わります。独立した委員が多いほど文章が読みやすくなるという結果は、開示を「中身」だけでなく「伝わりやすさ」で評価する視点として面白いものです。", "unverified": "標本の企業数と効果の大きさは未確認。"}}, {"id": "jr37", "rank": 37, "headline": "会計基準のマクロ経済への含意", "title": "Macroeconomic implications of accounting standards", "url": "https://doi.org/10.1016/j.jacceco.2026.101953", "authors": "Hyun Hwang ほか", "venue": "Journal of Accounting and Economics", "date": "2026-10-07", "sjr": 8.748, "citescore": 11.7, "citescore_year": "2025", "apa": "Hwang, H., Kim, E., & Laux, V. (2026). Macroeconomic implications of accounting standards. Journal of Accounting and Economics, 101953. https://doi.org/10.1016/j.jacceco.2026.101953", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、会計基準がマクロ経済に及ぼす含意を扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "会計基準は、企業が数字をどう記録するかの決まりにすぎないように見えます。それが景気や投資など経済全体の動きにまで影響しうるのか、という問いは、小さなルールが大きな結果を生む仕組みを考えさせる面白いテーマです。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jr38", "rank": 38, "headline": "取締役会と企業価値を利益調整が媒介", "title": "Board Characteristics and Firm Value in Emerging Markets: The Mediating Role of Earnings Management", "url": "https://doi.org/10.28991/esj-2026-010-05-015", "authors": "Anh Cao Thi Nhan ほか", "venue": "Emerging Science Journal", "date": "2026-10-01", "citescore": 8.1, "citescore_year": "2025", "apa": "Anh, C. T. N., & Ngoc Tien, N. (2026). Board Characteristics and Firm Value in Emerging Markets: The Mediating Role of Earnings Management. Emerging Science Journal, 10(5), 2889–2907. https://doi.org/10.28991/esj-2026-010-05-015", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ベトナムの上場企業で、取締役会の構造が利益調整を抑えることを通じて企業価値を高めることを示した（抄録）。", "p3": "2016〜2023年の4,196企業年の観測で、兼任の多さ（多忙な取締役）を含む取締役会指数を作り、発生高による利益調整と実体的な利益調整の媒介効果を検証した（抄録）。", "p5": "強い取締役会は企業価値の高さと、両方の利益調整の少なさに関連した。利益調整は効果の一部を伝え、実体的な利益調整の媒介がより顕著だった（抄録）。", "fun": "利益の数字は、会計の処理（帳簿上）だけでなく、販売や支出の時期をずらす実際の行動でも調整できます。この研究では、取締役会の監視が効くと、とくに後者の「実際の行動での調整」が減り、それが企業価値につながっていました。", "unverified": "効果の大きさ（係数）は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "AI時代の人材開発を共通善の観点で再構想", "title": "Human Resource Development in the Era of Artificial Intelligence: A Common Good Approach", "url": "https://doi.org/10.1002/hrdq.70034", "authors": "Fang Lee Cooke ほか", "venue": "Human Resource Development Quarterly", "date": "2026-10-06", "sjr": 1.52, "citescore": 11.6, "citescore_year": "2025", "apa": "Cooke, F. L., Jiang, Z., & Xie, J. (2026). Human Resource Development in the Era of Artificial Intelligence: A Common Good Approach. Human Resource Development Quarterly. https://doi.org/10.1002/hrdq.70034", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "AI時代の人材開発（HRD）を、効率だけでなく個人と社会の「共通善」の観点から捉え直す視点を提案した理論論文（抄録）。", "p3": "誰の能力が認められ、誰の学習が支えられ、誰のキャリアが守られるかという社会的・倫理的な問いから、雇用を失いやすい従業員の支援と、持続的な労働力の育成を両立させる考え方を示した（抄録）。", "p5": "HRDを従来の人事機能から、公正・関係・持続可能性を重視する仕組みへ変えることを提案し、新しい研究課題を示した。実証データはない（抄録）。", "fun": "AIで仕事が変わるとき、会社が社員教育をするのは「会社のため」だけでしょうか。この論文は、社員とその家族、ひいては社会のためでもあると考えます。人を育てることを、みんなの共有財産づくりと見る発想の転換です。", "unverified": "理論論文であり、実証的な裏づけはない。"}}, {"id": "jr40", "rank": 40, "headline": "役員の持続可能性報酬が一般社員の行動を変える", "title": "Effects of Executive Sustainability Compensation on Nonexecutive Employee Behavior", "url": "https://doi.org/10.1002/bse.71630", "authors": "Natalie Rupp", "venue": "Business Strategy and the Environment", "date": "2026-10-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Rupp, N. (2026). Effects of Executive Sustainability Compensation on Nonexecutive Employee Behavior. Business Strategy and the Environment. https://doi.org/10.1002/bse.71630", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "役員報酬が持続可能性の目標に連動していると一般社員に知らせると、社員自身も持続可能な判断をしやすくなることを実験で示した（抄録）。", "p3": "オンライン実験で、役員の持続可能性連動の報酬の情報と、経営トップの姿勢（トーン）の情報を一般社員役の参加者に示し、持続可能な意思決定を比べた（抄録）。", "p5": "役員報酬の情報は持続可能な判断の確率を有意に高めたが、トップの姿勢の情報には有意な効果がなかった（抄録）。", "fun": "社長が「環境を大切に」と言うだけでは社員は動かないのに、「社長のボーナスが環境目標に連動している」と知ると動く、という結果です。言葉よりお金の仕組みのほうが本気度を伝える、というのは人間らしい反応かもしれません。", "unverified": "参加者数と効果の大きさは未確認。"}}, {"id": "jr41", "rank": 41, "headline": "保育職の燃え尽きを要求度と多層の資源で説明", "title": "A Realist Inquiry of Job Demands, Multi-level Resources, and Burnout among Early Childhood Education Professionals in Colorado: A Structural Equation Model", "url": "https://doi.org/10.1016/j.shaw.2026.09.011", "authors": "Jamie N. Powers ほか", "venue": "Safety and Health at Work", "date": "2026-10-06", "sjr": 0.912, "citescore": 5.4, "citescore_year": "2025", "apa": "Powers, J. N., Zhang, D., Puma, J. E., & Farewell, C. V. (2026). A Realist Inquiry of Job Demands, Multi-level Resources, and Burnout among Early Childhood Education Professionals in Colorado: A Structural Equation Model. Safety and Health at Work. https://doi.org/10.1016/j.shaw.2026.09.011", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、米コロラド州の幼児教育の専門職について、仕事の要求度と多層の資源から燃え尽きを説明する構造方程式モデルを、リアリスト的な探究として扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "保育の仕事は心身の負担が大きく、燃え尽きやすい職業です。個人の努力だけでなく、職場や地域など何層もの支えが燃え尽きを防げるのか、という問いは、働く人をどう守るかを考える上で大切です。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jr42", "rank": 42, "headline": "介護保険の恩恵は配偶者と子の介護者で異なる", "title": "Who benefits from long-term care insurance? Heterogeneous effects among spousal and adult-child caregivers in China", "url": "https://doi.org/10.1016/j.ssmph.2026.101976", "authors": "Yichen Qiu ほか", "venue": "SSM - Population Health", "date": "2026-10-06", "sjr": 1.504, "citescore": 7.0, "citescore_year": "2025", "apa": "Qiu, Y., & Ohinata, A. (2026). Wh  Y., & Li, Y. (2026). A-59: Caregiving Frequency and Loneliness Among Older Women: Examining the Role of Marital Status. Archives of Clinical Neuropsychology, 41(Supplement_2), ii28–ii28. https://doi.org/10.1093/arclin/acag065.076", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの学会抄録を使用（本文なし）", "preprint": false, "short": true, "p1": "米国の高齢女性で、介護の頻度は孤独と関連せず、未婚であることが孤独の主な予測因子だったことを示した学会抄録（抄録）。", "p3": "2022年の健康と退職調査（HRS）の女性2,309人（平均約70歳）で、Hughesの3項目の孤独尺度を用い、共変量、介護頻度、婚姻状態との交互作用を段階的に加える階層的回帰を行った（抄録）。", "p5": "介護頻度を加えてもモデルの当てはまりは改善しなかった（ΔR²=.001、p=.301）。婚姻状態と交互作用を加えると改善し（ΔR²=.048）、未婚であることが小〜中程度の効果を持った（抄録）。", "fun": "介護の負担が重いほど孤独になる、と予想されましたが、データはそうなりませんでした。孤独を左右していたのは、介護の量ではなく、そばにパートナーがいるかどうかでした。予想が外れたこと自体が、孤独の本質を考えるヒントになっています。", "unverified": "横断データであり、因果の向きは今後の縦断研究が必要とされる（抄録）。"}}, {"id": "jr45", "rank": 45, "headline": "5か国のコホートで高齢者のデジタル排除を機械学習分類", "title": "Machine learning classification of digital exclusion in ageing populations across five international cohorts", "url": "https://doi.org/10.1038/s41746-026-03268-z", "authors": "Shenwei Wan ほか", "venue": "npj Digital Medicine", "date": "2026-10-06", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "apa": "Wan, S., Fu, C., Lu, C., Ding, Z., Wang, S., Zhou, L., & Lei, X. (2026). Machine learning classification of digital exclusion in ageing populations across five international cohorts. Npj Digital Medicine. https://doi.org/10.1038/s41746-026-03268-z", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、5つの国際的なコホートで、高齢者のデジタル排除を機械学習で分類することを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "スマホやネットを使えないことで、行政サービスや人とのつながりから取り残される高齢者がいます。誰がそうなりやすいかを国をまたいで見分けられるか、という問いは、デジタル化の陰の格差に光を当てる試みです。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jr46", "rank": 46, "headline": "沿岸都市で回復的な水辺緑地へのアクセスが不平等", "title": "Unequal access to restorative coastal blue–green ding Experiment. British Journal of Management. https://doi.org/10.1111/1467-8551.70106", "why": "4,510人の実験で起業家の性別・業種・リターンを操作し、性別の同類性が出資判断に与える影響を検証した。"}, {"id": "jn13", "rank": 13, "field": "情報システム", "headline": "規制とITが互いを生む「景観摩擦」の概念", "title": "The Recursive Relationship Between Technology and Regulations: Managing Landscape Frictions in the Financial Services Industry", "url": "https://doi.org/10.1177/02683962261498053", "authors": "Ake Freij ほか", "venue": "Journal of Information Technology", "date": "2026-10-07", "sjr": 2.434, "citescore": 16.3, "citescore_year": "2025", "apa": "Freij, A., Buffart, M., & Wennberg, K. (2026). The Recursive Relationship Between Technology and Regulations: Managing Landscape Frictions in the Financial Services Industry. Journal of Information Technology. https://doi.org/10.1177/02683962261498053", "why": "EUの44規制の文書分析と60件の聞き取りから、複数規制下の企業のIT対応を継続的過程として理論化した。"}, {"id": "jn14", "rank": 14, "field": "地震工学・防災", "headline": "石膏ボード壁の損傷確率関数はFEMA値と大きく違う", "title": "Fragility Functions for Plasterboard‐Sheathed Walls in Light Timber‐Framed Residential Houses", "url": "https://doi.org/10.1002/esp4.70127", "authors": "Kexin Wang ほか", "venue": "Earthquake Spectra", "date": "2026-10-06", "citescore": 7.7, "citescore_year": "2025", "apa": "Wang, K., Bhatta, J., Li, M., Liu, A., & Dhakal, R. P. (2026). Fragility Functions for Plasterboard‐Sheathed Walls in Light Timber‐Framed Residential Houses. Earthquake Spectra, 42(4). https://doi.org/10.1002/esp4.70127", "why": "実験データから住宅の石膏ボード壁の地震損傷の確率関数を作り、既存の標準値との違いを示した。"}, {"id": "jn15", "rank": 15, "field": "物理学", "headline": "まばらで選択的な結合がレーザー網を同期させる", "title": "Selective sparsity–enhanced synchronization in disordered semiconductor laser networks", "url": "https://doi.org/10.1073/pnas.2612387123", "authors": "Li-Li Ye ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-06", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Ye, L.-L., Vigne, N., Lin, F.-Y., Cao, H., & Lai, Y.-C. (2026). Selective sparsity–enhanced synchronization in disordered semiconductor laser networks. Proceedings of the National Academy of Sciences, 123(41). https://doi.org/10.1073/pnas.2612387123", "why": "逆向きに周波数がずれた発振器同士をつなぐ疎なネットワークが全結合より同期しやすいことを示した。"}, {"id": "jn16", "rank": 16, "field": "地震工学・防災", "headline": "CLTロッキング壁と木造壁の併用5階建ての耐震性", "title": "Numerical Simulations of 5‐Story Building Using Wood Light‐Frame Shear Walls and Post‐Tensioned Cross‐Laminated Timber Rocking Wall Dual Systems", "url": "https://doi.org/10.1002/eqe.70307", "authors": "Ruben Jerves ほか", "venue": "Earthquake Engineering & Structural Dynamics", "date": "2026-10-07", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Jerves, R., & Phillips, A. R. (2026). Numerical Simulations of 5‐Story Building Using Wood Light‐Frame Shear Walls and Post‐Tensioned Cross‐Laminated Timber Rocking Wall Dual Systems. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70307", "why": "木造中層建築の二重耐震システムの構成を数値解析で比較した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "5階建て木造建物で、ポストテンションCLTロッキング壁と従来の木造せん断壁を併用すると、倒壊や層間変形が減り耐震性能が上がることを示した（抄録）。", "p3": "高地震域のサンノゼの5階建て住宅を想定し、既存の設計手順に基づく併用系の設計法を示し、2次元モデルの非線形時刻歴解析で、ロッキング壁の負担せん断力を0・15・25・50・100%に変えて比べた（抄録）。", "p5": "ロッキング壁を入れると倒壊数、最大・残留の層間変形角、特定の層への変形集中が減った。床応答加速度の中央値は同程度だが、大きな値が出る可能性は増えうる（抄録）。", "fun": "地震で揺れても、ワイヤーで引き締めた木の壁が「起き上がりこぼし」のように元の位置に戻る仕組み（セルフセンタリング）を、普通の木造壁と組み合わせました。一つの階だけがつぶれる「ソフトストーリー崩壊」を防げるという点が、木造の中層建築に希望を与えます。", "unverified": "倒壊数などの具体的な数値は未確認。"}}, {"id": "jn17", "rank": 17, "field": "地震工学・防災", "headline": "地震と波が同時に作用する多体系の流体連成", "title": "Motion‐Dependent Hydrodynamic Interactions and Flow‐Field Evolution in Multi‐Body Systems Under Combined Earthquake and Wave Action", "url": "https://doi.org/10.1002/eqe.70300", "authors": "Jialei Yan ほか", "venue": "Earthquake Engineering & Structural Dynamics", "date": "2026-10-07", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Yan, J., Wu, R., Zhou, C., Liu, J., & Guo, A. (2026). Motion‐Dependent Hydrodynamic Interactions and Flow‐Field Evolution in Multi‐Body Systems Under Combined Earthquake and Wave Action. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70300", "why": "地震と波の複合作用での浮体・多体系の流れ場と連成を解析した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "地震と波が同時に作用するときの浮体の多体系で、物体の動き方の違いが波力と周囲の流れ場にどう影響するかを模型実験で明らかにした（抄録）。", "p3": "縮尺模型の試験を粒子画像流速計（PIV）で計測し、前方と対象のポンツーンの各自由度の運動と波力・流れ場の関係を調べた（抄録）。", "p5": "対象ポンツーンのエネルギーは卓越波の周波数帯に集中した。地震を加えると、前後・左右の動きは水平力と曲げモーメントを、上下動は鉛直力を大きくし、高周波の地震動はさらに荷重を増やした。流れ場では乱流エネルギーとレイノルズ応力の分布が変わった（抄録）。", "fun": "海に浮かぶ橋や施設は、地震と波に同時に襲われることがあります。揺れ方の「向き」によって、受ける力の種類が変わるという結果は、浮体構造物の設計で何に備えるべきかを教えてくれます。水の流れを光で可視化して確かめている点も面白いところです。", "unverified": "荷重の増加幅の具体的な数値は未確認。"}}, {"id": "jn18", "rank": 18, "field": "統計学", "headline": "政治参加の過大報告を減らす質問設計", "title": "Un-Priming Politics: A Method to Reduce Overreporting of Political Engagement", "url": "https://doi.org/10.1007/s11109-026-10200-4", "authors": "Elizabeth C. Connors ほか", "venue": "Political Behavior", "date": "2026-10-07", "sjr": 2.955, "citescore": 9.0, "citescore_year": "2025", "why": "調査で社会的望ましさによる過大報告を抑える質問手法を反復的に開発・検証した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "世論調査で政治参加が実際より多く報告される問題に対し、調査の「政治色」を薄める簡単な工夫で過大報告を減らせることを示した（抄録）。", "p3": "事前登録した4つの調査実験（計N=7,122）で、過大報告の原因が社会的望ましさにあることを確かめ、それを減らす様々な介入を反復的に試した（抄録）。", "p5": "最も効果的だったのは政治の目立ちやすさを下げる処置（Dampen Politics）で、調査が政治的だという知覚と、政治的関心や投票の自己報告を有意に減らした（抄録）。", "fun": "「選挙に行きましたか」と聞かれると、行っていない人も「行った」と答えがちです。調査全体が政治の話だと感じさせないように順番や言葉を工夫するだけで、正直な答えが増えました。質問の並べ方ひとつで答えが変わる、調査の奥深さがわかります。", "unverified": "過大報告の減少幅の具体的な数値は未確認。"}}, {"id": "jn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "リーダーシップ研究を立て直す三つの方向", "title": "Revitalizing Leadership Research: Three Directions", "url": "https://doi.org/10.1111/joms.70157", "authors": "Corinne Post", "venue": "Journal of Management Studies", "date": "2026-10-07", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "行動的リーダーシップ研究の現状への懸念と、立て直しの方向をめぐる論争をまとめたJMSの特集。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "行動的リーダーシップ研究の現状への懸念から、研究を立て直す三つの異なる方向を示した論争企画（Point-Counterpoint）の序論（抄録）。", "p3": "「行為の中の関係としてのリーダーシップ」「理論に基づくリーダーシップ観」「多値論理によるアプローチ」の三つの寄稿をまとめ、収束点と相違点を整理した（抄録）。", "p5": "リーダーシップ研究は単一のパラダイムに収束して進むのではなく、この企画のような対話と論争から進むだろうと結論した（抄録）。", "fun": "「良いリーダーとは何か」は昔から研究されてきましたが、同じような質問紙研究が増えるばかりだという批判があります。そこで三人の論者が異なる処方箋を出し合いました。一つの正解を決めるより、議論そのものが学問を前に進めるという立場が面白いところです。", "unverified": "三つの寄稿それぞれの具体的な主張の詳細は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "既存企業はフィンテックを聴衆の目で採用する", "title": "Toward an Audience‐Based View of Incumbent Adoption of Potentially Discontinuous Technologies: Evidence From Fintech", "url": "https://doi.org/10.1111/jpim.70059", "authors": "Tatjana Schneidmüller ほか", "venue": "Journal of Product Innovation Management", "date": "2026-10-06", "sjr": 3.57, "citescore": 16.7, "citescore_year": "2025", "why": "非連続的技術の採用を、正統性をめぐる聴衆の反応から説明する見方を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "既存企業が非連続的な新技術を採用するかどうかは、専門家・一般大衆・業界内部・規制当局といった「聴衆」の評価にどう反応するかで決まる、という聴衆に基づく見方を示した（抄録）。", "p3": "2000〜2016年の欧州の既存金融機関149社のフィンテックへの対応の縦断データで、聴衆ごとの言説上の関与と採用の関係を検証した（抄録）。", "p5": "聴衆全体の一様な関与は採用に非線形に影響した。既存企業は一般大衆の評価に最もはっきり反応し、支援専門家の好意的な関与には抵抗した。業界内部と規制当局の関与には頑健な直接効果はなかった（抄録）。", "fun": "新技術を取り入れるかどうか、銀行は専門家の意見よりも世間の声に動かされていた、という意外な結果です。専門家が勧めるほど逆に抵抗するという「専門性のペナルティ」は、まだ評価が定まらない技術の時代ならではの現象として興味深いものです。", "unverified": "効果の大きさ（係数）は未確認。"}}, {"id": "jn21", "rank": 21, "field": "物理学", "headline": "トリウム229に同期した原子核時計", "title": "A nuclear clock synchronized to 229Th", "url": "https://doi.org/10.1038/s41586-026-11122-1", "authors": "Beichen Huang ほか", "venue": "Nature", "date": "2026-10-07", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "原子核の遷移に時計を同期させた核時計の実現を報告したNature論文。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "トリウム229の原子核遷移に148.4nmの真空紫外レーザーを安定化させ、原子核時計を実現した（抄録）。", "p3": "229Th:CaF2結晶の温度に敏感でない核遷移に、カドミウム蒸気の四光波混合で作った10μWの真空紫外光源と、光電管による周波数変調吸収の読み出しで、速く信号雑音比の高い判別器を作った（抄録）。", "p5": "周波数の不安定度は5×10^-13/√(τ/s)に達した。別々に作った二つの結晶の時計遷移周波数は10^-13の水準で一致した（抄録）。", "fun": "ふつうの原子時計は原子の周りの電子の揺れを使いますが、この時計は原子の中心（原子核）の揺れを使います。原子核は周りの影響を受けにくいので、より安定な時計になる可能性があります。別々に作った結晶で同じ答えが出たことは、実用化に向けた大きな一歩です。", "unverified": "長時間の安定度の到達値は未確認。"}}, {"id": "jn22", "rank": 22, "field": "材料科学", "headline": "エッチングで2次元半導体の核生成位置を決める", "title": "Spatially deterministic nucleation of 2D semiconductors by etching flux", "url": "https://doi.org/10.1038/s41586-026-11095-1", "authors": "Jeongwon Park ほか", "venue": "Nature", "date": "2026-10-07", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "結晶がどこで生まれるかを空間的に決定的に制御する新しい成膜法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "エッチングの物質の流れ（フラックス）を利用して、2次元半導体の結晶の核をパターンの中心に一つだけ決まった位置に生じさせる方法を示した（抄録）。", "p3": "障壁から放出されるエッチング成分がパターンの縁の近くで核の発生を抑え、中心の核だけを残す。系統的な実験で仕組みを解明し、核ゼロ・単一・複数の設計則を示した（抄録）。", "p5": "10μm規模の二硫化モリブデン単結晶、最大117 cm²/V·sの電界効果移動度、大面積の均一性を実現し、一つの結晶に複数のトランジスタを集積できた（抄録）。", "fun": "結晶が「どこで生まれるか」は、これまで偶然任せでした。この研究は、周りから少しずつ削る力をかけることで、端では生まれず真ん中だけで生まれるように仕向けました。雪の結晶の生まれる場所を自由に決めるような話で、次世代の電子回路づくりにつながります。", "unverified": "大面積の均一性の定量値は未確認。"}}, {"id": "jn23", "rank": 23, "field": "機械学習", "headline": "LSTMで北米の生態系CO2交換量を推定", "title": "Improved estimation of net ecosystem CO 2 exchange over North America using LSTM-based flux upscaling (2001–2021)", "url": "https://doi.org/10.5194/essd-18-7367-2026", "authors": "Chengcheng Huang ほか", "venue": "Earth System Science Data", "date": "2026-10-07", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "観測塔データをLSTMで広域に拡張し、2001〜2021年の北米の炭素収支の推定を改善した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "LSTMを使って観測塔の測定と衛星データから北米の生態系の正味CO2交換量（NEE）を広域に推定し、既存の推定より大気の逆推定に近い炭素収支を得た（抄録）。", "p3": "生態系別のLSTMで、2001〜2021年の月別・0.1度格子のNEEデータセット（MemoryFlux）を作り、大気の逆推定と比べた（抄録）。", "p5": "季節変動はOCO-2 v10 MIP（r=0.96）やCarbonTracker2022（r=0.97）と強く相関した。年平均NEEは−1.27±0.12 Pg C/年で、既存の推定（−3.30〜−1.68）より逆推定（−0.83〜−0.70）に近かった（抄録）。", "fun": "森や畑がどれだけCO2を吸っているかは、地上の観測塔から広げて推定する方法と、空のCO2濃度から逆算する方法で答えが食い違っていました。過去の情報を覚えておけるAI（LSTM）を使うと、その差が縮まりました。記憶を持つことが自然の理解にも役立つ例です。", "unverified": "なし"}}, {"id": "jn24", "rank": 24, "field": "経済学", "headline": "時点の整合した言語モデルで先読みバイアスを防ぐ", "title": "Chronologically consistent large language models", "url": "https://doi.org/10.1016/j.jfineco.2026.104374", "authors": "Songrun He ほか", "venue": "Journal of Financial Economics", "date": "2026-10-06", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "金融の予測研究でLLMの学習データに将来情報が混入する問題を扱ったJFE論文。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "各時点で手に入ったテキストだけで学習した「時点整合的な」言語モデル（ChronoBERT・ChronoGPT）を作り、金融予測での先読みバイアスが小さいことを示した（抄録）。", "p3": "時点ごとに利用可能なデータだけで一連のモデルを学習し、自然言語処理のベンチマークと、金融ニュースから翌日の株価リターンを予測する資産価格の応用で評価した（抄録）。", "p5": "時間制約があってもBERTなどと同等以上の性能を示した。株価予測ではリアルタイムの出力が、はるかに大きいLlamaモデルと同程度のシャープレシオを達成した（抄録）。", "fun": "過去のデータでAIの予測力を試すとき、AIが「未来のニュース」をすでに学習していたら、それはカンニングです。そこで、その時点までの文章しか知らないAIを作って公平に試しました。カンニングの影響は思ったほど大きくなかった、という結果も興味深いところです。", "unverified": "シャープレシオの具体的な値は未確認。"}}, {"id": "jn25", "rank": 25, "field": "機械学習", "headline": "LLMの推論トークンは状態として働く", "title": "Characterizing the role of reasoning tokens in large language models as state over tokens", "url": "https://doi.org/10.1038/s42256-026-01303-y", "authors": "Mosh Levy ほか", "venue": "Nature Machine Intelligence", "date": "2026-10-07", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "why": "推論トークンの役割をトークン上の状態として特徴づけたNature Machine Intelligence論文。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、大規模言語モデルの推論トークン（考える途中に出す文字列）の役割を、トークン上の「状態」として特徴づけることを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIが答える前に「考えている途中の文章」を書くと、答えの精度が上がることが知られています。その途中の文章は、人間の思考の言葉なのか、それとも計算の途中経過を置いておくメモ帳のようなものなのか、という問いは、AIの「考える」仕組みの核心に迫るものです。", "unverified": "手法・結果のすべてが未確認。"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "拡散モデルによる異常検知と異常生成", "title": "Anomaly Detection and Generation with Diffusion Models: A Survey", "url": "https://doi.org/10.1109/tpami.2026.3739960", "authors": "Yang Liu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "拡散モデルを異常検知と異常データ生成の両面から整理したTPAMIの総合的な論文。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "拡散モデルを使った異常検知と異常データ生成を、画像・動画・時系列・表形式・マルチモーダルにわたって一体的に整理したサーベイ（抄録）。", "p3": "異常の採点方法、条件付けの戦略、構造設計に基づく分類（タクソノミー）を作り、理論的基礎と実装を解説した（抄録）。", "p5": "生成が異常データの不足を補い、検知が生成の忠実度を高めるという相互強化の関係を強調し、計算効率や基盤モデルとの統合などの課題を示した（抄録）。", "fun": "異常は「めったに起きない」からこそ、AIに学ばせるための例が足りません。そこで、ノイズから絵を描く拡散モデルで、ありそうな異常をわざと作って練習させる、という発想が広がっています。見つける技術と作る技術がお互いを鍛え合う関係が面白いところです。", "unverified": "サーベイのため、個別手法の性能比較の詳細は未確認。"}}, {"id": "jn27", "rank": 27, "field": "機械学習", "headline": "集団の相互作用と意図から複数物体の軌道を予測", "title": "Learning Group Interactions and Semantic Intentions for Multi-Object Trajectory Prediction", "url": "https://doi.org/10.1109/tpami.2026.3740986", "authors": "Mengshi Qi ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "多物体の軌道予測に集団間の相互作用と意味的な意図を組み込んだ。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "スポーツなどで複数の人の軌道を予測するとき、集団の相互作用と戦術的な意図を組み込んだ拡散モデルの予測枠組みを提案した（抄録）。", "p3": "集団レベルの相互作用を条件付き拡散モデルに入れ、集団の相互作用の予測を協力ゲームとみなしてBanzhaf相互作用で協力の傾向を表した。NBAのSportVUデータにチーム戦術の人手注釈を加えた（抄録）。", "p5": "広く使われる3つのデータセットで最先端の手法を上回った。コードとデータは公開されている（抄録）。", "fun": "バスケットボールの選手の動きは、一人ひとりの気まぐれではなく、チームの作戦と相手の動きで決まります。その「チームとしての意図」を、ゲーム理論の協力の指標で表したのが工夫です。スポーツの戦術を数学で読む面白さがあります。", "unverified": "予測誤差の改善の具体的な数値は未確認。"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "動画の極小物体検出・追跡の大規模ベンチマーク", "title": "XS-VID: A Large-Scale Benchmark for Small Object Detection and Tracking in Videos", "url": "https://doi.org/10.1109/tpami.2026.3741044", "authors": "Jiahao Guo ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "小物体の検出と追跡を評価する大規模データセットを提示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "動画中の非常に小さな物体の検出と追跡のための大規模ベンチマークXS-VIDを作り、軽量な検出法YOLOFTを提案した（抄録）。", "p3": "374本の動画、22.3万フレーム、140万の注釈付き枠からなり、12²画素以下と12²〜20²画素の物体が注釈の55%超を占める。検出・複数物体追跡・単一物体追跡の3部門で既存手法を評価した（抄録）。", "p5": "既存手法は小さな尺度の時空間特徴の扱いが不十分で苦戦した。YOLOFTはXS-VIDとVisDroneで精度と頑健性を高めた（抄録）。", "fun": "ドローンの映像で、遠くの人や車は数ピクセルの点にしか見えません。そんな小さな物を見つけて追い続けるのは、人間にも難しい作業です。難しい問題を集めた「試験問題集」を作ることで、AIの弱点がはっきりした点に価値があります。", "unverified": "YOLOFTの精度の具体的な数値は未確認。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "場所認識の集約ヘッドを競合スロット蒸留で見直す", "title": "Rethinking the Aggregation Head: Competitive Slot Distillation for Robust Visual Place Recognition", "url": "https://doi.org/10.1109/tpami.2026.3740479", "authors": "Guanyu Zong ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "視覚的場所認識の頑健性を集約部分の設計から改善した。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、視覚的場所認識で、特徴を集約する部分（集約ヘッド）を競合的なスロット蒸留によって見直し、頑健性を高めることを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "写真を見て「ここはどこか」を当てるには、季節や時間で変わる景色の中から変わらない特徴を拾う必要があります。画像の情報をどうまとめるかという、一見地味な部分を作り直すことで性能が変わるか、という問いが面白いところです。", "unverified": "手法・結果のすべてが未確認。"}}, {"id": "jn30", "rank": 30, "field": "経済学", "headline": "アイデンティティ政治と党派感情が家計支出を動かす", "title": "Identity politics, partisan sentiment and household spending", "url": "https://doi.org/10.1016/j.jpubeco.2026.105799", "authors": "Arkadev Ghosh ほか", "venue": "Journal of Public Economics", "date": "2026-10-06", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "why": "政治的な感情が家計の消費行動に及ぼす影響を扱ったJournal of Public Economics論文。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "インドで、ヒンドゥー・ナショナリスト政党の勝利の後、ムスリムは国の経済について悲観的になるが、家計支出は変わらないことを示した（抄録）。", "p3": "17.8万超の家計のパネルデータで、景況感と支出の関係を調べ、接戦の州選挙を利用して政治の変化の効果を推定し、ベイズ学習の枠組みで解釈した（抄録）。", "p5": "個人の家計についての景況感は所得変化を考慮しても支出を予測した。与党勝利後、ムスリムは国の経済についてヒンドゥーより顕著に悲観的になったが、個人の景況感の差は小さく、支出に差は見られなかった（抄録）。", "fun": "選挙で応援していない政党が勝つと、「この国の経済はダメになる」と感じる人が増えます。でも、実際の買い物は変わらない。国全体への悲観が、自分の財布の判断にはなかなか伝わらないという結果は、気分と行動のずれを示していて興味深いです。", "unverified": "効果の大きさ（係数）は未確認。"}}, {"id": "jn31", "rank": 31, "field": "統計学", "headline": "星間境界探査機データのリボン成分を統計的に分離", "title": "Statistical methods for partitioning ribbon and globally-distributed flux using data from the Interstellar Boundary Explorer", "url": "https://doi.org/10.1080/01621459.2026.2738231", "authors": "Lauren J. Beesley ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-07", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "天文観測データの成分分離を統計的に行ったJASA論文。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "NASAの星間境界探査機IBEXの高エネルギー中性原子の強度地図を、帯状（リボン）の成分と全天に広がる成分の二つに統計的に分離し、不確実性も推定する方法を開発した（抄録）。", "p3": "柔軟なモデルで総強度の地図を二つの発生源別の地図に分ける統計アルゴリズムを作り、現実的なデータ設定を模したシミュレーションで評価した。リボンの中心を推定する新手法も提案した（抄録）。", "p5": "抄録では、モデルの柔軟性の向上と推定の不確実性の伝え方の改善を利点として挙げている。具体的な数値は記載がない（抄録）。", "fun": "太陽系の外側の境界から飛んでくる粒子の地図には、不思議な「帯」が見えます。その帯と背景を統計的に切り分けると、太陽系の外の磁場の向きを知る手がかりになります。宇宙の観測でも、データを分ける統計の技術が主役になるのが面白いところです。", "unverified": "シミュレーションでの精度の具体的な値は未確認。"}}, {"id": "jn32", "rank": 32, "field": "地震工学・防災", "headline": "備えの不足指数で洪水対策投資の対象を絞る", "title": "Targeting Flood Resilience Investments Through a Readiness Gaps Index: Evidence from Mississippi", "url": "https://doi.org/10.1016/j.ijdrr.2026.106471", "authors": "Udit Bhatta ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-10-06", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "why": "地域の備えの不足を指数化し、洪水レジリエンス投資の優先順位付けに用いた。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "米ミシシッピ州で、洪水リスクが高いのに備えの能力が低い地域を特定する「備えの不足指数（RGI）」を作り、対策投資の優先順位付けに使えることを示した（抄録）。", "p3": "22の社会経済的なレジリエンス指標と、関係者への聞き取りで選んだ4つの制度的能力の指標を、混合データの因子分析（FAMD）で重み付けして指数化し、洪水ハザードと重ね合わせた（抄録）。", "p5": "ヤズー・ミシシッピ・デルタなどに備えの不足が集中した。約25.61%の郡と21.48%の国勢調査区が、高い洪水リスクと低い備えの二重の負担を抱えていた（抄録）。", "fun": "洪水の危険が高い場所と、それに備える力が弱い場所が重なると、被害は大きくなります。海沿いは危険でも備えがある一方、内陸の一部は見落とされていました。郡単位でまとめると隠れてしまう危険な地域を、細かい単位で見つけ出した点が重要です。", "unverified": "重み付けの違いによる結果の変化の詳細は未確認。"}}, {"id": "jn33", "rank": 33, "field": "情報システム", "headline": "若者にとって生成AIは回復力と依存の両刃", "title": "Generative AI as a social partner for young adults: Dual pathways to resilience and AI dependence", "url": "https://doi.org/10.1016/j.ijinfomgt.2026.103141", "authors": "Yoojin Shin ほか", "venue": "International Journal of Information Management", "date": "2026-10-07", "sjr": 5.899, "citescore": 54.4, "citescore_year": "2025", "why": "生成AIを社会的な相手として使う若者で、回復力の向上と依存の二つの経路を検討した。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、若者にとって生成AIが社会的な相手となり、回復力（レジリエンス）とAIへの依存という二つの経路をもたらすことを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "悩みをAIに打ち明ける若者が増えています。それが心の支えとなって立ち直る力を育てるのか、それともAIなしではいられなくなるのか。同じ使い方が良い面と悪い面の両方を持ちうる、という問いは、新しい道具との付き合い方を考えさせます。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jn34", "rank": 34, "field": "情報システム", "headline": "デジタル対話とAIガバナンス能力の組合せと業績", "title": "A Configurational Analysis of Digital Interaction and AI Governance Capabilities for Firm Performance", "url": "https://doi.org/10.1007/s10796-026-10810-7", "authors": "Shweta Kumari Choudhary ほか", "venue": "Information Systems Frontiers", "date": "2026-10-07", "sjr": 2.549, "citescore": 26.4, "citescore_year": "2025", "why": "企業業績につながるデジタル能力とAIガバナンスの組合せを構成論的に分析した。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、デジタルでの顧客との対話の能力とAIガバナンスの能力の組み合わせが、企業業績にどうつながるかを構成論的（コンフィギュレーション）に分析する（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "会社の成功は、一つの能力だけでなく、いくつかの能力の「組み合わせ」で決まるかもしれません。AIを上手に管理する力と、顧客とデジタルでつながる力の、どの組み合わせが成功の型になるのか、というレシピ探しのような問いです。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jn35", "rank": 35, "field": "環境科学", "headline": "豪州の山火事危機は植民地期の土地利用変化に起因", "title": "Australia’s current wildfire crisis linked to colonial land-use change", "url": "https://doi.org/10.1038/s41586-026-11097-z", "authors": "Michael-Shawn Fletcher ほか", "venue": "Nature", "date": "2026-10-07", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "現在の大規模山火事を歴史的な土地利用の変化と結びつけたNature論文。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、オーストラリアで現在起きている山火事の危機を、植民地期の土地利用の変化と結びつけて論じる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "今の山火事の原因は、気候変動だけでなく、200年以上前の土地の使い方の変化にまでさかのぼるかもしれない、という問いです。先住民の火の使い方が失われたことなど、歴史と自然災害のつながりを考えさせる大きなテーマです。", "unverified": "手法・データ・結果のすべてが未確認。"}}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "動作の質評価を忘却せずに継続学習", "title": "Continual Action Quality Assessment via Adaptive Manifold-Aligned Graph Regularization", "url": "https://doi.org/10.1109/tpami.2026.3741078", "authors": "Kanglei Zhou ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "多様体整合のグラフ正則化で、動作品質評価の継続学習を改善した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "動画から動作の質（スポーツの採点やリハビリの評価）を測るAIに、分布が変わっても以前の知識を忘れない継続学習の能力を持たせる手法MAGR++を提案した（抄録）。", "p3": "浅い層を安定させ深い層を適応させる微調整と、過去の特徴を現在の表現空間に写す多様体射影器と、局所・大域の分布をそろえるグラフ正則化の2段階の補正を組み合わせた。3データセットから4つのベンチマークを作った（抄録）。", "p5": "最強の比較手法に対し、相関の平均でオフライン3.6%、オンライン12.2%の改善を示した（抄録）。", "fun": "AIに新しいことを教えると、前に覚えたことを忘れてしまう「破滅的忘却」が起きます。動作の採点のような細かい評価では特に深刻です。昔の記憶を今の頭の中の座標に描き直すことで、忘れずに学び続けられるようにした点が工夫です。", "unverified": "ベンチマークごとの成績の詳細は未確認。"}}, {"id": "jn37", "rank": 37, "field": "機械学習", "headline": "時空間の手がかりで顔偽造動画を見抜く", "title": "Delving Deep Into Unraveling Spatio-Temporal Forgery Cues for Face Forgery Video Detection", "url": "https://doi.org/10.1109/tpami.2026.3739838", "authors": "Yingjie Liu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "偽造動画の検出に時空間の不整合を系統的に利用した。", "explain": {"basis": "題名", "basis_note": "出版社サイトから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、顔の偽造動画を見抜くために、時空間の偽造の手がかりを深く解きほぐすことを扱う（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIで作られた偽の顔の動画は、一枚の静止画では見分けがつかないほど精巧です。でも動画では、まばたきや表情の動きの時間的なつながりに不自然さが残るかもしれません。時間の流れに隠れた手がかりを探す、という問いの立て方が面白いところです。", "unverified": "手法・結果のすべてが未確認。"}}, {"id": "jn38", "rank": 38, "field": "経営学", "headline": "イノベーション推進者が動的能力の微視的基盤を動かす", "title": "Mobilizing Dynamic‐Capability Microfoundations for Sustainability‐Oriented Innovation: The Role of Innovation Champions", "url": "https://doi.org/10.1002/bse.71635", "authors": "Qingfeng Tian ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-07", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "持続可能性志向のイノベーションで、個人の推進者が組織能力をどう動員するかを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "持続可能性志向のイノベーションで、イノベーションの推進者（チャンピオン）が、動的能力の「察知・捕捉・再構成」の各段階をどうつなぐかを明らかにした質的研究（抄録）。", "p3": "2024年3〜11月に、EUと英国の海洋関連企業18社で68件の半構造化面接を行い分析した（抄録）。", "p5": "市場への接触とネットワークが機会の察知を支え、製品と能力の適合の知覚が捕捉への進展を左右し、管理者の動員・部門横断の問題解決・関係調整が再構成を支えた。推進者の役割を、正式な地位ではなく粘り強い擁護や境界連結などの活動として区別した（抄録）。", "fun": "新しい環境技術が会社の中で実を結ぶには、肩書きに関係なく「これをやろう」と言い続け、部署をまたいで人と資源を集める人の存在が鍵でした。組織の能力という抽象的なものが、実は個人の具体的な行動の連鎖でできていることを示しています。", "unverified": "製品-能力の適合は今後の検証が必要な概念とされている（抄録）。"}}, {"id": "jn39", "rank": 39, "field": "物理学", "headline": "80kmマルチコアファイバーでチップ間のもつれ配信", "title": "Chip-to-chip entanglement distribution over an 80-km multicore fiber link", "url": "https://doi.org/10.1103/594z-74r2", "authors": "Anonymous", "venue": "PRX Quantum", "date": "2026-10-07", "sjr": 5.222, "citescore": 19.4, "citescore_year": "2025", "why": "長距離ファイバーでのチップ間量子もつれの配信を実証した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "シリコンフォトニクスのチップ間で、経路符号化の量子もつれ状態を80kmのファイバーを介して配信することに成功した（抄録）。", "p3": "チップ上のらせん導波路の自発的四光波混合で通信波長帯のもつれ光子対を作り、能動的に安定化した2コアのファイバーで送受信チップ間に配信した（抄録）。", "p5": "配信後のベル状態の忠実度は85.7±0.2%で、BBM92プロトコルにより無限鍵の条件で2.03 bit/sの安全な鍵生成率を得た（抄録）。", "fun": "量子もつれは、離れた二つの粒子が不思議に結びついた状態で、盗聴を見破れる暗号に使えます。ただし、光の通り道の違いで情報を表す方式は、長距離では壊れやすいのが難点でした。小さなチップ同士で80kmも届けたことは、量子通信網への一歩です。", "unverified": "なし"}}, {"id": "jn40", "rank": 40, "field": "環境科学", "headline": "太陽光界面蒸発の世界的な潜在力を検証済みモデルで推定", "title": "Quantifying the global potential of solar-driven interfacial evaporation using a validated climate–performance model", "url": "https://doi.org/10.1038/s44221-026-00728-4", "authors": "Yan Song ほか", "venue": "Nature Water", "date": "2026-10-07", "sjr": 5.735, "citescore": 23.3, "citescore_year": "2025", "why": "気候条件と性能を結ぶモデルで、太陽光による造水の地域別ポテンシャルを定量化した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "太陽光による界面蒸発（SDIE）の性能を気候条件と結びつけて実験的に検証したモデルを作り、造水・殺菌・リチウム濃縮などへ   var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
