<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-28", "intro": "プレプリントの新着607件（一覧の候補260件）、学術誌の新着（上位10%誌・重点誌・VBIの監視誌2,398件・うち一覧の候補334件、その他のQ1・Q2誌の候補137件）、重要論文の候補185件（プレプリント44件・学術誌141件）、新着オープンデータ117件から選びました。プレプリント・関連31報、プレプリント・注目18報、論文誌・関連50報、論文誌・注目44報、オープンデータ30件です。今日はarXivの新着が候補にほとんどなく（関連の候補に3件、注目の候補は分野別の14件とHugging Faceの30件だけ）、プレプリントの2部は水増しせず件数を減らしました。プレプリント・注目は機械学習12報、工学4報、因果推論1報、オペレーションズ・リサーチ1報で、経済学・統計学の候補はなく、組織行動と経営学は内容の合う候補がありませんでした。論文誌・注目は、主要誌の候補が50報に満たないため、上位10%誌の新着から4報（経済学1、組織行動1、オペレーションズ・リサーチ2）を補いました。統計学と因果推論は各1報、組織行動は論考を除いて4報です。今日のおすすめ分野は、地震工学・防災を論文誌で8報、オペレーションズ・リサーチをプレプリントで1報と論文誌で2報（題名のみ）入れました。抄録のない新着は各部の16位以下に置きました。e-Statは定例の月次更新だけだったため入れていません。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "橋の確率的な健全度監視を担う公開のJulia基盤", "title": "Probabilistic, Edge-Enabled Structural Health Monitoring for Bridges Under Operational and Environmental Variability", "url": "https://doi.org/10.20944/preprints202611.2841.v1", "authors": "Shreeya Khanal ほか", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Khanal, S., & Kafle, S. (2026). Probabilistic, Edge-Enabled Structural Health Monitoring for Bridges Under Operational and Environmental Variability. https://doi.org/10.20944/preprints202611.2841.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Preprints.org）は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "橋の健全度の監視を、しきい値による警報ではなく「損傷状態の確からしさ」を更新し続ける確率的な手順として実行できる、公開のソフトウェア基盤Custodianを示した（抄録）。", "p2": "橋の構造ヘルスモニタリング（SHM）は、雑音、欠測、温度や交通による変動のもとで動かす必要がある。しきい値による警報は、構造の変化と無害な変動を区別できないことが多く、誤警報が運用者の信頼を損なう（抄録）。", "p3": "Juliaで書かれたモジュール式の基盤で、隠れマルコフモデル（観測から直接は見えない状態を推定するモデル）による損傷状態の信念のベイズ更新、疲労とき裂進展の解析、確率的な劣化過程と生存モデルによる余寿命予測、メトロポリス・ヘイスティングス法のMCMC、ラテン超方格のモンテカルロ伝播、Sobol感度指標による不確実性評価をまとめる。品質を考慮したセンサの取り込み、時系列の保存、端末側で低遅延に動かすためのインタフェース仕様も含む（抄録）。", "p4": "各確率的な部品を、確立された公開の参照データか、解析的に解ける試験問題と照合する。8つのベンチマーク群で、公表値や解析解をどこまで再現できるかを評価の基準とした（抄録）。", "p5": "公表されているVirklerのき裂進展のパラメータを5%以内、BasquinのS-N係数を1.5%以内、解析的なSobol指標を0.015以内で再現し、MCMCの収束診断はR̂ = 1.001だった（抄録）。", "p6": "実際の橋での評価は、しきい値方式と比べる手順を定めた段階で、結果は示されていない（抄録）。解釈：検証は部品ごとの再現であり、温度・交通の変動のもとで誤警報が減るかどうかは未検証。", "fun": "橋のセンサの値は、温度の変化や交通の影響でも変わります。「値がここを超えたら警報」という決め方では、構造の変化と無害な変動を区別できず、誤報が増えて、警報が信頼されなくなります。この研究は、「損傷している確率は今どのくらいか」を新しいデータが来るたびに更新する考え方を、誰でも使える公開の道具としてまとめました。", "unverified": "本文を入手できず、8つのベンチマークの内訳、隠れマルコフモデルの状態の定義、実橋の評価手順の中身は未確認。実橋での性能は示されていない。"}}, {"id": "pr02", "rank": 2, "headline": "LLMは利益の質を見分けても発生高の重みづけを誤る", "title": "Do Large Language Models Suffer from Accrual Fixation? A Strictly Post-Cutoff and Double-Entry Counterfactual Audit of LLM Financial Statement Analysis", "url": "https://doi.org/10.5281/zenodo.24585200", "authors": "Nillabol, Kiattiphat", "venue": "Zenodo", "date": "2026-11-27", "apa": "Nillabol, K. (2026). Do Large Language Models Suffer from Accrual Fixation? A Strictly Post-Cutoff and Double-Entry Counterfactual Audit of LLM Financial Statement Analysis (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.24585200", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodo版のPDFの本文（序論、実験計画§3、主要結果§4.1〜4.2、限界§6、結論、図表のキャプション）を読んだ。§4.4と§5の表の細部は読んでいない", "preprint": true, "p1": "LLMが財務諸表を読むとき、現金の裏づけのある利益と、売掛金や在庫に滞留している利益（会計発生高、accruals）をほぼ同じ重みで翌年に延ばしてしまう「発生高への固着」を、学習データからの漏れを排した形で検査した（§1）。", "p2": "LLMの財務諸表分析の評価は、学習時に結果を見ている可能性（先読みの汚染）に左右される。営業キャッシュフローは発生高より翌年の利益に強く持続するが、人の投資家は両者をほぼ同じ重みで見ることが知られ、LLMが同じ偏りを持つかは確かめられていなかった（§1）。", "p3": "実験1は、損益計算書と主要比率が同一で、利益が現金で回収されたか運転資本に滞留しているかだけが違う、複式簿記の整合した財務諸表の対300組（§3.1）。実験2は、学習時点より後に提出された米国10-Kの匿名化した1,000社（黒字600・赤字400）で翌年のROAを予測させる（§3.2）。予測をキャッシュフローと発生高に回帰し、係数の比R（発生高÷キャッシュフロー）を実現値の比と比べる（§3.4、式3〜5）。", "p4": "2025年より前に公開された4モデル（Qwen2.5の3B・7B・14BとHermes-3-Llama-3.1-8B）を、直接予測・分解の計算・Sloanの知見の明示の3条件で調べる（§3.3）。Rが実現値より大きいほど固着が強い。産業でクラスタ化したブートストラップ（2,000回）で検定する（§3.4）。", "p5": "対の実験では、現金に裏づけられた側を高く予測する割合が9.7%→37.0%→69.0%→82.3%と規模とともに上がる一方、Rは14Bでも0.921にとどまる（図1左）。黒字の実企業では実現値のRが0.321なのに、4モデルのRは0.843〜0.903で、差は+0.522〜+0.583（すべてp<0.001、図1右）。分解の計算は正確でも重みは変わらず（図3）、単純なランダムウォークの誤差は全LLMと同等以下だった（§4.1）。", "p6": "著者の挙げる限界は、14B以下の公開モデルだけで14Bは4ビット量子化であること、2024→2025年度の1回の遷移だけであること、注記や文章のない数値表だけを与えたこと、道具を使わない単発の指示であること（§6）。未査読の単著。解釈：実現値のRの信頼区間は広い（黒字企業で−0.097〜0.745、§4.1）。", "fun": "会社の利益には、実際にお金が入ってきた分と、売掛金や在庫の形でまだ現金になっていない分が混ざっています。後者は翌年の利益に続きにくいことが、会計の研究で知られています。この研究は、利益の数字が同じで中身だけが違う「双子の会社」をAIに見せました。大きなAIほど、どちらが良いかの順番は当てられるのに、翌年の利益を数字で予測させると、2つの重みをほとんど変えませんでした。", "unverified": "付録のプロンプトの全文と、赤字企業・全体の標本の表の細部（§4.4、§5の一部）は読んでいない。より大きなモデルや商用モデルに当てはまるかは未確認。"}}, {"id": "pr03", "rank": 3, "headline": "討論が事実性に効くかは最後の集約で決まる", "title": "Does Debate Help Factuality? A Controlled Re-Aggregation Study on a 1,200-Item Chinese Benchmark", "url": "https://doi.org/10.20944/preprints202611.2897.v1", "authors": "Lei Yang ほか", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Yang, L., Du, S., Chen, Y., Chen, Y., & Ji, L. (2026). Does Debate Help Factuality? A Controlled Re-Aggregation Study on a 1,200-Item Chinese Benchmark. https://doi.org/10.20944/preprints202611.2897.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Preprints.org）は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "複数のLLMに討論させる手法が事実の正確さに効くかどうかは、討論そのものより、最後に答えをまとめる「集約」のしかたで大きく変わることを示した（抄録）。", "p2": "マルチエージェントの討論や敵対的な自己修正は、事実性を上げるとも下げるとも報告されてきた。しかしこれらの手順は集約の段階で終わり、その寄与が切り分けられることはまれだった（抄録）。", "p3": "敵対的な討論の記録を固定したまま、集約の指示だけを差し替えて答えを作り直す。入力は同じ討論記録、出力は最終の答えなので、差は集約だけに帰せる。3つのモデル系統で、1,200問の中国語の事実性ベンチマークを使う（抄録）。", "p4": "全1,200問で、合意点を列挙させる集約と、答えを先に述べさせる最小の指示を比べる。層化した400問では5つの集約の方法を、討論なしの零ショットの回答とあわせて比べる。指標は正解率で、自動判定と人の注釈の一致も確かめる（抄録）。", "p5": "合意の列挙から答え先行の指示に替えると、正解率は58.8%から76.7%に上がった（+17.9ポイント、1つのモデルでは最大+29.9）。400問では5つの方法が59.6%〜86.2%に広がり、最良は討論の記録を捨てて直接答える方法（86.2%）で、零ショット（86.2〜87.5%）と統計的に区別できない。記録を使う集約はどれも59.6%〜77.6%と低い（抄録）。", "p6": "合意の列挙は答えでなく論評を出しがちで、その出力では注釈者間の一致（κ = 0.482）も、判定と人の一致（56.7%と55.0%）も下がる。著者自身が「統制した設定での結果」と断っている（抄録）。解釈：対象は事実を問う課題と1つのベンチマークで、価値判断を伴う議論に当てはまるかは別の問題。", "fun": "AIどうしに議論させれば、間違いを指摘し合って正しい答えに近づく。そう期待されてきました。ところがこの研究では、同じ議論の記録を使っても、最後のまとめ方を変えるだけで正解率が58.8%から76.7%に変わりました。しかも一番成績がよかったのは、議論の記録を捨てて直接答える方法でした。議論の効果とされてきたものは、まとめ方の影響と切り分けて確かめる必要がある、という指摘です。", "unverified": "本文を入手できず、使ったモデルの名前、5つの集約の方法の具体的な指示、討論の回数と形式、ベンチマークの出典は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "ガバナンス評価が高いと決算の訂正が少ない", "title": "Double machine learning shows that stronger ESG governance is associated with fewer financial restatements in Chinese new energy vehicle firms", "url": "https://doi.org/10.21203/rs.3.rs-11408186/v1", "authors": "Lin Zhu ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Zhu, L., Wang, W., & Xu, Y. (2026). Double machine learning shows that stronger ESG governance is associated with fewer financial restatements in Chinese new energy vehicle firms. https://doi.org/10.21203/rs.3.rs-11408186/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（結果の各節、考察、方法の二重機械学習の節、表のキャプション）を読んだ。補足資料は読んでいない", "preprint": true, "p1": "ESG評価のうちガバナンスの点数が高い企業ほど、翌年に決算報告の訂正を出す確率が低いことを、多数の企業特性を柔軟に調整したうえで示した（結果の節、表4）。", "p2": "ESG評価は企業の質の目安として広く使われるが、財務報告の信頼性についての情報を含むかは不明だった。少数の統制変数を置く従来の回帰では、評価と相関する財務特性を十分に取り除けない（抄録、結果の節）。", "p3": "部分線形モデル Y = θD + g(X) + ε（Y：翌年の訂正、D：ESGの点数、X：176の企業特性）を二重機械学習（DML）で推定する。YとDのそれぞれからXで説明できる部分を機械学習で取り除き、残差どうしを回帰してθを得る（式2〜5）。同じ企業の観測が学習と予測にまたがらないよう、企業単位で5分割する交差当てはめを使う（Algorithm 1）。", "p4": "中国の新エネルギー車関連907社の2015〜2024年、6,668社年。訂正は法定期限から15日を過ぎて開示された定期報告書の訂正で、585社年（8.8%）に生じた。4つの学習器と従来の回帰を比べ、並べ替えによる偽薬検定、定義や標本を変えた頑健性、未観測の交絡への感度分析を行う（データの節、表1）。", "p5": "ガバナンスの点数が1標準偏差（6.2点）高いと、翌年の訂正の確率が1.84ポイント低い（95%信頼区間 −3.18〜−0.50、P = 0.007、図4a）。環境（−0.40）と社会（−0.58）は有意でない。少数の統制の最小二乗法は−2.81で、DMLより53%大きい（図5）。交差当てはめを省くと−1.05に縮む。関連は点数の3年平均に集中し（−2.49）、平均からのずれにはない（−0.20）。", "p6": "残差分散の3.3%を説明する未観測の交絡があれば推定はゼロになり、著者は因果効果でなく条件つきの関連と解釈する（図8）。訂正は発見・開示されたものに限られ、ガバナンスの点数自体が報告上の問題を織り込んでいる可能性があり、1業種・1評価機関の観察研究である。罰則なしの線形回帰では−0.94で有意でない（考察）。", "fun": "ESGの点数が高い会社は、決算を後から訂正することが少ないのでしょうか。点数の高い会社はもともと財務の特徴が違うので、単純には比べられません。この研究は、176もの会社の特徴を機械学習でならしてから比べ直しました。すると関係は残ったものの、従来の方法より小さくなりました。しかも効いていたのは点数の年ごとの上下ではなく、数年間の平均的な水準でした。", "unverified": "補足資料の表（S2〜S4）の数値と、176の統制変数の一覧は読んでいない。図は本文の記述から読んだ。"}}, {"id": "pr05", "rank": 5, "headline": "LLMで性格研究を自動化できる範囲を整理", "title": "Automating Personality Research with LLMs", "url": "https://doi.org/10.31234/osf.io/kz7a9", "authors": "Elisa Altgassen ほか", "venue": "PsyArXiv", "date": "2026-11-27", "apa": "Altgassen, E., Külpmann, A. I., Arslan, R. C., Hommel, B. E., Mata, R., & Wulff, D. U. (2026). Automating Personality Research with LLMs. https://doi.org/10.31234/osf.io/kz7a9", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（枠組み§3、回答者の模擬§4.3、考察§5、結論、図表のキャプション）を読んだ。§2と§4.1〜4.2は冒頭のみ", "preprint": true, "p1": "LLMで性格研究のどの作業を自動化してよいかを判断するために、LLMが再現できる規則性（モデル由来の分散）と、再現できずに残る部分（残差の分散）を分けて考える枠組みを示した（§3）。", "p2": "LLMは人の性格データの中心的な側面を再現でき、研究の自動化が視野に入る。しかし一致の高さだけでは自動化の正当性は決まらず、何が再現され、ずれが何を意味するかが整理されていなかった（抄録、§3）。", "p3": "相関行列や因子構造といった具体的な対象ごとに、モデルの予測が捉える構造と、予測と観測のずれを分ける（§3）。この見方で、評価の強化（§4.1）、概念の整理（§4.2）、人の回答者の模擬（§4.3）の3つの用途を点検する。自動化が最も擁護できるのは、対象と用途が明確で、予測が当該の母集団の独立した人のデータに汎化し、ずれが結論を左右しにくい場合だとする（§3）。", "p4": "新しい実験ではなく、既存研究を枠組みに沿って評価する展望論文である。各用途について、モデルが何を再現するか、何が説明されずに残るか、自動化で失われる情報が用途にとって重要かを問う（§3、表1）。", "p5": "項目や尺度の間のモデル由来の類似度は、人のデータでの相関のばらつきの最大で約半分を説明すると見積もられている（§5.1）。既製のモデルより、心理測定データで微調整したモデルのほうが多くの構造を再現する（図1B）。一方、ペルソナを与えて回答させる方法は、逆転項目への食い違った反応や現実的な分散の不足を伴い、母集団の模擬では残差こそが知りたい変動になる（§4.3）。", "p6": "学習データに評価用の尺度や相関行列が含まれる汚染の可能性があり、一致の解釈を難しくする（§5.1）。著者は、汚染に強い手順で集めた人のデータのベンチマーク、学習履歴の分かるモデルでの比較、報告の基準が必要だと述べる（§5.2）。解釈：枠組みは発見的な整理で、残差の内訳を実際に分解する方法は示されていない。", "fun": "性格検査の質問どうしの関係を、人に答えてもらう前にAIがかなり言い当てられることが分かってきました。それなら人を集めなくても研究ができるのでしょうか。この論文は「当たった部分」と「外れた部分」を分けて考えようと提案します。集団全体の安定した傾向を知りたいだけなら当たった部分が役に立つかもしれません。でも、ある集団に特有の違いを知りたいとき、その違いは外れた部分の中にあります。", "unverified": "§2の技術的な解説と§4.1〜4.2の各小節、表1の全項目は通読していない。図1の数値は著者の例示で、独立の検証ではない。"}}, {"id": "pr06", "rank": 6, "headline": "行政手続きの負担は悪い経験だけが感情を動かす", "title": "How the Experience of Administrative Burdens Affects Clients’ Psychological Well-being: The Role of Negativity Bias", "url": "https://doi.org/10.31235/osf.io/8g7mw", "authors": "Jaeyeong Nam ほか", "venue": "SocArXiv", "date": "2026-11-27", "apa": "Nam, J., Jilke, S., Herd, P., & Moynihan, D. (2026). How the Experience of Administrative Burdens Affects Clients’ Psychological Well-being: The Role of Negativity Bias. https://doi.org/10.31235/osf.io/8g7mw", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（研究デザイン、考察の前半、図表のキャプション）を読んだ。仮説の節、結果の節の本文、補足資料は読んでいない", "preprint": true, "p1": "福祉制度の手続きを思い出すだけで否定的な感情が強まること、しかもその反応は負担が重かった人に現れ、良い経験は肯定的な感情を高めないという非対称を、調査実験で示した（抄録、表1〜2）。", "p2": "行政負担（administrative burden）の研究は、手続きの摩擦が心理的な費用を生むと主張してきた。しかし研究は制度の利用への影響に偏り、手続きの経験が直後の感情に与える影響は十分に確かめられていなかった（考察）。", "p3": "質問の順序を無作為に変える実験。処置群には先に、米国の食料支援制度SNAPの申請・更新の経験を、検証済みの行政負担の尺度と自由記述で思い出させ、その後に感情を尋ねる。統制群は感情を先に答える（図1）。感情はPANAS（肯定的感情と否定的感情を測る尺度）で測る（研究デザイン）。", "p4": "SNAPの申請経験のある3,819人を分析対象とする（2022年11月〜2023年1月、事前登録）。想起の効果を最小二乗法で推定し、報告した負担の水準や想起した経験の内容で分けた部分集団で、否定的感情と肯定的感情への効果を比べる（研究デザイン、表1〜3）。", "p5": "経験の想起は否定的感情を全体で高めた（b=0.071、SE=0.028、p=0.012。統制群の基準1.671に対し4.25%の増加、表1）。負担が重かったと答えた部分集団では効果が大きく（b=0.315、SE=0.065、p<0.001、17.28%の増加）、負担が軽い・中立の部分集団では有意でなかった（表2）。回答者の多数は負担が軽かったと答え、良い経験は肯定的感情の高さと関連しなかった（抄録）。", "p6": "著者は、気分の尺度PANASだけで測ったこと、質問順序の実験という1つの設計であること、受給資格をめぐる見方が否定的な感情を強めやすい福祉の文脈であることを挙げ、他の尺度・手法・国での確認を求める（考察）。解釈：部分集団は処置の中で答えた負担の水準で分けており、その差を因果効果の差と読むには注意が要る。", "fun": "役所の手続きの思い出は、気分にどう響くのでしょうか。この実験では、食料支援の申請を思い出してもらっただけで、否定的な気分が少し強まりました。面白いのは、その反応が一部の人に偏っていたことです。多くの人は「負担は軽かった」と答えたのに、「重かった」と答えた人の反応が全体を動かしていました。良い経験は気分を上げず、悪い経験だけが気分を下げる。悪いことは良いことより強く効く、という非対称です。", "unverified": "表3（想起した経験の内容による部分集団）と表4（属性別）の数値は確認していない。補足資料は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "ポピュリズム支持は孤独より「社会とのずれ」で説明", "title": "Is it Loneliness or Misfit? – Disentangling Predictors of Populist Attitudes and Voting Intentions", "url": "https://doi.org/10.31234/osf.io/58sp3", "authors": "Alma-Sophia Merscher ほか", "venue": "PsyArXiv", "date": "2026-11-27", "apa": "Merscher, A.-S., Göritz, A. S., & Schobin, J. (2026). Is it Loneliness or Misfit? – Disentangling Predictors of Populist Attitudes and Voting Intentions. https://doi.org/10.31234/osf.io/58sp3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（方法、考察の前半、図表のキャプション）を読んだ。結果の節の表の数値と補足資料は読んでいない", "preprint": true, "p1": "孤独と政治的な態度の結びつきとして報告されてきたものは、「社会の主流に合わない」という感覚（misfit）と分けて調べると、主に後者で説明されることを示した（考察）。", "p2": "孤独はポピュリズム政党への投票意図、棄権、ポピュリズム的態度と結びつくと報告されてきた。しかし社会的な断絶を表す近い概念が複数あり、孤独に固有の関連なのか、文化的な疎外の一種であるmisfitで説明されるのかは不明だった（抄録）。", "p3": "ドイツの3つのオンライン調査。孤独はUCLA孤独感尺度（研究1・2は20項目、研究3は3項目）、misfitは文化的疎外の尺度の4項目（例：自分は社会に合わないとよく感じる）で測る。研究1で探索的因子分析、研究2で確認的因子分析を行い、2つを同時に入れた回帰で投票意図・棄権・ポピュリズム的態度を予測する（Method）。", "p4": "研究1は大学のメーリングリストで募った714人、研究2は1,289人、研究3は2025年2月のドイツ連邦議会選挙の直前の1,014人。2つの概念が別の因子として分かれるか、同時に入れても各々が独自の予測力を保つかを基準にする（Method、表3〜7）。本論文の分析は事前登録していない。", "p5": "孤独とmisfitは関連するが区別できる。双因子モデルではmisfitが固有の因子として明確に残る一方、孤独の項目は大部分が共通の一般因子に吸収された（図2）。別々に入れると両方とも政治的な結果と関連することが多いが、同時に入れると孤独はすべてのモデルで予測力を失い、misfitは多くのモデルで有意なままだった（表5〜7、図1）。", "p6": "横断データなので、misfitが上流の交絡なのか、孤独からの媒介なのか、反体制的な見方がmisfitを生むのかは区別できないと著者は述べる（考察）。研究3は孤独の尺度が3項目と短く、注意確認で727人が除外されている。解釈：ドイツの便宜的な標本とオンラインパネルで、他国への一般化は未確認。", "fun": "孤独は、ポピュリズム的な投票や態度と結びつくと言われてきました。でも「孤独」と「自分は社会に合っていないという感覚」は、似ているようで別のものかもしれません。著者は、前者は対人関係の水準、後者は社会全体の水準の話だと整理します。3つの調査で両方を同時に調べると、独自の予測力を保ったのは後者だけでした。よく似た2つの気持ちを分けて測らないと、何が効いているのかを取り違えるという教訓です。", "unverified": "表5〜7の係数の値と、補足資料の他の尺度との相関は読んでいない。図は本文とキャプションの記述から読んだ。"}}, {"id": "pr08", "rank": 8, "headline": "LLMの証拠要約は単一の指標では評価を誤る", "title": "Single metrics mislead when evaluating Large Language Models for evidence synthesis and decision-support", "url": "https://doi.org/10.21203/rs.3.rs-11873002/v1", "authors": "Radhika Agrawal ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Agrawal, R., Jaffer, S., Reynolds, S., Cutts, V., Dicks, L. V., Madhavapeddy, A., Smith, R. K., Sutherland, W. J., Taylor, N. G., Thornton, A., & Christie, A. (2026). Single metrics mislead when evaluating Large Language Models for evidence synthesis and decision-support. https://doi.org/10.21203/rs.3.rs-11873002/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Research Square版のPDFの本文（序論の末尾、結果の主要な節、限界と結論、図のキャプション）を読んだ。方法の節と拡張データは読んでいない", "preprint": true, "p1": "LLMに科学的な証拠を検索・要約させたときの信頼性は1つの指標では測れず、網羅・出典の付け方・忠実さを合わせて見る必要があることを、4つの先端モデルの比較で示した（図1〜2）。", "p2": "意思決定者や研究者はLLMに証拠の検索と要約を任せ始めているが、評価は導入に追いつかず、ベンチマークは単一の見出しの点数を報告しがちである。その点数が何を見落とすかは確かめられていなかった（抄録）。", "p3": "4つのLLM（Claude Sonnet 4、Gemini 2.5 Pro、GPT-5、Kimi K2）に、保全の施策の効果をまとめた専門家編集のデータベース（Conservation Evidence）を検索させ、19分野の520問に証拠の要約を書かせる。要約の各文の関連性・引用の正しさ・忠実さをLLM判定で採点する。問いごとに関連する施策ページをあらかじめ特定し、検索でどれだけ拾えたかも測る（序論、Box 1）。", "p4": "23,641文を、専門家が付けた820文のラベルで検証したLLM判定で採点する。指標は関連性、検索の再現率と適合率、引用率、引用の正しさ、忠実さなどで、平均だけでなく要約ごとの分布も見る。どの指標でも同じモデルが最良になるかが論点（抄録、図1〜3）。", "p5": "指標によって3つの異なるモデルが1位になった（図2a）。平均の忠実さが最も高いGemini 2.5 Proは、検索が平均1.4回（他は3.2〜3.3回）、開いたページが3.1件（他は4.4〜6.8件）と最も少なく、関連する証拠の49.2%しか見つけていない（他は65.2〜72.9%、図2b）。Kimi K2は証拠の68.4%を見つけたが、引用のある文は半分に満たない。平均は二峰性の分布を隠していた（図3）。", "p6": "著者の挙げる限界は、質問がLLMで生成され著者2人が選別したものであること、再現率の基準がLLMの2回の独立した処理に基づくこと、全モデルを低い推論設定で動かしKimi K2は量子化版だったこと、1つの編集済みデータベースだけを対象にしたこと（考察）。証拠がない問いで回答を控えられるかは調べていない。", "fun": "AIに研究の証拠をまとめさせたとき、何をもって良い要約とすべきでしょうか。「書いたことが資料に忠実か」だけを測ると、落とし穴があります。この研究で忠実さが最も高かったAIは、調べた資料が最も少なく、関連する証拠の49.2%しか見つけていませんでした。読んだ資料に対してしか忠実さは測られないので、少ししか調べなければ点が上がるのです。正確さと漏れのなさは、別々に測らないといけません。", "unverified": "Box 1の全指標の定義、LLM判定と専門家の一致度の数値、拡張データの表と図は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "司法の再集権化で株価暴落リスクが下がる", "title": "Judicial recentralization and stock price crash risk: evidence from China", "url": "https://doi.org/10.21203/rs.3.rs-11486582/v1", "authors": "Dongchang Wei ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Wei, D., & He, W. (2026). Judicial recentralization and stock price crash risk: evidence from China. https://doi.org/10.21203/rs.3.rs-11486582/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（抄録、§2.2〜2.3、§4.1〜4.2、§5.2、§5.12〜5.13の冒頭、表のキャプション）を読んだ。頑健性の各節と補足資料は読んでいない", "preprint": true, "p1": "地方の裁判所の人事と予算の権限を県・市から省に移した中国の司法改革が、管轄内の上場企業の株価暴落リスクを下げたことを、導入時期のずれを使って示した（§5.2、表2）。", "p2": "株価の暴落リスクは、経営者が悪い情報をため込み、一度に放出することで生じる。地方の裁判所が地元の政府に人事と予算を握られていると、地元企業をかばう誘因が生じ、外部の関係者の監視が効きにくい。裁判所の行政上の組織が企業の情報環境を左右するかは、ほとんど調べられていなかった（抄録、仮説の節）。", "p3": "2014年に始まった改革の、都市ごとの実施年のずれを使う差分の差分。翌年の暴落リスク＝β×改革ダミー＋統制＋企業固定効果＋年固定効果（式4）で、βが改革の平均効果を表す。暴落リスクは、企業固有の週次収益率の負の歪度（NCSKEW）と、下落週と上昇週の変動の比（DUVOL）で測る（§4.1〜4.2）。", "p4": "中国A株の上場企業の2010〜2022年、28,049社年。段階的な導入に強い推定量、改革年を入れ替える偽薬検定、別の暴落指標、近隣都市への波及の検定で頑健性を確かめ、負債構成・監査意見・利益調整・規制違反・訴訟といった経路の変数が動くかを直接調べる（抄録）。", "p5": "改革の係数はNCSKEWで−0.0588、DUVOLで−0.0420（ともに1%水準で有意）で、標準偏差の8.2%と8.9%に当たる（表2）。一方、経路の変数はほとんど動かず、多くの会計指標で標本平均の約10分の1を超える効果は棄却できる。動いたのは支配株主による資金流用の代理変数であるその他債権だけで、改革の3年目以降に標本平均の約20%減った（抄録、§5.12）。", "p6": "暴落リスクは改革の年に下がり、流用の減少は3年目以降なので、後者は前者の媒介ではないと著者自身が述べ、隠す費用の見込みが変わるという期待の経路と解釈する（§5.12）。実施年が公表されていない都市には2018年を一律に割り当てている（§2.3）。省と年の交差の固定効果を入れると、流用の結果は有意でなくなる（§5.12）。", "fun": "裁判所が地元の政府に予算と人事を握られていたら、地元の企業に不利な判断は出しにくいでしょう。中国はその権限を省に引き上げる改革をしました。するとその地域の会社の株価が急落する危険が下がりました。面白いのは、著者が「なぜ下がったのか」を調べて、予想した経路のほとんどが動いていなかったと率直に書いていることです。会社の行動が変わる前に、悪い知らせを隠す費用の見込みが先に変わった、と著者は解釈しています。", "unverified": "表3〜8の個々の数値と図（動的効果、偽薬の分布）は確認していない。補足資料は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "名指しの投稿ほど礼儀正しい（Twitterの追跡）", "title": "Interpersonal Conversations in Public Spaces: A Longitudinal Study of Addressivity and Civility on Twitter", "url": "https://doi.org/10.31235/osf.io/un6ev", "authors": "Meryl Ye ほか", "venue": "SocArXiv", "date": "2026-11-27", "apa": "Ye, M., & Park, P. (2026). Interpersonal Conversations in Public Spaces: A Longitudinal Study of Addressivity and Civility on Twitter. https://doi.org/10.31235/osf.io/un6ev", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（方法§3、結果§4、限界§5.6、表のキャプション）を読んだ。理論の節と付録は読んでいない", "preprint": true, "p1": "同じ利用者の投稿でも、特定の相手に宛てた投稿は宛先のない投稿より礼儀正しく、知人どうしがつながり合うほど否定的な投稿が減ることを、長期の追跡で示した（§4.2、表4）。", "p2": "開かれたSNSでの礼節（civility）は、利用者ごとの違いとして記述されることが多い。しかし利用者の間の比較では、誰が礼儀正しいかは分かっても、同じ人の表現が投稿の宛先や周囲のネットワークの変化でどう変わるかは分からない（§4.1）。", "p3": "2つの性質に注目する。宛先性（addressivity：@メンションや返信で特定の相手に向けること）と、ネットワーク制約（知人どうしが互いにつながっている度合い）。利用者×月×宛先の有無ごとに、攻撃的な表現・センシティブな内容・否定的感情・肯定的感情の投稿数を数え、利用者の固定効果を入れた二項回帰で、同じ人の中での変化を推定する（§3.5）。", "p4": "2013〜2014年に収集されたデータから、米国在住・フォロワー100人以上・投稿200件以上などの条件を満たす1,827人のタイムライン（平均1,700件超、約3.7年分）を使い、116,966の利用者・月・宛先の観測を分析する。内容は既存の分類器（TweetNLP）で判定する（抄録、§3.1、§4.2）。", "p5": "宛先のある投稿は、攻撃的な内容が少なく（β=−0.262、基準の11.5%から2.4ポイント）、センシティブな内容が少なく（1.4ポイント）、否定的感情が低く（7.7ポイント）、肯定的感情が高い（7.1ポイント）。すべてp<.001で、同じ月の中の比較でも成り立つ（表4、§4.2）。知人どうしのつながりが密になると、投稿は否定的でなく肯定的になった（抄録）。", "p6": "著者の挙げる限界は、2013〜2014年のデータで、その後のプラットフォームの変化で効果の大きさが変わりうること、相互メンションに基づくネットワークは読むだけの聴衆を含まないこと、一度できたつながりを消えないものとして扱っていること（§5.6）。解釈：標本は投稿を削除したことのある利用者に限られ、一般の利用者への一般化は未確認。", "fun": "誰に向けるでもなく書いた投稿と、特定の誰かに宛てて書いた投稿では、同じ人でも言葉づかいが変わるのでしょうか。1,827人の約3.7年分の投稿を追うと、相手を名指しした投稿のほうが、攻撃的な内容が少なく、肯定的な内容が多くなっていました。さらに、自分の知り合いどうしがつながっていくと、否定的な投稿が減りました。礼儀正しさは人柄だけでなく、その投稿が置かれた場面でも変わる、という発見です。", "unverified": "ネットワーク制約の係数の値（表4）と、付録の交互作用の分析は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "近隣の飲酒がらみの無秩序は主観的幸福を下げる", "title": "Neighbourhood-Level Alcohol-Related Social Disorder and Subjective Well-Being: A Multilevel Analysis", "url": "https://doi.org/10.21203/rs.3.rs-10331306/v1", "authors": "Deepak Kumar ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Kumar, D., & Malik, M. (2026). Neighbourhood-Level Alcohol-Related Social Disorder and Subjective Well-Being: A Multilevel Analysis. https://doi.org/10.21203/rs.3.rs-10331306/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Square版のPDFの本文（データと方法§2、結果§3、限界§5、表のキャプション）を読んだ。考察の節は読んでいない", "preprint": true, "p1": "インドで、近隣に飲酒がらみの無秩序があると感じている人は主観的な幸福がわずかに低く、近隣への信頼が幸福と結びつくのは無秩序のない近隣に限られることを示した（§3、表2〜3）。", "p2": "飲酒に関わる近隣の無秩序は社会・公衆衛生上の問題として認識されつつあるが、主観的幸福との関係、とくにインドでの関係は十分に調べられていなかった。近隣の信頼がその関係を変えるかも不明だった（抄録）。", "p3": "世界価値観調査の第7波のインドのデータを使う。幸福感・主観的健康・選択の自由・生活満足・家計への満足の5項目を標準化して平均した指数を従属変数とし、「路上での飲酒が頻繁」かつ「大酒飲みを隣人にしたくない」と答えた場合を1とする二値変数を説明変数にして、調査の抽出単位を階層にしたランダム切片の多層線形モデルで推定する（§2）。", "p4": "インドの16歳以上の1,692人のうち1,429人が分析対象。性別・年齢・教育・所得・カースト・宗教・世帯規模・居住地を統制し、近隣への信頼による関連の違いを交互作用で調べる（§2、表1）。", "p5": "近隣の飲酒問題は主観的幸福の指数と負に関連した（β = −0.07、95%信頼区間 −0.14〜−0.00）。統制の前後で値は変わらない（表2）。信頼は、飲酒問題のない近隣では幸福と正に関連し（β = 0.095、0.037〜0.153）、問題のある近隣では有意でなかった（β = 0.011、−0.044〜0.065。交互作用のWald検定 p = 0.034、表3）。所得との関連のほうが大きい（高所得でβ = 0.59）。", "p6": "著者の挙げる限界は、横断データで因果は言えないこと、すべて自己報告であること、近隣の飲酒問題が客観的な指標でなく回答者の認識で測られていること（§5）。解釈：説明変数は個人の認識と態度を組み合わせたもので、近隣の水準の特性を測ったとは言いにくい。関連は小さく、信頼区間の上限はほぼゼロである。", "fun": "近所の人を信頼している人は、幸福度が高い傾向があります。ところがインドの調査では、飲酒がらみの問題がある近所に住む人には、この関係が見られませんでした。信頼の恩恵は、周りの環境が荒れていると弱まるのかもしれません。人のつながりの良さは、それを取り巻く環境とあわせて考える必要がある、という示唆です。ただし関連は小さく、原因と結果の向きは分かっていません。", "unverified": "指数の内的一貫性（クロンバックのα）の値と、近隣の安全感の分析の詳細は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "人に合わせすぎる人は無理な働き方で消耗する", "title": "People-Pleasing at Work: Self-Endangering Work Behaviour as a Mechanism Linking People-Pleasing to Emotional Exhaustion", "url": "https://doi.org/10.31234/osf.io/h6q9e", "authors": "Christian Blötner ほか", "venue": "PsyArXiv", "date": "2026-11-27", "apa": "Blötner, C., & Werner, J. (2026). People-Pleasing at Work: Self-Endangering Work Behaviour as a Mechanism Linking People-Pleasing to Emotional Exhaustion. https://doi.org/10.31234/osf.io/h6q9e", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（方法、結果、限界の節、図表のキャプション）を読んだ。序論と考察の前半は読んでいない", "preprint": true, "p1": "他人の期待や必要を自分より優先する傾向（people-pleasing）が強い人ほど情緒的に消耗しやすく、その一部は自分を危険にさらす働き方を通じて説明されることを示した（§3.2）。", "p2": "他人に合わせすぎる傾向は自分への配慮の欠如を伴い、仕事での負担への弱さを高めると考えられる。しかしこの傾向が情緒的消耗と結びつくか、どんな働き方がその間をつなぐかは調べられていなかった（抄録）。", "p3": "横断の質問紙調査で、People Pleasing Scale（責任感、他者の期待、自分の必要の軽視）、自分を危険にさらす働き方の尺度のうちプレゼンティーイズム（体調不良でも出勤する）・余暇時間の仕事・仕事の強化と延長、コペンハーゲン心理社会質問票の情緒的消耗を測り、構造方程式モデルで媒介を検定する。間接効果は5,000回のブートストラップで推定する（§2.3〜2.4）。", "p4": "ドイツの通信制大学の参加者プールとSNSで募った、週20時間以上働く902人（74%が女性、2025年6月〜12月）。モデルの適合はCFI .95以上、RMSEA .06未満、SRMR .08未満を基準にし、多重検定を考慮して有意水準を.01とした（§2）。", "p5": "モデルの適合は基準を満たした（χ2(337) = 1,152.11、CFI = .95、RMSEA = .05、SRMR = .04）。people-pleasingは情緒的消耗と3つの媒介変数のすべてと正に関連した（βはすべて.32以上）。プレゼンティーイズムと仕事の強化・延長は情緒的消耗と関連し（β≥.17）、間接効果も正だった。余暇時間の仕事は有意でなかった（β = −.07、p = .13）。モデルは情緒的消耗の分散の27%を説明した（§3.2、図1、表2）。", "p6": "著者の挙げる限界は、横断デザインで因果は言えず逆向きの関係もありうること、すべて自己報告で共通方法バイアスの可能性があること、成果を情緒的消耗だけに絞ったこと（限界の節）。事前登録はしていない（§2.5）。解釈：標本は女性と若い年齢層に偏る。", "fun": "頼まれると断れない、周りの期待に応えようとして自分のことを後回しにする。そんな人は職場で消耗しやすいのでしょうか。902人の調査では、そうした傾向の強い人ほど、体調が悪くても出勤したり、仕事を詰め込んで長く働いたりしがちで、それが消耗とつながっていました。意外なのは、余暇の時間に仕事をすることは、消耗への経路として有意ではなかったことです。", "unverified": "表1の相関係数の個々の値と、表2の間接効果の値の一覧は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "AIに職を奪われる不安を測る18項目の尺度", "title": "Development and Validation of the AI-Related Career Replacement Anxiety Scale for University Students", "url": "https://doi.org/10.20944/preprints202611.2954.v1", "authors": "Wanyu Chen ほか", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Chen, W., Pan, Y., & Zhou, S. (2026). Development and Validation of the AI-Related Career Replacement Anxiety Scale for University Students. https://doi.org/10.20944/preprints202611.2954.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Preprints.org）は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "大学生が「将来の職業がAIに取って代わられる」ことへの不安を測る、18項目3因子の尺度を作り、信頼性と妥当性を確かめた（抄録）。", "p2": "AIの急速な発展のなかで、大学生の将来の職業がAIに代替されることへの不安を測る、信頼性と妥当性の確立した専用の測定道具がなかった（抄録）。", "p3": "3つの研究からなる。研究1でフォーカスグループと半構造化面接から3次元の概念枠組みを作り、研究2で項目分析と探索的因子分析、研究3で確認的因子分析と信頼性・妥当性の分析を行う（抄録）。", "p4": "研究2は300人、研究3は360人。探索的因子分析で得た構造が別の標本の確認的因子分析で支持されるか、信頼性と妥当性が示されるかで評価する（抄録）。適合度の基準は抄録に記載がなく未確認。", "p5": "最終版は18項目で、認知的な脅威の知覚、否定的な感情の経験、行動面の対処の傾向の3因子からなる。良好な信頼性と妥当性を示したと報告する（抄録）。因子負荷量や適合度の数値は抄録に記載がなく未確認。", "p6": "抄録には限界の記載がない。解釈：対象は大学生で、すでに働いている人に当てはまるかは未確認。標本の国や抽出の方法、他の尺度との関連の中身も抄録からは分からない。", "fun": "「自分が目指す職業は、将来AIに取って代わられるかもしれない」。そんな不安は目に見えないので、まず測る道具が要ります。この研究は学生への聞き取りから始めて、不安を「脅威をどう認識するか」「否定的な感情」「対処の行動の傾向」の3つの面に分け、18の質問にまとめました。ものさしができて初めて、誰がどのくらい不安かを比べられるようになります。", "unverified": "本文を入手できず、項目の文言、因子負荷量、適合度と信頼性係数の値、標本の属性は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "別の提供元のLLMに監査させると成功率が上がる", "title": "Cross-Provider LLM Auditing Improves Task Success at Equal Cost in Autonomous Linux System Administration", "url": "https://doi.org/10.20944/preprints202611.2715.v1", "authors": "Alvaro Parres-Peredo", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Parres-Peredo, A. (2026). Cross-Provider LLM Auditing Improves Task Success at Equal Cost in Autonomous Linux System Administration. https://doi.org/10.20944/preprints202611.2715.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Preprints.org）は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMエージェントが実行しようとするシェルコマンドを、別の提供元のLLMに事前に審査させると、同じ提供元のLLMに審査させるより課題の成功率が高く、費用は変わらないことを示した（抄録）。", "p2": "LLMエージェントを自律的なLinuxのシステム管理者として使う提案があるが、任意のシェルコマンドを実行できるため安全性が問題になる。各コマンドを実行前に審査する2つ目のLLMが結果を改善するか、費用はどうかは確かめられていなかった（抄録）。", "p3": "OpenAIのモデルを提案役とし、隔離したLinuxコンテナで動かす実験の枠組みVice SysAdminを作り、審査役なし（A）、同じ提供元の審査役（B）、別の提供元の審査役（C）の3条件を比べる。審査役は各コマンドを実行の前に見る（抄録）。", "p4": "6つのカテゴリの18課題を、各条件で15回ずつ、計810回繰り返す。課題の成功、適切な引き継ぎ（エスカレーション）、高リスクのコマンドの遮断、トークンの費用、審査役どうしの一致を測る（抄録）。", "p5": "構文上高リスクのコマンドの遮断は、Aの0%に対しBで19.8%、Cで10.5%。成功率はCが75.9%でBの63.7%より高く、費用は7.12ドルと7.71ドルで統計的に区別できない。同じ243件の入力への2つの審査役の判断の一致は低く（コーエンのκ 0.24）、一方だけが止めた24件のうち22件で同じ提供元の審査役のほうが厳しかった（抄録）。", "p6": "2つの審査役は性能の階層が違い、提供元の違いとモデルの階層の違いが交絡していると著者が認める。検証用の検査の不具合を修正したことと、温度0でも審査役の出力が決定的でなかったことも報告する（抄録）。解釈：18課題・1つの提案役での結果で、一般化は未確認。", "fun": "AIにサーバーの管理を任せるとき、危険な命令を実行されては困ります。そこで「別のAIに実行の前に見てもらう」という二重チェックを試しました。面白いのは、同じ提供元のAIに見てもらうより、別の提供元のAIに見てもらったほうが課題の成功率が高かったことです。同じ提供元のAIは厳しめで、危険の小さい命令まで退けがちでした。ただし2つのAIは性能の階層も違うので、提供元の違いだけの効果とは言い切れないと著者は断っています。", "unverified": "本文を入手できず、使ったモデルの名前、18課題の中身、統計検定の方法は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "2回の跳ね返りから接触の弾性指数は決まるか", "title": "Identifiability of the elastic exponent from two rebounds in a compliant Painlevé oscillator", "url": "https://doi.org/10.5281/zenodo.24580211", "authors": "Lu, Haibo", "venue": "Zenodo", "date": "2026-11-27", "apa": "Lu, H. (2026). Identifiability of the elastic exponent from two rebounds in a compliant Painlevé oscillator (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.24580211", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録と、数値の補足資料のPDF（S1〜S2）を読んだ。論文本体のPDFは取得されていない", "preprint": true, "p1": "摩擦のある接触で引っかかり（ジャム）を起こす2質点の振動子について、その後の2回の跳ね返りの記録から、接触の弾性則の指数を決められる条件と、決められない場合を示した（抄録）。", "p2": "問いは、動的なジャムの後に完了した最後の2回の跳ね返りという少数の観測から、やわらかさ（コンプライアンス）を持つ2質点のパンルヴェ振動子の弾性指数が定まるかどうかである。跳ね返りの回数やベルトの速度のずれが分からない場合も含めて問う（抄録）。", "p3": "履歴を持たない打ち切り型の粘弾性の接触モデルで、2回の着地位置と、各接触が共通の検出深さを超えて留まる時間の、計4つの読みを観測量とする。ジャムの後は、滑りの終わりに蓄えられる弾性エネルギーが着地距離の3乗に比例し、単独の衝突での4乗とは異なる。この違いが、力の大きさを知らなくても深さを補正する手がかりになる（抄録）。", "p4": "検証は理論の誤差評価と数値の補足による。補足では、接触の求積を倍精度の計算と閉形式の2つの実装で確かめ、3つのコンプライアンスで4次元の振動子を2種類の積分法で積分して読みを比べる（補足S1〜S2）。", "p5": "材料の構成則の尺度が一様な族では、2回の接触がともに較正した深さを超えれば、指数の最悪の誤差はコンプライアンスの上限とともに代数的に減る。検出深さが未知でも跳ね返りの回数が分かれば逆対数の上界が得られる。回数が分からないと4つの読みには大きなあいまいさが残り、ベルト速度の独立な測定で解消できる（抄録）。補足では2つの積分法の読みの相対差は最大2.1×10^-7だった（補足S2）。", "p6": "尺度の一様性は本質的な仮定で、より広い族では、1つの材料が、あらゆる弾性指数の代替と厳密に一致する深さゼロの記録の列を生む（抄録）。未査読の単著で、実験との照合は示されていない。解釈：同定できるかどうかは、観測量の選び方と仮定する材料の族に強く依存する。", "fun": "摩擦のある面で物が引っかかって跳ねるとき、その跳ね返り方から接触の性質を言い当てられるでしょうか。この論文は、引っかかりの後の「2回の跳ね返り」の記録だけで、接触の弾性を表す指数が分かるかを調べました。答えは「条件による」です。材料の性質の尺度がそろった範囲なら決まりますが、範囲を広げると、同じ記録を生む別の指数の材料が作れてしまいます。測れば分かる、とは限らないことを示す例です。", "unverified": "論文本体のPDFは取得されておらず、定理の正確な仮定と証明、図は未確認。補足のS3は読んでいない。"}}, {"id": "pr16", "rank": 16, "headline": "欧州の孤独・孤立の調査データ324件を検索できる台帳", "title": "D3.1 Technical Report: Searchable online database of social isolation and loneliness (SIL) datasets", "url": "https://doi.org/10.5281/zenodo.24493481", "authors": "Bertero ほか", "venue": "Zenodo", "date": "2026-11-27", "apa": "Bertero, A., Growiec, K., Luhmann, M., Tang, Y., & Vezzoni, C. (2026). D3.1 Technical Report: Searchable online database of social isolation and loneliness (SIL) datasets. Zenodo. https://doi.org/10.5281/ZENODO.24493481", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "EU加盟国と英国で集められた、孤独と社会的孤立の測定項目を持つ公開調査データを、項目の文言まで記録して検索できる台帳にした（抄録）。", "p3": "データと調査回ごとに1件として、調査のメタデータ、孤独の項目の文言・尺度・選択肢、測定の系統、扱う話題を記録し、事前登録した手順で毎年更新する（抄録）。", "p5": "初版は324件を収め、最初の更新（第2.0版）は359件の調査を載せる。報告書の第1.1版では対象範囲と更新の章を加え、図2を訂正した（抄録）。", "fun": "「孤独ですか」という質問は、調査によって言い回しも選択肢の数も違います。ばらばらのままでは国どうしの比較ができないので、まず「どの調査がどんな聞き方をしたか」を一覧にする地道な作業が要ります。この台帳は324件の調査を1件ずつ調べ上げて、その土台を作ったものです。", "unverified": "台帳の各列の定義、対象国ごとの件数、検索画面の機能は本文を入手できず未確認。"}}, {"id": "pr17", "rank": 17, "headline": "質問紙の項目間の相関は文の意味からも生じうる", "title": "Semantic structure and measurement in large language models for psychopathology and psychometrics", "url": "https://doi.org/10.31234/osf.io/jrfa9", "authors": "Andrea Raballo ほか", "venue": "PsyArXiv", "date": "2026-11-27", "apa": "Raballo, A., Poletti, M., & Preti, A. (2026). Semantic structure and measurement in large language models for psychopathology and psychometrics. https://doi.org/10.31234/osf.io/jrfa9", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたPsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "質問紙の項目どうしの相関は、測りたい心の構造だけでなく、項目の文の意味の近さからも生じうると論じる短い論考（抄録）。", "p3": "LLMが項目文の意味と感情の埋め込みから項目間の関連と下位尺度の構造を再構成できるという先行研究（Kambeitzら、2025年）への応答として、意味論的な心理測定の知見を整理する（抄録）。", "p5": "項目の意味は、自由記述からの質問紙への回答の補完、尺度間の予測、診断の推論に使えるとし、項目の重複の整理や尺度の統一への含意を挙げる。ただし実証的な妥当性の検証や臨床判断の代わりにはならないと述べる（抄録）。", "fun": "アンケートで「気分が沈む」と「憂うつだ」の両方に「はい」と答える人が多いのは、心の中に共通の原因があるからでしょうか。それとも単に2つの文がほぼ同じ意味だからでしょうか。文章の意味だけを学んだAIが項目どうしの関係を言い当てられるなら、後者の可能性を無視できない、というのがこの論考の問いです。", "unverified": "論考が根拠とする具体的な数値や対象の質問紙は抄録に記載がなく未確認。"}}, {"id": "pr18", "rank": 18, "headline": "住宅価格を住戸と団地の2つの尺度で空間分析", "title": "A Two-Scale Housing-Price Analysis Using Spatial Autoregression and Multiscale Geographically Weighted Regression", "url": "https://doi.org/10.21203/rs.3.rs-11584124/v1", "authors": "Wanqiu Zhang ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Zhang, W., Gu, C., & Wu, Z. (2026). A Two-Scale Housing-Price Analysis Using Spatial Autoregression and Multiscale Geographically Weighted Regression. https://doi.org/10.21203/rs.3.rs-11584124/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "同じ団地に複数の住戸タイプがある住宅データを、住戸の尺度と団地の尺度の2段で分析し、住宅価格と要因の関係が及ぶ空間的な広さを要因ごとに見分けた（抄録）。", "p3": "住戸の尺度では団地でクラスタ化した推測と交差検証つきの最小二乗法を使い、団地の尺度では空間計量モデルと、マルチスケール地理的加重回帰（MGWR：要因ごとに効く範囲を変えられる回帰）を当てはめる（抄録）。", "p5": "鄭州の198団地・461の住戸タイプで、団地の価格に強い空間的な依存があり、空間自己回帰モデルが支持された。商業施設との関係は局所的、地下鉄への近さは広い範囲、地域のGDPはほぼ全域で一様な関係だった（抄録）。", "fun": "マンションの値段は「駅に近いか」「近くに店があるか」で変わりますが、その影響が及ぶ広さは要因ごとに違います。この研究では、ショッピングセンターとの関係はごく近所に限られ、地下鉄への近さとの関係はもっと広い範囲に及んでいました。要因ごとに「ものさしの長さ」を変えて測るのが工夫です。", "unverified": "係数の大きさ、モデルの適合度、データの取得時期は抄録に記載がなく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "年次報告書の会長の言葉から革新志向を測る", "title": "The impact of entrepreneurial innovation spirit on digital technology innovation: text analysis based on chairmen’s statements in annual reports", "url": "https://doi.org/10.21203/rs.3.rs-11667648/v1", "authors": "Mingfu Lu", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Lu, M. (2026). The impact of entrepreneurial innovation spirit on digital technology innovation: text analysis based on chairmen’s statements in annual reports. https://doi.org/10.21203/rs.3.rs-11667648/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "年次報告書の会長メッセージの文章から経営者の革新志向を数値化し、それが企業のデジタル技術の革新と結びつくかを確かめた（抄録）。", "p3": "2016〜2023年に会長メッセージを開示した中国A株の上場企業を標本に、テキストに基づく革新志向の指標とデジタル技術の革新の関係を調べ、内生性と頑健性の検定、経路と異質性の分析を行う（抄録）。", "p5": "革新志向はデジタル技術の革新を有意に促し、デジタル資産・デジタル人材・外部の研究開発知識の配分を増やす経路が確認された。効果は、代理コストが低い企業や内部統制に欠陥のない企業、会長が若く学歴が高い企業で大きい（抄録）。", "fun": "社長や会長が株主に向けて書く挨拶文は、型どおりの文章に見えます。けれども、その文章から読み取った「新しいことに挑む姿勢」の強さが、その会社が実際に新しいデジタル技術を生み出しているかと結びついていた、というのがこの研究です。言葉づかいが行動の手がかりになるかを、文章を数値に直して確かめています。", "unverified": "標本の企業数、革新志向の測り方の詳細、効果の大きさは抄録に記載がなく未確認。"}}, {"id": "pr20", "rank": 20, "headline": "CSR文書を複数の埋め込みとファジィクラスタで分類", "title": "Multi-View Semantic Representation and Fuzzy Clustering for Corporate Social Responsibility Documents", "url": "https://doi.org/10.21203/rs.3.rs-11670125/v1", "authors": "Nik Siti Madihah Nik Mangsor ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Mangsor, N. S. M. N., Na, S. A. M., Rahman, S. A., & Au, T. W. (2026). Multi-View Semantic Representation and Fuzzy Clustering for Corporate Social Responsibility Documents. https://doi.org/10.21203/rs.3.rs-11670125/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "主題が重なり合うCSR（企業の社会的責任）の文書を、1つの文書が複数の主題に部分的に属することを許して分類する枠組みを作った（抄録）。", "p3": "6種類のSentence-BERTで文書を数値ベクトルにし、ブートストラップによる処理とUMAPによる次元圧縮を経て、ファジィc平均法（各文書に各群への所属度を与える分類）で分ける。8,541件のCSR文書で、シルエット係数など5つの指標で既存手法と比べる（抄録）。", "p5": "CSRの文書群でシルエット係数0.32、ファジィ分割係数0.71などを得て、比べた手法の中で総合的に最も頑健だった。20 Newsgroupsでは一部の指標で単一視点の手法が上回り、指標によって優劣が変わる（抄録）。", "fun": "企業の報告書の1つの文書が「環境」と「地域貢献」の両方を語っていることはよくあります。ふつうの分類は1つの箱にしか入れられませんが、この方法は、それぞれの箱にどのくらい属するかを度合いで表します。白か黒かでなく濃淡で分ける発想を、文書の整理に持ち込んだ研究です。", "unverified": "文書の出典（国・年・企業）、群の数、比較した手法の一覧は抄録に記載がなく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "職員のAI利用を制限した3つの公的機関を比べる", "title": "Restricting Staff Use of AI Services over Information Protection Concerns: A Comparative Analysis of Three Public Organisations", "url": "https://doi.org/10.20944/preprints202611.2884.v1", "authors": "Babajide Okeowo ほか", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Okeowo, B., Okoye, E., Pinto, P., & Sobreiro, N. (2026). Restricting Staff Use of AI Services over Information Protection Concerns: A Comparative Analysis of Three Public Organisations. https://doi.org/10.20944/preprints202611.2884.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたPreprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "情報保護の懸念から職員のAIサービスの利用を制限した3つの公的機関の決定を、同じ基準で比べ、きっかけと範囲と再開の道筋の違いを整理した（抄録）。", "p3": "オランダ中央政府の生成AIへの暫定方針（2023年）、ワシントン大学による会議アシスタントの遮断（2025年）、豪ビクトリア州の省に児童保護の職員の生成AIを遮断させた遵守通知（2024年）を、事前に決めた4基準で公式資料から分析した（抄録）。", "p5": "個人データの開示が確認されたうえでの決定はビクトリア州だけで、他の2件は予防的だった。対象が最も広いのは予防的なオランダの方針で、事故を受けたビクトリア州は1つの職員集団に限られた。著者は3事例からのパターンであり一般則ではないと断る（抄録）。", "fun": "「職場でAIを使ってはいけない」という決まりは、どんなときに、どこまでの範囲で出されるのでしょうか。3つの事例を比べると、実際に情報が漏れた後に出された禁止は対象が狭く、漏れる前に用心して出された方針のほうが広い範囲に及んでいました。事故の有無と禁止の広さが逆になる、という意外な並びが見えます。", "unverified": "4つの基準の正確な定義と各事例の詳細は本文を入手できず未確認。"}}, {"id": "pr22", "rank": 22, "headline": "認知症の家族介護者向けオンライン支援の実施可能性", "title": "Delivering a Blended e-Health Intervention for Family Caregivers of People with Dementia in the UK (CareCoach): Results from a Feasibility Randomised Controlled Trial", "url": "https://doi.org/10.3310/nihropenres.14501.1", "authors": "Morse H ほか", "venue": "Europe PMC (preprint)", "date": "2026-11-26", "apa": "Morse, H., Cross, J. L., Clark, L. V., Man, M.-S., Shepstone, L., Vishwakarma, R., Katangwe-Chigamba, T., Turner, D. A., Oyebode, J., Penhale, B., Fenwick, G., Poland, F., Harrison Dening, K., Orrell, M., De Vugt, M., May, C., Gracey, F., Hammond, M., & Fox, C. (2026). Delivering a Blended e-Health Intervention for Family Caregivers of People with Dementia in the UK (CareCoach): Results from a Feasibility Randomised Controlled Trial. NIHR Open Research, 6, 212. https://doi.org/10.3310/nihropenres.14501.1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録されたNIHR Open Researchの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "認知症の人を介護する家族向けの、オンライン教材とコーチの助言を組み合わせた8週間の支援について、無作為化比較試験を英国で実施できることを確かめた（抄録）。", "p3": "多施設の並行群・個人単位の無作為化による実施可能性試験で、通常の支援と比べる。診断から5年以内の認知症の人の家族介護者42人を目標に募り、募集・継続・提供の実施可能性を主要な評価とした（抄録）。", "p5": "目標どおり42人を募集でき、6か月後の継続率は88.1%だった。介入群21人のうち17人が支援を受け、8人のコーチが手順に高い忠実度で提供した。著者は本試験への移行を支持する（抄録）。", "fun": "新しい支援が「効くかどうか」を確かめる大きな試験には、多くの人手と費用がかかります。そこでまず小さな試験で、参加者が集まるか、途中でやめないか、計画どおりに提供できるかを調べます。この研究はその予行演習にあたり、42人のうち約9割が半年後まで続けられました。効果そのものは、まだ分かっていません。", "unverified": "介護者の自己効力感や生活の質の変化の数値は抄録に記載がなく未確認（この試験は効果の検証を目的としていない）。"}}, {"id": "pr23", "rank": 23, "headline": "自閉症の児童の社会参加を支える教職員の実践", "title": "Supporting Social Inclusion of Students with Autism: School Staff Practices and Individual and Structural Factors in Norwegian Primary Schools", "url": "https://doi.org/10.21203/rs.3.rs-11209923/v1", "authors": "Johanne Eilertsen Norlunn ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Norlunn, J. E., Raanes, E., Joa, C., & Chahboun, S. (2026). Supporting Social Inclusion of Students with Autism: School Staff Practices and Individual and Structural Factors in Norwegian Primary Schools. https://doi.org/10.21203/rs.3.rs-11209923/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ノルウェーの小学校で、教職員が自閉スペクトラム症（ASD）の児童の遊びや交流をどの程度支えているかと、その支援を左右する要因を調査で明らかにした（抄録）。", "p3": "教職員への質問紙調査で、見守りと観察、遊びと交流の支援、関係づくりと包摂という支援の形を測り、支援に影響しうる要因もあわせて尋ねて統計的に分析した（抄録）。", "p5": "教職員は問題が起きたときには介入するが、包摂を促す体系的・予防的な取り組みは少ない。経験年数よりASDに特化した知識が支援と明確に関連し、特別支援の教員は一般の教員より一貫して高い。時間の圧力と資源の不足は全職種に同程度の障壁だった（抄録）。", "fun": "休み時間の遊びには、口に出されないルールがたくさんあります。それを読み取るのが苦手な子には、大人が「通訳」のように間に入る必要があります。この調査では、先生たちはトラブルが起きれば助けに入るものの、起きる前に仲間に入りやすくする工夫はあまりしていませんでした。経験の長さより、専門の知識があるかどうかが違いを生んでいました。", "unverified": "回答者数、尺度の項目、関連の大きさは抄録に記載がなく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "ニシェーミの巨大地すべりの根は17世紀の土地利用", "title": "The giant landslide in Niscemi (Italy): history and geomatics reveal its 17th- century anthropogenic roots", "url": "https://doi.org/10.21203/rs.3.rs-11783266/v1", "authors": "Christian Marino ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Marino, C., Branca, S., Ciuccarelli, C., Mattia, M., Messina, D., & Militello, P. (2026). The giant landslide in Niscemi (Italy): history and geomatics reveal its 17th- century anthropogenic roots. https://doi.org/10.21203/rs.3.rs-11783266/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2026年1月に再び動いたシチリアのニシェーミの巨大な深層地すべりについて、18世紀の崩壊の範囲を地図上に復元し、当時の土地利用の変化が素因になったことを示した（抄録）。", "p3": "古文書の批判的な分析と現代の測量・空間情報の技術を組み合わせ、1600〜1800年の土地台帳から人口・森林・水系の変化を読み取って、崩壊の位置と重ねる（抄録）。", "p5": "斜面の不安定化の始まりを1776年の前兆の出来事までさかのぼらせ、1790年の地すべりの滑落崖の広がりを位置づけた。人口の増加が大規模な森林伐採と水系の改変を伴っていたことを示し、1790年の崩壊を地震によるとする200年来の説を退けた（抄録）。", "fun": "地すべりは大雨の日に突然起きるように見えますが、斜面が弱くなる準備は何百年も前から進んでいることがあります。この研究は、古い土地台帳を読み解いて、人が増えて森を切り開き水の流れを変えたことが、のちの巨大な地すべりの下地になったと示しました。歴史の史料が防災の資料になる例です。", "unverified": "復元した滑落崖の寸法、使った測量データの種類と精度は抄録に記載がなく未確認。"}}, {"id": "pr25", "rank": 25, "headline": "大学構内のストリートビューは4分の3が空白", "title": "Are all campuses equally (digitally) visible? Crowdsourced vs. proprietary street-view coverage across Indonesian university campuses", "url": "https://doi.org/10.21203/rs.3.rs-11628394/v1", "authors": "Mohammad Raditia Pradana ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Pradana, M. R., Semedi, J. M., Muhamad, N., & Rahatiningtyas, N. S. (2026). Are all campuses equally (digitally) visible? Crowdsourced vs. proprietary street-view coverage across Indonesian university campuses. https://doi.org/10.21203/rs.3.rs-11628394/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "大学の構内のような半ば閉じた場所で、街路画像（ストリートビュー）がどこまで撮られているかを測り、4分の3が空白であることを示した（抄録）。", "p3": "インドネシアの40大学の構内を20mの格子に分け、投稿型のMapillaryと企業が撮るGoogle Street Viewのそれぞれが覆う格子を数え、両者の食い違いもデータとして分析した（抄録）。", "p5": "覆う格子の平均はGoogleが22.9%、Mapillaryが3.3%で、両方が一致して覆うのは2.1%、76.0%はどちらにもない。構内の境界からの距離は覆い方をほとんど説明せず（決定係数の中央値0.006）、投稿型は9大学で1人の投稿者に頼っていた（抄録）。", "fun": "地図アプリで街の写真をどこでも見られる気がしますが、大学の構内に入ると4分の3は写真がありません。しかも9つの大学では、投稿された写真が1人の投稿者に頼っていました。街の写真から暑さや日陰を分析する研究が増えていますが、そもそも写真がない場所は分析から抜け落ちる、という盲点を数で示しています。", "unverified": "40大学の選び方、撮影時期、覆う格子の判定方法の詳細は抄録に記載がなく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "AIの要約が先に出るとチームの判断は早く収束するか", "title": "AI-Mediated Convergence of Judgment in Intercultural Project Teams", "url": "https://doi.org/10.5281/zenodo.23870842", "authors": "Ajayi ほか", "venue": "Zenodo", "date": "2026-11-26", "apa": "Ajayi, P., & Ogundeji, E. O. (2026). AI-Mediated Convergence of Judgment in Intercultural Project Teams (Version V1). Zenodo. https://doi.org/10.5281/ZENODO.23870842", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録されたZenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "生成AIの要約や提案が、各メンバーの持つ証拠を検討する前にチームに示されると、判断の収束のしかたがどう変わるかを、多文化のプロジェクトチームについて整理した（抄録）。", "p3": "既存研究を批判的に統合する総説で、課題の情報を与える支援と、1つの解釈を優先させる支援を区別し、独立に見いだせる別の案が口に出され、評価され、決定に反映されるかを検討の軸にする（抄録）。", "p5": "提示の順序、文化的な解釈、権限、課題の検証しやすさ、複数のAIの枠組みについて、5つの条件つき命題を、対立仮説と反証条件つきで示した。生産的な収束・早すぎる収束・解釈の分断を区別するが、後の判断の良し悪しとの関係は未確立と述べる（抄録）。", "fun": "会議の前にAIが作った「まとめ」を全員が読むと、話が早く進みます。でも、まだ誰も自分の考えを出していないうちに、筋の通った1つの説明を見てしまうと、別の見方が出にくくなるかもしれません。この論考は、AIの助けが「足りない情報を補う」場合と「1つの解釈に寄せる」場合を分けて考えるべきだと提案しています。", "unverified": "5つの命題の具体的な文言と、根拠にした先行研究の範囲は本文を入手できず未確認。実証データはない。"}}, {"id": "pr27", "rank": 27, "headline": "倫理的リーダーと働く熱意の組み合わせが変革の準備に効く", "title": "Ethical Leadership and Human Drivers of Industry 4.0 Readiness in Manufacturing SMEs: A Configurational Analysis", "url": "https://doi.org/10.20944/preprints202611.2822.v1", "authors": "Anna Kwiotkowska ほか", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Kwiotkowska, A., & Gębczyńska, M. (2026). Ethical Leadership and Human Drivers of Industry 4.0 Readiness in Manufacturing SMEs: A Configurational Analysis. https://doi.org/10.20944/preprints202611.2822.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたPreprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "中小の製造業がインダストリー4.0に備えられているかは、倫理的リーダーシップや従業員の熱意といった人の側の条件の「組み合わせ」で説明できることを示した（抄録）。", "p3": "ポーランドの自動車部品の中小製造業58社の従業員と管理職156人の調査を企業の単位に集約し、ファジィ集合の質的比較分析（fsQCA：結果に十分な条件の組み合わせを探す方法）にかけた（抄録）。", "p5": "高い準備度に十分な3通りの組み合わせと、低い準備度に十分な2通りが見つかった。単独で必要な条件はなく、倫理的リーダーシップとワークエンゲージメントが高い準備度の解に繰り返し現れ、その欠如が低い準備度の組み合わせに現れた（抄録）。", "fun": "「工場のデジタル化が進む会社」の条件は1つではありません。この研究は、原因を1つずつ調べる代わりに、「どんな条件の組み合わせなら進むか」を探しました。すると道は3通りあり、どれにも絶対に欠かせない条件はありませんでした。料理のレシピが1つでないのと同じで、成功の形は複数ある、という見方です。", "unverified": "3通りの組み合わせの具体的な中身、整合性と被覆度の値は抄録に記載がなく未確認。"}}, {"id": "pr28", "rank": 28, "headline": "商店が共同で配送に投資すると過小にも過大にもなる", "title": "Cooperating to Compete: Collective Investment by Retailers Facing Online Competition", "url": "https://doi.org/10.21203/rs.3.rs-11598658/v1", "authors": "Sanaa El Waddi ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Waddi, S. E., & Hammoudi, A. (2026). Cooperating to Compete: Collective Investment by Retailers Facing Online Competition. https://doi.org/10.21203/rs.3.rs-11598658/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "独立した小売店が共同で注文・配送のサービスに投資してオンライン小売と競うとき、その投資が店にとって得か、社会にとって望ましいかを理論で調べた（抄録）。", "p3": "小売店は販売の自律を保ったまま買い物の便利さを共同で高め、オンラインの競合は品質を選んだうえで数量で競うというゲームの均衡を求め、店が選ぶ投資と、社会的厚生を最大にする投資を比べる（抄録）。", "p5": "店の当初の不利の大きさと投資の費用によって、私的な投資は社会的な最適より過小にも過大にもなる。従来の販売機会が縮むにつれ、投資は最初は増え、その後は減る。従来の販売を守ることと全体の厚生を高めることは別の目標だと結論する（抄録）。", "fun": "商店街の店が力を合わせて宅配サービスを始めれば、ネット通販に対抗できそうです。ところが理論で調べると、店どうしの共同投資は、社会全体から見て「足りない」場合もあれば「やりすぎ」の場合もあります。店を守ることと、買い物客を含めたみんなの得を増やすことは、同じではないからです。", "unverified": "モデルの具体的な仮定（需要の形、費用の関数）と、過小・過大を分ける条件の式は本文を入手できず未確認。"}}, {"id": "pr29", "rank": 29, "headline": "LLM判定は差の小さいモデルを見分けられない", "title": "The Resolution Blind Spot: How Proxy Metrics and LLM-as-a-Judge Mask Forgetting and Reject Pareto-Superior Models in Low-Resource 7B Fine-Tuning", "url": "https://doi.org/10.5281/zenodo.24575448", "authors": "Zhang ほか", "venue": "Zenodo", "date": "2026-11-27", "apa": "Zhang, Y., & Fan, B. (2026). The Resolution Blind Spot: How Proxy Metrics and LLM-as-a-Judge Mask Forgetting and Reject Pareto-Superior Models in Low-Resource 7B Fine-Tuning. Zenodo. https://doi.org/10.5281/ZENODO.24575448", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録されたZenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMを採点者にする評価は、性能の近いモデルどうしの差を見分ける力が足りず、実際に改善したモデルを見逃すことを、微調整の監査で示した（抄録）。", "p3": "中国語の計算機科学教育向けに7Bモデルを微調整した10個のチェックポイントについて、自由記述の代理指標、汚染のない客観問題1,359問、提示順を入れ替えたLLM判定144問を突き合わせ、二項分布の検出力を計算した（抄録）。", "p5": "代理指標は教科書風の文体を評価する一方、客観問題での2.43〜3.75ポイントの忘却を隠していた。学習をやり直すと忘却は消え、配備中のモデルより2.87ポイント高くなったが、LLM判定は61対61の引き分けだった。144問で検出できる差は13.1〜13.7ポイントで、5ポイントの差を見るには983問が要る（抄録）。", "fun": "2つのAIのどちらが優れているかを、別のAIに「審判」をさせて決める方法が広く使われています。この研究では、片方がはっきり良くなっていたのに、144問の審判の結果はちょうど61対61の引き分けでした。計算すると、この問題数では13ポイントほどの大差でないと見分けられません。視力検査の表が粗すぎるのと同じ状況です。", "unverified": "監査の対象は1つの微調整の事例で、他のモデルや課題に当てはまるかは未確認。本文は入手できていない。"}}, {"id": "pr30", "rank": 30, "headline": "継続的監査の結論は期間でなく条件で有効性を決める", "title": "From Time-Bound to Condition-Bound Reliance: A Conceptual Framework for Revalidating Continuous Audit Conclusions on Organisational Security Controls", "url": "https://doi.org/10.20944/preprints202611.2729.v1", "authors": "Nelson Sobreiro", "venue": "Preprints.org", "date": "2026-11-27", "apa": "Sobreiro, N. (2026). From Time-Bound to Condition-Bound Reliance: A Conceptual Framework for Revalidating Continuous Audit Conclusions on Organisational Security Controls. https://doi.org/10.20944/preprints202611.2729.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたPreprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "監視の結果が良好なままでも、前提が変われば監査の結論に頼れなくなるとして、継続的監査の結論を「期間」でなく「条件」に結びつけて見直す枠組みを示した（抄録）。", "p3": "監査基準、監視の指針、継続的監査の研究、保証事例の維持、覆されうる推論の文献を目的に沿って統合する概念論文で、多要素認証とアクセス権の見直しの仮想事例で説明する（抄録）。", "p5": "結論に頼り続けるには、対象範囲が代表されていること、検査が適切であること、証拠の出所が使えることの3条件と、証拠の十分性の文書化された判断が要る。条件を揺るがす「変化」と結論に反する「逸脱」を分け、状態と遷移の規則として5段階の循環に組み込んだ。効果は未検証の命題だと著者も述べる（抄録）。", "fun": "健康診断で「異常なし」と言われても、その後に生活が大きく変われば、その結果はもう当てになりません。会社の安全対策の監査も同じで、自動の監視が「問題なし」と出し続けていても、調べている範囲や調べ方の前提が変わっていたら結論は古くなります。この論考は、結論の「賞味期限」を日付でなく条件で決めようと提案しています。", "unverified": "状態と遷移の規則の具体的な定義は本文を入手できず未確認。実データでの検証はない。"}}, {"id": "pr31", "rank": 31, "headline": "積載に応じてばねと減衰を変える1/4車両モデル", "title": "Load-Dependent Spring–Damper Scaling in a Passive Quarter-Car Model: Analytical Relations and a Preliminary Bump-Response Assessment", "url": "https://doi.org/10.5281/zenodo.24567292", "authors": "Al Junaid ほか", "venue": "Zenodo", "date": "2026-11-26", "apa": "Al Junaid, A. (2026). Load-Dependent Spring–Damper Scaling in a Passive Quarter-Car Model: Analytical Relations and a Preliminary Bump-Response Assessment (Version 1.1). Zenodo. https://doi.org/10.5281/ZENODO.24567292", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録されたZenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "車の積載量が変わったとき、ばねとダンパの強さを積載に比例して変えると上下の揺れがどうなるかを、最も単純な車両モデルで調べた予備的な計算研究（抄録）。", "p3": "1/4車両モデル（車体の4分の1と1輪を、質量・ばね・ダンパで表す模型）で、積載に応じたばね・減衰の調整の解析式を導き、高さ50mmの山形の段差を越える数値計算で、固定の設定と比例の設定を4通りのばね上質量比で比べる（抄録）。", "p5": "抄録は数値の結果を示していない。別に行った4×4のパラメータの感度分析で、車体の加速度・サスペンションの行程・タイヤの動的な荷重の間のトレードオフを調べたとし、計算コードとデータを付けている。査読も実験による検証も経ておらず、原稿作成・コード・数値解析にAIの補助を使ったと明記する（抄録）。", "fun": "荷物をたくさん積んだ車は、空の車と同じ段差を越えても揺れ方が違います。車体が重くなると、同じばねでは揺れの周期が変わるからです。この研究は、ばねとダンパの強さを重さに合わせて変えると揺れがどう変わるかを、車体・ばね・タイヤだけの単純な模型で計算しています。乗り心地と、タイヤが路面を押す力のつり合いが論点です。", "unverified": "固定と比例の設定の優劣を示す数値は抄録になく未確認。実験での検証は行われていない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "線形注意の状態が発散する原因を突き止めて直す", "title": "Stable Gated DeltaNet-2: Understanding and Mitigating Recurrent State Instability", "url": "https://arxiv.org/abs/2611.34051", "authors": "Xichong Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-27", "apa": "Zhang, X., Hao, X., Liu, Z., Zhou, L., Zhang, Z., Chen, B., Lu, M., Lin, Z., Tang, B., Zhang, Y., Liu, L., Xiong, F., Su, J., & Li, Z. (2026). Stable Gated DeltaNet-2: Understanding and Mitigating Recurrent State Instability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34051", "why": "線形注意は系列長に比例する計算量と固定サイズの再帰状態で長い系列を扱う。その一種のGated DeltaNet-2が長い文脈の学習で失敗する原因を、消去時の読み出しと書き換えの方向の非対称が生む非正規な消去作用素にあると突き止めた。対称な消去と、減衰で調整した残差書き込みに直し、状態の増大がO(T)に収まることを示した。約16億パラメータのモデルで、128Kの文脈でのRULERの平均が6.80点上がった。Hugging Faceで投票数124。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§2.2、§3、§4.1、§5.2の冒頭、結論、図表のキャプション）を読んだ。付録の証明と表の細部は読んでいない", "preprint": true, "p1": "長い文脈を一定の記憶量で処理する線形注意の一種（Gated DeltaNet-2、GDN-2）が学習中に発散する原因を突き止め、記憶が増幅されない形に直して、長い文脈でも安定して学習できるようにした（§3〜4）。", "p2": "線形注意は系列長に比例する計算量と固定サイズの再帰状態で長い系列を扱う。GDN-2は消去と書き込みをチャネルごとに別のゲートで制御して表現力を高めたが、長い文脈の学習で損失がNaNになる失敗が起きていた。損失の監視だけでは、その前に起きている状態の異常が見えない（§1、§3.2）。", "p3": "GDN-2の消去は、古い内容をゲートをかけたキー b⊙k で読み出し、元のキー k の方向に修正する。2つの向きが平行でないと、消去の行列は対称でなく非正規になり、ゲートの値がすべて0と1の間でも状態を増幅する方向が生じる（§3.1、式4〜6）。そこでゲートの平方根を両方のキーにかけて u=√b⊙k とし、消去を対称な形にして状態が拡大しないようにする。書き込みの自由度は、減衰で調整した残差書き込みで補う（§4.1、式11〜12）。", "p4": "学習の失敗（損失がNaNになる）の回数と状態の大きさ、約16億パラメータのモデルでの常識推論・言語モデル・長文脈のベンチマークRULER（32K・64K・128K）で比べる。状態の増大に理論的な上界が付くかも基準にする（§5、表1〜3）。", "p5": "元のGDN-2は、事前学習8回のうち3回、追加学習8回のうち4回が数値的に失敗した（表1）。失敗した1回を再生すると、新しい書き込みがなくても状態の増幅が続いていた（図2）。提案手法は状態の増大にO(T)の上界を持ち（§4.2）、再帰型の設定で128KのRULERの平均を6.80点、ハイブリッドの設定で9つの下流課題の平均正解率を0.62点上げた（抄録）。", "p6": "限界を論じる節はない。解釈：評価は約16億パラメータの規模に限られ、より大きなモデルで同じ不安定が起きるかは示されていない。対称化で失われる表現力を残差書き込みがどこまで補うかは、アブレーション（図4）の範囲での確認にとどまる。", "fun": "長い文章を読むAIの中には、読んだ内容を決まった大きさの「メモ」に書き足したり消したりしながら進むものがあります。この研究は、その「消す」操作に落とし穴があることを見つけました。消す強さを0から1の間に抑えていても、読む向きと消す向きがずれていると、メモの中身が逆に大きくなる方向があり、長い文章を読むうちに数値が発散するのです。向きをそろえる直し方で、学習が安定しました。", "unverified": "定理3.1の式と証明（付録A）、状態の上界の導出（付録C）、表2〜3の個々の数値は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "カーネル推定量が拾うのは条件付き限界効果とは限らない", "title": "What Does the Kernel Estimator Recover When Treatment Effects Are Nonlinear? A Comment on Hainmueller, Mummolo and Xu (2019)", "url": "https://doi.org/10.31235/osf.io/pgdfc", "authors": "Josep Serrano-Serrat", "venue": "SocArXiv", "date": "2026-11-27", "apa": "Serrano-Serrat, J. (2026). What Does the Kernel Estimator Recover When Treatment Effects Are Nonlinear? A Comment on Hainmueller, Mummolo and Xu (2019). https://doi.org/10.31235/osf.io/pgdfc", "why": "処置効果が非線形のとき、交互作用の分析で広く使われるカーネル推定量が何を推定しているかを整理した論考。大標本でこの推定量が収束するのは、調整変数の各値での「結果を処置に回帰した傾き」（条件付き最良線形予測）であり、条件付き限界効果と一致するのは処置が調整変数のどの値でも正規分布に従うときに限られると示した。正規分布でない処置のシミュレーションで両者のずれを確かめ、推定対象を明示する必要を論じる。", "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（§2〜4、結論、図表のキャプション）を読んだ。付録は読んでいない", "preprint": true, "p1": "交互作用の分析で広く使われるカーネル推定量は、処置の効果が非線形のとき、推定の目標とされる条件付き限界効果（CME）ではなく、別の量を推定していることを示した（§3〜4）。", "p2": "処置効果が非線形で、処置と調整変数が相関するとき、Hainmuellerら（2019）のカーネル推定量が偽の交互作用を見つけるという批判があった。これに対し、推定対象をCMEと定めれば、標本が大きくなるとカーネル推定量はそれを再現するという応答が出された。この応答がどの条件で成り立つかが問い（抄録、表1）。", "p3": "カーネル推定量は、調整変数の各値の近くで、結果を処置に線形回帰する。大標本での極限は、その値での最良線形予測の傾き（条件付き最良線形予測、CBLP）である。CBLPは各用量での限界効果を、処置の分布の中での位置にも応じた重みで平均するので、各人を等しく数えるCMEとは一般に違う。両者が一致するのは、限界効果がどの用量でも同じときか、処置が調整変数のどの値でも正規分布に従うときに限られる（§2〜3）。", "p4": "先行の議論と同じデータ生成過程（Y = D² − 0.5D + ε、処置と調整変数の相関0.5）を使い、処置が正規分布に従う設計と、正規でないコピュラの設計で、カーネル推定量、線形の交互作用モデル、一般化加法モデル（GAM）が、真のCMEとCBLPのどちらを追うかを比べる（§4、図1〜3）。", "p5": "正規の設計では、カーネル推定量とGAMは真のCMEを再現するが、CMEとCBLPが等しいので、どちらを推定しているかは区別できない（図2）。正規でない設計では両者が異なり、カーネル推定量はCBLPを追ってCMEから外れる（図3、抄録）。処置が対数正規で結果が処置の2次関数の例では、CBLPの傾きはCMEの傾きより約50%大きい（結論）。", "p6": "CMEを得るには結果を処置の非線形な関数として扱う必要があり、GAMが一つの選択肢だが、共変量が多いと性能が落ちると著者は認める（結論）。解釈：示されているのは特定のデータ生成過程による例示で、実データの応用でずれがどの程度になるかは示されていない。未査読。", "fun": "ある効果が別の条件によって変わるかを調べる「交互作用」の分析は、社会科学でよく使われます。その道具の一つが、効果が量によって変わる場合には、「一人ひとりの効果の単純な平均」ではなく、「直線を当てはめたときの傾き」を答えていることを、この論考は指摘しました。直線の傾きは、処置の分布の中での位置によって重みを変えた平均になります。同じ名前で報告されていても、何を測っているかを確かめる必要があります。", "unverified": "付録A（解析的な議論）と付録E（対数正規の例）の導出、図の数値は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "6つのOSをまたぐ長い作業でエージェントを測る", "title": "OS-Omni: Benchmarking Generalist Computer-Using Agents on Long-Horizon Workflows Across Platforms", "url": "https://arxiv.org/abs/2611.34232", "authors": "Hui Shen ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-27", "apa": "Shen, H., Hsieh, Y., Ma, J., Yin, Z., Bao, Z., Liu, Z., Han, Q., Xu, X., Wang, X., Chai, W., Xu, S., Zhao, C., Shang, Y., Jiang, D., Sun, R., Li, X., Yin, C., Zhao, Z., Zheng, B., … Wong, N. (2026). OS-Omni: Benchmarking Generalist Computer-Using Agents on Long-Horizon Workflows Across Platforms (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34232", "why": "Windows・Ubuntu・macOS・iOS・Android・Webの6環境をまたいで、コンピュータを操作するエージェントを測る実行環境つきのベンチマーク。第1版は各環境48課題と、デスクトップとAndroid端末を組み合わせる12の横断課題からなる。人が要する操作は平均67.54手で、既存のOSWorldの15.0手より長い。最も強いエージェントの成功率は68.5%で、人の77.3%に8.8ポイント届かず、Linuxでは人を上回るがiOSでは25ポイント以上下回る。Hugging Faceで投票数98。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§2.1〜2.2、§3.6、§4.2、図表のキャプション）を読んだ。§4.3の分析と付録は読んでいない", "preprint": true, "p1": "コンピュータを操作するAIエージェントを、6つのOS・端末にまたがる長い実作業で、最終状態を実際に検査して採点するベンチマークOS-Omniを作った（§2〜3）。", "p2": "コンピュータ操作エージェントには、個々のGUI操作ではなく現実的な目的の達成が求められる。しかし既存のベンチマークはWeb・モバイル・デスクトップを別々に扱い、1つの汎用エージェントが複数のOSと持続するアプリの状態にまたがる長い作業をこなせるかは分からなかった（抄録）。", "p3": "各課題は、対象の環境、指示、初期化、評価の論理を持つ。エージェントは指示と現在の観測を受け取って操作を出し、終了後に課題ごとの評価器が最終の環境状態だけを見て成否を判定する（R(τ)=g(s_T)、§2.1）。評価器は文書の中身やアプリのデータベースなどを直接検査する（§2.2.2）。端末をまたぐ課題では、デスクトップの画面にAndroid端末を映し、マウスとキーボードで両方を操作する（§2.1）。", "p4": "第1版は300課題で、Windows・macOS・Ubuntu・iOS・Android・Webに各48課題、端末をまたぐ作業が12件。日常の作業138、業務の生産性59、アプリをまたぐ作業53、Web 50に分類される（§3.6、図4〜5）。指標は課題の成功率で、人の成績を参照値にする（表1）。", "p5": "人の操作は平均67.54手で、OSWorldの参照の15.0手を大きく超える（抄録）。最良のClaude Opus 5.5は環境ごとの平均で68.5%と、人の77.3%を8.8ポイント下回る。全課題を等しく数えるとGPT-6-Astraが67.0%、Claude Opus 5.5が66.7%でほぼ並ぶ。人は環境間で72.6〜83.3%と安定しているが、エージェントは環境で大きく変わり、DeepSeek V4.1 Flashは30.4%、Qwen 3.8 Maxは13.1%だった（§4.2、表1）。", "p6": "解釈：端末をまたぐ課題は12件と少なく、3課題の差が環境別平均の順位を左右している（§4.2）。300課題ずつ版を重ねる方式のため、版をまたいだ比較のしかたは今後の運用による。限界を論じる節は確認していない。", "fun": "AIに、パソコンやスマホにまたがる長い作業を頼んだら、本当に最後までやり遂げられるでしょうか。このテストは、6種類の環境で、人なら平均67.54手かかる作業をAIにやらせ、途中経過ではなく「最後の状態がそうなっているか」だけを見て採点します。最もよいAIでも人には8.8ポイント届きませんでした。しかも人の成績は環境が変わっても安定しているのに、AIは環境によって大きく変わります。", "unverified": "表1の環境別の全数値、人による実験の詳細（付録A）、失敗の分析（§4.3）は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "時系列予測の順位表は上位10件を見分けられない", "title": "What a Forecasting Leaderboard Can Establish: Resolution Reporting for Zero-Shot Time-Series Models", "url": "https://arxiv.org/abs/2611.31619", "authors": "Arya Sikder ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-27", "apa": "Sikder, A., & Pillutla, S. (2026). What a Forecasting Leaderboard Can Establish: Resolution Reporting for Zero-Shot Time-Series Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.31619", "why": "時系列の基盤モデルを比べる公開の順位表が、どれだけ小さな差まで見分けられるか（分解能）を、公開ファイルから計算する道具Vernierを提案した。GIFT-Evalの分解能は順位6.8位分で、表示上の隣どうしの差0.91より大きく、上位10件の中に見分けられる段差は2つに満たない。他の3つの順位表でも分解能は隣どうしの差の3.6〜19倍だった。2,554系列を独立に扱うBOOMだけが上位10件を見分けられた。Hugging Faceで投票数52。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§3、§4、図表のキャプション）を読んだ。§5と付録は読んでいない", "preprint": true, "p1": "時系列の基盤モデルを比べる公開の順位表が、どれだけ小さな性能差まで見分けられるか（分解能）を、順位表が公開しているファイルから計算する道具Vernierを作り、主要な順位表の上位の順位がほとんど区別できないことを示した（§3〜4）。", "p2": "時系列の基盤モデルは一度の事前学習のあと、見たことのない系列を予測するので、その根拠は取り置きのデータでの得点になる。そうしたデータは少なく、少数の公開の順位表が比較の大半を担うのに、どの順位表も、自分のデータで検出できる差の小ささを示していない（抄録）。", "p3": "入力は、各エントリの各評価単位での得点のファイル。同じ出所のデータは独立でないので出所を抽出の単位とし、2つのエントリの平均差の標準誤差を、クラスタの少なさを補正した推定量（CR2）で見積もる。5%水準の検定が80%の検出力で検出できる最小の真の差をその組の分解能とし、上位10件の隣どうしの組の中央値を順位表の分解能とする。無関係な投稿で順位が入れ替わるかも、更新の履歴から数える（§3）。", "p4": "GIFT-Evalと、エントリごと・単位ごとの得点を公開する5つの順位表（fev-benchとその部分集合、Chronos Benchmark II、TIME、BOOM）に適用する。見るのは、分解能と隣どうしの差の中央値の比、分離できる隣どうしの組の数、手を加えていないのに逆転した組の数（表1）。", "p5": "GIFT-Evalの28のデータセットが見分けられるのは順位6.8位分で、隣どうしの差の中央値は0.91、上位10件の幅は11.0（図1a）。ホルム補正の後は隣どうしの9組が1つも分離しない。15〜39の出所から作られた順位表では、分解能は差の中央値の3.6〜19倍。2,554系列を独立の出所とするBOOMだけが9組すべてを分離した。順位を他のエントリとの比較で決める規則は、4つの順位表で、手つかずの43組を226回の更新のうち31回で逆転させた（§4）。", "p6": "解釈：分解能の値は、出所を抽出の単位とみなす仮定と、上位10件という範囲に依存する。BOOMも23の領域にまとめると9組のうち5組しか分離せず、何を独立な出所とみなすかで結論が変わる（§4）。未査読。", "fun": "予測AIの順位表で、隣り合う順位の差には意味があるのでしょうか。目盛りの粗いはかりでは、小さな差は測れません。この研究は、順位表そのものの「目盛りの細かさ」を計算する道具を作りました。ある有名な表では、見分けられる差が順位にして6.8位分もあり、上位10件の隣どうしはどれも区別がつきませんでした。しかも、無関係な誰かが新しく投稿しただけで、何も変えていないモデルどうしの順位が入れ替わっていました。", "unverified": "履歴の長さを変える実験（§5、表2）と、付録の検定の妥当性の検証は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "動画を生成するよりコードで描くほうが視覚推論に強い", "title": "Solve Vision with Code: Coding Agents Are Stronger Visual Reasoners Than Video Models", "url": "https://arxiv.org/abs/2611.34813", "authors": "Dezhi Luo ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-27", "apa": "Luo, D., Yu, F., Zhang, H., Zhao, Z., Ji, R., An, S., Qin, H., Gao, Q., Cai, Z., Yang, L., Huang, Z., Wang, R., Wang, M., & Deng, H. (2026). Solve Vision with Code: Coding Agents Are Stronger Visual Reasoners Than Video Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34813", "why": "動画生成モデルを視覚推論の手段として評価する流れに対し、同じ課題・同じ入力・同じ採点器で、コーディングエージェントに答えの動画を描くプログラムを書かせて比べた。5つの認知カテゴリ500問のVBVR-Pro-Benchで、3つの商用エージェントは0.923・0.894・0.893を取り、最も強い動画モデルを0.22以上上回った。解が計算できる課題では、画素を生成するより記号的に解くほうが確かであることを示す。Hugging Faceで投票数31。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§2、§3.1〜3.2の冒頭、§4、図表のキャプション）を読んだ。§3.3〜3.4と付録は読んでいない", "preprint": true, "p1": "動画生成モデルが「視覚的に推論できるか」を測るベンチマークを、動画を生成せずにプログラムを書いて答えの動画を描くコーディングエージェントに解かせると、動画モデルを大きく上回ることを示した（§3.1、表2）。", "p2": "動画生成モデルは、最初のフレームと指示から課題をやり遂げる動画を作れるかで、視覚推論の手段として評価されるようになった。推論が画素の上で直接進むことが利点とされるが、同じ条件で記号的な方法と比べられたことはなかった（抄録）。", "p3": "エージェントには、動画モデルと同じ最初の画像と指示だけを与え、答えの動画を描画するプログラムを書かせる。画像・動画の生成モデルの呼び出しは禁止し、CPUだけの隔離環境で30分以内、1問につき1回だけ試行する（§2.1）。出力は公式の評価器を変更せずに採点する。評価器は古典的な画像処理と文字認識で、記号的な正解と照合する（§2.3）。", "p4": "VBVR-Pro-Bench（100の課題群×5問の計500問、知覚・抽象・知識・変換・空間の5区分）を使う。商用の3エージェント（Codex、Claude Code、Gemini CLI）と、公開重みの23モデルを同じ手順で動かし、公表されている動画モデルの得点と比べる。得点は500問の平均で、動画を出せなかった問いは0点（§2.2〜2.3）。", "p5": "商用の3エージェントが上位3位を占め、得点は0.923、0.894、0.893（抄録、表2）。最も強い動画モデルは、このベンチマークの課題群で評価器を報酬に強化学習したもので0.670、首位との差は0.253（§3.1）。公開重みで最良のGLM-5は0.572で、強化学習した1つを除くすべての動画モデルを上回る（抄録）。5区分すべてでエージェントが首位だった（§3.2）。", "p6": "著者は、これは現時点の動画推論の状態を述べるもので、動画生成モデルが学べることの原理的な限界を示すものではないと断る（§4）。解釈：課題は記号的な正解を持ち規則で採点できるものに限られる。動画モデルの得点は再実行でなく公表値を使っている（§2.3）。", "fun": "動画を作るAIに、最初の1枚の絵と指示を渡して続きの動画を作らせ、「目で見て考える力」を測るテストがあります。この研究は、同じテストを「プログラムを書くAI」に解かせました。絵を生成する代わりに、答えの動画を描くプログラムを書くのです。結果は、プログラムを書くAIが大きく上回りました。答えが計算で求められる課題では、絵の上で考えるより、記号で解くほうが確かだということです。", "unverified": "表2・表3の個々の数値、失敗と効率の分析（§3.3）、プログラムの2つの型の割合（§3.4）は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "符号化の道を逆にたどって画像を生成する", "title": "Generation as Reverse Encoding", "url": "https://arxiv.org/abs/2611.34782", "authors": "Cheng Shi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-27", "apa": "Shi, C., Yang, S., Guo, H., Qin, Y., Lio, P., & Yu, Y. (2026). Generation as Reverse Encoding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34782", "why": "事前学習済みの符号化器が持つ「画素から意味へ」の道を逆にたどって画像を生成するRevFlowを提案した。凍結した符号化器の中間表現を順に生成の目標とし、深い意味表現から浅い表現へ、最後に画素へと進む。段階の間で共有するDiTを使い、ImageNet 256×256で5エポックの学習でFID 1.96（6.9億パラメータ）と1.74（15.5億）に達し、各段階1ステップの生成でもFID 2.85を得たと報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§3.1、§3.4、図表のキャプション、抄録）を読んだ。§4の表と付録は読んでいない", "preprint": true, "p1": "画像の生成を、事前学習済みの符号化器が画素から意味へと情報を落としていく道を逆にたどる手順として組み立て直し、学習とサンプリングの両方を速くした（§3、図1）。", "p2": "事前学習済みの視覚表現は、見た目や空間の細部を捨てることで生成の学習を速める。しかし同じ抽象化のせいで、表現から画素へ戻るのが難しくなり、大きな復号器に負担が移る。符号化器がすでに学んだ「画素から意味へ」の道があるのに、逆向きの道を独立に学ぶ必要があるのかが問い（抄録）。", "p3": "生成をクラス y → 深い意味表現 z^L → 浅い表現 z^M → 画素 x の順に進める（式1）。深い表現はばらつきの小さい意味の空間にあるので先に生成し、それが浅い表現の空間的な平均の手がかりになるので、第2段は狭い残差を埋めればよい（§3.1）。符号化器の層の類似度が前半と後半の2つのまとまりに分かれることから2段とし、DINOv3-Lの第7層と第23層を使う（図3）。2つの段は同じDiTのブロックを共有し、条件の入れ方だけを変える（図4）。", "p4": "ImageNet 256×256の生成で、FID（生成画像と実画像の分布の距離。小さいほど良い）と学習のエポック数、再構成のPSNR、復号器の大きさ、サンプリングのステップ数を比べる（§4、図1〜2）。", "p5": "5エポックの学習で、6.9億パラメータのモデルがFID 1.96、15.5億のモデルが1.74に達した（抄録、図1）。8,900万パラメータの復号器で再構成のPSNRは30.25dB（抄録、図2）。表現の空間で直接分布を合わせる適応のあと、各段1ステップ、計2回の関数評価でFID 2.85を得た（図1、§3.4）。", "p6": "限界を論じる節はない。解釈：段の数と層の選び方は、調べた符号化器の層の類似度の構造に基づいており、他の符号化器や高解像度で同じ選び方が通用するかは本文の読んだ範囲では分からない。比較相手との学習条件の対応は表で確認していない。", "fun": "画像を理解するAIは、見た目や位置の細部を残した浅い表現から、意味をまとめた深い表現へと、情報を絞り込んでいきます。この研究は、絵を生成するAIに、その道を逆向きにたどらせました。まず大まかな意味の表現を作り、次に見た目と配置の細部を持つ表現を作り、最後に画素に直します。この順番にすると学習が速く進み、わずか5エポックの学習で高い品質に達したと報告しています。", "unverified": "表の比較相手の数値、アブレーション（§4.3）、文章からの画像生成（§4.4）、付録Aの理論は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "文脈の圧縮をモデル自身に任せると精度が上がる", "title": "Letting Models Manage Their Own Context: Where We Stand", "url": "https://arxiv.org/abs/2611.34147", "authors": "Alessio Devoto ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Devoto, A., Vem, A., Safavi, T., Kariyappa, S., Tseng, Y.-H., Furgale, P., & Cabral, R. S. (2026). Letting Models Manage Their Own Context: Where We Stand (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34147", "why": "エージェントの文脈が埋まったとき、外側の仕組みが要約するのではなく、モデル自身がいつ何を圧縮するかを決める方式を、文書調査と機械学習の開発課題で8K〜512Kトークンの予算にわたって比べた。文脈のAPIをうまく使うモデルは、とくに厳しい予算で精度が上がり、あるモデルは32Kの予算で得点が21%から56%になった。一方、使い方はモデルごとに大きく違う。編集後もKVキャッシュを再利用して前処理の計算を最大15%減らせることも示した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§2〜6、§7の冒頭、§8、図のキャプション）を読んだ。§7の後半と関連研究は読んでいない", "preprint": true, "p1": "エージェントの文脈（履歴）の圧縮を、外側の仕組みが自動で行う代わりに、モデル自身が「いつ・何を」まとめるかを決める方式を試し、文脈の予算が厳しいときに精度が上がることを示した（§4）。", "p2": "エージェントが作業を続けると、ツールの呼び出しと出力の履歴が増え、必要な情報を見つけにくくなり、やがて文脈の窓を超える。多くの実行基盤は、使用量がしきい値を超えると履歴を要約する。この方式は単純だが、課題に必要な情報を失うことがある（§2）。", "p3": "NVIDIAの公開のエージェント基盤NOOAで、モデルに文脈のAPIを渡す。モデルは自分の履歴を見て、ある範囲の出来事を要約に置き換え、保管された元の内容をタグで取り出せる（§2、図2）。比較相手は、予算の80%で基盤が古い履歴を要約する方式。モデル主導の側には使用量の表示と、85%に達してから圧縮を検討せよという指示を与える（§3）。", "p4": "文書調査のOfficeQA Pro v2（90問）と、機械学習の開発課題のMLE-bench Lite（22競技）で、文脈の予算を8K〜512Kトークンに変えて、4つのモデル（GPT-6.1 Sol、Kimi K3、DeepSeek V4 Pro、Claude Opus 5.5）を比べる。指標は得点と累積の入力トークン数（§3）。", "p5": "GPT-6.1 Solは32Kの予算のOfficeQA Pro v2で得点が21%から56%になった（抄録、図3）。利得は予算が厳しいほど大きい。APIを使う頻度はモデルで大きく違い、GPT・Kimi・DeepSeekは課題の42〜53%で使うのに、Opusは4%だった（図5）。時期の指示を外すと、Kimiの最初の圧縮は128Kの予算で約84%から29%の時点に早まった（§6、図8）。Kimi K3は32Kの予算で累積の入力が41%少なく（36M対62M）、得点は43%と41%だった（図9）。", "p6": "著者の挙げる限界は、ベンチマークが90問と22競技で小さいこと、予算を縮めて長い課題を模す代理の設定であること、4モデルの学習方法が分からずGPTの強さの説明は推測であること、KVキャッシュの再利用は1つの公開モデルと1つの推論エンジンでの試作で、前処理の計算量だけを測ったこと（§8）。", "fun": "長い作業をするAIは、やったことの記録がどんどん溜まり、やがて窓に収まらなくなります。ふつうは外の仕組みが自動で記録を要約しますが、大事な情報まで失われることがあります。そこで「いつ、どこを要約するか」をAI自身に任せてみました。すると記憶の枠が小さいときほど成績が上がりました。面白いのは、まだ余裕があるのに早々と記録をまとめてしまうAIがいたことで、著者はこれを「文脈の不安」と呼んでいます。", "unverified": "図3・図4の全モデル・全予算の数値と、KVキャッシュの再利用の実験（§7の後半）の詳細は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "工学", "headline": "材料の境界で剛性が落ちない多材料トポロジー最適化", "title": "Symmetric material interpolation scheme without artificial stiffness reduction at material interfaces for multimaterial topology optimization", "url": "https://doi.org/10.21203/rs.3.rs-11885576/v1", "authors": "Shun Ogawa ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Ogawa, S., & Suzuki, K. (2026). Symmetric material interpolation scheme without artificial stiffness reduction at material interfaces for multimaterial topology optimization. https://doi.org/10.21203/rs.3.rs-11885576/v1", "why": "複数の材料を使うトポロジー最適化で、設計変数を体積分率に写像してからフィルタをかけ、固体の量と組成に別々に射影をかける材料補間SCMIを提案した。すべての材料を同じ形の式で扱うので結果が材料の定義順に依存せず、材料の境界でのヤング率が両側の値の間に収まる。離散材料最適化と密度フィルタの組み合わせで生じる、境界での人為的な剛性の低下を避けられる。感度は随伴法で導き、差分で検証している。", "explain": {"basis": "本文", "basis_note": "Research Square版のPDFの本文（§3〜4の冒頭、§7.2、結論、図表のキャプション）を読んだ。§4.1〜4.4の式、§5の導出、§8〜9の結果は読んでいない", "preprint": true, "p1": "複数の材料を使い分ける構造のトポロジー最適化で、材料どうしの境界の剛性が数値パラメータのせいで人為的に下がる問題を、材料の補間のしかたを組み替えることで解消した（§4、§7）。", "p2": "複数材料の離散材料最適化（DMO）は、材料の定義順に結果が依存しない対称性を持つ。しかし密度フィルタと組み合わせると、材料で満たされた境界で重みの合計が1に届かず、ヤング率が両側のどちらの材料よりも低くなる。その低下の量はペナルティ指数やフィルタ半径という数値パラメータで決まり、設計者が指定できない（§3〜4、図1、§7.2）。", "p3": "提案するSCMI（solid–composition material interpolation）は、設計変数 → 体積分率への写像 → フィルタ → 固体量と組成に分けた射影 → ヤング率、の順に計算する（式16）。フィルタの前に体積分率に写像するので、境界でも重みの合計が1のまま保たれる。材料の混合には、ヤング率の非線形な混合則（べき平均）でペナルティをかける（§4）。", "p4": "随伴変数法で導いた感度を差分法と比べて確かめたうえで（§5〜6、図4）、まっすぐな材料境界でのヤング率の分布、引張棒と片持ち梁の最適化、3材料への適用を、DMOと比べる。見るのは、境界のヤング率が両側の値の間に収まるかと、材料の定義順を入れ替えても結果が変わらないか（§7〜9）。", "p5": "DMOでは境界のヤング率が両側の材料より低くなり、フィルタ半径が大きいほど、射影の鋭さのパラメータが小さいほど低い。SCMIでは、すべての条件で境界のヤング率が剛性の低いほうの材料以上で、両側の値の間に収まった（§7.2、図5〜6）。随伴変数法と差分法の感度の分布は全設計変数で一致した（図4）。", "p6": "限界を論じる節はない。解釈：検証はポアソン比が全材料で共通という設定の数値例に限られ（§3）、材料境界の強度や剥離といった実際の界面の力学は扱っていない。3次元の問題での計算費用は読んだ範囲では示されていない。査読中の原稿。", "fun": "「どこにどの材料を置けばよい構造になるか」を計算で決める技術があります。複数の材料を使うとき、従来の計算法には妙な癖がありました。2つの材料の境目で、どちらの材料よりも剛性の低い部分ができてしまうのです。しかもその低さは、材料の性質ではなく、計算のために決めた数値で変わっていました。この研究は、計算の手順を組み替えて、境目の剛性が両側の材料の間に収まるようにしました。", "unverified": "写像と射影の式の詳細（§4.1〜4.3）、片持ち梁と3材料の最適化結果（§9）は確認していない。PDFからの抽出で一部の文字が欠けている。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "映像を見ないタイマーが作業支援の指標で最高点", "title": "Speak When You See It: Proactive Task Assistants Should Wait for Evidence, Not the Clock", "url": "https://arxiv.org/abs/2611.30895", "authors": "Bohe Chen", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Chen, B. (2026). Speak When You See It: Proactive Task Assistants Should Wait for Evidence, Not the Clock (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30895", "why": "作業を見守って助言する支援AIの2つのベンチマークで、映像を一切見ずに25秒で警告し30秒で完了とみなすタイマーが、誤りの検出F1で0.373を取り、公表済みのどの結果（最大0.27）も上回ることを示した。経過時間だけで達成できる限界を「映像を見ない前線」として定式化し、同じ録画の同じ経過時間から正例と負例を対にして学習させる方法で、20億パラメータのモデルがこの前線を越えた。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§3、§4、§5の冒頭、§7、図のキャプション）を読んだ。§6と補足資料は読んでいない", "preprint": true, "p1": "作業を見守って助言する支援AIの評価で、映像を見ずに経過時間などだけで判断する方策がどこまで点を取れるかを「映像を見ない前線」として定め、既存の成績がその内側にあることを示したうえで、前線を越える学習法を提案した（§3〜5）。", "p2": "作業支援のAIは、数秒ごとに「手順が終わったか」「間違いが起きたか」を判断する。この課題のベンチマークが、映像の中身を見る力を測っているのか、いつ言うかを当てる力を測っているのかは確かめられていなかった（抄録）。", "p3": "映像を見ない方策（手順の開始からの経過時間、手順の番号、指示文、学習データの統計だけを使う）を、固定の遅延や典型的な所要時間の倍数、学習した方策などで多数作り、公式の採点器にかけて、完了の正解率と誤り検出のF1の上側の凸包を前線とする（§3）。提案する証拠対照学習（ECT）は、正例に対し、同じ録画の別の手順から同じ経過時間の負例を対にする。対の中では経過時間が同じなので、時間だけを見る方策は両方に同じ答えを出すしかない（§4、図1）。", "p4": "調理の2つのベンチマーク（QICDとEgo-MC-Bench）の手順ごとの手続きで評価する。公表済みの18の結果と、自ら走らせた12のゼロショットのモデルを前線と比べ、ECT（Qwen3-VL-2Bを209本の動画で約15GPU時間微調整）を4つの種で評価する。前線からの差が正なら、時間だけでは届かない成績である（§3、§5）。", "p5": "25秒で警告し30秒で完了とみなすだけの規則が、Ego-MC-Benchで誤り検出のF1 0.373を取り、報告済みのどの結果（最大0.27）も上回った。公表済みの18結果はすべて前線の内側で、12のゼロショットのモデルもQICDで内側だった（§3、図2）。ECTは4つの種すべてで両方の前線を越え、学習に使っていないEgo-MC-Benchで完了の正解率59.0±5.7、F1 0.246±0.034だった（§5）。", "p6": "著者の挙げる限界は、対象が調理と2つのベンチマークに限られること、同じ録画の前の手順の所要時間まで見る方策を許すとQICDでの差が−0.028〜+0.029に縮むこと、誤りの再現率が低い（Ego-MC-Benchで0.18）こと、手作業で確かめた25件の検出のうち注釈された誤りを言い当てたのは9件だったこと（§7）。", "fun": "料理の動画を見ながら「この手順は終わったね」「そこは間違いだよ」と声をかけるAIを、どう採点すればよいでしょうか。この研究は、動画を一切見ずに「25秒たったら警告、30秒たったら完了」と言うだけのタイマーを試しました。すると、誤りを見つける指標で、これまで報告されたどの結果よりも高い点が出ました。テストが「見る力」より「時間の見当」に点を与えていたのです。賢さを測るには、まず「何も見なくても取れる点」を知っておく必要があります。", "unverified": "表1の全数値、他のバックボーンでの結果、§6の分析と補足資料は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "人の動画1本を手本にロボットが未知の作業をこなす", "title": "Entangle: Scaling Human-Video In-Context World-Action Models across Unseen Tasks and Contexts", "url": "https://arxiv.org/abs/2611.28732", "authors": "Chendong Xiang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Xiang, C., Zhang, C., Zhao, R., Wang, Z., Huang, S., Cui, R., Zhao, M., Bao, F., Tan, H., & Zhu, J. (2026). Entangle: Scaling Human-Video In-Context World-Action Models across Unseen Tasks and Contexts (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.28732", "why": "人が作業する動画1本を手本として、追加の学習なしにロボットが未知の作業を行う世界・行動モデルEntangleを提案した。ロボットの記録動画を動画変換で人の動画に直して時間のそろった学習データを増やし、同じ作業の別の実行と区別させる対照学習で、作業名だけに頼る近道を防ぐ。実機の未知の6作業で平均83.5点、RoboTwinの未知の7作業で成功率69.5%を得て、比較手法を22.6ポイント上回った。Hugging Faceで投票数34。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§3.1、§4.3、§5.2〜5.5、§6、図のキャプション）を読んだ。§4.1〜4.2と付録は読んでいない", "preprint": true, "p1": "人が作業する動画1本を手本として与えるだけで、学習していない作業をロボットが実行できる世界・行動モデルEntangleを作り、手本と時間のそろった学習データを増やすほど成績が上がることを示した（§5.3、§5.5）。", "p2": "文脈内学習（in-context learning）は、パラメータを更新せずに文脈から未知の課題をこなす。ロボットでは人の動画がその文脈になるが、2つの壁があった。作業の単位でしか対応していない人とロボットの対は、ロボットの行動と時間がそろっていない。また通常の行動の損失では、方策が手本を追わずに、最初の場面や作業の種類という近道に頼れてしまう（抄録）。", "p3": "入力は人の動画1本と現在のロボットの観測、出力は将来の映像と実行できる行動。記録済みのロボットの軌跡を基準に、視点・物体・出来事の順序とタイミングまで一致する人の動画を対にする「厳密な対」を、実際の撮影と動画生成で作る（§3.1、図2）。学習では、同じ作業の別の軌跡と区別させる対照損失（InfoNCE）を加え、作業の種類だけで行動を決める近道を防ぐ（§4.3）。", "p4": "データは21.3k対（実物5.3k、合成16.0k、635作業）。シミュレータRoboTwinの学習から外した7作業（3つの種、各100回）と、実機Astribot S1の未学習の6作業（積み木、マウスの操作、タオル絞り、掃き掃除、障害物回避など）で評価し、手本を使わない基準や既存手法と比べる（§3.1、§5.2〜5.3）。", "p5": "RoboTwinの7作業で成功率69.52%、Zero-WAMの46.95%を22.57ポイント上回った。3つの積み木を積む作業ではZero-WAMの9.00%に対し70.33%（§5.2、表1）。手本の動画を使わない基準は全体で46.19%、積み木では2.33%に落ちた（§5.4）。実機では、時間のそろったデータを10%から100%に増やすと平均点が40.8から83.5に単調に上がった（§5.5、図5）。", "p6": "著者の挙げる限界は、実機の評価が1種類のロボットに限られること、データの作成が生成した人の動画の忠実さに依存すること、場面をまたぐ転移と生成動画を手本にした運用は定性的な事例にとどまること（§6）。", "fun": "人に何かを教えるとき、やって見せるのが早いことがあります。ロボットにも、人がやっている動画を1本見せるだけで、練習したことのない作業をさせられないか。この研究はそれに挑みました。工夫は教材の作り方にあります。ロボットが動いた記録を先に用意し、それと出来事のタイミングまで合う「人がやっている動画」を対にしたのです。こうした対のデータを増やすほど、未知の作業の成績が上がりました。", "unverified": "表1・表2の全数値、場面の違う手本での評価（§5.6）の詳細、付録の課題の定義は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "失敗の場面を学ばせてロボットの世界モデルを直す", "title": "Beyond the Happy Path: Generalizing Robot World Models from Simulated Failures", "url": "https://arxiv.org/abs/2611.33925", "authors": "Zhiyue Zhao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26",
