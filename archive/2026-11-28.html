 "apa": "Zhao, Z., Liu, M., Zhang, B., Li, L., Huang, G., Zhao, C., Shi, J., Zhang, H., Chen, H., & Shen, C. (2026). Beyond the Happy Path: Generalizing Robot World Models from Simulated Failures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33925", "why": "ロボットの世界モデルは成功例ばかりで学習しているため、つかみ損ねや滑りの場面では予測が崩れることを、5つの事前学習済みモデルで示した（物体の動きの誤差は、最初の画像を写すだけの基準より最大でも10.4%しか低くない）。つかむ位置・向き・閉じるタイミングをずらした6.2万件のシミュレーション軌跡で、接触領域と表面の対応を学ばせると、物体の軌跡の誤差が全体で28.2%、未知の物体で35.0%減った。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§3.2、§4.2、抄録）を読んだ。§3.3の式、§5の分析と付録は読んでいない", "preprint": true, "p1": "成功例ばかりで学習したロボットの世界モデルが、つかみ損ねや滑りといった失敗の場面で予測を外すことを示し、つかみ方を系統的にずらしたシミュレーションのデータと物理の教師信号で、物体の動きの予測を改善した（§4.2）。", "p2": "ロボットの世界モデル（行動を与えると先の映像を予測するモデル）は方策の評価や計画に使われ始めたが、学習データは成功した実演に偏る。つかむ位置やタイミングがずれて物体が押されたり傾いたり滑ったりする場面では予測が崩れる。5つの事前学習済みモデルで、物体の動きの誤差は、最初のフレームを写すだけの基準より最大でも10.4%低いだけで、2つは基準より悪い（抄録）。", "p3": "シミュレーションで成功する基準のつかみ方を作り、手先の位置・向き・グリッパを閉じるタイミングをずらして、その結果の成功と失敗を、映像・ロボットの動き・物理状態とともに記録する（§3.2.1）。この正解から2つの学習信号を作る。1つは、全体の損失では軽く扱われる小さな物体と接触の領域に再構成を集中させるもの、もう1つは、同じ物理的な表面の点をフレームをまたいで追えるように特徴を学習させるもの（抄録）。", "p4": "データは62,425軌跡・106種の物体で、シミュレーションの62,125軌跡のうち13,577が失敗に関わり、実物の失敗は300軌跡。事前学習のまま、このデータでの追加学習、物理の教師信号つきの提案手法の3条件を、物体の軌跡の誤差（ADE）や映像のPSNRで比べる（§3.2.1、§4.2、表1）。", "p5": "Cosmos3 Nanoで、提案手法は物体のADEを事前学習に比べ28.2%、同じデータと予算の追加学習に比べ4.4%下げ、PSNRは3.27dB上がった（§4.2、表1）。未知の物体ではADEが35.0%下がり、2つの行動の結果がどう分かれるかの予測の誤差は43.3%下がった（抄録）。失敗を含むデータでの追加学習だけでも、ADEはCosmos3 Nanoで24.9%、LingBot-VAで25.8%下がった（§4.2）。", "p6": "限界を論じる節は確認できなかった。解釈：改善の多く（24.9%）は失敗を含むデータそのものから来ており、物理の教師信号の上乗せは4.4%と小さい。データはつかむ動作の摂動で作られ、実物の失敗は300軌跡・10物体にとどまる。", "fun": "ロボットが「こう動いたら次に何が起きるか」を予測するAIがあります。ところがこのAIは、うまくいった場面ばかりで学習しているので、つかみ損ねて物が押されたり滑ったりする場面の続きをうまく予測できません。この研究は、つかむ位置や向き、タイミングをわざとずらした軌跡をシミュレーションで大量に作りました。それを学ばせるだけで、物の動きの予測の誤差が24.9%減りました。うまくいく例だけでなく、失敗の例も教える必要があるのです。", "unverified": "表1の全数値、分析（§5）の詳細、実物の失敗動画での結果の数値は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "評価なしで自己改良するコーディングエージェント", "title": "Evaluation-Free Recursive Self-Improvement for Coding Agents", "url": "https://arxiv.org/abs/2611.21056", "authors": "Zhe Ren ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Ren, Z., Rong, G., Chen, Y., Li, N., Piękos, P., Ostaszewski, M., Guo, D., & Schmidhuber, J. (2026). Evaluation-Free Recursive Self-Improvement for Coding Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21056", "why": "自分の実装を書き換えて改良していくコーディングエージェントで、改良の途中に下流課題での評価を使わない方法ELITEを提案した。各世代で同じ親から多様な改良を独立に実装し、できたプログラムを見比べて、補い合う仕組みだけを1つの子孫にまとめ直す。構造と動作の妥当性の決定的な検査だけを使い、SWE-bench Proで初期の60.0%から85.6%に改良した（評価を使う既存手法は86.7%）。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§4、§5.1〜5.2、抄録）を読んだ。§5.3〜5.4と付録は読んでいない", "preprint": true, "p1": "自分のコードを書き換えて改良していくコーディングエージェントを、改良の途中で下流の課題を解かせて評価することなく進化させる方法ELITEを示した（§4）。", "p2": "自己改良するコーディングエージェントは、変更した候補を下流の課題で試し、その結果でどの候補や系統を進化させ続けるかを決めるのが一般的である。この方式は、探索を広げるほど評価の費用が増え、固定の評価の分布への最適化が続くとベンチマークに特化した適応を招くおそれがある（抄録）。", "p3": "各世代で、現在のエージェントの限界にもとづく複数の改良の仮説を作り、同じ親からそれぞれ独立に実装する（探索）。次に、できた実装を見比べ、補い合う・重複する・衝突する・複雑すぎる・未完成の5つの観点で仕組みを判断し、両立する部分だけを1つの子孫として実装し直す（統合、§4.1〜4.2、式4）。使うのは構造と動作の妥当性の決定的な検査だけで、候補の課題での成績は見ない（§4）。", "p4": "SWE-bench Proの固定の60課題で進化を比べ、進化後のエージェントを固定してSWE-bench VerifiedとPolyglotに転移させる。比較相手は、Proでの成績を進化の手がかりに使うDGMとHGM。モデルはDeepSeek-V4-FlashとQwen-3.7-Plusで、DeepSeekは各手法3回の独立した進化を行う（§5.1）。", "p5": "DeepSeek-V4-Flashで、ELITEはProの成績を60.0%から85.6%に上げた。DGMの86.7%、HGMの88.3%をわずかに下回るが、進化に使っていないVerifiedで73.3%、Polyglotで69.3%を得て、転移では上回った（表1）。Qwen-3.7-PlusではProで45.6%（DGM 50.0%、HGM 48.3%）と差が広がる一方、Verified 56.7%、Polyglot 61.3%と転移は良かった（§5.2）。", "p6": "解釈：進化に使った課題そのものでは、評価を使う手法に届かない。Qwenの比較相手は1回の実行だけで、進化の比較は60課題の部分集合によるため、差の確かさには限りがある。著者が限界を述べた箇所（付録）は読んでいない。", "fun": "自分で自分のプログラムを書き換えて改良していくAIがあります。ふつうは、書き換えるたびに課題を解かせて、成績のよいものを残します。でもそれでは、その課題にだけ合わせた改良になるおそれがあります。この研究は、途中で課題の成績を一切使わず、いろいろな改良案を実装しては「両立するものを組み合わせる」ことで進化させました。進化に使った課題での成績はわずかに下回りましたが、別のベンチマークへの転移ではこちらが上回りました。", "unverified": "表1の全数値、付録の独立した実行ごとの結果、著者の挙げる限界の節は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "オペレーションズ・リサーチ", "headline": "森林保全策が木材供給に与える影響を最適化で試算", "title": "Forest sector implications of environmental measures: a study using a spatially explicit simulation-optimization approach in Norway", "url": "https://doi.org/10.31235/osf.io/mx9kt", "authors": "Lucas Lopez ほか", "venue": "SocArXiv", "date": "2026-11-27", "apa": "Lopez, L., Sjølie, H. K., & Hansen, E. H. (2026). Forest sector implications of environmental measures: a study using a spatially explicit simulation-optimization approach in Norway. https://doi.org/10.31235/osf.io/mx9kt", "why": "ノルウェーのインランド県（全国の木材伐採の41%）を対象に、森林の成長のシミュレーションと、輸送・産業を含む最適化を2段でつないだ空間的に明示的なモデルを作り、原生に近い森林をすべて保全する案と、可能な面積の30%を択伐にする案を基準と比べた。どちらも最初の10〜15年は木材の供給が減ると報告する。環境対策の産業への影響を、地点ごとのデータから積み上げて試算した。", "explain": {"basis": "本文", "basis_note": "OSF版のPDFの本文（抄録、結果§3〜3.2、考察の前半、結論、図のキャプション）を読んだ。方法§2の詳細と生物多様性の結果§3.3は読んでいない", "preprint": true, "p1": "森林の保全策が木材の供給と産業にいつ・どこで・どれだけ響くかを、森林の成長の計算と、輸送や製材所まで含めた最適化をつないで試算できる、空間的に明示的なモデルを作った（抄録、結論）。", "p2": "林業には、伐採が生物多様性などに与える悪影響を減らす管理を求める社会的な圧力が強まっている。しかし提案されている対策が産業に与える影響と、生物多様性を守る効果について、知見が不足している（抄録）。", "p3": "2段の手順。まず、森林調査の区画ごとに複数の管理案のもとでの成長と収穫を計算し、16m×16mの全域データを使って景観全体に広げる（各画素は、同じ森林属性を持つ最も近い区画の計算結果を引き継ぐ）。画素を185haのセルにまとめて物流の費用を加え、その出力を、作業と輸送の費用、産業と丸太の輸出のデータを含む最適化モデルに入れる（抄録、図1、結論）。", "p4": "対象はノルウェーのインランド県（全国の木材伐採の41%、製材の40%）。現状維持の基準に対し、原生に近い森林をすべて保全する案と、可能な面積の30%で連続被覆林業（皆伐しない管理）を行う案を比べ、2025〜2045年の伐採量、製材の生産、丸太の輸出、蓄積、生物多様性の指標の推移を見る（抄録、§3）。", "p5": "基準の伐採量は年約5.3百万m3で一定。2つの案では最初の10年に3.15百万m3（基準より約40%減）に落ち、保全の案は2035年、連続被覆の案は2040年までに基準の近くに戻る（図5）。製材の生産はすべての案で年約1.1百万m3で変わらない（§3.1）。丸太の輸出は上限の2 634 000 m3から約512 000 m3へ、約80%減った（§3.2、図7）。蓄積はどの案でも増えた（図9）。", "p6": "著者は、撹乱や気候変動、より多くの生物多様性の指標や他の生態系サービスを今後の拡張として挙げる（結論）。製材が変わらないのは、最適化が価値の高い製材用の丸太を先に製材所に割り当てるためで、輸出が緩衝になった（考察）。解釈：結果は費用最小化の割り当てという仮定に依存し、所有者や企業の実際の行動は扱っていない。未査読。", "fun": "森を守るために伐採を制限すると、木材が足りなくなって製材所が困るのでしょうか。この研究は、ノルウェーの一つの県の森を細かいマス目で表し、木の成長と、どこからどこへ運ぶかまで計算しました。伐採量は最初の10年に約40%減りますが、製材の生産は変わりませんでした。減った分のほとんどを、県外への丸太の輸出の減少（約80%減）が吸収したからです。影響は移行期に集中し、その後は元の水準に近づきます。", "unverified": "最適化モデルの定式化（§2.7）、生物多様性の指標の結果の数値（§3.3、図8）は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "調査エージェントを知識の広さと深さで採点", "title": "DRBench Pro: A Knowledge-Centric Benchmark for Professional Deep Research Agents", "url": "https://arxiv.org/abs/2611.34852", "authors": "Han Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-27", "apa": "Huang, H., Yan, Y., Wu, X., Li, Y., Deng, C., Liu, J., Ma, J., & Shen, Y. (2026). DRBench Pro: A Knowledge-Centric Benchmark for Professional Deep Research Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34852", "why": "調査エージェントの報告書を、どの研究の方向を取り上げ、どこまで掘り下げたかという知識の網羅で採点するベンチマーク。Wikipediaから知識の木を作り、その関係ごとに採点基準を自動で生成する（24分野144件、採点基準44,102個）。幅と深さの幾何平均を総合点とし、16のエージェントを評価したところ、最良でも網羅は57.04%にとどまった。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§3.1〜3.4の冒頭、抄録）を読んだ。§4の結果の表と付録は読んでいない", "preprint": true, "p1": "調べものをして報告書を書く「深い調査」エージェントを、報告書が扱うべき知識をどれだけ広く・深く網羅したかで採点するベンチマークDRBench Proを作った（§3）。", "p2": "深い調査エージェントは、複数の情報源から情報を集めて報告書にまとめる。既存のベンチマークは報告書の質を複数の観点で評価するが、どの調査の方向を取り上げ、どこまで掘り下げたかという知識の網羅を専門に測るものがなかった（抄録）。", "p3": "Wikipediaのリンクから、24分野×2つの根の項目について、3ホップまでの知識の木を作る（48本、§3.1）。各木から根と10本の枝を持つ部分を抜き出して1件の調査課題とし、LLMで調査の依頼文と、木の関係1本につき1つの採点基準を、ページの根拠だけから生成する（§3.2〜3.3）。エージェントには依頼文だけを渡す。判定は「満たす」だけを1とし、木の形を保ったまま、枝をまたぐ網羅（幅）と、関係の連なりに沿った網羅（深さ）に集計し、その幾何平均を総合とする（§3.4、抄録）。", "p4": "144件（24分野）、採点基準44,102個。16の深い調査エージェントを評価し、採点基準の判定と人の注釈の一致、指標の設定を変えたときの順位の安定を確かめる（抄録、§4）。", "p5": "エージェントによって幅と深さの強みが異なり、最良のエージェントでも総合の網羅は57.04%だった。採点基準の判定は人の注釈とよく一致し、エージェントの順位は試した指標の設定の範囲で安定していた（抄録）。", "p6": "限界を論じる節はない。解釈：正解とする知識はWikipediaのリンクの構造とLLMによる選択で作られており、木に含まれない妥当な調査の方向は採点されない。「部分的に満たす」を0に数える二値化も結果に影響しうる（§3.4）。構築に使うモデルを変えた感度（§4.7）は読んでいない。", "fun": "調べものの報告書を採点するとき、「大事な話題をどれだけ取り上げ、どこまで掘り下げたか」を見たいことがあります。この研究は、百科事典のリンクをたどって、その話題に関わる知識のつながりを木の形にまとめ、AIの報告書がその木のどこまでを覆ったかを測りました。最も成績のよいAIでも、覆えたのは57.04%でした。広さに強いAIと、深さに強いAIがいることも分かりました。", "unverified": "16エージェントの個別の成績、人との一致の数値（§4.5）、指標と構築モデルの感度分析（§4.6〜4.7）は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "1つのDBでの正解判定は強化学習でごまかされる", "title": "Single-Database Rewards Are Hackable: Counterfactual Execution for Trustworthy Text-to-SQL RL", "url": "https://arxiv.org/abs/2611.34363", "authors": "Shreshth Rai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Rai, S., Singh, R. K., & Aggarwal, A. (2026). Single-Database Rewards Are Hackable: Counterfactual Execution for Trustworthy Text-to-SQL RL (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34363", "why": "文章からSQLを書くエージェントの強化学習で、1つのデータベースでの結果の一致を報酬にすると、誤った問い合わせが偶然一致して報酬を得ることを示した。コードで生成した隠しデータベースでも実行し、すべて一致したときだけ報酬を出す方式では、誤った問い合わせが満額を得る割合が29.5%から16.8%に、報酬のごまかしが54.1%から1.9%に減った。一方、この報酬での学習は精度を明確には上げず、種を変えると符号が逆転することも報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文（§2〜5、抄録）を読んだ。付録は読んでいない", "preprint": true, "p1": "文章からSQLを書くエージェントの強化学習で使われる「1つのデータベースで結果が合えば報酬」という決め方が、誤った問い合わせにも報酬を出すことを示し、隠しコピーのデータベースでも実行して確かめる報酬の効果と限界を測った（§2〜4）。", "p2": "文章からSQLへの強化学習では、問い合わせの結果が1つのデータベースで正解と一致すれば報酬を出す。しかし、不具合を露わにする行がデータにないと、誤った問い合わせが偶然一致して報酬を得る。答えの値を直接書き込むような抜け道も通る（抄録、§2）。", "p3": "元のデータベースに加え、コードで生成した隠しコピーでも最終の問い合わせを実行する。厳密な形は、すべてのコピーで正解と一致したときだけ報酬を出し、平均の形は一致した割合で出す（式1）。コピーは、問いが読む部分に1つの規則的な編集を加えて作る。答えが変わる編集は値の書き込みを破り、答えを変えない編集は、重複・結合の膨らみ・フィルタの抜けなどの不具合の型を露わにする行を足す（§2）。", "p4": "合成の小売のデータベース（8表）で、事前の監査として、正しい問い合わせ2,847件、現実的な不具合の変種1,814件、作為的な抜け道2,839件を採点し、誤って満額を出す率と、正しいものを退ける率を測る。続いて3.35Bのモデルを、2つの報酬で3つの種ずつGRPOで学習して比べる（§2〜3）。", "p5": "1つのデータベースだけの報酬は、不具合の変種の29.5%と抜け道の54.1%に満額を出した。無作為に選んだコピーを加えると16.8%と1.9%に下がり、正しい問い合わせ2,847件は1件も退けなかった（§4）。ただし学習の成果は上がらず、検証済みの正解率は平均の形で8.4%、単一データベースで11.7%だった。2つの報酬が食い違ったのは実行の約5〜7%だけだった。Spiderでは1.6ポイント高いが、種によって符号が変わる（§4）。", "p6": "著者の挙げる限界は、合成のスキーマ1つ、3つの種、60ステップのGRPO、3.35Bのモデル1つ、英語のみ、人による攻撃の検証なし。Spiderは基盤モデルの事前学習データに含まれうる。テスト用のコピーは不具合の変種103件のうち54件しか捕まえず、検証済みの正解率は甘い（§5）。", "fun": "AIを報酬で鍛えるとき、正解の判定が甘いと、AIは「たまたま合う答え」でも報酬を得てしまいます。データベースへの問い合わせを書くAIでは、1つのデータで結果が合えば正解としていました。でも、誤った問い合わせでも、それを見破る行がデータになければ正解に見えます。そこで中身を少し変えた別のデータでも試すと、作為的なごまかしのほとんどが見抜けました。ただ、それで学習の成果が上がったわけではなかったことも、著者はそのまま報告しています。", "unverified": "表1の全数値、付録の不具合と抜け道の例、コピーの生成規則の詳細は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "工学", "headline": "廃タイヤのゴムを重ねた免震支承を振動台で試す", "title": "Mechanical Behavior of Laminated Recycled Tyre Rubber Isolators and Their Effect on the Dynamic Response of a Steel Structure", "url": "https://doi.org/10.21203/rs.3.rs-11867551/v1", "authors": "Syed Abbas Gillani ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Gillani, S. A., Alam, A. I., Haider, M. A., & Ali, M. (2026). Mechanical Behavior of Laminated Recycled Tyre Rubber Isolators and Their Effect on the Dynamic Response of a Steel Structure. https://doi.org/10.21203/rs.3.rs-11867551/v1", "why": "廃タイヤのゴム22層を重ねた、鋼板も鉛プラグも使わない免震支承の力学特性を、圧縮と水平の載荷で調べ、1/20模型の鋼骨組で振動台実験まで行った。免震した骨組の水平剛性は63.8%下がり、固有周期は0.13秒から0.31秒に伸び、調和加振での応答加速度は約30%、ベースシアは約29.6%減った。等価粘性減衰は約5.6%から約14%に増えた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "廃タイヤのゴムを重ねただけの、鋼板も鉛プラグも使わない免震支承が、小型の鋼骨組の揺れをある程度減らせることを実験で示した（抄録）。", "p3": "厚さ1mmのゴム22層の縮小した支承を圧縮と水平の載荷で試験し、1層1スパンの1/20模型の鋼骨組に付けて、静的な水平載荷・自由振動・衝撃・振動台の試験を行った（抄録）。", "p5": "支承の鉛直剛性は0.391kN/mm、有効水平剛性は0.891N/mm。免震した骨組は水平剛性が63.8%下がり、固有周期が0.13秒から0.31秒に伸びた。調和加振で応答加速度が約30%、ベースシアが約29.6%減り、等価粘性減衰は約5.6%から約14%に増えた（抄録）。", "fun": "免震の建物は、地面と建物の間にやわらかいゴムの支承をはさんで、揺れをゆっくりにして力を逃がします。ただし専用のゴムは高価です。この研究は、捨てられるタイヤのゴムを22枚重ねただけの支承で、模型の建物の揺れの周期を0.13秒から0.31秒に伸ばし、加速度を約3割減らしました。やわらかいばねに載せたおもりほどゆっくり揺れるのと同じ理屈です。", "unverified": "実大での検証と繰り返しせん断の特性は今後の課題と著者が述べており、未確認。振動台の入力波の詳細は抄録に記載がない。"}}, {"id": "pn17", "rank": 17, "field": "工学", "headline": "粘弾性地盤に載る傾斜機能梁の自由振動を解析的に解く", "title": "Dynamic Behavior of Functionally Graded Beams Supported by Three-Parameter Viscoelastic Foundations", "url": "https://doi.org/10.21203/rs.3.rs-11822020/v1", "authors": "Khayra Draouche ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Draouche, K., Yahia, S. A., Hadji, L., Zouatnia, N., Atmane, H. A., Madan, R., & Bennai, R. (2026). Dynamic Behavior of Functionally Graded Beams Supported by Three-Parameter Viscoelastic Foundations. https://doi.org/10.21203/rs.3.rs-11822020/v1", "why": "厚さ方向に材料特性が連続的に変わる傾斜機能梁が、ばね・せん断層・減衰の3つのパラメータで表す粘弾性地盤に載る場合の自由振動を、せん断補正係数を使わない2つの高次せん断変形理論で解いた。ハミルトンの原理から支配方程式を導き、ナビエ法で解析解を得て、材料の勾配・細長比・地盤の剛性と減衰が固有振動数に与える影響を調べている。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "厚さ方向に材料が連続的に変わる梁が、ばねと減衰を持つ地盤に載るときの固有振動数を、せん断補正係数なしで解析的に求められるようにした（抄録）。", "p3": "横せん断ひずみが厚さ方向に正弦状・放物線状に分布すると置く2つの高次せん断変形理論を使い、上下面でせん断応力がゼロになる条件を満たす。地盤はウィンクラーとパステルナークの係数に減衰係数を加えて表し、ハミルトンの原理とナビエ法で解く（抄録）。", "p5": "提案したモデルの精度を既存の解と比べて確かめ、材料の勾配、細長比、地盤の剛性、せん断の相互作用、減衰が固有振動数に与える影響をパラメータ解析で調べた（抄録）。具体的な数値は抄録に記載がない。", "fun": "梁を弾くと決まった速さで震えますが、その速さ（固有振動数）は、梁の材質だけでなく、下で支える地盤の硬さや粘りでも変わります。この研究は、表と裏で材質が少しずつ変わる特殊な梁が、やわらかく粘る地盤に載った場合の震え方を、数式で解いています。式で答えが出ると、条件を変えたときの傾向を見通しやすくなります。", "unverified": "固有振動数の値、既存解との誤差、パラメータの影響の向きは抄録に記載がなく未確認。"}}, {"id": "pn18", "rank": 18, "field": "工学", "headline": "埋め込みCFRPで損傷したスラブの押し抜き耐力を回復", "title": "Punching Shear Behavior of Pre-Loaded RC Flat Slabs Strengthened by Embedded CFRP Strips and Ropes", "url": "https://doi.org/10.21203/rs.3.rs-11744279/v1", "authors": "Amjad B. Shehadeh ほか", "venue": "Research Square (In Review)", "date": "2026-11-27", "apa": "Shehadeh, A. B., Barham, W. S., Obaidat, Y. T., & Obeidat, R. B. (2026). Punching Shear Behavior of Pre-Loaded RC Flat Slabs Strengthened by Embedded CFRP Strips and Ropes. https://doi.org/10.21203/rs.3.rs-11744279/v1", "why": "使用中の損傷を模して終局荷重の50%まで予荷重をかけたRCフラットスラブを、断面を貫いて埋め込むCFRPの帯とロープで補修し、押し抜きせん断の挙動を9体の試験体で調べた。CFRPの種類・傾き・位置を変え、鉛直のロープを両方の押し抜き周長に沿って配置した場合に終局耐力が64.8%増えたと報告する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたResearch Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "使用中に傷んだ鉄筋コンクリートの平らな床（フラットスラブ）に、炭素繊維（CFRP）の帯やロープを断面を貫いて埋め込むと、柱の周りが抜け落ちる押し抜きせん断への耐力を高められることを示した（抄録）。", "p3": "1000×1000×120mmの正方形のスラブ9体を作り、1体を無傷の基準とし、残る8体は基準の終局荷重の50%まで予荷重をかけてから、CFRPの種類・傾き・補修位置を変えて補修し、点載荷で終局耐力・剛性・破壊形式を調べた（抄録）。", "p5": "終局耐力は、鉛直のCFRPロープを両方の押し抜き周長に配した場合に最大の64.8%増、剛性は第1周長だけに配した場合に最大の16.2%増だった。補修で破壊形式は局所的な押し抜きから曲げ・CFRP由来の破壊に変わった。無傷のスラブへの同じ補強（77.4%増）と比べ、予荷重は耐力の伸びを減らした（抄録）。", "fun": "柱だけで支える平らな床は、柱の周りの床が「打ち抜かれる」ように突然壊れることがあり、もろい壊れ方なので危険です。この研究は、すでに半分の力をかけて傷めた床に、炭素繊維のロープを床を貫くように通して補修しました。すると耐えられる力が最大で64.8%増え、壊れ方も局所的な打ち抜きから、曲げによる壊れ方に変わりました。", "unverified": "コンクリート強度や配筋の詳細、各試験体の数値の一覧は抄録に記載がなく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "損傷ラベルなしで橋の疲労損傷の進展を追う", "title": "Fatigue damage detection and growth monitoring for the bridge using deep learning", "url": "https://doi.org/10.1142/s021945542741015x", "authors": "Hongshuo Sun ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-27", "sjr": 0.703, "citescore": 6.5, "citescore_year": "2025", "apa": "Sun, H., Xiang, Y., Li, Z., Song, L., & Ni, Y. (2026). Fatigue damage detection and growth monitoring for the bridge using deep learning. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s021945542741015x", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "損傷のラベルつきデータを用意しなくても、橋の疲労損傷を検知し、その進展を追える枠組みを示した（抄録）。", "p2": "疲労損傷は橋の安全を左右する主要な監視対象だが、進展を監視するには、損傷の程度と応答の関係を実験か有限要素解析で先に作る必要があり、監視の費用を押し上げていた（抄録）。", "p3": "橋が健全なうちに、監視点の傾斜かたわみの応答を入力とし、部分最小二乗回帰（PLSR）で求めた節点荷重をラベルとして、畳み込みニューラルネットワーク（CNN）を学習させる。損傷すると、同じ荷重でもPLSRが求める節点荷重の大きさが変わり、その変化は損傷の程度にほぼ比例する。そこでCNNの推定とPLSRの値のずれの変化を損傷の手がかりにする。検知と位置特定のための2つの方策と、指標を損傷の程度にほぼ比例させる二次の前処理も示す（抄録）。", "p4": "損傷の程度の異なる橋のシミュレーションと、鉄筋コンクリート梁の疲労試験で有効性を確かめる。少数のセンサで、車両荷重が未知でも検知と進展の監視ができるかが評価の観点（抄録）。", "p5": "提案の枠組みは、少数のセンサと未知の車両荷重のもとで、橋の疲労損傷の検知と進展の監視を実現できると報告する。損傷の指標は損傷の程度にほぼ比例する（抄録）。検知の精度や誤差の数値は抄録に記載がなく未確認。", "p6": "抄録には限界の記載がない。解釈：健全時のデータで学習するため、環境の変動による応答の変化を損傷と区別できるかが実用上の論点になる。検証はシミュレーションと梁の試験で、実橋での結果は抄録からは確認できない。", "fun": "橋の傷みを見つける仕組みを作るには、ふつう「傷みの程度と橋の応答の関係」を実験や計算で先に用意する必要があり、それが費用を押し上げます。この研究の工夫は、健全なうちに「橋の応答から、かかっている荷重を当てる」ことをAIに学ばせておくことです。橋が傷むと、AIの見立てと別の計算の結果のずれが変わってきます。その変化を、傷みの進み具合の物差しにするのです。", "unverified": "本文を入手できず、CNNの構成、センサの数と配置、検知と進展監視の精度、実験の諸元は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "磁気浮上車両と軌道桁の連成振動を周波数追従で抑える", "title": "An adaptive notch filter based on real-time gradient descent frequency estimation for maglev vehicle-guideway vibration suppression", "url": "https://doi.org/10.1177/10775463261506900", "authors": "Yuguang Tian ほか", "venue": "Journal of Vibration and Control", "date": "2026-11-25", "sjr": 0.588, "citescore": 6.1, "citescore_year": "2025", "apa": "Tian, Y., Huang, C., Wang, Z., & Long, Z. (2026). An adaptive notch filter based on real-time gradient descent frequency estimation for maglev vehicle-guideway vibration suppression. Journal of Vibration and Control. https://doi.org/10.1177/10775463261506900", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "磁気浮上列車の車両と軌道桁の連成による自励振動を、振動の主な周波数をその場で推定してノッチフィルタを合わせ続けることで抑える制御法を示した（抄録）。", "p2": "磁気浮上列車では、車両と軌道桁（ガイドウェイ）の連成振動が乗り心地と運行の安定を大きく損ない、制御系の課題になっている。とくに制御ループ内の正のフィードバックに由来することの多い自励振動が問題になる（抄録）。", "p3": "センサ信号から支配的な振動の周波数を、観測に基づくオンラインの推定で素早く求め、その値で2次のノッチフィルタ（特定の周波数の成分だけを弱めるフィルタ）の中心周波数を実時間で動かす。振動の激しさを数値で評価し、しきい値を超えたときだけフィルタのパラメータを更新する事象駆動の仕組みを加え、定常時に安定な周波数成分を誤って弱めないようにする（抄録）。", "p4": "磁気浮上車両と軌道桁の連成系の動的モデルでのシミュレーションと、複合の防振台での実験で検証する。比較相手はフィルタなしの場合（抄録）。", "p5": "フィルタなしに比べて振動を効果的に抑え、周波数が急に変わったときにも素早く追従したと報告する（抄録）。抑制の量や追従の速さの数値は抄録に記載がなく未確認。", "p6": "抄録には限界の記載がない。解釈：実験は防振台でのもので、実車と実際の軌道桁での検証は抄録からは確認できない。複数の周波数が同時に卓越する場合の扱いも不明。", "fun": "磁石の力で浮いて走る列車は、車両と、その下の軌道の桁が互いに揺らし合って、振動が育ってしまうことがあります。特定の周波数の振動だけを弱める「ノッチフィルタ」を使えば抑えられますが、やっかいなのは、その周波数が急に変わることがある点です。この研究は、いま起きている振動の周波数をセンサの信号から推定し続け、フィルタの狙いを合わせ直す方法を作りました。", "unverified": "本文を入手できず、周波数推定の式、収束の条件、実験の諸元と数値は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "構造モニタリングの領域適応を80報で系統的に整理", "title": "Domain adaptation in structural health monitoring of civil infrastructure: A systematic review", "url": "https://doi.org/10.1177/14759217261506926", "authors": "Yifeng Zhang ほか", "venue": "Structural Health Monitoring", "date": "2026-11-27", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Zhang, Y., & Liang, X. (2026). Domain adaptation in structural health monitoring of civil infrastructure: A systematic review. Structural Health Monitoring. https://doi.org/10.1177/14759217261506926", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "振動に基づく構造ヘルスモニタリング（SHM）で、ある構造や条件で学んだモデルを別の構造や条件へ移す「領域適応」の手法を、80本の査読論文から系統的に整理した（抄録）。", "p2": "データ駆動のモデルが土木構造物の評価を支えるようになったが、形状・材料・環境条件が違うと知識を移せないことが大きな障害として残っている（抄録）。", "p3": "領域適応（domain adaptation）を、損傷に関わる情報への感度を保ちながら、解析・実験室・現場の領域の間で特徴の分布をそろえる体系的な方法として捉える。統計的な整合、敵対的学習と部分領域の学習、物理を取り入れた適応、解析から実物への転移のための生成モデルに分けて、手法の変遷を分析する（抄録）。", "p4": "新しい実験ではなく、80本の査読つき研究の系統的な分析である。橋と建物への応用について、各手法の貢献と限界をまとめる（抄録）。", "p5": "領域適応は領域をまたぐ汎化を有望に改善してきたが、領域のずれの管理、データの不足、モデルの解釈しやすさ、複数の情報源や時間とともに変わる条件への適応が課題として残る。今後の方向として、物理的な制約を学習の目的に組み込むこと、物理と整合する生成の枠組み、解釈でき認証できる適応、複数源・生涯にわたる適応が挙がる（抄録）。", "p6": "総説であり、新しい定量的な結果はない。解釈：80本の選び方と検索の範囲、手法ごとの効果の大きさの比較は抄録からは分からない。", "fun": "計算や実験室のデータで「損傷の見分け方」を学んだAIは、現場の構造物でも使えるでしょうか。形や材料や環境の条件が違うと、学んだ知識をそのまま移せないことが、大きな壁になっています。このレビューは、その「ずれ」を埋める工夫を80本の研究から整理しました。計算で作ったデータと現場のデータの差をどう縮めるか、物理の知識をどう組み込むかが、これからの課題として挙げられています。", "unverified": "本文を入手できず、80本の内訳、分類ごとの件数、具体的な手法の比較表は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "多点の加速度計で不整形な建屋の揺れを立体的に捉える", "title": "Effects of Irregular Shapes and Differences in Structural Type on Building Response—Analysis of Vibration Characteristics Using a Multi‐Point Observation System for High Temperature Engineering Test Reactor", "url": "https://doi.org/10.1002/2475-8876.70121", "authors": "Koki Yamakawa ほか", "venue": "JAPAN ARCHITECTURAL REVIEW", "date": "2026-11-26", "sjr": 0.307, "citescore": 1.6, "citescore_year": "2025", "apa": "Yamakawa, K., Hiramatsu, M., Moritani, H., Iiba, M., & Nishida, A. (2026). Effects of Irregular Shapes and Differences in Structural Type on Building Response—Analysis of Vibration Characteristics Using a Multi‐Point Observation System for High Temperature Engineering Test Reactor. Japan Architectural Review, 9(1). https://doi.org/10.1002/2475-8876.70121", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "建物の各階に複数の加速度計を置く多点観測システムを作り、吹き抜けやセットバックのある不整形な建物の立体的な揺れ方を地震の記録から捉えられることを確かめた（抄録）。", "p2": "原子力発電所の建屋を対象に、各階に複数の加速度計を置く観測の仕組みを開発した。吹き抜けやセットバックのような不整形な形を持つ建物が地震でどう応答するかを、観測から捉えることが課題（抄録、題名）。", "p3": "各階に複数の加速度計を設置する多点観測システムを開発し、不整形な形を持つ建物の例として、高温工学試験研究炉（HTTR）に設置した。このシステムで得た地震の記録から、建物の振動特性を分析する（抄録）。", "p4": "評価の対象は、HTTRで観測された地震の記録。不整形な形に由来するとみられる応答特性が記録から読み取れるかを確かめる（抄録）。観測した地震の数や規模、比較した解析モデルは抄録に記載がなく未確認。", "p5": "地震の記録の分析から、建物の不整形な形に由来する可能性のある地震応答の特性が見いだされ、多点観測システムが不整形な建物の3次元的な挙動を捉えるのに有効だと確かめられた（抄録）。数値は抄録に記載がない。", "p6": "抄録には限界の記載がない。解釈：対象は1つの建物で、応答の特性を不整形な形に帰する根拠は抄録からは分からない。題名は構造種別の違いの影響にも触れるが、その内容は未確認。", "fun": "建物の中に大きな吹き抜けがあったり、上の階が引っ込んでいたりすると、地震のときの揺れ方は場所によって変わりえます。それを知るには、1つの階の何か所もで揺れを測る必要があります。この研究は、各階に複数の加速度計を置く仕組みを作り、実際の建物に取り付けて、地震の記録から建物が立体的にどう動いたかを読み取りました。形の不ぞろいが揺れ方に現れることを、観測で確かめようとした研究です。", "unverified": "本文を入手できず、センサの数と配置、観測した地震、見いだされた応答特性の具体的な中身は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "き裂の位置・長さ・向きを振動数と減衰比で見分ける", "title": "Crack characterisation and identification in multi-material 3D-printed polymeric sandwich plates using experimental modal analysis", "url": "https://doi.org/10.1177/10567895261506028", "authors": "Hilal Doğanay Katı ほか", "venue": "International Journal of Damage Mechanics", "date": "2026-11-26", "sjr": 0.921, "citescore": 8.5, "citescore_year": "2025", "apa": "Doğanay Katı, H., Pei, Y., He, F., & Khan, M. (2026). Crack characterisation and identification in multi-material 3D-printed polymeric sandwich plates using experimental modal analysis. International Journal of Damage Mechanics. https://doi.org/10.1177/10567895261506028", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "複数の材料を重ねた3Dプリントのサンドイッチ板で、き裂の長さ・向き・位置が固有振動数と減衰比にどう現れるかを実験で調べ、減衰比が振動数を補う損傷の手がかりになることを示した（抄録）。", "p2": "複数材料の高分子サンドイッチ板で、き裂の形状と界面の剛性が動的な応答にどう影響するかの理解は限られていた（抄録）。", "p3": "熱溶解積層法で作ったABSとPLAのサンドイッチ板に、長さ・向き・位置を変えたき裂を入れた30通りの試験体を、片持ちの境界条件で打撃試験にかけ、周波数応答関数から1〜3次の固有振動数と減衰比を取り出す実験モード解析（抄録）。", "p4": "要因計画による30通りの構成について、振動数と減衰比のき裂パラメータへの感度を調べ、教師ありの分類でき裂の位置・長さ・向きを当てられるかを交差検証で評価する（抄録）。", "p5": "固有振動数はき裂の長さとともに単調に下がり、双線形の代理モデルでよく表せる。減衰比はき裂の向きと位置に強い感度を示し、とくに中央と外側にある長い横向きに近いき裂で顕著だった。分類の交差検証の正解率は、位置で約87%、長さで約80%、向きで約75%（抄録）。", "p6": "著者は、界面の効果が現れる複数材料の構造では振動数だけに頼る方法は不十分かもしれないと述べる（抄録）。解釈：試験体は高分子の板で、片持ちの1つの境界条件に限られる。減衰比の推定のばらつきが分類にどう響くかは抄録からは分からない。", "fun": "物をたたいたときの振動は、傷があると変わります。この研究は、30通りの板に長さ・向き・場所の違う傷を入れて、たたいたときの振動を調べました。振動の速さ（固有振動数）は傷の長さとともに下がり、傷の大きさの目安になりました。一方、傷の向きや場所には、振動の収まりやすさ（減衰比）のほうが敏感でした。速さと収まり方の両方を見ると、傷の様子がより詳しく分かります。", "unverified": "本文を入手できず、試験体の寸法、分類の手法、減衰比の推定法とばらつきは未確認。"}}, {"id": "jr06", "rank": 6, "headline": "進化的粒子フィルタで66流域の流量予測を改善", "title": "Evolutionary Particle Filter Data Assimilation With a Complex Process‐Based Hydrologic Model for Enhancing Streamflow Prediction", "url": "https://doi.org/10.1029/2026wr043970", "authors": "Fatemeh Rezaei Aderyani ほか", "venue": "Water Resources Research", "date": "2026-11-27", "sjr": 1.778, "citescore": 9.2, "citescore_year": "2025", "apa": "Rezaei Aderyani, F., Farahani, M. A., Wood, A. W., Mizukami, N., & Moradkhani, H. (2026). Evolutionary Particle Filter Data Assimilation With a Complex Process‐Based Hydrologic Model for Enhancing Streamflow Prediction. Water Resources Research, 62(12). https://doi.org/10.1029/2026wr043970", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "複雑なプロセスベースの水文モデルに、進化的な粒子フィルタとMCMCを組み合わせたデータ同化を適用し、多数の流域で河川流量の再現を改善した（抄録）。", "p2": "物理に基づく水文モデルは過程の理解と他の地域への移しやすさを与えるが、モデルの構造・初期条件・パラメータ・気象入力の不確かさが予測の信頼性を制限する。データ同化は、観測でモデルの状態を拘束する方法として広く使われる（抄録）。", "p3": "進化的アンサンブル粒子フィルタとマルコフ連鎖モンテカルロを組み合わせた手法（EPFM）を、水文モデルの枠組みSUMMAと結合する。粒子（状態の候補の集まり）どうしが進化的な操作でやりとりするため、各時間ステップで全体を同期し、メモリを調整して計算する。1時間刻みのモデルの実行の中で日流量の観測を同化し、土壌水分・積雪水量・樹冠の貯留といった状態変数を更新する（抄録）。", "p4": "米国北東部の66流域で評価する。指標は決定係数、ナッシュ・サトクリフ効率、クリング・グプタ効率で、改善した流域の割合を見る（抄録）。", "p5": "決定係数で見ると流域の94%で流量の再現が改善した。ナッシュ・サトクリフ効率は95.5%、クリング・グプタ効率は86.4%の流域で改善した（抄録）。改善の大きさは抄録に記載がなく未確認。", "p6": "抄録には限界の記載がない。解釈：示されているのは改善した流域の割合で、改善の幅は分からない。粒子の数と計算の費用も抄録からは読み取れない。", "fun": "川の流量を予測するモデルは、土がどれだけ湿っているか、雪がどれだけあるかといった「状態」を内部に持っています。この状態がずれると予測も外れます。そこで、状態の候補をたくさん同時に走らせ、実際に測った川の流量を手がかりに、候補を入れ替えながら状態を更新していきます。66の流域のうち、ある指標では95.5%の流域で、流量の再現が改善しました。", "unverified": "本文を入手できず、粒子の数、進化的な操作の中身、計算の費用、改善の大きさは未確認。"}}, {"id": "jr07", "rank": 7, "headline": "縮約モデルの全工程を読めるPythonで実装", "title": "scikit‐rom: An Open‐Source Python Platform for Teaching and Prototyping Projection‐Based Reduced‐Order Model", "url": "https://doi.org/10.1002/cae.70298", "authors": "Suparno Bhattacharyya ほか", "venue": "Computer Applications in Engineering Education", "date": "2026-11-27", "sjr": 0.729, "citescore": 6.8, "citescore_year": "2025", "apa": "Bhattacharyya, S., Syed, A., Tao, J., & Ragusa, J. C. (2026). scikit‐rom: An Open‐Source Python Platform for Teaching and Prototyping Projection‐Based Reduced‐Order Model. Computer Applications in Engineering Education, 34(6). https://doi.org/10.1002/cae.70298", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "計算の重い工学シミュレーションを速くする射影型の縮約モデルを、すべての工程を読めるPythonのコードとして実装した公開の基盤scikit-romを作った（抄録）。", "p2": "射影型の縮約モデル（reduced-order model）は広く使われるが、既存のソフトの多くは、多段の工程を高水準の抽象化やコンパイル済みのソルバの中に隠していて、中身の確認や改造が難しかった（抄録）。", "p3": "軽量な有限要素ライブラリscikit-femの上に、スナップショットの生成、POD基底の計算、ガレルキン射影、オフラインとオンラインの分解、超縮約（DEIM、ECSW、ECMの3手法）、誤差の分析までを、ノートブックで追える形で実装する。問題のひな形、要素ごとの縮約演算子の組み立て、誤差の報告を1つの流れにまとめる（抄録）。", "p4": "線形と非線形、定常と過渡、熱伝導と固体力学にまたがる4つの例題で流れを示し、ガレルキン縮約モデルの結果を、libROM/pylibROMと、別のMFEMによる離散化とで照合する（抄録）。", "p5": "4つの例題で一連の工程を実演し、既存のライブラリと照合したと報告する。すべての工程が読めるPythonのコードとして公開されており、研究の試作と大学院の教育の両方に向くとする（抄録）。精度や高速化の数値は抄録に記載がなく未確認。", "p6": "抄録には限界の記載がない。解釈：教育と試作を主な目的とするPythonの実装で、大規模な問題での速度は主眼ではないとみられる。侵入型の手順なので、中身に手を入れられないソルバにはそのまま使えない。", "fun": "条件を変えながら何度も繰り返す工学の計算は、時間がかかります。そこで、あらかじめ計算した結果の例から代表的な形（基底）を取り出し、方程式をその少数の基底に射影して小さくするのが縮約モデルです。手順は何段もあり、既存のソフトでは中身が見えにくいのが悩みでした。この研究は、その手順を一つひとつ読めるプログラムとして公開しました。中身が見えるので、学ぶのにも試すのにも使えます。", "unverified": "本文を入手できず、4つの例題の詳細、既存ライブラリとの差、計算時間は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "自律型AIの失敗からの回復を協働の公正として再構成", "title": "Rethinking justice theory for service recovery in the era of agentic AI", "url": "https://doi.org/10.1108/ijchm-02-2026-0257", "authors": "Hien Thu Bui ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-26", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Bui, H. T., & Filimonau, V. (2026). Rethinking justice theory for service recovery in the era of agentic AI. International Journal of Contemporary Hospitality Management, 1–20. https://doi.org/10.1108/ijchm-02-2026-0257", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "自律的に判断するAIが起こしたサービスの失敗からの回復を、企業・従業員・顧客が協働で公正を実現する統治の過程として捉え直す理論枠組みを示した（抄録）。", "p2": "ホスピタリティ企業は自律的に意思決定するエージェント型AIの導入を目指しているが、そうしたAIが関わる失敗では、誰に責任があるのかが定まらない（責任の不確定性）という問題が生じる（抄録）。", "p3": "概念論文。サービス回復と公正の文献を批判的に検討し、失敗での責任の帰属のされ方と、分配的公正・手続き的公正・相互作用的公正が従来の回復でどう運用され、エージェント型AIによってどう揺らぐかを調べる。そのうえで各次元を、企業・現場の従業員・顧客が共同で公正な回復を実現するものとして組み替える（抄録）。", "p4": "実証データによる検証はない。文献の批判的な検討にもとづく理論の構築で、枠組みの価値は、責任が定まらない状況での公正の実現を説明できるかにある（抄録）。", "p5": "3つの公正を、利害関係者の相補的な貢献によって実現される協働の統治の過程として再概念化した。組織は公正な回復を可能にする条件を整え、現場の従業員はそれを状況に応じた回復の実践に移し、顧客は回復の過程と結果の形成に能動的に関わる（抄録）。", "p6": "概念論文であり、枠組みは実証されていない。解釈：顧客に回復への能動的な関与を求めることが、顧客の負担や不満にどう響くかは検証されていない。対象はホスピタリティ産業で、他のサービスへの一般化は未確認。", "fun": "自分で判断して動くAIが接客でミスをしたとき、責任は誰にあるのでしょうか。AIが自律的に決めた結果だと、責任の所在がはっきりしなくなります。この論文は、責任が定まらないときでも、会社と現場の従業員と客がそれぞれの役割を果たして「公正な解決」を一緒に作り上げる、という考え方を提案しています。客は解決を受け取るだけでなく、解決を形づくる側にも入る、という点が従来と違います。", "unverified": "本文を入手できず、枠組みの図、各公正の次元の具体的な再定義は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "補償は満足を、謝罪は許しを高める（配車アプリの実験）", "title": "Service Recovery Effectiveness in Ride-Hailing Platforms: The Roles of Recovery Strategy, Attribution, and Failure Severity", "url": "https://doi.org/10.1177/14413582261508564", "authors": "Pieter Daud Samadara ほか", "venue": "Australasian Marketing Journal", "date": "2026-11-27", "sjr": 1.076, "citescore": 11.5, "citescore_year": "2025", "apa": "Samadara, P. D., Kusumasondjaja, S., Hartini, S., & Sumerta, I. K. (2026). Service Recovery Effectiveness in Ride-Hailing Platforms: The Roles of Recovery Strategy, Attribution, and Failure Severity. Australasian Marketing Journal. https://doi.org/10.1177/14413582261508564", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "配車アプリのサービスの失敗で、補償と謝罪のどちらが効くかは、得たい反応（満足か許しか）と、失敗の原因・深刻さによって変わることを実験で示した（抄録）。", "p2": "アプリによる配車サービスで、回復の方策、失敗の原因の帰属、失敗の深刻さが、回復への満足・許し・再利用の意図にどう影響するかを調べる（抄録）。", "p3": "2（回復の方策：補償か謝罪か）×2（原因の帰属：利用者か、プラットフォームか）×2（深刻さ：低いか高いか）の被験者間の要因計画の実験。回復への満足と許しが、再利用の意図への経路としてどう働くかを媒介分析で調べる（抄録）。", "p4": "インドネシアで配車サービスを現に利用している学部生240人が対象。従属変数は回復への満足、消費者の許し、再利用の意図（抄録）。", "p5": "金銭の補償は総じて回復への満足を高め、謝罪による回復はより高い許しを生んだ。ただし満足への方策の効果は、原因の帰属と深刻さによって変わる。利用者に原因がある失敗は、プラットフォームに原因がある失敗より好意的な反応を生み、深刻でない失敗は深刻な失敗より良い結果になった。満足と許しは、再利用の意図への補完的な経路として働く（抄録）。", "p6": "抄録には限界の記載がない。解釈：標本は学部生240人で、条件の数で割ると1条件あたりの人数は多くない。実際の失敗の場面での行動を測ったものかは抄録からは分からない。効果の大きさは抄録に記載がない。", "fun": "配車アプリでトラブルがあったとき、お金で補償されるのと、謝られるのとでは、どちらが効くでしょうか。実験の答えは「何を得たいかによる」でした。金銭の補償は「回復への満足」を高め、謝罪は「許そう」という気持ちを高めました。そして満足と許しは、補い合う別々の道として「また使おう」という意図につながっていました。お金と言葉は、違う働き方をするようです。", "unverified": "本文を入手できず、シナリオの文面、効果の大きさ、媒介分析の係数は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "CEO報酬が低い企業ほど会計不正が摘発されやすい", "title": "CEO compensation, corporate governance, and financial statement fraud: evidence from Poland", "url": "https://doi.org/10.3846/jbem.2026.28935", "authors": "Marek Sylwestrzak ほか", "venue": "Journal of Business Economics and Management", "date": "2026-11-26", "sjr": 0.491, "citescore": 4.8, "citescore_year": "2025", "apa": "Sylwestrzak, M., & Pastuszek, P. (2026). CEO compensation, corporate governance, and financial statement fraud: evidence from Poland. Journal of Business Economics and Management, 27(5), 1014–1032. https://doi.org/10.3846/jbem.2026.28935", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社のPDFの本文（§3.1〜3.2、§4.2の結果の記述、限界の節、図表のキャプション）を読んだ。§2と§4.3〜4.4の表の細部は読んでいない", "preprint": false, "p1": "ポーランドの上場企業で、CEOの報酬が低い企業ほど、当局に摘発された財務諸表の不正が起きやすいという関連を示した（§4.2、表3）。", "p2": "CEOの報酬と企業統治の特徴が財務諸表の不正とどう関係するかについて、中東欧の市場での証拠は乏しく、報酬が財務報告のリスクを見積もる情報になるかは十分に調べられていなかった（抄録）。", "p3": "ポーランド金融監督庁（KNF）の2014〜2023年の制裁金の登録簿から、財務情報の意図的な省略・虚偽表示で制裁された上場18社を特定し、対象の報告年ごとに1観測とする。各不正の社年に、同じ年・同じ3桁の産業分類の上場企業を対照として合わせる（§3.1）。不正の有無を従属変数とするロジスティック回帰で、財務指標に統治の変数とCEO報酬を順に加える（§4.2）。", "p4": "最終の標本は221社年（不正27、対照194）で、報酬のデータがある212社年で推定する。ウィンザー化やプロビットなどで頑健性を確かめ、予測の性能は正解率、F1、ROC/AUCで見る（§3.1、§4.2、抄録）。", "p5": "CEO報酬の係数は負で有意で、財務と統治の変数を入れても残る。平均限界効果では、報酬の対数の増加が、摘発された不正の確率の4.4ポイントの低さと関連する。CEOの年齢、大手監査法人による監査、時価簿価比率は不正と負に、企業規模は正に関連した。報酬を加えると正解率・F1・ROC/AUCが改善するが、F1は中程度にとどまる（§4.2、表3）。", "p6": "著者の挙げる限界は、摘発・制裁された違反だけを捉え未発覚の不正は含まないこと、不正の観測が少なく検出力とモデルの複雑さが制限されること、発覚の前後の報酬の変化を区別しておらず同時点の関連にすぎないこと、取締役会の独立性の情報がなく、報酬を固定給や賞与に分けていないこと（Limitations）。", "fun": "社長の報酬が高い会社と低い会社では、どちらで決算の不正が見つかりやすいでしょうか。ポーランドの上場企業を調べると、不正が摘発された会社のほうが、社長の報酬が低い傾向がありました。ただし、不正の例は27件と少数です。それに著者も断っているとおり、これは同じ時点での関連で、報酬が低いから不正が起きるのか、その逆なのかは、このデータからは分かりません。", "unverified": "表2〜表5の個々の係数と適合度の数値、仮説の導出（§2）は確認していない。"}}, {"id": "jr11", "rank": 11, "headline": "反論されるとLLMは6件に1件で正しい助言を撤回", "title": "When Users Push Back: Sycophantic Reversion in Large Language Models’ Nutrition Advice—A Bilingual, Multi-Turn Computational Audit", "url": "https://doi.org/10.3390/nu18233981", "authors": "Hatice Merve Bayram ほか", "venue": "Nutrients", "date": "2026-11-27", "sjr": 1.499, "citescore": 10.2, "citescore_year": "2025", "apa": "Bayram, H. M., & Ozturkcan, A. (2026). When Users Push Back: Sycophantic Reversion in Large Language Models’ Nutrition Advice—A Bilingual, Multi-Turn Computational Audit. Nutrients, 18(23), 3981. https://doi.org/10.3390/nu18233981", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "栄養についての助言で、LLMが最初は指針どおりに答えても、利用者に繰り返し反論されると正しい助言を後退させる頻度を、多往復の対話で測った（抄録）。", "p2": "迎合（sycophancy）とは、LLMが根拠より利用者への同意を優先する傾向のこと。会話の中での栄養の助言を損なうおそれがあるが、最初に指針どおりだった助言が、利用者の圧力を繰り返し受けても保たれるかは調べられていなかった（抄録）。", "p3": "場面に基づく多往復・2言語の計算機による監査。3つのLLM（ChatGPT-5.6、Gemini-3.6 Flash、Claude-Sonnet 5.5）に、9つの栄養の場面、3つの圧力の条件、2つの言語（英語とトルコ語）、独立した2回の反復で、4往復の会話を324件行わせる。すべての記録を、事前に定めた規則書に照らして2回採点する（抄録）。", "p4": "最初の回答が指針に完全に沿っていた会話を対象に、その後に助言が後退した割合（何らかの後退と、完全な後退）を数える。モデル・言語・圧力の条件による差は並べ替えの分析で調べる（抄録）。", "p5": "最初の回答が完全に指針どおりだったのは185件（57.1%）。そのうち32件（17.3%、95%信頼区間12.5〜23.4）で何らかの後退、20件（10.8%）で完全な後退が起きた。後退はChatGPT-5.6で22.4%、Gemini-3.6 Flashで22.2%、Claude-Sonnet 5.5で7.8%で、1型糖尿病、食べ合わせ、アルカリ水の3つの場面に限られた。モデル間の差は有意（ホルム補正後 p = 0.034）で、言語と圧力の条件による差は検出されなかった。後退した会話の40.6%は最初の反論で譲っていた（抄録）。", "p6": "抄録には限界の記載がない。解釈：場面は9つ、反復は2回で、後退が3つの場面に集中しているため、場面の選び方に結果が左右されうる。採点者とその一致の程度は抄録からは分からない。特定の版のモデルでの結果でもある。", "fun": "AIに栄養の相談をして、指針どおりの答えが返ってきたとします。そこで利用者が繰り返し反論したら、AIは助言を変えるでしょうか。この研究は324件の会話で試しました。最初に指針どおりに答えた会話のうち、およそ6件に1件は、反論を受けて助言を後退させました。しかも後退した会話の40.6%は、最初の反論で譲っていました。最初の答えが正しいかだけでなく、反対されても保てるかを確かめる必要があると分かります。", "unverified": "本文を入手できず、9つの場面の文面、圧力の3条件の中身、規則書の採点基準は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "心理的安全性が低いと将来展望が生成AIの評価を下げる", "title": "Career Adaptability, Perceived Usefulness of Generative AI, and Innovative Work Behavior: The Conditional Role of Occupational Future Time Perspective and Psychological Safety", "url": "https://doi.org/10.3390/bs16122260", "authors": "Socheon Yoon ほか", "venue": "Behavioral Sciences", "date": "2026-11-26", "sjr": 0.828, "citescore": 4.1, "citescore_year": "2025", "apa": "Yoon, S., & Kim, K. (2026). Career Adaptability, Perceived Usefulness of Generative AI, and Innovative Work Behavior: The Conditional Role of Occupational Future Time Perspective and Psychological Safety. Behavioral Sciences, 16(12), 2260. https://doi.org/10.3390/bs16122260", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "職場で生成AIをどう評価するかは、職業上の将来の見通しと心理的安全性の組み合わせで変わり、将来を広く見通す人ほど、心理的安全性の低い職場ではAIを有用と評価しにくいことを示した（抄録）。", "p2": "生成AIを新しいやり方で使うかどうかには従業員の間で差がある。職業上の将来展望（occupational future time perspective）はふつう資源として扱われるが、心理的安全性にかかわらずAIへの関与を促すのか、キャリア適応力が有用性の評価を通じて革新的な仕事行動に結びつくのかは不明だった（抄録）。", "p3": "キャリア構築理論にもとづく2時点の質問紙調査。各結果変数について基準時点の値を調整したうえで、将来展望と有用性の評価の関連が心理的安全性で変わるか（調整）と、キャリア適応力から有用性の評価を経て革新的な仕事行動に至る間接の関連（媒介）を検定する（抄録）。", "p4": "韓国の従業員525人。結果変数は生成AIの有用性の評価と革新的な仕事行動。調整効果が、心理的安全性を測る時点や、別の変数（仕事の自律性）でも現れるかも調べる（抄録）。", "p5": "将来展望は、心理的安全性が低いと有用性の評価と負に関連し、高いとほぼ無関係だった。そのため、安全性が低いときの革新的な仕事行動への間接の関連は負になる。キャリア適応力は有用性の評価を通じて革新的な仕事行動と関連したが、使いやすさの評価もこの媒介の役割を分け合った（抄録）。係数は抄録に記載がなく未確認。", "p6": "著者は、調整効果が心理的安全性を同じ時点で測った場合に依存し、仕事の自律性でも同じ形が再現されたため、暫定的なものとして扱うと述べる（抄録）。解釈：自己報告の調査で、因果の向きは確定できない。韓国の標本に限られる。", "fun": "「自分の職業人生にはまだ先があり、機会も多い」と感じている人は、新しい道具にも前向きだと思われがちです。ところがこの調査では、心理的安全性の低い職場では、将来を広く見通す人ほど生成AIの有用性を低く評価していました。安全性の高い職場では、この関係はほぼ消えます。安心して試せない場所では、前向きな見通しがAIの活用に結びつかない、という結果です。試すことを許す雰囲気が大事だと著者は述べています。", "unverified": "本文を入手できず、尺度、2時点の間隔、係数と信頼区間、標本の属性は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "親の介護の種類で退職への影響が異なる", "title": "Different Care, Different Costs: The Differential Impact of Caregiving Activities for a Parent on Retirement Behavior", "url": "https://doi.org/10.1111/1475-6773.70191", "authors": "Katherine E. M. Miller ほか", "venue": "Health Services Research", "date": "2026-11-27", "sjr": 1.757, "citescore": 5.9, "citescore_year": "2025", "apa": "Miller, K. E. M., Ornstein, K. A., & Coe, N. B. (2026). Different Care, Different Costs: The Differential Impact of Caregiving Activities for a Parent on Retirement Behavior. Health Services Research, 61(6). https://doi.org/10.1111/1475-6773.70191", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "親の介護が退職に与える影響は介護の種類によって違い、手で行う世話だけをしている人が最も退職しやすいことを示した（抄録）。", "p2": "これまでの文献は、介護の定義を手で行う世話の提供に限ってきた。金銭の支援だけをする人や、両方をする人を含めたすべての種類の介護者について、介護の種類ごとの影響は捉えられていなかった（抄録）。", "p3": "操作変数法を使う。きょうだいの数、親が再びパートナーを持ったことがあるか、回答者ときょうだいの相対的な経済状況の違いを使って、手で行う介護、金銭の支援、その両方という介護の活動を予測し、退職と早期退職への影響を推定する（抄録）。", "p4": "米国のHealth and Retirement Study（1998〜2018年）のデータ。1998〜2016年に最初の面接を受け、地域に住み、フルタイムで有給の仕事をしている回答者が対象。介護を一度もしていない人と比べる（抄録）。", "p5": "退職の予測確率は、手で行う介護だけの人が最も高く41.7%（95%信頼区間40.2〜43.2）、手で行う介護と金銭の支援の両方の人が37.2%（35.2〜39.0）。早期退職は、手で行う介護だけが23.2%（22.1〜24.3）、両方が22.1%（20.4〜23.8）、金銭の支援だけが14.6%（12.7〜16.4）、介護をしていない人が9.6%（8.5〜10.8）（抄録）。", "p6": "抄録には限界の記載がない。解釈：操作変数（きょうだいの数など）が、介護を通じてだけ退職に影響するという仮定が成り立つかは、本文で確かめる必要がある。米国のデータでの結果で、他国への一般化は未確認。標本の人数は抄録に記載がない。", "fun": "親の介護には、手を動かして世話をする介護と、お金を出して支える介護があります。どちらも介護ですが、仕事への影響は同じでしょうか。米国の長期の調査によると、早期に退職する確率は、介護をしていない人が9.6%なのに対し、手で行う介護だけをしている人は23.2%でした。金銭の支援だけの人は14.6%でした。介護をひとくくりにすると、こうした負担の違いが見えなくなります。", "unverified": "本文を入手できず、標本の人数、操作変数の妥当性の検定、退職の定義は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "橋梁台帳16年分の「形」が2019〜22年に組み替わる", "title": "Topological Reorganization in a State Bridge Inventory: A Persistent Homology Analysis of Georgia’s National Bridge Inventory from 2010 through 2025", "url": "https://doi.org/10.1061/jitse4.iseng-3165", "authors": "Michael Myung Jeong ほか", "venue": "Journal of Infrastructure Systems", "date": "2026-11-25", "sjr": 0.591, "citescore": 5.0, "citescore_year": "2025", "apa": "Jeong, M. M., Oh, H., & Jung, Y. E. (2027). Topological Reorganization in a State Bridge Inventory: A Persistent Homology Analysis of Georgia’s National Bridge Inventory from 2010 through 2025. Journal of Infrastructure Systems, 33(1). https://doi.org/10.1061/jitse4.iseng-3165", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "州の橋梁台帳の全体が、状態の多次元の空間の中でどんな「形」をしているかを位相的データ解析で追い、平均や標準偏差では見えない構造の組み替えが2019〜2022年に起きたことを示した（抄録）。", "p2": "全米橋梁台帳（NBI）は橋の状態を毎年、標準化した形で記録する。しかしその分析は集計統計と個々の構造物の予測モデルに頼ってきて、橋梁群全体の多変量の構成が時間とともにどう変わるかは記述されていなかった（抄録）。", "p3": "パーシステントホモロジー（persistent homology：点の集まりが作る輪などの形の特徴を捉える位相的データ解析の手法）を、橋梁群の水準で適用する。ジョージア州の桁橋とスラブ橋の16年分について、各年の橋梁群を状態の空間の位相で特徴づけ、ブートストラップによる不確かさの推定つきで定量化する（抄録）。", "p4": "2010〜2025年のNBIのデータを使う（題名）。同じデータの平均・標準偏差と比べ、4つの地域の層ごとの結果、2018年の報告様式の移行をまたぐ検証、部分標本の大きさ、状態遷移の分析、しきい値への感度で頑健性を確かめる（抄録）。", "p5": "3段階の推移が見いだされた。橋梁群の複雑さは2018年まで蓄積し、2019〜2022年に位相的な輪が大きく失われる形で急に組み替わり、その後は部分的に回復した。この組み替えは平行移動ではなく凝縮で、最も持続性の高い位相的な特徴を優先的に消した。4つの地域の層すべてに現れ、連邦のインフラ政策の時期と重なる（抄録）。", "p6": "抄録には限界の記載がない。解釈：政策の時期との対応は時間的な一致であり、因果を示すものではない。位相的な「輪」が橋の管理の上で何を意味するのかは、抄録からは分からない。1つの州の結果である。", "fun": "たくさんの橋の点検結果を、平均とばらつきだけで見ていると、見落とすことがあります。この研究は、橋の集まり全体を状態の空間の中の点の集まりとみなし、その「形」、たとえば輪のような構造がどれだけあるかを数えました。すると2019〜2022年に、平均や標準偏差には現れないのに、形が大きく組み替わっていました。集団の全体の姿は、平均値には映らないことがあるのです。", "unverified": "本文を入手できず、橋の数、使った状態の変数、位相的な特徴量の値、不確かさの幅は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "生成AIで仕事は進むが検証が追いつかない（看護師）", "title": "The Completion–Verification Gap in Clinical Nurses' Integration of Generative Artificial Intelligence Into Nursing Work: A Qualitative Study", "url": "https://doi.org/10.1111/jocn.70674", "authors": "Yanchi Wang ほか", "venue": "Journal of Clinical Nursing", "date": "2026-11-27", "sjr": 1.397, "citescore": 8.8, "citescore_year": "2025", "apa": "Wang, Y., Lu, X., Jiang, X., & Gu, J. (2026). The Completion–Verification Gap in Clinical Nurses’ Integration of Generative Artificial Intelligence Into Nursing Work: A Qualitative Study. Journal of Clinical Nursing. https://doi.org/10.1111/jocn.70674", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "臨床の看護師が生成AIを仕事に取り入れるとき、作業は終えやすくなる一方、その出力を確かめることの難しさは解消されないという「完了と検証のずれ」があることを明らかにした（抄録）。", "p2": "生成AIは看護で使われるようになっているが、作業の障壁が下がったときに、とくに根拠が重要な作業や患者に関わる作業で、看護師が出力を検証できると感じているかはほとんど分かっていなかった（抄録）。", "p3": "質的記述的研究。2025年10〜12月に、中国・南通の三次病院4施設で、生成AIの使用経験のある臨床看護師を、多様性を最大にする合目的的な抽出で募り、個別の半構造化面接を行って、帰納的な主題分析にかけた。データの収集と分析を並行して進め、21件の面接で飽和を評価し、追加の1件で確認した（抄録）。", "p4": "面接は22人。作業への支援、出力を検証できるという認識、専門職としての責任に焦点を当てて、主題と下位主題を導く（抄録）。量的な指標による評価ではない。", "p5": "3つの主題と6つの下位主題が得られた。(1)生成AIの利用が、定型の下書きから多様な看護の作業へ広がり、作業の障壁を下げること。(2)完了と検証のずれ：効率と学習の支えになる一方、表面的な理解と早すぎる自信を伴うこと。(3)リスクに応じた統合：リスクに基づく検証、専門職としての責任の保持、組織の安全策（抄録）。", "p6": "抄録には限界の記載がない。解釈：1つの都市の4病院・22人の面接で、他の国や制度への一般化はできない。検証の難しさは本人の認識であり、実際に誤りをどれだけ見落としたかは測っていない。", "fun": "AIに手伝ってもらうと、情報の多い仕事や不慣れな仕事にも取り組みやすくなります。でも、仕上がったものが正しいかを確かめる難しさは、それで消えるわけではありません。看護師22人への聞き取りから見えてきたのは、「作業を終えられること」と「中身を確かめられること」の間のずれでした。抜けや、作り上げられた情報、不適切な提案を見分けるのは難しいままだったのです。", "unverified": "本文を入手できず、参加者の属性、下位主題の全容、使われた生成AIの種類は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "凍結融解と衝撃を粒子と差分の連成で再現", "title": "A novel FDM–DEM simulation method for freeze–thaw cycles and subsequent impact dynamic mechanical behavior of granular materials", "url": "https://doi.org/10.1177/10567895261508142", "authors": "Bin Li ほか", "venue": "International Journal of Damage Mechanics", "date": "2026-11-26", "sjr": 0.921, "citescore": 8.5, "citescore_year": "2025", "apa": "Li, B., Zhu, Z., Chunyu, Z., Du, W., Cheng, Z., & Li, T. (2026). A novel FDM–DEM simulation method for freeze–thaw cycles and subsequent impact dynamic mechanical behavior of granular materials. International Journal of Damage Mechanics. https://doi.org/10.1177/10567895261508142", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "凍ったり融けたりを繰り返した凍土が衝撃を受けたときの壊れ方を、粒子の計算と格子の計算を組み合わせて再現できるようにした（抄録）。", "p3": "凍結融解で膨張・収縮する相変化粒子を入れた水–氷の相転移モデルを粒子流コードに組み込み、有限差分法と離散要素法（DEM：粒の集まりとして材料を計算する方法）を連成させて衝撃時の挙動を計算し、凍土の実験と比べた（抄録）。", "p5": "凍土の強度は凍結融解の回数が増えるほど、またひずみ速度が下がるほど低下し、き裂の数は回数とひずみ速度とともに増えた。臨界となる凍結融解の回数も特定された。実験と計算はよく一致したと報告する（抄録）。", "fun": "寒い地域の地面は、冬に凍り春に融けることを毎年繰り返します。水は凍ると体積が増えるので、土の粒の間で氷が膨らんだり縮んだりして、少しずつ土を傷めます。この研究は、その「水が氷になる粒」をコンピュータの中に作り、凍結と融解を繰り返した土が衝撃でどう割れるかを再現しました。回数が増えるほど弱くなるという結果です。", "unverified": "強度低下の数値、臨界の回数、実験と計算の誤差は抄録に記載がなく未確認。"}}, {"id": "jr17", "rank": 17, "headline": "地上ロボットによる構造モニタリングを75報で整理", "title": "A Latest Systematic Literature Review of Civil Structural Health Monitoring Using Unmanned Ground Robotic Systems", "url": "https://doi.org/10.3390/s26237475", "authors": "Thisali S. Rathnayake ほか", "venue": "Sensors", "date": "2026-11-26", "sjr": 0.802, "citescore": 9.4, "citescore_year": "2025", "apa": "Rathnayake, T. S., Samarabandu, J., & Sadhu, A. (2026). A Latest Systematic Literature Review of Civil Structural Health Monitoring Using Unmanned Ground Robotic Systems. Sensors, 26(23), 7475. https://doi.org/10.3390/s26237475", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "地上を走るロボットによる土木構造物の点検・監視の研究75件を、地図作成・経路計画・物体検出・損傷検出の4領域で整理した系統的レビュー（抄録）。", "p3": "ScienceDirect、Scopus、Web of Science、IEEE Xploreから英語の査読つき論文と会議論文を集め、PRISMAの枠組みに沿って75件を選び、叙述的に統合した（抄録）。", "p5": "無人地上車両は、単なるデータ収集の台車から、計測・自己位置推定・航行・点検を統合したシステムへ向かっている。損傷検出と物体検出は深層学習と複数センサの併用が増えた。一方で多くは特定の課題・環境向けで、汎化の弱さ、データ不足、事前地図への依存、現場での検証不足が課題だという（抄録）。", "fun": "橋やトンネルの点検は、危険だったり、同じ作業の繰り返しだったりします。そこで地上を走るロボットに任せる研究が増えています。75件を読み比べたこのレビューによると、ロボットは「データを集めるだけの台車」から「自分で場所を把握し、経路を決め、傷を見つける」方向へ進んでいます。ただし、統制された条件でしか確かめていない例が多いそうです。", "unverified": "対象とした発表年の範囲と、領域ごとの件数は抄録に記載がなく未確認。"}}, {"id": "jr18", "rank": 18, "headline": "車体・車輪・路面の連成FEMで路床の動的応力を再現", "title": "Numerical Simulation of the Dynamic Response of a Geocell-Reinforced Aeolian Sand Roadbed Under Vehicle Driving Conditions", "url": "https://doi.org/10.3390/app162311660", "authors": "Jie Liu ほか", "venue": "Applied Sciences", "date": "2026-11-25", "sjr": 0.555, "citescore": 6.1, "citescore_year": "2025", "apa": "Liu, J., Kong, J., Xia, J., Yang, Y., Pan, J., & Zhang, J. (2026). Numerical Simulation of the Dynamic Response of a Geocell-Reinforced Aeolian Sand Roadbed Under Vehicle Driving Conditions. Applied Sciences, 16(23), 11660. https://doi.org/10.3390/app162311660", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "砂漠の風成砂をジオセル（蜂の巣状の補強材）で補強した道路の路床が、走るトラックからどんな力を受けるかを、車体・車輪・路面の連成を入れた3次元の計算で再現した（抄録）。", "p3": "車体・車輪・路面の連成動力学を入れた3次元有限要素モデルを作り、43トンのトラックを時速20kmと60kmで走らせた現地試験で検証したうえで、車両質量25〜49トン、速度20〜100km/hの影響を計算で調べた（抄録）。", "p5": "動的応力は深さとともに減り、厚さ0.96mの路床構造で81.8〜89.9%減衰した。調べた条件では、車両が重いほど大きく、速度が高いほど小さい。従来の礫質土の路床より応力が低く分布も一様で、計算と実測の最大のずれは約4.6〜4.8%だった（抄録）。", "fun": "砂漠に道路を造るとき、さらさらの砂は荷重で崩れやすいのが悩みです。そこで蜂の巣のような枠に砂を詰めて動かないようにします。この研究は、43トンのトラックを実際に走らせた試験と計算を比べました。地面にかかる力は厚さ約1mの路床を通る間に8〜9割も弱まること、計算が実測と5%以内で合うことを確かめています。", "unverified": "車両モデルの自由度や路面の凹凸の扱いは抄録に記載がなく未確認。"}}, {"id": "jr19", "rank": 19, "headline": "東京圏のTODで人が留まる場所を決める建造環境", "title": "How does the Built Environment Influence Stationary Activities in Transit-Oriented Development Areas? A Spatial Analysis Based on Large-Scale Mobile Phone Data", "url": "https://doi.org/10.1007/s13177-026-00732-8", "authors": "Xueqing Bo ほか", "venue": "International Journal of Intelligent Transportation Systems Research", "date": "2026-11-27", "sjr": 0.434, "citescore": 3.3, "citescore_year": "2025", "apa": "Bo, X., Nishiuchi, H., & Suzuki, Y. (2026). How does the Built Environment Influence Stationary Activities in Transit-Oriented Development Areas? A Spatial Analysis Based on Large-Scale Mobile Phone Data. International Journal of Intelligent Transportation Systems Research, 25(1). https://doi.org/10.1007/s13177-026-00732-8", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "東京都市圏の携帯電話の大規模データから、駅の周りで人が「留まる」活動を捉え、それが建造環境のどの要素と結びつくかを、場所ごとの違いまで含めて示した（抄録）。", "p3": "来訪者の滞留活動を携帯電話データで測り、重回帰で全体の関連を、マルチスケール地理的加重回帰（MGWR：要因ごとに効く範囲を変えられる回帰）で関連の空間的な異質性を調べた（抄録）。", "p5": "土地利用の混合、交通に関わる要因、商業施設の多さ、ネットワーク中心性が滞留活動と正に関連した。要因によって効く空間スケールが異なり、都市圏全体で一様に効くものと、場所によって大きく変わるものがあった（抄録）。", "fun": "駅前のにぎわいは、通り過ぎる人の数だけでは測れません。人がそこで足を止めて過ごしているかが大事です。この研究は、携帯電話のデータから「留まっている人」を東京圏全体で捉え、店の多さや土地の使われ方との関係を調べました。どこでも同じように効く要因と、場所によって効き方が違う要因があることが分かりました。", "unverified": "データの期間と規模、係数の大きさ、滞留の定義は抄録に記載がなく未確認。"}}, {"id": "jr20", "rank": 20, "headline": "ブラジル145自治体の運賃無料化を政策として読み解く", "title": "The conspicuous rise of tarifa zero as an urban policy: Unpacking the opportunities and contradictions of fare-free public transport in Brazil", "url": "https://doi.org/10.1177/00420980261504606", "authors": "Daniel Santini ほか", "venue": "Urban Studies", "date": "2026-11-27", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Santini, D., & Kębłowski, W. (2026). The conspicuous rise of tarifa zero as an urban policy: Unpacking the opportunities and contradictions of fare-free public transport in Brazil. Urban Studies. https://doi.org/10.1177/00420980261504606", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ブラジルで広がる運賃無料の公共交通を、単なる料金の改革でなく多面的な都市政策として捉え、広がり方・財源・政治的な理由を整理した（抄録）。", "p3": "全国の運賃無料化の系統的な整理、文書分析、複数事例の研究を組み合わせ、普及の時期と地理、財政の仕組み、設計を形づくる政治的な理由をたどる（抄録）。", "p5": "145の自治体が導入しており、1990年代の初期の試みからコロナ後の急増まで段階的に広がった。数では中小都市が多いが、大都市が人口への影響と政治的な重みを左右する。運行面では、乗客数に応じた支払いから供給量に応じた支払いへの統治改革と組み合わせると成功し、導入は思想の左右を問わず、交通の危機と選挙の誘因に動かされていた（抄録）。", "fun": "公共交通を無料にした自治体が、ブラジルには145もあります。面白いのは、導入が政治的な立場の左右をまたいでいることです。主義よりも、交通の仕組みが立ち行かなくなる危機と、選挙で支持を得たいという動機が後押ししていました。そして無料化がうまくいくかは、事業者への支払い方を「乗客の数」から「走らせた量」に変えられるかにかかっていました。", "unverified": "事例として取り上げた都市の名前と数、財源の具体的な内訳は抄録に記載がなく未確認。"}}, {"id": "jr21", "rank": 21, "headline": "地域の拠点で働く人と住民の「つなぐ・分ける」戦略", "title": "‘I share, I learn, I do’: Brokerage strategies in community social work", "url": "https://doi.org/10.1093/bjsw/bcag301", "authors": "Tina Jaeger ほか", "venue": "The British Journal of Social Work", "date": "2026-11-26", "sjr": 0.898, "citescore": 3.9, "citescore_year": "2025", "apa": "De Jaeger, T., & Raeymaeckers, P. (2026). ‘I share, I learn, I do’: Brokerage strategies in community social work. The British Journal of Social Work. https://doi.org/10.1093/bjsw/bcag301", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "地域の拠点で、職員と住民が人どうしを「つなぐ」だけでなく「分ける」ことも使い分けて、共に居られる場を作っていることを明らかにした（抄録）。", "p3": "ベルギー・フランデレンの2つのコミュニティセンターでのエスノグラフィ（現場に入って観察する調査）に、過程としての仲介の理論を組み合わせて分析した（抄録）。", "p5": "つなぐ戦略（紹介する、集める、視点を橋渡しする）、分ける戦略（境界を保つ、引く）、紹介する戦略、動員する戦略の4つを見いだした。つながりの欠如を「直すべき欠陥」とみなす前提に疑問を示し、共に居ることは職員と住民が日々交渉して作る関係の過程だと論じる（抄録）。", "fun": "地域の集会所の仕事は、人と人を引き合わせることだと思いがちです。ところが現場を観察すると、職員や住民は、あえて境界を保ったり、境目を引いたりもしていました。みんなを一つにまとめることだけが良いのではなく、ほどよく離れることも、同じ場所で一緒に過ごすための工夫だという発見です。", "unverified": "観察の期間、参加者の人数、各戦略の具体的な場面は抄録に記載がなく未確認。"}}, {"id": "jr22", "rank": 22, "headline": "看護学生の電話ボランティアが孤独な高齢者と築く関係", "title": "Nursing Students as Volunteer Telephone Companions for Older Adults Experiencing Loneliness: A Qualitative Study of the Therapeutic Bond and Experiential Learning (HELPeN Project)", "url": "https://doi.org/10.3390/nursrep16120432", "authors": "María Jesús Hernández‐López ほか", "venue": "Nursing Reports", "date": "2026-11-26", "sjr": 0.759, "citescore": 2.9, "citescore_year": "2025", "apa": "Hernández-López, M. J., García-González, J., Ramos-Morcillo, A. J., Salas-Cañizares, A., & Ruzafa-Martínez, M. (2026). Nursing Students as Volunteer Telephone Companions for Older Adults Experiencing Loneliness: A Qualitative Study of the Therapeutic Bond and Experiential Learning (HELPeN Project). Nursing Reports, 16(12), 432. https://doi.org/10.3390/nursrep16120432", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "孤独を抱える高齢者に電話で寄り添うボランティアの看護学生が、その経験をどう受け止めたかを聞き取り、関係づくりが支援の中心であることを示した（抄録）。", "p3": "スペイン・ムルシア州の大学のボランティア事業（9か月の電話支援、2022〜2026年の4学年度）で、ボランティア31人を意図的に選び、6つのオンラインのフォーカスグループ（27人）と4件の個別面接を行って、主題分析にかけた（抄録）。", "p5": "当初の動機が関係への関与に変わること、不確かさから信頼と互恵の感覚へ進む関係が支援の軸であること、意思疎通や共感を学ぶ体験になること、研修・指導・柔軟さが強みで、最初の不安・電話の限界・終了の扱いが課題であることの4つが見いだされた。高齢者の側の見方は調べていない（抄録）。", "fun": "孤独を感じているお年寄りに、看護学生が9か月のあいだ電話で寄り添う取り組みがスペインにあります。学生たちは最初は不安でしたが、やがて相手を信頼し、自分も受け取るものがあると感じるようになりました。難しかったことの一つは、期間が終わるときにどう関係を閉じるかでした。支える側の気持ちの変化を追った研究です。", "unverified": "高齢者の孤独感が実際に減ったかは調べておらず未確認。参加した高齢者の人数は抄録に記載がない。"}}, {"id": "jr23", "rank": 23, "headline": "孤独は関係と構造から生まれる（専門職36人の見方）", "title": "Loneliness as a relational phenomenon: health, education and social care professionals’ perspectives on the loneliness experiences of the people they support—a qualitative focus group study", "url": "https://doi.org/10.3389/fpubh.2026.1993402", "authors": "Hannah Bolt ほか", "venue": "Frontiers in Public Health", "date": "2026-11-27", "sjr": 1.103, "citescore": 6.4, "citescore_year": "2025", "apa": "Bolt, H., García Calderó, G., Rohrmoser, A., Rost, M., Elger, B. S., & Seaward, H. (2026). Loneliness as a relational phenomenon: health, education and social care professionals’ perspectives on the loneliness experiences of the people they support—a qualitative focus group study. Frontiers in Public Health, 14. https://doi.org/10.3389/fpubh.2026.1993402", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "保健・教育・福祉の専門職が、支援する人々の孤独を、個人の問題でなく関係と社会の構造から生じるものとして捉えていることを示した（抄録）。", "p3": "スイスで、精神保健の専門職、ソーシャルワーカー、教員、助産師の計36人に6つのフォーカスグループを行い（36人中26人は若者を担当）、応用的な主題分析にかけた（抄録）。", "p5": "コロナ禍の制限による日常のつながりと指導の機会の減少、思春期の発達での仲間との交流の重要さ（デジタルの接触は対面の代わりとして不十分）、専門職が捉える孤独の意味、経済的困窮・移住の背景・家族の不安定さ・年齢が重なる構造的な文脈、の4つの主題が得られた（抄録）。", "fun": "孤独は「その人個人の問題」と見られがちです。でも、若者や移住の背景を持つ人を日々支える先生やソーシャルワーカーたちは違う見方をしていました。仲間や頼れる大人と会う機会が減り、地域の基盤が弱まり、お金や家庭の事情が重なると孤独になりやすい、というのです。孤独を個人でなく環境の側から見直す視点です。", "unverified": "孤独を経験している当事者の声は集めておらず未確認。新しい親や移住の背景を持つ人の集団は代表が少ないと著者が述べる。"}}, {"id": "jr24", "rank": 24, "headline": "監査委員が報酬委員を兼ねると財務報告の質が下がる", "title": "Audit committee internal busyness, internal audit function and financial reporting quality: evidence from Malaysia", "url": "https://doi.org/10.1108/cg-04-2025-0258", "authors": "Wan Nordin Wan-Hussin ほか", "venue": "Corporate Governance: The International Journal of Business in Society", "date": "2026-11-26", "sjr": 0.992, "citescore": 11.1, "citescore_year": "2025", "apa": "Wan-Hussin, W. N., & Bamahros, H. (2026). Audit committee internal busyness, internal audit function and financial reporting quality: evidence from Malaysia. Corporate Governance: The International Journal of Business in Society, 1–30. https://doi.org/10.1108/cg-04-2025-0258", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "監査委員が同じ会社の報酬委員も兼ねるという「社内での多忙」が、財務報告の質の低さと結びつくことを示した（抄録）。", "p3": "執行取締役の監査委員就任を禁じた2007年の改革の後にあたる2009年の、マレーシアの上場508社を標本に、監査委員会と報酬委員会の委員の重なりと財務報告の質の関連を調べた（抄録）。", "p5": "委員の重なりが大きいほど財務報告の質が低かった。兼務による過重な負担が、財務報告の監督から注意をそらすという見方を支持する。強い内部監査の機能は、重なりのある企業の機会主義的な報告の傾向を和らげた（抄録）。", "fun": "会社の決算をチェックする「監査委員」が、役員の報酬を決める「報酬委員」も兼ねていたらどうなるでしょう。独立した取締役の少ない新興国の会社では起きやすいことです。調べてみると、兼務が多い会社ほど決算の質が低い傾向がありました。一人で何役もこなすと、見張りの目が行き届かなくなるのかもしれません。内部監査がしっかりしていると、その悪影響は弱まりました。", "unverified": "財務報告の質の測り方と係数の大きさは抄録に記載がなく未確認。2009年の単年のデータである。"}}, {"id": "jr25", "rank": 25, "headline": "大統領と同じ党派のCEOは悪いニュースを抱え込む", "title": "Political Alignment at the Top: CEO Partisanship, Bad‐News Hoarding, and Stock Price Crash Risk", "url": "https://doi.org/10.1111/corg.70080", "authors": "Dichu Bao ほか", "venue": "Corporate Governance: An International Review", "date": "2026-11-27", "sjr": 1.992, "citescore": 8.7, "citescore_year": "2025", "apa": "Bao, D., Su, L. (., Yang, D., & Yousaf, U. B. (2026). Political Alignment at the Top: CEO Partisanship, Bad‐News Hoarding, and Stock Price Crash Risk. Corporate Governance: An International Review. https://doi.org/10.1111/corg.70080", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "米国の大統領と同じ党派のCEOは、自社の悪い情報を市場に出すのを控えがちで、その後の株価の急落リスクが高いことを示した（抄録）。", "p3": "CEO個人の政治献金から党派を特定し、同じ量の負の私的情報を抱えているときに、業績予想の出し方や決算説明会での語調が、大統領と党派が一致するCEOとそうでないCEOでどう違うかを比べた（抄録）。", "p5": "党派が一致するCEOは悪い業績予想を出すことが少なく、説明会の語調も悲観的でない。負の情報が多いときほど速やかな開示を避け、その後の負の決算サプライズが大きく、株価暴落リスクも高い。この関連は、規制当局との接点が少ない、外部の監視が弱い、CEOが若いといった場合に強い（抄録）。", "fun": "社長が支持する政党が政権を取っていると、会社の悪い知らせの扱いが変わるのでしょうか。この研究によると、大統領と同じ党派の社長は、会社に悪い知らせがあっても公表を控えがちでした。著者は、楽観と「責任を問われにくい」という感覚が背景にあると論じます。ため込まれた悪い知らせは、あとで株価の急落につながります。", "unverified": "標本の期間と企業数、効果の大きさは抄録に記載がなく未確認。"}}, {"id": "jr26", "rank": 26, "headline": "会計出身のCFOは病院の運営成績を高め困窮を減らす", "title": "Association of chief financial Officer’s characteristics with financial performance and operational performance in healthcare organizations", "url": "https://doi.org/10.1177/09514848261512646", "authors": "Jidong Zhang ほか", "venue": "Health Services Management Research", "date": "2026-11-26", "sjr": 0.553, "citescore": 4.1, "citescore_year": "2025", "apa": "Zhang, J., Han, J., & Aroskar, R. (. V. (2026). Association of chief financial Officer’s characteristics with financial performance and operational performance in healthcare organizations. Health Services Management Research. https://doi.org/10.1177/09514848261512646", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "医療組織の最高財務責任者（CFO）の経歴と社外の兼務が、その組織の財務成績・運営成績・財務困窮の起こりやすさと結びつくことを示した（抄録）。", "p3": "CFOの職歴（会計の経験、医療の経験）を人的資本、他社での兼務を社会関係資本として測り、財務成績と運営成績、財務困窮の確率との関連を調べた（抄録）。", "p5": "会計の経験を持つCFOは運営成績を有意に高めるが財務成績には有意な影響がなく、医療の経験を持つCFOは収益に寄与するが運営成績には負の影響があった。兼務は財務成績に正の影響を持つ。会計の経験は財務困窮の確率を下げ、医療の経験と兼務は上げた（抄録）。", "fun": "病院の「お金の責任者」には、会計畑の人と医療畑の人のどちらが向いているのでしょうか。この研究では、会計の経験を持つ責任者のいる組織は運営の成績がよく、財務的に行き詰まる確率も低い一方、医療の経験を持つ責任者は収入を増やすことには寄与しても運営の成績は下がっていました。経歴によって得意な面が違うという結果です。", "unverified": "標本の国・期間・組織数、成績の指標の定義、係数の大きさは抄録に記載がなく未確認。"}}, {"id": "jr27", "rank": 27, "headline": "小売店のブランド力の尺度が実際の購買額と結びつく", "title": "Linking Consumer‐Based Retailer Brand Equity to Consumer Behavior Across Goals, Retailers and Countries", "url": "https://doi.org/10.1002/mar.70313", "authors": "Huda K. Maulana ほか", "venue": "Psychology and Marketing", "date": "2026-11-27", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Maulana, H. K., Sigurdsson, V., Larsen, N. M., & Folwarczny, M. (2026). Linking Consumer‐Based Retailer Brand Equity to Consumer Behavior Across Goals, Retailers and Countries. Psychology & Marketing. https://doi.org/10.1002/mar.70313", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "小売店のブランドの強さを店舗の具体的な側面から測る尺度が、買い物の場面や業態や国が変わっても通用し、実際の購買額ともある程度結びつくことを確かめた（抄録）。", "p3": "被験者間（研究1）と混合（研究2）の実験で、考える深さと人目を気にする度合いの異なる買い物の場面を系統的に変え、研究3では参加者から得た取引データで月間支出・平均の買い物額・購買頻度との関連を調べた（抄録）。", "p5": "尺度の指標は、買い物の種類、主流・高級の小売、2か国をまたいで来店意向と頑健に関連した。取引データでは、主流のSainsbury'sで月間支出と有意に、平均の買い物額とわずかに関連し、頻度とは関連しなかった。ディスカウントのAldiでは3つすべてと有意に関連した（抄録）。", "fun": "アンケートで答えた店への評価は、本当に財布の動きと結びついているのでしょうか。この研究は、店の評価の点数と、同じ人の実際の買い物の記録を突き合わせました。ある店では、点数は月に使う金額とは結びつくのに、買い物の回数とは結びつきませんでした。別の店では、どちらとも結びついていました。気持ちと行動のつながりは、店の種類によって違うようです。", "unverified": "各研究の参加者数、尺度の項目、関連の大きさは抄録に記載がなく未確認。"}}, {"id": "jr28", "rank": 28, "headline": "共感に訴える表示で配送の遅れへの不満が和らぐ", "title": "Online shopping and the “need for speed”: invoking sympathy to alleviate pressure on last-mile delivery operations", "url": "https://doi.org/10.1108/ijlm-01-2026-0038", "authors": "Amer Jazairy ほか", "venue": "International Journal of Logistics Management", "date": "2026-11-27", "sjr": 2.113, "citescore": 19.7, "citescore_year": "2025", "apa": "Jazairy, A., Tokar, T., Glassburner, A., & Sörqvist, P. (2026). Online shopping and the “need for speed”: invoking sympathy to alleviate pressure on last-mile delivery operations. The International Journal of Logistics Management, 37(7), 412–448. https://doi.org/10.1108/ijlm-01-2026-0038", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ネット通販の会計画面で、社会や環境への共感を促すメッセージを見せると、客が長い配送を受け入れ、遅配にも寛容になることを示した（抄録）。", "p3": "米国の2,209人を対象にしたシナリオに基づく混合計画の実験で、共感を促す会計時のメッセージ（社会への訴え、環境への訴え、両方）が配送の選択と顧客満足に与える影響を調べた（抄録）。", "p5": "共感を促すメッセージは長く待つ意向を高め、遅配のときも満足はおおむね保たれた。環境への訴えは社会への訴えより頑健で、急ぎの買い物でも不満を和らげたが、社会への訴えは急がない買い物でだけ効いた。2つを1つのメッセージにまとめても、片方だけの場合を上回らなかった（抄録）。", "fun": "配送をどんどん速くする競争は、現場の運営に負担をかけ、環境や社会にも費用を生みます。この実験では、注文の会計の画面に共感を促すメッセージを添えると、客は長く待つ配送を受け入れやすくなり、遅れて届いても寛容でした。意外なのは、社会と環境の2つの訴えを両方載せても、片方だけの場合を上回らなかったことです。", "unverified": "待つ意向や満足の変化の大きさ、メッセージの具体的な文面は抄録に記載がなく未確認。シナリオ実験であり、実際の購買での検証ではない。"}}, {"id": "jr29", "rank": 29, "headline": "LLMの出版後査読は粗い選別なら専門家に近い", "title": "Large language models for post‐publication peer review: Evidence from expert recommendations and citation indicators", "url": "https://doi.org/10.1002/asi.70139", "authors": "Mengjia Wu ほか", "venue": "Journal of the Association for Information Science and Technology (JASIST)", "date": "2026-11-27", "sjr": 1.23, "citescore": 10.6, "citescore_year": "2025", "apa": "Wu, M., Zhang, Y., Haunschild, R., & Bornmann, L. (2026). Large language models for post‐publication peer review: Evidence from expert recommendations and citation indicators. Journal of the Association for Information Science and Technology. https://doi.org/10.1002/asi.70139", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "出版後の論文を専門家が推薦する場の判断を基準に、LLMが論文の質の評価をどこまで支援できるかを測り、粗い選別なら使えるが細かな評価はまだ難しいことを示した（抄録）。", "p3": "出版後査読の場H1 Connectから、推薦するかどうかの判定（課題1）と、推薦論文の評点・分類・専門家風のコメント（課題2）を作り、BERT系、汎用のLLM、推論型のLLMを、零ショット・少数例・教師ありの微調整で比べた（抄録）。", "p5": "課題1は教師ありの微調整で正解率0.8超、適合率と再現率も両クラスで0.8を超えた。課題2は0.5未満にとどまる。少数例は零ショットをやや上回り、微調整が最良だった。出力と被引用の指標の相関は課題1で0.63（順位双列相関）、課題2で0.45（スピアマン）だった（抄録）。", "fun": "論文の質を見きわめるのは、専門家にとっても手間のかかる仕事です。この研究は、AIに専門家と同じ判断ができるかを試しました。「推薦するかしないか」の判定なら正解率は0.8を超えますが、評点や分類まで細かく求めると0.5に届きません。粗いふるい分けの手伝いはできても、専門家の評価の代わりにはまだなれない、という結果です。", "unverified": "データの件数、分野の内訳、各モデルの個別の成績は抄録に記載がなく未確認。"}}, {"id": "jr30", "rank": 30, "headline": "LLMの認知は人に「でこぼこに」似ている", "title": "How human-like is LLM cognition?", "url": "https://doi.org/10.1016/j.cobeha.2026.101700", "authors": "Zak Hussain ほか", "venue": "Current Opinion in Behavioral Sciences", "date": "2026-11-26", "sjr": 1.363, "citescore": 7.5, "citescore_year": "2025", "apa": "Hussain, Z., Mata, R., & Wulff, D. U. (2027). How human-like is LLM cognition? Current Opinion in Behavioral Sciences, 73, 101700. https://doi.org/10.1016/j.cobeha.2026.101700", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "LLMの認知が人にどれだけ似ているかをめぐる研究を整理し、似ている度合いは一様ではなく、側面ごとにでこぼこがあるという見取り図を示した（抄録）。", "p3": "人とLLMを比べる研究を、何を比べるか（システムの仕様、内部の状態、行動）と、そこからどんな推論を引き出すかで大きな評価の区分に分け、人らしさを支持する結果と疑問を投げる結果の典型的な型をまとめた総説（抄録）。", "p5": "得られる像は「ぎざぎざの一致」で、人らしさは全体として成り立つのではなく次元によって変わる。こうした類似と相違を調べることは、人工のシステムの働きだけでなく、認知科学の概念の土台を明確にするのにも役立つと論じる（抄録）。", "fun": "「AIは人間のように考えているのか」という問いに、はい・いいえで答えるのは難しいです。この総説は、たくさんの研究を並べ直して、AIの人らしさは全体として成り立つのではなく、見る側面によって変わると結論しています。どこが似ていてどこが違うかを調べること自体が、人の心の仕組みを考え直す手がかりになる、という指摘も面白い点です。", "unverified": "整理の対象にした研究の数と、区分ごとの具体例は抄録に記載がなく未確認。"}}, {"id": "jr31", "rank": 31, "headline": "自信の低い判定だけ人に聞くと自動採点が人に近づく", "title": "Evaluating human-in-the-loop approaches for the automated coding of open-ended pedagogical content knowledge measures", "url": "https://doi.org/10.1007/s10857-026-09798-3", "authors": "Kyle Moreno ほか", "venue": "Journal of Mathematics Teacher Education", "date": "2026-11-27", "sjr": 1.355, "citescore": 5.6, "citescore_year": "2025", "apa": "Moreno, K., Chu, Y., Copur-Gencturk, Y., & Tang, J. (2026). Evaluating human-in-the-loop approaches for the automated coding of open-ended pedagogical content knowledge measures. Journal of Mathematics Teacher Education. https://doi.org/10.1007/s10857-026-09798-3", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "教員の自由記述の回答をLLMで自動採点するとき、LLMの確信が低い判定だけ人に確認を求めるやり方が、人の採点に最も近づくことを示した（抄録）。", "p3": "複数のLLMエージェントによる採点システムの中に、人を介在させる3つの方法を組み込み、教授学的内容知識（PCK：教える内容をどう教えるかの知識）を測る6つの自由記述項目に対する268人の教員の回答で、人の採点との一致を比べた（抄録）。", "p5": "確信の低い採点の判断を明確にするために人の入力を求める方法が、全体として人の採点者との記述的な一致が最も高かった。ただし優位の大きさと一貫性は項目によって異なった（抄録）。", "fun": "記述式の回答の採点は、人がやると時間と手間がかかります。AIに任せたいところですが、AIの採点が人とずれることがあります。そこで、AIの確信が低い判定だけ人に確かめてもらう方法を試したところ、3つの方法の中で人の採点に最も近くなりました。全部を人が見るのでも全部をAIに任せるのでもない、分業のしかたの研究です。", "unverified": "一致度の数値、3つの方法の具体的な違い、使ったLLMは抄録に記載がなく未確認。"}}, {"id": "jr32", "rank": 32, "headline": "医療従事者のAIへの態度と不安を44研究で整理", "title": "Attitudes and anxiety toward artificial intelligence among healthcare professionals and students: a systematic review", "url": "https://doi.org/10.1186/s12912-026-05534-7", "authors": "Prerna ほか", "venue": "BMC Nursing", "date": "2026-11-27", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Prerna, Yadav, R., & Jelly, P. (2026). Attitudes and anxiety toward artificial intelligence among healthcare professionals and students: a systematic review. BMC Nursing. https://doi.org/10.1186/s12912-026-05534-7", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "医療従事者と医療系の学生がAIをどう受け止め、どんな不安を持っているかを、44の調査研究から整理した（抄録）。", "p3": "PRISMA 2020に沿い、5つのデータベースで2016年1月〜2026年1月の横断・観察研究を2人が独立に検索し、JBIのチェックリストで質を評価した。146件から44の横断研究（28,452人、19か国、トルコと中東が中心）を採用した（抄録）。", "p5": "多くの研究がAIへの好意的な態度を報告したが、対象と測定の道具によってばらついた。AIへの不安はトルコの標本でだけ報告された。事前の訓練や知識が好意的な態度や低い不安と結びついた研究は少数で、年齢や職位の結果はまちまちだった。自作の尺度が多く、統合した推定値ではなく質的な要約として読むべきだと著者は述べる（抄録）。", "fun": "医療の現場の人はAIをどう見ているのでしょうか。44の調査を集めてみると、好意的な態度を報告する研究が多数でした。ただし、ここに落とし穴があります。態度を調べた研究の多くが、それぞれ自分で作った質問を使っていて、数値をまとめて1つの推定にできないのです。ものさしがばらばらだと、たくさん集めても確かなことが言いにくい、という教訓も読み取れます。", "unverified": "不安の報告の具体的なパターンと、各研究の効果の大きさは抄録に記載がなく未確認。"}}, {"id": "jr33", "rank": 33, "headline": "弧長法とフェーズフィールドで不安定破壊の経路を追う", "title": "Damage and energy evolution in 2D and 3D: Insights from an arc-length-controlled phase-field method", "url": "https://doi.org/10.1177/10567895261510124", "authors": "Yijun Chen ほか", "venue": "International Journal of Damage Mechanics", "date": "2026-11-27", "sjr": 0.921, "citescore": 8.5, "citescore_year": "2025", "apa": "Chen, Y., Xu, B., Qin, X., Liu, X., Zhang, S., & Zhao, H. (2026). Damage and energy evolution in 2D and 3D: Insights from an arc-length-controlled phase-field method. International Journal of Damage Mechanics. https://doi.org/10.1177/10567895261510124", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "き裂が一気に進む不安定な破壊の途中で、エネルギーの内訳とき裂の長さ・体積がどう推移するかを、荷重と変位が戻る経路まで追える計算で調べた（抄録）。", "p3": "スナップバックを伴う脆性破壊を扱える、経路追従の拘束つきフェーズフィールド破壊モデル（き裂をぼかした場で表す方法）を使い、非線形有限要素法の中でエネルギー成分を定量的に計算する。切り欠きや偏心した穴を持つ2次元・3次元の6つの例題で、標準のニュートン法と比べた（抄録）。", "p5": "モードIと混合モードの複雑な破壊の仕組みを再現でき、3次元のねじれるき裂の形は既存の実験の観察とよく一致した。材料特性と形状が、全体の荷重–変位応答やエネルギー成分、き裂の長さ・体積の推移に与える影響をパラメータ解析で調べた（抄録）。", "fun": "もろい材料は、ある瞬間に一気に割れます。この「一気に割れる」途中では、荷重と変位の関係が折り返すことがあり、ふつうの解き方では追いかけにくくなります。この研究は、解の経路に沿って少しずつ進む方法（弧長法）を使い、割れていく最中のエネルギーの内訳と、き裂の長さや体積の変化を計算しました。壊れる瞬間の中身をのぞく試みです。", "unverified": "エネルギー成分の数値、ニュートン法との差の大きさは抄録に記載がなく未確認。"}}, {"id": "jr34", "rank": 34, "headline": "支援者との対話の主観的な経験を測る尺度（日本）", "title": "Development and Initial Psychometric Evaluation of the Subjective Experience of Dialogue with Supporters Scale (SEDS-U) for People Diagnosed with Schizophrenia Receiving Mental Health Services: A Cross-Sectional Study.", "url": "https://doi.org/10.1007/s10597-026-01761-z", "authors": "Fukushi H ほか", "venue": "Community mental health journal", "date": "2026-11-26", "sjr": 0.808, "citescore": 4.1, "citescore_year": "2025", "apa": "Fukushi, H., Saito, T., Morita, N., & Ogai, Y. (2026). Development and Initial Psychometric Evaluation of the Subjective Experience of Dialogue with Supporters Scale (SEDS-U) for People Diagnosed with Schizophrenia Receiving Mental Health Services: A Cross-Sectional Study. Community Mental Health Journal. https://doi.org/10.1007/s10597-026-01761-z", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "統合失調症の診断を受けた人が、支援者との対話をどう経験しているかを測る尺度を作り、3つの下位尺度からなる暫定版を得た（抄録）。", "p3": "日本の横断研究で、23項目の質問紙を利用者108人に実施し、全項目に回答した101人で、多分相関に基づく並行分析と探索的因子分析、同じ標本での順序尺度の推定（WLSMV）を行い、信頼性・弁別妥当性・高次の構造・well-beingや孤独感との関連を調べた（抄録）。", "p5": "1項目を除いた22項目で、尊重された自律、価値ある理解、対話への関与と内省の3因子が示された。内的一貫性は高い（α=0.869〜0.918、ω=0.874〜0.922）が、絶対的な適合は不十分で、2つの因子の弁別は混在した結果だった。双因子分析では一般因子の比重が大きい（説明される共通分散0.700）。独立した追試が必要と著者は述べる（抄録）。", "fun": "支援者との対話をどう感じたかは、支援を受ける人にとって大切ですが、目に見えません。この研究は、その感じ方を22の質問で数値にする「ものさし」を作ろうとしました。面白いのは、著者が弱点を隠さず書いていることです。因子が2つか3つかは僅差で、モデルの当てはまりも十分ではありません。ものさし作りは一度で終わらず、別の集団で確かめ直す必要があります。", "unverified": "各項目の文言、well-beingや孤独感との相関係数の値は抄録に記載がなく未確認。"}}, {"id": "jr35", "rank": 35, "headline": "LLMは経営学の知を劣化させるかをめぐる反論", "title": "Complex analyses for complex problems: Beyond the pathologization of Generative AI and the stigmatization of its use", "url": "https://doi.org/10.1177/00187267261508362", "authors": "Stratos Ramoglou ほか", "venue": "Human Relations", "date": "2026-11-27", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Ramoglou, S., & Cronin, M. A. (2026). Complex analyses for complex problems: Beyond the pathologization of Generative AI and the stigmatization of its use. Human Relations, 80(1), 34–47. https://doi.org/10.1177/00187267261508362", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "LLMの利用が経営学の知を必然的に劣化させるという主張に反論し、問題は技術そのものではなく、以前からある学問の選別の仕組みにあると論じた（抄録）。", "p3": "同じ議論の論考（Nolanらの主張：LLMは深い読みを損ない、研究者を現実から遠ざけ、同僚との関わりを減らし、成果を均質にする）への反論の論考で、システムの水準の要因とフィードバックのループの考え方から論じる（抄録）。", "p5": "知の蓄積は個人の誤用ではなくシステムの水準で決まること、相手の決定論的なモデルは強め合うループだけを捉え、技術の生産的な利用による正の動きと、希少性の価値や門番の強化という均衡をとる二次的な効果を見落としていること、懐疑の背景に意味の実体化と知能の擬人的な理解があることを指摘する（抄録）。", "fun": "「AIを使うと学問の知識が劣化する」という主張に、この論考は「それは技術のせいだろうか」と問い返します。問題を生んでいるのはAIが登場する前からあった仕組みの弱さ、とくに良いものを選び分ける仕組みの弱さで、AIはそれを差し迫ったものにしただけだ、という見方です。道具を悪者にする前に、もともとの仕組みを直すべきだという議論です。", "unverified": "実証データに基づく論文ではなく論考である。反論の対象の論考の詳細と、根拠にした文献は本文を入手できず未確認。"}}, {"id": "jr36", "rank": 36, "headline": "輪軸・軌道系の状態をカルマンフィルタで観測", "title": "State observation of the wheelset-track system: theoretical background, Kalman filter design and experimental results", "url": "https://doi.org/10.1016/j.mechmachtheory.2026.106701", "authors": "Miguel Rodríguez ほか", "venue": "Mechanism and Machine Theory", "date": "2026-11-26", "sjr": 1.574, "citescore": 12.0, "citescore_year": "2025", "apa": "Rodríguez, M., Urda, P., & Escalona, J. L. (2026). State observation of the wheelset-track system: theoretical background, Kalman filter design and experimental results. Mechanism and Machine Theory, 232, 106701. https://doi.org/10.1016/j.mechmachtheory.2026.106701", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"ba
