ciated with increased wellbeing? Evidence from the panel study of income dynamics", "url": "https://doi.org/10.1016/j.cities.2026.107858", "authors": "William A.V. Clark", "venue": "Cities", "date": "2026-11-26", "sjr": 1.772, "citescore": 11.5, "citescore_year": "2025", "apa": "Clark, W. A. V. (2026). Is being happy with your city and connected to the neighborhood associated with increased wellbeing? Evidence from the panel study of income dynamics. Cities, 180, 107858. https://doi.org/10.1016/j.cities.2026.107858", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録も入手できなかったため題名のみ", "preprint": false, "short": true, "p1": "題名から、自分の住む街への満足と近隣とのつながりが、well-beingの高さと関連するかを、米国の所得動態パネル調査（PSID）のデータで調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「この街に満足している」「近所とつながっている」と感じることは、その人の幸せと関係があるのでしょうか。題名からは、同じ世帯を繰り返し調べるパネル調査を使って、この問いを確かめようとする研究だと読み取れます。街の良さを、住む人の気持ちから測ろうとする視点が面白い点です。結果は確認できていません。", "unverified": "抄録・本文を入手できず、分析の年次、指標の定義、関連の有無と大きさはすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "企業の考える資本コストは市場の期待収益とずれている", "title": "Firms’ Perceived Cost of Capital", "url": "https://doi.org/10.1093/qje/qjag056", "authors": "Niels Joachim Gormsen ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-25", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Gormsen, N. J., & Huber, K. (2026). Firms’ Perceived Cost of Capital. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag056", "why": "企業が自社の資本コストをどう認識しているかを、手作業で集めたデータで分析した。市場が非効率でも、企業は認識する資本コストを負債と株式の期待収益に等しく置けば現在の市場価値を最大にできる。しかし実際の認識のばらつきは期待収益のばらつきではほとんど説明できず、CAPMに基づく「公正価値」の基準で半分、証券アナリストの期待収益の信念で大半が説明できる。この歪みが資本配分を通じて全体の生産性を大きく下げうることを数量モデルで示した。"}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "文書に潜む交絡をBERTの埋め込みで自動的に統制", "title": "Correcting the Unobserved Textual Confounding Factors in Regression by BERT and Partially Linear Regression", "url": "https://doi.org/10.1287/mnsc.2024.04758", "authors": "Mengke Qiao ほか", "venue": "Management Science", "date": "2026-11-26", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Qiao, M., & Huang, K.-W. (2026). Correcting the Unobserved Textual Confounding Factors in Regression by BERT and Partially Linear Regression. Management Science. https://doi.org/10.1287/mnsc.2024.04758", "why": "口コミの感情などテキストから作った説明変数を回帰に入れるとき、同じ文書に含まれる他の情報が交絡になる。手作りの統制変数では取りこぼしが起きるため、BERTの埋め込みから統制変数のベクトルを自動で作り、主要な説明変数の線形項と、テキストの統制の未知関数項を持つ部分線形モデルとして推定する方法を提案した。二重機械学習の枠組みを、ネイマン直交な損失関数を持つ1つの深層ネットワークに広げ、推定の偏りが減ることを実験で示した。"}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "出身国どうしの対立で国籍混成の共同創業が減る", "title": "Echoes of Discord: The Effects of Global Conflicts and Disputes on Entrepreneurship", "url": "https://doi.org/10.1287/mnsc.2025.04559", "authors": "Astrid Marinoni", "venue": "Management Science", "date": "2026-11-26", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Marinoni, A. (2026). Echoes of Discord: The Effects of Global Conflicts and Disputes on Entrepreneurship. Management Science. https://doi.org/10.1287/mnsc.2025.04559", "why": "創業者の出身国の間で地政学的な対立や紛争が起きると、その国籍どうしの共同創業が減ることを、英国で設立されたスタートアップの創業者データと世界の紛争の情報で示した。資源や機会の喪失よりも、人間関係の損傷という社会的な経路と整合する。同じ地域に両国の出身者が多く住む場合や、相手の国籍の人と以前に接点があった創業者では影響が弱い。減った分は単独創業や同国人との創業では埋め合わされない。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "知財保護の弱い国の企業は人材採用で飛躍しにくい", "title": "Hiring talent in technologically advanced countries: The paradox of springboarding for firms from weak intellectual property rights ( IPR ) regimes", "url": "https://doi.org/10.1002/smj.70140", "authors": "Victor Cui ほか", "venue": "Strategic Management Journal", "date": "2026-11-27", "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "apa": "Cui, V., Xiang, Q., Li, J., & Zhang, J. (2026). Hiring talent in technologically advanced countries: The paradox of springboarding for firms from weak intellectual property rights ( IPR ) regimes. Strategic Management Journal. https://doi.org/10.1002/smj.70140", "why": "知的財産権の保護が弱い国の多国籍企業が、先進国での人材採用で技術的に飛躍するという通説を、米国で活動する29か国486社のデータと発明者への面接で検証した。本国の知財の評判が悪いと優れた発明者が入社を避け、採用できても本国由来の知財の慣行が採用後の学習を縛り、漸進的な改良にとどまる。この制約は、企業が米国で特許侵害訴訟を経験していると和らぐ。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "競合にも卸す供給者は掛け売りでリスクを下げられる", "title": "Reducing Risk Through Trade Credit: Theory and Evidence from Dual-Channel Suppliers", "url": "https://doi.org/10.1287/mnsc.2025.03142", "authors": "Jie Ning ほか", "venue": "Management Science", "date": "2026-11-26", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Ning, J., Tang, S. Y., Wu, J., & Zhu, J. (2026). Reducing Risk Through Trade Credit: Theory and Evidence from Dual-Channel Suppliers. Management Science. https://doi.org/10.1287/mnsc.2025.03142", "why": "掛け売りは供給者のリスクを高めるという通説に対し、自社で最終顧客に売りつつ同業者にも卸す二重経路の供給者では逆になりうることを、ゲーム理論のモデルと米国の製造業のデータで示した。両者の市場が大きく重なると、自社の直販と買い手からの掛け代金の支払いが負に連動してリスクが均される。ただし負債の多い供給者では掛け売りがリスクを高め、データでも、同業者への販売を始めた後は掛け売りと倒産リスクの正の関連が弱まるか逆転した。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "価格付け誤差を特性で説明できる分と残りに分けて検定", "title": "Inferential Theory for Pricing Errors with Latent Factors and Firm Characteristics", "url": "https://doi.org/10.1287/mnsc.2025.04971", "authors": "Jungjun Choi ほか", "venue": "Management Science", "date": "2026-11-26", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Choi, J., & Yuan, M. (2026). Inferential Theory for Pricing Errors with Latent Factors and Firm Characteristics. Management Science. https://doi.org/10.1287/mnsc.2025.04971", "why": "潜在因子と企業特性を組み合わせた因子モデルで、価格付けの誤差（アルファ）を、企業特性で説明できるが因子への感応度と直交する「内側」と、因子にも特性にも直交する「外側」に分けて推定・推測する枠組みを示した。低ランクの手法に偏りの補正を加えた推定量を閉じた形で与え、特性の数が増える場合にも成り立つ推測理論を導いた。2000〜2019年の米国株で両方のアルファの強い証拠を見いだした。"}, {"id": "jn07", "rank": 7, "field": "地球科学", "headline": "光ファイバーでM2の地震の破壊を千分の1秒単位で撮る", "title": "Millisecond-scale imaging of fragmented earthquake rupture by near-source fiber-optic sensing", "url": "https://doi.org/10.1126/science.aei0507", "authors": "Sangwoo Han ほか", "venue": "Science", "date": "2026-11-26", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Han, S., Kim, Y., Kim, J., Nayak, A., Yin, F., & Ajo-Franklin, J. (2026). Millisecond-scale imaging of fragmented earthquake rupture by near-source fiber-optic sensing. Science, 394(6827), 996–1001. https://doi.org/10.1126/science.aei0507", "why": "小さな地震は単純な円形の破壊として扱われてきたが、震源近くの光ファイバーによる分布型音響センシングで、カリフォルニアのブローリー地震帯の群発地震中のマグニチュード2の地震の破壊を、ミリ秒の単位で画像化した。42ミリ秒離れた2回の破壊があり、いったん止まった破壊が動的に再び始まったことを示す。3時間の系列では、隣り合う断層の小区画がほとんど重ならずに順に活動していた。"}, {"id": "jn08", "rank": 8, "field": "地震工学・防災", "headline": "日本の強震記録の6.8%が設計スペクトルを超える", "title": "Insights From Frequent Observations of Ground Motions Exceeding the Japanese Design Spectrum", "url": "https://doi.org/10.1002/esp4.70147", "authors": "Suguru Imazeki ほか", "venue": "Earthquake Spectra", "date": "2026-11-25", "citescore": 7.7, "citescore_year": "2025", "apa": "Imazeki, S., Baker, J. W., & Nakashima, M. (2026). Insights From Frequent Observations of Ground Motions Exceeding the Japanese Design Spectrum. Earthquake Spectra, 43(1). https://doi.org/10.1002/esp4.70147", "why": "K-NETとKiK-netの1996〜2024年の強震記録13,473件（計測震度3.5以上）を、建築基準法の設計スペクトルと比べた。921件（6.8%）がいずれかの周期で超過し、超過は短周期（0.08〜0.13秒）に集中して2秒より長い周期ではまれだった。超過記録の95%は幅0.5秒未満の狭い帯域で起きる。全国の一様ハザードスペクトルとの比較から、設計スペクトルの暗黙の再現期間は短周期で約100年、長周期で2,475年超と周期によって大きく違うことを示した。"}, {"id": "jn09", "rank": 9, "field": "因果推論", "headline": "分布の距離EMDは標本だけで上に偏る", "title": "The Earth Moves, but So Does the Bias: Systematic Upward Bias of the Wasserstein (Earth-Mover) Distance and Permutation-Based Null Calibration", "url": "https://doi.org/10.1017/pan.2026.10072", "authors": "Ho Ting Hung", "venue": "Political Analysis", "date": "2026-11-27", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "apa": "Hung, H. T. (2026). The Earth Moves, but So Does the Bias: Systematic Upward Bias of the Wasserstein (Earth-Mover) Distance and Permutation-Based Null Calibration. Political Analysis, 1–16. https://doi.org/10.1017/pan.2026.10072", "why": "選好の分布の近さを測るのに使われるアースムーバー距離（ワッサースタイン距離）は、経験分布の標本変動のために上に偏り、高次元や疎なデータ（コンジョイントの分布など）で偏りが大きくなることを示した。通常のブートストラップの区間はこの偏りの補正にならない。分布の形の仮定を置かない、並べ替えによる帰無分布の較正を提案し、4組のモンテカルロ実験で有用性を確かめた。"}, {"id": "jn10", "rank": 10, "field": "機械学習", "headline": "体の非線形な共振から四足歩行の歩容が生まれる", "title": "Exploring nonlinear body oscillations for natural quadruped gaits", "url": "https://doi.org/10.1038/s42256-026-01320-x", "authors": "Annika Schmidt ほか", "venue": "Nature Machine Intelligence", "date": "2026-11-27", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "apa": "Schmidt, A., Calzolari, D., Sachtler, A., Loeffl, F. C., Seidel, D., Hermann, M., Burger, R., Gumpert, T., Raffin, A., Ehlert, T., Pries, M., Wandinger, D., Schmidt, F., Keppler, M., Lee, J., & Albu-Schäffer, A. (2026). Exploring nonlinear body oscillations for natural quadruped gaits. Nature Machine Intelligence, 8(11), 1718–1732. https://doi.org/10.1038/s42256-026-01320-x", "why": "動物は体の共振を使って制御の負担を減らすが、四足ロボットの多くは非線形な動力学の複雑さからそれを利用していない。設計の段階でロボットの非線形な動力学を予測できるようにする理論の枠組みを示し、柔らかい四足ロボットeBertで6つの非線形ノーマルモードを特定して、シミュレーションと実機で確かめた。各モードが異なる速度の歩容に自然に育ち、多くが実機にも移ることを示した。"}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "物価が上がるほど企業は競合の値動きに強く反応する", "title": "A Signal-Extraction Theory of Inflation Pass-Through", "url": "https://doi.org/10.1093/ej/ueag149", "authors": "Engin Kara", "venue": "Economic Journal", "date": "2026-11-26", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "apa": "Kara, E. (2026). A Signal-Extraction Theory of Inflation Pass-Through. The Economic Journal. https://doi.org/10.1093/ej/ueag149", "why": "企業は部門の価格変動が、持続的な全体の変動と一時的な部門固有の変動のどちらを映すかを推し量るという、状態に依存する信号抽出の理論を示した。インフレが低いと、価格の硬直的な企業は競合の値動きを割り引いて受け取る。インフレが高まると全体の要因とみなして強く反応する。英国のミクロの価格データで、部門のインフレ率が約1.9%を下回ると硬直的な企業の反応が弱く、上回ると差が消えることを確かめた。"}, {"id": "jn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "創造的な作業は没頭を通じて前向きな気分を高める", "title": "Can Workplace Creativity Increase Positive Affect Through Absorption? The Moderating Roles of Negative Affect and Competitive Climate", "url": "https://doi.org/10.1002/job.70138", "authors": "March L. To ほか", "venue": "Journal of Organizational Behavior", "date": "2026-11-27", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "apa": "To, M. L., Yeo, G., & Fisher, C. D. (2026). Can Workplace Creativity Increase Positive Affect Through Absorption? The Moderating Roles of Negative Affect and Competitive Climate. Journal of Organizational Behavior. https://doi.org/10.1002/job.70138", "why": "職場の創造性は感情の結果として研究されることが多いが、創造的な過程への取り組みが没頭を通じて前向きな感情を高めるという逆の向きを、実験室実験と経験サンプリングの現場調査で確かめた。実験では否定的な感情が高いときにこの効果が現れた。現場調査では、創造性を競い合う風土がこの効果を弱めることを示した。"}, {"id": "jn13", "rank": 13, "field": "地球科学", "headline": "粗い断層帯がM8.8カムチャツカ地震の入り口になった", "title": "Rough fracture zone as a gateway to the 2025 M w 8.8 Kamchatka earthquake", "url": "https://doi.org/10.1126/science.aef2089", "authors": "Haipeng Luo ほか", "venue": "Science", "date": "2026-11-26", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Luo, H., Tan, F., Ma, Z., Chen, K., Zhang, J., Wang, X., Xu, S., Carvajal, M., Xu, H., Yun, S.-H., & Chen, L. (2026). Rough fracture zone as a gateway to the 2025 M w 8.8 Kamchatka earthquake. Science, 394(6827), 1002–1006. https://doi.org/10.1126/science.aef2089", "why": "粗い断層の区間は巨大地震を止める場所とされてきたが、2025年のモーメントマグニチュード8.8のカムチャツカ地震は粗い区間で始まったとみられることを示した。最初の約50秒は、すべりは小さいが高周波の放射が強く散らばった緩慢な破壊で、その後、南の滑らかな区間に進んで20m超のすべりを生んだ。粗い区間でも、固着した滑らかな区間と空間的につながると巨大な破壊を育てうるとして、ハザード評価への考慮を促す。"}, {"id": "jn14", "rank": 14, "field": "地球科学", "headline": "記録的高温の2023〜24年に世界の地表水が急減", "title": "Abrupt surface water decline during 2023–2024 record warming", "url": "https://doi.org/10.1126/science.aei2575", "authors": "Yongqiang Zhang ほか", "venue": "Science", "date": "2026-11-26", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Zhang, Y., Wang, X., Xia, J., Li, C., Li, X., Xu, Z., Tian, J., Zhao, G., Xie, Y., Zhang, X., Ma, N., Wei, H., Huang, Q., Wang, L., Chaffe, P. L. B., Destouni, G., Chiew, F. H. S., Murray, A. M., Yuan, X., et al. (2026). Abrupt surface water decline during 2023–2024 record warming. Science, 394(6827), 1027–1032. https://doi.org/10.1126/science.aei2575", "why": "150の主要流域の同化した流量観測と、120万を超える水域の衛星データから、記録的な高温だった2023〜2024年に、世界の流量と地表水の貯留が同時に減ったことを示した。減少は1991年以降で最大で、世界の流量の減少の70.4±4.2%を南米が占めた。エルニーニョと熱帯北大西洋の昇温が重なって大規模な下降気流と水蒸気の発散を起こし、干ばつを強めたと説明する。"}, {"id": "jn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "急成長期の会社に残るかは人により重視点が違う", "title": "Growing Together or Growing Apart? The Role of Person‐Company Fit, Professional Links, and Stock‐Options Sacrifice for Employee Retention in Scale‐Ups", "url": "https://doi.org/10.1002/hrm.70109", "authors": "Petrit Ademi ほか", "venue": "Human Resource Management", "date": "2026-11-27", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "apa": "Ademi, P., & Stroe, S. (2026). Growing Together or Growing Apart? The Role of Person‐Company Fit, Professional Links, and Stock‐Options Sacrifice for Employee Retention in Scale‐Ups. Human Resource Management. https://doi.org/10.1002/hrm.70109", "why": "スタートアップが急成長期に入ると、入社時とは組織の形が変わる。意思決定の実験と従業員への面接から、会社との適合、職場の人間関係、手放すことになるストックオプションの3つが残留の意向に与える影響を調べ、従業員が各要素の価値を個人の好みによって異なる重みで評価していることを示した。職務への埋め込みと資源の保存の理論から、従業員の側に立った定着の理解を提示する。"}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "在宅勤務は妊娠の開示を自分で決めやすくする", "title": "Growing, but Not Necessarily Showing: Pregnancy in Remote Versus In‐Person Contexts", "url": "https://doi.org/10.1002/job.70139", "authors": "Aashna M. Waiwood ほか", "venue": "Journal of Organizational Behavior", "date": "2026-11-27", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "apa": "Waiwood, A. M., Allen, T. D., Lezcano, A. M., & Regina, J. (2026). Growing, but Not Necessarily Showing: Pregnancy in Remote Versus In‐Person Contexts. Journal of Organizational Behavior. https://doi.org/10.1002/job.70139", "why": "職場での妊娠は周囲に見えることを前提に研究されてきたが、在宅勤務はその前提を変える。質的・量的なデータから、在宅で働く時間が長いほど、開示を自分で決められるという感覚が強く、開示の相手が狭く、時期が遅くなることを示した。開示後も、妊娠した体や症状が目立ちにくく、周囲からの立ち入った発言が少ない。スティグマの見えやすさを理論に組み込む必要を論じる。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "在宅勤務が、妊娠を職場にいつ・誰に知らせるかという開示のしかたと、開示後の周囲の反応の受け止めを変えることを示した（抄録）。", "p3": "質的データと量的データの両方を使い、在宅で働く時間と、妊娠の開示と開示後に関わる認識・判断・経験との対応を調べた（抄録）。", "p5": "在宅で働く時間が長いほど、開示を自分で決められるという感覚が強く、開示する相手の範囲が狭く、時期が遅く、透明性のために開示する必要を感じにくい。開示後も、妊娠した体や症状が目立ちにくく、周囲が妊娠に気づいたり、しばしば立ち入った発言をしたりすることが少なかった（抄録）。", "fun": "職場での妊娠についての研究は、妊娠が周りの目に見える、あるいはやがて見えるようになることを当然の前提にしてきました。でも在宅勤務では、その前提が崩れます。この研究は、在宅で働く時間が長い人ほど、いつ誰に伝えるかを自分で決められ、周りから立ち入ったことを言われることも少ないと示しました。働く場所が変わると、偏見の受け方まで変わるという発見です。", "unverified": "標本の人数と国、質的・量的データの内訳、関連の大きさは抄録に記載がなく未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "携帯電話の関税は8%程度に下げても国内組立を保てる", "title": "Domestic Tariffs and Consumer Welfare in Developing Countries: Evidence From India", "url": "https://doi.org/10.1111/1756-2171.70076", "authors": "Jerónimo Callejas ほか", "venue": "RAND Journal of Economics", "date": "2026-11-27", "sjr": 4.617, "citescore": 4.3, "citescore_year": "2025", "apa": "Callejas, J., Chatterjee, C., & Mohapatra, D. P. (2026). Domestic Tariffs and Consumer Welfare in Developing Countries: Evidence From India. The RAND Journal of Economics. https://doi.org/10.1111/1756-2171.70076", "why": "インドの携帯電話の関税政策を対象に、企業が供給網・製品の品ぞろえ・価格を内生的に決める構造モデルを推定した。完成品への現行の輸入関税は国内での組立を大きく増やしているが、反実仮想では8%程度の低い関税でも同じ水準の組立を保て、消費者余剰は大きく増える。部品への追加の関税は、企業がインドに拠点を移す誘因を弱め、政策の目的を損ないうる。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "国内の製造業を育てるための関税が消費者の厚生にどう響くかを、インドの携帯電話産業で調べ、もっと低い関税でも国内組立を保てることを示した（抄録）。", "p3": "企業が供給網の選択肢・製品の品ぞろえ・価格を内生的に決める、インドの携帯電話産業の構造モデルを作り、関税を変えた場合の反実仮想のシミュレーションを行った（抄録）。", "p5": "完成品への現行の輸入関税は国内の組立を大きく増やしている。ただし約8%の低い関税でも同程度の組立水準を保て、消費者余剰は大きく増える。部品への追加の輸入関税は、企業がインドに事業を移す意欲をそぎ、政策の目的を損ないうる（抄録）。", "fun": "外国製の携帯電話に関税をかければ、メーカーは国内で組み立てるようになります。でも、買う人の負担も気になります。この研究は、企業の行動をモデルにして「もし関税が違っていたら」を計算しました。すると、関税を8%ほどに下げても国内の組立は同じくらい保たれ、買う人の得は大きく増えるという結果でした。高ければ高いほどよいわけではないのです。", "unverified": "現行の関税率、消費者余剰の増加額、モデルの推定に使ったデータは抄録に記載がなく未確認。"}}, {"id": "jn18", "rank": 18, "field": "政治学", "headline": "新しい陰謀論ほど反民主的な政策への支持を集める", "title": "Conspiracy theory communication framing and support for antidemocratic behavior", "url": "https://doi.org/10.1111/ajps.70092", "authors": "Frances Cayton ほか", "venue": "American Journal of Political Science", "date": "2026-11-27", "sjr": 6.539, "citescore": 12.4, "citescore_year": "2025", "apa": "Cayton, F., & Blackington, C. (2026). Conspiracy theory communication framing and support for antidemocratic behavior. American Journal of Political Science. https://doi.org/10.1111/ajps.70092", "why": "政治家が陰謀論を使って反民主的な政策を正当化するとき、有権者がどう評価するかを、ポーランドの2023年議会選挙と2025年大統領選挙の前後の3つの事前登録の調査実験と、21か国の調査データで調べた。陰謀論にはっきり訴える政治家は、ほのめかす政治家より反民主的な行動への支持を多く得るが、それは党派の手がかりのない新しい陰謀論に限られる。政治化が進むと動員の力を失い、同じ党派の支持者の間でも支持を下げうる。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "政治家が陰謀論を使って反民主的な政策を正当化するとき、その伝え方と陰謀論の新しさによって、有権者の支持が変わることを示した（抄録）。", "p3": "ポーランドの2023年議会選挙と2025年大統領選挙の前後に行った3つの事前登録の調査実験と、21か国の調査データを使い、陰謀論にはっきり訴える場合とほのめかす場合の反応を比べた（抄録）。", "p5": "陰謀論にはっきり訴える政治家は、ほのめかす政治家より反民主的な行動への支持を多く得る。ただしこの効果は、党派の手がかりのない新しい陰謀論で主に起きる。陰謀論が政治化すると動員の力を失い、同じ党派の支持者の間でさえ支持を下げうる（抄録）。", "fun": "政治家が陰謀論を持ち出すと、民主主義のルールを破るような政策への支持は集まるのでしょうか。実験の結果、効果が主に現れるのは、まだ党派の色がついていない「新しい」陰謀論をはっきり語ったときでした。時間がたって政治化すると動員の力は失われ、同じ党派の支持者の間でさえ支持を下げることがあります。陰謀論は万能の道具ではない、という結果です。", "unverified": "実験の参加者数、効果の大きさ、21か国のデータの出典は抄録に記載がなく未確認。"}}, {"id": "jn19", "rank": 19, "field": "化学・材料", "headline": "正に帯電した極細の孔が陽イオンを選んで通す", "title": "Counter-ion confinement reverses ion selectivity in subnanometer channels", "url": "https://doi.org/10.1126/science.aef1323", "authors": "Fangmeng Sheng ほか", "venue": "Science", "date": "2026-11-26", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Sheng, F., Ge, L., Wu, B., Li, X., & Xu, T. (2026). Counter-ion confinement reverses ion selectivity in subnanometer channels. Science, 394(6827), 1013–1019. https://doi.org/10.1126/science.aef1323", "why": "正に帯電したナノ流路は陰イオンを通しやすいというのが通常だが、孔径1nm未満の陽イオン性の共有結合性有機構造体の膜が、陽イオンを選んで通すことを報告した。対イオンが孔に閉じ込められて壁の近くの静電環境を反転させ、二次的な閉じ込め領域を作るためと説明する。混合塩の系でも共存イオンの競合を抑え、実用的な分離条件で高い選択性を保つ。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "正に帯電した極細の流路は陰イオンを通しやすいという通常の規則が、流路が1nm未満になると逆転し、陽イオンを選んで通すことを示した（抄録）。", "p3": "孔径1nm未満の流路を持つ陽イオン性の共有結合性有機構造体（COF：有機分子が規則正しくつながった多孔質の材料）の膜でイオンの輸送を調べた（抄録）。", "p5": "選択性の逆転は、対イオンが閉じ込められて流路の壁の内側の静電環境を反転させ、二次的な閉じ込め領域を作る効果から生じる。この仕組みは混合塩の系での共存イオンの競合も抑え、実用的な分離の条件でも高い選択性を保つ（抄録）。", "fun": "プラスの電気を帯びた流路は、マイナスのイオンを通しやすい。これがふつうの常識です。ところが流路を1ナノメートルより細くした膜では、逆にプラスのイオンが選ばれて通りました。流路に閉じ込められた対イオンが、壁の内側の電気の環境をひっくり返してしまうからだと説明されています。狭さが規則を逆転させる例です。", "unverified": "選択性の数値、対象のイオンの種類、膜の作り方は抄録に記載がなく未確認。"}}, {"id": "jn20", "rank": 20, "field": "地震工学・防災", "headline": "機能回復型の耐震設計は非構造部材の対策が割に合う", "title": "Functional Recovery Design for New Buildings: An Integrated Economic and Engineering Evaluation", "url": "https://doi.org/10.1002/esp4.70143", "authors": "Juan F. Fung ほか", "venue": "Earthquake Spectra", "date": "2026-11-25", "citescore": 7.7, "citescore_year": "2025", "apa": "Fung, J. F., Cook, D. T., Elsibaie, S., Zhang, Y., Sattar, S., Morris, P., Johnson, K. J., & Burton, H. V. (2026). Functional Recovery Design for New Buildings: An Integrated Economic and Engineering Evaluation. Earthquake Spectra, 43(1). https://doi.org/10.1002/esp4.70143", "why": "地震後に建物の機能が戻るまでの時間を設計目標にする「機能回復」設計について、工学的な性能評価と費用便益分析を組み合わせる道筋を示した。4つの構造形式・2種類の階数・構造と非構造の各種の対策の事例から、構造と非構造を組み合わせた対策が損失の低減と費用増のつり合いがよく、最大の利得は費用の小さい非構造部材の対策から得られると報告する。便益と費用が関係者の間で偏ることが普及の障害になりうる点も指摘する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "地震の後に建物が早く使えるようになることを目標にした設計が費用に見合うかどうかを、工学の評価と経済の評価を組み合わせて調べる道筋を示した（抄録）。", "p3": "機能回復を目標にした設計について、費用便益分析（BCA）で経済的な根拠を示す手順を整理し、4つの構造形式、2種類の階数、構造・非構造のさまざまな対策にまたがる新築建物の事例で試算した（抄録）。", "p5": "結果は経済的な仮定に左右されるが、構造と非構造の対策を組み合わせると、損失の低減と費用の増加のつり合いがたいていの場合でよく、最大の利得は非構造部材の対策から得られた。非構造の改良は費用が比較的小さく、頻度の高い地震でのリスクを減らすためである。便益と費用が関係者の間で偏ることが普及の妨げになりうると指摘する（抄録）。", "fun": "地震のあと、建物がどれだけ早く使える状態に戻るかを目標にする設計が、次の世代の耐震設計として提案されています。その費用は見合うのでしょうか。試算では、骨組みの対策と骨組み以外の部分の対策を組み合わせるのがつり合いがよく、最も大きな得は骨組み以外の部分の対策から生まれました。費用が比較的小さいうえ、頻度の高い地震でも効くからです。", "unverified": "費用便益比の数値、対象の地域と地震ハザード、対策の具体的な中身は抄録に記載がなく未確認。"}}, {"id": "jn21", "rank": 21, "field": "地震工学・防災", "headline": "断層変位ハザードを部分破壊も含めて計算するコード", "title": "FaulTED: A Probabilistic Fault Displacement Hazard Code Exploring Floating Ruptures Scenarios and Epistemic Uncertainties", "url": "https://doi.org/10.1002/esp4.70140", "authors": "Selina Bonini ほか", "venue": "Earthquake Spectra", "date": "2026-11-23", "citescore": 7.7, "citescore_year": "2025", "apa": "Bonini, S., Scotti, O., Valentini, A., Visini, F., Pace, B., Tartaglia, G., Viola, G., & Vignaroli, G. (2026). FaulTED: A Probabilistic Fault Displacement Hazard Code Exploring Floating Ruptures Scenarios and Epistemic Uncertainties. Earthquake Spectra, 43(1). https://doi.org/10.1002/esp4.70140", "why": "地表の断層変位の確率と大きさを見積もる確率論的断層変位ハザード解析（PFDHA）のMATLABコードFaulTEDを示した。主断層上の変位と断層から離れた分散的な破壊の両方を扱い、断層の全長より短い破壊がその地点で起きる可能性（浮動破壊）を明示的に組み込む。地点ごとのハザード曲線と断層系のハザード地図を出力し、複数の既存モデルを入力ファイルで切り替えて認識論的不確実性を調べられる。2009年ラクイラ地震の断層系で例示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "地震のときに地表の断層がどれだけずれるかの確率を、断層の一部だけが破壊する場合も含めて計算できるMATLABのコードを作った（抄録）。", "p3": "確率論的断層変位ハザード解析（PFDHA）のコードで、規模と頻度の分布、断層のスケーリング則、地表破壊の確率モデルなど公表済みのモデルを組み込む。地点ごとのハザード曲線と、断層系ごとのハザード地図を出力し、入力ファイルでモデルを切り替えて比べられる（抄録）。", "p5": "主断層上の変位と、断層から離れた分散的な破壊の両方を扱い、断層の全長より短い破壊がその地点で起こる可能性（浮動破壊）を明示的に組み込んだ。2009年ラクイラ地震（本震Mw 6.3）で活動した中部アペニンの断層系の事例で、機能と使い道を示した（抄録）。", "fun": "地震で地表の断層がどれだけずれるかを、確率で見積もる方法があります。難しいのは、断層はいつも全長が動くわけではなく、一部だけが動くこともある点です。このコードは、そうした全長より短い破壊がその地点で起こる可能性まで勘定に入れます。使うモデルを入れ替えて、前提の違いで答えがどう変わるかを見られるのも特徴です。", "unverified": "事例でのハザード曲線の数値、コードの公開先とライセンスは抄録に記載がなく未確認。"}}, {"id": "jn22", "rank": 22, "field": "地震工学・防災", "headline": "1990年代に免震改修した歴史的建物を現行基準で再評価", "title": "Seismic Isolation Retrofit Following Early Design Standards: A Case Study", "url": "https://doi.org/10.1002/esp4.70141", "authors": "Ricardo Bustamante ほか", "venue": "Earthquake Spectra", "date": "2026-11-23", "citescore": 7.7, "citescore_year": "2025", "apa": "Bustamante, R., Mosqueda, G., Erler, K., Sepulveda, C., Del Carpio, M., Lopez, J., & Elwood, K. J. (2026). Seismic Isolation Retrofit Following Early Design Standards: A Case Study. Earthquake Spectra, 43(1). https://doi.org/10.1002/esp4.70141", "why": "1990年代初めに基礎免震で改修された歴史的建物を、現行の評価・設計の要件で調べ直した事例研究。上部構造の非線形応答、擁壁への衝突、免震装置の特性のばらつきを考慮して、免震層だけの変更で性能を満たす特性の範囲を探った。有効免震周期を延ばして上部構造への要求を減らし、補助の減衰を加えて免震層の変位を抑える組み合わせが有効で、臨界減衰の15%未満の粘性減衰と速度指数0.7以上の非線形ダンパーが最も効くと報告する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "1990年代初めに基礎免震で改修された歴史的建物を現在の基準で調べ直し、免震層の調整だけで性能を満たす方法を示した（抄録）。", "p3": "現行の免震構造の評価・設計の要件で耐震性能を評価し、上部構造の非線形応答、周囲の擁壁への衝突、特性修正係数による免震装置のばらつきを考慮しながら、性能を満たす免震層の特性の範囲を探った（抄録）。", "p5": "建物はさらなる評価が必要と判定された。有効免震周期を延ばして上部構造への要求を減らし、補助の減衰を加えて免震層の変位を抑える組み合わせで性能が改善した。臨界減衰の15%未満の補助の粘性減衰と、速度指数αが0.7以上の非線形粘性ダンパーが最も効果的だった（抄録）。", "fun": "免震の設計基準は、近年になるほど厳しくなっています。1990年代初めに免震で改修された歴史的な建物は、今の基準でも大丈夫なのでしょうか。調べ直すと、さらに検討が必要でした。面白いのは、建物本体には手を付けず、免震の層の周期を延ばし、減衰を足すという調整だけで改善できる範囲を示したことです。", "unverified": "建物の名称と所在地、想定した地震動、応答の数値は抄録に記載がなく未確認。"}}, {"id": "jn23", "rank": 23, "field": "地震工学・防災", "headline": "柔らかい地盤上で揺れ動く変形する構造物の数値モデル", "title": "Rocking of Multi Degrees of Freedom Deformable Bodies on Flexible Ground", "url": "https://doi.org/10.1002/eqe.70333", "authors": "Mohammad Daud ほか", "venue": "Earthquake Engineering & Structural Dynamics", "date": "2026-11-27", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Daud, M., Kundu, A., & Mukhopadhyay, S. (2026). Rocking of Multi Degrees of Freedom Deformable Bodies on Flexible Ground. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70333", "why": "ロッキング（浮き上がりを伴う揺れ）をする変形可能な構造物について、変形する部分を多質点系・オイラー＝ベルヌーイ梁・ティモシェンコ梁で表す3段階の数値モデルを、ラグランジュの枠組みで導いた。地盤の柔らかさは底面の隅のばねとダンパで入れる。橋脚型の構造物と独立柱で、正弦パルスと記録地震動に対する不安定性と応答を調べ、地盤のパラメータを適切に入れる重要性と、構造物に合うモデルの種類を示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "地盤から浮き上がりながら揺れる（ロッキングする）、変形もする構造物の動きを、柔らかい地盤の上で計算できる3段階のモデルを作った（抄録）。", "p3": "変形する部分を、複数の集中質量の系、オイラー＝ベルヌーイ梁、ティモシェンコ梁の3通りで表し、地盤の柔らかさは底の両隅に置いたばねとダンパで入れる。運動方程式はラグランジュの枠組みで導き、高さの違う橋脚型の構造物と独立した柱で、正弦パルスと記録地震動への応答を調べた（抄録）。", "p5": "変形するロッキング体はパルス型の地震動で転倒しうるため、不安定性と応答を解析した。地盤のパラメータを適切に組み込むことの重要さを示し、対象の構造物に合うモデルの種類を明らかにしたと報告する（抄録）。具体的な数値は抄録に記載がない。", "fun": "揺れると片側が浮き上がってゆらゆら動く「ロッキング」は、古代の柱や記念碑から現代の洋上風車まで見られる動きです。この研究は、構造物そのものがしなる場合と、地面がやわらかい場合を同時に考えたモデルを作りました。浮き上がり・衝突・しなりが絡み合うので、動きを理解するのは今も研究の途上にある問題です。", "unverified": "転倒の条件や3つのモデルの差の数値、どのモデルがどの構造物に合うかの具体的な結論は抄録に記載がなく未確認。"}}, {"id": "jn24", "rank": 24, "field": "地震工学・防災", "headline": "クラッチつきイナーターの同調質量で地震応答を抑える", "title": "Optimization and Performance Evaluation of Tuned Mass Clutched Inerter for Structural Systems", "url": "https://doi.org/10.1002/eqe.70330", "authors": "Radhey Shyam Jangid", "venue": "Earthquake Engineering & Structural Dynamics", "date": "2026-11-27", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Jangid, R. S. (2026). Optimization and Performance Evaluation of Tuned Mass Clutched Inerter for Structural Systems. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70330", "why": "同調質量にクラッチつきのイナーターを組み合わせた装置（TMCI）の制震効果を、1自由度系の調和加振・定常確率加振・4つの記録地震動で調べた。質量比と慣性質量比を与えると、変位・速度・絶対加速度を最も減らす最適な周期比があり、同じ質量比の通常の同調質量ダンパーより応答を減らす。粘性ダンパーを加えた形式とほぼ同じ低減が得られ、多自由度系でも同様の効果が保たれると報告する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "同調質量にクラッチつきのイナーターを組み合わせた制振装置（TMCI）が、周期の比を最適に選べば、通常の同調質量ダンパーより地震時の揺れを減らせることを示した（抄録）。", "p3": "1自由度系に調和加振、フィルタを通した白色雑音としてモデル化した定常確率加振、4つの記録地震動を与えて装置の効果を調べ、多自由度系にも拡張した（抄録）。", "p5": "質量比と慣性質量比を決めると、変位・速度・絶対加速度の応答を最も減らす最適な周期比が存在する。最適に同調したTMCIは、同じ質量比の通常の同調質量ダンパーより応答を減らした。粘性ダンパーを加えた形式（TMDCI）と最適条件ではほぼ同じ低減で、粘性ダンパーの寄与は比較的小さい。多自由度系でも同様の効果が保たれた（抄録）。", "fun": "構造物に補助の重りを付け、その動きを利用して揺れを抑える装置（同調質量ダンパー）があります。この研究は、その重りに「イナーター」と呼ばれる部品とクラッチを組み合わせた装置を調べました。意外なのは、粘性のダンパーを足した形式と比べても、最適な条件では揺れの減り方がほとんど同じだったことです。", "unverified": "最適な周期比の値、応答の低減率、対象とした構造物の諸元は抄録に記載がなく未確認。"}}, {"id": "jn25", "rank": 25, "field": "工学", "headline": "分散配置のTMDIで高橋脚ラーメン橋の地震被害を抑える", "title": "TMDI‐Based Seismic Mitigation of Long‐Span High‐Pier Continuous Rigid‐Frame Bridges Subjected to Near‐Fault Ground Motions", "url": "https://doi.org/10.1155/stc/7820044", "authors": "Lei Tong ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-27", "citescore": 10.3, "citescore_year": "2025", "apa": "Tong, L., Wang, D., Zou, Y., Li, H., Zhang, K., & Wang, C. (2026). TMDI‐Based Seismic Mitigation of Long‐Span High‐Pier Continuous Rigid‐Frame Bridges Subjected to Near‐Fault Ground Motions. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/7820044", "why": "汶川地震で大きな被害を受けた廟子坪橋を対象に、ファイバー要素の3次元非線形有限要素モデルで断層近傍の記録地震動に対する応答を再現し、二方向に分散配置する同調質量ダンパー・イナーター（TMDI）を提案した。桁と橋脚の両方の地震時の要求を大きく減らし、橋脚基部の塑性変形と桁の引張によるひび割れを抑える。主橋脚の残留曲げモーメントと残留曲率への効果は比較的小さいと報告する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "断層近くの地震動を受ける、橋脚の高い長大なPCラーメン橋の被害を、同調質量ダンパー・イナーター（TMDI）を二方向に分散して配置する方式で抑えられることを解析で示した（抄録）。", "p3": "汶川地震で大きな被害を受けた廟子坪橋を対象に、ファイバー断面要素に基づく精緻な3次元の非線形有限要素モデルを作り、記録された断層近傍の地震動での応答を再現したうえで、提案する分散TMDIの効果を調べた（抄録）。", "p5": "分散TMDIは桁と橋脚の両方の地震時の要求を大きく減らし、とくに橋脚基部の塑性変形を抑え、桁の引張応力によるひび割れを防いだ。二方向の分散配置は断層近傍のパルス型の加振で高い制御効率を示した。主橋脚の残留曲げモーメントと残留曲率への効果は比較的小さかった（抄録）。", "fun": "橋脚の高い長大な橋は、断層の近くの地震動で損傷しやすいことが、汶川地震や熊本地震の後の調査で示されています。この研究は、実際に大きな被害を受けた橋を計算の中に再現し、揺れを抑える装置を橋に分散して、しかも2方向に置くとどうなるかを試しました。橋脚の根元の変形と桁のひび割れが抑えられたという結果です。", "unverified": "応答の低減率の数値、装置の質量や配置の詳細は抄録に記載がなく未確認。解析による検討で、実験や実橋での検証ではない。"}}, {"id": "jn26", "rank": 26, "field": "工学", "headline": "節点だけで構成則を評価する超弾性体の陽的動解析", "title": "Finite Deformation of Hyperelastic Solids using Estimation-Based Direct Simulation on Nodal Networks", "url": "https://doi.org/10.1142/s0219455427410148", "authors": "Suhas A. Kowshik ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-27", "citescore": 6.5, "citescore_year": "2025", "apa": "Kowshik, S. A., Srinivasa, A. R., & Reddy, J. N. (2026). Finite Deformation of Hyperelastic Solids using Estimation-Based Direct Simulation on Nodal Networks. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455427410148", "why": "節点での求積と勾配の推定を使い、構成則の評価回数を節点の数に抑える手法EDISONNを、有限変形する超弾性体の陽的な動解析に適用した。メッシュは接続の情報にだけ使い、勾配は補間でなく確率的な推定の手法で求める。混合定式化や低減積分、アワーグラス制御なしで、ほぼ非圧縮でも体積ロッキングとアワーグラスモードを避けられ、質量行列は自然に対角になる。2次元・3次元の数値例で精度を確かめた。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "大きく変形する超弾性体（ゴムのような材料のモデル）の動的な解析を、節点だけで材料の計算を行う方法で、数値的な不具合を避けながら行えることを示した（抄録）。", "p3": "EDISONNという手法で、節点での求積と節点で直接行う勾配の推定を使い、構成則の評価回数を節点の数と等しくする。未知数は変位だけで、メッシュは接続の情報を得るためにだけ使い、勾配は補間でなく確率的な推定に基づく手法で求める。時間積分は陽的な中心差分法（抄録）。", "p5": "ほぼ非圧縮の条件でも体積ロッキングを避け、偽のアワーグラスモードも生じず、混合定式化・低減積分・アワーグラス制御を必要としない。質量は自然に対角になる。2次元・3次元の圧縮性・ほぼ非圧縮の超弾性体の数値例で、精度と頑健性を確かめたと報告する（抄録）。", "fun": "体積がほとんど変わらない材料を計算で変形させると、計算上だけ異常に硬くなる「ロッキング」や、実際にはない変形の型が出る「アワーグラス」という不具合が問題になります。これまでは特別な定式化や制御で防いできました。この研究は、材料の計算を要素の中の複数の点でなく節点で行うやり方で、そうした工夫なしに両方を避けられると報告しています。", "unverified": "数値例の内容と誤差の数値、既存の有限要素法との計算時間の比較は抄録に記載がなく未確認。"}}, {"id": "jn27", "rank": 27, "field": "工学", "headline": "熱画像で橋のケーブルや外壁からの落氷を検知", "title": "Thermal‐Vision Monitoring of Falling Ice and Objects for Bridges and Building Façades", "url": "https://doi.org/10.1155/stc/8394826", "authors": "Dexu Cai ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-27", "citescore": 10.3, "citescore_year": "2025", "apa": "Cai, D., Kabel, T., Demartino, C., & Georgakis, C. T. (2026). Thermal‐Vision Monitoring of Falling Ice and Objects for Bridges and Building Façades. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/8394826", "why": "橋のケーブルや屋根の端、外壁から落ちる氷や物体を、熱画像の動画から検知する軽量な手法を提案した。オプティカルフローの動きの一貫性に、熱を考慮した軌跡の対応づけと時間方向の確認を加える。外壁を想定した140本の動画では再現率0.779、橋のケーブル試験体からの湿った雪の落下の風洞試験では69事象中21事象の検知（再現率0.304）だった。毎秒355.9〜587.2フレームで処理でき、警報の伝達や被害の低減までは検証していないと明記する。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "橋のケーブルや建物の外壁から落ちる氷や物体を、熱画像の動画から検知する軽量な手法を作り、室内の実験と風洞試験で性能を測った（抄録）。", "p3": "オプティカルフロー（画面内の動きの向きと速さ）の一貫性を調べる既存の処理に、熱を考慮した軌跡の対応づけと、時間方向の警報の確認を加えた手法OF-MCA-Tを、外壁を想定した統制実験と、橋のケーブル試験体から湿った雪が落ちる気候風洞の試験で評価した（抄録）。", "p5": "外壁の140本の動画では109事象を検知（再現率0.779）、誤警報は18フレームで、毎秒355.9フレームで処理した。風洞の5時間の記録では注釈つきの69事象のうち21事象を検知（再現率0.304）、毎秒587.2フレームで処理した。25Hzの取得速度を上回るが、警報の伝達やリスクの低減は検証していないと明記する（抄録）。", "fun": "橋のケーブルや建物の外壁から氷が落ちると、下を通る人や車にとって短い時間の危険になります。この研究は、熱を映すカメラの動画から落下を自動で見つける方法を試しました。建物の外壁の実験では140本の動画で109の事象を見つけましたが、橋のケーブルの風洞試験では69のうち21にとどまりました。低い数字も、確かめていない範囲も、そのまま書いている点が印象的です。", "unverified": "風洞試験で検知率が低い理由の分析は抄録に記載がなく未確認。実際の橋での検証は行われていない。"}}, {"id": "jn28", "rank": 28, "field": "工学", "headline": "風車タワーの振動数の設計感度を閉じた式で示す", "title": "Closed-form solutions for the sensitivity of natural frequencies to design parameters of prefabricated hybrid steel-concrete wind turbine towers", "url": "https://doi.org/10.1142/s0219455428501076", "authors": "Xiao-Wei Zheng ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-27", "citescore": 6.5, "citescore_year": "2025", "apa": "Zheng, X.-W., Qin, R., & Chen, R. (2026). Closed-form solutions for the sensitivity of natural frequencies to design parameters of prefabricated hybrid steel-concrete wind turbine towers. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428501076", "why": "鋼とコンクリートを組み合わせたプレハブの風車タワーについて、基本固有振動数が設計パラメータ（ナセルと翼の質量・慣性モーメント、基礎の回転・並進剛性、壁厚、平均径）にどう感応するかの理論解を導いた。上部では壁を厚くすると振動数が下がり、下部では上がるという境目の高さ（臨界標高）を定義し、目標の振動数に合わせる調整法を示した。振動数と曲げ耐力の関係の理論解も与え、実機のタワーで検証した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "鋼とコンクリートを組み合わせた風車タワーの基本固有振動数が、設計の数値を変えるとどう動くかを、式で直接読み取れるようにした（抄録）。", "p3": "プレハブの鋼・コンクリート混合タワーについて、ナセルと翼の質量・慣性モーメント、基礎の回転・並進の剛性、壁厚、平均径が基本固有振動数に与える影響の理論解を導き、振動数と曲げ耐力の関係の理論解も与えて、実機のタワーで検証した（抄録）。", "p5": "振動数はナセルと翼の質量・慣性モーメントが増えると下がる。壁を厚くすると、上部では下がり下部では上がる。基礎の剛性を上げると振動数は上がるが、すぐ頭打ちになる。基部と基礎の境界では、圧縮域の半角係数αが0.37を超えると、同じ曲げ耐力の増分に対して径を増やすほうが厚さを増やすより振動数の伸びが大きく、0.37未満では逆になる（抄録）。", "fun": "風車の塔では、塔が揺れやすいリズム（固有振動数）が設計を左右する大事な数値です。面白いのは、壁を厚くしたときの効果が場所で逆になることです。塔の下のほうの壁を厚くすると振動数は上がるのに、上のほうを厚くすると逆に下がります。その境目になる高さを定義し、ねらった振動数に合わせる調整を式で扱えるようにしたのがこの研究です。", "unverified": "理論解の導出の仮定の詳細、実機での検証の誤差は抄録に記載がなく未確認。"}}, {"id": "jn29", "rank": 29, "field": "工学", "headline": "正常データだけで水力発電機の異常を音と振動から検知", "title": "An unsupervised deep low-rank cross-modal fusion framework for vibro-acoustic anomaly detection in hydropower units", "url": "https://doi.org/10.1177/14759217261506930", "authors": "Ting Wu ほか", "venue": "Structural Health Monitoring", "date": "2026-11-27", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Wu, T., Cheng, X., Yan, Z., Wen, S., Chen, G., Li, L., Liu, X., Wang, C., & Yang, J. (2026). An unsupervised deep low-rank cross-modal fusion framework for vibro-acoustic anomaly detection in hydropower units. Structural Health Monitoring. https://doi.org/10.1177/14759217261506930", "why": "水力発電所のタービン発電機について、異常データなしで学習する異常検知の枠組みを提案した。負荷の変動による非定常だが正常な状態を、2点のエネルギー相関で見分ける。音と振動を低ランクの交差モーダル自己注意で融合し、推論時は融合した埋め込みの密度補正つきk近傍の距離を異常スコアにする。利用したデータと検証手順のもとで、通風ダクトとスリップリング室の指標の調和平均が99.1%と100.0%だった。コードを公開している。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "水力発電所のタービン発電機の異常を、異常のデータを使わずに、音と振動を組み合わせて検知できるようにした（抄録）。", "p3": "負荷の変動による「非定常だが正常」な運転状態を2点のエネルギー相関で見分けたうえで、音と振動を低ランクの交差モーダル自己注意（LCSA）で融合する。学習では補助の分類課題で導き、推論では融合した埋め込みから密度で補正したk近傍の異常スコアを計算する（抄録）。", "p5": "利用できたデータと検証の手順のもとで、複数の指標の調和平均は通風ダクトで99.1%、スリップリング室で100.0%だった。ソースコードを公開している（抄録）。", "fun": "機械の異常を見つけるAIを作ろうとしても、異常の信号は集めにくく、印を付けるのにも費用がかかります。そこでこの研究は、正常な運転のデータだけで学習し、異常の見本なしに異常を見つける方法を取りました。発電機は負荷が変わると信号も変わるので、「変わったけれど正常」と「本当の異常」を見分けるのが難しい点です。音と振動の両方を使うのが工夫です。", "unverified": "データの規模、異常の種類、指標の内訳は抄録に記載がなく未確認。著者も「利用できたデータと検証手順のもとで」と条件を付けている。"}}, {"id": "jn30", "rank": 30, "field": "工学", "headline": "時定数が変わる回路網で電動アクチュエータの故障を診断", "title": "Dual multi-scale liquid time-constant convolutional network: A new intelligent health assessment method for electro-mechanical actuators", "url": "https://doi.org/10.1177/14759217261504710", "authors": "Xinjun Shi ほか", "venue": "Structural Health Monitoring", "date": "2026-11-27", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Shi, X., Li, G., Zhang, S., Zhao, X., Yao, J., Wang, Z., Pei, H., & Hu, C. (2026). Dual multi-scale liquid time-constant convolutional network: A new intelligent health assessment method for electro-mechanical actuators. Structural Health Monitoring. https://doi.org/10.1177/14759217261504710", "why": "航空宇宙の電動アクチュエータの非定常な多センサ信号から健全度を評価するため、多スケールの特徴抽出と、時定数が入力に応じて変わる液体時定数ネットワーク、チャネルと時間の注意機構を重ねたネットワークを提案した。NASAの電動アクチュエータとハルビン工業大学の航空エンジン軸受の2つのデータで8つの基準手法と比べ、平均正解率99.15±1.15%と99.57±0.52%を得た。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "航空宇宙で使う電動アクチュエータの故障の種類を、複数のセンサの非定常な信号から高い精度で見分けるネットワークを提案した（抄録）。", "p3": "多スケールの枝で解像度の異なる故障のパターンを取り出し、液体時定数ネットワーク（LTC：時定数が適応的に変わるネットワーク）で時間方向の依存を捉え、チャネルと時間の注意機構で特徴を調整する。NASAの電動アクチュエータとハルビン工業大学の航空エンジン軸受のデータで、8つの基準モデルと比べた（抄録）。", "p5": "2つのデータで平均正解率が最も高く、99.15±1.15%と99.57±0.52%だった。性質の異なる2つの電気機械のデータで、正確で安定した多クラスの故障診断ができると報告する（抄録）。", "fun": "機械のセンサの信号は、時間とともに性質が変わるので、故障の見きわめを難しくします。この研究のネットワークは、信号をいくつもの細かさで同時に眺め、さらに時間の変化を追うときの「時定数」を信号に合わせて変える仕組みを持っています。2種類のデータで99%台の平均正解率を得たと報告しています。", "unverified": "基準の8モデルとの差、学習と評価の分け方は抄録に記載がなく未確認。公開データでの評価で、実機での検証ではない。"}}, {"id": "jn31", "rank": 31, "field": "経済学", "headline": "長く深刻な雇用の落ち込みはマクロ経済危機と結びつく", "title": "Labor market anatomy of a macroeconomic crisis", "url": "https://doi.org/10.1016/j.jmoneco.2026.104034", "authors": "Kevin Donovan ほか", "venue": "Journal of Monetary Economics", "date": "2026-11-27", "sjr": 6.262, "citescore": 6.2, "citescore_year": "2025", "apa": "Donovan, K., Lu, W. J., Pedtke, J., & Schoellman, T. (2026). Labor market anatomy of a macroeconomic crisis. Journal of Monetary Economics, 104034. https://doi.org/10.1016/j.jmoneco.2026.104034", "why": "題名から、マクロ経済の危機を労働市場の構造から分析する研究と読める。Journal of Monetary Economics（SJR 6.262）の新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "不況が家計の所得に伝わる経路である労働市場の反応を多数の国と不況で調べ、通常の研究が扱うよりはるかに長く深刻な出来事の「裾」があり、それがマクロ経済危機と結びつくことを示した（抄録）。", "p3": "数十か国・数百の不況にわたる労働市場の集計データとミクロデータを組み合わせて、不況への労働市場の反応の分布を調べた（抄録）。", "p5": "反応の分布には、文献で通常扱われるよりずっと長く深刻な出来事の裾がある。それらは住宅価格の崩壊、商品価格のショック、システミックな金融危機と結びつく。危機は産業を広くまたぎ、離職率と就職率の急な変動を伴い、若年・低学歴・勤続の短い労働者など、労働市場とのつながりの弱い人に強く効く（抄録）。", "fun": "不況と一口に言っても、その深さと長さはさまざまです。この研究は、数十か国の数百回の不況を並べて、とびぬけて長く深刻な雇用の落ち込みがあることを示しました。そうした落ち込みは、住宅価格の崩壊や金融危機と結びついていました。そして打撃は、若い人や勤続の短い人に強く現れていました。典型的な不況だけを見ていては分からないことです。", "unverified": "対象の国と期間、裾の出来事の長さと深さの数値は抄録に記載がなく未確認。"}}, {"id": "jn32", "rank": 32, "field": "統計学", "headline": "分散したデータの予測を最適に集約する", "title": "Optimal aggregation prediction for distributed data", "url": "https://doi.org/10.1016/j.jeconom.2026.106355", "authors": "Jun Liao ほか", "venue": "Journal of Econometrics", "date": "2026-11-27", "sjr": 6.575, "citescore": 7.3, "citescore_year": "2025", "apa": "Liao, J., Liu, R., Zhang, X., & Zhu, L. (2026). Optimal aggregation prediction for distributed data. Journal of Econometrics, 258, 106355. https://doi.org/10.1016/j.jeconom.2026.106355", "why": "題名から、複数の場所に分散したデータで得た予測を最適に集約する方法の研究と読める。Journal of Econometrics（SJR 6.575）の新着。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録も入手できなかったため題名のみ", "preprint": false, "short": true, "p1": "題名から、複数の場所に分散しているデータを対象に、予測を最適に集約（アグリゲーション）する方法を扱う研究と読める。掲載誌はJournal of Econometrics。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "データが1か所にまとまっておらず、あちこちに分かれているとき、全体として最もよい予測をどう作ればよいでしょうか。題名からは、分かれたデータから得られる予測を「最適に」まとめる方法を探る研究だと読み取れます。「最適」をどう定義し、どう示すのかが問いの中心になりそうです。結果は確認できていません。", "unverified": "抄録・本文を入手できず、集約の方法、最適性の意味、理論と数値の結果はすべて未確認。"}}, {"id": "jn33", "rank": 33, "field": "機械学習", "headline": "動画拡散モデルを蒸留して3D場面を1ステップで生成", "title": "Distilling Video Diffusion Model to Generate 3D Scenes in One Step", "url": "https://doi.org/10.1109/tpami.2026.3757675", "authors": "Hanyang Wang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-26", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Wang, H., Liu, F., Liu, Y., Chi, J., Lu, J., Zhou, J., & Duan, Y. (2026). Distilling Video Diffusion Model to Generate 3D Scenes in One Step. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–15. https://doi.org/10.1109/tpami.2026.3757675", "why": "題名から、動画の拡散モデルを蒸留し、3次元の場面を1ステップで生成する研究と読める。IEEE Transactions on Pattern Analysis and Machine Intelligence（SJR 4.829）の新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "short": true, "p1": "少ない視点の画像から3次元の場面を復元する作業を、動画の拡散モデルを蒸留することで1ステップで行えるようにした（抄録）。", "p3": "粗い復元から描画した動画をもとに、乱数ノイズの注入を伴う3次元を考慮した飛び越しの蒸留を設計し、推論時に最適な飛び越しの時点を決める方策ネットワークを学習する（VideoScene）。さらに、多視点画像の幾何的な対応から構造を持つノイズを導く仕組み（Noise-from-Motion）で、視点間の点の対応を拡散の過程に組み込む（VideoScene++）（抄録）。", "p5": "VideoSceneは高速で高品質な3次元場面の生成を実現し、VideoScene++は3次元の幾何的な一貫性をさらに改善したと報告する（抄録）。数値は抄録に記載がない。", "fun": "少ない枚数の画像から立体の場面を作るのは、手がかりが足りない難しい問題です。動画を作るAIは、視点を動かしても立体としてつじつまの合う映像を作れるので助けになりますが、遅いのが難点でした。この研究は、その生成を1ステップに縮める方法と、ばらばらの乱数の代わりに画像どうしの対応に沿ったノイズを使って形の食い違いを減らす方法を提案しています。", "unverified": "速度と画質の数値、比較した手法は抄録に記載がなく未確認。"}}, {"id": "jn34", "rank": 34, "field": "機械学習", "headline": "Transformerと脳の回路網を同じ幾何空間で照合", "title": "A Unified Geometric Space for Topological Alignment Between Transformer-Based Models and Human Brain Networks", "url": "https://doi.org/10.1109/tpami.2026.3757362", "authors": "Silin Chen ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-26", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Chen, S., Chen, Y., Wang, C., Wang, Z., Wang, J., Jia, Z., Kendrick, K. M., Zhang, T., Zhao, L., Yao, D., Liu, T., & Jiang, X. (2026). A Unified Geometric Space for Topological Alignment Between Transformer-Based Models and Human Brain Networks. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–15. https://doi.org/10.1109/tpami.2026.3757362", "why": "題名から、Transformer系のモデルと人の脳のネットワークを、1つの幾何空間で位相的に対応づける研究と読める。IEEE Transactions on Pattern Analysis and Machine Intelligence（SJR 4.829）の新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "Transformerの注意の結びつき方と、人の脳の内因性の結合ネットワークを、課題や入力の種類によらず比べられる共通の空間を作った（抄録）。", "p3": "Transformerの注意のトポロジーを人の内因性結合ネットワーク（ICN）に写像する「脳とモデルの位相的な整合の空間」を導入し、151のTransformer系モデルの62,480個の注意ヘッドのグラフを分析した（抄録）。", "p5": "モデルは整合の度合いを反映する連続した弧の形に分布した。全体の意味に最適化されたモデルは高次のICNと、局所の細部を扱うモデルは感覚のICNと整合した。DINOv2は前の世代より整合が下がり、微調整や指示チューニングの効果は限られた。整合の点数はImageNetの精度と有意な相関がなかった（r = 0.266、p = 0.156）（抄録）。", "fun": "AIの「注意」のつながり方は、人の脳のネットワークに似ているのでしょうか。この研究は151種類のAIを同じ物差しに載せて比べました。全体の意味を扱うAIは脳の高次のネットワークに、細かい部分を扱うAIは感覚のネットワークに近い形をしていました。ただし、脳に似ているほど画像認識の成績がよい、という関係は見られませんでした。", "unverified": "写像の具体的な方法、弧の形の分布の定量的な指標は抄録に記載がなく未確認。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "情報共有型Transformerで画像の超解像を効率化", "title": "Information-Shared Transformer for Efficient Image Super-Resolution", "url": "https://doi.org/10.1109/tpami.2026.3757264", "authors": "Hesong Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-26", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Li, H., Fu, Y., Zhang, D., Yuan, X., Guo, Y., & Zhang, Y. (2026). Information-Shared Transformer for Efficient Image Super-Resolution. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–18. https://doi.org/10.1109/tpami.2026.3757264", "why": "題名から、情報を共有する構造のTransformerで、画像の超解像を効率よく行う研究と読める。IEEE Transactions on Pattern Analysis and Machine Intelligence（SJR 4.829）の新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "short": true, "p1": "低解像度の画像から細部を復元する超解像で、Transformerの計算の重さを、チャネルと空間の情報を共有する設計で減らした（抄録）。", "p3": "自己注意の間の特徴の変換を、対称な2本の枝のゲートとチャネル情報の共有で効率化する「チャネル共有ゲート」と、自己注意のヘッドごとに異なる大きさのパッチを1つのトークンに埋め込み、トークンの数を減らす「空間共有埋め込み」を提案した（抄録）。", "p5": "提案した設計により、異なるモデルの規模で、既存の最先端の超解像の手法を、より高い効率で上回ったと報告する（抄録）。数値は抄録に記載がない。コードと学習済みモデルを公開する予定とする。", "fun": "低解像度の画像から細部を復元する「超解像」では、画像の離れた場所どうしの関係を調べる自己注意が強力ですが、計算が重くなります。この研究は、注意のヘッドごとに大きさの違う区画を1つの単位にまとめることで、扱う単位の数を減らしつつ、さまざまな大きさの関係を捉えようとしました。軽いモデルや速さが要る用途をねらった工夫です。", "unverified": "画質の指標と計算量の数値、比較した手法は抄録に記載がなく未確認。"}}, {"id": "jn36", "rank": 36, "field": "工学", "headline": "粗い刻みで学習しても崩れない地震応答の代理モデル", "title": "Beyond fixed-grid accuracy: Fourier neural operator surrogates for deployment-oriented seismic response assessment", "url": "https://doi.org/10.1016/j.cacaie.2026.100284", "authors": "Jun Jiang ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-26", "citescore": 14.7, "citescore_year": "2025", "apa": "Jiang, J., Dong, C., Ma, Y., Xiong, C., Wang, X., & Alam, M. S. (2026). Beyond fixed-grid accuracy: Fourier neural operator surrogates for deployment-oriented seismic response assessment. Computer-Aided Civil and Infrastructure Engineering, 100284. https://doi.org/10.1016/j.cacaie.2026.100284", "why": "題名から、フーリエニューラル作用素を地震応答の評価の代理モデルに使い、固定した格子での精度にとどまらず実運用を見据えた評価を行う研究と読める。Computer-Aided Civil and Infrastructure Engineeringの新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "地震時の床の加速度の時刻歴を、フーリエニューラル作用素（FNO）で素早く予測する代理モデルが、実務で起きる条件のずれにどこまで耐えるかを評価した（抄録）。", "p3": "K-NETの地震動3474本を57通りの振幅係数で拡大縮小して作ったデータベースでFNOを設定し、BiLSTM、Transformer、ResCNN、UNet、MLPと比べた。標準の50Hzでの精度に加え、時間刻みの違い、データ不足、構造種別ごとの再学習という、運用を想定した条件で調べた（抄録）。", "p5": "標準の50Hzの比較ではBiLSTMとTransformerが点ごとの精度でFNOを上回った。しかし20Hzや25Hzで学習して50Hzで評価すると、FNOは高い精度を保ち（一方の値は0.9374）、Transformerは失敗した。予測した時刻歴から求めたFEMA P-58の損傷確率などの判断は、基準の非線形時刻歴解析と整合した（抄録）。", "fun": "AIの性能比べは、学習したときと同じ条件で試すのがふつうです。でも実務では、記録の時間の刻みが違うなど、条件がずれることがあります。この研究では、同じ条件なら別のAIのほうが正確でしたが、粗い刻みで学習して細かい刻みで使うと、そのAIは失敗しました。一方、FNOは精度を保ちました。「同じ条件での点数」と「条件がずれても使えるか」は別だという教訓です。", "unverified": "20Hzで学習した場合の精度の値は抄録の表記が欠けており未確認。対象の建物モデルの詳細も抄録に記載がない。"}}, {"id": "jn37", "rank": 37, "field": "工学", "headline": "補剛構造の局所的な弾塑性変形をUNetで素早く予測", "title": "Rapid prediction of local loading-induced elastoplastic deformation in large stiffened structures via a partitioned hybrid-driven UNet", "url": "https://doi.org/10.1016/j.engstruct.2026.124250", "authors": "Chang Gao ほか", "venue": "Engineering Structures", "date": "2026-11-27", "citescore": 12.0, "citescore_year": "2025", "apa": "Gao, C., Liu, M., Niu, Y., & Yu, H. (2027). Rapid prediction of local loading-induced elastoplastic deformation in large stiffened structures via a partitioned hybrid-driven UNet. Engineering Structures, 372, 124250. https://doi.org/10.1016/j.engstruct.2026.124250", "why": "題名から、大型の補剛構造に局所的な荷重がかかったときの弾塑性変形を、領域を分けたハイブリッド駆動のUNetで素早く予測する研究と読める。Engineering Structuresの新着。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録も入手できなかったため題名のみ", "preprint": false, "short": true, "p1": "題名から、大型の補剛構造に局所的な荷重がかかったときの弾塑性変形を、領域を分割して扱うハイブリッド駆動のUNet（畳み込みネットワークの一種）で素早く予測する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "補強材の付いた大きな構造の一部に強い力がかかると、そこに元に戻らない変形（塑性変形）が生じます。題名からは、構造を領域に分け、ネットワークで変形を素早く予測しようとする研究だと読み取れます。大きな構造のごく一部で起きる現象を、どう切り出して速く予測するかが問いです。結果は確認できていません。", "unverified": "抄録・本文を入手できず、ハイブリッド駆動の中身、学習データ、予測の精度と速度はすべて未確認。"}}, {"id": "jn38", "rank": 38, "field": "工学", "headline": "破壊確率の大域感度を方向重点サンプリングで推定", "title": "Dual-enhanced directional importance sampling method for efficiently estimating failure probability global sensitivity index", "url": "https://doi.org/10.1016/j.istruc.2026.113647", "authors": "Yuhua Yan ほか", "venue": "Structures", "date": "2026-11-26", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Yan, Y., Cheng, L., Lu, Z., Qu, J., & Wang, X. (2026). Dual-enhanced directional importance sampling method for efficiently estimating failure probability global sensitivity index. Structures, 94, 113647. https://doi.org/10.1016/j.istruc.2026.113647", "why": "題名から、破壊確率の大域的な感度指標を、2つの強化を加えた方向重点サンプリングで効率よく推定する研究と読める。Structures（SJR 1.108）の新着。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録も入手できなかったため題名のみ", "preprint": false, "short": true, "p1": "題名から、破壊確率の大域的な感度指標（入力の不確かさが破壊確率にどれだけ効くかを表す量）を、2つの強化を加えた方向重点サンプリング法で効率よく推定する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物が壊れる確率を計算で求めるうえ、「どの不確かさがその確率を左右しているか」まで知ろうとすると、計算の手間は大きくなります。題名からは、方向に着目して重点的に標本を取る方法に2つの工夫を重ねて、この推定を効率よくしようとする研究だと読み取れます。結果は確認できていません。", "unverified": "抄録・本文を入手できず、2つの強化の中身、例題、計算量の削減の程度はすべて未確認。"}}, {"id": "jn39", "rank": 39, "field": "工学", "headline": "球面へのパラメータ化で曲面構造のトポロジー最適化", "title": "A spherical parameterization-based material-field series expansion method for topology optimization of genus-0 curved surface structures", "url": "https://doi.org/10.1016/j.tws.2026.116049", "authors": "Zhonghao Gao ほか", "venue": "Thin-Walled Structures", "date": "2026-11-27", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "apa": "Gao, Z., Tu, P., Wu, W., & Luo, Y. (2026). A spherical parameterization-based material-field series expansion method for topology optimization of genus-0 curved surface structures. Thin-Walled Structures, 116049. https://doi.org/10.1016/j.tws.2026.116049", "why": "題名から、穴のない閉曲面（種数0）の構造のトポロジー最適化を、球面へのパラメータ化に基づく材料場の級数展開で行う研究と読める。Thin-Walled Structures（SJR 1.734）の新着。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、抄録も入手できなかったため題名のみ", "preprint": false, "short": true, "p1": "題名から、種数0の曲面（穴のない閉じた曲面）の形をした構造のトポロジー最適化を、球面へのパラメータ化に基づく材料場の級数展開で行う研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "材料をどこに置くかを計算で決める「トポロジー最適化」を、曲がった面の上で行うにはどうすればよいでしょうか。題名からは、曲面を球面に対応させ、その上で材料の分布を級数（式の足し合わせ）で表そうとする研究だと読み取れます。曲面の上の分布を、少ない数の係数でどう表すかが問いです。結果は確認できていません。", "unverified": "抄録・本文を入手できず、最適化の目的関数、例題、既存手法との比較はすべて未確認。"}}, {"id": "jn40", "rank": 40, "field": "地震工学・防災", "headline": "災害対応のLLMに人の実務家と同じ認知バイアス", "title": "Cognitive biases in large language models for disaster management: A controlled vignette experiment", "url": "https://doi.org/10.1016/j.ijdrr.2026.106579", "authors": "Idan-Chaim Cohen ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-24", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "apa": "Cohen, I.-C., Littor, N., Elyashar, A., Puzis, R., & Cohen, O. (2026). Cognitive biases in large language models for disaster management: A controlled vignette experiment. International Journal of Disaster Risk Reduction, 147, 106579. https://doi.org/10.1016/j.ijdrr.2026.106579", "why": "題名から、災害管理の場面を記述した統制されたビネット実験で、大規模言語モデルの認知バイアスを調べる研究と読める。International Journal of Disaster Risk Reduction（SJR 1.243）の新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "災害対応の判断でLLMが、人の実務家と同じ向きの認知バイアスを示すかを実験で調べ、6つのうち3つが一貫して現れることを示した（抄録）。", "p3": "災害管理の実務家で6つの認知バイアスを記録した先行のビネット（場面記述）研究の6つの実験をLLM向けに作り直し、4つの提供元の8つのLLMに、地震・山火事・化学物質の流出の3つの場面で実施した（抄録）。", "p5": "フレーミング効果、不作為と作為の後悔、結果バイアスの3つは、多くのモデルと3つの場面すべてで、人の実務家と同じ向きに一貫して現れた。帰属バイアスは向きがモデルと場面で変わり、頻度形式の効果は小さく場面に依存し、隣人効果は一貫して現れなかった。災害関連の課題を拒否する応答も見られた（抄録）。", "fun": "同じ事実でも、伝え方が変わると人の判断は変わることがあります。これを認知バイアスといいます。災害対応を支援するAIにも同じ癖があるかを調べたところ、6つの癖のうち3つが、人の実務家と同じ向きで一貫して現れました。AIの出力は、学習データに含まれる人の判断の型を映すからです。著者は、導入の前にこうした応答の型を調べるべきだと述べています。", "unverified": "バイアスの大きさの数値、モデルの名前、拒否の頻度は抄録に記載がなく未確認。"}}, {"id": "jn41", "rank": 41, "field": "地震工学・防災", "headline": "干ばつ前の現金給付は2回に分けるより一括がよい", "title": "One Transfer or Two? Experimental Evidence on Anticipatory Cash Transfers for Drought in Afghanistan", "url": "https://doi.org/10.1016/j.ijdrr.2026.106578", "authors": "Shawkatullah Azimi ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-26", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "apa": "Azimi, S., Azizi, H., Clingain, C., Cochran-George, M., Excell, B., Frewat, N., Jawuoro, S., & Shakir, M. Y. (2026). One Transfer or Two? Experimental Evidence on Anticipatory Cash Transfers for Drought in Afghanistan. International Journal of Disaster Risk Reduction, 106578. https://doi.org/10.1016/j.ijdrr.2026.106578", "why": "題名から、アフガニスタンで干ばつに先立って行う現金給付を、1回で渡す場合と2回に分ける場合で比べた実験の研究と読める。International Journal of Disaster Risk Reduction（SJR 1.243）の新着。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "干ばつの被害が本格化する前に配る現金は、2回に分けるより1回でまとめて渡すほうが、世帯の食料消費と対処行動にとってよいことを、アフガニスタンの無作為化比較試験で示した（抄録）。", "p3": "2025年の干ばつに対する予防的な現金給付で、36の地域を無作為に、世帯が1回の大きな一括給付を受ける群と、2回に分けた給付を受ける群に割り当てた。アフガニスタンでの予防的な現金給付の最初の無作為化比較試験だという（抄録）。", "p5": "2回に分けた群の世帯は、食料消費が悪く、生計を損なう対処行動に多く頼った。消費を減らすオッズは2.36倍、ショック後に借金をするオッズは2.66倍だった。ただし両群とも、不作と経済・政治の要因が重なって所得をほぼすべて失っており、脆弱な文脈では予防的な給付の働き方が異なりうると述べる（抄録）。", "fun": "干ばつのような予測できる災害では、被害が本格化する前に支援を届ける取り組みが広がっています。そのお金は「一度にまとめて」渡すのと「2回に分けて」渡すのと、どちらがよいでしょうか。アフガニスタンの実験では、分けて受け取った世帯のほうが食料消費が悪く、借金をする傾向も強くなりました。著者は、早い時点で多くの現金を渡すことが助けになると述べています。", "unverified": "給付の金額と時 <script>
(function () {

  function themeColor(it) { return it.theme_no ? "--t" + it.theme_no : "--accent-soft"; }

  }
  function addTab(key, text, label, onClick) {

    tabs.appendChild(b);
  }
  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);
    addTab("group:" + g.key, g.label + " " + n, null, function () {

      b.addEventListener("click", function () { select(p[0]); });

  function labelled(cls, label, text) {

  }

    card.appendChild(el("h1", "headline", it.headline || it.title));

    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;

        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {

        var dbasis = el("p", "basis");

      }
      card.appendChild(el("p", "summary", it.summary));

    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));

      var b = el("button", "ask"); b.type = "button";

      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);

    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");

    stage.appendChild(card);

  function renderList() {

    var wrap = el("div", "list");

  // speech

  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;

    if (it.why) out.push("重要な理由。" + it.why);

      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
