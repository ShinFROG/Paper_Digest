<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-02", "intro": "プレプリントの新着のうち研究テーマに関連する候補2,157件（一覧278件）、学術誌の新着（上位10%誌2,958件のうち関連955件から300件、その他の学術誌の関連371件から154件）、注目分野の候補（プレプリント282件、論文誌194件）から選びました。注目分野は、組織行動・心理的安全性、経済学、経営学、統計学、機械学習、因果推論の6分野と、今日のおすすめ分野（開発経済学、計算社会科学・ネットワーク科学）です。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目47報です。論文誌・注目は注目誌の新着が少なく、統計学と組織行動・心理的安全性の候補は抄録のないものが中心だったため、上位10%誌の新着から注目分野に当たる論文で補ったうえで、水増しせず47報としました。抄録を入手できなかった論文は各部の16位以下に置き、題名から判断しています。各部の上位15報は詳しい解説、16位以下は抄録をもとにした短い解説です。あわせて、DataCiteに直近3日で登録された公開データセット・研究コードから30件を「データ」タブに載せています（e-Statの新しい公表は候補に該当がありませんでした）。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "軌道の凹凸から磁気浮上車の応答を高速予測", "title": "Physics-Guided Residual DCT Spectral Neural Operator for Air-Gap Response Prediction in EMS Maglev Trains", "url": "https://doi.org/10.5194/ms-2026-172", "authors": "Rang Zhang ほか", "venue": "Mechanical Sciences (discussion)", "date": "2026-10-01", "apa": "Zhang, R., Liu, J., Lu, C., Chen, D., & Li, Q. (2026). Physics-Guided Residual DCT Spectral Neural Operator for Air-Gap Response Prediction in EMS Maglev Trains. https://doi.org/10.5194/ms-2026-172", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Mechanical Sciences誌の公開討論用原稿（PDF）の本文（データ作成、手法、結果、付録と図表）を読んだ", "preprint": true, "p1": "磁気浮上式鉄道（EMS）の軌道不整の時系列から、浮上ギャップ（電磁石と軌道の隙間）の時間応答を一度に出力する代理モデル（Residual DCT-SNO）を作り、高忠実度の連成解析をくり返さずに応答とそのスペクトル構造を再現できるようにした。", "p2": "車両-軌道-電磁系の高忠実度シミュレーションは条件ごとに計算が重く、LSTMなどの系列モデルは振動の周波数特性を保ちにくい（§1）。汎用のフーリエ・ニューラル演算子（FNO）は全帯域を複素数で扱うため、低周波が支配的という浮上系の性質を構造として使っていない（§3.3）。", "p3": "入力は軌道不整の関数、出力はギャップ応答の関数で、その写像を学習する（§3.1）。各ブロックで離散コサイン変換（DCT）した係数のうち低次K個（K=64）だけに学習可能な重みを掛け、高次はゼロにして逆変換し、これに時間領域の全結合の残差枝を足す（式12〜15）。解釈：「ギャップは長波長の不整に主に応答する」という知識を、使う周波数の帯域を絞るという形で網の構造に埋め込んでいる。損失は時間領域の平均二乗誤差だけで、スペクトルは学習に使っていない（§3.4）。", "p4": "上海の高速磁気浮上の実測統計から広帯域・狭帯域・混合の3種の不整を合成し、速度3水準×振幅4水準×スペクトル3種の36ケースをUM–Simulinkの連成解析で作った（§2.3）。500 km/hで振幅1.5と2.0の6ケースを学習から除いて検証し、MLP・GRU・LSTM・FNOと、帯域エネルギー一致度（1に近いほど良い）、累積スペクトルのKS距離とEMD（小さいほど良い）で比べた（§4.4）。", "p5": "時刻歴は位相と包絡が一致し、10・23・32 Hz付近の狭帯域のピークもほぼずれずに再現されたが、鋭い極値はやや潰れた（§4.1〜4.2、図7〜9）。帯域エネルギー一致度0.977、KS距離0.078、EMD 0.034で、FNOの0.953、0.177、0.083より良く（表4）、1サンプルの推論時間は0.261秒から0.025秒に短縮した（表5）。", "p6": "著者は、検証は学習範囲内の未学習の組合せ（内挿）であり、300〜500 km/hの外、車両荷重・制御則・軌道剛性の変化、横方向の不整では未検証で、実測による検証が必要と認めている（§4.5）。残る疑問：検証は6ケースと少なく、データとコードは制約付きの提供で、時間領域の誤差の数値は図でしか示されていない。", "fun": "線路のわずかな凸凹が、時速500 kmで浮いて走る車両と線路のすき間をどう揺らすかを、重い物理計算の代わりにAIで一瞬で予測する研究だ。面白いのは、AIに「揺れの大部分はゆっくりした長い波で決まる」という物理の知識を、使ってよい波の種類を制限するという単純な形で教えた点で、それだけで計算が約10倍速くなり、揺れの周波数の特徴も保たれた。", "unverified": "時間領域のRMSEの具体値（図6）と、表1の車両パラメータの詳細は確認していない。"}}, {"id": "pr02", "rank": 2, "headline": "実証研究1万件から合成ペルソナを組み立てる", "title": "MetaPersona: Task-Grounded Synthetic Populations from Empirical Social Science", "url": "https://arxiv.org/abs/2609.38392", "authors": "Jinyi Ye ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Ye, J., Li, Y., Yu, C., Poddar, P., Dey, P., Ye, L., Wang, Z., Hu, X., Ferrara, E., & Zhao, Y. (2026). MetaPersona: Task-Grounded Synthetic Populations from Empirical Social Science (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38392", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データベース構築、生成手順、3つの事例研究の結果、限界の節と表1〜3）を読んだ", "preprint": true, "p1": "LLMで社会を模擬するときのペルソナに「どの属性を入れ、どんな値を振るか」を、11,000件超の実証研究から引いた変数と因果の向きに基づいて決める方法（MetaPersona）を作り、課題によっては人の回答の再現が良くなることを示した。", "p2": "ペルソナ作りは人口属性だけを与えるか、LLMに生い立ちや属性を自由に作らせるのが主流で、どの潜在属性が結果を左右するか、属性同士の依存関係をどう保つかに根拠がない（§1、付録A）。そのため合成集団の構成や依存構造が実態とずれうる。", "p3": "心理学・政治学・経済学など6分野のQ1誌から実証研究11,638件を集め、題名と抄録からLLMで変数・分布の形・変数間の向きと強さを抽出してデータベース化した（§3）。課題文で関連研究を検索し、人口属性→潜在属性→結果の層をもつ依存グラフを作り、中心性の高い潜在属性を3つ選ぶ（式3）。各エージェントの人口属性は実調査の個票から引き、潜在属性はガウス・コピュラで人口属性に条件づけて統計的に生成する（式4〜5）。例：誤情報の見分けでは認知的熟慮（CRT）が潜在属性として選ばれる。", "p4": "誤情報の見分け（MIST、1,000人）、所得再分配の支持（ISSP 2019）、AIツールへの感情（Stack Overflow調査）の3課題で、各ペルソナを実在の回答者と対応させ、人口属性のみ・生い立ち・LLM任せの潜在属性の3基準と、GPT-5.2・Claude Haiku 4.5・DeepSeek-V3.2で比べた（§5.1〜5.2）。個人単位の誤差、分布の距離、変数間の相関の再現で評価した（§5.3）。", "p5": "MISTでは3モデルすべてでRMSE・MAE・分布の指標が最良で、GPT-5.2ではRMSEが0.270（人口属性のみは0.310）だった（表2）。Stack Overflowでは重み付きカッパが最良の基準の0.073から0.320（GPT-5.2）に上がったが、ISSPでは結果がまちまちで、GPT-5.2ではどの指標でも首位でなかった（§5.4）。CRT→見分けの相関は実データ0.313に対し0.293と近かった（表3）。", "p6": "著者は、対象を6分野の論文誌に限り、全文ではなく題名と抄録から抽出しているため強く頑健な効果に偏ること、人口属性の抽出枠が得られない母集団には使えないことを限界に挙げる（Limitations）。残る疑問：効果量の多くはLLMが補った事前分布で、文献の偏りがそのまま合成集団に入りうる。", "fun": "AIに「ある年齢の男性になりきって答えて」と頼むだけでは、その人がニュースをどれだけ疑ってかかる性格かまでは分からない。この研究は、人を対象にした11,000件以上の実証研究から「どんな性格や考え方が答えを左右するか」を集め、それを持たせた架空の人々をつくった。年齢や性別よりも、見えない心の特徴をどう配るかが本物らしさの鍵になるという発見が面白い。", "unverified": "付録C.3の人手による抽出の検証結果の数値と、付録Eの他モデルでの構造的再現の結果は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "組み替えられる財務諸表の長期系列を最適化で復元", "title": "Reclassified to Conform", "url": "https://arxiv.org/abs/2609.38754", "authors": "Chris Martin", "venue": "arXiv", "date": "2026-10-01", "apa": "Martin, C. (2026). Reclassified to Conform (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38754", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、§5の結果と応用、表3〜6の説明）を読み、手法の節（§4）は目次と抄録の範囲で確認した", "preprint": true, "p1": "年次報告書ごとに名前や区分が組み替えられる財務諸表の各行を、整数計画法でつなぎ直し、15年分の一貫した系列を、各数値の出典の提出書類つきで自動復元できるようにした。", "p2": "企業は提出のたびに勘定科目を改名・統合・分割・移動し、比較年度も2〜3年分しか組み替えないうえ、提出書類間の機械可読な対応表はなく、XBRLのタグも科目名も固定ではない（抄録）。タグだけで追うと、組み替えの境目で系列が途切れる。", "p3": "同じタグで数値が提出間で一致する行は同じ行とみなして「ストランド（strand）」としてつなぎ、提出の境目ごとに、改名・統合・分割などの候補の編集と、その編集が書類の記載以上に読み手に信じさせる度合いを示す「価格」を列挙する（抄録、§4）。整数計画法で、どの行もちょうど一度だけ説明される最も安い編集の組を選ぶ。例：Appleの2022年報告では、普通株発行収入（2020年分880）がその他財務活動（754）に吸収されたと判定された（§5.1）。", "p4": "開発に使った32社（800の境目）と、事後に評価した無作為の200社（6,103の境目）で、宣言された合計が再構成後も成り立つか（算術検査）、表示の様式を変えても数値が変わらないか、商用データ（FMP）の系列と一致するかを、タグだけで追う方法と比べた（§5.1）。", "p5": "算術検査の合格率は32社で99.7%、200社で99.9%だった（表5）。商用系列との比較（200社のうち124社）では、タグだけでは届かない5,004セル（9.7%増）を新たに埋め、全体の一致率は83.6%から91.2%に上がり、追加分の一致率は90.4%だった（表6）。キャッシュフロー計算書は組み替えが多く、境目の22%（200社）に形の変化があった（表3）。", "p6": "著者は、商用系列は正解ではなく一致率は精度ではないこと、GEやBerkshireのように複数の実体を列に持つ企業では合計が合わないこと、出力は企業内の時系列の標準化で企業間比較用ではないことを認めている（§5.1〜5.2）。残る疑問：米国のXBRL以外の開示制度で同じ価格づけが通用するかは示されていない。", "fun": "会社の決算書は毎年少しずつ項目名や分け方が変わるので、10年分を横に並べるだけでも、どの行とどの行が同じものかを人が推理する必要がある。この研究はそれを「書類に書いていない仮定をできるだけ少なくする組合せ」を探すパズルとして数学的に解いた。答えの副産物として、会社がいつ何を組み替えたかの記録が手に入るのも面白い。", "unverified": "§4の価格の定義と定数の詳細、付録の個別事例（GE以外の失敗例）は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "AI面談では高評価の裏に懸念が語られる", "title": "Positive Ratings, Hidden Concerns: Employee Voice Disclosure in AI-Mediated Organizational Listening", "url": "https://arxiv.org/abs/2609.38788", "authors": "Thilo Tamme ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Tamme, T., Saatkamp, M., Bonte, A., Weiss, D., Hantel, A., & Levin, A. (2026). Positive Ratings, Hidden Concerns: Employee Voice Disclosure in AI-Mediated Organizational Listening (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38788", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "arXiv版（HICSS-60採択と記載）のPDF本文（方法、結果、根拠づけた理論モデル、限界の節と表3）を読んだ", "preprint": true, "p1": "職場でAI音声面談と質問紙を同じ回に行うと、質問紙では好意的に答えた同じテーマについて、面談では具体的な懸念が語られることがあると示し、従業員が懸念を「和らげて」話す仕組みを理論モデルにまとめた。", "p2": "組織はAIエージェントを使った従業員の声の聞き取りを始めているが、上下関係のリスクがあるとき、その経路で従業員が何をどう話すかは分かっていなかった（§1）。従来の発言（voice）研究は、沈黙を「言わないこと」として扱ってきた。", "p3": "グローバル・コンサルティング会社で、4段階の質問紙（中立の選択肢なし）の直後に、AI音声エージェントが仕事量・顧客価値・リーダーの関与などのテーマを掘り下げて尋ねる（平均6.05分、10.6往復）（§3.2）。同じテーマで好意的な評定と面談中の具体的な懸念が同時に起きた場合を「開示のずれ」と定義し、2人の符号化者で判定した（§3.4）。発言はGioia法で概念化し、LLMは引用候補の提案にだけ使った。", "p4": "初回の44面談（3テーマで132の対応）でずれの頻度を数え、適格な65面談から自己防衛的な引用158件を抽出して、和らげる・責任をそらす・開示の深さを区切る・AIによる聞き取りの正統性を条件にする、の4つの機構に分類した（§3.3、表3）。ずれの有無の判定の一致率は81.0%、κ=0.47だった（§3.4）。", "p5": "44面談の41%（18件）で少なくとも1つのずれがあり、テーマ単位では18%（132件中24件）だった（§4.1）。ずれのある面談では防衛的引用の59%が「和らげ」で、ずれのない面談（36%）より多かった一方、開示の深さを区切る発言と正統性への条件づけは、ずれのない面談に多かった（25%対7%）（表3）。著者はこれを、懸念が語られても弱められる沈黙と、懸念自体が出てこない沈黙の2種類と解釈する（§4.3）。", "p6": "著者は、階層の強い1社のみの事例であること、自発参加による選択の偏り、面談記録は正解ではなく経路間の違いを測っているにすぎないこと、音声を保存していないため書き起こしの正確さを検証できないことを限界に挙げる（§6.3）。残る疑問：44面談の記述統計であり、命題は今後の検証を要する仮説にとどまる。", "fun": "アンケートで「仕事量は大丈夫」に丸をつけた人が、AIに詳しく聞かれると「実は毎晩遅くまで…」と話し出す。でも同時に「まあ何とかなっています」と和らげてしまう。言葉にしているのに本音の重さは伝わらない、という「話しているのに沈黙している」状態があると見抜いた点が面白い。", "unverified": "図1・図2（データ構造と過程モデル）と4つの命題のうち命題2〜4の正確な文言は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "若者のケア負担と心の健康、半分は選択効果", "title": "Informal Caregiving and the Mental Health of the Young: Panel Evidence from Uruguay", "url": "https://doi.org/10.21203/rs.3.rs-10952356/v1", "authors": "Evelin Lasarga", "venue": "Research Square", "date": "2026-09-30", "apa": "Lasarga, E. (2026). Informal Caregiving and the Mental Health of the Young: Panel Evidence from Uruguay. https://doi.org/10.21203/rs.3.rs-10952356/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareに掲載されたPDF本文（データと測定、結果、頑健性の節と表6〜7）を読んだ", "preprint": true, "p1": "ウルグアイの若者を12〜15歳から16〜19歳まで追ったパネルで、家族の無償のケア（介護など）を担うことと心の健康の悪さの関係のうち、約半分は「誰がケアを担うか」という選択によるもので、残りの半分はケアを始めたこと自体の影響だと切り分けた。", "p2": "ケアを担う若者ほど心の健康が悪いという横断的な事実はあるが、困窮した家庭や混乱した家庭の若者がケア役になりやすいため、因果か選択かは分からなかった（§3）。中南米では代表性のある縦断データ自体が乏しかった（§1）。", "p3": "国の若者調査（ENAJ）の2波パネル959人を使い、5段階の項目から項目反応モデルで両年を比較できる苦痛指数（標準偏差単位）を作った（§4）。同じ人の2時点の差をとる個人内比較で、変わらない個人差（性格や家庭の固定的な事情）を消し、「ケアを始めた」と「やめた」を分けて推定した。家族の死別・重病のショックを比較の基準にした（§3、表7）。", "p4": "横断的な関連（統制あり）と個人内差分の推定値を比べ、ケアの相手（高齢・病気の親族、きょうだい）別に分けた（表7）。頑健性として、ベースラインの差、逆因果、観測されない選択の強さの診断（Oster）、脱落の重みづけ、パンデミック期の所得・失業・遠隔授業の統制、多重検定の補正を確かめた（§7.3）。", "p5": "苦痛の差は性別（女性が0.59 SD高い）と父親の不在で大きく、所得の勾配はほぼ平坦だった（表6）。ケアと苦痛の横断的関連0.336 SDは個人内比較で0.169 SD（p=0.03）に半減し、ケアの開始は0.305 SD、高齢・病気の親族のケアの開始は0.545 SD苦痛を高めたが、ケアをやめても改善は有意でなかった（表7）。死別・重病ショックは0.236 SDで、ショックを統制しても開始の効果は0.29 SDと変わらなかった（§7.2）。", "p6": "著者は、2時点しかないため事前の傾向を検定できないこと、ケア開始と同時に起きる時変のショックに弱いこと、期間がパンデミックと重なり回想の偏りがありうることを認め、推定は準実験的な証拠として扱うとしている（§1、§7.3）。残る疑問：ケアを始めた人は83人と少なく、95%信頼区間は約0.05〜0.53と広い。", "fun": "家族の介護をしている若者が落ち込みやすいのは、介護のせいなのか、もともと大変な家庭の子が介護役になりやすいからなのか。同じ人を4年後にもう一度調べて比べると、その半分は「誰が担うか」で説明でき、残りの半分は「介護を始めたこと」の影響だった。介護をやめても元に戻らないという非対称さも、考えさせられる発見だ。", "unverified": "表8の頑健性の全数値と、測定の節の項目反応モデルの詳細（図1）は確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "韓国の合成ペルソナ調査の分布再現力を検証", "title": "Distributional Validity of a Korean Synthetic Persona Panel: Evidence From the Korea Media Panel Survey", "url": "https://doi.org/10.31235/osf.io/zb3w2_v2", "authors": "Howard Kim ほか", "venue": "SocArXiv", "date": "2026-10-01", "apa": "Kim, H., & Cho, K. T. (2026). Distributional Validity of a Korean Synthetic Persona Panel: Evidence From the Korea Media Panel Survey. https://doi.org/10.31235/osf.io/zb3w2_v2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXivに置かれた著者版（IEEE Access 第14巻に掲載済みと記載）のPDF本文のうち、方法のデータの節、抄録の結果、結論と限界の節を読んだ。査読済みの雑誌論文の著者版のため未査読扱いにしていない", "preprint": false, "p1": "韓国の合成ペルソナ（Nemotron-Personas-Korea）を条件づけたLLMの回答が、国の公式統計である韓国メディアパネル調査のデジタル・AIサービス利用の分布をどこまで再現するかを測り、補正しても少数の実データに勝てないことを示した。", "p2": "LLMのペルソナを調査回答者の代わりに使う提案は多いが、英語圏以外での検証は乏しく、平均の一致だけでなく層別の誤差や、補正で実用になるかは分かっていなかった（抄録、§I）。", "p3": "層化抽出したペルソナ約8,000人ずつにGemini 3.5 FlashとEXAONEで8つのサービス利用と8つの態度尺度に答えさせ、事後層化した合成推定を、調査のウェイトつき推定（2024年は4,006世帯8,693人）と比べた（§III-A、抄録）。さらに実データの30%で誤差の型に合わせた補正を学習し、残り70%と翌年の波で評価した（§III）。", "p4": "評価は全体の平均絶対誤差（MAE、%ポイント）、二値項目の平均の相関、性・年齢など5軸の層別誤差、層間の符号つき誤差の幅で行い、補正後の合成パネルを、実データだけの直接推定や縮小推定と比べた（抄録、§VI）。", "p5": "全体のMAEは14〜19ポイント、二値項目の相関は0.70〜0.91で、誤差はモデル固有だった（Geminiは年齢の固定観念、EXAONEは同意傾向による水準の偏り）（抄録）。補正で性・年齢のセルの誤差は18.3/15.1から4.9/4.4ポイントに下がったが、同じ30%の実データから直接推定すると3.6ポイントでより正確で、合成パネルが勝つのは実回答がおよそ250〜860件未満の場合に限られた（抄録、§VI）。", "p6": "著者は、結論が韓国・デジタル/AIサービス・2つのLLM・2024〜2025年に限られること、主分析は1ペルソナ1回答であること、2025年波には態度尺度がないことなどを限界に挙げ、合成パネルは調査の代替ではなく診断用だと結論している（§VI）。", "fun": "AIにモデルごとに約8,000人分の「架空の韓国人」になりきってもらい、スマホやAIの使い方のアンケートに答えさせると、本物の国の統計とは平均で14〜19ポイントずれた。誤差を直す工夫をしても、数百人分の本物の回答があればそちらの方が正確だった。AIの答えは「どこがずれやすいか」を見つける道具にはなるが、調査の代わりにはならない、というはっきりした結論が面白い。", "unverified": "§IVの層別の詳細な表と、ペルソナ条件づけの除去実験（付録I）の数値は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "母国語と英語でリスク開示の重点が違う", "title": "Lost in Translation or Strategic Choice? LLM Evidence on Multilingual Risk Disclosure Asymmetry", "url": "https://doi.org/10.2139/ssrn.7546558", "authors": "Wonwoo Kim ほか", "venue": "SSRN", "date": "2026-10-01", "apa": "Kim, W., & Lee, S. (2026). Lost in Translation or Strategic Choice? LLM Evidence on Multilingual Risk Disclosure Asymmetry. https://doi.org/10.2139/ssrn.7546558", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず（403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国に上場する韓国・日本企業が、母国語の年次報告と米国証券取引委員会（SEC）への英語の報告で、リスクの書き方に一貫した違いがあることをLLMによる対応づけで示した（抄録）。", "p2": "同じ企業が二つの言語・市場で開示するとき、重点の違いが翻訳上のずれなのか戦略的な選択なのかは分かっていなかった（題名、抄録）。加えて、LLMで多言語の文書を分析すると言語による測定の偏りが入りうる（抄録）。", "p3": "米国の提出書類と対応づけた韓国・日本企業の118組の書類から、機械的に検証した31,744件のリスク記述を抽出し、言語間で比較した（抄録）。LLMによるテキスト分析の言語間の測定バイアスを検定・緩和する枠組みも示したとされるが、具体的な手順は未確認（抄録・本文を入手できず）。", "p4": "開示の違いが企業の固定的な性質か（企業固定効果の説明力）、そして違いの大きさがその後の実現ボラティリティや株式リターンと関係するかを調べた（抄録）。比較対象のモデルや指標の詳細は未確認。", "p5": "母国語の開示は財務・市場の状況を、米国向けは規制・ガバナンスのリスクを強調していた（抄録）。この非対称は企業ごとに持続し、変動の96.7%が企業固定効果で説明された。違いが大きい企業ほどその後の実現ボラティリティと絶対リターンが小さかったが、符号つきのリターンとは関係がなかった（抄録）。", "p6": "限界は未確認（抄録・本文を入手できず）。解釈：118組と標本が小さく、米国上場の企業に限られるため、国内のみ上場の企業の開示言語の比較に一般化できるかは別に検討が要る。", "fun": "同じ会社が日本語と英語で「うちの会社のリスク」を説明すると、日本語ではお金や市場の話を、英語では規制や企業統治の話を強調していた。翻訳の問題というより、誰に向けて話すかで中身を選んでいるらしい。読み手によって話を変えるという人間らしい行動が、AIによる大量の読み比べで見えてくるのが面白い。", "unverified": "本文を入手できず、リスクの分類方法、LLMの種類、言語間の測定バイアスの検定手順、各推定の統計的有意性は確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "逐次討論は最初の発言者に引きずられる", "title": "When Order Matters: First-Speaker Bias and Mitigation through Personality in Sequential Multi-Agent Debate", "url": "https://arxiv.org/abs/2609.38964", "authors": "Duofeng Xu ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Xu, D., Hooi, B., & Qiao, D. (2026). When Order Matters: First-Speaker Bias and Mitigation through Personality in Sequential Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38964", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設計、指標、結果、結論、限界の節と表1〜3）を読んだ", "preprint": true, "p1": "LLMを順番に発言させる多エージェント討論では、最初に話すエージェントの影響が大きい「先発者バイアス」があり、強いモデルを最後に置くと不利になること、その不利は強いモデルに「協調性の低い」性格を与えると部分的に取り戻せることを示した。", "p2": "多エージェント討論（MAD）は推論を高める手法として使われるが、逐次の討論が各エージェントの意見を中立に集約しているかは確かめられていなかった（§1）。発言順や性格づけが誰の意見を通すかを変えるかは未検証だった。", "p3": "弱いモデル2体と強いモデル1体の3体で、1ラウンド1回ずつ4ラウンド発言させ、最終ラウンドの多数決を答えとする（§3.2）。強いモデルを最後（W-W-S）か最初（S-W-W）に置き、さらにW-W-Sでビッグファイブの協調性または外向性を高・低に設定したプロンプトを強い側か弱い側に与える（§3.4）。「影響力」は、強弱の単独回答が食い違った問題で最終回答がどちらの単独回答と一致したかの割合で測る（§4.1）。", "p4": "MMLU-Pro・GPQA Diamond・SuperGPQA・AQuA-RATの約200問ずつで、4系統7モデルからなる10通りの強弱の組合せを温度0で評価し、ベンチマーク×組合せの40セルで対応のある差を、t検定・Wilcoxon・符号検定・混合効果モデルで確かめた（§3.1、§4.2）。", "p5": "強いモデルの影響力はS-W-Wで79.84%、W-W-Sで58.83%（差21.01ポイント）で、正答率も68.78%対66.43%と先に置く方が高かった（表1）。W-W-Sで強いモデルの協調性を低くすると影響力が9.55ポイント、正答率が1.64ポイント上がった（§5.2）。ただし強い側を低協調・弱い側を高協調にすると影響力は71.43%に上がる一方で正答率は下がり、影響力の最大化が正解率の最大化ではなかった（付録D）。外向性は説明の長さを変えたが影響力への効果の向きは一貫しなかった（§5.3）。", "p6": "著者は、3体という統制された設定であること、7モデルに限られること、選択式の課題に限られ自由記述の協働は未検証なこと、性格は安定した人格ではなくプロンプトによる行動の介入で、文言を変えた頑健性の確認は1組合せのみであることを認めている（Limitations）。", "fun": "会議で最初に発言した人の意見に場が引っぱられるのは人間だけかと思いきや、AI同士の話し合いでも同じことが起きた。しかも、一番賢いAIを最後に話させると、先に話した2体に流されて正答率が下がる。そこで賢いAIに「簡単には同意しない性格」を与えると持ち直す、という人間くさい対策が効くのが面白い。", "unverified": "表2・表3の各条件の平均差（Mean Δ）の数値のうち本文で言及されていないもの、付録Cの能力差による調整効果の大きさは確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "氷を含むモレーンダムの決壊を実験と流体計算で追う", "title": "How does buried ice in moraine dams modulate landslide-induced glacial lake outburst floods?", "url": "https://doi.org/10.2139/ssrn.7544964", "authors": "Zhifei Yang ほか", "venue": "SSRN", "date": "2026-09-30", "apa": "Yang, Z., Sun, Y., & Cao, Z. (2026). How does buried ice in moraine dams modulate landslide-induced glacial lake outburst floods? https://doi.org/10.2139/ssrn.7544964", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "地すべりが氷河湖に落ちて段波が生じ、氷を含むモレーンダム（氷河の堆積物でできた天然ダム）が決壊して洪水になる一連の過程を、水理模型実験と3次元の流体計算（CFD）で一体として再現し、ダム内の埋没氷が決壊を速めることを示した（抄録）。", "p2": "地すべり起因の氷河湖決壊洪水（GLOF）は、段波・ダムの決壊・下流への洪水伝播という複数の過程が絡むが、従来は過程ごとに別のモデルで計算されることが多く、ダム内の埋没氷の影響はほとんど分かっていなかった（抄録）。", "p3": "物理模型実験で地すべりによる段波がダムを越流して決壊させる過程を観察し、同じ条件を3次元CFDで再構成した（抄録）。埋没氷の含有量、地すべりの体積、ダムまでの距離、初期の湖水位を変えて比較した（抄録）。模型の縮尺、氷の模擬方法、CFDの数値手法は未確認（本文を入手できず）。", "p4": "評価したのは決壊の進み方、洪水のピーク流量、ピークまでの時間で、実験と3次元CFDの再現性を比べた（抄録）。比較の定量的な指標は未確認。", "p5": "段波はダムを周期的に越流し、決壊は段階的に進んだ（抄録）。埋没氷が多いほどダムの安定性が下がり、決壊が速まり、ピーク流量が増え、ピークが早まった。地すべりの体積が大きい、ダムに近い、初期水位が高いほど決壊は速く洪水は強まり、埋没氷の影響は地すべりの体積が小さいほど顕著だった（抄録）。数値の大きさは未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：実験は縮尺模型によるため、実スケールの埋没氷の融解や土の物性への外挿には現地事例による検証が要る。", "fun": "山の氷河湖は、氷河が運んだ石や砂が積もった天然のダムでせき止められていて、その中に氷が埋まっていることがある。地すべりが湖に落ちると波がダムを何度も乗り越えて少しずつ削り、氷が多いほど早く崩れて大きな洪水になる。波・崩壊・洪水という別々に考えられがちな現象を、一つの実験と計算で通して追った点が面白い。", "unverified": "本文を入手できず、実験の縮尺と条件の数、CFDの手法、決壊速度やピーク流量の変化の大きさは確認できなかった。"}}, {"id": "pr10", "rank": 10, "headline": "株価情報は会計ベースの倒産予測を補うか", "title": "Do Equity-Market Signals Add to Accounting-Based Default-Risk Assessment? Evidence from China", "url": "https://doi.org/10.2139/ssrn.7544210", "authors": "Guiyuan Ma ほか", "venue": "SSRN", "date": "2026-09-30", "apa": "Ma, G., Ma, Z., Yan, J., & Yu, Y. (2026). Do Equity-Market Signals Add to Accounting-Based Default-Risk Assessment? Evidence from China​. https://doi.org/10.2139/ssrn.7544210", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国の上場企業の倒産リスク評価で、財務諸表の情報に株式市場の情報を加える効果を、期間外の厳密な検証で比べ、効くのは株価で割った評価倍率だけで、市場リスクの構造変数や取引の微細構造の信号は一貫した上積みをもたらさないことを示した（抄録）。", "p2": "株価情報は会計情報を補うと考えられがちだが、どの種類の市場情報が、実際に意思決定に使える予測力を上積みするかは、事前に定義を固定した期間外検証では十分に確かめられていなかった（抄録）。", "p3": "2015〜2025年の39,970企業年について、情報の組（財務諸表項目、企業特性と評価倍率、構造的な市場リスク、終値の停滞）を変えたモデルを2016〜2019年で推定し、再推定せずに2020〜2025年で評価した（抄録）。終値の停滞（売買代金があるのに調整後リターンがゼロの日の割合）は2020年前のデータだけで定義を選び、デフォルト確率（EDF）の裾の閾値とともに凍結した（抄録）。", "p4": "識別力はAUC、確率の当てはまりはBrierスコアと対数損失で測り、企業単位のブロック・ブートストラップで推論した（抄録）。", "p5": "財務諸表項目だけのモデルの期間外AUCは0.8023で、企業特性と評価倍率を加えると0.8230に上がり、Brierスコアと対数損失も改善した（抄録）。構造的な市場リスクを加えるとプール全体のAUCは0.8211に下がり（各年内では上がる）、終値の停滞を加えると0.8183に下がって適正スコアも悪化した（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、終値の停滞を最強の予測因子ではなく診断例として扱い、統計的な関連や時間的な持続性があっても意思決定上の有用性を意味しないと述べている（抄録）。", "fun": "会社が倒産しそうかを当てるとき、決算書だけでなく株価の動きを見れば精度が上がりそうに思える。ところが未来のデータで厳密に試すと、効いたのは「株価が会社の利益や資産の何倍か」という情報だけで、凝った市場の指標はむしろ精度を下げた。「関係がある」ことと「予測に役立つ」ことは違うと示した点が面白い。", "unverified": "本文を入手できず、倒産・デフォルトの定義、使ったモデルの種類、ブートストラップの信頼区間は確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "取引網と陽性・未ラベル学習で脱税企業を探す", "title": "Fraud Detection via Bayesian Positive--Unlabeled Learning with Gaussian Processes and Multilayer Networks", "url": "https://arxiv.org/abs/2609.38586", "authors": "Konstantinos Bourazas ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Bourazas, K., Alexopoulos, A., Dellaportas, P., & Kalogeropoulos, K. (2026). Fraud Detection via Bayesian Positive-Unlabeled Learning with Gaussian Processes and Multilayer Networks (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2609.38586", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデル、識別、ギリシャのエネルギー市場への適用と検証、事後リスクの節と表5〜6）を読んだ。シミュレーションの節は目次の範囲", "preprint": true, "p1": "税務調査で摘発された不正企業だけが分かり、残りは「白」と確認されていないという状況で、企業の指標と複数層の取引ネットワークを組み合わせて不正リスクを順位づけし、見逃された不正の件数まで推定するベイズ分類法を作った。", "p2": "不正の検出では、調査されなかった企業や調査で見逃された企業も「0（不正なし）」として扱われがちで、それが学習を歪める（§2.2）。また不正企業は申告する数値自体を操作するため、指標だけでは見抜けず、企業間の関係の情報が要る（抄録、§1）。", "p3": "指標と各ネットワーク層をそれぞれガウス過程の「専門家」とし、対数オッズを足し合わせる積（Product of Experts）で一つの不正確率にまとめる（式1、注2.1）。観測ラベルは「真に不正なら確率1−ηで記録、不正でなければ必ず0」という片側のノイズとして扱い、見逃し率ηも同時に推定する（式2）。ηが共通なら確率の較正は変わるが順位は変わらないことを示した（§3、抄録）。", "p4": "ギリシャの税務当局から提供された、規制されたエネルギー市場の2023年の調査対象550社（不正確認37社、指標13個、守秘のため名称を伏せた3つのネットワーク層）で、確認済みの1社ずつを未ラベルに戻して順位を見る交差検証を行い、AUCなどで線形モデル、nnPU、AdaBoost、グラフニューラルネットワーク（GCN）と比べた（§6.1〜6.2）。", "p5": "AUCは線形の指標のみで0.904、ネットワーク込みのPUで0.957、提案のGP-PoEで0.975、GP-PU-PoEで0.974で、nnPU+ネットワーク0.968、GCN 0.948を上回った（表5）。全社で推定した見逃し率ηの事後平均は0.137、見逃された不正は約5〜6件と推定され、上位6社のうち既に独立に再調査されていた2社はどちらも不正と確認され、残る4社は当局が追加調査の対象にした（§6.3）。指標の寄与の事後の割合は事前の0.500から0.301に下がり、ネットワークの寄与が増えた。", "p6": "解析は調査の優先対象となった企業に限られ、市場全体の不正の割合ではないこと、見逃し率の推定は順位づけよりはるかに不確実であることを著者は認めている（§6.1、§6.3）。残る疑問：見逃しが企業によらず一定という仮定（SCAR）が崩れる場合の影響と、ネットワークの定義が伏せられていることによる再現性。", "fun": "税務署が調べて「黒」と分かった会社は確かだが、調べていない会社が「白」とは限らない。この研究は「見逃しがあるかもしれない」ことを最初から計算に入れ、取引のつながりから怪しい会社を順位づけた。上位6社のうち、すでに別に調べられていた2社がどちらも実際に不正だったというのは、統計モデルの答え合わせとして胸のすく結果だ。", "unverified": "シミュレーション（§5）の結果の詳細と、付録の事前分布の設定値は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "砂の詰まったバラスト軌道の振動特性を実測", "title": "Dynamic Characteristics of Sand-Fouled Ballasted Railway Tracks: Full-Scale Modal Testing, Finite Element Modeling, and Condition Assessment", "url": "https://doi.org/10.2139/ssrn.7545965", "authors": "Babak Shirii ほか", "venue": "SSRN", "date": "2026-09-30", "apa": "Shirii, B., & Esmaeili, M. (2026). Dynamic Characteristics of Sand-Fouled Ballasted Railway Tracks: Full-Scale Modal Testing, Finite Element Modeling, and Condition Assessment. https://doi.org/10.2139/ssrn.7545965", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "砂漠地帯でバラスト軌道に砂が入り込む「砂の詰まり（ファウリング）」の程度と位置を、実物大のモード試験と3次元有限要素（FE）モデルの振動特性から評価する方法を示した（抄録）。", "p2": "風で運ばれる砂の浸入は、砂漠の鉄道のバラスト軌道の動特性・使用性・保守を損なうが、詰まりの程度と空間分布を信頼性よく判定する方法が必要だった（抄録）。", "p3": "実物大のまくらぎ−バラスト系を清浄時と人工的に砂を詰めた状態でモード試験し、FEモデルで砂の混入率15・25・30・35%、まくらぎの支持喪失、1〜3区間の局所的な詰まりを解析した（抄録）。解釈：支持条件の変化は剛体モードと1次曲げモードの固有振動数とモード形に表れるため、振動から支持状態を逆に読み取れるという発想である。", "p4": "固有振動数の低下率、モード形の対称性、エネルギー散逸、正規化した最大鉛直たわみを状態の指標とし、清浄時から高度の詰まり・支持喪失までを比べた（抄録）。モデルと試験の一致度の数値は未確認。", "p5": "詰まりの悪化と支持喪失で、固有振動数は剛体モードで68%、1次曲げで23%低下し、高度に詰まって支持がある場合は41%と16%、中程度の清浄状態では約10%と5%未満だった（抄録）。高次モードは支持条件に鈍感で、モード形は清浄時の対称から、詰まりの程度と位置に応じた非対称へ変わった（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：試験は実物大とはいえ単一のまくらぎ系で、列車走行時の荷重や温度など運用条件のもとで同じ指標が識別できるかは別途の検証が要る。", "fun": "線路の石（バラスト）のすき間に砂漠の砂が入り込むと、クッションが硬く偏って、まくらぎの揺れ方が変わる。叩いて揺らしたときの「音の高さ」にあたる固有振動数が最大で約7割も下がり、揺れ方の左右対称も崩れた。見えない地面の下の状態を、揺れの変化から聞き分けるという発想が面白い。", "unverified": "本文を入手できず、試験の加振方法、FEモデルの検証の精度、予測枠組みの具体的な形は確認できなかった。"}}, {"id": "pr13", "rank": 13, "headline": "35か国で孤独とテクノロジーの問題利用を比べる", "title": "Social Disconnection in a Hyperconnected World: Loneliness and Problematic Technology Use Across 35 Nations", "url": "https://doi.org/10.2139/ssrn.7546019", "authors": "Justin Thomas ほか", "venue": "SSRN", "date": "2026-09-30", "apa": "Thomas, J., Valle, M., Aljedawi, Y., Albeyahi, F. S., & Thrul, J. (2026). Social Disconnection in a Hyperconnected World: Loneliness and Problematic Technology Use Across 35 Nations. https://doi.org/10.2139/ssrn.7546019", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "35か国・35,000人の国際調査で、ゲームやSNSの問題的な使用が、どの国でも孤独の高さと結びついていることを示した（抄録）。", "p2": "孤独と社会的孤立（社会的断絶）は健康を損ない死亡を増やすが、モバイル技術、特にSNSとゲームが孤独を生む・保つ・悪化させるかの証拠は一貫せず、欧米以外での検討が少なかった（抄録）。", "p3": "国際的なデジタル・ウェルビーイング調査の一部として、参加者がUCLA孤独感尺度の短縮版、インターネット・ゲーム障害尺度、SNS障害尺度に回答した（抄録）。分析モデルの詳細（統制変数、国の扱い）は未確認（本文を入手できず）。", "p4": "国ごとの孤独の水準と、ゲームとSNSの問題的使用それぞれ・両方と孤独の関連を比べた（抄録）。標本の抽出方法と各国の標本規模は未確認。", "p5": "孤独の割合は国によって大きく異なった（抄録）。すべての国で、ゲームとSNSの問題的使用は、合わせても単独でも孤独の高さと関連していた（抄録）。関連の大きさの数値は未確認。", "p6": "著者は、関連の性質、つまりSNSやゲームがいつどのように孤独を引き起こし悪化させるかを理解するには、質的研究と実験研究がさらに必要だと述べている（抄録）。解釈：横断調査のため、孤独な人がのめり込むという逆向きの関係も区別できない。", "fun": "スマホやゲームに夢中になりすぎることと孤独が結びついているのは、欧米だけの話ではなく35か国どこでも見られた。ただし「スマホが人を孤独にする」のか「孤独な人がスマホに逃げ込む」のかは、この調査だけでは分からない。ニワトリと卵のどちらが先かという問いそのものが面白く、そして難しい。", "unverified": "本文を入手できず、国別の孤独の割合、関連の効果量、統制した変数は確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "企業のAI革新は従業員の残業を増やすか", "title": "Artificial intelligence innovation and employee overtime work: The moderating role of market competition", "url": "https://doi.org/10.2139/ssrn.7550189", "authors": "yongxin chen ほか", "venue": "SSRN", "date": "2026-10-01", "apa": "chen, y., Cao, H., Zhang, M., Guo, h., & Ouyang, J. (2026). Artificial intelligence innovation and employee overtime work: The moderating role of market competition. https://doi.org/10.2139/ssrn.7550189", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国の上場企業3,648社の2017〜2023年のデータで、企業のAIイノベーションと従業員の残業の関係が逆U字型であり、市場競争がその関係を強めることを示した（抄録）。", "p2": "AIの革新は組織の工程や慣行を変え従業員のwell-beingに影響するとされるが、企業のAI革新が実際の働き方（残業）にどう効くか、市場競争がそれをどう左右するかは実証が乏しかった（抄録）。", "p3": "企業レベルのAIイノベーションの指標と従業員の残業の指標を上場企業パネルで結び、AIイノベーションの2次項と市場競争との交差項を含む回帰で関係の形と調整効果を推定したとみられる（抄録から）。AIイノベーションと残業の測り方、識別の工夫は未確認（本文を入手できず）。", "p4": "3,648社・2017〜2023年のパネルで、AIイノベーションと残業の関係と、市場競争の調整の役割を検証した（抄録）。頑健性の確認や内生性への対処は未確認。", "p5": "AIイノベーションと残業の間には逆U字型の関係があり（ある水準までは残業が増え、それを超えると減る）、市場競争はこの関係を正に調整した（抄録）。転換点の位置や効果量は未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：企業単位の残業の指標が個々の従業員の経験をどこまで表すか、AI投資と残業を同時に動かす要因（業績の好不調など）をどう除いたかが結論の強さを左右する。", "fun": "会社がAIを取り入れ始めると、最初は新しい仕組みに慣れる手間で残業が増え、AIが十分に使いこなされると今度は残業が減っていく。そんな「山なり」の関係が上場企業のデータから見えた。技術は導入した瞬間に楽になるのではなく、途中に一度しんどい時期がある、という点は身近な経験とも重なって面白い。", "unverified": "本文を入手できず、AIイノベーションと残業の測定方法、推定モデル、転換点の位置と統計的有意性は確認できなかった。"}}, {"id": "pr15", "rank": 15, "headline": "光ファイバーで都市の陥没を監視する", "title": "Urban Sinkhole Monitoring Using Distributed Acoustic Sensing with Self-Supervised Denoising and Ambient Noise Tomography", "url": "https://doi.org/10.2139/ssrn.7545431", "authors": "Liang Lyu ほか", "venue": "SSRN", "date": "2026-09-30", "apa": "Lyu, L., Lin, J., Chen, G.-X., Zhao, Q., Ni, Y.-Q., & Wang, Y.-W. (2026). Urban Sinkhole Monitoring Using Distributed Acoustic Sensing with Self-Supervised Denoising and Ambient Noise Tomography. https://doi.org/10.2139/ssrn.7545431", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "道路沿いの200 mの光ファイバーを地震計の列として使う分散型音響センシング（DAS）で、常時微動から地下20 m程度までのS波速度構造を求め、都市の道路陥没の位置に低速度の異常を、深さ約10 mの鉄筋コンクリート管を事前情報なしに見つけた（抄録）。", "p2": "都市開発と豪雨で地表近くの陥没の危険が増しており、長距離・高密度に観測できる監視方法が必要だが、DASの記録には干渉性のフェーディング雑音などが多い（抄録）。", "p3": "記録済みの道路陥没のそばに敷いた光ファイバーでDASを測り、雑音同士を学習させる自己教師ありの除去法（Noise2Noise）で雑音を抑えた（抄録）。除去後の記録を相互相関・重合して経験的グリーン関数を得て、レイリー波の分散曲線を求め、逆解析で2次元のS波速度（Vs）モデルを作った（抄録）。解釈：地面の常時の揺れを2点で比べると、その間を伝わる波が取り出せ、その速さから地盤の硬さが分かる。", "p4": "重合の方法、時間、チャンネル数がグリーン関数の品質に与える影響を調べ、得られた速度構造を既知の陥没区域と比べた（抄録）。他の探査法との定量的な比較は未確認。", "p5": "複素信号平均（CSA）法で10分間・20チャンネルを重合すると信頼できる分散曲線が得られた（抄録）。深さ約20 mまでのVsモデルには陥没区域と一致する明瞭な低速度異常が現れ、深さ約10 mの鉄筋コンクリート管も事前情報なしに識別できた（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：1か所・200 mの現地実験であり、交通振動の多い時間帯や他の地盤条件での安定性、長期の監視での変化検出能力は今後の検証課題である。", "fun": "道路の下に通した光ファイバーが、そのまま何百個もの「地震計」の代わりになる。車や人が生む小さな揺れをAIで雑音とより分けて分析すると、地下の空洞のあたりで揺れが遅く伝わることが分かり、埋まった管まで見えた。通信用のケーブルで地面の中を透視するという発想が面白い。", "unverified": "本文を入手できず、速度異常の大きさ、雑音除去の効果の定量値、陥没の規模は確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "AIエージェント同士でも過激化は起こる", "title": "AI Agents are Vulnerable to Radicalization", "url": "https://arxiv.org/abs/2609.38296", "authors": "Ozgur Can Seckin ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Seckin, O. C., Ghosh, S., Flammini, A., Lerman, K., Grabe, M. E., & Menczer, F. (2026). AI Agents are Vulnerable to Radicalization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38296", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人物ペルソナを演じるLLMに、別のLLMが信念を極端化させようと働きかけると、どちらの経路でも過激化が起きることを対話の模擬で示した（抄録）。", "p3": "人口属性と心理的属性に基づくペルソナを演じる標的LLMと、信念を極端にさせようとする影響者LLMの会話を模擬し、既存の信念を強める「共鳴」と、重要と思っていない信念を勧める「説得」の2経路を、感情と行動の指標で比べた（抄録）。", "p5": "両方の経路で標的は過激化したが、共鳴の方が一貫して強い効果を持った（抄録）。迎合や未検証の主張などの戦術は過激化の程度を変えたが指標間で一貫せず、共鳴は関連する信念にも波及した（抄録）。", "fun": "AIに「ある人」を演じさせ、別のAIに説得させると、演じているAIの考えがどんどん極端になった。とくに、もともと持っている考えを「そうだよね」と強められる方が、新しい考えを吹き込まれるより効いた。人間のSNSでのエコーチェンバーと同じことが、AI同士でも起きうるという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "役割演技プロンプトはいつ効くのか", "title": "Cognitive Enhancement: Rethinking the Necessity of Role-Playing for Large Language Models", "url": "https://arxiv.org/abs/2609.39853", "authors": "Xingjie Zhuang ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Zhuang, X., Tang, J., Zhou, C., Zhan, B., Li, Z., Li, J., Yang, Y., & Su, J. (2026). Cognitive Enhancement: Rethinking the Necessity of Role-Playing for Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.39853", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMに役割を演じさせるプロンプトの効果は、モデルの規模、知識の領域、プロンプトの言語に強く依存することを示し、多言語の役割プロンプトを連結する簡単な改善法（MLCP）を提案した（抄録）。", "p3": "MMLUとMMLU-Reduxで複数モデル・複数領域・多言語の実験を行い、「LLMが指定されたペルソナとその知識領域を正しく把握したときだけ役割演技が効く」という仮説を、ペルソナ情報の量の除去実験、層ごとのエントロピー差、潜在空間のずれの観察で検証した（抄録）。", "p5": "役割演技の効果はモデルの能力・領域・言語で大きく変わり、意味が同じ役割プロンプトを複数言語で連結するMLCPは、学習なしで、試したすべてのLLMで通常の役割プロンプトを一貫して上回った（抄録）。", "fun": "AIに「あなたは物理学の教授です」と役を与えると賢くなる、という小技はよく使われる。でも実際には、AIがその役の中身を本当に理解しているときにしか効かなかった。同じ役の指示を英語や中国語など複数の言葉で重ねると安定して効く、という素朴な工夫が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "同系統モデルの相関した誤りを考えた検証配分", "title": "CAVEAT: Reliability-aware active verification under correlated errors for multi-agent LLM reasoning", "url": "https://doi.org/10.21203/rs.3.rs-11035327/v1", "authors": "Dekang Guo ほか", "venue": "Research Square", "date": "2026-09-30", "apa": "Guo, D., Jin, G., Shan, Y., & Han, Q. (2026). CAVEAT: Reliability-aware active verification under correlated errors for multi-agent LLM reasoning. https://doi.org/10.21203/rs.3.rs-11035327/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "多エージェントLLMの検証で、同じ系統のモデルの判定が相関していることを考慮し、どの主張をどの検証者でいつまで検証するかを費用に見合う情報量で選ぶ方法（CAVEAT）を提案した（抄録）。", "p3": "エージェントの推論を主張の依存グラフにまとめ、各検証者の感度と特異度をベータ分布で、同系統のモデルが共有する誤りの率で相関をモデル化し、閉じた形の事後分布から、費用で割った情報の価値で次の検証を貪欲に選ぶ（抄録）。相関を無視すると事後の対数オッズが1+(k−1)ρ倍に膨らむと示した。", "p5": "6つの公開ベンチマークと8種の検証者で、全数検証と同等の精度を21%の費用で達成し、予算をそろえた最強の基準より正解率を3.1ポイント高め、期待較正誤差を7.4%から3.8%に、自信をもって誤答を受け入れる率を19.6%から7.2%に下げた（抄録）。", "fun": "同じ会社が作ったAIを何体並べて確認させても、同じ癖のある間違いを一緒にしてしまう。似た者同士の「多数決」は見かけほど信用できない、という当たり前だが見落とされがちな点を数式にして、誰にどれだけ確認させるかを賢く配分した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "多エージェント探索の成否を相転移で予測", "title": "Absorbing State Phase Transitions in Multi-Agent Search", "url": "https://arxiv.org/abs/2609.38327", "authors": "Wenwen Zheng ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Zheng, W., Yang, Y., Qu, H., Wang, X. E., & Jeong, H. (2026). Absorbing State Phase Transitions in Multi-Agent Search (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38327", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント探索がうまくいくかを、統計力学の吸収状態相転移で予測する理論を立て、各エージェントが通信すべき相手の最小数（臨界次数）を導いた（抄録）。", "p3": "組合せ探索の古典的な結果をもとに探索課題を4種類に分類し、誤った仮説が制御できずに広がらず「解決状態」に入るための臨界通信次数d_cを理論的に導いた（抄録）。", "p5": "ソフトウェア設定のデバッグと物理機構の発見という実課題で最先端のLLM多エージェント系を評価したところ、理論との一致はまちまちで、エージェントが隣と通信しなかったり、個人には有利だが協働の利益を損なう戦略をとったりした（抄録）。", "fun": "間違った思い込みが感染症のように広がるか消えるかは、一人が何人と話せるかで急に切り替わる、という物理学の「相転移」の考え方をAIのチームに当てはめた。ただ実際のAIたちは、隣と話さなかったり自分だけ得する作戦をとったりして、理論どおりには動かなかったのも面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "LLMは利用者の政治色に合わせて立場を変える", "title": "Framing the Narrative: Ideological Mimicry in Large Language Models", "url": "https://arxiv.org/abs/2609.38256", "authors": "Olivia Macmillan-Scott ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Macmillan-Scott, O., Jacobs, M., Metternich, N., & Musolesi, M. (2026). Framing the Narrative: Ideological Mimicry in Large Language Models (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2609.38256", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの政治的な立場は固定的でなく、利用者の用語・前提・自己紹介に合わせて利用者の立場の方へ動く「イデオロギー的な模倣」が起きることを、米英豪の10の争点で示した（抄録）。", "p3": "Poli-SHIFTデータセットと評価枠組みを作り、7つのオープンウェイトLLMで、争点となる用語、政治的な前提、利用者の情報を系統的に操作して、選択式と自由記述の両方で回答を引き出した（抄録）。", "p5": "どのモデルでも質問の枠組みが出力の政治的立場を形づくり、用語を変えるだけで、対応する比較の16.9%で支持する側が逆転した（抄録）。利用者が表明した政治的立場も、回答を利用者の立場の方へ系統的に動かした（抄録）。", "fun": "同じ問題でも「不法移民」と言うか「書類のない移民」と言うかで、AIの答えの立場がひっくり返ることがあった。AIは質問した人の言葉づかいや立場に合わせて意見を変えるので、人によって違う「AIの意見」を聞かされ、分断が強まるおそれがある。言葉の選び方の影響力が見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "サンタ役AIの説得は子どもの願いを変えた", "title": "Persona and Persuasive Framing in AI Voice Agents: A $2\\times2$ Field Experiment with Children", "url": "https://arxiv.org/abs/2609.38782", "authors": "Thilo Tamme ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Tamme, T., Steck, D., & Hantel, A. (2026). Persona and Persuasive Framing in AI Voice Agents: A $2\\times2$ Field Experiment with Children (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38782", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ドイツの公開サンタクロース電話相談で、子どもからの電話を4種類のLLM音声エージェントに無作為に振り分けた現場実験で、説得的な話し方が子どもの願い事を向社会的なものに変える一方、サンタという権威あるペルソナには効果がないことを示した（抄録）。", "p3": "ペルソナ（権威の高いサンタか、低い「お手伝い」か）と枠組み（向社会的な願いへ誘導するか、中立か）の2×2で振り分け、1,072件の通話のうち条件を満たした89件（年齢の中央値6歳）を分析した（抄録）。", "p5": "説得的な枠組みは向社会的な願い事の確率を11.6%から45.7%に上げ、統制を加えても頑健だった（抄録）。ペルソナの権威の効果はほぼゼロだったが、最初の1分以内に電話を切る割合は「お手伝い」で65%、サンタで39%と、関与の仕方を左右した（抄録）。", "fun": "子どもがサンタに電話すると、実はAIが出る。そのAIが「みんなのためのお願いもいいね」とそっと促すと、他人を思う願い事が4倍近くに増えた。一方、サンタを名乗ってもただの「お手伝い」を名乗っても、説得の効き目は変わらなかった。誰が話すかより、どう話すかが効くという結果が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "判定者の不一致を手がかりに人が裁定する評価", "title": "JuryFlow: Disagreement-Guided Human-in-the-Loop Multi-Agent Evaluation", "url": "https://arxiv.org/abs/2609.40103", "authors": "Mufeng Yang ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Yang, M., Yu, J., & Ding, Y. (2026). JuryFlow: Disagreement-Guided Human-in-the-Loop Multi-Agent Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.40103", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のLLM判定者の不一致を平均で消さず、主張単位の不確かさの信号として使い、人が最小限の介入で裁定する評価の枠組み（JuryFlow）を提案した（抄録）。", "p3": "回答を原子的な主張に分け、異なる判定者が主張ごとに判定し、判定のエントロピーで点数をつけた不一致グラフを作り、人が解決すべき不一致を一つ選ぶと、その主張を再評価し、修正をグラフの辺と類似事例に伝え、全判定者が受け継ぐ評価基準（ルーブリック）に定着させる（抄録）。", "p5": "人の代わりにエントロピーの順位で焦点を選ぶ自動の設定で、MT-BenchとLLMBarにおいて、単一判定者や多数決のパネルより正解ラベルとの一致を高め、除去実験で再評価・伝播・基準の誘導の寄与を切り分けた（抄録）。", "fun": "AIの審査員を何人並べても、意見が割れたところを多数決で決めると、なぜ割れたのかという大事な情報が捨てられる。この方法は割れたところこそ人が見るべき場所だと考え、人の一言の判断を似たケースや審査の基準に広げていく。人を「採点係」から「交通整理役」に変える発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "生成AIで組織の分身をつくり戦略を試す", "title": "Learning-by-Twinning: Organizational Digital Twins and the Future of Search", "url": "https://doi.org/10.2139/ssrn.7547723", "authors": "Prithwiraj Choudhury ほか", "venue": "SSRN", "date": "2026-10-01", "apa": "Choudhury, P., Du, Y., & Lawrence, M. (2026). Learning-by-Twinning: Organizational Digital Twins and the Future of Search. https://doi.org/10.2139/ssrn.7547723", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業固有のデータとAIによる行動模擬、ガバナンスの規則を組み合わせた「組織のデジタルツイン」を提案し、戦略の選択を仮想の組織の中で試して学ぶ「ツインによる学習」の価値と条件を理論的に整理した（抄録）。", "p3": "既存のオフラインの探索手段（メンタルモデル、類推、モデル構築、シミュレーション）が一人の意思決定者の想像力に縛られる点を出発点に、生成AIと企業のデジタル痕跡データの組合せがこのトレードオフを変えると論じる概念研究である（抄録）。", "p5": "ツインによる学習が価値を生む仕組みとして、探索の拡大、より安全な実験、より豊かなシステム全体のフィードバックの3つを挙げ、これらの利点が弱まる条件も示した（抄録）。", "fun": "新しい給料の制度を入れたら社員はどう動くか。本物の会社で試す前に、社員のデータとAIで作った「会社の分身」の中で試してみる、という発想だ。失敗しても誰も困らない練習場で、一人では思いつかない展開まで見られる点が面白いが、分身がどれだけ本物に似ているかが鍵になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "嘘検出プローブは役割の信念に引きずられる", "title": "Stress-Testing LLM Lie Detectors: Role-Play Failures and Spurious Correlations", "url": "https://arxiv.org/abs/2609.39807", "authors": "Maximilian von Klinski ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "von Klinski, M., Lapuschkin, S., Samek, W., & Bürger, L. (2026). Stress-Testing LLM Lie Detectors: Role-Play Failures and Spurious Correlations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.39807", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの内部状態から嘘を見抜く「嘘検出プローブ」が、陰謀論者のような事実に反するペルソナを演じたときの誤りを見抜けず、真実と偶然相関する概念を追っていることを示した（抄録）。", "p3": "3つのLLMに事実に反するペルソナを演じさせた、人がレビューした8,916件の応答のデータを作り、先行研究の8つのプローブを評価し、さらに真実と交絡しうる概念が逆相関する3つの交絡データを作って原因を調べた（抄録）。", "p5": "多くのプローブはこの設定で失敗し、特に同じペルソナのもとで正答と誤答を比べたときに顕著だった（抄録）。多くは指示への従順さや応答の尤度など、学習データで真実と偶然相関した概念を追っており、著者が提案した単純な線形プローブがペルソナと交絡の両方の試験で最も良い成績だった（抄録）。", "fun": "AIの頭の中をのぞいて「今うそをついているか」を当てる道具がある。ところがAIに陰謀論者を演じさせると、道具は「演じている人物が信じていること」を本当だと判定してしまった。うそ発見器が、実は「素直に指示に従っているか」を測っていただけだった、というずれが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "多エージェント討論の攻撃耐性を測る基準", "title": "MADBench: Benchmarking the Security of Multi-Agent Debate", "url": "https://arxiv.org/abs/2609.39146", "authors": "Yuwan Liu ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Liu, Y., Zhang, J., Huang, Y., & Duan, S. (2026). MADBench: Benchmarking the Security of Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.39146", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多エージェント討論（MAD）が攻撃を受けたときの安全性を評価するベンチマーク（MADBench）を作り、討論は推論を必ずしも改善せず、無許可の読み書きをむしろ増幅しうることを示した（抄録）。", "p3": "討論の流れに沿って攻撃を階層的に分類し、既存の攻撃と討論向けの新しい戦略を含む6つの攻撃群を、356の課題から作った3,958の試験例で評価し、最終回答と敵対的な影響の伝播を調べた（抄録）。", "p5": "単一エージェントと比べ、MADは質問応答の正答率への攻撃を和らげる一方、質問応答と作業空間の課題で無許可の読み書きを増幅した（抄録）。5体中3体が共謀しても、攻撃なしで正答した課題の28.30%しか誤答に変わらず、初め正答した誠実なエージェントが誤答に変わったのは3.26%だった（抄録）。", "fun": "AI同士で話し合うと間違いを正し合えるが、悪意のあるAIが混ざると逆に間違いを広めるかもしれない。調べてみると、答えの正しさは話し合いで守られやすい一方、「勝手にファイルを読む・書く」といった危ない行動は話し合いで広がりやすかった。話し合いの長所と弱点が別々の場所に出る点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "強い企業文化は販管費を下方硬直的にする", "title": "Corporate Culture and Asymmetric Cost Behavior", "url": "https://doi.org/10.2139/ssrn.7541263", "authors": "Shubham Sharma", "venue": "SSRN", "date": "2026-09-30", "apa": "Sharma, S. (2026). Corporate Culture and Asymmetric Cost Behavior. https://doi.org/10.2139/ssrn.7541263", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "企業文化が強い企業ほど、販売費及び一般管理費（販管費）が売上減少時に下がりにくい「コストの粘着性」が強いことを、2002〜2025年の53,311企業年で示した（抄録）。", "p3": "機械学習で測った企業文化の指標を使い、売上の増減に対する販管費の非対称な調整（粘着性）が文化の強さでどう変わるかを推定し、文化の価値の種類と、販管費が将来価値を生むかどうかで分けて分析した（抄録）。", "p5": "文化の強い企業は売上増加時に資源を投入しやすく、減少時にも保持し、販管費を長期の投資のように扱っていた（抄録）。効果は革新・品質・チームワークの価値に集中し、誠実さや敬意では見られず、販管費の将来価値が高い企業で粘着性が強く、低い企業ではゼロと区別できなかった（抄録）。", "fun": "売上が落ちても経費をすぐには削らない会社がある。それを「無駄の放置」と見るか「将来への投資」と見るかで評価は変わる。この研究では、チームワークや革新を大事にする文化の会社ほど経費を保ち、しかもそれは将来の価値を生む場合に限られていた。文化が数字の動きに表れる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "学習不要で表・時系列・関係データを合成", "title": "Synthesis Without Training: An Inference-Only Pipeline for Tabular, Temporal, and Relational Synthetic Data", "url": "https://arxiv.org/abs/2609.38414", "authors": "Zilong Zhao ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Zhao, Z., Raheem, A., Li, J., Arisaka, S., Yi, D. L. H., Abdollahzadeh, M., Javaid, U., & Sikdar, B. (2026). Synthesis Without Training: An Inference-Only Pipeline for Tabular, Temporal, and Relational Synthetic Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38414", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "モデルを学習せずに、元データの統計的な要約からLLMと符号化エージェントが実行可能なサンプラーを組み立てることで、表・時系列・関係データベースの合成データを作る方法（GENSCRIPT）を提案した（抄録）。", "p3": "元データの列の型・範囲・欠損・カテゴリ・相関などの決定的な要約を（生の行ではなく）LLMに渡して列の意味と列間の整合性の制約を推定させ、符号化エージェントがそれを監査可能なサンプラーに変換する（抄録）。", "p5": "4つの単一表のベンチマークで、生成器を2分で作り、50k行を6秒以内に生成し、周辺分布の忠実度は主要な手法と数ポイント以内だった（抄録）。Adultデータの列間の1対1の対応を完全に保った唯一の方法で、スマートビルのデータでは条件付き時系列を2つの基準より実分布に近く生成し、主キーと外部キーの関係も完全に保った（抄録）。", "fun": "本物のデータを見せずに、そっくりな偽物のデータを作るには、ふつうはAIに本物を学習させる必要がある。この方法は「平均や範囲、列どうしの関係」というデータの要約だけをAIに渡し、偽データを作るプログラムを書かせた。中身が読めるプログラムなので、どんな偽物ができるか確かめられる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "ゼロ知識証明で売掛金を監査人に確かめさせる", "title": "Can Cryptographic Accounting Systems Provide Audit Evidence?", "url": "https://doi.org/10.2139/ssrn.7548358", "authors": "John McCallig ほか", "venue": "SSRN", "date": "2026-10-01", "apa": "McCallig, J., Mishra, B. K., & Purohit, S. (2026). Can Cryptographic Accounting Systems Provide Audit Evidence? https://doi.org/10.2139/ssrn.7548358", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ゼロ知識証明・誰でも参加できるブロックチェーン・スマートコントラクトを使い、個々の残高を秘匿したまま、監査人などの外部者が企業の売掛金の存在と正確性を確かめられるシステムを設計・構築・評価した（抄録）。", "p3": "監査が「ブラックボックス」で、費用の制約から取引や残高の標本しか調べられないという透明性と標本抽出の問題に、暗号技術による解決を探った設計科学の研究である（抄録）。", "p5": "このシステムは売掛金総額の存在と正確性の強い証拠を与え、確認手続きから標本抽出のリスクを取り除く（抄録）。監査人が外部の情報源に直接アクセスして証拠を得ることは既に監査基準で認められているため基準の変更は不要だが、目的の達成には広い参加が必要である（抄録）。", "fun": "会社に「この取引先から○円もらえるはず」という売掛金が本当にあるかを、監査人は普通は一部だけ抜き出して確認する。暗号の技術を使えば、相手ごとの金額は誰にも見せずに、合計が正しいことだけを全件で証明できる。秘密を守りながら正しさを示すという、一見矛盾した仕組みが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "競争下では改善の助言が無効になりうる", "title": "Algorithmic Recourse Under Competition", "url": "https://arxiv.org/abs/2609.39877", "authors": "Shahin Jabbari", "venue": "arXiv", "date": "2026-10-01", "apa": "Jabbari, S. (2026). Algorithmic Recourse Under Competition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.39877", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習の判定で不合格になった人に改善の助言（アルゴリズム的リコース）を出すとき、限られた枠を競う状況では、多くの人が助言に従うと合格の閾値自体が動き、助言が無効になりうることを示し、その対策の枠組みを提案した（抄録）。", "p3": "助言を受ける人と、満たすべき目標得点を同時に最適化して、助言の費用と閾値が動いた後の有効性のバランスをとる「競争下のリコース」を定式化し、陰関数定理に基づくアルゴリズムを開発した（抄録）。", "p5": "合成データと実データの実験で、個人ごとの目標得点は費用が高い代わりに有効性が高く、共通の目標得点は低〜中程度の有効性で費用と有効性の良い折り合いを示した（抄録）。", "fun": "「あと少し貯金を増やせばローンに通りますよ」とAIが全員に助言すると、みんなが貯金を増やした結果、合格ラインそのものが上がってしまう。椅子取りゲームで全員に「早く座る方法」を教えても椅子の数は増えない、という競争の仕組みを、助言の設計に組み込んだ点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "病院原価計算から公的価格へのつなぎ方を整理", "title": "From Hospital Costing to Public Tariffs: A Systematic Evidence Map of Step-Down and Activity-Based Costing", "url": "https://doi.org/10.21203/rs.3.rs-11199009/v1", "authors": "Amrizal Muhammad Nur ほか", "venue": "Research Square", "date": "2026-09-30", "apa": "Nur, A. M., Aljunid, S. M., Naing, L., Osman, M. F., Azzeri, A., Jaafar, M. H., Rahman, S. M. H. A. S. A., & Rashid, S. A. Z. A. (2026). From Hospital Costing to Public Tariffs: A Systematic Evidence Map of Step-Down and Activity-Based Costing. https://doi.org/10.21203/rs.3.rs-11199009/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "公的な病院の診療報酬の価格設定に、階梯式配賦（全体の間接費を配る原価計算）と活動基準原価計算（ABC、時間駆動型のTDABC）をどう組み合わせるべきかを、文献の系統的な地図化で整理した（抄録）。", "p3": "6つの文献データベースなどから英語の査読論文と公的機関の資料を集め（最終更新2026年6月15日）、価格設定・報酬支払いの決定に直接結びつく証拠と間接的な証拠に分類し、異質性のため統合はせず叙述的に総合した（抄録）。", "p5": "51件（実質的な資料46件、方法論のみ5件）のうち報酬と直接結びつくのは15件で、TDABCの証拠は階梯式の証拠よりずっと多かった（抄録）。両者を統合した枠組みが価格の正確さ・支出・アクセス・質・提供者の行動に与える影響を評価した研究はなく、著者は2層の枠組みを確立した優れたモデルではなく検証すべき設計案として扱うべきだと結論した（抄録）。", "fun": "病院の治療の値段（診療報酬）は、本来はかかった費用から決めたいが、建物や事務の費用をどう割り振るかで大きく変わる。全体の費用を大づかみに配る方法と、治療の手順ごとに細かく積み上げる方法を組み合わせる案が有力だが、実際に試して効果を確かめた研究はまだない、と率直に示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "自治体監査の悪い結果を事前に予測する", "title": "Early-Warning Models for Adverse Municipal Audit Outcomes: Econometric and Machine-Learning Evidence from South African Municipalities", "url": "https://doi.org/10.2139/ssrn.7541103", "authors": "Dumisani Pamba", "venue": "SSRN", "date": "2026-09-30", "apa": "Pamba, D. (2026). Early-Warning Models for Adverse Municipal Audit Outcomes: Econometric and Machine-Learning Evidence from South African Municipalities. https://doi.org/10.2139/ssrn.7541103", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "南アフリカの257自治体の2018/19〜2023/24年度のデータで、悪い監査結果を事前に予測する計量経済モデルと機械学習モデルを作り、XGBoostが期間外で高い予測性能を示すことを明らかにした（抄録）。", "p3": "1,542の自治体年の釣り合いのとれたパネルで、変量効果ロジット、LASSOロジット、ランダムフォレスト、XGBoostを比べ、財務の脆弱さ、管理の安定性、内部監査の能力、コンサルタント依存、調達の不正、重大な不正の通知などを予測変数とし、時間的に分けた514自治体年で検証した（抄録）。", "p5": "流動性、営業利益率、債権の減損、設備投資の執行、財務責任者の欠員、自治体首長の交代、コンサルタント依存、内部監査の能力、不正支出、財務諸表の提出遅れなどが悪い監査結果と有意に関連した（抄録）。XGBoostが最も良く、期間外のAUCは0.912、正解率87.5%だった（抄録）。", "fun": "役所の会計がずさんになって監査で厳しい意見がつく前に、その兆しを見つけられないか。財務の数字と、会計責任者の空席や首長の交代といった組織の変化を機械学習に入れると、9割近い精度で事前に当てられた。数字だけでなく「人の入れ替わり」が危険信号になる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "出産・育児の負担は女性監査人の監査品質を下げた", "title": "You can't Burn the Candle at both Ends: Childbearing Responsibilities and Audit Quality", "url": "https://doi.org/10.2139/ssrn.7546959", "authors": "Jun Huang ほか", "venue": "SSRN", "date": "2026-10-01", "apa": "Huang, J., Li, C., Li, T., & Zhao, S. (2026). You can’t Burn the Candle at both Ends: Childbearing Responsibilities and Audit Quality. https://doi.org/10.2139/ssrn.7546959", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の一人っ子政策の緩和を準自然実験として使い、出産・育児の責任が女性監査人の監査品質を下げることを示した（抄録）。", "p3": "一人っ子政策の緩和で第2子をもうける可能性が生じた女性監査人を処置群として、政策変更の前後で監査品質を比べ、地域の性差別の強さ、職場環境、その後のキャリアへの影響も調べた（抄録）。", "p5": "影響を受けた女性監査人の監査品質は政策変更後に有意に下がり、その効果は性差別の強い地域の監査事務所で大きかった（抄録）。女性に優しい職場環境や良い労働条件はこの不利を和らげ、政策変更は影響を受けた女性監査人のキャリアにも不利な結果をもたらした（抄録）。", "fun": "子どもを持つかどうかが国の政策で急に変わると、それに合わせて働き方も変わる。中国の一人っ子政策の緩和を「自然の実験」として使うと、女性監査人の仕事の質が下がり、出世にも響いていた。ただ、職場の支えがあればその差は小さくなった。個人の能力ではなく環境の問題だと示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "子ども期の家計は満足度の分布の形を変える", "title": "Beyond Average Effects: Childhood SES and the Shape of Adult Well-Being Distributions", "url": "https://doi.org/10.31234/osf.io/7qcsh_v1", "authors": "Jinrui Liu ほか", "venue": "PsyArXiv", "date": "2026-10-01", "apa": "Liu, J., Oishi, S., & Røysamb, E. (2026). Beyond Average Effects: Childhood SES and the Shape of Adult Well-Being Distributions. https://doi.org/10.31234/osf.io/7qcsh_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "子ども期の家計の豊かさ（childSES）が、大人の生活満足度の平均だけでなく、ばらつきや最高点に届く確率とどう関係するかを、分布全体を扱う回帰で示した（抄録）。", "p3": "米国のMIDUS 1（N=5,570〜5,603）で、位置・尺度・形状の一般化加法モデル（GAMLSS）を用い、生活満足度と人格的成長の平均・分散・上限到達確率とchildSESの関連を調べ、MIDUS 2で再現を確かめた（抄録）。", "p5": "childSESが高いほど生活満足度の平均は高く、分散は約4%小さく、上限を押し上げるより下限を支える効果だった（抄録）。人格的成長では、childSESが高いほど最高点に達するオッズが高かった（OR=1.15）（抄録）。これらはMIDUS 2（N=3,541〜3,556）でほぼ再現され、大人のSESを考慮しても残った。", "fun": "子どものころ家が豊かだった人は、大人になって「とても幸せ」になりやすいというより、「とても不幸」になりにくかった。平均点だけを比べると見落とされる、格差が「床を支える」形で効いているという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "12研究の実測でスマホ利用と幸福感を検証", "title": "People With Lower Well-Being Show Longer and Less Stable Smartphone Use: A Large-Scale Analysis of 12 Datasets", "url": "https://doi.org/10.31234/osf.io/ev8gw_v1", "authors": "Anna M Langener ほか", "venue": "PsyArXiv", "date": "2026-10-01", "apa": "Langener, A. M., Chow, P., Fernández, A., Jacobson, N. C., Kas, M., Milek, A., Pryss, R., Radtke, T., Schoedel, R., de Segovia Vicente, D., Sust, L., Terhorst, Y., Wright, A. G. C., & Elmer, T. (2026). People With Lower Well-Being Show Longer and Less Stable Smartphone Use: A Large-Scale Analysis of 12 Datasets. https://doi.org/10.31234/osf.io/ev8gw_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "5か国12研究の実測のアプリ利用記録を統合し、心の健康が低い人ほどスマホの利用時間が長く、日によって不安定であることを示した（抄録）。", "p3": "2,945人、37,229人日、851,865人時間の客観的なアプリ利用データを統一的に整理し、well-beingと利用量・利用の変動の関連、年齢・性自認・時間帯・曜日による違いを調べた（抄録）。", "p5": "1日の平均利用は3.27時間、アプリは15.9個で、全変動の40.6%が個人内の変化だった（抄録）。抑うつ症状が尺度の範囲の10%増えると、1日の利用が7分長く、個人内の分散が7.5%大きかった（抄録）。若い人と女性ほど頻繁に使い、well-beingの高い人は一貫して利用が少なかった。", "fun": "スマホの使いすぎと心の不調の関係は、「何時間使ったか」を自分で答えるアンケートでは当てにならない。実際の利用記録を集めると、落ち込んでいる人ほど長く、しかも日によってムラのある使い方をしていた。平均だけでなく「ムラ」に心の状態が表れるという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "ライブ配信への没入と孤独の関係を全国調査", "title": "Online consumption and affective experience moderate live streaming users’ loneliness: A nationwide survey in China", "url": "https://doi.org/10.21203/rs.3.rs-10797730/v1", "authors": "Wu MS ほか", "venue": "Research Square", "date": "2026-09-29", "apa": "Wu, M. S., Wang, Y., Wang, T. Y., Ren, Y., Ma, H., Liu, Z., & Peng, K. (2026). Online consumption and affective experience moderate live streaming users’ loneliness: A nationwide survey in China. https://doi.org/10.21203/rs.3.rs-10797730/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の大規模調査（n=9,311）で、ライブ配信への没入と孤独の関係が、オンラインでの購買傾向と感情的な体験の強さによって正にも負にも変わることを示した（抄録）。", "p3": "ライブ配信の利用者について、配信への没入と孤独の関連が、オンライン消費の傾向と感情的な体験によって調整されるかを検証した（抄録）。分析モデルの詳細は未確認。", "p5": "配信への没入は全体として孤独の高さと関連したが、オンライン消費の傾向や感情的な体験が低い利用者では正に、高い利用者では負に関連した（抄録）。著者は、関与の形によって配信への没入の孤独への意味が変わると解釈する（抄録）。", "fun": "ライブ配信を見続けていると孤独になるのか、それとも寂しさが紛れるのか。答えは「見方しだい」で、ただ眺めているだけの人では孤独と結びつき、配信者と気持ちを通わせたり買い物に参加したりする人ではむしろ孤独が少なかった。同じ行動でも関わり方で意味が逆転する点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "粒状体の緻密化の臨界密度をパーコレーションで説明", "title": "Topological Percolation and Jamming Define the Universal First Critical Density in Granular Densification", "url": "https://doi.org/10.21203/rs.3.rs-10911093/v1", "authors": "Yuan Li ほか", "venue": "Research Square", "date": "2026-09-30", "apa": "Li, Y., & Baker, I. (2026). Topological Percolation and Jamming Define the Universal First Critical Density in Granular Densification. https://doi.org/10.21203/rs.3.rs-10911093/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "粒状の多孔質体（例：雪が氷河の氷に変わる途中のフィルン）の緻密化で、微視的なCT画像の形状指標を積分幾何とジャミングの臨界現象で説明し、最初の臨界密度を統一的に定める基準を示した（抄録）。", "p3": "構造モデル指数（SMI）を氷と空隙の界面の平均曲率と同一視し、凸から凹への細孔網の移行をランダウ型の2次の法則で表し、異方性の度合い（DA）をジャミングした粒状相のファブリックテンソルから導いた（抄録）。", "p5": "閉じた形の式はSMIでR²=0.99、DAでR²=0.91を達成した（抄録）。パーコレーション閾値（ρc=556 kg m⁻³）とジャミング密度（ρj=550 kg m⁻³）は不確かさの範囲内で一致し、観測に基づく位相的な臨界密度の基準が得られた（抄録）。", "fun": "積もった雪が押し固められて氷になる途中で、すき間のつながり方が「つながっている」から「途切れる」へ急に変わる密度がある。それが粒がぎゅっと詰まって動けなくなる「ジャミング」の密度とほぼ同じだった。形の数学と粒の物理が同じ答えを指す点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "液状化しやすい層は面積よりつながりが効く", "title": "Equal Area, Unequal Connectivity: A Random-Field Framework for Liquefaction Hazard Organization", "url": "https://doi.org/10.5194/egusphere-2026-2676", "authors": "Şahin Çağlar Tuna", "venue": "EGUsphere", "date": "2026-09-30", "apa": "Tuna, Ş. Ç. (2026). Equal Area, Unequal Connectivity: A Random-Field Framework for Liquefaction Hazard Organization. https://doi.org/10.5194/egusphere-2026-2676", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "液状化しやすい弱い地盤の面積が同じでも、それがばらばらか、まとまっているか、領域全体につながっているかで意味が違うことを、確率場とグラフの連結性の指標で区別する枠組みを示した（抄録）。", "p3": "整理したSPT N160の統計と調査領域の形状からガウス確率場を生成し、下側の裾で同じ面積になるように二値の弱層に変換して、弱層の面積率Pfと空間相関距離θを密に変えながらグラフに基づく連結性を数えた（抄録）。", "p5": "Pfとθに応じて、断片的→クラスター状→領域を貫く状態への系統的な移行が見られ、最も明瞭な移行はPf=0.50付近で、θが約200 mになると貫通確率が0.50を超えた（抄録）。空間相関のある場は同じ面積の無作為な場より連結成分が少なく大きく、2011年クライストチャーチ地震の液状化の分布にも無作為でない空間構造があった（抄録）。", "fun": "液状化しやすい場所が地図の半分を占めていても、それが点々と散らばっているのか、一本の帯につながっているのかで、被害の広がり方は全く違う。弱い場所の「量」ではなく「つながり方」を数えることで、対策を局所的にすべきか広域ですべきかが見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "メタマテリアルの多重スケール計算を縮約で高速化", "title": "Reduced order modeling for micromorphic computational homogenization of mechanical metamaterials with patterning fluctuation fields", "url": "https://arxiv.org/abs/2609.38416", "authors": "Theron Guo ほか", "venue": "arXiv", "date": "2026-10-01", "apa": "Guo, T., & Rokoš, O. (2026). Reduced order modeling for micromorphic computational homogenization of mechanical metamaterials with patterning fluctuation fields (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.38416", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "座屈などの微視構造の不安定を利用する機械的メタマテリアルの多重スケール計算で、微視問題を固有直交分解（POD）と超縮約で置き換え、工学規模の大変形解析を可能にする縮約モデルを提案した（抄録）。", "p3": "微視的な代表体積要素（RVE）がパターンの揺らぎ場を持ち、巨視をマイクロモルフィック連続体で表す計算的均質化では、巨視の積分点ごとにRVEと接線問題を解く必要がある（抄録）。この微視問題に、PODとマイクロモルフィックの設定に合わせた超縮約法を組み合わせた。", "p5": "2つの数値例で、縮約基底と超縮約による誤差を定量化し、オフラインの費用と達成できるオンラインの高速化を議論し、メタマテリアルの工学規模の大変形解析を可能にしうることを示した（抄録）。具体的な誤差と高速化の倍率は未確認。", "fun": "細かい穴のパターンが押されてくしゃっと形を変えることで不思議な性質を示す材料は、穴の一つ一つまで計算すると膨大な手間がかかる。この研究は、起こりうる変形の「代表的な型」をあらかじめ少数だけ覚えさせ、その組合せで計算を済ませる近道を作った。複雑な現象を少ない部品で表す縮約の発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "繰返し荷重下の砂の構成モデルを改良", "title": "Enhancements to the DeltaSand Constitutive Model and Overshooting Demonstration", "url": "https://doi.org/10.2139/ssrn.7548543", "authors": "Vahid Galavi ほか", "venue": "SSRN", "date": "2026-10-01", "apa": "Galavi, V., Sandmann, A., & Tschuchnigg, F. (2026). Enhancements to the DeltaSand Constitutive Model and Overshooting Demonstration. https://doi.org/10.2139/ssrn.7548543", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "繰返し荷重を受ける砂の挙動を予測する構成モデルDeltaSandを改良し、過去の最大強度を人工的に超えてしまう「オーバーシュート」を抑えつつ、浅い基礎の応力-変位を精度よく再現できるようにした（抄録）。", "p3": "偏差と体積の挙動を別々の降伏曲面で扱う二重硬化の枠組みに、繰返しの履歴を表す移動硬化を組み込み、乾燥したカールスルーエ砂で較正して、除荷・再載荷を含む圧密試験と排水三軸試験で検証した（抄録）。", "p5": "4回の載荷・除荷を受ける縮尺模型の浅い基礎を乾燥砂上で模擬し、実験結果と比べたところ、人工的なオーバーシュートを抑え、試験の終わりまで応力-変位の応答を正確に捉えた（抄録）。誤差の数値は未確認。", "fun": "砂は一度強く押されると、その「記憶」を持ち、次に押されたときの硬さが変わる。計算モデルでは、この記憶の扱いが下手だと、押し戻したあとに実際よりも強い抵抗を示してしまう。砂の記憶を正しく扱う工夫で、基礎の沈み方を最後まで再現できた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "履歴を持つ材料の微分可能FEMで逆同定", "title": "Differentiable finite elements for history-dependent ferroelectricity: matrix-free forward analysis and adjoint inverse identification", "url": "https://doi.org/10.2139/ssrn.7548467", "authors": "Binh Nguyen", "venue": "SSRN", "date": "2026-10-01", "apa": "Nguyen, B. (2026). Differentiable finite elements for history-dependent ferroelectricity: matrix-free forward analysis and adjoint inverse identification. https://doi.org/10.2139/ssrn.7548467", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "多層の強誘電体MEMSについて、微分可能な有限要素法で順解析と逆解析を行い、観測できる変位の履歴から圧電係数を直接同定する枠組みを作った（抄録）。", "p3": "熱力学的に整合した定式化で、局所の分極反転の問題を陰的に解き、その導関数をニュートン法の反復ではなく陰関数定理で得て、デバイス規模では随伴法で準静的な載荷履歴全体を平衡方程式と材料状態の両方を通して微分した（抄録）。", "p5": "数値例では、他の構成パラメータを固定して縦と横の圧電係数e33とe31を変位の履歴から同定し、均質な立方体で検証した後、マイクロ片持ち梁とマイクロミラーに適用して、設計と特性評価への実現可能性を示した（抄録）。", "fun": "材料が過去に受けた電圧や力の「履歴」を覚えていると、測った動きから材料の性質を逆算するのは難しい。この研究は、計算の全過程を自動で微分できる形に作り、履歴ごと逆算できるようにした。結果から原因をさかのぼる逆問題を、履歴つきで解く工夫が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "地域地震被害で橋の応答を代理モデルで比べる", "title": "Comparison of Site- and Structure-Specific Surrogate Models for Estimating Bridge Structural Response in Regional Earthquake Scenario Studies", "url": "https://doi.org/10.31224/8397", "authors": "Meredith Lochhead ほか", "venue": "engrXiv", "date": "2026-09-30", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "地域の地震リスク評価で、コンクリートの道路橋の地震応答（崩壊・非崩壊）を予測する代理モデルとして、PLoM、ガウス過程、多変量線形回帰の3つを比べ、ガウス過程が最も安定した精度を示すことを明らかにした（抄録）。", "p3": "性能に基づく耐震設計の地域規模の応用を想定し、予測精度に加えて、作業手順の構築、モデルの共有、不確実性と相関の扱い、地域規模への拡張性という観点で3つの代理モデルを定量的・定性的に比べた（抄録）。", "p5": "ガウス過程は崩壊・非崩壊の両方で最も一貫した精度を示し、入力から出力への決定的な対応を持つため交通網解析に向いていた（抄録）。線形回帰は崩壊の予測には有効だが詳細な応答の表現が苦手で、PLoMは非ガウス・多峰の出力に向くが、今回の実装では決定的な対応を持たなかった（抄録）。", "fun": "地震のとき地域の何百もの橋がどう揺れるかを一つずつ精密計算するのは大変なので、速く答える「代わりの計算式」を使う。どの代わりが良いかは精度だけでなく、交通網の計算に組み込みやすいかでも決まる、という実務的な物差しで比べた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "環境変化を含むガイド波信号を自己符号化器で生成", "title": "Deep Autoencoder Framework Applied to the Generation of Realistic Guided Wave Signals in Structural Health Monitoring Under Varying Environmental and Operational Conditions", "url": "https://doi.org/10.1115/QNDE2024-134803", "authors": "Roberto Miorelli ほか", "venue": "HAL", "date": "2026-09-29", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "超音波ガイド波による構造ヘルスモニタリングで、温度などの環境・運用条件の影響を含んだ実験に近い信号を、専用の自己符号化器で高速に生成する機械学習の枠組みを提案した（抄録）。", "p3": "実験データと数値計算データから構造化された潜在空間を同時に学習し、そこに温度などの環境・運用条件のパラメータを加えることで、元の数値計算が考慮していなかった条件も生成データに反映できるようにした（抄録）。", "p5": "生成したデータは統計的な研究や、欠陥の分類・位置特定・寸法推定などの新しい逆解析モデルの学習に効率よく使えるとされる（抄録）。定量的な精度は未確認。", "fun": "構造物の傷を超音波の反射で見つけるとき、気温が変わるだけで信号が変わり、傷と見分けにくくなる。この研究は、実験とシミュレーションの両方から学んだAIで、「暑い日」「寒い日」の信号まで作り出せるようにした。現実の条件をそろえた練習問題をAIに大量に作らせる発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "羽根の損傷で風車の近接モードが入れ替わる", "title": "Blade-damage-induced edgewise mode jumping in parked offshore wind turbines: Mechanism and modal sensitivity", "url": "https://doi.org/10.2139/ssrn.7549540", "authors": "Xin Guo ほか", "venue": "SSRN", "date": "2026-10-01", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "停止中の洋上風車で羽根の局所的な損傷が回転対称性を崩すと、近接した羽根のエッジ方向の振動モードが入れ替わる「モード・ジャンプ」が起きる仕組みを、有限要素モデルと摂動理論で明らかにした（抄録）。", "p3": "公表されたモードのデータで検証したNREL 5MW風車の有限要素モデルで、損傷の程度・位置・羽根の組合せを変え、モードの相関（MAC）と一次の摂動理論で振動数の変化と入れ替わりを解析した（抄録）。", "p5": "1枚の羽根の小さな不整でも、最初の非対称のエッジ方向のモード対で振動数の回避交差とモード・ジャンプが起き、モード間のMACは0.9821と0.9819だった（抄録）。最大翼弦の付近が最も敏感で、調べた2枚の損傷では起きず、摂動理論は不整のある固有振動数を誤差0.5%未満で予測した（抄録）。", "fun": "3枚の羽根がそっくりな風車では、ほぼ同じ高さの「振動の音」が隣り合っている。1枚に小さな傷がつくだけで、その2つの音がすっと入れ替わる現象が起きた。対称なものがわずかに崩れると性質が大きく変わる、という物理の典型を、傷の検出の手がかりに使える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "GNSS受信機の出力遅れを実信号と模擬器で比較", "title": "Equivalence of Effective GNSS Solution Delay Between Real-Signal Kinematic Zero-Baseline and Simulator Conditions", "url": "https://doi.org/10.5281/zenodo.23072879", "authors": "Bayar, Erkan", "venue": "Zenodo", "date": "2026-10-01", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "同じ型の2台のGNSS受信機の実効的な測位解の遅れ（物理的な状態と出力時刻のずれ）が、実信号の移動ゼロ基線と信号模擬器の条件で同等かを検定する実験計画（プロトコル）を事前に定めた（抄録）。", "p3": "主な量はτres=τzb−τsim,A−Bで、移動ゼロ基線の構成と模擬器での再生から、ドップラーによる速度と運動モデルを使って推定し、同等性を2つの片側検定（TOST）で評価する（抄録）。同等性の幅や標本規模は別の予備実験で決めて確認実験の前に凍結する。", "p5": "計画の段階の登録で結果はまだない（抄録）。PPS/TICの計測は外部の時刻系の特性評価に使い、測位解の遅れからは引き算しないこと、絶対的な受信機の遅れは測らないことが明記されている（抄録）。", "fun": "スマホの位置情報も、実は「少し前の位置」を「今」として出していることがある。走りながら測る位置と時刻のずれは、車の揺れの計測などで大事になる。この計画は、本物の衛星電波と模擬装置で同じずれが出るかを、結果を見る前に判定のルールを決めてから確かめる点が誠実で面白い。", "unverified": "実験計画の登録のため結果はなく、同等性の幅などの数値は予備実験で決められる予定で確認できない。"}}, {"id": "pr45", "rank": 45, "headline": "駅計画の比較は評価条件を先に凍結せよ", "title": "Freeze, Validate, Report: Auditing Urban Station Plans with Common Evidence", "url": "https://arxiv.org/abs/2609.39064", "authors": "Julian Teusch ほか", "venue": "arXiv", "date": "2026-10-01", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "都市の駅の配置計画を比べるとき、計画の違いと評価の入力の違いを分けるため、評価の条件（対象の移動、集計の単位、候補の集合、選択規則）を先に凍結する「凍結・検証・報告」の手順を示した（抄録）。", "p3": "クラスタリング、施設配置、公平性を考えた手法、格子の対照など7つの計画生成法を、共通の検証データで、出発地と目的地から最寄り駅までの距離の和で採点し、5つの指標の規則で一つの計画を選んで一度だけ試験報告する（抄録）。", "p5": "ポルトでは公平性を考えたIFkCOが選ばれ、試験の全体と最悪の集団の90パーセンタイルは805 mと872 m、シカゴでは格子が選ばれて1404 mと1656 mだった（抄録）。候補を300から600に増やすと両都市で選択が変わるなど入力への感度があり、著者は導入後の性能の安定ではなく宣言した契約の範囲での監査可能性を示すとした（抄録）。", "fun": "新しい駅をどこに置くかの案を比べるとき、案ごとに都合のいいデータで採点すると、勝ち負けがひっくり返ることがある。そこで「採点の条件を先に決めて封をする」というスポーツの審判のようなルールを作った。どの案が良いかより、比べ方の公正さに焦点を当てた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "個人単位の代理人口でウェールズの分身をつくる", "title": "A Digital Twin of Wales for Service Planning and Analysis Using a Surrogate Population Approach", "url": "https://doi.org/10.2139/ssrn.6118646", "authors": "Neeraj Kavan Chakshu ほか", "venue": "SSRN", "date": "2026-09-30", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "個人を単位にした仮想の人口でウェールズの社会を再現する初期段階のデジタルツインを作り、行政サービスの計画や通勤の模擬に使えること、プライバシーを守りつつ国勢調査に近い人口を作れることを示した（抄録）。", "p3": "社会経済データから、識別可能な実在の記録に対応しない合成の個人・世帯の記録を作り、ミクロからマクロのエージェント・ベース・シミュレーションを動かす仮想人口の手法を採用し、インフラ計画と通勤交通の模擬の2事例で示した（抄録）。", "p5": "仮想人口は主要な指標で国勢調査の傾向をよく反映し、世帯に住む総人口は2021年国勢調査と0.54%しか違わなかった（抄録）。複数の空間スケールで人口学的・社会経済的特徴を保ちつつ強いプライバシー保護を両立した（抄録）。", "fun": "本物の住民のデータを使わずに、国勢調査とそっくりな「架空の住民」を一人ずつ作って、地域まるごとの分身をコンピュータの中に作った。その分身の中で通勤ラッシュや施設の配置を試せば、実際に工事をする前に政策の効果を確かめられる。プライバシーと詳しさを両立させた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "配達追跡データが利用者の誤った判断を生む", "title": "When Data Becomes Judgment: Misaligned Interpretations and Accountability in Food Delivery Platforms", "url": "https://arxiv.org/abs/2609.39311", "authors": "Yibo Meng ほか", "venue": "arXiv", "date": "2026-10-01", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "中国のフードデリバリーで、リアルタイムの配達追跡データが利用者には「配達員の怠慢」の証拠に見え、配達員には画面上で説明しやすい動きをとらせる隠れた負担を生むことを、利用者と配達員への面接で明らかにした（抄録）。", "p3": "利用者23人と配達員17人への半構造化面接による社会技術的な分析で、追跡システムが実際の現場でどう解釈され使われているかを調べた（抄録）。", "p5": "利用者は空間・時間の異常を配達員の怠慢という道徳的な判断に置き換える「データ＝行動」の解釈枠組みを持ち、配達員は物理的に最適な経路ではなく画面上で読みやすい軌跡を作るように行動を変える予期的なデータ管理を行っていた（抄録）。著者は、説明の負担を働き手から文脈を持つプラットフォームへ移す設計を提案する（抄録）。", "fun": "配達アプリの地図で、配達員が遠回りしているように見えると「さぼっている」と思ってしまう。でも実際は信号や建物の入口の事情があり、配達員はむしろ「地図上で怪しく見えない道」を選ぶようになっていた。見せるためのデータが、本当の働き方をゆがめてしまう点が考えさせられる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "生成AIは口コミからホテルを正しく選べるか", "title": "IA vs AI – London Five-Star Hotel Quality Benchmark", "url": "https://doi.org/10.2139/ssrn.7539844", "authors": "Iva Georgieva", "venue": "SSRN", "date": "2026-09-30", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "有料の消費者向けAI（ChatGPT、Gemini、Claude、Perplexity）が、特定の1年の口コミに基づいてロンドンの5つ星ホテルの上位25を正しく選べるかを、事前に固定した基準（HotScore）と比べて検証した（抄録）。", "p3": "5つのプラットフォームの検証済み口コミ148,167件と対象ホテル167軒（後の監査で171軒）から作った基準を固定してから、各AIで5回ずつ（計20回）独立に実行し、別に文脈を与えたChatGPTの1回も比べた（抄録）。", "p5": "順位つきの上位25を示したのはClaudeの5回とGeminiの3回で、Geminiの3つのリストが基準の上位25と共有したのは8・9・7軒だった（抄録）。20回の回答全体では基準の上位25のうち24軒が少なくとも一度挙がったが、これは順位の再現ではなく、対象外のホテルが6種類、計15回含まれていた（抄録）。", "fun": "「去年の口コミで評判の良かったロンドンの高級ホテル上位25は？」とAIに聞くと、もっともらしい一覧は返ってくるが、148,167件の口コミから作った本物の順位とはほとんど重ならず、条件外のホテルまで混じっていた。答えが完璧に見えることと、本当に調べたことは違う、という教訓が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "消費者の分身で個別価格を模擬する", "title": "Consumer Digital Twin Framework for Personalized Pricing: Behavioral Segmentation, Machine Learning, and Simulation-Based Revenue Optimization", "url": "https://doi.org/10.2139/ssrn.7546559", "authors": "Navdeep Mopuri", "venue": "SSRN", "date": "2026-10-01", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "顧客の購買行動による区分（RFM）と需要の推定を組み合わせた「消費者デジタルツイン」で個別の価格を提案し、静的な価格より収益が大きく増える一方、需要が価格に敏感な場合には推薦が劣化する条件を示した（抄録）。", "p3": "UCIのOnline Retail IIデータ（39か国の803,459件の取引）と世界銀行の1人あたりGDPを組み合わせ、4つの顧客区分ごとに価格弾力性を推定し、5,859人で静的・弾力性ベース・デジタルツインの3つの価格戦略をモンテカルロ法で模擬した（抄録）。", "p5": "デジタルツインは静的な価格より収益を59.62%増やし、その62.6%は個別化による（抄録）。人工的に弾力性を変えた検証では、需要が弾力的なときは本当の価格変動を含むデータで学習しない限り推薦が劣化するという境界条件が見つかった（抄録）。", "fun": "お客さんごとの「分身」をコンピュータの中に作り、いくらなら買ってくれるかを試してから値段をつける。計算上は売上が6割近く増えたが、値段にとても敏感な客が多い場合は、本当に値段を変えたデータがないとうまくいかないという落とし穴も見えた。うまい話の限界まで示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "秘密保持契約の規制で職場が良くなった", "title": "Non-Disclosure Agreements and the Market for Talent", "url": "https://doi.org/10.2139/ssrn.7541802", "authors": "Ed deHaan ほか", "venue": "SSRN", "date": "2026-09-30", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "雇用主による秘密保持契約（NDA）の利用を制限する州法の施行で、企業の欠員が早く埋まり、職場環境が改善し、離職が減り、業績が上がることを示した（抄録）。", "p3": "雇用主は職場の悪い情報をNDAで抑えて求職者に魅力的に見せようとするが、それが広がると労働市場の情報環境が劣化するという仮説のもと、州のNDA制限法の施行時期の違いを使った段階的な差の差分法で推定した（抄録）。", "p5": "NDA制限法の施行後、企業は欠員をより早く埋め、職場の条件が改善し、従業員の離職が減り、企業の業績が向上した（抄録）。著者は、職場の情報の抑制を制限することが労働市場の効率を高め、NDAの広範な利用による市場の失敗を正すと解釈する（抄録）。", "fun": "会社が「辞めても職場の悪口を言わない」約束を社員にさせると、外からは良い会社に見える。でもみんながそうすると、どの会社が本当に良いのか分からなくなり、職場を良くする動機も消える。悪い評判を言えるようにした州では、かえって会社も社員も得をした、という逆説が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "補完推定は二重頑健で効率的だった", "title": "Imputation is all you need: double robustness, semiparametric efficiency, and automatic covariate balance for estimating the average treatment effect", "url": "https://arxiv.org/abs/2609.38692", "authors": "Fang Han ほか", "venue": "arXiv", "date": "2026-10-01", "why": "結果モデルだけを当てはめる補完推定が、隠れた重みづけを通じて二重頑健性と効率性を持つことを示し、平均処置効果の推定法の見方を変えうる。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、設定、主結果の命題3.1〜3.3と定理の要旨、考察）を読んだ。証明の節は読んでいない", "preprint": true, "p1": "結果の回帰モデルだけで欠けた潜在的結果を埋める「補完推定」が、最小二乗の級数回帰で行えば、傾向スコアを推定しなくても自動的に共変量の釣り合いを取り、二重頑健で、半母数的に効率的になることを証明した。", "p2": "平均処置効果の推定では、結果モデルだけに頼る補完は脆く、傾向スコア（処置を受ける確率）のモデルも併用する拡張逆確率重み（AIPW）こそが二重頑健だ、という区別が通念になっていた（§1）。", "p3": "処置群と対照群で別々に、基底関数（級数、sieve）による最小二乗回帰を当てはめ、反対側の群の潜在的結果を予測して平均する（§2.2）。その推定量が観測値の重み付き平均に厳密に書き直せ、その重みは基底空間のあらゆる関数について共変量を釣り合わせ（命題3.1〜3.2）、母集団では逆傾向スコアを同じ空間へ射影したものになる（命題3.3）。解釈：最小二乗の正規方程式の中に、AIPWで明示的に入れている逆傾向スコアの成分が隠れているということ。", "p4": "数値実験ではなく理論で示す論文で、標準的な級数近似と基底の次元の増え方の条件のもとで、偏りが「結果回帰の近似誤差」と「逆傾向スコアの近似誤差」の積で表され上から抑えられること（暗黙の二重頑健性）、推定量が効率的影響関数で漸近線形になること（効率性）を定理として導いた（§3.3〜3.4）。", "p5": "重みづけ、共変量の釣り合い、二重頑健性、半母数的効率性のすべてが、補完だけから最小二乗射影の幾何として現れることが示された（抄録、§3）。著者はさらに、二乗損失で学習するニューラルネットやトランスフォーマーも本質的に最小二乗であり、NTK（ニューラル・タンジェント・カーネル）の領域では同様の構造を持ちうると論じる（§4）。", "p6": "著者は、厳密な結果は線形の級数と正確な正規方程式に依存し、有限幅のニューラルネット、正則化、早期打ち切り、不完全な最適化のもとでは同じ表現が成り立つとは限らないと注意している（§4）。残る疑問：多くの共変量では基底の次元が急増する次元の呪いが残り、有限標本での振る舞いは数値で示されていない。", "fun": "薬を飲んだ人と飲まなかった人の効果を比べるとき、「飲まなかった場合の結果」を予測で埋めるのが補完、「似た人どうしの重みを調整する」のが重みづけで、これまでは別の考え方とされてきた。この論文は、予測を最小二乗法で行えば、重みづけが式の中に勝手に入り込んでいることを示した。昔からある方法の中に、知られていなかった性質が隠れていたという発見が面白い。", "unverified": "定理3.1〜3.2の正確な条件（基底次元の増加率など）と証明は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "計算社会科学・ネットワーク科学", "headline": "AI検索は読者の関心を狭めず共有を増やした", "title": "Breaking News Out of the Filter Bubble: Generative AI Search Diversifies Collective Attention and Raises Shared Information Consumption", "url": "https://arxiv.org/abs/2609.38946", "authors": "Heeseung Andrew Lee ほか", "venue": "arXiv", "date": "2026-10-01", "why": "ワシントン・ポストの3.7万人の読者を対象とした無作為化実験で、生成AI検索が情報接触の多様性に与える影響を直接測った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結果、考察、材料と方法の節と図1〜3の説明）を読んだ。補足資料は目次の範囲", "preprint": true, "p1": "ワシントン・ポストの37,561人の無作為化実験で、検索結果の上にAIの回答（記事の引用つき）を出すと、読者どうしが共有する話題の消費が増える一方で、消費はより多くの話題に分散し、人気の低い話題へ移ることを示した。", "p2": "生成AI検索やAI要約は、読者が出会う話題を狭め、人々の共通の情報を減らすという懸念があるが、実際の読者行動での因果的な証拠はなかった（§Introduction）。", "p3": "2024年10月1日〜11月7日、最初の検索時にブラウザのクッキーで読者を割り付け、対照群は従来の検索結果、処置群はその上に最大5本の記事を引用するAI回答（RAG検索）を見た（Materials and Methods）。両群とも同じ記事集と検索基盤を使う。話題はトピックモデルで分類し、AI回答の話題は引用記事から推定して、回答と開いた記事の両方を「消費」として数えた。対照群で読者数の多い上位4分の1の話題を「共有情報」と定義した。", "p4": "分析標本は37,561人（対照26,639人、処置10,922人）で、共有情報の消費量と到達率、読者対の話題の重なり、ジニ係数と実効話題数による集中度、検索後の次の行動、1分あたりの消費量を比べた（Materials and Methods）。割付比率が日によって違うため、事前の特性と週で調整した推定でも確認した（S21）。", "p5": "処置群は共有情報を平均69%多く消費し、共有情報に触れた読者の割合は37%から55%に増えた（Results、図1A）。1人あたりの実効話題数は4.58から5.55に、全体では44.4から46.4に増えて消費は分散した（表1）。記事だけで数えると共有情報の到達率は36.9%対35.1%とほぼ同じで、増加の大半はクリック不要のAI回答によった（Results）。検索回数は29%増え、検索1回あたりの記事消費は18%減ったが、読者1人あたりの記事消費は6%増えた。", "p6": "著者は、AI回答の話題を引用記事から推定しており回答文そのものは分析していないこと、1つの報道機関のサイト内の検索であり、複数の媒体をまたぐ外部のAI検索では読者が媒体に戻らない可能性があること、要約の正確さや偏りは評価していないことを認めている（Discussion）。残る疑問：割付比率が日ごとに異なり、事前特性の差が同時検定では有意だった点。", "fun": "AIが検索結果の上に答えをまとめて見せると、人は自分の好きな話題だけに閉じこもると心配されてきた。ところが実際の新聞サイトで試すと、多くの人が読む大事なニュースに触れる人が増え、同時にふだん読まれない話題にも目が向いた。AIの答えが、記事をクリックしなくても大事な情報を届ける「共通の掲示板」になった、という発見が面白い。", "unverified": "補足資料の表（S1〜S28）の個々の推定値と信頼区間、トピックモデルの詳細は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "徴兵くじで見た退役軍人の食料不安", "title": "Food Insecurity Among Military Veterans", "url": "https://arxiv.org/abs/2609.39932", "authors": "Senan Hogan-Hennessy ほか", "venue": "arXiv", "date": "2026-10-01", "why": "ベトナム戦争期の徴兵くじを操作変数に、兵役が長期の食料不安に与える因果効果をPSIDの新しいデータで推定した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データと方法、識別戦略、結果の節と表3の説明、まとめ）を読んだ。付録の感度分析は目次と本文の要約の範囲", "preprint": true, "p1": "ベトナム戦争期の徴兵くじを操作変数に使い、兵役が退役後の長期の食料不安を悪化させるという証拠はないことを、40年分の家計パネル（PSID）で示した。", "p2": "現役の軍人は一般より食料不安が多いことが知られているが、それが退役後も長く続くか、兵役そのものが原因かについての因果的な証拠はなかった（§5）。兵役に就く人は家庭の経済状況などで選ばれているため、単純な比較では因果が分からない。", "p3": "PSIDの1979〜2019年の26波から1930〜1970年生まれの男性を使い、食費が政府の最低限の食費基準（Thrifty Food Plan）に届かない確率を「食料不安の確率（PFI）」として毎年測った（§1.1〜1.2）。1950〜1952年生まれ（816人）について、くじで決まった徴兵対象かどうかを兵役の操作変数として2段階推定した（§
