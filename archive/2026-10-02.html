 to Contagion: Modeling ESG Risk Spillovers across the Johannesburg Stock Exchange with Directed Causal Networks", "url": "https://doi.org/10.2139/ssrn.7541279", "authors": "Henry Mayambu", "venue": "SSRN", "date": "2026-09-30", "why": "ESGリスクを個別資産の属性ではなく部門間で伝わるショックとして扱い、有向の因果ネットワークで波及を推定した。", "id": "pn49"}, {"rank": 50, "field": "組織行動・心理的安全性", "headline": "研究チームの規模と新規性の種類の関係", "title": "Team scale, expertise distance, and the direction of scientific novelty: Evidence within publicly funded research", "url": "https://doi.org/10.2139/ssrn.7549728", "authors": "Hana Kim", "venue": "SSRN", "date": "2026-10-01", "why": "同じ研究課題内の論文を比べ、チームの規模と専門の距離が新語の導入・組合せ・意味の離れといった新規性の種類にどう関わるかを分けて示した。", "id": "pn50"}], "jnl_related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "車両懸架と桁の連成方程式に近似解析解", "title": "A New Approximate Analytical Solution for Coupled Mathieu-Type Differential Equations in Bridge and Vibrating Vehicle Suspension Interactions", "url": "https://doi.org/10.3390/app16199738", "authors": "Vytautas Kargaudas ほか", "venue": "Applied Sciences", "date": "2026-10-01", "id": "jr01", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "走行車両の懸架装置と橋桁の支間中央の変位が連成する運動方程式を、エネルギーに基づくラグランジュ法で立て、その解を摂動法で近似的に解析的に求め、桁の動的増幅率と懸架の伝達率を代数式で表せるようにした（抄録）。", "p2": "車両-橋梁の連成振動は数値積分で解かれることが多く、桁の動的応答や懸架の伝達特性が、荷重・桁・車両の振動数比にどう依存するかを見通しよく示す解析解が乏しかった（抄録）。解釈：係数が時間で変わる連成方程式は、閉じた形で解くのが難しい。", "p3": "桁の支間中央変位と懸架の変位について、変数係数を持つ2階の線形非斉次微分方程式2本を無次元化し、Lindstedtの特異摂動法で近似解を導いた（抄録）。導いた系はMathieu型（係数が周期的に変わる方程式）で、質量のない車両が通過するときの桁-懸架系の自由振動問題を表すことを示し、桁-懸架系と懸架-桁系の自由振動の励起に対する4つの非自明な基本解を提案した（抄録）。", "p4": "解析解から得た動的変数の予測を数値解と比較した（抄録）。比較した条件や誤差の大きさは未確認（本文を入手できず）。", "p5": "桁の支間中央変位の動的増幅率と懸架の伝達率を、無次元時間、荷重の振動数と桁・車両の振動数の3つの比、自由振動に関わる連成振動数の関数として代数式で表し、桁変位の動的増幅率についてはさらに簡略化した近似式も示した（抄録）。数値解との一致の程度の具体値は未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：桁を支間中央の1自由度で、車両を懸架のみで表す単純化されたモデルで、路面凹凸や複数車両、多モードの影響は扱っていない可能性がある。", "fun": "車が橋を渡ると、車のばねと橋の揺れが互いに押し合って複雑に振動する。この論文は、その連成をブランコをこぐときのように「ばねの強さが周期的に変わる」方程式（Mathieu型）として表し、近似の公式まで導いた。コンピュータに頼らず手計算で見通せる式にすること自体に、力学の古典的な面白さがある。", "unverified": "本文を入手できず、4つの基本解の形、近似の適用範囲、数値解との誤差は確認できなかった。"}, "citescore": 6.1, "citescore_year": "2025"}, {"rank": 2, "theme": "職場AI・組織行動", "headline": "AIのための理想データ追求が組織を変える", "title": "In Pursuit of Ideal Data: Epistemic Enchantment and the Unintended Consequences of Datafying for Artificial Intelligence", "url": "https://doi.org/10.1177/00018392261484887", "authors": "Elmira van den Broek ほか", "venue": "Administrative Science Quarterly", "sjr": 9.595, "date": "2026-10-01", "id": "jr02", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "AIによる採用候補者の選考を導入した人事部門の3年間のエスノグラフィーから、AIの予測への期待に魅せられた組織が「理想のデータ」を追い求めてデータ化の範囲を際限なく広げていく過程を「認識的な魅惑（epistemic enchantment）」という概念で説明した（抄録）。", "p2": "仕事のデータ化は、管理や説明責任のためのものとして、組織を深く意図せず変えることが知られてきたが、AIの予測モデルで知識を引き出そうとする場合にデータ化がどう展開するかは分かっていなかった（抄録）。", "p3": "候補者選考にAIを導入した人事部門を3年間にわたって観察するエスノグラフィー（参与観察などによる質的研究）を行った（抄録）。データの収集・分析の具体的な手順は未確認（本文を入手できず）。", "p4": "組織の成員がAIの導入に伴ってどのようなデータ化の実践を行い、それが当初の想定の範囲からどう広がったかを追跡した（抄録）。比較対象となる組織の有無は未確認。", "p5": "データ化は技術の当初の想定の範囲をはるかに超えて広がった（抄録）。著者はこれを、成員がAIの「予測的で客観的で改善し続ける洞察」という約束に魅せられ、費用とリスクを見落としながら動員される集団的な過程（認識的な魅惑）として説明し、決して到達しない「理想のデータ」を追うことでデータ化が終わりなく続くことを示した（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：単一の組織の事例に基づく理論構築であり、他の業務領域や組織文化で同じ過程が起きるかは今後の検討課題である。", "fun": "AIで採用を効率化しようとした人事部が、「もっと良いデータがあればもっと賢くなる」と考えて、集めるデータをどんどん増やしていった。ゴールの「理想のデータ」は永遠に手に入らないのに、追いかけることがやめられない。技術への期待そのものが、組織の行動を動かすエンジンになるという指摘が面白い。", "unverified": "本文を入手できず、観察の具体的な事例、データ化の拡大の段階、費用とリスクの中身は確認できなかった。"}, "citescore": 13.4, "citescore_year": "2025"}, {"rank": 3, "theme": "会計情報科学", "headline": "ESG指標で非上場企業の財務困窮予測が向上", "title": "Which Environment, Social and Governance Indicators Influence the Financial Distress Prediction? Evidence From Explainable Neural Networks", "url": "https://doi.org/10.1002/bse.71628", "authors": "Iulia Voicila Voicila ほか", "venue": "Business Strategy and the Environment", "sjr": 3.678, "date": "2026-10-01", "id": "jr03", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "英国の非上場企業9,715社で、ESG（環境・社会・ガバナンス）の総合点ではなく個別の指標を財務指標に加えると財務困窮の予測精度が上がり、どの指標が効くかは企業の健全度の段階で異なることを示した（抄録）。", "p2": "ESG情報が財務困窮の予測に役立つかは議論があり、多くの研究は総合的なESGスコアを使ってきたが、どの個別指標に重要な情報があるかは分かっていなかった（抄録）。", "p3": "2020〜2023年の英国の非上場企業9,715社について、説明可能な人工ニューラルネットワーク、多項ロジスティック回帰、ランダムフォレストを組み合わせ、分解したESG指標の寄与を調べた（抄録）。解釈：困窮の段階を複数の区分（健全・グレーゾーン・困窮など）として予測する多クラス分類と考えられる。", "p4": "財務指標だけのモデルを基準に、分解したESG指標を加えたときの保留データでの正解率とマクロF1を比べ、3つの手法で指標の重要度が一致するかを確かめた（抄録）。", "p5": "分解したESG指標を加えると、保留データの正解率は66.5%から74.4%、マクロF1は0.657から0.748に上がった（抄録）。重要な情報は総合点ではなく、経営者報酬、従業員・利害関係者に関わる慣行に集中し、ガバナンスは中程度、環境指標はばらついた。総合点は手法を問わず「困窮の確率を高める」逆向きの符号で、合成指標が構成要素の信号を反転させうることが示された（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、長期的な慣行は健全な企業で、ガバナンスの統制は困窮企業で最も情報を持ち、上積みの価値はグレーゾーンで最大になると述べる（抄録）。解釈：期間が2020〜2023年と短く、景気循環を通じた安定性は別に確かめる必要がある。", "fun": "会社の「ESGの成績表」の総合点は、倒産しそうかを予想するのにむしろ逆向きに働いた。ところが中身の項目、たとえば役員報酬や従業員への接し方を個別に見ると、予測がぐっと当たるようになった。平均点だけ見ると大事な信号が打ち消されてしまう、という教訓が面白い。", "unverified": "本文を入手できず、困窮の定義と区分、各ESG指標の具体的な寄与の大きさ、モデルの設定は確認できなかった。"}, "citescore": 23.8, "citescore_year": "2025"}, {"rank": 4, "theme": "包摂的コミュニティ・社会", "headline": "地域のwell-beingの構造を網の目で描く", "title": "Mapping the Structure of Community Well‐Being: A Psychometric Network Analysis of Social, Institutional and Environmental Conditions in Nova Scotia", "url": "https://doi.org/10.1002/casp.70334", "authors": "Taylor G. Hill", "venue": "Journal of Community & Applied Social Psychology", "date": "2026-09-30", "id": "jr04", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "p1": "カナダ・ノバスコシア州の住民1万1,809人のデータで、地域とシステムのwell-beingに関わる社会・健康・環境・経済の条件の相互関係を心理測定ネットワーク分析で描き、「時間のゆとり」が多くの領域をつなぐ橋渡しの位置にあることを示した（抄録）。", "p2": "well-beingは多面的な構成概念だが、多くの研究は各領域を独立した予測因子として扱い、それらが互いにどう組織されているかを調べてこなかった（抄録）。", "p3": "母集団ベースの大規模データに心理測定ネットワーク分析を適用し、各変数をノード、変数間の条件付きの関連を辺とするネットワークを推定して、中心性（ネットワークの中でどれだけ要になっているか）と橋渡しの期待影響（異なる領域のまとまりを結ぶ度合い）を求めた（抄録）。", "p4": "理論に基づいて指定した領域のまとまり（コミュニティ構造）と、別の指定のもとでも、中心性と橋渡しの順位が保たれるかを確かめた（抄録）。変数の具体的な一覧と推定法は未確認（本文を入手できず）。", "p5": "コミュニティ感覚、生活満足度、時間のゆとり、身体的健康、就業状態が中心的な位置を占めた（抄録）。時間のゆとりは理論的な領域構造のもとで最も高い橋渡しの期待影響を持ち、別の領域の指定でも比較的高い順位だった。知覚された時間が仕事・健康・社会関係・物質的条件をつなぐことが示唆された（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：横断データのネットワークは変数間の関連の構造を示すが、因果の向きは示さない。橋渡しの位置にあることが介入の効果につながるかは別に検証する必要がある。", "fun": "幸せに関わる要素を「つながりの地図」として描くと、収入や健康と並んで「時間に余裕があるか」が、仕事・健康・人間関係を結ぶ交差点の位置に現れた。お金だけでなく時間のゆとりが、暮らしのいろいろな面をつなぐ要になっているという見方は、身近な実感とも重なって面白い。", "unverified": "本文を入手できず、使った変数の一覧、推定法、中心性の数値は確認できなかった。"}, "citescore": 3.9, "citescore_year": "2025"}, {"rank": 5, "theme": "サービス・マーケティング", "headline": "松戸市の保育インフラ満足を親と保育士から評価", "title": "Urban childcare infrastructure in Japan: evaluating satisfaction from the perspectives of parents and childcare workers in Matsudo City", "url": "https://doi.org/10.1007/s44268-026-00100-1", "authors": "Kieko Ohara ほか", "venue": "Smart Construction and Sustainable Cities", "sjr": 1.361, "date": "2026-10-01", "id": "jr05", "explain": {"basis": "本文", "basis_note": "出版社サイト（Springer）のHTML本文（方法、結果の4.1〜4.2、考察の限界の節）を読んだ。4.3〜4.4の詳細な回帰結果は抄録の範囲", "preprint": false, "p1": "千葉県松戸市の保育施設41か所で、保護者308人と保育士245人の満足度を比べ、施設・設備への満足が全体の満足を最も強く左右すること、保護者は送迎や日常の利便、保育士は設備の質と働く環境・運営の安全を重視することを示した。", "p2": "少子高齢化の日本で、都市の保育施設は子どもの安全、親の就業継続、保育士の安定した勤務を支える都市インフラだが、利用者（保護者）とサービス提供者（保育士）の両方の視点から満足の構造を比べた研究は少なかった（§1〜2）。", "p3": "市内197施設に依頼して同意した41施設（公立14、私立10、小規模17）で匿名の質問紙調査を行い、全体の満足（独立した1項目）を、設備・周辺環境・周辺環境の安全の3領域の満足で説明する回帰と、各領域の満足を個別項目で説明する段階的重回帰を行った（§3.1〜3.3）。5段階の回答を連続量として扱った。", "p4": "相関と段階的重回帰で、どの領域・項目が満足と独立に関連するかを保護者と保育士で比べ、決定係数と多重共線性（VIF）を確かめた（§3.3、§4）。回収率は保護者49.5%、保育士71.2%だった（§3.1）。", "p5": "3領域はいずれも全体の満足と中程度の正の相関を示し、全体の満足への影響は設備が最も強く（標準化係数β=0.446（保護者）、0.429（保育士））、決定係数は保護者0.419、保育士0.526だった（抄録、§4.1）。保護者の設備の満足は、家具・設備の快適さ、保育室の広さ、教材・玩具の充実と強く関連し、駐車場などの項目の関連は小さかった（§4.2、決定係数0.537）。", "p6": "著者は、1市の横断調査で一般化と因果の推論に限界があること、施設は自発的な参加で選択の偏りがありうること、予備調査を行っていないこと、距離などの客観的な空間指標を使っていないこと、保育所に入れなかった世帯を含まないことを認めている（§5.5）。一部の回帰では残差の正規性・等分散性からの逸脱もあった。", "fun": "保育園の満足度を、預ける親と働く保育士の両方に聞くと、同じ施設でも見ているところが違った。親は送り迎えのしやすさを気にし、保育士は設備の使いやすさや職場の環境を気にする。それでも両者に共通して一番効いていたのは、子どもが長い時間を過ごす部屋や家具の質だった、という点が面白い。", "unverified": "周辺環境と安全の領域の回帰結果（表9以降）の係数の数値は確認していない。"}, "citescore": 8.9, "citescore_year": "2025"}, {"rank": 6, "theme": "VBI・橋梁SHM", "headline": "たわみ応答の主成分で鉄道トラス橋の損傷を検出", "title": "Principal Component Analysis of Deflection Responses for Damage Identification in Railway Steel Truss Bridges", "url": "https://doi.org/10.1061/jpcfev.cfeng-5573", "authors": "Shubhashree Chimote ほか", "venue": "Journal of Performance of Constructed Facilities", "date": "2026-09-30", "id": "jr06", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "p1": "鉄道の鋼トラス橋で、走行時の鉛直の動的たわみ応答の共分散から主成分を取り出し、健全時と損傷時の主成分の位置の違いで、剛性低下10%程度の損傷も位置まで特定できることを数値解析で示した（抄録）。", "p2": "供用中の鉄道鋼トラス橋の多くは設計寿命に達しつつあり、当初の想定を大きく超える荷重を受けて劣化が進みうるため、早期の損傷同定と効率的な保守が必要である（抄録）。", "p3": "健全・損傷の両状態で鉛直の動的たわみ応答を取得し、その共分散行列から主成分分析（PCA）で主成分を抽出し、健全時と損傷時の主成分の位置の差を比べて損傷を検出・位置特定する（抄録）。解釈：損傷で局所の剛性が下がると、たわみの空間的な相関パターンが変わり、それが主成分の形のずれとして現れる。", "p4": "鋼トラス橋の有限要素モデルによる数値研究で、許容速度のデータから最大運転速度の基準を定め、単一・複数の損傷シナリオに人工的な雑音を加えて計測の不確かさを模擬した（抄録）。評価の定量的な指標は未確認（本文を入手できず）。", "p5": "たわみに基づくPCAは、単一・複数損傷のどちらでも剛性低下10%という小さな損傷の区域を特定し、さまざまな運転条件で損傷の程度を区別できた（抄録）。検出率などの数値は未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：検証は有限要素モデルの数値実験のみで、実橋の温度変化や車両の多様さのもとで、たわみの計測（計測手段を含む）がどこまで可能かは別途の検証が要る。", "fun": "列車が橋を渡るときの橋の「たわみ方」のパターンを、統計の主成分分析で要約すると、どこかの部材が少し弱っただけでパターンの形がずれる。そのずれの位置から、剛性が1割下がった程度の小さな傷まで場所を言い当てられた。難しい物理モデルを使わず、データの形の変化から異常を探す発想が面白い。", "unverified": "本文を入手できず、橋梁モデルの規模、雑音の水準、検出性能の数値は確認できなかった。"}, "citescore": 4.3, "citescore_year": "2025"}, {"rank": 7, "theme": "職場AI・組織行動", "headline": "生成AIとの協働の型で家庭との葛藤が変わる", "title": "How does employee-GenAI collaboration affect employees’ work-family conflict?", "url": "https://doi.org/10.1177/10519815261491756", "authors": "Shan Li ほか", "venue": "Work", "date": "2026-09-30", "id": "jr07", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "p1": "生成AIとの協働のかたちが、能力を補強する型か妨げる型かによって、従業員の雇用不安と仕事と家庭の葛藤に逆向きの影響を持つことを、2時点の調査で示した（抄録）。", "p2": "生成AIの職場への統合が仕事の進め方と意思決定の分担を変えつつあるが、人とAIの協働の影響は主に職場内で調べられ、家庭生活への波及は分かっていなかった（抄録）。", "p3": "認知的評価理論に基づき、生成AIとの協働を「補強型（augmentation）」と「妨げ型（impediment）」に分け、雇用不安を媒介、知覚された脅威を調整の条件とするモデルを立てた（抄録）。従業員427人の2時点調査を、重回帰とPROCESSモデルで分析した（抄録）。", "p4": "協働の2つの型と仕事と家庭の葛藤の関係、雇用不安の媒介効果、知覚された脅威による調整を検定した（抄録）。標本の業種や国、尺度の詳細は未確認（本文を入手できず）。", "p5": "補強型の協働は仕事と家庭の葛藤と雇用不安の低さと、妨げ型の協働は両方の高さと関連し、雇用不安がこれらの関係を媒介した（抄録）。知覚された脅威は、補強型の協働が雇用不安を下げる効果を弱め、妨げ型の協働が雇用不安を高める効果を強めた（抄録）。効果量は未確認。", "p6": "限界は未確認（本文を入手できず）。著者は、生成AIと働く帰結は使うかどうかではなく人と技術の役割の構成で決まると結論する（抄録）。解釈：自己報告の調査で、協働の型の評価と葛藤の評価が同じ回答者の認識に依存する点には注意が要る。", "fun": "同じ生成AIでも、「自分の力を伸ばしてくれる相棒」として使えると家庭とのぶつかり合いが減り、「仕事の邪魔をする存在」と感じると増えた。その間をつないでいたのは「自分の仕事がなくなるかも」という不安だった。AIを使うかどうかより、どう付き合うかが家での時間にまで響くという点が面白い。", "unverified": "本文を入手できず、調査対象の国・業種、尺度、効果の大きさは確認できなかった。"}, "citescore": 2.9, "citescore_year": "2025"}, {"rank": 8, "theme": "都市・インフラ政策", "headline": "新旧市街で街の印象と機能のずれ方が違う", "title": "Assessing Divergent Perception–Function Coupling Across Old and New Urban Fabrics: A Nonlinear Spatial Analysis of Xi’an, China", "url": "https://doi.org/10.3390/buildings16193911", "authors": "Dandan Sun ほか", "venue": "Buildings", "sjr": 0.686, "date": "2026-10-01", "id": "jr08", "explain": {"basis": "抄録", "basis_note": "出版社サイト（MDPI）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "中国・西安で13万枚超の街路画像と73万件超のPOI（施設位置）データを組み合わせ、人が知覚する街路の質と機能の密度の結びつき方が、歴史的市街地と新市街地で大きく異なることを非線形のモデルで示した（抄録）。", "p2": "建造環境の視覚的評価は進んだが、既存研究は都市を一様なものとして扱い、異なる市街地の形態のもとで、主観的な空間の知覚と機能的なインフラがどう関係するかを見落としてきた（抄録）。", "p3": "事前学習済みのモデルで街路画像から知覚スコア（にぎわい、歩行の快適さなど）を推定し、POIから機能の密度を求め、両者の空間的な整合を分類したうえで、一般化加法モデル（GAM）で非線形の関連を推定した（抄録）。", "p4": "歴史地区と新開発地区で、生活利便施設や職場の密度と知覚スコアの関係の形を比べた（抄録）。モデルの適合度などの指標は未確認（本文を入手できず）。", "p5": "歴史地区は商業の集積がにぎわいを支える一方、新開発地区は施設が分散していてもにぎわいの印象を保っていた（抄録）。生活利便施設とにぎわいの正の関連は歴史地区の方が早く頭打ちになり、歴史地区では快適さが職場の密度に対して逆U字型で、1 km²あたり約113件を超えると下がったが、新しい地区では同様の低下は見られなかった（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、同じ視覚的な知覚の指標でも構造的な実態は大きく異なりうるので、局所の機能密度と視覚的評価を統合すべきだと述べる（抄録）。解釈：知覚スコアは事前学習済みモデルの推定で、西安の住民の実際の知覚とどこまで一致するかは別途の検証が要る。", "fun": "街の写真から「にぎやかそう」「歩きやすそう」をAIで点数化すると、古い町並みと新しい開発地で、同じ点数でも中身が違っていた。古い町では店が密集してにぎわいを生み、オフィスが増えすぎると歩きにくくなる。見た目の印象だけでは街の仕組みは分からない、という指摘が面白い。", "unverified": "本文を入手できず、知覚スコアを作ったモデル、各分析の統計的な精度、地区の区分の方法は確認できなかった。"}, "citescore": 5.6, "citescore_year": "2025"}, {"rank": 9, "theme": "包摂的コミュニティ・社会", "headline": "若手への年齢差別がコミュニティ感覚を分断", "title": "Youngism at work: How age discrimination against younger employees fractures psychological sense of community", "url": "https://doi.org/10.1016/j.jbusres.2026.116535", "authors": "Meng Song ほか", "venue": "Journal of Business Research", "sjr": 3.498, "date": "2026-09-30", "id": "jr09", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "p1": "若手従業員への年齢差別（ヤンギズム）が、同世代の仲間への同一化を強め、同世代内のコミュニティ感覚を高める一方で組織へのコミュニティ感覚を弱める「アイデンティティの取引」を起こすことを、日誌法で示した（抄録）。", "p2": "若い従業員に対する年齢差別は増えているが、その心理的な帰結、とりわけ職場のコミュニティ感覚への影響はほとんど調べられていなかった（抄録）。", "p3": "拒絶-同一化モデルと社会的アイデンティティ理論に基づき、勤続3年以内の中国の従業員63人に10営業日の日誌調査を行い（546日分の観測）、日々の年齢差別→年齢集団への同一化→集団内・組織へのコミュニティ感覚の経路と、成長マインドセットによる調整を検証した（抄録）。", "p4": "日単位の個人内の変動を使って、差別を受けた日に同一化とコミュニティ感覚がどう変わるかを推定した（抄録）。推定のモデル（多層モデルなど）の詳細は未確認（本文を入手できず）。", "p5": "日々の年齢に基づく差別は同世代集団への同一化を強め、それが集団内のコミュニティ感覚を高め、組織へのコミュニティ感覚を弱めた（抄録）。成長マインドセット（能力は伸ばせるという信念）が強い人ほど、差別と同一化の関係は弱かった（抄録）。効果の大きさは未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：63人・10日の標本は日誌法としては一般的だが、中国の特定の職場の若手に限られ、他の文化や年齢差別の形への一般化には限界がある。", "fun": "「若いから分からないでしょ」と言われた日は、同期どうしの結束が強まる一方で、会社全体への「ここは自分の居場所だ」という感覚は弱まる。差別が仲間の絆を生みながら組織を分断する、という二面性を毎日の記録から捉えた点が面白い。", "unverified": "本文を入手できず、使った尺度、推定モデル、各経路の係数の大きさは確認できなかった。"}, "citescore": 22.9, "citescore_year": "2025"}, {"rank": 10, "theme": "VBI・橋梁SHM", "headline": "平板の振動数から地盤ばね2定数をベイズ同定", "title": "Identifying Two-Parameter Pasternak Foundation Stiffness from Plate Vibration Frequencies: A Bayesian Framework with Cross-Platform Verification for Soft-Ground Highway Widening", "url": "https://doi.org/10.3390/buildings16193907", "authors": "Dan Peng ほか", "venue": "Buildings", "sjr": 0.686, "date": "2026-10-01", "id": "jr10", "explain": {"basis": "抄録", "basis_note": "出版社サイト（MDPI）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "軽量の平板の振動試験から、地盤の圧縮係数kとせん断層剛性G^という2つのパラメータを持つPasternak地盤モデルの剛性を、ベイズ推定で同時に同定できるようにした（抄録）。", "p2": "地盤を独立したばねの並びとみなすWinklerモデルはせん断を伝えず、軟弱地盤上の道路拡幅で問題になる不同沈下や側方の押し出しを再現できない（抄録）。せん断の結合を入れたPasternakモデルのせん断層剛性は、静的載荷なしには測れなかった。", "p3": "ハミルトン形式の固有値問題で、2つのパラメータが基本モードで異なる幾何学的な重みを持つことを利用して区別し、Chebyshev–Ritz法で収束を確かめ、SAP2000の立体モデルで室内実験の振動数と照合した（抄録）。K30（平板載荷試験の値）に基づく事前分布と分解能に合わせた雑音モデルでMCMCを行った（抄録）。", "p4": "事前分布への感度と、平板を1枚ずつ除く検証を行い、同定したモデルを再調整せずにAbaqusとSAP2000に移して公表済みの有限要素ベンチマーク（現地検証ではなく整合性の確認）と比べ、剛性を合わせたWinklerモデルと対比した（抄録）。", "p5": "同定値はk=5.99±0.58 MPa/m、G^=0.153±0.008 MN/mで、せん断が支配する応答はベンチマークと5%以内で一致したが、Winklerモデルは約20%ずれた（抄録）。Winklerの剛性を再較正すると差は縮まったが、推定値が事後標準偏差の約2倍ずれ、沈下の谷の広がりは再現できなかった。Sobol指数ではこれらの応答は主にG^で決まり、3枚の平板の試験は車線を閉鎖せず1日で終えられる（抄録）。", "p6": "著者は、ベンチマークとの比較は整合性の確認であって現地での検証ではなく、現地計測は進行中だと述べている（抄録）。解釈：室内実験の結果であり、実際の道路拡幅現場の不均質な地盤で同じ精度が得られるかは今後の課題である。", "fun": "地盤の硬さを測るには重いおもりで押す試験が普通だが、この研究は地面に置いた板を軽く揺らすだけで、「押し込みの硬さ」と「隣どうしを引きずる硬さ」の2つを見分けた。揺れの形のなかで2つの硬さが違う効き方をすることを利用した点が巧みで、道路を止めずに1日で測れるのも面白い。", "unverified": "本文を入手できず、室内実験の条件、ベイズ推定の設定、ベンチマークの詳細は確認できなかった。"}, "citescore": 5.6, "citescore_year": "2025"}, {"rank": 11, "theme": "LLM熟議・ペルソナ", "headline": "LLMで求人広告と市民の期待のずれを測る", "title": "Citizens' Expectations vs. Recruitment Signals: Are Public Administrations Trying to Attract the Ideal Public Servant?", "url": "https://doi.org/10.1111/puar.70199", "authors": "Melissa Satzger Grøn ほか", "venue": "Public Administration Review", "sjr": 3.305, "date": "2026-10-01", "id": "jr11", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国7州の保健・交通部局の求人広告1,825件を大規模言語モデル（LLM）で分析し、求人が専門性や献身を強調する一方、市民が理想の公務員に求める応答性・奉仕性・誠実さといった関係的な価値を十分に示していないことを明らかにした（抄録）。", "p2": "求人広告は応募者を引きつける重要な信号だが、市民が公務員に期待する価値をどれだけ反映しているかはほとんど分かっていなかった（抄録）。", "p3": "シグナリング理論と、理想の公務員に関する市民の規範的期待の先行研究に基づき、LLMで求人広告に表れる価値を符号化し、先行研究で市民が理想の公務員と結びつけた価値と比べた（抄録）。LLMの種類、指示文、人手との一致の検証方法は未確認（本文を入手できず）。", "p4": "7州・2部局の1,825件の求人広告で、価値ごとの言及の頻度を市民の期待の序列と比較した（抄録）。統計的な比較の方法は未確認。", "p5": "求人広告は専門性や献身などの価値を主に強調し、奉仕性・応答性・誠実さのような関係的な価値の信号が不足していた（抄録）。著者はこれを、採用の実務が発する価値と市民が理想の公務員と結びつける価値のずれと解釈する（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、市民が重視する価値を軽視する採用実務が、行政の有能な人材の獲得を妨げうると論じる（抄録）。解釈：比較している市民の期待は先行研究のもので、同じ州・同じ時期の市民の評価ではない点に注意が要る。", "fun": "役所の求人票をAIで大量に読むと、「専門知識」「熱意」は書かれていても、「住民の話をよく聞く」「誠実である」といった、市民が公務員に一番求める資質はあまり書かれていなかった。求人票は「どんな人に来てほしいか」の自己紹介でもあるので、そのずれが応募者の顔ぶれまで変えうるという点が面白い。", "unverified": "本文を入手できず、使用したLLMと符号化の妥当性の検証、価値の分類の詳細は確認できなかった。"}, "citescore": 11.3, "citescore_year": "2025"}, {"rank": 12, "theme": "LLM熟議・ペルソナ", "headline": "LLMで安全と体験を考えた経路を個別提案", "title": "From fastest to safer and more experience-aware: an LLM-driven framework for personalized multimodal routing", "url": "https://doi.org/10.1016/j.tra.2026.105290", "authors": "Yiping Liu ほか", "venue": "Transportation Research Part A Policy and Practice", "sjr": 1.843, "date": "2026-09-30", "id": "jr12", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "p1": "所要時間・交通手段ごとの事故リスク・街並みの印象・乗換え負担を同時に考えた多目的の経路探索と、LLMの多エージェントによる推薦を組み合わせ、利用者の属性と移動の文脈に合った安全な複合交通の経路を提案できるようにした（抄録）。", "p2": "多くの経路案内は所要時間の最適化が中心で、安全や体験の質を含めた人間中心の判断を支えていない（抄録）。過去の行動データから好みを推定する従来の個人化は、新規利用者の問題、データ要件の高さ、文脈間の移転の難しさを抱えていた。", "p3": "ラベル修正型の多目的アルゴリズムでパレート最適な候補経路を作り、事故リスクは交通手段別の多変量事故モデル、街並みの印象は街路画像からの深層学習で予測した（抄録）。ハイパーボリュームに基づく貪欲な抽出で候補を絞り、LLMの多エージェントが利用者の属性と移動の文脈を解釈して理由つきで推薦し、自己進化する記憶で改善する（抄録）。", "p4": "韓国・大田（テジョン）の実際の複合交通網・事故記録・街路画像で、通勤・余暇・買い物の場面について、属性と経路の適合度と経路の安全リスクを評価した（抄録）。比較対象の手法と指標の詳細は未確認（本文を入手できず）。", "p5": "提案の枠組みは属性と経路の適合を高め、経路単位の安全リスクがより低い代替経路を見つけた（抄録）。自己進化の記憶の仕組みは、LLMの規模による性能の差を縮め、低費用での導入の道を示した（抄録）。数値は未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：利用者の属性は模擬されたものと考えられ、実際の利用者の満足や行動の変化での検証が今後の課題になる。", "fun": "道案内アプリはふつう「一番早い道」を出すが、この研究は「事故が少なく、景色が気持ちよく、乗り換えが楽な道」まで考え、さらにAIが「あなたは子連れの買い物だからこの道」と理由をつけて薦める。速さだけでない「良い道」を、街路の写真と事故の記録から作り出す点が面白い。", "unverified": "本文を入手できず、評価に使った利用者の属性の作り方、比較手法、改善の大きさは確認できなかった。"}, "citescore": 12.1, "citescore_year": "2025"}, {"rank": 13, "theme": "都市・インフラ政策", "headline": "都市鉄道PPPの公共価値を事前に評価", "title": "Determinants of Perceived Public Value in PPPs for Urban Transport in Developing Contexts: An Ex‐Ante Structural Analysis of Guadalajara Light Rail Line 4", "url": "https://doi.org/10.1002/sd.71728", "authors": "Vicente Pina ほか", "venue": "Sustainable Development", "sjr": 1.799, "date": "2026-10-01", "id": "jr13", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "メキシコ・グアダラハラのライトレール4号線を事例に、都市鉄道の官民連携（PPP）が生む公共価値の決定要因を事前に分析し、社会的な費用便益と財務的な持続性が中核で、それを統治とリスク分担が形づくることを示した（抄録）。", "p2": "PPPは発展途上の地域で都市鉄道の整備に広く使われるが、公共価値への貢献については議論があり、契約前の段階で何が公共価値を左右するかの分析は乏しかった（抄録）。", "p3": "公共価値と頑健な統治の理論に基づき、専門家の判断を2回に分けて引き出し、17の変数の影響関係をMICMAC構造分析で整理し、AHP-PROMETHEE IIという多基準評価で確認した（抄録）。解釈：MICMACは変数どうしの影響の行列から、他を動かす「駆動」変数と他に動かされる「従属」変数を分ける手法である。", "p4": "変数の影響力と依存度の配置、多基準評価による順位の一致を見た（抄録）。専門家の人数と属性は未確認（本文を入手できず）。", "p5": "公共価値の原動力は、社会にとっての費用便益と財務的な持続性という社会経済的な中核で、それが事前に統治とリスク分担によって形づくられていた（抄録）。環境への影響と技術革新は、専門家が契約設計ではなく長期と結びつける影響力の低い変数だった（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、36年の運営権の期間中に短期の経済中心のモデルが固定化する危険があるとして、持続可能性と革新をKPI連動の支払い・誘因・定期的な見直しで契約に書き込むべきだと提言する（抄録）。解釈：1路線の専門家判断に基づく分析で、実際の運営後の成果との照合はない。", "fun": "鉄道を民間と一緒に造るとき、何が「みんなのためになるか」を専門家に聞いて整理すると、お金の採算と社会全体の損得が中心で、環境や新技術は「いずれ考えること」として後回しにされがちだった。36年も続く契約だからこそ、最初の契約書に未来の宿題を書き込んでおけ、という提言が面白い。", "unverified": "本文を入手できず、17変数の一覧、専門家の構成、各変数の影響度の数値は確認できなかった。"}, "citescore": 13.6, "citescore_year": "2025"}, {"rank": 14, "theme": "VBI・橋梁SHM", "headline": "時間周波数解析でペリダイナミクスの定数を同定", "title": "Time–Frequency Identification of Peridynamic Parameters for Structural Health Monitoring Under Extreme Excitation", "url": "https://doi.org/10.3390/buildings16193910", "authors": "Gaetano Miraglia", "venue": "Buildings", "sjr": 0.686, "date": "2026-10-01", "id": "jr14", "explain": {"basis": "抄録", "basis_note": "出版社サイト（MDPI）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "非局所的な力学理論であるペリダイナミクスのパラメータを、時間領域だけでなく時間周波数領域で推定する方法を作り、急な剛性低下を伴う損傷を同定できることを実験のベンチマークで示した（抄録）。", "p2": "構造ヘルスモニタリング（SHM）では、データ駆動型は物理の理解が難しく、モデル駆動型はモデルと現実のずれや不確実性に悩まされる（抄録）。ひび割れや揺動（ロッキング）のような脆性的な崩壊に関わる非線形挙動を、少ないパラメータで扱える枠組みが求められていた。", "p3": "ペリダイナミクス（離れた粒子どうしの力を積分で表し、ひび割れのような不連続を自然に扱える理論）を、データ駆動とモデル駆動の橋渡しに使い、そのパラメータの値を周波数ごとにも与える時間周波数分布として推定する（抄録）。手法の数式の詳細は未確認（本文を入手できず）。", "p4": "急な剛性低下を受ける1自由度と多自由度の実験ベンチマークで、提案した枠組みを検証した（抄録）。比較対象の手法や評価指標は未確認。", "p5": "提案の枠組みは、急な剛性低下を伴う1自由度・多自由度の実験ベンチマークで損傷を同定できたとされる（抄録）。定量的な精度は未確認（本文を入手できず）。", "p6": "著者は、現在の検証は意図的に統制された系に限られているが、方法は一般的なペリダイナミクスの離散化に対して定式化されており、より複雑な構造へ拡張できる可能性があると述べる（抄録）。", "fun": "ふつうの力学は「となり合う部分どうし」が力を及ぼし合うと考えるが、ペリダイナミクスは「少し離れた点どうし」もつながっていると考えるので、ひびが入って材料が切れても計算が破綻しない。その性質を、揺れのデータから壊れ方を読み取る診断に使った点が面白い。", "unverified": "本文を入手できず、時間周波数分布の推定方法、実験の条件、同定の精度は確認できなかった。"}, "citescore": 5.6, "citescore_year": "2025"}, {"rank": 15, "theme": "位相空間・土木三力学", "headline": "土石流による河道閉塞を気候と数値計算で再構成", "title": "Event Reconstruction and Hydroclimatic–Cryospheric Context of the 2018 Badswat Debris Flow–River Blockage, Pakistan", "url": "https://doi.org/10.3390/w18192440", "authors": "Muhammad Jehanzaib Khattak ほか", "venue": "Water", "date": "2026-10-01", "id": "jr15", "explain": {"basis": "抄録", "basis_note": "出版社サイト（MDPI）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "2018年7月17日にパキスタン北部ギルギット・バルティスタンで起きたバドスワットの土石流と河道閉塞を、流域規模の気候・雪氷の診断と、土石流の流動計算（RAMMS-DF）による事象の再構成とを組み合わせて分析した（抄録）。", "p2": "急速に温暖化する高山アジアでは、雪や地盤の温度、流出、土砂の供給、水に関わる集団移動の災害が変化しているが、長期の環境変化と個々の事象の引き金を分けて扱う分析が必要だった（抄録）。", "p3": "Google Earth Engineで積雪面積（MODIS、2000〜2025年）、凍結指数による永久凍土に適した地形（2001〜2025年）、気温（ERA5-Land、1950〜2025年）、降水（CHIRPS、1981〜2025年）を解析し、事象はVoellmy–Salmのレオロジー（μ=0.09、ξ=500 m s−2）で12.5 mの格子のRAMMS-DFで再構成した（抄録）。", "p4": "気候指標の傾向と相関を検定し、較正したシナリオが地図化された流下経路・河道閉塞の位置・堆積域を再現するかを確かめた（抄録）。", "p5": "気温は10年あたり0.13 °C上昇し（p<0.001）、積雪と永久凍土に適した範囲は気温と負に相関した（r=−0.74、−0.78）が、短い衛星記録では有意な傾向はなかった（抄録）。較正したシナリオは流下経路・閉塞位置・堆積域を再現し、最大で流動深15.17 m、速度33.82 m/s、衝撃圧2,544 kPa、底面せん断応力81 kPa、堆積量約352,540 m³と推定された（抄録）。", "p6": "著者は、流動の出力には独立の計測がなく、パラメータの同時の不確実性も定量化していないため、これらは設計値ではなくシナリオの推定値だと明記し、CHIRPSの降水の傾向はERA5-Landと年変動が一致せず製品依存だとしている（抄録）。事象の引き金は未解明のまま残る。", "fun": "ヒマラヤ近くの谷で起きた土石流を、衛星データとコンピュータの流れの計算で再現すると、高さ15 m、秒速30 m超の泥と岩の流れが川をせき止めたと推定された。ただし著者は「これは測った値ではなく、一つの筋書きの計算結果だ」と正直に線を引いている。分かったことと分からないことを分けて示す姿勢が面白い。", "unverified": "本文を入手できず、較正の手順、地図化した堆積域との一致の度合い、感度分析の範囲は確認できなかった。"}, "citescore": 6.7, "citescore_year": "2025"}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "地震動の分類で構造別の脆弱性曲線を効率推定", "title": "Efficient Estimation of Structure‐Specific Fragility Curves Using Ground Motion Clustering Within Multiple Stripe Analysis", "url": "https://doi.org/10.1002/eqe.70304", "authors": "Henrry Rojas‐Asuero ほか", "venue": "Earthquake Engineering and Structural Dynamics", "sjr": 1.622, "date": "2026-10-01", "id": "jr16", "citescore": 9.7, "citescore_year": "2025"}, {"rank": 17, "theme": "包摂的コミュニティ・社会", "headline": "運動ニューロン疾患の介護と休息支援の実態", "title": "Caregiving and Respite for People With Motor Neurone Disease: A National Cross‐Sectional Survey of Experiences and Challenges", "url": "https://doi.org/10.1111/jocn.70548", "authors": "Natalie Gauld ほか", "venue": "Journal of Clinical Nursing", "sjr": 1.397, "date": "2026-10-01", "id": "jr17", "citescore": 8.8, "citescore_year": "2025"}, {"rank": 18, "theme": "包摂的コミュニティ・社会", "headline": "飲酒と孤独・社会的孤立の双方向関係を分離", "title": "Drinking at least weekly, loneliness and social isolation over time: Bidirectional within‐person associations in an Australian prospective cohort study", "url": "https://doi.org/10.1111/add.70620", "authors": "Qingqing Wu ほか", "venue": "Addiction", "sjr": 2.399, "date": "2026-10-01", "id": "jr18", "citescore": 11.0, "citescore_ye trategies among mental health nurses in Oman: a qualitative study", "url": "https://doi.org/10.1186/s12912-026-05087-9", "authors": "Asiya Mohamed Al Zadjali ほか", "venue": "BMC Nursing", "sjr": 1.368, "date": "2026-10-01", "id": "jr48", "citescore": 5.3, "citescore_year": "2025"}, {"rank": 49, "theme": "包摂的コミュニティ・社会", "headline": "人生の出来事と地域サービスが主観年齢を変える", "title": "Feeling younger or older? How life events reshape subjective age among Chinese older adults", "url": "https://doi.org/10.1093/geronb/gbag200", "authors": "Menghan Zhao ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "sjr": 1.503, "date": "2026-09-30", "id": "jr49", "citescore": 6.8, "citescore_year": "2025"}, {"rank": 50, "theme": "都市・インフラ政策", "headline": "歩行・自転車の到達性と公平性を環境込みで評価", "title": "Urban active transport accessibility and equity analysis considering built environment, safety, and air pollution", "url": "https://doi.org/10.1016/j.jtrangeo.2026.104842", "authors": "Aiganym Kumisbek ほか", "venue": "Journal of Transport Geography", "sjr": 1.688, "date": "2026-10-01", "id": "jr50", "citescore": 10.0, "citescore_year": "2025"}], "jnl_notable": [{"rank": 1, "field": "開発経済学", "headline": "思い出す仕組みが農家の貯蓄を変えた", "title": "Retrieval Failures and Consumption Smoothing: A Field Experiment on Seasonal Poverty", "url": "https://doi.org/10.1093/qje/qjag035", "authors": "Ned Augenblick ほか", "venue": "The Quarterly Journal of Economics", "sjr": 33.069, "date": "2026-10-01", "why": "知っている情報を意思決定で思い出せない「想起の失敗」が、年1回の収穫に頼る農家の消費平準化を歪めることをフィールド実験で示した。", "id": "jn01", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "人が知っているはずの情報を意思決定の場で思い出せない「想起の失敗」が、年1回の収穫で暮らすザンビアの農家の消費平準化を歪めることを示し、将来の支出を思い出させるだけの介入で貯蓄と翌年の収入が増えることをフィールド実験で示した（抄録）。", "p2": "収入が年1回の収穫に限られる農家は、収穫後に1年分をうまく配分する必要があるが、収穫の前には食料が不足する「端境期」に消費が大きく落ちる（抄録）。その原因として、将来の支出を過小に見積もる記憶の問題は検証されていなかった。", "p3": "将来の支出を、外部の情報や指導を一切与えずに、項目の種類ごとに連想的に考えさせる介入を無作為に割り当てた（抄録）。解釈：情報を「教える」のではなく、本人がすでに知っていることを「思い出させる」だけの介入であり、記憶の想起の失敗を直接狙っている。", "p4": "思い出された支出額、直後の支出、6週間後の貯蓄、端境期の貯蓄の月数、翌年の作物収入を比べ、さらに米国の低所得層で見積もりへの効果を再現した（抄録）。", "p5": "人々はこれからの支出を50%過小に見積もっていた（抄録）。介入で「思い出された」支出は36〜60%増え、効果は小さく不規則で確率的な項目に集中した（記憶研究の予測どおり）。直後の支出が減り、6週間後の貯蓄は15%多く、端境期に1か月分多い貯蓄を持って入り、1年の支出がより平らになった（抄録）。増えた貯蓄は農業投資の自己資金に使われ、翌年の作物収入は9%増えた（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は米国の低所得層でも見積もりへの効果を再現し、想起の失敗が環境や集団を越えて一般化すると示唆している（抄録）。解釈：米国での再現は見積もりへの効果であり、貯蓄や収入への効果までは示されていない可能性がある。", "fun": "1年分の収入を一度に受け取る農家は、これからの出費を半分くらい少なく見積もってしまう。新しい情報を教えたわけではなく、「食べ物、学校、病気…と種類ごとに思い出してみて」と促しただけで、貯金が増え、翌年の収穫まで増えた。お金の問題が、実は「思い出せるかどうか」という記憶の問題だったという発見が面白い。", "unverified": "本文を入手できず、介入の具体的な手順、標本規模、各効果の信頼区間は確認できなかった。"}, "citescore": 23.8, "citescore_year": "2025"}, {"rank": 2, "field": "経済学", "headline": "富裕税は富裕層の国外移住を招く", "title": "Taxing Top Wealth: Migration Responses and Their Aggregate Economic Implications", "url": "https://doi.org/10.1257/aer.20241596", "authors": "Katrine Jakobsen ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "北欧の行政データで、富裕税率の引き上げが富裕層の国外移住を招くことと、その経済全体への含意を推定した。", "id": "jn02", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "北欧諸国の行政データで、富裕税が富裕層の国外移住を招くことを示し、ただしその移住による経済全体への影響は小さいことを定量化した（抄録）。", "p2": "富裕税は富裕層の国外移住を招くという懸念があるが、移住の反応の大きさと、それが雇用・投資・付加価値に与える総合的な影響の実証的な証拠は限られていた（抄録）。", "p3": "スカンジナビア諸国の行政データを用いて、最高富裕税率の変化に対する富裕な納税者の国際移住の反応を推定し、富裕層の多くが事業所有者であることから、所有者の転出が事業に与える影響も推定した（抄録）。識別の具体的な方法は未確認（本文を入手できず）。", "p4": "最高富裕税率1ポイントの引き上げあたりの富裕な納税者数の変化と、それに伴う雇用・投資・付加価値の変化を評価した（抄録）。", "p5": "最高富裕税率を1ポイント上げると、富裕な納税者の数は約2%減った（抄録）。所有者の転出は事業に負の影響を与えたが、総合的な影響は小さく、1ポイントの引き上げに伴う移住の反応は雇用を0.02%、投資を0.07%、付加価値を0.10%減らすにとどまった（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：北欧の制度と移住の条件のもとでの推定であり、税の執行や国際的な租税条約の異なる国への一般化には注意が要る。", "fun": "お金持ちに税金をかけると国外に逃げてしまう、とよく言われる。北欧の行政データで調べると、確かに税率を1ポイント上げると富裕層は2%ほど減ったが、そのせいで国の雇用や投資が減った分はごくわずかだった。「逃げる」のは本当でも「経済が傾く」ほどではない、と数字で分けて示した点が面白い。", "unverified": "本文を入手できず、対象国と期間、識別の方法、推定の信頼区間は確認できなかった。"}, "citescore": 19.6, "citescore_year": "2025"}, {"rank": 3, "field": "経済学", "headline": "黒人審査官の昇進は規定どおりでも遅れる", "title": "Racial Promotion Gaps", "url": "https://doi.org/10.1257/aer.20231368", "authors": "Deepak Hegde ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "昇進が規定で決まる米特許庁で、黒人の審査官が権利のある昇進を遅らされていることを行政データで示した。", "id": "jn03", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "昇進が規定で決まる米国特許庁で、黒人の特許審査官が、資格のある昇進を遅らされていることを行政データで示し、その原因は信念に基づく差別と整合的だと論じた（抄録）。", "p2": "職場の昇進の人種差は、能力や評価の違いと区別しにくく、差別の有無や種類を特定するのが難しかった（抄録）。", "p3": "昇進が定式的に決まる特許庁という場で、誰がいつ昇進の資格を得たかを観察できる詳細な行政データを使い、資格を得てから実際に昇進するまでの遅れを人種間で比べた（抄録）。解釈：資格の時点が分かるので、能力の差による説明をかなり除いて比較できる。", "p4": "昇進の遅れ、キャリアの頂点に達するまでの期間、生涯所得への影響を比べ、制度上の特徴と上司の人種による違いから、差別の種類（正確な事前知識による統計的差別、嗜好による差別、信念に基づく差別）を区別した（抄録）。", "p5": "黒人の審査官は資格のある昇進が遅れ、キャリアの頂点への到達が1年遅くなり、生涯所得が2.5%減った（抄録）。制度上の特徴から正確な事前知識による統計的差別は除かれ、黒人の上司のもとでも昇進が遅いことは嗜好による敵意に反しており、信念に基づく差別のモデルに合う（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：特許庁という定式的な昇進制度の組織での結果であり、裁量の大きい民間企業での昇進差にどこまで当てはまるかは別途の検討が要る。", "fun": "昇進のルールが決まっているはずの職場でも、黒人の審査官は「昇進できる資格」を得てから実際に昇進するまでに遅れがあり、生涯の給料が2.5%減っていた。しかも上司が黒人でも遅れが見られたので、単純な好き嫌いではなく「思い込み」による差別らしい。ルールがあっても運用に偏りが入り込む、という点が考えさせられる。", "unverified": "本文を入手できず、標本の規模、推定のモデル、信念に基づく差別を支持する証拠の詳細は確認できなかった。"}, "citescore": 19.6, "citescore_year": "2025"}, {"rank": 4, "field": "経済学", "headline": "発明者は自分に似た人向けの製品をつくる", "title": "Social Push and the Direction of Innovation", "url": "https://doi.org/10.1257/aer.20231417", "authors": "Elias Einiö ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "米国とフィンランドの連結データで、発明者が自分と似た属性の消費者向けの製品をつくる同類性を示し、発明の担い手の偏りが不平等に及ぶことを論じた。", "id": "jn04", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarに登録された抄録（ワーキングペーパー版の文面を含む）を使用", "preprint": false, "p1": "発明者・起業家は自分と似た属性（性別・年齢・社会経済的地位）の消費者が買う製品を作る傾向があることを示し、さらに低所得の同輩との接触が必需品を作る傾向を高めるという因果的な証拠を示した（抄録）。", "p2": "イノベーションの担い手は内発的に動機づけられた人々で、その社会的な背景が何を発明するかの方向を左右する可能性があるが（社会的な後押し、social push）、イノベーションの機会へのアクセスの不平等が、発明の方向と不平等にどう効くかは分かっていなかった（抄録）。", "p3": "米国とフィンランドの連結データ（特許の発明者の性別、Nielsenの購買データ、フィンランドの徴兵登録など）で、発明者の属性とその製品の購入者の属性の一致を、産業間と詳細な産業内で調べた（抄録）。同輩との接触の効果を因果的に推定し、その経路を一般均衡モデルに組み込んで、生活費の不平等と長期成長への含意を評価した（抄録）。識別の詳細は未確認（本文を入手できず）。", "p4": "発明者と購入者の属性の一致（同類性）の程度、低所得層の同輩との接触が必需品の創出と起業率・起業所得に与える効果を比べた（抄録）。", "p5": "発明者は性別・年齢・社会経済的地位で自分と似た顧客が買う製品を作りやすく、この傾向は産業間でも詳細な産業内でも見られた（抄録）。低所得層の同輩に接すると、必需品を作る傾向が高まったが、起業率や起業所得は変わらなかった（抄録）。一般均衡モデルで生活費の不平等と長期成長への含意を評価した。", "p6": "限界は未確認（本文を入手できず）。解釈：購入者の属性は消費データの観察可能な属性に限られ、同類性が需要の情報の違いによるのか好みの違いによるのかの区別は本文で確かめる必要がある。", "fun": "発明する人は、自分と似た人が欲しがるものを作りがちだ。女性の発明者は女性が買う製品を、若い人は若い人向けの製品を、という具合に。だから発明の世界に入れる人が偏っていると、作られる製品も偏り、生活の不便さの格差につながりうる。「誰が発明するか」が「何が発明されるか」を決めるという視点が面白い。", "unverified": "本文を入手できず、同輩との接触の効果の識別方法、効果の大きさ、一般均衡モデルの結果の数値は確認できなかった。"}, "citescore": 19.6, "citescore_year": "2025"}, {"rank": 5, "field": "経済学", "headline": "子ども期の近所の構成が異人種・異階層婚を左右", "title": "Who Marries Whom? The Role of Segregation by Race and Class", "url": "https://doi.org/10.1257/aer.20250115", "authors": "Benjamin Goldman ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "子ども期の近隣の異性・同年代の構成を操作変数に、他集団との接触が人種・階層を越えた結婚を増やすことを示した。", "id": "jn05", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarに登録された抄録（ワーキングペーパー版の文面を含む）を使用", "preprint": false, "p1": "子ども期の近隣での他の人種・階層の異性との接触が、階層を越えた結婚を増やすが、人種を越えた結婚には効果が見られないことを示し、居住の分離が階層の結婚の選別の3分の1以上を説明することを推計した（抄録）。", "p2": "米国人は人種や階層の外の相手とほとんど結婚せず、それが不平等と世代間移動に影響するが、他の集団との接触の少なさがどれだけ原因かは分かっていなかった（抄録）。", "p3": "子ども期の近隣で、他の人種・階層の同年代の異性の子どもがたまたま多かったかどうかの変動を操作変数として、接触の効果を推定した（抄録）。さらに空間的な結婚市場のモデルを作り、居住の分離が結婚の選別をどれだけ説明するかを予測した（抄録）。", "p4": "親の所得の高低による階層間の結婚と、白人と黒人の人種間の結婚について、接触の効果を比べた（抄録）。データの具体的な出所と標本規模は未確認（本文を入手できず）。", "p5": "接触は階層間（親の所得の高低）の結婚を増やしたが、人種間（白人と黒人）の結婚には検出可能な効果がなかった（抄録）。空間的な結婚市場のモデルは、居住の分離が、階層による結婚の選別の3分の1以上を説明するが、人種による選別の5%未満しか説明しないと予測した（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、居住の分離は接触の多くの形態のうちの一つにすぎないと述べる（抄録）。解釈：人種間の結婚には接触以外の要因（規範や差別）が大きく効いている可能性があり、その解明は別の課題である。", "fun": "子どものころ近所に、家庭の豊かさが違う同年代の異性が多くいた人は、大人になって階層を越えた結婚をしやすかった。ところが人種を越えた結婚には、近所での出会いの多さはほとんど効かなかった。「出会いの機会」で説明できる壁と、できない壁があることを分けて示した点が面白い。", "unverified": "本文を入手できず、データの出所、操作変数の作り方、推定値の大きさは確認できなかった。"}, "citescore": 19.6, "citescore_year": "2025"}, {"rank": 6, "field": "経済学", "headline": "優秀な同僚は学びと昇進競争の両方をもたらす", "title": "Knowledge Spillovers, Competition, and Individual Careers", "url": "https://doi.org/10.1257/aer.20230714", "authors": "Thomas Cornelissen ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "職場の同僚の質が知識の波及と昇進競争という逆向きの経路でキャリアに効くことを、競争相手かどうかで分けて識別した。", "id": "jn06", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "職場で優秀な同僚に接することが、知識の波及というプラスと、昇進をめぐる競争というマイナスの両方の経路でキャリアに効くことを、競争相手になりやすい同僚とそうでない同僚を区別して識別した（抄録）。", "p2": "より優秀な同僚に囲まれることは知識の波及でキャリアを伸ばしうるが、同時に昇進の競争相手にもなるため、二つの効果が打ち消し合い、別々には測りにくかった（抄録）。", "p3": "未訓練の労働市場参入者を対象に、同じ職種で競争しやすい同僚と、競争しにくい同僚を区別し、それぞれの同僚の質がキャリアに与える影響を比べた（抄録）。解釈：競争しない同僚からは知識の波及だけが、競争する同僚からは波及と競争の両方が来るので、その差から競争の効果を取り出せる。データの国と期間は未確認（本文を入手できず）。", "p4": "同僚の質とその後のキャリアの関係を、競争の有無で分けて推定し、性別で比べた（抄録）。", "p5": "持続的な知識の波及の頑健な証拠と、それと同程度の大きさの逆向きの競争効果が見つかった（抄録）。どちらの効果も女性より男性で大きかった（抄録）。効果の数値は未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：同僚の質の測り方と職場への配置の偶然性をどう確保したかが、因果の解釈の強さを左右する。", "fun": "優秀な先輩がいる職場は、学べることが多い一方で、昇進の椅子を取り合うライバルも強くなる。この研究は、同じ職種の人（ライバル）と違う職種の人（ライバルでない）を分けることで、「学び」と「競争」の効果がほぼ同じ大きさで打ち消し合っていることを示した。良い環境が必ずしも得とは限らないという点が面白い。", "unverified": "本文を入手できず、データの国と規模、同僚の質の指標、推定値の大きさは確認できなかった。"}, "citescore": 19.6, "citescore_year": "2025"}, {"rank": 7, "field": "経営学", "headline": "物言う株主の企業は同じ仕事に低い給与", "title": "More Monitoring, Less Pay: Active Ownership and Employee Compensation", "url": "https://doi.org/10.1287/mnsc.2024.08553", "authors": "Claudine Gartenberg ほか", "venue": "Management Science", "sjr": 6.428, "date": "2026-10-01", "why": "ヘッジファンドやプライベート・エクイティが所有する企業が、比較可能な仕事に他の所有者より低い賃金を払うかを詳細な報酬データで検証した。", "id": "jn07", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ヘッジファンドやプライベート・エクイティなどの「物言う所有者」を持つ企業は、同じ年・地域・職種・技能水準の比較可能な仕事に対し、他の企業より2〜4%低い報酬を払っていることを、2,000万件超の従業員記録で示した（抄録）。", "p2": "物言う所有者は人員の再編や賃金の伸びの鈍化で全体の報酬を下げることが知られていたが、同じ仕事に対する支払いそのものが違うかは調べられていなかった（抄録）。", "p3": "米国の896社・2,000万件超の詳細な報酬記録で、年・地域・職種・技能水準を固定した狭い労働市場の中で、所有者の種類による賃金の差を比べた（抄録）。差の一部が所有者による処置効果を反映するかを検討し、監視しやすい仕事かどうかで効果を分けた（抄録）。識別の詳細は未確認（本文を入手できず）。", "p4": "比較可能な仕事の報酬差を、基本給と成果給に分け、定型的な仕事、成果が数量化できる仕事、知識集約度の低い産業などの監視しやすさで比べた（抄録）。", "p5": "物言う所有者の企業は比較可能な仕事に2〜4%低い報酬を払い、差は基本給の低さと成果給のフラット化の両方に表れ、少なくとも一部は所有者による処置効果を反映していた（抄録）。差は定型的な仕事、成果を数量化できる仕事、知識集約度の低い産業など、監視しやすい文脈に集中していた（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、物言う所有者が報酬による誘因を管理による監督で置き換えている可能性を示し、仕事が測りやすくなるほど所有者が従業員の処遇を左右しうると述べる（抄録）。", "fun": "同じ地域で同じ職種・同じ技能の人でも、会社の持ち主が「物言う投資家」だと給料が2〜4%低かった。しかもその差は、働きぶりを数字で監視しやすい仕事ほど大きかった。給料でやる気を引き出す代わりに、監視で働かせる、という置き換えが起きているらしいという解釈が面白い。", "unverified": "本文を入手できず、所有者の変化を使った推定の設計、効果の信頼区間、データの出所は確認できなかった。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 8, "field": "経営学", "headline": "政府が生態系を束ねて大事業を急ぐ方法", "title": "Government as orchestrator: Ecosystem transformation at scale and speed", "url": "https://doi.org/10.1002/smj.70129", "authors": "Ron Adner", "venue": "Strategic Management Journal", "sjr": 10.154, "date": "2026-10-01", "why": "大きな社会課題を官民の多数の主体の整合の問題ととらえ、政府が独自の能力で生態系を束ねて規模と速度を実現する方法を分析した。", "id": "jn08", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国政府の新型コロナワクチン開発事業「オペレーション・ワープ・スピード」を事例に、政府が多数の官民の主体を束ねて大規模な課題を速く解決する「生態系のオーケストレーション」の仕組みを理論化した（抄録）。", "p2": "大きな社会課題は、互いに依存する多数の官民の主体の貢献をそろえなければ達成できない「生態系の課題」だが、政府が独自の能力でそれをどう実現するかは十分に分析されていなかった（抄録）。", "p3": "生態系を構造として捉える分析の枠組み（ecosystem-as-structure）を用い、オペレーション・ワープ・スピードの事例から生態系の変革の仕組みと動態を引き出した（抄録）。事例研究の資料の種類は未確認（本文を入手できず）。", "p4": "事例の分析から、調整の様式、調整のための専用組織の設計、外部の生態系と組織内部の再編のつながり、調整能力の制約を検討した（抄録）。", "p5": "階層・強制・市場の信号とは異なる調整の様式として「調整的な命令（coordinative fiat）」を導入し、目的に特化した調整組織の設計上の選択、外部の生態系の調整と調整者自身の内部の再編の結びつき、調整能力が生態系戦略の主要な制約であることを示した（抄録）。著者はこれらを指導者への4つの教訓としてまとめ、民間の取組みにも当てはまると述べる（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：危機下の単一の事例に基づく理論化で、平時の課題や他の政策領域で同じ仕組みが機能するかは今後の検証が要る。", "fun": "コロナワクチンを1年足らずで届けた米国の計画では、政府が製薬会社や工場、物流会社を命令でも契約の値段でもない独特のやり方で同じ方向に動かした。著者はそれを「調整的な命令」と名づけた。バラバラの会社をオーケストラのように合奏させる指揮者の役割を、政府が果たせる条件を描いた点が面白い。", "unverified": "本文を入手できず、事例の資料と分析の手順、4つの教訓の具体的な内容の詳細は確認できなかった。"}, "citescore": 17.2, "citescore_year": "2025"}, {"rank": 9, "field": "因果推論", "headline": "ロボット膝関節置換を登録データで模擬試験", "title": "Early national comparison of robotic versus conventional knee replacements for arthritis using National Joint Registry data: target trial emulation study", "url": "https://doi.org/10.1136/bmj-2026-100691", "authors": "Hasan R Mohammad ほか", "venue": "BMJ", "date": "2026-10-01", "why": "約70万件の人工膝関節置換の全国登録データで標的試験模倣を行い、ロボット支援手術の早期成績を従来法と比べた。", "id": "jn09", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "英国の全国人工関節登録の約70万件の人工膝関節置換術で、標的試験模倣（観察データで仮想の無作為化試験を設計どおりに再現する方法）を行い、ロボット支援手術と従来法の早期成績に差が見られないことを示した（抄録）。", "p2": "ロボット支援の人工膝関節置換は導入が進んでいるが、資本と手術の費用が大きく、公的医療で使うに見合う成績の差があるかの全国規模の比較は乏しかった（抄録）。", "p3": "2018〜2024年の英国（イングランド・ウェールズ・北アイルランドなど）の全国人工関節登録の697,145件（従来法675,034件、ロボット22,111件）を使い、全置換（TKR）と単顆置換（UKR）のそれぞれで、標的試験模倣の枠組みで傾向スコア・マッチングを行い、処置群での平均処置効果を推定した（抄録）。生存はKaplan-Meier法とCox回帰で比べた。", "p4": "主要評価項目は5年のインプラント生存（平均追跡2.5年）で、全原因の再置換リスク、原因別の再置換リスク、術中合併症、再置換の複雑さを比べた（抄録）。", "p5": "マッチング後の5年インプラント生存はTKRで従来法98.5%（95%信頼区間98.3〜98.7%）、ロボット98.6%（98.2〜99.0%）で、再置換リスクに差はなかった（ハザード比1.03、95%信頼区間0.86〜1.26）（抄録）。UKRでも97.8%対96.4%で差はなく（ハザード比1.03、0.75〜1.42）、原因別の再置換と術中合併症にも差はなかった（抄録）。", "p6": "著者は、観察研究のため測定されない交絡や残差交絡の可能性を排除できないと認めている（抄録）。解釈：追跡は平均2.5年と短く、ロボット支援の利点が長期の再置換や機能の改善に表れる可能性は、この研究では評価されていない。", "fun": "最新のロボットで膝の人工関節の手術をすると、本当に長持ちするのか。70万件もの手術記録を、まるで本物のくじ引き実験のように条件をそろえて比べたところ、5年後に入れ直しが必要になる割合はロボットでも従来の手術でもほとんど同じだった。高い機械が必ずしも良い結果を生むとは限らない、という確かめ方が面白い。", "unverified": "本文を入手できず、マッチングに使った変数、感度分析、費用の比較は確認できなかった。"}, "citescore": 8.9, "citescore_year": "2025"}, {"rank": 10, "field": "統計学", "headline": "平均も分散も無限の重い裾でのテイラー則", "title": "Generalized Taylor’s law for infinite-mean heavy-tailed data under dependence and heterogeneity", "url": "https://doi.org/10.1073/pnas.2611888123", "authors": "Pok Him Cheng ほか", "venue": "Proceedings of the National Academy of Sciences", "sjr": 3.283, "date": "2026-10-01", "why": "分散が平均のべき乗に比例するというテイラー則を、平均も分散も無限の重い裾の分布へ依存と異質性込みで一般化した。", "id": "jn10", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "標本の分散が平均のべき乗に比例するという経験則「テイラーの法則」を、平均も分散も無限の重い裾の分布について、独立同分布の仮定を外し、依存と異質性がある場合に一般化して、確率的な極限と収束の速さを導いた（抄録）。", "p2": "テイラーの法則（物理学では揺らぎのスケーリング、統計学ではべき乗の分散関数）は生態学・物理学・金融・疫学で広く観察されるが、重い裾の場合の理論は観測値が独立同分布であることを前提にしていた（抄録）。", "p3": "平均と分散が無限になる重い裾の分布について、一般化したテイラーの法則の確率的な極限を確立し、収束の速さを分析した（抄録）。独立同分布の仮定を緩め、観測値の依存と異質性を許した（抄録）。証明の手法は未確認（本文を入手できず）。", "p4": "理論の結果を大規模なシミュレーションで裏づけ、実際のネットワークのデータへの応用で実用性を示した（抄録）。比較の指標と対象のデータは未確認。", "p5": "依存と異質性を許す一般化により、テイラーの法則を依存のある時系列やネットワーク構造のデータに適用できるようになった（抄録）。数値的な結果は未確認（本文を入手できず）。", "p6": "限界は未確認（本文を入手できず）。解釈：依存の構造に課した条件の強さによって、実データでの適用の範囲が決まるため、その条件を本文で確かめる必要がある。", "fun": "動物の数を地域ごとに数えると、平均が多い場所ほどばらつきも大きく、そのばらつきは平均の何乗かに比例するという不思議な決まりが、生き物から株価まで多くの分野で見られる。この論文は、平均さえ定まらないほど極端な値が出るデータでも、つながり合ったデータでも、その決まりが数学的に成り立つ形を示した。", "unverified": "本文を入手できず、定理の条件、収束の速さ、適用したネットワークのデータの内容は確認できなかった。"}, "citescore": 14.7, "citescore_year": "2025"}, {"rank": 11, "field": "機械学習", "headline": "遺伝子摂動の深層モデルは指標次第で勝つ", "title": "Deep learning perturbation models can outperform baselines on calibrated metrics", "url": "https://doi.org/10.1038/s41587-026-03307-w", "authors": "Henry E. Miller ほか", "venue": "Nature Biotechnology", "sjr": 23.109, "date": "2026-10-01", "why": "深層学習の遺伝子摂動モデルが単純な基準に勝てないという報告が、評価指標の較正不足によることを14データ・18指標で示した。", "id": "jn11", "explain": {"basis": "本文", "basis_note": "Nature Biotechnologyの出版社サイトのHTML本文（Main、図1の説明、モデル比較、下流課題の節）を読んだ。Methodsは見出しの範囲", "preprint": false, "p1": "遺伝子の摂動（ノックダウンなど）による遺伝子発現の変化を予測する深層学習モデルは「平均を出すだけの基準に勝てない」と言われてきたが、それは評価指標の較正不足によるもので、較正の良い指標で測れば深層学習が基準を上回ることを、14データセット・18指標で示した。", "p2": "複数の比較研究で、訓練データの摂動後の平均を返すだけの「平均基準」が最先端モデルに並ぶか上回るとされた（Main）。その原因として、対照細胞との系統差が相関指標を膨らませる「対照バイアス」と、少数の変動遺伝子の信号が全遺伝子の誤差に薄められる「信号の希釈」があり、そもそも指標が良い予測と無情報な予測を見分けられるかが確かめられていなかった。", "p3": "同じ摂動の細胞を半分に分けて片方で他方を予測する「技術的重複」と平均基準を、遺伝子ごとの差次的発現のp値で混ぜた「補間重複」を陽性対照、平均基準を陰性対照とした（図1a–b）。指標mごとに「陽性と陰性の差」が「理想と陰性の差」の何割かを測る較正の尺度DRF（式1）を定義した。例：Replogle22 K562では摂動あたりの差次的発現遺伝子は平均3.25個しかなく、平均二乗誤差（MSE）のDRFはほぼゼロになる。", "p4": "14データセットで18指標のDRFを比べ、較正の良い指標（重み付きMSE、重み付きR²、正規化逆順位など）で、scGPT・GEARS・PRESAGE・scLambda・CellFlowなどのモデルを平均基準・対照基準・加法基準と比べた（Main、図1d–e）。経路の回復と近傍構造の回復という下流課題との一致も見た。", "p5": "MSEや対照基準との相関（Pearson Δctrl）は、摂動の強いNorman19以外では較正が悪く、重み付きや順位に基づく指標は一貫して較正が良かった（図1e）。較正の良い指標では多くのモデルが無情報な基準を上回り、組合せ予測ではWessels23でPRESAGEが加法基準を18指標中15で上回った（Main）。較正の良い指標の順位は経路の回復の順位と相関した（Replogle22 K562でρavg=0.76、Wessels23で0.84）。", "p6": "著者は、データセット間の性能差は主に課題の難しさを反映し、較正の良い単一の指標を決定的とみなすべきではないと注意し、Norman19は加法基準で飽和しているため組合せ予測の唯一のベンチマークにすべきでないと勧める（Main）。残る疑問：陽性対照もデータから作るため、陽性対照の作り方への依存は残る（補足ノート2で一部検討）。", "fun": "「AIは平均値を答えるだけの手抜き予測に勝てない」という報告が続いていたが、実はテストの採点方法が悪く、本当に実力のある予測と手抜きを見分けられていなかった。著者は「満点に近い答え」と「手抜きの答え」を両方用意して、その差がきちんと点数に出るかで採点方法そのものを検査した。物差しを先に検定するという発想が面白い。", "unverified": "補足表2の各モデル・各データの数値と、補足ノートの感度分析の詳細は確認していない。"}, "citescore": 66.4, "citescore_year": "2025"}, {"rank": 12, "field": "行動科学", "headline": "利己的な人ほど自分の選択の効果を盛る", "title": "Selfish and prosocial individuals both distort their actions’ impact, but selfish distortions can be more contagious", "url": "https://doi.org/10.1038/s41562-026-02585-3", "authors": "Marius C. Vollberg ほか", "venue": "Nature Human Behaviour", "sjr": 4.896, "date": "2026-10-01", "why": "9つの事前登録実験（8,769人）で、人が行動の社会的影響の曖昧さを利用して自分をよく見せ、その歪みが他者に伝わることを示した。", "id": "jn12", "explain": {"basis": "本文", "basis_note": "Nature Human Behaviourの出版社サイトのHTML本文（結果の主要な節、伝染の実験、限界）を読んだ。方法の各実験の詳細は見出しの範囲", "preprint": false, "p1": "自分の行動が他人に与える影響があいまいなとき、利己的な人も向社会的な人も、自分の選択をよく見せる方向に影響の見積もりを歪め、しかも利己的な歪みは他人に伝染してその人をより利己的にすることを、9つの事前登録実験（8,769人）で示した（抄録）。", "p2": "人は自分の行動の社会的な結果を正確には知らないまま行動することが多いが、そのあいまいさを利用して自分を良く見せるために結果の解釈を歪めるのか、歪みが他人の判断にどう伝わるのかは明らかでなかった（Main）。", "p3": "決定者は、自分が7点得る選択肢A（相手の受取は1〜3点のどれか）と、自分が5点得る選択肢B（相手は3〜5点のどれか）のどちらかを選び、その後で相手の受取を見積もる（Results、図1a）。自分の得は確実だが相手への影響は幅しか分からないという、現実の社会的決定の不均衡を再現している。見積もりが範囲の中点や他の群からどれだけずれるかを歪みとして測った。", "p4": "利己的な選択者（A）と向社会的な選択者（B）、両方の利益が一致する中立条件の見積もりを比べ、選択前の見積もり、強制された選択、明示的なあいまいさの説明でも同じ歪みが出るかを確かめた（Results）。実験6では、前の参加者（影響者）の見積もりを見せる4条件を比べ、追随者の見積もりと選択が変わるかを測った。", "p5": "利己的な選択者は2つの選択肢の相手への影響を、向社会的な選択者よりも似たものとして報告した（実験1a：b=0.24、95%信頼区間0.14〜0.34）（図1c）。向社会的な選択者は自分の選択を比較的より有益と描き、暗黙の自己犠牲も誇張したが、それほど一貫しなかった（抄録）。歪みは選択前や選択を強制した場合にも見られ、正当化だけでは説明できなかった。利己的な方向の歪みを見せられた追随者はより利己的になった（実験6：b=0.49、0.10〜0.88）が、向社会的な歪みには同様の影響は見られなかった（抄録、Results）。", "p6": "著者は、範囲の中点からのずれを歪みとみなすのは一様分布を仮定した場合に限られること、抽象的な課題で現実の場面への外挿に限界があること、「利己的」「向社会的」は動機ではなく利得の構造を指すこと、評価が信頼性のみであること、主に米国の英語話者の標本であることを限界に挙げる（Limitations）。", "fun": "自分が多めにもらう選択をした人は「相手の取り分はどっちを選んでも大差ないよ」と見積もり、自分が損を引き受けた人は「相手のためになった」と見積もる。どちらも自分を良く見せる方向に世界の見え方を曲げていた。しかも「どっちでも大差ない」という言い訳は他の人にうつり、その人まで自分勝手にしてしまう、という点が考えさせられる。", "unverified": "実験2〜5の各推定値と、信頼性の評価（実験5）の詳細な結果は確認していない。"}, "citescore": 23.7, "citescore_year": "2025"}, {"rank": 13, "field": "経営学", "headline": "原告の匿名化で和解と訴訟はどう変わったか", "title": "Does Privacy Matter? Evidence from a Legal Reform", "url": "https://doi.org/10.1287/mnsc.2025.00107", "authors": "Liran Einav ほか", "venue": "Management Science", "sjr": 6.428, "date": "2026-10-01", "why": "人身傷害訴訟の判決で原告を匿名化した法改正を利用し、プライバシーの喪失が和解の判断に与える影響を推定した。", "id": "jn13", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "イスラエルで人身傷害訴訟の判決で原告を匿名化した2015年8月の法改正を利用し、プライバシーの喪失を避けるために人々がどれだけの金銭的な代償を払っていたかを、和解金の変化から推定した（抄録）。", "p2": "改正前は、和解の申し出を断って裁判に進むと、判決で健康や収入などの機微な情報が公開される危険があった（抄録）。プライバシーへの配慮が現実の交渉の結果にどれだけ影響するかは、実証的に測りにくかった。", "p3": "2011〜2020年にイスラエルの大手保険会社が扱った自動車事故の請求で、改正の影響を受ける人身傷害の支払いと、影響を受けない物損の支払いを比べる差の差分法で推定した（抄録）。解釈：物損は改正の前後でプライバシーの条件が変わらないので、両者の変化の差を改正の効果とみなせる。", "p4": "改正前後の人身傷害と物損の請求に対する支払額の変化を比べた（抄録）。標本規模と統制変数は未確認（本文を入手できず）。", "p5": "改正により人身傷害の請求に対する支払いは12〜17%増えた（抄録）。著者はこれを、原告が判決による私的情報の公開を避けるために、以前は低い和解金という形で負担していた暗黙の費用と解釈する（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、機微な情報が関わる顧客とのやりとりでのプライバシーの重要性を示すと述べる（抄録）。解釈：改正と同時期に人身傷害の請求に特有の他の変化がなかったかが、差の差分法の仮定の要になる。", "fun": "事故の損害賠償で裁判に進むと、判決文に自分の病気や収入が載ってしまう。そこで人々は、本来より安い和解金でがまんしていたらしい。判決で名前を伏せる法改正の後、和解金は12〜17%上がった。プライバシーにはっきり値段がついていたことを、自然の実験から測った点が面白い。", "unverified": "本文を入手できず、標本の件数、平行トレンドの確認、推定の頑健性は確認できなかった。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 14, "field": "計算社会科学・ネットワーク科学", "headline": "船舶位置データで紛争海域の寄港機会を推定", "title": "AIS-derived port-calling opportunity modelling in conflict-affected waters", "url": "https://doi.org/10.1140/epjds/s13688-026-00699-2", "authors": "Michael van Ginkel", "venue": "EPJ Data Science", "date": "2026-10-01", "why": "船舶自動識別装置の長い欠測がある紛争海域で、航跡データから寄港の機会をモデル化して異常な船舶行動を検出する方法を示した。", "id": "jn14", "explain": {"basis": "抄録", "basis_note": "出版社サイトのページを取得したが本文の大部分は含まれておらず（データの入手方法・略語・謝辞など）、抄録の範囲で書いた", "preprint": false, "p1": "紛争下の黒海東部で、船舶自動識別装置（AIS）の信号が長く途切れる船の航跡から、その間に寄港した可能性を推定するモデル（DPCOM）を作り、異常の集中地点と結びつけて、信号の消失の繰り返しパターンを特定した（抄録）。", "p2": "ジョージアのアブハジアやウクライナ東部の占領地域をめぐる長期の紛争で、黒海の海上の運航環境は複雑になっている（抄録）。そこでは船がAISの発信を長時間止めると動きが見えなくなり、異常な船舶行動の検出が難しかった。", "p3": "2018年の黒海東部の2,700万件超のAIS信号を使い、長い信号の空白に関連して寄港がありえた機会を見つける離散的な寄港機会モデル（DPCOM）と、格子に基づく統計的な枠組みを組み合わせ、その空間分布を評価した（抄録）。解釈：信号が消えた地点と再び現れた地点、その間の時間から、その間にどの港に寄れたかを推定する考え方である。", "p4": "DPCOMで選ばれた航跡が、統計的に有意な異常の集中地点（ホットスポット）とどれだけ結びつくかを評価した（抄録）。比較の対象や指標の詳細は未確認（本文を入手できず）。", "p5": "DPCOMが選んだ航跡は統計的に有意な異常のホットスポットと強く結びつき、AIS信号の消失の繰り返しのパターンが特定された（抄録）。数値の詳細は未確認。", "p6": "限界は未確認（本文を入手できず）。著者は、長いAISの空白を分析する再現可能な枠組みを示し、紛争下の沿岸域の海洋状況把握への大規模な行動分析の価値を強調する（抄録）。解釈：信号の空白が寄港による制裁回避なのか、受信範囲の問題なのかの区別には外部の検証情報が要る。", "fun": "船は位置を知らせる電波（AIS）を出す決まりがあるが、紛争地の近くではわざと電波を消す船がいる。消えた場所と再び現れた場所、その間の時間から「この間にどこかの港に寄れたはずだ」と推理し、怪しい動きが集まる海域を地図に浮かび上がらせた。見えない航海を、見えている部分から推理する探偵のような分析が面白い。", "unverified": "本文を入手できず、DPCOMの定義、ホットスポットの検定方法、結果の数値は確認できなかった。"}, "citescore": 5.3, "citescore_year": "2025"}, {"rank": 15, "field": "経済学", "headline": "徴兵による人手不足が産業革命の機械化を促した", "title": "Fighting for Growth: Labor Scarcity and Technological Progress during the British Industrial Revolution", "url": "https://doi.org/10.1257/aer.20240393", "authors": "Hans-Joachim Voth ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "ナポレオン戦争期の海軍徴募を操作変数に、労働力不足が省力化機械の導入を促したことを産業革命期のイングランドで示した。", "id": "jn15", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ナポレオン戦争期の英国で、徴募による労働力不足が省力化の機械の導入を促したことを、軍艦の沿岸への接近のしやすさを操作変数にして因果的に示した（抄録）。", "p2": "労働の希少さが省力化技術の採用を促し、産業革命を後押ししたという仮説は古くからあるが、労働の希少さの外生的な変動を見つけにくく、因果の検証が難しかった（抄録）。", "p3": "ナポレオン戦争期には男性人口の10%超が軍に従事し、地域によって徴募の強さが異なった（抄録）。海軍の徴募を、軍艦が沿岸に近づけるかどうかで操作変数にして、労働力不足と機械の採用の関係を推定した（抄録）。解釈：軍艦が寄れる沿岸かどうかは、その地域の産業の事情とは無関係に徴募の強さを左右したと考えられる。", "p4": "徴募の強い地域と弱い地域で、労働を節約する機械の採用の多さを比べ、機械の技能が豊富な地域で効果が大きいかを調べた（抄録）。データの出所は未確認（本文を入手できず）。", "p5": "徴募が多かった地域ほど労働を節約する機械が多く採用され、操作変数による推定も、労働力不足と採用の関係が因果的であることを示唆した（抄録）。機械の技能が豊富な地域では、労働力不足が採用に与える影響が大きかった（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：軍艦の接近のしやすさが、港や交易を通じて徴募以外の経路で機械化に影響していないかという除外制約が、結論の要になる。", "fun": "約200年前、ナポレオンとの戦争で英国の男性の1割以上が兵隊にとられた。人手が足りなくなった地域ほど、人の代わりに働く機械を多く入れていた。しかも軍艦が近づける海岸かどうか、という地理の偶然を使って因果関係を確かめた。戦争が産業革命を後押しした、という意外なつながりが面白い。", "unverified": "本文を入手できず、機械の採用の測り方、推定値の大きさ、除外制約の検討は確認できなかった。"}, "citescore": 19.6, "citescore_year": "2025"}, {"rank": 16, "field": "経済学", "headline": "価格と品質で同時に差別する独占の消費者余剰", "title": "Screening and Segmenting: A Consumer Surplus Perspective", "url": "https://doi.org/10.1257/aer.20250206", "authors": "Dirk Bergemann ほか", "venue": "American Economic Review", "sjr": 23.489, "date": "2026-10-01", "why": "第2種と第3種の価格差別を同時に行う独占企業について、消費者に最適な市場分割の構造を特徴づけた。", "id": "jn16", "citescore": 19.6, "citesc       LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
