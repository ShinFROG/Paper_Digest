 Assistance Programs Serve the Majority of Low-income, Homebound Older Adults, Yet Food Insecurity Remains", "url": "https://doi.org/10.1093/haschl/qxag260", "authors": "Yiqing Qian ほか", "venue": "Health Affairs Scholar", "date": "2026-09-30", "sjr": 1.675, "citescore": 2.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の全国データで、外出困難な低所得の高齢者の半数以上が食料支援（SNAPかミールズ・オン・ホイールズ）を受けているが、受給者の36.4%はなお食料不安を抱えていることを示した（抄録）。", "p3": "全国健康加齢動向調査（NHATS）第13回の65歳以上のメディケア受給者から、SNAPの所得要件を満たす在宅で外出困難な1,091人を選び、2つの支援の利用と食料不安を分析した（抄録）。", "p5": "55.5%（全国で218万人に相当）が少なくとも一つを利用し、SNAPのみ35.1%、配食のみ10.9%、両方9.4%だった（抄録）。非受給者は175万人で、その24.0%が食料不安、21.8%が独居で、食料不安のある非受給者は機能的な依存が多く独居が多かった（抄録）。", "fun": "家から出られない貧しいお年寄りの半分以上は、食料の支援を受けていた。それでも3人に1人以上がまだ食べ物に困っていた。支援が「届いていること」と「足りていること」は別だと、数字ではっきり示した点が考えさせられる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "樹冠と建物密度が高齢者の暑熱死を左右", "title": "Neighborhood Tree Canopy Coverage and Building Fraction as Modifiers for Heat-related Mortality among Older Adults in Sweden's Largest Urban Areas", "url": "https://doi.org/10.1007/s11524-026-01146-3", "authors": "Jessika Lönn ほか", "venue": "Journal of Urban Health", "date": "2026-10-01", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "スウェーデンの3大都市圏で、住む地域の樹冠の被覆率が低く建物の占める割合が高いほど、65歳以上の暑さによる死亡が多い傾向があることを示した（抄録）。", "p3": "2006〜2019年のストックホルム・ヨーテボリ・マルメで、日最高気温を曝露とし、0〜4日の遅れを含む分布ラグ非線形モデル（DLNM）で日々の全死亡を分析し、樹冠被覆率（TCC）と建物率（BF）の高低で分けて比べた（抄録）。", "p5": "最小死亡気温と比べ、99パーセンタイル（28.1〜29.0 °C）で死亡は15〜17%、30 °Cで24〜32%増えた（抄録）。樹冠の少ない地域・建物の多い地域ほど暑さ関連の死亡が高い傾向があり、相対リスクの差はTCCで4〜21%、BFで0〜22%だった（抄録）。", "fun": "夏の暑い日に亡くなる高齢者は、木が少なく建物が密集した地域でより多い傾向があった。北欧のように涼しい国でも、30 °Cで死亡が24〜32%増える。木陰の多さという誰にでも分かる指標で、暑さから人を守る街づくりの優先地域を示せる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "人流データで薬局へのアクセス格差を測る", "title": "Census Block Group Demographics, Mobility Patterns, and Pharmacy Visits", "url": "https://doi.org/10.1001/jamanetworkopen.2026.37087", "authors": "Elaine O. Nsoesie ほか", "venue": "JAMA Network Open", "date": "2026-10-01", "sjr": 3.507, "citescore": 14.3, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の都市部の112,655の国勢調査街区グループで、人種的少数派が多い地域ほど薬局がない確率が高く、住民は多様な地域の薬局を訪れていることを、携帯電話の人流データで示した（抄録）。", "p3": "2019〜2020年（パンデミック前）と2023〜2024年（後）の携帯電話の移動データと、2019年米国コミュニティ調査の人口構成を結び、薬局の有無と人口1万人あたりの薬局数、訪問先の構成をロジスティック回帰と線形回帰で分析した（抄録）。", "p5": "少数派が多い・多様な街区は、白人が多い街区より薬局を1つ以上持つオッズが低く（前0.44、後0.84）、白人が多い街区は1万人あたりの薬局が15%多かった（抄録）。白人が多い街区の端末は似た構成の街区の薬局を訪れ、他の街区の端末は多様な街区の薬局を訪れていた（抄録）。", "fun": "近所に薬局がない地域の人は、どこで薬を買っているのか。携帯電話の位置データで追うと、少数派の多い地域の人は遠くの多様な地域の薬局まで出かけていた。「薬局砂漠」という地図上の空白が、人の移動という形で見える点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "AI利用を明かす医師は温かみで損をする", "title": "Influence of physician and consumer demographics on AI-use penalties in primary care: a vignette-based study", "url": "https://doi.org/10.1038/s41746-026-03361-3", "authors": "Moritz Reis ほか", "venue": "npj Digital Medicine", "date": "2026-10-01", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "かかりつけ医がAIの利用を明らかにすると、温かさと能力の評価が下がり受診意向が減る「AI利用のペナルティ」が、医師の属性にはあまり左右されず、若い回答者で強いことを示した（抄録）。", "p3": "1,030人の参加者に、AIの利用（使う・使わない）と医師の属性を変えた架空のかかりつけ医の広告を評価させるビネット実験を行った（抄録）。", "p5": "AIを使うと述べた医師は、使わないと述べた医師より温かさと能力が低く評価され、予約の意向も下がった（抄録）。効果は若い参加者で強かったが、医師の属性にはおおむね左右されなかった（抄録）。", "fun": "「当院はAIを活用しています」と書いた医者の広告は、「AIは使いません」と書いた広告より、冷たく頼りなく見られ、予約したいと思われにくかった。しかもAIに慣れているはずの若い人ほど、その傾向が強かった。便利な道具の宣伝が、かえって信頼を下げるという逆説が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "擬人化AIアバターが利用意向を高める条件", "title": "When and how anthropomorphic AI avatars relate to user engagement intentions: roles of emotional connection, perceived authenticity and technological familiarity", "url": "https://doi.org/10.1108/jrim-01-2026-0017", "authors": "Usman Ahmad Qadri ほか", "venue": "Journal of Research in Interactive Marketing", "date": "2026-10-01", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "人間らしい見た目のAI接客アバターが利用意向を高める仕組みとして、感情的なつながりは意味のある、しかし部分的な経路であり、真正性の知覚と技術への慣れがその過程を条件づけることを示した（抄録）。", "p3": "研究1では見た目の擬人化の度合いを操作した被験者間実験、研究2ではオンライン買い物客の3波の調査を行い、媒介・調整・条件付き間接効果をPROCESS（5,000回のブートストラップ）で推定した（抄録）。", "p5": "研究1では擬人化が高いほど利用意向が高まり、感情的なつながりが効果の一部を説明した（抄録）。研究2でも中核の関係は支持されたが擬人化と感情的つながりの関連は比較的弱く、真正性の知覚は擬人化→つながりを、技術への慣れはつながり→利用意向を強めた（抄録）。", "fun": "ネット通販の接客AIを人間らしい見た目にすると、客は話しかけたくなる。その理由の一部は「親しみ」だが、全部ではなかった。本物らしさを感じる人ほど親しみが湧き、AIに慣れた人ほど親しみが行動につながる。人の心が段階ごとに違う条件で動く点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "権力格差の信念が乗り換え意向を変える", "title": "The impact of power distance belief on switching intention: the moderating role of social avoidance", "url": "https://doi.org/10.1108/apjml-02-2026-0299", "authors": "Qi An ほか", "venue": "Asia Pacific Journal of Marketing and Logistics", "date": "2026-09-30", "citescore": 9.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "権力格差の信念（上下関係を当然とみなす考え）が強い消費者ほど、サービスを乗り換える意向が低いことを示し、構造への欲求と手続き的な乗り換えコストを通じた仕組みを明らかにした（抄録）。", "p3": "研究1（120人）、研究2（150人）、研究3a（120人）、研究3b（中国120人・米国132人）の積み重ねた調査研究で、核となる変数を複数の方法で操作化し、直列の媒介と調整を検証した（抄録）。", "p5": "権力格差の信念と乗り換え意向の関連は3つの研究で支持され、構造への欲求と手続き的な乗り換えコストが直列に媒介し、社会的回避が構造への欲求の媒介効果を調整した（抄録）。効果の大きさは未確認。", "fun": "上下関係を大事にする考えの人ほど、今使っている携帯会社や銀行を変えにくい。その裏には「決まった秩序が好き」という気持ちと、「手続きが面倒」という感覚の連鎖があった。文化的な価値観が、顧客の乗り換えという身近な行動にまで表れる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "LLMで新聞記事から地すべりの日時と場所を抽出", "title": "AI-based procedure for extracting spatial and temporal information on rainfall-induced landslides from textual sources", "url": "https://doi.org/10.1007/s10346-026-02856-0", "authors": "Elisabetta Napolitano ほか", "venue": "Landslides", "date": "2026-10-01", "sjr": 1.778, "citescore": 12.5, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "大規模言語モデルとプロンプト設計で、文章資料から降雨による土砂災害の発生日時と位置を自動で抽出する手順AIDE4LANDを作り、専門家が手作業で作ったデータと87%で最大の一致を得た（抄録）。", "p3": "(i) 明示的な階層ルールで発生日時を復元して精度の段階を付け、(ii) 構造化した問い合わせとOpenStreetMapによる逆ジオコーディング（AnthropicのModel Context Protocol経由）で座標を決める2段階の手順。2011〜2025年の725の文章資料（イタリア語664、英語61）で2162回の試行を重ねて改良した（抄録）。", "p5": "専門家の手作業のデータと比べ、87%の事例で時刻と位置の割り当てが最大の一致だった（抄録）。カタログの更新を大きく速めると述べるが、所要時間の数値は抄録にない（未確認）。", "fun": "新聞記事などから「いつ・どこで」土砂崩れが起きたかを読み取る作業は大変で、人によって判断もぶれる。この研究はAIに決まったルールで読み取らせ、専門家の答えと87%で完全に一致した。災害の記録づくりをAIが手伝う具体例として面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "多エージェントLLMで行動記録の誤りを直す", "title": "Feasibility of Using a Multi-Agent LLM System to Correct Annotations and Support Low-Effort Activity Labeling", "url": "https://doi.org/10.1145/3831653", "authors": "Ha Le ほか", "venue": "Proceedings of the ACM on Interactive Mobile Wearable and Ubiquitous Technologies", "date": "2026-09-30", "citescore": 10.2, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "受動センシングのデータと参加者の自己報告を突き合わせ、行動の記録（アノテーション）の誤りを見つけて直す多エージェントLLMシステムGLOSS4HARを提案した（抄録）。", "p3": "人の意味づけ（センスメイキング）をまねる複数のLLMエージェントが、(1) 参加者の自己記録の修正と整合、(2) 受動センシングと軽い自己報告を組み合わせた活動の時系列の再構成、の2つの課題を行う（抄録）。", "p5": "記録の質をF1で最大9.9%改善し、人手の記録とF1で75〜92%一致する活動の時系列を再構成できた（抄録）。使ったデータセットと参加者数は抄録にない（未確認）。", "fun": "「何時から何時まで運動した」という自己申告は、意外と不正確になりがちだ。スマホやセンサーの記録をもとにAI同士で食い違いを見つけて直すと、人が丁寧に付けた記録と75〜92%一致した。データを整える地味な作業をAIのチームが手伝う発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "AIが人間の語りと集団の合意をどう形づくるか", "title": "How Artificial Intelligence Shapes Human Narratives", "url": "https://doi.org/10.1177/0261927x261493082", "authors": "J. Hunter Priniski", "venue": "Journal of Language and Social Psychology", "date": "2026-10-01", "sjr": 0.814, "citescore": 4.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "AIが人の問題解決・創造性・集団での作業をどう支えるべきかを、「物語のエージェンシー（narrative agency）」という心理学的な枠組みで論じた理論的な論文（抄録）。", "p3": "人の集団がデジタルの場で物語から学び、物語を伝え、影響し合う過程を定式化する枠組みを示し、作文の改善からオンラインでの合意形成までの例で、AIが人の成果に与える影響を論じた（抄録）。実証データは抄録に示されていない（未確認）。", "p5": "AIの出力は人の物語のエージェンシーを経て初めて世界に変化を起こすため、それを保つように人とAIのシステムを設計することが、人とAIの整合（アライメント）に欠かせないと結論づけた（抄録）。", "fun": "AIが書いた文章も、それを読んで自分の言葉にし、人に伝えるのは人間だ。この論文は、AIの影響は必ず「人が自分の物語として語る力」を通って現れると考える。AIに任せきりにせず、人が語り手であり続けられる設計が大事だという視点が新鮮だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "スマホ時代の歩行者は街をどこで見ているか", "title": "From Horizon to Hand: Reconfiguring the Human Visual Field in the Age of Smartphones", "url": "https://doi.org/10.3390/buildings16193909", "authors": "Jacqueline McIntosh ほか", "venue": "Buildings", "date": "2026-10-01", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "10都市の街歩き動画から歩行者657人の視線を記録し、スマホ時代の歩行者は下を向いていることが最も多く、端末を使う人ではその傾向がさらに強いことを示した（抄録）。", "p3": "路上の街歩き動画を系統的に抽出し、視線の向き、端末の使用、端末の持ち方と身ぶり、移動の状態、同行者の人数を符号化して、同じ場面の中での比較と混合効果モデルで分析した観察的・横断的な研究（抄録）。", "p5": "下向きの視線は歩行中の50.3%、立ち止まり中の42.1%で最も多かった（抄録）。同じ画面内で端末利用者の71.6%、非利用者の47.5%が下向きで、差は24.1ポイントだった。胸の高さで持つと69.4%が下向きで、同行者がいると減る傾向は統計的に区別できなかった（抄録）。", "fun": "街を歩く人の半分は、建物や景色ではなく下を見て歩いていた。スマホを使っている人では7割を超える。建物の正面や遠くの目印より、足元の地面のデザインが大事になっているのかもしれない。動画の中の人を数えるだけで、街づくりの前提を問い直す点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "住民参加型センシングは統治を良くしたか", "title": "Carbon Costs Without Governance Gains: Assessing Digital Participatory Sensing in Algeria’s New Towns", "url": "https://doi.org/10.17645/up.12604", "authors": "Badr-Eddine BOUMALI ほか", "venue": "Urban Planning", "date": "2026-09-30", "citescore": 3.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "アルジェリアの3都市でのデジタル参加型センシングは炭素の排出を伴う一方、都市計画にはほとんど使われず、参加も中心部に偏っていたことを示した（抄録）。", "p3": "コンスタンティーヌと2つのニュータウンで住民384人による6か月のセンシングの介入（位置つきの報告18,432件）を行い、帰属的な炭素会計、衛星画像のCNN分類、関係者25人への面接、計画文書1,182ページの分析を組み合わせた収斂的混合研究法で調べた（抄録）。", "p5": "介入は約1,247 kg CO2eを生み、アルジェリアの1世帯の年間電力消費に相当した（抄録）。計画文書は住民のデータを参照しておらず、関係者25人中23人は見たことがなかった。参加率は中心部の80%からシディ・アブデラの40%に下がり、60歳超は参加者の1.8%だった（抄録）。", "fun": "スマートシティの参加の仕組みで住民が18,432件の報告を送ったのに、行政の計画書は一つもそれを使っていなかった。しかも仕組みの運用で、1世帯が1年に使う電気ほどの二酸化炭素が出ていた。技術より先に制度を整えるべきだという結論が刺さる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "漏水検知の公開ベンチマークのラベルを監査", "title": "Hydraulically Motivated Feature Engineering and Spatial Ensemble Machine Learning: Smart-Water Leakage Detection and Spatial Prioritization", "url": "https://doi.org/10.3390/smartcities9100165", "authors": "Holger Manuel Benavides-Muñoz ほか", "venue": "Smart Cities", "date": "2026-10-01", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "広く使われているスマート水道の漏水検知ベンチマークを監査し、そのラベルが圧力と流量の2変数で完全に決まっており、高い精度は見かけにすぎないことを示した（抄録）。", "p3": "水理学的な特徴量を使うXGBoostを、空間的な成分を一つずつ除く交差検証（LOSCO）とfoldの中で閉じた前処理で評価し、特徴量の除去実験、200回のラベル置換検定、空間自己相関（Moran's I、Getis–Ord Gi*）、独立にラベル付けされたLeakDBでの検証を行った（抄録）。", "p5": "精度は99.88%（ROC-AUC = 0.9998）だったが、性能は2つのルール変数から作った3つの特徴量だけで説明され、残りの5つではROC-AUC = 0.494だった（抄録）。LeakDBではROC-AUC = 0.72〜0.79で、本当の漏水ノードを偶然より上位に置いた（p = 0.015）（抄録）。", "fun": "漏水を99.88%の精度で当てるAIと聞くと、すごそうに思える。ところが調べると、答えのラベル自体が2つの測定値から機械的に決まっていて、AIはその規則をなぞっていただけだった。みんなが使うデータほど、まず中身を疑うべきだと教えてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "責任投資家は統合報告の質を高めるか", "title": "From Finance to Impact: How Environmentally and Socially Responsible Investors Drive Integrated Reporting Globally", "url": "https://doi.org/10.1002/bse.71611", "authors": "Valentina Minutiello ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-01", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "184の統合報告書を分析し、持続可能性を重視する投資家がいる企業ほど、統合報告の質が高いことを示した（抄録）。", "p3": "統合報告書の質を、責任投資原則（PRI）の署名機関、長期の視点を持つ投資家、機関投資家という3種の投資家の存在と関連づけ、ステークホルダー理論と制度理論に照らして解釈した（抄録）。質の評価方法と推定モデルの詳細は抄録にない（未確認）。", "p5": "持続可能性を重視する投資家の存在は、報告書の質に正の効果を持つと報告した（抄録）。3種の投資家ごとの効果の大きさは未確認。", "fun": "企業が財務と環境・社会の取り組みをまとめて示す「統合報告書」は、出来がまちまちだ。184の報告書を調べると、環境や長期を重視する投資家が株主にいる会社ほど、中身の濃い報告書を出していた。株主の顔ぶれが会社の情報開示を変えるという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "環境と財務の成果の関係は産業ごとに違う", "title": "The Fading Premium: Environmental and Financial Performance Across Nordic Industries", "url": "https://doi.org/10.1002/bse.71627", "authors": "Ane C. H. Jensen ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-01", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "北欧の上場企業741社（2018〜2025年）で、環境と財務の成果の関係は業種によって大きく異なり、2021年までの排出の少ない企業のプレミアムはその後消えて、排出の多い企業の評価の割引だけが残ったことを示した（抄録）。", "p3": "741社のパネルで、業種、時期、企業の余裕資源、取り組みの実質（実際の削減か目標の発表か）がこの関係をどう条件づけるかを調べ、2021年以後の変化を形式的に検定した（抄録）。", "p5": "経済の大部分では排出と業績に共通の関係はなく、関係がある群は機械製造が主導した（抄録）。2018〜2021年は業種内で排出の少ない企業が会計上の収益と企業価値で上回り、その差は余裕のある企業に集中し、発表した目標ではなく測定された削減に伴っていた。2021年以後は市場全体のプレミアムが消えた（抄録）。", "fun": "「環境に良い会社はもうかるか」は何十年も決着しない問いだ。北欧の741社を見ると、答えは業種と時期で変わった。2021年までは排出の少ない会社が得をしたが、その後は先を行くご褒美が消え、遅れた会社への罰だけが残った。問いの立て方の大切さが分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "税務インボイスの取引網で中小企業の困窮を予測", "title": "Tax-Invoice Relation Modeling for Financial Distress Prediction in Small and Medium Industrial Enterprises", "url": "https://doi.org/10.64744/tjaet.2026.315", "authors": "Wei Tan ほか", "venue": "The Journal of Applied Engineering and Technologies", "date": "2026-10-01", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "財務諸表が不十分な中小の製造業でも、付加価値税の請求書から作る取引のネットワークと知識ルールを組み合わせれば、経営悪化をより早く予測できると報告した（抄録）。", "p3": "請求書、仕入先と顧客のつながり、品目の流れ、請求書の取消、納税の行動、地域の業種ラベルから企業間の取引グラフを作り、グラフニューラルネットワークでリスクの表現を学び、売上の縮小や取消の異常などから知識ルールで悪化の兆候を推論した（抄録）。", "p5": "74,200社、仕入先と顧客のつながり312万本、請求書1,860万件、40か月で確認された経営悪化13,700件のデータで、税比率によるスコアと比べ早期警告の時間の中央値が83日から32日になった（抄録）。9,740の解釈可能なリスクの連鎖を示し、全社の月次評価は18.3分で終わった（抄録）。", "fun": "小さな工場は決算書を詳しく公開しないことが多く、倒産の兆しを見つけにくい。そこで会社どうしの税の請求書をつないで「取引の地図」を作り、取引先を失う、取消が増えるといった危ない連鎖をAIで探した。お金の流れそのものを見る発想が面白い。", "unverified": "「早期警告の時間」の定義（短いほど良い指標か）は抄録からは判断できず未確認。データの出所と評価方法の詳細も未確認。"}}, {"id": "jr34", "rank": 34, "headline": "警察のAI利用の正統性は女性代表で変わるか", "title": "Artificial Intelligence in Policing and Perceived Legitimacy: Does Gender Representation Make a Difference?", "url": "https://doi.org/10.1111/puar.70214", "authors": "Canyu Gao ほか", "venue": "Public Administration Review", "date": "2026-10-01", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "家庭内暴力の対応部署（DVU）が業務にAIを使うと、男性が多い部署では女性回答者が感じる公正さと信頼が下がるが、女性が多い部署ではその低下が消えることを調査実験で示した（抄録）。", "p3": "代表的官僚制の理論に基づき、AIの使用の有無と部署の性別構成を変えた調査実験を行い、市民が感じる公正さと信頼への効果を推定した（抄録）。対象の国と標本の大きさは抄録にない（未確認）。", "p5": "女性の代表性は、AIの使用が正統性に与える影響を正の方向に調整した（抄録）。男性が多いDVUではAIの使用が女性回答者の公正さと信頼の評価を下げたが、女性が多いDVUではその負の効果が見られなくなった（抄録）。", "fun": "警察がAIを使うと聞いて不安になるかどうかは、その部署で誰が働いているかで変わった。家庭内暴力を扱う部署が男性ばかりだと女性はAIの導入を不公平に感じたが、女性が多い部署ではそうした反応が消えた。誰が使うかが道具への信頼を左右するという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "プラットフォームは顧客嗜好情報をどう共有すべきか", "title": "Consumer Preference Information Sharing of Online Platforms with Competing Suppliers and Customization", "url": "https://doi.org/10.1287/msom.2025.0168", "authors": "Yong Zha ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-10-01", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "オンラインプラットフォームが持つ消費者の好みの情報を、どの供給者と共有すべきかを、マーケットプレイス型と再販型の2つの取引形態についてゲーム理論で分析した（抄録）。", "p3": "プラットフォームと2つの供給者のゲーム理論モデルで、好みの情報の共有と価格の決定を分析し、柔軟な製造・3Dプリント・AIによって供給者が製品をカスタマイズできる場合の影響も調べた（抄録）。", "p5": "1社だけとの共有はマーケットプレイス型でのみ起こりうる。好みの不確実性が低いと、マーケットプレイス型ではどちらとも共有しないことがあり、再販型では二重マージンの弱まりから両方と共有しうる（抄録）。品質が低いとマーケットプレイス型、高いと再販型が選ばれ、再販型ではカスタマイズが消費者余剰と社会厚生を増やすことはなかった（抄録）。", "fun": "ネット通販の運営会社は、客の好みについて大量のデータを持っている。それを商品を作る会社に渡すべきか、渡すならどの会社に渡すかを、数式のゲームで考えた。売り方が「場所貸し」か「仕入れて売る」かで、答えが大きく変わる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "不均質な地盤での溶質輸送研究の40年", "title": "Four Decades of Research at the MADE Site and Beyond: Advancing the Understanding and Modeling of Solute Transport in Heterogeneous Media", "url": "https://doi.org/10.1029/2025rg000894", "authors": "Zhilin Guo ほか", "venue": "Reviews of Geophysics", "date": "2026-10-01", "sjr": 15.383, "citescore": 69.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国ミシシッピ州のMADEサイトで長年行われてきた地下水の溶質輸送の実験とモデル研究をまとめ、古典的な移流分散方程式の限界と、それに代わるモデルの発展を整理したレビュー（抄録）。", "p3": "数千の透水係数の測定、多層のトレーサー試験、詳しい物理探査などの豊富なデータを使った研究を総括し、Borden、Cape Cod、Twin Lake、Hanfordなど他の代表的な野外実験の知見と統合した（抄録）。", "p5": "MADEのデータは、移流分散方程式（ADE）では観測された非フィック型の輸送を再現できないことを示し、二重領域の物質移動モデル、連続時間ランダムウォーク、分数階ADE、水理相に基づくシミュレーションの開発を促したと整理した（抄録）。機械学習とAIで地下の特性評価と輸送の予測を強める機会も論じた（抄録）。", "fun": "地下水に混じった汚れがどう広がるかは、地面の中の水の通りやすさが場所によって何桁も違うため、予測が難しい。米国の一つの実験場で何千回も測った結果、教科書どおりの式では説明できない広がり方が見つかり、新しい理論がいくつも生まれた。一つの現場が学問を動かした例だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "地形データから災害時の道路閉塞を推定", "title": "Road Blockage Estimation Using Remote Sensing Terrain Data from Disaster Areas", "url": "https://doi.org/10.4287/jsprs.65.224", "authors": "Reo IWAKURA ほか", "venue": "Journal of the Japan society of photogrammetry and remote sensing", "date": "2026-09-29", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "災害前後の3次元点群から作った数値標高モデル（DEM）の差と、道路脇の土砂の情報の補間を組み合わせ、土砂崩れや土石流で塞がった道路区間を推定する方法を提案した（抄録）。", "p3": "オルソ画像から植生を除いて樹木の影響を減らし、災害前後のDEMの差から地形の変化を抽出して土砂の候補域を求め、直接検出しにくい道路上には道路脇で検出した土砂の情報を補間し、区間ごとに閉塞を判定して道路網の上に表示した（抄録）。", "p5": "災害後の土砂の分布図と目視で判読したオルソ画像で評価し、道路脇からの補間によって土砂による道路閉塞の検出が改善したと報告した（抄録）。精度の数値は抄録にない（未確認）。", "fun": "大雨で土砂崩れが起きると、救急車が通れる道がどこかをすぐ知る必要がある。この研究は、災害の前後の地形を空から測って比べ、木の影響を取り除き、道路脇の土砂の様子から道が塞がっているかを推定した。救助の道案内を地形データで支える発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "トウモロコシ粒の個別要素法パラメータを較正", "title": "Calibration of Discrete Element Parameters for Maize Kernels Using the Tavares UFRJ Breakage Model", "url": "https://doi.org/10.3390/agriculture16192128", "authors": "Shanchen Jiang ほか", "venue": "Agriculture", "date": "2026-10-01", "citescore": 7.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "離散要素法（DEM）でトウモロコシの品種「登海605」の粒を再現するための接触パラメータと破砕モデル（Tavares UFRJ）のパラメータを、段階的に較正する手順を確立した（抄録）。", "p3": "円筒引き上げによる安息角試験、仕切りトレイの反発試験、Box–Behnken計画で粒どうし・粒と炭素鋼の接触パラメータを較正し、単粒の準静的圧縮試験と電磁式の衝撃試験で比破砕エネルギーの分布、損傷蓄積係数γ、破片の大きさの分布のbを推定した（抄録）。", "p5": "反発・静止摩擦・転がり摩擦の係数は、粒どうしで0.72、0.18、0.06、粒と炭素鋼で0.75、0.28、0.08だった（抄録）。安息角はシミュレーション24.91°と実験23.89°で相対誤差4.27%、平均破砕力の相対誤差は3.17%、累積粒度分布のRMSEは4.04ポイントだった（抄録）。", "fun": "トウモロコシの粒が機械の中でどう転がり、どう割れるかをコンピュータで再現するには、粒どうしの滑りやすさや割れやすさの数値が必要だ。この研究は実験を重ねてそれらを決め、積もった山の傾きは計算で24.91°、実測で23.89°とほぼ一致した。農業機械の設計を仮想実験で進める土台になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "磁気機械共振器のモデルベースの状態推定", "title": "Parameter Estimation for Model-Based Sensing of Magneto-Mechanical Resonators", "url": "https://doi.org/10.1038/s42005-026-02884-1", "authors": "Sarah Reiss ほか", "venue": "Communications Physics", "date": "2026-10-01", "sjr": 1.641, "citescore": 9.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "振動磁場で励起し誘導コイルで読み取る受動センサー、磁気機械共振器（MMR）について、動きと読み出しの参照モデルと簡略モデル、リアルタイムで使えるパラメータ推定法を示した（抄録）。", "p3": "MMRの姿勢などを推定するには、誘導された信号と順モデルから非線形の逆問題を解く必要がある。参照モデルと簡略モデルを導入し、頑健でリアルタイムに使える推定法を、速さ・精密さ・正確さの面で評価した（抄録）。", "p5": "どの方法も測定信号を推定でき、簡略化した方法は、最大振れ角が大きい場合に4%未満のずれと引き換えに、パラメータ推定の時間を最大で2桁短縮した（抄録）。", "fun": "電池も配線もない小さな振動子を外から磁場で揺らし、その揺れ方を読み取ると、どちらを向いているかや周りの状態が分かる。この研究は、その読み取りの計算を、ずれを4%未満に抑えたまま最大で2桁速くした。動きを外から読み取る新しいセンサーの実用化に近づく一歩だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "退職高齢者の5つの側面のwell-being", "title": "Multidimensional Well-Being Among Retired Old Adults: A Cross-Sectional Survey", "url": "https://doi.org/10.1177/08445621261492763", "authors": "Yasin M. Yasin ほか", "venue": "Canadian Journal of Nursing Research", "date": "2026-10-01", "sjr": 1.03, "citescore": 5.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "カナダ・ニューブランズウィック州の65歳以上の退職者1,903人で、身体・精神・社会・スピリチュアル・経済の5つの幸福の側面を調べ、経済面が最も脆弱で、関連する要因は側面ごとに異なることを示した（抄録）。", "p3": "社会生態学的モデルに沿った横断調査で、記述統計、二変量解析、側面ごとの5つの階層的重回帰モデルにより関連要因を分析した（抄録）。", "p5": "幸福はどの側面も中程度で、経済面が最も脆弱だった（抄録）。最終モデルでは、既婚・事実婚でないことが身体・精神・社会・スピリチュアルの幸福の高さと関連し、配偶者やパートナーとの同居は経済面の幸福の高さとだけ関連した。説明できた分散は小さかった（抄録）。", "fun": "退職後の幸せを、体・心・人づきあい・心のよりどころ・お金の5つに分けて調べると、お金の面がいちばん弱かった。しかも結婚していない人のほうが、お金以外の4つで幸せの度合いが高いという意外な結果も出た。幸せは一つの物差しでは測れないことが分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "AIリテラシーは燃え尽きを減らし熱意を高めるか", "title": "Does AI literacy enhance employee work engagement by boosting work self-efficacy or reducing job burnout? A one-year longitudinal study", "url": "https://doi.org/10.1057/s41599-026-09184-7", "authors": "Qingqi Liu ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-01", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、従業員のAIリテラシーが、仕事の自己効力感を高めることで、あるいは燃え尽きを減らすことで、ワーク・エンゲージメントを高めるのかを、1年間の縦断研究で調べた論文（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "AIを使いこなす力がある社員は、仕事に熱心に打ち込めるのか。それは「自分はできる」という自信が増えるからか、それとも疲れ切ることが減るからか。同じ人を1年追って、二つの道筋を比べようとした研究だ。結果は抄録が得られず未確認。", "unverified": "抄録・本文を入手できず、対象、手法、結果はすべて未確認。"}}, {"id": "jr42", "rank": 42, "headline": "地震動の空間変動と斜張橋ケーブルの非線形振動", "title": "Nonlinear vibration characteristics of stayed cables under n の障害、リーダーシップの難しさが主な不満の源だった（抄録）。", "fun": "心の病を持つ人を支える看護師は、自分自身も強いストレスにさらされている。オマーンで42人に話を聞くと、大きな不満の種は、頑張りを認めてもらえないこと、話が通じないこと、上司のリーダーシップの問題だった。人を支える人を支える仕組みの大切さが分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr49", "rank": 49, "headline": "人生の出来事と地域サービスが主観年齢を変える", "title": "Feeling younger or older? How life events reshape subjective age among Chinese older adults", "url": "https://doi.org/10.1093/geronb/gbag200", "authors": "Menghan Zhao ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-09-30", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の高齢者の全国代表パネルで、深刻な病気や身近な人の死などの悪い出来事は主観的な年齢を約1歳高め、子の結婚や出産などの良い出来事は若く感じさせることを示した（抄録）。", "p3": "中国老年社会追跡調査（CLASS）の2018年・2020年・2023年の3波の60歳以上の全国代表標本で、固定効果モデルにより感じる年齢と見た目の年齢への影響を推定し、ランダム効果モデルで頑健性を確かめた（抄録）。", "p5": "悪い出来事は主観的な年齢を約1.3%（約1歳）高めた。良い出来事は感じる年齢を約0.9%（0.6歳）、見た目の年齢を約1.2%（0.9歳）下げた（抄録）。悪い出来事の影響は年齢とともに強まり、良い出来事の若返りの効果は弱まった。高齢者向けの地域サービスがあると両方の影響が小さくなった（抄録）。", "fun": "「気持ちは何歳？」と聞くと、答えは実年齢と大きく違うことがある。中国のお年寄りを追うと、身近な人の死や大病のあとは約1歳老けて感じ、子どもの結婚や出産などの良いことがあると若く感じていた。地域の支えがあると、どちらの揺れも小さくなる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr50", "rank": 50, "headline": "歩行・自転車の到達性と公平性を環境込みで評価", "title": "Urban active transport accessibility and equity analysis considering built environment, safety, and air pollution", "url": "https://doi.org/10.1016/j.jtrangeo.2026.104842", "authors": "Aiganym Kumisbek ほか", "venue": "Journal of Transport Geography", "date": "2026-10-01", "sjr": 1.688, "citescore": 10.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、建造環境、安全性、大気汚染を考慮して、都市での徒歩や自転車などのアクティブな移動による到達しやすさ（アクセシビリティ）とその公平性を分析した論文（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "歩いて行ける範囲に店や病院があっても、道が危なかったり空気が汚れていたりすれば、実際には使いにくい。この研究は、街の作り、安全、大気汚染を合わせて、歩きや自転車での行きやすさが住む場所によってどう違うかを調べようとした。結果は抄録が得られず未確認。", "unverified": "抄録・本文を入手できず、対象、手法、結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "開発経済学", "headline": "思い出す仕組みが農家の貯蓄を変えた", "title": "Retrieval Failures and Consumption Smoothing: A Field Experiment on Seasonal Poverty", "url": "https://doi.org/10.1093/qje/qjag035", "authors": "Ned Augenblick ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-10-01", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "知っている情報を意思決定で思い出せない「想起の失敗」が、年1回の収穫に頼る農家の消費平準化を歪めることをフィールド実験で示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "人が知っているはずの情報を意思決定の場で思い出せない「想起の失敗」が、年1回の収穫で暮らすザンビアの農家の消費平準化を歪めることを示し、将来の支出を思い出させるだけの介入で貯蓄と翌年の収入が増えることをフィールド実験で示した（抄録）。", "p2": "収入が年1回の収穫に限られる農家は、収穫後に1年分をうまく配分する必要があるが、収穫の前には食料が不足する「端境期」に消費が大きく落ちる（抄録）。その原因として、将来の支出を過小に見積もる記憶の問題は検証されていなかった。", "p3": "将来の支出を、外部の情報や指導を一切与えずに、項目の種類ごとに連想的に考えさせる介入を無作為に割り当てた（抄録）。解釈：情報を「教える」のではなく、本人がすでに知っていることを「思い出させる」だけの介入であり、記憶の想起の失敗を直接狙っている。", "p4": "思い出された支出額、直後の支出、6週間後の貯蓄、端境期の貯蓄の月数、翌年の作物収入を比べ、さらに米国の低所得層で見積もりへの効果を再現した（抄録）。", "p5": "人々はこれからの支出を50%過小に見積もっていた（抄録）。介入で「思い出された」支出は36〜60%増え、効果は小さく不規則で確率的な項目に集中した（記憶研究の予測どおり）。直後の支出が減り、6週間後の貯蓄は15%多く、端境期に1か月分多い貯蓄を持って入り、1年の支出がより平らになった（抄録）。増えた貯蓄は農業投資の自己資金に使われ、翌年の作物収入は9%増えた（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は米国の低所得層でも見積もりへの効果を再現し、想起の失敗が環境や集団を越えて一般化すると示唆している（抄録）。解釈：米国での再現は見積もりへの効果であり、貯蓄や収入への効果までは示されていない可能性がある。", "fun": "1年分の収入を一度に受け取る農家は、これからの出費を半分くらい少なく見積もってしまう。新しい情報を教えたわけではなく、「食べ物、学校、病気…と種類ごとに思い出してみて」と促しただけで、貯金が増え、翌年の収穫まで増えた。お金の問題が、実は「思い出せるかどうか」という記憶の問題だったという発見が面白い。", "unverified": "本文を入手できず、介入の具体的な手順、標本規模、各効果の信頼区間は確認できなかった。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "富裕税は富裕層の国外移住を招く", "title": "Taxing Top Wealth: Migration Responses and Their Aggregate Economic Implications", "url": "https://doi.org/10.1257/aer.20241596", "authors": "Katrine Jakobsen ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "北欧の行政データで、富裕税率の引き上げが富裕層の国外移住を招くことと、その経済全体への含意を推定した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "北欧諸国の行政データで、富裕税が富裕層の国外移住を招くことを示し、ただしその移住による経済全体への影響は小さいことを定量化した（抄録）。", "p2": "富裕税は富裕層の国外移住を招くという懸念があるが、移住の反応の大きさと、それが雇用・投資・付加価値に与える総合的な影響の実証的な証拠は限られていた（抄録）。", "p3": "スカンジナビア諸国の行政データを用いて、最高富裕税率の変化に対する富裕な納税者の国際移住の反応を推定し、富裕層の多くが事業所有者であることから、所有者の転出が事業に与える影響も推定した（抄録）。識別の具体的な方法は未確認（本文を入手できず）。", "p4": "最高富裕税率1ポイントの引き上げあたりの富裕な納税者数の変化と、それに伴う雇用・投資・付加価値の変化を評価した（抄録）。", "p5": "最高富裕税率を1ポイント上げると、富裕な納税者の数は約2%減った（抄録）。所有者の転出は事業に負の影響を与えたが、総合的な影響は小さく、1ポイントの引き上げに伴う移住の反応は雇用を0.02%、投資を0.07%、付加価値を0.10%減らすにとどまった（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：北欧の制度と移住の条件のもとでの推定であり、税の執行や国際的な租税条約の異なる国への一般化には注意が要る。", "fun": "お金持ちに税金をかけると国外に逃げてしまう、とよく言われる。北欧の行政データで調べると、確かに税率を1ポイント上げると富裕層は2%ほど減ったが、そのせいで国の雇用や投資が減った分はごくわずかだった。「逃げる」のは本当でも「経済が傾く」ほどではない、と数字で分けて示した点が面白い。", "unverified": "本文を入手できず、対象国と期間、識別の方法、推定の信頼区間は確認できなかった。"}}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "黒人審査官の昇進は規定どおりでも遅れる", "title": "Racial Promotion Gaps", "url": "https://doi.org/10.1257/aer.20231368", "authors": "Deepak Hegde ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "昇進が規定で決まる米特許庁で、黒人の審査官が権利のある昇進を遅らされていることを行政データで示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "昇進が規定で決まる米国特許庁で、黒人の特許審査官が、資格のある昇進を遅らされていることを行政データで示し、その原因は信念に基づく差別と整合的だと論じた（抄録）。", "p2": "職場の昇進の人種差は、能力や評価の違いと区別しにくく、差別の有無や種類を特定するのが難しかった（抄録）。", "p3": "昇進が定式的に決まる特許庁という場で、誰がいつ昇進の資格を得たかを観察できる詳細な行政データを使い、資格を得てから実際に昇進するまでの遅れを人種間で比べた（抄録）。解釈：資格の時点が分かるので、能力の差による説明をかなり除いて比較できる。", "p4": "昇進の遅れ、キャリアの頂点に達するまでの期間、生涯所得への影響を比べ、制度上の特徴と上司の人種による違いから、差別の種類（正確な事前知識による統計的差別、嗜好による差別、信念に基づく差別）を区別した（抄録）。", "p5": "黒人の審査官は資格のある昇進が遅れ、キャリアの頂点への到達が1年遅くなり、生涯所得が2.5%減った（抄録）。制度上の特徴から正確な事前知識による統計的差別は除かれ、黒人の上司のもとでも昇進が遅いことは嗜好による敵意に反しており、信念に基づく差別のモデルに合う（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：特許庁という定式的な昇進制度の組織での結果であり、裁量の大きい民間企業での昇進差にどこまで当てはまるかは別途の検討が要る。", "fun": "昇進のルールが決まっているはずの職場でも、黒人の審査官は「昇進できる資格」を得てから実際に昇進するまでに遅れがあり、生涯の給料が2.5%減っていた。しかも上司が黒人でも遅れが見られたので、単純な好き嫌いではなく「思い込み」による差別らしい。ルールがあっても運用に偏りが入り込む、という点が考えさせられる。", "unverified": "本文を入手できず、標本の規模、推定のモデル、信念に基づく差別を支持する証拠の詳細は確認できなかった。"}}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "発明者は自分に似た人向けの製品をつくる", "title": "Social Push and the Direction of Innovation", "url": "https://doi.org/10.1257/aer.20231417", "authors": "Elias Einiö ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "米国とフィンランドの連結データで、発明者が自分と似た属性の消費者向けの製品をつくる同類性を示し、発明の担い手の偏りが不平等に及ぶことを論じた。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarに登録された抄録（ワーキングペーパー版の文面を含む）を使用", "preprint": false, "p1": "発明者・起業家は自分と似た属性（性別・年齢・社会経済的地位）の消費者が買う製品を作る傾向があることを示し、さらに低所得の同輩との接触が必需品を作る傾向を高めるという因果的な証拠を示した（抄録）。", "p2": "イノベーションの担い手は内発的に動機づけられた人々で、その社会的な背景が何を発明するかの方向を左右する可能性があるが（社会的な後押し、social push）、イノベーションの機会へのアクセスの不平等が、発明の方向と不平等にどう効くかは分かっていなかった（抄録）。", "p3": "米国とフィンランドの連結データ（特許の発明者の性別、Nielsenの購買データ、フィンランドの徴兵登録など）で、発明者の属性とその製品の購入者の属性の一致を、産業間と詳細な産業内で調べた（抄録）。同輩との接触の効果を因果的に推定し、その経路を一般均衡モデルに組み込んで、生活費の不平等と長期成長への含意を評価した（抄録）。識別の詳細は未確認（本文を入手できず）。", "p4": "発明者と購入者の属性の一致（同類性）の程度、低所得層の同輩との接触が必需品の創出と起業率・起業所得に与える効果を比べた（抄録）。", "p5": "発明者は性別・年齢・社会経済的地位で自分と似た顧客が買う製品を作りやすく、この傾向は産業間でも詳細な産業内でも見られた（抄録）。低所得層の同輩に接すると、必需品を作る傾向が高まったが、起業率や起業所得は変わらなかった（抄録）。一般均衡モデルで生活費の不平等と長期成長への含意を評価した。", "p6": "限界は未確認（本文を入手できず）。解釈：購入者の属性は消費データの観察可能な属性に限られ、同類性が需要の情報の違いによるのか好みの違いによるのかの区別は本文で確かめる必要がある。", "fun": "発明する人は、自分と似た人が欲しがるものを作りがちだ。女性の発明者は女性が買う製品を、若い人は若い人向けの製品を、という具合に。だから発明の世界に入れる人が偏っていると、作られる製品も偏り、生活の不便さの格差につながりうる。「誰が発明するか」が「何が発明されるか」を決めるという視点が面白い。", "unverified": "本文を入手できず、同輩との接触の効果の識別方法、効果の大きさ、一般均衡モデルの結果の数値は確認できなかった。"}}, {"id": "jn05", "rank": 5, "field": "経済学", "headline": "子ども期の近所の構成が異人種・異階層婚を左右", "title": "Who Marries Whom? The Role of Segregation by Race and Class", "url": "https://doi.org/10.1257/aer.20250115", "authors": "Benjamin Goldman ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "子ども期の近隣の異性・同年代の構成を操作変数に、他集団との接触が人種・階層を越えた結婚を増やすことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Semantic Scholarに登録された抄録（ワーキングペーパー版の文面を含む）を使用", "preprint": false, "p1": "子ども期の近隣での他の人種・階層の異性との接触が、階層を越えた結婚を増やすが、人種を越えた結婚には効果が見られないことを示し、居住の分離が階層の結婚の選別の3分の1以上を説明することを推計した（抄録）。", "p2": "米国人は人種や階層の外の相手とほとんど結婚せず、それが不平等と世代間移動に影響するが、他の集団との接触の少なさがどれだけ原因かは分かっていなかった（抄録）。", "p3": "子ども期の近隣で、他の人種・階層の同年代の異性の子どもがたまたま多かったかどうかの変動を操作変数として、接触の効果を推定した（抄録）。さらに空間的な結婚市場のモデルを作り、居住の分離が結婚の選別をどれだけ説明するかを予測した（抄録）。", "p4": "親の所得の高低による階層間の結婚と、白人と黒人の人種間の結婚について、接触の効果を比べた（抄録）。データの具体的な出所と標本規模は未確認（本文を入手できず）。", "p5": "接触は階層間（親の所得の高低）の結婚を増やしたが、人種間（白人と黒人）の結婚には検出可能な効果がなかった（抄録）。空間的な結婚市場のモデルは、居住の分離が、階層による結婚の選別の3分の1以上を説明するが、人種による選別の5%未満しか説明しないと予測した（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、居住の分離は接触の多くの形態のうちの一つにすぎないと述べる（抄録）。解釈：人種間の結婚には接触以外の要因（規範や差別）が大きく効いている可能性があり、その解明は別の課題である。", "fun": "子どものころ近所に、家庭の豊かさが違う同年代の異性が多くいた人は、大人になって階層を越えた結婚をしやすかった。ところが人種を越えた結婚には、近所での出会いの多さはほとんど効かなかった。「出会いの機会」で説明できる壁と、できない壁があることを分けて示した点が面白い。", "unverified": "本文を入手できず、データの出所、操作変数の作り方、推定値の大きさは確認できなかった。"}}, {"id": "jn06", "rank": 6, "field": "経済学", "headline": "優秀な同僚は学びと昇進競争の両方をもたらす", "title": "Knowledge Spillovers, Competition, and Individual Careers", "url": "https://doi.org/10.1257/aer.20230714", "authors": "Thomas Cornelissen ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "職場の同僚の質が知識の波及と昇進競争という逆向きの経路でキャリアに効くことを、競争相手かどうかで分けて識別した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "職場で優秀な同僚に接することが、知識の波及というプラスと、昇進をめぐる競争というマイナスの両方の経路でキャリアに効くことを、競争相手になりやすい同僚とそうでない同僚を区別して識別した（抄録）。", "p2": "より優秀な同僚に囲まれることは知識の波及でキャリアを伸ばしうるが、同時に昇進の競争相手にもなるため、二つの効果が打ち消し合い、別々には測りにくかった（抄録）。", "p3": "未訓練の労働市場参入者を対象に、同じ職種で競争しやすい同僚と、競争しにくい同僚を区別し、それぞれの同僚の質がキャリアに与える影響を比べた（抄録）。解釈：競争しない同僚からは知識の波及だけが、競争する同僚からは波及と競争の両方が来るので、その差から競争の効果を取り出せる。データの国と期間は未確認（本文を入手できず）。", "p4": "同僚の質とその後のキャリアの関係を、競争の有無で分けて推定し、性別で比べた（抄録）。", "p5": "持続的な知識の波及の頑健な証拠と、それと同程度の大きさの逆向きの競争効果が見つかった（抄録）。どちらの効果も女性より男性で大きかった（抄録）。効果の数値は未確認。", "p6": "限界は未確認（本文を入手できず）。解釈：同僚の質の測り方と職場への配置の偶然性をどう確保したかが、因果の解釈の強さを左右する。", "fun": "優秀な先輩がいる職場は、学べることが多い一方で、昇進の椅子を取り合うライバルも強くなる。この研究は、同じ職種の人（ライバル）と違う職種の人（ライバルでない）を分けることで、「学び」と「競争」の効果がほぼ同じ大きさで打ち消し合っていることを示した。良い環境が必ずしも得とは限らないという点が面白い。", "unverified": "本文を入手できず、データの国と規模、同僚の質の指標、推定値の大きさは確認できなかった。"}}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "物言う株主の企業は同じ仕事に低い給与", "title": "More Monitoring, Less Pay: Active Ownership and Employee Compensation", "url": "https://doi.org/10.1287/mnsc.2024.08553", "authors": "Claudine Gartenberg ほか", "venue": "Management Science", "date": "2026-10-01", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "ヘッジファンドやプライベート・エクイティが所有する企業が、比較可能な仕事に他の所有者より低い賃金を払うかを詳細な報酬データで検証した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ヘッジファンドやプライベート・エクイティなどの「物言う所有者」を持つ企業は、同じ年・地域・職種・技能水準の比較可能な仕事に対し、他の企業より2〜4%低い報酬を払っていることを、2,000万件超の従業員記録で示した（抄録）。", "p2": "物言う所有者は人員の再編や賃金の伸びの鈍化で全体の報酬を下げることが知られていたが、同じ仕事に対する支払いそのものが違うかは調べられていなかった（抄録）。", "p3": "米国の896社・2,000万件超の詳細な報酬記録で、年・地域・職種・技能水準を固定した狭い労働市場の中で、所有者の種類による賃金の差を比べた（抄録）。差の一部が所有者による処置効果を反映するかを検討し、監視しやすい仕事かどうかで効果を分けた（抄録）。識別の詳細は未確認（本文を入手できず）。", "p4": "比較可能な仕事の報酬差を、基本給と成果給に分け、定型的な仕事、成果が数量化できる仕事、知識集約度の低い産業などの監視しやすさで比べた（抄録）。", "p5": "物言う所有者の企業は比較可能な仕事に2〜4%低い報酬を払い、差は基本給の低さと成果給のフラット化の両方に表れ、少なくとも一部は所有者による処置効果を反映していた（抄録）。差は定型的な仕事、成果を数量化できる仕事、知識集約度の低い産業など、監視しやすい文脈に集中していた（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、物言う所有者が報酬による誘因を管理による監督で置き換えている可能性を示し、仕事が測りやすくなるほど所有者が従業員の処遇を左右しうると述べる（抄録）。", "fun": "同じ地域で同じ職種・同じ技能の人でも、会社の持ち主が「物言う投資家」だと給料が2〜4%低かった。しかもその差は、働きぶりを数字で監視しやすい仕事ほど大きかった。給料でやる気を引き出す代わりに、監視で働かせる、という置き換えが起きているらしいという解釈が面白い。", "unverified": "本文を入手できず、所有者の変化を使った推定の設計、効果の信頼区間、データの出所は確認できなかった。"}}, {"id": "jn08", "rank": 8, "field": "経営学", "headline": "政府が生態系を束ねて大事業を急ぐ方法", "title": "Government as orchestrator: Ecosystem transformation at scale and speed", "url": "https://doi.org/10.1002/smj.70129", "authors": "Ron Adner", "venue": "Strategic Management Journal", "date": "2026-10-01", "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "why": "大きな社会課題を官民の多数の主体の整合の問題ととらえ、政府が独自の能力で生態系を束ねて規模と速度を実現する方法を分析した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国政府の新型コロナワクチン開発事業「オペレーション・ワープ・スピード」を事例に、政府が多数の官民の主体を束ねて大規模な課題を速く解決する「生態系のオーケストレーション」の仕組みを理論化した（抄録）。", "p2": "大きな社会課題は、互いに依存する多数の官民の主体の貢献をそろえなければ達成できない「生態系の課題」だが、政府が独自の能力でそれをどう実現するかは十分に分析されていなかった（抄録）。", "p3": "生態系を構造として捉える分析の枠組み（ecosystem-as-structure）を用い、オペレーション・ワープ・スピードの事例から生態系の変革の仕組みと動態を引き出した（抄録）。事例研究の資料の種類は未確認（本文を入手できず）。", "p4": "事例の分析から、調整の様式、調整のための専用組織の設計、外部の生態系と組織内部の再編のつながり、調整能力の制約を検討した（抄録）。", "p5": "階層・強制・市場の信号とは異なる調整の様式として「調整的な命令（coordinative fiat）」を導入し、目的に特化した調整組織の設計上の選択、外部の生態系の調整と調整者自身の内部の再編の結びつき、調整能力が生態系戦略の主要な制約であることを示した（抄録）。著者はこれらを指導者への4つの教訓としてまとめ、民間の取組みにも当てはまると述べる（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：危機下の単一の事例に基づく理論化で、平時の課題や他の政策領域で同じ仕組みが機能するかは今後の検証が要る。", "fun": "コロナワクチンを1年足らずで届けた米国の計画では、政府が製薬会社や工場、物流会社を命令でも契約の値段でもない独特のやり方で同じ方向に動かした。著者はそれを「調整的な命令」と名づけた。バラバラの会社をオーケストラのように合奏させる指揮者の役割を、政府が果たせる条件を描いた点が面白い。", "unverified": "本文を入手できず、事例の資料と分析の手順、4つの教訓の具体的な内容の詳細は確認できなかった。"}}, {"id": "jn09", "rank": 9, "field": "因果推論", "headline": "ロボット膝関節置換を登録データで模擬試験", "title": "Early national comparison of robotic versus conventional knee replacements for arthritis using National Joint Registry data: target trial emulation study", "url": "https://doi.org/10.1136/bmj-2026-100691", "authors": "Hasan R Mohammad ほか", "venue": "BMJ", "date": "2026-10-01", "citescore": 8.9, "citescore_year": "2025", "why": "約70万件の人工膝関節置換の全国登録データで標的試験模倣を行い、ロボット支援手術の早期成績を従来法と比べた。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "英国の全国人工関節登録の697,145件の人工膝関節置換術で、標的試験模倣（観察データで仮想の無作為化試験を設計どおりに再現する方法）を行い、ロボット支援手術と従来法の早期成績に差が見られないことを示した（抄録）。", "p2": "ロボット支援の人工膝関節置換は導入が進んでいるが、資本と手術の費用が大きく、公的医療で使うに見合う成績の差があるかの全国規模の比較は乏しかった（抄録）。", "p3": "2018〜2024年の英国（イングランド・ウェールズ・北アイルランドなど）の全国人工関節登録の697,145件（従来法675,034件、ロボット22,111件）を使い、全置換（TKR）と単顆置換（UKR）のそれぞれで、標的試験模倣の枠組みで傾向スコア・マッチングを行い、処置群での平均処置効果を推定した（抄録）。生存はKaplan-Meier法とCox回帰で比べた。", "p4": "主要評価項目は5年のインプラント生存（平均追跡2.5年）で、全原因の再置換リスク、原因別の再置換リスク、術中合併症、再置換の複雑さを比べた（抄録）。", "p5": "マッチング後の5年インプラント生存はTKRで従来法98.5%（95%信頼区間98.3〜98.7%）、ロボット98.6%（98.2〜99.0%）で、再置換リスクに差はなかった（ハザード比1.03、95%信頼区間0.86〜1.26）（抄録）。UKRでも97.8%対96.4%で差はなく（ハザード比1.03、0.75〜1.42）、原因別の再置換と術中合併症にも差はなかった（抄録）。", "p6": "著者は、観察研究のため測定されない交絡や残差交絡の可能性を排除できないと認めている（抄録）。解釈：追跡は平均2.5年と短く、ロボット支援の利点が長期の再置換や機能の改善に表れる可能性は、この研究では評価されていない。", "fun": "最新のロボットで膝の人工関節の手術をすると、本当に長持ちするのか。697,145件もの手術記録を、まるで本物のくじ引き実験のように条件をそろえて比べたところ、5年後に入れ直しが必要になる割合はロボットでも従来の手術でもほとんど同じだった。高い機械が必ずしも良い結果を生むとは限らない、という確かめ方が面白い。", "unverified": "本文を入手できず、マッチングに使った変数、感度分析、費用の比較は確認できなかった。"}}, {"id": "jn10", "rank": 10, "field": "統計学", "headline": "平均も分散も無限の重い裾でのテイラー則", "title": "Generalized Taylor’s law for infinite-mean heavy-tailed data under dependence and heterogeneity", "url": "https://doi.org/10.1073/pnas.2611888123", "authors": "Pok Him Cheng ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-01", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "分散が平均のべき乗に比例するというテイラー則を、平均も分散も無限の重い裾の分布へ依存と異質性込みで一般化した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "標本の分散が平均のべき乗に比例するという経験則「テイラーの法則」を、平均も分散も無限の重い裾の分布について、独立同分布の仮定を外し、依存と異質性がある場合に一般化して、確率的な極限と収束の速さを導いた（抄録）。", "p2": "テイラーの法則（物理学では揺らぎのスケーリング、統計学ではべき乗の分散関数）は生態学・物理学・金融・疫学で広く観察されるが、重い裾の場合の理論は観測値が独立同分布であることを前提にしていた（抄録）。", "p3": "平均と分散が無限になる重い裾の分布について、一般化したテイラーの法則の確率的な極限を確立し、収束の速さを分析した（抄録）。独立同分布の仮定を緩め、観測値の依存と異質性を許した（抄録）。証明の手法は未確認（本文を入手できず）。", "p4": "理論の結果を大規模なシミュレーションで裏づけ、実際のネットワークのデータへの応用で実用性を示した（抄録）。比較の指標と対象のデータは未確認。", "p5": "依存と異質性を許す一般化により、テイラーの法則を依存のある時系列やネットワーク構造のデータに適用できるようになった（抄録）。数値的な結果は未確認（本文を入手できず）。", "p6": "限界は未確認（本文を入手できず）。解釈：依存の構造に課した条件の強さによって、実データでの適用の範囲が決まるため、その条件を本文で確かめる必要がある。", "fun": "動物の数を地域ごとに数えると、平均が多い場所ほどばらつきも大きく、そのばらつきは平均の何乗かに比例するという不思議な決まりが、生き物から株価まで多くの分野で見られる。この論文は、平均さえ定まらないほど極端な値が出るデータでも、つながり合ったデータでも、その決まりが数学的に成り立つ形を示した。", "unverified": "本文を入手できず、定理の条件、収束の速さ、適用したネットワークのデータの内容は確認できなかった。"}}, {"id": "jn11", "rank": 11, "field": "機械学習", "headline": "遺伝子摂動の深層モデルは指標次第で勝つ", "title": "Deep learning perturbation models can outperform baselines on calibrated metrics", "url": "https://doi.org/10.1038/s41587-026-03307-w", "authors": "Henry E. Miller ほか", "venue": "Nature Biotechnology", "date": "2026-10-01", "sjr": 23.109, "citescore": 66.4, "citescore_year": "2025", "why": "深層学習の遺伝子摂動モデルが単純な基準に勝てないという報告が、評価指標の較正不足によることを14データ・18指標で示した。", "explain": {"basis": "本文", "basis_note": "Nature Biotechnologyの出版社サイトのHTML本文（Main、図1の説明、モデル比較、下流課題の節）を読んだ。Methodsは見出しの範囲", "preprint": false, "p1": "遺伝子の摂動（ノックダウンなど）による遺伝子発現の変化を予測する深層学習モデルは「平均を出すだけの基準に勝てない」と言われてきたが、それは評価指標の較正不足によるもので、較正の良い指標で測れば深層学習が基準を上回ることを、14データセット・18指標で示した。", "p2": "複数の比較研究で、訓練データの摂動後の平均を返すだけの「平均基準」が最先端モデルに並ぶか上回るとされた（Main）。その原因として、対照細胞との系統差が相関指標を膨らませる「対照バイアス」と、少数の変動遺伝子の信号が全遺伝子の誤差に薄められる「信号の希釈」があり、そもそも指標が良い予測と無情報な予測を見分けられるかが確かめられていなかった。", "p3": "同じ摂動の細胞を半分に分けて片方で他方を予測する「技術的重複」と平均基準を、遺伝子ごとの差次的発現のp値で混ぜた「補間重複」を陽性対照、平均基準を陰性対照とした（図1a–b）。指標mごとに「陽性と陰性の差」が「理想と陰性の差」の何割かを測る較正の尺度DRF（式1）を定義した。例：Replogle22 K562では摂動あたりの差次的発現遺伝子は平均3.25個しかなく、平均二乗誤差（MSE）のDRFはほぼゼロになる。", "p4": "14データセットで18指標のDRFを比べ、較正の良い指標（重み付きMSE、重み付きR²、正規化逆順位など）で、scGPT・GEARS・PRESAGE・scLambda・CellFlowなどのモデルを平均基準・対照基準・加法基準と比べた（Main、図1d–e）。経路の回復と近傍構造の回復という下流課題との一致も見た。", "p5": "MSEや対照基準との相関（Pearson Δctrl）は、摂動の強いNorman19以外では較正が悪く、重み付きや順位に基づく指標は一貫して較正が良かった（図1e）。較正の良い指標では多くのモデルが無情報な基準を上回り、組合せ予測ではWessels23でPRESAGEが加法基準を18指標中15で上回った（Main）。較正の良い指標の順位は経路の回復の順位と相関した（Replogle22 K562でρavg=0.76、Wessels23で0.84）。", "p6": "著者は、データセット間の性能差は主に課題の難しさを反映し、較正の良い単一の指標を決定的とみなすべきではないと注意し、Norman19は加法基準で飽和しているため組合せ予測の唯一のベンチマークにすべきでないと勧める（Main）。残る疑問：陽性対照もデータから作るため、陽性対照の作り方への依存は残る（補足ノート2で一部検討）。", "fun": "「AIは平均値を答えるだけの手抜き予測に勝てない」という報告が続いていたが、実はテストの採点方法が悪く、本当に実力のある予測と手抜きを見分けられていなかった。著者は「満点に近い答え」と「手抜きの答え」を両方用意して、その差がきちんと点数に出るかで採点方法そのものを検査した。物差しを先に検定するという発想が面白い。", "unverified": "補足表2の各モデル・各データの数値と、補足ノートの感度分析の詳細は確認していない。"}}, {"id": "jn12", "rank": 12, "field": "行動科学", "headline": "利己的な人ほど自分の選択の効果を盛る", "title": "Selfish and prosocial individuals both distort their actions’ impact, but selfish distortions can be more contagious", "url": "https://doi.org/10.1038/s41562-026-02585-3", "authors": "Marius C. Vollberg ほか", "venue": "Nature Human Behaviour", "date": "2026-10-01", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "9つの事前登録実験（8,769人）で、人が行動の社会的影響の曖昧さを利用して自分をよく見せ、その歪みが他者に伝わることを示した。", "explain": {"basis": "本文", "basis_note": "Nature Human Behaviourの出版社サイトのHTML本文（結果の主要な節、伝染の実験、限界）を読んだ。方法の各実験の詳細は見出しの範囲", "preprint": false, "p1": "自分の行動が他人に与える影響があいまいなとき、利己的な人も向社会的な人も、自分の選択をよく見せる方向に影響の見積もりを歪め、しかも利己的な歪みは他人に伝染してその人をより利己的にすることを、9つの事前登録実験（8,769人）で示した（抄録）。", "p2": "人は自分の行動の社会的な結果を正確には知らないまま行動することが多いが、そのあいまいさを利用して自分を良く見せるために結果の解釈を歪めるのか、歪みが他人の判断にどう伝わるのかは明らかでなかった（Main）。", "p3": "決定者は、自分が7点得る選択肢A（相手の受取は1〜3点のどれか）と、自分が5点得る選択肢B（相手は3〜5点のどれか）のどちらかを選び、その後で相手の受取を見積もる（Results、図1a）。自分の得は確実だが相手への影響は幅しか分からないという、現実の社会的決定の不均衡を再現している。見積もりが範囲の中点や他の群からどれだけずれるかを歪みとして測った。", "p4": "利己的な選択者（A）と向社会的な選択者（B）、両方の利益が一致する中立条件の見積もりを比べ、選択前の見積もり、強制された選択、明示的なあいまいさの説明でも同じ歪みが出るかを確かめた（Results）。実験6では、前の参加者（影響者）の見積もりを見せる4条件を比べ、追随者の見積もりと選択が変わるかを測った。", "p5": "利己的な選択者は2つの選択肢の相手への影響を、向社会的な選択者よりも似たものとして報告した（実験1a：b=0.24、95%信頼区間0.14〜0.34）（図1c）。向社会的な選択者は自分の選択を比較的より有益と描き、暗黙の自己犠牲も誇張したが、それほど一貫しなかった（抄録）。歪みは選択前や選択を強制した場合にも見られ、正当化だけでは説明できなかった。利己的な方向の歪みを見せられた追随者はより利己的になった（実験6：b=0.49、0.10〜0.88）が、向社会的な歪みには同様の影響は見られなかった（抄録、Results）。", "p6": "著者は、範囲の中点からのずれを歪みとみなすのは一様分布を仮定した場合に限られること、抽象的な課題で現実の場面への外挿に限界があること、「利己的」「向社会的」は動機ではなく利得の構造を指すこと、評価が信頼性のみであること、主に米国の英語話者の標本であることを限界に挙げる（Limitations）。", "fun": "自分が多めにもらう選択をした人は「相手の取り分はどっちを選んでも大差ないよ」と見積もり、自分が損を引き受けた人は「相手のためになった」と見積もる。どちらも自分を良く見せる方向に世界の見え方を曲げていた。しかも「どっちでも大差ない」という言い訳は他の人にうつり、その人まで自分勝手にしてしまう、という点が考えさせられる。", "unverified": "実験2〜5の各推定値と、信頼性の評価（実験5）の詳細な結果は確認していない。"}}, {"id": "jn13", "rank": 13, "field": "経営学", "headline": "原告の匿名化で和解と訴訟はどう変わったか", "title": "Does Privacy Matter? Evidence from a Legal Reform", "url": "https://doi.org/10.1287/mnsc.2025.00107", "authors": "Liran Einav ほか", "venue": "Management Science", "date": "2026-10-01", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "人身傷害訴訟の判決で原告を匿名化した法改正を利用し、プライバシーの喪失が和解の判断に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "イスラエルで人身傷害訴訟の判決で原告を匿名化した2015年8月の法改正を利用し、プライバシーの喪失を避けるために人々がどれだけの金銭的な代償を払っていたかを、和解金の変化から推定した（抄録）。", "p2": "改正前は、和解の申し出を断って裁判に進むと、判決で健康や収入などの機微な情報が公開される危険があった（抄録）。プライバシーへの配慮が現実の交渉の結果にどれだけ影響するかは、実証的に測りにくかった。", "p3": "2011〜2020年にイスラエルの大手保険会社が扱った自動車事故の請求で、改正の影響を受ける人身傷害の支払いと、影響を受けない物損の支払いを比べる差の差分法で推定した（抄録）。解釈：物損は改正の前後でプライバシーの条件が変わらないので、両者の変化の差を改正の効果とみなせる。", "p4": "改正前後の人身傷害と物損の請求に対する支払額の変化を比べた（抄録）。標本規模と統制変数は未確認（本文を入手できず）。", "p5": "改正により人身傷害の請求に対する支払いは12〜17%増えた（抄録）。著者はこれを、原告が判決による私的情報の公開を避けるために、以前は低い和解金という形で負担していた暗黙の費用と解釈する（抄録）。", "p6": "限界は未確認（本文を入手できず）。著者は、機微な情報が関わる顧客とのやりとりでのプライバシーの重要性を示すと述べる（抄録）。解釈：改正と同時期に人身傷害の請求に特有の他の変化がなかったかが、差の差分法の仮定の要になる。", "fun": "事故の損害賠償で裁判に進むと、判決文に自分の病気や収入が載ってしまう。そこで人々は、本来より安い和解金でがまんしていたらしい。判決で名前を伏せる法改正の後、和解金は12〜17%上がった。プライバシーにはっきり値段がついていたことを、自然の実験から測った点が面白い。", "unverified": "本文を入手できず、標本の件数、平行トレンドの確認、推定の頑健性は確認できなかった。"}}, {"id": "jn14", "rank": 14, "field": "計算社会科学・ネットワーク科学", "headline": "船舶位置データで紛争海域の寄港機会を推定", "title": "AIS-derived port-calling opportunity modelling in conflict-affected waters", "url": "https://doi.org/10.1140/epjds/s13688-026-00699-2", "authors": "Michael van Ginkel", "venue": "EPJ Data Science", "date": "2026-10-01", "citescore": 5.3, "citescore_year": "2025", "why": "船舶自動識別装置の長い欠測がある紛争海域で、航跡データから寄港の機会をモデル化して異常な船舶行動を検出する方法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトのページを取得したが本文の大部分は含まれておらず（データの入手方法・略語・謝辞など）、抄録の範囲で書いた", "preprint": false, "p1": "紛争下の黒海東部で、船舶自動識別装置（AIS）の信号が長く途切れる船の航跡から、その間に寄港した可能性を推定するモデル（DPCOM）を作り、異常の集中地点と結びつけて、信号の消失の繰り返しパターンを特定した（抄録）。", "p2": "ジョージアのアブハジアやウクライナ東部の占領地域をめぐる長期の紛争で、黒海の海上の運航環境は複雑になっている（抄録）。そこでは船がAISの発信を長時間止めると動きが見えなくなり、異常な船舶行動の検出が難しかった。", "p3": "2018年の黒海東部の2,700万件超のAIS信号を使い、長い信号の空白に関連して寄港がありえた機会を見つける離散的な寄港機会モデル（DPCOM）と、格子に基づく統計的な枠組みを組み合わせ、その空間分布を評価した（抄録）。解釈：信号が消えた地点と再び現れた地点、その間の時間から、その間にどの港に寄れたかを推定する考え方である。", "p4": "DPCOMで選ばれた航跡が、統計的に有意な異常の集中地点（ホットスポット）とどれだけ結びつくかを評価した（抄録）。比較の対象や指標の詳細は未確認（本文を入手できず）。", "p5": "DPCOMが選んだ航跡は統計的に有意な異常のホットスポットと強く結びつき、AIS信号の消失の繰り返しのパターンが特定された（抄録）。数値の詳細は未確認。", "p6": "限界は未確認（本文を入手できず）。著者は、長いAISの空白を分析する再現可能な枠組みを示し、紛争下の沿岸域の海洋状況把握への大規模な行動分析の価値を強調する（抄録）。解釈：信号の空白が寄港による制裁回避なのか、受信範囲の問題なのかの区別には外部の検証情報が要る。", "fun": "船は位置を知らせる電波（AIS）を出す決まりがあるが、紛争地の近くではわざと電波を消す船がいる。消えた場所と再び現れた場所、その間の時間から「この間にどこかの港に寄れたはずだ」と推理し、怪しい動きが集まる海域を地図に浮かび上がらせた。見えない航海を、見えている部分から推理する探偵のような分析が面白い。", "unverified": "本文を入手できず、DPCOMの定義、ホットスポットの検定方法、結果の数値は確認できなかった。"}}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "徴兵による人手不足が産業革命の機械化を促した", "title": "Fighting for Growth: Labor Scarcity and Technological Progress during the British Industrial Revolution", "url": "https://doi.org/10.1257/aer.20240393", "authors": "Hans-Joachim Voth ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "ナポレオン戦争期の海軍徴募を操作変数に、労働力不足が省力化機械の導入を促したことを産業革命期のイングランドで示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ナポレオン戦争期の英国で、徴募による労働力不足が省力化の機械の導入を促したことを、軍艦の沿岸への接近のしやすさを操作変数にして因果的に示した（抄録）。", "p2": "労働の希少さが省力化技術の採用を促し、産業革命を後押ししたという仮説は古くからあるが、労働の希少さの外生的な変動を見つけにくく、因果の検証が難しかった（抄録）。", "p3": "ナポレオン戦争期には男性人口の10%超が軍に従事し、地域によって徴募の強さが異なった（抄録）。海軍の徴募を、軍艦が沿岸に近づけるかどうかで操作変数にして、労働力不足と機械の採用の関係を推定した（抄録）。解釈：軍艦が寄れる沿岸かどうかは、その地域の産業の事情とは無関係に徴募の強さを左右したと考えられる。", "p4": "徴募の強い地域と弱い地域で、労働を節約する機械の採用の多さを比べ、機械の技能が豊富な地域で効果が大きいかを調べた（抄録）。データの出所は未確認（本文を入手できず）。", "p5": "徴募が多かった地域ほど労働を節約する機械が多く採用され、操作変数による推定も、労働力不足と採用の関係が因果的であることを示唆した（抄録）。機械の技能が豊富な地域では、労働力不足が採用に与える影響が大きかった（抄録）。", "p6": "限界は未確認（本文を入手できず）。解釈：軍艦の接近のしやすさが、港や交易を通じて徴募以外の経路で機械化に影響していないかという除外制約が、結論の要になる。", "fun": "ナポレオンとの戦争の時代、英国の男性の1割以上が兵隊にとられた。人手が足りなくなった地域ほど、人の代わりに働く機械を多く入れていた。しかも軍艦が近づける海岸かどうか、という地理の偶然を使って因果関係を確かめた。戦争が産業革命を後押しした、という意外なつながりが面白い。", "unverified": "本文を入手できず、機械の採用の測り方、推定値の大きさ、除外制約の検討は確認できなかった。"}}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "価格と品質で同時に差別する独占の消費者余剰", "title": "Screening and Segmenting: A Consumer Surplus Perspective", "url": "https://doi.org/10.1257/aer.20250206", "authors": "Dirk Bergemann ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "第2種と第3種の価格差別を同時に行う独占企業について、消費者に最適な市場分割の構造を特徴づけた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "独占企業が市場の区分ごとに価格と品質の両方を変えられる（第2種と第3種の価格差別を同時に行う）とき、消費者余剰を最大にする区分け方を特徴づけ、区分けが消費者を害する条件を示した理論論文（抄録）。", "p3": "価格と品質のメニューで客を選別する第2種の価格差別と、市場を区分する第3種の価格差別を組み合わせたモデルで、消費者にとって最適な区分けを理論的に導いた（抄録）。", "p5": "消費者に最適な区分けでは、同じ評価額の消費者はどの区分でも同じ品質を受け取り、価格だけが異なる（抄録）。緩い条件の下で、需要が供給より十分に弾力的であるときに限り、どんな区分けも消費者を害すると示した（抄録）。", "fun": "同じ商品でも客によって値段や品質を変える「価格差別」は、客にとって損か得か。この研究は、同じ価値を感じる客には同じ品質を渡し、値段だけを変えるのが客にとって最善の分け方だと示した。損得は、値段の変化に客と作り手がどれだけ敏感かで決まるという結論がきれいだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "注目の経済をデータと発見の動学で描く", "title": "A Model of the Attention Economy: Data, Platforms, and Discovery", "url": "https://doi.org/10.1257/aer.20240651", "authors": "Daniel Chen", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "無料サービスで注目を集めて広告を売るプラットフォームと、限られた認知のもとでの製品市場を結ぶ扱いやすい動学モデルを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "消費者が企業を限られた範囲でしか知らない製品市場と、プラットフォームが無料サービスで注目を集め、好みのデータでターゲット広告を売る注目市場をつないだ、注目経済の動学モデルを示した（抄録）。", "p3": "プラットフォームの投資、広告による発見、製品の需要、広告収入が同時に決まる扱いやすい枠組みを作り、データと相互運用性の政策の効果を分析した（抄録）。", "p5": "データと相互運用性の政策の効果は時間とともに逆転しうること、プラットフォームの品質は非効率に高くも低くもなりうること、データの豊富なデジタル広告の台頭が広告収入の対GDP比の低下と同時に起こりうることを示した（抄録）。", "fun": "SNSや動画配信が無料なのは、私たちの「注目」を集めて広告主に売っているからだ。この論文はその仕組みを数式のモデルにして、データを使った広告が広がっても、経済全体に占める広告収入の割合はむしろ下がりうることを示した。直感に反する結論が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "戦略的でない当事者からの真実の引き出し方", "title": "Truth Elicitation in a Nonstrategic Environment", "url": "https://doi.org/10.1257/aer.20251879", "authors": "Jacob Glazer ほか", "venue": "American Economic Review", "date": "2026-10-01", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "why": "当事者が既知の手順でごまかす状況で、主体が文言を工夫して真の状態を引き出す実装の条件を示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "誰が賞に値するかを決める主宰者が、状態を知る当事者たちから真実を引き出す仕組みを、当事者が戦略的に振る舞わない環境で設計した理論論文（抄録）。", "p3": "主宰者は各当事者に「どんな条件ならその当事者が賞に値するか」を書いた文章を渡して状態を報告させ、各当事者は状態と文章に依存する既知の「ずる」の手順に従うと想定した（抄録）。", "p5": "主張が食い違うとき、「相手の話が本当なら自分の話は作れなかったはずの唯一の当事者が正直者だ」という一方向のずるの原理で嘘つきを特定でき、実装が達成されると示した（抄録）。", "fun": "二人の言い分が食い違うとき、どちらが嘘をついているかをどう見抜くか。この論文は、もし相手の話が本当だったら自分には作れなかったはずの話をしている方が正直者だ、という原理で嘘つきを特定する仕組みを考えた。推理小説のような発想を経済理論にしている点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "社会的責任は政治問題化した", "title": "The Politicization of Social Responsibility", "url": "https://doi.org/10.1111/jofi.70093", "authors": "TODD A. GORMLEY ほか", "venue": "The Journal of Finance", "date": "2026-10-01", "sjr": 22.27, "citescore": 16.8, "citescore_year": "2025", "why": "機関投資家が共和党優位の州に本社を置く企業の環境・社会提案を支持しにくくなったことを示し、州の政権交代とも連動することを明らかにした。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "共和党が主導する州に本社がある企業では、機関投資家が環境・社会に関する株主提案を支持しにくく、その傾向が近年強まっていることを示した（抄録）。", "p3": "機関投資家の株主提案への投票を、本社のある州の政治的な主導権、政治家が企業の社会的責任を強調した時期、州の補助金や税優遇の受給と関連づけ、同じ州の中での主導権の交代による変化も分析した（抄録）。", "p5": "支持の低下は近年と、州の補助金や税優遇を受ける企業で顕著で、同じ州で民主党ではなく共和党が主導するとき支持は12ポイント下がった（抄録）。機関投資家は株主価値の最大化を優先し、政治家は提案の価値への影響を変えることで投票を左右しうると解釈した（抄録）。", "fun": "環境や社会のための株主提案に大きな投資家が賛成するかどうかは、会社の本社がある州の政治で変わっていた。同じ州でも共和党が主導すると、賛成が12ポイント下がる。お金のプロも、政治で損得が変われば票を変えるという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "スイスの物価データで価格改定の頻度を追う", "title": "Price Setting before and during the Pandemic: Evidence from Swiss Consumer Prices", "url": "https://doi.org/10.1111/jmcb.70095", "authors": "BARBARA RUDOLF ほか", "venue": "Journal of Money, Credit and Banking", "date": "2026-10-01", "sjr": 1.999, "citescore": 3.7, "citescore_year": "2025", "why": "2008年から2025年のスイス消費者物価の個票で、価格改定の頻度と物価上昇の関係をパンデミック前後で分析した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "2008〜2025年のスイスの消費者物価指数のミクロデータで、価格の硬直性の新しい特徴を記録し、それがインフレの動きに与える意味を評価した（抄録）。", "p3": "価格改定の頻度と大きさを品目ごとに追い、オンラインでの価格収集への切り替えを使ったイベントスタディで因果を識別し、非線形の局所射影で全体的なショックへの反応を分析した（抄録）。", "p5": "パンデミック前の十年間に改定の頻度が上がり、その原因はオンライン収集への移行だった（抄録）。パンデミック中は全体の頻度の反応は小さかったが品目間の差は大きかった。企業は主に改定の大きさで反応したが、価格の柔軟性が高いときなどは頻度でも反応し、金融政策の非中立性が下がった（抄録）。", "fun": "商品の値段はどのくらいの頻度で変わるのか。スイスの2008〜2025年の物価のデータを調べると、ネットで値段を集める品目が増えたことで、値段の改定が増えていた。パンデミックのような大きな出来事のとき、店は値上げの回数より幅で対応していた点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "原単位型の排出量取引で施設は削減したか", "title": "Emissions abatement under a rate-based emissions trading system: facility-level evidence from China", "url": "https://doi.org/10.1016/j.jpubeco.2026.105797", "authors": "Yifei Quan ほか", "venue": "Journal of Public Economics", "date": "2026-10-01", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "why": "中国の原単位型排出量取引制度のもとでの排出削減を施設単位で検証した研究。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかったSSRN版（Crossref登録）の抄録を使用。誌上版と異なる可能性がある", "preprint": false, "short": true, "p1": "世界最大の排出量取引制度である中国の全国ETSは、排出原単位に基づく割当という独特の設計のもとで、規制対象の発電ユニットのCO2排出を2.3%減らしたことを、施設レベルのデータで示した（抄録）。", "p3": "独自の施設レベルのデータと連続的な差の差の枠組みで、割当が余る「勝ち組」ユニットと不足する「負け組」ユニットを含めて効果を推定した（抄録）。", "p5": "削減は主に、不足ユニットから余剰ユニットへの発電量の付け替えによるもので、ユニット内の効率改善や燃料転換によるものではなかった（抄録）。付け替えは同じ地域の電力網や同じ親会社のユニット間で顕著で、大気汚染の削減という副次的な便益もあった（抄録）。", "fun": "中国の排出量取引は、発電量あたりの排出で枠を配る珍しい仕組みだ。調べると、CO2は2.3%減ったが、それは各発電所が効率を上げたからではなく、効率の良い発電所に発電を回したからだった。制度の設計が企業の行動をどう変えるかがよく分かる。", "unverified": "誌上版の本文を読んでいないため、SSRN版との違い、データの範囲、推定の詳細は未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "評判を守るための和解か抗戦かの選択", "title": "To Settle or Not to Settle: Defending Firm Reputation in Litigation Response", "url": "https://doi.org/10.1177/01492063261487124", "authors": "Fei Li ほか", "venue": "Journal of Management", "date": "2026-10-01", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "企業が訴訟で和解するかどうかを、法的・経済的要因だけでなく利害関係者の期待と評判の観点から説明した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "特許訴訟で、革新性の評判が高い企業ほど和解しにくいことを示し、訴訟への対応に評判の考慮が働くことを明らかにした（抄録）。", "p3": "利害関係者が企業に抱く状況的な期待という理論的メカニズムから仮説を立て、特許訴訟での和解の有無を企業の革新性の評判と関連づけて分析した（抄録）。データの期間と件数は抄録にない（未確認）。", "p5": "革新性の評判は和解の確率の低さと関連し、この関係は業界の革新の強度と原告の種類によって変わった（抄録）。", "fun": "特許で訴えられたとき、お金を払って早く和解するか、最後まで戦うか。調べると、「革新的な会社」という評判がある企業ほど和解しにくかった。周りの期待を裏切らないように、目先の損得だけでなく評判を守る判断をしているという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "研究開発より共創が中小企業の環境革新を生む", "title": "Co‐Creation Over R&D: External Knowledge as the Engine of Green Innovation in Italian SMEs", "url": "https://doi.org/10.1002/bse.71585", "authors": "Angela Stefania Bergantino ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-01", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "イタリアの中小企業で、需要側・供給側の主体との共創が環境成果と経済成果の両方に結びつくかを検証した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "イタリアの6646社の調査データで、需要側・供給側の相手との共創や外部の後押しがグリーン・イノベーションと強く関連し、社内の研究開発の強度には有意な直接の関連がないことを示した（抄録）。", "p3": "CDMモデルに着想を得た2段階の計量経済学の枠組みで、共創、デジタル技術、政府の支援、グリーン・イノベーション、企業の業績の関連を推定した（抄録）。", "p5": "共創と外部の後押しはグリーン・イノベーションと強く関連し、グリーン・イノベーションは企業の業績とも正に関連した（抄録）。社内の研究開発の強度は直接の関連がなく、組織の能力が育ったときに補完的になると解釈した（抄録）。", "fun": "中小企業が環境にやさしい新製品を生み出すのに大事なのは、自社の研究開発費より、客や取引先と一緒に作る関係だった。イタリアの6646社を調べた結果だ。小さな会社ほど「つながり」が技術の源になるという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn24", "rank": 24, "field": "開発経済学", "headline": "機械学習で食料援助の効果の異質性を探る", "title": "Machine learning and heterogeneity in food aid impacts: Foundations for improved targeting", "url": "https://doi.org/10.1016/j.jdeveco.2026.103926", "authors": "Mai Mahmoud ほか", "venue": "Journal of Development Economics", "date": "2026-09-29", "citescore": 8.2, "citescore_year": "2025", "why": "食料援助の効果の異質性を機械学習で推定し、援助対象の選定の改善につなげる研究（題名から判断）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、食料援助の効果が受け手によってどう異なるか（異質性）を機械学習で分析し、援助の対象をより良く絞り込むための基礎を示した論文（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "食料の援助は、誰に届けるかで効果が大きく変わるかもしれない。この研究は、機械学習を使って「どんな家庭で援助が特に効くのか」を見つけ、限られた援助をより必要な人に届ける方法の土台を作ろうとした。結果は抄録が得られず未確認。", "unverified": "抄録・本文を入手できず、対象、手法、結果はすべて未確認。"}}, {"id": "jn25", "rank": 25, "field": "開発経済学", "headline": "教師の性別ステレオタイプの長期的な影響", "title": "The long-term effects of teachers’ gender stereotypes on labor outcomes", "url": "https://doi.org/10.1016/j.jdeveco.2026.103917", "authors": "Joan J. Martínez", "venue": "Journal of Development Economics", "date": "2026-09-30", "citescore": 8.2, "citescore_year": "2025", "why": "教師の持つ性別ステレオタイプが生徒の将来の労働成果に長期的に及ぼす影響を扱う研究。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかったSSRN版（Crossref登録）の抄録を使用。誌上版と異なる可能性がある", "preprint": false, "short": true, "p1": "教師の性別ステレオタイプに基づく評価が、高校卒業後の収入と正規部門での雇用の男女差を広げ、男性には長く続く正の効果、女性には比較的短期の負の効果をもたらすことを示した（抄録）。", "p3": "高校の間にステレオタイプ的な評価にさらされた程度と、その後の卒業・雇用・労働時間・収入を結びつけ、調査で集めた潜在連合テスト（IAT）の得点で生徒の内面化を調べた（抄録）。対象の国、データ、識別の方法は抄録にない（未確認）。", "p5": "評価への曝露は、青年後期から成人初期の女性の卒業、雇用、労働時間、収入に不釣り合いに影響し、男女とも数学と言語の能力についてのステレオタイプを内面化していた（抄録）。ステレオタイプを持つ教師は女性が男性中心の職業に進むのを妨げたが、大学への出願や進学への影響は男女とも見られなかった（抄録）。", "fun": "「男子は数学、女子は国語が得意」と思い込んだ先生に教わると、卒業後の仕事や収入にまで男女の差が広がっていた。生徒自身もその思い込みを身につけてしまう。先生の何気ない評価が、何年も先の人生に影を落とすことを示した研究だ。", "unverified": "誌上版の本文を読んでいないため、対象の国、データ、識別の方法、効果の大きさは未確認。"}}, {"id": "jn26", "rank": 26, "field": "計算社会科学・ネットワーク科学", "headline": "適応系の組織原理としての信号の重みづけ", "title": "Signal weighting as an organizing principle of adaptive systems", "url": "https://doi.org/10.1093/pnasnexus/pgag333", "authors": "Duncan Bruce Sutherland ほか", "venue": "PNAS Nexus", "date": "2026-10-01", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "why": "免疫・神経・生態など多様な適応系に共通する原理として、文脈に応じた信号の重みづけを提案した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "免疫、宿主とマイクロバイオーム、神経系、生態系の調節など多様な適応システムに共通する組織原理として、文脈に応じて信号の影響力を調整する「信号の重みづけ」という概念的な枠組みを提案した（抄録）。", "p3": "信号をふるい分け、増幅し、減衰させ、過去の相互作用と系の状態に基づいて反応を再帰的に調整する過程として信号の重みづけを定義し、免疫のパターン認識や宿主とマイクロバイオームの相互作用を例に論じた概念的な論文（抄録）。実証データは抄録に示されていない（未確認）。", "p5": "相互作用する系の境界を越えて重みづけの過程が結合すると、個々の要素を越えた協調した振る舞いが安定し、より高次の適応的な単位が生まれうると論じた（抄録）。適応的な組織化は変異への選択だけでなく、乱れに耐える相互作用の再帰的な安定化からも生じるとした（抄録）。", "fun": "体の免疫は、たくさんの信号の中から「どれが大事か」を選び、強めたり弱めたりして働いている。この論文は、同じような「信号の重みづけ」が、腸内細菌や脳や生態系にも共通する生き物の基本原理だと提案した。生物学のばらばらな分野をつなぐ大きな見取り図として面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn27", "rank": 27, "field": "計算社会科学・ネットワーク科学", "headline": "ウクライナ戦争への国際的関心の心理的推移", "title": "A complex arc of engagement: Shifting psychological trajectories of international solidarity during sustained geopolitical conflict", "url": "https://doi.org/10.1111/pops.70200", "authors": "Vivian P. Ta‐Johnson ほか", "venue": "Political Psychology", "date": "2026-10-01", "sjr": 1.938, "citescore": 7.6, "citescore_year": "2025", "why": "120万件超の英語の投稿の言語分析で、長期化する紛争への国際的な連帯の関与・感情・心理的距離の推移を描いた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ロシア・ウクライナ戦争の最初の10か月に投稿された百二十万件以上の英語のツイートの言語を分析し、国際的な聴衆の心理的な関与が、強い関与と否定的な感情から、注意の疲れと慢性的な危機への適応へと移ることを示した（抄録）。", "p3": "関与、感情、実存的な関心、認知、心理的距離を投稿の言語から測り、その時間的な変化を調べた（抄録）。使った辞書や統計モデルの詳細は抄録にない（未確認）。", "p5": "初期は活発な関与、否定的感情の高まり、死・紛争・道徳への注目、出来事を理解しようとする認知的な努力が目立った。戦争が続くと、短い投稿、少ないリツイート、単純な感情と認知の表現に変わった（抄録）。意外にも心理的距離は時間とともに縮み、より個人的で自然な表現になった（抄録）。", "fun": "遠い国の戦争に、人々の心はどう反応し続けるのか。百二十万件以上のツイートを調べると、最初は怒りや死への関心が強かったが、だんだん投稿が短くなり、関心が薄れたように見えた。ところが言葉はむしろ身近で個人的になっていた。関心が消えたのではなく形を変えたという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn28", "rank": 28, "field": "計算社会科学・ネットワーク科学", "headline": "宿敵同士の連立は隣の自治体から広がる", "title": "The making of strange bedfellows: spatial diffusion in unorthodox coalition building", "url": "https://doi.org/10.1017/s1475676526101741", "authors": "Gissur Ó Erlingsson ほか", "venue": "European Journal of Political Research", "date": "2026-10-01", "sjr": 3.432, "citescore": 8.2, "citescore_year": "2025", "why": "イデオロギーの離れた政党の連立が、近隣の成功例からの学習で空間的に拡散することを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "スウェーデンの地方政治で、社会民主党と穏健党という宿敵どうしの連立が、近隣で同様の連立が成功した例から学ぶ形で空間的に広がったことを示した（抄録）。", "p3": "1994〜2022年の8回の地方選挙をカバーする独自のパネルデータで、周辺地域で非典型的な連立にさらされることが同様の連立の形成確率を高めるかを、補対数対数（complementary log-log）回帰で検証した（抄録）。", "p5": "かつてほぼ考えられなかった両党の協力は、今では290自治体のほぼ5分の1で行われている（抄録）。前の任期に同様の連立があった行政区域では両党の連立が有意に生まれやすく、階層的な地域の伝染の明確な証拠が得られた（抄録）。", "fun": "犬猿の仲の二つの政党が、地方では手を組むことがある。スウェーデンの290の自治体を1994〜2022年の選挙で追うと、近くで「宿敵との連立」がうまくいくと、それをまねる町が増えていった。政治の常識が隣から隣へ広がっていく様子が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn29", "rank": 29, "field": "統計学", "headline": "血清調査の標本設計と級内相関", "title": "Design considerations for incorporating serological monitoring into trachoma prevalence surveys", "url": "https://doi.org/10.1093/aje/kwag245", "authors": "Everlyn Kamau ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-30", "citescore": 7.1, "citescore_year": "2025", "why": "40の有病率調査の血清データから級内相関を推定し、血清転換率を推定するための必要標本数を初めて体系的に評価した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "トラコーマの有病率調査に血清学的な監視（乾燥血液スポットの採取）を組み込むときに必要な標本の大きさと調査設計を、40の調査のデータから評価した（抄録）。", "p3": "40の調査の血清データから血清陽性率のクラスター内相関係数を推定し、運用上の血清転換率（SCR）の閾値（100子ども年あたり2.2［対応不要］と4.5［対応必要］）を想定して、42の2段階の設計で推定の精度と検出力を評価した（抄録）。", "p5": "SCRが100人年あたり1.5以下または5.7を超えるとき、標本数300〜2000でSCRを良い精度で推定できた（抄録）。30クラスター・各30世帯の標準的な調査で、SCR 1.2以下が2.2の閾値を下回ること、5.7以上が4.5を上回ることを80%以上の検出力で判断できると見込んだ（抄録）。", "fun": "目の感染症トラコーマがなくなったかを確かめるには、血液に残る「感染の跡」を調べる方法がある。では何人分の血液を集めればよいのか。この研究は40の調査のデータを使い、30の地区で各30世帯を調べる標準的な調査で十分だと示した。根絶の確認を支える地道な設計の話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn30", "rank": 30, "field": "因果推論", "headline": "まれな腫瘍の成長率推定の偏りを定量化", "title": "Evaluating potential sources of bias in linear growth rate analysis of renal tumors: case study in Von-Hippel Lindau disease", "url": "https://doi.org/10.1093/aje/kwag225", "authors": "Cathy Anne Pinto ほか", "venue": "American Journal of Epidemiology", "date": "2026-10-01", "citescore": 7.1, "citescore_year": "2025", "why": "希少疾患の自然歴研究で、腫瘍の線形成長率の推定に入りうる偏りを定量的バイアス分析で評価した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "希少な遺伝性疾患であるフォン・ヒッペル・リンドウ病（VHL）の腎細胞がんで、腫瘍の線形成長率（LGR）の推定にかかわる2つの偏りを検討し、混合効果モデルの縮小による偏りで成長率が過小に見積もられている可能性を示した（抄録）。", "p3": "過去の自然歴研究のコホート（患者244人、標的腫瘍601個）で、追跡の差による選択バイアスを定量的バイアス分析（QBA）で、頻度論的な線形混合効果モデルによる縮小の偏りをベイズ分析で調べた（抄録）。", "p5": "元の腫瘍ごとの成長率の中央値は年1.6 mmで、QBAによる補正後は年1.7 mmと選択バイアスの影響は小さかった（抄録）。ベイズモデルでは年3.93 mmとなって外部の報告とよく合い、手術で摘出された腫瘍は頻度論的な方法が示すより速く成長していたことが示唆された（抄録）。", "fun": "珍しい病気ではデータが少なく、統計の方法の選び方で結論が大きく変わる。腎臓の腫瘍が大きくなる速さを調べ直すと、よく使われる方法では年1.6 mmだったのが、別の方法では年3.93 mmと倍以上になった。数字の裏にある「計算の仕方」の大切さがよく分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn31", "rank": 31, "field": "因果推論", "headline": "ロボット股関節置換を登録データで模擬試験", "title": "Early national comparison of robotic versus conventional hip replacements for arthritis using National Joint Registry data: target trial emulation study", "url": "https://doi.org/10.1136/bmj-2026-100709", "authors": "Hasan R Mohammad ほか", "venue": "BMJ", "date": "2026-10-01", "citescore": 8.9, "citescore_year": "2025", "why": "約67万件の人工股関節置換の全国登録データで標的試験模倣を行い、ロボット支援手術の早期成績を比べた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "英国の全国人工関節登録のデータで、ロボット支援と従来の人工股関節全置換術（THR）を比べ、5年のインプラント生存や患者の生存に差はないが、位置不良による再置換はロボット群で少ないことを示した（抄録）。", "p3": "2018〜2024年の666,283件（従来656,080件、ロボット10,203件）で標的試験のエミュレーションを行い、傾向スコアのマッチング、カプラン・マイヤー法、Cox回帰、Fine–Grayモデルで比べた（平均追跡2.5年）（抄録）。", "p5": "5年のインプラント生存率は両群とも98.8%で、再置換のリスクに差はなかった（ハザード比0.96、P=0.73）（抄録）。位置不良（脱臼・脚長差・アライメント不良）による再置換はロボット群で低かった（ハザード比0.53、P=0.03）。5年の患者生存率は96.3%と96.2%で差はなかった（抄録）。", "fun": "ロボットに手伝ってもらう股関節の手術は、昔ながらの手術より良いのか。666,283件の手術を比べると、5年後に人工関節が使えている割合はどちらも98.8%で同じだった。ただ、関節の位置のずれによるやり直しはロボットの方が少なかった。高価な機械の価値をどう評価するかが問われる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn32", "rank": 32, "field": "因果推論", "headline": "説明可能で因果を考慮した干ばつ遷移の機械学習", "title": "An Explainable and Causally Informed Machine Learning Framework for Hydrological Drought Transitions, Propagation, and Vulnerability", "url": "https://doi.org/10.1016/j.watres.2026.127052", "authors": "Jiwei Leng ほか", "venue": "Water Research", "date": "2026-10-01", "sjr": 3.701, "citescore": 21.6, "citescore_year": "2025", "why": "水文学的干ばつの遷移と伝播を、因果の情報を取り入れた説明可能な機械学習で扱う研究（題名から判断）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、水文学的な干ばつの移り変わり、伝播、脆弱性を扱う、説明可能で因果の考え方を取り入れた機械学習の枠組みを提案した論文（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "雨が少ない状態が続くと、やがて川や地下水の水不足、つまり「水文学的な干ばつ」に移っていく。この研究は、干ばつがどう始まり広がるか、どこが弱いかを、理由まで説明できる機械学習で捉えようとした。結果は抄録が得られず未確認。", "unverified": "抄録・本文を入手できず、対象、手法、結果はすべて未確認。"}}, {"id": "jn33", "rank": 33, "field": "統計学", "headline": "平均ベクトルを監視する多変量ベイズ管理図", "title": "Some innovative multivariate Bayesian schemes for monitoring the mean vector with applications to monitoring production processes", "url": "https://doi.org/10.1080/00207543.2026.2739605", "authors": "Hongxing Cai ほか", "venue": "International Journal of Production Research", "date": "2026-10-01", "sjr": 2.215, "citescore": 18.1, "citescore_year": "2025", "why": "生産工程の平均ベクトルを監視する新しい多変量ベイズ管理図を提案する研究（題名から判断）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、多変量の平均ベクトルを監視するための新しいベイズ型の管理方式をいくつか提案し、生産工程の監視に応用した論文（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "工場では、製品の寸法や重さなど複数の値を同時に見張り、異常が起きたらすぐ気づく必要がある。この研究は、ベイズ統計の考え方を使って、複数の値の平均のずれを見張る新しい方法を考え、生産の現場に当てはめようとした。結果は抄録が得られず未確認。", "unverified": "抄録・本文を入手できず、対象、手法、結果はすべて未確認。"}}, {"id": "jn34", "rank": 34, "field": "機械学習", "headline": "液体クロマトの保持時間を転移可能に予測", "title": "Times are changing but order matters: transferable prediction of small-molecule liquid chromatography retention times", "url": "https://doi.org/10.1038/s41592-026-03243-2", "authors": "Fleming Kretschmer ほか", "venue": "Nature Methods", "date": "2026-10-01", "sjr": 15.624, "citescore": 40.0, "citescore_year": "2025", "why": "装置ごとに大きく変わる保持時間ではなく保持の順序に着目し、対象装置の学習データなしで転移できる予測を目指した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "逆相の液体クロマトグラフィーで、まず条件を考慮した溶出順の指標を機械学習で予測し、次にそれを絶対的な保持時間に写す2段階の方法「2-step」で、対象のシステムの訓練データなしに保持時間を予測できるようにした（抄録）。", "p3": "同じ名目の条件でも保持時間は大きく変わるが溶出の順序は比較的保たれるという点に着目し、溶出順の指標の予測と、保持時間への写像という2つの課題を切り離した（抄録）。どの条件で溶出順が大きく変わるかも系統的に調べた（抄録）。", "p5": "課題を切り離すことで、クロマトグラフィーの条件と化合物の種類をまたいだ移転可能な予測ができ、対象のデータで訓練した既存の方法を上回ったと報告した（抄録）。性能の数値は抄録にない（未確認）。", "fun": "薬や代謝物などの小さな分子を分ける装置では、分子が出てくるまでの時間が手がかりになるが、装置や条件が変わるとその時間は大きく変わる。この研究は、時間そのものではなく「出てくる順番」をまず当てることで、初めての装置でも時間を予測できるようにした。発想の転換が鮮やかだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "材料からデバイスまでをエージェントで設計", "title": "Agentic Modeling Framework for Materials‐to‐Device Cross‐Scale Design of Perovskite Solar Cells", "url": "https://doi.org/10.1002/aenm.71671", "authors": "Zhengzheng Dang ほか", "venue": "Advanced Energy Materials", "date": "2026-10-01", "sjr": 7.677, "citescore": 39.9, "citescore_year": "2025", "why": "材料計算とデバイス性能予測をつなぐ多段階の設計を、AIエージェントの枠組みで一体化した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ペロブスカイト太陽電池について、第一原理計算による材料の記述子の抽出から素子の性能の最適化までを閉ループでつなぐ、大規模言語モデル（LLM）駆動のエージェント型の枠組みを作った（抄録）。", "p3": "管理役のエージェントが、密度汎関数理論（DFT）による材料計算、ドリフト拡散による素子シミュレーション、素子構造のベイズ最適化を調整し、Model Context Protocol（MCP）で55の自作ツールや解析・シミュレーションのプログラムを呼び出せる技能として組み込んだ（抄録）。", "p5": "24の複数ターンのセッションと60のベンチマークのターンで、エージェントの合格率は96.7%で、OpenClaw（60.0%）を大きく上回った（抄録）。人が途中で確認できる仕組み、来歴の追跡、エラーからの回復も備えるとした（抄録）。", "fun": "太陽電池の研究では、材料の計算と電池全体のシミュレーションが別々に行われがちだ。この研究は、AIの「司令塔」が55の道具を使い分けて両方をつなぎ、試験の96.7%をこなした。研究の手順そのものをAIが回す時代の一例として面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "LLMは組合せ最適化の補完的な発見則を見つける", "title": "Large language models discover complementary heuristics for combinatorial optimization", "url": "https://doi.org/10.1038/s42256-026-01307-8", "authors": "Huatian Gong ほか", "venue": "Nature Machine Intelligence", "date": "2026-10-01", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "why": "LLMが組合せ最適化で互いに補い合う発見的解法を見つけることを示す研究（題名から判断）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、大規模言語モデルが、組合せ最適化の問題に対して互いに補い合う発見 : "Jack McGuire ほか", "venue": "Academy of Management Annals", "date": "2026-10-01", "sjr": 14.367, "citescore": 27.7, "citescore_year": "2025", "why": "畏敬の念を変容をもたらす感情として統合的に整理し、組織研究の課題を示す研究。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかったリポジトリ版の抄録（OpenAlex経由）を使用。誌上版と異なる可能性がある", "preprint": false, "short": true, "p1": "畏敬（awe）の研究を、集団的自己・認識・幸福の3つの視点に整理し、それらを統合する「畏敬の変態モデル」を提案して、経営・組織研究への含意と研究課題を示した統合的レビュー（抄録）。", "p3": "既存研究を3つの支配的な視点に分類し、畏敬がまず自己と非自己のスキーマを壊し、その後に組み立て直して心と自己を拡張するという変態モデルで統合した。畏敬を引き起こすものを認知・身体・社会・技術の4つの源に整理した（抄録）。", "p5": "畏敬を、アイデンティティ・認知・行動に影響する変容の感情として描き、リーダーシップ、仕事の設計、組織変革、意味づけ、イノベーションへの含意を論じ、個人・チーム・組織の各レベルでの研究課題を示した（抄録）。", "fun": "満天の星や大きな滝を見て、自分がちっぽけに感じる。この「畏敬」という感情が、職場の人を変える力を持つかもしれない。この論文は、畏敬がいったん自分の考えの枠を壊し、組み立て直して心を広げると説明した。感情を組織の変化と結びつける発想が面白い。", "unverified": "誌上版の本文を読んでいないため、レビューの対象範囲と文献の選び方は未確認。"}}, {"id": "jn42", "rank": 42, "field": "組織行動・心理的安全性", "headline": "有害な上司は部下の非倫理的な忠誠を生む", "title": "When Bad Leaders Create Worse Followers: How Toxic Leadership Breeds Employee Unethical Loyalty Through Stigma-by-Association Dynamics", "url": "https://doi.org/10.1007/s10551-026-06435-0", "authors": "Weili Zheng ほか", "venue": "Journal of Business Ethics", "date": "2026-10-01", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "why": "有害なリーダーシップが連座的な汚名を介して部下の非倫理的な忠誠行動を生む仕組みを扱う研究（題名から判断）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によると、有害なリーダーシップが「連座の汚名（stigma-by-association）」の力学を通じて、従業員の非倫理的な忠誠行動を生む仕組みを調べた論文（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "ひどい上司の下では、部下まで悪いことに手を染めることがあるのはなぜか。この研究は、上司の悪評が部下にも及ぶ「連座の汚名」を恐れて、部下が組織のために不正をしてでも忠誠を示そうとする仕組みを調べようとした。結果は抄録が得られず未確認。", "unverified": "抄録・本文を入手できず、対象、手法、結果はすべて未確認。"}}, {"id": "jn43", "rank": 43, "field": "組織行動・心理的安全性", "headline": "帰任者の居場所を取り戻す組織の支援", "title": "Rebuilding belonging: the role of organizational support in repatriates’ socio-professional reintegration amid global volatility", "url": nce", "date": "2026-10-01", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "古地磁気記録の限界を越え、海水準変動の四重極パターンから地質時代に速い真の極移動が起きた証拠を示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "大陸の浸水の復元から海水準の四重極の変動パターンを見つけ、地球が自転軸に対して全体として動く「真の極移動」が、過去に速い速度で長く続いた時期があったことを確かめた（抄録）。", "p3": "速い真の極移動は遠心力のポテンシャルの変化を通じて世界の海水準に特徴的な変動を生むという予測を、古地磁気とは独立の検証として、大陸の浸水の復元を使って調べた（抄録）。", "p5": "3.2億年前以降に複数の頑健な四重極のパターンを見つけ、長く続く速い真の極移動が起きたこと、地球の自転の力学、マントルの過程、地表の環境の結びつきが強く断続的でありうることを示した（抄録）。", "fun": "地球は、中身ごと自転軸に対して少しずつ傾きを変えている。今は年に約10センチだが、昔はもっと速く動いた時期があったのか。この研究は、大陸がどこで海に沈んだかの記録から、その証拠を見つけた。海の高さが地球全体の動きを語る点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn46", "rank": 46, "field": "社会学", "headline": "高リスク妊娠で高所得層は優位をどう保つか", "title": "The Production of Inequality in High-Risk Pregnancy", "url": "https://doi.org/10.1177/00031224261480143", "authors": "Anna Claire Church", "venue": "American Sociological Review", "date": "2026-10-01", "sjr": 3.277, "citescore": 9.0, "citescore_year": "2025", "why": "社会経済的に恵まれた人が構造的な優位を自分の健康の改善にどう変換するかを、高リスク妊娠の医療の場で明らかにした。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "妊娠糖尿病と診断された人への詳しいインタビューから、社会経済的に有利な人が、お金と柔軟な時間を使って厳格な治療に素早く効率よく対応し、健康上の有利さを保つ仕組みを明らかにした（抄録）。", "p3": "短期間に集中的な治療を要するハイリスク妊娠である妊娠糖尿病（GDM）と診断された人への詳細なインタビューを分析し、社会経済的な有利さが健康の有利さに変わる経路を調べた質的研究（抄録）。対象者の人数は抄録にない（未確認）。", "p5": "有利さは、健康に役立つ資源を買える余分な資金や、厳しい管理に充てられる柔軟な時間など複数の経路で健康の不平等を生んだ（抄録）。有利な人は治療指針を「期待以上に」守る過剰な順守を示し、医療者とのやり取りも質的に異なり、構造的な有利・不利を重ねていた（抄録）。", "fun": "同じ病気と診断されても、お金と時間に余裕がある人ほど、厳しい食事や血糖の管理を素早くこなせる。さらに医者とのやり取りまで変わっていた。妊娠中の糖尿病という短期の病気を通して、格差がどうやって健康の差に変わるかを描いた研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn47", "rank": 47, "field": "生命科学・医学", "headline": "黒色腫の術前療法の5年生存を統合解析", "title": "Five-year survival with neoadjuvant therapy in melanoma: updated pooled analysis from the International Neoadjuvant Melanoma Consortium (INMC)", "url": "https://doi.org/10.1038/s41591-026-04677-z", "authors": "Georgina V. Long ほか", "venue": "Nature Medicine", "date": "2026-10-01", "sjr": 17.496, "citescore": 73.9, "citescore_year": "2025", "why": "1,038人の統合データで、切除可能な悪性黒色腫に対する術前の免疫・標的療法の5年生存と下位集団の差を示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "切除可能なステージIIIB〜Dの悪性黒色腫で術前（ネオアジュバント）治療を受けた26施設の1,038人を統合解析し、免疫チェックポイント阻害薬（ICI）では5年の生存成績が良好で、特に病理学的な大きな奏効（MPR）を得た人で優れていたことを示した（抄録）。", "p3": "ICI（735人）、BRAF/MEK阻害薬（119人）、ICIと標的治療の併用（184人）を受けた患者の、MPR、無再発生存（RFS）、全生存（OS）を、試験内（755人）と試験外（283人）の両方のデータで比べた（抄録）。", "p5": "MPRはICIで57.8%、BRAF/MEK阻害薬で51.4%、併用で44.6%だった（抄録）。5年RFSはPD-1単独61.0%、PD-1と他の免疫薬73.9%、BRAF/MEK阻害薬37.4%、併用76.4%で、5年OSは83.3%、87.5%、69.8%、83.9%だった。MPRを得たICIの患者の5年OSは98.8%と97.9%で、術後のICIの継続による上乗せはなかった（抄録）。", "fun": "皮膚がんの一種である悪性黒色腫で、手術の前に免疫の薬を使うと、5年後の生存率がとても高かった。特に手術のときにがんがほぼ消えていた人では、約98%が5年後も生きていた。薬を使う順番を変えるだけで結果が大きく変わる点が印象的だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "data_related": [{"rank": 1, "headline": "8本の鋼梁で構造をまたぐ損傷位置推定を試す", "title": "MAHSC: Cross-Structure Vibration-Based Damage Localization Dataset (B1–B8 and B13–B16)", "url": "https://doi.org/10.5281/zenodo.23074490", "authors": "Karki, Anisha ほか", "venue": "Zenodo", "date": "2026-10-01", "summary": "長さ0.6〜1.4 m、断面と境界条件（片持ち・単純支持）の異なる8本の鋼梁の振動データ。各梁で亀裂位置8か所×損傷度5段階×20回の損傷試行800件と健全時20件を、4チャンネルの加速度計で1024 Hz記録。生の加速度信号、損傷位置・損傷度のラベル、梁の形状と境界条件、健全時の固有振動数を含み、構造を一つ抜く交差検証で論文の結果を再現するノートブックが付く。ライセンスはCC BY 4.0。関連論文のDOIは記載なし。", "kind": "data", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"rank": 2, "headline": "3000ケースの構造応答で損傷推定の感度を試す", "title": "Reproducibility Package for \"Effects of Information Availability, Measurement Noise, and Sensor Sparsity on Physics-Guided Structural Damage Estimation\"", "url": "https://doi.org/10.5281/zenodo.23074070", "authors": "Shan, Yuehui", "venue": "Zenodo", "date": "2026-10-01", "summary": "物理誘導型の構造損傷推定について、利用できる情報・計測ノイズ・センサの疎らさの影響を調べた研究の再現パッケージ。固定した     "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
