<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

126件の118件（93.7%）が実際に勝ったが、決着なしと予測した83件にも13件の勝ちが含まれた（表6、Interpretation）。", "p6": "著者は、40を超えるサイトのテストを独立とみなした区間は狭すぎうること、学習データとの重なりが不明なこと、21日以下のテストを除いたこと、微調整の効果を切り分けていないことを認める（Statistical uncertainty ほか）。解釈：非公開データでの自社評価で、第三者の再現ができない。", "fun": "新しいウェブページのデザインが売上を伸ばすかは、本当は実際の客に見せて比べる（A/Bテスト）まで分からない。この研究は、人の閲覧の仕方を学んだAIに1,000人分の仮想の買い物客を演じさせ、過去の318件のテストの結果を84%当てたと報告した。汎用の大きなAIは6割ほどだったので、人の行動のデータで鍛える効き目が見える。ただし開発した会社自身の評価である点には注意が要る。", "unverified": "評価したA/Bテストの出所は守秘のため開示されず、UX-1の学習データとの重なりの程度は著者も不明としている。微調整に使った閲覧データの規模・内容は確認できなかった。"}}, {"id": "pr02", "rank": 2, "headline": "LLMの模擬患者が人の知見を再現できない点を事前登録", "title": "Where do LLM-simulated patients with delusions fail to reproduce human findings? Preregistration v0.16 and frozen materials", "url": "https://doi.org/10.5281/zenodo.24358002", "authors": "Arnav Amit", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-19", "apa": "Arnav Amit. (2026). Where do LLM-simulated patients with delusions fail to reproduce human findings? Preregistration v0.16 and frozen materials. Zenodo. https://doi.org/10.5281/ZENODO.24358002", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の説明（事前登録と凍結した材料の一覧）を使用。事前登録の本文は入手できず", "preprint": true, "p1": "妄想を持つ患者をLLMで模擬したとき、保留した人の実験結果を再現できない点とその方向を調べる反証的な研究の事前登録と、凍結した材料一式を公開した（抄録）。結果はまだなく、未査読。", "p2": "LLMで模擬した被験者が人の知見を再現するかは、成功例だけでなく失敗の有無を事前に決めた基準で確かめる必要がある（抄録）。解釈：合成回答者の妥当性を、後付けの分析なしに検証する設計に取り組んでいる。", "p3": "保留した人の知見として、サンプリング課題で決定までに引く回数（U2）と、開始時の確信度・信念の修正の面接項目（U5）を使い、模擬患者が再現できないかを判定スクリプトverdict.pyが持つ帯（基準の範囲）で判定する。ペルソナの生成プロンプトと組み立て仕様、規則R1〜R17をハッシュ値で凍結した（抄録）。", "p4": "判定スクリプトの忠実な帰無の下での自己検定、記述的な検出力の確認、誤った失敗判定の分析を事前に行い、保留したテスト集合は結果と同時に公開する。主張は行動の忠実さに限り、仕組みには及ばないとする（抄録）。", "p5": "登録時点で研究データはなく、患者モデルの呼び出しは一度も行われていない。2026年11月18日の修正1でペルソナのファイルのハッシュを記録し、修正2で推論サーバ（Ollama）の文脈長を16,384に設定した（抄録）。", "p6": "結果は未報告で、使うLLM、ペルソナの数、判定の帯の具体的な値は抄録から分からない。解釈：再現の失敗を示す設計は厳しいが、どの程度のずれを失敗とするかの帯の設定に結論が依存する。", "fun": "AIに患者のふりをさせて研究に使えるなら便利だが、本当に人と同じように振る舞うかは確かめる必要がある。この研究は、結果を見る前に「どんな結果ならAIは人を再現できていないと判定するか」を決め、判定のプログラムまで封印して公開した。後から都合よく解釈できないように自分の手を縛る、科学のフェアプレーの見本のような手続きが面白い。", "unverified": "結果は未公表で、使用するLLMとペルソナの数、判定の帯の値は確認できなかった。保留されたテスト集合の内容も未公開。"}}, {"id": "pr03", "rank": 3, "headline": "MD&Aの経営者の慎重さの変化が将来リターンを予測", "title": "Pricing Managerial Sentiment", "url": "https://doi.org/10.2139/ssrn.7721978", "authors": "Amir Alamir ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Alamir, A., & Shah, A. (2026). Pricing Managerial Sentiment. https://doi.org/10.2139/ssrn.7721978", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "S&P500企業のMD&A（経営者による財政状態と経営成績の分析）の文ごとの感情を金融特化の言語モデルで測り、経営者の慎重さの変化が将来の株式リターンを予測し、その情報が既存のファクターで説明されないことを示した（抄録）。未査読。", "p2": "開示の文章に表れる経営者の感情が、会計や株価に基づく従来のファクターを超えた価格づけの情報を持つかは確かめられていなかった（抄録）。", "p3": "2015〜2025年のS&P500企業のMD&Aのパネルで、金融領域で学習した言語モデルにより文単位で感情を採点し、慎重さと楽観の水準・変化をリターンと関係づけた。慎重さが大きく増えた企業を買い、楽観が増えた企業を売るゼロコストのファクターToneFを作った（抄録）。", "p4": "ToneFの超過収益の有意性・ボラティリティ・自己相関を調べ、Fama-Frenchの5ファクターとモメンタムへのスパニング回帰で独立した情報かを確かめ、感情で並べたポートフォリオで価格づけの誤差と説明力を比べた（抄録）。", "p5": "将来のリターンは慎重さの変化と強く一貫して関連し、楽観の高さはその後の低いリターンと関連した。関係は非対称・非線形で、リターンの分布の裾に集中していた。ToneFは正で有意なプレミアムと低いボラティリティを持ち、FF5とモメンタムで説明されない有意な切片を残し、加えると価格づけの誤差が減った（抄録）。", "p6": "抄録にはプレミアムの大きさ、取引費用の考慮、言語モデルの名前が書かれていない。解釈：対象はS&P500の約10年に限られ、慎重な語りがなぜ高いリターンにつながるのか（過小反応かリスクの補償か）は抄録からは判断できない。", "fun": "決算書の数字だけでなく、経営者が書く文章の口調からも株価の行方が読めるのか。この研究は、AIでMD&Aの一文一文の慎重さと楽観を測り、慎重になった会社の株はその後よく上がり、楽観的になった会社は振るわないことを示した。浮かれた言葉より用心深い言葉のほうが良い兆しだという逆説が面白い。", "unverified": "本文は入手できず、ToneFのプレミアムの大きさ、使用した言語モデル、取引費用を考慮した後の収益は確認できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "音声入力とAI推敲で職場のフィードバックが変わる", "title": "Giving Feedback with AI: The Roles of Voice Input and AI Assistance in Shaping Engagement and Effectiveness", "url": "https://doi.org/10.2139/ssrn.7716299", "authors": "Michael Rivera", "venue": "SSRN", "date": "2026-11-21", "apa": "Rivera, M. (2026). Giving Feedback with AI: The Roles of Voice Input and AI Assistance in Shaping Engagement and Effectiveness. https://doi.org/10.2139/ssrn.7716299", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "職場のフィードバックを書くときの音声入力と生成AIの推敲の効果を、多国籍企業の研究開発部門での8週間・2段階の無作為化フィールド実験で分け、音声は関与を、AIは具体性と有用性を高めることを示した（抄録）。未査読。", "p2": "音声入力と生成AIが従業員のフィードバックの書き方を変えつつあるが、両者の単独と組み合わせの効果はほとんど分かっていない（抄録）。", "p3": "認知負荷・メディアの自然さ・社会的存在感の理論から、音声はアイデアを出すコストを下げて内容を豊かにし、AIの推敲は整理と仕上げのコストを下げるが、繰り返し使うと依存で関与が損なわれうるという仮説を立て、商用の相互フィードバックアプリFDBCK上で検証した（抄録）。", "p4": "第1段階で従業員300人を入力形式（音声/テキスト）×AI支援（なし/基本的な推敲）の2×2に無作為に割り付け、頻度・長さ・肯定度（関与）と、具体性・行動のしやすさ・受け手への有用性（有効性）を比べた。第2段階では課題を要素に構造化する強化版のAIを試した（抄録）。", "p5": "音声入力は主に関与を高め、フィードバックはより頻繁で長く肯定的になった。基本的なAIの推敲は主に具体性・行動のしやすさ・有用性を高め、関与への効果は小さかった。音声と組み合わせるとAIの具体性の改善はテキストのときの約3倍だったが、関与と有用性の改善は時間とともに減衰した。強化版AIは関与を下げずに有効性をさらに高めた（抄録）。", "p6": "抄録には効果の大きさ、統計的な検定、有効性の評価の方法が書かれていない。解釈：1社の研究開発部門での8週間の実験であり、他の職種・文化や長期の効果への一般化は残る疑問である。", "fun": "同僚へのフィードバックを、キーボードで打つ代わりに声で話すと何が変わるのか。この実験では、声で入力すると人はより頻繁に、長く、前向きなコメントを書き、AIに整えてもらうとコメントが具体的で役に立つものになった。両方を組み合わせるとAIの具体性の効果が約3倍になったのは、声のほうが材料が豊かだからだという説明が面白い。", "unverified": "本文は入手できず、効果の大きさの数値、有効性の評価の方法、第2段階の割り付けの詳細は確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "作用素推論の縮約モデルで海洋循環を10万倍超高速に", "title": "Data-Driven Ocean Emulation: Using Operator Inference to Emulate a Double Gyre Ocean System", "url": "https://doi.org/10.22541/essoar.15012546/v1", "authors": "Shoshi Reich ほか", "venue": "ESS Open Archive", "date": "2026-11-20", "apa": "Reich, S., Aretz, N., Willcox, K., & Heimbach, P. (2026). Data-Driven Ocean Emulation: Using Operator Inference to Emulate a Double Gyre Ocean System. https://doi.org/10.22541/essoar.15012546/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（平易な要約を含む）を使用。本文は入手できず", "preprint": true, "p1": "理想化した二重ジャイヤ（二つの大きな循環）の海洋で、3次元の海洋状態を10年規模で進めるOperator Inferenceの縮約モデルを作り、熱と塩の収支を保ちながら計算を5桁を超えて速くした（抄録）。未査読。", "p2": "海洋大循環モデルは計算費用が高く、不確かさの定量化や大規模アンサンブル、強制条件のシナリオ評価のような多数回の計算が難しい。純粋にデータ駆動のニューラルネットは解釈しにくく、学習にない強制条件に一般化しにくい（抄録）。", "p3": "学習した二次の力学と、既知の海面の強制場から作る大気強制の作用素を組み合わせ、縮約した作用素に線形の制約を課して海盆全体の熱と塩の収支を閉じる（抄録）。背景：Operator Inferenceは、高次元の計算の軌跡を少数のモードに射影し、その上の多項式の力学の係数を回帰で推定する方法である。", "p4": "季節的に変わる風と浮力で駆動される理想化した海盆に適用し、学習に使わなかった風応力の振幅で、10年平均の表層・内部の状態、鉛直の熱塩構造、強制の振幅に対する循環の輸送量の変化を全次元モデルと比べた（抄録）。", "p5": "縮約モデルは保持外の風応力で10年平均の状態、熱塩構造、輸送量の強制への依存を正確に再現し、保存の制約は偽の熱・塩の発生を防いだ。一方、高周波の中規模渦の変動は次第に減衰した。平易な要約では、従来の海洋モデルより10万倍以上速いとする（抄録）。", "p6": "著者は中規模渦の変動の減衰を限界として挙げる（抄録）。解釈：検証は理想化した海盆と一つの保持外の振幅に限られ、現実の地形や長期の気候変化への外挿、モードの数の選び方の影響は抄録からは分からない。", "fun": "海の流れを計算する本格的なモデルは時間がかかり、何百通りもの「もしも」を試すのは難しい。この研究は、計算結果から海の動きの決まりごとを少数の式に要約し、熱と塩の量が勝手に増えたり減ったりしないという物理の約束を守らせて、10万倍以上速く10年先まで計算した。データから学ぶのに物理の約束も守るという両立が面白い。", "unverified": "本文は入手できず、縮約に使ったモードの数、全次元モデルとの誤差の数値、学習に使った振幅の範囲は確認できなかった。"}}, {"id": "pr06", "rank": 6, "headline": "SASBの重要性を文単位で採点する言語モデル公開", "title": "MaterIA: A Fine-tuned Language Model for Measuring Sentence-level Relevance to SASB Categories", "url": "https://doi.org/10.2139/ssrn.7714298", "authors": "Lin Ma ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Ma, L., & Schiehll, E. (2026). MaterIA: A Fine-tuned Language Model for Measuring Sentence-level Relevance to SASB Categories. https://doi.org/10.2139/ssrn.7714298", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "SASBの26の一般的な課題分類について文ごとに採点するDeBERTaベースのモデルMaterIAを公開し、企業の業種と組み合わせて、業種にとって財務的に重要な課題への言及を測れるようにした（抄録）。未査読。", "p2": "SASBの重要性マップは26のESG課題を77業種に対応づけ、ISSBの枠組みの一部にもなったが、既存の公開ESGテキスト分類器は課題×業種の粒度で動かず、重要性が定義される交点を捉えきれない（抄録）。", "p3": "文ごとに26の課題分類それぞれの段階的な得点を出し、文を出した企業の業種から重要性マップでその業種に重要な分類を特定する採点プログラムを付けた。モデル・データ・学習と採点のプログラムは公開SEC提出書類から作り、ソフトはMIT、データはCC BY 4.0で公開した（抄録）。", "p4": "設計段階でバックボーン・学習段階・モデル構成の異なる設定を性能と利用コストで比べて選び、評価段階で保留した教師の注釈、公開の外部ベンチマーク、モデルや教師の得点を見ずに集めた人の注釈で評価し、SASB研究でよく使われるキーワード辞書などと比べた（抄録）。", "p5": "選んだ設定はキーワード辞書を含む代替の方法を上回ったとする。具体的な評価値は抄録にない（抄録）。", "p6": "抄録には評価指標の値、人の注釈の規模、英語以外の開示への適用可能性が書かれていない。解釈：教師の注釈の質に学習が依存し、重要性マップの改訂への追随も今後の課題になりうる。", "fun": "会社の報告書に環境への配慮が書いてあっても、それがその業種にとって本当にお金に響く話題かは別問題だ。同じ話題でも業種によって重みが違う。この研究は、文を一つずつ読んで26の話題に点数を付けるAIを作り、業種ごとに重要な話題に触れているかを測れるようにした。道具とデータを誰でも使えるように公開した点も大きい。", "unverified": "本文は入手できず、評価指標の数値、人の注釈の規模と一致率は確認できなかった。"}}, {"id": "pr07", "rank": 7, "headline": "レビュー選別を良くすると操作がかえって増えうる", "title": "When Better Filters Worsen Information: Enforcement and Measurement on Digital Platforms", "url": "https://doi.org/10.2139/ssrn.7722320", "authors": "Birendra K. Mishra ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Mishra, B. K., & Dorri, R. (2026). When Better Filters Worsen Information: Enforcement and Measurement on Digital Platforms. https://doi.org/10.2139/ssrn.7722320", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "プラットフォームがレビューの選別（フィルタ）を改善すると、摘発を緩める誘因が生まれ、介入の件数は減るのに出品者の操作と消費者が受ける歪みはかえって増えうることを理論モデルで示した（抄録）。未査読。", "p2": "選別の性能は除いた情報の量や介入件数で評価されがちだが、選別の改善がプラットフォームの摘発の方針と出品者の操作の行動をどう変えるかは見落とされてきた（抄録）。", "p3": "選別は操作が表示される情報に与える影響を制限し、摘発と制裁は操作の期待費用を高める。プラットフォームが出品者の行動の前にこれらの方針を約束するモデルを作った（抄録）。", "p4": "選別の改善が摘発の価値を下げる局所的な条件を特定し、選別が安くなるときの同時最適でも同じ型が生じるか、消費者がレビューを割り引いて読む場合、評価者が観察できる情報から操作を推測できるかを検討した（抄録）。", "p5": "局所的な条件の下で、より良い選別は摘発の価値を下げてプラットフォームに摘発を緩めさせ、期待介入件数が減る一方で操作と残る歪みを増やす。この型は選別が安くなるときの同時最適でも生じ、プラットフォームの利得は高まる。消費者が額面どおりに読むと歪みが残るが、例では少しの割り引きで消えうる。介入件数だけでは操作の方向を推測できず、固定した出品者単位の監査で明らかにできる（抄録）。", "p6": "結果は局所的な条件と数値例に依存し、実データでの検証は抄録にない（抄録）。解釈：消費者の割り引きの程度が結論を左右するため、実際のレビューの読まれ方の測定が鍵になる。", "fun": "通販サイトが偽レビューを見抜く仕組みを改良すると、普通は偽レビューが減ると思う。ところがこの研究のモデルでは、仕組みが良くなるとサイトは取り締まりを緩め、結果として出品者の操作はかえって増え、取り締まりの件数は減る。件数が減ったのを見て改善したと思うと間違えるという指摘が面白い。", "unverified": "本文は入手できず、モデルの仮定の詳細と、結果が成り立つ条件の具体的な範囲は確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "乾燥ひび割れと水圧破砕をフェーズフィールドで統一", "title": "A Versatile Chemoelastic Phase-Field Formulation for Fluid-Driven Fracture in Porous Media", "url": "https://doi.org/10.2139/ssrn.7715700", "authors": "Hongwei Wu ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Wu, H., & Buscarnera, G. (2026). A Versatile Chemoelastic Phase-Field Formulation for Fluid-Driven Fracture in Porous Media. https://doi.org/10.2139/ssrn.7715700", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "サクションと間隙水圧を一つの水理的な熱力学ポテンシャルの表れとして扱い、乾燥ひび割れと水圧破砕を同じ破壊基準で解けるフェーズフィールドの定式化を示した（抄録）。未査読。", "p2": "多孔質体の破壊モデルは乾燥ひび割れと水圧破砕で別の破壊基準に頼ることが多く、両方が共存する場面の同時の解析が難しかった（抄録）。", "p3": "応力と破壊を駆動するエネルギーを同じポテンシャルから一貫して導き、変位u・化学ポテンシャルµ・損傷dを主変数として連成系を簡潔にし、自動微分による残差ベースの半モノリシックな解法を用いた。化学ポテンシャルは用途に応じて間隙水圧pかサクションsで書き直せる（抄録）。背景：フェーズフィールド法は、き裂を連続的な損傷の場で表し、エネルギーの最小化でき裂の発生と進展を追う方法である。", "p4": "乾燥ひび割れと、注入による水圧破砕の2種類の問題に同じ枠組みを適用し、不飽和の流体輸送を含めて再現できるかを示した。評価は抄録の範囲では数値例による（抄録）。", "p5": "乾燥ひび割れでは、サクションの勾配が非適合な収縮の固有ひずみの場を生み、拘束の下で局所的な引張の化学弾性エネルギーを生じさせることを示した。水圧破砕では注入圧が水理的な荷重となって同じ枠組みでき裂を進めた（抄録）。", "p6": "抄録には実験との比較や定量的な誤差、3次元の計算例が書かれていない。解釈：検証が数値例にとどまるなら、実際の土の乾燥ひび割れのパターンとの照合が残る課題である。", "fun": "田んぼが乾くとひび割れ、地下に水を押し込むと岩が割れる。どちらも水が関わる割れ方だが、これまでは別々の理屈で計算されてきた。この研究は、水が引っ張る力と押す力を一つの水のエネルギーとして扱い、同じ式で両方の割れ方を再現した。見た目の違う現象を一つの原理でまとめる点が面白い。", "unverified": "本文は入手できず、計算例の具体的な条件と、実験との比較の有無は確認できなかった。"}}, {"id": "pr09", "rank": 9, "headline": "投信報告書のAI利用は運用成績と逆U字の関係", "title": "Generative AI in Asset Management: Too Much of a Good Thing?", "url": "https://doi.org/10.2139/ssrn.7713279", "authors": "Claire Yurong Hong ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Hong, C. Y., Li, X., Qiu, J., & Zhu, W. (2026). Generative AI in Asset Management: Too Much of a Good Thing? https://doi.org/10.2139/ssrn.7713279", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "投資信託の報告書の文章から生成AIの利用を判別し、AIで書かれた報告書の語りの画一化と、AIの利用の強さと運用成績の逆U字の関係を示した（抄録）。未査読。", "p2": "生成AIが投資信託の開示・ポートフォリオの選択・運用成績をどう変えているかは調べられていなかった（抄録）。", "p3": "報告書をAIによるものかで分類し、内容の焦点（マクロ経済・政策か、投資戦略・業界の基礎か）を比べ、AIの利用の強さとその後のリターンの関係を推定した。さらにファンドのAI利用の強さとアクティブなポートフォリオの比重から銘柄単位のAI曝露の指標を作った（抄録）。", "p4": "AIの利用の時系列の変化、報告書の内容の多様性、ファンドのその後のリターン、銘柄のAI曝露とその後の株式リターンの関係を比べた（抄録）。", "p5": "2024年からAIの利用が増え、AIと分類された報告書はマクロ経済と政策を強調して共通の語りに収れんし、投資戦略と業界の基礎への言及が減った。人が書いた報告書ははるかに多様だった。AIの利用と成績は逆U字の関係で、人とAIの協働を示すファンドはその後のリターンが高く、AIを集中的に使うファンドはそうでなかった。銘柄のAI曝露も同様の逆U字だった（抄録）。", "p6": "抄録にはAIの利用の判別法の精度、標本の規模、効果の大きさが書かれていない。解釈：AIを使うファンドの性質（自己選択）とAIの効果を分ける識別の方法は抄録からは分からない。", "fun": "投資信託の運用担当者がAIに報告書を書かせるようになったら何が起きるか。この研究によると、AIが書いた報告書はどれも景気や政策の話に寄って似通い、自分の投資の考えを語る部分が減った。しかもAIを適度に使うファンドは成績が良いのに、使いすぎると良くない逆U字だった。道具は使い方次第という当たり前を数字で示した点が面白い。", "unverified": "本文は入手できず、AI利用の判別の方法と精度、標本の規模、因果の識別の方法は確認できなかった。"}}, {"id": "pr10", "rank": 10, "headline": "がん検診の多段対話LLMを理論に基づき評価する枠組み", "title": "Theory-Grounded Evaluation of Multi-Turn Large Language Model Communication for Cancer Screening: Framework Development and Evaluation Study (Preprint)", "url": "https://doi.org/10.2196/preprints.117464", "authors": "Agnik Saha ほか", "venue": "JMIR Preprints", "date": "2026-11-21", "apa": "Saha, A., Churchill, V., Eaves, A., Kursuncu, U., & Idris, M. Y. (2026). Theory-Grounded Evaluation of Multi-Turn Large Language Model Communication for Cancer Screening: Framework Development and Evaluation Study (Preprint). https://doi.org/10.2196/preprints.117464", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "行動変容と健康コミュニケーションの理論を構造化した知識表現に落とし込み、乳がん・子宮頸がん検診の多段対話をLLMで模擬・評価する枠組みを作り、自動評価の流暢さと人が評価した臨床的な正確さが食い違うことを示した（抄録）。未査読。", "p2": "検診の相談には事実の正確さだけでなく、行動の準備段階・信念・障壁・感情・社会文化的な文脈への対応が要るが、LLMの健康コミュニケーションは流暢さや孤立した事実の正確さで評価されがちで、多段の会話が臨床的に正確で患者中心かは分からない（抄録）。", "p3": "トランスセオレティカル・モデルと健康信念モデルの構成概念、検診の決定要因、患者中心のコミュニケーションの機能、年齢別の指針を、患者と提供者の枝を持つ知識表現にした。役割を与えたGPT-4oの患者・提供者エージェントが段階を意識した対話・状態の追跡・指針の検索を行い、2,000の合成対話を作った（抄録）。", "p4": "自動評価のFEDとG-Evalに加え、選んだ100対話を2人の注釈者が正確さ・完全性・コミュニケーションの6基準（−1〜1）で評価した（抄録）。", "p5": "FEDは一貫性0.98・誤りからの回復0.97で高く、好ましさ0.45・情報量0.47で低かった。人の評価がそろった83対話の総合得点は0.59（95%CI 0.56〜0.63）で、患者中心の配慮が最高（0.87）、検診の正確さが最低（0.28）だった。注釈者間の一致は全体でκ=0.29にとどまった（抄録）。", "p6": "著者は、一つのモデル構成・合成対話・2人の注釈者による結果で、比較対象や要素の除去実験がなく、実際の会話や患者の結果での検証が必要だと認める（抄録）。解釈：感情の受け止めなどで注釈者の一致がほぼゼロであり、人の評価の基準づくり自体が課題として残る。", "fun": "AIのお医者さん役は、話し方はとても滑らかでも、肝心の中身が正しいとは限らない。この研究では、自動の採点で会話のつながりは0.98と満点近かったのに、人が採点すると検診についての正確さは0.28しかなかった。感じよく話せることと正しく伝えることは別物だと、数字ではっきり示した点が面白い。", "unverified": "本文は入手できず、どの点で正確さが低かったかの具体例と、注釈者の背景は確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "フーリエ神経作用素で断層の動的破壊を最大40万倍速く", "title": "Fourier Neural Operators for Accelerating Earthquake Dynamic Rupture Simulations", "url": "https://doi.org/10.22541/essoar.174526096.60853381/v3", "authors": "Napat Tainpakdipat ほか", "venue": "ESS Open Archive", "date": "2026-11-20", "apa": "Tainpakdipat, N., Abdelmeguid, M., Zhao, C., Azizzadenesheli, K., & Elbanna, A. (2026). Fourier Neural Operators for Accelerating Earthquake Dynamic Rupture Simulations. https://doi.org/10.22541/essoar.174526096.60853381/v3", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "摩擦界面での動的破壊の伝播を支配する非線形方程式を、物理ベースの計算で学習したフーリエ神経作用素で代替し、精度を保ちつつ従来の最速の方法より最大40万倍速く計算できることを示した（抄録）。未査読。", "p2": "地震の震源過程の理解に動的破壊のモデルは重要だが、破壊伝播の多重スケールの性質のため従来の数値計算は費用が高い（抄録）。", "p3": "複数の物理ベースの動的破壊の計算から作った合成データでフーリエ神経作用素（FNO）を学習し、未知の問題に適用する（抄録）。背景：FNOは、関数から関数への写像を、フーリエ空間で畳み込みの核を学ぶ層の重ねで近似するニューラルネットで、解像度に依存しにくい。", "p4": "さまざまな例題で、幅広い応力条件における断層のすべり速度の時空間の変化を捉えられるかを、従来の多重スケール法と精度と計算時間で比べて評価した（抄録）。", "p5": "代理モデルは従来の多重スケール法の精度を保ちつつ計算費用を大きく下げ、現在の最速の従来法と比べて最大40万倍の高速化を達成し、幅広い応力条件ですべり速度の時空間の変化を捉えたとする（抄録）。", "p6": "抄録には誤差の定量値、学習データの範囲外（摩擦則や形状の違い）への汎化の限界、学習にかかる費用が書かれていない。解釈：学習データを作る物理計算の範囲が代理モデルの適用範囲を決めるため、未知の断層形状での信頼性は残る疑問である。", "fun": "地震で断層がどう割れていくかを計算するのは、とても時間がかかる。この研究は、物理の計算結果をたくさんAIに見せて割れ方の規則を覚えさせ、最大40万倍速く同じような答えを出せるようにした。桁違いの速さで、たくさんの地震のシナリオを試せるようになる点が面白い。", "unverified": "本文は入手できず、精度の数値と、学習に使った条件の範囲は確認できなかった。"}}, {"id": "pr12", "rank": 12, "headline": "AIとアルゴリズム管理を扱う労働協約を8か国で比較", "title": "How is collective bargaining responding to AI and algorithmic management? A comparative analysis", "url": "https://doi.org/10.2139/ssrn.7720478", "authors": "Silvia Rainone ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Rainone, S., & Zwysen, W. (2026). How is collective bargaining responding to AI and algorithmic management? A comparative analysis. https://doi.org/10.2139/ssrn.7720478", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "AIとアルゴリズム管理（AM）の職場への導入に団体交渉がどう対応しているかを、欧州8か国の国別研究から比較し、170件を超える労働協約の状況と限界を示した章（抄録）。未査読。", "p2": "AIとAMの導入が進むなかで、各国の法制度と労使関係の制度がこれらの技術についての団体交渉の発生と発展をどう形づくるかは比較されていなかった（抄録）。", "p3": "ベルギー、デンマーク、フランス、ドイツ、イタリア、オランダ、ポーランド、スペインの8か国の国別研究をもとに、協約の範囲と内容を国の制度・団体交渉の強さ・法定の参加権と関係づけて比較した（抄録）。", "p4": "協約の件数・論点と、生産性の成果の再分配や分断された企業構造での責任の配分といった根本的な論点への対応の有無を評価の観点とした（抄録）。", "p5": "170件を超える協約と多様な規制の試みが見つかり、協約の範囲と内容は国の制度、団体交渉の強さ、法定の参加権に強く左右された。一方、協約は透明性・データ保護・情報提供と協議・訓練・雇用の保障など従来の統治の枠組みにとどまり、AIとAMが生む生産性の果実の再分配や責任の配分はほとんど扱われていなかった（抄録）。", "p6": "抄録には国ごとの協約の件数や産業の内訳、協約の効果の評価が書かれていない。解釈：協約の存在と職場での実際の効果（従業員の評価や労働条件）の関係は別に検証する必要がある。", "fun": "AIが仕事の割り振りや評価をする職場で、労働組合は会社と何を約束しているのか。欧州8か国の170を超える協約を調べると、AIの使い方の説明やデータの保護といった約束は増えていたが、AIで上がった儲けをどう分けるかという肝心の話はほとんど手つかずだった。古い交渉の型のままで新しい技術に向き合っている姿が見える点が面白い。", "unverified": "本文は入手できず、国別の協約の数、代表的な協約の内容、効果の評価は確認できなかった。"}}, {"id": "pr13", "rank": 13, "headline": "家計の財務レジリエンス指数が実際の困窮を識別", "title": "Does a Household Financial Resilience Index Identify Real Financial Distress? Evidence from the U.S. Survey of Consumer Finances", "url": "https://doi.org/10.5281/zenodo.24416440", "authors": "Agarwal, Vivaan", "venue": "Zenodo", "date": "2026-11-21", "apa": "Agarwal, V. (2026). Does a Household Financial Resilience Index Identify Real Financial Distress? Evidence from the U.S. Survey of Consumer Finances. Zenodo. https://doi.org/10.5281/ZENODO.24416440", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoに登録されたPDFの本文（抄録・考察・限界・結論と図表のキャプション）を読んだ。結果の節の表は一部のみ確認", "preprint": true, "p1": "貯蓄・債務の持続性・緊急資金・支出の安定からなる0〜100の家計の財務レジリエンス指数（HFRI）を、FRBの消費者金融調査（SCF）の1万2千を超える実在の世帯で検証し、自己申告の困窮を識別できること、重みを見直すとさらに良くなることを示した（抄録）。未査読の単著で、著者の所属は学校（p.1）。", "p2": "第1版の指数は1,000の模擬世帯で等しい重みで作られ、実在の世帯で困窮を識別できるかは確かめられていなかった（抄録）。", "p3": "SCFの2025年・2022年と2007〜09年のパネルで、調査の重みと多重代入を使い、指数を延滞・給料日ローン・破産・信用の拒否という自己申告の困窮と比べた。重みは1,770通りの組み合わせを探索し、保持標本で確かめた（抄録）。", "p4": "現在の困窮の識別をAUC（0.5は偶然）で、将来の困窮の予測を2007年の指数と2009年までの新たな困窮で評価し、所得と人口統計の統制、10回の無作為分割での保持標本の検証、公式の財務健全性の指標との一致も調べた（抄録、表3・6・7）。", "p5": "等しい重みの指数は深刻な延滞をAUC 0.736で識別し、所得などを統制しても効果が残った。緊急資金は現在の困窮を、債務の持続性は2008年の危機後の新たな困窮を最もよく説明した。見直した重み（貯蓄5%・債務30%・緊急資金55%・支出の安定10%）で現在の困窮の平均AUCは0.709から0.752に上がり、将来の困窮の予測でも緊急資金だけ（0.657）より高かった（0.718）（抄録、Discussion）。", "p6": "著者は、一部の指標が代理変数であること、米国のデータであること、検証した危機が一つであること、新しい重みは将来の予測でわずかに劣ること、税を推定したこと、予測であって因果ではないことを限界に挙げる（Limitations）。解釈：基準が自己申告の困窮であり、外部の検証が待たれる。", "fun": "家計がピンチに強いかどうかを、一つの点数で表せないか。この研究は、貯金・借金・いざというときの現金・支出の安定の4つを組み合わせた点数を、アメリカの1万2千を超える家庭の実データで確かめた。面白いのは、今困っている家庭を見分けるのは現金の蓄えだが、これから困る家庭を見分けるのは借金だったことだ。今と将来で効く指標が違うという発見は、測ることの落とし穴を教えてくれる。", "unverified": "各困窮の指標ごとのAUCの詳細と、点数の区分（35・55・70）の延滞率の数値は表を十分に照合できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "LSNS-6の2因子構造をメキシコ高齢者で確認", "title": "Psychometric Validation of the Lubben Social Network Scale-6 (LSNS-6) in Mexican Older Adults", "url": "https://doi.org/10.21203/rs.3.rs-9861212/v1", "authors": "Erick Alberto Medina Jiménez ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Jiménez, E. A. M., Quiroz, C. O. A., Flores, R. G., García, S. S., Montelongo, I. A. T., & Aguilar-Navarro, S. G. (2026). Psychometric Validation of the Lubben Social Network Scale-6 (LSNS-6) in Mexican Older Adults. https://doi.org/10.21203/rs.3.rs-9861212/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの原稿PDFの本文（方法・結果・考察・限界と表2〜4）を読んだ", "preprint": true, "p1": "社会的ネットワーク（孤立）の尺度LSNS-6のスペイン語版を、メキシコの60歳以上のコホートで確認的因子分析により検証し、家族と友人の2因子構造、良好な信頼性、抑うつ・生活の質との妥当な関連を示した（抄録、表2・3）。未査読。", "p2": "LSNS-6は社会的孤立のふるい分けに広く使われるが、メキシコの高齢者での量的な心理測定の検証はなかったとする（Conclusions）。", "p3": "COSFAMM（メキシコの高齢者の肥満・サルコペニア・フレイルのコホート）第6回（2019年）の横断データで、多分相関とDWLS推定量の確認的因子分析により家族（接触・親密さ・援助）と友人（同）の2因子モデルを検定し、αとωで信頼性を、抑うつ（CESD-R）・生活の質（WHOQOL-OLD）・社会的機能（SF-36）との相関で妥当性を調べた（抄録、図1）。", "p4": "適合度はCFI・TLI・RMSEA、収束妥当性は抑うつとの負の相関と親密さとの正の相関、弁別妥当性は社会的機能との弱い相関を基準とした（Results、表3）。", "p5": "2因子モデルはCFI=.998・TLI=.997で、RMSEAは.099（90%CI .085〜.114）と境界域だった（自由度8の小さなモデルでは過大になりやすいと著者は注記）。標準化負荷量は家族.73〜.97・友人.85〜1.00、因子間相関は.43、信頼性はω=.85・α=.84。抑うつとはρ=−.20、親密さとはρ=.22、社会的機能とはρ=.09だった（抄録、Results）。", "p6": "著者は、単一のコミュニティ・コホートであること、横断データで再検査信頼性を評価できないこと、臨床的なカットオフを定めていないことを限界とする（Limitations）。解釈：標本数が抄録（1,675人）と本文（1,678人）で食い違い、RMSEAが境界域である点は確認が要る。", "fun": "高齢者が孤立していないかを、6つの簡単な質問で測る物差しがある。この研究は、その物差しがメキシコの高齢者でも正しく働くかを1,678人のデータで確かめた。家族とのつながりと友人とのつながりが別々の柱として測れること、つながりが多い人ほど抑うつが少ないことが確認された。国や文化が違っても同じ物差しが使えるかを確かめる地道な作業の大切さが分かる。", "unverified": "表1の標本の属性の詳細は十分に確認できなかった。抄録の1,675人と本文の1,678人の違いの理由は記載がなく未確認。"}}, {"id": "pr15", "rank": 15, "headline": "集団でのケアの実践が活動家の燃え尽きを和らげる", "title": "Collective and self‑care practices mitigate burnout among highly involved environmental activists", "url": "https://doi.org/10.5281/zenodo.24399043", "authors": "Farkač ほか", "venue": "Zenodo", "date": "2026-11-20", "apa": "Farkač, B., Reese, G., & Šerek, J. (2026). Collective and self‑care practices mitigate burnout among highly involved environmental activists. Zenodo. https://doi.org/10.5281/ZENODO.24399043", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録を使用。本文は入手できず", "preprint": true, "p1": "環境活動家の参加の強さと燃え尽きの関係を、自己ケアと集団でのケアの実践が和らげることを、チェコとドイツの2つの研究で示した（抄録）。査読の有無は未確認。", "p2": "燃え尽きは活動家の幸福、活動団体の持続、社会変革の力を脅かし、コミュニティ心理学は社会運動の中の集団でのケアの重要性を強調してきたが、量的な実証は限られていた（抄録）。", "p3": "研究1でチェコの活動家（n=151）から集団でのケアの実践の尺度を作り、初期の集団ケアと継続的な集団ケアを見いだした。研究2でドイツの活動家（n=540）について、参加の強さと燃え尽きの関係に自己ケアと集団ケアが与える調整効果を検証した（抄録）。", "p4": "参加の強さを、費やした総時間と多様な活動にわたる掛け持ちの参加の2つで捉え、燃え尽きとの関連と、ケアの実践による関連の弱まり（調整）を評価した（抄録）。", "p5": "多様な活動にわたる参加は、費やした総時間より燃え尽きと強く関連した。自己ケア、初期の集団ケア、継続的な集団ケアはいずれもこの関連を調整し、燃え尽きを和らげた（抄録）。", "p6": "抄録には効果の大きさ、調査の設計（横断か縦断か）、尺度の妥当性の詳細が書かれていない。解釈：横断的な調査であれば、ケアの実践が燃え尽きを防ぐのか、燃え尽きていない人がケアを実践できるのかという因果の向きは残る疑問である。", "fun": "熱心な活動家ほど燃え尽きやすいのは、使う時間が長いからだろうか。この研究によると、時間の長さより、いろいろな役割を掛け持ちすることのほうが燃え尽きと強く結びついていた。そして、自分をいたわることと、仲間どうしで支え合う仕組みがあることの両方が燃え尽きを和らげていた。頑張る人を支えるのは根性ではなく関係だという点が面白い。", "unverified": "本文は入手できず、調査の設計（横断か縦断か）、効果の大きさ、尺度の具体的な項目は確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "デジタルの害に強い気質「デジタル免疫」を測る", "title": "Toward the Concept of Digital Immunity: In Search of Mental Antidotes to Digital Harms", "url": "https://doi.org/10.2139/ssrn.7721018", "authors": "Martin Hilbert ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Hilbert, M., Thakur, A., & Repetto, A. (2026). Toward the Concept of Digital Immunity: In Search of Mental Antidotes to Digital Harms. https://doi.org/10.2139/ssrn.7721018", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "デジタルメディアの害（羞恥・嫉妬・比較・取り残される不安などの「心のとらわれ」）を受けにくい気質を「デジタル免疫」として提案し、その構造と害との関係を2つの標本で調べた（抄録）。未査読。", "p3": "14か月の間隔で独立に集めた2標本（N=1,164と、事前登録したN=1,275）で、既存の保護・害の尺度と、害を無作為に誘導する操作を組み合わせた（抄録）。", "p5": "登録した保護の3因子（自己受容・自己理解・内的静けさ）は再現し、自己受容は両研究で標本外の心のとらわれの分散の68%を説明した。誘導による害の動きは免疫の高低で同程度だったが、押された後に害の側に立つ人は最下位四分位で1,000人中365人、最上位で94人だった（抄録）。", "fun": "SNSを見て落ち込みやすい人と平気な人がいるのはなぜか。この研究は「自分を受け入れられているか」が、嫉妬や比較、取り残される不安にとらわれる度合いの大部分（68%）を説明すると報告した。面白いのは、悪い刺激を与えると誰でも同じくらい揺れるのに、もともとの位置が違うため、同じ一押しで危ない側に落ちる人の割合が1,000人中365人と94人で大きく違った点だ。", "unverified": "本文は入手できず、尺度の具体的な項目、害の誘導の方法、効果量の詳細は確認できなかった。"}}, {"id": "pr17", "rank": 17, "headline": "LLMエージェントで公衆衛生のメタ分析を自動化", "title": "AutoMeta: LLM Agent-based Automated Meta-Analysis in Public Health", "url": "https://doi.org/10.21203/rs.3.rs-11389292/v1", "authors": "Ke Zhu ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Zhu, K., Huang, Y., Tian, X., Sun, Y., & Xia, T. (2026). AutoMeta: LLM Agent-based Automated Meta-Analysis in Public Health. https://doi.org/10.21203/rs.3.rs-11389292/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "公衆衛生のメタ分析の文献検索・選別・データ抽出・統計的統合をLLMエージェントの流れで自動化し、専用のベンチマークで性能を示した（抄録）。未査読。", "p3": "段階ごとの指示と構造化出力で各段階をつなぎ、曝露の用語の拡張や検証済みの効果量変換関数を組み込んだ。27の系統的レビュー（対象研究421件、4,164のデータ項目、95の効果単位）からAutoMetaBenchを作って評価した（抄録）。", "p5": "検索の再現率93.1%、データ抽出の正確さ93.6%で、端から端までの27課題の85.2%で統合効果と95%信頼区間の両端を相対誤差5%以内で再現した（単一エージェントの比較対象は7.4%）。1課題の平均は26分だった（抄録）。", "fun": "何十本もの論文から数字を拾い集めて一つの結論にまとめるメタ分析は、人がやると何か月もかかる。この研究は、役割を分けたAIの流れ作業にすると、27課題の85.2%で専門家の答えを5%以内の誤差で再現でき、1件26分で済んだと報告した。一人のAIに全部任せると7.4%しか再現できなかった点に、分業の効果が表れている。", "unverified": "本文は入手できず、使用したLLMの種類、比較対象の詳細、誤りの典型例は確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "生成AIがグループ設計の当事者意識と意図を薄める", "title": "\"I Think We Did This\": GenAI Contributes to Erosion of Ownership and Design Intention in Group Design Work&nbsp;", "url": "https://doi.org/10.2139/ssrn.7714899", "authors": "Hauke Sandhaus ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Sandhaus, H., Han, R., & Ju, W. (2026). “I Think We Did This”: GenAI Contributes to Erosion of Ownership and Design Intention in Group Design Work&nbsp; https://doi.org/10.2139/ssrn.7714899", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "生成AIを使うチームの設計作業で、設計意図と当事者意識（オーナーシップ）がどう変わるかを、学生への面接から示した初期的な知見（抄録）。未査読。", "p3": "チームで課題に取り組む大学院の対話型デバイス設計の授業の学生18人に、それぞれのリポジトリとチャット履歴をたどりながら面接した（抄録）。", "p5": "個人の発想として語られた最終案が本人の思い出せないAIとのブレインストーミングにさかのぼること、生成された候補から選ぶ中で好みが形成されること、AIが仲間の貢献を混ぜ合わせ対話が個人のアカウントに残るため集団の記録が失われることの3点を報告した（抄録）。", "fun": "グループ課題で「これは私のアイデア」と言えるのは誰か。この研究では、学生が自分の発想だと思っていた案が、実はAIとの雑談から来ていて本人も覚えていなかった例が見つかった。さらに学生は、AIが描いた絵コンテを手で描き直して「自分たちの作品」という感覚を取り戻そうとしていた。道具が考え方そのものを形づくるという指摘が面白い。", "unverified": "本文は入手できず、面接の分析手続き、事例の数と内訳は確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "医療過誤の説明を練習するマルチエージェント音声模擬", "title": "CandorMD: A Multi-Agent Audio Simulation System for Training Clinician Communication in Medical Error Disclosure (Preprint)", "url": "https://doi.org/10.2196/preprints.108095", "authors": "Inna Wanyin Lin ほか", "venue": "JMIR Preprints", "date": "2026-11-21", "apa": "Lin, I. W., Sabour, S., Sng, H., Chan, M., Huang, M., White, A., & Althoff, T. (2026). CandorMD: A Multi-Agent Audio Simulation System for Training Clinician Communication in Medical Error Disclosure (Preprint). https://doi.org/10.2196/preprints.108095", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "医療過誤を患者・家族に説明する会話を練習するAIの模擬システムCandorMDを作り、それを設計探索の道具として関係者の意見から設計の指針をまとめた（抄録）。未査読。", "p3": "臨床医4人、リスク管理者2人、コミュニケーション研究者3人、患者支援者3人の計12人に1時間の半構造化面接を行い、システムを使いながら考えを声に出してもらい、2人の独立した符号化者が帰納的に主題分析した（抄録）。", "p5": "参加者は信頼・共感・透明性を説明の基盤とし、説明を一度きりでなく続く過程と捉えた。模擬患者の感情の動きは現実的と評価され、即時の手本に基づくフィードバックが好まれた一方、会話の間合いの自然さや患者のペルソナの幅の拡大が求められた（抄録）。", "fun": "医療ミスを患者に正直に伝えるのは、医師にとって最もつらい会話の一つだ。この研究は、怒ったり悲しんだりする患者役をAIが演じる練習台を作り、医師や患者の支援者に試してもらった。AI患者の感情の動きは現実的だと評価されたが、もっといろいろな性格の患者を用意してほしいという声も出た。演じるAIの人柄の幅が練習の質を左右する点が面白い。", "unverified": "本文は入手できず、使用したLLMや音声の仕組み、定量的な評価の有無は確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "狩野モデルとQFDで海藻食品の設計を顧客要求に結ぶ", "title": "Competition-driven sustainable food product designs with seaweeds: A novel outlook for integrating Kano model, quality function deployment, and multi-criteria analysis", "url": "https://doi.org/10.6084/m9.figshare.35080893", "authors": "Reciel Ann Cullano ほか", "venue": "Figshare", "date": "2026-11-20", "apa": "Cullano, R. A., Tiu, A. M., Aro, J. L., & Ocampo, L. (2026). Competition-driven sustainable food product designs with seaweeds: A novel outlook for integrating Kano model, quality function deployment, and multi-criteria analysis. Taylor & Francis. https://doi.org/10.6084/M9.FIGSHARE.35080893", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Figshareに登録された文書の抄録（OpenAlex経由、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "海藻を使った食品の設計で、持続可能性の観点を含む顧客の要求を、狩野モデル・品質機能展開（QFD）・多基準意思決定（MCDM）の統合で技術的な特性に結びつける枠組みを示した（抄録）。査読の有無は未確認。", "p3": "満足と不満の度合いを考慮した顧客要求の優先重みの新しい指標と、競合製品の平均的な性能を基準点に使う修正版EDAS（平均解からの距離による評価）を提案した（抄録）。", "p5": "海藻入りの乾燥調味料と鶏肉ソーセージの2事例で示し、通常のEDAS・TOPSIS・CODASとの比較で修正版EDASの有効性を示したとする。具体的な数値は抄録にない（抄録）。", "fun": "新しい食品を作るとき、「あると嬉しい」機能と「ないと困る」機能では、同じ改善でも客の喜び方が違う。狩野モデルはこの違いを整理する考え方だ。この研究は、その違いと「環境に優しい」という目標を一緒に設計の重みに組み込み、さらに競合商品の平均を物差しにした。海藻ソーセージのような身近な商品で設計の考え方を示した点が面白い。", "unverified": "本文は入手できず、顧客調査の規模、比較結果の数値、査読の有無は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "暑熱対策の優先地区は指標の組み方で変わる", "title": "From Thermal Hotspots to Spatial Priorities: Attribution and Sensitivity of Urban Heat Screening in Jakarta", "url": "https://doi.org/10.5281/zenodo.24414265", "authors": "Faqih ほか", "venue": "Zenodo", "date": "2026-11-21", "apa": "Faqih, M. F., Mustofa, M. A., & Abdulloh, M. (2026). From Thermal Hotspots to Spatial Priorities: Attribution and Sensitivity of Urban Heat Screening in Jakarta (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24414265", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録（DataCite経由、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "都市の暑熱対策の優先地区を選ぶスクリーニング指標で、入れる変数と重みの選び方が優先地区をどれだけ変えるかを、ジャカルタで要因分解して示した（抄録）。未査読。", "p3": "ジャカルタの5市の500 m格子（共通の2,536セル）で、地表面温度だけ（M1）、植生を追加（M2）、総人口を追加（M3）、子どもと高齢者の数と1,015の公園候補までの歩行距離を追加（M4）の4モデルを比べた（抄録）。", "p5": "M1とM4の上位10%は254セル中141セル（55.5%、Jaccard 0.384）しか重ならず、M3からM4の順位変動の85.5%は公園の追加によった。加法的なM4では公園から500 m以内のセルは上位254に一つも入らなかった（抄録）。", "fun": "「暑さ対策をどこから始めるか」の地図は、どのデータをどう足し合わせるかで描き直される。この研究では、温度だけで選んだ上位の地区と、公園までの距離などを加えた上位の地区が半分ほどしか重ならなかった。しかも計算の仕組み上、公園の近くは一つも上位に入らなかった。地図が客観的に見えても、作り方の選択が結論を決めていることを数字で示した点が面白い。", "unverified": "本文は入手できず、重みの具体的な値と、地表面温度・人口のデータの出典は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "交通の推薦に人が分かる理由を付ける枠組み", "title": "Explainable AI for Transportation Recommendations: Generating Human-understandable Justifications", "url": "https://doi.org/10.2139/ssrn.7714579", "authors": "Martin Gunner", "venue": "SSRN", "date": "2026-11-21", "apa": "Gunner, M. (2026). Explainable AI for Transportation Recommendations: Generating Human-understandable Justifications. https://doi.org/10.2139/ssrn.7714579", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "経路や交通手段の推薦に、人が理解できる理由（説明）を付ける枠組みを作り、説明の種類ごとの効果を利用者実験で比べた（抄録）。未査読。", "p3": "モデルに依存しない特徴の寄与と自然言語生成を組み合わせて説明を作り、180人の混合研究法の実験で、特徴ベース・対照的・反実仮想・混合の説明と説明なしを、経路選択と複数手段の移動の場面で比べた（抄録）。", "p5": "説明は理解・信頼・満足を有意に高め、経路選択では反実仮想の説明が説明なしより理解を32%、信頼を24%高めた。費用と環境の得失を比べる場面では特徴ベースの説明が有効で、混合の説明が全体の満足で最も高かった（抄録）。", "fun": "カーナビに「こっちの道がおすすめ」とだけ言われても従いにくいが、「もし別の道を選ぶとこうなります」と言われれば納得しやすい。この研究は、こうした「もし〜なら」型の説明が経路選びでは理解を32%、信頼を24%高めたと報告した。一方、お金と環境のどちらを取るかの場面では別の型の説明が効いた。場面によって効く説明の型が違う点が面白い。", "unverified": "本文は入手できず、推薦モデルの種類、参加者の属性、効果の統計的な詳細は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "少数の土石流記録から決定木で規模を予測", "title": "Machine Learning for Rainfall-Driven Debris Flow Prediction in Data-Scarce Volcanic Watersheds", "url": "https://doi.org/10.18280/ijsse.151118", "authors": "Fuqaha, Sameh", "venue": "Zenodo", "date": "2026-11-21", "apa": "Ikhsan, J., Fuqaha, S., Rahardjo, A. P., & Suharyanto. (2025). Machine Learning for Rainfall-Driven Debris Flow Prediction in Data-Scarce Volcanic Watersheds. International Journal of Safety and Security Engineering, 15(11). https://doi.org/10.18280/ijsse.151118", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記録の少ない火山の流域で、雨量の大きさと時間の変数から土石流の規模を機械学習で予測する枠組みを示した（抄録）。Zenodoに登録された文書で、査読の有無は未確認。", "p3": "インドネシアのプティ川流域の2観測所で記録された33件の土石流と雨量の変数を使い、8つの分類器を層化5分割交差検証で比べ、正解率とマクロ平均F1で評価した（抄録）。", "p5": "調整した決定木が最も高く（正解率93.9%、F1-macro 0.911）、雨量の大きさの変数が主な予測因子だった。ROC分析で大規模な土石流の判別が良好とし、MATLABのGUIに実装した（抄録）。", "fun": "土石流は滅多に起きないので、予測のためのデータがとても少ない。この研究は、たった33回の記録から「どれくらいの雨でどれくらいの土石流になるか」を機械に学ばせ、単純な決定木が複雑なモデルより成績が良かったと報告した。データが少ないときは、かえって単純な方法が強いことがある点が面白い。", "unverified": "本文は入手できず、33件という少数での過学習の検討と、外部のデータでの検証の有無は確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "ベイズ較正の予測リスクと同定可能性の上限を導出", "title": "Shrinkage That Fades and Curvature That Persists: Exact Prediction Risk, an Identifiability Ceiling and a Virtual-Plant Study of a Bayesian Cone-Crusher Calibration", "url": "https://doi.org/10.5281/zenodo.24395171", "authors": "Santibáñez-Leal, Felipe", "venue": "Zenodo", "date": "2026-11-20", "apa": "Santibáñez-Leal, F. (2026). Shrinkage That Fades and Curvature That Persists: Exact Prediction Risk, an Identifiability Ceiling and a Virtual-Plant Study of a Bayesian Cone-Crusher Calibration (Version 0.01). Zenodo. https://doi.org/10.5281/ZENODO.24395171", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録（DataCite経由、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "構造的な不一致項を含む物理モデル（コーンクラッシャーの粒度分布モデル）のベイズ較正について、予測リスクを厳密に導き、物理モデルが単純な直線に勝つ条件と同定可能性の上限を示した（抄録）。未査読。", "p3": "不一致の回帰変数への最小二乗と、その平面からのモデルのずれに分けてリスクを導出し、176セル×1,900反復の仮想プラントで理論のリスクと照合した（抄録）。", "p5": "物理モデルの利点は、調査が増えると消える平面の縮小と、残り続けるが向きがそろい大きさが2倍未満のときだけ効く曲率から来る。仮想プラントは理論と一致し（832中の最大|z| 3.17）、線形化モデルでは2%の雑音の製品粒度の計測が調査を倍にするより多くの情報を加えた（抄録）。", "fun": "現実をよく知っている物理の式と、データに線を引くだけの統計の式、どちらが予測に強いか。この研究は、物理の式の強みが二つあり、一つはデータが増えると消え、もう一つはずっと残るが条件付きでしか効かないことを数式で示した。さらに、測る項目を一つ増やすほうが、調査の回数を倍にするより役立つ場合があるという指摘も面白い。", "unverified": "本文は入手できず、導出の詳細と実機のデータでの検証の範囲は確認できなかった。抄録自身が仮想プラントはモデルで実機ではないと断っている。"}}, {"id": "pr25", "rank": 25, "headline": "中国の病理医のLLM導入意向と影響要因を調査", "title": "Chinese Pathologists’ Adoption of Large Language Models: Cross-Sectional Survey on Influencing Factors (Preprint)", "url": "https://doi.org/10.2196/preprints.88275", "authors": "Yuting Wang ほか", "venue": "JMIR Preprints", "date": "2026-11-20", "apa": "Wang, Y., Cui, V. Y., Pan, Q., Zhang, X., Yang, Y., Xue, P., & Qiao, Y. (2025). Chinese Pathologists’ Adoption of Large Language Models: Cross-Sectional Survey on Influencing Factors (Preprint). https://doi.org/10.2196/preprints.88275", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国の病理医のLLMの認知・利用・評価・倫理的懸念と、病理でのLLMの利用意向に関わる要因を横断調査で調べた（抄録）。未査読。", "p3": "中国本土の認定病理医に質問紙調査を行い、利用者と非利用者の評価の差をFDR補正つきのMann-Whitney検定で、利用意向を順序ロジスティック回帰で分析した（抄録）。", "p5": "適格な339人のうち248人（73.2%）がLLMを知り、そのうち64人（25.8%）が使っていた。主治医（aOR 2.39）・主任医師（aOR 4.64）と週43時間を超える勤務（aOR 2.33）は利用意向の高さと、4級以下の都市での勤務（aOR 0.42）は低さと関連した（抄録）。", "fun": "新しいAIの道具を一番使いたがるのは誰か。中国の病理医の調査では、役職が上の医師や長時間働く医師ほど使う意欲が高く、地方の小都市で働く医師ほど低かった。実際に使った人のほうが臨床での使い道を慎重に評価していたのも面白い。触ってみると、できることとできないことが見えてくるのだろう（解釈）。", "unverified": "本文は入手できず、回答率の詳細と、抄録の後半（読影枚数などの要因）の結果は抄録が途中で切れていて確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "経営者の能力と財務報告の質の研究を整理", "title": "Managerial Ability and Financial Reporting Quality: Assessing Their Influence on Firm Profitability and Market Valuation", "url": "https://doi.org/10.2139/ssrn.7713139", "authors": "Daniel Fischer", "venue": "SSRN", "date": "2026-11-21", "apa": "Fischer, D. (2026). Managerial Ability and Financial Reporting Quality: Assessing Their Influence on Firm Profitability and Market Valuation. https://doi.org/10.2139/ssrn.7713139", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "経営者の能力が財務報告の質を通じて収益性と企業価値にどう影響するかの研究を整理した総説（抄録）。未査読。", "p3": "高階層理論・エージェンシー・資源ベース・情報の非対称の視点から、経営者の能力の測り方、報告の質の操作化、能力・報告の質・業績・企業価値の関係の証拠を整理した（抄録）。", "p5": "能力の高い経営者ほど利益の持続性が高く、発生主義の見積もりが正確で、修正再表示が少なく、企業価値が高いとする研究が多い一方、租税回避・実体的な活動・新興国では結果が一様でないとまとめ、6つの検証可能な命題を示した（抄録）。", "fun": "会社の数字は、稼ぐ人と記録する人が同じ経営者だという点に面白さがある。腕のいい経営者は利益を上げるだけでなく、その利益をより正確に報告する傾向があると多くの研究が示してきた。ただし税金の扱いや新興国では話が単純でないという指摘は、有能さと正直さが必ずしも同じ向きでないことを考えさせる。", "unverified": "本文は入手できず、対象とした文献の数と選び方、6つの命題の中身は確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "自分の誤りを反証して直す金融質問応答LLM", "title": "Self-refuting Models: Learning by Detecting their own Financial Errors", "url": "https://doi.org/10.2139/ssrn.7713198", "authors": "Satyasai Raghava Krishna Akkapedddi", "venue": "SSRN", "date": "2026-11-21", "apa": "Akkapedddi, S. R. K. (2026). Self-refuting Models: Learning by Detecting their own Financial Errors. https://doi.org/10.2139/ssrn.7713198", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "金融の質問応答でLLMが自分の答えを反証しようとして直す枠組みを提案し、幻覚と数値の誤りを減らしたと報告した（抄録）。未査読。", "p3": "候補の回答の生成、自分の推論を崩そうとする敵対的な自己批判、矛盾の修正の3段階を、生成器と自己批判者のミニマックス最適化として定式化し、米国企業の開示に基づくFinanceBenchとConvFinQAで評価した（抄録）。", "p5": "標準的なプロンプトに比べて幻覚率を18.7%下げ、数値の正確さを12.4%、事実の一貫性を14.1%高め、全体で9.6%の性能向上を得たとする（抄録）。", "fun": "テストで答えを書いたあと、自分の答えにわざと反論してみると計算ミスに気づくことがある。この研究はAIに同じことをさせ、企業の決算資料についての質問で、でたらめな答え（幻覚）を18.7%減らしたと報告した。自分を疑う手順を組み込むだけで信頼性が上がるという発想が面白い。", "unverified": "本文は入手できず、使用したモデル、各指標の定義（相対か絶対か）、統計的な検定は確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "エンジン振動で潤滑油を見分ける際の回転数の影響", "title": "Operating Speed Effects on Vibration-Data-Driven Discrimination of Field-Used Lubricant Samples in an Internal Combustion Engine", "url": "https://doi.org/10.31224/8855", "authors": "Chamuditha Keerthisena ほか", "venue": "engrXiv", "date": "2026-11-20", "apa": "Keerthisena, C., & Ratnaweera, A. (2026). Operating Speed Effects on Vibration-Data-Driven Discrimination of Field-Used Lubricant Samples in an Internal Combustion Engine. https://doi.org/10.31224/8855", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "engrXivの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "エンジンの振動から使用済み潤滑油の違いを見分けられるかを、回転数が変わる条件で調べた実行可能性の研究（抄録）。未査読。", "p3": "無負荷のガソリンエンジンを6つの回転数で運転して5種類の使用済み潤滑油で振動を記録し、統計的な特徴量と教師あり分類で判別を試みた。3つの特徴の表し方と、試験の回転数を学習に含めるか除くかの2つの方針で評価した（抄録）。", "p5": "判別はある程度可能で、正解率は最大0.63（偶然の水準は0.20）だった。潤滑油の情報は全体の特徴の一部に集中して弱く、判別は回転数とエンジンの熱履歴で変わった。粘度の近い試料どうしが混同されやすい傾向もみられた（抄録）。", "fun": "エンジンオイルの劣化を、油を抜かずに振動だけで知ることができれば便利だ。ところが振動は回転数でも大きく変わるので、オイルの違いがその中に埋もれてしまう。この研究では、5種類のオイルを偶然（2割）より高い6割強の正解率で見分けられたが、完璧には程遠かった。信号は弱いがゼロではないという正直な結果が面白い。", "unverified": "本文は入手できず、特徴量の具体名、分類器の種類、熱履歴の影響の大きさは確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "土石流の予測と対策研究892報の計量書誌分析", "title": "Debris flow prediction and impact mitigation: A comprehensive review and bibliometric perspective", "url": "https://doi.org/10.31893/multirev.2026544", "authors": "Fuqaha, Sameh", "venue": "Zenodo", "date": "2026-11-21", "apa": "Ikhsan, J., Fuqaha, S., Setiawan, A., & Muto, Y. (2026). Debris flow prediction and impact mitigation: A comprehensive review and bibliometric perspective. Multidisciplinary Reviews, 9(11), 2026544. https://doi.org/10.31893/multirev.2026544", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "2015〜2025年の土石流の予測と被害軽減の研究を、計量書誌分析と技術的な整理で概観した総説（抄録）。Zenodoに登録された文書で、査読の有無は未確認。", "p3": "Scopusに収録された査読論文892報を対象に、研究の増加・地域・主題を計量書誌的に分析し、予測と対策の手法の変化を技術的に整理した（抄録）。", "p5": "東アジアと欧州が主要な拠点で、AI・リモートセンシング・早期警報が主な最前線だった。手法は経験式や雨量閾値から物理モデル・機械学習・多源の監視データを組み合わせる方向へ移り、モデルの移転可能性・不確かさの定量化・データの入手に課題があるとした（抄録）。", "fun": "土石流の研究は、昔は「この雨量を超えたら危ない」という経験則が中心だった。この総説は892本の論文を数えて、いまはAIやドローン、レーザー計測を組み合わせる方向に急速に移っていることを示した。一方で、ある谷で作ったモデルが別の谷で通用するかという根本的な問題は残っており、新しい道具が増えても難しさは消えないことが分かる。", "unverified": "本文は入手できず、文献の選定基準と、深層学習が優れるとする比較の根拠は確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "スマートシティ指定都市の雨水排水網をSWMMで評価", "title": "Evaluation of urban storm water drainage network in Kakinada coastal city", "url": "https://doi.org/10.21203/rs.3.rs-11634881/v1", "authors": "R. Venkata Ramana ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Ramana, R. V., Prasad, Y. S., Anuhya, T., Jeyakanthan, V. S., & Rao, Y. R. S. (2026). Evaluation of urban storm water drainage network in Kakinada coastal city. https://doi.org/10.21203/rs.3.rs-11634881/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "インドの沿岸のスマートシティ指定都市カキナダで、雨水排水網の能力と浸水の対策をSWMMで評価した（抄録）。未査読。", "p3": "地形・排水網・土地利用・現地調査のデータでSWMMのモデルを作り、2024年のモンスーン期の5地点の観測水位で較正・検証した（R² 0.75〜0.94）。2007〜2023年の15分間隔の雨量から再現期間2〜100年のIDF曲線を作った（抄録）。", "p5": "不浸透面は2016年の54%から2023年の58%に増え、2年確率の設計降雨でも複数の地点で浸水した。一部の水路の幅と深さを広げると5年確率の降雨で排水性能が改善し、将来の降雨強度の増加は排水系にさらに負荷をかけると示唆された（抄録）。", "fun": "道路や建物が増えて地面が覆われると、雨が染み込まずに一気に水路へ流れ込む。この研究では、7年で不浸透面が54%から58%に増え、2年に1度の雨でも街のあちこちが浸水すると計算された。スマートシティでも、昔からある排水路の太さが浸水を左右するという地道な事実が面白い。", "unverified": "本文は入手できず、改修案の費用と、気候モデルの不確かさの扱いは確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "AIとアルゴリズム管理が集団的労働権に迫る課題", "title": "Reclaiming regulatory space for collective labour rights in the governance of AI and algorithmic management at work", "url": "https://doi.org/10.2139/ssrn.7720539", "authors": "Silvia Rainone ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Rainone, S., & Zwysen, W. (2026). Reclaiming regulatory space for collective labour rights in the governance of AI and algorithmic management at work. https://doi.org/10.2139/ssrn.7720539", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "職場へのAIとアルゴリズム管理の導入が、集団的な労働権の行使の条件をどう変えるかを論じた章（抄録）。未査読。", "p3": "これらの技術が生む情報の非対称、企業の分断と労働の外部化、企業構造をまたぐ管理の移動、データを通じた労働者の価値創造の問題を整理し、EUの規制と社会対話の状況と実証的な証拠を検討した（抄録）。", "p5": "集団的な労働の制度が技術革新の妨げだという想定に反論し、既存の統治の枠組みを見直して、集団的な主体が仕事のデジタル化を方向づける力を強める必要があると論じた（抄録）。", "fun": "AIが仕事を割り振り、評価までする職場では、労働組合が会社と交渉するための前提が揺らぐ。誰が決めているのか、どんなデータで判断しているのかが見えにくくなるからだ。この章は、労働者の集団的な声は技術の邪魔者ではないと主張し、ルールを作り直す必要を説く。技術の問題が、実は誰が情報を持つかという力の問題でもある点が面白い。", "unverified": "本文は入手できず、引用された実証的な証拠の内容と、具体的な制度の提案は確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "報酬感受性は参加に、経済的脆弱性は問題化に関連", "title": "Reward sensitivity is associated with gambling participation, and financial vulnerability with problem gambling in U.S. adults", "url": "https://doi.org/10.31234/osf.io/s2wd9_v1", "authors": "Cooper Joseph Sharp ほか", "venue": "PsyArXiv", "date": "2026-11-20", "apa": "Sharp, C. J., Lakshmanan, A., Sakhiashvili, M., Newnam, E., Mennis, J., & Smith, D. V. (2026). Reward sensitivity is associated with gambling participation, and financial vulnerability with problem gambling in U.S. adults. https://doi.org/10.31234/osf.io/s2wd9_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ギャンブルへの参加と問題ギャンブルが別々の要因と結びつくかを、米国の成人の横断調査で調べた（抄録）。未査読。", "p3": "全国から募った18〜80歳の726人に、ギャンブル行動と症状、社会経済的・経済的な脆弱性、精神的健康、孤独感、リスク志向、報酬感受性、近隣の条件を尋ね、非参加者・娯楽的参加者・問題ギャンブラーを比べた（抄録）。", "p5": "報酬感受性は参加者と非参加者を分けたが、問題と娯楽的な参加は分けなかった。参加者の中では社会経済的な剥奪と金銭的搾取への脆弱性が問題ギャンブルを分け、報酬感受性と症状の重さの関連は孤独感が高いほど強かった（抄録）。", "fun": "ギャンブルを始める人と、やめられなくなる人は、同じ理由で説明できるのか。この研究では、始めるかどうかは「ごほうびへの敏感さ」で分かれたが、のめり込むかどうかは「お金に困っているか、搾取されやすい状況か」で分かれた。入口と深みで別の要因が働くので、対策も分けて考える必要があるという指摘が面白い。", "unverified": "本文は入手できず、各要因の効果の大きさと、標本の代表性の詳細は確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "運用中のLLMの品質低下をLLM判定で継続監視", "title": "LLM Maintainer: A Judge-in-the-Loop Framework for Continuous Quality Monitoring and Regression Detection in Deployed Large Language Model Systems", "url": "https://doi.org/10.21203/rs.3.rs-11102306/v1", "authors": "Ook Lee¹", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Lee¹, O. (2026). LLM Maintainer: A Judge-in-the-Loop Framework for Continuous Quality Monitoring and Regression Detection in Deployed Large Language Model Systems. https://doi.org/10.21203/rs.3.rs-11102306/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "運用中のLLMシステムの品質の低下を、別のLLMを判定者にして継続的に検出するオープンソースの道具を示した（抄録）。未査読。", "p3": "固定した「お手本の問い」の一式を毎回実行して自然言語の採点基準でLLMに採点させ、結果を保存して、テストごとの移動基準からの統計的に意味のある低下を警告する。YAMLの設定、実行器、判定、回帰検出、SQLite、Flaskのダッシュボードからなる（抄録）。", "p5": "実際のAPIに接続できない環境のため、銀行の顧客対応を模した6問の一式で30日分（180組）の合成の事例研究を行い、意図的に入れた6つの異常のうち5つ（再現率83.3%）を検出したが、通常のばらつきによる誤警報が18件あり、適合率は21.7%（F1=0.345）だった（抄録）。", "fun": "AIのサービスは、作った側が何も変えなくても、裏のモデルが更新されると答え方が変わってしまう。この研究は、別のAIを採点係にして毎日同じ問題を解かせ、点数が落ちたら知らせる仕組みを作った。ただ、採点係の点数そのものが日によってぶれるため、誤報が多かった。監視する側のAIの気まぐれも測らないといけない点が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて統計的な改善策の効果は確認できなかった。結果は実運用ではなく合成の事例研究による。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "誘導の行動効果だけでは概念の因果的制御と言えない", "title": "Behavioral Steering Does Not Establish Concept-Specific Causal Control in Language Models", "url": "https://doi.org/10.2139/ssrn.7705480", "authors": "Keito Inoshita", "venue": "SSRN", "date": "2026-11-20", "apa": "Inoshita, K. (2026). Behavioral Steering Does Not Establish Concept-Specific Causal Control in Language Models. https://doi.org/10.2139/ssrn.7705480", "why": "言語モデルの活性化を概念の方向に足す誘導（steering）で行動が変わっても、その方向が名前どおりの概念を通じて効いているとは限らないとし、概念の選択性と行動効果を同じ強さで確かめる証拠の基準を提案する。ランダムな方向と、目標を並べ替えて同様に学習した帰無の方向とを比べ、2つのモデルの意思決定課題では、概念を選択的に担う方向でも加算的な誘導では帰無の方向より選択的でない場合があることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "言語モデルの活性化を概念の方向に足す誘導（additive steering）で行動が変わっても、それだけでは概念に特有の因果的な制御の証拠にならないことを、選択性と効果の重なりの基準（SEOC）で示した（抄録）。未査読の単著。", "p2": "活性化の誘導は、ある概念の方向が行動を制御することを示すのによく使われるが、行動への効果だけでは、その方向が名前どおりの概念を通じて働いているとは言えない（抄録）。", "p3": "SEOCはまず概念の評定が行動を追うことを確かめ、次に加算的な誘導での概念の選択性と、同じ強さでの特異的な行動効果を求める。両方をランダムな方向と、目標を並べ替えて同様に最適化した帰無の方向に対して検定し、正解が分かっている規則の変数を陽性対照にした。合格は強い証拠だが、不合格は不在の証拠ではないとする（抄録）。", "p4": "2段階の意思決定課題での「制御可能性」と「成功の期待」について、2つの言語モデルで、交換介入による選択性と、加算的な誘導による選択性・行動効果を比べた（抄録）。", "p5": "交換介入は各概念を選択的に運ぶ方向を特定したが、加算的な誘導ではそれらの方向は帰無の方向より選択的でなく、制御可能性の方向の行動効果はランダムな方向を上回っても帰無の方向は上回らなかった。規則の陽性対照も行動の段階に失敗し、規則間の行動の違いの大半は隠れ状態全体が担い、規則の評定を運ぶ方向はほとんど担わなかった（抄録）。", "p6": "抄録には2つのモデルの名前・規模と効果の数値が書かれていない。解釈：基準は厳しく不合格でも不在の証拠ではないため、実用上どの手続きで合格とみなせるかの目安は今後の検証が要る。", "fun": "AIの頭の中で「自信」に当たる方向を見つけ、そこを強めたら行動が変わった。だからAIは自信を感じて行動を変えた、と言えるのか。この研究は、目標をでたらめに入れ替えて作った方向でも同じくらい行動が変わるなら、その解釈は早計だと示した。ある情報を読み取れる場所と、行動を動かしている場所は別かもしれないという指摘が面白い。", "unverified": "本文は入手できず、使用した2つのモデル、課題の詳細、効果の大きさの数値は確認できなかった。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "忙しい取引先には単純な契約のほうが効く", "title": "Simple Contracts for Busy Firms: Evidence from a Supply Chain Experiment", "url": "https://doi.org/10.2139/ssrn.7716298", "authors": "Guojun He ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "He, G., Chen, H., & Xiahou, Q. (2026). Simple Contracts for Busy Firms: Evidence from a Supply Chain Experiment. https://doi.org/10.2139/ssrn.7716298", "why": "上場企業の仕入先網でのフィールド実験で、KPIの選び方（指定か委任か）と監査の範囲（絞るか全面か）を独立に変え、指定と絞った監査のほうが仕入先の情報提供と裏付け資料を増やすことを示す。理解と実行が同じ処理能力を分け合うモデルで、能力が限られるときは単純な契約が有効になることを説明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "上場企業の仕入先網でのフィールド実験で、KPIの選び方を指定し監査を絞った単純な契約のほうが、委任や全面的な監査より仕入先の情報提供を増やすことを示し、処理能力の制約で説明するモデルを示した（抄録）。未査読。", "p2": "契約は多くの業務を抱える企業によって読まれ、理解され、実行されるが、権限と監視の範囲という契約の設計が取引先の関与にどう影響するかを実験で調べた例は少ない（抄録）。", "p3": "意思決定の権限（KPIの選択を指定するか委任するか）と監視の範囲（絞った監査か全面的な監査か）を独立に無作為に変え、仕入先が報告する情報と裏付けの資料を測った。理解と実行が同じ能力の予算を分け合うモデルで、能力が限られるとき単純な契約が有効になることを示した（抄録）。", "p4": "主な成果は仕入先の報告する情報量と裏付け資料で、課題の扱いやすさ・仕入先の能力・報告の役割による効果の異質性で能力の解釈を検証した（抄録）。", "p5": "指定と絞った監査は仕入先の情報の報告と裏付け資料の提出を増やし、委任と全面的な監査の効果は小さく推定も不正確だった。効果の異質性は能力の解釈を支持した（抄録）。", "p6": "抄録には実験の規模（仕入先の数）、効果の大きさ、上場企業の業種が書かれていない。解釈：報告の量の増加が実際の業績や品質の改善につながったかは抄録からは分からない。", "fun": "取引先に自由を与え、全部をチェックする契約は、一見すると手厚くて良さそうだ。ところがこの実験では、報告する指標を決め打ちし、確認する範囲も絞った単純な契約のほうが、取引先はより多くの情報と資料を出してきた。忙しい相手には理解して実行する余力が限られているからだという説明が面白い。", "unverified": "本文は入手できず、仕入先の数、効果の大きさ、業種は確認できなかった。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "AI起業の資金調達の優位は北米と中東に偏る", "title": "Frontier Technology in Frontier Markets? Financing Global AI Entrepreneurship", "url": "https://doi.org/10.2139/ssrn.7720318", "authors": "Gilles Q. Hacheme ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Hacheme, G. Q., Iyoha, E., Ndiaye, A., & Souleymane, N. S. (2026). Frontier Technology in Frontier Markets? Financing Global AI Entrepreneurship. https://doi.org/10.2139/ssrn.7720318", "why": "172か国の11万6,795社のスタートアップの事業内容・資金調達と創業者・初期社員・投資家の経歴をつなぎ、AIスタートアップがどの地域でも汎用技術の特徴を示す一方、資金調達の上乗せは北米151%・中東181%に対し東アジア42%・欧州16%で、アフリカ・中南米・南アジアでは検出されないことを示す。", "explain": {"basis": "本文", "basis_note": "CESifoのワーキングペーパーのPDF（序論・考察と図表のキャプション）を読んだ。推定と頑健性の節の詳細は読み切れていない", "preprint": true, "p1": "172か国の11万6,795社のスタートアップのデータで、AIスタートアップがどの地域でも汎用技術らしい幅広い事業を作る一方、資金調達の上乗せ（AIプレミアム）は北米と中東に集中し、アフリカ・中南米・南アジアでは消えることを示した（抄録、Introduction）。未査読のワーキングペーパー。", "p2": "AIの生産性への効果が統計に現れるには時間がかかり、早期の指標とされる利用統計は他所で作られたAIの消費しか捉えない。途上国がAIの利得を得るにはAIを作る企業を育てる必要があり、前向きなベンチャー投資はその早期の信号になる（Introduction）。", "p3": "PitchBook・Stears（アフリカ）の企業と取引の記録、Revelio Labsの創業者52,203人・初期社員719,358人の職歴、Preqinの投資家の記録をつなぎ、LLMで企業の説明文を判定して42,312社のAI生産者を特定した。同じ国・創業年・調達年の中でAIと非AIの企業の年間調達額をPPML（ポアソン疑似最尤法）で比べた（Introduction）。", "p4": "顧客の範囲、ChatGPT公開前後の業務の幅と営業人員（約6万3千社の四半期パネル）、地域別のAIプレミアム、需要・創業者・初期社員・投資家の特徴を加えたときの北米との差の縮まり方を調べた（図1〜5、表3）。", "p5": "AI企業はどの地域でも対象の大分類業種が0.102多く、水平型の製品の確率が16〜23ポイント高かった。ChatGPT公開後、AI適合度が1標準偏差高い企業は業務の種類が平均1.09多かった。AIプレミアムは平均87%だが、北米151%・中東181%・東アジア42%・欧州16%で、アフリカ・中南米・南アジアでは消えた。初期社員の特徴は中南米の差を約29%縮めたが、投資家の特徴は差を縮めなかった（Introduction、図4・5）。", "p6": "著者は、比較は条件付きの関連で、企業と投資家の相互の選択や観察できない地域差が残ると認め、計算基盤や技術金融の制度などデータで測れない補完要因を残る説明に挙げる（Discussion）。解釈：AI企業の判定をLLMに頼るため、判定の誤りの地域差が結果に影響しうる。", "fun": "AIの会社は、アメリカでもアフリカでも同じように何にでも使える幅広い事業を作っている。それなのに、投資家がAIの会社に多くのお金を出すのは北米や中東だけで、アフリカや中南米ではAIでない会社と変わらなかった。アフリカのAI投資の半分ほどはデータセンターのような基盤づくりに向かっているという発見も面白い。AIは世界中で使えても、AIで稼ぐ会社が育つ場所は偏りうることを示している。", "unverified": "本文が長く、推定式の詳細と頑健性の確認の節は読み切れていない。LLMによるAI企業の判定の精度の検証結果は確認できなかった。"}}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "概念を検出する方向と動かす方向は一致しない", "title": "Do Probing and Steering Favor the Same Directions Within and Across Language Models?", "url": "https://arxiv.org/abs/2611.19499", "authors": "Afshin Sadeghi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Sadeghi, A., & Becker, D. (2026). Do Probing and Steering Favor the Same Directions Within and Across Language Models? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19499", "why": "言語モデルの隠れ状態で概念を検出する最良の方向（プローブ）と、足して挙動を変える最良の方向（誘導）が一致するかを、系統の異なる3つのモデルで調べる。判別分析から平均差までの方向の族を比べ、真実性と感情ではどのモデルでも最良のプローブが最良の誘導方向ではなく、誘導は平均差に近い方向を好むことを、層の走査の60組中59組で確かめた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論・方法・実験・結果・結論の節と図表のキャプション）を読んだ。付録は未読", "preprint": true, "p1": "言語モデルの隠れ状態で、概念を検出する最良の方向（プローブ）と、足して挙動を変える最良の方向（誘導）は一致せず、誘導は平均差に近い方向を好むことを、3系統のモデルで示した（抄録、図2）。未査読。", "p2": "誘導の手法はプローブの方向をよく再利用するが、概念をよく予測する方向がモデルを最も効果的に変える方向とは限らない。先行研究は学習したプローブと平均差という2つの方向の比較にとどまっていた（§1）。", "p3": "判別分析から平均差までを1つのパラメータλでつなぐ方向の族 w_λ∝(Σ_W+λI)^(-1)Δμ を作り、各方向をプローブ（保持データのAUROC）と加算的な誘導 h+a‖h‖w で評価した。無関係な文での出力分布の変化（KL）で測る副作用をそろえて比べる（式1・2）。解釈：強く押せば何でも変わるので、同じ乱し量で比べて公平にしている。", "p4": "LLaMA-3.1-8B・Qwen3.5-9B・Gemma-3-12Bで、真実性（TruthfulQA）と感情（Yelp）を深さ約0.44の層で調べた。中立の文で当てはめた線形写像で方向をモデル間で移し、PopQAの4,000問で「分からない」方向への誘導も調べた（§3）。", "p5": "6組すべてでプローブはλ≈τ付近（AUROC 0.96〜0.98）、誘導は平均差寄りで最良だった。真実性では最良のプローブの誘導効果は平均差の21〜64%で、分離は層の走査の60組中59組で成り立った。移したプローブは偶然以上の性能の81〜91%を保ったが、移した平均差の誘導効果は44〜93%で12組中11組でより低かった。「分からない」への誘導は自信のない誤答の控えを18〜44ポイント増やし、自信のある誤答では2〜5ポイントだった（§4）。", "p6": "著者は、3概念・3モデル・主に各1層の分析で、モデル間の12組は独立でなく、単一方向の誘導に限ると認め、誘導の最適点は概念・層・操作・文で変わるとする（§6）。解釈：移植での誘導の低下の一部は写像の当てはまりの悪さ（概念の文でR² 0.13〜0.47）による可能性がある。", "fun": "AIの頭の中には本当かウソかを表す方向があり、そこを見れば答えがウソっぽいか判定できる。では、その方向に頭の中を押せばAIは正直になるのか。この研究は、判定に一番よい方向と、動かすのに一番よい方向は別物だと示した。体温計を当てる場所と、熱を下げるために冷やすべき場所が違うようなものだ（比喩）。読むことと変えることを区別する大切さが分かる。", "unverified": "付録（制約の一覧、層の走査、回転による誘導）は読んでいない。PopQAで正答に変わる効果の数値は確認できなかった。"}}, {"id": "pn05", "rank": 5, "field": "経営学", "headline": "移民の商店は同じ商品を安く売らざるをえない", "title": "The Price Penalty for Migrant Entrepreneurs: Field Evidence from South Africa", "url": "https://doi.org/10.2139/ssrn.7720800", "authors": "Shreya Kankanhalli ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Kankanhalli, S., Kaul, R., & Steenkamp, I. (2026). The Price Penalty for Migrant Entrepreneurs: Field Evidence from South Africa. https://doi.org/10.2139/ssrn.7720800", "why": "ヨハネスブルグの小規模食料品店の悉皆調査と、店主の国籍・価格・銘柄を無作為に変えた消費者の選択実験を組み合わせ、移民の店が同一銘柄の商品を地元の店より安く売り、移民の店への支払意思額が低いことを示す。品質情報の開示で差はわずかに縮むだけで、残る差は反移民の態度とともに大きく、嗜好に基づく差別と整合する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "ヨハネスブルグの小規模食料品店の悉皆調査と消費者の選択実験を組み合わせ、移民の店が同じ商品を安く売らざるをえないこと、その背景に消費者の嗜好に基づく移民への嫌悪があることを示した（抄録）。未査読。", "p2": "移民は世界の小売店の大きな割合を営むが、移民への消費者の態度が市場に届き、移民の店の経営を形づくるかは分かっていなかった（抄録）。", "p3": "独自の小売店の悉皆調査で同一銘柄の商品の価格・仕入費用・品質を比べ、同じ市場の消費者に、店主の国籍・価格・銘柄を無作為に変えた店と商品の組み合わせを選ばせる報酬つきの離散選択実験を行った。嗜好に基づく嫌悪と統計的差別を分けるため、店の品質を開示する情報の処置も無作為化した（抄録）。", "p4": "価格差を細かな立地と店の年数で統制して調べ、選択実験から支払意思額の差を推定し、その差と反移民の態度・品質の信念・商品の傷みやすさとの関係、地域ごとの実験での罰と価格差の対応を比べた（抄録）。", "p5": "移民の店は、仕入費用が同程度で、商品の状態と店の品質がむしろ良く、立地や客層の分離もないのに、同一銘柄の商品を地元の店より安く売り、監査した商品の利益が低かった。移民の店への支払意思額は大幅に低く、品質の情報で差はわずかに縮むだけだった。残る差は反移民の態度とともに大きくなり、実験での罰が強い地域ほど価格差が広かった（抄録）。", "p6": "抄録には価格差と支払意思額の差の大きさ、標本の規模が書かれていない。解釈：南アフリカの一都市の事例であり、移民の出身国による違いや他国への一般化は残る疑問である。", "fun": "同じ銘柄の商品を同じ値段で仕入れ、同じくらい良い店で売っても、店主が移民だというだけで安くしないと売れない、そんなことが起きているのか。南アフリカの調査と実験は、移民の店が実際に安く売っていて、客が移民の店に払ってもよいと思う額も低いことを示した。品質の情報を見せても差はほとんど縮まらず、偏見そのものが値段を下げていると考えられる点が重い。", "unverified": "本文は入手できず、価格差と支払意思額の差の大きさ、店舗と回答者の数は確認できなかった。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "利上げは家計の延滞と破産を地域差を伴い増やす", "title": "The Effects of Federal Funds Rate Changes on Household Debt", "url": "https://doi.org/10.2139/ssrn.7733525", "authors": "Rajashri Chakrabarti ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Chakrabarti, R., Chatterji-Len, K., Garcia, D., & Pinkovskiy, M. (2026). The Effects of Federal Funds Rate Changes on Household Debt. https://doi.org/10.2139/ssrn.7733525", "why": "政策金利の変化への曝露が大きい郡と小さい郡を比べ、金融引き締めが延滞・差し押さえ・破産の増加と住宅・自動車の借入の減少をもたらし、低所得・サブプライム比率の高い地域で影響が大きいことを示す。引き締めは緩和より効果が大きい非対称性があり、短期は借入費用、中長期は雇用を通じて伝わる。", "explain": {"basis": "本文", "basis_note": "NY連銀スタッフレポートのPDF（序論・データ・結果の一部・結論）を読んだ。付録は未読", "preprint": true, "p1": "政策金利（FF金利）の変化が家計債務に与える影響を、債務所得比（DTI）の高い郡と低い郡の比較で推定し、引き締めが高レバレッジの地域で延滞・差し押さえ・破産を増やし、住宅と自動車の借入を減らすことを示した（抄録、§4.1）。NY連銀のスタッフレポートで未査読。", "p2": "金融政策は経済の状況に反応して動くため、家計の指標を政策金利に単純に回帰すると政策の効果と状況の効果が混ざる。効果が家計の債務への曝露で違うかも十分に調べられていなかった（Introduction）。", "p3": "Equifax/NY連銀の消費者信用パネル（米国の借り手の5%標本）とMcDashの住宅ローンの記録を郡に集計し、FF金利×DTIの係数を局所射影で推定した。時点の固定効果で全国の状況を吸収し、政策金利の長い遅れを統制し、FOMC前後の高頻度の金利変化によるショックでも確かめた（Data、Introduction）。", "p4": "成果は借入・カード残高・延滞・返済・信用スコア・差し押さえ・破産の伸び率で、引き締めと緩和の非対称性、借入費用・雇用・住宅価格の媒介、変動金利型住宅ローン（ARM）の比率、郡の属性による違いも調べた（図1、Introduction）。", "p5": "100bpの利上げの1年後、DTIが1標準偏差（約40ポイント）高い郡ではカード残高の伸びが約1ポイント速く、返済額の伸びは1.5〜2ポイント高かった。延滞の割合の伸びは約4年間速く、自動車ローンで平均の伸びの3分の1近く、住宅ローンで3倍を超えた。引き締めは緩和より効果が大きく、短期は借入費用、1年〜1年半後以降は主に雇用を通じて伝わり、ARMの多い地域と時期で強かった（§4.1、Conclusion）。", "p6": "郡単位の集計での差の推定で、個々の家計の因果は直接分からない。解釈：低所得の郡で効果が弱い理由を著者は正規の金融へのつながりの弱さに求めるが（Introduction）、推測の段階である。", "fun": "政策金利が上がると、借金の多い地域ほど家計は苦しくなる。この研究は米国の郡ごとのデータで、借金が所得に比べて多い郡では、利上げの後にローンの延滞や破産が増え、家や車を買うための借入が減ることを示した。面白いのは、最初は利息の負担が効き、1年ほどたつと仕事が減ることで効いてくるという、時間で変わる伝わり方だ。", "unverified": "付録の頑健性の確認と、住宅ローンの承認拒否などの図2以降の数値は確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "非定常な多変量時系列の因果構造を局所から速く学ぶ", "title": "Time Series Structure Learning with Local Causal Parent Discovery", "url": "https://arxiv.org/abs/2611.26232", "authors": "Jacqueline Maasch ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Maasch, J., Wan, S., Zhu, H., Liu, H., & Wang, Z. (2026). Time Series Structure Learning with Local Causal Parent Discovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26232", "why": "因果の非定常性を持つ多変量時系列で、変数ごとに親の集合を順に見つけて全体のグラフを組む制約ベースの手順ITPDを提案し、健全性と完全性を示す。時間の事前構造と局所マルコフ条件で高次の条件付き独立性検定を低次に置き換え、2000ノードのグラフで既存法（PCMCIなど）より2.3〜40.9倍速く動いた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論・手法・実験・限界の節）を読んだ。付録の証明と拡張実験は未読", "preprint": true, "p1": "因果構造が時間とともに変わる（非定常な）多変量時系列で、変数ごとに親の集合を順に見つけて全体の因果グラフを組む制約ベースの手順ITPDを提案し、健全性と完全性を示した（抄録、§4.3）。未査読。", "p2": "制約ベースの因果探索は条件付き独立性（CI）検定を重ねるため、検定数と必要な標本がグラフの大きさに対して指数的に増えうる。時系列では自己相関と分布の変化も加わり、窓グラフの定常性を仮定するPCMCIなどは仮定が外れると誤る（§1、図1）。", "p3": "ITPDは時間順序と1期前の自己相関という構造の事前知識、因果的な分割、局所マルコフ条件を組み合わせ、各変数について第1段階で候補を緩い閾値でふるい、第2段階でBonferroni補正した閾値で親を確定する。仮定は非巡回性・忠実性・同時点の因果がないこと・t=1以降の潜在交絡がないことで、因果の定常性は仮定しない（§4.3）。", "p4": "正解グラフに対するF1、CI検定の数と条件づけ集合の大きさ、計算時間で、IAMB・PCMCI・DF-PC・DYNOTEARS・CD-NOD・Lassoなどと比べた。主な設定は20変数・16時点の線形ガウスの非定常グラフで、非線形の機構、最大2000ノード、DREAM4の遺伝子制御網の模擬でも評価した（§5.1）。", "p5": "厳密なオラクルの32設定（計4,240グラフ）ではすべて真のグラフを返し、条件づけ集合が最小だった。主設定のF1はLasso・PCMCI・CD-NOD・DYNOTEARSを全設定で上回ったが、IAMBには12設定中6で劣った。辺の5%を毎時点で引き直すグラフでPCMCIなどは0.562〜0.808に落ち、ITPDは0.984〜0.994を保った。2000ノードではPCMCIより40.9倍速かった（§5.2、抄録）。", "p6": "著者は、全設定で他手法を上回るわけではないこと、有利な領域の公開の実データのベンチマークがなく実データで評価できなかったこと、潜在変数と同時点の因果を許していないことを限界とする（§5.3）。解釈：検証は主に合成データで、実際の観測系列での有効性は未確認である。", "fun": "たくさんの変数が時間とともに影響し合うデータから、何が何の原因かを矢印の図として取り出すのは、変数が増えると組み合わせが爆発して難しい。この研究は、一つの変数ずつ直前の時刻のどの変数から矢印が来ているかを探し、それをつなげて全体の図を作る方法を作った。因果のつながり方が途中で変わっても崩れにくく、2000個の変数でも速かった点が面白い。", "unverified": "付録の証明と拡張実験の表は読んでいない。計算時間の具体的な秒数は確認できなかった。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "ロボット操作ベンチマークの成功判定の誤りを監査", "title": "Phantom Success, Silent Failure: Auditing the Success Checkers of Simulated Manipulation Benchmarks", "url": "https://arxiv.org/abs/2611.25179", "authors": "Zirui Song ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Song, Z., Zhang, J., Lu, Z., Ma, X., Chang, X., & Chen, X. (2026). Phantom Success, Silent Failure: Auditing the Success Checkers of Simulated Manipulation Benchmarks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25179", "why": "模擬環境のロボット操作ベンチマークで、手書きの成功判定が未完了の実行を成功とする（幻の成功）か、指示を満たす実行を失敗とする（沈黙の失敗）かを、LLMで指示と判定コードの食い違いを探し、模擬環境で再現して多視点の描画で確かめるパイプラインSimAuditで監査する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・監査の結果・方策の再評価・結論の節と表1）を読んだ。付録は未読", "preprint": true, "p1": "ロボット操作のシミュレーション・ベンチマークで、手書きの成功判定が未完了の実行を成功とする「幻の成功」や、指示を満たす実行を失敗とする「沈黙の失敗」を、LLMベースのパイプラインSimAuditで系統的に見つけ、3つのベンチマークで61件の欠陥を確認した（抄録、表1）。未査読。", "p2": "成功判定はお手本の実演が通ることで確かめられているが、学習した方策は途中で止まったり別のやり方で達成したりするため、判定がそれを正しく扱えるかは検証されていなかった（抄録、§1）。", "p3": "指示だけから達成とみなすべき状態を、判定コードだけから判定が受け入れる状態を別々に書き出し、食い違う状態の仮説を最大4つ立て、模擬環境で再現して元の判定を実行し、多視点の描画で指示を満たすかを確かめる（§3.2）。例：「台に物を置く」の判定は、物が台から水平3 cm以内でグリッパーの開く指令が出ていれば成功とし、高さや接触を見ていなかった。", "p4": "RoboTwin 2.0、RoboCasa365、RoboDojoを監査し、欠陥を誤りの向きと5つの主な原因で分類した。報告した欠陥は2人の注釈者が独立に確かめ、修正した検証済みの判定で既存の方策の実行を採点し直した（§4）。", "p5": "183の模擬テストが予測どおりの判定を出し、視覚の確認と重複除去で49課題の61件の欠陥（幻の成功40、沈黙の失敗21）が残り、注釈者2人は全件を確認した。RoboCasa365は過大評価、RoboDojoは過小評価、RoboTwin 2.0は両方向で、主因は指の状態でなく指令値を読む代理の信号だった（表1）。採点し直すと「ベルを押す」でX-VLAの成功率は95%から20%に落ちた（§4.4）。", "p6": "監査は3つのベンチマークに限られる（§4.1）。解釈：LLMが仮説を立てない種類の欠陥は見逃されうるため、見つかった61件は欠陥の下限とみるべきだろう。", "fun": "ロボットに「ベルを押して」と頼んだ結果を、コンピュータの採点係が判定する。ところが採点係が手がベルの近くまで行ったかしか見ていなければ、触れていなくても合格になってしまう。この研究は、AIに採点プログラムの穴を推理させ、実際にその場面を作って確かめる方法で、3つの試験から61件の採点ミスを見つけた。採点し直すと成功率が95%から20%に下がった例もあり、試験そのものを疑う大切さが分かる。", "unverified": "付録の欠陥の分類の詳細と、全方策の採点し直しの数値（表2）は読み切れていない。"}}, {"id": "pn09", "rank": 9, "field": "経営学", "headline": "楽観的な起業家がキラー買収を増やす", "title": "Entrepreneurial Optimism and Killer Acquisitions", "url": "https://doi.org/10.2139/ssrn.7720324", "authors": "Michele Dell'Era", "venue": "SSRN", "date": "2026-11-20", "apa": "Dell’Era, M. (2026). Entrepreneurial Optimism and Killer Acquisitions. https://doi.org/10.2139/ssrn.7720324", "why": "既存企業が将来の競合を防ぐために新興企業の開発を買って棚上げするキラー買収のモデルに、成功確率を過大評価する起業家の楽観を入れ、楽観が買収の確率とキラー買収の割合を高めることを示す。楽観が強いと社会的価値が負の開発を棚上げする買収が厚生を高める場合があり、買収阻止の利得は中程度の楽観で最大になる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "新興企業の開発を既存企業が買って棚上げするキラー買収のモデルに、成功確率を過大評価する起業家の楽観を入れ、楽観が買収とキラー買収を増やす一方、楽観が強いと一部のキラー買収が厚生を高めうることを示した（抄録）。未査読の単著。", "p2": "キラー買収は将来の競争を防ぐために行われ、競争政策の焦点になっているが、起業家の楽観という行動的な要因が買収の発生と厚生への影響をどう変えるかは分析されていなかった（抄録）。", "p3": "1社の既存企業がいる市場のモデルで、楽観的な起業家は開発の成功確率を過大に見積もり、現実的な起業家なら断念する開発を続ける。既存企業はそうした開発を買収して棚上げし、将来の競争を先回りして防ぐ（抄録）。", "p4": "楽観の強さに応じた買収の確率、キラー買収の割合、総厚生、キラー買収を阻止したときの厚生の得失を比べた（抄録）。", "p5": "楽観は買収の確率とキラー買収の割合を高めた。現実的な起業家ならキラー買収は総厚生を下げるが、十分に楽観的な起業家では、社会的価値が負の開発を棚上げすることで一部のキラー買収が厚生を高めうる。阻止による純厚生の利得は中程度の楽観で最大で、楽観が非常に強いと阻止は厚生を下げうる（抄録）。", "p6": "抄録の範囲では理論モデルの結果で、楽観の程度の測り方やデータでの検証はない。解釈：政策の含意は楽観の分布という観察しにくい量に依存するため、買収審査に使うには実証が要る。", "fun": "大企業が有望な新興企業を買い取り、その製品をわざと世に出さずにしまい込むキラー買収は、ふつう悪いことだとされる。ところがこの研究のモデルでは、起業家が自分の発明を過信していて、実は社会にとって割に合わない開発を続けようとしている場合、それを止めることがかえって社会のためになることがある。規制の良し悪しが起業家の思い込みの強さで変わるという点が面白い。", "unverified": "本文は入手できず、モデルの具体的な仮定と、結果が成り立つパラメータの範囲は確認できなかった。"}}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "コード検索の密ベクトルの優位は評価の選び方による", "title": "Embeddings vs. Grep: Rethinking the Dense Advantage in Code Search", "url": "https://arxiv.org/abs/2611.20455", "authors": "Siqiao Xue ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Xue, S., Zhang, Z., Liao, Z., Qin, J., Mu, Y., & Yu, H. (2026). Embeddings vs. Grep: Rethinking the Dense Advantage in Code Search (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20455", "why": "91のリポジトリと2022〜2026年のプルリクエストからなる事前登録のコード検索ベンチマークを作り、密な埋め込みのBM25に対する優位が、BM25に不利な評価の選択と、コードの珍しい識別子を含まないクエリに由来することを示す。LLMに識別子を書かせてからgrepする方法はBM25を大きく改善する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ベンチマークの構築・実験設定・結果・考察と限界の節）を読んだ。付録は未読", "preprint": true, "p1": "コード検索で密な埋め込みがBM25を大きく上回るという「密ベクトルの優位」の多くは評価の設定によるもので、LLMに識別子を書かせてからgrep型で検索する方法（generate-then-grep）なら密検索に追いつくことを示した（抄録、表2）。未査読。", "p2": "ベンチマークでは密な埋め込みが優位なのに、コーディングエージェントはgrepでうまく動く。既存のベンチマークは厳選したクエリ、古いコード、不利な設定のBM25を使っており、優位が何を測るのか分からなかった（抄録、§1）。", "p3": "実際のリポジトリのファイルを順位づける課題で、6言語の厳選・生のクエリ、2022〜2026年のプルリクエスト、91リポジトリの事前登録したテスト集合からなるRepoPremiumを作った。BM25をファイル全体で使う公平な比較と、LLM（qwen35-122B）が書いた識別子・API・エラー語をクエリに付けるgenerate-then-grepを試した（§3、§5.2）。", "p4": "指標はnDCG@10とRecall@10で、リポジトリ単位のクラスタ化した95%区間で差を判定した。チャンク分割、テストファイルを正解に数えるか、検索器の勝敗の予測、エージェントでの検索ツールの差も調べた（§4、§5）。", "p5": "djangoではファイル全体の密検索がBM25に負け（Δ=−0.153）、1,000字のチャンクで+0.119に反転した。ファイル全体のBM25に対する優位は厳選プールで+0.034に縮み、テストファイルを正解に数えると+0.165に膨らんだ。generate-then-grepはBM25を0.11〜0.19改善し、厳選プールで密検索を0.081上回った。融合は密検索単独より+0.060高く、クエリごとの勝者を予測できる方法はなかった（AUROC 0.47〜0.54）（§5、表2）。", "p6": "著者は、中核が10のPythonリポジトリで他言語は各1リポジトリであること、BM25の設定を評価クエリで選んだこと、生成器への依存、関数・行の単位を試していないことを限界とする（Limitations）。解釈：エージェントでは検索ツールより使うLLMの差が大きい（§5.7）という結果は、改良の優先順位を考え直させる。", "fun": "プログラムの中から目的のファイルを探すとき、AIの意味で探す検索と、昔ながらの単語で探すgrepのどちらが強いのか。評価の表では意味で探すほうが圧勝していたが、この研究は、その差の多くが採点の仕方の不公平から来ていたと示した。さらに、AIに探すべき関数名を先に考えさせてから単語で探すと、意味で探す方法に追いついた。道具の優劣は測り方次第という教訓が面白い。", "unverified": "付録（言語別の結果、費用の比較、エージェントの評価の詳細）は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "少数標本の二重頑健DiDに潜む落とし穴を整理", "title": "Doubly Robust Difference-in-Differences Under Low Sample Size", "url": "https://doi.org/10.2139/ssrn.7715118", "authors": "Weston Brooks", "venue": "SSRN", "date": "2026-11-21", "apa": "Brooks, W. (2026). Doubly Robust Difference-in-Differences Under Low Sample Size. https://doi.org/10.2139/ssrn.7715118", "why": "処置群やクラスタが少ない、事前期間が短い、重なりが弱いといった少数標本の設計で二重頑健な差の差推定量を使うときの識別と推論の問題を整理する。二重頑健性は維持された識別仮定の下での推定方程式の性質であり、信頼できる研究設計や有限標本で妥当な推論の代わりにならないと論じる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "処置群やクラスタが少ない、事前期間が短い、重なりが弱いといった少数標本の設計で、二重頑健な差の差（DR-DiD）推定量を使うときの識別と推論の問題を整理し、報告のチェックリストを示した論文（抄録）。未査読の単著。", "p2": "DR-DiDは結果の回帰と傾向スコアを組み合わせ、どちらか一方が正しく特定されれば一致性を保つため魅力的だが、二重頑健という言葉は少数標本の設計で応用研究者を誤らせうる（抄録）。背景：差の差法は、処置がなければ両群の推移が平行だったという仮定の下で、処置群と対照群の前後の変化の差から効果を推定する。", "p3": "条件付きの平行トレンドと時期をずらした導入（staggered adoption）に注目して、古典的なDiD、セミパラメトリックなDiD、群×時点の平均処置効果の推定量、代入法、イベントスタディの推定量を比べた（抄録）。", "p4": "少数標本が、平行トレンドの診断の検出力、局外関数の推定の安定性、クラスタ頑健やブートストラップによる近似の妥当性という設計の3つの層に与える影響を評価の観点とした（抄録）。", "p5": "二重頑健性は維持された識別仮定の下での推定方程式の頑健性であり、信頼できる研究設計・十分な事前情報・有限標本で妥当な推論の代わりにならないと論じた。事前トレンドの検定は記述的な証拠と読むべきこと、重なりが弱いとDRの補正が分散を増やしうること、処置クラスタが少ないときは特別な推論の手続きが要ることを示した（抄録）。", "p6": "抄録の範囲では、模擬実験や実データでの比較の結果は示されていない。解釈：既存の議論の整理が中心とみられ、チェックリストが実際の推定の誤りをどれだけ減らすかは別途の検証が要る。", "fun": "政策の効果を「導入した地域としなかった地域の変化の差」で測る方法は広く使われ、二つの推定の工夫を組み合わせた二重に頑健な方法も人気がある。ところがこの論文は、比べる地域が少ないと、その頑健さは名前ほど頼りにならないと警告する。言葉の響きに安心せず、データの量と設計の確かさを先に確かめるべきだという指摘が面白い。", "unverified": "本文は入手できず、チェックリストの具体的な項目と、推奨する推論の手続きの詳細は確認できなかった。"}}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "多元の交互固定効果を持つ動学パネルの一致推定", "title": "Consistent Estimation of Dynamic Multi-way Interactive Fixed Effects Models with Weak Cross-sectional Dependence", "url": "https://doi.org/10.2139/ssrn.7710938", "authors": "Yu Xia", "venue": "SSRN", "date": "2026-11-20", "apa": "Xia, Y. (2026). Consistent Estimation of Dynamic Multi-way Interactive Fixed Effects Models with Weak Cross-sectional Dependence. https://doi.org/10.2139/ssrn.7710938", "why": "観測されない多層の交互固定効果を持つ異質な動学パネルモデルで、断面平均とその遅れで因子を代理する加重平均の群推定量を提案する。モンテカルロ実験で漸近正規性と弱い因子への頑健性を示し、弱い断面依存の下で主成分分析による方法を上回るとする。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "観測されない多層の交互固定効果を持つ異質な動学パネルデータモデルについて、断面平均とその遅れで因子を代理する加重平均の群推定量を提案した（抄録）。未査読の単著。", "p2": "共通相関効果（CCE）の推定で、多層の交互固定効果が観測されないとき、異質な動学パネルモデルをどう推定するかは難しい課題だった（抄録）。背景：交互固定効果は、時点ごとの共通の要因（因子）に単位ごとに異なる反応（負荷）が掛かる形で、観測されない共通のショックを表す。", "p3": "観測されない因子を断面平均で代理し、その遅れを拡張回帰に加えて、多元の交互固定効果を持つ異質な動学パネルモデルの加重平均群推定量を得た（抄録）。", "p4": "モンテカルロ実験で推定量の実行可能性、漸近正規性、弱い因子への頑健性を調べ、弱い断面依存の下で主成分分析（PCA）による方法と比べた（抄録）。", "p5": "推定量は漸近正規で弱い因子に頑健であり、弱い断面依存の下で主成分分析による方法を上回ったとする（抄録）。", "p6": "抄録には証明の有無、模擬の設定と性能の数値、実データへの適用が書かれていない。解釈：漸近正規性が理論で示されたのか模擬から示唆されたのかは抄録の文面からは判然としない。", "fun": "国や企業のデータを何年分も並べたパネルデータでは、世界的な不況のような共通の出来事が、国ごとに違う強さで効いてくる。しかもその出来事は直接は観測できない。この研究は、全員の平均の動きを見えない出来事の代わりに使い、過去の影響が残る動きのあるモデルでも推定する方法を考えた。見えないものを平均で捉えるという発想が面白い。", "unverified": "本文は入手できず、模擬実験の条件と性能の数値、理論的な結果の詳細は確認できなかった。"}}, {"id": "pn13", "rank": 13, "field": "工学", "headline": "不確かさを含むTMD設計を解析的に解く枠組み", "title": "Analytical framework for incorporating uncertainties into design optimization of tuned mass dampers", "url": "https://doi.org/10.31224/8862", "authors": "Mario Argenziano ほか", "venue": "engrXiv", "date": "2026-11-20", "apa": "Argenziano, M., Cavuoto, R., & Ikeda, Y. (2026). Analytical framework for incorporating uncertainties into design optimization of tuned mass dampers. https://doi.org/10.31224/8862", "why": "同調質量ダンパー（TMD）の機械的特性のばらつきを確率変数として扱い、極配置法を確率的な設定に組み込んだ解析的な設計の枠組みを示す。目標の構造応答から逆問題として設計し、決定論的に調整したTMDが主構造と同調しなくなる問題に対処する。", "explain": {"basis": "抄録", "basis_note": "engrXivの抄録を使用。本文は入手できず", "preprint": true, "p1": "同調質量ダンパー（TMD）自体の機械的特性のばらつきを確率変数として扱い、極配置法を確率的な設定に組み込んだ解析的な設計の枠組みを示した（抄録）。未査読。", "p2": "TMDの設計は従来、入力の励振だけを不確かとし、ダンパーの設計パラメータは決定論的に扱ってきた。材料の不均一、製造の誤差、環境の変化、劣化による固有の不確かさを無視すると、決定論的に調整したTMDが主構造と同調しなくなり効率が落ちる（抄録）。", "p3": "設計を逆問題として扱い、まず目標とする構造応答として理想のモード振動数と減衰比（数学的には極）を定め、そこから逆算して、ダンパーの機械的パラメータの分散を組み込んだ必要な物理特性を求める（抄録）。背景：極配置法は、運動方程式の固有値（極）が望みの位置に来るように設計のパラメータを決める方法である。", "p4": "抄録の範囲では、具体的な数値例、比較対象（決定論的な最適化など）、評価指標は明示されていない（抄録）。", "p5": "抄録は、TMDの設計を決定論的なモデルから確率的な領域へ移し、パラメータの不確かさを包括的に扱う工学的な道具になると述べるが、性能の改善の数値は示していない（抄録）。", "p6": "抄録には数値例、モンテカルロ法との比較、多自由度の構造への適用が書かれていない。解釈：解析的な扱いのため、パラメータの分布や非線形性の仮定がどこまで現実のばらつきに合うかが残る疑問である。", "fun": "高いビルや橋の揺れを抑えるため、揺れと逆向きに動く重り（同調質量ダンパー）を取り付けることがある。重りのばねの硬さがぴったり合っていないと効き目が落ちるが、実際の部品は製造のばらつきや劣化で設計どおりにはならない。この研究は、そのばらつきを初めから計算に入れ、目標の揺れ方から逆算して部品の性質を決める方法を示した。不確かさを前提に設計する発想が面白い。", "unverified": "本文は入手できず、数値例、比較の結果、仮定したばらつきの分布は確認できなかった。"}}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "複数人の脳を同時計測して組織の相互作用を探る", "title": "Seeing Eye to Eye: Hyperscanning as a Method for Advancing Theory on Interpersonal and Group Processes in Organizations", "url": "https://doi.org/10.2139/ssrn.7709978", "authors": "Xiaqing Nancy He ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "He, X. N., & Yan, J. J. (2026). Seeing Eye to Eye: Hyperscanning as a Method for Advancing Theory on Interpersonal and Group Processes in Organizations. https://doi.org/10.2139/ssrn.7709978", "why": "対話する複数人の脳活動を同時に記録するハイパースキャニングを組織研究の方法として位置づけ、脳間同期を行動に先立つ神経の同調として構成概念の妥当性を論じる。リーダーとフォロワー、チームの認知、投資家と起業家の対話の3領域で、仮説と検出力の枠組み、EEG・fNIRSの手順を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "対話する複数人の脳活動を同時に記録するハイパースキャニングを組織研究の方法として位置づけ、脳間同期（IBS）の構成概念の妥当性を論じ、3つの領域での仮説と実施の手引きを示した（抄録）。未査読。", "p2": "経営研究は認知・調整・リーダーシップを関係的な現象と認めつつあるが、主流の方法はそれらを孤立した個人の性質として扱っている（抄録）。", "p3": "脳間同期を、行動に先立つ予期的な神経の同調という既存の測定では捉えられない関係的な過程の次元として論証し、リーダーとフォロワーの影響の神経基盤、チームの認知と集団の成果、投資家と起業家の対話中の認知の3領域で、明示した仕組みから仮説を導いた（抄録）。", "p4": "各領域について、現実的な組織の標本の大きさに合わせた検出力と実行可能性の枠組みを示し、6段階の手順、EEGとfNIRSの前処理のチェックリスト、分析の選択の意思決定表、妥当性への脅威の一覧を示した（抄録）。", "p5": "抄録の範囲では実証データはなく、成果は概念的・方法論的な足場（仮説、検出力の枠組み、実施の手引き）である（抄録）。", "p6": "実証研究ではないため、脳間同期が組織の成果を予測するかは今後の検証に委ねられる（抄録）。解釈：実験室の課題と現実の組織の相互作用の類似をどこまで確保できるか、測定費用と標本数の制約が実用の課題になる。", "fun": "会議で話がかみ合うとき、二人の脳の活動も同じリズムで動いているのかもしれない。ハイパースキャニングは、話し合う人たちの脳を同時に測る方法だ。この論文は、上司と部下、チーム、投資家と起業家のやり取りを、言葉や行動になる前の脳の同調から調べる研究の設計図を示した。人間関係を一人ずつではなく「あいだ」で測ろうとする発想が面白い。", "unverified": "本文は入手できず、提示された仮説の具体的な内容と、検出力の枠組みの数値は確認できなかった。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "視覚言語行動モデルに安全に止まることを教える", "title": "Teaching Vision-Language-Action Models to Stop Safely", "url": "https://arxiv.org/abs/2611.26239", "authors": "Zheyuan Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Liu, Z., Wang, C., Guo, J., Huang, Y., Yuan, X., Ma, N., & Jiang, M. (2026). Teaching Vision-Language-Action Models to Stop Safely (Version
