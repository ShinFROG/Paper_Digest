 S. I., Michael Brode, W., Jayasundera, M. C., & Kvale, E. A. (2026). Feasibility and acceptability of a community health worker-led, dementia-focused, caregiver-centered intervention for navigating care transitions. Innovation in Aging. https://doi.org/10.1093/geroni/igag135", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "認知症の人と介護者の組を対象に、地域保健員（CHW）が主導する退院後のケアの案内の介入CEDARTを試験的に行い、実行可能性と受容性を評価した（抄録）。", "p3": "大学病院で34組を登録した単群の試験で、介護者中心の評価、認知症の教育、ケアの案内、資源への橋渡し、退院後12週の追跡を行い、開始時・6週・12週に評価した（抄録）。", "p5": "適格の84組のうち34組（40.5%）が登録し、事前に決めた25%の基準を超えたが、12週の継続率は41.2%だった。評価を終えた介護者16人の受容性は高かった（平均4.53、SD 0.74）（抄録）。", "fun": "認知症の人が病院から家に帰るときは、薬や通院、介護サービスの手配などで家族が混乱しやすい。この試験では、地域の保健員が家族に寄り添って案内する仕組みを試し、家族からの評価は高かった。一方で12週まで続けられたのは41.2%で、本人の死亡で抜けた組もあった。支援の必要が大きい人ほど続けにくいという難しさが見える（解釈）。", "unverified": "本文は入手できず、抄録が途中で切れていて探索的な成果指標の結果は確認できなかった。"}}, {"id": "jr46", "rank": 46, "headline": "粒子形状と粒状土のダイレイタンシー・臨界状態", "title": "Morphology-Dependent Dilatancy and Critical State of Granular Soils", "url": "https://doi.org/10.1139/cgj-2026-0633", "authors": "Qingyun Fang ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-20", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Fang, Q., Xiao, Y., Stuedlein, A. W., Evans, T. M., Wang, Y., Liu, S., Cui, H., & Liu, H. (2026). Morphology-Dependent Dilatancy and Critical State of Granular Soils. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0633", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "粒子の形状と、粒状土のダイレイタンシー（せん断による体積変化）・臨界状態の指標との定量的な関係を、三軸試験で調べた（抄録）。", "p3": "天然の砂1種、人工の砂2種、両者を半々に混ぜた砂2種の計5種で、初期の相対密度と圧密応力を変えた排水・非排水の三軸試験を行い、粒子形状を全体の規則性という指標で定量化した（抄録）。", "p5": "せん断応答と特徴点は粒子形状に大きく影響され、平均割線剛性・ダイレイタンシーの指標・Boltonの応力-ダイレイタンシー関係の切片・臨界状態線の傾きと切片が全体の規則性と強く関係した。Bolton関係の傾きは形状に依存しないとみなせた（抄録）。", "fun": "砂粒が丸いか角ばっているかで、砂地の強さや、押しつぶしたときに膨らむか縮むかが変わる。この研究は、5種類の砂で形の整い具合を数字にし、強さの指標とはっきり結びつけた。一方で、関係式の一部は形によらず同じだったという発見も面白い。", "unverified": "本文は入手できず、関係式の具体的な形と当てはまりの数値は確認できなかった。"}}, {"id": "jr47", "rank": 47, "headline": "鉱石の貯鉱山の形成と払い出しを大規模粒子モデルで再現", "title": "Realistic large-scale three-dimensional particle modelling of stockpile formation and reclaim with insights into ore mixing and segregation", "url": "https://doi.org/10.1016/j.mineng.2026.111068", "authors": "Ebrahim F. Salmi ほか", "venue": "Minerals Engineering", "date": "2026-11-18", "sjr": 1.019, "citescore": 9.6, "citescore_year": "2025", "apa": "Fathi Salmi, E., Cleary, P. W., Sinnott, M. D., & Sellers, E. J. (2027). Realistic large-scale three-dimensional particle modelling of stockpile formation and reclaim with insights into ore mixing and segregation. Minerals Engineering, 251, 111068. https://doi.org/10.1016/j.mineng.2026.111068", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "鉱石の円錐形の貯鉱山からの重力式の払い出しを、非常に大規模な個別要素法（DEM）で解析し、混合・偏析と排出の流れを調べた（抄録）。", "p3": "粘着性と摩擦を持つ材料の排出時の流れを、払い出しの配置を変えた複数の構成で、微視・巨視の両方の尺度でDEMにより解析した（抄録）。", "p5": "抄録は途中で切れており、具体的な結果と数値は確認できない。抄録の範囲では、ホッパーの設計の限界と材料の性質（含水・粒径・形状の分布）が混合・偏析と排出の不良を生む問題を扱っている（抄録）。", "fun": "鉱山では、掘った鉱石を大きな山に積み、下の穴から少しずつ取り出して運ぶ。ところが取り出し方によっては、細かい粒と粗い粒が分かれたり、一部が出てこなかったりする。この研究は、膨大な数の粒を一つずつ計算する大規模な模擬で、その流れ方を調べた。粒の流れは水と違い、詰まったり分かれたりする点が難しく面白い。", "unverified": "本文は入手できず、抄録が途中で切れているため、払い出しの構成ごとの結果と設計の提案は確認できなかった。"}}, {"id": "jr48", "rank": 48, "headline": "健康ウェアラブルの採用にリスクと便益が非対称に効く", "title": "Risk and benefit perceptions asymmetrically shape wearable health monitoring device adoption in India", "url": "https://doi.org/10.1038/s41598-026-79174-x", "authors": "Babasaheb Jadhav ほか", "venue": "Scientific Reports", "date": "2026-11-21", "sjr": 0.893, "citescore": 6.4, "citescore_year": "2025", "apa": "Jadhav, B., Misra, S., Adtani, R., & Mishra, A. (2026). Risk and benefit perceptions asymmetrically shape wearable health monitoring device adoption in India. Scientific Reports. https://doi.org/10.1038/s41598-026-79174-x", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、インドで健康を見守るウェアラブル機器の採用に、リスクの知覚と便益の知覚が非対称に影響することを示す研究。損と得の評価が採用に効く強さの違いが主題と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "新しい健康機器を使うかどうか決めるとき、便利そうと危なそうは同じ重さで効くとは限らない。題名から読み取れる問いは、損になりそうな点と得になりそうな点のどちらが採用をより強く左右するかだ。人は得より損に敏感だという心理学の知見ともつながる問いで面白い。", "unverified": "抄録・本文とも入手できず、調査の規模、手法、結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "デジタルな場づくりと公共空間の幸福感・包摂感", "title": "Digital Placemaking and Everyday Public Spaces: Effects on Subjective Well-Being, Perceived Inclusion and User Experience in Cairo", "url": "https://doi.org/10.1177/12063312261501672", "authors": "Israa Ghonem ほか", "venue": "Space and Culture", "date": "2026-11-21", "sjr": 0.503, "citescore": 3.9, "citescore_year": "2025", "apa": "Ghonem, I., Elshater, A., Afifi, S., & Ghalib, H. (2026). Digital Placemaking and Everyday Public Spaces: Effects on Subjective Well-Being, Perceived Inclusion and User Experience in Cairo. Space and Culture. https://doi.org/10.1177/12063312261501672", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "カイロの日常の公共空間で、デジタルな場づくり（プレイスメイキング）が主観的幸福感、包摂の知覚、利用体験に与える効果を混合研究法で調べた（抄録）。", "p3": "カイロのマディナティの4つの公園での構造化された観察と、住民196人のオンライン調査を組み合わせた（抄録）。", "p5": "デジタルな場づくりは社会的な交流の促進、参加の拡大、快適さの向上を通じて公共空間での主観的幸福感を高めうる一方、デジタル技術へのアクセスとリテラシーの差が、包摂的な設計がなければ世代と社会空間の不平等を強めるおそれがあると示した（抄録）。", "fun": "公園にデジタル技術を取り入れると、人の集まり方は変わるのか。この研究は、デジタルな工夫が交流や快適さを高める一方、技術に慣れない人を置き去りにしかねないことを示した。便利さが新しい分断を生むかもしれないという両面性が面白い。", "unverified": "本文は入手できず、観察と調査の具体的な指標と効果の大きさは確認できなかった。"}}, {"id": "jr50", "rank": 50, "headline": "気候中立・スマートシティの態度と実施の隔たり", "title": "Sustainability Attitudes and Perceived Implementation Conditions: Examining the Attitude–Implementation Gap in Climate-Neutral and Smart Cities in Greece", "url": "https://doi.org/10.3390/su182211801", "authors": "Vasileios Giannopoulos ほか", "venue": "Sustainability", "date": "2026-11-19", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "apa": "Giannopoulos, V., Koutsouroupas, D., Makris, I., Aggelopoulos, E., & Dimitropoulos, P. (2026). Sustainability Attitudes and Perceived Implementation Conditions: Examining the Attitude–Implementation Gap in Climate-Neutral and Smart Cities in Greece. Sustainability, 18(22), 11801. https://doi.org/10.3390/su182211801", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ギリシャの公立大学と職業訓練機関の関係者が、気候中立・スマートシティへの転換をどう捉えているかを、施策への支持と実施条件の知覚の関係に注目して調べた（抄録）。", "p3": "学生・教員・職員438人の便宜的標本のオンライン質問紙で、再エネ・交通・建物・水・廃棄物・参加・財政の支持と実施の知覚を比べ、重回帰と順序ロジスティック回帰で支持の相関要因を調べた（抄録）。", "p5": "回答者は気候中立の施策を強く支持したが、自治体のインフラ・行動・財政支援の評価はずっと低く、財政の責任を自分たちでなく主に公共部門に帰した（抄録）。", "fun": "環境に優しい街づくりには賛成でも、そのお金を誰が払うかとなると話は別だ。この調査では、大学や職業学校の人々がスマートシティの施策を強く支持する一方、自分の街の実行力には厳しい評価をし、費用はもっぱら行政が持つべきだと考えていた。賛成と実行のあいだの溝を数字で示した点が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて支持の相関要因の結果は確認できなかった。便宜的標本のため一般化には限界がある。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "計算社会科学・ネットワーク科学", "headline": "知識の空白を開く論文は遅れて大きな影響を持つ", "title": "Knowledge gaps and scientific progress", "url": "https://doi.org/10.1073/pnas.2527345123", "authors": "Kara Kedrick ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Kedrick, K., Yang, W., Gebhart, T., Wang, Y., & Funk, R. J. (2026). Knowledge gaps and scientific progress. Proceedings of the National Academy of Sciences, 123(47). https://doi.org/10.1073/pnas.2527345123", "why": "科学の概念のネットワークで、新しいつながりが閉路を完成させて生まれる「知識の空白」を計算トポロジーで大規模に特定する方法を作り、Microsoft Academic Graphの約3,436万本に適用する。空白を開く論文は新しい概念の組み合わせだけの論文より長期の引用と破壊性が大きく、5年以内の引用は少ないが20年では多い。結果は5つの別のデータベースでも再現した。"}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "戦争でウクライナとロシアの起業はどう減ったか", "title": "War and Entrepreneurship: A Synthetic Control Study of the Russia-Ukraine Conflict", "url": "https://doi.org/10.1177/10422587261500357", "authors": "David B. Audretsch ほか", "venue": "Entrepreneurship Theory and Practice", "date": "2026-11-21", "sjr": 5.67, "citescore": 21.9, "citescore_year": "2025", "apa": "Audretsch, D. B., Momtaz, P. P., Motuzenko, H., & Vismara, S. (2026). War and Entrepreneurship: A Synthetic Control Study of the Russia-Ukraine Conflict. Entrepreneurship Theory and Practice. https://doi.org/10.1177/10422587261500357", "why": "2009〜2019年のロシア・ウクライナの起業の動きを合成コントロール法で分析し、ウクライナの登録有限会社は2016年の最大時に反実仮想より約13%（約7万4千社）少なく2019年にかけて戻った一方、ロシアの不足は遅れて現れて累積し、反実仮想に対し約156万社（32%）少ないことを示す。ウクライナでは女性の自営業の落ち込みが男性より大きかった。"}, {"id": "jn03", "rank": 3, "field": "機械学習", "headline": "研究数学でのAIの能力は道具立ての設計で変わる", "title": "Harness design matters for AI capabilities in mathematics", "url": "https://doi.org/10.1073/pnas.2627448123", "authors": "Mohammed Abouzaid ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Abouzaid, M., Srivastava, N., Ward, R., & Williams, L. (2026). Harness design matters for AI capabilities in mathematics. Proceedings of the National Academy of Sciences, 123(47). https://doi.org/10.1073/pnas.2627448123", "why": "研究の過程で実際に生じた幅広い分野の数学の10問を4つのAIシステムに解かせ、方法、人の査読者による評価、費用を報告する。AIの解答と人の解答、査読報告と記録も公開しており、研究水準の数学でのAIの能力を測る試みとなっている。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "AIの推奨の下で判断を保つリーダーの認知的両利き", "title": "Cognitive Ambidexterity: Balancing Algorithmic Efficiency and Contextual Judgement in AI-Enabled Decision Systems", "url": "https://doi.org/10.1177/01492063261501111", "authors": "Tahir Abbas Syed", "venue": "Journal of Management", "date": "2026-11-21", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Syed, T. A. (2026). Cognitive Ambidexterity: Balancing Algorithmic Efficiency and Contextual Judgement in AI-Enabled Decision Systems. Journal of Management. https://doi.org/10.1177/01492063261501111", "why": "AIを使う意思決定でアルゴリズムの推奨が文脈や倫理の検討の前に客観的で実行可能に見える状況で、リーダーが判断を保つ能力を「認知的両利き」として概念化する。英国の調達・インフラの5組織の調査で4つの仕組みを見いだし、管理職のビネット実験で確かめた。AIの出力を解釈の手がかりとして扱い、曖昧なときは信頼を調整し、熟慮が必要なら決定を遅らせることなどが判断を保つ。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "求人での在宅勤務の明示は採用を助けるが離職も増える", "title": "Disclosing work-from-home flexibility to compete for talent? Evidence from job postings", "url": "https://doi.org/10.1007/s11142-026-10001-4", "authors": "Charles Ham ほか", "venue": "Review of Accounting Studies", "date": "2026-11-21", "sjr": 5.56, "citescore": 10.7, "citescore_year": "2025", "apa": "Ham, C., Hann, R. N., Wang, W., & Yang, J. (2026). Disclosing work-from-home flexibility to compete for talent? Evidence from job postings. Review of Accounting Studies. https://doi.org/10.1007/s11142-026-10001-4", "why": "2017〜2024年の米国の求人広告で、労働市場の競争が激しいほど雇用主が在宅勤務の柔軟性を明示し、明示が欠員の充足率の高さと関連すること、目立つ形での明示ほどその関連が強いことを示す。一方、明示はその後の従業員の離職の増加とも関連した。"}, {"id": "jn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "年齢の多様な職場を率いる研修の効果を準実験で検証", "title": "Leading an age-diverse workforce: evaluation of a leadership training intervention based on the Include, Individualize, and Integrate framework", "url": "https://doi.org/10.1007/s10869-026-10166-4", "authors": "Eva Zellman ほか", "venue": "Journal of Business and Psychology", "date": "2026-11-21", "sjr": 2.563, "citescore": 10.6, "citescore_year": "2025", "apa": "Zellman, E., Andrei, D. M., Zoszak, L., Jungmann, F., & Parker, S. K. (2026). Leading an age-diverse workforce: evaluation of a leadership training intervention based on the Include, Individualize, and Integrate framework. Journal of Business and Psychology. https://doi.org/10.1007/s10869-026-10166-4", "why": "年齢の包摂・個別化・統合の3つの戦略（3iの枠組み）に基づくリーダー研修を豪州の地方自治体で実施し、比較群つきの事前事後の準実験（介入35人・対照19人）で評価した。研修への反応と認知的な学習は明確で、年齢の否定的なステレオタイプの減少など態度と行動の学習は一部にみられた。"}, {"id": "jn07", "rank": 7, "field": "計算社会科学・ネットワーク科学", "headline": "相互情報量を多重スケールの分離指数として導く", "title": "From first principles to multi-scale decomposition: mutual information as a segregation index", "url": "https://doi.org/10.1140/epjds/s13688-026-00716-4", "authors": "Rohit Sahasrabuddhe ほか", "venue": "EPJ Data Science", "date": "2026-11-20", "citescore": 5.3, "citescore_year": "2025", "apa": "Sahasrabuddhe, R., & Lambiotte, R. (2026). From first principles to multi-scale decomposition: mutual information as a segregation index. EPJ Data Science. https://doi.org/10.1140/epjds/s13688-026-00716-4", "why": "分離（セグリゲーション）の指数を作る一般的な方法から相互情報量を導き、人口集団と空間単位を粗くまとめたときの振る舞いなど、他の指数にない数学的性質を解釈する。相互情報量は地域と上位集団の寄与に分解でき、イングランドとウェールズの民族の居住分離の事例で示し、多重スケールの分析のソフトウェアも公開した。"}, {"id": "jn08", "rank": 8, "field": "工学", "headline": "物理則入りのPatchTSTで少データの余寿命を予測", "title": "Physics-informed time series transformers for uncertainty-aware remaining useful life estimation under data scarcity", "url": "https://doi.org/10.1177/14759217261500449", "authors": "Jokin Cuesta ほか", "venue": "Structural Health Monitoring", "date": "2026-11-21", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Cuesta, J., Leturiondo, U., Vidal, Y., & Pozo, F. (2026). Physics-informed time series transformers for uncertainty-aware remaining useful life estimation under data scarcity. Structural Health Monitoring. https://doi.org/10.1177/14759217261500449", "why": "実際の故障までのデータが少ない状況での余寿命予測で、時変の摩耗係数をArchardの式に入れる形と、Archard式に基づく軌跡の残差を学ぶ形の2つの物理情報つきPatchTSTを提案し、6つの加速劣化試験で検証した。MCドロップアウトなど3つの不確かさの評価法を比べ、12時間・24時間先の余寿命の平均誤差を報告する。"}, {"id": "jn09", "rank": 9, "field": "工学", "headline": "翼そのものを感覚器にした羽ばたき型微小ロボット", "title": "Neuromorphic self-aware wings for embodied-intelligent bionic flying microrobotics", "url": "https://doi.org/10.1126/sciadv.aei7313", "authors": "Hao Zheng ほか", "venue": "Science Advances", "date": "2026-11-20", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Zheng, H., Zeng, X., Tan, Y., He, C., Tu, C., Deng, H., Song, Y., Wang, Y., Kim, B., Lin, Y., & Zhang, X. (2026). Neuromorphic self-aware wings for embodied-intelligent bionic flying microrobotics. Science Advances, 12(47). https://doi.org/10.1126/sciadv.aei7313", "why": "昆虫の翼の機械受容器に倣い、羽ばたき翼の表面に感覚素子を直接形成して翼自体を感覚器にし、翼の局所の動きを分離する界面電荷場の写像モデルで3次元の変形を動的に再構成する。物理に基づく運動特徴と機械学習を組み合わせて、リアルタイムの故障診断と空力の損失の閉ループ補償を実現した。"}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "格付けの引き下げはCDSスプレッドを押し上げる", "title": "The Real Effects of Credit Ratings on Credit Default Swap Market: The Sovereign Ceiling Channel", "url": "https://doi.org/10.1111/eufm.70109", "authors": "Hao‐Wen Chang ほか", "venue": "European Financial Management", "date": "2026-11-21", "sjr": 1.188, "citescore": 6.8, "citescore_year": "2025", "apa": "Chang, H.-W., Chiu, J., Chung, H., & Lin, C.-Y. (2026). The Real Effects of Credit Ratings on Credit Default Swap Market: The Sovereign Ceiling Channel. European Financial Management. https://doi.org/10.1111/eufm.70109", "why": "国の格付けの上限（ソブリン・シーリング）による企業の格下げを外生的なショックとして差の差を推定し、処置企業のCDSスプレッドが対照企業より25.96%多く上昇することを示す。効果は収益性・研究開発・無形資産が低く負債の多い企業で強く、格下げに基づくポートフォリオは超過収益を生み、格下げが非公開の情報を伝えることを示唆する。"}, {"id": "jn11", "rank": 11, "field": "計算社会科学・ネットワーク科学", "headline": "共同発明の過去のつながりの位相と発明者の成果", "title": "Historical higher-order collaboration topology and inventor-level patent outcomes", "url": "https://doi.org/10.1140/epjds/s13688-026-00718-2", "authors": "Jianming Guo ほか", "venue": "EPJ Data Science", "date": "2026-11-20", "citescore": 5.3, "citescore_year": "2025", "apa": "Guo, J., Yang, A. J., Zhao, Y., Wang, H., & Deng, S. (2026). Historical higher-order collaboration topology and inventor-level patent outcomes. EPJ Data Science. https://doi.org/10.1140/epjds/s13688-026-00718-2", "why": "米国の特許データの8万2,926人・77万4,371発明者年で、現在の共同発明者の過去の共同出願から事象に基づく単体複体を作り、0次と1次のベッチ数を発明者の成果と関連づける。連結成分の数は破壊的な被引用と逆U字の関連を示し、埋まっていない閉路の存在は累積の破壊的被引用のわずかな増加と関連した。"}, {"id": "jn12", "rank": 12, "field": "地震工学・防災", "headline": "地震が粘土の難透水層の透水性を一時的に高めた", "title": "Seismically Induced Enhancement of Aquitard Permeability Revealed by Groundwater Responses to Lake Seiches", "url": "https://doi.org/10.1029/2026jb035286", "authors": "E. Shalev ほか", "venue": "Journal of Geophysical Research: Solid Earth", "date": "2026-11-21", "sjr": 1.803, "citescore": 7.5, "citescore_year": "2025", "apa": "Shalev, E., Barbour, A. J., Hung, R.-J., Lyakhovsky, V., Lutzky, H., Dvorkin, Y., Haim, N., Stein, S., Amitai, Y., Tal, A., Asheri‐Arnon, T., Hurwitz, S., & Manga, M. (2026). Seismically Induced Enhancement of Aquitard Permeability Revealed by Groundwater Responses to Lake Seiches. Journal of Geophysical Research: Solid Earth, 131(11). https://doi.org/10.1029/2026jb035286", "why": "ガリラヤ湖の静振（セイシュ）に対する地下水位の応答の相互スペクトル解析で、約3か月の19回の地震による難透水層の水理的な変化を追い、2024年8月のシリア・ハマのMw 5.2の地震で湖底の観測孔に地震時の鉛直透水性の急増で説明できる変化が起き、数週間かけて基準へ戻ったことを示す。"}, {"id": "jn13", "rank": 13, "field": "社会学", "headline": "就学前の社会化は教師の余力と仲間文化が共に担う", "title": "“Sit Nice!”: Peer Culture, Teacher Capacity, and Joint Socialization Efforts in Preschool", "url": "https://doi.org/10.1177/00031224261498245", "authors": "Casey Stockstill", "venue": "American Sociological Review", "date": "2026-11-21", "sjr": 3.277, "citescore": 9.0, "citescore_year": "2025", "apa": "Stockstill, C. (2026). “Sit Nice!”: Peer Culture, Teacher Capacity, and Joint Socialization Efforts in Preschool. American Sociological Review. https://doi.org/10.1177/00031224261498245", "why": "人種と階層で分かれた2つの就学前施設の2年間のエスノグラフィーで、教師がその場で指導できる余力と、仲間が教師の指示を支える文化の両方が子どもの社会化を左右することを示す。豊かな施設では教師の余力と仲間の支えがあったが、低所得の施設では時間に追われる教師に指導の権威が集中しており、分離された施設は将来の不平等を和らげにくいと論じる。"}, {"id": "jn14", "rank": 14, "field": "心理学・認知科学", "headline": "予想外の出来事が作業記憶の選択をリセットする", "title": "Surprise Resets the Mind: An Adaptive Online Reset in Working Memory Selection", "url": "https://doi.org/10.1177/09567976261495567", "authors": "Jiahan Yu ほか", "venue": "Psychological Science", "date": "2026-11-20", "sjr": 2.309, "citescore": 9.9, "citescore_year": "2025", "why": "注意して使ったが通常は報告しない特徴を突然問われると答えられない「属性健忘」の課題で、驚きの試行に予想の違反を入れるとその特徴の報告が改善することを6つの実験（計250人）で示す。違反が標的以外の文脈や聴覚の変化でも効果があり、予想の違反が作業記憶への選択を素早く調整することを示唆する。"}, {"id": "jn15", "rank": 15, "field": "地球科学", "headline": "風成砂丘は砂が動き出す限界ぎりぎりの風で生まれる", "title": "Windblown dunes are born in sand at the brink of transport", "url": "https://doi.org/10.1073/pnas.2613085123", "authors": "M. Colin Marvin ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "風成砂丘が、砂粒の跳躍（サルテーション）の開始をわずかに上回る風による「限界近傍の輸送状態」にあることを地球全体で示し、河床が流路の形の調整でその状態に至るのに対し、砂丘は風速が上がるほど頻度が急減するため最初からその状態で生まれることを示す。砂丘の粒径から形成時の風速を推定できることになる。"}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "校長の破壊的リーダーシップは協働の風土を通じて効く", "title": "Eroding the collaborative spirit in disadvantaged schools: Tracing the invisible effects of school principals’ destructive leadership on teacher performance", "url": "https://doi.org/10.1177/17411432261510218", "authors": "Muammer Maral", "venue": "Educational Management Administration and Leadership", "date": "2026-11-21", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "why": "トルコの社会経済的に最も開発の遅れた地域の教員220人の調査で、校長の破壊的リーダーシップは教員の成果に直接は影響せず、学校の協働的な風土を通じた間接効果を持つことを構造方程式モデルで示す。組織の健全性を通じた経路は有意でなかった。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "校長の破壊的リーダーシップが教員の成果に与える影響を、学校の協働的な風土と組織の健全性を通じた経路で検証した（抄録）。", "p3": "資源保存理論と社会的交換理論に基づき、トルコの社会経済的に最も開発の遅れた地域の教員220人の調査データを確認的因子分析と構造方程式モデルで分析した（抄録）。", "p5": "破壊的リーダーシップは教員の成果に直接は影響せず、協働的な風土を通じた有意な間接効果を持った。組織の健全性を通じた間接経路は有意でなかった（抄録）。", "fun": "上司が理不尽だと、部下の仕事ぶりは直接落ちるのか。この研究では、校長の破壊的な振る舞いは先生一人一人の成果を直接は下げなかったが、先生どうしが協力し合う雰囲気を壊すことで、間接的に成果を下げていた。悪いリーダーの害が、目に見えにくいチームの空気を通じて広がる点が面白い。", "unverified": "本文は入手できず、効果の大きさと、横断データでの因果の解釈の限界についての著者の議論は確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "逮捕は家庭内暴力を抑止するか報復を招くか", "title": "Deterrence or Backlash? Arrests and the Dynamics of Domestic Violence", "url": "https://doi.org/10.1086/745091", "authors": "Sofia Amaral ほか", "venue": "Journal of Political Economy", "date": "2026-11-20", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "why": "題名によれば、逮捕が家庭内暴力の動学に与える影響を、抑止と反発（報復）の観点から分析する（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarで題名から見つけた抄録（途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "家庭内暴力（DV）での逮捕が将来の暴力を抑止するのか報復を招くのかを、英国ウェストミッドランズの行政データで調べた（抄録）。", "p3": "12万4千件を超えるDVの緊急通報（999番）のデータで、受付担当による条件付きの無作為な警官の割り当てと、警官ごとの逮捕の傾向の違いを利用して逮捕の効果を識別した（抄録）。", "p5": "逮捕はその後1年間のDVの通報を51%減らし、それは報復を恐れた通報の減少ではなく再被害の減少によるとした。逮捕は通報後48時間の再被害の急増をほぼなくし、長期でも大きな抑止効果があり、加害者が起訴される確率を高めた（抄録）。", "fun": "家庭内暴力で加害者を逮捕すると、被害者は守られるのか、それとも逆恨みで状況が悪化するのか。この研究は、どの警官が現場に行くかがほぼ偶然で決まり、警官によって逮捕しやすさが違うことを利用して、この問いに答えた。逮捕は翌年の通報を51%減らし、特に通報直後の48時間の危険をほぼ消した。頭を冷やす時間を作る効果という解釈が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて政策的な結論の部分は確認できなかった。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "生涯を通じた資産の移動性の動学", "title": "The life-cycle dynamics of wealth mobility", "url": "https://doi.org/10.1016/j.jpubeco.2026.105828", "authors": "Richard Audoly ほか", "venue": "Journal of Public Economics", "date": "2026-11-20", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "why": "題名によれば、資産の階層間の移動性がライフサイクルを通じてどう変化するかの動学を分析する（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ノルウェーの25年分の税務記録で、生涯を通じた資産の階層間の移動性を調べた（抄録）。", "p3": "資産の順位の履歴が似た人を、統計的学習の道具である凝集型の階層的クラスタリングでまとめ、移動のパターンを取り出した（抄録）。", "p5": "生涯を通じた資産の移動性はかなり大きいが分断されており、60%を超える人は生涯を通じて上位か下位にとどまり、移動は残る40%が中間の中で動くことで生じた。親の資産が持続的に豊か・貧しい人を最もよく予測し、人的資本が中間で上下する人を予測した（抄録）。", "fun": "お金持ちと貧しい人の入れ替わりは、どれくらい起きるのか。ノルウェーの国民の25年分の税の記録を調べると、60%を超える人は一生を通じて上か下に固定され、入れ替わりは真ん中の40%の中だけで起きていた。上と下を決めるのは親の資産、真ん中での上下を決めるのは本人の人的資本だったという二層の構造が面白い。", "unverified": "本文は入手できず、クラスタの数と各群の特徴の詳細は確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "内部の合成代理変数で代理SVARの強外生性を検定", "title": "Testing strong exogeneity in proxy SVARs with internal synthetic proxies", "url": "https://doi.org/10.1016/j.jeconom.2026.106354", "authors": "Sascha A. Keweloh ほか", "venue": "Journal of Econometrics", "date": "2026-11-20", "sjr": 6.575, "citescore": 7.3, "citescore_year": "2025", "why": "題名によれば、外部の代理変数で識別する構造VAR（proxy SVAR）で、内部で作る合成の代理変数を用いて強外生性を検定する方法を示す（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "外部の代理変数で識別する構造VAR（proxy SVAR）で、代理変数の強い外生性を、内部で合成した代理変数を使って検定する方法を示した（抄録）。", "p3": "外部の代理変数で縮約形の誤差の中の目標ショックの方向を特定し、候補のショックを追加の内部合成代理変数として作って、元の代理変数との同時の外生性を検定する。識別の強さが目標ショックの非ガウス性で決まることを示し、弱識別に頑健な版も作った（抄録）。", "p5": "モンテカルロ実験で、代理変数の信号対雑音比が低いときに検定の検出力が良好なことを示した。金融政策と石油供給のニュースのショックへの適用では、基準の代理変数の外生性に反する証拠は見られなかった（抄録）。", "fun": "経済のショックの効果を測るとき、研究者はそのショックだけを反映する代わりの指標（代理変数）を使う。しかし代理変数が本当に他の影響を受けていないかは、ふつう確かめようがない。この研究は、データの中から二つ目の代理変数を合成して、両者が整合するかで確かめる方法を作った。確かめられないと思われていた前提を検定可能にした点が面白い。", "unverified": "本文は入手できず、検定の具体的な構成と、適用例の推定結果の数値は確認できなかった。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "AI時代の組織の目標階層を動学的な行動の視点で捉える", "title": "Organizational Goal Hierarchies in the Age of Artificial Intelligence: A Dynamic Behavioral Perspective", "url": "https://doi.org/10.5465/amr.2024.0336", "authors": "David Diwei Lv ほか", "venue": "Academy of Management Review", "date": "2026-11-20", "sjr": 9.996, "citescore": 19.5, "citescore_year": "2025", "why": "題名によれば、人工知能の時代の組織の目標の階層を、動学的な行動論の視点から理論化する（抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、人工知能の時代の組織の目標の階層（上位の目標と下位の目標の関係）がAIの導入によってどう動くかを、動学的な行動論の視点から理論化する研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "会社には利益を出すという大きな目標の下に、部署や個人の小さな目標が積み重なっている。題名から読み取れる問いは、AIが仕事を担うようになると、この目標の積み重なりがどう変わるかだ。AIにどの目標を任せ、人がどの目標を持つかという組織の設計の問いともつながる（解釈）。", "unverified": "抄録・本文とも入手できず、理論の主張と命題はすべて未確認。"}}, {"id": "jn21", "rank": 21, "field": "因果推論", "headline": "干渉のある合成コントロールを頑健回帰で推定", "title": "A robust regression approach to synthetic control with interference", "url": "https://doi.org/10.1080/01621459.2026.2761034", "authors": "Peiyu He ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、単位間の干渉（波及）がある場合の合成コントロール法に、頑健回帰による推定の方法を提案する（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "合成コントロール法で、比較に使う単位（ドナー）が処置の波及（干渉）を受けている場合にも妥当な推定と推論ができる枠組みを示した（抄録）。", "p3": "観測されない交絡を因子モデルで調整したあと、直接効果と干渉効果を疎な外れ値の成分として扱う頑健回帰を行う2段階の方法で、単位数が固定の場合と発散する場合の漸近理論を示した（抄録）。", "p5": "単位数が固定で少なくとも半分が干渉を受けないとき、高崩壊点の頑健回帰で有効な対照を一致的に特定でき、漸近正規な推論ができる。模擬と2つの実証例で評価し、米国大使館のエルサレム移転の分析で有意な干渉効果を見いだした（抄録）。", "fun": "ある国の政策の効果を、似た国々を組み合わせた合成の国と比べて測る方法がある。ところが、比べる相手の国も政策の影響を受けていたら比較が狂ってしまう。この研究は、影響を受けた相手を外れ値として自動的に見つけ出し、効果と波及の両方を測れるようにした。比較相手の汚れを前提にした発想の転換が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて2つ目の実証例と結果の数値は確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "因果推論", "headline": "再発事象の介入別の期待回数を連続時間TMLEで推定", "title": "Nonparametric efficient causal estimation of the intervention-specific expected number of recurrent events with continuous-time targeted maximum likelihood and highly adaptive lasso estimation", "url": "https://doi.org/10.1080/01621459.2026.2758421", "authors": "Helene C. W. Rytgaard ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、介入ごとの再発事象の期待回数を、連続時間の標的最尤推定（TMLE）と高度適応的ラッソで、ノンパラメトリックかつ効率的に推定する方法を示す（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "連続時間で結果・競合リスク・打ち切りが起きて繰り返す縦断データで、介入ごとの再発事象の期待回数を因果的な目標として定め、効率的に推定する方法を示した（抄録）。", "p3": "観測データの分布を表す積分積に直接介入してg計算式で目標パラメータを定義し、標的最尤推定（TMLE）と高度適応的ラッソを組み合わせた二重頑健でノンパラメトリックな推論を提案した（抄録）。", "p5": "打ち切りや開始後の処置の決定が過去の共変量（再発の過程を含む）に依存する場合にも再発事象の期待回数を識別できることを示し、模擬研究で方法を例示した（抄録）。", "fun": "同じ出来事が何度も起きるデータでは、途中で方針を変えたり追跡が途切れたりして、単純な平均では効果を測れない。この研究は、もしこの方針を続けていたら出来事は平均何回起きたかを、時間の流れを細かく追いながら推定する方法を作った。繰り返しと途中の変化を両方扱う点が難しく面白い。", "unverified": "本文は入手できず、模擬研究の設定と性能の数値は確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "因果推論", "headline": "適格基準に欠測がある電子カルテ研究の頑健な因果推論", "title": "Robust Causal Inference for EHR-based Studies of Point Exposures with Missingness in Eligibility Criteria", "url": "https://doi.org/10.1080/01621459.2026.2760596", "authors": "Luke Benz ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、電子カルテに基づく時点曝露の研究で、適格基準の判定に必要な情報に欠測がある場合の頑健な因果推論の方法を示す（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "電子カルテ（EHR）に基づく研究で、適格基準を決める変数に欠測がある場合に、処置群の平均処置効果を頑健かつ効率的に推定する方法を示した（抄録）。", "p3": "適格基準を決める共変量がランダムに欠測する（MAR）という仮定のもとで、局外関数に柔軟な機械学習を使いながら漸近的に妥当な推論ができる推定量を提案した（抄録）。", "p5": "カイザー・パーマネンテの肥満外科手術を受けた患者14,809人のデータに適用し、2つの術式の長期の体重と血糖の結果を比べた。結果の数値は抄録が途中で切れていて読めない（抄録）。", "fun": "電子カルテを使った研究では、研究の対象になる条件を満たすか判断するための情報が欠けている人がよくいる。そうした人を黙って除くと結果が偏るおそれがある。この研究は、条件の情報が欠けた人も適切に扱って効果を推定する方法を作った。分析の入口で誰を数えるかによって結論が変わりうる点が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて適用例の結果は確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "因果推論", "headline": "競合リスクのある生存データで最適な個別化処置方針", "title": "Optimal individualized treatment regimes for survival data with competing risks", "url": "https://doi.org/10.1080/01621459.2026.2764375", "authors": "Christina W. Zhou ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、競合リスクのある生存時間データで最適な個別化処置方針を推定する方法を示す（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "競合リスクのある生存時間データで、全体の生存と主な事象の累積発生の両方を考慮した、ノンパラメトリックな個別化処置方針の推定量を示した（抄録）。", "p3": "2段階の方法で全事象からの生存と主な事象の累積発生を考慮し、両方の結果を組み込む多効用の価値関数を導入して、ランダム生存フォレストとランダム累積発生フォレストで個人ごとの曲線を作った（抄録）。", "p5": "模擬研究で提案法の良好な性能を示し、下肢切断と死亡のリスクの高い末梢動脈疾患の患者のコホートに適用した（抄録）。", "fun": "一人一人に最適な方針を選ぶとき、長く生きられるかと、特定の悪い出来事を避けられるかは別の物差しになりうる。しかも一方が起きると他方は観察できなくなる。この研究は、二つの物差しを一つの価値の式にまとめて、人ごとの最適な方針を選ぶ方法を作った。複数の目標を同時に考える選び方の難しさが面白い。", "unverified": "本文は入手できず、模擬研究の数値と、適用例で推奨された方針の内容は確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "統計学", "headline": "多次元の関数データの主成分分析をオンラインで学習", "title": "Online Learning of Functional Principal Component Analysis for Multidimensional Functional Data", "url": "https://doi.org/10.1080/01621459.2026.2760593", "authors": "Muye Nanshan ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、多次元の関数データについて、データが順に届く状況で関数主成分分析をオンラインで学習する方法を示す（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "次々に届く多次元の関数データについて、関数主成分分析（FPCA）をオンラインで効率よく学習する枠組みを示した（抄録）。", "p3": "関数主成分をテンソル積スプラインで表し、シュティーフェル多様体上の罰則つきの枠組みで滑らかさと正規直交性を課し、反復平均を使うリーマン確率的勾配法とAdaGrad版を作った。データの流れに合わせた平滑化パラメータの動的な選び方も示した（抄録）。", "p5": "推定量の漸近正規性を導いて点ごとの信頼区間を作り、大規模な模擬と実データへの適用で柔軟性と有効性を示した（抄録）。", "fun": "時間とともに次々に届く、曲線や曲面のようなデータから、主な変動のパターンを取り出したい。全部ためてから計算すると重すぎるので、この研究は届くたびに少しずつ学び直す方法を作った。形が滑らかで互いに直交するという条件を守りながら、流れの中で学ぶ点が面白い。", "unverified": "本文は入手できず、実データの内容と計算の速さの比較は確認できなかった。"}}, {"id": "jn26", "rank": 26, "field": "統計学", "headline": "分類の効率と公平をネイマン・ピアソンと機会均等で", "title": "Neyman-Pearson and equal opportunity: when economic efficiency meets societal fairness in classification", "url": "https://doi.org/10.1080/01621459.2026.2763830", "authors": "Jianqing Fan ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、分類問題でネイマン・ピアソン型の誤り制御と機会均等の公平性を組み合わせ、経済的な効率と社会的な公平を同時に扱う（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "分類で、第一種の誤りを制御するネイマン・ピアソン（NP）の枠組みに機会均等（EO）の公平性の制約を組み込み、経済的な効率と社会的な公平を同時に扱った（抄録）。", "p3": "NP-EOの枠組みでオラクル分類器を導き、母集団の水準の公平性と効率の制約を高い確率で満たす有限標本の分類器を提案した（抄録）。", "p5": "模擬データと実データで、提案するアルゴリズムの統計的・社会的な有効性を示した。具体的な数値は抄録にない（抄録）。", "fun": "審査や選考をアルゴリズムで決めるとき、組織としては重大な誤りの損失を抑えたいし、社会としては属性によって不公平にならないようにしたい。この研究は、重大な誤りの確率を一定以下に保つ条件と機会の平等の条件を同時に満たす分類の方法を作った。効率と公平を両立させる数学的な枠組みが面白い。", "unverified": "本文は入手できず、実データの内容と、効率と公平の間の得失の大きさは確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "統計学", "headline": "多層ネットワークの重なるクラスタをベイズ深層生成で", "title": "Bayesian Deep Generative Models for Multiplex Networks with Multiscale Overlapping Clusters", "url": "https://doi.org/10.1080/01621459.2026.2762546", "authors": "Yuren Zhou ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-20", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によれば、多層（マルチプレックス）ネットワークの、多重スケールで重なり合うクラスタをベイズの深層生成モデルで推定する（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "同じノードの集合で観測された複数のネットワーク（多層ネットワーク）から、集団の水準のノードの階層構造を推定し、個々の標本を多重解像度でクラスタリングするベイズ階層モデルを示した（抄録）。", "p3": "同定可能性と事後一致性の理論的な裏付けを与え、効率的な事後計算の方法を設計した。モデルの同定可能性を証明する新しい技術的な道具も示した（抄録）。", "p5": "数値模擬と脳の結合（コネクトーム）データへの適用で方法を示した（抄録）。", "fun": "同じ人たちの間の関係でも、友人関係、仕事の関係など、いくつもの「つながりの層」がある。この研究は、そうした複数の層をまとめて見て、大きなグループの中に小さなグループが重なり合う構造を取り出す統計モデルを作った。その構造がデータから一つに決まる（同定できる）ことを証明した点が理論的に面白い。", "unverified": "本文は入手できず、脳データへの適用の具体的な結果は確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "統計学", "headline": "区間打ち切りデータで時変ハザード比の同時信頼帯", "title": "Simultaneous Confidence Bands for Time-Varying Hazard Ratios with Interval-Censored Data", "url": "https://doi.org/10.1080/01621459. "preprint": false, "short": true, "p1": "竜巻の被害を受けやすい移動式・工場製住宅の住民が地域のセーフルーム（避難用の安全室）を使う際の障壁を、二値のオペラント需要の枠組みで特定し、その抑止の大きさを定量化した（抄録）。", "p3": "3部構成の研究で、研究1（N=150）では竜巻の多い州の住民が要因を順位づけし、研究2（N=158）では上位の障壁の効果を二値の意思決定課題とロジスティックモデルで調べ、研究3（N=165）では天候の条件を明示した（抄録）。", "p5": "上位に挙げられた障壁は避難の見込みを有意に下げ、研究3は枠組みの信頼性と構成概念妥当性を支持した。結果はFEMAの立地の指針を支持し、利用しやすい設計と明確な伝達の必要を示した（抄録）。", "fun": "竜巻のとき、頑丈な避難部屋が近くにあっても、人はなかなか避難しない。この研究は、移動式住宅に住む人たちにどんな理由があると行かないかを挙げてもらい、その理由があるとき避難する見込みがどれだけ下がるかを数字で測った。値段が上がると買わなくなる様子を測る行動経済学の方法を避難に応用した点が面白い。", "unverified": "本文は入手できず、障壁の具体的な内容と、効果の大きさの数値は確認できなかった。"}}, {"id": "jn43", "rank": 43, "field": "地震工学・防災", "headline": "日本とフィリピンの中高生の洪水への備えと対応の経路", "title": "Pathways of Flood Preparedness and Response Among Secondary School Students: A Comparative Study of Japan and the Philippines", "url": "https://doi.org/10.1016/j.ijdrr.2026.106590", "authors": "Hikari V. Yamamoto-Fukuda ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-21", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "why": "題名によれば、日本とフィリピンの中等教育の生徒の洪水への備えと対応の経路を比較する（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "防災教育が洪水への備えに影響する仕組みを、学び・認知・行動をつなぐ経路として、日本とフィリピンの中等教育の生徒で調べた（抄録）。", "p3": "両国の4つの中等学校の生徒1,251人の質問紙調査のデータを構造方程式モデル（SEM）で分析した（抄録）。", "p5": "自己効力感が準備と行動の反応に強い直接効果を持ち、知識とリスク認知の影響を媒介した。学習への態度は知識の習得に強く影響し、知識はリスク認知に影響した。全体の構造は両国で共通だったが、違いもみられた（抄録）。", "fun": "洪水の知識をたくさん学べば、いざというとき行動できるとは限らない。日本とフィリピンの中高生1,251人を調べたこの研究では、自分ならできるという自信（自己効力感）が、知識や危機感を行動につなぐ要の役割を果たしていた。知識を詰め込むより、できるという感覚を育てることが大事かもしれないという示唆が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて両国の違いの具体的な内容は確認できなかった。"}}, {"id": "jn44", "rank": 44, "field": "地震工学・防災", "headline": "人為的温暖化が2023年7月の華北豪雨を強めた", "title": "Anthropogenic warming intensified the July 2023 North China extreme rainfall event: Roles of moisture transport and convective organization", "url": "https://doi.org/10.1088/1748-9326/aec4f5", "authors": "Yuting He ほか", "venue": "Environmental Research Letters", "date": "2026-11-20", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "why": "2023年7月下旬の華北の記録的な豪雨を、実際の事象の再現計算と人為的な影響のない反実仮想のシナリオで比べ、人為的な温暖化が総降水量を7.6%増やし、400 mmを超える極端な降水のリスクを9.6%高めたと見積もる。温暖化は南シナ海などからの水蒸気輸送を強めた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "2023年7月下旬の華北の記録的な豪雨に人為的な温暖化がどれだけ寄与したかを、再現計算と反実仮想のシナリオの比較で見積もった（抄録）。", "p3": "実際の事象を再現する計算（ハインドキャスト）と、人為的な影響のない気候を表す反実仮想のシナリオを比べた（抄録）。", "p5": "人為的な温暖化は総降水量を7.6%増やし、400 mmの閾値の極端な降水のリスクを9.6%高めた。温暖化は南シナ海と華中からの水蒸気輸送を強め、少数だが大きな対流の塊からなる組織化した対流系の発達を促した（抄録）。", "fun": "ある大雨が地球温暖化のせいかどうかは、一回の出来事だけでは言えないように思える。この研究は、コンピュータの中に温暖化がなかった地球を作って同じ大雨を再現し、本物と比べることで、温暖化が雨量を7.6%増やしたと見積もった。起きなかった世界と比べるという発想が面白い。", "unverified": "本文は入手できず、使用した気候モデルと、見積もりの不確かさの幅は確認できなかった。"}}, {"id": "jn45", "rank": 45, "field": "材料科学", "headline": "格子のゆがみで多元合金の点欠陥の自己修復を予測", "title": "Harnessing lattice distortion for point-defect self-healing in multi-principal element alloys", "url": "https://doi.org/10.1073/pnas.2526642123", "authors": "Bozhao Zhang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "化学的に複雑な合金に固有の局所的な格子のゆがみが、空孔と格子間原子の拡散の差を縮めて点欠陥の再結合（自己修復）を促すことを、機械学習の原子間ポテンシャルによる分子動力学で示し、bccのZr–Ti–Nbからfccの系まで成り立つ普遍的な記述子として提案する。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "化学的に複雑な合金に固有の局所的な格子のゆがみ（LLD）を、空孔と格子間原子の拡散の差の縮小を予測する普遍的な記述子として示した（抄録）。", "p3": "bccのZr–Ti–Nb合金でモーメントテンソルポテンシャルに基づく高精度の機械学習の原子間ポテンシャルを作って検証し、大規模な分子動力学で欠陥のエネルギーと移動を計算した（抄録）。", "p5": "LLDと、空孔と格子間原子の活性化エネルギーの差の間に頑健な負の相関があり、fccのV–Co–NiとNi–Pdでも成り立った。LLDによる移動度の差の縮小がフレンケル対の再結合と欠陥の自己修復を促した（抄録）。", "fun": "放射線を浴びる金属の中では、原子が弾き出されて穴（空孔）とはみ出した原子（格子間原子）ができる。両者がうまく出会って元に戻れば金属は傷まない。この研究は、何種類もの元素を混ぜた合金では原子の並びのゆがみが両者の動く速さをそろえ、出会いやすくすることを示した。乱れが修復を助けるという逆説が面白い。", "unverified": "本文は入手できず、相関の強さの数値と実験による検証の有無は確認できなかった。"}}, {"id": "jn46", "rank": 46, "field": "地球科学", "headline": "温暖化で岩盤由来の渓流水は古くなり更新が遅れる", "title": "Geophysics-informed hydrologic modeling reveals contrasting regolith and bedrock responses of headwater catchments to warming", "url": "https://doi.org/10.1126/sciadv.aeh0536", "authors": "Chen Xiong ほか", "venue": "Science Advances", "date": "2026-11-20", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "地震のP波速度で臨界ゾーンを風化層と割れ目のある岩盤に分けた3次元の物理モデルと粒子による寄与の分析で、温暖化により風化層由来の河川水はやや若くなる一方、岩盤由来の水は古くなることを示す。蒸発散の増加と積雪・融雪の時期の変化が涵養を減らし、岩盤の水の更新を遅らせる。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "温暖化が上流域の河川水に与える影響を、地震のP波速度で風化層と割れ目のある岩盤を分けた3次元の物理モデルで調べ、両者で応答が逆になることを示した（抄録）。", "p3": "P波速度で臨界ゾーンを風化層と割れ目のある岩盤の領域に分け、粒子に基づく寄与の分析で、多様な水理条件の実現値について河川水への寄与と水の年齢を定量化した（抄録）。", "p5": "温暖化で風化層由来の河川水はやや若くなり、岩盤由来の水は古くなった。蒸発散の増加と積雪・融雪の時期の変化が有効な涵養を減らして岩盤の飽和を下げ、水の移動を遅くするためで、岩盤の水の更新が減る可能性を示した（抄録）。", "fun": "山の川の水は、雨がすぐ流れ出たものと、長い時間をかけて地下の岩の割れ目を通ってきたものが混ざっている。この研究は、地震波で地下の構造を調べて、温暖化すると岩の中の水はさらに古くなり、入れ替わりが遅くなると示した。表面は変わらないように見えても、地下の水の時計がゆっくりになるという見方が面白い。", "unverified": "本文は入手できず、対象の流域と、年齢の変化の大きさの数値は確認できなかった。"}}, {"id": "jn47", "rank": 47, "field": "組織行動・心理的安全性", "headline": "権限付与型の人事施策がリーダーと発言に与える意外な代償", "title": "Leadership and voice in the future of work: the unexpected cost of empowering HRM practices", "url": "https://doi.org/10.1007/s11846-026-01079-w", "authors": "Andrés Salas-Vallina ほか", "venue": "Review of Managerial Science", "date": "2026-11-21", "sjr": 2.587, "citescore": 21.2, "citescore_year": "2025", "why": "題名によれば、仕事の未来におけるリーダーシップと従業員の発言（ボイス）について、権限を与える人事施策の予想外の代償を示す（抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、仕事の未来におけるリーダーシップと従業員の発言（ボイス）について、従業員に権限を与える人事施策が予想外の代償を生むことを示す研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "従業員に権限を与えれば、意見を言いやすくなり職場は良くなると考えがちだ。題     "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
