1). arXiv. https://doi.org/10.48550/ARXIV.2611.26239", "why": "視覚・言語から行動を出すロボットのモデル（VLA）が、途中から禁止された行動を止めても物を落とすなどの危険が残ることを示し、保持する姿勢を代替の目標として模倣学習させるSAFIを提案する。実行の途中で止める安全性と止めた後の物理的な応答の制御を扱う。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（動機・手法・実験の主な結果・アブレーション・結論と限界）を読んだ。付録は未読", "preprint": true, "p1": "視覚・言語から行動を出すロボットのモデル（VLA）に、禁止された作業を途中から止めさせ、止めた後も物を落とさずに保持させる学習法SAFIを示し、評価したLIBEROの課題で途中から引き継いだ後の禁止作業の達成率を1.3%に下げ、物理的な事故を記録しなかった（抄録、§4.3）。未査読。", "p2": "初期状態からは作業を抑制できる方策でも、途中から制御を引き継ぐと禁止作業をほぼ全エピソードで完遂し（図2a）、作業を終えなくても持っていた瓶を落とすことがあり（図2b）、未完了という指標だけでは安全の尺度として不十分である（§2）。", "p3": "第1段階で、禁止作業の実演の全状態に、グリッパーの位置・姿勢を変えない静止の指令と一貫したグリッパーの目標（保持）を割り当てる。第2段階で、この代替の目標と、残すべき他の作業の元の行動とを同時に模倣学習する。適用前に、台本による保持が禁止の完遂を防ぎ物理的な基準を満たすかを確かめる（§3）。", "p4": "OpenVLA-OFTを基盤に、LIBEROとBadLIBEROの課題で、引き継ぎ後の目標達成率・物理的な事故率・行動の飽和率・残すべき作業の成功率を、GA・GradDiff・NPO-RT・RMU・Refusal FT・VLA-Forgetと比べた（§4.1）。", "p5": "LIBEROで元の方策の目標達成率99.7%をSAFIは1.3%に下げ、事故と行動の飽和はなかった（NPO-RTは達成31.9%・事故19.9%）。保持の模倣を除くと達成率はSpatialで99.7%、Objectで100.0%に戻り、他の作業の模倣を除くと残すべき作業の成功率が0になった。SAFIは残すべき作業でSpatial 96.9%・Object 93.1%を保ち、引き継ぎ後の物体の移動は3.1 cmと最小だった（表1〜3）。", "p6": "著者は、選んだLIBERO・BadLIBEROの課題で固定した学習シードで評価したこと、実機での検証がないこと、保持以外の代替動作（物を置く、接触から離れる）を学ばないことを限界とする（Limitations）。解釈：保持が適切でない作業への拡張が実用の鍵になる。", "fun": "ロボットに「コンロをつけるのは禁止」と教えても、つけ始めた途中で止めるのは別の難しさがある。この研究では、最初からは禁止を守れるロボットでも、途中から引き継ぐとほぼ必ずコンロをつけてしまい、止まっても持っていた瓶を落とすことがあった。そこで止めるときはその場で持ったままじっとする動きをはっきり教えたところ、禁止作業の達成は1.3%まで下がった。やらないだけでなく代わりに何をするかを教える発想が面白い。", "unverified": "付録の詳細な結果（課題別の数値、計算効率）は読んでいない。BadLIBEROの攻撃の具体的な内容は確認できなかった。"}}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "実験室のエージェント型双子でAI科学者を評価", "title": "TwinLab-Bench: Evaluating AI Scientists in Agentic Twins of Real Labs", "url": "https://arxiv.org/abs/2611.26248", "authors": "Yang Wan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Wan, Y., & Zhu, L. (2026). TwinLab-Bench: Evaluating AI Scientists in Agentic Twins of Real Labs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26248", "why": "AI科学者に自分で実験を設計させ、実際の実験室の記録に基づく読み値で評価するベンチマークTwinLab-Benchを作り、物理・生命科学・工学の52課題と100種類を超える実験操作をそろえる。エージェントの報告は実験室の記録から取った隠れた答えと比べて採点する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIエージェントが自分で設計した実験を、実際の実験室の記録に基づいて実行・採点できるベンチマークTwinLab-Benchを作り、最先端のモデルでも難しいことを示した（抄録）。未査読。", "p3": "物理・生命科学・工学の52課題と100種類を超える実験操作をそろえ、課題ごとに環境役のTwinLabエージェントが実験室の素材と記録から作った計算器で、被験エージェントの設計した実験を実行する。報告は記録から取った隠れた答えと比べて採点する（抄録）。", "p5": "課題の記述だけを見る言語モデルに比べ、TwinLabエージェントは記録から外れた読み値と同じ要求への矛盾した答えをほぼなくした。最も強いClaude Fable 5.2でも平均得点は45.0にとどまった（抄録）。", "fun": "AIに科学者の仕事をさせるには、答えを当てるだけでなく、どんな実験をすればよいかを自分で考えさせる必要がある。この研究は、実在の実験室の記録をもとに、AIが考えた実験の結果を返す「実験室の双子」を作った。最も強いAIでも平均45点ほどだったことは、実験を設計する力がまだ大きな壁であることを示している。", "unverified": "本文は入手できず、課題ごとの得点の内訳と、失敗の分析の具体的な内容は確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "動画LLMの微調整に隠れた文章だけの近道を抑える", "title": "Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning", "url": "https://arxiv.org/abs/2611.25776", "authors": "Youngwoo Shin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Shin, Y., Kim, J., & Kim, J. (2026). Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25776", "why": "動画LLMの教師あり微調整が、動画を見ずに訓練データの文章の規則性から答える近道を学び、分布の変化の下で動画による改善を損なうことを示す。基盤モデルで文章だけが占める活性の部分空間を較正し、微調整の更新をその直交方向へ射影するVETOで、データではなく更新の段階で近道を抑える。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "動画LLMの教師あり微調整が、動画を見ずに文章の規則性から答える近道を学ぶ問題を、微調整の更新を射影して抑える方法VETOを示した（抄録）。未査読。", "p3": "基盤モデルの活性で文章だけが占める部分空間を較正し、微調整の更新をその直交補空間に射影する。データの段階で近道を定義せずに、更新の段階で抑える（抄録）。", "p5": "7つの動画LLMで、訓練分布での微調整の改善を保ちながら近道を抑え、分布が変わる6つのベンチマークで通常の微調整より大きく改善し、近道でなく入力全体から答えたとする（抄録）。", "fun": "動画についての質問に、AIが動画を見ずに問題文のクセだけで正解してしまうことがある。選択肢の言い回しから答えを当てる受験テクニックに似ている（比喩）。この研究は、その近道が学習の途中でどこに書き込まれるかに注目し、そこだけを消す方法を考えた。データを直さずに学び方の向きを変える発想が面白い。", "unverified": "本文は入手できず、改善幅の数値とベンチマークの名前は確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "カミソリと替え刃の互換性は市場拡大と共食いを生む", "title": "Compatibility in Tied-Goods Markets: Evidence from Razors and Blades", "url": "https://doi.org/10.2139/ssrn.7721118", "authors": "Si Huang", "venue": "SSRN", "date": "2026-11-20", "apa": "Huang, S. (2026). Compatibility in Tied-Goods Markets: Evidence from Razors and Blades. https://doi.org/10.2139/ssrn.7721118", "why": "本体と消耗品を組で買う市場で、米国のカミソリと替え刃を対象に、本体に合う消耗品を増やす互換性が需要に与える効果を、所有の価値を高めて市場を広げる経路と、自社の既存品を共食いする経路に分けて分析する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "本体と消耗品の互換性が需要に与える効果を、市場拡大と共食いの2つの経路に分けて米国のカミソリ市場で推定した（抄録）。未査読。", "p3": "誘導形の分析で互換性が新製品の採用と代替に与える影響を示し、世帯が毎月、本体パック・互換カートリッジ・何も買わないを選ぶ前向きの動学的需要モデルを推定した（抄録）。", "p5": "互換の柄を持つ世帯は新しい製品系列を採用しやすく、互換カートリッジの間で強く代替した。価格を固定した反実仮想では、製品系列を互換にすると、価格・品質の異なる系列間でも同価格帯の系列内でも市場拡大の効果が共食いを上回った（抄録）。", "fun": "カミソリ本体は安く、替え刃で儲けるのは有名な商売のやり方だ。では、自社の替え刃をどの本体にも合うようにすると得か損か。合う刃が増えれば本体の魅力が上がって客が増えるが、自社の別の刃の売上を食い合う。この研究は家計の購買行動から両方を分けて測り、客が増える効果のほうが大きいと示した点が面白い。", "unverified": "本文は入手できず、データの期間と規模、推定値の大きさは確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "株と国債が同時に下がる日は金利のニュースの日", "title": "The Anatomy of a Broken Hedge: Evidence from Four Decades of Market News&nbsp;", "url": "https://doi.org/10.2139/ssrn.7713518", "authors": "Ioanna Lachana", "venue": "SSRN", "date": "2026-11-20", "apa": "Lachana, I. (2026). The Anatomy of a Broken Hedge: Evidence from Four Decades of Market News&nbsp; https://doi.org/10.2139/ssrn.7713518", "why": "40年分のウォール・ストリート・ジャーナルの記事から、株と国債がともに下がる日（ヘッジが壊れる日）と、株が下がり国債が上がる日のニュースを比べ、前者は1984年以降のどの局面でも金利のニュースの日であり、インフレとFRBへの言及が15.5ポイント多いことを示す。財政のニュースは両者で差がない。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "株と国債が同時に下がる「ヘッジが壊れる日」のニュースを40年分の新聞記事から特定し、それが金利のニュースの日であることを示した（抄録）。未査読。", "p3": "ウォール・ストリート・ジャーナルの記事で、株と国債がともに下がる日と、株が同じように下がり国債が上がる質への逃避の日のニュースを比べ、記者が左右できないデータと価格から識別したショックで報道を検証した（抄録）。", "p5": "1984年以降のどの局面でも、ヘッジが壊れる日は金利のニュースの日で、米国のインフレとFRBへの言及が質への逃避の日より15.5ポイント多かった。財政のニュースや国債入札は両者を分けず、2025年のヘッジが壊れる日は例外で、米国資産のリスクプレミアムの上昇のパターンを示した（抄録）。", "fun": "株が下がるとき、ふつうは安全な国債が買われて値上がりするので、両方持っていれば損を和らげられる。ところが両方同時に下がる日がある。この研究は40年分の新聞を読み比べ、そうした日はほぼ金利のニュースの日だったと突き止めた。ただ2025年だけは様子が違ったという指摘も面白い。", "unverified": "本文は入手できず、記事の分類の方法と、2025年の例外の詳しい分析は確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "処置前の推移ごと照合するランダムフォレストGARF", "title": "Matching Histories, not Just Averages: GARF, Group-Aware Random Forest for Counterfactuals Identification in Panel Data", "url": "https://doi.org/10.2139/ssrn.7719438", "authors": "Federico Fantechi", "venue": "SSRN", "date": "2026-11-20", "apa": "Fantechi, F. (2026). Matching Histories, not Just Averages: GARF, Group-Aware Random Forest for Counterfactuals Identification in Panel Data. https://doi.org/10.2139/ssrn.7719438", "why": "パネルデータの因果推論で、処置前の平均だけで対照群を作る従来の傾向スコア照合では推移が見えないとして、各単位の処置前の履歴を特徴量の群として符号化し、群を意識したランダムフォレストで反実仮想の比較相手を選ぶ照合法GARFを提案する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "パネルデータで、処置前の水準だけでなく推移まで照合して反実仮想の比較相手を選ぶ方法GARFと、そのStataコマンドを示した（抄録）。未査読。", "p3": "各単位の処置前の履歴を変数ごとの水準と動きを表す特徴量の群に符号化し、処置群と非処置群を見分けるランダムフォレストで、同じ葉を共有する頻度（葉の混み具合で割り引く）を近さとして使う。この近さが比較相手の選択、反実仮想での重み、単位ごとの重なりの指標を兼ねる（抄録）。", "p5": "方法の根拠と位置づけ、Stataコマンドgarfの手順と報告のチェックリストを示し、推移による選択のある模擬パネルで例示した。推定量の形式的な性質と診断の手順は別の論文で扱う（抄録）。", "fun": "政策の効果を測るには、政策を受けた地域と「受けなかったらこうなっていた」比較相手が必要だ。従来は過去の平均が似た相手を選んでいたが、平均が同じでも上り坂の地域と下り坂の地域では未来が違う。この研究は、過去の動き方まで似た相手をランダムフォレストで探す方法を作った。比較相手選びを丁寧にする発想が面白い。", "unverified": "本文は入手できず、推定量の性質と性能の比較は別の論文にあるとされ、確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "銀行の気候ベータを時変の半パラメトリック推定で測る", "title": "Quantifying Time-Varying Climate Beta of Banks: A Semiparametric Approach", "url": "https://doi.org/10.2139/ssrn.7718138", "authors": "Yueheng Hu ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Hu, Y., Wei, W., & Gao, J. (2026). Quantifying Time-Varying Climate Beta of Banks: A Semiparametric Approach. https://doi.org/10.2139/ssrn.7718138", "why": "ベータを時間の滑らかな関数とし、残差から非パラメトリックに推定したボラティリティで標準化して再推定する3段階の推定量を提案し、ボラティリティの変動が大きいとき局所定数推定量より効率が上がることを示す。2000年1月〜2026年4月の米国の銀行の気候リスクのベータに適用した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "時間とともに変わるベータを、ボラティリティの変化の情報を使って効率よく推定する半パラメトリックな方法を提案し、銀行の気候リスクのベータに適用した（抄録）。未査読。", "p3": "ベータを時間の滑らかな関数として推定し、残差からボラティリティを非パラメトリックに復元して、ボラティリティで標準化したデータでベータを再推定する3段階の手順をとる（抄録）。", "p5": "ボラティリティが大きく変動するとき、標準的な局所定数推定量より大きな効率の改善がありうることを示し、2000年1月〜2026年4月の米国の銀行に適用して、GARCH-DCCに代わる柔軟な推定法とした（抄録）。", "fun": "気候ベータは、気候に関わるリスクが動いたとき銀行の株価がどれだけ反応するかを表す数だ。この反応の強さは時代とともに変わるので、時間の関数として推定したい。この研究は、市場が荒れている時期と落ち着いた時期でデータの信頼度が違うことを利用して、推定を精密にする工夫を示した。荒れた時期のデータを割り引いて読むという考え方が面白い。", "unverified": "本文は入手できず、効率の改善の大きさと、銀行の気候ベータの推定結果は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "自動運転の学習データの価値を方策ごとに測る", "title": "PAD: Policy-Aware Data Valuation for Autonomous Driving", "url": "https://arxiv.org/abs/2611.25604", "authors": "Chengkai Xu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Xu, C., Guo, Y., Liu, J., Cui, Y., Fang, S., Hang, P., Zhang, H., & Sun, J. (2026). PAD: Policy-Aware Data Valuation for Autonomous Driving (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25604", "why": "エンドツーエンドの自動運転で、ある実演データが計画器によって有益にも有害にもなることから、対象の方策に固有の効用を各データに割り当てる影響関数型のデータ評価PADを提案し、グループ除去の実験で方向の正しさを確かめる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "自動運転の学習用の実演データに、対象の方策（計画器）にとっての価値を割り当てるデータ評価PADを提案し、方策ごとのデータ選別で性能を上げた（抄録）。未査読。", "p3": "場面単位の較正フィードバック、射影した方策勾配、局所的な学習の幾何の正則化近似を組み合わせ、影響関数に基づく価値を大規模に計算する。グループ除去の対照実験で価値の向きの正しさを確かめた（抄録）。", "p5": "同じ候補データでも計画器の系統で順位が大きく異なった。DiffusionDriveでは実データのみの学習よりEPDMSがNavTestで3.5点、NavHardで5.0点改善し、拡散・回帰・フローマッチングの各計画器で方策別の選別が実データのみや全データの学習を上回った（抄録）。", "fun": "自動運転のAIにたくさん運転の手本を見せれば上手になる、とは限らない。ある手本は役に立つが、別のAIにとっては混乱の元になることもある。この研究は、手本ごとに「このAIにとっての価値」を計算し、選んで学ばせると成績が上がることを示した。データは量より相性だという発想が面白い。", "unverified": "本文は入手できず、計算費用と、価値の推定の誤差の大きさは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "カメラ1台とIMUからの実寸の稠密地図をオンラインで", "title": "Accord: Universal Online Metric Localization and Dense Mapping from one Camera and an IMU", "url": "https://arxiv.org/abs/2611.25279", "authors": "Jaafar Mahmoud ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Mahmoud, J., Movsesyan, A., Huynh, C., Iumanov, M., Zagoruyko, S., & Kolyubin, S. (2026). Accord: Universal Online Metric Localization and Dense Mapping from one Camera and an IMU (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25279", "why": "視覚慣性オドメトリの実寸の姿勢を条件に深度の基盤モデルで短い区間の深度を予測し、因子グラフで部分地図を融合することで、任意のカメラとIMUからオンラインで実寸の稠密地図を作る。共通に見える画像間の双方向の深度の一致で尺度を推定・補正する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "任意のカメラ1台とIMUから、オンラインで実寸の稠密な3次元地図を作る方法Accordを示した（抄録）。未査読。", "p3": "視覚慣性オドメトリのフィルタが実寸の姿勢を出し、それを条件に深度の基盤モデルが短いキーフレーム区間の深度を予測し、因子グラフで部分地図を融合する。三角測量した実寸の3次元点に各区間を固定し、共通に見える画像間の双方向の深度の一致で画像ごとの尺度の誤差を補正する（抄録）。", "p5": "5つの公開のカメラ・IMU構成と新しいスマホ治具/GoProのデータセットで、データセットごとの調整なしに、5 cmでの平均F値がどの機材でも1位か2位だった。コードとデータセットを公開した（抄録）。", "fun": "スマホのカメラと揺れを測るセンサーだけで、部屋や街の立体地図を正しい寸法で作れたら便利だ。AIは写真から奥行きを推測できるが、大きさの基準があいまいになる。この研究は、センサーで測った動きを物差しにし、複数の写真の奥行きがお互いに一致するよう補正した。複数の見方の一致を手がかりにする点が面白い。", "unverified": "本文は入手できず、他手法との具体的な比較の数値と計算速度は確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "遅延と差分プライバシー下のオンライン制御のリグレット", "title": "Delayed and Differentially Private Online Primal-dual Control for Grid Flexibility: Regret Bounds Tight in the Delay and a Reproducible Benchmark on Standard Test Feeders", "url": "https://doi.org/10.2139/ssrn.7693518", "authors": "Thibault Draye", "venue": "SSRN", "date": "2026-11-20", "apa": "Draye, T. (2026). Delayed and Differentially Private Online Primal-dual Control for Grid Flexibility: Regret Bounds Tight in the Delay and a Reproducible Benchmark on Standard Test Feeders. https://doi.org/10.2139/ssrn.7693518", "why": "勾配と制約値が遅れて届き、差分プライバシーのための雑音が加わる長期制約つきオンライン凸最適化で、正則化した双対を持つ主双対法の期待リグレットO(√((1+D)T))と雑音項を明示的な定数で示し、遅延への依存が最悪の場合に改善できないことを下界で示す。配電網の柔軟性の制御の再現可能なベンチマークも示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "測定が遅れて届き、差分プライバシーの雑音を加える必要がある配電網の柔軟性の制御を、長期制約つきオンライン凸最適化として解析し、遅延について最適なリグレットの上下界を示した（抄録）。未査読。", "p3": "遅延Dとガウス雑音のもとで正則化した双対を持つ主双対法を解析し、明示的な定数つきの上界とブロック構成による下界を示した。公開の負荷と再エネのプロファイルでIEEE 33母線・118母線の再現可能なベンチマークを作った（抄録）。", "p5": "期待リグレットはO(√((1+D)T))と雑音項、長期の違反はO(T^(3/4))で、遅延への依存は最悪の場合に改善できない。実験では上界は正しいが非常に保守的で（実測の22〜1,281倍）、ε=0.1のプライバシー雑音は10ラウンドの遅延よりはるかに大きな損失を生んだ（抄録）。", "fun": "電力網で家庭の蓄電池などを少しずつ動かして需給を調整するとき、測定は遅れて届き、個人の情報を守るためにわざと雑音も混ぜる。この研究は、遅れと雑音がどれだけ制御の成績を落とすかを数学的に限界まで示した。実験では理論の保証は正しいが、実際よりずっと悲観的だったという正直な結果が面白い。", "unverified": "本文は入手できず、抄録が途中で切れていて2つ目の実験の結果の全体は確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "インフレ期待のばらつきはショックとインフレ水準で変わる", "title": "What Drives Households Apart? Shocks, Inflation Regimes and Disagreement about Inflation", "url": "https://doi.org/10.2139/ssrn.7716378", "authors": "Azharul Islam", "venue": "SSRN", "date": "2026-11-21", "apa": "Islam, A. (2026). What Drives Households Apart? Shocks, Inflation Regimes and Disagreement about Inflation. https://doi.org/10.2139/ssrn.7716378", "why": "ミシガン大学の消費者調査（1985年1月〜2025年12月）で家計の1年先のインフレ期待の標準偏差を不一致の指標とし、局所射影で石油・政策の不確実性・金融政策のショックの効果を推定する。政策の不確実性や石油供給のニュースなどは不一致を高め、石油と金融政策のショックの効果はインフレの水準に依存する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "石油・政策の不確実性・金融政策のショックが家計のインフレ期待のばらつき（不一致）に与える効果が、インフレの水準によって変わることを示した（抄録）。未査読。", "p3": "1985年1月〜2025年12月のミシガン大学の消費者調査で、1年先のインフレ期待の標準偏差を不一致とし、線形と状態依存の局所射影で推定した（抄録）。", "p5": "平均では経済政策の不確実性・石油供給のニュース・中央銀行の情報ショックが不一致を高めた。石油供給と金融政策のショックは、インフレが高いときは不一致を高め、低いときは下げるか変えず、両者が打ち消し合うため線形モデルでは平均の効果が見えなかった（抄録）。", "fun": "物価がこれからどれくらい上がるか、人によって予想はばらばらだ。この研究によると、同じ原油の値動きや金利の変更でも、物価が高い時期には人々の予想がより割れ、低い時期には割れない。物価が高いと人々が物価に注意を払うようになるからだと著者は考える。注意の量が予想のばらつきを決めるという視点が面白い。", "unverified": "本文は入手できず、効果の大きさと、インフレの局面の定義の詳細は確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "財政政策が長期の物価水準を決める名目アンカーに", "title": "Fiscal Policy as a Nominal Anchor", "url": "https://doi.org/10.2139/ssrn.7727298", "authors": "Joseph Abadi", "venue": "SSRN", "date": "2026-11-20", "apa": "Abadi, J. (2026). Fiscal Policy as a Nominal Anchor. https://doi.org/10.2139/ssrn.7727298", "why": "総需要が非リカード的なとき、財政政策はどの物価経路でも政府の異時点間の予算制約を満たしたまま長期の物価水準を固定でき、金利ルールの下での物価水準の不決定性を、テイラー原理や物価水準の財政理論に頼らずに解消できることを、広い種類のマクロモデルで証明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "総需要が非リカード的なとき、財政政策が政府の予算制約をどの物価経路でも満たしたまま長期の物価水準を固定できることを示し、金利ルールの下での物価水準の不決定性の新しい解消法を示した（抄録）。未査読。", "p3": "広い種類のマクロ経済環境で一般的に証明し、ブランシャール＝ヤーリ型の世代重複経済で解析的に例示した（抄録）。", "p5": "テイラー原理と爆発的なインフレ経路の恣意的な排除の組み合わせや、物価水準の財政理論という、理論的に論争のある選択の仕組みに頼らずに不決定性を解消できると示した（抄録）。", "fun": "中央銀行が金利のルールを決めても、理論の上では物価がどの水準に落ち着くか一つに決まらないことがある。この研究は、人々が将来の税を完全には織り込まない（非リカード的な）経済なら、財政政策が物価の錨になれると示した。政府の借金のルールを守ったまま物価を固定できる点が、従来の二つの考え方のどちらにも頼らない新しさだ。", "unverified": "本文は入手できず、証明の仮定の詳細と、モデルの政策的な含意は確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "因果推論", "headline": "適応型の学習支援の判断をDAGと逐次実験で評価", "title": "Evidence-Based Adaptivity Decisions for Educational Interventions", "url": "https://doi.org/10.31234/osf.io/jrthz", "authors": "Jasmin Breitwieser ほか", "venue": "PsyArXiv", "date": "2026-11-20", "apa": "Breitwieser, J., Schaaf, M., & Brod, G. (2026). Evidence-Based Adaptivity Decisions for Educational Interventions. https://doi.org/10.31234/osf.io/jrthz", "why": "後の支援が前の行動に依存する適応型の教育介入では割り付けが完全に無作為にならないことから、逐次的な実験計画と有向非巡回グラフ（DAG）で交絡を特定して調整する方法を示し、語彙学習を促すモバイル介入の2段階の計画プロンプトに適用した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "前の行動に応じて支援を変える適応型の教育介入の判断を、逐次的な実験計画と有向非巡回グラフ（DAG）で評価する方法を示し、語彙学習のモバイル介入に適用した（抄録）。未査読。", "p3": "20日間の第1段階で計画を促すプロンプトを送り、第2段階で前の行動に応じてプロンプトの予定を変えた。DAGで因果の仮定を定式化し、交絡を特定して調整の方法を導いた（抄録）。", "p5": "予定したプロンプトの数には有意な効果がなく（関与の低さのためとみられる）、実際に受け取ったプロンプトの数には有意な正の効果があった。第2段階の効果は前の学習活動とプロンプトへの曝露に依存し、支援を適応させる価値を支持した（抄録）。", "fun": "勉強アプリが「最近サボり気味だから通知を増やそう」と判断するとき、その判断が効いたかを調べるのは意外に難しい。通知を増やされた人はもともとサボっていた人なので、単純に比べると効果を見誤るからだ。この研究は、原因と結果の関係を矢印の図（DAG）で整理して、この落とし穴を避ける方法を示した。送った数ではなく届いた数が効いたという結果も面白い。", "unverified": "本文は入手できず、参加者の数と効果の大きさは確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "生理時系列の混合モデルを試行単位の再標本化で検定", "title": "lmmresample: Resampling inference for mixed models of pupillometry and other trial-structured physiological signals. A tutorial", "url": "https://doi.org/10.31234/osf.io/je35k", "authors": "Ricardo Martínez Flores ほか", "venue": "PsyArXiv", "date": "2026-11-20", "apa": "Flores, R. M., & Super, H. (2026). lmmresample: Resampling inference for mixed models of pupillometry and other trial-structured physiological signals. A tutorial. https://doi.org/10.31234/osf.io/je35k", "why": "瞳孔径・脳波・皮膚電気などの連続信号を線形混合モデルで分析すると、強い自己相関のため通常の検定が証拠を過大に評価する問題に対し、モデルはそのままで推論を試行と参加者ごとの並べ替え検定とブートストラップに置き換えるRパッケージを示す。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "瞳孔径などの連続的な生理信号を線形混合モデルで分析するとき、自己相関で誤った有意が出る問題に対し、試行と参加者を単位に再標本化して推論するRパッケージを示した（抄録）。未査読。", "p3": "研究者の混合モデルはそのままに、推論を試行・参加者ごとの並べ替え検定とブートストラップ信頼区間に置き換え、多重比較の補正と、モデルの適合・依存の大きさ・検定の較正の診断を備える（抄録）。", "p5": "瞳孔データに似せた模擬では、条件×時間の交互作用のWald・Satterthwaite検定は46〜83%の偽陽性を出し、95%区間の被覆は57〜68%だったのに対し、並べ替え検定は名目の水準（2〜7%）を保ち、ブートストラップ区間は91〜96%を覆った（抄録）。", "fun": "瞳の大きさを細かい時間間隔で測ると、隣り合う測定値はほとんど同じになる。それを別々のデータとして数えると、本当は効果がないのに有意と出てしまう。この研究の模擬では、通常の検定が46〜83%もの割合で誤った発見をした。データの塊（試行や人）ごとに入れ替えて確かめるという素朴な方法で、この誤りを防げる点が面白い。", "unverified": "本文は入手できず、検出力の比較の詳細と、公開データの事例の具体的な結果は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "地震工学・防災", "headline": "貿易網の多様性から輸入ショックの確率を予測", "title": "Predicting Exposure to All-Hazard, Product-Level Import Shocks Using Complex Networks", "url": "https://doi.org/10.2139/ssrn.7717620", "authors": "Kat Fowler ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Fowler, K., Sjöstedt, E., Rushforth, R., & Ruddell, B. L. (2026). Predicting Exposure to All-Hazard, Product-Level Import Shocks Using Complex Networks. https://doi.org/10.2139/ssrn.7717620", "why": "小麦の貿易網（BACI-CEPII）を有向・重み付きネットワークとして扱い、供給国を地理的な距離の階級にまとめてリスクの相関を考慮した貿易の多様性を定義し、個別の事象を予測せずに各国の輸入ショックの年間超過確率をモデル化する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小麦の貿易網から、個別の災害を予測せずに各国の輸入ショックへの曝露を測る、危険の種類を問わない製品別のモデルを示した（抄録）。未査読。", "p3": "BACI-CEPIIの有向・重み付きの小麦の貿易網で、供給国を地理的な距離の階級にまとめてリスクの相関を捉える貿易の多様性を定義し、過去の時系列で輸入ショックの年間超過確率をモデル化した（抄録）。", "p5": "152か国のデータで、地理的に多様な輸入網を持つ国ほど輸入の途絶が少なく軽かった。エジプトについて別の網の構成を比べ、リスクの軽減に使えることを示した（抄録）。", "fun": "小麦をいろいろな国から買っていても、その国々が近くに集まっていれば、同じ干ばつや紛争で一斉に止まるかもしれない。この研究は、取引先の数ではなく地理的にどれだけ散らばっているかで多様性を測り、散らばっている国ほど輸入が途絶えにくいことを152か国で示した。卵を一つのかごに盛るな、を地図の上で測った点が面白い。", "unverified": "本文は入手できず、距離の階級の決め方と、モデルの予測精度は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "動画生成モデルの事前知識で潜在行動を自己教師学習", "title": "One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning", "url": "https://arxiv.org/abs/2611.26617", "authors": "Yuxin Jiang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Jiang, Y., Sun, W., Li, J., Gu, Y., Zhang, L., Tsang, I., & Shou, M. Z. (2026). One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26617", "why": "事前学習済みの動画拡散Transformerから逆動力学と順動力学の両方のモデルを初期化し、小さな情報のボトルネックを通して端から端まで最適化することで、ラベルのない動画から転用可能な潜在行動を学ぶO²LaFを提案する。ナビゲーションとロボット操作で評価した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "事前学習済みの動画生成モデルを逆動力学と順動力学の両方の事前知識として使い、ラベルのない動画から転用可能な潜在行動を学ぶ方法O²LaFを示した（抄録）。未査読。", "p3": "同じ動画拡散Transformerから、学習可能な行動クエリを持つ遷移エンコーダ（逆動力学）と、行動を条件とする因果的な動画生成器（順動力学）を初期化し、小さなボトルネックを通して端から端まで最適化した（抄録）。", "p5": "ナビゲーションとロボット操作で、少数例の行動の読み出しで最高性能を示し、見た目や身体の異なる環境へのゼロショットの行動転移を改善した。V-JEPA2のような予測型の表現にも広げ、競争力のある性能を得た（抄録）。", "fun": "動画には何が起きたかは映っているが、誰がどの操作をしたかは映っていない。この研究は、動画を作るAIが持つ世界の動き方の知識を借りて、映像の変化から隠れた操作を推測させた。推測した操作は別のロボットや別の場面にも使えたという。生成モデルを理解の道具に転用する発想が面白い。", "unverified": "本文は入手できず、比較した手法と性能の数値は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "相関資産を反実仮想にして取引の市場インパクトを推定", "title": "Accurate Estimation of Market Impact and a Hausman Test for Cross-Impact in Securities Trading", "url": "https://doi.org/10.2139/ssrn.7706398", "authors": "Stuart Baumann", "venue": "SSRN", "date": "2026-11-20", "apa": "Baumann, S. (2026). Accurate Estimation of Market Impact and a Hausman Test for Cross-Impact in Securities Trading. https://doi.org/10.2139/ssrn.7706398", "why": "自分の注文の価格への影響（市場インパクト）を、取引していない相関の高い資産から作る反実仮想の価格を基準に測ることで、推定量の標準誤差を大きく下げられることを示す。交差インパクトがあると全パラメータが共通に減衰することを使い、その有無を調べるハウスマン型の検定を導く。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "自分の注文が価格をどれだけ動かすか（市場インパクト）を、取引していない相関の高い資産から作る反実仮想の価格を基準に測ることで推定を精密にし、交差インパクトの検定を導いた（抄録）。未査読。", "p3": "過去の注文のスリッページを相関の高い同業資産が示す反実仮想の価格と比べる精緻化したスリッページで影響モデルのパラメータを推定し、ハウスマン型の検定を導いた。裁定がないことと両立する交差インパクトの最大の大きさから偏りの上限も導いた（抄録）。", "p5": "推定量は標準誤差を大きく下げ、交差インパクトがなければ不偏で、あれば全パラメータが共通の係数で減衰する。取引する資産より流動性の高い同業資産を選べば偏りの可能性は小さかった（抄録）。", "fun": "大量の株を売ると、自分の売りで値段が下がる。その影響を測りたいが、値段は自分と無関係な理由でも常に動くので、測定は雑音だらけになる。この研究は、自分が売っていない似た株の値動きを比べる基準にして、雑音を大きく減らした。似た株自体が自分の売りの影響を受けていないかまで確かめる点が面白い。", "unverified": "本文は入手できず、実データでの標準誤差の改善の大きさは確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "両面市場の企業価値はネットワーク乗数で決まる", "title": "Valuation in Two-Sided Markets", "url": "https://doi.org/10.2139/ssrn.7722139", "authors": "Ryan Williams", "venue": "SSRN", "date": "2026-11-20", "apa": "Williams, R. (2026). Valuation in Two-Sided Markets. https://doi.org/10.2139/ssrn.7722139", "why": "プラットフォームの各側の参加が互いに依存する評価モデルを作り、キャッシュフローがネットワーク乗数で拡大されることを示す。各側を独立に評価する従来の割引キャッシュフロー法は片側へのショックの効果を過小評価し、自らキャッシュフローを生まない側に価値を付けない。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プラットフォームの両側の参加が互いに依存することを組み込んだ企業価値のモデルを作り、片側ずつ評価する従来の割引キャッシュフロー法の偏りを示した（抄録）。未査読。", "p3": "各側の参加が他方に依存し、キャッシュフローがネットワーク乗数で拡大されるモデルを作り、上場プラットフォームのデータ、新聞の自然実験、不動産ポータルの事例で検証した（抄録）。", "p5": "従来の評価は片側へのショックの効果を価格構造に対応する係数だけ過小評価し、自らキャッシュフローを生まない側に価値を付けない。上場プラットフォームでは、ほとんど支払わない側の成長が、主に支払う参加者一人当たりの支払いを通じて収益の成長を予測した（抄録）。", "fun": "新聞は読者が多いほど広告主が集まり、広告主が多いほど読者を呼び込める。このように二つの客層が互いを呼び込む事業では、片方だけを見て価値を計算すると間違える。この研究は、お金を払わない側の増加が、払う側の支払いを通じて収益の伸びを予測することを示した。無料の客にも値段が付くという点が面白い。", "unverified": "本文は入手できず、上場プラットフォームの標本と推定値の大きさは確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "情報を持つ高頻度取引業者の値付けと注文の選び方", "title": "Market Making by an Informed High-frequency Trader", "url": "https://doi.org/10.2139/ssrn.7713141", "authors": "Jesper Rüdiger", "venue": "SSRN", "date": "2026-11-21", "apa": "Rüdiger, J. (2026). Market Making by an Informed High-frequency Trader. https://doi.org/10.2139/ssrn.7713141", "why": "ニュースに最初に反応する高頻度取引業者が指値と成行を使い分け、遅いマーケットメーカーと、より情報を持つ投機家と取引するモデルで、高頻度取引業者の指値と成行の無差別条件がマーケットメーカーのスプレッドを決め、情報取引は気配値でなく注文の構成を変えることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ニュースに最初に反応する高頻度取引業者が指値と成行を使い分ける市場のモデルで、マーケットメーカーのスプレッドと注文の構成がどう決まるかを示した（抄録）。未査読。", "p3": "遅いマーケットメーカーと、高頻度取引業者より遅いが内部情報も持つ投機家がいる市場で、在庫の保有費用と終日の罰則を持つ高頻度取引業者の均衡を、費用が小さい場合について分析した（抄録）。", "p5": "高頻度取引業者の指値と成行の無差別条件がマーケットメーカーのスプレッドを決め、情報取引は気配値でなく注文の構成を変える。高頻度取引業者がスプレッドの内側に気配を出し、マーケットメーカーのスプレッドを広げることもある（抄録）。", "fun": "株式市場では、コンピュータがごく短い時間で売買する高頻度取引が大きな役割を持つ。この研究は、ニュースに一番早く反応する業者が、自分で値段を出すか、出ている値段で取引するかを選ぶ様子をモデルにした。情報を持つ人の取引が値段の幅ではなく注文の種類の組み合わせを変えるという結論が意外で面白い。", "unverified": "本文は入手できず、均衡の存在条件と実証的な含意は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "水力発電の運用計画と金融ヘッジを同時に最適化", "title": "Hydropower Scheduling and Financial Risk Management", "url": "https://doi.org/10.2139/ssrn.7709818", "authors": "Tarjei Kristiansen", "venue": "SSRN", "date": "2026-11-21", "apa": "Kristiansen, T. (2026). Hydropower Scheduling and Financial Risk Management. https://doi.org/10.2139/ssrn.7709818", "why": "水力発電の運用計画と金融契約によるリスク管理を同時に扱う道具を、基準収入を下回る収入に罰則を課す形で定式化し、確率的双対動的計画法と確率的動的計画法の組み合わせで解く。ノルウェーのNorsk Hydroに適用し、リスク回避を入れると低収入のシナリオが改善した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "水力発電事業者の運用計画と金融契約によるリスク管理を同時に扱う道具を示し、ノルウェーのNorsk Hydroに適用した（抄録）。未査読。", "p3": "基準収入を下回る収入に罰則を課す形で金融リスクを扱い、確率的双対動的計画法と確率的動的計画法を組み合わせて解いた（抄録）。", "p5": "シミュレーションで、リスク回避を入れると低収入のシナリオが改善することを示した。改善の大きさの数値は抄録にない（抄録）。", "fun": "ダムに水をためて発電する会社は、雨の量と電力の値段という二つの不確かさを抱えている。この研究は、いつ発電するかという運用と、値段の変動に備える金融の契約を一緒に考える道具を作った。収入が基準を下回ることに罰を与えるだけで、悪い年の収入が改善したという。水と金融を一体で管理する発想が面白い。", "unverified": "本文は入手できず、改善の大きさと平均収入への影響は確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "因果推論", "headline": "因果フォレストで職業訓練の異質な効果を推定する手順", "title": "Evaluating Labour Market Programs Using Causal Machine Learning: A Practitioner-Oriented Framework for Estimating and Interpreting Heterogeneous Treatment Effects", "url": "https://doi.org/10.2139/ssrn.7714598", "authors": "Jamil Sayeed ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Sayeed, J., Handouyahia, A., & Aouli, E. (2026). Evaluating Labour Market Programs Using Causal Machine Learning: A Practitioner-Oriented Framework for Estimating and Interpreting Heterogeneous Treatment Effects. https://doi.org/10.2139/ssrn.7714598", "why": "労働市場の訓練プログラムの評価に修正因果フォレストを使う実務向けの手順を示し、個人・集団・全体の処置効果の推定と解釈を合成データで段階的に説明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "労働市場の訓練プログラムの評価に修正因果フォレストを使う実務向けの手順を示し、処置効果の異質性を解釈する簡単な目安を提案した（抄録）。未査読。", "p3": "合成の訓練プログラムのデータで個人・集団・全体の処置効果を推定する段階的な手順を示し、群の間で共変量の分布が大きく異なるときの解釈に、均衡化した群平均処置効果の推定量に基づく分解の目安を導入した（抄録）。", "p5": "修正因果フォレストは意味のある効果の異質性を特定し、推定値はマッチングなどの従来の方法とおおむね整合した（抄録）。", "fun": "職業訓練の効果は、年齢や学歴などで人によって違うはずだ。機械学習を使えばその違いを細かく推定できるが、手順が難しく、結果の読み方も分かりにくい。この研究は、その手順を一歩ずつ示し、効果の違いが属性によるのか集団の構成の違いによるのかを見分ける目安を作った。道具を使えるようにする工夫が面白い。", "unverified": "本文は入手できず、合成データの設定と、従来法との比較の数値は確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "支出調査から世帯の必要額の分布を推定する方法", "title": "Estimating the Distribution of Household Needs Thresholds from Expenditure Surveys: Concave Regression, Censored-Data Methods, and Leakage", "url": "https://doi.org/10.2139/ssrn.7720059", "authors": "Renz Abram Paragas", "venue": "SSRN", "date": "2026-11-20", "apa": "Paragas, R. A. (2026). Estimating the Distribution of Household Needs Thresholds from Expenditure Surveys: Concave Regression, Censored-Data Methods, and Leakage. https://doi.org/10.2139/ssrn.7720059", "why": "必要が飽和し閾値が予算と独立なら世帯の必要額の閾値の分布関数は予算に対する平均的な基礎支出の傾きから求まるという先行結果を受け、予算の非基礎財への漏れと閾値を超える格上げへ識別を広げ、漏れの割合が部分識別にとどまる条件を示す。凹回帰・積極限推定量・単調回帰の3つの推定法を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "支出調査から世帯の必要額の閾値の分布を推定する方法を、予算の漏れと格上げを含めて整理し、3つのデータの状況ごとの推定量の性能を模擬で調べた（抄録）。未査読。", "p3": "必要額の閾値の分布関数が平均的な基礎支出の傾きから求まるという先行結果を非基礎財への漏れと閾値を超える格上げへ広げ、凹回帰・積極限推定量・単調回帰の3つの推定法と、部分標本による推論と模擬の手順を示した（抄録）。", "p5": "観測される予算がゼロに届かないとき漏れの割合は部分識別にとどまる。模擬は既知の収束の速さと未調整の傾き推定量の偏りの予測に整合したが、部分標本の区間は単調回帰と傾きの方法などで被覆が不足した（抄録）。", "fun": "家族が生活に必要とする額は、直接は観測できない。この研究は、予算が増えたとき基礎的な支出がどう増えるかの傾きから、必要額のばらつきを逆算する方法を検討した。新しい定理はないと著者自身が断ったうえで、どの方法がどんな弱点を持つかを模擬で正直に示している点が面白い。", "unverified": "本文は入手できず、模擬の設定と被覆率の具体的な数値は確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "サイコロ課題の嘘の分析に潜む多重検定の問題", "title": "A Multiple Testing Problem Under the Die-Roll Paradigm &nbsp;", "url": "https://doi.org/10.2139/ssrn.7707858", "authors": "JunYi Peng-Zhou ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Peng-Zhou, J., & Sohn, J.-y. (2026). A Multiple Testing Problem Under the Die-Roll Paradigm &nbsp; https://doi.org/10.2139/ssrn.7707858", "why": "実験経済学で嘘をつく傾向を測るサイコロ課題（Fischbacher & Föllmi-Heusi 2013）の分析に潜む多重検定の問題を指摘して対処法を示し、よく使われる推論の検出力を分析して今後の実験の標本の大きさの選択に役立てる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得、3文の短い抄録）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "実験経済学で嘘をつく傾向を測るサイコロ課題（Fischbacher & Föllmi-Heusi 2013）の分析に潜みうる多重検定の問題を検討し、対処法を提案した（抄録）。未査読。", "p3": "よく使われる嘘のパターンの統計的推論について検出力を分析した（抄録）。", "p5": "多重検定の問題を和らげる方法を提案し、検出力の分析を今後の実験の標本の大きさの選択の指針として示した。具体的な数値は抄録にない（抄録）。", "fun": "サイコロを人に見られずに振ってもらい、出た目に応じてお金を払うと、高い目の報告が確率より多くなる。これで人の小さな嘘を測るのがサイコロ課題だ。ただ、いろいろな目の出方を一つずつ検定すると、偶然でも嘘のパターンが見つかりやすくなる。この研究はその落とし穴を指摘した。測る道具の側の偏りに目を向けた点が面白い。", "unverified": "本文は入手できず、提案した対処法の中身と検出力の数値は確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "工学", "headline": "宇宙機用の閉じた二重殻の複合材パラボラ反射鏡", "title": "Composite solid surface parabolic reflector of spacecraft mirror antenna: design and testing", "url": "https://doi.org/10.21203/rs.3.rs-11696518/v1", "authors": "Alexander Lopatin ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Lopatin, A., & Taygin, V. (2026). Composite solid surface parabolic reflector of spacecraft mirror antenna: design and testing. https://doi.org/10.21203/rs.3.rs-11696518/v1", "why": "反射殻と支持殻をともに放物面にして開口の縁で接合した閉じた構造で剛性を高めた、宇宙機の鏡面アンテナ用の超軽量の複合材反射鏡を提案する。パラメトリックな有限要素のモード解析で口径0.6 m・焦点距離0.15 mの試作品を設計・製作・試験した。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "反射殻と支持殻をともに放物面にして開口の縁で接合した閉じた構造で剛性を高めた、宇宙機用の超軽量の複合材の反射鏡を設計・製作・試験した（抄録）。未査読。", "p3": "パラメトリックな有限要素のモード解析で口径0.6 m・焦点距離0.15 mの試作品を設計し、理想の放物面からの反射殻のずれを小さくする製作技術を開発した（抄録）。", "p5": "振動試験と熱試験で、軌道への投入とその後の周回で受ける機械的・熱的な荷重に耐えることを確かめ、高い周波数で鋭く指向する電磁波を作るための要件を満たすとした（抄録）。", "fun": "人工衛星のアンテナは、ロケット打ち上げの激しい揺れと宇宙での大きな温度差に耐えながら、鏡の形をほとんど狂わせてはいけない。この研究は、お椀を二枚重ねて縁で貼り合わせたような閉じた形にすることで、軽いまま硬くした。卵の殻のように形そのものが強さを生むという考え方が面白い（比喩）。", "unverified": "本文は入手できず、形状誤差・質量・試験条件の数値は確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "工学", "headline": "薬液注入の浸透から劣化までを数値計算とMLPで予測", "title": "Hydrogeological Modeling of Permeation Grouting: Application to Silicate Grouting from Injection through Degradation", "url": "https://doi.org/10.21203/rs.3.rs-11490453/v1", "authors": "Mehdi Mahdaviara ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Mahdaviara, M., Sweijen, T., Zech, A., & Raoof, A. (2026). Hydrogeological Modeling of Permeation Grouting: Application to Silicate Grouting from Injection through Degradation. https://doi.org/10.21203/rs.3.rs-11490453/v1", "why": "珪酸ナトリウムの浸透注入を、注入時の薬液の輸送と硬化に伴う地盤特性の変化を追う数値計算と、文献のデータベースで学習した多層パーセプトロンによる遮水層の劣化予測とを組み合わせ、注入から長期の化学変化まで現場の規模で扱う枠組みを示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "珪酸ナトリウムの浸透注入を、注入から長期の劣化まで現場の規模で予測する、数値計算と多層パーセプトロン（MLP）を組み合わせた枠組みを示した（抄録）。未査読。", "p3": "数値計算で注入時の薬液の輸送とゲル化に伴う地盤特性の変化を追い、注入後にできる低透水層の劣化を、薬液の組成・硬化剤・地盤の特性と質量減少の関係を文献から集めたデータで学習したMLPで予測した（抄録）。", "p5": "現場規模の事例では、120本の井戸に各340リットルを注入して影響半径は1本あたり約0.55 m、平均の透水係数は0.36 m/hrから1.3×10⁻⁵ m/hrに下がった。最も低い透水性は注入深度を中心とする厚さ2 mの範囲に限られた（抄録）。", "fun": "トンネルやダムの工事では、地盤に薬液を染み込ませて固め、水を止めることがある。この研究は、薬液がどう広がり、固まった層が時間とともにどれだけ劣化するかを、物理の計算とAIの組み合わせで予測した。事例では水の通しやすさが0.36 m/hrから1.3×10⁻⁵ m/hrへと桁違いに下がったという。目に見えない地中の工事の効果を数字で見通せる点が面白い。", "unverified": "本文は入手できず、MLPの精度と、劣化の予測の検証の方法は確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "日常の多段マルチモーダル対話の動的な安全意識を評価", "title": "DailySafe: Benchmarking Dynamic Safety Awareness in Everyday Multi-Turn Multimodal Interactions", "url": "https://arxiv.org/abs/2611.26298", "authors": "Xuankun Rong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Rong, X., Deng, X., Jiang, W., Peng, Z., Liang, S., Huang, W., Arbelaez, P., & Ye, M. (2026). DailySafe: Benchmarking Dynamic Safety Awareness in Everyday Multi-Turn Multimodal Interactions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26298", "why": "普通の作業の流れの中で、前の行動や画像と合わせると危険になる依頼にマルチモーダルLLMが気づけるかを測るため、自然な多段・複数画像の対話195件からなるベンチマークDailySafeを作る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "日常の作業の流れの中で、前の行動や画像と合わせると危険になる依頼にマルチモーダルLLMが気づいて安全に支援できるか（動的な安全意識）を測るベンチマークDailySafeを作った（抄録）。未査読。", "p3": "実際の利用者の対話の話題と文書化された安全知識に基づき、10の日常領域・42の課題分類にわたる自然な多段・複数画像の対話195件を作り、事例ごとの安全の注釈で評価する（抄録）。", "p5": "安全に関わる証拠が対話の段と画像を通じて少しずつ明らかになる場面で、正当な目的を支えながら変化するリスクに対処できるかを評価する。モデルごとの結果の数値は抄録にない（抄録）。", "fun": "一つ一つは普通の頼みごとでも、それまでの会話や見せた写真と合わせると危なくなることがある。この研究は、そうした「話の流れの中で初めて危険になる」場面を10の日常領域で195件集め、AIが気づいて安全に手伝えるかを試す問題集を作った。危険が一回の質問ではなく積み重ねに潜むという見方が面白い。", "unverified": "本文は入手できず、評価したモデルとその成績は抄録に記載がなく確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "経済学", "headline": "米金利ショックの韓国市場への波及は局面で変わる", "title": "Fed Policy Spillovers to Korea's Currency and Stock Markets: A TVP-VAR Connectedness Approach", "url": "https://doi.org/10.2139/ssrn.7708078", "authors": "Md Touhidul Islam Bhuiyan", "venue": "SSRN", "date": "2026-11-20", "apa": "Bhuiyan, M. T. I. (2026). Fed Policy Spillovers to Korea’s Currency and Stock Markets: A TVP-VAR Connectedness Approach. https://doi.org/10.2139/ssrn.7708078", "why": "時変パラメータVARの連結性で、米国1年国債利回り・ウォン・韓国株価の331か月（1999年2月〜2026年8月）の波及を測り、全体の連結性は平均16.03%、COVID-19期の2020年6月に23.20%で最大であること、米金利は純受信側でウォンが主な純発信側であることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の金融政策ショックが韓国のウォンと株価にどれだけ、どの向きに波及するかを、時変パラメータVARの連結性で測った（抄録）。未査読。", "p3": "米国1年国債利回り・ウォンドル相場・韓国株価の月次の連結性を331か月（1999年2月〜2026年8月）について推定し、4つの頑健性の確認を行った（抄録）。", "p5": "全体の連結性は平均16.03%で、COVID-19期の2020年6月に23.20%で最大だった。米金利は純受信側（平均の純値−5.55）で、ウォンが主な純発信側だった（331か月中299か月で正）。経路は局面で入れ替わり、2022〜2023年の利上げ局面では韓国株価へ伝わった（抄録）。", "fun": "アメリカが金利を上げると、遠く離れた韓国の通貨や株にも影響が及ぶ。この研究は、その影響の強さと向きを331か月分のデータで追い、意外にも米国の金利は影響を受ける側に回ることが多く、ウォンが主な発信源だったと示した。さらに、危機のときは通貨に、利上げ局面では株に波及の経路が切り替わった点が面白い。", "unverified": "本文は入手できず、ショックの識別の方法と頑健性の確認の内容は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "最初に参入する市場を顧客の課題の準備度で選ぶ", "title": "Selecting and Developing New Markets: Customer Problem Readiness, Beachhead Strategy and Commercialization Learning", "url": "https://doi.org/10.2139/ssrn.7722158", "authors": "Jonathan Linton", "venue": "SSRN", "date": "2026-11-20", "apa": "Linton, J. (2026). Selecting and Developing New Markets: Customer Problem Readiness, Beachhead Strategy and Commercialization Learning. https://doi.org/10.2139/ssrn.7722158", "why": "技術に複数の用途があるとき最初の市場をどう選ぶかについて、機会の認識・組織購買・普及・橋頭堡戦略・実装研究・不確実性下の実験を統合した概念モデル（顧客の準備度に基づく橋頭堡モデル）を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "技術に複数の用途があるときに最初に参入する市場をどう選び育てるかについて、顧客の課題の準備度に基づく橋頭堡（CRB）モデルという統合的な概念モデルを示した（抄録）。未査読。", "p3": "機会の認識・組織購買・普及・橋頭堡戦略・実装研究・不確実性下の実験の研究を統合し、顧客の課題の準備度を「根本の課題への気づき」と「結果の深刻さの知覚」の2次元で表して、購買権限・代替手段・組織能力・市場集中などと合わせて検討する（抄録）。", "p5": "魅力的な橋頭堡は初期の売上だけでなく、守れる地位と、投資の前提を安く学べる手段を与えるべきだと論じ、購入後の放棄や定着も分析に含める。過程に基づくシミュレーションモデルを提案した（抄録）。", "fun": "新しい技術を売り出すとき、どの客から始めるかで成否が分かれる。この論文は、客が自分の困りごとにどれだけ気づき、どれだけ深刻だと感じているかという「課題への準備度」で最初の市場を選ぶべきだと主張する。製品を気に入るかどうかより先に、困りごとの自覚を見るという視点の転換が面白い。", "unverified": "本文は入手できず、提案したシミュレーションモデルの中身と検証の有無は抄録が途中で切れていて確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "大手の提携が競争に与える間接効果を因果ループで評価", "title": "Assessing Competition Concerns in Digital Markets Using a Systems Approach: A Case-study of Microsoft’s Partnership with OpenAI", "url": "https://doi.org/10.2139/ssrn.7715160", "authors": "Elena Rovenskaya ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Rovenskaya, E., Ivanov, A., Strelkovskii, N., Silva Kandir, A., Hathiari, S., Kotova, D., Scharler, U. M., & Boza, G. (2026). Assessing Competition Concerns in Digital Markets Using a Systems Approach: A Case-study of Microsoft’s Partnership with OpenAI. https://doi.org/10.2139/ssrn.7715160", "why": "合併規制の基準に当たらない戦略的な出資・インフラ依存・提携の、競争・イノベーション・消費者厚生への間接的でフィードバックを介した効果を評価するため、因果ループ図と経路・ループの網羅的な分析を組み合わせた半定量的な枠組みを示し、MicrosoftとOpenAIの提携に適用する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "合併規制の基準に当たらない出資・インフラ依存・提携が競争・イノベーション・消費者厚生に与える間接的な効果を評価する、半定量的なシステムマップの枠組みを示し、MicrosoftとOpenAIの提携に適用した（抄録）。未査読。", "p3": "因果ループ図と経路・フィードバックループの網羅的な分析を組み合わせ、長い因果の連鎖ほど影響が弱まることを考慮した指標を導入した。公開の文書・専門家の評価・競争政策の概念から16の要素と43のつながりのマップを作った（抄録）。", "p5": "2022年末〜2025年初めの提携は、AI市場の競争、イノベーション、Microsoft製品を使わない消費者の厚生に全体として負の効果を持ち、Microsoft製品の利用者への影響は混在するとの結果だった。イノベーションと競争への負の効果は自己強化しうるとした（抄録）。", "fun": "大企業が新興企業を買収せずに大きな出資と提携で結びつくと、独占禁止の審査の網にかからないことがある。この研究は、影響がどの経路を通って広がるかを矢印の図で描き、長い経路ほど影響を割り引いて足し合わせた。目に見えにくい間接的な力を図にして測ろうとする発想が面白い。", "unverified": "本文は入手できず、各つながりの重みの決め方と、評価の頑健性は確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "経済学", "headline": "ブラジルの高金利と財政インフレを開放経済モデルで説明", "title": "Neo-Fisherian Adventures in the Tropics: Monetary Policy and Fiscal Inflation in Brazil", "url": "https://doi.org/10.2139/ssrn.7714538", "authors": "Dejanir Silva", "venue": "SSRN", "date": "2026-11-21", "apa": "Silva, D. (2026). Neo-Fisherian Adventures in the Tropics: Monetary Policy and Fiscal Inflation in Brazil. https://doi.org/10.2139/ssrn.7714538", "why": "ブラジルの高い実質金利を国内の貯蓄誘因と限られた海外の裁定に結びつける開放経済モデルを推定し、裏付けのない財政ショックが5年先の総合インフレ率の変動の38%を説明すること、信頼できる恒久的な利下げが長期のインフレを下げることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ブラジルの高い実質金利を国内の貯蓄の誘因と限られた海外の裁定に結びつける開放経済モデルを推定し、財政インフレと金融政策の効果を分析した（抄録）。未査読。", "p3": "大きな通貨のリスクプレミアムと控えめな海外の債券保有が両立する開放経済モデルを推定した（抄録）。", "p5": "推定したモデルでは、裏付けのない財政ショックが5年先の総合インフレ率の変動の38%を説明した。信頼できる恒久的な利下げは長期のインフレを下げて長期の実質金利を変えず、債務の再評価と通貨安による初期のインフレの上昇は一時的な外貨準備の売却でほぼ消えた（抄録）。", "fun": "ふつうはインフレを抑えるには利上げと考えるが、この研究のモデルでは、信頼される恒久的な利下げが長い目で見るとインフレを下げる。ブラジルでは財政の裏付けのない支出がインフレの大きな原因になっているとし、金利と財政のどちらに手を打つかで結果が変わる点が面白い。", "unverified": "本文は入手できず、推定の方法とデータの期間は確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "車上の複数振動信号から軌道不整を高精度に推定", "title": "Track Irregularity Estimation Using Multi-Source On-Board Vibration Signals", "url": "https://doi.org/10.1088/1361-6501/aec4fc", "authors": "Xiaoming Wang ほか", "venue": "Measurement Science and Technology", "date": "2026-11-20", "sjr": 0.582, "citescore": 4.8, "citescore_year": "2025", "apa": "Wang, X., Wu, S., Liu, L., Huang, Y., Yao, D., & Dong, W. (2026). Track Irregularity Estimation Using Multi-Source On-Board Vibration Signals. Measurement Science and Technology. https://doi.org/10.1088/1361-6501/aec4fc", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "多径間梁の支点の劣化をひずみと少数の変位から推定", "title": "A 1D inverse finite-element framework for shape-sensing and assessment of multiple degrading boundary conditions in multi-span beam-like structures", "url": "https://doi.org/10.1177/14759217261500630", "authors": "Hung Chih Wu Chen ほか", "venue": "Structural Health Monitoring", "date": "2026-11-21", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Wu Chen, H. C., Bardiani, J., Mastrorillo, L., & Sbarufatti, C. (2026). A 1D inverse finite-element framework for shape-sensing and assessment of multiple degrading boundary conditions in multi-span beam-like structures. Structural Health Monitoring. https://doi.org/10.1177/14759217261500630", "theme": "VB bridges from inclination measurements using a spatiotemporal convolutional network", "url": "https://doi.org/10.1016/j.istruc.2026.113592", "authors": "Xin Wang ほか", "venue": "Structures", "date": "2026-11-21", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Wang, X., Niu, J., Wang, B., Wang, Z., Du, C., Mo, Y., & Yang, L. (2026). Robust dynamic displacement reconstruction of large-span high-speed railway bridges from inclination measurements using a spatiotemporal convolutional network. Structures, 94, 113592. https://doi.org/10.1016/j.istruc.2026.113592", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、長大な高速鉄道橋の動的な変位を、傾斜の計測から時空間の畳み込みネットワークで頑健に再構成する研究。直接測りにくい変位を、測りやすい傾斜から推定する方法と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋がどれだけたわむかを直接測るには動かない基準点が必要で、川の上の長い橋では難しい。題名から読み取れる問いは、測りやすい傾きの情報から、列車が通るときの橋の動きをAIで正確に復元できるかだ。角度から形を描き直す発想は、坂道の傾きをつないで地形を描くのに似ている（比喩）。", "unverified": "抄録・本文とも入手できず、手法の詳細、検証のデータ、精度はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "構成則のモデル誤差を系の計測から学習", "title": "Learning constitutive-level modeling error in nonlinear structural systems using embedded neural networks and system-level measurements", "url": "https://doi.org/10.1016/j.compstruc.2026.108514", "authors": "Mohammad Valikhani ほか", "venue": "Computers and Structures", "date": "2026-11-21", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "apa": "Valikhani, M., Shamsaei, K., & Ebrahimian, H. (2027). Learning constitutive-level modeling error in nonlinear structural systems using embedded neural networks and system-level measurements. Computers & Structures, 334, 108514. https://doi.org/10.1016/j.compstruc.2026.108514", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、非線形の構造システムで、構成則（材料の力と変形の関係）のレベルのモデル誤差を、モデルに埋め込んだニューラルネットワークと構造全体の計測から学習する研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物の計算モデルは、材料の性質を表す式が少し違うだけで、揺れの予測が大きくずれることがある。題名から読み取れる問いは、材料一つ一つを試験しなくても、構造全体の揺れの計測から式のどこが間違っているかをAIに学ばせられるかだ。全体から部分の誤りを逆算する点が難しく面白い。", "unverified": "抄録・本文とも入手できず、対象の構造、学習の方法、結果はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "洋上風車の構造ヘルスモニタリングを体系的に総説", "title": "A review of integrated structural health monitoring for next-generation offshore wind turbines: Sensors, analytics, and digital twins", "url": "https://doi.org/10.1177/14759217261503178", "authors": "Yao-Teng Hu ほか", "venue": "Structural Health Monitoring", "date": "2026-11-21", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Hu, Y.-T., Zhang, X., Tao, J., & Noshadravan, A. (2026). A review of integrated structural health monitoring for next-generation offshore wind turbines: Sensors, analytics, and digital twins. Structural Health Monitoring. https://doi.org/10.1177/14759217261503178", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "洋上風車の基礎・タワー・ブレード・浮体とナセル・駆動系までの構造ヘルスモニタリング（SHM）を、劣化機構から解析、保守の判断までつなげて整理した総説（抄録）。", "p3": "各研究の知見を数値・実験室・陸上・洋上という検証の場ごとに読み分け、振動・ひずみ・音響・超音波・分布型光ファイバーの計測と、物理モデル・機械学習・多センサ融合・デジタルツインの解析を検討した（抄録）。", "p5": "全体の監視は変化の検出、局所の計測と点検は原因の特定を担うとし、洋上での証拠はモード追跡と荷重に基づく疲労評価で最も強い一方、駆動系の監視とデジタル手法は主に陸上・実験・数値などの証拠に頼るとした（抄録）。", "fun": "洋上風車は海の上にあるので、点検に行くだけで大がかりになる。この総説は、センサーで常に見張る方法がどこまで本当に海の上で確かめられているかを一つ一つ仕分けた。振動の性質の変化を追う方法は実証が進んでいるが、最新のデジタル手法は陸上や実験室の証拠が中心だという指摘は、新しい技術ほど実地の確認が追いついていないことを示している。", "unverified": "本文は入手できず、対象とした文献の数と選定の基準は確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "侵食と取り込みを含む多層浅水方程式で土石流と波を解析", "title": "Numerical analysis of dynamics between debris flows and wave propagation using multi-layer shallow water equations", "url": "https://doi.org/10.5194/nhess-26-5957-2026", "authors": "Seungjun Lee ほか", "venue": "Natural hazards and earth system sciences", "date": "2026-11-20", "sjr": 1.418, "citescore": 8.2, "citescore_year": "2025", "apa": "Lee, S., An, H., Kim, M., & Kang, T. (2026). Numerical analysis of dynamics between debris flows and wave propagation using multi-layer shallow water equations. Natural Hazards and Earth System Sciences, 26(11), 5957–5978. https://doi.org/10.5194/nhess-26-5957-2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "上流で侵食・取り込みを経て貯水池に流れ込む土石流と、それが生む波を、侵食・取り込み・堆積を含む1次元の多層浅水方程式で解析するモデルを作った（抄録）。", "p3": "モデルを理論解析と室内実験で検証し、2020年の韓国の山陽貯水池の崩壊事例に適用して、土石流の性質と貯水位を変えたシナリオの計算を行った（抄録）。", "p5": "土石流の運動量が発生する波の規模と強く相関し、最大運動量が波の大きさの信頼できる予測因子になることを示した（抄録）。", "fun": "山で起きた土石流がダム湖に飛び込むと、大きな波が起きて堤防を越えることがある。これまでの計算は土砂がそのまま水に落ちる場面を扱うことが多かったが、実際の土石流は斜面を削り、土砂を取り込みながら大きくなる。この研究はその成長まで含めて計算し、土石流の勢い（運動量）で波の大きさを予測できると示した点が面白い。", "unverified": "本文は入手できず、室内実験の条件と、事例の再現の精度は確認できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "歩道付き箱桁の渦励振の多重ロックインをDMDで", "title": "Study on mechanisms of vortex-induced vibrations with multiple lock-in regions in a streamlined box girder with cantilevered sidewalks using dynamic mode decomposition method", "url": "https://doi.org/10.1016/j.engstruct.2026.124163", "authors": "Fan Li ほか", "venue": "Engineering Structures", "date": "2026-11-21", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Li, F., Liu, Z., Xie, G., Li, X., Tang, S., Peng, X., Yang, C., & Chen, Z. (2027). Study on mechanisms of vortex-induced vibrations with multiple lock-in regions in a streamlined box girder with cantilevered sidewalks using dynamic mode decomposition method. Engineering Structures, 372, 124163. https://doi.org/10.1016/j.engstruct.2026.124163", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、片持ちの歩道を持つ流線形の箱桁で、渦励振（風で生じる渦による振動）が複数の風速域でロックインする機構を、動的モード分解（DMD）で調べる研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋の桁に風が当たると後ろに渦が交互に生まれ、その周期が橋の揺れやすい周期と合うと大きく揺れる。題名によると、歩道を張り出した桁ではこの共振する風速の帯が複数現れるらしい。流れの複雑な模様をいくつかの基本の動きに分解して原因を探る手法を使う点が面白い。", "unverified": "抄録・本文とも入手できず、実験か数値計算か、結果の内容はすべて未確認。"}}, {"id": "jr22", "rank": 22, "headline": "二層トラス桁の振幅依存のフラッター微係数を同定", "title": "Post-flutter of double-deck truss girders in turbulent flow: Identification of amplitude-dependent flutter derivatives", "url": "https://doi.org/10.1016/j.engstruct.2026.124167", "authors": "Haohong Li ほか", "venue": "Engineering Structures", "date": "2026-11-21", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Li, H., Yang, Q., Huang, S., Guo, K., & Zhang, L. (2027). Post-flutter of double-deck truss girders in turbulent flow: Identification of amplitude-dependent flutter derivatives. Engineering Structures, 372, 124167. https://doi.org/10.1016/j.engstruct.2026.124167", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、乱流中の二層トラス桁のポストフラッター（限界を超えた後の空力振動）を対象に、振幅に依存するフラッター微係数を同定する研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "吊り橋が風で激しくねじれ始める現象をフラッターという。普通はその起こり始めの風速を調べるが、題名によると、この研究は起こり始めた後の揺れ方に注目し、揺れの大きさによって空気の力の性質が変わる様子を数字で取り出そうとしている。揺れの大きさで性質が変わるという非線形性が難しく面白い。", "unverified": "抄録・本文とも入手できず、風洞実験の条件、同定の方法、結果はすべて未確認。"}}, {"id": "jr23", "rank": 23, "headline": "債務超過より赤字が監査報酬を押し上げる", "title": "Negative Book Equity, Reported Losses and Audit Fees: Evidence from Russell 3000 Companies, 2001–2023", "url": "https://doi.org/10.3390/jrfm19110937", "authors": "Nicholas D. Belesis ほか", "venue": "Journal of risk and financial management", "date": "2026-11-20", "sjr": 0.506, "citescore": 5.5, "citescore_year": "2025", "apa": "Belesis, N. D., Kampouris, C. G., Vasilatos, A. M., Tsitsakis, C. A., & Delyannis, T. (2026). Negative Book Equity, Reported Losses and Audit Fees: Evidence from Russell 3000 Companies, 2001–2023. Journal of Risk and Financial Management, 19(11), 937. https://doi.org/10.3390/jrfm19110937", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由、候補の収集時に取得、途中で切れている）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "監査研究で財務困窮の印とされてきた債務超過について、ラッセル3000の非金融企業で監査報酬との関係を2001〜2023年で調べた（抄録）。", "p3": "債務超過と赤字の報告のそれぞれと両方の組み合わせについて監査報酬の上乗せを推定し、企業固定効果を入れた推定や、債務超過に入る年・出る年の前後の変化も調べた（抄録）。", "p5": "債務超過の企業年は約15%から36%に増え、多くは黒字だった。赤字だけで報酬は約18%高く、債務超過だけでは基準の推定で有意な上乗せがなく、両方の組み合わせは約6%にとどまった。この型は企業間の違いによるもので、企業固定効果を入れると残らなかった（抄録）。", "fun": "資産より借金が多い債務超過は、昔から会社の危険信号とされてきた。ところがこの研究では、米国の大企業で債務超過の会社の企業年は36%まで増え、その多くは黒字だった。監査法人も、債務超過そのものより赤字かどうかで報酬を上げていた。古い物差しがそのままでは通用しなくなっている点が面白い。", "unverified": "本文は入手できず、債務超過が増えた理由についての著者の説明は確認できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "振動下のPTFEボルト接合の締付け力低下の方向依存性", "title": "Directional dependence of preload attenuation in PTFE bolted joints under vibration", "url": "https://doi.org/10.1016/j.engfailanal.2026.111710", "authors": "Xiumin Zhang ほか", "venue": "Engineering Failure Analysis", "date": "2026-11-20", "sjr": 1.326, "citescore": 10.9, "citescore_year": "2025", "apa": "Zhang, X., Zhang, H., Xia, H., Liu, L., & Liu, J. (2026). Directional dependence of preload attenuation in PTFE bolted joints under vibration. Engineering Failure Analysis, 111710. https://doi.org/10.1016/j.engfailanal.2026.111710", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、振動を受けるPTFE（フッ素樹脂）のボルト接合部で、締付け力（予張力）の低下が加振の方向によってどう違うか（方向依存性）を調べた研究。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ボルトは振動を受け続けると少しずつ緩む。題名によると、この研究はどの向きに揺らすと緩みやすいかに注目している。樹脂のような柔らかい材料が関わると緩み方が変わることも考えられ、身近な家具のネジの緩みとも通じる問いだ（解釈）。", "unverified": "抄録・本文とも入手できず、実験の条件と結果はすべて未確認。"}}, {"id": "jr25", "rank": 25, "headline": "能動的な音響波でボルト接合部の腐食を監視", "title": "Corrosion monitoring of bolted connections using active acoustic waves", "url": "https://doi.org/10.1016/j.ultras.2026.108378", "authors": "Seyed Amir Hoseini Sabzevari ほか", "venue": "Ultrasonics", "date": "2026-11-20", "sjr": 1.087, "citescore": 8.3, "citescore_year": "2025", "apa": "Hoseini Sabzevari, S. A., & Vakili-Azghandi, M. (2026). Corrosion monitoring of bolted connections using active acoustic waves. Ultrasonics, 108378. https://doi.org/10.1016/j.ultras.2026.108378", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社の抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名によれば、能動的に送った音響波を使って、ボルト接合部の腐食を監視する研究。部材に波を送り込み、その伝わり方の変化から腐食を捉える方法と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "鉄骨の橋や建物では、ボルトでつないだ部分が錆びやすく、見えないところで傷みが進むことがある。題名から読み取れる問いは、部材に音の波を送り込み、その伝わり方の変化から腐食を見つけられるかだ。叩いた音で中身を確かめるスイカの打診に似た考え方といえる（比喩）。", "unverified": "抄録・本文とも入手できず、計測の方法と検出の精度はすべて未確認。"}}, {"id": "jr26", "rank": 26, "headline": "孤独は病理だけではない：急性の孤独の適応的な働き", "title": "In Defense of Loneliness: The Adaptive Functions of a Misunderstood State", "url": "https://doi.org/10.1177/17456916261487989", "authors": "Leonhard Schilbach", "venue": "Perspectives on Psychological Science", "date": "2026-11-20", "sjr": 4.859, "citescore": 27.4, "citescore_year": "2025", "apa": "Schilbach, L. (2026). In Defense of Loneliness: The Adaptive Functions of a Misunderstood State. Perspectives on Psychological Science. https://doi.org/10.1177/17456916261487989", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossrefに登録、候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "孤独を公衆衛生の脅威とみる見方に対し、急性の孤独が適応的な役割を持ちうることを、心理学の諸枠組みの証拠から論じた論考（抄録）。", "p3": "心理学的・関係的・臨床的な枠組みの関連する研究を簡潔に統合し、慢性の孤独と急性の孤独を区別して整理した（抄録）。", "p5": "慢性の孤独は特に社会的孤立と重なると社会的機能の低下や精神疾患のリスクと結びつくが、急性の孤独は社会的注意、親和の動機、対人的な同調への準備を高め、内省や社会的認知を促しうるとし、孤独はそれ自体が病理ではないと論じた（抄録）。", "fun": "孤独は体に悪い、とよく言われる。この論考は、長く続く孤独は確かに危険だが、一時的な孤独は誰かとつながりたいという気持ちを強め、人の気持ちに敏感にさせる働きがあると主張する。空腹が食べ物を探させるように、孤独が人を探させる合図になっているという見方が面白い（比喩）。", "unverified": "本文は入手できず、引用された実証研究の範囲と、急性と慢性を分ける基準
