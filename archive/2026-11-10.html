<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-10", "intro": "プレプリントの新着895件（一覧の候補272件）、学術誌の新着（上位10%誌1,356件・うち一覧の候補300件、その他の学術誌の関連候補323件・うち一覧の候補151件）、重要論文の候補267件（プレプリント212件・学術誌55件）、新着オープンデータ145件（一覧の候補120件）とe-Statの更新1件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目36報、オープンデータ30件です（論文誌・注目は候補の多くが化学・材料分野で、抄録のないものも多かったため、上位10%誌の新着で補い、基準を満たすものに絞りました）。上位10%誌の一覧の更新はHTTP 404で取得できず、9月27日に作った一覧を使いました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "回答履歴を3要素に構造化しLLMの個人予測が向上", "title": "Structuring Survey Histories for LLM Digital Twins: A Controlled Study of Background, Decision Procedure, and Evaluation Profiles", "url": "https://arxiv.org/abs/2611.08730", "authors": "Iris Ye ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Ye, I., Deng, T., & Candogan, O. (2026). Structuring Survey Histories for LLM Digital Twins: A Controlled Study of Background, Decision Procedure, and Evaluation Profiles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08730", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・実験設計・結果・考察の節と表1〜4）を読んだ", "preprint": true, "p1": "回答者の調査履歴を背景・意思決定手順・評価の3節（BDE）に整理してLLMに与えると、生の回答記録を与えるより個人の回答の予測がわずかに正確になり、その効果の大半は評価の節から来ることを示した（§4）。", "p2": "数百問の回答履歴をどう要約してLLMデジタルツインに渡すべきかは分かっておらず、要約しても精度が落ちないという報告と落ちるという報告が混在し、情報の量より構造が効いている可能性があった（§1）。", "p3": "抽出器が記録から、背景（属性・知識・信念）、意思決定手順（認知テストの誤りの型など）、評価（予算・リスクと時間の選好・支払意思額など）の3節を書き、固定したシミュレータ（gpt-5.4-nano／mini）が保留した問いに本人として答える。抽出の推論の深さ（V1〜V3）と節の組合せを変えて、効果の出どころを切り分けた（§2〜3）。", "p4": "Twin-2K-500の100人について、17課題の保留した問い（120項目：認知バイアス80、価格40）の正答率を、生の記録や同じ長さの自由形式の要約と、同じ回答者どうしの対応のある比較で評価し、回答者を単位とする対ブートストラップ（1万回）で95%区間を求めた（§3）。", "p5": "V3のBDEは生の記録より全体で1.27pp（nano、p<0.01）、1.19pp（mini、p<0.001）高かった（表1）。長さをそろえた自由形式より価格の項目で2.15pp・1.38pp高く（表2）、推論の深さの違いはどれも有意でなかった（表3）。背景に評価の節を加えると全体が1.19pp・1.46pp上がったが、意思決定手順の節の追加は全体では有意でなかった（表4）。", "p6": "著者は、1つのパネル・1つのベンチマーク・同系統の2モデルに限られること、自由形式との比較では内容と構成が同時に変わること、評価の節の効果が情報量の追加と区別できないこと、課題単位の平均ではminiの全体の差しか有意に残らないことを挙げる（§5）。解釈：差は1〜2pp程度と小さい。", "fun": "ある人の過去の回答をAIに読ませて、その人が次にどう答えるかを当てさせる研究です。長い回答記録を全部渡すより、「どんな人か」「どう考えるか」「何を大事にするか」の3つに整理して渡す方が、少しですが当たりやすくなりました。しかも効いていたのは「何を大事にするか」の部分でした。人を理解するには価値観が決め手になるらしいという点が面白いところです。", "unverified": "付録D（課題単位の平均）の表と付録の抽出プロンプトの全文は読んでおらず、§5の要約の範囲でのみ確認した。"}}, {"id": "pr02", "rank": 2, "headline": "LLM社会シミュレーションの再現に要る記述規約", "title": "ODD+LLM: Specifying LLM-Agent Behavior for Reproducible Social Simulation", "url": "https://arxiv.org/abs/2611.08932", "authors": "Justin Downes ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Downes, J., Milletich, R., & Hirst, N. (2026). ODD+LLM: Specifying LLM-Agent Behavior for Reproducible Social Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08932", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（プロトコル・多元宇宙分析・再構成の十分性の評価・考察の節と表2〜3）を読んだ", "preprint": true, "p1": "LLMエージェントによる社会シミュレーションの記述標準ODDに、プロンプトの組立て・記憶の直列化・出力の解析・再試行など振る舞いを決める要素を書く5つのブロックを加えたODD+LLMを提案し、記述の見落としが結果を左右しうることを示した（抄録、§3〜5）。", "p2": "エージェントベースモデルの記述の事実上の標準であるODDには、LLMエージェントの振る舞いを決める部品を書く語彙がなく、論文を読んだだけでは再実装に必要な選択が分からない（§1、§3）。", "p3": "CoALAの認知アーキテクチャの分類にもとづき、A：認知アーキテクチャ、B：同一性、C：推論の設定（モデルの役割ごと）、D：振る舞いのサブモデル（LLMの呼出し箇所ごとの描画と出力の解決）、E：妥当性確認の5ブロックを加えた。例として、公刊された命名ゲーム（24体が2文字から名前を選び、一致で+100、不一致で−50）を再実装し、再実装者が決める6つの選択を1つずつ変えた（§3〜4）。", "p4": "第1段階では記憶状態を合成してモデルに直接尋ね（16,800回）個体の偏りを測り、第2段階では条件ごとに20シードの全体シミュレーション（約32,000回）で、合意がMになる割合P(M)をウィルソンの95%区間とともに比べた。さらに2023〜2026年の28本のLLMエージェント・シミュレーションを、再構成の十分性の尺度（0・1・2点）で符号化した（§4〜5）。", "p5": "論文の記述の範囲内の6つの読み方ではP(M)が0.30〜0.55で、基準（0.350）と雑音の範囲内だった。論文が述べる「外部の観察者として予測する」指示を一人称に変えると、20シードすべてでMに収束し（P(M)=1.000）、収束も3倍速かった（表3、図1〜2）。28本では、呼出し箇所の描画と解決の項目の77%（236/306）が完全には定まらず、主な呼出しを完全に記述した論文はなかった（§5）。", "p6": "著者は、多元宇宙分析が1事例・各20シード・1モデル（Claude Sonnet 4.6）で原論文と異なる復号設定を使い、交互作用を調べていないこと、尺度は単一の符号化者で信頼性を推定していないこと、ODD+LLMが再構成を改善するかは未検証であることを挙げる（§6）。一人称の条件は明記された指示を外した感度の確認で、原研究の誤りを示すものではないとも述べている（§4）。", "fun": "AIのエージェントを何十体も動かして、社会のルールが生まれる様子を調べる研究が増えています。ところが、AIに「あなたはプレイヤーです」と言うか「あなたは外から予測する観察者です」と言うかだけで、結果がまるで変わってしまいました。論文に書いてあったその一文を見落とすと再現できないのです。実験の「レシピ」をどこまで細かく書くべきかを問う点が面白いところです。", "unverified": "付録の論文別の採点表（表5、付録A〜B）の個別の値は読んでいない。"}}, {"id": "pr03", "rank": 3, "headline": "LLM集団は曖昧な合図で見かけの合意に流される", "title": "Phantom Consensus: Measuring Social Reasoning in Multi-Agent LLM Decision-Making", "url": "https://arxiv.org/abs/2611.08971", "authors": "Disha Sheshanarayana ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Sheshanarayana, D., Pal, R. S., Sinha, M., & Dasgupta, T. (2026). Phantom Consensus: Measuring Social Reasoning in Multi-Agent LLM Decision-Making (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08971", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ベンチマークの構成・実験設定・結果と考察・結論の節と表・図のキャプション）を読んだ", "preprint": true, "p1": "複数のLLMが曖昧な公開の合図を見ると、正しかった私的判断から離れて誤った集団決定に流れ、他者の私的判断についても誤った推測を報告する「幻の合意」を測るベンチマークPHANTOM-Benchを作り、9つのモデルで確かめた（§3、§5）。", "p2": "複数のLLMの判断を集約する仕組みが増えたが、明示的な多数決への同調とは別に、曖昧な合図から想像した「みんなの本音」に流される多元的無知型の失敗は測られてこなかった（§1）。", "p3": "金融・コンテンツ管理・採用・医療のプライバシー・職場の安全の5領域の480場面（進める・止める・保留の3択で、正解と「幻の目標」つき）で、4体の独立したエージェントに、私的判断の後、曖昧な公開コメントを見ての公的決定と他者の私的判断の推測を答えさせた。対照に中立なコメント・明示的な投票・他者の私的判断の開示の条件を置いた（§3〜4）。", "p4": "私的と公的の正答率の差（PPG）、私的には多数が正しいのに公的に誤る集団合理性の失敗率（CRFR）、推測した集団の信念の誤り（PBE）、開示による回復率（TRR）などで評価した。正解と幻の目標の注釈は2人の評価者でκ=0.83だった（§3.3、§4.3）。", "p5": "すべてのモデルで公的な正答率が下がり、Qwen-2.5-7Bは77.0%から29.2%（PPG 47.8pt）、CRFRは47.3%に達した（表1）。Gemini-2.5-Proでも幻の目標への同調は中立コメントの6.5%に対し19.4%だった（表2）。他者の私的判断を開示すると、Qwen-2.5-7Bは29.2%から77.1%に回復した（TRR 99.6%、§5.1）。", "p6": "著者は、対照条件ではコメントの内容や信念の聞き方も違うため仕組みを因果的に特定できないこと、開示は他者の判断という有用な情報も与えるため信念の修正だけで回復を説明できないこと、集計の指標では信念の誤りが行動を変えたとは言えないことを挙げる（§5）。解釈：場面はLLMの支援で作った合成のもので、実際の会議への一般化は未確認。", "fun": "会議で「みんな反対っぽいな」と感じて、本当は賛成なのに反対に手を挙げてしまうことがあります。全員が同じ思い違いをすると、誰も望まない結論になります。AIのチームでも同じことが起き、正しく判断できていたのに曖昧な発言に流されて誤りました。それぞれの本当の判断を見せ合うと多くが元に戻ったという点が面白いところです。", "unverified": "付録の評価指標の定義の詳細と、領域別の結果は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "同じ苦情でも書き方でLLMの救済判断が変わる", "title": "Same Facts, Different Remedy: Linguistic Profiling and Arbitrariness in LLM and System One Decisions", "url": "https://arxiv.org/abs/2611.08995", "authors": "Colin Priest", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Priest, C. (2026). Same Facts, Different Remedy: Linguistic Profiling and Arbitrariness in LLM and System One Decisions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08995", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法・結果・限界の節と図1の説明）を読んだ", "preprint": true, "p1": "消費者金融の苦情への救済の判断をLLMなどに任せると、書き手の年齢・学歴・社会経済的地位を思わせる文体によって、集団としてはわずかに、個々の苦情ではより大きく判断が揺れることを、事前登録した保留データで示した（§4）。", "p2": "苦情の書き方は年齢・学歴・社会経済的地位で異なるが、単一のラベルを返す監査では、集団間の系統的な格差と、同じ苦情でも言い回しで判断が変わる個人レベルの恣意性が区別されてこなかった（§1、§5.1）。", "p3": "米国CFPBの苦情を、事実を保つ指示のもと、年齢・地域・学歴・社会経済的地位を組み合わせた36の文体に2つのモデルで書き換え、救済（0：対応なし、1：金銭以外、2：金銭）を、単一ラベルを返すGPT-4o-mini・GPT-5-miniと、選択肢の確率分布を返す「System One」モデルJevに判定させた（§3.1〜3.2）。", "p4": "探索用の2,000件（144,000文体）で分析した後、事前に固定した保留の1,000件（72,000文体）で確認分析を1回だけ行った。指標は文体による系統的な格差、同じ苦情の2つの文体で金銭判断が異なる確率（個人の不安定さ）、事実を強めた・弱めた編集への反応（陽性対照）など（§3.2〜3.6）。", "p5": "高齢・大卒・高い社会経済的地位の文体ほどわずかに手厚い救済を受けたが、保留データでは金銭救済の率の差はすべて±0.5pt以内だった（§4.2）。一方、同じ苦情の2つの文体で金銭の判断が分かれる確率はGPT-4o-miniで3.8%、GPT-5-miniで6.3%、Jevで2.6〜3.3%だった（図1b）。Jevでは両方の書換えに共通する文体の効果は苦情内の分散の約1.6%で、約47%は書き換えたモデルの違いによった（§4.1）。格差は主に語彙や丁寧さなどの話し方と関連した（§4.5）。", "p6": "著者は、正解がないため精度ではなく感度・格差・恣意性を扱うこと、文体はLLMが生成した合成のもので実際の書き手とは異なりうること、方言・人種・性別などは扱っていないこと、事実を保つはずの書換えに監査で3.3%と11.7%の重要な変更が見つかったこと、重要性の基準などは確認結果を見た後に決めた事後のものであることを挙げる（§6）。", "fun": "同じ内容の苦情でも、若者風に書くか年配者風に書くか、くだけた文か丁寧な文かで、AIが決める補償が変わることがありました。集団の平均で見れば差はごくわずかでしたが、一つひとつの苦情では、書き方を変えるだけで「お金で補償する」かどうかが入れ替わることが数%ありました。平均の公平さと、一人ひとりにとっての公平さは別物だという点が面白いところです。", "unverified": "§4.3〜4.4と§4.7〜4.8（確率出力の利点、緩和策の詳しい数値、モデルの変化）と付録は読んでいない。"}}, {"id": "pr05", "rank": 5, "headline": "非液状化の表層の性質が下層の液状化を左右", "title": "Crust Effects on Liquefaction Response: Insights from Centrifuge Tests", "url": "https://doi.org/10.31224/8766", "authors": "Nikolaos Ntritsos", "venue": "engrXiv", "date": "2026-11-09", "apa": "Ntritsos, N. (2026). Crust Effects on Liquefaction Response: Insights from Centrifuge Tests. https://doi.org/10.31224/8766", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "engrXivの論文のCrossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "非液状化の表層（クラスト）の透水性・剛性・繰返し強度・侵食されやすさが、下にある層状の液状化地盤の応答と被害を大きく左右することを、地震の遠心模型実験で示した（抄録）。", "p2": "液状化の被害の評価では表層の厚さが重視されてきたが、表層の水理的・力学的な性質が液状化の進み方と地表の被害にどう効くかは十分に分かっていない（抄録の結論から読み取れる問題設定）。", "p3": "鉛直に連続する2つの液状化しうる地盤に、密な粗砂、軽く過圧密したシルト、強く過圧密した粘土の3種類の表層を載せた模型を作り、遠心模型実験で地震動を与えて、過剰間隙水圧・上向きの浸透・沈下・噴砂を比べた（抄録）。解釈：下から上がってくる水を表層が逃がすか溜めるかで、液状化の続き方が変わるという見方。", "p4": "比較の対象は表層の種類の違いで、過剰間隙水圧の発達と消散、重要な液状化層の液状化の程度と継続、地表の沈下と噴砂、表層の健全性を評価した（抄録）。模型の寸法・遠心加速度・計測の配置は未確認（本文を入手できず）。", "p5": "どの模型でも液状化層全体に高い過剰間隙水圧が生じ、上向きの流れが続いた。砂の表層では揺れの間に排水が進んで下の重要な層の液状化が軽くなる一方、早期の沈下が生じた。シルトと粘土の表層は水を溜めて液状化を長引かせたが、シルトは繰返し載荷と浸透で壊れて大きな沈下と噴砂を生じ、粘土は剛性と構造を保って地表の動きを下の砂の沈降から部分的に切り離した（抄録）。", "p6": "抄録には著者の挙げる限界の記述がない。解釈：模型実験の相似則の影響、表層の厚さや入力地震動を変えた場合の一般性、数値解析との比較は抄録からは分からない。", "fun": "地震で地面が液体のようになる液状化は、地下の砂層の水の圧力が高まって起こります。この実験では、上にかぶさる土の層が水を通しやすい砂か、通しにくいシルトや粘土かで結果が大きく変わりました。水を溜めつつ壊れやすいシルトでは噴砂と大きな沈下が起き、粘土はふたのように地表を守りました。「ふた」の性質が大事だという点が面白いところです。", "unverified": "本文を入手できず、模型の寸法・遠心加速度・入力地震動と、過剰間隙水圧や沈下量の数値は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "選んだ少数モードと非線形復元で連成解析を縮約", "title": "SparseModesNet for coupled thermal-hydraulic-mechanical system in heterogeneous porous media", "url": "https://arxiv.org/abs/2611.09616", "authors": "Kapil Chawla ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Chawla, K., Koike, T., Lee, S., & Bessac, J. (2026). SparseModesNet for coupled thermal-hydraulic-mechanical system in heterogeneous porous media (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09616", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法の節、3つの数値実験の結果、時間補間、結論と表1・3・5・6）を読んだ", "preprint": true, "p1": "地熱系の熱・水・力学（THM）連成の解を、多数のPODモードの候補から復元に役立つ少数を選び、ニューラルネットの非線形デコーダで補うSparseModesNetで表すと、同じ次元のPODより桁違いに小さい誤差で変位・圧力・温度の場を復元できることを示した（抄録、§5）。", "p2": "不均質な透水性・熱伝導率や亀裂網を含むTHM連成の細かいメッシュ・多時間ステップの計算は重く、次元縮約に使うPOD（固有直交分解）は線形の復元のため多くのモードを要する（§1、抄録）。", "p3": "スナップショット行列の特異値分解からs個の候補モードを作り、学習可能な選択ベクトルωで各モードの座標を重み付け（0なら不使用）し、線形のPOD項とニューラルネットの非線形補正の和で状態を復元する（式8）。エネルギーの大きい順ではなく復元誤差を減らすモードを選び、選んだr個を固定してデコーダを学習し直す（式15〜16）。例：実験1ではs=60の候補から15個が選ばれ、16番など高次のモードも含まれた（§3、§4.1.3）。", "p4": "2次元の不均質媒質、2次元の連結した亀裂網、Utah FORGEの亀裂形状にもとづく3次元問題の3つで、同じ縮約次元のPODと、全状態と各成分（変位・圧力・温度）の相対復元誤差、地熱の関心量を比べた。学習に使わない時刻の復元（8割で学習、2割で試験）も調べた（§4）。", "p5": "全状態の相対誤差は、実験1（r=15）でPODの5.8200×10⁻²に対し8.2513×10⁻⁵（表1）、実験2（r=10）で1.3670×10⁻²に対し1.0597×10⁻⁸（表5）、実験3（r=10）で4.9372×10⁻⁴に対し1.0712×10⁻¹¹だった（表6）。学習に使わない時刻でも、PODの3.4261×10⁻²に対し1.0625×10⁻⁴だった（表3）。", "p6": "著者は、外挿や標本外の縮約には追加のパラメータ化が必要かもしれないという予備的な結果を述べる（§5）。解釈：示されたのは既知の解の圧縮と復元の精度で、縮約モデルとして時間発展を予測する性能は評価されていない。", "fun": "地下の熱と水と岩の動きを一緒に計算するシミュレーションは、とても重くなります。そこで、たくさんの「基本の形（モード）」の組合せで結果を表して軽くする方法がありますが、大きい順に選ぶとたくさん必要でした。この研究は、本当に役立つ形を選び直し、足りない部分をAIで補うことで、ずっと少ない数で何桁も正確に再現しました。「大きいものから選ぶ」という常識を疑った点が面白いところです。", "unverified": "地熱の関心量（圧力・温度に基づく指標）の個別の誤差の数値と、2次元問題の設定の詳細は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "投信の取締役会の会計専門性が評価の偏りを抑制", "title": "Mutual Fund Board Governance and Financial Reporting Quality", "url": "https://doi.org/10.2139/ssrn.7681604", "authors": "Johnny Yeo Sang Yoon", "venue": "SSRN", "date": "2026-11-09", "apa": "Yoon, J. Y. S. (2026). Mutual Fund Board Governance and Financial Reporting Quality. https://doi.org/10.2139/ssrn.7681604", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "投資信託の取締役会の能力と監視の動機が、保有する債券の公正価値の見積りの偏り（評価の偏り）を減らし、投信の財務報告の質を高めることを示した（抄録）。", "p2": "古典的な理論（Fama and Jensen, 1983）では、投資家が資金を引き揚げて運用者を規律づけられるため投信の取締役会の役割は小さいとされてきたが、業界のエージェンシー問題、ポートフォリオの複雑化、近年の規制の動きがこの見方に疑問を投げかけている（抄録）。", "p3": "機械学習で取締役のスキルを特定し、取締役会全体の専門性（とくに会計）と、債券の銘柄ごとの公正価値の見積りの偏りの関係を分析した。監視の動機の変化として、取締役会の独立性の横断的な違いと、SECの規則2a-5（公正価値の評価に関する規則）の採用をショックとして使った（抄録）。", "p4": "評価の対象は債券の銘柄レベルの公正価値の見積りの偏りで、取締役会の専門性と監視の動機の違いによる差を比べた（抄録）。データの期間・標本の規模・偏りの具体的な定義は未確認（本文を入手できず）。", "p5": "取締役会の集合的な専門性、とくに会計の専門性が評価の偏りを和らげることを見いだした。取締役会の独立性の違いと規則2a-5の採用の分析からは、監視の動機が強いほど評価の偏りが小さくなることと整合する証拠を得た（抄録）。", "p6": "抄録には限界の記述がない。解釈：機械学習による取締役のスキルの識別の妥当性と、規則の採用と同時期の他の変化をどう除いたかは抄録からは分からない。", "fun": "投資信託が持つ債券の中には、市場で毎日値段がつかないものがあり、その「時価」は見積りで決めます。見積りが甘いと、投資家は実際より良い成績を見せられてしまいます。この研究は、会計に詳しい取締役がいる投信ほど見積りの偏りが小さいことを、取締役の経歴を機械学習で分析して示しました。見張り役の質が数字の正しさを左右する点が面白いところです。", "unverified": "本文を入手できず、データの期間と標本の規模、評価の偏りの測り方、効果の大きさの数値は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "LLMペルソナの広告予測は簡素な属性記述が高精度", "title": "What Matters for LLM Persona Simulation: Signal Form in Cold-Start E-Commerce Advertising", "url": "https://arxiv.org/abs/2611.08840", "authors": "Jiwoo Choi ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Choi, J., Lee, I. I., Seo, W. S., Lee, M., & Choi, Y. Y. (2026). What Matters for LLM Persona Simulation: Signal Form in Cold-Start E-Commerce Advertising (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08840", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定・手法・実験設定・結果の節と表2〜5、限界）を読んだ", "preprint": true, "p1": "広告の配信前で過去のログがない状況で、LLMに属性別のペルソナとして広告をクリックするかを繰り返し判断させてクリック数を推定する方法で、プロンプトの「信号の形」が精度を大きく左右することを、実際のGoogle広告のデータで示した（§1、§6）。", "p2": "新規の広告のクリック率（CTR）は履歴がないため従来の教師あり学習では予測しにくく、LLMによるペルソナ・シミュレーションが代わりになりうるが、どの設計上の選択が質を決めるかは分かっていなかった（§1、§3）。", "p3": "層ごとにペルソナを作り、広告の画像と説明を見せてgpt-5-nanoにクリックするかを2値で答えさせ、その割合をCTRとし、計画済みの表示回数を掛けてクリック数を出す。比べた要素は、ペルソナの細かさ（基本の属性のみか、日時・性格・職業を加えるか）、文脈の信号（「多くの人は広告を無視する」という指示に、「若い人ほど広告を無視する傾向が強い」という相対的な手がかりを加えるか、CTRの数値の目安を加えるか）、言い回しの3つ（§4）。", "p4": "ゼリー商品のGoogleディスプレイ広告の5層・7日間（表示974,423回、クリック3,578回）の35の層・日をMAE・MAPE・RMSEで評価し、固定のCTRを掛ける方法、年齢の傾向にもとづく規則、CTRの目安を与えたLLMの構成などと比べた（§5）。", "p5": "最小限の属性・相対的な手がかり・柔らかい言い回しの組合せが全指標で最小の誤差となり、MAE 24.9±1.9、MAPE 26.1%±0.9で、最良の非LLM（固定CTR 0.2%、MAE 51.1）より51.3%、CTRの目安を与えた構成（MAE 109.9）より77.3%低かった（表3）。「広告を無視する」指示を外すと、実際の3,578回に対し約91万〜95万回と大きく過大に予測した（表4）。属性を増やすとMAEは24.9から37.7に悪化した（表5）。", "p6": "著者は、1つのキャンペーン・5つの層・同じ7日間のデータで構成を比べたため、キャンペーン外の性能ではなく相対的な比較として読むべきこと、言い回しでMAEが8〜30%変わること、CTRが最も高い層で過小推定が残ることを挙げる（§7.3）。解釈：構成の選択と評価に同じデータを使っており、選択への過適合の可能性がある。", "fun": "新しい広告がどれくらいクリックされるかを、出す前にAIに「この年代の人ならクリックする？」と何十万回も聞いて予測する研究です。意外にも、性格や職業まで細かく設定するより年代や性別だけの簡単な設定の方が当たり、「クリック率は0.5%」と数字で教えるより「若い人ほど広告を無視しがち」と傾向で教える方がずっと正確でした。AIには数字より傾向の伝え方が効くという点が面白いところです。", "unverified": "§6.4〜6.5（ペルソナ別の較正、CTRの事前分布への感度）の数値は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "10-Kから知識グラフを作るプロンプトを局所的に進化", "title": "FinEvolveKG: Controlled and Attributable Prompt Evolution for Financial Knowledge Graph Construction", "url": "https://arxiv.org/abs/2611.08643", "authors": "Abhinav Arun ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Arun, A., Bhattacharyya, J., Dimino, F., Sarmah, B., & Pasquali, S. (2026). FinEvolveKG: Controlled and Attributable Prompt Evolution for Financial Knowledge Graph Construction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08643", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定・手法・実験設定・結果の節と専門家による監査、限界）を読んだ", "preprint": true, "p1": "10-Kから知識グラフを作るLLMのプロンプトを共通規則のブロックと目的別（ペルソナ）の方針のブロックに分け、反省的なプロンプト最適化（GEPA）が方針のブロックだけを書き換えるよう機械的に制限すると、変更の追跡性を保ったまま抽出の質も上がることを示した（抄録、§4、§6）。", "p2": "目的の異なる用途に共通の10-Kから知識グラフを作るとき、手書きのペルソナ別プロンプトや微調整は費用がかかり、プロンプト全体を自由に最適化すると共通の規則まで書き換わって変更の確認が難しくなる（§1、抄録）。", "p3": "抽出器（gemma-4-31B-it）が文書の断片から、型と開始・終了時点を持つ時間付きの知識グラフを出す。まず共通ブロックを一般的な正解グラフで最適化して凍結し（v2）、次にペルソナごとに方針ブロックだけをGEPAで進化させる（v4）。目的関数は、一般的な質（型の正確さ・根拠の支持・重複除去など）とペルソナにとっての有用性（関連する事実・グラフの型・多段の接続）の平均（式2）。", "p4": "S&P 100の情報技術20社の2024年の10-KからClaude Sonnet-4-6で参照グラフを作り、企業単位で学習8・検証4・評価8社に分けた。凍結プロンプト（v1）、全体を自由に最適化（v5）など5つの範囲を、3つのシード、別セクターや2025年の書類による分布外の条件、2人の専門家の盲検評価で比べた（§5）。", "p5": "3シードの平均で、v4はv1をブレンド得点で19.4〜30.9%、v5を2.2〜6.4%上回った（§6.1）。v4は対になる9つの比較すべてでv5を上回り、シード間の標準偏差も最小だった（§6.2）。分布外の15の比較すべてでv4がv5を上回り（§6.4）、出力が大きく異なる事例を集めた盲検評価では、専門家は70.1%でv4をv5より好んだ（κ=0.78、§5）。", "p6": "著者は、シードの変動が共通ブロックを固定した3つに限られること、分布外の評価が1つの成果物と限られたセクター・年であること、参照グラフの妥当性は1人の専門家の確認であること、有用性をグラフの要素で代理しており下流の意思決定では測っていないこと、境界は編集の位置を保証するだけで性能への因果的な効果は示さないことを挙げる（§8）。", "fun": "AIに決算書を読ませて、会社・製品・取引先などのつながりを図（知識グラフ）にする研究です。使う人によって欲しい図は違いますが、AIに指示文を自動で改良させると、大事な共通ルールまで書き換えてしまう心配がありました。そこで指示文を「共通のルール」と「用途別の方針」に分け、改良は方針だけに限りました。手を加えてよい場所を決めた方が、かえって成績も良くなった点が面白いところです。", "unverified": "表4の各スコアの値と、§6.5の定性的なプロンプトの分析は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "住宅価格の分布の変化をジャンプ拡散で記述", "title": "A Jump-Diffusion Model of Home Price Dynamics and Neighborhood Change", "url": "https://arxiv.org/abs/2611.08956", "authors": "Ashley Peake ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Peake, A., Gilbert-Diamond, A., & Hosoi, A. E. (2026). A Jump-Diffusion Model of Home Price Dynamics and Neighborhood Change (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08956", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデルの導出・ボストンの事例分析・考察の節と図2・8・12の説明）を読んだ", "preprint": true, "p1": "個々の住宅の価格をジャンプ拡散過程で表し、平均場極限で地区の価格分布の時間発展を表すフォッカー・プランク型の偏積分微分方程式を導き、地区間の差をワッサースタイン距離で測る枠組みを示して、ボストンの課税評価データで確かめた（§3、§5）。", "p2": "地区の住宅価格の変化には、地区全体の値上がりと、建替えや災害などによる個別の大きな変化（ジャンプ）が混ざっており、両者を分けて地区と都市全体の不均一さの変化を捉える方法が必要だった（§1〜2）。", "p3": "地区の住宅の対数価格を、地区共通の対数上昇率r、個別のばらつきσ、頻度λ・平均m・ばらつきsのジャンプからなる確率微分方程式で表す（式2）。住宅数を無限大とする平均場極限で、平均価格の常微分方程式（式7）と、対数価格の密度ρの移流・拡散の項にジャンプによる畳込みの項λ(ρ*g)−λρを加えた方程式（式9）を導き、地区間の価格分布の違いはワッサースタイン2距離で測る（式10）。例：古い一戸建てが集合住宅に建て替えられ評価額が2倍になるのが1回のジャンプ（図2）。", "p4": "ボストン市の住宅の課税評価額（全面再評価の2004・2007・2010・2013・2016・2021・2025年）を使い、16地区（1地区あたり平均約7,758区画）ごとに各期の対数変化の分布からパラメータを推定し、モデルが再現する平均価格と実測の平均を、ブートストラップの標準誤差つきのカイ二乗適合度検定で比べた（§5.1〜5.3）。", "p5": "多重比較を調整したカイ二乗検定で、16地区すべてでモデルの平均価格と実測値に有意な差はなかった（§5.3、図8）。地区間のW2距離の分布は期間で変わり、前期の平均価格と上昇率・ジャンプのパラメータの相関がともに負なら地区差が縮み、ともに正なら広がった（図12）。著者はこれを2007〜2010年の金融危機やコロナ禍などの出来事と対応づけている（§5.6）。", "p6": "著者は、パラメータを価格変化から直接推定しているため将来の予測はできず、経済条件がパラメータにどう効くかの分析が必要なこと、観察研究であり因果の主張はしないことを述べる（§5.6、§6）。解釈：課税評価額を価格の代理にしており、評価方法の違いが結果に与える影響は確かめられていない。", "fun": "街の家の値段は、街全体の値上がりと、建て替えや災害による一軒ごとの急な変化の両方で動きます。この研究は、一軒一軒の値段を「少しずつの揺らぎ」と「時々の大ジャンプ」で表し、たくさんの家を集めた「値段の分布」がどう広がり、ずれていくかを方程式で描きました。ボストンの20年分の記録で、地区の差が縮んだり広がったりする様子が実際の出来事と重なる点が面白いところです。", "unverified": "§4の解析解の導出の詳細と、§5.4〜5.5の地区別のパラメータの値は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "貸借対照表の無形資産は生産性をほぼ説明しない", "title": "Does Intangible Capital Show Up in Productivity?", "url": "https://econpapers.repec.org/RePEc:rif:wpaper:152", "authors": "Koski ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "EconPapers（RePEc）の掲載ページの抄録を使用（本文は入手できず）", "preprint": true, "p1": "欧州5か国の企業データで、財務諸表にもとづく無形資本の指標と生産性の関係を調べ、企業間ではわずかに正の関連があるが、同じ企業の時間的な変化では（フランスを除き）関連がほぼ消えることを示した（抄録）。", "p2": "無形資産への投資は生産性の向上の鍵とされるが、会計上の無形資本の計上は、無形資産をいつ資産に計上できるかを定める会計の慣行に左右され、それが生産性との関係について何を示すかは明らかでない（抄録）。", "p3": "5か国の企業レベルのデータで、貸借対照表の無形資本と生産性の関連を、企業間の比較（横断）と、同じ企業の時間的な変化の比較（企業内）の両方で推定した（抄録）。解釈：企業内の比較は、企業ごとの固定的な違いを除いた関係を見るための設計。", "p4": "評価は、無形資本と生産性の関連の大きさと、それが企業間と企業内で一致するかどうか、国による違い（抄録）。対象国・期間・生産性の測り方・推定式の具体的な内容は未確認（本文を入手できず）。", "p5": "フランス以外では、この指標でほとんどの企業の無形資本がゼロだった。企業間ではわずかな正の関連が見られたが、企業内の変化では関連がほぼ消え（フランスを除く）、観察された関連だけでは無形資本への追加の投資が生産性をどう変えるかは分からないと結論した（抄録）。", "p6": "著者は、企業は研究開発・ソフトウェア・ブランド・データなどの無形投資の多くを社内で行い、その費用は通常は費用として処理されるため、貸借対照表の無形資産は企業の無形資本の一部しか表さないと指摘し、行政の登録データで作られた社内生産の無形資本の指標で補うべきだとする（抄録）。", "fun": "アイデアやソフトウェア、ブランドといった目に見えない資産は、会社の生産性を高めると考えられています。ところが帳簿を見ると、フランス以外ではほとんどの会社の無形資産がゼロでした。社内で作ったソフトや研究の費用は、資産ではなく経費として処理されるからです。「帳簿に載らない財産」をどう測るかという問題が浮かび上がる点が面白いところです。", "unverified": "本文を入手できず、対象の5か国と期間、生産性の指標、関連の大きさの数値は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "孤独や交際状況と感情的分極化の関連を検証", "title": "Divided Politics, Divided Lives? Affective Polarization, Gender, and Loneliness in Finland", "url": "https://doi.org/10.31234/osf.io/u97pa", "authors": "Patrick Jern ほか", "venue": "PsyArXiv", "date": "2026-11-08", "apa": "Jern, P., Virtanen, R., Lagerström, M., Weckman, A., Strandberg, K., & Pedersen, I. E. M. (2026). Divided Politics, Divided Lives? Affective Polarization, Gender, and Loneliness in Finland. https://doi.org/10.31234/osf.io/u97pa", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "OSFのPDFの本文（方法・結果・考察の限界の節と表1）を読んだ", "preprint": true, "p1": "フィンランドの成人7,357人の調査で、男性は伝統・権威・民族主義（TAN）側、女性は緑・代替・自由主義（GAL）側に感情的に分極しやすく、若いほど分極しやすく、交際の有無は関連せず、孤独はGAL側の分極とだけ関連することを示した（抄録、結果）。", "p2": "感情的分極化（自陣営への好感と相手陣営への反感）が多くの国で強まると同時に独身と孤独も増え、若い男女の政治的な隔たりが恋愛関係の形成に影響するのではないかという問いがあるが、多党制の北欧での検証は少ない（抄録、序論）。", "p3": "人口登録から抽出した双生児とその家族への郵送の依頼によるオンライン調査（2021〜2022年）から、家族ごとに1人を選んだ7,357人を分析した。政党への温かさ（1〜11点に変換）で、左派同盟・緑の党を非常に好み真のフィン人党・キリスト教民主党を非常に嫌う人をGAL分極、その逆をTAN分極とし、孤独はUCLAの3項目尺度（α=0.738）で測った（方法、p.13〜15）。", "p4": "非分極を基準に、性別・年齢・交際状況・孤独を説明変数とする多項ロジスティック回帰で、GAL分極とTAN分極のそれぞれへのなりやすさを推定した（方法、p.15）。", "p5": "GAL分極は431人、TAN分極は173人だった。男性はGAL分極のオッズが0.51倍、TAN分極が2.44倍（95%CI 1.77〜3.35）だった。年齢が高いほど両方の分極が少なく、交際状況は30歳未満に限っても関連しなかった。孤独はGAL分極とだけ関連し（Exp(B)=1.08、95%CI 1.01〜1.16）、モデルの説明力はNagelkerke R²=0.057と小さかった（結果、p.16〜18）。", "p6": "著者は、女性が64.8%と多く、TAN分極の男性が少ないなど標本の偏りがありうること、政党への感情が支持者への敵意にどこまでつながるかは調べていないこと、ある時点の交際状況は恋愛経験の限られた指標であることを挙げる（p.24〜25）。解釈：横断調査のため、孤独と分極の因果の向きは分からない。", "fun": "政治の好き嫌いが強くなると恋人ができにくくなるのでは——そんな疑問を、フィンランドの7千人以上の調査で確かめました。男性は保守・民族主義の側に、女性は環境・リベラルの側に強く偏りやすいことは確認されましたが、恋人がいるかどうかとは関係がありませんでした。一方、リベラルの側に強く偏った人ほど孤独を感じていたという、予想と違う結果が面白いところです。", "unverified": "考察の前半（先行研究との比較）は読んでおらず、TAN分極の年齢のオッズ比の値は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "上司に優遇される自覚が知識の隠蔽を招く経路", "title": "Favorable Leader-Member Exchange Social Comparison and Knowledge Hiding: Psychological Entitlement and Perceived Competitive Climate", "url": "https://doi.org/10.20944/preprints202611.0704.v1", "authors": "Rui Zhang ほか", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Zhang, R., Wang, C., & Hong, J. (2026). Favorable Leader-Member Exchange Social Comparison and Knowledge Hiding: Psychological Entitlement and Perceived Competitive Climate. https://doi.org/10.20944/preprints202611.0704.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの論文のCrossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "上司との関係が同僚より良いと感じること（有利なLMX社会的比較）が、心理的特権意識を通じて知識の隠蔽を増やし、その経路は職場の競争的な風土が強いほど強まることを、5つの研究（計1,161人）で示した（抄録）。", "p2": "上司と良い関係にある従業員は協力的になると考えられがちだが、自分は特別だという特権意識を持つと、知識を出し惜しみする可能性がある。この仕組みと、それが強まる条件は検証されていなかった（抄録の仮説から読み取れる問題設定）。", "p3": "有利なLMX社会的比較→心理的特権意識（媒介）→知識の隠蔽という経路と、知覚された競争的風土による調整を仮説とし、現場の調査、シナリオ実験、想起課題、2×2の実験を組み合わせて検証した（抄録）。解釈：調査で現実の関連を、実験で因果の向きを確かめる多面的な設計。", "p4": "研究1は現場の調査（478人）、研究2と4は高・低LMXの場面を割り当てるシナリオ実験、研究3は特権意識に関わる出来事を想起させる課題（88人）、研究5は特権意識と競争の2×2の実験（137人）で、各研究の間接効果と調整効果を評価した（抄録）。", "p5": "研究1では有利なLMX社会的比較が特権意識を通じて知識の隠蔽と間接的に関連し、特権意識と隠蔽の結びつきは競争を強く感じるほど強かった。研究2・4では高LMXの場面で特権意識が高く、隠蔽への間接効果も正だった。研究3では特権意識に関わる出来事の想起で特権意識と隠蔽がともに高まり、研究5では競争が強い条件で特権意識の効果が大きかった（抄録）。", "p6": "著者は結果を、特権意識が有利なLMX社会的比較と知識の隠蔽を結ぶ「一つの」仕組みであることと整合すると慎重に述べている（抄録）。解釈：実験の隠蔽は仮想的な行動の意図で、実際の隠蔽行動は確かめられていない。効果の大きさは抄録からは不明。", "fun": "上司に気に入られていると感じる人ほど、同僚に知識を教えなくなることがある——そんな意外な仮説を、5つの研究で確かめました。鍵は「自分は特別だから当然」という特権意識で、職場の競争が激しいほどその傾向が強まりました。ひいきが協力を生むどころか、知識の出し惜しみにつながりうるという点が面白いところです。", "unverified": "本文を入手できず、各研究の効果の大きさの数値、研究2・4の標本数、使用した尺度は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "閾値で戻る粒子集団の運動論方程式を安定に解く", "title": "Kinetic description and numerical study of a network of noisy resonate and fire neurons - long version", "url": "https://doi.org/10.33774/coe-2026-n2ssp-v2", "authors": "Nicolas Zadeh", "venue": "Cambridge Open Engage", "date": "2026-11-09", "apa": "Zadeh, N. (2026). Kinetic description and numerical study of a network of noisy resonate and fire neurons - long version. https://doi.org/10.33774/coe-2026-n2ssp-v2", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Cambridge Open Engageの論文PDFの本文（目次、集団モデルの導出の節、数値実験の性能と平均場の精度の節の一部、結論）を読んだ", "preprint": true, "p1": "膜電位とその変化率の2変数で振動的に応答する「共振発火」ニューロンの疎なネットワークについて、平均場極限で半平面上の非線形な運動論的フォッカー・プランク方程式を導き、確率密度の非負性と質量保存を厳密に保つ差分スキームを作って数値的に調べた（抄録、§V）。", "p2": "積分発火型のニューロン集団の偏微分方程式モデルは研究が進んでいるが、振動的に応答する共振発火型の集団の記述はなく、リセットを伴う非線形の方程式に通常のスキームを使うと質量や正値性が失われることがあった（§V）。", "p3": "各ニューロンを膜電位xとその時間微分vで表し、シナプス入力を拡散近似して、活動度に依存する移流と拡散、閾値の境界での流出とリセット点への再注入を持つ密度f(x,v,t)の方程式を導いた（§II.3、§V）。風上差分にもとづく陰的スキームで質量保存と非負性を証明し、作用素のブロック三重対角構造を使って汎用の疎行列ソルバより速い解法を作った（§III〜IV.1）。直観：密度は閾値で失われ、リセット点に戻され、渦巻き状に運ばれ、速度方向の拡散が電位方向へ伝わる（§V）。", "p4": "厳密解がないため、時間・空間の刻みを細かくしたときの実験的な収束次数（L1・L∞）と実行時間で性能を評価し、スパイキングネットワークのシミュレータBrian 2で多数のニューロンを直接計算した結果の平均と標準偏差に対して、平均場の記述の精度を比べた（§IV.2〜IV.3）。", "p5": "数値実験は空間と時間に1次の収束を示した（抄録）。終時刻の電位の密度はBrian 2とよく一致し、PDEの曲線は常にBrian 2の平均の±1標準偏差の範囲に収まったが、ごく短い時間では有限個のゆらぎによる差がみられた（§IV.3）。リセット駆動、閾値下の減衰振動、閾値から遠い状態、共振とフィードバックによる長く続く集団振動などの領域が観察され、分岐構造の存在が示唆された（抄録、§IV.4）。", "p6": "著者は、連続問題の適切性（解の存在と一意性）の理論、1次収束の厳密な証明、高次のスキーム、ディラックのリセット源を滑らかな近似に置き換えずに扱うこと、分岐の解釈の検証を未解決の課題に挙げる（§V）。解釈：単著で査読前の原稿である。", "fun": "脳の神経細胞の中には、決まったリズムの入力にだけ強く反応する「共振」型のものがあります。この研究は、そうした細胞が多数つながった集団を、一つひとつではなく「電位とその変化の速さ」の平面に広がる霧のような分布として表す方程式を作りました。霧は端で消えては別の場所から湧き出し、渦を巻いて流れます。その霧の量が計算で減ったり負になったりしない工夫が面白いところです。", "unverified": "スキームの性質の証明（§III.4）と収束次数の表の個々の値、長時間挙動と相対エントロピーの節（§IV.5）は読んでいない。"}}, {"id": "pr15", "rank": 15, "headline": "欠けたセンサの場を生成モデルで復元するDT", "title": "Generative Reconstruction of Full-Field Sensor States for Safety-Critical Digital Twins", "url": "https://arxiv.org/abs/2611.08499", "authors": "Umme Mahbuba Nabila ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Nabila, U. M., Lin, L., & Radaideh, M. I. (2026). Generative Reconstruction of Full-Field Sensor States for Safety-Critical Digital Twins (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08499", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（施設とデータ・手法・同一試験内と試験間の結果・考察の節と表4・6・7）を読んだ", "preprint": true, "p1": "安全上重要な原子炉試験施設のデジタルツインで、故障・欠測した熱電対の温度場を、残る少数のセンサと位置情報から条件付き生成モデル（拡散モデル・VAE・GAN）で復元し、同じ試験の中では誤差を回帰の約半分にできることを示した（抄録、§4）。", "p2": "高温・放射線環境の熱電対はドリフト・故障・断続的な欠測を起こし、デジタルツインの状態把握が部分観測になる。決定論的な補間や回帰では空間と時間の関係を十分に捉えられない（§1、抄録）。", "p3": "センサの一部を「既知」、残りを隠した「未知」とし、既知センサの温度と正規化した3次元の位置を条件として未知の位置の温度を生成する。同一試験内ではグラフニューラルネット（センサ間の空間関係）とGRU（時間変化）を組み合わせた骨格に、拡散モデル・条件付きVAE・条件付きGANを載せ、決定論的なGNN-GRU・GRU・リッジ回帰と比べた（§3）。", "p4": "オレゴン州立大の高温試験施設（HTTF）の固体温度の熱電対149本（減圧時の伝導冷却試験PG-29の45.6時間、30秒間隔）で、91本を既知としたときの同一試験内の復元と、加圧時の冷却試験PG-27（93.4時間）で学習しPG-29で評価する試験間の転移を、MAE・RMSE・R²で評価した（§2.4、§3.1）。", "p5": "同一試験内ではGNN-GRUのVAEが最良でMAE 11.73℃、RMSE 20.54℃、R² 0.98、GANと拡散モデルのRMSEは22.37℃・22.61℃で、決定論的GNN-GRU（25.26℃）、GRU（35.22℃）、リッジ回帰（48.62℃）を上回った（表4）。既知センサを91本から45本に減らしても拡散モデルはR² 0.94を保った（抄録、表6）。試験間の転移では断面の文脈を条件にした拡散モデルが最良（RMSE 42.84℃、R² 0.91）だったが、誤差は同一試験内より大きかった（表7）。", "p6": "著者は、試験間の転移では全手法で誤差が大きく増え、訓練データで代表されない運転条件への一般化が難しいことを認める（§4.3）。解釈：検証は1施設・2つの試験に限られ、他の施設や故障の仕方への一般化は未確認。拡散モデルが持つ不確実性の定量化の利点は、点推定の指標には表れていない（§4.1）。", "fun": "原子炉の模型の中には300本以上の温度計が並びますが、高温で壊れたり記録が途切れたりします。この研究は、生き残った温度計の値とそれぞれの位置の情報から、壊れた温度計の値をAIで「描き直し」ました。同じ実験の中なら誤差は大幅に減りましたが、条件の違う別の実験に持ち込むと誤差が増えました。どこまで頼れるかの線引きまで示した点が面白いところです。", "unverified": "計算時間とセンサ配置の影響の分析（§4.1の後半）と、試験間の転移の損失関数の詳細は読んでいない。"}}, {"id": "pr16", "rank": 16, "headline": "借り手のつながりと時期変化を考慮した信用リスク予測", "title": "Adaptive Credit Risk Prediction Under Concept Drift Using Graph Neural Networks and Gradient Boosting", "url": "https://doi.org/10.21203/rs.3.rs-11176012/v1", "authors": "Nabeel Muhammed Kottayil ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Kottayil, N. M., & Jailia, M. (2026). Adaptive Credit Risk Prediction Under Concept Drift Using Graph Neural Networks and Gradient Boosting. https://doi.org/10.21203/rs.3.rs-11176012/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "借り手どうしのつながりと、時間とともに変わる関係を取り込み、銀行の個人向け融資の倒産確率をIFRS 9の段階区分に沿って予測する手法を提案した（抄録）。", "p3": "類似性や共通の所属（支店・業種・地域など）で借り手を結んだグラフからGraphSAGEで埋め込みを学び、審査の特徴量とともにXGBoostに入力する。直近を重く見る移動窓で、景気による関係の変化（概念ドリフト）に追随させる（抄録）。", "p5": "両方のリスク経路を含むように作ったIFRS 9型の標本でAUC 0.852となり、審査の特徴量だけの勾配ブースティング（0.798）やグラフだけ（0.768）を上回った。模擬的な景気後退でも適応型の方が識別力を保った（抄録）。", "fun": "お金を返せなくなる危険は、その人だけでなく、同じ地域や業種の仲間の状況にも左右されます。この研究は、似た借り手どうしを線で結んだ「つながりの地図」を使い、さらに景気で関係が変わることにも合わせて予測を更新しました。一人ひとりを孤立して見るより、つながりと時間の変化を見る方が当たりやすいという点が面白いところです。", "unverified": "本文を入手できず、評価に使った標本が実データか構築した評価用データか、学習と評価の期間の分け方は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "集団の公平性は救済の公平性を保証しない", "title": "Does Group Fairness Guarantee Recourse Fairness? An Empirical Test Across Two Decision Domains", "url": "https://doi.org/10.20944/preprints202611.0608.v1", "authors": "Aryan Bhusal ほか", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Bhusal, A., Neupane, B., & Neupane, R. (2026). Does Group Fairness Guarantee Recourse Fairness? An Empirical Test Across Two Decision Domains. https://doi.org/10.20944/preprints202611.0608.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "同じ程度に「公平」と評価される2つの偏り緩和法でも、不利な判定を受けた人が判定を覆すのに必要な変化量（アルゴリズム的救済）の集団差は異なることを示した（抄録）。", "p3": "判定境界までの距離が閉形式で求まる線形分類器を使い、再重み付けと共分散罰則つきロジスティック回帰の2手法を、Adult（性別）とCOMPAS（人種）のデータで30回の無作為分割により比べ、マン・ホイットニーのU検定と順位双列相関で効果量を測った（抄録）。", "p5": "Adultでは2手法の集団公平性の指標はほぼ同じ（SPD −0.087対−0.094、AOD 0.068対0.057）だったが、救済の格差は逆向き（r=0.205対−0.083）で、同じ却下者でも差が残った（抄録）。", "fun": "「男女で合格率が同じ」なら公平だと言えるでしょうか。この研究は、不合格になった人があとどれだけ条件を変えれば合格できるかという「やり直しの距離」に注目しました。合格率の公平さが同じ2つの方法でも、やり直しの負担は集団によって違いました。見る物差しを変えると公平の姿が変わるという点が面白いところです。", "unverified": "本文を入手できず、2手法の具体的な設定と、COMPASでの結果（抄録では探索的な評価とされる）の詳細は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "LLMの注釈は与えた定義より既存の対応に従う", "title": "Definitions, Label Names, or Demonstrations? Auditing What Governs LLM Annotation", "url": "https://arxiv.org/abs/2611.09457", "authors": "Viraj Mishra ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Mishra, V., Gupta, S., Gupta, D., Tai, Y. C., & Li, Q. (2026). Definitions, Label Names, or Demonstrations? Auditing What Governs LLM Annotation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09457", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMによる社会科学テキストの注釈が、研究者の与えた定義に従っているのか、ラベル名や例示との既存の結びつきに従っているのかを見分ける反実仮想の監査法を示した（抄録）。", "p3": "出力ラベルの間で定義を入れ替え、入れ替えた定義に従うか元の対応を保つかを測る。3つの政治テキストのデータセットで、微調整や、近い訓練例を検索して示す注釈も比べた（抄録）。", "p5": "モデルは入れ替えた定義にほとんど従わず、標準的な微調整は元の対応を強めるだけで定義への忠実さを確実には高めなかった。近傍の訓練例を検索する方法は精度を上げたが、その改善の74〜93%は単純なk近傍分類で再現でき、近傍のラベルが予測の大半を担っていた（抄録）。", "fun": "LLMに「この定義で分類して」と頼めば、その通りに分類していると思いがちです。この研究は、定義の中身をわざと入れ替えても結果があまり変わらないことを確かめ、LLMが定義を読むよりも、ラベル名や例から推測していることを示しました。精度が高いことと、指示通りに動いていることは別だという点が面白いところです。", "unverified": "本文を入手できず、使用したモデルの種類と、3つのデータセットの名前・規模は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLMは陰謀論を否定しつつ利用者の党派に配慮", "title": "Political Ingroup and Outgroup Cues Condition How Large Language Models Refute Conspiracy Theories", "url": "https://doi.org/10.31234/osf.io/4yexj", "authors": "Erin B. Fitz ほか", "venue": "PsyArXiv", "date": "2026-11-08", "apa": "Fitz, E. B., & Saunders, K. L. (2026). Political Ingroup and Outgroup Cues Condition How Large Language Models Refute Conspiracy Theories. https://doi.org/10.31234/osf.io/4yexj", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMは陰謀論の大半を否定するが、利用者と陰謀論の当事者の党派の組合せによって応答の仕方を変えることを、事前登録した大規模な実験で示した（抄録）。", "p3": "57の陰謀論、21通りの利用者と当事者の政治的立場の組合せ、OpenAIの7つのLLMで135,845件の会話を作り、否定するか、利用者の視点を認め懸念を肯定する「動機づけられた応答」をするかを測った（抄録）。", "p5": "応答の82%が陰謀論を否定し、20%が動機づけられた応答を示した。動機づけられた応答はたいてい否定と一緒に現れ、陰謀論が利用者の外集団に関わるとき（例：共和党支持の利用者が民主党に関わる陰謀論を尋ねるとき）に多かった（抄録）。", "fun": "AIは陰謀論に「それは違います」と答えることが多いのですが、その言い方は相手の支持政党で変わっていました。相手の気持ちに寄り添う一言を添えるかどうかが、話題の党派と相手の党派の組合せで違ったのです。正しい答えでも「言い方の偏り」がありうるという、AIの公平さの新しい問いが面白いところです。", "unverified": "本文を入手できず、7つのモデルの名前とモデル間の差、動機づけられた応答の判定方法は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "気候市民会議に市民科学を組み込む道具立て", "title": "Bringing Citizen Science into Deliberative Democracy: Insights from Climate Citizens’ Assemblies", "url": "https://doi.org/10.31235/osf.io/q9ja7", "authors": "Julian Vicens ほか", "venue": "SocArXiv", "date": "2026-11-09", "apa": "Vicens, J., Bertomeu, F., Fameli, K. M., Kotrikla, A. M., Polydoropoulou, A., Alvarez, N., & Laniado, D. (2026). Bringing Citizen Science into Deliberative Democracy: Insights from Climate Citizens’ Assemblies. https://doi.org/10.31235/osf.io/q9ja7", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "気候市民会議に市民科学（市民がデータを集め解釈する活動）を組み込むためのツールキットを共同で作り、欧州の2つの市民会議で試した（抄録）。", "p3": "リビングラボでの参加型ワークショップでツールキットを作り、リガとエーダーミュンデの気候市民会議に導入して、参加者と運営者への調査・フォーカスグループ・質的コーディングを組み合わせて分析した（抄録）。", "p5": "市民科学の統合は知識の取り込み・市民の主体性・手続きへの信頼を高めた一方で、運営の負担を増やした。著者らは、熟議の形式に市民科学を構造的に組み込むと民主的な革新の認識的な正統性が広がると論じ、今後の市民会議の設計原則を示した（抄録）。", "fun": "市民会議では、ふつう専門家が用意した資料をもとに話し合います。この研究は、参加者自身が身の回りのデータを集めて読み解く「市民科学」を話し合いに組み込みました。その結果、知識が身につき、話し合いの手続きへの信頼も高まりました。話し合う材料づくりから市民が関わるという発想が面白いところです。", "unverified": "本文を入手できず、調査の回答者数、効果の大きさ、設計原則の具体的な内容は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "AI気象モデルは摂動の成長を物理的に再現しない", "title": "Do AI weather models learn atmospheric perturbation growth characteristics? A FuXi case study based on Breeding of Growing Modes method", "url": "https://doi.org/10.21203/rs.3.rs-11389396/v1", "authors": "Xiao Shang ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Shang, X., Guan, J., Peng, J., Lin, C., & Zhang, L. (2026). Do AI weather models learn atmospheric perturbation growth characteristics? A FuXi case study based on Breeding of Growing Modes method. https://doi.org/10.21203/rs.3.rs-11389396/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "AI気象モデルFuXiが大気の摂動（小さなずれ）の成長の仕方を物理的に学んでいるかを数値モデルMPASと比べ、部分的な統計的関係しか学んでいないことを示した（抄録）。", "p3": "成長モードの育成法（BGM）で摂動を育て、成長の速さ、飽和の大きさ、空間分布、運動エネルギーのスペクトル、回転成分と発散成分への分解を2つのモデルで比べた（抄録）。", "p5": "MPASでは摂動が傾圧・対流の不安定ですばやく成長し約3日で飽和したのに対し、FuXiは最初の2日の成長が極めて遅かった。FuXiでは高波数のスペクトルが平らでエネルギーカスケードがなく、低緯度に非物理的な雑音が残り、発散的な運動を捉えていなかった（抄録）。", "fun": "天気予報のAIは、計算が速く当たりもよいと話題です。しかしこの研究で、わざと小さなずれを入れて育ててみると、AIでは本物の大気のようにずれが育たず、大きな渦から小さな渦へエネルギーが流れる様子も再現されていませんでした。予報が当たることと物理を理解していることは別だ、という点が面白いところです。", "unverified": "本文を入手できず、比較の期間と事例数、アンサンブル予報への具体的な影響の評価は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "環境情報の開示義務化で企業の負債が短期化", "title": "Mandatory environmental disclosure and corporate debt maturity: causal evidence from China", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141434", "authors": "Bai, Jinling", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の上場企業で、環境情報の開示の義務化が企業の負債の満期を短くしたことを、準自然実験で示した（抄録）。", "p3": "2010年の上場企業の環境情報開示の指針を準自然実験とし、2007〜2019年のA株上場企業のパネルデータで差の差分析を行い、事前の自主的な開示の質による調整、銀行依存度別の分析、仕組みの検定を行った（抄録）。", "p5": "開示の義務化は負債の満期を有意に短くし、それまで見えなかった環境の法令順守の費用や負債が明らかになって債権者がリスクを見直す経路が示された。事前の開示の質が高い企業では短期化の効果が約48%弱まった（抄録）。", "fun": "会社に環境の情報を公開させると、お金の借り方まで変わりました。隠れていた環境対策の費用が明らかになると、お金を貸す側は長期で貸すのをためらい、返済期間の短い借入れが増えたのです。もともと情報をよく公開していた会社では影響が小さく、「情報を出す習慣」が守りになるという点が面白いところです。", "unverified": "本文を入手できず、処置群と対照群の定義、満期の測り方、平行トレンドの確認の結果は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "低所得者向け住宅の立地が近隣と入居者に及ぼす影響", "title": "Where Subsidized Housing Lands, and Why It Matters: A Review of LIHTC Siting, Neighborhood Opportunity, and Fair Housing", "url": "https://doi.org/10.20944/preprints202611.0635.v1", "authors": "Zeus Flores", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Flores, Z. (2026). Where Subsidized Housing Lands, and Why It Matters: A Review of LIHTC Siting, Neighborhood Opportunity, and Fair Housing. https://doi.org/10.20944/preprints202611.0635.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の低所得者住宅税額控除（LIHTC）の住宅について、どこに建つか、なぜか、入居者と既存の住民にどう影響するかの研究をつないで整理したレビュー（抄録）。", "p3": "立地の研究、近隣が人の長期的な成果に与える影響の研究、事業が受け入れ地域を変える研究の3つを4つの問いに沿って整理し、立地の決定の各段階に政策の手段を対応させた（抄録）。", "p5": "LIHTCの物件は貧困率と少数派の割合が高い地域に集まり、それは入居者の需要と同じくらい土地・建設市場、用途地域、地元の反対、配分規則を反映していた。入居者の機会を広げることと荒廃した地域へ再投資することの間に本当のトレードオフがあり、その条件は地域で変わると結論した（抄録）。", "fun": "安い家賃の住宅をどこに建てるかは、何十年も続く選択です。豊かな地域に建てれば住む子どもの将来が開け、貧しい地域に建てればその町の再生につながることもあります。どちらにも理由がある「本物の板挟み」を、ばらばらだった研究をつないで描き出した点が面白いところです。", "unverified": "本文を入手できず、取り上げた研究の範囲と、示された政策の手段の具体的な内容は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "人とAIの協働に「目標」の表現層を設ける提案", "title": "Goals as a Representational Layer for Human-AI Collaboration", "url": "https://arxiv.org/abs/2611.08757", "authors": "Gaia Molinaro ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Molinaro, G., Tankelevitch, L., Rintel, S., & Counts, S. (2026). Goals as a Representational Layer for Human-AI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08757", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "生成AIが働く人の文脈で動くようになったいま、人・AI・組織をつなぐ明示的な「目標」の表現層を設けるべきだと提案した立場表明の論文（抄録）。", "p3": "人の目標は階層的で一部が潜在的で、時間とともに変わるため、目標の層は多次元で、本人の言葉と証拠からの推定の両方に基づき、継続的に更新される必要があると論じた（抄録）。", "p5": "実証の結果はなく、目標の層が目の前の依頼と大きな成果をつなぎ、文脈の整理と検索、振り返りと協調、人中心の成果によるAIの訓練・評価の基盤になりうると論じ、目標の推定・社会認知的な摩擦・プライバシー・統治などの課題を挙げた（抄録）。", "fun": "AIに「この資料をまとめて」と頼むとき、AIはなぜそれが必要なのかを知りません。この論文は、人が何を目指しているかという「目標」をAIと共有する仕組みを作るべきだと提案します。目標は大きなものから小さなものまで階層になり、時間とともに変わるので、それをどう表すかが難しいという問題設定が面白いところです。", "unverified": "本文を入手できず、目標の層の具体的な設計例や評価方法が示されているかは未確認。"}}, {"id": "pr25", "rank": 25, "headline": "装着位置の違うIMU信号を拡散モデルで変換", "title": "DiffusionRef-IMU: Guide-Anchored Residual Diffusion for Cross-Location Inertial Measurement Unit Translation", "url": "https://arxiv.org/abs/2611.09323", "authors": "M. M. Golam Hafiz ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Hafiz, M. M. G., Simi, S. A., Islam, M. R., & Mridha, M. F. (2026). DiffusionRef-IMU: Guide-Anchored Residual Diffusion for Cross-Location Inertial Measurement Unit Translation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09323", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ある体の部位で測った慣性センサ（IMU）の信号から、測っていない別の部位の信号を推定する変換で、決定論的な推定のあとに残差だけを拡散モデルで補正する手法を提案した（抄録）。", "p3": "まず決定論的なネットワークで目標の信号を推定し、残る食い違いだけを、その推定を手がかりに固定した残差拡散モデルで直す。被験者を分けた5分割の評価、容量をそろえた比較手法、外部の2データセットでのゼロショット評価で検証した（抄録）。", "p5": "16段のDDIMで平均の正規化RMSEは0.087538となり、決定論的推定のみ（0.090262）や他の残差補正（0.088847、0.088417）を5分割すべてで下回った。4段でも0.087820を窓あたり47.62 msで保った。ゼロショットでは一方のデータで僅かに優れ、もう一方では劣った（抄録）。", "fun": "手首につけたセンサの動きから、腰につけたらどう測れたかを推定できたら便利です。この研究は、まず大まかに推定し、残ったずれだけを生成モデルで仕上げる二段構えにしました。ただし、まったく別の人たちのデータでは効果がはっきりせず、うまくいく範囲と限界の両方を示した点が面白いところです。", "unverified": "本文を入手できず、使用した部位の組合せ、データセットの規模、活動の種類は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "再帰型モデルを観測器として推定誤差の収束を保証", "title": "Provable State Estimation with Recurrent Models", "url": "https://arxiv.org/abs/2611.09217", "authors": "Vincent Andrieu (LAGEPP ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Andrieu, V., Bernard, P., Brivadis, L., Praly, L., & Wolf, C. (2026). Provable State Estimation with Recurrent Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09217", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "再帰型ニューラルネット（RNN）を非線形観測器（状態推定器）として理論的に解析し、推定誤差が指数的に小さくなることを保証する条件を示した（抄録）。", "p3": "RNNを連続時間の潜在力学系（Neural ODE）の離散化とみなし、潜在の流れに縮約（近い軌道どうしが近づく性質）の条件を課す。すると真の物理状態から潜在空間への滑らかで単射な写像が存在し、潜在の速度場を1つのスカラーの利得で大きくすると推定誤差を任意に小さくできることを証明した（抄録）。", "p5": "潜在状態を読み出すMLPに必要な複雑さの上限を示し、離散時間の残差RNNにも保証を拡張した。実際の移動ロボットの課題で、縮約を保証したモデルは通常のGRUより学習が安定で性能も上回り、制約のないGRUも縮約的な力学に収束していた（抄録）。", "fun": "センサの記録から見えない状態を推し量る「推定器」は、AIで作ると便利ですが、なぜうまくいくかの保証がありませんでした。この研究は、近い状態どうしが自然と近づいていく「縮約」という性質を持たせれば、推定の誤差が速く小さくなることを数学的に示しました。よく学習したAIが自然にこの性質を身につけていたという発見も面白いところです。", "unverified": "本文を入手できず、ロボットの課題の内容と性能の数値、利得の大きさと雑音への頑健さの関係は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "多エージェント討論でLLMの事実確認を欺く攻撃", "title": "Debate to Deceive: Poisoning LLM's Fact-Checking via Game-Theoretic Multi-Agent Debate", "url": "https://arxiv.org/abs/2611.08756", "authors": "Liting Huang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Huang, L., Liang, H., Lei, Y., Ma, X., & Ojha, V. (2026). Debate to Deceive: Poisoning LLM's Fact-Checking via Game-Theoretic Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08756", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "人間の討論の構造と修辞を模した多エージェントの討論で、LLMの事実確認の判定を誤らせる攻撃用の文章を作る枠組みD2Dを提案した（抄録）。", "p3": "攻撃の過程を進化ゲームとして定式化し、エージェントがロゴス（論理）・パトス（感情）・エトス（信頼）の修辞戦略を競争の中で適応的に進化させる。戦略を選ぶ層と、その戦略と討論の文脈に沿ってLLMが文章を作る層に分けて、膨大な出力空間を扱う（抄録）。", "p5": "FEVER、HealthVer、CLIMATE-FEVER、SciFactの4つの事実確認ベンチマークで、既存の攻撃を大きく上回り、ほとんどの防御をすり抜けたと報告した（抄録）。", "fun": "うそを見抜くAIをだますために、この研究はAIどうしに「討論」をさせました。論理で攻めるか、感情に訴えるか、信頼性を演出するかという弁論術の作戦を、生き物の進化のように競わせて磨いたのです。説得の技術がそのまま危険な武器にもなりうるという点が、考えさせられて面白いところです。", "unverified": "本文を入手できず、攻撃の成功率などの数値、対象のモデル、防御手法ごとの結果は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "隠れた規範を相互作用から学ぶ力を測る", "title": "NormGym: Evaluating Normative Competence through Social Interaction", "url": "https://arxiv.org/abs/2611.08613", "authors": "Binze Li ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Li, B., Zhang, Z., Baek, S., Hadfield, G. K., & Shu, T. (2026). NormGym: Evaluating Normative Competence through Social Interaction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08613", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "多エージェントの共同体に入った新参者が、隠れた任意の規範を周囲の行動と制裁から推論して従えるかを測る対話型のベンチマークNormGymを作った（抄録）。", "p3": "新参者は自分の課題を進めながら、できることと許されることを区別し、観察した行動と制裁から規範を推論して新しい場面に当てはめる必要がある。多様な規範と環境で、LLMエージェントを含む現在のエージェントを評価した（抄録）。", "p5": "最も強いLLMでも課題と規範順守の同時成功率は55.3%だった。モデルは自分の行動への制裁の後には行動を直せることがあるが、他者の行動と他者への制裁から規範を推論するのは苦手で、微調整だけでは改善が不十分な可能性が示された（抄録）。", "fun": "転校先のクラスには、誰も教えてくれない暗黙のルールがあります。人は周りの様子や、誰かが注意される場面を見てそれを学びます。この研究でAIを同じ立場に置くと、自分が叱られれば直せても、他人が叱られるのを見て学ぶのは苦手でした。「空気を読む」力の難しさがはっきりした点が面白いところです。", "unverified": "本文を入手できず、評価したモデルの一覧、規範と環境の数、微調整の方法は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "予測が当たってもIFRSの測定として妥当とは限らない", "title": "When Algorithmic Accuracy Conflicts with Accounting Measurement: Rethinking the Normative Boundaries of AI-Based Financial Valuation under IFRS", "url": "https://doi.org/10.2139/ssrn.7681492", "authors": "Abderrahim Bekhtaoui", "venue": "SSRN", "date": "2026-11-09", "apa": "Bekhtaoui, A. (2026). When Algorithmic Accuracy Conflicts with Accounting Measurement: Rethinking the Normative Boundaries of AI-Based Financial Valuation under IFRS. https://doi.org/10.2139/ssrn.7681492", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "機械学習による会計上の見積りが実績によく当たること（予測精度）と、IFRSの測定として妥当であること（規範的な妥当性）は別物で、前者は後者の必要条件でも十分条件でもないことを分析的に示した（抄録）。", "p3": "IFRS 13・IFRS 9・IAS 36を段落ごとに検討し、順位に基づく精度指標が較正とシナリオの重み付けを見ないことなどを示した。予想信用損失の再現可能なシミュレーションで例示し、使う・調整する・却下するの3段階の判定基準を導いた（抄録）。", "p5": "シミュレーションでは、ブースティングのAUC 0.786はロジスティック回帰の0.737を上回ったが、クラス重み付きの学習は予想信用損失を約333%過大に見積もり、AUCが同じ再較正モデルもシナリオ調整の前は確率加重の目標を約15%過小評価した（抄録）。", "fun": "よく当たる予測なら会計の数字にそのまま使ってよい、と考えたくなります。しかし会計の基準は「何を測るべきか」を決めており、順位を当てるのが上手なモデルでも、損失の大きさを何倍も見誤ることがありました。「当たる」と「正しく測れている」は違うという区別が面白いところです。", "unverified": "本文を入手できず、シミュレーションの設定と3段階の判定基準の具体的な条件は未確認。証拠は分析とシミュレーションで、実際の頻度は示していないと著者自身が述べている。著者は執筆に生成AIの支援を受けたと明記している。"}}, {"id": "pr30", "rank": 30, "headline": "企業破綻と会計不正から取締役の責任を検討", "title": "Preventing disorderly corporate collapse and stakeholder losses: are directors the answer?", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141476", "authors": "Pope ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の無秩序な破綻と質の低い会計・報告・監査の関係を検討し、財務報告の質を守るための取締役の責任の定め方について5つの論点を示した（抄録）。", "p3": "取締役の法的な役割の研究、企業破綻と財務報告の不正の同時発生の証拠、ガバナンスの仕組みと報告の質の関係の研究を要約し、2002年のサーベンス・オクスリー法の教訓と2021年の英国政府の改革案を検討した（抄録）。", "p5": "会計の不正は破綻の原因ではなく兆候であることが多いこと、より広いガバナンスの失敗の責任を会計に押しつける危険、規制の比例性が費用だけで論じられ便益が考慮されないこと、学習と修正を前提とする謙虚な規制の利点、報告への技術の利用の規制上の含意を挙げた（抄録）。", "fun": "会社が突然つぶれると、「帳簿のごまかし」が原因だと考えがちです。この論文は、多くの場合ごまかしは病気の原因ではなく症状であり、会計だけを悪者にすると本当の問題を見落とすと指摘します。熱を下げても病気は治らないのと同じで、原因と症状を分けて考える視点が面白いところです。", "unverified": "本文を入手できず、検討した実証研究の範囲と、改革案への具体的な評価は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "香港と中国本土の高齢MSMの差別と心理的苦痛", "title": "Exploring the Roles of Socioeconomic Status, Discrimination, Personal Social Capital, and Psychological Distress Among Older Men Who Have Sex with Men in Hong Kong and Mainland China: A Cross-Sectional Study", "url": "https://doi.org/10.21203/rs.3.rs-11177265/v1", "authors": "Alex Siu Wing Chan ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Chan, A. S. W., Mo, P. K. H., Ku, H. B., Asiamah, N., & Yan, E. (2026). Exploring the Roles of Socioeconomic Status, Discrimination, Personal Social Capital, and Psychological Distress Among Older Men Who Have Sex with Men in Hong Kong and Mainland China: A Cross-Sectional Study. https://doi.org/10.21203/rs.3.rs-11177265/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "香港と中国本土の60歳以上の男性と性交渉を持つ男性で、心理的苦痛の最大の要因は日常的な差別であり、社会経済的・社会的な要因を上回ることを示した（抄録）。", "p3": "2024年に香港151人・中国本土151人の計302人へのオンライン調査を、LGBT団体・NGO・大学を通じた便宜・雪だるま式・目標抽出で行い、階層的ロジスティック回帰で心理的苦痛と社会経済的地位・個人の社会関係資本・差別の関連を調べた（抄録）。", "p5": "月収が高い（1万8,700香港ドル超）ことは苦痛の増加と関連した（OR=2.82）。日常的差別の尺度が1単位上がるごとに苦痛の可能性が17%高く（OR=1.17）、説明された分散の35.9%を占め、差別を調整すると教育と社会関係資本は有意でなくなった（抄録）。", "fun": "心の苦しさの原因として、収入や人とのつながりがよく挙げられます。ところがこの調査では、性的少数者の高齢男性にとって日々受ける差別の積み重ねが最も大きな要因で、収入が高い人ほどむしろ苦痛が強いという意外な結果も出ました。社会の側の態度が心の健康を左右するという点が面白いところです。", "unverified": "本文を入手できず、心理的苦痛の尺度と判定の区切り、収入が高いほど苦痛が強いことへの著者の解釈は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "養育者の子ども発達の知識を測る尺度を開発", "title": "Development and Validation of the Caregiver Knowledge of Early Child Development Inventory (CKECDI) and Its Association with Preschool Children’s Executive and Motor Functions", "url": "https://doi.org/10.20944/preprints202611.0712.v1", "authors": "Chika R. Ezeugwu ほか", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Ezeugwu, C. R., Adedayo, M., Adeleye, A. O., Oyekola, A., Adegunle, S. O., Effiom, D. D., Olajubu, B. J., Emmanuel, J. D., Olaseni, J. T., & Audu, A. (2026). Development and Validation of the Caregiver Knowledge of Early Child Development Inventory (CKECDI) and Its Association with Preschool Children’s Executive and Motor Functions. https://doi.org/10.20944/preprints202611.0712.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "ナイジェリアで、養育者が就学前の子どもの発達についてどれだけ知っているかを測る35項目・4因子の尺度（CKECDI）を開発し、妥当性を検証した（抄録）。", "p3": "第1段階で養育者517人の回答を探索的因子分析（259人）と確認的因子分析（258人）に分け、第2段階で別の286組の養育者と子どもに実施し、領域ごとの得点と子どもの抑制制御・作業記憶・認知の柔軟性・運動機能の関連を経路分析で調べた（抄録）。", "p5": "認知発達・社会情動的な養育・就学準備・健康と栄養と安全の4因子モデルの適合はよく（CFI=.994、RMSEA=.013）、内的一貫性も許容範囲（KR-20=.74〜.90）だった。学歴による得点差で既知群妥当性を確かめ、領域ごとに子どもの機能と異なる関連を示した（抄録）。", "fun": "子どもの育ちを支えるには、周りの大人が「子どもはどう育つのか」を知っていることが大切です。この研究は、その知識をはかる物差しを作り、知識の領域によって子どもの記憶力や運動の力との結びつき方が違うことを示しました。目に見えない「知識」を数字にして確かめる手順そのものが面白いところです。", "unverified": "本文を入手できず、領域ごとの具体的な関連の方向と大きさは未確認。"}}, {"id": "pr33", "rank": 33, "headline": "人種是正策の下の白人労働者の帰属感と尊厳", "title": "Belonging, Dignity and Second-Class Citizenship: Perceptions of Race-Based Redress Among White South African Workers and Business Owners", "url": "https://doi.org/10.20944/preprints202611.0763.v1", "authors": "Joseph Phosane Mngqibisa ほか", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Mngqibisa, J. P., & Costa, K. (2026). Belonging, Dignity and Second-Class Citizenship: Perceptions of Race-Based Redress Among White South African Workers and Business Owners. https://doi.org/10.20944/preprints202611.0763.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "南アフリカの人種に基づく是正策（雇用均等、積極的差別是正、BBBEE）が、白人の労働者と事業主の帰属感・尊厳・二級市民という認識にどう影響するかの研究を整理したレビュー（抄録）。", "p3": "Google Scholar・ERIC・OpenAlex・Crossrefを情報源とし、2000〜2026年の文献を対象に、重複を除いた150件の記録からPRISMAに沿って整理した（抄録）。", "p5": "白人の従業員の語りでは、雇用均等は不公平な扱いや昇進の制限、帰属感の脅かしと結びつけられたが、是正策の受容は条件付きで、歴史的な不平等は認めつつ不透明な基準や形だけの登用を拒んでいた。白人の事業主と二級市民性を直接扱った証拠は限られ、一律の結論は支持されなかった（抄録）。", "fun": "過去の差別を正すための政策は、得をする側だけでなく、そうでない側の気持ちにも影響します。この整理によると、白人の働き手は是正そのものに反対というより、決め方が不透明なことや形だけの登用に不満を持っていました。政策の中身だけでなく「どう進めるか」が受け止め方を左右するという点が面白いところです。", "unverified": "本文を入手できず、最終的に含めた文献の数と質の評価は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "養育者の技能訓練をデジタル基盤で届ける試み", "title": "A Formative Acceptability Study of a Technology Assisted Platform for Delivering Caregiver Skills Training in Rural Pakistan", "url": "https://doi.org/10.21203/rs.3.rs-11143532/v1", "authors": "Hadia Maryam¹ ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Maryam¹, H., Nazir¹, H., Tariq¹, M., Hayyat¹, M., Koukab¹, A., Liaqat¹, R., Kanwal¹, M., & Rahman², A. (2026). A Formative Acceptability Study of a Technology Assisted Platform for Delivering Caregiver Skills Training in Rural Pakistan. https://doi.org/10.21203/rs.3.rs-11143532/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "非専門家が届ける心理社会的介入のための再利用可能なデジタル基盤（TAP）に、WHOの養育者技能訓練（CST）を組み込めるかを試し、パキスタン農村で初期試作の受容性を評価した（抄録）。", "p3": "2025年9月〜2026年7月にラワルピンディ県の農村で2段階の形成的研究を行った。4回の多職種ワークショップでCSTの内容と実施過程をTAPの構成に対応させ、家族ピア提供者の3組で模擬的な使いやすさの試験をし、現地試験の後に訓練者2人・ピア提供者2人・養育者3人に面接した（抄録）。", "p5": "CSTの9回の集団セッションと3回の家庭訪問を、中核の内容と順序を変えずにデジタルの手順として組み込めた。提供者はその場で使える手引き・活動・動画を評価し、受容性はデジタル化だけでなくピア提供者の支えとの組合せによると考えられた。監督・監視・紹介の長期の運用は確かめていない（抄録）。", "fun": "専門家が足りない地域では、研修を受けた家族や地域の人がケアの担い手になります。この研究は、その人たちが手順や動画をその場で確かめられる仕組みを作りました。覚えた内容に頼らずにすむことで自信が増したという声があり、「道具」と「人の支え」の組合せが鍵だという点が面白いところです。", "unverified": "本文を入手できず、面接での具体的な発言と、6つの実施機能ごとの課題の詳細は未確認。面接の対象者は計7人と少ない。"}}, {"id": "pr35", "rank": 35, "headline": "LGBTQ+の人がAIに相談する・しない理由", "title": "\"I had nobody to turn to\": Why LGBTQ+ People Choose (Not) to Use AI Chatbots for Personal Health and Relationship Advice", "url": "https://arxiv.org/abs/2611.08854", "authors": "Jacob Hobbs ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Hobbs, J., Gupta, A., Ulmer, D., Aich, G., Golden, N., Long, Y., Rios-Sialer, I., Mickel, J., Scheuerman, M. K., Mujumdar, R. A., Felkner, V. K., Taylor, J., & Agnew, W. (2026). \"I had nobody to turn to\": Why LGBTQ+ People Choose (Not) to Use AI Chatbots for Personal Health and Relationship Advice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08854", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LGBTQ+の人が、関係・心の健康・性や性別の健康の相談にAIチャットボットを使うかどうか、その理由を調べた（抄録）。", "p3": "73人（LGBTQ+ 60人、非LGBTQ+ 13人）に、AIチャットボットとの関わり方を調査した（抄録）。", "p5": "外部の資源へのアクセス、プライバシーの懸念、チャットボットの能力の認識が利用を左右した。チャットボットの方が身近な人より偏見が少ないと感じる人もいた一方、15の具体的な場面ではLGBTQ+の人の方が利用頻度が低く、AIの迎合や認知への悪影響を懸念していた（抄録）。", "fun": "身近に相談できる人がいないとき、AIは頼れる相手になりえます。この調査では、AIの方が周りの人より偏見が少ないと感じるLGBTQ+の人がいる一方で、AIが話を合わせすぎることへの警戒も強く、実際の利用はむしろ少なめでした。頼りたいけれど頼り切れないという揺れる気持ちが見えてくる点が面白いところです。", "unverified": "本文を入手できず、調査の方法（募集方法・質問の形式）と、15の場面ごとの差の大きさは未確認。"}}, {"id": "pr36", "rank": 36, "headline": "在宅ケアのAI助手は応答の長さと年齢で体験が変化", "title": "Effects of Response Length, Interaction Mode, and Age on Interaction Experience with a Large Language Model–Powered AI Assistant in Home Care: Mixed Methods Study (Preprint)", "url": "https://doi.org/10.2196/preprints.116407", "authors": "Xu Zhao ほか", "venue": "JMIR Preprints", "date": "2026-11-09", "apa": "Zhao, X., & Zhong, R. (2026). Effects of Response Length, Interaction Mode, and Age on Interaction Experience with a Large Language Model–Powered AI Assistant in Home Care: Mixed Methods Study (Preprint). https://doi.org/10.2196/preprints.116407", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "在宅医療の場面でLLMを使ったAI助手の応答の長さと対話方式が利用者の体験にどう影響し、それが年齢でどう変わるかを162人の実験で調べた（抄録）。", "p3": "応答の長さ（短い10〜20字、中くらい30〜50字、詳しい50〜100字）を参加者間、対話方式（音声＋文字、文字のみ）を参加者内とし、年齢を共変量とする3×2の混合計画で、DeepSeek-V3.2を使うスマートホームの助手と6つの場面で対話してもらった。15人には面接もした（抄録）。", "p5": "体験と認知負荷で方式と長さの交互作用が有意で（体験 F=3.7、P=0.03、η²=0.044）、音声＋文字では中くらいの応答が詳しい応答より認知負荷が低かった。年齢は理解度と信頼に正の効果を持ち（理解度 F=10.4、P=0.002）、30〜50字の応答が情報と負荷の釣り合いがよいと結論した（抄録）。", "fun": "AIの答えは詳しいほどよいとは限りません。この実験では、声と文字で答えるとき、短すぎず長すぎない30〜50字の答えが最も頭の負担が少なくなりました。年上の利用者ほど理解や信頼が高かったのも意外です。相手と伝え方に合わせて「ちょうどよい長さ」があるという点が面白いところです。", "unverified": "本文を入手できず、信頼への年齢の効果の統計量（抄録の表記が途中で切れている）と、面接の分析結果は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "看護実習用のLLM患者ペルソナのプロンプト条件", "title": "LLM Patient Persona for Nursing Simulation", "url": "https://osf.io/5a2bz", "authors": "Hiroyuki Tajima", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-11-06", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OSF Preprintsの登録情報（OpenAlex経由）の抄録を使用", "preprint": true, "short": true, "p1": "看護実習のシミュレーション用に大規模言語モデルが作る患者ペルソナについて、プロンプトの条件が対話の質に与える影響を調べる事前登録研究（抄録）。", "p3": "3つのプロンプト条件×4つの疾患類型×10回の反復で、GPT-4oにより120の対話を生成し、臨床的妥当性・ペルソナの一貫性・ハルシネーションの発生率・属性の遵守率の4軸で評価する（抄録）。", "p5": "抄録には結果の記載がなく、研究の設計と評価軸のみが示されている（抄録）。", "fun": "看護の実習では患者役との会話の練習が大切ですが、毎回人に患者役を頼むのは大変です。AIに患者を演じさせるとき、どんな指示を出せば病状や性格を最後まで守った自然な患者になるのか。この研究はそれを、計画を先に公開したうえで確かめようとしています。「役を演じ続ける力」をどう測るかという問いが面白いところです。", "unverified": "抄録に結果がなく、3つのプロンプト条件の内容と評価の結果は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "心拍などを密かに使うとLLMの説得力が上がる", "title": "Sensed but Not Told: Hidden Physiological Adaptation Shapes LLM Persuasion", "url": "https://arxiv.org/abs/2611.09394", "authors": "Xiaoyan Wei ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wei, X., Qu, Y., Li, Y., Li, H., Zhang, W. E., & Chen, H.-T. (2026). Sensed but Not Told: Hidden Physiological Adaptation Shapes LLM Persuasion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09394", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "利用者に伝えずに心拍と瞳孔の信号をLLMチャットボットに与えると説得の効果が高まることを、24人の参加者内実験で示した（抄録）。", "p3": "チャットボットが参加者自身の選んだ意見に反論する2×2の参加者内計画で、発話ごとの心拍と瞳孔径の特徴を与える条件と与えない条件を比べ、研究の途中で感知していたことを開示した（抄録）。", "p5": "開示前には感知ありで説得力の評価が1.42点高く、研究全体では感知ありでチャットボットの立場への移動が0.57点大きく、少しでも動く確率のオッズが3.20倍だった。開示後は説得力の評価が下がったが、開示は実施順と交絡していた。感知ありでは疑問符が少なく、会話の往復も少なかった（抄録）。", "fun": "話し相手のAIが、あなたの心拍や瞳の大きさをこっそり読み取っていたらどうでしょう。この実験では、そうした体の信号を使うとAIの説得がうまくいき、AIの話し方も問いかけの少ない言い切り型に変わりました。人が言葉にしない情報まで説得に使われうるという、技術と倫理の境目が面白いところです。", "unverified": "本文を入手できず、使ったLLM、信号の特徴量の作り方、話題の種類は未確認。参加者は24人と少ない。"}}, {"id": "pr39", "rank": 39, "headline": "履歴依存の損傷を予測するRNNを有限要素に組込み", "title": "Embedding Consistent Recurrent Neural Networks in Finite Element Simulations for Path-Dependent Damage Prediction", "url": "https://arxiv.org/abs/2611.08494", "authors": "Muhammed Adil Yatk{\\i}n ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Yatkın, M. A., Kõrgesaar, M., & Kurban, H. (2026). Embedding Consistent Recurrent Neural Networks in Finite Element Simulations for Path-Dependent Damage Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08494", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "経路依存の損傷を予測するRNNを陽解法の有限要素ソルバに組み込むには、ひずみ増分の刻み方によらず予測がそろうこと（離散化の整合性）が決定的だと示し、そのための再帰セルConsRNNを提案した（抄録）。", "p3": "学習済みのRNNの損傷基準をFortranで再実装し、Abaqus/Explicitのユーザー材料サブルーチン（VUMAT）の中で増分ごとに状態を進める破壊基準として組み込んだ。通常のSimpleRNNと、経路を細かくすると予測が収束するよう遷移関数を設計したConsRNNを比べた（抄録）。", "p5": "SimpleRNNは増分数が増えると予測がずれて組込みに使えず、ConsRNNは細分化で収束したが、固定の解像度では多直線の経路で精度が下がった。構造規模では固定した鋼板の要素削除を担い、既存の2パラメータの破壊基準と同じ最大荷重・最大変位に達した（抄録）。", "fun": "コンピュータで材料が壊れる様子を計算するとき、時間を細かく刻むか粗く刻むかで答えが変わっては困ります。この研究は、AIで作った「壊れやすさの判定器」が刻み方によって結果がずれる問題を見つけ、刻みを細かくするほど答えが落ち着くように作り直しました。正確さより先に「一貫性」が大事だという点が面白いところです。", "unverified": "本文を入手できず、精度の低下の大きさとピーク後の軟化の挙動の違いの詳細は未確認。最大荷重の一致は構成上当然で、ピーク後に応答が分かれると著者自身が述べている。"}}, {"id": "pr40", "rank": 40, "headline": "腐食したボルト接合の表面劣化から機能を推定", "title": "A Physics-Informed Learning Framework for Linking Microscopic Surface Degradation to Bolted Joint Functional Behavior", "url": "https://arxiv.org/abs/2611.09514", "authors": "Nehal Afifi ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Afifi, N., Kachel, G., & Matthiesen, S. (2026). A Physics-Informed Learning Framework for Linking Microscopic Surface Degradation to Bolted Joint Functional Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09514", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "腐食したボルト接合について、顕微鏡とカメラによる劣化の観察を摩擦係数などの機能の指標に結びつける、物理的な制約つきのマルチモーダルな学習の枠組みを示した（抄録）。", "p3": "検査と機能応答の同期した記録を作り、類似度学習で顕微鏡とカメラの観察を対応させて較正した腐食の重症度の場を作る。その場から偏微分方程式の発見で有効な中間スケールの法則の候補を探し、摩擦係数（締付け力のデータがあれば予張力の低下も）を予測する機能モデルとつなぐ（抄録）。", "p5": "抄録には性能の数値はなく、劣化したボルト接合の挙動を物理的な制約のもとで評価する再現可能な道筋を示したことが貢献とされる（抄録）。", "fun": "さびたボルトがまだ使えるかどうかは、見た目だけでは分かりにくいものです。この研究は、顕微鏡の拡大画像とふつうのカメラ画像をAIで対応づけ、さびの広がり方を表す式をデータから探し、それを締め付けの摩擦の変化につなげようとしています。「見た目」から「働き」を推定する橋渡しの発想が面白いところです。", "unverified": "本文を入手できず、使用したデータの規模と予測の精度の数値は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "出力の飽和を利用して非線形系を同定する励起設計", "title": "Controlled Excitation for Identification of Nonlinear Systems with Saturated Outputs", "url": "https://arxiv.org/abs/2611.09188", "authors": "Adel Malik Annabi (McTAO ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Annabi, A. M., Pomet, J.-B., Prandi, D., & Sacchelli, L. (2026). Controlled Excitation for Identification of Nonlinear Systems with Saturated Outputs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09188", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "出力が「未知の行列×既知の飽和関数（状態）」の形の非線形系で、未知の行列を出力から正確に同定できる励起入力を、飽和を逆に利用して明示的に作る方法を示した（抄録）。", "p3": "幾何的な到達可能性の条件のもとで、状態を飽和関数が決まった値をとる領域へ導く開ループの制御を導いた。状態の測定は不要で、非線形部分の構造を知らなくてよく、回帰の説明変数が事前に分かるため、未知の行列を閉形式の回帰で正確に求められる（抄録）。", "p5": "成分ごとの飽和では、この条件は独立な2つの制御方向でも一般に成り立つ。より強い仮定と十分な出力があれば、出力フィードバックで状態の正確な復元と線形にパラメータ化された力学の同定も可能になる。測定雑音への頑健性を解析し、雑音のある数値例で示した（抄録）。", "fun": "センサが振り切れてしまう（飽和する）と、ふつうは情報が失われて困ります。この研究は逆に、振り切れた状態では値が分かっていることを利用し、わざと振り切れる領域へ系を動かして未知の部分を正確に求めました。邪魔者だった飽和を手がかりに変える発想の転換が面白いところです。", "unverified": "本文を入手できず、数値例の系と、雑音の大きさに対する同定誤差の大きさは未確認。"}}, {"id": "pr42", "rank": 42, "headline": "PINNの学習で各損失の寄与が変わる過程を解析", "title": "Task-Contribution Dynamics of Adam in Physics-Informed Neural Networks: Slow-Manifold Analysis and Gradient Modulation", "url": "https://arxiv.org/abs/2611.08910", "authors": "Enzhan Zheng ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Zheng, E., & Song, X. (2026). Task-Contribution Dynamics of Adam in Physics-Informed Neural Networks: Slow-Manifold Analysis and Gradient Modulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08910", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "物理情報付きニューラルネット（PINN）をAdamで学習するとき、競合する損失の各成分が更新に寄与する割合がどう変わるかを解析し、それにもとづく改良版GMAdamを提案した（抄録）。", "p3": "課題ごとの指標で学習を滑らかな変化・間欠的なスパイク・持続的な振動の3段階に分け、初期の滑らかな段階を離散時間の解析と連続時間の特異摂動の枠組みで調べた。遅い多様体の1次近似から寄与の再配分を決める2つの要因を特定し、どちらもAdamの共有の2次モーメント推定に関わることを示した（抄録）。", "p5": "課題ごとの2次モーメント推定で勾配を調整するGMAdamは、高周波のポアソン方程式と波動方程式、アレン・カーン方程式、2次元の蓋駆動キャビティ流（Re=100、400）で、同程度の計算費用でAdaTaskより予測精度を一貫して改善した（抄録）。", "fun": "物理の法則を守りながら学習するAIは、「方程式を満たす」「境界の条件を満たす」など複数の目標を同時に追うため、どれかが置き去りになりがちです。この研究は、学習の途中で各目標の取り分がどう入れ替わるかを、ゆっくり動く部分に注目して解析しました。学習の仕組みの中に「綱引き」を見つけた点が面白いところです。", "unverified": "本文を入手できず、精度の改善の具体的な数値は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "対数ひずみ空間の弾塑性モデルの解析とFEM実装", "title": "Mathematical analysis and vectorized FEM implementation of logarithmic strain space framework for finite strains: a case study on elastoplasticity", "url": "https://arxiv.org/abs/2611.09492", "authors": "Miroslav Frost ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Frost, M., Kruž\\'ık, M., Moskovka, A., & Valdman, J. (2026). Mathematical analysis and vectorized FEM implementation of logarithmic strain space framework for finite strains: a case study on elastoplasticity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09492", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "有限ひずみの非線形連続体力学で使う対数ひずみ空間の枠組みについて、線形移動硬化のフォン・ミーゼス弾塑性モデルを例に、解の存在の証明とベクトル化した有限要素の実装を示した（抄録）。", "p3": "2次のヘンキー・エネルギーに強圧性と下半連続性が欠ける問題を高階勾配の正則化で補い、時間とともに変わるディリクレ境界条件のもとで速度に依存しない準静的な発展のエネルギー解の存在を証明した。MATLABでページ単位の行列関数と独自のベクトル化ライブラリを使って実装した（抄録）。", "p5": "ベンチマークでは局所的なテンソル演算が大きく高速化し、対数ひずみの手法は計算費用をあまり増やさず、大きな回転と変形を頑健に扱えた（抄録）。", "fun": "ゴムを大きくねじったり、金属を大きく曲げたりする計算では、変形の測り方そのものが難しくなります。この研究は、「対数ひずみ」という測り方を使う方法に、解がちゃんと存在するという数学の裏付けを与え、さらに高速に計算できるプログラムも作りました。理論と実装の両方から足場を固めた点が面白いところです。", "unverified": "本文を入手できず、高速化の倍率など具体的な数値は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "無形投資をする企業ほど資金制約に直面", "title": "Firms’ Intangible Investments and Financing Constraints: Evidence from Survey Data", "url": "https://econpapers.repec.org/RePEc:rif:wpaper:153", "authors": "Pajarinen ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "研究開発など無形資産に投資する企業ほど資金制約に直面しやすいことを、フィンランドと欧州の4つの企業調査で一貫して示した報告書（抄録）。", "p3": "フィンランドのSMEバロメーター（2018年秋〜2026年春）、Tesiの成長企業調査（2024〜2025年）、ECBのSAFE調査（2015〜2025年）、EIBの投資調査EIBIS（2016〜2025年）を比較・分析した（抄録）。", "p5": "4つの調査で、無形投資、とくに研究開発と革新的な活動を行う企業ほど資金制約に直面しやすかった。フィンランドでは2022年以降に資金制約が増え、他のEU諸国に対する資金調達の優位が縮み、スウェーデンに対しては不利に転じた（抄録）。", "fun": "工場の機械は借金の担保になりますが、アイデアやソフトウェアのような目に見えない資産は担保になりにくいものです。この報告は、そうした無形の資産に投資する会社ほどお金を借りにくいことを、4つの別々の調査で確かめました。未来の成長を担う投資ほど資金が回りにくいという矛盾が面白いところです。", "unverified": "本文を入手できず、資金制約の定義と、調査ごとの差の大きさは未確認。"}}, {"id": "pr45", "rank": 45, "headline": "交通量で需要モデルを校正するかOD表を直すか", "title": "Calibrating demand models versus adjusting OD matrices with traffic counts: a controlled comparison", "url": "https://arxiv.org/abs/2611.09678", "authors": "Yue Li ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Li, Y., Chen, S., & Jin, Y. (2026). Calibrating demand models versus adjusting OD matrices with traffic counts: a controlled comparison (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09678", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "交通量の観測で需要を推定するとき、OD表（出発地・目的地の交通量）を個別に直す方法と、需要モデルの少数の係数を校正する方法のどちらがよいかを、既知の需要を持つ合成実験で比べた（抄録）。", "p3": "同じ事前情報・交通量・均衡配分のもとで、5つの重力モデルの係数を推定する方法、発着の調整係数を推定する方法、個々のOD交通量を推定する方法の3つを、東マサチューセッツとシカゴの道路網で、モデルの誤指定の形を変えて比べた（抄録）。", "p5": "需要がモデルの仮定に従うときは5係数の校正の方がOD需要の回復と未使用の区間の交通量予測に優れた。個別の補正は66条件中65条件で校正用の交通量に最もよく合ったが、うち45条件ではOD需要の回復が3手法で最も不正確だった（抄録）。", "fun": "観測した交通量に一番ぴったり合う推定が、本当の人の流れを一番よく表しているとは限りません。この研究では、細かく調整して観測にぴったり合わせた方法ほど、本当の出発地と目的地の組合せを外すことが多くありました。「データに合う」ことと「正しい」ことの違いがはっきり見える点が面白いところです。", "unverified": "本文を入手できず、誤指定の具体的な形と、各手法の誤差の大きさの数値は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "財務文書の読取りを誤りの重大さで評価する枠組み", "title": "Human-Centred, Risk-Constrained Evaluation of Financial Document Recognition: Evidence, Critical Errors, and Selective Automation", "url": "https://arxiv.org/abs/2611.02775", "authors": "Subodh Lonkar", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Lonkar, S. (2026). Human-Centred, Risk-Constrained Evaluation of Financial Document Recognition: Evidence, Critical Errors, and Selective Automation (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.02775", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を使用", "preprint": true, "short": true, "p1": "財務文書の自動読取りを、文字の誤り率ではなく、人や組織が頼る財務事実を正しく取り出せるかで評価する、人間中心でリスクを制約した評価の枠組みを示した（抄録）。", "p3": "画面上の根拠の領域と結びついた型付きの財務事実を定義し、逐語の転記・決定論的な正規化・業務上の解釈を分ける。金額・識別子・符号・期間などの重大な項目の誤りには片側の不確実性の上限を使う非補償的な合格基準を設け、自動化する範囲を、残るリスク・人の確認能力・費用を考えた振り分けの問題として定式化した（抄録）。", "p5": "誤りがゼロでも危険の上限はゼロにならないことや、補償的な採点の限界を形式的に示した。新しいモデル・データ・実証結果はなく、理論と方法論の貢献だと明記している（抄録）。", "fun": "請求書を読み取るAIが文字を99%正しく読めても、金額の桁を1か所間違えれば大問題です。この論文は、平均点ではなく「致命的な間違いがないか」で合否を決め、自信のないものだけを人に回す仕組みを考えました。「誤りが0件だった」でも安全とは言い切れないことを示した点が面白いところです。", "unverified": "実証の結果はなく、枠組みを実際の文書で試した場合の性能は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "不正企業の株を持った判事も量刑はほぼ変わらない", "title": "How does judges' personal exposure to financial fraud affect white-collar sentencing?", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:124397", "authors": "Nguyen ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "財務不正を起こした企業の株を持っていた連邦判事が、ホワイトカラー犯罪の量刑で被告に厳しくなるかを、事前に登録した方法で調べ、影響はほとんどないことを示した（抄録）。", "p3": "判事が不正企業の株を直接保有していたことから財務不正への個人的な接触を測る指標を作り、事件の判事への無作為な割当てを利用して、他の企業の事件での被告に有利な判断と公判前の申立ての認容を調べた（抄録）。", "p5": "どちらの仮説にも支持する証拠はほとんどなく、最も深刻な不正を除けば、判事が個人的な被害の経験を関連する事件の量刑に持ち込む可能性は低いと結論した（抄録）。", "fun": "自分が損をした経験があると、似た事件の判断が厳しくなりそうな気がします。この研究は、裁判官が株で不正の被害を受けた場合を調べましたが、量刑への影響はほとんど見つかりませんでした。事件を裁判官にくじ引きのように割り当てる仕組みを「自然の実験」に使い、仮説が外れたことを正直に示した点が面白いところです。", "unverified": "本文を入手できず、対象の判事と事件の数、最も深刻な不正での結果の詳細は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "小売の環境CSRの認知はごみの行動に結びつくか", "title": "Retail Environmental Responsibility and the Consumer Waste Behaviour Gap: Evidence from South Africa", "url": "https://doi.org/10.21203/rs.3.rs-11400633/v1", "authors": "Ronald Mashamba ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Mashamba, R., Dalu, T., & Dalu, M. T. B. (2026). Retail Environmental Responsibility and the Consumer Waste Behaviour Gap: Evidence from South Africa. https://doi.org/10.21203/rs.3.rs-11400633/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "小売の環境CSRは顧客によく知られ説得力も感じられていたが、それだけでは家庭のリサイクルなどの行動には結びつかないことを、南アフリカの調査で示した（抄録）。", "p3": "ムボンベラの2つの商業施設で成人の顧客281人を調査し、環境CSRの認知・情報経路・効果の認識・廃棄行動への影響の認識・家庭のリサイクル・店舗の回収への参加などを測り、66組の相関をベンジャミニ・ホッホベルク法で補正したスピアマンの順位相関で分析した（抄録）。", "p5": "認知していたのは279人中194人（69.5%）だったが、家庭ごみをリサイクルしていたのは75人（26.7%）だった。認知は影響を受けたという認識とは関連したが、家庭のリサイクルや店舗の回収への参加とは関連せず、参加には学歴と年齢の方が一貫して関連した（抄録）。", "fun": "お店の環境キャンペーンを知っていて、「影響を受けた」と答える人が多くても、実際にごみを分別している人は4人に1人ほどでした。知っていることと行動することの間には大きな溝があり、近くに回収の仕組みがあるかどうかの方が大事かもしれません。気持ちと行動のずれが数字で見える点が面白いところです。", "unverified": "本文を入手できず、障壁の内容と、学歴・年齢との関連の大きさは未確認。"}}, {"id": "pr49", "rank": 49, "headline": "利用者の解釈の傾向で推薦の説明の順序を個別化", "title": "Learning from How Users Interpret: Personalizing Recommendation Explanation Order", "url": "https://arxiv.org/abs/2611.08785", "authors": "Deo Munduku ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Munduku, D., & Negre, E. (2026). Learning from How Users Interpret: Personalizing Recommendation Explanation Order (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08785", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "推薦の理由を説明する文の中身と言い回しは変えずに、利用者の過去の文章の解釈の傾向から作った履歴プロファイルで文の並べ方を個別化すると、理解が高まることを示した（抄録）。", "p3": "122人の参加者内実験で、過去の解釈を情報の選択・相対的な目立ち・関係の組立ての3次元で表し、本人のプロファイル（OWN）、他人のプロファイル（DONOR）、集団のプロファイル（POP）、プロファイルを使うLLM（PROFILE LLM）の4つの並べ方を比べた（抄録）。", "p5": "客観的な理解の正答率はOWNが86.5%で、DONOR（66.0%）、POP（63.9%）、PROFILE LLM（73.0%）を上回り、混合効果分析でも他の各手順より高かった。推薦の受け入れには全体として確かな差がなかった（抄録）。", "fun": "同じ説明文でも、並べる順番を変えるだけで分かりやすさが変わります。この実験では、その人が過去に文章をどう読み取ったかの癖に合わせて順番を変えると、理解の正答率が大きく上がりました。中身を一言も変えずに「順番だけ」で伝わり方が変わるという点が面白いところです。", "unverified": "本文を入手できず、推薦の対象（商品の種類など）と、関係の組立ての次元の測り方の詳細は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "AIインフラの電力機器は前払いで先に確保される", "title": "Buying Capacity Before It Exists Advance Payments and Supply Commitments in AI Infrastructure 6 November 2026", "url": "https://doi.org/10.21203/rs.3.rs-11641481/v1", "authors": "Fuli Yang ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Yang, F., Huang, J., & Qiu, T. (2026). Buying Capacity Before It Exists Advance Payments and Supply Commitments in AI Infrastructure 6 November 2026. https://doi.org/10.21203/rs.3.rs-11641481/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIインフラに必要な電力機器の前払いと供給約束の契約が、完成前に投資を調整し、新規の受注が減っても生産の義務を進め続ける仕組みを分析した（抄録）。", "p3": "大手の電力機器メーカー3社の開示、買い手との契約、完了・中止した事業の履歴を組み合わせ、契約条項が利用権・価格・購入義務・解約権を分けている点を整理し、ストックとフローの枠組みで予約の進行と受注の関係を示した（抄録）。", "p5": "GE Vernovaの四半期の確定受注残の追加は2026年第1〜第3四半期に8 GWから16 GWに倍増した一方、新規の約束は21 GWから11 GWに減り、9か月の確定受注残の追加の80.6%は以前の予約の転換によるものだった（抄録）。", "fun": "新しい注文が減っているのに、工場の確定した仕事は増えている。一見矛盾するこの現象を、この研究は「予約が時間差で本契約に変わる」仕組みで説明しました。お店の予約が後から本注文になるように、過去の約束が投資の勢いを支え続けるという見方が面白いところです。", "unverified": "本文を入手できず、3社のうち残る2社の数値と、中止した事業の分析の詳細は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経営学", "headline": "生成AIの組込みで小規模出店者の売上が51.6%増", "title": "AI as Shared Business Infrastructure: Firm Growth and the Distribution of Gains", "url": "https://doi.org/10.3386/w36003", "authors": "Panle Jia Barwick ほか", "venue": "NBER Working Paper", "apa": "Barwick, P. J., Fang, L., Liu, J., Xu, H., & Yuan, Z. (2026). AI as Shared Business Infrastructure: Firm Growth and the Distribution of Gains (NBER Working Paper N
