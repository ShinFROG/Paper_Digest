distribution", "url": "https://doi.org/10.1016/j.jpubeco.2026.105812", "authors": "John Guyton ほか", "venue": "Journal of Public Economics", "date": "2026-11-09", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Guyton, J., Langetieg, P., Reck, D., Risch, M., & Zucman, G. (2026). Tax evasion at the top of the income distribution. Journal of Public Economics, 264, 105812. https://doi.org/10.1016/j.jpubeco.2026.105812", "why": "所得分布の最上位層の脱税を扱った公共経済学の主要誌の論文（抄録は取得できず、内容は題名の範囲）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、所得分布の最上位層、つまり最も所得の高い人々の脱税の実態や規模を扱った研究とみられる。掲載誌は公共経済学の主要誌である（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「最もお金持ちの人たちは、どれくらい税を逃れているのか」です。高所得者の所得は株や海外の資産など複雑な形をとり、税務調査でも見えにくいことがあります。格差を正しく測るには隠れた所得をどう見積もるかが鍵になる、という問題設定が面白いところです。", "unverified": "抄録・本文を入手できず、対象の国、データ、推定の方法と結果はすべて未確認。"}}, {"id": "jn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "経済的脅威の下で管理者の機会への注意を広げる", "title": "Counteracting threat bias: A longitudinal field experiment testing two interventions that expand managerial attention to opportunities under economic threat.", "url": "https://doi.org/10.1037/apl0001436", "authors": "Nina Sirola", "venue": "Journal of Applied Psychology", "date": "2026-11-09", "sjr": 5.473, "citescore": 15.0, "citescore_year": "2025", "apa": "Sirola, N. (2026). Counteracting threat bias: A longitudinal field experiment testing two interventions that expand managerial attention to opportunities under economic threat. Journal of Applied Psychology. https://doi.org/10.1037/apl0001436", "why": "題名から、経済的脅威のもとで管理者の注意が脅威に偏るのを打ち消し機会へ広げる2つの介入を、縦断的なフィールド実験で検証した研究とみられる（抄録は取得できず）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexで題名から見つけた付属資料の記録の説明を使用（論文の抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "経済的な脅威が続く状況で、管理者の注意を機会にも向けさせる2つの短い介入（機会型・均衡型）を、インドの管理者を対象とする縦断的なフィールド実験で検証した研究（付属資料の説明）。", "p3": "コロナ禍の景気後退期のインドで管理者414人を5時点にわたって追跡し、物事の捉え方を形づくる短い介入を行った。制御焦点は自己報告で、機会と脅威に関わる発言（ボイス）は、条件を知らされていない上位の管理者が評定した（付属資料の説明）。", "p5": "未確認（入手できた記録は付属資料の説明で、結果の記載がない）。", "fun": "不況で会社が危ないとき、管理職の頭は「危険」でいっぱいになり、チャンスを見落としがちです。この研究は、物事の見方を少し変える短い働きかけで、管理職が機会にも目を向けて意見を言えるようになるかを、実際の職場で長期にわたって確かめました。脅威の中で視野を広げる方法を探る点が面白いところです。", "unverified": "論文の抄録・本文を入手できず、介入の効果の有無と大きさは未確認。"}}, {"id": "jn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "キャリア態度のプロファイルを再定義・更新", "title": "Redefining and updating career attitude profiles and their effectiveness in a postinflection career landscape.", "url": "https://doi.org/10.1037/apl0001441", "authors": "Daniel D. Goering ほか", "venue": "Journal of Applied Psychology", "date": "2026-11-09", "sjr": 5.473, "citescore": 15.0, "citescore_year": "2025", "why": "題名から、キャリア環境の転換点の後でキャリア態度のプロファイルとその有効性を再定義・更新した研究とみられる（抄録は取得できず）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、働き方の大きな転換点を経た後のキャリア環境で、人々のキャリアに対する態度の類型（プロファイル）を再定義・更新し、それぞれの類型の有効性を調べた研究とみられる。掲載誌は応用心理学の主要誌である（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「働き方が大きく変わった後、キャリアに対する人々の構えはどんな型に分かれ、どの型がうまくいくのか」です。転職や在宅勤務が当たり前になると、一つの会社で昇進を目指す以外の道も増えます。昔の分類を今の時代に合わせて作り直そうとする点が面白いところです。", "unverified": "抄録・本文を入手できず、類型の内容、調査の対象、結果はすべて未確認。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "職場のハラスメントを目撃した傍観者の思考と感情", "title": "Can I Even Help Them? Thoughts, Feelings, and Cognitions of Bystanders to Gender-Based Violence and Harassment in the Workplace", "url": "https://doi.org/10.1007/s10551-026-06507-1", "authors": "Kristian Stampe Nielsen ほか", "venue": "Journal of Business Ethics", "date": "2026-11-09", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "why": "題名から、職場のジェンダーに基づく暴力・ハラスメントを目撃した傍観者の考え・感情・認知を調べた研究とみられる（抄録は取得できず）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、職場のジェンダーに基づく暴力やハラスメントを目撃した傍観者が、助けられるかどうかについて何を考え、何を感じ、どう認知しているかを調べた研究とみられる。掲載誌は経営倫理の学術誌である（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「職場で嫌がらせを目撃したとき、人はなぜ動けないのか」です。「自分に助けられるだろうか」という迷いの中には、恐れや無力感、状況の読み違いなどが混ざっているはずです。傍観者の心の中を細かく見ることで、介入を後押しする方法を探ろうとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、研究の方法と結果はすべて未確認。"}}, {"id": "jn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "同僚と市民の無礼が重なると職員は消耗するか", "title": "Exhaustion intensified? The confluence of coworker and citizen incivility in local government", "url": "https://doi.org/10.1080/14719037.2026.2758867", "authors": "Leisha DeHart-Davis ほか", "venue": "Public Management Review", "date": "2026-11-09", "sjr": 2.54, "citescore": 11.5, "citescore_year": "2025", "why": "題名から、地方政府の職員が同僚と市民の両方から受ける無礼の重なりが情緒的な消耗を強めるかを調べた研究とみられる（抄録は取得できず）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、地方政府の職員が同僚からの無礼と市民からの無礼の両方を受けるとき、その重なりが情緒的な消耗を強めるかを調べた研究とみられる。掲載誌は行政経営の学術誌である（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「職場の中と外の両方で無礼な扱いを受けると、疲れは足し算以上になるのか」です。役所の窓口の職員は、市民からの心ない言葉と、同僚からの冷たい態度の両方にさらされることがあります。二つの方向からのストレスの「合流」に注目している点が面白いところです。", "unverified": "抄録・本文を入手できず、調査の対象と結果はすべて未確認。"}}, {"id": "jn22", "rank": 22, "field": "心理学・認知科学", "headline": "集団間の接触は量と質が並行して伸びる", "title": "The more, the better? Evidence of parallel growth in intergroup contact quantity and quality over time.", "url": "https://doi.org/10.1037/pspi0000538", "authors": "Rose Meleady ほか", "venue": "Journal of Personality and Social Psychology", "date": "2026-11-09", "sjr": 3.767, "citescore": 13.4, "citescore_year": "2025", "why": "題名から、集団間の接触の量と質が時間とともに並行して増えることを示した研究とみられる（抄録は取得できず）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexで題名から見つけた記録の抄録を使用", "preprint": false, "short": true, "p1": "集団間の接触の量（頻度）と質は時間とともに一緒に伸び、接触の頻度が増えるほど接触の質も良くなることを、4つの縦断研究で示した（抄録）。", "p3": "英国の学校統合を経験する白人とアジア系の生徒（660人、3時点）、北アイルランドの平和構築に参加する若者（592人、3時点）、大学に進む英国と留学生の学生（527人、4時点）、北アイルランドの中等教育を始める子ども（3,057人、3時点）を、潜在成長モデルで分析した（抄録）。", "p5": "すべての研究で、接触の頻度がより急に増えるほど交流の質もより大きく改善する同時成長がみられた。肯定と否定を分けて測った研究3・4では、接触の量の増加は交流の肯定的な面の増加と関連したが、否定的な面の変化は小さく頻度とも有意に関連しなかった（抄録）。", "fun": "違う集団の人と仲良くなるには、会う回数を増やせばよいのでしょうか、それとも中身のよい出会いが大事なのでしょうか。この研究は、4つの場面の長期の追跡で、会う回数が増えるほど交流の中身も良くなっていく「一緒の成長」を見つけました。接触を固定した性質でなく、育っていく経験として捉える点が面白いところです。", "unverified": "本文を入手できず、成長の大きさの数値と、多数派と少数派での違いは未確認。"}}, {"id": "jn23", "rank": 23, "field": "心理学・認知科学", "headline": "繰り返しはありえない主張への信念をより強める", "title": "Repetition increases belief in implausible statements more than for plausible statements", "url": "https://doi.org/10.1016/j.cognition.2026.106780", "authors": "Reed Orchinik ほか", "venue": "Cognition", "date": "2026-11-07", "citescore": 5.8, "citescore_year": "2025", "why": "題名から、繰り返し聞くことで主張を信じやすくなる効果が、もっともらしい主張よりありえない主張で大きいことを示した研究とみられる（抄録は取得できず）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "繰り返し聞くと信じやすくなる「真実性の錯覚効果」は、もともともっともらしくない主張でむしろ強いことを、933人のオンライン実験で示した（抄録）。", "p3": "雑学の文について、各参加者が個々の文に事前に置いていた信念の強さを測り、繰り返しによる信念の増加と事前の信念の関係を精密に推定した（抄録）。", "p5": "参加者の事前の信念が低い文でも錯覚効果ははっきり現れ、しかも当初もっともらしくないと思われた文の方が効果が強かった（抄録）。", "fun": "同じことを何度も聞くと、本当らしく思えてくる現象があります。「でも明らかにおかしな話なら大丈夫だろう」と思いがちですが、この実験では、最初にありえないと感じた話ほど、繰り返しで信じる方向へ大きく動きました。うその情報が繰り返し流れることの怖さを数字で示した点が面白いところです。", "unverified": "本文を入手できず、効果の大きさの数値と、使った雑学の文の詳細は未確認。"}}, {"id": "jn24", "rank": 24, "field": "心理学・認知科学", "headline": "人々が考える「道徳的な行為者」の概念", "title": "The folk concept of moral agency", "url": "https://doi.org/10.1016/j.cognition.2026.106753", "authors": "Joanna Demaree-Cotton ほか", "venue": "Cognition", "date": "2026-11-06", "citescore": 5.8, "citescore_year": "2025", "why": "題名から、一般の人が道徳的な行為者性（道徳的な責任を負える存在であること）をどう捉えているかを調べた研究とみられる（抄録は取得できず）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "一般の人がもつ「道徳的な行為者」の概念を、哲学的な分析と2つの実証研究で調べ、意図的な行為・道徳的な行為・責任ある行為の3つの要素を区別していることを示した（抄録）。", "p3": "道徳的な行為者性を、意図的な行為（単なる振る舞いでなく行為すること）、道徳的な行為（正しく・誤って行為すること）、責任ある行為（非難に値すること）に分け、さまざまな存在への帰属と、その存在に認める心理的・行動的な能力との関係を調べた（抄録）。", "p5": "人々は存在によって異なる程度の道徳的な行為者性を認め、3つの要素を区別していた。帰属は能力の認識で部分的にしか説明されず、意図的な行為は欲求・信念・感覚などの心的状態と、道徳的な行為と責任は「深い自己」を持つ能力の認識と結びついていた（抄録）。", "fun": "ロボットや動物、子どもは「悪いことをした」と責められる存在でしょうか。この研究は、人が「わざとやった」「善悪のある行いをした」「責任がある」を区別して判断していることを示しました。責任を問うには、心があるだけでなく「本当の自分」のようなものがあると感じられることが大事らしいという点が面白いところです。", "unverified": "本文を入手できず、対象にした存在の種類と参加者数は未確認。"}}, {"id": "jn25", "rank": 25, "field": "心理学・認知科学", "headline": "時空間の文脈から本当の記憶と偽の記憶を見分ける", "title": "Probing spatiotemporal context reveals differences between true and false memories", "url": "https://doi.org/10.1016/j.cognition.2026.106782", "authors": "Brynn E. Sherman", "venue": "Cognition", "date": "2026-11-07", "citescore": 5.8, "citescore_year": "2025", "why": "題名から、記憶の時空間的な文脈を調べることで本当の記憶と偽の記憶の違いを明らかにした研究とみられる（抄録は取得できず）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "偽りの記憶でも「いつ・どこで」という時空間の文脈を問うと、本当の記憶との違いが確率的な手がかりとして現れることを示した（抄録）。", "p3": "関連語のリストから提示されていない語を誤って思い出させるDRM課題で、記憶した語の時間と場所の文脈の報告の一貫性と、文脈への確信度を、本当の記憶と偽りの記憶で比べた（抄録）。", "p5": "文脈の報告の一貫性は本当の記憶と偽りの記憶で異なり、文脈への確信度も、その語に出会ったという確信度を統制しても異なった。ただしこの効果は条件によって変わり、状況によっては偽りの記憶にも本物らしい文脈の痕跡があるように見えた（抄録）。", "fun": "見ていないものを「確かに見た」と思い込む偽りの記憶は、本人にも区別がつきにくいものです。この研究は、「それはいつ、どこで見た？」と文脈を尋ねると、本当の記憶と偽りの記憶で答えのぶれ方が違うことを見つけました。ただし偽りの記憶が文脈まで本物らしくなる場合もあり、記憶の再構成の巧みさが面白いところです。", "unverified": "本文を入手できず、実験の数と参加者数、効果の大きさは未確認。"}}, {"id": "jn26", "rank": 26, "field": "心理学・認知科学", "headline": "高齢者の意味処理が速いのは表象の発達のため", "title": "Older yet faster: Representational development explains accelerated semantic processing in older adults.", "url": "https://doi.org/10.1037/rev0000652", "authors": "Ying Li ほか", "venue": "Psychological Review", "date": "2026-11-09", "sjr": 3.222, "citescore": 13.1, "citescore_year": "2025", "why": "題名から、高齢者で意味処理が速くなる現象を、生涯にわたる表象の発達で説明する理論研究とみられる（抄録は取得できず）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexで題名から見つけた別の記録の抄録を使用", "preprint": false, "short": true, "p1": "高齢者で単語の意味の処理が若者より速いことを示し、それを衰えではなく、生涯の学習による概念の表象の変化で説明した（抄録）。", "p3": "3つの研究で、単語の意味へのアクセスを要する課題の反応を70〜80歳と18〜25歳で比べ、意味の評定課題から概念の表象の変化を推定し、累積的な言語経験からその変化が生じることを学習のシミュレーションで示した。異なる標本・課題・刺激で再現も行った（抄録）。", "p5": "課題が蓄積した知識と合う場合、高齢者は若者より意味処理が速く、衰えに基づく説明では説明できなかった。一方、学習した表象に課題と合わない情報が含まれる場合は、高齢者の表象の変化と速さの利点が小さくなるという境界条件も示した（抄録）。", "fun": "年をとると頭の回転が遅くなる、と思われがちです。ところがこの研究では、言葉の意味を判断する課題で、70代の人の方が20歳前後の若者より速く答えました。長い人生で言葉に触れ続けた経験が、頭の中の「意味の地図」を作り替えていたのです。衰えではなく「学びの蓄積」として老いを見る視点が面白いところです。", "unverified": "本文を入手できず、反応時間の差の大きさとシミュレーションのモデルの詳細は未確認。"}}, {"id": "jn27", "rank": 27, "field": "心理学・認知科学", "headline": "自己愛の対抗型は満足度を下げ、称賛型は上げる", "title": "Two faces of narcissism among university students: ​Associations between narcissistic rivalry, narcissistic admiration, subjective well-being, and student satisfaction", "url": "https://doi.org/10.1007/s11218-026-10313-y", "authors": "Stephanie Hanke ほか", "venue": "Social Psychology of Education", "date": "2026-11-09", "sjr": 1.256, "citescore": 5.1, "citescore_year": "2025", "why": "自己愛を称賛（自己顕示）と対抗（自己防衛）の2つの戦略に分ける枠組みで、大学生の2つの研究（632人、892人）を経路分析した。対抗型は生活満足・気分・学生満足のすべての次元を下げ自己疑念を高めた一方、称賛型は生活満足と気分を高め、学習内容への満足を高めたが学習条件への満足とは関連しなかった。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "自己愛を称賛（自己顕示）と対抗（自己防衛）の2つの戦略に分けると、対抗型は大学生の幸福感と学生満足を下げ、称賛型は一部を高めることを示した（抄録）。", "p3": "自己愛的な称賛・対抗の概念にもとづき、2つの研究（632人、892人）で経路分析を行い、生活満足・気分・自己疑念と、学習内容・学習条件・ストレス対処などの学生満足の次元との関連を調べた（抄録）。", "p5": "対抗型は生活満足・気分と測定したすべての学生満足の次元を負に予測し、自己疑念を正に予測した。称賛型は生活満足と気分を高め自己疑念を下げ、学習内容への満足と全体の学生満足を高めたが、学習条件や学業ストレスへの対処の満足とは関連しなかった（抄録）。", "fun": "「自分はすごい」と思いたい気持ちには、自分を売り込む面と、自分を脅かす相手を攻撃して守る面があります。この研究では、守りの面が強い学生は満足度も気分も低く、売り込みの面が強い学生はむしろ満足度が高い面もありました。同じ「自己愛」でも向きによって結果が逆になる点が面白いところです。", "unverified": "本文を入手できず、経路係数の大きさと2つの研究の対象の違いは未確認。"}}, {"id": "jn28", "rank": 28, "field": "経営学", "headline": "女性の経営者と家族の影響が企業リスクを変えるか", "title": "Risk, gender, and family effect: How female leadership shapes corporate risk?", "url": "https://doi.org/10.1007/s11846-026-01076-z", "authors": "Merve Busra Altundere-Dogan ほか", "venue": "Review of Managerial Science", "date": "2026-11-09", "sjr": 2.587, "citescore": 21.2, "citescore_year": "2025", "why": "題名から、女性のリーダーシップと家族の影響が企業のリスクに与える効果を調べた研究とみられる（抄録は取得できず）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、女性のリーダーシップが企業のリスクの取り方をどう形づくるかを、家族の影響とあわせて調べた研究とみられる。掲載誌は経営科学の学術誌である（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「女性が経営を率いると、会社は慎重になるのか」です。リスクへの態度の男女差はよく話題になりますが、家族経営かどうかなど会社の事情が絡むと話は単純ではありません。性別と家族という二つの要素の組合せで企業のリスクを見ようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、対象の企業、リスクの測り方、結果はすべて未確認。"}}, {"id": "jn29", "rank": 29, "field": "経営学", "headline": "CMOの存在と政治的つながりと企業業績", "title": "A two-pronged approach in transitional economy: CMO presence, political connection and firm performance", "url": "https://doi.org/10.1007/s10490-026-10204-y", "authors": "Yuxian Liu ほか", "venue": "Asia Pacific Journal of Management", "date": "2026-11-09", "sjr": 1.297, "citescore": 13.5, "citescore_year": "2025", "why": "題名から、移行経済で最高マーケティング責任者（CMO）の存在と政治的つながりが企業業績に与える影響を調べた研究とみられる（抄録は取得できず）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、移行経済（計画経済から市場経済への移行期の国）で、最高マーケティング責任者（CMO）の存在と政治的なつながりという2つの手段が企業業績にどう影響するかを調べた研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「市場が育ちきっていない国では、顧客を向く力と政府とのつながりのどちらが業績を上げるのか」です。市場の仕組みが変わりつつある国では、マーケティングの専門家を置くことと政治的なコネを持つことの両方が意味を持つかもしれません。その組合せを問う「二本立て」の発想が面白いところです。", "unverified": "抄録・本文を入手できず、対象の国、データ、結果はすべて未確認。"}}, {"id": "jn30", "rank": 30, "field": "機械学習", "headline": "会話しながら動くエージェントの実時間の社会的行動", "title": "ProAct: Harnessing Streaming Motion Generation and Agentic Reasoning for Realtime Embodied Social Interaction", "url": "https://doi.org/10.1145/3842576", "authors": "Zeyi Zhang ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "低遅延で動作と発話を生成する行動系と、対話と視覚の文脈を長期に推論して自発的な働きかけを決める認知系を組み合わせ、厳しい遅延の制約のもとで実時間の身体的な社会的対話を行う枠組みProActを示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "低遅延で動作と非言語の振る舞いを生成する行動系と、対話と視覚の文脈を長期に推論して自発的な働きかけを決める認知系を組み合わせ、実時間の身体的な社会的対話を行う枠組みProActを示した（抄録）。", "p3": "認知系は効率的な記憶の仕組みと利用者の動機の予測で、いつ自発的に働きかけるべきかを判断し、行動系は意図を条件とするストリーミングのフローマッチング動作生成器で、意図を対話の流れを乱さずに連続的な非言語の振る舞いに変える（抄録）。", "p5": "物理的な人型ロボットに実装し、実世界の利用者研究、動作生成のベンチマーク、自発的な働きかけの検出と抑制を評価する新しいベンチマークProActBenchで検証した（抄録）。", "fun": "人と自然に話すロボットには、相手の話に合わせて体を滑らかに動かす速い反応と、「今は話しかけるべきか」をじっくり考える遅い判断の両方が必要です。この研究は、人の心の働きを思わせる「速い系」と「遅い系」の二本立てでこれを実現しました。ときには「黙っている」ことまで評価する点が面白いところです。", "unverified": "本文を入手できず、利用者研究の参加者数と評価の数値は未確認。"}}, {"id": "jn31", "rank": 31, "field": "機械学習", "headline": "ガウス面素とメッシュを往復させて表面を再構成", "title": "TopoSurfel: Closing the Loop between Gaussian Surfels and Meshes for Surface Reconstruction", "url": "https://doi.org/10.1145/3842512", "authors": "Chuanjin Fan ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "3Dガウススプラッティングから高精度の表面を取り出すのが難しい問題に対し、学習しない微分可能な等値面抽出でガウスの面素と連続メッシュをつなぎ、メッシュに導かれた面素の進化で浮遊物の抑制と穴埋めを行う手法TopoSurfelを示した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "3Dガウススプラッティングから高精度の表面を取り出すため、ガウスの面素（サーフェル）と連続メッシュの間を往復させる枠組みTopoSurfelを示した（抄録）。", "p3": "学習しない微分可能な等値面抽出で連続の代理メッシュを取り出し、そのつながりを使ってメッシュに導かれた面素の進化（法線の整合と形状を考えた密度制御）を行い、浮遊物を抑え表面の穴を埋める。大規模な環境向けに空間を考えた初期化のやり直しも提案した（抄録）。", "p5": "多くの実験で、競争力のある形状再構成の精度と、メッシュにもとづく高品質な新しい視点の画像生成を両立したと報告した（抄録）。", "fun": "たくさんの小さなぼんやりした点（ガウス）で景色を表す技術は、写真のような画像を作るのは得意ですが、きれいな表面の形を取り出すのは苦手です。この研究は、点の集まりとつながった面（メッシュ）の間を行き来させ、互いに直し合うようにしました。二つの表し方の良いところを循環させる発想が面白いところです。", "unverified": "本文を入手できず、比較手法に対する精度の数値は未確認。"}}, {"id": "jn32", "rank": 32, "field": "機械学習", "headline": "CADの操作列を局所的な形状文脈で再帰的に再構成", "title": "CADRec: Reconstructing a CAD Sequence Recursively with Localized Geometric Contexts", "url": "https://doi.org/10.1145/3842561", "authors": "Haoxuan Song ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "入力形状を空間的に局所化した部品へ再帰的に分解し、階層的なCAD記述言語にもとづく局所のCADQueryプログラムで各部品を再構成する枠組みCADRecを示した。DeepCADで学習しFusion360で試験したデータセット間の条件で、平均の面取り距離などの誤差を大きく減らした。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "入力の3D形状を空間的に局所化した部品へ再帰的に分解し、階層的なCAD記述言語にもとづく局所のプログラムで各部品を再構成する、CADの操作列の再構成法CADRecを示した（抄録）。", "p3": "階層の各節点でモデルが部品をさらに分けるか、止めて末端のCADQueryのスクリプトを合成するかを決め、局所のプログラムを全体の座標に戻して合成する。局所の点群の文脈を符号化し、多モーダルLLMの復号器で分割の判断とプログラムを予測した（抄録）。", "p5": "標準のCAD再構成のベンチマークで、形状の忠実さとプログラムの妥当性が従来の系列・コードに基づく手法を上回った。DeepCADで学習し未見のFusion360で試験すると、平均・中央値の面取り距離と無効率をそれぞれ85.8%、67.2%、92.3%減らした（抄録）。", "fun": "完成品の3D形状から、それを作った設計の手順（CADの操作）を逆に推定するのは、料理から作り方を当てるような難しさがあります。この研究は、形を小さな部品に分けてはまた分けるという入れ子の手順で、部品ごとに短い設計プログラムを書かせました。大きな問題を小さく割る発想で、見たことのないデータにも強くなった点が面白いところです。", "unverified": "本文を入手できず、同じデータセット内のベンチマークの具体的な数値は未確認。"}}, {"id": "jn33", "rank": 33, "field": "統計学", "headline": "高次元データの流れをNNで非パラメトリックに監視", "title": "Nonparametric EWMA monitoring of high-dimensional data streams using neural networks", "url": "https://doi.org/10.1080/00207543.2026.2759132", "authors": "Yantong Xue ほか", "venue": "International Journal of Production Research", "date": "2026-11-09", "sjr": 2.215, "citescore": 18.1, "citescore_year": "2025", "why": "題名から、高次元のデータの流れをニューラルネットを使った非パラメトリックな指数加重移動平均（EWMA）管理図で監視する方法とみられる（抄録は取得できず）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、高次元のデータの流れ（多数の変数が同時に時々刻々届くデータ）を、ニューラルネットを使った非パラメトリックな指数加重移動平均（EWMA）管理図で監視する方法を示した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「たくさんのセンサが一斉に送ってくるデータから、異常の始まりをどう見つけるか」です。工場の品質管理では、データの分布を仮定せずに小さな変化をいち早く捉えることが求められます。昔からある移動平均の監視とニューラルネットを組み合わ     "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
