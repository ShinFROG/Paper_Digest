<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

 "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "同じ程度に「公平」と評価される2つの偏り緩和法でも、不利な判定を受けた人が判定を覆すのに必要な変化量（アルゴリズム的救済）の集団差は異なることを示した（抄録）。", "p3": "判定境界までの距離が閉形式で求まる線形分類器を使い、再重み付けと共分散罰則つきロジスティック回帰の2手法を、Adult（性別）とCOMPAS（人種）のデータで30回の無作為分割により比べ、マン・ホイットニーのU検定と順位双列相関で効果量を測った（抄録）。", "p5": "Adultでは2手法の集団公平性の指標はほぼ同じ（SPD −0.087対−0.094、AOD 0.068対0.057）だったが、救済の格差は逆向き（r=0.205対−0.083）で、同じ却下者でも差が残った（抄録）。", "fun": "「男女で合格率が同じ」なら公平だと言えるでしょうか。この研究は、不合格になった人があとどれだけ条件を変えれば合格できるかという「やり直しの距離」に注目しました。合格率の公平さが同じ2つの方法でも、やり直しの負担は集団によって違いました。見る物差しを変えると公平の姿が変わるという点が面白いところです。", "unverified": "本文を入手できず、2手法の具体的な設定と、COMPASでの結果（抄録では探索的な評価とされる）の詳細は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "LLMの注釈は与えた定義より既存の対応に従う", "title": "Definitions, Label Names, or Demonstrations? Auditing What Governs LLM Annotation", "url": "https://arxiv.org/abs/2611.09457", "authors": "Viraj Mishra ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Mishra, V., Gupta, S., Gupta, D., Tai, Y. C., & Li, Q. (2026). Definitions, Label Names, or Demonstrations? Auditing What Governs LLM Annotation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09457", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMによる社会科学テキストの注釈が、研究者の与えた定義に従っているのか、ラベル名や例示との既存の結びつきに従っているのかを見分ける反実仮想の監査法を示した（抄録）。", "p3": "出力ラベルの間で定義を入れ替え、入れ替えた定義に従うか元の対応を保つかを測る。3つの政治テキストのデータセットで、微調整や、近い訓練例を検索して示す注釈も比べた（抄録）。", "p5": "モデルは入れ替えた定義にほとんど従わず、標準的な微調整は元の対応を強めるだけで定義への忠実さを確実には高めなかった。近傍の訓練例を検索する方法は精度を上げたが、その改善の74〜93%は単純なk近傍分類で再現でき、近傍のラベルが予測の大半を担っていた（抄録）。", "fun": "LLMに「この定義で分類して」と頼めば、その通りに分類していると思いがちです。この研究は、定義の中身をわざと入れ替えても結果があまり変わらないことを確かめ、LLMが定義を読むよりも、ラベル名や例から推測していることを示しました。精度が高いことと、指示通りに動いていることは別だという点が面白いところです。", "unverified": "本文を入手できず、使用したモデルの種類と、3つのデータセットの名前・規模は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLMは陰謀論を否定しつつ利用者の党派に配慮", "title": "Political Ingroup and Outgroup Cues Condition How Large Language Models Refute Conspiracy Theories", "url": "https://doi.org/10.31234/osf.io/4yexj", "authors": "Erin B. Fitz ほか", "venue": "PsyArXiv", "date": "2026-11-08", "apa": "Fitz, E. B., & Saunders, K. L. (2026). Political Ingroup and Outgroup Cues Condition How Large Language Models Refute Conspiracy Theories. https://doi.org/10.31234/osf.io/4yexj", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMは陰謀論の大半を否定するが、利用者と陰謀論の当事者の党派の組合せによって応答の仕方を変えることを、事前登録した大規模な実験で示した（抄録）。", "p3": "57の陰謀論、21通りの利用者と当事者の政治的立場の組合せ、OpenAIの7つのLLMで135,845件の会話を作り、否定するか、利用者の視点を認め懸念を肯定する「動機づけられた応答」をするかを測った（抄録）。", "p5": "応答の82%が陰謀論を否定し、20%が動機づけられた応答を示した。動機づけられた応答はたいてい否定と一緒に現れ、陰謀論が利用者の外集団に関わるとき（例：共和党支持の利用者が民主党に関わる陰謀論を尋ねるとき）に多かった（抄録）。", "fun": "AIは陰謀論に「それは違います」と答えることが多いのですが、その言い方は相手の支持政党で変わっていました。相手の気持ちに寄り添う一言を添えるかどうかが、話題の党派と相手の党派の組合せで違ったのです。正しい答えでも「言い方の偏り」がありうるという、AIの公平さの新しい問いが面白いところです。", "unverified": "本文を入手できず、7つのモデルの名前とモデル間の差、動機づけられた応答の判定方法は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "気候市民会議に市民科学を組み込む道具立て", "title": "Bringing Citizen Science into Deliberative Democracy: Insights from Climate Citizens’ Assemblies", "url": "https://doi.org/10.31235/osf.io/q9ja7", "authors": "Julian Vicens ほか", "venue": "SocArXiv", "date": "2026-11-09", "apa": "Vicens, J., Bertomeu, F., Fameli, K. M., Kotrikla, A. M., Polydoropoulou, A., Alvarez, N., & Laniado, D. (2026). Bringing Citizen Science into Deliberative Democracy: Insights from Climate Citizens’ Assemblies. https://doi.org/10.31235/osf.io/q9ja7", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "気候市民会議に市民科学（市民がデータを集め解釈する活動）を組み込むためのツールキットを共同で作り、欧州の2つの市民会議で試した（抄録）。", "p3": "リビングラボでの参加型ワークショップでツールキットを作り、リガとエーダーミュンデの気候市民会議に導入して、参加者と運営者への調査・フォーカスグループ・質的コーディングを組み合わせて分析した（抄録）。", "p5": "市民科学の統合は知識の取り込み・市民の主体性・手続きへの信頼を高めた一方で、運営の負担を増やした。著者らは、熟議の形式に市民科学を構造的に組み込むと民主的な革新の認識的な正統性が広がると論じ、今後の市民会議の設計原則を示した（抄録）。", "fun": "市民会議では、ふつう専門家が用意した資料をもとに話し合います。この研究は、参加者自身が身の回りのデータを集めて読み解く「市民科学」を話し合いに組み込みました。その結果、知識が身につき、話し合いの手続きへの信頼も高まりました。話し合う材料づくりから市民が関わるという発想が面白いところです。", "unverified": "本文を入手できず、調査の回答者数、効果の大きさ、設計原則の具体的な内容は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "AI気象モデルは摂動の成長を物理的に再現しない", "title": "Do AI weather models learn atmospheric perturbation growth characteristics? A FuXi case study based on Breeding of Growing Modes method", "url": "https://doi.org/10.21203/rs.3.rs-11389396/v1", "authors": "Xiao Shang ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Shang, X., Guan, J., Peng, J., Lin, C., & Zhang, L. (2026). Do AI weather models learn atmospheric perturbation growth characteristics? A FuXi case study based on Breeding of Growing Modes method. https://doi.org/10.21203/rs.3.rs-11389396/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "AI気象モデルFuXiが大気の摂動（小さなずれ）の成長の仕方を物理的に学んでいるかを数値モデルMPASと比べ、部分的な統計的関係しか学んでいないことを示した（抄録）。", "p3": "成長モードの育成法（BGM）で摂動を育て、成長の速さ、飽和の大きさ、空間分布、運動エネルギーのスペクトル、回転成分と発散成分への分解を2つのモデルで比べた（抄録）。", "p5": "MPASでは摂動が傾圧・対流の不安定ですばやく成長し約3日で飽和したのに対し、FuXiは最初の2日の成長が極めて遅かった。FuXiでは高波数のスペクトルが平らでエネルギーカスケードがなく、低緯度に非物理的な雑音が残り、発散的な運動を捉えていなかった（抄録）。", "fun": "天気予報のAIは、計算が速く当たりもよいと話題です。しかしこの研究で、わざと小さなずれを入れて育ててみると、AIでは本物の大気のようにずれが育たず、大きな渦から小さな渦へエネルギーが流れる様子も再現されていませんでした。予報が当たることと物理を理解していることは別だ、という点が面白いところです。", "unverified": "本文を入手できず、比較の期間と事例数、アンサンブル予報への具体的な影響の評価は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "環境情報の開示義務化で企業の負債が短期化", "title": "Mandatory environmental disclosure and corporate debt maturity: causal evidence from China", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141434", "authors": "Bai, Jinling", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の上場企業で、環境情報の開示の義務化が企業の負債の満期を短くしたことを、準自然実験で示した（抄録）。", "p3": "2010年の上場企業の環境情報開示の指針を準自然実験とし、2007〜2019年のA株上場企業のパネルデータで差の差分析を行い、事前の自主的な開示の質による調整、銀行依存度別の分析、仕組みの検定を行った（抄録）。", "p5": "開示の義務化は負債の満期を有意に短くし、それまで見えなかった環境の法令順守の費用や負債が明らかになって債権者がリスクを見直す経路が示された。事前の開示の質が高い企業では短期化の効果が約48%弱まった（抄録）。", "fun": "会社に環境の情報を公開させると、お金の借り方まで変わりました。隠れていた環境対策の費用が明らかになると、お金を貸す側は長期で貸すのをためらい、返済期間の短い借入れが増えたのです。もともと情報をよく公開していた会社では影響が小さく、「情報を出す習慣」が守りになるという点が面白いところです。", "unverified": "本文を入手できず、処置群と対照群の定義、満期の測り方、平行トレンドの確認の結果は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "低所得者向け住宅の立地が近隣と入居者に及ぼす影響", "title": "Where Subsidized Housing Lands, and Why It Matters: A Review of LIHTC Siting, Neighborhood Opportunity, and Fair Housing", "url": "https://doi.org/10.20944/preprints202611.0635.v1", "authors": "Zeus Flores", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Flores, Z. (2026). Where Subsidized Housing Lands, and Why It Matters: A Review of LIHTC Siting, Neighborhood Opportunity, and Fair Housing. https://doi.org/10.20944/preprints202611.0635.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の低所得者住宅税額控除（LIHTC）の住宅について、どこに建つか、なぜか、入居者と既存の住民にどう影響するかの研究をつないで整理したレビュー（抄録）。", "p3": "立地の研究、近隣が人の長期的な成果に与える影響の研究、事業が受け入れ地域を変える研究の3つを4つの問いに沿って整理し、立地の決定の各段階に政策の手段を対応させた（抄録）。", "p5": "LIHTCの物件は貧困率と少数派の割合が高い地域に集まり、それは入居者の需要と同じくらい土地・建設市場、用途地域、地元の反対、配分規則を反映していた。入居者の機会を広げることと荒廃した地域へ再投資することの間に本当のトレードオフがあり、その条件は地域で変わると結論した（抄録）。", "fun": "安い家賃の住宅をどこに建てるかは、何十年も続く選択です。豊かな地域に建てれば住む子どもの将来が開け、貧しい地域に建てればその町の再生につながることもあります。どちらにも理由がある「本物の板挟み」を、ばらばらだった研究をつないで描き出した点が面白いところです。", "unverified": "本文を入手できず、取り上げた研究の範囲と、示された政策の手段の具体的な内容は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "人とAIの協働に「目標」の表現層を設ける提案", "title": "Goals as a Representational Layer for Human-AI Collaboration", "url": "https://arxiv.org/abs/2611.08757", "authors": "Gaia Molinaro ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Molinaro, G., Tankelevitch, L., Rintel, S., & Counts, S. (2026). Goals as a Representational Layer for Human-AI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08757", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "生成AIが働く人の文脈で動くようになったいま、人・AI・組織をつなぐ明示的な「目標」の表現層を設けるべきだと提案した立場表明の論文（抄録）。", "p3": "人の目標は階層的で一部が潜在的で、時間とともに変わるため、目標の層は多次元で、本人の言葉と証拠からの推定の両方に基づき、継続的に更新される必要があると論じた（抄録）。", "p5": "実証の結果はなく、目標の層が目の前の依頼と大きな成果をつなぎ、文脈の整理と検索、振り返りと協調、人中心の成果によるAIの訓練・評価の基盤になりうると論じ、目標の推定・社会認知的な摩擦・プライバシー・統治などの課題を挙げた（抄録）。", "fun": "AIに「この資料をまとめて」と頼むとき、AIはなぜそれが必要なのかを知りません。この論文は、人が何を目指しているかという「目標」をAIと共有する仕組みを作るべきだと提案します。目標は大きなものから小さなものまで階層になり、時間とともに変わるので、それをどう表すかが難しいという問題設定が面白いところです。", "unverified": "本文を入手できず、目標の層の具体的な設計例や評価方法が示されているかは未確認。"}}, {"id": "pr25", "rank": 25, "headline": "装着位置の違うIMU信号を拡散モデルで変換", "title": "DiffusionRef-IMU: Guide-Anchored Residual Diffusion for Cross-Location Inertial Measurement Unit Translation", "url": "https://arxiv.org/abs/2611.09323", "authors": "M. M. Golam Hafiz ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Hafiz, M. M. G., Simi, S. A., Islam, M. R., & Mridha, M. F. (2026). DiffusionRef-IMU: Guide-Anchored Residual Diffusion for Cross-Location Inertial Measurement Unit Translation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09323", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ある体の部位で測った慣性センサ（IMU）の信号から、測っていない別の部位の信号を推定する変換で、決定論的な推定のあとに残差だけを拡散モデルで補正する手法を提案した（抄録）。", "p3": "まず決定論的なネットワークで目標の信号を推定し、残る食い違いだけを、その推定を手がかりに固定した残差拡散モデルで直す。被験者を分けた5分割の評価、容量をそろえた比較手法、外部の2データセットでのゼロショット評価で検証した（抄録）。", "p5": "16段のDDIMで平均の正規化RMSEは0.087538となり、決定論的推定のみ（0.090262）や他の残差補正（0.088847、0.088417）を5分割すべてで下回った。4段でも0.087820を窓あたり47.62 msで保った。ゼロショットでは一方のデータで僅かに優れ、もう一方では劣った（抄録）。", "fun": "手首につけたセンサの動きから、腰につけたらどう測れたかを推定できたら便利です。この研究は、まず大まかに推定し、残ったずれだけを生成モデルで仕上げる二段構えにしました。ただし、まったく別の人たちのデータでは効果がはっきりせず、うまくいく範囲と限界の両方を示した点が面白いところです。", "unverified": "本文を入手できず、使用した部位の組合せ、データセットの規模、活動の種類は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "再帰型モデルを観測器として推定誤差の収束を保証", "title": "Provable State Estimation with Recurrent Models", "url": "https://arxiv.org/abs/2611.09217", "authors": "Vincent Andrieu (LAGEPP ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Andrieu, V., Bernard, P., Brivadis, L., Praly, L., & Wolf, C. (2026). Provable State Estimation with Recurrent Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09217", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "再帰型ニューラルネット（RNN）を非線形観測器（状態推定器）として理論的に解析し、推定誤差が指数的に小さくなることを保証する条件を示した（抄録）。", "p3": "RNNを連続時間の潜在力学系（Neural ODE）の離散化とみなし、潜在の流れに縮約（近い軌道どうしが近づく性質）の条件を課す。すると真の物理状態から潜在空間への滑らかで単射な写像が存在し、潜在の速度場を1つのスカラーの利得で大きくすると推定誤差を任意に小さくできることを証明した（抄録）。", "p5": "潜在状態を読み出すMLPに必要な複雑さの上限を示し、離散時間の残差RNNにも保証を拡張した。実際の移動ロボットの課題で、縮約を保証したモデルは通常のGRUより学習が安定で性能も上回り、制約のないGRUも縮約的な力学に収束していた（抄録）。", "fun": "センサの記録から見えない状態を推し量る「推定器」は、AIで作ると便利ですが、なぜうまくいくかの保証がありませんでした。この研究は、近い状態どうしが自然と近づいていく「縮約」という性質を持たせれば、推定の誤差が速く小さくなることを数学的に示しました。よく学習したAIが自然にこの性質を身につけていたという発見も面白いところです。", "unverified": "本文を入手できず、ロボットの課題の内容と性能の数値、利得の大きさと雑音への頑健さの関係は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "多エージェント討論でLLMの事実確認を欺く攻撃", "title": "Debate to Deceive: Poisoning LLM's Fact-Checking via Game-Theoretic Multi-Agent Debate", "url": "https://arxiv.org/abs/2611.08756", "authors": "Liting Huang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Huang, L., Liang, H., Lei, Y., Ma, X., & Ojha, V. (2026). Debate to Deceive: Poisoning LLM's Fact-Checking via Game-Theoretic Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08756", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "人間の討論の構造と修辞を模した多エージェントの討論で、LLMの事実確認の判定を誤らせる攻撃用の文章を作る枠組みD2Dを提案した（抄録）。", "p3": "攻撃の過程を進化ゲームとして定式化し、エージェントがロゴス（論理）・パトス（感情）・エトス（信頼）の修辞戦略を競争の中で適応的に進化させる。戦略を選ぶ層と、その戦略と討論の文脈に沿ってLLMが文章を作る層に分けて、膨大な出力空間を扱う（抄録）。", "p5": "FEVER、HealthVer、CLIMATE-FEVER、SciFactの4つの事実確認ベンチマークで、既存の攻撃を大きく上回り、ほとんどの防御をすり抜けたと報告した（抄録）。", "fun": "うそを見抜くAIをだますために、この研究はAIどうしに「討論」をさせました。論理で攻めるか、感情に訴えるか、信頼性を演出するかという弁論術の作戦を、生き物の進化のように競わせて磨いたのです。説得の技術がそのまま危険な武器にもなりうるという点が、考えさせられて面白いところです。", "unverified": "本文を入手できず、攻撃の成功率などの数値、対象のモデル、防御手法ごとの結果は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "隠れた規範を相互作用から学ぶ力を測る", "title": "NormGym: Evaluating Normative Competence through Social Interaction", "url": "https://arxiv.org/abs/2611.08613", "authors": "Binze Li ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Li, B., Zhang, Z., Baek, S., Hadfield, G. K., & Shu, T. (2026). NormGym: Evaluating Normative Competence through Social Interaction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08613", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "多エージェントの共同体に入った新参者が、隠れた任意の規範を周囲の行動と制裁から推論して従えるかを測る対話型のベンチマークNormGymを作った（抄録）。", "p3": "新参者は自分の課題を進めながら、できることと許されることを区別し、観察した行動と制裁から規範を推論して新しい場面に当てはめる必要がある。多様な規範と環境で、LLMエージェントを含む現在のエージェントを評価した（抄録）。", "p5": "最も強いLLMでも課題と規範順守の同時成功率は55.3%だった。モデルは自分の行動への制裁の後には行動を直せることがあるが、他者の行動と他者への制裁から規範を推論するのは苦手で、微調整だけでは改善が不十分な可能性が示された（抄録）。", "fun": "転校先のクラスには、誰も教えてくれない暗黙のルールがあります。人は周りの様子や、誰かが注意される場面を見てそれを学びます。この研究でAIを同じ立場に置くと、自分が叱られれば直せても、他人が叱られるのを見て学ぶのは苦手でした。「空気を読む」力の難しさがはっきりした点が面白いところです。", "unverified": "本文を入手できず、評価したモデルの一覧、規範と環境の数、微調整の方法は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "予測が当たってもIFRSの測定として妥当とは限らない", "title": "When Algorithmic Accuracy Conflicts with Accounting Measurement: Rethinking the Normative Boundaries of AI-Based Financial Valuation under IFRS", "url": "https://doi.org/10.2139/ssrn.7681492", "authors": "Abderrahim Bekhtaoui", "venue": "SSRN", "date": "2026-11-09", "apa": "Bekhtaoui, A. (2026). When Algorithmic Accuracy Conflicts with Accounting Measurement: Rethinking the Normative Boundaries of AI-Based Financial Valuation under IFRS. https://doi.org/10.2139/ssrn.7681492", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "機械学習による会計上の見積りが実績によく当たること（予測精度）と、IFRSの測定として妥当であること（規範的な妥当性）は別物で、前者は後者の必要条件でも十分条件でもないことを分析的に示した（抄録）。", "p3": "IFRS 13・IFRS 9・IAS 36を段落ごとに検討し、順位に基づく精度指標が較正とシナリオの重み付けを見ないことなどを示した。予想信用損失の再現可能なシミュレーションで例示し、使う・調整する・却下するの3段階の判定基準を導いた（抄録）。", "p5": "シミュレーションでは、ブースティングのAUC 0.786はロジスティック回帰の0.737を上回ったが、クラス重み付きの学習は予想信用損失を約333%過大に見積もり、AUCが同じ再較正モデルもシナリオ調整の前は確率加重の目標を約15%過小評価した（抄録）。", "fun": "よく当たる予測なら会計の数字にそのまま使ってよい、と考えたくなります。しかし会計の基準は「何を測るべきか」を決めており、順位を当てるのが上手なモデルでも、損失の大きさを何倍も見誤ることがありました。「当たる」と「正しく測れている」は違うという区別が面白いところです。", "unverified": "本文を入手できず、シミュレーションの設定と3段階の判定基準の具体的な条件は未確認。証拠は分析とシミュレーションで、実際の頻度は示していないと著者自身が述べている。著者は執筆に生成AIの支援を受けたと明記している。"}}, {"id": "pr30", "rank": 30, "headline": "企業破綻と会計不正から取締役の責任を検討", "title": "Preventing disorderly corporate collapse and stakeholder losses: are directors the answer?", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141476", "authors": "Pope ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "企業の無秩序な破綻と質の低い会計・報告・監査の関係を検討し、財務報告の質を守るための取締役の責任の定め方について5つの論点を示した（抄録）。", "p3": "取締役の法的な役割の研究、企業破綻と財務報告の不正の同時発生の証拠、ガバナンスの仕組みと報告の質の関係の研究を要約し、2002年のサーベンス・オクスリー法の教訓と2021年の英国政府の改革案を検討した（抄録）。", "p5": "会計の不正は破綻の原因ではなく兆候であることが多いこと、より広いガバナンスの失敗の責任を会計に押しつける危険、規制の比例性が費用だけで論じられ便益が考慮されないこと、学習と修正を前提とする謙虚な規制の利点、報告への技術の利用の規制上の含意を挙げた（抄録）。", "fun": "会社が突然つぶれると、「帳簿のごまかし」が原因だと考えがちです。この論文は、多くの場合ごまかしは病気の原因ではなく症状であり、会計だけを悪者にすると本当の問題を見落とすと指摘します。熱を下げても病気は治らないのと同じで、原因と症状を分けて考える視点が面白いところです。", "unverified": "本文を入手できず、検討した実証研究の範囲と、改革案への具体的な評価は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "香港と中国本土の高齢MSMの差別と心理的苦痛", "title": "Exploring the Roles of Socioeconomic Status, Discrimination, Personal Social Capital, and Psychological Distress Among Older Men Who Have Sex with Men in Hong Kong and Mainland China: A Cross-Sectional Study", "url": "https://doi.org/10.21203/rs.3.rs-11177265/v1", "authors": "Alex Siu Wing Chan ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Chan, A. S. W., Mo, P. K. H., Ku, H. B., Asiamah, N., & Yan, E. (2026). Exploring the Roles of Socioeconomic Status, Discrimination, Personal Social Capital, and Psychological Distress Among Older Men Who Have Sex with Men in Hong Kong and Mainland China: A Cross-Sectional Study. https://doi.org/10.21203/rs.3.rs-11177265/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "香港と中国本土の60歳以上の男性と性交渉を持つ男性で、心理的苦痛の最大の要因は日常的な差別であり、社会経済的・社会的な要因を上回ることを示した（抄録）。", "p3": "2024年に香港151人・中国本土151人の計302人へのオンライン調査を、LGBT団体・NGO・大学を通じた便宜・雪だるま式・目標抽出で行い、階層的ロジスティック回帰で心理的苦痛と社会経済的地位・個人の社会関係資本・差別の関連を調べた（抄録）。", "p5": "月収が高い（1万8,700香港ドル超）ことは苦痛の増加と関連した（OR=2.82）。日常的差別の尺度が1単位上がるごとに苦痛の可能性が17%高く（OR=1.17）、説明された分散の35.9%を占め、差別を調整すると教育と社会関係資本は有意でなくなった（抄録）。", "fun": "心の苦しさの原因として、収入や人とのつながりがよく挙げられます。ところがこの調査では、性的少数者の高齢男性にとって日々受ける差別の積み重ねが最も大きな要因で、収入が高い人ほどむしろ苦痛が強いという意外な結果も出ました。社会の側の態度が心の健康を左右するという点が面白いところです。", "unverified": "本文を入手できず、心理的苦痛の尺度と判定の区切り、収入が高いほど苦痛が強いことへの著者の解釈は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "養育者の子ども発達の知識を測る尺度を開発", "title": "Development and Validation of the Caregiver Knowledge of Early Child Development Inventory (CKECDI) and Its Association with Preschool Children’s Executive and Motor Functions", "url": "https://doi.org/10.20944/preprints202611.0712.v1", "authors": "Chika R. Ezeugwu ほか", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Ezeugwu, C. R., Adedayo, M., Adeleye, A. O., Oyekola, A., Adegunle, S. O., Effiom, D. D., Olajubu, B. J., Emmanuel, J. D., Olaseni, J. T., & Audu, A. (2026). Development and Validation of the Caregiver Knowledge of Early Child Development Inventory (CKECDI) and Its Association with Preschool Children’s Executive and Motor Functions. https://doi.org/10.20944/preprints202611.0712.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "ナイジェリアで、養育者が就学前の子どもの発達についてどれだけ知っているかを測る35項目・4因子の尺度（CKECDI）を開発し、妥当性を検証した（抄録）。", "p3": "第1段階で養育者517人の回答を探索的因子分析（259人）と確認的因子分析（258人）に分け、第2段階で別の286組の養育者と子どもに実施し、領域ごとの得点と子どもの抑制制御・作業記憶・認知の柔軟性・運動機能の関連を経路分析で調べた（抄録）。", "p5": "認知発達・社会情動的な養育・就学準備・健康と栄養と安全の4因子モデルの適合はよく（CFI=.994、RMSEA=.013）、内的一貫性も許容範囲（KR-20=.74〜.90）だった。学歴による得点差で既知群妥当性を確かめ、領域ごとに子どもの機能と異なる関連を示した（抄録）。", "fun": "子どもの育ちを支えるには、周りの大人が「子どもはどう育つのか」を知っていることが大切です。この研究は、その知識をはかる物差しを作り、知識の領域によって子どもの記憶力や運動の力との結びつき方が違うことを示しました。目に見えない「知識」を数字にして確かめる手順そのものが面白いところです。", "unverified": "本文を入手できず、領域ごとの具体的な関連の方向と大きさは未確認。"}}, {"id": "pr33", "rank": 33, "headline": "人種是正策の下の白人労働者の帰属感と尊厳", "title": "Belonging, Dignity and Second-Class Citizenship: Perceptions of Race-Based Redress Among White South African Workers and Business Owners", "url": "https://doi.org/10.20944/preprints202611.0763.v1", "authors": "Joseph Phosane Mngqibisa ほか", "venue": "Preprints.org", "date": "2026-11-09", "apa": "Mngqibisa, J. P., & Costa, K. (2026). Belonging, Dignity and Second-Class Citizenship: Perceptions of Race-Based Redress Among White South African Workers and Business Owners. https://doi.org/10.20944/preprints202611.0763.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgに登録された抄録を使用", "preprint": true, "short": true, "p1": "南アフリカの人種に基づく是正策（雇用均等、積極的差別是正、BBBEE）が、白人の労働者と事業主の帰属感・尊厳・二級市民という認識にどう影響するかの研究を整理したレビュー（抄録）。", "p3": "Google Scholar・ERIC・OpenAlex・Crossrefを情報源とし、2000〜2026年の文献を対象に、重複を除いた150件の記録からPRISMAに沿って整理した（抄録）。", "p5": "白人の従業員の語りでは、雇用均等は不公平な扱いや昇進の制限、帰属感の脅かしと結びつけられたが、是正策の受容は条件付きで、歴史的な不平等は認めつつ不透明な基準や形だけの登用を拒んでいた。白人の事業主と二級市民性を直接扱った証拠は限られ、一律の結論は支持されなかった（抄録）。", "fun": "過去の差別を正すための政策は、得をする側だけでなく、そうでない側の気持ちにも影響します。この整理によると、白人の働き手は是正そのものに反対というより、決め方が不透明なことや形だけの登用に不満を持っていました。政策の中身だけでなく「どう進めるか」が受け止め方を左右するという点が面白いところです。", "unverified": "本文を入手できず、最終的に含めた文献の数と質の評価は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "養育者の技能訓練をデジタル基盤で届ける試み", "title": "A Formative Acceptability Study of a Technology Assisted Platform for Delivering Caregiver Skills Training in Rural Pakistan", "url": "https://doi.org/10.21203/rs.3.rs-11143532/v1", "authors": "Hadia Maryam¹ ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Maryam¹, H., Nazir¹, H., Tariq¹, M., Hayyat¹, M., Koukab¹, A., Liaqat¹, R., Kanwal¹, M., & Rahman², A. (2026). A Formative Acceptability Study of a Technology Assisted Platform for Delivering Caregiver Skills Training in Rural Pakistan. https://doi.org/10.21203/rs.3.rs-11143532/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "非専門家が届ける心理社会的介入のための再利用可能なデジタル基盤（TAP）に、WHOの養育者技能訓練（CST）を組み込めるかを試し、パキスタン農村で初期試作の受容性を評価した（抄録）。", "p3": "2025年9月〜2026年7月にラワルピンディ県の農村で2段階の形成的研究を行った。4回の多職種ワークショップでCSTの内容と実施過程をTAPの構成に対応させ、家族ピア提供者の3組で模擬的な使いやすさの試験をし、現地試験の後に訓練者2人・ピア提供者2人・養育者3人に面接した（抄録）。", "p5": "CSTの9回の集団セッションと3回の家庭訪問を、中核の内容と順序を変えずにデジタルの手順として組み込めた。提供者はその場で使える手引き・活動・動画を評価し、受容性はデジタル化だけでなくピア提供者の支えとの組合せによると考えられた。監督・監視・紹介の長期の運用は確かめていない（抄録）。", "fun": "専門家が足りない地域では、研修を受けた家族や地域の人がケアの担い手になります。この研究は、その人たちが手順や動画をその場で確かめられる仕組みを作りました。覚えた内容に頼らずにすむことで自信が増したという声があり、「道具」と「人の支え」の組合せが鍵だという点が面白いところです。", "unverified": "本文を入手できず、面接での具体的な発言と、6つの実施機能ごとの課題の詳細は未確認。面接の対象者は計7人と少ない。"}}, {"id": "pr35", "rank": 35, "headline": "LGBTQ+の人がAIに相談する・しない理由", "title": "\"I had nobody to turn to\": Why LGBTQ+ People Choose (Not) to Use AI Chatbots for Personal Health and Relationship Advice", "url": "https://arxiv.org/abs/2611.08854", "authors": "Jacob Hobbs ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Hobbs, J., Gupta, A., Ulmer, D., Aich, G., Golden, N., Long, Y., Rios-Sialer, I., Mickel, J., Scheuerman, M. K., Mujumdar, R. A., Felkner, V. K., Taylor, J., & Agnew, W. (2026). \"I had nobody to turn to\": Why LGBTQ+ People Choose (Not) to Use AI Chatbots for Personal Health and Relationship Advice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08854", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LGBTQ+の人が、関係・心の健康・性や性別の健康の相談にAIチャットボットを使うかどうか、その理由を調べた（抄録）。", "p3": "73人（LGBTQ+ 60人、非LGBTQ+ 13人）に、AIチャットボットとの関わり方を調査した（抄録）。", "p5": "外部の資源へのアクセス、プライバシーの懸念、チャットボットの能力の認識が利用を左右した。チャットボットの方が身近な人より偏見が少ないと感じる人もいた一方、15の具体的な場面ではLGBTQ+の人の方が利用頻度が低く、AIの迎合や認知への悪影響を懸念していた（抄録）。", "fun": "身近に相談できる人がいないとき、AIは頼れる相手になりえます。この調査では、AIの方が周りの人より偏見が少ないと感じるLGBTQ+の人がいる一方で、AIが話を合わせすぎることへの警戒も強く、実際の利用はむしろ少なめでした。頼りたいけれど頼り切れないという揺れる気持ちが見えてくる点が面白いところです。", "unverified": "本文を入手できず、調査の方法（募集方法・質問の形式）と、15の場面ごとの差の大きさは未確認。"}}, {"id": "pr36", "rank": 36, "headline": "在宅ケアのAI助手は応答の長さと年齢で体験が変化", "title": "Effects of Response Length, Interaction Mode, and Age on Interaction Experience with a Large Language Model–Powered AI Assistant in Home Care: Mixed Methods Study (Preprint)", "url": "https://doi.org/10.2196/preprints.116407", "authors": "Xu Zhao ほか", "venue": "JMIR Preprints", "date": "2026-11-09", "apa": "Zhao, X., & Zhong, R. (2026). Effects of Response Length, Interaction Mode, and Age on Interaction Experience with a Large Language Model–Powered AI Assistant in Home Care: Mixed Methods Study (Preprint). https://doi.org/10.2196/preprints.116407", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "在宅医療の場面でLLMを使ったAI助手の応答の長さと対話方式が利用者の体験にどう影響し、それが年齢でどう変わるかを162人の実験で調べた（抄録）。", "p3": "応答の長さ（短い10〜20字、中くらい30〜50字、詳しい50〜100字）を参加者間、対話方式（音声＋文字、文字のみ）を参加者内とし、年齢を共変量とする3×2の混合計画で、DeepSeek-V3.2を使うスマートホームの助手と6つの場面で対話してもらった。15人には面接もした（抄録）。", "p5": "体験と認知負荷で方式と長さの交互作用が有意で（体験 F=3.7、P=0.03、η²=0.044）、音声＋文字では中くらいの応答が詳しい応答より認知負荷が低かった。年齢は理解度と信頼に正の効果を持ち（理解度 F=10.4、P=0.002）、30〜50字の応答が情報と負荷の釣り合いがよいと結論した（抄録）。", "fun": "AIの答えは詳しいほどよいとは限りません。この実験では、声と文字で答えるとき、短すぎず長すぎない30〜50字の答えが最も頭の負担が少なくなりました。年上の利用者ほど理解や信頼が高かったのも意外です。相手と伝え方に合わせて「ちょうどよい長さ」があるという点が面白いところです。", "unverified": "本文を入手できず、信頼への年齢の効果の統計量（抄録の表記が途中で切れている）と、面接の分析結果は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "看護実習用のLLM患者ペルソナのプロンプト条件", "title": "LLM Patient Persona for Nursing Simulation", "url": "https://osf.io/5a2bz", "authors": "Hiroyuki Tajima", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-11-06", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OSF Preprintsの登録情報（OpenAlex経由）の抄録を使用", "preprint": true, "short": true, "p1": "看護実習のシミュレーション用に大規模言語モデルが作る患者ペルソナについて、プロンプトの条件が対話の質に与える影響を調べる事前登録研究（抄録）。", "p3": "3つのプロンプト条件×4つの疾患類型×10回の反復で、GPT-4oにより120の対話を生成し、臨床的妥当性・ペルソナの一貫性・ハルシネーションの発生率・属性の遵守率の4軸で評価する（抄録）。", "p5": "抄録には結果の記載がなく、研究の設計と評価軸のみが示されている（抄録）。", "fun": "看護の実習では患者役との会話の練習が大切ですが、毎回人に患者役を頼むのは大変です。AIに患者を演じさせるとき、どんな指示を出せば病状や性格を最後まで守った自然な患者になるのか。この研究はそれを、計画を先に公開したうえで確かめようとしています。「役を演じ続ける力」をどう測るかという問いが面白いところです。", "unverified": "抄録に結果がなく、3つのプロンプト条件の内容と評価の結果は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "心拍などを密かに使うとLLMの説得力が上がる", "title": "Sensed but Not Told: Hidden Physiological Adaptation Shapes LLM Persuasion", "url": "https://arxiv.org/abs/2611.09394", "authors": "Xiaoyan Wei ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wei, X., Qu, Y., Li, Y., Li, H., Zhang, W. E., & Chen, H.-T. (2026). Sensed but Not Told: Hidden Physiological Adaptation Shapes LLM Persuasion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09394", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "利用者に伝えずに心拍と瞳孔の信号をLLMチャットボットに与えると説得の効果が高まることを、24人の参加者内実験で示した（抄録）。", "p3": "チャットボットが参加者自身の選んだ意見に反論する2×2の参加者内計画で、発話ごとの心拍と瞳孔径の特徴を与える条件と与えない条件を比べ、研究の途中で感知していたことを開示した（抄録）。", "p5": "開示前には感知ありで説得力の評価が1.42点高く、研究全体では感知ありでチャットボットの立場への移動が0.57点大きく、少しでも動く確率のオッズが3.20倍だった。開示後は説得力の評価が下がったが、開示は実施順と交絡していた。感知ありでは疑問符が少なく、会話の往復も少なかった（抄録）。", "fun": "話し相手のAIが、あなたの心拍や瞳の大きさをこっそり読み取っていたらどうでしょう。この実験では、そうした体の信号を使うとAIの説得がうまくいき、AIの話し方も問いかけの少ない言い切り型に変わりました。人が言葉にしない情報まで説得に使われうるという、技術と倫理の境目が面白いところです。", "unverified": "本文を入手できず、使ったLLM、信号の特徴量の作り方、話題の種類は未確認。参加者は24人と少ない。"}}, {"id": "pr39", "rank": 39, "headline": "履歴依存の損傷を予測するRNNを有限要素に組込み", "title": "Embedding Consistent Recurrent Neural Networks in Finite Element Simulations for Path-Dependent Damage Prediction", "url": "https://arxiv.org/abs/2611.08494", "authors": "Muhammed Adil Yatk{\\i}n ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Yatkın, M. A., Kõrgesaar, M., & Kurban, H. (2026). Embedding Consistent Recurrent Neural Networks in Finite Element Simulations for Path-Dependent Damage Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08494", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "経路依存の損傷を予測するRNNを陽解法の有限要素ソルバに組み込むには、ひずみ増分の刻み方によらず予測がそろうこと（離散化の整合性）が決定的だと示し、そのための再帰セルConsRNNを提案した（抄録）。", "p3": "学習済みのRNNの損傷基準をFortranで再実装し、Abaqus/Explicitのユーザー材料サブルーチン（VUMAT）の中で増分ごとに状態を進める破壊基準として組み込んだ。通常のSimpleRNNと、経路を細かくすると予測が収束するよう遷移関数を設計したConsRNNを比べた（抄録）。", "p5": "SimpleRNNは増分数が増えると予測がずれて組込みに使えず、ConsRNNは細分化で収束したが、固定の解像度では多直線の経路で精度が下がった。構造規模では固定した鋼板の要素削除を担い、既存の2パラメータの破壊基準と同じ最大荷重・最大変位に達した（抄録）。", "fun": "コンピュータで材料が壊れる様子を計算するとき、時間を細かく刻むか粗く刻むかで答えが変わっては困ります。この研究は、AIで作った「壊れやすさの判定器」が刻み方によって結果がずれる問題を見つけ、刻みを細かくするほど答えが落ち着くように作り直しました。正確さより先に「一貫性」が大事だという点が面白いところです。", "unverified": "本文を入手できず、精度の低下の大きさとピーク後の軟化の挙動の違いの詳細は未確認。最大荷重の一致は構成上当然で、ピーク後に応答が分かれると著者自身が述べている。"}}, {"id": "pr40", "rank": 40, "headline": "腐食したボルト接合の表面劣化から機能を推定", "title": "A Physics-Informed Learning Framework for Linking Microscopic Surface Degradation to Bolted Joint Functional Behavior", "url": "https://arxiv.org/abs/2611.09514", "authors": "Nehal Afifi ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Afifi, N., Kachel, G., & Matthiesen, S. (2026). A Physics-Informed Learning Framework for Linking Microscopic Surface Degradation to Bolted Joint Functional Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09514", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "腐食したボルト接合について、顕微鏡とカメラによる劣化の観察を摩擦係数などの機能の指標に結びつける、物理的な制約つきのマルチモーダルな学習の枠組みを示した（抄録）。", "p3": "検査と機能応答の同期した記録を作り、類似度学習で顕微鏡とカメラの観察を対応させて較正した腐食の重症度の場を作る。その場から偏微分方程式の発見で有効な中間スケールの法則の候補を探し、摩擦係数（締付け力のデータがあれば予張力の低下も）を予測する機能モデルとつなぐ（抄録）。", "p5": "抄録には性能の数値はなく、劣化したボルト接合の挙動を物理的な制約のもとで評価する再現可能な道筋を示したことが貢献とされる（抄録）。", "fun": "さびたボルトがまだ使えるかどうかは、見た目だけでは分かりにくいものです。この研究は、顕微鏡の拡大画像とふつうのカメラ画像をAIで対応づけ、さびの広がり方を表す式をデータから探し、それを締め付けの摩擦の変化につなげようとしています。「見た目」から「働き」を推定する橋渡しの発想が面白いところです。", "unverified": "本文を入手できず、使用したデータの規模と予測の精度の数値は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "出力の飽和を利用して非線形系を同定する励起設計", "title": "Controlled Excitation for Identification of Nonlinear Systems with Saturated Outputs", "url": "https://arxiv.org/abs/2611.09188", "authors": "Adel Malik Annabi (McTAO ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Annabi, A. M., Pomet, J.-B., Prandi, D., & Sacchelli, L. (2026). Controlled Excitation for Identification of Nonlinear Systems with Saturated Outputs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09188", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "出力が「未知の行列×既知の飽和関数（状態）」の形の非線形系で、未知の行列を出力から正確に同定できる励起入力を、飽和を逆に利用して明示的に作る方法を示した（抄録）。", "p3": "幾何的な到達可能性の条件のもとで、状態を飽和関数が決まった値をとる領域へ導く開ループの制御を導いた。状態の測定は不要で、非線形部分の構造を知らなくてよく、回帰の説明変数が事前に分かるため、未知の行列を閉形式の回帰で正確に求められる（抄録）。", "p5": "成分ごとの飽和では、この条件は独立な2つの制御方向でも一般に成り立つ。より強い仮定と十分な出力があれば、出力フィードバックで状態の正確な復元と線形にパラメータ化された力学の同定も可能になる。測定雑音への頑健性を解析し、雑音のある数値例で示した（抄録）。", "fun": "センサが振り切れてしまう（飽和する）と、ふつうは情報が失われて困ります。この研究は逆に、振り切れた状態では値が分かっていることを利用し、わざと振り切れる領域へ系を動かして未知の部分を正確に求めました。邪魔者だった飽和を手がかりに変える発想の転換が面白いところです。", "unverified": "本文を入手できず、数値例の系と、雑音の大きさに対する同定誤差の大きさは未確認。"}}, {"id": "pr42", "rank": 42, "headline": "PINNの学習で各損失の寄与が変わる過程を解析", "title": "Task-Contribution Dynamics of Adam in Physics-Informed Neural Networks: Slow-Manifold Analysis and Gradient Modulation", "url": "https://arxiv.org/abs/2611.08910", "authors": "Enzhan Zheng ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Zheng, E., & Song, X. (2026). Task-Contribution Dynamics of Adam in Physics-Informed Neural Networks: Slow-Manifold Analysis and Gradient Modulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08910", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "物理情報付きニューラルネット（PINN）をAdamで学習するとき、競合する損失の各成分が更新に寄与する割合がどう変わるかを解析し、それにもとづく改良版GMAdamを提案した（抄録）。", "p3": "課題ごとの指標で学習を滑らかな変化・間欠的なスパイク・持続的な振動の3段階に分け、初期の滑らかな段階を離散時間の解析と連続時間の特異摂動の枠組みで調べた。遅い多様体の1次近似から寄与の再配分を決める2つの要因を特定し、どちらもAdamの共有の2次モーメント推定に関わることを示した（抄録）。", "p5": "課題ごとの2次モーメント推定で勾配を調整するGMAdamは、高周波のポアソン方程式と波動方程式、アレン・カーン方程式、2次元の蓋駆動キャビティ流（Re=100、400）で、同程度の計算費用でAdaTaskより予測精度を一貫して改善した（抄録）。", "fun": "物理の法則を守りながら学習するAIは、「方程式を満たす」「境界の条件を満たす」など複数の目標を同時に追うため、どれかが置き去りになりがちです。この研究は、学習の途中で各目標の取り分がどう入れ替わるかを、ゆっくり動く部分に注目して解析しました。学習の仕組みの中に「綱引き」を見つけた点が面白いところです。", "unverified": "本文を入手できず、精度の改善の具体的な数値は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "対数ひずみ空間の弾塑性モデルの解析とFEM実装", "title": "Mathematical analysis and vectorized FEM implementation of logarithmic strain space framework for finite strains: a case study on elastoplasticity", "url": "https://arxiv.org/abs/2611.09492", "authors": "Miroslav Frost ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Frost, M., Kruž\\'ık, M., Moskovka, A., & Valdman, J. (2026). Mathematical analysis and vectorized FEM implementation of logarithmic strain space framework for finite strains: a case study on elastoplasticity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09492", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "有限ひずみの非線形連続体力学で使う対数ひずみ空間の枠組みについて、線形移動硬化のフォン・ミーゼス弾塑性モデルを例に、解の存在の証明とベクトル化した有限要素の実装を示した（抄録）。", "p3": "2次のヘンキー・エネルギーに強圧性と下半連続性が欠ける問題を高階勾配の正則化で補い、時間とともに変わるディリクレ境界条件のもとで速度に依存しない準静的な発展のエネルギー解の存在を証明した。MATLABでページ単位の行列関数と独自のベクトル化ライブラリを使って実装した（抄録）。", "p5": "ベンチマークでは局所的なテンソル演算が大きく高速化し、対数ひずみの手法は計算費用をあまり増やさず、大きな回転と変形を頑健に扱えた（抄録）。", "fun": "ゴムを大きくねじったり、金属を大きく曲げたりする計算では、変形の測り方そのものが難しくなります。この研究は、「対数ひずみ」という測り方を使う方法に、解がちゃんと存在するという数学の裏付けを与え、さらに高速に計算できるプログラムも作りました。理論と実装の両方から足場を固めた点が面白いところです。", "unverified": "本文を入手できず、高速化の倍率など具体的な数値は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "無形投資をする企業ほど資金制約に直面", "title": "Firms’ Intangible Investments and Financing Constraints: Evidence from Survey Data", "url": "https://econpapers.repec.org/RePEc:rif:wpaper:153", "authors": "Pajarinen ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "研究開発など無形資産に投資する企業ほど資金制約に直面しやすいことを、フィンランドと欧州の4つの企業調査で一貫して示した報告書（抄録）。", "p3": "フィンランドのSMEバロメーター（2018年秋〜2026年春）、Tesiの成長企業調査（2024〜2025年）、ECBのSAFE調査（2015〜2025年）、EIBの投資調査EIBIS（2016〜2025年）を比較・分析した（抄録）。", "p5": "4つの調査で、無形投資、とくに研究開発と革新的な活動を行う企業ほど資金制約に直面しやすかった。フィンランドでは2022年以降に資金制約が増え、他のEU諸国に対する資金調達の優位が縮み、スウェーデンに対しては不利に転じた（抄録）。", "fun": "工場の機械は借金の担保になりますが、アイデアやソフトウェアのような目に見えない資産は担保になりにくいものです。この報告は、そうした無形の資産に投資する会社ほどお金を借りにくいことを、4つの別々の調査で確かめました。未来の成長を担う投資ほど資金が回りにくいという矛盾が面白いところです。", "unverified": "本文を入手できず、資金制約の定義と、調査ごとの差の大きさは未確認。"}}, {"id": "pr45", "rank": 45, "headline": "交通量で需要モデルを校正するかOD表を直すか", "title": "Calibrating demand models versus adjusting OD matrices with traffic counts: a controlled comparison", "url": "https://arxiv.org/abs/2611.09678", "authors": "Yue Li ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Li, Y., Chen, S., & Jin, Y. (2026). Calibrating demand models versus adjusting OD matrices with traffic counts: a controlled comparison (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09678", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "交通量の観測で需要を推定するとき、OD表（出発地・目的地の交通量）を個別に直す方法と、需要モデルの少数の係数を校正する方法のどちらがよいかを、既知の需要を持つ合成実験で比べた（抄録）。", "p3": "同じ事前情報・交通量・均衡配分のもとで、5つの重力モデルの係数を推定する方法、発着の調整係数を推定する方法、個々のOD交通量を推定する方法の3つを、東マサチューセッツとシカゴの道路網で、モデルの誤指定の形を変えて比べた（抄録）。", "p5": "需要がモデルの仮定に従うときは5係数の校正の方がOD需要の回復と未使用の区間の交通量予測に優れた。個別の補正は66条件中65条件で校正用の交通量に最もよく合ったが、うち45条件ではOD需要の回復が3手法で最も不正確だった（抄録）。", "fun": "観測した交通量に一番ぴったり合う推定が、本当の人の流れを一番よく表しているとは限りません。この研究では、細かく調整して観測にぴったり合わせた方法ほど、本当の出発地と目的地の組合せを外すことが多くありました。「データに合う」ことと「正しい」ことの違いがはっきり見える点が面白いところです。", "unverified": "本文を入手できず、誤指定の具体的な形と、各手法の誤差の大きさの数値は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "財務文書の読取りを誤りの重大さで評価する枠組み", "title": "Human-Centred, Risk-Constrained Evaluation of Financial Document Recognition: Evidence, Critical Errors, and Selective Automation", "url": "https://arxiv.org/abs/2611.02775", "authors": "Subodh Lonkar", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Lonkar, S. (2026). Human-Centred, Risk-Constrained Evaluation of Financial Document Recognition: Evidence, Critical Errors, and Selective Automation (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.02775", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を使用", "preprint": true, "short": true, "p1": "財務文書の自動読取りを、文字の誤り率ではなく、人や組織が頼る財務事実を正しく取り出せるかで評価する、人間中心でリスクを制約した評価の枠組みを示した（抄録）。", "p3": "画面上の根拠の領域と結びついた型付きの財務事実を定義し、逐語の転記・決定論的な正規化・業務上の解釈を分ける。金額・識別子・符号・期間などの重大な項目の誤りには片側の不確実性の上限を使う非補償的な合格基準を設け、自動化する範囲を、残るリスク・人の確認能力・費用を考えた振り分けの問題として定式化した（抄録）。", "p5": "誤りがゼロでも危険の上限はゼロにならないことや、補償的な採点の限界を形式的に示した。新しいモデル・データ・実証結果はなく、理論と方法論の貢献だと明記している（抄録）。", "fun": "請求書を読み取るAIが文字を99%正しく読めても、金額の桁を1か所間違えれば大問題です。この論文は、平均点ではなく「致命的な間違いがないか」で合否を決め、自信のないものだけを人に回す仕組みを考えました。「誤りが0件だった」でも安全とは言い切れないことを示した点が面白いところです。", "unverified": "実証の結果はなく、枠組みを実際の文書で試した場合の性能は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "不正企業の株を持った判事も量刑はほぼ変わらない", "title": "How does judges' personal exposure to financial fraud affect white-collar sentencing?", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:124397", "authors": "Nguyen ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "財務不正を起こした企業の株を持っていた連邦判事が、ホワイトカラー犯罪の量刑で被告に厳しくなるかを、事前に登録した方法で調べ、影響はほとんどないことを示した（抄録）。", "p3": "判事が不正企業の株を直接保有していたことから財務不正への個人的な接触を測る指標を作り、事件の判事への無作為な割当てを利用して、他の企業の事件での被告に有利な判断と公判前の申立ての認容を調べた（抄録）。", "p5": "どちらの仮説にも支持する証拠はほとんどなく、最も深刻な不正を除けば、判事が個人的な被害の経験を関連する事件の量刑に持ち込む可能性は低いと結論した（抄録）。", "fun": "自分が損をした経験があると、似た事件の判断が厳しくなりそうな気がします。この研究は、裁判官が株で不正の被害を受けた場合を調べましたが、量刑への影響はほとんど見つかりませんでした。事件を裁判官にくじ引きのように割り当てる仕組みを「自然の実験」に使い、仮説が外れたことを正直に示した点が面白いところです。", "unverified": "本文を入手できず、対象の判事と事件の数、最も深刻な不正での結果の詳細は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "小売の環境CSRの認知はごみの行動に結びつくか", "title": "Retail Environmental Responsibility and the Consumer Waste Behaviour Gap: Evidence from South Africa", "url": "https://doi.org/10.21203/rs.3.rs-11400633/v1", "authors": "Ronald Mashamba ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Mashamba, R., Dalu, T., & Dalu, M. T. B. (2026). Retail Environmental Responsibility and the Consumer Waste Behaviour Gap: Evidence from South Africa. https://doi.org/10.21203/rs.3.rs-11400633/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "小売の環境CSRは顧客によく知られ説得力も感じられていたが、それだけでは家庭のリサイクルなどの行動には結びつかないことを、南アフリカの調査で示した（抄録）。", "p3": "ムボンベラの2つの商業施設で成人の顧客281人を調査し、環境CSRの認知・情報経路・効果の認識・廃棄行動への影響の認識・家庭のリサイクル・店舗の回収への参加などを測り、66組の相関をベンジャミニ・ホッホベルク法で補正したスピアマンの順位相関で分析した（抄録）。", "p5": "認知していたのは279人中194人（69.5%）だったが、家庭ごみをリサイクルしていたのは75人（26.7%）だった。認知は影響を受けたという認識とは関連したが、家庭のリサイクルや店舗の回収への参加とは関連せず、参加には学歴と年齢の方が一貫して関連した（抄録）。", "fun": "お店の環境キャンペーンを知っていて、「影響を受けた」と答える人が多くても、実際にごみを分別している人は4人に1人ほどでした。知っていることと行動することの間には大きな溝があり、近くに回収の仕組みがあるかどうかの方が大事かもしれません。気持ちと行動のずれが数字で見える点が面白いところです。", "unverified": "本文を入手できず、障壁の内容と、学歴・年齢との関連の大きさは未確認。"}}, {"id": "pr49", "rank": 49, "headline": "利用者の解釈の傾向で推薦の説明の順序を個別化", "title": "Learning from How Users Interpret: Personalizing Recommendation Explanation Order", "url": "https://arxiv.org/abs/2611.08785", "authors": "Deo Munduku ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Munduku, D., & Negre, E. (2026). Learning from How Users Interpret: Personalizing Recommendation Explanation Order (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08785", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "推薦の理由を説明する文の中身と言い回しは変えずに、利用者の過去の文章の解釈の傾向から作った履歴プロファイルで文の並べ方を個別化すると、理解が高まることを示した（抄録）。", "p3": "122人の参加者内実験で、過去の解釈を情報の選択・相対的な目立ち・関係の組立ての3次元で表し、本人のプロファイル（OWN）、他人のプロファイル（DONOR）、集団のプロファイル（POP）、プロファイルを使うLLM（PROFILE LLM）の4つの並べ方を比べた（抄録）。", "p5": "客観的な理解の正答率はOWNが86.5%で、DONOR（66.0%）、POP（63.9%）、PROFILE LLM（73.0%）を上回り、混合効果分析でも他の各手順より高かった。推薦の受け入れには全体として確かな差がなかった（抄録）。", "fun": "同じ説明文でも、並べる順番を変えるだけで分かりやすさが変わります。この実験では、その人が過去に文章をどう読み取ったかの癖に合わせて順番を変えると、理解の正答率が大きく上がりました。中身を一言も変えずに「順番だけ」で伝わり方が変わるという点が面白いところです。", "unverified": "本文を入手できず、推薦の対象（商品の種類など）と、関係の組立ての次元の測り方の詳細は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "AIインフラの電力機器は前払いで先に確保される", "title": "Buying Capacity Before It Exists Advance Payments and Supply Commitments in AI Infrastructure 6 November 2026", "url": "https://doi.org/10.21203/rs.3.rs-11641481/v1", "authors": "Fuli Yang ほか", "venue": "Research Square (In Review)", "date": "2026-11-09", "apa": "Yang, F., Huang, J., & Qiu, T. (2026). Buying Capacity Before It Exists Advance Payments and Supply Commitments in AI Infrastructure 6 November 2026. https://doi.org/10.21203/rs.3.rs-11641481/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIインフラに必要な電力機器の前払いと供給約束の契約が、完成前に投資を調整し、新規の受注が減っても生産の義務を進め続ける仕組みを分析した（抄録）。", "p3": "大手の電力機器メーカー3社の開示、買い手との契約、完了・中止した事業の履歴を組み合わせ、契約条項が利用権・価格・購入義務・解約権を分けている点を整理し、ストックとフローの枠組みで予約の進行と受注の関係を示した（抄録）。", "p5": "GE Vernovaの四半期の確定受注残の追加は2026年第1〜第3四半期に8 GWから16 GWに倍増した一方、新規の約束は21 GWから11 GWに減り、9か月の確定受注残の追加の80.6%は以前の予約の転換によるものだった（抄録）。", "fun": "新しい注文が減っているのに、工場の確定した仕事は増えている。一見矛盾するこの現象を、この研究は「予約が時間差で本契約に変わる」仕組みで説明しました。お店の予約が後から本注文になるように、過去の約束が投資の勢いを支え続けるという見方が面白いところです。", "unverified": "本文を入手できず、3社のうち残る2社の数値と、中止した事業の分析の詳細は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経営学", "headline": "生成AIの組込みで小規模出店者の売上が51.6%増", "title": "AI as Shared Business Infrastructure: Firm Growth and the Distribution of Gains", "url": "https://doi.org/10.3386/w36003", "authors": "Panle Jia Barwick ほか", "venue": "NBER Working Paper", "apa": "Barwick, P. J., Fang, L., Liu, J., Xu, H., & Yuan, Z. (2026). AI as Shared Business Infrastructure: Firm Growth and the Distribution of Gains (NBER Working Paper No. 36003). National Bureau of Economic Research. https://www.nber.org/papers/w36003", "why": "中国の大手EC基盤が2024年に業務ソフトへ生成AIを組み込んだ事例で、企業ごとのAI利用記録と月次の販売を結び、マッチングした差の差分析と操作変数で効果を推定した。年商500万元未満の企業では採用により月次売上が51.6%増え、主に注文数の47.0%増によることを示し、AIを共有の事業基盤として提供したときの成果の行き先を実証した。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "開発経済学のRCTの有意な結果の約3割は偽発見", "title": "(In)Credible Development RCTs: False Discoveries, Low Power, and a Solution", "url": "https://doi.org/10.3386/w35999", "authors": "Qingyuan Chai ほか", "venue": "NBER Working Paper", "apa": "Chai, Q., Lang, K., & Zhong, L. (2026). (In)Credible Development RCTs: False Discoveries, Low Power, and a Solution (NBER Working Paper No. 35999). National Bureau of Economic Research. https://www.nber.org/papers/w35999", "why": "主要誌190本の745の主要な検定を集め、出版の選択を考慮した経験ベイズの混合モデルで、開発経済学の無作為化比較試験の検出力と偽発見率を推定した。公表された棄却の約30%が偽発見で、平均の方向性検出力は40%にとどまると推定し、追試への資源配分の最適化も示した。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "経済学論文の約半数でコードと本文に重大な食い違い", "title": "Code-Paper Consistency in Economics and Finance", "url": "https://doi.org/10.2139/ssrn.7681378", "authors": "Christoph Huber ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Huber, C., Seidel, P. F. A., Seyfi, S., & Vihriälä, E. (2026). Code-Paper Consistency in Economics and Finance. https://doi.org/10.2139/ssrn.7681378", "why": "主要な経済学・ファイナンス誌の1,820本について、LLMを使った構造化手順で論文の記述と分析コードの不一致を点検した。結論に至った主張の10%に不一致があり、論文の49%（頑健性の確認で37〜56%）が中心的な結果に関わる重大な不一致の可能性を含むと報告した。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "最貧層への的絞りは援助の効く世帯を見逃す", "title": "Target What? The Foundations of Poverty Targeting", "url": "https://doi.org/10.3386/w35984", "authors": "Rema Hanna ほか", "venue": "NBER Working Paper", "apa": "Hanna, R., Breza, E., Olken, B. A., Banerjee, A., Chandrasekhar, A. G., & Moore, G. (2026). Target What? The Foundations of Poverty Targeting (NBER Working Paper No. 35984). National Bureau of Economic Research. https://www.nber.org/papers/w35984", "why": "インドネシアの600村で5,500人超の住民に他の住民の暮らし向きと少額の給付の効き目を順位づけてもらい、消費額や自己評価と比べた。消費で対象を選ぶと、追加の1ドルの社会的価値が最も高い世帯の77%を見逃すことを示し、貧困の的絞りの前提を問い直した。"}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "演劇型の研修で警察官の性暴力への対応が改善", "title": "Debiasing Law Enforcement Officers: Evidence from an Expressive Arts Intervention in India", "url": "https://doi.org/10.3386/w35986", "authors": "Sofia Amaral ほか", "venue": "NBER Working Paper", "apa": "Amaral, S., Borker, G., Prakash, N., & Sviatschi, M. M. (2026). Debiasing Law Enforcement Officers: Evidence from an Expressive Arts Intervention in India (NBER Working Paper No. 35986). National Bureau of Economic Research. https://www.nber.org/papers/w35986", "why": "インドのビハール州警察と417署・約2,500人の現職の警察官を対象にクラスター無作為化試験を行い、被抑圧者の演劇にもとづく3日間の研修を評価した。約7か月後に性暴力への態度・共感・法知識が改善し、1年後の標準化された被害者役の監査でも実際の対応の変化が観察された。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "ネットワーク干渉下の因果推論の最適設計と推定量", "title": "Minimax designs and estimators for causal inference under network interference", "url": "https://arxiv.org/abs/2611.08560", "authors": "Vishesh Karwa ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Karwa, V., & Airoldi, E. M. (2026). Minimax designs and estimators for causal inference under network interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08560", "why": "処置が他者にも波及する干渉のもとで、線形の因果推定対象に対する設計ベースのミニマックス理論を構築した。推定量の最適化、設計と推定量の同時最適化など3つの問題でミニマックスリスクを調べ、干渉を潜在的結果の同時抽出の制約として超グラフで表した。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "AIエージェントへの介入の価値を因果推論で評価", "title": "Knowing When to Intervene: Causal Evaluation of AI Agents", "url": "https://arxiv.org/abs/2611.09792", "authors": "Ayush Sawarni ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Sawarni, A., Xing, W., Zrnic, T., Johari, R., & Syrgkanis, V. (2026). Knowing When to Intervene: Causal Evaluation of AI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09792", "why": "エージェントの行動の途中で検証や軌道修正の介入をすべきかを、最終結果への因果効果として評価する枠組みを提案した。介入の効果が文脈と将来の行動に依存する動的な問題を扱い、静的なベンチマークでは分からない運用時の介入の価値を推定できるようにした。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "総額表示の義務化で民泊の価格はむしろ4.8%上昇", "title": "Clearing the Fog: Price Transparency, Market Churn, and Consumer Welfare in Short-Term Rentals", "url": "https://doi.org/10.3386/w35989", "authors": "Ginger Zhe Jin ほか", "venue": "NBER Working Paper", "apa": "Jin, G. Z., Wagman, L., & Xing, J. (2026). Clearing the Fog: Price Transparency, Market Churn, and Consumer Welfare in Short-Term Rentals (NBER Working Paper No. 35989). National Bureau of Economic Research. https://www.nber.org/papers/w35989", "why": "2024年7月にカリフォルニア州で手数料込みの総額表示を義務化した法律の効果を、他都市と比べる粗い完全一致マッチングで調べた。客の価格感応度は高まったのに平均宿泊価格は4.8%上がり、清掃料に頼る物件の退出など市場の入れ替わりが起き、隠れた手数料による「厚生の錯覚」が解消されたことを示した。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "新しい共同制作者と組むとアイデアの新しさが増す", "title": "What Do You Bring to the Table? New Teams and New Ideas", "url": "https://doi.org/10.2139/ssrn.7681467", "authors": "William Arbour", "venue": "SSRN", "date": "2026-11-09", "apa": "Arbour, W. (2026). What Do You Bring to the Table? New Teams and New Ideas. https://doi.org/10.2139/ssrn.7681467", "why": "ボードゲームのデザイナーと作品の仕組みの記録を使い、チームに新しい人が加わると創造性がどう変わるかを調べた。なじみの相手から全く新しい相手に移ると、デザイナーにとって新しい仕組みの割合が16.2ポイント増え、共同作業で得たアイデアは5年後も11.8ポイント多く使い続けられていた。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "標本分割なしで高次元のオフ方策評価を行う", "title": "High-Dimensional Off-Policy Evaluation without Sample Splitting using an Onsager Correction", "url": "https://arxiv.org/abs/2611.08794", "authors": "Saksham Jain ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Jain, S., Braun, G., & Imaizumi, M. (2026). High-Dimensional Off-Policy Evaluation without Sample Splitting using an Onsager Correction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08794", "why": "文脈の次元と標本数が比例して増える高次元の状況では、検証用データでの報酬モデルの選択が最適でなくなりうることを示した。オンサガー補正を加えた基準で、全データで学習したモデルの標本外リスクを学習データだけから推定し、標本分割なしの早期打ち切りを可能にした。"}, {"id": "pn11", "rank": 11, "field": "オペレーションズ・リサーチ", "headline": "3次元の最適な格子量子化器は体心立方格子と証明", "title": "The BCC lattice is the optimal 3D lattice quantizer for all $p\\geq1$", "url": "https://arxiv.org/abs/2611.09523", "authors": "Senping Luo", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Luo, S. (2026). The BCC lattice is the optimal 3D lattice quantizer for all $p\\geq1$ (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09523", "why": "有限のp≥1のすべてについて、体心立方格子がボロノイ胞のp次モーメントを最小にする3次元格子であることを証明し、グラフ–ルシュギーの予想を3次元で解決した。連続量を離散化する点の最適な配置という古典的な問題に決着をつける結果である。"}, {"id": "pn12", "rank": 12, "field": "心理学・認知科学", "headline": "先に自分で決めてからAIを見ると熟慮が増える", "title": "Thinking Twice: A Sequential Approach to Nudge Towards Reflective Judgment in GenAI-Assisted Decision Making", "url": "https://arxiv.org/abs/2611.09269", "authors": "H\\\"useyin Hussein Keke ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Keke, H. H., Eisenhardt, D., & Meske, C. (2026). Thinking Twice: A Sequential Approach to Nudge Towards Reflective Judgment in GenAI-Assisted Decision Making (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09269", "why": "生成AIの助言を受ける意思決定で、先に自分で判断してから助言を受ける逐次的なやり取りが、直観的な判断から熟慮的な判断への切り替えを促すかを130人の実験で検証した。二重過程理論の三段階モデルにもとづき、判断の食い違いの検出を熟慮のきっかけにする設計を示した。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "エージェントの自己改良では解ける課題が入れ替わる", "title": "Beneath the Surface: What We Overlook When We Talk About Agent Evolution", "url": "https://arxiv.org/abs/2611.07624", "authors": "Xiaobo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Wang, X., Wang, Z., Ye, S., Li, J., Tang, M., Bai, J., Shi, Y., Wang, R., Zhang, J., Wang, C., Wu, K., Qi, M., Cai, K., Gu, X., Liu, Q., & Zheng, Z. (2026). Beneath the Surface: What We Overlook When We Talk About Agent Evolution (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07624", "why": "モデルの重みを変えずに実行環境（ハーネス）を進化させる自己改良の4手法を、反復評価と介入実験で調べた。進化した16のエージェントすべてが新たに解ける課題を得る一方で以前解けた課題を失っており、ベンチマークの得点の上昇が信頼性や移転可能な改善を意味しないことを示した。"}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "AIに任せたい仕事と自分に残したい仕事の境界", "title": "What to Delegate, What to Preserve: Human Preferences for Agentic AI Across Everyday Life and Work", "url": "https://arxiv.org/abs/2611.09730", "authors": "Sarah Wheeler ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wheeler, S., Rammouz, V., Qian, Y., Liu, Z., Wei, M., Rios, A., He, T., & Zhou, K. (2026). What to Delegate, What to Preserve: Human Preferences for Agentic AI Across Everyday Life and Work (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09730", "why": "AIの利用経験がある米国の成人289人に9つの生活領域の45の場面を評価してもらい、AIエージェントへの委任の選好を調べた。AIへの信頼や費用の節約の見込みが自動化への選好を高め、自己実現が損なわれるという懸念が選好を下げることを一般化推定方程式で示した。"}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "ガウス点の間隔をそろえ任意の場面を3D再構成", "title": "SplatAnything: Gaussian Spacing Normalization for Feed-forward 3DGS across Arbitrary Scenes", "url": "https://arxiv.org/abs/2611.08264", "authors": "Hao Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Yu, H., Wang, Z., Hu, Y., Gong, Y., Wu, J., Zhou, X., Bao, H., Wang, T., Guo, C., & Peng, S. (2026). SplatAnything: Gaussian Spacing Normalization for Feed-forward 3DGS across Arbitrary Scenes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08264", "why": "画像から一度の推論で3次元ガウススプラッティングを作る手法で、場面の大きさやカメラ配置によって隣り合うガウスの間隔がばらつき、学習の目標がずれる問題を指摘した。ガウス間隔の正規化（GSNorm）でこれをそろえ、多様なデータ・疎な入力・外挿視点を含む新しいベンチマークで最高水準の性能を報告した。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "LLMの一対比較で作文を採点する効率的な組合せ", "title": "Adaptive Pair Selection in Large Language Model–Based Comparative Judgment of Writing", "url": "https://doi.org/10.2139/ssrn.7681477", "authors": "Sterett H. Mercer", "venue": "SSRN", "date": "2026-11-09", "apa": "Mercer, S. H. (2026). Adaptive Pair Selection in Large Language Model–Based Comparative Judgment of Writing. https://doi.org/10.2139/ssrn.7681477", "why": "1,714本の作文への676,326件のLLMの一対比較の判断を使い、4つの適応的なペアの選び方と5つのブラッドリー–テリー推定量を比べた。適応的なペア選択は中程度の比較回数で効率を上げたが、複合的な選び方に明確な利点はなかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMによる作文の一対比較判断で、ペアの選び方・得点の推定量・打ち切りの規則の組合せが採点の効率と信頼性をどう左右するかを、67万件超の判断で調べた（抄録）。", "p3": "16の課題・6つの特性について1,714本の作文への676,326件のLLMの判断を使い、作文あたり2〜16回の比較で、4つのペアの選び方（無作為・最大の曖昧さ・中程度の曖昧さ・複合）と、2つのベイズ型・3つの頻度論型のブラッドリー–テリー推定量を比べた（抄録）。", "p5": "適応的なペア選択は中程度の比較回数で効率を上げたが、複合型に明確な利点はなかった。ベイズ推定量は最大の比較回数でも信頼性.90に届かなかったが、比較の系列の74〜89%は全比較の得点との決定係数.90以上に達した。頻度論型の信頼性推定は比較が少ないと不安定だった（抄録）。", "fun": "作文に点数をつけるより、「AとBのどちらが上手か」を何度も比べる方が判断はぶれにくくなります。ただし比べる組合せは膨大です。この研究はAIに67万回以上比べさせ、どの組を比べれば少ない回数で正しい順位に近づくかを調べました。万能な方法はなく、組の選び方・点の付け方・やめ時をセットで決める必要があるという結論が面白いところです。", "unverified": "本文を入手できず、使ったLLMの種類と、人間の採点との一致は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "貧困卒業プログラム49研究のベイズ型メタ分析", "title": "Doing Better at Doing Good: Lessons from a Bayesian Meta-Analysis After 20 Years of Poverty Graduation Programs", "url": "https://doi.org/10.3386/w35991", "authors": "Samantha Carter ほか", "venue": "NBER Working Paper", "apa": "Carter, S., Jee, E., Karlan, D., & Premand, P. (2026). Doing Better at Doing Good: Lessons from a Bayesian Meta-Analysis After 20 Years of Poverty Graduation Programs (NBER Working Paper No. 35991). National Bureau of Economic Research. https://www.nber.org/papers/w35991", "why": "消費支援・貯蓄・技能訓練・指導・一括給付のうち3つ以上を含む貧困卒業プログラムの49研究（81の処置）を階層ベイズでメタ分析した。月間消費が購買力平価で38ドル（11%）、所得が28ドル（15%）増え、貯蓄・食料安全・精神的健康なども改善したことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "消費支援・貯蓄・技能訓練・指導・一括給付を組み合わせた貧困卒業プログラムの20年分の評価を、49研究のベイズ型の階層メタ分析で統合した（抄録）。", "p3": "5つの要素のうち3つ以上を含むプログラムの49研究（81の処置の変種）を対象に、経済的・心理社会的な成果への効果、費用対効果、実施時期による違いを階層ベイズで推定した（抄録）。", "p5": "月間消費は購買力平価で38ドル（11%）、所得は28ドル（15%）増え、貯蓄・資産・食料安全・精神的健康・女性のエンパワーメントも改善した。大きな給付（400ドル以上）や高価なプログラムは効果が大きいが費用対効果は高くなく、2016年以降の実施は便益費用比が5.39と2015年までの2.89より高かった（抄録）。", "fun": "貧しい家庭を支える複合的なプログラムは、20年でどれだけ上達したのでしょうか。49の研究をまとめると、2016年以降のプログラムは費用あたりの効果がそれ以前のほぼ倍で、それは費用や構成の変化では説明できませんでした。現場が経験から学び実施の質を上げてきた可能性が見える点が面白いところです。", "unverified": "本文を入手できず、2016年以降の改善の要因（著者は分野の継続的な学習と実施の質の向上を仮説としている）の検証方法は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "税の知識を教えても納税は増えない（ガーナ）", "title": "Knowledge Without Taxation? Experimental Evidence from a Tax Education Program", "url": "https://doi.org/10.3386/w36002", "authors": "Anders Jensen ほか", "venue": "NBER Working Paper", "apa": "Jensen, A., Kumar, N., & Poensgen, K. (2026). Knowledge Without Taxation? Experimental Evidence from a Tax Education Program (NBER Working Paper No. 36002). National Bureau of Economic Research. https://www.nber.org/papers/w36002", "why": "ガーナで固定資産税の教育を所有者と現場の徴税職員に無作為に提供した実験で、知識は増え近隣にも広がったが、納税額は増えなかった。納税者は徴税の執行力を低く見積もるようになり、合法的に負担を減らす方法にも気づいたことから、知識が国家の執行力の弱さを露呈させうることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "ガーナの固定資産税で、所有者と現場の徴税職員への税の教育を無作為に行った実験で、知識は増えても納税は増えないことを示した（抄録）。", "p3": "固定資産の所有者と現場の職員に無作為に税の教育を提供し、税の知識、社会的なつながりを通じた波及、納税、納税者と職員のやり取り、執行能力への信念を調べた（抄録）。", "p5": "教育は税の知識を高め、その知識は処置を受けていない近隣にも広がったが、納税は増えなかった。教育を受けた納税者と職員はやり取りに積極的になったが協力的な関係は育たず、納税者は執行能力の見積りを下げ、合法的に負担を減らす方法を知るようになった（抄録）。", "fun": "税の仕組みを知れば、人はきちんと払うようになると思いがちです。ところがこの実験では、知識が増えると、役所が実は取り立てる力をあまり持っていないことや、合法的に払う額を減らす方法にも気づいてしまいました。知識が「もろ刃の剣」になるという意外な結果が面白いところです。", "unverified": "本文を入手できず、対象の人数・地域と効果の大きさの数値は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "罰金に違反点数を加えると速度違反の再犯が減る", "title": "Sanctions, Evasion, and Deterrence: Evidence from Speeding Enforcement", "url": "https://arxiv.org/abs/2611.09337", "authors": "Romain Gauriot ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Gauriot, R., & Wisniewska, M. (2026). Sanctions, Evasion, and Deterrence: Evidence from Speeding Enforcement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09337", "why": "オーストラリアのクイーンズランド州での制裁強化を利用し、罰金と違反点数が速度違反の再犯と他の運転者への責任転嫁に与える因果効果を推定した。罰金の引上げだけでは再犯の減少は小さく、違反点数の追加を伴うと再犯が4.6ポイント減った。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "罰金と累積する違反点数という2種類の制裁が、速度違反の再犯と他の運転者への責任の付け替えにどう影響するかを、制裁の大幅な強化を利用して因果的に推定した（抄録）。", "p3": "オーストラリアのクイーンズランド州での制裁の大きな引上げを利用し、その後の違反と、別の運転者を違反者として申告すること（責任の転嫁）への因果効果を推定した（抄録）。", "p5": "違反点数が重くなると申告の付け替えが増え、戦略的な責任転嫁と整合した。罰金の引上げだけの違反者では再犯の減少は小さかったが、罰金に違反点数の追加が伴うと再犯は4.6ポイント減った（抄録）。", "fun": "スピード違反を減らすには、罰金を上げるのと免許の点数を引くのと、どちらが効くでしょうか。この研究では、お金の罰だけでは再犯はあまり減らず、点数が加わると大きく減りました。一方で点数が重くなると、別の人が運転していたことにする「身代わり」が増えるという副作用も見つかった点が面白いところです。", "unverified": "本文を入手できず、推定の手法（比較の方法）と、責任転嫁の増加の大きさは未確認。"}}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "海水温の変化が欧州の漁業収入を減らす", "title": "The Impact of Climate Change on Fisheries", "url": "https://doi.org/10.3386/w35994", "authors": "Fabio Cevenini ほか", "venue": "NBER Working Paper", "apa": "Cevenini, F., Costello, C., & Fezzi, C. (2026). The Impact of Climate Change on Fisheries (NBER Working Paper No. 35994). National Bureau of Economic Research. https://www.nber.org/papers/w35994", "why": "欧州の全漁船の2013〜2022年の250万件の空間的な漁獲収入データと、魚種ごとの耐温度範囲にもとづく「海洋積算温度」を使い、海水温の変化が漁業収入に与える因果効果を初めて推定したと報告した。好適な温度からの逸脱、とくに高温で収入が大きく減ることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "海水温の変化が漁業収入に与える因果効果を、欧州の全漁船の250万件の空間的な記録で初めて推定したと報告した（抄録）。", "p3": "単純な理論モデルにもとづく推定式を、2013〜2022年の欧州の全漁船の漁獲収入の観測に当てはめた。魚種ごとの耐温度範囲に対する温度の暴露を表す「海洋積算温度」を新たに作り、空間的な選択や魚種間の生態的な依存関係にも対処した（抄録）。", "p5": "魚種の好適な温度からの逸脱は漁獲収入を大きく減らし、とくに高温の影響が大きく、魚種の鉛直方向の移動性などがその効果を左右した。2100年までの予測では広く収入が減り、最も暖かいシナリオで年5.6億ユーロの損失に達し、低所得の赤道寄りの地域で最も大きかった（抄録）。", "fun": "海が温まると魚はどうなり、漁師の収入はどう変わるのでしょう。この研究は、魚の種類ごとに「快適な水温」からどれだけ外れたかを数える物差しを作り、欧州のすべての漁船の記録と突き合わせました。暑すぎる海が収入を大きく減らし、深く潜って逃げられる魚では影響が小さいという生き物らしい結果が面白いところです。", "unverified": "本文を入手できず、海洋積算温度の具体的な計算方法と、推定の頑健性の確認は未確認。"}}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "近所の仲間の出願が大学出願を後押しする", "title": "Peer Influence in College Applications", "url": "https://doi.org/10.3386/w35993", "authors": "Ana M. Gazmuri ほか", "venue": "NBER Working Paper", "apa": "Gazmuri, A. M., & Prager, E. (2026). Peer Influence in College Applications (NBER Working Paper No. 35993). National Bureau of Economic Research. https://www.nber.org/papers/w35993", "why": "異なる高校に通う近所の生徒を使って共通のショックを除き、教室単位の詳細なデータで仲間の出願行動が自分の出願に与える影響を推定した。出願した仲間への接触は出願率を高めるが合格者の追加効果はなく情報が経路であることを示し、反実仮想では都市と地方・男女の出願の差を埋めうる大きさだった。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "仲間がある大学の課程に出願すると自分の出願率も上がることを、教室単位の詳細なデータと近所の生徒を使った識別で示した（抄録）。", "p3": "異なる高校に通う近所の生徒を使って共通のショックへの懸念を和らげ、教室単位のデータで仲間の出願への接触の効果を推定した。合格確率が観測でき条件付きで独立な環境を使い、一般にNP困難な出願の組合せの選択問題を扱えるようにした（抄録）。", "p5": "出願した仲間への接触は出願率を高めたが、合格した仲間による追加の効果はなく、情報が経路であることと整合した。反実仮想では、その効果は難関課程への出願の都市と地方の差・男女の差を埋めるほど大きかった（抄録）。", "fun": "近所の先輩があの大学を受けたと聞くと、自分も受けてみようかと思うことがあります。この研究では、その効果は「受かった」ことではなく「受けた」こと自体から生まれていました。大事なのは憧れより情報で、情報の格差を埋めれば地域や性別による出願の差も縮みうるという点が面白いところです。", "unverified": "本文を入手できず、対象の国と制度、効果の大きさの数値は未確認。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "有意でない政策評価も効果の分布で判断に使う", "title": "Policy Evaluation Beyond Significance Testing: Evidence from Chicago's ShotSpotter Contract", "url": "https://doi.org/10.3386/w36005", "authors": "Terence Chau ほか", "venue": "NBER Working Paper", "apa": "Chau, T., Cook, P. J., Lopez, J., Ludwig, J., Roemer, A., & Soliman, A. K. (2026). Policy Evaluation Beyond Significance Testing: Evidence from Chicago's ShotSpotter Contract (NBER Working Paper No. 36005). National Bureau of Economic Research. https://www.nber.org/papers/w36005", "why": "検出力が不足した評価では、効果がゼロかどうかの検定より効果の確率分布を推定すべきだと論じ、シカゴの銃声検知システムShotSpotterの契約を例に示した。統計的に有意でない推定でも、費用を上回る便益の確率を評価することで政策判断に使えることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "統計的に有意でない政策評価も、効果の確率分布を推定すれば政策判断に使えることを、シカゴの銃声検知システムShotSpotterの契約で示した（抄録）。", "p3": "地理的な回帰不連続デザインでShotSpotterの効果を推定したうえで、救命の効果を確率変数とみなすベイズ分析で、便益が費用を上回る事後確率を求めた（抄録）。", "p5": "銃撃の致死率は2.5ポイント（年約49人の死亡減に相当）下がると推定されたが有意ではなく、この大きさを検定で検出するには87年分のデータが要る。便益が費用を上回る事後確率は、平坦な事前分布・統計的生命価値50万ドルで70%、害なしの事前分布・1,360万ドルで99.6%だった（抄録）。", "fun": "「統計的に有意でない」と言われると、効果がなかったと受け取りがちです。しかしこの研究では、銃声を検知する装置が年に約49人の命を救っている可能性があり、それを検定ではっきりさせるには87年分のデータが必要でした。白黒をつける代わりに「得になる確率」で考えると判断が変わるという点が面白いところです。", "unverified": "本文を入手できず、回帰不連続の境界の設定と、事前分布の選び方の根拠は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "景気変動を最もよく説明する金融政策ショック", "title": "The Main Monetary Policy Shock", "url": "https://doi.org/10.3386/w36004", "authors": "Christoph Boehm ほか", "venue": "NBER Working Paper", "apa": "Boehm, C., Kim, H., & Kroner, T. N. (2026). The Main Monetary Policy Shock (NBER Working Paper No. 36004). National Bureau of Economic Research. https://www.nber.org/papers/w36004", "why": "高頻度の利回り曲線のサプライズなどの線形結合として、マクロ変動を最もよく説明する「主要な金融政策ショック」を識別する手法を提案した。このショックは過去30年の景気変動の無視できない部分を説明し、引締めでも金利はほぼ動かないまま物価を持続的に下げドル高をもたらすなど、教科書的なショックと異なることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "複数の金融政策のサプライズの中から、マクロ経済の変動を最もよく説明する線形結合を「主要な金融政策ショック」として識別する新しい手順を提案した（抄録）。", "p3": "2つの標準的な高頻度の利回り曲線のサプライズと、Boehm and Kroner（2024）の利回り以外のショックを組み合わせ、マクロの変動を最もよく説明する結合を求めた（抄録）。", "p5": "このショックは過去30年の景気変動の無視できない部分を説明し、従来の結果と異なった。教科書的なショックとも大きく異なり、引締めのショックは金利をほとんど動かさないまま物価を持続的に下げてドル高にし、金融環境を一時的に引き締めて鉱工業生産を下げた（抄録）。", "fun": "中央銀行の政策の「驚き」は、ふつう金利の動きで測ります。この研究は、いくつかの驚きの組合せのうち景気を最もよく説明するものを探しました。すると、金利はほとんど動かないのに物価やドルが動く、教科書とはまったく違う姿のショックが見つかりました。金融政策の効き方の常識を問い直す点が面白いところです。", "unverified": "本文を入手できず、識別の具体的な手順と、説明できる変動の割合の数値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "AIの買い物助手が価格競争を弱めることがある", "title": "Artificial Shoppers and Attention Competition", "url": "https://arxiv.org/abs/2611.09399", "authors": "Xiaomeng Guo ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Guo, X., Xu, F., & Zhang, X. (2026). Artificial Shoppers and Attention Competition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09399", "why": "AIによる買い物の支援（推薦）と委任（代理購入）が、価格競争・プラットフォームの利益・消費者厚生に与える影響を理論モデルで分析した。消費者が目立つ属性を過大評価する状況では、品揃えへのアクセスが広がっても推薦型の支援が競争を弱めうることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIの買い物の助手（推薦型）と代理人（委任型）が、価格競争・プラットフォームの利益・消費者厚生に与える影響を理論モデルで分析した（抄録）。", "p3": "品質の異なる3商品のうち2つをプラットフォームが扱い、AIなしでは消費者が目立つ属性（価格か品質）を過大評価して比べる。推薦型ではAIが真の効用の高い2つを推薦し、委任型ではAIが最良の商品を選び購入の承認を求める。企業は戦略的に価格を付ける（抄録）。", "p5": "推薦型は品揃えへのアクセスが広がっても競争を弱めうる。最良の選択肢が推薦され安くなっても、目立つ属性に引かれて質の低い商品に乗り換え損をする消費者がいる「整合のパラドックス」を示し、プラットフォームが好む設計がAIなしの最適より利益と消費者余剰の両方を下げうることも示した（抄録）。", "fun": "AIが正しくおすすめしてくれれば、買い物は必ず得になりそうです。ところがこの理論では、AIが最良の品を正しく並べても、人が目立つ点（安さなど）につられて質の低い品に乗り換え、かえって損をする場合がありました。AIの正しさだけでは人の判断の癖は消えないという「整合のパラドックス」が面白いところです。", "unverified": "本文を入手できず、目立ちによる歪みの定式化と、各結果が成り立つ条件の詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "オペレーションズ・リサーチ", "headline": "LLMが重みを書いた分枝規則の利点は軽さだけ", "title": "Can a Language Model Write the Weights? An Empirical Study of LLM-Written Scoring Networks for Column Generation and MILP Branching, with a Bus-Driver Scheduling Application", "url": "https://arxiv.org/abs/2611.09559", "authors": "Renan Butkeraites", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Butkeraites, R. (2026). Can a Language Model Write the Weights? An Empirical Study of LLM-Written Scoring Networks for Column Generation and MILP Branching, with a Bus-Driver Scheduling Application (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09559", "why": "勾配学習なしにLLMが小さなニューラルネットの重みを直接書く「重み空間プログラミング」を、配送計画の列生成とSCIPの分枝変数の選択に試した。列生成では実質的な改善がなく、分枝では合成問題で既定規則より速い一方、MIPLIB 2017の39問では解けた数が19対24と劣り、実データの乗務員スケジューリングでは単純な擬似費用規則と同等だった。著者は、利点は計算の軽さによるもので、論文自体をAIで作成したと明記している。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMが小さなニューラルネットの重みを勾配学習なしに直接書く「重み空間プログラミング」で、厳密な最適化アルゴリズムの採点規則を改善できるかを4つの研究で試し、利点は計算の軽さにとどまることを示した（抄録）。", "p3": "LLMが書いた小さな多層パーセプトロンに、時間枠つき配送計画の列生成での弧・ラベル・ng近傍の選択と、SCIPの分枝限定法での分枝変数の選択を担わせた。どんな重みでもアルゴリズムは厳密なままで、悪いネットワークは時間を損するだけである（抄録）。", "p5": "列生成では実質的な改善はなかった。分枝では手書きのネットワークが合成の独立集合問題を既定の規則の0.37倍の時間で解いたが、MIPLIB 2017の39問では解けた数が19対24だった。アトランタの交通機関の実データの乗務員スケジューリングでは0.63倍の時間だったが、単純な擬似費用規則も同等だった（抄録）。", "fun": "AIに計算の近道の「判断役」を書かせたら、最適化の計算は速くなるのでしょうか。結果は、速くなった場面はあっても、それはAIが書いた中身のおかげではなく、判断役が軽いおかげでした。単純な既存の規則でも同じだけ速かったのです。うまくいった理由を正直に切り分けた点が面白いところです。", "unverified": "本文を入手できず、4つの研究の詳しい設定とLLMへの指示の内容は未確認。論文は著者の指示のもとでAI（Claude Opus 5.5）が作成したと明記されている。"}}, {"id": "pn26", "rank": 26, "field": "オペレーションズ・リサーチ", "headline": "入れ子ロジットの制約付き価格設定を厳密に最適化", "title": "Constrained Nested-Logit Pricing: An Exact Reformulation and Global Optimization Method", "url": "https://arxiv.org/abs/2611.09023", "authors": "Hoang Giang Pham ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Pham, H. G., & Mai, T. (2026). Constrained Nested-Logit Pricing: An Exact Reformulation and Global Optimization Method (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09023", "why": "類似商品間の代替を表す入れ子ロジットの需要で、価格の上下限や加重価格上限の制約がある価格設定問題を厳密に再定式化し、大域最適化する方法を示した。難しい相互作用を入れ子の水準に集約し、計算量の指数が商品数ではなく入れ子の数で決まるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "類似商品どうしの強い代替を表す入れ子ロジットの需要のもとで、価格の上下限や加重価格上限の制約がある価格設定問題を厳密に再定式化し、大域最適化する方法を示した（抄録）。", "p3": "難しい相互作用を入れ子（商品のグループ）の水準に集約し、個々の商品については凸最適化のまま扱い、価格の離散化や需要の近似をせずに解く。最悪の計算量の指数が商品数ではなく入れ子の数で決まり、途中で止めても実行可能な価格と、あと得られうる利益の上限を返す（抄録）。", "p5": "合成実験で、入れ子が少なければ500商品までの品揃えで解を証明付きで求められた。制約なしの価格を実行可能な範囲へ射影する方法は、制約付きで直接最適化した場合より最大32.60%の利益を失った（抄録）。", "fun": "似た商品を何十種類も売る店が、「この値段より下げない」といった条件の中で値段を決めるのは難しい問題です。この研究は、商品を似たもの同士のグループにまとめて考えることで、難しさの源をグループの数に閉じ込めました。条件を後から当てはめるだけだと利益の3割以上を失いうるという結果も面白いところです。", "unverified": "本文を入手できず、実データでの検証の有無と、入れ子が多い場合の計算時間は未確認。"}}, {"id": "pn27", "rank": 27, "field": "オペレーションズ・リサーチ", "headline": "ADMMの乗数ステップは黄金比を超えても収束", "title": "The multiplier step size in classical two-block ADMM: convergence and counterexamples", "url": "https://arxiv.org/abs/2611.09169", "authors": "Benqi Liu ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Liu, B., Dai, Q., & Wen, Z. (2026). The multiplier step size in classical two-block ADMM: convergence and counterexamples (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09169", "why": "古典的な2ブロックのADMMで、乗数更新のステップ幅を黄金比より大きくしても制約像と乗数が収束する範囲を示した。さらに2未満の明示的な閾値以上では、実行不可能な周期軌道を持つ反例を構成した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "古典的な2ブロックのADMM（交互方向乗数法）で乗数の更新幅をどこまで大きくできるかを調べ、黄金比を超えても収束する範囲と、2未満で失敗する反例を示した（抄録）。", "p3": "罰則係数を固定し通常の主変数の更新を使う有限次元の凸問題で、KKT点が存在し各部分問題が毎回最小値をとるという仮定のもとで収束を解析し、大きな更新幅については2つの固定したコンパクトな多面体で反例を構成した（抄録）。", "p5": "制約像と乗数は黄金比を超える範囲で収束した。2未満の明示的な閾値以上では実行不可能な周期軌道があり、滑らかで強凸な目的関数でも循環しうるため、0から2の全区間についてのグロウィンスキーの問いに否定的に答えた。一般の凸の場合の一様収束の区間の端は約1.88688256にあり、上下の限界の差は0.000000174未満だった（抄録）。", "fun": "大きな問題を2つに分けて交互に解くADMMという方法では、1回にどれだけ大胆に修正してよいかが長年の疑問でした。この研究は、黄金比（約1.618）より大きくしても大丈夫な範囲を示す一方、2に届く前にぐるぐる回って抜け出せない例を作りました。限界を約1.887と小数点以下まで挟み込んだ点が面白いところです。", "unverified": "本文を入手できず、収束の証明の方法と反例の多面体の具体的な形は未確認。"}}, {"id": "pn28", "rank": 28, "field": "心理学・認知科学", "headline": "米国の州別の集団主義指標を25年ぶりに更新", "title": "Revisiting collectivism across the United States after twenty-five years: an updated state-level index and its geographic and psychological correlates", "url": "https://doi.org/10.31234/osf.io/akyhq", "authors": "Mark S. Chen ほか", "venue": "PsyArXiv", "date": "2026-11-09", "apa": "Chen, M. S., Li, S. M., Lee, B., Lathrop, B., & Park, D. (2026). Revisiting collectivism across the United States after twenty-five years: an updated state-level index and its geographic and psychological correlates. https://doi.org/10.31234/osf.io/akyhq", "why": "家族構造・婚姻の安定性・宗教性・交通手段・自営業などの指標を統合し、米国の州レベルの集団主義指数を25年ぶりに更新した。南部ほど集団主義が高い傾向は再現した一方、緯度による勾配は元の指数より弱かった。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の州ごとの集団主義の指標を、家族構造・婚姻の安定性・宗教性・交通の習慣・自営業などの行動と人口の指標から25年ぶりに作り直した（抄録）。", "p3": "従来の枠組みを踏まえて多様な行動・人口の指標を統合した新しい集団主義指数を作り、地理的な分布と心理的な指標との相関を調べた（抄録）。", "p5": "全体の傾向は過去の結果とおおむね一致したが、順位が大きく変わった州もあった。南部ほど集団主義が高く経度とはほとんど関連しない点は再現したが、緯度の勾配は元の指数より有意に弱かった。集団主義が高い州ほど大麻の使用・大量飲酒・うつの率が低く、文化の厳格さが高かった（抄録）。", "fun": "「個人を大事にするか、集団を大事にするか」という文化の違いは、国の間だけでなく一つの国の中にもあります。この研究は米国の州ごとの物差しを25年ぶりに作り直し、南ほど集団を重んじる傾向は変わらない一方、その南北の差は昔より小さくなっていることを示しました。文化の地図が時代とともに描き変わる点が面白いところです。", "unverified": "本文を入手できず、指標の重み付けの方法と相関の大きさの数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "心理学・認知科学", "headline": "報酬の与え方で記憶の想起の始まり方が変わる", "title": "Value-based control over memory encoding and search", "url": "https://doi.org/10.31234/osf.io/ygduf", "authors": "Sven Wientjes ほか", "venue": "PsyArXiv", "date": "2026-11-08", "apa": "Wientjes, S., Holroyd, C. B., & Polyn, S. M. (2026). Value-based control over memory encoding and search. https://doi.org/10.31234/osf.io/ygduf", "why": "報酬を記銘時に与えるか後の想起の成功に応じて与えるかで、自由再生の時間的な組織化がどう変わるかを調べた。想起の成功に報酬が伴うと、報酬のついた項目の始まりから想起を始める「リスト中間の初頭効果」が生じることを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "報酬を記銘時に与えるか後の想起の成功に応じて与えるかで自由再生の組立てがどう変わるかを調べ、動機づけられた記憶が、文脈と項目の結びつきの強化と、意図的な出来事の区切りの2つの仕組みに支えられることを示した（抄録）。", "p3": "報酬つきの項目とそうでない項目を混ぜたリストで自由再生の実験を行い、文脈維持・検索モデル（CMR）の新しい階層ベイズ版を個人の再生の系列に当てはめて、競合する説明を比べた（抄録）。", "p5": "想起の成功に報酬が伴うと、報酬つきの部分列の始まりから検索を始めることが多い「リスト中間の初頭効果」が生じた。モデルの当てはめから、初頭効果は冒頭の項目の記銘の強化だけでなく、特別な文脈を戦略的に呼び戻すことによると示唆された（抄録）。", "fun": "テストに出ると分かっている部分は覚えやすいものです。この実験では、思い出せたらご褒美がもらえると分かると、人はご褒美の区間の「始まり」を目印にして思い出し始めました。記憶は強く刻まれるだけでなく、自分で目次を作るように組み立て直されているという見方が面白いところです。", "unverified": "本文を入手できず、実験の参加者数と効果の大きさの数値は未確認。"}}, {"id": "pn30", "rank": 30, "field": "心理学・認知科学", "headline": "脳との対応は自然言語で学習したモデルに現れる", "title": "Language, Not Code Abstraction: Natural-language Training Shapes Brain-aligned Geometry", "url": "https://arxiv.org/abs/2611.09027", "authors": "I\\~nigo Parra", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Parra, I. (2026). Language, Not Code Abstraction: Natural-language Training Shapes Brain-aligned Geometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09027", "why": "物語・Python・C・アセンブリ・機械語で25のGPT-2-smallを学習し、脳活動データとの対応（ブレインスコア）を比べた。物語で学習したモデルは2つのベンチマークでコードのモデルの平均を上回り（Δr=0.053、0.059）、コードの学習は無作為な重みと同程度にとどまった。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "言語モデルが脳活動とよく対応するのは自然言語での学習のおかげで、プログラムのコードで学習した抽象的な構造では代わりにならないことを、同じ構成のモデルで比べて示した（抄録）。", "p3": "物語（TinyStories）・Python・C関数・x86-64アセンブリ・機械語でGPT-2-smallのモデルを計25個学習し、共通のトークナイザと符号化の手順で、対応する無作為な重みのモデルを基準に脳との対応（ブレインスコア）を測った（抄録）。", "p5": "Pereira-243とTuckute2024では物語のモデルが4つのコードのモデルの平均をΔr=0.053、0.059上回り（ホルム補正p<0.001）、コードの学習は無作為な重みと同程度だった。ただしBlank2014では差がなく、Fedorenko2016では言語の利点が見られず、利点はベンチマークに依存した（抄録）。", "fun": "プログラムの言葉も人間の言葉も、規則にしたがって並ぶ記号です。では、コードだけで学んだAIも人の脳に似た情報の表し方をするでしょうか。この研究では、脳との似方を生んでいたのは自然な言葉で学んだことで、コードでは偶然と変わりませんでした。ただし、どの脳データで測るかで結果が変わる点も面白いところです。", "unverified": "本文を入手できず、学習データの量と表現の幾何の分析の詳細は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械
