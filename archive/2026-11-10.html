学習", "headline": "専門家モデルの重みを事前情報に蒸留を加速", "title": "P^2-MOPD: Accelerating Multi-Teacher On-Policy Distillation via Parameter Priors", "url": "https://arxiv.org/abs/2611.03953", "authors": "Sinuo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Wang, S., Lu, J., Zhang, Z., Song, M., Sun, R., Luan, B., Xie, Y., Li, J., Jiang, D., Wu, Q., & Bai, Z. (2026). P$^2$-MOPD: Accelerating Multi-Teacher On-Policy Distillation via Parameter Priors (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.03953", "why": "複数の教師モデルからの方策上の蒸留で、学生と専門家のパラメータの線形結合の係数と学生の重みを同時に最適化するP²-MOPDを提案した。専門家の重みを事前情報として使いつつ学生を結合の範囲に閉じ込めない設計で、4つの領域・2つの規模で検証した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の教師モデルからの方策上の蒸留で、学生と専門家のパラメータの線形結合を1つの微分可能なモデルとみなし、結合の係数と学生の重みを同時に最適化するP²-MOPDを提案した（抄録）。", "p3": "学習なしのタスク算術は凍結した学生と専門家のパラメータの範囲から出られないが、P²-MOPDは学生を学習可能に保ち、専門家を範囲に閉じ込めない事前情報として使う。同じ初期値からの従来の蒸留（MOPD）と、4つの領域・1.7Bと4Bの規模で比べた（抄録）。", "p5": "P²-MOPDはMOPDより速く、領域間でより均等に能力を回復し、半分の学習ステップでMOPDの最終的な平均回復率を超えた。学習の最後に1.7Bのモデルは平均回復率94.7%に達し、MOPDの80.9%を上回った（抄録）。", "fun": "数学が得意な先生、プログラムが得意な先生など、複数の専門家AIの力を1つの小さなAIにまとめるのは大変です。この研究は、先生たちの「頭の中身（重み）」を出発点のヒントとして混ぜつつ、生徒自身も学び続けられるようにしました。半分の練習で追いついたという効率の良さが面白いところです。", "unverified": "本文を入手できず、4つの領域の内容と回復率の定義は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "テスト時強化学習の多数決ラベルの誤差を分解", "title": "On the Reliability of Majority-Vote Pseudo-Labels in Test-Time Reinforcement Learning", "url": "https://arxiv.org/abs/2611.09872", "authors": "Haoyu Wang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wang, H., Wang, R., Wang, Y., Guo, J., & Gong, M. (2026). On the Reliability of Majority-Vote Pseudo-Labels in Test-Time Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09872", "why": "ラベルなしデータで多数決の擬似ラベルを使うテスト時強化学習の誤差を、母集団の多数派の偏りと有限回の生成による変動に分解した。後者の影響を抑える頑健なDPO（PC-Dr.DPO）と忘却を減らす仕組みを提案し、6つの推論ベンチマークで評価した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ラベルのないデータで多数決の擬似ラベルを使うテスト時強化学習（TTRL）の誤差を分解し、生成の回数が有限であることによる揺らぎの影響を抑える頑健なDPOを提案した（抄録）。", "p3": "オンラインのDPOを使う多数決型のTTRLの誤差を、母集団の多数派の偏り（外部の正解なしには識別できない）と、問題ごとの有限回の生成による変動に分け、投票の信頼性に応じて重みを調整するPC-Dr.DPOと、自己教師による忘却を減らすキャッシュの仕組みを導入した（抄録）。", "p5": "6つの数学・知識集約型の推論ベンチマークと5つのモデルで、30の設定のうち24でPC-Dr.DPOは最も強いTTRLの比較手法と同等以上だった（抄録）。", "fun": "正解が分からない問題でAIを鍛えるとき、AIに何度も答えさせて一番多い答えを正解とみなす方法があります。でも、たまたま多数派になった答えを信じると間違いを覚えてしまいます。この研究は、票がばらついた問題では慎重に学ぶようにしました。多数決の「自信の度合い」を学び方に反映させる発想が面白いところです。", "unverified": "本文を入手できず、改善の大きさの数値と5つのモデルの種類は未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "正規化層のある深層網はリプシッツ定数が指数増大", "title": "On Lipschitz Explosion in Deep Neural Networks with Normalization: Consequences for Optimization and Adversarial Robustness", "url": "https://arxiv.org/abs/2611.08775", "authors": "Ashkan Soleymani ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Soleymani, A., Hosseinpourkhoshkbari, R., Daneshmand, H., & Jaillet, P. (2026). On Lipschitz Explosion in Deep Neural Networks with Normalization: Consequences for Optimization and Adversarial Robustness (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08775", "why": "バッチ正規化などの正規化層を持つ深層網では、各層の重みのノルムを抑えても入力と重みに対するリプシッツ定数が深さとともに指数的に増えうることを証明した。最適化の保証や敵対的な頑健性の議論に影響する結果である。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "バッチ正規化などの正規化層を持つ深層網では、各層の重みのノルムを抑えても、入力と重みに対するリプシッツ定数（出力の変化の大きさの上限）が深さとともに指数的に増えうることを証明した（抄録）。", "p3": "線形の活性化関数でも、各層で‖W‖≤1のような強い制御をしても起こることを示し、その帰結として、最適化の保証が次元に指数的な上限になり、リプシッツ定数に基づく汎化と頑健性の保証が無意味になることを導いた（抄録）。", "p5": "理論から、新しい特異方向を作る摂動は、同じ大きさで元の特異部分空間にとどまる摂動よりはるかに強く増幅されると予測し、MNIST・Fashion-MNIST・CIFAR-10の実験で、階数を増やす摂動の方が正解率・確信度・マージンを大きく下げることを確かめた（抄録）。", "fun": "学習を安定させるための部品（正規化層）が、見えないところで不安定さを生んでいるかもしれません。この研究は、各層を一つずつ見るとおとなしいのに、全体ではわずかな入力の違いが何倍にも膨らみうることを証明しました。部分を確かめても全体の安全は保証できないという教訓が面白いところです。", "unverified": "本文を入手できず、実験での低下の大きさの数値は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "小さなチームを並列に走らせるとエージェントが伸びる", "title": "Test-Time Compute Scales Better with Parallel Agent Teams", "url": "https://arxiv.org/abs/2611.09798", "authors": "Junlin Wang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wang, J., Chen, H., Li, A., Chalamala, R., & Liu, Z. (2026). Test-Time Compute Scales Better with Parallel Agent Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09798", "why": "検証器で採点できる長期の課題で、多数の独立エージェントから最良を選ぶ方法と大きな1チームの協働の長所を合わせ、小さなチームを多数並列に走らせて最良を残す方法を提案した。27Bのモデル・100エージェントの予算で、10体のチームの並列化が12課題中10課題で独立エージェントの並列化を上回った。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "検証器で採点できる長期の課題で、多数の小さなエージェントのチームを並列に走らせて最良のチームの結果を残すと、テスト時の計算を効率よく性能に変えられることを示した（抄録）。", "p3": "多数の独立なエージェントから最良を選ぶ方法（すぐ頭打ちになる）と大きな1チームの協働（大きくすると伸びが止まる）の中間として、小さなチームを並列に走らせる。GPUカーネルから形式的証明、脆弱性を突くコードの開発まで12の長期課題で、27Bのモデルと100エージェントの予算で比べた（抄録）。", "p5": "10体のチームの並列化は12課題中10課題で独立エージェントの並列化を上回り、100体の1チームを試した4課題すべてでそれを上回った。同じ費用ではフロンティアモデルに半数の課題で勝った。単純な統計モデルで、独立エージェントは平均が低く、大きな1チームはばらつきの恩恵がないため負けると説明した（抄録）。", "fun": "難しい問題に100人で挑むなら、100人がばらばらに挑むのと、100人で1チームを作るのと、どちらがよいでしょう。この研究のAIでは、10人ずつの小チームを10個作って一番よい結果を採るのが最も強くなりました。チームの協力で平均を上げつつ、チームの数で「当たり」を引く機会も残すという統計的な理屈が面白いところです。", "unverified": "本文を入手できず、各課題の具体的な点数と使用したモデルの名前は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "LLMの創造的な出力の新しさを構造的に測る", "title": "AlienBench: A Benchmark of Structural Novelty in Language Model Outputs", "url": "https://arxiv.org/abs/2611.09094", "authors": "Jonas Oppenlaender ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Oppenlaender, J., & Silvennoinen, J. M. (2026). AlienBench: A Benchmark of Structural Novelty in Language Model Outputs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09094", "why": "人が異星の生物を想像する認知心理学の課題を使い、LLMの出力が地球の動物の特徴という既知の基準からどれだけ離れるかで新しさを測るベンチマークを作り、評定者の主観に頼らない新規性の尺度を示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "異星の生物を想像させる認知心理学の課題をLLMに当てはめ、出力が地球の動物の特徴からどれだけ離れるかで新しさを測るベンチマークAlienBenchを作った（抄録）。", "p3": "モデルが異星の生物を描写し、3つのLLMの判定者が10の生物学的な特徴を取り出して地球型か逸脱かを判定し、逸脱の数（0〜10）を得点とする。6つのプロンプト条件で各30件、計180件の描写を10のモデルに生成させた（抄録）。", "p5": "総合得点は3.28（GPT-6 Luna）から6.55（Ministral 3 14B）まで分かれ、公開重みのモデルが商用モデルより高かった（5.40対4.58）。基本のプロンプトでは、モデルはどの特徴でも人間の参加者100人より平均して地球型から離れることが多かった（抄録）。", "fun": "「宇宙人を想像して」と頼むと、多くの人は左右対称で足で歩く生き物を描いてしまいます。この研究は、地球の生き物の当たり前からどれだけ離れられるかでAIの発想の新しさを測りました。大手の高性能なAIより公開されている小さめのAIの方が奇抜で、人間よりもAIの方が型を破ったという結果が面白いところです。", "unverified": "本文を入手できず、判定者のLLMによる判定の信頼性と、人間の参加者の条件は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "エージェントが自分の働き方を改良できるかを測る", "title": "Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents", "url": "https://arxiv.org/abs/2611.08946", "authors": "Jingdong Zhang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Zhang, J., Wang, J., Yu, Z., Cai, Y., Chow, W., Choy, C., Dou, Z., Hua, H., Li, J., Liu, Z., Wang, C., Wei, S., Yang, S., Yuan, Y., Zhan, X., Zhang, Y., Zheng, S., Li, X., Liu, L., … Wang, W. (2026). Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08946", "why": "視覚とロボティクスの課題で、エージェントが課題の評価を使って解法だけでなくプロンプト・道具・記憶などの実行環境を改良できるかを、固定予算で評価するベンチマークFlex-RSIを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "エージェントが課題のフィードバックを使って、解答だけでなく自分の働き方（プロンプト・道具・記憶・制御の仕組み）まで改良できるかを、視覚とロボティクスの課題で固定予算のもとに測るベンチマークFlex-RSIを作った（抄録）。", "p3": "各回で実行役が解答を改良し、検証用データで得点が上がった場合だけ残し、改良役が実行役と自分自身を含むハーネスを修正する。すべての実行は同じ汎用のハーネスから始め、最終解は隠したテストデータで採点する。商用と公開重みのモデルを評価した（抄録）。", "p5": "自己改良はエージェントが自分で解を組み立てるときに最も役立ち、成功か失敗かだけのフィードバックは公開重みのモデルの足かせになり、物理的な安定性や厳密な正しさの検査が必要な課題で公開重みのモデルが最も遅れた。対になる実行の比較から、ハーネス自体の編集も改善に寄与していた（抄録）。", "fun": "人は失敗から答えを直すだけでなく、勉強のやり方そのものを見直すことがあります。この研究は、AIも同じように「やり方」を自分で改良できるかを試す場を作りました。成功か失敗かしか教えてもらえないと伸び悩むAIがあったのは、人の学びにも通じるようで面白いところです。", "unverified": "本文を入手できず、モデルごとの具体的な得点と課題の数は未確認。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "異分散ノイズを均して低ランク信号を回復", "title": "Blind Noise Equalization for Large Data Matrices under General Variance Profiles", "url": "https://arxiv.org/abs/2611.08784", "authors": "Boris Landa ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "成分ごとにノイズ分散が異なる大規模データ行列で、行と列を反復的に再尺度化してノイズ分散を均すBRINEを提案した。適切な条件のもとでノイズのスペクトルにマルチェンコ–パスツール則を回復し、信号やノイズの構造を知らなくても弱い信号成分を見えやすくする。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "成分ごとにノイズの分散が異なる大規模データ行列で、行と列を反復的に再尺度化して平均のノイズ分散を均す手法BRINEを提案し、ノイズのスペクトルの理論的な形を回復できることを示した（抄録）。", "p3": "未知のノイズ分散の代わりに、データのレゾルベントの対角成分を均すという発想で、母集団の水準での均等化を特徴づけるポテンシャル関数を見つけ、それを最小化する反復法を導いた。更新はノイズのあるデータから直接推定できる（抄録）。", "p5": "任意の正の分散の形に対して反復が真の均等化子に収束することを、穏やかな条件では幾何級数的な速さで証明し、尺度係数の確率的な誤差の上限を与えた。多様な生物学的データと前処理の流れでのシミュレーションと実験で有効性を示した（抄録）。", "fun": "大きな表のデータには、行や列によって雑音の大きさが違うことがよくあります。そのままでは雑音が「偽の模様」を作り、本当の弱い信号を隠してしまいます。この研究は、雑音の大きさを知らないまま、行と列の目盛りを少しずつ調整して雑音をならす方法を作りました。見えないものを間接的な手がかりでそろえる発想が面白いところです。", "unverified": "本文を入手できず、生物学的データでの改善の具体的な数値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "統計学", "headline": "資産の分位点を小地域・属性別にベイズ推定", "title": "Bayesian Unit-level Quantile Modeling with Application to Wealth Data", "url": "https://arxiv.org/abs/2611.08843", "authors": "Daniel Vedensky ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "正負の値をとり裾の重い資産データについて、調査ウェイトを考慮した非対称ラプラス疑似尤度のベイズ単位レベルモデルを提案し、時間・地域・細かな属性別の分位点を推定できるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "正負の値をとり、偏りが大きく裾の重い資産データについて、時間・地域・細かな属性別の分位点を推定できるベイズ型の単位レベルのモデルを提案した（抄録）。", "p3": "調査ウェイトを調整し、空間と時間の依存も考慮する非対称ラプラス疑似尤度のベイズモデルで、ギブスサンプリングと高速な変分ベイズのアルゴリズムを示した（抄録）。", "p5": "米国の所得・プログラム参加調査（SIPP）に適用し、直接の推定ができない、または不安定な標本の少ない区分も含めて、世帯の資産分布の地理・時間・属性による違いを示した（抄録）。", "fun": "国全体の平均資産は分かっても、小さな地域の、ある年齢層の「下位10%の資産」となると、回答者が少なすぎて推定できません。しかも資産は借金でマイナスにもなります。この研究は、そうした扱いにくいデータでも、地域や時間のつながりを借りて細かな分布を推定する方法を作りました。少ないデータから格差の姿を描く工夫が面白いところです。", "unverified": "本文を入手できず、推定の精度の比較の数値と、得られた資産分布の具体的な結果は未確認。"}}, {"id": "pn39", "rank": 39, "field": "統計学", "headline": "移流の向きに合わせた時空間ガウス過程の近似", "title": "Advection-aligned block Vecchia inference for spatio-temporal Gaussian processes", "url": "https://arxiv.org/abs/2611.08938", "authors": "Joonwon Lee ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "大規模な時空間ガウス過程のベッキア近似で、データから推定した移流（輸送）の方向に沿って過去の観測を条件づけに選ぶ方法を提案した。静止衛星GEMSのオゾン全量の観測を動機とし、観測地点が格子上になくても使える。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "移流（輸送）を伴う大規模な時空間ガウス過程の推論で、データから推定した輸送の方向に沿って過去の観測を条件づけに選ぶブロック型のベッキア近似を提案した（抄録）。", "p3": "静止衛星GEMSのオゾン全量の観測を動機とし、最初に推定した移流ベクトルで輸送方向に沿った過去の条件づけのブロックを一度だけ選び、そのグラフを固定したまま共分散と移流のパラメータを推定する。近傍の選択と共分散の推定を分け、GPUで尤度と勾配を計算する（抄録）。", "p5": "2024年7月と2025年7月の日別のGEMSデータでは、61日中53日で対象中心の条件づけより低い負の対数尤度を得た。6つのマターン型のシミュレーション（各120場）でも、同じ予算で移流ベクトルの推定誤差を減らし、輸送が強いほど減少が大きかった（抄録）。", "fun": "風で流されるオゾンのように、過去のある場所の値は、風上にあった値ほど今の値をよく教えてくれます。この研究は、計算を軽くするために参照する過去のデータを選ぶとき、風の向きに沿って選ぶようにしました。物理の流れの向きを統計の近似にそのまま組み込む発想が面白いところです。", "unverified": "本文を入手できず、計算時間の比較と予測精度の数値は未確認。"}}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "相関行列のボックス・コックス変換族を理論化", "title": "Box-Cox Transformations of Correlation Matrices", "url": "https://arxiv.org/abs/2611.09790", "authors": "Ilya Archakov ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "相関行列に対するボックス・コックス変換の族を定義し、生の相関や一般化フィッシャー変換を特別な場合として含むことを示した。逆問題が厳密に凸であることや、α≤0のときに限り全空間への写像になることなどを証明した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "相関行列にボックス・コックス変換を施す変換の族を定義し、生の相関、一般化フィッシャー変換、精度行列の座標を特別な場合として含むことと、その数学的な性質を示した（抄録）。", "p3": "相関行列Cに対してΦα(C)=vecl{(C^α−I)/α}を考え、逆問題の凸性、写像の像、ヤコビアンの条件数、ガウス標本のもとでの変換後の標本相関の漸近分布を調べた（抄録）。", "p5": "逆問題はすべてのαで厳密に凸で各写像は単射であり、全空間への写像になるのはα≤0のときに限る。独立のもとで変換後の標本相関の漸近共分散は単位行列になるが、相関の1次まで単位行列を保つのはα=0だけで、独立での3次キュムラントが消えるのはα=1/3だけだった（抄録）。", "fun": "相関係数は−1から1の間にしか値をとらないため、そのまま統計の計算に使うと扱いにくいことがあります。昔から使われるフィッシャー変換はこの制限を外す工夫でした。この研究は、相関の行列全体に使える変換を一つの家族としてまとめ、どの一員が何に向くかを数学的に整理しました。既知の変換が一本の線の上に並ぶ点が面白いところです。", "unverified": "本文を入手できず、実データへの応用の有無は未確認。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "ChatGPTの広告導入後に週間利用者が5.4%減", "title": "Monetization of Generative AI: Advertising, User Engagement, and Market Outcomes", "url": "https://doi.org/10.2139/ssrn.7681558", "authors": "Jingwei Dai ほか", "venue": "SSRN", "date": "2026-11-09", "why": "米国でのChatGPTへの広告導入を、他国を対照とした差の差分析で調べ、週間アクティブ利用者が5.4%減ったことを示した。AIアプリの利用者が多い都市圏ほど減少が大きかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国でChatGPTに広告が導入された後、週間アクティブ利用者が5.4%減ったことを、他国を対照とする差の差分析で示した（抄録）。", "p3": "都市圏と国の単位のモバイルアプリの利用データを使い、米国と対照国を比べる差の差分析で、広告導入の前後の利用者数・利用時間・課金収入の変化を推定した（抄録）。", "p5": "ChatGPTの週間アクティブ利用者は5.4%減り、もともとAIアプリの利用者が多い都市圏ほど減少が大きかった。競合するClaudeとGeminiとの比較でも相対的な減少が見られ、国の単位では米国の利用時間と課金収入も相対的に減った。広告収入は考慮しておらず、全体の収益性は評価していない（抄録）。", "fun": "無料のサービスは広告で成り立つことが多いですが、AIとの会話に広告が入ると利用者はどう感じるでしょう。この研究では、広告が始まった米国でChatGPTの利用者が他国より減っていました。広告で稼ぐことと使い続けてもらうことの間の綱引きが、データではっきり見える点が面白いところです。", "unverified": "本文を入手できず、対照国の選び方と平行トレンドの確認、利用時間と課金収入の減少の大きさは未確認。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "LLMの順位表の競争が能力の画一化を招く条件", "title": "Strategic Competition and Convergence in LLM Leaderboards", "url": "https://arxiv.org/abs/2611.09780", "authors": "Naveen Raman ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "LLMの開発者が勝率を最大化するよう能力ごとに資源を配分するゲームとして順位表の競争を定式化した。生産関数が似ていると能力の構成が似通い、比較優位があれば多様性が保たれ、収穫逓減が上位の過密化を招くことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの順位表での競争を、開発者が勝率を最大化するよう能力ごとに資源を配分するゲームとして定式化し、能力の画一化や性能の収束が起こる条件を分析した（抄録）。", "p3": "似た生産関数が似た能力構成を生み、比較優位が異なる能力構成を保ち、収穫逓減が上位の過密化を招くことを理論的に示し、LM ArenaとOpenRouterのデータで確かめた（抄録）。", "p5": "開発者は競合に遅れている分野でより大きく改善しつつ分野ごとの強みを保っており、上位のモデルはますます混み合う一方で、モデルの利用のされ方は多様化していた。競争の激化が互換的なモデルを生むとは限らず、異なる強みを持つモデルを支えうると論じた（抄録）。", "fun": "順位表で競い合うと、みんなが同じような点の取り方を目指して似たり寄ったりになりそうです。しかしこの研究によると、得意分野の違いがあれば、それぞれの個性は残りうるといいます。実際のデータでも、トップ集団は混み合いながら、使われ方はばらばらになっていました。競争と多様性が両立しうるという点が面白いところです。", "unverified": "本文を入手できず、データ分析の具体的な手法と数値は未確認。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "モデルポートフォリオが投資信託の競争を弱める", "title": "Centralized Financial Advice and Competition for Capital&nbsp;", "url": "https://doi.org/10.2139/ssrn.7681563", "authors": "Pietro Lazzaretto", "venue": "SSRN", "date": "2026-11-09", "why": "米国の助言付き資産の推計9.3兆ドルを導くモデルポートフォリオが、資金配分と運用者の競争の動機に与える影響を調べた。モデルの目標比率への調整は成績による資金流出を和らげる一方、好成績への報酬も弱めることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の助言付き資産の推計9.3兆ドルを導く「モデルポートフォリオ」が、投資信託への資金配分と運用者の競争の動機をどう変えるかを調べた（抄録）。", "p3": "ファイナンシャル・アドバイザーがポートフォリオの構築を集中化した投資規則（モデルポートフォリオ）に委ねる動きを捉え、モデルの推奨への露出が資金の流れ、成績が悪かった後のリスクの取り方、成績の持続性に与える影響を分析した（抄録）。", "p5": "モデルは資金の流れの有意で逆張り的な要因で、目標比率への調整が成績による資金流出を和らげる一方、好成績への報酬も弱めた。モデルへの露出が大きい投信は成績不振の後にリスクを取らず、成績の持続性も弱かった（抄録）。", "fun": "投資のプロの判断が、少数の「お手本の配分表」に任されるようになると何が起きるでしょう。この研究では、お手本に従う資金の動きが、成績の悪い投信からの急な資金流出を和らげる一方、成績の良い投信へのご褒美も減らしていました。安定と引き換えに、運用者のやる気が削がれるかもしれないという点が面白いところです。", "unverified": "本文を入手できず、モデルの推奨への露出の測り方と、効果の大きさの数値は未確認。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "学位の種類が企業の生産性に与える効果を推計", "title": "Which types of education raise firm productivity? Evidence for managers and workers in the UK", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141789", "authors": "Hall, Tessa", "venue": "RePEc NEP", "date": "2026-11-09", "why": "英国の2万社超の企業でLinkedInの職歴パネルと財務データを結び、学位の分野・出身校・水準が企業の生産性に与える効果を賃金への効果と比べた。企業内で学士号は労働者の生産性を約20%高め、管理職ではMBAなど大学院の資格に効果が集中していた。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "学位の分野・出身校・水準が企業の生産性に与える効果を、英国の2万社超の企業で推定し、賃金への効果と比べた（抄録）。", "p3": "Revelio LabsのLinkedInのパネルとOrbisの財務データを2015〜2024年について結びつけ、企業内での学位の種類ごとの生産性への寄与を、管理職と非管理職に分けて推定した（抄録）。", "p5": "企業内で学士号は労働者の生産性を約20%高め、上位20校の出身でさらに10%、大学院の資格で6%加わった。STEM分野や一流校は非管理職の生産性を高めたが管理職では高めず、管理職ではMBAなど大学院の資格に効果が集中した。STEMの非管理職は生産性より低い賃金、学位のある管理職は高い賃金を受けていた（抄録）。", "fun": "大学で何を学んだかは、会社の生産性にどれだけ効くのでしょう。この研究では、理系の専門の学位は現場の働き手の生産性を高める一方で、管理職ではMBAのような学位の方が効いていました。しかも給料は、理系の働き手には実力より低く、管理職には高めに払われているという「ずれ」も見えた点が面白いところです。", "unverified": "本文を入手できず、生産性の測り方（付加価値など）と、因果的な解釈の根拠は未確認。"}}, {"id": "pn45", "rank": 45, "field": "経営学", "headline": "公共調達への依存が企業の環境投資を減らす", "title": "Working Papers in Responsible Banking &amp; Finance Procuring Pollution? How Government Spending Shapes Firms' Green Investments", "url": "https://doi.org/10.2139/ssrn.7681580", "authors": "Matilde Cappelletti ほか", "venue": "SSRN", "date": "2026-11-09", "why": "イタリアの全公共調達契約と企業の財務データ（2015〜2024年）を結び、公共調達への依存が高い企業ほど環境投資が少ないことを示した。脱炭素の圧力が強い時期と資金制約の弱い企業で影響が大きかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "政府の公共調達への依存が高い企業ほど環境投資が少ないことを、イタリアの全公共調達契約と企業の財務データで示した（抄録）。", "p3": "2015〜2024年のイタリアの全公共調達契約を企業の財務データと環境投資の強度の指標に結びつけた新しいデータで、調達への依存と環境投資の関係を分析し、落札の段階で環境基準を考慮した場合と比べた（抄録）。", "p5": "公共調達への依存が高いほど環境投資は低く、その影響は脱炭素の圧力が強い時期と資金制約の弱い企業で大きかった。落札の段階で政府の買い手が環境基準を考慮した場合には、環境投資への負の影響は見られなかった（抄録）。", "fun": "政府は気候対策を掲げながら、同時に大量の物やサービスを企業から買っています。この研究では、環境に配慮しない基準で政府の仕事を受注する会社ほど、市場からの脱炭素の圧力を受けにくくなり、環境投資を減らしていました。政府の「買い方」そのものが気候政策の効き目を左右するという点が面白いところです。", "unverified": "本文を入手できず、環境投資の強度の測り方と、因果の識別の方法は未確認。"}}, {"id": "pn46", "rank": 46, "field": "経済学", "headline": "大手通信会社は投資で規制の介入を抑止する", "title": "Policy Deterrence: Strategic Investment in U.S. Broadband", "url": "https://doi.org/10.3386/w35992", "authors": "Karam Kang ほか", "venue": "NBER Working Paper", "why": "2010〜2019年の米国のブロードバンド整備と州の政策データで、大手事業者は選挙の接戦郡で設備を多く増強し、その後に参入を促す政策が少なくなることを示した。投資が政策当局の介入の利得を下げるモデルで解釈し、総整備量を減らしうることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "大手のインターネット事業者が選挙の接戦郡で設備を増強し、それが小規模事業者の参入を後押しする州の政策を抑止している可能性を、データとモデルで示した（抄録）。", "p3": "2010〜2019年の米国のブロードバンド整備と州の政策データを使い、大手事業者の設備容量と、その後の参入・投資を促す政策（とくに道路占用の便宜）の関係を分析し、大手の設備が政策当局の介入の利得を下げるモデルで解釈した（抄録）。", "p5": "大手事業者は選挙で接戦の郡で容量をより多く拡大し、接戦郡で大手の容量が大きいほど、その後の参入と投資を促す政策が少なかった。モデルでは政策の抑止が大手の市場占有率を高め、総整備量を減らしうることが示された（抄録）。", "fun": "企業は政治献金だけでなく、設備投資の仕方でも政策に影響を与えうるのでしょうか。この研究は、大手の通信会社が選挙で接戦の地域ほど先回りして設備を増やし、その結果、新しい会社の参入を助ける政策が出にくくなっていたことを示しました。投資が「政策を止める道具」にもなりうるという見方が面白いところです。", "unverified": "本文を入手できず、関連が因果か相関かの識別の方法と、効果の大きさは未確認。"}}, {"id": "pn47", "rank": 47, "field": "経済学", "headline": "フードスタンプ無料化で加入は25%増、出生体重は不変", "title": "When Food Stamps Became Free: Impacts and Implications of Removing the Purchase Requirement", "url": "https://doi.org/10.3386/w35996", "authors": "Amy Finkelstein ほか", "venue": "NBER Working Paper", "why": "1979年にフードスタンプの購入要件を廃止した改革を地域差で分析し、加入が1.85ポイント（約25%）増え、新規加入者はより貧しかったことを示した。乳児の健康の改善は見られず、信頼区間で出生体重の2%を超える改善を否定した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "1979年に米国のフードスタンプの購入要件をなくし無料にした改革を分析し、加入は大きく増えたが乳児の健康は改善しなかった一方、再分配としては社会厚生を高めたことを示した（抄録）。", "p3": "改革で食料補助が65%から100%に上がったことへの地域ごとの暴露の違いを利用して、加入・乳児の健康・受給者が給付に置く価値を推定した（抄録）。", "p5": "加入は1.85ポイント（標準誤差0.15）、約25%増え、新規加入者はより貧しかった。出生体重の2%を超える改善は95%信頼区間で否定された。受給者は1ドルの給付を59セント（42〜77セント）と評価するかのように振る舞ったが、非常に低所得の世帯に届くため、標準的な再分配の選好のもとでは社会厚生を高めた（抄録）。", "fun": "食料の引換券を「少し払えば買える」から「無料」にすると、何が変わったでしょう。もっと貧しい家庭が加わるようになった一方、赤ちゃんの健康は良くなりませんでした。受け取る人にとって1ドル分の券の価値は約59セントにすぎなくても、本当に困っている人に届くなら社会全体では意味があるという考え方が面白いところです。", "unverified": "本文を入手できず、地域の暴露の測り方と、乳児の健康の指標の詳細は未確認。"}}, {"id": "pn48", "rank": 48, "field": "経済学", "headline": "非伝統的金融政策で預金が金利に敏感な顧客に偏る", "title": "Unconventional Monetary Policy and Deposit Retention", "url": "https://doi.org/10.3386/w35985", "authors": "Philip Strahan ほか", "venue": "NBER Working Paper", "why": "ゼロ金利と量的緩和が金利に敏感な預金者を銀行に引き寄せたことを示した。政策の正常化後には、量的緩和とゼロ金利への露出が大きい銀行ほど預金流出の感応度と預金ベータが高まり、預金の維持が高コスト・高リスクになった。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "ゼロ金利と量的緩和という非伝統的金融政策が、金利に敏感な預金者を銀行に引き寄せ、政策の正常化後に預金の維持を高コスト・高リスクにしたことを示した（抄録）。", "p3": "短期金利をゼロに保つ政策（ZLB）と中央銀行の非銀行からの債券購入（QE）への露出の違いを使い、預金の構成、預金流出の感応度、預金ベータ（政策金利に対する預金金利の追随度）の変化を調べた（抄録）。", "p5": "ゼロ金利は利回りの圧縮で高利回りの資金先を探す利点を小さくして金利に敏感な顧客を引き寄せ、量的緩和も金利に敏感な大口預金者を引き寄せた。政策の正常化後には、量的緩和とゼロ金利への露出が大きい銀行ほど預金流出の感応度と預金ベータが高まった（抄録）。", "fun": "金利がほぼゼロの時代には、どの銀行に預けても利息は同じなので、利息に敏感な人も普通の銀行に預金を置いたままにしました。ところが金利が戻ると、その人たちは一斉に条件の良い先へお金を移し始めます。昔の政策がのちに銀行の弱点として表れるという「時間差の副作用」が面白いところです。", "unverified": "本文を入手できず、使用したデータと露出の測り方、効果の大きさは未確認。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "女性向け採用補助で企業が離職女性を継続採用", "title": "Female-Targeted Hiring Subsidies, Firm Learning, and Women’s Employment", "url": "https://econpapers.repec.org/RePEc:sef:csefwp:796", "authors": "Mimosa Distefano ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "非就業から女性を雇うと社会保険料を一時的に減らすイタリアの制度を使い、補助を利用した企業がその後も職歴の中断した女性を多く採用し続けることを示した。最初の採用がうまくいった企業ほど後の採用が増え、企業が対象者の生産性を学習するという解釈と整合した。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "非就業から女性を雇うと社会保険料を一時的に減らすイタリアの採用補助を利用した企業が、その後も職歴の中断した女性を多く採用し続けることを示した（抄録）。", "p3": "非就業の女性を雇う際の社会保険料を一時的に下げた政策を利用し、補助の利用前後で企業の採用、最初の採用の質とその後の採用、補助で雇われた人の労働市場への定着を調べた（抄録）。", "p5": "補助を利用した企業は、母親を含む職歴の中断した女性を持続的に多く採用した。最初の採用がうまくいった企業ほど後の採用が増え、企業が対象者の生産性を学習するという解釈と整合した。補助で雇われた人は労働市場への定着も強かった（抄録）。", "fun": "出産などで仕事を離れた女性が再就職しにくいのは、会社がその人の実力を測りかねているからかもしれません。この研究では、採用の補助をきっかけに一度雇ってみた会社が、その後も同じような女性を雇い続けました。補助が「お試しの機会」となり、会社の思い込みを経験で書き換えたという見方が面白いところです。", "unverified": "本文を入手できず、補助の対象の条件の詳細と、効果の大きさの数値は未確認。"}}, {"id": "pn50", "rank": 50, "field": "因果推論", "headline": "時系列の因果探索を性質ごとに制御して評価", "title": "Composable Causality: A Toolkit for Systematic Time-Series Causal Discovery and Treatment-Effect Benchmarking", "url": "https://arxiv.org/abs/2611.08918", "authors": "Muhammad Hasan Ferdous ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "多変量時系列の因果探索と処置効果推定の評価に使う合成データを、疎性・ノイズ分布・欠測の仕組みなどを1つずつ変えて作れるツールキットDTCDを提案し、反実仮想による評価も可能にした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "正解の因果構造が分かっている多変量時系列を、性質を1つずつ変えながら生成できるライブラリDTCDを作り、因果探索と処置効果推定の手法を体系的に評価した（抄録）。", "p3": "グラフの構造・仕組み・雑音・観測の欠け方・介入の方針を独立な部品とし、設定だけで組み合わせて同時刻とラグのある隣接行列つきの時系列を作る。事実の生成時の乱数を保存して介入時に再投入する「対の反実仮想」で、個人の処置効果を数値精度で求める（抄録）。", "p5": "81の設定で8つの因果探索手法、18の設定で4つの処置効果推定量を評価し、標準的な探索手法が欠測値を扱えないこと（欠測の仕組みが情報を持つかに関係なく）や、分散の大きさに頼る近道（varsortability）があり標準化で除けることなど、集計の指標では隠れる失敗を示した（抄録）。", "fun": "原因と結果の関係をデータから見つける手法を試すには、答えの分かっている練習問題が必要です。この研究は、条件を一つずつ変えた練習問題を自在に作れる道具を作りました。すると、データの一部が欠けているだけで多くの手法がつまずくことや、変数のばらつきの大きさだけで答えを当てる「ずる」が起きていることが分かりました。", "unverified": "本文を入手できず、手法ごとの具体的な成績の数値は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "風車の振動から倒壊の予兆と地盤の水分を読む", "title": "Monitoring Wind Turbine Vibrations for Structural and Subsurface Insights", "url": "https://doi.org/10.1029/2026gl124838", "authors": "Sayan Mukherjee ほか", "venue": "Geophysical Research Letters", "date": "2026-11-09", "sjr": 1.949, "citescore": 8.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "4千万台のWindowsで測るデジタル利用格差", "title": "Evidence and measures of the digital usage divide from 40 million Windows devices", "url": "https://doi.org/10.1038/s41467-026-78689-1", "authors": "Mayana Pereira ほか", "venue": "Nature Communications", "date": "2026-11-09", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr03", "rank": 3, "headline": "駅アクセスの住宅価格効果はTOD類型で異なる", "title": "Spatial Heterogeneity in TAZ Metrorail Accessibility Effects on Housing Prices Across TOD Categories: An Extended Node–Place Model", "url": "https://doi.org/10.3390/land15112129", "authors": "Jingming Liu ほか", "venue": "Land", "date": "2026-11-09", "citescore": 6.4, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr04", "rank": 4, "headline": "LLMの運転者ペルソナの忠実さと多様性を検証", "title": "Genera , "sjr": 3.423, "citescore": 19.9, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr14", "rank": 14, "headline": "人とAIの共創では選ぶ仕組みが発想を画一化", "title": "Mesa De Bar: An Open, Configurable Platform for Human–AI Co-Creation, with a Multi-Agent Simulation Study of Creative Homogenization", "url": "https://doi.org/10.1609/aiide.v22i1.43588", "authors": "Murilo Mazzotti Silvestrini ほか", "venue": "Proceedings of the AAAI Conference on Artificial Intelligence and Interactive Digital Entertainment", "date": "2026-11-08", "citescore": 3.5, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr15", "rank": 15, "headline": "在宅ケアと介護者研修で施設入所の意向が減少", "title": "Preventing nursing home admission in dependent older adults: a randomised controlled trial of a multimodal home-based intervention", "url": "https://doi.org/10.1007/s10433-026-00955-4", "authors": "Eduard Minobes-Molina ほか", "venue": "European Journal of Ageing", "date": "2026-11-09", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr16", "rank": 16, "headline": "故障の診断と発生までの時間の予測を注意機構で連結", "title": "A directed cross-task attention Transformer for joint fault diagnosis and prognostics of rail engine compressors", "url": "https://doi.org/10.1177/14759217261504003", "authors": "Rose Marie Charuvil Elizabeth ほか", "venue": "Structural Health Monitoring", "date": "2026-11-09", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "多センサの機械の状態監視で、故障の種類の診断から故障発生までの時間の予測へ情報を流す有向の注意機構をトランスフォーマーに組み込み、診断と予測を一体で行えるようにした（抄録）。", "p3": "学習可能なタスクトークンと注意機構でタスクごとの表現を作り、診断の表現が発生までの時間の予測に情報を与えるようにし、不確実性にもとづく自動重み付けの損失で2つの目的を釣り合わせた。鉄道の機関車の空気圧縮機の空気漏れ14,712件・油漏れ218,846件の多変量センサデータで検証した（抄録）。", "p5": "分類精度95.2%、発生までの時間の誤差は空気漏れで9.3分、油漏れで3.7分だった。内蔵の警報より空気漏れを96分、油漏れを2日以上早く検知し、欠測・雑音・ドリフトにも頑健だった（抄録）。", "fun": "機械の不調は、「何が起きているか」が分かると「いつ壊れるか」も予想しやすくなります。この研究はAIの中で、故障の種類を見分ける部分から、故障までの時間を予測する部分へ情報が一方向に流れるようにしました。その結果、もともと付いていた警報より油漏れを2日以上も早く見つけられたという点が面白いところです。", "unverified": "本文を入手できず、比較した深層学習の手法と、データの期間・故障の件数は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "CNNとGRUを組み合わせたデジタルツイン型SHM", "title": "A Digital Twin Framework With Adaptive Learning for Resilient Structural Health Monitoring", "url": "https://doi.org/10.1002/cpe.71025", "authors": "Vijay Kumar ほか", "venue": "Concurrency and Computation: Practice and Experience", "date": "2026-11-09", "citescore": 5.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "多センサのデータを健全・不健全に分類するCNNと、健全度の推移を予測するGRUを組み合わせた、デジタルツイン型の構造ヘルスモニタリングの枠組みを提案した（抄録）。", "p3": "水分・振動・ひずみ・亀裂の進展の情報を使って構造の挙動を模擬し、CNNで分類、GRUで時系列予測を行う。35,041〜60,215件の4つのデータセット（D1〜D4）で評価した（抄録）。", "p5": "CNNの分類は平均の正解率93.54%、感度90.88%、特異度95.26%、F1値92.12%で、GRUの予測は平均正解率97.78%以上、MAE 0.0049、RMSE 0.11、相関係数0.994だった（抄録）。", "fun": "橋や建物の「分身（デジタルツイン）」をコンピュータの中に作り、センサの情報から今の健康状態と今後の変化を見張る試みです。この研究は、画像認識が得意なAIで今の状態を判定し、時間の流れが得意なAIで先を読むという役割分担をしました。分身に「診断」と「予報」の両方をさせる発想が面白いところです。", "unverified": "本文を入手できず、4つのデータセットの出所（実測か模擬か）と比較対象の手法は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "柔軟な光電センサで橋のたわみを非接触計測", "title": "An ultrafast response non-contact method based on flexible photovoltaic sensor for high-precision bridge deflection monitoring under low-frequency vibrations", "url": "https://doi.org/10.1007/s11431-026-3377-4", "authors": "Kangxu Huang ほか", "venue": "Science China Technological Sciences", "date": "2026-11-09", "citescore": 8.9, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、柔軟な太陽電池（光電）センサを使い、低周波の振動の下で橋のたわみを非接触で、応答が非常に速く高い精度で監視する方法を示した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「橋のたわみを、触れずに、速く、正確に測れるか」です。橋は車が通るとわずかにしなりますが、その量を橋に器具を取り付けずに測るのは簡単ではありません。光を電気に変える薄く曲がるセンサをどう使えば、ゆっくり揺れる橋の動きを捉えられるのか、という発想が面白いところです。", "unverified": "抄録・本文を入手できず、測定の原理、精度の数値、実橋での検証の有無はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "説明可能AIでAE監視のセンサ網を最適化", "title": "Explainable artificial intelligence-enabled sensor network optimization for lifecycle-oriented acoustic emission monitoring of concrete infrastructure", "url": "https://doi.org/10.1016/j.engappai.2026.116718", "authors": "Minzhe Wu ほか", "venue": "Engineering Applications of Artificial Intelligence", "date": "2026-11-09", "sjr": 1.782, "citescore": 11.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、コンクリートのインフラのアコースティックエミッション（AE）監視で、ライフサイクル全体を見据えたセンサ網の配置を説明可能なAIで最適化する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「ひび割れの小さな音を聞き取るセンサを、どこに何個置けばよいか」です。コンクリートの中で亀裂が進むと、かすかな音（弾性波）が出ます。限られた数のセンサで長い年月にわたって見張るには配置の工夫が要り、その判断の理由をAIに説明させようとする点が面白いところです。", "unverified": "抄録・本文を入手できず、最適化の方法、対象の構造物、成果の数値はすべて未確認。"}}, {"id": "jr20", "rank": 20, "headline": "スマートフォンの走行記録で運転行動を分類", "title": "Explainable machine learning for trip-level driving behaviour profiling from smartphone telematics in road freight operations", "url": "https://doi.org/10.1016/j.trip.2026.102344", "authors": "Pedro Entringer ほか", "venue": "Transportation Research Interdisciplinary Perspectives", "date": "2026-11-09", "sjr": 1.039, "citescore": 6.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、道路の貨物輸送で、スマートフォンのテレマティクス（走行記録）から走行ごとの運転行動を説明可能な機械学習で特徴づける研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「トラックの運転手が持つスマートフォンだけで、運転の癖が分かるか」です。スマートフォンには加速度や位置を測るセンサが入っており、急ブレーキや急ハンドルの記録が残ります。特別な機器なしに走行ごとの運転の特徴を読み取り、その判断の理由まで示そうとする点が面白いところです。", "unverified": "抄録・本文を入手できず、使用したセンサの種類、データの規模、分類の精度はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "合成作用を失った鉄道橋の桁はたわみが3.6倍", "title": "Experimental investigation of the stress-strain state of steel-reinforced concrete span structures of a railway bridge under different conditions of composite action between structural elements", "url": "https://doi.org/10.15802/bttrp2026-30-09", "authors": "S. O. Melnychuk ほか", "venue": "Bridges and tunnels: theory, research, practice", "date": "2026-11-09", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "鉄道橋の鋼・鉄筋コンクリートの合成桁で、床版と主桁の合成作用が損なわれた径間と健全な径間の応力とたわみを、貨物・旅客列車の通過時に実測して比べた（抄録）。", "p3": "欠陥のない径間と、合成作用を損なう欠陥のある径間で、Spider-8のデータ収録装置を使い、VL11形電気機関車が牽引する貨物列車と旅客列車の通過時の繊維応力とたわみを測った（抄録）。", "p5": "損傷径間の道床の床版には引張応力（6.55 kg/cm²）、健全径間には圧縮応力（−26.75 kg/cm²）が生じ、床版が主桁との合成作用から完全に外れていた。貨物列車の通過時の最大たわみは損傷径間で17.48 mm、健全径間の4.85 mmの3.6倍で、旅客列車では15.91 mm対4.25 mmだった（抄録）。", "fun": "鉄の桁とコンクリートの床がしっかりくっついて一体で働くと、橋は強くなります。この調査では、そのつながりが壊れた部分の橋は、同じ列車が通っても健全な部分の3.6倍もしなっていました。目に見えない「くっつき具合」が、列車が通るときの測定ではっきり数字に表れる点が面白いところです。", "unverified": "本文を入手できず、測定点の配置、列車の速度、測定の回数は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "監査の質とガバナンスの研究を計量書誌で整理", "title": "Audit Quality and Corporate Governance: Emerging Links With Sustainability and Accountability", "url": "https://doi.org/10.1002/csr.71168", "authors": "Simone Sessa ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-08", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "コーポレートガバナンスと監査の質の関係の研究を、計量書誌分析と影響力の大きい研究の内容分析で整理した（抄録）。", "p3": "Web of Scienceの784本（2000〜2024年）の出版・引用・ネットワークの傾向をHistCite・VOSviewer・Bibliometrixで分析し、年あたりの局所引用で選んだ21本を、監査の質の基礎・ガバナンスの需要・資金調達への帰結・報告行動の4つのテーマで比べた（抄録）。", "p5": "監査人の特性・監査報酬・報告の代理変数は監査の質の異なる側面を捉えており、所有構造・法執行・非公式な関係がその解釈を左右することを示し、サステナビリティ報告と保証のガバナンスへの含意と研究課題を示した（抄録）。", "fun": "「監査がしっかりしているか」は直接見えないので、研究者は監査報酬や監査法人の規模などで間接的に測ってきました。この研究は800本近い論文を整理し、そうした物差しはそれぞれ監査の質の別の面を見ていると指摘しました。同じ言葉でも測っているものが違うという点が面白いところです。", "unverified": "本文を入手できず、21本の選定の詳細と、示された研究課題の具体的な内容は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "ESGの不祥事と短期の収益性の関係（インド）", "title": "ESG Controversies and Short‐Term Profitability: The Role of Current ESG Performance and Lagged Reputation in Emerging Markets", "url": "https://doi.org/10.1002/csr.71156", "authors": "Sraddha Srivastav ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-08", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "インドの非金融上場企業で、ESGの不祥事への関与が短期のROEと正に関連し、その関連は現在のESGスコアが高い企業ほど弱まることを示した（抄録）。", "p3": "NIFTY 500の2024〜25年度の382社・年の観測で、ステークホルダー理論・正統性理論・経営者の機会主義の仮説にもとづき、HayesのPROCESSマクロの調整モデルで分析し、PLS-SEMで頑健性を確かめた（抄録）。", "p5": "不祥事への関与はROEと正に関連し、開示義務が形成途上の環境での一時的な費用の外部化と整合した。現在のESGスコアはこの関連を有意に弱め、正の関連はESGの低い企業に集中した。1年・2年前のESGスコアに追加の調整効果はなく、単年度のため時間的な変化は示せない（抄録）。", "fun": "環境や社会の問題で不祥事を起こした会社が、短期的にはむしろ利益率が高いという結果が出ました。費用を社会に押しつけて目先の利益を上げている可能性があり、それはESGの評価が低い会社に集中していました。「悪いことをしても短期では得をする」ように見える現実を、評価の高低で切り分けた点が面白いところです。", "unverified": "本文を入手できず、不祥事の測り方（データ源）と効果の大きさの数値は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "財務困窮が継続企業の監査意見を招く", "title": "Pengaruh Financial Distress dan Audit Tenure terhadap Opini Audit Going Concern dengan Moderasi Kualitas Auditor", "url": "https://doi.org/10.59059/jupiekes.v4i4.3556", "authors": "Latersia Br Gurusinga ほか", "venue": "Jurnal Penelitian Ilmu Ekonomi dan Keuangan Syariah", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアのエネルギー企業で、財務困窮が継続企業の前提に関する監査意見（ゴーイング・コンサーン意見）の確率を高めることを示した（抄録）。", "p3": "インドネシア証券取引所に上場するエネルギー企業の2021〜2025年の年次報告書と監査報告書を目的抽出し、監査人の質を調整変数として、財務困窮と監査契約の期間が継続企業の意見に与える影響をロジスティック回帰で分析した（抄録）。", "p5": "財務困窮は継続企業の意見に有意に影響したが、監査契約の期間と監査人の質は有意でなかった。監査人の質は財務困窮の効果を負に調整したが、監査契約の期間の効果は調整しなかった（抄録）。", "fun": "会社が来年も続けられるか危ういとき、監査人は決算書に「注意書き」をつけます。この研究では、経営が苦しい会社ほどこの注意書きがつきやすく、一方で監査人との付き合いの長さは関係ありませんでした。経営の苦しさが監査人の判断にどう表れるかを、実際の記録で確かめた点が面白いところです。", "unverified": "本文を入手できず、標本の企業数と財務困窮の測り方（どの指標か）は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "銀行の満足度と乗り換え意向を公表統計から検討", "title": "Brand Image, Customer Satisfaction, and Switching Intention: An Empirical Study of Uzbek Commercial Banks", "url": "https://doi.org/10.31150/kjf7be18", "authors": "Mirzajonova Maftunaxon Jaxongir qizi", "venue": "American Journal of Economics and Business Management", "date": "2026-11-07", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ウズベキスタンの銀行利用者について、公表された調査の要約と中央銀行の統計から、満足と乗り換え意向について言えることと言えないことを整理し、主銀行の乗り換えと副次的な利用を区別する調査設計を示した（抄録）。", "p3": "経済研究改革センターの1,100人超の銀行利用者の調査の要約と、2024年1月〜2025年7月の中央銀行の月次統計を使い、公表された周辺の割合から満足と乗り換えについて推論できる範囲を示した（抄録）。", "p5": "肯定的な評価は外国為替の66%から決済の81%まで分かれ、預金関連では満足約90%、銀行を変える意向1%と報告されていた。個人のリモートバンキングの件数は4,224万から6,755万へ59.9%増えた。指標は母集団が異なり個票がないため、個人レベルの関係は推定できていない（抄録）。", "fun": "「満足している人は乗り換えない」というのは当たり前に思えますが、この論文は公表された集計の数字だけではそれを確かめられないと正直に示しました。そのうえで、メインの銀行を替えることと、別の銀行を「ついでに使う」ことを分けて聞く調査の設計を提案しています。乗り換えの中身を分けて考える点が面白いところです。", "unverified": "本文を入手できず、提案した調査設計の具体的な質問項目は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "記憶に残る観光体験が幸福感と愛着を経て忠誠に", "title": "From memorable tourism experiences to destination loyalty: The role of tourists’ well-being and place attachment in Dong Thap Muoi, Vietnam", "url": "https://doi.org/10.31893/multiscience.2027269", "authors": "Thanh Sang Le ほか", "venue": "Multidisciplinary Science Journal", "date": "2026-11-08", "citescore": 1.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ベトナムの湿地の観光地で、記憶に残る観光体験が快楽的・持続的な幸福感と場所への愛着を通じて、再訪・推奨・好意的な口コミからなる観光地への忠誠につながることを示した（抄録）。", "p3": "ドンタップムオイを訪れたことのある観光客586人のデータをPLS-SEMで分析し、記憶に残る体験→2種類の幸福感と場所への愛着→観光地への忠誠（高次の構成概念）という構造モデルを検証した（抄録）。", "p5": "記憶に残る体験は両方の幸福感を高め、場所への愛着を直接強めた。学びや自己成長に関わる持続的な幸福感は快楽的な幸福感より愛着への効果が強く、場所への愛着が忠誠の最も強い直接の予測因子だった（抄録）。", "fun": "旅行先にまた行きたくなるのは、楽しかったからだけではないようです。この研究では、その場所で何かを学んだり、自分が成長したと感じたりした経験の方が、その土地への愛着を強く育てていました。「楽しさ」より「意味」が人を土地に結びつけるという点が面白いところです。", "unverified": "本文を入手できず、経路係数の具体的な数値と、調査の方法（回答者の集め方）は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "技術受容と電子口コミが産直の購入意図を高める", "title": "Technology acceptance and electronic word-of-mouth adoption in digital alternative food network", "url": "https://doi.org/10.3389/fsufs.2026.1962174", "authors": "Agriani Hermita Sadeli ほか", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-11-08", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "生産者と消費者をつなぐデジタルの産直（代替食料ネットワーク）で、技術受容と電子口コミの採用が生鮮農産物の購入意図をともに高めることを示した（抄録）。", "p3": "インドネシア・バンドンの、ふだん従来の経路で生鮮品を買い、デジタルの産直の情報に触れたことのある消費者のデータを、電子口コミの採用を加えた拡張技術受容モデルでPLS-SEMにより分析した（抄録）。", "p5": "使いやすさの認知が購入意図に最も強く直接効き、有用性の認知と電子口コミの採用が続いた。電子口コミの採用は使いやすさ・有用性の認知と正に関連し、それらを通じた購入意図への間接効果も有意だった（抄録）。", "fun": "農家から直接野菜を買えるアプリがあっても、使いにくければ人は離れてしまいます。この研究では、買いやすさが最も効き、次に役立つかどうか、そして他の人の口コミを参考にするかどうかが効いていました。口コミが「使いやすそう」「役に立ちそう」という印象そのものを高めていた点が面白いところです。", "unverified": "本文を入手できず、標本の人数と経路係数の数値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "包摂的な小売は顧客関係を強めるか", "title": "Do inclusive retailers build stronger customer relationships? Evidence from a multi-wave repeated cross-sectional study", "url": "https://doi.org/10.1016/j.jretconser.2026.105203", "authors": "Generoso Branca ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-11-09", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、包摂的な（多様な顧客を受け入れる）小売の取組みが顧客との関係を強めるかを、複数時点の反復横断調査で調べた研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「誰でも受け入れるお店は、お客さんとの絆も強くなるのか」です。障害のある人や高齢者、さまざまな背景の人に配慮した店づくりは、社会的に正しいだけでなく、商売としても報われるのか。何回かに分けて調べることで、時間の流れの中で関係を確かめようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、包摂の測り方、調査の対象・規模、結果はすべて未確認。"}}, {"id": "jr29", "rank": 29, "headline": "退職で仕事の縁は減り家族・地域の縁が増える", "title": "Retirement’s role in social connections and connectedness: a systematic review", "url": "https://doi.org/10.1007/s10433-026-00956-3", "authors": "Kristina Thompson ほか", "venue": "European Journal of Ageing", "date": "2026-11-09", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "退職が社会的なつながり（関係の量）とつながりの感覚（関係の質）に与える影響を系統的レビューで整理し、一律の良い・悪い影響はなく、測り方と退職者の特性で結果が変わることを示した（抄録）。", "p3": "2024年3月にWeb of Science・Scopus・PubMedを系統的に検索し、17研究を含めてデータを抽出・物語的に分析し、混合研究法の評価ツールで質を評価した（抄録）。", "p5": "17研究の多く（13）で効果は結果指標や下位集団で異なった。つながりの研究では仕事上の周辺的な縁が減り家族や地域の縁に置き換わることが多く、つながりの感覚では社会経済的に不利な層と男性で弱い傾向があった。縁が減っても支えの実感が増す補償的な効果もみられた（抄録）。", "fun": "定年で会社を辞めると、人とのつながりは減るのでしょうか。17の研究をまとめると、仕事の知り合いは減っても家族や地域の縁がそれを埋めることが多く、一律に「孤独になる」わけではありませんでした。ただし男性や経済的に苦しい人ではつながりの実感が弱くなりがちで、誰にとっての退職かで姿が変わる点が面白いところです。", "unverified": "本文を入手できず、含めた研究の国・デザインの内訳と、質の評価の結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "認知症の介護者が相手と息を合わせる過程の理論", "title": "The Theory of Rhythmic Synergy in Caregiving for Older Adults Living With Dementia", "url": "https://doi.org/10.1111/pere.70095", "authors": "Chloe E. Gonzales ほか", "venue": "Personal Relationships", "date": "2026-11-09", "sjr": 0.898, "citescore": 3.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "認知症の人を介護する家族が、相手とのやり取りのリズムを合わせながら「暗黙のうちに分かり合える」状態を育てていく過程を、「リズムの相乗」の理論として示した（抄録）。", "p3": "認知症の人を介護する成人の家族31人への詳細な半構造化面接から理論を構築した（抄録）。", "p5": "リズムの相乗は、介護者が相手への応答を繰り返し、言語・非言語の振る舞い（リズム）を調整し、一緒にいる感覚（関係の相乗）を感じる中で時間をかけて育つ、関係的に同調した高次の状態と定義された。介護のネットワークの他の人がこの過程を助けも妨げもすること、症状の進行や負担の増加など時間の要素が重要なことを示した（抄録）。", "fun": "認知症が進むと、言葉でのやり取りは難しくなっていきます。それでも介護する家族は、相手の表情やしぐさのリズムに合わせることで「言わなくても分かる」関係を少しずつ育てていました。音楽の合奏のように息を合わせることが、介護の支えになるという見方が面白いところです。", "unverified": "本文を入手できず、理論の構成要素の詳細と、面接の対象者の属性は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "韓国系米国人家族の世代間の医療意思決定", "title": "Negotiating Care Across Generations: Healthcare Decision‐Making in Aging Korean American Families", "url": "https://doi.org/10.1111/josi.70092", "authors": "EunJeong Lee ほか", "venue": "Journal of Social Issues", "date": "2026-11-09", "sjr": 1.309, "citescore": 9.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "韓国系米国人の成人した子どもが、高齢の家族の医療上の意思決定にどう関わるかを面接で調べ、家族中心の意思決定を柔軟で関係的な過程として描いた（抄録）。", "p3": "高齢の家族を医療の場で支えた経験のある韓国系米国人12人に、慢性疾患を持つ高齢の移民を含む地域参加型の研究チームと作った半構造化面接を行い、ビネットへの反応も含めて主題分析した（抄録）。", "p5": "家族が意思決定の主な文脈であること、状況に応じた家族の参加、交渉される権限、文化と世代による違い、参加の条件としてのコミュニケーションの5つの主題を見いだした。家族の関与は一律に集団主義的・義務的ではなく、病状・関係・世代・制度で変わり、力関係が参加を妨げると医療者の権威に従うことも多かった（抄録）。", "fun": "移民の家庭では、英語が得意な子どもが親の病院での通訳や判断の手伝いを担うことがよくあります。この研究によると、それは「家族だから当然」という義務ではなく、病気の重さや親子の関係に応じて形を変える柔軟な助け合いでした。医療の判断を「患者と医師」だけで考えない視点が面白いところです。", "unverified": "本文を入手できず、参加者の属性の詳細と、各主題を支える具体的な語りは未確認。参加者は12人と少ない。"}}, {"id": "jr32", "rank": 32, "headline": "地域に根ざした児童虐待予防の取組みを総覧", "title": "Community-Based Child Maltreatment Prevention: A Scoping Review", "url": "https://doi.org/10.1177/15248380261497727", "authors": "Fengshuo Chen ほか", "venue": "Trauma, Violence, and Abuse", "date": "2026-11-09", "sjr": 2.896, "citescore": 16.7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "地域に根ざした児童虐待の予防の取組みを総覧し、公衆衛生のモデルとよく合う一方で、設計・実施・評価に課題が残ることを示した（抄録）。", "p3": "6つのデータベースを創刊時から2025年9月まで検索し、87研究に記述された62のプログラムを量的内容分析で整理した（抄録）。", "p5": "多くのプログラムは地域の住民全体とリスクのある家族の両方を対象にし、個人・家族・近隣の水準でサービスを提供し、多部門の専門職・ボランティア・草の根の団体が関わっていた。評価は無作為化比較試験が11%、準実験が27%、正式な評価なしが16%で、虐待そのものを直接評価したのは3分の1だった（抄録）。", "fun": "子どもへの虐待を防ぐのは、家族だけでも専門家だけでも難しく、地域全体の力が必要です。この研究は世界の62の地域の取組みを調べ、近所の人やボランティアまで巻き込む工夫が多い一方で、本当に虐待が減ったかを確かめたものは3分の1しかないことを示しました。「みんなで見守る」効果をどう測るかという課題が面白いところです。", "unverified": "本文を入手できず、プログラムの国・地域の内訳と、効果があったプログラムの特徴は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "生成AIで作文のストレスは減るが新しさも減る", "title": "Reducing stress, but limiting novelty and diversity: exploring generative AI’s roles in writing", "url": "https://doi.org/10.1007/s11145-026-10930-1", "authors": "Fangzhou Jin ほか", "venue": "Reading and Writing", "date": "2026-11-09", "sjr": 1.206, "citescore": 5.6, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "中学2年の授業で生成AIを使って説明文を書かせると、構成などは良くなりストレスも減る一方、文の複雑さと新しさの伸びが小さくなることを示した（抄録）。", "p3": "5週間の準実験で、生成AIを支援に使う学級（36人）と検索エンジンを使う学級（37人）の作文を介入の前後で比べ、書いている間の心拍変動（HRV）でストレスを測り、刺激再生面接と探索的なPLS-SEMも行った（抄録）。", "p5": "生成AIの学級は焦点・構成・内容・言語で優れたが、文が単純になり新規性の伸びも小さかった。心拍変動からは両群でストレスの揺れがあったが、生成AIの学級では全体としてストレスが減り、面接からは課題の難しさの調整、即時の説明つきのフィードバックなど4つの経路が示唆された（抄録）。", "fun": "AIの助けを借りて作文を書くと、上手にまとまり、気持ちも楽になりました。でも文は単純になり、新しい発想の伸びは小さくなりました。心臓の鼓動のゆらぎでストレスを測るという工夫も面白く、「楽になること」と「伸びること」は必ずしも一致しないという点が考えさせられるところです。", "unverified": "本文を入手できず、作文の評価方法と効果の大きさの数値は未確認。2学級の比較で、無作為化ではない。"}}, {"id": "jr34", "rank": 34, "headline": "LLMの診断の確信は証拠の順序で変わり一貫しない", "title": "Probabilistic Coherence of Stated Diagnostic Beliefs in Large Language Models: Anchored Tests on a Synthetic Clinical Corpus", "url": "https://doi.org/10.3390/make8110369", "authors": "Govind Arun ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-11-09", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "LLMが述べる診断の確率が、ベイズ的な信念更新の公理（証拠の順序に依存しないなど）を満たすかを正解ラベルなしで検定し、満たさないことを示した（抄録）。", "p3": "合成の臨床コーパスDDXPlusの1,956人・49疾患について、4B〜32Bの公開重みの11の構成から112万件の応答を得て、順序不変性・更新の忠実さ・冗長な情報への不感性・位置への固定の4つの公理を、各モデルの再検査の下限と患者間の上限に照らして検定した（抄録）。", "p5": "Qwen3の系列では順序の入替えによる乖離が規模とともに0.128から0.291に増えたが、下限から上限の幅に対する比は0.215から0.127に減った。信念の更新は証拠の向きと一致せず（方向の一致率0.454〜0.549）、どのモデルも自ら述べた事後確率の首位より1.8〜5.6倍多く正しい診断名を挙げており、欠陥は臨床知識ではなく確率の表し方にあると結論した（抄録）。", "fun": "名探偵なら、手がかりを見つけた順番が違っても同じ犯人にたどり着くはずです。ところがこの研究では、AIの診断の確信度は、症状を聞く順番を入れ替えるだけで変わってしまいました。しかもAIは正しい病名を知っているのに、自分の付けた確率ではそれを一番にしないことが多かったという、知識と確率表現のずれが面白いところです。", "unverified": "本文を入手できず、モデルごとの詳細な結果と、4つの公理の具体的な検定方法は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "LLM判定者の関係的な較正はいつ効くか", "title": "When does relational calibration help an LLM-as-a-judge? A human-grounded, strict-inductive study of value calibration and selection", "url": "https://doi.org/10.1016/j.ins.2026.124403", "authors": "Yunan Zhang ほか", "venue": "Information Sciences", "date": "2026-11-09", "sjr": 1.507, "citescore": 14.6, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、LLMを判定者とする評価で、価値観の関係的な較正と選択がどのようなときに役立つかを、人の判断にもとづく厳密に帰納的な設計で検証した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「AIに採点をさせるとき、人の価値観に合わせる調整はいつ効くのか」です。AIの判定者は便利ですが、何を良いとするかの基準が人とずれることがあります。そのずれを人の判断を手本に直す工夫が、どんな条件なら本当に役立つのかを確かめようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、較正の方法、評価の対象、結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "浸水解析とLLMエージェントで救援の行動案を作成", "title": "From inundation rasters to draft action briefs: integrating spatial computing and LLM agents for urban waterlogging emergency decision support", "url": "https://doi.org/10.1080/17538947.2026.2749231", "authors": "Shuai Hong ほか", "venue": "International Journal of Digital Earth", "date": "2026-11-08", "citescore": 7.4, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "都市の内水氾濫の緊急対応で、衛星観測にもとづく浸水の空間計算とLLMの多エージェントを組み合わせ、人が確認する避難・資源配分の行動案の下書きを作る枠組みMAEDF-UWを示した（抄録）。", "p3": "2021年7月20日の鄭州の豪雨を例に、5 mのGF-3の浸水範囲と12.5 mのALOS PALSARの標高モデルから局所的な静水圧の仮定で水深を推定し、運用上の水深の閾値で道路網の通行不能区間と救援の孤立地を特定した。その空間的な事実を構造化して地域の緊急時計画の規則とともに検索拡張型のエージェントに渡し、形式と規則を点検したJSONの行動案を作らせた（抄録）。", "p5": "事例分析で、事象に固有の空間的な証拠と地域の対応規則が避難と資源配分の指示の下書きにどう反映されるかを示した。評価は指示の一貫性・空間入力の正確さ・処理の遅延を別の次元として扱い、全体の性能と運用上の有効性には独立した検証がまだ必要だとした（抄録）。", "fun": "大雨で街が水につかったとき、どの道が通れず、どこに人が取り残されるかを素早く知る必要があります。この研究は、衛星写真と地形から水の深さを計算し、その「事実」と自治体の決まりごとをAIに渡して、救助の指示の下書きを作らせました。計算は機械、判断の言葉はAI、最終確認は人という分担が面白いところです。", "unverified": "本文を入手できず、生成した行動案の正確さの評価の数値は未確認。著者自身が独立した検証は未了としている。"}}, {"id": "jr37", "rank": 37, "headline": "スマートシティと低炭素都市の重複指定で包摂的成長", "title": "Impact of Digital-Green Policy Combination on Urban Inclusive Green Growth: Evidence from China’s Dual Pilot Policies of Smart City and Low-Carbon City", "url": "https://doi.org/10.3390/land15112128", "authors": "Huixuan Zhang ほか", "venue": "Land", "date": "2026-11-09", "citescore": 6.4, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国でスマートシティと低炭素都市の2つの試行政策が重なった都市では、包摂的なグリーン成長が高まることを、262都市の多期間の差の差分析で示した（抄録）。", "p3": "2011〜2023年の262都市のデータで、2つの試行政策が両方とも有効かどうかで政策の組合せを定義し、多期間の差の差モデルで効果を推定し、炭素排出強度の媒介、デジタル知識の流れとグリーン金融の調整、政策の順序と間隔、空間的な波及を調べた（抄録）。", "p5": "政策の組合せの係数は0.1395（p<0.01）で、両方の試行の段階の係数0.2192は、スマートシティのみ・低炭素都市のみの段階をそれぞれ0.1660（p<0.01）、0.0984（p<0.05）上回った。組合せは炭素排出強度を下げ（−0.2040、p<0.05）、それが媒介した。政策の順序による差は有意でなく、周辺都市への正の波及もみられた（抄録）。", "fun": "デジタル化の政策と脱炭素の政策は、別々に行うより組み合わせた方が効果が大きいのでしょうか。中国の262都市を調べると、両方の指定を受けた都市では、環境にやさしく、かつ多くの人に恩恵が届く成長がより進んでいました。どちらを先にしても効果は同じだったという点も面白いところです。", "unverified": "本文を入手できず、包摂的なグリーン成長の指標の作り方と、平行トレンドの確認の結果は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "既存の路線網を少し直して公共交通の接続を改善", "title": "Breaking Is Easier than Building: Improving Public Transport Routes to Enhance Travel-Time Connectivity Using a Neural Evolutionary Approach", "url": "https://doi.org/10.3390/smartcities9110191", "authors": "Aleksandr Morozov ほか", "venue": "Smart Cities", "date": "2026-11-09", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "グラフニューラルネットと進化計算を組み合わせた手法を、ゼロから路線網を作るのではなく、既存の公共交通の路線網を変更を抑えながら改善するように学習させた（抄録）。", "p3": "路線の調整の程度に緩い制約をかけ、学習した路線編集のヒューリスティックで改善を探索した。MandlとMumfordのベンチマークと、ロシア・エカテリンブルクの事例で評価した（抄録）。", "p5": "ベンチマークでは学習した路線編集の方法が元のニューラル手法より乗客側の平均費用を下げた。事例では初期の路線網に比べ、加重した中央値の接続時間を69.6%、路線の総走行時間を26.3%同時に減らした。ただしこの改善は、既存の路線が通らない地点を含む停留所の候補の拡大が前提だった（抄録）。", "fun": "バスの路線を一から作り直せば理想的な網ができるかもしれませんが、現実には住民が慣れた路線を大きく変えるのは難しいものです。この研究はAIに「今ある路線を少しずつ直す」ことを学ばせ、移動時間を大きく縮めました。題名の「壊す方が作るより易しい」という発想の転換が面白いところです。", "unverified": "本文を入手できず、停留所の候補の拡大を除いた場合の改善の大きさは未確認。"}}, {"id": "jr39", "rank": 39, "headline": "エジプトの新LRT沿線のTODの可能性を駅別に評価", "title": "Assessing transit-oriented development potential in Egypt’s emerging LRT corridor: a node–place assessment within a 3Vs- and SDG-aligned framework", "url": "https://doi.org/10.1186/s44147-026-01315-w", "authors": "Tamer ElSerafi ほか", "venue": "Journal of Engineering and Applied Science", "date": "2026-11-09", "citescore": 5.2, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "エジプトの新しいLRT沿線について、駅ごとのTOD（公共交通指向型開発）の可能性をノード・プレイスの指標で評価する、SDGと整合した枠組みを示した（抄録）。", "p3": "エル・サラーム、新行政首都、10月のラマダン市を結ぶ沿線の駅を、交通網の情報・乗客数・土地利用・街路網・GISによる空間分析で評価した。市場価値は駅周辺が開発途上で安定したデータがないため、枠組みに残しつつ定量評価しなかった（抄録）。", "p5": "駅の間に大きな差があり、アドリー・マンスール駅が交通の接続性と地域のアクセスの組合せで最も強く、新しい市街地の駅はノードとプレイスが中程度で段階的な介入が必要だった。指標が完全な4駅の順位は正規化と重み付けを変えても変わらなかった（抄録）。", "fun": "駅の周りに住宅やお店を集める「駅を中心にした街づくり」は、どの駅でも同じようにはうまくいきません。この研究は、交通の結節点としての強さと、街としての魅力の2つの物差しで駅を比べました。まだ街ができていない新しい駅の評価をどうするかという、成長途中の都市ならではの悩みが面白いところです。", "unverified": "本文を入手できず、評価した駅の数と指標の重み付けの詳細は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "インドと南アのスマートシティのデジタル包摂", "title": "Evaluating Digital Inclusion in Smart Cities: Comparative Insights from India and South Africa", "url": "https://doi.org/10.1080/10630732.2026.2742804", "authors": "Sarbeswar Praharaj ほか", "venue": "Journal of Urban Technology", "date": "2026-11-09", "sjr": 1.065, "citescore": 8.4, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、インドと南アフリカのスマートシティで、デジタル技術の恩恵が誰に届いているか（デジタル包摂）を比較評価した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「スマートシティの便利さは、誰にでも届いているのか」です。街がデジタル化しても、スマートフォンを持たない人や使い方が分からない人は取り残されるかもしれません。格差の大きい2つの国の都市を比べることで、包摂の条件の違いを探ろうとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、対象の都市、評価の方法、結果はすべて未確認。"}}, {"id": "jr41", "rank": 41, "headline": "組織のAI採用を説明可能な機械学習で予測", "title": "Explainable Machine Learning for Predicting Organizational AI Adoption: Strategic Alignment, Organizational AI Readiness, and Technology-Organization-Environment Factors", "url": "https://doi.org/10.63329/av3nz12337", "authors": "Noor ul Amin ほか", "venue": "Scientific Societal & Behavioral Research Journal", "date": "2026-11-09", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "スロバキアの359の民間組織の調査データで、組織のAI採用を説明可能な機械学習で予測し、どの要因が予測に効いているかを示した（抄録）。", "p3": "組織のAI成熟度・景況感・技術-組織-環境（TOE）の要因を説明変数とし、ロジスティック回帰・ランダムフォレスト・XGBoostを、80対20の層化分割、5分割交差検証、3つの乱数シード、5,000回のブートストラップで評価し、SHAP値と並べ替え重要度で寄与を調べた（抄録）。", "p5": "採用は199、非採用は160で、平均ROC-AUCはロジスティック回帰0.823、ランダムフォレスト0.840、XGBoost 0.851だった。TOEの組織・技術・環境の要因が平均絶対SHAPの約71.97%を占め、戦略との整合、測定できるAIの便益の認識、プライバシーの成熟度、組織の資源などが影響の大きい予測因子だった（抄録）。", "fun": "会社がAIを取り入れるかどうかは、技術の良し悪しだけでは決まりません。この研究は、359の組織のデータから、経営戦略との合い具合や、効果を測れると感じているかどうかが大きく効いていることをAIで示しました。ただし著者は「予測に効く」ことと「原因である」ことを分けて慎重に述べている点も大事なところです。", "unverified": "本文を入手できず、調査の実施主体と各変数の質問項目は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "従業員のAI導入の評価は論理が違っても意図は似る", "title": "Different Logics, Similar Intentions: Heterogeneity in How Employees Evaluate AI Adoption", "url": "https://doi.org/10.1080/10447318.2026.2758475", "authors": "Leonidas A. Zampetakis", "venue": "International Journal of Human–Computer Interaction", "date": "2026-11-09", "citescore": 10.1, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、従業員がAIの導入を評価するときの考え方（論理）には異質性があるが、導入への意図は似ていることを示した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「AIの導入に賛成する人たちは、同じ理由で賛成しているのか」です。仕事が楽になるから、会社に求められるから、時代の流れだからなど、理由は人それぞれでも、最終的な気持ちは似ているのかもしれません。理由の違いを見分けることが職場の話し合いにどう役立つのかが面白いところです。", "unverified": "抄録・本文を入手できず、調査の方法、対象、類型の内容はすべて未確認。"}}, {"id": "jr43", "rank": 43, "headline": "AIは従業員ではない：職場の心的モデルの研究", "title": "AI Is Not an Employee: Workplace Mental Models and the Context Discovery Gap in Human-AI Interaction", "url": "https://doi.org/10.1080/10447318.2026.2757414", "authors": "Jing-Rung Huang ほか", "venue": "International Journal of Human–Computer Interaction", "date": "2026-11-09", "citescore": 10.1, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、職場で人がAIをどのような存在として理解しているか（心的モデル）と、AIが必要な文脈を見いだせないという人とAIのやり取りの隔たりを扱った研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「AIを同僚のように扱うと、何がうまくいかないのか」です。人の同僚なら職場の事情を自然に察してくれますが、AIは教えられていない文脈を知りません。人がAIに抱く「同僚のイメージ」と、AIが実際に知っていることのずれに注目している点が面白いところです。", "unverified": "抄録・本文を入手できず、研究の方法と結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "仕事のストレスは人よりAIに話したい", "title": "I’d Rather Talk to AI About Work Stress: Extending the O-S-R-O-R Model Through Human-AI Communication in Workplace Health Contexts", "url": "https://doi.org/10.1080/10410236.2026.2760914", "authors": "Dongya Wang ほか", "venue": "Health Communication", "date": "2026-11-09", "sjr": 1.208, "citescore": 7.5, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、職場の健康の文脈で、仕事のストレスを人よりAIに話したいという傾向を、人とAIのコミュニケーションを組み込んだO-S-R-O-Rモデルの拡張で扱った研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「仕事の悩みを、なぜ人ではなくAIに話したくなるのか」です。同僚や上司に話すと評価や人間関係が気になりますが、AIなら気兼ねなく話せるのかもしれません。心の健康の相談相手としてAIが選ばれる理由を、情報の受け止め方のモデルで説明しようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、調査の方法、対象、結果はすべて未確認。"}}, {"id": "jr45", "rank": 45, "headline": "ギグワーカーのアルゴリズム不安は技術ストレスに直結", "title": "ALGORITHMIC PRESSURE AMONG INDONESIAN GIG WORKERS IN THE CREATIVE INDUSTRY: THE EFFECT OF ALGORITHMIC ANXIETY ON SUBJECTIVE WELL-BEING THROUGH TECHNOSTRESS ON INSTAGRAM AND X", "url": "https://doi.org/10.70248/jmie.v4i1.4621", "authors": "Meyva Emiliana ほか", "venue": "Journal of Management and Innovation Entrepreneurship (JMIE)", "date": "2026-11-08", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "SNSのアルゴリズムに仕事と収入を左右されるインドネシアの受注型アーティストで、アルゴリズムへの不安がテクノストレスを強く高めるが、主観的幸福感への影響は確認できないことを示した（抄録）。", "p3": "ストレスと対処の交流モデルにもとづき、InstagramとX（Twitter）で仕事を受けるアーティスト108人を目的抽出し、テクノストレスを媒介とするモデルをPLS-SEMで分析した（抄録）。", "p5": "アルゴリズム不安はテクノストレスに強い正の効果を持った（β=0.648、p<0.001）。一方、不安とテクノストレスの主観的幸福感への効果は直接・間接とも有意でなく（テクノストレス β=0.177、p=0.387）、幸福感の決定係数は0.018にとどまった（抄録）。", "fun": "SNSで絵の注文を受ける人にとって、表示の仕組み（アルゴリズム）がいつ変わるか分からないのは大きな不安です。この研究では、その不安はテクノロジーによるストレスを強めていましたが、生活全体の幸福感とのつながりは見えませんでした。仮説どおりにならなかった結果を正直に示した点が面白いところです。", "unverified": "本文を入手できず、測定尺度の詳細と、幸福感に関連しなかった理由についての著者の考察は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "空気リフト掘削の掘りくずの移動を縮約モデルで解析", "title": "Cuttings Migration Below the Gas-Injection Point in Air-Lift Reverse-Circulation Drilling: A Reduced-Order Model", "url": "https://doi.org/10.3390/pr14213602", "authors": "Pu Liu ほか", "venue": "Processes", "date": "2026-11-09", "citescore": 5.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "空気リフト逆循環掘削で、注気点より下の掘りくずの移動を、液体と固体の縮約モデルで定量化した（抄録）。", "p3": "固まった掘りくずを連続相として扱い、ドリルパイプの断面を半径方向の層に分けて液相の速度分布を表し、局所平衡のすべりの閉包を使う準定常の空間進行アルゴリズムで長距離の輸送を計算した。上部のガスリフト域は水圧の結合だけで表した（抄録）。", "p5": "層間の交換なしの仮定では、ガスなしの循環で壁近くに掘りくずが強く滞留すると予測された（著者はモデルに依存する保守的な推定とする）。半径方向10層の計算で、孔底から800 mでの注気は壁近くの移動高さを約13.8%増やした。600・700・800 mの比較では600 mで注気点に届く掘りくずの割合が最大だったが、8層と10層の予測の差（13.27 m）は解像度への感度が残ることを示した（抄録）。", "fun": "地下深く掘るときに出る削りくずを、空気の泡の力で地上へ運ぶ方法があります。この研究は、パイプの中を同心円の層に分けて流れを簡単に表すことで、長い距離のくずの動きを計算しました。どの高さから空気を入れるとよく運べるかを比べつつ、計算の細かさで答えが変わる不確かさも正直に示している点が面白いところです。", "unverified": "本文を入手できず、現場データとの比較の有無と、モデルの検証の方法は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "離散要素と有限要素の連成で耕うん具の摩耗を解析", "title": "Combined discrete-finite element modeling of abrasive wear in tillage tool elements", "url": "https://doi.org/10.26897/2687-1149-2026-5-4-14", "authors": "S.G. Mudarisov", "venue": "Agricultural Engineering", "date": "2026-11-09", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "耕うん具の土に触れる部分の摩耗を、離散要素法（DEM）と有限要素法（FEM）の連成で数値モデル化し、乾式のゴム車輪の砂摩耗試験の実験データで検証した（抄録）。", "p3": "ANSYS WorkbenchとRocky DEMで連成計算を行い、直径0.25 mmの球形の砂粒子をDEM（線形の履歴ばね接触）、鋼の試験片とゴム車輪をFEMで表した。アーチャードの摩耗則を経路の倍率（α=1000）で加速して実装し、法線荷重17〜100 Nで計算した（抄録）。", "p5": "摩耗量は荷重のべき乗則（Vm≈1.22N^1.2）で増え、100 Nでは7秒で328.5 mm³に達した。なじみ・定常・加速（85 N以上）の3段階の摩耗が現れ、50 N超ではゴム車輪の弾性変形により両側に極大を持つW字形の摩耗分布が生じた。連成法はDEM単独より摩耗予測の精度を15〜20%高めた（抄録）。", "fun": "畑を耕す農機の刃は、土の中の砂粒にこすられて少しずつすり減ります。この研究は、砂粒一つひとつの動きと、刃やゴムの変形を同時に計算することで、すり減り方を再現しました。荷重が大きくなると、すり減りの分布が真ん中ではなく両側が深い「W字」になるという、目で見ても面白い発見があります。", "unverified": "本文を入手できず、実験との一致の程度の具体的な数値は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "FDEMの境界接触は内部の要素分割に依存しないか", "title": "Interior-discretization invariance of physical-boundary contact in the two-dimensional combined finite-discrete element method", "url": "https://doi.org/10.1016/j.compgeo.2026.108809", "authors": "Zhibo Jia ほか", "venue": "Computers and Geotechnics", "date": "2026-11-08", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、2次元の有限要素・離散要素の連成法（FDEM）で、物理的な境界での接触の扱いが内部の要素分割に左右されない（不変である）ことを扱った研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「物体の中身を細かく区切るか粗く区切るかで、表面どうしのぶつかり方の計算が変わってしまわないか」です。岩が割れたり粒がぶつかったりする計算では、接触の扱いが結果を大きく左右します。計算の都合で決めた区切り方に結果が依存しないことを確かめる、地味だが大切な問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "せん断波速度から砂の液状化の確率を評価", "title": "New method for evaluating the probability of sand liquefaction based on shear wave velocity", "url": "https://doi.org/10.3724/1000-6915.jrme.2025.0866", "authors": "Jinyuan YUAN ほか", "venue": "Chinese Journal of Rock Mechanics and Engineering", "date": "2026-11-09", "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、地盤のせん断波速度にもとづいて、砂が液状化する確率を評価する新しい方法を示した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「地面を伝わる揺れの速さから、地震で砂の地盤が液体のようになる確率を見積もれるか」です。せん断波の速さは地盤の硬さを表し、比較的簡単に測れます。液状化を「起きる・起きない」の二択でなく確率で表そうとする点が面白いところです。", "unverified": "抄録・本文を入手できず、評価式、使用したデータ、結果はすべて未確認。"}}, {"id": "jr50", "rank": 50, "headline": "月面模擬の低重力で振動を加えた粒体流を検証", "title": "Vibration-assisted granular flow under simulated lunar conditions: parabolic flight validation of lunar regolith feed system", "url": "https://doi.org/10.1007/s44461-026-00021-y", "authors": "Anastasia Stepanova ほか", "venue": "Space and Planetary Resources", "date": "2026-11-09", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexで題名から見つけたResearch Squareの版の抄録を使用", "preprint": false, "short": true, "p1": "月面の低重力と真空を模した放物線飛行の実験で、ホッパーに上下の振動を加えると月の表土（レゴリス）の模擬材の流れが詰まらずに続くことを示した（抄録）。", "p3": "真空容器内の8つの並列な供給装置で、出口の直径11〜45 mm、ホッパーの角度46.5°〜90°の4つの形状について、43〜65 Hz・振幅0.2〜0.8 mmの振動を加え、60回の低重力の放物線飛行で計480回の実験を行った（抄録）。", "p5": "振動を加えている間は出口の形状によらず連続して排出され、振動を止めるとすべての構成で数秒以内に流れが止まり、再び振動を加えると人手なしに流れが戻った。回転式の供給装置で質量流量を0.3〜1.0 g/sの範囲で制御できた（抄録）。", "fun": "砂時計の砂は重力で落ちますが、重力が地球の6分の1しかない月では、砂のような粒は詰まって流れにくくなります。この実験では、飛行機を放物線を描くように飛ばして月の重力を再現し、容器を細かく揺らすだけで粒の流れが続くことを確かめました。止めると数秒で詰まり、揺らすとまた流れるという様子が面白いところです。", "unverified": "本文を入手できず、掲載版と抄録を取得した版の違いと、振動の条件ごとの流量の差は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "侵攻後に制裁対象者の金融アクセスが減少", "title": "A natural field experiment on the effectiveness of economic sanctions before and after the Russian invasion of Ukraine", "url": "https://doi.org/10.1038/s41562-026-02591-5", "authors": "Michael G. Findley ほか", "venue": "Nature Human Behaviour", "date": "2026-11-09", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "制裁対象のロシア政府高官の名義（ミドルネームの頭文字を変更）と対照の名義で、202の国・地域の仲介業者にペーパーカンパニーの設立と法人口座の開設を依頼する計7,081通の電子メールを送る自然なフィールド実験を2回行った。2020年12月の第1回では両者に差がなかったが、ロシアのウクライナ侵攻後の2022年5月の第2回では制裁対象者の国際的な企業サービス・銀行へのアクセスが大きく減った。"}, {"id": "jn02", "rank": 2, "field": "地球科学", "headline": "地球の核の鉄の融点は低く、マントル最下部は固体", "title": "Melting and resistivity of iron at Earth core conditions using pulsed Joule heating", "url": "https://doi.org/10.1126/science.aeh5267", "authors": "Zachary M. Geballe ほか", "venue": "Science", "date": "2026-11-09", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "ダイヤモンドアンビルセル内でのマイクロ秒のパルス通電加熱という新しい方法で、高圧下の鉄の融解と抵抗率を300回以上の再現性のある測定で調べた。融解曲線は予想外に緩やかで200 GPaで4160±80 Kとなり、液体鉄の抵抗率76 μΩ cmと合わせて、核–マントル境界が比較的低温（3430 K）で、内核の形成前から熱対流だけで地球磁場を維持できた可能性と、現在のマントル最下部が完全に固体であることを示した。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "米銀の脱炭素移行リスクへの露出は融資の0.5〜2%", "title": "U.S. Banks’ Exposures to Climate Transition Risks", "url": "https://doi.org/10.1017/s0022109026103226", "authors": "Hyeyoon Jung ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-09", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "why": "気候政策の部門別の影響を一般均衡モデルから取り、融資の過去の債務不履行リスクと組み合わせて、銀行の移行リスクへの信用エクスポージャーを推定する新しい手法を提案した。最悪で融資ポートフォリオの14%に達するが、過去の返済構造を考慮すると0.5〜2%に下がり、排出量ではエクスポージャーのばらつきの最大60%しか説明できないことを示した。"}, {"id": "jn04", "rank": 4, "field": "心理学・認知科学", "headline": "数千試行の練習で運動記憶はどう育つか", "title": "Long-term development of a motor memory", "url": "https://doi.org/10.1038/s41562-026-02622-1", "authors": "David W. Franklin ほか", "venue": "Nature Human Behaviour", "date": "2026-11-09", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "通常は数百試行で調べられる運動適応の課題を、数週間にわたる数千試行の訓練で調べ、運動記憶の長期的な発達を追った。参加者は新しい力学をほぼ完全に補償し、保持と自発的回復が長期的に高まる一方、角度方向の汎化が狭まることを示し、運動記憶が課題に合わせて調整され続けることを示唆した。"}, {"id": "jn05", "rank": 5, "field": "機械学習", "headline": "硬さの差が大きい物体の微分可能シミュレーション", "title": "DiffPhD: A Unified Differentiable Solver for Projective Heterogeneous Materials in Elastodynamics with Contact-Rich GPU-Acceleration", "url": "https://doi.org/10.1145/3842497", "authors": "Shih-Yu Lai ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "硬さの差が極端な異種材料・大変形の超弾性・接触の多い場面を、GPUで一体に扱う微分可能な射影ダイナミクスの解法DiffPhDを示した。勾配（随伴）を解析的に計算し、従来の微分可能ソルバより最大1桁速く、100倍の硬さの差でも収束を保つことで、系の同定や軌道最適化の適用範囲を広げた。"}, {"id": "jn06", "rank": 6, "field": "機械学習", "headline": "画素ごとに別の速さで雑音除去し画像生成を高速化", "title": "Inference-Time Pointwise Velocity for Diffusion Acceleration", "url": "https://doi.org/10.1145/3842513", "authors": "Itay Hazan ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "FLUXなど大規模な整流フロー型の画像生成で、すべての潜在座標を同じ時刻で進める代わりに、座標ごとに雑音除去の速さを割り当てる学習不要の手法ITPVを提案した。既存の時刻埋め込みと変調の重みを使い回し、構造が固まった領域を先に進めて生成を加速する。"}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "株主と競合の論理が衝突すると経営者は株主に従う", "title": "Business Responses to Competing Institutional Logics in the Climate Change Field: An Experiment", "url": "https://doi.org/10.1002/bse.71812", "authors": "Arijit Paul ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-09", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "気候変動の分野で短期利益を求める市場の論理と排出削減を求める環境の論理が競合する状況を、石油・ガス企業の経営者の投資額を予想させるビネット実験で検証した。環境の論理は排出削減投資の予想を一貫して高め、株主と競合他社の論理が食い違うと経営者は株主に従うと予想されることを示した。"}, {"id": "jn08", "rank": 8, "field": "機械学習", "headline": "3Dメッシュを言語モデルの系列内で理解・生成", "title": "EVA01: Unified Native 3D Understanding and Generation via Mixture-of-Transformers", "url": "https://doi.org/10.1145/3842532", "authors": "Zongyuan Yang ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "3Dメッシュを2D画像を経由せず多モーダル大規模言語モデルの系列の中で直接トークンとして扱い、理解・生成・文脈に応じた編集を1つのモデルで行うEVA01を、トランスフォーマーの混合（Mixture-of-Transformers）の構成で提案した。"}, {"id": "jn09", "rank": 9, "field": "機械学習", "headline": "多尺度の潜在表現で画像から効率よく3D生成", "title": "Hierarchical Structured Latents for Efficient 3D Generation", "url": "https://doi.org/10.1145/3842496", "authors": "Yuxuan Xiong ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "why": "1枚の画像から3D形状を作る生成で、局所的な形状の複雑さに応じて表現力を配分する多尺度の潜在表現と、空間の排他性と網羅性を構成的に保証する八分木の再パラメータ化を提案し、構造の生成と細部の合成を2段階に分けた。"}, {"id": "jn10", "rank": 10, "field": "因果推論"     "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
