得を通じて革新的な仕事行動を高め、その効果は組織の支援が高いときにだけ現れることを、239人の調査で示した（抄録）。", "p2": "生成AIが建設プロジェクトの専門職の革新を促すのか、どのような条件で促すのかは、個人の行動のレベルでは十分に理解されていなかった（抄録）。", "p3": "技術のアフォーダンスの実現の視点から、探索的な生成AIの利用（新しい使い方を試すこと）を革新的な仕事行動の引き金とし、知識獲得を媒介、組織の支援を調整変数とするモデルを立てた（抄録）。", "p4": "中国の建設業の239人の有効回答で、構造方程式モデリングによりモデルを検証した（抄録）。測定尺度の詳細と適合度の指標は未確認（本文を入手できず）。", "p5": "探索的な生成AIの利用は知識獲得を大きく高め、知識獲得が革新的な仕事行動を促した。探索的な利用の正の効果は組織の支援が高いときに有効で、低いときには見られなかった（抄録）。", "p6": "抄録には限界の記述がない。解釈：1時点の自己報告の調査であり、共通方法の偏りと因果の向きには注意が要る。中国の建設業以外への一般化も未確認。", "fun": "生成AIを仕事で使うと、新しいアイデアは生まれやすくなるのでしょうか。建設業の技術者を調べると、AIでいろいろ試してみる使い方が新しい知識を得ることにつながり、それが工夫や改善の行動を増やしていました。ただし、その効果は会社が支えてくれる職場でしか現れませんでした。道具の良し悪しより使う環境が大事だという点が面白いところです。", "unverified": "本文を入手できず、経路係数の大きさ、調整効果の図示、尺度の項目は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "炭素リスクの高い企業ほど損失の認識が遅い", "title": "Carbon risk, accounting conservatism and the moderating role of financial materiality adoption: international evidence", "url": "https://doi.org/10.1108/jfra-03-2026-0195", "authors": "Yesmine Khlif ほか", "venue": "Journal of Financial Reporting and Accounting", "date": "2026-11-09", "citescore": 12.3, "citescore_year": "2025", "apa": "Khlif, Y., & Chouaibi, J. (2026). Carbon risk, accounting conservatism and the moderating role of financial materiality adoption: international evidence. Journal of Financial Reporting and Accounting, 1–25. https://doi.org/10.1108/jfra-03-2026-0195", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "17か国の高排出部門の315社（2020〜2024年）で、炭素リスクが高い企業ほど条件付きの会計保守主義（損失の適時の認識）が弱く、財務的重要性の原則の採用がその関係をさらに強めることを示した（抄録）。", "p2": "炭素リスクと条件付き保守主義の関係の研究は2020年以降の証拠が少なく結果も混在しており、財務的重要性の原則の影響は非財務情報の開示について調べられてきたが、会計の慎重さへの影響は調べられていなかった（抄録）。", "p3": "Refinitiv EikonとBloombergのデータで、炭素リスクを説明変数、条件付き保守主義を被説明変数、財務的重要性の原則の採用を調整変数とする多変量回帰をパネルで分析し、環境開示の外部保証の効果、代替の測定、内生性への対処で頑健性を確かめた（抄録）。", "p4": "炭素リスクの保守主義への効果の符号と、財務的重要性の採用による調整の向きを評価した（抄録）。保守主義と炭素リスクの測り方、係数は未確認（本文を入手できず）。", "p5": "炭素リスクは条件付き保守主義に負の効果を持ち、財務的重要性の原則はこの負の関係を強めた。環境開示の外部保証は認識の遅れを和らげず、財務的重要性の増幅効果も弱めなかった。結果は代替の測定と内生性への対処の後も頑健だった（抄録）。", "p6": "著者は、財務的重要性の増幅効果を、透明性と炭素リスクの適時の認識を高めるはずの原則が形式的にしか実施されていない可能性と整合すると解釈する（抄録）。解釈：保守主義の測定は会計の推計モデルに依存し、因果の解釈には限界がある。", "fun": "会社が将来の損失を早めに帳簿に反映させる慎重さを「保守主義」と呼びます。この研究では、温室効果ガスを多く出す会社ほど、損失の計上が遅れがちでした。しかも、財務に重要な情報を開示する原則を採用した会社ほど遅れが大きく、ルールが形だけになっている可能性が見えました。「開示しています」と「本当に反映しています」の違いが面白いところです。", "unverified": "本文を入手できず、保守主義と炭素リスクの測り方、係数の大きさ、内生性への対処の方法は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "予防保全の路面平坦性の効果を気候別に評価", "title": "Mixed-Effects Analysis of Pavement Roughness and Rutting Performance of Preventive Maintenance Treatments Across Climatic Regions Using the LTPP Database", "url": "https://doi.org/10.1007/s42947-026-00942-z", "authors": "Bernard Boakye ほか", "venue": "International Journal of Pavement Research and Technology", "date": "2026-11-09", "citescore": 6.7, "citescore_year": "2025", "apa": "Boakye, B., Khan, S., Ullah, I., McClure, K., & Ksaibati, K. (2026). Mixed-Effects Analysis of Pavement Roughness and Rutting Performance of Preventive Maintenance Treatments Across Climatic Regions Using the LTPP Database. International Journal of Pavement Research and Technology. https://doi.org/10.1007/s42947-026-00942-z", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（データと方法・平坦性の結果・モデルの診断・限界の節）を読んだ。わだち掘れの結果の節は概要のみ", "preprint": false, "p1": "米国とカナダの長期舗装性能（LTPP）の実験区間で、4つの予防保全工法の路面の平坦性（IRI）とわだち掘れの経年変化を、区間と州の変量効果を入れた混合効果モデルで気候区分ごとに比べ、薄層オーバーレイが最も効果的で、施工前に粗い路面ほど施工後も粗いことを示した（抄録、§3）。", "p2": "予防保全の工法は気候や環境に合わせて選ぶべきだが、従来の研究は舗装の特性の影響が中心で、同じ区間の繰返し測定や州ごとの差を考慮した長期の効果の比較は限られていた（抄録、§1）。", "p3": "LTPPのSPS-3実験の81地点・431区間（各地点に無処置の対照区間と、薄層オーバーレイ・スラリーシール・チップシール・クラックシールのいずれか）を4気候区分で分析した。対数変換した平坦性に、時間のスプライン、工法×気候×経過年の交互作用、施工前のIRI・大型車交通量・路床・アスファルト厚を固定効果、州と区間を変量効果とする線形混合モデルを当て、わだち掘れには切片と傾きの変量効果を持つ一般化線形混合モデルを使った（§2）。", "p4": "Type IIIの分散分析で各要因の有意性を調べ、気候区分ごとの工法の対比較（シダック補正）を推定周辺平均で行い、残差・多重共線性（GVIF<2.20）・過分散・外れ値でモデルを診断した（§2.1）。", "p5": "平坦性には施工前のIRI（χ²=662.526、p<.001）と交通量（χ²=14.016、p<.001）が有意で、施工前に粗い路面は施工後の粗さが約67.85%（95%CI 58.02〜70.83）大きかった。気候×工法、経過年×工法、経過年×気候の交互作用も有意だった。薄層オーバーレイはすべての気候で対照に比べ平坦性の悪化を最も抑え、改善は最大27.1%だった。乾燥凍結地域ではチップシールが13.30%、スラリーシールが13.0%改善した（§3.2、表2）。", "p6": "著者は、区間ごとの測定回数や気候区分ごとの区間数が不均一で施工時期もそろっていないこと、後から処置を受けた対照区間があること、わだち掘れのモデルの説明力が低いこと、平坦性のモデルで系列相関を考慮できなかったことを挙げる（§3.5）。", "fun": "道路のでこぼこは、早めに薄く舗装し直すなどの「予防の手入れ」で抑えられます。でも、どの手入れがどの気候で効くのでしょうか。米国とカナダの400以上の試験区間を長年追跡したデータを分析すると、薄い舗装のかぶせ直しが全般に最も効き、もともとでこぼこが大きい道は手入れの後もでこぼこが残りやすいことが分かりました。「早めの手入れが肝心」を数字で示した点が面白いところです。", "unverified": "本文では改善が最大・最小の地域がともに「湿潤凍結」と書かれており（§3.2）、最小の1.24%の地域は未確認。わだち掘れの結果の数値（§3.3）は読んでいない。"}}, {"id": "jr08", "rank": 8, "headline": "生成AIを宣伝する会計事務所は失敗の責任を重く問われる", "title": "AI-Focused Promotional Positioning and Client Attribution of Responsibility for Accounting Firm Service Failures", "url": "https://doi.org/10.33423/r4evn841", "authors": "Dennis M. O’Reilly", "venue": "Journal of Accounting and Finance", "date": "2026-11-08", "apa": "O’Reilly, D. (2026). AI-Focused Promotional Positioning and Client Attribution of Responsibility for Accounting Firm Service Failures. Journal of Accounting and Finance, 26(3). https://doi.org/10.33423/r4evn841", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "会計事務所が生成AIの活用を前面に出して宣伝していると、税務申告の誤りが起きたときに顧客は事務所により重い責任を帰し、事務所が誤りを防げたはずだと考え、再発も予想しやすいことを実験で示した（抄録）。", "p2": "会計事務所は生成AIに投資し、それをサービスの中心として宣伝しているが、その宣伝が、誤りが起きたときの顧客の責任の帰属にどう影響するかは調べられていなかった（抄録）。", "p3": "帰属理論にもとづく参加者間の実験で、事務所が作成した税務申告に誤りがあった場面を読ませ、事務所の宣伝が生成AIの活用を強調する条件と、従来型のサービスを強調する条件を比べた。誤りの原因は曖昧にした（抄録）。解釈：原因が分からないときに、宣伝の内容が責任の割り振りの手がかりになるかを見る設計。", "p4": "評価したのは、事務所への非難の程度、誤りの防止に対する事務所の統制力の認識、誤りの再発の見込み（抄録）。参加者の人数と属性、尺度の詳細は未確認（本文を入手できず）。", "p5": "生成AIを宣伝する条件の参加者は、誤りについて事務所をより強く非難し、事務所が誤りの防止をより統制できたと認識し、誤りがより再発しやすいと判断した（抄録）。", "p6": "著者は、生成AIの宣伝は統制と信頼性への顧客の期待を高め、技術の役割が不明な誤りでも評判のリスクを高めうるとし、技術の高度さを強調する事務所は問題が起きたときにより責任を問われうるというトレードオフを示唆する（抄録）。解釈：場面を読ませる実験で、実際の顧客の行動や取引の継続への影響は未確認。", "fun": "「最新のAIを使っています」と宣伝する会計事務所は頼もしく見えます。ところが、申告書に誤りが見つかると、そうした事務所ほど「防げたはずだ」「また起きる」と強く責められました。AIが原因かどうか分からなくても、です。宣伝で期待を高めることは、失敗したときの失望を大きくするという、評判の両刃の剣が面白いところです。", "unverified": "本文を入手できず、参加者数、効果の大きさ、尺度の詳細は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "需要側の都市交通政策で2050年の排出を約6割削減", "title": "Assessing demand-side policy impacts on US urban passenger transport", "url": "https://doi.org/10.1088/1748-9326/aebbd9", "authors": "Xiangwen Fu ほか", "venue": "Environmental Research Letters", "date": "2026-11-09", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "apa": "Fu, X., Bertram, C., & Kyle, P. (2026). Assessing demand-side policy impacts on US urban passenger transport. Environmental Research Letters, 21(21), 214030. https://doi.org/10.1088/1748-9326/aebbd9", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（方法・シナリオ設計・結果・考察の節と表1〜2）を読んだ", "preprint": false, "p1": "統合評価モデルGCAMで米国の旅客交通を都市と都市間に分け、6つの需要側政策（コンパクトな都市開発・速度制限・シェアモビリティ・在宅勤務・燃料税・混雑課金）が2050年までの都市旅客交通に与える影響を推計し、合わせると排出を約6割減らせ、電気自動車（EV）の普及と補い合うことを示した（抄録、§3）。", "p2": "需要側の政策は都市旅客交通のエネルギーと排出を大きく減らしうるが、従来の統合評価モデルの研究は都市交通の動きを明示的に表しておらず、その削減の可能性を十分に評価できていなかった（抄録、§1）。", "p3": "GCAM v8.2で、交通サービス需要を人口・所得・価格で決め、手段と技術の選択を時間価値と速度を含む費用のロジットで表す。米国の旅客交通を都市とその他に分け、中位の社会経済経路SSP2を基準に、各政策を交通需要・手段の重み・速度・費用などのパラメータの変化として実装した（§2、表1〜2）。", "p4": "2050年までの都市旅客交通のサービス需要・最終エネルギー・電化率・CO₂排出を、基準・個別政策・全需要政策・野心的なEV普及・全交通政策・経済全体の脱炭素との組合せのシナリオで比べ、手段の構成を世界の都市の実績と並べた（§3、図2〜4）。", "p5": "基準でも2050年までにエネルギーと排出は47%・65%減る。個別政策では速度制限が需要を最も減らし（−17%）、コンパクトな開発と速度制限が基準からエネルギー（と排出）を27%・21%減らした。全需要政策で需要は37%減り、車の旅客キロの割合は2021年の92%から2050年に66%に下がり、エネルギーと排出は58%・59%減った。野心的なEV普及だけでは電力需要が2021年から718 TWh増えるが、需要政策と組み合わせると299 TWhに抑えられた（§3）。", "p6": "著者は、速度制限などの実際の効果は現地の執行に依存し不確実なこと、電力供給の排出は将来の電源構成の想定に依存し電力系統の詳しい分析は範囲外であることを挙げる（§3〜4）。解釈：政策の効果をパラメータの変更として与えており、政策の費用や実現可能性は評価していない。", "fun": "電気自動車に乗り換えれば排出は減りますが、車に頼る暮らしそのものは変わりません。この研究は、街をコンパクトにする、速度を抑える、在宅勤務を増やすといった「移動の仕方を変える」政策を組み合わせると、2050年の都市交通の排出を約6割減らせると試算しました。しかも電気自動車と組み合わせると、増える電力需要を大きく抑えられる点が面白いところです。", "unverified": "補足資料（感度分析のSSP1・SSP5の結果など）は読んでいない。"}}, {"id": "jr10", "rank": 10, "headline": "病院原価報告の配賦の異常を説明可能に検出する構想", "title": "Toward Explainable Detection of Hospital Cost-Allocation Anomalies: Evidence and Research Opportunities Using Medicare Cost Reports", "url": "https://doi.org/10.56557/ajocr/2026/v11i411351", "authors": "George Osei", "venue": "Asian Journal of Current Research", "date": "2026-11-09", "apa": "Osei, G. (2026). Toward Explainable Detection of Hospital Cost-Allocation Anomalies: Evidence and Research Opportunities Using Medicare Cost Reports. Asian Journal of Current Research, 11(4), 269–279. https://doi.org/10.56557/ajocr/2026/v11i411351", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "米国の病院が毎年提出するメディケア原価報告（MCR）の原価部門への配賦の異常を、外れ値検出と説明可能なAIで見つけるための概念的な枠組みを、3つの研究分野を統合する物語的レビューから提案した（抄録）。", "p2": "MCRでは総費用を標準の原価部門に振り分け、間接費を段階的な配賦で患者ケア部門に割り当てる。入院の支払いの多くは前払い方式でも、MCRは原価対料金比率や研修医教育・不足分の支払いの根拠となるが、欠落・情報源間の食い違い・計算の誤りが指摘されてきた（抄録）。", "p3": "MCRの構造とデータの質の研究、メディケアの請求と提供者データでの異常・不正の機械学習による検出、監査と会計での説明可能なAI（XAI）の3つの文献を、対象を絞ったデータベース検索と引用の追跡で集めて統合した（系統的検索ではない）。その上で、MCRの構造を監査できる異常の指標（配賦基準、管理・一般費、従業員福利費の配賦、原価対料金比率、組替え、前年比の変化）に対応させ、それぞれに検出法（頑健なz得点、Isolation Forest、局所外れ値因子法）と説明法（SHAPなど）を結びつけた（抄録）。", "p4": "実データでの検出性能の評価は行っておらず、文献の統合と枠組みの提案が中心である（抄録）。解釈：枠組みの有効性は今後の実証に委ねられている。", "p5": "メディケアの不正検出は確立した分野で、監査でのXAIは新しく現れつつあるが、原価部門の水準での病院の原価配賦データに説明可能な異常検出を適用した例は見つからなかった。提案した枠組みは、検出された外れ値を監査人と規制当局の調査の手がかりとして扱うとした（抄録）。", "p6": "著者は、外れ値は病院の規模・患者構成・施設の組織・報告の慣行の違いを反映しうるため、不正や誤りと直ちにみなすべきでないとする（抄録）。解釈：系統的検索ではないため見落としの可能性があり、単著のレビューで実証の結果はない。", "fun": "病院は毎年、人件費や建物の費用などを、どの診療部門がどれだけ使ったかに振り分けて国に報告しています。この配り方に誤りや不自然な点があると、病院への支払いにも影響します。この論文は、AIで「いつもと違う配り方」を見つけ、その理由まで説明させる仕組みを提案しました。怪しい点を「犯人」ではなく「調べる手がかり」として扱う慎重さが面白いところです。", "unverified": "本文を入手できず、取り上げた文献の範囲と、枠組みの指標ごとの詳しい定義は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "凍結融解で土のせん断強度が落ちる仕組みをDEMで解明", "title": "Shear Behaviors of Soil Under Freeze–Thaw Cycles: Experiments and Discrete Element Simulation", "url": "https://doi.org/10.3390/w18212789", "authors": "Cailing Liu ほか", "venue": "Water", "date": "2026-11-09", "citescore": 6.7, "citescore_year": "2025", "apa": "Liu, C., Liu, P., Xu, C., Su, A., Jiang, H., Wang, M., Liu, J., Tao, Q., Zhang, X., & Shang, S. (2026). Shear Behaviors of Soil Under Freeze–Thaw Cycles: Experiments and Discrete Element Simulation. Water, 18(21), 2789. https://doi.org/10.3390/w18212789", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "寒冷地の水路斜面の土について、凍結融解の繰返しでせん断強度が落ちる様子を実験で測り、実験で検証した離散要素法（DEM）のモデルで、微小亀裂の進展と接触力の鎖の変化という土の中の仕組みを示した（抄録）。", "p2": "寒冷地では凍結融解による水路斜面の崩壊が多く、その多くは斜面の土のせん断挙動と関係するが、凍結融解でせん断強度が落ちる土の内部の仕組みは十分に分かっていなかった（抄録）。", "p3": "水路の土に凍結融解を0〜5回与えてせん断試験を行い、その結果で精度を確かめたDEMのモデルで、せん断の過程での土の中間スケールの構造（微小亀裂、接触力の鎖、粒子の変位、せん断帯）の変化を模擬した（抄録）。解釈：粒子のつながりが凍結融解で弱まり、せん断で亀裂が広がる様子を粒子の水準で可視化する設計。", "p4": "評価は、ピーク応力・粘着力・内部摩擦角の変化と、DEMの模擬のピーク値の実験との一致（平均偏り誤差MBE）、亀裂の数と種類、接触の数（抄録）。試験の条件（拘束圧、含水比など）とDEMのパラメータは未確認（本文を入手できず）。", "p5": "凍結融解でピーク応力と粘着力が大きく低下し、5回後の粘着力は28.99 kPaだった。内部摩擦角は回数とともにわずかに下がり9°〜16°だった。模擬のピーク値は0〜5回の試料で実験とよく一致し、MBEの最大は2.27%以内だった。凍結融解は微小亀裂の連続的な進展を促し、引張亀裂がせん断亀裂より多く、5回後にはせん断亀裂1,798、引張亀裂6,779、合計8,577に達した。凍結融解は元の接触力の鎖を壊した（抄録）。", "p6": "抄録には限界の記述がない。解釈：1つの水路の土での結果で、DEMの粒子の形や大きさの仮定、現場の斜面の安定性への定量的なつながりは抄録からは分からない。", "fun": "寒い地方では、土の中の水が凍ったり溶けたりを繰り返すうちに、斜面が崩れやすくなります。この研究は、実験で土の強さが落ちていく様子を測り、さらにコンピュータの中で土を小さな粒の集まりとして再現しました。すると、凍結と融解のたびに粒どうしのつながりが切れ、引っ張られてできる細かなひびが増えていく様子が見えた点が面白いところです。", "unverified": "本文を入手できず、試験の条件、DEMのパラメータ、接触数の変化の具体的な値は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "農村の社会的包摂の指標は粒度と農村特性が不足", "title": "Mind the Rural Gap! Rethinking Rural Social Inclusion Indicators in Europe", "url": "https://doi.org/10.1007/s10037-026-00298-8", "authors": "Dilay Celebi ほか", "venue": "Review of Regional Research", "date": "2026-11-09", "citescore": 3.6, "citescore_year": "2025", "apa": "Celebi, D., Gourzoulidou, S., & Prodromidou, A. (2026). Mind the Rural Gap! Rethinking Rural Social Inclusion Indicators in Europe. Review of Regional Research. https://doi.org/10.1007/s10037-026-00298-8", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（方法・横断的な軸・証拠とギャップの地図・限界の節と図3の説明）を読んだ。各指標の解説の節は見出しのみ", "preprint": false, "p1": "欧州の社会的包摂の指標を系統的レビューで整理し、4つの領域と横断的な軸からなる枠組みと、農村特性・地理的解像度などの5基準で指標を採点する「証拠とギャップの地図」を作って、既存の指標は農村の不利と地域の中の差を捉えるには粒度と農村への適合が足りないことを示した（抄録、§4）。", "p2": "欧州の農村は多様だが、社会的包摂を監視する指標は空間的に粗く概念も一般的で、農村に特有の不利や地域の不均一をどこまで捉えているか、それが計画と政策に何を意味するかは整理されていなかった（抄録）。", "p3": "2010〜2024年の学術文献と政策文書をPRISMA 2020に沿って選んだ141件から、指標を経済的安定と雇用、健康とウェルビーイング、生活条件、社会参加の4領域と、年齢・民族・性別・障害・デジタルアクセス・地理と気候の脆弱性などの横断的な軸に整理した。各指標群を農村特性（RS）・成熟度（IM）・地理的解像度（GR）・妥当性と再現性（VA）・入手性と新しさ（AC）の5基準で0〜3点で2人が独立に採点した（§3、§4.3）。", "p4": "評価の対象は、領域ごとの各基準の得点が最大の3点からどれだけ離れているか（測定のギャップ）である（§4.5）。", "p5": "成熟度と入手性は強く、地理的解像度と農村特性が弱かった。経済的安定と雇用はIM=2.700・AC=2.600だがRS=1.100・GR=1.150、健康はIM=2.778・AC=2.667だがGR≈0.667、生活条件はIMとACが3.000でRS=1.429と最も高いがGR≈0.571、社会参加はGR=0.400と最も低くVA=1.300だった（§4.5、図3）。多くの指標はNUTS1・NUTS2の水準でしか得られず、遠隔の村と地域の中心の差が隠れると指摘した（§4.5）。", "p6": "著者は、地図が既存の指標と文書の範囲に制約され、心の健康・インフォーマルなケア・日常の社会関係が十分に測られていないこと、採点に専門家の判断が入ること、欧州中心で他地域への直接の一般化は限られること、質的・参加型の証拠を含まないことを挙げる（§5.3）。", "fun": "社会から取り残されている人がどれだけいるかを測る物差しは、国や州の単位の統計が中心です。でも農村では、同じ地域の中でも町の中心と山奥の村で暮らしが大きく違います。この研究は欧州の140以上の資料を調べ、物差しが粗すぎて村ごとの違いが見えず、病院までの遠さのような農村ならではの困りごとも測れていないことを示しました。「何を測れていないか」を地図にした点が面白いところです。", "unverified": "各指標（I1〜I10など）の解説の節と表1の採点の基準の詳細は読んでいない。"}}, {"id": "jr13", "rank": 13, "headline": "信号断の前後で搬送波の整数不定性を引き継ぐ測位", "title": "A cross-epoch ambiguity tracking method for GNSS/INS/Vision-based urban navigation", "url": "https://doi.org/10.1186/s43020-026-00227-7", "authors": "Bo Xu ほか", "venue": "Satellite Navigation", "date": "2026-11-09", "sjr": 3.423, "citescore": 19.9, "citescore_year": "2025", "apa": "Xu, B., Zhang, S., Yao, Y., Li, X., Wang, J., & Li, S. (2026). A cross-epoch ambiguity tracking method for GNSS/INS/Vision-based urban navigation. Satellite Navigation, 7(1). https://doi.org/10.1186/s43020-026-00227-7", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（追跡の手順・サイクルスリップの検出・実験設定・測位性能・因子グラフとの組合せの節）を読んだ。表3〜4の数値と結論の全文は読んでいない", "preprint": false, "p1": "都市でGNSSの搬送波が途切れるたびに整数不定性を初期化し直す問題に対し、収束した整数不定性を保持して、信号の再捕捉後のサイクルスリップの検出と補正に再利用する方法（CEAT）をGNSS/INS/画像の密結合航法に組み込み、測位の精度と整数解の得られる割合を高めた（抄録、追跡の手順の節）。", "p2": "都市の高精度なGNSS測位は、建物・樹木・高架による搬送波の中断とサイクルスリップでたびたび劣化し、信号の再捕捉後に整数不定性の再初期化と長い再収束が繰り返される（抄録）。", "p3": "MSCKFで慣性航法・画像・RTKを密結合し、収束した整数不定性とその不確かさを「不定性プール」に保持する。新しい観測では、INSと画像で予測した位置から擬似距離と搬送波の残差を別々に作り、搬送波の残差のクラスタリング（DBSCAN）でサイクルスリップを検出し、LAMBDA法で整数のスリップ量を推定して、保存した不定性を補正して引き継ぐ。信頼できる基準が作れないときは擬似距離による回復を試み、だめなら再初期化する（手順の節、サイクルスリップの検出の節）。", "p4": "武漢で収集した2つの車載データ（高架・並木・建物の遮蔽を含む都市の走行と大学構内の走行。RTKLIBの3次元RMSEは3.65 mと0.87 m）で、幾何ベースのワイドレーン法（GB-WL）、擬似距離と搬送波を分けて処理するEDM、HMW-GF法と比べ、模擬のサイクルスリップ試験、アブレーション、事前位置の感度分析も行った（実験の節）。", "p5": "CEATはどちらの走行でも水平・鉛直とも最も良い測位精度を示し、とくに上下方向の改善が大きかった（図8・9、表3・4）。因子グラフ最適化の方式に組み込むと、都市の走行で固定解の3次元RMSEは0.46 mから0.32 m（FGO-SAW）、0.49 mから0.30 m（FGO-TAR）に下がり、固定解が得られる割合は75.0%から89.2%、60.3%から90.5%に上がった（表5）。", "p6": "解釈：検証は武漢の2つの走行に限られ、他の都市や受信機、トンネルのような長い遮蔽への一般化は未確認。著者が結論で挙げる限界は本解説では確認していない。", "fun": "高層ビルの間を車で走ると、GPSの電波が途切れたりつながったりします。精密な測位では、つながり直すたびに「電波の波の数を数え直す」作業が必要で、その間は精度が落ちてしまいます。この研究は、途切れる前に数えた値を覚えておき、つながり直したときに「どれだけずれたか」だけを直す方法を作りました。一からやり直さず、記憶を生かして素早く立ち直る発想が面白いところです。", "unverified": "表3〜4（RTK/INS/画像の密結合での各手法の精度）の数値と、結論の節の限界の記述は確認していない。"}}, {"id": "jr14", "rank": 14, "headline": "人とAIの共創では選ぶ仕組みが発想を画一化", "title": "Mesa De Bar: An Open, Configurable Platform for Human–AI Co-Creation, with a Multi-Agent Simulation Study of Creative Homogenization", "url": "https://doi.org/10.1609/aiide.v22i1.43588", "authors": "Murilo Mazzotti Silvestrini ほか", "venue": "Proceedings of the AAAI Conference on Artificial Intelligence and Interactive Digital Entertainment", "date": "2026-11-08", "citescore": 3.5, "citescore_year": "2025", "apa": "Mazzotti Silvestrini, M., Salmaze, P. H., & Tortoro Pereira, L. (2026). Mesa De Bar: An Open, Configurable Platform for Human–AI Co-Creation, with a Multi-Agent Simulation Study of Creative Homogenization. Proceedings of the AAAI Conference on Artificial Intelligence and Interactive Digital Entertainment, 22(1), 300–310. https://doi.org/10.1609/aiide.v22i1.43588", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "人とLLMペルソナが反復して発想・選択を行う共創のための公開の多エージェント基盤Mesa de Barを作り、エージェントのみの模擬実験で、提案者が選択も担う仕組みが集団の出力を画一化させ、独立した判定者が多様性を最も保つことを示した（抄録）。", "p2": "生成AIは個人の創造性を高める一方で集団の出力を画一化させ、その緊張はAIが案を出し、次の回の種となる案の選択も担う反復的な共創で強まる。ループの制御構造がこの収束をどう左右するかは分かっていなかった（抄録）。", "p3": "プレイヤーがK体のLLMペルソナとある話題について、匿名の発想、AIの判定者とプレイヤーによる匿名の二重の選択、設定可能な意思決定の動態、作者の開示、統合の各段階を何回も繰り返す。実験の要素はすべて人が読めるファイルで宣言し、人がプレイする形とエージェントだけの模擬の形の両方に対応する（抄録）。", "p4": "装置の妥当性の確認と系全体の画一化の特徴づけのため、プレイヤーをLLMエージェントに置き換え、6つのテーマで意思決定の動態を変えた108の再現可能なセッションを実行し、セッション間の多様性と勝ち残る案の集中を比べた（抄録）。結果は人ではなくエージェントの集団とループについてのものとされる。", "p5": "直観に反して、独立した判定者がセッション間の多様性を最もよく保った。提案と選択の両方を担う参加者は自分の案を約9割の確率で勝ち進ませ、勝者が集中して集団が画一化した。画一化は生成ではなく選択から生じるセッション間の効果で、AIによる判定が原因ではなかった（抄録）。", "p6": "著者は、人がプレイする研究と、合意による評価法（Consensual Assessment）での妥当性の確認を今後の課題としている（抄録）。解釈：結果はLLMのエージェントだけの模擬によるもので、人が加わった場合の画一化の程度は未確認。", "fun": "AIと一緒にアイデアを出し合うと、みんなの案が似通ってしまうことが知られています。この研究は、その原因が「アイデアを出す段階」ではなく「選ぶ段階」にあることを突き止めました。案を出した本人が選ぶ役も兼ねると、9割は自分の案を選んでしまうからです。審判を独立させるだけで多様性が保たれるという、仕組みの設計の大切さが面白いところです。", "unverified": "本文を入手できず、使用したLLM、多様性の測り方、6つのテーマの内容は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "在宅ケアと介護者研修で施設入所の意向が減少", "title": "Preventing nursing home admission in dependent older adults: a randomised controlled trial of a multimodal home-based intervention", "url": "https://doi.org/10.1007/s10433-026-00955-4", "authors": "Eduard Minobes-Molina ほか", "venue": "European Journal of Ageing", "date": "2026-11-09", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "apa": "Minobes-Molina, E., Pamies Tejedor, S., Rojano i Luque, X., Roncal-Belzunce, V., Escalada San Adrián, G., Atarés Rodríguez, L., & García-Navarro, J. A. (2026). Preventing nursing home admission in dependent older adults: a randomised controlled trial of a multimodal home-based intervention. European Journal of Ageing. https://doi.org/10.1007/s10433-026-00955-4", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "要介護の高齢者に、在宅ケアの強化と主たる介護者への体系的な研修を組み合わせた介入を行うと、施設入所を受け入れる意向が生じるまでの時間が延び、意向の発生が約3分の1に抑えられることを、18か月の無作為化比較試験で示した（抄録）。", "p2": "施設入所は高齢化と長期ケアの政策で重要な成果指標だが、多くの高齢者は複雑な介護が必要でも住み慣れた場所で暮らし続けることを望む。入所の前段階である入所の意向を遅らせる在宅の介入の効果は検証が必要だった（抄録）。", "p3": "スペイン・カタルーニャの地域で、公的な在宅ケアを利用し、施設入所を望まず、主たる無償の介護者がいる要介護度IIまたはIIIの65歳以上を、通常のケアか、人中心の枠組みでの在宅ケアの強化と介護者の体系的な研修を15か月行う群に無作為に割り付けた（評価者は盲検、抄録）。", "p4": "主要評価項目は施設入所を受け入れる意向の表明で、施設入所の意向までの時間をFine-Grayの競合リスクモデルで分析し、Cox回帰で感度分析をした。副次評価項目は機能（修正Barthel指数）、虚弱、サルコペニアのリスク、転倒のリスク、認知、健康関連QOL（EQ-5D-3L）で、ベースラインを調整した線形混合モデルで3か月ごとの評価を分析した（抄録）。", "p5": "142人（年齢の中央値86歳、女性64.8%）が参加し、介入は施設入所の意向を有意に減らした（HR=0.32、p=0.002）。副次評価項目では一貫した効果はなく、認知とQOLで介入群に有利な差が特定の時点で見られたが、持続的な効果ではなかった（抄録）。", "p6": "抄録には限界の記述がない。解釈：主要評価項目は実際の入所ではなく入所を受け入れる意向であり、実際の入所の遅れや費用への効果は抄録からは分からない。標本は142人とやや小さい。", "fun": "介護が必要になっても、できれば家で暮らし続けたいと願う高齢者は多くいます。この研究では、家でのケアを手厚くし、家族の介護者にも介護の仕方を学んでもらうと、「施設に入ってもいい」と考えるようになる人が約3分の1に減りました。本人だけでなく支える家族を支えることが、住み慣れた家での暮らしを守るという点が面白いところです。", "unverified": "本文を入手できず、介入の具体的な内容（訪問の回数や研修の中身）と、副次評価項目の数値は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "故障の診断と発生までの時間の予測を注意機構で連結", "title": "A directed cross-task attention Transformer for joint fault diagnosis and prognostics of rail engine compressors", "url": "https://doi.org/10.1177/14759217261504003", "authors": "Rose Marie Charuvil Elizabeth ほか", "venue": "Structural Health Monitoring", "date": "2026-11-09", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Charuvil Elizabeth, R. M., Sattari, F., & Lefsrud, L. (2026). A directed cross-task attention Transformer for joint fault diagnosis and prognostics of rail engine compressors. Structural Health Monitoring. https://doi.org/10.1177/14759217261504003", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "多センサの機械の状態監視で、故障の種類の診断から故障発生までの時間の予測へ情報を流す有向の注意機構をトランスフォーマーに組み込み、診断と予測を一体で行えるようにした（抄録）。", "p3": "学習可能なタスクトークンと注意機構でタスクごとの表現を作り、診断の表現が発生までの時間の予測に情報を与えるようにし、不確実性にもとづく自動重み付けの損失で2つの目的を釣り合わせた。鉄道の機関車の空気圧縮機の空気漏れ14,712件・油漏れ218,846件の多変量センサデータで検証した（抄録）。", "p5": "分類精度95.2%、発生までの時間の誤差は空気漏れで9.3分、油漏れで3.7分だった。内蔵の警報より空気漏れを96分、油漏れを2日以上早く検知し、欠測・雑音・ドリフトにも頑健だった（抄録）。", "fun": "機械の不調は、「何が起きているか」が分かると「いつ壊れるか」も予想しやすくなります。この研究はAIの中で、故障の種類を見分ける部分から、故障までの時間を予測する部分へ情報が一方向に流れるようにしました。その結果、もともと付いていた警報より油漏れを2日以上も早く見つけられたという点が面白いところです。", "unverified": "本文を入手できず、比較した深層学習の手法と、データの期間・故障の件数は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "CNNとGRUを組み合わせたデジタルツイン型SHM", "title": "A Digital Twin Framework With Adaptive Learning for Resilient Structural Health Monitoring", "url": "https://doi.org/10.1002/cpe.71025", "authors": "Vijay Kumar ほか", "venue": "Concurrency and Computation: Practice and Experience", "date": "2026-11-09", "citescore": 5.7, "citescore_year": "2025", "apa": "Kumar, V., & Bhatia, M. (2026). A Digital Twin Framework With Adaptive Learning for Resilient Structural Health Monitoring. Concurrency and Computation: Practice and Experience, 38(22). https://doi.org/10.1002/cpe.71025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "多センサのデータを健全・不健全に分類するCNNと、健全度の推移を予測するGRUを組み合わせた、デジタルツイン型の構造ヘルスモニタリングの枠組みを提案した（抄録）。", "p3": "水分・振動・ひずみ・亀裂の進展の情報を使って構造の挙動を模擬し、CNNで分類、GRUで時系列予測を行う。35,041〜60,215件の4つのデータセット（D1〜D4）で評価した（抄録）。", "p5": "CNNの分類は平均の正解率93.54%、感度90.88%、特異度95.26%、F1値92.12%で、GRUの予測は平均正解率97.78%以上、MAE 0.0049、RMSE 0.11、相関係数0.994だった（抄録）。", "fun": "橋や建物の「分身（デジタルツイン）」をコンピュータの中に作り、センサの情報から今の健康状態と今後の変化を見張る試みです。この研究は、画像認識が得意なAIで今の状態を判定し、時間の流れが得意なAIで先を読むという役割分担をしました。分身に「診断」と「予報」の両方をさせる発想が面白いところです。", "unverified": "本文を入手できず、4つのデータセットの出所（実測か模擬か）と比較対象の手法は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "柔軟な光電センサで橋のたわみを非接触計測", "title": "An ultrafast response non-contact method based on flexible photovoltaic sensor for high-precision bridge deflection monitoring under low-frequency vibrations", "url": "https://doi.org/10.1007/s11431-026-3377-4", "authors": "Kangxu Huang ほか", "venue": "Science China Technological Sciences", "date": "2026-11-09", "citescore": 8.9, "citescore_year": "2025", "apa": "Huang, K., Zhang, H., Shen, X., Lu, M., Zhang, Z., Zhang, C., & Yang, D. (2026). An ultrafast response non-contact method based on flexible photovoltaic sensor for high-precision bridge deflection monitoring under low-frequency vibrations. Science China Technological Sciences, 69(11). https://doi.org/10.1007/s11431-026-3377-4", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、柔軟な太陽電池（光電）センサを使い、低周波の振動の下で橋のたわみを非接触で、応答が非常に速く高い精度で監視する方法を示した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「橋のたわみを、触れずに、速く、正確に測れるか」です。橋は車が通るとわずかにしなりますが、その量を橋に器具を取り付けずに測るのは簡単ではありません。光を電気に変える薄く曲がるセンサをどう使えば、ゆっくり揺れる橋の動きを捉えられるのか、という発想が面白いところです。", "unverified": "抄録・本文を入手できず、測定の原理、精度の数値、実橋での検証の有無はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "説明可能AIでAE監視のセンサ網を最適化", "title": "Explainable artificial intelligence-enabled sensor network optimization for lifecycle-oriented acoustic emission monitoring of concrete infrastructure", "url": "https://doi.org/10.1016/j.engappai.2026.116718", "authors": "Minzhe Wu ほか", "venue": "Engineering Applications of Artificial Intelligence", "date": "2026-11-09", "sjr": 1.782, "citescore": 11.7, "citescore_year": "2025", "apa": "Wu, M., Li, K., Benavidez, B., Tirado, M., Yang, K., Yang, J., Sun, R., & Ai, L. (2027). Explainable artificial intelligence-enabled sensor network optimization for lifecycle-oriented acoustic emission monitoring of concrete infrastructure. Engineering Applications of Artificial Intelligence, 187, 116718. https://doi.org/10.1016/j.engappai.2026.116718", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、コンクリートのインフラのアコースティックエミッション（AE）監視で、ライフサイクル全体を見据えたセンサ網の配置を説明可能なAIで最適化する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「ひび割れの小さな音を聞き取るセンサを、どこに何個置けばよいか」です。コンクリートの中で亀裂が進むと、かすかな音（弾性波）が出ます。限られた数のセンサで長い年月にわたって見張るには配置の工夫が要り、その判断の理由をAIに説明させようとする点が面白いところです。", "unverified": "抄録・本文を入手できず、最適化の方法、対象の構造物、成果の数値はすべて未確認。"}}, {"id": "jr20", "rank": 20, "headline": "スマートフォンの走行記録で運転行動を分類", "title": "Explainable machine learning for trip-level driving behaviour profiling from smartphone telematics in road freight operations", "url": "https://doi.org/10.1016/j.trip.2026.102344", "authors": "Pedro Entringer ほか", "venue": "Transportation Research Interdisciplinary Perspectives", "date": "2026-11-09", "sjr": 1.039, "citescore": 6.6, "citescore_year": "2025", "apa": "Entringer, P., Leal, F., & Pinho, M. (2027). Explainable machine learning for trip-level driving behaviour profiling from smartphone telematics in road freight operations. Transportation Research Interdisciplinary Perspectives, 41, 102344. https://doi.org/10.1016/j.trip.2026.102344", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、道路の貨物輸送で、スマートフォンのテレマティクス（走行記録）から走行ごとの運転行動を説明可能な機械学習で特徴づける研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「トラックの運転手が持つスマートフォンだけで、運転の癖が分かるか」です。スマートフォンには加速度や位置を測るセンサが入っており、急ブレーキや急ハンドルの記録が残ります。特別な機器なしに走行ごとの運転の特徴を読み取り、その判断の理由まで示そうとする点が面白いところです。", "unverified": "抄録・本文を入手できず、使用したセンサの種類、データの規模、分類の精度はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "合成作用を失った鉄道橋の桁はたわみが3.6倍", "title": "Experimental investigation of the stress-strain state of steel-reinforced concrete span structures of a railway bridge under different conditions of composite action between structural elements", "url": "https://doi.org/10.15802/bttrp2026-30-09", "authors": "S. O. Melnychuk ほか", "venue": "Bridges and tunnels: theory, research, practice", "date": "2026-11-09", "apa": "Melnychuk, S. O., & Kovalchuk, V. V. (2026). Experimental investigation of the stress-strain state of steel-reinforced concrete span structures of a railway bridge under different conditions of composite action between structural elements. Bridges and Tunnels: Theory, Research, Practice, (30), 80–90. https://doi.org/10.15802/bttrp2026-30-09", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "鉄道橋の鋼・鉄筋コンクリートの合成桁で、床版と主桁の合成作用が損なわれた径間と健全な径間の応力とたわみを、貨物・旅客列車の通過時に実測して比べた（抄録）。", "p3": "欠陥のない径間と、合成作用を損なう欠陥のある径間で、Spider-8のデータ収録装置を使い、VL11形電気機関車が牽引する貨物列車と旅客列車の通過時の繊維応力とたわみを測った（抄録）。", "p5": "損傷径間の道床の床版には引張応力（6.55 kg/cm²）、健全径間には圧縮応力（−26.75 kg/cm²）が生じ、床版が主桁との合成作用から完全に外れていた。貨物列車の通過時の最大たわみは損傷径間で17.48 mm、健全径間の4.85 mmの3.6倍で、旅客列車では15.91 mm対4.25 mmだった（抄録）。", "fun": "鉄の桁とコンクリートの床がしっかりくっついて一体で働くと、橋は強くなります。この調査では、そのつながりが壊れた部分の橋は、同じ列車が通っても健全な部分の3.6倍もしなっていました。目に見えない「くっつき具合」が、列車が通るときの測定ではっきり数字に表れる点が面白いところです。", "unverified": "本文を入手できず、測定点の配置、列車の速度、測定の回数は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "監査の質とガバナンスの研究を計量書誌で整理", "title": "Audit Quality and Corporate Governance: Emerging Links With Sustainability and Accountability", "url": "https://doi.org/10.1002/csr.71168", "authors": "Simone Sessa ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-08", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Sessa, S., Rago, G., & Cafaro, E. M. (2026). Audit Quality and Corporate Governance: Emerging Links With Sustainability and Accountability. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71168", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "コーポレートガバナンスと監査の質の関係の研究を、計量書誌分析と影響力の大きい研究の内容分析で整理した（抄録）。", "p3": "Web of Scienceの784本（2000〜2024年）の出版・引用・ネットワークの傾向をHistCite・VOSviewer・Bibliometrixで分析し、年あたりの局所引用で選んだ21本を、監査の質の基礎・ガバナンスの需要・資金調達への帰結・報告行動の4つのテーマで比べた（抄録）。", "p5": "監査人の特性・監査報酬・報告の代理変数は監査の質の異なる側面を捉えており、所有構造・法執行・非公式な関係がその解釈を左右することを示し、サステナビリティ報告と保証のガバナンスへの含意と研究課題を示した（抄録）。", "fun": "「監査がしっかりしているか」は直接見えないので、研究者は監査報酬や監査法人の規模などで間接的に測ってきました。この研究は800本近い論文を整理し、そうした物差しはそれぞれ監査の質の別の面を見ていると指摘しました。同じ言葉でも測っているものが違うという点が面白いところです。", "unverified": "本文を入手できず、21本の選定の詳細と、示された研究課題の具体的な内容は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "ESGの不祥事と短期の収益性の関係（インド）", "title": "ESG Controversies and Short‐Term Profitability: The Role of Current ESG Performance and Lagged Reputation in Emerging Markets", "url": "https://doi.org/10.1002/csr.71156", "authors": "Sraddha Srivastav ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-08", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Srivastav, S., Chhillar, N., Singh, V., & Dash, A. (2026). ESG Controversies and Short‐Term Profitability: The Role of Current ESG Performance and Lagged Reputation in Emerging Markets. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71156", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "インドの非金融上場企業で、ESGの不祥事への関与が短期のROEと正に関連し、その関連は現在のESGスコアが高い企業ほど弱まることを示した（抄録）。", "p3": "NIFTY 500の2024〜25年度の382社・年の観測で、ステークホルダー理論・正統性理論・経営者の機会主義の仮説にもとづき、HayesのPROCESSマクロの調整モデルで分析し、PLS-SEMで頑健性を確かめた（抄録）。", "p5": "不祥事への関与はROEと正に関連し、開示義務が形成途上の環境での一時的な費用の外部化と整合した。現在のESGスコアはこの関連を有意に弱め、正の関連はESGの低い企業に集中した。1年・2年前のESGスコアに追加の調整効果はなく、単年度のため時間的な変化は示せない（抄録）。", "fun": "環境や社会の問題で不祥事を起こした会社が、短期的にはむしろ利益率が高いという結果が出ました。費用を社会に押しつけて目先の利益を上げている可能性があり、それはESGの評価が低い会社に集中していました。「悪いことをしても短期では得をする」ように見える現実を、評価の高低で切り分けた点が面白いところです。", "unverified": "本文を入手できず、不祥事の測り方（データ源）と効果の大きさの数値は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "財務困窮が継続企業の監査意見を招く", "title": "Pengaruh Financial Distress dan Audit Tenure terhadap Opini Audit Going Concern dengan Moderasi Kualitas Auditor", "url": "https://doi.org/10.59059/jupiekes.v4i4.3556", "authors": "Latersia Br Gurusinga ほか", "venue": "Jurnal Penelitian Ilmu Ekonomi dan Keuangan Syariah", "date": "2026-11-09", "apa": "Latersia Br Gurusinga, Victor Victor, & Yeni Yeni. (2026). Pengaruh Financial Distress dan Audit Tenure terhadap Opini Audit Going Concern dengan Moderasi Kualitas Auditor. Jurnal Penelitian Ilmu Ekonomi Dan Keuangan Syariah, 4(4), 190–207. https://doi.org/10.59059/jupiekes.v4i4.3556", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアのエネルギー企業で、財務困窮が継続企業の前提に関する監査意見（ゴーイング・コンサーン意見）の確率を高めることを示した（抄録）。", "p3": "インドネシア証券取引所に上場するエネルギー企業の2021〜2025年の年次報告書と監査報告書を目的抽出し、監査人の質を調整変数として、財務困窮と監査契約の期間が継続企業の意見に与える影響をロジスティック回帰で分析した（抄録）。", "p5": "財務困窮は継続企業の意見に有意に影響したが、監査契約の期間と監査人の質は有意でなかった。監査人の質は財務困窮の効果を負に調整したが、監査契約の期間の効果は調整しなかった（抄録）。", "fun": "会社が来年も続けられるか危ういとき、監査人は決算書に「注意書き」をつけます。この研究では、経営が苦しい会社ほどこの注意書きがつきやすく、一方で監査人との付き合いの長さは関係ありませんでした。経営の苦しさが監査人の判断にどう表れるかを、実際の記録で確かめた点が面白いところです。", "unverified": "本文を入手できず、標本の企業数と財務困窮の測り方（どの指標か）は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "銀行の満足度と乗り換え意向を公表統計から検討", "title": "Brand Image, Customer Satisfaction, and Switching Intention: An Empirical Study of Uzbek Commercial Banks", "url": "https://doi.org/10.31150/kjf7be18", "authors": "Mirzajonova Maftunaxon Jaxongir qizi", "venue": "American Journal of Economics and Business Management", "date": "2026-11-07", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ウズベキスタンの銀行利用者について、公表された調査の要約と中央銀行の統計から、満足と乗り換え意向について言えることと言えないことを整理し、主銀行の乗り換えと副次的な利用を区別する調査設計を示した（抄録）。", "p3": "経済研究改革センターの1,100人超の銀行利用者の調査の要約と、2024年1月〜2025年7月の中央銀行の月次統計を使い、公表された周辺の割合から満足と乗り換えについて推論できる範囲を示した（抄録）。", "p5": "肯定的な評価は外国為替の66%から決済の81%まで分かれ、預金関連では満足約90%、銀行を変える意向1%と報告されていた。個人のリモートバンキングの件数は4,224万から6,755万へ59.9%増えた。指標は母集団が異なり個票がないため、個人レベルの関係は推定できていない（抄録）。", "fun": "「満足している人は乗り換えない」というのは当たり前に思えますが、この論文は公表された集計の数字だけではそれを確かめられないと正直に示しました。そのうえで、メインの銀行を替えることと、別の銀行を「ついでに使う」ことを分けて聞く調査の設計を提案しています。乗り換えの中身を分けて考える点が面白いところです。", "unverified": "本文を入手できず、提案した調査設計の具体的な質問項目は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "記憶に残る観光体験が幸福感と愛着を経て忠誠に", "title": "From memorable tourism experiences to destination loyalty: The role of tourists’ well-being and place attachment in Dong Thap Muoi, Vietnam", "url": "https://doi.org/10.31893/multiscience.2027269", "authors": "Thanh Sang Le ほか", "venue": "Multidisciplinary Science Journal", "date": "2026-11-08", "citescore": 1.1, "citescore_year": "2025", "apa": "Le, T. S., Tran, D. K., & Nguyen, Q. L. (2026). From memorable tourism experiences to destination loyalty: The role of tourists’ well-being and place attachment in Dong Thap Muoi, Vietnam. Multidisciplinary Science Journal, 9(4), 2027269. https://doi.org/10.31893/multiscience.2027269", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ベトナムの湿地の観光地で、記憶に残る観光体験が快楽的・持続的な幸福感と場所への愛着を通じて、再訪・推奨・好意的な口コミからなる観光地への忠誠につながることを示した（抄録）。", "p3": "ドンタップムオイを訪れたことのある観光客586人のデータをPLS-SEMで分析し、記憶に残る体験→2種類の幸福感と場所への愛着→観光地への忠誠（高次の構成概念）という構造モデルを検証した（抄録）。", "p5": "記憶に残る体験は両方の幸福感を高め、場所への愛着を直接強めた。学びや自己成長に関わる持続的な幸福感は快楽的な幸福感より愛着への効果が強く、場所への愛着が忠誠の最も強い直接の予測因子だった（抄録）。", "fun": "旅行先にまた行きたくなるのは、楽しかったからだけではないようです。この研究では、その場所で何かを学んだり、自分が成長したと感じたりした経験の方が、その土地への愛着を強く育てていました。「楽しさ」より「意味」が人を土地に結びつけるという点が面白いところです。", "unverifi Services, 95, 105203. https://doi.org/10.1016/j.jretconser.2026.105203", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、包摂的な（多様な顧客を受け入れる）小売の取組みが顧客との関係を強めるかを、複数時点の反復横断調査で調べた研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「誰でも受け入れるお店は、お客さんとの絆も強くなるのか」です。障害のある人や高齢者、さまざまな背景の人に配慮した店づくりは、社会的に正しいだけでなく、商売としても報われるのか。何回かに分けて調べることで、時間の流れの中で関係を確かめようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、包摂の測り方、調査の対象・規模、結果はすべて未確認。"}}, {"id": "jr29", "rank": 29, "headline": "退職で仕事の縁は減り家族・地域の縁が増える", "title": "Retirement’s role in social connections and connectedness: a systematic review", "url": "https://doi.org/10.1007/s10433-026-00956-3", "authors": "Kristina Thompson ほか", "venue": "European Journal of Ageing", "date": "2026-11-09", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "apa": "Thompson, K., de Regt, A., Gunn, C., Thompson, P., & Hauptmann, H. (2026). Retirement’s role in social connections and connectedness: a systematic review. European Journal of Ageing. https://doi.org/10.1007/s10433-026-00956-3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "退職が社会的なつながり（関係の量）とつながりの感覚（関係の質）に与える影響を系統的レビューで整理し、一律の良い・悪い影響はなく、測り方と退職者の特性で結果が変わることを示した（抄録）。", "p3": "2024年3月にWeb of Science・Scopus・PubMedを系統的に検索し、17研究を含めてデータを抽出・物語的に分析し、混合研究法の評価ツールで質を評価した（抄録）。", "p5": "17研究の多く（13）で効果は結果指標や下位集団で異なった。つながりの研究では仕事上の周辺的な縁が減り家族や地域の縁に置き換わることが多く、つながりの感覚では社会経済的に不利な層と男性で弱い傾向があった。縁が減っても支えの実感が増す補償的な効果もみられた（抄録）。", "fun": "定年で会社を辞めると、人とのつながりは減るのでしょうか。17の研究をまとめると、仕事の知り合いは減っても家族や地域の縁がそれを埋めることが多く、一律に「孤独になる」わけではありませんでした。ただし男性や経済的に苦しい人ではつながりの実感が弱くなりがちで、誰にとっての退職かで姿が変わる点が面白いところです。", "unverified": "本文を入手できず、含めた研究の国・デザインの内訳と、質の評価の結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "認知症の介護者が相手と息を合わせる過程の理論", "title": "The Theory of Rhythmic Synergy in Caregiving for Older Adults Living With Dementia", "url": "https://doi.org/10.1111/pere.70095", "authors": "Chloe E. Gonzales ほか", "venue": "Personal Relationships", "date": "2026-11-09", "sjr": 0.898, "citescore": 3.4, "citescore_year": "2025", "apa": "Gonzales, C. E., Afifi, T. D., & Merolla, A. J. (2026). The Theory of Rhythmic Synergy in Caregiving for Older Adults Living With Dementia. Personal Relationships, 33(4). https://doi.org/10.1111/pere.70095", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "認知症の人を介護する家族が、相手とのやり取りのリズムを合わせながら「暗黙のうちに分かり合える」状態を育てていく過程を、「リズムの相乗」の理論として示した（抄録）。", "p3": "認知症の人を介護する成人の家族31人への詳細な半構造化面接から理論を構築した（抄録）。", "p5": "リズムの相乗は、介護者が相手への応答を繰り返し、言語・非言語の振る舞い（リズム）を調整し、一緒にいる感覚（関係の相乗）を感じる中で時間をかけて育つ、関係的に同調した高次の状態と定義された。介護のネットワークの他の人がこの過程を助けも妨げもすること、症状の進行や負担の増加など時間の要素が重要なことを示した（抄録）。", "fun": "認知症が進むと、言葉でのやり取りは難しくなっていきます。それでも介護する家族は、相手の表情やしぐさのリズムに合わせることで「言わなくても分かる」関係を少しずつ育てていました。音楽の合奏のように息を合わせることが、介護の支えになるという見方が面白いところです。", "unverified": "本文を入手できず、理論の構成要素の詳細と、面接の対象者の属性は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "韓国系米国人家族の世代間の医療意思決定", "title": "Negotiating Care Across Generations: Healthcare Decision‐Making in Aging Korean American Families", "url": "https://doi.org/10.1111/josi.70092", "authors": "EunJeong Lee ほか", "venue": "Journal of Social Issues", "date": "2026-11-09", "sjr": 1.309, "citescore": 9.6, "citescore_year": "2025", "apa": "Lee, E., Qin, S., Corrigan, P., Cerny, B. M., & Baig, A. (2026). Negotiating Care Across Generations: Healthcare Decision‐Making in Aging Korean American Families. Journal of Social Issues, 82(4). https://doi.org/10.1111/josi.70092", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "韓国系米国人の成人した子どもが、高齢の家族の医療上の意思決定にどう関わるかを面接で調べ、家族中心の意思決定を柔軟で関係的な過程として描いた（抄録）。", "p3": "高齢の家族を医療の場で支えた経験のある韓国系米国人12人に、慢性疾患を持つ高齢の移民を含む地域参加型の研究チームと作った半構造化面接を行い、ビネットへの反応も含めて主題分析した（抄録）。", "p5": "家族が意思決定の主な文脈であること、状況に応じた家族の参加、交渉される権限、文化と世代による違い、参加の条件としてのコミュニケーションの5つの主題を見いだした。家族の関与は一律に集団主義的・義務的ではなく、病状・関係・世代・制度で変わり、力関係が参加を妨げると医療者の権威に従うことも多かった（抄録）。", "fun": "移民の家庭では、英語が得意な子どもが親の病院での通訳や判断の手伝いを担うことがよくあります。この研究によると、それは「家族だから当然」という義務ではなく、病気の重さや親子の関係に応じて形を変える柔軟な助け合いでした。医療の判断を「患者と医師」だけで考えない視点が面白いところです。", "unverified": "本文を入手できず、参加者の属性の詳細と、各主題を支える具体的な語りは未確認。参加者は12人と少ない。"}}, {"id": "jr32", "rank": 32, "headline": "地域に根ざした児童虐待予防の取組みを総覧", "title": "Community-Based Child Maltreatment Prevention: A Scoping Review", "url": "https://doi.org/10.1177/15248380261497727", "authors": "Fengshuo Chen ほか", "venue": "Trauma, Violence, and Abuse", "date": "2026-11-09", "sjr": 2.896, "citescore": 16.7, "citescore_year": "2025", "apa": "Chen, F., Liu, S., Wang, M., & Zhang, H. (2026). Community-Based Child Maltreatment Prevention: A Scoping Review. Trauma, Violence, & Abuse. https://doi.org/10.1177/15248380261497727", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "地域に根ざした児童虐待の予防の取組みを総覧し、公衆衛生のモデルとよく合う一方で、設計・実施・評価に課題が残ることを示した（抄録）。", "p3": "6つのデータベースを創刊時から2025年9月まで検索し、87研究に記述された62のプログラムを量的内容分析で整理した（抄録）。", "p5": "多くのプログラムは地域の住民全体とリスクのある家族の両方を対象にし、個人・家族・近隣の水準でサービスを提供し、多部門の専門職・ボランティア・草の根の団体が関わっていた。評価は無作為化比較試験が11%、準実験が27%、正式な評価なしが16%で、虐待そのものを直接評価したのは3分の1だった（抄録）。", "fun": "子どもへの虐待を防ぐのは、家族だけでも専門家だけでも難しく、地域全体の力が必要です。この研究は世界の62の地域の取組みを調べ、近所の人やボランティアまで巻き込む工夫が多い一方で、本当に虐待が減ったかを確かめたものは3分の1しかないことを示しました。「みんなで見守る」効果をどう測るかという課題が面白いところです。", "unverified": "本文を入手できず、プログラムの国・地域の内訳と、効果があったプログラムの特徴は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "生成AIで作文のストレスは減るが新しさも減る", "title": "Reducing stress, but limiting novelty and diversity: exploring generative AI’s roles in writing", "url": "https://doi.org/10.1007/s11145-026-10930-1", "authors": "Fangzhou Jin ほか", "venue": "Reading and Writing", "date": "2026-11-09", "sjr": 1.206, "citescore": 5.6, "citescore_year": "2025", "apa": "Jin, F., Song, Z., Ren, R., & Lin, C.-H. (2026). Reducing stress, but limiting novelty and diversity: exploring generative AI’s roles in writing. Reading and Writing. https://doi.org/10.1007/s11145-026-10930-1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "中学2年の授業で生成AIを使って説明文を書かせると、構成などは良くなりストレスも減る一方、文の複雑さと新しさの伸びが小さくなることを示した（抄録）。", "p3": "5週間の準実験で、生成AIを支援に使う学級（36人）と検索エンジンを使う学級（37人）の作文を介入の前後で比べ、書いている間の心拍変動（HRV）でストレスを測り、刺激再生面接と探索的なPLS-SEMも行った（抄録）。", "p5": "生成AIの学級は焦点・構成・内容・言語で優れたが、文が単純になり新規性の伸びも小さかった。心拍変動からは両群でストレスの揺れがあったが、生成AIの学級では全体としてストレスが減り、面接からは課題の難しさの調整、即時の説明つきのフィードバックなど4つの経路が示唆された（抄録）。", "fun": "AIの助けを借りて作文を書くと、上手にまとまり、気持ちも楽になりました。でも文は単純になり、新しい発想の伸びは小さくなりました。心臓の鼓動のゆらぎでストレスを測るという工夫も面白く、「楽になること」と「伸びること」は必ずしも一致しないという点が考えさせられるところです。", "unverified": "本文を入手できず、作文の評価方法と効果の大きさの数値は未確認。2学級の比較で、無作為化ではない。"}}, {"id": "jr34", "rank": 34, "headline": "LLMの診断の確信は証拠の順序で変わり一貫しない", "title": "Probabilistic Coherence of Stated Diagnostic Beliefs in Large Language Models: Anchored Tests on a Synthetic Clinical Corpus", "url": "https://doi.org/10.3390/make8110369", "authors": "Govind Arun ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-11-09", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "apa": "Arun, G., George, A. B., & Bhasuran, B. (2026). Probabilistic Coherence of Stated Diagnostic Beliefs in Large Language Models: Anchored Tests on a Synthetic Clinical Corpus. Machine Learning and Knowledge Extraction, 8(11), 369. https://doi.org/10.3390/make8110369", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "LLMが述べる診断の確率が、ベイズ的な信念更新の公理（証拠の順序に依存しないなど）を満たすかを正解ラベルなしで検定し、満たさないことを示した（抄録）。", "p3": "合成の臨床コーパスDDXPlusの1,956人・49疾患について、4B〜32Bの公開重みの11の構成から112万件の応答を得て、順序不変性・更新の忠実さ・冗長な情報への不感性・位置への固定の4つの公理を、各モデルの再検査の下限と患者間の上限に照らして検定した（抄録）。", "p5": "Qwen3の系列では順序の入替えによる乖離が規模とともに0.128から0.291に増えたが、下限から上限の幅に対する比は0.215から0.127に減った。信念の更新は証拠の向きと一致せず（方向の一致率0.454〜0.549）、どのモデルも自ら述べた事後確率の首位より1.8〜5.6倍多く正しい診断名を挙げており、欠陥は臨床知識ではなく確率の表し方にあると結論した（抄録）。", "fun": "名探偵なら、手がかりを見つけた順番が違っても同じ犯人にたどり着くはずです。ところがこの研究では、AIの診断の確信度は、症状を聞く順番を入れ替えるだけで変わってしまいました。しかもAIは正しい病名を知っているのに、自分の付けた確率ではそれを一番にしないことが多かったという、知識と確率表現のずれが面白いところです。", "unverified": "本文を入手できず、モデルごとの詳細な結果と、4つの公理の具体的な検定方法は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "LLM判定者の関係的な較正はいつ効くか", "title": "When does relational calibration help an LLM-as-a-judge? A human-grounded, strict-inductive study of value calibration and selection", "url": "https://doi.org/10.1016/j.ins.2026.124403", "authors": "Yunan Zhang ほか", "venue": "Information Sciences", "date": "2026-11-09", "sjr": 1.507, "citescore": 14.6, "citescore_year": "2025", "apa": "Zhang, Y., Fan, J., & Liu, Y. (2026). When does relational calibration help an LLM-as-a-judge? A human-grounded, strict-inductive study of value calibration and selection. Information Sciences, 124403. https://doi.org/10.1016/j.ins.2026.124403", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、LLMを判定者とする評価で、価値観の関係的な較正と選択がどのようなときに役立つかを、人の判断にもとづく厳密に帰納的な設計で検証した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「AIに採点をさせるとき、人の価値観に合わせる調整はいつ効くのか」です。AIの判定者は便利ですが、何を良いとするかの基準が人とずれることがあります。そのずれを人の判断を手本に直す工夫が、どんな条件なら本当に役立つのかを確かめようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、較正の方法、評価の対象、結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "浸水解析とLLMエージェントで救援の行動案を作成", "title": "From inundation rasters to draft action briefs: integrating spatial computing and LLM agents for urban waterlogging emergency decision support", "url": "https://doi.org/10.1080/17538947.2026.2749231", "authors": "Shuai Hong ほか", "venue": "International Journal of Digital Earth", "date": "2026-11-08", "citescore": 7.4, "citescore_year": "2025", "apa": "Hong, S., Shen, J., Lienert, C., Chen, X., Kurishbayev, A., Liu, T., & Imanmadi, D. (2026). From inundation rasters to draft action briefs: integrating spatial computing and LLM agents for urban waterlogging emergency decision support. International Journal of Digital Earth, 19(2). https://doi.org/10.1080/17538947.2026.2749231", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "都市の内水氾濫の緊急対応で、衛星観測にもとづく浸水の空間計算とLLMの多エージェントを組み合わせ、人が確認する避難・資源配分の行動案の下書きを作る枠組みMAEDF-UWを示した（抄録）。", "p3": "2021年7月20日の鄭州の豪雨を例に、5 mのGF-3の浸水範囲と12.5 mのALOS PALSARの標高モデルから局所的な静水圧の仮定で水深を推定し、運用上の水深の閾値で道路網の通行不能区間と救援の孤立地を特定した。その空間的な事実を構造化して地域の緊急時計画の規則とともに検索拡張型のエージェントに渡し、形式と規則を点検したJSONの行動案を作らせた（抄録）。", "p5": "事例分析で、事象に固有の空間的な証拠と地域の対応規則が避難と資源配分の指示の下書きにどう反映されるかを示した。評価は指示の一貫性・空間入力の正確さ・処理の遅延を別の次元として扱い、全体の性能と運用上の有効性には独立した検証がまだ必要だとした（抄録）。", "fun": "大雨で街が水につかったとき、どの道が通れず、どこに人が取り残されるかを素早く知る必要があります。この研究は、衛星写真と地形から水の深さを計算し、その「事実」と自治体の決まりごとをAIに渡して、救助の指示の下書きを作らせました。計算は機械、判断の言葉はAI、最終確認は人という分担が面白いところです。", "unverified": "本文を入手できず、生成した行動案の正確さの評価の数値は未確認。著者自身が独立した検証は未了としている。"}}, {"id": "jr37", "rank": 37, "headline": "スマートシティと低炭素都市の重複指定で包摂的成長", "title": "Impact of Digital-Green Policy Combination on Urban Inclusive Green Growth: Evidence from China’s Dual Pilot Policies of Smart City and Low-Carbon City", "url": "https://doi.org/10.3390/land15112128", "authors": "Huixuan Zhang ほか", "venue": "Land", "date": "2026-11-09", "citescore": 6.4, "citescore_year": "2025", "apa": "Zhang, H., & Zhang, B. (2026). Impact of Digital-Green Policy Combination on Urban Inclusive Green Growth: Evidence from China’s Dual Pilot Policies of Smart City and Low-Carbon City. Land, 15(11), 2128. https://doi.org/10.3390/land15112128", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国でスマートシティと低炭素都市の2つの試行政策が重なった都市では、包摂的なグリーン成長が高まることを、262都市の多期間の差の差分析で示した（抄録）。", "p3": "2011〜2023年の262都市のデータで、2つの試行政策が両方とも有効かどうかで政策の組合せを定義し、多期間の差の差モデルで効果を推定し、炭素排出強度の媒介、デジタル知識の流れとグリーン金融の調整、政策の順序と間隔、空間的な波及を調べた（抄録）。", "p5": "政策の組合せの係数は0.1395（p<0.01）で、両方の試行の段階の係数0.2192は、スマートシティのみ・低炭素都市のみの段階をそれぞれ0.1660（p<0.01）、0.0984（p<0.05）上回った。組合せは炭素排出強度を下げ（−0.2040、p<0.05）、それが媒介した。政策の順序による差は有意でなく、周辺都市への正の波及もみられた（抄録）。", "fun": "デジタル化の政策と脱炭素の政策は、別々に行うより組み合わせた方が効果が大きいのでしょうか。中国の262都市を調べると、両方の指定を受けた都市では、環境にやさしく、かつ多くの人に恩恵が届く成長がより進んでいました。どちらを先にしても効果は同じだったという点も面白いところです。", "unverified": "本文を入手できず、包摂的なグリーン成長の指標の作り方と、平行トレンドの確認の結果は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "既存の路線網を少し直して公共交通の接続を改善", "title": "Breaking Is Easier than Building: Improving Public Transport Routes to Enhance Travel-Time Connectivity Using a Neural Evolutionary Approach", "url": "https://doi.org/10.3390/smartcities9110191", "authors": "Aleksandr Morozov ほか", "venue": "Smart Cities", "date": "2026-11-09", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Morozov, A., Kozlyak, R., Zorina, Y., & Mityagin, S. A. (2026). Breaking Is Easier than Building: Improving Public Transport Routes to Enhance Travel-Time Connectivity Using a Neural Evolutionary Approach. Smart Cities, 9(11), 191. https://doi.org/10.3390/smartcities9110191", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した掲載誌の抄録を使用", "preprint": false, "short": true, "p1": "グラフニューラルネットと進化計算を組み合わせた手法を、ゼロから路線網を作るのではなく、既存の公共交通の路線網を変更を抑えながら改善するように学習させた（抄録）。", "p3": "路線の調整の程度に緩い制約をかけ、学習した路線編集のヒューリスティックで改善を探索した。MandlとMumfordのベンチマークと、ロシア・エカテリンブルクの事例で評価した（抄録）。", "p5": "ベンチマークでは学習した路線編集の方法が元のニューラル手法より乗客側の平均費用を下げた。事例では初期の路線網に比べ、加重した中央値の接続時間を69.6%、路線の総走行時間を26.3%同時に減らした。ただしこの改善は、既存の路線が通らない地点を含む停留所の候補の拡大が前提だった（抄録）。", "fun": "バスの路線を一から作り直せば理想的な網ができるかもしれませんが、現実には住民が慣れた路線を大きく変えるのは難しいものです。この研究はAIに「今ある路線を少しずつ直す」ことを学ばせ、移動時間を大きく縮めました。題名の「壊す方が作るより易しい」という発想の転換が面白いところです。", "unverified": "本文を入手できず、停留所の候補の拡大を除いた場合の改善の大きさは未確認。"}}, {"id": "jr39", "rank": 39, "headline": "エジプトの新LRT沿線のTODの可能性を駅別に評価", "title": "Assessing transit-oriented development potential in Egypt’s emerging LRT corridor: a node–place assessment within a 3Vs- and SDG-aligned framework", "url": "https://doi.org/10.1186/s44147-026-01315-w", "authors": "Tamer ElSerafi ほか", "venue": "Journal of Engineering and Applied Science", "date": "2026-11-09", "citescore": 5.2, "citescore_year": "2025", "apa": "ElSerafi, T., & Aboubakr, D. (2026). Assessing transit-oriented development potential in Egypt’s emerging LRT corridor: a node–place assessment within a 3Vs- and SDG-aligned framework. Journal of Engineering and Applied Science, 73(1). https://doi.org/10.1186/s44147-026-01315-w", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "エジプトの新しいLRT沿線について、駅ごとのTOD（公共交通指向型開発）の可能性をノード・プレイスの指標で評価する、SDGと整合した枠組みを示した（抄録）。", "p3": "エル・サラーム、新行政首都、10月のラマダン市を結ぶ沿線の駅を、交通網の情報・乗客数・土地利用・街路網・GISによる空間分析で評価した。市場価値は駅周辺が開発途上で安定したデータがないため、枠組みに残しつつ定量評価しなかった（抄録）。", "p5": "駅の間に大きな差があり、アドリー・マンスール駅が交通の接続性と地域のアクセスの組合せで最も強く、新しい市街地の駅はノードとプレイスが中程度で段階的な介入が必要だった。指標が完全な4駅の順位は正規化と重み付けを変えても変わらなかった（抄録）。", "fun": "駅の周りに住宅やお店を集める「駅を中心にした街づくり」は、どの駅でも同じようにはうまくいきません。この研究は、交通の結節点としての強さと、街としての魅力の2つの物差しで駅を比べました。まだ街ができていない新しい駅の評価をどうするかという、成長途中の都市ならではの悩みが面白いところです。", "unverified": "本文を入手できず、評価した駅の数と指標の重み付けの詳細は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "インドと南アのスマートシティのデジタル包摂", "title": "Evaluating Digital Inclusion in Smart Cities: Comparative Insights from India and South Africa", "url": "https://doi.org/10.1080/10630732.2026.2742804", "authors": "Sarbeswar Praharaj ほか", "venue": "Journal of Urban Technology", "date": "2026-11-09", "sjr": 1.065, "citescore": 8.4, "citescore_year": "2025", "apa": "Praharaj, S., & Grant, R. (2026). Evaluating Digital Inclusion in Smart Cities: Comparative Insights from India and South Africa. Journal of Urban Technology, 1–32. https://doi.org/10.1080/10630732.2026.2742804", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、インドと南アフリカのスマートシティで、デジタル技術の恩恵が誰に届いているか（デジタル包摂）を比較評価した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「スマートシティの便利さは、誰にでも届いているのか」です。街がデジタル化しても、スマートフォンを持たない人や使い方が分からない人は取り残されるかもしれません。格差の大きい2つの国の都市を比べることで、包摂の条件の違いを探ろうとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、対象の都市、評価の方法、結果はすべて未確認。"}}, {"id": "jr41", "rank": 41, "headline": "組織のAI採用を説明可能な機械学習で予測", "title": "Explainable Machine Learning for Predicting Organizational AI Adoption: Strategic Alignment, Organizational AI Readiness, and Technology-Organization-Environment Factors", "url": "https://doi.org/10.63329/av3nz12337", "authors": "Noor ul Amin ほか", "venue": "Scientific Societal & Behavioral Research Journal", "date": "2026-11-09", "apa": "Amin, N. u., Din, M. Z. U., & Asghar, S. (2026). Explainable Machine Learning for Predicting Organizational AI Adoption: Strategic Alignment, Organizational AI Readiness, and Technology-Organization-Environment Factors. Scientific Societal & Behavioral Research Journal, 2(2), 132. https://doi.org/10.63329/av3nz12337", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "スロバキアの359の民間組織の調査データで、組織のAI採用を説明可能な機械学習で予測し、どの要因が予測に効いているかを示した（抄録）。", "p3": "組織のAI成熟度・景況感・技術-組織-環境（TOE）の要因を説明変数とし、ロジスティック回帰・ランダムフォレスト・XGBoostを、80対20の層化分割、5分割交差検証、3つの乱数シード、5,000回のブートストラップで評価し、SHAP値と並べ替え重要度で寄与を調べた（抄録）。", "p5": "採用は199、非採用は160で、平均ROC-AUCはロジスティック回帰0.823、ランダムフォレスト0.840、XGBoost 0.851だった。TOEの組織・技術・環境の要因が平均絶対SHAPの約71.97%を占め、戦略との整合、測定できるAIの便益の認識、プライバシーの成熟度、組織の資源などが影響の大きい予測因子だった（抄録）。", "fun": "会社がAIを取り入れるかどうかは、技術の良し悪しだけでは決まりません。この研究は、359の組織のデータから、経営戦略との合い具合や、効果を測れると感じているかどうかが大きく効いていることをAIで示しました。ただし著者は「予測に効く」ことと「原因である」ことを分けて慎重に述べている点も大事なところです。", "unverified": "本文を入手できず、調査の実施主体と各変数の質問項目は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "従業員のAI導入の評価は論理が違っても意図は似る", "title": "Different Logics, Similar Intentions: Heterogeneity in How Employees Evaluate AI Adoption", "url": "https://doi.org/10.1080/10447318.2026.2758475", "authors": "Leonidas A. Zampetakis", "venue": "International Journal of Human–Computer Interaction", "date": "2026-11-09", "citescore": 10.1, "citescore_year": "2025", "apa": "Zampetakis, L. A. (2026). Different Logics, Similar Intentions: Heterogeneity in How Employees Evaluate AI Adoption. International Journal of Human–Computer Interaction, 1–19. https://doi.org/10.1080/10447318.2026.2758475", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、従業員がAIの導入を評価するときの考え方（論理）には異質性があるが、導入への意図は似ていることを示した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「AIの導入に賛成する人たちは、同じ理由で賛成しているのか」です。仕事が楽になるから、会社に求められるから、時代の流れだからなど、理由は人それぞれでも、最終的な気持ちは似ているのかもしれません。理由の違いを見分けることが職場の話し合いにどう役立つのかが面白いところです。", "unverified": "抄録・本文を入手できず、調査の方法、対象、類型の内容はすべて未確認。"}}, {"id": "jr43", "rank": 43, "headline": "AIは従業員ではない：職場の心的モデルの研究", "title": "AI Is Not an Employee: Workplace Mental Models and the Context Discovery Gap in Human-AI Interaction", "url": "https://doi.org/10.1080/10447318.2026.2757414", "authors": "Jing-Rung Huang ほか", "venue": "International Journal of Human–Computer Interaction", "date": "2026-11-09", "citescore": 10.1, "citescore_year": "2025", "apa": "Huang, J.-R., & Lu, W.-H. (2026). AI Is Not an Employee: Workplace Mental Models and the Context Discovery Gap in Human-AI Interaction. International Journal of Human–Computer Interaction, 1–16. https://doi.org/10.1080/10447318.2026.2757414", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、職場で人がAIをどのような存在として理解しているか（心的モデル）と、AIが必要な文脈を見いだせないという人とAIのやり取りの隔たりを扱った研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「AIを同僚のように扱うと、何がうまくいかないのか」です。人の同僚なら職場の事情を自然に察してくれますが、AIは教えられていない文脈を知りません。人がAIに抱く「同僚のイメージ」と、AIが実際に知っていることのずれに注目している点が面白いところです。", "unverified": "抄録・本文を入手できず、研究の方法と結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "仕事のストレスは人よりAIに話したい", "title": "I’d Rather Talk to AI About Work Stress: Extending the O-S-R-O-R Model Through Human-AI Communication in Workplace Health Contexts", "url": "https://doi.org/10.1080/10410236.2026.2760914", "authors": "Dongya Wang ほか", "venue": "Health Communication", "date": "2026-11-09", "sjr": 1.208, "citescore": 7.5, "citescore_year": "2025", "apa": "Wang, D., Li, Z., Shi, H., & Jin, H. (2026). I’d Rather Talk to AI About Work Stress: Extending the O-S-R-O-R Model Through Human-AI Communication in Workplace Health Contexts. Health Communication, 1–16. https://doi.org/10.1080/10410236.2026.2760914", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、職場の健康の文脈で、仕事のストレスを人よりAIに話したいという傾向を、人とAIのコミュニケーションを組み込んだO-S-R-O-Rモデルの拡張で扱った研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「仕事の悩みを、なぜ人ではなくAIに話したくなるのか」です。同僚や上司に話すと評価や人間関係が気になりますが、AIなら気兼ねなく話せるのかもしれません。心の健康の相談相手としてAIが選ばれる理由を、情報の受け止め方のモデルで説明しようとしている点が面白いところです。", "unverified": "抄録・本文を入手できず、調査の方法、対象、結果はすべて未確認。"}}, {"id": "jr45", "rank": 45, "headline": "ギグワーカーのアルゴリズム不安は技術ストレスに直結", "title": "ALGORITHMIC PRESSURE AMONG INDONESIAN GIG WORKERS IN THE CREATIVE INDUSTRY: THE EFFECT OF ALGORITHMIC ANXIETY ON SUBJECTIVE WELL-BEING THROUGH TECHNOSTRESS ON INSTAGRAM AND X", "url": "https://doi.org/10.70248/jmie.v4i1.4621", "authors": "Meyva Emiliana ほか", "venue": "Journal of Management and Innovation Entrepreneurship (JMIE)", "date": "2026-11-08", "apa": "Meyva Emiliana, Hafid Kholidi Hadi, & Diki Putra Setianto. (2026). ALGORITHMIC PRESSURE AMONG INDONESIAN GIG WORKERS IN THE CREATIVE INDUSTRY: THE EFFECT OF ALGORITHMIC ANXIETY ON SUBJECTIVE WELL-BEING THROUGH TECHNOSTRESS ON INSTAGRAM AND X. Journal of Management and Innovation Entrepreneurship (JMIE), 4(1), 91–109. https://doi.org/10.70248/jmie.v4i1.4621", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "SNSのアルゴリズムに仕事と収入を左右されるインドネシアの受注型アーティストで、アルゴリズムへの不安がテクノストレスを強く高めるが、主観的幸福感への影響は確認できないことを示した（抄録）。", "p3": "ストレスと対処の交流モデルにもとづき、InstagramとX（Twitter）で仕事を受けるアーティスト108人を目的抽出し、テクノストレスを媒介とするモデルをPLS-SEMで分析した（抄録）。", "p5": "アルゴリズム不安はテクノストレスに強い正の効果を持った（β=0.648、p<0.001）。一方、不安とテクノストレスの主観的幸福感への効果は直接・間接とも有意でなく（テクノストレス β=0.177、p=0.387）、幸福感の決定係数は0.018にとどまった（抄録）。", "fun": "SNSで絵の注文を受ける人にとって、表示の仕組み（アルゴリズム）がいつ変わるか分からないのは大きな不安です。この研究では、その不安はテクノロジーによるストレスを強めていましたが、生活全体の幸福感とのつながりは見えませんでした。仮説どおりにならなかった結果を正直に示した点が面白いところです。", "unverified": "本文を入手できず、測定尺度の詳細と、幸福感に関連しなかった理由についての著者の考察は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "空気リフト掘削の掘りくずの移動を縮約モデルで解析", "title": "Cuttings Migration Below the Gas-Injection Point in Air-Lift Reverse-Circulation Drilling: A Reduced-Order Model", "url": "https://doi.org/10.3390/pr14213602", "authors": "Pu Liu ほか", "venue": "Processes", "date": "2026-11-09", "citescore": 5.7, "citescore_year": "2025", "apa": "Liu, P., Xiao, J., Ge, C., Li, Y., & Zhang, R. (2026). Cuttings Migration Below the Gas-Injection Point in Air-Lift Reverse-Circulation Drilling: A Reduced-Order Model. Processes, 14(21), 3602. https://doi.org/10.3390/pr14213602", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "空気リフト逆循環掘削で、注気点より下の掘りくずの移動を、液体と固体の縮約モデルで定量化した（抄録）。", "p3": "固まった掘りくずを連続相として扱い、ドリルパイプの断面を半径方向の層に分けて液相の速度分布を表し、局所平衡のすべりの閉包を使う準定常の空間進行アルゴリズムで長距離の輸送を計算した。上部のガスリフト域は水圧の結合だけで表した（抄録）。", "p5": "層間の交換なしの仮定では、ガスなしの循環で壁近くに掘りくずが強く滞留すると予測された（著者はモデルに依存する保守的な推定とする）。半径方向10層の計算で、孔底から800 mでの注気は壁近くの移動高さを約13.8%増やした。600・700・800 mの比較では600 mで注気点に届く掘りくずの割合が最大だったが、8層と10層の予測の差（13.27 m）は解像度への感度が残ることを示した（抄録）。", "fun": "地下深く掘るときに出る削りくずを、空気の泡の力で地上へ運ぶ方法があります。この研究は、パイプの中を同心円の層に分けて流れを簡単に表すことで、長い距離のくずの動きを計算しました。どの高さから空気を入れるとよく運べるかを比べつつ、計算の細かさで答えが変わる不確かさも正直に示している点が面白いところです。", "unverified": "本文を入手できず、現場データとの比較の有無と、モデルの検証の方法は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "離散要素と有限要素の連成で耕うん具の摩耗を解析", "title": "Combined discrete-finite element modeling of abrasive wear in tillage tool elements", "url": "https://doi.org/10.26897/2687-1149-2026-5-4-14", "authors": "S.G. Mudarisov", "venue": "Agricultural Engineering", "date": "2026-11-09", "apa": "Mudarisov, S. G. (2026). Combined discrete-finite element modeling of abrasive wear in tillage tool elements. Agricultural Engineering, (5), 4–14. https://doi.org/10.26897/2687-1149-2026-5-4-14", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "耕うん具の土に触れる部分の摩耗を、離散要素法（DEM）と有限要素法（FEM）の連成で数値モデル化し、乾式のゴム車輪の砂摩耗試験の実験データで検証した（抄録）。", "p3": "ANSYS WorkbenchとRocky DEMで連成計算を行い、直径0.25 mmの球形の砂粒子をDEM（線形の履歴ばね接触）、鋼の試験片とゴム車輪をFEMで表した。アーチャードの摩耗則を経路の倍率（α=1000）で加速して実装し、法線荷重17〜100 Nで計算した（抄録）。", "p5": "摩耗量は荷重のべき乗則（Vm≈1.22N^1.2）で増え、100 Nでは7秒で328.5 mm³に達した。なじみ・定常・加速（85 N以上）の3段階の摩耗が現れ、50 N超ではゴム車輪の弾性変形により両側に極大を持つW字形の摩耗分布が生じた。連成法はDEM単独より摩耗予測の精度を15〜20%高めた（抄録）。", "fun": "畑を耕す農機の刃は、土の中の砂粒にこすられて少しずつすり減ります。この研究は、砂粒一つひとつの動きと、刃やゴムの変形を同時に計算することで、すり減り方を再現しました。荷重が大きくなると、すり減りの分布が真ん中ではなく両側が深い「W字」になるという、目で見ても面白い発見があります。", "unverified": "本文を入手できず、実験との一致の程度の具体的な数値は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "FDEMの境界接触は内部の要素分割に依存しないか", "title": "Interior-discretization invariance of physical-boundary contact in the two-dimensional combined finite-discrete element method", "url": "https://doi.org/10.1016/j.compgeo.2026.108809", "authors": "Zhibo Jia ほか", "venue": "Computers and Geotechnics", "date": "2026-11-08", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Jia, Z., Wang, Z., & Liu, Y. (2027). Interior-discretization invariance of physical-boundary contact in the two-dimensional combined finite-discrete element method. Computers and Geotechnics, 203, 108809. https://doi.org/10.1016/j.compgeo.2026.108809", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、2次元の有限要素・離散要素の連成法（FDEM）で、物理的な境界での接触の扱いが内部の要素分割に左右されない（不変である）ことを扱った研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「物体の中身を細かく区切るか粗く区切るかで、表面どうしのぶつかり方の計算が変わってしまわないか」です。岩が割れたり粒がぶつかったりする計算では、接触の扱いが結果を大きく左右します。計算の都合で決めた区切り方に結果が依存しないことを確かめる、地味だが大切な問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "せん断波速度から砂の液状化の確率を評価", "title": "New method for evaluating the probability of sand liquefaction based on shear wave velocity", "url": "https://doi.org/10.3724/1000-6915.jrme.2025.0866", "authors": "Jinyuan YUAN ほか", "venue": "Chinese Journal of Rock Mechanics and Engineering", "date": "2026-11-09", "citescore": 5.4, "citescore_year": "2025", "apa": "YUAN, J., LI, W., CHEN, L., LI, R., YUAN, X., CHEN, Z., & WU, X. (2026). New method for evaluating the probability of sand liquefaction based on shear wave velocity. Chinese Journal of Rock Mechanics and Engineering, 45(10), 3175–3184. https://doi.org/10.3724/1000-6915.jrme.2025.0866", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、地盤のせん断波速度にもとづいて、砂地盤が地震時に液状化する確率を評価する新しい方法を示した研究とみられる。掲載誌は中国の岩石力学・工学の学術誌である（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「地面を伝わる揺れの速さから、地震で砂の地盤が液体のようになる確率を見積もれるか」です。せん断波の速さは地盤の硬さを表し、比較的簡単に測れます。液状化を「起きる・起きない」の二択でなく確率で表そうとする点が面白いところです。", "unverified": "抄録・本文を入手できず、評価式、使用したデータ、結果はすべて未確認。"}}, {"id": "jr50", "rank": 50, "headline": "月面模擬の低重力で振動を加えた粒体流を検証", "title": "Vibration-assisted granular flow under simulated lunar conditions: parabolic flight validation of lunar regolith feed system", "url": "https://doi.org/10.1007/s44461-026-00021-y", "authors": "Anastasia Stepanova ほか", "venue": "Space and Planetary Resources", "date": "2026-11-09", "apa": "Stepanova, A., Dreyer, C., & Garvey, R. (2026). Vibration-assisted granular flow under simulated lunar conditions: parabolic flight validation of lunar regolith feed system. Space and Planetary Resources, 2(1). https://doi.org/10.1007/s44461-026-00021-y", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexで題名から見つけたResearch Squareの版の抄録を使用", "preprint": false, "short": true, "p1": "月面の低重力と真空を模した放物線飛行の実験で、ホッパーに上下の振動を加えると月の表土（レゴリス）の模擬材の流れが詰まらずに続くことを示した（抄録）。", "p3": "真空容器内の8つの並列な供給装置で、出口の直径11〜45 mm、ホッパーの角度46.5°〜90°の4つの形状について、43〜65 Hz・振幅0.2〜0.8 mmの振動を加え、60回の低重力の放物線飛行で計480回の実験を行った（抄録）。", "p5": "振動を加えている間は出口の形状によらず連続して排出され、振動を止めるとすべての構成で数秒以内に流れが止まり、再び振動を加えると人手なしに流れが戻った。回転式の供給装置で質量流量を0.3〜1.0 g/sの範囲で制御できた（抄録）。", "fun": "砂時計の砂は重力で落ちますが、重力が地球の6分の1しかない月では、砂のような粒は詰まって流れにくくなります。この実験では、飛行機を放物線を描くように飛ばして月の重力を再現し、容器を細かく揺らすだけで粒の流れが続くことを確かめました。止めると数秒で詰まり、揺らすとまた流れるという様子が面白いところです。", "unverified": "本文を入手できず、掲載版と抄録を取得した版の違いと、振動の条件ごとの流量の差は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "侵攻後に制裁対象者の金融アクセスが減少", "title": "A natural field experiment on the effectiveness of economic sanctions before and after the Russian invasion of Ukraine", "url": "https://doi.org/10.1038/s41562-026-02591-5", "authors": "Michael G. Findley ほか", "venue": "Nature Human Behaviour", "date": "2026-11-09", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "apa": "Findley, M. G., Nielson, D. L., & Sharman, J. C. (2026). A natural field experiment on the effectiveness of economic sanctions before and after the Russian invasion of Ukraine. Nature Human Behaviour. https://doi.org/10.1038/s41562-026-02591-5", "why": "制裁対象のロシア政府高官の名義（ミドルネームの頭文字を変更）と対照の名義で、202の国・地域の仲介業者にペーパーカンパニーの設立と法人口座の開設を依頼する計7,081通の電子メールを送る自然なフィールド実験を2回行った。2020年12月の第1回では両者に差がなかったが、ロシアのウクライナ侵攻後の2022年5月の第2回では制裁対象者の国際的な企業サービス・銀行へのアクセスが大きく減った。"}, {"id": "jn02", "rank": 2, "field": "地球科学", "headline": "地球の核の鉄の融点は低く、マントル最下部は固体", "title": "Melting and resistivity of iron at Earth core conditions using pulsed Joule heating", "url": "https://doi.org/10.1126/science.aeh5267", "authors": "Zachary M. Geballe ほか", "venue": "Science", "date": "2026-11-09", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Geballe, Z. M., Yang, J., Dobrosavljevic, V. V., Miozzi, F., Sime, N., Vitale, S. M., Driscoll, P. E., van Keken, P. E., Tappero, R., Liu, W., Chariton, S., Prakapenka, V. B., Meng, Y., & Walter, M. J. (2026). Melting and resistivity of iron at Earth core conditions using pulsed Joule heating. Science. https://doi.org/10.1126/science.aeh5267", "why": "ダイヤモンドアンビルセル内でのマイクロ秒のパルス通電加熱という新しい方法で、高圧下の鉄の融解と抵抗率を300回以上の再現性のある測定で調べた。融解曲線は予想外に緩やかで200 GPaで4160±80 Kとなり、液体鉄の抵抗率76 μΩ cmと合わせて、核–マントル境界が比較的低温（3430 K）で、内核の形成前から熱対流だけで地球磁場を維持できた可能性と、現在のマントル最下部が完全に固体であることを示した。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "米銀の脱炭素移行リスクへの露出は融資の0.5〜2%", "title": "U.S. Banks’ Exposures to Climate Transition Risks", "url": "https://doi.org/10.1017/s0022109026103226", "authors": "Hyeyoon Jung ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-09", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "apa": "Jung, H., Santos, J. A. C., & Seltzer, L. (2026). U.S. Banks’ Exposures to Climate Transition Risks. Journal of Financial and Quantitative Analysis, 1–29. https://doi.org/10.1017/s0022109026103226", "why": "気候政策の部門別の影響を一般均衡モデルから取り、融資の過去の債務不履行リスクと組み合わせて、銀行の移行リスクへの信用エクスポージャーを推定する新しい手法を提案した。最悪で融資ポートフォリオの14%に達するが、過去の返済構造を考慮すると0.5〜2%に下がり、排出量ではエクスポージャーのばらつきの最大60%しか説明できないことを示した。"}, {"id": "jn04", "rank": 4, "field": "心理学・認知科学", "headline": "数千試行の練習で運動記憶はどう育つか", "title": "Long-term development of a motor memory", "url": "https://doi.org/10.1038/s41562-026-02622-1", "authors": "David W. Franklin ほか", "venue": "Nature Human Behaviour", "date": "2026-11-09", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "apa": "Franklin, D. W., Nietschmann, P., & Franklin, S. (2026). Long-term development of a motor memory. Nature Human Behaviour. https://doi.org/10.1038/s41562-026-02622-1", "why": "通常は数百試行で調べられる運動適応の課題を、数週間にわたる数千試行の訓練で調べ、運動記憶の長期的な発達を追った。参加者は新しい力学をほぼ完全に補償し、保持と自発的回復が長期的に高まる一方、角度方向の汎化が狭まることを示し、運動記憶が課題に合わせて調整され続けることを示唆した。"}, {"id": "jn05", "rank": 5, "field": "機械学習", "headline": "硬さの差が大きい物体の微分可能シミュレーション", "title": "DiffPhD: A Unified Differentiable Solver for Projective Heterogeneous Materials in Elastodynamics with Contact-Rich GPU-Acceleration", "url": "https://doi.org/10.1145/3842497", "authors": "Shih-Yu Lai ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Lai, S.-Y., Tien, S.-H., Huang, J.-I., Tseng, Y.-C., Chiu, Y.-T., Luo, S., Zeng, Z., Shi, F., Chen, P. Y., Liu, T., Liu, Y.-L., & Chen, B.-Y. (2026). DiffPhD: A Unified Differentiable Solver for Projective Heterogeneous Materials in Elastodynamics with Contact-Rich GPU-Acceleration. ACM Transactions on Graphics, 45(6), 1–21. https://doi.org/10.1145/3842497", "why": "硬さの差が極端な異種材料・大変形の超弾性・接触の多い場面を、GPUで一体に扱う微分可能な射影ダイナミクスの解法DiffPhDを示した。勾配（随伴）を解析的に計算し、従来の微分可能ソルバより最大1桁速く、100倍の硬さの差でも収束を保つことで、系の同定や軌道最適化の適用範囲を広げた。"}, {"id": "jn06", "rank": 6, "field": "機械学習", "headline": "画素ごとに別の速さで雑音除去し画像生成を高速化", "title": "Inference-Time Pointwise Velocity for Diffusion Acceleration", "url": "https://doi.org/10.1145/3842513", "authors": "Itay Hazan ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Hazan, I., & Wolf, L. (2026). Inference-Time Pointwise Velocity for Diffusion Acceleration. ACM Transactions on Graphics, 45(6), 1–22. https://doi.org/10.1145/3842513", "why": "FLUXなど大規模な整流フロー型の画像生成で、すべての潜在座標を同じ時刻で進める代わりに、座標ごとに雑音除去の速さを割り当てる学習不要の手法ITPVを提案した。既存の時刻埋め込みと変調の重みを使い回し、構造が固まった領域を先に進めて生成を加速する。"}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "株主と競合の論理が衝突すると経営者は株主に従う", "title": "Business Responses to Competing Institutional Logics in the Climate Change Field: An Experiment", "url": "https://doi.org/10.1002/bse.71812", "authors": "Arijit Paul ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-09", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Paul, A., Danese, G., & Baumgartner, R. J. (2026). Business Responses to Competing Institutional Logics in the Climate Change Field: An Experiment. Business Strategy and the Environment. https://doi.org/10.1002/bse.71812", "why": "気候変動の分野で短期利益を求める市場の論理と排出削減を求める環境の論理が競合する状況を、石油・ガス企業の経営者の投資額を予想させるビネット実験で検証した。環境の論理は排出削減投資の予想を一貫して高め、株主と競合他社の論理が食い違うと経営者は株主に従うと予想されることを示した。"}, {"id": "jn08", "rank": 8, "field": "機械学習", "headline": "3Dメッシュを言語モデルの系列内で理解・生成", "title": "EVA01: Unified Native 3D Understanding and Generation via Mixture-of-Transformers", "url": "https://doi.org/10.1145/3842532", "authors": "Zongyuan Yang ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Yang, Z., Yi, M., Ma, W., Fan, C., Li, B., Liu, B., Lou, Y., Song, Y., Xiong, Y., Guo, Z., & Wang, S. (2026). EVA01: Unified Native 3D Understanding and Generation via Mixture-of-Transformers. ACM Transactions on Graphics, 45(6), 1–24. https://doi.org/10.1145/3842532", "why": "3Dメッシュを2D画像を経由せず多モーダル大規模言語モデルの系列の中で直接トークンとして扱い、理解・生成・文脈に応じた編集を1つのモデルで行うEVA01を、トランスフォーマーの混合（Mixture-of-Transformers）の構成で提案した。"}, {"id": "jn09", "rank": 9, "field": "機械学習", "headline": "多尺度の潜在表現で画像から効率よく3D生成", "title": "Hierarchical Structured Latents for Efficient 3D Generation", "url": "https://doi.org/10.1145/3842496", "authors": "Yuxuan Xiong ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Xiong, Y., Dou, Y., Shi, R., Wang, T., Zhang, C., & Ni, B. (2026). Hierarchical Structured Latents for Efficient 3D Generation. ACM Transactions on Graphics, 45(6), 1–13. https://doi.org/10.1145/3842496", "why": "1枚の画像から3D形状を作る生成で、局所的な形状の複雑さに応じて表現力を配分する多尺度の潜在表現と、空間の排他性と網羅性を構成的に保証する八分木の再パラメータ化を提案し、構造の生成と細部の合成を2段階に分けた。"}, {"id": "jn10", "rank": 10, "field": "因果推論", "headline": "介入データで決まらない個人の因果効果の鋭い範囲", "title": "Coupling-Aware Counterfactual Reasoning for Causal Artificial Intelligence: Identification, Learnability Limits, and Sharp Bounds with Finite-Sample Inference", "url": "https://doi.org/10.58496/bjai/2026/013", "authors": "Jordi Vallverdú", "venue": "Babylonian Journal of Artificial Intelligence", "date": "2026-11-08", "sjr": 1.451, "citescore": 10.7, "citescore_year": "2025", "apa": "Vallverdú, J. (2026). Coupling-Aware Counterfactual Reasoning for Causal Artificial Intelligence: Identification, Learnability Limits, and Sharp Bounds with Finite-Sample Inference. Babylonian Journal of Artificial Intelligence, 2026, 77–97. https://doi.org/10.58496/bjai/2026/013", "why": "便益の確率や因果の確率は潜在的結果の同時分布に依存し、介入データだけでは決まらないことを踏まえ、観察データと実験データを組み合わせたときに可能な同時分布を特徴づけた。線形計画で鋭い識別区間を計算し、有限標本での被覆を持つ信頼区間を付ける「結合の監査」を提案した。"}, {"id": "jn11", "rank": 11, "field": "機械学習", "headline": "少ない画像から一度で高精度のメッシュを再構成", "title": "MeRM: Large Mesh Reconstruction Model via Neural Geometry Tokens", "url": "https://doi.org/10.1145/3842581", "authors": "Kai Ye ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-09", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Ye, K., Wang, H., Shi, Z., Liang, D., Cao, Y.-P., Chen, W., & Chen, B. (2026). MeRM: Large Mesh Reconstruction Model via Neural Geometry Tokens. ACM Transactions on Graphics, 45(6), 1–16. https://doi.org/10.1145/3842581", "why": "疎なRGB画像から表面メッシュを一度の推論で再構成する大規模モデルMeRMを提案した。2D入力と3D表面の構造的な不整合を学習の障害と特定し、ニューラル幾何トークンでこれを解消した。"}, {"id": "jn12", "rank": 12, "field": "心理学・認知科学", "headline": "大学教育のプロンプト・手がかり・ナッジの効果", "title": "Prompts, cues, and nudges interventions in higher education: a systematic review", "url": "https://doi.org/10.1186/s41239-026-00636-3", "authors": "Sabina Rako ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-11-08", "sjr": 7.947, "
