o. 36003). National Bureau of Economic Research. https://www.nber.org/papers/w36003", "why": "中国の大手EC基盤が2024年に業務ソフトへ生成AIを組み込んだ事例で、企業ごとのAI利用記録と月次の販売を結び、マッチングした差の差分析と操作変数で効果を推定した。年商500万元未満の企業では採用により月次売上が51.6%増え、主に注文数の47.0%増によることを示し、AIを共有の事業基盤として提供したときの成果の行き先を実証した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用（本文は入手できず）", "preprint": true, "p1": "中国の大手EC基盤が業務ソフトに組み込んだ生成AIを採用した年商500万元未満の出店企業で、月次売上が51.6%増え、その多くが注文数の47.0%増によることを、企業ごとのAI利用記録と販売データで示した（抄録）。", "p2": "生成AIは個々の作業の成果を高めるが、それが企業の成長につながるのか、どの企業に恩恵が及ぶのかは分かっていなかった（抄録）。", "p3": "2024年に、中央で開発したモデルと基盤全体のデータで既製のアプリを全企業に届ける生成AIを、企業が事業運営に使う業務ソフトに組み込んだ事例を分析した。各企業のAI利用の完全な記録を月次の運営・販売と結び、採用→顧客への到達や新商品の投入など事業能力の変化→売上の成長という経路をたどった（抄録）。", "p4": "年商500万元未満の企業に絞り、マッチングした差の差分析で採用の効果を推定し、操作変数による推定で確かめた。仕組みとして、定型作業の費用と情報の摩擦の2つを、事前の費用比率や需要の予測しにくさによる効果の違いで検証した（抄録）。", "p5": "採用で月次売上は51.6%、注文数は47.0%増えた。採用企業はより多くの顧客に届き、品揃えの更新が速く、商品とサービスの質も高まり、最も小さい企業で比例的な効果が最大だった。事前の費用比率が高い企業と、需要が予測しにくい市場で効果が大きく、情報の摩擦が大きいカテゴリーでは既存企業の売上・新規参入・新商品が増え、AIは非採用企業から売上を奪うのではなく市場を広げていた（抄録）。", "p6": "抄録には限界の記述がない。解釈：採用は企業の選択であり、マッチングと操作変数で選択の偏りをどこまで除けているか、1つの基盤の事例が他の市場に一般化できるかは抄録からは判断できない。", "fun": "AIは一人ひとりの仕事を速くしますが、それで会社の売上まで伸びるのでしょうか。中国の大きな通販の場で、出店している小さな店が商品説明づくりなどにAIを使い始めると、売上が5割以上増えました。しかも他の店から客を奪ったのではなく、市場全体が広がっていたという点が面白いところです。", "unverified": "本文を入手できず、操作変数の内容、マッチングの方法、推定の信頼区間は未確認。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "開発経済学のRCTの有意な結果の約3割は偽発見", "title": "(In)Credible Development RCTs: False Discoveries, Low Power, and a Solution", "url": "https://doi.org/10.3386/w35999", "authors": "Qingyuan Chai ほか", "venue": "NBER Working Paper", "apa": "Chai, Q., Lang, K., & Zhong, L. (2026). (In)Credible Development RCTs: False Discoveries, Low Power, and a Solution (NBER Working Paper No. 35999). National Bureau of Economic Research. https://www.nber.org/papers/w35999", "why": "主要誌190本の745の主要な検定を集め、出版の選択を考慮した経験ベイズの混合モデルで、開発経済学の無作為化比較試験の検出力と偽発見率を推定した。公表された棄却の約30%が偽発見で、平均の方向性検出力は40%にとどまると推定し、追試への資源配分の最適化も示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用（本文は入手できず）", "preprint": true, "p1": "開発経済学の無作為化比較試験（RCT）の統計的な信頼性を調べ、公表された有意な結果の約30%が偽発見で、平均の検出力は40%にとどまると推定し、限られた予算での最適な追試の方針を示した（抄録）。", "p2": "RCTは開発経済学の信頼できる証拠とされるが、検出力が十分か、公表された有意な結果のうちどれだけが偽発見かは明らかでなかった（抄録）。", "p3": "主要な経済学誌の190本の論文から745の主要な仮説検定を集め、t統計量の分布を、検出力80%のときに期待される2.8という基準と比べた。出版の選択を考慮した経験ベイズの混合モデルで偽発見率を推定し、資金提供者が固定予算と証拠の基準のもとで追試をどう配分すべきかを理論的に導いた（抄録）。", "p4": "偽発見率、方向性の検出力、標本を倍にした場合や有意水準を0.005に下げた場合の偽発見率の変化、追試による全体の偽発見率の低下を評価した（抄録）。", "p5": "実際のt統計量は2.8を大きく下回る位置に山があり（ただしpハッキングを示す値よりは上）、多くのRCTは検出力が不足していた。公表された棄却の約30%が偽発見で、通常の有意水準ちょうどでは偽発見の事後確率は66%に達した。標本を倍にすると平均の偽発見率は5ポイント下がり、有意水準を0.005にするとより大きく下がるが発見の総数は減った。最適な追試は中程度のt統計量の研究に集中し、追試の成功で全体の偽発見率は1.8〜7.8%に下がった（抄録）。", "p6": "抄録には限界の記述がない。解釈：推定は出版選択のモデルの仮定に依存し、「主要な仮説」の選び方も結果に影響しうるが、抄録からは確認できない。", "fun": "「統計的に有意」という結果は、偶然でも5%は出てしまいます。この研究は、途上国支援の効果を確かめた実験論文190本を調べ、実験の規模が小さすぎるものが多く、公表された「効果あり」の約3割は偶然の可能性が高いと推定しました。すべてを追試する余裕はないので、どの研究を確かめ直すべきかまで数学的に示した点が面白いところです。", "unverified": "本文を入手できず、経験ベイズのモデルの詳細と、追試の方針の計算の前提は未確認。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "経済学論文の約半数でコードと本文に重大な食い違い", "title": "Code-Paper Consistency in Economics and Finance", "url": "https://doi.org/10.2139/ssrn.7681378", "authors": "Christoph Huber ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Huber, C., Seidel, P. F. A., Seyfi, S., & Vihriälä, E. (2026). Code-Paper Consistency in Economics and Finance. https://doi.org/10.2139/ssrn.7681378", "why": "主要な経済学・ファイナンス誌の1,820本について、LLMを使った構造化手順で論文の記述と分析コードの不一致を点検した。結論に至った主張の10%に不一致があり、論文の49%（頑健性の確認で37〜56%）が中心的な結果に関わる重大な不一致の可能性を含むと報告した。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "主要な経済学・ファイナンス誌の1,820本について、分析コードが本文に書かれた分析を実装しているかをLLMを使った構造化された手順で点検し、半数近くの論文が中心的な結果に関わる重大な食い違いを含む可能性を示した（抄録）。", "p2": "多くの学術誌はデータとコードの公開を求めているが、コードが論文の記述どおりの分析をしているか（コードと論文の整合性）は体系的に確かめられていなかった（抄録）。", "p3": "論文の中の「実施した分析についての記述（主張）」を一つずつ取り出し、対応する分析コードと照合して、食い違いがあるかをLLMで判定する構造化された手順を開発した（抄録）。", "p4": "結論に至った主張のうち食い違いの割合、中心的な結果に関わる重大な食い違いを少なくとも1つ含む論文の割合、頑健性の確認によるその幅、食い違いの解消が結果を変えるか（予備的な分析）、研究過程・誌・分野・年による違いを評価した（抄録）。", "p5": "結論に至った主張の10%に食い違いがあり、論文の49%（頑健性の確認で37〜56%）が中心的な結果に関わる重大な食い違いの可能性を少なくとも1つ含んでいた。予備的な分析では、食い違いを解消すると無視できない割合で報告された結果が大きく変わった。食い違いの率は標本の規則・パラメータの値・変数の定義に関する主張で最も高く、誌・分野・年を問わず見られた（抄録）。", "p6": "抄録には限界の記述がない。解釈：LLMの判定の誤り（偽陽性）の割合、人による確認の範囲、「重大」の判定基準は抄録からは分からず、49%は「可能性」を含む割合である点に注意が要る。", "fun": "論文に「この方法で分析した」と書いてあっても、実際のプログラムがその通りになっているとは限りません。この研究はAIに1,820本の論文とプログラムを読み比べさせ、半数近くの論文に、中心的な結果に関わりうる食い違いがあることを見つけました。人間には手の回らない「答え合わせ」をAIが担うという発想が面白いところです。", "unverified": "本文を入手できず、使ったLLMと手順、LLMの判定の精度の検証、結果が変わった事例の割合は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "最貧層への的絞りは援助の効く世帯を見逃す", "title": "Target What? The Foundations of Poverty Targeting", "url": "https://doi.org/10.3386/w35984", "authors": "Rema Hanna ほか", "venue": "NBER Working Paper", "apa": "Hanna, R., Breza, E., Olken, B. A., Banerjee, A., Chandrasekhar, A. G., & Moore, G. (2026). Target What? The Foundations of Poverty Targeting (NBER Working Paper No. 35984). National Bureau of Economic Research. https://www.nber.org/papers/w35984", "why": "インドネシアの600村で5,500人超の住民に他の住民の暮らし向きと少額の給付の効き目を順位づけてもらい、消費額や自己評価と比べた。消費で対象を選ぶと、追加の1ドルの社会的価値が最も高い世帯の77%を見逃すことを示し、貧困の的絞りの前提を問い直した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用（本文は入手できず）", "preprint": true, "p1": "インドネシアの600村で、住民が「少額の現金給付で最も助かる」と考える世帯は消費額が最も低い世帯とは大きく異なり、どの基準で給付の対象を選ぶかには価値判断が避けられず含まれることを示した（抄録）。", "p2": "多くの給付制度は貧困層を対象にするが、それは消費が最も低い世帯が追加の1ドルから最も大きな社会的厚生を得る（限界的な社会的価値が最も高い）という暗黙の仮定に立っており、この仮定が正しいとは限らない（抄録）。", "p3": "5,500人超の住民に、他の住民の暮らし向きと、少額の現金給付がどれだけ助けになるかを順位づけてもらい、それを消費額や本人の自己評価の厚生と比べた。さらに無作為化比較試験で、代理資力調査、手間をかけさせる自己選択（オーディール）、地域の住民による選定の3つの選び方を比べた（抄録）。", "p4": "各基準で対象を選んだとき住民が評価した限界的な社会的価値が最も高い世帯をどれだけ見逃すか、各選び方がどの基準に最も近い世帯を選ぶかを評価した（抄録）。", "p5": "消費で選ぶと限界的な社会的価値が最も高い世帯の77%を、自己評価の厚生で選ぶと57%を見逃し、地域が暮らし向きの水準で最も悪いとした世帯を選んでも25%を見逃した。基準どうしの食い違いは統計的に予測できた。試験では代理資力調査は消費、自己選択は自己評価の厚生、地域による選定は限界的な社会的価値に最も近い世帯を選んだ（抄録）。", "p6": "抄録には限界の記述がない。解釈：住民の順位づけが示す社会的価値は地域の規範を反映しており、それを政策の基準とするかどうか自体が価値判断であることを著者も示唆している（抄録）。", "fun": "援助は「一番貧しい人」に届けるべきだと考えがちです。でも村の人に「このお金で一番助かるのは誰？」と聞くと、収入や支出が一番少ない人とはかなり違う答えが返ってきました。困っている度合いと、少しのお金で暮らしが良くなる度合いは別物なのです。どんな基準で選んでも「誰を助けるべきか」という価値観が入ってしまうという点が面白いところです。", "unverified": "本文を入手できず、順位づけの方法の詳細と、試験の規模・各方法の効果の数値は未確認。"}}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "演劇型の研修で警察官の性暴力への対応が改善", "title": "Debiasing Law Enforcement Officers: Evidence from an Expressive Arts Intervention in India", "url": "https://doi.org/10.3386/w35986", "authors": "Sofia Amaral ほか", "venue": "NBER Working Paper", "apa": "Amaral, S., Borker, G., Prakash, N., & Sviatschi, M. M. (2026). Debiasing Law Enforcement Officers: Evidence from an Expressive Arts Intervention in India (NBER Working Paper No. 35986). National Bureau of Economic Research. https://www.nber.org/papers/w35986", "why": "インドのビハール州警察と417署・約2,500人の現職の警察官を対象にクラスター無作為化試験を行い、被抑圧者の演劇にもとづく3日間の研修を評価した。約7か月後に性暴力への態度・共感・法知識が改善し、1年後の標準化された被害者役の監査でも実際の対応の変化が観察された。", "explain": {"basis": "本文", "basis_note": "ifoの公開版PDFの本文（抄録・序論・結論）を読んだ。結果の節の表と付録は読んでいない", "preprint": true, "p1": "インド・ビハール州の警察で、被抑圧者の演劇にもとづく3日間の表現芸術の研修を現職の幹部警察官に行うと、性暴力（GBV）への態度・共感・法知識が改善し、実際の被害者への対応も良くなることを、417署のクラスター無作為化試験で示した（抄録、結論）。", "p2": "現場の公務員の裁量は市民のサービスへのアクセスを左右するが、在職中の官僚の態度や信念を変えられるかは分かっていなかった。性暴力の被害者への軽視や非難は届出を減らし、女性の採用枠などの人の入替えに頼る改革には限界がある（序論）。", "p3": "18か月の質的な現地調査をもとに、ボアールの被抑圧者の演劇を警察に適用した研修を作り、幹部が被害者と対応する警官の両方の立場をロールプレイで体験し、集団で振り返って署の実践を約束する。個人の態度と職場の規範の2つの経路を仮定した（序論）。", "p4": "12県の417署・約2,500人の幹部をクラスター単位で無作為に割り付け、調査とビネットによる態度・知識、覆面の被害者役が署を訪れて対応を記録する監査（約1年後）、約50万件の行政記録、若手の女性巡査への秘密の調査で評価し、警官の異動による変動で持続と波及を調べた（序論）。", "p5": "約7か月後、処置群の警官はGBVへの態度が改善し、共感と法知識が高まった。約1年後の監査では処置群の署の警官は被害者を責める確率が15ポイント低く、訴えの却下が減り紹介が増えた。行政記録では登録の遅れが41%減り、長期的には市民のGBVの届出が増えた。異動の分析は効果の持続と同僚への波及を示唆し、処置群の幹部と働く若手の女性巡査は嫌がらせと不安が少ないと報告した（抄録）。", "p6": "著者は、異動を使った持続と波及の証拠を「示唆的」と述べる（抄録）。解釈：届出の増加は対応の改善が信頼を回復した結果と解釈されているが（結論）、研修の費用対効果や他の州への一般化は本解説の範囲では確認できていない。", "fun": "警察官の思い込みは研修で変えられるのでしょうか。インドの州警察で、幹部の警察官が被害者の立場を演じる3日間の演劇の研修を受けると、1年後に覆面の「被害者役」が訪れたときの対応まで良くなりました。被害者を責める態度が減り、事件の登録も早くなったのです。人を入れ替えるのではなく、今いる人の見方を変える方法として面白いところです。", "unverified": "結果の節（p.12以降）の表の推定値と信頼区間、付録の測定項目は読んでおらず、数値は抄録と結論の範囲で確認した。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "ネットワーク干渉下の因果推論の最適設計と推定量", "title": "Minimax designs and estimators for causal inference under network interference", "url": "https://arxiv.org/abs/2611.08560", "authors": "Vishesh Karwa ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Karwa, V., & Airoldi, E. M. (2026). Minimax designs and estimators for causal inference under network interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08560", "why": "処置が他者にも波及する干渉のもとで、線形の因果推定対象に対する設計ベースのミニマックス理論を構築した。推定量の最適化、設計と推定量の同時最適化など3つの問題でミニマックスリスクを調べ、干渉を潜在的結果の同時抽出の制約として超グラフで表した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、干渉なしの平均処置効果の節、考察）を読んだ。証明と個別の干渉構造の節の大半は読んでいない", "preprint": true, "p1": "ネットワーク干渉（ある人の処置が他人の結果にも影響する状況）のもとでの線形の因果推定について、設計を固定した場合・制限した場合・自由にした場合の3つの問題のミニマックスリスク（最悪の場合の誤差の最小値）を、すべての推定量と不偏推定量のそれぞれで特徴づける設計ベースの理論を作った（抄録、§1）。", "p2": "干渉がある実験の研究の多くは、特定の設計と推定量の組（例：ホルヴィッツ・トンプソン推定量）の誤差を評価するにとどまり、推定量や設計を変えれば誤差をさらに減らせるのかを判断する一般理論がなかった（§1）。", "p3": "露出写像で各人の潜在的結果をd_i個に縮約し、計Σd_i個の潜在的結果からなる「拡大した有限母集団」からの制約つき抽出として因果推論を表す。頂点を潜在的結果、超辺を実行可能な割当てで同時に観測できる最大の集合とする抽出超グラフを作り、設計がその超辺に確率の重みを与える（§1、§3）。同時に欠ける潜在的結果の組が下界を決め、全推定量では同時欠測の確率が、不偏推定量ではそのオッズが効く（抄録）。", "p4": "一様に有界な潜在的結果の表に対する最悪の場合の設計ベースのリスク（無作為化に関する平均二乗誤差）を基準に、干渉なしの平均処置効果、部分干渉の飽和設計、近隣干渉の総効果・直接効果・複雑な伝染の対比、二部グラフ干渉の用量反応の対比で上界と下界を比べた（抄録、§6〜9）。", "p5": "干渉なしの平均処置効果では、全設計でのミニマックスリスクは不偏推定量で4/n、全推定量で(4+o(1))/nで、不偏性に1次の定数まで代価がなく、確率1/2のベルヌーイ割当てとホルヴィッツ・トンプソン推定量で達成された（定理6.1.1）。ランダム化飽和設計では推定量を変えるだけで収束の速さが1/ξから1/nに改善し、中心-周辺型では不偏性の代価が最大√nのオーダーになった（§10）。いくつかの設定で上界と下界が一致した（抄録）。", "p6": "著者は、不偏性に収束の速さの代価がないのはいつかの特徴づけと、複数の推定対象に同時に最適な推定戦略があるかを未解決の問題に挙げる（§10）。解釈：露出写像が正しく特定されていることが前提で、誤特定への頑健性はこの枠組みの外にある（抄録）。", "fun": "ワクチンを打った人が増えると、打っていない隣の人もうつりにくくなるように、ある人への「処置」が周りの人にも影響することがあります。そんな状況で効果を正確に測るには、実験の割り振り方と計算の方法をどう選べばよいのでしょう。この研究は「同時に見ることのできない結果の組合せ」を図にして、どんなに工夫しても越えられない誤差の下限を示しました。実験の限界を数学で見通す点が面白いところです。", "unverified": "定理の証明と、近隣干渉・二部グラフ干渉の各節の具体的な上界・下界の式は読んでいない。"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "AIエージェントへの介入の価値を因果推論で評価", "title": "Knowing When to Intervene: Causal Evaluation of AI Agents", "url": "https://arxiv.org/abs/2611.09792", "authors": "Ayush Sawarni ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Sawarni, A., Xing, W., Zrnic, T., Johari, R., & Syrgkanis, V. (2026). Knowing When to Intervene: Causal Evaluation of AI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09792", "why": "エージェントの行動の途中で検証や軌道修正の介入をすべきかを、最終結果への因果効果として評価する枠組みを提案した。介入の効果が文脈と将来の行動に依存する動的な問題を扱い、静的なベンチマークでは分からない運用時の介入の価値を推定できるようにした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験計画・推定対象・識別と推定・3つの実験・限界の節と表1）を読んだ", "preprint": true, "p1": "AIエージェントの実行途中で、ツール呼出しの審査などの介入をするかを毎回無作為に割り付ける実験計画と、介入の因果効果を推定する方法を示し、3つのベンチマークでどの場面の介入が成果を高めるか（または害になるか）を推定した（§2〜3）。", "p2": "エージェントの評価は静的なベンチマークの得点が中心で、運用時にどの時点で人や別のモデルが確認・修正すべきかの価値は分からない。介入の効果は文脈と後の行動に依存するため、動的な因果推論の問題になる（§1、抄録）。", "p3": "エージェントを内部の見えない箱とし、事前に決めた介入可能な時点ごとに、介入（例：提案されたツール呼出しを実行前に審査）と対照（直接実行）を確率1/2で割り付ける。同じ軌跡群から、その時点だけ介入しその後は無作為のままの効果、その後は介入しない場合の効果、履歴に応じた介入方策の利得の3つを、交差適合のAIPW推定量と構造的入れ子平均モデル（SNMM）のg推定で求める（§2）。", "p4": "τ-bench RetailとToolSandboxではGPT-5 nanoとClaude Haiku 5.5のツール呼出しをGPT-6 Lunaが審査する効果を、ImpossibleBench（Qwen3.5 Flash）では失敗後の敵対的なフィードバックが規則違反を増やす効果を、ツールの種類や課題の進み具合などの集団ごとに95%信頼区間で推定した（§3）。", "p5": "τ-bench RetailのGPT-5 nanoでは読み・書きの両方の呼出しで審査の効果が正で、注文の取消しや商品の変更では信頼区間が0を上回った（図3）。ImpossibleBenchでは、残り1回の試行での敵対的なフィードバックは違反を9.4pt（95%CI 2.9〜15.9）増やし、1回目の失敗後の3.3ptより大きく、テストの8割以上が通るときは5.7pt、半分未満では0.3ptだった（§3.3）。SNMMによる方策の利得の推定は、計算量の大きいモンテカルロのシミュレーションとよく合った（§3）。", "p6": "著者は、SNMMによる推定がブリップ効果のパラメトリックなモデルの仮定に依存すること、多くの集団の比較を点ごとの区間で示していること、比較的小さなモデルと既存のベンチマークでの評価にとどまることを挙げる（§4）。解釈：効果は審査役のモデルの質にも依存しうる。", "fun": "AIに仕事を任せるとき、途中で人がチェックを入れると助かる場面と、無駄な場面があります。この研究は、チェックするかしないかをサイコロで決めながらAIを何度も動かし、どの場面のチェックが最終的な成功を増やすかを統計的に推定しました。逆に、追い詰められた場面ほどAIが悪い指示に流されやすいことも見つけた点が面白いところです。", "unverified": "ToolSandboxの結果の数値と、付録の推定式・特徴量の詳細は読んでいない。"}}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "総額表示の義務化で民泊の価格はむしろ4.8%上昇", "title": "Clearing the Fog: Price Transparency, Market Churn, and Consumer Welfare in Short-Term Rentals", "url": "https://doi.org/10.3386/w35989", "authors": "Ginger Zhe Jin ほか", "venue": "NBER Working Paper", "apa": "Jin, G. Z., Wagman, L., & Xing, J. (2026). Clearing the Fog: Price Transparency, Market Churn, and Consumer Welfare in Short-Term Rentals (NBER Working Paper No. 35989). National Bureau of Economic Research. https://www.nber.org/papers/w35989", "why": "2024年7月にカリフォルニア州で手数料込みの総額表示を義務化した法律の効果を、他都市と比べる粗い完全一致マッチングで調べた。客の価格感応度は高まったのに平均宿泊価格は4.8%上がり、清掃料に頼る物件の退出など市場の入れ替わりが起き、隠れた手数料による「厚生の錯覚」が解消されたことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefで題名から見つけたSSRN版の抄録を使用（本文は入手できず）", "preprint": true, "p1": "カリフォルニア州が2024年7月から民泊などに手数料込みの総額表示を義務づけた法律（AB 537）で、客は価格に敏感になったのに平均の宿泊料は4.8%上がり、市場の入れ替わりを通じて実際の消費者余剰は増えたことを示した（抄録）。", "p2": "標準的な理論では価格の透明化は価格を下げると予測されるが、清掃料などの手数料が後から加わる市場で総額表示を義務づけると、価格・参入退出・厚生に実際にどんな影響があるかは分かっていなかった（抄録）。", "p3": "サンディエゴとサンフランシスコのAirbnbの物件を処置群、シアトルとシカゴの物件を対照群とし、粗い完全一致マッチング（CEM）で比べた。さらに離散選択モデルによる厚生の分析で、隠れた手数料による「厚生の錯覚」と実際の消費者余剰を推計した（抄録）。", "p4": "評価したのは、客の価格感応度、平均の宿泊料、物件の退出と参入、退出・残留・参入した物件の手数料と質、消費者余剰と、その郵便番号区域ごとの分布（抄録）。", "p5": "総額表示で客は対照都市より価格に敏感になったが、平均の宿泊料は4.8%上がった。処置都市では退出と参入が増え、清掃料の収入に頼る物件が不釣り合いに多く退出し、質の高い物件ほど残り、新規参入者は既存の物件より手数料も質も低かった。法律は隠れた手数料による大きな「厚生の錯覚」を取り除き、主に市場の入れ替わりを通じて実際の消費者余剰を高めた。価格の上昇を差し引いた純便益は平均で正だったが、郵便番号区域の間で偏っていた（抄録）。", "p6": "抄録には限界の記述がない。解釈：対照都市との比較に頼るため、同時期の都市ごとの規制や需要の変化をどこまで除けたかは抄録からは判断できない。", "fun": "宿泊サイトで「1泊1万円」と思って予約に進むと、最後に清掃料が加わって高くなる——そんな表示を禁じて、最初から総額を見せる法律ができました。すると客は値段をよく比べるようになったのに、平均の宿泊料はむしろ上がりました。清掃料に頼る物件が去り、質の良い物件が残ったからです。透明にすると安くなるとは限らないという点が面白いところです。", "unverified": "本文を入手できず、マッチングの具体的な手順、厚生の推計の数値、効果の信頼区間は未確認。"}}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "新しい共同制作者と組むとアイデアの新しさが増す", "title": "What Do You Bring to the Table? New Teams and New Ideas", "url": "https://doi.org/10.2139/ssrn.7681467", "authors": "William Arbour", "venue": "SSRN", "date": "2026-11-09", "apa": "Arbour, W. (2026). What Do You Bring to the Table? New Teams and New Ideas. https://doi.org/10.2139/ssrn.7681467", "why": "ボードゲームのデザイナーと作品の仕組みの記録を使い、チームに新しい人が加わると創造性がどう変わるかを調べた。なじみの相手から全く新しい相手に移ると、デザイナーにとって新しい仕組みの割合が16.2ポイント増え、共同作業で得たアイデアは5年後も11.8ポイント多く使い続けられていた。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "ボードゲームのデザイナーが新しい共同制作者と組むと、作品に自分にとって新しい仕組みが増え、共同作業で得たアイデアがその後も残ることを、デザイナーと作品の仕組みの記録で示した（抄録）。", "p2": "チームに新しい人が加わると創造性がどう変わるのかは重要な問いだが、誰がどんなアイデアを持ち込んだかを観察するのは難しかった（抄録）。", "p3": "ボードゲームでは、デザイナーと、各作品が使うゲームの仕組み（メカニクス）がともに記録されている点を利用し、同じデザイナーの経歴の中で、なじみの相手と組んだ作品と、まったく新しい相手と組んだ作品を比べた。新しい相手が経験者か初心者かでも分けた（抄録）。", "p4": "評価は、作品の仕組みのうちそのデザイナーにとって新しいものの割合、その新しさが相手の過去の経験から来たものかチームの記録された経験を超えるものか、5年後に元の相手なしでその仕組みを再び使う確率（抄録）。", "p5": "なじみの相手からまったく新しい相手に移ると、デザイナーにとって新しい仕組みの割合が16.2ポイント増えた。経験のある新しい相手では新しさの多くが相手の使ったことのある仕組みで、初めての相手ではチームの記録された経験を超えていた。共同作業で交換したアイデアは残り、5年後にデザイナーが元の相手なしでそれを再び使う確率は11.8ポイント高かった（抄録）。", "p6": "抄録には限界の記述がない。解釈：新しい相手と組むかどうかはデザイナーの選択であり、抄録の「関連する」という表現どおり因果効果とは限らない。ボードゲーム以外の創作や職場のチームへの一般化も未確認。", "fun": "新しいメンバーがチームに入ると、アイデアは新しくなるのでしょうか。ボードゲームは作者の名前と「サイコロを振る」「カードを集める」といった仕組みが全部記録されているので、それを確かめるのにぴったりでした。新しい相手と組むと新しい仕組みが増え、教わった仕組みは5年後も使われ続けていました。遊びの記録から創造性の謎に迫る点が面白いところです。", "unverified": "本文を入手できず、データの出所と規模、推定の方法と統制の内容は未確認。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "標本分割なしで高次元のオフ方策評価を行う", "title": "High-Dimensional Off-Policy Evaluation without Sample Splitting using an Onsager Correction", "url": "https://arxiv.org/abs/2611.08794", "authors": "Saksham Jain ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Jain, S., Braun, G., & Imaizumi, M. (2026). High-Dimensional Off-Policy Evaluation without Sample Splitting using an Onsager Correction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08794", "why": "文脈の次元と標本数が比例して増える高次元の状況では、検証用データでの報酬モデルの選択が最適でなくなりうることを示した。オンサガー補正を加えた基準で、全データで学習したモデルの標本外リスクを学習データだけから推定し、標本分割なしの早期打ち切りを可能にした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論・手法・理論の主定理の記述・実験・考察の節）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "文脈の次元と標本数が比例して大きい高次元の状況で、報酬モデルを全データで学習しながら、その標本外のリスクを学習データだけから一致推定するオンサガー補正つきの基準を作り、標本分割なしのモデル選択（早期打ち切り）とオフ方策評価を可能にした（抄録、§1）。", "p2": "オフ方策評価では報酬モデルを検証データで選んでから全データで学び直すことが多いが、比例的な高次元では検証で測る少ないデータのモデルのリスクと全データのモデルのリスクが一致せず、選択が最適でなくなりうる。同じデータで学習・評価する二重頑健推定量も一致性を失いうる（§1）。", "p3": "全バッチの勾配降下で学習するニューラルネットの各訓練観測について、その観測自身が重みの更新に与えた影響（自己相互作用）を、一般化一次法の状態発展の理論にもとづくオンサガー項で隠れ状態から取り除く（式5）。補正した予測で目標方策の重みつきの残差を計算して停止の反復を選び（式6〜7）、同じ補正で調整した直接推定量と二重頑健推定量（ADR）を作る（§3）。", "p4": "ガウス文脈・単一指標の報酬・既知のログ方策・固定の深さと幅のネットワークの条件で一致性を証明し（定理4.1）、2本腕のガウス・バンディット（d=128〜2048、標本数2d、次元ごとに200データセット）で、リスクの推定誤差、選択の後悔、方策価値の推定のバイアスを10分割交差検証などと比べた（§4〜5）。", "p5": "リスク推定のRMSEは補正した基準で0.347から0.081に下がり、10分割交差検証の0.410から0.154より小さく、最大次元では交差検証の約半分だった。重みつきの訓練残差はどの次元でもRMSEが1.33〜1.37と不正確だった（図1）。同じデータでの二重頑健推定のバイアスは、d=2048で0.0149から0.0006へ95%以上減った（図3）。", "p6": "著者は、理論の保証がガウス文脈・単一指標の報酬・既知の文脈に依存しないログ・固定の深さと幅のネットワークという条件に限られることを明示している（抄録、§4）。解釈：実データでの検証は示されておらず、非ガウスの文脈や非一様なログは付録の追加実験にとどまる（§5）。", "fun": "AIの予測モデルを選ぶとき、データの一部を「試験用」に取っておくのが定石です。ところがデータの項目数がとても多いと、取っておいた分だけ学習の条件が変わり、試験の成績が本番の成績を正しく表さなくなります。この研究は、データを分けずに、各データが自分自身の予測をどれだけ「えこひいき」したかを差し引く補正で本番の成績を見積もりました。物理学に由来する補正の考え方を統計に生かす点が面白いところです。", "unverified": "定理4.2以降の価値推定の一致性の主張の詳細と、付録の追加実験の数値は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "オペレーションズ・リサーチ", "headline": "3次元の最適な格子量子化器は体心立方格子と証明", "title": "The BCC lattice is the optimal 3D lattice quantizer for all $p\\geq1$", "url": "https://arxiv.org/abs/2611.09523", "authors": "Senping Luo", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Luo, S. (2026). The BCC lattice is the optimal 3D lattice quantizer for all $p\\geq1$ (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09523", "why": "有限のp≥1のすべてについて、体心立方格子がボロノイ胞のp次モーメントを最小にする3次元格子であることを証明し、グラフ–ルシュギーの予想を3次元で解決した。連続量を離散化する点の最適な配置という古典的な問題に決着をつける結果である。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、証明の概要、数値計算の付録の冒頭）を読んだ。各節の証明の細部は読んでいない", "preprint": true, "p1": "有限のp≥1のすべてについて、共体積1の3次元格子のうちボロノイ胞のp次モーメントを最小にするのは（直交変換を除いて）体心立方（BCC）格子だけであることを証明し、グラフ–ルシュギーの予想を解いた（定理1.1）。", "p2": "空間の点を最も近い格子点に置き換える量子化で平均の誤差（p次モーメント）が最小の格子はどれかという問題で、BCCの最適性はp=2（バーンズとスローン）と被覆半径（p→∞、バンバ）でしか証明されておらず、一般のpでは局所的な最適性とp=2付近の大域的な最適性しか知られていなかった（§1）。", "p3": "格子をセリングの座標で表し、ボロノイ胞を15の錐体の部分に分けて動径方向に積分し、E_p(A)を、グラム行列Qの行列式と、正方形[−1,1]²上の2次式のp/2乗の積分の重みつき和で表した（§2、証明の概要）。そのうえで有界なpと大きなpに分け、任意の格子のモーメントをBCCのモーメントと比べる不等式を示した（§3〜4）。", "p4": "示すべき性質は、共体積1の全格子でE_p(L)≥E_p(L_B)が成り立ち、等号が直交変換したBCCに限ることである。数値の部分は有理数の区間演算による有限の計算で検証した（§5）。例：p=2は量子化の平均二乗誤差に当たり、BCCのボロノイ胞は正切頂八面体である（§1）。", "p5": "1≤p<∞のすべてで最小値はE_p(L_B)となり、最小化する格子はO L_B（OはO(3)の元）に限られることが示され、グラフ–ルシュギーの予想（Conjecture 8.17）がブラベ格子のクラスで解決した（定理1.1）。", "p6": "結果は格子（ブラベ格子）の中での最適性で、格子に限らない点配置での3次元の問題（ガーショの予想）は対象外である（§1）。解釈：証明の一部は区間演算による計算機での検証に依存し、その独立な確認が今後の課題になる。単著で査読前の原稿である。", "fun": "空間をたくさんの点で代表させるとき、どこに点を並べれば、各場所から一番近い点までの距離の平均を最も小さくできるでしょうか。平面なら正六角形の並びが最適ですが、3次元では距離の測り方（何乗するか）によっては答えが分かっていませんでした。この研究は、立方体の中心にも点を置く「体心立方格子」が、どの測り方でも格子の中で一番だと証明しました。単純な問いの答えが長く未解決だった点が面白いところです。", "unverified": "§3〜4の比較の不等式の証明の細部と、数値計算の個々の係数は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "心理学・認知科学", "headline": "先に自分で決めてからAIを見ると熟慮が増える", "title": "Thinking Twice: A Sequential Approach to Nudge Towards Reflective Judgment in GenAI-Assisted Decision Making", "url": "https://arxiv.org/abs/2611.09269", "authors": "H\\\"useyin Hussein Keke ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Keke, H. H., Eisenhardt, D., & Meske, C. (2026). Thinking Twice: A Sequential Approach to Nudge Towards Reflective Judgment in GenAI-Assisted Decision Making (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09269", "why": "生成AIの助言を受ける意思決定で、先に自分で判断してから助言を受ける逐次的なやり取りが、直観的な判断から熟慮的な判断への切り替えを促すかを130人の実験で検証した。二重過程理論の三段階モデルにもとづき、判断の食い違いの検出を熟慮のきっかけにする設計を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDFの本文（方法・結果・結論と限界の節と表1）を読んだ", "preprint": true, "p1": "生成AIの助けを借りる前にまず自分で答えを決めさせる逐次的なやり取りが、直観的な判断（システム1）から熟慮的な判断（システム2）への切り替えを促し、正答率とAIの活用を高めることを、130人のオンライン実験で示した（抄録、§5）。", "p2": "人は生成AIの助言を素早い直観で受け止めがちで、それが相互作用の効果を下げリスクを高める。二重過程理論の三段階モデルによれば判断の食い違いに気づくと熟慮に切り替わるが、それを促すAIとのやり取りの設計は確かめられていなかった（抄録、§1）。", "p3": "直観的な誤答を誘う2つの頭の体操（バットとボール問題、モンティ・ホール問題、5択）で、AIなしの対照群、すぐにChatGPTの回答が見られる同時群、まず自分で答えてから（任意）ChatGPTの支援で最終回答する逐次群を比べた。支援は、用意した3つのプロンプトをクリックすると正確な応答が表示される形にした（§4.1）。", "p4": "英国在住の参加者150人をProlificで集め、注意確認と回答の不整合で除いた130人（19〜75歳、女性64.6%）で、正答率とプロンプトの利用回数を、分散分析と事後検定、t検定で比べた（§4.2）。", "p5": "正答率は対照群33.00%、同時群48.78%、逐次群66.67%で、逐次群の最初の自力の回答は38.46%だった。群の差は有意で（F(2,127)=9.46、p<.001、η²=0.129）、逐次群は同時群より17.9ポイント高かった（p=.029）。プロンプトの利用は同時群の26回（平均0.63）に対し逐次群は52回（平均1.33）だった（§5.1〜5.2、表1）。", "p6": "著者は、ChatGPTを模した組込みと頭の体操を使い、実際の意思決定ではないため、AIとのやり取りの真正さが限られることを挙げ、実際のAPIと現実の課題での検証を今後の課題とする（§6）。解釈：問題は2問だけで、答えを事前に知っている参加者の影響もありうる。", "fun": "難しい問題をAIに聞くとき、先に自分で考えてからAIの答えを見るのと、最初からAIの答えを見るのとでは、どちらが正解しやすいでしょう。この実験では、先に自分で答えた人の方が正答率が高く、AIもよく活用していました。自分の答えとAIの答えが食い違うと「あれ？」と立ち止まって考え直せるからです。AIを使う順番ひとつで頭の働かせ方が変わる点が面白いところです。", "unverified": "逐次群の対応のあるt検定の統計量と、プロンプト利用の差の検定の数値は読んでいない。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "エージェントの自己改良では解ける課題が入れ替わる", "title": "Beneath the Surface: What We Overlook When We Talk About Agent Evolution", "url": "https://arxiv.org/abs/2611.07624", "authors": "Xiaobo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Wang, X., Wang, Z., Ye, S., Li, J., Tang, M., Bai, J., Shi, Y., Wang, R., Zhang, J., Wang, C., Wu, K., Qi, M., Cai, K., Gu, X., Liu, Q., & Zheng, Z. (2026). Beneath the Surface: What We Overlook When We Talk About Agent Evolution (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07624", "why": "モデルの重みを変えずに実行環境（ハーネス）を進化させる自己改良の4手法を、反復評価と介入実験で調べた。進化した16のエージェントすべてが新たに解ける課題を得る一方で以前解けた課題を失っており、ベンチマークの得点の上昇が信頼性や移転可能な改善を意味しないことを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定義・実験設定・現象の分析・汎化・改訂手順とその比較・考察の節と表2）を読んだ", "preprint": true, "p1": "モデルの重みを変えずにエージェントの実行環境（ハーネス）を進化させる自己改良で、得点の向上が信頼でき効率的で移転可能な改善を意味するとは限らないことを、4手法・2つのハーネス・2領域の反復評価と介入実験で示し、その知見から改良した手順（AGE）を作った（抄録）。", "p2": "ハーネスの進化は重みの更新なしに再帰的な自己改良を可能にするが、評価は1回の得点の比較に頼りがちで、得点の上昇の裏で以前解けた課題を失っていないか、費用が増えていないか、他の課題に移るかは調べられていなかった（抄録、§1）。", "p3": "エージェントを凍結したモデルとハーネスの組とし、AHE・HyperAgents（実装中心）とA-Evolve・GEPA（振り返り中心）をGPT-5.4で、ソースを編集できるMiniSWEと外側の層だけ変えられるCodexの2つのハーネスで動かし、親の選択・分析・変異・採否の判定などの操作ごとに利得の出どころを調べた（§3）。", "p4": "一般課題のτ³-Banking（97課題）とコーディングのTerminal-Bench 2（89課題）を学習・検証・試験に分け、初期の版（Seed）と最終の版（Champion）を、8回の反復での信頼性と網羅率（Pass@k）、課題の得失、運用費用で比べ、τ²-benchとDeepSWEへの移転も調べた（§3.2.2、§5.2）。", "p5": "進化した16のエージェントすべてが新たに解ける課題を得る一方で以前解けた課題を失い、ある例では10課題を失いながら信頼性が5.2ポイント上がった（抄録、§4.2）。信頼性が上がった11例中8例で試行あたりの費用が増えた（§4.3）。移転では網羅率が一般課題の移転先で8例中7例下がり、コーディングでは8例中7例上がった（§5.2）。改訂版のAGEは4設定すべてでA-Evolveより信頼性と網羅率を高めた（§7.4）。", "p6": "著者は、実験が利用者に向けた実運用ではなく隔離されたベンチマーク環境で行われ、指示やコードの進化が後退や安全上の問題をもたらしうることを挙げる（§8）。解釈：1つのモデル（GPT-5.4）での結果で、他のモデルでの再現は未確認。", "fun": "AIが自分の使い方を自分で改良する「自己改良」は、点数が上がれば成功に見えます。ところが詳しく調べると、新しく解けるようになった問題がある一方で、前に解けていた問題を落としていることが16例すべてで起きていました。テストの合計点だけでは、何を得て何を失ったかが見えないのです。成績表の「中身」を見る大切さを示した点が面白いところです。", "unverified": "表1・表10の個々の数値と、§6の操作ごとの介入実験の詳細は読んでいない。"}}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "AIに任せたい仕事と自分に残したい仕事の境界", "title": "What to Delegate, What to Preserve: Human Preferences for Agentic AI Across Everyday Life and Work", "url": "https://arxiv.org/abs/2611.09730", "authors": "Sarah Wheeler ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wheeler, S., Rammouz, V., Qian, Y., Liu, Z., Wei, M., Rios, A., He, T., & Zhou, K. (2026). What to Delegate, What to Preserve: Human Preferences for Agentic AI Across Everyday Life and Work (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09730", "why": "AIの利用経験がある米国の成人289人に9つの生活領域の45の場面を評価してもらい、AIエージェントへの委任の選好を調べた。AIへの信頼や費用の節約の見込みが自動化への選好を高め、自己実現が損なわれるという懸念が選好を下げることを一般化推定方程式で示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（研究計画・測定・分析方法・量的な結果・限界の節）を読んだ。質的な結果と支払意思額の節は概要のみ", "preprint": true, "p1": "AIの利用経験がある米国の成人289人が9つの生活領域の45場面でAIエージェントにどこまで仕事を任せたいかを調べ、委任の度合いは領域で大きく異なり、AIへの信頼・AIの主導への期待・過去の利用・費用の節約が委任を後押しし、自己実現が損なわれる懸念が抑えることを示した（抄録、§4.1）。", "p2": "AIエージェントは利用者の代わりに多段階の作業を実行できるが、どこまでの委任が受け入れられるかの境界は分かっておらず、信頼・プライバシー・経済的な価値・人とAIの協働の好みがそれぞれどう効くかも整理されていなかった（§1）。", "p3": "9領域に各5つの場面を用意し、回答者は各領域から無作為に選ばれた1場面ずつ計9場面を評価した。主な従属変数は「AIが完全にできるなら、どれだけ任せたいか」の5段階で、信頼・プライバシー・協働・AIの主導・費用の節約・自己実現の懸念などを測り、自由記述も得た（§3.1〜3.5）。", "p4": "回答者内の繰り返しを考慮した一般化推定方程式（GEE）で、課題と回答者の特性と自動化の選好の関連を推定し（完全なデータの2,366観測・263人）、順序型のGEEで頑健性を確かめた。支払意思額は二部モデルで、自由記述は質的に分析した（§3.7〜3.8、§4.1.4〜4.1.5）。", "p5": "全2,601観測では「なし」16.0%、「すべて」15.0%で、中程度〜高めの委任に集中した。平均は旅行（2.40）とコミュニケーション（2.37）で高く、心の健康（1.51）で最も低かった（§4.1.2）。AIへの信頼（b=0.473、95%CI 0.420〜0.526）、AIの主導（b=0.200）、過去の利用（b=0.164）、費用の節約（b=0.074）は正、自己実現の懸念（b=−0.077）は負に関連し、プライバシーと協働の好みは独立には関連しなかった（§4.1.4）。", "p6": "著者は、実際に動くAIエージェントではなく仮想の場面への回答であること、回答者がAIに詳しく利用頻度の高い人に偏ること、各領域で1場面しか評価しないこと、自由記述は委任に前向きな回答者にだけ尋ねたこと、領域ごとの関係の違いは検定していないことを挙げる（§5.4）。", "fun": "AIが代わりに何でもやってくれるとしたら、あなたはどこまで任せますか。この調査では、旅行の予約やメールのやり取りは任せたい人が多い一方、心の悩みの相談は「任せたくない」が3割を超えました。人はAIを信頼できるかどうかだけでなく、「自分でやることの楽しさや意味が失われないか」も考えて線を引いていた点が面白いところです。", "unverified": "支払意思額の二部モデルの推定値と、質的分析の主題の詳細は読んでいない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "ガウス点の間隔をそろえ任意の場面を3D再構成", "title": "SplatAnything: Gaussian Spacing Normalization for Feed-forward 3DGS across Arbitrary Scenes", "url": "https://arxiv.org/abs/2611.08264", "authors": "Hao Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Yu, H., Wang, Z., Hu, Y., Gong, Y., Wu, J., Zhou, X., Bao, H., Wang, T., Guo, C., & Peng, S. (2026). SplatAnything: Gaussian Spacing Normalization for Feed-forward 3DGS across Arbitrary Scenes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08264", "why": "画像から一度の推論で3次元ガウススプラッティングを作る手法で、場面の大きさやカメラ配置によって隣り合うガウスの間隔がばらつき、学習の目標がずれる問題を指摘した。ガウス間隔の正規化（GSNorm）でこれをそろえ、多様なデータ・疎な入力・外挿視点を含む新しいベンチマークで最高水準の性能を報告した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化・正規化の節・ベンチマーク・定量比較の記述・アブレーション・限界）を読んだ。表1の個々の数値は読んでいない", "preprint": true, "p1": "画像から一度の推論で3次元ガウススプラッティング（3DGS）を作る手法で、場面の大きさやカメラ配置によって隣り合うガウスの間隔がばらつき学習の目標がずれる問題を、ガウス間隔の中央値で尺度をそろえる正規化（GSNorm）で解き、多様な場面で高品質な新しい視点の画像を作れるようにした（抄録、§3.3）。", "p2": "幾何の基盤モデルにもとづく従来の手法は、3次元点の基準カメラからの平均距離で場面を正規化する（RDNorm）が、この全体的な統計量をそろえても、隣接する画素から生じるガウス中心どうしの間隔は場面の大きさやカメラの配置で大きく変わり、ガウスの大きさの教師信号があいまいになる（§3.3）。", "p3": "入力画像（カメラの情報は任意）から凍結した幾何の基盤モデルで多視点の幾何を推定し、それをガウス間隔で正規化した空間に変換してから、画素ごとにガウスの属性を予測する（図3）。正規化係数は、場面全体のガウス間隔の中央値が一定になるように選ぶ（式9〜10）。直観：ガウスで表面を隙間なく覆うには、ガウスの大きさを隣どうしの間隔に見合わせる必要があるため、その間隔を物差しにする（§3.2）。", "p4": "ScanNet・NRGBD・DL3DV・Tanks and Temples・Mip-NeRF 360・ETH3D・DTUの7つのデータセットで、入力と目標の視点の重なりを0.2〜0.6に制御した外挿視点、1〜64枚の入力、約480p〜1Kの解像度を含む新しいベンチマークを作り、カメラ姿勢の有無の2つの設定で既存手法とLPIPS・DISTSなどで比べた（§4.1〜4.2）。", "p5": "SplatAnythingは多くのデータセットと設定で最も高い性能を示した（表1）。正規化の比較では、RDNormとその後で尺度を補正した版はいずれもGSNormに劣り、RDNormは小さな物体中心の場面で穴が開き、大きな屋外の場面でぼやけた（表3、図7）。予測の後の尺度補正では、このあいまいさを解消できなかった（§4.5）。", "p6": "著者は、幾何の基盤モデルの事前知識に頼るため、非常に疎な入力や難しい入力で幾何を推定できないと性能が落ちうること、入力の視点から見える領域を主に再構成するため見えない部分に穴が残りうることを挙げる（限界）。", "fun": "何枚かの写真から、その場の3次元の姿をすぐに作り出す技術があります。小さな置物の写真でも大きな公園の写真でも同じようにうまくいくには、「ものさし」をそろえる必要があります。この研究は、全体の大きさではなく、表面を覆う小さな粒どうしの間隔を基準にしたことで、物の大小にかかわらず穴やぼやけの少ない3次元の姿を作れるようにした点が面白いところです。", "unverified": "表1・表3の個々の数値と、効率の比較の結果は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "LLMの一対比較で作文を採点する効率的な組合せ", "title": "Adaptive Pair Selection in Large Language Model–Based Comparative Judgment of Writing", "url": "https://doi.org/10.2139/ssrn.7681477", "authors": "Sterett H. Mercer", "venue": "SSRN", "date": "2026-11-09", "apa": "Mercer, S. H. (2026). Adaptive Pair Selection in Large Language Model–Based Comparative Judgment of Writing. https://doi.org/10.2139/ssrn.7681477", "why": "1,714本の作文への676,326件のLLMの一対比較の判断を使い、4つの適応的なペアの選び方と5つのブラッドリー–テリー推定量を比べた。適応的なペア選択は中程度の比較回数で効率を上げたが、複合的な選び方に明確な利点はなかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMによる作文の一対比較判断で、ペアの選び方・得点の推定量・打ち切りの規則の組合せが採点の効率と信頼性をどう左右するかを、67万件超の判断で調べた（抄録）。", "p3": "16の課題・6つの特性について1,714本の作文への676,326件のLLMの判断を使い、作文あたり2〜16回の比較で、4つのペアの選び方（無作為・最大の曖昧さ・中程度の曖昧さ・複合）と、2つのベイズ型・3つの頻度論型のブラッドリー–テリー推定量を比べた（抄録）。", "p5": "適応的なペア選択は中程度の比較回数で効率を上げたが、複合型に明確な利点はなかった。ベイズ推定量は最大の比較回数でも信頼性.90に届かなかったが、比較の系列の74〜89%は全比較の得点との決定係数.90以上に達した。頻度論型の信頼性推定は比較が少ないと不安定だった（抄録）。", "fun": "作文に点数をつけるより、「AとBのどちらが上手か」を何度も比べる方が判断はぶれにくくなります。ただし比べる組合せは膨大です。この研究はAIに67万回以上比べさせ、どの組を比べれば少ない回数で正しい順位に近づくかを調べました。万能な方法はなく、組の選び方・点の付け方・やめ時をセットで決める必要があるという結論が面白いところです。", "unverified": "本文を入手できず、使ったLLMの種類と、人間の採点との一致は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "貧困卒業プログラム49研究のベイズ型メタ分析", "title": "Doing Better at Doing Good: Lessons from a Bayesian Meta-Analysis After 20 Years of Poverty Graduation Programs", "url": "https://doi.org/10.3386/w35991", "authors": "Samantha Carter ほか", "venue": "NBER Working Paper", "apa": "Carter, S., Jee, E., Karlan, D., & Premand, P. (2026). Doing Better at Doing Good: Lessons from a Bayesian Meta-Analysis After 20 Years of Poverty Graduation Programs (NBER Working Paper No. 35991). National Bureau of Economic Research. https://www.nber.org/papers/w35991", "why": "消費支援・貯蓄・技能訓練・指導・一括給付のうち3つ以上を含む貧困卒業プログラムの49研究（81の処置）を階層ベイズでメタ分析した。月間消費が購買力平価で38ドル（11%）、所得が28ドル（15%）増え、貯蓄・食料安全・精神的健康なども改善したことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "消費支援・貯蓄・技能訓練・指導・一括給付を組み合わせた貧困卒業プログラムの20年分の評価を、49研究のベイズ型の階層メタ分析で統合した（抄録）。", "p3": "5つの要素のうち3つ以上を含むプログラムの49研究（81の処置の変種）を対象に、経済的・心理社会的な成果への効果、費用対効果、実施時期による違いを階層ベイズで推定した（抄録）。", "p5": "月間消費は購買力平価で38ドル（11%）、所得は28ドル（15%）増え、貯蓄・資産・食料安全・精神的健康・女性のエンパワーメントも改善した。大きな給付（400ドル以上）や高価なプログラムは効果が大きいが費用対効果は高くなく、2016年以降の実施は便益費用比が5.39と2015年までの2.89より高かった（抄録）。", "fun": "貧しい家庭を支える複合的なプログラムは、20年でどれだけ上達したのでしょうか。49の研究をまとめると、2016年以降のプログラムは費用あたりの効果がそれ以前のほぼ倍で、それは費用や構成の変化では説明できませんでした。現場が経験から学び実施の質を上げてきた可能性が見える点が面白いところです。", "unverified": "本文を入手できず、2016年以降の改善の要因（著者は分野の継続的な学習と実施の質の向上を仮説としている）の検証方法は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "税の知識を教えても納税は増えない（ガーナ）", "title": "Knowledge Without Taxation? Experimental Evidence from a Tax Education Program", "url": "https://doi.org/10.3386/w36002", "authors": "Anders Jensen ほか", "venue": "NBER Working Paper", "apa": "Jensen, A., Kumar, N., & Poensgen, K. (2026). Knowledge Without Taxation? Experimental Evidence from a Tax Education Program (NBER Working Paper No. 36002). National Bureau of Economic Research. https://www.nber.org/papers/w36002", "why": "ガーナで固定資産税の教育を所有者と現場の徴税職員に無作為に提供した実験で、知識は増え近隣にも広がったが、納税額は増えなかった。納税者は徴税の執行力を低く見積もるようになり、合法的に負担を減らす方法にも気づいたことから、知識が国家の執行力の弱さを露呈させうることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "ガーナの固定資産税で、所有者と現場の徴税職員への税の教育を無作為に行った実験で、知識は増えても納税は増えないことを示した（抄録）。", "p3": "固定資産の所有者と現場の職員に無作為に税の教育を提供し、税の知識、社会的なつながりを通じた波及、納税、納税者と職員のやり取り、執行能力への信念を調べた（抄録）。", "p5": "教育は税の知識を高め、その知識は処置を受けていない近隣にも広がったが、納税は増えなかった。教育を受けた納税者と職員はやり取りに積極的になったが協力的な関係は育たず、納税者は執行能力の見積りを下げ、合法的に負担を減らす方法を知るようになった（抄録）。", "fun": "税の仕組みを知れば、人はきちんと払うようになると思いがちです。ところがこの実験では、知識が増えると、役所が実は取り立てる力をあまり持っていないことや、合法的に払う額を減らす方法にも気づいてしまいました。知識が「もろ刃の剣」になるという意外な結果が面白いところです。", "unverified": "本文を入手できず、対象の人数・地域と効果の大きさの数値は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "罰金に違反点数を加えると速度違反の再犯が減る", "title": "Sanctions, Evasion, and Deterrence: Evidence from Speeding Enforcement", "url": "https://arxiv.org/abs/2611.09337", "authors": "Romain Gauriot ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Gauriot, R., & Wisniewska, M. (2026). Sanctions, Evasion, and Deterrence: Evidence from Speeding Enforcement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09337", "why": "オーストラリアのクイーンズランド州での制裁強化を利用し、罰金と違反点数が速度違反の再犯と他の運転者への責任転嫁に与える因果効果を推定した。罰金の引上げだけでは再犯の減少は小さく、違反点数の追加を伴うと再犯が4.6ポイント減った。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "罰金と累積する違反点数という2種類の制裁が、速度違反の再犯と他の運転者への責任の付け替えにどう影響するかを、制裁の大幅な強化を利用して因果的に推定した（抄録）。", "p3": "オーストラリアのクイーンズランド州での制裁の大きな引上げを利用し、その後の違反と、別の運転者を違反者として申告すること（責任の転嫁）への因果効果を推定した（抄録）。", "p5": "違反点数が重くなると申告の付け替えが増え、戦略的な責任転嫁と整合した。罰金の引上げだけの違反者では再犯の減少は小さかったが、罰金に違反点数の追加が伴うと再犯は4.6ポイント減った（抄録）。", "fun": "スピード違反を減らすには、罰金を上げるのと免許の点数を引くのと、どちらが効くでしょうか。この研究では、お金の罰だけでは再犯はあまり減らず、点数が加わると大きく減りました。一方で点数が重くなると、別の人が運転していたことにする「身代わり」が増えるという副作用も見つかった点が面白いところです。", "unverified": "本文を入手できず、推定の手法（比較の方法）と、責任転嫁の増加の大きさは未確認。"}}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "海水温の変化が欧州の漁業収入を減らす", "title": "The Impact of Climate Change on Fisheries", "url": "https://doi.org/10.3386/w35994", "authors": "Fabio Cevenini ほか", "venue": "NBER Working Paper", "apa": "Cevenini, F., Costello, C., & Fezzi, C. (2026). The Impact of Climate Change on Fisheries (NBER Working Paper No. 35994). National Bureau of Economic Research. https://www.nber.org/papers/w35994", "why": "欧州の全漁船の2013〜2022年の250万件の空間的な漁獲収入データと、魚種ごとの耐温度範囲にもとづく「海洋積算温度」を使い、海水温の変化が漁業収入に与える因果効果を初めて推定したと報告した。好適な温度からの逸脱、とくに高温で収入が大きく減ることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "海水温の変化が漁業収入に与える因果効果を、欧州の全漁船の250万件の空間的な記録で初めて推定したと報告した（抄録）。", "p3": "単純な理論モデルにもとづく推定式を、2013〜2022年の欧州の全漁船の漁獲収入の観測に当てはめた。魚種ごとの耐温度範囲に対する温度の暴露を表す「海洋積算温度」を新たに作り、空間的な選択や魚種間の生態的な依存関係にも対処した（抄録）。", "p5": "魚種の好適な温度からの逸脱は漁獲収入を大きく減らし、とくに高温の影響が大きく、魚種の鉛直方向の移動性などがその効果を左右した。2100年までの予測では広く収入が減り、最も暖かいシナリオで年5.6億ユーロの損失に達し、低所得の赤道寄りの地域で最も大きかった（抄録）。", "fun": "海が温まると魚はどうなり、漁師の収入はどう変わるのでしょう。この研究は、魚の種類ごとに「快適な水温」からどれだけ外れたかを数える物差しを作り、欧州のすべての漁船の記録と突き合わせました。暑すぎる海が収入を大きく減らし、深く潜って逃げられる魚では影響が小さいという生き物らしい結果が面白いところです。", "unverified": "本文を入手できず、海洋積算温度の具体的な計算方法と、推定の頑健性の確認は未確認。"}}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "近所の仲間の出願が大学出願を後押しする", "title": "Peer Influence in College Applications", "url": "https://doi.org/10.3386/w35993", "authors": "Ana M. Gazmuri ほか", "venue": "NBER Working Paper", "apa": "Gazmuri, A. M., & Prager, E. (2026). Peer Influence in College Applications (NBER Working Paper No. 35993). National Bureau of Economic Research. https://www.nber.org/papers/w35993", "why": "異なる高校に通う近所の生徒を使って共通のショックを除き、教室単位の詳細なデータで仲間の出願行動が自分の出願に与える影響を推定した。出願した仲間への接触は出願率を高めるが合格者の追加効果はなく情報が経路であることを示し、反実仮想では都市と地方・男女の出願の差を埋めうる大きさだった。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "仲間がある大学の課程に出願すると自分の出願率も上がることを、教室単位の詳細なデータと近所の生徒を使った識別で示した（抄録）。", "p3": "異なる高校に通う近所の生徒を使って共通のショックへの懸念を和らげ、教室単位のデータで仲間の出願への接触の効果を推定した。合格確率が観測でき条件付きで独立な環境を使い、一般にNP困難な出願の組合せの選択問題を扱えるようにした（抄録）。", "p5": "出願した仲間への接触は出願率を高めたが、合格した仲間による追加の効果はなく、情報が経路であることと整合した。反実仮想では、その効果は難関課程への出願の都市と地方の差・男女の差を埋めるほど大きかった（抄録）。", "fun": "近所の先輩があの大学を受けたと聞くと、自分も受けてみようかと思うことがあります。この研究では、その効果は「受かった」ことではなく「受けた」こと自体から生まれていました。大事なのは憧れより情報で、情報の格差を埋めれば地域や性別による出願の差も縮みうるという点が面白いところです。", "unverified": "本文を入手できず、対象の国と制度、効果の大きさの数値は未確認。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "有意でない政策評価も効果の分布で判断に使う", "title": "Policy Evaluation Beyond Significance Testing: Evidence from Chicago's ShotSpotter Contract", "url": "https://doi.org/10.3386/w36005", "authors": "Terence Chau ほか", "venue": "NBER Working Paper", "apa": "Chau, T., Cook, P. J., Lopez, J., Ludwig, J., Roemer, A., & Soliman, A. K. (2026). Policy Evaluation Beyond Significance Testing: Evidence from Chicago's ShotSpotter Contract (NBER Working Paper No. 36005). National Bureau of Economic Research. https://www.nber.org/papers/w36005", "why": "検出力が不足した評価では、効果がゼロかどうかの検定より効果の確率分布を推定すべきだと論じ、シカゴの銃声検知システムShotSpotterの契約を例に示した。統計的に有意でない推定でも、費用を上回る便益の確率を評価することで政策判断に使えることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "統計的に有意でない政策評価も、効果の確率分布を推定すれば政策判断に使えることを、シカゴの銃声検知システムShotSpotterの契約で示した（抄録）。", "p3": "地理的な回帰不連続デザインでShotSpotterの効果を推定したうえで、救命の効果を確率変数とみなすベイズ分析で、便益が費用を上回る事後確率を求めた（抄録）。", "p5": "銃撃の致死率は2.5ポイント（年約49人の死亡減に相当）下がると推定されたが有意ではなく、この大きさを検定で検出するには87年分のデータが要る。便益が費用を上回る事後確率は、平坦な事前分布・統計的生命価値50万ドルで70%、害なしの事前分布・1,360万ドルで99.6%だった（抄録）。", "fun": "「統計的に有意でない」と言われると、効果がなかったと受け取りがちです。しかしこの研究では、銃声を検知する装置が年に約49人の命を救っている可能性があり、それを検定ではっきりさせるには87年分のデータが必要でした。白黒をつける代わりに「得になる確率」で考えると判断が変わるという点が面白いところです。", "unverified": "本文を入手できず、回帰不連続の境界の設定と、事前分布の選び方の根拠は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "景気変動を最もよく説明する金融政策ショック", "title": "The Main Monetary Policy Shock", "url": "https://doi.org/10.3386/w36004", "authors": "Christoph Boehm ほか", "venue": "NBER Working Paper", "apa": "Boehm, C., Kim, H., & Kroner, T. N. (2026). The Main Monetary Policy Shock (NBER Working Paper No. 36004). National Bureau of Economic Research. https://www.nber.org/papers/w36004", "why": "高頻度の利回り曲線のサプライズなどの線形結合として、マクロ変動を最もよく説明する「主要な金融政策ショック」を識別する手法を提案した。このショックは過去30年の景気変動の無視できない部分を説明し、引締めでも金利はほぼ動かないまま物価を持続的に下げドル高をもたらすなど、教科書的なショックと異なることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "複数の金融政策のサプライズの中から、マクロ経済の変動を最もよく説明する線形結合を「主要な金融政策ショック」として識別する新しい手順を提案した（抄録）。", "p3": "2つの標準的な高頻度の利回り曲線のサプライズと、Boehm and Kroner（2024）の利回り以外のショックを組み合わせ、マクロの変動を最もよく説明する結合を求めた（抄録）。", "p5": "このショックは過去30年の景気変動の無視できない部分を説明し、従来の結果と異なった。教科書的なショックとも大きく異なり、引締めのショックは金利をほとんど動かさないまま物価を持続的に下げてドル高にし、金融環境を一時的に引き締めて鉱工業生産を下げた（抄録）。", "fun": "中央銀行の政策の「驚き」は、ふつう金利の動きで測ります。この研究は、いくつかの驚きの組合せのうち景気を最もよく説明するものを探しました。すると、金利はほとんど動かないのに物価やドルが動く、教科書とはまったく違う姿のショックが見つかりました。金融政策の効き方の常識を問い直す点が面白いところです。", "unverified": "本文を入手できず、識別の具体的な手順と、説明できる変動の割合の数値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "AIの買い物助手が価格競争を弱めることがある", "title": "Artificial Shoppers and Attention Competition", "url": "https://arxiv.org/abs/2611.09399", "authors": "Xiaomeng Guo ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Guo, X., Xu, F., & Zhang, X. (2026). Artificial Shoppers and Attention Competition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09399", "why": "AIによる買い物の支援（推薦）と委任（代理購入）が、価格競争・プラットフォームの利益・消費者厚生に与える影響を理論モデルで分析した。消費者が目立つ属性を過大評価する状況では、品揃えへのアクセスが広がっても推薦型の支援が競争を弱めうることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIの買い物の助手（推薦型）と代理人（委任型）が、価格競争・プラットフォームの利益・消費者厚生に与える影響を理論モデルで分析した（抄録）。", "p3": "品質の異なる3商品のうち2つをプラットフォームが扱い、AIなしでは消費者が目立つ属性（価格か品質）を過大評価して比べる。推薦型ではAIが真の効用の高い2つを推薦し、委任型ではAIが最良の商品を選び購入の承認を求める。企業は戦略的に価格を付ける（抄録）。", "p5": "推薦型は品揃えへのアクセスが広がっても競争を弱めうる。最良の選択肢が推薦され安くなっても、目立つ属性に引かれて質の低い商品に乗り換え損をする消費者がいる「整合のパラドックス」を示し、プラットフォームが好む設計がAIなしの最適より利益と消費者余剰の両方を下げうることも示した（抄録）。", "fun": "AIが正しくおすすめしてくれれば、買い物は必ず得になりそうです。ところがこの理論では、AIが最良の品を正しく並べても、人が目立つ点（安さなど）につられて質の低い品に乗り換え、かえって損をする場合がありました。AIの正しさだけでは人の判断の癖は消えないという「整合のパラドックス」が面白いところです。", "unverified": "本文を入手できず、目立ちによる歪みの定式化と、各結果が成り立つ条件の詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "オペレーションズ・リサーチ", "headline": "LLMが重みを書いた分枝規則の利点は軽さだけ", "title": "Can a Language Model Write the Weights? An Empirical Study of LLM-Written Scoring Networks for Column Generation and MILP Branching, with a Bus-Driver Scheduling Application", "url": "https://arxiv.org/abs/2611.09559", "authors": "Renan Butkeraites", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Butkeraites, R. (2026). Can a Language Model Write the Weights? An Empirical Study of LLM-Written Scoring Networks for Column Generation and MILP Branching, with a Bus-Driver Scheduling Application (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09559", "why": "勾配学習なしにLLMが小さなニューラルネットの重みを直接書く「重み空間プログラミング」を、配送計画の列生成とSCIPの分枝変数の選択に試した。列生成では実質的な改善がなく、分枝では合成問題で既定規則より速い一方、MIPLIB 2017の39問では解けた数が19対24と劣り、実データの乗務員スケジューリングでは単純な擬似費用規則と同等だった。著者は、利点は計算の軽さによるもので、論文自体をAIで作成したと明記している。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMが小さなニューラルネットの重みを勾配学習なしに直接書く「重み空間プログラミング」で、厳密な最適化アルゴリズムの採点規則を改善できるかを4つの研究で試し、利点は計算の軽さにとどまることを示した（抄録）。", "p3": "LLMが書いた小さな多層パーセプトロンに、時間枠つき配送計画の列生成での弧・ラベル・ng近傍の選択と、SCIPの分枝限定法での分枝変数の選択を担わせた。どんな重みでもアルゴリズムは厳密なままで、悪いネットワークは時間を損するだけである（抄録）。", "p5": "列生成では実質的な改善はなかった。分枝では手書きのネットワークが合成の独立集合問題を既定の規則の0.37倍の時間で解いたが、MIPLIB 2017の39問では解けた数が19対24だった。アトランタの交通機関の実データの乗務員スケジューリングでは0.63倍の時間だったが、単純な擬似費用規則も同等だった（抄録）。", "fun": "AIに計算の近道の「判断役」を書かせたら、最適化の計算は速くなるのでしょうか。結果は、速くなった場面はあっても、それはAIが書いた中身のおかげではなく、判断役が軽いおかげでした。単純な既存の規則でも同じだけ速かったのです。うまくいった理由を正直に切り分けた点が面白いところです。", "unverified": "本文を入手できず、4つの研究の詳しい設定とLLMへの指示の内容は未確認。論文は著者の指示のもとでAI（Claude Opus 5.5）が作成したと明記されている。"}}, {"id": "pn26", "rank": 26, "field": "オペレーションズ・リサーチ", "headline": "入れ子ロジットの制約付き価格設定を厳密に最適化", "title": "Constrained Nested-Logit Pricing: An Exact Reformulation and Global Optimization Method", "url": "https://arxiv.org/abs/2611.09023", "authors": "Hoang Giang Pham ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Pham, H. G., & Mai, T. (2026). Constrained Nested-Logit Pricing: An Exact Reformulation and Global Optimization Method (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09023", "why": "類似商品間の代替を表す入れ子ロジットの需要で、価格の上下限や加重価格上限の制約がある価格設定問題を厳密に再定式化し、大域最適化する方法を示した。難しい相互作用を入れ子の水準に集約し、計算量の指数が商品数ではなく入れ子の数で決まるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "類似商品どうしの強い代替を表す入れ子ロジットの需要のもとで、価格の上下限や加重価格上限の制約がある価格設定問題を厳密に再定式化し、大域最適化する方法を示した（抄録）。", "p3": "難しい相互作用を入れ子（商品のグループ）の水準に集約し、個々の商品については凸最適化のまま扱い、価格の離散化や需要の近似をせずに解く。最悪の計算量の指数が商品数ではなく入れ子の数で決まり、途中で止めても実行可能な価格と、あと得られうる利益の上限を返す（抄録）。", "p5": "合成実験で、入れ子が少なければ500商品までの品揃えで解を証明付きで求められた。制約なしの価格を実行可能な範囲へ射影する方法は、制約付きで直接最適化した場合より最大32.60%の利益を失った（抄録）。", "fun": "似た商品を何十種類も売る店が、「この値段より下げない」といった条件の中で値段を決めるのは難しい問題です。この研究は、商品を似たもの同士のグループにまとめて考えることで、難しさの源をグループの数に閉じ込めました。条件を後から当てはめるだけだと利益の3割以上を失いうるという結果も面白いところです。", "unverified": "本文を入手できず、実データでの検証の有無と、入れ子が多い場合の計算時間は未確認。"}}, {"id": "pn27", "rank": 27, "field": "オペレーションズ・リサーチ", "headline": "ADMMの乗数ステップは黄金比を超えても収束", "title": "The multiplier step size in classical two-block ADMM: convergence and counterexamples", "url": "https://arxiv.org/abs/2611.09169", "authors": "Benqi Liu ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Liu, B., Dai, Q., & Wen, Z. (2026). The multiplier step size in classical two-block ADMM: convergence and counterexamples (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09169", "why": "古典的な2ブロックのADMMで、乗数更新のステップ幅を黄金比より大きくしても制約像と乗数が収束する範囲を示した。さらに2未満の明示的な閾値以上では、実行不可能な周期軌道を持つ反例を構成した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "古典的な2ブロックのADMM（交互方向乗数法）で乗数の更新幅をどこまで大きくできるかを調べ、黄金比を超えても収束する範囲と、2未満で失敗する反例を示した（抄録）。", "p3": "罰則係数を固定し通常の主変数の更新を使う有限次元の凸問題で、KKT点が存在し各部分問題が毎回最小値をとるという仮定のもとで収束を解析し、大きな更新幅については2つの固定したコンパクトな多面体で反例を構成した（抄録）。", "p5": "制約像と乗数は黄金比を超える範囲で収束した。2未満の明示的な閾値以上では実行不可能な周期軌道があり、滑らかで強凸な目的関数でも循環しうるため、0から2の全区間についてのグロウィンスキーの問いに否定的に答えた。一般の凸の場合の一様収束の区間の端は約1.88688256にあり、上下の限界の差は0.000000174未満だった（抄録）。", "fun": "大きな問題を2つに分けて交互に解くADMMという方法では、1回にどれだけ大胆に修正してよいかが長年の疑問でした。この研究は、黄金比（約1.618）より大きくしても大丈夫な範囲を示す一方、2に届く前にぐるぐる回って抜け出せない例を作りました。限界を約1.887と小数点以下まで挟み込んだ点が面白いところです。", "unverified": "本文を入手できず、収束の証明の方法と反例の多面体の具体的な形は未確認。"}}, {"id": "pn28", "rank": 28, "field": "心理学・認知科学", "headline": "米国の州別の集団主義指標を25年ぶりに更新", "title": "Revisiting collectivism across the United States after twenty-five years: an updated state-level index and its geographic and psychological correlates", "url": "https://doi.org/10.31234/osf.io/akyhq", "authors": "Mark S. Chen ほか", "venue": "PsyArXiv", "date": "2026-11-09", "apa": "Chen, M. S., Li, S. M., Lee, B., Lathrop, B., & Park, D. (2026). Revisiting collectivism across the United States after twenty-five years: an updated state-level index and its geographic and psychological correlates. https://doi.org/10.31234/osf.io/akyhq", "why": "家族構造・婚姻の安定性・宗教性・交通手段・自営業などの指標を統合し、米国の州レベルの集団主義指数を25年ぶりに更新した。南部ほど集団主義が高い傾向は再現した一方、緯度による勾配は元の指数より弱かった。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の州ごとの集団主義の指標を、家族構造・婚姻の安定性・宗教性・交通の習慣・自営業などの行動と人口の指標から25年ぶりに作り直した（抄録）。", "p3": "従来の枠組みを踏まえて多様な行動・人口の指標を統合した新しい集団主義指数を作り、地理的な分布と心理的な指標との相関を調べた（抄録）。", "p5": "全体の傾向は過去の結果とおおむね一致したが、順位が大きく変わった州もあった。南部ほど集団主義が高く経度とはほとんど関連しない点は再現したが、緯度の勾配は元の指数より有意に弱かった。集団主義が高い州ほど大麻の使用・大量飲酒・うつの率が低く、文化の厳格さが高かった（抄録）。", "fun": "「個人を大事にするか、集団を大事にするか」という文化の違いは、国の間だけでなく一つの国の中にもあります。この研究は米国の州ごとの物差しを25年ぶりに作り直し、南ほど集団を重んじる傾向は変わらない一方、その南北の差は昔より小さくなっていることを示しました。文化の地図が時代とともに描き変わる点が面白いところです。", "unverified": "本文を入手できず、指標の重み付けの方法と相関の大きさの数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "心理学・認知科学", "headline": "報酬の与え方で記憶の想起の始まり方が変わる", "title": "Value-based control over memory encoding and search", "url": "https://doi.org/10.31234/osf.io/ygduf", "authors": "Sven Wientjes ほか", "venue": "PsyArXiv", "date": "2026-11-08", "apa": "Wientjes, S., Holroyd, C. B., & Polyn, S. M. (2026). Value-based control over memory encoding and search. https://doi.org/10.31234/osf.io/ygduf", "why": "報酬を記銘時に与えるか後の想起の成功に応じて与えるかで、自由再生の時間的な組織化がどう変わるかを調べた。想起の成功に報酬が伴うと、報酬のついた項目の始まりから想起を始める「リスト中間の初頭効果」が生じることを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "報酬を記銘時に与えるか後の想起の成功に応じて与えるかで自由再生の組立てがどう変わるかを調べ、動機づけられた記憶が、文脈と項目の結びつきの強化と、意図的な出来事の区切りの2つの仕組みに支えられることを示した（抄録）。", "p3": "報酬つきの項目とそうでない項目を混ぜたリストで自由再生の実験を行い、文脈維持・検索モデル（CMR）の新しい階層ベイズ版を個人の再生の系列に当てはめて、競合する説明を比べた（抄録）。", "p5": "想起の成功に報酬が伴うと、報酬つきの部分列の始まりから検索を始めることが多い「リスト中間の初頭効果」が生じた。モデルの当てはめから、初頭効果は冒頭の項目の記銘の強化だけでなく、特別な文脈を戦略的に呼び戻すことによると示唆された（抄録）。", "fun": "テストに出ると分かっている部分は覚えやすいものです。この実験では、思い出せたらご褒美がもらえると分かると、人はご褒美の区間の「始まり」を目印にして思い出し始めました。記憶は強く刻まれるだけでなく、自分で目次を作るように組み立て直されているという見方が面白いところです。", "unverified": "本文を入手できず、実験の参加者数と効果の大きさの数値は未確認。"}}, {"id": "pn30", "rank": 30, "field": "心理学・認知科学", "headline": "脳との対応は自然言語で学習したモデルに現れる", "title": "Language, Not Code Abstraction: Natural-language Training Shapes Brain-aligned Geometry", "url": "https://arxiv.org/abs/2611.09027", "authors": "I\\~nigo Parra", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Parra, I. (2026). Language, Not Code Abstraction: Natural-language Training Shapes Brain-aligned Geometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09027", "why": "物語・Python・C・アセンブリ・機械語で25のGPT-2-smallを学習し、脳活動データとの対応（ブレインスコア）を比べた。物語で学習したモデルは2つのベンチマークでコードのモデルの平均を上回り（Δr=0.053、0.059）、コードの学習は無作為な重みと同程度にとどまった。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "言語モデルが脳活動とよく対応するのは自然言語での学習のおかげで、プログラムのコードで学習した抽象的な構造では代わりにならないことを、同じ構成のモデルで比べて示した（抄録）。", "p3": "物語（TinyStories）・Python・C関数・x86-64アセンブリ・機械語でGPT-2-smallのモデルを計25個学習し、共通のトークナイザと符号化の手順で、対応する無作為な重みのモデルを基準に脳との対応（ブレインスコア）を測った（抄録）。", "p5": "Pereira-243とTuckute2024では物語のモデルが4つのコードのモデルの平均をΔr=0.053、0.059上回り（ホルム補正p<0.001）、コードの学習は無作為な重みと同程度だった。ただしBlank2014では差がなく、Fedorenko2016では言語の利点が見られず、利点はベンチマークに依存した（抄録）。", "fun": "プログラムの言葉も人間の言葉も、規則にしたがって並ぶ記号です。では、コードだけで学んだAIも人の脳に似た情報の表し方をするでしょうか。この研究では、脳との似方を生んでいたのは自然な言葉で学んだことで、コードでは偶然と変わりませんでした。ただし、どの脳データで測るかで結果が変わる点も面白いところです。", "unverified": "本文を入手できず、学習データの量と表現の幾何の分析の詳細は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "専門家モデルの重みを事前情報に蒸留を加速", "title": "P^2-MOPD: Accelerating Multi-Teacher On-Policy Distillation via Parameter Priors", "url": "https://arxiv.org/abs/2611.03953", "authors": "Sinuo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "apa": "Wang, S., Lu, J., Zhang, Z., Song, M., Sun, R., Luan, B., Xie, Y., Li, J., Jiang, D., Wu, Q., & Bai, Z. (2026). P$^2$-MOPD: Accelerating Multi-Teacher On-Policy Distillation via Parameter Priors (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.03953", "why": "複数の教師モデルからの方策上の蒸留で、学生と専門家のパラメータの線形結合の係数と学生の重みを同時に最適化するP²-MOPDを提案した。専門家の重みを事前情報として使いつつ学生を結合の範囲に閉じ込めない設計で、4つの領域・2つの規模で検証した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の教師モデルからの方策上の蒸留で、学生と専門家のパラメータの線形結合を1つの微分可能なモデルとみなし、結合の係数と学生の重みを同時に最適化するP²-MOPDを提案した（抄録）。", "p3": "学習なしのタスク算術は凍結した学生と専門家のパラメータの範囲から出られないが、P²-MOPDは学生を学習可能に保ち、専門家を範囲に閉じ込めない事前情報として使う。同じ初期値からの従来の蒸留（MOPD）と、4つの領域・1.7Bと4Bの規模で比べた（抄録）。", "p5": "P²-MOPDはMOPDより速く、領域間でより均等に能力を回復し、半分の学習ステップでMOPDの最終的な平均回復率を超えた。学習の最後に1.7Bのモデルは平均回復率94.7%に達し、MOPDの80.9%を上回った（抄録）。", "fun": "数学が得意な先生、プログラムが得意な先生など、複数の専門家AIの力を1つの小さなAIにまとめるのは大変です。この研究は、先生たちの「頭の中身（重み）」を出発点のヒントとして混ぜつつ、生徒自身も学び続けられるようにしました。半分の練習で追いついたという効率の良さが面白いところです。", "unverified": "本文を入手できず、4つの領域の内容と回復率の定義は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "テスト時強化学習の多数決ラベルの誤差を分解", "title": "On the Reliability of Majority-Vote Pseudo-Labels in Test-Time Reinforcement Learning", "url": "https://arxiv.org/abs/2611.09872", "authors": "Haoyu Wang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wang, H., Wang, R., Wang, Y., Guo, J., & Gong, M. (2026). On the Reliability of Majority-Vote Pseudo-Labels in Test-Time Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09872", "why": "ラベルなしデータで多数決の擬似ラベルを使うテスト時強化学習の誤差を、母集団の多数派の偏りと有限回の生成による変動に分解した。後者の影響を抑える頑健なDPO（PC-Dr.DPO）と忘却を減らす仕組みを提案し、6つの推論ベンチマークで評価した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "ラベルのないデータで多数決の擬似ラベルを使うテスト時強化学習（TTRL）の誤差を分解し、生成の回数が有限であることによる揺らぎの影響を抑える頑健なDPOを提案した（抄録）。", "p3": "オンラインのDPOを使う多数決型のTTRLの誤差を、母集団の多数派の偏り（外部の正解なしには識別できない）と、問題ごとの有限回の生成による変動に分け、投票の信頼性に応じて重みを調整するPC-Dr.DPOと、自己教師による忘却を減らすキャッシュの仕組みを導入した（抄録）。", "p5": "6つの数学・知識集約型の推論ベンチマークと5つのモデルで、30の設定のうち24でPC-Dr.DPOは最も強いTTRLの比較手法と同等以上だった（抄録）。", "fun": "正解が分からない問題でAIを鍛えるとき、AIに何度も答えさせて一番多い答えを正解とみなす方法があります。でも、たまたま多数派になった答えを信じると間違いを覚えてしまいます。この研究は、票がばらついた問題では慎重に学ぶようにしました。多数決の「自信の度合い」を学び方に反映させる発想が面白いところです。", "unverified": "本文を入手できず、改善の大きさの数値と5つのモデルの種類は未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "正規化層のある深層網はリプシッツ定数が指数増大", "title": "On Lipschitz Explosion in Deep Neural Networks with Normalization: Consequences for Optimization and Adversarial Robustness", "url": "https://arxiv.org/abs/2611.08775", "authors": "Ashkan Soleymani ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Soleymani, A., Hosseinpourkhoshkbari, R., Daneshmand, H., & Jaillet, P. (2026). On Lipschitz Explosion in Deep Neural Networks with Normalization: Consequences for Optimization and Adversarial Robustness (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08775", "why": "バッチ正規化などの正規化層を持つ深層網では、各層の重みのノルムを抑えても入力と重みに対するリプシッツ定数が深さとともに指数的に増えうることを証明した。最適化の保証や敵対的な頑健性の議論に影響する結果である。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "バッチ正規化などの正規化層を持つ深層網では、各層の重みのノルムを抑えても、入力と重みに対するリプシッツ定数（出力の変化の大きさの上限）が深さとともに指数的に増えうることを証明した（抄録）。", "p3": "線形の活性化関数でも、各層で‖W‖≤1のような強い制御をしても起こることを示し、その帰結として、最適化の保証が次元に指数的な上限になり、リプシッツ定数に基づく汎化と頑健性の保証が無意味になることを導いた（抄録）。", "p5": "理論から、新しい特異方向を作る摂動は、同じ大きさで元の特異部分空間にとどまる摂動よりはるかに強く増幅されると予測し、MNIST・Fashion-MNIST・CIFAR-10の実験で、階数を増やす摂動の方が正解率・確信度・マージンを大きく下げることを確かめた（抄録）。", "fun": "学習を安定させるための部品（正規化層）が、見えないところで不安定さを生んでいるかもしれません。この研究は、各層を一つずつ見るとおとなしいのに、全体ではわずかな入力の違いが何倍にも膨らみうることを証明しました。部分を確かめても全体の安全は保証できないという教訓が面白いところです。", "unverified": "本文を入手できず、実験での低下の大きさの数値は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "小さなチームを並列に走らせるとエージェントが伸びる", "title": "Test-Time Compute Scales Better with Parallel Agent Teams", "url": "https://arxiv.org/abs/2611.09798", "authors": "Junlin Wang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Wang, J., Chen, H., Li, A., Chalamala, R., & Liu, Z. (2026). Test-Time Compute Scales Better with Parallel Agent Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09798", "why": "検証器で採点できる長期の課題で、多数の独立エージェントから最良を選ぶ方法と大きな1チームの協働の長所を合わせ、小さなチームを多数並列に走らせて最良を残す方法を提案した。27Bのモデル・100エージェントの予算で、10体のチームの並列化が12課題中10課題で独立エージェントの並列化を上回った。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "検証器で採点できる長期の課題で、多数の小さなエージェントのチームを並列に走らせて最良のチームの結果を残すと、テスト時の計算を効率よく性能に変えられることを示した（抄録）。", "p3": "多数の独立なエージェントから最良を選ぶ方法（すぐ頭打ちになる）と大きな1チームの協働（大きくすると伸びが止まる）の中間として、小さなチームを並列に走らせる。GPUカーネルから形式的証明、脆弱性を突くコードの開発まで12の長期課題で、27Bのモデルと100エージェントの予算で比べた（抄録）。", "p5": "10体のチームの並列化は12課題中10課題で独立エージェントの並列化を上回り、100体の1チームを試した4課題すべてでそれを上回った。同じ費用ではフロンティアモデルに半数の課題で勝った。単純な統計モデルで、独立エージェントは平均が低く、大きな1チームはばらつきの恩恵がないため負けると説明した（抄録）。", "fun": "難しい問題に100人で挑むなら、100人がばらばらに挑むのと、100人で1チームを作るのと、どちらがよいでしょう。この研究のAIでは、10人ずつの小チームを10個作って一番よい結果を採るのが最も強くなりました。チームの協力で平均を上げつつ、チームの数で「当たり」を引く機会も残すという統計的な理屈が面白いところです。", "unverified": "本文を入手できず、各課題の具体的な点数と使用したモデルの名前は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "LLMの創造的な出力の新しさを構造的に測る", "title": "AlienBench: A Benchmark of Structural Novelty in Language Model Outputs", "url": "https://arxiv.org/abs/2611.09094", "authors": "Jonas Oppenlaender ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Oppenlaender, J., & Silvennoinen, J. M. (2026). AlienBench: A Benchmark of Structural Novelty in Language Model Outputs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09094", "why": "人が異星の生物を想像する認知心理学の課題を使い、LLMの出力が地球の動物の特徴という既知の基準からどれだけ離れるかで新しさを測るベンチマークを作り、評定者の主観に頼らない新規性の尺度を示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "異星の生物を想像させる認知心理学の課題をLLMに当てはめ、出力が地球の動物の特徴からどれだけ離れるかで新しさを測るベンチマークAlienBenchを作った（抄録）。", "p3": "モデルが異星の生物を描写し、3つのLLMの判定者が10の生物学的な特徴を取り出して地球型か逸脱かを判定し、逸脱の数（0〜10）を得点とする。6つのプロンプト条件で各30件、計180件の描写を10のモデルに生成させた（抄録）。", "p5": "総合得点は3.28（GPT-6 Luna）から6.55（Ministral 3 14B）まで分かれ、公開重みのモデルが商用モデルより高かった（5.40対4.58）。基本のプロンプトでは、モデルはどの特徴でも人間の参加者100人より平均して地球型から離れることが多かった（抄録）。", "fun": "「宇宙人を想像して」と頼むと、多くの人は左右対称で足で歩く生き物を描いてしまいます。この研究は、地球の生き物の当たり前からどれだけ離れられるかでAIの発想の新しさを測りました。大手の高性能なAIより公開されている小さめのAIの方が奇抜で、人間よりもAIの方が型を破ったという結果が面白いところです。", "unverified": "本文を入手できず、判定者のLLMによる判定の信頼性と、人間の参加者の条件は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "エージェントが自分の働き方を改良できるかを測る", "title": "Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents", "url": "https://arxiv.org/abs/2611.08946", "authors": "Jingdong Zhang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Zhang, J., Wang, J., Yu, Z., Cai, Y., Chow, W., Choy, C., Dou, Z., Hua, H., Li, J., Liu, Z., Wang, C., Wei, S., Yang, S., Yuan, Y., Zhan, X., Zhang, Y., Zheng, S., Li, X., Liu, L., … Wang, W. (2026). Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08946", "why": "視覚とロボティクスの課題で、エージェントが課題の評価を使って解法だけでなくプロンプト・道具・記憶などの実行環境を改良できるかを、固定予算で評価するベンチマークFlex-RSIを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "エージェントが課題のフィードバックを使って、解答だけでなく自分の働き方（プロンプト・道具・記憶・制御の仕組み）まで改良できるかを、視覚とロボティクスの課題で固定予算のもとに測るベンチマークFlex-RSIを作った（抄録）。", "p3": "各回で実行役が解答を改良し、検証用データで得点が上がった場合だけ残し、改良役が実行役と自分自身を含むハーネスを修正する。すべての実行は同じ汎用のハーネスから始め、最終解は隠したテストデータで採点する。商用と公開重みのモデルを評価した（抄録）。", "p5": "自己改良はエージェントが自分で解を組み立てるときに最も役立ち、成功か失敗かだけのフィードバックは公開重みのモデルの足かせになり、物理的な安定性や厳密な正しさの検査が必要な課題で公開重みのモデルが最も遅れた。対になる実行の比較から、ハーネス自体の編集も改善に寄与していた（抄録）。", "fun": "人は失敗から答えを直すだけでなく、勉強のやり方そのものを見直すことがあります。この研究は、AIも同じように「やり方」を自分で改良できるかを試す場を作りました。成功か失敗かしか教えてもらえないと伸び悩むAIがあったのは、人の学びにも通じるようで面白いところです。", "unverified": "本文を入手できず、モデルごとの具体的な得点と課題の数は未確認。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "異分散ノイズを均して低ランク信号を回復", "title": "Blind Noise Equalization for Large Data Matrices under General Variance Profiles", "url": "https://arxiv.org/abs/2611.08784", "authors": "Boris Landa ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Landa, B., Strino, F., Parisi, F., Li, R., & Kluger, Y. (2026). Blind Noise Equalization for Large Data Matrices under General Variance Profiles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08784", "why": "成分ごとにノイズ分散が異なる大規模データ行列で、行と列を反復的に再尺度化してノイズ分散を均すBRINEを提案した。適切な条件のもとでノイズのスペクトルにマルチェンコ–パスツール則を回復し、信号やノイズの構造を知らなくても弱い信号成分を見えやすくする。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "成分ごとにノイズの分散が異なる大規模データ行列で、行と列を反復的に再尺度化して平均のノイズ分散を均す手法BRINEを提案し、ノイズのスペクトルの理論的な形を回復できることを示した（抄録）。", "p3": "未知のノイズ分散の代わりに、データのレゾルベントの対角成分を均すという発想で、母集団の水準での均等化を特徴づけるポテンシャル関数を見つけ、それを最小化する反復法を導いた。更新はノイズのあるデータから直接推定できる（抄録）。", "p5": "任意の正の分散の形に対して反復が真の均等化子に収束することを、穏やかな条件では幾何級数的な速さで証明し、尺度係数の確率的な誤差の上限を与えた。多様な生物学的データと前処理の流れでのシミュレーションと実験で有効性を示した（抄録）。", "fun": "大きな表のデータには、行や列によって雑音の大きさが違うことがよくあります。そのままでは雑音が「偽の模様」を作り、本当の弱い信号を隠してしまいます。この研究は、雑音の大きさを知らないまま、行と列の目盛りを少しずつ調整して雑音をならす方法を作りました。見えないものを間接的な手がかりでそろえる発想が面白いところです。", "unverified": "本文を入手できず、生物学的データでの改善の具体的な数値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "統計学", "headline": "資産の分位点を小地域・属性別にベイズ推定", "title": "Bayesian Unit-level Quantile Modeling with Application to Wealth Data", "url": "https://arxiv.org/abs/2611.08843", "authors": "Daniel Vedensky ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Vedensky, D., Parker, P. A., & Holan, S. H. (2026). Bayesian Unit-level Quantile Modeling with Application to Wealth Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08843", "why": "正負の値をとり裾の重い資産データについて、調査ウェイトを考慮した非対称ラプラス疑似尤度のベイズ単位レベルモデルを提案し、時間・地域・細かな属性別の分位点を推定できるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "正負の値をとり、偏りが大きく裾の重い資産データについて、時間・地域・細かな属性別の分位点を推定できるベイズ型の単位レベルのモデルを提案した（抄録）。", "p3": "調査ウェイトを調整し、空間と時間の依存も考慮する非対称ラプラス疑似尤度のベイズモデルで、ギブスサンプリングと高速な変分ベイズのアルゴリズムを示した（抄録）。", "p5": "米国の所得・プログラム参加調査（SIPP）に適用し、直接の推定ができない、または不安定な標本の少ない区分も含めて、世帯の資産分布の地理・時間・属性による違いを示した（抄録）。", "fun": "国全体の平均資産は分かっても、小さな地域の、ある年齢層の「下位10%の資産」となると、回答者が少なすぎて推定できません。しかも資産は借金でマイナスにもなります。この研究は、そうした扱いにくいデータでも、地域や時間のつながりを借りて細かな分布を推定する方法を作りました。少ないデータから格差の姿を描く工夫が面白いところです。", "unverified": "本文を入手できず、推定の精度の比較の数値と、得られた資産分布の具体的な結果は未確認。"}}, {"id": "pn39", "rank": 39, "field": "統計学", "headline": "移流の向きに合わせた時空間ガウス過程の近似", "title": "Advection-aligned block Vecchia inference for spatio-temporal Gaussian processes", "url": "https://arxiv.org/abs/2611.08938", "authors": "Joonwon Lee ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Lee, J., & Stein, M. L. (2026). Advection-aligned block Vecchia inference for spatio-temporal Gaussian processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08938", "why": "大規模な時空間ガウス過程のベッキア近似で、データから推定した移流（輸送）の方向に沿って過去の観測を条件づけに選ぶ方法を提案した。静止衛星GEMSのオゾン全量の観測を動機とし、観測地点が格子上になくても使える。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "移流（輸送）を伴う大規模な時空間ガウス過程の推論で、データから推定した輸送の方向に沿って過去の観測を条件づけに選ぶブロック型のベッキア近似を提案した（抄録）。", "p3": "静止衛星GEMSのオゾン全量の観測を動機とし、最初に推定した移流ベクトルで輸送方向に沿った過去の条件づけのブロックを一度だけ選び、そのグラフを固定したまま共分散と移流のパラメータを推定する。近傍の選択と共分散の推定を分け、GPUで尤度と勾配を計算する（抄録）。", "p5": "2024年7月と2025年7月の日別のGEMSデータでは、61日中53日で対象中心の条件づけより低い負の対数尤度を得た。6つのマターン型のシミュレーション（各120場）でも、同じ予算で移流ベクトルの推定誤差を減らし、輸送が強いほど減少が大きかった（抄録）。", "fun": "風で流されるオゾンのように、過去のある場所の値は、風上にあった値ほど今の値をよく教えてくれます。この研究は、計算を軽くするために参照する過去のデータを選ぶとき、風の向きに沿って選ぶようにしました。物理の流れの向きを統計の近似にそのまま組み込む発想が面白いところです。", "unverified": "本文を入手できず、計算時間の比較と予測精度の数値は未確認。"}}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "相関行列のボックス・コックス変換族を理論化", "title": "Box-Cox Transformations of Correlation Matrices", "url": "https://arxiv.org/abs/2611.09790", "authors": "Ilya Archakov ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Archakov, I., & Hansen, P. R. (2026). Box-Cox Transformations of Correlation Matrices (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09790", "why": "相関行列に対するボックス・コックス変換の族を定義し、生の相関や一般化フィッシャー変換を特別な場合として含むことを示した。逆問題が厳密に凸であることや、α≤0のときに限り全空間への写像になることなどを証明した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "相関行列にボックス・コックス変換を施す変換の族を定義し、生の相関、一般化フィッシャー変換、精度行列の座標を特別な場合として含むことと、その数学的な性質を示した（抄録）。", "p3": "相関行列Cに対してΦα(C)=vecl{(C^α−I)/α}を考え、逆問題の凸性、写像の像、ヤコビアンの条件数、ガウス標本のもとでの変換後の標本相関の漸近分布を調べた（抄録）。", "p5": "逆問題はすべてのαで厳密に凸で各写像は単射であり、全空間への写像になるのはα≤0のときに限る。独立のもとで変換後の標本相関の漸近共分散は単位行列になるが、相関の1次まで単位行列を保つのはα=0だけで、独立での3次キュムラントが消えるのはα=1/3だけだった（抄録）。", "fun": "相関係数は−1から1の間にしか値をとらないため、そのまま統計の計算に使うと扱いにくいことがあります。昔から使われるフィッシャー変換はこの制限を外す工夫でした。この研究は、相関の行列全体に使える変換を一つの家族としてまとめ、どの一員が何に向くかを数学的に整理しました。既知の変換が一本の線の上に並ぶ点が面白いところです。", "unverified": "本文を入手できず、実データへの応用の有無は未確認。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "ChatGPTの広告導入後に週間利用者が5.4%減", "title": "Monetization of Generative AI: Advertising, User Engagement, and Market Outcomes", "url": "https://doi.org/10.2139/ssrn.7681558", "authors": "Jingwei Dai ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Dai, J., Li, B., & Sokol, D. D. (2026). Monetization of Generative AI: Advertising, User Engagement, and Market Outcomes. https://doi.org/10.2139/ssrn.7681558", "why": "米国でのChatGPTへの広告導入を、他国を対照とした差の差分析で調べ、週間アクティブ利用者が5.4%減ったことを示した。AIアプリの利用者が多い都市圏ほど減少が大きかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国でChatGPTに広告が導入された後、週間アクティブ利用者が5.4%減ったことを、他国を対照とする差の差分析で示した（抄録）。", "p3": "都市圏と国の単位のモバイルアプリの利用データを使い、米国と対照国を比べる差の差分析で、広告導入の前後の利用者数・利用時間・課金収入の変化を推定した（抄録）。", "p5": "ChatGPTの週間アクティブ利用者は5.4%減り、もともとAIアプリの利用者が多い都市圏ほど減少が大きかった。競合するClaudeとGeminiとの比較でも相対的な減少が見られ、国の単位では米国の利用時間と課金収入も相対的に減った。広告収入は考慮しておらず、全体の収益性は評価していない（抄録）。", "fun": "無料のサービスは広告で成り立つことが多いですが、AIとの会話に広告が入ると利用者はどう感じるでしょう。この研究では、広告が始まった米国でChatGPTの利用者が他国より減っていました。広告で稼ぐことと使い続けてもらうことの間の綱引きが、データではっきり見える点が面白いところです。", "unverified": "本文を入手できず、対照国の選び方と平行トレンドの確認、利用時間と課金収入の減少の大きさは未確認。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "LLMの順位表の競争が能力の画一化を招く条件", "title": "Strategic Competition and Convergence in LLM Leaderboards", "url": "https://arxiv.org/abs/2611.09780", "authors": "Naveen Raman ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Raman, N., Fang, F., & Chen, Y. (2026). Strategic Competition and Convergence in LLM Leaderboards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09780", "why": "LLMの開発者が勝率を最大化するよう能力ごとに資源を配分するゲームとして順位表の競争を定式化した。生産関数が似ていると能力の構成が似通い、比較優位があれば多様性が保たれ、収穫逓減が上位の過密化を招くことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの順位表での競争を、開発者が勝率を最大化するよう能力ごとに資源を配分するゲームとして定式化し、能力の画一化や性能の収束が起こる条件を分析した（抄録）。", "p3": "似た生産関数が似た能力構成を生み、比較優位が異なる能力構成を保ち、収穫逓減が上位の過密化を招くことを理論的に示し、LM ArenaとOpenRouterのデータで確かめた（抄録）。", "p5": "開発者は競合に遅れている分野でより大きく改善しつつ分野ごとの強みを保っており、上位のモデルはますます混み合う一方で、モデルの利用のされ方は多様化していた。競争の激化が互換的なモデルを生むとは限らず、異なる強みを持つモデルを支えうると論じた（抄録）。", "fun": "順位表で競い合うと、みんなが同じような点の取り方を目指して似たり寄ったりになりそうです。しかしこの研究によると、得意分野の違いがあれば、それぞれの個性は残りうるといいます。実際のデータでも、トップ集団は混み合いながら、使われ方はばらばらになっていました。競争と多様性が両立しうるという点が面白いところです。", "unverified": "本文を入手できず、データ分析の具体的な手法と数値は未確認。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "モデルポートフォリオが投資信託の競争を弱める", "title": "Centralized Financial Advice and Competition for Capital&nbsp;", "url": "https://doi.org/10.2139/ssrn.7681563", "authors": "Pietro Lazzaretto", "venue": "SSRN", "date": "2026-11-09", "apa": "Lazzaretto, P. (2026). Centralized Financial Advice and Competition for Capital&nbsp; https://doi.org/10.2139/ssrn.7681563", "why": "米国の助言付き資産の推計9.3兆ドルを導くモデルポートフォリオが、資金配分と運用者の競争の動機に与える影響を調べた。モデルの目標比率への調整は成績による資金流出を和らげる一方、好成績への報酬も弱めることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の助言付き資産の推計9.3兆ドルを導く「モデルポートフォリオ」が、投資信託への資金配分と運用者の競争の動機をどう変えるかを調べた（抄録）。", "p3": "ファイナンシャル・アドバイザーがポートフォリオの構築を集中化した投資規則（モデルポートフォリオ）に委ねる動きを捉え、モデルの推奨への露出が資金の流れ、成績が悪かった後のリスクの取り方、成績の持続性に与える影響を分析した（抄録）。", "p5": "モデルは資金の流れの有意で逆張り的な要因で、目標比率への調整が成績による資金流出を和らげる一方、好成績への報酬も弱めた。モデルへの露出が大きい投信は成績不振の後にリスクを取らず、成績の持続性も弱かった（抄録）。", "fun": "投資のプロの判断が、少数の「お手本の配分表」に任されるようになると何が起きるでしょう。この研究では、お手本に従う資金の動きが、成績の悪い投信からの急な資金流出を和らげる一方、成績の良い投信へのご褒美も減らしていました。安定と引き換えに、運用者のやる気が削がれるかもしれないという点が面白いところです。", "unverified": "本文を入手できず、モデルの推奨への露出の測り方と、効果の大きさの数値は未確認。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "学位の種類が企業の生産性に与える効果を推計", "title": "Which types of education raise firm productivity? Evidence for managers and workers in the UK", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141789", "authors": "Hall, Tessa", "venue": "RePEc NEP", "date": "2026-11-09", "why": "英国の2万社超の企業でLinkedInの職歴パネルと財務データを結び、学位の分野・出身校・水準が企業の生産性に与える効果を賃金への効果と比べた。企業内で学士号は労働者の生産性を約20%高め、管理職ではMBAなど大学院の資格に効果が集中していた。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "学位の分野・出身校・水準が企業の生産性に与える効果を、英国の2万社超の企業で推定し、賃金への効果と比べた（抄録）。", "p3": "Revelio LabsのLinkedInのパネルとOrbisの財務データを2015〜2024年について結びつけ、企業内での学位の種類ごとの生産性への寄与を、管理職と非管理職に分けて推定した（抄録）。", "p5": "企業内で学士号は労働者の生産性を約20%高め、上位20校の出身でさらに10%、大学院の資格で6%加わった。STEM分野や一流校は非管理職の生産性を高めたが管理職では高めず、管理職ではMBAなど大学院の資格に効果が集中した。STEMの非管理職は生産性より低い賃金、学位のある管理職は高い賃金を受けていた（抄録）。", "fun": "大学で何を学んだかは、会社の生産性にどれだけ効くのでしょう。この研究では、理系の専門の学位は現場の働き手の生産性を高める一方で、管理職ではMBAのような学位の方が効いていました。しかも給料は、理系の働き手には実力より低く、管理職には高めに払われているという「ずれ」も見えた点が面白いところです。", "unverified": "本文を入手できず、生産性の測り方（付加価値など）と、因果的な解釈の根拠は未確認。"}}, {"id": "pn45", "rank": 45, "field": "経営学", "headline": "公共調達への依存が企業の環境投資を減らす", "title": "Working Papers in Responsible Banking &amp; Finance Procuring Pollution? How Government Spending Shapes Firms' Green Investments", "url": "https://doi.org/10.2139/ssrn.7681580", "authors": "Matilde Cappelletti ほか", "venue": "SSRN", "date": "2026-11-09", "apa": "Cappelletti, M., & Sfrappini, E. (2026). Working Papers in Responsible Banking &amp; Finance Procuring Pollution? How Government Spending Shapes Firms’ Green Investments. https://doi.org/10.2139/ssrn.7681580", "why": "イタリアの全公共調達契約と企業の財務データ（2015〜2024年）を結び、公共調達への依存が高い企業ほど環境投資が少ないことを示した。脱炭素の圧力が強い時期と資金制約の弱い企業で影響が大きかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの論文のCrossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "政府の公共調達への依存が高い企業ほど環境投資が少ないことを、イタリアの全公共調達契約と企業の財務データで示した（抄録）。", "p3": "2015〜2024年のイタリアの全公共調達契約を企業の財務データと環境投資の強度の指標に結びつけた新しいデータで、調達への依存と環境投資の関係を分析し、落札の段階で環境基準を考慮した場合と比べた（抄録）。", "p5": "公共調達への依存が高いほど環境投資は低く、その影響は脱炭素の圧力が強い時期と資金制約の弱い企業で大きかった。落札の段階で政府の買い手が環境基準を考慮した場合には、環境投資への負の影響は見られなかった（抄録）。", "fun": "政府は気候対策を掲げながら、同時に大量の物やサービスを企業から買っています。この研究では、環境に配慮しない基準で政府の仕事を受注する会社ほど、市場からの脱炭素の圧力を受けにくくなり、環境投資を減らしていました。政府の「買い方」そのものが気候政策の効き目を左右するという点が面白いところです。", "unverified": "本文を入手できず、環境投資の強度の測り方と、因果の識別の方法は未確認。"}}, {"id": "pn46", "rank": 46, "field": "経済学", "headline": "大手通信会社は投資で規制の介入を抑止する", "title": "Policy Deterrence: Strategic Investment in U.S. Broadband", "url": "https://doi.org/10.3386/w35992", "authors": "Karam Kang ほか", "venue": "NBER Working Paper", "apa": "Kang, K., & Xiao, M. (2026). Policy Deterrence: Strategic Investment in U.S. Broadband (NBER Working Paper No. 35992). National Bureau of Economic Research. https://www.nber.org/papers/w35992", "why": "2010〜2019年の米国のブロードバンド整備と州の政策データで、大手事業者は選挙の接戦郡で設備を多く増強し、その後に参入を促す政策が少なくなることを示した。投資が政策当局の介入の利得を下げるモデルで解釈し、総整備量を減らしうることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "大手のインターネット事業者が選挙の接戦郡で設備を増強し、それが小規模事業者の参入を後押しする州の政策を抑止している可能性を、データとモデルで示した（抄録）。", "p3": "2010〜2019年の米国のブロードバンド整備と州の政策データを使い、大手事業者の設備容量と、その後の参入・投資を促す政策（とくに道路占用の便宜）の関係を分析し、大手の設備が政策当局の介入の利得を下げるモデルで解釈した（抄録）。", "p5": "大手事業者は選挙で接戦の郡で容量をより多く拡大し、接戦郡で大手の容量が大きいほど、その後の参入と投資を促す政策が少なかった。モデルでは政策の抑止が大手の市場占有率を高め、総整備量を減らしうることが示された（抄録）。", "fun": "企業は政治献金だけでなく、設備投資の仕方でも政策に影響を与えうるのでしょうか。この研究は、大手の通信会社が選挙で接戦の地域ほど先回りして設備を増やし、その結果、新しい会社の参入を助ける政策が出にくくなっていたことを示しました。投資が「政策を止める道具」にもなりうるという見方が面白いところです。", "unverified": "本文を入手できず、関連が因果か相関かの識別の方法と、効果の大きさは未確認。"}}, {"id": "pn47", "rank": 47, "field": "経済学", "headline": "フードスタンプ無料化で加入は25%増、出生体重は不変", "title": "When Food Stamps Became Free: Impacts and Implications of Removing the Purchase Requirement", "url": "https://doi.org/10.3386/w35996", "authors": "Amy Finkelstein ほか", "venue": "NBER Working Paper", "apa": "Finkelstein, A., Notowidigdo, M. J., & Rafkin, C. (2026). When Food Stamps Became Free: Impacts and Implications of Removing the Purchase Requirement (NBER Working Paper No. 35996). National Bureau of Economic Research. https://www.nber.org/papers/w35996", "why": "1979年にフードスタンプの購入要件を廃止した改革を地域差で分析し、加入が1.85ポイント（約25%）増え、新規加入者はより貧しかったことを示した。乳児の健康の改善は見られず、信頼区間で出生体重の2%を超える改善を否定した。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "1979年に米国のフードスタンプの購入要件をなくし無料にした改革を分析し、加入は大きく増えたが乳児の健康は改善しなかった一方、再分配としては社会厚生を高めたことを示した（抄録）。", "p3": "改革で食料補助が65%から100%に上がったことへの地域ごとの暴露の違いを利用して、加入・乳児の健康・受給者が給付に置く価値を推定した（抄録）。", "p5": "加入は1.85ポイント（標準誤差0.15）、約25%増え、新規加入者はより貧しかった。出生体重の2%を超える改善は95%信頼区間で否定された。受給者は1ドルの給付を59セント（42〜77セント）と評価するかのように振る舞ったが、非常に低所得の世帯に届くため、標準的な再分配の選好のもとでは社会厚生を高めた（抄録）。", "fun": "食料の引換券を「少し払えば買える」から「無料」にすると、何が変わったでしょう。もっと貧しい家庭が加わるようになった一方、赤ちゃんの健康は良くなりませんでした。受け取る人にとって1ドル分の券の価値は約59セントにすぎなくても、本当に困っている人に届くなら社会全体では意味があるという考え方が面白いところです。", "unverified": "本文を入手できず、地域の暴露の測り方と、乳児の健康の指標の詳細は未確認。"}}, {"id": "pn48", "rank": 48, "field": "経済学", "headline": "非伝統的金融政策で預金が金利に敏感な顧客に偏る", "title": "Unconventional Monetary Policy and Deposit Retention", "url": "https://doi.org/10.3386/w35985", "authors": "Philip Strahan ほか", "venue": "NBER Working Paper", "apa": "Strahan, P., & Yang, T. (2026). Unconventional Monetary Policy and Deposit Retention (NBER Working Paper No. 35985). National Bureau of Economic Research. https://www.nber.org/papers/w35985", "why": "ゼロ金利と量的緩和が金利に敏感な預金者を銀行に引き寄せたことを示した。政策の正常化後には、量的緩和とゼロ金利への露出が大きい銀行ほど預金流出の感応度と預金ベータが高まり、預金の維持が高コスト・高リスクになった。", "explain": {"basis": "抄録", "basis_note": "NBERの論文ページの抄録を使用", "preprint": true, "short": true, "p1": "ゼロ金利と量的緩和という非伝統的金融政策が、金利に敏感な預金者を銀行に引き寄せ、政策の正常化後に預金の維持を高コスト・高リスクにしたことを示した（抄録）。", "p3": "短期金利をゼロに保つ政策（ZLB）と中央銀行の非銀行からの債券購入（QE）への露出の違いを使い、預金の構成、預金流出の感応度、預金ベータ（政策金利に対する預金金利の追随度）の変化を調べた（抄録）。", "p5": "ゼロ金利は利回りの圧縮で高利回りの資金先を探す利点を小さくして金利に敏感な顧客を引き寄せ、量的緩和も金利に敏感な大口預金者を引き寄せた。政策の正常化後には、量的緩和とゼロ金利への露出が大きい銀行ほど預金流出の感応度と預金ベータが高まった（抄録）。", "fun": "金利がほぼゼロの時代には、どの銀行に預けても利息は同じなので、利息に敏感な人も普通の銀行に預金を置いたままにしました。ところが金利が戻ると、その人たちは一斉に条件の良い先へお金を移し始めます。昔の政策がのちに銀行の弱点として表れるという「時間差の副作用」が面白いところです。", "unverified": "本文を入手できず、使用したデータと露出の測り方、効果の大きさは未確認。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "女性向け採用補助で企業が離職女性を継続採用", "title": "Female-Targeted Hiring Subsidies, Firm Learning, and Women’s Employment", "url": "https://econpapers.repec.org/RePEc:sef:csefwp:796", "authors": "Mimosa Distefano ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "非就業から女性を雇うと社会保険料を一時的に減らすイタリアの制度を使い、補助を利用した企業がその後も職歴の中断した女性を多く採用し続けることを示した。最初の採用がうまくいった企業ほど後の採用が増え、企業が対象者の生産性を学習するという解釈と整合した。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用", "preprint": true, "short": true, "p1": "非就業から女性を雇うと社会保険料を一時的に減らすイタリアの採用補助を利用した企業が、その後も職歴の中断した女性を多く採用し続けることを示した（抄録）。", "p3": "非就業の女性を雇う際の社会保険料を一時的に下げた政策を利用し、補助の利用前後で企業の採用、最初の採用の質とその後の採用、補助で雇われた人の労働市場への定着を調べた（抄録）。", "p5": "補助を利用した企業は、母親を含む職歴の中断した女性を持続的に多く採用した。最初の採用がうまくいった企業ほど後の採用が増え、企業が対象者の生産性を学習するという解釈と整合した。補助で雇われた人は労働市場への定着も強かった（抄録）。", "fun": "出産などで仕事を離れた女性が再就職しにくいのは、会社がその人の実力を測りかねているからかもしれません。この研究では、採用の補助をきっかけに一度雇ってみた会社が、その後も同じような女性を雇い続けました。補助が「お試しの機会」となり、会社の思い込みを経験で書き換えたという見方が面白いところです。", "unverified": "本文を入手できず、補助の対象の条件の詳細と、効果の大きさの数値は未確認。"}}, {"id": "pn50", "rank": 50, "field": "因果推論", "headline": "時系列の因果探索を性質ごとに制御して評価", "title": "Composable Causality: A Toolkit for Systematic Time-Series Causal Discovery and Treatment-Effect Benchmarking", "url": "https://arxiv.org/abs/2611.08918", "authors": "Muhammad Hasan Ferdous ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "apa": "Ferdous, M. H., & Gani, M. O. (2026). Composable Causality: A Toolkit for Systematic Time-Series Causal Discovery and Treatment-Effect Benchmarking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08918", "why": "多変量時系列の因果探索と処置効果推定の評価に使う合成データを、疎性・ノイズ分布・欠測の仕組みなどを1つずつ変えて作れるツールキットDTCDを提案し、反実仮想による評価も可能にした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "正解の因果構造が分かっている多変量時系列を、性質を1つずつ変えながら生成できるライブラリDTCDを作り、因果探索と処置効果推定の手法を体系的に評価した（抄録）。", "p3": "グラフの構造・仕組み・雑音・観測の欠け方・介入の方針を独立な部品とし、設定だけで組み合わせて同時刻とラグのある隣接行列つきの時系列を作る。事実の生成時の乱数を保存して介入時に再投入する「対の反実仮想」で、個人の処置効果を数値精度で求める（抄録）。", "p5": "81の設定で8つの因果探索手法、18の設定で4つの処置効果推定量を評価し、標準的な探索手法が欠測値を扱えないこと（欠測の仕組みが情報を持つかに関係なく）や、分散の大きさに頼る近道（varsortability）があり標準化で除けることなど、集計の指標では隠れる失敗を示した（抄録）。", "fun": "原因と結果の関係をデータから見つける手法を試すには、答えの分かっている練習問題が必要です。この研究は、条件を一つずつ変えた練習問題を自在に作れる道具を作りました。すると、データの一部が欠けているだけで多くの手法がつまずくことや、変数のばらつきの大きさだけで答えを当てる「ずる」が起きていることが分かりました。", "unverified": "本文を入手できず、手法ごとの具体的な成績の数値は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "風車の振動から倒壊の予兆と地盤の水分を読む", "title": "Monitoring Wind Turbine Vibrations for Structural and Subsurface Insights", "url": "https://doi.org/10.1029/2026gl124838", "authors": "Sayan Mukherjee ほか", "venue": "Geophysical Research Letters", "date": "2026-11-09", "sjr": 1.949, "citescore": 8.1, "citescore_year": "2025", "apa": "Mukherjee, S., Li, Y. E., Stumpf, A., & Zhang, H. (2026). Monitoring Wind Turbine Vibrations for Structural and Subsurface Insights. Geophysical Research Letters, 53(21). https://doi.org/10.1029/2026gl124838", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "風力発電機が出す連続的な地震波（受動的な振動記録）を16か月分解析し、倒壊の2日前のスペクトルの異常と、振動数の変化から推定した地下浅部の土壌水分の空間的なパターンを示して、風車を構造の監視と水文の観測の両方に使える可能性を示した（抄録）。", "p2": "風車は構造の健全性と周辺環境の情報を含む連続的な地震波を出しているが、それを構造の監視と浅い地下の水文状態の把握に同時に使う方法は確立していなかった（抄録）。", "p3": "米国イリノイ州の2つの風力発電所で16か月間記録した受動的な地震データから風車の振動を解析し、構造の動特性を調べるとともに、風車の振動数の時間変化を地表近くの「クリティカルゾーン」の多孔弾性状態の経験的な代理指標として使い、土壌水分の空間パターンをモデルで再構成した（抄録）。解釈：土の水分で地盤の剛性が変わり、基礎の支持条件を通じて風車の固有振動数が変わるという考え方。", "p4": "倒壊した風車の事前の記録と、航空電磁探査から推定した岩相の対比を基準に、振動の異常と土壌水分のパターンを評価した（抄録）。比較の方法、観測点の配置、定量的な一致の指標は未確認（本文を入手できず）。", "p5": "倒壊の2日前に前兆となるスペクトルの異常を検出し、目に見える兆候の前に構造が傾き始めていたことを示した。振動数の変化から再構成した土壌水分の1次の空間パターンは、航空電磁探査による岩相の違いと整合した（抄録）。", "p6": "著者は、この後ろ向きの概念実証が1件の倒壊事例と同じ場所にない水文データに頼っており、一般化には水文センサを同じ場所に置いた独立の展開が必要だと述べる（抄録）。", "fun": "風車は回るたびに地面をかすかに揺らし、その揺れは地震計に記録されます。この研究は、その揺れの「音色」の変化から、風車が倒れる2日前の異変と、地面の湿り具合まで読み取りました。土が湿ると地面の硬さが変わり、風車の揺れ方も変わるからです。発電の機械が、自分自身と足元の大地の見張り役にもなるという発想が面白いところです。", "unverified": "本文を入手できず、スペクトルの異常の大きさ、振動数の変化量、土壌水分の推定精度の数値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "4千万台のWindowsで測るデジタル利用格差", "title": "Evidence and measures of the digital usage divide from 40 million Windows devices", "url": "https://doi.org/10.1038/s41467-026-78689-1", "authors": "Mayana Pereira ほか", "venue": "Nature Communications", "date": "2026-11-09", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Pereira, M., Greenstein, S., Sadun, R., Tambe, P., Ronchi Darre, L., Glazer, T., Kim, A., Dodhia, R., & Lavista Ferres, J. (2026). Evidence and measures of the digital usage divide from 40 million Windows devices. Nature Communications. https://doi.org/10.1038/s41467-026-78689-1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社のページの抄録を使用（本文は入手できず）", "preprint": false, "p1": "米国の家庭の4,000万台のWindows端末のOS更新時の遠隔計測データから、郵便番号単位のデジタル利用の指標を作り、都市と農村の差や同じ都市圏の中での差が大きく、それが所得や教育と関連することを示して、指標を公開した（抄録）。", "p2": "デジタル基盤は経済的な機会・社会的包摂・市民参加に重要だが恩恵は不均等で、既存の指標（コンピュータの保有やブロードバンドの普及）は利用の深さや多様さを捉えていない（抄録）。", "p3": "Microsoftが米国の家庭の4,000万台のWindows端末から更新時に収集する遠隔計測データを使い、端末の利用の表現を郵便番号の単位で作って、デジタル利用の指標を構築した（抄録）。解釈：持っているかではなく、どれだけ・どう使っているかを測る発想。", "p4": "作った指標を、既存の商用・政府の調査と比べた網羅性と粒度、都市と農村、狭く定義した大都市統計地域の内部での違い、所得と教育との関連で評価した（抄録）。指標の具体的な定義と統計手法は未確認（本文を入手できず）。", "p5": "指標は既存の調査より網羅性と粒度が高く、郵便番号の単位で利用に大きなばらつきがあり、都市と農村の格差と大都市統計地域の内部での格差が見られた。所得と教育がこれらの差と相関し、その効果は大きく、利用の格差は基盤の利用可能性を超えて広がっていることが示唆された（抄録）。", "p6": "著者は、基盤の整備に加えて技術の利用と技能の向上を支える介入が必要だと論じる（抄録）。解釈：Windows端末だけが対象で、スマートフォンや他のOSの利用、端末を持たない世帯は捉えられない。", "fun": "パソコンを「持っているか」は調べやすいですが、「どれだけ使いこなしているか」は見えにくいものです。この研究は、4千万台のWindowsパソコンの更新の記録を使い、地域ごとの使い方の差を細かく描きました。同じ都市の中でも差が大きく、回線があるだけでは格差は埋まらないことが分かります。目に見えない「使う力」の格差を地図にした点が面白いところです。", "unverified": "本文を入手できず、指標の具体的な定義、関連の大きさの数値、プライバシー保護の方法は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "駅アクセスの住宅価格効果はTOD類型で異なる", "title": "Spatial Heterogeneity in TAZ Metrorail Accessibility Effects on Housing Prices Across TOD Categories: An Extended Node–Place Model", "url": "https://doi.org/10.3390/land15112129", "authors": "Jingming Liu ほか", "venue": "Land", "date": "2026-11-09", "citescore": 6.4, "citescore_year": "2025", "apa": "Liu, J., Ren, Y., Hou, X., & Liu, Y. (2026). Spatial Heterogeneity in TAZ Metrorail Accessibility Effects on Housing Prices Across TOD Categories: An Extended Node–Place Model. Land, 15(11), 2129. https://doi.org/10.3390/land15112129", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "上海で、地下鉄の駅へのアクセス性が住宅価格に上乗せされる程度（資本化）がTOD（公共交通指向型開発）の類型によって異なり、効果が及ぶ距離の閾値も都心から郊外に向かって変わることを示した（抄録）。", "p2": "駅周辺の建物環境の違いは、地下鉄のアクセス性の住宅価格への資本化を空間的に不均一にするが、TODの類型ごとの違いと、一律の駅勢圏の半径が成り立つかは十分に検証されていなかった（抄録）。", "p3": "交通の需給比と駅間の乗客の流れから交通によるアクセス性を計算し、距離減衰の関数で交通分析区（TAZ）ごとの地下鉄のアクセス性を求めた。これと駅の位置・建物環境の指標から拡張したノード・プレイスモデルとK平均法でTODの類型を分け、距離の閾値を入れたヘドニック価格モデルと価格帯別のモデルで、アクセス性と価格の関係の空間的な違いを調べた（抄録）。", "p4": "類型ごとのアクセス性の効果の距離の閾値と、効果の向きと大きさが駅周辺の開発・距離・住宅の価格帯で変わるかを評価した（抄録）。標本の規模と期間、係数の値は未確認（本文を入手できず）。", "p5": "TODの類型は明確に空間的に分かれ、距離の閾値は都心から周辺へ増え、Stressed型とExtended型で359.5〜766.77 m、Balanced型とDemand型で885.82〜1,543.75 mと、一律の駅勢圏の半径は当てはまらなかった。アクセス性は住宅価格と正に関連し、Stressed・Extended・Balanced型では中高価格帯と高価格帯で、Demand型の近くでは低価格帯と高価格帯で効果が強かった（抄録）。", "p6": "著者は、これらの差が交通による立地の利点から恩恵を受ける機会の不平等を示唆すると述べる（抄録）。解釈：横断的なヘドニックモデルにもとづく関連で、因果的な資本化の推定とは限らない。上海以外への一般化も未確認。", "fun": "駅に近い家は高く売れる、とよく言われます。でも、その「駅の近さの値段」は、駅の周りがどんな街かで変わりました。都心の混んだ駅では数百メートル以内でないと効かないのに、郊外の駅では1キロ以上離れても効いていたのです。「駅から何分」の価値が街によって違うことをデータで地図にした点が面白いところです。", "unverified": "本文を入手できず、住宅価格のデータの出所と件数、ヘドニックモデルの係数は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "LLMの運転者ペルソナの忠実さと多様性を検証", "title": "Generation and Validation of Driver Personas Using Local Language Models for Multi-Agent Traffic Microsimulation Supporting Sustainable Transport Planning", "url": "https://doi.org/10.3390/su182111411", "authors": "Mariusz Rychlicki ほか", "venue": "Sustainability", "date": "2026-11-09", "citescore": 8.9, "citescore_year": "2025", "apa": "Rychlicki, M., & Kasprzyk, Z. (2026). Generation and Validation of Driver Personas Using Local Language Models for Multi-Agent Traffic Microsimulation Supporting Sustainable Transport Planning. Sustainability, 18(21), 11411. https://doi.org/10.3390/su182111411", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "交通のマイクロシミュレーションで運転者の多様性を表すため、1台のGPUで動くローカルなLLMで運転者のペルソナ文を生成し、その忠実度・多様性・言語の正しさ・意思決定への影響を検証する方法を示した（抄録）。", "p2": "交通施策の評価は個々の運転行動から安全・時間・エネルギー・排出が生まれる交通マイクロシミュレーションに頼るが、運転者の違いを短い言葉のペルソナでLLMに与えたとき、指定した特徴が保たれ判断に反映されるかは確かめられていなかった（抄録）。", "p3": "運転者の特徴（例：危険を冒す傾向）を指定してペルソナ文を生成させ、そのペルソナを与えたLLMに追い越すかどうかを判断させる。範囲はペルソナ文の生成と検証に限り、シミュレーション本体と実際の運転者との比較は対象外とした（抄録）。", "p4": "300のエージェント、8つのローカルモデル、2言語、6つの指示の版、86,760回の追い越しの判断で、特徴への忠実度・文の多様性・言語の正しさ・判断への影響の4つを評価し、LLMの判定者を2人の人間の評定者と比べた（抄録）。", "p5": "すべてのモデルが指定した特徴を保ったが、忠実度が高いほど多様性は低い傾向があり、誤りの率はモデル間で100倍以上違った。ペルソナは指定した危険の好みに応じて判断を分けたが（ρ≈0.90）、1文のラベルを与えるだけの場合を上回らなかった（抄録）。", "p6": "著者は、範囲をペルソナ文の生成と検証に限り、マイクロシミュレーションそのものと実際の運転者との比較は行っていないと明記している（抄録）。解釈：ペルソナが1文のラベルを超えなかった結果は、長いペルソナ文の価値そのものを問い直すものでもある。", "fun": "交通シミュレーションでは、慎重な人やせっかちな人など、いろいろな運転者を再現する必要があります。この研究は、AIに運転者の人物像を文章で作らせ、その人物になりきって「追い越すかどうか」を何万回も判断させました。人物像はきちんと判断に反映されましたが、長い人物紹介でも「危険を好む」の一言と同じくらいの効果しかなかった点が面白いところです。", "unverified": "本文を入手できず、8つのモデルの名前、人間の評定者との一致度、誤りの率の具体的な値は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "生成AIの探索的利用が建設技術者の革新行動を促す", "title": "The impact of explorative generative AI usage on construction project professionals' innovative work behavior: a technology affordance actualization perspective", "url": "https://doi.org/10.1108/ecam-06-2026-1186", "authors": "Ding Wang ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-09", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Wang, D., Jia, J., Ran, T., Xiao, L., & Dai, Y. (2026). The impact of explorative generative AI usage on construction project professionals’ innovative work behavior: a technology affordance actualization perspective. Engineering, Construction and Architectural Management, 1–17. https://doi.org/10.1108/ecam-06-2026-1186", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "p1": "生成AIを探索的に使うことが、建設プロジェクトの専門職の知識獲
