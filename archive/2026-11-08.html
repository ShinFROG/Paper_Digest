<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

域や市町村の市場では寡占が広がることを示した（抄録）。", "p3": "2018年の株主証明と株主間の親族ネットワークを使い、段階的な行列モデルで383路線を事業者・法的な権利者・家族単位の経済主体に割り当て、修正ハーフィンダール・ハーシュマン指数（HHI）で集中度を測った（抄録）。", "p5": "家族をまとめると実質的な主体数は155社から103単位に減り、共同所有を考えると独立した意思決定の中心は72になった。6つの計画地域のうち4地域で上位4主体が路線の50〜59%を支配し、市町村単位の市場のほぼ5分の4が狭い寡占の基準を超えた（抄録）。", "fun": "バス会社の数を数えるだけなら競争がありそうに見えても、株主をたどると同じ家族が何社も持っていることがあります。この研究は親族関係までたどって本当の持ち主で数え直し、地域ごとに見ると少数の家族が路線を握っていることを示しました。数え方ひとつで競争の姿が変わり、規制はグループ全体を見るべきだという結論につながる点が面白いところです。", "unverified": "親族関係の特定方法と、乗客数で重み付けした指標の詳しい定義は抄録では未確認。"}}, {"id": "pr17", "rank": 17, "headline": "障害への固定観念は不安を介して交流意欲を下げる", "title": "Disability stereotypes and willingness for intergroup contact among undergraduate students without disabilities: A moderated mediation model grounded in Integrated Threat Theory", "url": "https://doi.org/10.21203/rs.3.rs-9757678/v1", "authors": "Yang WANG ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "WANG, Y., LIU, X., YAO, X., JIANG, C., & ZHANG, X. (2026). Disability stereotypes and willingness for intergroup contact among undergraduate students without disabilities: A moderated mediation model grounded in Integrated Threat Theory. https://doi.org/10.21203/rs.3.rs-9757678/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "障害への固定観念が障害のない大学生の交流意欲を下げる経路を、集団間不安による媒介と、共感・接触頻度による調整として示した（抄録）。", "p3": "統合脅威理論（Integrated Threat Theory）にもとづき、障害のない学部生1,661人に障害の固定観念、集団間不安、対人反応性（共感）、社会的距離の尺度に回答してもらい、調整媒介モデルで分析した（抄録）。", "p5": "固定観念は交流意欲を有意に負に予測し、集団間不安が部分的に媒介した。共感が高いと集団間不安の負の効果が64.4%弱まり、頻繁な接触もこの抑制効果を和らげた（抄録）。", "fun": "障害のある人について決めつけがあると、人は関わること自体を避けがちです。この研究は、その間に「うまく接することができるかな」という不安が挟まっていること、そして相手の立場を想像する力（共感）が強い人ではその不安の悪影響が大きく減ることを示しました。決めつけを直接なくさなくても、不安と共感に働きかける道があるという点が面白いところです。", "unverified": "対象の大学・地域の構成と、媒介効果の大きさの数値は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "6事例の熟議過程の成果と短期的な変化を評価した報告", "title": "CO-SUSTAIN: Assessment of the outputs and outcomes of deliberation processes in the six case studies", "url": "https://doi.org/10.5281/zenodo.23998049", "authors": "Aet Annist ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-05", "apa": "Annist, A., Kaire Holts, Kährik, A., Pungas, L., de Fontana, F. L. M., Klingler, M., Spittler, N., Körner, D., Plöchl, J., Scherhaufer, P., Valdés, L., Mundó, J., Käis, M., Heppu-Eemeli, H., Kiviluoma, N., Kojo, M., Álvaro, S.-R., Aguilar-Ruiz, N., Osorio-Aravena, J. C., … SCIULLO, A. L. E. S. S. A. N. D. R. O. (2026). CO-SUSTAIN: Assessment of the outputs and outcomes of deliberation processes in the six case studies. Zenodo. https://doi.org/10.5281/ZENODO.23998049", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（報告書の本文は入手できず）", "preprint": true, "short": true, "p1": "EUプロジェクトCO-SUSTAINの6つの事例で行った熟議の過程について、直接の成果物と参加者の短期的な変化を評価した報告書（抄録）。", "p3": "プロジェクトの影響評価枠組み（IAF）に沿い、参加者調査・面接・インパクトストーリー・参与観察の質的・量的な証拠を組み合わせ、個人と集団の水準の変化を調べた（抄録）。", "p5": "熟議の過程と道具が、課題の理解やその体系的な性質の認識、解決策の特定、社会的結束・エンパワメント・包摂と排除・能力形成にどう影響したかを検討した。効果の大きさは抄録には示されていない（抄録）。", "fun": "市民が集まって話し合う熟議は民主主義の道具として注目されていますが、話し合いの後に人々が本当に変わったのかを確かめるのは簡単ではありません。この報告は、理解の深まりや仲間意識、取り残される人がいないかまで、話し合いの成果を何段階にも分けて測ろうとしています。良い話し合いとは何かを測る物差しづくりそのものが面白い問いです。", "unverified": "6事例の具体的な内容と、評価で得られた結果は抄録では未確認。"}}, {"id": "pr19", "rank": 19, "headline": "適応型の警報閾値は攻撃を学習して見逃しを増やす", "title": "Thresholds That Travel: Adaptive Alarm Thresholds Let Attacks Through in ICS Anomaly Detection", "url": "https://doi.org/10.5281/zenodo.24035417", "authors": "Kulshrestha, Vyom", "venue": "Zenodo", "date": "2026-11-07", "apa": "Kulshrestha, V. (2026). Thresholds That Travel: Adaptive Alarm Thresholds Let Attacks Through in ICS Anomaly Detection (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24035417", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "異常検知の警報閾値を運用中に自動で更新すると、攻撃のデータで閾値が引き上げられて見逃しが増えることを、事前登録した検証で示した（抄録）。", "p3": "産業制御システムのデータ（HAI 20.07、BATADAL）で、日々の再較正、移動分位点の追跡、極値分布の逐次当てはめ（SPOT、DSPOT）という適応型の閾値を固定閾値と比べ、閾値すれすれを保つ閉ループの攻撃者も試した（抄録）。", "p5": "対称な分位点追跡はHAI 20.07の38攻撃のうち20件しか検知できず、固定閾値は36件だった。BATADALでは14件中6件に対し固定閾値は14件だった。著者らは、閾値は自ら厳しくしてよいが、緩めるのは運用者の承認を要すべきだと主張する（抄録）。", "fun": "見張り役が「最近警報が鳴りすぎるから基準を少し甘くしよう」と自動で調整すると、悪者はそこにつけ込めます。少しずつ値を上げて基準そのものを引き上げれば、警報を鳴らさずに忍び込めるからです。この研究は、便利に見える自動調整が攻撃者に利用されやすいことをデータで示しました。賢くしたつもりの仕組みが弱点になるという逆説が面白いところです。", "unverified": "攻撃の定義と検知の数え方の詳細、他のデータでの一般性は抄録では未確認。"}}, {"id": "pr20", "rank": 20, "headline": "橋梁SHMのモード同定法の数式をまとめた補足資料", "title": "Structural Health Monitoring of Bridges: From Classical System Identification to Modern Machine Learning Approaches", "url": "https://doi.org/10.5281/zenodo.23894546", "authors": "Shima Pakniat ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-12-12", "apa": "Pakniat, S., pezeshk, shahram, & Camp, C. (2026). Structural Health Monitoring of Bridges: From Classical System Identification to Modern Machine Learning Approaches. ASCE. https://doi.org/10.5281/ZENODO.23894546", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された補足資料の抄録を使用（総説本体と補足資料の中身は入手できず）", "preprint": true, "short": true, "p1": "橋梁の構造ヘルスモニタリング（SHM）に関する総説の補足資料で、代表的なモード同定法の数式と先端的なセンシング技術の文献をまとめたもの（抄録）。", "p3": "固有系実現アルゴリズム（ERA）、自然励振法（NExT）、確率的部分空間同定（SSI）、周波数領域分解（FDD）、拡張FDD（EFDD）の詳細な定式化と、無線センサ網・光ファイバ・画像計測・スマートフォン計測の文献を収める（抄録）。", "p5": "新しい実験や比較の結果は含まれず、総説本体で論じた手法と技術の詳細と参考文献を補う資料である（抄録）。", "fun": "橋の揺れを測ると、その橋の固さや傷み具合の手がかりが得られます。この資料は、揺れのデータから橋に固有の揺れ方を取り出す代表的な計算法の数式を一か所にまとめたものです。同じ目的の方法がいくつもあり、それぞれ前提が違うことを並べて見比べられる点が便利で、方法選びの地図のような役割を果たします。", "unverified": "総説本体の内容と、各手法の比較の結論は未確認（補足資料の抄録のみ）。"}}, {"id": "pr21", "rank": 21, "headline": "技能を与えたLLMエージェントで水文モデルを較正", "title": "A Skill-Guided LLM Agent for Process-Aware Calibration of Large-Scale Hydrological Models: Demonstration with VIC v5.1.0", "url": "https://doi.org/10.5194/egusphere-2026-6762", "authors": "Cheng Yang Qian ほか", "venue": "EGUsphere", "date": "2026-11-06", "apa": "Qian, C. Y., Peng, G., Sun, Y., Zeng, C., & Liu, J. (2026). A Skill-Guided LLM Agent for Process-Aware Calibration of Large-Scale Hydrological Models: Demonstration with VIC v5.1.0. https://doi.org/10.5194/egusphere-2026-6762", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphere（査読前の討論原稿）の抄録をCrossrefから使用（本文は入手できず）", "preprint": true, "short": true, "p1": "水文モデルの較正を、診断・調整・評価・検証の4つの技能（Skill）を与えたLLMエージェントに、仮説を立てて確かめる形で行わせる枠組みを示した（抄録）。", "p3": "エージェントは流量の誤差の特徴を読み取り、過程の仮説を立て、物理的に制約したパラメータ調整を提案し、決定論的なシミュレーションで効果を確かめる。嘉陵江流域のVIC v5.1.0（RVIC結合）で、技能なしのLLMとSCE-UA法と同じ評価回数で比べた（抄録）。", "p5": "基準のパラメータに比べ、技能つきの方法はナッシュ・サトクリフ効率（NSE）を0.690から0.716に上げ、洪水のピーク時刻の平均絶対誤差を23.22日から9.89日に減らした。ただし改善はすべての水文指標で一貫してはいなかった（抄録）。", "fun": "川の流れを計算するモデルには、土のしみこみやすさなど調整すべきつまみがたくさんあります。普通はコンピュータに総当たりで良い組み合わせを探させますが、なぜその値なのかは分かりません。この研究ではAIに誤差の出方から原因を推理させ、仮説を立ててシミュレーションで確かめながら調整させました。答えだけでなく理由の筋道が残る点が面白いところです。", "unverified": "SCE-UA法との具体的な比較結果と、改善しなかった指標の内訳は抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "浅水方程式と浸透式を組み込んだPINNで雨水施設を解析", "title": "Physics-Informed Neural Network Stormwater Modeling for Surface-Subsurface Flow in Stormwater Infiltration Systems", "url": "https://doi.org/10.22541/essoar.15011823/v1", "authors": "Yue Hu ほか", "venue": "ESS Open Archive", "date": "2026-11-06", "apa": "Hu, Y., Li, C., & Zheng, Q. (2026). Physics-Informed Neural Network Stormwater Modeling for Surface-Subsurface Flow in Stormwater Infiltration Systems. https://doi.org/10.22541/essoar.15011823/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録をCrossrefから使用（本文は入手できず）", "preprint": true, "short": true, "p1": "浅水方程式とグリーン・アンプト浸透式を一つの物理情報ニューラルネットワーク（PINN）に組み込み、雨水浸透施設の表面流と地中への浸透を同時に再現する枠組み（SWE-GA-PINN）を示した（抄録）。", "p3": "まず業界標準の精度を再現する基準モデルを作り、次に高精度版で疎なセンサから水理の場を再構成し、透水係数の時空間的な減衰を明示的な制約なしに推定させた（抄録）。", "p5": "基準モデルの相対誤差は2つの量で2.30%と6.74%、越流量で4.21%だった。入口以外の学習データなしに表面の観測だけから浸透を推定して相対誤差7.59%、50%のガウス雑音を加えても誤差は9.21%に収まった（抄録）。", "fun": "雨水を地面にしみこませる施設では、水が表面を流れながら同時に地下へしみこみます。この研究は、水の流れの方程式としみこみの式をAIの学習ルールに組み込み、少ないセンサの値から施設全体の水の動きを描き出しました。さらに土のしみこみやすさが時間とともに落ちていく様子まで、教えずに見つけ出した点が面白いところです。", "unverified": "抄録では一部の変数名が欠けており、各誤差がどの量に対応するかは未確認。"}}, {"id": "pr23", "rank": 23, "headline": "空間的に独立な検証で斜面崩壊検出の精度を評価", "title": "Explainable Machine Learning for Multi-Temporal Landslide Detection along the Mechi– Tamor Corridor, Eastern Nepal\"", "url": "https://doi.org/10.21203/rs.3.rs-11282655/v1", "authors": "Sudeep Bista¹ ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Bista¹, S., Regmi², S., Adhikari², S., Khatri¹, S., & Sapkota², S. (2026). Explainable Machine Learning for Multi-Temporal Landslide Detection along the Mechi– Tamor Corridor, Eastern Nepal”. https://doi.org/10.21203/rs.3.rs-11282655/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ネパール東部の幹線沿いで、多時期・多センサの衛星データと機械学習で斜面崩壊を検出し、空間的に独立な検証では精度がランダム分割より大きく下がることを示した（抄録）。", "p3": "性質の異なる2つの豪雨（2025年10月、2026年7月）で116の崩壊痕を判読し、SAR後方散乱の変化・光学指数・地形・先行降雨・地質から410単位×2事象の特徴表を作り、ランダムフォレストとXGBoostを3つの検証方法で評価した（抄録）。", "p5": "空間的な検証ではF1が0.47〜0.56、ROC-AUCが0.80〜0.84で、ランダム分割の楽観的な推定（F1 0.77〜0.80、ROC-AUC 0.95）を大きく下回った。SHAPではSAR後方散乱の変化が全体で最も重要で、雲のない画像がある所では光学指数がより効いた（抄録）。", "fun": "AIの精度を測るとき、テスト用の場所をランダムに選ぶと、すぐ隣の似た場所で学習していることになり点数が甘くなります。この研究では、地域ごとまるごとテストに回すと精度がはっきり下がることを示しました。点数の高さより、本当に初めての場所で当たるかを確かめる大切さがよく分かる例です。", "unverified": "35の重要区間の選び方の詳細と、2つの豪雨の間で精度がどう違ったかは抄録では未確認。"}}, {"id": "pr24", "rank": 24, "headline": "燃え尽きた従業員の自己記述は語彙と記号に表れる", "title": "Linguistic markers of professional burnout in employees' self-descriptive texts: a comparative corpus analysis and the limits of applicability of dictionary-based AI methods", "url": "https://doi.org/10.5281/zenodo.24015413", "authors": "Zhanibek Shaimukhamet", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-06", "apa": "Shaimukhamet, Z. (2026). Linguistic markers of professional burnout in employees' self-descriptive texts: a comparative corpus analysis and the limits of applicability of dictionary-based AI methods. Zenodo. https://doi.org/10.5281/ZENODO.24015413", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "燃え尽きた従業員と仕事に熱意のある従業員の自己記述文を比べて語彙や記号の違いを確かめ、辞書ベースのAI手法の限界を検討した（抄録）。", "p3": "英語の自己記述文37本（7,053語、燃え尽き群20、熱意・満足群17）で、AIによる予備分析から作った仮説を語彙・統語・表記・語用の水準で、1,000語あたりの頻度、ダニングの対数尤度比、フィッシャーの正確検定で検定した（抄録）。", "p5": "肯定的な感情語（5.2対16.8‰）、感嘆符（1.7対11.5‰）、義務の表現（3.9対0.4‰）、絶対的な語（10.4対4.1‰）などで群が異なり、一人称単数の頻度は差がなかった。燃え尽きの目印とされた感嘆符・大文字・悲しい絵文字は確認されなかった（抄録）。", "fun": "疲れ切った人の文章には特徴が出るのでは、と考えるのは自然です。この研究では、燃え尽きた人は前向きな言葉や感嘆符が少なく、義務を表す言い方や「いつも」「絶対」のような極端な言葉が多い傾向が見られました。一方で、悲しい絵文字が多いといった、いかにもありそうな目印は確認されず、思い込みで作った指標は当てにならないと分かる点が面白いところです。", "unverified": "燃え尽きの判定方法と文章の集め方、標本が小さいことによる結果の安定性は抄録では未確認。"}}, {"id": "pr25", "rank": 25, "headline": "高齢者の双方向の支援・年齢差別・生産的活動の網目構造", "title": "Interconnections among 2-way social support, ambivalent ageism, productive ageing, and productive engagement in community-dwelling older adults: a network analysis", "url": "https://doi.org/10.21203/rs.3.rs-11317015/v1", "authors": "Zemei Xiao ほか", "venue": "Research Square (In Review)", "date": "2026-11-07", "apa": "Xiao, Z., Xia, X., Li, L., Zhang, X., Jia, J., Ding, X., & Gong, X. (2026). Interconnections among 2-way social support, ambivalent ageism, productive ageing, and productive engagement in community-dwelling older adults: a network analysis. https://doi.org/10.21203/rs.3.rs-11317015/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "地域の高齢者で、支援の授受・両面的エイジズム・生産的活動・生産的な関与の13の要素の結びつきをネットワーク分析で描いた（抄録）。", "p3": "中国・長沙の5つのコミュニティの高齢者549人の横断調査で、4つの尺度の13要素をノードとし、スピアマン相関にもとづくEBICglassoでネットワークを推定し、ノードの強さ・橋渡しの強さ・予測可能性・安定性を調べた（抄録）。", "p5": "有償労働が最も強いノードで、生産的な関与の橋渡しの強さが最も高かった（ただし単一ノードの群である）。最も強い結びつきは認知的な援助・身体の保護と望まない援助の間で、ネットワークは安定していた（抄録）。", "fun": "高齢者は支えられる側と思われがちですが、この研究では支援を与えることや働くことがネットワークの中心にあると分かりました。また、守ってあげようとする手助けが、望まない援助と強く結びついていました。善意の手助けが相手には余計なお世話に感じられるかもしれない、という身近な問題が数字に表れている点が面白いところです。", "unverified": "便宜的な標本による横断調査のため、要素間の因果の向きは抄録では未確認。"}}, {"id": "pr26", "rank": 26, "headline": "公営住宅の会話カードが示す住民の構造的孤立", "title": "What the Cards Don't Say: Homes NSW Table Talk Cards as Evidence of Structural Isolation in Social Housing Communities", "url": "https://doi.org/10.5281/zenodo.24033523", "authors": "Hall, Maggie", "venue": "Zenodo", "date": "2026-11-07", "apa": "Hall, M. (2026). What the Cards Don't Say: Homes NSW Table Talk Cards as Evidence of Structural Isolation in Social Housing Communities. Zenodo. https://doi.org/10.5281/ZENODO.24033523", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "公営住宅の住民向けの会話カードを長期居住者が読み解き、カードが住民の構造的な孤立を名指さずに記録していると論じた（抄録）。", "p3": "ニューサウスウェールズ州の公営住宅当局が住民の会話のきっかけとして作ったカードを、書かれていない内容に着目して7つの分類にわたり精読した（抄録）。", "p5": "居住の保障・転居・説明責任・意見への応答に関する問いが一貫して欠けていると指摘し、住民の意見への回答の公表、熟議の権限を持つ住民代表、コミュニティの基盤への政策上の優先の3つの是正を提案した（抄録）。", "fun": "住民どうしの会話のきっかけを作るカードは、仲良くなる助けになりそうに見えます。この論文は逆に、カードに何が書かれていないかに注目しました。住まいの将来や行政への意見など、住民が本当に気になる話題が抜けていることから、住民が孤立している構造が見えてくるというのです。書かれていないことから問題を読む、という読み方そのものが面白いところです。", "unverified": "当事者による解釈的な分析で、他の住民の見方との比較は抄録では未確認。"}}, {"id": "pr27", "rank": 27, "headline": "地域の起業家と市民の対話から10の政策提言を共創", "title": "Cedar Valley of Iowa Living Lab 2026: 10 Capacity-Building Briefs", "url": "https://doi.org/10.31235/osf.io/c47af", "authors": "Emmalinde Roelofse ほか", "venue": "SocArXiv", "date": "2026-11-07", "apa": "Roelofse, E., & Weber, M. (2026). Cedar Valley of Iowa Living Lab 2026: 10 Capacity-Building Briefs. いが面白いところです。", "unverified": "評価に使う具体的な尺度と分析計画の詳細は抄録では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "LLMの能力の伸びは乳児の発達と同じく相を持つ", "title": "Can LLMs Grow Like Children? A Developmental Analysis of Capability Trajectories in Language Model Training", "url": "https://doi.org/10.31234/osf.io/c8j7u", "authors": "Ran An ほか", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "An, R., Chung, T., & Libertus, K. (2026). Can LLMs Grow Like Children? A Developmental Analysis of Capability Trajectories in Language Model Training. https://doi.org/10.31234/osf.io/c8j7u", "why": "乳児の運動発達の解析手法を16のオープンLLMの学習途中27時点・5ベンチマークに当て、能力の伸びは連続的だが段階的で、移行点が少数の共通の時点に集まることを示した。モデル間の伸びの速さの違いはほぼモデルの大きさで説明された。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "相関のある入札者でもNN補間で最適オークションを設計", "title": "Extending Myerson's Optimal Auctions to Correlated Bidders via Neural Network Interpolation", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.24240", "authors": "Mingyu Guo ほか", "venue": "RePEc NEP", "date": "2026-10-26", "apa": "Guo, M., Liu, J., & Conitzer, V. (2026). Extending Myerson's Optimal Auctions to Correlated Bidders via Neural Network Interpolation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24240", "why": "マイヤーソンの最適オークションを相関のある入札者に拡張する問題（近似もNP困難）に対し、限界利益に基づく配分のニューラル補間、形式検証による耐戦略性の保証、修正手順を組み合わせ、合成・実データで最適に近い収益を得た。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "共通の潜在原因を補正すると媒介効果の多くが消える", "title": "Shared Cause Adjusted Mediation (SCAM): Introduction of method with empirical applications", "url": "https://doi.org/10.31234/osf.io/z2hpt", "authors": "Kimmo Sorjonen", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "Sorjonen, K. (2026). Shared Cause Adjusted Mediation (SCAM): Introduction of method with empirical applications. https://doi.org/10.31234/osf.io/z2hpt", "why": "予測変数・結果・媒介変数が共通の潜在原因を持つ場合に期待される関係を補正して媒介効果を推定する方法（SCAM）を提案し、既発表の4研究の直列媒介分析に当てると、報告された24の効果のうち有意なまま残ったのは5つ（21%）だった。"}, {"id": "pn04", "rank": 4, "field": in the epicentral area of the 2008 Wenchuan earthquake, China", "url": "https://doi.org/10.1007/s11069-026-08494-y", "authors": "Qingyun Shi ほか", "venue": "Natural Hazards", "date": "2026-11-06", "citescore": 7.6, "citescore_year": "2025", "apa": "Shi, Q., Zhang, W., Tang, C., Ma, Y., Zhou, W., Xiong, J., & Tie, Y. (2026). Quantifying the long-term evolution of post-earthquake debris-flow activity in the epicentral area of the 2008 Wenchuan earthquake, China. Natural Hazards, 122(23). https://doi.org/10.1007/s11069-026-08494-y", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2008年汶川地震の震源域の44流域で、崩壊地からの土砂供給と降雨強度を組み合わせた活動度指数を作り、地震後の土石流活動が数十年続きうることを示した（抄録）。", "p3": "2008〜2019年の多時期の崩壊地台帳から、崩壊地の面積密度・空間分布の指標・河道勾配を統合した土砂供給ポテンシャル（LSSP）を計算し、記録された土石流の誘発降雨の時間雨量と組み合わせて活動度指数（AI_DF）を導いた（抄録）。", "p5": "活動中の崩壊地面積は2008年の122.05km²から2019年の30.55km²に減ったが、多くの流域で土砂供給は2019年でも地震前より高かった。長期傾向から、2008〜2013年の活発期、2013〜2048年の減衰期、2048年以降の比較的安定な時期の3段階が示唆された（抄録）。", "fun": "大地震で山が崩れると、斜面や谷に大量の土砂が残り、その後の大雨のたびに土石流の材料になります。この研究は、崩れた跡の変化を10年以上追って、土石流の起こりやすさが地震直後に急増し、その後ゆっくり減っていく様子を数値で表しました。地震の影響が何十年も続くかもしれないという見通しは、災害が一度きりの出来事ではないことを教えてくれます。", "unverified": "2048年以降の安定期は当てはめた傾向からの外挿で、その不確実性の評価は抄録では未確認。"}}, {"id": "jr18", "rank": 18, "headline": "中国のスマートシティ政策は共同富裕指数を押し上げた", "title": "Smart City Pilot Policy and the Socioeconomic Dimensions of Sustainable Urban Development: Evidence from China", "url": "https://doi.org/10.3390/su182111348", "authors": "Shan Li ほか", "venue": "Sustainability", "date": "2026-11-06", "citescore": 8.9, "citescore_year": "2025", "apa": "Li, S., & Tang, Z. (2026). Smart City Pilot Policy and the Socioeconomic Dimensions of Sustainable Urban Development: Evidence from China. Sustainability, 18(21), 11348. https://doi.org/10.3390/su182111348", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国の2012年のスマートシティ試行政策が、経済の規模だけでなく都市と農村、地域間の発展の分配にも効いたかを、共同富裕指数で評価した（抄録）。", "p3": "167の地級市の2007〜2022年のパネルで、エントロピー重み付きTOPSISにより全体の繁栄・都市農村の統合・地域の協調からなる指数を作り、傾向スコアマッチングと差の差法（PSM-DID）で政策効果を推定した（抄録）。", "p5": "政策は指数を固定効果モデルで0.0328、統制つきPSM-DIDで0.0304押し上げた。効果は全体の繁栄に集中し、都市農村の統合では弱く、地域の協調では統計的に検出されなかった。東部の都市や、人的資本・情報基盤の整った都市で効果が大きかった（抄録）。", "fun": "スマートシティ政策は町を便利にしますが、その恩恵がみんなに行き渡るとは限りません。この研究は、豊かさの全体量・都市と農村の差・地域間の差を分けて測り、恩恵が主に全体の豊かさに表れ、地域間の差の縮小には表れないことを示しました。同じ政策でも、もともと条件の良い都市ほど効果が大きいという点が考えさせられるところです。", "unverified": "指数の構成要素と、試行都市の選ばれ方の偏りへの対処の詳細は抄録では未確認。"}}, {"id": "jr19", "rank": 19, "headline": "中間支持付き流体輸送管の非線形強制振動を解析", "title": "Nonlinear Forced Vibrations of a Fluid-Conveying Pipe with a Lumped-Mass Intermediate Support and Asymmetric Elastic Boundaries", "url": "https://doi.org/10.1142/s0219455428500587", "authors": "Qisong Miao ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-07", "citescore": 6.5, "citescore_year": "2025", "apa": "Miao, Q., Qin, Z., & Cao, T. (2026). Nonlinear Forced Vibrations of a Fluid-Conveying Pipe with a Lumped-Mass Intermediate Support and Asymmetric Elastic Boundaries. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500587", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "非対称な非線形の端部ばねと、質量・減衰・非線形剛性を持つ中間支持をもつ流体輸送管の強制振動を解析し、支持条件がモードごとに共振に与える影響を明らかにした（抄録）。", "p3": "オイラー・ベルヌーイはりのモデルをハミルトンの原理で導き、修正フーリエ・リッツ法で作った弾性境界に合うモード関数による4モードのガラーキン近似に縮約し、適応的なドルマン・プリンス法で周波数ごとに時間積分した。別に定式化したラグランジュ方程式の解との一致を確かめた（抄録）。", "p5": "流速は1次共振を低い周波数へずらし、2次共振付近の非線形の特徴を強めた。支持の質量は2次共振の振幅を単調でなく変え、支持の線形剛性を上げると1次共振を強く抑えた。3次剛性を上げると硬化型の応答の曲がりが生じ、強い非線形では周期1でない位相空間の軌道が現れた（抄録）。", "fun": "中を液体が流れるパイプは、流れの速さによって揺れやすさが変わります。この研究は、パイプの途中に置いた支えの重さや固さを変えると、どの揺れ方が強まり、どれが抑えられるかを計算で調べました。支えを重くすると揺れが単純に減るのではなく、増えたり減ったりするという結果は、身近な配管の設計にもつながる面白い発見です。", "unverified": "実験による検証の有無と、解析したパラメータの具体的な範囲は抄録では未確認。"}}, {"id": "jr20", "rank": 20, "headline": "財務困窮の農村病院が救急専門病院へ転換する過程", "title": "Policy Impact of the Rural Emergency Hospital Designation: A Mixed Methods Study of Leaders’ Conversion Experiences and Motivations", "url": "https://doi.org/10.1111/jrh.70240", "authors": "Christopher Wiggs ほか", "venue": "Journal of Rural Health", "date": "2026-11-06", "sjr": 1.411, "citescore": 5.8, "citescore_year": "2025", "apa": "Wiggs, C., Williams, D., & Wiley, K. (2026). Policy Impact of the Rural Emergency Hospital Designation: A Mixed Methods Study of Leaders’ Conversion Experiences and Motivations. The Journal of Rural Health, 42(4). https://doi.org/10.1111/jrh.70240", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "財務困窮の農村病院が閉鎖の代わりに救急・外来に特化した農村救急病院（REH）へ転換する過程を、財務の特徴と経営者の意思決定の両面から明らかにした（抄録）。", "p3": "説明的順次型の混合研究法で、メディケア原価報告・米国病院協会の年次調査・米国コミュニティ調査から作った病院年次パネル（2013〜2022年）で将来の転換病院を他の農村病院と比べ、14のREHの経営者に半構造化面接を行った（抄録）。", "p5": "転換前の病院は手元現金日数が少なく、売掛金の回収期間が長く、未補償の医療が多く、数年にわたる利益率の低下を示していた。経営者は転換を、財務困窮、損得の検討、外部の技術支援と系列化、規制の曖昧さや支払い遅延への対応という段階的な過程として語った（抄録）。", "fun": "田舎の病院が赤字で閉鎖されると、地域の人は救急医療を失います。アメリカでは入院をやめて救急と外来に絞れば支払いを受けられる制度ができ、この研究はその選択に至る病院の懐事情と経営者の悩みを調べました。閉鎖か存続かの二択ではなく、形を変えて残るという第三の道の難しさが見える点が面白いところです。", "unverified": "転換しなかった病院の経営者の視点と、転換後の財務の変化は抄録では未確認。"}}, {"id": "jr21", "rank": 21, "headline": "ゲームの満足は韓国で口コミ、日本で再利用に強く効く", "title": "Flow, Game Evaluation, and Player Loyalty in Mobile Games: Evidence from Korea and Japan", "url": "https://doi.org/10.3390/su182111334", "authors": "SunHee Kwon ほか", "venue": "Sustainability", "date": "2026-11-06", "citescore": 8.9, "citescore_year": "2025", "apa": "Kwon, S. H., Oh, S., & Bang, H. (2026). Flow, Game Evaluation, and Player Loyalty in Mobile Games: Evidence from Korea and Japan. Sustainability, 18(21), 11334. https://doi.org/10.3390/su182111334", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "韓国と日本の課金モバイルゲーム利用者で、没入感（フロー）とゲーム評価が満足を通じて口コミと再利用意図につながる経路を比べ、国による違いを示した（抄録）。", "p3": "サービス品質・システム品質・価格政策がゲーム評価を形づくり、フローとともに満足・口コミ・再利用意図に至る統合モデルを、PLS-SEM、ブートストラップ、測定不変性の確認、多群比較で検証した（抄録）。", "p5": "フローとゲーム評価は満足と正に関連し、満足は2つの忠誠意図と正に関連した。満足と口コミの関係は韓国で、満足と再利用意図の関係は日本で強い傾向があったが、国の差の統計的な支持は結果変数と多重検定の扱いに左右された（抄録）。", "fun": "同じように満足しているゲームの利用者でも、その満足を友達に話す行動に向けるか、自分が使い続ける行動に向けるかは国によって違うかもしれません。この研究では、韓国では口コミに、日本では使い続けることに満足が結びつきやすい傾向が見られました。満足の出口が文化によって変わるかもしれないという点が面白いところです。", "unverified": "各国の標本数と、国の差の検定の詳細な結果は抄録では未確認。"}}, {"id": "jr22", "rank": 22, "headline": "在宅高齢者の家族介護者が技術を使う障壁と促進要因", "title": "Barriers and Facilitators to Technology Use Among Caregivers of Homebound Older Adults: Descriptive Qualitative Study", "url": "https://doi.org/10.2196/96226", "authors": "Carina Katigbak ほか", "venue": "JMIR Aging", "date": "2026-11-06", "sjr": 1.245, "citescore": 6.4, "citescore_year": "2025", "apa": "Katigbak, C., Shenoy, E., Ramaswamy, P., Lee, J., Milbury, K., & Scott, K. (2026). Barriers and Facilitators to Technology Use Among Caregivers of Homebound Older Adults: Descriptive Qualitative Study. JMIR Aging, 9, e96226–e96226. https://doi.org/10.2196/96226", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "在宅の高齢者を介護する家族が健康関連の技術をどう受け止めているかを聞き取りで整理し、技術が負担を減らしも増やしもする逆説を示した（抄録）。", "p3": "介護者32人、臨床家6人、その他の情報提供者2人の計40人に、対面とオンラインのフォーカスグループと個別面接を行い、主題分析で主題を抽出した記述的質的研究（抄録）。", "p5": "「私たちのような人向けに作られていない」「天秤のつり合いを取る」「自分らしさを保つ」の3つの主題が得られた。技術は介護を楽にしうる一方で、費用・不確かさ・学習の負担・感情的な負担という新しい負担も生んでいた（抄録）。", "fun": "介護を助けるアプリや機器は増えていますが、使う人の事情に合っていなければ、かえって負担が増えます。この研究では、介護する家族が「私たちのような人向けに作られていない」と感じていることが浮かび上がりました。便利な道具を作るだけでは足りず、使う人の立場から設計し支える仕組みが必要だという点が面白いところです。", "unverified": "対象の地域と技術の種類の内訳は抄録では未確認。"}}, {"id": "jr23", "rank": 23, "headline": "横振動で土の切削抵抗が大きく減る仕組みをDEMで解明", "title": "Effects of Transverse Ultrasonic Vibration on Drag Reduction and Soil Disturbance in Soil Tillage: A DEM Investigation", "url": "https://doi.org/10.3390/agriculture16212433", "authors": "Shenghai Huang ほか", "venue": "Agriculture", "date": "2026-11-06", "citescore": 7.8, "citescore_year": "2025", "apa": "Huang, S., Liu, J., Liu, H., Qiao, Y., Li, X., Han, J., & Wang, J. (2026). Effects of Transverse Ultrasonic Vibration on Drag Reduction and Soil Disturbance in Soil Tillage: A DEM Investigation. Agriculture, 16(21), 2433. https://doi.org/10.3390/agriculture16212433", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "横方向の超音波振動で土の切削抵抗が大きく減る仕組みを、較正した個別要素法（DEM）で解析し、振幅が主要な設計変数であることを示した（抄録）。", "p3": "横振動の超音波振動支援切削の工具と土の系をDEMでモデル化し、振幅（30〜70µm）・周波数（25〜45kHz）・切削速度（0.03〜0.07m/s）の影響を調べた。20kHzの台上試験で8条件の予測力を確かめ、平均相対誤差は8.7%だった（抄録）。", "p5": "振幅が支配的で、抵抗の低減率を44.10%から68.18%に高めた。最適条件は70µm・25kHz・0.07m/sで、DEMで確かめた低減率は69.25%（予測69.53%）だった。振動は荷重を法線方向の圧縮から接線方向のせん断へ移し、結合の破壊を集中的な破断から漸進的な劣化に変えた（抄録）。", "fun": "畑を耕す刃を細かく震わせると、土を切る力が大きく減ることが知られています。この研究は、土を小さな粒の集まりとしてコンピュータで再現し、刃を横に揺らすと粒どうしの押し合いがずれ合いに変わり、土が一気に割れるのではなく少しずつ崩れていくことを示しました。目に見えない粒の世界から、抵抗が減る理由を説明した点が面白いところです。", "unverified": "砂質ローム・含水比9%以外の土での一般性は抄録では未確認。"}}, {"id": "jr24", "rank": 24, "headline": "AI書記の導入と当日記録完了を患者の言語別に比較", "title": "Artificial Intelligence Scribes and Same-Day Note Closure by Patient Language Preference and Interpreter Modality", "url": "https://doi.org/10.1001/jamanetworkopen.2026.42403", "authors": "Jorge A. Rodriguez ほか", "venue": "JAMA Network Open", "date": "2026-11-06", "sjr": 3.507, "citescore": 14.3, "citescore_year": "2025", "apa": "Rodriguez, J. A., Lipsitz, S. R., Ortega, G., You, J. G., Mishuris, R. G., & Samal, L. (2026). Artificial Intelligence Scribes and Same-Day Note Closure by Patient Language Preference and Interpreter Modality. JAMA Network Open, 9(11), e2642403. https://doi.org/10.1001/jamanetworkopen.2026.42403", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（抄録は目的の1文のみで、本文は入手できず）", "preprint": false, "short": true, "p1": "医療現場のAI書記（診察の会話から記録を作るAI）の利用と、診療記録を当日中に完了できるかの関連を、患者の希望言語と通訳の方法別に調べた横断研究（抄録）。", "p3": "横断研究の設計で、AI書記の利用と当日の記録完了の関連を、患者の言語の希望と通訳の形態ごとに評価した。データの規模と分析方法の詳細は抄録に記載がない（抄録）。", "p5": "結果の数値は抄録に示されておらず未確認である（抄録は研究の目的のみを述べる）。", "fun": "診察の会話を聞き取って記録を書いてくれるAIは、医師の書類仕事を減らすと期待されています。でも、患者が別の言語を話し、通訳が入る場面でも同じように役に立つのでしょうか。この研究は、便利な道具の効果が相手の言葉によって変わるかもしれないという、公平さの問いを立てている点が面白いところです。", "unverified": "対象の医療機関と件数、関連の大きさと方向は抄録では未確認（抄録が目的の1文のみ）。"}}, {"id": "jr25", "rank": 25, "headline": "職場の雑談は6つの典型的な状況に分かれる", "title": "More than just small talk: situational patterns of informal workplace communication", "url": "https://doi.org/10.1108/jcom-05-2026-0184", "authors": "Nora Denner ほか", "venue": "Journal of Communication Management", "date": "2026-11-06", "citescore": 5.0, "citescore_year": "2025", "apa": "Denner, N., & Koch, T. (2026). More than just small talk: situational patterns of informal workplace communication. Journal of Communication Management, 1–18. https://doi.org/10.1108/jcom-05-2026-0184", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "職場の雑談を7日間の日誌で記録し、人数・長さ・場所・話題の組み合わせから6つの典型的な会話の状況に分類した（抄録）。", "p3": "社会的アフォーダンス・社会的交換理論・社会的アイデンティティ理論にもとづき、従業員209人が958件の非公式な会話の話題・長さ・場所・相手・受け止めを記録した日誌データを、多水準の潜在クラス分析で分けた（抄録）。", "p5": "長めのやり取り、食堂での会話、チームの話、休憩中の冗談、席での対話、ちょっとした雑談の6つの状況が見つかり、集団の大きさ・長さ・空間・話題で系統的に異なっていた（抄録）。", "fun": "職場の雑談はムダ話と思われがちですが、仕事の調整や仲間意識を支える役割もあります。この研究は958件の雑談を記録して、食堂での会話や席での短いやり取りなど、場所と人数で決まる6つの型があることを示しました。何気ないおしゃべりにも決まったパターンがあるという点が面白いところです。", "unverified": "6つの状況とwell-beingの関係の分析結果と、対象の職場・国は抄録では未確認。"}}, {"id": "jr26", "rank": 26, "headline": "研究者は医師より燃え尽きが少ないが離職意図は多い", "title": "Occupational well-being of biomedical scientists in academic medical centers", "url": "https://doi.org/10.1093/acamed/wvag337", "authors": "Amy K Ribera ほか", "venue": "Academic Medicine", "date": "2026-11-05", "sjr": 1.42, "citescore": 6.8, "citescore_year": "2025", "apa": "Ribera, A. K., Trockel, M., Brazeau, C. M., Browning, A., Schumacher, J. A., Shanafelt, T. D., & Ligibel, J. A. (2026). Occupational well-being of biomedical scientists in academic medical centers. Academic Medicine. https://doi.org/10.1093/acamed/wvag337", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "米国の学術医療機関で、研究職の教員と医師の燃え尽き・職業的充実感・離職意図を1万人規模で比べ、両者の差を生む要因を調べた（抄録）。", "p3": "7機関の検証済みの調査（2022年3月〜2024年5月）で、10,032人（研究者2,231人、医師7,801人、回答率47.4%）の回答を記述統計と階層的な多変量回帰で分析した（抄録）。", "p5": "燃え尽きの基準を満たしたのは研究者35.4%、医師40.8%、高い充実感は43.8%と37.2%だったが、離職意図は研究者が37.3%と医師の34.9%より多かった。研究者は予定の裁量が大きく（6.07対4.04）、これを調整すると職種と燃え尽き・充実感の関係は逆転した（抄録）。", "fun": "研究者は医師より燃え尽きが少なく仕事に充実感を持つ人も多いのに、辞めたいと考える人は多いという、一見ちぐはぐな結果が出ました。さらに、研究者は予定を自分で決められる自由が大きく、その分をそろえて比べると、むしろ研究者の方が燃え尽きやすいことになります。時間の使い方の自由が心の健康を支えていることがよく分かる点が面白いところです。", "unverified": "要因の媒介の推定方法と、機関ごとの違いは抄録では未確認。"}}, {"id": "jr27", "rank": 27, "headline": "工学部生の所属感は自己効力感と進路計画につながる", "title": "Sense of belonging in engineering: A multigroup analysis of undergraduate engineering students", "url": "https://doi.org/10.1002/jee.70108", "authors": "Lydia Ross ほか", "venue": "Journal of Engineering Education", "date": "2026-11-07", "sjr": 2.278, "citescore": 12.4, "citescore_year": "2025", "apa": "Ross, L., Wang, J., & Terpkosh, T. (2026). Sense of belonging in engineering: A multigroup analysis of undergraduate engineering students. Journal of Engineering Education, 116(1). https://doi.org/10.1002/jee.70108", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "米国の工学部生600人超で、多様性を重んじる気持ち・所属感・自己効力感・学業への関与が進路の計画とどう関わるかを、人種別に比べた（抄録）。", "p3": "複数の大学の調査データを批判的構造方程式モデリング（critical SEM）で分析し、アジア系・黒人・ラテン系・白人の学生の違いを多群分析で評価した（抄録）。", "p5": "専攻への所属感は自己効力感と進路の計画に正に関連し、一般的な自己効力感は学業への関与と強く関連した。多様性の価値は専攻・大学への所属感と正に関連したが、進路の計画への累積的な間接効果は有意でなかった。いくつかの概念で潜在平均が人種集団間で異なった（抄録）。", "fun": "工学を学び続けるかどうかは、成績だけでなく「自分はここにいていい」と感じられるかに左右されます。この研究では、専攻への所属感が自信と進路の意思に結びついていることが示されました。多様性を大切にする気持ちが所属感を通じて自信を支えるという流れは、居場所づくりの大切さを数字で示している点が面白いところです。", "unverified": "人種集団ごとの経路の違いの詳細と、各集団の人数は抄録では未確認。"}}, {"id": "jr28", "rank": 28, "headline": "旅行者の距離適応力の尺度を開発し満足・再訪を予測", "title": "EXPRESS: Tourist distance adaptability: Scale development and validation", "url": "https://doi.org/10.1177/10963480261508554", "authors": "Yuan Qin ほか", "venue": "Journal of Hospitality and Tourism Research", "date": "2026-11-07", "sjr": 1.953, "citescore": 14.3, "citescore_year": "2025", "apa": "Qin, Y., Lin, S., Li, G., & WU, D. C. (2026). EXPRESS: Tourist distance adaptability: Scale development and validation. Journal of Hospitality & Tourism Research. https://doi.org/10.1177/10963480261508554", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "海外旅行者が文化や気候などの多次元の距離に適応する能力（旅行者の距離適応力）という概念を導入し、その尺度を開発・検証した（抄録）。", "p3": "経験学習理論にもとづき、気づき（敏感さ、リスク管理）、態度（前向きさ、寛容さ）、技能（柔軟性、調整、学習能力）、感情（感情的な反応）の4側面からなる尺度を作った（抄録）。", "p5": "距離適応力は旅行者の満足を高め、満足は再訪意図と好意的な口コミを高めた。尺度の信頼性の数値や標本の規模は抄録に示されていない（抄録）。", "fun": "海外旅行の楽しさは、行き先の魅力だけでなく、旅行者自身が慣れない環境にどれだけ順応できるかにも左右されます。この研究は、その順応する力を測る物差しを作り、力の高い人ほど旅に満足し、また行きたい、人に勧めたいと思うことを示しました。旅の満足を旅行者の側の力から説明する視点が面白いところです。", "unverified": "標本の規模と国籍、尺度の信頼性・妥当性の指標値は抄録では未確認。"}}, {"id": "jr29", "rank": 29, "headline": "近隣の定義の仕方で建造環境とDVの関係は変わる", "title": "Redefining Neighborhoods: The Multiscale Impact of the Built Environment on Intimate Partner Violence", "url": "https://doi.org/10.1007/s10940-026-09696-0", "authors": "Mengyu Liao ほか", "venue": "Journal of Quantitative Criminology", "date": "2026-11-06", "sjr": 1.398, "citescore": 9.0, "citescore_year": "2025", "apa": "Liao, M., Xie, M., Wolf, L., Stewart, K., & Oshan, T. (2026). Redefining Neighborhoods: The Multiscale Impact of the Built Environment on Intimate Partner Violence. Journal of Quantitative Criminology. https://doi.org/10.1007/s10940-026-09696-0", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "近隣の範囲の定義の仕方で、建造環境と親密なパートナーからの暴力（IPV）の関係の推定が大きく変わることを示し、特徴ごとに効く空間スケールを推定する方法を示した（抄録）。", "p3": "シカゴの2023年の国勢調査ブロックグループ単位のIPV率を、4つの社会経済的統制と、空き家・緑地・酒類販売店・IPV関連のシェルターの4つの建造環境で説明した。境界をそのまま使う基準モデル、固定半径の緩衝帯のモデル、変数ごとに緩衝帯の大きさを推定するGASSモデルを比べた（抄録）。", "p5": "建造環境とIPVの関連は近隣の作り方に非常に敏感で、回帰係数の符号や有意性が変わった。GASSモデルはより頑健で、他のモデルでは見えない特徴ごとの空間スケールを明らかにした（抄録）。", "fun": "近所とはどこまでを指すのでしょうか。行政の区画の線で区切るか、中心から半径何メートルで区切るかで、緑地や空き家が暴力と関係あるかどうかの結論が逆になることすらありました。この研究は、特徴ごとに効く距離が違うことをデータから見つける方法を示しています。範囲の決め方で答えが変わるという、地図を使う分析すべてに通じる問題が面白いところです。", "unverified": "各建造環境の特徴で推定された具体的な空間スケールは抄録では未確認。"}}, {"id": "jr30", "rank": 30, "headline": "生成AIは豪州の小さな町をどう描くかを5システムで比較", "title": "Pastiche, place and peripheries: algorithmic visions of Australian small towns and cities", "url": "https://doi.org/10.1177/1329878x261505111", "authors": "T.J. Thomson ほか", "venue": "Media International Australia", "date": "2026-11-07", "sjr": 0.833, "citescore": 5.6, "citescore_year": "2025", "apa": "Thomson, T. J., & Hess, K. (2026). Pastiche, place and peripheries: algorithmic visions of Australian small towns and cities. Media International Australia. https://doi.org/10.1177/1329878x261505111", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "5つの生成AIに豪州の小さな町とその名所を描かせ、学習データの少ない場所をAIがどう表象するかを記号論的に分析した（抄録）。", "p3": "ChatGPT、CoPilot、Firefly、Gemini、Meta AIに、6つの小さな町と各町の周辺の4つの名所を描かせ、画像の表現様式（印象派風から写実的まで）、縦横比、視点の高さ、文字や記号を含むかを体系的に評価した（抄録）。", "p5": "名所を描いて場所を示すのか、文字や記号でラベルを付けて示すのかの度合いを検討し、パスティーシュ（模倣作品）の理論で描写の正確さと住民・非住民への含意を考察した。定量的な結果は抄録に示されていない（抄録）。", "fun": "画像生成AIに有名な大都市を描かせるとそれらしい絵が出ますが、情報の少ない小さな町ではどうなるでしょうか。この研究は、AIがそうした町を、その町らしい名所を描いて伝えるのか、看板の文字などのラベルで伝えるのかを分析しました。AIの描く町が、そこに住む人と遠くの人にとって何を意味するのかを問う点が面白いところです。", "unverified": "どのAIがどの描き方をしたかの具体的な結果は抄録では未確認。"}}, {"id": "jr31", "rank": 31, "headline": "封鎖下の家族介護者の精神的な休業を全国記録で分析", "title": "Mental-Health-Related Temporary Work Disability Among Informal Caregivers During the COVID-19 Lockdown in Spain (March-June 2020): A Nationwide Occupational Health Study.", "url": "https://doi.org/10.3390/jcm15103746", "authors": "Gutiérrez Naharro EM ほか", "venue": "Zenodo (Journal article)", "date": "2026-11-06", "citescore": 5.2, "citescore_year": "2025", "apa": "Gutiérrez Naharro, E. M., Fernández Sáez, J., Ayuso Margañon, R., Montserrat Gala, A. M., Ponce Blandón, J., & Sillero Sillero, A. (2026). Mental-Health-Related Temporary Work Disability Among Informal Caregivers During the COVID-19 Lockdown in Spain (March–June 2020): A Nationwide Occupational Health Study. Journal of Clinical Medicine, 15(10), 3746. https://doi.org/10.3390/jcm15103746", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された掲載論文の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "スペインのコロナ第1次封鎖期に、精神疾患による一時的な就労不能の半数以上が家族介護の責任を持つ労働者に生じていたことを、全国の労災保険組合の記録で示した（抄録）。", "p3": "労災保険組合（Mutua Asepeyo）の匿名化された全国記録で、2020年3月14日〜6月21日に精神・行動の障害（ICD-10のF00〜F99）で認定された一時的な就労不能の全件を、記録上の介護責任の有無で比べる記述的研究を行った（抄録）。", "p5": "介護者に関わる事例は2,857件で、全体の55.6%（95%信頼区間54.2〜57.0）を占めた。68.1%が女性、59.3%が高齢の要介護者の介護者で、全般性不安障害が最も多く、地域による差も大きかった。記述的で調整のない分析のため因果は推論できない（抄録）。", "fun": "コロナで介護サービスが止まると、その分の世話は家族が担うことになりました。この研究では、その時期に心の不調で仕事を休んだ人の半分以上が、家族を介護する責任を持つ人だったことが分かりました。介護という家の中の見えない仕事が、職場での健康にまで影響していることを示している点が考えさせられるところです。", "unverified": "介護者でない労働者との調整済みの比較は未確認（著者も因果は推論できないとする）。"}}, {"id": "jr32", "rank": 32, "headline": "女性の都市農業の場は男性の人脈を介して得られる", "title": "The gendered right to the city: Mediated access, urban agriculture and women’s empowerment in Kumasi", "url": "https://doi.org/10.1177/00420980261503405", "authors": "Mary Duah ほか", "venue": "Urban Studies", "date": "2026-11-07", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Duah, M., Forkuor, J. B., Forkuor, D., Agyemang, E., & Benyin, F. A. S. (2026). The gendered right to the city: Mediated access, urban agriculture and women’s empowerment in Kumasi. Urban Studies. https://doi.org/10.1177/00420980261503405", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ガーナ・クマシで女性が都市農業の土地にアクセスする過程を分析し、女性の都市への権利が男性の人脈を介した関係的な権利として実現していることを示した（抄録）。", "p3": "カビールのエンパワメントの枠組みとルフェーブルの都市への権利の考えを統合し、ジェンダー・身体・エンパワメントが交わる場として、都市空間の農業利用へのアクセスと使い方を分析した。調査方法の詳細は抄録に記載がない（抄録）。", "p5": "男性のネットワークが門番となって女性の土地へのアクセスを仲介していた。女性はこの空間を、心身の健康や身体の自己決定を高め、子どもの世代の都市への権利を求める形で使っていた（抄録）。", "fun": "町なかの空き地で野菜を育てることは、食べ物を得るだけでなく、自分の居場所を持つことでもあります。この研究では、ガーナの都市で女性がそうした土地を使えるのは、男性の知り合いを通じてであることが分かりました。権利が法律だけでなく人間関係を通じて手に入るという、権利の見方を広げる点が面白いところです。", "unverified": "調査の対象者数と方法（面接・観察など）は抄録では未確認。"}}, {"id": "jr33", "rank": 33, "headline": "看護師の燃え尽きは4か月後の仕事への熱意と負に関連", "title": "Associations between the two components of compassion fatigue, the Big Five personality traits, and work engagement among nurses: a two-stage survey study", "url": "https://doi.org/10.1186/s12912-026-05645-1", "authors": "Min Xie ほか", "venue": "BMC Nursing", "date": "2026-11-06", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Xie, M., & Zhao, M. (2026). Associations between the two components of compassion fatigue, the Big Five personality traits, and work engagement among nurses: a two-stage survey study. BMC Nursing. https://doi.org/10.1186/s12912-026-05645-1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "看護師の共感疲労を二次的外傷と燃え尽きの2要素に分け、約4か月後の仕事への熱意（ワーク・エンゲイジメント）との関係と、ビッグファイブ性格の調整効果を調べた（抄録）。", "p3": "中国の1病院の看護師332人の2段階調査の二次分析で、第1段階で共感疲労と性格を、約4か月後の第2段階で仕事への熱意を測り、階層的回帰とPROCESSによる調整分析（ボンフェローニ補正）を行った（抄録）。", "p5": "最終モデルは熱意の分散の52.9%を説明した。燃え尽きは熱意と負に関連し（β=−0.343）、二次的外傷は燃え尽きと性格を調整すると正に関連した（β=0.258）が、単相関は負で抑制効果の可能性がある。外向性・開放性・誠実性は正に関連し、性格による調整効果はなかった（抄録）。", "fun": "患者のつらさに寄り添う看護師は、心がすり減る共感疲労を抱えやすい仕事です。この研究では、燃え尽きが強い人ほど約4か月後の仕事への熱意が低い一方、患者のつらさを引き受ける心の傷のほうは、ほかの条件をそろえると逆に熱意と正の関係を示しました。ただし見かけの関係の可能性もあり、統計の読み方の難しさが分かる点が面白いところです。", "unverified": "便宜的な1病院の標本で、他の施設・国での一般性は抄録では未確認。"}}, {"id": "jr34", "rank": 34, "headline": "電動オフロード車フレームのモードを3手法で比較", "title": "Integrated Analytical, Finite Element and Experimental Modal Analysis of Off-Road Electric Vehicle Frames for Mobility-Assist Applications", "url": "https://doi.org/10.1007/s42417-026-02854-5", "authors": "Igor Ansoategui ほか", "venue": "Journal of Vibration Engineering & Technologies", "date": "2026-11-06", "citescore": 4.5, "citescore_year": "2025", "apa": "Ansoategui, I., Garitaonaindia, U., Boyano, A. I., & Etxebarria, S. (2026). Integrated Analytical, Finite Element and Experimental Modal Analysis of Off-Road Electric Vehicle Frames for Mobility-Assist Applications. Journal of Vibration Engineering & Technologies, 14(8). https://doi.org/10.1007/s42417-026-02854-5", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "身体機能の低い人の移動を助ける電動オフロード車の3つのフレームについて、簡易モデルからFEM・実験までの手法で振動特性を予測する精度を比べた（抄録）。", "p3": "2自由度・4自由度から6自由度までの集中定数モデル、3次元剛体モデル、有限要素（FE）解析を、試作車の打撃試験と加速度計による実験モード解析（EMA）の結果と比べた（抄録）。", "p5": "簡易モデルは12Hz以下の低次モードを正確に再現し、3次元剛体モデルとFEはロールとピッチの連成や局所的な構造の影響を捉えた。実験は構造の継ぎ目・タイヤ剛性・境界条件の影響を示し、残る差は減衰と溶接の不完全さによるとされた（抄録）。", "fun": "車の揺れを計算で予測するとき、車を数個のばねとおもりで表す簡単なモデルで済むのか、細かい部品まで再現する必要があるのかは悩みどころです。この研究では、ゆっくりした大きな揺れは簡単なモデルで十分に予測でき、ねじれのような複雑な揺れには詳しいモデルが必要だと分かりました。目的の揺れに合わせてモデルの細かさを選べばよいという点が実用的で面白いところです。", "unverified": "各モデルと実験の固有振動数の一致度の数値は抄録では未確認。"}}, {"id": "jr35", "rank": 35, "headline": "環境情報開示研究117本を書誌計量とTCCMで整理", "title": "Environmental Disclosure Research Revisited: A Bibliometric–TCCM Synthesis of Theoretical Integration and Methodological Diversification", "url": "https://doi.org/10.1002/bse.71824", "authors": "Sanketkumar Babubhai Vachhani ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-07", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Vachhani, S. B., Chavda, D. R., Varma, V. J., Dodia, B. M., Tiwari, R. V., & Suva, H. D. (2026). Environmental Disclosure Research Revisited: A Bibliometric–TCCM Synthesis of Theoretical Integration and Methodological Diversification. Business Strategy and the Environment. https://doi.org/10.1002/bse.71824", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2016〜2026年の企業の環境情報開示の研究117本を、書誌計量とTCCM（理論・文脈・特性・方法）の枠組みで整理し、研究の構造と空白を示した（抄録）。", "p3": "Scopusの査読論文をPRISMA 2020とSPAR-4-SLRの手順で選び、BibliometrixとVOSviewerによる書誌計量分析とTCCMで、知的構造・主題の発展・研究の空白を描いた（抄録）。", "p5": "研究は2023年以降に大きく増え、発表数は中国、引用の影響は英国が最大だった。正統性・ステークホルダー・制度の理論が主流だが統合されずに並列で使われ、開示の質・グリーンイノベーション・成果は研究が手薄だった（抄録）。", "fun": "企業が環境への取り組みをどう公表するかは、投資家や社会にとって大事な情報です。この研究は、その公表を扱った研究117本を整理し、どの理論が使われ、何がまだ調べられていないかを地図のように示しました。研究者が増えても、理論どうしがつながらずに並んでいるだけという指摘が、研究の進め方への問いとして面白いところです。", "unverified": "主題の分類の基準とクラスターの内訳は抄録では未確認。"}}, {"id": "jr36", "rank": 36, "headline": "Z世代の超高速ファッションへの忠誠をSEMとQCAで分析", "title": "Analyzing Consumer Loyalty to Ultra‐Fast Fashion: An Integrative Analysis Based on the Stimulus‐Organism‐Response Model", "url": "https://doi.org/10.1002/mar.70302", "authors": "Cayetano Medina‐Molina ほか", "venue": "Psychology and Marketing", "date": "2026-11-07", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Medina‐Molina, C., Quijano‐Bordas, G., Ramanauske, N., & Ribeiro‐Navarrete, S. (2026). Analyzing Consumer Loyalty to Ultra‐Fast Fashion: An Integrative Analysis Based on the Stimulus‐Organism‐Response Model. Psychology & Marketing. https://doi.org/10.1002/mar.70302", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "Z世代の超高速ファッションへのブランド忠誠を、刺激・生体・反応（S-O-R）モデルの線形的な見方と、条件の組み合わせによる見方の両方で説明した（抄録）。", "p3": "超高速ファッションの消費者208人の質問紙データを、PLS-SEMと質的比較分析（QCA）の2段階で分析した（抄録）。", "p5": "消費者の持続可能性への意識は直接にも媒介を通じても忠誠と関連し、SNSでの仲間とのやり取りはブランド・エクイティを介してのみ関連した。QCAでは、高い忠誠にも低い忠誠にもブランド・エクイティが重要な条件だった（抄録）。", "fun": "環境に優しくありたいと思いながら、安くて流行りの服をたくさん買ってしまう。この研究は、そんな態度と行動のずれを抱えたZ世代の買い物を調べました。条件の組み合わせで分析すると、同じ要因でも組み合わせ方で忠誠が高くも低くもなることが分かり、心の中の矛盾を乗り越える仕組みが見えてくる点が面白いところです。", "unverified": "標本の国と集め方、QCAで得られた具体的な条件の組み合わせは抄録では未確認。"}}, {"id": "jr37", "rank": 37, "headline": "高齢者の孤独を減らす地域介入のRCTを系統的に整理", "title": "Intervenciones comunitarias para reducir el sentimiento de soledad en personas mayores: una revisión sistemática", "url": "https://doi.org/10.19136/hs.a25ni.6441", "authors": "Reyna Felipe López ほか", "venue": "Horizonte Sanitario", "date": "2026-11-05", "apa": "Felipe López, R., Velázquez Domínguez, F., Rodríguez Hernández Rodríguez-Hernández Rodríguez-Hernández, J. J., & Cruz Quevedo, J. E. (2026). <b>Community interventions to reduce feelings of loneliness in the elderly: a systematic review<\/b> Horizonte Sanitario, 25(I), e6441. https://doi.org/10.19136/hs.a25ni.6441", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "60歳以上の高齢者の孤独感を減らす地域介入の効果を、ランダム化比較試験（RCT）に限った系統的レビューで整理した（抄録）。", "p3": "PRISMA 2020とコクランの指針に沿い、中南米・欧州・アジアで過去11年に行われたスペイン語・英語・ポルトガル語のRCTを複数のデータベースなどで探し、CONSORT 2010で質とバイアスを評価した（抄録）。", "p5": "7,810件から13件が基準を満たした。効果のある地域介入は、身体活動、ピアサポート、瞑想、ICTの活用、社会的支援を組み合わせた多職種のアプローチだった（抄録）。", "fun": "高齢者の孤独は心と体の健康に影響しますが、何をすれば孤独が和らぐのかは簡単には分かりません。この研究は厳密な比較試験だけを集め、運動や仲間どうしの支え合い、ITの活用などを組み合わせた地域の取り組みが効果的だと整理しました。一つの特効薬ではなく、体と心と人づきあいを同時に支える組み合わせが大事という点が面白いところです。", "unverified": "効果の大きさの統合（メタ分析）の有無と、各介入の効果量は抄録では未確認。"}}, {"id": "jr38", "rank": 38, "headline": "構造モデルの誤りを潜在力とベイズNNで補うデジタルツイン", "title": "Probabilistic digital twin for misspecified structural dynamical systems via latent force modeling "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "落石シミュレーションの結果が地形データ（DEM）の解像度に左右される問題に対し、地形の粗さを接触判定の中で幾何学的に与えるモデルを示し、解像度への依存を大きく減らした（抄録）。", "p3": "剛体の非平滑力学の枠組みで、粗さをDEMに埋め込まず、接触判定に使う地形の高さと局所的な接触座標の向きを数式で修正する。2次元では振幅と周波数が空間的に変わる正弦関数、3次元では粗さ指標や代表粒径から設定するパーリンノイズで粗さを表す（抄録）。", "p5": "Chant Suraの試験斜面で、センチメートル級のDEMを基準に0.5〜20mの粗いDEMを粗さの有無で比べ、堆積の分布と速度場の解像度への依存を大きく減らした。非常に粗い解像度では大きな地形の平滑化によるずれが残りうる（抄録）。", "fun": "落石の計算では、地面の細かなでこぼこが岩の跳ね方や止まる位置を大きく左右します。地形データが粗いとでこぼこがならされ、岩が遠くまで転がりすぎてしまいます。この研究は、粗い地図に見えないでこぼこを数式で後から足すことで、細かい地図で計算した結果に近づけました。足りない情報を物理的にもっともらしく補う発想が面白いところです。", "unverified": "速度や到達距離の誤差の具体的な数値は抄録では未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "格差のあるHANKモデルでの最適な金融・財政ルール", "title": "Optimal Policy Rules in HANK", "url": "https://doi.org/10.1093/restud/rdag069", "authors": "Alisdair McKay ほか", "venue": "Review of Economic Studies", "date": "2026-11-05", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "名目硬直性と異質な家計を持つ景気循環モデルで、短期金利と一括移転の2つの手段を持つ政策当局の最適ルールを導いた。分配の目的を加えても金融政策はほとんど変わらず、累進的な効果が強い給付金が景気変動の分配への影響を和らげるのに適することを示した。"}, {"id": "jn02", "rank": 2, "field": "統計学", "headline": "ノックオフ法をベイズ化し偽発見率を制御", "title": "Bayesian knockoff filter for controlling false discovery rate", "url": "https://doi.org/10.1073/pnas.2535745123", "authors": "Jiaqi Gu ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-06", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "ノックオフ変数をMCMCの各反復で生成するベイズ版ノックオフフィルタを提案し、帰無仮説の事後確率の上界にもとづく変数選択と、e値による頻度論的な偽発見率の保証を与えた。一度だけ生成するノックオフのばらつきを除き、事前分布で補助情報を取り込める。"}, {"id": "jn03", "rank": 3, "field": "統計学", "headline": "プロビット回帰の尤度は正則化なしで強対数凹になる", "title": "Strong log-concavity in probit regression", "url": "https://doi.org/10.1093/biomet/asag072", "authors": "M Chak ほか", "venue": "Biometrika", "date": "2026-11-04", "sjr": 3.4, "citescore": 5.4, "citescore_year": "2025", "why": "ロジスティック回帰と違い、プロビット回帰の尤度はリッジ正則化なしで強対数凹性を持つことを示し  "Social media platforms and innovation in UK fashion retail firms: a TOE–affordance explanation", "url": "https://doi.org/10.1108/jeim-02-2026-0270", "authors": "Ghadeer R. Alsaeed ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-07", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "why": "英国の衣料小売12社のマーケティング管理者60人への面接と328の資料から、SNSプラットフォームの情報が製品・工程の革新の判断にどう解釈・利用されるかを、TOE枠組みとアフォーダンス理論で説明した。"}, {"id": "jn16", "rank": 16, "field": "物理学", "headline": "粗いポテンシャル中の拡散を任意の次元で解析的に予測", "title": "Diffusion in a d -dimensional rough potential", "url": "https://doi.org/10.1073/pnas.2601219123", "authors": "Jacob Jeffries ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-06", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "ザワンツィグの1次元の結果を任意の次元に一般化し、平均初通過時間の解析で雑音を含む固溶体中の拡散係数のモデルを導いた。粗さは常に拡散を遅くし、合金化で拡散が速まるなら平均活性化エネルギーの低下によることを示し、運動論的モンテカルロと比較した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "雑音を含む固溶体（粗いポテンシャル）中の拡散係数を任意の次元で解析的に与えるモデルを導き、ザワンツィグの1次元の結果を一般化した（抄録）。", "p3": "平均初通過時間の解析で、d次元の粗いポテンシャル中の拡散係数のモデルを作り、運動論的モンテカルロ・シミュレーションと比較した（抄録）。", "p5": "粗さは常に拡散を遅くし、濃厚合金の遅い拡散の理論と整合した。合金元素で拡散が速まるなら、それは雑音ではなく平均活性化エネルギーの低下によることを示した。解析結果はd≤5でシミュレーションとよく、d≤3で非常によく一致した（抄録）。", "fun": "金属の中で原子が動き回る道は、でこぼこの坂道のようなもので、でこぼこが不規則だと進みにくくなります。この研究は、そのでこぼこの効果を1次元だけでなく何次元でも計算できる式を導き、でこぼこは必ず動きを遅くすることを示しました。1988年に1次元で示された有名な結果を、ようやく任意の次元に広げた点が面白いところです。", "unverified": "モデルの仮定（雑音の分布や相関）の詳細と、実在の合金への適用例は抄録では未確認。"}}, {"id": "jn17", "rank": 17, "field": "気候科学", "headline": "海洋鉄散布の炭素除去は南大洋南部で最も持続的", "title": "Revisiting the additionality and durability of carbon uptake in large-scale ocean iron fertilization", "url": "https://doi.org/10.1126/sciadv.aed1631", "authors": "Kyung-Min Noh ほか", "venue": "Science Advances", "date": "2026-11-06", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "1世紀にわたる海洋への鉄散布のシミュレーションで、南大洋南部での散布は約30PgCを吸収し、他の鉄制限海域では非散布海域の放出で70〜100%が相殺されることを示した。散布終了後も南大洋南部では追加炭素の約50%が残った。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "大規模な海洋への鉄散布による炭素除去を追加性と持続性の観点から再評価し、南大洋南部が最も有利だが、吸収量は従来の推定より小さいことを示した（抄録）。", "p3": "1世紀にわたる鉄散布を海域ごとに仮定した数値シミュレーションで、散布海域の吸収と非散布海域での放出による相殺、散布終了後の炭素の保持を調べた（抄録）。", "p5": "南大洋南部での散布は約30PgC（年約0.3PgC）を吸収し、全球に散布した場合の追加吸収とほぼ同じだった。他の鉄制限海域では非散布海域の放出で70〜100%が相殺された。30年で散布を止めた後、南大洋南部では追加炭素の約50%が残り、他の海域ではほとんど残らなかった（抄録）。", "fun": "海に鉄をまくとプランクトンが増えて二酸化炭素を吸い込むので、温暖化対策になるという案があります。ところがこの研究の計算では、多くの海域では吸い込んだ分が別の海域から吐き出されて帳消しになってしまいました。地球全体で収支を見ないと効果を見誤るという点が、環境対策の難しさを教えてくれる面白いところです。", "unverified": "使った海洋生態系モデルの名称と、モデル間の不確実性の大きさは抄録では未確認。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "Bコープ認証のビールへの支払意思額を選択実験で測る", "title": "Willingness to Pay for Craft Beer: The Role of B‐Corp Certification and Origin of Ingredients", "url": "https://doi.org/10.1002/aepp.70142", "authors": "Meri Hambaryan ほか", "venue": "Applied Economic Perspectives and Policy", "date": "2026-11-07", "sjr": 1.289, "citescore": 8.5, "citescore_year": "2025", "why": "2,346人の選択実験で、Bコープ認証と原料の産地に対するフロリダのクラフトビールの支払意思額を推定し、情報提示後に支払意思額が上がること、温かい満足感（warm glow）が認証ビールの支払意思額と正に関連することを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "フロリダのクラフトビールについて、Bコープ認証と原料の産地に対する消費者の支払意思額（WTP）を選択実験で推定した（抄録）。", "p3": "2,346人の選択実験で、Bコープ認証の影響と、利他性・温かい満足感（warm glow）・主観的規範などの行動特性の影響を分析した（抄録）。", "p5": "情報提示の後に支払意思額が有意に上がり、温かい満足感の自己報告とBコープ認証ビールの支払意思額の間に正の関係が見られた。支払意思額の具体的な金額は抄録に示されていない（抄録）。", "fun": "社会や環境に配慮した会社であることを示すBコープ認証の印があると、ビールに高いお金を払う気になるのでしょうか。この研究では、認証の意味を説明されると払ってもよい金額が上がり、良いことをして気分が良くなる人ほど認証ビールに高い値をつけました。商品の価値が中身だけでなく、買う人の気持ちの満足からも生まれる点が面白いところです。", "unverified": "支払意思額の上昇幅と、原料の産地の効果の大きさは抄録では未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "動きの事前分布を学ぶ拡散型の3次元人物姿勢推定", "title": "MvP: Learning Motion Prior for Diffusion-Based 3D Human Pose Estimation", "url": "https://doi.org/10.1109/tpami.2026.3751442", "authors": "Bing Han ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "拡散モデルによる3次元人物姿勢推定に、学習した動きの事前分布を組み込む手法（MvP）で、IEEE TPAMIに掲載された（抄録は候補の段階で未取得）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、拡散モデルによる3次元の人物姿勢推定に、学習した動きの事前分布（motion prior）を組み込む手法MvP。具体的な仕組みと評価は題名からは分からない（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "動画から人の関節の3次元の位置を推定するとき、画面だけでは奥行きが分からず迷いが生じます。題名から読み取れる問いは、人の体がふつうどう動くかという知識をあらかじめ学んでおき、それを手がかりに推定を安定させられるかということです。経験にもとづく予想で見えない部分を補う、人の見方に似た発想が面白いところです。", "unverified": "手法の詳細、評価データ、精度の改善幅はすべて未確認（題名のみ）。"}}, {"id": "jn20", "rank": 20, "field": "機械学習", "headline": "マルチモーダル学習の相乗効果を変分法で統一的に扱う", "title": "InfMasking: A Unified Variational Framework for Synergistic Multimodal Learning", "url": "https://doi.org/10.1109/tpami.2026.3751348", "authors": "Liangjian Wen ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-06", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "複数のモダリティの相乗効果を引き出すマスキングを変分的な枠組みで統一する手法（InfMasking）で、IEEE TPAMIに掲載された（抄録は候補の段階で未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "マルチモーダル学習で、複数のモダリティがそろったときにだけ得られる相乗的な情報を引き出すため、無限個のマスクに対する一貫性を課す統一的な枠組みInfMaskingを示した（抄録）。", "p3": "融合の前に各モダリティの特徴をランダムにマスクし、各マスクで得られる部分的な組み合わせの融合表現が、参照の目標（教師なしではマスクなしの融合表現、ラベルがあればクラスの代表）と一貫するよう学習する。無限個のマスクの期待値は、融合表現をガウス分布とみなした閉形式の変分下界で最適化する（抄録）。", "p5": "評価したベンチマークで予測性能が上がり、学習した表現の相乗性の推定値（PID）と予測器の相互作用の寄与（InterSHAP）が高くなったとする。具体的な数値は抄録にない（抄録）。", "fun": "画像と音声のように複数の情報を組み合わせるAIは、一番分かりやすい情報だけに頼って、組み合わせてこそ分かることを見落としがちです。この研究は、学習中にわざと情報の一部を隠し、どんな欠け方をしても同じ答えに近づくよう訓練しました。あえて情報を隠すことで、組み合わせの力を引き出すという発想が面白いところです。", "unverified": "使ったベンチマークの名称と、既存手法との差の数値は抄録では未確認。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "配置を指定して3   ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
