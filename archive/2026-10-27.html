を説明（調整R²=.233）。性能期待B=.179、努力期待.167、信頼.160、利便性.143が正で、期待確認はp=.077。AI経験群で満足に差なし（p=.763）。各尺度のα=.452〜.526と低い（抄録）。", "fun": "スマホ決済に満足する人は何を評価しているのかを調べた研究だが、面白いのは自分たちの質問紙の信頼性が低すぎることを正直に書き、結論を保留した点である。良い結果だけを並べるのではなく、測り方の弱さを先に認める論文は、何を信じるべきかを読者に教えてくれる。", "unverified": "回答者の募集方法は抄録から不明で、著者も出所を課題に挙げている。"}}, {"id": "pr49", "rank": 49, "headline": "放射線検査の付き添い拒否とケア責任の配分", "title": "Accompaniment refusal in radiological examination for disabled and cognitively impaired patients: a normative analysis of care responsibility allocation in China", "url": "https://doi.org/10.21203/rs.3.rs-11479022/v1", "authors": "Junjie Zhang ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Zhang, J., Huang, X., Li, Z., Yu, L., & Meng, X. (2026). Accompaniment refusal in radiological examination for disabled and cognitively impaired patients: a normative analysis of care responsibility allocation in China. https://doi.org/10.21203/rs.3.rs-11479022/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。抄録は途中で切れている。本文は入手できず", "preprint": true, "short": true, "p1": "中国の病院で放射線検査に付き添う家族が被ばくを恐れて検査室に入らないとき、障害や認知症のある患者のケア責任を家族・病院・国にどう配分すべきかを規範的に分析した。", "p3": "原則主義・ケア倫理・責任倫理を統合し、ICRP Publication 138の価値枠組みで放射線防護の論法を内側から検証する。規範文書と文献、放射線科の複合事例を資料にする（抄録）。", "p5": "3つの緊張を特定した。線量回避に矮小化した防護は最適化原則の誤用で、付添者の線量は懸念水準を桁違いに下回るため拒否は害を移すだけ。儒教的な家族倫理に埋め込まれた介護責任と家族自身の自己防護の要求が衝突する（抄録）。", "fun": "病院に付き添いの職員がいないと、検査室で患者を支えるのは家族になる。家族が「放射線が怖い」と入室を断ると、患者は縛られたり放置されたりする。この論文は、実際の被ばく量が心配する水準よりはるかに低いことを示しつつ、家族の恐れを責めるのではなく、誰がケアの責任を負うべきかを原理から考え直した。", "unverified": "抄録が途中で切れており、第3の緊張と結論は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "徒歩通学バスへの参加を決める親の視点", "title": "Parental Perspectives on the Walking School Bus: Survey Evidence from Ferrara, Italy", "url": "https://econpapers.repec.org/RePEc:srt:wpaper:1326", "authors": "Giuseppe Rocco", "venue": "RePEc NEP", "date": "2026-10-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "RePEc（EconPapers）の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "子どもが大人の付き添いで集団登校する「徒歩通学バス」への親の参加を、イタリア・フェラーラの15小学校の親711人の調査で、行動・社会・経済の要因から説明した。", "p3": "子どもが実際に参加している親、制度はあるが使っていない学校の親、制度のない学校の親の3群を比べ、支払意思額と受入意思額も尋ねた（抄録）。", "p5": "環境的・教育的価値には広く同意がある一方、自家用車への依存が根強い。集合場所までの距離、時間割の不一致、ボランティア不足といった運営上の障壁が、価値観による抵抗より重要。対人信頼と市民参加は参加と結びつくが、組織的・制度的支援と組み合わさって初めて安定する。親は徒歩通学バスを金銭化できるサービスではなく象徴的価値の高い集合財と見ている（抄録）。", "fun": "「歩く通学バス」は良い制度だと親のほとんどが認めているのに、使う人は少ない。理由は反対ではなく、集合場所が遠い、時間が合わない、付き添い役が足りないという段取りの問題だった。さらに親はこの制度を「お金で買うサービス」ではなく「みんなの財産」と見ており、値段をつけること自体になじまない。良い制度が広まらない理由を丁寧に分けた研究である。", "unverified": "順序ロジットによる本格的な分析は別論文に委ねられ、本稿は記述的な結果にとどまる。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "経営者は最良の報酬契約を過小評価する", "title": "Beliefs Over Contracts", "url": "https://doi.org/10.3386/w35788", "authors": "Francis Annan ほか", "venue": "NBER Working Paper", "apa": "Annan, F., & Raymond, C. (2026). Beliefs Over Contracts. National Bureau of Economic Research. https://doi.org/10.3386/w35788", "why": "経営者の信念調査と大規模な現場実験で、最良の契約が利益を55%超上げたのに経営者はそれを低く順位づけ、教科書的な契約理論の方が正しく予測したことを示した。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "1440通りの合成コントロールで推定は大きく揺れる", "title": "We Just Created More Than 1,000 Synthetic Controls To Study California's $20 Fast Food Minimum Wage", "url": "https://doi.org/10.3386/w35931", "authors": "Jeffrey Clemens ほか", "venue": "NBER Working Paper", "apa": "Clemens, J., Edwards, O., Meer, J., & Nguyen, J. D. (2026). We Just Created More Than 1,000 Synthetic Controls To Study California's $20 Fast Food Minimum Wage (NBER Working Paper No. 35931). National Bureau of Economic Research. https://www.nber.org/papers/w35931", "why": "カリフォルニアの20ドル最低賃金の雇用効果を1,440の仕様で推定し、96%超が負でも幅が広く、単純なDiDが分布の中心に来ることを示した。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "L-momentごとの平行トレンドで分布DiDを緩める", "title": "Parallel Trends as a Spectrum", "url": "https://arxiv.org/abs/2610.31978", "authors": "Kyle Schindl ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Schindl, K., Fry, J., Gunsilius, F., & Wasserman, L. (2026). Parallel Trends as a Spectrum (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31978", "why": "位置・散布・歪度などのL-momentに平行トレンドを課す識別条件の階層を提案し、効率的推定量と同時推論を与えて分布DiDの仮定を選べるようにした。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§2.2 スペクトルの定義、§5 実証応用と表3、§6 結論）を読んだ。§2.3〜§4の理論（効率性、推定量、同時推論、次数の選択）と付録の証明は読んでいない", "preprint": true, "p1": "差の差（DiD）法で「平均だけ」と「分布全体」の間に、L-moment（分位関数をずらしたLegendre多項式に射影した量）ごとに平行トレンドを課す識別条件の階層を作り、位置・散らばり・歪度・尖度のうち必要な特徴だけを選んで分布的な処置効果を推定できるようにした。", "p2": "処置は平均をほとんど変えずに分散や歪度を変えることがあるが、分布的DiD（Athey–Imbens、Callawayらなど）は反事実分布全体の動態に強い平行トレンドを課すため非現実的になりうる。研究者が本当に知りたい特徴を識別するためだけなら、そこまで強い仮定は要らないはずだった（§1）。", "p3": "分布の分位関数Q(u)を、ずらしたLegendre多項式P*_{k−1}(u)で射影した第k L-moment λ_k=∫Q(u)P*_{k−1}(u)duで表す（Hosking 1990、§2.2）。第1は平均、第2は散らばり（Gini平均差）、第3は非対称、第4以降は裾と形を表し、1次モーメントが有限なら定義でき重い裾に頑健である。平行トレンドをk次までのL-momentに課す「平行トレンドのスペクトル」を定義し、対象外の成分は無制約のまま残す。高次のL-momentが減衰する条件、効率的推定量、次数が増えていくときの同時推論を与える（§2.4、§3）。直観：分布の「形」を少数の係数に分解し、信じられる係数にだけ平行トレンドを仮定する。", "p4": "応用はEngelhardt and Gruber（2011）の設計に従い、2006年導入のMedicare Part Dが高齢者の処方薬の自己負担支出に与えた効果を、MEPSの60歳以上標本で65歳以上を処置群、60〜64歳を比較群として2005年対2007年で推定する（処置群3,592／3,470人、対照群1,154／1,237人、§5）。第1〜4 L-momentの効果と、Gini係数・L-歪度・L-尖度の効果（デルタ法）、乗数ブートストラップ（1万回）による同時信頼区間で評価する（表3）。良いとする基準は、平均効果だけでは見えない散らばりの変化を、分布全体の平行トレンドを仮定せずに検出できること。", "p5": "第1 L-moment（平均）の効果は−279.0ドル（SE 46.6、2007年ドル）で、Engelhardt–Gruberの−293と近い。第2 L-momentは−170.1（SE 36.2）、第3は−69.1（SE 28.0）と有意に減り、第4は−24.7（SE 23.1）で有意でない（表3）。Gini係数0.013、L-歪度0.034、L-尖度0.054の効果は正だが有意でなく、散らばりの減少が平均の減少と比例的で相対的な不平等は変わらなかったと解釈する。第2 L-momentの効果から個人効果の標準偏差の下限√3×|Δλ₂|=294.6ドル（片側CI [171.7,∞)）が得られ、平均効果の大きさを上回る異質性があると結論する（§5）。", "p6": "著者が明示する限界は読んだ範囲では限られるが、識別は選んだ次数までのL-momentへの平行トレンドに依存し、次数の選択（§4）が結果を左右する。解釈：2005年対2007年の2時点比較で、処置群と対照群の年齢差による傾向の違いは標準的なDiDと同じ前提に乗っている。高次L-momentの効果は推定精度が落ちる（第4のSEは効果とほぼ同じ）。", "fun": "「薬代の自己負担が平均で279ドル減った」だけでは、高額の負担に苦しむ人が救われたかは分からない。この研究は分布の形を「平均・散らばり・歪み・尖り」という部品に分解し、信じられる部品にだけ「もし制度がなければ両グループは同じように動いた」と仮定する。結果、散らばりも大きく減っており、しかも計算上、人によって効果の差が平均効果より大きいことまで言えた。分布を丸ごと仮定せずに、必要な分だけ仮定を足す発想である。", "unverified": "§2.3〜§4の効率性理論・推定量の構成・次数の選択基準（表4）と付録の証明は読んでいない。表3の同時信頼区間の計算の詳細は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AI曝露の高い専攻は卒業後の雇用と収入が急落", "title": "Graduating Into Disruption: Labor Market Outcomes for AI-Exposed College Majors", "url": "https://econpapers.repec.org/RePEc:cen:wpaper:26-56", "authors": "Cody Orr ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "行政記録で、ChatGPT登場直後からAI曝露の高い専攻の初職就業率が5ポイント、初期収入が13%下がり、不況期の卒業に匹敵することを示した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "実ユーザ6万セッションで買い物エージェントを評価", "title": "UserArena: Benchmarking Interactive User Simulation for Long-Horizon Shopping Agents", "url": "https://arxiv.org/abs/2610.30932", "authors": "Jujia Zhao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "apa": "Zhao, J., Tang, J., Yu, J., Chen, W., Wu, J., Zhu, H., Sun, F., Verberne, S., & Ren, Z. (2026). UserArena: Benchmarking Interactive User Simulation for Long-Horizon Shopping Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30932", "why": "11,010人の64,729セッションと本番A/Bテストの結果に対して、長期の利用者模擬を5段階で検証できる基盤と軌跡蒸留法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§2.2 評価プロトコル、§4.2 主結果の記述、§4.3 本番A/B検証と表3、§6 結論、図1）を読んだ。表2の数値、§3のOPTDの式、付録は読んでいない", "preprint": true, "p1": "大手ECサイトの実ユーザの長期の行動軌跡と実行可能な環境を組み合わせた買い物エージェント用ベンチマークUserArenaを作り、模擬ユーザの忠実度を5段階で評価し、本番のA/Bテストの結果と突き合わせられるようにした。あわせて模擬ユーザの学習法OPTDを提案した。", "p2": "エージェント型推薦の学習と評価には、環境とユーザの反応を模擬する「推薦世界モデル」が要るが、既存データは実ユーザのプロファイル・画面・商品文脈・行動をセッションをまたいで揃えた長期軌跡をほとんど持たず、評価も次の1手の一致率に偏って長期の行動傾向の保持を測れず、模擬での方針比較が本番A/Bの結果と一致するかも検証されていなかった（§1）。", "p3": "アジア最大級のECプラットフォームで記録した11,010ユーザ・566,102商品・64,729セッション軌跡と13種の行動（§1、図1）。評価はReplay（実セッションの各状態から次の行動を予測）とRollout（模擬ユーザが自由に行動して終了まで進む）の2モードで、L0 環境適合（有効行動率）、L1 局所忠実度（行動種別F1と対象一致の精度）、L2 系列忠実度（商品ページ後の決定分布のJS距離、行動数の誤差）、L3 個人化した母集団忠実度、L4 結果忠実度の5段階（§2.2）。OPTDは軌跡水準の意図を使い、学習者自身のロールアウトの各トークンに教師の全語彙分布を与える蒸留で、信頼領域と接地項で記録された反応から離れすぎないようにする（§3、図2）。直観：模擬ユーザに「一手の正解」ではなく「その人らしい流れ」を教える。", "p4": "単一セッションと、同じユーザの複数セッションを時系列に並べた横断セッションの2設定でL0〜L4を比べる（表2）。本番検証は、同じ2つのランキング方針を各模擬ユーザで評価し、凍結した1万ユーザを2群に分けてページビュー当たりクリック率の差（ΔPV-CTR）を本番A/Bの値で割った効果比と、1からの絶対偏差（効果誤差）で測る（§4.3、表3）。良いとする基準は、効果比が1に近いこと。", "p5": "単一セッションでOPTDはL1〜L4の8指標すべてで1位（表2、§4.2）。本番A/B検証では、効果比がShop-R1 0.162、Customer-R1 0.191、AlignUSER 0.020、STA 0.297、OPTD 0.713、Qwen3.5-2B 0.004、GPT-6-Sol 1.576、GPT-6-Luna 2.154で、OPTDの効果誤差0.287が最小。汎用の大規模モデル（GPT-6系）は本番の反応を過大に見積もり、モデルの能力が行動の較正に直結しないことを示す（表3、§4.3）。A/B Agentはクリック率誤差では競争的だが有効行動率が低い（§4.2）。", "p6": "著者は、今後の課題としてリーダーボードの整備と、セッションをまたいで変化する選好と行動の一貫性を保つ長期シミュレータの開発を挙げる（§6）。解釈：データは単一プラットフォーム由来で、A/B検証は1組の方針対に限られる。表2の具体的な数値は読んでおらず、OPTDと他手法の差の大きさは未確認。", "fun": "ネット通販のおすすめ機能を改良したとき、本当に売上が伸びるかは実際に客に試す（A/Bテスト）しかなかった。この研究は1万1千人の本物の買い物記録で「客の分身」を作って試す土俵を用意し、分身の出した答えと本物のA/Bテストの結果を比べた。驚くのは、最新の巨大AIに客を演じさせると効果を2倍に見積もるなど大外れで、小さくても実データで鍛えた分身の方が本物に近かったことである。", "unverified": "表2のL0〜L4の数値、OPTDの目的関数（§3.4）、図3のアブレーションと人間評価の結果は読んでいない。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "時系列基盤モデルは介入ではなく相関を予測する", "title": "Forecasting Associations, Not Interventions: A Preregistered Causal Audit of Covariate-Aware Time Series Foundation Models", "url": "https://arxiv.org/abs/2610.31869", "authors": "Zong-Han Bai", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Bai, Z.-H. (2026). Forecasting Associations, Not Interventions: A Preregistered Causal Audit of Covariate-Aware Time Series Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31869", "why": "事前登録の監査で、共変量つき時系列基盤モデルが因果効果ではなく交絡を含む条件付き傾きを返すことを理論・挙動・表現の3水準で示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3.3 交絡ギャップ、§4 実験計画、§5.1〜5.3 結果、§7の表2の説明、§8 修復、§9 考察と限界、図1〜5）を読んだ。命題の証明（付録A）と§5.4〜5.6、§6、§7の実系の詳細は読んでいない", "preprint": true, "p1": "共変量の将来経路を与えて「もしこうしたら」を予測できる時系列基盤モデル（Chronos-2、TiRex-2、TabPFN-TS、TimesFM-2.5）が、介入効果ではなく観測上の相関（交絡込みの傾き）を、しかも回帰より強く交絡した形で答えることを、事前登録した監査で示し、数分の介入データでの追加学習で大半を直せることも示した。", "p2": "実務者は価格や投薬や制御量の計画をこれらのモデルに与え、予測の差を計画の効果と読む。これはPearlの階層の第2水準（介入）の問いだが、モデルは観測データの次値予測で訓練されている。実データだけでは観測と介入の答えが交絡を通じてしか違わないため、答えが効果か相関かを見分けられなかった（§1）。先行研究（Won 2026）は応答の大きさの減衰を示したが、正しい理由で応答しているかは問えなかった。", "p3": "同じ構造モデルから、共通原因Zが制御Xと結果Yの両方を動かす観測レジームと、Xを外生にした無作為化レジームで文脈を生成し、同じ問い do(X+δ) への効果推定の差を「交絡ギャップ」CG=E_obs[b₁]−E_int[b₁] と定義する（定義1、§3.3）。効果を識別するモデルはCG=0、相関を読むモデルはCG=交絡バイアスになる。文脈内最小二乗については文脈のモーメントからCGを閉じた形で導き（命題1）、どのモデルも置ける基準線にする。CG=0は必要条件に過ぎない（Xを無視するモデルもCG=0）ので、無作為化文脈でのバイアスと感度を組み合わせた「因果コンパス」で位置づける（図1c、図3）。直観：同じ質問を「原因が混ざった世界」と「混ざっていない世界」で2回して、答えが変わる分が相関の取り分。", "p4": "格子はα,γ∈{0,0.25,0.5,1,1.5}、β=1、長さL=512、予測H=64、δ=1σ_x、セルあたり200エピソード×3シード、交絡者の可視性3通り（隠す・過去のみ・将来既知）×2レジーム（§4）。良いとする基準は、交絡した16セルで測ったCGが命題1の基準線に対して傾き1（最小二乗と同じ）か0（因果）か、可視性V2（調整集合が文脈にある）でギャップが消えるか、β=0で偽の効果を報告しないか。実系は2つの物理系の無作為化アクチュエータ、修復の成功基準は事前登録でギャップ50%以上減かつM4-hourlyのMASE劣化5%以下。", "p5": "交絡者を隠すと4モデルのCGは命題1の予測の線形関数（R² 0.90〜1.00）で、TabPFN-TSは傾き1.00で最小二乗そのもの、Chronos-2・TiRex-2・TimesFM-2.5+XRegは傾き1.3〜1.8で回帰より強く交絡（超相関的）。過去のみの共変量は水準予測を変えるが効果推定は変えない（Chronos-2の平均ギャップ0.73対0.77）（§5.1、図2、表1）。調整集合を与えても最小二乗は完全に消すのに、Chronos-2は58%に部分調整、TabPFN-TSは89%残で無調整、TiRex-2は107%残で無作為化推定が0.97から0.63へ崩れる共変量支配、TimesFM-2.5+XRegは88%残（§5.2、図3）。β=0でも観測文脈では0.44〜0.72の効果を100%の偽陽性率で報告し、無作為化文脈では0.00（§5.3）。線形プローブでは事前学習済みエンコーダがレジーム（96%）と真の効果（R² 0.80/0.71）を符号化しているのに使っていない（図5）。無作為化レジームの3,000系列で2,000ステップ（ノートPCのGPUで5〜8分）の介入後学習は両可視性でギャップを−78%/−82%減らすが、M4のMASEが平均+47%悪化。KernelSynth（事前学習と同族）の再生と低ランク適応を組み合わせたv19はギャップ−54%/−63%、MASE+0.7%/+2.2%で基準を満たした（§8、表2、図8）。", "p6": "著者は、命題が線形ガウスモデルでのみ証明され非線形は経験的に扱うこと、追加学習の架構横断の証拠がTiRex-2の1回のみであること、低ランク版は超相関と縮小は直すが回帰水準の欠落変数バイアスは残すこと、実系での応答尺度の較正と分布内修復がトレードオフになること、予測コストが1ベンチマークでしか測られていないことを限界に挙げる（§9）。符号が逆の経路が打ち消し合う場合は修復が−15%/−44%に留まる（§8）。影響声明では、修復後のモデルが較正されないまま信頼される逆のリスクを指摘し、展開データで交絡ギャップを測って添えることを勧める。", "fun": "「価格を10円上げたら売上はどうなる」と予測AIに聞くと、もっともらしい数字が返ってくる。でもそれは「価格が高かった日は売上も高かった」という過去の相関を読んでいるだけかもしれない。この研究は、原因が混ざった世界と混ざっていない世界で同じ質問をして答えの差を測る仕掛けを作り、4つの有名モデルが全て相関を答えていた、しかも普通の回帰より強く騙されていたことを示した。面白いのは、モデルの内部は「これは混ざった世界だ」と96%の精度で見抜いているのに、答えには使っていなかったことである。", "unverified": "§5.4〜5.6（識別性の分割、非線形モデル、外部ベンチマーク）、§7の2つの物理系の数値、表2の全行、付録の証明は読んでいない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "洪水後の創造的破壊を災害支出が後押し", "title": "Cleansing Floods? Creative Destruction and Government Spending After Disasters", "url": "https://econpapers.repec.org/RePEc:cen:wpaper:26-52", "authors": "Tarikua Erda", "venue": "RePEc NEP", "date": "2026-10-26", "why": "米国の工場水準の秘匿データで、洪水後に低生産性の工場が退出し設備が高生産性の参入者に渡る過程を追い、連邦災害支出がその再配分を可能にすることを示した。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "H-2A季節労働ビザのRCTで家計は貧困を脱する", "title": "The Returns to Temporary Migration: Experimental Evidence from the H-2A Program", "url": "https://doi.org/10.3386/w35941", "authors": "Melanie Morten ほか", "venue": "NBER Working Paper", "apa": "Morten, M., Magaloni, B., Cubillos, S., & Wang, A. Y. (2026). The Returns to Temporary Migration: Experimental Evidence from the H-2A Program (NBER Working Paper No. 35941). National Bureau of Economic Research. https://www.nber.org/papers/w35941", "why": "メキシコ人労働者にH-2Aビザを無作為配分し、1季節で1.6万ドル超の収入、貧困率10ポイント低下を示す一方、家族の精神健康悪化などの副作用も記録した。"}, {"id": "pn09", "rank": 9, "field": "因果推論", "headline": "合成コントロールの適合期間と検証期間を分ける", "title": "Honest Inference for Synthetic Controls with Imperfect Fit: Time-Split Validity and the Choice of Anchor", "url": "https://arxiv.org/abs/2610.32383", "authors": "Rok Spruk", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Spruk, R. (2026). Honest Inference for Synthetic Controls with Imperfect Fit: Time-Split Validity and the Choice of Anchor (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32383", "why": "前処置期間を当てはめと検証に分割し、反事実の曲率に明示的な制約を置くことで有限標本の被覆率をもつ区間を与え、古典的応用の結論の外挿依存を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3.2 アンカー推定量、§5.2 推定重みつきシミュレーションの要約、§6 3つの古典的応用（6.1〜6.4）、表2・5の記述）を読んだ。§3.4〜3.7の理論、§4、付録の証明は読んでいない", "preprint": true, "p1": "処置ユニットがドナーの範囲外にあって合成コントロールが完全には当てはまらない短いパネルでも、前処置期間を「当てはめ用」と「検証用」に分けて、反事実の乖離の曲率に明示的な制約を置くことで、有限標本で名目以上の被覆率をもつ信頼区間と、「結論がどれだけの曲がりに耐えるか」を示す破綻曲率を得られるようにした。", "p2": "短いパネルでは、前処置の結果がドナー重みの選択・適合の評価・不確実性の評価という相反する役割を同じ観測に負わされる。処置ユニットがドナーの凸包の外にあると不完全な当てはめのバイアスは期間を増やしても消えず（Ferman and Pinto 2021）、当てはめに使っていない期間で合成ユニットは処置ユニットから漂流する。標本内残差に基づく通常の区間は漂流も系列相関も含まず、非現実的に狭い（§1、§6.4）。", "p3": "前処置期間を訓練ブロックと検証ブロックに分け、ドナー重みと時間アンカーλ（Σλ=1のアフィン重み、負値可）を訓練ブロックだけで決める。推定量は後処置期間の平均ギャップから検証ブロックのアンカーつきギャップを引いたもの（式(10)）。訓練に条件づければ誤差は有界なバイアス＋ガウス擾乱で、検証残差の直交射影から擾乱と独立な尺度推定が得られ、最悪バイアスをStudentの臨界半径に足して区間を作る（§1、§3.2）。実務上重要なのは「乖離の曲率がC以下」という感度クラスで、傾きは自由のまま。区間が初めて0を含む曲率C*を破綻曲率と呼び、ドナーのプラセボが示す曲率と比べて結論の頑健性を読む（§1、§3.6）。直観：地図のない先を直線で延ばすのではなく、「道がどれくらい曲がりうるか」の上限を決めて、その分だけ幅を取る。", "p4": "シミュレーションは14ドナー・1処置ユニット、前処置11期間（訓練5・検証6）、後処置10期間で処置ユニットの水準が最低ドナーより0.8低い設定。設計Aはドナーと同じ成長、Cは最も遅いドナーより年1.5低い成長、Dは係数0.85の持続雑音、B2は検証ブロック内の固有ショックで、Abadieらのプラセボ集合、Chernozhukovらのコンフォーマル集合とt検定、Cattaneoらの予測区間と95%水準で被覆率と長さを比べる（§5.2、表2）。応用は西ドイツ再統一、バスク地方、カリフォルニア州たばこ税の3古典例（§6、表5）。良いとする基準は、設計で課した制約の下で被覆率が名目以上で、かつ長さが過度に長くないこと。", "p5": "シミュレーションでは、Cattaneoらの予測区間が設計A・Cで99〜100%、持続雑音で85%、検証ブロックのショックで40%の被覆（長さ0.24〜0.78）。分割法は設計Cで0.31〜0.37の長さで被覆し、ショック下でも被覆する。Chernozhukovらのt検定は単体重みで設計A 42%・C 7%と過小被覆（§5.2）。応用では、西ドイツの破綻曲率は年²あたり72.5ドルで16のプラセボの最大43.5を上回り、C_donでの区間は[−5,793, −991]ドル/人。バスクは0.0033（千ドル）で16中6のプラセボが超え、カリフォルニアは0.017パック/年²で38中34のプラセボが超え、単体重みでは線形漂流でも0を含む（§6.1）。線形クラス（C=0）の区間は[−15.1,−1.0]パック、[−2,398,−1,826]ドル、[−1.08,−0.63]千ドルで、Cattaneoらの区間の1/5〜7/10の長さ。漂流を許さない一様アンカーは西ドイツで+629ドル[511,747]という誤った符号を出す（§6.2）。西ドイツは1990年を通常年として使うときのみ全プラセボの曲率に頑健で、カリフォルニアの結果は脆い（§6.1）。", "p6": "著者は、分割が点推定の精度を犠牲にすること（設計AでRMSE 0.061対0.048）、有効性は感度クラスが正しいときにのみ価値があること、プラセボ較正は交換可能性の仮定と同じ価値しかないこと、系列相関の較正は分割をまたぐ記憶には対応せず検証・後処置期間内の依存にのみ頑健であることを明示する（§5.2、§6.3）。解釈：検証ブロックを3期間まで減らせるが、Studentの臨界値が大きすぎて実用にならないと著者自身が述べる（§1）。", "fun": "「もしこの州でたばこ税を上げなかったら」を他の州の組合せで作る合成コントロール法は有名だが、似た州が見つからないと作り物が本物から少しずつずれていく。この研究は過去のデータを「作る期間」と「ずれを測る期間」に分け、ずれの「曲がり具合」に上限を置いて幅を取る。すると、教科書的なカリフォルニアのたばこ税の結果は、他の州が普通に見せる程度の曲がりで消えてしまうほど脆く、西ドイツ再統一の結果はずっと頑丈だと分かった。結論がどれだけの曲がりに耐えるかを一つの数で言えるのが新しい。", "unverified": "§3.4〜3.7（有限標本推論、アンカーの最適化、ドナー較正）と§4の理論の詳細、表2の全数値は読んでいない。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "50対50試験では単純回帰調整が勝つことも", "title": "Higher Order Asymptotics of Regression Adjustment Estimators for Causal Inference", "url": "https://arxiv.org/abs/2610.32023", "authors": "Anna Kelley ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Kelley, A., & Wager, S. (2026). Higher Order Asymptotics of Regression Adjustment Estimators for Causal Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32023", "why": "等確率割付では交互作用つき回帰と単純回帰の漸近分散が一致するため高次項で優劣が決まることを解析し、歪んだ特徴量では単純回帰が優れうると示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§2 定理2と系4の主張と解釈、§3 実行可能な推論の設定と結果の記述、表1・2の説明）を読んだ。証明（付録A）と数値検証（付録B〜C）は読んでいない", "preprint": true, "p1": "処置確率が0.5の無作為化試験では、交互作用つき回帰調整（IREG）と単純な回帰調整（REG）の1次の漸近分散が同じになるため、どちらが良いかを2次の漸近展開で比べ、特徴量が歪んで外れ値が大きな結果雑音を伴う実務上重要な設定では単純回帰が有意に勝ちうることを示した。", "p2": "Lin（2013）以来、交互作用つき回帰は差の平均と単純回帰を1次で弱く支配するとされ、安全な出発点と見なされてきたが、その厳密な優位は処置確率π≠0.5のときだけで、π=0.5ではどのデータ生成分布でも1次の精度は等しく、理論は指針を与えなかった。Zhao and Ding（2023）はパラメータ数の発見則で単純回帰の安定性を主張していた（§1）。", "p3": "共変量と潜在結果がiidで、処置群の大きさを固定して無作為に割り付ける完全無作為化試験を考え、差の平均・REG（Y〜α+Xβ+Wτ）・IREG（交互作用WXδを加え、共変量平均で評価）の3推定量を定義する（式(2)）。定理2は、上限つきMSEの差がD_p/n²+O(n⁻³)で、D_pが線形の処置効果異質性γに応じた共変量の形の項、γと残差の非対称の交差項、残差の不均一分散の項、非線形の誤指定の項の4ブロックからなることを示す（式(11)）。意味：どの項も単独では符号を決めず、γ=0でも残差の歪みの項で符号が変わる。系4は良く指定された線形・均一分散モデルではΔ=R²_τ[−(2p+3)+…]で、ガウス共変量ならΔ=−(p+1)R²_τとIREGが有利で、その差は共変量数pに比例して増える（式(12)）。直観：2次の項は「特徴量の歪み×効果の異質性×雑音の非対称」の掛け算で決まり、交互作用項を増やすほど歪んだ特徴量の影響を強く受ける。", "p4": "実行可能な推論では、Rのestimatrと同じ定義（HC1）にIREGには超母集団の補正項（式(14)）を加えたものと、最終推定量に対する削除1ジャックナイフ（式(15)）を比べる。14のデータ生成過程（ガウス、歪み、重い裾、稀な値の共変量、R²_τの範囲）でn=500、2万回反復し、RMSE・区間幅・被覆率を80／95／99%で評価する（§3、表1・2）。良いとする基準は、被覆率が名目に近く、幅が短く、RMSEが小さいこと。", "p5": "R²_τ<0.05では REG＋ジャックナイフが明確に優れ、95%被覆率は95.0〜97.6%、中央値の幅はIREG＋ジャックナイフの0.86〜1.00倍、IREG＋HC1＋補正（被覆93.7〜95.0%）の0.97〜1.00倍で、MSE比IREG/REGは1.00〜1.95。R²_τが歪んだ共変量とともに大きくなるとREGはどちらの分散推定でも過小被覆し（R²_τ=0.651でジャックナイフ86.0%）、IREG＋ジャックナイフが最も信頼できるがそれでも90.4%。稀な値の設計では6.3%の反復でIREGの一方の群に稀な1単位しかなく、その再適合の被覆は89.9%。HC1は95%と99%では名目に近いが80%では歪んだ設計で最大4.9ポイント過小で、95%の一致は較正の悪い区間の交点にすぎない。ジャックナイフはどの設計でも名目から0.2ポイント以上下がらず、最も重い裾では保守的（§3、表1・2）。", "p6": "著者は、定理が固定pでn→∞の2次展開であり、実務的な有限標本での優劣が「どちらか一方」に還元できないこと、IREGの補正項が異質性が小さいときに過大になりうること、稀な値の共変量でIREGの削除1推定が定義できない場合があることを示す（§2、§3）。解釈：論文は符号を一意に決める規則を与えず、R²_τ（1次分散に占める線形異質性の割合）が小さいか大きいかで推奨が分かれる。著者はコード生成と証明の確認に生成AIを使ったと明記している（脚注）。", "fun": "治療群と対照群を半々に分けた試験では、「交互作用つきの回帰の方が安全」という教科書の推奨は実は根拠がなく、1次の近似では両者の精度が全く同じになる。この研究はもう一段細かい2次の項まで計算し、特徴量が偏っていて外れ値に大きなばらつきが伴う（収入のようなデータでよくある）ときには、単純な回帰の方がはっきり良いことを示した。標準の頑健標準誤差（HC1）が95%ではたまたま合っているだけで80%では外れている、という指摘も実務には痛い。", "unverified": "定理2の証明と付録Bの数値検証（表3〜5）は読んでおらず、表1の各設計の具体的な数値は要約文で確認した範囲のみ。"}}, {"id": "pn11", "rank": 11, "field": "統計学", "headline": "最良スコアの楽観バイアスの鋭い上界を導出", "title": "Sharp Bounds on the Winner's Bias under Independent and Nonnegatively Correlated Noise", "url": "https://arxiv.org/abs/2610.31948", "authors": "Ivan Viakhirev ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Viakhirev, I., Borodin, K., & Mkrtchian, G. (2026). Sharp Bounds on the Winner's Bias under Independent and Nonnegatively Correlated Noise (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31948", "why": "M個の雑音つきスコアの最大値が持つ上方バイアスの鋭い定数を独立・非負相関の場合に決定し、Lean 4で形式検証し、448のモデル選択パイプラインで検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3 主結果（定理1、系1a・1b）、§4 交差検証のバイアス、§5 数値研究（データとパイプライン、実現割合、固定予算の設計効果、ガウスモデルとの比較、報告の手順）、§7 限界）を読んだ。定理3の証明とLean 4の形式検証の内容は読んでいない", "preprint": true, "p1": "M個の候補を雑音つきスコアで選んで最良の値を報告するときの楽観バイアスの最悪値を、雑音が独立な場合と非負相関の場合について閉じた形の鋭い定数で与え、交差検証の推定量のバイアスにも適用し、全ての定理をLean 4で形式検証した。", "p2": "不偏なスコアの最大値は上に偏り、その最悪値は c_M=sup E[max Z_i]/√V で決まる。任意の依存では√((M−1)/M)（Aven 1985）、iidでは(M−1)/√(M(2M−1))（Gumbel 1954）が知られていたが、実際の評価は候補ごとに精度が違うのでiidでなく、設計で固定される構造（候補ごとに別の問題なら独立、共通の問題なら正の相関）はどちらの極も捉えておらず、独立・非同一分布の鋭い定数は未発表だった（§1）。", "p3": "定理1（マスター境界）は E[max Z_i]≤√((M−1)/M)·√(V−M E[Z̄²]) で、平均からの偏差にAvenの境界を適用し、共分散の補正項が依存クラスを分ける。系1aは任意依存、系1bは対ごとの非負相関で (M−1)/M、定理3は独立雑音で √((M−1)/(2M)) を与え、後者は1本の確定的な候補と明示的な2点の連鎖で厳密に達成される（§1、§3）。証明は一般の分布を各候補の2点分布に還元し、M個の凸問題に分けて因数分解した3次式で閉じる。系2は K分割交差検証のバイアスを各クラスの定数で鋭く抑え、van Hasselt（2013）の予想（c=1）を解決する（§4）。直観：雑音が独立だと、各候補が同時に「上振れ」する確率が下がるため、最大値の膨らみは√2分の1になる。", "p4": "数値研究は2系統。Qwen2.5-7B-Instructを温度0/0.7、0/5ショット、思考連鎖の有無で組み合わせた8候補をMMLU-Pro（4,000問）、GSM8K（1,319）、ARC-Challenge（1,172）、MATH-500（500）で評価する設定と、4種類の分類器×4容量の16候補を手書き数字・乳がん・ワインのデータで評価する設定で、共通問題（非負相関クラス）と候補別問題（独立クラス）の2設計、合計448パイプラインを再標本化で調べる（§5）。良いとする基準は、測定した E[max Z_i] が各クラスの天井を超えないこと、および実現割合ρ=E[max Z_i]/(c√V)。", "p5": "全セルで測定値はクラスの天井以下（図1(a)）。実現割合ρは候補別問題で中央値0.75（最大0.84）、共通問題で中央値0.37（最大0.62）で、天井は実際の膨らみより約3分の1大きい。固定予算64問をMMLU-Proで共有すると楽観は3.09ポイント、8問×8ブロックに分けると18.87ポイントで6.1倍、共有設計は220対すべてで楽観が小さい（§5、表3）。共分散を合わせたガウスモデルは楽観を中央値0.89倍に見積もり、小予算では最大16倍過大、全候補が0.95超の3プールでは7.6〜7.9ポイントと予測するのに実測は2.1〜2.4（§5）。精度水準が高いほどρが下がる（相関−0.95）が、分散の不均一性とは相関0.25で追随しない。", "p6": "著者は、定数が各依存クラス内の最悪値であり表2が示すようにガウス雑音との差がMとともに広がること、定理3の達成構成が必ず確定的な候補を含むかはM=2でのみ証明され一般には予想であること、数値研究が単一7Bモデルの設定変化と小さな分類器に限られ、モデル規模を混ぜたプールは未検証であること、再標本化が唯一の乱数源で各候補の母集団スコアは固定として扱っていることを限界に挙げる（§7）。報告の手順として、天井は E[max Z_i] に対して候補別で1.3〜1.7倍、共有で2.4〜3.2倍大きく、報告される最良値の楽観に対してはさらに大きいので、どちらを抑えているかを明示すべきとする（§5）。", "fun": "いくつかのAI設定を試して一番良かった点数を発表すると、その点数は運の分だけ高く出る。この論文は、その「運の上乗せ」が最悪でどこまで大きいかを、候補ごとに別の問題で測るか同じ問題で測るかで分けて正確に計算した。意外なのは、同じ64問で測るなら、候補ごとに8問ずつ分けるより全員に同じ64問を解かせる方が上乗せが6分の1で済むことで、公平に見える「別々の問題」が実は一番ずるい結果を生む。証明はコンピュータ（Lean 4）で検証済みである。", "unverified": "定理3の証明の詳細、Lean 4で検証した定理の対応表（表4）、表1・2の定数の具体値は読んでいない。"}}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "固定・変量効果を超える偏り考慮メタ分析", "title": "Bias-aware meta-analysis: beyond fixed-effect and random-effects meta-analyses", "url": "https://arxiv.org/abs/2610.32183", "authors": "Mingxuan Zou ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Zou, M., & Ding, P. (2026). Bias-aware meta-analysis: beyond fixed-effect and random-effects meta-analyses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32183", "why": "各研究に未知の固定バイアスを許し、臨界値を折り畳み正規分位点に置き換えて、有意性のための最大バイアスと適合のための最小バイアスを報告する枠組みを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1.2 貢献、§3.1 BAMAの枠組み、§3.2 信頼区間の冒頭、§5.2 較正、§6 例（表1パネルAと図1〜3の記述）、§7 結論）を読んだ。§4の検定の導出、§4.3の楽観的区間、付録の証明と表1パネルBの数値は読み切れていない", "preprint": true, "p1": "メタ分析で各研究の固定・未知のバイアスを「標準化した大きさがb以下」と仮定するだけで、固定効果の点推定と標準誤差をそのまま使いつつ臨界値を折り畳み正規分位点に替えて信頼区間を作り、「有意性を覆すのに必要な最大バイアス」と「データと整合するのに必要な最小バイアス」を報告する枠組み（BAMA）を示した。", "p2": "固定効果メタ分析（FEMA）は全研究に共通の母数を仮定し、変量効果（REMA）は異質性をiidの変量効果として扱うが、その周辺でもやはり共通の母数を仮定し、研究ごとの偏りや異質性に頑健でない（抄録、§1.1）。", "p3": "J個の独立な研究で τ̂_j〜N(τ_j, σ_j²)、τ_j=τ+Δ_j とし、バイアスΔ_jに分布を仮定せず、|Δ_j/(√J σ_FE)|≤b という有界性だけを課す（仮定3）。√J σ_FEは固定効果の標準誤差を1研究分の尺度に戻したもので、bは測定単位に依らない。b=0でFEMAに戻り、bを感度パラメータとして区間の列を報告する（§3.1）。区間は τ̂_FE±σ_FE·L で中心をFEMAのまま半径だけ折り畳み正規分布の分位点に替える（式(6)、§3.2）。「有意性のための最大バイアス」は区間が初めて零を含むbで、近似的にはFEMAのt統計量の絶対値を√Jで割った値（§1.2）。モデル検査はCochranのQ統計量を非心χ²分布で評価し、Q検定が棄却しなくなる最小のbを「適合のための最小バイアス」として報告する（§4）。直観：「各研究はせいぜいこれくらいずれている」という上限1つで、結論がどこまで持つかを一本の線で示す。", "p4": "例はWilliamsら（2026）の抑うつ治療の比較で、Hamilton抑うつ評価尺度の変化（負が改善）について、公開図から再構成した開放ラベルの従来型抗うつ薬15試験と幻覚剤併用療法8試験をζ=0.05で別々に分析し、FEMA・REMA・分散膨張FEMAとBAMAの区間、最大バイアス、最小バイアスを比べる（§6、表1）。較正は、楽観的区間が零を除くときに、一研究除外の経験的バイアスや標準化差b_jと最大バイアスを比べて行う（§5.2、図3）。", "p5": "パネルAではFEMAの区間が従来型[−13.395,−12.762]、幻覚剤[−12.515,−10.018]、REMAが[−13.935,−11.270]と[−13.467,−9.593]で、研究間分散は幻覚剤でQ=15.215（自由度7、p=0.033）と異質性が大きい（表1）。BAMAでは両治療とも適合のための最小バイアスが正（Q検定を通すにはある程度のバイアスを許す必要がある）で、有意性のための最大バイアスはそれより大きく、その間のbでは区間が零を除く。楽観的区間（[−15.445,−10.711]、[−12.806,−9.727]）とp値も零を除き、全ての標準化差b_jが最大バイアスを下回った（図1〜3、§6）。", "p6": "著者は、bの上限はデータの外にあり領域知識で較正するしかないこと、本稿が処置-対照研究に限られネットワークメタ分析は別報に回すことを述べる（§5.2、§7）。解釈：最大バイアスと最小バイアスの具体的な数値は本文の表からは読み取れておらず、この例が「かなり大きなバイアスまで許容できる」という結論の定量的な根拠は未確認。研究内の分散σ_j²は既知として扱う。", "fun": "複数の臨床試験をまとめるとき、普通は「どの試験も同じ真の効果を測っている」か「ずれはランダム」と仮定するが、実際には試験ごとに癖のあるずれがある。この研究は「各試験のずれはこの大きさまで」という上限1つだけを置き、その上限を少しずつ大きくして結論がどこで消えるかを示す。結果が「ずれを大きく許しても有意」で、しかも「データの食い違いを説明するにはずれを少しは許す必要がある」という2つの数字で読めるのが新しい。", "unverified": "表1パネルBの最大バイアスと最小バイアスの数値（厳密値と近似値）、§4の非心パラメータの式、§4.3の楽観的区間の定義は読み切れておらず未確認。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "視覚と鍵盤操作だけで開放世界ゲームを遂行", "title": "HiSTEVE 1.0: Harnessing Human-Interface VLA Agents for Open-World Games", "url": "https://arxiv.org/abs/2610.31162", "authors": "Zecong Tang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "apa": "Tang, Z., Guan, Z., Guo, Y., Zhang, Z., Guo, Y., & Dai, B. (2026). HiSTEVE 1.0: Harnessing Human-Interface VLA Agents for Open-World Games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31162", "why": "階層的なVLAエージェントがMinecraftで視覚のみとキーボード・マウス操作で長期課題を達成し、MineStudio Benchで85.0%を記録した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§6.2 主結果（原子課題と長期課題）、§6.4 アブレーションの要約、§7 結論、表1・3の記述）を読んだ。§3〜5の設計の詳細と表1の全数値は読んでいない", "preprint": true, "p1": "視覚だけを見てキーボードとマウスを操作する単一のVLA（視覚-言語-行動）方策と、能力を考慮して計画・引き継ぎ・記憶を管理するハーネスを組み合わせ、Minecraftで人間と同じ入出力で原子課題と長期課題を遂行するエージェントHiSTEVEを示した。", "p2": "既存のMinecraftエージェントは、生の一人称画像からキー・マウス操作へ写す視覚運動方策（長期の課題状態の追跡が苦手）か、LLM/VLMによる計画（実行は環境APIや既定のスキルに依存し、多くのゲームでは使えない）のどちらかに偏り、課題状態の追跡・完了の検証・失敗からの回復を統合できていなかった。サブタスクの終了判定も早すぎれば未完、遅すぎれば行動を浪費し進捗を壊す（§1）。", "p3": "編成層では、進捗を追う構造化記憶とVLMプランナがVLAの能力内のサブタスクを選ぶ（能力制約つき計画）。サブタスク完了は、VLA方策の文脈に条件づけた「方策結合型の完了状態検出器」が候補完了を知らせ、証拠に基づいて引き継ぎと回復を行う。制御層では、単一のVLAが視覚のみとネイティブのキー・マウス行動で全サブタスクを実行し、GUI操作と非GUI操作の干渉を減らすために領域別のRMSNorm分岐とマウス移動トークンの分離を導入する。学習は世界知識の注入、模倣学習、環境フィードバックによる強化学習の3段階（抄録、§3〜4、§7）。直観：「何をすべきか考える頭」と「手を動かす体」を分け、体ができることだけを頭が頼む。", "p4": "原子課題はMineStudio Bench（Mine・Kill・Craft・Smeltの厳密pass@1）とOpenHA（課題族別の成功率と平均）、長期課題はLongBench（資源と製作、探索と記憶、回復、開放型の4族の最終目標成功率）で、OpenHA Text/CoAなどと比べる。アブレーションは領域別表現、段階学習、ハーネスの効果を分ける（§6、表1・3）。良いとする基準は成功率。", "p5": "MineStudioでMine 93.3%、Kill 86.7%、Craft 66.7%、Smelt 93.3%、平均85.0%（OpenHA Text/CoAの65.0%から20.0ポイント改善）。OpenHAは平均37.4%（基準36.8%）で、Embodiedが37.0%から46.0%に伸びる一方GUIとCombatはわずかに下回る。LongBenchは資源と製作42.9%、探索と記憶28.6%、回復14.3%、開放型14.3%で、基準比+28.6、+21.5、+11.4、+12.9ポイント（§6.2）。領域別表現はMineStudio Allを41.1%から単独で57.3%／61.9%、併用で80.7%に、世界知識注入は50.4%→65.1%、RLは80.7%に上げるがLongBenchの目標成功率は14.3%のまま。完全なハーネスは原子課題を81.2%→85.0%とわずかに変える一方、LongBenchの目標成功率を10.7%→25.0%に上げる（§6.4）。", "p6": "著者は、複数段階のGUI操作（部品配置や中間状態の修正）が依然として主要なボトルネックで、Craftが最も弱く、回復と開放型の長期課題は大幅に難しいままだと認める（§6.2）。解釈：評価はMinecraft内の3ベンチマークに限られ、他のゲームへの転移は示されていない。実行器の改善だけでは長期の調整は解けず、ハーネスが必要だという分離は、アブレーションの数値から読める。", "fun": "ゲームをAIにやらせる研究では、裏口（ゲーム内部の命令）を使って動かすことが多かった。この研究は人間と同じように画面を見てキーとマウスだけで操作し、しかも「頭」と「手」を分ける設計で、鉄のツルハシを材料集めから作り上げる長い作業までやり遂げた。面白いのは、手（操作の方策）をいくら鍛えても長い作業の成功率は変わらず、段取りを管理する頭の仕組みを足した途端に倍以上になったことである。", "unverified": "表1の比較手法の全数値、§3〜5の完了状態検出器の設計と§6.3の検出精度は読んでいない。"}}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "似た才能と異なる専門の創業チームが大きく育つ", "title": "Sorting into entrepreneurial teams", "url": "https://econpapers.repec.org/RePEc:boe:boeewp:023785", "authors": "Edoardo M Accabi ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "ポルトガルの雇用者-従業員・財務データで、才能が似て専門が異なるチームほど大きく長続きする企業をつくるが、そうした組合せは形成されにくいことを理論と計量で示した。", "explain": {"basis": "抄録", "basis_note": "RePEc経由の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "p1": "起業家がどのように創業チームに組み合わさるか（ソーティング）と、チームの構成が企業の規模・生産性・寿命をどう決めるかを、理論モデルとポルトガルの行政データで示し、相補的な人材が組めないことによる損失を定量化した。", "p2": "スキルの補完性があるとき、どんな人が単独でなくチームで起業を選ぶのか、そしてチームの組み合わせの失敗が企業分布にどう影響するかは分かっていなかった（抄録）。", "p3": "スキルの補完性により偏ったスキルプロファイルを持つ人にはチーム起業が魅力的になり、才能の類似性により他の職業より組むことが好ましくなるという職業選択とチーム形成の理論を作る。ポルトガルの雇用者-従業員接続データと貸借対照表データで検証し、モデルを較正して反実仮想を計算する（抄録）。", "p4": "抄録の範囲では、標本期間・企業数・推定法は示されていない。良いとする基準は、理論の予測（類似した才能×異なる専門のチームの優位）がデータで確認され、較正モデルが観測パターンを再現すること。", "p5": "才能が似て専門分野が異なるチームは、より大きく、生産的で、長続きする企業を作るが、スキルの異なる創業者ほど一緒に創業しにくい。較正モデルの反実仮想では、創業者の偏った接触（exposure）を減らすと活動が低生産性の単独企業からより生産的なチームへ再配分される。最適割当の基準と比べると、偏りのない無作為探索でも高い余剰のマッチが成立せず、かなりの利得が実現されないまま残る（抄録）。", "p6": "抄録には限界の記載がない。解釈：才能と専門の測定方法、チーム形成の内生性への対処は本文を読めておらず未確認。ポルトガルの制度文脈に依存する可能性がある。", "fun": "起業の相棒は、自分と似た人を選びがちである。ところがデータを見ると、能力の水準は同じくらいで得意分野が違う二人が組んだ会社ほど大きく育ち長持ちする。問題は、そういう組み合わせが実際にはなかなか生まれないことで、出会いの偏りをなくしただけでも、一人で細々とやる会社からもっと生産的なチームへ活動が移るという計算結果が出た。最良の相棒は近くにいない、という話である。", "unverified": "データの期間と規模、効果の大きさの数値はいずれも本文を入手できず未確認。"}}, {"id": "pn15", "rank": 15, "field": "ヒューマンコンピュータインタラクション", "headline": "AIの確信度表示は正誤を知ると効かなくなる", "title": "When Should I Trust This? Designing and Evaluating Factuality Indicators for LLM-based Chatbots", "url": "https://arxiv.org/abs/2610.32883", "authors": "Greta Warren ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Warren, G., Heal, J., Eser, S., Leto, D. M., Lehane, C. M., & Augenstein, I. (2026). When Should I Trust This? Designing and Evaluating Factuality Indicators for LLM-based Chatbots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32883", "why": "面接8人・調査1,000人・実験5,151人で、確信度や出典の表示が初期の信頼に影響するが、正誤を知ると効果が消え、医療では常に懐疑的になることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3.1・3.2の面接の参加者と所見の冒頭、§4.1.1・4.2.3 調査の参加者と検証行動、§5.1 実験の参加者と設計、§5.2 結果（知覚精度、十分性、確信度水準、開示後の信頼）、§6.5 限界、§7 結論）を読んだ。面接の詳細な所見と図の数値は一部のみ", "preprint": true, "p1": "LLMチャットボットの回答に付ける「確信度」や「出典」の表示が、一般の人の正確さ・十分性・信頼の判断にどう効くかを、面接（8人）・代表性のある調査（1,000人）・大規模実験（5,151人）で調べ、表示は初期の印象を少し動かすが正誤が分かると効果が消えることを示した。", "p2": "LLMの流暢さは正確さを保証せず、確信度の提示や出典の提示が助けになるとされるが、効果は提示の仕方に強く依存し、どう設計すべきかが不明だった。一般の利用者の検証行動と態度の大規模な調査は乏しく、既存研究はファクトチェックなど特定課題に偏っていた（§1）。", "p3": "RQ1は米国の若年（30歳未満）の生成AI常用者8人への面接で、確信度と出典の表示案（図1）を見せて解釈と検証行動への影響を聞く。RQ2はYouGovの米国代表パネル1,000人（18〜86歳、AI利用者に事前選別）への調査で、利用文脈・認識・検証行動・動機・態度を測る。RQ3は5,151人の参加者間実験で、表示（なし、確信度ラベル、確信度パーセント、確信度バブル、出典ラベル、出典＋確信度の言語表現）×話題（園芸、数学、医療）×正誤を無作為に割り当て、確信度ありの条件では高・低のいずれかを示し、知覚精度・情報の十分性・信頼・感情を正誤開示の前後で測る（§3.1、§4.1、§5.1）。直観：「AIが自信ありげに言うと信じるか」を、答え合わせの前と後で分けて測る。", "p4": "良いとする基準は、分散分析で表示・正誤・話題の主効果と交互作用を検定し、多重比較を補正した上で差が残るかどうか。効果量はη²_pとCohenのdで示す（§5.2）。", "p5": "調査では94.7%が「時々検証する」と答え、常に検証は14人、全く検証しないは39人。検証法はネットで調べる・AIの示す出典を見る・他の利用者の意見を見るが多く、AIに確信度を聞く・複数のAIを比べるは少ない。動機は自分のための正確さ（58.5%）、他人に伝える前（52.2%）、高リスクの話題（38.9%）（§4.2.3）。実験では、開示前の知覚精度は正誤（正3.776対誤3.628、d=.161）と話題（医療が低い）に左右され、表示の主効果はあっても多重比較後は有意差なし。出典のみ（3.794）は確信度バブル（3.658）より高い傾向（p=.067）。十分性では出典＋確信度の言語表現（3.495）がバブル（3.335）より高い（d=.14）。高確信度の表示は低確信度より正確に見える（3.77対3.62）。開示後の信頼の変化は正誤が支配的（η²_p=.456、正しければ+.454、誤りなら−1.419）で、高確信度を見せられていた人の方が信頼の低下が大きい（−.566対−.412、d=.11）（§5.2、§5.2.1、§5.2.2）。", "p6": "著者は、参加者が米国の生成AI常用者に限られ面接は30歳未満のみであること、実験が静的なスクリーンショットで実際の対話や出典クリックの手間がなく、知覚のみを測って依存や意思決定などの行動指標を測っていないため効果量が小さかった可能性、各参加者が1つの会話例しか見ていないことを限界に挙げる（§6.5）。結論として、表示は信頼を最大化するのでなく、較正された期待と検証の判断を助けるべきだとする（§7）。", "fun": "AIの答えに「自信90%」や「出典あり」と付ければ人は賢く信じ分けるようになるのか。5千人の実験では、付けた直後の印象はわずかに良くなるものの、答えが合っていたか間違っていたかが分かった途端にその効果は消え、結局人は結果で判断していた。しかも「自信あり」と言われて間違っていた場合の失望は大きい。表示で信頼を演出するより、いつ確かめるべきかを教える方が大事だという結論である。", "unverified": "面接（§3.2）の詳細な所見、図2〜5の調査結果の数値、感情変化の数値の一部は読んでいない。"}}, {"id": "pn16", "rank": 16, "field": "心理学・認知科学", "headline": "心理的性差が職業の性別分離を半分説明", "title": "Occupational Sex Segregation is Strongly Predicted by Psychological Sex Differences", "url": "https://doi.org/10.31234/osf.io/wrch4_v2", "authors": "Joakim Karl Erik Frostegård ほか", "venue": "PsyArXiv", "date": "2026-10-25", "apa": "Frostegård, J. K. E., Persson, B., Sorjonen, K., Hedebrant, K., Lundqvist, M., & Herlitz, A. (2026). Occupational Sex Segregation is Strongly Predicted by Psychological Sex Differences. https://doi.org/10.31234/osf.io/wrch4_v2", "why": "2,576人の能力・興味の性差と429職業の要件から推定した性比が実際の性比の分散の49%を説明し、物への興味の性差が最も強いことを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "個人の心理的特性の性差と職業の要件プロファイルから推定した職業ごとの性比が、実際の職業の性別分離の約半分を説明することを示した。", "p3": "35〜45歳の2,576人が空間能力・言語能力・協調性・情緒安定性・人への興味・物への興味を測るオンライン検査と質問紙に答え、学生が429職業の要件を評定。特性の性差と要件から各職業の「要件に合う人の性比」を推定し、実際の性比と比べる（抄録）。", "p5": "興味と認知を合わせたモデルがR²=.49、興味モデル.46、認知モデル.18。単独では物への興味の性差が最も予測的（R²=.42）。認知の性差は女性が多い職業より男性が多い職業をよく予測した（抄録）。", "fun": "看護師に女性が多く、機械工に男性が多いのはなぜか。この研究は「人より物に興味がある」といった平均的な性差と、各職業が何を求めるかを掛け合わせると、職業の男女比の半分近くが当たることを示した。差別や制度だけでなく、本人の興味の分布も分離に効いているという、議論を呼びそうな結果である。", "unverified": "横断研究であり因果の向きは示されていない。要件評定者（学生）の人数は抄録に記載なし。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "家主への家賃保証が弱い借主の住宅と移動を助ける", "title": "Insuring Landlords", "url": "https://doi.org/10.3386/w35932", "authors": "Thomas Bézy ほか", "venue": "NBER Working Paper", "apa": "Bézy, T., Levy, A. B., & McQuade, T. (2026). Insuring Landlords (NBER Working Paper No. 35932). National Bureau of Economic Research. https://www.nber.org/papers/w35932", "why": "フランスの公的家賃保証Visaleの年齢による適格性の断絶を使い、民間賃貸へのアクセスと高賃金地域への長距離移動の増加を示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "家主を家賃未払いリスクから守る公的保証が、立場の弱い借主の民間賃貸へのアクセスと高賃金地域への移動を増やすことを示した。", "p3": "フランスの大規模な公的家賃保証Visale（適格な借主と家主は無料）について、行政の世帯データと保険金支払データを使い、年齢による適格性の正確な境界を利用した準実験で推定する（抄録）。", "p5": "保証は民間賃貸へのアクセスを増やし、特に移民、新規世帯、低所得の借主で効果が大きい。高家賃・高賃金の地域への長距離移動を、限界的な移動1件あたり中程度の財政費用で促したが、家賃上昇を通じて同等の非適格な借主を押し出した可能性がある（抄録）。", "fun": "貸す側が「家賃を払ってもらえないかも」と恐れると、収入の不安定な人は部屋を借りられない。フランスは国が家主に保険をかけることでこの恐れを取り除き、結果として移民や若い世帯が良い仕事のある都市に引っ越せるようになった。ただし家賃が上がって保証のない人が弾かれた可能性もあり、良いことずくめではない。", "unverified": "効果の大きさの数値と財政費用の額は抄録に記載なし。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "宗教禁止後も宗教建築の可視性が規範を残す", "title": "Losing Their Religion", "url": "https://doi.org/10.3386/w35933", "authors": "Richard Murphy ほか", "venue": "NBER Working Paper", "apa": "Murphy, R., & Telhaj, S. (2026). Losing Their Religion (NBER Working Paper No. 35933). National Bureau of Economic Research. https://www.nber.org/papers/w35933", "why": "アルバニアの1967年宗教禁止と1948年の記念物指定の組合せで、宗教建築が残らない地域ほど女性の就業と就学が増えたことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "政府が社会規範を変えられるかを、1967年のアルバニアの宗教禁止で検証し、宗教建築が残らなかった地域ほど女性の就業と就学が増えたことを示した。", "p3": "宗教行為は全国一律で禁止されたが、1948年の歴史的記念物の分類でどの宗教建築が取り壊されずに残るかが決まったことを利用し、残存状況の違いで効果を比べる（抄録）。", "p5": "記念物が残らなかった地域で女性の就業と就学の増加が最大、農村のみに残る地域で小さく、都市に残る地域で最小。宗派に関係なく、記念物の数が増えるほど効果は減った。旧い宗教秩序の公的な可視性が機序とされる（抄録）。", "fun": "法律で宗教を禁じた国で、教会やモスクの建物が「歴史的記念物」として残った地域と取り壊された地域があった。建物が残った地域では、禁止後も女性が働きに出たり学校に行ったりする変化が小さかった。目に入る建物が、効力を失ったはずの古い決まりを人々の中に生かし続けたという話で、規範の記憶が風景に宿ることを示している。", "unverified": "効果の大きさと標本の詳細は抄録に記載なし。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "AI曝露指標は企業の実採用をわずかしか説明しない", "title": "AI Exposure and Adoption Among U.S. Firms", "url": "https://econpapers.repec.org/RePEc:cen:wpaper:26-61", "authors": "Matthew Dey ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "14種の企業水準AI曝露指標と国勢調査局の採用調査を結び、曝露1標準偏差で採用確率が4〜11ポイント高いが説明力は限定的だと示した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "研究で広く使われる企業のAI曝露指標が、実際のAI採用をどの程度説明するかを直接の採用データと結びつけて調べた。", "p3": "文献の職業別曝露推定と労働統計局の職業雇用構成から14種の企業水準曝露指標を作り、国勢調査局のBusiness Trends and Outlook Surveyの企業AI採用と結びつける（抄録）。", "p5": "曝露は採用と正で有意に関連するが、分散の説明力は限定的。標準化した曝露1標準偏差の増加は採用確率4〜11ポイント高と結びつき、年と小分類の固定効果を入れると1〜8ポイントに下がる。企業規模と部門で異質性がある（抄録）。", "fun": "「この仕事はAIに置き換えられやすい」という指標は、研究でよく使われる。しかし、置き換えられやすい仕事が多い会社が本当にAIを使っているかは別問題だった。両者をつなぐと関係はあるが弱く、曝露が高くても使っていない会社がたくさんある。指標は目安であって現実の採用ではない、という当たり前だが見落とされがちな事実を数字で示した。", "unverified": "14指標の内訳と企業数は抄録に記載なし。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "AIが自動化する側で金融政策の効きが変わる", "title": "It Matters Who Gets Automated: Monetary Policy in an AI Economy", "url": "https://econpapers.repec.org/RePEc:diw:diwwpp:dp2184", "authors": "Alina Ermolaeva ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "2部門の異質主体ニューケインジアンモデルで、AI経済では同じ利下げがより大きく効き、その増幅が自動化されない労働者を通じて生じることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIが一部の部門を自動化する経済では、同じ利下げがより大きく効き、その増幅は自動化されない労働者を通じて起きることをモデルで示した。", "p3": "AIが片方の部門のタスクを自動化し他方は守られる2部門の異質主体ニューケインジアンモデル（タスクに基づく生産）を作り、AIのある定常状態とない状態で同じ利下げの効果を比べる（抄録）。", "p5": "AI定常状態では資本が多く、労働所得は曝露部門（労働時間で損）から保護部門（賃金上昇で得）へ移る。利下げはAI経済でマクロ集計量をより強く刺激し、投資の反応は大きな資本基盤の上で同じ強さなので需要がより増える。機械が曝露部門の需要の一部を吸収し、保護部門の分は労働所得になって支出される（抄録）。", "fun": "AIが仕事を奪う話は多いが、この研究は「AIが入ると中央銀行の金利操作の効き目が変わる」という別の角度を取った。AI経済では機械が多いので投資が同じ割合でも金額が大きく、しかもその恩恵は自動化されなかった人の賃金に流れて消費される。誰が自動化されるかが金融政策の強さまで決めるという意外なつながりである。", "unverified": "増幅の大きさの数値は抄録に記載なし。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "政権の利下げ圧力を市場は1bp織り込む", "title": "Jawboning the Fed: Do Markets Listen When Administrations Talk?", "url": "https://arxiv.org/abs/2610.32300", "authors": "Michela Baretti ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Baretti, M., Collodel, U., & Zacché, J. (2026). Jawboning the Fed: Do Markets Listen When Administrations Talk? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32300", "why": "1988〜2025年のロイター記事をLLMで分類し、ハト派的圧力1件が短期金利期待を約1bp下げ、3か月で消えることを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "政権が連邦準備制度に金融緩和を迫る「口先介入」を市場が将来の金融政策の信号として織り込むかを、約40年の報道で初めて体系的に測った。", "p3": "1988〜2025年のロイター記事をオープンウェイトのLLM集団でハト派・タカ派の圧力に分類し、金利期待の期間構造、ドル、インフレ補償、ボラティリティの日次反応を推定する（抄録）。", "p5": "ハト派的圧力1件で短期金利期待が約1ベーシスポイント下がり（次回FOMCでの利下げ確率4%増に相当）、効果は単調に減衰して3か月で消える。タカ派的圧力は効果なし。トランプ政権期を除いても推定は弱まらず、ドル安を伴い、インフレ補償とボラティリティは安定していた（抄録）。", "fun": "大統領が「金利を下げろ」と中央銀行に圧力をかけるニュースは、市場にとって意味があるのか。40年分の記事をAIに読ませて数えると、圧力1回につき市場はほんの少し（1ベーシスポイント）利下げを織り込み、3か月で忘れる。しかもこれは信用の低下ではなく「本当に緩和が来る」という読みだった。政治の言葉が値段に変わる瞬間を測った研究である。", "unverified": "分類に使ったLLMの名称と記事件数は抄録に記載なし。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "関税の段階的改定がマクロ反応をこぶ型にする", "title": "Tariff Staggering", "url": "https://doi.org/10.3386/w35957", "authors": "Stephanie Schmitt-Grohé ほか", "venue": "NBER Working Paper", "apa": "Schmitt-Grohé, S., & Uribe, M. (2026). Tariff Staggering (NBER Working Paper No. 35957). National Bureau of Economic Research. https://www.nber.org/papers/w35957", "why": "HS6桁の関税パネルで四半期に20%が上がり20%が下がる事実から段階的関税設定モデルを構築し、貿易収支中立性が崩れることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "関税が品目ごとにばらばらの時期に改定されるという事実をモデルに組み込み、関税ショックへのマクロ経済の反応がこぶ型になり、貿易収支の中立性が崩れることを示した。", "p3": "HS6桁の米国輸入・関税パネルで改定の頻度を記録し、段階的（スタガード）な関税設定のモデルを動学的開放経済に埋め込む（抄録）。", "p5": "典型的な四半期に関税の約20%が上がり、20%が下がり、60%は不変。段階的改定は平均関税の動きを変えてこぶ型の反応を生み、恒久的な関税引上げに対するRazin–Svenssonの貿易収支中立性を覆す。関税のばらつきは一次の効果を持ち、平均を変えずにばらつきを無くすと一時的な関税引下げに似た効果がある（抄録）。", "fun": "関税は一斉に上がるのではなく、品目ごとに少しずつ時期をずらして変わる。すると人々は「これから平均が上がる」と先読みして輸入を前倒しする。この研究はその当たり前の時間差を理論に入れると、教科書の結論（恒久的な関税は貿易収支を変えない）が成り立たなくなることを示した。細かい事実が大きな結論を動かす例である。", "unverified": "パネルの期間と推定値の大きさは抄録に記載なし。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "ネットワーク波及下の処置配分規則の後悔上界", "title": "Optimal Treatment Assignment Rules on Networked Populations", "url": "https://arxiv.org/abs/2610.32735", "authors": "Abhishek Ananth", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Ananth, A. (2026). Optimal Treatment Assignment Rules on Networked Populations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32735", "why": "ネットワーク波及のある母集団で限られた処置を配分する規則の厚生を転送逆確率重みで識別し、Natarajan次元に基づく有限標本の後悔上界と下界を導いた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ネットワーク上で波及効果のある処置を限られた数だけ配分する計画問題について、実験データから厚生を識別し、有限標本の後悔上界と下界を導いた。", "p3": "目標母集団の共変量とネットワーク特徴から実行可能な配分へ写す大域的な処置規則を定義し、局所反応・安定性・サポート・政策関連の重なりの条件下で転送逆確率重み付けの規準により厚生を識別して経験的厚生最大化を行う。規則クラスの複雑さはNatarajan次元で測る（抄録）。", "p5": "有界な最大次数を課さない二者間のネットワーク形成の下で上界を導き、ミニマックス下界で対応する速度を示した。大域的な最適規則と個人ごとの局所規則の厚生差を上下から評価し、実データで較正した比較でその大きさを示した（抄録）。", "fun": "ワクチンや補助金を配るとき、受け取った人の周りにも効果が波及するなら「誰に配るか」は一人ずつ決めるより全体で決めた方がよい。この研究は、少数の試験データからその最善の配り方をどれだけ正確に学べるかの理論的な限界を示した。友人関係のつながりが、配分の難しさを決めるという話である。", "unverified": "後悔上界の具体的な速度と応用例の内容は抄録に記載なし。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "AIで書く費用が下がると検証される論文が消える", "title": "AI-Augmented Research: Free to Write, Costly to Read", "url": "https://arxiv.org/abs/2610.32355", "authors": "Wolfgang Kuhle", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Kuhle, W. (2026). AI-Augmented Research: Free to Write, Costly to Read (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32355", "why": "書く費用が読む費用より速く下がるモデルで、検証される論文の帯が縮み評判だけが影響を決めること、同じAIで書かれた論文が閾値を超えるとAI要約が誤りを継承することを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIで書く費用が読む費用より速く下がると、検証される論文の範囲が縮み、評判だけが影響を決め、AI要約も同じAIの誤りを継承するようになることをモデルで示した。", "p3": "著者は評判が異なり、時間制約のある読者（査読者など）は論文を無視・検証・信用のいずれかで扱うという理論モデル（抄録）。", "p5": "執筆費用が下がると検証される論文の帯が縮み、外部の著者は読まれず、確立した著者は検証されない。費用ゼロの極限では検証される論文の割合が消え、影響は著者の評判だけで決まる。AI要約は誤りが十分独立なときだけ信頼できる集約になり、同じAIで書かれた論文の割合が閾値を超えると要約がAIの誤りを継承し、それを正しうる独自研究を除外する（抄録）。", "fun": "論文を書くのがAIで楽になっても、読む側の時間は増えない。するとどうなるか。この理論は、読者は有名な人の論文を確かめずに信じ、無名な人の論文は読まなくなると予測する。さらに「AIに要約させれば読める」という逃げ道も、みんなが同じAIで書いていると要約が同じ間違いを繰り返すので塞がれる。書く自由が増えると読まれる自由が減るという逆説である。", "unverified": "閾値の具体的な値はモデルの仮定に依存し、抄録に数値はない。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "多状態モデルの遷移率を森で推定", "title": "Random Jump Forests", "url": "https://arxiv.org/abs/2610.32498", "authors": "Martin Bladt ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Bladt, M., & Lemvig, R. F. (2026). Random Jump Forests (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32498", "why": "1本の木で全遷移を同時に分割しNelson-Aalen推定量を終端に置くランダムジャンプ森を提案し、マルコフ性を仮定せず占有確率を復元する。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多状態モデルの条件付き累積遷移率と状態占有確率を、1本の木で全遷移を同時に分割する「ランダムジャンプ森」で推定するノンパラメトリック法を導入した。", "p3": "部分的に観測された軌跡を使って木が共変量空間を全遷移について同時に分割し、終端ノードにNelson–Aalen推定量を置く。占有確率は積分積（product integral）で復元し、マルコフ性を仮定しない（抄録）。", "p5": "共変量が有限個の値を取り、適切な分割条件の下で一様一致性と関数中心極限定理が成り立ち、マルコフの場合は点ごとの信頼区間と同時信頼帯が使える。シミュレーションでは正しく指定された基準モデルに近い予測精度を示し、誤指定の基準には大きく勝った。4つの生物医学データで例示し、Rパッケージとして実装（抄録）。", "fun": "病気の「健康→発症→回復→再発」のような状態の移り変わりを、人の特徴ごとに予測したい。従来は遷移の一本一本に別々のモデルを作っていたが、この研究は1本の決定木で全ての遷移を同時に分け、森にして平均する。しかも「次の状態は今の状態だけで決まる」という仮定なしに、各状態にいる確率を計算できる。", "unverified": "4つの生物医学データの内容は抄録に記載なし。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "連続と二値が混じる応答の分布回帰", "title": "Mixed Engression: Distributional Regression for Multivariate Mixed-Type Responses", "url": "https://arxiv.org/abs/2610.32850", "authors": "Seyong Hwang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Hwang, S., Tan, K. M., & Zhu, J. (2026). Mixed Engression: Distributional Regression for Multivariate Mixed-Type Responses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32850", "why": "有界な食い違いによるエネルギー損失で連続生成器を学習し二値成分を閾値化する混合エングレッションを提案し、非漸近誤差限界を与えた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "連続と二値の成分が混じる多変量応答の条件付き分布を、有界な食い違いによるエネルギー損失で学習した生成器と閾値化で推定する「混合エングレッション」を提案した。", "p3": "連続生成器をエネルギー損失で適合し、軟らかい二値出力を閾値化して混合応答の標本を作る。応答全体のエネルギー距離が閾値化前に0に近づいても閾値化後は0から離れうることを示し、二値ベクトル全体への別のエネルギー損失を足した拡張損失で学習する（抄録）。", "p5": "構造関数の合成的な滑らかさと一様な閾値マージン条件の下で、ガウスまたはStudent-t雑音のモデルに対するスパースReLU推定量の非漸近誤差限界を導き、対数因子を除く多項式収束率を得た。シミュレーションでは比較手法より精度が高く、重い裾でも有効（抄録）。", "fun": "「買うか買わないか」（はい・いいえ）と「いくら使うか」（金額）のように、種類の違う答えが同時に出る問題は、両方の関係まで含めて予測するのが難しい。この研究は、まず全部を連続量として生成し、はい・いいえの部分だけ後から切り分けるが、切り分けると見えなくなる誤差があることを見抜き、それを別に測る仕組みを足した。", "unverified": "比較手法の名称と数値は抄録に記載なし。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "距離空間に値をとる空間データのクリギング", "title": "Fr\\'echet Kriging for Metric Space-Valued Spatial Data", "url": "https://arxiv.org/abs/2610.32979", "authors": "Ryo Okano ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Okano, R., Kurisu, D., & Müller, H.-G. (2026). Fréchet Kriging for Metric Space-Valued Spatial Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32979", "why": "重み付きフレシェ平均と一般化バリオグラムで確率分布や正定値行列などの空間予測を行い、代理最適性と一致性を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "確率分布や正定値行列、ネットワークのような距離空間に値をとる空間データの予測を、重み付きフレシェ平均と一般化バリオグラムで行う「フレシェ・クリギング」を導入した。", "p3": "通常クリギングの重み付き平均を重み付きフレシェ平均に置き換え、重みは一般化バリオグラムで特徴づけた空間依存構造から決める。線形空間への埋め込みを要しない（抄録）。", "p5": "代理最適性と、固定した作業バリオグラムの誤指定の下での一致性を適切な正則性条件で示した。一変量分布と正定値行列のシミュレーションで既存法より良い予測性能を示し、日平均気温の超過確率、日最低・最高気温の同時密度、産業間資金フローのネットワークに応用した（抄録）。", "fun": "地図上の観測点から間の地点の値を補間する「クリギング」は、値が1つの数のときの方法である。この研究は、各地点の値が「気温の分布そのもの」や「産業どうしのお金の流れの網」であっても、距離さえ定義できれば補間できるように拡張した。平均の代わりに「一番真ん中にある分布」を探すという発想である。", "unverified": "既存法との数値比較の結果は抄録に記載なし。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "傾向スコアのスプラインで試験結果を母集団へ", "title": "Bayesian Propensity Score Predictive Inference for Extending Trial Findings to Target Populations", "url": "https://arxiv.org/abs/2610.31915", "authors": "Jungang Zou ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Zou, J., Schwartz, J. E., Little, R. J. A., Moise, N., & Chen, Q. (2026). Bayesian Propensity Score Predictive Inference for Extending Trial Findings to Target Populations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31915", "why": "BARTと標本抽出傾向スコアの自然3次スプラインを組み合わせ、共変量シフト下で試験の知見を電子カルテ由来の集団へ外挿する。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "無作為化試験の知見を共変量分布の異なる目標母集団へ外挿するための、傾向スコアのスプラインとBARTを組み合わせたベイズ予測推論（PSPI）を提案した。", "p3": "高次元共変量にベイズ加法回帰木を使い、標本抽出の傾向スコアには自然3次スプラインを置く。処置効果項のみ、または予後項と処置効果項の両方にスプラインを入れる2変種で、選択に関わる変動を別に正則化し、境界ノットの外側に明示的な外挿規則を与える。傾向スコアは逆Gumbel変換で0付近の圧縮と外挿の程度を均す（抄録）。", "p5": "シミュレーションではスプライン型PSPIが競合法より低いRMSEとほぼ名目の被覆率を示し、特に大きな共変量シフトで優れた。急性冠症候群後の抑うつケア介入のCODIACS Vanguard試験をAll of Usの電子カルテから作った2コホートへ外挿すると、未調整の試験推定より大きな介入効果が推定された（抄録）。", "fun": "ある病院で効いた治療が、年齢や持病の分布が違う別の集団でも効くかは、試験の結果をそのまま当てはめても分からない。この研究は「その人が試験に選ばれやすかった度合い」を軸にした滑らかな曲線で効果の変わり方を表し、試験にいなかったタイプの人への外挿の仕方まで明示した。試験の外の世界に結果を運ぶ道具である。", "unverified": "応用での効果の数値と比較法の名称は抄録に記載なし。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "スティッキーPDMPでスパースなベイズNNを厳密抽出", "title": "Sparse Bayesian Neural Networks via Sticky Piecewise Deterministic Markov Processes", "url": "https://arxiv.org/abs/2610.32753", "authors": "August Arnstad ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Arnstad, A., Storvik, G. O., Pagani, F., & Rønneberg, L. (2026). Sparse Bayesian Neural Networks via Sticky Piecewise Deterministic Markov Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32753", "why": "区分的決定論マルコフ過程でベイズニューラルネットの事後分布を漸近的に厳密に標本化し、スパイク・スラブ事前分布で重みを正確に0にする。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "区分的決定論マルコフ過程（PDMP）に基づくモンテカルロ法で、スパイク・スラブ事前分布を持つベイズニューラルネットの事後分布を漸近的に厳密に標本化し、重みを正確に0に落とす疎なベイズNNを得た。", "p3": "数値的に構成したレート上界が成り立つ限りPDMPで事後分布を標本化し、「スティッキー」版のPDMPで重みを0に留めることでスパイク・スラブ事前分布を取り込む（抄録）。", "p5": "サンプラーの予測性能と収束を調べ、この方法で得た疎なベイズNNが密なものより入力雑音に頑健でありうることを示した（抄録）。", "fun": "ニューラルネットの性能は実はごく一部の重みで決まり、残りは刈り込める。普通は学習してから刈るが、この研究は確率論の枠組みで「この重みは0でよい」という判断まで不確実性つきで同時に行う。粒子が壁に当たって貼りつくように重みが0に貼りつく「スティッキー」な乱数の動きで、それを厳密に実現した。", "unverified": "実験に使ったネットワークとデータの規模は抄録に記載なし。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "動的処置方針の縦断因果効果を文脈内で推定", "title": "A Foundation Model for Policy In-Context Longitudinal Causal Effect Estimation", "url": "https://arxiv.org/abs/2610.32863", "authors": "Wenxin Chen ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Chen, W., Gan, K., Lu, M., Jing, Z., Wang, F., Poon, H., Naumann, T., & Argaw, P. (2026). A Foundation Model for Policy In-Context Longitudinal Causal Effect Estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32863", "why": "合成の構造因果モデルで事前学習した基盤モデルが、新しい観測データと方針から1回の順伝播で条件付き潜在結果を予測する。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "時間変化する交絡とフィードバックのある縦断データで、動的な処置方針の因果効果を文脈内で推定する初の基盤モデルPICLE-PFNを提案した。", "p3": "目標方針を履歴と判断の実演例として文脈で表し、縦断構造因果モデルから標本した合成データで事前学習した事前データ適合ネットワークが、新しい観測データと方針から条件付き平均潜在結果を1回の順伝播で予測する（抄録）。", "p5": "合成・半合成の縦断ベンチマークで、データごとに学習・調整した最先端の推定量に匹敵するRMSEと、大きく改善した不確実性の較正を、展開時の計算時間の数分の一で達成した（抄録）。", "fun": "「この患者に今後こういう方針で治療したらどうなるか」という問いは、過去の治療が後の状態を変え、その状態が次の治療を変えるという絡まりのせいで難しい。この研究は、人工的に作った無数の因果の世界で訓練したAIに、新しいデータと方針の例を見せるだけで答えさせる。問題ごとにモデルを作り直さなくてよいのが新しい。", "unverified": "ベンチマークの名称と数値は抄録に記載なし。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "エージェント進化手法を比較する共通基盤", "title": "RSIHub: A Composable Framework for Agent-Evolution Methods", "url": "https://arxiv.org/abs/2610.32253", "authors": "Zimu Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "apa": "Wang, Z., Wang, X., Ye, S., Li, J., Chen, S., Shi, Y., Wang, R., Zhang, J., Wang, C., Wu, K., Qi, M., Cai, K., Gu, X., & Zheng, Z. (2026). RSIHub: A Composable Framework for Agent-Evolution Methods (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32253", "why": "AHE・Hyperagents・A-Evolve・GEPAを共通の実行・評価・系譜管理の上で比較し、最大13.5ポイントの改善と手法順位の設定依存を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "実行フィードバックでプロンプト・スキル・ツール・編成を改善するエージェント進化手法を、共通の基盤の上で構築・比較・拡張できるオープンソース枠組みRSIHubを示した。", "p3": "レシピが再利用可能な演算子を組み合わせて可変資源を宣言し、RSIHubが実行・評価・回復・系譜を提供する。評価は可変部分の外に置き、結果を候補と評価条件に結びつける。AHE・Hyperagents・A-Evolve・GEPAを中核を変えずに実装した（抄録）。", "p5": "MiniSWEとCodexをTerminal Bench 2とτ³ Bankingで固定のモデル・評価器設定の下で評価し、最大で13.5ポイントのpass@1の改善を観測したが、手法の順位は設定で変わり、最適化の利得は保留課題に必ずしも移らなかった（抄録）。", "fun": "AIが自分の指示書や道具を改良して賢くなる研究が増えているが、各研究が同じ実験装置を一から作り直していた。この研究はその装置を共通化し、4つの有名な手法を同じ土俵で比べた。すると最大13.5ポイント伸びる一方で、どの手法が一番かは課題次第で入れ替わり、練習問題で伸びた分が本番で消えることもあった。", "unverified": "各手法の個別の数値は抄録に記載なし。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "理解と映像予測を統合した身体化基盤モデル", "title": "RynnUnify: Towards Unified Embodied Brain", "url": "https://arxiv.org/abs/2610.32965", "authors": "Minghao Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "apa": "Zhu, M., Hou, B., Xiang, K., Wang, Z., Tang, Y., Yang, Y., Wang, Z., Zhang, T., Li, K., Zhao, H., Huang, S., Qu, L., Leng, S., Huang, D., Chen, M., Lu, S., Wang, Y., Liang, X., Zeng, Z., … Li, X. (2026). RynnUnify: Towards Unified Embodied Brain (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32965", "why": "16Bの統合モデルが空間推論と長期の視覚計画を結び、ロボット制御への拡張で実機3課題平均46.7%の成功率を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "身体化された理解と長期の視覚計画を、映像と言語を交互に挟んだ推論で結びつける16Bの統合モデルRynnUnifyを示し、ロボット制御へも拡張した。", "p3": "空間推論・物理予測・接地の能力の上に、観測されない状態と相互作用の結果を推論するために映像予測を選択的に使うエージェント拡張を強化学習で作り、理解と予測をロボット制御に変換する世界-行動拡張も作る。評価用にRynn-VPとRynn-GEUを導入（抄録）。", "p5": "評価した統合マルチモーダルモデルの中で最高の平均身体化理解スコアを示し、Rynn-VPでCosmos 3 Nanoを9.75点上回る。エージェント拡張はRynn-GEUで直接推論より平均6.0点改善し、世界-行動拡張はRoboCasa365の20複合課題で51.5%、実機3課題で平均46.7%の成功率（抄録）。", "fun": "人は「このコップを押すとどう転がるか」を頭の中で映像として先読みしてから手を動かす。このモデルは言葉と映像を交互に使って同じことをし、必要なときだけ未来の映像を想像してから判断する。想像のおかげで成績が上がり、さらに実際のロボットも動かせた。考えることと見ることを一つにしようとする試みである。", "unverified": "比較した他モデルの名称と学習データの規模は抄録に記載なし。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "全重みを共有された離散判断の経路で表す", "title": "Every Weight Is a Path of Shared Discrete Decisions", "url": "https://arxiv.org/abs/2610.31931", "authors": "Ammar Ali ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "apa": "Ali, A., & Lefkimmiatis, S. (2026). Every Weight Is a Path of Shared Discrete Decisions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31931", "why": "重みを符号・2の冪・ゼロゲートの経路で表すTWIGにより、圧縮手法を1つの最適化に統一し、固定重み回路やアニーラで解ける問題に写す。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ニューラルネットの全ての重みを、符号・2の冪のシフト・ゼロゲート・共有表の索引という小さな離散判断の経路の終点として表すTWIGを導入し、圧縮・回路化・離散最適化を1つの対象に統一した。", "p3": "まとまりのある重みは経路の上部を共有し、各判断は下の全重みに継承されて1回だけ保存・適用される。学習済みの任意のネットはTWIGに書け、判断が2の冪なら重み層は配線と加算器だけの回路になる。判断の選択は木の経路に沿った高次ボルツマンマシンの基底状態問題になる（抄録）。", "p5": "枝刈り・量子化・低ランク分解・コードブック・重み共有が1つの対象の編集になり、単一の最適化器で選べる。既存の重み形式（グループスケール、共有指数、スパース重みなど）は浅いTWIGとして追加費用なしで表せる。LLMの5つの重み行列での実験に言及するが数値は抄録で切れている（抄録）。", "fun": "AIの重みを小さくする方法は、刈る・丸める・分解する・表を共有する、とばらばらに発展してきた。この研究は重み1つ1つを「符号はプラス、2の何乗、ゼロにするか」という小さな選択の連なりとして書き直すと、全部が同じ木の編集になると気づいた。しかも2の冪だけで作ると掛け算が要らず、配線と足し算だけの回路になる。", "unverified": "LLMでの実験結果の数値は抄録が途中で切れており未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "教師も正解もなくLLMが自己学習で改善", "title": "On-Policy Self-Training: Data-Free Self-Improvement in Large Language Models", "url": "https://arxiv.org/abs/2610.32770", "authors": "Leon Sick ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "apa": "Sick, L., Hoyer, L., Strümpler, Y., Reisswig, C., Ropinski, T., & Tombari, F. (2026). On-Policy Self-Training: Data-Free Self-Improvement in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32770", "why": "粗い話題記述だけから問いと特権的推論を自己生成し、自己蒸留で複数領域の性能を上げつつ他領域の能力を保つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "正解つきの問題や人が用意した問題集なしに、粗い話題の記述だけからモデル自身が問いと特権的な推論の手本を生成し、自己蒸留で性能を上げる自己学習の枠組みを示した。", "p3": "方策上の自己蒸留を自己学習として再定式化し、高水準の話題記述に導かれてモデルが自分のカリキュラム（問いと特権的な推論の軌跡）を合成する（抄録）。", "p5": "完全に合成された特権情報での自己蒸留により、複数領域で改善しつつ自己学習していない領域の能力を保った。テキストとマルチモーダルの両方で一般性を示し、標準的な言語ベンチマークと視覚質問応答で一貫した自己改善を得た（抄録）。", "fun": "先生も答え合わせもなしに、AIが自分で問題を作り、自分で解き方の手本を書き、それを自分に教えて賢くなれるのか。この研究は「この分野について」という大まかな指示だけでそれができ、しかも他の分野の力を失わなかったと報告する。もともと持っていた眠った能力を、自分で引き出したという解釈である。", "unverified": "改善幅の数値と使用モデルは抄録に記載なし。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "トランスフォーマー理論は単独では挙動を説明できない", "title": "Putting Transformer Theories to the Test", "url": "https://arxiv.org/abs/2610.32104", "authors": "Awni Altabaa ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Altabaa, A., Schnabel, T., & Tomlinson, K. (2026). Putting Transformer Theories to the Test (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32104", "why": "7つの形式理論の予測を共通の課題行列にまとめ、実験でどの理論も成功・失敗のパターンを説明できないことを示し、理論に必要な要素を特定した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "トランスフォーマーの能力を説明する7つの形式理論の予測を共通の課題行列にまとめ、制御実験で検証し、どの理論も単独では成功と失敗のパターンを説明できないことを示した。", "p3": "Star-free、AC⁰、TC⁰、C-RASP、MPC、BAPO、Sensitivityの7理論の結果を、計算構造の異なる課題群に対する予測の行列に翻訳し、欠けている部分に新しい理論結果を加える。分布内の標本複雑度、長さ汎化、事前学習済みモデルの性能で検証する（抄録）。", "p5": "C-RASPが難しいと予測するk-hop帰納課題で、小さなトランスフォーマーが長さ汎化した。硬い注意を仮定するAC⁰やBAPOが難しいとする二値多数決も実際には成功した。理論は、軟らかい注意、内容依存の動的検索、位置ごとの有界計算、学習可能性の説明を備える必要があると結論（抄録）。", "fun": "「この種のAIにはこういう問題が解けないはずだ」という理論がいくつもあるが、互いに違うことを言う。この研究は全理論の予言を一覧表にして、実際に小さなモデルを訓練して試した。すると「解けないはず」の問題を解いてしまう例がいくつも出た。理論の思い込み（注意は硬い、など）がどこで外れるかが浮かび上がった。", "unverified": "課題の総数と実験規模は抄録に記載なし。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "RLの批評家をそのまま信頼度推定器に使える", "title": "Free Lunch for LLMs Confidence: The RL Critic Already Knows", "url": "https://arxiv.org/abs/2610.31820", "authors": "Shujin Wu ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Wu, S., & Ji, H. (2026). Free Lunch for LLMs Confidence: The RL Critic Already Knows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31820", "why": "正誤に基づく報酬では信頼度推定と批評家学習が等価であることを証明し、既存の批評家が追加学習なしで最良の信頼度推定器になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "正誤に基づく報酬の下では信頼度推定と強化学習の批評家（価値関数）の学習が等価であることを示し、価値ベースRLで訓練したLLMの既存の批評家を追加学習なしで信頼度推定器として使えることを示した。", "p3": "同じ（問い、応答、正誤）の三つ組で訓練した同程度の容量の自己推定器と外部推定器を比べ、方策の挙動記録だけで訓練した外部モデルが内部表現なしに方策と同等の信頼度を推定できることを示す。そこから信頼度推定と批評家訓練の等価性を証明する（抄録）。", "p5": "数学・コード・ツール呼び出し・一般推論の十数領域で、再利用した批評家は分布内の全分割で最良の信頼度推定器であり、16分割中14で最も較正がよく、課題性能を損なわなかった。推論の途中段階でも信頼度を出せる（抄録）。", "fun": "AIに「その答えにどれくらい自信があるか」を言わせるには、普通は追加の訓練が要る。この研究は、強化学習でAIを鍛えるときに脇で「この手は当たりそうか」を予測していた相棒（批評家）が、実は自信の推定そのものをやっていたことに気づいた。すでにある部品をそのまま流用できるという、文字どおり「ただ飯」の発見である。", "unverified": "比較した専用の信頼度推定法の名称は抄録に記載なし。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "ヒントによる答えの変化は指数的傾きに従う", "title": "How Much Do You Trust A Dog? Quantifying Hint-Following in Reasoning Language Models", "url": "https://arxiv.org/abs/2610.32055", "authors": "Anxin Guo ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Guo, A., Pabbaraju, C., Ahmadian, S., Munagala, K., & Vijayaraghavan, A. (2026). How Much Do You Trust A Dog? Quantifying Hint-Following in Reasoning Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32055", "why": "教授・友人・犬といった情報源のヒントが答えの対数オッズをほぼ一定量ずらし、情報源を信頼するなと警告しても消えないことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "「〇〇は答えが(X)だと思う」というヒントが推論モデルの答えをどう動かすかを定量化し、ヒントの効果が情報源の信頼性に合わせて較正されていないことを示した。", "p3": "MMLUの問いに、教授・友人・犬という情報源を変えたヒントを付け、Qwen・Gemma・SmolLMの3系統で答えの変化を測る。ヒント反応の形式的な分解を導入し、KL正則化つき報酬学習が分布をどう変えるかを合成実験で示す（抄録）。", "p5": "ヒントはヒント先の答えの対数オッズをほぼ一定量ずらす指数的傾きで表され、問いと対象の感受性は情報源によらず共有される。情報源が不正確だと宣言しても、信用するなと明示しても、ずれは残った（抄録）。", "fun": "「犬はこの答えだと思っている」と言われても普通は無視するが、AIは律儀に影響を受けた。しかも影響の仕方は数式でぴたりと表せる単純なもので、「この情報源は当てにならない」と注意しても減らなかった。人の言葉に合わせてしまうAIの癖が、誰が言ったかを区別できていないことを数で示した。", "unverified": "ずれの大きさの数値は抄録に記載なし。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "MXFP4での混合専門家LLM訓練をBF16に迫らせる", "title": "Training an MoE LLM in MXFP4: How We Closed the Gap to BF16", "url": "https://arxiv.org/abs/2610.32229", "authors": "Han Wang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Wang, H., Wang, Z., Frumkin, N., Yin, X., Khodamoradi, A., Li, D., & Barsoum, E. (2026). Training an MoE LLM in MXFP4: How We Closed the Gap to BF16 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32229", "why": "20BのMoEモデルを4ビット微細スケーリング形式で訓練し、重みの振動抑制でBF16との損失差を0.007に縮めた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "20BパラメータのMoE型LLMをMXFP4（4ビット微細スケーリング形式）で訓練する公開レシピALTOを示し、BF16との差をほぼ閉じた。", "p3": "GPT-OSS-20BをMLPerf Small MoE Trainingベンチマークで、1D/2Dのブロック量子化・無作為化アダマール変換・確率的丸めに、TetraJet-v2から簡略化した重みの振動抑制を組み合わせて訓練する。AMD MI300上の模擬MXFP4カーネルを使用（抄録）。", "p5": "C4検証でバッチ16・16,128ステップの損失が3.3350で、BF16の3.3283との差は0.007。振動抑制なし（3.3418）が残した差の約50%を閉じた。品質目標到達までのステップ数で見たFP4の収束オーバーヘッドは+20.0%から+5.0%に減少。差分勾配推定や外れ値クリッピングなどは演算子単位でSNRが上がっても全体では効かなかった（抄録）。", "fun": "AIの計算を4ビットという極端に粗い数で行うと速く安くなるが、丸め誤差で学習が崩れやすい。この研究は、重みが丸めの境目で行ったり来たりして揺れるのを抑える工夫などで、16ビットとほぼ同じ品質に近づけた。うまくいかなかった工夫も正直に報告しているのが実務的である。", "unverified": "実時間の速度は最適化されておらず、著者も未報告としている。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "従属打ち切り下の生存予測性能の部分識別", "title": "Partial Identification of Survival Prediction Performance under Dependent Right Censoring", "url": "https://arxiv.org/abs/2610.32488", "authors": "Yuji Komiyama ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Komiyama, Y., & Matsuda, Y. (2026). Partial Identification of Survival Prediction Performance under Dependent Right Censoring (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32488", "why": "打ち切りと事象の依存を制約せずに積分Brierスコアとその差の鋭い限界を導き、頑健な優越の検定を与えた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "打ち切りと事象時間の依存を一切制約せずに、生存予測モデルの積分Brierスコアとモデル間の差の鋭い限界を部分識別で導き、頑健な優越の検定を与えた。", "p3": "各個人の事象時間が評価時点とモデルをまたいで共有される事実を使って限界を導く。3モデル以上では最良の競合との差の鋭い上界も導出。固定した観測分布に対する推定量、信頼領域、頑健な厳密優越の検定、積集合-和集合検定を構成する（抄録）。", "p5": "シミュレーションで信頼領域と対ごとの検定はほぼ名目水準。3つの応用では、打ち切りの少ない住宅ローン前払いデータでのみ検定がIPCWによる順位を支持し、他の2データでは観測データだけでは順位を支持できなかった（抄録）。", "fun": "「誰がいつ亡くなるか」を予測するモデルの良し悪しは、途中で追跡が途切れた人（打ち切り）の扱いで変わる。標準の方法は途切れ方が結果と無関係だと仮定するが、それは確かめようがない。この研究はその仮定を置かず「どんな場合でもこちらが勝つ」と言える範囲を計算した。すると3つの例のうち2つでは、どちらが良いか実は決められなかった。", "unverified": "2つのデータセットの内容は抄録に記載なし。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "現金給付が女性の危険な性行動を減らす", "title": "Sex and Subsistence: Income Effects on Risky Sexual Behavior and Partner Selection", "url": "https://doi.org/10.3386/w35940", "authors": "Natalie Bau ほか", "venue": "NBER Working Paper", "apa": "Bau, N., Low, C., & Steinberg, B. M. (2026). Sex and Subsistence: Income Effects on Risky Sexual Behavior and Partner Selection (NBER Working Paper No. 35940). National Bureau of Economic Research. https://www.nber.org/papers/w35940", "why": "ザンビアの女子学生への月次現金給付のRCTで、性交渉が5.1ポイント減り、避妊なしの性交渉が30%減ることを高頻度データで示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ザンビア大学の女子学生への月次現金給付の無作為化比較試験で、一時的な収入増が性行動とパートナー選択を変え、リスクの高い性行動を減らすことを示した。", "p3": "現金給付のRCTと、性行動とパートナーの特徴に関する詳細で高頻度のデータを組み合わせる。結果を、交際相手か経済的支援をくれる高所得の相手かを探し、送金とコンドーム使用を交渉する動学的なパートナー探索モデルで説明する（抄録）。", "p5": "処置群は給付期間中に性交渉を持つ確率が5.1ポイント低く、避妊なしの性交渉は30%減。ベースラインで性的に活発でなかった女性では性交渉の確率が43%減り、相手の質が大きく改善した。給付は食料の安定、精神健康、認知能力も高めた（抄録）。", "fun": "性行動は個人の好みの問題と思われがちだが、この実験は「お金を渡すと変わる」ことを示した。大学生という比較的恵まれた集団でも、収入が増えると危険な性行動が減り、相手選びも変わった。性行動のかなりの部分が生活費の必要から来ていたという、重い事実を無作為化実験で明らかにしている。", "unverified": "給付額と参加人数は抄録に記載なし。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "高齢者の治験費用補助が薬の開発と採用を変える", "title": "Representation, Innovation, and Product Adoption", "url": "https://doi.org/10.3386/w35936", "authors": "Jennifer L. Kao ほか", "venue": "NBER Working Paper", "apa": "Kao, J. L., & Oostrom, T. (2026). Representation, Innovation, and Product Adoption (NBER Working Paper No. 35936). National Bureau of Economic Research. https://www.nber.org/papers/w35936", "why": "2000年のMedicareの治験費用補助で高齢者の治験参加が増え、高齢者に多い疾患の治験と新薬利用が増えたことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "製品開発で特定の集団を参加させる費用を下げると、その集団の代表性、その後のイノベーション、製品の採用がどう変わるかを、2000年のMedicareによる高齢者の治験費用補助で検証した。", "p3": "歴史的に過小代表だった高齢者の治験費用をMedicareが補助した政策を自然実験とし、治験の適格条件と参加者構成、治験数、新薬の利用、治験結果・有害事象・承認を追う（抄録）。", "p5": "治験の依頼者は適格条件を高齢者に広げ、高齢参加者の割合を増やした。高齢者に多い疾患の治験数が即座に大きく増え、特に未承認薬と、承認薬の新しい疾患への試験で増加。新たに試験された薬の高齢者での利用が増えた（抄録）。", "fun": "新薬の試験に高齢者があまり参加していなかったのは、高齢者向けの保険が治験の費用を出さなかったからでもあった。保険が費用を持つようにした途端、製薬会社は高齢者を対象に加え、高齢者に多い病気の治験が増え、結果として高齢者が使える薬が増えた。誰を試験に入れるかという地味な費用の問題が、何が発明されるかを変えた。", "unverified": "増加の大きさの数値は抄録に記載なし。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "海外で起業する創業者は資金は得るが成功は選択的", "title": "Global Entrepreneurial Talent Flows: Widely Funded, Selectively Successful?", "url": "https://doi.org/10.3386/w35943", "authors": "Paul Gompers ほか", "venue": "NBER Working Paper", "apa": "Gompers, P. A., & Woo, H. (2026). Global Entrepreneurial Talent Flows: Widely Funded, Selectively Successful? (NBER Working Paper No. 35943). National Bureau of Economic Research. https://www.nber.org/papers/w35943", "why": "213か国91万の創業者-企業対で、国外創業者と帰国者は早期資金を得やすいが成功プレミアムは米英に集中することを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "213か国の創業者91万人超の経歴から、国外で起業する創業者と帰国者は資金調達には有利だが、成功プレミアムは米英に集中することを示した。", "p3": "1990〜2026年の913,226の創業者-企業対で、国外で起業する「expat」と海外経験後に帰国した「returnee」を、同じ国の比較可能な現地創業者と比べる（抄録）。", "p5": "expatもreturneeも世界的に早期資金を得やすい。しかしexpatの成功プレミアムは米国（18%）と英国（26%）に集中し、特に大学院・就労・直接の創業で米国に入った人で大きい。returneeはそうしたプレミアムをほとんど示さない（抄録）。", "fun": "米国では移民の創業者が地元の創業者より成功しやすいと知られている。それは世界中どこでも成り立つのか。91万人の経歴で確かめると、外国から来た創業者はどの国でもお金は集めやすいが、本当に成功しやすいのは米国と英国だけだった。資金は国境を越えて人について回るが、成功は場所を選ぶという結果である。", "unverified": "成功の定義と比較群の作り方は抄録に記載なし。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "AI発展が都市の画期的イノベーションを促す", "title": "Artificial Intelligence Development and Breakthrough Innovation in Chinese Cities: Evidence from Patent Citations", "url": "https://doi.org/10.2139/ssrn.7669841", "authors": "Ziruo Zheng ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Zheng, Z., Yao, Y., Guo, M., & Wang, Y. (2026). Artificial Intelligence Development and Breakthrough Innovation in Chinese Cities: Evidence from Patent Citations. https://doi.org/10.2139/ssrn.7669841", "why": "中国228都市2010〜2022年のパネルでAI発展が画期的特許を増やし、負の空間波及があることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国228都市の2010〜2022年パネルで、AIの発展が都市の画期的イノベーション（特許引用で測る）を高めることを示した。", "p3": "二方向固定効果モデルと空間計量モデルで効果を推定し、機序（技術によるエンパワーメントと人材構造の最適化）、非線形性、空間波及を調べる（抄録）。", "p5": "AI発展は画期的イノベーションを有意に高め、効果は南部・沿岸部、人口が多く起業が活発な都市で大きい。非線形の関係は見られず、負の空間波及が確認された（抄録）。", "fun": "AIが進んだ都市ほど「それまでにない発明」が生まれるのか。中国の228都市を12年追うと答えは「はい」だったが、隣の都市にはマイナスの影響が出た。人材や資源が集まる都市が周りから吸い上げている可能性があり、AIの恩恵が地域の間で偏ることを示している。", "unverified": "画期的イノベーションの具体的な定義と効果の大きさは抄録に記載なし。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "EUの研究政策を出現と規模化で使い分ける", "title": "From research & innovation to deployment - Tapping into the R&I policy potential to transform knowledge into products", "url": "https://econpapers.repec.org/RePEc:eug:wpaper:ki-01-26-097-en-n", "authors": "Bianca CAVICCHI ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "政策シミュレーションRADARで、出現支援は製品開発に、規模化支援は設備・雇用・市場獲得に効き時間軸が異なることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "EUの研究・イノベーション政策が、知識の生成から戦略技術の展開と産業的な規模化への移行をどう支えられるかを、政策シミュレーションモデルRADARで検討した。", "p3": "出現志向と産業規模化志向の2種類の政策が、研究成果の商業化・採用にどう効くかを模擬する（抄録）。", "p5": "2つの政策論理は異なる成果に異なる時間軸で効く。早期の出現支援は製品開発に、規模化支援は上流基盤ができた後の設備容量・雇用・市場獲得に重要。結果は探索的なシナリオの証拠であり予測や最適政策ではない（抄録）。", "fun": "研究への補助金は「新しい芽を出す」段階と「育った技術を工場にする」段階で効き方が違う。この模擬実験では、芽の段階の支援は製品づくりに効き、規模化の支援は雇用や市場の獲得に効いたが、順番を間違えると効かない。政策にも「いつ」が重要だという整理である。", "unverified": "モデルの構造と対象技術領域の詳細は抄録に記載なし。"}}, {"id": "pn45", "rank": 45, "field": "組織行動・心理的安全性", "headline": "AI支援研究を統御する5原則TRACE", "title": "TRACE: Governing AI-Assisted Research with Principles from Computer Science", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.24035", "authors": "Amirhossein Zohrehvand ほか", "venue": "RePEc NEP", "date": "2026-10-26", "apa": "Zohrehvand, A., & Kapačinskaitė, A. (2026). TRACE: Governing AI-Assisted Research with Principles from Computer Science (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24035", "why": "ソフトウェア工学とセキュリティ研究の実践からAI支援研究の5原則を導き、実装する運用基盤を公開した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ソフトウェア工学とセキュリティ研究の実践から、AI支援研究で人が主導権を保つための5原則TRACEを導き、実装する運用基盤TRACE-OSを公開した。", "p3": "多くの貢献者が共有成果物の管理を保つための実践から原則を抽出し、AI支援研究に転用する。Track records（記録を残す）、Review against sources（出典に対して検証する）、Accept independently（独立に受理する）、Control transitions（移行を制御する）、Evaluate corrections（修正を評価する）の5つ（抄録）。", "p5": "作業単位を区切り各単位の形成に注意を払うことで、AI支援の作業をAIの生成速度ではなく人の注意に合わせて進められるとする。共有の標準が信頼を築き、委任と生産性を可能にすると論じる（抄録）。", "fun": "AIで論文や解析がどんどん作れる時代に、研究者は何を守ればよいのか。この提案は、プログラマーがチームで巨大なソフトを壊さずに開発してきた知恵（記録を残す、出典に照らす、独立に受理する）を研究に持ち込む。速さに人が引きずられないように、作業の単位を人が追える大きさに区切るという発想である。", "unverified": "TRACE-OSの実際の適用例や評価は抄録に記載なし。"}}, {"id": "pn46", "rank": 46, "field": "ヒューマンコンピュータインタラクション", "headline": "車線維持支援の表示は劣化の半分を伝えない", "title": "Silence Is Not Assurance: When Production Lane Keeping Assist Does Not Warn, and What It Costs", "url": "https://arxiv.org/abs/2610.31899", "authors": "Tianjia Yang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Yang, T., Ding, Y., Li, K., Liang, K., Qin, R., & Hu, X. (2026). Silence Is Not Assurance: When Production Lane Keeping Assist Does Not Warn, and What It Costs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31899", "why": "13車種39,800秒の実走行で、車線検出状態の表示が劣化秒の47%しか報告せず、沈黙時の横位置のばらつきが約60%大きいことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "市販の車線維持支援（LKA）が運転者に示す「車線を検出中」の表示が、システムの実際の認識状態をどれだけ反映するかを実走行で測り、劣化の半分しか伝えないことを示した。", "p3": "CANバスから記録した表示状態と運転者の操舵トルク、同じ道路を観測する第三者の視覚システムの車線認識信頼度の3信号を潜在クラスモデルで突き合わせるCANDID-LKAを提案し、3社13車種の39,800秒の実走行に適用（抄録）。", "p5": "表示は車線が見にくい条件に一貫して反応せず、「未検出」と報告する頻度はメーカー間で大きく違う。劣化した秒のうち表示が未検出と報告したのは47%で、第三者の低信頼度は80%。低信頼度エピソードの半分で表示は一度も未検出にならない。表示が検出中なのに認識が低く運転者も制御していない「沈黙」の秒では、続く3秒の横位置の標準偏差が約60%大きい（抄録）。", "fun": "車の運転支援は「いま車線を見ています」とランプで知らせる。ところが実際の道で調べると、本当は見失っているのにランプがついたままの時間が半分以上あり、そのあいだ車は横にふらつきやすかった。沈黙は安心の印ではないという題名のとおり、知らせないことの危うさを数字で示した。", "unverified": "車種名と第三者視覚システムの詳細は抄録に記載なし。"}}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "初学者のAI監督は正しさより適合性を見る", "title": "Beyond Correctness: How Novice Software Engineering Students Exercise Oversight of Generative AI", "url": "https://arxiv.org/abs/2610.32118", "authors": "Ali Shakiba ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Shakiba, A., & Chaffey, T. (2026). Beyond Correctness: How Novice Software Engineering Students Exercise Oversight of Generative AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32118", "why": "145人の学生の962の対話記録で、介入の74.4%が適合性の問題、16.9%が正しさの問題だったことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ソフトウェア工学の初学者が生成AIの出力をどう監督するかを、145人の学生が記録した962の対話から分析し、介入の大半が正しさではなく課題への適合性の問題だったことを示した。", "p3": "1年生145人が構造化したAI日誌に記録した学生-AIの対話962ターン（学生が宣言した介入172件を含む）を、出力の特徴・介入の理由・取った行動・実施の仕方の多次元コーディングで分析する（抄録）。", "p5": "介入の74.4%は適合性の問題、16.9%は正しさの問題。分類できた介入では出力の修正（51.0%）とプロンプトの改良（28.2%）が多く、どちらも工学的な適合に関わる。小さな欠点があると感じた出力は、完璧と感じた出力より評価の確信が低かった（抄録）。", "fun": "AIが書いたプログラムを学生が直すとき、理由は「間違っているから」だと思われがちだが、記録を見ると「動くけれどこの課題には合わない」が4件中3件だった。AIを使いこなすとは誤りを見つけることより、目的に合うかを判断することだと分かる。監督者としての学生の仕事の中身が見えた研究である。", "unverified": "コーディングの信頼性（評定者間一致）は抄録に記載なし。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "組織の個人情報風土が規制と実装を仲介", "title": "From Regulation to Engineering: Organizational Privacy Climate as Mediator", "url": "https://arxiv.org/abs/2610.32576", "authors": "Oshrat Ayalon ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Ayalon, O., Toch, E., Hadar, I., & Birnhack, M. (2026). From Regulation to Engineering: Organizational Privacy Climate as Mediator (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32576", "why": "156人の開発者のSEMで、GDPRの重要性認知が組織の個人情報風土と態度を介して実装に結びつく経路を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の情報システム開発者156人の調査で、GDPRの重要性の認知が組織の個人情報保護の風土と態度を介して実装の実践に結びつく経路を示した。", "p3": "オンライン調査の回答を構造方程式モデルで分析し、組織の個人情報保護風土が、開発者のGDPR重要性認知と個人情報保護の態度・実践の関係を媒介するかを検証する（抄録）。", "p5": "風土はGDPR重要性認知と態度の関係を媒介し、態度は実践と結びつく。規制→風土→態度→実践の媒介連鎖が、規制の直接効果を補完する形で確認された（抄録）。", "fun": "法律で個人情報の扱いを決めても、それをプログラムに落とし込むのは現場の開発者である。この調査は、開発者が法律を重要だと思うだけでは足りず、職場に「個人情報を大事にする空気」があって初めて態度と実践に変わることを示した。規制の効き目は会社の雰囲気を通る、という結果である。", "unverified": "係数の大きさは抄録に記載なし。"}}, {"id": "pn49", "rank": 49, "field": "心理学・認知科学", "headline": "判断の偏りは低次元投影として一つに説明", "title": "The Arena Model: An Account of Human Judgment", "url": "https://doi.org/10.31234/osf.io/g342f_v2", "authors": "Nikolos Gurney", "venue": "PsyArXiv", "date": "2026-10-26", "apa": "Gurney, N. (2026). The Arena Model: An Account of Human Judgment. https://doi.org/10.31234/osf.io/g342f_v2", "why": "数百の認知バイアスを、高次元の世界の低次元投影で判断が動くという単一の機構から導き、反証可能な予測を与える。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "数百の認知バイアスのばらばらな一覧を、「判断は高次元の世界の低次元投影の上で行われる」という単一の説明に置き換えるアリーナモデルを提案した。", "p3": "少数の固定した機構から多くの標準的なヒューリスティクスとバイアスを導く。バイアスは、心が環境より少ない次元で働くとき、研究者が心の使った次元と違う次元を測るとき、内部信号を世界の性質として受け取るときに生じるとする（抄録）。", "p5": "測られていない次元や食い違う次元を考慮すると、合理性からの逸脱の多くが解消すると論じる。既知のバイアスとの整合性を示し、説明の限界を定義し、モデルを検証または反証する診断的な検定を提案する（抄録）。", "fun": "人間の判断のクセは「〇〇バイアス」と数百も名前がついているが、それぞれ別々の説明がある。この論文は、複雑な世界を少ない物差しで測っているだけで、ほとんどのクセが同じ理由から出てくると主張する。地図が土地を省略するように、心も世界を省略している。本当かどうかを試す方法まで提案しているのが潔い。", "unverified": "理論提案であり、新しい実験データは抄録に示されていない。"}}, {"id": "pn50", "rank": 50, "field": "心理学・認知科学", "headline": "構念名と項目と回答が一致しない心理測定", "title": "The Map Is Not the Territory: Construct Names, Items, and Responses in Measures of Mentalizing, Epistemic Trust, and Emotion Regulation", "url": "https://doi.org/10.31234/osf.io/g9fhq_v1", "authors": "Ilaria Maria Antonietta Benzi ほか", "venue": "PsyArXiv", "date": "2026-10-25", "apa": "Benzi, I. M. A., Marelli, M., Parolin, L. A. L., & Ensink, K. (2026). The Map Is Not the Territory: Construct Names, Items, and Responses in Measures of Mentalizing, Epistemic Trust, and Emotion Regulation. https://doi.org/10.31234/osf.io/g9fhq_v1", "why": "2,235人のデータで、構念名が自身の項目に最も合うのは11下位尺度中4つに過ぎず、回答は名前より項目の境界に従うことを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "心理学の構念の名前・質問項目・回答の3つがどれだけ対応するかを、メンタライジング・認識的信頼・感情調節の尺度で検証し、構念名と項目の対応が弱いことを示した。", "p3": "18〜29歳の1,167人（項目水準の分析は事前登録）と14〜20歳の中高生1,068人で、構念名と項目の意味的類似度を回答の相関と比べる（抄録）。", "p5": "構念名が自身の項目に最もよく合ったのは11下位尺度中4つ。項目は回答の構造を反映し（r=.62と.58）、質問紙をまたぐとやや弱い（.42と.37）。回答は名前より項目が引く境界に従った。尺度間の相関は、同じ経験を記述する項目や方法分散からも生じうる（抄録）。", "fun": "心理学の質問紙は「共感」のような名前の下に数個の質問を並べるが、この研究は名前と質問の中身が合っていない場合が多いことを示した。回答者は名前ではなく質問文に答えるので、2つの尺度の相関が「2つの性質が関係する」証拠に見えても、実は似た質問文を2回聞いていただけかもしれない。地図と土地の違いを測った研究である。", "unverified": "意味的類似度の計算方法は抄録に記載なし。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "列車応答の感度で鉄道橋の損傷を間接同定", "title": "Indirect Damage Identification Method for Railway Bridges Based on Train Response Sensitivity", "url": "https://doi.org/10.3390/app162110577", "authors": "Sheng Zhang ほか", "venue": "Applied Sciences", "date": "2026-10-26", "citescore": 6.1, "citescore_year": "2025", "apa": "Zhang, S., Dong, Y., Gong, A., & Hou, J. (2026). Indirect Damage Identification Method for Railway Bridges Based on Train Response Sensitivity. Applied Sciences, 16(21), 10577. https://doi.org/10.3390/app162110577", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（MDPI）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "重載鉄道橋の損傷を、橋に密なセンサを置かず、走行する列車の応答（先頭車両のピッチ角速度）の感度から逆解析で同定し、橋梁中央の加速度を加えた結合同定で微小損傷の検出力と雑音耐性を高めた。", "p2": "長期の高軸重で剛性が劣化する重載鉄道橋では、橋側に密なセンサ網を置く直接的な損傷同定は設置・維持費が高い。車両応答を使う間接法が求められるが、逆問題の不良設定性と軌道不整の励振が課題だった（抄録）。", "p3": "軌道不整の励振を考慮した車両-軌道-橋梁の連成動的モデルを作り、先頭車両のピッチ角速度を主要な応答量として損傷逆解析の感度方程式を立てる。Tikhonov正則化で不良設定性を緩和し、損傷係数の非負制約と動的ロッキング戦略を組み合わせる。その上で橋梁中央の加速度応答を逆解析に取り込んだ車両-橋梁相互作用に基づく結合同定法を構成する（抄録）。直観：橋の剛性が少し落ちると列車の揺れ方がどう変わるかの「感度」を逆にたどって、どこがどれだけ弱ったかを当てる。", "p4": "単一損傷・複数損傷・微小損傷の3種類の数値シナリオで逆解析戦略を比べ、列車速度・計測雑音・軌道不整の水準が同定性能に与える影響を系統的に調べる（抄録）。良いとする基準は、損傷の位置と程度の同定精度と、偽の損傷の抑制。", "p5": "物理的制約は偽の損傷を効果的に抑え、位置と程度の精度を上げる。車両-橋梁相互作用に基づく結合同定は、列車応答のみの手法より微小損傷の検出能力と雑音頑健性で大幅に優れ、40〜80 km/hの速度範囲で主要な損傷箇所を安定して特定できた（抄録）。", "p6": "検証は数値シミュレーションに限られ、実測での確認は抄録に示されていない。解釈：車載の予備選別と橋側の精密診断を組み合わせる階層的な監視戦略を提案しているが、橋側加速度を使う時点で完全な間接法ではない。本文を入手できず、モデルの自由度や雑音水準の具体値は未確認。", "fun": "橋が傷んでいるかを調べるには橋にセンサを付けるのが普通だが、この研究は「橋を渡る列車の揺れ」から逆に橋の弱った場所を当てる。列車の前後の傾きが微妙に変わる様子を手がかりに、計算でさかのぼるが、そのままでは答えが無数に出てしまうので「損傷はマイナスにならない」などの常識を制約に入れて絞り込む。列車が走るたびに橋の健康診断ができれば、点検の費用は大きく下がる。", "unverified": "本文を入手できず、同定誤差の数値、モデルの詳細、軌道不整のスペクトルは未確認。"}}, {"id": "jr02", "rank": 2, "headline": "重み付きSVRで監視データの外れ値を頑健に検出", "title": "A robust SVR-based outlier detection algorithm for monitoring data with data weighting and temporal dependency", "url": "https://doi.org/10.1177/14759217261498355", "authors": "Yongqi Su ほか", "venue": "Structural Health Monitoring", "date": "2026-10-26", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Su, Y., Zhang, H., Xiang, X., & Xia, H. (2026). A robust SVR-based outlier detection algorithm for monitoring data with data weighting and temporal dependency. Structural Health Monitoring. https://doi.org/10.1177/14759217261498355", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（SAGE）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ダム監視記録の異常観測が回帰モデルの当てはめ自体を歪める問題に対し、観測ごとに重みを更新しながら反復するサポートベクター回帰（SVR）と、時間窓で局所的に適応する判定区間を組み合わせた頑健な外れ値検出法を示した。", "p2": "従来のSVRは履歴記録中の異常観測に引きずられ、固定の残差閾値は局所的な時間変動に追従できなかった（抄録）。", "p3": "予測段階では、区分的なHuber–Danish信頼度関数を重み付き反復SVRに埋め込み、頑健な標準化残差から観測重みを更新して、主たる関係に沿う標本の影響を保ちつつ中程度・極端な残差の観測を段階的に抑える。粒子群最適化（PSO）でSVRのハイパーパラメータと区分パラメータを協調して選ぶ（HD-PSO重み付き反復SVR）。判定段階では、滑動時間窓・時間距離重み・重み付き平均と非重み付き標準偏差の混合戦略で局所適応の検出区間を作る（抄録）。直観：怪しい点ほど発言権を小さくしながら当てはめ直し、閾値も時期ごとに動かす。", "p4": "汚染したダム監視系列で検証し、汚染率を上げたときの当てはめの安定性をベイズ回帰・多層パーセプトロン・再帰型ニューラルネット・従来SVRと比べ、判定基準は四分位範囲・Pauta（3σ）基準・滑動Zスコア・滑動中央値絶対偏差などと比べる（抄録）。", "p5": "提案予測器は汚染率が上がっても当てはめ性能を安定に保ち、異常観測への耐性で比較手法を上回った（抄録。判定基準との比較結果は抄録が切れており未確認）。", "p6": "抄録には限界の記載がない。解釈：対象はダムの変位・浸透などの静的監視データと推測され、高サンプリングの振動データへの適用は示されていない。本文を入手できず、汚染率の範囲や検出率の数値は未確認。", "fun": "ダムのセンサ記録には、機器の不調などで本当の動きではない値が混じる。それを見つけるために「普段の動きを表す曲線」を当てはめるが、怪しい値が曲線そのものを引っ張ってしまう。この研究は、曲線から外れた点ほど発言権を小さくしながら当てはめを繰り返し、さらに「異常とみなす幅」も季節や時期で変える。混入が増えても曲線がぶれなかったのが見どころである。", "unverified": "本文を入手できず、データの内容、汚染率の範囲、検出性能の数値は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "V2X連携で信号柱群の振動SHMを自動化", "title": "Artificial Intelligence-Enhanced Connected Structural Health Monitoring of Traffic Signal Mast-Arm Structure Population within Vehicle-to-Everything Infrastructure", "url": "https://doi.org/10.1177/03611981261487419", "authors": "Mahta Zakaria ほか", "venue": "Transportation Research Record: Journal of the Transportation Research Board", "date": "2026-10-26", "citescore": 4.1, "citescore_year": "2025", "apa": "Zakaria, M., Alqurashi, I., & Catbas, F. N. (2026). Artificial Intelligence-Enhanced Connected Structural Health Monitoring of Traffic Signal Mast-Arm Structure Population within Vehicle-to-Everything Infrastructure. Transportation Research Record: Journal of the Transportation Research Board. https://doi.org/10.1177/03611981261487419", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（SAGE）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "信号機のマストアーム構造群を対象に、振動の特徴抽出・物理に基づくモード特徴量・ニューラルネット回帰・エッジ計算・V2X（車両と周辺の通信）基盤・テレマティクス可視化を1つの流れに統合し、状態評価を自動化するSHMの枠組みを示した。", "p2": "構築されたインフラの手動点検は労働集約的で主観的で、大規模な自動化に向かない。振動とAIに基づく手法は有望だが、センサ設置の複雑さ、データ管理の負担、運用のデジタルワークフローとの統合不足で普及が制約されていた（抄録）。", "p3": "新規性は個々の手法ではなく、確立された要素（振動特徴、物理情報に基づくモード特徴量の設計、順伝播型ニューラルネットの回帰器、エッジ計算、V2Xミドルウェア、テレマティクス可視化）をV2X対応のSHMワークフローに統合した点にある。警報は等調回帰と変化点検出を組み合わせ、正常・警告・危機の3段階に自動分類する（抄録）。直観：交通のための通信網（V2X）に構造物の健康情報も乗せて、現場で計算して地図上に表示する。", "p4": "現実的なセンサ雑音の下で、基部・アーム中央・マストアームの各領域の回帰性能を決定係数と平均絶対誤差で評価し、無損傷・危機的損傷の分類率を測る（抄録）。", "p5": "決定係数は基部0.91、アーム中央0.98、マストアーム0.70、平均絶対誤差は0.038、0.020、0.052。警報は無損傷の86%、危機的損傷の72%を正しく分類し、深刻な劣化シナリオの99%超を保守的に介入対象として検出した（抄録）。", "p6": "抄録には著者の限界の記載がない。解釈：検証が数値シミュレーションか実計測かは抄録から判断できず、マストアーム領域の決定係数0.70は他より低い。危機的損傷の正答率72%と「99%超を保守的に検出」の関係は、偽陽性を許容する設定と読める。", "fun": "交差点の信号機を支える金属のアームは何万本もあり、人が1本ずつ点検するのは大変である。この研究は、車と道路が通信する仕組み（V2X）に信号機の揺れのデータを乗せ、現場の小さなコンピュータで健康状態を計算して地図に表示する。深刻な劣化の99%以上を見逃さず拾う一方で「念のため」の警告も多く出すという、安全側に倒した設計になっている。", "unverified": "本文を入手できず、検証データ（実測か模擬か）、構造の本数、損傷シナリオの定義は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "2D画像から大規模構造の高精細3Dツインを再構成", "title": "High‐Fidelity 3D Large‐Scale Engineering Structure Reconstruction From 2D Images", "url": "https://doi.org/10.1155/stc/9303451", "authors": "Jinfeng Xu ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-26", "citescore": 10.3, "citescore_year": "2025", "apa": "Xu, J., Cai, E., Qian, Z., & Feng, S. (2026). High‐Fidelity 3D Large‐Scale Engineering Structure Reconstruction From 2D Images. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/9303451", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "2次元画像から大規模な土木構造物の高精細な3Dデジタルツインを作るために、再構成目的を適応的に重み付けし、多視点サンプリングの不整合によるアーティファクトを平滑化で抑える3Dガウシアンスプラッティング（AWGS）を提案した。", "p2": "SHMには正確な3Dデジタルツインが要るが、大規模構造の複雑な幾何と細部が再構成を難しくしていた（抄録）。", "p3": "適応重み戦略で再構成の目的間のバランスを取り、3D平滑化と2Dのミップフィルタで多視点サンプリングの不整合に起因するアーティファクトを抑える（抄録）。直観：写真を撮る距離や角度がばらばらでも、細部がちらつかないように「ぼかしの度合い」を自動で合わせる。", "p4": "米国のGerrard Hallと中国の超大型コンクリート橋の2つの実構造で検証し、固定の学習設定でGPUメモリの推移と再構成の忠実度を測り、強い雑音と遮蔽の下での頑健性も調べる（抄録）。", "p5": "AWGSは構造の細部を正確に保った写実的な3Dモデルを生成した。固定設定ではGPUメモリの軌跡が経験的に安定しつつ高い忠実度を保ったが、これは試験した実装の特性であり、明示的に強制されたアルゴリズム上のメモリ上限ではない。強い雑音と遮蔽の下でも構造的な整合性を保った（抄録）。", "p6": "抄録には、メモリの安定性が実装固有の観測であるという注意が明記されている。解釈：再構成精度の数値（PSNRなど）や比較手法は抄録に示されておらず、デジタルツインの幾何がSHMの数値モデルにどう接続されるかも未確認。", "fun": "橋の3D模型をコンピュータ上に作るには、写真を何百枚も撮って立体に起こす。最近の「ガウシアンスプラッティング」は半透明の粒で空間を描く手法だが、巨大な橋では遠くと近くで粒の見え方が合わずにちらつく。この研究は粒のぼかし方と目的の重みを自動で調整し、アメリカの歴史的建物と中国の大橋で、細部まで崩れない模型を作った。", "unverified": "本文を入手できず、再構成精度の数値、比較手法、画像枚数は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "発破振動下の煉瓦造建物の固有振動数と減衰を同定", "title": "Identification of Natural Frequencies and Damping Ratios of Brick-Concrete Structural Buildings Under Blasting Vibration Excitation", "url": "https://doi.org/10.3390/buildings16214231", "authors": "Ruhai Yin ほか", "venue": "Buildings", "date": "2026-10-26", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Yin, R., Yan, P., Zhu, K., Yang, X., & Zhang, Y. (2026). Identification of Natural Frequencies and Damping Ratios of Brick-Concrete Structural Buildings Under Blasting Vibration Excitation. Buildings, 16(21), 4231. https://doi.org/10.3390/buildings162142
