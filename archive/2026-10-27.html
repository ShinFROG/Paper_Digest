, Gao, J., Chen, H., Cao, W., Zhang, Z., & Zhou, G. (2026). Open-set domain generalization for quantitative identification of crack opening angles in bridge CFRP strengthening components using laser line scanning thermography. Construction and Building Materials, 548, 148669. https://doi.org/10.1016/j.conbuildmat.2026.148669", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトとCrossrefのいずれからも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、レーザーライン走査サーモグラフィで橋梁のCFRP補強部材のき裂開口角を定量同定するために、未知のクラスを含む開集合のドメイン一般化を使う論文と分かる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "橋を炭素繊維で補強した部分にできるき裂は、表面からは見えにくい。レーザーで温めて熱の広がりを撮ると内部の様子が分かるが、学習したことのない種類のき裂に出会うとAIは戸惑う。題名は「見たことのないものにも対応する」仕組みを示しているが、中身は確認できていない。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jr48", "rank": 48, "headline": "有限軌道から確率動力学の遷移作用素を再構成", "title": "Jacobian-consistent reconstruction of transfer operators for stochastic dynamics from finite trajectories", "url": "https://doi.org/10.1360/sst-2026-0201", "authors": "Wenhui Tan ほか", "venue": "SCIENTIA SINICA Technologica", "date": "2026-10-26", "citescore": 2.6, "citescore_year": "2025", "apa": "Tan, W., Liang, J., Zhang, Z., Yan, L., Li, X., Duan, X., & Kapitaniak, T. (2026). Jacobian-consistent reconstruction of transfer operators for stochastic dynamics from finite trajectories. SCIENTIA SINICA Technologica. https://doi.org/10.1360/sst-2026-0201", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイトとCrossrefのいずれからも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、有限個の軌道データから確率動力学の遷移作用素（状態の確率分布を時間発展させる作用素）を、系のヤコビアンと整合する形で再構成する手法を扱う論文と分かる。SCIENTIA SINICA Technologica掲載。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "ランダムに揺れながら動く系の「次の瞬間にどこへ行くか」の確率の地図（遷移作用素）を、観測した軌道の断片から復元できれば、天気や株価のような系の長期の振る舞いが読める。題名は、復元した地図が系の局所的な伸び縮み（ヤコビアン）と矛盾しないようにする工夫を示しているが、中身は確認できていない。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "亜臨界せん断流が粒状床の強度に与える影響", "title": "Effect of sub-critical fluid shear flow on granular bed strength", "url": "https://doi.org/10.1103/2rpg-z6pt", "authors": "Dong Wang ほか", "venue": "Physical Review Fluids", "date": "2026-10-26", "citescore": 4.8, "citescore_year": "2025", "apa": "Wang, D., Bodek, S., Ouellette, N. T., Shattuck, M. D., & O’Hern, C. S. (2026). Effect of sub-critical fluid shear flow on granular bed strength. Physical Review Fluids. https://doi.org/10.1103/2rpg-z6pt", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Physical Review Fluids掲載論文の抄録をOpenAlexの題名検索で取得して使用。本文は入手できず", "preprint": false, "short": true, "p1": "臨界未満の流体せん断流を受けた粒状床が流れの向きに強くなり逆向きに弱くなる現象について、その粒スケールの機序を2次元・3次元の個別要素法で明らかにした。", "p3": "粒子間の静摩擦係数と条件づけ流速を変えて、モデル流体流れを受ける粒状床のDEM模擬を行い、床の強度の方向依存性を調べる（抄録）。", "p5": "臨界未満の粒の運動は床を有意に圧密しない。ある方向の床の強度は、その方向に加えた流体力で動かせる表面粒子の割合と強く相関する。異方的な強度はシールズ数で決まる有限の時間しか持続せず、粒子間の静摩擦は異方性に必須ではないが大きさを変える。床表面のファブリックの履歴の追跡が重要（抄録）。", "fun": "川底の砂は、弱い流れに長くさらされると、その流れの向きには動きにくくなり、逆向きには動きやすくなる。砂が締め固まるからだと思われていたが、計算してみると違い、表面の粒の並び方（どの粒が引っかかっているか）が変わるためだった。砂の「記憶」は中身ではなく表面にあるという発見である。", "unverified": "異方性の大きさの数値は抄録に記載なし。"}}, {"id": "jr50", "rank": 50, "headline": "街路空間の質と住民感情をLLM-BERTで解析", "title": "Street spatial quality and residents' subjective emotions in a shrinking city: A deep learning framework using street view imagery and LLM-BERT", "url": "https://doi.org/10.1016/j.apgeog.2026.104233", "authors": "Haoxuan Jiang ほか", "venue": "Applied Geography", "date": "2026-10-26", "sjr": 1.597, "citescore": 10.0, "citescore_year": "2025", "apa": "Jiang, H., Fu, H., Zhou, G., Ma, Z., Sun, H., Wu, H., Zhou, H., Xu, Z., & Liu, Y. (2027). Street spatial quality and residents’ subjective emotions in a shrinking city: A deep learning framework using street view imagery and LLM-BERT. Applied Geography, 198, 104233. https://doi.org/10.1016/j.apgeog.2026.104233", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトとCrossrefのいずれからも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、縮小都市における街路の空間的な質と住民の主観的な感情の関係を、街路画像とLLM-BERTを用いた深層学習の枠組みで分析する論文と分かる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "人口が減っていく都市で、通りの見た目は住む人の気分にどう結びつくのか。街角の写真と人々の言葉を機械に読ませて両者をつなぐという題名で、空き家や荒れた歩道が気分に影を落とす様子を数値化しようとしているように読める。中身は確認できていない。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "供給途絶時に独占の選択肢が価格高騰を生む", "title": "Price Gouging and the Monopoly Option", "url": "https://doi.org/10.1093/restud/rdag119", "authors": "Samuel Häfner ほか", "venue": "Review of Economic Studies", "date": "2026-10-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "apa": "Häfner, S., & Taylor, C. R. (2026). Price Gouging and the Monopoly Option. Review of Economic Studies. https://doi.org/10.1093/restud/rdag119", "why": "必須投入財の途絶時に販売を控えて競合の在庫切れ後に独占する「独占オプション」が価格を跳ね上げる動学寡占モデルを示し、価格上限や政府備蓄の厚生効果を導く。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（Oxford）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "必須の投入財が途絶して企業が在庫に頼る局面では、販売を控えてライバルの在庫切れ後に市場を独占する「独占オプション」が生まれ、途絶の開始時点で価格が競争水準を超えて跳ね上がり、その後も高止まりすることを動学的寡占モデルで示した。", "p2": "災害や供給網の寸断時に見られる便乗値上げ（price gouging）が、なぜ・どの時点で起き、価格上限や政府備蓄がどう効くかを、在庫と動学的な競争の枠組みで説明する必要があった（抄録）。", "p3": "投入財が入手できる通常局面と、在庫に頼らざるを得ない途絶局面の2局面をもつ動学的寡占モデル。途絶は、いま売るのを控えてライバルが在庫切れになったあとに独占者として売るという「上回る値付け（overcutting）」の誘因を生む（抄録）。直観：品薄のときは「売らずに待つ」こと自体に価値があり、その価値の分だけ最初から値段が上がる。", "p4": "理論モデルの均衡分析で、価格経路、厚生、在庫投資への政策（価格上限、政府備蓄、備蓄義務）の効果を比べる（抄録）。", "p5": "独占オプションにより価格は途絶の発生時に競争水準を超える水準へ跳び、途絶の間ずっと競争価格経路を上回る。価格上限は厚生を高めるが在庫投資を減らす。政府備蓄は価格を下げ緩衝在庫を増やし、財政的に実行可能なら備蓄義務も同様に働く（抄録）。", "p6": "抄録には限界の記載がない。解釈：理論モデルの結果であり、実証は抄録に示されていない。価格上限の在庫抑制効果と備蓄政策の比較は、モデルの仮定（在庫費用、需要の形）に依存する。", "fun": "災害で物が入らなくなると値段が跳ね上がるのは、単なる便乗ではないかもしれない。各社が「今は売らずに、ライバルの在庫が尽きた後に独り占めで売ろう」と考えると、その作戦の価値が最初から値段に乗る。この理論は、だからこそ価格の上限は役に立つが、企業が備える在庫は減ってしまうこと、政府が備蓄を持てば値段も下がり在庫も増えることを示す。品薄の値上げを「待つ権利」として読み解いたのが新しい。", "unverified": "本文を入手できず、モデルの仮定、均衡の形、政策比較の定量的な条件は未確認。"}}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "監査可能な目標への置換が手段と目的の乖離を固定", "title": "“The Minimum Wage Is the Maximum Wage”: How Goal Replacement Perpetuates Means–Ends Decoupling", "url": "https://doi.org/10.1177/01492063261487366", "authors": "Satwant Dahiya ほか", "venue": "Journal of Management", "date": "2026-10-26", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Dahiya, S., & Busse, C. (2026). “The Minimum Wage Is the Maximum Wage”: How Goal Replacement Perpetuates Means–Ends Decoupling. Journal of Management. https://doi.org/10.1177/01492063261487366", "why": "68組織75件の面接から、監視下の組織が監査可能な閾値に目標を置き換えて遵守を示しつつ未達を温存する機序を示し、透明性制度の限界を説明する。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（SAGE）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "世界のファッション供給網で労働者の福祉という社会課題に取り組む組織が、監視の強い環境下で「監査可能な閾値」に目標を置き換え、遵守を公に示しながら内部の目標追求を狭めることで、手段と目的の乖離（means–ends decoupling）を再生産する機序を示した。", "p2": "社会問題を軸に組織された分野では、組織は分野の目標への献身を表明し制度的に定められた実践に目に見える形で従うが、多くの目標は未達のままで、透明性の体制の下でなぜ進歩のない遵守が持続し献身の主張が信頼されるかが問われていた（抄録）。", "p3": "ファッション供給網で労働者の福祉を追求するブランド・供給者・第三者機関68組織への75件の面接を分析し、「監査可能性に基づく目標の置換」という組織水準の機序を抽出する。組織は遵守を献身の公的証拠として前面に出しつつ、内部の目標を中核目標に資する監査可能な閾値に絞り、不足を残す。置換についての自己沈黙と不足の道具化が、この構成を自己強化する閉ループにする（抄録）。直観：「監査に通る」ことが目標になり、本来の目標は語られなくなる。", "p4": "質的研究のため、良いとする基準は、面接データから機序が一貫して立ち上がり、既存の乖離研究の問い（なぜ非効果的な遵守が信頼される代替として残るか）に答えること（抄録）。", "p5": "組織は分野の条件と既存の監視基盤を自らの中核目標の推進に流用しながら手段-目的の乖離を再生産し、献身の主張の真正性が問題化され、目標に効果のない遵守が採用した目標の信頼できる代替として優勢になる（抄録）。", "p6": "抄録には限界の記載がない。解釈：単一分野（ファッション供給網）の質的研究で、他の課題領域への一般化は検討が要る。68組織の選び方と面接対象者の立場は未確認。", "fun": "「最低賃金は払っています」と胸を張る会社は、裏を返せば最低賃金以上は払わないと決めている。題名はそれを「最低賃金が最高賃金になる」と言い表す。この研究は、社会問題に取り組むはずの会社が、監査で確認できる基準だけを目標にすり替え、それを達成したことを献身の証拠として見せ、不足については口をつぐむ、という循環を68組織の聞き取りから描いた。透明性を高めるほど、測れるものだけが目標になる皮肉である。", "unverified": "本文を入手できず、面接の内訳、分析手法の詳細、組織の種類別の違いは未確認。"}}, {"id": "jn03", "rank": 3, "field": "因果推論", "headline": "不遵守のある実験の処置効果を目標母集団へ一般化", "title": "Generalizing Causal Effects with Noncompliance: Application to Deep Canvassing Experiments", "url": "https://doi.org/10.1017/pan.2026.10063", "authors": "Zhongren Chen ほか", "venue": "Political Analysis", "date": "2026-10-26", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "apa": "Chen, Z., & Huang, M. (2026). Generalizing Causal Effects with Noncompliance: Application to Deep Canvassing Experiments. Political Analysis, 1–18. https://doi.org/10.1017/pan.2026.10063", "why": "母集団水準の除外制約という新しい識別条件で目標母集団の遵守者平均因果効果を識別し、逆重み推定量と感度分析を与える。", "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（§1 序論と動機例、§3 識別の冒頭、§6.2 シミュレーション結果、§7 実証応用、§8 結論の一部）を読んだ。定理の証明、§4〜5の推定量と感度分析の式、補足資料は読んでいない", "preprint": false, "p1": "無作為化実験で処置を実際に受けた人（遵守者）への効果を、分布の異なる目標母集団へ一般化した「目標遵守者平均因果効果（T-CACE）」を、新しい識別仮定（母集団水準の除外制約）と逆重み付け推定量・多重頑健推定量・感度分析で推定できるようにし、ディープキャンバシングの実験で示した。", "p2": "一般化の既存手法は意図処置効果（ITT）を対象にし、実験と目標母集団の両方にある不遵守を無視してきた。政策上はむしろ遵守者への効果が重要だが、不遵守者は両方で識別できず、実験に参加しやすい人ほど遵守もしやすいため遵守率が異なり、標準の一般化仮定ではT-CACEを識別できない（§1）。", "p3": "実験内の無作為割当を処置受領の操作変数として使い、単調性と有効な操作変数の仮定（仮定3）に加え、操作変数の情報を目標母集団へ移すための第1段階の平均交換可能性（仮定4）という新しい仮定を置いてT-CACEを識別する（定理3.1）。標準の主層ignorability仮定に頼らない。推定は逆重み付け推定量（定理4.1・4.2）、重み付き最小二乗（WLS）、多重頑健推定量で行い、目標母集団に部分的な遵守情報がある場合の拡張、未測定交絡に対する感度分析（仮定6〜8）、操作変数の妥当性検定を与える（§3〜5）。直観：実験参加者と非参加者の「くじで当たった人が実際に受ける率」の違いまで重みで補正する。", "p4": "シミュレーションで各推定量の平均誤差と分散を比べ、主層化推定量（Clarkら2024）との比較や観察研究設定、感度分析の評価は補足資料で行う（§6）。応用はKalla and Broockman（2020）の実験で、郵送で募った登録有権者217,600人のうち7,870人が応答し、物語交換ありの説得2,624人・なし2,623人・対照2,623人に無作為化。設定1は追跡調査を受けなかった参加者（33の事前共変量を利用）、設定2は実験に参加しなかった209,730人の有権者（年齢・性別・地域・投票履歴のみ）への一般化で、世帯内依存を考慮した分散推定を使う（§7）。", "p5": "シミュレーションでは重み付き・WLS・多重頑健の各推定量の平均誤差は無視できる大きさで、遵守を考慮しない重み付きITTは下方に偏り、WLSと多重頑健推定量は重み付き推定量より分散がかなり小さい。主層ignorabilityが未測定交絡で破れてもWLSは頑健で主層化推定量は系統的に偏る（§6.2、補足F.2）。応用の設定1ではT-CACEの推定値が12%〜20%で、重み付きとWLSは5%水準で有意、主層化推定量も12.4%（[2.8, 23.3]）と同程度。一般化したITTの10.3%（[5.2, 15.4]）より大きく、標本内CACEの13.2%（[6.2, 20.1]）と同程度（§7.1）。設定2では主層化推定量を除きいずれも5%水準で有意でなく、分布のずれが大きいため区間が広い（§7.2、図1）。", "p6": "著者は、参加しなかった有権者への一般化では基本的な人口属性しか調整できず効果が不明確なままであること、区間の広さが標本と目標の不均衡に由来することを述べる（§7.2）。解釈：識別は仮定4（第1段階の交換可能性）という検証不能な仮定に依存し、その破れには感度分析で対応する設計である。定理の証明と感度分析の結果は読んでおらず未確認。", "fun": "「この説得法は効く」という実験結果は、実験に参加した人にしか当てはまらないかもしれない。しかも、参加者の中でも実際に会話に応じた人（遵守者）への効果と、応じなかった人を含めた効果は別物である。この研究は、実験に来なかった人の中で「もし呼べば応じたはずの人」への効果まで推定する方法を作り、移民への偏見を減らす対話の実験で試した。追跡調査に来なかった人には効果が確かめられたが、最初から参加しなかった20万人については、情報が少なすぎて答えが出なかった。できることとできないことを正直に分けている。", "unverified": "定理3.1・4.1・4.2の証明、§5の感度分析の式と補足資料の結果（表7、F.2〜F.4、H.1）は読んでいない。"}}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "共通所有は航空のサービス品質を下げ価格を上げる", "title": "Common ownership and consumer welfare", "url": "https://doi.org/10.1007/s11747-026-01213-w", "authors": "Saeed Janani ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-10-26", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Janani, S., Aghaie, S., Fotheringham, D., & Houston, M. B. (2026). Common ownership and consumer welfare. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01213-w", "why": "1995〜2025年の米航空の多市場データで、共通の機関投資家を持つ競合ほど品質が低く価格が高いことを示し、顧客資産と多市場競争による調整を明らかにした。", "explain": {"basis": "本文", "basis_note": "Springerの出版社HTML本文（抄録、データと産業の文脈、従属変数の測定、結果、内生性分析の冒頭、考察、限界）を読んだ。仮説の導出、共通所有の測定の詳細、表3・4の全数値、頑健性チェックは読んでいない", "preprint": false, "p1": "米国航空会社の1995〜2025年の多市場データで、競合企業に共通の機関投資家（共通所有）が多いほどサービス品質が低く価格が高いこと、その効果が多市場接触で強まり顧客資産の価値が高い企業で弱まることを示し、共通所有が価格だけでなく品質を通じて消費者厚生を損なう初の実証を与えた。", "p2": "共通所有の研究は企業業績に偏り、消費者厚生への帰結を見落とすか矛盾した結果を示してきた。品質は価格と違って投資と時間を要するため、共通所有の品質への影響は消費者に長期の影響を持ちうる（抄録、考察）。", "p3": "DOTのDB1B（各四半期の航空券の10%標本、1995Q1〜2025Q2）から市場ごとの運賃と旅客シェア、On-Time Performanceと Form 41から運航実績と付帯収入を得て、LSEGの13F（1億ドル超を運用する機関投資家の保有）から共通所有を測る。初期データは579,711のキャリア-路線-四半期観測（§Data）。品質は外的要因によらない遅延（定時到着率）、手荷物事故率、顧客苦情を主成分分析（第1成分の固有値1.367、分散の45.6%）で0〜100に標準化（§Service quality）。多市場接触（MMC）と顧客資産価値（CA）を調整変数とし、路線・機関所有・企業費用の統制と時間固定効果を入れる（§Control variables）。直観：同じ投資家がライバル同士の株を持つと、競い合って品質を上げる動機が弱まる。", "p4": "交互作用項の有無で主仮説を検定し（平均VIF 1.60、1.71）、調整効果は±1標準偏差の限界分析で示す（図2）。内生性には固定効果、統制変数に加え、共通所有が増えた航空会社-路線を処置として傾向スコアで1対1最近傍マッチングするRubin因果モデルと、コピュラ補正の2手法を使う（§Endogeneity analysis）。", "p5": "品質に対する共通所有の効果はM1でβ=−0.252（p<.001）、交互作用を入れたM2で−0.114（p<.001）。MMC×共通所有は−0.941（p<.001）で品質への負の効果が多市場接触で強まり、CA×共通所有は0.029（p<.001）で弱まる。価格への効果はM3でβ=2.517（p<.001）、M4で2.463（p<.001）、MMC×共通所有は3.248（p=.092）で限界的、CA×共通所有は−0.049（p=.001）（§Results、表4）。", "p6": "著者は、単一産業（規制が強く競合が少なく購買頻度の低いサービス）への焦点が内的妥当性を高める一方、有形財や競合の多い産業への一般化は今後の課題だとし、市場の成熟度や投資家ポートフォリオの構成の影響も未検討とする（§Limitations）。解釈：共通所有は観察データで内生的であり、マッチングとコピュラは補助的な支持にとどまる。品質指標はPCAの第1成分が分散の半分弱しか説明しない。", "fun": "航空会社AとBのライバル関係は、両社の株を同じ投資会社が持っていると変わるのか。30年分の米国の航空データでは、共通の株主が多い路線ほど遅延や手荷物事故が増え、運賃は上がっていた。株主から見れば両社が激しく競うより穏やかに儲ける方が得だからで、その影響は同じ相手と多くの路線で競う会社ほど強く、常連客という財産を大事にする会社ほど弱かった。株の持ち方が、空の旅の質にまで届くという話である。", "unverified": "共通所有の測定式、表3の記述統計、傾向スコアマッチングとコピュラ補正の結果の数値、頑健性チェックは読んでいない。"}}, {"id": "jn05", "rank": 5, "field": "都市科学", "headline": "都市の建築質量は人口より緩やかに増える", "title": "Nested economies of scale in global city mass", "url": "https://doi.org/10.1038/s44284-026-00532-x", "authors": "Kangning Huang ほか", "venue": "Nature Cities", "date": "2026-10-26", "apa": "Huang, K., & Lu, M. (2026). Nested economies of scale in global city mass. Nature Cities. https://doi.org/10.1038/s44284-026-00532-x", "why": "世界3,000超の都市で建築質量が人口に対し劣線形（都市間β=0.90、都市内δ=0.75）に増えることを示し、都市間の規模則が都市内の人口分布の偏りから生じると説明する。", "explain": {"basis": "本文", "basis_note": "Natureの出版社HTML本文（Main、都市間の規模則、近隣の規模則、近隣格差からの出現、入れ子の複雑系としての都市、Methodsの都市と近隣の定義）を読んだ。Methodsの建築ストック推定と統計解析の詳細、補足情報は読んでいない", "preprint": false, "p1": "世界3,000超の都市の建築質量（建物と道路などの舗装）が人口に対して劣線形（都市間β=0.90、都市内の近隣間δ=0.75）に増えることを示し、都市間の規模則が都市内の人口分布の偏り（Zipf型）から生じることを理論と模擬で説明した。", "p2": "都市科学では人口と建造環境の質量に本質的な対応があるかが長年の問いで、既存モデルは一人当たり一定という比例を仮定してきた。世界の一人当たり建築ストックは1900年の22 tから今日の205 tへ年1.8%で指数的に増え、人口1人が体重の約4,090倍の構造物に対応する（Main、図1）。", "p3": "GHSLの都市核（人口5万以上、3,593都市）を都市、Uberの六角形格子H3解像度6（中心-角の半径約3.7 km、17,497近隣）を近隣とし、建物と移動インフラ・舗装のストックを積み上げで推定して人口と結ぶ（Methods）。国ごとの切片で中心化した規模則 M=M₀N^β と m=m₀n^δ を当てはめ、近隣人口がZipf型（i位の近隣の人口が最大の1/i^s）に従う模擬都市にδ=0.75で質量を与えて都市水準に集計し、都市間のβを再現する（§Emergence）。直観：大都市ほど人を高密度の近隣に集められるので、1人当たりの建材が減る。", "p4": "良いとする基準は、国ごとの規模則の傾きが文化・気候・所得を超えて集中すること、近隣水準の傾きが都市水準より小さいこと、観測した格差パラメータsの分布から模擬したβが観測の分布と一致すること（図2〜4）。Zipf対対数正規の分布検定（Vuong検定）も行う。", "p5": "75か国（5都市以上）の傾きは平均0.88（中央値0.88、標準偏差0.088）で、中心化後の全体はβ=0.9（R²=0.91、n=3,588）（図2）。近隣間はδ=0.75（CI [0.747, 0.754]、n=17,497、R²=0.89）（図3）。格差パラメータsは右に歪み平均1.16で、633都市中22%でZipfが有意に優先（対数正規は1%未満）。sを観測分布から引いた模擬のβは観測の分布とよく一致し、均質な都市系ではβ≈1、不均質ではδ=0.75に近づく（図4）。応用として、人口20倍の都市は建材が約15倍（20^0.9≈14.8）で済み、低所得国の巨大都市化の例では一人当たり約26%少ないと試算する（§Nested）。道路面積の規模則（0.83）より傾きが大きいのは、交通量の多い道路ほど単位面積当たりの材料が多いため（§Universal）。", "p6": "著者は、横断的な関連は因果ではなく個々の都市の成長経路を予測しないこと、建築ストックの蓄積は所得・技術・政策にも依存すること、一次近似は移住者が現在の分布に従って住み続ける場合にしか成り立たないことを注意する（§Nested）。解釈：高さ制限や建物規模の制限のような密度勾配を平らにする政策への警告は、この規模則の読み替えであり、環境・生活の質との兼ね合いは論じられていない。", "fun": "人が2倍になれば建物も道路も2倍要る、と普通は考える。ところが世界3,500都市を調べると、人口が20倍の都市でもコンクリートや鉄の量は15倍で済んでいた。しかもこの節約は、都市の中の一部の地区に人がぎゅっと集まっていることから生まれる。大都市は「無駄に大きい」どころか、材料の面では効率が良く、建物の高さを一律に制限すると、その効率を失うかもしれないという指摘である。", "unverified": "Methodsの建物・舗装ストックの推定法、感度分析、統計解析の詳細、補足表9の検定結果は読んでいない。"}}, {"id": "jn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "工芸の論理が工業化の最前線を支える", "title": "Craft and Industrialization: Uncovering the Plasticity and Frontier of Craft", "url": "https://doi.org/10.1111/joms.70183", "authors": "Mirva Peltoniemi ほか", "venue": "Journal of Management Studies", "date": "2026-10-26", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Peltoniemi, M., & Sihvonen, A. (2026). Craft and Industrialization: Uncovering the Plasticity and Frontier of Craft. Journal of Management Studies. https://doi.org/10.1111/joms.70183", "why": "製紙産業の研究開発での工学の仕事を分析し、工芸的な要素が標準化を逃れる「工芸フロンティア」として工業化を支えることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "製紙産業の研究開発所における工学の仕事を分析し、工業化が工芸（craft）の論理を置き換えるのではなく、工芸の要素が新しい文脈に移植・再解釈されて工業化を可能にし（可塑性）、標準化を逃れる「工芸フロンティア」が工芸と工業の論理の共存を支えることを示した。", "p2": "工芸は大量生産への代替的な仕事の在り方として提案されてきたが、工業化が均一性と規模化のために工芸の論理を工業の論理に置き換えてきたとされる中で、工業化における工芸の役割は曖昧だった（抄録）。", "p3": "製紙産業の研究開発所で行われる工学の仕事の分析（質的研究と推測されるが、データ収集法は抄録に記載なし）から、工芸の要素がどのように、なぜ工業化を可能にするかを探る（抄録）。", "p4": "抄録の範囲では評価基準は示されていない。理論的貢献として、工芸の論理の可塑性と工芸フロンティアの概念化が挙げられる。", "p5": "工芸の要素は、アイデアを有用な物に変える、科学的正確さと実用性の均衡を取る、工学分野内の共同体意識と同一性を育む、という形で工学の仕事に現れた。これは工芸の論理の可塑性を示し、工芸の要素が新しい文脈に移され新しい目的のために再解釈されうることを示唆する。工業化を駆動する研究開発所で行われたことから、将来の標準の候補を作る文脈を提供して標準化を逃れる工芸フロンティアの存在も明らかになり、工芸は管理的統制に吸収されることなくその基礎を築いて工業化に寄与する（抄録）。", "p6": "抄録には限界の記載がない。解釈：単一産業・単一組織の事例研究と推測され、データの種類（面接・観察）と期間は未確認。", "fun": "職人の手仕事（工芸）と工場の大量生産（工業）は正反対に見える。ところが製紙会社の研究所をのぞくと、技術者は職人のように「アイデアを形にし、正確さと使いやすさを天秤にかけ、仲間意識を育てる」働き方をしており、それが次の標準になる製品の種を作っていた。工業化は工芸を追い出すのではなく、工芸が最前線で作った候補を後から標準化していく、という見方の転換である。", "unverified": "本文を入手できず、データ収集法、分析期間、研究所の規模は未確認。"}}, {"id": "jn07", "rank": 7, "field": "ヒューマンコンピュータインタラクション", "headline": "プロンプト力が学習成果と不平等感に結びつく", "title": "Who benefits from LLMs? Prompt engineering competence and equity in higher education", "url": "https://doi.org/10.1186/s41239-026-00633-6", "authors": "Zhengdao Li ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-10-26", "sjr": 7.947, "citescore": 48.4, "citescore_year": "2025", "apa": "Li, Z., Liu, Y., Jiang, J., Zhang, Z., Li, Z., & Chen, W. (2026). Who benefits from LLMs? Prompt engineering competence and equity in higher education. International Journal of Educational Technology in Higher Education, 23(1). https://doi.org/10.1186/s41239-026-00633-6", "why": "380人の調査と400組のプロンプト比較実験で、プロンプト工学能力が学業上の利得と結びつき、家庭のデジタル資本の効果がそれを介することを示した。", "explain": {"basis": "本文", "basis_note": "Springerの出版社HTML本文（抄録、段階1の方法と結果、段階2の設計と結果、限界）を読んだ。文献レビュー、仮説の導出、表3〜4の全係数、考察の大部分は読んでいない", "preprint": false, "p1": "LLMを使いこなすための「プロンプト工学能力（PEC）」を公平性に関わる相互作用能力として概念化し、中国の学部生380人の調査でPECが知覚された学業上の利得と強く結びつくこと、家庭のデジタル資本の効果がPECを介することを示し、400組の実験で5要素の構造化プロンプトが出力の質を一貫して高めることを示した。", "p2": "LLMは高等教育に急速に組み込まれているが、その恩恵は不均一に分配されうる。誰がLLMから利益を得るのか、プロンプトの質の差が学習上の利得や不平等感とどう結びつくかは分かっていなかった（抄録）。", "p3": "段階1は、複数階層の大学の学部生を2025年9〜12月に募集し、PEC、知覚された学業成績の利得（AP）、知覚された教育の不平等（PEI）、家庭のデジタル資本（FDC）、ゲーム経験（GE）、計画・自律作業傾向（PIW）を5件法で測り（407回答→LLM未使用9と注意確認不合格18を除く380人）、回帰と媒介分析を行う。段階2は、4種の課題×25例の100プロンプトを、基本プロンプトと役割-目標-入力-過程-出力の5要素で精緻化したプロンプトで、4モデル（deepseek-v3、doubao-1.5-lite、gpt-5-nano、claude-3.5-haiku）に投げ、400組800出力を7次元の5件法で人間2名とLLM評価者が採点する（§Methods）。直観：同じAIでも「頼み方」の技能で得られるものが変わり、その技能は家庭環境や経験で偏る。", "p4": "良いとする基準は、段階1で仮説（PECの先行要因、PECと利得・不平等感の関連、媒介）が回帰と媒介分析で支持されること、段階2で精緻化プロンプトの対応のある差が有意で安定すること。", "p5": "PECは知覚された学業利得と強く相関し（r=.793）、回帰でB=0.79（β=.79、t=25.33、R²=.63）。PECと不平等感の関連は有意だが小さい（r=−.131、p=.010）。FDC・GE・PIWはPECと利得に正の相関で、特にゲーム経験と計画・自律作業傾向がPECの分散を説明し、FDCの利得への関連は主にPECを介する（§Stage 1、表2〜4）。段階2では総合品質が基本3.318から精緻化4.603へ、対応のある差Δ=+1.285（95%CI [1.255, 1.315]）で、7次元すべてが改善し、提供資料の利用（+1.546）、役割と文脈の一貫性（+1.341）が最大、正確さと深さ（+0.999）が最小（§Stage 2、表6・7）。", "p6": "著者は、段階1が同一回答者の一時点の自己報告で共通方法分散のリスクがあること、中国の学部生という集団に依存すること、段階2は採点された出力の質であって学習や公平性の結果ではないこと、5件法評価で課題・モデル・評価者の効果を階層モデルで扱っていないことを限界に挙げる（§Limitations）。解釈：PEIの尺度は信頼性が低く（α=.66）、不平等感との小さな関連は慎重に読むべきである。", "fun": "AIを使えば誰でも勉強がはかどるかというと、そうではなかった。中国の大学生380人の調査では、AIへの頼み方がうまい学生ほど成績が上がったと感じ、その「頼み方のうまさ」はゲーム経験や計画性、家庭のデジタル環境と結びついていた。一方で、「役割・目標・材料・手順・出力」の5点を書く型を教えるだけで、4つのAIすべてで出力の質が5点満点で約1.3点上がった。差がつく技能だが、型で埋められる技能でもある。", "unverified": "表3の回帰係数の全体、表5の利用場面の集計、考察と結論の内容は読んでいない。"}}, {"id": "jn08", "rank": 8, "field": "ヒューマンコンピュータインタラクション", "headline": "先入観が違う班ほど生成AIの促しを活かす", "title": "GenAI ‐based metacognitive prompting in collaborative inquiry: A comparison across diverse preconception groups", "url": "https://doi.org/10.1111/bjet.70095", "authors": "Mengke Wang ほか", "venue": "British Journal of Educational Technology", "date": "2026-10-26", "sjr": 3.83, "citescore": 23.1, "citescore_year": "2025", "apa": "Wang, M., Lämsä, J., Sobocinski, M., Edwards, J., Whitehead, R., & Järvelä, S. (2026). GenAI ‐based metacognitive prompting in collaborative inquiry: A comparison across diverse preconception groups. British Journal of Educational Technology. https://doi.org/10.1111/bjet.70095", "why": "協働探究でのメタ認知促し生成AIへの関わりを、先入観の異なる班と似た班で比べ、系列分析とプロセスマイニングで対照的な過程を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "協働探究で生成AIがメタ認知的な促し（問いかけ）を与えるとき、班のメンバーの先入観が異なるか似ているかによって、促しへの関わり方と協働の過程が対照的に変わることを、14班の対話データの系列分析とプロセスマイニングで示した。", "p2": "生成AIは社会的に共有された学習の自己調整（SSRL）を支えるメタ認知的促しに使われ始めているが、学習者の先入観がAIの促しへの関わりをどう形作るかは分かっていなかった（抄録）。", "p3": "エネルギーの形態と保存について、異なる先入観を持つ8班（D班）と似た先入観を持つ6班（S班）の計14班が、書面のメタ認知AI（MAI）に問いを投げながら協働探究を行う。学習者が生成した問いの分布、促しの評価の系列（ラグ系列分析）、協働の流れ（プロセスマイニング）を比べる（抄録）。直観：意見が割れている班ほど、AIの問いかけを「使える道具」として扱う。", "p4": "良いとする基準は、D班とS班で促しの評価パターンと協働過程の構造が統計的に異なること（抄録）。", "p5": "MAIへの問いの分布は両群でほぼ同じだった。ラグ系列分析では、D班は促しを持続的に肯定・中立に評価し、S班は持続的に否定的に評価した。プロセスマイニングでは、D班ではAIへの問いの交渉が概念的議論と課題の調整をつなぐハブになったのに対し、S班ではAIに問い応答を処理するだけの単純な線形の流れになった（抄録）。", "p6": "抄録には限界の記載がない。解釈：14班という小規模な比較で、科目は物理のエネルギー概念に限られる。先入観の異同は事前に測った上での割付であり無作為化ではないと推測されるが未確認。", "fun": "グループ学習にAIの「考えを促す問いかけ役」を入れると、効き方は班によって逆になった。メンバーの考えがばらばらな班は、AIの問いを議論の中心に据えて意見をすり合わせたのに、考えが似ている班はAIの問いを「邪魔だ」と受け流し、聞いて答えを処理するだけだった。AIは意見の違いがあって初めて役に立つ、という観察である。", "unverified": "本文を入手できず、班の人数、課題の期間、統計量は未確認。"}}, {"id": "jn09", "rank": 9, "field": "政治学", "headline": "権威主義下の権力分有は反対派の脅威を高める", "title": "The threat‐enhancing effect of authoritarian power sharing", "url": "https://doi.org/10.1111/ajps.70089", "authors": "Jack Paine", "venue": "American Journal of Political Science", "date": "2026-10-26", "sjr": 6.539, "citescore": 12.4, "citescore_year": "2025", "why": "権力分有が反対派の強制力を高める摩擦を動学モデルに組み込み、反対派側の約束問題が分有の遅れや紛争を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "権威主義体制で権力を分有すると反対派の強制力が高まる「脅威増大効果」を動学モデルに組み込み、それが反対派の側に2つの約束問題を生んで、権力分有の遅れ・紛争・支配者の分有意欲の増加といった新しい動学的帰結をもたらすことを示した。", "p2": "権力分有の取り決めは独裁者の約束問題を解決しうるが紛争を防げないことが多く、既存研究は独裁者側の約束問題に焦点を当ててきた。分有が反対派の強制力を高めるという見落とされた摩擦を扱う必要があった（抄録）。", "p3": "支配者と反対派の動学的ゲーム理論モデル。権力分有が反対派の強制力を高める脅威増大効果を仮定し、(1)反対派が高まった脅威を使わないと約束できない、(2)将来の分有を待つ誘惑が今日の反乱への約束を弱める、という反対派側の2つの約束問題を導く（抄録）。直観：相手に力を分けると、相手はその力を使いたくなるし、もっともらえるまで待ちたくもなる。", "p4": "理論モデルの均衡分析で、分有が起きる条件と時期、紛争の可能性を比較静学的に調べる（抄録）。", "p5": "脅威増大効果が大きいと支配者は平和的な分有より反乱を被る方を選ぶ。分有の遅れ、紛争、支配者の分有意欲の増加がいずれも起こりうる。反対派の限られた約束能力に注目する点が、独裁者の約束問題に偏った既存研究と対照をなす（抄録）。", "p6": "抄録には限界の記載がない。解釈：純粋な理論モデルで実証例は抄録に示されていない。脅威増大効果の大きさは外生的なパラメータと推測される。", "fun": "独裁者が反対派に権力の一部を分けるのは、約束を信じてもらって平和を買うためだとされてきた。しかしこのモデルは、分けた権力は反対派の武器にもなるので、反対派の方が「もらった力を使わない」「将来の取り分を待たずに今動く」と約束できなくなると指摘する。分けると危ないから分けない、あるいは分けるのが遅れる、という逆説が生まれる。約束を守れないのは独裁者だけではない。", "unverified": "本文を入手できず、モデルの構造、均衡の条件、数値例の有無は未確認。"}}, {"id": "jn10", "rank": 10, "field": "政治学", "headline": "女性を包摂する政党ほど左派と見なされる", "title": "Gender inclusivity and perceptions of party ideology: Observational and experimental evidence", "url": "https://doi.org/10.1017/s1475676526101923", "authors": "James Adams ほか", "venue": "European Journal of Political Research", "date": "2026-10-26", "sjr": 3.432, "citescore": 8.2, "citescore_year": "2025", "why": "21か国の選挙調査と4か国の実験で、政党のジェンダー包摂性がイデオロギー認知の手がかりになることを示した。", "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（抄録、ジェンダー包摂性の測定、観察データの結果と表3、実験の設計と結果、考察と結論）を読んだ。理論節、頑健性チェック、付録は読んでいない", "preprint": false, "p1": "市民は女性を多く含む政党を、その政党の公約の左右の色合いを統制してもなお、より左派と認知するという「ジェンダーに基づくヒューリスティック」を、21か国の選挙調査と4か国の調査実験で示した。", "p2": "市民は政党のイデオロギーを推定するのに近道を使う。女性議員の割合だけでなく、女性党首、候補者のジェンダークォータ、女性支持者の多さといった可視的な包摂性の手がかりが、公約とは別に左右の認知を動かすかは明らかでなかった（抄録）。", "p3": "観察分析はCSESの1996〜2020年の21の西側民主国94選挙調査で、回答者が政党を0〜10の左右尺度に置いた60万件超の配置を従属変数とし、政党の女性議員比率（t−1）、女性党首（t−1）、候補者クォータ（t）、女性支持者比率（t）の4次元と、公約の左右コード（RILE）を説明変数に、選挙固定効果で推定する（§Measuring、表1）。実験は2019年にカナダ・デンマーク・ドイツ・英国でQualtricsパネルの各国約1,000人に、6つの情報スロット（党名、党首の写真、協力関係、政策、候補者の女性比率やクォータ、支持層）を無作為化した架空政党を見せて左右に置かせるコンジョイント設計（§Experimental design）。直観：「誰が党にいるか」というメッセンジャーの情報が、メッセージ（公約）とは別に読まれる。", "p4": "良いとする基準は、公約の色合いを統制しても包摂性の各次元が左への配置を予測すること、無作為化実験でも同方向の平均限界成分効果（AMCE）が得られること、部分集団（男女、左右の支持者、前期・後期）で頑健なこと（§Results、§Discussion）。", "p5": "観察分析（N=609,935）では、各次元を単独で入れた場合に女性議員比率−2.42、女性党首−0.27、クォータ−1.25、女性支持者比率−2.01と、いずれも左方向に有意。全次元同時のモデル5では女性議員比率−1.41、クォータ、女性支持者比率が有意で、女性党首は方向は同じだが有意でない（調整R² 0.32）（表3）。実験では、カナダで候補者の50%が女性と知らされると10%の場合より0.53単位左（p<0.01）、30%で0.25単位左。ドイツ・デンマーク・英国でも同方向で概ね有意だが0.2〜0.3単位と小さい（図4）。個々の次元の効果は控えめだが累積効果は公約の左右の1標準偏差の変化や明示的なジェンダー平等政策への支持に匹敵する（§Discussion）。", "p6": "著者は、観察分析では公約以外の経路（党幹部の発言など）で左寄りに伝わる可能性を排除できないため実験で補ったこと、中道右派政党に女性を入れても左派とは見なされず、左右の内部で中道か極端かの印象を動かす程度だと注意する（§Experimental analyses、§Discussion）。解釈：実験は4か国・2019年の1時点で、効果の大きさは国差がある。", "fun": "政党がどれだけ左か右かを決めるのは公約のはずだが、人々は「女性がどれだけいるか」でも判断していた。21か国・60万件の回答を調べると、同じ公約でも女性議員や女性支持者が多い党は左寄りに見られ、架空の党を見せる実験でも、候補者の半分が女性だと聞くだけで0.5目盛り左に動いた。1つ1つの効果は小さいが、合わせると公約を大きく書き換えたのと同じくらいになる。何を言うかだけでなく、誰が言うかが党の色を決めている。", "unverified": "理論節、頑健性チェック、付録の各国の全AMCE、クォータと女性党首の実験効果の数値は読んでいない。"}}, {"id": "jn11", "rank": 11, "field": "経営学", "headline": "文化と運用の要因がデジタル変革を左右", "title": "It is all about digitalization: investigating antecedents and effects of digital transformation", "url": "https://doi.org/10.1007/s10961-026-10401-3", "authors": "Slawka Jordanow ほか", "venue": "Journal of Technology Transfer", "date": "2026-10-26", "sjr": 2.013, "citescore": 11.1, "citescore_year": "2025", "why": "ドイツ279社の情報提供者データで戦略・運用・組織・文化の要因を同時比較し、変革成功が革新成功を介して企業成果に結びつくことを示した。", "explain": {"basis": "本文", "basis_note": "Springerの出版社HTML本文（抄録、§3.1 標本、§3.2 測定の冒頭、§4.3 構造モデルの結果、§9 限界）を読んだ。仮説導出、測定モデルの結果（表2〜3）、考察と含意（§5〜8）は読んでいない", "preprint": false, "p1": "ドイツの279の組織の実務者調査で、デジタル変革の成功に戦略・運用・組織・文化の4領域がどう同時に関連するかを比べ、文化と運用の関連が数値上大きいこと、変革の成功が企業の成功に結びつく経路の約60%が革新の成功を介することを示した。", "p2": "デジタル変革は競争力の重要な駆動要因とされるが、どの組織要因が成功に最も強く影響するかは曖昧で、要因を同時に比べて相対的な重要度を示す包括的枠組みがなかった（抄録）。", "p3": "2021年9月にドイツで市場調査機関のオンラインパネルから、デジタル変革に実質的に関与し従業員50人以上の企業に属する回答者を募り、321の適格回答から279を分析する（§3.1）。4領域はそれぞれ3つの下位構成概念からなる反映-形成型の高次構成概念で、7件法の既存尺度で測る（§3.2）。PLS-SEMで4領域→デジタル変革の成功→革新の成功→企業の成功の構造を推定し、5,000回のブートストラップでt値を得る（§4.3）。直観：技術や戦略より、「変化を受け入れる文化」と「日々の運用」がデジタル化の成否を分ける。", "p4": "良いとする基準は、構造経路の有意性、効果量f²（小0.02、中0.15、大0.35）、R²、媒介の間接効果の有意性、領域間の係数差のブートストラップ検定（§4.3）。", "p5": "R²はデジタル変革の成功0.77、革新の成功0.44、企業の成功0.69。変革の成功→革新の成功はf²=0.680（大）、革新の成功→企業の成功はf²=0.664（大）、変革の成功→企業の成功の直接効果はf²=0.121で補完的な部分媒介。先行要因では文化がf²=0.152（中）、運用0.062、戦略0.027、組織0.018でp<0.10の限界的支持。領域予測変数の内部VIFは3.57〜5.46で無視できない共線性があり、ブートストラップの係数差検定は4領域の統計的な順位づけを支持しない（§4.3、抄録）。革新の成功を介する間接関連は総関連の約60%（抄録）。", "p6": "著者は、4領域の枠組み（Wiengartenら2013）と下位構成概念の選択が代替可能であること、領域間の共線性のため個々の係数は条件つきの部分関連にすぎないこと、横断設計で因果や時間順序を示せず、特に媒介分析では変革の成功が現在の評価、革新と企業の成功が過去3年を指すため測定窓が揃っていないこと、ドイツ単一国のデータであることを限界に挙げる（§9）。解釈：回答者は自己選択したパネルの単一情報提供者で、共通方法バイアスの検討（§3.3）は読んでいない。", "fun": "会社のデジタル化を成功させる鍵は、立派な戦略か、現場の運用か、組織の仕組みか、それとも文化か。ドイツの279社の回答を同時に比べると、数字の上では「文化」と「運用」が大きく、「戦略」と「組織」は小さかったが、4つは互いに絡み合っていて、統計的にはっきり順位をつけることはできなかった。確かに言えたのは、デジタル化が会社の成功につながる道筋の6割が「新しいものを生み出せたか」を通っていることである。", "unverified": "表2〜5の数値、共通方法バイアスの検定結果、考察と理論的・実務的含意の節は読んでいない。"}}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "農業企業のデジタル化はTFPにU字効果", "title": "How to overcome the productivity pains of digital transformation? The U‑shaped TFP trajectory of Chinese agricultural firms, fixed‑asset constraints and subsidy threshold effects", "url": "https://doi.org/10.3389/fsufs.2026.1992915", "authors": "Xiaorong Zhong ほか", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-10-25", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "why": "中国上場農業企業のパネルでデジタル変革と全要素生産性のU字関係と固定資産比率の媒介、補助金の調整を示した。", "explain": {"basis": "本文", "basis_note": "出版社サイトのPDF本文（抄録、§3.1 データ、§3.2.2 デジタル変革の測定、§4.2.1 基準回帰、§4.5.2 補助金の調整効果の冒頭、§6 結論、§7 限界の冒頭、図2の説明）を読んだ。媒介分析と異質性の表、内生性処理の結果は要約文で確認した範囲のみ", "preprint": false, "p1": "中国のA株上場農業企業の2010〜2022年パネルで、デジタル変革が全要素生産性（TFP）に対してまず下がってから上がるU字の効果を持つこと、その経路が固定資産対売上比率の変化であること、政府補助金が転換点を前倒しし曲率を強めることを示した。", "p2": "デジタル変革の生産性効果は製造業では即時的・線形の利得が報告されてきたが、農業では十分に調べられておらず、初期の固定資産蓄積や組織再編の摩擦と、閾値を超えた後の協調・配分最適化という段階性、補助金の強度の閾値が検討されていなかった（抄録、§1、§6）。", "p3": "TFPは営業収益を産出、従業員数を労働、固定資産純額を資本、営業費用等から減価償却と人件費を引いた中間投入でCobb–Douglas生産関数をLP法とOP法で推定する（§3.1）。デジタル変革は年次報告書の全文からAI・ブロックチェーン・クラウド・ビッグデータ・デジタル技術応用の語の頻度を数え、総頻度+1の自然対数を取る指標（§3.2.2）。二方向固定効果で線形項と二乗項を入れ、固定資産対売上比率を媒介、政府補助金を調整変数とする非線形の媒介・調整モデルを推定し、操作変数の2SLSと制御関数法で内生性に対処する（§3.3、§4.3）。直観：デジタル化は最初に設備投資で「重く」なり、慣れると配分が良くなって軽くなる。", "p4": "良いとする基準は、線形項が負・二乗項が正で有意なこと、転換点の位置と観測の分布、媒介の間接効果の符号が水準で変わること、補助金の交互作用で転換点が左へ動くこと、所有形態・規模・業種で異質性があること（§4）。", "p5": "統制変数を入れた列(4)で線形係数−0.154（p<0.01）、二乗係数0.036（p<0.01）、調整R² 0.890。企業規模・レバレッジ・ROAはTFPに正で有意、所有集中と資金制約は有意でない（§4.2.1、表3）。転換点の座標は(2.14, 7.82)で、企業年観測の60.43%が転換点の左側にある（図2の説明）。間接効果はデジタル化が進むと負から正に転じ、高水準でのみ有意（抄録）。補助金の交互作用モデルではc_Digital²の係数0.037（p<0.01）でU字は頑健（§4.5.2、表7）。U字は非国有・小規模・畜産企業でより顕著（抄録）。補助金データは16観測が欠けて449観測（§4.5.2）。", "p6": "著者は、操作変数と制御関数を使っても内生性の懸念が残ること、下位業種の異質性が資産特異性や生産サイクルの差に由来することを述べる（§7、§5.4）。解釈：デジタル変革の指標は年次報告書の語の頻度であり、実際の投資や導入を直接測っていない。標本の総観測数は本文で確認できず、補助金の部分標本が449であることから数百観測の小さなパネルと推測され、6割が転換点の左側にあることは、多くの企業がまだ「痛みの時期」にあることを意味する。", "fun": "会社がデジタル化すると生産性はすぐ上がると思われがちだが、中国の農業企業では最初はむしろ下がり、ある水準を超えてから上がるU字を描いていた。理由は、初期に設備ばかり増えて売上に対して「重く」なるからで、慣れてくると資産の使い方が良くなって効いてくる。しかも6割の企業はまだ下り坂の途中にいた。補助金は転換点を早める一方、出しすぎると設備の買いすぎを招くという、さじ加減の話でもある。", "unverified": "標本の総企業数と観測数、媒介分析（表の数値）、異質性分析の係数、2SLSと制御関数の結果、転換点の算出法は読み切れていない。"}}, {"id": "jn13", "rank": 13, "field": "経済学", "headline": "労働組合は労働市場を超えて福祉を支える", "title": "Beyond the labour market: trade union models and social welfare in the European Union", "url": "https://doi.org/10.1177/10242589261495402", "authors": "Ana I. Viñas Apaolaza ほか", "venue": "Transfer", "date": "2026-10-26", "sjr": 1.542, "citescore": 7.8, "citescore_year": "2025", "why": "EU各国2005〜2023年のパネルで組合密度・団体交渉カバー率と職の質・所得・不平等・社会支出の関係を示し、組合を福祉国家の制度的支柱と位置づける。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（SAGE）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "EU諸国の2005〜2023年パネルで、労働組合の存在（組織率と団体交渉カバー率）が、仕事の質の指標だけでなく世帯所得・不平等・貧困リスク・平均寿命・社会支出といった社会福祉の指標とも結びつくことを示し、組合を労働市場の行為者を超えた福祉国家と社会的結束の制度的支柱と位置づけた。", "p2": "欧州の社会対話の将来をめぐる議論の中で、組合の影響が労働市場の内側（賃金や労働時間）にとどまるのか、より広い社会経済的な福祉に及ぶのかが問われていた（抄録）。", "p3": "EU諸国の2005〜2023年のパネルデータで、組合密度と団体交渉カバー率を組合の存在の指標とし、仕事の質（賃金、労働時間、不本意なパートタイム、就労貧困）と社会福祉（世帯所得、不平等、貧困リスク、平均寿命、社会支出）の複数の指標との関係を統合して分析する（抄録）。", "p4": "抄録の範囲では推定法と評価基準は示されていない。", "p5": "組合は労働市場の行為者であるだけでなく、福祉国家と社会的結束の強靭さを支える制度的支柱として機能するという結果を、社会対話の議論への貢献として示す（抄録）。", "p6": "抄録には限界の記載がない。解釈：国レベルのパネルの相関であり、組合が福祉を生むのか福祉国家が組合を支えるのかの因果の向きは抄録からは判断できない。推定法、国数、係数の大きさは未確認。", "fun": "労働組合は賃金や労働時間のために働く団体だと思われているが、EU諸国を20年近く追ったデータでは、組合の強い国ほど所得の格差や貧困が小さく、寿命が長く、社会への支出が多かった。組合は職場の中の交渉役にとどまらず、社会全体の安全網を支える柱の一つかもしれない、という問題提起である。ただし「組合が強いから福祉が良い」のか「福祉国家だから組合が強い」のかは、この結果だけでは分からない。", "unverified": "本文を入手できず、推定法、対象国数、係数の大きさと有意性は未確認。"}}, {"id": "jn14", "rank": 14, "field": "経営学", "headline": "循環経済能力が緑の変革型リーダーシップを革新に変える", "title": "Building Eco‐Innovation in SMEs Through Circular Economy Capability: Revisiting the Role of Green Transformational Leadership", "url": "https://doi.org/10.1002/bse.71760", "authors": "Eamonn Ennoba Batuuro ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-26", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "2時点の3波多源調査（n=335, 302）で、緑の変革型リーダーシップが循環経済能力を介してエコイノベーションに結びつくことを再現した。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "新興国の中小企業で、緑の変革型リーダーシップ（GTL）がエコイノベーションに結びつく主な経路が循環経済能力（CEC）の構築であること、革新的風土がその経路を強めることを、時点を分けた2つの3波調査で再現した。", "p2": "資源に制約のある中小企業は環境施策が経済的存続にも資する必要があり、GTLがエコイノベーションの駆動要因とされる一方、GTLが環境と経済の両目標に必要な組織能力をどう育てるかは分かっていなかった（抄録）。", "p3": "資源ベース理論に基づき、CECがGTLとエコイノベーションの関係を媒介するか、革新的風土（IC）がその関係を強めるかを検討する。新興国の中小企業を対象に、研究1（n=335）と研究2（n=302）の反復横断設計で、各研究は測定間隔を空けた3波・複数源の調査とし、PLS-SEMで検定する（抄録）。直観：リーダーの環境志向はそのまま製品を変えるのではなく、「資源を循環させる力」を会社に育てることで効く。", "p4": "良いとする基準は、2つの時点で媒介と調整の関係が再現されること（抄録）。", "p5": "GTLは主にCECの構築を通じてエコイノベーションと正に関連し、CECは両研究でリーダーシップ-イノベーションの関係を部分的に媒介した。ICはエコイノベーションに直接の効果を持たないが、CECのエコイノベーションへの正の影響を有意に強めた。関係は2時点で再現され、研究2では能力に関わる関連がより強かった（抄録）。", "p6": "抄録には限界の記載がない。解釈：自己報告の調査に基づくPLS-SEMで、複数源・時間分離はあるが因果は確定しない。対象国や業種は抄録に示されていない。", "fun": "社長が環境に熱心なら会社は環境に良い製品を生むのか。新興国の中小企業600社余りの調査では、答えは「直接ではなく、会社が『廃棄物や資源を回す力』を身につけたときに」だった。さらに、新しいことを試す雰囲気がある会社ほど、その力がイノベーションに変わりやすかった。同じ調査を時期を変えて2回行い、結果が再現されたのが強みである。", "unverified": "本文を入手できず、対象国、業種、係数の大きさ、尺度の内容は未確認。"}}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "中小企業が持続可能性支援を使わない理由", "title": "Driving Greater SME Engagement With Stakeholder Support for Environmental Sustainability: The Role of Resources, Barriers and Dependency Activation Strategies", "url": "https://doi.org/10.1002/bse.71655", "authors": "Cristina Fona ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-26", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "英国の中小企業と支援者の47面接から、潜在的・逆向きの依存、制度的障壁、戦略的不作為が支援利用を妨げる機序を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "英国の中小企業と支援提供者への47件の面接と2つのフォーカスグループから、持続可能性支援が豊富にあるのに中小企業の利用が限られる理由として、潜在的・逆向きの依存関係、制度的・構造的障壁、戦略的不作為の3つを明らかにし、資源依存理論を「依存が形成されない機序」の側から拡張した。", "p2": "外部の関係者は中小企業の環境持続可能性に不可欠だが、支援の供給が増えても中小企業の関与は限定的で、支援の生態系の全体像と資源が使われない理由が説明されていなかった（抄録）。", "p3": "資源依存理論と制度理論に基づき、英国の中小企業と支援提供者への47件の面接と2つのフォーカスグループを分析して、支援の生態系を地図化し、利用を妨げる機序を抽出する（抄録）。直観：助けがあるのに使われないのは、助ける側と助けられる側の「依存」が噛み合っていないから。", "p4": "質的研究のため、良いとする基準は、面接データから一貫した機序が抽出され、理論的な説明力をもつこと（抄録）。", "p5": "(i)潜在的で逆向きの依存関係、(ii)制度的・構造的障壁、(iii)関与を弱める戦略的不作為、が明らかになった。資源依存理論を依存の形成から「形成を妨げる機序」へ注意を移すことで拡張し、支援関係をどう活性化できるかの新しい概念的視点を提供する。政策立案者と仲介者に向け、ネットゼロの課題に沿って中小企業と関係者の相互作用を強め持続可能性の採用と炭素削減を加速する実践的示唆を示す（抄録）。", "p6": "抄録には限界の記載がない。解釈：英国の単一文脈の質的研究で、3つの機序の相対的な重要度は示されていない。面接対象の企業規模と業種は未確認。", "fun": "中小企業向けに「環境対策を手伝います」という支援は山ほどあるのに、ほとんど使われていない。英国で47人に理由を聞くと、「支援する側が実は企業を必要としている」というねじれた依存関係や、制度の壁、そして「とりあえず何もしない」という企業側の戦略が浮かび上がった。資源が足りないから頼るという理論を、「なぜ頼らないのか」の側から読み直した研究である。", "unverified": "本文を入手できず、面接対象の内訳、3つの機序の詳細な記述、政策提言の具体的内容は未確認。"}}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "日本のAI研究・グリーンボンド・女性管理職とCO2", "title": "Long‐Run Relationships Between Green Finance, Artificial Intelligence, Women in Management, and Carbon Emissions: Evidence From Japan", "url": "https://doi.org/10.1002/sd.71806", "authors": "Rahman Aydın ほか", "venue": "Sustainable Development", "date": "2026-10-26", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "why": "日本の長期データにフーリエ型の構造変化を許す手法を使い、AI研究・グリーンボンド・女性管理職の存在がCO2と負の相関を示すとした。", "explain": {"basis": "抄録", "basis_note": "Sustainable Development掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "日本について、AI分野の科学論文の生産、グリーンボンドの発行、上級・中間管理職の女性の存在と、CO2排出の長期的な関係を、構造変化を許す手法で調べた。", "p3": "経済成長と貿易開放度を統制変数に含め、緩やかな構造変化を考慮するフーリエ理論に基づく手法で長期関係を推定する（抄録）。", "p5": "AI分野の科学論文、グリーンボンド発行、女性リーダーの存在はCO2排出と負の相関を持ちうる一方、経済成長と貿易開放は正の関連を示した。技術的知識、持続可能な資金、包摂的な統治が補完的な機序になりうると解釈し、SDGsの5・7・9・13を一つの枠組みで扱う（抄録）。", "fun": "AIの研究が盛んになること、環境向けの債券が増えること、女性の管理職が増えることは、別々の話に見える。日本の長期データでは、この3つがどれも二酸化炭素の排出の少なさと同じ向きに動いていた。もちろん相関であって因果ではないが、技術・お金・人の多様性を一つの画面で眺めるという視点が珍しい。", "unverified": "データ期間と係数の大きさは抄録に記載なし。相関であり因果ではない。"}}, {"id": "jn17", "rank": 17, "field": "機械学習", "headline": "分位点ML+SHAPでセクター配分", "title": "From Explainable Forecasts to Portfolio Weights: SHAP-Based Quantile Machine Learning for Dynamic S&P 500 Sector Allocation", "url": "https://doi.org/10.3390/make8110351", "authors": "László Vancsura ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-10-26", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "why": "分位点勾配ブースティングのSHAP値を配分重みに変換する枠組みを、2020年危機と2025年前半で検証した。", "explain": {"basis": "抄録", "basis_note": "Machine Learning and Knowledge Extraction掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "分位点勾配ブースティングのSHAP値を配分の重みに変換する説明可能なポートフォリオ配分の枠組みを作り、S&P 500のセクター配分で検証した。", "p3": "2017年1月〜2025年6月のS&P 500と11のGICSセクター指数の日次データで、平均ベースと分位点ベースのXGBoost・LightGBMを比べ、分位点別のSHAP値をシャープ比に着想した帰属ベースの配分規則で重みに変換する。2020年のCOVID-19危機と2025年前半の2つの局面でS&P 500と裾リスク志向のポートフォリオに対して評価（抄録）。", "p5": "分位点の枠組みは点予測を超える分布情報を捉えるが、生の裾の分位点はサンプル外で較正が不完全。SHAP分析は市場局面によってセクターの重要度が大きく変わることを示した（抄録。以降は切れている）。", "fun": "AIで株の配分を決めるとき、なぜその配分なのかが分からないと実務では使えない。この研究は、予測への各業種の「寄与度」をそのまま配分の重みにするという直球の方法を試した。相場が荒れた時期と穏やかな時期で重要な業種が入れ替わる様子が見えるのが面白いが、極端な値の予測は当たりきらなかったという正直な報告もある。", "unverified": "運用成績の数値は抄録が途中で切れており未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "倫理コンサルタントが築く倫理基盤", "title": "The Institutional Work of Ethics: How Business Ethics Consultants Build Ethical Infrastructure", "url": "https://doi.org/10.1111/beer.70157", "authors": "Tong Li ほか", "venue": "Business Ethics, the Environment and Responsibility", "date": "2026-10-26", "sjr": 1.192, "citescore": 9.1, "citescore_year": "2025", "why": "17人の面接から倫理コンサルタントの3つの役割を抽出し、倫理基盤と制度的作業の視点を橋渡しする。", "explain": {"basis": "抄録", "basis_note": "Business Ethics, the Environment and Responsibility掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "企業倫理コンサルタント17人の面接から、彼らが組織に倫理を埋め込むために担う3つの役割を特定し、倫理基盤（構造）と制度的作業（実践）の視点を橋渡しした。", "p3": "半構造化面接17件を、Ethical Infrastructureの構造的視点とInstitutional Workの行為者視点を統合して分析する（抄録）。", "p5": "規制的な構造と作業の流れを設計する「道徳的枠組みの設計者」、認知的なセンスメイキングと内部の能力構築を促す「組織の認識的行為者」、派閥の抵抗を乗り越えて正統性を得る「実践的な政治的行為者」の3役割。効果的な倫理コンサルティングは答えを渡すことではなく、複雑な制度的作業の束だとする（抄録）。", "fun": "会社が倫理を外部の専門家に「外注」するのは危ういと批判されるが、専門家は実際に何をしているのか。17人に聞くと、規則を作るだけでなく、社員が自分で考えられるように導き、社内の反対勢力と駆け引きまでしていた。倫理を教える人というより、組織の中で倫理が根づく土台を工事する人だという描き方である。", "unverified": "面接対象者の国や業種は抄録に記載なし。"}}, {"id": "jn19", "rank": 19, "field": "心理学・認知科学", "headline": "生成AIによる知識労働者の一時的な技能向上", "title": "Generative AI and the temporary upskilling of knowledge workers", "url": "https://doi.org/10.1038/s41562-026-02566-6", "authors": "Emma Wiles ほか", "venue": "Nature Human Behaviour", "date": "2026-10-26", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "Nature Human Behaviour掲載。題名から、生成AIの技能向上効果が一時的である可能性を扱う。抄録は未取得。", "explain": {"basis": "題名", "basis_note": "Nature Human Behaviour掲載。出版社サイトとCrossrefから抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、生成AIが知識労働者の技能を引き上げる効果が一時的なもの（AIを使っている間だけ）にとどまる可能性を扱う論文と分かる。Nature Human Behaviour掲載で、掲載誌の性格から実証研究と推測されるが未確認。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "生成AIを使うと仕事の腕が上がったように見えるが、それはAIを取り上げても残る本当の上達なのか、それとも借り物の力なのか。「一時的な」という題名の一語が、この問いの答えを予感させる。中身は確認できていない。"     var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
