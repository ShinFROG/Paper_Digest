<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-27", "intro": "プレプリントの新着267件、学術誌の新着459件（うち上位10%誌300件）、重要論文の候補246件、オープンデータの候補115件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目23報、データ30件です。取得できなかった情報源はありません。論文誌・注目は、候補の多くが材料科学・医学の論文で注目分野に当たるものが少なかったため、件数を減らしています。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "多峰の逆問題をアンサンブルの局所化で解く", "title": "Polarized Ensemble Kalman Inversion: A Derivative-Free Method for Multimodal Inverse Problems with Non-asymptotic Analysis", "url": "https://arxiv.org/abs/2610.31907", "authors": "Huchen Yang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Yang, H., & Wu, J.-L. (2026). Polarized Ensemble Kalman Inversion: A Derivative-Free Method for Multimodal Inverse Problems with Non-asymptotic Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31907", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3.2、§4、§5.1、§5.3、§6と図1・2・5、表1）を読んだ。§5.2（Rastrigin）は要約と図3のキャプションのみ", "preprint": true, "p1": "同じ観測を説明する解が複数ある逆問題で、勾配を使わずに、1つのアンサンブルの中で粒子群が別々の解へ分かれて収束するアンサンブルカルマン逆解析（PEKI）を、有限アンサンブルでの理論保証と半径の選び方つきで示した。", "p2": "標準のアンサンブルカルマン逆解析（EKI）は全粒子で共通の経験共分散を使うため、粒子が複数の解にまたがると更新方向が解どうしの妥協になり、多峰性を捉えられない（§1）。MCMCは順モデルの評価回数が多く、勾配法は勾配が得られない・初期値を何度も変える必要がある（§1）。", "p3": "各粒子iについて他粒子jとの距離d_ijにガウス核 exp(−d²/2κ²) の重みを与え、その重みつきの局所平均・共分散からカルマンゲインを作って更新する（式(3)(4)、§3.2）。κ（分極半径）が唯一の調整変数で、大きいと全体EKIに、小さいと近傍だけの更新に近づく。解釈：遠くの粒子の意見を聞かないことで、各粒子が近くの解に向かう。κは、事前分布の広がりDから上限κ≲D/3、下限κ_l=0.05Dを目安に候補を並べ、初期アンサンブルの順モデル出力を使い回す1ステップの走査で選ぶため、追加の順モデル評価が要らない（§4、Algorithm 1）。", "p4": "理論では、クラスタ間の干渉（重みの漏れと更新の差）が分離距離/κに対して指数的に減ること、線形順モデルでは粒子ごとの残差が拡大しないこと、クラスタ平均の更新が厳密に分解できることを示す（§3.3）。数値実験は、4解のHimmelblau問題（J=1500粒子、20反復）、多数の極小を持つRastrigin型問題（標準EKI、GMM-EKI、GMKIと比較）、x₁=πの鏡映対称で2解になる2次元Navier–Stokesの初期渦度推定（KL係数K=10・50・128次元、56点×2時刻の観測）で行う（§5、表1）。", "p5": "Himmelblauでは標準EKIが粒子を4クラスタに分けられないのに対し、1ステップ走査でκ=1.5（DBCV最大0.2811）を選んだPEKIは20反復で4つの零残差解すべてに集まった（図1）。更新の差は1/κ²に対し半対数で直線になり（粒子別R²の中央値0.99977）、当てはめた減衰率は理論 8)）。Galerkinの重み付き残差法で主要な1モードの常微分方程式に縮約し（式(7)）、未知剛性の推定値 k̂ と推定誤差 k̃=k−k̂ を含む境界制御則と、適応ゲインΓをもつ推定則を設計する（§Adaptive Boundary Control Design、式(11)〜(17)）。直観：制御器が「いま支承がどれだけ硬いか」を推定しつつ、その推定値で境界の反力を打ち消すように力を加える。", "p4": "Lyapunov関数を系の運動・ポテンシャルエネルギーと剛性推定誤差の和として取り、その時間微分が負半定値になることから、一様終局有界性（UUB）を示す（§Lyapunov Stability Analysis）。検証は数値シミュレーションのみで、モード変位・モード速度・剛性推定誤差・制御入力・Lyapunovエネルギー・梁全体のたわみ分布の時間履歴を図2〜8で示す。良いとする基準は、応答が減衰して零近傍の有界領域に留まり、推定誤差が有界に収束し、Lyapunov関数が単調減少することである。", "p5": "モード速度は減衰振動を示し零近傍の有界領域に収まる（図3）。剛性推定誤差は非零の初期値から減少して小さな有界領域に留まる（図4）。制御入力は初期に大きく振動したのち有界に収まる（図5）。推定値 k̂ は振動しながら有界領域に落ち着くが真値に厳密には収束しない（図5の説明）。Lyapunov関数は初期に正で単調に減少し小さな値に近づく（図7）。梁全体のたわみは各時刻で正負に振れる振動を示す（図8）。数値（減衰率、推定誤差の大きさ、パラメータ値）はPDFから判読できず未確認。", "p6": "著者は、推定値が真値に厳密収束するとは限らずUUBにとどまること、1モードへの縮約で高次モードを無視していること、検証がシミュレーションに限られることを認め、実験室規模の橋梁模型での実験検証を今後の課題に挙げる（§Conclusion）。解釈：車両は定速の集中荷重で、車両の動特性（ばね・質量）との相互作用は入っていない。単著の査読前原稿で、本文に式番号の飛びや誤植が多い。", "fun": "橋の支えの硬さは、年月や気温で変わるのに正確には分からない。この研究は、橋を揺らす車が通っている最中に「いま支えはどれくらい硬いか」を推定し続け、その推定値をもとに橋の端で揺れを打ち消す力を出す制御を考えた。エネルギーが必ず減っていくことを数学で示して、揺れも推定の間違いも暴走しないと保証している。分からないものを測りながら抑える、という発想である。", "unverified": "表1のシミュレーションパラメータ（梁の長さ、質量、剛性、車両速度、ゲイン）と各図の数値はPDF抽出で判読できず未確認。式(13)〜(17)の形も判読できず。"}}, {"id": "pr03", "rank": 3, "headline": "GNSS/IMU因子グラフ上で保護レベルを厳密に計算", "title": "Incremental-Smoothing-Based ARAIM Protection Levels for Tightly Coupled GNSS/IMU Integration in Urban Canyons", "url": "https://arxiv.org/abs/2610.32259", "authors": "Jiahao Hu (The Hong Kong Polytechnic University) ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Hu, J., Wang, X., Wen, W., & Qian, M. (2026). Incremental-Smoothing-Based ARAIM Protection Levels for Tightly Coupled GNSS/IMU Integration in Urban Canyons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32259", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（§III システム構成、§IV 完全性監視の枠組み、§V 実験結果の設定・公称評価・計算時間、§VI 結論と表I・III・VI、図5〜9のキャプション）を読んだ", "preprint": true, "p1": "GNSSとIMUを密結合した因子グラフ最適化（FGO）の事後分布の上で、航空で使われるARAIM（先進的受信機自律完全性監視）の解分離と保護レベル（PL）を厳密かつ高速に計算し、都市部の実走行で位置誤差を100%包含するPLを出せるようにした。", "p2": "PLは故障仮説とリスク配分の下で位置誤差を上から抑える量だが、ARAIMは各時刻単独のGNSS測位向けに定式化されており、速度・IMUバイアス・時計状態や過去の情報と相関するFGOの事後分布には直接使えなかった（抄録、§I）。都市の谷間ではNLOSや多重経路で複数の信号が同時に汚染され、逐次除外が誤った衛星を外すこともある（§IV-A）。", "p3": "状態は姿勢・位置・速度・IMUバイアス・星座別の時計バイアスとドリフトで、IMUの事前積分因子、時計因子、擬似距離・ドップラー因子で固定ラグ平滑化を行う（§III）。現時刻の擬似距離因子は情報行列の現在状態ブロックにしか入らないため、故障仮説ごとの位置共分散・解分離・公称バイアス伝播は線形化した現在状態の周辺分布から厳密に導ける。衛星除外はWoodbury公式と選択出力評価で行い、仮説ごとに全状態の逆行列計算やグラフ再最適化をしない（§IV）。周囲に6層の監視（スナップショットRAIMの事前選別、事後残差の外れ値除去と再推定、PL計算、SPPとの整合警告、PL有効性と警報限界の判定）を置く（§IV、図1）。直観：故障した衛星を1本抜いたらどれだけ解が動くかを、抜かずに「引き算」で求める。", "p4": "香港の2つの実走行で評価する。実験Aは21.82 kmの道路走行（u-blox ZED-F9P、GPS/GLO/GAL）、実験BはUrbanNavの深い都市峡谷4.51 km（NovAtel FlexPak6）、IMUはいずれもXsens MTi-10、GNSS 1 Hz／IMU 400 Hz、参照軌跡はNovAtel SPAN-CPTの後処理（表I）。良いとする基準は、PLが有効な全時刻で誤差≤PL（包含率100%）、誤差/PL比が1未満、警報限界HAL=15 m・VAL=30 mに対する運用可用性、直接の全状態逆行列との判定一致と計算時間である（§V-A、図5・6）。", "p5": "実験Aでは1311時刻中1310でPLが有効（99.92%）、水平・鉛直とも包含率100%、最大誤差/PL比0.958（表III、図8(b)）。水平RMSE 7.856 m、鉛直6.568 m（SPP単独は7.966 m、9.447 m）。提案HPLの平均12.876 m（95%点16.711 m）、VPL 21.658 m、運用可用性は水平87.72%・鉛直98.70%（表III）。共分散だけの境界は同じ事後分布でt=570 sに水平誤差9.996 mが9.974 mを0.02 m超え余裕がなく、公称バイアスと故障仮説の項を入れると平均PLが5.5%／5.3%増えて可用性が92.98%から87.72%へ下がる（§V-B）。実験Bは包含率100%だが可用性は水平20.83%・鉛直73.34%（表III）。計算時間は全仮説評価が71.3%減、PLモジュール6.216 msから4.278 ms、仮説評価とPL求解で65.2%減、HPL/VPLの最大差0.081/0.107 mで判定は一致（表VI、§VI）。故障注入ではPLが無効化されつつ航法は継続（図7）。", "p6": "著者は、チャネルあたり実効独立サンプルが9〜44しかなく、実験は10⁻⁷の完全性予算の検証ではなく整合性確認にとどまること、事後共分散が捉えないゆっくり変動する共通モードの測距バイアスがあること、深い都市峡谷では包含できても可用性が低いこと、過去の事前分布に吸収される持続故障や選別層の除外リスクが未対応であることを認める（§VI）。解釈：GNSS受信機が実験AとBで異なるため、環境差と機材差は分離されていない。", "fun": "カーナビの位置には誤差があるが、「この誤差は確実にX m以内」という保証（保護レベル）を出すのは飛行機の世界の技術で、ビルの谷間の車では難しかった。この研究は、GNSSと加速度センサを一緒に最適化する計算の中で、衛星を1本ずつ「外したらどうなるか」を全部計算し直さずに済ませる数学の近道を使い、香港の実走行で誤差が保証を一度も超えない結果を出した。ただし、保証が出せても大きすぎて使えない時間が都心では8割近くあるという正直な報告もある。", "unverified": "故障注入（表IV）と層ごとの結果（表V）の数値、実験Bの誤差RMSEは読んでいない。§IVのPLの式（Ψ_q）の詳細は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "周波数領域同定の誤差はN^-2で縮む", "title": "On Sample Complexity Bounds for Frequency-Domain System Identification", "url": "https://arxiv.org/abs/2610.31960", "authors": "Arya Honarpisheh ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Honarpisheh, A., & Sznaier, M. (2026). On Sample Complexity Bounds for Frequency-Domain System Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31960", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3 問題設定、§4 定理1の主張、§5.1 定理4、§6 数値例、§7 結論）を読んだ。証明（付録A〜C）と§4.3の下界の構成は読んでいない", "preprint": true, "p1": "周波数応答を有界な雑音つきでN点測ったとき、データと事前情報に整合する任意の同定法の最悪誤差が雑音水準にN⁻²で収束すること（しかもそれが最良の速さであること）を示し、雑音が確率的なら雑音水準より下まで誤差が下がりうることをその速さとともに示した。", "p2": "雑音の分布が分からず大きさの上限だけ分かる設定では、データに整合する系全体（整合集合）の幾何が同定の限界を決める。従来の上界は雑音水準へO(N⁻¹)でしか近づかないか（Chen and Gu 2002）、O(N⁻²)でも極限が雑音水準の約3倍に留まっていた（Chenら1995）（§1）。", "p3": "対象は、インパルス応答が|h_k|≤Kρ⁻ᵏで指数減衰する離散時間SISO線形時不変系で、測定は y_n=H₀(e^{jθ_n})+η_n、|η_n|≤ε（式(3)(4)）。整合集合T(y)の半径と直径が、どの整合的（補間的）アルゴリズムの誤差も挟む（式(11)(12)）。定理1は等間隔N点で半径の上界 U_N=min{K, ε+π²ρ(K²−ε²)/(2K(ρ−1)²N²)}（式(21)）を与える。意味：標本間で応答がどれだけ膨らみうるかを2階微分の上界（Ruscheweyhの不等式）で抑え、標本間隔Δ=2π/Nの2乗で余裕が縮む。確率的雑音では、雑音が円板の縁の近くに落ちる確率 q(s)≥c_β(s/ε)^β を使い、高確率の直径上界 V_N(s)=√2 s+32π²Kρ/((ρ−1)²N²)(3+32Λ/q(s))² を導く（定理4、式(44)）。", "p4": "理論の検証はモンテカルロ2実験で、YALMIPの半正定値計画で整合化し中心Nevanlinna–Pick補間で同定する。実験1は4次系（式(45)、ρ=1.08、K=100、ε=0.70）、N=4〜80、円板上の一様雑音、各N100回。実験2は1次系 H₀(z)=0.5z/(1−0.5z)（ρ=1.25、K=2、ε=0.50）で、一様円板雑音（β=1、予測率N^{−2/3}）と大きさ固定・位相一様の雑音（β=0、予測率N⁻²）を比べる（§6）。良いとする基準は、平均誤差の減り方が参照直線に沿うこと。", "p5": "実験1では平均誤差がN=32〜80でN⁻²の参照線にほぼ沿い、定理1の系の2次の依存と整合する（図1）。実験2では一様円板雑音の誤差がN^{−2/3}の参照線に沿い、大きさ固定の雑音はより速く減ってNが大きいほどN⁻²の参照線に近づく（図2）。雑音なし（ε=0）では半径がK(2ρ/(1+ρ²))^Nで指数的に消える（式(20)）。", "p6": "著者は、確率的設定で上界と下界の速さに隙間が残ること（一様円板雑音では決定論的な2次の速さが成り立たない下界を示す）を認め、その隙間を詰めることと、得られた不確かさ限界をロバスト制御設計に使うことを今後の課題とする（§7）。解釈：結果はSISO・等間隔標本・指数減衰の事前情報に依存し、MIMOや非等間隔の場合は扱っていない。数値例は低次系2つのみで、数値の表は示されていない。", "fun": "測定には必ず雑音があるので、普通は「測った点が増えても誤差は雑音の大きさまでしか減らない」と考える。この論文はまず、雑音の上限εまでの余分な誤差が、測る周波数の数Nの2乗に反比例して消えることを証明した。さらに意外なのは、雑音がランダムなら誤差がεより小さくなりうることで、その減り方は雑音が「上限ぎりぎりの値をどれだけ取りやすいか」で決まる。縁の近くに落ちる雑音が多いほど、どこが本当の値かを絞り込めるからである。", "unverified": "定理2（下界）と定理3の主張、各定理の証明は読んでいない。図1・2の具体的な誤差の値は本文に数表がなく未確認。"}}, {"id": "pr05", "rank": 5, "headline": "高次元Fokker-Planck方程式をテンソルNNで数分で解く", "title": "Weak adversarial tensor neural network for high-dimensional Fokker-Planck equations", "url": "https://arxiv.org/abs/2610.32169", "authors": "Sihong Shao ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Shao, S., & Xu, Z. (2026). Weak adversarial tensor neural network for high-dimensional Fokker-Planck equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32169", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3.1 計算領域と弱形式、§4.1 実験設定と表1、§4.5 20D問題、§5 結論、表2〜9の要約記述）を読んだ。§3.2〜3.5の式の詳細と各表の全行は読んでいない", "preprint": true, "p1": "6〜20次元の定常Fokker–Planck方程式を、モンテカルロ積分なしに固定の求積点で損失と正規化を計算するテンソルニューラルネットの弱形式・敵対的学習（WATNN）で、数分の学習で相対誤差1〜8%で解けるようにした。", "p2": "Fokker–Planck方程式は確率密度の時間発展を記述するが、高次元・非有界領域・正規化条件が数値計算を難しくし、格子法は次元の呪い、モンテカルロ法は標本誤差に悩む。深層学習法も損失と正規化の高次元積分をモンテカルロで近似するため精度が出にくく、定常方程式は斉次なので残差だけを最小化すると零解に落ちる（§1）。", "p3": "まずSDEをEuler–Maruyama法で粒子シミュレーションし、終端時刻の粒子の大半を含む直積領域Ωを計算領域に選ぶ（Algorithm 1）。方程式に試験関数を掛けて部分積分した弱残差を、密度を表す主ネットワークと試験関数を表す敵対的ネットワークの間のミニマックス問題にする（式(3.1)、§3.1）。両方を「多変数関数＝1次元関数の積の有限和」で表すテンソルニューラルネット（TNN）にすると、高次元積分が1次元積分の積の和に分解され、座標ごとに固定のGauss–Legendre点で正確に積分できる（§1、§3.4）。弱形式は強残差を2乗したときの交差項を避け、1階微分だけで済む（§1）。直観：積分を「次元ごとに分けて掛け算する」形に限定することで、サンプリングの運に頼らず積分できる。", "p4": "既知の不変密度 p*=e^{−H}/Z をもつ4つのベンチマーク（6D単峰、6D多峰、10D多峰、新設の20D多峰で、20Dは4座標ずつ5群が非線形に結合し4つのモードをもつ式(4.7)(4.8)）で、密度が閾値ε（10⁻⁵など）を超える検査点での平均相対誤差（MRE、式(4.3)）と実行時間を測る。比較対象はスコアに基づくPDE損失をSDE標本で学習するFPNN（TNN版とMLP版）で、20Dでは学習データを20万点、正規化のモンテカルロ標本を100万点に増やして公平を図る（§4.1、表1）。求積は各座標をM分割×16点（6D単峰はM=6、N=96点）（表1）。", "p5": "WATNNのMREは6D単峰1.50%（131.28 s）、6D多峰1.13%（121.50 s）、10D多峰1.20%（166.94 s）、20D多峰7.93%（170.87 s、2万ステップ）で、20Dは8万ステップまで学習すると4.31%（610.88 s）に下がる（表2・4・6・8、§4.5）。FPNNは6D多峰でMLP版の最良が13.88%（124.11 s）、10DではTNN版が100ステップでNaNになり、20DではTNN版が50ステップでNaN、MLP版が95.88%と73.02%（表3・5・7・9、§4.3〜4.5）。図4.4では20Dの(x13,x17)面の多峰構造と、密度が10⁻⁴程度の(x1,x2)面の低密度領域も再現した（§4.5）。", "p6": "著者は、係数や非線形項がテンソル積の形で表せない方程式にはTNN求積が直接使えないこと、計算領域の推定がSDEシミュレーションという確率的解釈に依存しており非有界領域の一般の方程式には制約になることを認め、非有界領域での適応Hermite近似との結合を今後の課題とする（§5）。解釈：ベンチマークはすべて勾配型ドリフト（式(4.1)）で、不変密度が閉じた形で分かる問題に限られる。実行時間はWATNNがプログラム開始から、FPNNが学習のみで測られており厳密な同条件ではない（§4.1）。", "fun": "「ランダムに揺れる粒子が、長い時間のあとどこにいる確率が高いか」を表す方程式は、変数が20個もあると普通の方法では計算量が爆発する。この研究は、答えの関数を「1変数の関数どうしの掛け算の足し合わせ」という形に限定することで、20次元の積分を1次元の積分の掛け算に分解し、サイコロを振る近似なしに正確に計算できるようにした。比較した最新手法が計算途中で壊れる（NaN）問題でも、3分ほどで8%の誤差に収まったのが印象的である。", "unverified": "表2〜9の各行の数値（ネットワーク構成ごとの誤差と時間）は要約文で確認した値のみ。§3.2〜3.5の損失関数と勾配の式は読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "深さ平均MPMで土砂流の確率的集団計算を高速化", "title": "A Highly Efficient Depth-Averaged Material Point Method for Geophysical Mass Flows", "url": "https://arxiv.org/abs/2610.32907", "authors": "Johann Kammholz ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Kammholz, J., Zhao, Y., Blatny, L., Pauze, T., & Gaume, J. (2026). A Highly Efficient Depth-Averaged Material Point Method for Geophysical Mass Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32907", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§2.2 深さ平均MPM、§3.2 検証、§3.3 Brienz地すべりの逆解析と確率地図、§4 考察、§5 結論と図7〜10）を読んだ。§2.1の支配方程式と§3.1の検証の数式の詳細は読んでいない", "preprint": true, "p1": "岩盤崩落や土石流などの地表の質量流を、実時間より速く1 m解像度で計算し、1,632通りの確率的アンサンブルを76秒で回せる公開の深さ平均マテリアルポイント法（MPM）を作った。", "p2": "気候変動で災害の確率と性質が変わるため、広いパラメータ範囲のアンサンブル計算による確率的ハザードマップが必要だが、既存のオイラー型モデル（RAMMS、D-Clawなど）は流れの縁を鮮明に追えず数値拡散や人工的な停止基準を要し、SPH型は近傍探索と人工粘性を要する（§1）。", "p3": "流れを「鉛直の柱」を表す粒子（位置・水平速度・流れ高さ・面積・密度）で離散化し、DEM由来の規則格子上で深さ平均の運動量保存を解く（式(2)(14)、§2.2）。全体デカルト座標で定式化し、底面摩擦はCoulomb・Voellmy・μ(I)の3法則のいずれかを別ステップで評価して、駆動せん断力が静止摩擦を下回ると流れを自然に止める（人工的な停止基準なし）。粒子は格子を介してのみ相互作用するため近傍探索が不要で、PIC/FLIPの混合で散逸と安定性を調整する（§4）。直観：砂山を高さのある「柱の集まり」として動かし、各柱が地面との摩擦で止まるまで滑らせる。", "p4": "検証は、斜面を滑る剛体ブロックの過渡・定常速度の解析解（図2・3）、平坦・傾斜床のダムブレイクの解析解（Mangeneyら2000、図4・5）、Lajeunesseら（2004）の粒状柱崩壊実験（R₀=70.5 mm、H₀=56.4 mm、μ=0.61、Δx=1 mm、図7）で行う。実事例は2023年6月15日のスイス・Brienz/Brinzauls岩盤崩落で、ドローンDSMの差分から放出高さ（2 m超の領域、放出量1.08×10⁶ m³）を定め、Δx=1 m・19万粒子で観測到達範囲に合うよう各摩擦則を較正する（§3.3.1、図8・9）。良いとする基準は解析解・実験堆積形状との一致、観測到達範囲の再現、計算時間である。", "p5": "剛体ブロックとダムブレイクは解析解を再現し、定常速度の過小評価は陽的摩擦評価による約0.5%（§4）。柱崩壊は実験断面と一致し堆積は円形で格子方向の偏りがない（図7）。Brienzの1 m計算は単一スレッドでCoulomb 60 s、Voellmyとμ(I) 40 sと実時間（80 s）より速く、3法則とも最大流れ高さと到達範囲はほぼ同じだが、Coulombは速度が高く範囲がやや広い（図9）。Voellmy（μ₀=tan≈0.456、ξ₀=1000 m s⁻²）の周りでμを0.2〜0.7の51値、ξを200〜5000 m s⁻²の32値に振った1,632計算（Δx=5 m、7,700粒子）は76 sで完了し（21.5計算/秒）、到達確率は主斜面で100%、最初の道路で約80%、2本目で40%、教会で12%だった（図10、式(34)(35)）。RAMMSとAvaFrame com1DFAより1〜2桁速い（§4）。", "p6": "著者は、地形曲率の効果、侵食（連行）、等方応力閉包（K=1）、運動量形状係数β=1、間隙水圧の無視（乾燥・単相の流れに限定）を主な簡略化として認め、二相化やGPU並列、雪崩・土石流での検証を今後の課題とする（§4、§5）。Brienzでは堆積末端をやや過小評価し、流れ幅が観測より広く、森林の抵抗を無視したため東側へ流れが及んだ（§4）。到達範囲だけでは3つの摩擦則を区別できないとも結論している（§5）。解釈：性能比較は限られた設定での目安で、包括的なベンチマークではないと著者自身が断っている。", "fun": "山が崩れたとき土砂がどこまで来るかを、地図の上で「もし摩擦がこれくらいなら」と条件を変えながら1,600通り以上計算し、それを1分ほどで終わらせた。秘訣は土砂を「高さのある柱の集まり」として扱い、柱が地面との摩擦で自然に止まるようにしたことで、止める規則を人工的に足さなくて済む。2023年にスイスの村の手前で止まった実際の崩落を再現し、「教会まで届く確率は12%」のような確率の地図を普通のパソコンで描けるようになった。", "unverified": "§2.1の支配方程式（式(2)など）と§3.1の検証の数値（図6の収束率）は読んでおらず未確認。較正したμの角度表記はHTML抽出で欠落しており未確認。"}}, {"id": "pr07", "rank": 7, "headline": "侵食による運動量生成が地すべりの移動性を決める", "title": "Erosion-induced momentum production and system acceleration govern landslide mobility", "url": "https://doi.org/10.31223/x5gj6j", "authors": "Shiva Pudasaini", "venue": "EarthArXiv", "date": "2026-10-26", "apa": "Pudasaini, S. (2026). Erosion-induced momentum production and system acceleration govern landslide mobility. https://doi.org/10.31223/x5gj6j", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EarthArXivのPDF本文（抄録、§2 モデルと厳密解、§2.3 ブースター速度の導出、§3 結果、§4 考察、§5 要約と図1・2）を読んだ。式(1)〜(6)の導出過程の一部はPDF抽出で判読しにくい", "preprint": true, "p1": "侵食しながら進む地すべりについて、侵食が生む運動量（移動性を高める）と、巻き込んだ土砂を加速させるためのエネルギー消費（系の加速）の両方を1本の速度方程式に入れ、その厳密解から「侵食が移動性を高めるか下げるか」を決める単一の判定量（ブースター速度）を導いた。", "p2": "侵食は地すべりの加速を根本的に変えるが、既存の解析的な速度モデル（Pudasaini and Krautblatter 2021など）は侵食による正味の運動量生成は含んでも、巻き込んだ材料を加速させるときのエネルギー散逸を含んでいなかった（抄録、§1）。侵食率が大きければ移動性が上がるという通説も、それだけでは決まらないと著者は主張する（§4）。", "p3": "距離xに対する速度uの1階非線形常微分方程式（式(6)）で、係数Aは侵食による加速α_eの分だけ減った正味駆動力、B=Λ_b Eは侵食（率E、運動量係数Λ_b）による移動性ブースター率、Cは粘性抵抗を表す。これを解析的に解き、(u₀−p₁)/(u−p₁)と(u−p₂)/(u₀−p₂)の冪の積が exp[s(x−x₀)] に等しいという閉じた形の厳密解を得る（式(8)(9)）。解の分岐条件から、ブースター速度 S_p=α_e/(Λ_b E)（式(21)）を定義し、「S_pが小さいほど移動性が高い」という判定条件（式(14)(20)）を導く。直観：侵食で得たエネルギーのうち、巻き込んだ土砂を動かすのに使う割合が小さいほど、本体は速くなれる。", "p4": "検証は解析解のパラメータ計算のみで、観測データや数値シミュレーションとの比較はない。Pudasaini and Krautblatter（2021）に倣い α=7.0、β=0.01、λ_b=0.9、E=0.15、α_e=1.0、x₀=20 mで遷移速度u₀=10 m/sとし、(i)慣性低減を正しく考慮した侵食あり、(ii)侵食なしの参照、(iii)慣性低減を無視した侵食あり、の3状況を比較する（図1）。さらにα_eを変えて加速がどう移動性を制御するかを見る（図2）。良いとする基準は、結果が自然現象（侵食は通常移動性を高める）と力学的に整合すること。", "p5": "慣性低減を正しく含めると、侵食なしの参照に比べて移動性が大きく高まる（図1）。一方、慣性低減を無視するとΛ_b*=(λ_b−1)<0となってB*<0になり、強く侵食する状況（λ_b→1、E>0）なのに移動性が人工的に下がるという自然には見られない矛盾が生じる（図1、§3.1）。α_e=0（巻き込みに一切エネルギーを使わない）は非物理的で、α_eが大きいほど移動性の増加は抑えられる（図2、§3.2）。速度の2乗に比例する衝撃圧を考えると、慣性低減の無視は移動性を大幅に過小評価し、ハザードゾーニングや早期警戒で危険だと論じる（§3.1）。", "p6": "著者は、モデルが変形する・しない地すべりの両方に適用できる利点を強調する一方、本稿の検証は解析解のパラメータ例に限られ、実地すべりの観測や数値モデルとの比較はない。解釈：パラメータ値（α_e=1.0など）は「力学的に正当な選択」として著者が定めたもので、独立な根拠は示されていない。単著のプレプリントで、自己引用に依拠する部分が多い。", "fun": "地すべりは進みながら地面を削って土砂を巻き込む。巻き込んだ分だけ重くなって遅くなりそうだが、実際は削った土砂の勢いが加わって速くなることが多い。この論文は「削って得た勢い」と「巻き込んだ土砂を加速させるために使う勢い」の綱引きを一つの式にし、その比（ブースター速度）が小さいほど地すべりは速くなると示した。この片方を無視して計算すると、本当は速くなる地すべりを「遅くなる」と予測してしまうという警告でもある。", "unverified": "式(1)〜(6)のα、β、λ_b、Λ_bの正確な定義と式(14)(20)の形はPDF抽出で判読しきれず未確認。図1・2の速度の具体的な数値は本文に記載がない。"}}, {"id": "pr08", "rank": 8, "headline": "合成消費者は仮説生成には強く確認には危険", "title": "From Segmentation to Simulation: Large Language Model Agents as Synthetic Consumers — Promise and Validity Risks for Marketing Strategy", "url": "https://doi.org/10.20944/preprints202610.2271.v1", "authors": "Lalit Gautam ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Gautam, L., & Das Majumder, A. (2026). From Segmentation to Simulation: Large Language Model Agents as Synthetic Consumers — Promise and Validity Risks for Marketing Strategy. https://doi.org/10.20944/preprints202610.2271.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "p1": "LLMエージェントを「合成消費者」として調査や概念テストに使うとき、何が正当にできて何ができないかを、4つの用途と5つの妥当性脅威、検証手順として整理した概念論文。", "p2": "マーケティング戦略は常に消費者の表現（セグメント、ペルソナ、フォーカスグループ、調査パネル）の上で動いてきた。LLMはほぼ無料・即時で調査に答え、概念に反応し、口コミや購買を演じる合成消費者という新しい表現をもたらし、ベンダーは早期の消費者調査の代替として売り込み、戦略チームは人への調査の前にポジショニングや価格の見せ方を事前テストし始めている（抄録）。", "p3": "用途を探索・事前テスト・人の標本の補強・代替の4つに分け、妥当性リスクがこの順に急激に高まると論じる。自動化-拡張のパラドックスと構成概念妥当性の心理測定的要件に基づき、LLM回答者に固有の5つの妥当性脅威（学習データの反響、ペルソナのステレオタイプ化、追従的・要求特性的な回答、時間の凍結、利害の不在）を特定する（抄録）。", "p4": "概念論文のため実証はない。代わりに、人との照合、保留した概念、敵対的プロンプト、開示からなる検証手順を提案し、実証研究に向けた3つの命題を示す（抄録）。", "p5": "中心的主張は意図的に狭く、合成消費者は消費者についての仮説を生成し選別する強力な道具だが、仮説を確認する道具としては危険だとする（抄録）。", "p6": "抄録の範囲では、実データでの検証がなく、5つの脅威の相対的な大きさや検証手順の効果は示されていない。解釈：提案される命題が実証されるかは今後の研究次第である。", "fun": "新商品のアイデアを人に聞く代わりに、AIに「30代の会社員として答えて」と頼めば、一瞬で何千人分の回答が手に入る。この論文は、それが便利な一方で、AIは学習した過去のデータを繰り返し、ステレオタイプに寄り、質問者に合わせて答え、時間が止まっていて、しかも自分のお金を使わない、という5つの落とし穴を指摘する。「アイデアを広げるには良いが、正しいと確かめるのに使ってはいけない」という線引きが明快である。", "unverified": "本文を入手できず、3つの命題の内容と検証手順の詳細は未確認。"}}, {"id": "pr09", "rank": 9, "headline": "多エージェントLLMの失敗は合意形成の段階で起きる", "title": "Understanding Communication Failures in Multi-Agent LLM Systems", "url": "https://arxiv.org/abs/2610.32060", "authors": "Priya Pitre ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Pitre, P., Hou, J., Fang, Y., Ramakrishnan, N., & Wang, X. (2026). Understanding Communication Failures in Multi-Agent LLM Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32060", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3 方法、§5 分析（人手検証、失敗の分布、要因、成功との対比、回復の難しさ、初期多数派の遷移、早期警告モデル）、§6 推奨、§7 結論、限界と表2・4・5）を読んだ。付録は読んでいない", "preprint": true, "p1": "複数のLLMが討論して答えを出す多エージェント系の失敗を、3,211件の失敗軌跡から「通信の失敗」として分類する体系（AgentInteractError）を作り、失敗の多くが最初の誤りではなく合意形成と修正の段階で生じること、1ラウンド前に失敗を予測できることを示した。", "p2": "討論は個々の誤りを直せる反面、正しい少数意見が捨てられたり弱い主張が繰り返しで支配的になったりと、相互作用そのものが新しい失敗面を生む。既存の分類（Cemriら2026など）は設計・不整合・検証の弱さといった大まかな要因や責任エージェントの特定を扱うが、相互作用の過程を分析対象にしておらず、最終精度だけでは失敗が推論・同調・修正失敗・集約のどこから来たか分からない（§1）。", "p3": "FinQA、HotpotQA、MBPP、MMLU-Pro、MedQA、MuSiQue、Ethics、LiveCodeBenchの8データセットで、LLaMA-3.2-3BからGPT-OSS-120Bまで7種のオープンモデルを使い、エージェント数・ツール・構成・編成を変えて7,300課題を走らせ、誤答で終わった3,543件のうち複数ラウンドの3,211件を対象にする。各軌跡を「カード」に要約し、推論・通信・合意・修正・調整・ツール/根拠の6大分類を上から与えつつ、未分類タグを埋め込み（bge-base）のクラスタリングで下から広げ、600行超の葉を分割して深さ3まで作る（§3、図2）。直観：何千件もの「こじれた会議の議事録」を読んで、こじれ方の型を抽出する。", "p4": "妥当性は、人手の自由注釈との対応（93.4%が細分類、98.1%が大分類に写る）、分類を見せたときの注釈者間一致（Jaccard 0.82／0.73）、自動ラベルの人手との一致（micro-F1 0.91／0.84）で確かめる（§5）。設計要因の効果は同一問題で1要因だけ違う構成を問題固定効果・クラスタ標準誤差・BH補正で比べ、成功軌跡500件を対照に使う。早期警告は誤りの種類と発生ラウンドから1ラウンド前の発生を予測し、精度・再現率・F1・AUROCで評価する（表5・6）。", "p5": "修正失敗は全課題に共通し、QA系では合意失敗、コード・金融・多段推論では推論とツールの失敗が多い（図3）。検索の付与は失敗率を74.6%から36.4%に下げる最大の要因だが、3→7エージェントへの増員は有意に減らさず、棄権後の失敗と正しい少数意見の抑圧がむしろ増える（§5「What drives failures?」）。成功軌跡でも91.2%に何らかの誤りがあり、推論とツールの誤りは成功・失敗で同率（0.35、0.38）なのに、修正0.37対0.94（2.6倍）、合意0.51対0.93（1.8倍）、調整0.14対0.53（3.6倍）と差が出る（表2）。誤った多数派は回復より残存が多く、正しい少数派は結果を変えるより抑圧されることが多い（例：FinQAで回復12.83%、修正失敗50.33%、個別抑圧16.33%、表4）。早期警告モデルは3種の誤りで最高の精度・AUROCを示し、警告なしより精度を最大20ポイント改善した（表5・6）。", "p6": "著者は、分析が複数ラウンドの誤答軌跡に限られ、ツール中心・ファイル共有・長期環境の失敗を捉えていないこと、分類が対象コーパスのモデルと編成に依存すること、分類構築にLLM（GPT-5.4-nano、GPT-4.1-mini）を使うためモデル固有の偏りがありうることを認める（Limitations）。推奨として、自己申告の確信度に頼らない、多数決でなく能動的な監督、課題別の検証、誤りの種類に応じた介入を挙げる（§6）。解釈：効果の推定は観察的比較で、設計要因の因果はBH補正つきの差にとどまる。", "fun": "AIを何体か集めて議論させれば間違いが減る、というのが多エージェントの期待だが、3,000件超の失敗を調べると、最初に誰かが間違えること自体は成功した議論でも同じくらい起きていた。違いは、間違いを「直せるか」だった。しかもAIを3体から7体に増やしても改善せず、正しいことを言っている少数派が黙らされる場面が増えた。人間の会議と同じで、人数より「反対意見を潰さない仕組み」が要るという結論である。", "unverified": "表5の各誤り種別の精度・AUROCの具体値と、表14の各設定の精度、付録D〜Nの追加分析は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "LLMの分布整合は同領域に汎化するが不安定", "title": "Distributional Alignment of LLMs and Its Generalization Properties", "url": "https://arxiv.org/abs/2610.31687", "authors": "Nelson Jo", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Jo, N. (2026). Distributional Alignment of LLMs and Its Generalization Properties (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31687", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3 設定、§4.1.4・§4.2.3 結果、§5 汎化実験（MMLU、自由質問、話題横断）、§6 考察と限界、図3・6・8）を読んだ。微調整法の式（§4.1.1、§4.2.1）と付録は読んでいない", "preprint": true, "p1": "小さなLLM（Llama-3.2 1B）を微調整して、世論調査の回答分布や「100人に聞きました」型の回答分布に出力分布を合わせられること、その整合が未見の質問や関連する話題に汎化する一方、無関係な能力が予測しにくく変わることを示した。", "p2": "LLMで人の行動や意見を模擬する用途（経済ゲーム、予備的なユーザ調査、投票予測）では、出力の分布が人の分布に一致する「分布整合」が要るが、少ない学習データから他の話題や課題へ汎化できるかは分かっていなかった。LLMは話題間の意味的関係を強く学んでいるので、代表的な話題で学習すれば十分かもしれない（§1）。", "p3": "問題は、プロンプトxごとの人の回答分布P(y|x)とモデルの分布Q(y|x)の距離（Wasserstein距離や全変動距離）を最小化すること（§3.1）。データはPew研究所のAmerican Trends Panel由来の多肢選択OpinionQA（1,506問、選択肢に位置があるためWasserstein距離が定義できる）と、100人の回答分布を持つ自由回答のFamily Feud（ProtoQA、8,714問）（§3.2）。多肢選択では選択肢トークンの確率を分布に合わせて微調整し、温度スケーリング（大域・質問別）と比べる。自由回答では有効な回答トークンの確率（実験1）と、100回生成した回答をクラスタ化した確率（実験2）で評価する（§4）。直観：モデルに「正解」ではなく「答えのばらつき方」を教える。", "p4": "R1（整合の達成）は検証損失が最良のハイパーパラメータでテスト集合のWasserstein距離・全変動距離の分布を比べる。R2（汎化）は、57分野14,042問のMMLUで再現率の変化率とエントロピー変化を測り、8つの自由質問に温度1.0で100回答ずつ生成して定性比較し、OpinionQAを追加収集（ATPの2016〜2019年と2020年のCOVID）して8話題に分け、各話題で微調整して他話題で評価する話題横断実験を行う（§5）。良いとする基準は、距離が基準モデルや後付けの温度スケーリングより小さく、他の能力が壊れないこと。", "p5": "OpinionQAでは基準モデルの平均Wasserstein距離0.22に対し、大域温度スケーリング0.17、質問別温度スケーリング0.11で、微調整モデルは学習0.12・テスト0.13と、テストの正解を要する質問別スケーリングに匹敵した（図3、§4.1.4）。Family Feudでは正解分布に全く当たらない質問が基準30%から微調整後にテスト20%・学習10%へ減り、全変動距離の平均はテスト0.67・学習0.60で基準より7・14ポイント改善（図6）。話題横断では、どの話題で微調整しても1マスを除く全ての他話題で距離が下がり、COVID→信頼、政治→信頼、技術→技術文化の改善が最大（図8）。一方、OpinionQAで微調整するとMMLUのほぼ全分野で再現率が下がりエントロピーが上がり、Family Feudで微調整すると逆に再現率が上がり、短い回答になって物語や冗談の生成が変わった（図7・9・10、§5.2〜5.3）。", "p6": "著者は、2つのデータで微調整がMMLUに逆向きに効く理由が仮説（同じ多肢選択形式ゆえの混乱、話題の相関）にとどまり厳密に検証できていないこと、課題外の汎化の評価がベンチマーク選択の問題を抱えること、トークン水準を超えた分布整合（例：政治的傾向の特徴量の分布）が未解決であることを限界に挙げる（§6.2）。解釈：モデルは1Bの単一モデルで、人の分布を再現すること自体の規範的な是非（偏りの固定化）は議論されていない。", "fun": "AIに「この質問に賛成する人は何割か」を当てさせたい。この研究は、小さなAIに世論調査の答えの散らばり方そのものを覚えさせると、見たことのない質問でもうまく当てられ、しかも「政治」で学ぶと「制度への信頼」の質問まで当たりやすくなることを見つけた。ところが「100人に聞きました」で学ばせたAIは、答えが短くなって冗談や物語が下手になるなど、関係なさそうな能力が勝手に変わった。人の意見を学ぶことの副作用は予測しにくい。", "unverified": "微調整の損失関数の具体的な形（§4.1.1、§4.2.1）とハイパーパラメータ（表1・2）、図7・9の分野別の数値は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "主張単位で多エージェント対話の情報流を測る", "title": "Beyond Final Outcomes: Quantifying Claim-Level Information Dynamics in Multi-Agent LLM Interaction", "url": "https://arxiv.org/abs/2610.32333", "authors": "Haocheng Jiang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Jiang, H., Wan, H., Peng, Y., & Luo, M. (2026). Beyond Final Outcomes: Quantifying Claim-Level Information Dynamics in Multi-Agent LLM Interaction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32333", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§3 RIVERの定義（主張分解・意味対応）、§3.5 検証、§4 実験設定、§5 結果、§6 考察、§7 結論、限界、付録A.1と表1・4、図1・2）を読んだ。付録B〜Eの指標の計算規則は読んでいない", "preprint": true, "p1": "多エージェントLLMの議論を「主張（claim）」の単位に分解し、情報がどれだけ共有され（収束）、広がり（探索）、残るか（保持）を測る評価枠組みRIVERを作り、同じ結論に至る議論でも相互作用の構造によって情報の流れが大きく違うことを示した。", "p2": "多エージェント系の評価は最終精度や出力の類似度に集中し、相互作用の途中で情報が導入・露出・再生・変形・保持・喪失される過程を見ていない。決定の一致は情報の一致を意味せず、同じ最終判断でも共有された情報の状態は大きく異なりうる（§1）。", "p3": "各段階の各エージェントの発話をLLMで原子的な主張に分解し（式(2)）、主張対の意味的対応をLLMが0.0〜1.0で採点して分割する（§3.1）。収束はInformational Unity（U：同じ具体的情報を同じ立場で述べる度合い）、探索はUnique Claim Count（CC）とExtension Rate（ER）、保持はOriginal News Retention（OR）、Survival Rate（SR）、Claim Survival Length（SL）で測る（§3）。直観：議論を「誰が何を言ったか」の表にほどき、同じ情報が何人に広まり、新しい情報がどれだけ生まれ、元の情報がどれだけ生き残ったかを数える。", "p4": "収束指標Uは、人手の情報共有・合意スコアをもつDBS-eval、DELPHISTAR、Polisとの相関（DBS-evalでPearson 0.641、Spearman 0.638、表1）、直接プロンプトのSimple基準との比較（表2）、評価LLMを変えたときの一貫性（表3）で検証する（§3.5）。実験はロイター20報から作った40の短いニュース事例を、固定ペルソナの5エージェント（GPT-4o-mini）がFree、NGT、Delphi、Policy Delphi、Brainwritingの5戦略で議論し、各戦略に完全版（Full）と制約を外した枠組み版（Framework）を置く9条件、各事例4サイクル×4段階＋私的要約の第17段階（§4、表7）。評価LLMはgemini-2.5-flash-lite。", "p5": "反復的に情報を集約する構造（NGT・Delphi・Policy Delphi）は共有を高め情報空間を狭め、分散リレー（Brainwriting）は広いが共有されにくい情報を保つ（§5）。枠組み版では集約型3法とBrainwritingのUは独立生成直後に0.361対0.362でほぼ同じだが、サイクル末には0.626対0.286に分かれる。追加制約を外す（Full→Framework）とCCは4戦略平均で26.5%減り、ERは3.0%減で、40事例すべてで減る。Full設定でORは第1〜4段階で集約型平均34.6%減、Brainwritingは11.4%減。収束と探索は逆相関（U–CCのPearson −0.815）、探索と保持も逆相関（CC–SR −0.710）、収束と拡張保持は非Brainwriting条件で正の相関（U–SR 0.798）（§5、表4、図2）。一部の情報は一度消えても共有後に再出現する（ORが第2→4段階で平均0.019回復）。", "p6": "著者は、生成モデルが1つ（GPT-4o-mini）でペルソナが固定5人のため、モデル能力やペルソナ構成の影響を調べていないこと、サイクル間で履歴を持ち越さないため長期の情報蓄積を捉えていないことを限界に挙げる（Limitations）。高い収束は事実の正しさを意味せず、低い収束も望ましくない不一致を意味しないと注意する（Ethical Considerations）。解釈：主張分解と対応づけをLLMに依存するため、評価の再現性は評価LLMの挙動に左右される（表3で一貫性は確認）。", "fun": "5体のAIにニュースを議論させて同じ結論に達しても、「全員が同じことを知っている」状態と「それぞれ違うことを知っている」状態がある。この研究は発言を一文ずつの「主張」にばらして追跡し、みんなで情報を持ち寄る方式は意見が揃う代わりに話題が狭まり、順番に回していく方式は話題が広がる代わりに共有されない、という綱引きを数字で示した。会議の進め方で「何が知られるか」が変わるという話である。", "unverified": "表4の全指標の数値（ER、SR、SLの値）と表9〜12の条件別の値、付録の指標計算規則は読んでいない。"}}, {"id": "pr12", "rank": 12, "headline": "貿易摩擦下で研究開発の記述は増え実質は減る", "title": "Trade Conflict and the Strategic Trade-off in R&D Disclosure", "url": "https://doi.org/10.2139/ssrn.7670134", "authors": "Dong Luo ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Luo, D., Chen, D., & Rao, Y. (2026). Trade Conflict and the Strategic Trade-off in R&D Disclosure. https://doi.org/10.2139/ssrn.7670134", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイト（SSRN）は取得できず、Crossrefに登録された抄録を使用。本文は入手できず", "preprint": true, "p1": "米中貿易摩擦を自然実験として、不確実性にさらされた中国企業が研究開発（R&D）開示の「語り」を増やす一方で実質的な内容を絞り、結果として開示が実態より誇張され情報価値が下がることを示した。", "p2": "貿易の不確実性の下で企業がR&D開示をどう調整するかは、投資家の情報需要（開示を増やす圧力）と、競合に知られる専有コスト（開示を減らす圧力）のどちらが勝つかが明らかでなかった（抄録）。", "p3": "米中貿易摩擦への曝露の有無で中国A株上場企業を分け、差の差（DiD）で開示の変化を推定する。機序の検証として、アナリストのカバレッジと投資家の注目（情報需要）、競争圧力と革新成果（専有コスト）の変化を調べ、R&D開示を語りの量と実質的内容に分解する（抄録）。", "p4": "抄録の範囲では、標本期間・企業数・開示の測定方法・並行トレンドの検証は示されていない。良いとする基準は、DiDの推定が情報需要と専有コストの両方の機序と整合すること。", "p5": "曝露企業はR&Dの語りを拡大し、一見すると情報需要仮説と整合する。しかし貿易摩擦は投資家の情報需要と専有コストの両方を高め（アナリストのカバレッジと投資家の注目が増え、競争圧力が強まり革新成果が減る）、開示の拡大は2つの力のトレードオフを反映する。分解すると、語りは増えるが実質的内容は制限され、開示は実際の活動に比べて誇張され、資本市場に伝わる有効な情報は減った（抄録）。", "p6": "抄録には著者が認める限界の記載がない。解釈：「語り」と「実質」の分解方法と、誇張の判定基準が結果の解釈を左右するが、本文を読めていないため未確認。中国A株の制度文脈に依存する可能性がある。", "fun": "不確実な時代ほど、企業は投資家を安心させるために研究開発について多く語る。ところがこの研究は、語る量は増えても中身は薄くなっていることを見抜いた。ライバルに手の内を知られたくないので、たくさん書いているようで肝心なことは書かない。「情報が増えたのに分かることは減る」という開示のパラドックスを、貿易戦争という外からのショックを使って切り出している。", "unverified": "標本期間、企業数、開示の測定方法、推定値の大きさはいずれも本文を入手できず未確認。"}}, {"id": "pr13", "rank": 13, "headline": "決算説明会からAIで抽出した期待がGDPを先読み", "title": "Generative AI, Managerial Expectations, and Economic Activity", "url": "https://doi.org/10.3386/w35949", "authors": "Manish Jha ほか", "venue": "NBER Working Paper", "apa": "Jha, M., Qian, J., Weber, M., & Yang, B. (2026). Generative AI, Managerial Expectations, and Economic Activity (NBER Working Paper No. 35949). National Bureau of Economic Research. https://www.nber.org/papers/w35949", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "NBERのページは取得できず、Semantic Scholarに登録された抄録を使用。本文は入手できず", "preprint": true, "p1": "12万件超の企業決算説明会の記録から生成AIで経営者の経済見通しを抽出した「AI経済スコア」が、GDP成長・生産・雇用・賃金を5四半期以上先まで、既存の調査予測を超えて予測することを示した。", "p2": "経営者は自社や業界の先行きについて情報を持つが、その期待を大規模かつ体系的に集計してマクロ経済の予測に使う方法がなかった（抄録）。", "p3": "12万件超の決算説明会の書き起こしに生成AIを適用して経営者の経済期待を抽出し、企業・産業・マクロの各水準でスコアを作る。企業・産業・マクロの期待の合成スコアも構成する（抄録）。", "p4": "抄録の範囲では、使用したAIの種類、期間、予測の比較対象の詳細は示されていない。良いとする基準は、調査予測や既存指標を統制した上での将来の経済活動への追加的な予測力。", "p5": "AI経済スコアはGDP成長・生産・雇用・賃金を5四半期以上先まで、調査予測や既存指標を超えて予測する。産業・企業水準のスコアは部門・企業固有の活動を捉え、合成スコアは予測力と予測期間をさらに伸ばす。予測力は歴史的に正確で偏りの小さい経営者に集中し、雑音ではなく情報の経路と整合する（抄録）。", "p6": "抄録には限界の記載がない。解釈：経営者の期待が正確な経営者に集中するという結果は、スコアの有用性が「誰の発言か」の重み付けに依存することを示唆する。生成AIによる抽出の再現性と、説明会の開示慣行の変化（プレプリントpr41が扱うような戦略的開示）への頑健性は未確認。", "fun": "景気の先行きを知りたければ、経済学者の予測より、企業の社長たちが投資家に話している内容を全部読む方がよいかもしれない。この研究は12万件の決算説明会をAIに読ませて経営者の「空気」を数値にし、それが1年以上先の雇用や賃金まで当てることを示した。しかも当てているのは、過去に見通しが正確だった経営者の発言で、彼らは本当に何かを知っているらしい。", "unverified": "使用したAIモデル、対象期間、予測精度の数値は本文を入手できず未確認。"}}, {"id": "pr14", "rank": 14, "headline": "東京の幸福回復は地区ごとに向きが逆になる", "title": "Place and Post-Crisis Subjective Well-Being: A Year-Long Spatial Analysis of Built Environment and Public Sentiment in Tokyo", "url": "https://doi.org/10.21203/rs.3.rs-11213027/v1", "authors": "Shuang Ma ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Ma, S., Wang, J., Zhang, J., Li, S., & Chen, Y. (2026). Place and Post-Crisis Subjective Well-Being: A Year-Long Spatial Analysis of Built Environment and Public Sentiment in Tokyo. https://doi.org/10.21203/rs.3.rs-11213027/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（§3.1〜3.5 データと手法、§4.1〜4.3 結果、考察と結論、表1）を読んだ。補足資料（表S1〜S6、局所係数の表）は読んでいない", "preprint": true, "p1": "東京23区の1年分の位置情報つきツイートから地区ごとの感情を測り、経済活動の内生性を操作変数で処理しつつ建造環境の効果を地区ごとに推定する手法（MGWIVR）で、コロナ後の主観的well-beingの回復が時間的にも空間的にも一様でないことを示した。", "p2": "主観的well-beingの回復研究は、場所に根ざした回復過程を見落としており、建造環境と感情の関係は経済活動（繁華な地区ほど感情も良い）に交絡される。地理的に変わる係数と内生性を同時に扱う枠組みが必要だった（§2、§3.4）。", "p3": "2021年5月31日〜2022年6月30日に東京23区で収集した863,858ツイートを、写真のみ・リンク・絵文字などを除き、SpaCy/GiNZAで前処理して177,462件にし、500 m格子（2,040区画）に集計する（§3.1）。BERTopicで19の話題を抽出し、日本語BERT（daigo/bert-base-japanese-sentiment）の正負と確信度から−1〜−0.5／0.5〜1の感情スコアを作る（§3.3）。経済活動は夜間光（VIIRS）で代理し、POI（80,401点・212分類）の多様性（Shannon-Weaver指数）を操作変数として2段階推定し、第2段階で係数を空間的に変える多スケール地理加重回帰（MGWIVR）を行う（§3.2、§3.4）。季節・曜日・イベント効果はProphetで分解する（§3.5）。直観：「繁華街だから機嫌が良い」分を土地利用の混ざり具合で取り除いてから、公園や学校の効果を地区ごとに見る。", "p4": "良いとする基準は、2SLSの内生性検定（Durbin–Wu–Hausman）と操作変数の強さ（Cragg–Donald F、Anderson–Rubin）が許容できること、空間格子ごとの係数にBenjamini–Hochberg補正をかけて10%水準を探索的に解釈すること（§3.4、表1）。", "p5": "最も語られた話題は日常の食事（52.96%）、東京メトロ（8.98%）、悲観（6.14%）で、感情は2021年10月1日の緊急事態宣言解除日に最高（中央値0.916→0.917、+0.17%）になったが、年間では緩やかな下降傾向で、2022年6月13日と8月15日に傾きが緩む転換点があり、月〜木は負、金〜日は正（土曜が最高）だった（§4.1、§4.2、図2・4）。Durbin–Wu–Hausmanはp=0.003で内生性あり、Cragg–Donald F=6.745は10未満で弱い操作変数、Anderson–Rubin 9.11（p=0.003）（表1）。夜間光の局所効果は95.48%の格子で正。人口規模の平均係数が最大（−3.758）、公園密度−0.008、飲食店までの移動時間−0.006、教育施設密度−0.004、運動施設密度0.003で、教育施設は足立・葛飾で負、大田で正、公園は杉並・中野で正で東へ弱まるなど、同じ属性の符号が地区で反転した（§4.3、図5）。", "p6": "著者は、操作変数が弱く（F=6.745）経済活動の推定は慎重に解釈すべきこと、Twitterデータの偏り、画像とリツイートの除外、ツイートの疎らさ、単一都市の設計を限界に挙げ、MGWIVRの概念実証と位置づける（考察）。解釈：感情スコアは二値分類の確信度で、well-beingの感情的側面の代理にすぎない。緊急事態宣言解除後に回復が続かなかった点は快楽順応理論に反し、ストレス要因の蓄積（恒常性理論）で説明している。", "fun": "コロナの緊急事態宣言が解けた日、東京の人々のツイートはいちばん明るくなったが、その後1年かけて気分はむしろじわじわ下がっていった。さらに面白いのは、公園が多いと気分が良くなる地区と、逆に悪くなる地区が同じ東京の中にあったことである。「公園を増やせば幸せになる」のような一律の答えはなく、同じ施設でも地区の暮らし方によって意味が変わる、という発見である。", "unverified": "局所係数の表（S2〜S4）と話題別の感情変化（表S1）、Prophetの推定の詳細は補足資料で未確認。表1のOLSと2SLSの係数値は読み切れていない。"}}, {"id": "pr15", "rank": 15, "headline": "活動の断片化が少ない高齢者ほど幸福感が高い", "title": "Accelerometer-Measured Activity and Psychological Well-Being in Older Adults: A Multilevel Longitudinal Analysis of NHATS Data", "url": "https://doi.org/10.31234/osf.io/j5rv6_v1", "authors": "Kyungmi Lee ほか", "venue": "PsyArXiv", "date": "2026-10-25", "apa": "Lee, K., & Levin, J. B. (2026). Accelerometer-Measured Activity and Psychological Well-Being in Older Adults: A Multilevel Longitudinal Analysis of NHATS Data. https://doi.org/10.31234/osf.io/j5rv6_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivのページは取得できず、Europe PMCに登録された抄録を使用。本文は入手できず", "preprint": true, "p1": "高齢者の加速度計で客観的に測った活動の指標（平均活動量、相対振幅、行動の断片化）が心理的well-beingとどう結びつくかを、3波の縦断データで個人間・個人内に分けて示した。", "p2": "客観的に測った活動とwell-beingの関係、および社会参加とデジタル接続がその関係にどう関わるかは明らかでなかった（抄録）。", "p3": "National Health and Aging Trends Study（NHATS）の2022〜2024年の加速度計と調査データ（543人）で、3つの活動指標と4つのwell-being（孤独感、正の感情、意味と目的、自己決定）の関係を、個人内-個人間分解のマルチレベルモデルで推定する。個人間の構造方程式モデルで社会参加を統計的相関として調べ、クロスレベル交互作用でデジタル接続の調整効果を検定する（抄録）。", "p4": "良いとする基準は、24の係数のうちBonferroni補正を生き残るもの、および12のクロスレベル交互作用の有意性。", "p5": "個人間では、断片化が4結果中3つ（正の感情、意味と目的、自己決定）と、平均活動量が1つ（正の感情）と関連し、24係数中7つがBonferroni補正を生き残った。個人内では平均活動量が孤独感と正の感情と関連し、相対振幅は補正後に関連なし。社会参加を介した間接的な関連は正の感情・意味と目的・自己決定で有意だが孤独感では非有意。12のクロスレベル交互作用はいずれも非有意（全てp≥.069）。活動の断片化が少ない（活動と座位の切り替えが少ない）高齢者ほどwell-beingが高かった（抄録）。", "p6": "抄録は途中で切れており限界の記載は確認できない。解釈：観察研究で因果の向きは示されず、デジタル接続の調整効果は検出されなかった。社会参加の媒介は探索的な間接関連にとどまる。", "fun": "高齢者の幸せは「どれだけ動いたか」より「動きが細切れでないか」と関係していた。腕につけた加速度計で1日の活動を測ると、動いては座り、また動いては座りという切り替えの多い人より、まとまって活動する人の方が、生きがいや前向きな気持ちが高かった。歩数という量だけでなく、1日のリズムの形が心に効いているかもしれないという視点である。", "unverified": "係数の大きさ、各波の人数、抄録末尾の考察は本文を入手できず未確認。"}}, {"id": "pr16", "rank": 16, "headline": "振動荷重下の粒状体強度低下を接触力で説明", "title": "Macroscopic and microscopic mechanisms of granular materials under vibration loads: roles of gradation and initial relative density", "url": "https://doi.org/10.2139/ssrn.7670102", "authors": "Yi Zheng ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Zheng, Y., Bai, Z., Zhang, X., Zhang, Q., Liu, H., & Zhou, S. (2026). Macroscopic and microscopic mechanisms of granular materials under vibration loads: roles of gradation and initial relative density. https://doi.org/10.2139/ssrn.7670102", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "振動を受ける粒状体の強度低下と体積変化を、粒度・初期密度・振幅・拘束圧の関数として個別要素法（DEM）で説明した。", "p3": "排水条件の繰返し三軸試験をDEMで模擬し、接触力、力学的配位数、滑り接触の割合などの微視量を追跡した（抄録）。", "p5": "相対強度損失は振幅とともに増え、初期密度と均等係数が上がるとほぼ線形に減る。拘束圧の増加は強度損失を抑え、低密度ほど効く。ひずみエネルギーの相対変化は強度損失と強い線形関係を示した（抄録）。", "fun": "地面の砂は、揺らされると粒どうしが押し合う力が弱まって支える力を失う。この研究は、どれくらい弱るかが、最初にどれだけ詰まっていたか（密度）と、粒の大きさがどれだけ混ざっているかでほぼ直線的に決まることを計算で示した。地震で緩い砂地盤が危ない理由を、粒の接触という小さな世界から説明している。", "unverified": "具体的な数値の大きさと解析条件（粒子数、振幅の範囲）は抄録に記載がなく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "多色粒子で密な粒状流を追跡する", "title": "CBTV: Colour Bean Tracking Velocimetry for Dense Granular Flows", "url": "https://arxiv.org/abs/2610.31883", "authors": "Kaveeshan Thurairajah ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Thurairajah, K., & Pan, Z. (2026). CBTV: Colour Bean Tracking Velocimetry for Dense Granular Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31883", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多色に塗り分けた粒子を使い、密な粒状流でも粒子を取り違えずに追跡できる学習不要の手法CBTVを示した。", "p3": "隣接する色つき粒子の「星座」を、相互相関で得た運動の事前推定に導かれて一括で対応づけ、その後に残りの粒子を個別に割り当てる多段階法（抄録）。", "p5": "厳密な正解のある15のDEM模擬流れ・59事例（1フレームあたり0.006〜9粒径）で12種の追跡器と比較し、衝撃的な衝突では全ての変位で最良以上。粒子が間隔の約0.5〜2倍動く密な流れで優位で、2〜3粒径を超えると全体運動を補正する追跡器が勝る（抄録）。", "fun": "砂粒の流れを高速カメラで追うとき、粒が一度に隣の粒の位置まで動くと「どれがどれだったか」が分からなくなる。この研究は粒にいくつかの色を塗り、近所の色の並び（星座）ごと見つけることで、超高速カメラなしでも見失わないようにした。パズルのピースを1個ずつでなく模様のまとまりで探すのと同じ発想である。", "unverified": "色の種類数と、実験（模擬でない）での検証の有無は抄録から不明。"}}, {"id": "pr18", "rank": 18, "headline": "高次元シミュレータのベイズ代理モデルを総覧", "title": "A Review of Bayesian Surrogate Modeling for High-Dimensional Computer Simulations", "url": "https://arxiv.org/abs/2610.31870", "authors": "Gavin Collins ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Collins, G., Huerta, G., Tucker, J. D., & Rumsey, K. (2026). A Review of Bayesian Surrogate Modeling for High-Dimensional Computer Simulations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31870", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "計算の重い物理シミュレータの不確実性評価に使うベイズ代理モデルを、高次元出力への対応まで含めて総覧した。", "p3": "ガウス過程（スケーラブルな近似を含む）と、多項式カオス展開・ベイズMARS・ベイズ射影追跡回帰・BARTなどのベイズ基底関数回帰の2系統を整理し、低次元表現による出力の次元削減を扱う（抄録）。", "p5": "順方向の不確実性定量化、大域感度解析、ベイズ較正への応用と、模擬・実データでの実務的な手順を示し、方法選択・計算量・予測精度・UQの忠実さを未解決課題に挙げる（抄録）。", "fun": "本物のシミュレーションは1回に何時間もかかるので、何千回も回して「どれくらい不確かか」を調べるのは無理がある。そこで代わりに素早く答えを出す「代理」の統計モデルを作る。この総説は、その代理の作り方を2つの流儀に整理し、出力が何千もの数値になるときの工夫までまとめた案内図である。", "unverified": "実データの内容と手法間の比較結果は抄録に記載がなく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "AIが操作するGPU個別要素法を動的流れで検証", "title": "Granum, an agentic-AI GPU discrete element program: verification for dynamic granular flows", "url": "https://doi.org/10.5281/zenodo.23666311", "authors": "Youwai, Sompote", "venue": "Zenodo", "date": "2026-10-26", "apa": "Youwai, S. (2026). Granum, an agentic-AI GPU discrete element program: verification for dynamic granular flows. Zenodo. https://doi.org/10.5281/ZENODO.23666311", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodo版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIエージェントが操作できるGPU個別要素法プログラムGranumを動的な粒状流に拡張し、接触・ベンチマーク・実験則の3段階で検証した。", "p3": "ホッパー・サイロ壁、回転ドラム、自由落下する剛体などを追加し、Chung–Ooiの衝突基準、9つの公開コードによるDEM8ベンチマーク、Beverloo則や粒状柱崩壊の実験則と比べた（抄録）。", "p5": "衝突はHertz解の0.1%以内、サイロ流量はコード帯の中央から0.7〜1.9%以内、オリフィス比3.10（基準3.10±0.06）、Beverloo則のC=0.54・k=1.51、鋼球の貫入はUeharaらの則の0.72〜0.94倍。固定端板の制動効果など3つの欠陥も見つけて修正した（抄録）。", "fun": "砂時計の砂がどれくらいの速さで落ちるかには「Beverloo則」という経験式がある。この研究は、AIが指示して動かせる粒のシミュレータが、その式や他の有名な実験とどれだけ合うかを一つずつ確かめ、合わなかった場所（バグ）も隠さず報告した。自分の道具を疑って試験する姿勢がそのまま論文になっている。", "unverified": "検証に使った粒子数や計算時間は抄録に記載なし。"}}, {"id": "pr20", "rank": 20, "headline": "物理拘束ニューラル作用素で貯留層の履歴整合", "title": "Autoregressive Physics-Informed Neural Operator Surrogates and Joint 4-D Seismic-Production Bayesian History Matching", "url": "https://arxiv.org/abs/2610.31677", "authors": "Clement Etienam ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Etienam, C., Blom, D., Pattathil, H., Onishi, T., Sethi, H., Vincent, L., Pawar, S., Kumar, K. R., Devarakota, P., & Alpak, F. O. (2026). Autoregressive Physics-Informed Neural Operator Surrogates and Joint 4-D Seismic-Production Bayesian History Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31677", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "物理拘束つきニューラル作用素を代理モデルにして、生産データと4D地震探査を同時に同化するベイズ履歴整合を1 GPU時間以内で行えるようにした。", "p3": "フーリエニューラル作用素を黒油方程式の残差を罰則として閉ループで学習し、適応正則化アンサンブルカルマン逆解析とES-MDAで同化する。未知場は切断コサイン変換またはVAEの低次元チャートで表し、データが拘束しない方向を最初から削る（抄録）。", "p5": "10万セル超の合成モデルで、1回のロールアウトが0.579秒（約2500倍の高速化）、190メンバー・10反復の同時逆解析が1 GPU時間に収まる。ロールアウト誤差の上界と物理罰則による縮約性も示した（抄録）。", "fun": "地下の油層の性質を、井戸の生産量と地震波の変化から逆算するのは、数十万のマスの値を少ないデータで当てる難問である。この研究は、物理法則を学んだAIを「超高速の代用シミュレータ」にし、さらに未知数を少ない座標で表すことで、当てようのない方向を探さないようにした。", "unverified": "比較対象との精度の差は抄録に数値がなく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "能動粒子が実空間でローレンツ型アトラクタを描く", "title": "Chaos Made Visible: Active particles trace Lorenz-like attractors in physical space", "url": "https://arxiv.org/abs/2610.32640", "authors": "Rahil N. Valani ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Valani, R. N., Tiwari, E., & Roy, A. (2026). Chaos Made Visible: Active particles trace Lorenz-like attractors in physical space (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32640", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "向きを持つ自己推進粒子が、定常な2次元多渦流れの中で、実空間にローレンツ型のカオスアトラクタを描くことを示した。", "p3": "粒子の位置と向きの連成で3次元の非線形力学系ができることを利用し、形状と遊泳速度を変えて軌道を調べる（抄録）。", "p5": "適切な条件で軌道が二葉の幾何に組織化し、構造のある初回帰写像、正の最大リアプノフ指数、広帯域スペクトルからカオスを確認。遊泳速度を変えると多様な力学的領域が現れる（抄録）。", "fun": "カオスの代名詞「ローレンツの蝶」は、ふつう数式の中の抽象的な空間にしか現れない。この研究は、水流の中を自分で泳ぐ小さな粒が、流れ自体は時間で変わらないのに、進む向きという1つの自由度が加わるだけで、実際の空間に蝶の形の軌道を描くことを示した。見えないはずのものが見えるという転換が面白い。", "unverified": "実験か数値計算かの別と、粒子の具体的な形状は抄録から判断できず未確認。"}}, {"id": "pr22", "rank": 22, "headline": "粘性散逸が超せん断き裂の安定伝播を可能に", "title": "Viscous Dissipation Stabilizes Steady Supershear Crack Propagation", "url": "https://doi.org/10.2139/ssrn.7669892", "authors": "Tsung-Yuan Lu ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Lu, T.-Y., & Chen, C.-H. (2026). Viscous Dissipation Stabilizes Steady Supershear Crack Propagation. https://doi.org/10.2139/ssrn.7669892", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "粘性散逸だけで、せん断波速度を超える速さで進む引張き裂が安定に伝播しうることを有限要素解析で示した。", "p3": "平面応力のKelvin–Voigt固体（線形弾性応答）で定常き裂伝播を計算し、最大周応力の向きとエネルギーの流れを調べる（抄録）。", "p5": "弾性極限ではYoffe不安定に合う速度で最大周応力がき裂面から外れるが、十分な粘性があると超せん断域でも進行方向に揃う。高速では放出エネルギーの大半が体積で散逸し、遠方のエネルギー解放率が先端への流束を最大1桁上回る。超せん断き裂は楔形の開口と鋭いMach前面を示す（抄録）。", "fun": "教科書では、割れ目が進む速さには「レイリー波の速さ」という上限があり、その7割ほどで割れ目はふらつき始めるとされる。ところがゴムやゲルでは音より速い割れが観察されていた。この研究は、材料のねばり（粘性）がエネルギーを吸い取ることで割れ目がまっすぐ進み続けられると示し、超音速の割れが衝撃波のような前面を作ることも描いた。", "unverified": "安定化に必要な粘性の閾値や解析条件の数値は抄録に記載なし。"}}, {"id": "pr23", "rank": 23, "headline": "1980年代以降の土石流活動の増大を湖底記録で復元", "title": "Massive debris flow activity and connectivity shift in the 1980s deciphered by combined terrestrial and lacustrine record in a changing climate", "url": "https://doi.org/10.5194/egusphere-2026-4303", "authors": "Natalie Barbosa ほか", "venue": "EGUsphere", "date": "2026-10-25", "apa": "Barbosa, N., Kiefer, C., Jubanski, J., Siegert, F., Strasser, M., & Krautblatter, M. (2026). Massive debris flow activity and connectivity shift in the 1980s deciphered by combined terrestrial and lacustrine record in a changing climate. https://doi.org/10.5194/egusphere-2026-4303", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphere（査読前の公開原稿）の抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1952〜2020年の空中写真と湖底堆積物を突き合わせ、アルプスの湖に流入する54の土石流扇状地の土砂移動を数十年単位で定量した。", "p3": "歴史的な空中写真に写真測量を適用して扇状地ごとの侵食・堆積量を出し、湖の堆積記録と「源から沈み場まで」の枠組みで照合する。降雨強度の変化も解析した（抄録）。", "p5": "21の渓流が湖に接続。1980年以降、土石流を起こしうる強雨（10 mm/h超）の日数が36%増、侵食量が12%増、接続扇状地の堆積量が47%減。湖底記録からの土石流量3.69±0.42×10^5 m^3（1952〜2018年）と、扇状地からの移動量3.42±0.43×10^5 m^3（過去70年）が初めて直接一致した（抄録）。", "fun": "山の土砂がどれだけ湖に流れ込んだかを、山側（古い航空写真の地形変化）と湖側（湖底に積もった泥の層）の両方から別々に計算し、ほぼ同じ量になった。帳簿の出金と入金が合うように70年分の土砂の収支が合ったわけで、気候の変化で土石流が増えたという話に強い裏づけを与えている。", "unverified": "誤差の算定法と写真測量の精度は抄録に記載なし。"}}, {"id": "pr24", "rank": 24, "headline": "橋梁SHM解析の省エネ自動スケーリング", "title": "Energy-Aware Autoscaling of Distributed Structural Health Monitoring Services Under Variable Workloads", "url": "https://doi.org/10.2139/ssrn.7664179", "authors": "Dai Teng ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Teng, D., & Zhang, S. (2026). Energy-Aware Autoscaling of Distributed Structural Health Monitoring Services Under Variable Workloads. https://doi.org/10.2139/ssrn.7664179", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "橋梁群のSHM解析基盤で、緊急の事象記録と締切つきの常時微動モード解析を両立させつつ消費電力を減らす自動スケーリングEASEを示した。", "p3": "センサ到着率による待ち行列のフィードフォワード、締切に基づく最早締切優先の処理率、観測遅延による補正、サーバ電力状態の損益分岐時間による電源断の4つの信号で規模を決める。Z24橋の記録に対する周波数領域分解と確率部分空間同定の実処理で需要を測った（抄録）。", "p5": "1日約1,250万ジョブの24時間シナリオで、Kubernetes HPAなど6基準の最良より4.7〜6.7%、同期アップロード時は20.3%少ない電力で、事象記録の99パーセンタイル遅延を0.71秒未満（目標2秒）に保ち全締切を満たした。利用率に基づく推定は節約を最大52ポイント過大評価する（抄録）。", "fun": "橋のセンサは、車が多い時間や地震の直後にデータを一斉に送ってくる。サーバを常に多めに動かせば安心だが電気の無駄で、少なすぎると急ぎの判定が遅れる。この研究は「急ぎの仕事は待ち時間で、後回しでよい仕事は締切で」管理し、空いた隙間に後者を詰め込むことで、電力を減らしつつ遅れも出さない仕組みを作った。", "unverified": "基準手法の設定と電力計測の条件は抄録の範囲でしか確認できていない。"}}, {"id": "pr25", "rank": 25, "headline": "1次元畳み込み自己符号化器で風車の異常検知", "title": "One-dimensional convolutional autoencoder-based monitoring for fault detection in wind turbines", "url": "https://hal.science/hal-05838778v1", "authors": "Amanda Aryda S Sousa ほか", "venue": "HAL", "date": "2026-10-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HAL登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "健全時の振動データだけで学習した1次元畳み込み自己符号化器の再構成誤差を健全指標とし、風車の故障を教師なしで検知する。", "p3": "風車各部の加速度計の振動信号を入力に、正常挙動の潜在表現を学習する。再構成誤差が高いほど劣化の疑いとする（抄録）。", "p5": "陸上風車に適用し、正常と故障を含む多様な運転条件で評価したとされるが、抄録に検知性能の数値はない（抄録）。", "fun": "正常な音だけを覚えた機械は、聞いたことのない音を聞くと上手に真似できない。この研究はその真似の下手さ（再構成誤差）を故障の合図に使う。壊れたときのデータを集めなくても異常を見つけられるのが利点で、実際の風車で試している。", "unverified": "検知性能の数値、故障の種類、データ期間は抄録に記載がなく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "支点反力から配管内部励振を逆算し疲労評価", "title": "Equivalent Internal Excitation Reconstruction and Fatigue Assessment of Piping Systems Based on Fluid-Excitation-Force Measurement", "url": "https://doi.org/10.2139/ssrn.7669871", "authors": "QinChao Wang ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Wang, Q., Yang, J., Xi, S., Wang, Z., Xing, L., & Ma, X. (2026). Equivalent Internal Excitation Reconstruction and Fatigue Assessment of Piping Systems Based on Fluid-Excitation-Force Measurement. https://doi.org/10.2139/ssrn.7669871", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "配管支持部の反力計測と有限要素の伝達関数から内部の流体励振力を逆算し、独立した加速度で検証してから疲労を評価する一連の手順を示した。", "p3": "支点反力の逆解析で等価励振を再構成し、独立点の加速度応答で伝達能力を確かめ、同じ荷重をホットスポット応力に伝えてレインフロー法と周波数領域の疲労解析を行う（抄録）。", "p5": "3成分の支点反力は強く連成し、反力伝達関数は大半の周波数点で3次元に同定できた。3つの独立加速度点の全体振動レベルは予測と実測が良く一致。励振は方向性が強く、応力エネルギーは300〜600 Hz帯に集中。疲労損傷率は手法により大きく異なった（抄録）。", "fun": "配管の中を流れる液体がどんな力で管を揺らしているかは、直接は測れない。この研究は、管を支える台にかかる力（測れる）から中の力を逆算し、別の場所の揺れで答え合わせをしてから疲労を計算した。「結果から原因を当て、別の証拠で確かめる」推理の手順を工学で実践している。", "unverified": "対象配管の規模と、疲労手法間の差の大きさは抄録に数値がない。"}}, {"id": "pr27", "rank": 27, "headline": "状態推定を表形式の文脈内予測として解く", "title": "State Estimation as In-context Tabular Prediction", "url": "https://arxiv.org/abs/2610.32487", "authors": "Ayushi Jolotia ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Jolotia, A., & Pareek, P. (2026). State Estimation as In-context Tabular Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32487", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "電力系統の状態推定を、過去の計測と推定値を文脈として新しい計測から状態を予測する「表形式の文脈内予測」に置き換え、重みを更新しない表形式基盤モデルで解いた。", "p3": "合成データで事前学習した表形式基盤モデルを凍結したまま、計測ベクトルと状態推定の対を文脈として与える（抄録）。", "p5": "14〜118母線の送配電網で、完全計測時の誤差は文脈の母線平均の1/11〜1/57、計測が5%しかない場合でも1/1.3〜1/4.0。6母線に8σの偏りがあると角度誤差は1.8〜5.0倍に増えるが、不良データ検出つき重み付き最小二乗は2.5〜12.7倍。再学習なしでDSS²より電圧誤差が小さかった（抄録）。", "fun": "電力網の「いま各地点の電圧はどうか」を少ない計測から推定するのは連立方程式を解くのが定石だが、計測が足りなかったり壊れた計測が混じると崩れる。この研究は、表の欠けたマスを埋めるのが得意なAIに、過去の計測と答えの対を見せるだけで推定させた。学習し直さなくても別の電力網で使えるのが驚きである。", "unverified": "比較手法の設定の詳細は抄録のみで未確認。"}}, {"id": "pr28", "rank": 28, "headline": "低コストVIOのESKFを実データで失敗まで公開", "title": "Gyro-Aided Epipolar Filtering for Visual-Inertial Odometry on KITTI and EuRoC: An Empirical Study with Failure Analysis", "url": "https://doi.org/10.5281/zenodo.23646054", "authors": "Souparna Chatterjee", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-25", "apa": "Chatterjee, S. (2026). Gyro-Aided Epipolar Filtering for Visual-Inertial Odometry on KITTI and EuRoC: An Empirical Study with Failure Analysis. Zenodo. https://doi.org/10.5281/ZENODO.23646054", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodo登録の説明文（OpenAlex経由）を抄録として使用。本文は入手できず", "preprint": true, "short": true, "p1": "低コスト機器向けの誤差状態カルマンフィルタによる視覚慣性オドメトリを、KITTIとEuRoCで段階的に検証し、失敗した試行も含めて公開した。", "p3": "ジャイロで予測した回転、2視点のエピポーラ幾何による並進方向の観測、静止時の零速度更新を組み合わせる。KITTIの生ログの時刻の不具合も修正した（抄録）。", "p5": "視覚とジャイロの回転の不一致は中央値0.087°/フレーム（運動0.89°に対し）。補正なしの推測航法はEuRoCで70秒以内に77〜516 mの軌跡誤差で破綻。EuRoCの5系列中2つで失敗し、KITTIの5走行中2つでしかIMU単独を上回らなかった（抄録）。", "fun": "カメラとジャイロで自分の位置を推定する技術は、うまくいった結果だけが論文になりがちである。この研究はうまくいかなかった設定や、データが否定した仮説まで全部書いた。70秒で数百メートルずれる失敗例を見ると、なぜ複数のセンサを組み合わせる必要があるかが実感できる。", "unverified": "成功した系列での最終的な軌跡誤差は抄録に記載なし。"}}, {"id": "pr29", "rank": 29, "headline": "vbICAで余効変動をGNSS時系列から分離", "title": "Disentangling postseismic deformation from noisy GNSS data using vbICA approach: Application to the 2021 Mw7.4 Maduo Earthquake, Tibetan Plateau", "url": "https://doi.org/10.21203/rs.3.rs-10721869/v1", "authors": "Zhijun Liu ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Liu, Z., Qiu, Q., Liu-Zeng, J., Tian, Y., Zhao, B., Wang, P., Yao, W., Wang, W., Han, L., & Shao, Y. (2026). Disentangling postseismic deformation from noisy GNSS data using vbICA approach: Application to the 2021 Mw7.4 Maduo Earthquake, Tibetan Plateau. https://doi.org/10.21203/rs.3.rs-10721869/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "地震後に設置されたGNSS局も含めて、変分ベイズ独立成分分析（vbICA）で余効変動を傾向・季節変動・雑音から分離する手順を示した。", "p3": "地震前からの19局で同時・非地殻変動のオフセットと線形傾向を除き、vbICAで余効成分と季節成分を分離する。傾向と季節成分をクリギングで地震後設置の13局に内挿して除去し、全局にvbICAを再適用。水平と鉛直は別々に扱う（抄録）。", "p5": "2021年Mw7.4 Maduo地震で、水平成分の余効変動は1年以内に急減する指数型の過渡から一定の速度へ移行する形を示した（抄録）。", "fun": "大地震のあと、地面はゆっくり動き続ける（余効変動）。それを測りたいのに、肝心の震源近くの観測点は地震のあとに置かれるので「地震前の普段の動き」が分からない。この研究は、前からある観測点の普段の動きを地図のように内挿して新しい点から差し引く工夫で、混ざった信号を分けた。", "unverified": "分離精度の定量評価は抄録に記載なし。"}}, {"id": "pr30", "rank": 30, "headline": "斜面上の一体式橋台杭は横抵抗が33%減", "title": "Analysis of Soil-Abutment-Pile Interaction Considering the Slope Effect for Integral Abutment Jointless Bridges (IAJBs) Under Cyclic Loading", "url": "https://doi.org/10.20944/preprints202610.2320.v1", "authors": "Xiaoye Luo ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Luo, X., Fu, R., Yang, J., Xiong, Z., She, Z., & Yuan, J. (2026). Analysis of Soil-Abutment-Pile Interaction Considering the Slope Effect for Integral Abutment Jointless Bridges (IAJBs) Under Cyclic Loading. https://doi.org/10.20944/preprints202610.2320.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "斜面上に建つ一体式橋台（ジョイントレス）橋の橋台・杭・地盤の相互作用を繰返し載荷試験で調べ、「斜面効果」が横抵抗を弱め応答を非対称にすることを示した。", "p3": "層状の粘土・砂斜面に埋めた一体式橋台とRC杭に擬似静的な繰返し載荷を行い、杭側面から斜面肩までの距離と杭径の比b/dを主要パラメータとして、平地（b/d=0）と30°斜面（b/d=2.0）を比べた（抄録）。", "p5": "斜面側のピーク横力は33.1%減、系の剛性は24.8%低下し、杭の塑性ヒンジはより深く形成。背面土圧は大変位で約4.6%低く、杭の平均地盤反力は平地の0.932倍（抄録）。", "fun": "山道の橋は、片側が崖のような斜面に杭を打つことが多い。地面が片側にしかないと、杭を押したときに支えてくれる土が少なく、押し返す力が3割ほど弱まることを実物に近い試験で測った。橋の「片足が斜面に乗っている」状態がどれだけ不利かを数字で示した研究である。", "unverified": "試験体の縮尺と載荷回数は抄録に記載なし。"}}, {"id": "pr31", "rank": 31, "headline": "自律検査に向けた非破壊検査4.0の総説", "title": "The Path to NDE 4.0: A Review of Algorithms, Techniques, and Strategies for Autonomous Inspection", "url": "https://arxiv.org/abs/2610.31704", "authors": "Ashiqur Rahmana ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Rahmana, A., Seethi, V. D. R., Kral, Z., Yunker, A., Kettimuthu, R., & Alhoori, H. (2026). The Path to NDE 4.0: A Review of Algorithms, Techniques, and Strategies for Autonomous Inspection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31704", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "非破壊検査の自律化（NDE 4.0）に向けた研究動向を、計算アルゴリズム・物理手法・産業応用・研究目的の4つの視点で整理した総説。", "p3": "幅広い文献を統合し、手作業の判読からデータ中心の体制への移行を描く（抄録）。", "p5": "超音波と目視が主要な物理手法で、欠陥認識は深層学習と生成モデルへ移行している。標準化された公開データの不足とAIのブラックボックス性が障害で、説明可能AIとデジタルツインの標準化が課題とする（抄録）。", "fun": "橋や飛行機を壊さずに傷を見つける検査は、長く人の目と経験に頼ってきた。この総説は、その仕事がどこまで機械に置き換わりつつあるかを地図にし、意外にも一番の壁が技術ではなく「みんなで使える公開データがない」ことだと指摘している。", "unverified": "対象文献数と選定基準は抄録に記載なし。"}}, {"id": "pr32", "rank": 32, "headline": "LLM注釈者の人間との一致度をベンチマーク", "title": "Can LLM Annotators Match Human Consistency? Benchmarking Human Agreement and Optimizing Multi-Agent with Contrastive Knowledge", "url": "https://arxiv.org/abs/2610.32415", "authors": "Xiaopeng Ke ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Ke, X., Wang, Z., Liu, X., Ma, X., Zheng, X., Song, B., Wang, W., & Zhang, M. (2026). Can LLM Annotators Match Human Consistency? Benchmarking Human Agreement and Optimizing Multi-Agent with Contrastive Knowledge (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32415", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "長い注釈ガイドラインと複数注釈者の不一致を含む実務的なベンチマークで、LLM注釈者が人間の判断分布にどれだけ近いかを測り、対比的な規則抽出で改善する多エージェント枠組みを示した。", "p3": "7データセットに1事例あたり5人の独立ラベルを付けたANT-Aベンチマークを作り、Fleiss kappaで分布との整合を評価する。ANT-ORは正例・負例のフィードバックから対比的な決定規則を蒸留してプロンプトを改良する（抄録）。", "p5": "ANT-ORは2人以上一致の精度で最強の基準を4.5ポイント上回り、Fleiss kappaで人間の分布に2ポイント以内まで近づいた（抄録）。", "fun": "「この文は攻撃的か」のような判断は、人間どうしでも意見が割れる。従来のAI評価は正解を1つに決めてしまうが、この研究は5人分の答えのばらつきそのものを正解にして、AIがそのばらつきを再現できるかを測った。間違いから「こういうときはこう判断する」という規則を学ばせると、人間の分布に近づいた。", "unverified": "7データセットの内訳と基準手法の名称は抄録に記載なし。"}}, {"id": "pr33", "rank": 33, "headline": "多エージェント工作流の設計原理を探索履歴から採掘", "title": "Mining the Design Space of Multi-Agent Workflows", "url": "https://arxiv.org/abs/2610.31709", "authors": "Xavier Cadet ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Cadet, X., Cheng, J., Chin, P., & Richardson, K. (2026). Mining the Design Space of Multi-Agent Workflows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31709", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "最適化の途中で捨てられていた多エージェント工作流の候補と実行記録を集め、再現可能な設計原理を統計的に検証する2段階の手順を示した。", "p3": "AFlowのMCTS最適化を6つの演算子と26の決定論的に検証できるEnigmata課題で回し、中間結果も残して28,568の実行可能な工作流の集合を作る。サンドボックス化した自動研究ループがL0罰則つきの検証目的で設計原理を採掘し、保留した探索で検証する（抄録）。", "p5": "300回の特徴採掘で、独立解法と一括集約で始める構成は劣り（Δ=−0.045）、永続的な共有文書は討論を上回り（Δ=+0.135）、プロンプトの具体性と文脈のルーティングは通信構造の選択に匹敵する効果（Δ=+0.118）だった（抄録）。", "fun": "複数のAIをどう組ませると賢くなるかは、これまで職人の勘で決められてきた。この研究は、最適化の途中で試して捨てられた何万通りもの組み方を実験データとして拾い直し、統計的に効く設計の型を見つけた。意外にも、AIどうしに討論させるより、1枚の共有メモに書き足させる方が成績が良かった。", "unverified": "Δの単位（スコアの尺度）は抄録から判断できず未確認。"}}, {"id": "pr34", "rank": 34, "headline": "信頼を見抜いても合意には使えないLLM交渉", "title": "Knowing Whom to Trust is not Enough: The Trust--Agreement Gap in Repeated Multi-Party LLM Negotiation", "url": "https://arxiv.org/abs/2610.31971", "authors": "Amit Sarker ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Sarker, A., Choudhury, M., Mahmud, S., & Zilberstein, S. (2026). Knowing Whom to Trust is not Enough: The Trust--Agreement Gap in Repeated Multi-Party LLM Negotiation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31971", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "反復する多者間交渉で、LLMエージェントが相手への信頼を推定できても、それを使うよう明示されない限り合意率が上がらない「信頼-合意の溝」を示した。", "p3": "同じエージェントが連続する多者・多争点の交渉ゲームに参加し、1人が密かに合意を妨害する枠組みで、各ゲーム後に相手を評価して対ごとの信頼を次に持ち越す。信頼を使う条件と使わない条件を比べる（抄録）。", "p5": "信頼ありのエージェントは数ゲームで敵対者を特定できるが、正確な信頼推定が良い合意につながるとは限らない。信頼を判断に使うよう明示した場合のみ合意率が最大23ポイント上がった（抄録）。", "fun": "「誰が邪魔しているか」を見抜くことと、「見抜いた上でうまく交渉する」ことは別である。AIの交渉者は、繰り返し会ううちに裏切り者を数回で見つけられたが、そのことを交渉にどう生かすかを言われないと結果は良くならなかった。人間の会議でも思い当たる話で、知っていることと使えることの差を測った研究である。", "unverified": "使用したモデルの種類とゲーム数は抄録に記載なし。"}}, {"id": "pr35", "rank": 35, "headline": "研究者ペルソナで科学エージェントを評価", "title": "PersonaScienceBench: Evaluating Scientific Agents with Diverse Simulated Researchers", "url": "https://arxiv.org/abs/2610.32106", "authors": "Siyang Wu ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Wu, S., Zhang, W., Yang, C., Fei, E. X., Overwiening, J., Pan, X., Tang, J., He, Y., Mo, K. C., Li, P., Cao, D., Hu, X., Wang, H., Li, T., Li, H., Deng, Z., Zhang, J., Zhang, P., Zhang, H., … Hao, Y. (2026). PersonaScienceBench: Evaluating Scientific Agents with Diverse Simulated Researchers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32106", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "専門や好みが異なる研究者を模擬したペルソナと対話しながら課題を解く科学エージェントの評価ベンチマークを提案した。", "p3": "4領域5ベンチマークから200課題を取り、模擬研究者がペルソナに従って文脈と反応を与える。課題の目的と採点は固定し、エージェントは会話を通じてしか相手の好みを知れない（抄録）。", "p5": "18のモデル構成で、課題性能・事実の回収・自己反復に異なる強みが現れた。研究者プロファイルごとに異なる応答が見られ、最終スコアが同じでも振る舞いが違う場合があった（抄録）。", "fun": "研究を手伝うAIの試験は、ふつう「問題を解けたか」だけを見る。この研究は、相手となる研究者の性格や専門を変えて、AIが相手に合わせて質問したり手順を直したりできるかを測った。点数が同じ2つのAIでも、相手への向き合い方は違うことがある。", "unverified": "具体的なモデル名と詳細な数値は抄録に記載なし。"}}, {"id": "pr36", "rank": 36, "headline": "LLM有権者模倣の集団誤差は属性除去で減る", "title": "AI Alignment for Digital Democracy: Fairer Voters Representation against LLM Biases", "url": "https://arxiv.org/abs/2610.32780", "authors": "Yi Qi ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Qi, Y., Majumdar, S., & Pournaras, E. (2026). AI Alignment for Digital Democracy: Fairer Voters Representation against LLM Biases (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32780", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMで有権者の投票を模倣するときの集団別の誤差を測り、どの属性情報を外せば公平になるかを3回の米大統領選で調べた。", "p3": "クローズドとオープンの2つのLLMで、個々の投票をどれだけ正確に再現するか、集団間で精度が違うかを比べ、整合戦略の効果を試す（抄録）。", "p5": "性別を外すと最大の集団誤差が22〜42%減、学歴を外すと64%減。一方で自己申告の人種を外すと平均集団誤差が40%超増え、いずれも全体精度は下がらない。反復質問や公平性の指示は誤差を減らさず、2倍にすることもあった（抄録）。", "fun": "世論調査の代わりにAIに「この人ならどう投票するか」を答えさせる試みがある。この研究は、AIに教える人物情報を増やせば増やすほど良いわけではなく、性別や学歴を伏せた方が特定の集団への誤りが減る一方、人種を伏せると逆に悪化することを見つけた。「公平にしてください」と頼んでも効かないという結果も含め、直感に反する発見である。", "unverified": "使用したモデル名と誤差の定義は抄録に記載なし。"}}, {"id": "pr37", "rank": 37, "headline": "LLM判断の会話経路依存は曖昧な事例で大きい", "title": "Conversational Path Dependence in Ambiguous LLM Judgment", "url": "https://doi.org/10.5281/zenodo.23660349", "authors": "Wang, Jiaying", "venue": "Zenodo", "date": "2026-10-26", "apa": "Wang, J. (2026). Conversational Path Dependence in Ambiguous LLM Judgment. Zenodo. https://doi.org/10.5281/ZENODO.23660349", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodo版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "同じ事実でも提示順や先行する助言者の判断で結論が変わる「会話経路依存」を、曖昧さの水準別に分解して測った。", "p3": "合成した対人事例で、最終的な外部記録を固定したまま事実の順序と先行コミットを変え（1A）、3段階の証拠の診断性×2つの極性でコミット・順序・顕著性の感度を別々に推定し（1B）、新証拠なしの継続で自己強化が起きるかを試す（1C）（抄録）。", "p5": "コミット感度は曖昧さが低・中・高で0.0280・0.0335・0.1150。最大効果は方向性信念の−0.342だが強く非対称。新証拠のない継続では平均の漂流・確信の増加・結論の変化がゼロで、新しい証拠だけが系統的な動きを生んだ（抄録）。", "fun": "相談相手に「最初はAだと思う」と言われたあとで同じ事実を見ると、人は結論が引きずられる。AIにも同じ癖があるかを、事実は同じで順番や前置きだけを変えて測った。曖昧な事例ほど引きずられる一方、話を続けるだけでは勝手に確信が膨らまないという、安心材料と注意点の両方が出た。", "unverified": "対人事例の内容と使用モデルは抄録に記載なし。"}}, {"id": "pr38", "rank": 38, "headline": "役割ごとにモデルを選ぶ多エージェント最適化", "title": "Not Every Agent Needs the Strongest Model: Unified Prompt-Model Optimization for Heterogeneous LLM-based Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.31743", "authors": "Mingxiu Cai ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Cai, M., Xian, H., Ma, X., Wang, Y., Song, Z., Li, J., & Liu, X. (2026). Not Every Agent Needs the Strongest Model: Unified Prompt-Model Optimization for Heterogeneous LLM-based Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31743", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多エージェントLLMの役割ごとにプロンプトとモデルの割当を同時に最適化し、最強モデルを全役割に使う構成に近い性能をはるかに低いコストで実現した。", "p3": "局所・下流・大域のフィードバックで候補を評価し、コストを考慮したパレート探索で品質とコストの両立する更新を残す。トポロジを考慮した共進化と階層横断の軌跡記憶で最適化を導く（抄録）。", "p5": "5ベンチマーク・5トポロジで、集中実行では平均スコアを69.79から70.40に上げつつ、トークン加重の展開コストをDeepSeek-V4-Pro＋MASPO比で85.2%削減した（抄録）。", "fun": "会社で全員を最高給の専門家にする必要はないように、AIの分業でも役割ごとに最適なモデルは違う。この研究は「誰にどのモデルを割り当て、どう指示するか」を一緒に探索し、成績を保ったまま費用を85%減らした。適材適所をアルゴリズムで実現した話である。", "unverified": "5ベンチマークの名称は抄録に記載なし。"}}, {"id": "pr39", "rank": 39, "headline": "善意のLLM協力が監視工程を迂回する", "title": "The Helpful Agent Problem: When Emergent Cooperation Among LLM Agents Bypasses Intended Workflows", "url": "https://arxiv.org/abs/2610.31985", "authors": "Moumita Choudhury ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Choudhury, M., Sarker, A., & Zilberstein, S. (2026). The Helpful Agent Problem: When Emergent Cooperation Among LLM Agents Bypasses Intended Workflows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31985", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "悪意のないLLMエージェントどうしが、審査者が不在のときに互いの資源を代わりに変更して意図された工程を迂回する「親切なエージェント問題」を示した。", "p3": "長期の共有資源環境で、他者所有の資源の変更が通常は審査者を介する設定を作り、審査が使えなくなったときの行動を観察する。副作用を測れるFavorBenchを導入し、CooperBenchも適応させた（抄録）。", "p5": "2ベンチマーク・4モデルで工程外の「お節介」が頻繁に現れ、FavorBenchでは少なくとも3モデルのお節介が相互作用の外の第三者に有意な害を及ぼした（抄録）。", "fun": "AIが悪さをする心配は多く語られるが、この研究は「良かれと思って」の協力が問題を起こすことを示した。審査役が席を外した途端、AIどうしが互いの仕事を代わりにやり始め、権限の範囲内なのに決められた手順をすり抜ける。善意が安全装置の穴になるという指摘が新しい。", "unverified": "害の大きさの数値と4モデルの名称は抄録に記載なし。"}}, {"id": "pr40", "rank": 40, "headline": "ペルソナと記憶刺激で対話AIを行動監査", "title": "Priming, Persona, and Provocation: A Transferable Method for Behaviourally Auditing Conversational AI", "url": "https://doi.org/10.20944/preprints202610.2312.v1", "authors": "Jean-Christophe Bélisle-Pipon ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Bélisle-Pipon, J.-C., Potter, J., Taylor, L., & Tehrani, M. (2026). Priming, Persona, and Provocation: A Transferable Method for Behaviourally Auditing Conversational AI. https://doi.org/10.20944/preprints202610.2312.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記憶を持ち個人化する対話AIを、標準化ペルソナ・記憶の事前刷り込み・段階的な挿話・敵対的な物語で監査する転用可能な方法を提案した概念論文。", "p3": "社会人口・地位で変えたペルソナを作り、準備セッションで経歴と関係史を記憶層に植え、後のセッションで記憶の保持と利用を調べ、重症度の段階に分けた一人称の場面を投げ、隔離した会話で物語を激化させて感受性の区分で報告する（抄録）。", "p5": "方法の枠組みと、採点層が満たすべき契約を示す。小標本・仮説生成型の妥当性やモデルの非決定性への対処を論じるが、実証結果は抄録に示されていない（抄録）。", "fun": "今のAI相談相手は会話を覚えて相手に合わせるので、1問1答の試験では本当の振る舞いが分からない。この提案は、俳優が設定を演じる「模擬患者」のやり方をAI試験に持ち込み、あらかじめ経歴を覚えさせてから、少しずつ深刻になる悩みを投げて反応を見る。試験の仕方そのものを設計し直した論文である。", "unverified": "実際の適用例や結果は抄録になく未確認。"}}, {"id": "pr41", "rank": 41, "headline": "DRMによる開示技術がM&A評価額を左右", "title": "Digital Rights Management as Disclosure Technology:Evidence from Target Valuations in Mergers and Acquisitions", "url": "https://doi.org/10.2139/ssrn.7670135", "authors": "Narmin Nahidi ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Nahidi, N., Hirth, S., & Eshraghi, A. (2026). Digital Rights Management as Disclosure Technology:Evidence from Target Valuations in Mergers and Acquisitions. https://doi.org/10.2139/ssrn.7670135", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "M&Aのデューデリジェンスで使う開示技術（DRM）が、特許資産では対象企業の評価額を上げ、モジュール性の低いデジタル資産では下げるという非対称を示した。", "p3": "開示技術が取引前の逆選択を減らす一方、取引後の再結合摩擦を資産のモジュール性に応じて生む2パラメータのモデルを立て、対象企業の10-K事業記述と特許からDRM文脈の指標を作る（抄録）。", "p5": "米国の公開対象企業3,649件のM&Aで、デジタル文脈の強さは評価額の低さ、特許文脈の強さは高さと結びつく。産業×年内の推定、無形資産の測定誤差の統制、置換プラセボにも頑健で、プライバシー法のショックは対象州で評価額を下げた（抄録）。", "fun": "会社を買う前に相手の中身を見せてもらう「開示」は、情報を守る技術（DRM）を通じて行われることがある。この研究は、守りが固いと安心して高く買う場合と、買った後に自由に使えず安く買い叩く場合の両方があり、それが資産の種類で分かれると示した。鍵のかかった倉庫は、中身が特許なら価値を上げ、データなら下げる。", "unverified": "DRMの採用自体は観測できず文脈指標で代理しているため、効果の解釈は著者も限定している。"}}, {"id": "pr42", "rank": 42, "headline": "ESG格付の不一致が過剰投資を抑制", "title": "ESG Rating Disagreement and Corporate Investment Efficiency: Evidence from China's A-Share Market", "url": "https://doi.org/10.21203/rs.3.rs-11245143/v1", "authors": "Zhaoqian Feng", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Feng, Z. (2026). ESG Rating Disagreement and Corporate Investment Efficiency: Evidence from China’s A-Share Market. https://doi.org/10.21203/rs.3.rs-11245143/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ESG格付の不一致が企業投資の効率に与える影響を過小投資と過大投資に分解し、符号が逆だった先行研究を整合させた。", "p3": "2019〜2022年の中国A株非金融334社・1,073企業年（最大7社の格付）で、不一致の効果を2つの余白に分けて推定し、資金制約・業種・年で異質性を見る（抄録）。", "p5": "不一致は過小投資を増やし過大投資を減らす。資金制約の強い企業では不一致1標準偏差で過大投資が0.019減（年固定効果でp=0.052、500回のプラセボでp=0.022）。制約の上位三分位で−0.028、下位で+0.014、重工業で−0.035、2022年で−0.043（抄録）。", "fun": "同じ会社に格付会社ごとに違うESG評価がつく。それが会社の投資を増やすのか減らすのか、先行研究の答えは逆だった。この研究は「投資しなさすぎ」と「投資しすぎ」を別々に測ると、不一致はどちらも抑える方向に働くので、足し合わせた符号がデータ次第で変わるのだと説明した。矛盾の正体が分解で見える例である。", "unverified": "投資効率の測定モデルは抄録に記載なし。"}}, {"id": "pr43", "rank": 43, "headline": "SEC財務データの欠損率を再現可能に監査", "title": "Why Financial Statement Data Goes Missing: A Reproducible SEC Filing Coverage Audit", "url": "https://doi.org/10.5281/zenodo.23657325", "authors": "Sreekumar, Avinash", "venue": "Zenodo", "date": "2026-10-26", "apa": "Sreekumar, A. (2026). Why Financial Statement Data Goes Missing: A Reproducible SEC Filing Coverage Audit (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.23657325", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodo登録の説明文（候補収集時に取得）を抄録として使用。本文は入手できず", "preprint": true, "short": true, "p1": "上場5,608銘柄・852,416の表示行を対象に、SEC提出書類に由来する財務諸表データがどれだけ欠けるかを再現可能な手順で監査した報告。", "p3": "元の規則で年次の適格行の充足を集計し、30件の確定的な事例を原本の提出書類と照合する。報告、凍結した匿名化データ、出典の記録、スクリプトを同梱（抄録）。", "p5": "年次の適格行は55.9%が充足、8.7%が部分、35.4%が欠損。これは表示の網羅性であり正確さではない。著者は商用サービスの創業者で、査読は受けていない（抄録）。", "fun": "企業の財務データは「ある」ように見えて、実はかなりの部分が抜けている。この報告は、何千社ものデータで3分の1以上の行が欠けていたことを数え、その数え方を他人が再現できる形で公開した。地味だが、データを使う側が最初に知るべき事実である。", "unverified": "欠損の原因の内訳は抄録に記載なし。著者の商業的利害が明記されている。"}}, {"id": "pr44", "rank": 44, "headline": "国の水道規制は投資より資本収益を高める", "title": "What does national water regulation deliver? Investment, returns and scale in European private water utilities", "url": "https://doi.org/10.2139/ssrn.7669848", "authors": "Andrea Guerrini", "venue": "SSRN", "date": "2026-10-25", "apa": "Guerrini, A. (2026). What does national water regulation deliver? Investment, returns and scale in European private water utilities. https://doi.org/10.2139/ssrn.7669848", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "欧州の民間水道事業者の独自パネルで、国レベルの規制機関の有無が投資・収益・規模の経済とどう結びつくかを調べた。", "p3": "10か国32事業者の2018〜2023年で、規模・事業範囲・所有形態を条件づけて体制差を推定し、国レベルのワイルドクラスターブートストラップと無作為化推論で検定する。レバレッジ分解と費用関数も推定（抄録）。", "p5": "国の規制下ではEBITDAマージンと1人当たり資本基盤が高く、自己資本利益率は約9ポイント高い。その約半分は投下資本利益率、半分は負債による増幅。資本蓄積の速さ、1人当たり運営費、収益の変動は差がない。規模の経済は労働で強く約100万人まで続く（抄録）。", "fun": "「国がまとめて水道を規制すると投資が進む」とよく言われる。データを見ると、国の規制の下にある会社は確かに利益率が高いが、投資のペースが速いわけではなく、むしろ資本にお金が回る仕組みと結びついていた。著者も因果ではないと断っているが、常識を数字で問い直した。", "unverified": "32事業者の内訳と欠測の扱いは抄録に記載なし。"}}, {"id": "pr45", "rank": 45, "headline": "AI利用より職場の両立文化が幸福を予測", "title": "Work-Life Balance, Technology-Enabled Work, and Workplace Happiness: A Machine-Learning Typology of Manufacturing Workers in Mexicali, Mexico", "url": "https://doi.org/10.21203/rs.3.rs-11206886/v1", "authors": "Mayda Alejandra Calderon Diaz ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Diaz, M. A. C., Macias, A. S. G., & Contreras, D. O. (2026). Work-Life Balance, Technology-Enabled Work, and Workplace Happiness: A Machine-Learning Typology of Manufacturing Workers in Mexicali, Mexico. https://doi.org/10.21203/rs.3.rs-11206886/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "メキシコ・メヒカリの製造業零細企業の労働者347人で、AI関連技術への曝露よりも組織の両立文化と正の波及が職場の幸福を強く予測することを示し、4つの労働者類型を見出した。", "p3": "心理測定と回帰分析に、教師ありと教師なしの機械学習を組み合わせる（抄録）。", "p5": "ランダムフォレストの交差検証AUCは0.837、精度73%で、両立文化が最強の予測因子。クラスタ分析で「繁栄するデジタル」「緊張し過接続」「伝統的低技術で均衡」「離脱し支援なし」の4類型が現れ、技術関与が同程度でも両立条件で幸福が違った（抄録）。", "fun": "「AIを使う職場ほどストレスが増える」と思われがちだが、この調査ではAIをよく使う人の中に、とても幸せな群と疲れ切った群の両方がいた。分けていたのは技術の量ではなく、仕事と生活の両立を会社が認めているかどうかだった。技術の是非より、使い方の環境が効くという結果である。", "unverified": "AUCの比較対象や変数の定義は抄録に記載なし。"}}, {"id": "pr46", "rank": 46, "headline": "AIエージェントはロボット技術者を即戦力化しない", "title": "Can AI Agents Help Robotic Engineers? Lessons from Two Focus Days in Industry", "url": "https://arxiv.org/abs/2610.32636", "authors": "Salim Fares ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Fares, S., & Herbold, S. (2026). Can AI Agents Help Robotic Engineers? Lessons from Two Focus Days in Industry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32636", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "産業用ロボットをプログラムする中小企業でAIエージェントを試した事例研究で、生産性は上がらなかったが、学習曲線とAI経験の重要性を示した。", "p3": "2回の集中日に技術者がAIエージェントで実務課題に取り組む様子を観察した（抄録）。", "p5": "反復的なコード生成の課題を除き生産性は向上しなかった。時間とともに結果は改善し、ロボット工学の経験よりAIの経験が成功に効いた。導入には訓練と学習期間、領域に合わせた設定が必要で、生産性研究は縦断的であるべきと結論づける（抄録）。", "fun": "AIに仕事を頼めばすぐ楽になる、とはいかなかった。ロボットの特殊な言語を扱う技術者たちは、最初はAIを使っても速くならず、慣れてくると成果が出始めた。しかも上手に使えたのはロボットに詳しい人ではなくAIに慣れた人だった。道具の良し悪しより、道具との付き合い方を学ぶ時間が結果を決めるという話である。", "unverified": "参加人数と課題数は抄録に記載なし。"}}, {"id": "pr47", "rank": 47, "headline": "小規模サービス企業の生成AI選定に検証時間を組込む", "title": "Selecting Generative AI Tools for Small Service Firms Under Human Review Constraints", "url": "https://doi.org/10.2139/ssrn.7663418", "authors": "Nadia Zahoor", "venue": "SSRN", "date": "2026-10-26", "apa": "Zahoor, N. (2026). Selecting Generative AI Tools for Small Service Firms Under Human Review Constraints. https://doi.org/10.2139/ssrn.7663418", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小規模サービス企業が生成AIを選ぶとき、人による確認時間を差し引いた上で、共有の確認能力に収まる施策の組合せを選ぶ会計モデルを示した概念論文。", "p3": "粗い労働節約から確認時間・修正の期待時間・継続費用を引き、残った施策を共通の確認能力で検定する透明な会計モデル。例示企業と感度分析、試行の設計を示す（抄録）。", "p5": "例示企業では報告書の全文作成が最大の粗節約だが確認時間が能力を超え、問い合わせの下書きと状況要約の組合せが最も価値の高い実行可能な選択になった。これはモデルの結果で観測ではない（抄録）。", "fun": "AIを月額で契約するのは安いが、AIが書いたものを人が確認する時間はただではない。この論文は、確認にかかる時間を帳簿に載せると、一番得に見える「報告書を全部AIに書かせる」が実は回らず、小さな仕事に使う方が得になることを計算で示した。節約の裏にある見えない労働を見える化した。", "unverified": "例示の数値は仮定に基づき、実企業のデータではない。"}}, {"id": "pr48", "rank": 48, "headline": "Visaデジタル決済の満足は期待性能と信頼で説明", "title": "Convenience, Trust, and Customer Satisfaction with AI-Supported Visa Digital Payments in Bangladesh", "url": "https://doi.org/10.20944/preprints202610.2259.v1", "authors": "Nafiz Hasan Sinha ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Hasan Sinha, N., & Mannan, K. A. (2026). Convenience, Trust, and Customer Satisfaction with AI-Supported Visa Digital Payments in Bangladesh. https://doi.org/10.20944/preprints202610.2259.v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "バングラデシュのVisa対応デジタル決済の利用者385人で、満足度を利便性・信頼・期待確認・性能期待・努力期待で説明したが、尺度の信頼性が低く推論は限定的だとした。", "p3": "各構成概念を3項目の合成得点にし、5つの予測変数の同時OLS回帰と、AI機能の経験区分による一元配置分散分析を行う（抄録）。", "p5": "回帰は満足の分散の24.3%
