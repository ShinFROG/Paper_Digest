31", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（MDPI）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "露天掘り鉱山の発破振動を受ける煉瓦-コンクリート造建物の固有振動数と減衰比を、複数領域の同定結果をクラスタリングで融合する手法（MDCCF）で同定し、確率分布とブートストラップの信頼区間で不確実性まで示した。", "p2": "発破振動下の建物の固有振動数と減衰比は安定性解析の前提だが、単一のモード同定法では誤差が大きく、不確実性を扱えなかった（抄録）。", "p3": "複数領域（時間・周波数など）での協調同定と、候補パラメータのクラスタリング融合（MDCCF）を提案し、数値シミュレーションで妥当性を確かめた上で、露天掘り鉱山の深孔発破下で振動監視と候補の固有振動数・減衰比の同定を行い、同定値の確率分布を分析する（抄録）。直観：複数の方法の答えを「票の集まり」として眺め、まとまった値だけを採用する。", "p4": "共分散駆動の確率部分空間同定（SSI-cov）＋K-means、ピークピッキング（PP）＋K-meansと比べ、理論値への近さで評価する。同定値の分布形を調べ、ブートストラップで95%信頼区間を出す（抄録）。", "p5": "MDCCFは比較手法より高精度で理論値に近い。深孔発破下の候補固有振動数は7.69、10.559、17.2068、22.095、27.099、29.7741、34.668、40.039、48.7882、50.6476 Hzの10個、対応する減衰比は4.4602%、3.705%、2.8618%、2.4161%、1.9%、1.45%、1.11%、0.8579%、0.59%、0.3493%。固有振動数は正規分布、減衰比はガンマ分布に強く従い、95%信頼区間を得た（抄録）。", "p6": "抄録には限界の記載がない。解釈：発破は非定常で衝撃的な励振であり、常時微動を前提とする同定法との比較の公平性は本文で確認が要る。「理論値」の出所（FEMか）も未確認。有効数字の桁数が多く示されているが、信頼区間の幅は抄録にない。", "fun": "鉱山の発破で揺れる建物が、どの速さで揺れやすく（固有振動数）、どれだけ早く揺れが収まるか（減衰比）を知りたい。ところが測り方によって答えがばらつく。この研究は複数の測り方の答えをまとめてクラスタ化し、集まった値を本当の値とみなした上で、「固有振動数は正規分布、減衰比はガンマ分布でばらつく」という分布の形まで突き止めた。測定値を1つの数でなく分布で扱う姿勢が特徴である。", "unverified": "本文を入手できず、信頼区間の幅、計測点数、発破回数、比較手法との誤差の数値は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "低価格超音波計でIRIを認証機並みに計測", "title": "Validation of a Low-Cost Multisensor Ultrasonic Road Roughness Measurement System for International Roughness Index Assessment", "url": "https://doi.org/10.59261/jequi.v8i5.477", "authors": "Eko Wahyu Utomo", "venue": "Equivalent Jurnal Ilmiah Sosial Teknik", "date": "2026-10-25", "apa": "Utomo, E. W. (2026). Validation of a Low-Cost Multisensor Ultrasonic Road Roughness Measurement System for International Roughness Index Assessment. Equivalent: Jurnal Ilmiah Sosial Teknik, 8(5), 1978–1992. https://doi.org/10.59261/jequi.v8i5.477", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社サイトのPDF本文（抄録、方法、結果と考察、限界、結論と表1・2の記述）を読んだ。表3・4の詳細とBland–Altman図は読んでいない", "preprint": false, "p1": "超音波距離計・加速度計・GPSを車両に載せた低価格の路面凹凸計測器（USR）で算出した国際ラフネス指数（IRI）が、認証された基準計測と5つの道路区間でほぼ一致することを示し、同時にその証拠の限界（15組の小標本、単一車両、反復なし）を明示した。", "p2": "IRIは道路維持の優先順位づけの主要指標だが、認証された慣性プロファイラは多くの道路当局、特に途上国では費用面で手が届かない。低価格の代替計測が認証機器とどれだけ一致するかを、方法比較の設計で検証する必要があった（抄録、§Method）。", "p3": "USRは超音波センサで車輪経路の路面までの鉛直距離を非接触で測り、加速度計で車両運動の同期と動的文脈を、GPSで位置と独立な速度を得る。約30〜40 km/hで走行しながら、センサ取得→超音波・慣性・GPS記録の同期→残した表面プロファイルから100 m区間ごとのIRIへ変換→基準IRIとの1対1対応→統計的方法比較、の5段階で検証する（§Method）。センサ単体では超音波距離の相対誤差が14系列1,400観測で約−2.10%〜+4.84%、GPS速度とスピードメータの相関99.80%などを事前特性として報告するが、これらは系統の妥当性の証拠には使わない（§Method）。直観：高価なプロファイラの代わりに、安価なセンサ3つを組み合わせて同じ指標を出せるかを「同じ道で測り比べる」。", "p4": "5つの300 m区間を3つの100 m区間に分けた15組の対応観測で、SP2〜SP4はGAPMAN歩行型プロファイロメータ、SRG1・SRG2は車載IRI計測システムを基準とする。Pearson相関、線形回帰、絶対・二乗誤差指標、Bland–Altmanの一致限界で評価する（抄録、§Method）。良いとする基準は、回帰の傾きが1・切片が0に近く、バイアスと一致限界が小さいこと。", "p5": "USRのIRIは2.79〜7.54 m/km、基準は2.88〜7.50 m/kmで、対の絶対差は0.01〜0.24 m/km、絶対百分率誤差は0.35%〜4.89%（表1）。全体ではPearson r=0.9973、R²=0.9946、MAE=0.112 m/km、RMSE=0.133 m/km、MAPE=2.45%、平均バイアス+0.043 m/km（基準平均4.835 m/kmに対し）、回帰式 USR IRI=1.017×基準IRI−0.038、Bland–Altman一致限界−0.212〜+0.298 m/km（抄録、表2、§Discussion）。最大誤差の2区間（SP3 0–100、SP4 200–300）はIRIが高いSP2〜SP4群に属し、低IRIのSRG群は絶対誤差は小さいが百分率誤差は大きめ（表1の説明）。元の計算文書にあった標準偏差19.16075は観測範囲と矛盾する入力誤りとして除外した（表2の説明）。", "p6": "著者は、標本が15組・5区間と小さく、単一車両・約30〜40 km/hで反復走行がなく再現性（変動係数や級内相関）を評価できないこと、舗装種別・天候・勾配を評価していないこと、機器と区間の対応が以前の記述と食い違い原記録で再確認が要ること、区間の座標や舗装特性の記録がなく再現性が限られること、回帰補正を同じデータで当てはめて評価していることを明示する（§Limitations）。解釈：著者自身が「認証プロファイラとの互換性は主張できず、選別用途に限る」と繰り返し述べており、一致の数値の良さと証拠の弱さが同居する論文である。", "fun": "道路のでこぼこ度（IRI）を測る正式な機械は高価で、途上国の多くの自治体は買えない。この研究は超音波距離計・加速度計・GPSという安価な部品で作った装置を車に積み、正式な機械と同じ道で測り比べたところ、相関0.997と驚くほど一致した。ただし著者は「試したのは5区間だけ、車1台、1回ずつ」と弱点を正直に列挙し、「本番で使う前にもっと検証が要る」と結論している。良い結果を出しながら自分で歯止めをかける姿勢が印象的である。", "unverified": "表3（部分群ごとの誤差）と表4（限界と対応する将来の設計）の内容、Bland–Altman図、IRI算出アルゴリズムの詳細は読んでいない。"}}, {"id": "jr07", "rank": 7, "headline": "地すべりと渓流の連成が土石流への遷移を支配", "title": "Landslide‐Channel Coupling Controls Asymmetric Flash Flood—Debris Flow Transitions: Insights From an Extreme Rainfall‐Induced Hazard Chain in Yuzhong of China in 2025", "url": "https://doi.org/10.1029/2026gl124036", "authors": "Guan Chen ほか", "venue": "Geophysical Research Letters", "date": "2026-10-26", "sjr": 1.949, "citescore": 8.1, "citescore_year": "2025", "apa": "Chen, G., Chong, Y., Zhu, X., Liu, Z., Yan, Y., Li, Y., Jin, J., Zhao, Y., Zhang, Y., Zeng, R., Guo, F., Yue, D., & Meng, X. (2026). Landslide‐Channel Coupling Controls Asymmetric Flash Flood—Debris Flow Transitions: Insights From an Extreme Rainfall‐Induced Hazard Chain in Yuzhong of China in 2025. Geophysical Research Letters, 53(20). https://doi.org/10.1029/2026gl124036", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Wiley）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "2025年に中国北西部の楡中で起きた地すべり-鉄砲水-土石流のハザードチェーンを、衛星データ・地震記録・数値モデルで再構成し、地すべりと渓流の連成が土石流への遷移を非対称に支配することを示した。", "p2": "極端な降雨が引き起こす地すべり-鉄砲水-土石流の連鎖（LFFDF）は世界的に損失を増やしているが、個々の災害の力学は分かっていても、地すべりと渓流の応答が連成した遷移の機構は未解明だった（抄録）。", "p3": "衛星データと地震記録で事象の時系列を復元し、数値モデルで遷移の動態を再現する。渓流の流れのせん断応力をShields応力（底面せん断応力と粒子の重さの比）で評価する（抄録）。直観：地すべりが渓流に土砂を注ぐと流れが急に「重く濃く」なり、ただの洪水が土石流に変わる。", "p4": "抄録の範囲では、遷移の各段階の制御因子（地すべり由来の土砂量、Shields応力、渓流堆積物の厚さと飽和状態）を特定することが評価の中心で、定量的な検証指標は示されていない。", "p5": "連鎖は状態依存の非対称な遷移過程として働く。降雨で誘発された地すべりが移動土砂の3分の1を供給し、鉄砲水との相互作用で渓流の流れのShields応力を1桁以上増やして、源頭部の渓流で土石流を早期に発生させた。下流での土石流から鉄砲水への逆戻りは主に渓流堆積物の厚さと飽和状態で制御される（抄録）。", "p6": "抄録には限界の記載がない。解釈：単一事例の再構成であり、提案する「連鎖に基づくリスク評価のパラダイム」の一般性は他事例で検証が要る。数値モデルの種類と較正の方法は未確認。", "fun": "大雨のとき、崖崩れ・鉄砲水・土石流は別々の災害ではなく、連鎖して起きる。この研究は2025年の中国の事例で、崖崩れが流れに土砂を注いだ瞬間に川底を削る力が10倍以上に跳ね上がり、上流で早くも土石流に変わった一方、下流では川底の泥の厚さと水の含み具合で土石流が洪水に戻ることを突き止めた。「行き」と「帰り」で変わる理由が違うという非対称性が面白い。", "unverified": "本文を入手できず、数値モデルの種類、地震記録の解析法、移動土砂量の値は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "サービスロボットの先回り行動がもてなし体験を高める", "title": "When robots take the initiative: how robotic service proactivity shapes customer experience of hospitableness", "url": "https://doi.org/10.1108/ijchm-12-2025-1756", "authors": "Canmian Liu ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-10-26", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Liu, C., Zhu, T., Xie, L., & Liu, X. (2026). When robots take the initiative: how robotic service proactivity shapes customer experience of hospitableness. International Journal of Contemporary Hospitality Management, 1–20. https://doi.org/10.1108/ijchm-12-2025-1756", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Emerald）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "サービスロボットが「先回り」して行動するほど顧客のもてなし体験（hospitableness）が高まること、その機序が自動化された社会的存在感であること、人型の外見でその効果が増幅されることを、3つの実験と現場調査で示した。", "p2": "サービスロボットの研究は静的な設計（外見）に偏り、動的な行動が顧客体験にどう効くかが未解明だった。社会的反応理論に基づき、ロボットの先回り行動がもてなし体験を育てるか、どのように、いつ育てるかを問う（抄録）。", "p3": "3つのシナリオ実験と1つの現場検証調査からなる複数研究設計で、ロボットの先回り行動（独立変数）、自動化された社会的存在感（媒介）、人型の外見（調整）がもてなし体験に与える効果を検定する（抄録）。直観：ロボットが「気づいて先に動く」と客はそこに社会的な相手を感じ、もてなされたと感じる。", "p4": "良いとする基準は、先回り行動の主効果、社会的存在感による媒介、人型外見による調整が実験と現場調査の両方で支持されること（抄録）。", "p5": "ロボットの先回り行動が高いほど顧客はもてなし体験を強く報告した。自動化された社会的存在感がこの効果を説明し、ロボットがより人間らしい外見を持つときに効果が増幅された（抄録）。", "p6": "抄録に限界の記載はない。解釈：効果量や標本数は示されておらず、シナリオ実験は想像上の場面に基づくため、現場調査1本との整合がどの程度かは本文で確認が要る。形と行動の一貫性（人型なら先回り）という示唆は、人型でないロボットでは効果が小さいことの裏返しでもある。", "fun": "ホテルやレストランのロボットは、頼まれる前に動く方が「もてなされた」と感じてもらえるのか。実験では、先回りするロボットほど客は温かさを感じ、それは客がロボットに「相手」を感じるからだった。さらに見た目が人に近いほど効果が強く、人間らしい姿で機械的に待つだけのロボットはもったいない、という設計の指針になる。", "unverified": "本文を入手できず、標本数、効果量、現場調査の業種は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "宗教的信念が失敗後の顧客の無礼を強める", "title": "Belief, forgiveness and karma: unpacking customer incivility following service failures", "url": "https://doi.org/10.1108/jsm-08-2025-0544", "authors": "Himanshu Shekhar Srivastava ほか", "venue": "Journal of Services Marketing", "date": "2026-10-26", "citescore": 9.4, "citescore_year": "2025", "apa": "Srivastava, H. S., Singh, G., & Prashar, S. (2026). Belief, forgiveness and karma: unpacking customer incivility following service failures. Journal of Services Marketing, 1–17. https://doi.org/10.1108/jsm-08-2025-0544", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Emerald）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "サービス失敗の後に顧客が従業員に無礼な振る舞いをする意図が、宗教的信念の強さと結びつき、その経路が状況的な対人的許しの低さであること、カルマへの信念がその関係を弱めることを3研究で示した。", "p2": "サービス失敗後の顧客の無礼さについて、宗教的信念がどう関わるかは明らかでなかった。宗教は一般に向社会的とされるが、失敗場面では別の経路が働きうる（抄録）。", "p3": "研究1（n=202）はレストラン、研究2（n=279）はホテルのシナリオで、宗教的信念→状況的対人的許しの低下→無礼意図の間接関連と、カルマ信念による調整を検証。研究3（n=297）はProlificの実験でカルマに関わる行為-結果の考慮を顕在化させる。媒介と調整媒介はPROCESSの5,000回ブートストラップで検定（抄録）。直観：「自分は正しい」という信念が強いほど失敗した相手を許しにくく、「悪いことをすれば返ってくる」と思う人はそれを抑える。", "p4": "良いとする基準は、3研究にわたる間接関連の一貫性と、研究2・3で調整効果が再現されること（抄録）。", "p5": "3研究を通じて、強い宗教的信念は状況的対人的許しの低さを介して無礼意図と関連した。研究2ではカルマ信念の強い顧客でこの間接関連が弱く、研究3ではカルマの考慮を状況的に顕在化させると弱まった（抄録）。実務的には、失敗後に全顧客に向けて敬意ある行動の基準を公然と示すことがサービス回復を補完するが、顧客の信念に訴えたり正当な苦情を制限したりすべきでないとする。", "p6": "抄録に限界の記載はない。解釈：シナリオに基づく意図の測定で実際の行動ではなく、宗教的信念の文化的文脈（宗派や国）が示されていない。効果の大きさも未確認。", "fun": "信心深い人ほど優しいと思いきや、レストランやホテルでひどい対応を受けたとき、信心の強い人の方が店員に無礼な態度を取りたくなる、という意外な結果が3つの研究で出た。理由は「その場で相手を許す気持ち」が弱まるからで、一方「悪いことをすれば自分に返ってくる」というカルマの考えを思い出させると、その傾向は弱まった。信念の種類によって、怒りの出方が変わる。", "unverified": "本文を入手できず、効果量、参加者の属性、尺度の信頼性は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "生成AIの算法管理が配車運転手の継続意向を左右", "title": "GenAI-enabled algorithmic control and gig workers' continuance work intention: evidence from ride-hailing drivers", "url": "https://doi.org/10.1108/intr-10-2025-1741", "authors": "Peng Wang ほか", "venue": "Internet Research", "date": "2026-10-26", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Wang, P., Jiang, C., Dong, X., Gao, T., & Zhang, L. (2026). GenAI-enabled algorithmic control and gig workers’ continuance work intention: evidence from ride-hailing drivers. Internet Research, 1–20. https://doi.org/10.1108/intr-10-2025-1741", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Emerald）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "配車サービスの運転手が感じる生成AIによるアルゴリズム管理が、チャレンジ・ストレスとヒンドランス・ストレスの両方を引き起こし、前者が継続意向を、後者が離脱意向を高めるという「諸刃の剣」の機序を、514人の調査で示した。", "p2": "生成AIを組み込んだアルゴリズム管理がギグワーカーの継続意向にどう影響するか、その機序は未解明だった。ストレスの認知的評価理論と自己決定理論に基づき、標準化された指導・行動制約・追跡評価という管理の形態ごとに検討する（抄録）。", "p3": "中国の配車運転手514人のオンライン調査を構造方程式モデルで分析し、チャレンジ・ストレスとヒンドランス・ストレスの媒介と家族動機の調整を検定する（抄録）。直観：同じAI管理でも「挑戦」と感じれば続け、「妨げ」と感じれば辞めたくなる。", "p4": "良いとする基準は、管理形態ごとに2種類のストレスへの経路が異なること、ストレスが継続・離脱意向に異なる効果を持つこと、家族動機の調整が支持されること（抄録）。", "p5": "生成AIによる標準化された指導と行動制約はチャレンジとヒンドランスの両方のストレスを生み、追跡評価はヒンドランス・ストレスだけを生んだ。ヒンドランス・ストレスは離脱意向を高めるが継続意向には有意な効果がなく、チャレンジ・ストレスは継続意向を高めるが離脱意向には効かない。家族動機は両ストレスの継続意向への効果を正に調整した（抄録）。", "p6": "抄録に限界の記載はない。解釈：横断の自己報告調査で因果の向きは確定せず、「生成AIによる」管理の操作化（従来のアルゴリズム管理との違い）は本文で確認が要る。プラットフォームへの実務提言（標準化と人間化の均衡）は結果の解釈に基づく。", "fun": "配車アプリの運転手は、AIに指示され、行動を制限され、評価される。この調査で分かったのは、指示や制限は「大変だけど張り合いがある」と「邪魔だ」の両方を生むのに、監視して点数をつけることだけは純粋に「邪魔」としか感じられないことだった。張り合いは続ける力に、邪魔は辞める力になる。家族を養う動機が強い人は、どちらのストレスも仕事を続ける方向に変えていた。", "unverified": "本文を入手できず、係数の大きさ、尺度、モデル適合度は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "AIの反対意見推薦が熟議の満足を高める", "title": "Enhancing Online Deliberation Through AI-Driven Counter-Attitudinal Interventions: Direct and Indirect Effects on Users’ Perceptions and Behavior", "url": "https://doi.org/10.1177/0261927x261500682", "authors": "Jana Leonie Peters ほか", "venue": "Journal of Language and Social Psychology", "date": "2026-10-26", "sjr": 0.814, "citescore": 4.7, "citescore_year": "2025", "apa": "Peters, J. L., Ziegele, M., & Weinmann, C. (2026). Enhancing Online Deliberation Through AI-Driven Counter-Attitudinal Interventions: Direct and Indirect Effects on Users’ Perceptions and Behavior. Journal of Language and Social Psychology. https://doi.org/10.1177/0261927x261500682", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイト（SAGE）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "反対意見のコメントを推薦するAI（AI-CAR）が、10日間のオンライン市民会議で参加者の「視点の平等」の知覚を高め、それを通じて内的熟議と議論の満足を高めることを、827人の無作為化3波データで示した。ただし無礼な発言は減らなかった。", "p2": "オンライン熟議で異なる意見の可視性を再構成することが、主観的な熟議体験を高め無礼を減らすかは検証されていなかった（抄録）。", "p3": "ドイツで2つの政治的争点のいずれかを非同期に議論する10日間の模擬デジタル市民会議に827人が参加し、反対意見のAI推薦・無作為に選んだ推薦・推薦なしの3条件に無作為に割り当てる。3波のデータで、第2波の視点の平等の知覚が第3波の内的熟議と満足に与える効果を第2波の水準を統制して推定し、モデルに基づく間接効果を検定する（抄録）。直観：自分と違う意見を目につく場所に置くだけで、会議が「公平だ」と感じられ、考えが深まる。", "p4": "良いとする基準は、AI推薦条件で視点の平等の知覚が高まること、間接効果が統計的に有意で、無作為推薦では有意でないこと、無礼さの減少（抄録）。", "p5": "AI-CARへの割り当ては視点の平等の知覚を高めた。第2波の高い平等知覚は第3波の内的熟議と議論満足の高さと関連し、対応する間接効果は有意だったが、無作為推薦では有意でなかった。AI-CARは参加者の投稿の無礼さを減らさなかった（抄録）。", "p6": "抄録に限界の記載はない。解釈：効果量は示されておらず、無礼さの測定法も未確認。模擬の市民会議であり実際の政策過程ではない。無礼さに効かなかったことは、可視性の操作だけでは規範的な行動変容に至らないことを示す。", "fun": "ネット上の議論は、自分と同じ意見ばかり目に入って凝り固まりがちである。この実験は、AIがあえて反対意見のコメントを上に表示する仕組みを10日間の市民会議で試した。すると参加者は「いろいろな意見が平等に扱われている」と感じ、その分だけ自分でよく考え、議論に満足した。ただし乱暴な言葉は減らなかった。公平感は作れても礼儀までは作れない、という結果である。", "unverified": "本文を入手できず、効果量、無礼さの測定法、争点の内容は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "取締役会の統治力が財務困窮の早期警戒を改善", "title": "An Explainable Early-Warning System for Financial Distress: Board Governance Capacity as a Predictive Signal", "url": "https://doi.org/10.65069/jessd31202729", "authors": "Abdullah Kürşat Merter", "venue": "Journal of Expert Systems and Sustainable Development", "date": "2026-10-26", "apa": "Merter, A. K. (2026). An Explainable Early-Warning System for Financial Distress: Board Governance Capacity as a Predictive Signal. Journal of Expert Systems and Sustainable Development, 1–20. https://doi.org/10.65069/jessd31202729", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社サイトのPDF本文（§3.1 データ、§3.2 困窮の定義、§3.5〜3.6 モデルと検証、§4.2 予測性能、§4.5 時系列外検証、§4.6 変数重要度、§5.4 限界、§6 結論、表1の説明）を読んだ。§3.3〜3.4、§4.1、§4.3〜4.4、§5.1〜5.3は読んでいない", "preprint": false, "p1": "高インフレで会計比率の情報が劣化する状況でも、公開情報から作る取締役会の統治能力指標（BGCI）を加えると、6種の機械学習モデルすべてで財務困窮の早期警戒力が上がり、時系列外でも効果が持続することをトルコ上場企業で示した。", "p2": "高インフレ下では会計比率の情報品質が急落し、意思決定者はインフレ雑音に影響されない非金銭的な警戒信号を必要とする。先行研究の機械学習による困窮予測は財務比率中心で、統治のような非財務信号の寄与は十分に検証されていなかった（抄録、§2.2〜2.3）。", "p3": "ボルサ・イスタンブール上場の非金融企業の年次パネルで、企業統治報告と財務注記から手作業で収集した取締役会構成と外部監査の記録を、Finnetの標準化財務データと結合し、予測変数2014〜2022年→結果2015〜2023年の1年ラグ構造にする（§3.1）。困窮は「限定または不適正の監査意見、または負の簿価純資産」で定義し、99企業年（6.0%）が該当（§3.2）。BGCIは取締役会の規模、独立性、女性比率、外国人比率、外部監査の質の5次元を等重みで合成する形成的指標（抄録）。ロジスティック回帰、ElasticNet、Random Forest、XGBoost、LightGBM、CatBoostの6モデルを、企業でグループ化した5分割交差検証（線形10回、木5回）、等調回帰による確率較正、2,000回の企業クラスタブートストラップ、拡張窓の時系列外検証、TreeSHAPで評価する（§3.5〜3.7）。直観：数字が信用できないときほど、「誰が見張っているか」が将来の破綻を予告する。", "p4": "良いとする基準は、財務比率のみのモデルに対するAUC・AUPRC・Brier・対数損失の改善、Youden閾値での再現率・特異度・F1、ブートストラップの95%区間、時系列外検証での持続、SHAP重要度（§3.6〜3.7）。素朴な基準（全観測に6.0%）のBrier 0.0558と対数損失0.225を下限とする。", "p5": "BGCIの追加で全6モデルのAUCが上がり、改善幅はLightGBMの0.027からElasticNetの0.071。ロジスティック回帰では0.644→0.711（+0.067）、AUPRC 0.157→0.177、較正Brier 0.082→0.054、対数損失0.251→0.212。Youden閾値で困窮事象の58.6%を検出し、感度76.5%、F1 0.224（§4.2）。線形2モデル（0.711、0.702）が木系4モデル（0.630〜0.640）を上回り、99事象の小標本では低分散の線形指定が単調な統治信号を安定に捉えると解釈する。時系列外（2019〜2023年）ではAUCが0.671→0.719（+0.048）、2023年は0.583→0.678と最大の改善（§4.5）。SHAPではBGCIが9予測変数中1位（平均絶対Shapley値0.696）、次いで流動比率0.619、ROA 0.535、現金比率0.408（§4.6）。", "p6": "著者は、単一市場（トルコ）であり他の高インフレ国での再現が必要なこと、事象が少なく初回遷移の分析（37事象）や年別検証（2019年18件、2023年10件）の検出力が不足すること、結果ラベルが監査人の報告選択を反映し監査の質の要素が監査人のリスク顧客選別を間接的に含む可能性があること、BGCIが等重みで年次更新にとどまることを限界に挙げる（§5.4）。解釈：Youden閾値でのF1 0.224は、警戒システムとしての誤警報の多さを示す。", "fun": "物価が年に何十%も上がる国では、会社の決算の数字は意味を失い、「この会社は危ない」という予測が効かなくなる。この研究は、取締役が何人いて、社外の人や女性や外国人がどれだけいて、どの監査法人が見ているかという、お金の単位に依存しない情報を足すだけで、破綻の予測がどのモデルでも良くなることを示した。しかも複雑なAIより単純な回帰の方が良く、数字が信用できない時こそ「見張りの体制」が物を言うという話である。", "unverified": "§4.1の記述統計、§4.3のブートストラップ区間の数値、§4.4の初回遷移分析、固定効果モデルの結果は読んでいない。"}}, {"id": "jr13", "rank": 13, "headline": "病院の医療機器投資を診療ラインで回収評価", "title": "A clinical service line investment recovery framework for medical equipment: method specification and a retrospective records-based feasibility application", "url": "https://doi.org/10.1017/s0266462326104358", "authors": "Takashi Shibuya ほか", "venue": "International Journal of Technology Assessment in Health Care", "date": "2026-10-26", "citescore": 4.1, "citescore_year": "2025", "apa": "Shibuya, T., & Kutsuna, N. (2026). A clinical service line investment recovery framework for medical equipment: method specification and a retrospective records-based feasibility application. International Journal of Technology Assessment in Health Care, 42(1). https://doi.org/10.1017/s0266462326104358", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（序論、方法、結果の遡及的適用、考察）を読んだ。結果の枠組み構成（指標の定義節）と補足資料は読んでいない", "preprint": false, "p1": "病院が購入・リースする医療機器について、診療サービスライン（CSL）を単位に、承認時の投資仮説（件数・収益・貢献利益・価値）を保存し、同じ定義で導入後に測り直して次の資本配分に戻す「投資回収の枠組み」（CSL-IRF）を仕様化し、日本の急性期病院の実記録で実行可能性を試した。", "p2": "機器の承認時には診療科が臨床的必要と予測活動を示し経営が費用を審査するが、導入後には承認時の仮定（症例数、収益、貢献利益、質、回収期間）が同じ単位で残っておらず、院内のHTA（医療技術評価）として「仮説をどう保存し検証し次の判断に返すか」が課題だった。診療科会計は粗すぎ、患者経路は画像・手術室・病棟をまたぐため、CSLという単位が適する（§Introduction）。", "p3": "問題の特定、設計要件を与える源領域（CSL管理、価値に基づく医療、HTA・病院HTA・ミニHTA・ライフサイクルHTA、証拠開発つき保険適用、管理会計と資本予算、時間駆動ABC、エージェンシー理論、組織学習、外部統計）の限定的なマッピング、指標・配分規則・証拠状態ラベル・価値ガードレール・ガバナンス契機の構築、内部論理検査の4段階で枠組みを作る（§Methods）。中核指標は年換算投資負担（AIB）と貢献利益（CM）で、損益分岐は a·m·ΔR ≥ A_min（aは収益増のうち機器に帰属する割合、mは貢献利益率、ΔRは観測された収益増、A_minは最小の文書化された年間負担）（§Results）。直観：買う前に「何件増えてどれだけ儲かるはず」と書いた紙を残し、1年後に同じ物差しで答え合わせをする。", "p4": "遡及的な実行可能性検証として、ある日本の急性期病院で3つの資産を選別し、資産台帳・リース記録・導入前後の手術統計が揃った4K関節鏡カメラヘッド1件に適用する。患者水準データは使わず、集計した固定資産・リース・レセプト記録を記述的に分析し、因果の帰属はしない（§Methods、§Results）。良いとする基準は、記録から承認時仮説と回収指標を再構成できるかどうか。", "p5": "72か月リースの総額はJPY 4,728,240、文書化された年間リース要素はJPY 788,040で、保守・更新・設置・研修の費用は特定できず、これを最小のAIBとした。肩関節鏡手術は導入前12か月の220件から導入後245件へ25件（11.4%）増、名目の手技料収益はJPY 102,782,400から114,863,400へJPY 12,081,000（11.8%）増、1件当たりは467,193から468,830円（+0.35%）。承認時の計画値、変動費、機器使用ログ、事前指定の質・アクセス指標は入手できず、実際のCMや回収指標、価値ゲートの状態は計算できなかった。文書化された年間負担は増加1件当たりJPY 31,522、収益増の6.52%（全額帰属の場合）に相当する（抄録、§Results、図2）。", "p6": "著者は、日常記録からリース・最小負担・活動は分かるが、承認時の投資仮説・変動費・実使用配分・価値ガードレールは再構成できず、透明な回収閾値とデータ欠落の地図は作れてもCMに基づく回収判断はできなかったと述べ、導入後評価は承認時から始めるべきだと結論する（§Discussion）。解釈：単一病院の1機器の記述的適用で、導入後期間には診療報酬改定が含まれ、増加を機器に帰属させていない。国際的な移転可能性は手順と最小データ構造にあり、日本の閾値ではないとする。", "fun": "病院が高価な機械を買うとき、「年に何件増えて元が取れる」という計算をしてから買うはずだが、数年後にその計算書は見当たらず、本当に元が取れたか誰も答えられない。この研究はその「答え合わせ」の型を作り、日本の病院の関節鏡カメラで実際に試した。すると件数と収益は1割ほど増えていたが、肝心の「いくらかかっていくら残ったか」を出すための記録が残っておらず、答え合わせはできなかった。記録を残す習慣そのものが評価の前提だという、地味だが重要な教訓である。", "unverified": "結果の「枠組みの構成」と「財務・価値ガバナンス指標」の節（CMR、IBCR、EPRなどの定義）、補足資料の計算例と日本の外部データ源は読んでいない。"}}, {"id": "jr14", "rank": 14, "headline": "孤独感が社会参加と高齢者の精神健康を仲介", "title": "Loneliness as a key pathway linking social involvement and mental health in older adults", "url": "https://doi.org/10.1093/eurpub/ckag169.153", "authors": "A Tivold ほか", "venue": "European Journal of Public Health", "date": "2026-10-26", "citescore": 4.8, "citescore_year": "2025", "apa": "Tivold, A., & Lipovac, D. (2026). Loneliness as a key pathway linking social involvement and mental health in older adults. European Journal of Public Health, 36(Supplement_5). https://doi.org/10.1093/eurpub/ckag169.153", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Oxford）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "欧州17か国とイスラエルの65歳以上13,517人の縦断データで、社会的関与が抑うつ症状と主観的well-beingに結びつく経路を孤独感が媒介することを示した。", "p2": "高齢化と社会構造の変化が後年の精神健康を形作るなか、社会的孤立と孤独感は健康の決定要因と認識されつつあるが、社会的関与が精神健康に結びつく機序は十分に理解されていなかった（抄録）。", "p3": "SHAREの第6・8・9波（40,551観測）で、抑うつ症状（EURO-D）と主観的well-being（CASP-12）を結果、社会的つながりと統合の合成指標を社会的関与とし、孤独感を媒介として頑健推定の構造方程式モデルで検定する。社会経済的地位、認知機能、機能的能力を調整する（抄録）。直観：人と関わることが心の健康に効くのは、主に「孤独でなくなる」ことを通じてである。", "p4": "良いとする基準は、社会的関与の総効果と、孤独感を介した間接効果の有意性・一貫性（抄録）。", "p5": "社会的関与が高いほど抑うつ症状が低く主観的well-beingが高い。孤独感はこれらの関連を、主観的well-beingでは完全に、抑うつ症状では部分的に媒介し、間接効果は一貫して約±0.02だった（抄録）。", "p6": "抄録に限界の記載はない。解釈：間接効果の標準化係数約0.02は統計的に一貫するが大きさは小さい。観察研究であり逆の因果（抑うつが関与を減らす）も残る。「孤独感に配慮した介入の統合」という結論は抄録の末尾で切れている。", "fun": "友人と会ったり地域活動に出たりする高齢者は心が健やかだが、それはなぜか。欧州の1万3千人を追った分析では、答えは「寂しくなくなるから」で、特に生活の充実感については、社会参加の効果のすべてが孤独感の軽減を通っていた。活動そのものより、活動がもたらす「ひとりではない」という感覚が効いている。", "unverified": "本文を入手できず、係数の大きさ、社会的関与指標の構成、欠測の扱いは未確認。"}}, {"id": "jr15", "rank": 15, "headline": "介護者の孤独は周囲の無理解が主因", "title": "Loneliness among informal caregivers: qualitative insights into factors of social disconnection", "url": "https://doi.org/10.1093/eurpub/ckag169.1939", "authors": "VERA Knapen ほか", "venue": "European Journal of Public Health", "date": "2026-10-26", "citescore": 4.8, "citescore_year": "2025", "apa": "Knapen, V., Willems, R., Knol, K., Becque, Y., Ten Brug, A., Witkamp, F., & Oenema, A. (2026). Loneliness among informal caregivers: qualitative insights into factors of social disconnection. European Journal of Public Health, 36(Supplement_5). https://doi.org/10.1093/eurpub/ckag169.1939", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Oxford）の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "家族介護者35人への2回の半構造化面接から、介護者の孤独が個人要因よりも、周囲の無理解や社会的・専門的な支援網からの排除といった外的要因で強まることを示した。", "p2": "家族介護者の孤独の有病率は一般より高いが、介護の役割がどのように孤独の経験を生むかは明らかでなかった（抄録）。", "p3": "2025年9月〜2026年4月に多様な背景の家族介護者35人が2回の半構造化面接を受け、介護役割、孤独、対処、スティグマの経験、支援ニーズを語る。帰納的・反省的な主題分析で分析する（抄録）。", "p4": "質的研究のため、良いとする基準は、語りから孤独を強める要因と和らげる要因が一貫して抽出されること（抄録）。", "p5": "孤独は介護経験に不可欠な側面として語られた。身近な人からの情緒的支援の欠如、介護の孤立した負担、生活の優先順位の変化による仲間からの断絶が孤独を強め、地域と専門的支援の両方から軽視され見えない存在として扱われる経験がそれをさらに強めた。一方、他の介護者との開かれた交流は孤独を和らげた（抄録）。", "p6": "抄録に限界の記載はない。解釈：国や介護の種類（認知症、障害など）は抄録に示されず、自己選択した参加者の語りに基づく。結論（多層的な介入の必要性）は抄録末尾で切れている。", "fun": "家族を介護している人の孤独は、「忙しくて友人と会えない」だけではなかった。面接で繰り返し語られたのは、周りの人や支援の専門家から「あなたの苦労は見えていない」と扱われる経験で、それが孤独をいっそう深めていた。逆に同じ立場の介護者と話すことは支えになった。孤独を本人の問題ではなく、社会の側の無理解の問題として描き直している。", "unverified": "本文を入手できず、参加者の属性、国、面接の長さ、テーマの詳細は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "用途と床面積の選択の依存は一方向だった", "title": "Rethinking the Discrete‐Continuous Choice Problem by Uncovering Asymmetry in High‐Resolution Urban Modeling", "url": "https://doi.org/10.1111/gean.70065", "authors": "Jiaxin Zhang ほか", "venue": "Geographical Analysis", "date": "2026-10-26", "sjr": 1.38, "citescore": 9.7, "citescore_year": "2025", "apa": "Zhang, J., & Miller, E. J. (2026). Rethinking the Discrete‐Continuous Choice Problem by Uncovering Asymmetry in High‐Resolution Urban Modeling. Geographical Analysis, 59(1). https://doi.org/10.1111/gean.70065", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Geographical Analysis掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "土地利用供給モデルで建物用途（離散）と床面積（連続）を同時に決める問題について、両者の双方向の依存を仮定せず推定できる区画単位の多段階計量経済モデルを作り、依存が一方向であることを見出した。", "p3": "2015〜2023年のトロント・ハミルトン広域圏の大規模データに、実際の用途地域規制を組み込んだ枠組みで、小売・事務所・工業・複合用途の開発者ごとの空間選好と部門間競争の異質性を推定する（抄録）。", "p5": "期待床面積は選択肢固有のパラメータで指定したときに限り用途選択に有意に効くが、逆方向（用途→床面積）は有意でなかった。この非対称は対象の部門・地域・期間に固有かもしれないが、双方向依存を既定で仮定すべきでなく、弱いときは逐次的な簡単な定式化で足りると示唆する（抄録）。", "fun": "都市のシミュレーションでは「どんな建物を建てるか」と「どれだけの広さにするか」を同時に決める必要があり、互いに影響し合うと考えられてきた。トロントの実データで確かめると、広さの見込みは用途の選択に効くのに、用途が広さに効く向きは見られなかった。互いに絡むはずの2つの決定が、実は片方向だったという発見である。", "unverified": "標本の区画数と推定値の大きさは抄録に記載なし。"}}, {"id": "jr17", "rank": 17, "headline": "米国Medicaid在宅介護制度をLLMで一覧化", "title": "State Design and Use of Medicaid 1915(c) Waivers and Related Benefits to Provide Home‐ and Community‐Based Services to Aging and Disabled Adults: The Medicaid HCBS Waiver Atlas", "url": "https://doi.org/10.1111/1475-6773.70176", "authors": "Katherine E. M. Miller ほか", "venue": "Health Services Research", "date": "2026-10-26", "sjr": 1.757, "citescore": 5.9, "citescore_year": "2025", "apa": "Miller, K. E. M., Kidu, T., Babu, V. R., Gowda, A. P., Hanna, V., Kim, C., & Thunell, J. (2026). State Design and Use of Medicaid 1915(c) Waivers and Related Benefits to Provide Home‐ and Community‐Based Services to Aging and Disabled Adults: The Medicaid HCBS Waiver Atlas. Health Services Research, 61(6). https://doi.org/10.1111/1475-6773.70176", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Health Services Research掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "米国のMedicaidによる在宅・地域サービス（HCBS）の州ごとの制度設計と手厚さを、2010〜2024年の制度文書から自動抽出して体系的に記録したデータセット「Medicaid HCBS Waiver Atlas」を作った。", "p3": "HTML解析、プレーンテキスト抽出、視覚ベースのOCR、大規模言語モデルを組み合わせた自動の抽出法を開発・検証し、政策疫学の枠組みにCurated Data Enterpriseの要素を加え、関係者の参画と検証・品質管理を組み込む。対象は1115実証事業145件と、18歳以上の機能・認知障害者向け1915(c)ウェイバー1,277件の文書（抄録）。", "p5": "1915(c)文書の93%、1115文書の100%からデータを抽出でき、メタデータと文書つきのデータセットを作成。1915(c)ウェイバーからは利用可能な全要素の普及状況を抽出・記述した（抄録。以降は切れている）。", "fun": "米国では高齢者や障害者が施設でなく自宅で暮らすための公的サービスが州ごとにばらばらで、どの州が何をしているかを比べる材料がなかった。この研究は何百もの制度文書を機械に読ませて一覧表にした。制度を比べられて初めて、どの設計が効くかを検証できるようになる。データを作ること自体が研究になる例である。", "unverified": "抄録が途中で切れており、主要な結果の内容は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "グリーン航空のサービス失敗と回復要求を話題分析", "title": "When Green Choices Encounter Service Failures: Barriers to Air Passengers’ Low-Carbon Participation and Service Recovery", "url": "https://doi.org/10.3390/systems14111357", "authors": "Dingyao Yu ほか", "venue": "Systems", "date": "2026-10-26", "citescore": 5.4, "citescore_year": "2025", "apa": "Yu, D., Cai, H., Li, H., Shi, C., Han, C., Tu, Z., Zheng, C., Xu, Y., & Tian, C. (2026). When Green Choices Encounter Service Failures: Barriers to Air Passengers’ Low-Carbon Participation and Service Recovery. Systems, 14(11), 1357. https://doi.org/10.3390/systems14111357", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Systems掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "中国の「グリーンフライト」サービスで、環境に配慮する意思があっても実際の参加を妨げるサービス失敗の類型と、乗客が求める回復を、苦情テキストから明らかにした。", "p3": "中国民用航空局のサービス品質監督プラットフォームに2021年1月〜2025年6月に寄せられた1,161件の乗客の苦情に、Word2Vecによる意味拡張と構造トピックモデルを適用し、サービスシステム理論の枠組みで失敗と回復要求を抽出する（抄録）。", "p5": "主な障壁は、サービス選択の制限、情報開示の不足、サービス規則と乗客の権利の不均衡、実行の欠陥、報酬の履行と対応の失敗。不規則運航時にグリーン選択を変更できない硬直した規則が最大の問題で、時間とともに変化する。回復要求は責任の引受けと規則改善、補償、説明と通知、迅速な処理、報酬履行、態度改善、内部統治の強化に及ぶ（抄録）。", "fun": "「環境のために機内食を減らしてマイルをもらう」ような取り組みは、やる気のある乗客でもつまずく。苦情を分析すると、一番の不満は遅延などで予定が変わったときに選択を変えられないことだった。善意で始めた仕組みが、融通の利かない規則のせいで善意をくじく。持続可能なサービスは気持ちだけでなく運用の作り込みで決まることを示している。", "unverified": "トピック数とモデルの設定は抄録に記載なし。"}}, {"id": "jr19", "rank": 19, "headline": "満足度が緑のサービス環境とeWOMをつなぐ", "title": "Customer Satisfaction as the Common Transmission Mechanism Linking Green Servicescape to eWOM and Revisit Intentions: Evidence from Eco-Friendly Coffee Shops", "url": "https://doi.org/10.3390/su182110816", "authors": "Jindarat Peemanee ほか", "venue": "Sustainability", "date": "2026-10-24", "citescore": 8.9, "citescore_year": "2025", "apa": "Peemanee, J., Namueangrak, W., & Shanmugam, V. (2026). Customer Satisfaction as the Common Transmission Mechanism Linking Green Servicescape to eWOM and Revisit Intentions: Evidence from Eco-Friendly Coffee Shops. Sustainability, 18(21), 10816. https://doi.org/10.3390/su182110816", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Sustainability掲載版の抄録（OpenAlex経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "環境配慮型のカフェの店舗環境（グリーン・サービススケープ）が、電子口コミ意図と再訪意図のどちらにも主に顧客満足を通じて効くことを示し、2つの結果で媒介の強さが違わないことを検定した。", "p3": "刺激-生体-反応の枠組みで、店舗環境を刺激、満足を生体反応、eWOM意図と再訪意図を行動反応とし、タイ東北部の環境配慮型カフェの顧客413人の共分散構造SEMで、ブートストラップによる間接効果と2つの間接効果の正式な対比を行う（抄録）。", "p5": "満足が環境と各結果の関連の大半を担い、直接の関連は弱いか存在しない。媒介の役割が結果間で異なる証拠はなかったが、小さな差は排除できない。この市場ではeWOMのシグナリング説の説明力が限定的で、満足が設計を行動につなぐ主要な経路（抄録）。", "fun": "緑の多いおしゃれなカフェに来た客は、SNSで宣伝したくなるのか、また来たくなるのか。どちらも「満足したから」という一本の道を通っていて、店の見た目が直接SNSの投稿を生むわけではなかった。環境に優しい設計への投資は、客を満足させて初めて口コミにも再訪にも効くという、順序を確かめた研究である。", "unverified": "係数の大きさは抄録に記載なし。"}}, {"id": "jr20", "rank": 20, "headline": "濃い色の寝具が快適感と支払意思を高める", "title": "Color lightness as a sensory marketing cue: implications for guest decision-making", "url": "https://doi.org/10.1108/ijchm-04-2026-0592", "authors": "Yingying Dong ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-10-26", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Dong, Y., Fan, A., & So, K. K. F. (2026). Color lightness as a sensory marketing cue: implications for guest decision-making. International Journal of Contemporary Hospitality Management, 1–18. https://doi.org/10.1108/ijchm-04-2026-0592", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "International Journal of Contemporary Hospitality Management掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ホテルの寝具の色の明度が快適感・ブランドイメージ・支払意思に与える影響を実験で調べ、製造物の先行研究とは逆に、暗い色の寝具が快適感と支払意思を高めることを示した。", "p3": "アクセシビリティ-診断性理論に基づき、1つの予備テストと2つの実験で、寝具の色の明度が知覚された快適性・ブランドイメージ・支払意思に及ぼす効果と、その機序を検証する（抄録）。", "p5": "明るい色に比べ、暗い色の寝具は知覚された快適性、ブランドイメージ、支払意思を有意に高めた。ブランドイメージと快適性が色の明度と支払意思の関係を直列に媒介した（抄録）。", "fun": "工業製品では明るい色ほど「柔らかそう」と感じられるとされてきた。ところがホテルのベッドでは逆で、暗い色の寝具の方が心地よく高級に見え、客は高い料金を払ってもよいと答えた。同じ色でも、物として見るか体験として見るかで印象が反転するという意外な発見である。", "unverified": "参加者数と効果量は抄録に記載なし。"}}, {"id": "jr21", "rank": 21, "headline": "救急隊員の仕事の能力集合と職務資源の関係", "title": "Emergency medical services personnel’s work capability sets: associations with job demands, job resources, and flourishing at work", "url": "https://doi.org/10.3389/fpsyg.2026.1909957", "authors": "Hazel Michellé Hattingh ほか", "venue": "Frontiers in Psychology", "date": "2026-10-26", "citescore": 7.0, "citescore_year": "2025", "apa": "Hattingh, H. M., Barnard, N. B., & Coxen, L. (2026). Emergency medical services personnel’s work capability sets: associations with job demands, job resources, and flourishing at work. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1909957", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Frontiers in Psychology掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "南アフリカの救急医療サービス（EMS）職員197人で、仕事の「能力集合」（実現できる価値ある仕事の成果）が職務要求・職務資源・職場でのフラリッシング・負の感情とどう結びつくかを調べ、3つの能力集合の類型を見出した。", "p3": "横断調査で職務要求-資源質問紙、仕事の能力集合質問紙、フラリッシング短縮版を測り、相関、確認的因子分析、潜在クラス分析、Bolck-Croon-Hagenaars法で分析する（抄録）。", "p5": "知識技能の活用と開発、職場での有意義な関係づくりが最も強い能力で、良い収入、重要な決定への関与、価値あることへの貢献は最も弱い。潜在クラスは弱い能力集合（48%）、制約された集合（30%）、堅固な集合（22%）。情動的要求は能力とフラリッシングと負、負の感情と正に関連し、仕事の圧力は負の感情と正に関連した（抄録。以降は切れている）。", "fun": "救急隊員は命を扱う過酷な仕事をしながら、どんな場面で「自分は仕事で花開いている」と感じるのか。調査では、技能を使い伸ばせることや仲間との関係は実現できている一方、収入や意思決定への参加は実現できていない人が多く、半数近くは能力をほとんど発揮できない集団に入った。やりがいの中身を分解して測った研究である。", "unverified": "抄録が途中で切れており、職務資源の結果は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "算法管理下の従業員が求める安全装置", "title": "The Human Side of Algorithmic Management: Exploring How Employees Negotiate AI-Driven Performance Monitoring, Autonomy, Privacy, and Workplace Trust", "url": "https://doi.org/10.63544/jbii.v5i10.263", "authors": "Dr. Riffat Abbas Rizvi ほか", "venue": "Journal of Business Insight and Innovation", "date": "2026-10-25", "apa": "Rizvi, Dr. R. A., Syed, M. I., Shah, A. H., Mehnaz, S., & Ramzan, A. (2026). The Human Side of Algorithmic Management: Exploring How Employees Negotiate AI-Driven Performance Monitoring, Autonomy, Privacy, and Workplace Trust. Journal of Business Insight and Innovation, 5(10), 301–317. https://doi.org/10.63544/jbii.v5i10.263", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Business Insight and Innovation掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "パキスタンの職場でデジタルな業績監視とアルゴリズム支援の管理を受ける従業員22人への面接から、自律・プライバシー・公正・信頼をめぐる6つのテーマを抽出した探索的質的研究。", "p3": "多様な職種・業種の参加者22人への半構造化オンライン面接の要約を、反省的主題分析で分析する（抄録）。", "p5": "可視性の交渉、指標下の自律、プライバシーの境界、上司依存の公正、組織規則と職務責任、従業員の声と異議申立ての機会の6テーマ。参加者は調整や期待の明確化などの利点を認めつつ、文脈を考慮しない評価、行動への圧力、不明確なデータ慣行、評価に異議を唱える機会の乏しさを懸念した。支援的な上司と、頼れる組織的な安全装置（透明な再審査権限、訂正手続き、相談窓口）は区別すべきとする（抄録）。", "fun": "AIが従業員の働きぶりを点数化する職場で、働く人は何を求めているのか。面接で分かったのは、良い上司が説明してくれるだけでは足りず、「点数に異議を申し立てられる仕組み」が組織として用意されているかが決め手だということだった。人の善意に頼る公正さと、制度として保証された公正さの違いを見分けた研究である。", "unverified": "参加者の属性の内訳は抄録に記載なし。"}}, {"id": "jr23", "rank": 23, "headline": "ESGの見せかけは収益性で罰せられる", "title": "ESG Performance, Disclosure and Environmental Intensity: Implications for Profitability in Emerging Market Energy Companies", "url": "https://doi.org/10.1002/csr.71108", "authors": "Maria‐Encina Morales‐de‐Vega ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-26", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Morales‐de‐Vega, M.-E., Garcia‐Centeno, M.-C., & Gonzalez‐Perez, S. (2026). ESG Performance, Disclosure and Environmental Intensity: Implications for Profitability in Emerging Market Energy Companies. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71108", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Corporate Social Responsibility and Environmental Management掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "新興国のエネルギー企業で、ESGの実績は収益性を高め、環境負荷の強度は下げ、開示と実績の差（グリーンウォッシュ）は収益性で罰せられることを動学パネルで示した。", "p3": "アジア・欧州・中南米の上場エネルギー企業95社の2015〜2024年の不均衡パネルを動学パネルデータモデルで分析し、グリーンウォッシュをESG開示とESG実績の差として測る（抄録）。", "p5": "ESG実績は収益性と正、環境強度は負の関係。ESG実績の正の効果は大企業で強い。グリーンウォッシュは収益性と負に関連し、COVID-19とロシア・ウクライナ紛争の期間はその罰則が弱まった（抄録）。", "fun": "環境への取り組みを「言う」ことと「やる」ことがずれている会社は、市場からどう見られるのか。95社を10年追うと、言葉だけ先行した会社は利益が低く、危機の時期だけはその罰が緩んだ。投資家は普段は見せかけを見抜くが、非常時には目が届かなくなるのかもしれない。", "unverified": "係数の大きさと推定法（GMMの種類など）は抄録に記載なし。"}}, {"id": "jr24", "rank": 24, "headline": "現金保有の多い銀行ほど倒産距離が短い", "title": "The Effect of Cash Holding and Financial Regulation on Bankruptcy Risk: Evidence from Cross-Country Banking Industry", "url": "https://doi.org/10.14710/jdep.8.1.19-34", "authors": "Prasojo Prasojo ほか", "venue": "Jurnal Dinamika Ekonomi Pembangunan", "date": "2026-10-26", "apa": "Prasojo, P., Fitrijanti, T., & Afiah, N. N. (2025). The Effect of Cash Holding and Financial Regulation on Bankruptcy Risk: Evidence from Cross-Country Banking Industry. Jurnal Dinamika Ekonomi Pembangunan, 8(1), 19–34. https://doi.org/10.14710/jdep.8.1.19-34", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Jurnal Dinamika Ekonomi Pembangunan掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "32か国・10,562行・73,124銀行年の2012〜2018年パネルで、銀行の財務困窮（Zスコア）の決定要因を推定し、現金保有が多いほどZスコアが低いという結果を得た。", "p3": "固定効果推定で、自己資本比率（Tier-1/リスク加重資産）、資産の質（不良債権比率）、無形資産の比率、現金保有の代理変数がZスコアに与える影響を調べ、代替的な定式化で頑健性を確かめる（抄録）。", "p5": "高い自己資本と良い資産の質はZスコアを高める（困窮が少ない）。無形資産の比率は困窮と正の関係。現金保有の代理変数はZスコア式で負に効き、超過現金は資金の未活用や逆境下の予防的な抱え込みを反映し安定に結びつかないと解釈する（抄録）。", "fun": "銀行は現金をたくさん持っている方が安全そうに見える。ところが世界の1万行のデータでは、現金を多く抱える銀行ほど倒産までの距離を示す指標が悪かった。使い道がなくて貯め込んでいるか、危ないからこそ守りに入っているのかもしれない。安全の象徴が不安の印でもあるという逆説である。", "unverified": "係数の大きさと変数の定義は抄録に記載なし。"}}, {"id": "jr25", "rank": 25, "headline": "信用リスクのXAI研究は説明の質評価が1%台", "title": "Explainable Artificial Intelligence in Credit Risk: A Systematic Evidence Map for Regulated Credit Decisions", "url": "https://doi.org/10.3390/ijfs14110292", "authors": "Yifan Xie ほか", "venue": "International Journal of Financial Studies", "date": "2026-10-26", "citescore": 5.0, "citescore_year": "2025", "apa": "Xie, Y., Liu, Y., & Ning, H. (2026). Explainable Artificial Intelligence in Credit Risk: A Systematic Evidence Map for Regulated Credit Decisions. International Journal of Financial Studies, 14(11), 292. https://doi.org/10.3390/ijfs14110292", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "International Journal of Financial Studies掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "信用リスクにおける説明可能AIの研究を体系的に地図化し、SHAPへの集中と説明の質の評価の少なさを示し、課題別の検証課題を提案した。", "p3": "2017〜2026年のScopus検索で958件を得て、凍結した題名・抄録のコードブックで550件を中核の地図に割り当てる。対象を絞った全文確認も行い、課題-成果物-手法-検証（TAMV）の枠組みで説明の出力を不利益処分の理由、申請者の救済、モデル審査、文書化に結びつける（抄録）。", "p5": "中核の題名・抄録の39.1%にSHAPが現れる一方、厳密または広義の説明品質評価の信号は1.3〜1.5%のみ。全文確認では根拠のない信号と、メタデータでは拾えない評価実践の両方が見つかり、割合は全文の実態ではなく報告の可視性を表す。事前登録はなく、手法の比較順位ではなく再現可能な報告地図が貢献（抄録）。", "fun": "融資をAIが判断するなら「なぜ断られたか」を説明できなければならない。ところが説明手法の論文を550本集めると、4割が同じ手法（SHAP）を使う一方で、その説明が本当に役に立つかを評価した論文は100本に1本ほどしかなかった。説明する道具は普及したのに、説明の良し悪しを測る習慣が育っていないことを数で示した。", "unverified": "550件の年別・地域別の内訳は抄録に記載なし。"}}, {"id": "jr26", "rank": 26, "headline": "収益性と流動性が財務困窮を下げ負債が上げる", "title": "Financial Ratios and Financial Distress in Consumer Cyclicals Companies: Evidence from the COVID-19 and Economic Recovery Period", "url": "https://doi.org/10.70764/gdpu-fr.2026.2(1)-05", "authors": "Abimanyu Abimanyu ほか", "venue": "Fairness", "date": "2026-10-26", "apa": "Abimanyu, A., & Hidayati, L. N. (2026). Financial Ratios and Financial Distress in Consumer Cyclicals Companies: Evidence from the COVID-19 and Economic Recovery Period. Fairness, 2(1), 55–70. https://doi.org/10.70764/gdpu-fr.2026.2(1)-05", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Fairness掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "インドネシア証券取引所の消費者循環セクター企業の2020〜2022年で、収益性と流動性は財務困窮を減らし、負債比率は増やし、活動性比率は有意でないことを順序ロジスティック回帰で示した。", "p3": "監査済み年次財務諸表の二次データから収益性・流動性・レバレッジ・活動性の比率を取り、財務困窮を順序ロジスティック回帰（IBM SPSS）で分析する因果的・関連的な設計（抄録）。", "p5": "収益性と流動性は困窮に負、レバレッジは正、活動性は有意でない。決定係数は財務比率が困窮の変動の51%を同時に説明することを示す（抄録）。", "fun": "コロナ禍から回復期にかけて、どんな会社が苦しくなったのか。消費者向けの景気に敏感な業種では、儲かっていて手元資金のある会社は無事で、借金頼みの会社は危なかった。当たり前に聞こえるが、売上の回転の速さは関係なかったという点が、どの指標を見るべきかの手がかりになる。", "unverified": "標本企業数と各係数の値は抄録に記載なし。"}}, {"id": "jr27", "rank": 27, "headline": "複数エージェントの議論で小論文を特性別に採点", "title": "MATE: A Multi-Agent Trait Evaluation System for Automated Essay Scoring", "url": "https://doi.org/10.1007/s41019-026-00372-8", "authors": "Li Kong ほか", "venue": "Data Science and Engineering", "date": "2026-10-25", "sjr": 1.212, "citescore": 9.6, "citescore_year": "2025", "apa": "Kong, L., Zheng, Y., Chen, A., Zhang, B., & Zhou, J. (2026). MATE: A Multi-Agent Trait Evaluation System for Automated Essay Scoring. Data Science and Engineering. https://doi.org/10.1007/s41019-026-00372-8", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Data Science and Engineering掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "学習データなしで小論文を複数の特性（trait）ごとに採点するために、特性群ごとの専門エージェントと、対立を検出して議論を調停する調整エージェントからなる多エージェント採点システムMATEを提案した。", "p3": "採点基準の相関する特性をクラスタ化して次元別エージェントの役割を定め、各エージェントが根拠と点数を独立に出す。メタ認知調整エージェント（MCA）が反復的に対立を検出・議論させ、不一致を解消して最終点を統合する（抄録）。", "p5": "ASAP++データセットでMATEは強い基準を一貫して上回ったとされる（抄録。数値部分は切れている）。", "fun": "作文の採点は「論理」「語彙」「構成」など観点ごとに点をつけるが、観点どうしは絡み合っていて一貫した点をつけるのが難しい。この研究は観点ごとに担当のAIを置き、意見が食い違ったら司会役のAIが議論させて決着をつける。採点を「会議」にすることで、点の根拠も見えるようにした。", "unverified": "数値結果と比較手法は抄録が切れており未確認。"}}, {"id": "jr28", "rank": 28, "headline": "物理の仮説から計算・報告までをLLM群が実行", "title": "PhysAgent: A Multi-Agent Large Language Model Framework for Physics Data Analysis and Simulation", "url": "https://doi.org/10.1088/1674-1056/aeb900", "authors": "Xiao-Qi Han ほか", "venue": "Chinese Physics B", "date": "2026-10-26", "citescore": 3.0, "citescore_year": "2025", "apa": "Han, X.-Q., Gao, Z.-F., Guo, P.-J., & Lu, Z.-Y. (2026). PhysAgent: A Multi-Agent Large Language Model Framework for Physics Data Analysis and Simulation. Chinese Physics B. https://doi.org/10.1088/1674-1056/aeb900", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Chinese Physics B掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "仮説生成から計算モデリング、データ解析、報告までの物理研究の作業の流れを、役割分担したLLMエージェント群が人の確認を挟みながら実行する枠組みPhysAgentを示した。", "p3": "ソクラテス式の問いで科学的推論を導くMentor、コード実装やDFT計算を担うStudent、タスクの割当と資源配分を最適化するLeaderの3種のエージェントに、Quantum ESPRESSOやVASPなどの第一原理計算ツールを統合する（抄録）。", "p5": "概念実証として、軌道データからのケプラー則、力と運動のデータからのニュートン則の復元、GaAsのバンド構造と状態密度の計算の自動化、列車の窓を流れる雨粒のような現象の模擬を示した（抄録）。", "fun": "物理の研究は仮説を立て、計算し、データを見て、報告書を書くという長い工程で、分野が細かく分かれているため一人では回しにくい。この研究は、問いかけ役の先生AI、手を動かす学生AI、段取りをするリーダーAIに分けて工程を自動化した。惑星の軌道データからケプラーの法則を再発見させるという、科学史のやり直しのような実験が面白い。", "unverified": "再発見の精度や計算時間の数値は抄録に記載なし。"}}, {"id": "jr29", "rank": 29, "headline": "警察記録の脆弱性指標をLLMで推定する限界", "title": "Using fine-tuned LLMs to identify indicators of vulnerability in UK police incident logs", "url": "https://doi.org/10.1186/s40163-026-00304-x", "authors": "Sam Relins ほか", "venue": "Crime Science", "date": "2026-10-26", "sjr": 0.548, "citescore": 4.6, "citescore_year": "2025", "apa": "Relins, S., & Birks, D. (2026). Using fine-tuned LLMs to identify indicators of vulnerability in UK police incident logs. Crime Science, 15(1). https://doi.org/10.1186/s40163-026-00304-x", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crime Science掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "米国の公開警察データで開発したLLM分類パイプラインを英国警察の事案記録に適用し、精神疾患・薬物乱用・アルコール依存・ホームレスの4指標の出現率を推定できるが、人手と統計補正なしには妥当な測定にならないことを示した。", "p3": "英国のある警察の匿名化された約3,000件の事案記録に、反復推論・ラベル集約・構造化された人手レビュー・統計補正を組み合わせた多段階パイプラインを適用する。警察が使いそうな安全な計算環境を想定し、ローカルのオープンウェイトLLMで動かす（抄録）。", "p5": "精神疾患の指標は約5件に1件の事案に現れ、他の指標は低い。単回の分類は不安定で、集約した出力は人の判断に比べて指標を系統的に過剰に付与した。補正には多くの人手と統計調整が必要で、かなりの不確実性が残った（抄録）。", "fun": "警察の日常業務のどれくらいが、精神疾患や住まいのない人への対応なのか。記録の文章をAIに読ませれば数えられそうだが、やってみると同じ記録でも答えが毎回変わり、AIは人より多く「該当」と判定しがちだった。結局、人が確認して統計で補正しないと信頼できる数字にならない。AIの便利さと限界を正直に測った研究である。", "unverified": "他3指標の出現率の数値は抄録に記載なし。"}}, {"id": "jr30", "rank": 30, "headline": "機能・文脈価値だけがスマートシティ居住意向を動かす", "title": "How Consumer Values Shape Perception and Cognition in Smart City Development", "url": "https://doi.org/10.1061/jupddm.upeng-6489", "authors": "Jieh-Haur Chen ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-10-26", "citescore": 3.9, "citescore_year": "2025", "apa": "Chen, J.-H., Nguyen, H. P., Yu, T., & Chou, C.-J. (2027). How Consumer Values Shape Perception and Cognition in Smart City Development. Journal of Urban Planning and Development, 153(1). https://doi.org/10.1061/jupddm.upeng-6489", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Urban Planning and Development掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "台湾の6直轄市の住民450人の調査で、スマートシティのどの領域が重要と見なされ、消費者価値（機能・社会・感情・新奇・文脈）のどれが居住・推奨意向に結びつくかを構造方程式で明らかにした。", "p3": "5つのスマートシティ領域と5つの消費者価値のリッカート尺度を含む質問紙で450人の回答を集め、確認的因子分析、パスモデル、ブートストラップによる媒介分析で15の仮説を検定する（抄録）。", "p5": "スマート交通とスマートガバナンスが肯定的な認識を最も強く動かし、消費者価値のうち機能的価値と文脈的価値だけが、スマートシティに住みたい・勧めたいという意向に有意に効いた（抄録）。", "fun": "スマートシティに住みたいと思わせるのは「最先端でかっこいい」ことではなかった。台湾の住民が重視したのは、交通が便利になることと行政手続きが楽になることで、目新しさや感情的な魅力は居住意向を動かさなかった。技術の華やかさより、暮らしの役に立つかが問われている。", "unverified": "係数の大きさと適合度指標は抄録に記載なし。"}}, {"id": "jr31", "rank": 31, "headline": "地震・地すべり複合災害に対する道路網の脆弱性", "title": "Integrated Topological, Physical, and Functional Vulnerability of Road Networks to Compound Seismic-Landslide Hazards in the East African Rift", "url": "https://doi.org/10.1007/s13753-026-00779-x", "authors": "Yohannes Sisay Zeleke ほか", "venue": "International Journal of Disaster Risk Science", "date": "2026-10-26", "sjr": 1.225, "citescore": 8.4, "citescore_year": "2025", "apa": "Zeleke, Y. S., Scaini, C., Wubet, W. A., & Tira, M. (2026). Integrated Topological, Physical, and Functional Vulnerability of Road Networks to Compound Seismic-Landslide Hazards in the East African Rift. International Journal of Disaster Risk Science. https://doi.org/10.1007/s13753-026-00779-x", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "International Journal of Disaster Risk Science掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "エチオピア北東部の連邦道路網について、地震と地すべりの複合災害に対する位相的・物理的・機能的な脆弱性を統合して評価する3次元の枠組みを示した。", "p3": "グラフ理論（辺の媒介中心性と冗長性）、GIS（地震加速度の期待値と地すべり感受性区分）、多基準意思決定分析（道路等級・交通量・旅行時間）を組み合わせ、12人の専門家の階層分析法で指標の重みを決める（抄録）。", "p5": "災害強度の大域重みが最大（0.35）。総合脆弱性が同程度の区間でも3次元の寄与の組合せは大きく異なり、ネットワークの重要性は単一要因ではなく相互作用から生じる。Kombolcha–Bati区間の脆弱性指数が最大（0.694）で、幹線以外の主要なアクセス路も上位10区間に入った（抄録）。", "fun": "地震と地すべりが同時に起きると、道路網のどこが一番危ないのか。「壊れやすさ」「迂回路のなさ」「交通の重要さ」はそれぞれ別の地図になり、総合点が同じでも中身は違う。この研究は3枚の地図を重ねて、幹線道路でない道が実は要であることを見つけた。見落とされがちな生活道路の重要性が数字で出た。", "unverified": "対象区間数と各次元の重みは抄録に一部しか記載がない。"}}, {"id": "jr32", "rank": 32, "headline": "DQN充電制御とLSTMツインで電動バス電池を管理", "title": "An Intelligent Cyber–Physical Framework for Electric Bus Batteries: Combining DQN Smart Charging with LSTM Digital Twins", "url": "https://doi.org/10.3390/smartcities9110180", "authors": "Dragan Aleksendrić ほか", "venue": "Smart Cities", "date": "2026-10-26", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Aleksendrić, D., Vučinić, V., Seidel, L., & Sax, E. (2026). An Intelligent Cyber–Physical Framework for Electric Bus Batteries: Combining DQN Smart Charging with LSTM Digital Twins. Smart Cities, 9(11), 180. https://doi.org/10.3390/smartcities9110180", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Smart Cities掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "電動バスの電池を、深層Q学習による充電・回生制動の制御と、LSTMのデジタルツインによる電気熱力学の監視、SHAPで説明するモデル予測制御で統合管理するサイバーフィジカル枠組みを提案した。", "p3": "DQNエージェントが実時間のスマート充電と回生電流の動的制限を行い、エッジで動くLSTMデジタルツインが電気熱力学と電池の健全度を追跡する。非線形モデル予測制御にSHAPを組み込み、発熱の寄与を可視化して内部の熱遅れを補正する（抄録）。", "p5": "予測的なNMPC-xAIループはセル温度を狭い最適範囲に保ち、冷却の遅れを防ぎ、ピーク温度変動を減らしたとされる（抄録。数値は記載なし）。", "fun": "電動バスは発進と回生ブレーキで電池に急な電流が流れ、熱で傷みやすい。この研究は、電池の「分身」をコンピュータ上に作って温度と劣化を先読みし、AIが充電と回生の強さを調整する。さらに「なぜ今熱いのか」を説明する仕組みを制御に組み込み、人が理由を追えるようにした。", "unverified": "評価データ（実車か模擬か）と性能の数値は抄録に記載なし。"}}, {"id": "jr33", "rank": 33, "headline": "都市物流の持続性は統治の組み合わせで決まる", "title": "Brave new cities? Governance configurations for sustainable city logistics", "url": "https://doi.org/10.1108/scm-04-2026-0462", "authors": "Hugo de Tarragon ほか", "venue": "Supply Chain Management", "date": "2026-10-26", "sjr": 2.638, "citescore": 20.1, "citescore_year": "2025", "apa": "de Tarragon, H., & Theodoraki, C. (2026). Brave new cities? Governance configurations for sustainable city logistics. Supply Chain Management: An International Journal, 1–18. https://doi.org/10.1108/scm-04-2026-0462", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Supply Chain Management掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "似た協働的ガバナンスを採った都市でも持続可能な都市物流の成果が異なる理由を、フランスの20の都市物流施策の構成的分析で説明し、5つのガバナンス構成を特定した。", "p3": "サプライチェーンを社会に埋め込まれたシステムと捉え、Furnariら（2021）の構成的理論化の道具立てで、ガバナンス条件を反復的に特定・組み合わせて成果の違いを説明する質的構成分析（抄録）。", "p5": "高い成果は協働的ガバナンス単独ではなく、ガバナンス構造、関係者の代表性、構造的コミットメント、介入規模の相互作用から生まれる。構成はフランスの事例に基づき、他の制度文脈での検証が必要（抄録）。", "fun": "都市の配送を環境に優しくするために、企業と行政が協力する枠組みはどこの都市にもある。なのに成果に差が出るのはなぜか。20都市を比べると、協力の有無ではなく、誰が参加し、どれだけ本気で関わり、どの規模でやるかの組合せが決め手だった。同じ処方箋でも配合が違えば効かないという話である。", "unverified": "5つの構成の具体的な内容は抄録に記載なし。"}}, {"id": "jr34", "rank": 34, "headline": "アクセス性が地価に転化する条件の相互作用", "title": "Accessibility and Its Realization: Interaction Effects in Cebu City Land Values", "url": "https://doi.org/10.5281/zenodo.23668547", "authors": "Agosto, Augusto", "venue": "Zenodo (Journal article)", "date": "2026-10-26", "apa": "Agosto, A. (2026). Accessibility and Its Realization: Interaction Effects in Cebu City Land Values. Zenodo. https://doi.org/10.5281/ZENODO.23668547", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodo登録の説明文（候補収集時に取得）を抄録として使用。掲載誌名は記録上「Zenodo (Journal article)」で、査読の有無は確認できず。本文は入手できず", "preprint": false, "short": true, "p1": "立地のアクセス性がどのように実際の地価に転化するかを、空間構造が立地の潜在力を決め、制度・市場・資本投資との相互作用がその実現度を決めるという2段階の制度-空間枠組みで説明しようとした。", "p3": "セブ市を対象に、立地潜在力と制度条件・市場活動・資本投資の相互作用を地価形成の2段階モデルとして定式化する（抄録）。", "p5": "抄録は枠組みの提示にとどまり、データや推定結果の記述はない（抄録）。", "fun": "駅に近い土地は高い、という説明は当たり前すぎて、なぜ同じくらい便利な土地でも値段が違うのかは説明できない。この研究は「便利さ」は可能性にすぎず、それが値段として現れるかは制度や市場や投資との掛け合わせで決まると考える。可能性と実現を分けるという問いの立て方が面白い。", "unverified": "データ・手法・結果は抄録に記載がなく未確認。掲載媒体の査読の有無も不明。"}}, {"id": "jr35", "rank": 35, "headline": "近所の施設と公園が社会的支援を介し孤独を減らす", "title": "Social infrastructure, social support, and loneliness in older people with depressive symptoms", "url": "https://doi.org/10.1093/eurpub/ckag169.956", "authors": "Y Du ほか", "venue": "European Journal of Public Health", "date": "2026-10-26", "citescore": 4.8, "citescore_year": "2025", "apa": "Du, Y., Chan, H., Yu, Y., Chan, W., Wong, H., & Lum, Y. (2026). Social infrastructure, social support, and loneliness in older people with depressive symptoms. European Journal of Public Health, 36(Supplement_5). https://doi.org/10.1093/eurpub/ckag169.956", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "European Journal of Public Health掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "地域の心理社会的介入を受けた抑うつ症状のある高齢者3,537人で、近隣の社会インフラ（地域施設と公開空地）が社会的支援を介して孤独感と抑うつ症状の変化に結びつくことを示した。", "p3": "GISで居住地から500m/1000m圏の地域施設と公開空地の利用可能性と近さを測り、介入前後の社会的支援、孤独感（UCLA-3）、抑うつ症状（PHQ-9）を潜在変化スコアモデルで分析して総効果・直接効果・間接効果を推定する（抄録）。", "p5": "地域施設までの距離が遠いほど社会的支援が低く（β=−0.050）、この経路が孤独感の変化との関連の15.8%、抑うつ症状の変化の9.5%を占めた。500m圏の公開空地が多いほど支援が高く（β=0.070）、孤独感の16.7%、抑うつの15.0%を説明。施設の数と空地の近さには有意な媒介がなかった（抄録）。", "fun": "近所に公民館や公園があるだけで、孤独が和らぐのだろうか。3,500人の高齢者を調べると、施設が近く公園が多い地域ほど人から支えられていると感じ、その分だけ孤独や落ち込みが改善していた。ただし効果の1〜2割程度で、建物さえ作れば解決するわけではない。まちの作りが心に届く経路を測った研究である。", "unverified": "介入の内容と総効果の大きさは抄録に記載なし。"}}, {"id": "jr36", "rank": 36, "headline": "農村高齢者の都市同居は幸福を高めるが代償も", "title": "Does Rural–Urban Mobility Improve the Well-Being of Rural Older Adults? Evidence from Changing Living Arrangements in China", "url": "https://doi.org/10.3390/su182110848", "authors": "Jinqiong Ouyang ほか", "venue": "Sustainability", "date": "2026-10-26", "citescore": 8.9, "citescore_year": "2025", "apa": "Ouyang, J., Zhao, Y., & Xia, W. (2026). Does Rural–Urban Mobility Improve the Well-Being of Rural Older Adults? Evidence from Changing Living Arrangements in China. Sustainability, 18(21), 10848. https://doi.org/10.3390/su182110848", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Sustainability掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "中国の農村高齢者が子どもと都市で同居する「農村-都市移動同居」が、取り残された生活に比べて幸福を高める一方、身体健康・社会参加・経済的安全では不利になるという多次元のトレードオフを示した。", "p3": "中国縦断高齢化社会調査（CLASS）で、移動同居・取り残し・都市での子との同居・農村での子との同居の4つの居住形態を識別し、非線形性と高次元の交絡に対処する二重機械学習で効果を推定する（抄録）。", "p5": "移動同居は精神健康・住環境・健康行動を改善し、身体健康・社会参加・経済的安全を悪化させる。農村での同居も幸福を高め、都市への移住だけが道ではない。効果は子の性別構成と教育で大きく異なる。機序として世代間支援と自己発展が幸福を高め、世代間の貢献増と社会的同一化の弱まりが打ち消す（抄録）。", "fun": "田舎に残された高齢の親が、都会で働く子どものもとへ移ると幸せになれるのか。答えは「気持ちや住まいは良くなるが、体の健康や近所づきあい、お金の面では悪くなる」だった。そして田舎で子と一緒に暮らすのも同じくらい良い。引っ越しの是非を一つの幸福度で測らず、何が良くなって何が悪くなるかを分けて示した。", "unverified": "効果の大きさの数値と標本規模は抄録に記載なし。"}}, {"id": "jr37", "rank": 37, "headline": "緩和ケアと高齢者ケアの組織間連携の戦略", "title": "Strategies for promoting interorganisational linkages between palliative care services and teams and aged care providers: A systematic literature review", "url": "https://doi.org/10.1177/02692163261485105", "authors": "Shirley Chambers ほか", "venue": "Palliative Medicine", "date": "2026-10-26", "sjr": 1.711, "citescore": 8.5, "citescore_year": "2025", "apa": "Chambers, S., Spooner, A., Singh, G. K., & Yates, P. (2026). Strategies for promoting interorganisational linkages between palliative care services and teams and aged care providers: A systematic literature review. Palliative Medicine. https://doi.org/10.1177/02692163261485105", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Palliative Medicine掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "緩和ケアのサービス・チームと高齢者ケア提供者をつなぐ組織間連携の戦略を系統的レビューで整理し、3つの要素と報告された成果を特定した。", "p3": "PubMed、MEDLINE、CINAHL、PsycINFO、CareSearchを2000〜2025年8月で検索し、査読済みの原著（単一事例研究を除く）を対象に、混合研究法評価ツールで2名が独立に質を評価して物語的に統合する（抄録）。", "p5": "37報告・32研究を含み、戦略は(1)専任の連携ワーカー、(2)コミュニケーション経路、(3)協働ケアの過程に分類。成果は提供者（職種間連携の強化）、職員（自信の向上）、医療システム（急性期利用の減少）、終末期の高齢者（症状苦痛の軽減）で報告され、利用者の自己報告（生活の質）はほとんど報告がない。12のケアモデルが3分類すべての要素を使っていた（抄録）。", "fun": "人生の最後を迎える高齢者を支えるには、介護施設と緩和ケアの専門チームが手を組む必要があるが、どうつなぐかは施設ごとにばらばらだった。32の研究を整理すると、つなぎ役の人を置く、連絡の道筋を決める、一緒にケアする仕組みを作る、の3つに集約された。意外なのは、肝心の本人の声がほとんど測られていないことである。", "unverified": "各成果の効果の大きさは抄録に記載なし。"}}, {"id": "jr38", "rank": 38, "headline": "生成AIの知識利用とデジタル素養が知識創造意図に", "title": "Generative AI as an external knowledge source: digital literacy, individual absorptive capacity and sports communication knowledge creation intention", "url": "https://doi.org/10.1108/jkm-07-2026-1421", "authors": "Runyu Wang ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-26", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Wang, R., Li, H., Wang, Y., & He, C. (2026). Generative AI as an external knowledge source: digital literacy, individual absorptive capacity and sports communication knowledge creation intention. Journal of Knowledge Management, 1–21. https://doi.org/10.1108/jkm-07-2026-1421", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Knowledge Management掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "中国雲南省の大学生616人で、知識志向の生成AI利用がデジタルリテラシーと個人の吸収能力を経てスポーツコミュニケーションの知識創造意図に結びつく逐次媒介を示した。", "p3": "スポーツ関連の学術的背景や経験のある学生の横断調査を、確認的因子分析、潜在変数の構造方程式モデル、5,000回のブートストラップ媒介分析で分析し、合成得点による媒介で頑健性を確認する（抄録）。", "p5": "個別の間接経路と、生成AI利用→デジタルリテラシー→吸収能力→知識創造意図の逐次経路がいずれも有意で、直接の関連も残る部分的な逐次媒介。横断・自己報告・地域限定の設計で因果や時間順序は示せず、意図であって行動ではない（抄録）。", "fun": "生成AIに聞けば知識が手に入る時代に、新しい知識を自分で作ろうという意欲は育つのか。この調査では、AIをよく使う学生ほど知識を作る意欲が高かったが、それはデジタルの素養と「取り込んで消化する力」を経由していた。AIの答えを検証してから取り込む、という手順の大切さを著者は強調している。", "unverified": "係数の大きさは抄録に記載なし。"}}, {"id": "jr39", "rank": 39, "headline": "Z世代の静かな退職は燃え尽きと対処で説明", "title": "The Influence of Organizational Support, Workplace Bullying, and Occupational Stress on Quiet Quitting via Job Burnout and Coping Strategies Among Generation Z Employees", "url": "https://doi.org/10.56403/lejea.v4i4.534", "authors": "Muhammad Rusydi Shabri ほか", "venue": "Lead Journal of Economy and Administration", "date": "2026-10-26", "apa": "Shabri, M. R., & Anindita, R. (2026). The <b>Influence of Organizational Support, Workplace Bullying, and Occupational Stress on Quiet Quitting via Job Burnout and Coping Strategies Among Generation Z Employees<\/b> Lead Journal of Economy and Administration, 4(4), 166–176. https://doi.org/10.56403/lejea.v4i4.534", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Lead Journal of Economy and Administration掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ジャカルタ首都圏のZ世代正社員211人で、組織的支援・職場のいじめ・職業ストレスが「静かな退職」に直接は効かず、燃え尽きと対処戦略を介して完全に媒介されることをPLS-SEMで示した。", "p3": "有意抽出した211人のオンライン質問紙を、部分最小二乗法の構造方程式モデルで分析する説明的量的研究（抄録）。", "p5": "組織的支援は燃え尽きを減らし、燃え尽きは静かな退職を増やす。職場のいじめは対処戦略を弱め、対処戦略は静かな退職を減らす。3つの要因は静かな退職に直接効果を持たず、燃え尽きと対処戦略が完全に媒介した。縦断設計と広い標本が今後の課題（抄録）。", "fun": "「辞めはしないが最低限しか働かない」静かな退職は、若い世代で増えているとされる。この調査では、上司の支援のなさやいじめがそのまま静かな退職を生むのではなく、燃え尽きるか、うまく対処できなくなるかを通ってはじめて起きていた。手前の段階で止められる可能性を示している。", "unverified": "係数の大きさは抄録に記載なし。"}}, {"id": "jr40", "rank": 40, "headline": "粘弾性せん断流中の球と扁平粒子の運動様式", "title": "Dynamics of spherical and oblate particles in a viscoelastic shear flow", "url": "https://doi.org/10.1017/jfm.2026.12125", "authors": "Zhenyu Ouyang ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-26", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Ouyang, Z., Jiang, S., Yuan, F., & Ku, X. (2026). Dynamics of spherical and oblate particles in a viscoelastic shear flow. Journal of Fluid Mechanics, 1045. https://doi.org/10.1017/jfm.2026.12125", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Fluid Mechanics掲載版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "粘弾性せん断流中の球形と扁平回転楕円体の粒子について、粒子レイノルズ数とワイセンベルク数を変えて平衡位置と回転挙動の変化を系統的に示した。", "p3": "直接強制の仮想領域法とOldroyd-Bモデルを組み合わせ、0.1≤Re_p≤10、1≤Wi≤5の範囲で、2つの初期配向（オイラー角で(0,0,0)と(π/2,π/4,π/2)）から計算する（抄録）。", "p5": "球粒子の平衡位置はRe_p＞3でWiの増加とともに壁側へ単調に移るが、1≤Re_p≤3では弾性にほぼ無感。扁平粒子の回転周期はWiとともに増え、弾性が回転を遅くする。慣性と弾性の相互作用で6つの横方向移動・回転様式が現れ、弱い慣性ではカヤック型回転、中程度ではせん断面内の転がり、Re_p≥7では回転がロックされWiの増加で解放される（抄録）。", "fun": "水のような普通の液体と、ねばねばした弾力のある液体では、中を流れる粒の振る舞いが変わる。計算すると、扁平な粒はねばりが強いほどゆっくり回り、条件によってはカヤックを漕ぐように揺れたり、ぴたりと回転が止まったりする。6通りの動き方が、2つの数（慣性とねばり）の組合せで整理できるという結果である。", "unverified": "各様式の境界の正確な値は抄録に記載なし。"}}, {"id": "jr41", "rank": 41, "headline": "DEMでハイドレート堆積物の力学と剪断帯を再現", "title": "A Study of the Mechanical Properties of Gas Hydrate-Bearing Sediments Under Membrane Boundary Conditions Using the Discrete Element Method", "url": "https://doi.org/10.3390/ma19214479", "authors": "Xiuxing Zhu ほか", "venue": "Materials", "date": "2026-10-26", "citescore": 7.0, "citescore_year": "2025", "apa": "Zhu, X., Cui, J., Liu, L., Han, B., Li, J., & Zhou, B. (2026). A Study of the Mechanical Properties of Gas Hydrate-Bearing Sediments Under Membrane Boundary Conditions Using the Discrete Element Method. Materials, 19(21), 4479. https://doi.org/10.3390/ma19214479", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Materials掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ガスハイドレート含有堆積物の巨視的・メゾスケール力学特性を、膜境界条件の2次元個別要素法で調べ、ハイドレート飽和度による強度増加とせん断帯形成の微視的機序を示した。", "p3": "PFC2Dで膜境界の試料に二軸圧縮を模擬し、層状の着色法で変形を可視化。配位数、偏差ファブリック、接触力、粒子回転をメゾスケールで追う（抄録）。", "p5": "偏差応力-軸ひずみ曲線は飽和度とともに強度が上がり、体積ひずみは収縮から膨張への遷移を示す。配位数は軸ひずみとともに増えてから減り、収縮-膨張遷移に対応。せん断帯内の粒子回転の増大がせん断局所化に重要。2次元・単一のハイドレート賦存形態という仮定に結果は依存する（抄録）。", "fun": "海底の「燃える氷」を取り出すとき、氷が粒の隙間を埋めた砂がどれだけ強いかが安全を左右する。粒を一つずつ計算する模擬で、氷が多いほど強くなり、壊れるときは粒がくるくる回る帯ができることが分かった。粒の回転という小さな動きが、地盤の崩れ方を決めているという視点である。", "unverified": "粒子数と強度の数値は抄録に記載なし。"}}, {"id": "jr42", "rank": 42, "headline": "桁断面形状が吊橋の3次元渦励振分布を変える", "title": "Effects of Variation in Deck Configuration on the 3D VIV Motion Distribution Along a Long-Span Suspension Bridge", "url": "https://doi.org/10.1142/s0219455428500678", "authors": "Aohan Wei ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-10-26", "citescore": 6.5, "citescore_year": "2025", "apa": "Wei, A., & Zhang, Z. (2026). Effects of Variation in Deck Configuration on the 3D VIV Motion Distribution Along a Long-Span Suspension Bridge. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500678", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal of Structural Stability and Dynamics掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "長大吊橋の桁断面形状（Π形と閉箱形）が渦励振（VIV）の振幅依存の空力特性と、2次元から3次元への振幅変換係数をどう変えるかを、風洞試験とモード別FEMで示した。", "p3": "構造特性が同じ2つの断面の節模型風洞試験で、成長から共振と減衰から共振の過程を組み合わせて振幅依存の非線形空力パラメータを同定し、振幅依存の構造減衰も考慮してモード別の全橋有限要素解析に適用する（抄録）。", "p5": "断面形状は主に振幅依存の空力特性を変え、2次元のリミットサイクル振動、3次元の振幅分布、2D-3D変換係数を支配する。変換係数は振幅とともに非線形に減り、多くは1.1〜3.9の範囲。Π形は閉箱形より係数が高く減衰傾向も顕著（抄録）。", "fun": "橋の一部を切り出して風洞で揺らす実験の結果を、実物の橋全体の揺れに換算するには「変換係数」が要る。この研究は、桁の断面の形によってその係数が1.1から3.9まで変わり、揺れが大きくなるほど小さくなることを示した。模型と本物の間の翻訳が、形と揺れの大きさで変わるという話である。", "unverified": "対象橋梁の規模と風速条件は抄録に記載なし。"}}, {"id": "jr43", "rank": 43, "headline": "風車翼の局所損傷は曲率指標でしか見えない", "title": "Modal-Feature-Based Detection of Localized Structural Damage in Large Wind Turbine Blades", "url": "https://doi.org/10.36001/phmconf.2026.v18i1.5118", "authors": "Samin Yaser Ahmed ほか", "venue": "Annual Conference of the PHM Society", "date": "2026-10-25", "citescore": 1.3, "citescore_year": "2025", "apa": "Ahmed, S. Y., Griffith, D. T., Post, N. L., & Sajeer, M. M. (2026). Modal-Feature-Based Detection of Localized Structural Damage in Large Wind Turbine Blades. Annual Conference of the PHM Society, 18(1). https://doi.org/10.36001/phmconf.2026.v18i1.5118", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "PHM Society年次会議の抄録（Crossref経由で候補収集時に取得）を使用。博士研究の中間報告。本文は入手できず", "preprint": false, "short": true, "p1": "大型複合材風車翼の局所的な剛性低下に対し、固有振動数・モード形・その空間微分のどれが感度を持つかを、積層レベルで損傷をパラメータ化した枠組みで比較した。", "p3": "参照規模の複合材翼に複合積層レベルで局所的な剛性劣化を導入し、構造化した損傷ケースの行列にわたって固有振動数、モード形、空間微分を比較する（抄録）。", "p5": "局所的な剛性劣化では、ほとんどのモードとケースで固有振動数の変化が1%未満にとどまる一方、曲率に基づく指標は特定のモードと部材の組合せでのみ最も強い空間的な特徴を示す。選んだ曲率特徴は定格回転の条件でも安定。損傷行列の拡張とシェル要素との照合が今後の計画（抄録）。", "fun": "風車の長い羽根の一部が傷んでも、羽根全体の「音の高さ」（固有振動数）は1%も変わらず、ほとんど気づけない。代わりに、羽根のたわみ方の「曲がり具合」を細かく見ると傷の場所が浮かび上がることがある。ただしどのモードでも見えるわけではなく、見える組合せを探すのが課題だという、途中経過の報告である。", "unverified": "博士研究の中間報告で、最終結果ではない。損傷ケース数は抄録に記載なし。"}}, {"id": "jr44", "rank": 44, "headline": "超伝導磁気浮上の橋上軌道桁の最適パラメータ", "title": "Parameter Optimization and Sensitivity Analysis of Track Structures for Superconducting EDS Ultra-High-Speed Maglev Systems on Bridges", "url": "https://doi.org/10.1007/s40864-026-00291-x", "authors": "Yanghao Wang ほか", "venue": "Urban Rail Transit", "date": "2026-10-25", "citescore": 4.8, "citescore_year": "2025", "apa": "Wang, Y., Cai, X., Tang, X., Zhang, R., & Hou, Y. (2026). Parameter Optimization and Sensitivity Analysis of Track Structures for Superconducting EDS Ultra-High-Speed Maglev Systems on Bridges. Urban Rail Transit. https://doi.org/10.1007/s40864-026-00291-x", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Urban Rail Transit掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "超伝導電気力学浮上（EDS）式の超高速磁気浮上システムの橋上軌道桁について、車両・軌道・橋梁の連成模擬で桁高・スパン・材料・空気ばねの感度を調べ、設計パラメータの目安を示した。", "p3": "磁気浮上車両・ガイドウェイ・橋梁の連成力学模擬モデルを作り、鉛直列車荷重、軌道側コイルの温度上昇、高速運転条件を考慮して、桁の変位・応力・動的増幅係数、車両振動、浮上ギャップ変動を解析する（抄録）。", "p5": "桁高を上げると1次鉛直固有振動数が上がり動的増幅が減り、桁高3.0〜3.2 mが600 km/hで比較的安定。検討条件では24 mスパンが良好。桁のコンクリート弾性係数が主要パラメータで、浮上ギャップは車体質量に敏感、空気ばね剛性は振動低減とギャップ安定の両立で最適化が必要（抄録）。", "fun": "時速600 kmで浮いて走る列車は、レールに触れないのに、橋の揺れが浮いている隙間（ギャップ）を変えてしまう。この研究は、橋の桁をどれだけ高く太く作ればその揺れを抑えられるかを計算し、桁の高さ3 m前後、スパン24 mという具体的な目安を出した。触れていないものどうしが揺れでつながっているのが面白い。", "unverified": "模擬モデルの検証（実測との比較）の有無は抄録に記載なし。"}}, {"id": "jr45", "rank": 45, "headline": "黄河大橋崩落の原因を階層故障木で再構成", "title": "Causal Analysis of the Jianzha Yellow River Grand Bridge Collapse Using a Hierarchical Fault Tree", "url": "https://doi.org/10.57237/j.cear.2026.01.002", "authors": "Hou Wenyan ほか", "venue": "Civil Engineering and Architectural Research", "date": "2026-10-26", "apa": "Wenyan, H., Fengxia, Z., & Zhengting, G. (2026). Causal Analysis of the Jianzha Yellow River Grand Bridge Collapse Using a Hierarchical Fault Tree. Civil Engineering and Architectural Research, 3(1), 7–17. https://doi.org/10.57237/j.cear.2026.01.002", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Civil Engineering and Architectural Research掲載版の抄録（Crossref経由で候補収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "西寧-成都鉄道の尖扎黄河大橋で8月22日に起きた仮設の斜張ケーブル固定システムの崩落について、公式調査報告の事実に基づき階層的な定性的故障木で構造的失敗・管理障壁の失敗・人的被害の連鎖を再構成した。", "p3": "公式調査報告で確定した事実を、構造の失敗、管理上の障壁の失敗、被害の帰結に分けて階層的な定性的故障木として整理する（抄録）。", "p5": "分配梁の継手に、機械的性質の不足した高力ボルトと製作・取付けの欠陥が同時に存在し、相互作用で耐力が大きく低下。第4固定ケーブルの
