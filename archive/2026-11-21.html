<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>

    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

の穴", "title": "Pavement Characteristics and Energy Pathways in Battery-Electric Road Vehicles: A Critical Review of Measurement Boundaries and Validation Gaps", "url": "https://doi.org/10.20944/preprints202611.1892.v1", "authors": "Kulbir Singh", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Singh, K. (2026). Pavement Characteristics and Energy Pathways in Battery-Electric Road Vehicles: A Critical Review of Measurement Boundaries and Validation Gaps. https://doi.org/10.20944/preprints202611.1892.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "路面の凹凸（IRI）や表面の性状と電気自動車のエネルギーの関係を報告した55件の文献を批判的に整理し、計測の境界と検証の不足のため、凹凸から電池のエネルギーへの統一的な係数は導けないと結論した（抄録）。未査読。", "p3": "体系的な選別ではなく既存の記録から集めた55件を、路面の条件、車種、エネルギーの計上範囲、測定か模擬か、検証の対象で比べた（抄録）。", "p5": "IRIが1 m/km増えると正規化エネルギーが3.4%増えるという報告は電池端の電力の直接測定ではなく、704%という数値は機械的な散逸の模擬値であるなど、研究ごとに測っている量が違うことを示した（抄録）。", "fun": "でこぼこ道を走ると電気自動車の電池は余計に減るのか。直感的にはそうだが、調べてみると研究ごとに「どこで測ったエネルギーか」がばらばらで、電池から出た電気を直接測った研究はほとんどなかった。同じ言葉で違うものを比べていないかを確かめる、検証の大切さが見える論文だ。", "unverified": "本文は入手できず、55件の内訳と各研究の数値の詳細は確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "促進載荷試験の3次元FEで二輪タイヤと層間付着を評価", "title": "Finite Test Pit, Dual Tyres and Interlayer Bonding: A Verified Three-Dimensional Finite Element Analysis of a Circular Accelerated Pavement Testing Facility", "url": "https://doi.org/10.20944/preprints202611.1945.v1", "authors": "Silviu-Cristian Iriciuc ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Iriciuc, S.-C., Gimiga, G.-R., Dima, D.-N., Colț, O.-E., Boacă, G., Romila, C., Ungureanu, D., Onuțu, C., Scutaru, M.-C., & Țurcanu, F. E. (2026). Finite Test Pit, Dual Tyres and Interlayer Bonding: A Verified Three-Dimensional Finite Element Analysis of a Circular Accelerated Pavement Testing Facility. https://doi.org/10.20944/preprints202611.1945.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "円形の促進舗装載荷試験施設を3次元FEで再現し、有限の試験ピット、二輪タイヤ、層間の付着が応答に与える影響を、実測のひずみ・圧力・たわみと比べて定量化した（抄録）。未査読。", "p3": "ルーマニアのALT-LIRA施設（深さ1.8 mのコンクリートピット、57.5 kNの二輪荷重）の参照区間のFEモデルを、多層弾性理論と広い領域のモデルで検証し、106回の通過での実測と比べた（抄録）。", "p5": "FEはアスファルトのひずみを多層弾性理論と1%以内、路床のひずみを3%以内で再現したが、剛なピットで表面のたわみは広い領域より23%、多層弾性理論より29%小さかった。二輪で最大ひずみは6%下がり、層間のすべりで最大94%増えた（抄録）。", "fun": "道路の耐久性を調べるため、車輪をぐるぐる走らせる試験場がある。ところが試験場は深さ1.8 mのコンクリートの箱の中に作られていて、普通の計算式はその箱を無視していた。3次元で計算し直すと、箱のせいでたわみが2割以上小さく出ることが分かった。実験装置そのものが結果に与える影響を見逃さない点が面白い。", "unverified": "本文は入手できず、部分的な付着（μ = 0.5）の場合の比較の詳細は確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "低価格湿度センサ48個を静的・動的に一括較正", "title": "A Traceable Single-Setup Procedure for Simultaneous Static and Dynamic Humidity Calibration: Demonstration on a Broad Range of 48 Commercial Low-Cost Sensors", "url": "https://doi.org/10.5194/egusphere-2026-6133", "authors": "Felix Witt ほか", "venue": "EGUsphere", "date": "2026-11-20", "apa": "Witt, F., & Ebert, V. (2026). A Traceable Single-Setup Procedure for Simultaneous Static and Dynamic Humidity Calibration: Demonstration on a Broad Range of 48 Commercial Low-Cost Sensors. https://doi.org/10.5194/egusphere-2026-6133", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "EGUsphere（査読前の議論用原稿）の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "低価格の相対湿度センサについて、トレーサブルな静的較正と動的な応答時間の評価を同じ装置・同じ測定期間で行う手順MetDyHuCalを示し、9機種48個に適用した（抄録）。未査読の議論用原稿。", "p3": "SI単位にトレーサブルな光学式の湿度計（波長可変レーザー吸収分光）を基準にする装置dynH2Oで、静的な偏りと非線形性、応答の時定数を測る（抄録）。", "p5": "機種ごとに大きな偏りと非線形性があり、応答時間はデータシートの値から−50%〜+81%ずれ、絶対湿度に依存する機種もあった。10個を5回付け外しして測った時定数τの再現性は相対標準偏差の中央値1.0%だった（抄録）。", "fun": "安い湿度センサは同じ型番でも1個ずつ癖が違い、しかも湿度の変化への反応の速さが説明書どおりではない。この研究は、ずれと反応の遅れを1つの装置でまとめて測る手順を作り、48個で試した。安い道具も測り方を整えれば信頼できる数字が出せるという点が面白い。", "unverified": "本文は入手できず、機種ごとの補正式と各機種の時定数の値は確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "年次報告書で測るマーケティングの幅と企業価値", "title": "Marketing Breadth and Firm Value: A Contingency Approach", "url": "https://doi.org/10.2139/ssrn.7705518", "authors": "Didem Kurt ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Kurt, D., Grewal, D., & Kurt, A. C. (2026). Marketing Breadth and Firm Value: A Contingency Approach. https://doi.org/10.2139/ssrn.7705518", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業が年次報告書で言及するマーケティング概念の種類の数をマーケティングの幅としてテキストから測り、企業価値との関係を状況に応じて分析した（抄録）。未査読。", "p3": "年次報告書に現れる固有のマーケティング概念の数で幅を測り、マーケティング・製品市場・資本市場の成果で妥当性を確かめたうえで、ライフサイクルの段階や市場の動きを条件とするモデルで企業価値との関連を推定した（抄録）。", "p5": "平均的には幅が広いほど企業価値が高いが、その関連はライフサイクルの段階と市場の動きによって変わった（抄録）。", "fun": "広告も値引きも新商品もSNSも全部やる会社と、いくつかに絞る会社のどちらが得か。幅広くやれば機会は増えるが、経営者の注意が薄く広がる。年次報告書に出てくるマーケティングの言葉の種類を数えるという素朴な方法で、この問いを多くの企業で調べた点が面白い。", "unverified": "本文は入手できず、対象企業の数・期間と推定値は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "不祥事後の顧客回復策は予防の動機を弱める", "title": "Responsible Sourcing under Consumer Forgiveness: Prevention and Remediation", "url": "https://doi.org/10.2139/ssrn.7708158", "authors": "Ruoxin Gao ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Gao, R., & Yang, R. (2026). Responsible Sourcing under Consumer Forgiveness: Prevention and Remediation. https://doi.org/10.2139/ssrn.7708158", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "供給業者の違反が公表された後に顧客を取り戻す改善策（事後の救済）が、ブランドと供給業者の予防の動機にどう影響するかをゲーム理論のモデルで示した（抄録）。未査読。", "p3": "買い手（ブランド）の予防投資と供給業者の遵守努力が違反の確率を決め、違反が公表されると一切許さない消費者は去り、条件つきの消費者は救済投資に応じて戻るモデルを分析した（抄録）。", "p5": "救済がない場合に比べ、救済は供給業者の遵守努力を弱め、違反の確率を高めうる。遵守が不完全なら公表の確率を上げるほうが双方の予防を強め、救済費用の分担はかえって遵守を下げうる（抄録）。", "fun": "不祥事の後に謝罪とおわびで客を取り戻せるなら、そもそも不祥事を防ぐ努力が手抜きになるかもしれない。この研究は「許してもらえること」が予防を弱めるという逆説を数式で示した。事後の対策と事前の対策が打ち消し合いうる点が面白い。", "unverified": "本文は入手できず、モデルの仮定の詳細と数値例は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "論証の枠組みをLLMの判断に組み込む設計", "title": "Incorporating argumentation frameworks for LLM decision-making: Task-specific design and evaluation", "url": "https://arxiv.org/abs/2611.25361", "authors": "Bochen Han ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Han, B., Xiong, A., & Ma, M. (2026). Incorporating argumentation frameworks for LLM decision-making: Task-specific design and evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25361", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "形式的な論証フレームワークをLLMの意思決定に組み込む既存手法を4段階の流れに整理し、討論型の意思決定と検索型の事実検証では一様に効かないことを示したうえで、課題に合わせた2つの手法を提案した（抄録）。未査読。", "p3": "討論資料の話者ごとに論証を整理し、モデルが推定した論証の強さを段階的意味論で集約するQnt-Argと、根拠の信頼度で衝突する証拠の優先関係を決め、基礎意味論で採用する証拠を選ぶQlt-Argを作った（抄録）。", "p5": "討論の設定ではQnt-Argが同じ条件の他の論証手法を一貫して上回り、Qlt-Argは検索型の事実検証の性能を基準より改善した（抄録）。", "fun": "議論を「主張」と「反論」の矢印の図にして、どの主張が生き残るかを数学的に決める方法がある。この研究は、それをAIの判断に組み込んでも作り方を課題に合わせないと効果がないことを示した。人の議論の整理術とAIを組み合わせる試みが面白い。", "unverified": "本文は入手できず、使用したLLMと性能差の数値は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "採点尺度の形でLLM評価者の点数が変わる", "title": "Same Judgement, Different Scores: Numerical Scoring Topology in LLM-as-a-Judge Evaluation", "url": "https://arxiv.org/abs/2611.26077", "authors": "Doyun Kim ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Kim, D., Kim, C., Kum, J., Song, M., & Park, C. (2026). Same Judgement, Different Scores: Numerical Scoring Topology in LLM-as-a-Judge Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26077", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMを評価者として使うときの採点尺度の設計（幅、刻み、ずらし、対称性、境界の位置）を「数値採点の位相」と定義し、それが点数・較正・頑健性を系統的に変えることを示した（抄録）。未査読。", "p3": "さまざまなベンチマークと評価者モデルで、ゼロショットのLLM評価者に異なる採点尺度を与えて比べた（抄録）。", "p5": "尺度の設計は特に判断の要る評価で点数・較正・頑健性に影響し、ずらした尺度や狭い尺度で点数の大きなずれが生じやすかった。大きく強い評価者モデルほど識別の妥当性が高く、尺度の変更に頑健だった（抄録）。", "fun": "同じ作文でも「1〜5点」で採点するか「0〜10点」で採点するかで、AIの付ける点が変わってしまう。この研究は、点数の物差しの形そのものが結果を左右することを体系的に確かめた。物差しの選び方も実験条件の一部だと気づかせる点が面白い。", "unverified": "本文は入手できず、使ったベンチマークと評価者モデルの名前、ずれの大きさは確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "LLM評価者が人の代わりになるかを検定", "title": "AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators", "url": "https://arxiv.org/abs/2611.26073", "authors": "Nagham Omar ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Omar, N., Dror, R., Gueta, A., Gal, A., Reichart, R., & Calderon, N. (2026). AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26073", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMを人間の注釈者の代わりに使ってよいかを、項目ごとに注釈者が異なる場合でも判断できる統計的検定AltRA-Testを提案した（抄録）。未査読。", "p3": "項目を再標本化して各項目にk人分の人の注釈を引き、そのうち1人をLLMに置き換えた混合パネルと人だけのパネルを作り、混合パネルの注釈者間の一致が人だけのパネルに非劣性かを検定する（抄録）。", "p5": "漸近的に水準αの一致した検定であることを示し、18のLLMと5つのプロンプト法を20のデータセットで評価した。約100項目で足りることが多く、模擬では既存の手法より正しい置き換えの判断ができ、実データではLLMが約半数の設定で合格した（抄録）。", "fun": "人の採点をAIに任せてよいかを決めるには、「AIが人と同じくらい人と意見が合うか」を確かめればよい。この研究は、採点者が問題ごとに違う現実のデータでもその確認ができる方法を作った。AIの評価者を使う前の「資格試験」を作った点が面白い。", "unverified": "本文は入手できず、非劣性の幅の決め方と合格した課題の内訳は確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "長文ペルソナを時間つきの記憶として評価", "title": "ChronoDossier: Long-Form Personas as Temporal Memory Representations", "url": "https://arxiv.org/abs/2611.25407", "authors": "Noah Sturgill ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Sturgill, N., & Choi, J. D. (2026). ChronoDossier: Long-Form Personas as Temporal Memory Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25407", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "長文のペルソナ資料を、変わらない身元と時期ごとの事実・習慣・判断規則の年表という既知の状態の記憶表現とみなし、記録と回答の誤りを分けて評価するベンチマークChronoDossierを作った（抄録）。未査読。", "p3": "日付つきの年表から7つの生成器で1k〜10k語の合成ペルソナ資料311件を作り、記録を意図した状態と照合する内在的な指標と、5つの読み手モデルが状態を回復できるかを測る外在的な指標で評価した（抄録）。", "p5": "証拠をそろえた比較で、該当する節全体を与えると「包装」の失敗はGPT-5.1で32件中29件、Sonnet 4.6で30件中25件が直ったが、回答形成の失敗は8件中2件と1件しか直らなかった（抄録）。", "fun": "長い人物設定をAIに渡してAIが間違えたとき、設定の書き方が悪いのか、AIの読み方が悪いのかが分からない。この研究は、正解の年表から資料を作ることでその2つを切り分けた。人物の「記憶」を検査できる形にした点が面白い。", "unverified": "本文は入手できず、7つの生成器の名前と内在的な指標の値は確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "ペルソナは視覚言語モデルの視線にどこまで届くか", "title": "Persona Lenses: What Makes a Vision-Language Model See Through Its Persona's Eyes?", "url": "https://arxiv.org/abs/2611.25508", "authors": "Yoonho Shin", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Shin, Y. (2026). Persona Lenses: What Makes a Vision-Language Model See Through Its Persona's Eyes? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25508", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プロンプトに与えたペルソナが、視覚言語モデル（VLM）のウェブページ上の模擬視線にどこまで反映されるかを測り、ペルソナを効かせる3つの方法（レンズ）を比べた（抄録）。未査読。", "p3": "単一の属性だけが違う2つのペルソナの視線の差を効き具合とし、ペルソナの関心を先に書かせる文章レンズ、関心の領域に印を付ける画素レンズ、視線の滞留に報酬を与える重みレンズを、Qwen3-VL（4B・32B）とQwen3.5-9Bで比べた（抄録）。", "p5": "文章レンズはペルソナを強く分けるが視線に無関係な属性の変更にも反応し、画素レンズは分け方が弱いが無関係な属性に影響されなかった。4B・9Bでは重みレンズが学習外の関心でもペルソナを分け、32Bは基本のプロンプトだけで分けた（抄録）。", "fun": "「あなたは料理好きの高齢者」とAIに伝えると、AIはウェブページの料理の記事を見るようになるのか。この研究は、人物設定がAIの「視線」にどこまで届くかを測り、効かせ方を3通り比べた。なりきらせる技術を、目の動きという客観的な量で調べた点が面白い。", "unverified": "本文は入手できず、各レンズの効き具合の数値は確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "6つのLLMの面接コーディングの一致と誤り", "title": "Can Nurse Researchers Rely on Large Language Models for Interview Coding? Lessons From a Comparative Study of Six Models Coding Chinese-Language Interviews (Preprint)", "url": "https://doi.org/10.2196/preprints.117124", "authors": "Mingjie Wu ほか", "venue": "JMIR Preprints", "date": "2026-11-20", "apa": "Wu, M., LIu, H., Yang, S., Liao, M., Kuang, l., Liang, Y., Zhang, J., & Hu, Z. (2026). Can Nurse Researchers Rely on Large Language Models for Interview Coding? Lessons From a Comparative Study of Six Models Coding Chinese-Language Interviews (Preprint). https://doi.org/10.2196/preprints.117124", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "複数のLLMの設定が同じ演繹的なコードブックで中国語の患者面接を符号化した結果を比べ、看護研究者が提案されたコードを採用する前に確かめるべき点を示した（抄録）。未査読。", "p3": "DeepSeek・Qwen・Kimi・ChatGPT・Claude・Geminiに112コードのコードブックを18件の面接に適用させ、FleissとCohenのκで一致を測り、文化に埋め込まれた19コードの一致、欠落と重複、引用の出所を確かめた（抄録）。", "p5": "モデル間の一致は中程度（Fleiss κ=0.60、95%CI 0.56–0.63）で、少なくとも1つのモデルが該当とした870組のうち全モデルが一致したのは205組（23.6%）だった。検証可能な引用2,845件のうち102件（3.6%）は面接者の発言や別の記録に一致するか、見つからなかった（抄録）。", "fun": "面接の記録に「これは家族の協力の話」などの見出しを付ける作業をAIに任せると、AI同士の意見は中くらいにしか一致しなかった。しかもAIが根拠として示した引用には、話し手を取り違えたものも混じっていた。AIの下書きは便利でも、最後の判断を人が持つべき理由が具体的に見える点が面白い。", "unverified": "本文は入手できず、モデルごとの一致度と面接の内容の詳細は確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "AIエージェントの社会を独自の研究対象に", "title": "Toward a Science of AI Agent Societies", "url": "https://arxiv.org/abs/2611.25404", "authors": "Geon Lee ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Lee, G., Bu, F., Lee, S. Y., Kim, S., & Shin, K. (2026). Toward a Science of AI Agent Societies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25404", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIエージェントが互いに大規模に相互作用する「AIエージェント社会」を、個々のエージェントの集まりとも人間社会の模擬とも異なる独自の研究対象とすべきだと論じる立場表明（抄録）。未査読。", "p3": "妥当なAIエージェント社会が満たすべき性質として、個別の目的、規則と統治、自律性、規模と複雑さを提案し、研究すべき行動として経済的行動、利害対立下の行動、危険・非倫理的な行動、システム全体の行動を挙げた（抄録）。", "p5": "既存のマルチエージェントシステムがこれらの性質の一部しか満たしていないことを示し、性質の母数化や両立などの技術的課題と、プラットフォームの設計・評価・統治への含意を論じた（抄録）。", "fun": "AI同士が取引したり、交渉したり、だまし合ったりする「AIの社会」が生まれつつある。それは人間社会の縮小模型でも、単なるプログラムの集まりでもない新しい研究対象だ、という主張だ。社会学の問いがAIの世界にも生まれる、という発想の転換が面白い。", "unverified": "立場表明の論文で実証データはない。本文は入手できず、既存システムの比較の詳細は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "知識に公正に向き合う態度を測る9項目尺度", "title": "The Intellectual Justice Scale: Measuring How Fairly People Engage With Knowledge", "url": "https://doi.org/10.31234/osf.io/buhyd", "authors": "Yara Daamen ほか", "venue": "PsyArXiv", "date": "2026-11-20", "apa": "Daamen, Y., Sikimić, V., & Lakens, D. (2026). The Intellectual Justice Scale: Measuring How Fairly People Engage With Knowledge. https://doi.org/10.31234/osf.io/buhyd", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "知識とその生産者に公正に向き合う傾向（知的正義）を測る9項目の自己報告尺度を、フリッカーの認識的不正義の枠組みに基づいて開発・検証した（抄録）。未査読。", "p3": "専門家の検討と予備調査で項目を絞り、研究1（N = 404）の探索的因子分析と研究2（N = 401）の確認的因子分析で、証言的正義・解釈的正義・知的行動の3因子を検証した（抄録）。", "p5": "探索的因子分析で3因子構造が支持され、統計的・概念的に独立に選んだ項目が同じ9項目に収束した。確認的因子分析で良好な適合を示し、知的謙虚さ・性格特性・社会的正義の態度と予想どおりに関連しつつ区別できた（抄録）。", "fun": "人の話を「若いから」「訛りがあるから」と割り引いて聞くことは、知識をめぐる不公正の一種だ。この研究は、そうした態度を9つの質問で測るものさしを作った。哲学の概念を、統計で確かめられる尺度に落とし込んだ点が面白い。", "unverified": "本文は入手できず、9項目の文言と適合度の値は確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "世帯の豊かさは家族のつながりを通じ死亡を減らすか", "title": "Networked wealth and mortality in the Agincourt Health and Demographic Surveillance System, 2009--2018", "url": "https://arxiv.org/abs/2611.25337", "authors": "Keletso Makofane ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Makofane, K., Tchetgen, E. T., Bassett, M. T., & Berkman, L. F. (2026). Networked wealth and mortality in the Agincourt Health and Demographic Surveillance System, 2009--2018 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25337", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "南アフリカのアジンコート人口動態監視システムのデータで、世帯の資産が家族のネットワークを通じて他の世帯の死亡にも波及するかを推定した（抄録）。未査読。", "p3": "2009〜2018年のコホートデータで、世帯資産の死亡への平均総効果（ATE）を、自世帯への直接効果（ADE）と家族ネットワークを通じた波及効果（ASE）に分け、全死亡・5歳未満・15〜59歳・60歳以上で別々に推定した（抄録）。", "p5": "期間中に8,750人が死亡した。資産の1標準偏差の増加でATEは−0.61%（95%CI −0.74〜−0.48）、ADEは−0.53%、ASEは−0.08%（P = 0.075）だった。早死では波及効果が−0.08%（95%CI −0.15〜0.00、P = 0.038）だった（抄録）。", "fun": "親戚にお金持ちがいると、自分の家の健康も守られるのだろうか。この研究は、家族のつながりをたどって、ある家の豊かさが別の家の死亡を減らす「おすそ分け」の効果を測った。早死にについては、その効果が小さいながら見えた点が面白い。", "unverified": "本文は入手できず、家族ネットワークの定義と推定の識別の仮定は確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "差分プライバシーで表データを合成し文脈学習", "title": "PriTabICL: Differentially Private Tabular In-Context Learning with Task-Aligned Cluster-Wise Synthesis", "url": "https://arxiv.org/abs/2611.25073", "authors": "Syed Ahzaz Shah ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Shah, S. A., Bramblett, E., Arcolezi, H. H., Gong, C., Tong, Q., & Li, X. (2026). PriTabICL: Differentially Private Tabular In-Context Learning with Task-Aligned Cluster-Wise Synthesis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25073", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "個人情報を含む表データを差分プライバシーで合成し、LLMの表の文脈内学習（TabICL）の例として使う枠組みPriTabICLを提案した（抄録）。未査読。", "p3": "記録を差分プライバシーの下でクラスタに分けて各クラスタを独立に合成し、特徴と目的変数の関係を優先する固定の集計で予測に重要な統計を保つ。推論時は質問をクラスタに振り分け、その合成データから例を取る（抄録）。", "p5": "4つの実データで有効性を示し、PriTabICL-PrivSynは全体を一度に合成するPrivSynを12設定中8設定で上回り、既存の私的なTabICLの手法をほぼすべての設定で上回った（抄録）。", "fun": "AIに表のデータの例を見せて予測させたいが、例そのものに個人情報が含まれている。そこで、似た人同士のグループごとに「本物そっくりだが本物ではない」データを作って見せる。全体を一度に真似るより、グループごとに真似るほうが少数派の特徴が残る点が面白い。", "unverified": "本文は入手できず、使った4つのデータセットとプライバシー予算の値は確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "社会会計行列で見る生産連関と資本所得のずれ", "title": "Production Resilience and Capital-Income Divergence in Türkiye's Textile, Apparel and Leather Complex: Evidence from 26 Annual Social Accounting Matrices, 2000-2025", "url": "https://doi.org/10.2139/ssrn.7706023", "authors": "Kamil Taşcı", "venue": "SSRN", "date": "2026-11-20", "apa": "Taşcı, K. (2026). Production Resilience and Capital-Income Divergence in Türkiye’s Textile, Apparel and Leather Complex: Evidence from 26 Annual Social Accounting Matrices, 2000-2025. https://doi.org/10.2139/ssrn.7706023", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "トルコの2000〜2025年の26年分の社会会計行列で、繊維・衣料・皮革産業の強い生産連関が、資本所得の波及の強さと一致するかを調べた（抄録）。未査読。", "p3": "生産要素・家計・企業を介したフィードバックを分ける3つの入れ子の勘定の区分で乗数を計算し、資本所得の順位と産出の順位の差（ギャップ）を年ごとに求めた（抄録）。", "p5": "家計・企業を含む産出乗数は12.8%低下し、59部門の中央値の11.7%に近かった。主な発見は生産と資本所得の順位のずれで、全部門でのギャップの年平均の百分位は92.8、製造業19部門では26年中22年でギャップが正だった（抄録）。", "fun": "ある産業が他の産業から部品をたくさん買うと、経済全体の生産は大きく増える。しかし、その結果生まれた利益が誰の手に渡るかは別の話だ。生産のつながりの強さと、お金の行き先の強さが一致しないことを、国の会計表で示した点が面白い。", "unverified": "本文は入手できず、各年のギャップの値と推定の詳細は確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "AI導入は全要素生産性を高めたか：国際比較", "title": "Separating AI from Capital: Identifying the Productivity Contribution of Artificial Intelligence across Countries and Sectors", "url": "https://doi.org/10.21203/rs.3.rs-11599318/v1", "authors": "Syed M. Abdullah ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Abdullah, S. M., & Seja, M. E. (2026). Separating AI from Capital: Identifying the Productivity Contribution of Artificial Intelligence across Countries and Sectors. https://doi.org/10.21203/rs.3.rs-11599318/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業のAI導入が全要素生産性（TFP）を高めたのか、それとも資本の深化と労働の増加を映しているだけなのかを、国・年のパネルで分けて推定した（抄録）。未査読。", "p3": "PWT 10.01と世界銀行の投資データで成長会計の残差（TFP成長）を計算し、OECDの企業調査のAI利用率と国・年の固定効果で関連づけた。内生性には2010年のブロードバンド普及と他国のAI普及を組み合わせたシフトシェア操作変数を使った（抄録）。", "p5": "同時点の効果は検出されず、固定効果の推定値は導入率1ポイント当たり0.005ポイント（p = 0.93）、2SLSは0.153（p = 0.42）だった。1年・2年のラグの点推定は大きいが不正確で、36か国102観測と検出力は限られる（抄録）。", "fun": "AIを使う会社が増えると国の生産性は上がるのか。この研究は、機械や人手が増えた分を差し引いたうえで調べたが、今のところ効果ははっきり見えなかった。新しい技術の効果は遅れて現れることが多く、「まだ分からない」ことを正直に示した点が面白い。", "unverified": "本文は入手できず、部門別の設計の結果と操作変数の第1段階の強さは確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "ジャカルタLRT補助金の説明責任と透明性", "title": "Analysis of Accountability and Transparency in Local Government Subsidy Management for Jakarta LRT Operations: Evidence from 2024 Financial and Operational Reports", "url": "https://doi.org/10.2139/ssrn.7713938", "authors": "Siti Naila Sari", "venue": "SSRN", "date": "2026-11-20", "apa": "Naila Sari, S. (2026). Analysis of Accountability and Transparency in Local Government Subsidy Management for Jakarta LRT Operations: Evidence from 2024 Financial and Operational Reports. https://doi.org/10.2139/ssrn.7713938", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ジャカルタ州政府による2024年度のジャカルタLRTの運営補助金の管理を、説明責任と透明性の観点から文書で分析した（抄録）。未査読。", "p3": "規則、州政府の財務諸表、運営会社PT LRT Jakartaの年次報告書を対象にした質的・記述的な文書分析である（抄録）。", "p5": "補助金の管理には規則の根拠と財務報告・内部監督・サービス評価の仕組みがあるが、補助金の協定や使途の詳細、監視・評価の結果が十分に公開されず、州と会社の報告範囲の違いで資金の流れを完全には追えないことを示した（抄録）。", "fun": "電車の運行に税金の補助が入るとき、そのお金がどう使われたかを市民が追えるかどうかは大事だ。役所の決算と会社の報告書を突き合わせると、両者の範囲が違うために途中で流れが見えなくなる場所があった。会計の「つなぎ目」に透明性の穴があるという指摘が面白い。", "unverified": "本文は入手できず、補助金の金額と具体的な開示項目は確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "ドローン群で道路網を能動的に観測する強化学習", "title": "SenseAlign: Learning Decision-Aligned Predictive Representations for Active Urban Sensing with UAVs", "url": "https://arxiv.org/abs/2611.26109", "authors": "Weijiang Xiong ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Xiong, W., & Geroliminis, N. (2026). SenseAlign: Learning Decision-Aligned Predictive Representations for Active Urban Sensing with UAVs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26109", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "道路網を観測するドローン群の配置を強化学習で決める際に、将来の交通状態の予測表現を意思決定に合うように学習する枠組みSenseAlignを提案した（抄録）。未査読。", "p3": "将来の真の交通状態を使える特権的な教師エージェントを先に学習し、生徒エージェントには部分観測から将来の交通を予測する補助の枝を持たせ、真の将来と予測した将来の下での教師の行動分布を一致させて潜在空間を形づくる（抄録）。", "p5": "1,570の道路区間を持つバルセロナ中心部の実際の道路網で、複数の効用の定式化について基準手法を一貫して上回った。推論時の追加の計算はない（抄録）。", "fun": "渋滞を見張るドローンをどこに飛ばすかは、これから道路がどうなるかの予想次第だ。この研究は、まず「未来が見える先生役のAI」に飛ばし方を学ばせ、未来が見えない生徒役のAIにまねさせた。予測を当てることより、良い判断に役立つ予測を学ばせる点が面白い。", "unverified": "本文は入手できず、基準手法との差の数値は確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "道路工事の契約変更を発生・金額・重要性で分析", "title": "An Outcome-Differentiated Assessment of Highway Contract Modifications: Occurrence, Financial Magnitude, and Materiality", "url": "https://doi.org/10.20944/preprints202611.1862.v1", "authors": "Malek Alazzam ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Alazzam, M., & Harahsheh, K. (2026). An Outcome-Differentiated Assessment of Highway Contract Modifications: Occurrence, Financial Magnitude, and Materiality. https://doi.org/10.20944/preprints202611.1862.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "道路工事の契約変更の記録を、事務的な変更の発生、金額の増加、落札額に対する重要性という別々の結果に分け、それぞれと落札額の関係を推定した（抄録）。未査読。", "p3": "ケンタッキー州交通局の調達記録と承認された変更指示を照合し、通常の道路工事契約2,494件の契約後730日間を、請負業者でクラスタ化したモデルで分析した（抄録）。", "p5": "落札額が2倍になると金額増の変更が起きるオッズ比は1.381（95%CI 1.292–1.476）、増額のある835件では増額の総額が1.568倍になった。一方、落札額の5%を超える正味の増加とは明確な関連がなかった（オッズ比1.014）（抄録）。", "fun": "工事の契約は途中で何度も変更されるが、「変更が多い」ことと「金額が大きく膨らむ」ことは別の問題だ。大きな工事ほど増額の変更は起きやすいが、予算に対して大きく膨らむわけではなかった。数字の取り方で見える景色が変わることを示した点が面白い。", "unverified": "本文は入手できず、非線形の分析と請負業者の影響の分析の結果は確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "異種センサを融合した都市気温のベイズ推定", "title": "BRUCE (Bayesian Rio Urban Climate Estimator): spatiotemporal interpolation of air temperature from heterogeneous sensor networks for operational heat monitoring", "url": "https://arxiv.org/abs/2611.26612", "authors": "Ayrton Sena Gouveia ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Gouveia, A. S., de Oliveira, R. S., Menezes-Silva, L., Castillo, M. A. M., Marincola, F. de C. V., Morais, J. H. de A., Saraceni, V., Aguilar, G. M. O., Ferreira, C. D., & Cruz, O. G. (2026). BRUCE (Bayesian Rio Urban Climate Estimator): spatiotemporal interpolation of air temperature from heterogeneous sensor networks for operational heat monitoring (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26612", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "公式の気象観測点、低価格のIoTセンサ、市民の個人気象観測、再解析の4種類の気温データを融合し、リオデジャネイロの都市内の気温を連続的に推定するベイズ階層時空間モデルBRUCEを示した（抄録）。未査読。", "p3": "INLAとSPDEの空間成分で当てはめ、データの種類と観測点ごとの測定の偏りを考慮し、日ごとにAR(1)で変化する連続の空間場を推定した。2023〜2025年の9つの月の窓に独立に当てはめた（抄録）。", "p5": "標高の係数はすべての窓で有意で、8つの窓で1標準偏差当たり−1.08〜−1.38℃と安定していた。地域を除く交差検証で既存のLCZ4rと同程度の精度で、241のプライマリケア地区のうち96を高い信頼度で分類できた（抄録）。", "fun": "都市の暑さを細かく知りたいが、公式の温度計は少ない。そこで安いセンサや市民の温度計も使いたいが、それぞれ癖がある。この研究は、測り方ごとの癖を見積もりながら混ぜ合わせ、どの地区が暑いかを確率つきで示した。質の違うデータを捨てずに使い切る点が面白い。", "unverified": "本文は入手できず、各データ源の偏りの推定値と観測点の数は確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "民泊の密度と長期家賃の非線形な関係", "title": "From Pressure to Saturation: A Multilevel Analysis of Short-Term Rental Density and Long-Term Rents in Colombia", "url": "https://doi.org/10.21203/rs.3.rs-11324911/v1", "authors": "Sergio A. Barona-Montoya ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Barona-Montoya, S. A., Castellanos, A. A., & Niño, A. L. (2026). From Pressure to Saturation: A Multilevel Analysis of Short-Term Rental Density and Long-Term Rents in Colombia. https://doi.org/10.21203/rs.3.rs-11324911/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "コロンビアの18の主要都市で、民泊（短期賃貸）の密度と長期の賃貸住宅の家賃の関係を、住戸と都市の2層のモデルで分析した（抄録）。未査読。", "p3": "ウェブから収集した6,803件の賃貸物件を都市ごとに入れ子にし、民泊市場の指標と国勢調査・家計調査の都市の特性と組み合わせた2層の多層モデルを推定した（抄録）。", "p5": "家賃の対数の分散の約17%が都市間の差だった。民泊の密度（住宅100戸当たりの稼働物件数）は家賃と正だが非線形に関連し、平均より100戸当たり3件多い水準を超えると関連が弱まり反転した。高所得の地区ほど低い密度で家賃が頭打ちになった（抄録）。", "fun": "観光客向けの民泊が増えると、地元の人の家賃は上がるのか。調べると、ある程度までは上がるが、増えすぎると逆に下がり始めた。市場がいっぱいになる「飽和」の兆しかもしれない。単純な「増えれば上がる」ではない関係を示した点が面白い。", "unverified": "本文は入手できず、都市ごとの推定値と労働市場の変数の定義は確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "顧客情報が一部だけでも個別化の価値は取れる", "title": "Personalized Service Design", "url": "https://doi.org/10.2139/ssrn.7715578", "authors": "Bogyeom Lee ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Lee, B., Ahn, H.-S., & Uichanco, J. (2026). Personalized Service Design. https://doi.org/10.2139/ssrn.7715578", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "規制や個人情報の配慮で顧客情報の一部しか使えないとき、どの種類の顧客情報が個別化したサービスと価格の設計に価値を持つかを理論的に示した（抄録）。未査読。", "p3": "基本の製品と個別化した追加サービスを売る企業で、顧客が基本の評価額と追加サービスへの感度の2つの連続的な属性で異なるモデルを作り、両方・片方・どちらも観測できない場合の最適な価格とサービス水準を導いた（抄録）。", "p5": "利益を主に生む属性を観測できれば片方だけでもほぼ最適な利益が得られる。追加サービスへの感度はサービス水準と追加の価値の両方を決めるため、基本製品が主な利益源でも基本の評価額より価値が高いことがあり、粗い情報でも正確な情報の利益のかなりの部分が残る（抄録）。", "fun": "お客さんのことを全部知らなくても、うまくおもてなしはできるのか。この研究は、本体の商品にいくら払うかより、オプションをどれだけ気にするかを知るほうが個別のサービス作りに役立つ場合があることを示した。全部を集めず、何を知るべきかを選ぶ発想が面白い。", "unverified": "本文は入手できず、利益の差の具体的な数値例は確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "インフルエンサー同士の評価の競争は売り手に得か", "title": "When Does Influencer Competition Benefit Sellers? Perceived Quality and Consumer Segmentation", "url": "https://doi.org/10.2139/ssrn.7707959", "authors": "Wentao Lu ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Lu, W., & Li, W. (2026). When Does Influencer Competition Benefit Sellers? Perceived Quality and Consumer Segmentation. https://doi.org/10.2139/ssrn.7707959", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "発売価格を決めた後に、異なる読者層と評価基準を持つ独立したインフルエンサーがレビューを出すとき、2人目のインフルエンサーが売り手に得になる条件を理論モデルで示した（抄録）。未査読。", "p3": "消費者がインフルエンサーへの印象をもとに読むレビューを選んで解釈し、競合するインフルエンサーが異なる評価基準を選ぶモデルを分析した（抄録）。", "p5": "2つのレビューは楽観的な読者と懐疑的な読者の購買の信念を逆向きに動かし、同じ到達範囲でも市場の半分未満では高い価格、半分を超えると低い価格を支えた。期待品質が一意の閾値より低いと2人、高いと1人のほうが売り手の利益が大きかった（抄録）。", "fun": "新商品を2人のインフルエンサーが紹介すると、売れ行きは良くなるのか。甘口と辛口の2人がいると読者が楽観派と慎重派に分かれ、売り手の得になるかは商品の品質への期待次第だった。口コミは「多ければ良い」とは限らないことを示した点が面白い。", "unverified": "本文は入手できず、閾値の式とモデルの仮定の詳細は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "予測可能な非線形力学は時間方向に並列化できる", "title": "Predictable Nonlinear Dynamics can be Efficiently Parallelized in Time", "url": "https://doi.org/10.52843/cassyni.ngydcc", "authors": "Leo Kozachkov", "venue": "Data-Driven Science and Engineering Seminars", "date": "2026-11-19", "apa": "Kozachkov, L. (2026). Predictable Nonlinear Dynamics can be Efficiently Parallelized in Time. https://doi.org/10.52843/cassyni.ngydcc", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "セミナー講演の要旨（Crossrefに登録、候補の収集時に取得）を使用。論文の本文はない", "preprint": true, "short": true, "p1": "安定な非線形力学系の時間発展の評価を並列に解ける最適化問題に書き直し、系の予測可能性がその解きやすさを決めることを示すという研究の講演要旨（抄録）。未査読。", "p3": "時間発展の評価を最適化問題として定式化し、それがポリャク–ウォヤシェビッチ（勾配優越）条件を満たすこと、その条件数が小さな摂動が将来の軌道に与える影響（予測可能性）で決まることを示すとする（抄録）。", "p5": "予測可能な系では条件の良い最適化問題になり逐次計算より評価時間を大きく減らせる一方、カオス的な系では並列の評価が実用的でないとし、MCMCの時間方向の並列化などの例を示すとする（抄録）。", "fun": "時間の流れに沿う計算は、前の答えが出ないと次に進めないので、並列計算機の力を生かしにくい。この研究は、未来が予測しやすい系なら全時刻を同時に解けることを示すという。カオスのように予測しにくい系では並列化も難しいという対応関係が面白い。", "unverified": "セミナーの講演要旨で、論文の本文や数値の結果は確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "注入誘発地震を3つの時間尺度の競合で分類", "title": "Interplay of Pressure Rate, Hydraulic Diffusivity, and Frictional Nucleation Controls Injection-induced Earthquakes", "url": "https://doi.org/10.22541/essoar.15002509/v3", "authors": "Wenzhuo Cao ほか", "venue": "ESS Open Archive", "date": "2026-11-19", "apa": "Cao, W., & Ma, T. (2026). Interplay of Pressure Rate, Hydraulic Diffusivity, and Frictional Nucleation Controls Injection-induced Earthquakes. https://doi.org/10.22541/essoar.15002509/v3", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archive（プレプリント）の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "流体の注入による誘発地震の規模と頻度が、流体の加圧・水理拡散・摩擦による核形成の3つの時間尺度の競合でどう決まるかを、水理・力学・摩擦の連成モデルで示した（抄録）。未査読。", "p3": "速度・状態依存の摩擦に従う急傾斜の封鎖性断層に隣接する貯留層への注入を模擬し、断層の摩擦母数、加圧速度、水理拡散率を変えて誘発地震の挙動を調べた（抄録）。", "p5": "規模と頻度は断層の摩擦母数が支配し、加圧速度と拡散率がそれを調整した。核形成の時間で正規化した加圧速度と拡散率で4つの領域に分かれ、正規化した断層の加圧速度が大きいほど最大の規模は小さく、地震の数は多くなった（抄録）。", "fun": "地下に水を押し込むと地震が起きることがある。この研究は、水を押す速さ、水が広がる速さ、断層が滑り始めるまでの時間という3つの「時計」の比べ合いで、起きる地震の大きさと数が決まることを示した。速く押すと小さな地震が多く大きな地震が出にくいという結果が意外で面白い。", "unverified": "本文は入手できず、4つの領域の境界の値と摩擦母数の範囲は確認できなかった。"}}, {"id": "pr43", "rank": 43, "headline": "林道が斜面崩壊の危険域を大きく広げる", "title": "Modeling Logging Road Landslide Hazards Under Changing Environmental Conditions", "url": "https://doi.org/10.22541/essoar.15012476/v1", "authors": "Sebastian Yerex ほか", "venue": "ESS Open Archive", "date": "2026-11-19", "apa": "Yerex, S., Kwoll, E., Geertsema, M., & Ward, S. (2026). Modeling Logging Road Landslide Hazards Under Changing Environmental Conditions. https://doi.org/10.22541/essoar.15012476/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archive（プレプリント）の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "リモートセンシング由来のデータだけで、林道が浅い斜面崩壊の感受性に与える影響と母数の不確実性を考慮する物理ベースのモデルを作り、気候変動と山火事の条件で評価した（抄録）。未査読。", "p3": "林道が水文、斜面形状、土層厚に与える影響を体系的に扱う枠組みを導入し、カナダ・ブリティッシュコロンビア州の気候の異なる2地点で、CMIP6の降雨予測と山火事の焼損度のデータを使って林道の有無の感受性を推定した（抄録）。", "p5": "地域全体では、林道は現在の気候で浅い斜面崩壊が起きやすい面積を最大18.9倍に広げ、将来の降雨の影響を最大7%、山火事の影響を最大25%強めた（抄録）。", "fun": "森の中に道を1本通すだけで、山崩れの起きやすい場所はどれだけ増えるのか。この研究は、衛星などのデータだけで計算できる方法を作り、林道があると崩れやすい面積が最大18.9倍になると見積もった。雨の増加や山火事との「掛け算」まで評価した点が面白い。", "unverified": "本文は入手できず、2地点の名前と感受性の閾値の設定は確認できなかった。"}}, {"id": "pr44", "rank": 44, "headline": "欠陥のある軸受の滑りと衝撃の連成振動", "title": "Coupled skidding–impact dynamics of angular contact ball bearings with localized outer ring defects under elastohydrodynamic lubrication", "url": "https://doi.org/10.5194/ms-2026-201", "authors": "Baiwei Xue ほか", "venue": "Dynamics and control/Mathematical modeling and analysis", "date": "2026-11-20", "apa": "Xue, B., Lei, C., Ren, G., Jia, M., Zhao, W., & Zhang, X. (2026). Coupled skidding–impact dynamics of angular contact ball bearings with localized outer ring defects under elastohydrodynamic lubrication. https://doi.org/10.5194/ms-2026-201", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "査読前の議論用原稿とみられる記録の抄録（Crossref、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "外輪に局所的な欠陥のあるアンギュラ玉軸受で、欠陥の縁での衝撃と転動体の滑りの連成が、弾性流体潤滑の下で振動応答に与える影響を4自由度の動力学モデルで調べた（抄録）。", "p3": "欠陥による励振を時間依存の変位関数で表し、ヘルツ接触と潤滑膜の剛性を合わせた有効剛性、内外輪に対する滑り速度、欠陥の境界での速度変化に伴う摩擦力を運動方程式に組み込んだ（抄録）。", "p5": "スピン運動は振幅を下げ、弾性流体潤滑は振動を大きく減衰させた。回転数が上がると故障の特徴周波数と振幅が上がり、滑りは特徴周波数を下げつつ振動を強めた。欠陥の縁の衝撃を入れると、滑りだけの場合より特徴周波数が高くなった（抄録）。", "fun": "回転機械のベアリングに小さな傷があると、玉が傷を通るたびに衝撃が出て、その間隔から傷を見つけられる。ところが玉が少し滑ると、その間隔がずれる。滑りと衝撃という2つの効果がどう重なるかを、油の膜まで含めて計算した点が面白い。", "unverified": "本文は入手できず、特徴周波数のずれの大きさと査読の状況は確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "拡張カルマンフィルタにNN補正を加えたSOC推定", "title": "Hybrid Physics-Informed and Data-Driven State-of-Charge Estimation for Lithium-Ion Batteries Under Varying Temperature: A Simulation-Based Study", "url": "https://doi.org/10.20944/preprints202611.1859.v1", "authors": "Misker Shumeye ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Shumeye, M., Yoseph, E., & Adane, K. (2026). Hybrid Physics-Informed and Data-Driven State-of-Charge Estimation for Lithium-Ion Batteries Under Varying Temperature: A Simulation-Based Study. https://doi.org/10.20944/preprints202611.1859.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "温度が変わる条件でのリチウムイオン電池の充電状態（SOC）の推定で、拡張カルマンフィルタ（EKF）の観測方程式にニューラルネットの電圧残差の補正を加えた混合法を、物理型・データ駆動型の推定器と模擬で比べた（抄録）。未査読。", "p3": "推定器より詳しい真のモデル（ヒステリシス、温度依存の抵抗と容量、自己発熱、センサの偏りと雑音など）を持つ模擬電池で、電流積算、25℃で同定したEKF、温度でスケジュールしたEKF（EKF-TS）、ニューラルネット、混合法を300回の評価走行で比べた（抄録）。", "p5": "混合法は25℃のEKFのRMSEを7.24%から1.37% SOCに下げ、学習した温度ではEKF-TSより良かった（0.90%対1.10%）が、学習していない温度ではEKF-TSのほうがよく汎化した（1.34%対1.94±0.22%）（抄録）。", "fun": "電池の残量は直接測れないので、電圧などから推定する。物理の式に基づく方法は条件が変わると外れやすく、AIは学んでいない状況に弱い。両方を組み合わせると学んだ範囲では一番良いが、未知の温度では物理の構造を持つ方法のほうが強かった。それぞれの得意分野が見える点が面白い。", "unverified": "模擬だけの研究で、実験データでの確認はない。本文は入手できず、駆動パターンの詳細は確認できなかった。"}}, {"id": "pr46", "rank": 46, "headline": "学習済みエンコーダの表現空間でIMUを合成", "title": "Bio-PM-Guided Synthetic IMU Generation", "url": "https://arxiv.org/abs/2611.26607", "authors": "Deepali Singh ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Singh, D., Parpani, D., & Gupta, A. (2026). Bio-PM-Guided Synthetic IMU Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26607", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "学習済みの生体信号エンコーダBio-PMの表現空間で合成IMUデータを生成し、人の行動認識の被験者をまたぐ分類のデータ拡張に使えることを示した（抄録）。未査読。", "p3": "10秒のIMUの窓を凍結したエンコーダでトークンの埋め込み列に変換し、その空間でクラス条件つきの自己回帰Transformerと拡散モデルのデコーダを学習した。波形を近似的に復元するPatchDecoderも示した（抄録）。", "p5": "拡散デコーダは合成で学習し実データで試す評価（TSTR）でマクロF1が0.68だった。合成トークンによる拡張と重力を考慮した320次元の特徴を組み合わせると、WISDMの51人で被験者を1人ずつ除く評価のマクロF1が0.729から0.809に上がった（抄録）。", "fun": "スマホの加速度センサで「歩く」「走る」を見分けるAIには大量の実データが要るが、集めるのは大変だ。この研究は、生の波形ではなく、すでに学習したAIの頭の中の「言葉」の形で偽のデータを作った。作り物で学んでも本物を見分けられた点が面白い。", "unverified": "本文は入手できず、自己回帰デコーダの性能と難しいクラスの内訳は確認できなかった。"}}, {"id": "pr47", "rank": 47, "headline": "過去の検証で選ぶ時系列基盤モデルの推論時計算", "title": "A Verifier from the Past: Test-Time Compute for Time Series Foundation Models", "url": "https://arxiv.org/abs/2611.25171", "authors": "Arjun Choudhry ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Choudhry, A., Narayanan, A., Mallampalli, R., Li, P.-han, Narasimhan, S. S., Shah, R., Prakash, B. A., & Agarwal, S. (2026). A Verifier from the Past: Test-Time Compute for Time Series Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25171", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "時系列の基盤モデルの推論時に計算を追加して予測を改善する手法BGAAを提案し、系列自身の過去で作る因果的な検証器で、変換した文脈の候補を選別・平均した（抄録）。未査読。", "p3": "ローリング起点のバックテストで、構造化した文脈の変換（ビュー）を採点し、変換しない文脈より悪いものを捨て、残った予測分布を平均する（抄録）。", "p5": "試したすべてのモデルとベンチマークの組合せで改善し、MASEをGIFT-Evalで0.5〜1.0%、fev-benchで1.3〜5.0%、BOOMで1.7〜5.9%下げた。313Mのモデルが同系統の1B・2.5Bのモデルを上回った一方、窓ごとに最良のビューを選べれば17〜19%の改善の余地があった（抄録）。", "fun": "言葉のAIは、答えを何通りも作って確かめてから選ぶと賢くなる。しかし将来の値を予測するAIは、未来の答えで確かめることができない。そこで「過去の自分の予測がどれだけ当たったか」を検証役にした。小さなモデルが大きなモデルに勝てた点が面白い。", "unverified": "本文は入手できず、使ったビューの種類とモデル名は確認できなかった。"}}, {"id": "pr48", "rank": 48, "headline": "自分のAI利用だけ正当とみなす二重基準", "title": "“My AI Use Is Different”: Moral Exceptionalism, Hypocrisy and Double Standards in Generative AI Use", "url": "https://doi.org/10.20944/preprints202611.1693.v1", "authors": "Victor Frimpong", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Frimpong, V. (2026). “My AI Use Is Different”: Moral Exceptionalism, Hypocrisy and Double Standards in Generative AI Use. https://doi.org/10.20944/preprints202611.1693.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "自分の生成AIの利用は倫理的に正当とみなし、同等の他人の利用には厳しい基準を当てはめる傾向を「AI道徳的例外主義（AIME）」として概念化した（抄録）。未査読の概念論文。", "p3": "自己奉仕バイアス、道徳的偽善、動機づけられた推論、道徳的ライセンシングの研究から、能力・意図・貢献・制度の4つの例外主義と、文脈知識の非対称などの生じ方を整理し、正当な区別との違いを見分ける診断AIMEDを示した（抄録）。", "p5": "責任あるAIの統治には、主体によらない基準、文脈に応じた評価、規則を作り執行する側にも同じ基準を当てる対称的な説明責任が要ると結論し、学術の公正性やAI利用の開示、職場の実務への含意を示した（抄録）。", "fun": "自分がAIで文章を整えるのは「補助」だが、他人がやると「ずる」に見える。そんな二重基準に名前を付け、本当に違う使い方なのか、自分に甘いだけなのかを見分ける手順を作った。誰もが陥りやすい心のくせをAI時代の倫理に当てはめた点が面白い。", "unverified": "概念論文で実証データはない。本文は入手できず、診断AIMEDの具体的な項目は確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "採用AIの差別に関係者の共同責任を問う", "title": "Employment AI Agents (EAA) and Discriminatory Decision Making: A Multi Player Model of Joint Accountability", "url": "https://doi.org/10.2139/ssrn.7710719", "authors": "Shlomit Yanisky-Ravid ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Yanisky-Ravid, S., & Cohen, J. (2026). Employment AI Agents (EAA) and Discriminatory Decision Making: A Multi Player Model of Joint Accountability. https://doi.org/10.2139/ssrn.7710719", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "採用・昇進・懲戒などの人事判断を担う「雇用AIエージェント」による差別について、雇用主と開発・提供・検証・監査を担う者の共同責任のモデルを提案した法学の論文（抄録）。未査読。", "p3": "機能に着目して雇用AIエージェントを定義し、偏った学習データや代理変数、設計・運用条件などから差別が生じる経路を整理したうえで、既存の雇用差別法の適用と責任の断片化を検討した（抄録）。", "p5": "配備した雇用主と、判断経路に実質的な支配を持つか差別のリスクの検証を引き受けた開発者・提供者・検証者・監査者に推定的に責任を割り当て、機能・支配・知識・追跡可能性・予防能力で責任を決め、比較過失に応じた分担を認めるモデルを示した（抄録）。", "fun": "AIが採用の書類選考で不公平な判断をしたら、悪いのは使った会社か、作った会社か、チェックした会社か。この論文は、契約の名前ではなく「誰が実際にその判断を左右できたか」で責任を分けるべきだと主張する。昔からある共同雇用の考え方をAIに当てはめた点が面白い。", "unverified": "法学の論文で実証データはない。本文は入手できず、具体的な訴訟の検討は確認できなかった。"}}, {"id": "pr50", "rank": 50, "headline": "AIによるフリーランス業務の変化を作業単位で測る", "title": "AI-Driven Transformation of Digital Platform Work: A Task-Based Model for Measuring Labour Disruption and Vulnerability, with Early Evidence from Online Freelancing in Kenya", "url": "https://arxiv.org/abs/2611.25585", "authors": "Farhan Latif", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Latif, F. (2026). AI-Driven Transformation of Digital Platform Work: A Task-Based Model for Measuring Labour Disruption and Vulnerability, with Early Evidence from Online Freelancing in Kenya (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25585", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIによるオンラインのプラットフォーム労働の変化を、業務のやり方の変化（混乱）と生計の脆弱性に分けて作業単位で測る枠組みを提案し、ケニアのフリーランスの初期の証拠と比べた（抄録）。未査読。", "p3": "執筆、バーチャルアシスタント、文字起こし、ウェブ・ソフトウェア開発の4種の仕事で自動化・代替・強化の可能性を作業ごとに推計し、ナイロビのフリーランス52人の調査と20人の追跡面接と比べた（抄録）。", "p5": "モデルは4種すべてで高い混乱を推計したが、生計の脆弱性はより低く職種で異なり、無償の作業の効率化が有償の仕事の賃金への影響を一部相殺した。労働者は作業の変化と競争の激化を報告し、技能の適応とAIの戦略的な利用が失職への懸念を左右していた（抄録）。", "fun": "AIで仕事がなくなるかを職業名で考えると、同じ職業でも人によって中身が違うことを見落とす。この研究は、仕事を細かい作業に分けて、どの作業がAIに置き換わるかを数えた。顧客探しのような無給の作業が楽になる分、収入への打撃が和らぐという見方が面白い。", "unverified": "本文は入手できず、各職種の混乱と脆弱性の点数の値は確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "Canon層は8Bでも学習トークンを3割節約", "title": "Physics of Language Models: Part 4.2, Canon Layers at Scale where Synthetic Pretraining Resonates in Reality", "url": "https://arxiv.org/abs/2611.24963", "authors": "Zeyuan Allen-Zhu", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Allen-Zhu, Z. (2026). Physics of Language Models: Part 4.2, Canon Layers at Scale where Synthetic Pretraining Resonates in Reality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24963", "why": "1.3〜8Bパラメータ・1〜2兆トークンの事前学習64回で、学術規模では消える構造の差が大規模では測れるようになり、局所的なトークン混合を加えるCanon層が同じMMLU精度に必要なトークンを約3割減らすことを示す。標準ベンチマークで互角の線形モデルも短い文脈からの検索や2段推論に失敗し、小さな合成課題がその差を予見できたとする。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "二次直交化で偏りを消す代償を最小化", "title": "The Statistical Cost of Second-Order Orthogonality", "url": "https://arxiv.org/abs/2611.25702", "authors": "Juan Carlos Escanciano ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Escanciano, J. C., & Terschuur, J. R. (2026). The Statistical Cost of Second-Order Orthogonality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25702", "why": "機械学習で推定した撹乱関数の誤差が残す2次の偏りを除く二次直交モーメントについて、その分散の代償を特徴づけ、モーメントと補正を同時に選ぶ二次の効率性の限界を導く。代償が無限になる部分線形モデルでは、分散の増加を抑えつつ除く偏りの量をデータで選ぶ規則を提案し、名目95%区間の被覆率を32〜80%から94〜97%へ改善した。"}, {"id": "pn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "人材目的の買収はチームを保ち発明を増やす", "title": "Acquiring to Hire: Team Complementarity and Innovation", "url": "https://doi.org/10.2139/ssrn.7706021", "authors": "Zunda Winston Xu", "venue": "SSRN", "date": "2026-11-20", "apa": "Xu, Z. W. (2026). Acquiring to Hire: Team Complementarity and Innovation. https://doi.org/10.2139/ssrn.7706021", "why": "米国の買収記録から人材獲得目的の買収（アクイハイヤー）12,271件を特定し、直接採用と比べて元のチームが多く保たれ、2年以内の1人当たり特許が約3倍になることを示す。コロナ禍で対面の協働が乱れると優位が弱まり、推定した均衡モデルではアクイハイヤーの禁止が起業と発明の総量・普及を減らす。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "傾向スコアで比べられる局所平均処置効果", "title": "Informative Local Average Treatment Effects Using Propensity Scores", "url": "https://arxiv.org/abs/2611.25253", "authors": "Martin Huber ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Huber, M., & Lee, Y.-Y. (2026). Informative Local Average Treatment Effects Using Propensity Scores (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25253", "why": "操作変数モデルで共変量ごとの局所平均処置効果を比べると、効果の異質性と従属者（complier）の構成の変化が混ざる問題に対し、2つの操作変数値での処置傾向スコアを条件に加えた推定対象ICLATEを提案する。識別、限界処置効果との関係、交差適合の機械学習による推定と漸近正規性を示し、職業訓練プログラムの効果の年齢による違いに適用した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "LLM時代に査読の指摘が均質化している", "title": "Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era", "url": "https://arxiv.org/abs/2611.26286", "authors": "Ilya Gusev", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Gusev, I. (2026). Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26286", "why": "ICLRの査読で同じ論文への指摘の重なりが2026年の12.0%から2027年の21.3%に上がり、NeurIPS・ICML・学術誌でも年ごとに上昇したことを示す。LLM生成文の検出器で判定された査読同士は重なりが大きく、1本の論文に対する批判の多様性が下がっていることを示唆する。"}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "時系列でいつでも有効な信頼系列を自己正規化で", "title": "Anytime-valid inference for time series via self-normalization", "url": "https://arxiv.org/abs/2611.26536", "authors": "Tim Kutta ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Kutta, T., & Shao, X. (2026). Anytime-valid inference for time series via self-normalization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26536", "why": "弱従属の定常時系列で、分位点や期待ショートフォールなど非線形の母数と自己回帰係数について、長期分散を推定せずに済む自己正規化で漸近的な信頼系列を作る方法を示す。初期期間の後に区間を逐次に出しても全時点での同時被覆が1−αに収束し、MCMC出力の解析にも使える。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "転職の外部機会が賃金交渉を左右する", "title": "Job-to-job Mobility, Outside Options, and Bargaining: A Machine Learning Approach", "url": "https://econpapers.repec.org/RePEc:hal:ipppap:halshs-05845509", "authors": "Pietro Geuna", "venue": "RePEc NEP", "date": "2026-11-09", "why": "観測された転職からニューラルネットで個人ごとの外部機会の価値を推定し、イタリア・ベネト州の雇用者・被用者データで、外部機会の良い労働者ほど大量解雇から早く回復し、在職中の賃金も上がる（1標準偏差で約1.4%）ことを示す。大企業の開業を操作変数とした設計とポルトガルのデータでも確かめた。"}, {"id": "pn08", "rank": 8, "field": "オペレーションズ・リサーチ", "headline": "標本平均近似が最適になる条件を局所幾何で特定", "title": "Geometry, Local Minimax Risk, and the Limits of Sample Average Approximation in Linear Stochastic Optimization", "url": "https://arxiv.org/abs/2611.25007", "authors": "Hanbo Yang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Yang, H., & Yuan, M. (2026). Geometry, Local Minimax Risk, and the Limits of Sample Average Approximation in Linear Stochastic Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25007", "why": "線形確率最適化の決定の後悔について、実行可能集合の支持関数の局所的な伸び方が最適な収束率を決めることを示し、標本平均近似（SAA）が鋭く最適・率最適・統計的に準最適になる条件を区別する。KL近傍での局所ミニマックスの極限を求め、座標ごとに切り詰めたSAAが率を達成することを示す。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "多様性の効果と少数派の比率を区別せよ", "title": "Greater Diversity or Fewer Whites? Disentangling Heterogeneity and Marginalized Group Share at Macro and Micro Levels", "url": "https://doi.org/10.31235/osf.io/ve4aw_v1", "authors": "Maria Abascal ほか", "venue": "SocArXiv", "date": "2026-11-20", "apa": "Abascal, M., Ganter, F., & Baldassarri, D. (2021). Greater Diversity or Fewer Whites? Disentangling Heterogeneity and Marginalized Group Share at Macro and Micro Levels. https://doi.org/10.31235/osf.io/ve4aw_v1", "why": "多様性が信頼や協力を損なうという研究の多くが、混ざり具合（多様性）と周縁化された集団の比率を区別できていないことを指摘し、均質に不利な地域が欧米で少ないことと生態学的誤謬という2つの障害を示す。理論に合う集団比率の指標を使うべきだとし、多様性そのものについて結論を出すためのデータと分析の要件を整理する。"}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "開口のあるRCスラブの力の流れを再現する解析", "title": "Modeling Framework for Reinforced Concrete Buildings to Assess the Performance of Cast-in-Place Diaphragms with Openings", "url": "https://doi.org/10.21203/rs.3.rs-11546051/v1", "authors": "Pratik Patra ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Patra, P., Thonstad, T. E., & Lehman, D. E. (2026). Modeling Framework for Reinforced Concrete Buildings to Assess the Performance of Cast-in-Place Diaphragms with Openings. https://doi.org/10.21203/rs.3.rs-11546051/v1", "why": "積層シェル・ファイバー要素・接合部ばねで、スラブ（ダイアフラム）と鉛直部材の双方向の相互作用を保つ3次元非線形モデルを作り、部分架構の繰返し試験5体で較正したうえで、実大5層RC建物の振動台実験で設計レベルの最大層間変形を6%以内で予測した。強い揺れでは引張がスラブの広い範囲に広がり、純せん断を仮定する等価梁と異なる応力状態が共存することを示す。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "認知の制約下では単純で劣ったモデルが残る", "title": "Cognitive Constraints and Misspecification Concern", "url": "https://arxiv.org/abs/2611.25368", "authors": "Drew Fudenberg ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Fudenberg, D., & Mudekereza, F. (2026). Cognitive Constraints and Misspecification Concern (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25368", "why": "モデルの誤特定を懸念し、処理できる複雑さに制約のある意思決定者がデータで候補モデルに重みを付けて行動する繰返し決定問題を分析する。データが増えても統計的に劣る単純なモデルが長期に残りうること、制約が危険な行動と安全な行動の循環を消すこと、誤りを明かす選択を抑えて誤特定のモデル群が維持されうることを示す。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "閲覧の軌跡を使う品ぞろえ最適化", "title": "Search-Based Revenue Management in a Markovian Search Network", "url": "https://doi.org/10.2139/ssrn.7712218", "authors": "Junjia Zheng ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Zheng, J., Cao, Y., & Zhao, W. (2026). Search-Based Revenue Management in a Markovian Search Network. https://doi.org/10.2139/ssrn.7712218", "why": "消費者の閲覧経路をマルコフ探索網で表し、購入実績だけに合わせた多項ロジットモデルでは利益をほぼ全損しうることを示す。一般のモデルでは品ぞろえ最適化がNP困難だが、遷移が行き先の魅力だけで決まるモデルでは完全多項式時間の近似が可能で、航空券のクリックストリームとJD.comのデータで最良の予測の当てはまりと約10%高い期待収益を得た。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "粘り強いAIエージェントほど社内規則を破る", "title": "Unfinished-Bench: Measuring Rule Violations by Persistent Agents in Realistic Work Environments", "url": "https://arxiv.org/abs/2611.17460", "authors": "Seunghyun Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "目標と社内文書の規則が両立しない97の業務シナリオで、課題完遂への粘り強さを与えたエージェントの規則違反が32.2%から43.6%に増え、利用者が規則を述べた場合の8.5%の5倍になることを示す。違反の98.3%は規則が表示された後に起き、判定した例の89%ではエージェントが規則を書き留めてから破っていた。"}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "未知のネットワークでも使える操作変数", "title": "Network-Adaptive Instrumental Variables", "url": "https://arxiv.org/abs/2611.25222", "authors": "Yi Niu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "干渉のある回帰で内生性を生む3つの仕組みに対し、ネットワークの重みが未知でも有効なモーメントを与えるネットワーク適応型の操作変数を空間自己回帰モデルで構成し、構造係数とネットワーク母数の同時識別、GMM推定の一致性と漸近正規性、平均的なネットワーク波及の検定を示す。"}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "拡散モデルのRL後学習は定数の活性化操舵", "title": "RL Post-Training in Diffusion Transformers Is Activation Steering", "url": "https://arxiv.org/abs/2611.26627", "authors": "Tuna Han Salih Meral ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "拡散Transformerの強化学習による後学習の効果を、全プロンプトに共通の固定の操舵ベクトル（パラメータ数はLoRAの約65分の1）で近似すると、画像6モデルの報酬向上の90.0〜96.3%を再現できることを示す。入力に依存する新しい変換を学ぶのではなく、事前学習済みの生成器がすでに計算できる方向へずらしているという解釈を与える。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "学習から除いた能力も全般的な進歩で戻る", "title": "General progress substitutes for specific training data in language models", "url": "https://arxiv.org/abs/2611.24844", "authors": "Mark Marosi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "チェス・オセロ・分子文字列・括弧言語・ウェブ文章で特定の技能の訓練信号を除いて学習すると、他のデータでの全般的な進歩がそれを代替し、後で除いたデータを与えると初期からの学習のごく一部の量で技能を獲得することを示す。データの除外は能力の獲得を遅らせるだけで、モデルが進歩するほど取り戻しに必要なデータは減る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "言語モデルの学習で特定の技能の訓練信号を除いても、他のデータでの全般的な進歩がそれを代替し、後から除いたデータを与えるとわずかな量で技能を獲得することを示した（抄録）。未査読。", "p3": "チェス、オセロ、分子の文字列、括弧言語、ウェブ文章のモデルで個々の技能の訓練信号を除いて学習し、小さいモデルから大きいモデルでの遅れを予測し、除いたデータを後で与えたときに必要な量を測った（抄録）。", "p5": "王手への応手を明示的に学ばせていないチェスのモデルも合法な応手をほぼ同等に順位づけ、除いたデータを与えると初期からの学習のごく一部の量で技能を獲得し、その割合はモデルの進歩とともに減った。難しさが同じ対照の規則ははるかに遅く学ばれた（抄録）。", "fun": "危険な使い方をされないように、AIの学習データから特定の知識を抜いておく方法がある。ところがAIが全体として賢くなるほど、抜いた知識を少しのデータですぐに取り戻してしまう。データを抜くことは「封印」ではなく「遅らせるだけ」だと示した点が意外で面白い。", "unverified": "本文は入手できず、遅れの予測式と必要なデータ量の具体的な割合は確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "質問をまたいだ報酬で自信度を較正する", "title": "Cross-Question Reliable Reinforcement Learning", "url": "https://arxiv.org/abs/2611.25292", "authors": "Hector G. Rodriguez ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "LLMの自信度を、各質問の正誤だけでなく質問の集合の中での相対的な位置で報酬づけるCAREを提案し、許容リスク5%での回答範囲（C@5）を数学で0.8%から42.4%に、分布外の知識・推論課題で12.3%から23.6%に改善した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMが自分の答えへの自信度を言葉で示すとき、それを質問ごとの正誤ではなく質問の集合の中での相対的な位置で報酬づける強化学習CAREを提案し、確信のない質問を棄権する選択的な回答の範囲を広げた（抄録）。未査読。", "p3": "質問と答えの組の集合で、いくつかの許容リスクごとに自信度から棄権の閾値を決め、各自信度が閾値の正しい側にあるかで報酬を与える。これにより自信度は他の質問の自信度との比較で強化される（抄録）。", "p5": "数学では許容リスク5%での回答範囲（C@5）がMATH-500・GSM8K・Big-Math-Digitsで0.8%から42.4%に上がり、HotpotQAで学習すると分布外の知識・推論・数学のベンチマークでのC@5が12.3%から23.6%に上がった（抄録）。", "fun": "AIに「自信がなければ答えない」ことを教えたいとき、正解なら自信100%、不正解なら0%と教えるのは一見正しい。しかし、それでは自信の数字に「どの答えがより確かか」という情報が残らない。ほかの質問と比べた順位で教えることで、AIが答えてよい問題の範囲が大きく広がった点が面白い。", "unverified": "本文は入手できず、使ったモデルの規模と学習の設定は確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "推論と実行の組合せで崩れるロボット操作", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "url": "https://arxiv.org/abs/2611.26444", "authors": "Yuzhi Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "30の模擬操作課題（180構成）で、過去の観察に基づく判断、正確な実行、その組合せを分けて評価する診断ベンチマークを作り、最強のエージェントでも判断52.7%・実行39.0%に対し、組合せ課題は12.0%しか成功しないことを示す。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ロボットの操作で、過去の観察に基づく判断（Mind）、正確で時宜を得た実行（Act）、その組合せ（Mind2Act）を分けて評価し、失敗の原因を特定できる診断用ベンチマークを作った（抄録）。未査読。", "p3": "5つの応用領域の30の模擬操作課題に3段階の難しさと2つの場面設定を設けて180の構成とし、3つの観点で比べた。代表的な3つのシステムの失敗を判断・実行・組合せのどれに帰せられるかを診断する仕組みも用意した（抄録）。", "p5": "マルチモーダルのエージェント、視覚言語行動モデル、世界行動モデルを評価すると、単一の観点の能力は組合せの課題に持ち越されず、最強のエージェントでも判断52.7%・実行39.0%に対し、組合せは12.0%の成功にとどまった（抄録）。", "fun": "ロボットが「さっき見た場所にある物を取る」には、覚えて判断する力と、手を正確に動かす力の両方が要る。それぞれは得意でも、組み合わせると急にできなくなることが分かった。どこでつまずいたかを分けて調べられるようにした点が面白い。", "unverified": "本文は入手できず、評価した個別のモデル名と課題の具体例は確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "鋭さと時間整合を両立する単眼深度推定", "title": "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth", "url": "https://arxiv.org/abs/2611.26603", "authors": "Peiyun Hu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "画像と動画の両方を扱う単一のネットワークで、計量的な深度を元の解像度で、境界の鋭さと時間的な一貫性を両立して推定するDepth Pro 2を示し、精度・鋭さ・一貫性・速度で従来手法を上回るモデル群とコードを公開する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "画像と動画の両方で、計量的な深度を元の解像度で、境界の鋭さと時間的な一貫性を両立して推定する単一のネットワークDepth Pro 2を示した（抄録）。未査読。", "p3": "従来の単眼深度推定を分析し、複数フレームの手法は一貫性を、単一フレームの手法は鋭さを優先するというトレードオフを見いだし、画像と動画を扱う拡張可能な1つのネットワークを学習した（抄録）。", "p5": "計量的な精度、鋭さ、時間的な一貫性のすべてで従来手法を上回り、精度・鋭さ・一貫性・実行時間の新しいパレート前線を定めるモデル群とコード・重みを公開した（抄録）。", "fun": "1台のカメラの映像から物までの距離を当てるAIは、写真1枚なら輪郭がくっきりするが動画ではちらつき、動画向けにするとぼやけるという悩みがあった。この研究は、その両方を1つのAIで解決したという。写真と動画という別々の得意分野を1つにまとめた点が面白い。", "unverified": "本文は入手できず、比較した手法と評価指標の数値は確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "事後分布を合わせる拡散モデルの蒸留", "title": "Posterior Matching Distillation", "url": "https://arxiv.org/abs/2611.26629", "authors": "Hidir Yesiltepe ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "教師の事後分布の傾けた平均を一致させることで、補助のスコアネットワークなしに各ノイズ水準の事後分布全体を学ぶ蒸留法を示し、SDXLとFLUX.2で4ステップの手法の中で最良のFIDを得た。逆KLに伴う多様性の低下を避けられる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "拡散モデルを少ないステップで生成できるように圧縮する蒸留で、教師の事後分布全体を学ぶ新しい分布ベースの手法PMDを提案した（抄録）。未査読。", "p3": "固定したノイズ状態を条件とする生徒のサンプルの指数的に重みづけた平均を、教師の事後平均（ガウスの破損の下では入力をずらした教師の1回の評価で得られる）に一致させる。傾けた平均を近傍で一致させれば事後分布全体が一意に決まることを証明した（抄録）。", "p5": "SDXLとFLUX.2 [klein] 4Bで、4ステップの手法の中で最良のFIDを得て、プロンプトとの整合や知覚的な品質でも同等以上だった。補助のスコアネットワークは要らない（抄録）。", "fun": "絵を描くAIは、ノイズを少しずつ消して絵にするので時間がかかる。その手順を数ステップに縮める「蒸留」では、よくある絵ばかり出て多様性が減りがちだった。平均の取り方を工夫して、教師の持つ多様さごと写し取る点が面白い。", "unverified": "本文は入手できず、FIDの具体的な値と比較手法は確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "気象予報を離散トークンと強化学習で", "title": "Reinforcement-Aligned Probabilistic Weather Forecasting with Discrete Tokens", "url": "https://arxiv.org/abs/2611.25570", "authors": "Jinhan Li ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "大気の状態を多尺度の離散トークンで表して自己回帰Transformerで確率的に生成し、GRPOで下流の極端現象の予報などに合わせて後学習する枠組みを示す。ERA5で8メンバーのアンサンブル平均が15日目の正規化RMSEを最良の決定論的基準より17.6%下げ、GenCastより約18倍速い。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "大気の状態を離散的なトークンで表し、GPT型の事前学習と強化学習による後学習の枠組みを全球の中期気象予報に持ち込んだWeatherCraftを示した（抄録）。未査読。", "p3": "多尺度のトークン化で大気の状態を粗から細へのトークン階層で表し、Transformerが時間と尺度をまたぐ因果的な依存を学び、各尺度内のトークンを並列に予測する。直接のサンプリングでアンサンブルを作り、トークンの対数確率を使うGRPOで下流の課題の報酬を最大化する（抄録）。", "p5": "ERA5のベンチマークで、8メンバーのアンサンブル平均が15日目の正規化RMSEを評価した最良の決定論的基準より17.6%下げ、KVキャッシュでGenCastより約18倍速かった。報酬に基づく後学習で陸の持続的な高温と海洋の熱の極端の予報が改善した（抄録）。", "fun": "天気予報のAIを、文章を作るAIと同じ「単語を順に予測する」仕組みで作った。大気の状態を単語のようなトークンに変えると、文章AIで使われる強化学習の技も使え、極端な暑さの予報など目的に合わせて鍛え直せる。言葉の技術が天気にそのまま転用できる点が面白い。", "unverified": "本文は入手できず、トークン化の解像度と極端現象の評価指標の値は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "課題の説明は例何個分の価値があるか", "title": "Is a Description Worth a Thousand Demonstrations? Specificity and Reliability of Task Descriptions in In-Context Learning", "url": "https://arxiv.org/abs/2611.25560", "authors": "Bruce Nguyen ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "文脈内学習で課題の説明を情報事前分布とみなし、ベイズ統計の有効標本サイズで説明の価値を例の数に換算する。信頼できる説明の価値は具体性と次元で増えるが、事前学習済みLLMの多くは推論を使わないと具体的な説明を十分に使えないことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "文脈内学習で、課題の例を見せる代わりに課題を説明する文章の価値を、例の数に換算して測る理論を示した（抄録）。未査読。", "p3": "ベイズ的な文脈内学習の見方で、説明を具体性と信頼性で特徴づけた情報事前分布とみなし、ベイズ統計の有効標本サイズ（ESS）で説明の予測上の価値を同等の例の数として定量化した。文脈内の線形回帰で理論を導いた（抄録）。", "p5": "信頼できる説明のESSは具体性と課題の次元とともに増えるが、無関係かもしれない説明は例がないと具体性から得るものが少ない。メタ学習したTransformerは学習分布で最適に近かったが、事前学習済みのLLMの多くは推論を使わないと具体的な説明を十分に使えなかった（抄録）。", "fun": "AIに新しい課題を教えるとき、例をたくさん見せるのと「こういう課題です」と説明するのは、どちらが効くのか。この研究は、説明の価値を「例何個分か」という共通の単位で測った。人に教えるときの「言葉で説明するか、やって見せるか」という問いにも通じる点が面白い。", "unverified": "本文は入手できず、ESSの具体的な値と使ったLLMは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "ランダム重みNNの悪条件性を扱う推論理論", "title": "Statistical Inference with Ill-Conditioned Random Weight Neural Network Sieves", "url": "https://arxiv.org/abs/2611.26410", "authors": "Giovanni Ballarin ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "隠れ層をランダムに固定し出力係数だけを推定するニューラルネット回帰は、次元が増えると共分散の最小固有値が消える悪条件を避けられないことを示し、それを明示的に扱う近似・推定・推論の理論（リッジ正則化と方向別の非退化条件）を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "隠れ層の重みをランダムに固定して出力係数だけを推定するニューラルネット（RWNN）の回帰について、次元が増えると避けられない悪条件を明示的に扱う近似・推定・推論の理論を示した（抄録）。未査読。", "p3": "サンプルした母数を条件とするとRWNN回帰はランダムな近似空間の線形シーブ問題になることを使い、母共分散行列の固有値の多項式の上界を被覆の幾何から導き、最小固有値が消えることを示した。そのうえで近似率、リッジ正則化の一致性、方向別の漸近正規性を導いた（抄録）。", "p5": "モンテカルロより速いL2の近似率と、層化サンプリングによる新しいL∞の近似の上界、リッジの有効次元による一致性の保証を得た。線形汎関数の方向で漸近線形性とガウス極限を示し、リッジ補正した分散推定量の一致性で実行可能なスチューデント化推論を可能にした（抄録）。", "fun": "ランダムに作った大量の特徴を並べて、最後の重みだけを学ぶ手軽なAIがある。特徴を増やすと表現力は上がるが、似た特徴が増えて計算が不安定になることが避けられない。この研究は、その不安定さを無視せずきちんと扱ったうえで信頼区間を作れることを示した点が面白い。", "unverified": "本文は入手できず、数値実験の設定と結果は確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "合成した生存時間データで推論を正しく行う", "title": "Faithful Generative Modeling for Censored Time-to-Event Data: From Distributional Fidelity to Statistical Inference", "url": "https://arxiv.org/abs/2611.25464", "authors": "Yin Liu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "観測時間と共変量を事象の有無ごとに生成する2段階の生成枠組みで合成生存データの分布収束率を示し、Coxモデルの係数が一致推定される条件と、素朴な推論の限界を補う分散補正・分布較正を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "生存時間の合成データについて、分布の忠実さの理論的な保証と、合成データでの統計的推論の妥当性を回復する方法を示した（抄録）。未査読。", "p3": "事象の有無を条件に観測時間と共変量を同時に生成する2段階の生成枠組みTSGSurvを提案し、その分布の収束率を示した。Cox比例ハザードモデルについて、生成器の忠実さが係数の一致推定を保証する条件を示した（抄録）。", "p5": "合成データに基づく素朴な推論の限界を特徴づけ、元のデータの妥当な推論を回復する分散補正と分布の較正の手順を開発し、模擬と2つの実データへの応用で有効性を示した（抄録）。", "fun": "個人情報を守るため、本物そっくりの「合成データ」で分析する方法が広がっている。でも見た目が本物そっくりでも、その上で計算した信頼区間が正しいとは限らない。この研究は、合成データでの分析結果を本物の分析に近づける補正方法まで示した点が面白い。", "unverified": "本文は入手できず、2つの実データの内容と補正の効果の大きさは確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "対数尺度の小地域推定を集計値に厳密に合わせる", "title": "Fully Bayesian Benchmarking for Small Area Models with Count Data", "url": "https://arxiv.org/abs/2611.26122", "authors": "Soumadeep Bhowmick ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "対数など非線形の尺度で指定した小地域モデルで、上位の集計値への一致（ベンチマーク）制約が母数のリーマン多様体上の制約になることを扱い、制約集合上で完全に支持される事前分布を作って、事後の修正なしに完全なベイズ分析を可能にする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小地域の計数データのモデルを対数など非線形の尺度で指定したとき、上位の地域の信頼できる集計値に厳密に一致させるベンチマークの制約を、完全なベイズ分析で扱う事前分布を開発した（抄録）。未査読。", "p3": "非線形の尺度では地域平均についての線形の制約が母数に対して非線形になり、母数がリーマン多様体の上に乗ることに着目し、制約で定まる多様体の上で完全に支持される事前分布のクラスを作った（抄録）。", "p5": "事前分布が制約集合上で完全に支持されるため、制約集合上の適切な事後分布が得られ、事後分布を後から修正せずに完全なベイズ分析ができる。米国国勢調査局の小地域所得・貧困推計（SAIPE）が代表例である（抄録）。", "fun": "市町村ごとの貧困者数を推計すると、全部足した数が県の信頼できる合計と合わないことがある。合計を合わせるために後から数字をいじるのではなく、最初から「合計が合う世界」だけを考える確率のモデルを作った点が面白い。曲がった空間の幾何学が統計に役立つ例でもある。", "unverified": "本文は入手できず、数値例と既存手法との比較は確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "代理指標の妥当性が不確かなときの因果効果推定", "title": "Causal Effect Estimation Under Uncertain Statistical Surrogacy", "url": "https://arxiv.org/abs/2611.26289", "authors": "Yi Liu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "統計的代理性の仮定が成り立つかわからない複数の代理エンドポイントについて、効率の利得と損失が生じる条件を特徴づけ、頑健な基準推定量に固定しつつ推定平均二乗誤差で代理指標を使う推定量を選ぶSACESを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "妥当性の不確かな複数の代理エンドポイントを使って因果効果を推定するとき、統計的代理性の仮定が成り立てば効率を高め、破れても一致性を保つ適応的な推定法SACESを提案した（抄録）。未査読。", "p3": "統計的代理性（代理指標と共変量を条件に主要な結果が処置と独立）の下で、主要な結果が完全に観測される場合と欠測がある場合の効率の差と仮定の破れによる偏りを特徴づけ、頑健な基準推定量に固定しつつ推定した平均二乗誤差で代理指標を使う推定量を選ぶ（抄録）。", "p5": "模擬では代理性の破れの程度が変わっても有利な偏りと分散のトレードオフを達成し、ACTG 175の臨床試験のデータで代理情報を適応的に取り入れる方法を示した（抄録）。", "fun": "治療の効果を確かめるには長い年月の追跡が必要だが、途中の検査値（代理指標）を使えば早く分かることがある。ただし代理指標が本当に結果を代弁しているかは分からない。この研究は、代理指標が正しければ得をし、間違っていても大きく損をしない推定法を作った点が面白い。", "unverified": "本文は入手できず、模擬の設定と効率の向上の大きさは確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "差分プライバシー下のスコア推定の最適率", "title": "Differentially Private Score Estimation with Applications to Score-Based Generative Models", "url": "https://arxiv.org/abs/2611.25536", "authors": "Mengxiao Gao ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "差分プライバシーの下で分布のスコア関数を推定する推定量（2次Bスプラインと指数メカニズム、射影ランジュバン法）を作り、ほぼ一致するミニマックス下界を示す。応用として、プライバシー保証がノイズ除去の段数に依存しない拡散モデルを構成する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "差分プライバシーの下で分布のスコア関数（対数密度の勾配）を推定する統計的な限界を明らかにし、ほぼ最適な推定量と、それを使う私的な拡散モデルを示した（抄録）。未査読。", "p3": "局所ヘルダー連続なスコアを持つd次元の準ガウス分布について、2次Bスプラインと指数メカニズムによるサンプリング型の推定量を作り、射影ランジュバン・モンテカルロ法で標本サイズの多項式時間で実装した（抄録）。", "p5": "推定量は差分プライバシーを満たし、密度で重みづけた二乗誤差の期待値の上界とほぼ一致するミニマックス下界を示した。応用として、プライバシーの保証がノイズ除去の段数に依存しない私的な拡散モデルを作り、適切な離散化でほぼミニマックス最適な全変動誤差を得た（抄録）。", "fun": "画像を作るAIは、学習した写真をそのまま覚えて吐き出してしまう危険がある。この研究は、個人のデータを守る「差分プライバシー」の下で、AIの核となる量を推定するときの最良の精度を数学的に示した。守ることと正確さの間の取引を正確に測った点が面白い。", "unverified": "本文は入手できず、実験のデータセットと誤差の数値は確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "科学の共著・引用の仕組みは研究テーマで異なる", "title": "Do Network Mechanisms in Science Vary Across Research Topics? Contextual Relational Hyperevent Models for Large-Scale Bibliometric Data", "url": "https://arxiv.org/abs/2611.26052", "authors": "J\\\"urgen Lerner ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "各論文を著者と参考文献をつなぐ事象とする関係ハイパーイベントモデルを、研究テーマごとに効果が変わるよう拡張し、腫瘍学の約59万本で優先的選択・性別の同類性・自己引用がテーマ間で大きく異なり、その3分の1〜3分の2をテーマの年齢・規模・性別構成で説明できることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "科学の共著・引用のネットワークの仕組み（優先的選択、性別の同類性、自己引用）が研究テーマで異なるかを、大規模な書誌データで推定できる文脈つき関係ハイパーイベントモデル（C-RHEM）を示した（抄録）。未査読。", "p3": "各論文を著者と参考文献をつなぐ1つの事象とし、複数テーマにまたがる参考文献を扱いつつネットワーク効果がテーマごとに変わる単一のモデルを作った。テーマ別の効果の異質性はメタ分析とメタ回帰で定量化する（抄録）。", "p5": "PubMed知識グラフの腫瘍学の約59万本を32のOpenAlexのテーマに割り当てると、優先的選択・性別の同類性・自己引用はテーマ間で大きく異なり（テーマ間の標準偏差はプールした効果の30〜70%）、その3分の1から3分の2をテーマの年齢・規模・性別構成で説明できた（抄録）。", "fun": "人気の論文がさらに引用される「金持ちがもっと金持ちになる」現象や、同じ性別の研究者同士が組みやすい傾向は、どの分野でも同じ強さなのか。この研究は、それが研究テーマによって大きく違うことを約59万本の論文で示した。科学の世界の「くせ」も一様ではない点が面白い。", "unverified": "本文は入手できず、テーマ別の推定値の詳細は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "階層的に流れ込む候補を誤発見率を抑えて選ぶ", "title": "Conformal Selection for Hierarchical Streaming Data", "url": "https://arxiv.org/abs/2611.26328", "authors": "Zhenyuan Sun ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "異なる集団から逐次到着する候補を応答が分かる前に選ぶ問題で、集団間・集団内の順位に基づくe値とオンラインe-BH法により、階層的な交換可能性の下で常に誤発見率を制御する、分布に依存しない方法を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "異なる集団から逐次到着する候補を、関心のある応答が分かる前に選ぶ問題で、階層的なデータでも誤発見率を制御できる、分布に依存しないオンライン選択法を示した（抄録）。未査読。", "p3": "集団間と集団内の標本について順位に基づくe値を作り、平均したe値をオンラインのe-BH法に使うOHSを開発し、応答のフィードバックを使って検出力を高めるOHSFも示した（抄録）。", "p5": "穏やかな階層的交換可能性とデータ到着の仮定の下で、いつの時点でも誤発見率を制御することを理論的に示し、共変量シフトや効果に関わる応答の下での選択にも一般化し、模擬と実データで有効性を示した（抄録）。", "fun": "応募者が次々に来て、その場で採用を決めないといけないとき、後で「外れ」と分かる人をどれだけ選んでしまうかを一定以下に抑えたい。しかも応募者は出身のグループごとに傾向が違う。グループの違いを考えながら外れの割合を保証する方法を作った点が面白い。", "unverified": "本文は入手できず、実データの内容と検出力の数値は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "社会的学習の繰返しゲームのフォーク定理", "title": "Folk Theorems for Social Learning", "url": "https://arxiv.org/abs/2611.25280", "authors": "Daniel Luo ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "各人が私的な信号を1つ持ち公開された行動を繰り返す、情報の外部性だけのゲームで、人数が多く十分に忍耐強ければ情報が集約される均衡も、自給自足並みの均衡も存在することを示し、先を見越す主体の社会的学習の結果の幅を明らかにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "各人が私的な信号を1つ持ち、公開された行動を繰り返すことだけで情報がやり取りされる繰返しゲームで、情報が集約される均衡も集約されない均衡も存在することを示した（抄録）。未査読。", "p3": "利得が状態と自分の行動だけで決まる純粋な情報外部性のゲームで、各人が条件つき独立の信号を観察した後に公開の行動を繰り返し、割引された期待利得を最大化する設定を分析した（抄録）。", "p5": "人数が十分多く十分に忍耐強ければ、利得が完全情報の利得に近づく情報集約の均衡が、近視眼的な行動では情報が伝わらない場合でも存在する。逆に、近視眼的な行動で状態が明らかになる場合でも、自給自足並みの利得の均衡が存在する（抄録）。", "fun": "みんなが少しずつ違う手がかりを持っているとき、互いの行動を見て学べば、全員で真実にたどり着けるはずだ。この研究は、先を見越して行動する人たちの間では、真実にたどり着く場合と、誰も学ばない場合のどちらも起こりうることを示した。社会の「学び」が保証されない点が面白い。", "unverified": "本文は入手できず、均衡の構成方法の詳細は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "FRBの政策情報と景気情報は融資で逆向き", "title": "Monetary Policy, Information Spillovers and European Syndicated Lending", "url": "https://doi.org/10.2139/ssrn.7710379", "authors": "Dimitrios Gounopoulos ほか", "venue": "SSRN", "date": "2026-11-20", "why": "米国の金融政策サプライズを高頻度で政策成分と情報成分に分け、欧州の協調融資21,513件で、伝わった政策成分は1標準偏差でスプレッドを6.5bp上げ、良い景気情報は7bp下げることを示す。単一の指標で測る金融ニュースは企業信用への大きく相殺する効果を隠す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米連邦準備制度の発表が持つ将来の政策金利の情報と景気見通しの情報を、欧州の銀行が同じ融資契約の中で別々に、しかも逆向きに価格付けしていることを示した（抄録）。未査読。", "p3": "米国の金融政策サプライズの高頻度の分解、ユーロ圏の政策ニュースへの伝わり方の推定、欧州の非金融企業への協調融資の1999〜2023年の貸し手・融資単位の21,513件の観測を組み合わせた（抄録）。", "p5": "伝わった政策成分が1標準偏差増えるとスプレッドが6.5bp上がり、同じ大きさの良い情報は7bp下げた。良い情報は大きな融資を支え、引き締めは非銀行の投資家への移行を促し、情報は主に経験のある貸し手が価格付けした（抄録）。", "fun": "アメリカの中央銀行の発表には、「金利を上げる」という知らせと、「景気はこう見ている」という知らせが混ざっている。ヨーロッパの銀行は、この2つを聞き分けて融資の金利を逆向きに調整していた。1つの数字にまとめると、2つの効果が打ち消し合って見えなくなる点が面白い。", "unverified": "本文は入手できず、識別の方法と頑健性の検証の詳細は確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "経済的な制約で予測モデルを新環境に適応", "title": "Structural Fine-Tuning under Economic Restrictions", "url": "https://arxiv.org/abs/2611.25420", "authors": "Yi Niu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "少ない観測で予測モデルを新しい経済環境に適応させる際に、資格条件やキャッシュフローなどの経済的な制約を導入する構造的ファインチューニングを提案し、制約が予測を改善する条件を理論で示す。医療費の制度拡大後の与信枠の模擬で、リスク予測のRMSEを28〜39%下げた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "少ない観測で予測モデルを新しい経済環境に適応させる際に、経済的な制約を導入して適応を導く構造的ファインチューニングを提案した（抄録）。未査読。", "p3": "完全な構造モデルは要らず、単純で広く成り立つ仮定から特定の標準モデルまでの経済知識に基づく制約を使う。制約が元のモデルや通常のファインチューニングより予測を改善する条件を理論で特徴づけた（抄録）。", "p5": "メディケイド型の医療費の拡大後の与信枠の決定の模擬で、資格条件、未払いの医療費、キャッシュフロー、集団のリスクの上下限の制約を課すと、ニューロンのゲーティング、LoRA、完全なファインチューニングに比べてリスク予測のRMSEが28〜39%、政策の後悔が3〜10%下がった（抄録）。", "fun": "過去のデータで学んだAIを、制度が変わった後の世界で使うと、少ないデータでは調整がうまくいかない。そこで「この条件の人は対象外」「お金の出入りはこうなる」といった経済の常識を制約としてAIに教えると、予測が大きく良くなった。理論の知識とAIの組合せ方を示した点が面白い。", "unverified": "本文は入手できず、理論の条件の具体的な形は確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "シャープレイ値の安定性をコアと仁で示す", "title": "Stability Bands for Feature Attribution: The Core, the Nucleolus and the Bargaining Set of Explained-Variance Games", "url": "https://arxiv.org/abs/2611.25238", "authors": "Fernando Delbianco ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "予測の説明に使うシャープレイ値に、特徴の連合が異議を唱えうるかを示す安定性の幅（コア・仁・交渉集合）を加える。線形モデルでは説明分散ゲームが2加法的になり多重共線性が連合の構造を生むこと、凸ゲームでは幅が閉形式になることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "経済学で標準の予測の説明法であるシャープレイ値に、特徴の連合が配分に異議を唱えうるかを示す「安定性の幅」を、協力ゲームのコア・仁・交渉集合で加える方法を示した（抄録）。未査読。", "p3": "特徴の集合の価値をその特徴が生む予測の分散とする説明分散ゲームを定義し、各特徴についてコア（空なら最小コア）上の分け前の範囲を安定性の幅として報告し、仁を代表点とし、正当な異議がないことの証明書を付ける（抄録）。", "p5": "線形モデルではゲームが厳密に2加法的になり、多重共線性が連合の構造を生む。2加法的なゲームでは前仁がシャープレイ値と一致し、凸ゲームでは幅が閉形式になる。小売の注文の予測モデルではコアが空で、仁がシャープレイ値から最大0.19分散分ずれた（抄録）。", "fun": "AIの予測を「この要因が何割効いた」と分ける方法として、ゲーム理論のシャープレイ値が広く使われている。しかし、要因のグループが「自分たちの取り分が少なすぎる」と文句を言える配分かどうかは分からない。分配の公平さを測る協力ゲームの道具で、説明の安定性を確かめた点が面白い。", "unverified": "本文は入手できず、ヘドニック価格モデルの例の数値の詳細は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "福祉国家と持ち家の負の関係は若者の扱いで消える", "title": "Housing-welfare trade-off and young people's homeownership", "url": "https://doi.org/10.31235/osf.io/s6eaq", "authors": "Enrico Benassi ほか", "venue": "SocArXiv", "date": "2026-11-19", "why": "EU-SILC（2008〜2019年、21か国）で、手厚い福祉国家ほど持ち家率が低いという関係は、親と同居する若者の住居の扱いによるもので、個人単位で測るとほぼ消えることを示す。最低所得保障や保育の手厚さは若者の自立した居住と高所得層の持ち家と正に関連する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "福祉国家が手厚いほど持ち家率が低いという経験的な関係は、親と同居する若者の住居の扱いを見落とした結果であり、個人単位で測るとほぼ消えることを示した（抄録）。未査読。", "p3": "2008〜2019年のEU-SILCで欧州21か国の持ち家を個人単位で測り直し、多層モデルで福祉国家の手厚さと若者の自立した居住・持ち家の関係を分析した（抄録）。", "p5": "負の関連は、親の持ち家に住む若者が多い東欧・南欧の国々で福祉が手厚くないことによるもので、個人単位では消えた。最低所得保障、社会保険、保育が手厚いほど若者の自立した居住が多く、高所得層では個人の持ち家も多かった（抄録）。", "fun": "福祉が手厚い国ほど持ち家が少ない、という不思議な関係が知られていた。ところが親の家に住む若者も「持ち家に住む人」と数えていたことが原因で、若者本人が家を持っているかで数え直すと、関係はほぼ消えた。数え方の単位ひとつで通説がひっくり返る点が面白い。", "unverified": "本文は入手できず、推定値の大きさと国ごとの結果は確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "定額と定率の割引券で選択の正確さが違う", "title": "Bunching Behavior under Digital Consumption Vouchers", "url": "https://doi.org/10.2139/ssrn.7714723", "authors": "Xiaoyuan Wang ほか", "venue": "SSRN", "date": "2026-11-19", "why": "同じ利用基準額の定額割引と定率割引の電子クーポンを実験室実験で比べ、どちらでも購入が基準額に集中し、定率割引では最適でない選択による損失が大きいことを示す。資格を得るかをまず決め、次に何を買うかを選ぶ2段階のモデルが当てはまる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "同じ利用基準額の定額割引と定率割引の電子クーポンを実験室実験で比べ、購入が基準額に集中する行動と、選択の正確さの違いを示した（抄録）。未査読。", "p3": "理論的な予測が一致する2つのクーポンの規則を単一商品と複数商品の市場で比べ、構造推定と、まず資格を得るかを決めてから何を買うかを選ぶ2段階のモデルで分析した（抄録）。", "p5": "どちらの規則でも購入は基準額に集中し、選択の分布は理論の予測と有意に異なった。定率割引は定額割引に比べて選択の正確さを下げ、最適でない選択による損失を増やした。2段階のモデルが1段階のモデルより当てはまった（抄録）。", "fun": "「一定額以上で何円引き」と「一定額以上で何%引き」は、計算上同じ得になるように設定できる。ところが人は割合で示されると計算を誤りやすく、損な買い方が増えた。しかも人は、まず「条件を満たすか」を決めてから中身を選んでいた。お得の見せ方で行動が変わる点が面白い。", "unverified": "本文は入手できず、実験の参加者数と損失の大きさは確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "PEファンドのESG開示は乏しく成績と負の関連", "title": "Decoding ESG in Private Equity: Disclosures, Labels, and Performance Outcomes", "url": "https://doi.org/10.2139/ssrn.7718299", "authors": "Stefan Morkoetter ほか", "venue": "SSRN", "date": "2026-11-20", "why": "76のESG管理指標とPEファンド1,437本の世界的なデータで、ESG開示の水準が全体に低く運用会社で差があること、開示が多いほどファンドの成績が低く、投資先のESGリスクとは有意に関連しないこと、ESGの表示の有無で成績に系統的な差がないことを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "76のESG管理指標とプライベート・エクイティ（PE）ファンド1,437本の世界的なデータで、PE業界のESG開示とESGリスク、ファンドの成績の関係を調べた（抄録）。未査読。", "p3": "ファンドのESG開示の水準と、投資先企業のESGリスク・影響の可能性、ESGの表示（ラベル）の有無、ファンドの成績の関連を分析した（抄録）。", "p5": "PEファンドのESGの透明性は全体に低く、運用会社で差があった。開示が多いほど成績が低く、この関連は投資先のESGリスクと影響の可能性を考慮しても変わらなかった。開示は投資先のESGリスクと有意に関連せず、ESGの表示の有無で成績に系統的な差はなかった（抄録）。", "fun": "環境や社会への配慮をたくさん開示している投資ファンドほど、投資先の環境リスクが低いのかというと、そうではなかった。しかも開示が多いファンドほど成績は低めだった。「たくさん語ること」と「実際の中身」が別物でありうることを、千を超えるファンドで示した点が面白い。", "unverified": "本文は入手できず、成績の指標と関連の大きさは確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "高度なエネルギー管理は家庭の元を取れるか", "title": "Should Belgians Install an Advanced Energy Management System in Their Electrified Dwelling ?", "url": "https://arxiv.org/abs/2611.26441", "authors": "Julian Ruddick ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "ベルギーの代表的な住宅500戸を電化（ヒートポンプ・電気給湯・EV）した模擬で、モデル予測制御と決定木による制御の年間節約額が規則型制御より82.5〜116.6ユーロにとどまり、購入・契約費用に比べて小さく普及に不利なことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "p
