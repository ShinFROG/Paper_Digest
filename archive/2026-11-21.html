reprint": true, "short": true, "p1": "電化したベルギーの住宅に高度なエネルギー管理システム（EMS）を入れる価値を、代表的な住宅500戸の模擬で評価した（抄録）。未査読。", "p3": "化石燃料の設備を空気熱源ヒートポンプ、電気給湯器、家庭充電のEVに置き換え、太陽光は現在の普及率で割り当てた。モデル予測制御（MPC）と決定木で戦略を表すTreeCを、規則型の制御と完全予報のMPC（上限）と比べ、2023年の時間別料金と月間ピーク料金の実際の契約で評価した（抄録）。", "p5": "規則型に対する年間の平均節約額はTreeCが82.5ユーロ、MPCが116.6ユーロ、完全予報のMPCが177.4ユーロで、温熱快適性は同程度だった。TreeCはEVの充電完了率が高かった（93.3%対88.8%）。節約額はEMSの購入費（280〜680ユーロ）や契約費に比べて小さかった（抄録）。", "fun": "家の電化製品を賢く動かす装置を入れれば電気代は下がるが、そのもとが取れるかは別問題だ。500軒の模擬では、年に数十から百数十ユーロしか節約できず、装置の値段に見合わないことが多かった。技術的にできることと、買う価値があることを分けて考えた点が面白い。", "unverified": "本文は入手できず、住宅の類型別の結果は確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "コンジョイント実験で選好を測る新しい推定量", "title": "Identification of Preferences in Forced-Choice Conjoint Experiments: Reassessing the Quantity of Interest", "url": "https://doi.org/10.31235/osf.io/e638u_v1", "authors": "Flavien Ganter", "venue": "SocArXiv", "date": "2026-11-20", "why": "強制選択のコンジョイント実験で標準のAMCE（平均限界構成効果）は因果量であって選好を識別せず、構成効果と混ざることを示し、回答者の選好のパターンを記述するための推定対象ACP（平均構成選好）とその推定法を提案する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "強制選択型のコンジョイント実験で標準の推定対象である平均限界構成効果（AMCE）が回答者の選好を識別しないことを示し、選好のパターンを記述するための新しい推定対象ACP（平均構成選好）を提案した（抄録）。未査読。", "p3": "コンジョイント実験には、回答者の多次元の選好を明らかにする目的と、属性がプロフィールの選択確率に与える因果効果を推定する目的があると区別し、目的によって推定対象が変わることを論じた（抄録）。", "p5": "AMCEは概念的に因果量で選好の記述という目的とずれ、一般に選好を識別せず、選好と無関係な構成効果が混ざることを示した。選好のパターンを調べるためのACPとその推定法を示した（抄録）。", "fun": "2人の候補者のどちらを選ぶかを何度も聞く「コンジョイント実験」は、政治学などで人気の手法だ。でも、そこで計算される標準の数字は「人々が何を好むか」ではなく「この属性があると選ばれやすくなるか」を表していて、同じではない。目的と物差しのずれを指摘した点が面白い。", "unverified": "本文は入手できず、ACPの定義式と実データへの適用は確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "制約と利用者単位のプライバシー下の方策学習", "title": "Constrained Counterfactual Policy Learning from Logged Bandit Feedback under User-Level Differential Privacy: Excess-risk Guarantees and Results on the Open Bandit Dataset", "url": "https://doi.org/10.2139/ssrn.7693660", "authors": "Thibault Draye", "venue": "SSRN", "date": "2026-11-20", "why": "記録されたバンディットのログから、予算や露出の制約と利用者単位の差分プライバシーの下で確率的方策を学ぶ2つの解法と、切り詰めの偏り・推定誤差・プライバシー雑音を分けた超過リスクの上界を示し、プライバシーの代償が生じる利用者数の境目を実験で特定する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記録されたバンディットのログから、予算や露出の制約と利用者単位の差分プライバシーの下で確率的な方策を学ぶ方法と、その超過リスクの保証を示した（抄録）。未査読。", "p3": "傾向を切り詰めた二重頑健推定と厳密な罰則を使い、利用者の抽出つきの雑音のある主双対降下法（CAPRI-SGDA）と、十分統計量を一度だけ公開して厳密な線形計画を解く方法（CAPRI-SSP）を示し、切り詰めの偏り・推定誤差・プライバシー雑音を分けた上界を証明した（抄録）。", "p5": "6つの多クラスデータでのCAPRI-SSPの180回の実行で、上界のプライバシー項が1未満ならプライバシーの代償は平均−0.004、1以上なら0.371だった。代償が小さくなる利用者数は、covertypeのデータでε=8なら約2,100人、ε=1なら約14,900人と見積もられた（抄録）。", "fun": "利用者の行動記録から「誰に何をおすすめするか」を学ぶとき、記録を守るために雑音を混ぜると精度が落ちる。この研究は、利用者が何人いれば雑音の害が小さくなるかの目安を、理論と実験で示した。プライバシーを守る費用がいつ払える額になるかを測った点が面白い。", "unverified": "本文は入手できず、Open Bandit Datasetでの結果の数値は確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "女性CEOが少ない理由を組織の過程として見る", "title": "Beyond the Glass Ceiling Gender Disparity, Leadership Barriers and the Representation of Women in Fortune 500 Companies", "url": "https://doi.org/10.2139/ssrn.7707960", "authors": "Sunidhi Patwari", "venue": "SSRN", "date": "2026-11-20", "why": "Fortune 500の女性CEOが2025年に55人（約11%）にとどまることを公開資料と文献から整理し、最初の管理職昇進での脱落、役割適合性の偏見、スポンサーの不足、ケア責任、ガラスの崖などの障壁を検討して、昇進の説明責任と後継者計画の透明化を提言する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "Fortune 500企業で女性CEOが少ない理由を、文献と公開資料から、資格のある女性の不足ではなく、昇進の機会と評価が配分される組織の過程として検討した（抄録）。未査読。", "p3": "女性CEOの人数の推移を公開報告から確認し、昇進のパイプライン、役割適合性の偏見、スポンサーシップや目立つ仕事への不平等な接近、仕事とケアの責任、ガラスの崖の可能性を文献で分析した（抄録）。", "p5": "女性がFortune 500企業を率いたのは2025年に55人（約11%）で、2023年と2024年は52人と、進歩は緩やかだった。最初の管理職への昇進が重要な脱落点であることなどを示し、昇進の説明責任、後継者計画の透明化、スポンサーシップなどを提言した（抄録）。", "fun": "働く女性も学歴の高い女性も増えたのに、大企業の社長に女性はなかなか増えない。その理由は「なれる女性が少ないから」ではなく、最初の管理職への昇進から始まる出世の階段のあちこちで機会が偏っているからだという。結果ではなく途中の過程に目を向けた点が面白い。", "unverified": "本文は入手できず、二次分析に使った資料の詳細は確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "現場労働者の離職意図は疲労の蓄積が左右", "title": "The Breaking Point: A Convergent Parallel Analysis of Frontline Worker Vulnerability, Workplace Strain, and Turnover Intentions in Low-Tech Industries", "url": "https://doi.org/10.2139/ssrn.7718318", "authors": "Tsvi Reiss Post Doc", "venue": "SSRN", "date": "2026-11-20", "why": "小売・宿泊・物流の現場労働者69人の調査と50の資料の内容分析を統合し、仕事の要求度-資源モデルに沿って、疲労の蓄積が離職意図の主因で、勤務予定の予測可能性と上司の支援が報酬以上に離職を抑えることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小売・宿泊・物流などの低技術産業の現場労働者の離職意図を、仕事の要求度-資源（JD-R）と資源保存（COR）の枠組みで、混合研究法により調べた（抄録）。未査読。", "p3": "現場労働者69人の調査と、学術論文や業界報告など50の資料をそれぞれ独立の回答者とみなす内容分析を、順序尺度にそろえて統合し（N=119）、資料の種類を統制した最小二乗回帰で分析した（抄録）。", "p5": "累積的な疲労が離職意図の主な要因で、勤務予定の予測可能性と上司の支援が、金銭的な報酬だけよりも離職を強く抑える要因だった（抄録）。", "fun": "スーパーや倉庫で働く人がやめたくなる一番の理由は、給料よりも疲れの積み重ねだった。そして、シフトが前もって分かることや上司の支えが、給料よりも引き留めに効いていた。お金以外の働きやすさの大切さを数字で示そうとした点が面白い。", "unverified": "本文は入手できず、回帰係数の値と資料の選び方の詳細は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "塑性の許容条件を満たすトポロジー最適化", "title": "Plasticity-based topology optimization using weak-form lower-bound yield design and displacement finite elements", "url": "https://doi.org/10.21203/rs.3.rs-11584818/v1", "authors": "Canh V. Le ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "why": "弱形式の下界塑性設計と二次錐計画を密度型のトポロジー最適化に統合し、通常の変位型有限要素のまま塑性の許容条件を満たす構造配置を求める逐次凸最適化の枠組みを示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "塑性の許容条件の下での構造のトポロジー最適化を、弱形式の下界塑性設計と二次錐計画（SOCP）で定式化し、通常の変位型有限要素で実装できる枠組みを示した（抄録）。未査読。", "p3": "要素ごとの密度場で構造の形を表し、応力場を弾性成分と残留成分に分けて釣合いと降伏条件を満たし、密度・残留応力の釣合い・塑性の許容条件をSOCPの部分問題に入れて逐次凸最適化で解く。指数的な罰則で中間の密度を抑え、密度フィルタで安定化した（抄録）。", "p5": "いくつかのベンチマーク問題で、物理的に意味のある荷重伝達機構をとらえ、明瞭な構造配置と塑性の許容条件に合う応力分布が得られることを示した（抄録）。", "fun": "コンピュータに「材料をどこに置けば一番強いか」を考えさせるトポロジー最適化では、普通は材料が弾性の範囲で使われる前提で計算する。この研究は、材料が降伏しても粘る性質（塑性）まで考えた最適な形を、使い慣れた計算方法のまま求められるようにした点が面白い。", "unverified": "本文は入手できず、ベンチマーク問題の具体的な形と計算時間は確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "角形鋼管柱とH形梁の溶接接合の連続板の効果", "title": "Effect of continuity plate size on the hysteretic response of a welded moment connection between an HEA beam and a square hollow structural section column", "url": "https://doi.org/10.21203/rs.3.rs-11683783/v1", "authors": "William G. Piraquive ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "why": "規準の事前認定接合にないHEA梁と角形鋼管柱の溶接モーメント接合を、実大繰返し試験で検証した3次元非線形FEモデルで25通りの連続板寸法について調べ、0.04 radで柱面のモーメントが梁の全塑性モーメントの1.64〜1.71倍に達し、最大モーメントは板の辺長で増え厚さにほぼ依存しないことを示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "規準の事前認定接合に含まれないHEA梁と角形鋼管柱の溶接モーメント接合で、連続板の寸法が繰返し荷重下の履歴挙動に与える影響を有限要素法で調べた（抄録）。未査読。", "p3": "HEA100の梁と150×150×9 mmの角形鋼管柱を2枚の正方形の連続板で接合した試験体の実大繰返し試験でANSYSの3次元非線形モデルを検証し、辺長（180〜220 mm）と厚さ（8〜19 mm）を組み合わせた25通りを規準の載荷手順で解析した（抄録）。", "p5": "モデルは正側の最大荷重を3%以内、吸収エネルギーを7%以内で再現した。回転0.04 radで柱面のモーメントは全構成で梁の全塑性モーメントの1.64〜1.71倍となり、特殊モーメント骨組の要求0.8を大きく上回った。最大モーメントは板の辺長で増え、厚さにほぼ依存しなかった（抄録）。", "fun": "安く建てたい集合住宅の鉄骨で、柱と梁のつなぎ目を設計の決まりにない組合せで作りたい。この研究は、実物大の実験で確かめた計算モデルを使い、つなぎ目の補強板の大きさを変えて25通り試した。板を厚くするより大きくするほうが強さに効くという結果が意外で面白い。", "unverified": "本文は入手できず、各構成の吸収エネルギー（抄録では4.45〜5.19 kJの範囲）以外の詳細は確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "力学を損失に入れたRC建物の耐震補強の選定", "title": "A Physics-Informed Machine Learning Framework for Probabilistic and Code-Compliant Seismic Bracing Selection in Reinforced Concrete Buildings", "url": "https://doi.org/10.21203/rs.3.rs-11656338/v1", "authors": "Vincent SAm Jebadurai S ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "why": "応答スペクトルの層間変形の残差と規準の変形限界のヒンジ罰則を損失に組み込んだ物理制約つき機械学習で、800の合成RC架構からブレース補強の選択を確率つきで予測し、外挿でも変形の単調性を保ち力学の残差を約70%減らした。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "耐震基準以前の鉄筋コンクリート（RC）建物のどの架構を何で補強するかを、力学を学習の制約として入れた機械学習で、確率つきで基準に適合する形で選ぶ枠組みを示した（抄録）。未査読。", "p3": "データの誤差、釣合いを課す応答スペクトルの層間変形の残差、基準の変形限界に対するヒンジ型の罰則、予測確率を安定させるモンテカルロの分散項からなる損失で、地震地域・地盤種別・不整形指標にわたる物理的に整合した合成RC架構800体で学習した（抄録）。", "p5": "精度は88〜92%、マクロF1は0.86〜0.90だった。通常のモデルは分布内でわずかに高いが外挿で変形の単調性を破り、提案モデルは力学の残差を約70%減らした。予測した補強後の変形を対数正規の脆弱性関数に入れると、累積の崩壊の脆弱性が約62%下がった（抄録）。", "fun": "古い建物の耐震補強を何千棟も判断するのに、AIは速いが、物理の法則に反する答えを自信満々に出すことがある。この研究は、力の釣合いや基準の上限を学習のルールに組み込み、物理的に筋の通る答えを出しやすいAIにした。「正確さより物理の一貫性が大事」という主張が面白い。", "unverified": "本文は入手できず、合成架構の作り方と実建物での検証の有無は確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "オペレーションズ・リサーチ", "headline": "臨界減衰ポリャク刻みで平坦な極小へ", "title": "A new algorithmic approach for finding flat minima: critically damped Polyak stepsizes", "url": "https://arxiv.org/abs/2611.26475", "authors": "Francesco Caporali ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "古典的なポリャクのステップ幅を4倍して穏やかな減衰をかける規則が、極小の多様体の周りで振動しつつ収束し、損失が小さくなると鋭さを下げる方向に進むことを局所2次の損失で一様な保証つきで示す。SAMに似た平坦化を学習済みLLMの微調整でも確認した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "勾配降下法を平坦な極小（鋭さの小さい解）へ導く適応的なステップ幅「臨界減衰ポリャク（CDP）ステップ幅」を提案し、鋭さと損失の低下について時間一様な保証を初めて示した（抄録）。未査読。", "p3": "古典的なポリャクの規則に4を掛け、穏やかな減衰を加える。4倍は極小の多様体の周りで等振動を生む臨界の値で、減衰が多様体への収束を保証する。損失が小さくなると、射影した反復はヘッセ行列の最大固有値の対数の勾配降下に従う（抄録）。", "p5": "局所的にモース・ボット構造を持つ非負の損失の広いクラスで理論を確立した。実験では、理論の範囲外の非線形の教師・生徒ネットワークや学習済みLLMの微調整でも、SAMに似た平坦化の効果で鋭さを下げた（抄録）。", "fun": "AIの学習では、谷底の形が「とがった谷」より「なだらかな谷」に落ち着いたほうが、新しいデータにも強いことが多い。この研究は、一歩の大きさを古典的な公式のちょうど4倍にすると、谷の壁で振動しながらなだらかな場所へ移っていくことを示した。4倍という数字に意味がある点が面白い。", "unverified": "本文は入手できず、LLMの微調整での鋭さの数値は確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "オペレーションズ・リサーチ", "headline": "LLMエージェントに最適化の算法を設計させる", "title": "The FrontierOR Challenge: Agentic Algorithm Design for Operations Research", "url": "https://arxiv.org/abs/2611.26171", "authors": "Hai Wang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "最強のモデルでも大規模事例の39%でしかGurobiに並べない現状を踏まえ、180問の監査済み問題からなるFrontierORベンチマークで、多数の最適化問題の算法を設計・検証・改善するエージェントの仕組みを競う課題の設計（段階・部門・採点）を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMエージェントが多数の最適化問題の算法を設計・検証・改善できるかを競う課題FrontierOR Challengeの設計を示した（抄録）。未査読。", "p3": "監査済みの180問からなるFrontierORベンチマークを使い、第1段階で6つの応用分類・5つの定式化の型にわたる60問を毎週15問ずつ公開し、第2段階でベンチマーク外の新しい問題と未見の事例を出す。外部と隔離した環境で実行する部門と、自前の計算機で解く部門を別々に順位づける（抄録）。", "p5": "現状では最強のモデルでも、大規模な事例の39%でしか目的関数の値がGurobiの1%以内かつ速度で劣らない水準に達しない。実行可能な解は、隠した事例での既知の参照値との比の平均で採点する（抄録）。", "fun": "配送ルートや勤務表のような最適化の問題は、専門家が問題ごとに何週間もかけて解き方を工夫してきた。AIに解き方そのものを考えさせたら専門のソフトに勝てるのか。今のところ大きな問題では4割弱しか並べないという現状を示し、競技として挑戦を呼びかけた点が面白い。", "unverified": "競技の設計を示す論文で、参加チームの結果はまだない。本文は入手できず、採点の詳細は確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "オペレーションズ・リサーチ", "headline": "半正定値計画ソルバをClaudeで形式検証", "title": "Formally Verified Semidefinite Programming", "url": "https://arxiv.org/abs/2611.25174", "authors": "Perry Hart", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "手書きのRust製の一次法の半正定値計画ソルバについて、検証全体をClaudeにVerus（Rustの自動定理証明器）で生成させ、数値ソフトウェアの正しさを証明した事例と、その算法・実装・証明の進め方を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "手書きのRust製の一次法の半正定値計画（SDP）ソルバについて、Rustの自動定理証明器Verusでの検証の全体をClaudeに生成させ、形式的に検証された数値ソフトウェアを作った（抄録）。未査読。", "p3": "ソルバの算法、Rustでの実装、Verusでの正しさの証明を実用的に進めた方法を説明する（抄録）。", "p5": "簡単ではない数値ソフトウェアである一次法のSDPソルバについて、人が書いた実装に対する検証の全体をLLMに生成させ、正しさを証明したことを報告した（抄録）。", "fun": "プログラムが正しく動くことを数学的に証明するのは、プログラムを書くより何倍も手間がかかる。この研究では、人が書いた最適化の計算プログラムについて、その証明をまるごとAIに書かせた。AIが「書く」だけでなく「正しさを保証する」側に回り始めた点が面白い。", "unverified": "本文は入手できず、証明の規模とAIへの指示の詳細は確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "オペレーションズ・リサーチ", "headline": "情報領域を絞った分散MPCで信号制御を高速化", "title": "Information-Region MPC: Non-Iterative Distributed Control of Urban Traffic Signals", "url": "https://arxiv.org/abs/2611.26141", "authors": "Qiongdan Hu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "集中型MPCの最初の制御入力に効く交差点を履歴データから定めた情報領域だけで、各交差点が反復協調なしに局所問題を一度解く分散制御を提案し、28交差点の実網の模擬で集中型の9倍速く、制御入力の85%を完全に再現し、平均遅れの増加は0.03%だった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "集中型のモデル予測制御（MPC）の最初の制御入力を、反復協調なしに限られた実時間データで近似する分散型の信号制御IR-MPCを提案した（抄録）。未査読。", "p3": "履歴の交通データから、他の交差点の摂動が各交差点の集中型の最初の制御入力にどれだけ影響するかを定量化し、その結合で交差点ごとのコンパクトな情報領域を作る。各更新で各交差点は自分の情報領域のデータだけで局所問題を一度解く（抄録）。", "p5": "28交差点の実網のSUMOの模擬で、IR-MPCは集中型MPCの9倍、代表的な反復分解型の分散MPCの15倍速く制御入力を計算し、集中型の制御入力の85%を正確に再現し、99.3%を2秒以内に収め、平均遅れの増加は0.03%だった（抄録）。", "fun": "街中の信号を全部まとめて最適に制御すると、計算が重すぎて間に合わない。この研究は、各交差点が「自分に本当に影響する範囲」だけを見て1回計算すれば、全体の最適にほぼ近い答えになることを示した。全部を見なくても、見るべき範囲を賢く選べば十分だという発想が面白い。", "unverified": "本文は入手できず、情報領域の大きさの決め方と交通需要の条件は確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "オペレーションズ・リサーチ", "headline": "最大被覆施設配置をGPUで高速に解く", "title": "Covering Location Optimization at GPU Speed", "url": "https://arxiv.org/abs/2611.25434", "authors": "Yun-Tian Zhang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "1対1交換の増分をGPUで評価する並列探索で最大被覆配置問題を解き、9つの都市の事例で既知最良解との差を平均0.029%にし、最大の事例（候補7,730・施設50）を一般向けGPUで平均45.2秒で既知最良解に到達させた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "都市の施設配置に現れるNP困難な最大被覆配置問題を、GPUで加速した並列探索で高速に解く枠組みを示した（抄録）。未査読。", "p3": "1対1交換の近傍の構造を使い、正確な増分の利得を疎な被覆表現とタイル化したCUDAカーネルで評価し、階層的な縮約で最良の交換を求める。GPU上の破壊・修復と優良解からの再出発で、集中化と多様化を両立させた（抄録）。", "p5": "9つの実際の都市の構成で既知最良解との平均の相対差は0.029%で、90回中50回で既知最良解に到達した。最大の事例（候補7,730、施設50）では一般向けGPUで10回すべて既知最良解に達し、最終解までの平均は45.2秒（計算機クラスタでの既存手法の報告値は99.5秒）だった（抄録）。", "fun": "限られた数の施設をどこに置けば、できるだけ多くの人をカバーできるか。候補地が数千あると組合せは天文学的な数になる。この研究は、ゲーム用のグラフィックボードで多数の候補を同時に試し、大型の計算機での既存の方法より速く最良の答えにたどり着いた点が面白い。", "unverified": "本文は入手できず、GRASPとの比較の詳細は確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "オペレーションズ・リサーチ", "headline": "複数拠点のAIデータセンターを前日市場で運用", "title": "Optimal Scheduling of Multi-Site AI Data Centers in Day-Ahead Markets", "url": "https://arxiv.org/abs/2611.26572", "authors": "Xinyang Zhou ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "GPUの電力上限、締切つきの遅延可能なジョブ、拠点間の振り分けを線形計画でつなぐ複数拠点のAIデータセンターの運用モデルを作り、2025年のカリフォルニアの前日価格で1年間模擬すると、協調運用で同じ仕事量のエネルギー費用が6.3%下がった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "複数拠点のAIデータセンター群で、運用者が制御できるもの（GPUの電力上限、ジョブの時刻と配置）と各拠点の電力・電気料金を結びつける枠組みを作り、前日市場の価格で最適な運用計画を求めた（抄録）。未査読。", "p3": "GPUの電力上限の段階、締切つきの遅延可能なジョブ、応答時間に余裕のある推論、拠点の施設電力を表し、運用計画を前日価格の下での線形計画として定式化した（抄録）。", "p5": "2025年のカリフォルニア独立系統運用機関（CAISO）の前日価格による3つの市場での1年間の模擬で、協調した運用は同じ仕事量でエネルギー費用を6.3%下げた。機能を1つずつ加える4つの運用の型で、その節約を価格信号の要らない効率的なGPU運用、時間方向の価格対応、拠点間の振り分けに分解した（抄録）。", "fun": "AIの計算をする巨大な施設は、電気の大食いだ。この研究は、電気が安い時間と安い場所に仕事を回し、GPUの電力の上限を調整することで、同じ量の計算の電気代を6.3%下げられることを示した。AIの施設が電力網の調整役にもなりうる点が面白い。", "unverified": "本文は入手できず、3つの市場の名前と費用の内訳の数値は確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "近くの石材工場の振動で高速鉄道橋が横共振", "title": "Low-frequency industrial excitation induced lateral resonance of high-speed railway bridge: field measurements and coupled dynamic analysis", "url": "https://doi.org/10.1177/10775463261508515", "authors": "Yunhao Zhong ほか", "venue": "JVC/Journal of Vibration and Control", "date": "2026-11-20", "sjr": 0.588, "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "温度変動下の橋のたわみをGRUとELMで高速予測", "title": "Efficient bridge deflection prediction using a GRU-FA-ELM model with feature attention and fast regression", "url": "https://doi.org/10.1177/14759217261504353", "authors": "Jia-Huan Xi ほか", "venue": "Structural Health Monitoring", "date": "2026-11-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "一体橋台の踏掛版のひずみは温度勾配に支配", "title": "Multiyear Structural Field Performance of Integral Abutment Bridge Approach Slabs", "url": "https://doi.org/10.1061/jpcfev.cfeng-5591", "auth  Dinh", "venue": "International Journal of Hospitality Management", "date": "2026-11-20", "sjr": 2.316, "citescore": 13.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "因果推論", "headline": "価格が反応すると無作為化でも効果推定が偏る", "title": "EXPRESS: Causal Inference With Endogenous Price Response", "url": "https://doi.org/10.1177/00222437261511867", "authors": "Przemyslaw Jeziorski ほか", "venue": "Journal of Marketing Research", "date": "2026-11-20", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "why": "処置（特売広告など）が無作為に割り当てられても価格が処置に反応すると、需要を処置だけ、あるいは処置と価格に回帰しても直接効果に偏りが出ることを示し、偏りの符号が価格と処置の相関で決まること、偏りの有無の検定と価格の操作変数による不偏な推定を与える。スーパーのスキャナーデータで、操作変数を使わない場合の偏りが大きいことを示す。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "米国の低賃金労働の減少は既存企業の賃上げ", "title": "Rising Wages and the Decline of Low-Wage Work", "url": "https://doi.org/10.1177/00031224261500693", "authors": "Clem Aeppli ほか", "venue": "American Sociological Review", "date": "2026-11-19", "sjr": 3.277, "citescore": 9.0, "citescore_year": "2025", "why": "2014〜2024年に実質時給15ドル未満の米国の時給労働者の割合が38%から13%へ減った要因を、行政記録と職場の口コミのパネルで分解し、低賃金企業の退出（創造的破壊）ではなく、既存の低・中賃金企業による賃上げが主因であることを示す。労働市場の逼迫と最低賃金の上昇に加え、企業が低技能職の仕事を再編した効果もあった。"}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "技術規制のロビー活動は知識を競合に漏らす", "title": "Cooperative Needs and Competitive Opportunities: Lobbying for Technology and the Expropriation of Knowledge", "url": "https://doi.org/10.1177/00018392261498222", "authors": "Michael Park", "venue": "Administrative Science Quarterly", "date": "2026-11-20", "sjr": 9.595, "citescore": 13.4, "citescore_year": "2025", "why": "技術政策に関するロビー活動で、社内ロビイストの増加は知識の漏出、外部ロビイストの増加は他社の知識の取り込みの機会を増やすと予測し、ロビイストを雇った米国企業の特許の文章を埋め込みで比べて直接検出した。ロビー活動で共有される情報が競合にとって価値を持つため、政治戦略と革新戦略の交点に新たな競争の動態が生じることを示す。"}, {"id": "jn04", "rank": 4, "field": "機械学習", "headline": "会話と教師を同時に選ぶRLHFの能動学習", "title": "Dual Active Learning for Reinforcement Learning from Human Feedback", "url": "https://doi.org/10.1287/opre.2025.1837", "authors": "Pangpang Liu ほか", "venue": "Operations Research", "date": "2026-11-20", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "人のフィードバックからの報酬学習で、ラベルを付ける会話と専門性の異なる人間の教師を同時に選ぶD最適計画に基づく二重の能動学習を提案し、悲観的な強化学習で整合を解く。選択した報酬推定量は一般化分散を漸近的に最小にし、方策の準最適性が標本予算Tに対してO(1/√T)で減ることを示した。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "直近の受注が次の受注を遠ざける", "title": "EXPRESS: The Relationship Between a Salesperson’s Past and Future Performance", "url": "https://doi.org/10.1177/00222429261511608", "authors": "Melissa Baucum ほか", "venue": "Journal of Marketing", "date": "2026-11-20", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "why": "営業担当者の過去の成績は将来の予測に使われるが、ソリューション営業では受注後の作業負担が次の見込み客の成約を下げることをグラウンデッド・セオリーで見いだし、Fortune 500企業の7年分のCRMデータ（見込み客3,669件）で、複雑な受注ほど過去と将来の成績の関連が弱まることを確かめた。行動実験で因果を、データ内メタ分析で作業負担の仕組みを裏づける。"}, {"id": "jn06", "rank": 6, "field": "因果推論", "headline": "白色雑音を加えて因果の誤検出を減らす", "title": "Causal dynamic resonance reduces false positives in detecting causality", "url": "https://doi.org/10.1073/pnas.2518099123", "authors": "Claudia Lainscsek ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "非線形の動的系で成分間の情報の流れを判定する遅延微分解析に基づく因果の測度に、データへ白色雑音を加える処理を組み合わせると、系を乱さずに偽陽性を棄却できる『因果動的共鳴』を示す。真の結合が分かる結合レスラー系で検証し、実測の脳波データにも適用した。"}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "道徳的な動機の犯罪は罰で抑止されにくい", "title": "Morally motivated crimes are less sensitive to punishment", "url": "https://doi.org/10.1073/pnas.2624057123", "authors": "Raihan Alam ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "罰は犯罪の期待効用を下げて抑止するという想定に対し、道徳的な理由で動機づけられた人は罰に鈍感になることを10の相関・実験・経済ゲーム研究で示す。3万人超の連邦の犯罪者データで道徳的動機の推定は再犯の多さを、物質的動機は少なさを予測し、経済ゲームでも道徳的理由で他人の金を取る場合は罰金の抑止が弱かった。"}, {"id": "jn08", "rank": 8, "field": "経営学", "headline": "契約の黒塗   var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
