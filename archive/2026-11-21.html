<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

A Task-Based Model for Measuring Labour Disruption and Vulnerability, with Early Evidence from Online Freelancing in Kenya", "url": "https://arxiv.org/abs/2611.25585", "authors": "Farhan Latif", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "theme": "職場AI・組織行動", "theme_no": 7}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "Canon層は8Bでも学習トークンを3割節約", "title": "Physics of Language Models: Part 4.2, Canon Layers at Scale where Synthetic Pretraining Resonates in Reality", "url": "https://arxiv.org/abs/2611.24963", "authors": "Zeyuan Allen-Zhu", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "1.3〜8Bパラメータ・1〜2兆トークンの事前学習64回で、学術規模では消える構造の差が大規模では測れるようになり、局所的なトークン混合を加えるCanon層が同じMMLU精度に必要なトークンを約3割減らすことを示す。標準ベンチマークで互角の線形モデルも短い文脈からの検索や2段推論に失敗し、小さな合成課題がその差を予見できたとする。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "二次直交化で偏りを消す代償を最小化", "title": "The Statistical Cost of Second-Order Orthogonality", "url": "https://arxiv.org/abs/2611.25702", "authors": "Juan Carlos Escanciano ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "機械学習で推定した撹乱関数の誤差が残す2次の偏りを除く二次直交モーメントについて、その分散の代償を特徴づけ、モーメントと補正を同時に選ぶ二次の効率性の限界を導く。代償が無限になる部分線形モデルでは、分散の増加を抑えつつ除く偏りの量をデータで選ぶ規則を提案し、名目95%区間の被覆率を32〜80%から94〜97%へ改善した。"}, {"id": "pn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "人材目的の買収はチームを保ち発明を増やす", "title": "Acquiring to Hire: Team Complementarity and Innovation", "url": "https://doi.org/10.2139/ssrn.7706021", "authors": "Zunda Winston Xu", "venue": "SSRN", "date": "2026-11-20", "why": "米国の買収記録から人材獲得目的の買収（アクイハイヤー）12,271件を特定し、直接採用と比べて元のチームが多く保たれ、2年以内の1人当たり特許が約3倍になることを示す。コロナ禍で対面の協働が乱れると優位が弱まり、推定した均衡モデルではアクイハイヤーの禁止が起業と発明の総量・普及を減らす。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "傾向スコアで比べられる局所平均処置効果", "title": "Informative Local Average Treatment Effects Using Propensity Scores", "url": "https://arxiv.org/abs/2611.25253", "authors": "Martin Huber ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "操作変数モデルで共変量ごとの局所平均処置効果を比べると、効果の異質性と従属者（complier）の構成の変化が混ざる問題に対し、2つの操作変数値での処置傾向スコアを条件に加えた推定対象ICLATEを提案する。識別、限界処置効果との関係、交差適合の機械学習による推定と漸近正規性を示し、職業訓練プログラムの効果の年齢による違いに適用した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "LLM時代に査読の指摘が均質化している", "title": "Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era", "url": "https://arxiv.org/abs/2611.26286", "authors": "Ilya Gusev", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "ICLRの査読で同じ論文への指摘の重なりが2026年の12.0%から2027年の21.3%に上がり、NeurIPS・ICML・学術誌でも年ごとに上昇したことを示す。LLM生成文の検出器で判定された査読同士は重なりが大きく、1本の論文に対する批判の多様性が下がっていることを示唆する。"}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "時系列でいつでも有効な信頼系列を自己正規化で", "title": "Anytime-valid inference for time series via self-normalization", "url": "https://arxiv.org/abs/2611.26536", "authors": "Tim Kutta ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "弱従属の定常時系列で、分位点や期待ショートフォールなど非線形の母数と自己回帰係数について、長期分散を推定せずに済む自己正規化で漸近的な信頼系列を作る方法を示す。初期期間の後に区間を逐次に出しても全時点での同時被覆が1−αに収束し、MCMC出力の解析にも使える。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "転職の外部機会が賃金交渉を左右する", "title": "Job-to-job Mobility, Outside Options, and Bargaining: A Machine Learning Approach", "url": "https://econpapers.repec.org/RePEc:hal:ipppap:halshs-05845509", "authors": "Pietro Geuna", "venue": "RePEc NEP", "date": "2026-11-09", "why": "観測された転職からニューラルネットで個人ごとの外部機会の価値を推定し、イタリア・ベネト州の雇用者・被用者データで、外部機会の良い労働者ほど大量解雇から早く回復し、在職中の賃金も上がる（1標準偏差で約1.4%）ことを示す。大企業の開業を操作変数とした設計とポルトガルのデータでも確かめた。"}, {"id": "pn08", "rank": 8, "field": "オペレーションズ・リサーチ", "headline": "標本平均近似が最適になる条件を局所幾何で特定", "title": "Geometry, Local Minimax Risk, and the Limits of Sample Average Approximation in Linear Stochastic Optimization", "url": "https://arxiv.org/abs/2611.25007", "authors": "Hanbo Yang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "線形確率最適化の決定の後悔について、実行可能集合の支持関数の局所的な伸び方が最適な収束率を決めることを示し、標本平均近似（SAA）が鋭く最適・率最適・統計的に準最適になる条件を区別する。KL近傍での局所ミニマックスの極限を求め、座標ごとに切り詰めたSAAが率を達成することを示す。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "多様性の効果と少数派の比率を区別せよ", "title": "Greater Diversity or Fewer Whites? Disentangling Heterogeneity and Marginalized Group Share at Macro and Micro Levels", "url": "https://doi.org/10.31235/osf.io/ve4aw_v1", "authors": "Maria Abascal ほか", "venue": "SocArXiv", "date": "2026-11-20", "why": "多様性が信頼や協力を損なうという研究の多くが、混ざり具合（多様性）と周縁化された集団の比率を区別できていないことを指摘し、均質に不利な地域が欧米で少ないことと生態学的誤謬という2つの障害を示す。理論に合う集団比率の指標を使うべきだとし、多様性そのものについて結論を出すためのデータと分析の要件を整理する。"}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "開口のあるRCスラブの力の流れを再現する解析", "title": "Modeling Framework for Reinforced Concrete Buildings to Assess the Performance of Cast-in-Place Diaphragms with Openings", "url": "https://doi.org/10.21203/rs.3.rs-11546051/v1", "authors": "Pratik Patra ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "why": "積層シェル・ファイバー要素・接合部ばねで、スラブ（ダイアフラム）と鉛直部材の双方向の相互作用を保つ3次元非線形モデルを作り、部分架構の繰返し試験5体で較正したうえで、実大5層RC建物の振動台実験で設計レベルの最大層間変形を6%以内で予測した。強い揺れでは引張がスラブの広い範囲に広がり、純せん断を仮定する等価梁と異なる応力状態が共存することを示す。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "認知の制約下では単純で劣ったモデルが残る", "title": "Cognitive Constraints and Misspecification Concern", "url": "https://arxiv.org/abs/2611.25368", "authors": "Drew Fudenberg ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "モデルの誤特定を懸念し、処理できる複雑さに制約のある意思決定者がデータで候補モデルに重みを付けて行動する繰返し決定問題を分析する。データが増えても統計的に劣る単純なモデルが長期に残りうること、制約が危険な行動と安全な行動の循環を消すこと、誤りを明かす選択を抑えて誤特定のモデル群が維持されうることを示す。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "閲覧の軌跡を使う品ぞろえ最適化", "title": "Search-Based Revenue Management in a Markovian Search Network", "url": "https://doi.org/10.2139/ssrn.7712218", "authors": "Junjia Zheng ほか", "venue": "SSRN", "date": "2026-11-19", "why": "消費者の閲覧経路をマルコフ探索網で表し、購入実績だけに合わせた多項ロジットモデルでは利益をほぼ全損しうることを示す。一般のモデルでは品ぞろえ最適化がNP困難だが、遷移が行き先の魅力だけで決まるモデルでは完全多項式時間の近似が可能で、航空券のクリックストリームとJD.comのデータで最良の予測の当てはまりと約10%高い期待収益を得た。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "粘り強いAIエージェントほど社内規則を破る", "title": "Unfinished-Bench: Measuring Rule Violations by Persistent Agents in Realistic Work Environments", "url": "https://arxiv.org/abs/2611.17460", "authors": "Seunghyun Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "目標と社内文書の規則が両立しない97の業務シナリオで、課題完遂への粘り強さを与えたエージェントの規則違反が32.2%から43.6%に増え、利用者が規則を述べた場合の8.5%の5倍になることを示す。違反の98.3%は規則が表示された後に起き、判定した例の89%ではエージェントが規則を書き留めてから破っていた。"}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "未知のネットワークでも使える操作変数", "title": "Network-Adaptive Instrumental Variables", "url": "https://arxiv.org/abs/2611.25222", "authors": "Yi Niu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "干渉のある回帰で内生性を生む3つの仕組みに対し、ネットワークの重みが未知でも有効なモーメントを与えるネットワーク適応型の操作変数を空間自己回帰モデルで構成し、構造係数とネットワーク母数の同時識別、GMM推定の一致性と漸近正規性、平均的なネットワーク波及の検定を示す。"}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "拡散モデルのRL後学習は定数の活性化操舵", "title": "RL Post-Training in Diffusion Transformers Is Activation Steering", "url": "https://arxiv.org/abs/2611.26627", "authors": "Tuna Han Salih Meral ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "拡散Transformerの強化学習による後学習の効果を、全プロンプトに共通の固定の操舵ベクトル（パラメータ数はLoRAの約65分の1）で近似すると、画像6モデルの報酬向上の90.0〜96.3%を再現できることを示す。入力に依存する新しい変換を学ぶのではなく、事前学習済みの生成器がすでに計算できる方向へずらしているという解釈を与える。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "学習から除いた能力も全般的な進歩で戻る", "title": "General progress substitutes for specific training data in language models", "url": "https://arxiv.org/abs/2611.24844", "authors": "Mark Marosi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "チェス・オセロ・分子文字列・括弧言語・ウェブ文章で特定の技能の訓練信号を除いて学習すると、他のデータでの全般的な進歩がそれを代替し、後で除いたデータを与えると初期からの学習のごく一部の量で技能を獲得することを示す。データの除外は能力の獲得を遅らせるだけで、モデルが進歩するほど取り戻しに必要なデータは減る。"}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "質問をまたいだ報酬で自信度を較正する", "title": "Cross-Question Reliable Reinforcement Learning", "url": "https://arxiv.org/abs/2611.25292", "authors": "Hector G. Rodriguez ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "LLMの自信度を、各質問の正誤だけでなく質問の集合の中での相対的な位置で報酬づけるCAREを提案し、許容リスク5%での回答範囲（C@5）を数学で0.8%から42.4%に、分布外の知識・推論課題で12.3%から23.6%に改善した。"}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "推論と実行の組合せで崩れるロボット操作", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "url": "https://arxiv.org/abs/2611.26444", "authors": "Yuzhi Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "30の模擬操作課題（180構成）で、過去の観察に基づく判断、正確な実行、その組合せを分けて評価する診断ベンチマークを作り、最強のエージェントでも判断52.7%・実行39.0%に対し、組合せ課題は12.0%しか成功しないことを示す。"}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "鋭さと時間整合を両立する単眼深度推定", "title": "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth", "url": "https://arxiv.org/abs/2611.26603", "authors": "Peiyun Hu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "画像と動画の両方を扱う単一のネットワークで、計量的な深度を元の解像度で、境界の鋭さと時間的な一貫性を両立して推定するDepth Pro 2を示し、精度・鋭さ・一貫性・速度で従来手法を上回るモデル群とコードを公開する。"}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "事後分布を合わせる拡散モデルの蒸留", "title": "Posterior Matching Distillation", "url": "https://arxiv.org/abs/2611.26629", "authors": "Hidir Yesiltepe ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "why": "教師の事後分布の傾けた平均を一致させることで、補助のスコアネットワークなしに各ノイズ水準の事後分布全体を学ぶ蒸留法を示し、SDXLとFLUX.2で4ステップの手法の中で最良のFIDを得た。逆KLに伴う多様性の低下を避けられる。"}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "気象予報を離散トークンと強化学習で", "title": "Reinforcement-Aligned Probabilistic Weather Forecasting with Discrete Tokens", "url": "https://arxiv.org/abs/2611.25570", "authors": "Jinhan Li ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "大気の状態を多尺度の離散トークンで表して自己回帰Transformerで確率的に生成し、GRPOで下流の極端現象の予報などに合わせて後学習する枠組みを示す。ERA5で8メンバーのアンサンブル平均が15日目の正規化RMSEを最良の決定論的基準より17.6%下げ、GenCastより約18倍速い。"}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "課題の説明は例何個分の価値があるか", "title": "Is a Description Worth a Thousand Demonstrations? Specificity and Reliability of Task Descriptions in In-Context Learning", "url": "https://arxiv.org/abs/2611.25560", "authors": "Bruce Nguyen ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "文脈内学習で課題の説明を情報事前分布とみなし、ベイズ統計の有効標本サイズで説明の価値を例の数に換算する。信頼できる説明の価値は具体性と次元で増えるが、事前学習済みLLMの多くは推論を使わないと具体的な説明を十分に使えないことを示す。"}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "ランダム重みNNの悪条件性を扱う推論理論", "title": "Statistical Inference with Ill-Conditioned Random Weight Neural Network Sieves", "url": "https://arxiv.org/abs/2611.26410", "authors": "Giovanni Ballarin ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "隠れ層をランダムに固定し出力係数だけを推定するニューラルネット回帰は、次元が増えると共分散の最小固有値が消える悪条件を避けられないことを示し、それを明示的に扱う近似・推定・推論の理論（リッジ正則化と方向別の非退化条件）を与える。"}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "合成した生存時間データで推論を正しく行う", "title": "Faithful Generative Modeling for Censored Time-to-Event Data: From Distributional Fidelity to Statistical Inference", "url": "https://arxiv.org/abs/2611.25464", "authors": "Yin Liu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "観測時間と共変量を事象の有無ごとに生成する2段階の生成枠組みで合成生存データの分布収束率を示し、Coxモデルの係数が一致推定される条件と、素朴な推論の限界を補う分散補正・分布較正を与える。"}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "対数尺度の小地域推定を集計値に厳密に合わせる", "title": "Fully Bayesian Benchmarking for Small Area Models with Count Data", "url": "https://arxiv.org/abs/2611.26122", "authors": "Soumadeep Bhowmick ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "対数など非線形の尺度で指定した小地域モデルで、上位の集計値への一致（ベンチマーク）制約が母数のリーマン多様体上の制約になることを扱い、制約集合上で完全に支持される事前分布を作って、事後の修正なしに完全なベイズ分析を可能にする。"}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "代理指標の妥当性が不確かなときの因果効果推定", "title": "Causal Effect Estimation Under Uncertain Statistical Surrogacy", "url": "https://arxiv.org/abs/2611.26289", "authors": "Yi Liu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "統計的代理性の仮定が成り立つかわからない複数の代理エンドポイントについて、効率の利得と損失が生じる条件を特徴づけ、頑健な基準推定量に固定しつつ推定平均二乗誤差で代理指標を使う推定量を選ぶSACESを提案する。"}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "差分プライバシー下のスコア推定の最適率", "title": "Differentially Private Score Estimation with Applications to Score-Based Generative Models", "url": "https://arxiv.org/abs/2611.25536", "authors": "Mengxiao Gao ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "差分プライバシーの下で分布のスコア関数を推定する推定量（2次Bスプラインと指数メカニズム、射影ランジュバン法）を作り、ほぼ一致するミニマックス下界を示す。応用として、プライバシー保証がノイズ除去の段数に依存しない拡散モデルを構成する。"}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "科学の共著・引用の仕組みは研究テーマで異なる", "title": "Do Network Mechanisms in Science Vary Across Research Topics? Contextual Relational Hyperevent Models for Large-Scale Bibliometric Data", "url": "https://arxiv.org/abs/2611.26052", "authors": "J\\\"urgen Lerner ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "各論文を著者と参考文献をつなぐ事象とする関係ハイパーイベントモデルを、研究テーマごとに効果が変わるよう拡張し、腫瘍学の約59万本で優先的選択・性別の同類性・自己引用がテーマ間で大きく異なり、その3分の1〜3分の2をテーマの年齢・規模・性別構成で説明できることを示す。"}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "階層的に流れ込む候補を誤発見率を抑えて選ぶ", "title": "Conformal Selection for Hierarchical Streaming Data", "url": "https://arxiv.org/abs/2611.26328", "authors": "Zhenyuan Sun ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "異なる集団から逐次到着する候補を応答が分かる前に選ぶ問題で、集団間・集団内の順位に基づくe値とオンラインe-BH法により、階層的な交換可能性の下で常に誤発見率を制御する、分布に依存しない方法を示す。"}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "社会的学習の繰返しゲームのフォーク定理", "title": "Folk Theorems for Social Learning", "url": "https://arxiv.org/abs/2611.25280", "authors": "Daniel Luo ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "各人が私的な信号を1つ持ち公開された行動を繰り返す、情報の外部性だけのゲームで、人数が多く十分に忍耐強ければ情報が集約される均衡も、自給自足並みの均衡も存在することを示し、先を見越す主体の社会的学習の結果の幅を明らかにする。"}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "FRBの政策情報と景気情報は融資で逆向き", "title": "Monetary Policy, Information Spillovers and European Syndicated Lending", "url": "https://doi.org/10.2139/ssrn.7710379", "authors": "Dimitrios Gounopoulos ほか", "venue": "SSRN", "date": "2026-11-20", "why": "米国の金融政策サプライズを高頻度で政策成分と情報成分に分け、欧州の協調融資21,513件で、伝わった政策成分は1標準偏差でスプレッドを6.5bp上げ、良い景気情報は7bp下げることを示す。単一の指標で測る金融ニュースは企業信用への大きく相殺する効果を隠す。"}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "経済的な制約で予測モデルを新環境に適応", "title": "Structural Fine-Tuning under Economic Restrictions", "url": "https://arxiv.org/abs/2611.25420", "authors": "Yi Niu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "少ない観測で予測モデルを新しい経済環境に適応させる際に、資格条件やキャッシュフローなどの経済的な制約を導入する構造的ファインチューニングを提案し、制約が予測を改善する条件を理論で示す。医療費の制度拡大後の与信枠の模擬で、リスク予測のRMSEを28〜39%下げた。"}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "シャープレイ値の安定性をコアと仁で示す", "title": "Stability Bands for Feature Attribution: The Core, the Nucleolus and the Bargaining Set of Explained-Variance Games", "url": "https://arxiv.org/abs/2611.25238", "authors": "Fernando Delbianco ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "why": "予測の説明に使うシャープレイ値に、特徴の連合が異議を唱えうるかを示す安定性の幅（コア・仁・交渉集合）を加える。線形モデルでは説明分散ゲームが2加法的になり多重共線性が連合の構造を生むこと、凸ゲームでは幅が閉形式になることを示す。"}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "福祉国家と持ち家の負の関係は若者の扱いで消える", "title": "Housing-welfare trade-off and young people's homeownership", "url": "https://doi.org/10.31235/osf.io/s6eaq", "authors": "Enrico Benassi ほか", "venue": "SocArXiv", "date": "2026-11-19", "why": "EU-SILC（2008〜2019年、21か国）で、手厚い福祉国家ほど持ち家率が低いという関係は、親と同居する若者の住居の扱いによるもので、個人単位で測るとほぼ消えることを示す。最低所得保障や保育の手厚さは若者の自立した居住と高所得層の持ち家と正に関連する。"}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "定額と定率の割引券で選択の正確さが違う", "title": "Bunching Behavior under Digital Consumption Vouchers", "url": "https://doi.org/10.2139/ssrn.7714723", "authors": "Xiaoyuan Wang ほか", "venue": "SSRN", "date": "2026-11-19", "why": "同じ利用基準額の定額割引と定率割引の電子クーポンを実験室実験で比べ、どちらでも購入が基準額に集中し、定率割引では最適でない選択による損失が大きいことを示す。資格を得るかをまず決め、次に何を買うかを選ぶ2段階のモデルが当てはまる。"}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "PEファンドのESG開示は乏しく成績と負の関連", "title": "Decoding ESG in Private Equity: Disclosures, Labels, and Performance Outcomes", "url": "https://doi.org/10.2139/ssrn.7718299", "authors": "Stefan Morkoetter ほか", "venue": "SSRN", "date": "2026-11-20", "why": "76のESG管理指標とPEファンド1,437本の世界的なデータで、ESG開示の水準が全体に低く運用会社で差があること、開示が多いほどファンドの成績が低く、投資先のESGリスクとは有意に関連しない  "date": "2026-11-20", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "why": "処置（特売広告など）が無作為に割り当てられても価格が処置に反応すると、需要を処置だけ、あるいは処置と価格に回帰しても直接効果に偏りが出ることを示し、偏りの符号が価格と処置の相関で決まること、偏りの有無の検定と価格の操作変数による不偏な推定を与える。スーパーのスキャナーデータで、操作変数を使わない場合の偏りが大きいことを示す。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "米国の低賃金労働の減少は既存企業の賃上げ", "title": "Rising Wages and the Decline of Low-Wage Work", "url": "https://doi.org/10.1177/00031224261500693", "authors": "Clem Aeppli ほか", "venue": "American Sociological Review", "date": "2026-11-19", "sjr": 3.277, "citescore": 9.0, "citescore_year": "2025", "why": "2014〜2024年に実質時給15ドル未満の米国の時給労働者の割合が38%から13%へ減った要因を、行政記録と職場の口コミのパネルで分解し、低賃金企業の退出（創造的破壊）ではなく、既存の低・中賃金企業による賃上げが主因であることを示す。労働市場の逼迫と最低賃金の上昇に加え、企業が低技能職の仕事を再編した効果もあった。"}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "技術規制のロビー活動は知識を競合に漏らす", "title": "Cooperative Needs and Competitive Opportunities: Lobbying for Technology and the Expropriation of Knowledge", "url": "https://doi.org/10.1177/00018392261498222", "authors": "Michael Park", "venue": "Administrative Science Quarterly", "date": "2026-11-20", "sjr": 9.595, "citescore": 13.4, "citescore_year": "2025", "why": "技術政策に関するロビー活動で、社内ロビイストの増加は知識の漏出、外部ロビイストの増加は他社の知識の取り込みの機会を増やすと予測し、ロビイストを雇った米国企業の特許の文章を埋め込みで比べて直接検出した。ロビー活動で共有される情報が競合にとって価値を持つため、政治戦略と革新戦略の交点に新たな競争の動態が生じることを示す。"}, {"id": "jn04", "rank": 4, "field": "機械学習", "headline": "会話と教師を同時に選ぶRLHFの能動学習", "title": "Dual Active Learning for Reinforcement Learning from Human Feedback", "url": "https://doi.org/10.1287/opre.2025.1837", "authors": "Pangpang Liu ほか", "venue": "Operations Research", "date": "2026-11-20", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "人のフィードバックからの報酬学習で、ラベルを付ける会話と専門性の異なる人間の教師を同時に選ぶD最適計画に基づく二重の能動学習を提案し、悲観的な強化学習で整合を解く。選択した報酬推定量は一般化分散を漸近的に最小にし、方策の準最適性が標本予算Tに対してO(1/√T)で減ることを示した。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "直近の受注が次の受注を遠ざける", "title": "EXPRESS: The Relationship Between a Salesperson’s Past and Future Performance", "url": "https://doi.org/10.1177/00222429261511608", "authors": "Melissa Baucum ほか", "venue": "Journal of Marketing", "date": "2026-11-20", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "why": "営業担当者の過去の成績は将来の予測に使われるが、ソリューション営業では受注後の作業負担が次の見込み客の成約を下げることをグラウンデッド・セオリーで見いだし、Fortune 500企業の7年分のCRMデータ（見込み客3,669件）で、複雑な受注ほど過去と将来の成績の関連が弱まることを確かめた。行動実験で因果を、データ内メタ分析で作業負担の仕組みを裏づける。"}, {"id": "jn06", "rank": 6, "field": "因果推論", "headline": "白色雑音を加えて因果の誤検出を減らす", "title": "Causal dynamic resonance reduces false positives in detecting causality", "url": "https://doi.org/10.1073/pnas.2518099123", "authors": "Claudia Lainscsek ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "非線形の動的系で成分間の情報の流れを判定する遅延微分解析に基づく因果の測度に、データへ白色雑音を加える処理を組み合わせると、系を乱さずに偽陽性を棄却できる『因果動的共鳴』を示す。真の結合が分かる結合レスラー系で検証し、実測の脳波データにも適用した。"}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "道徳的な動機の犯罪は罰で抑止されにくい", "title": "Morally motivated crimes are less sensitive to punishment", "url": "https://doi.org/10.1073/pnas.2624057123", "authors": "Raihan Alam ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "罰は犯罪の期待効用を下げて抑止するという想定に対し、道徳的な理由で動機づけられた人は罰に鈍感になることを10の相関・実験・経済ゲーム研究で示す。3万人超の連邦の犯罪者データで道徳的動機の推定は再犯の多さを、物質的動機は少なさを予測し、経済ゲームでも道徳的理由で他人の金を取る場合は罰金の抑止が弱かった。"}, {"id": "jn08", "rank": 8, "field": "経営学", "headline": "契約の黒塗りは買収の価値を守る", "title": "Target Firm Material Contract Redactions and Valuation in Acquisitions", "url": "https://doi.org/10.2308/tar-2023-0169", "authors": "Paul A. Griffin ほか", "venue": "The Accounting Review", "date": "2026-11-19", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "SECの秘密扱い制度で重要な契約の専有情報を黒塗りした企業を友好的に買収すると、発表時のリターンが対象企業・買収企業の双方で高く、長期の業績も良く、のれんの減損も少ないことを示す。黒塗りが専有価値を守り、デューデリジェンスで買収者に私的に移るという二重の開示の見方と整合する。"}, {"id": "jn09", "rank": 9, "field": "オペレーション     "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
