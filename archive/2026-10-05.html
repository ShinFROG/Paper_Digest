<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

960通りの設定を人手の正解（892件、うち評価用692件・効果量102個）と比べた（抄録）。", "p5": "人の確認なしで第1・第2段階は対象論文の96.72%と100.00%を残した。抽出では、規則ベースで取り出した本文から効果量の35.05%を見落としたが、機械学習によるPDF解析の本文では見落としがなく、誤りも10.16%から2.61%に減った（抄録）。", "fun": "論文を何千本も読んでまとめる作業をAIに任せられるかという問いです。面白いのは、AIの賢さより「PDFから文字をどう取り出すか」という下ごしらえで結果が大きく変わった点です。5つのAIに判定させ、選別では甘めに、抽出では厳しめに票をまとめるという、多数決の決め方の工夫も効いています。", "unverified": "推奨設定で使ったモデル名と費用は未確認（本文を入手できず）。"}}, {"id": "pr17", "rank": 17, "headline": "証拠の十分性は小さな較正モデルが判定上手", "title": "Calibrated Gating in Financial RAG: Small External Controllers versus LLM Self-Assessment across Model Scales", "url": "https://doi.org/10.2139/ssrn.7553938", "authors": "Hsiang-Jun Mon ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "検索拡張生成（RAG）で「検索するか」「証拠は足りるか」「答えを出してよいか」を決める判定役として、LLMの自己評価、外部のLLM審判、小さな較正モデルのどれが向くかを、モデルの規模ごとに比べた（未査読）。", "p3": "0.3Bの較正済み判定モデル（Laya）、LLMの較正済み自己評価、同じ骨格のクロスエントロピー分類器、LLM審判の4つを、0.6B〜14BのQwen3の5サイズで、金融の資格試験・株価変動予測・報告書の数値推論について、情報漏れのない手順で評価した（抄録）。", "p5": "答えの正しさでは、0.6B・1.7Bでは外部のLLM審判が自己評価より良く、4B以上では自己評価が8Bの審判を上回った。証拠の十分性ではLayaと分類器がAUROC 0.80、ECE 0.02で最も良く、LLMの自動採点はECEが約0.3だった（抄録）。", "fun": "AIが自分の答えにどれだけ自信を持ってよいかを、誰に判定させるべきかという問題です。小さいAIは自分のことを見誤りやすく、大きいAIは自分で判断した方が他の審判より正確になるという、規模によって答えが逆転する点が面白いところです。「証拠が足りているか」の判定は、専用に鍛えた小さなモデルが上手でした。", "unverified": "Layaの学習データと判定の閾値の決め方は未確認（本文を入手できず）。"}}, {"id": "pr18", "rank": 18, "headline": "多数決の利得は多様性指標より正答率で予測できる", "title": "The Control Ate the Signal", "url": "https://doi.org/10.5281/zenodo.23133020", "authors": "Latipov, Aziz", "venue": "Zenodo", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された短い抄録（DataCite経由）を使用", "preprint": true, "short": true, "p1": "複数の判定者の多数決が最良の1人をどれだけ上回るかを、各判定者の正答率だけから非線形に予測できることを示した（Zenodoの未査読の短い報告）。", "p3": "依存関係の項を持たない異質なコンドルセ模型（判定者ごとに正答率が異なる多数決の確率模型）で多数決の利得を予測し、線形に調整した多様性指標と比べた。公開の4つの正誤行列を使い、事前登録した（抄録）。", "p5": "コンドルセ模型は利得をスピアマン相関0.80で予測し、多様性指標は0.20にとどまった。四分相関による依存の推定を加えても0.01しか上がらなかった（抄録）。", "fun": "「みんなで多数決すれば、一番賢い人より正しくなれるか」という古くからの問いです。よく「メンバーの多様性が大事」と言われますが、この報告では、多様性の指標より各メンバーの正答率の組み合わせだけで多数決の得がよく予測できました。18世紀のコンドルセの陪審定理が、今の多数決の評価にも生きているのが面白い点です。", "unverified": "4つの正誤行列が何の課題のどの判定者（LLMか人か）のものかは未確認（抄録が短く本文を入手できず）。"}}, {"id": "pr19", "rank": 19, "headline": "物理的気候リスクは石油ガス企業の価値を下げる", "title": "Physical Climate Risk, Tobins’Q and Credit Risk: Evidence from the Oil and Gas Industry", "url": "https://doi.org/10.2139/ssrn.7560486", "authors": "ANTONIO GARCÍA-AMATE ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "石油・ガス企業で、物理的な気候リスクへの曝露が企業価値を下げる一方、信用リスクには表れないことを示した（未査読）。", "p3": "企業レベルのデータで、物理的気候リスクの曝露とトービンのq（市場価値と資産の再取得価格の比）、およびブラック・ショールズ・マートン模型で測った信用リスクとの関係を分析した（抄録）。", "p5": "曝露が大きいほどトービンのqが低く、特に小規模企業と上流部門で強かった。信用リスクとの関係は見られず、相対評価の指標や確率ゼロの観測を除いた標本でも結果は変わらなかった（抄録）。", "fun": "気候変動による災害リスクを、株式市場と借金の世界がどう値付けしているかを比べた研究です。株主は気候リスクを企業価値の割引として織り込むのに、貸し手側の倒産確率の指標には表れない、という食い違いが面白い点です。同じ企業でも、誰の目で見るかでリスクの見え方が違うことを示しています。", "unverified": "標本の期間・企業数と、物理的気候リスクの具体的な測り方は未確認（本文を入手できず）。"}}, {"id": "pr20", "rank": 20, "headline": "多主体の時系列から系全体の変化点を即時検出", "title": "On Multi-entity, Multivariate Quickest Change Point Detection", "url": "https://doi.org/10.2139/ssrn.7560445", "authors": "Bahar Kor ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "数が増減し互いに影響し合う多数の主体の多変量時系列から、系全体の振る舞いの変化を遅れ少なくオンラインで検出する教師なしの方法を示した（未査読）。", "p3": "各主体の通常からのずれ（IDfN）を求めて系全体の異常スコア（SWAS）に集約し、CUSUM（累積和）による逐次検出をかける2段階の手順で、学習には通常時のデータだけを使う（抄録）。", "p5": "合成データと群衆シミュレーションで系全体の変化を正確に検出できたとし、評価用に多主体・多変量のデータセットを3つ公開した。検出遅れなどの数値は抄録にない（抄録）。", "fun": "広場の人の流れのように、一人ひとりの動きは揺らいでも、集団全体の様子が急に変わる瞬間を見つけたい、という問題です。人数が途中で増えたり減ったりしても学習し直さずに使える点が工夫で、個人を映像で追わずに済むため、プライバシーにも配慮できます。", "unverified": "検出遅れ・誤検出率などの数値と比較手法は未確認（本文を入手できず）。"}}, {"id": "pr21", "rank": 21, "headline": "飲食店のAIチャットボット利用は信頼が鍵", "title": "AI chatbots in the food and beverage industry: Trust, privacy calculus, and customer engagement in a developing economy", "url": "https://doi.org/10.1016/j.chbr.2026.101274", "authors": "Frough, Eid Mohammad", "venue": "Zenodo", "date": "2026-10-04", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用", "preprint": true, "short": true, "p1": "マレーシアのカフェ利用者595人の調査で、飲食店のAIチャットボットの利用が、便益とプライバシーの不安を比べたうえでの「信頼」で決まることを示した（Zenodoの未査読文書）。", "p3": "技術受容の統合理論UTAUT2とプライバシー計算（便益とリスクの比較）を、信頼を媒介につないだモデルを、横断調査とPLS-SEM（部分最小二乗法の構造方程式モデル）で推定した（抄録）。", "p5": "期待される成果・使いやすさ・楽しさ・習慣が利用意図を強め、意図と習慣が実際の利用と結びついた。知覚した便益は信頼を高め、プライバシーのリスクは信頼を下げ、信頼は満足と直接・間接に結びついた（抄録）。", "fun": "店のチャットボットを使うかどうかは、便利さだけでなく「この店に個人情報を渡しても大丈夫か」という損得勘定で決まる、という話です。便利さと不安のてんびんの間に「信頼」という支点を置いて説明したのが工夫です。年齢によって楽しさの効き方が違う点も、身近な実感と合っています。", "unverified": "標本の抽出方法と、各経路の係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pr22", "rank": 22, "headline": "精神科病棟の安全事故とチームの特性", "title": "How do staff and team characteristics relate to ward safety incidents in adult inpatient mental health settings? A systematic integrative review.", "url": "https://doi.org/10.21203/rs.3.rs-11205262/v1", "authors": "Bethany Griffin ほか", "venue": "Research Square (In Review)", "date": "2026-10-04", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "精神科の成人入院病棟の安全事故とスタッフ・チームの特性の関係について、33か国135本の研究を統合し、人数や属性より対話・共感・チーム文化の方が一貫した手がかりであることを整理した（未査読）。", "p3": "6つのデータベースを1999年以降で検索した系統的統合レビューで、混合研究の評価ツール（MMAT）で質を評価し、帰納的な叙述的統合で分析した（抄録）。", "p5": "135本（量的80、質的46、混合9）を4テーマに整理した。スタッフの言葉や声の調子、患者への関わりやすさ、共感の影響が最も一貫し、人数・属性・経験の影響は一貫しなかった（抄録）。", "fun": "病棟の事故を減らすには「スタッフを増やせばよい」と考えがちですが、135本もの研究をまとめると、人数の効果ははっきりしませんでした。むしろ、話し方や共感、チームの雰囲気といった人と人の関わり方の方が一貫して効いていた、という発見が面白い点です。数より関わりの質という、職場一般にも通じる見方です。", "unverified": "テーマごとの研究数と効果の向きの内訳は未確認（本文を入手できず）。"}}, {"id": "pr23", "rank": 23, "headline": "AI不安が業績に与える影響は評価次第で分かれる", "title": "Artificial Intelligence Anxiety and Employee Performance: A Systematic Literature Review of Job Insecurity, Threat–Challenge Appraisal, Coping, Career Resilience, and Organisational Buffers", "url": "https://doi.org/10.5281/zenodo.23137500", "authors": "Kondagekar, Darpan Sudhakar", "venue": "Zenodo", "date": "2026-10-04", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（DataCite経由）を使用", "preprint": true, "short": true, "p1": "従業員のAI不安が業績に与える影響を、「脅威」と受け止める経路と「挑戦（機会）」と受け止める経路の2つで整理した系統的文献レビュー（Zenodoの未査読文書）。", "p3": "公開の学術文献と提供されたコーパスを、複数の概念的な検索と引用の前後をたどる方法で集め、質的な主題統合でまとめた。認知的評価理論、資源保存理論、仕事の要求度-資源モデルを統合した（抄録）。", "p5": "脅威の経路では雇用不安・情緒的消耗・離脱を通じて業績が下がりうるとし、機会の経路では学習やジョブ・クラフティングを通じて業績を支えうるとした。緩衝要因としてキャリアのレジリエンス、AI自己効力感、研修、支援的なリーダーシップなどを挙げた（抄録）。", "fun": "同じAIの導入でも、ある人は「仕事を奪われる」と感じ、別の人は「新しい道具だ」と感じます。この受け止め方の違いが業績を下げるか上げるかを分ける、という見方を整理した文献レビューです。テスト前の緊張がやる気にも不安にもなるのと似ていて、心の受け止め方で結果が変わるという考え方が面白い点です。", "unverified": "採用した文献の本数と選定基準は未確認。ScopusやWeb of Scienceを網羅的には検索していないと著者が述べている（抄録）。"}}, {"id": "pr24", "rank": 24, "headline": "多エージェント討論と検索で偽ニュースを検出", "title": "MARC-FEND:Multi-agent and Retrieval-augmented Cross-modal Fake News Detection", "url": "https://doi.org/10.2139/ssrn.7560524", "authors": "ziheng wang ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "画像と文章の意味の食い違い、異質な専門家役の多エージェント討論、検索による最新の事実確認を組み合わせ、SNSの偽ニュースを解釈可能な形で検出する枠組みを提案した（未査読）。", "p3": "クロスモーダルな注意機構と、文章の実体・画像の物体・出来事をつなぐ異種知識グラフで意味の関係を捉え、事実確認の専門家を模したエージェントが証拠に基づいて討論し、検索拡張生成で証拠を取り寄せて論理的な矛盾を調べる（抄録）。", "p5": "Weibo21で正解率96.1%・F1 95.9%、Twitterで正解率94.2%・F1 94.1%となり、既存の最先端手法を上回ったとする（抄録）。", "fun": "偽ニュースを見抜くのに、1人のAIに判断させるのではなく、立場の違う何人もの「AI記者」に議論させ、さらに最新のニュースを検索して裏を取らせる、という仕組みです。人間の編集部の校閲をまねた発想が面白い点です。写真と記事の内容が食い違っていないかも確かめます。", "unverified": "比較した既存手法と、討論のエージェント数・使用したLLMは未確認（本文を入手できず）。"}}, {"id": "pr25", "rank": 25, "headline": "PINNで層状砂岩のモードIII破壊則を同定", "title": "Identifying bedding-dependent Mode III fracture laws in sandstone using physics-informed neural networks", "url": "https://doi.org/10.2139/ssrn.7560619", "authors": "Pengcheng Zhu ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "層状の砂岩のモードIII（面外せん断）破壊について、表面の変位の計測と荷重から、内部のすべりの分布と結合力則（すべりと応力の関係）を同時に同定できるようにした（未査読）。", "p3": "界面の場を学習する縮約型の物理情報ニューラルネット（PINN）を固定の3次元弾性演算子で釣り合いと観測に結びつけ、層理の向きごとに切欠き深さの異なる試験片で構成則を共有させた。27枚の砂岩円板のうち18枚で同定し、9枚で再現性を評価した（抄録）。", "p5": "最大荷重の平均絶対相対誤差は0°・45°・90°で8.03%、6.84%、2.72%だった。45°と90°では最大荷重付近で応力がリガメントのほぼ全体に広がり、当てはめた最大強度は7.34MPaと14.39MPaだった（抄録）。", "fun": "岩を割るとき、内部で何が起きているかは直接見えません。この研究は、表面のわずかな変位の記録から、見えない内部の「すべり方のルール」をAIと力学の式を組み合わせて逆算します。層理の向きが45°と90°では当てはめた強さが2倍近く違い、その理由を局所的な強さと力を支える面積で説明できた点が面白いところです。", "unverified": "0°の最大強度の値と、従来の同定法との比較は未確認（本文を入手できず）。"}}, {"id": "pr26", "rank": 26, "headline": "合成画像で石積みのひび割れ検出を強化", "title": "A Framework for Generating Labelled Synthetic Masonry Damage Images for Computer Vision-Based Infrastructure Inspections", "url": "https://doi.org/10.2139/ssrn.7560001", "authors": "Jianyu Zhang ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "Blenderで石積み壁の形状・材質・ひび割れを同時に制御した合成画像と画素単位のラベルを作り、実画像の少ない石積みのひび割れ検出の学習を補えることを示した（未査読）。", "p3": "壁の幾何、材料の見た目、ひび割れの形を石積みの配置と結びつけて生成する手法（BCGデータセット）で、MCrack1300の固定の検証区分を使い、実画像1,000枚に合成画像3,000枚を加えた学習を3回反復して比べた（抄録）。", "p5": "ひび割れマスクのmAP50-95の平均は0.294から0.324に上がり、より少ない実画像では3つのアーキテクチャで改善した。1枚の壁を6方向から撮った外部画像では、最良のひび割れIoUの平均が0.284で、実画像のみの0.197を上回った（抄録）。", "fun": "AIにひび割れを見つけさせるには、ひび割れの位置を画素ごとに塗り分けた大量の写真が必要ですが、それを人手で作るのは大変です。そこで3DCGソフトで本物らしい壁とひび割れを作り、答え付きの練習問題として使いました。石の積み方とひび割れの走り方を結びつけて作ったのが工夫で、CGの技術が点検に役立つのが面白い点です。", "unverified": "生成器の開発に学習区分の実画像を使ったことの影響の大きさと、外部検証の条件の詳細は未確認（本文を入手できず）。"}}, {"id": "pr27", "rank": 27, "headline": "地下水を含む水文・土砂の統合モデルを検証", "title": "Investigating the Influence of Groundwater Flow on Sediment Transport Using an Integrated Hydrology-Sediment Modeling Framework: Model Development, Verification and Validation", "url": "https://doi.org/10.2139/ssrn.7560604", "authors": "Quan Wei ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "表流水と地下水を一体で計算する分布型の水文モデルに土砂の生産と輸送を組み込み、地下水の流れが土砂輸送に与える影響を流域規模で調べられるようにした（未査読）。", "p3": "物理ベースの完全分布型モデルHydroGeoSphereに、MUSLE式による土砂生産量の推定とメッシュ上の土砂の経路計算を結合した。理想化した斜面で経路計算を検証し、カナダ・オンタリオ州の流域の6つの観測所で妥当性を確かめた（抄録）。", "p5": "浮遊土砂濃度の範囲と時間変動をおおむね再現し、観測所ごとのR²は0.40〜0.73、RMSEは4.35〜13.83mg/Lだった。6か所中4か所はR²0.66〜0.73と一致が良く、残りは出水時の時刻のずれや観測の少なさなどによるとした（抄録）。", "fun": "川の濁りは、雨が地表を流れて土を削るだけでなく、地下の水の流れにも左右されます。この研究は、地表と地下の水の動きを一つの計算にまとめたうえで土砂の動きを追えるようにしました。見えない地下水が川の濁りにどう効くかを調べる道具を作った点が面白いところです。", "unverified": "地下水の有無で土砂輸送がどれだけ変わるかの定量的な結果は未確認（本文を入手できず）。"}}, {"id": "pr28", "rank": 28, "headline": "局地気候区分と微気象モデルで暑熱対策を評価", "title": "From urban scale to pedestrian level: Integrating LCZs, remote sensing, and ENVI-met for urban heat and green infrastructure assessment​", "url": "https://doi.org/10.2139/ssrn.7560979", "authors": "Camila Amaro de Souza", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "ブラジルのカンポグランデで、都市全体の地表面温度の診断と街区の微気象シミュレーションを組み合わせ、市街地の形ごとに緑化策の暑熱緩和効果を評価した（未査読）。", "p3": "局地気候区分（LCZ）、衛星による地表面温度と地表ヒートアイランド強度、ENVI-metによる微気象計算、体感温度の指標UTCIを組み合わせ、LCZ3・5・6の代表区域で5つのシナリオを比べた（抄録）。", "p5": "平均地表面温度はLCZ A（密な樹林）で28.21℃と最も低く、LCZ D（低い植生）で33.96℃と最も高かった。樹木の増加はUTCIをLCZ3・5・6でそれぞれ0.39℃、0.16℃、0.75℃下げ、屋上緑化を加えても歩行者の高さでの追加効果は見られなかった（抄録）。", "fun": "街を涼しくするには木を植えるのがよいのか、屋上を緑にするのがよいのかを、街並みのタイプごとに比べた研究です。歩く人の体感では木を増やすことが効き、屋上緑化を足しても上乗せが見られなかったという結果が意外な点です。同じ緑化でも、どこに緑を置くかで効き方が違うことを示しています。", "unverified": "シミュレーションの気象条件と対象日の詳細は未確認（本文を入手できず）。"}}, {"id": "pr29", "rank": 29, "headline": "AIが作る財務報告をリスクに応じて人が点検", "title": "A Risk-Tiered Human-Review Framework for AI-Generated Financial Reports", "url": "https://doi.org/10.2139/ssrn.7553960", "authors": "Preksha Barjatya", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "AIが作る財務報告について、データの品質と誤りの影響の大きさに応じて人の点検の強さを3段階に分ける概念的な枠組みを提案した（未査読、実証はしていない）。", "p3": "データガバナンス、データ品質管理、人が関与する監督、自動化バイアス（機械の出力を過信する傾向）の文献をレビューし、品質スコアと影響の分類で点検の段階を割り当てる。重大な出力には最低限の点検を課し、最も軽い段階は無作為に抜き取り、段階の見直しと品質スコアの定期的な検証を組み込む（抄録）。", "p5": "レビューした文献では、点検の強さをデータ品質と誤りの影響の両方に結びつけた研究が少ないと指摘した。枠組みは提案にとどまり、品質スコアの信頼性に依存することを著者が限界として挙げている（抄録）。", "fun": "AIが書いた報告書を人が全部同じ熱心さで確かめるのは非効率で、しかも人はAIの出力を信じすぎる傾向があります。そこで「データが怪しいか」「間違えると被害が大きいか」で、念入りに見る書類と抜き取りで済ます書類を分けよう、という提案です。病院のトリアージ（重症度による優先順位付け）に似た発想が面白い点です。", "unverified": "品質スコアの具体的な算出方法は未確認（本文を入手できず）。"}}, {"id": "pr30", "rank": 30, "headline": "可動せん断キーで橋台の耐震性能を高める", "title": "Controlling the seismic response of bridges with seat-type abutments through longitudinal movable shear keys on the stemwall", "url": "https://doi.org/10.2139/ssrn.7560923", "authors": "B. Neethu ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "座式橋台の竪壁（ステムウォール）に縦方向のせん断キーを設け、地震時に竪壁の耐力を生かして橋の縦方向の耐震性能を高める新しい支持方式を示した（未査読）。", "p3": "固定のせん断キーに加え、初期の遊間を最適化した受動適応型と、地震中にすべりを固定・解除する半能動型の可動せん断キーを検討した。橋台・背面土のプッシュオーバー解析で得た曲線を非線形ばねの骨格として、橋の非線形時刻歴応答解析で比べた（抄録）。", "p5": "提案した制御方式は、縦方向のせん断キーがない現行の方式や固定キーの方式より、主要な限界状態に達するのに必要な地震動の強さを高め、半能動型の可動せん断キーが全体として最も良い性能を示した（抄録）。", "fun": "橋の端の台（橋台）と橋桁の間には、地震のときにぶつかる隙間があります。この研究は、その隙間を動く「止め金具」で調節し、ふだんは使われない壁の強さまで地震に対抗する力に動員する工夫を提案しました。揺れの最中に金具を固定したり外したりする方式が最も効いたのが面白い点です。", "unverified": "限界状態に達する地震動の強さの具体的な倍率と、対象橋梁の諸元は未確認（本文を入手できず）。"}}, {"id": "pr31", "rank": 31, "headline": "植生の蒸散冷却と日陰冷却は日内で非対称", "title": "Asymmetric diurnal pathways of evapotranspiration and shading govern vegetation cooling under extreme heat", "url": "https://doi.org/10.2139/ssrn.7560980", "authors": "Jinghan Pan ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "猛暑時の植生の冷却効果を、蒸散による冷却と日陰による冷却の2経路に分け、1日の中での時間変化と都市形態ごとの制約が両者で異なることを示した（未査読）。", "p3": "乾燥・温帯・湿潤の気候帯にまたがる中国9都市の極端高温（TX90）の事例に、SCOPEモデルを100m解像度で適用して2経路を分離し、XGBoostとSHAP値で局地気候区分（LCZ）ごとの非線形な要因を、地理的加重回帰で空間的な非定常性を調べた（抄録）。", "p5": "両経路とも正午ごろに山がある一方、合計の冷却効果は19時ごろに4.9〜6.1℃で最大となり、経路の強さより数時間遅れた。蒸散冷却は水の利用可能性・樹冠構造・都市の密度に、日陰冷却は不透水面の割合と地表のエネルギー配分に強く制約された（抄録）。", "fun": "木が街を冷やすしくみには、葉から水を蒸発させて熱を奪う「打ち水」型と、日差しを遮る「日傘」型の2つがあります。両方とも昼に最も強く働くのに、気温を下げる効果が最大になるのは夕方の19時ごろという時間のずれが面白い点です。冷やす働きの強さと気温の結果が同時ではないことを示しています。", "unverified": "都市ごとの冷却量の差と、使った気象・植生データの期間は未確認（本文を入手できず）。"}}, {"id": "pr32", "rank": 32, "headline": "層理面のすべりを含む頁岩の異方性構成則", "title": "Modeling shale using an anisotropic elastoplastic virtual internal bond model accounting for bedding-plane slip", "url": "https://doi.org/10.2139/ssrn.7560381", "authors": "Weiwei Xiao ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "頁岩の母岩の微小破壊と、多数の平行な層理面の不可逆なすべりを、一つの構成則で同時に表せるようにした（未査読）。", "p3": "層理面の幾何を2つのパラメータを持つテンソルで表し、微視的な結合（仮想内部結合、VIB）の分布をそれに結びつけて異方性を表した。これに層理面のすべりを表すモール・クーロン塑性を結合し、異方性弾塑性VIBモデルとした（抄録）。", "p5": "シミュレーションで頁岩の破壊挙動と層理面のすべりを捉えられたとし、頁岩貯留層の水圧破砕の解析に使える力学モデルになるとした。実験との定量的な比較の数値は抄録にない（抄録）。", "fun": "頁岩は本のページのように薄い層が重なった岩で、割れるときには岩そのものが割れる現象と、ページ同士がずれる現象が同時に起こります。この研究は、目に見えない微小な結合の集まりとして岩を表すことで、2つの現象を一つの式にまとめました。ミクロの結びつきの向きの偏りで、マクロな「割れやすい方向」を表すのが面白い点です。", "unverified": "実験との比較の有無と検証の詳細は未確認（本文を入手できず）。"}}, {"id": "pr33", "rank": 33, "headline": "透水性のばらつきとハイドレート採掘の不確実性", "title": "Uncertainty Analysis of Long-term Evolution of Natural Gas Hydrate Extraction under a Fully Coupled THMC Model: The Impact of Spatial Permeability Variability", "url": "https://doi.org/10.2139/ssrn.7560670", "authors": "Junhoa Huang ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "天然ガスハイドレートの減圧採掘で、透水係数の空間的なばらつきがガス生産量と地盤沈下の予測をどれだけ揺らすかを、確率的に評価する枠組みを示した（未査読）。", "p3": "現地データで条件付けた透水係数の確率場を作り、熱・水・力学・化学を完全に連成させたTHMCモデルを完全陰的な有限要素法で解いて、変動係数（COV）と空間相関長を変えたモンテカルロ計算を行った（抄録）。", "p5": "多くの確率的な実現値で、決定論的なモデルより累積ガス生産量が多くなった。相関長の変化は変動係数の変化より生産量と沈下のばらつきを大きくし、井戸付近の平均透水係数より、流れの経路の抵抗を表す指標の方が生産量・沈下と強く結びついた（抄録）。", "fun": "地下の地層は場所ごとに水やガスの通りやすさがまだらに違います。この研究は、そのまだら模様をたくさん作って採掘を何度も模擬し、「平均的な通りやすさ」より「井戸までつながった通り道があるか」の方が結果を左右することを示しました。平均値だけでは足りず、つながり方が大事というのが面白い点です。", "unverified": "モンテカルロの実現値の数と、生産量の差の大きさは未確認（本文を入手できず）。"}}, {"id": "pr34", "rank": 34, "headline": "反証を受けてもLLMが仮説を保ち続ける現象", "title": "When Contradiction Fails to Revise the Model: Hypothesis Preservation, Epistemic Steering, and Human Intervention in Longitudinal Human–AI Reasoning", "url": "https://doi.org/10.5281/zenodo.23131758", "authors": "Aashna ほか", "venue": "Zenodo", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（DataCite経由）を使用", "preprint": true, "short": true, "p1": "長い対話の中でLLMが、最初の仮説に反する証拠を受けても仮説を改めず補助的な仮定だけを変える「仮説保持行動」を、行動として測る実験枠組みを提案した（Zenodoの未査読文書、実証データはない）。", "p3": "仮説の同一性を言葉の類似ではなく事前登録した識別的な予測で定め、両立する証拠・弱い反証・決定的な反証の3条件で反証の強さを操作し、その後に新しい識別質問を出して、答えの訂正と仮説の改訂を区別する「仮説保持テスト」を設計した（抄録）。", "p5": "主な指標として、矛盾の認識率、本当の改訂率、改訂までの遅れ、補助的な修正の深さ、反証の強さに応じた改訂の適切さなどを定めた。誤りを口で認めることは副次的な証拠として扱う。結果の数値は示されていない（抄録）。", "fun": "人は自分の説に合わない証拠を見ても、説を捨てずに言い訳を足していくことがあります。この研究は、AIにも同じ振る舞いがあるかを、答えを変えたかではなく、その後の予想が本当に変わったかで見分ける方法を考えました。驚く証拠のたびに説を変えるのも良くないので、反証の強さに応じて変えるのが正しい、という基準の置き方が面白い点です。", "unverified": "実際のLLMでの測定結果はなく、提案した指標の信頼性は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "計算基盤の偏在がAI行政サービスの地域差を生む", "title": "Spatial Inequality in the Algorithmic State: Mapping Compute Concentration, Network Topology and Localized AI Performance across Nigeria", "url": "https://doi.org/10.2139/ssrn.7560742", "authors": "Oluwatobi Salami", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "ナイジェリアで、通信網とデータセンターの空間的な偏りが、クラウド上のAI公共サービス（音声認識など）の地域ごとの使い勝手の差になることを推定し、計算資源を置く優先地域の指数を作った（未査読）。", "p3": "クラウドソースのセル情報2,834件、Tier III/IVのデータセンター13か所、モデル化した光ファイバ幹線13区間を統合し、Ooklaの112,291回の通信測定でTCPの通信速度モデルを較正して、最初の応答までの時間（TTFT）と単語誤り率（WER）を模擬した（抄録）。", "p5": "データセンター13か所のうち11か所がラゴス周辺に集中し、計算資源までの距離は遅延（r = +0.432）や下り速度（r = −0.468）と結びついた。北東部のハウサ語話者では、音声認識の最初の応答の遅れが3.9倍（1,862ms対483ms）、単語誤り率が28%高いと模擬された（抄録）。", "fun": "AIの窓口サービスは「どこからでも同じように使える」と思われがちですが、実際は計算機のある場所からの距離で反応の速さが変わります。この研究は、大都市から遠い地域の人ほど、AIの音声認識が遅く間違いも増えることを、地図と通信の測定データから示しました。デジタルの時代にも「距離の不平等」が残るという点が面白いところです。", "unverified": "AI立地指数の重み付けの方法は未確認（本文を入手できず）。"}}, {"id": "pr36", "rank": 36, "headline": "電力契約と証書を整合させる炭素責任の会計", "title": "Market-Based Carbon Responsibility Accounting for Electricity Contracts and Green Certificate Transfers", "url": "https://doi.org/10.2139/ssrn.7560247", "authors": "Gaoyang Zuo ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "再エネ電力の束ね契約、環境価値を切り離した電力、化石燃料の契約、単独で取引されるグリーン証書が混在する市場で、市場基準の炭素責任を二重計上や配分漏れなく割り当てる会計の手順を提案した（未査読）。", "p3": "決済の優先順位で各環境価値が1回だけ使われるようにし、証書を環境価値を切り離した電力の記録と結びつけ、証書の決済後に主体ごとの責任を更新する。対応する証書のある責任は契約者に、ない分は残余配分で対応しない電力の需要者に配る閉ループの枠組みで、物理的な排出と市場基準の責任を区別する（抄録）。", "p5": "期をまたぐ決済、再エネの発電量の変動、部分的な供給不履行の比較事例で各機能の役割を示し、設定した条件の下で責任の漏れと環境価値の重複主張を検出できることを示した（抄録）。", "fun": "「この電気は再エネ由来です」という証書は、電気そのものとは別に売り買いできます。すると同じ「緑の価値」を2人が主張したり、誰のものでもない排出が宙に浮いたりします。この研究は、簿記の貸借をそろえるように、炭素の責任の行き先を一つずつ帳尻合わせする手順を作りました。会計の考え方で環境価値の二重取りを防ぐのが面白い点です。", "unverified": "比較事例の具体的な数値と、実際の市場データへの適用の有無は未確認（本文を入手できず）。"}}, {"id": "pr37", "rank": 37, "headline": "コールセンターの顧客満足を決める要因", "title": "Determinants of Customer Satisfaction in the Call Centers of Karachi", "url": "https://doi.org/10.5281/zenodo.23135035", "authors": "Jabri, Maria", "venue": "Zenodo", "date": "2026-10-04", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（2015年の修士論文を2026年に登録したもの）", "preprint": true, "short": true, "p1": "パキスタン・カラチの携帯通信会社のインバウンド型コールセンターで、顧客満足を左右する要因を調べた修士論文（2015年に完成、2026年にZenodoへ登録、未査読）。", "p3": "サービスの利用しやすさ、サービス品質、対応の完全さ、専門性、応答性の5要因について、384人に構造化質問紙を配り、369件の有効回答で信頼性分析、主成分分析による探索的因子分析、属性と通信会社を統制した重回帰分析を行った（抄録）。", "p5": "利用しやすさ、サービス品質、対応の完全さは満足と有意に正の関係があり、専門性と応答性は有意な予測因子ではなかった（抄録）。", "fun": "電話窓口の満足度を決めるのは、オペレーターの丁寧さや素早さよりも、「つながりやすいか」「問題を最後まで解決してくれるか」だった、という結果です。感じの良さより、確実に用件が片づくことが大事だという点は、自分が問い合わせをしたときの気持ちを思い出すと納得がいきます。", "unverified": "回帰係数の大きさと決定係数は未確認（本文を入手できず）。"}}, {"id": "pr38", "rank": 38, "headline": "交通信号制御の多エージェント強化学習を総説", "title": "Cooperative Multi-Agent Foundations and the Sim-to-Real Gap in Traffic Signal Control: A Deployment-Oriented Survey", "url": "https://doi.org/10.2139/ssrn.7560448", "authors": "Bison Liao ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "交通信号制御の深層強化学習を、多エージェント強化学習（MARL）の一般的な仕組みから体系化し、シミュレーションでの成果が実地導入に結びつかない「sim-to-realギャップ」を整理した総説（未査読）。", "p3": "独立学習、集中学習・分散実行（CTDE）、価値分解、通信、逐次の結合最適化といったMARLの中核的な仕組みと各手法を対応づけ、インフラ、交通の動態、道路網の形、安全、計算の制約、評価方法の面から実地とのギャップを検討した（抄録）。", "p5": "既存のベンチマークの盲点を指摘し、導入を意識したベンチマーク、運用上の制約を組み込んだアルゴリズム、MARLの一般的な進歩の体系的な取り込みを今後の方向として挙げた。定量的な結果を示す論文ではない（抄録）。", "fun": "信号機をAIに任せて渋滞を減らす研究はたくさんありますが、実際の街にはほとんど入っていません。この総説は、交差点ごとのAIが協調する仕組みを整理し、なぜシミュレーションの成功が現実に持ち込めないのかを、安全や計算の制約、評価の仕方の面から洗い出しました。研究室と街の間の溝を正面から扱った点が面白いところです。", "unverified": "取り上げた文献の本数と選定基準は未確認（本文を入手できず）。"}}, {"id": "pr39", "rank": 39, "headline": "粗い砂岩節理のせん断挙動と破壊の進展", "title": "Quasi-Static Shear Behavior and Failure Evolution of Rough Sandstone Joints", "url": "https://doi.org/10.2139/ssrn.7560466", "authors": "Xiaoxiao Su ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "砂岩の節理面のせん断挙動と破壊の進み方に、表面の粗さ、せん断速度、水の飽和がどう組み合わさって効くかを実験で示した（未査読）。", "p3": "垂直応力15MPa一定で、節理粗さ係数（JRC）3.86・9.89・17.71の節理面を、乾燥と飽和の条件、せん断速度0.5〜1.5mm/sで準静的な一面せん断試験にかけ、アコースティック・エミッション（AE）、高速カメラ、デジタル画像相関（DIC）、3次元スキャンで観測した（抄録）。", "p5": "せん断は弾性・非線形・ピーク後のすべりの3段階を示し、ピークせん断応力と垂直変位の増加率はJRCと速度とともに増え、飽和では乾燥より低かった。残留せん断応力は、粗さの小さい面では速度とともに増え、粗い面では減った（抄録）。", "fun": "岩盤の割れ目がずれるときの抵抗は、割れ目の表面のでこぼこ、ずれる速さ、水にぬれているかで変わります。面白いのは、ずれ終わった後の抵抗が、なめらかな面では速くずらすほど大きく、でこぼこの面では逆に小さくなったことです。同じ「速さ」の効果が表面の形で逆向きになるという意外な結果です。", "unverified": "残留せん断応力の変化の大きさと、AE計数の具体的な値は未確認（本文を入手できず）。"}}, {"id": "pr40", "rank": 40, "headline": "利用者の口コミから実現可能な追加コンテンツを選ぶ", "title": "From Player Content to Feasible Game Add-Ons,A traceable decision-support case study of Cities: Skylines", "url": "https://doi.org/10.2139/ssrn.7560487", "authors": "Yao Zhang", "venue": "SSRN", "date": "2026-10-04", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "都市建設ゲーム「Cities: Skylines」を例に、プレイヤーのレビューやmod（利用者が作った追加データ）を、開発資源の制約の中で実現できる追加コンテンツの企画選びへ追跡可能な形でつなぐ意思決定支援の手順を示した（未査読）。", "p3": "公式の拡張・クリエイターパック41点への英語・中国語のレビュー7,693件と、プレイヤー作成物263点から語彙的な信号とmodの供給構成を作り、建物・交通・地図の3案を予算・アート・エンジニアリング・テストの制約の下で評価した（抄録）。", "p5": "大まかな方向の段階では「建物と地図」が最も高得点の実行可能な組み合わせだったが、具体的な作業パッケージに落とすとアートとテストの要件で実行不能になり、小規模な交通の案が選ばれた。感度分析と区間分析で選択が逆転する境界を示した（抄録）。", "fun": "ユーザーの口コミを読めば「何を作るべきか」が分かりそうですが、作れるかどうかは別問題です。この研究では、人気の高い案が、実際の作業量に分解するとデザインやテストの手が足りずに実現できないと分かり、別の小さな案が選ばれました。「欲しいもの」と「作れるもの」の間の溝を見える化した点が面白いところです。", "unverified": "語彙的な信号の作り方と、各案の得点の数値は未確認（本文を入手できず）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "宇宙開発の公的研究開発が製造業の自動化を進めた", "title": "Public R&D and the Automation of Manufacturing: Evidence from the Space Race", "url": "https://doi.org/10.2139/ssrn.7560837", "authors": "Apoorva Babbar ほか", "venue": "SSRN", "date": "2026-10-04", "why": "NASA関連の特許が同じ技術分類の中でも自動化寄りであることを全文特許から示し、Space Raceへの曝露が大きい産業・地域ほど労働分配率が持続的に下がったことを1947〜1992年のデータで示した。"}, {"id": "pn02", "rank": 2, "field": "開発経済学", "headline": "家庭訪問型の幼児支援、4.5年後も算数力の効果が残る", "title": "Early Childhood Intervention for the Poor: Long term outcomes", "url": "https://doi.org/10.2139/ssrn.7560438", "authors": "Pamela Jervis ほか", "venue": "SSRN", "date": "2026-10-04", "why": "インドで行われた拡張可能な家庭訪問の無作為化介入を追跡し、平均7.5歳時点でも初期の数的能力に効果が残り、最も不利な子どもで効果が大きいことを示した。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "中小企業減税の穴を地方政府は手数料で埋めた", "title": "The Redistribution of Targeted Tax Cuts: Fiscal Rebalancing and Non-Tax Burden in China", "url": "https://doi.org/10.2139/ssrn.7560440", "authors": "Binzhen Wu ほか", "venue": "SSRN", "date": "2026-10-04", "why": "中国の法人税減税による地方の税収減を都市間の差で分析し、非税収入の増加がそれをほぼ相殺し、受益企業でも減税分の大半が手数料の増加で打ち消されたことを示した。"}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "中心窩を模した『ぼかしマスク』で頑健な視覚表現", "title": "Foveation as self-supervision signal: Blur masks beat blank masks for learning robust visual representations", "url": "https://doi.org/10.64898/2026.09.26.754698", "authors": "Akihito Maruya ほか", "venue": "bioRxiv", "date": "2026-10-04", "why": "マスク画像モデリングで空白マスクの代わりにぼかし・網膜型のマスクを使うと、再構成と下流の分類の両方で上回り頑健性も高いことを示し、空間周波数への依存の違いで汎化の差を説明した。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "識別できない方向に沿って動くMCMCでODEを推定", "title": "A Geometric Bayesian Parameter Inference Meth         var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, written to be pasted into an AI chat app on a phone (Claude, ChatGPT, Gemini):
  // self-contained, with no skills, local files or PC tools; it follows the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "- 詳しさ：{depth}",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。渡らないアプリでは、依頼文をコピーしてチャットに貼り付けます。"
    : "依頼文をコピーして、AIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIアプリのチャットに貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
