人もそのバスに乗りに来るなら、比べる相手も影響を受けてしまい、効果は見えなくなります。この研究は、人が実際に行き来するつながりで「誰が影響を受けたか」を決め直しました。すると「効果なし」だった無料化で、訪問が15.65%、最も所得の低い層では23.00%増えていたことが見えてきました。", "unverified": "3つの事例以外の施策への一般化と、移動データの代表性の補正の詳細（補足資料）は未確認。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "地方の人口減と高齢化は今後も格差を広げる", "title": "Living in a Ghost Town: The Geography of Depopulation and Aging", "url": "https://doi.org/10.3386/w35852", "authors": "Elisa Giannone ほか", "venue": "NBER Working Paper", "apa": "Giannone, E., Miyauchi, Y., Paixao, N., Pang, X., & Suzuki, Y. (2026). Living in a Ghost Town: The Geography of Depopulation and Aging (NBER Working Paper No. 35852). National Bureau of Economic Research. https://www.nber.org/papers/w35852", "why": "日本の細かな地域データで、地方ほど人口減少と高齢化が速く、行政サービスの1人当たり費用が上がることを示した。動学的な空間一般均衡モデルで、地域の格差が今後さらに広がると予測した。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。NBERワーキングペーパーの本文は入手できず", "preprint": true, "p1": "日本の細かな地域データで、地方ほど人口減少と高齢化が速いことを示し、動学的な空間一般均衡モデルで、地域の格差が今後さらに広がると予測した（未査読のワーキングペーパー）。", "p2": "人口減少と高齢化は国全体で進むが、地域ごとの進み方の違いと、それが経済活動の総量と地域格差に与える影響は十分に分かっていない（抄録）。", "p3": "過去数十年の日本の地域データで人口と年齢構成の変化を記述し、ライフサイクルを組み込んだ動学的な空間一般均衡モデルを作って較正した（抄録）。直観：若い世代が都市へ移ると地方の高齢化が進み、地域の利便が落ちてさらに人が出ていく循環をモデルで追う。", "p4": "評価の軸は、地方と都市の人口減少・高齢化の速さの差、地域の利便と行政サービスの1人当たり費用の変化、そしてモデルによる将来の予測と、衰退地域への補助金の効果である（抄録）。", "p5": "地方は低い出生率と若い世代の流出の継続によって、都市よりかなり速く人口が減り高齢化した。こうした地域では地域の利便が落ち、行政サービスの1人当たり費用が上がっていた。モデルは、今後数世紀にわたって人口減少・高齢化・経済活動の地理的な格差が広がると予測した。衰退地域への補助金は地域格差を縮めるが、経済全体の効率を下げ、行政支出を増やす（抄録）。", "p6": "抄録からは、モデルの重要なパラメータの値と、予測の不確かさの幅は分からない。解釈：数世紀先の予測は出生率や移住の行動が変わらない前提に強く依存するため、政策の比較の目安として読むのが妥当だろう。", "fun": "日本の田舎では、人が減り、お年寄りの割合が増えていく町が少なくありません。この研究は、それが「若い人が都会へ出ていく」ことと「子どもが少ない」ことで加速し、町の便利さが落ちてさらに人が減る循環になっていることを数字とモデルで示しました。補助金で格差は縮められても、国全体の効率は下がるという、悩ましい二択も見えてきます。", "unverified": "モデルのパラメータの値、予測の不確かさ、補助金の効果の大きさは未確認（本文を入手できず）。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "クラスタ内で相関する回帰の推論を体系化", "title": "Inference for Regression with Clustered or Spatially Correlated Data I: Framework and Clustering", "url": "https://doi.org/10.3386/w35800", "authors": "A. Colin Cameron ほか", "venue": "NBER Working Paper", "apa": "Cameron, A. C., & Miller, D. L. (2026). Inference for Regression with Clustered or Spatially Correlated Data I: Framework and Clustering (NBER Working Paper No. 35800). National Bureau of Economic Research. https://www.nber.org/papers/w35800", "why": "クラスタ内で相関する観測を独立とみなすと、信頼区間が狭すぎ、検定が過大に棄却する。クラスタ頑健な推論、とくにクラスタ数が少ないときの有限標本の補正を整理した、実証研究の手引きになる論文。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "p1": "クラスタ内で相関し、クラスタ間では相関しない観測を使う回帰について、標準誤差を正しく補正する推論の方法を体系的に整理した。実証研究の手引きを目的とした論文の前編である（未査読のワーキングペーパー）。", "p2": "クラスタ内の観測は正に相関しがちで、追加の1観測がもたらす情報は独立な観測より少ない。相関を無視して標準誤差を補正しないと、信頼区間は狭すぎ、検定は過大に棄却する（抄録）。", "p3": "まず一般的な枠組みを示し、続いてクラスタ内で相関しクラスタ間で無相関な場合の推論を扱う。とくにクラスタの数が多くないときに有限標本での性能を高める、クラスタ頑健な推論の方法を詳しく説明する（抄録）。直観：同じ学校の生徒どうしが似ているなら、生徒の数ではなく学校の数が実質の情報量に近い。", "p4": "新しい推定量の比較ではなく、どの場面でどの補正が必要かを示す手引きとしての整理が中心である。空間的に距離とともに弱まる相関は、後編（Cameron and Miller 2026）で扱う（抄録）。", "p5": "クラスタの数が多くないときには、有限標本での補正がしばしば必要だと結論している（抄録）。", "p6": "抄録からは、推奨される具体的な補正法（ワイルド・クラスタ・ブートストラップなど）と、その性能の比較の結果は確認できない。解釈：クラスタの定義そのもの（どの単位で相関を許すか）の選び方は、データの文脈に依存する判断として残る。", "fun": "同じクラスの生徒は、同じ先生に教わり同じ環境にいるので、成績が似がちです。それを無関係な一人ひとりの観測として数えると、本当より多くのデータがあるように錯覚し、効果を「確かだ」と言い過ぎてしまいます。この論文は、その錯覚を正す計算の作法を、実証研究者のためにまとめた手引きです。", "unverified": "推奨される補正法の具体的な中身と性能比較は未確認（本文を入手できず）。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "回帰不連続デザインは閾値への反応を見落とす", "title": "Evaluating Threshold Policies in Randomized Threshold Designs: A Cautionary Tale for Regression Discontinuity Designs", "url": "https://arxiv.org/abs/2610.02938", "authors": "Shunsuke Imai ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Imai, S., Nishida, K., & Okamoto, Y. (2026). Evaluating Threshold Policies in Randomized Threshold Designs: A Cautionary Tale for Regression Discontinuity Designs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02938", "why": "閾値で処置を決める政策では、閾値そのものが人の行動を変える。閾値を無作為に変えた実験でその効果を切り分けると、マラウイの奨学金では従来の推定が正でも、行動の反応の効果は負でその2倍超だった。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（動機の事例、設計と識別、実証の結果、結論）と表1・図2・3を読んだ", "preprint": true, "p1": "閾値で処置を決める政策には、処置を受ける効果のほかに、閾値そのものが人の行動を変える効果がある。閾値を無作為に変えた実験を使って両者を分けて識別する枠組みを作り、マラウイの奨学金では、通常の回帰不連続（RD）の推定が正でも、行動の反応の効果は負でその2倍超だったことを示した（arXivの未査読プレプリント）。", "p2": "RDデザインは閾値の前後を比べて処置の割当ての効果を識別するが、閾値の存在が努力や動機を変える経路は捉えられない。その経路が大きければ、RDだけでは政策全体の良し悪しを誤って判断しうる（§1・2）。", "p3": "閾値を変えずに処置だけを変える対比を「処置割当ての効果」、処置を固定して閾値の体制を変える対比を「誘因への反応の効果」と定義した（§3.2）。閾値が無作為に割り当てられた設計で、順位の不変性という仮定のもと、同じ順位の人どうしを比べて両者を局所的に点識別する（§3.3）。仮定を弱めた部分識別も示した（§3.4）。直観：成績の順位が同じ生徒を、閾値のある群とない群で比べれば、閾値が生んだ行動の差が見える。", "p4": "応用は、Berry et al. (2022) のマラウイの無作為化実験で、上位15%の成績なら4,500クワチャ（9.70ドル）を受け取れる奨学金の群と対照群を、翌学年の成績で比べた（§2・4）。推定は局所多項式で、学校単位でクラスタ化した頑健な偏り補正の信頼区間を使う（表1）。", "p5": "閾値付近（順位0.89）で、処置割当ての効果は0.418（RDの帯域では0.424）と正だった。一方、誘因への反応の効果は−1.109と有意に負で、絶対値は2倍超だったため、合計の効果も負と推定された（表1）。順位0.4と0.8でも反応の効果は有意に負だった。6月の試験の成績への分位点の効果も、分布のほぼ全体で負で、最上位でだけ正だった（図3）。", "p6": "識別は閾値の無作為な割当てと順位不変性の型の仮定に依存し、観察データへの拡張は今後の課題と著者は述べる（§5）。解釈：反応の効果が負になった仕組み（届かない目標でやる気を失う、外的報酬が内発的動機を損なう）は先行研究からの推測で、この分析が直接示したものではない。", "fun": "「上位15%に入れば奨学金」という制度は、頑張る動機になりそうです。ところがマラウイの実験を分析し直すと、奨学金そのものは成績を上げる一方、「上位15%」という高い壁が多くの生徒のやる気をそぎ、全体では成績を下げていた可能性が浮かびました。ごほうびの中身だけでなく、ごほうびの「線の引き方」も人の行動を変えるのです。", "unverified": "部分識別による上下限の推定結果（図4）の数値は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "政治学", "headline": "LLMの推薦は投票規則として働き循環を生む", "title": "Large Language Models as Voting Mechanisms", "url": "https://doi.org/10.3386/w35839", "authors": "Raša Karapandža ほか", "venue": "NBER Working Paper", "apa": "Karapandža, R., & Nyarko, Y. (2026). Large Language Models as Voting Mechanisms (NBER Working Paper No. 35839). National Bureau of Economic Research. https://www.nber.org/papers/w35839", "why": "LLMの出力確率を、学習データが投票した結果とみなせることを証明した。投票なので選好の循環が起こりうる。ChatGPT-4oで、S&P100社の投資推薦に数百万の循環を見つけた。", "explain": {"basis": "抄録", "basis_note": "SSRN版の記録（Crossref）から抄録を取得して使用。NBERワーキングペーパーの本文は入手できず", "preprint": true, "p1": "LLMの出力確率を、学習データが投票した結果とみなせることを証明し、そのため推薦に選好の循環（コンドルセ・サイクル）が起こりうることを示した。ChatGPT-4oの投資推薦で、数百万の循環を見つけた（未査読のワーキングペーパー）。", "p2": "LLMは経済や金融の助言をますます担っているが、その推薦がどんな性質をもつかを理解するミクロ経済学の枠組みがなかった（抄録）。", "p3": "入力の文章を1回の選挙、続きの候補を立候補者、出力確率を学習コーパスから得た得票率とみなせることを定理として示した。投票規則にはコンドルセの循環が起こりうるので、2択の推薦が推移的でなくなる（抄録）。直観：AよりB、BよりC、CよりAを勧めるなら、乗り換えのたびに手数料を取られる「お金のポンプ」にされうる。", "p4": "S&P100社の組み合わせについて、ChatGPT-4oに2社のどちらに投資すべきかを尋ね、推薦の循環の数を調べた（抄録）。", "p5": "S&P100社の対の投資選択で、数百万の循環を見つけた。循環を事後に直すことは一般に不可能だと示した。温度T=1では得票率どおりに出力が抽出され、温度を下げると最多得票の候補が有利になり、上げると確率が一様に近づく（抄録）。", "p6": "抄録からは、循環の割合（全組み合わせに対する比率）と、他のモデルでの再現は分からない。解釈：投票の解釈は学習データ上で成り立つと示されたが、指示調整や人間のフィードバックによる学習が投票規則をどう変えるかは別の問題として残る。", "fun": "AIに「A社とB社、どちらの株がいい？」と聞くと答えてくれます。この研究は、AIの答えが学習データの「多数決」で決まる仕組みだと証明しました。多数決には有名な落とし穴があり、AよりB、BよりC、なのにCよりAという堂々巡りが起こります。実際にAIの投資推薦で、そうした堂々巡りが数百万も見つかりました。", "unverified": "循環の割合と、他のモデルでの再現の有無は未確認（本文を入手できず）。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "LLMエージェントは出どころで商品を選り好みする", "title": "Source Preference in the Wild: How LLM Agents Favor Items by Source, and How to Reduce It", "url": "https://arxiv.org/abs/2610.03195", "authors": "Jonghyun Song ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "Song, J., Park, H., Shim, J., Song, W., & Jo, Y. (2026). Source Preference in the Wild: How LLM Agents Favor Items by Source, and How to Reduce It (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03195", "why": "12のエージェントモデルが、同じ条件を満たす商品でも出どころのサイトによって選び分けることを示した。好まれる出どころなら、条件を1つ満たさない商品でも約3分の2の確率で選ばれる。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（設定、選好の測り方、実環境と統制実験の結果、学習データの実験、情報欠如の実験）と表1〜5・図3を読んだ", "preprint": true, "p1": "LLMエージェントが利用者に代わって商品・宿・論文を選ぶとき、同じ条件を満たしていても、出どころのサイトで選り好みすることを、12のモデルの実際の検索で示した。その選好は出どころの情報そのものに反応しており、学習データの偏りから生まれ、学習や指示で弱められる（arXivの未査読プレプリント）。", "p2": "エージェントが何を選ぶかは、利用者が受け取るものと、どのサイトが選ばれるかを左右する。だがエージェントが出どころで選り好みするか、それが要求の満たし方より優先されるかは、実際の検索環境で測られていなかった（§1）。", "p3": "12のモデルにReAct型の検索と選択をさせ、同じ要求に対して同じ要件を満たす異なる出どころの商品の組を作り、選ばれやすさの差を選好スコアとした（§2–3）。出どころの名前とURLを隠す・入れ替える統制実験、偽の出どころで選好をDPOで作る・消す実験も行った（§5–6）。直観：同じ条件の品が並んだとき、どの店の品かだけで選ばれ方が変われば、それは店への選好である。", "p4": "領域は買い物・宿泊・学術の3つで、4,822件の要求を使った（§2）。要件を満たすかは出どころを隠したLLM審判が判定し、人間との一致は人間どうしと同程度だった（クリッペンドルフのα 0.65〜0.75対0.67〜0.72）。要件を1つ多く満たす品が選ばれない「逆転」の率も比べた（§4.2）。", "p5": "144のモデル×出どころの組み合わせのうち110で選好か回避が見られ、中央値は+15と−18ポイントだった（§4.1）。好まれる出どころの品は、要件を1つ満たさなくても中央値で68%選ばれ、逆の場合はほぼ選ばれなかった（2%）（図3）。DPOで出どころと良い回答を結びつけると選択率は70.1〜75.1%に上がり、逆に結びつけると24.5〜28.5%に下がった。Amazonへの既存の選好も、釣り合いの取れた学習で約50%に戻った（表4・5）。", "p6": "著者は、評価が3つの領域と特定の検索の設定に限られる点を認めている（§8）。解釈：出どころの選好が、実際の品質の評判を反映した合理的な事前知識なのか、不当な偏りなのかは場合によって違い、どこまで消すべきかは設計上の価値判断になる。", "fun": "AIに「条件に合う商品を買っておいて」と頼む時代が来ています。この研究では、AIは同じ条件を満たす商品でも、売っているサイトによって選り好みしていました。好きなサイトの商品なら、条件を一つ満たしていなくても選んでしまうほどです。その癖は学習データの偏りから生まれ、学習のやり直しで直せることも分かりました。AIの買い物にも、ひいきがあるのです。", "unverified": "システムプロンプトによる緩和の効果の数値（表6）は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "機械投資の技能偏向は取引先で生じる", "title": "Capital-Skill Complementarity Beyond Firm Boundaries", "url": "https://doi.org/10.3386/w35857", "authors": "Gert Bijnens ほか", "venue": "NBER Working Paper", "apa": "Bijnens, G., Humlum, A., & Vanormelingen, S. (2026). Capital-Skill Complementarity Beyond Firm Boundaries (NBER Working Paper No. 35857). National Bureau of Economic Research. https://www.nber.org/papers/w35857", "why": "新しい機械はSTEM人材の需要を高めるはずだが、投資企業の社内では確認されなかった。ベルギーの取引データで、需要の増加はほぼすべて機械の統合業者などの取引先で起きていることを示した。", "explain": {"basis": "本文", "basis_note": "CESifo版のPDF本文（抄録、概念の枠組み、データ、投資の急増の分析の設計、結論）を読んだ。NBERワーキングペーパーと同じ論文", "preprint": true, "p1": "新しい機械への投資は熟練人材の需要を高めるはずなのに、投資した企業の社内では確認されなかった。この謎を、取引先まで見ると解けることを示した。STEMの高学歴人材への需要の増加は、ほぼすべて機械の統合業者などの外部の取引先で生じていた（未査読のワーキングペーパー）。", "p2": "資本と技能の補完性は技術変化と賃金格差の研究の柱だが、近年の企業データの研究では、機械に投資した企業の技能の構成は変わらず、仮説への疑問が出ていた（§7）。原因は、企業の給与台帳だけを見ていることにあるかもしれない（§1）。", "p3": "ベルギーの2003〜2020年の行政データで、企業の決算（設備投資）、企業間の取引記録（VATの顧客リスト）、従業員の学歴（分野と水準）を企業の識別子で結びつけた（§2）。投資が急増した企業と似た非急増企業を、積み重ねた差の差の枠組みで比べ、社内の雇用と、取引先からの購入を通じた外部の雇用の両方を追った（§3.1）。直観：機械を入れた会社が自分で技術者を雇わず、外部の業者に頼むなら、技能の需要は業者の側に現れる。", "p4": "評価の軸は、投資の急増の後に、社内と外部で高学歴STEM・高学歴非STEM・低学歴STEM・低学歴非STEMの各層の需要がどれだけ増えるかである。さらに、事象研究で推定した一般均衡モデルで、経済全体の相対需要と賃金プレミアムへの影響を計算した（§3・6）。", "p5": "機械の投資の急増の後、取引先からの購入を通じて高学歴STEM人材への総需要は45%増え、他の技能層の3倍だった。社内の雇用による増加は5%未満で、技能層による差もなかった（抄録）。外部の需要は、まず機械の統合業者から、のちにソフトウェアなどの補完サービスから生じた。2003〜2021年の労働者1人あたりの機械の増加は、高学歴STEMの相対需要を8.8対数ポイント、賃金プレミアムを3.1対数ポイント高めたが、給与台帳だけで測るとどちらも下がる（§7）。", "p6": "賃金ではなく雇用に焦点を当てたのは、データの制約による（§2）。外部の取引先の役割の因果は、今後の研究に委ねている（§7）。解釈：統合業者を使いにくい中小企業ほど外部の需要が強いという結果は、統合サービスの供給が技術の普及の速さを左右しうることを示すが、その供給側の制約は直接は測られていない。", "fun": "工場に新しいロボットを入れたら、その会社は技術者を雇うはずです。ところが会社の名簿を調べても、技術者はほとんど増えていませんでした。この研究は、会社どうしの取引記録までたどり、技術者の需要が、ロボットを据え付ける外部の業者の側で大きく増えていたことを突き止めました。名簿だけを見ると見えない変化が、取引の網の中にあったのです。", "unverified": "事象研究の推定値の時間的な推移（図）と、頑健性の検証の詳細は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "宝くじの当選金、高所得者は貯蓄に回す", "title": "Consumption, Savings, and Earnings Responses to Financial Windfalls", "url": "https://doi.org/10.3386/w35836", "authors": "Rajashri Chakrabarti ほか", "venue": "NBER Working Paper", "apa": "Chakrabarti, R., d'Astous, P., Kroft, K., Kulkarni, S., Mikhed, V., Notowidigdo, M. J., Raina, S., & Scholnick, B. (2026). Consumption, Savings, and Earnings Responses to Financial Windfalls (NBER Working Paper No. 35836). National Bureau of Economic Research. https://www.nber.org/papers/w35836", "why": "カナダの宝くじ当選者を税務・信用情報と結びつけ、臨時収入が消費・貯蓄・賃金に与える因果効果を推定した。高所得者は貯蓄と余暇に、低所得者は消費に多く回しており、給付金やベーシックインカムの設計に示唆を与える。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "p1": "カナダの宝くじ当選者を税務と信用の記録に結びつけ、臨時収入が消費・貯蓄・賃金に与える因果効果を推定した。高所得者は貯蓄と余暇に、低所得者は消費に多く回していた（未査読のワーキングペーパー）。", "p2": "臨時の収入を人々がどう使い分けるかは、景気対策の給付金やベーシックインカムの設計に欠かせないが、消費・貯蓄・労働を同時に測った因果の証拠は限られる（抄録）。", "p3": "宝くじの当選は所得とは無関係に起きるので、当選金を臨時収入の自然な実験として使える。当選者を所得税の記録と信用情報の記録に別々につなぎ、消費をクレジットカードの支出、貯蓄を金融資産の積み増しと借金の返済、賃金を税の記録で測った（抄録）。", "p4": "当選金に対する消費・貯蓄・賃金の反応を推定し、その反応が所得分布のどこにいる人かでどう違うかを比べた（抄録）。", "p5": "高所得者は当選金のより大きな割合を貯蓄と余暇（働く量を減らすこと）に回し、低所得者はより大きな割合を消費に使った。この異質性を、景気対策の給付の設計、ベーシックインカムの評価、賃金と貯蓄への最適な最高税率の3つの応用で示した（抄録）。", "p6": "抄録からは、反応の大きさ（当選金1ドルあたりの消費の増加など）と、当選金の規模による違いは分からない。解釈：宝くじを買う人は一般の人と性格や家計の状況が違う可能性があり、結果を全人口に当てはめるには注意が要る。", "fun": "もし宝くじで大金が当たったら、あなたは使いますか、貯めますか。この研究は、カナダの当選者の税と借金の記録を調べ、もともと所得の高い人は貯めたり仕事を減らしたりし、所得の低い人は使う割合が大きいことを示しました。同じ給付金でも、誰に配るかで経済への効き方が変わるという、政策設計の手がかりになる結果です。", "unverified": "反応の大きさの数値と、当選金の規模による違いは未確認（本文を入手できず）。"}}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "非正則な場面のクロスフィッティングを正しく推論", "title": "Cross-Fitting Under Nonregularity: Normality and Inference via Locality", "url": "https://arxiv.org/abs/2610.02944", "authors": "Bruno Fava", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Fava, B. (2026). Cross-Fitting Under Nonregularity: Normality and Inference via Locality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02944", "why": "クロスフィッティングの通常の信頼区間は、モデル比較や異質な処置効果の検定などで被覆率が足りなくなる。新しい局所性条件のもとで中心極限定理が成り立つことを示し、分散の補正法を提案した。", "explain": {"basis": "本文", "basis_note": "arXivのPDF本文（序論、局所性条件と中心極限定理の要点、シミュレーション、結論）と表1を読んだ。証明の細部は読み切れていない", "preprint": true, "p1": "クロスフィッティングで作った推定量は、非正則な場面でも中心極限定理を満たすが、その分散には分割間の相関が効くことを示した。相関を推定して補正すると、信頼区間の被覆率がほぼ名目どおりになる（arXivの未査読プレプリント）。", "p2": "クロスフィッティングは、全観測を学習と評価の両方に使える一方、分割どうしに依存を生む。多くの場面ではその依存は無視できるが、交差検証によるモデル比較、処置効果の異質性の検定、一意でない最適な処置方針の価値の推定といった非正則な場面では消えず、通常の信頼区間は被覆率が不足する（§Introduction）。", "p3": "学習データの1点を変えたとき、評価点の予測への影響がその点の近くに限られるという新しい「局所性」の条件を使い、非正則でも大きな種類の分割標本の推定量が正規近似できることを示した。漸近分散には分割間の相関が入るので、それを再標本化で推定し、信頼区間を作る（§Introduction・Conclusion）。直観：森の木やニューラルネットは近くの点ほど強く影響し合うので、遠い点どうしの依存は薄まる。", "p4": "シミュレーションで、交差検証のモデル比較と、予測力の検定（BLP）の2例について、信号のない2つのデータ生成過程（等分散のガウス型、条件付きで歪んだ不等分散型）、n=1,000と2,000、ニューラルネットとランダムフォレストの学習器で、名目95%の区間の被覆率を2,400回の反復で調べた（§Simulation Study）。", "p5": "相関を推定した区間の被覆率は、BLPで94.13〜95.67%、交差検証で94.21〜95.79%と、名目の95%に近かった。相関を無視した区間は多くの設定で95%を下回り、最も低い場合は84.50%だった（表1）。", "p6": "結果は局所性の条件に依存し、それが満たされない学習器では保証されない。解釈：シミュレーションは信号のない設計に限られ、実際に予測力や効果の異質性がある場合の検出力は確かめられていない。再標本化による相関の推定（B=500回）の計算負担も、大きなデータでは課題になりうる。", "fun": "データを半分に分けて「片方で学び、もう片方で試す」を入れ替えて行うと、データを無駄なく使えます。ところが、入れ替えた2つの結果は互いに独立ではありません。それを独立とみなすと、「自信あり」の幅を狭く見積もりすぎてしまいます。この論文は、その見えない結びつきを測って補正する方法を作り、95%と言った区間が本当に95%で当たるようにしました。", "unverified": "局所性の条件の正確な数式と、処置方針の価値の推定への適用の詳細は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "米国STEM博士論文の29%にAIが書いた文章", "title": "How Heavily Are PhD Students Offloading Their Scientific Writing to AI? Evidence from US STEM PhD Dissertations", "url": "https://doi.org/10.3386/w35859", "authors": "Daniel P. Gross ほか", "venue": "NBER Working Paper", "apa": "Gross, D. P., Shvadron, D., & Zhang, H. (2026). How Heavily Are PhD Students Offloading Their Scientific Writing to AI? Evidence from US STEM PhD Dissertations (NBER Working Paper No. 35859). National Bureau of Economic Research. https://www.nber.org/papers/w35859", "why": "米国のSTEM博士修了者のほぼ全数について、博士論文の中のAIが書いた文章を測った。2023年以前はゼロで、2026年提出分では29%に達する。AIを使った修了者は、学術研究職に進む割合が低い。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "p1": "米国のSTEM博士修了者のほぼ全数の博士論文で、AIが書いた文章を測った。2026年提出分の29%にAIの文章があり、AIを使った修了者は学術研究職に進む割合が低かった（未査読のワーキングペーパー）。", "p2": "研究の文章をAIに任せると、科学の訓練が育てるはずの専門性の発達を損なうのではないか、という懸念がある。その実態と、その後の進路との関係は測られていなかった（抄録）。", "p3": "2019〜2026年の米国STEM博士修了者のほぼ全数の博士論文で、AIが生成した文章の有無を測り、修了者をその後の雇用と結びつけた。同じ課程・同じ年の修了者どうしで比べる（抄録）。", "p4": "評価の軸は、年ごとのAIの文章の割合、出身国や課程の順位による違い、そしてAIの文章の有無と、学術研究職・テニュアトラック以外の職・産業界への進路の関係である（抄録）。", "p5": "AIの文章は2023年以前にはなく、2026年の提出分では29%に現れ、急増していた。非英語圏の出身の学生と、順位の低い課程で多かった。同じ課程・同じ年では、AIの文章を含む修了者は学術研究職に進みにくく、テニュアトラック以外の職や産業界に進みやすかった。この傾向は米国出身の学生で最も強かった（抄録）。", "p6": "抄録からは、AIの文章を検出する方法の精度と、誤検出の影響は分からない。解釈：進路との関係は因果とは限らず、研究職を目指さない学生ほどAIに頼るという逆向きの説明も考えられる。", "fun": "博士論文を書くのは、研究者になるための大切な修行です。この研究は、米国の理工系の博士論文を調べ、2026年には約3割にAIが書いた文章が含まれていたことを示しました。しかも、AIを使った人ほど大学の研究職に進まない傾向がありました。AIで書く作業が速くなる一方で、専門家を育てる修行の一部が置き換わっているのかもしれません。", "unverified": "AIの文章の検出方法とその精度、進路との関係の大きさは未確認（本文を入手できず）。"}}, {"id": "pn11", "rank": 11, "field": "政治学", "headline": "黒人向け学校の建設が公民権運動前の活動を育てた", "title": "Schooling and Political Activism in the Early Civil Rights Era", "url": "https://doi.org/10.3386/w35842", "authors": "Daniel Aaronson ほか", "venue": "NBER Working Paper", "apa": "Aaronson, D., Borgschulte, M., Liu, S., & Mazumder, B. (2026). Schooling and Political Activism in the Early Civil Rights Era (NBER Working Paper No. 35842). National Bureau of Economic Research. https://www.nber.org/papers/w35842", "why": "20世紀初頭のローゼンワルド学校の建設が、1940年代初めのNAACP支部の増加につながったことを示した。職業差別で教育の見返りが得られない地域ほど効果が強く、経済的な文脈が教育と政治参加を媒介すると論じる。", "explain": {"basis": "本文", "basis_note": "シカゴ連銀のワーキングペーパー版（2024年）のPDF本文（序論、主な推定結果の要約、考察）を読んだ。NBER版と細部が異なる可能性がある", "preprint": true, "p1": "20世紀初頭の米国南部で黒人の子どものための学校（ローゼンワルド学校）が建てられた郡では、公民権運動の前の1940〜50年代にNAACP（全米黒人地位向上協会）の支部が増えた。職業差別で教育の見返りが得られない郡ほど、支部の増加が強かった（未査読のワーキングペーパー）。", "p2": "教育が政治参加を促すかについて、因果の実証は意外にも結果が分かれている。理論は、教育を労働市場で生かせない人ほど政治活動の機会費用が低く、活動に向かうと予測するが、それを確かめた研究は少ない（§Introduction）。", "p3": "第1に、1940年の南部の黒人男性の実際の職業所得と、南部の外の職業配分に基づく反実仮想の所得の差を「所得格差」と定義し、教育の見返りが差別で奪われた度合いの代理とした。第2に、1931年以前のローゼンワルド学校の建設を使い、学校のあった郡となかった郡で、のちの支部の数を比べた。第3に、学校に通えた黒人の若者の割合（カバー率）の違いで用量反応を調べた（§Introduction）。", "p4": "結果は、1938年以降に開設され1946年まで続いた支部のある郡の数、郡ごとの支部の数の推移、カバー率に対する支部の確率である。学校のある郡とない郡が、水準と趨勢の両面で比較可能かも確かめている（§Introduction）。", "p5": "所得格差が1標準偏差（1940年の55ドル）大きいと、1938年以降に支部ができた南部の農村の郡の数は32%多かった。1950年までに、学校のある農村の郡は支部が約0.23多く、1938年の平均0.06に対して約380%に当たる。1938〜1950年の農村部の支部の8倍超の増加の約40%を説明しうる。1956年までに、カバー率が10%高いと支部のある確率が3%高かった（§Introduction）。", "p6": "著者は、教育の中身（職業訓練か幅広い教養か）を扱えていない点を今後の課題に挙げる（§Discussion）。所得格差と支部の関係は因果とは限らないとも断る。解釈：学校の立地が地域の黒人社会の組織力と関わっていれば、学校の効果と元々の組織力を完全には分けられない。", "fun": "学校で学んだ人は政治に関心を持つようになるのでしょうか。この研究は、100年前のアメリカ南部で黒人の子のために建てられた学校に注目しました。学校のある郡では、その子たちが大人になった頃に公民権団体の支部が大きく増えていました。しかも、差別で学歴を仕事に生かせない地域ほど増え方が大きかったのです。学んでも報われない不満が、社会を変える力になったのかもしれません。", "unverified": "NBER版で数値が更新されている可能性があり、本文の値（2024年版）と一致するかは未確認。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "フローマッチングの汎化誤差は内在次元で決まる", "title": "Generalization Properties of Score-matching Diffusion Models for Intrinsically Low-dimensional Data", "url": "https://arxiv.org/abs/2610.02663", "authors": "Saptarshi Chakraborty ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Chakraborty, S., Berthet, Q., & Bartlett, P. L. (2026). Generalization Properties of Score-matching Diffusion Models for Intrinsically Low-dimensional Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02663", "why": "フローマッチングで学習した生成分布の誤差を、有限標本のワッサースタイン距離で上から抑えた。収束の速さがデータの内在的な低次元性を反映する形で示し、理論の空白を埋める。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（抄録、貢献の要約、概念実証の実験、主結果と証明の概略の見出し、結論）を読んだ。証明の細部は読み切れていない", "preprint": true, "p1": "フローマッチングで学習した生成分布の誤差を、有限標本のワッサースタイン距離で上から抑える保証を示した。収束の速さは、データの見かけの次元ではなく内在的な低い次元で決まり、次元の呪いを避けられる（arXivの未査読プレプリント）。", "p2": "フローマッチングは画像や分子の生成で実績を上げているが、統計的な汎化の保証は未発達だった。既存の分析は推定した速度場に一様なリプシッツ性などの強い仮定を置き、収束の速さもデータの内在次元を反映していなかった（§1）。", "p3": "フォッカー・プランク方程式と同値な確率微分方程式を経由して誤差を、離散化・近似・推定の部分に分けて評価した（§4.2）。データの分布にも速度場の関数族にも、密度・滑らかさ・リプシッツ性の仮定を置かない。直観：画像は膨大な画素の空間にあっても、実際には低次元の曲面の近くに集まっているので、学習の難しさはその曲面の次元で決まる。", "p4": "主結果は、n個の独立な標本から学んだ分布について、確率1−ξ以上で、ワッサースタイン-p距離がn^{-1/d}+n^{-1/(2p)}(log(1/ξ))^{1/(2p)}程度で抑えられるという形である（抄録）。概念実証として、BigGANで潜在次元を10と100に固定した画像を生成し、学習データ数を1,000〜10,000で変えてFIDを比べた（§3）。", "p5": "任意のp≥1で、高い確率での非漸近の保証を得た。d̃次元の多様体などに支えられた分布では、1≤p<d̃/2でO(n^{-1/d})となり、分布の推定のミニマックス率にほぼ一致する（§1の貢献）。実験では、内在次元10のデータで学んだモデルの方が、100のデータより一貫して低いFIDを示した（§3、図1）。早期停止の時刻、打ち切りの水準、離散化の刻み幅の選び方も理論から示した（§5）。", "p6": "保証は適切なネットワークの大きさ・早期停止・離散化・打ち切りを選んだ場合のもので、実際の学習の最適化の誤差は扱っていない。解釈：推奨される刻み幅は極めて小さくなりうるため、理論の処方をそのまま実装に使えるかは別に確かめる必要がある。", "fun": "写真は何十万もの画素でできていますが、本物らしい写真の集まりは、実はもっと少ない「つまみ」で表せる狭い範囲に収まっています。この研究は、画像を作るAIの学習の上達の速さが、画素の数ではなく、その隠れたつまみの数で決まることを数学で示しました。AIが巨大なデータでも学べる理由の一端を説明する結果です。", "unverified": "証明の各段階の詳細と、多様体以外の分布での定数の大きさは確認していない。"}}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "SNSの年齢規制は『安全版』の併用で守られる", "title": "Aligning Platform and User Incentives in Social Media Age Restrictions", "url": "https://doi.org/10.3386/w35870", "authors": "Leonardo Bursztyn ほか", "venue": "NBER Working Paper", "apa": "Bursztyn, L., Jiménez-Durán, R., Leonard, A., Milojević, F., & Roth, C. (2026). Aligning Platform and User Incentives in Social Media Age Restrictions (NBER Working Paper No. 35870). National Bureau of Economic Research. https://www.nber.org/papers/w35870", "why": "10代のSNS禁止は守られにくい。推薦アルゴリズムなどを除いた安全版をプラットフォームが提供し、成人版の10代に責任を負う制度なら、10代が友人関係を失わずに規制を守れることを理論で示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "p1": "10代のSNS利用の年齢規制について、推薦アルゴリズムなどを除いた「安全版」をプラットフォームが提供でき、成人版に10代がいれば責任を負う制度を理論で分析した。この設計なら10代が友人関係を保ったまま規制を守れる（未査読のワーキングペーパー）。", "p2": "いくつかの国が10代のSNS禁止を導入しているが、初期の証拠では守られていない。禁止は、プラットフォームに稼げる客を手放させ、10代に友人とのつながりを諦めさせるからである（抄録）。", "p3": "成人版の10代についてプラットフォームに責任を残しつつ、規制対象の機能を除いて友人とのやり取りは残す安全版を提供できる規制の仕組みを、理論モデルで分析した（抄録）。直観：友だちもみんな安全版にいるなら、成人版にこだわる理由が弱まる。", "p4": "評価の軸は、10代が規制を守るか、その判断が仲間の動きにどれだけ左右されるか、プラットフォームの利得、そして規制の罰則の水準ごとの10代の厚生である（抄録）。", "p5": "安全版の提供と取り締まりは補い合う。10代は友人関係を失わずに規制を守れ、プラットフォームは成人版から移った利用者を利幅の小さい客として保てる。この設計は、10代が成人版を避ける判断を仲間の動きに依存しにくくし、一定の範囲の罰則で10代の厚生を高める（抄録）。", "p6": "抄録からは、モデルの前提と、実際の利用データによる検証の有無は分からない。解釈：安全版の中身（何を除くか）の決め方や、年齢確認の方法の実効性は、制度設計の別の論点として残る。", "fun": "「子どもはSNS禁止」という法律を作っても、友だちがみんな使っていれば、子どもはこっそり使い続けます。この論文は、禁止ではなく、危ない機能だけを外した「子ども版」を用意させる制度を考えました。友だちとのつながりを保てるなら、子どもは自分から子ども版に移る。禁止より、守りたくなる仕組みを作る発想です。", "unverified": "モデルの前提と、実データによる検証の有無は未確認（本文を入手できず）。"}}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "因果グラフの変数をまとめても識別は保てるか", "title": "Invariance of Clustering Operations in Causal Effect Identification", "url": "https://arxiv.org/abs/2610.03101", "authors": "Jani Nyk\\\"anen ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Nykänen, J., Tabell, O., Tikka, S., & Karvanen, J. (2026). Invariance of Clustering Operations in Causal Effect Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03101", "why": "因果グラフの変数をまとめると推論は簡単になるが、誤った結論を招くこともある。識別可能性と識別不能性の両方を保つまとめ方を、元のグラフのc成分の条件で幅広く特定した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（序論、クラスタリングの定義、識別不変性の結果の要点、実例、考察）を読んだ。定理の証明は読み切れていない", "preprint": true, "p1": "因果グラフの変数をまとめて1つの頂点にしても、因果効果が識別できるかどうかの判定が変わらない「識別不変」なまとめ方を、従来より広い種類の集まり（整合的なクラスタ）について特定した（arXivの未査読プレプリント）。", "p2": "遺伝的要因や職歴のような変数の集まりを1つの頂点にまとめると、グラフが小さくなり推論も簡単になる。だが勝手にまとめると、元のグラフでは識別できる効果が識別できなくなるなど、誤った結論を招く。従来の条件（推移クラスタ）は、集まりと外の変数のつながり方に厳しい制約を課していた（§1）。", "p3": "まとめ方が有向閉路を作らなければ、まとめたグラフで識別できる効果は元のグラフでも識別でき、識別の式も単純な置き換えで得られる（§6）。そこで問題を、まとめたグラフでの識別不能が元のグラフでも成り立つか、つまり、まとめることで元にない「ヘッジ」（識別不能を表すグラフ構造）が生まれないかに絞った。整合的なクラスタについて、c成分に関する3つの十分条件（平明性、c整合性、c孤立性）を示した（§4・6）。直観：まとめても、隠れた交絡でつながる経路の形が変わらなければ、判定も変わらない。", "p4": "結果は定理として証明し、睡眠薬の使用に影響する要因のグラフ（騒音研究から作成し、説明のため交絡を加えたもの）で、3段階のまとめ方を順に適用して、関心のある因果効果の識別を判定する実例を示した（§5、図5）。", "p5": "3つの条件のいずれかを満たせば、集めた変数を含まないすべての因果効果について、整合的なクラスタのまとめ方は識別不変になる（§6）。実例では、人口密度が睡眠薬の使用に与える効果がまとめたグラフで識別でき、その式を置き換えるだけで元のグラフの識別式が得られた（式5.1）。整合的なクラスタは推移クラスタを一般化し、外の親や子のつながり方の制約を緩める（§6）。", "p6": "3つの条件は十分条件で必要条件ではなく、どれも満たさないのに識別不変なまとめ方も存在すると著者は述べる（§6、図4）。解釈：実務では、どの変数をまとめるかの候補を自動で探す手順がまだなく、条件の確認は分析者に委ねられる。", "fun": "原因と結果のつながりを矢印の図で表すとき、「健康状態」のような細かい要素の集まりを一つの箱にまとめると、図はすっきりします。でも、まとめ方を間違えると「この効果はデータから計算できない」と誤って判断してしまいます。この研究は、どうまとめれば判断が変わらないかの条件を広げました。図を簡単にしても、答えは変わらない保証です。", "unverified": "各条件の厳密な定義と証明の細部は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "ループ型Transformerはメモリ共有で改善する", "title": "The Surprising Effectiveness of Shared Memory in Looped Transformers", "url": "https://arxiv.org/abs/2610.02383", "authors": "Giovanni Monea ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Monea, G., Ramji, K., El-Kurdi, Y., Lastras, L. A., Artzi, Y., Godey, N., & Astudillo, R. F. (2026). The Surprising Effectiveness of Shared Memory in Looped Transformers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02383", "why": "同じ層を繰り返し使うループ型Transformerで、最初の反復だけがKVキャッシュを書き、後の反復はそれを読む設計を事前学習した。メモリを共有しても品質は落ちず、むしろ改善した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（方法、実験設定、結果、効く理由の分析、限界）と表1・図2〜4の説明を読んだ", "preprint": true, "p1": "同じ層を何度も繰り返し使うループ型Transformerで、最初の反復だけが文脈の記憶（KVキャッシュ）を書き、後の反復はそれを読む「記憶の共有」を事前学習した。記憶を節約しても品質は落ちず、むしろ改善した（arXivの未査読プレプリント）。", "p2": "ループ型Transformerは、パラメータを増やさずに計算を足して品質を上げられる。だが反復ごとに自分のKVキャッシュを書くので、計算と一緒に記憶も増える。推論時にキャッシュを削る技術は品質を損なう（§1）。", "p3": "最初の反復（状態の反復）が全文脈のキャッシュを作り、後の反復（予測の反復）はそれと自分の短い窓（直前64位置）だけを1つのソフトマックスで参照する（§3、式3）。これをLPTと呼び、線形注意を混ぜた型（h-LPT）にも適用した。直観：最初に1回だけ文脈を丁寧に読み込み、あとはその読書メモを見ながら答えを練り直す。", "p4": "約150M・450M・1Bの3つの大きさで、FineWeb-Eduの20B（Lは50B）トークンで事前学習し、従来のループ型（LT、LT2）、並列ループ型、標準のTransformerなどと比べた（§4）。評価は検証パープレキシティ、5つの課題のゼロショット正答率、文脈の記憶量と生成1トークンあたりの計算量である。", "p5": "同じ大きさと反復数で、LPTはLTよりパープレキシティを0.38〜1.09下げ、正答率を0.4〜4.8ポイント上げた。KVの記憶は2.0〜4.7倍少なく、計算量の増加は1%未満だった（表1）。LTは3回を超えると改善が止まったが、LPTは5回まで改善を続けた。中間の監督なしではLTは5回で崩壊したが、LPTは安定していた（§6、図3）。予測の窓を0にしても、LPTはLTを上回った（図4）。", "p6": "著者は、ループ型は計算の最適ではなく、5回の反復で標準のTransformerの4.3〜4.8倍の生成計算がかかる点を挙げる。比較はパラメータをそろえたもので、計算量をそろえた比較はしていない。1Bまで・1つのコーパス・4,096トークンの文脈に限られ、長文脈の課題は試していない（§8）。", "fun": "同じ問題を何度も考え直すと、答えは良くなりがちです。AIでも同じ層を繰り返し使うと賢くなりますが、考え直すたびにメモ帳を新しく作るので、記憶の量が膨らみます。この研究は、最初に作ったメモ帳を後の考え直しでも使い回させました。節約したのに、かえって成績が上がったのが意外なところです。", "unverified": "表1の各設定の細かな数値と、学習の不安定さの原因の分析（付録C）は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "空間相関のある回帰の推論を体系化", "title": "Inference for Regression with Clustered or Spatially Correlated Data II: Spatial Correlation", "url": "https://doi.org/10.3386/w35801", "authors": "A. Colin Cameron ほか", "venue": "NBER Working Paper", "apa": "Cameron, A. C., & Miller, D. L. (2026). Inference for Regression with Clustered or Spatially Correlated Data II: Spatial Correlation (NBER Working Paper No. 35801). National Bureau of Economic Research. https://www.nber.org/papers/w35801", "why": "地理的な距離で相関するデータの回帰で、標準誤差を正しく補正する方法を整理した。前編のクラスタ相関に続き、空間相関のもとでの推論の手引きとなる。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "地理的な距離などで相関するデータの回帰で、標準誤差を正しく補正する推論の方法を整理した。前編のクラスタ相関に続く後編である（未査読のワーキングペーパー）。", "p3": "空間相関が地域内だけにあり地域間にないなら、前編のクラスタ頑健な推論が使える。本稿は距離とともに相関が弱まる場合を扱い、標準的なConley (1999) の空間HACを出発点とする（抄録）。", "p5": "空間的な持続性が高いと空間HACはうまく働かず、別の推論法が必要になる。また、見せかけの相関を避けるため、回帰モデルで空間的な趨勢を統制することが重要だと述べる（抄録）。", "fun": "隣り合う町のデータは似がちです。それを互いに無関係な別々の観測と数えると、データの量を水増しして「確かだ」と思い込んでしまいます。この論文は、地図の上で近いものほど似るデータを正しく扱う方法を整理しました。近所の数字は半分くらい同じ情報だと思え、という注意書きです。", "unverified": "推奨される代替の推論法の具体的な中身は未確認（本文を入手できず）。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "段階的導入の実験で時点ごとの効果を検定", "title": "Randomization inference on cell effects under absorbing treatment onset", "url": "https://arxiv.org/abs/2610.02556", "authors": "Xinyuan Chen", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Chen, X. (2026). Randomization inference on cell effects under absorbing treatment onset (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02556", "why": "各単位が無作為な時点で一度だけ処置に入る段階的導入の実験を扱う。少数の異質な単位でも使える、時点別の効果の無作為化推論を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "各単位が無作為な時点で一度だけ処置に入り、その後も処置が続く実験で、単位×時点ごとの効果について、無作為化検定で何が言えるかを示した（未査読）。", "p3": "「どこにも効果がない」という鋭い帰無仮説ではなく、効果の大きさの上下限や分位点についての帰無仮説を検定する。セルの潜在的な結果が処置の開始時点によらないという仮定のもとで、有限標本での妥当性と検出力の理論を示した（抄録）。", "p5": "固定した対立仮説に対するp値は、系列の長さTではなく開始時点の候補の数K_Tに対してK_T^{-N}の速さで小さくなる。検出力を決めるのは観測の長さではなく、処置を始められる期間の幅だった。仮定が崩れる場合の感度分析も示した（抄録）。", "fun": "新しい施策を、いくつかの店に時期をずらして順番に導入する実験があります。この論文は、その結果をどこまで確かに言えるかは、観察する期間の長さではなく、導入の時期をどれだけ幅広く選べたかで決まることを示しました。長く見るより、始める時期の選択肢を増やせという、意外な設計の教訓です。", "unverified": "数値例と感度分析の具体的な結果は未確認（本文を入手できず）。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "観測できない異質性のある実験で効果を推定", "title": "Estimating Heterogeneous Impacts with Endogenous Participation and Non-Compliance", "url": "https://doi.org/10.3386/w35872", "authors": "Orazio Attanasio ほか", "venue": "NBER Working Paper", "apa": "Attanasio, O., Cardona-Sosa, L., & Liu, Z. (2026). Estimating Heterogeneous Impacts with Endogenous Participation and Non-Compliance (NBER Working Paper No. 35872). National Bureau of Economic Research. https://www.nber.org/papers/w35872", "why": "RCTで、効果を左右する属性が内生的で、対照群では観測できない場合の推定を扱う。処置群の情報と属性のノイズ付きの信号を組み合わせ、異質な効果を推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "RCTで、効果を左右する属性が本人の選択で決まり、しかも対照群では観測できない場合に、異質な効果を推定する方法を示した（未査読のワーキングペーパー）。", "p3": "処置群の情報と、属性についてのノイズ付きの信号を組み合わせ、最小限の仮定で意味のある効果を推定する。ガーナの幼児期介入のクラスターRCTのデータで、積極的に参加した世帯と受け身の受け手だった世帯の効果を分けた（抄録）。", "p5": "いくつかの結果指標では、正しく推定した異質な効果が、素朴な推定量で求めた値と大きく異なった（抄録）。", "fun": "支援の効果を「熱心に参加した家庭」と「名前だけの家庭」に分けて知りたいとします。ところが比べる相手の対照群には、そもそも参加の機会がないので、誰が熱心な家庭になったはずかが分かりません。この論文は、見えない区分を手がかりの情報から推し量り、正しく効果を分ける方法を示しました。", "unverified": "推定の仮定の具体的な形と、素朴な推定との差の大きさは未確認（本文を入手できず）。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "フローマッチングでベイズ逆問題を高速に解く", "title": "Flow Matching for Fast Posterior Sampling in Bayesian Inverse Problems", "url": "https://arxiv.org/abs/2610.02377", "authors": "Jan Blechschmidt ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Blechschmidt, J., Ernst, O. G., Poguntke, M., & Sprungk, B. (2026). Flow Matching for Fast Posterior Sampling in Bayesian Inverse Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02377", "why": "MCMCは逐次的で、観測ごとにやり直しが要る。条件付きフローマッチングで観測から事後分布への輸送写像を一度学習し、ベイズ逆問題の事後標本を高速に得る。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "関数を未知数とするPDEのベイズ逆問題で、条件付きフローマッチングで事後分布の標本を高速に得る方法を、MCMCの観点から丁寧に評価した（未査読）。", "p3": "パラメータとデータの組で輸送写像を一度学習すれば、どの観測にも新しい尤度の評価なしに独立な近似標本が得られる。流れの密度が計算できることを使い、近似事後分布の精度を全変動距離とKLダイバージェンスで見積もり、メトロポリス法で漸近的に厳密にする混成のサンプラーも提案した（抄録）。", "p5": "電気インピーダンス断層撮影や、尤度を使わないロトカ・ボルテラ模型などの数値例で、精度の見積もりの妥当性と、学習を使い回す効果を示した（抄録）。", "fun": "観測から原因を逆算するベイズ推定は、観測が変わるたびに長い計算をやり直すのが普通です。この論文は、あらかじめ「観測から答えへの近道」を学習しておき、新しい観測には一瞬で答える方法を、その精度を自分で見積もれる形で示しました。速さと確かさを両立させる工夫です。", "unverified": "MCMCとの計算時間の比較の数値は未確認（本文を入手できず）。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "学習済み生成モデルを再学習なしでデータ同化に", "title": "A Unified Framework for Bayesian Data Assimilation with Generative Models and Observation Interpolants", "url": "https://arxiv.org/abs/2610.03396", "authors": "Nikolaj T. M\\\"ucke ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Mücke, N. T., & Sanderse, B. (2026). A Unified Framework for Bayesian Data Assimilation with Generative Models and Observation Interpolants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03396", "why": "高次元・非ガウスのデータ同化で、学習済みの拡散モデルやフローマッチングを再学習せずに事後分布のサンプラーへ変える、観測補間の枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "学習済みの拡散モデルやフローマッチングのモデルを、再学習せずにデータ同化の事後サンプラーに変える「観測補間」の枠組みを提案した（未査読）。", "p3": "補間の経路を観測で条件づけると、ドリフトや速度に共通の尤度スコアの補正が加わり、確率的・決定論的な事後標本を統一的に扱える。実用上は、そのスコアを平均と共分散を補正したガウスの代理で近似し、ヤコビアンを使わない近似で高次元に対応した（抄録）。", "p5": "線形ガウスの動態、確率的な2次元ナビエ・ストークス、最大でO(10^4)自由度の都市の気流で評価した（抄録）。", "fun": "天気予報では、計算した予報と実際の観測をすり合わせる「データ同化」が欠かせません。この研究は、画像生成で使われるAIの仕組みを、作り直さずにそのすり合わせ役に転用する方法を示しました。絵を描くAIと天気を読むAIが、同じ数学でつながっているのが面白いところです。", "unverified": "他の同化手法との精度の比較の数値は未確認（本文を入手できず）。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "ブール因子モデルのグラフ構造の識別条件", "title": "Characterizing Identifiability in Boolean Factor Models", "url": "https://arxiv.org/abs/2610.02682", "authors": "Mengqi Lin ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Lin, M., & Xu, G. (2026). Characterizing Identifiability in Boolean Factor Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02682", "why": "ブール行列分解や認知診断モデルを含むブール因子モデルで、潜在因子と観測の結びつきを表すグラフ構造が識別できる条件を明らかにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "ブール行列分解や認知診断モデルを含むブール因子モデルで、潜在因子と観測の結びつきのグラフ構造が識別できる必要十分条件を、「純粋なノード」の仮定なしに示した（未査読）。", "p3": "観測変数の分布をハッセ図で表し、識別の問題をグラフの同型の問題に変えた。同値な代数的条件と、充足可能性（SAT）に基づく効率的な検証の算法も作り、確率的なブール因子モデルにも広げた（抄録）。", "p5": "純粋なノードを要求しない条件により、識別可能で解釈しやすいブール因子モデルの範囲が大きく広がったとする（抄録）。", "fun": "テストの正誤から、受験者がどの能力を持っているかを推し量るモデルがあります。そこでは「この問題はこの能力だけで解ける」という純粋な問題が必要だと考えられてきました。この論文は、そうした問題がなくても能力と問題の対応を突き止められる条件を示しました。現実のテストに近い前提で使えるようになります。", "unverified": "SAT検証の算法の計算時間と、実データへの適用例は未確認（本文を入手できず）。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "識別できない方向に沿って動くMCMCでODEを推定", "title": "A Geometric Bayesian Parameter Inference Method for Structurally Non-identifiable Models", "url": "https://doi.org/10.2139/ssrn.7560823", "authors": "Xuyuan Wang ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Wang, X., Han, D., & Li, M. (2026). A Geometric Bayesian Parameter Inference Method for Structurally Non-identifiable Models. https://doi.org/10.2139/ssrn.7560823", "why": "構造的に識別できないODEモデルで、識別性解析の情報を使い、識別できない方向に沿う提案と横切る提案を組み合わせる幾何的なMCMCを提案した。正しい事後分布を目標とし、エルゴード性を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "構造的に識別できない常微分方程式モデルで、識別できない方向を意識して動く幾何的なMCMCを作り、標本抽出の効率と収束を改善した（未査読）。", "p3": "異なるパラメータ値が同じ出力を生むと、観測上区別できない値が低次元の多様体を作り、通常のMCMCは混ざりが悪くなる。構造的な識別性解析の情報を使い、その多様体に沿う提案と横切る提案を作った（抄録）。", "p5": "提案法が正しい事後分布を目標とし、標準的な正則条件のもとでエルゴード性を持つことを示した。数値実験では、従来のMCMCより標本抽出の効率と収束が改善した（抄録）。", "fun": "二つのつまみを同時に回すと同じ音が出るラジオがあったとします。音を聞くだけでは、つまみの位置を一つに決められません。この論文は、そうした「区別できない方向」を先に調べ、その方向に沿って賢く探す推定法を作りました。決められないことを認めたうえで、効率よく探るという発想です。", "unverified": "数値実験の具体的なモデルと、効率の改善の倍率は未確認（本文を入手できず）。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "悪いニュースが尾を引くかは話題で決まる", "title": "When Does Bad News Stick? Topic-Level Asymmetry in Narrative Dynamics", "url": "https://doi.org/10.3386/w35838", "authors": "Isha Agarwal ほか", "venue": "NBER Working Paper", "apa": "Agarwal, I., Chen, W., & Prasad, E. S. (2026). When Does Bad News Stick? Topic-Level Asymmetry in Narrative Dynamics (NBER Working Paper No. 35838). National Bureau of Economic Research. https://www.nber.org/papers/w35838", "why": "ウォール・ストリート・ジャーナルの1990〜2025年の全記事で、話題ごとの論調の指数を作った。悪いニュースの持続性は、良し悪しだけでなく何の話題かで変わることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "悪いニュースが良いニュースより長く尾を引く度合いは、何についてのニュースかで大きく違う。ウォール・ストリート・ジャーナルの1990〜2025年の記事で示した（未査読のワーキングペーパー）。", "p3": "1990〜2025年の全記事から、12の経済の話題ごとに月次の肯定・否定の論調指数を作り、話題別に論調の動態を推定した（抄録）。", "p5": "どの話題でも、悪いニュースの衝撃は良いニュースより大きな累積の反応を生んだ。その差は、安全保障と人権、企業と経営戦略、健康と公共の安全、不動産と金融の安定で最も大きかった。情報の多い金融市場などでも悪いニュースの持続は大きかった（抄録）。", "fun": "悪いうわさは良いうわさより長く残る、とよく言われます。この研究は、1990年から2025年までの新聞記事でそれを確かめたうえで、残り方が話題によって大きく違うことを示しました。情報がひっきりなしに入る金融の話題でも、悪い空気はすぐには消えません。情報が多ければ早く正常に戻る、とは限らないのです。", "unverified": "話題ごとの持続の差の数値と、論調の測り方の詳細は未確認（本文を入手できず）。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "難民の子の長期の成果を地域の機会指標は予測するか", "title": "Randomized to Opportunity: Measuring Place Effects for Refugee Children", "url": "https://doi.org/10.3386/w35853", "authors": "N. Meltem Daysal ほか", "venue": "NBER Working Paper", "apa": "Daysal, N. M., Doyle, J. J., Jr., Samandari, N. S., Simonsen, E. A. L., & Trandafir, M. (2026). Randomized to Opportunity: Measuring Place Effects for Refugee Children (NBER Working Paper No. 35853). National Bureau of Economic Research. https://www.nber.org/papers/w35853", "why": "デンマークの1986〜1998年の分散配置政策で、ほぼ無作為に自治体へ割り当てられた難民の子ども1万2千人超を追跡した。地域の経済的機会の指標が、この集団の長期の成果を予測するかを検証した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "デンマークの分散配置政策でほぼ無作為に自治体へ割り当てられた難民の子ども12,000人超で、機会の多い地域で育つほど大人になってからの所得が高く、犯罪が少ないことを示した（未査読のワーキングペーパー）。", "p3": "1986〜1998年の政策で、到着時に分かっていた地域の機会の指標が長期の成果を予測するかを調べた。指標は、定住者の転居の時期の違いを使う設計で妥当性を確かめている（抄録）。", "p5": "機会の低い地域から高い地域へ（2標準偏差）移ると、大人の所得の順位が3パーセンタイル（7.5%）、就業が4ポイント上がった。有罪判決は14%、10代での親になることは19%減った。所得には地域の不平等が特に強い予測因子だった（抄録）。", "fun": "子どもがどの町で育つかは、その子の将来をどれだけ左右するのでしょうか。ふつうは、豊かな家ほど良い町を選ぶので、町の効果と家の効果を分けられません。この研究は、難民の子が住む町を行政がほぼくじ引きで決めた事実を使い、育つ町そのものの力を取り出しました。", "unverified": "教育への効果の大きさの数値は未確認（本文を入手できず）。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "AIデータセンター整備に9兆ドル近い投資", "title": "Financing the AI Buildout", "url": "https://doi.org/10.3386/w35865", "authors": "Stijn Van Nieuwerburgh", "venue": "NBER Working Paper", "apa": "Van Nieuwerburgh, S. (2026). Financing the AI Buildout (NBER Working Paper No. 35865). National Bureau of Economic Research. https://www.nber.org/papers/w35865", "why": "1GWのAIキャンパスの費用を約410億ドルと見積もった。2032年までに188GWを整備すると総投資は9兆ドル近くに達し、その資金をどう調達するかを分析した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国のAIデータセンターの整備には、2032年までに9兆ドル近い投資が要ると見積もり、その資金調達が企業の内部資金から複雑な外部の仕組みへ移っていることを示した（未査読のワーキングペーパー）。", "p3": "1GWのAIキャンパスの費用を積み上げ、188GWの整備に必要な総投資と年間の投資額を推計した。資金の出し手と調達の構造を整理している（抄録）。", "p5": "1GWで約410億ドル、188GWで9兆ドル近く、2025〜2032年の年間投資はGDPの3.2%に当たる。資金はリース、合弁、プロジェクト債務、私募の融資、証券化、特別目的会社へ移り、資産の借入比率の上昇や偶発債務の見えにくさなどのリスクを生む（抄録）。", "fun": "AIを動かす巨大な計算センターの建設費は、国の経済規模に比べてどれほどでしょうか。この研究の試算では、米国で年にGDPの3%を超えます。大企業の手元資金では足りず、借金を見えにくくする仕組みが増えていることも示しました。技術ブームの裏で、お金の流れが複雑になっているのです。", "unverified": "費用の積み上げの内訳と前提の詳細は未確認（本文を入手できず）。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "宇宙開発の公的研究開発が製造業の自動化を進めた", "title": "Public R&D and the Automation of Manufacturing: Evidence from the Space Race", "url": "https://doi.org/10.2139/ssrn.7560837", "authors": "Apoorva Babbar ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Babbar, A., Kantor, S., W, A., & Zeng, J. (2026). Public R&D and the Automation of Manufacturing: Evidence from the Space Race. https://doi.org/10.2139/ssrn.7560837", "why": "NASA関連の特許が、同じ技術分類の中でも自動化寄りであることを全文特許から示した。宇宙開発への曝露が大きい産業・地域ほど、労働分配率が持続的に下がったことを1947〜1992年のデータで示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "冷戦期の宇宙開発への公的研究開発が、米国製造業の技術変化を自動化へ向かわせ、労働分配率を持続的に下げたことを示した（未査読）。", "p3": "1947〜1992年について、NASAの投資への曝露の産業・地域による違いを使った。全文の特許データで作った自動化の指標と、政府の関与の記録を組み合わせている（抄録）。", "p5": "NASAが支援した特許は、同じ技術分類の中でも自動化の度合いが高かった。宇宙開発への曝露が大きい産業・地域では労働分配率が持続的に下がった。技能の構成には系統的な変化はほとんど見られなかった（抄録）。", "fun": "月を目指した宇宙開発の技術が、地上の工場の働き方まで変えたのかを調べた研究です。NASAの特許は人手を省く自動化の色が濃く、それにさらされた産業ほど、売上のうち働き手に回る分が減りました。国の大型プロジェクトは、技術がどちらの方向へ進むかまで変えてしまうのです。", "unverified": "労働分配率の低下の大きさの数値は未確認（本文を入手できず）。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "気候情報の助言で牧畜民の生乳収入が増えた", "title": "Impact of climate-informed advisories on knowledge, adoption of climate-smart livestock practices and household welfare among pastoralists: Experimental evidence from Senegal", "url": "https://doi.org/10.2139/ssrn.7560439", "authors": "Prosper Houessionon ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Houessionon, P., Abdulai, A., Wane, A., & Whitbread, A. (2026). Impact of climate-informed advisories on knowledge, adoption of climate-smart livestock practices and household welfare among pastoralists: Experimental evidence from Senegal. https://doi.org/10.2139/ssrn.7560439", "why": "セネガルの牧畜民でクラスター無作為化試験を行った。気候情報に基づく助言が知識と適応策の採用を高め、生乳の生産と収入を増やすことを、因果の連鎖に沿って示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "セネガルの牧畜民でクラスター無作為化試験を行い、気候情報に基づく助言が知識・適応策の採用・生乳の生産と収入を高めることを、因果の連鎖に沿って示した（未査読）。", "p3": "助言だけを届ける群と、飼料の種と実地訓練を組み合わせる群を比べた。調査と生産性のデータで、知識の獲得、気候対応の飼養の採用、生乳の生産と販売・年収という連鎖を順に検証した（抄録）。", "p5": "どちらの群でも知識が大きく増え、給餌・飼料の保存と生産・家畜の健康管理の採用が大幅に増えた。助言は生乳の生産と、販売量や年間の生乳収入などの世帯の厚生も高めた（抄録）。", "fun": "天気の見通しを家畜の世話の助言に変えて届けると、暮らしは良くなるのでしょうか。この実験では、知識が増え、飼い方が変わり、乳の量と収入が増えるという順番がそろって確認されました。情報が行動に変わり、行動が収入に変わる鎖を一つずつ確かめた点が丁寧です。", "unverified": "効果の大きさの数値と、2つの群の差は未確認（本文を入手できず）。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "中小企業減税の穴を地方政府は手数料で埋めた", "title": "The Redistribution of Targeted Tax Cuts: Fiscal Rebalancing and Non-Tax Burden in China", "url": "https://doi.org/10.2139/ssrn.7560440", "authors": "Binzhen Wu ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Wu, B., & Zou, J. (2026). The Redistribution of Targeted Tax Cuts: Fiscal Rebalancing and Non-Tax Burden in China. https://doi.org/10.2139/ssrn.7560440", "why": "中国の法人税減税による地方の税収減を、都市間の差で分析した。非税収入の増加が税収減をほぼ相殺し、恩恵を受けるはずの企業でも、減税分の大半が手数料の増加で打ち消されていた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国で中小企業の法人税を減らすと、地方政府は手数料などの非税収入を増やして穴を埋めた。恩恵を受けるはずの企業でも、減税分の大半が手数料の増加で打ち消された（未査読）。", "p3": "小企業への法人税の減税の拡大について、都市ごとの税収の減り方の違いを使い、地方の予算の組み替えと企業ごとの負担の変化を推定した（抄録）。", "p5": "非税収入の増加が法人税の減収をほぼ相殺し、財政収入の総額は変わらなかった。恩恵を受ける企業では、手数料の増加が減税分の91.6%を打ち消した。恩恵のない大企業は手数料だけが増え、減税の強い都市ほど収益性が下がった（抄録）。", "fun": "国が「中小企業の税金を下げる」と決めても、その穴埋めを地方に任せると何が起きるでしょうか。この研究では、地方は別の名目の手数料を上げて帳尻を合わせ、減税の9割以上が消えていました。片方の財布を軽くしても、もう片方から取られれば意味がない、という分かりやすい例です。", "unverified": "手数料の種類の内訳と、推定の識別の詳細は未確認（本文を入手できず）。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "ノルウェーの富裕層課税、流出は最大100人", "title": "Taxing Entrepreneurial Wealth: Evidence from Norway, 2021–2025", "url": "https://doi.org/10.3386/w35854", "authors": "Marius A. K. Ring", "venue": "NBER Working Paper", "apa": "Ring, M. A. K. (2026). Taxing Entrepreneurial Wealth: Evidence from Norway, 2021–2025 (NBER Working Paper No. 35854). National Bureau of Economic Research. https://www.nber.org/papers/w35854", "why": "ノルウェーの2021〜2024年の配当課税などの一連の改革を使い、事業主への課税強化が投資の制約や資本の国外流出を招くかを検証した。超富裕層への課税の議論に新しい証拠を与える。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ノルウェーの2021〜2024年の事業主への課税強化で、富裕層の「大脱出」が報じられたが、改革による国外流出は最大100人程度にとどまり、起業家や発明家の流出は見られなかった（未査読のワーキングペーパー）。", "p3": "配当税率の引き上げ、移住に関わる譲渡益課税の抜け穴の解消、事業資産への実効限界税率のほぼ倍増という一連の改革を使い、移住と税収、企業活動への影響を推定した（抄録）。", "p5": "移住への効果は資産上位0.1%に集中し、主に2022〜2023年に限られた。流出がなければ富裕税の税収は2021〜2024年に75%増えたはずで、流出によって増加は71.5%に縮んだ。流出した所有者の企業は活動を続け、投資も減らしていなかった（抄録）。", "fun": "お金持ちに重い税をかけると、みんな国外へ逃げ出すと言われます。ノルウェーでは実際に「大脱出」が新聞で報じられました。ところが行政のデータで数えると、改革で国を出たのは多くても100人ほどで、税収は7割以上増えていました。印象的な報道と、数えた事実の違いがよく分かる研究です。", "unverified": "流出の推定の識別の方法の詳細は未確認（本文を入手できず）。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "エルサルバドルのギャング掃討がもたらしたもの", "title": "Gang Crackdowns", "url": "https://doi.org/10.3386/w35866", "authors": "Carlos Schmidt-Padilla ほか", "venue": "NBER Working Paper", "apa": "Schmidt-Padilla, C., Melnikov, N., & Sviatschi, M. M. (2026). Gang Crackdowns (NBER Working Paper No. 35866). National Bureau of Economic Research. https://www.nber.org/papers/w35866", "why": "2022年の非常事態宣言で20年続いたギャングの支配が終わった地域を、地図と世帯調査・行政記録で特定した。国家の統治の回復が住民の暮らしをどう変えたかを分析した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "エルサルバドルの2022年の非常事態宣言で20年続いたギャングの支配が終わると、分断されていた労働市場がつながり、所得や起業が増えた。一方で、旧支配地域の住民への雇用の差別は残った（未査読のワーキングペーパー）。", "p3": "世帯調査と行政記録を、旧ギャング支配地域の詳細な地図と組み合わせ、2022年以前の支配への曝露の違いで変化を比べた（抄録）。", "p5": "支配の解消で移動・雇用・世帯所得・金融包摂が改善し、曝露の大きかった地域ほど起業と不動産投資が増えた。ただ、雇用主は旧支配地域出身の応募者を採用しにくいままだった。取り締まりへの支持は高いが、警察の暴力を目撃した人は警察と政府への不信が大きかった（抄録）。", "fun": "ギャングに支配された町が解放されると、人々の暮らしはどう変わるのでしょうか。この研究では、行き来や仕事、収入は良くなりました。それでも「あの地区の出身」というだけで採用を避けられる差別は残りました。治安が戻っても、町に貼られたレッテルはすぐにははがれないのです。", "unverified": "効果の大きさの数値と、差別を測った方法の詳細は未確認（本文を入手できず）。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "拡散モデルの訓練例の複写を最適化で遅らせる", "title": "Controlling Polar Exposure to Delay Memorization in Diffusion Models", "url": "https://arxiv.org/abs/2610.02780", "authors": "Xuanchen Wang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Wang, X., Wang, H., & Cai, W. (2026). Controlling Polar Exposure to Delay Memorization in Diffusion Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02780", "why": "拡散モデルは訓練例を複写し始める前に良い品質に達するが、速い最適化はその期間を縮めてしまう。更新の幾何から原因を調べ、その期間を保つ制御法QGDを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "拡散モデルが訓練画像を丸写しし始める前の「汎化の期間」を、速い最適化が縮めてしまう問題に対し、その期間を保つ制御法（QGD）を提案した（未査読）。", "p3": "更新の幾何から、記憶が始まるまでの時計を3種類に分けて分析した。速い極分解型の更新を最初だけ使い、品質の基準を満たしたら一定の利得のモーメンタムへ徐々に戻す。複写の量を制限して検査点を選ぶ方法（CBS）と組み合わせた（抄録）。", "p5": "条件のもとで、一定の利得の後段がデータの大きさに比例した遅れを取り戻すことを理論で示した。CIFAR-10の2,000枚の部分集合で、QGDは品質に達する速さを保ったまま汎化の期間を広げたとする（抄録）。", "fun": "画像を作るAIは、学習を続けると、ある時点から練習用の絵をそのまま写し始めます。その手前の「自分で描ける時期」が長いほど都合がよいのです。この研究は、学習を速く進めつつ、丸写しが始まるのを遅らせる調整法を作りました。速く覚えることと、覚えすぎないことの両立です。", "unverified": "汎化の期間の延びの数値は未確認（本文を入手できず）。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "連続空間の大規模拡散言語モデルSigma", "title": "Large Language Continuous Diffusion Models", "url": "https://arxiv.org/abs/2610.02665", "authors": "Zhihan Yang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Yang, Z., Guo, W., Lemercier, J.-M., Welker, S., Fu, Y., Kamani, M. M., Norouzi, S., Berner, J., Geffner, T., Kreis, K., Chen, Y., Tao, M., Thickstun, J., Molchanov, P., Jukić, A., Vahdat, A., & Mardani, M. (2026). Large Language Continuous Diffusion Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02665", "why": "離散拡散言語モデルは空間が滑らかでなく高次元のため、推論の誘導や高速化が難しい。低次元のODE/SDEの潜在空間に基づく、3B・8B規模の初の連続拡散言語モデルを提示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "低次元の連続的な潜在の軌道に基づく、3B・8B規模の初の連続拡散言語モデル（Sigma）を作り、離散の拡散言語モデルや自己回帰モデルと競える性能を示した（未査読）。", "p3": "ブロックごとの尤度最適化で、ガウス雑音を加えたトークン埋め込みの除去と、最適な埋め込みの幾何を同時に学習する。学習の高速化に自己回帰モデルの重みを流用し、推論では分類器なしの誘導とスコアの温度が重要だと特定した（抄録）。", "p5": "事前学習後にGSM8K・Minerva・HumanEval・MBPPなどで離散モデルと競う性能を示し、教師ありの微調整後はMATH-500やAIMEの難しい推論課題でも競った。連続型に固有の構造的な性質も見いだしたとする（抄録）。", "fun": "文章を作るAIの多くは、言葉を1つずつ並べていきます。拡散型は、ぼやけた全体を少しずつはっきりさせて文章を作ります。この研究は、言葉を連続的な空間で扱う拡散型を大規模に作り、従来型と肩を並べる成績を出しました。言葉を「なめらかな量」として扱える点に将来性があります。", "unverified": "各ベンチマークの数値と、推論の速さの比較は未確認（本文を入手できず）。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "動画生成モデルの内部に物理量は表現されているか", "title": "Does Physics Live in the Activations? Localizing Physical Quantities in Video Diffusion Models", "url": "https://arxiv.org/abs/2610.03154", "authors": "Jonas Kneifl ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Kneifl, J., Skalski, J., Twardowski, B., & Deja, K. (2026). Does Physics Live in the Activations? Localizing Physical Quantities in Video Diffusion Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03154", "why": "動画生成モデルは物理推論の弱さが指摘されている。内部の活性に物理量が表現されているかを局在化して調べ、物理原理を内在化しているのか、見慣れた動きを再現しているだけかを問う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "動画生成モデルの内部に、運動や剛体の力学の物理量が表現されているかを調べ、雑音除去の早い段階で線形に高い精度で読み出せることを示した（未査読）。", "p3": "動画の拡散Transformerの内部表現から、シミュレータで求めた正解の物理量（重力や接触のもとでの運動）を線形のプローブで読み出し、モデル自身の雑音つき潜在から読む基準と比べた（抄録）。", "p5": "物理量は基準を大きく上回って読み出せ、情報は入力にあるのではなく雑音除去の過程で作られていた。物体上のトークンの活性に情報が集まり、複数のフレームにまたがる量も1フレームの潜在から読めた。情報は全体で計算され、局所に蓄えられるとする（抄録）。", "fun": "本物そっくりの動画を作るAIは、物理の法則を理解しているのでしょうか。それとも見慣れた動きをまねているだけでしょうか。この研究がAIの頭の中をのぞくと、ボールの速さや落ち方の情報が、絵を作る途中ではっきりと組み立てられていました。少なくとも物理量を内部で計算していることは確かなようです。", "unverified": "プローブの精度の数値と、物理推論の失敗との関係の詳細は未確認（本文を入手できず）。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "グラフォンで複雑ネットワークを解釈可能に生成", "title": "A Generative Model of Complex Networks Using Graphons and Neural Inverse Operators", "url": "https://arxiv.org/abs/2610.02439", "authors": "Wooseong Choi ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Choi, W., Pinto, I. I. L. D., Sun, C., Gupta, G., Song, D., & Bogdan, P. (2026). A Generative Model of Complex Networks Using Graphons and Neural Inverse Operators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02439", "why": "解釈しやすい機構モデルと柔軟な深層生成モデルの長所を組み合わせ、グラフォンとニューラル逆作用素で複雑ネットワークを生成する方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "解釈しやすい機構モデルと、使い回しのきく深層生成モデルの長所を合わせ、複雑ネットワークを関数空間で生成・推定する方法を作った（未査読）。", "p3": "段階型のグラフォンを再帰的に拡張したマルチフラクタルなグラフォンで複雑ネットワークを少ないパラメータで表し、そのパラメータをニューラル逆作用素で推定する。学習は合成データだけで行い、学習時と違う大きさのグラフにも推論できる（抄録）。", "p5": "実ネットワークで事前学習したグラフ基盤モデルと比べたゼロショットのグラフ生成の評価で、4つの指標のうち3つで最も良い平均性能を示し、実際のネットワークへ移せることを示したとする（抄録）。", "fun": "人の交友関係やインターネットのつながりは、似た模様が大小さまざまに繰り返す複雑な形をしています。この研究は、その形を少数の数で表す「設計図」と、実物から設計図を逆算するAIを組み合わせました。合成のデータだけで練習したAIが、本物のネットワークにも通用したのが成果です。", "unverified": "評価に使った4つの指標の中身と数値は未確認（本文を入手できず）。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "JEPAの表現崩壊を学習初期の動態で説明", "title": "Drive vs. Decay: On the Training Dynamics of Joint-Embedding Predictive Architectures", "url": "https://arxiv.org/abs/2610.02344", "authors": "Jos\\'e Lucas De Melo Costa ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Costa, J. L. D. M., Ahn, S. W., Popineau, F., Rimmel, A., & Doan, B.-L. (2026). Drive vs. Decay: On the Training Dynamics of Joint-Embedding Predictive Architectures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02344", "why": "JEPAは表現の崩壊を経験的な工夫で防いできた。勾配流を自明な不動点のまわりで線形化し、それらの工夫を統一的に説明する、学習初期の安定性の理論を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "JEPA（埋め込みを予測する自己教師あり学習）の表現の崩壊について、経験的な回避の工夫を統一的に説明する、学習初期の安定性の理論を示した（未査読）。", "p3": "自明な不動点のまわりで勾配流を線形化すると、駆動力γと減衰σの競合が現れる。モードごとの安定比μ=γ/σがデータ側と予測器側の項に分かれ、不安定なモードの数が現れうる表現の階数に対応する（抄録）。", "p5": "理論が予測する相境界を、800超の表形式のJEPAの設定で確かめた。予測器の規模・マスク率・EMAを、μを動かす別々の仕組みとして統一した。初期に恒等写像へ寄せた予測器ResidualPredで、表形式と画像の事前学習の性能が上がった（抄録）。", "fun": "AIに自分で特徴を学ばせると、何を入れても同じ答えを出す「崩壊」が起きることがあります。これまでは経験則で防いできました。この研究は、学習の最初に「引っ張る力」と「弱める力」のどちらが勝つかで崩壊が決まることを示し、ばらばらだった経験則を一つの理屈でまとめました。", "unverified": "下流の課題での精度の改善の数値は未確認（本文を入手できず）。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "費用の制約下でLLMの回答をオンラインで検証", "title": "Online Verification of Language Model Responses Under Cost Constraints", "url": "https://arxiv.org/abs/2610.02632", "authors": "Erfan Hajihashemi ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Hajihashemi, E., & Shen, Y. (2026). Online Verification of Language Model Responses Under Cost Constraints (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02632", "why": "LLMの多段推論の正しさを確かめるには、高価な正解の照会が要る。費用の制約のもとで、どの回答を照会するかを逐次に決めるオンライン検証の方法を扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "LLMの多段推論の正しさを、高価な正解の照会を節約しながらオンラインで確かめるため、費用と性能の違う複数の簡易な検証器を状況に応じて使い分ける算法（OMVV）を提案した（未査読）。", "p3": "従来は1つの簡易な検証器のスコアで高価な検証を呼ぶかを決めていたが、問いの内容や難しさが変わると性能が安定しない。K個の簡易な検証器の候補を保ち、オンラインのスコア結合と指数重みの振り分けで、毎回どの検証器を使うかを選ぶ（抄録）。", "p5": "抄録の取得できた範囲では、手法の設計が中心で、評価の結果の数値は確認できなかった（抄録）。", "fun": "AIの答えを毎回専門家に確かめてもらうのは高くつきます。そこで安い見張り役に先に見させ、怪しいときだけ専門家を呼ぶのが普通です。この研究は、得意分野の違う見張り役を何人か用意し、問題の傾向に合わせて誰に見させるかを学ばせました。一人の見張りに頼り切らない工夫です。", "unverified": "評価の課題と、費用・精度の改善の数値は未確認（抄録が途中で切れており本文も入手できず）。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "研究エージェントに次に調べることを学ばせる", "title": "Learning What to Investigate Next: Meta-Reasoning for Long-Horizon Research Agents", "url": "https://arxiv.org/abs/2610.02525", "authors": "Ankur Samanta ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Samanta, A., Efroni, Y., Sajda, P., Hassani, K., & Goyal, A. (2026). Learning What to Investigate Next: Meta-Reasoning for Long-Horizon Research Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02525", "why": "長期の研究エージェントは、どう調べるかに加え、次に何を調べるかを決める必要がある。その判断を学ぶメタ推論の手法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "長期の研究エージェントに、何を次に調べるかを決める上位の推論と、調べる実行を分けた階層構造（MIRA）を作り、方策の学習なしで長期の推論を改善した（未査読）。", "p3": "外側のメタ推論役が研究記録から文脈を選び、次の調査の作業指示を書くか、終了を決める。内側の実行役は毎回新しく立ち上がり、指示を実行する。判断の区切りごとに、残りの見込みの成果を予測する生成的な批評役を学習させた（抄録）。", "p5": "定理証明と、自由度の高いニューラルアーキテクチャの研究で、長期の推論を改善し、追加の計算を効果的に配分した。批評役はトークン単位の代替より良く予測し、環境をまたぐ事前学習で予測と適応が改善した（抄録）。", "fun": "研究では、実験のやり方以上に「次に何を調べるか」の判断が難しいものです。この研究は、AIの研究者を「方針を決める役」と「実験する役」に分けました。方針役は記録を読んで次の作業指示書を書き、実験役は毎回まっさらな状態で取りかかります。人間の研究室の分業に似た仕組みです。", "unverified": "定理証明などでの改善の数値は未確認（本文を入手できず）。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "対照群つき事前・事後デザインで効果の範囲を推定", "title": "Bounding Causal Effects in Pretest-Posttest Designs with a Control Group", "url": "https://doi.org/10.31234/osf.io/f98ym_v3", "authors": "Muwon Kwon ほか", "venue": "PsyArXiv", "date": "2026-10-04", "apa": "Kwon, M., & Steiner, P. M. (2026). Bounding Causal Effects in Pretest-Posttest Designs with a Control Group. https://doi.org/10.31234/osf.io/f98ym_v3", "why": "非同等な対照群のある事前・事後デザインでは、共変量調整と差の差のどちらも強い仮定に頼る。それらの仮定を弱め、因果効果の範囲を推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "非同等な対照群のある事前・事後デザインで、共変量調整と差の差のどちらの仮定も完全には満たせない場合に、平均処置効果の範囲を推定する方法を示した（未査読）。", "p3": "線形の構造的因果モデルと、観測されない交絡に対する事前の測定の信頼性に基づく範囲を提案した。既存の挟み込みの方法と違い、定常性の仮定が要らず、事前と事後の尺度が違ってもよい（抄録）。", "p5": "模擬データで、定常性が崩れても提案した範囲が真の効果を含み、既存手法を上回った。定常性が成り立つ場合は、しばしばより狭い範囲を与えた（抄録）。", "fun": "新しい授業法の効果を、事前と事後のテストで比べるとします。比べる相手の学級が最初から違っていると、効果の推定は仮定しだいで変わってしまいます。この研究は、一つの値に決めつけず、「効果はこの範囲にある」と幅で示す方法を作りました。分からなさを正直に幅で表す考え方です。", "unverified": "実データへの適用例と、範囲の幅の数値は未確認（本文を入手できず）。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "親への早期投資は後の学業ショックを和らげる", "title": "Latent Human Capital: How Early Investments in Parents Buffer Against Future Schooling Shocks", "url": "https://doi.org/10.3386/w35851", "authors": "Shruti Jha ほか", "venue": "NBER Working Paper", "apa": "Jha, S., List, J. A., Royer, R. C., & Samek, A. (2026). Latent Human Capital: How Early Investments in Parents Buffer Against Future Schooling Shocks (NBER Working Paper No. 35851). National Bureau of Economic Research. https://www.nber.org/papers/w35851", "why": "3〜5歳児の家庭を、育児プログラム・保育・対照に無作為に分けた実験を使った。子への効果がすぐ薄れて見えても、親への投資が後の学業ショックへの備えとして効くかを検証した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "幼児期の育児プログラムの効果は一度消えたように見えたが、10年後の休校のときに再び現れた。親への投資が、学校の支えが失われたときにだけ表に出る「潜在的な人的資本」を生むことを示した（未査読のワーキングペーパー）。", "p3": "3〜5歳児の家庭を育児プログラム・保育・対照に無作為に分けた実験と、10年後のCOVID-19による休校という自然実験を組み合わせた（抄録）。", "p5": "休校の前は、どの群でも学力への効果はゼロに戻っていた。休校で、対照群と保育群の点数は約0.25〜0.30標準偏差下がったが、育児プログラム群は0.11標準偏差の低下にとどまった（差のp=0.01）（抄録）。", "fun": "子育て支援の効果は数年で消える、とよく言われます。この研究では、確かに効果は消えたように見えました。ところが10年後、休校で学校の支えがなくなると、支援を受けた家庭の子だけ成績があまり落ちなかったのです。効果は消えたのではなく、いざという時のために眠っていたわけです。", "unverified": "各群の標本の大きさと、休校の期間の違いの扱いは未確認（本文を入手できず）。"}}, {"id": "pn40", "rank": 40, "field": "政治学", "headline": "予測市場に政治的な偏りは見られない", "title": "Are Prediction Markets Politically Biased?", "url": "https://doi.org/10.3386/w35846", "authors": "Eric Zitzewitz", "venue": "NBER Working Paper", "apa": "Zitzewitz, E. (2026). Are Prediction Markets Politically Biased? (NBER Working Paper No. 35846). National Bureau of Economic Research. https://www.nber.org/papers/w35846", "why": "1880〜2025年の予測市場の収益を分析し、左派・右派どちらの候補者にも過大評価の証拠がないことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1880〜2025年の予測市場の収益を分析し、左派・右派どちらの候補者にも過大評価の証拠がないことを示した（未査読のワーキングペーパー）。", "p3": "予測市場の価格と結果から、候補者の政治的な傾向や属性による過大評価があるかを、さまざまな部分標本で調べた（抄録）。", "p5": "最近の選挙でも、性別・人種・年齢による過大評価はなかった。多くの政治の予測市場には本命・大穴の偏りがあり、短期の世論調査の平均を対象にした市場では、左派寄りの結果のごく小さな過大評価が、標本が大きいために検出された（抄録）。", "fun": "賭けの市場は、参加者の好みに引きずられて「応援したい候補」を高く見積もりがちではないか、という心配があります。この研究は1880年から2025年までの予測市場のデータを調べ、選挙の予測については政治的な偏りが見つからないことを示しました。参加者が偏っていても、市場全体の値段は偏らないことがあるのです。", "unverified": "分析した市場の数と、偏りの推定の誤差の大きさは未確認（本文を入手できず）。"}}, {"id": "pn41", "rank": 41, "field": "政治学", "headline": "大国間の対立が新興国を予防戦争から守る", "title": "The Geopolitical Trap: How Great Power Rivalry Protects Rising Powers", "url": "https://doi.org/10.3386/w35862", "authors": "Johann Caro-Burnett ほか", "venue": "NBER Working Paper", "apa": "Caro-Burnett, J., Galiani, S., & Torrens, G. (2026). The Geopolitical Trap: How Great Power Rivalry Protects Rising Powers (NBER Working Paper No. 35862). National Bureau of Economic Research. https://www.nber.org/papers/w35862", "why": "新興国はなぜ既存の大国に抑え込まれずに生き残るのか。既存の大国どうしのコミットメント問題が、新興国への予防戦争を難しくすることを理論で示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "新興国が既存の大国に抑え込まれずに生き残れるのは、既存の大国どうしのコミットメント問題が、新興国への予防戦争を難しくするからだと理論で示した（未査読のワーキングペーパー）。", "p3": "新興国への予防的な行動が、既存の大国と別の国との関係を変える点に注目したモデルを作った。機会主義的な対立と防御的な対立の2つの場合を分析している（抄録）。", "p5": "どちらの場合も、第三国の反応が、二国間なら起きたはずの予防行動を抑止しうる。既存の大国どうしが抑え込みの結果を管理できる信頼できる取り決めを持てば、この結果は逆転する。米国の独立戦争、中国の核開発、西ドイツの核をめぐる米ソの交渉の事例で例示した（抄録）。", "fun": "新しく力をつけた国は、なぜ強い国に早めに叩かれずに済むのでしょうか。この研究の答えは、強い国どうしの仲の悪さです。一方が新興国を叩くと、その間にもう一方に付け込まれるかもしれない。だから手を出せないのです。大国の対立が、かえって新興国の盾になるという逆説です。", "unverified": "モデルの前提の詳細と、事例の分析の範囲は未確認（本文を入手できず）。"}}, {"id": "pn42", "rank": 42, "field": "交通・都市計画", "headline": "2000年代の住宅サイクルを20年分の研究で再評価", "title": "Reassessing the 2000s Housing Cycle After Two Decades of Research", "url": "https://doi.org/10.3386/w35863", "authors": "Adam Guren", "venue": "NBER Working Paper", "apa": "Guren, A. (2026). Reassessing the 2000s Housing Cycle After Two Decades of Research (NBER Working Paper No. 35863). National Bureau of Economic Research. https://www.nber.org/papers/w35863", "why": "2000年代の住宅サイクルの原因について、20年分の誘導形の実証と構造モデルを総合した。研究の時期・場所・手法・測定の違いを考慮すると、文献は整合的に読めると論じる。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "2000年代の米国の住宅サイクルの原因について、二十年に及ぶ研究を総合し、ばらばらに見えた文献が、研究の時期・場所・手法・測定の違いを考えると整合的に読めると論じた（未査読のワーキングペーパー）。", "p3": "誘導形の実証と構造モデルの両方の研究を、時期ごとの衝撃の順序に沿って整理した総説である（抄録）。", "p5": "1990年代後半から基礎的条件の改善と、自動審査と規制緩和による信用の拡大が始まり、2000年代前半の金利低下と証券化・サブプライムの信用の拡大が続いた。好況は期待を楽観に傾け、期待の分散が投機をあおった。崩壊では、住宅ローンの債務不履行が買い手と信用を減らし、価格が行き過ぎて下がった（抄録）。", "fun": "リーマン・ショックにつながった住宅バブルの原因は、二十年にわたって論争が続いてきました。この総説は、研究ごとに見ていた時期や場所が違っただけで、話は一本につながると整理しました。いくつもの要因が順番に重なった「完璧な嵐」だったという見立てです。", "unverified": "総説で取り上げた研究の数と、残る論点の詳細は未確認（本文を入手できず）。"}}, {"id": "pn43", "rank": 43, "field": "交通・都市計画", "headline": "新駅周辺の新住民ほど公共交通を使う（バンコク）", "title": "Travel Behavior Differences and Determinants of Public Transport Adoption Among Newcomers and Long-Term Residents Surrounding Newly Expanded BTS Stations in Bangkok", "url": "https://doi.org/10.2139/ssrn.7556991", "authors": "Cheunnapa Cheausuwantavee ほか", "venue": "SSRN", "date": "2026-10-03", "apa": "Cheausuwantavee, C., Kanitpong, K., Bhatt, A., & H. W. Hadikusumo, B. (2026). Travel Behavior Differences and Determinants of Public Transport Adoption Among Newcomers and Long-Term Residents Surrounding Newly Expanded BTS Stations in Bangkok. https://doi.org/10.2139/ssrn.7556991", "why": "バンコクの延伸駅の周辺で、新住民と長く住む住民の移動行動を比べた。新住民の方が公共交通を使いやすく、利便性・歩きやすさ・駐車・費用が両者の利用を左右していた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "バンコクのBTS延伸区間の新駅の周辺で、新住民は長く住む住民より公共交通をよく使う。利便性・歩きやすさ・駐車・費用が両者の利用を左右していた（未査読）。", "p3": "4つの駅の周辺の住民に質問紙調査を行い、記述統計と二項ロジスティック回帰で、社会経済属性・移動行動・公共交通の利用の決定要因を比べた（抄録）。", "p5": "新住民は若く学歴が高く、やや高所得で、駅近くの集合住宅に住む傾向があった。長く住む住民は世帯が大きく、駅から遠く、自家用車が多かった。新住民は乗り継ぎの交通を、長く住む住民は移動情報への接近を重視していた（抄録）。", "fun": "新しい駅ができても、昔からの住民はなかなか電車に乗り換えません。この研究では、駅の近くに越してきた新しい住民ほど電車を使っていました。古くからの住民は車を持ち、駅から離れて住んでいるからです。駅を作るだけでなく、誰がその周りに住むかで鉄道の使われ方が変わるのです。", "unverified": "回帰の係数の大きさと、標本の大きさは未確認（本文を入手できず）。"}}, {"id": "pn44", "rank": 44, "field": "交通・都市計画", "headline": "交通の排熱は混合の弱い朝夕に地表気温を上げる", "title": "Boundary-layer mixing and urban morphology modulate near-surface warming from traffic anthropogenic heat", "url": "https://doi.org/10.2139/ssrn.7560978", "authors": "Sicheng Wu ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Wu, S., Sharma, A., Huidobro, G., Sharma, P., Hamlet, A. F., Kumar, R., & Martilli, A. (2026). Boundary-layer mixing and urban morphology modulate near-surface warming from traffic anthropogenic heat. https://doi.org/10.2139/ssrn.7560978", "why": "シカゴを1km解像度の気象モデルで解き、道路別・時間別の交通排熱を入れて比べた。排熱が最大の午後よりも、大気の混合が弱い朝や夜の方が、地表付近の気温への影響が大きかった。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "車の排熱が地表付近の気温をどれだけ上げるかは、排熱の量だけでなく、大気の混合と都市の形態で決まる。シカゴの模擬で、排熱が最大の午後より、混合の弱い朝や夜に影響が大きいことを示した（未査読）。", "p3": "1km解像度の気象モデル（WRF）に多層の都市キャノピーのスキームと、道路別・時間別の交通排熱の目録を入れ、排熱ありとなしの対の模擬を、熱波でない期間と熱波の期間で行った（抄録）。", "p5": "排熱による2m気温の上昇は、熱波でない期間の朝7時に約0.38〜0.48℃、熱波の期間の朝9時に0.35〜0.48℃で最大だった。排熱が最大の午後は、地表付近の上昇は概ね0.2℃未満だった。日中は対流の混合が熱を深い境界層へ運んでいた（抄録）。", "fun": "車の熱で街が暑くなるなら、交通量が最も多い時間に最も暑くなりそうです。ところが模擬では、影響が大きいのは朝や夜でした。昼は空気がよくかき混ぜられて熱が上空へ逃げますが、朝や夜は地面近くにたまるからです。熱の出る量より、逃げ道があるかが効くわけです。", "unverified": "都市の形態の分類ごとの違いの詳細は未確認（本文を入手できず）。"}}, {"id": "pn45", "rank": 45, "field": "経営学", "headline": "環境イノベーション企業ほどデジタル効率が高い", "title": "When green interacts with digital: Eco-innovation adoption, technological gaps, and sectoral heterogeneity", "url": "https://doi.org/10.2139/ssrn.7560382", "authors": "Consuelo Calafat-Marzal ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Calafat-Marzal, C., Puertas Medina, R., & Sanchez, M. (2026). When green interacts with digital: Eco-innovation adoption, technological gaps, and sectoral heterogeneity. https://doi.org/10.2139/ssrn.7560382", "why": "スペイン企業247社を包絡分析法のメタフロンティアで分析した。環境イノベーションを行う企業ほどデジタル効率が高く、技術ギャップが小さかった。改善の経路も両者で異なる。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "スペイン企業247社で、環境イノベーションを行う企業ほどデジタル化の効率が高く、技術の格差も小さいことを示した（未査読）。", "p3": "3つの業種の企業について、非凸のメタフロンティアを使う包絡分析法（DEA）で、技術の違いを考慮しながらデジタル効率と、効率の境界へ近づく道筋を推定した（抄録）。", "p5": "環境イノベーション企業は、推定した最大効率に近かった。改善の道筋も違い、環境イノベーション企業はデジタルの成果を増やす必要があり、そうでない企業は姿勢・経営陣の支援・能力・圧力といった組織の投入の組み合わせのずれに非効率があった（抄録）。", "fun": "環境への取り組みとデジタル化は、別々の課題に見えます。この研究は、環境の革新に取り組む企業ほど、デジタル化もうまく使いこなしていることを示しました。しかも、遅れている企業の課題は道具の不足ではなく、組織の構えのずれにありました。緑とデジタルは同じ組織の力から生まれるのかもしれません。", "unverified": "業種ごとの効率の数値は未確認（本文を入手できず）。"}}, {"id": "pn46", "rank": 46, "field": "経営学", "headline": "戦略の『美しさ』を相互作用が生む形として理論化", "title": "Strategic Aesthetics: The Aesthetics of Strategic Form Emerging from Strategic Interaction", "url": "https://doi.org/10.2139/ssrn.7553760", "authors": "Takashi Oyama", "venue": "SSRN", "date": "2026-10-04", "apa": "Oyama, T. (2026). Strategic Aesthetics: The Aesthetics of Strategic Form Emerging from Strategic Interaction. https://doi.org/10.2139/ssrn.7553760", "why": "自律的な主体の相互作用から生まれる「戦略の形」を、美的分析の対象とする理論枠組みを提案した。統合と関係の変容という2つの生成原理を区別している。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "戦略が「美しい」と言われるとき、何が美しいのか。自律的な主体の相互作用から生まれる「戦略の形」を美的分析の対象とする理論枠組み（戦略美学）を提案した（未査読）。", "p3": "戦略の形を、自律的な主体・行動・制約・環境の相互作用で時間をかけて実現される関係の秩序あるパターンと定義した。組織の美学と戦略づくりの研究を土台にした理論研究である（抄録）。", "p5": "戦略の形を生む2つの原理を区別した。異質な要素がそれぞれの能力と制約を保ったまま補い合う系を作る「統合」と、既存の関係や条件を別の関係に変える「関係の変容」である（抄録）。", "fun": "将棋の名手の一手や、見事な経営戦略は「美しい」と言われます。でも、何がそう感じさせるのかは説明されてきませんでした。この研究は、美しさの対象を、一手そのものではなく、相手とのやり取りから生まれる関係の形だと考えました。戦略を芸術のように論じる、珍しい理論です。", "unverified": "実証による検証の有無は未確認（理論研究で、本文を入手できず）。"}}, {"id": "pn47", "rank": 47, "field": "経営学", "headline": "10分配達のクイックコマースを消費者心理から読む", "title": "Beyond the 10-Minute Promise: Decoding the Consumer mindset in the Quick Commerce market", "url": "https://doi.org/10.2139/ssrn.7560441", "authors": "Megha Bharti", "venue": "SSRN", "date": "2026-10-04", "apa": "Bharti, M. (2026). Beyond the 10-Minute Promise: Decoding the Consumer mindset in the Quick Commerce market. https://doi.org/10.2139/ssrn.7560441", "why": "インドで急成長する10分配達のクイックコマースについて、消費者が何を重視して利用するかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "インドで10分配達のクイックコマースが当たり前になる中、利用者がアプリを使い続けるか乗り換えるかを決める要因を調べ、動機の違う3つの顧客層を見いだした（未査読）。", "p3": "活発な利用者への質的なインタビューと量的な調査を組み合わせた混合研究で、心理的・機能的・状況的な要因を分析した（抄録）。", "p5": "顧客層は、便利さを求める層、価格に敏感な掘り出し物狙いの層、時々選んで買う層の3つに分かれた。速い配達が前提になるにつれ、継続して選ばれるかは、確実なサービス、公平さの感覚、心理的な安心に左右されるようになっていた（抄録）。", "fun": "注文から10分で日用品が届くサービスは、どの会社も同じ速さを約束するようになりました。そうなると、客を引き留めるのは速さではなくなります。この研究では、確実に届くこと、公平に扱われること、安心できることが決め手でした。当たり前になった強みは、もう強みではないのです。", "unverified": "量的調査の標本の大きさと、顧客層の割合は未確認（本文を入手できず）。"}}, {"id": "pn48", "rank": 48, "field": "組織行動・心理的安全性", "headline": "不確実な中で明快さを求められるリーダーの葛藤", "title": "The Certainty Paradox in Leadership: Adaptive Thinking and Demands for Clarity Under Uncertainty", "url": "https://doi.org/10.2139/ssrn.7560747", "authors": "Dr. Stavroula Kalogeras", "venue": "SSRN", "date": "2026-10-04", "apa": "Kalogeras, Dr. S. (2026). The Certainty Paradox in Leadership: Adaptive Thinking and Demands for Clarity Under Uncertainty. https://doi.org/10.2139/ssrn.7560747", "why": "管理職61人を含む調査で、多くが複数の視点を検討している一方、曖昧な状況で明快な答えを求められていると答えた。そこから「早すぎる認識の閉鎖」という概念を提起した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "リーダーは不確実な状況で明快さを求められるため、解釈の作業を早く終わらせすぎる危険がある。この緊張を「確実性のパラドックス」として理論化し、調査で裏づけた（未査読）。", "p3": "パラドックス理論・組織のセンスメイキング・認知的な終結の研究をもとに概念を作り、専門職102人のうち管理職・役員・創業者61人の調査データで検討した（抄録）。", "p5": "93.4%が単純化された二者択一を見抜き、91.8%が決定の前に複数の視点を検討していた。一方で、78.7%が明快な答えを出すことを期待されていると答えた。そこから「早すぎる認識の閉鎖」という概念を提起した（抄録）。", "fun": "リーダーには「はっきり決めてくれ」という期待がかかります。でも状況がよく分からないうちに決めつけると、考えるべきことを考えずに終わってしまいます。この研究は、多くのリーダーが本当は迷いながら、周りからの「明快さ」の圧力にさらされていることを示しました。決断力の裏にある危うさです。", "unverified": "調査の抽出方法と、管理職以外の回答者との比較は未確認（本文を入手できず）。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "教員の集団的創造性を育てる多層の支援枠組み", "title": "A framework for fostering teacher collective creativity and innovation", "url": "https://doi.org/10.2139/ssrn.7560835", "authors": "Weijing Han", "venue": "SSRN", "date": "2026-10-04", "apa": "Han, W. (2026). A framework for fostering teacher collective creativity and innovation. https://doi.org/10.2139/ssrn.7560835", "why": "文書分析から、国の政策・組織の構造・チームの実践を統合した、教員の集団的な創造性と革新を支える枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "教員の集団的な創造性と革新を育てるには、国の政策・組織の構造・チームの実践を統合した多層の支援が要るとする枠組みを、文書分析から示した（未査読）。", "p3": "教員の創造性と革新を集団の仕組みで育てる方法について、文書分析で包括的な枠組みを作った（抄録）。", "p5": "集団的な創造性と革新は、教育課程の開発、授業の革新、研究力の育成、社会貢献の4つの領域に表れた。その育成には上からの多層の支援が必要で、提案した枠組みは既存のモデルを統合的に拡張するとする（抄録）。", "fun": "先生の創造性は、個人のひらめきの問題だと思われがちです。この研究は、それを学校や国の仕組みが育てる「集団の力」として捉え直しました。教室の工夫も、チームの支えと組織の制度と国の政策がそろって初めて広がる、という見取り図を示しています。", "unverified": "分析した文書の種類と数は未確認（本文を入手できず）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "GANと領域適応で橋梁監視データの異常を判別", "title": "Bridge data anomaly detection based on improved WGAN-GP and CBAM-Dense-DANN", "url": "https://doi.org/10.1088/1361-665x/aeaf92", "authors": "Xu-Lei Zhao ほか", "venue": "Smart Materials and Structures", "date": "2026-10-02", "citescore": 6.1, "citescore_year": "2025", "apa": "Zhao, X.-L., He, W.-Y., Liang, Z., Ding, X.-C., & Ren, W.-X. (2026). Bridge data anomaly detection based on improved WGAN-GP and CBAM-Dense-DANN. Smart Materials and Structures. https://doi.org/10.1088/1361-665x/aeaf92", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "橋梁の監視データの異常を判別するとき、手本になる既知の異常データは少なく偏っている。この問題を、生成モデルで異常データを補い、領域適応で手本と実際のデータの分布のずれを埋めることで扱い、数値データと実橋のデータで高い分類精度を示した。", "p2": "機械学習による異常検知は橋梁監視で広く使われている。だが既知の異常データは偶然に左右されて数が少なく、実際の異常の分布を代表しにくい。これが性能の壁になっていた（抄録）。", "p3": "データを短時間フーリエ変換で2次元の時間周波数の行列にし、既知の異常の行列を改良したWGAN-GP（勾配ペナルティ付きワッサースタイン型の敵対的生成ネットワーク）で増やした。そのうえで、注意機構と密結合ブロックを持つ領域敵対ネットワークで、既知の異常（元の領域）と実際の異常（目標の領域）の特徴の分布をそろえた（抄録）。直観：足りない手本をAIに描き足させ、練習用と本番のデータの「くせ」の違いも学習の中で消していく。", "p4": "数値シミュレーションのデータと実橋の監視データで分類精度を測り、古典的なDenseNetと比べた（抄録）。", "p5": "分類精度は数値データで97.56%、現場データで98.16%で、DenseNetをそれぞれ11.40%、10.30%上回った。ラベルのない大量のデータを効率よく判別でき、手作業での注釈の手間を大きく減らせるとする（抄録）。", "p6": "異常の種類（センサの故障などのデータ異常か、構造の損傷か）とクラスの内訳、実橋のデータの規模、他の領域適応の手法との比較は抄録からは分からない。解釈：DenseNetとの差が百分率の点の差か相対的な差かも、抄録からは判断できない。", "fun": "橋に取り付けたセンサのデータには、故障や雑音による「おかしなデータ」が混じります。ところが、その手本は少なく、AIに覚えさせるのが大変です。この研究は、AIに異常の手本を描き足させて数を増やし、練習用と本番のデータのくせの違いもそろえることで、実際の橋のデータで98.16%の正解率を出しました。足りない手本をAIで補うという発想です。", "unverified": "異常の種類とクラスの内訳、実橋のデータの規模、DenseNetとの差の意味は未確認（本文を入手できず）。"}}, {"id": "jr02", "rank": 2, "headline": "対話型AIの導入企業ほど10-Kが読みやすい", "title": "How conversational AI shapes the readability of 10-K reports", "url": "https://doi.org/10.1108/imds-11-2025-1599", "authors": "Junru Zhang ほか", "venue": "Industrial Management & Data Systems", "date": "2026-10-03", "citescore": 10.1, "citescore_year": "2025", "apa": "Zhang, J., Zheng, C., Taylor, G., & Wang, X. (2026). How conversational AI shapes the readability of 10-K reports. Industrial Management & Data Systems, 1–16. https://doi.org/10.1108/imds-11-2025-1599", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "米国企業の10-K（年次報告書）で、対話型AIの導入が多い企業ほど財務報告の文章が読みやすいことを示した。その一部は、業績と業務の効率の改善を通じた関係だった。", "p2": "対話型AIは業務の効率と業績を高め、企業の複雑さを分かりやすい財務の説明に変えうる。だが、その導入が開示の読みやすさにつながるかは検証されていなかった（抄録）。", "p3": "10-Kの対話型AIに関する記述から、文単位の潜在ディリクレ配分と変分EMによるトピックモデルで、企業ごとのAI導入度を作った。サービス・業務への応用と、意思決定・ガバナンスへの応用を分けて捉えている。頑健性の確認には、自然言語処理と音声認識の特許に基づく代替指標を使った（抄録）。", "p4": "結果の物差しは10-Kの読みにくさを測るBog Indexである。媒介分析で業績と業務効率の経路を調べ、内生性への対処と別の定式化で結果の頑健さを確かめた（抄録）。", "p5": "対話型AIの導入はBog Indexの低さ、つまり読みやすい10-Kと結びついた。業績と業務効率はこの関係を部分的に媒介した。結果は内生性への対処と別の定式化でも変わらず、対話型AIは主にサービス関連の活動、意思決定、ガバナンスで使われていた。係数の大きさは抄録にない（抄録）。", "p6": "標本の期間と企業数、内生性への対処の方法は抄録からは分からない。解釈：AIの導入度を同じ10-Kの記述から測っているため、文章の書き方そのものが両方の指標に影響している可能性を、本文で確かめる必要がある。", "fun": "会社の年次報告書は、専門用語だらけで読みにくいことで有名です。この研究は、チャットボットなどの対話型AIを取り入れている会社ほど、報告書の文章が読みやすいことを示しました。AIで仕事の効率が上がると、会社の説明もすっきりするのかもしれません。ただ、文章の上手な会社がAIの記述も多い、という可能性も残ります。", "unverified": "標本の期間・企業数、内生性への対処の方法、効果の大きさは未確認（本文を入手できず）。"}}, {"id": "jr03", "rank": 3, "headline": "データ取引所の設立が実体的利益調整を抑える", "title": "Can data factor marketization curb real earnings management? Evidence from the establishment of data asset trading platforms", "url": "https://doi.org/10.1016/j.iref.2026.105916", "authors": "Ningzhi Wang ほか", "venue": "International Review of Economics & Finance", "date": "2026-09-29", "citescore": 8.3, "citescore_year": "2025", "apa": "Wang, N., Zhang, J., & Xu, L. (2026). Can data factor marketization curb real earnings management? Evidence from the establishment of data asset trading platforms. International Review of Economics & Finance, 112, 105916. https://doi.org/10.1016/j.iref.2026.105916", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "中国の省ごとに時期をずらして設立されたデータ資産取引所を準自然実験として使い、データ市場の発達が上場企業の実体的利益調整（取引そのものを操作した利益の調整）を減らすことを示した。", "p2": "データの市場化はデジタル経済の基本的な制度の革新である。だが、それが企業の利益の質に与える影響の証拠は乏しかった（抄録）。", "p3": "2008〜2024年のA株上場企業のパネルで、取引所の設立時期が省ごとに違うことを利用した段階的な差の差の分析で、実体的利益調整への効果を推定した。仕組みとして、情報の非対称性とコーポレートガバナンスを調べている（抄録）。直観：データが売り買いされて外部の目が増えると、経営者は取引の操作で数字を飾りにくくなる。", "p4": "評価は、実体的利益調整の変化、デジタル教育を受けた経営陣・ハイテク企業・非国有企業での違い、負債の資金調達コストと財務諸表の修正再表示の確率である（抄録）。", "p5": "データ資産取引所の設立は、実体的利益調整を有意に減らした。効果は情報の非対称性の緩和とガバナンスの強化を通じていた。デジタル教育を受けた経営陣のいる企業、ハイテク企業、非国有企業で効果が強かった。処置を受けた企業は負債コストが下がり、修正再表示の確率も下がった（抄録）。", "p6": "段階的な差の差で問題になる処置効果の異質性への対処や、事前の趨勢の検定の結果は抄録からは分からない。解釈：取引所の設立は省のデジタル化政策と同時に進むことが多く、他の政策との切り分けが課題になる。", "fun": "データを売り買いする市場ができると、会社の会計まで正直になるのでしょうか。この研究は、中国の省ごとにデータ取引所ができた時期の違いを「自然の実験」として使いました。取引所ができた地域の会社では、取引を操作して利益を見せかける行為が減っていました。情報が流れると、経営者はごまかしにくくなるわけです。", "unverified": "推定量の種類（段階的な差の差の異質性への対処）と事前の趨勢の検定結果は未確認（本文を入手できず）。"}}, {"id": "jr04", "rank": 4, "headline": "CSAT・NPSが安定する標本割合を変化点で特定", "title": "A-263 The Importance of Optimal Sampling Proportion Determination for Reliable Estimation of Client Sentiment Metrics: Historical Variability Analysis and the Use of Segmented Regression for Sampling Threshold Optimization", "url": "https://doi.org/10.1093/clinchem/hvag086.213", "authors": "Rafael Jacomo ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Jacomo, R., Normandes, J. L., Alves, C., Silva, A., Nazareth, L., Pereira, S., Silva, M., Nery, L., & Dias, A. (2026). A-263 The Importance of Optimal Sampling Proportion Determination for Reliable Estimation of Client Sentiment Metrics: Historical Variability Analysis and the Use of Segmented Regression for Sampling Threshold Optimization. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.213", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Clinical Chemistry誌の学会抄録（Crossref経由）を使用", "preprint": false, "p1": "ブラジルの民間臨床検査会社の顧客満足の指標（CSAT・NPS）1,015,281件で、利用者全体のうち回答を得る割合（標本割合）が7.3%を超えると、指標のばらつきが落ち着くことを変化点回帰で示した（学会抄録）。", "p2": "CSATやNPSは医療で広く使われるが、目標値が恣意的に決められがちである。回答の割合が小さいと標本変動に敏感になり、真のサービスの質を覆い隠したり誤解を招いたりする（抄録）。", "p3": "2023〜2025年の3年分、25の地域拠点と本部のデータで、標本割合とばらつきの関係を、未知の変化点をもつ連続な区分線形回帰で表した。変化点と99.5%信頼区間は、Muggeoのsegmentedパッケージで推定した（抄録）。直観：回答の割合を増やしていくと、ある点を境にばらつきの減り方が急に緩やかになる。その曲がり角を探す。", "p4": "評価は、変化点とその信頼区間、変化点の前後での指標のばらつき（統合標準偏差）と平均・パーセンタイルである（抄録）。", "p5": "変化点は7.3%（99.5%信頼区間5.6〜10.1%）だった。この閾値で統合標準偏差は2.65%で、信頼区間の下限より少ない割合では最大15.79%まで増えた。上限を超える割合では、CSATの平均が98.35%、NPSが96.35%に安定し、下限未満の91.2%、87.6%より高かった（抄録）。", "p6": "1社の検査会社のデータで、学会抄録のため詳しい方法は確認できない。解釈：標本割合の高い拠点ほど指標が高いという違いは、拠点の規模や運営の違いによる可能性もあり、標本変動だけの効果とは言い切れない。", "fun": "満足度調査の点数は、答えた人が少ないと、たまたまの数人の意見で大きく上下します。この研究は1,015,281件のデータから、利用者の7.3%以上から回答を集めれば点数のぶれが小さくなることを示しました。ぶれの小さい範囲で目標を立てれば、偶然の上下に一喜一憂しなくて済む、という地に足のついた提案です。", "unverified": "拠点ごとの規模の違いと指標の関係の統制は未確認（学会抄録のみ）。"}}, {"id": "jr05", "rank": 5, "headline": "サービス回復では補償の公正さが最も効く", "title": "The Priority of Distributive over Interactional Justice in Service Recovery: Turkish Air Passengers’ Emotional and Behavioral Responses Following Overbooking", "url": "https://doi.org/10.30798/makuiibf.1889116", "authors": "Hüseyin Şenerol ほか", "venue": "Mehmet Akif Ersoy Üniversitesi İktisadi ve İdari Bilimler Fakültesi Dergisi", "date": "2026-10-04", "apa": "Şenerol, H., & Sarılgan, A. E. (2026). The Priority of Distributive over Interactional Justice in Service Recovery: Turkish Air Passengers’ Emotional and Behavioral Responses Following Overbooking. Mehmet Akif Ersoy Üniversitesi İktisadi Ve İdari Bilimler Fakültesi Dergisi, 13(3), 1092–1120. https://doi.org/10.30798/makuiibf.1889116", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は取得できず", "preprint": false, "p1": "オーバーブッキングで乗れなかった後の回復策について、トルコの航空利用者297人のシナリオ実験で、補償などの分配的公正が回復満足と感情に最も強く効くことを示した。満足は再購買意図と好意的な口コミにつながった。", "p2": "背景：サービス回復の研究では、分配的・手続き的・相互作用的な公正のどれが重要かが議論されてきた。この研究はトルコの航空市場で、オーバーブッキングの後に公正の各次元が乗客の感情と行動にどう効くかを調べた（抄録）。", "p3": "便宜的に集めた297人に、オーバーブッキングと回復の場面を提示するシナリオ法を使った。公正の各次元、正と負の感情、回復満足、再購買意図、口コミの関係を分析している。分析手法の詳細は抄録にない（抄録）。", "p4": "評価は、各公正の次元が回復満足と感情に与える影響の大きさ、正と負の感情が回復満足に与える影響、満足から再購買意図・口コミへの経路である（抄録）。", "p5": "形のある公正（分配的公正）が、回復満足と感情反応を最も強く変えた。負の感情は回復満足を下げたが、正の感情は統計的に有意でなかった。満足は、再購買意図と好意的な口コミの両方の直接の前段だった。係数は抄録にない（抄録）。", "p6": "便宜的な標本とシナリオ法のため、実際の体験での反応との違いや一般化には限界がある。解釈：決まり文句の謝罪から、混乱の性質に合わせた補償表へ、という著者の提言は、補償の費用とのつり合いを別に検討する必要がある。", "fun": "飛行機の予約が取りすぎで乗れなかったとき、何をしてもらえば許せるでしょうか。この研究では、丁寧な謝罪より、具体的な補償という「形のある公平さ」が満足を最も左右しました。しかも、嫌な気持ちは満足を下げるのに、うれしい気持ちは満足を上げませんでした。良いことと悪いことの重みが違うという非対称さです。", "unverified": "分析手法と係数の大きさ、シナリオの具体的な内容は未確認（本文を入手できず）。"}}, {"id": "jr06", "rank": 6, "headline": "車載GNSS5台でGPS・GLONASSの測位精度を比較", "title": "ACCURACY ANALYSIS OF VEHICLE POSITIONING USING GPS AND GLONASS DATA", "url": "https://doi.org/10.20858/sjsutst.2026.132.11", "authors": "Kamil KRASUSKI ほか", "venue": "Scientific Journal of Silesian University of Technology Series Transport", "date": "2026-10-04", "citescore": 2.3, "citescore_year": "2025", "apa": "KRASUSKI, K., BAKUŁA, M., & MIDUCH, P. (2026). ACCURACY ANALYSIS OF VEHICLE POSITIONING USING GPS AND GLONASS DATA. Scientific Journal of Silesian University of Technology Series Transport, 132, 197. https://doi.org/10.20858/sjsutst.2026.132.11", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（方法・結果・考察・結論の節と図の説明）を読んだ", "preprint": false, "p1": "車の屋根に並べた5台のGNSS受信機のコード単独測位を平均する方法で、GPS・GLONASS・両者の組み合わせの走行中の測位精度を評価した。組み合わせは高さの精度を改善するが、水平はGPS単独より劣った。", "p2": "車の測位の研究は多いが、1台の車に複数の受信機を載せた単独測位、とくにGPSとGLONASSの組み合わせを扱った研究は少なかった。複数の受信機は位置の解に冗長性を与え、走行中の測定の信頼性を高める（§1.2）。", "p3": "原文の表記で17.09.2015に、ポーランド北東部オルシュティンの空港で約40km/h・約20kmの試験走行を行い、中央1台と周囲4台（約1.5m間隔）の受信機で1秒ごとのコード観測を記録した。RTKLIBで3通りの単独測位の解を求め、精密単独測位（PPP）で作った基準軌跡との差を5台で平均した（§2）。直観：誤差の向きは受信機ごとに少しずつ違うので、平均すると打ち消し合う。", "p4": "評価は、緯度・経度・楕円体高ごとの4,703エポックのRMS誤差と、5台平均による誤差の広がりの縮小率である（§2、式5〜8）。基準軌跡の精度は水平0.05m・鉛直0.09mより良い。", "p5": "5台平均のRMS誤差（緯度・経度・高さ）は、GPSで0.21m・0.53m・2.06m、GLONASSで1.34m・1.83m・1.78m、組み合わせで0.34m・0.73m・1.51mだった（表1）。組み合わせは高さを改善し、GLONASS単独よりすべての成分で良かったが、水平はGPS単独より劣った。5台の平均で最大誤差の広がりは15〜55%縮んだ（§4、図16〜18）。", "p6": "障害物のない空港を1回走ったデータで、市街地のマルチパスや遮へいの影響は調べていない。解釈：受信機の機種が中央と周囲で異なり、平均による改善に機種差が含まれるかは本文から判断しにくい。著者はSBAS・DGPS・Galileoなどへの拡張を今後の課題とする（§5）。", "fun": "カーナビの位置は、宇宙の衛星からの電波で決まります。この研究は、車の屋根に受信機を5台並べて答えを平均すると誤差が小さくなることを示しました。さらに、アメリカのGPSとロシアのGLONASSを組み合わせると高さは正確になる一方、水平の位置はGPSだけの方が正確でした。衛星を増やせば何でも良くなるわけではないのです。", "unverified": "受信機の機種差（中央と周囲で別機種）が結果に与えた影響は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "配向分布の縮約モデルでHopf分岐と最適制御", "title": "Nonlinear dynamics, Hopf bifurcation, and optimal control in a reduced-order Doi–Hess model for shear-driven nematic liquid crystals", "url": "https://doi.org/10.7494/cmms.2026.2.1047", "authors": "Lakshmi N. Sridhar", "venue": "Computer Methods in Materials Science", "date": "2026-10-04", "apa": "Sridhar, L. N. (2026). Nonlinear dynamics, Hopf bifurcation, and optimal control in a reduced-order Doi–Hess model for shear-driven nematic liquid crystals. Computer Methods in Materials Science, 26(2). https://doi.org/10.7494/cmms.2026.2.1047", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社のページ（抄録・書誌情報・参考文献）を読んだ。受理稿の本文は未公開で取得できず", "preprint": false, "p1": "せん断流れの中のネマチック液晶を、Doi–Hessの運動論から導いた5変数の縮約モデルで表した。せん断速度を変えるとHopf分岐が起きて周期的な振動に移ることを示し、分岐の構造を考えた最適制御で配向の異方性を大きく減らせることを示した。", "p2": "背景：配向の分布関数の発展方程式は高次元で扱いにくい。せん断流れの下での配向の複雑な動きを、解析や制御に使える低次元のモデルが求められていた（抄録）。", "p3": "配向の分布関数の2次モーメントである配向テンソル（対称でトレースがゼロ）を、5つの線形独立で非直交なテンソル基底で表した。ランダウ・ドジャンの緩和とせん断による再配向を含む発展方程式をその部分空間に射影し、閉じた5本の非線形常微分方程式を得た（抄録）。解釈：分布関数の全体ではなく「向きの偏り」だけを追うことで、本質を残して次元を下げている。", "p4": "MatContの数値接続法で、せん断速度に沿って平衡点と周期軌道の分岐を追い、第一リャプノフ係数で分岐の性質を確かめた。最適制御では、動力学を制約として異方性を最小化し、Hopf分岐の構造を明示的に考える場合と考えない場合を比べた（抄録）。", "p5": "せん断速度を変えるとHopf分岐と周期軌道の枝が現れ、第一リャプノフ係数で振動的な動きへの移行が確かめられた。分岐を考えた制御では、異方性が大きく減った。減少量や分岐点のせん断速度の数値は抄録にない（抄録）。", "p6": "縮約モデルと元の運動論の計算との比較による検証や、2次モーメントで閉じる近似の誤差は抄録からは分からない。解釈：モーメントの閉包近似が、せん断の強い領域で妥当かは参照解との比較で確かめる必要がある。", "fun": "液晶ディスプレイの中では、棒のような分子がそろって向きを変えます。この研究は、無数の分子の向きの散らばりをたった5つの数で表すモデルを作り、流れを強めると向きがリズムを刻むように揺れ始める境目を見つけました。その揺れ始めの仕組みを知ったうえで制御すると、向きの偏りをうまく抑えられるのです。", "unverified": "縮約モデルと元の分布関数の計算との比較、分岐点の数値、異方性の減少量は未確認（受理稿の本文を入手できず）。"}}, {"id": "jr08", "rank": 8, "headline": "介護職の職業的アイデンティティが品質を高める経路", "title": "From Professional Identity to Service Quality Among Nursing Home Caregivers: The Serial Mediation Effects of Job Satisfaction and Burnout", "url": "https://doi.org/10.1155/hsc/9035833", "authors": "Shin Myoung Sung ほか", "venue": "Health & Social Care in the Community", "date": "2026-10-03", "citescore": 6.7, "citescore_year": "2025", "apa": "Sung, S. M., & Kim, M. (2026). From Professional Identity to Service Quality Among Nursing Home Caregivers: The Serial Mediation Effects of Job Satisfaction and Burnout. Health & Social Care in the Community, 2026(1). https://doi.org/10.1155/hsc/9035833", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は取得できず", "preprint": false, "p1": "韓国の介護施設の介護職690人で、職業的アイデンティティが、本人の感じるサービスの質を高めることを示した。その経路には、職務満足が上がり、燃え尽きが下がるという直列の媒介が含まれていた。", "p2": "背景：長期介護では人材の定着とケアの質が重要な課題である。介護職の職業的アイデンティティがサービスの質にどうつながり、職務満足と燃え尽きがどう介在するかは十分に分かっていなかった（抄録）。", "p3": "690人の調査データを、2つの媒介変数を直列に置くモデル（SPSS PROCESSのModel 6）で分析した。職業的アイデンティティ→職務満足→燃え尽き→サービスの質という経路を推定している（抄録）。", "p4": "評価は、直接効果、職務満足と燃え尽きそれぞれの単独の間接効果、そして直列の間接効果の有意性である（抄録）。", "p5": "職業的アイデンティティは、サービスの質に有意な正の直接効果をもった。職務満足とは正、燃え尽きとは負の関係があった。職務満足単独の媒介は有意でなかったが、燃え尽きは単独で有意な媒介だった。職業的アイデンティティ→職務満足→燃え尽きの低下→サービスの質という直列の経路も有意だった。効果の大きさは抄録にない（抄録）。", "p6": "横断調査かどうか、サービスの質を介護職自身が評価したのか（共通方法の偏り）は抄録からは確かめられない。解釈：質が自己評価なら、利用者の評価との一致は別の検証が要る。", "fun": "介護の仕事に誇りを持っている人ほど、良いケアができていると感じている、という研究です。面白いのはその間の仕組みです。仕事への満足そのものより、「燃え尽きないこと」の方が質の良いケアに直接つながっていました。満足は燃え尽きを防ぐことで間接的に効いている、という順番が見えたのです。", "unverified": "調査デザイン（横断か縦断か）、サービスの質の評価者、効果の大きさは未確認（本文を入手できず）。"}}, {"id": "jr09", "rank":
