<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-05", "intro": "プレプリントの新着771件、学術誌の新着1,128件（うち上位10%誌874件）、重要論文の候補197件、公開データの新着96件から選びました。プレプリント・関連50報、プレプリント・注目49報、論文誌・関連45報、論文誌・注目29報、データ23件です。50報に満たない部は、良い候補が少なかったため件数を絞りました。論文誌・注目は主要誌の新着が少なく、上位10%誌の注目分野の論文で補っています。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "作業時間の目安表示で作業は速まるが返金が増える", "title": "When Algorithms Time Workers: Speed-Quality Tradeoffs in a Randomized Field Experiment", "url": "https://doi.org/10.2139/ssrn.7554058", "authors": "Youngsoo Kim ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Kim, Y., & Mitrofanov, D. (2026). When Algorithms Time Workers: Speed-Quality Tradeoffs in a Randomized Field Experiment. https://doi.org/10.2139/ssrn.7554058", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文はアクセス制限で取得できず", "preprint": true, "p1": "食料品のピッキングで、かご1つにかかる目安時間を画面に出すだけで作業は速くなる。ただし返金も増える。報酬にも評価にも結びつかない「情報だけ」の効果を、2年以上・20万人超の無作為化フィールド実験で切り分けた（未査読）。", "p2": "アルゴリズムは仕事の割り当てだけでなく、働き方そのものにも影響する。目安時間の表示は、ペース配分や探し方の改善につながるのか。それとも探すのを早めにあきらめる方向に働くのか。この区別がついていなかった（抄録）。", "p3": "注文のまとまりごとに予想ピッキング時間を示すタイマーを、使う群と使わない群に無作為に割り当てた。数千万件の作業について、所要時間と返金への因果効果を推定している。目安を上回っても下回っても、報酬・評価・仕事の割り当ては変わらない。だから表示そのものの効果だけを取り出せる（抄録）。", "p4": "良し悪しは速さと品質の両方で測る。速さはピッキング時間、品質は返金である。かごの大きさ、時間帯、曜日、難しさの代理指標ごとに効果を比べ、ギグワーカーと正社員も分けている（抄録）。", "p5": "タイマーは平均で作業を2.8%速め、返金を0.77%増やした。速くなる度合いは、大きいかご、勤務の早い時間、週末で大きい。難しい環境では、速さを保ったまま返金への悪影響が弱まった。効果はギグワーカーに集中し、正社員ではほぼ見られない（抄録）。", "p6": "推定の信頼区間と、返金の増加が顧客に与える影響は抄録からは分からない。正社員に効かない理由として、著者は日々の手順や店への慣れが内部の目安になっている可能性を挙げる。解釈：1つの小売網の事例であり、他業種への一般化には別の検証が要る。", "fun": "「この作業は約何分」と画面に出るだけで、人は急ぎます。急いでも給料は増えないのに、です。20万人を超える作業者で試すと、表示は作業を2.8%速める一方、返金は0.77%増えました。速さと品質は同時には手に入らないのです。しかも効いたのは単発で働く人だけで、慣れた正社員には効きませんでした。", "unverified": "推定の信頼区間と、返金の0.77%増が相対値か絶対値かは未確認（本文を入手できず）。"}}, {"id": "pr02", "rank": 2, "headline": "人的資本の開示は従業員の写真にも表れる", "title": "Human capital disclosure in words and photographs: Evidence from Japan", "url": "https://doi.org/10.2139/ssrn.7560588", "authors": "Yoshitaka Tanaka ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Tanaka, Y., & Managi, S. (2026). Human capital disclosure in words and photographs: Evidence from Japan. https://doi.org/10.2139/ssrn.7560588", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "日本の上場企業の統合報告書では、言葉で従業員を重視する企業ほど、従業員の写真を多く載せている。文章と写真という2つの語り口がそろうかを、LLM（大規模言語モデル）に3,377冊の写真を仕分けさせて確かめた（未査読）。", "p2": "背景：人的資本の開示の研究は、文章の分析を中心に進んできた。だが統合報告書には写真が多く、読み手の印象を左右する。文章で述べる姿勢が写真にも表れるのかは、ほとんど調べられていなかった（抄録）。", "p3": "対象は2016〜2024年の546社・3,377冊の統合報告書である。LLMに従業員が写った写真を選ばせ、その写真が従業員の経験や活動への参加を語る記述に添えられているかを判定させた。従業員重視の度合いは、有価証券報告書の記述から測っている（抄録）。", "p4": "結果の指標は2つある。写真を使う広さと、該当する記述1ページあたりの写真の枚数である。この2つが従業員重視の度合いとどう動くかを見て、人的資本の記述の読みやすさで違いが出るかも調べた（抄録）。", "p5": "従業員重視の度合いが強い企業ほど、写真を広く使い、記述に添える枚数も多かった。枚数との関係は、人的資本の記述が読みやすい企業ほど強い。係数の大きさは抄録に書かれていない（抄録）。", "p6": "因果の向きは分からない。LLMの判定精度をどう確かめたかも抄録からは読めない。解釈：写真が職場の実態を映すのか、印象づくりなのかは、この対応関係だけでは区別できない。", "fun": "会社の報告書には、笑顔で働く社員の写真がよく載っています。あれは単なる飾りでしょうか。この研究は、「社員を大切にしている」と文章で強く書く会社ほど、社員の体験談に写真を多く添えていることを、AIに3,377冊分を仕分けさせて確かめました。言葉と写真という2つの語り方がそろっているかを測る発想が面白いところです。", "unverified": "LLMによる写真の判定精度と、回帰係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pr03", "rank": 3, "headline": "時空間有限要素で幾何学的に厳密な梁を解く", "title": "A space-time finite element formulation for geometrically exact shear-deformable beams", "url": "https://arxiv.org/abs/2610.03285", "authors": "Ivo Steinbrecher ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Steinbrecher, I., & Humer, A. (2026). A space-time finite element formulation for geometrically exact shear-deformable beams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03285", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXivのPDF本文（序論、時空間定式化、離散化と安定化、3つの数値例、結論）と図表を読んだ", "preprint": true, "p1": "幾何学的に厳密なせん断変形梁の過渡解析を、空間と時間を一体の有限要素で解く定式化を作った。曲がった梁や剛な接合を扱え、案内に引き込まれて長さが変わる梁のように、物質の領域が時間で変わる問題も定式化を変えずに解ける（arXivの未査読プレプリント）。", "p2": "梁は空間の座標が1つなので、時間を加えると2次元の「時空間の面」になり、普通の面要素で離散化できる。ただ既存の時空間法は物質の領域が固定の問題に限られ、移動する境界をもつ幾何学的に厳密な梁には使われていなかった（§1）。", "p3": "並進速度と角速度を独立な場として加える混合法で、時間の微分を1階までに下げた。回転は節点の回転ベクトルで表し、客観性を保つ補間を使う（§2–3）。時間を逆向きに伝わる非物理的な振動は、試験関数を時間の風上方向に富化する安定化（パラメータθ）で抑える（§3.3）。直観：全時間を1枚の面として一度に解くので、時間を刻んで順に進める必要がない。", "p4": "比べる相手は、同じ空間離散化の古典的な時間積分（一般化α法）である。四分円の片持ち梁で変位・エネルギー・収束次数を、剛体回転だけが違う初期配置で客観性を確かめた。自由浮遊のL形梁と、案内に引き込まれる梁（sliding spaghetti）で適用範囲を試した（§4）。", "p5": "片持ち梁の先端変位とエネルギーは、古典的な時間積分と非常によく一致した（図5・6）。一様な細分化で、1次の要素（ST-quad4）は2次の収束を示し、θにほぼよらなかった。2次の要素（ST-quad9）はθ≥0.01で3次の収束を回復し、誤差が最も小さかった（図7・8）。剛体回転した配置でも、逆変換すると先端変位が一致した（表1）。引き込まれる梁では、専用の手法（SBF）と先端の軌跡がよく一致した（図14）。", "p6": "θが小さいと、静止しているはずの時間帯に解が揺れるため、θの選び方が精度を左右する（§4.1.2、図9）。案内の中に入った梁の部分の動力学は直接扱えず、座標変換の導入が要ると著者は述べる（§4.3）。解釈：全時間を一度に解くため、長時間の解析での計算量と記憶容量の負担は本文では評価されていない。", "fun": "ふつうの振動の計算は、映画のフィルムを1コマずつ進めるように、時間を少しずつ刻んで解きます。この論文は、梁の動きの全時間を1枚の「時空間の布」とみなし、まとめて一度に解きました。そのおかげで、麺を吸い込むように長さが変わっていく梁も、特別な工夫なしに扱えます。時間を空間と同じように扱う発想が面白いところです。", "unverified": "計算時間と記憶容量の比較は本文に見当たらず未確認。L形梁の結果の一致の程度は図の読み取りにとどまる。"}}, {"id": "pr04", "rank": 4, "headline": "粗視化で時間の矢が生じる必要十分条件を証明", "title": "Sharp criterion for the coarse-grained arrow of time in Hamiltonian dynamics", "url": "https://doi.org/10.5281/zenodo.23135742", "authors": "Namba, Taishi", "venue": "Zenodo", "date": "2026-10-04", "apa": "Namba, T. (2026). Sharp criterion for the coarse-grained arrow of time in Hamiltonian dynamics (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.23135742", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（定理・証明、例の節、図1〜3、結論）を読んだ", "preprint": true, "p1": "ハミルトン系の分布をガウスの窓でぼかして見ると、乱雑さの指標（粗視化エントロピー）は増えることも減ることもある。どんな初期分布でも減らないための条件を、線形系では必要十分条件として証明した。非線形系でも、窓より広くない状態については証明している（Zenodoの未査読プレプリント）。", "p2": "ギブスのエントロピーはリウヴィル方程式の下で保存される。だから増大は粗視化、つまり観測の粗さに帰されてきた。ところが非線形の積分可能系では一時的に減ることも知られる。いつ増大が保証されるのかは未解決だった（§I）。", "p3": "著者はエントロピー生成率を2つの項に厳密に分けた。窓が広がる効果（フィッシャー情報行列F）と、流れの効果Σである（補題1）。線形流ż=Bzでは dS_C/dt=½tr(GF)、G=Ċ−BC−CBᵀ となる（定理3）。直観は競争である。窓が広がる速さが、流れが位相空間を引き伸ばす速さに勝てば分布はぼやけて乱雑さが増える。負ければ分布は鋭く見えて減る。", "p4": "主張はすべて定理として証明し、数値は公開コードで独立に確かめている。非線形系の検証には振り子（κ=1）と4次振動子を使い、ガウス混合の初期分布200個と敵対的な探索で予想を試した（§V）。", "p5": "等方的な窓では、条件はσ̇/σ≥κ（Bの対称部分の最大固有値）になる。窓を固定すると、線形流は全状態に時間の矢を与えない（系4・5、図1）。非線形流ではΣ≥−κ(d−σ²trF)が成り立ち、窓より広くない状態で基準が使える（定理6・系7）。振り子では予想の上限R≤1に対し、探索の最大値は0.908だった（σ=0.1、図2）。4次振動子ではq0=4でR=22.7となり、有限の速さでは保証できない（図3）。", "p6": "窓より広い状態で、σが非線形性の尺度と同程度の場合は予想のまま残る（§IV・VI）。窓はガウスに限られる。著者は証明の提案・検証やコード作成にAIを使い、すべて数値で確かめたと明記している（謝辞）。", "fun": "コップに落としたインクは広がって元に戻りません。ところが物理の基本法則は、時間を逆にしても成り立ちます。では「時間の矢」はどこから来るのでしょうか。この論文は、ぼんやりとしか見えない観測者の「ぼかしの窓」が、流れが分布を引き伸ばす速さより速く広がるときに限って、乱雑さが減らないことを数式で示しました。時間の向きは力学そのものではなく、観測者の見方から生まれるという結論が面白いところです。", "unverified": "予想1の一般の場合（窓より広い状態）は未証明。振り子と4次振動子以外の系での数値的な裏づけは未確認。"}}, {"id": "pr05", "rank": 5, "headline": "高次元フォッカー・プランク方程式を深層学習で解く", "title": "Energetic Variational Deep Learning for Solving High-Dimensional Stationary Fokker-Planck Equations", "url": "https://arxiv.org/abs/2610.03325", "authors": "Fanze Kong ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Kong, F., Qin, Z., & Xie, S. (2026). Energetic Variational Deep Learning for Solving High-Dimensional Stationary Fokker-Planck Equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03325", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（序論、定式化、3段階の学習法、6つの数値例、除去実験と雑音の検証、結論）と表1〜3を読んだ", "preprint": true, "p1": "高次元の定常フォッカー・プランク方程式の確率密度を、モンテカルロの粗いデータと、自由エネルギーの散逸構造から導いた変分の物理損失を組み合わせた3段階の学習で求めた。8次元までの6例で、比べた7手法のうち最も小さい誤差を示した（arXivの未査読プレプリント）。", "p2": "強形式の残差を最小化するPINNは、高階の微分を扱うため最適化が難しく、雑音のあるデータにも弱い。粗いポテンシャルや高次元では、学習点の数と計算量も問題になる（§1）。", "p3": "平衡定常状態の損失を、エネルギー変分法の自由エネルギーの散逸則から弱形式で導き、全質量で割って尺度に依存しない形にした。これでモンテカルロの損失と大きさがそろい、同時に最適化できる（§1–2）。学習は、モンテカルロのデータでの事前学習、物理損失とデータ損失の交互の最適化、L-BFGSによる仕上げの3段階で進む（§3、図1）。直観：モンテカルロが密度の大まかな形と大きさを教え、物理の損失が細部を法則に合わせる。", "p4": "例は、2次元の二重井戸、回転成分を含む粗い二重井戸、4次元の非平衡定常状態、4次元の粗い四重井戸、8次元の粗い単一井戸、2次元の正のフィードバック系の6つである。データだけ、強形式PINN、弱形式PINNと、それらにモンテカルロやL-BFGSを組み合わせた計7手法を、有効領域の平均絶対百分率誤差（MAPE）で比べた（§4）。", "p5": "提案法（弱形式＋MC＋L-BFGS）は6例すべてでMAPEが最小で、2次元の二重井戸で0.3452%、8次元の粗い単一井戸で1.2406%だった。強形式PINNは62.5901〜262.8252%と大きく外れた（表1）。段階ごとの比較では、弱形式とMCの組み合わせがデータだけより改善し、L-BFGSがさらに誤差を下げた（§4.7）。MCデータに雑音を加えても、弱形式は強形式より良かったとする（§4.8、表2・3）。", "p6": "対象は定常問題で、時間発展する問題への拡張は今後の課題と著者は述べる（§5）。非平衡定常状態は、各点の直交条件を満たす場合か、試験関数の族を使う場合に限られる。解釈：高次元の結果は断面だけで図示しており、全空間での誤差の分布は確かめにくい。雑音の分布の説明で、一様分布を正規分布と書く誤記がある（式4.19）。", "fun": "粒が揺らぎながら動く系では、最終的に「どこにどれだけの確率でいるか」という分布が落ち着きます。それを求める式がフォッカー・プランク方程式ですが、次元が高いと解くのが極めて大変です。この研究は、ばらつきのあるシミュレーションの結果で大まかな形をつかみ、細部を物理法則で整える二段構えで、8次元でも誤差を1.2406%に抑えました。粗い下書きと物理の清書の分業です。", "unverified": "学習にかかる時間と計算資源は本文で確認できていない。高次元の例の誤差の評価領域（断面か全領域か）は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "LLM審判と人間は『難しい評価』が一致しない", "title": "Evaluating LLM-as-a-Judge Beyond Score Alignment: A Psychometric Analysis of Residual Judging Difficulty", "url": "https://arxiv.org/abs/2610.02877", "authors": "Longwei Cong ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Cong, L., Hahn, S., Gombert, S., Camus, L., Zehner, F., Drachsler, H., & Kroehne, U. (2026). Evaluating LLM-as-a-Judge Beyond Score Alignment: A Psychometric Analysis of Residual Judging Difficulty (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02877", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（方法、3つの研究課題の結果、考察、限界の節）と表1・2・4を読んだ", "preprint": true, "p1": "要約の評価で、LLM審判が人間と「どの要約が良いか」はある程度合っても、「どの評価が難しいか」はほとんど合わないことを、心理測定のモデルで示した。人間には易しくLLMには難しい事例は、要約と原文の性質から部分的に予測できる（arXivの未査読プレプリント）。", "p2": "LLM審判の妥当性は、ふつう人間の点数との一致で確かめる。だが全体の一致の度合いだけでは、人間とLLMが同じ事例でつまずくのかは分からない（§1）。", "p3": "多相ラッシュモデル（MFRM）を人間とLLMの評定に別々に当てはめ、点数を要約の潜在的な質・評定者の厳しさ・評価次元の厳しさ・評定段階の閾値に分ける（§3.2、式1）。当てはめた後に期待値から外れる大きさの平均を「残差の難しさ」と定義し、両者でその構造が合うかを比べた（§3.3、式4）。直観：モデルで説明できる部分を取り除いた残りに、その事例特有の判断の難しさが表れる。", "p4": "データはSummEvalの1,600要約（100文書×16システム）で、人間8人（専門家3・クラウド5）と、0.8B〜14Bのオープンな17のLLMが、一貫性・首尾一貫性・流暢さ・関連性の4次元を1〜5点で評定した（§3.1）。良し悪しの基準は、潜在的な質と残差の難しさの相関、次元ごとの難しい割合の差、人間に易しくLLMに難しい事例の予測のAUROCである（§3.4）。", "p5": "潜在的な質の相関はr=0.372だったが、残差の難しさの相関は要約単位でr=0.283、要約×次元の単位でr=0.145にとどまった（§4.1、図1）。一貫性ではLLMに難しい単位が74.7%で人間の50.8%を大きく上回り、首尾一貫性では逆に人間が57.3%、LLMが34.8%だった（表2）。人間に易しくLLMに難しい事例は、全次元でAUROC 0.631、関連性で0.717で予測できた（表4）。", "p6": "著者は、単一のベンチマーク（要約の評価）と、固定したLLMの集団・1つのプロンプトの設定に限られる点を限界に挙げる。残差の難しさはモデル当てはめ後の診断の指標で、判断の難しさそのものの潜在概念ではないとも述べる（限界）。予測の分析は相関を示すだけで、仕組みの因果は示さない。", "fun": "AIに作文を採点させると、点数の付け方は人間とそこそこ合います。ところがこの研究で「どの作文の採点に迷うか」を比べると、人間とAIはほとんど一致しませんでした。人間は話の流れの判断に迷い、AIは事実が原文と合っているかの判断に迷うのです。点数が合っていても、迷う場所が違えば、任せ方を工夫する必要があります。", "unverified": "首尾一貫性など他の次元での予測のAUROCの値は表4の一部しか確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "多数派に従ったLLMも内部では元の答えを保持", "title": "Silent Dissent: LLM Agents That Yield to the Majority Still Represent Their Original Premise", "url": "https://arxiv.org/abs/2610.02702", "authors": "Ziang Ni ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Ni, Z., & Zou, P. (2026). Silent Dissent: LLM Agents That Yield to the Majority Still Represent Their Original Premise (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02702", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（方法、事前登録した仮説の結果、補遺、介入実験、考察と限界の節）と表1〜3・図2・3を読んだ", "preprint": true, "p1": "多エージェント討論で多数派に答えを合わせたLLMも、内部ではもとの考えの前提を保っていることを、内部表現の読み出しで示した。討論で「合意した」エージェントの数は、本当の合意を過大に見せうる（arXivの未査読プレプリント、事前登録あり）。", "p2": "討論ではエージェントが全員一致の多数派に折れやすい。そのとき考えを変えたのか、発言だけを変えたのかは、出力を見るだけでは区別できない（§1）。", "p3": "「サグラダ・ファミリアがある国の首都は」のような2段の事実の問いを使い、途中の答え（橋渡しの実体、この例では国）を誰も口にしない形にした。台本どおりの仲間が、別の事実から取った誤った答えを全員で主張する（アッシュの同調実験に倣う）。エージェントが答える瞬間の内部状態から、ヤコビアン・レンズとロジット・レンズで橋渡しの実体を読み出した（§3）。", "p4": "4つのオープンなモデルで、折れたエージェントがもとの橋渡しを保持しているか（H1）、仲間の答えの背後の橋渡しも表しているか（H2）、などを事前登録の仮説として検定した。指標は、対照の実体より上位100語に入る割合の差（hit@100）と、そのブートストラップ区間である（§3.3、表2）。", "p5": "3人の仲間が誤答を主張すると、折れた割合はQwen3.5-4Bで8%、Gemmaで25%、Qwen3.6-27Bで39%、Llamaで90%だった（表1）。折れたエージェントの読み出しは、ヤコビアン・レンズで0.85・0.22・0.24、同じ記録のロジット・レンズで0.06・0.00・0.05だった（Llamaは0.03で無視できる大きさ）（§4.2）。自分の前の答えを隠すと、Qwen3.5-4Bは8%ではなく89%で折れた（§6）。Qwenでは、もとの橋渡しの方向へ内部状態を押すと、もとの答えが戻った（図3）。", "p6": "著者は、条件間の比較が異なる問いの集合どうしである点、モデルが知っている事実（3〜9%）でしか試せない点、仲間が台本どおりで現実味に欠ける点を限界に挙げる。介入による因果の証拠はQwenの2モデルに限られ、探索的である（限界）。解釈：読み出しは「保持している」ことを示すが、それが本人の確信なのかは分からない。", "fun": "周りの全員が違う答えを言うと、人は自分の答えを引っ込めがちです。有名なアッシュの同調実験です。この研究はAIで同じことを試し、AIが多数派に合わせて答えを変えても、頭の中ではもとの考えの手がかりを持ち続けていることを示しました。口では賛成しても心では反対している「声なき反対」です。討論で全員が賛成したからといって、本当に合意したとは限りません。", "unverified": "自由討論での「声なき反対」の結果の詳細（Llama以外）は、折れた例が少なく未確認。"}}, {"id": "pr08", "rank": 8, "headline": "外れ値に強い軌道再構成で非線形系を同定", "title": "Robust Identification of Nonlinear S-System Dynamics from Contaminated Time-Series Data", "url": "https://doi.org/10.2139/ssrn.7560378", "authors": "Viviane Colucci Boromelo ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Colucci Boromelo, V., Borges de Carvalho, C., & Carvalho, E. (2026). Robust Identification of Nonlinear S-System Dynamics from Contaminated Time-Series Data. https://doi.org/10.2139/ssrn.7560378", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "外れ値の混じった時系列から、非線形な動力学系（S-system）を同定する話である。頑健さを最後のパラメータ推定ではなく、手前の軌道と微分の再構成に入れる。それだけでパラメータの誤差が大きく減ることを示した（未査読）。", "p2": "状態の微分を数値で置き換えると、微分方程式の同定は代数的な最小二乗問題になる。ただし微分は観測の汚れを増幅して下流へ流す。上流で入った歪みが、そのままパラメータ推定を損なっていた（抄録）。", "p3": "再構成にはBスプラインと低次値最適化（LOVO、残差の小さい観測だけで目的関数を作る手法）を使う。残す観測を固定すると、問題は線形の刈り込み最小二乗になる。その集中ステップが目的関数を単調に減らし、有限回で不動点に止まることを証明した。再構成した軌道は、方程式ごとに分けて解ける階層的LOVOに渡す。刈り込みの度合いは、軌道空間での頑健な当てはめ（RAFF）の投票で選ぶ（抄録）。", "p4": "比較対象はレーベンバーグ・マーカート法の最小二乗と、そのHuber版・Cauchy版・RANSAC版である。3つのベンチマークのS-systemと20遺伝子のネットワークを使い、4種類の汚染シナリオ×30回の実現値で、パラメータ誤差の中央値と動力学次数の符号の回復率を比べた（抄録）。", "p5": "提案法はパラメータ誤差の中央値を従来法の3〜8分の1に減らした（p<0.001）。汚染したベンチマークでは、有効な動力学次数の符号をすべて回復している。従来法は54〜78%だった。段階を対にして比べると、改善の大部分は刈り込みではなく再構成によるという（抄録）。", "p6": "汚染の種類と割合、計算時間、実データでの検証は抄録からは分からない。対象は生物系のS-systemであり、他の非線形系への一般化は著者の示唆にとどまる。", "fun": "ぶれたデータから「変化の速さ」を計算すると、ノイズは何倍にも膨らみます。この研究は、外れ値に強い工夫を、最後の当てはめではなく、最初に軌道をなめらかに描き直す段階へ移すべきだと示しました。料理にたとえれば、味付けで失敗をごまかすより、下ごしらえで傷んだ材料を取り除く方が効く、ということです。誤差の中央値が3〜8分の1になったのは、その順番の違いだけによります。", "unverified": "汚染の割合と種類、計算時間、実データでの性能は未確認（本文を入手できず）。"}}, {"id": "pr09", "rank": 9, "headline": "規制当局の照会状がAIウォッシングを抑える", "title": "Being Watched or Being Verified? Regulatory Inquiry Letters and Corporate AI Washing", "url": "https://doi.org/10.2139/ssrn.7560587", "authors": "Chuanqi Ling ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Ling, C., & Dong, D. (2026). Being Watched or Being Verified? Regulatory Inquiry Letters and Corporate AI Washing. https://doi.org/10.2139/ssrn.7560587", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "中国のA株上場企業で、取引所から照会状（開示内容への質問状）を受けた企業ほど、実態以上にAIを語る「AIウォッシング」が減る。減り方の中身は、主にAI関連の開示そのものの減少だった（未査読）。", "p2": "背景：AIへの注目が集まるほど、取り組みを誇張して開示する動機が生まれる。外部からの監視がその誇張を抑えられるのかが問いである（抄録）。", "p3": "2015〜2024年の中国A株上場企業のパネルデータを使う。照会状の受領とAIウォッシングの度合いの関係を推定し、仕組みとして上方への利益調整と経営者のトーン操作を検証した。AIウォッシングの測り方は抄録に書かれていない（抄録）。", "p4": "効果の出方は5つの条件で分けて比べる。照会状の詳しさ、企業の回答の量、仲介機関の専門的意見が求められたか、財務困窮、地域の法制度の強さである（抄録）。", "p5": "照会状を受けた企業はAIウォッシングが有意に低い。主な経路はAI関連の開示の減少だった。照会は上方の利益調整とトーン操作も減らす。効果は、照会状が詳しいほど、回答が多いほど、仲介機関の意見が求められるほど強い。財務困窮企業と、法制度の強い地域でも強かった（抄録）。", "p6": "照会状を受けるかどうかが企業の特性と無関係に決まるのか（内生性への対処）は抄録からは分からない。AIウォッシングの指標の妥当性も確かめられない。解釈：開示が減ったことを誇張の抑制と読むか、正当な情報まで減る萎縮と読むかは、まだ区別できない。", "fun": "「AIを活用しています」と実態以上にアピールする企業が増えています。この研究は、取引所から「本当ですか」と質問状が届くと、その誇張が減ることを示しました。しかも、質問が具体的なほど、答えを多く求められるほど、第三者の確認が入るほど効きます。テストで「途中式も書きなさい」と言われるとごまかしにくくなるのと同じで、見られること自体より、確かめられることが効くわけです。", "unverified": "AIウォッシングの測定方法と、内生性への対処（識別戦略）は未確認（本文を入手できず）。"}}, {"id": "pr10", "rank": 10, "headline": "実橋のひずみ計測で異常検知の2手法を比較", "title": "Smart Sensing for Safer Bridges: From Sensor Signals to AI-Driven Anomaly Detection", "url": "https://arxiv.org/abs/2610.03082", "authors": "Rahul Jaiswal ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Jaiswal, R., Hellum, J., & Heiberg, H. (2026). Smart Sensing for Safer Bridges: From Sensor Signals to AI-Driven Anomaly Detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03082", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（提案の流れ、データ、性能・時間の一致・注入実験の結果、結論）と表II〜IVを読んだ", "preprint": true, "p1": "ノルウェーの実橋に付けたセンサのひずみデータで、信号処理と孤立森（Isolation Forest）による異常検知を比べた。2つは見つける異常がかなり異なり、互いに補い合う性質をもつことを示した（arXivの未査読プレプリント）。", "p2": "橋の監視では、センサの異常な挙動が構造の異常の早い兆候になりうる。ただ実橋のデータには正解のラベルがなく、手法の良し悪しを測りにくい（§I、§V-C）。", "p3": "データを補間で整えたあと、閾値に基づく信号処理と、木を使って外れやすい点を見つける孤立森の2つで異常を検出した。検出の数・時刻・大きさ・計算の速さを比べ、図に描いて解釈を助ける流れである（§III、図4）。直観：孤立森は、少ない分割で切り離せる点ほど「珍しい」と判断する。", "p4": "データは2026年6月10〜20日の11日間、橋の鋼桁3か所（ADC1〜3）で5Hzで測ったひずみで、計3,774,011点である（§IV-B）。正解がないため、検出数・計算時間・処理速度・異常率、2手法の時刻の一致、人工的に異常を注入したときの検出率（再現率）で評価した（§V-C、§V-F）。", "p5": "信号処理はADC1〜3で349・14・1件、孤立森は3579・29・11件を検出した（表II）。信号処理は0.0546〜0.1926秒で終わり、孤立森は14.52〜31.79秒かかった。時刻が一致した異常はADC1で100件で、信号処理の検出の28.65%、孤立森の2.79%にとどまった（表III）。18件の注入異常の再現率は、信号処理が0.00%・33.33%・5.56%、孤立森が0.00%・100.00%・72.22%だった（表IV）。", "p6": "注入した異常は合成で実際の橋の異常とは限らず、感度の確認にすぎないと著者は断る（§V-F）。対象は1橋・11日で、複数の橋やセンサへの拡張は今後の課題とする（§VI）。解釈：検出された異常が構造の変化か、センサや通信の不具合かの区別はされておらず、維持管理の判断に使うには現地の点検との照合が要る。", "fun": "橋に付けたセンサは、毎秒何回も橋のひずみを記録します。その中から「いつもと違う」瞬間を見つけたいのですが、どれが本当の異常かという答えはありません。この研究は、単純なしきい値の方法とAIの方法で探し、2つが見つける異常がかなり違うことを示しました。答えのない問題では、見張り役を複数置くことに意味があるのです。", "unverified": "検出された異常の物理的な原因は検証されていない。孤立森のパラメータの感度は表Iの設定以外は未確認。"}}, {"id": "pr11", "rank": 11, "headline": "年次報告書のAIリスク開示が5年で急増", "title": "The AI Risk Observatory: What Can We Learn from AI Disclosures in Annual Reports About Societal Resilience?", "url": "https://arxiv.org/abs/2610.02281", "authors": "Bart Jaworski", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Jaworski, B. (2026). The AI Risk Observatory: What Can We Learn from AI Disclosures in Annual Reports About Societal Resilience? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02281", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（データと方法、検証、6つの結果、考察と限界の節）と表2・4、図1・6を読んだ", "preprint": true, "p1": "英国の上場企業1,362社の年次報告書9,821冊をLLMで分類し、AIのリスクに触れた報告書が2020年の2.8%から2025年の41.2%へ急増した一方、中身のある開示は2025年でも4.3%にとどまることを示した（arXivの未査読プレプリント）。", "p2": "社会の強靱さの研究には、使える実データが要る。年次報告書をLLMで大規模に処理すれば、企業がAIへの対応をどう開示しているかの信号になるのかが問いである（§1）。", "p3": "AIの語で段落を絞り込んだうえで、2段階で分類する。第1段階でAIの言及を、導入・リスク・取引先・被害・一般的のどれかに分ける。第2段階で、リスクを10の区分に当てはめ、AIとの結びつきの明示度（1〜3）と、仕組みや対策まで書いた「中身のある」開示かを判定した（§3.3）。直観：「AIはリスクです」と書くことと、何がどう危ないかを書くことを分けて数える。", "p4": "検証は、30冊の報告書から人が付けた474か所との比較で、第1段階のラベルの一致（Jaccard類似度）0.73、再現率0.91〜0.97だった（§3.4、表2）。結果は、年ごとの開示率、リスクの区分、名指しされたAIの取引先、重要インフラの業種と市場区分による違い、中身のある開示の割合で示した（§4）。", "p5": "AIリスクに触れた報告書は2.8%から41.2%へ、AI導入の開示は13.8%から45.2%へ増えた（抄録、図1）。2025年にリスクに触れた643冊のうち、中身があると判定されたのは67冊（10.4%）で、全体の4.3%だった（表4）。メイン市場の57.8%に対してAIMは6.4%と大きな差があった。AIによる実際の被害の開示は、全期間で7冊にしか現れなかった（§4.4・4.5）。", "p6": "著者は、開示は実際のリスクへの曝露ではない点を最大の制約に挙げる。AIの語による絞り込みは遠回しの表現を取りこぼし、検証は1人の注釈者による大企業の2023〜2024年の報告書に限られる。中身の判定は近似的な指標である（§5.3）。解釈：開示の急増が規制や投資家の圧力への対応なのか、実際の取り組みの増加なのかは、この方法では区別できない。", "fun": "会社の年次報告書に「AIのリスク」が書かれるようになったのは、ここ数年のことです。この研究はAIに9,821冊の報告書を読ませ、その割合が2020年の2.8%から2025年の41.2%に増えたことを示しました。ところが、何がどう危ないのか具体的に書いている報告書は、2025年でも全体の4.3%でした。流行の言葉を書くことと、本当に向き合うことは別なのです。", "unverified": "重要インフラの業種ごとの開示率の詳細な数値は表6の一部しか確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "SPH-ALEの砂時計モードを抑え引張解析を収束", "title": "Hourglass control for solid SPH-ALE: Stability and convergence under tensile loading", "url": "https://doi.org/10.2139/ssrn.7560377", "authors": "Georg Ganzenmüller", "venue": "SSRN", "date": "2026-10-04", "apa": "Ganzenmüller, G. (2026). Hourglass control for solid SPH-ALE: Stability and convergence under tensile loading. https://doi.org/10.2139/ssrn.7560377", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "強い引張を受ける固体の粒子法（更新ラグランジュ型SPH-ALE）では、2つの数値破綻が起きる。粒子が対になって寄る引張不安定と、力を受けずに変形する砂時計（ゼロエネルギー）モードである。この2つを同時に抑え、有限要素の参照解に収束させた（未査読）。", "p2": "引張不安定は粒子移動法（PST）で除ける。だが節点積分した速度勾配の零空間で起きる変形には効かない。既存の砂時計制御は参照配置からの位置のずれを測る。そこにPSTによる非物質的な移動量まで入り込み、偽の復元力や塑性流れの硬化を生んでいた（抄録）。", "p3": "提案は減衰の入れ方にある。粒子間の相対速度から、一様な変形では説明できない非アフィン成分を取り出し、中心線に射影した向きに減衰をかける。既存の速度勾配から計算でき、参照配置も累積移動量もいらない。物体内部の線形な速度場と剛体回転は変えず、線運動量も保存する。サブステップで積分するため、音速による時間刻みの制限も受けない（抄録）。", "p4": "検証はジョンソン・クック粘塑性の軸対称引張試験である。見るのは3つ。非物理的な荷重低下と早すぎる破断を防げるか、4つの解像度で荷重・変位曲線が収束するか、独立に格子収束させた有限要素解とどれだけ違うかである（抄録）。", "p5": "PSTと砂時計減衰を組み合わせると、非物理的な荷重低下も早期破断も起きなかった。荷重・変位曲線は4解像度で単調に収束し、細かい3つでの観測次数は1.4〜1.7である。外挿した極限は有限要素解と、最大荷重で1.2%以内、塑性の初期の枝で3.2%以内で一致した（抄録）。", "p6": "破断が進んだ後の挙動、3次元問題、他の構成則への適用は抄録からは分からない。解釈：検証は軸対称の引張1例にとどまる。接触や破砕を伴う問題での性能は、別に確かめる必要がある。", "fun": "粒子の集まりで物体を表す計算法は、ちぎれたり砕けたりする現象に強いという長所があります。ところが引っ張ると、粒子が勝手に寄り集まったり、力を受けていないのにぐにゃぐにゃ動く「ずる」が出たりします。この論文は、粒子同士の動きのうち、全体の素直な変形からはみ出した分だけにブレーキをかけました。昔の位置を覚えておく必要がない点が、工夫の要です。", "unverified": "解像度ごとの粒子数と計算時間、破断後の挙動は未確認（本文を入手できず）。"}}, {"id": "pr13", "rank": 13, "headline": "外れ値に強い多ブロックPCAでEUの幸福を測る", "title": "Cellwise, Blockwise, and Casewise Robust Multiblock PCA for Sustainable and Inclusive Wellbeing in the EU", "url": "https://arxiv.org/abs/2610.03181", "authors": "Arthur Daisomont ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Daisomont, A., Centofanti, F., & Hubert, M. (2026). Cellwise, Blockwise, and Casewise Robust Multiblock PCA for Sustainable and Inclusive Wellbeing in the EU (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03181", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（データ、手法、シミュレーション、実証の結果、結論）と表1・2を読んだ", "preprint": true, "p1": "テーマ群に分かれた多数の指標を、外れ値と欠測に頑健に要約する多ブロック主成分分析（bloccPCA）を作り、EU27か国の「持続可能で包摂的な幸福」の指標に適用した。外れ値が観測全体・テーマ群・個々の指標のどの水準で生じているかも診断できる（arXivの未査読プレプリント）。", "p2": "EUはGDPを超える幸福の指標群を整備しているが、データは高次元で欠測があり、観測全体、特定のテーマ群、個々の指標のどこにでも異常が混じりうる。従来の頑健なPCAは、テーマ群（ブロック）単位の外れ値を扱えなかった（§1–2）。", "p3": "重みつき合意PCAを土台に、個々のセル・ブロック・観測全体のずれに別々の頑健な重みをかける目的関数を最小化する（§3.3）。セルの汚れが小さくても、それがブロックのずれを押し上げれば、ブロックの重みが下がって影響が二重に弱まる（§4）。直観：家計簿のある月だけ、ある費目だけ、ある1件だけがおかしい場合を、別々に見分けて割り引く。", "p4": "シミュレーションでは、セル・ブロック・観測全体の汚れとその組み合わせの6通りで、主成分の向きの推定誤差（真の部分空間との角度）を、既存の3手法（CPCA-W、MacroPCA、cellPCA）と比べた（§4）。実証では、27か国の2010〜2022年、7つのテーマ群の104指標を使った（§2）。", "p5": "汚れのないデータでは全手法がほぼ同等だったが、ブロックの外れ値があるとbloccPCAが大きく上回り、外れ値の影響をほとんど受けなかった（§4、図2）。セルの外れ値だけでもcellPCAより良く、観測全体の外れ値では同程度だった。実証では最初の3主成分で変動の66%を説明し、第1主成分は制度の質と経済（GDPの寄与25）、第2主成分は主に包摂性で決まった（§5.1、表2）。", "p6": "著者は、頑健な多ブロック回帰や分類への拡張を今後の課題とする（§6）。解釈：外れ値と判定された国・年が、統計の誤りなのか、本当に特異な出来事なのかは、診断の後に人が判断する必要がある。指標の選び方（140から104へ絞った基準）が結果を左右しうる点も残る。", "fun": "国の豊かさをGDPだけで測るのは不十分だとして、EUは健康や自然や公正さなど100を超える指標を集めています。でも、ある国のある年だけ数字がおかしい、ある分野だけデータが変、ということがよくあります。この研究は、そうした「おかしさ」が国全体か、分野か、1つの数字かを見分けながら、全体像を要約する方法を作りました。", "unverified": "国ごとの外れ値の診断結果（ポルトガルなどの事例）の詳細は図の読み取りにとどまる。"}}, {"id": "pr14", "rank": 14, "headline": "信頼性の低い尺度が生む誤分類を定量化", "title": "Psychometric Tests: Quantifying the Consequences of Low Reliability and Improving Reliability Estimation", "url": "https://arxiv.org/abs/2610.03006", "authors": "Rose Baker", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Baker, R. (2026). Psychometric Tests: Quantifying the Consequences of Low Reliability and Improving Reliability Estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03006", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（費用の尺度、信頼性の推定と修正α、尤度による推論、シミュレーションと実データ、結論）と図1・表1を読んだ", "preprint": true, "p1": "多項目の心理尺度で信頼性が足りないと、極端な層の人をどれだけ見誤るかを「費用」として定量化した。あわせて、モデルを当てはめずに計算できてマクドナルドのωにほぼ一致する、修正版のクロンバックのαを導いた（arXivの未査読プレプリント）。", "p2": "信頼性は0.7以上などの経験則で語られがちだが、低い信頼性が分類や判断にどんな結果をもたらすかは、直観的な形で示されてこなかった。ωの推定と信頼区間の作り方も、小標本では計算が重い（§1）。", "p3": "共通因子モデルのもとで、真の得点が上位p%に入る人を、観測した得点でも上位p%と判定できる確率Pを導いた（§2.2.1、式2）。Pは「上位p%にいる」という検定の検出力に当たる。さらに、共分散の二乗和からモーメント法で因子負荷のばらつきを推定し、データの当てはめなしでωに近づく修正αを作った（§3.2）。直観：信頼性が下がると、目盛りのぶれが真の差を覆い隠し、上位の判定がくじ引きに近づく。", "p4": "費用の尺度は、上位・下位の正しい判定の割合、2人のうち優れた方を正しく選ぶ確率、誤分類の全体の費用などである（§2.2）。推定法は、1万回のシミュレーションで偏りと標準誤差を確かめ、実データの尺度でクロンバックのα・修正α・ωを比べた（§5、表1・3）。", "p5": "信頼性Rが1なら上位の判定は完全で、0に近づくと偶然と同じp%になる（図1）。検出力0.8を求めるなら、上位の人を見分けるには信頼性が少なくとも0.9要る（§2.2.1）。結論では、分類の目的には0.7を超える信頼性がしばしば必要とする（§6）。最尤推定の偏りは標準誤差よりずっと小さく、修正αは正しい値に近く、ωと同程度の標準誤差だった（§5.1）。実データでは、項目が少し多いと1因子モデルは当てはまらず、2因子が要った（§5.2）。", "p6": "著者は、項目反応理論で信頼性が真の得点の関数になる場合への拡張を今後の課題とする（§6）。解釈：費用の計算は共通因子モデルと正規分布を仮定しており、得点の分布が偏る尺度での当てはまりは確かめられていない。0.9と0.7という2つの目安の関係も、目的に応じて読み分ける必要がある。", "fun": "テストの「信頼性」は0.7あれば十分、とよく言われます。でもこの論文の計算では、成績上位5%の人を確実に見分けたいなら、信頼性は0.9くらい必要でした。目盛りがぶれる体重計で、クラスで一番重い人を当てるのは難しいのと同じです。どのくらいの信頼性が要るかは、尺度を何に使うかで決まるのです。", "unverified": "実データの各尺度の信頼性の数値（表3）は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "希少疾患児の親の遺伝的罪悪感を測る尺度", "title": "Neurogenetic Stigmatization and Bio-Sociological Burden in Parents of Children with Rare and Genetic Diseases: Development and Validation of the Genetic Guilt and Psychosocial Burden Scale (GGPBS)", "url": "https://doi.org/10.21203/rs.3.rs-10927774/v1", "authors": "Gülçin ITIRLI ASLAN ほか", "venue": "Research Square (In Review)", "date": "2026-10-04", "apa": "ASLAN, G. I., & YILDIRIMER, K. Ş. (2026). Neurogenetic Stigmatization and Bio-Sociological Burden in Parents of Children with Rare and Genetic Diseases: Development and Validation of the Genetic Guilt and Psychosocial Burden Scale (GGPBS). https://doi.org/10.21203/rs.3.rs-10927774/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（方法・結果・限界の節と本文中の数値）を読んだ。表は崩れた形式で取得", "preprint": true, "p1": "希少疾患・遺伝性疾患の子をもつ親の心理社会的負担を、点数で測れるようにした研究である。保因者としての罪悪感や社会的スティグマを、55項目・5因子の尺度（GGPBS）にまとめた。トルコの親を対象に、作成から検証まで3段階で進めている（未査読プレプリント）。", "p2": "この負担は、質的研究では繰り返し記述されてきた。保因者としての罪悪感、社会的スティグマ、二次的外傷である。しかし量的に測る、検証済みの道具がなかった（序論・§1.1）。", "p3": "第1段階では、文献と親15人への面接、専門家8人の検討から68項目を作り、内容妥当性指数で55項目に絞った。第2段階では親247人に探索的因子分析（主因子法・プロマックス回転）を行う。第3段階では別の親312人に確認的因子分析（最尤法）を行い、68人で4週間後の再検査信頼性を測った（§2.1・3.1）。", "p4": "良さの基準は5つある。因子構造の適合（CFI・TLI・RMSEA・SRMR。著者の良好基準はCFI・TLI>0.95など）、内的一貫性（α）、再検査の相関、育児ストレス尺度（PSI-SF）やうつ尺度（BDI-II）との収束的妥当性、血族婚の有無による差である（§2.5）。", "p5": "5因子で分散の67.42%を説明した。確認的因子分析はχ²/df=2.34、CFI=0.95、TLI=0.94、RMSEA=0.06、SRMR=0.05である（§3.2・3.3）。全体のαは0.96、再検査はr=0.89だった。PSI-SFとはr=0.74、BDI-IIとはr=0.68の相関を示す（§3.4・3.5）。血族婚の群は負担が高く（全体でd=0.78）、遺伝カウンセリングの受診は負担の低さと結びついた（r=−0.28）（§3.7・3.8）。", "p6": "著者は4つの限界を挙げる。1つの臨床の場からの標本、横断デザイン、トルコ語のみ、自己申告である（§4.5）。解釈：TLIは著者自身の良好基準をわずかに下回る。倫理承認の日付（2025年1月）がデータ収集期間（2024年1〜7月）より後に記載されている点も、確認が要る。", "fun": "生まれつきの病気をもつ子の親は、「自分の遺伝子のせいでは」という思いや周囲の目に苦しむことがあります。目に見えにくい負担です。この研究は、それを5つの側面に分けて点数で測る質問票を作りました。いとこ同士などの血族婚の家庭では負担が大きく、遺伝カウンセリングを受けた親ほど負担が軽い。支援をどこに向けるかの手がかりになる結果です。", "unverified": "表1の各項目の因子負荷量は、表の形式が崩れていて確認しきれていない。倫理承認の日付の食い違いの理由は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "執行の弱い国ほどMFIの利益調整は少ない", "title": "Does the legal enforcement environment constrain earnings management in social enterprises? Evidence from microfinance institutions", "url": "https://econpapers.repec.org/RePEc:ulb:ulbeco:2013/413359", "authors": "Hubert Tchakoute Tchuigoua", "venue": "RePEc NEP", "date": "2026-09-28", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "マイクロファイナンス機関（MFI）では、法の執行が弱い国ほど財務報告の質が高く、利益調整が少ない。直観に反するこの関係を、世界のMFIの15年分の財務諸表で示した（未査読）。", "p3": "2003〜2017年の世界のMFIの財務諸表を使った。異常な貸倒引当金の繰入を利益調整の代理指標とし、法執行の強さとの関係を推定している（抄録）。", "p5": "法執行が弱い環境ほど報告の質は高かった。執行が弱いと投資家が会計情報に頼らないため、利益調整の動機が弱まると著者は解釈する。弱い執行環境では、営利のMFIと補助金への依存が小さいMFIほど上方への利益調整が少なかった（抄録）。", "fun": "「取り締まりが厳しいほど会計のごまかしは減る」と考えるのが普通です。ところが途上国の小口金融を調べると、取り締まりが弱い国の方がごまかしは少なかったのです。誰も決算書を当てにしないなら、数字を飾る意味もありません。会計の数字は、見る人がいて初めて飾られるという逆説です。", "unverified": "標本のMFI数と国数、推定の係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pr17", "rank": 17, "headline": "国有企業は販管費の下方硬直性が強い", "title": "State Ownership and Cost Stickiness: Evidence from Indonesian Firms", "url": "https://doi.org/10.2139/ssrn.7557005", "authors": "Pablo Vivaldi Carensa ほか", "venue": "SSRN", "date": "2026-10-03", "apa": "Carensa, P. V., & Clarkson, P. (2026). State Ownership and Cost Stickiness: Evidence from Indonesian Firms. https://doi.org/10.2139/ssrn.7557005", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "インドネシアの国有企業は、民間企業より販管費の「粘着性」が強い。売上が伸びると費用を大きく増やし、落ちても削りにくい（未査読）。", "p3": "2015〜2024年の1,049社・5,152社年のパネルで、売上の増減に対する販管費の変化の非対称性を推定した。国有企業と民間企業、COVID-19期とそれ以外の時期を比べている（抄録）。", "p5": "全体の粘着性は先行研究と同程度だった。国有企業の粘着性は有意に大きく、全期間で続いた。売上増加期に費用を大きく増やす上方の非対称は、COVID-19期に限られた（抄録）。", "fun": "会社は売上が減れば経費を削るはずです。ところが実際には、増やすときほど素早くは減らせません。経費には粘りがあるのです。この研究は、インドネシアの国有企業でその粘りが民間より強く、しかもコロナ禍に限らずどの時期でも続いていたことを示しました。持ち主が国か民間かで、経費の動き方まで変わるわけです。", "unverified": "推定モデルの係数の大きさと国有企業の定義は未確認（本文を入手できず）。"}}, {"id": "pr18", "rank": 18, "headline": "1回の加振で梁の粘弾性の周波数依存性を推定", "title": "Estimation of frequency dispersion of viscoelasticity over a wide frequency range using the center impedance method- Noise reduction by eliminating vibration modes other than symmetric bending and proposal of a simplified viscoelastic model -", "url": "https://doi.org/10.2139/ssrn.7560530", "authors": "Ryuzo Horiguchi ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Horiguchi, R., Oda, Y., Kamio, C., & Yamaguchi, T. (2026). Estimation of frequency dispersion of viscoelasticity over a wide frequency range using the center impedance method- Noise reduction by eliminating vibration modes other than symmetric bending and proposal of a simplified viscoelastic model -. https://doi.org/10.2139/ssrn.7560530", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "薄い梁の中央を加振する1回の室温測定から、貯蔵弾性率と損失係数の周波数依存性を広い帯域で推定した。その変わり方を周波数の陽な関数で表す簡易モデルも示している（未査読）。", "p3": "半値幅法を使わず、運動方程式の解析解から導いた周波数応答関数を、複素波数と粘弾性の関係を介して逆解析した。ノイズは曲線の当てはめで除き、FEMで見つけたねじれ・非対称曲げモードの近くは除外した（抄録）。", "p5": "簡易モデルでは、貯蔵弾性率は周波数帯のほとんどで一定だった。損失係数と周波数の関係はガンマ分布の確率密度に比例し、形状パラメータp=2のとき衝撃応答の振動が最も速く減衰した（抄録）。", "fun": "物の「揺れの止まりやすさ」は、ふつう揺れのピークの形から1つずつ測ります。この研究は、梁の真ん中を揺らしたときの応答を式で逆にたどり、1回の測定で幅広い周波数の硬さと減衰をまとめて求めました。しかも減衰の変わり方が、確率で習うガンマ分布と同じ形で書けるというのが意外なところです。", "unverified": "対象材料、周波数範囲、他の測定法との比較による精度の検証は未確認（本文を入手できず）。"}}, {"id": "pr19", "rank": 19, "headline": "老朽化した大型ダンプは固有振動数が下がる", "title": "Vibration characteristics of Aging Haul Trucks using Modified Operational Transfer Path Analysis", "url": "https://doi.org/10.2139/ssrn.7560249", "authors": "Dhany Arifianto ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Arifianto, D., Rahman, I. A., Najib, A. A., & Taufan, I. (2026). Vibration characteristics of Aging Haul Trucks using Modified Operational Transfer Path Analysis. https://doi.org/10.2139/ssrn.7560249", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "稼働時間の違う大型ダンプトラック（コマツHD-785）で、古い車両ほど固有振動数が下がり、エンジンから運転席へ伝わる振動が大きくなることを示した（未査読）。", "p3": "稼働5,000・10,000・30,000時間の3台を、650rpmと1,600rpmで測った。固有振動数と周波数応答関数を3通りの方法で求め、運転時の加速度と掛け合わせて伝達経路解析の力を計算した（抄録）。", "p5": "3つの方法はいずれも最初の5つの固有振動数を推定できた。経年で固有振動数は低い側へずれた。アイドリング時の運転席への伝達率は、新しい・中程度の車両で45%未満、古い車両で55%超だった（抄録）。", "fun": "同じ型のダンプでも、長く使うと揺れ方が変わります。この研究は新しい車、中くらいの車、古い車を比べました。使い込むほど車体の「揺れやすい周波数」は下がり、エンジンの揺れが運転席へ伝わる割合は45%未満から55%超へ上がりました。揺れ方の変化そのものを、点検時期の目安に使おうという発想です。", "unverified": "各稼働時間の車両の台数と、個体差の扱いは未確認（本文を入手できず）。"}}, {"id": "pr20", "rank": 20, "headline": "アンサンブルカルマンで気泡モデルの係数を較正", "title": "Ensemble Kalman filter calibration of Eulerian–Lagrangian cavitation models: Enhanced mesoscale bubble statistics with preserved macroscale dynamics", "url": "https://doi.org/10.2139/ssrn.7560615", "authors": "Beichen Tian ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Tian, B., Wang, Y., Wang, Y., & Huang, B. (2026). Ensemble Kalman filter calibration of Eulerian–Lagrangian cavitation models: Enhanced mesoscale bubble statistics with preserved macroscale dynamics. https://doi.org/10.2139/ssrn.7560615", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "キャビテーション流れの連成モデルで、気泡の発生・成長・凝縮と記述の切り替えを決める4つの経験係数を、測った気泡径分布のデータ同化で較正した（未査読）。", "p3": "NACA66翼まわりの流れで、ラテン超方格抽出による30組の事前アンサンブルを作った。デジタルインラインホログラフィーで測った気泡径分布を、アンサンブルカルマンフィルタで逐次同化した（抄録）。", "p5": "最適な係数は核生成圧力係数1.4、成長係数0.0075、凝縮係数0.0031、切り替えの臨界蒸気体積率0.65だった。全変動距離は1.215から0.1351へ下がり、決定係数は0.2112から0.9925へ上がった。別のキャビテーション数でも実験とよく一致した（抄録）。", "fun": "船のスクリューの周りでは水の圧力が下がり、泡が生まれます。その泡がつぶれる衝撃は、金属を削るほど強いものです。泡のでき方を決める係数は理論だけでは決まりません。この研究は、実際に撮った泡の大きさの分布と照らし合わせ、天気予報と同じデータ同化の手法で係数を直しました。合わせた係数が、別の条件でもそのまま通用したのが成果です。", "unverified": "係数の不確かさ（事後分布の幅）と計算コストは未確認（本文を入手できず）。"}}, {"id": "pr21", "rank": 21, "headline": "数値のメッセージがLLMどうしの協力を変える", "title": "When Numbers Start Talking: Numerical Signalling and Strategic Behaviour Among LLMs", "url": "https://arxiv.org/abs/2610.03033", "authors": "Alessio Buscemi ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Buscemi, A., Proverbio, D., Di Stefano, A., Han, T. A., Castignani, G., & Liò, P. (2026). When Numbers Start Talking: Numerical Signalling and Strategic Behaviour Among LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03033", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "4つのLLMのエージェントに協力ゲームを遊ばせると、交わすメッセージの種類で結果が変わる。ただし、その変わり方は予測できなかった（未査読）。", "p3": "協力均衡の異なる4つのゲームで、自然言語・数値の信号・無作為な列のメッセージを交換させ、協力の水準と利得を比べた。エージェントに割り当てた性格による違いも見ている（抄録）。", "p5": "構造化されたメッセージは、ほとんどのゲームとLLMで最終的な利得を変えたが、決まった傾向はなかった。エージェントが作る数値の信号は無作為からずれ、通信を指示したときにとくに強い。その記号の分布は利得の構造と結びつき、繰り返すほど集中するが、人間には解釈しにくい（抄録）。", "fun": "AI同士に数字だけで「会話」させると何が起きるでしょうか。この研究では、AIは無作為ではない数字の並びを使い始め、繰り返すうちにその使い方が固まっていきました。ところが、その意味は人間には読み取れません。AIが人間に見えない合図で協調しうるという点で、監視の難しさを示す結果です。", "unverified": "ゲームごとの協力率の数値と、性格の割り当ての効果の大きさは未確認（本文を入手できず）。"}}, {"id": "pr22", "rank": 22, "headline": "ユーザーの模擬を実際の失敗の傾向に較正する", "title": "CUEing User Simulators: Calibrated User Embeddings for Multi-Turn Benchmarking", "url": "https://arxiv.org/abs/2610.02460", "authors": "Anjali Kantharuban ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Kantharuban, A., & Mueller, J. (2026). CUEing User Simulators: Calibrated User Embeddings for Multi-Turn Benchmarking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02460", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "AIエージェントの評価に使う模擬ユーザーを、実際の利用者の成功率と失敗の型に合うよう較正する枠組み（CUE）を提案した。学習なしでLLMを模擬ユーザーとして動かせる（未査読）。", "p3": "過去の対話を連続的な表現に符号化し、そこから標本を引いてペルソナの指示に復号する。過去の対話をユーザー条件つきで再現する評価と、新しいペルソナを引いたときの集計指標の一致を調べた（抄録）。", "p5": "τ²-Benchで、CUEで動かした模擬ユーザーは模擬側の誤りが少なかった。実際の利用者で起きるエージェントの失敗の型、全体の成功率、課題と利用者の組ごとの結果を、他のペルソナ方式より忠実に再現した（抄録）。", "fun": "AIの接客係を試すとき、本物の客を毎回集めるのは大変なので、AIに客の役をさせます。ところが、AIの客は話し方こそ人間らしくても、本物の客がつまずく場面でつまずきません。この研究は、本物の客の「失敗の仕方」まで写し取るように模擬の客を調整しました。人間らしさは見た目より、失敗の分布に表れるという視点が新しい点です。", "unverified": "成功率の一致の数値と、比べたペルソナ方式の詳細は未確認（本文を入手できず）。"}}, {"id": "pr23", "rank": 23, "headline": "LLM審判は順位は合っても受容率の尺度がずれる", "title": "Right Order, Wrong Scale: Auditing LLM Judges for Occupational AI Measurement", "url": "https://arxiv.org/abs/2610.02492", "authors": "Harry Lyu ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Lyu, H., & Thompson, N. (2026). Right Order, Wrong Scale: Auditing LLM Judges for Occupational AI Measurement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02492", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "LLM審判は、職場でのAIの出力の良し悪しの順位は人間とよく合うのに、受け入れられる割合の水準は大きくずれる。職業単位の測定に使うには、順位の一致だけでは足りないことを示した（未査読）。", "p3": "労働者45,796件の評定から監査用のO*NET-BENCHを作り、6つのモデル系列の既存の審判33構成を4,501件の評定で調べた（抄録）。", "p5": "25構成は同点を考慮した対の正答率が0.60以上だったが、TF-IDFの単純な基準もほぼ並んだ。受容率の推定は3.0〜97.9%とばらつき、同じ職業の労働者の61.1%と大きく違った。交差検証の較正で平均の偏りはほぼ消えるが、個人の評定の分散の説明は最大8.5%にとどまった（抄録）。", "fun": "AIの答えを別のAIに採点させる方法が広がっています。この研究は、採点役のAIが「どちらが良いか」の順番は人間とよく合うのに、「何割が合格か」は3.0%から97.9%までばらつくことを示しました。順番が合っても目盛りが合っているとは限りません。テストの順位が正しくても、合格ラインが狂っていれば使えないのと同じです。", "unverified": "構成ごとの結果の内訳と、較正の手順の詳細は未確認（本文を入手できず）。"}}, {"id": "pr24", "rank": 24, "headline": "社会的健康の状態は崩れやすく戻りにくい", "title": "Stability, Asymmetric Recovery, and Sociodemographic Heterogeneity in Social Health Trajectories Across Social Disruption: A Four-Wave Hidden Markov Model", "url": "https://doi.org/10.31234/osf.io/z8k3x_v1", "authors": "Karoline Huth ほか", "venue": "PsyArXiv", "date": "2026-10-05", "apa": "Huth, K., Steijvers, L. C. J., Wijnen, S. M. C. E., Schiepers, O., Crone, M., Crutzen, R., & Dukers-Muijrers, N. (2026). Stability, Asymmetric Recovery, and Sociodemographic Heterogeneity in Social Health Trajectories Across Social Disruption: A Four-Wave Hidden Markov Model. https://doi.org/10.31234/osf.io/z8k3x_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "40歳以上954人を2019〜2025年の感染症流行の前・中・後に追跡し、社会的な健康には孤立・中程度・良好の3つの比較的安定した状態があることを示した。ただし悪化した人の多くは、規制が解けた後も戻らなかった（未査読）。", "p3": "ネットワークの大きさと密度、孤独感、情緒的な支えから、隠れマルコフモデルで潜在的な状態と状態間の移り変わりを推定した。性別・学歴・年齢の影響と、抑うつ症状や身体の健康との関係も調べた（抄録）。", "p5": "孤立は15.9%、中程度は55.5%、良好は28.6%だった。72.5%は同じ状態にとどまり、14.4%が悪化、6.5%が回復した。男性と実業系の学歴は孤立と、女性は良好と結びついたが、女性は悪化とも結びついた。悪い状態ほど抑うつ症状が強かった（抄録）。", "fun": "人とのつながりは、一度切れると元に戻りにくいのでしょうか。この研究は、954人を感染症の流行の前から後まで追いました。つながりの状態は多くの人で安定していましたが、悪化した人は規制が解けてもなかなか回復しませんでした。悪化が14.4%、回復が6.5%という差が、崩れやすく戻りにくい性質を物語っています。", "unverified": "対象国と調査の時点の詳細、モデルの適合の指標は未確認（本文を入手できず）。"}}, {"id": "pr25", "rank": 25, "headline": "思春期の孤独はSNSの実際のやり取りに表れるか", "title": "Digital Reflections of Social (Dis)connectedness: A Snapchat Data Donations Study", "url": "https://doi.org/10.31234/osf.io/t8uaw_v2", "authors": "J. Loes Pouwels ほか", "venue": "PsyArXiv", "date": "2026-10-04", "apa": "Pouwels, J. L., Tilstra, M., Vreeswijk, L., Prot, N., & Pingel, M. A. (2026). Digital Reflections of Social (Dis)connectedness: A Snapchat Data Donations Study. https://doi.org/10.31234/osf.io/t8uaw_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "思春期の孤独や疎外の感覚が、Snapchatでの実際のやり取りにどう表れるかを、本人が提供したデータで調べた。はっきりした対応はほとんど見られなかった（未査読）。", "p3": "平均13.33歳の123人に、その場の気持ちを繰り返し尋ねる経験抽出法を行い、Snapchatから提供されたやり取りの記録と結びつけた（抄録）。", "p5": "つながりの乏しさの感覚が強い子ほど、未承認の友達申請が多く、メッセージに使う時間の割合が大きかった。多重検定を補正すると、送受信したメッセージ数、友達の数、Snapscore、Snapchat AIの利用とは関係がなかった（抄録）。", "fun": "「孤独な子ほどSNSにのめり込む」のか、「人気者ほどSNSでも活発」なのか、よく議論されます。この研究は、本人の気持ちの記録と、実際のSnapchatの利用記録を突き合わせました。結果はどちらの説もはっきりとは支持しませんでした。気持ちの記録と行動の記録を本人の協力で結びつけた方法そのものに価値があります。", "unverified": "未承認の申請やメッセージ時間との関係の大きさは未確認（本文を入手できず）。"}}, {"id": "pr26", "rank": 26, "headline": "開口の形が変わっても粒体の流出則は保たれる", "title": "Steady granular discharge across aperture shapes", "url": "https://arxiv.org/abs/2610.02543", "authors": "Kevin Yifan Zhao ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Zhao, K. Y., Sharma, R. S., Leonelli, A., Meiburg, E., & Sauret, A. (2026). Steady granular discharge across aperture shapes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02543", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "円形の開口で示した粒体の定常流出の枠組みが、三角形や長方形の開口にも当てはまることを示した。開口の形の違いは、面積と周長から決まる水力直径で整理できる（未査読）。", "p3": "球形粒子が三角形・長方形の開口から流れ出す様子を、実験と個別要素法のシミュレーションで調べた（抄録）。", "p5": "開口の形が変わっても自由落下の流量は似ており、効く輸送長だけが変わった。縁の近くで充填が緩む境界層が流量を減らす仕組みで、その不足を開口全体で積分すると水力直径D_h=4A/P（Aは面積、Pは周長）が主要な長さになる。開口が粒子より十分大きいとき、√(gD_h)が平均流出速度の目安になる（抄録）。", "fun": "砂時計の砂は、穴の形が丸でも三角でも同じように流れるのでしょうか。この研究は、穴の形が変わっても流れ方の法則は保たれ、穴の「面積を周の長さで割った量」だけで整理できることを示しました。水道管の流れで使う水力直径という考え方が、砂粒の流れにも通用するのが意外なところです。", "unverified": "実験とシミュレーションの粒子数・開口寸法の範囲は未確認（本文を入手できず）。"}}, {"id": "pr27", "rank": 27, "headline": "確率PDEの不確実性を分離型PINNで定量化", "title": "S$^{2}$-PINN: Stochastic Separable Physics-Informed Neural Networks", "url": "https://arxiv.org/abs/2610.03303", "authors": "Zhendong Li ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Li, Z., & Onwunta, A. (2026). S$^{2}$-PINN: Stochastic Separable Physics-Informed Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03303", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "確率的な偏微分方程式の解の不確実性を、空間・時間・確率の部分に分けて表すPINN（S²-PINN）で定量化した。少ないパラメータで平均と分散を精度よく求める（未査読）。", "p3": "解を、学習するガウスの空間辞書、フーリエの時間特徴、一般化多項式カオスの確率基底に分け、低ランクのテンソル分解でつないだ。強形式の残差と、確率ガラーキン条件に当たる射影残差を合わせて学習する（抄録）。", "p5": "4つの人工の確率PDEで、平均と分散の精度と較正の点で9つの比較手法を上回った。ポアソン・ダルシー問題、確率的なナビエ・ストークス問題、高次元の拡散、2つの確率的な逆問題でも汎化を確かめた（抄録）。", "fun": "材料の性質や境界の条件がばらつくと、計算の答えもばらつきます。そのばらつきまで求めるのが不確実性の定量化です。この研究は、解を「場所」「時間」「偶然」の3つの部品に分けて組み立てるAIを作り、ばらつきの平均と幅を少ない計算量で求めました。分けて組み立てることで次元の呪いを避ける発想です。", "unverified": "比較手法に対する誤差の数値と計算時間は未確認（本文を入手できず）。"}}, {"id": "pr28", "rank": 28, "headline": "記憶付きの区間マルコフ連鎖で確率動力学を抽象化", "title": "Memory-Dependent Interval Markov Chain Abstractions of Stochastic Dynamics", "url": "https://arxiv.org/abs/2610.02950", "authors": "Menno van Zutphen ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "van Zutphen, M., Banse, A., Herceg, D., Delimpaltadakis, G., & Antunes, D. (2026). Memory-Dependent Interval Markov Chain Abstractions of Stochastic Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02950", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "連続状態の確率系を有限の区間マルコフ連鎖で近似するとき、最近たどったセルを記憶させると遷移確率の区間が狭まることを証明した（未査読）。", "p3": "記憶が現在のセル内で起こりうる分布の範囲を狭めるという着想から、記憶つきの区間マルコフ連鎖を構成した。状態空間を増やさずに区間を狭める記憶なしの構成と、2つの費用保証の上界も導いた。線形ガウス系では閉じた形の上界を得た（抄録）。", "p5": "記憶は局所の区間を狭めるが、抽象化は大きくなる。数値例では、記憶つき・記憶なしの構成が、同程度に細分化したモデルより狭い期待費用の区間を与えた（抄録）。", "fun": "天気を「晴れ・曇り・雨」の3つだけで表すと、明日の予報は大ざっぱになります。でも「昨日も雨だった」と覚えていれば、予報は少し正確になります。この研究は、複雑な揺れの動きを少ない状態にまとめるとき、直前の履歴を覚えさせると予測の幅が数学的に狭まることを示しました。", "unverified": "数値例の系と区間の狭まりの大きさは未確認（本文を入手できず）。"}}, {"id": "pr29", "rank": 29, "headline": "物理的気候リスクは石油ガス企業の価値を下げる", "title": "Physical Climate Risk, Tobins’Q and Credit Risk: Evidence from the Oil and Gas Industry", "url": "https://doi.org/10.2139/ssrn.7560486", "authors": "ANTONIO GARCÍA-AMATE ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "GARCÍA-AMATE, A., Mansilla-Fernandez, J. M., & Muga, L. (2026). Physical Climate Risk, Tobins’Q and Credit Risk: Evidence from the Oil and Gas Industry. https://doi.org/10.2139/ssrn.7560486", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "石油・ガス企業では、物理的な気候リスクへの曝露が大きいほど企業価値（トービンのq）が低い。一方、信用リスクにはその影響が表れなかった（未査読）。", "p3": "企業レベルのデータで、物理的気候リスクの曝露とトービンのq、ブラック・ショールズ・マートン模型で測った信用リスクとの関係を分析した（抄録）。", "p5": "曝露が大きいほどトービンのqは低く、小規模企業と上流部門で特に強かった。信用リスクとの関係は見られず、相対評価の指標や確率ゼロの観測を除いた標本でも結果は変わらなかった（抄録）。", "fun": "気候変動による災害のリスクを、株式市場と貸し手はどう値付けしているのでしょうか。この研究では、株主は気候リスクを企業価値の割引として織り込んでいたのに、倒産確率の指標には表れませんでした。同じ企業でも、誰の目で見るかでリスクの見え方が違うのです。", "unverified": "標本の期間・企業数と、物理的気候リスクの測り方は未確認（本文を入手できず）。"}}, {"id": "pr30", "rank": 30, "headline": "多主体の時系列から系全体の変化点を即時検出", "title": "On Multi-entity, Multivariate Quickest Change Point Detection", "url": "https://doi.org/10.2139/ssrn.7560445", "authors": "Bahar Kor ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Kor, B., Gaikwad, B., Patra, A., & Miller, E. L. (2026). On Multi-entity, Multivariate Quickest Change Point Detection. https://doi.org/10.2139/ssrn.7560445", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "数が増減し互いに影響し合う多数の主体の多変量時系列から、系全体の振る舞いの変化を、遅れ少なくオンラインで検出する教師なしの方法を示した（未査読）。", "p3": "各主体の通常からのずれ（IDfN）を求め、系全体の異常スコア（SWAS）に集約する。そこへ累積和（CUSUM）による逐次検出をかける2段階の手順で、学習には通常時のデータだけを使う。主体の数が変わっても学習し直す必要がない（抄録）。", "p5": "合成データと群衆シミュレーションで、系全体の変化を正確に検出できたとする。評価用に、多主体・多変量のデータセットを3つ公開した（抄録）。", "fun": "広場の人の流れのように、一人ひとりの動きは揺らいでいても、集団全体の様子が急に変わる瞬間があります。この研究はその瞬間を見つける方法を作りました。人数が途中で増えたり減ったりしても学習し直さずに使えます。個人を映像で追わずに済むので、プライバシーにも配慮できる点が工夫です。", "unverified": "検出遅れ・誤検出率などの数値と、比べた手法は未確認（本文を入手できず）。"}}, {"id": "pr31", "rank": 31, "headline": "飲食店のAIチャットボット利用は信頼が鍵", "title": "AI chatbots in the food and beverage industry: Trust, privacy calculus, and customer engagement in a developing economy", "url": "https://doi.org/10.1016/j.chbr.2026.101274", "authors": "Frough, Eid Mohammad", "venue": "Zenodo", "date": "2026-10-04", "apa": "Frough, E. M., Hassan, H., & Nathan, R. J. (2026). AI chatbots in the food and beverage industry: Trust, privacy calculus, and customer engagement in a developing economy. Computers in Human Behavior Reports, 23, 101274. https://doi.org/10.1016/j.chbr.2026.101274", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "マレーシアのカフェ利用者595人の調査で、飲食店のAIチャットボットの利用は、便益とプライバシーの不安を比べたうえでの「信頼」で決まることを示した（Zenodoの未査読文書）。", "p3": "技術受容の統合理論UTAUT2とプライバシー計算を、信頼を媒介につないだモデルを作り、横断調査とPLS-SEM（部分最小二乗法の構造方程式モデル）で推定した（抄録）。", "p5": "期待される成果・使いやすさ・楽しさ・習慣が利用意図を強め、意図と習慣が実際の利用と結びついた。知覚した便益は信頼を高め、プライバシーのリスクは信頼を下げた。信頼は満足と、直接にも間接にも結びついた（抄録）。", "fun": "お店のチャットボットを使うかどうかは、便利さだけで決まるわけではありません。「この店に個人情報を渡しても大丈夫か」という損得勘定が働きます。この研究は、便利さと不安のてんびんの間に「信頼」という支点を置いて説明しました。年齢によって楽しさの効き方が違うのも、身近な実感と合います。", "unverified": "標本の抽出方法と、各経路の係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pr32", "rank": 32, "headline": "精神科病棟の安全事故とチームの特性", "title": "How do staff and team characteristics relate to ward safety incidents in adult inpatient mental health settings? A systematic integrative review.", "url": "https://doi.org/10.21203/rs.3.rs-11205262/v1", "authors": "Bethany Griffin ほか", "venue": "Research Square (In Review)", "date": "2026-10-04", "apa": "Griffin, B., Greenfield, K., Kendal, S., Johnson, J., Hallett, N., Woodnutt, S., Henderson, M., Lomani, J., Berzins, K., Bojke, C., Wadey, E., & Baker, J. (2026). How do staff and team characteristics relate to ward safety incidents in adult inpatient mental health settings? A systematic integrative review. https://doi.org/10.21203/rs.3.rs-11205262/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "精神科の成人入院病棟の安全事故とスタッフ・チームの特性の関係を、33か国135本の研究から整理した。人数や属性より、話し方・関わりやすさ・共感の方が一貫した手がかりだった（未査読）。", "p3": "6つのデータベースを1999年以降で検索した系統的統合レビューで、混合研究の評価ツール（MMAT）で質を評価し、帰納的な叙述的統合で分析した（抄録）。", "p5": "135本（量的80、質的46、混合9）を4つのテーマに整理した。スタッフの言葉や声の調子、患者への関わりやすさ、共感の影響が最も一貫していた。人数・属性・経験については研究が多いものの、結果が一貫しなかった（抄録）。", "fun": "病棟の事故を減らすには「スタッフを増やせばよい」と考えがちです。ところが135本の研究をまとめると、人数の効果ははっきりしませんでした。一貫して効いていたのは、話し方や共感といった人と人の関わり方です。数より関わりの質という見方は、職場一般にも通じます。", "unverified": "テーマごとの研究数と、効果の向きの内訳は未確認（本文を入手できず）。"}}, {"id": "pr33", "rank": 33, "headline": "AI不安が業績に与える影響は評価次第で分かれる", "title": "Artificial Intelligence Anxiety and Employee Performance: A Systematic Literature Review of Job Insecurity, Threat–Challenge Appraisal, Coping, Career Resilience, and Organisational Buffers", "url": "https://doi.org/10.5281/zenodo.23137500", "authors": "Kondagekar, Darpan Sudhakar", "venue": "Zenodo", "date": "2026-10-04", "apa": "Kondagekar, D. S. (2026). Artificial Intelligence Anxiety and Employee Performance: A Systematic Literature Review of Job Insecurity, Threat–Challenge Appraisal, Coping, Career Resilience, and Organisational Buffers. Zenodo. https://doi.org/10.5281/ZENODO.23137500", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（DataCite経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIへの不安が従業員の業績に与える影響を、脅威として受け止める経路と、挑戦として受け止める経路の2つに整理した文献レビュー（Zenodoの未査読文書）。", "p3": "複数の検索戦略と引用の前後たどりで公開文献を集め、認知的評価理論・資源保存理論・仕事の要求度-資源モデルを統合して、質的な主題統合を行った。新しい調査データは集めていない（抄録）。", "p5": "脅威の経路では、仕事を失う不安や技能の陳腐化が、職の不安・情緒的消耗・離脱を通じて業績を下げうる。挑戦の経路では、資源がそろえば学習やジョブ・クラフティングを通じて業績を支えうる。緩衝要因としてキャリアの強靱さ、AI自己効力感、研修、支援的なリーダーシップなどを挙げた（抄録）。", "fun": "同じAIの導入でも、ある人は「仕事を奪われる」と感じ、別の人は「新しい道具だ」と感じます。このレビューは、その分かれ目を、AIを脅威と見るか挑戦と見るかの受け止め方に求めました。そして、受け止め方を変えるのは本人の気の持ちようだけでなく、研修や上司の支えだと整理しています。", "unverified": "収録した研究の数と、商用データベースを使わない検索の網羅性は未確認（著者も網羅性は主張していない）。"}}, {"id": "pr34", "rank": 34, "headline": "多エージェント討論と検索で偽ニュースを検出", "title": "MARC-FEND:Multi-agent and Retrieval-augmented Cross-modal Fake News Detection", "url": "https://doi.org/10.2139/ssrn.7560524", "authors": "ziheng wang ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "wang, z., Song, J., Wang, S., Fan, S., & Zhang, X. (2026). MARC-FEND:Multi-agent and Retrieval-augmented Cross-modal Fake News Detection. https://doi.org/10.2139/ssrn.7560524", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "画像と文章を組み合わせた偽ニュースを、多エージェントの討論と検索による事実確認で見抜く枠組み（MARC-FEND）を提案し、2つのデータで高い精度を示した（未査読）。", "p3": "文章と画像の意味のずれをクロスモーダル注意と異種知識グラフで捉える。異なる立場の事実確認役のエージェントを討論させ、検索拡張生成で最新の根拠を取り寄せて論理の矛盾を点検する（抄録）。", "p5": "Weibo21で正解率96.1%・F1値95.9%、Twitterで正解率94.2%・F1値94.1%となり、既存の最先端手法を一貫して上回ったとする（抄録）。", "fun": "偽ニュースを見抜くとき、一人の専門家より、立場の違う専門家どうしを議論させた方が強いかもしれません。この研究はその考えをAIで再現しました。AIの専門家役どうしに討論させ、最新の情報を調べさせて矛盾を突く仕組みで、高い正解率を出しています。", "unverified": "討論するエージェントの数と、各要素を外した場合の性能の変化は未確認（本文を入手できず）。"}}, {"id": "pr35", "rank": 35, "headline": "PINNで層状砂岩のモードIII破壊則を同定", "title": "Identifying bedding-dependent Mode III fracture laws in sandstone using physics-informed neural networks", "url": "https://doi.org/10.2139/ssrn.7560619", "authors": "Pengcheng Zhu ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Zhu, P., & Chen, T. (2026). Identifying bedding-dependent Mode III fracture laws in sandstone using physics-informed neural networks. https://doi.org/10.2139/ssrn.7560619", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "層状の砂岩のモードIII破壊で、表面の計測だけから内部のすべりと結合力の法則を同時に同定するPINNを作り、層理の向きごとの破壊則を推定した（未査読）。", "p3": "界面を縮約したPINNで、試験体の荷重と表面の変位増分から内部のすべり場と結合則を同定する。固定した3次元弾性の作用素で界面の場を釣り合いと観測に結びつけ、切欠きの深さが違う試験体どうしで層理の向きごとに同じ構成則を共有させた（抄録）。", "p5": "砂岩の円板27個のうち18個で同定し、9個で再現性を確かめた。最大荷重の平均絶対相対誤差は0°・45°・90°で8.03%・6.84%・2.72%だった。45°と90°では、当てはめた最大強度が7.34MPaと14.39MPaだった（抄録）。", "fun": "岩の内部でどこがどれだけずれたかは、割ってみないと見えません。この研究は、表面のわずかな動きだけから、物理法則を組み込んだAIで内部のずれ方と壊れ方のルールを逆算しました。地層の縞に垂直な向きの方が強い理由を、内部の局所的な強さで説明できた点が成果です。", "unverified": "同定した結合則の具体的な形と、PINNの学習条件は未確認（本文を入手できず）。"}}, {"id": "pr36", "rank": 36, "headline": "合成画像で石積みのひび割れ検出を強化", "title": "A Framework for Generating Labelled Synthetic Masonry Damage Images for Computer Vision-Based Infrastructure Inspections", "url": "https://doi.org/10.2139/ssrn.7560001", "authors": "Jianyu Zhang ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Zhang, J., Altinay, K., Ye, Z., & Ninić, J. (2026). A Framework for Generating Labelled Synthetic Masonry Damage Images for Computer Vision-Based Infrastructure Inspections. https://doi.org/10.2139/ssrn.7560001", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "石積みのひび割れ画像を、壁の形・材料の見た目・ひび割れの形を同時に制御して合成する枠組みを作った。実画像に合成画像を加えると、ひび割れの検出精度が上がった（未査読）。", "p3": "Blenderで、ひび割れの経路と損傷した石材のラベルを石積みの配置に結びつけた合成画像を作る（BCGデータセット）。インスタンス分割のモデルを、実画像だけの場合と合成画像を加えた場合で比べた（抄録）。", "p5": "MCrack1300の検証区分で、実画像1,000枚に合成画像3,000枚を加えると、ひび割れのマスクのmAP50-95が0.294から0.324へ上がった（3回の学習の平均）。外部の壁1面の6視点では、Crack IoUの最高の平均が0.284で、実画像だけの0.197を上回った（抄録）。", "fun": "AIにひび割れを見つけさせるには、大量の「答えつき」画像が要ります。ところが石積みの壁の画像は集めにくく、答えを付ける手間もかかります。この研究は、3DソフトでCGの壁を作り、ひび割れを描き込んで練習用の画像を量産しました。CGで練習させたAIが、本物の壁でも成績を伸ばしたのが成果です。", "unverified": "合成画像の生成にかかる手間と、他の構造物への転用のしやすさは未確認（本文を入手できず）。"}}, {"id": "pr37", "rank": 37, "headline": "地下水を含む水文・土砂の統合モデルを検証", "title": "Investigating the Influence of Groundwater Flow on Sediment Transport Using an Integrated Hydrology-Sediment Modeling Framework: Model Development, Verification and Validation", "url": "https://doi.org/10.2139/ssrn.7560604", "authors": "Quan Wei ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Wei, Q., Brookfield, A., Frey, S. K., & Lapen, D. (2026). Investigating the Influence of Groundwater Flow on Sediment Transport Using an Integrated Hydrology-Sediment Modeling Framework: Model Development, Verification and Validation. https://doi.org/10.2139/ssrn.7560604", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "地表と地下の流れを解く分布型の水文モデルに、土砂の生産と流下のモジュールをつなぎ、流域の土砂輸送を一貫して模擬する枠組みを作って、実測で検証した（未査読）。", "p3": "HydroGeoSphereに、MUSLEによる土砂生産の推定とメッシュ上の土砂の流下を組み合わせた。理想化した斜面で流下の挙動を確かめ、カナダ・オンタリオ州の流域の6観測所のデータで検証した（抄録）。", "p5": "浮遊土砂濃度の範囲と時間変動をおおむね再現し、観測所ごとのR²は0.40〜0.73、RMSEは4.35〜13.83mg/Lだった。6か所のうち4か所はR²が0.66〜0.73と良く、残りの不一致は出来事の時刻のずれや観測の少なさによるとした（抄録）。", "fun": "川に流れ込む土砂は、雨水だけでなく地下水の動きにも左右されます。この研究は、地表と地下の水の流れを一緒に解くモデルに、土砂が生まれて運ばれる仕組みをつなぎました。水と土砂を同じ地図の上で一貫して扱うことで、ちぐはぐな組み合わせによる誤差を避けています。", "unverified": "地下水の流れが土砂輸送に与える影響の大きさの定量結果は未確認（本文を入手できず）。"}}, {"id": "pr38", "rank": 38, "headline": "局地気候区分と微気象モデルで暑熱対策を評価", "title": "From urban scale to pedestrian level: Integrating LCZs, remote sensing, and ENVI-met for urban heat and green infrastructure assessment​", "url": "https://doi.org/10.2139/ssrn.7560979", "authors": "Camila Amaro de Souza", "venue": "SSRN", "date": "2026-10-04", "apa": "Amaro de Souza, C. (2026). From urban scale to pedestrian level: Integrating LCZs, remote sensing, and ENVI-met for urban heat and green infrastructure assessment​. https://doi.org/10.2139/ssrn.7560979", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ブラジルの都市で、局地気候区分・衛星の地表面温度・微気象モデルを組み合わせ、都市の形と暑さの関係と、緑化策が歩行者の体感温度に与える効果を評価した（未査読）。", "p3": "局地気候区分（LCZ）と衛星の地表面温度でヒートアイランドの強さを都市規模で調べ、代表的な3つの区分でENVI-metの微気象モデルと体感の指標（UTCI）を使って5つの緑化の想定を比べた（抄録）。", "p5": "平均地表面温度は密な樹林の区分で28.21℃と最も低く、低い植生の区分で33.96℃と最も高かった。樹木を増やす策は、3つの区分でUTCIを0.39℃・0.16℃・0.75℃下げた。屋上緑化を足しても、歩行者の高さでの追加の効果は見られなかった（抄録）。", "fun": "暑さ対策の緑化は、屋上に植えるのと街路に木を植えるのとで、どちらが効くのでしょうか。この研究の模擬では、歩く人の体感温度を下げたのは街路の木で、屋上緑化を足しても上乗せの効果はありませんでした。誰の暑さを下げたいかで、緑の置き場所を選ぶ必要があるわけです。", "unverified": "模擬の気象条件と、屋上緑化が建物内の温度に与える効果は未確認（本文を入手できず）。"}}, {"id": "pr39", "rank": 39, "headline": "可動せん断キーで橋台の耐震性能を高める", "title": "Controlling the seismic response of bridges with seat-type abutments through longitudinal movable shear keys on the stemwall", "url": "https://doi.org/10.2139/ssrn.7560923", "authors": "B. Neethu ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Neethu, B., Mikes, I., Giaralis, A., & Kappos, A. (2026). Controlling the seismic response of bridges with seat-type abutments through longitudinal movable shear keys on the stemwall. https://doi.org/10.2139/ssrn.7560923", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "これまで橋軸直角方向に使われてきた橋台のせん断キーを橋軸方向にも設け、橋台の竪壁を耐震に参加させる新しい構成を提案した。可動式のせん断キーで、橋の耐震性能が高まった（未査読）。", "p3": "固定式に加え、初期の遊間を最適化した受動型と、すべりを実時間で固定・解除する半能動型の可動せん断キーを検討した。橋台と裏込めのプッシュオーバー解析で得た曲線を非線形ばねにし、橋の非線形時刻歴応答解析で比べた（抄録）。", "p5": "提案した制御系は、主要な限界状態に達するのに必要な地震の強さを高め、制御なしの構成を明確に上回った。半能動型の可動せん断キーが、全体として最も良い耐震性能を示した（抄録）。", "fun": "地震のとき、橋の桁は橋台にぶつかりながら揺れます。この研究は、そのぶつかり方を「すべる鍵」で調整し、本来は基礎を守るための壁にも地震の力を受け持たせる工夫を考えました。揺れの最中に鍵を締めたり緩めたりする半能動型が、最もよく効いたのが面白いところです。", "unverified": "解析した橋の諸元と入力した地震動の数、限界状態に達する強さの改善の数値は未確認（本文を入手できず）。"}}, {"id": "pr40", "rank": 40, "headline": "植生の蒸散冷却と日陰冷却は日内で非対称", "title": "Asymmetric diurnal pathways of evapotranspiration and shading govern vegetation cooling under extreme heat", "url": "https://doi.org/10.2139/ssrn.7560980", "authors": "Jinghan Pan ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Pan, J., Deng, L., Yang, J., Su, F., Guo, Y., Wang, W., & Bai, X. (2026). Asymmetric diurnal pathways of evapotranspiration and shading govern vegetation cooling under extreme heat. https://doi.org/10.2139/ssrn.7560980", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "猛暑のとき、植生の冷却は蒸散と日陰の2つの経路に分かれ、それぞれ日内の変化と制約が違う。中国の9都市でそれを分けて示した（未査読）。", "p3": "乾燥・温帯・湿潤の気候帯の9都市の極端高温日で、SCOPEモデルを100m解像度で使い、蒸散による冷却と日陰による冷却を分けて日内の変化を求めた。要因はXGBoostとSHAP、地理的加重回帰で調べた（抄録）。", "p5": "どちらの経路も正午ごろが最大だったが、合わさった冷却効果は19時ごろに4.9〜6.1℃で最大になり、両経路が弱まった数時間後だった。蒸散の冷却は水の利用可能性・樹冠の構造・都市の密度に、日陰の冷却は不透水面の割合と地表のエネルギー配分に強く制約された（抄録）。", "fun": "木陰が涼しいのは、葉が日差しをさえぎるからでしょうか、それとも葉から水が蒸発して熱を奪うからでしょうか。この研究は2つを分けて測りました。どちらの働きも昼に最大なのに、涼しさの効果が最大になるのは夕方7時ごろでした。働きの強さと体感される結果の間に、時間の遅れがあるわけです。", "unverified": "都市ごとの冷却量の内訳と、モデルの検証の方法は未確認（本文を入手できず）。"}}, {"id": "pr41", "rank": 41, "headline": "層理面のすべりを含む頁岩の異方性構成則", "title": "Modeling shale using an anisotropic elastoplastic virtual internal bond model accounting for bedding-plane slip", "url": "https://doi.org/10.2139/ssrn.7560381", "authors": "Weiwei Xiao ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Xiao, W., Yang, Y., Yang, C., Yuan, H., Wu, C., & Zhang, Z. (2026). Modeling shale using an anisotropic elastoplastic virtual internal bond model accounting for bedding-plane slip. https://doi.org/10.2139/ssrn.7560381", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "頁岩の破壊では、基質の割れと層理面の不可逆なすべりが同時に起きる。その両方を1つの構成則で表すモデル（AEP-VIB）を作った（未査読）。", "p3": "層理面の幾何を2つのパラメータの層理テンソルで表し、微視的な結合の分布をそれに結びつけて異方性の仮想内部結合モデルを作った。これに層理面のすべりを表すモール・クーロンの塑性を連成した（抄録）。", "p5": "シミュレーションでは、頁岩の割れと層理面のすべりを捉えられ、頁岩の水圧破砕の解析に使える力学モデルになりうるとする（抄録）。", "fun": "頁岩はミルフィーユのように薄い層が重なった岩です。壊れるときは、層そのものが割れるだけでなく、層と層の間がすべります。この研究は、その2つの壊れ方を1つの式で同時に表しました。粒子どうしの「見えない結合」の分布に層の向きを織り込んだのが工夫です。", "unverified": "実験との比較による検証の有無と、数値の再現精度は未確認（本文を入手できず）。"}}, {"id": "pr42", "rank": 42, "headline": "透水性のばらつきとハイドレート採掘の不確実性", "title": "Uncertainty Analysis of Long-term Evolution of Natural Gas Hydrate Extraction under a Fully Coupled THMC Model: The Impact of Spatial Permeability Variability", "url": "https://doi.org/10.2139/ssrn.7560670", "authors": "Junhoa Huang ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Huang, J., Fu, Y., & Su, Z. (2026). Uncertainty Analysis of Long-term Evolution of Natural Gas Hydrate Extraction under a Fully Coupled THMC Model: The Impact of Spatial Permeability Variability. https://doi.org/10.2139/ssrn.7560670", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "メタンハイドレートの減圧生産で、透水性の空間的なばらつきがガス生産量と地盤沈下の予測をどれだけ揺らすかを、熱・水・力学・化学の連成モデルで調べた（未査読）。", "p3": "現地データで条件づけた透水性の確率場を作り、完全陰的な有限要素法で解く連成モデルに入れた。変動係数と空間相関長を変え、坑井近くの平均透水性や高透水の連結構造などの空間記述子と応答の関係を調べた（抄録）。", "p5": "多くの確率的な実現値では、決定論的なモデルより累積ガス生産量が多かった。相関長の変化は変動係数の変化より、生産量と沈下のばらつきを大きくした。経路の抵抗を表す記述子は、坑井近くの平均透水性より生産量・沈下と強く結びついた（抄録）。", "fun": "地下の岩の水の通しやすさは、場所によってまだらです。この研究は、そのまだら模様の「ばらつきの大きさ」より「模様の大きさ（つながり方）」の方が、ガスの取れ方と地盤の沈み方を大きく左右することを示しました。平均値だけを見ていると、つながった近道の効果を見落とすわけです。", "unverified": "ばらつきの大きさの数値と、対象とした現地のデータの詳細は未確認（本文を入手できず）。"}}, {"id": "pr43", "rank": 43, "headline": "電力契約と証書を整合させる炭素責任の会計", "title": "Market-Based Carbon Responsibility Accounting for Electricity Contracts and Green Certificate Transfers", "url": "https://doi.org/10.2139/ssrn.7560247", "authors": "Gaoyang Zuo ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Zuo, G., Li, X., Yin, C., Li, X., & Wang, B. (2026). Market-Based Carbon Responsibility Accounting for Electricity Contracts and Green Certificate Transfers. https://doi.org/10.2139/ssrn.7560247", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "再エネ電力・環境価値を切り離した電力・化石電源の契約・単独のグリーン証書が混在する市場で、環境価値の二重計上や責任の宙づりを防ぐ炭素責任の会計の枠組みを提案した（未査読）。", "p3": "精算の優先順位で各環境価値を一度だけ使い、証書を元の電力に結びつける記録を残し、証書の精算後に主体ごとの責任を更新する閉じた手順を作った。対応する証書がない分は、残余の配分で消費者に割り振る（抄録）。", "p5": "期をまたぐ精算、再エネの発電の変動、一部の不履行という比較事例で、手順が責任の漏れと環境価値の重複主張を特定できることを示した（抄録）。", "fun": "「この電気は再エネです」という証明書が、電気そのものと切り離して売り買いされています。すると、同じ緑の価値を2社が名乗ったり、引かれたCO2の責任が誰にも行かなかったりします。この研究は、簿記の考え方で証書と電気の行き先を一つずつ対応させ、帳尻が必ず合う仕組みを作りました。", "unverified": "実際の市場データへの適用の有無は未確認（本文を入手できず）。"}}, {"id": "pr44", "rank": 44, "headline": "コールセンターの顧客満足を決める要因", "title": "Determinants of Customer Satisfaction in the Call Centers of Karachi", "url": "https://doi.org/10.5281/zenodo.23135035", "authors": "Jabri, Maria", "venue": "Zenodo", "date": "2026-10-04", "apa": "Jabri, M. (2015). Determinants of Customer Satisfaction in the Call Centers of Karachi (Version V1) [Iqra University]. https://doi.org/10.5281/ZENODO.23135035", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された修士論文の抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "パキスタン・カラチの携帯電話会社のコールセンターで、顧客満足を左右する要因を調べた修士論文。つながりやすさ・サービスの質・解決の完全さが効き、応対の丁寧さと速さは効かなかった（Zenodoの未査読文書）。", "p3": "384人に質問紙調査を行い、有効な369件を信頼性分析、主成分による探索的因子分析、重回帰分析で分析した。属性と加入している通信会社は統制している（抄録）。", "p5": "サービスのつながりやすさ・サービスの質・解決の完全さは顧客満足と有意な正の関係を示した。担当者のプロ意識と応答の速さは、有意な予測因子ではなかった（抄録）。", "fun": "コールセンターの満足度を上げるには、オペレーターの言葉づかいを磨けばよいと思いがちです。ところがこの調査では、効いていたのは「すぐつながるか」「問題がきちんと解決するか」でした。丁寧さや素早さは有意ではありません。客が求めるのは、感じの良さより用件が片づくことなのです。", "unverified": "回帰係数の大きさと、標本の抽出方法は未確認（本文を入手できず）。"}}, {"id": "pr45", "rank": 45, "headline": "交通信号制御の多エージェント強化学習を総説", "title": "Cooperative Multi-Agent Foundations and the Sim-to-Real Gap in Traffic Signal Control: A Deployment-Oriented Survey", "url": "https://doi.org/10.2139/ssrn.7560448", "authors": "Bison Liao ほか", "venue": "SSRN", "date": "2026-10-04", "apa": "Liao, B., Wu, X., Liu, S., Ma, L., Wong, K.-C., & Lin, Q. (2026). Cooperative Multi-Agent Foundations and the Sim-to-Real Gap in Traffic Signal Control: A Deployment-Oriented Survey. https://doi.org/10.2139/ssrn.7560448", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "交通信号制御の深層強化学習を、多エージェント強化学習の仕組みで体系的に整理した総説。シミュレーションでは成功しても実装が進まない理由（sim-to-realの差）を、実装の観点から点検した（未査読）。", "p3": "独立学習、集中学習・分散実行、価値の分解、通信、逐次の結合最適化という仕組みに沿って既存手法を位置づけ、インフラ・交通の動態・道路網・安全・計算の制約・評価の慣行の差を検討した（抄録）。", "p5": "ベンチマークの死角を指摘し、今後の研究課題を提案した。どの前提・接続・運用の制約が実用性を決めるかの境界を示すとする（抄録）。", "fun": "AIに信号を任せる研究は、シミュレーションでは渋滞を大きく減らしています。それなのに、実際の街ではほとんど使われていません。この総説は、その溝の原因を、機械の性能、交通の予測しにくさ、安全、評価の仕方といった現場の条件から洗い出しました。研究室の成功と街の成功は別物だという指摘です。", "unverified": "取り上げた手法の数と、実装事例の具体例は未確認（本文を入手できず）。"}}, {"id": "pr46", "rank": 46, "headline": "女性取締役は中小企業の革新を因果的に促す", "title": "No Women No Innovation? The Effect of Women on Boards on Hard and Soft Innovation in SMEs", "url": "https://arxiv.org/abs/2610.03250", "authors": "Francesca Pascale ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Pascale, F., Barabuffi, S., & Ferrigno, G. (2026). No Women No Innovation? The Effect of Women on Boards on Hard and Soft Innovation in SMEs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03250", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "イタリアの革新的な中小企業で、女性取締役は技術的な革新と非技術的な革新の両方を因果的に促す。単純な推定では技術的革新への効果が負に見えたが、それは選抜の偏りだった（未査読）。", "p3": "2015〜2024年のイタリアの革新的中小企業2,762社の縦断データで、操作変数を使う二段階最小二乗法（2SLS）により、女性取締役の効果を推定した（抄録）。", "p5": "技術的な革新では、基準の推定の負の係数が操作変数の推定で頑健な正の効果に反転し、強い負の選抜の偏りが明らかになった。非技術的な革新では、安定した正の効果が確かめられた（抄録）。", "fun": "女性取締役が多い会社ほど技術革新が少ない、という数字が出たとします。でもそれは、そもそも革新の起きにくい会社に女性が登用されやすいからかもしれません。この研究は、その「選ばれ方の偏り」を取り除くと、効果の向きが負から正へひっくり返ることを示しました。見かけの相関と因果の違いがよく分かる例です。", "unverified": "操作変数の中身と、効果の大きさは未確認（本文を入手できず）。"}}, {"id": "pr47", "rank": 47, "headline": "監査の点検は専門的判断か事前の約束か", "title": "Audit the Auditors: Commitment versus Professional Judgment", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.24020", "authors": "Pingyang Gao ほか", "venue": "RePEc NEP", "date": "2026-09-28", "apa": "Gao, P., Lu, J., & Yang, Z. (2026). Audit the Auditors: Commitment versus Professional Judgment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.24020", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "監査の品質の点検を、専門家の判断に任せるピアレビューと、事前に点検の水準を約束する政府の検査（PCAOB）のどちらが良いかを、理論モデルで比べた（未査読）。", "p3": "ピアレビューを、専門知識（私的なシグナル）で事後に監査の失敗を確かめる「判断の体制」、PCAOBの検査を、私的情報はないが事前に点検の水準を約束できる「約束の体制」としてモデル化した（抄録）。", "p5": "判断の体制は資源配分と情報に基づく抑止の効果を、約束の体制は事前の約束による先手の抑止効果を持つ。私的なシグナルが十分に有益なときに限り、ピアレビューが好まれる。点検の費用が高いほど、また監査の誘因が強いほど、PCAOBの検査が好まれる（抄録）。", "fun": "監査を誰が見張るべきでしょうか。仲間の専門家なら目は確かですが、手加減するかもしれません。役所なら目は粗くても、「必ずこれだけ調べる」と前もって約束できます。この研究は、専門家の目が十分に確かなときだけ仲間の点検が勝つことを、ゲーム理論で示しました。", "unverified": "モデルの具体的な仮定と、実証的な裏づけの有無は未確認（本文を入手できず）。"}}, {"id": "pr48", "rank": 48, "headline": "人々の活動の向きの多様性が10年で大きく減る", "title": "Conditions for Social Trajectory Collapse: Agent-Based Simulation of Time-Geographic Trajectory Distributions", "url": "https://arxiv.org/abs/2610.02581", "authors": "Daneul Kim ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Kim, D., & Kim, Y. (2026). Conditions for Social Trajectory Collapse: Agent-Based Simulation of Time-Geographic Trajectory Distributions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02581", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用。本文は取得していない（短い解説）", "preprint": true, "short": true, "p1": "人々の日常の活動が、近隣・都心・広域のどこに向かうかの多様性が、5か国で2026年から2036年までに52.6〜79.0%減るとエージェント模擬で示した。日本とロシアで偏りが最も強まる（未査読）。", "p3": "中国・ロシア・日本・英国・米国の2010年の人口の割合を2026年の分布に対応づけ、2036年までの変化をエージェントベースで模擬した。活動の向きの多様性、費用の負担、厚生を指標にした（抄録）。", "p5": "活動の向きの多様性は2026〜2036年に52.6〜79.0%減った。最も多い活動の型の割合の上昇は、ロシアと日本で最大だった。費用の負担はどの国でも上がり、厚生はロシアと日本で下がって、他の3か国では上がった（抄録）。", "fun": "人が毎日どこへ向かって暮らすか、近所か、都心か、もっと広い範囲かは、人によってさまざまです。この研究の模擬では、その多様さが2036年までに52.6〜79.0%失われ、とくに日本とロシアで暮らし方が一つの型に寄っていきました。一極集中は人口の数だけでなく、暮らし方の幅も狭めるという見方です。", "unverified": "模擬のパラメータの決め方と、実測データによる検証の有無は未確認（本文を入手できず）。"}}, {"id": "pr49", "rank": 49, "headline": "成功した追試が9回不採択になった記録", "title": "To replicate or not to replicate? My nine failures to publish a successful replication", "url": "https://doi.org/10.31234/osf.io/yrdc2_v1", "authors": "Sharon Gilaie-Dotan", "venue": "PsyArXiv", "date": "2026-10-05", "apa": "Gilaie-Dotan, S. (2026). To replicate or not to replicate? My nine failures to publish a successful replication. https://doi.org/10.31234/osf.io/yrdc2_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録（Crossref経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "推奨される開示の作法に従って成功した追試が、2年半で9回不採択になった経緯を振り返った論考。追試の評価が、追試を重んじるという分野の建前に追いついていないと問う（未査読）。", "p3": "自分たちの以前のPNASの研究（画像の大きさと記憶）のオンラインでの追試と拡張を、事前の検出力分析や全条件・除外の完全な報告に従って投稿した経験を記述している（抄録）。", "p5": "原稿は、透明で成功した追試には理論的な新規性が足りないという理由で、2年半に9回不採択になった。追試という位置づけを大きく弱め、追加の分析と別の理論枠組みを前面に出して、ようやく採択された（抄録）。", "fun": "科学では「同じ実験をもう一度やって確かめる」追試が大切だと言われます。ところがこの研究室は、作法どおりの成功した追試を9回も門前払いされました。理由は「新しさが足りない」。確かめることの価値を口では認めながら、雑誌は新しさを求め続けている、という矛盾を突く記録です。", "unverified": "不採択の判定の内訳と、最終的な掲載先は未確認（本文を入手できず）。"}}, {"id": "pr50", "rank": 50, "headline": "社会シミュレーションを未来の結果で採点する", "title": "Social Simulation Arena: A Prospective Benchmark for Social Simulation", "url": "https://doi.org/10.5281/zenodo.23140106", "authors": "Li ほか", "venue": "Zenodo", "date": "2026-10-04", "apa": "Li, C. J., Liu, X., Shang, H., Zou, X., Mo, Z., Zhang, C. E., & Jiang, H. (2026). Social Simulation Arena: A Prospective Benchmark for Social Simulation (Version v0.1). Zenodo. https://doi.org/10.5281/ZENODO.23140106", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（DataCite経由）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "社会シミュレーションの予測を、結果が公表される前に提出させ、公表後に採点する前向きのベンチマーク（Social Simulation Arena）を提案した（Zenodoの未査読文書）。", "p3": "既存の評価は課題・集団・設定がまちまちで、ほとんどが過去のデータへの当てはめのため、比べにくく未来への汎化も分からない。そこで本物の未来に対して採点する手順を定め、最初の実施（シーズン0）では定期的な世論・心情の調査を対象にした（抄録）。", "p5": "シーズン0の設計を記録し、対象を広げる計画を示した。結果はまだなく、論文と著者の一覧は今後も更新されるとしている（抄録）。", "fun": "AIで作った「仮想の社会」は、本物の人々の考えを予測できるのでしょうか。過去のデータで当てても、答えを知ったうえでの後出しかもしれません。この研究は、結果が出る前に予測を出させて後で採点する、天気予報のコンテストのような仕組みを提案しました。後出しを封じるという点が肝です。", "unverified": "参加システムと予測の精度の結果は未確認（シーズン0の設計の記録で、結果は含まれない）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "交通・都市計画", "headline": "都市政策の効果は人の移動を通じて広がる", "title": "Human mobility shapes how urban policy effects spread across cities", "url": "https://arxiv.org/abs/2610.02639", "authors": "Bijin Joseph ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Joseph, B., Gibbs, H., Yabe, T., & Moro, E. (2026). Human mobility shapes how urban policy effects spread across cities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02639", "why": "ボストンとニューヨークの3つの交通施策を、距離ではなく人の移動網で効果の届く範囲を定義して評価した。距離で定義すると効果は見えないが、移動網で定義するとボストンの運賃無料化で活動が約16%増えた。", "explain": {"basis": "本文", "basis_note": "arXivの本文（3つの事例の結果、都市間の比較、考察と限界、方法の節）と図1〜5の説明を読んだ", "preprint": true, "p1": "都市政策の「影響を受ける範囲」を、距離ではなく人の移動のつながり（移動ネットワーク）で定義すると、評価の結論が大きく変わることを示した。3つの交通施策で、距離で見た結論と移動網で見た結論が食い違った（arXivの未査読プレプリント）。", "p2": "都市政策の評価では、効果は距離とともに弱まると仮定し、施策の近くを処置群、少し離れた輪を対照群にしがちだ。だが人は遠くへも移動するので、対照群も施策の影響を受け、効果が小さく見積もられる（§Introduction）。", "p3": "大規模な移動データで地区間の移動ネットワークを作り、Leidenアルゴリズムで移動のまとまりを検出した。施策に触れるまとまりを処置群、移動網の上で遠く人口構成の似たまとまりを対照群とし（ネットワーク距離法）、合成コントロールと差の差で効果を推定した（§Methods、図1C）。直観：バスに乗りに来る人が住む地区まで「影響を受けた側」に数える。", "p4": "同じデータで、地理的距離法（例：路線から1km以内を処置、2〜8kmの輪を対照）とネットワーク距離法を比べた。事例はボストンのバス無料化と、ニューヨークのオープン・ストリートと混雑課金で、訪問数・支出・所得階層ごとの変化を測った（§Results）。", "p5": "ボストンの28番路線の無料化は、地理的には有意な効果がなかった。移動網で見ると、処置地区の住民の訪問が15.65%、最も所得の低い層では23.00%増えた（図2D）。オープン・ストリートは3か所の店の訪問を23.50〜32.60%増やした（図3C）。混雑課金は地理的にはマンハッタンへの訪問を6.46%減らしたように見えたが、移動網では全体の訪問に有意な変化はなく、訪問先の構成が変わった（図4D）。8か国138都市でも、地理と移動網の距離は食い違った（図5）。", "p6": "著者は、移動の目的を区別しない点、移動網を施策の前後で固定とみなす点（前後の分割の一致は調整ランド指数0.96）、処置を2値で扱う点を限界に挙げる（§Discussion）。解釈：移動データの代表性（スマートフォンを持つ人の偏り）が、低所得層の効果の推定に影響しうる。", "fun": "バスの運賃を無料にした効果を、路線の近くと少し離れた町で比べたとします。ところが離れた町の
