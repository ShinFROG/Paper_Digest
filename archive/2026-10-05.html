9, "headline": "検査の内製化を1検査あたり原価で判断する", "title": "A-270 Integrating Financial Analysis and Project Management: Cost Optimization, Analytical Capacity Expansion, and Value Generation in Clinical Laboratories", "url": "https://doi.org/10.1093/clinchem/hvag086.219", "authors": "Jonas Oliveira ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Oliveira, J., Oliveira, G., Ferreira, A., Macedo, G., Fernandes, I., Escalante, I., Borges, C., Costa, P., Jacomo, R., & Nery, L. (2026). A-270 Integrating Financial Analysis and Project Management: Cost Optimization, Analytical Capacity Expansion, and Value Generation in Clinical Laboratories. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.219", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Clinical Chemistry誌の学会抄録（Crossref経由）を使用", "preprint": false, "p1": "ブラジルの大手検査グループで、外注していた検査の内製化を、直接費と間接費を積み上げた1検査あたり原価と外注価格の比較、設備投資計画、リスク管理などのプロジェクト管理と組み合わせて判断した。導入後に、費用の削減、分析能力の拡大、所要時間の短縮が得られた（学会抄録の事例研究）。", "p2": "検査室の財務の持続性は、運営費の上昇、技術の複雑化、検査項目の拡充の必要から重要になっている。新しい検査の内製化のような戦略的な決定には、技術的にできるかを超えた、構造的な財務評価とプロジェクト管理が要る（抄録）。", "p3": "内製化に伴う消耗品・人件費・設備の改修・機器の購入と保守の直接費と間接費を詳しく調べ、外注の市場価格と比べて、両方の場合の1検査あたり原価を出した。同時に、経済的な実現可能性の分析、設備投資の計画、リスク管理、導入の日程計画を行った（抄録）。", "p4": "導入後に、費用の削減、投資収益率、設備の稼働率、検査の所要時間で、財務と業務への影響を評価した。毎月の利得と投資の比較も追っている（抄録、図1）。", "p5": "費用の比較は内製の優位を示し、外注に伴っていた経常費用が大きく減った。資産の稼働率が上がり、新しい機器で分析能力が増え、検査項目も広がった。内製化は所要時間の短縮、予算計画の改善、財務の予測可能性の向上に寄与した。具体的な金額や削減率は抄録にない（抄録）。", "p6": "1つの検査グループの事例で、学会抄録のため数値の根拠は確かめられない。解釈：内製化の評価は固定費の配賦の方法で大きく変わるため、間接費の配賦の基準の確認が要る。", "fun": "病院の検査を外の会社に頼むか、自分たちでやるかは、機械の値段や人件費まで含めて計算しないと決められません。この研究は、1回の検査にかかる本当の費用を細かく積み上げて外注の値段と比べ、自前でやる方が得だと判断しました。実際に費用が減り、結果も早く出るようになりました。会計の計算が病院の経営判断を支える身近な例です。", "unverified": "1検査あたり原価と外注価格の具体的な数値、間接費の配賦方法は未確認（学会抄録のみ）。"}}, {"id": "jr10", "rank": 10, "headline": "AI自己効力感がwell-beingと革新行動を高める", "title": "AI Self-Efficacy and Innovative Work Behavior: The Mediating Roles of Human-AI Teaming, Task-Technology Fit, E-Leadership Support, and Well-being", "url": "https://doi.org/10.20473/sabr.v4i2.96890", "authors": "Biliza Namira Fani ほか", "venue": "Southeast Asian Business Review", "date": "2026-10-02", "apa": "Biliza Namira Fani, & Nurul Khaira. (2026). AI Self-Efficacy and Innovative Work Behavior: The Mediating Roles of Human-AI Teaming, Task-Technology Fit, E-Leadership Support, and Well-being. Southeast Asian Business Review, 4(2), 345–356. https://doi.org/10.20473/sabr.v4i2.96890", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（方法、結果、表1〜3、結論と限界）を読んだ", "preprint": false, "p1": "インドネシアで、リモートやハイブリッドの勤務でAIを使う従業員317人を調べた。AIを使いこなす自信（AI自己効力感）が、人とAIの協働、課題と技術の適合、上司のオンラインでの支援を通じてwell-beingを高め、well-beingが革新的な行動につながる経路を示した。", "p2": "背景：職場へのAI導入は仕事の進め方と働き手の経験を変えている。だが、AIへの自信がどんな社会的・技術的な条件を通じてwell-beingや革新的な行動につながるかは、十分に分かっていなかった。社会技術システム論に基づいて仮説を立てた（§1・2）。", "p3": "2026年5月26日〜6月5日のオンライン質問紙で集めた326件のうち、317件の有効回答を部分最小二乗の構造方程式モデル（PLS-SEM、SmartPLS 4.0）で分析した。直接効果と、ブートストラップによる間接効果を検定している。尺度は既存研究から借りた（§3・4）。", "p4": "測定モデルは外部負荷量、クロンバックのα、合成信頼性、AVE、HTMTで、構造モデルはR²、f²、VIF、経路係数で評価した（§4、表1〜3）。", "p5": "AI自己効力感から、人とAIの協働（β=0.847）、課題と技術の適合（0.836）、上司の支援（0.807）への経路が強かった。3つはwell-beingに正の影響（0.370、0.325、0.249）をもち、well-beingから革新的行動へは0.805だった（表3）。3つの媒介はいずれも有意で（間接効果0.313、0.271、0.201）、R²は0.648〜0.763だった（表2）。", "p6": "著者は、横断デザインと自己申告のため因果の解釈に限界があり、共通方法の偏りの可能性も認めている（§5）。解釈：経路係数が0.805〜0.847に達し、f²が2を超えるなど効果が非常に大きく、共通方法の偏りが結果を押し上げている可能性がある。目的的抽出で、若い事務職の多い標本である。", "fun": "AIを使いこなせる自信がある人ほど、AIと上手に仕事を分担でき、仕事の充実感が高く、新しいアイデアも出しやすい、という結果です。自信がそのまま効くのではなく、「AIとの協働」「仕事に合った道具」「上司の支え」という3つの道を通って充実感につながる、という整理です。ただし同じ人に一度に全部を聞いた調査なので、数字は大きく出やすい点に注意が要ります。", "unverified": "回答者を集めたオンライン媒体と、共通方法の偏りの統計的な検定の有無は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "AI感情分析で問い合わせ窓口の改善効果を測る", "title": "A-262 Real-World Evaluation of Service Flow Redesign Using Proprietary AI Sentiment Analysis in a Clinical Diagnostics Support Channel", "url": "https://doi.org/10.1093/clinchem/hvag086.212", "authors": "Rafael Jacomo ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Jacomo, R., Costa, A. C., Dourado, V., Araújo, A., Santos, N., Pereira, S., Silva, M., Nery, L., & Dias, A. (2026). A-262 Real-World Evaluation of Service Flow Redesign Using Proprietary AI Sentiment Analysis in a Clinical Diagnostics Support Channel. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.212", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Clinical Chemistry誌の学会抄録（Crossref経由）を使用", "preprint": false, "p1": "ブラジルの臨床検査会社の問い合わせ窓口で、WhatsAppの対話をAIで感情分類して算出する純感情スコア（NSS）を主な指標にし、業務・技術・人員管理の介入を行った3か月の経過を報告した。NSSは78.25%から93.33%に上がった（学会抄録）。", "p2": "それまで顧客体験の評価は、正式な苦情の記録だけに頼っており、利用者の実際の受け止めに鈍感だった。CSAT調査とAIの感情分析で顧客体験を継続的に測れるようになったことを受け、介入の効果を評価した（抄録）。", "p3": "2025年の3か月（原文は October–December）の観察的な縦断研究である。Genesys Cloud CXの音声分析で文字起こし・意味の分類・感情の採点を行い、書き起こしのそろったWhatsAppの対話を正・負・中立に自動で分類した。PythonでNSSなどを計算し、BIのダッシュボードで日ごとに可視化した（抄録）。", "p4": "主な結果はNSSの月ごとの推移で、品質とガバナンス、人員管理と能力計画、エンゲージメントと文化、研修と技術の4領域の介入の前後で比べた（抄録）。", "p5": "WhatsAppの対話は初月に51,492件、翌月に44,552件で、CSATのコメントは初月748件（うち肯定623件）、翌月455件（肯定405件）だった。NSSは初月78.25%、早期の介入後の翌月87.73%、介入を固めた最終月93.33%と段階的に上がった（抄録、図1）。", "p6": "対照群のない前後比較で、季節や問い合わせの内容の変化など他の要因と介入の効果を分けられない。解釈：介入には職員の入れ替えも含まれ、どの介入が効いたかは区別できない。AIの感情分類の精度の検証も抄録にない。", "fun": "問い合わせ窓口のお客さんの満足を、苦情の数ではなく、毎日の何万件ものやりとりをAIで「うれしそう・不満そう」と読み取って測る取り組みです。人の配置や研修を見直した3か月で、良い感情の割合が着実に増えました。苦情になる前の小さな不満まで拾える物差しがあると、改善の手を早く打てます。", "unverified": "AIの感情分類の精度と、NSSの具体的な算出式は未確認（学会抄録のみ）。"}}, {"id": "jr12", "rank": 12, "headline": "社内向けESGの見せかけと従業員のwell-being", "title": "Internal ESG greenwashing and employee well-being: the roles of procedural justice, trust and belonging in Greece and the United Kingdom", "url": "https://doi.org/10.1108/ccij-12-2025-0405", "authors": "Stefanos Balaskas ほか", "venue": "Corporate Communications: An International Journal", "date": "2026-10-03", "citescore": 6.3, "citescore_year": "2025", "apa": "Balaskas, S., & Yfantidou, I. (2026). Internal ESG greenwashing and employee well-being: the roles of procedural justice, trust and belonging in Greece and the United Kingdom. Corporate Communications: An International Journal, 1–26. https://doi.org/10.1108/ccij-12-2025-0405", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "ギリシャと英国の従業員837人の調査で、社内向けのESGの取り組みを見せかけ（グリーンウォッシング）と感じることや、手続き的公正、組織への信頼、所属感が、仕事のwell-beingとどう結びつくかを調べた。所属感が最も強く結びつき、国によって経路が違った。", "p2": "社内向けのESGの伝達は外部報告の問題として扱われがちである。従業員に向けた統治の問題として、見せかけの知覚や手続きの公正さが従業員のwell-beingにどうつながるかは十分に調べられていなかった（抄録）。", "p3": "横断調査のデータを部分最小二乗の構造方程式モデル（PLS-SEM）で分析した。信頼と所属感を経由する個別の間接効果をブートストラップで調べ、ギリシャと英国の多母集団比較も行った。特性としての皮肉さとESGの重要性も変数に含めている（抄録）。", "p4": "評価は、各変数とwell-beingの直接の関係、信頼と所属感を通じた間接効果、そして国の間での経路の違いである（抄録）。", "p5": "統合したモデルでは、所属感が仕事のwell-beingと最も強く直接結びついた。社内ESGの見せかけの知覚と手続き的公正もwell-beingと関係したが、信頼と所属感を通じた間接の関係は、統合モデルと国別モデルで異なった。一部の関係はギリシャと英国で違った。係数は抄録にない（抄録）。", "p6": "横断・自己申告のデザインで因果の順序は確立できず、縦断・実験・組織に埋め込んだデザインと、他の制度的な文脈への拡張が必要だと著者は述べる（抄録）。", "fun": "会社が「環境に優しい」と社内で言いながら実態が伴っていないと、社員はそれを見抜き、気持ちに影響します。ところがこの研究では、そうした見せかけより、「この職場の一員だ」という所属感の方が、働く人の幸福感に強く結びついていました。しかも、同じ問題でも国が違えば心の中の道筋が変わっていたのです。", "unverified": "係数の大きさと、国による違いの具体的な経路は未確認（本文を入手できず）。"}}, {"id": "jr13", "rank": 13, "headline": "建設業DXで管理層ごとに異なる能力ギャップ", "title": "Bridging leadership competency gaps across different management levels to enable digital transformation in the construction industry", "url": "https://doi.org/10.1108/ci-12-2025-0550", "authors": "Kaijun Yang ほか", "venue": "Construction Innovation", "date": "2026-10-04", "sjr": 0.895, "citescore": 10.7, "citescore_year": "2025", "apa": "Yang, K., Sunindijo, R. Y., Wang, C. C., & Zhang, S. (2026). Bridging leadership competency gaps across different management levels to enable digital transformation in the construction industry. Construction Innovation, 26(9), 343–368. https://doi.org/10.1108/ci-12-2025-0550", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "デジタル変革が進む建設業で、305人の調査から25のリーダーシップ能力の重要度と自己評価の実績を4つの管理層ごとに比べ、層ごとに異なる能力の不足を特定した。", "p2": "建設業のデジタル変革には適応的で効果的なリーダーシップが要る。だが、どの能力がどの管理層でどれだけ足りないかは明らかでなかった（抄録）。", "p3": "一般職・現場管理職・中間管理職・上級管理職の4層について、25の能力の重要度と自己評価の実績を調査し、改良した重要度・実績分析（IPA）で能力の不足と層ごとの型を特定した（抄録）。直観：重要なのにできていない能力が、育成の優先順位になる。", "p4": "評価は、各層で重要度が高いのに実績が低い能力（不足）の特定である（抄録）。", "p5": "一般職はコミュニケーションと戦略的な意識、現場管理職は調整・方針の実行・財務管理、中間管理職はイノベーションへの寛容さとデジタル戦略の解釈、上級管理職はデジタルリテラシー・チームの動機づけ・市場の調査と評価に不足があった。これをもとに、層別の能力育成の経路を提案した（抄録）。", "p6": "回答者の国・地域や各層の人数は抄録からは分からない。解釈：実績は自己評価で過大になりやすく、上司や部下による評価との比較が望ましい。", "fun": "会社のデジタル化を進めるとき、社長から新人まで同じ研修をすればよいわけではありません。この研究では、建設会社の役職ごとに足りない力が違っていました。上の立場ほどデジタルの知識、真ん中の立場ほど新しい試みへの寛容さ、現場の立場ほど調整や実行の力が不足していたのです。立場ごとに弱点が違うという見取り図です。", "unverified": "回答者の国・地域、各層の人数、改良したIPAの具体的な方法は未確認（本文を入手できず）。"}}, {"id": "jr14", "rank": 14, "headline": "LLMが語る循環経済の知識の信頼性と倫理", "title": "The circular economy, explained by AI", "url": "https://doi.org/10.1007/s44498-026-00192-z", "authors": "Piero Morseletto ほか", "venue": "Journal of Industrial Ecology", "date": "2026-10-04", "sjr": 1.741, "citescore": 12.0, "citescore_year": "2025", "apa": "Morseletto, P., & Bocken, N. (2026). The circular economy, explained by AI. Journal of Industrial Ecology. https://doi.org/10.1007/s44498-026-00192-z", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（序論、枠組みの各節の冒頭、緊張関係のまとめ、統治の節、結論、補足資料の説明）を読んだ", "preprint": false, "p1": "ChatGPTなどの大規模言語モデル（LLM）が、循環経済の知識を利用者に「説明」する仲介者になるとき何が問題になるかを、内容・変革・倫理の3次元の概念的な枠組みで整理した。統治の優先事項として、透明性・専門家の吟味・人の主体性・認識的な謙虚さを示した概念論文である。", "p2": "AIと循環経済の研究の多くは、AIを業務改善の道具として扱い、LLMが循環経済をどう説明するかはほとんど論じてこなかった。循環経済は定義や優先順位が争われる概念で、LLMの選び方がリサイクルなど既存の戦略を強調し、再使用や再生を見えにくくするおそれがある（§1）。", "p3": "LLMを「認識的な仲介者」（利用者と知識源の間で情報を選び整理する存在）と捉えた。内容の次元（パターンに基づく生成、不透明な知識源）、変革の次元（イノベーションや起業への影響）、倫理の次元（真偽への無関心、断定的な口調、道徳的主体性の欠如、人の説明責任）を論じている（§2、図1）。", "p4": "モデル性能のベンチマークや出力の系統的な実証ではなく、概念的な分析である。例示として、6つの公開LLMに「循環経済を定義できますか」と2025年に3回尋ねた回答を補足資料に載せている（§1・補足資料）。", "p5": "LLMは循環経済の知識への接近を広げ、探究を支えうる。だが、どの解釈がより支持されるかを独自に判断したり、直線型の経済の前提に異を唱えたり、環境・社会・経済の価値の釣り合いを決めたりはできない、と結論した（§2.4・4、図2）。統治の優先事項として、透明性、専門家の吟味、人の主体性、認識的な謙虚さを挙げた（§3）。", "p6": "実証はなく、6つのLLMへの問いかけも探索的な例示にとどまると著者は明記している。今後は、モデル・プロンプト・言語・利用の文脈をまたいだ実証や、専門家の判断との比較が必要だとする（§4）。", "fun": "分からないことをAIに聞くのは今や当たり前です。でもAIは、たくさんの説の中から「よく書かれているもの」を選んで答えがちです。この論文は、資源を使い捨てにしない循環経済を例に、AIの説明がリサイクルのようなおなじみの方法ばかりを目立たせ、もっと効果的かもしれない「再使用」を見えにくくするおそれを指摘しました。答えから何が抜け落ちるかを問う視点です。", "unverified": "補足資料にある6つのLLMの回答の中身は読んでいない。"}}, {"id": "jr15", "rank": 15, "headline": "高級ホテルの口コミは体験後の評価が大半", "title": "Post-consumption evaluations in luxury hospitality: a qualitative analysis of online customer reviews", "url": "https://doi.org/10.1108/ihr-07-2026-0076", "authors": "Özden ÖZLÜ", "venue": "International Hospitality Review", "date": "2026-10-03", "apa": "Özlü, Ö. (2026). Post-consumption evaluations in luxury hospitality: a qualitative analysis of online customer reviews. International Hospitality Review, 1–16. https://doi.org/10.1108/ihr-07-2026-0076", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "イスタンブールの高級ホテル5軒のTripAdvisorの口コミ250件を質的に分析し、口コミのほとんどが利用後の振り返りの評価（第二の真実の瞬間、SMOT）で占められることを示した。利用前の期待は、利用後の評価に埋め込まれた形でしか現れなかった。", "p2": "顧客の購買の旅（カスタマージャーニー）では、選ぶ瞬間（第一の真実の瞬間、FMOT）と利用後の評価（SMOT）が論じられてきた。オンラインの口コミの中で両者がどう表れ、次の客の旅にどう関わるかは十分に調べられていなかった（抄録）。", "p3": "250件の口コミをFMOTとSMOTの枠組みで符号化し、主題分析で各口コミを1つの主要な主題に割り当てる質的内容分析を行った（抄録）。直観：口コミの文章が「泊まる前の期待」を語っているのか、「泊まった後の評価」を語っているのかを一件ずつ見分ける。", "p4": "評価の軸は、口コミの中のFMOTとSMOTの割合、現れた主題の種類と頻度、そして期待が口コミの中でどう表れるかである（抄録）。", "p5": "250件のうち238件がSMOTのみ、12件がFMOTとSMOTの両方を含み、FMOTだけの口コミはなかった。13の主題が見つかり、サービスの質、個別のもてなしと従業員への言及、再訪の意図と愛着、推奨と電子口コミが目立った。客の語りでは、形のある豪華さより人による接客が強調されていた（抄録）。", "p6": "1都市5軒の口コミの質的な分析で、一般化には限界がある。公開されたSMOTの語りが次の客のFMOTに入り込むという仕組みは、著者自身が直接の実証を要する概念的な命題だと断っている（抄録）。解釈：口コミを書く客は満足や不満の強い人に偏りやすく、語りの分布をそのまま客全体の体験とは読めない。", "fun": "高級ホテルの口コミには、何が書かれているのでしょうか。豪華な部屋や設備の話かと思いきや、この研究で目立ったのは、スタッフの心づかいや名前を覚えてくれたといった「人の接客」の話でした。しかも口コミは泊まった後の振り返りがほぼすべてです。誰かの振り返りが、次の客が選ぶときの決め手になるという循環が見えてきます。", "unverified": "主題ごとの件数の内訳と、符号化の信頼性の検証は未確認（本文を入手できず）。"}}, {"id": "jr16", "rank": 16, "headline": "モード試験とFEモデル更新でPC梁の剛性変化を推定", "title": "Estimation of stiffness changes of post-tensioned concrete beams subjected to quasi-static loading through modal testing and finite element model updating", "url": "https://doi.org/10.1080/10589759.2026.2742415", "authors": "Akshat Dimri ほか", "venue": "Nondestructive Testing and Evaluation", "date": "2026-10-04", "citescore": 5.4, "citescore_year": "2025", "apa": "Dimri, A., & Chakraborty, S. (2026). Estimation of stiffness changes of post-tensioned concrete beams subjected to quasi-static loading through modal testing and finite element model updating. Nondestructive Testing and Evaluation, 1–29. https://doi.org/10.1080/10589759.2026.2742415", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、準静的な荷重を受けるポストテンション・コンクリート梁の剛性の変化を、モード試験と有限要素モデルの更新で推定した研究とみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、梁に荷重をかけて傷んでいく過程で、硬さの低下を「揺れの測定」からどこまで読み取れるか、です。叩いたときの響きで中の傷みを推し量る、打音検査を数式で精密にしたような発想です。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr17", "rank": 17, "headline": "検査の所要時間超過を待ち行列理論で損失換算", "title": "B-019 Operational and Economic Impact of Turnaround Time Target Exceedance in a High-Volume Automated Clinical Laboratory", "url": "https://doi.org/10.1093/clinchem/hvag086.352", "authors": "KyungYi Kim ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Kim, K., Kim, S., & Lee, S. G. (2026). B-019 Operational and Economic Impact of Turnaround Time Target Exceedance in a High-Volume Automated Clinical Laboratory. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.352", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "学会抄録（Clinical Chemistryの付録）を候補の収集時に取得して使用。本文は入手できず", "preprint": false, "short": true, "p1": "大規模な自動化検査室で、検査の所要時間（TAT）が目標を超えることの運用上・経済上の損失を待ち行列の考え方で換算し、三次医療機関で年2,000万ドル超の機会費用になると見積もった。", "p3": "月に1,182,419件の検査のデータで、救急検査は60分、通常検査は120分の目標と比べた。患者を在庫、TATを流れの時間とみなすリトルの法則で運用を模型化し、救急外来の滞在時間と入院日数の延長に換算した（抄録）。", "p5": "救急検査の42.1%が60分を超え、1件あたり平均8.4分の超過だった。超過は年に約255,500時間の累積の遅れで、約128人年の人員に当たる。救急外来の容量の損失と入院日数の延長を合わせ、年間の機会費用は基本の仮定で2,000万ドルを超えた（抄録）。", "fun": "検査結果が1件あたり数分遅れるだけなら、大した問題ではなさそうです。ところが、月に1,182,419件の検査で積み重なると、年に約128人分の働きに相当する遅れになりました。小さな遅れも、量が多ければ病院全体の大きな損失になる。在庫管理の理屈で病院を見た研究です。", "unverified": "機会費用の推計の仮定に対する感度は未確認（学会抄録のみで本文を入手できず）。"}}, {"id": "jr18", "rank": 18, "headline": "能動学習キュバチャでベイズモデル更新を効率化", "title": "Bayesian model updating via streamlined Bayesian active learning cubature", "url": "https://doi.org/10.1016/j.ymssp.2026.114995", "authors": "Pei-Pei Li ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-10-04", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Li, P.-P., Dang, C., Acevedo, C. H., Valdebenito, M. A., & Faes, M. G. R. (2026). Bayesian model updating via streamlined Bayesian active learning cubature. Mechanical Systems and Signal Processing, 261, 114995. https://doi.org/10.1016/j.ymssp.2026.114995", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ベイズのモデル更新で、対数尤度をガウス過程で近似する能動学習の方法（SBALC）を提案し、精度を落とさずにモデルの評価回数と計算時間を大きく減らした。", "p3": "モデルの証拠の推定をベイズ求積の問題とみなし、対数尤度にガウス過程の事前分布を置く。事後の平均と分散の関数だけで、証拠の推定量、停止の基準、学習関数を作った。証拠の誤差の上界も導いている（抄録）。", "p5": "4つの数値例で、既存の方法と比べて精度と効率を示した。モデルの評価回数と計算時間を、精度を損なわずに大きく減らせたとする（抄録）。", "fun": "橋の数値モデルを実測に合わせて調整するには、重い計算を何千回も繰り返すのが普通です。この研究は、計算結果の「地形」をガウス過程という予想図で描き、本当に計算すべき場所だけを選んで調べる方法を作りました。地図の空白を賢く埋めて、計算の回数を減らす発想です。", "unverified": "数値例の対象と、評価回数の削減の倍率は未確認（本文を入手できず）。"}}, {"id": "jr19", "rank": 19, "headline": "AI顧客対応の失敗がブランド関係を損なう", "title": "The dark side of AI customer service: How service failures damage consumer-brand relationships", "url": "https://doi.org/10.1016/j.jretconser.2026.105143", "authors": "Zhucheng Shao", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-04", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "apa": "Shao, Z. (2027). The dark side of AI customer service: How service failures damage consumer-brand relationships. Journal of Retailing and Consumer Services, 95, 105143. https://doi.org/10.1016/j.jretconser.2026.105143", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、AIを使った顧客対応で起きるサービスの失敗が、消費者とブランドの関係をどのように、どの程度損なうかを検討した研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、チャットボットの対応の失敗は、人間の店員の失敗と同じように許されるのか、それとも「やっぱり機械はだめだ」とブランド全体への不信につながるのか、です。サービス回復の研究をAIに広げる問いです。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr20", "rank": 20, "headline": "生成AIとの協働：局所的な増強と隠れた労働", "title": "GenAI-enabled human–AI collaboration: An integrative review of local augmentation, hidden work, and governable synergy", "url": "https://doi.org/10.1016/j.ijinfomgt.2026.103140", "authors": "Jian Liu ほか", "venue": "International Journal of Information Management", "date": "2026-10-04", "sjr": 5.899, "citescore": 54.4, "citescore_year": "2025", "apa": "Liu, J., Zhong, C., Meng, F., Shank, D. B., & Wunsch, D. C. (2027). GenAI-enabled human–AI collaboration: An integrative review of local augmentation, hidden work, and governable synergy. International Journal of Information Management, 92, 103140. https://doi.org/10.1016/j.ijinfomgt.2026.103140", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、生成AIと人間の協働について、局所的な能力の増強、見えにくい隠れた作業、統治可能な相乗効果という観点から既存研究を統合したレビューとみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、生成AIで仕事が楽になったように見えても、AIの出力を確かめたり直したりする「隠れた作業」が増えているのではないか、です。便利さの裏側にある見えない手間に光を当てる問いです。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr21", "rank": 21, "headline": "マーケティングの貢献は管理会計で示すべき", "title": "Looking for love in the wrong place: why marketers should focus on management accounting", "url": "https://doi.org/10.1108/mip-12-2025-0940", "authors": "Jonathan Knowles ほか", "venue": "Marketing Intelligence & Planning", "date": "2026-10-03", "citescore": 9.6, "citescore_year": "2025", "apa": "Knowles, J., Bendle, N. T., & Butt, M. N. (2026). Looking for love in the wrong place: why marketers should focus on management accounting. Marketing Intelligence & Planning, 1–16. https://doi.org/10.1108/mip-12-2025-0940", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "マーケティングの貢献が財務諸表に表れないという不満に対し、財務会計の規則を変えようとするより、管理会計に力を注ぐべきだと論じた概念研究。", "p3": "財務報告がマーケティングへの投資の要素を無視する理由と、それが変わりにくい理由を、マーケティングと財務会計の目的のずれから概念的に分析した（抄録）。", "p5": "近い将来に財務会計の規則が変わってマーケティングの価値が広く認められる見込みは低い。マーケターは財務会計ではなく管理会計に注力すべきで、とくにマーケティングが業績の主な原動力の業界で重要だとした（抄録）。", "fun": "広告やブランドづくりは会社の価値を生むのに、決算書では「費用」として消えてしまいます。マーケティング担当者はそれが不満です。この論文は、外向けの決算書のルールを変えようとするのは見当違いで、社内向けの管理会計で価値を示す方が近道だと説きました。題名どおり「恋の相手を間違えている」という指摘です。", "unverified": "管理会計での具体的な測り方の提案の詳細は未確認（本文を入手できず）。"}}, {"id": "jr22", "rank": 22, "headline": "地域ラジオの気候情報で女性や大家族が取り残される", "title": "Patterns of inclusion and exclusion in climate information access through community radio among smallholder farmers in Northern Ghana", "url": "https://doi.org/10.1007/s44279-026-00792-0", "authors": "Enoch Kwame Tham-Agyekum ほか", "venue": "Discover Agriculture", "date": "2026-10-03", "apa": "Tham-Agyekum, E. K., Nimoh, F., Assani, A. S., Maramura, T. C., Cheboi, J. J., Wainaina, R. W., & Bakang, J.-E. A. (2026). Patterns of inclusion and exclusion in climate information access through community radio among smallholder farmers in Northern Ghana. Discover Agriculture, 4(1). https://doi.org/10.1007/s44279-026-00792-0", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ガーナ北部の小規模農家1,200人で、地域ラジオを通じた気候情報の届き方に、女性や大家族が取り残される包摂と排除の型があることを示した。", "p3": "調査とキーパーソンへの聞き取りを組み合わせた混合研究で、物理的・経済的・制度的など複数の面の情報への接しやすさを分析した（抄録）。", "p5": "58.08%が毎日、気候に関する放送を聞いていた。女性は物理的・経済的・制度的な接しやすさが低く、大家族も低かった。信用へのアクセスは4つの面すべてと負に関連し、普及指導員への接触と高い所得は接しやすさを高めた（抄録）。", "fun": "天気や農業の情報をラジオで流せば、みんなに届くように思えます。ところがこの調査では、女性や大家族の農家ほど情報から取り残されていました。誰でも聞けるはずの放送でも、聞ける時間、機械、つながりに差があると、届き方に差が出るのです。", "unverified": "信用へのアクセスが負に働く理由の分析は未確認（本文を入手できず）。"}}, {"id": "jr23", "rank": 23, "headline": "保育施設長の包摂的リーダーシップを3因子で測る", "title": "Inclusive leadership in Finnish early childhood education centres – leading pedagogy, professional development and the community", "url": "https://doi.org/10.1108/ijem-03-2026-0311", "authors": "Lauri Heikonen ほか", "venue": "International Journal of Educational Management", "date": "2026-10-03", "citescore": 6.0, "citescore_year": "2025", "apa": "Heikonen, L., Fonsén, E., Pihlaja, P., & Viljamaa, E. (2026). Inclusive leadership in Finnish early childhood education centres – leading pedagogy, professional development and the community. International Journal of Educational Management, 40(8), 179–193. https://doi.org/10.1108/ijem-03-2026-0311", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "フィンランドの保育施設の長116人で、包摂的リーダーシップの尺度を翻訳・調整し、教育の過程を導く、包摂的な共同体をつくる、職員の成長を導くという3つの次元を見いだした。", "p3": "包摂的リーダーシップの尺度を翻訳・調整して公立・私立の施設長に実施し、探索的因子分析で構造を調べて尺度を簡潔にした（抄録）。", "p5": "施設長は包摂的な保育の実践と職員の能力開発を最も強く支えていたが、地域との協働は少なかった。公立と小規模な施設は地域志向の実践が多く、私 ulation. Sustainability, 18(19), 10071. https://doi.org/10.3390/su181910071", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "中国の南水北調の西ルート沿いの大規模な地すべりで、短期の降雨は浅い湿潤を支配する一方、深い地すべりの再活動は既存のすべり面に沿った水頭の上昇と強く関わることを示した。", "p3": "岷江上流の地すべり（平面積は約8.6×10^4 m²）を対象に、UAVの斜め写真測量、3次元の地質モデル、FLAC3Dの数値解析を組み合わせた。1次元の浸透解析で降雨の影響深さを抑え、すべり面の水頭を変えた想定で安定を評価した（抄録）。", "p5": "自然状態の安全率は強度低減法で1.656だった。24時間の降雨の影響深さは日20mmで約0.43m、日150mmで1.00mだった。水頭1.0〜2.25mでは安全率は約1.64を保ったが、2.5m以上で持続的なすべりが生じ、移行の範囲は約2.25〜2.50mだった（抄録）。", "fun": "大雨のあとに大きな地すべりが動くのは、雨水が地面にしみ込むからだと考えがちです。この研究の解析では、1日の雨がしみ込むのはせいぜい1mほどでした。深いところのすべりを動かすのは、すべり面に沿って上がる水の圧力の方でした。表面の雨と深い水を分けて考える必要があるわけです。", "unverified": "解析に使った地盤の強度定数と、現地の観測との照合は未確認（本文を入手できず）。"}}, {"id": "jr26", "rank": 26, "headline": "医師・看護師の満足調査に必要な最小標本数", "title": "A-264 Identifying the minimum absolute sample size to estimate indicators of patient experience, mitigating variability and improving the statistical reliability of physicians’ and nurses’ experience surveys in Brazilian hospitals", "url": "https://doi.org/10.1093/clinchem/hvag086.214", "authors": "Rafael Jacomo ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Jacomo, R., Normandes, J. L., Alves, C., Silva, A., de Almeida Almeida, M. R. S., Pereira, S., Silva, M., Nery, L., & Dias, A. (2026). A-264 Identifying the minimum absolute sample size to estimate indicators of patient experience, mitigating variability and improving the statistical reliability of physicians’ and nurses’ experience surveys in Brazilian hospitals. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.214", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "学会抄録（Clinical Chemistryの付録）を候補の収集時に取得して使用。本文は入手できず", "preprint": false, "short": true, "p1": "病院の検査部門を使う医師・看護師の満足度（NPSとCSAT）が安定する最小の回答数を変化点回帰で求め、月12〜20件という運用目標を示した。", "p3": "2021〜2025年に21部署から集めた有効回答1,660件を部署×月で集計し、回答数と指標の平均・標準偏差の関係に、重みつき最小二乗の区分線形回帰を当てはめて変化点を探した（抄録）。", "p5": "変化点はCSATで月20件、NPSで月12件だった。そこから月12〜20件（年144〜240件）を運用目標とし、医師と看護職をほぼ半々として、それぞれ月6〜10人を推奨した（抄録）。", "fun": "満足度アンケートは、回答が少ないと数字が大きく揺れます。では何人に答えてもらえば安心なのでしょうか。この研究は、回答数を増やしていくと揺れが急に落ち着く「曲がり角」を統計で探し、月12〜20件という目安を出しました。感覚で決めがちなアンケートの規模を、データで決めた例です。", "unverified": "変化点の推定の不確かさ（信頼区間）は未確認（学会抄録のみで本文を入手できず）。"}}, {"id": "jr27", "rank": 27, "headline": "ヒヤリ報告の表彰制度が改善提案を増やした4年間", "title": "A-283 From idea to impact: A recognition program to encourage laboratory staff to report “good catches” and strengthen the culture of continuous improvement in the clinical laboratory", "url": "https://doi.org/10.1093/clinchem/hvag086.231", "authors": "Lisa Rossini", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Rossini, L. (2026). A-283 From idea to impact: A recognition program to encourage laboratory staff to report “good catches” and strengthen the culture of continuous improvement in the clinical laboratory. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.231", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "学会抄録（Clinical Chemistryの付録）を候補の収集時に取得して使用。本文は入手できず", "preprint": false, "short": true, "p1": "メイヨー・クリニックの中央検査室で、職員が改善の提案や誤りの未然の発見（グッドキャッチ）を報告すると表彰する制度の4年間の効果を調べ、多くの提案が実行に移されたことを示した。", "p3": "2022年1月〜2025年12月のすべての提案とグッドキャッチを記録し、件数、受賞者、検査の段階や分野ごとの内訳、提出から完了までの期間を集計した（抄録）。", "p5": "4年間で219件の提出に236の賞が48人に贈られた。内訳はグッドキャッチ75件、改善提案140件、両方4件だった。改善提案のうち54%が実行・完了し、34%が進行中、12%は実行されなかった（抄録）。", "fun": "職場で「危なかった」を報告するのは、自分の失敗を認めるようで気が引けます。この検査室は、それを表彰の対象に変えました。4年間で219件の報告と提案が集まり、改善の提案の54%が実行・完了しました。ミスの報告を責めるのでなく称える仕組みが、改善の文化を育てた例です。", "unverified": "表彰の前後での誤りの件数の変化は未確認（学会抄録のみで本文を入手できず）。"}}, {"id": "jr28", "rank": 28, "headline": "指針を参照させるとLLMの回答の一貫性が向上", "title": "Guideline‐augmented prompting improves comparative preference and response consistency of large language model outputs for orthopaedic anaesthesia questions: A controlled prompting study", "url": "https://doi.org/10.1002/jeo2.70922", "authors": "Anita Széll ほか", "venue": "Journal of Experimental Orthopaedics", "date": "2026-10-03", "citescore": 3.0, "citescore_year": "2025", "apa": "Széll, A., Yu, Y., Oeding, J. F., Oettl, F. C., Piasecki, A., Dalla, K., Siöland, T., Hård af Segerstad, M., Olsen, F., Larsson, P., Zaffagnini, S., Samuelsson, K., & Hessulf, F. (2026). Guideline‐augmented prompting improves comparative preference and response consistency of large language model outputs for orthopaedic anaesthesia questions: A controlled prompting study. Journal of Experimental Orthopaedics, 13(4). https://doi.org/10.1002/jeo2.70922", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "整形外科麻酔の34問で、LLMの回答は世代が新しいほど人間の専門医より好まれ、診療指針を参照させると選好と回答の一貫性が改善した。", "p3": "GPT-3.5-turbo・GPT-4o・GPT-5.2と麻酔科専門医3人が7つの領域の34問に答え、GPT-4oとGPT-5.2は指針の参照ありとなしで答えた。指針を参照するLLM審判（GPT-5.2）が、匿名化した回答を盲検の対比較で評価した（抄録）。", "p5": "指針なしでも全LLMが専門医より好まれ、勝率は67.6%・79.4%・95.1%だった。指針の参照でGPT-4oは91.2%（+11.8ポイント）に上がり、GPT-5.2は97.1%と上限に近づいた。GPT-5.2の一貫性は66.7%から80.4%に上がった（抄録）。", "fun": "AIに医師の試験問題を解かせると、新しい世代ほど専門医より好まれる答えを出しました。ところが採点したのも別のAIです。AIがAIを高く評価している可能性は残ります。指針を手元に置かせると答えがそろうという結果は、人間にもAIにも共通の教訓かもしれません。", "unverified": "人間の専門家による評価との一致は未確認（採点はLLM審判のみ、本文を入手できず）。"}}, {"id": "jr29", "rank": 29, "headline": "4つのLLMの健康助言を採点、正確さに大差", "title": "Evaluating Harm Reduction Advice From Large Language Models", "url": "https://doi.org/10.1111/dar.70272", "authors": "Khy Choo ほか", "venue": "Drug and Alcohol Review", "date": "2026-10-02", "citescore": 5.0, "citescore_year": "2025", "apa": "Choo, K., Smith, N., Ward, B., & Lundin, R. M. (2026). Evaluating Harm Reduction Advice From Large Language Models. Drug and Alcohol Review, 45(7). https://doi.org/10.1111/dar.70272", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "薬物使用に伴う害を減らすための健康情報を、4つのLLMがどれだけ正確に答えるかを採点し、モデルによって正確さに大きな差があることを示した。", "p3": "採点の基準表を作り、薬物使用の害の低減に関する一般的な情報、状況に応じた質問、地域の支援サービスの案内について、4つのLLMの回答を評価した（抄録）。", "p5": "得点はGemini 2.5 Flashが87%、ChatGPT-4oが77%で、DeepSeek R1 Distill Llama 3.3 70Bの22%、Llama 4の18%を大きく上回った。上位2つは地域の支援サービスも正確に案内した。一部のモデルは誤情報を生成した（抄録）。", "fun": "健康の悩みをAIに相談する人が増えています。この研究は、支援が届きにくい人たち向けの健康情報について、AIによって正確さが8割台から2割以下まで大きく違うことを示しました。どのAIに聞くかで受け取る情報の質が変わる。対面の専門家による相談の大切さも改めて示しています。", "unverified": "採点の基準表の詳細と、採点者間の一致は未確認（本文を入手できず）。"}}, {"id": "jr30", "rank": 30, "headline": "地域団体と組んだ無料検査で健康格差に挑む", "title": "A-408 Advancing health equity through point-of-care testing for cardiometabolic and renal risk via laboratory–community partnership", "url": "https://doi.org/10.1093/clinchem/hvag086.332", "authors": "Jennifer Nelson-Storlie ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "apa": "Nelson-Storlie, J., Baulckim, T., Elegbede, W., Hartman, L., Hasadsri, L., & Katzman, B. (2026). A-408 Advancing health equity through point-of-care testing for cardiometabolic and renal risk via laboratory–community partnership. Clinical Chemistry, 72(Supplement_1). https://doi.org/10.1093/clinchem/hvag086.332", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "学会抄録（Clinical Chemistryの付録）を候補の収集時に取得して使用。本文は入手できず", "preprint": false, "short": true, "p1": "メイヨー・クリニックの検査部門と地域の団体（NAACPの支部）が組み、黒人の祝日の催しで無料の簡易検査と健康相談を行った取り組みの報告。信頼される地域の場で検査を届ける方法を示した。", "p3": "2025年6月の催しで、ポスターと公開の健康講座で周知し、移動検診車で採血して、HbA1c・脂質・クレアチニンを簡易検査で測った。現地の医師が結果を説明し、事後の調査で参加者への影響を尋ねた（抄録）。", "p5": "参加は51人（年齢の中央値42歳、18〜81歳）で、62%が女性、27.5%が黒人だった。心代謝の異常が高い割合で見つかった（抄録）。", "fun": "病院に行きにくい人に健康診断を届けるには、病院の外へ出ていくのが近道です。この取り組みでは、地域の団体と組んでお祭りの会場で無料検査を行い、多くの人に異常が見つかりました。採血の担当者が、検査の技術だけでなく信頼の橋渡し役になったという報告が印象的です。", "unverified": "異常の割合の具体的な数値と、事後の受診につながった割合は未確認（学会抄録のみで本文を入手できず）。"}}, {"id": "jr31", "rank": 31, "headline": "自然基盤と排水施設の併用で浸水箇所が約3分の1に", "title": "Evaluación de soluciones basadas en la naturaleza y obras grises en el drenaje pluvial urbano de la “Torrentera Duralit” Evaluation of Nature-Based Solutions and Gray Infrastructure for Urban Stormwater Drainage in the “Duralit Watercourse”", "url": "https://doi.org/10.23881/idupbo.026.1-8i", "authors": "Dayana F. Aramburo Zegarra ほか", "venue": "Revista Investigación & Desarrollo", "date": "2026-10-02", "apa": "Aramburo Zegarra, D. F., Ureña Camacho, J. E., & Saavedra Valeriano, O. C. (2026). Evaluation of Nature-Based Solutions and Gray Infrastructure for Urban Stormwater Drainage in the “Duralit Watercourse”. Revista Investigación & Desarrollo, 26(1), 144–162. https://doi.org/10.23881/idupbo.026.1-8i", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ボリビアの都市の水路の周辺で、自然を活用した対策（NBS）と従来の排水施設を組み合わせると、浸水の箇所が約3分の1に減ることを、雨水の流出モデルで示した。", "p3": "コチャバンバ県の「Duralit水路」の周辺で水文・水理の特性を調べ、EPA SWMM 5.2で、現状、NBSだけ、NBSと雨水桝・貯留槽・既存施設の改良を組み合わせた案を比べた（抄録）。", "p5": "NBSだけでは浸水の一部しか減らなかった。組み合わせた案が最も良く、浸水した節点は31から10へ67.7%減り、浸水の総量は7.971×10^6 Lから1.487×10^6 Lへ81.3%減った（抄録）。", "fun": "都市の浸水対策では、緑地や浸透ますのような「自然の力」が注目されています。でもこの研究の模擬では、自然の対策だけでは足りず、昔ながらの排水施設と組み合わせて初めて浸水が大きく減りました。緑かコンクリートかではなく、両方を組み合わせるのが現実的だという結論です。", "unverified": "想定した降雨の規模と、組み合わせ案の費用は未確認（本文を入手できず）。"}}, {"id": "jr32", "rank": 32, "headline": "区分アフィン系を2段階の学習で同定", "title": "A Two-Stage Learning Framework for Piecewise Affine System Identification", "url": "https://doi.org/10.1016/j.isatra.2026.09.038", "authors": "Mohammad Lotfi ほか", "venue": "ISA Transactions", "date": "2026-10-04", "sjr": 1.458, "citescore": 13.9, "citescore_year": "2025", "apa": "Lotfi, M., Menhaj, M. B., Karrari, M., & Haeri, M. (2026). A Two-Stage Learning Framework for Piecewise Affine System Identification. ISA Transactions. https://doi.org/10.1016/j.isatra.2026.09.038", "them tion firms to overcome the challenges of adopting Industry 4.0: an Australian perspective. Construction Innovation, 26(9), 421–445. https://doi.org/10.1108/ci-11-2025-0478", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "オーストラリアの建設企業がIndustry 4.0の導入の壁を越えるための実践的な戦略を、導入経験者19人への聞き取りから整理した。", "p3": "目的的抽出と雪だるま式抽出で選んだ役員・管理職・イノベーション担当者らに半構造化面接を行い、技術・組織・環境の枠組みで内容分析した（抄録）。", "p5": "技術的な制約、組織の抵抗、関係の不足が主な阻害要因だった。変革を進める公式の統治と、職務ごとの価値を実証で示すことの二層の対応が要る。トップダウンのリーダーシップによるデジタル文化づくり、統一した標準、リスクと資源を分け合う戦略的な提携も鍵だった（抄録）。", "fun": "建設現場のデジタル化は、技術はあっても現場に根づきません。この研究は、導入に成功した人たちの話から、技術の問題以上に「本当に自分の仕事に役立つのか」を示すことと、組織として変化を進める仕組みが大切だと整理しました。新しい道具は、使う人の納得なしには広がらないのです。", "unverified": "聞き取り対象の企業の規模の内訳は未確認（本文を入手できず）。"}}, {"id": "jr35", "rank": 35, "headline": "反論できない論者としてのLLMと議論上の不正義", "title": "The Unanswerable Arguer: Large Language Models, Argumentative Injustice, and the Structural Displacement of Epistemic Standing", "url": "https://doi.org/10.1007/s11245-026-10504-4", "authors": "Yu Zhang", "venue": "Topoi", "date": "2026-10-04", "sjr": 0.63, "citescore": 3.1, "citescore_year": "2025", "apa": "Zhang, Y. (2026). The Unanswerable Arguer: Large Language Models, Argumentative Injustice, and the Structural Displacement of Epistemic Standing. Topoi. https://doi.org/10.1007/s11245-026-10504-4", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、反論しても応答が尽きないLLMを「答えようのない論者」として捉え、議論における不正義と、人間の認識上の立場が構造的に押しのけられる問題を論じた哲学の論文とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、どれだけ反論しても疲れずに言い返してくるAIと議論するとき、人間は対等な議論の相手でいられるのか、です。議論の勝ち負けが中身ではなく体力で決まってしまう危うさを問う、哲学の論点です。", "unverified": "論証の内容と結論はすべて未確認（題名のみ）。"}}, {"id": "jr36", "rank": 36, "headline": "CBTに基づく多エージェントの心理相談システム", "title": "DHCBT: a digital human psychological counseling system with a CBT multi-agent framework", "url": "https://doi.org/10.1038/s41598-026-73798-9", "authors": "Litun Tan ほか", "venue": "Scientific Reports", "date": "2026-10-04", "citescore": 6.4, "citescore_year": "2025", "apa": "Tan, L., Li, Z., Huang, Y., Liu, J., Ni, M., Wang, S., Che, J., & Chen, K. (2026). DHCBT: a digital human psychological counseling system with a CBT multi-agent framework. Scientific Reports. https://doi.org/10.1038/s41598-026-73798-9", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、認知行動療法（CBT）に基づく多エージェントの枠組みで動く、デジタルヒューマンによる心理相談のシステムを提案した研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、認知行動療法の手順を複数のAIの役割に分けて担わせれば、画面の中の人物が一貫した心理相談をできるか、です。役割を分けるという多エージェントの考え方を、相談という人間的な場面に持ち込む試みです。", "unverified": "システムの評価の方法と結果はすべて未確認（題名のみ）。"}}, {"id": "jr37", "rank": 37, "headline": "送粉者の生息指標で緑地設計を支える生成AI", "title": "A generative AI decision-making tool for interactive greenspace design using a pollinator habitat indicator", "url": "https://doi.org/10.1016/j.landurbplan.2026.105808", "authors": "Corey Dawson ほか", "venue": "Landscape and Urban Planning", "date": "2026-10-04", "sjr": 2.952, "citescore": 19.6, "citescore_year": "2025", "apa": "Dawson, C., Kupferschmidt, C., & Manning, P. (2027). A generative AI decision-making tool for interactive greenspace design using a pollinator habitat indicator. Landscape and Urban Planning, 278, 105808. https://doi.org/10.1016/j.landurbplan.2026.105808", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN版の記録（Crossref）から抄録を取得して使用。本文は入手できず", "preprint": false, "short": true, "p1": "生成AIで緑地の設計案を素早く何通りも作り、送粉者の生息に役立つ度合いの指標（PHI）で順位づけする設計支援の道具を作り、人が関わりながら案を絞り込む流れを示した。", "p3": "文章から画像を作る生成の手順と、生息に役立つ景観要素の構成比と空間配置で採点する生態の指標を組み合わせた。美的な好みの順位、PHIの得点、補助の景観指標で案を共同で評価する実験の設計を示した（抄録）。", "p5": "道具は空間の形と動線の論理をよく解釈し、まとまりのある植栽の配置と使いやすい動線をもつ案を生成した。人が指示や目標を修正して案を磨く、人が介在する意思決定の流れとして設計されている（抄録）。", "fun": "公園の設計では、美しさと生き物のすみやすさの両立が課題です。この研究は、AIに設計図を何十通りも描かせ、ハチやチョウにとってのすみやすさで点数をつける道具を作りました。最後に決めるのは人間で、AIは案を出す係です。AIと人の役割分担のよい例です。", "unverified": "実際の利用者による評価の結果は未確認（実験の設計の提示で、本文を入手できず）。"}}, {"id": "jr38", "rank": 38, "headline": "XGBoost-SHAPで液状化の側方流動を地域評価", "title": "An Interpretable XGBoost-SHAP framework for rapid regional assessment of liquefaction-induced lateral spreading in mildly sloping ground", "url": "https://doi.org/10.1016/j.compgeo.2026.108713", "authors": "Zhijian Qiu ほか", "venue": "Computers and Geotechnics", "date": "2026-10-04", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Qiu, Z., Zayed, M., Gao, J., & Zheng, Y. (2027). An Interpretable XGBoost-SHAP framework for rapid regional assessment of liquefaction-induced lateral spreading in mildly sloping ground. Computers and Geotechnics, 203, 108713. https://doi.org/10.1016/j.compgeo.2026.108713", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、緩やかな傾斜地で液状化が引き起こす側方流動を、解釈可能なXGBoostとSHAPで地域規模で素早く評価する枠組みを提案した研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、地震で液状化した地面が横へ流れ出す危険を、詳しい数値解析をせずに広い地域で素早く見積もれるか、です。機械学習の答えにSHAPで理由を添えることで、防災の判断に使える形にする狙いがうかがえます。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr39", "rank": 39, "headline": "高次元モデルと縮約で二重ロータの振動を解析", "title": "Vibration Characteristics of Dual-Rotor Bearing System with Coupling Misalignment Based on High-Dimensional Modeling and Model Reduction", "url": "https://doi.org/10.1016/j.ast.2026.113995", "authors": "Wentao Zhang ほか", "venue": "Aerospace Science and Technology", "date": "2026-10-04", "sjr": 1.391, "citescore": 10.3, "citescore_year": "2025", "apa": "Zhang, W., Lu, K., Xu, D., Zhang, Y., Yang, Y., & Fu, C. (2026). Vibration Characteristics of Dual-Rotor Bearing System with Coupling Misalignment Based on High-Dimensional Modeling and Model Reduction. Aerospace Science and Technology, 113995. https://doi.org/10.1016/j.ast.2026.113995", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、継手の芯ずれがある二重ロータ・軸受系の振動特性を、高次元のモデル化とモデル縮約によって解析した研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、2本の回転軸をつなぐ継手がわずかにずれているとき、どんな揺れが生まれるかを、精密だが重いモデルと軽い縮約モデルの両方で捉えられるか、です。精度と計算の軽さの両立は、振動の解析の共通の課題です。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr40", "rank": 40, "headline": "医療従事者の職場での繁栄とwell-being", "title": "Thriving at work, decent work, and motivation as pathways to employee well-being and work fulfilment: Study among healthcare workers", "url": "https://doi.org/10.1016/j.actpsy.2026.107926", "authors": "Endang Parahyanti ほか", "venue": "Acta Psychologica", "date": "2026-10-04", "sjr": 0.918, "citescore": 3.4, "citescore_year": "2025", "apa": "Parahyanti, E., Dewayani, K., Salendu, A., Karima, B. A., Salsabila, A., & Irene, B. (2026). Thriving at work, decent work, and motivation as pathways to employee well-being and work fulfilment: Study among healthcare workers. Acta Psychologica, 270, 107926. https://doi.org/10.1016/j.actpsy.2026.107926", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、医療従事者を対象に、職場での繁栄、ディーセント・ワーク、動機づけが、従業員のwell-beingと仕事の充実につながる経路を検証した研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、医療の現場で人がいきいき働けるのは、給料や待遇といった「まっとうな仕事」の条件か、それとも成長している実感か、です。いくつもの道筋を同時に比べることで、何に投資すべきかが見えてきます。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr41", "rank": 41, "headline": "孤立と孤独がデジタル空間の危険行動を招く", "title": "Social isolation, loneliness, and unsafe behavior in the digital environment", "url": "https://doi.org/10.17759/jmfp.2026150302", "authors": "T.N. Berezina ほか", "venue": "Journal of Modern Foreign Psychology", "date": "2026-10-02", "apa": "Berezina, T. N., Finogenova, T. A., & Simonova, M. M. (2026). Social isolation, loneliness, and unsafe behavior in the digital environment. Современная Зарубежная Психология, 15(3), 17–28. https://doi.org/10.17759/jmfp.2026150302", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "デジタル空間での危険な行動の心理的な要因を文献から整理し、社会的孤立と孤独がその要因として、どこで、どのように働くかを位置づけた。", "p3": "Google ScholarとResearchGateで探し、Scopus・Web of Science・PubMed・eLIBRARY.RUに収録された46本を選んで、著者自身の危険行動のモデルで解釈する体系的な分析を行った（抄録）。", "p5": "危険な行動を、決められた規則や安全策から外れる行為と定義した。デジタル空間には特有の危険があり、情緒的な孤独は、怪しい相手との交流や詐欺の被害などにつながる要因として挙げられた（抄録）。", "fun": "寂しさは、ネット上での判断を誤らせることがあります。この研究は46本の論文を整理し、孤独な人ほど見知らぬ相手を信じやすく、詐欺などの危険に近づきやすいことをまとめました。ネットの安全対策は、パスワードの強さだけでなく、心の状態にも目を向ける必要があるわけです。", "unverified": "文献の選び方の基準と、要因ごとの根拠の強さは未確認（本文を入手できず）。"}}, {"id": "jr42", "rank": 42, "headline": "スラムで子育てする若い母親たちの経験", "title": "Lived Experiences of Young Mothers Parenting in Urban Slums: Evidence from Ghana", "url": "https://doi.org/10.1007/s40609-026-00492-z", "authors": "Portia Nana Ama Brempong ほか", "venue": "Global Social Welfare", "date": "2026-10-03", "citescore": 3.2, "citescore_year": "2025", "apa": "Brempong, P. N. A., Mort, K. S.-T., Abbey, E., Eduaful, S., Afram, P., Mensah, M., Agyemang, F. A., Kotei, P. N. K., & Ayeh, A. F. L. (2026). Lived Experiences of Young Mothers Parenting in Urban Slums: Evidence from Ghana. Global Social Welfare. https://doi.org/10.1007/s40609-026-00492-z", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ガーナ・アクラの2つの非公式居住地で子育てする18〜35歳の若い母親20人の経験から、医療・住まい・教育の制約の中での子育ての実情を描いた。", "p3": "子育てへの生態学的な影響の枠組みに沿って、解釈的現象学的分析で、子どもの医療、住まい、教育の経験を聞き取った（抄録）。", "p5": "母親たちは、子どもの病気の繰り返し、公的な医療の受けにくさ、過密で浸水しやすい住環境、学費の壁を語った。選択肢が限られる中でも資源をやりくりし、子の教育への望みを保っていた。居住地の種類は困難の強さを変えたが、本質は変えなかった（抄録）。", "fun": "「希望のスラム」と「絶望のスラム」と呼ばれる2つの地区で、若い母親たちの子育てを聞き取った研究です。厳しさの度合いは地区で違っても、病気・住まい・学費という壁の中身は同じでした。それでも母親たちは、子どもの教育への望みを手放していませんでした。", "unverified": "聞き取りの期間と、分析の手順の詳細は未確認（本文を入手できず）。"}}, {"id": "jr43", "rank": 43, "headline": "UAV画像で路面の材料を分類", "title": "Road surface material classification from unmanned aerial vehicle red, green, blue and multispectral imagery using spectral features and ensemble machine learning model", "url": "https://doi.org/10.12913/22998624/226062", "authors": "Marcin Bilski", "venue": "Advances in Science and Technology Research Journal", "date": "2026-10-04", "citescore": 2.5, "citescore_year": "2025", "apa": "Bilski, M. (2026). Road surface material classification from unmanned aerial vehicle red, green, blue and multispectral imagery using spectral features and ensemble machine learning model. Advances in Science and Technology Research Journal, 20(11), 331–351. https://doi.org/10.12913/22998624/226062", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、ドローンで撮ったRGBとマルチスペクトルの画像から、分光の特徴量とアンサンブル機械学習で、路面の材料を分類した研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、空から撮った画像の色の違いだけで、道路がアスファルトか、コンクリートか、砂利かを見分けられるか、です。道路の台帳づくりや点検を、上空からの撮影で効率よく進める発想です。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jr44", "rank": 44, "headline": "学校を窓口にした食料支援の周知策を比較", "title": "Promising Practices to Promote Snap at Schools: A Quantitative Analysis of Snap Outreach Efforts", "url": "https://doi.org/10.1111/josh.70255", "authors": "Jennifer Salt Taylor ほか", "venue": "Journal of School Health", "date": "2026-10-04", "sjr": 0.665, "citescore": 3.6, "citescore_year": "2025", "apa": "Taylor, J. S., Koch, K., DeSimone, J., Kairios, R., & Jones, V. (2026). Promising Practices to Promote Snap at Schools: A Quantitative Analysis of Snap Outreach Efforts. Journal of School Health, 96(10). https://doi.org/10.1111/josh.70255", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "米国の12学区で、学校を窓口に食料支援（SNAP）を偏見なく周知する取り組みを行うと、保護者のSNAPの知識が有意に増えた。", "p3": "学区ごとに偏見を伴わない周知の催しを行い、37回で8,601人に届けた。保護者の知識と認識を、事後に事前を振り返る形のオンライン調査で尋ね、記述統計とカイ二乗検定で分析した（抄録）。", "p5": "回答した保護者1,144人で、給付の内容、受給資格、申請の場所、受けられる支援についての知識が有意に増えた（p<0.001）。地域の団体と組むと、学校の職員の負担を抑えつつ支援を強められた（抄録）。", "fun": "食料の支援制度があっても、使える家庭の多くが申し込んでいません。「施しを受けるのは恥ずかしい」という気持ちも壁です。この研究は、学校という身近で偏見の少ない場所で制度を知らせると、保護者の知識が増えることを示しました。支援を届けるには、届け方の場所選びが大切なのです。", "unverified": "周知の後に実際の申請が増えたかは未確認（本文を入手できず）。"}}, {"id": "jr45", "rank": 45, "headline": "監査を金融犯罪の早期警戒の仕組みとして位置づける", "title": "AUDIT AS AN EARLY WARNING SYSTEM FOR FINANCIAL CRIMES", "url": "https://ojs.mruni.eu/ojs/vsvt/article/view/10019", "authors": "Aurelija Kustienė", "venue": "Visuomenes saugumas ir viesoji tvarka/Visuomenės saugumas ir viešoji tvarka", "date": "2026-09-30", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は入手できず", "preprint": false, "short": true, "p1": "財務諸表の監査を、金融犯罪の兆候を早く捉える早期警戒の仕組みとして理論的に位置づけ、財務・非財務の危険の指標、職業的懐疑心、データ分析、AIを統合した概念モデルを示した。", "p3": "文献と国際監査基準の構造的な分析と統合に、いくつかの金融犯罪の事例を加えた、質的で理論的な概念研究である（抄録）。", "p5": "監査の早期警戒の力は、監査人が自ら犯罪を見抜くことよりも、財務と非財務の危険の指標の組み合わせを見つける力から生まれると論じた（抄録）。", "fun": "監査人は警察ではないので、犯罪を暴くのは仕事ではありません。それでも監査の途中で「何かおかしい」という兆しに気づけることがあります。この論文は、その兆しは一つの数字ではなく、数字と数字以外の手がかりの組み合わせに表れると整理しました。点ではなく模様で見る、という考え方です。", "unverified": "概念モデルの実証的な検証の有無は未確認（本文を入手できず）。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経営学", "headline": "周りが離れると自分も離れる：ネットワーク離脱の法則", "title": "Quantifying the Dynamics of Network Detachment Across Scientific, Technological, Commercial, and Pharmacological Domains", "url": "https://doi.org/10.1002/advs.78029", "authors": "Binglu Wang ほか", "venue": "Advanced Science", "date": "2026-10-04", "sjr": 3.288, "citescore": 18.1, "citescore_year": "2025", "apa": "Wang, B., Jin, C., Song, C., Bjelland, J., Uzzi, B., & Wang, D. (2026). Quantifying the Dynamics of Network Detachment Across Scientific, Technological, Commercial, and Pharmacological Domains. Advanced Science. https://doi.org/10.1002/advs.78029", "why": "科学・技術・商業・医薬の4分野の大規模データで、人や組織がある慣行から離れる確率が、すでに離れた隣接者の数とともに高まる「選好的離脱」を見いだした。それがネットワーク全体の崩壊に相転移を起こしうることを解析的に示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "科学・技術・商業・医薬の4分野の大規模データで、人や組織がそれまでの慣行から離れる確率が、すでに離れた隣接者の数とともに高まる「選好的離脱」を見いだした。それがネットワークの崩れ方を変え、離脱に強いとされてきた系でも相転移を起こしうることを解析的に示した。", "p2": "複雑ネットワークの研究はつながりの形成を中心に進んできた。つながりが失われる離脱の過程の理解は限られているが、ネットワークの進化を深く理解するには欠かせない（抄録）。", "p3": "4つの大規模データで離脱の構造的なパターンを分析し、見いだした選好的離脱の規則をネットワークの動態に入れて帰結を調べた。さらに、選好的離脱が無作為な離脱に比べて崩壊を速めるか、遅らせるか、変えないかを決める位相の条件を、解析的な枠組みで導いた（抄録）。直観：友達が抜けるほど自分も抜けやすいなら、抜けた人の周りから雪崩のように崩れていく。", "p4": "評価は、4分野で同じ離脱のパターンが再現されるか、選好的離脱の下での崩壊の様子（相転移の有無）、そして無作為な離脱との比較である（抄録）。", "p5": "4分野すべてで、慣行から離れる確率が、すでに離れた隣接者の数と相関する単純なパターンが見られた。選好的離脱は、ふつう離脱に頑健とされる系でも相転移を起こしうる。崩壊を速める・遅らせる・変えない位相の条件も特定した。データの規模や相関の強さの数値は抄録にない（抄録）。", "p6": "4つのデータの具体的な内容や、隣接者の離脱と本人の離脱の相関が因果か、同じ外部要因への反応かは抄録からは分からない。解釈：社会的な影響と同質性（似た者どうしのつながり）の区別が、本文での論点になる。", "fun": "友達がやめるとつられて自分もやめたくなる、という経験は誰にでもあります。この研究は、科学・技術・商業・医薬という4つの分野の大量のデータで、周りが離れた数が多いほど自分も離れやすいという同じ法則を見つけました。この「つられて離れる」性質があると、丈夫だと思われていたつながりの網が、ある点を境に一気に崩れることがあるのです。", "unverified": "4つのデータの内容と規模、相関の強さの数値は未確認（本文を入手できず）。"}}, {"id": "jn02", "rank": 2, "field": "政治学", "headline": "役人は女性経営の企業に賄賂を求めにくい", "title": "Gender Bias in Bribe Solicitation: Evidence From Firm–State Interactions", "url": "https://doi.org/10.1177/00104140261487982", "authors": "Daniela Donno ほか", "venue": "Comparative Political Studies", "date": "2026-10-05", "sjr": 3.796, "citescore": 8.6, "citescore_year": "2025", "apa": "Donno, D., Kern, A., Reinsberg, B., & Taylor, J. (2026). Gender Bias in Bribe Solicitation: Evidence From Firm–State Interactions. Comparative Political Studies. https://doi.org/10.1177/00104140261487982", "why": "女性経営の企業が賄賂を払わないのは、女性が腐敗に染まりにくいからだけではない。役人が女性の経営者を過小評価し、賄賂の要求そのものを減らすという仕組みを、世界銀行の企業調査で確かめた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "女性が率いる企業が賄賂を払うことが少ないのは、女性が汚職に染まりにくいからだけではない。役人が女性の経営者を過小評価し、賄賂の要求そのものを減らしているという別の仕組みを、149か国の109,929社のデータで示した。", "p2": "先行研究は、女性が率いる企業ほど、行政の手続きを避けるために役人へ賄賂を払う割合が低いと示してきた。その理由は、女性が汚職に染まりにくいからだと想定されてきた（抄録）。", "p3": "払う側ではなく、腐敗した役人の側の信念と行動に注目した。役人は女性を起業家として過小評価するため、女性が率いる企業への賄賂の要求を減らす、という仕組みを仮説にした（抄録）。直観：取れる相手だと思わなければ、役人はそもそも賄賂を求めない。", "p4": "世界銀行の企業調査（2006〜2022年、149か国の109,929社）で仮説を検証した。男女の不平等が大きい社会に絞った分割標本の分析も行った（抄録）。", "p5": "予想どおりの結果が得られた。男女の不平等が大きい社会に絞った分析も、仮説の仕組みを支持した。女性が率いる企業が役人と接する場面では、性的な見返りを求める汚職が賄賂の代わりになっている可能性も、暫定的に示された（抄録）。効果の大きさの数値は抄録にない。", "p6": "抄録からは、役人の過小評価をどう測ったか、企業の自己申告の偏りをどう扱ったかは分からない。解釈：要求されないこと（役人の側）と払わないこと（企業の側）をデータでどう区別したかが、この研究の核心になる。", "fun": "女性が経営する会社は賄賂を払うことが少ない、という傾向は知られていました。これまでは「女性の方が不正をしないから」と説明されてきました。この研究は149か国の109,929社のデータから、役人が女性経営者を見くびり、そもそも賄賂を求めていないという別の理由を見つけました。一見よい結果の裏に、偏見が隠れていることがあるのです。", "unverified": "効果の大きさの数値、役人の過小評価の測り方は未確認（本文を入手できず）。"}}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "精密な言葉づかいが商品の独自性を感じさせる", "title": "Signaling uniqueness: The psycholinguistic effect of language precision on product perceptions", "url": "https://doi.org/10.1002/jcpy.70041", "authors": "Guang‐Xin Xie ほか", "venue": "Journal of Consumer Psychology", "date": "2026-10-04", "sjr": 5.284, "citescore": 12.3, "citescore_year": "2025", "apa": "Xie, G.-X., & Kronrod, A. (2026). Signaling uniqueness: The psycholinguistic effect of language precision on product perceptions. Journal of Consumer Psychology. https://doi.org/10.1002/jcpy.70041", "why": "商品説明でより精密な語を使うと、消費者は商品をより独自だと感じる。精密な語は意味の範疇の深い位置にあり、指す対象が狭いためだと、範疇化理論から説明した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "商品の説明でより精密な（狭い範囲を指す）言葉を使うと、消費者はその商品の独自性を高く感じる。この「精密-独自効果」とその心理言語学の仕組みを、4つの実験で示した。", "p2": "消費者心理学では、言葉の選び方の効果を調べる研究が増えている。商品の説明でどの語を選ぶかは、商品の位置づけや差別化に直結する実務の問題でもある。著者は、語の精密さが独自性の知覚を高める効果を、新しい効果として報告している（抄録）。", "p3": "カテゴリー化の理論に基づき、精密な語ほど意味のカテゴリーの深い階層にあり、指す対象が狭い部分集合になると考えた。そのため精密な語で説明された商品は、独自だと知覚されると予想した（抄録）。直観：「飲み物」より「エスプレッソ」と書かれた方が限られたものを指すので、特別な商品に聞こえる（例は解説者による）。", "p4": "4つの実験で、精密-独自効果と、カテゴリーの深さによる仕組みを検証した。独自な商品を求める消費者の気持ちが、知覚された独自性を通じて魅力や購買の意図に及ぶ効果を調整するかも調べた（抄録）。", "p5": "4つの実験は、精密-独自効果と、カテゴリーの深さによる仕組みを一貫して支持した。独自な商品を求める気持ちの強さによって、精密な言葉が独自性の知覚を通じて魅力と行動の意図を高める効果の大きさが変わることも示唆された（抄録）。効果の大きさや参加者数は抄録にない。", "p6": "抄録からは、参加者の人数や募集の方法、精密さを操作した語の具体例、実際の購買で効果が残るかは分からない。解釈：精密な語は情報量も増やすので、独自性ではなく品質の推測が効いている可能性を、本文でどう除いたかが要点になる。", "fun": "商品の説明で、ざっくりした言葉を使うか、細かく限定した言葉を使うか。この研究は4つの実験で、より狭い範囲を指す精密な言葉で説明すると、消費者が「この商品は独自だ」と感じやすくなることを示しました。説明の言葉を一段細かくするだけで、ほかの商品との違いを印象づけられるかもしれません。", "unverified": "参加者数、効果の大きさ、操作に使った語の具体例は未確認（本文を入手できず）。"}}, {"id": "jn04", "rank": 4, "field": "機械学習", "headline": "イベントカメラで画像の明るさを自在に調整", "title": "SEE: See Everything Every Time - Adaptive Brightness Adjustment for Broad Light Range Images via Events", "url": "https://doi.org/10.1007/s11263-026-03033-5", "authors": "Yunfan Lu ほか", "venue": "International Journal of Computer Vision", "date": "2026-10-04", "sjr": 3.103, "citescore": 17.8, "citescore_year": "2025", "apa": "Lu, Y., Xu, X., Lu, H., Qian, Y., Li, P., Yao, H., Yang, B., Li, J., Cai, Q., Guo, W., & Xiong, H. (2026). SEE: See Everything Every Time - Adaptive Brightness Adjustment for Broad Light Range Images via Events. International Journal of Computer Vision, 134(10). https://doi.org/10.1007/s11263-026-03033-5", "why": "明るさの変化だけを記録するイベントカメラを、明るさの辞書として使う枠組みを作った。利用者の指定に応じて画素単位で明るさを調整でき、暗い場面から明るすぎる場面まで扱える。202場面・61万枚のデータセットSEE-600Kも構築した。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（データセットの作り方、手法の概要、比較実験、除去実験、結論）を読んだ。表の数値は取得できず", "preprint": false, "p1": "イベントカメラ（明るさの変化だけを高い時間分解能で記録するセンサ）を使い、暗い場面から明るすぎる場面まで、画像の明るさを指定に応じて画素単位で調整する課題を定義した。そのために610,126枚のデータセットSEE-600Kと、小型のネットワークSEE-Netを作った。", "p2": "イベントを使う画像の改善は暗所の補正に集中し、通常や明るすぎる照明は扱われていなかった。従来のデータは暗所と通常の1組しかなく、既存の手法は固定の倍率の補正を学ぶため、他の照明に適応できなかった（§1・6.1）。", "p3": "ロボットアーム（軌道の再現誤差0.03mm）で同じ軌道を繰り返し、NDフィルタ3段階となしで1場面平均4本の動画を撮った。1000HzのIMUの信号で、イベントと画像の時刻を合わせている（§4.1）。SEE-Netはイベントを明るさの辞書として扱い、幅広い照明の表現を作ってから、明るさの指示値Bで画素ごとに復号する（§5、図6）。直観：明るさの変化の記録が、写真の暗い部分と明るい部分の両方の手がかりになる。", "p4": "SDE（91場面）とSEE-600K（202場面）で、DCE、SNR-Net、RetinexFormer、EvLightなどの既存手法を学習し直して比べ、PSNR・SSIM・L1距離で評価した。構成要素を外す除去実験も行った（§6）。", "p5": "SDEで、提案法は最良の結果を、他の最先端手法の約1割の1.9Mのパラメータで示した（§6.1）。SDEで学習したモデルは通常・明るい照明のSEE-600Kでほぼ失敗し、SEE-600Kで学習したモデルは暗所と明所の両方で改善した。その中でSEE-Netが最も良かった（表3、図8・9）。指示値Bを0.3〜0.7で変えると明るさがなめらかに変わり、0.5で最適な明るさになった（図10）。", "p6": "著者は、初めての試みで商用に直接使える水準には達しておらず、イベントカメラの高さも普及を妨げると述べる（§7）。複雑な質感や高解像度が求められる場面では、提案法を含むすべての手法が苦戦した（§6.1）。解釈：表の数値の差の大きさは、本文の表で確かめる必要がある。", "fun": "スマホのカメラは、暗すぎても明るすぎてもうまく撮れません。イベントカメラは、明るさが「変わった」瞬間だけを記録する特殊なカメラで、とても暗い所から明るい所まで見えます。この研究は、その情報を「明るさの辞書」として使い、写真の明るさをつまみを回すように自由に調整できるようにしました。ロボットアームで同じ動きを何度も撮るという、データづくりの工夫も見どころです。", "unverified": "表2・3のPSNR・SSIMの具体的な数値は、表の中身を取得できず未確認。"}}, {"id": "jn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "職場の抵抗の『効き目』を認識の面から定義", "title": "Effective Worker Resistance and Realist Ideology Critique", "url": "https://doi.org/10.1007/s10551-026-06491-6", "authors": "Ugur Aytac ほか", "venue": "Journal of Business Ethics", "date": "2026-10-04", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "apa": "Aytac, U., & Alakavuklar, O. N. (2026). Effective Worker Resistance and Realist Ideology Critique. Journal of Business Ethics. https://doi.org/10.1007/s10551-026-06491-6", "why": "経営の不正義に対する労働者の抵抗が有効かどうかを、認識の観点から定義した政治理論の論文。職場の正当化の仕組みを崩し、対等な異議申し立ての機会を生むかを基準とし、噂話を例に当てはめた。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（序論、認識的な効き目の定義、二つの経路、うわさ話の事例、結論）を読んだ", "preprint": false, "p1": "経営の不正義に対する労働者の抵抗が「効果的」かどうかには複数の次元があることを示し、職場の正当化の語りを揺さぶる「認識的な効き目」という独自の次元を定義して、うわさ話（ゴシップ）に当てはめた政治理論の論文。", "p2": "職場の抵抗の正当化は、効果があるかに結びつけて論じられてきた。だが何をもって効果とするかは概念として不明確で、実証研究に任せれば済む問題ではない。物の分配や集団行動の能力とは別の次元がありうる（序論）。", "p3": "権力者がその力によって正当化の語りを通用させる「自己正当化する権力」を問題にし、認識的な効き目を4つの要素で定義した。権力者を過度に信頼せずに語りを評価すべきだという考えを目立たせる、語りが権力の偏りで通用しているという解釈への支持を集める、語りを支える他の理由の有無を探る、見直した考えを労働者の間で共有して公にする、の4つである（本文）。", "p4": "実証ではなく概念の分析である。認識的な効き目を高める経路として、対等な異議申し立てと集団的な異議申し立てを仮説として示し（因果の証拠ではないと明記）、うわさ話を例にその力と限界を検討した（本文）。", "p5": "うわさ話は、経営が情報と公式の語りを独占する急な階層の職場で、労働者が自分たちで知識を作り広める手段になる。内容の真偽にかかわらず、知識の生産を多元化する点で認識の改善になると論じた。一方で分断を生むこともあり、信頼と連帯を育てることが前提だとした。認識的な効き目は他の次元に還元できないと結論している（結論）。", "p6": "経路は今後の実証で検証すべき仮説だと著者自身が述べている。解釈：認識的な効き目を測る具体的な指標は示されておらず、実証研究への橋渡しには操作化が必要である。", "fun": "職場で上司のうわさ話をすることは、ふつうは良くないこととされます。この論文は、上の立場の人が「これは会社のため」という説明を力で押し通しやすい職場では、働く人どうしの雑談がその説明を疑い、別の見方を共有するきっかけになりうると論じました。抵抗の効き目を、給料が上がるかではなく「考え方が変わるか」で測るという視点です。", "unverified": "脚注に書かれた補足の論点は読んでいない。"}}, {"id": "jn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "仲介者が分散した業界の集団意識を育てる", "title": "How Brokers Enable Collective Identity Formation in Fragmented Industry Groups: The Case of Franciacorta Wineries", "url": "https://doi.org/10.1111/joms.70172", "authors": "Alessandra Zamparini ほか", "venue": "Journal of Management Studies", "date": "2026-10-05", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Zamparini, A., Stigliani, I., & Corley, K. G. (2026). How Brokers Enable Collective Identity Formation in Fragmented Industry Groups: The Case of Franciacorta Wineries. Journal of Management Studies. https://doi.org/10.1111/joms.70172", "why": "イタリアのフランチャコルタのワイナリーを1960〜90年代にわたって追った。技術コンサルタントが仲介者として、翻訳・相互受粉・統合の3つの仕組みで業界の集団アイデンティティの形成を促したことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "組織の境界をまたぐ仲介者（ブローカー）が、ばらばらな業界の集団に共通のアイデンティティを形づくる過程を、イタリアのワイン産地フランチャコルタの1960〜1990年代の事例で明らかにした。", "p2": "業界の集団的なアイデンティティの研究は、象徴的な表現や制度化（呼称や規則の制定）のような目に見える場面に注目してきた。その前に積み重なる、目立たない実践や人間関係の仕事は前面に出てこなかった（抄録）。", "p3": "フランチャコルタのワイナリーを1960年代から1990年代まで追う、深い縦断の事例分析を行った。仲介者として働いた技術コンサルタントとワイナリーのやり取りから、データに根ざした（グラウンデッドな）モデルを作った（抄録）。直観：産地を回る技術者が各蔵の知恵を運び、つなぎ、ひとつの「産地らしさ」に織り上げていく。", "p4": "物差しは統計ではなく、長期の事例から仲介の仕組みを特定し、アイデンティティの形成とどう結びつくかを示すことである。使った資料の種類（聞き取りや文書など）は抄録にない（抄録）。", "p5": "技術コンサルタントは、翻訳、知識の相互の持ち込み（クロスポリネーション）、統合という3つの仕組みでワイナリーと関わり、集団的なアイデンティティの形成を後押しした。まとまりのあるアイデンティティは、実践の共創と人のつながりの編み込みを通じて、集団のすき間から分散的に作られた。業界の広い領域と地域の文脈の間で、内向きの適応と外向きの整合が進み、ほどよく際立つアイデンティティが生まれた（抄録）。", "p6": "1つの産地の事例なので、他の業界や国への一般化には限界がある。抄録からは、仲介者がいなかった産地との比較の有無は分からない。解釈：成功した産地を振り返る分析では仲介者の働きを後から大きく見がちで、本文の資料の厚みが判断の材料になる。", "fun": "産地の名前がブランドになるには、ばらばらだった生産者がひとつの顔を持つ必要があります。この研究は、イタリアのワイン産地フランチャコルタで、各ワイナリーを回る技術コンサルタントが知恵を運び、生産者どうしをつなぎ、共通の「産地らしさ」を形づくったことを明らかにしました。目立つブランドの誕生の前には、目立たない仲介の仕事があったのです。", "unverified": "使った資料の種類と量、他の産地との比較の有無は未確認（本文を入手できず）。"}}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "生成AIと能動学習で軽くて硬い構造を発見", "title": "Enhancing Specific Stiffness of Nano‐Architected Materials Through Generative AI and Active Learning", "url": "https://doi.org/10.1002/advs.78140", "authors": "Jinwook Yeo ほか", "venue": "Advanced Science", "date": "2026-10-04", "sjr": 3.288, "citescore": 18.1, "citescore_year": "2025", "apa": "Yeo, J., Serles, P., Park, D., Greer, J. R., & Ryu, S. (2026). Enhancing Specific Stiffness of Nano‐Architected Materials Through Generative AI and Active Learning. Advanced Science. https://doi.org/10.1002/advs.78140", "why": "決まった形の族の中を探す従来の最適化を超え、ボクセルの構造空間を直接探索する枠組みを作った。生成AIと能動学習で、比剛性の高いナノ構造材料の新しい形を体系的に見つけた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "生成AIと能動学習を組み合わせ、あらかじめ決めた形の族の外にある、軽くて硬いナノ構造を見つけた。作った炭素ナノ構造は、同じ密度の比較対象よりヤング率で18〜23%、強度で26〜40%高かった。", "p2": "構造化材料（アーキテクテッド材料）の性能は、素材そのものの性質と同じくらい形で決まる。だが多くの最適化は、あらかじめ決めた形の族の中で探すため、本当に新しい形の発見が限られていた（抄録）。", "p3": "ボクセル（立体の画素）で表した構造の空間を直接探した。支柱型、TPMS（三重周期極小曲面）型、その混合の立方対称の単位胞を、連続的な潜在表現に変換した。代理モデルが導く多目的の探索で有望な候補を選び、高精度の計算で確かめたデータを学習に戻す能動学習を繰り返した（抄録）。直観：AIの「これは良さそう」という予想を本物の計算で確かめては学び直し、探す範囲を少しずつ広げる。", "p4": "評価は3段階である。探索の広がり（初期データからの最小ハミング距離の平均）とパレート超体積、同じ密度での相対ヤング率の計算値、そして二光子重合と熱分解で作った試料の実測である（抄録）。", "p5": "9回の繰り返しで、初期データからの最小ハミング距離の平均は442から641に、パレート超体積は0.106から0.113に増えた。計算では、見つけた構造は同じ密度で初期の設計より相対ヤング率が11〜20%高かった。作った炭素ナノ構造は、同じ密度の比較対象よりヤング率で18〜23%、強度で26〜40%高く、比剛性は17.2、22.3、21.3 MPa m³ kg⁻¹に達した（抄録）。", "p6": "抄録からは、試料の数とばらつき、製造の欠陥への強さ、立方対称以外の構造に広げられるかは分からない。解釈：パレート超体積の伸びは0.106から0.113と小さく、探索の広がりと性能の向上のどちらが主な成果かは本文で確かめたい。", "fun": "軽くて硬い材料を作るには、素材だけでなく内部の「形」が大事です。ところが、これまでの設計は、おなじみの形の仲間の中から選ぶのがふつうでした。この研究は、AIの予想を計算で確かめては学び直す方法で、その枠の外にある新しい形を探しました。実際に作った炭素のナノ構造は、同じ密度の比較対象よりヤング率が18〜23%高くなりました。", "unverified": "試料の数とばらつき、製造の再現性は未確認（本文を入手できず）。"}}, {"id": "jn08", "rank": 8, "field": "経営学", "headline": "生成AIの回答の表示の仕方で受容が変わる", "title": "“Word‐By‐Word” or “Line‐By‐Line” Presentation? How Response Generation Dynamics in Generative AI Influence User Acceptance", "url": "https://doi.org/10.1002/cb.70256", "authors": "Fei Jin ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-05", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "apa": "Jin, F., & Gong, S. (2026). “Word‐By‐Word” or “Line‐By‐Line” Presentation? How Response Generation Dynamics in Generative AI Influence User Acceptance. Journal of Consumer Behaviour. https://doi.org/10.1002/cb.70256", "why": "生成AIの回答を1語ずつ流す表示と1行ずつ出す表示で、利用者が出力を受け入れる意思がどう変わるかを3つの実験で調べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "生成AIの回答を一語ずつ流れるように表示すると、一行ずつ表示する場合より、利用者は回答を受け入れやすくなることを3つの実験で示した。効果は没入感を通じて生じ、内容を理解する必要が高い場面では弱まった。", "p2": "生成AIの受け入れについては多くの研究がある。だが、回答の表示のしかたという生成AIに固有の特徴が受け入れにどう影響するかは、あまり分かっていなかった（抄録）。", "p3": "回答の表示を、動きの大きい形式（一語ずつ）と動きの小さい形式（一行ずつ）で比べた。日常の質問応答、オンラインの買い物、クラウドファンディングという異なる場面で、3つの実験を行った（抄録）。直観：文字が次々に現れると、やり取りに引き込まれる感じが強まり、内容を受け入れやすくなる。", "p4": "主な物差しは、AIの出力を受け入れる意思である。没入感が仲立ちするか（媒介）、その場面で内容を理解する必要の高さで効果が変わるか（調整）も調べた（抄録）。", "p5": "一語ずつの表示の方が、利用者は回答を受け入れやすかった。この効果は、表示の動きが没入感を高めることで生じていた。内容の質や正確さを重視する、理解の必要が高い場面では、没入感を通じた効果は弱まった。理解の必要が低い場面では、体験ややり取りの面に反応しやすく、効果は強まった（抄録）。効果の大きさや参加者数は抄録にない。", "p6": "抄録からは、参加者の数や属性、回答の正しさを判断に含めたか、使い続けたときに効果が残るかは分からない。解釈：表示の演出で誤った回答まで受け入れやすくなるなら、正確さが大事な場面の画面設計には注意が要る。", "fun": "対話型の生成AIの多くは、回答を一語ずつ打ち込むように表示します。あれは演出として意味があるのでしょうか。この研究は3つの実験で、一行ずつより一語ずつ表示した方が、利用者が回答を受け入れやすくなることを示しました。ただし、正確さが大事な場面ではこの効果は弱まります。見せ方ひとつで、AIの答えの受け止め方が変わるのです。", "unverified": "参加者数、効果の大きさ、回答の正しさの扱いは未確認（本文を入手できず）。"}}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "仮想配信者の語り口は商品の種類で効き方が違う", "title": "Facts or Feelings? How Virtual Streamers Reduce Consumer Uncertainty Across Product Types", "url": "https://doi.org/10.1002/cb.70255", "authors": "Kai Zhang ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-04", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "apa": "Zhang, K., Luo, B., Weng, X., & Yan, J. (2026). Facts or Feelings? How Virtual Streamers Reduce Consumer Uncertainty Across Product Types. Journal of Consumer Behaviour. https://doi.org/10.1002/cb.70255", "why": "ライブコマースの仮想配信者が情報的に話すか感情的に話すかと、商品が探索財か経験財かの組み合わせで、購買意図がどう変わるかを調べた。シグナリング理論と消費者の不確実性の観点から説明している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "ライブ配信の通販で、AIのバーチャル配信者が商品の種類に合った話し方をすると、購買の意図が高まることを3つのシナリオ実験で示した。調べて分かる商品には情報的な話し方、使ってみないと分からない商品には感情的な話し方が効いた。", "p2": "AIの進歩で、ライブ配信の通販ではバーチャル配信者（仮想の配信者）の利用が広がっている。だが、バーチャル配信者が感情的な言葉を使う効果は、既存の研究でははっきりしていなかった（抄録）。", "p3": "シグナリング理論と消費者の不確実性の視点から、話し方（情報的か感情的か）と商品の種類（探索財か経験財か）の組み合わせを調べた。探索財は買う前に品質を調べられる商品、経験財は使ってみないと品質が分からない商品である。3つのシナリオ実験で、仮説を段階的に検証した（抄録）。直観：仕様で選ぶ商品には事実が、使い心地で選ぶ商品には「この配信者は信頼できる」という感覚が効く。", "p4": "物差しは購買の意図である。商品への不確実性と配信者への不確実性という2つの不確実性が仲立ちするか、配信ルームの活発さで効果が変わるかを調べた（抄録）。", "p5": "話し方と商品の種類の間に、はっきりした相性の効果があった。探索財では、情報的な話し方が商品への不確実性を下げ、購買の意図を高めた。経験財では、感情的な話し方が配信者への不確実性を下げ、購買の意図を高めた。配信ルームが活発だと相性の効果はさらに強まり、活発でないと経験財での感情的な話し方の利点は弱まった（抄録）。効果の大きさは抄録にない。", "p6": "シナリオ実験なので、実際の配信での購買行動に同じ効果があるかは分からない。抄録からは、参加者の数や国も分からない。解釈：実際の配信では、配信ルームの活発さは売れ行きの結果でもありうるので、現場のデータでの検証が次の課題になる。", "fun": "AIのバーチャル配信者が商品を売るライブ通販が広がっています。では、配信者は事実を淡々と語るべきか、気持ちを込めて語るべきか。この研究の答えは「商品による」でした。仕様で選ぶ商品には事実が、使ってみないと分からない商品には感情的な語りが効きます。後者は、配信者への不安を和らげることで効いていました。", "unverified": "参加者数、効果の大きさは未確認（本文を入手できず）。"}}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "グリーン人事が組織のレジリエンスに至る道筋", "title": "From Green Human Resource Management to Organizational Resilience: A Resource‐Process‐Outcome Framework Integrating Dynamic Capabilities", "url": "https://doi.org/10.1002/csr.71045", "authors": "Walton Wider ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-04", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Wider, W., Wu, C., Saad, A., Ahmad, A., Mohamed Isa, Z., Wu, H., Zhou, F., & Zeng, X. (2026). From Green Human Resource Management to Organizational Resilience: A Resource‐Process‐Outcome Framework Integrating Dynamic Capabilities. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71045", "why": "2010〜2025年の108研究を、構成概念の役割ごとに点検した理論構築のレビュー。グリーン人事管理を資源、動的能力を変換過程、レジリエンスを成果として切り分ける枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "グリーン人的資源管理（GHRM：環境に配慮した採用・研修・評価などの人事）が組織のレジリエンス（危機に耐えて立て直す力）にどうつながるかを、資源・過程・成果を混同しない枠組みで整理した、理論構築型のレビュー。", "p2": "GHRMとレジリエンスをめぐる研究では、資源、変換の過程、成果という役割の違う概念が混同されがちだった。そのため、GHRMがどの経路でレジリエンスに効くのかが整理されていなかった（抄録）。", "p3": "2010〜2025年に出版されたScopus収録の108本の研究を調べた。研究ごとに、各概念が資源・過程・成果のどの役割で使われているかを点検した（抄録）。直観：材料（人事の仕組み）、調理（組織が変わる力）、料理（立て直す力）を分けて考える。", "p4": "実証ではなく、理論を組み立てるための構造化されたレビューである。物差しは、概念の役割を一貫して整理できるか、検証できる命題に落とせるかである（抄録）。", "p5": "GHRMを持続可能性に向けた資源の仕組み、動的能力（変化の察知・機会の捕捉・資源の組み替え）を高次の変換の能力、レジリエンスを結果として現れる状態と区別した。この順序の過程を5つの命題で示した。革新を後押しする風土は資源の発揮を助け、環境の変化の激しさは能力を発動する重要さを左右し、資源の余裕は発動した能力をレジリエンスに変えるのを支える（抄録）。", "p6": "著者自身が、因果の効果は確立しておらず、今後の検証のための1つの理論的な順序を示すにとどまると述べている（抄録）。解釈：もとの研究に一時点の調査が多ければ、命題の検証には時間を追うデータが要る。", "fun": "環境に配慮した人事は、会社を危機に強くするのでしょうか。この研究は108本の先行研究を見直し、人事の仕組み（材料）、組織が変わる力（調理）、危機から立て直す力（料理）が混同されてきたと指摘しました。3つを分けて並べると、人事は組織が変わる力を介して効く、という筋道が描けます。その検証はこれからの課題です。", "unverified": "108本の研究の内訳（業種・国・研究方法）は未確認（本文を入手できず）。"}}, {"id": "jn11", "rank": 11, "field": "交通・都市計画", "headline": "屋根と壁面の太陽光発電を時間ごとに簡便に推定", "title": "Temporal PV‐Power of Rooftops and Facades in Urban Areas Based on Ray Tracing", "url": "https://doi.org/10.1002/pip.70148", "authors": "Philip Kühne ほか", "venue": "Progress in Photovoltaics: Research and Applications", "date": "2026-10-05", "sjr": 2.091, "citescore": 18.5, "citescore_year": "2025", "apa": "Kühne, P., Bredemeier, D., Schläger, C., Wietler, T., & Brendel, R. (2026). Temporal PV‐Power of Rooftops and Facades in Urban Areas Based on Ray Tracing. Progress in Photovoltaics: Research and Applications. https://doi.org/10.1002/pip.70148", "why": "都市の分散型太陽光の導入評価には、時間ごとの発電量が要る。影を考慮しつつ簡単に計算できる解析モデルを、建物の屋根と壁面のレイトレーシングの模擬から作った。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず。抄録の数式部分（誤差の値）は取り込みで欠けている", "preprint": false, "p1": "都市の屋根と壁面の太陽光発電について、時間ごとの発電量を、建物の影や反射を考えつつ簡単に計算できる解析モデルを作った。もとにしたのは、ドイツ3都市の光線追跡のシミュレーションである。", "p2": "都市のエネルギー系に分散型の太陽光発電を組み込む分析には、都市全体の時間ごとの発電量が要る。だが影を考えた計算は重く、簡単に使えるモデルが求められていた（抄録）。", "p3": "パーダーボルン、ハノーファー、ケルンにまたがる22km²の範囲で、壁面と屋根の太陽光発電の1時間ごとの発電量を、逆方向の光線追跡でシミュレーションした。光線追跡なら、周りの建物による影と光の反射を考えられる。設置できる容量と設備利用率は、全負荷時間（年間の発電量を容量で割った時間）のしきい値ごとに計算した。時間がたてば、全負荷時間の少ない場所にも設置が進むと見込んだためである（抄録）。直観：都市どうしで傾向が似ていれば、その傾向を式にしておくだけで、重い計算をせずに他の都市にも使える。", "p4": "3都市の結果から作った解析モデルを、ミュンヘンの45km²の地域に当てはめ、重い光線追跡の結果と比べた。周りの建物の影と反射を考えない場合との比較も行った（抄録）。", "p5": "3都市の結果には共通点があり、少ない計算で設置できる容量と設備利用率を推定するモデルが作れた。ミュンヘンでは全負荷時間600時間超の設備について設置容量のずれと設備利用率の誤差を示しているが、値は抄録の取り込みで欠けて読めない。影と反射を考えないと、3都市の全負荷時間600時間超の設備で、設置できる容量を最大5倍過大に見積もりうる（抄録）。", "p6": "モデルが使えるのは、調べた都市と緯度が近い都市に限られると著者は述べている（抄録）。解釈：設置容量のずれの値を本文で確かめないと、実務に使える精度かは判断できない。", "fun": "都市の太陽光発電は、屋根だけでなくビルの壁面も候補になります。ただ、周りの建物の影や反射を計算するのは大変です。この研究は、ドイツの3都市で光線追跡の重いシミュレーションを行い、都市どうしで傾向が似ていることを見つけて、簡単な式にまとめました。影を無視すると、設置できる容量を最大5倍も過大に見積もりかねないそうです。", "unverified": "ミュンヘンでの設置容量のずれと設備利用率の誤差の値は、抄録の数式部分が欠けて未確認。面積の単位（km²）は抄録の欠けた表記から補った。"}}, {"id": "jn12", "rank": 12, "field": "化学", "headline": "[1]ロタキサンの反転で高分子網の靱性が3倍に", "title": "Mechanical Flipping of [1]Rotaxanes Toughens Polymer Networks", "url": "https://doi.org/10.1021/jacs.6c15261", "authors": "Jiaojiao Xie ほか", "venue": "Journal of the American Chemical Society", "date": "2026-10-04", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "apa": "Xie, J., Deng, D., Wang, S., Wen, W., Hu, L., Zhao, Q., & Zhang, M. (2026). Mechanical Flipping of [1]Rotaxanes Toughens Polymer Networks. Journal of the American Chemical Society. https://doi.org/10.1021/jacs.6c15261", "why": "環の大きさだけが異なる2種類の[1]ロタキサンを架橋剤に使った。反転に大きなエネルギーが要る方を2.0mol%入れると、靱性が約3倍、伸びが約2倍になった。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "自分自身と絡み合った分子（[1]ロタキサン）を高分子網の架橋剤に使い、環の反転のしにくさだけを変えると、網の靱性が3倍、伸びが2倍になることを示した。", "p2": "ロタキサン（環状分子が軸に通って外れない構造）は、高分子材料の力学特性を調整する手段として注目されてきた。だが、1つの分子の中で自分と絡み合う[1]ロタキサンは、この分野でほとんど調べられていなかった（抄録）。", "p3": "クラウンエーテルを環にした2種類の[1]ロタキサンを作った。絡み合いの構造は同じで、環のかさ高さに由来する反転の障壁だけが違う。溶液の実験と密度汎関数理論（DFT）計算で、DB24C8型は反転に大きなエネルギーが要り、B24C8型は水素結合が切れると自由に反転することを確かめた（抄録）。直観：くるりと回りにくい輪ほど、引っ張られたときにエネルギーを使って抵抗する。", "p4": "2種類を2.0mol%という少量で高分子網の架橋剤として入れた。靱性（破断までに吸収するエネルギー）と伸びを、2種類の間で、また対応する通常の共有結合の網と比べた（抄録）。", "p5": "反転の障壁が高いDB24C8型の網は、B24C8型の網や共有結合の網に比べ、靱性が3倍、伸びが2倍になった。著者は、適切な障壁をもつ分子の反転がエネルギーを散逸させるためと説明している（抄録）。靱性の具体的な値は抄録にない。", "p6": "抄録からは、繰り返し変形したときの疲労や回復、温度や引っ張る速さへの依存は分からない。解釈：少量で大きな差が出た機構の直接の証拠（変形中の分子の観察）は、本文で確かめる必要がある。", "fun": "輪が軸に通って外れない分子を材料に混ぜると、丈夫になることは知られていました。この研究は、輪が軸の上でくるりと反転するのに要る力だけを変えてみました。すると、反転しにくい方が3倍も丈夫になりました。わざと動きにくくして、引っ張られたときのエネルギーを散らすという発想は、壊れにくい材料づくりの新しい手がかりになります。", "unverified": "靱性と伸びの具体的な数値、繰り返し変形での挙動は未確認（本文を入手できず）。"}}, {"id": "jn13", "rank": 13, "field": "材料科学", "headline": "水系亜鉛電池で平均2.35Vの放電を実現", "title": "Stabilizing Water Molecules in Hydrogel Electrolytes Enables 2.8 V‐Class Purely Aqueous Zn–Li Hybrid Batteries", "url": "https://doi.org/10.1002/adma.75221", "authors": "Meng Li ほか", "venue": "Advanced Materials", "date": "2026-10-04", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "apa": "Li, M., Song, L., Wang, C., Lai, G., Quan, Z., Fu, Z., Xiu, X., Li, X., Liu, F., Dai, C., Qu, L., Zhou, Z., & Jin, X. (2026). Stabilizing Water Molecules in Hydrogel Electrolytes Enables 2.8 V‐Class Purely Aqueous Zn–Li Hybrid Batteries. Advanced Materials. https://doi.org/10.1002/adma.75221", "why": "ハイドロゲル電解質で水分子の活性を強く抑え、酸素発生の電位を2.85Vまで高めた。純粋な水系のZn–Liハイブリッド電池で、平均作動電圧2.35Vを達成した。", "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "ハイドロゲル電解質の中で水分子の動きを強く抑え、水が分解し始める電位をZn/Zn²⁺基準で2.85Vまで高めた。これにより、水だけを溶媒にした亜鉛電池で、平均作動電圧2.35Vを実現した。", "p2": "報告されている高電圧の水系亜鉛電池は、一般に2.0V未満で動く。2.0Vを超える放電には2.5V以上の充電電圧が要るが、水の電気化学的な安定性の限界がそれを阻んできた（抄録）。", "p3": "ポリ（アクリルアミド-co-ヒドロキシプロピルアクリレート）のハイドロゲル電解質を使った。陽イオンと水の強い配位、TFSI⁻による水の隔離、高分子網の広い水素結合を組み合わせ、水の活性を抑えた（抄録）。直観：水分子を周りの分子でがっちり捕まえておけば、高い電圧をかけても分解しにくくなる。", "p4": "酸素が発生し始める電位を測り、理論値と比べた。さらに、リチウムニッケルマンガン酸化物を正極にしたZn–Liハイブリッド電池を組み、平均作動電圧と放電の平坦部、機械的な丈夫さ、無線センサの駆動を確かめた（抄録）。", "p5": "酸素が発生し始める電位は2.85Vで、理論値（約1.58V）を大きく超えた。2.8V級のZn–Liハイブリッド電池で、平均作動電圧と放電の平坦部は2.35Vに達し、既報の純水系亜鉛電池をすべて上回ったとする。電池は機械的にも丈夫で、圧力・指の動き・筋肉の活動・発話・全身の動きを無線で検知する装置を直接動かした（抄録）。", "p6": "抄録からは、サイクル寿命、容量維持率、出力密度、安全性の評価は分からない。解釈：平均作動電圧が高くても、繰り返しの充放電での劣化が実用の鍵になる。", "fun": "水を使う電池は燃えにくく安全です。ただ、電圧を上げると水そのものが分解してしまうという壁がありました。この研究は、ゼリー状の電解質の中で水分子を身動きできないほど囲い込み、水が分解し始める電圧を理論値の2倍近くまで押し上げました。安全な水の電池で高い電圧が出せれば、体に着ける機器の電源の選択肢が広がります。", "unverified": "サイクル寿命、容量維持率、出力密度は未確認（本文を入手できず）。"}}, {"id": "jn14", "rank": 14, "field": "化学", "headline": "バイオ由来の溶媒で高密度ポリエチレンを合成", "title": "Bio‐Based Solution for Polyolefin Synthesis Enabled by Carbonate Solvent and Comonomer", "url": "https://doi.org/10.1002/anie.3998761", "authors": "Xin Xu ほか", "venue": "Angewandte Chemie - International Edition", "date": "2026-10-04", "sjr": 5.495, "citescore": 25.7, "citescore_year": "2025", "apa": "Xu, X., Wang, L., Niu, J., Niu, X., Yang, K. R., & Lin, F. (2026). Bio‐Based Solution for Polyolefin Synthesis Enabled by Carbonate Solvent and Comonomer. Angewandte Chemie International Edition. https://doi.org/10.1002/anie.3998761", "why": "電子豊富なニッケル錯体を使い、バイオ由来の炭酸ジメチルを溶媒としてメタロセン触媒並みの活性で高密度ポリエチレンを作れることと、炭酸エステルを含む共重合で極性ポリエチレンも得られることを示した。", "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。出版社の本文は取得できず", "preprint": false, "p1": "バイオ由来の炭酸ジメチル（DMC）を溶媒にして、電子豊富なニッケル錯体で、メタロセン触媒に匹敵する活性で高密度ポリエチレンを作れることを示した。炭酸エステルを含む共単量体を入れた極性ポリエチレンも得た。", "p2": "ポリオレフィンは最も使われている合成高分子だが、原料から製造まで化石燃料に頼っている。炭素の足跡を減らし、石油への依存を緩める製造法が長く求められてきた（抄録）。", "p3": "ホスフィンフェノラート配位子をもつ電子豊富なニッケル(II)錯体を使い、DMCを重合の媒体にした。機構を調べると、DMCはピリジンの解離を促す一方で、ニッケルに強く配位しすぎない。そのためエチレンへの置き換わりが滑らかに進み、重合が進むと分かった（抄録）。直観：溶媒が触媒の席を空けさせ、しかも自分は居座らないので、エチレンが入り込める。", "p4": "評価は、重合の活性（メタロセン触媒との比較）、炭酸エステルを含む共単量体を入れたときの活性、微細構造の調整による機能の作り込みである（抄録）。", "p5": "DMCの中で実用的な効率で高密度ポリエチレンが得られ、活性はメタロセン触媒に匹敵した。共単量体を入れても高い活性を保ち、極性ポリエチレンが得られた。微細構造を調整すると、機能を目的に合わせて変えられた（抄録）。活性の数値は抄録にない。", "p6": "抄録からは、活性やポリマーの物性の数値、DMCの回収、全体の環境負荷の評価は分からない。解釈：溶媒がバイオ由来でも、単量体のエチレンが化石由来なら、全体の脱炭素の効果は限られる。", "fun": "レジ袋や容器のポリエチレンは、原料から製造まで石油に頼っています。この研究は、植物などから作れる炭酸ジメチルという溶媒の中でも、従来の触媒並みの効率でポリエチレンを作れるニッケル触媒を見つけました。鍵は、溶媒が触媒の邪魔者を追い出しつつ、自分は強くくっつきすぎないこと。その加減が、溶媒選びの新しい指針になります。", "unverified": "活性とポリマーの物性の数値、DMCの回収を含む環境負荷の評価は未確認（本文を入手できず）。"}}, {"id": "jn15", "rank": 15, "field": "材料科学", "headline": "湿気に強い硫化物電解質で全固体電池を実用へ", "title": "High-Conductivity and Moisture-Tolerant Sulfide Electrolyte Enabled by Bifunctional Coating for Practical All-Solid-State Lithium Batteries", "url": "https://doi.org/10.1007/s40820-026-02353-y", "authors": "Dabing Li ほか", "venue": "Nano-Micro Letters", "date": "2026-10-05", "sjr": 8.402, "citescore": 58.9, "citescore_year": "2025", "apa": "Li, D., Xu, H., Cao, G., Liu, F., Ban, J., Zhang, S., Fan, L.-Z., & Hu, J. (2026). High-Conductivity and Moisture-Tolerant Sulfide Electrolyte Enabled by Bifunctional Coating for Practical All-Solid-State Lithium Batteries. Nano-Micro Letters, 19(1). https://doi.org/10.1007/s40820-026-02353-y", "why": "全固体リチウム電池の硫化物電解質は、伝導性は高いが湿気に弱い。二機能の被覆で高い伝導性と耐湿性を両立させ、実用に近い全固体電池への道を示した。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（序論、結果と考察2.1〜2.5、結論）を読んだ。補足資料は読んでいない", "preprint": false, "p1": "全固体リチウム電池に使う硫化物固体電解質（LPSCBr）の粒子を、厚さ約10nmの撥水性の膜で覆い、湿った空気の中でも劣化しにくくした。相対湿度30%の空気に35分さらしたときの硫化水素の発生を93.0%減らし、空気に2時間さらした電解質で組んだ電池は、1000サイクル後も容量の84.6%を保った（抄録）。", "p2": "硫化物固体電解質はイオン伝導度が高く、全固体電池の有力な材料である。だが水分にきわめて弱く、空気中の水と反応して有毒な硫化水素を出し、構造も壊れる。これが、通常の大気の中での大量生産を妨げてきた（抄録）。従来の被覆は主に物理的な遮断で反応を遅らせるもので、正極との界面の不安定さも残っていた（§1）。", "p3": "2つの官能基をもつMPTMS（3-メルカプトプロピルトリメトキシシラン）を、ボールミルでLPSCBrの表面に付けた（質量比10:1）。メトキシシラン基は撥水性のシロキサンの網を作る。チオール基は電解質の表面の硫黄とS–S結合を作り、骨格を安定させる（§2.1）。直観：撥水の雨がっぱを着せ、そのボタンを電解質の硫黄に直接留める。", "p4": "物差しは、イオン伝導度（被覆の前後と、湿度30%の空気にさらした後）、硫化水素の発生量、X線回折などで見た構造の変化、そして空気に2時間さらした電解質で組んだ電池の容量と寿命である。チオール基のない分子での被覆とも比べた（§2.2–2.4）。", "p5": "被覆によるイオン伝導度の低下は、13から10.8mS/cmへの16.9%にとどまった。湿度30%で10時間さらすと、被覆なしは0.26mS/cmまで落ち、被覆ありは5.7mS/cmを保った（図2a）。チオール基のない分子での被覆より硫化水素の発生が少なく、チオール基が効いていた（図S13）。電池の容量維持率は、被覆なしが200サイクルで49.5%、被覆ありが1000サイクルで84.6%だった（図4d）。", "p6": "湿度は主に30%で試しており、パウチ型の電池は50サイクル（容量維持率約92.7%）までしか示されていない（§2.5）。解釈：被覆は電子伝導度も下げて正極との界面を安定させるので、寿命の改善のうち湿気の対策による分を切り分けて見る必要がある。", "fun": "次世代の全固体電池の有力な材料である硫化物の電解質は、空気中のわずかな水分と反応して、有毒な硫化水素を出してしまいます。そのため、ふつうの空気の中で大量に作るのが難しいという壁がありました。この研究は、粒子を厚さ約10nmの撥水の膜で包み、その膜を電解質の硫黄にしっかり結びつけて、硫化水素の発生を93%減らしました。イオンの通りやすさは83.1%を保っています。", "unverified": "補足資料（図S・表S1）の詳細と、試料ごとのばらつきは確認していない。"}}, {"id": "jn16", "rank": 16, "field": "材料科学", "headline": "希土類の単原子で鉄触媒を安定化し空気電池を強化", "title": "Nano‐Stabilizer Engineering of Rare‐Earth Metal Single‐Atom Site for Boosted Oxygen Electroreduction and Metal‐Air Batteries", "url": "https://doi.org/10.1002/adma.75283", "authors": "Shengjie Wei ほか", "venue": "Advanced Materials", "date": "2026-10-04", "sjr": 8.266, "citescore": 42.0, "citescore_year": "2025", "apa": "Wei, S., Hu, X., Liu, P., Yang, R., Zhang, H., & Hu, Y. (2026). Nano‐Stabilizer Engineering of Rare‐Earth Metal Single‐Atom Site for Boosted Oxygen Electroreduction and Metal‐Air Batteries. Advanced Materials. https://doi.org/10.1002/adma.75283", "why": "プラセオジムの単原子でFe-N4O活性点の配位を安定化し、酸素還元反応で市販のPt/C触媒を上回る半波電位と、アルミニウム空気電池での高い出力密度を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "希土類のプラセオジム（Pr）の単原子を「安定剤」として使い、鉄の単原子の活性点の配位構造を安定させて、酸素還元反応と金属空気電池の性能を高めた。", "p3": "その場X線吸収分光で、Prの単原子がFe-N4O部位の軸方向の酸素の配位を安定させ、鉄のdバンド中心を下げることを示し、律速段階のエネルギー障壁の低下を密度汎関数計算で確かめた（抄録）。", "p5": "触媒の半波電位は0.921V（対RHE）で、Prを持たない触媒より45mV、市販のPt/Cより72mV高かった。この触媒を使ったアルミ空気電池は、最大出力密度360mW cm⁻²を達成した（抄録）。", "fun": "電池の電極の触媒は、白金のような高価な金属に頼りがちです。この研究は、安い鉄の原子1個を活性点にし、その隣にプラセオジムの原子を添えて形を崩れにくくしました。白金より高い性能が出たのは、主役を支える脇役の原子のおかげです。", "unverified": "耐久性の試験の結果と、合成の再現性は未確認（本文を入手できず）。"}}, {"id": "jn17", "rank": 17, "field": "交通・都市計画", "headline": "フードデリバリーと建造環境の関係は空間単位で変わる", "title": "Nested spatial processes in urban food delivery: How scale and boundary choice shape built-environment relationships in New Delhi, India", "url": "https://doi.org/10.1016/j.apgeog.2026.104206", "authors": "Suprava Mishra ほか", "venue": "Applied Geography", "date": "2026-10-04", "sjr": 1.597, "citescore": 10.0, "citescore_year": "2025", "apa": "Mishra, S., Raj, A., Kawasaki, T., & Pani, A. (2026). Nested spatial processes in urban food delivery: How scale and boundary choice shape built-environment relationships in New Delhi, India. Applied Geography, 197, 104206. https://doi.org/10.1016/j.apgeog.2026.104206", "why": "題名からは、インド・ニューデリーの都市型フードデリバリーを扱った研究とみられる。分析の空間単位や境界の選び方が、建造環境との関係の見え方を左右することを論じている（抄録は未確認）。", "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、インド・ニューデリーの都市型フードデリバリーを対象に、分析の空間単位や境界の選び方が、建造環境との関係の見え方をどう左右するかを扱った研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、同じデータでも、町を区切る単位を変えるだけで「建物が密な地区ほど配達が多い」といった関係が変わってしまうのではないか、です。地図の区切り方が結論を左右するという、空間分析の根本的な落とし穴を扱う問いです。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jn18", "rank": 18, "field": "交通・都市計画", "headline": "車社会の都市で自転車で買い物に行く難しさ", "title": "The unique challenges of cycling to the grocery store in a car dependent city", "url": "https://doi.org/10.1016/j.urbmob.2026.100290", "authors": "Teagan Johnson Caulfield ほか", "venue": "Journal of Urban Mobility", "date": "2026-10-04", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "apa": "Caulfield, T. J., & Ravensbergen, L. (2026). The unique challenges of cycling to the grocery store in a car dependent city. Journal of Urban Mobility, 10, 100290. https://doi.org/10.1016/j.urbmob.2026.100290", "why": "題名からは、自動車依存の都市で食料品店へ自転車で行くことに固有の課題を調べた研究とみられる（抄録は未確認）。", "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、自動車への依存が強い都市で、食料品店へ自転車で買い物に行くことに固有の課題を調べた研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、通勤の自転車は増えても、重い荷物を運ぶ買い物となると自転車が選ばれにくいのはなぜか、です。車社会の町を自転車でも暮らせる町に変えるには、買い物という日常の場面に目を向ける必要があるという視点です。", "unverified": "手法・データ・結果はすべて未確認（題名のみ）。"}}, {"id": "jn19", "rank": 19, "field": "交通・都市計画", "headline": "GISの多基準評価で都市の『スポンジ度』を測る", "title": "Assessing sponginess for urban resilience planning in metropolitan cities of Bangladesh: A GIS-based multi-criteria decision-making approach", "url": "https://doi.org/10.1016/j.habitatint.2026.104003", "authors": "Shovon Das ほか", "venue": "Habitat International", "date": "2026-10-04", "sjr": 1.892, "citescore": 11.8, "citescore_year": "2025", "apa": "Das, S., Hossain, M. Z., Rahman, M. M., & Rahaman, K. R. (2026). Assessing sponginess for urban resilience planning in metropolitan cities of Bangladesh: A GIS-based multi-criteria decision-making approach. Habitat International, 178, 104003. https://doi.org/10.1016/j.habitatint.2026.104003", "why": "題名からは、バングラデシュの大都市で雨水を吸収・保持する「スポンジ度」を、GISと多基準意思決定で評価した研究とみられる。都市の強靱化計画に生かす狙いがある（抄録は未確認）。", "explain": {"basis": "題名", "basis_note": "出版社のサイトから抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、バングラデシュの大都市で、雨水を吸収・保持する都市の「スポンジ度」を、GISと多基準意思決定で評価し、都市の強靱化計画に生かす研究とみられる（抄録は未確認）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問
