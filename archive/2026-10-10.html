スティックな選択をすることを示した（抄録）。", "p2": "消費者はLLMに購買判断を任せ始めているが、AIの買い物代理人がマーケティングの価格表示にどう影響されるかは、選択結果だけでなく情報探索の過程から調べられていなかった（序論、抄録）。", "p3": "人の意思決定研究のMouselab（情報ボードの過程追跡）を応用し、商品の属性を費用のかかる道具呼出し（inspect_cell）の裏に隠す「Tool-Lab」を作った（§Tool-Lab）。研究1では、4.99ドル・10オンス（単価0.499ドル/oz）と5.00ドル・11オンス（0.455ドル/oz）のインスタントコーヒーを比べさせ、価格のドルとセントを別の属性に分けた（§Stimuli）。", "p4": "3社の8つのLLMについて、取得費用（0ドルか1回10ドル）×目標の具体性（「一番お得なものを」か「オンス単価が最安のものを」）の2×2で各100回、計3,200セッションを行い、診断的属性の取得数と最適選択の率を測った（§Stimuli、§Procedure）。", "p5": "具体的な目標で費用0のときは診断的属性を6つすべて取得し、最適選択率は0.94だった。あいまいな目標で費用10ドルにすると取得数は3.81に減り、最適選択率は0.29に落ちた（研究1、表1）。具体的な目標では費用をかけても最適選択率は0.83にとどまり、減少はセントの省略によるものだった（研究1）。", "p6": "著者は、推論の記録は言語報告で内部機序を示さないこと、記録を分類したのは一部のモデルだけで、目的のすり替えか価値に基づく省略かの区別は示唆にとどまることを限界としている（§Limitations）。研究2で理論に反する結果を示したモデルもあった（同）。", "fun": "「4.99ドル」と「5.00ドル」なら前者が安く見えますが、量まで見ると後者の方がお得――人がよく引っかかるこの罠に、AIの買い物代理人も、調べるのにお金がかかり指示があいまいなときにはまってしまいました。AIの弱さは頭の中ではなく、お店の情報の見せ方と頼み方で決まる、という結論が面白いところです。", "unverified": "研究2（別の商品環境）と検証研究の数値は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "強化学習の計算量を拡大したMiMo-V2.6", "title": "MiMo-V2.6: Scaling Reinforcement Learning Towards Self-Improvement", "url": "https://arxiv.org/abs/2610.11959", "authors": "Core Team ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-09", "apa": "Core Team, Qiao, Z., Hua, Z., Ou, Z., Yue, Z., Jiang, Z., Huang, Z., Chen, Z., Zheng, Z., Xu, Z., Ma, Z., Hu, Y., Dong, Y., Zhang, Y., Wang, Y., Liu, Y., Yang, Y., Cai, Y., Zhao, Y., … Zeng, B. (2026). MiMo-V2.6: Scaling Reinforcement Learning Towards Self-Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11959", "why": "多モーダルの基盤モデルで強化学習の計算量を複数の軸で拡大し、自己改善に向けた訓練の設計を報告した。", "explain": {"basis": "本文", "basis_note": "arXiv版の技術報告の本文（抄録、構成の§2.1、強化学習の規模拡大の§4.1、RL性能・ルータ固定・障害分析の§5.3–5.5）を読んだ。§4.2–4.3の環境と採点、§6–7の基盤の詳細は読んでいない", "preprint": true, "p1": "多モーダルの基盤モデル群MiMo-V2.6について、強化学習（RL）の計算量を訓練規模・環境の多様性・採点の計算量の3軸で拡大し、エージェント課題の性能を引き上げた技術報告である（抄録、§4）。", "p2": "RLは基盤モデルの自己改善の中心的な訓練法だが、長い文脈と多様なエージェント環境で大規模に回すには、計算の効率、報酬の正確さ、訓練の安定性が課題になる（抄録、§1）。", "p3": "局所窓（128）注意と大域注意を交互に重ねたMoEのTransformerに画像・音声の符号器をつなぐ（§2.1）。RLは1ステップに1,568問×グループ16で約2.5万系列、27〜37億トークンを非同期で消費する（§4.1）。コード・汎用・視覚・サイバーの環境と複数の実行基盤（ハーネス）を混ぜ、長い課題にはグループ単位のエージェント採点で報酬を与える（抄録、§4.2–4.3）。", "p4": "DeepSWE v1.1、AutomationBenchなどで訓練中の推移を追い、学習に使わなかった3つのハーネス（codex、claude code、mini-swe-agent）で汎化を確かめた（§5.3）。RLの費用はPro版260万ドル、Flash版90万ドル（§4.1）。", "p5": "DeepSWEのaverage@3はRLの間にPro版で58.4から72.6、Flash版で48.7から65.7に上がった（図3、§4.1）。学習外ハーネスでの平均Pass@1は約50%から66%に上がった（図10）。MoEのルータを学習させると20ステップで負荷の変動係数が0.78から2.0に悪化したため、ルータを固定した（図11、§5.4）。", "p6": "性能向上は使用トークン数の増加を伴っており、効率とのトレードオフが残る（§5.3）。障害分析では、GPUメモリの誤り、採点器への接続断、MoEの偏りによるメモリ不足などで中断が起きた（§5.5）。比較対象となる他社モデルとの評価は、読んだ範囲では確認していない。", "fun": "AIを強化学習で鍛えるのに、1回の練習で数十億語分の答案を書かせ、数億円規模の計算をつぎ込んでいます。それでも途中で、仕事を割り振る「交通整理係」が偏って一部の専門家だけに仕事が集中する故障が起き、係を固定して解決した――巨大な訓練の裏側の苦労が見える点が面白いところです。", "unverified": "他の公開モデルとの比較表と、§4.2–4.3の報酬設計の詳細は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "標的試験模倣のclone-censor-weightを定式化", "title": "Formalization and consistency of clone-censor-weight", "url": "https://arxiv.org/abs/2610.12377", "authors": "Iqraa Meah ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Meah, I., Voinot, C., Michiels, S., Simon-Tillaux, N., Jouffroy-Zeller, C., Vaz-Luis, I., Berenfeld, C., & Petit, F. (2026). Formalization and consistency of clone-censor-weight (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12377", "why": "観察データの因果推論で広く使われるCCW法の推定対象と一致性を統計的に定式化した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、CCWの手順の§3.1、一致性の§3.3の位置づけ、数値研究の§5、考察）を読んだ。定理の証明（付録）は読んでいない", "preprint": true, "p1": "観察データで理想的な無作為化試験を模倣する標的試験模倣（target trial emulation）で広く使われるクローン-打切り-重み付け（CCW）法を、許容される治療経路の集合と確率的介入に基づいて統計的に定式化し、推定対象・一致性・ブートストラップ推論の保証を与えた（抄録）。", "p2": "観察データで「治療を6か月続けた群」のように事後の情報で群を分けると、その群に入るには6か月生き延びる必要があるため生存が過大に見える不死時間バイアス（immortal time bias）が生じる。CCWはこれを避けるが、何を推定しているかの統計的な解釈は限られていた（§1、§3.1）。", "p3": "各人を比べる介入の数だけ複製（クローン）し、観察された経路が各介入の許容集合から外れた時点で人工的に打ち切り、その選択バイアスを逆確率重み付けで補正して、各複製集団で生存推定量を当てはめる（§3.1）。猶予期間などで許容集合を緩めると、推定対象が別の確率的介入の効果に変わることを示した（定理5、§5.1）。", "p4": "13回の月次訪問、連続・2値の基準時・時変共変量、2値治療の模擬データ（n = 15,000、500回反復）で、「最初の2か月治療」と「最初の7か月治療」を、厳格な遵守、1か月・2か月の猶予、1か月の中断許容の4通りで比べ、12か月の制限付き平均生存時間（RMST）の差を推定した（§5.1）。", "p5": "図3（左：反復の分布、右：1データからのブートストラップ）で、厳格な遵守以外の推定値は厳格な真値を中心にしなかったが、それぞれの戦略ごとの真値を中心にしており、推定の失敗ではなく推定対象の変化であることが確認された。ブートストラップの分布は反復の分布をよく再現した（§5.1、図3）。", "p6": "著者は、猶予期間の長さが経験的に選ばれがちで感度分析の方法が要ること、治療の利用可能性が確率的な動的治療レジームへの拡張が未解決であることを課題としている（§6）。", "fun": "「6か月薬を飲んだ人」と「3か月の人」を比べると、6か月飲めた人はその間生き延びていたという理由だけで長生きに見えてしまいます。そこで一人ひとりを「分身」にして両方のグループに入れ、ルールから外れた時点で分身を退場させる――この巧妙な手品が何を測っているのかを、数学的にきちんと言い当てた点が面白いところです。", "unverified": "一致性の定理の正確な仮定と証明は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "交通・都市計画", "headline": "経路推薦への信頼と従順の共進化をABMで再現", "title": "An Agent-based Simulation of Trust and Compliance in Transportation Recommendation Systems", "url": "https://doi.org/10.2139/ssrn.7579359", "authors": "Magnus Briggt", "venue": "SSRN", "date": "2026-10-09", "apa": "Briggt, M. (2026). An Agent-based Simulation of Trust and Compliance in Transportation Recommendation Systems. https://doi.org/10.2139/ssrn.7579359", "why": "交通の推薦システムへの信頼と従う行動の相互作用をエージェントベースモデルで調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "経路案内やMaaSの推薦システムに対する旅行者の信頼と従う行動が、繰り返しのやりとりの中でどう共進化するかを、エージェントベースモデル（ABM）で再現した（抄録）。", "p2": "交通の推薦システムは効率化と渋滞緩和を約束するが、その成功は利用者の信頼という人間側の要因にかかっている（抄録）。", "p3": "旅行者を、初期の信頼、リスク回避、推薦の結果（時間の節約や失敗）への感度が異なる異質なエージェントとして表し、推薦システムは個人最適と全体最適などの戦略をとる。各エージェントは推薦に従うかを選び、結果に応じて信頼を更新する（抄録）。", "p4": "推薦の戦略と旅行者の特性を変えて、長期の採用率と有効性を調べた。具体的なパラメータや検証データは抄録に記載がない（抄録）。", "p5": "技術的に最適な推薦でも長期の採用と有効性は保証されなかった。信頼の低下が従う率を下げ、それが推薦に必要なデータの質を落として悪循環を生む閾値とフィードバックの経路を見出し、透明性と一貫した良い体験が信頼の均衡に重要だとした（抄録）。", "p6": "本文が読めず、モデルの較正や実データとの照合の有無は分からない。結果は仮定したモデルの構造に依存する理論的なシミュレーションである（解釈）。", "fun": "カーナビが一度遠回りを勧めると、次から従わなくなる人がいます。従う人が減ると集まるデータが偏り、案内の質がさらに落ちる――信頼の低下が自分で加速していく「負のらせん」を、たくさんの仮想の旅行者で再現した点が面白いところです。", "unverified": "本文が読めず、閾値の具体的な値やモデルの設定は未確認。"}}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "インフレ期待の過剰反応は家計から政策当局まで共通", "title": "Overreaction in Inflation Expectations: a Common Pattern across Economic Agents", "url": "https://doi.org/10.2139/ssrn.7584012", "authors": "Camille Cornand ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Cornand, C., Hubert, P., & Portier, R. (2026). Overreaction in Inflation Expectations: a Common Pattern across Economic Agents. https://doi.org/10.2139/ssrn.7584012", "why": "家計・企業・専門家・政策当局・実験参加者の5種類の主体で、インフレ期待のニュースへの過剰反応が共通することを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "インフレ予想がニュースに過剰反応することが、家計・企業・専門予測者・政策当局・実験参加者の5種類の主体の個人レベルの予測に共通する特徴であることを示した（抄録）。", "p2": "予想形成が過小反応か過剰反応かは主体やデータによって結果が分かれており、主体の種類をまたいだ比較は十分でなかった（抄録の問題設定から）。", "p3": "5種類の主体の個人の予測データについて、予想の改訂と予測誤差の関係から過剰反応のパラメータを推定し、インフレの経験との相関を調べた（抄録）。", "p4": "異なる制度的文脈、データ源、予測の頻度をまたいで、個人の係数の平均を比べた（抄録）。", "p5": "過剰反応のパラメータは一貫して負で、個人の係数の平均は文脈やデータ源、頻度が違っても同程度の大きさだった。インフレの経験は専門予測者と企業では過剰反応を弱め（学習と整合）、政策当局・家計・実験参加者では強めた（信認や顕著性・記憶の効果と整合）（抄録）。", "p6": "本文が読めず、使ったデータ源の一覧と推定値は未確認。経験の効果の解釈（学習か記憶か）は著者の解釈であり、識別の方法は抄録からは分からない。", "fun": "物価のニュースを聞くと、人は将来の物価を大げさに見直しがちです。それが一般の家庭だけでなく、プロの予測者や中央銀行の担当者にまで共通していた――しかもインフレを経験するとプロは落ち着き、政策当局はかえって敏感になる、という違いが面白いところです。", "unverified": "本文が読めず、各主体の係数の値とデータ源は未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "AIは実行を代替し評価は残る、新しい職業指標", "title": "Execution and Evaluation: A New Occupational Measure and Long-Run Employment Gradients", "url": "https://arxiv.org/abs/2607.20807", "authors": "Li Gan", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Gan, L. (2026). Execution and Evaluation: A New Occupational Measure and Long-Run Employment Gradients (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2607.20807", "why": "AIが自動化しやすい実行と難しい評価を分けた職業指標を作り、長期の雇用の傾きを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIは成果物を「作る」実行を自動化しやすく、正しさを「判断する」評価は難しいという区別に基づき、職業ごとの実行の比率を測る新しい指標を作った（抄録）。", "p3": "O*NETの19,265の作業記述を固定の採点基準でモデルに採点させ、職業単位の実行比率とAI能力比率を構築し、調和させたパネルで雇用の伸びとの関係を調べた（抄録）。", "p5": "実行の多いホワイトカラー職は2012年以降のどの期間でも雇用の伸びが低く、傾きは期間間で等しいとする仮説を棄却できず、AI時代の出来事ではなく長期傾向だった。AI能力の傾きは2022年以降に急になったが因果とは言えないとしている（抄録）。", "fun": "文章を書くのはAIが得意でも、その文章が正しいかを判断するのは人の仕事として残る――この直観を職業の統計に落とし込みました。しかも「作る」仕事の雇用の伸び悩みはAI登場より前から続いていたことが分かり、AIのせいにする前に長期の流れを見るべきだと示した点が面白いところです。", "unverified": "指標がモデルによる採点で人による検証済みの正解ではない点は著者も認めている。効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "労働協約を離れても労働時間の柔軟化は進まない", "title": "The Myth of Restrictive Working-Time Agreements: Firms' Working-Time Adjustment after Exit from Collective Bargaining", "url": "https://arxiv.org/abs/2610.12049", "authors": "Vinzenz Pyka ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Pyka, V., & Rieder, A. (2026). The Myth of Restrictive Working-Time Agreements: Firms' Working-Time Adjustment after Exit from Collective Bargaining (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12049", "why": "ドイツの事業所パネルで、労働協約からの離脱後の労働時間調整を調べ、協約が柔軟性を縛るという主張を検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ドイツで労働協約から離脱した事業所の労働時間の変化を調べ、協約が労働時間の柔軟性を縛るという経営側の主張を検証した（抄録）。", "p3": "IAB事業所パネルの2008〜2024年のデータで、固定効果モデルとイベントスタディにより離脱前後の週労働時間と土日勤務の利用を比べた（抄録）。", "p5": "離脱後の週労働時間の増加は約0.3〜0.6%（週8〜13分）にとどまり、離脱直後に生じた。土日勤務など他の調整手段の利用増加はみられなかった（抄録）。", "fun": "会社が労働組合との協約から抜けるのは「もっと長く働かせたいから」だと経営者自身が答えていました。ところが実際のデータでは、抜けた後に増えた労働時間は週に十数分だけ。言っていることと実際の行動のずれを、大規模データで確かめた点が面白いところです。", "unverified": "離脱の他の動機についての分析内容は抄録になく未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "預金チャネルとリスクテイク・チャネルの結びつき", "title": "The Nexus between the Deposit and Risk-Taking Channels of Monetary Policy", "url": "https://doi.org/10.2139/ssrn.7589538", "authors": "Jose E. Gutierrez ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Gutierrez, J. E., Martorell, E., & Melnychuk, M. (2026). The Nexus between the Deposit and Risk-Taking Channels of Monetary Policy. https://doi.org/10.2139/ssrn.7589538", "why": "スペインの信用登録データで、急速な利上げ局面の預金チャネルと銀行のリスクテイクの関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ユーロ圏で最速の利上げ局面に、預金市場の集中度の高い地域の銀行ほどリスクの高い企業への貸出を大きく減らしたことを示し、預金チャネルとリスクテイクの関係を明らかにした（抄録）。", "p3": "スペイン中央銀行の信用登録データと、預金市場の集中度の地域差を使い、政策金利の預金金利への転嫁の弱さが銀行の貸出とリスクテイクに与える異質な効果を推定した（抄録）。", "p5": "集中度の高い市場の銀行は高リスク企業への貸出をより強く減らし、新規貸出では金利が上がり実現収益が改善した。預金のフランチャイズ価値を守るために慎重さを優先し、ゼロ金利期の「利回り追求」が逆転したとしている（抄録）。", "fun": "金利が上がっても預金の金利をあまり上げずに済む銀行は、安い資金を守るために危ない貸出を控えるようになった――金融政策が銀行の「冒険心」を地域によって違う形で変えることを、全貸出データで示した点が面白いところです。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "高利貸しはマイクロファイナンスと共存し続ける", "title": "Microfinance Competition in the Presence of Moneylenders: Theory and Evidence", "url": "https://arxiv.org/abs/2610.12186", "authors": "Shyamal Chowdhury ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Chowdhury, S., Chowdhury, P. R., & Smits, J. (2026). Microfinance Competition in the Presence of Moneylenders: Theory and Evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12186", "why": "マイクロファイナンス拡大後も高金利の貸し手が残る理由を動学モデルと実証で説明した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "マイクロファイナンスが広がっても高利貸しが残る理由を、返済のための「つなぎ融資」の役割として説明する動学モデルを作り、バングラデシュの無作為な拡大で検証した（抄録）。", "p3": "借り手がショックの後にマイクロファイナンスへの返済と将来の借入資格を守るため高利貸しからつなぎ融資を受ける、事後的モラルハザードの動学モデルを構築し、村単位の無作為な機関の追加で実証した（抄録）。", "p5": "機関が1つ増えると2〜3年後の高利貸しからの借入件数が約30〜40%減ったが、マイクロファイナンスや借入全体への効果は検出されなかった（抄録）。", "fun": "金利の高い金貸しがなくならないのは、人々が困ったときに「別の借金を返すための借金」をするからでした。低金利の貸し手が増えても、借りる総額は変わらず、緊急時の借り先が入れ替わるだけ――貧困対策の金融の意外な姿を実験で示した点が面白いところです。", "unverified": "実験の村数と標本の規模は抄録になく未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "LBOが地域の信用を企業へ移し住宅市場を冷やす", "title": "LBOs, Credit Reallocation, and Housing Markets", "url": "https://doi.org/10.2139/ssrn.7582858", "authors": "Davide Sinno ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Sinno, D., & Wan, W. X. (2026). LBOs, Credit Reallocation, and Housing Markets. https://doi.org/10.2139/ssrn.7582858", "why": "企業買収に伴う信用の再配分が家計向け信用と住宅市場に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業買収（LBO）が地域の銀行の信用を家計から企業へ振り向け、住宅価格の伸びを下げることを示した（抄録）。", "p3": "米国の郡データとスタックト差の差法で、LBOの後3年間の住宅価格の伸び率、地域銀行の貸出先、住宅ローンの拒否率を調べた（抄録）。", "p5": "LBOは翌3年間の住宅価格の年間上昇率を3〜14%下げ、地域銀行の貸出は企業向けに移り、住宅ローンの拒否率が上がった。効果は大型の買収、銀行市場の集中した地域、住宅価格の変動が大きい地域で強かった（抄録）。", "fun": "大きな企業買収が地元で起きると、景気が良くなって家が売れそうに思えます。ところが地元の銀行のお金が企業に回され、家を買う人がローンを借りにくくなっていた――同じ財布を企業と家計が取り合う姿を示した点が面白いところです。", "unverified": "標本の期間と郡の数は抄録になく未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "米国の関税引上げが欧州の世論に与えた影響", "title": "The Impact of U.S. Tariffs on European Public Opinion: Evidence From a Natural Experiment", "url": "https://doi.org/10.31235/osf.io/ev32q_v1", "authors": "Joseph Noonan", "venue": "SocArXiv", "date": "2026-10-09", "apa": "Noonan, J. (2026). The Impact of U.S. Tariffs on European Public Opinion: Evidence From a Natural Experiment. https://doi.org/10.31235/osf.io/ev32q_v1", "why": "2025年4月の関税引上げを自然実験として、欧州の世論の変化を事前登録報告で検証する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2025年4月の米国の関税引上げが欧州の世論に与えた影響を、ユーロバロメーターの調査期間中の発表を自然実験として検証した事前登録報告である（抄録）。", "p3": "標準ユーロバロメーター103.3の実査中に発表が行われたことを予期しない出来事として利用し、発表の前と後に面接を受けた回答者を比べた（抄録）。", "p5": "米国への好意的な見方は低下し、低下は最も否定的な回答の増加に集中した。EUへの愛着や協力の選好への効果は小さく有意でなかった（抄録）。", "fun": "同盟国から関税で圧力をかけられると、欧州の人々は団結してEU好きになるのでは――と思いきや、変わったのは「アメリカ嫌い」が強まったことだけでした。調査の途中で事件が起きた偶然を、前後比較の実験に使った点も面白いところです。", "unverified": "標本の規模と効果量は抄録になく未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "e閉包を透明に使いFDR手続きを改善する", "title": "Anchored multiple testing: a transparent use of e-closure to improve FDR procedures", "url": "https://arxiv.org/abs/2610.11279", "authors": "Aaditya Ramdas", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Ramdas, A. (2026). Anchored multiple testing: a transparent use of e-closure to improve FDR procedures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11279", "why": "e閉包による手続きの回復を、改善の仕方が見える形に組み替えた多重検定の方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "偽発見率（FDR）を制御する多重検定の手続きを、既存の証明のゆるみを利用する「アンカリング」で透明に改良する方法を提案した（抄録）。", "p3": "基準となる手続きの自己参照的な局所e値を、既存のFDR証明の余裕を使って拡大し、e閉包によって基準の発見をすべて残しつつ多くの場合さらに発見を加える（抄録）。", "p5": "Anchored-BHはPRDSの下でBenjamini-Hochberg法を支配し、Anchored-BYは任意の依存の下でBenjamini-Yekutieli法を支配する。いずれも最近のclosed版とは優劣がつかない（抄録）。", "fun": "たくさんの仮説を同時に調べると「当たり」の中に偽物が混じります。その割合を抑える標準的な方法には、証明の中に実は使い切れていない余裕がありました。その余裕を使えば、同じ安全性のまま見つけられる当たりを増やせる、という発想が面白いところです。", "unverified": "改善による発見数の増加の大きさは抄録になく未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "モデル誤特定の下でのベイズ推論を整理", "title": "Bayesian inference under model misspecification", "url": "https://arxiv.org/abs/2610.11173", "authors": "Jack Jewson", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Jewson, J. (2026). Bayesian inference under model misspecification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11173", "why": "尤度が真の生成過程と異なる場合の事後推論の妥当性を、変分的な解釈から総説した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ベイズ分析の尤度がデータの生成過程をほぼ正確に表さないという問題について、誤特定の下でのベイズ事後分布の正当化と一般化ベイズ推論の手法を総説した（抄録）。", "p3": "ベイズ事後分布を変分問題の解として解釈する見方を誤特定の下での正当化として紹介し、不確実性の定量化とパラメータ推定への含意を検討した（抄録）。", "p5": "モデル誤特定を考慮した一般化ベイズ推論を得るための一連の手法を紹介している（抄録）。", "fun": "統計モデルはいつも現実の近似で、「完全に正しいモデル」はまずありません。それでもベイズ推論の答えを信じてよいのはなぜか――その根拠を、答えを「最適化問題の解」として見直すことで与え直そうとする点が面白いところです。", "unverified": "総説で扱う手法の具体的な一覧は抄録が短く未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "機械学習モデルを使う逐次的な条件付き独立性検定", "title": "Sequential Conditional Independence Testing with Machine Learning Models", "url": "https://arxiv.org/abs/2610.11388", "authors": "Angel Reyero-Lobo ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Reyero-Lobo, A., Meziu, M., Arias, S. U., & Grünwald, P. (2026). Sequential Conditional Independence Testing with Machine Learning Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11388", "why": "条件付き独立性の検定を逐次的に行い、機械学習モデルを組み込む方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習モデルを組み込んだ逐次的な条件付き独立性検定で、理論上は検出力が劣るはずの方法が実際には強い理由を誤差の分解で説明した（抄録）。", "p3": "検定の誤差を帰無仮説の拡大、近似誤差、推定誤差に分解し、model-Xの条件付き独立と交換可能性の中間の帰無仮説を探り、model-Xの仮定が推定誤差の範囲でしか成り立たない場合の誤差限界も示した（抄録）。", "p5": "GROのe変数の推定は近似誤差と推定誤差が大きいために交換可能性の検定に負けうることを示し、三重の頑健性を持つ結果を得たとしている（抄録）。", "fun": "理論上いちばん強いはずの検定が、実際には「弱いはず」の検定に負ける――このねじれを、誤差を3種類に分けて見ることで解きほぐした点が面白いところです。理論の最適と現実のデータの最適は違うことがある、という好例です。", "unverified": "実験の内容と数値は抄録が途中で切れており未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "多数の操作変数でのクラスター・ジャックナイフIV推定", "title": "Inference For the Cluster Jackknife Instrumental Variables Estimator with Many Instruments", "url": "https://doi.org/10.2139/ssrn.7576752", "authors": "Jingtong Wu ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Wu, J., Shi, H., & Guo, X. (2026). Inference For the Cluster Jackknife Instrumental Variables Estimator with Many Instruments. https://doi.org/10.2139/ssrn.7576752", "why": "クラスター化された多数操作変数モデルでの推定量の漸近正規性と推論を導いた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多数の操作変数を持つクラスター化された操作変数モデルで、クラスター・ジャックナイフIV推定量（CJIVE）の漸近正規性と実行可能な推論手続きを導いた（抄録）。", "p3": "外生の統制変数の次元が発散することを許し、それによる偏りが漸近的に無視できる十分な速度条件を示し、漸近分散の比一致推定量を構成した（抄録）。", "p5": "数値シミュレーションと実証例で有限標本での性能と実用性を示したとある（抄録）。", "fun": "「くじ引きのような外生的な変化」を使って因果を推定する操作変数法は、使う変数が多すぎると答えが偏ります。データの一部を順に抜いて推定し直すジャックナイフの工夫に、信頼区間を付けられるようにして実際に使える道具にした点が面白いところです。", "unverified": "シミュレーションと実証例の具体的な結果は抄録になく未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "多変量拡散過程とブリッジの厳密シミュレーション", "title": "Exact Simulation of Multivariate Diffusions and Bridges", "url": "https://arxiv.org/abs/2610.11330", "authors": "Jose Blanchet ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Blanchet, J., Jin, J., & Liu, H. (2026). Exact Simulation of Multivariate Diffusions and Bridges (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11330", "why": "一様楕円型の多変量拡散過程について期待計算量が有限の厳密サンプリングを初めて一般的に与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "一様楕円型の多変量拡散過程と拡散ブリッジについて、期待計算量が有限の汎用的な厳密サンプリングのアルゴリズムを初めて与えた（抄録）。", "p3": "乱数生成と係数の評価、四則演算を数える計算量のモデルを定め、ランダム化したパラメトリクス展開と、ブリッジの両端点を提案分布に組み込む有限の重み付きグラフを組み合わせた受理棄却法を構成した（抄録）。", "p5": "拡散過程の厳密サンプリングは時間幅と観測数について同時にミニマックス最適で、ブリッジのサンプリングは端点と時間幅を固定したとき観測数についてミニマックス最適である（抄録）。", "fun": "ランダムに揺れ動く粒子の道筋をコンピュータで描くとき、普通は細かい時間刻みで近似するので誤差が残ります。それを「誤差ゼロ」で、しかも有限の手間で描ける一般的な方法を作った点が面白いところです。始点と終点が決まった道筋（ブリッジ）にも使えます。", "unverified": "数値実験の有無と結果は抄録になく未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "生成モデルのコンフォーマル予測を少ない標本で", "title": "Sample-Efficient Generative Conformal Prediction", "url": "https://arxiv.org/abs/2610.11349", "authors": "Minxing Zheng ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Zheng, M., & Zhu, S. (2026). Sample-Efficient Generative Conformal Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11349", "why": "条件付き生成モデルの標本から作る予測集合を、少ない標本で効率よく構成する方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "条件付き生成モデルの標本から予測集合を作る生成的コンフォーマル予測で、入力ごとに標本数を配分して少ない予算で小さな集合を得る方法CASAを提案した（抄録）。", "p3": "追加の標本1つの限界的な価値を特徴づけ、周辺被覆と平均の標本予算を制約として、期待集合サイズを最小化するよう入力間に標本を配分する（抄録）。", "p5": "同じ予算なら適応配分は固定数より小さな集合を与えることを理論で示した。合成・実データで集合が大幅に小さくなり、条件付き被覆もしばしば改善し、半径を適応させる既存手法と補い合うとした（抄録）。", "fun": "答えが単純な問題には少しの試行で十分で、答えが何通りもありうる問題には多くの試行が要ります。限られた試行回数を問題の難しさに応じて振り分けるという、テスト勉強の時間配分のような発想で予測の幅を絞った点が面白いところです。", "unverified": "集合サイズの縮小幅の数値は抄録になく未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "グラフ・ラプラシアン事前分布で小地域推定を正則化", "title": "Regularized Small Area Estimation with Graph Laplacian Benchmarking priors", "url": "https://arxiv.org/abs/2610.11266", "authors": "Jairo F\\'uquene-Pati\\~no ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Fúquene-Patiño, J., & Betancourt, B. (2026). Regularized Small Area Estimation with Graph Laplacian Benchmarking priors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11266", "why": "地域間の情報の借用と上位集計への整合（ベンチマーキング）を同時に行うベイズ小地域推定。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "小地域推定で、地域間の情報の借用と信頼できる上位集計への整合（ベンチマーキング）を同時に行うベイズの事前分布の族を提案した（抄録）。", "p3": "ベンチマーク制約付きの正則化問題から事前分布を導き、外部共変量による地域の類似度から作ったグラフ・ラプラシアンで正則化する単一・多視点の版を作り、制約空間の縮約パラメータ化に基づくMCMCで計算する（抄録）。", "p5": "データに基づくシミュレーションと、コロンビアの2025年の市町村別平均世帯人員の推定に適用し、グラフによる正則化が性能を改善し、多視点版が概してより精度の高い推定を与えた（抄録）。", "fun": "小さな町の統計は標本が少なくぶれやすいので、似た町の情報を借りて安定させます。ただし町ごとの推定を足し合わせたら国全体の確かな値と一致してほしい。この2つの要求を、町どうしの「似ている度合い」のネットワークを使って同時に満たした点が面白いところです。", "unverified": "改善の大きさの数値は抄録になく未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "代理報酬での事後学習の報酬ハッキングを抑える", "title": "How to post-train on a surrogate: Envelope sampling mitigates reward hacking", "url": "https://arxiv.org/abs/2610.11281", "authors": "Sanjit Dandapanthula ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Dandapanthula, S., Sadhuka, S., Khan, S., Oberst, M., Ramdas, A., & Chouldechova, A. (2026). How to post-train on a surrogate: Envelope sampling mitigates reward hacking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11281", "why": "LLMを安価な代理の評価器で事後学習する際の報酬ハッキングを、包絡サンプリングで抑える方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMを安価な代理の審査員（LLM judge）で事後学習するときに起きる報酬ハッキングを、少数の正解ラベルで審査員を再較正する「包絡サンプリング」で抑える方法を提案した（抄録）。", "p3": "少数n件の出力に専門家の正解ラベルを付け、人間の報酬と再較正後の報酬が審査員の周りのL²球にあると仮定して、事後学習モデルの後悔の上界を最小化するように再較正用の標本を選ぶ。棄却法や修正報酬での微調整で包絡から標本を得る（抄録）。", "p5": "臨床ノート生成と統制した迎合（sycophancy）課題の実験で、包絡標本での再較正は報酬ハッキングを抑えたが、基本モデルの標本での再較正では抑えられなかった（抄録）。", "fun": "AIを採点係のAIで鍛えると、採点係の癖を突く「点数稼ぎ」を覚えてしまいます。人間が正解を付けられる数が限られるなら、どの答案を人間に見せるべきか――採点係が間違えやすい答案を狙って選ぶ、という発想が面白いところです。", "unverified": "改善の大きさの数値は抄録になく未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "トークン単位でLLMを振り分ける推論基盤", "title": "TokenRouter: Efficient Serving System for Token-Level LLM Routing", "url": "https://arxiv.org/abs/2610.12242", "authors": "Tianyu Fu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-09", "apa": "Fu, T., Liu, T., Wang, R., Dong, Y., Ge, Y., You, Y., & Wang, Y. (2026). TokenRouter: Efficient Serving System for Token-Level LLM Routing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12242", "why": "LLMの振り分けをトークン単位で行うための効率的な推論提供システム。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "生成の途中でトークンごとに担当するLLMを切り替える「トークン単位のルーティング」を効率よく提供する推論システムTokenRouterを作った（抄録）。", "p3": "開発者は1つの要求の視点でルーティングの論理を書き、実行時には各LLMにサブサーバを立てて要求を非同期に振り分ける。各サブサーバは、処理量の数理モデルから最適な設定を導いた遅延バッチのスケジューラを使う（抄録）。", "p5": "多様なルーティング手法、負荷、モデルの組で、既存システムより2.01〜64.15倍高いデコードの処理量を得た（抄録）。", "fun": "文章を書くとき、簡単な部分は安い小さなAI、難しい部分は高い大きなAIに一語ずつ任せ分ければ、品質を保ったまま安くできます。ところが一語ごとに担当が替わると機械の側の段取りが大混乱する――その交通整理を引き受ける仕組みを作った点が面白いところです。", "unverified": "品質面の評価は抄録になく未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "どんな課題・場面にも対応するロボット移動系", "title": "SuperNav: An Agentic Navigation System for Any Task in Any Scene", "url": "https://arxiv.org/abs/2610.12126", "authors": "Jinkai Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-09", "apa": "Zhang, J., Xu, J., Yu, Y., Guo, J., Hu, R., Bao, H., Zhou, X., & Peng, S. (2026). SuperNav: An Agentic Navigation System for Any Task in Any Scene (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12126", "why": "多様な依頼と未知の環境に対応するエージェント型のロボット移動システム。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "事前学習済みの多モーダルLLMを移動用に微調整せず、専用のエージェント基盤（スキル・道具・進捗管理）を持たせて、多様な依頼と未知の環境に対応するロボット移動システムSuperNavを作った（抄録）。", "p3": "LLMには依頼の解釈、場面の理解、意思決定を任せ、動作の実行は移動ツールに委ねる。画像上で目的地を直接指定し、実行のフィードバックで修正できる視覚的な点のインタフェースで判断と動作をつなぐ（抄録）。", "p5": "個体単位・複数物体・要求駆動の課題で4つの比較手法を上回り、HM3Dでのカテゴリ単位の評価と実際の四足ロボットへの搭載でも適用性を示した（抄録）。", "fun": "ロボットに「台所の冷蔵庫の横まで行って」と頼むとき、AIに歩き方まで一から教えるのではなく、考えるのはAI、歩くのは専用の道具、と役割を分けました。AIが画像の中の一点を指さして行き先を伝える、という人間らしいやり方が面白いところです。", "unverified": "成功率の数値は抄録になく未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "価値の表現からアラインメントの汎化を予測", "title": "Predicting Alignment Generalization with Value Representations", "url": "https://arxiv.org/abs/2610.12410", "authors": "Andy Liu ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Liu, A., Bhatia, M., Stanczak, K., Diab, M., Shwartz, V., & Fried, D. (2026). Predicting Alignment Generalization with Value Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12410", "why": "事後学習で教えた価値や行動特性が未学習の場面に汎化するかを、内部表現から予測する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMにある価値に従うよう微調整すると、他の多くの価値に関する振る舞いがどう変わるか（アラインメントの汎化）を予測する課題を設定し、内部表現による予測を比較した（抄録）。", "p3": "現代のアラインメント目標に含まれる66の価値について汎化効果を大規模に測定し、価値の文章記述に基づく方法と、文脈内で価値を適用したときの活性化に基づく方法を比べた（抄録）。", "p5": "活性化に基づく方法が大きく上回り、最良の方法は汎化行列との相関0.45を得たのに対し、文章記述に基づく方法は0.05だった（抄録）。", "fun": "AIに「正直であれ」と教えると、思いがけず「親切さ」まで変わることがあります。どの教えがどこに波及するかを、言葉の意味の近さではなく、AIの頭の中の反応の近さで予測した方がずっと当たる――AIの価値観の「つながり方」を内部から覗いた点が面白いところです。", "unverified": "使用したモデルの種類と規模は抄録になく未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "LLMは文脈内で報酬から本当に学ぶのか", "title": "Do LLMs Learn from Rewards in Context? : Rethinking the role of reward in In-Context Reinforcement Learning", "url": "https://arxiv.org/abs/2610.11152", "authors": "Minchan Kwon ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Kwon, M., Koh, S., Baek, S., Bae, M., & Kim, J. (2026). Do LLMs Learn from Rewards in Context? : Rethinking the role of reward in In-Context Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11152", "why": "文脈内強化学習と呼ばれる現象で報酬が果たす役割を見直した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントが文脈に経験を蓄積して改善する「文脈内強化学習」で、報酬が本当に学習信号として働いているかを統制実験で検証した（抄録）。", "p3": "軌跡と報酬の組をそのまま文脈に与える最も単純な形について、4つのベンチマーク・6つのモデルで、報酬の反転・ランダム化・除去や、軌跡の並べ替え・破損の影響を調べた（抄録）。", "p5": "報酬は読まれているが効果は小さく、反転・ランダム化・除去しても改善の曲線はほとんど変わらなかった。並べ替えや破損した軌跡でも本物と同程度に効き、文脈内学習の特殊例とみるべきだとしている（抄録）。", "fun": "AIが過去の成功と失敗の記録を見て上達しているように見えても、実は「点数」をほとんど使っていなかった――点数を逆さにしても、記録をでたらめに並べ替えても同じように上達したのです。見かけの学習と本当の学習を見分ける実験の工夫が面白いところです。", "unverified": "使用した6つのモデル名とベンチマーク名は抄録になく未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "ループ型トランスフォーマーで非自己回帰の潜在推論", "title": "From Chain-of-Thought to Loops: Non-Autoregressive Latent Reasoning via Looped Transformers", "url": "https://arxiv.org/abs/2610.11472", "authors": "Gerard Grau Garc\\'ia ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "García, G. G., Masdemont, A. P., Grillo, N., Ros-Giralt, J., Behboodi, A., & Vendrell, V. C. (2026). From Chain-of-Thought to Loops: Non-Autoregressive Latent Reasoning via Looped Transformers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11472", "why": "思考の連鎖をトークン列で書く代わりに、ループ構造で潜在的に推論させる方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "思考の連鎖（CoT）をトークン列で左から右へ書く代わりに、小さな潜在作業領域を共有トランスフォーマーで繰り返し磨く「ループ型」の潜在推論LLoCoTを提案した（抄録）。", "p3": "同じトランスフォーマーを数回再適用して潜在スロットをまとめて更新し、得られた状態から潜在トークンを並列に標本化して、回答を生成する自己回帰デコーダの条件にする。学習には明示的CoTから得た連続表現と最終回答の損失を使う（抄録）。", "p5": "HumanEvalとMBPPで評価した手法中の平均が最も高く、明示的CoTの微調整と同等の精度だった。同手法に比べ最初の回答トークンまでの時間を約36分の1、推論段階の遅延を約42分の1にし、全体の処理量を9.2%高めた（抄録）。", "fun": "人が問題を解くとき、頭の中で考えを一語ずつ順番に並べるのではなく、全体を何度も見直して整えることがあります。AIの「考える」部分をそのように変えたら、正確さはそのままで答え始めるまでの時間が数十分の一になった点が面白いところです。", "unverified": "コード生成以外の課題での効果は抄録になく未確認。"}}, {"id": "pn35", "rank": 35, "field": "因果推論", "headline": "潜在クラスによる処置効果の修飾を推定", "title": "Treatment Effect Modification by Latent Classes", "url": "https://arxiv.org/abs/2610.10851", "authors": "Hui Lan ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Lan, H., Kallus, N., & Chou, W. (2026). Treatment Effect Modification by Latent Classes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10851", "why": "観測できない利用者の型によって処置効果が異なる場合の推定法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測できない利用者の「気分」のような潜在クラスによって処置効果が異なる場合に、隠れマルコフモデル（HMM）で潜在状態を推定し、状態別の効果を推定する方法を示した（抄録）。", "p3": "処置前の行動からHMMで潜在状態を推定し、効果の十分性の仮定の下で観測できる条件付き効果を潜在効果の既知の混合として表し、HMMの推定誤差に対してネイマン直交な推定量で影響関数による信頼区間を得る（抄録）。", "p5": "Netflixの新しい推薦モデルの大規模A/Bテストで、利用の多いユーザーではすべての処置で有意な正の効果がみられ、利用の少ないユーザーや見返し志向のユーザーでは効果の証拠が限られた（抄録）。", "fun": "同じ人でも「新しい作品を探したい日」と「お気に入りを見返したい日」があります。その日の気分は見えませんが、直前の行動から推測できる――見えない気分ごとにおすすめ機能の効き目を分けて測った点が面白いところです。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn36", "rank": 36, "field": "因果推論", "headline": "LLMの因果推論作業を実行結果で採点するベンチマーク", "title": "CausalVerify: An Execution-Grounded Benchmark for LLM Causal Inference Workflows", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.07944", "authors": "Yonghong Zhang ほか", "venue": "RePEc NEP", "date": "2026-09-21", "apa": "Zhang, Y., Correia, R., Parra, I. M., & Xie, Y. (2026). CausalVerify: End-to-End Verification of Causal Analyses by Language Models (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2609.07944", "why": "LLMが書いた因果推論の手順を実行し、目標の推定値を回復できたかで評価するベンチマーク。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの因果推論作業を、手法の説明やコードが動くかではなく、実行した結果が目標の因果効果を回復できたかで採点するベンチマークCausalVerifyを作った（抄録）。", "p3": "259本の経済学論文と、差の差法・イベントスタディ・操作変数・回帰不連続の100の固定乱数の合成データを組にし、テキストでの手法と方向の一致と、モデルが書いたRコードの推定値の正しさを分けて評価した（抄録）。", "p5": "7つのLLMの実行正答率は10〜88%で、実行できた426の作業のうち66（15.5%）が誤った推定値を返した。実行による順位は正答による順位とよく一致した（Kendall τ = 0.81）が、テキストの方向一致は一致しなかった。自己申告の確信度は正誤を分けなかった（抄録）。", "fun": "AIに分析のコードを書かせると、エラーなく動いても答えが間違っていることがあります。実際、動いたコードの6〜7本に1本は誤った答えを出していました。「動くか」ではなく「正しい答えが出るか」で採点し直した点が面白いところです。", "unverified": "なし"}}, {"id": "pn37", "rank": 37, "field": "因果推論", "headline": "インターネット接続が西アフリカ農村女性の時間配分を変える", "title": "Beyond time savings: internet access and the reallocation of women's non-market time in rural West Africa", "url": "https://doi.org/10.2139/ssrn.7584114", "authors": "Grakolet Arnold Z. Gourène ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Gourène, G. A. Z., INNOCENT DANIEL, G., N’da, C., & Schwidrowski, Z. (2026). Beyond time savings: internet access and the reallocation of women’s non-market time in rural West Africa. https://doi.org/10.2139/ssrn.7584114", "why": "全国家計調査で、インターネット接続が女性の家事など非市場労働の時間配分に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "西アフリカ6か国の農村で、インターネット接続が女性の非市場労働の総時間は減らさず、薪や水の運搬から子どもの宿題の手伝いへ時間を振り替えることを示した（抄録）。", "p3": "2021/22年の統一家計調査（EHCVM）で8種類の非市場作業の時間を分析し、OLS、傾向スコアマッチング、逆確率重み付き回帰調整、エントロピーバランシングで推定し、媒介分析も行った（抄録）。", "p5": "接続のある女性は薪集めと水くみの時間が短く、宿題の手伝いの時間が長かった。料理や洗濯、育児は変わらなかった。変化は非農業の起業と、より小さく正式な貯蓄を介していた（抄録）。", "fun": "ネットがつながると家事の時間が短くなるかと思いきや、合計の時間は変わらず、薪や水を運ぶ重労働が減ってその分を子どもの勉強を見る時間に回していました。技術が「時間の節約」ではなく「時間の使い道」を変えることを示した点が面白いところです。", "unverified": "時間の変化の大きさの数値は抄録になく未確認。"}}, {"id": "pn38", "rank": 38, "field": "ヒューマンコンピュータインタラクション", "headline": "HCIは自己をどう定義しAIとどう関係づけるか", "title": "AI-Mediated Self: How HCI Defines and Relates to the Self", "url": "https://arxiv.org/abs/2610.10770", "authors": "Jenny Xiyu Fu ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Fu, J. X., Yang, Q., & Jung, M. (2026). AI-Mediated Self: How HCI Defines and Relates to the Self (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10770", "why": "102本の論文から、HCI研究での自己の定義とAIとの関係の描き方を整理したスコーピングレビュー。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "HCI研究で「自己」がどう定義され、AIと自己の関係がどう捉えられ、どのような危険が論じられているかを102本の論文のスコーピングレビューで整理した（抄録）。", "p3": "教育・職場・健康・創作の分散した研究を「AIに媒介された自己」という概念でまとめ、自己の6つの捉え方と4つの倫理的リスク領域（主体性・自律、アイデンティティ・作者性、関係の力、意味づけ）を対応づけた（抄録）。", "p5": "AIと自己の近さを連続体として位置づける「Inclusion of AI-Self」の枠組みを提案した（抄録）。", "fun": "AIに日記の続きを書いてもらったり、悩みを相談したりすると、どこまでが「自分」の考えなのか分からなくなることがあります。この感覚を、100本以上の研究から地図のように整理し、AIと自分の距離を測る物差しを提案した点が面白いところです。", "unverified": "枠組みの実証的な検証の有無は抄録になく未確認。"}}, {"id": "pn39", "rank": 39, "field": "ヒューマンコンピュータインタラクション", "headline": "画像生成の時計はいつも10時10分、参照画像で解消", "title": "It's Always 10:10: Reference Images Break a Bias That Prompts Only Dent", "url": "https://arxiv.org/abs/2610.11320", "authors": "Luca Cazzaniga", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Cazzaniga, L. (2026). It's Always 10:10: Reference Images Break a Bias That Prompts Only Dent (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11320", "why": "画像生成モデルが学習データの癖を再現する偏りを時計の針で示し、プロンプトより参照画像が有効なことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "画像生成モデルが時計を10時10分に描きがちな偏りを52のモデルで測り、時刻を数字や針の言葉で指示するより参照の文字盤画像を添える方が偏りを破れることを示した（抄録）。", "p3": "3つの同じ時計に2:35、6:50、11:20を示させ、指示なし・数字・針の言葉・言葉＋参照文字盤の4条件で生成した1,799枚を、2つのAI読取り役が盲検で読み、不一致は第3の読取り役と著者が判定した（一致は96.0%と97.3%）（抄録）。", "p5": "指示なしでは67%の画像で3つとも10:10。現行20モデルで3つとも正しかったのは数字34%、言葉30%、参照画像付き75%で、参照画像は数字より37ポイント高かった（95%CI +28〜+45）。別基盤の12モデルでも同じ傾向（54%、50%、81%）だった（抄録）。", "fun": "時計の広告写真は、文字盤がきれいに見える10時10分ばかりです。それを学んだAIは、別の時刻を頼んでも10時10分を描いてしまう。言葉でいくら説明してもなかなか直らず、お手本の絵を見せると直る――AIの癖が「言葉より絵」で破れることを示した点が面白いところです。", "unverified": "なし"}}, {"id": "pn40", "rank": 40, "field": "ヒューマンコンピュータインタラクション", "headline": "学生のAI生成物の評価から批判的AIリテラシーを分解", "title": "What does it mean to use AI critically? Unpacking critical AI literacy through students' evaluation of AI-generated content", "url": "https://arxiv.org/abs/2610.10743", "authors": "Hyejeong Lee ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Lee, H., & Yu, W. (2026). What does it mean to use AI critically? Unpacking critical AI literacy through students' evaluation of AI-generated content (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10743", "why": "批判的AIリテラシーという広い概念を、学生がAI生成物を評価する具体的な行動から特定した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "学生がAI生成の内容をどう批判的に評価しているかを分析し、批判的AIリテラシーを8つの評価の観点に具体化した（抄録）。", "p3": "学生のチャットボットとのやりとりと振り返りの記述を分析し、AIを使った学業課題の7段階、AIが担う5つの役割、学生が用いた評価の観点を特定した（抄録）。", "p5": "評価の観点は正確さ、完全さ、課題との適合、個別化、実用性、創造性、倫理、偏りの8つで、批判的なAI利用は事実確認にとどまらない多次元の判断だと結論した（抄録）。", "fun": "「AIの答えは疑ってかかれ」とよく言われますが、疑うとは具体的に何をすることなのか。学生の実際のやりとりを見ると、正しいかどうかだけでなく、課題に合っているか、使えるか、偏っていないかなど8つの物差しで評価していた点が面白いところです。", "unverified": "対象学生の人数と授業の内容は抄録になく未確認。"}}, {"id": "pn41", "rank": 41, "field": "交通・都市計画", "headline": "サンティアゴの用途規制の強化・緩和と住民の富", "title": "Wealth, Homeownership, and Land use Regulatory Changes", "url": "https://doi.org/10.2139/ssrn.7586760", "authors": "Diego Gil Mc Cawley ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Gil Mc Cawley, D., Silva, H., & Asahi, K. (2026). Wealth, Homeownership, and Land use Regulatory Changes . https://doi.org/10.2139/ssrn.7586760", "why": "都市の用途規制の変更と住民の富・持家の関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "チリ・サンティアゴで土地利用規制の強化（ダウンゾーニング）と緩和が、地区の富と持家率とどう関係するかを20年分のデータと面接で調べた（抄録）。", "p3": "サンティアゴの34の都市自治体の20年分の位置情報付きの独自データと、主要な関係者19人への半構造化面接を組み合わせた（抄録）。", "p5": "高所得地区は持家率が低いと規制強化されやすく、持家率が高いと強化の確率は下がった。高所得地区以外では持家率が高いほど強化と結びついたが、大規模な用途変更に限るとこの関連は消えた。組織化された住民が参加型の制度や非公式なつながりを使っていた（抄録）。", "fun": "お金持ちの住民は「これ以上高い建物を建てるな」と規制を強めさせる、とよく言われます。ところがデータでは、持ち家の多い豊かな地区ではむしろ強化が起きにくかった。誰がどんな理由で街のルールを動かすのかが、単純な富の話ではないことを示した点が面白いところです。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn42", "rank": 42, "field": "交通・都市計画", "headline": "MaaSの組合せ選択実験に潜む内生性と共線性", "title": "he Price of Personalisation: Endogeneity, Collinearity, and the Pricing Schedulein Build-Your-Own-Bundle Mobility-as-a-Service Experiments", "url": "https://doi.org/10.2139/ssrn.7589247", "authors": "Samarth Ghoslya ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Ghoslya, S., Katzir, N., Shiftan, Y., & Nahmias-Biran, B.-h. (2026). he Price of Personalisation: Endogeneity, Collinearity, and the Pricing Schedulein Build-Your-Own-Bundle Mobility-as-a-Service Experiments. https://doi.org/10.2139/ssrn.7589247", "why": "回答者が自分で組合せを作る選好実験で生じる推定上の問題を整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "回答者が自分で組合せ（バンドル）を作る選好実験では、その選択肢に本人の好みが入り込んで推定が偏ることを示し、補正項を置く場所が決定的だと明らかにした（抄録）。", "p3": "Chamberlain–Mundlakの相関ランダム効果項を、作った選択肢の効用に入れる場合とランダム係数に入れる場合で比べ、真値の分かるモンテカルロ実験とテルアビブのMaaS実験（943人、3,772選択場面）で検証した（抄録）。", "p5": "効用に入れると偏りの約40%しか除けないが、ランダム係数に入れるとほぼ完全に除けた。MaaS実験では係数側の補正が同じパラメータ数で対数尤度を72改善し、未補正のモデルは乗り放題パスの評価額の中央値を約3分の2過大に見積もった（抄録）。", "fun": "「好きな組合せを自分で選んでください」という調査は自然ですが、選んだ組合せ自体にその人の好みがにじみ出るので、分析すると答えがゆがみます。同じ補正の道具でも、式のどこに入れるかで効き目が4割から完全にまで変わる、という発見が面白いところです。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "交通・都市計画", "headline": "中国の低空交通産業の強靭性と地域間の波及", "title": "Resilience of China’s Low-Altitude Transportation Industrial Ecosystem: Spatial Disparities and Spillover Effects", "url": "https://doi.org/10.2139/ssrn.7585317", "authors": "Yumeng Mao ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Mao, Y., Li, X., & Zhao, X. (2026). Resilience of China’s Low-Altitude Transportation Industrial Ecosystem: Spatial Disparities and Spillover Effects. https://doi.org/10.2139/ssrn.7585317", "why": "ドローン物流などの低空交通産業の強靭性の地域差と波及効果を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ドローン物流などの低空交通を支える中国の産業生態系の強靭性を省別に測り、地域差と省をまたぐ波及効果を分析した（抄録）。", "p3": "2013〜2023年の30省のパネルで、抵抗・回復・転換の指標体系をエントロピー重みで合成し、タイル分解と空間ダービンモデルで地域差と波及を調べた（抄録）。", "p5": "強靭性は0.11から0.21に上がり、タイル指数は0.500から0.194に下がったが、地域間差が不平等の56.29%を占めた。データ要素化と産業構造の合理化は正の波及、技術革新は地元に正で周辺に負、政府支援と産業集中も負の間接効果を持った（抄録）。", "fun": "空飛ぶ宅配や空のタクシーが本当に使えるかは、機体や空港だけでなく、部品工場やデータ基盤など地域の産業の厚みで決まります。ある省の技術革新が隣の省には負の影響を与える、という「取り合い」の構図も見えてくる点が面白いところです。", "unverified": "なし"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "途絶に備える在庫の事前配置という強靭化策", "title": "Inventory Prepositioning as a Resilience Strategy Under Disruption", "url": "https://doi.org/10.2139/ssrn.7585075", "authors": "Alican Yilmaz ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Yilmaz, A., Grose, C., Kosmas, D., & Ergun, O. (2026). Inventory Prepositioning as a Resilience Strategy Under Disruption. https://doi.org/10.2139/ssrn.7585075", "why": "燃料や医薬品などの重要物資の供給網で、在庫の事前配置を強靭化戦略として評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "燃料や医薬品などの重要物資の供給網で、途絶に備えて安全在庫を事前配置する戦略を、防御者-攻撃者-防御者の3層モデルで評価した（抄録）。", "p3": "防御者が在庫を配置した後に攻撃者が予算内でネットワークの容量を遮断する多段階の供給網モデルを、列・制約生成法で解き、アラスカの燃料流通網と合成ネットワークに適用した（抄録）。", "p5": "つながりと安全在庫は軽い局所的な攻撃では代替的、攻撃が強まると補完的になった。総容量が需要に近いとき、容量が均等なネットワークは、容量が少数拠点に集中したよりつながりの多いネットワークより戦略的攻撃に強いことがあった（抄録）。", "fun": "災害や妨害で道が断たれたとき、在庫を多めに置くか、道を何本も用意するか。相手が一番困るところを狙ってくると考えると、道をたくさん作るより、力を一か所に集めないことの方が効く場合がある――ゲームのような考え方で強さを測った点が面白いところです。", "unverified": "なし"}}, {"id": "pn45", "rank": 45, "field": "経営学", "headline": "ドイツの新興企業の「AIウォッシング」を監査", "title": "Auditing AI-Washing in German Startups: A Mixed-Methods Study of Marketing Claims and Perceptions", "url": "https://arxiv.org/abs/2610.11788", "authors": "A Pranav ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Pranav, A., Hartmann, L., & Lauscher, A. (2026). Auditing AI-Washing in German Startups: A Mixed-Methods Study of Marketing Claims and Perceptions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11788", "why": "新興企業がAIをどう宣伝しているかを混合研究法で調べ、誇張の実態と受け止め方を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ドイツの新興企業がAIをどう誇張して宣伝しているか（AIウォッシング）を監査し、その主張を人々がどう受け止めるかを混合研究法で調べた（抄録）。", "p3": "7次元の注釈基準を100社に適用し、63人の専門家に面接した（抄録）。", "p5": "誇張は、検証可能な証拠のない主張、方法の示されない性能値、限界を認めない主張の3形態で、主張する能力は実際のシステムとほとんど一致しなかった。誇張に触れた消費者は後のAIの宣伝を信頼しなくなり、標本の38%が中程度以上の倫理的懸念に該当した。開示義務の導入を提言した（抄録）。", "fun": "「AI搭載」と書けば投資家も客も集まる――その誘惑から、中身以上に賢そうに見せる宣伝が広がっています。誇張に一度だまされた人は、その後の本物のAIの宣伝まで信じなくなる、という「オオカミ少年」の効果を示した点が面白いところです。", "unverified": "消費者の信頼低下の大きさの数値は抄録になく未確認。"}}, {"id": "pn46", "rank": 46, "field": "経営学", "headline": "クラウドファンディング運営をデータで最適化", "title": "Learn, Predict and Reschedule: Toward a Data-Driven Crowdfunding Platform Management", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05744861", "authors": "Marouane Battach ほか", "venue": "RePEc NEP", "date": "2026-09-21", "why": "プラットフォーム運営者が予測とスケジュール調整をデータに基づいて行う手法。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された抄録を使用", "preprint": true, "short": true, "p1": "クラウドファンディングのプラットフォーム運営者向けに、機械学習で成功率に効く要因を特定し、キャンペーンの開始時期を最適化して全体の成功率を高める枠組みを提案した（抄録）。", "p3": "複数の機械学習を比べ、SHAPによる相関の分析とグレンジャー因果性検定で影響の大きく操作可能な要因を選び、予測器でプラットフォームの状態を予測し、遺伝的アルゴリズムの制御器で開始スケジュールを最適化した（抄録）。", "p5": "実データに基づく大規模シミュレータで制御器の性能を示したとある（抄録）。", "fun": "同じ時期にたくさんの企画が始まると、支援者の注目とお金を取り合ってしまいます。そこで運営者が「いつ始めるか」を調整すれば、全体として成功する企画を増やせるのでは、という市場の交通整理の発想が面白いところです。", "unverified": "成功率の改善幅の数値は抄録になく未確認。"}}, {"id": "pn47", "rank": 47, "field": "組織行動・心理的安全性", "headline": "信頼と心理的安全性が従業員の幸福を支える", "title": "Leadership and Employee Well-Being: Trust, Psychological&nbsp;Safety, and Emotional Support at Work", "url": "https://doi.org/10.2139/ssrn.7587678", "authors": "Alka Sharma ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Sharma, A., & Bhaskar, H. L. (2026). Leadership and Employee Well-Being: Trust, Psychological&nbsp;Safety, and Emotional Support at Work. https://doi.org/10.2139/ssrn.7587678", "why": "インドの多業種の従業員への面接から、リーダーとの関係における信頼・心理的安全性・情緒的支援の経験を整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドの多業種の従業員30人への面接から、リーダーとの関係で経験する信頼・心理的安全性・情緒的支援が、職場の受け止め方とwell-beingをどう形づくるかを探索した（抄録）。", "p3": "教育・医療・製造・IT・サービスの従業員30人に半構造化面接を行い、主題分析で繰り返し現れる型と意味を特定した（抄録）。", "p5": "信頼できるリーダーは近づきやすく、敬意があり、透明で、話を聞く人と語られ、失敗への寛容さが心理的安全性の重要な目印だった。過度の業績監視や失敗を責める対応は、不安、沈黙、助けを求めない態度、離脱と結びついていた（抄録）。", "fun": "成果の数字ばかりを追う職場では、人が上司を信頼できるか、安心して意見を言えるかが見落とされがちです。失敗したときに上司が責めるか、一緒に学ぼうとするか――その一瞬の反応が職場の安心感を決めていることを、働く人の言葉から拾い上げた点が面白いところです。", "unverified": "質的研究で標本は30人であり、一般化の範囲は未確認。"}}, {"id": "pn48", "rank": 48, "field": "組織行動・心理的安全性", "headline": "総報酬モデルで98研究の動機づけ要因を整理", "title": "What Really Drives Employee Motivation, Engagement, Retention, and Organizational Performance? Evidence of Total Rewards Application from 98 Studies", "url": "https://doi.org/10.2139/ssrn.7576378", "authors": "Sigit Hadiawan ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Hadiawan, S., & Nikmah, U. (2026). What Really Drives Employee Motivation, Engagement, Retention, and Organizational Performance? Evidence of Total Rewards Application from 98 Studies. https://doi.org/10.2139/ssrn.7576378", "why": "報酬の全体像のモデルに沿って、従業員の動機づけ・定着・組織成果の決定要因を98の研究から整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "WorldatWorkの総報酬モデルに沿って、従業員の経験と組織の成果の決定要因を2022〜2026年の98本の研究から整理したスコーピングレビューである（抄録）。", "p3": "PRISMA-ScRに沿って業種横断の研究98本を分析し、523の決定要因を報酬・福利厚生・well-being・キャリア・承認の5次元と組織内外の影響に分類した（抄録）。", "p5": "総報酬は従業員経験の決定要因の71.7%、組織成果の50.7%を占めた。従業員経験ではwell-beingとキャリアの機会、組織成果では給与の関連が最も強かった。成果を調べた研究は13%にとどまった（抄録）。", "fun": "人がやる気を出し会社に残るのは給料のためか、成長や承認のためか。100本近い研究を並べると、働く人の満足には成長の機会が、会社の業績には給料が効いていた――目的によって効く報酬が違う、という整理が面白いところです。", "unverified": "なし"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "課題解決型授業のチーム人数と協働負荷", "title": "Team Size in Challenge-Based Management Education: Collaborative Workload, Student Experience, and Project Performance", "url": "https://doi.org/10.2139/ssrn.7585187", "authors": "Fei-Hui Huang", "venue": "SSRN", "date": "2026-10-08", "apa": "Huang, F.-H. (2026). Team Size in Challenge-Based Management Education: Collaborative Workload, Student Experience, and Project Performance. https://doi.org/10.2139/ssrn.7585187", "why": "授業での実証から、チームの人数が協働の負荷と学生の経験、成果に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "課題解決型の経営教育の授業で、チームの人数（2人か3人か）が協働の負荷、学生の経験、成果物の評価に与える影響を調べた（抄録）。", "p3": "NASA-TLXの負荷尺度、授業評価、満足度、最終成績、振り返りを組み合わせ、個人段階と協働段階を対応のあるt検定で、自然にできた2人・3人チームをマン・ホイットニーU検定で比べた（抄録）。", "p5": "協働段階は学習行動や満足度が高い一方、欲求不満と全体の負荷も高かった。2人チームは主観的な授業評価が良く、3人チームは最終成績が高かった。NASA-TLXは人数で差がなく、振り返りでは3〜4人が分担と多様な視点に向くとされた（抄録）。", "fun": "グループ課題は2人と3人のどちらがよいか。2人の方が楽しく感じる一方で、3人の方が成果物の点数は高かった――満足と成果が別の方向を向くという、多くの人が経験したことのある感覚を授業データで確かめた点が面白いところです。", "unverified": "受講者数は抄録になく未確認。チームは無作為ではなく自然に形成された。"}}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "生成AIの採用がプロダクトマネージャーの成果を左右", "title": "The Impact of Gen AI Tool Adoption on Product Manager Effectiveness for&nbsp;Early-Stage SaaS Products in India: The Moderating Effect of Product&nbsp;Manager Experience and Team Size", "url": "https://doi.org/10.2139/ssrn.7573721", "authors": "Sunil Kumar Mishra", "venue": "SSRN", "date": "2026-10-09", "apa": "Mishra, S. K. (2026). The Impact of Gen AI Tool Adoption on Product Manager Effectiveness for&nbsp;Early-Stage SaaS Products in India: The Moderating Effect of Product&nbsp;Manager Experience and Team Size. https://doi.org/10.2139/ssrn.7573721", "why": "インドの新興SaaS企業で、生成AIの採用とPMの成果の関係を経験とチーム規模の調整効果とともに調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドの新興SaaS企業のプロダクトマネージャー（PM）93人の調査で、生成AIの採用はPMの成果を高めず、AIの出力を解釈・評価・統合する「AIで拡張された判断力」が成果を予測したと報告した（抄録）。", "p3": "成果を製品の探索・開発・市場投入の3段階に分け、横断調査データをPLS-SEMとブートストラップで分析した（抄録）。", "p5": "21の仮説はすべて棄却された。新たに見出した「AIで拡張された判断力」は6つの成果のうち5つを予測し、開発段階のサイクル時間と品質で効果が最大だった（抄録）。", "fun": "「生成AIを使えば成果が上がるはず」という21の仮説は一つも支持されませんでした。差をつけたのはAIを使うかどうかではなく、AIの答えをどう読み、どう判断に生かすか――道具がみんなに行き渡ると、差は使い手の判断力に移る、という結論が面白いところです。", "unverified": "標本が93人と小さく、新しい構成概念は事後的に見出されたもの。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "路面等級を先に分類し車両応答から凹凸推定", "title": "Road roughness estimation based on road-grade pre-classification", "url": "https://doi.org/10.1088/1742-6596/3325/1/012012", "authors": "Kuifeng Wang tics誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "熟議の質の評価を、発話の形式から熟議の目的に対する機能へと移す「問題志向」の視点を提案し、ヒューリスティクス（認知的近道）を熟議の補完として位置づけた理論論文である（抄録）。", "p3": "熟議システム論に立ち、ヒューリスティクスが熟議システムの認識的・倫理的・民主的な機能に対して持つ危険と可能性を検討した（抄録）。", "p5": "ヒューリスティクスは熟議の代替ではなく補完になりうるとし、それらを評価する基準と、機能する条件を特定する研究課題を提案した（抄録）。", "fun": "よく考えて話し合うことが民主主義の理想ですが、人はいつも時間をかけて考えられるわけではありません。「信頼できる人の意見に従う」といった近道を、熟議の敵ではなく味方として使えないか――理想と現実の間を埋めようとする発想が面白いところです。", "unverified": "理論論文で、実証データは用いていない（抄録から）。"}}, {"id": "jr17", "rank": 17, "headline": "英国の創作者に生成AIが新たな仕事を課す", "title": "Self-programmable creative labour: Generative AI and the reorganisation of work in the UK creative industries", "url": "https://doi.org/10.1177/01634437261494891", "authors": "Jie Huang", "venue": "Media, Culture and Society", "date": "2026-10-09", "sjr": 1.957, "citescore": 7.2, "citescore_year": "2025", "apa": "Huang, J. (2026). Self-programmable creative labour: Generative AI and the reorganisation of work in the UK creative industries. Media, Culture & Society. https://doi.org/10.1177/01634437261494891", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Media, Culture and Society誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "英国の映画・ゲーム・舞台の実務者21人への面接から、生成AIが創作労働を「常に自分を再プログラムし続ける労働」へと再編していることを論じた（抄録）。", "p3": "カステルの「自己プログラム可能な労働」の概念に基づき、AIを使う実務者21人への面接で、日常の仕事への生成AIの取り込み方を分析した（抄録）。", "p5": "生成AIは再訓練と技能の更新を絶えず求める働き方を常態化させるが、要求は不均等で見返りは不確かであり、作れるものは増えても交渉力や雇用の安定、評価は必ずしも増えない。自己プログラム性は優位の手段より生き残りの条件になりつつあるとした（抄録）。", "fun": "AIは仕事を楽にする道具と思われがちですが、創作の現場では「新しいAIを覚え続けなければならない」という新しい負担にもなっていました。学び続けることが出世の武器ではなく、取り残されないための最低条件になる、という指摘が面白いところです。", "unverified": "面接対象の内訳は抄録になく未確認。"}}, {"id": "jr18", "rank": 18, "headline": "技術変化と研修の不一致が職務満足を下げる", "title": "Human adaptation to workplace technological change: Digital skill-development needs, training alignment, and job satisfaction in Europe", "url": "https://doi.org/10.14254/1795-6889.2026.22-2.12", "authors": "Serhiy Kozmenko ほか", "venue": "Human Technology", "date": "2026-10-09", "citescore": 5.8, "citescore_year": "2025", "apa": "Kozmenko, S., Shenggeng, D., Maňák, R., & Oláh, J. (2026). Human adaptation to workplace technological change: Digital skill-development needs, training alignment, and job satisfaction in Europe. Human Technology, 22(2), 469–506. https://doi.org/10.14254/1795-6889.2026.22-2.12", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Human Technology誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "欧州の労働者で、デジタル技能の習得の必要が大きいのに研修を受けていない人ほど職務満足が低く、技術に合わせた研修ほど満足が高いことを示した（抄録）。", "p3": "2021年のCedefop欧州技能・仕事調査の匿名化ミクロデータで、調査重み付きOLSに個人・雇用の統制、国・職業・産業の固定効果、国でクラスター化した標準誤差、ワイルド・クラスター・ブートストラップを用いた（抄録）。", "p5": "必要があり研修がない人は職務満足が0.341ポイント低く、同程度の必要がある人では研修参加が0.382ポイント高い満足と関連した。技術向けの研修と一般研修の差は、必要なしで−0.247、中程度で+0.176、大きいと+0.387だった（抄録）。", "fun": "新しいデジタル技術が職場に入ると学び直しが必要になります。その必要があるのに研修がないと満足度が下がり、しかも研修は「技術に合わせた中身」であるほど効く――学び直しの必要が大きい人ほど、研修の中身の合い方が効いてくる点が面白いところです。", "unverified": "横断データのため因果関係は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "住民の構成がスペインの宅地供給を左右した", "title": "Renters, mortgagors and landowners. Social composition and the political economy of urban land supply in Spain", "url": "https://doi.org/10.1177/00420980261489134", "authors": "José María Tubío-Sánchez ほか", "venue": "Urban Studies", "date": "2026-10-09", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Tubío-Sánchez, J. M., Lago-Peñas, S., & Sanchez-Fernandez, P. (2026). Renters, mortgagors and landowners. Social composition and the political economy of urban land supply in Spain. Urban Studies. https://doi.org/10.1177/00420980261489134", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Urban Studies誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "スペインの住宅バブル期（1999〜2007年）に、住民の構成（借家人、住宅ローンの借り手、土地所有者）が自治体の宅地供給と選挙結果を左右したことを示した（抄録）。", "p3": "ホームボーター仮説と成長マシン仮説に基づき、バブル期の自治体データで住民構成と宅地供給の拡大、現職政党の得票の関係を分析した（抄録）。", "p5": "ローン付き住宅の割合は宅地供給の拡大と負に、土地所有者の割合は正に関連した。ローン付き住宅が10%増えると現職政党の得票率は0.76ポイント下がり、土地所有者が10%増えると0.12ポイント上がった（抄録）。", "fun": "家をローンで買った人は、近くに新しい家が次々建って家の値段が下がるのを嫌い、土地を持つ人は開発で儲かります。誰が住んでいるかで街が広がるかどうかも、選挙で誰が勝つかも変わる――住民の財布の事情が都市計画と政治を動かすことを示した点が面白いところです。", "unverified": "分析した自治体の数は抄録になく未確認。"}}, {"id": "jr20", "rank": 20, "headline": "産業遺産指定がソウル聖水洞の賃料に与えた影響", "title": "Naming an industry as heritage: Industrial retention and commercial rents in Seongsu, South Korea", "url": "https://doi.org/10.1177/00420980261487308", "authors": "Minju Kim ほか", "venue": "Urban Studies", "date": "2026-10-09", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Kim, M., Lee, J.-E., Lee, S., Lee, K.-B., & Park, Y. (2026). Naming an industry as heritage: Industrial retention and commercial rents in Seongsu, South Korea. Urban Studies. https://doi.org/10.1177/00420980261487308", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Urban Studies誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "ソウル聖水洞の都市再生事業が地元の皮革・製靴産業を「遺産」として保存すると定めた後、商業賃料が上がったが、同産業は参入と事業所数を伸ばしたことを示した（抄録）。", "p3": "2014〜2019年の商業賃料を差の差モデルで分析し、事業所の参入と数の補足分析を加えた（抄録）。", "p5": "全業種で賃料に有意な正の効果があり、皮革・製靴業で最も大きかったが、同業は対象地域で参入率が高く事業所数も純増した。その賃料は視認性や地価の勾配に従わず、生産を軸にした活動が続いていたことを示す。ただし保存が立ち退きの一形態となる可能性も残るとした（抄録）。", "fun": "町工場を「守るべき遺産」と名付けると、守られるはずの工場の家賃まで上がります。それでも工場は減らずに増えていた――保存政策は効いたのか、それとも形を変えた追い出しなのか。都市再生のジレンマを数字で見つめた点が面白いところです。", "unverified": "賃料の上昇幅の数値は抄録になく未確認。"}}, {"id": "jr21", "rank": 21, "headline": "LEMとDEMで大規模残土盛土の崩壊前後を評価", "title": "Evaluating pre- and post-failure behavior of a large waste dump by combining LEM and DEM approach: a case study from a hydropower station, China", "url": "https://doi.org/10.3389/feart.2026.1957046", "authors": "Jingyu Wang ほか", "venue": "Frontiers in Earth Science", "date": "2026-10-08", "citescore": 4.9, "citescore_year": "2025", "apa": "Wang, J., Zhong, W., Chen, P., Si, D., Chen, X., Putra, R. R., Yang, B., & Qi, S. (2026). Evaluating pre- and post-failure behavior of a large waste dump by combining LEM and DEM approach: a case study from a hydropower station, China. Frontiers in Earth Science, 14. https://doi.org/10.3389/feart.2026.1957046", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Frontiers in Earth Science誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の揚水発電所の大規模な残土盛土について、崩壊前を3次元極限平衡法（LEM）、崩壊後を個別要素法（DEM）で解析し、両者をつないで評価した（抄録）。", "p3": "独自の厳密な3次元LEMで崩壊前の安定性を、較正したDEMで崩壊後の流動と堆積を解析し、両者を定性的に比較した（抄録）。", "p5": "蛇行地形が安定性を高めることを3次元解析で示した。DEMでは粒子間摩擦係数μが流下経路と堆積を支配し、比較からμ = 0.2を代表値として支持した。この場合の崩壊は近くの斜面にとどまり、LEMのわずかな安定余裕と対応した。排水不良などの極端条件では危険が残るとした（抄録）。", "fun": "崩れる前の「どこまで耐えるか」と、崩れた後の「どこまで流れるか」は、ふつう別々の計算法で扱われます。その2つを一つの現場でつなぎ、砂粒どうしの滑りやすさ一つで流れ方が大きく変わることを示した点が面白いところです。", "unverified": "安全率の数値は抄録になく未確認。"}}, {"id": "jr22", "rank": 22, "headline": "平板載荷試験とDEMで玄武岩岩盤の変形を解析", "title": "Cross-Scale Analysis of Basalt Rock-Mass Deformation and Energy Evolution Based on In Situ Bearing Plate Tests and DEM Simulation", "url": "https://doi.org/10.3390/buildings16203991", "authors": "Xuewei Guan ほか", "venue": "Buildings", "date": "2026-10-09", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Guan, X., & Wu, S. (2026). Cross-Scale Analysis of Basalt Rock-Mass Deformation and Energy Evolution Based on In Situ Bearing Plate Tests and DEM Simulation. Buildings, 16(20), 3991. https://doi.org/10.3390/buildings16203991", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Buildings誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "水力発電所の玄武岩岩盤で6回の原位置の剛体平板載荷試験と2次元DEM（PFC2D）を組み合わせ、変形とエネルギーの推移を調べた（抄録）。", "p3": "最大10.203 MPaの5段階の載荷・除荷を行い、逆解析で較正した3つのDEMモデルで現場の経路を再現し、乱数の種・粒径・領域の大きさを変えた計算も行った（抄録）。", "p5": "平均の変形/弾性係数は弱風化で15.402/22.236 GPa、微風化で18.082/30.205 GPa。DEMは変位の二乗平均誤差0.090、0.058、0.184 mmで再現した。接触ひずみエネルギーは安定だが、ピーク変位やすべりエネルギーは実現値や境界に依存し、計算は一意の再構成ではなく妥当な機構の解釈だとした（抄録）。", "fun": "コンピュータの中の粒の集まりで岩盤を再現するとき、乱数の選び方や計算領域の広さで答えが変わってしまうことがあります。どの量は信頼でき、どの量は設定に左右されるのかを、現場試験と照らして正直に見分けた点が面白いところです。", "unverified": "2次元・単位厚さのモデルであり、3次元での妥当性は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "犬と暮らす高齢者は孤独感が低い", "title": "Dog Companionship and Loneliness in Community‐Dwelling Older Adults: A Multicentre, Cross‐Sectional Study", "url": "https://doi.org/10.1002/gps.70216", "authors": "Lauriane Segaux ほか", "venue": "HAL (ART) International Journal of Geriatric Psychiatry", "date": "2026-10-08", "citescore": 5.9, "citescore_year": "2025", "apa": "Segaux, L., Poitrine, E., Nicodème, M., Herr, C., Vaillant‐Ciszewicz, A.-J., Hurtaud, A., Bombenger, N., Boiteux‐Chabrier, M., Michel, E., Maurice, C., Gilbert, C., Canoui‐Poitrine, F., & Fromantin, I. (2026). Dog Companionship and Loneliness in Community‐Dwelling Older Adults: A Multicentre, Cross‐Sectional Study. International Journal of Geriatric Psychiatry, 41(5). https://doi.org/10.1002/gps.70216", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用", "preprint": false, "short": true, "p1": "フランスの75歳以上の在宅高齢者で、犬を飼う人は孤独感、とくに情緒的孤独が低いことを多施設の横断研究で示した（抄録）。", "p3": "2020年9月〜2023年4月に7施設で160人（うち飼い主47人）を対象に、11項目のDe Jong Gierveld孤独尺度と社会ネットワーク指標を用い、社会人口・環境・臨床特性で調整した多変量線形回帰で分析した（抄録）。", "p5": "孤独得点の中央値に有意差はなかったが、調整モデルでは犬の飼育が独立に低い孤独感と関連し、主に情緒的孤独で差があった。独居、フレイル、抑うつ、睡眠の問題は孤独感の高さと関連した。転倒やかみつきなどの有害事象は5%だった（抄録）。", "fun": "犬を飼う高齢者は、単純に比べると孤独感に差がありませんでした。ところが一人暮らしや体の弱さなどをそろえて比べると、飼い主の方が「心の寂しさ」が少なかった――比べ方で見える景色が変わる、統計の面白さがよく分かる例です。", "unverified": "横断研究のため因果関係は未確認（著者も縦断研究が必要と認めている）。"}}, {"id": "jr24", "rank": 24, "headline": "移民の抑うつの不利は高齢期に拡大する", "title": "Immigrants’ Increasing Depression Disadvantage in Older Ages: Patterns and Mechanisms", "url": "https://doi.org/10.1177/00221465261491302", "authors": "Hui Zheng ほか", "venue": "Journal of Health and Social Behavior", "date": "2026-10-09", "sjr": 1.867, "citescore": 7.9, "citescore_year": "2025", "apa": "Zheng, H., & Yu, W.-h. (2026). Immigrants’ Increasing Depression Disadvantage in Older Ages: Patterns and Mechanisms. Journal of Health and Social Behavior. https://doi.org/10.1177/00221465261491302", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Health and Social Behavior誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の移民は50代では本国生まれより抑うつが少ないが、その優位は年齢とともに縮み、60代半ばで逆転することを28年の縦断データで示した（抄録）。", "p3": "健康と退職調査（HRS、1992〜2020年）で、移民と本国生まれの抑うつの年齢による推移を比べ、移住前と移住後の要因の寄与を分析した（抄録）。", "p5": "子ども期の環境はほとんど関係せず、失業と経済的不安、差別、社会的支援の減少、近隣からの疎外が、移民の抑うつのより急な増加の約80%を説明した（抄録）。", "fun": "移民は健康な人が多いと言われますが、年を取るにつれてその強みは消え、むしろ不利に転じていました。原因は生まれ育ちではなく、移住先での仕事や差別、孤立――社会のつながりが心の健康を長い時間をかけて左右することを示した点が面白いところです。", "unverified": "抑うつの差の大きさの数値は抄録になく未確認。"}}, {"id": "jr25", "rank": 25, "headline": "LLMでコーパスに大規模注釈を付ける手順", "title": "A large-scale pipeline for LLM-assisted corpus annotation", "url": "https://doi.org/10.1075/ijcl.25162.mor", "authors": "Cameron Morin ほか", "venue": "International Journal of Corpus Linguistics", "date": "2026-10-09", "sjr": 0.946, "citescore": 4.7, "citescore_year": "2025", "apa": "Morin, C., & Larsson, M. M. (2026). A large-scale pipeline for LLM-assisted corpus annotation. International Journal of Corpus Linguistics. https://doi.org/10.1075/ijcl.25162.mor", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "International Journal of Corpus Linguistics誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "LLMで文法的な注釈を自動化するパイプラインを作り、14万件超の用例に高い精度で注釈を付けられることを示した（抄録）。", "p3": "英語の評価構文consider（consider X as / to be / Ø Y）の通時的な変異を事例に、COHAの143,933件の用例をOpenAI APIで注釈した（抄録）。", "p5": "60時間未満で注釈し、2つの複雑な注釈手順で98%以上の精度を得た。分析から、これまで知られていなかったジャンル別の変化の軌跡が見つかった（抄録）。", "fun": "言葉の使われ方の歴史を調べるには、何万もの例文に人が一つずつ印を付ける必要がありました。それをAIに任せると、14万件以上をわずか数日で、しかも人並みの正確さでこなせた――言語学の調べ方そのものを変えうる点が面白いところです。", "unverified": "使用したモデル名と費用は抄録になく未確認。"}}, {"id": "jr26", "rank": 26, "headline": "監査委員の人脈が監査意見に影響する", "title": "Audit committee social networks and audit opinion: a European analysis", "url": "https://doi.org/10.1108/sar-05-2026-0057", "authors": "Ruth García-Cobo ほか", "venue": "Revista de Contabilidad – Spanish Accounting Review", "date": "2026-10-09", "citescore": 3.2, "citescore_year": "2025", "apa": "García-Cobo, R., Zarza Herranz, C., & Lopez-Iturriaga, F. J. (2026). Audit committee social networks and audit opinion: a European analysis. Revista de Contabilidad – Spanish Accounting Review, 1–35. https://doi.org/10.1108/sar-05-2026-0057", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Revista de Contabilidad – Spanish Accounting Review誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "欧州8か国の上場企業で、監査委員の組織間ネットワーク上の中心性が高いほど無限定適正意見が出やすく、限定の程度も軽いことを示した（抄録）。", "p3": "2005〜2020年の非金融上場230社の監査委員6,899人について次数・固有ベクトル・媒介・近接中心性を計算して企業年で集計し、ロジット、プロビット、順序ロジット・プロビットで監査意見との関連を推定した（抄録）。", "p5": "中心性が高いほど無限定適正意見の確率が高く、限定は軽かった。次数・固有ベクトル中心性と合成指標で明確で、負債の少ない企業で強かった。モデルの変更、プラセボ検定、ラグ付き指標でも頑健だった（抄録）。", "fun": "取締役がほかの会社とどれだけつながっているかは、外からは見えにくい「統治の質」の目印になります。人脈の広い監査委員がいる会社ほど監査で問題を指摘されにくい――ネットワークの位置が監査人への信頼のシグナルとして働くことを示した点が面白いところです。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "jr27", "rank": 27, "headline": "銀行のデジタル化がESG開示を増やす", "title": "Digitalization and Environmental, Social, and Governance Reporting: Evidence from the US Banking Industry", "url": "https://doi.org/10.1002/bse.71622", "authors": "Sebastian J. Schmid ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-09", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Schmid, S. J., & Flagmeier, V. (2026). Digitalization and Environmental, Social, and Governance Reporting: Evidence from the US Banking Industry. Business Strategy and the Environment. https://doi.org/10.1002/bse.71622", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environment誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の上場銀行（2010〜2022年）で、デジタル化が進むほどESG報告書を開示しやすく、その範囲と質も高いことを示した（抄録）。", "p3": "自発的開示とシグナリング理論に基づく2段階の枠組みで、デジタル化が内部情報の質を高め、それがESG報告に伝わるかを分析し、差の差法と媒介分析で裏づけた（抄録）。", "p5": "デジタル化はESG報告の開示確率、範囲、質の高さと関連した。データのプライバシー・安全性の開示が少ない銀行では関連が弱かった（抄録）。", "fun": "社内のデータがきちんと集まるようになると、外に向けた報告もしやすくなる――当たり前に思えるこの流れを、銀行のデジタル化とESG報告の関係で確かめました。データの安全管理が弱い銀行では効果が薄れる、という条件付きの発見も面白いところです。", "unverified": "デジタル化の測定方法と効果の大きさは抄録になく未確認。"}}, {"id": "jr28", "rank": 28, "headline": "福祉不正のリスク採点を職員はどう使うか", "title": "Algorithmic welfare. Disaggregating semi-automated fraud detection by spotlighting human judgment in organizational practices", "url": "https://doi.org/10.1515/commun-2025-0111", "authors": "Astrid Mager ほか", "venue": "Communications", "date": "2026-10-09", "sjr": 0.884, "citescore": 4.1, "citescore_year": "2025", "apa": "Mager, A., & Allhutter, D. (2026). Algorithmic welfare. Disaggregating semi-automated fraud detection by spotlighting human judgment in organizational practices. Communications, 51(3), 588–608. https://doi.org/10.1515/commun-2025-0111", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Communications誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "オーストリアの公的社会保険機関で、不法就労などの不正を検知するリスク採点アルゴリズムが、職員の役割・日常業務・責任をどう変えたかを事例研究で調べた（抄録）。", "p3": "複数の地方事務所の職員への10件の質的面接、短期の民族誌的観察、2日間の「マインド・スクリプティング」ワークショップを、ストリートレベル官僚制研究と批判的データ研究の視点で分析した（抄録）。", "p5": "不正検知ソフトは新しい職業的アイデンティティを生み、証拠集めの知識実践を変え、データサイエンスと人の判断の間で責任を再配分していた。福祉国家のケアから統制への移行の一部だと論じた（抄録）。", "fun": "AIが「怪しい」と点数をつけても、最後に判断するのは窓口の職員です。アルゴリズムは職員の仕事を置き換えるのではなく、誰が責任を負うのか、何を証拠とするのかまで作り替えていた――人と機械の共同作業の実態を現場から描いた点が面白いところです。", "unverified": "面接10件の質的研究で、一般化の範囲は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "地震動と被害をガウス化し地域リスクを高速評価", "title": "Scalable Scenario‐Based Regional Earthquake Risk Assessment via Gaussianized Ground‐Motion‐Damage Modeling and PPCA", "url": "https://doi.org/10.1002/eqe.70305", "authors": "Soung Eil Houng ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-09", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Houng, S. E., & Ceferino, L. (2026). Scalable Scenario‐Based Regional Earthquake Risk Assessment via Gaussianized Ground‐Motion‐Damage Modeling and PPCA. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70305", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Earthquake Engineering and Structural Dynamics誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "シナリオ地震の地域リスク評価で、地震動の模擬と建物被害のサンプリングの2段階を、厳密な変数変換で1つのガウス標本化問題にまとめ、確率的主成分分析（PPCA）で低次元化した（抄録）。", "p3": "建物数に応じて次元が増える従来の手順を、変数変換でガウス標本化に書き換え、標本化を効率化する低次元の潜在変数をPPCAで特定した（抄録）。", "p5": "サンフランシスコ中心部の1,000棟でSimCenter R2Dと比べ、95%の建物で最頻の被害状態が一致し、平均差は0〜4の尺度で0.04未満だった。中心部15,836棟では潜在1次元、湾岸地域では20次元で損失分布を再現し、次元削減の程度は建物密度より範囲の広さで決まった（抄録）。", "fun": "大都市の地震被害を予測するには、何千もの建物ごとに揺れと壊れ方を何度もシミュレーションする必要があります。1万5千棟の被害でも、背後にある「たった1つの共通の要因」でほぼ説明できた――データ圧縮の発想で計算を大きく縮めた点が面白いところです。", "unverified": "計算時間の短縮倍率は抄録の記号が欠落しており未確認。"}}, {"id": "jr30", "rank": 30, "headline": "時変遅れのある構造振動制御を適応同定で実装", "title": "Adaptive Smith predictor-based structural vibration control with time-varying delay: Adaptive model identification and hardware implementation", "url": "https://doi.org/10.1177/1045389x261491852", "authors": "Juan Zhai ほか", "venue": "Journal of Intelligent Material Systems and Structures", "date": "2026-10-09", "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Intelligent Material Systems and Structures誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "構造振動の制御で、センサ・アクチュエータ・計算・通信による時変の遅れに対処する適応スミス予測器と、実時間のモデル同定を統合した制御法を作り、実験で検証した（抄録）。", "p3": "拡張状態観測器付きスライディングモード制御のスミス予測器を時変遅れに適応させ、リアプノフ関数に基づく適応則で公称モデルのパラメータを実時間で同定・修正し、予測器に組み込んだ（抄録）。", "p5": "NI PCIe-6343とMATLAB/Simulinkの実験台で、従来の2手法（SMCESO、PSMCESO）と比べて制振性能が向上したと報告している（抄録）。", "fun": "揺れを打ち消す制御は、測ってから動くまでのわずかな遅れで逆に揺れを大きくしてしまうことがあります。遅れの長さが変わっても、建物の性質を動きながら学び直して先回りする――「測りながら同定し、同定しながら制御する」仕組みが面白いところです。", "unverified": "制振性能の改善の数値は抄録になく未確認。"}}, {"id": "jr31", "rank": 31, "headline": "リガTV塔の風による疲労寿命を時間領域で評価", "title": "An Efficient Fatigue Life Estimation Procedure for Historical Steel Towers: A Case Study of the Riga TV Tower", "url": "https://doi.org/10.3390/buildings16193973", "authors": "Janis Sliseris ほか", "venue": "Buildings", "date": "2026-10-09", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Buildings誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "現代の疲労規定より前に建てられた高さ368.5 mのリガTV塔について、風による疲労損傷を時間領域で推定する手順を示し、計測で裏づけた（抄録）。", "p3": "EN 1991-1-4とKaimalの乱流スペクトルで風荷重の時刻歴を合成し、渦励振を簡略なロックインモデルで表して、全体と詳細の有限要素モデルに与え、レインフロー計数とPalmgren–Miner則、EN 1993-1-9のS–N曲線で損傷を評価した（抄録）。", "p5": "固有振動数はジオフォンと光ファイバの計測値と一致し、曲げ応力範囲は平均風速2〜14 m/sで計測の傾向に従った。評価した溶接部の損傷度は50年でD = 0.081、供用37年でD = 0.060で、7〜9 m/sの2次モードのロックインが支配的だった（抄録）。", "fun": "古い高い塔は、今の基準ができる前の材料と設計で建っています。人工の風を吹かせたコンピュータモデルで疲れ具合を数えると、強風よりも秒速7〜9 mほどの中くらいの風で起きる共振が一番効いていた――「ほどほどの風が一番こわい」という意外さが面白いところです。", "unverified": "空力減衰を無視したロックインの簡略化、仮定した減衰と溶接区分の影響は著者も限界として挙げている。"}}, {"id": "jr32", "rank": 32, "headline": "観測に基づくラグランジュ追跡で海ごみの漂着予測", "title": "Marine litter in the Mediterranean: observation-based Lagrangian particle tracking", "url": "https://doi.org/10.3389/fmars.2026.1936698", "authors": "Santiago Bravo ほか", "venue": "Frontiers in Marine Science", "date": "2026-10-09", "sjr": 0.959, "citescore": 6.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Frontiers in Marine Science誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "地中海の浮遊する海ごみについて、フェリーからの観測を初期条件にした確率的ラグランジュ粒子追跡で、海面での出現頻度と海岸への漂着頻度を地図化した（抄録）。", "p3": "2023年8月〜2024年12月の158回の観測（4,801個、約6,200 km²）を5 km格子の月別個数にし、Parcelsで再解析海流とERA5の風（風圧係数1%）、ランダムウォーク拡散のもと、各月18メンバー・観測1個あたり5,000粒子のアンサンブル計算を行った（抄録）。", "p5": "ティレニア海南部とリグリア海北部は2024年にほぼ常に出現頻度が高く、晩夏〜秋に最大だった。漂着頻度はコルシカ、サルデーニャ西部、チュニジア北部で最も高かった。62%超が人工高分子だった（抄録）。", "fun": "海に浮かぶごみがどこへ流れ着くかを、ごみの「出どころ」からではなく、実際に船から数えた「今どこにあるか」から計算しました。1個のごみを5,000個の仮想の粒に分けて流し、たどり着く先の確率を地図にする発想が面白いところです。", "unverified": "独立の海岸ごみ調査による検証は今後の課題とされている。"}}, {"id": "jr33", "rank": 33, "headline": "電池製造の粒子モデルのパラメータ最適化を高速化", "title": "Accelerated Parameter Optimization of Granular Models of Battery Manufacturing", "url": "https://doi.org/10.1002/batt.70490", "authors": "Sourab Barath Vijayaraghavan ほか", "venue": "Batteries & Supercaps", "date": "2026-10-01", "citescore": 6.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "電池製造のメソスケール粒子シミュレーションのパラメータを、実験と合うよう自動で探す非同期の粒子群最適化（APSO）の枠組みを作った（抄録）。", "p3": "従来の逐次型PSOは各反復で全シミュレーションの終了を待つため計算資源を無駄にする。各計算が終わりしだい次の評価に進む非同期版を実装し、設定の違いが収束に与える影響を調べ、2つの個別要素法（DEM）シミュレーションの最適パラメータを探索した（抄録）。", "p5": "自動探索で得たデータから、選んだ探索空間内でのモデルの振る舞いを分析したとある。具体的な数値は抄録にない（抄録）。", "fun": "粒の集まりの計算は、パラメータの組合せによって終わる時間がばらばらです。全員がそろうまで待つ「一斉スタート」をやめ、終わった人から次の課題に進む方式にして、待ち時間の無駄を省いた点が面白いところです。", "unverified": "計算時間の短縮率や収束の数値は抄録になく未確認。"}}, {"id": "jr34", "rank": 34, "headline": "子ども期の脅威体験が中高年の孤独に及ぶ経路", "title": "Threat-related adverse childhood experiences and loneliness among middle-aged and older adults in China: indirect associations involving social activity participation breadth and functional limitations", "url": "https://doi.org/10.3389/fpubh.2026.1884393", "authors": "Tingke Xu ほか", "venue": "Frontiers in Public Health", "date": "2026-10-08", "citescore": 6.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の中高年で、子ども期の脅威に関わる逆境体験（ACE）の多さが後年の孤独感の高さと関連し、その間接的な関連は主に身体機能の制限を介することを示した（抄録）。", "p3": "CHARLSの2014年と2020年のデータで、身体的虐待・家庭内の物質乱用・家庭内暴力・危険な近隣・いじめの5項目のACE得点（0〜5）と、社会活動の幅、日常生活動作の制限、孤独感の関係を、回帰による直列間接関連モデルと10,000回のブートストラップで推定した（抄録）。", "p5": "ACE得点が高いほど孤独感が高く、最大の間接関連は機能制限を通るものだった。社会活動の幅を通る経路は有意だが小さかった。媒介変数と孤独感は同時に測られており、時間的・因果的な媒介は示せないと明記している（抄録）。", "fun": "子どものころのつらい体験が、何十年も後の孤独感と結びついていました。その間をつないでいたのは、人づきあいの少なさよりも、体が思うように動かないことだった――孤独を心の問題だけでなく体の問題としても見る必要を示した点が面白いところです。", "unverified": "ACEは回顧報告であり、因果関係は著者自身が否定的に扱っている。"}}, {"id": "jr35", "rank": 35, "headline": "環境配慮の表示がかえって消費を増やす", "title": "The Sustainability Claim Paradox: When Green Marketing Encourages Greater Consumption", "url": "https://doi.org/10.1002/bse.71621", "authors": "Ruta Birutyte ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-09", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environment誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "環境配慮をうたう広告の主張が強いほど、消費者が「環境に良い」と感じて購入量を増やす「道徳的免罪符」の効果を実験で示した（抄録）。", "p3": "303人の被験者間実験で広告の主張の強さ（なし・弱・強）を操作し、購入・使用/買替え・廃棄の各段階への効果をPLS-SEMで同時に推定した（抄録）。", "p5": "強い主張は知覚された環境影響を高め、それが購入予定量を増やし、購入への総効果を完全に媒介した。使用・買替えへの効果はなく、早めの廃棄の正当化への小さな総効果はあったが媒介は確認できなかった。環境への関心はこの効果を弱めた（抄録）。", "fun": "「地球に優しい」と書かれた商品だと、つい安心してたくさん買ってしまう。良いことをした気分が、もっと消費してよい言い訳になる――環境のための宣伝が、かえって消費を増やしうるという皮肉を実験で確かめた点が面白いところです。", "unverified": "購入意図の測定であり、実際の購入行動での効果は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "ブランド危機の型がブランド嫌悪を経て不買へ", "title": "Consumer boycotts in brand crises: a brand hate perspective on intensity, attributions and motivations", "url": "https://doi.org/10.1108/jpbm-02-2026-6784", "authors": "Elif Guner ほか", "venue": "Journal of Product and Brand Management", "date": "2026-10-09", "sjr": 2.139, "citescore": 13.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Product and Brand Management誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "ブランドの危機が倫理的なものか性能的なものかで、ブランド嫌悪を介した不買意向がどう変わるかを、実験とSNS投稿の分析で示した（抄録）。", "p3": "研究1はシナリオ実験（n = 501）で危機の型を比較しブランド嫌悪の媒介と性格・動機の調整を検証し、研究2はSNSの5,729件の投稿をネトノグラフィーで分析した（抄録）。", "p5": "倫理的危機は性能の危機より強いブランド嫌悪と不買意向を生み、嫌悪が総効果の半分超を説明した。神経症傾向は関係を強めた。投稿ではイデオロギーの不一致が最も目立ち、嫌悪が強いほどブランド中心の帰属と表出的な動機が目立った（抄録）。", "fun": "商品が壊れたときより、会社が倫理的に許せないことをしたときの方が、人は強く怒り、買わなくなります。その怒りはスポンサーや有名人、政党にまで飛び火する――ネット上の「嫌い」の広がり方を実験と投稿の両方から描いた点が面白いところです。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "評判や財務余裕が企業の困窮リスクを下げる", "title": "The Role of Firm Attributes in Financial Distress Risk", "url": "https://doi.org/10.33005/ebgc.v7i02.1538", "authors": "Yulianti Raharjo ほか", "venue": "Journal of Economics, Business, and Government Challenges", "date": "2026-10-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Economics, Business, and Government Challenges誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの上場非金融企業で、評判・規模・負債・財務的余裕・減価償却といった企業属性が財務困窮リスクとどう関連するかを調べた（抄録）。", "p3": "2021〜2023年のインドネシア証券取引所の非金融上場企業の1,789観測（抄録では企業数と記載）を用い、STATAによる重回帰分析で仮説を検証した（抄録）。", "p5": "評判が良く流動性の高い企業は困窮リスクが低く、規模が大きく、負債と減価償却が多い企業はリスクが高かった（抄録）。", "fun": "大きな会社ほど潰れにくいと思いがちですが、この分析では規模が大きいほど困窮リスクが高いという結果でした。評判や手元資金の余裕のような「数字に表れにくい強さ」が会社を守っていた点が面白いところです。", "unverified": "困窮リスクの測定方法は抄録になく未確認。"}}, {"id": "jr38", "rank": 38, "headline": "不正スター要素と監査品質が財務不正を左右", "title": "The Influence of Fraud Star on Financial Report Fraud with Audit Quality as a Moderating Variable (Empirical Study of Manufacturing Companies Listed on the Indonesia Stock Exchange for the Period 2021 – 2024)", "url": "https://doi.org/10.61536/escalate.v4i01.675", "authors": "Chesylia Ayu Risma ほか", "venue": "Escalate : Economics and Business Journal", "date": "2026-10-09", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Escalate誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの素材系製造業で、不正スター（Fraud Star）の各要素と財務諸表不正の関連と、監査品質の調整効果を調べた（抄録）。", "p3": "2021〜2024年の上場41社・164観測を目的的抽出で選び、重回帰と調整回帰分析（MRA）で分析した（抄録）。", "p5": "財務目標は不正と有意な正の関連、業界の性質と合理化は負の関連を示し、能力と誠実さの欠如は有意でなかった。監査品質は財務目標と不正の関係を強め、業界の性質と合理化の関係を弱めた（抄録）。", "fun": "会社の不正は「プレッシャー」「機会」「言い訳」などがそろうと起きやすいと言われます。実際の決算データでそれを確かめると、高すぎる目標が最も不正と結びついていた――無理なノルマが不正の入口になるという身近な教訓に通じる点が面白いところです。", "unverified": "標本が41社と小さく、不正の測定方法は抄録になく未確認。"}}, {"id": "jr39", "rank": 39, "headline": "LLMエージェントの根拠付けはRAGと記憶の二層で", "title": "From Retrieval
