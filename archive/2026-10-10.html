e": "2026-10-08", "citescore": 16.0, "citescore_year": "2025", "why": "チップの回路逆解析という人間の作業について、練習効果と個人差を実験・準実験で調べたHCI研究。"}, {"id": "jn14", "rank": 14, "field": "交通・都市計画", "headline": "15分都市の評価に個人の移動能力を組み込む", "title": "Evaluating sustainable mobility potential through geographical accessibility and individual access, skills and appropriation", "url": "https://doi.org/10.1177/23998083261490631", "authors": "Jules Grandvillemin ほか", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-10-08", "sjr": 1.018, "citescore": 7.5, "citescore_year": "2025", "why": "公共交通の地理的アクセスに個人の移動能力（motility）を加えた指標で、15分都市の持続可能な移動の潜在力を測った。"}, {"id": "jn15", "rank": 15, "field": "交通・都市計画", "headline": "都市の食の取組みが女性の都市への権利を広げる", "title": "Finding a ‘place’ in public food matters: Gendered urban food initiatives shaping women’s right to the city", "url": "https://doi.org/10.1177/00420980261490802", "authors": "Chiara Bergonzini", "venue": "Urban Studies", "date": "2026-10-09", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "why": "公共の食の取組みが歴史的な家父長制を越えて女性の都市への権利を進めうるかを検討した都市研究。"}, {"id": "jn16", "rank": 16, "field": "交通・都市計画", "headline": "中国の都市で名門校が都市の資産として動員される", "title": "Schooling as urban asset: Education, capital and governance in entrepreneurial Chinese city", "url": "https://doi.org/10.1177/00420980261489149", "authors": "Zhenjie Yuan ほか", "venue": "Urban Studies", "date": "2026-10-09", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "why": "教育が公共財から都市開発の戦略資産へ組み替えられる過程を、企業家的都市の統治の観点から分析した。", "explain": {"basis": "抄録", "basis_note": "Urban Studies誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の地方都市で、名門校のブランドが公私連携を通じて不動産の付加価値に転換される過程を「学校の資産化」として理論化した事例研究である（抄録）。", "p3": "周縁的な都市の公私連携校の詳細な事例から、移動するブランド資本を持つ名門校、価値創出の象徴を求める開発業者、仲介する地方政府の3者の戦略的結合を分析する枠組みを作った（抄録）。", "p5": "学校の象徴資本は民間投資と政府の調整で不動産のプレミアムと社会的正統性に変わる一方、政治・規制上の正統性は国家が独占し、連合は新たな社会空間的不平等を生み、本質的に脆いとした（抄録）。", "fun": "「良い学校の近く」は家の値段を上げます。中国の地方都市では、名門校の看板そのものが開発の目玉として誘致され、教育という公共財が不動産の価値を生む「資産」に作り替えられていた――学区と地価の関係を、都市の統治の仕組みから描いた点が面白いところです。", "unverified": "単一事例の質的研究で、一般化の範囲は未確認。"}}, {"id": "jn17", "rank": 17, "field": "統計学", "headline": "応答時間で事前漏洩を検知し適応型テストを守る", "title": "Real-Time Protection of Person-Parameter Updating and Item Selection in Computerized Adaptive Testing Under Item Preknowledge Using Response-Time Evidence", "url": "https://doi.org/10.1177/00131644261489703", "authors": "Chunyu Piao ほか", "venue": "Educational and Psychological Measurement", "date": "2026-10-09", "sjr": 2.63, "citescore": 7.1, "citescore_year": "2025", "why": "項目の事前漏洩がある適応型テストで、応答時間の証拠を使い能力推定と項目選択を実時間で保護する方法を示した。", "explain": {"basis": "抄録", "basis_note": "Educational and Psychological Measurement誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "コンピュータ適応型テストで、問題の事前漏洩による回答を応答時間から実時間で検出し、能力推定と問題選択を守る枠組みを提案した（抄録）。", "p3": "項目ごとの応答時間を逐次ベイズ変化点検出で監視し、急な変化の証拠と正誤を組み合わせて漏洩の影響が疑われる回答を判定し、その回答を能力・速度の中間推定から除いて次の問題選択と終了判断を行う（抄録）。", "p5": "問題選択基準、漏洩の頻度と程度、時間強度の分布、固定長・精度基準の終了則を変えたシミュレーションで、受験者・回答の両水準で高い検出性能を示し、汚染の伝播を抑え、能力推定の精度を高めた。漏洩が多く深刻なほど効果が大きかった（抄録）。", "fun": "問題を事前に知っていると、異常に速く正解できてしまいます。適応型テストでは、その一問で次の問題の難しさまで狂ってしまう。答えるまでの時間の急な変化を見張って、怪しい回答だけを計算から外す――試験の公正さを守る工夫が面白いところです。", "unverified": "実データでの検証の有無は抄録になく未確認。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "忍耐の異質性と人口成長が富の蓄積を決める", "title": "Heterogeneous patience, population growth, and wealth accumulation", "url": "https://doi.org/10.1093/ej/ueag128", "authors": "Stéphane Bouché ほか", "venue": "Economic Journal", "date": "2026-10-08", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "why": "異質な割引率と新規参入を持つ新古典派成長モデルで、人口成長が富の分布に与える影響を理論的に示した。", "explain": {"basis": "抄録", "basis_note": "Economic Journal誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "割引率（忍耐強さ）が異なる人々と人口成長のある新古典派成長モデルで、最も忍耐強い人以外も資本を持ちうる唯一の定常均衡を証明した（抄録）。", "p3": "異質な割引率と資産ゼロの新規参入者を持つラムゼイ・モデル、または異なる割引因子の無限期間主体の世代重複モデルとして解釈できる成長モデルを分析した（抄録）。", "p5": "公債、労働所得税、資本補助を導入するとより多くの型の主体が貯蓄でき、割引率の異なる主体間の不平等は縮むが、同じ割引率で参入時期の違う主体間の不平等は広がる（抄録）。", "fun": "従来の理論では、長い目で見ると「一番がまん強い人」だけが財産をすべて持つことになりがちでした。人口が増えて新しい人が次々加わる世界では、そうならない――政策しだいで不平等の種類が入れ替わる、という結果が面白いところです。", "unverified": "定量的なカリブレーションの有無は抄録になく未確認。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "調達の強靭性と持続性を対立でなく逆説として扱う", "title": "From trade-off to paradox: a configurational theorizing and “quantum” approach to the resilience–sustainability tension in global sourcing", "url": "https://doi.org/10.1057/s41267-026-00909-z", "authors": "Giacomo Grassi ほか", "venue": "Journal of International Business Studies", "date": "2026-10-08", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "why": "グローバル調達の強靭性と持続可能性の関係を、逆説理論と構成的アプローチで理論化した国際経営研究。", "explain": {"basis": "抄録", "basis_note": "Journal of International Business Studies誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "グローバル調達の強靭性と持続可能性を、二者択一ではなく持続する逆説として捉え、調達担当者が施策を束にして組み合わせることを示した（抄録）。", "p3": "逆説の「量子」アプローチで構造と解釈を橋渡しし、立地、供給者の冗長性、在庫緩衝、グリーン認証、持続可能性プレミアムの5要因を、イタリアの調達担当者72人への要因配置調査、fsQCA、面接で検討した（抄録）。", "p5": "担当者は単独の手段より一貫した束を好み、認証による持続可能性の保証と近接・冗長・緩衝の強靭化策を組み合わせた。統合型、強靭性優先型、費用のみ型の3つの調達論理を示した（抄録）。", "fun": "環境に優しい仕入れ先と、災害に強い仕入れ網は、どちらかを選ぶものだと考えがちです。実際の担当者は二つを対立させず、「近くの工場」と「環境認証」のように組み合わせて両立を図っていた――矛盾を抱えたまま進む経営の知恵が面白いところです。", "unverified": "標本が72人と小さく、一般化の範囲は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "契約は持続可能性戦略を実行する意味づけの基盤", "title": "Contracting as Sensemaking Infrastructure: Enacting Sustainability Strategy in Business‐to‐Business Relationships", "url": "https://doi.org/10.1002/bse.71652", "authors": "Mohammad Naji Shah Mohammadi ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-09", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "企業間の契約が持続可能性の目標を取引先と共有し実行させる意味づけの仕組みとして働くことを示した。", "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environment誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "企業間の契約を、持続可能性戦略を取引先と共に実行するための「意味づけの基盤」として位置づけ直す理論統合の論文である（抄録）。", "p3": "センスメイキング、予防的契約、契約設計の研究を統合し、意味づけに基づく契約の枠組みを構築した（抄録）。", "p5": "枠組みは、統治の対象を明確にする枠づけ、責任・データ・手順への翻訳、正当な改訂を組織する適応、外部の信頼につなぐシグナリングの4機能からなる。共有された意味を支えるかは力関係やネットワーク上の位置に依存するとした（抄録）。", "fun": "「環境に配慮します」と契約書に書いても、取引先ごとに受け取り方がばらばらでは実行されません。契約を、守らせるための書類ではなく、目的を共有し直すための対話の仕組みとして捉え直した点が面白いところです。", "unverified": "理論論文で、実証データによる検証はない（抄録から）。"}}, {"id": "jn21", "rank": 21, "field": "天文学", "headline": "宇宙誕生から30億年の高速電波バーストを検出", "title": "A fast radio burst at redshift 2, three billion years after the Big Bang", "url": "https://doi.org/10.1126/science.adz2675", "authors": "Manisha Caleb ほか", "venue": "Science", "date": "2026-10-08", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "赤方偏移2の高速電波バーストを捉え、遠方の電離ガスと磁場を探る手段を大きく広げた。", "explain": {"basis": "抄録", "basis_note": "Science誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "高速電波バーストFRB 20240304Bの母銀河を赤方偏移2.148と特定し、宇宙誕生から約30億年の遠方のバーストを観測した（抄録）。", "p3": "電波観測と近赤外の追観測で母銀河を同定し、バーストの周波数・偏波特性から視線上のプラズマと磁場を調べた（抄録）。", "p5": "母銀河は低質量で塊状の星形成銀河で、赤方偏移2.148 ± 0.0013。宇宙の星形成の最盛期に起き、宇宙史の約80%にわたる電離ガスを探る。強い散乱は、現在の観測で見逃されているFRBの集団があることを示唆する（抄録）。", "fun": "ほんの1000分の数秒の電波の閃光が、宇宙の歴史の8割にあたる距離を旅してきました。途中のガスや磁場で形がゆがむので、その光は宇宙の見えない物質を測る物差しになる――一瞬の現象で宇宙の大部分を調べられる点が面白いところです。", "unverified": "なし"}}, {"id": "jn22", "rank": 22, "field": "量子情報", "headline": "中性原子で高忠実度のもつれゲートと非局所回路", "title": "High-fidelity entangling gates and nonlocal circuits with neutral atoms", "url": "https://doi.org/10.1126/science.aei1312", "authors": "Simon J. Evered ほか", "venue": "Science", "date": "2026-10-08", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "量子計算の主要な誤差源である2量子ビットゲートの誤りを下げ、中性原子での非局所回路を実現した。", "explain": {"basis": "抄録", "basis_note": "Science誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "中性原子の量子プロセッサで、2量子ビットの制御Zゲートの忠実度99.854%を達成し、原子の再配置を伴う非局所的な量子回路を実現した（抄録）。", "p3": "高ラビ周波数の滑らかな振幅パルスでゲートを実行し、状態選択的な読出しと量子ビットの再利用で高速に較正した。クラスター状態の生成と解消、長距離の結合を持つスクランブリング回路で性能を評価した（抄録）。", "p5": "忠実度は99.854(4)%、原子損失の事後選択で99.941(3)%となり、10時間安定した（抄録）。", "fun": "量子コンピュータの計算は、2つの量子ビットを絡ませる操作で一番間違いが起きやすいのです。その誤りを1万回に15回ほどまで減らし、しかも原子を動かして遠くの量子ビットどうしもつなげた――大きな計算に向けた着実な一歩である点が面白いところです。", "unverified": "なし"}}, {"id": "jn23", "rank": 23, "field": "機械学習", "headline": "汎用LLMが制約付きの結晶組成生成器になる", "title": "General-purpose LLMs as constrained crystal composition generators", "url": "https://doi.org/10.1038/s41524-026-02339-9", "authors": "Hedda Oschinski ほか", "venue": "npj Computational Materials", "date": "2026-10-09", "sjr": 2.943, "citescore": 17.4, "citescore_year": "2025", "why": "専用の生成モデルなしに汎用LLMで無機材料の組成探索を行えることを示した。", "explain": {"basis": "抄録", "basis_note": "npj Computational Materials誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "専用に学習していない汎用LLMが、繰り返しの問いかけで目標の物性領域の結晶組成を系統的に網羅できることを示した（抄録）。", "p3": "大きな化学空間の生成課題の標準であるエルパソライト（Elpasolite）を対象に、反復的なプロンプトと応答の枠組みでLLMに組成を生成させた（抄録）。", "p5": "目標領域の低エネルギーのエルパソライトの平均96%を回収し、主に反復的な文脈内学習によって、従来の専用生成モデルを上回った（抄録）。", "fun": "新しい材料を探すAIは、ふつう専用のデータで一から学ばせる必要があります。ところが、何も特別に学んでいない汎用のチャットAIに「次はこれを試して」とやりとりを重ねるだけで、狙った性質の候補をほぼ取りこぼさず挙げられた点が面白いところです。", "unverified": "使用したLLMの種類は抄録になく未確認。"}}, {"id": "jn24", "rank": 24, "field": "機械学習", "headline": "拡散トランスフォーマーで構造トポロジー最適化", "title": "Diffusion transformers with hybrid conditioning for structural optimization", "url": "https://doi.org/10.1007/s00158-026-04429-0", "authors": "Aaron Lutheran ほか", "venue": "Structural and Multidisciplinary Optimization", "date": "2026-10-09", "sjr": 1.072, "citescore": 7.9, "citescore_year": "2025", "why": "物理ベースの精度と生成モデルの速さを組み合わせた拡散トランスフォーマーによる構造最適化。", "explain": {"basis": "抄録", "basis_note": "Structural and Multidisciplinary Optimization誌に登録された抄録を使用", "preprint": false, "short": true, "p1": "拡散トランスフォーマー（DiT）で、問題設定から直接ほぼ最適な構造トポロジーを生成し、反復的な有限要素解析を不要にした（抄録）。", "p3": "応力・ひずみ場を空間的な条件として連結し、荷重位置・大きさ・体積率などのスカラーを適応的層正規化（AdaLN）で大域的な条件として与える。SIMPで最適化した2次元構造30,000件で学習した（抄録）。", "p5": "SIMPの正解に対するコンプライアンス誤差は1%未満で、体積率と連結性も保った。決定的なDDIMサンプリングにより5ステップほどで数秒で生成できた（抄録）。", "fun": "橋や部品の「一番軽くて強い形」を求める計算は、何百回もの構造解析が必要で時間がかかります。画像生成AIと同じ仕組みで、条件を与えれば数秒で最適に近い形を描けるようにした点が面白いところです。", "unverified": "3次元問題への適用は抄録になく未確認。"}}, {"id": "jn25", "rank": 25, "field": "因果推論", "headline": "ネットワーク干渉下の因果効果を強い仮定なしに推定", "title": "Causal Effect Estimation Under Networked Interference Without Networked Unconfoundedness Assumption", "url": "https://doi.org/10.1109/tpami.2026.3741691", "authors": "Weilin Chen ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-08", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "ネットワーク上の干渉がある場合に、ネットワーク非交絡の仮定を置かずに因果効果を推定する方法（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ネットワーク上の干渉がある観察データで、ネットワーク非交絡の仮定を置かずに、潜在交絡を復元して因果効果を推定する方法を提案した（抄録）。", "p3": "単位どうしの相互作用の型を手がかりに、本人だけ・近隣だけ・両方に影響する3種類の潜在交絡を明示した復元の枠組みを作り、識別可能な表現学習でネットワーク効果の推定量を設計した（抄録）。", "p5": "3種類の潜在交絡の識別可能性と、それに基づくネットワーク効果の識別を理論的に証明し、実験で有効性を確かめたとある（抄録）。", "fun": "友だちがワクチンを打つと自分の感染リスクも下がるように、効果は人から人へ波及します。しかも見えない共通の要因が絡むと、本当の効果が分かりにくい。人のつながり方そのものを手がかりに、見えない要因を掘り起こそうとする点が面白いところです。", "unverified": "実験の具体的な数値は抄録になく未確認。"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "深層時系列予測の10年を総括するサーベイ", "title": "Deep Time-Series Forecasting in 10 Years: A Survey", "url": "https://doi.org/10.1109/tpami.2026.3742172", "authors": "Hao Wang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-09", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "深層学習による時系列予測の10年の進展を整理したTPAMIのサーベイ（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "深層学習による時系列予測の10年を、自己相関のモデル化という統一的な観点から整理したサーベイである（抄録）。", "p3": "履歴系列の自己相関を捉える骨格アーキテクチャと、ラベル系列の自己相関を扱う損失関数の両方を一つの分類体系で整理した（抄録）。", "p5": "従来のサーベイが手薄だった損失関数も含めて分類し、研究の動機と洞察を自己相関の観点から分析して分野の発展の全体像を示した（抄録）。", "fun": "明日の気温は今日の気温に似ている――時系列データの「前の値に引きずられる」性質を、AIのつくり（入力の側）と採点の仕方（出力の側）の両面から整理し直した点が面白いところです。予測の誤差の測り方そのものも工夫の対象だと示しています。", "unverified": "サーベイの対象文献数は抄録になく未確認。"}}, {"id": "jn27", "rank": 27, "field": "機械学習", "headline": "画像の持続ホモロジーをGPUで高速計算", "title": "GPU-Accelerated Computation of Persistent Homology for Topological Analysis of Image Data", "url": "https://doi.org/10.1109/tpami.2026.3741473", "authors": "Fan Wang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-08", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "位相的データ解析の計算を画像向けにGPUで高速化した（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2次元・3次元画像の持続ホモロジーの計算をGPUで大幅に高速化するパイプラインTopoGPUを作った（抄録）。", "p3": "画像を塊ごとに流してGPUの並列カーネルで処理し、境界行列の簡約はCPUで行う。ストリーミングの下で持続ホモロジーを保つ離散モース・マッチングと、並列の位相的整列などを導入した（抄録）。", "p5": "既存のCubical Ripserをすべてのベンチマークで上回り、平均53.24倍、最大198.01倍の高速化を得た。位相を保つ深層ネットワークに組み込み、学習中の計算費用を大きく下げた（抄録）。", "fun": "画像の中の「穴」や「つながり」の数を、ぼかしの度合いを変えながら数えると、形の本質的な特徴が分かります。この数学的に重い計算をゲーム用の計算機（GPU）で数十〜百倍以上速くし、AIの学習に組み込めるようにした点が面白いところです。", "unverified": "なし"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "距離行列上のSE(3)不変な拡散過程", "title": "On Diffusion Process of SE(3)-Invariant Manifold Over Pairwise Distance Matrices", "url": "https://doi.org/10.1109/tpami.2026.3736318", "authors": "Zihan Zhou ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-09", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "対距離行列の多様体上で回転・並進に不変な拡散過程を構成した（抄録なし）。", "explain": {"basis": "題名", "basis_note": "IEEE TPAMI誌の記録で、抄録・本文とも入手できず題名のみ", "preprint": false, "short": true, "p1": "題名から、点どうしの距離行列の上で、回転・並進に対して不変（SE(3)不変）な多様体の拡散過程を構成する研究と読み取れる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "分子や物体の形は、向きを変えても位置をずらしても同じ形です。点と点の距離だけで形を表せば向きの違いを気にせずに済む――その距離の表の上で、画像生成AIのような「ノイズから形を作る」過程を考えようとする問いが面白いところです。", "unverified": "題名以外の情報（手法・結果）はすべて未確認。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "テキストから動作生成を強化学習で統一的に微調整", "title": "MotionRFT: Unified Reinforcement Fine-Tuning for Text-to-Motion Generation", "url": "https://doi.org/10.1109/tpami.2026.3741371", "authors": "Xiaofeng Tan ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-08", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "テキストからの人体動作生成を強化学習で微調整する統一的手法（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "テキストから人の動作を生成するモデルを、多次元の報酬モデルMotionRewardと効率的な微調整法EasyTuneで強化学習的に微調整する統一的な枠組みを示した（抄録）。", "p3": "異なる動作表現をテキストを基準とした共通の意味空間に写して多次元の報酬を学び、雑音除去の各段階にまたがる再帰的な勾配依存を避けて段階ごとに最適化する（抄録）。", "p5": "MLDでFID 0.132をピークメモリ22.10 GBで達成し、DRaFTより最大15.22 GB節約した。関節ベースのACMDMでFIDを22.9%下げ、回転ベースのHY MotionでR-Precisionを12.6%、FIDを23.3%改善した（抄録）。", "fun": "「元気よく手を振る」と書けばその動きを作るAIは、言葉に合っているか、自然か、人が好むかを同時に満たすのが難しいのです。生成の途中の一歩一歩に細かく点数を付けて直すことで、少ないメモリで全体の質を上げた点が面白いところです。", "unverified": "なし"}}, {"id": "jn30", "rank": 30, "field": "交通・都市計画", "headline": "韓国の交通資本と地域経済、公共投資評価への含意", "title": "Transport capital and regional economic performance in Korea: Implications for balanced regional development under the public investment appraisal system", "url": "https://doi.org/10.1016/j.tra.2026.105295", "authors": "Changhoon Lee ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-07", "citescore": 12.1, "citescore_year": "2025", "why": "交通インフラ資本と地域経済の関係から、均衡発展と公共投資評価制度への含意を論じた（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "韓国の15地域（2000〜2023年）で道路と鉄道の交通資本の産出弾力性を推定し、予備妥当性調査（PFS）の下の交通投資だけでは地域格差を解消しにくいことを示した（抄録）。", "p3": "道路と鉄道の弾力性が地域ごとに異なることを許し、残差の時間依存を考慮した多水準のコブ・ダグラス型の枠組みでパネル推定した（抄録）。", "p5": "道路の弾力性は平均約0.12でソウル-釜山回廊で最も高く、鉄道は平均約0.15で首都圏と隣接する忠清回廊で最も高かった。PFSが均衡発展で優先した後進地域を含む一部地域では、どちらも正だが低かった（抄録）。", "fun": "道路や鉄道をつくれば遅れた地域も発展する、と期待されがちです。ところが、同じ投資でも効果が大きいのはすでに栄えている回廊で、優先して投資した地域では効果が小さかった――交通だけでは格差は埋まらないことを数字で示した点が面白いところです。", "unverified": "なし"}}, {"id": "jn31", "rank": 31, "f escore_year": "2025", "why": "非正規移住の動機をラボ・イン・ザ・フィールド実験で調べた（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Crossrefの題名検索で見つかったSSRN版の抄録を使用（掲載版の本文は入手できず）", "preprint": false, "short": true, "p1": "ガンビアの農村での報酬付きの実地実験で、非正規移住の希望者が途中での死亡確率を大きく過大評価しており、情報の効果は事前の信念に左右されることを示した（抄録）。", "p3": "欧州への非正規移住の人口あたりの率が最も高いガンビアの農村で、死亡確率と合法的な在留資格の取得確率を変えた条件のもとで移住の意向を測った（抄録）。", "p5": "希望者の死亡確率の信念は平均51%で、入手できる最良の推定値約20%を大きく上回った。死亡確率を50%から20%に下げると意向は3.0ポイント上がり、在留取得確率を50%から30%に下げると2.1ポイント下がった（抄録）。", "fun": "危険な海の渡航は、人々が危険を知らないから行われていると考えがちです。ところが実際には危険をむしろ過大に見積もっており、「本当はもっと安全だ」と伝えると移住したい人が増えてしまう――善意の情報提供が逆効果になりうることを示した点が面白いところです。", "unverified": "SSRN版の抄録であり、掲載版との違いは未確認。"}}, {"id": "jn36", "rank": 36, "field": "環境科学", "headline": "世界の湿地干拓は農業の利益が小さく洪水リスク大", "title": "Limited agricultural gains but high flood risk from global wetland reclamation", "url": "https://doi.org/10.1038/s41893-026-01965-x", "authors": "Xi Zhang ほか", "venue": "Nature Sustainability", "date": "2026-10-09", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "why": "湿地の干拓が農業生産に与える利益と洪水リスクを世界規模で比べた（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Nature Sustainability誌の記録で、抄録・本文とも入手できず題名のみ", "preprint": false, "short": true, "p1": "題名から、世界の湿地の干拓は農業上の利益が限られる一方で洪水リスクを大きく高めるという主張の研究と読み取れる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "湿地は水をためるスポンジのような役目を持っています。それを埋め立てて畑にすると、食べ物は少し増えても、あふれた水の行き場がなくなるかもしれない――得るものと失うものを世界規模で比べようとする問いが面白いところです。", "unverified": "題名以外の情報（手法・結果）はすべて未確認。"}}], "data_related": [{"rank": 1, "headline": "10のLLMの枠組み効果を人間と比べる再現データ", "title": "Replication Data and Code: Multi-Experiment Comparative Audit of Framing Effects in Large Language Models with a Human Baseline and a Preliminary User Study", "url": "https://doi.org/10.5281/zenodo.23264082", "authors": "anonymous", "venue": "Zenodo", "date": "2026-10-09", "summary": "10種類の大規模言語モデルのAPI応答（7つの主実験と検証実験）を匿名化して収録し、人間の基準データ（N=786）と予備的な利用者調査（N=218）、ベイズ頑健性の出力、刺激、実行・分析スクリプト一式を含む。枠組み効果（フレーミング）をモデル間と人間とで比較する再現用パッケージ。ライセンスはCC BY     "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
