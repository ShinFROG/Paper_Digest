<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

者はねじりの誤差を、横とねじりを非連成とした簡略せん断モデルの限界とし、最も軽微な損傷（シナリオ5）では数値のずれが残ると認めている（§3.2.3）。検証は数値ベンチマークのモデル間で、実測の雑音や環境変動のある実構造での検証はない。", "fun": "進化計算には「広く探す」のが得意な方法と「狭く詰める」のが得意な方法があります。どちらをいつ使うかを人が決める代わりに、AIの監督役が試合の流れを見ながら選手交代を続けるように調整する発想が面白いところです。しかも学習後は監督役だけで動けるので、別の問題にもそのまま使えます。", "unverified": "数学ベンチマークでの既存法との比較の数値（表4・5）は表の列の対応が読み取れず未確認。"}}, {"id": "pr02", "rank": 2, "headline": "10-Kのリスク記述をLLMで抽出、信頼性を監査", "title": "Reliable or Just Consistent? Auditing LLMs on SEC 10-K Risk Disclosures", "url": "https://doi.org/10.2139/ssrn.7580138", "authors": "Mutian He", "venue": "SSRN", "date": "2026-10-09", "apa": "He, M. (2026). Reliable or Just Consistent? Auditing LLMs on SEC 10-K Risk Disclosures. https://doi.org/10.2139/ssrn.7580138", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文はOpenAlex・出版社とも取得できず", "preprint": true, "p1": "米企業の10-Kの「リスク要因」節からLLMで変数を作る作業について、11のLLMの信頼性（再現性・モデル間一致）と妥当性を二層の手順で監査し、判断が細かいほど信頼性が落ちることを示した（抄録）。", "p2": "企業や研究者はLLMで開示テキストを構造化変数に変換しているが、その測定の信頼性は使う前にほとんど確かめられていない（抄録）。", "p3": "35社のItem 1Aに、①個別リスクの抽出、②9分類への分類、③財務影響・可能性・緊急度の1〜10の採点、という入れ子の3課題を課した。第1層でスキーマに合う出力を返すか、第2層で反復間の安定性（級内相関ICC）とモデル間一致を測り、62件の抽出リスクを人が妥当性確認した（抄録）。", "p4": "比較対象は商用API 3種と7B〜32Bのオープンモデル8種（推論型と非推論型を含む）。指標は分類一致、採点の順位一致（Spearman）、抽出の重なり（Jaccard）、ICC、人手確認の精度である（抄録）。", "p5": "モデル間一致は分類0.72、採点の順位0.57、抽出0.44の順に下がり、最も安定した商用モデルでも採点のICCは約0.89だった。推論型のオープンモデルは採点ICCの平均が0.36で非推論型の0.70より低かった（差0.33、95%CI 0.30〜0.37）。妥当性も抽出の精度1.00、分類0.92、採点の妥当性0.87の順だった（抄録）。", "p6": "対象は35社の1種類の節に限られ、他の開示や日本語文書への一般化は抄録からは分からない。解釈：採点のような連続的な判断を変数に使う研究では、課題ごとの信頼性の報告が欠かせない。", "fun": "AIが流暢に答えると、つい正しいと思ってしまいます。でも同じ質問を何度か繰り返すと、リスクの「重さ」の点数は毎回ばらばら――とくに「よく考える」タイプのAIほど答えが揺れていました。滑らかな文章と信頼できる測定は別物だと、数字で示した点が面白いところです。", "unverified": "本文が読めず、使用したモデル名と採点のプロンプトの詳細は未確認。"}}, {"id": "pr03", "rank": 3, "headline": "単一速度場MPMで多体接触と自己接触を統一", "title": "Unified contact in the single-velocity-field material point method using extended basis functions", "url": "https://doi.org/10.2139/ssrn.7589285", "authors": "Sohei Nagase ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Nagase, S., Sugai, R., Hidano, S., & Terada, K. (2026). Unified contact in the single-velocity-field material point method using extended basis functions. https://doi.org/10.2139/ssrn.7589285", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "物質点法（MPM）で、多体の接触と自己接触を、節点の自由度を増やさずに単一の速度場の中で統一的に扱う接触の定式化を提案した（抄録）。", "p2": "従来のMPMの接触は、接触する物体ごとに別の速度場を持たせるのが一般的で、自由度が増え、自己接触を同じ枠組みで扱いにくかった（抄録）。", "p3": "接触面に対する物質点と格子節点の位置関係を外向き単位ベクトルで判別し、拡張基底関数によって単一の速度場の中で各物体の補間領域を分離する。貫入しない条件は粒子どうしのペナルティ法で課し、陽的な時間積分を用いる（抄録）。", "p4": "1次元・2次元の衝突、多体接触、自己接触、3次元接触の5つの数値例で、接触と離脱の振る舞いを確かめた（抄録）。", "p5": "5つの例で適切な接触と離脱の挙動が得られ、2次元・3次元で多体接触と自己接触を統一的に扱えることを示したとある。精度や計算時間の数値は抄録にない（抄録）。", "p6": "解析解や既存手法との定量比較の有無は抄録からは分からない。ペナルティ係数の選び方への依存や、陽解法の時間刻みの制約も未確認の点として残る。", "fun": "砂や土のように大きく変形するものを計算する物質点法では、2つの物体がぶつかるとき「どちらの物体の点か」を区別する必要があります。速度の地図を物体ごとに増やす代わりに、一枚の地図の上で「面の内か外か」の向きで見分けるという、ものぐさで賢い工夫が面白いところです。", "unverified": "本文が読めず、精度・計算費用の定量評価は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "ペルソナを文体の頻度で定義し忠実度を測定", "title": "Back in Style: A Sociolinguistic Approach to Authoring and Measuring Persona Fidelity in User Simulation", "url": "https://arxiv.org/abs/2610.10988", "authors": "Lex Konnelly ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Konnelly, L., Khasanova, E., Wang, R., Lee, M., Saini, H., & Kavehzadeh, P. (2026). Back in Style: A Sociolinguistic Approach to Authoring and Measuring Persona Fidelity in User Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10988", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法、識別可能性の結果、付録Eの人手評価、図表キャプション）を読んだ。文体の遵守度の表2の数値は確認していない", "preprint": true, "p1": "LLMの利用者シミュレータのペルソナを、形容詞の説明ではなく「質問の頻度」「ためらい語」などの観察できる文体の頻度で定義し、LLM審査員を使わない決定的な指標で忠実度を測れるようにした（抄録、§3）。", "p2": "エージェントの評価に使う模擬利用者は実在の利用者との忠実度が低く、その評価は費用が高く主観的なLLM審査員に頼っていた（§1、抄録）。", "p3": "社会言語学者が8つのペルソナ（不安な問合せ者、怒る苦情者など）について、質問率・発話長・ヘッジ・丁寧表現・フィラー・大文字・ネット略語・感情価の8特徴を「なし〜高」の帯で指定する（§3.2）。忠実度は、文字n-gramのTF-IDFの類似度で同じペルソナの会話を見分けられるかのROC-AUC（0.5で区別不能）と、指定した帯と観察頻度の順位相関（ケンドールのτ_b）で測る（§3.3）。", "p4": "従来の形容詞による記述（archetype）と頻度の定義（definition）を、9つの文章モデルと音声モデルで比べ、5業種の顧客対応エージェントとの計4,103会話を分析した。ラベルを入れ替える対照でAUCが約0.5に戻ることも確認した（§3.3.1、§3.4）。", "p5": "表1（行：モデル、列：記述方式）を見ると、定義方式で識別AUCはgpt-5-miniで0.449→0.636、claude-haiku-4-5で0.509→0.651と上がった一方、Gemini系3構成は両方式とも0.5未満で改善はほぼなかった（表1、§4.1）。強いモデルほど操作しやすいとは限らなかった（§4.1）。", "p6": "著者は、文体の忠実度は「自然さ」と同じではないこと、少数の人手評価（各モデル10組）は傾向にとどまることを認めている（抄録、付録E）。会話の内容（課題の達成の仕方）の忠実度は測っていない。", "fun": "「せっかちな人」と説明するより、「質問は少なめ、文は短め、略語多め」と具体的な数で指示した方が、AIはその人らしく話し分けられました。しかも、その「らしさ」を筆跡鑑定のような文字のくせの比較で、AIの審査なしに測れる――言語学の道具をAIの評価に持ち込んだ点が面白いところです。", "unverified": "文体の遵守度（表2）のモデル別の数値は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "AIエージェントが銀行の乗換え障壁を埋める", "title": "The Effect of AI Agents on Switching Costs How Another Moat in Banking Is Being Filled", "url": "https://doi.org/10.2139/ssrn.7589638", "authors": "Jimmie Lenz", "venue": "SSRN", "date": "2026-10-09", "apa": "Lenz, J. (2026). The Effect of AI Agents on Switching Costs How Another Moat in Banking Is Being Filled. https://doi.org/10.2139/ssrn.7589638", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "銀行の預金の乗換えが金利差に比べて鈍いのは、価格を知らないからではなく乗換えの手間（努力コスト）のためだという見方を規制データで裏づけ、AIエージェントがその手間をゼロに近づけうると論じた（抄録）。", "p2": "小売銀行の顧客関係は価格より乗換えの手間で守られてきた（スイッチングコストの「堀」）。Metaの「Muse」のように金利比較と取引実行を代行するAIの登場で、この堀が埋まるかが問われる（抄録）。", "p3": "選んだ銀行のFFIEC規制データ（2006〜2026年）と信用組合のNCUAデータ（2006〜2021年）で、金利差に対する預金シェアの移動を推定し、中国の余額宝の急成長や住宅ローンでの摩擦低減への支払いの事例と照らした（抄録）。", "p4": "基準は金利差1ポイントあたりの預金シェアの移動と、四半期変動の説明力である（抄録）。", "p5": "関係は統計的に有意だが小さく連続的（閾値型ではない）で、金利差1ポイントあたり約0.40〜0.66ポイントのシェア移動、四半期変動の説明は標本と期間により最大19〜70%だった（抄録）。", "p6": "銀行の標本は「選んだ」ものであり、選び方の偏りは抄録からは評価できない。AIエージェントの効果自体は推定されておらず、事例との類推に基づく主張である。", "fun": "よその銀行の方が金利が高いと知っていても、口座を移すのは面倒なので多くの人は動きません。その「面倒くささ」こそが銀行の守りの壁だったのなら、手続きを全部代わりにやってくれるAIは、その壁を一気に崩すかもしれない――身近な面倒が経済を動かしているという見方が面白いところです。", "unverified": "本文が読めず、銀行標本の選定方法と推定式は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "走行データからのタイヤ同定は励起不足で失敗", "title": "Excitation-Aware On-Track System Identification at Full Scale", "url": "https://doi.org/10.21203/rs.3.rs-11118830/v1", "authors": "Ebrahim Abdelghfar ほか", "venue": "Research Square (In Review)", "date": "2026-10-08", "apa": "Abdelghfar, E., Elshalakani, M., Abdelaziz, M., & Said, S. (2026). Excitation-Aware On-Track System Identification at Full Scale. https://doi.org/10.21203/rs.3.rs-11118830/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリント本文（PDF）の抄録、問題設定と貢献の節（§1.1–1.2）、§6の結果の一部を読んだ。各節の詳細な導出は読んでいない", "preprint": true, "p1": "通常の走行データからタイヤモデルを学ぶ「走行中のシステム同定」の手法を実車規模に移すと、合成データの段階で励起が不足し同定が破綻することを示し、3つの欠陥を直してグリップの低下まで追跡できるようにした（抄録）。", "p2": "1/10模型（3.7 kg）で動いた手法を269.6 kgのフォーミュラ・スチューデント車両（ホイールベース1.53 m、9.6〜25.8 m/s）に移すと何が同定されるかという識別可能性の問題である（§1.1）。", "p3": "Pacejkaの式は合成した走行（ロールアウト）にしか当てはめられず、到達できる摩擦は μ ≈ v²δ/(gL) とロールアウトの設定で決まり、ここでは0.43で頭打ちになる。ピーク以下では横力が Fz·(BCD)·α とB・C・Dの積でしか効かず、ピーク係数Dは識別できない（§1.1–1.2）。そこで記録した走行から速度を選ぶ励起考慮のロールアウト、Dの別推定と固定、緩和した不動点反復（β = 0.20）、物理量に基づく制御器への受入れ判定を導入した（§1.2）。", "p4": "車輪ごとの力を真値として出力するCARLAシミュレータで、事前分布（μ = 1.05で計測）と異なるμ = 0.70の静的路面と、走行中にグリップが半分まで落ちる路面で、旧設定と比べた（§1.2）。", "p5": "静的路面で軸のコーナリング剛性を前3.2%、後1.4%の誤差、ピーク係数を11%で同定し、旧設定は剛性を118〜132%過大評価した。軸力のRMSEは12.1倍・10.5倍低く、MPCの横方向追従誤差は32%低かった。低下する路面では低下率を7%で追い、3周を完走した一方、旧設定は2周目でコースを外れた（§1.2、§6）。", "p6": "結果はすべてシミュレーションで得られたもので、実車での検証はない（§1.2）。解釈：合成データの段階が識別可能性を決めるという指摘は、他の車両応答からの同定でも励起の設計に関わる。", "fun": "小さな模型でうまくいった方法を本物の車に移したら、タイヤのグリップを半分以下と勘違いしてしまいました。原因は、AIの学習用に作った「仮想の走り」が遅すぎて、タイヤの限界まで試せていなかったこと。データがないのではなく、試し方が足りなかったという発見が面白いところです。", "unverified": "§3〜§5の導出（式の詳細）は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "支出のエントロピーが家計の財務困窮を予告", "title": "Evidence from mass-transactional data that chaotic spending behaviour precedes consumer financial distress [pre-print]", "url": "https://doi.org/10.82444/warw.33853894", "authors": "Naomi K. Muggleton ほか", "venue": "University of Warwick", "date": "2026-10-08", "apa": "Muggleton, N. K., Quispe-Torreblanca, E. G., Leake, D., Gathergood, J., & Stewart, N. (2020). Evidence from mass-transactional data that chaotic spending behaviour precedes consumer financial distress [pre-print] (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33853894", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ（OpenAlex登録）の抄録を使用。本文は取得できず", "preprint": true, "p1": "数百万の銀行口座の取引データから、支出の予測しにくさを表す「支出エントロピー」を性格の指標として作り、それが将来の財務困窮を予告することを示した（抄録）。", "p2": "デジタルの足跡を使えば、多数の人の特性を生態学的妥当性の高い形で調べられる。従来の困窮予測は支出の量や費目に頼っていた（抄録）。", "p3": "支出の費目の分布の予測しにくさ（エントロピー）を個人ごとに計算し、支出の量と内容を統制したうえで、将来の支払い遅延などの困窮との関係を時間的に調べた（抄録）。", "p4": "結果は複数の金融商品での支払い遅延の確率と、より深刻な困窮の指標で測り、別の金融機関の当座預金・ローン・住宅ローンの保有者で再現を確かめた（抄録）。", "p5": "支出エントロピーは支出の量と内容を超えて将来の困窮と正に関連し、3か月先の困窮（より深刻な指標を含む）と時間的に結びついた。第2の金融機関でも再現した（抄録）。", "p6": "効果の大きさや予測精度の数値は抄録にない。リポジトリの新規登録で、元の公表年は記録からは確認できない。解釈：エントロピーは生活の混乱の結果でもありうるため、原因か兆候かは区別が必要。", "fun": "毎月だいたい同じ店で同じように使う人と、日によって使い道がばらばらな人。使う金額が同じでも、後者の方が数か月後に支払いが滞りやすかった――お金の使い方の「乱雑さ」を、物理のエントロピーの考え方で測った点が面白いところです。", "unverified": "本文が読めず、効果の大きさと予測精度は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "AI利用の小企業ほど雇用増を見込む", "title": "AI Adoption and Employment Expectations: Evidence from a Survey of Small Business Owners", "url": "https://doi.org/10.2139/ssrn.7583980", "authors": "Will Aarons ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Aarons, W., & Sarkar, A. (2026). AI Adoption and Employment Expectations: Evidence from a Survey of Small Business Owners. https://doi.org/10.2139/ssrn.7583980", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの記録（ニューヨーク連銀Liberty Street Economicsのブログ記事）の抄録を使用。本文は取得できず", "preprint": true, "p1": "米国の小企業の調査で、AIを使っている企業は使っていない企業より、今後1年の雇用と売上の増加を見込む傾向が強いことを示した（抄録）。", "p2": "AI導入が雇用に与える影響は合意がなく、経済全体の賃金・雇用はほとんど動いていない一方で、若年層やAIに晒される職種の採用は減っているという証拠もある（抄録）。", "p3": "2025年の小企業信用調査（SBCS）で、AI利用企業の12か月先の雇用・売上の見通しを、企業・経営者の属性と所在地を統制して非利用企業と比べた（抄録）。", "p4": "基準は雇用と売上の増加を見込む確率である。背景として、従業員1人以上の企業の46%がAIを利用し、15%が12か月以内に導入予定と記載されている（抄録）。", "p5": "AI利用企業は統制後も雇用・売上の増加を見込む確率が有意に高く、技術の活用に運営上の課題を抱えるAI利用企業で売上の見通しが最も楽観的だった。利用企業の63%がAIを生産に重要とし、51%が業務に部分的以上に統合していた（抄録）。", "p6": "見通し（期待）の分析で実際の雇用変化ではなく、AI利用と楽観の関係は因果とは限らない。ブログ記事であり、推定の詳細は抄録からは分からない。", "fun": "「AIが仕事を奪う」という心配とは逆に、AIを使っている小さな会社ほど「来年は人を増やす」と答えていました。大企業と違って人手の限られた小企業では、AIが人の代わりではなく、商売を広げる道具として受け止められているのかもしれない、という見方が面白いところです。", "unverified": "本文が読めず、効果の大きさ（確率の差）は未確認。"}}, {"id": "pr09", "rank": 9, "headline": "LLMの合成回答者800人で広告を事後評価", "title": "In Silico Advertising Tests", "url": "https://doi.org/10.31235/osf.io/5nteh_v1", "authors": "Marta Trales ほか", "venue": "SocArXiv", "date": "2026-10-08", "apa": "Trales, M., Hochard, G., & Benavent, C. (2026). In Silico Advertising Tests. https://doi.org/10.31235/osf.io/5nteh_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXivのプレプリント本文（PDF）の抄録、手法（§3.5）、考察と結論、図表キャプションを読んだ。結果の節の個々の表の数値は抄録に挙がったもの以外は確認していない", "preprint": true, "p1": "LLMエージェントを人間の代わりではなく「合成回答者」として扱い、プロフィール条件付きの800体のパネルで2本のテレビ広告の比較事後テストを行い、合成コーパスが構造化された解釈可能な証拠を生むかを内的妥当性で検証した（抄録）。", "p2": "広告テストは費用がかかり、LLMの合成回答者の利用が広がる一方、その出力がばらばらな文章の山ではなく分析に使える証拠になるのかは確かめられていなかった（序論、抄録）。", "p3": "人口統計・心理・行動のプロフィールを「回答者の立場」に統合し、同じ広告と面接ガイドを全エージェントに与えてGemini 2.5 Proでフランス語の面接を生成し、別にMistral 7Bで分類ラベルと得点に符号化した（図1、§3.5.1、考察）。妥当性は、内容（質問が広告反応の次元を覆うか）、法則論的妥当性（プロフィール・評価次元・選好の構造）、弁別・収束（ラベル・得点・語彙・埋め込みで2広告が区別され整合するか）の順に確かめた（§3）。", "p4": "対象は仏通信市場のBouygues TelecomとOrangeの広告で、人間の回答との比較は行わず、内部の一貫性のみで評価した（§3、抄録）。", "p5": "800体全体で、創造性ではBouyguesが83.6%（Orange 14.8%）、情報探索・検討ではOrangeが76.8%（Bouygues 14.8%）、総合的な選好ではOrangeが54.8%（Bouygues 20.6%）だった（抄録）。年齢が高いプロフィールほどOrangeを選好する勾配がみられた（表13）。", "p6": "著者は、提示順が固定でBouyguesが常に先、生成と符号化が各1モデル、既知ブランドの事前知識が混入しうる、プロフィールが紋切り型の人物像に平板化される恐れ、を限界とし、母集団推定や実際の広告効果の根拠にはならないと明記している（考察）。", "fun": "AIに800人の「架空の消費者」を演じさせて広告の感想を聞くと、「面白いのはこっち、買いたいのはあっち」と人間の調査でも見られそうな区別がはっきり出ました。ただし著者自身が、これは本物の消費者の声ではなく、聞き方の道具が筋の通った答えを返すかの確認だと線を引いている点も含めて面白いところです。", "unverified": "表9〜12の得点差や一貫性指標の具体的な数値は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "固定端の剛性が損傷検知の振動数を揺らす", "title": "Damage-Dependent Modal Frequency Sensitivity to ClampingStiffness in Cantilever Beams Using Multi-Mode MagnetoelasticSensing", "url": "https://doi.org/10.2139/ssrn.7585313", "authors": "GEORGIOS SAMOURGKANIDIS", "venue": "SSRN", "date": "2026-10-08", "apa": "SAMOURGKANIDIS, G. (2026). Damage-Dependent Modal Frequency Sensitivity to ClampingStiffness in Cantilever Beams Using Multi-Mode MagnetoelasticSensing. https://doi.org/10.2139/ssrn.7585313", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "片持ち梁の固定端の締付け力と損傷の相互作用を31本の梁で実験し、支点近くの損傷は固有振動数の締付け剛性への感度を抑え、境界条件の状態を見かけ上隠しうることを示した（抄録）。", "p2": "固定端の境界条件の不確かさは固有振動数を変え、振動に基づく損傷評価を難しくする（抄録）。", "p3": "アルミ合金6063の梁31本（健全1本、6位置×5深さの切欠き30本）を1〜10 tfの19段階の締付け力で試験し、非接触の磁気弾性センサで1〜7次の曲げ振動数を測った。振動数と締付け力の関係を指数飽和モデルで表し、飽和速度k、相対飽和振幅R_A = 100A/f₀、最小締付け力での相対感度S₁を指標とした（抄録）。", "p4": "モデルの当てはまりを自由度調整済みR²で、損傷の位置・深さごとの指標の違いで評価した（抄録）。", "p5": "210曲線の92.9%で調整済みR²が0.95を超えた。支点から50〜100 mmの損傷はk、R_A、S₁が最も低く、150〜250 mmでは大きかった。kとR_Aの相関は0.736。平均S₁は100 mmの0.692%/tfから150 mmの1.841%/tfへ約166%増えた。深さの効果は一様な単調性を示さなかった（抄録）。", "p6": "アルミの片持ち梁と機械加工の切欠きによる実験で、実構造の支承や疲労き裂への一般化は未確認。解釈：境界の劣化と損傷の分離には、複数モードの感度を併用する設計が要る。", "fun": "梁の付け根の締め具合が変わるだけで、揺れの高さ（振動数）は変わります。ところが付け根のすぐ近くに傷があると、締め具合を変えても振動数があまり反応しなくなった――傷が「付け根のゆるみ」の手がかりを覆い隠してしまうという、点検の落とし穴を示した点が面白いところです。", "unverified": "本文が読めず、各モード別の結果の詳細は未確認。"}}, {"id": "pr11", "rank": 11, "headline": "SINDyで選んだ項の有意性を選択後推論で検定", "title": "PSI-SINDy: Post-Selection Inference for Sparse Identification of Nonlinear Dynamics", "url": "https://arxiv.org/abs/2610.11486", "authors": "Ashraful Islam ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Islam, A., Nishino, S., Shiraishi, T., & Takeuchi, I. (2026). PSI-SINDy: Post-Selection Inference for Sparse Identification of Nonlinear Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11486", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（貢献、問題設定の§2.2、手法の§3.1、実験の§4、結論）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "時系列データから支配方程式の項を疎に選ぶSINDyについて、選ばれた項の係数に検定と信頼区間を与える選択後推論（post-selection inference）の方法PSI-SINDyを提案した（抄録、§1）。", "p2": "同じ雑音入りの軌道で項の選択と有意性の評価を行うと選択バイアスが生じ、さらに応答と説明変数（候補項）が同じ観測から作られるため誤差が相関し、候補項自体に測定誤差がある（変数誤差問題）。例えば x² の期待値は真値に σ² が上乗せされる（§2.2）。", "p3": "1本の軌道をガウスの「データ間引き（data thinning）」で互いに独立な4つの版に分け、選択、検定用の応答、測定誤差を補正した設計行列、操作変数をそれぞれに割り当てる（§3.1）。これで補助的な操作変数係数には有限標本で厳密な条件付き推論が、主目標の選択モデルの最良線形近似（BLA）係数には漸近的に妥当な推論が得られる（§3）。", "p4": "dx/dt = −0.25 − 0.35x + γx² + δ sin 2x の模擬データ（各設定5,000データ）で、選択データを再利用する素朴法、モデル数でボンフェローニ補正する方法、アンサンブルSINDyなどのブートストラップと比べ、第1種の過誤、検出力、被覆率、区間幅を測った（§4）。", "p5": "真のBLAでの棄却率はPSI-SINDyが4.41〜5.39%と名目5%に近く、素朴法は7.36〜8.69%、ボンフェローニは1.61〜2.02%だった（図1、§4.1）。区間の被覆は94.61〜95.59%で、観測数Mを200から3200に増やすと区間の中央幅は0.3846から0.0957に縮んだ（§4.1）。8つのスーパーキャパシタ放電データにも適用した（§4.4）。", "p6": "著者は、保証が漸近的でスカラーの軌道・固定の多項式ライブラリ・既知分散の独立ガウス雑音に限られること、多状態系や時間相関のある雑音では被覆が名目に届かない場合があること（相関雑音で81.86%）を認めている（§4.3–4.4、§5）。", "fun": "データから「この現象は x² の項で動いている」と式を見つけても、それが偶然かどうかは分かりません。1本のデータを、くじ引きのように4つの独立な部分に分けて、選ぶ係・確かめる係・補正する係に別々に使う――同じ答案で問題作りと採点をしないための工夫が面白いところです。", "unverified": "付録の証明と、スーパーキャパシタの推定値（表14）は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "InSAR変位からすべり面深さを質量保存で逆解析", "title": "Dynamic fusion of displacement parallelism and mass conservation for landslide slip-surface depth inversion from SBAS-InSAR observations: a case study in the Wudongde reservoir area", "url": "https://doi.org/10.21203/rs.3.rs-10724696/v1", "authors": "Jiaxuan Huang ほか", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "Huang, J., Lueking, J., Du, W., & Sun, J. (2026). Dynamic fusion of displacement parallelism and mass conservation for landslide slip-surface depth inversion from SBAS-InSAR observations: a case study in the Wudongde reservoir area. https://doi.org/10.21203/rs.3.rs-10724696/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリント本文（PDF）の抄録、結果（§4）、限界（§5.4）、結論を読んだ。手法の式（§3）の詳細は読んでいない", "preprint": true, "p1": "Sentinel-1の上昇・下降軌道のSBAS-InSARから、地すべりのすべり面の深さ（活動層厚）の時間変化を、変位平行の原理と質量保存則を組み合わせて逆解析する枠組みを作り、烏東徳ダム貯水池の地すべりに適用した（抄録）。", "p2": "大規模貯水池ではボーリングや物理探査ですべり面の深さと体積を測るのが難しい。質量保存だけの逆解析は不良設定で、幾何学的方法だけでは単純化しすぎる（抄録、§5.1）。", "p3": "地形で拘束した準3次元の変位を視線方向の変位から再構成し、準定常期の幾何学的なすべり面を基準に、空間的に変わるレオロジー係数を点ごとに較正する。これにより累積の積分誤差なしに質量保存式を解き、静的な幾何に固定された時系列のすべり面厚さを得る（抄録）。", "p4": "下降軌道で19,354点の計測点を得て（§4.1）、3次元変位をGNSSと比較し、体積を既往文献の値と比べた（抄録、§4.3）。", "p5": "28の活動地すべりを特定し、すべり面の深さは15〜85 m、GNSSとの3次元変位のRMSEは鉛直7.8 mm、東西4.2 mm、南北2.4 mmだった（§6）。急速な水位低下が加速の主因で、低下からピークの加速まで2〜4か月の遅れがあった（§6）。", "p6": "著者は、単一のすべり面に沿う斜面平行運動の仮定、急峻な植生地での干渉性の低下、準定常期に依存する較正を限界として挙げている（§5.4）。金坪子地すべりの体積は抄録で約6.25×10⁷ m³、本文で約6.25×10⁸ m³と記載が食い違う（抄録、§4.3、§6）。", "fun": "人工衛星から地面のわずかな動きをミリ単位で測り、「表面がこう動くなら、地下の滑り面はこの深さのはず」と逆算しました。砂山が崩れるとき、動いた土の量は保存されるという中学理科のような原理で、見えない地下の形を描き出す点が面白いところです。", "unverified": "体積の桁（10⁷か10⁸か）は原文の記載が食い違っており未確認。すべり面の深さの検証方法（現地データとの比較）の詳細は読んでいない。"}}, {"id": "pr13", "rank": 13, "headline": "既存評価の表示が口コミ評価を非対称に引下げ", "title": "Social influence in online reviews : evidence from the steam store", "url": "https://doi.org/10.82444/warw.33889162", "authors": "Adam Di Lizia", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Di Lizia, A. (2024). Social influence in online reviews : evidence from the steam store (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33889162", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ（DataCite登録、CAGE Discussion Paper 714）の抄録を使用。本文は取得できず", "preprint": true, "p1": "ゲーム配信サイトSteamの2019年のレビュー表示の変更を利用し、既存の平均評価が新しいレビューを引きずる「社会的影響」と、その非対称性を示した（抄録）。", "p2": "消費者の評価は製品の質だけでなく、他人の評価にも影響されうる。その大きさと、売り手・買い手への含意は十分に分かっていなかった（抄録）。", "p3": "過去の評価への露出を減らしたレビュー方式の変更の前後で、平均評価がレビューの肯定確率に与える影響を比べ、所有者数の推定値を使ったゲーム選択の構造モデルで価格換算した（抄録）。", "p4": "基準は平均評価10%上昇あたりの肯定レビュー確率の変化で、選択の影響や代替的な定式化への頑健性も確かめた（抄録）。", "p5": "平均評価10%の上昇は肯定レビューの確率を変更前に5.4%、変更後は2.8%だけ上げた。影響は非対称で、低い平均評価を見ると否定的になるが、高い評価には反応しなかった。効果は経験の浅い利用者が主に担い、評価1%の上昇は2.5ドルの値下げに相当した（抄録）。", "p6": "リポジトリへの新規登録で、元の公表年は記録からは確認できない。対象はゲームの1プラットフォームで、他の商品カテゴリへの一般化は未確認。", "fun": "評価が低いゲームを見ると、人は自分のレビューもつい厳しくしがちですが、評価が高くても甘くはならない――この片寄りのせいで、評価の低いゲームはますます低く見えるようになります。表示の仕方を変えた日を境に比べる、自然実験の工夫も面白いところです。", "unverified": "本文が読めず、識別の詳細と構造モデルの仕様は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "主観的幸福度PWIのオンライン基準値を推定", "title": "Normative values and cut-points for online administration of the Personal Wellbeing Index: A nationally representative study of Australian adults", "url": "https://doi.org/10.21203/rs.3.rs-10658892/v1", "authors": "Sarah P. H. Khor ほか", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "Khor, S. P. H., Frykberg, G., Capic, T., Ward, A. C., Fuller-Tyszkiewicz, M., Iasiello, M., Cummins, R. A., Davey, R., Kennedy, M., Hutchinson, D., Olsson, C. A., & Lycett, K. (2026). Normative values and cut-points for online administration of the Personal Wellbeing Index: A nationally representative study of Australian adults. https://doi.org/10.21203/rs.3.rs-10658892/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリント本文（HTML）の抄録、対象と測定、分析、カットポイントの結果、考察と限界を読んだ", "preprint": true, "p1": "主観的幸福度の尺度PWI（Personal Wellbeing Index）について、オンライン実施での豪州の母集団基準値と、「低い」「要注意」の個人のカットポイントを、約1万人の全国代表データで定めた（抄録）。", "p2": "PWIの母集団基準は無作為の電話調査から推定されてきたが、調査はほぼオンラインに移っており、実施方式の違いを反映した新しい基準が必要だった。オンラインの基準は英国の2,000人規模の小標本しかなかった（序論、抄録）。", "p3": "PWIは生活水準・健康・達成・人間関係・安全・地域とのつながり・将来の安心の7領域の満足（0〜10）の平均を0〜100に換算する（§Measures）。基準値は加重平均のブートストラップ95%CIで、カットポイントはDASS-21の抑うつ尺度で高い苦痛を見分けるROC分析とYouden指数で決めた（§Data analysis）。", "p4": "2025年6月の確率抽出オンラインパネル（Life in Australia、7,908人）と若年層を補う非確率パネル（2,138人）のうち、オンライン回答の9,948人を人口統計で重み付けした。良さの基準は抑うつの判別のAUCと、陽性・陰性的中率である（§Study design、§Weighting）。", "p5": "加重平均PWIは67.1（95%CI 65.8〜68.4）で、従来の電話の基準（74.1〜76.8）より低かった（抄録、考察）。抑うつの判別のAUCは0.79〜0.93で、50点以下を「低い」（陰性的中率96.0%、陽性的中率37.6%）、50〜65点を「要注意」とした。幸福度が低いのに抑うつのない人が8.8%、幸福度は保たれ抑うつのある人が3.4%いた（表3、抄録）。", "p6": "著者は、18〜34歳で非確率標本への依存が大きいことによる選択バイアス、先住民の幸福観が尺度に含まれないこと、抑うつが臨床面接ではなく自己報告であることを限界としている（§Limitations）。", "fun": "「幸せですか」を数値で測る尺度は、電話で聞くかネットで聞くかで点数が変わります。オンラインで測り直すと全体が7点ほど低く出ました。また、幸福度が低くても落ち込んではいない人や、その逆の人がいることから、「幸せ」と「心の病気でない」は別の物差しだと示した点が面白いところです。", "unverified": "補足資料（不安・ストレス尺度の結果）は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "LLM審査員の判定は温度0でも揺れる", "title": "All Verdicts are Not Equal: Rethinking LLM Judge Reliability", "url": "https://arxiv.org/abs/2610.12083", "authors": "Vineet Kumar ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Kumar, V., Rathore, D., & Moitra, A. (2026). All Verdicts are Not Equal: Rethinking LLM Judge Reliability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12083", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化の§3.5、実験設計の§4、結果の§5.1–5.2、結論と限界）を読んだ。表1の全セルと付録は読んでいない", "preprint": true, "p1": "LLMを審査員にする評価（LLM-as-a-Judge）の信頼性を大規模に監査し、判定が「再現でき、提示順を入れ替えても変わらず、正しい」同時確率である信頼できる判定率Tを定義して、位置バイアスによる精度の上限を導いた（抄録、§3.5）。", "p2": "LLM審査員はNLP評価の標準になり、決定的な正解のように扱われているが、その体系的な信頼性はよく分かっていなかった（抄録、§1）。", "p3": "T = C·(A − φq) と分解する。Cは再標本化に対する安定性、φは候補の順序を入れ替えたとき判定が反転する率、Aは精度で、q = 1/2 なら T = C·(A − φ/2)（式4）。ここから、反転率φの審査員の観測精度は 1 − φ/2 を超えられないという上限が出る（式3、§3.4–3.5）。", "p4": "6モデル（GPT-5.2、GPT-4o、Gemini-2.5-Pro、Gemini-2.0-Flash、Claude-Sonnet-4.6、Llama-3.3-70B）を、MT-Bench、AlpacaFarm、JudgeBench、LLMBarの4ベンチマーク、5つの出力形式、2つの提示順、3つの温度、各10回の反復で評価した（§4）。", "p5": "図1（横軸：反転率φ、縦軸：精度、破線が上限）で多くの点が上限付近にあり、Gemini-2.0-FlashのXML形式ではJudgeBenchでφ = 98.0%、精度51.0%と上限に一致し、C = 100%でもT = 2.0%だった（§5.1）。同じGemini-2.5-Proでも形式の変更で A = 63.5%、T = 28.9% から A = 88.5%、T = 77.5% に変わった（§5.2）。ルーブリック採点への移行が単一の形式変更より信頼性を高めた（抄録）。", "p6": "著者は、英語の4ベンチマークに限られること、内部の確率を見られない閉じたモデルであること、ペア比較だけを扱ったことを限界としている（§Limitations）。仮定A2（軸の独立）は実際には成り立たない場合があり、そのときTは保守的な下限として振る舞うとしている（§3.5）。", "fun": "毎回まったく同じ答えを返すAIの審査員は、一見とても信頼できそうです。ところが実は「先に出された方を勝ちにする」癖で同じ答えを繰り返しているだけで、正解率はコイン投げ並みでした。一貫していることと正しいことは別だ、と数式で切り分けた点が面白いところです。", "unverified": "表1の全モデル・全形式の数値と、温度を変えた結果は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "因果効果を保つ表形式データの拡散生成", "title": "Beyond Distributional Fidelity: Causal-Penalized Diffusion for Synthetic Tabular Data", "url": "https://arxiv.org/abs/2610.11407", "authors": "Lan Tao ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Tao, L., He, Y., Xu, S., Ouyang, Y., & Cheng, G. (2026). Beyond Distributional Fidelity: Causal-Penalized Diffusion for Synthetic Tabular Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11407", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "合成した表形式データが元データと分布が似ていても因果効果まで保たれるとは限らないことを理論で示し、生成モデルの学習に因果のずれへの罰則を加える方法を提案した（抄録）。", "p3": "目標とする推定量について実データと合成データから得る推論分布のずれを「因果的忠実度」と定義し、TabDDPM（表形式の拡散モデル）の目的関数に因果のずれの罰則項を加え、方策勾配型の推定量で最適化する（抄録）。", "p5": "処置効果の各種シミュレーションと2つのベンチマークデータで、統計的な忠実度を大きく損なわずに因果的忠実度を改善できるかを評価したとある。具体的な数値は抄録にない（抄録）。", "fun": "本物そっくりの偽データを作れても、「薬が効くか」のような因果の答えまで同じになるとは限りません。見た目の統計が似ていることと、原因と結果の関係が保たれることは別物だと理論で示し、その差を学習中に直接減らそうとした点が面白いところです。", "unverified": "改善の大きさ、使ったデータセット名、統計的忠実度への影響の数値は抄録になく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "時系列依存を分離するVAEで信用リスク予測", "title": "DTD-VAE: Disentangled Temporal Dependencies VAE for Credit Risk Prediction", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.26473", "authors": "Xiaobo Guo ほか", "venue": "RePEc NEP", "date": "2026-09-21", "apa": "Guo, X., Dong, L.-an, Wang, Y., Zhang, P., Zhi, C., & Li, Y. (2026). DTD-VAE: Disentangled Temporal Dependencies VAE for Credit Risk Prediction (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2608.26473", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された抄録を使用", "preprint": true, "short": true, "p1": "顧客データの時間的な依存関係から、信用リスクに関わる特徴と一般的な好みを表す特徴を分けて学習する変分オートエンコーダ（VAE）DTD-VAEを提案した（抄録）。", "p3": "推論側に潜在変数間の時間依存を自己回帰で学ぶ仕組みを置き、生成側では要素ごとのゲートで各専門家モデルの次元に独立の重みを与えて、信用リスク関連の潜在変数を細かく分離する（抄録）。", "p5": "6つの実データで既存手法を一貫して上回り、ROC-AUCで3.2〜4.86%、Accuracy Ratioで6.41〜9.71%の改善を得たと報告している（抄録）。", "fun": "銀行の取引履歴には「この人は返済が危ない」という兆しと、「ただ旅行が好き」という好みの両方が混ざっています。時間の流れの中でこの2つをAIに見分けさせ、危険の兆しだけを取り出そうとする発想が面白い点です。", "unverified": "6つのデータの内容と比較手法の名前は抄録になく未確認。"}}, {"id": "pr18", "rank": 18, "headline": "政府調達を狙う大手監査法人の独立性", "title": "Government Procurement and Independent Gatekeepers: Evidence from Big 4 Auditors", "url": "https://doi.org/10.2139/ssrn.7589585", "authors": "Alice Lee ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Lee, A., Li, M., Mehta, M. N., & Park, H. J. (2026). Government Procurement and Independent Gatekeepers: Evidence from Big 4 Auditors. https://doi.org/10.2139/ssrn.7589585", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "大手4監査法人が連邦政府の調達契約を争う時期に、政治家が株を持つ顧客企業への監査が甘くなることを示した（抄録）。", "p3": "大手監査法人への大型調達契約の授与時期がずれることを利用し、政治家の個人保有株がある顧客企業の監査結果（後の財務諸表の修正再表示、不利な監査意見）を比べた（抄録）。", "p5": "入札期間中は政治的つながりのある顧客で後の修正再表示が起きやすく、不利な監査意見が少なかった。一方、短期保有や選挙区型のつながりの顧客には監査が厳しくなった（抄録）。", "fun": "監査法人は会社の帳簿を厳しくチェックする番人ですが、同時に政府から大きな仕事をもらいたい立場でもあります。その仕事を左右する政治家が株を持つ会社には、つい甘くなるのではないか――番人にも利害があるという身近な問題を、契約の時期のずれを使って確かめた点が面白いところです。", "unverified": "標本の規模、期間、効果の大きさは抄録になく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "財務部門のAI人材が業績予想の質を上げる", "title": "Where AI Sits Matters: AI Human Capital in Finance and Accounting Function and Management Guidance Quality", "url": "https://doi.org/10.2139/ssrn.7585398", "authors": "Jongha Lim ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Lim, J., Choi, W., & Kim, C. (2026). Where AI Sits Matters: AI Human Capital in Finance and Accounting Function and Management Guidance Quality. https://doi.org/10.2139/ssrn.7585398", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "財務・経理部門にAI人材を置く企業ほど、経営者の業績予想が正確で精密になることを示した（抄録）。", "p3": "個人の職歴データから財務・経理部門のAI人材を測る指標を作り、2016〜2024年の米上場959社・4,814社年の業績予想の精度と精密さを比べた（抄録）。", "p5": "AI人材を持つ企業の予想はより正確・精密で、効果は全社のAI投資ではなく財務・経理部門に固有だった。不確実性の高い企業で改善が大きく、アナリスト予想のばらつきも下がった（抄録）。", "fun": "会社がAIに投資したかどうかより、「どの部署にAIに詳しい人を置いたか」が大事だという結論です。同じAIでも、数字を扱う経理の現場にいると予想の当たり方が変わるという、配置の効果を職歴データから測った点が面白いところです。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pr20", "rank": 20, "headline": "ベイズPINNの合流点バイアスを特定し修正", "title": "Uncovering and Fixing Collider Bias in Bayesian PINNs", "url": "https://arxiv.org/abs/2610.11737", "authors": "Michael Obermayr ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Obermayr, M., & Peharz, R. (2026). Uncovering and Fixing Collider Bias in Bayesian PINNs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11737", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ベイズ物理情報ニューラルネット（B-PINN）の一般的な定式化が物理パラメータの事後分布に系統的な偏りを生むことを示し、偏りのない連鎖型の定式化を提案した（抄録）。", "p3": "B-PINNは物理パラメータと軌道パラメータを事前に独立とし、微分方程式の残差の仮想尤度で結びつける「合流点（collider）」構造をとる。これを物理→軌道→観測の階層連鎖モデルに置き換え、確率動力学を離散化して粒子MCMCで厳密にサンプリングする（抄録）。", "p5": "事前分布が真値に中心を置いていても事後分布が真値から離れる偏りを確認し、偏りの2つの機構と大きさの近似式、標準的B-PINNが信頼できる条件の診断基準を示した。連鎖型は偏りを避けた（抄録）。", "fun": "物理法則を組み込んだAIで未知のパラメータを推定すると、正解の近くから始めても答えがずれていくことがある――その原因は「どちらも同じ結果に影響する2つの要因を独立と仮定する」統計の落とし穴でした。因果推論で知られる合流点バイアスが、物理計算の中にも潜んでいたという発見が面白いところです。", "unverified": "実験で使った方程式の種類と偏りの数値は抄録になく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "単調NNで地震時の斜面永久変位を確率評価", "title": "A Monotonic Neural Network-Based Permanent Sliding-Displacement Model for Probabilistic Earthquake-Induced Landslide Hazard Assessment in Nepal", "url": "https://doi.org/10.2139/ssrn.7589457", "authors": "Yellapragada Meenakshi ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Meenakshi, Y., Raghukanth, S. T. G., & He, Q. (2026). A Monotonic Neural Network-Based Permanent Sliding-Displacement Model for Probabilistic Earthquake-Induced Landslide Hazard Assessment in Nepal. https://doi.org/10.2139/ssrn.7589457", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地震時の斜面の永久すべり変位を単調性を保つニューラルネットで予測し、確率論的地震ハザード解析と組み合わせてネパールの地震誘発地すべりハザード図を作った（抄録）。", "p3": "NGA-West2とインド・ヒマラヤの強震記録で、規模・距離・地盤・限界加速度比から変位を予測するモデル（物理的に単調な関係を強制）を学習し、物理制約付き機械学習の降伏加速度と組み合わせ、再現期間ごとの変位をブートストラップのアンサンブル感受性モデルに入れた（抄録）。", "p5": "変位モデルのR²は約0.90。地形と変位による感受性モデルのROC–AUCは無作為・空間交差検証で0.889と0.788で、地形・PGA・変位のモデルと同等だった（抄録）。", "fun": "地震で斜面がどれだけずれるかは、揺れが強いほど・斜面が弱いほど大きくなるはずです。AIに自由に学ばせるとこの当たり前の向きが崩れることがありますが、「増えるはずのものは必ず増える」という制約を組み込んで、物理として筋の通った予測にした点が面白いところです。", "unverified": "ハザード図の地域別の結果は抄録になく未確認。"}}, {"id": "pr22", "rank": 22, "headline": "ローカルLLMで専門度に応じ質問を変える面接", "title": "Evidence-Traceable Dynamic Interviewer Architecture for Expertise-Adaptive Qualitative Interviews Using Local LLMs", "url": "https://arxiv.org/abs/2610.11651", "authors": "Aisvarya Adeseye ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Adeseye, A., Isoaho, J., Adeseye, A., Virtanen, S., & Tahir, M. (2026). Evidence-Traceable Dynamic Interviewer Architecture for Expertise-Adaptive Qualitative Interviews Using Local LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11651", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "手元で動かすLLMで、回答者の専門度を実時間で推定し質問の深さを変える質的面接システムを作り、246人で評価した（抄録）。", "p3": "5つのモジュールからなるプロンプト駆動の構成と、面接状態の記録を持ち、専門度の推定、専門度に合った質問の生成、つなぎの発話を行う（抄録）。", "p5": "専門度推定は自己申告と78.9%一致し、重み付きκは0.80だった。参加者の評価は関連性4.41、没入4.32、満足4.38（平均）だった（抄録）。", "fun": "インタビューでは、詳しい人には深い質問を、初心者には基本的な質問をするのが上手な聞き手です。AIの聞き手が会話の途中で相手の知識の量を見積もり、質問の難しさを変えていけるかを、実際に246人と話して確かめた点が面白いところです。", "unverified": "使用したLLMの種類と比較対象の有無は抄録になく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "マルチエージェントLLMの失敗原因を誤差伝播で特定", "title": "Error-Propagation Modeling for Failure Attribution in LLM-Based Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.11600", "authors": "Jiaqi Liao ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Liao, J., Zhai, Y., Liu, H., Zhang, X., Zhuang, Z., Feng, D., Ding, B., & Wang, H. (2026). Error-Propagation Modeling for Failure Attribution in LLM-Based Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11600", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェントシステムが失敗したとき、どのエージェントのどの手順の誤りが決定的だったかを、誤りの伝播を明示的にモデル化して特定する方法EMFAを提案した（抄録）。", "p3": "失敗した軌跡を構造化し、誤りの連鎖的な伝播と未解決のループの持続をモデル化したうえで、候補を絞り込み、反実仮想の検証で「直せば成功する」エージェントと手順の組を同定する（抄録）。", "p5": "Who&Whenベンチマークで手順レベルの帰属精度が最高となり、従来の最良値を手作り・アルゴリズム生成の部分集合でそれぞれ3.45と4.40ポイント上回った（抄録）。", "fun": "チームで失敗したとき、最後に目立つミスをした人が本当の原因とは限りません。最初の小さな誤りが次々に伝わって大きな失敗になることがあるからです。AIの「チーム」でも同じで、誤りの伝わり方をたどって真犯人を見つけようとする点が面白いところです。", "unverified": "エージェントレベルの精度の数値は抄録になく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "組織行動論の視点でAIエージェントの安全を説明", "title": "Workerville: Towards an Organizational Behavior Account of Agent Safety", "url": "https://arxiv.org/abs/2610.11561", "authors": "Hanjun Luo ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Luo, H., Mao, J., Lu, Y., Zhang, H., Huang, Z., Chen, Y., Salam, H., & Liu, X. (2026). Workerville: Towards an Organizational Behavior Account of Agent Safety (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11561", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "組織行動論の非生産的職務行動（CWB）をAIエージェントの安全性に当てはめ、組織の条件を操作するベンチマークWorkervilleを作った（抄録）。", "p3": "上司との縦の関係、同僚の規範、内部の認知構造という3つの組織的先行要因を、無断開示・破壊的操作・成果の逸脱という3つの結果に対応づけ、16の組織条件×210課題で3,360の課題を作り、6つのLLMを評価した（抄録）。", "p5": "否定的な先行要因は組み合わせると単調でない増幅を示し、無断開示の率は否定的要因なしの16.5%から2つで60.1%に上がり、3つで50.3%に下がった。エージェントは人間のCWB研究が予測する典型的な行動を再現した（抄録）。", "fun": "人間の職場で、上司の圧力や同僚の悪いノリが不正を招くことは組織行動論でよく知られています。同じ見方でAIエージェントを「職場の一員」として調べると、悪条件が重なったときに情報漏えいが大きく増えた――人間の組織の理論がAIの安全にも使えるという発想が面白いところです。", "unverified": "モデル別の結果は抄録になく未確認。"}}, {"id": "pr25", "rank": 25, "headline": "従業員困窮基金は職場統治の一形態", "title": "Private Welfare as Workplace Governance:&nbsp;Evidence from Employee Hardship Funds", "url": "https://doi.org/10.2139/ssrn.7585038", "authors": "John Stephen Ahlquist", "venue": "SSRN", "date": "2026-10-08", "apa": "Ahlquist, J. S. (2026). Private Welfare as Workplace Governance:&nbsp;Evidence from Employee Hardship Funds. https://doi.org/10.2139/ssrn.7585038", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "米大企業が運営する従業員困窮基金（緊急の現金給付）を、労働者がどう受け止め、労働組合への態度がどう変わるかを3つの事前登録研究で初めて体系的に調べた（抄録）。", "p3": "小売業の労働者の全国調査と、Home DepotとWalmartでの調査実験で、基金についての現実的なメッセージが組合投票の意向や仕事への愛着、経済的な安心感に与える影響を測った（抄録）。", "p5": "自社の基金を認識していたのは4人に1人未満だった。メッセージは経済的な安心感を高めずに組合投票の意向を動かし、手厚い基金のHome Depotでは組合への関心が下がり、控えめなWalmartでは逆に組合への反対が弱まった（抄録）。", "fun": "会社が困った社員にお金を出す制度は良いことに見えますが、その原資の多くは社員自身の寄付です。そして制度の宣伝は社員の安心感を高めないまま、労働組合への気持ちだけを動かしていた――福祉が職場の力関係の道具にもなりうることを示した点が面白いところです。", "unverified": "各研究の標本数と効果の大きさは抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "チリの持家補助は住宅の質と立地で限界", "title": "When Owning a Home Is Not Enough: The Promises and Pitfalls of Subsidized Homeownership in Chile", "url": "https://doi.org/10.2139/ssrn.7589563", "authors": "Diego Gil Mc Cawley", "venue": "SSRN", "date": "2026-10-09", "apa": "Gil Mc Cawley, D. (2026). When Owning a Home Is Not Enough: The Promises and Pitfalls of Subsidized Homeownership in Chile. https://doi.org/10.2139/ssrn.7589563", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "成功例とされるチリの持家補助政策が、立地や社会関係を見落としたために新たな排除を生んだ面があることを、制度の歴史と影響から論じた書籍の章である（抄録）。", "p3": "軍政期の市場型改革に始まり民政下でも続いた住宅政策の制度的基盤と変化を、学術文献、行政データ、政策文書の分析で検討した（抄録）。", "p5": "低所得世帯の正規住宅への移転は必ずしも生活の質を高めず、新たな排除を生みうるとし、立地、社会関係資本、居住移動、継続的な国の支援が真の社会的包摂に不可欠だと結論した（抄録）。", "fun": "家を持てれば生活は安定するはず――ところが、遠くの安い土地に家を建てると、仕事や友人、近所づきあいから切り離されてしまうことがあります。「家」だけでなく「どこに住むか」「誰とつながるか」が暮らしを決めるという、住宅政策の盲点を示した点が面白いところです。", "unverified": "行政データの具体的な分析内容と数値は抄録になく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "名誉の文化が反社会的罰を強める多国実験", "title": "The Cultural Logic of Honor and Antisocial Punishment in Social Dilemmas: A Multi-Lab Study Across Three World Regions", "url": "https://doi.org/10.31234/osf.io/2uc7t_v2", "authors": "Shuxian Jin ほか", "venue": "PsyArXiv", "date": "2026-10-09", "apa": "Jin, S., Rabie, D., Lee, J., Na, J., Miniesy, R., Vignoles, V. L., & Uskul, A. K. (2026). The Cultural Logic of Honor and Antisocial Punishment in Social Dilemmas: A Multi-Lab Study Across Three World Regions. https://doi.org/10.31234/osf.io/2uc7t_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "名誉を重んじる文化が、協力者を罰する「反社会的罰」を強めるかを3地域の事前登録の多拠点実験で検証した（抄録）。", "p3": "エジプト（266人）、韓国（212人）、英国（192人）で、罰ありとなしの公共財ゲームを行い、個人の名誉の価値観・規範と反社会的罰、報復の関係を調べた（抄録）。", "p5": "反社会的罰はエジプトの標本で高かったが、個人の名誉の価値観・規範とは3標本とも関連しなかった。ただし名誉の価値観が強い人は、不当に罰された後に協力者への報復を強めた（抄録）。", "fun": "みんなのために協力した人をわざわざ罰する行動は、一見不合理です。名誉の文化が原因だと考えられてきましたが、実験では名誉そのものが攻撃を促すのではなく、「不当な扱いを受けた後に仕返しするかどうか」を左右していた――文化の働き方を細かく見分けた点が面白いところです。", "unverified": "罰の水準の数値は抄録になく未確認。"}}, {"id": "pr28", "rank": 28, "headline": "インドの舗装道路整備が母子の医療利用を改善", "title": "Paved Roads, Better Healthcare? Evidence for Women and Children from Rural India", "url": "https://doi.org/10.2139/ssrn.7574959", "authors": "Xinyueh Tang", "venue": "SSRN", "date": "2026-10-09", "apa": "Tang, X. (2026). Paved Roads, Better Healthcare? Evidence for Women and Children from Rural India. https://doi.org/10.2139/ssrn.7574959", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドの農村道路整備事業（PMGSY）で新しく舗装道路が通った集落で、女性と子どもの医療の認知・利用が高まったことを示した（抄録）。", "p3": "舗装道路のなかった集落に住む母親76,877人の位置情報付きデータとSHRUGの道路建設データを結合し、集落の人口規模を道路建設の操作変数とするファジー回帰不連続デザインで推定した（抄録）。", "p5": "新しい道路は医療の認知と利用を高め、受診の障壁を減らした。効果は自家用の交通手段を持つ世帯や、道路が通ってからの期間が長い地域で大きかった（抄録）。", "fun": "「人口が一定数を超えた集落から道路を作る」という行政のルールがあると、境目のすぐ上と下の集落はよく似ているのに道路の有無だけが違います。この偶然を使って、道路が病院へ行きやすさを本当に変えたのかを確かめた点が面白いところです。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pr29", "rank": 29, "headline": "自動更新契約が固定電話の乗換え費用を高めた", "title": "The impact of \"rollover\" contracts on switching costs in the UK voice market : evidence from disaggregate customer billing data", "url": "https://doi.org/10.82444/warw.33660049", "authors": "Gregory S. Crawford ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Crawford, G. S., Tosini, N., & Waehrer, K. (2011). The impact of \"rollover\" contracts on switching costs in the UK voice market : evidence from disaggregate customer billing data (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33660049", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "英BTが2008年に導入した自動更新（ロールオーバー）契約が、固定電話の乗換えを大きく抑えたことを顧客の請求データで示した（抄録）。", "p3": "12か月の最低契約期間と解約金を伴う自動更新契約について、個別の請求データで、在籍期間・ブロードバンド購入・値引き・自己選択を統制して乗換え行動を比べた（抄録）。", "p5": "自動更新の世帯は最初の契約期間後の乗換えが、標準プランより34.8%、固定期間契約より54.8%少なかった。これは月額料金の平均の33.0%に相当する乗換え費用だと推定した（抄録）。", "fun": "何もしなければ自動で契約が続き、やめるには違約金がかかる――身近なスマホやサブスクにもある仕組みです。この仕組みが乗換えをどれだけ妨げるかを、実際の請求データから「月額料金の3分の1」という具体的な費用に換算した点が面白いところです。", "unverified": "公開年と掲載誌はリポジトリの記録からは確認できず、旧稿の可能性がある。"}}, {"id": "pr30", "rank": 30, "headline": "相対的孤立度で異常検知を改良するRIFT", "title": "RIFT: Relative Isolation From Trees For Anomaly Detection", "url": "https://arxiv.org/abs/2610.12244", "authors": "Mark Daniel Szalai ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Szalai, M. D., & Horvath, G. (2026). RIFT: Relative Isolation From Trees For Anomaly Detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12244", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "孤立森（Isolation Forest）の無限本の極限の式を幾何学的に解釈し、最小全域木から決定的に異常度を計算する方法RIFTを提案した（抄録）。", "p3": "データの最小全域木を作り、各点から見た木の辺の「見かけの大きさ」の和を異常度とする。1次元では孤立森の極限式と一致し、高次元ではパラメータなしの一般化になる。大規模データ向けのアンサンブル版も示す（抄録）。", "p5": "合成データとADBenchで精度は孤立森と同程度で、アンサンブル版は乱数の種による結果のばらつきが大きく下がった（抄録）。", "fun": "「仲間から離れている点ほど怪しい」という直観を、木の枝を何本切れば孤立するかで測るのが孤立森です。その乱数頼みの手続きの極限を、点どうしを最短でつなぐ木の形から一発で計算できるようにした、確率の手法を幾何に置き換えた点が面白いところです。", "unverified": "精度の具体的な数値は抄録になく未確認。"}}, {"id": "pr31", "rank": 31, "headline": "合成グラフだけで汎用グラフ異常検知を学習", "title": "Is Real-World Training Data Necessary for Generalist Graph Anomaly Detection?", "url": "https://arxiv.org/abs/2610.12167", "authors": "Yujing Liu ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Liu, Y., Liu, Y., Tan, Y., Cao, X., Liew, A. W.-C., Shen, H. T., & Pan, S. (2026). Is Real-World Training Data Necessary for Generalist Graph Anomaly Detection? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12167", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "汎用のグラフ異常検知モデルを、実データではなく自動合成した異常グラフで学習できるかを調べ、合成データ生成器AG-FORGEと検知モデルTS-GGADを提案した（抄録）。", "p3": "異常グラフを自動合成するAG-FORGEで学習データを作り、位相（つながり方）と意味（属性）の両面の異常の証拠を捉えるTS-GGADを、大規模合成学習向けのカリキュラム学習で訓練した（抄録）。", "p5": "合成データでの学習は実データでの学習と同程度の性能に達し、AG-FORGEのデータで学習したTS-GGADは14の実データで最先端手法を大きく上回ったと報告している（抄録）。", "fun": "不正や異常の実例は少なく、集めるのも大変です。それなら異常を「作って」学ばせればよいのでは、という発想を試し、作ったデータだけでも本物で学んだのと同じくらいの力がつくことを示した点が面白いところです。", "unverified": "改善の大きさの数値と、使った14のデータ名は抄録になく未確認。"}}, {"id": "pr32", "rank": 32, "headline": "少数センサからプラズマの多尺度動態を再構成", "title": "Reconstruction of Multiscale Plasma Dynamics Across Operating Regimes", "url": "https://arxiv.org/abs/2610.11004", "authors": "Maryam Reza ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Reza, M., & Faraji, F. (2026). Reconstruction of Multiscale Plasma Dynamics Across Operating Regimes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11004", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "少数のセンサの時系列から、運転条件によって変わるプラズマの多尺度の空間場を再構成するネットワークReMAINを提案した（抄録）。", "p3": "既存のSHRED（浅い再帰デコーダ）の時間方向の再帰符号化を残し、デコーダを、再帰状態で特徴ごとに線形変調（FiLM）するU-Netに置き換えた。運転条件も埋め込むパラメトリック版を持つ（抄録）。", "p5": "6つの1次元非線形偏微分方程式で、未知の軌道での再構成誤差をSHREDより下げ、鋭い遷移や局所極値を忠実に再現した。E×Bプラズマでは学習に使わなかった電場強度でも、状態と運転条件に依存する動態を復元した（抄録）。", "fun": "体温計を数本刺しただけで部屋全体の温度分布を当てるような問題です。センサの記録の「時間の流れ」を手がかりに、細かい模様から大きな模様まで段階的に描き直し、学習していない条件にも対応させた点が面白いところです。", "unverified": "誤差の改善幅の数値は抄録になく未確認。"}}, {"id": "pr33", "rank": 33, "headline": "残差に応じ基底を適応する物理情報ELM", "title": "AB-PIELMs: Adaptive-Basis Physics-Informed Extreme Learning Machines for Residual-Driven Domain Decomposition", "url": "https://arxiv.org/abs/2610.11673", "authors": "Aldis Daniel ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Daniel, A., Dwivedi, V., & Srinivasan, B. (2026). AB-PIELMs: Adaptive-Basis Physics-Informed Extreme Learning Machines for Residual-Driven Domain Decomposition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11673", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "鋭い勾配や多尺度の解を持つ偏微分方程式に対し、領域分割と基底関数の配置を適応的に決める物理情報付き極限学習機（ELM）AB-PIELMを提案した（抄録）。", "p3": "部分領域の数と位置、放射基底関数の局所性を空間・スペクトルのハイパーパラメータとして同時に最適化し、学習自体は正規方程式による決定的な計算のまま保つ（抄録）。", "p5": "振動関数の近似と特異摂動の移流拡散方程式で、既存のNN・PIELMより大幅に少ないニューロンで広い硬さの範囲にわたり正確な解を得た。疎で雑音のある観測から拡散係数を逆推定することもできた（抄録）。", "fun": "解が急に変わる場所では細かく、なだらかな場所では粗く――人間が計算格子を作るときの知恵を、AIの基底関数の配置に自動で持たせた点が面白いところです。学習した配置を見れば、どこが難しい場所かが読み取れます。", "unverified": "ニューロン数の削減率など具体的な数値は抄録になく未確認。"}}, {"id": "pr34", "rank": 34, "headline": "ラプラス近似と活性部分空間でNNの不確実性", "title": "Scalable AI Uncertainty Quantification via Generalized Laplace Active Subspaces", "url": "https://arxiv.org/abs/2610.11738", "authors": "Wouter N. Edeling ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Edeling, W. N., & Coveney, P. V. (2026). Scalable AI Uncertainty Quantification via Generalized Laplace Active Subspaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11738", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "学習済みニューラルネットの不確実性を、データから選んだ少数の曲率方向だけでラプラス近似する低ランクの方法を提案した（抄録）。", "p3": "経験損失で定義した一般化ベイズ事後分布を、学習済みの重みの周りで曲率の大きい部分空間に限ってガウス近似する。部分空間内の事後分散は閉じた式で得られ、事前分散は経験ベイズで較正する（抄録）。", "p5": "標準のベイズのスケーリングはデータ数に応じて事後分散を縮ませ、弱い曲率の方向まで残す必要を生み、予測区間の整合性を損なった。損失をデータ数で平均するスケーリングは低次元で安定した部分空間と較正された予測区間を与えた（抄録）。", "fun": "巨大なAIの「自信のなさ」を測るには本来膨大な計算が要ります。そこで、答えが敏感に変わる少数の方向だけに注目して見積もる――山の形を急な斜面の向きだけで近似するような工夫で、計算を軽くしつつ信頼区間を整えた点が面白いところです。", "unverified": "評価に使ったデータと被覆率の数値は抄録になく未確認。"}}, {"id": "pr35", "rank": 35, "headline": "車載画像で舗装ひび割れと紛らわしい領域を分離", "title": "SCT-Mamba: A Grid-Level Method for Pavement Crack Recognition and Interference Region Parsing in Complex Road Scenes", "url": "https://doi.org/10.2139/ssrn.7584703", "authors": "Dehu Yu ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Yu, D., Fu, Z., Gai, T., Yang, S., Wang, C., & Lin, J. C.-W. (2026). SCT-Mamba: A Grid-Level Method for Pavement Crack Recognition and Interference Region Parsing in Complex Road Scenes. https://doi.org/10.2139/ssrn.7584703", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "車載カメラの路面画像で、ひび割れを補修跡・路面標示・背景と格子単位で見分ける路面解析モデルSCT-Mambaを提案した（抄録）。", "p3": "InfraCup.AIの20×35格子の注釈を使い、ResNet34の局所特徴、照明に応じたチャネル再較正、方向・拡張畳み込み、視覚状態空間モデルで格子間の文脈を捉え、重み付きFocal Lossと近傍連続性の正則化で不均衡と途切れに対処した（抄録）。", "p5": "テストデータで正解率96.87%、Macro-F1 88.27%を得た（抄録）。", "fun": "道路のひびを自動で見つけたくても、影や補修の跡、白線がひびに見えてしまいます。「ひびは細長く続く」という性質を使い、隣の升目とのつながりも考えて判断させることで、紛らわしいものと区別しようとした点が面白いところです。", "unverified": "既存手法との比較結果は抄録になく未確認。"}}, {"id": "pr36", "rank": 36, "headline": "養育者が子に伝える対立対処の型を類型化", "title": "Patterns of Caregiver-Reported Messages for Managing Conflict Situations: The Role of Supports and Challenges in Relational and Community Contexts", "url": "https://doi.org/10.2139/ssrn.7570452", "authors": "Terri Sullivan, Colleen S. Walsh, Kelly E. O&apos ほか", "venue": "SSRN", "date": "2026-10-08", "apa": "Sullivan, T., Walsh, C. S., O'Connor, K. E., Brown, W., Brown, K., Bishop, D., West, T., Stokes, A., Fontaine, E., & Williams, C. D. (2026). Patterns of Caregiver-Reported Messages for Managing Conflict Situations: The Role of Supports and Challenges in Relational and Community Contexts. https://doi.org/10.2139/ssrn.7570452", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "低所得の都市部に住む黒人の養育者344人が子どもに伝える対立への対処のメッセージを、潜在クラス分析で3つの型に分けた（抄録）。", "p3": "1〜6クラスの潜在クラス分析を行い、適合度と理論から3クラス解を選び、各型と地域の暴力への曝露、トラウマ症状、子の被害の認識、大人の手本の有無などとの関係を比べた（抄録）。", "p5": "型は「組合せ」59%、「積極的対処」30%、「低い」16%。積極的対処と低い型は組合せ型より暴力への曝露やトラウマ症状が低く、地域のつながりの評価は型によって違わなかった（抄録）。", "fun": "けんかになったら立ち向かえと教えるか、身を守って避けろと教えるか――親が子に伝える言葉は、親自身が暮らす地域の危険さを映しています。人を平均でなく「型」に分けて見ることで、地域の暴力と家庭の教えのつながりが見えてくる点が面白いところです。", "unverified": "各型の差の統計量は抄録になく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "接客業の人とAIの協働をスコーピングレビュー", "title": "From Automation to Collaboration: Human–AI Work in Hospitality and Its Implications for Employees, Competencies, Well-Being and Organisational Transformation—A Scoping", "url": "https://doi.org/10.21203/rs.3.rs-10765629/v1", "authors": "Swati Haridas Deshani ほか", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "Deshani, S. H., & Agrawat, P. (2026). From Automation to Collaboration: Human–AI Work in Hospitality and Its Implications for Employees, Competencies, Well-Being and Organisational Transformation—A Scoping. https://doi.org/10.21203/rs.3.rs-10765629/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "宿泊・飲食業での人とAIの協働が、従業員の経験・能力・well-being・仕事の設計・組織変革に与える影響をスコーピングレビューで整理した（抄録）。", "p3": "PRISMA-ScRに沿って候補を集め、重複除去と追加検索を経て104件を適格性で評価し、49件の一次実証研究を統合した（抄録）。", "p5": "代替型から増強型・協働型への移行がみられた。良い結果はジョブ・クラフティング、学習、エンパワメント、エンゲイジメント、悪い結果は雇用不安、テクノストレス、燃え尽き、非人間化、離職意向で、AIへの理解、自律性、課題との適合、信頼、支援などが左右した（抄録）。", "fun": "ホテルや飲食店でAIが入ると、人の仕事は奪われるのか、それとも助けられるのか。49の研究を集めると答えは「両方」で、AIの使い方と職場の支え方しだいで働きがいが増える面と、不安やストレスが増える面が同時に現れる点が面白いところです。", "unverified": "各結果を報告した研究の件数は抄録になく未確認。"}}, {"id": "pr38", "rank": 38, "headline": "LLMに規範を読む力を持たせる設計課題", "title": "Reading the Room: Foundations, Design, and Challenges of Normative Competence in LLMs", "url": "https://arxiv.org/abs/2610.10906", "authors": "Andrea Wynn (Nathan) ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Wynn, A., Satija, H., Seokhyun, Baek, Liu, A., Nalisnick, E., & Hadfield, G. K. (2026). Reading the Room: Foundations, Design, and Challenges of Normative Competence in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10906", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントが、事前学習の知識に頼らず対話だけからコミュニティの規範を見抜けるか（規範的能力）を、合成規範の多エージェント討論で調べた（抄録）。", "p3": "討論への参加が合成された規範で制限される多エージェントのコミュニティ討論を設定し、基本のLLMエージェントと、規範推論のための各種「規範モジュール」を比べた（抄録）。", "p5": "基本のエージェントは規範を学べば正答率が上がる場面でも学ばなかった。規範への従い方は規範の様式とモデルに強く依存し、真の規範に偶然の癖が伴うと、不要な模倣に罰を与えても癖まで無差別に真似した（抄録）。", "fun": "転校先のクラスの暗黙のルールを、人は周りの様子から察します。AIにそれができるかを人工的に作った「変なルール」で試すと、AIは行動の真似は得意でも、何が本当のルールかを見抜けなかった――空気を読む難しさがAIにもあることを示した点が面白いところです。", "unverified": "モデル別の結果の数値は抄録になく未確認。"}}, {"id": "pr39", "rank": 39, "headline": "交渉する多エージェントLLMの無駄な呼出し削減", "title": "Constitutional Gating and Deterministic Recovery for Multi-Agent LLM Negotiation: Ablations Against a Stateful Adversarial Gatekeeper", "url": "https://arxiv.org/abs/2610.11542", "authors": "Masaaki Nakatsu (AO ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Nakatsu, M., & Wang, R. (2026). Constitutional Gating and Deterministic Recovery for Multi-Agent LLM Negotiation: Ablations Against a Stateful Adversarial Gatekeeper (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11542", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "敵対的な交渉相手と交渉する多エージェントLLMで、無駄な呼出しを減らす統制の仕組み（憲章、群の階層、デッドロック回復）を構成要素ごとに比較した（抄録）。", "p3": "5本柱の実行時憲章、4層の群（指揮役・3者多数決・監視役・スキーマ検査）、決定的なデッドロック検出と文脈の消去・定型の回復メッセージを、受理条件が正規表現で固定された相手に対し各構成5回・計30回試した（Gemini 2.5 Pro、相手はClaude Haiku 4.5）（抄録）。", "p5": "憲章と指揮役で受理は0/5から1/5、2/5になった。デッドロックからの脱出はLLMだけでは0/5、文脈消去と定型メッセージでは5/5だった（Fisher p = 0.008）。呼出しとトークン削減の事前登録仮説は支持されなかった（抄録）。", "fun": "正解が分かっている交渉ゲームで、AIのチームがきちんと方針どおりに動けるかを試した実験です。行き詰まったとき、AIに考え直させるより、会話の記録をきっぱり消して決まった文で仕切り直す方がずっと効いた――機械的なリセットの強さが面白いところです。", "unverified": "試行回数が各構成5回と少ない。"}}, {"id": "pr40", "rank": 40, "headline": "液状化後の粒状体が再び骨格を組む過程の模型", "title": "From Liquefaction to Structural Reconstruction in Saturated Granular Materials: Coupled Grain Settlement Upward Water Flow and the Formation of a Densified Structure", "url": "https://doi.org/10.5281/zenodo.23263000", "authors": "Wittig, Manfred H.", "venue": "Zenodo", "date": "2026-10-09", "apa": "Wittig, M. H. (2026). From Liquefaction to Structural Reconstruction in Saturated Granular Materials: Coupled Grain Settlement Upward Water Flow and the Formation of a Densified Structure. Zenodo. https://doi.org/10.5281/ZENODO.23263000", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの作業論文の抄録を使用", "preprint": true, "short": true, "p1": "飽和した粒状体が液状化の後に荷重を支える構造を再び作る過程を、粒子の沈降と間隙水の上昇の連成として記述する理論模型を示した作業論文である（抄録）。", "p3": "再構成済みの層、有限の再構成層、移動する粒子-水混合層、上部の水層の4領域の柱模型を立て、相ごとの保存則でダルシー流束と固定断面の流束を区別し、重力エネルギーの収支を二重計上なしに扱う（抄録）。", "p5": "固体体積の保存から最終沈下量と最終平均間隙率の厳密な関係を導いた。沈下量そのものの決定には接触の幾何や集団運動の追加情報が必要だとしている（抄録）。", "fun": "液状化で泥水のようになった砂は、やがて底から順に固まり直します。砂粒が沈むと同じだけ水が上がる――この当たり前の「つじつま」を丁寧に式にすると、どれだけ沈むかと最後の詰まり具合が一つの関係で結ばれる、という整理が面白いところです。", "unverified": "審査のない置き場の作業論文で、実験や数値計算による検証の有無は抄録からは未確認。"}}, {"id": "pr41", "rank": 41, "headline": "データ不足の信用スコアに外部の順位事前情報", "title": "Ranking Prior Alignment for Credit Risk Modeling: When Do External Priors Matter?", "url": "https://arxiv.org/abs/2610.11146", "authors": "Qiye Lu ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Lu, Q., Ji, J., & Zhang, L. (2026). Ranking Prior Alignment for Credit Risk Modeling: When Do External Priors Matter? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11146", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ラベル付きの債務不履行データが乏しい新商品の信用スコアリングで、専門家・教師モデル・LLMの順位付けの事前知識をKLダイバージェンスで蒸留する枠組みを提案した（抄録）。", "p3": "損失を課題損失と、外部の順位分布とモデルの分布のKLダイバージェンス（重みは指数的に減衰）の和とし、注意機構付きの多インスタンス学習とXGBoostの両方に同じ式で組み込む（抄録）。", "p5": "150万超の加盟店の産業データで、MIL版は3Kバッグで7指標すべてが改善（期間外でAUC最大+0.020）、XGBoost版は300バッグで9指標すべてが改善した。公開のAmexデータでも5/5の分割で改善（平均AUC +0.041）。データ・容量・特徴の質が乏しいほど効果が大きかった（抄録）。", "fun": "新しいローン商品を始めたばかりで返済実績がほとんどないとき、AIは何を頼りに判断すればよいのか。ベテランの勘やほかのAIの「この順に危ない」という意見を、最初は強く、データが増えるにつれて弱く参考にさせる工夫で、データが少ないほど効く点が面白いところです。", "unverified": "なし"}}, {"id": "pr42", "rank": 42, "headline": "政治的分極と心の健康の双方向関係は非対称", "title": "Political polarization and mental wellbeing: asymmetric evidence for bidirectionality", "url": "https://arxiv.org/abs/2610.11601", "authors": "Afrooz Mahir ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Mahir, A., Sharma, S., Kulshrestha, J., Kivelä, M., & Aledavood, T. (2026). Political polarization and mental wellbeing: asymmetric evidence for bidirectionality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11601", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "政治的分極と心の健康・well-beingが互いに影響し合うという双方向の関係について、分野ごとに分かれていた2つの研究群をレビューで比較した（抄録）。", "p3": "分極が心の健康に与える影響と、心の健康が分極に与える影響の2方向の文献を集め、構成概念、測定、分析水準、証拠の強さを評価した（抄録）。", "p5": "分極から心の健康への経路は理論と社会関係の機序に基づく直接的な証拠が多い一方、逆方向は間接的な研究が多く、証拠が非対称だった（抄録）。", "fun": "世の中の分断がストレスを生むのか、それとも心が疲れた人ほど極端な意見に傾くのか。鶏と卵のような問いですが、実は片方向の研究ばかりが進んでいて、もう片方はほとんど確かめられていないことを示した点が面白いところです。", "unverified": "レビューの対象文献数は抄録になく未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "シミュレータと神経レンダラで学習用の世界を生成", "title": "AgentGarten: Code Worlds for Evolving Agents", "url": "https://arxiv.org/abs/2610.12374", "authors": "Jiawei Chi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-09", "apa": "Chi, J., Miao, S., Shi, Z., Wu, K., Wang, H., Chen, W., Dai, Q., Ren, J., Gao, J., Long, M., Duan, Y., Lyu, J., Wu, J., & Liu, F. (2026). AgentGarten: Code Worlds for Evolving Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12374", "why": "物理・規則を保つシミュレータと現実的な見た目のレンダラを結合し、エージェントが学べる対話的な環境を多様に作れるようにした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化の§2、実験の§4、隠れんぼの§5.2、今後の課題の§7）を読んだ。§3の敵対的強制の詳細と付録は読んでいない", "preprint": true, "p1": "状態と規則をプログラム（コード）で持つシミュレータと、その幾何から現実らしい映像を実時間で描く共有のニューラル・レンダラを組み合わせ、エージェントが映像だけを見て学べる環境群「コード世界」を作る枠組みAgentGartenを提案した（抄録、§2）。", "p2": "エージェントが学べることは練習する環境に制約され、環境には状態・規則の一貫性（忠実さ）と現実の見た目（現実性）の両方が要るが、多様な世界でそれを両立するのが難しかった。動画の世界モデルは生成した履歴に状態を持つため誤差が蓄積する（抄録、§2.1）。", "p3": "エンジンがプログラムに従って状態を更新し、深度や法線の構造化条件をレンダラに渡す（式1、2）。状態遷移は描画結果を入力にしないため、描画の誤りが状態に溜まらない（§2.1）。レンダラは事前学習済み動画モデルを幾何条件に適応させ、履歴の前処理を「厳密な再生」で微分可能にする敵対的強制（Adversarial Forcing）で蒸留した（抄録、§3）。", "p4": "H100 1枚、480×832の出力で、長い生成の画質（Self Forcingとの比較）、再生の誤差、推論速度を測り、OpenAIの隠れんぼ研究と同じ課題を、映像だけを見る事前学習済みエージェントで行った（§4、§5.2）。", "p5": "Self Forcingは30秒の生成で反復模様が出て細部が失われたが、提案法は質感を保った（図7）。再生はブロックごとのSDPAで誤差0（ビット一致）、従来法は相対L2誤差3.99%（表1）。描画は毎秒36.5フレームだった（表2）。エージェントは4ラウンドの経験の蒸留で学び、従来の強化学習の数百万エピソードと対照的だった（抄録、§5.2）。", "p6": "著者は、深度・法線だけでは回転対称な物体の回転や材質・色が決まらず、長い遮蔽で属性を失いうること、世界を1つずつ手で作ったことを課題に挙げている（§7）。解釈：4ラウンドと数百万の比較は、事前学習済みの推論型エージェントと一から学ぶ強化学習の比較で、同条件の比較ではない。", "fun": "ゲームの「ルール」はプログラムで正確に動かし、「見た目」だけをAIの動画生成に任せる――役割を分けることで、絵がぼやけても世界のつじつまは崩れません。その世界でAIが隠れんぼを遊び、反省メモを書き足しながら、わずか4回で上達していく様子が面白いところです。", "unverified": "隠れんぼのラウンドごとの勝率などの数値は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "異なるLLM同士の価格競争でも暗黙の談合が生じる", "title": "Who Leads and Who Collects:Algorithmic Collusion in Markets of Heterogeneous Language Models", "url": "https://arxiv.org/abs/2610.11256", "authors": "Jun Yeong Lee", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Lee, J. Y. (2026). Who Leads and Who Collects:Algorithmic Collusion in Markets of Heterogeneous Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11256", "why": "異なる提供元のLLMが混在する市場で価格付けをさせ、談合の程度がモデルごとに大きく異なることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（市場環境とエージェントの§3、成果指標、結論）を読んだ。結果の節の個別の検定値は読んでいない", "preprint": true, "p1": "異なる提供元のLLMが混在する市場で価格付けをさせ、暗黙の談合の程度は市場の構成で平均化されず、価格水準は1つのモデル、安定性は最も不安定なモデル、利得の配分は追随するモデルが決めることを示した（抄録、§6）。", "p2": "価格アルゴリズムが談合する証拠は、すべての売り手が同じアルゴリズムを使う市場から得られていた。実際の市場では異なるアルゴリズムが混在する（抄録）。", "p3": "Calvanoらのロジット需要の差別化ベルトラン市場（品質a = 2、限界費用c = 1、差別化μ = 0.25）を4社に拡張し、ナッシュ価格1.33、共同独占価格2.05を基準にした（§3.1、表1）。各社は最安プランのLLMで、直近20期の価格表と自らの計画・洞察のメモだけを受け取り、通信も需要関数の開示もない（§3.2）。談合指数Δ = (平均利潤 − ナッシュ利潤)/(独占利潤 − ナッシュ利潤) で、0がナッシュ、1が独占（式2）。", "p4": "4モデルの同質・2×2・全混合の11構成を各20回、200期ずつ走らせ、最後の50期で評価した。実行を独立な単位として扱う（§3.3–3.4）。", "p5": "同質市場ではClaudeとGeminiが独占利潤の72〜79%、DeepSeekが24%、GPTは談合せず価格が独占水準を超えて漂った（抄録）。最高値で始めるGeminiを含む市場は構成元より談合的で、全混合市場だけが同質市場の平均より有意に談合が弱かった。GPTが2社いると市場は収束しなかった。混合市場での利得はDeepSeek＞Claude＞Gemini＞GPTの順で、価格を引き上げる側ほど取り分が少なかった（抄録、§6）。", "p6": "著者は、1つのプロンプト・1つの市場・最安プランのみであること、エージェントのメモは機序の証拠ではないこと、モデルの順位は数か月で変わりうることを限界としている（§6）。", "fun": "AIどうしに値段を決めさせると、話し合いもしないのに高値で足並みをそろえることがあります。混ぜれば談合が弱まるかと思いきや、高値を最初に付ける「リーダー」が1社いると全体が高くなり、しかも一番得をするのはリーダーではなく後からついていく側でした。責任の所在を考えると悩ましい点が面白いところです。", "unverified": "構成ごとの検定統計量と信頼区間は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "不正確なマッチングで調整なしの推論が成り立つ条件", "title": "When Does Inexact Matching Ensure Balance and Inference without Adjustment?", "url": "https://arxiv.org/abs/2610.10873", "authors": "Ying Jin", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Jin, Y. (2026). When Does Inexact Matching Ensure Balance and Inference without Adjustment? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10873", "why": "連続共変量での1対1マッチングに残る不均衡の大きさと、それが推論に無視できる条件を理論的に示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結果の予告§1.1、数値実験§5.1の設定、考察）を読んだ。定理の証明（付録A）と表1の数値は読んでいない", "preprint": true, "p1": "連続共変量での1対1・非復元の最適マッチングについて、共変量が3次元以下なら処置群と対照群の不均衡がルートn尺度で無視でき、結果変数を使わない1つのマッチング設計だけで多様な因果推論が妥当になることを示した（抄録、§1.1）。", "p2": "観察研究で各処置単位に別々の対照を割り当てるマッチングは古典的だが、連続共変量ではペアが一致せず偏りが残る。その不均衡の大きさと、推論に無視できる条件は分かっていなかった（抄録）。", "p3": "二次の距離の合計を最小化するマッチングで、1階・2階導関数が有界な滑らかな関数の族全体について、ペア間の平均差の上限が o_P(n^{-1/2}) になることを d ≤ 3 で証明した（式1）。個々のペアの距離は n^{-1/d} の大きさでも、誤差が打ち消し合う。距離行列の推定や近似解も許す（§1.1、考察）。", "p4": "一様分布の共変量、非線形の結果モデル、異質な効果（a = 2）のもとで、n = 500〜5000、d = 1〜6を変え、大域的・貪欲なマッチングとWald・ブートストラップの区間の被覆率を2000回の反復で調べた（§5.1）。", "p5": "d ≤ 3では両マッチング・両区間とも名目95%に近い被覆で、nが増えると差が縮んだ。d = 4、6では標本を増やしても被覆の不足が消えなかった（§5.1、§1.1）。理論でも、d = 4で不均衡が無視できない例、d > 4で支配的になる例を構成し、対の無作為化検定もd = 4で破綻しうることを示した（抄録、§4.2）。", "p6": "結果は二次の目的関数に依存し、通常のマハラノビス距離で同じことが成り立つかは未解決としている（考察）。実務上の含意として、連続共変量が多い場合は次元の削減や結果回帰との併用が必要になる（考察）。", "fun": "似た人どうしをペアにして比べるマッチングは、ペアが完全に一致しなくても、ずれが全体ではうまく打ち消し合います。ところがそれが成り立つのは比べる特徴が3つまでで、4つ以上だと打ち消しが追いつかない――「3次元の壁」がくっきり現れる点が面白いところです。", "unverified": "表1の被覆率の具体的な数値と、付録の証明は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "小さなRCTと大きな観察研究を予測で融合", "title": "Prediction-Powered Data Fusion for Treatment Effect Estimation", "url": "https://arxiv.org/abs/2610.12332", "authors": "Yonghan Jung ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Jung, Y., & Yang, S. (2026). Prediction-Powered Data Fusion for Treatment Effect Estimation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12332", "why": "交絡のある観察データを予測に使い、小規模RCTの処置効果推定の精度を仮定を強めずに高める枠組み。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ATE推定量の§3.1、実験設計の§5.1–5.2、主結果の§5.3、結論）を読んだ。CATEの理論（§4）と証明は読んでいない", "preprint": true, "p1": "小規模なRCTの不偏性を保ったまま、交絡しているかもしれない大規模な観察データ（OBS）から精度だけを借りる融合の枠組みを示し、ATE推定量AIPW-Fusion（閉形式の重みと信頼区間つき）と、CATE学習器DR-Fusion・R-Fusionを作った（抄録、§6）。", "p2": "既存のATE融合法はOBSに仮定を置くか、OBSから十分に力を借りられない。CATEの融合はOBSの非交絡、交絡関数のモデル、偏りと分散の交換のいずれかに頼っていた（抄録）。", "p3": "RCTのAIPW推定量は、OBSで学習した回帰を混ぜた補助回帰（係数λ）を使っても不偏のままである。さらに予測を使った補正（PPI）の制御変量（係数ω）を密度比で移して加える（定義1、式2）。分散はλとωの二次式になり、最適値は λ* = −C/A、ω* = D/B と閉形式で得られる（定理1、式5–6）。", "p4": "OBSの交絡を潜在変数Uで作る合成データと、IHDP・ACIC 2016の半合成ベンチマークで、RCTのみ、PPI++、単純な併合、縮小推定、事前検定、2段階CATE、統合R学習器と比べた。RCTの大きさnは300〜3,000、OBSは15,000行、1,000回の反復（§5.1–5.2）。", "p5": "融合法は45セルすべてでATEのMSEが最小で、RCTのみの0.40〜1.00倍だった（n = 300で0.47〜0.60倍）。被覆率は0.94〜0.96、区間幅はRCTのみの63〜99%だった。単純併合はRCTのみより8.6〜184倍悪かった。CATEではDR-FusionとR-FusionのリスクがRCTのみの0.53〜0.67倍だった（§5.3）。", "p6": "ATEでの改善は試験が小さいときに大きく、n = 3,000では縮んだ（§5.3）。ベンチマークは行を重複抽出する有限母集団設計で、OBSの回帰が実データより有利になりうると著者は注記している（§5.1）。", "fun": "小さなくじ引き実験は正確だけれどぼやけていて、大きな観察データははっきりしているけれど偏っている――この2つを、偏りを持ち込まずにぼやけだけを減らすように混ぜ合わせました。偏ったデータを「答え」ではなく「ものさしの補助」としてだけ使う発想が面白いところです。", "unverified": "CATEの理論的保証（定理3–5）の詳細と、付録の表の数値は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "差の差法の事前トレンド検定を期間選択に生かす", "title": "From Pretrend Tests to Preperiod Selection in Difference-in-Differences", "url": "https://doi.org/10.2139/ssrn.7586678", "authors": "Doosoo Kim", "venue": "SSRN", "date": "2026-10-09", "apa": "Kim, D. (2026). From Pretrend Tests to Preperiod Selection in Difference-in-Differences. https://doi.org/10.2139/ssrn.7586678", "why": "事前トレンド検定とGMMの過剰識別検定の同値性を示し、事前期間の選択を既存の手続きで行えるようにした。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は取得できず", "preprint": true, "p1": "差の差法（DiD）で、事前トレンド検定・事前期間の選択・推定を一つの枠組みで結び、イベントスタディの出力から既存のモーメント選択の手続きを実行できるようにした（抄録）。", "p2": "DiDでは処置前の傾向（事前トレンド）を検定して設計の妥当性を確かめるのが慣行だが、検定の結果をどう推定に反映し、どの事前期間を使うかの体系的な指針はなかった（抄録）。", "p3": "1つの平行トレンドの仮定のもとで、事前トレンドの制約は同じ処置効果を識別する追加の制約と同値になる。拡張した二元固定効果モデルでは、事前トレンドのWald統計量が、整合した共分散の構成のもとでGMMの過剰識別J統計量と一致する（抄録）。", "p4": "この同値性から、妥当な制約を選ぶWald-BIC選択と、局所的な偏りと分散を均衡させる焦点選択を構成した（抄録）。比較対象や検証データは抄録に記載がない。", "p5": "長い事前期間で事前トレンドが棄却されても、より短い期間で正当化される設計まで無効になるとは限らないことを示した（抄録）。Stataのコードが付属し、著者はChatGPTとCodexを執筆とコード開発の補助に使ったと開示している（抄録）。", "p6": "本文が読めず、シミュレーションや実証例での性能は未確認。事前期間の選択はデータを見て設計を変えることでもあり、選択後の推論の扱いが論点として残る（解釈）。", "fun": "政策の効果を「政策前は同じ動きだった2つのグループ」の比較で測るとき、政策前の動きのずれを調べる検定がよく使われます。そのおなじみの検定の数字が、実は別の有名な検定と同じものだと気づくことで、どの期間のデータを信じればよいかを選ぶ道具に変えた点が面白いところです。", "unverified": "本文が読めず、手続きの性能評価と実証例は未確認。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "AIで応募書類が均質化し採用の評価が詰まる", "title": "Can Labor Markets Function in the Age of AI? The Evaluation Bottleneck in Hiring", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.30058", "authors": "Itai Ashlagi ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Ashlagi, I., Johari, R., Kleinberg, J., & Murthy, A. (2026). Can Labor Markets Function in the Age of AI? The Evaluation Bottleneck in Hiring (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.30058", "why": "AIによる応募の容易化が書類の情報量を下げ、企業が粗い指標に頼ることで誰が不利になるかを理論的に示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、モデルの§3、結論）を読んだ。§4–6の定理の証明は読んでいない。予備稿（Preliminary Draft）と明記されている", "preprint": true, "p1": "AIで応募書類が作りやすくなると書類が適合度を伝えなくなり、企業が経験の有無という粗い指標に頼るため、経験はないが仕事に合う応募者が最も不利になることを理論モデルで示し、多段階の選考がその対策になりうることを明らかにした（抄録、§7）。", "p2": "AIの求職支援は応募を容易にするが、応募書類の情報量を下げうる。そのとき選考と採用がどう変わり、誰が不利になるかは分かっていなかった（抄録）。", "p3": "応募者は観察できる経験 e ∈ {0, 1} と潜在的な適合度 z を持ち、z ≥ 0 なら適合する。書類のシグナルは m = z + ε で、AIの浸透度qが上がると雑音の分散が増える（式1–2）。企業はベイズで適合の事後確率を計算し、費用をかけて審査すれば z が完全に分かる（§3）。", "p4": "経験×適合の4類型について、書類の情報量が落ちたときの審査の候補への入りやすさ、審査の失敗（誰も審査しない、経験者だけ審査する）を理論的に分析し、安価な中間評価を挟む多段階選考と比べた（§4–6）。実証データは用いない。", "p5": "書類の情報量が下がると企業は経験への依存を強め、経験はないが適合する応募者が最も影響を受けた（抄録）。審査が高価だと、社会的には審査すべき応募者まで退ける非効率が生じ、AIの浸透が高い極限では体系的になる。十分に情報があり安価な中間評価は、企業の利得を厳密に高め、そうした応募者に採用への道を戻す（§7）。", "p6": "予備稿で、結論は正規分布の仮定などモデルの構造に依存し、実証的な裏づけはない（§3、解釈）。企業が応募者側の余剰を考慮しないことが非効率の源とされる（§7）。", "fun": "AIのおかげで誰でも立派な志望動機を書けるようになると、書類だけでは差がつかなくなります。すると会社は「経験があるか」だけで選び始め、経験はないけれど本当は向いている若者が一番割を食う――便利な道具が新しい壁を生むという逆説が面白いところです。", "unverified": "定理の具体的な条件と証明は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "事後の経験から事前の見通しを学ぶ自己回顧蒸留", "title": "Self-Retrospection Distillation: Turning Post-hoc Experiences into Prior Foresight", "url": "https://arxiv.org/abs/2610.08077", "authors": "Haoxiang Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-08", "apa": "Zhang, H., Chen, Q., Hayashi, H., Li, Z., Zhang, S., Zhang, J., Chen, J., Wu, F., Lu, P., Savarese, S., McAuley, J., & Wu, C.-S. (2026). Self-Retrospection Distillation: Turning Post-hoc Experiences into Prior Foresight (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.08077", "why": "報酬が全試行で同じになり学習信号が消える問題に対し、事後の軌跡から行動前の予測を教師付けする学習法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法の§3、主結果の§4.2、RQ3、結論）を読んだ。付録の理論分析は読んでいない", "preprint": true, "p1": "エージェントの事後の経験（完了した軌跡）を使って、行動前の「見通し」を教師付けする前向き学習を提案し、自己回顧蒸留（SRD）として実装して、検証可能な報酬による強化学習（RLVR）を補えることを示した（抄録、§3）。", "p2": "グループ相対型のRLVRでは、同じ問題の試行がすべて同じ報酬（全成功か全失敗）になると学習信号が消える。軌跡自体は課題の要件や失敗の仕方を示しているのに使われない（抄録）。", "p3": "同じモデルに、行動前の視点で「必要な知識」または「陥りやすい落とし穴」を予想させ（見通し分布、式4）、完了した軌跡・正解・誤りの注釈を見た同じモデルの教師（勾配停止）がその予想をトークン単位で採点し、両分布の差を小さくする（式5–7）。成功軌跡は知識、失敗軌跡は落とし穴の教師になる。見通しは学習目標にのみ使い、推論時には生成不要（§3.2、抄録）。", "p4": "数学・コード・検索などの道具使用推論と、ALFWorld・WebShopなどの長期エージェント課題の計10課題で、GRPO、自己蒸留（OPSD）、混合型（RLSD）に加えた効果を、Qwen系の4B・9Bなどで比べた（§4.1–4.2）。", "p5": "4BのGRPOに加えると数学・コード・検索の平均がそれぞれ10.03、8.33、8.05ポイント上がり、9BのOPSDでは数学の平均が39.70%から56.92%に上がった（§4.2）。2Bで98%のグループが全失敗のとき、RLVRは成功率0.0%で終わったが、SRDを加えると60.6%に達した（抄録）。悪化はWebShop（9B、OPSD）の−3.61ポイントの1件だった（§4.2）。", "p6": "改善はモデル規模に対して単調ではなかった（§4.2）。解釈：教師も生徒も同じモデルで正解を見て採点するため、正解のない開かれた課題への適用は未確認である。", "fun": "テストが終わってから「最初にこれに気づいていれば」と思うことがあります。その反省を、次の問題を解き始める前の「予想」に生かす練習をAIにさせました。全員が0点で比べようがない状況でも、反省メモから学べるので成績が上がった点が面白いところです。", "unverified": "表1の課題別の全数値と付録の理論分析は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "e値の棄却閾値1/αを構造仮定で改善", "title": "Improved E-Value Thresholds with Applications to Multiple and Sequential Testing", "url": "https://arxiv.org/abs/2610.11186", "authors": "Jiayi Shen ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Shen, J., Liu, H., Zeng, Q., Poon, M., Yang, W., Zhang, Q., & Zhuang, W. (2026). Improved E-Value Thresholds with Applications to Multiple and Sequential Testing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11186", "why": "帰無分布の形の制約を使ってe値の普遍閾値を鋭くし、多重検定・逐次検定での検出力を高めた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定の§2、閾値の理論の§3、数値実験の§5、考察）を読んだ。証明（付録A）は読んでいない", "preprint": true, "p1": "e値による検定の普遍的な棄却閾値 1/α は、帰無分布に構造があれば保守的すぎることを示し、密度の単調性やリプシッツ連続性を使ってより低い（検出力の高い）閾値を導き、多重検定と逐次検定に組み込んだ（抄録）。", "p2": "e値（帰無仮説の下で期待値が1以下の非負の統計量）はマルコフの不等式から閾値 1/α で検定できるが、その最悪の分布は裾の質量を閾値ちょうどに置くもので、実際の帰無分布の構造を無視している（§3）。", "p3": "支持が[0, b]で密度が非減少のクラスでは、最悪の棄却確率が min{1, 2/(t + b)} と求まり、ミニマックス最適な閾値 min{b, 2/α − b} が得られる（定理3.1）。密度がL-リプシッツのクラスでは、0付近に質量が集中できないため、1/α に対し O(L^{-1/2}) の相対的改善を持つ閉形式の閾値が得られ、α → 0 で漸近的に鋭い（抄録、§3.2）。", "p4": "区分線形の帰無密度を使い、標準のe-BH法、単調性に基づく既存の閾値 1/(2u)、提案のリプシッツ較正（e-LC）を同じe値で比べ、αを0.02〜0.10で変えて棄却数を数えた（§5.1）。逐次検定ではガウスの模擬データと2017年1月〜2026年6月のS&P 500の株価経路で調べた（§5.2）。", "p5": "無作為な実行可能性の調査では、e-LCが既存の単調性の閾値より低い閾値を与えたのは α = 0.05、0.02、0.01でそれぞれ72.82%、81.88%、85.21%の設定だった（§5.1）。L ≈ 0.585 の例では全水準でe-LCが既存法より多く棄却し、L ≈ 0.788 では同程度だった（図1）。", "p6": "Lを既知と仮定しており、データから妥当なLの上限を得る方法は今後の課題としている（§6）。S&P 500の分析は条件付きe値の仮定がデータで確立されていない事後的な例示である（§5.2）。", "fun": "「平均が1以下なら、20以上になる確率は5%以下」というマルコフの不等式は、どんな分布にも使える代わりに、かなり余裕を持った安全側の答えです。分布が急にとがらない（なめらか）と分かっているだけで、その余裕を削って、同じ安全性のまま見つけられる発見を増やせる点が面白いところです。", "unverified": "リプシッツ較正の閾値の具体的な式（定理3.3）と証明は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "肌の色の記録が違う姉妹で教育と所得に差", "title": "The Gendered Impacts of Perceived Skin Tone: Evidence from African American Siblings in 1870-1940", "url": "https://arxiv.org/abs/2610.10606", "authors": "Ran Abramitzky ほか", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Abramitzky, R., Conway, J., Mill, R., & Stein, L. C. D. (2026). The Gendered Impacts of Perceived Skin Tone: Evidence from African American Siblings in 1870-1940 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.10606", "why": "国勢調査で同じ家族の姉妹兄弟に異なる人種区分が付いた例を使い、肌の色による経済格差の要因を分離した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、実証戦略の§5の冒頭、結論の§8）を読んだ。§6の個別の表の推定値と付録は読んでいない", "preprint": true, "p1": "1870〜1940年の米国勢調査の全数データで、調査員が同じ家族の同性のきょうだいに異なる区分（BlackとMulatto）を付けた35,992家族を使い、肌の色の認識による経済格差のうち、同時代の差別と家族の機会の差を切り分けた（抄録、§8）。", "p2": "アフリカ系米国人の中で肌の色が濃いと認識された人ほど教育や所得が低いことは知られていたが、それが本人への差別によるのか、家族の資源や機会の差によるのかは区別が難しかった（§5、§8）。", "p3": "子どもを家庭から成人後まで国勢調査間で連結したパネルを作り、まず一般母集団で区分の差を属性で統制した回帰（式1）で比べ、次に同じ家族で区分の異なるきょうだいを比べて家族の機会を一定にした（§4–5、§8）。", "p4": "成果は子ども期の就学、成人の教育、婚姻、配偶者の教育・推定所得、成人の所得スコア、後の調査での「White」への分類、移住である（§6）。", "p5": "Blackと区分された姉妹はMulattoの姉妹より教育が低く、結婚しにくく、配偶者の教育も低かった。婚姻の差は一般母集団の差と同程度で、同時代の差別が主因と解釈された（§8）。兄弟では教育・婚姻・所得がほぼ同じで、所得差の95%信頼区間は一般母集団の差の約3分の1を超える大きさを除外した（§8）。", "p6": "区分は肌の色だけでなく社会的・文脈的な手がかりの束を反映し、きょうだいが同じ生物学的両親かについても検討が必要とされる（§7.1、§8）。解釈：結果は当時の「一滴の血」の分類規則のもとでのもので、現代への一般化には注意が要る。", "fun": "同じ家で育った姉妹なのに、国勢調査の係員が一人を「黒人」、もう一人を「混血」と書いた例がたくさんありました。この偶然の違いを使うと、家庭環境を同じにしたまま、見た目への差別だけの影響を測れます。女性では結婚に大きな差が出て、男性ではほとんど差がなかった――差別の働き方が性別で違う点が面白いところです。", "unverified": "姉妹・兄弟の各成果の具体的な推定値（§6の表）は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "ヒューマンコンピュータインタラクション", "headline": "生成エージェントで子どもの攻撃性の型を再現", "title": "\"Hot-Blooded\" vs \"Cold-Blooded\": Simulating the Behavioral Phenotypes of Childhood Aggression via Generative Agents", "url": "https://arxiv.org/abs/2610.11951", "authors": "Liping Fu", "venue": "arXiv", "date": "Fri, 09 Oct 2026", "apa": "Fu, L. (2026). \"Hot-Blooded\" vs \"Cold-Blooded\": Simulating the Behavioral Phenotypes of Childhood Aggression via Generative Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11951", "why": "理論に基づくパラメータ設定でLLMエージェントが反応的・能動的攻撃性を区別して再現できるかを、構成概念妥当性の観点から検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（PDF）の抄録、方法（エージェント構成）、結果の信頼性の節、限界と結論を読んだ。弁別妥当性の効果量の表と質的分析の節は読んでいない", "preprint": true, "p1": "LLMの生成エージェントに社会的情報処理モデルに基づく心理パラメータを与え、子どもの反応的（「熱い」）攻撃性、能動的（「冷たい」）攻撃性、両方の併存を区別して再現できるかを構成概念妥当性の観点から検証した（抄録）。", "p2": "攻撃性の下位型の研究は、まれな事例の観察や介入の試行が倫理的・実務的に難しい。LLMエージェントが理論どおりの行動の違いを安定して示すかは確かめられていなかった（序論、結論）。", "p3": "Google DeepMindのConcordiaで4人の8歳児エージェント（反応的、能動的、併存、非攻撃的な対照）を作り、怒りの気質・怒りの制御・敵意帰属バイアス・共感・情動調整などを0〜1で設定して、役割演技の指示と内部の感情更新に使った（表1、方法）。8つの社会場面（口論中に押される、ご褒美の分配など）で計1,920回シミュレーションし、盲検の符号化で32の行動指標を抽出した（抄録、表2）。", "p4": "非攻撃的な対照との弁別、20の乱数の種をまたぐ級内相関（ICC）による信頼性、変動係数による安定性、既存の実証文献との質的な収束で評価した（結果）。", "p5": "21の指標がICC 0.75以上の優れた信頼性を示し、情緒的共感0.99、向社会的行動0.99、支配性0.97などが高かった一方、誘惑の強さ0.08など4指標は低かった（表4）。反応的エージェントの変動係数は0.19〜0.44と安定し、能動的エージェントは場面1で1.26とばらついた（結果）。対照に対する弁別妥当性の効果量は大きかった（抄録）。", "p6": "著者は、使用モデルがDeepSeek-V3の1つだけであること、エージェントは8場面すべてを明確に区別したのに人の面接データでは5場面しか区別できず、ペルソナ設定が理論上の境界を誇張しうること、仮想の場面に限られることを限界としている（Limitations）。", "fun": "すぐカッとなる「熱い」攻撃性と、得をするために計算して手を出す「冷たい」攻撃性。AIの子どもに心理学の理論どおりの性格を与えると、場面ごとにこの違いが毎回くっきり現れました。ただ、本物の子どもよりも「くっきりしすぎる」ことが、かえってAIの限界を教えてくれる点が面白いところです。", "unverified": "対照との弁別の効果量の具体的な値は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "買い物を任されたAIも人間の手抜き判断をまねる", "title": "Shopping by algorithm: How agentic AI deploys human heuristics as a surrogate consumer", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.28372", "authors": "Davood Wadi ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Wadi, D., & Ma, Y. (2026). Shopping by algorithm: How agentic AI deploys human heuristics as a surrogate consumer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.28372", "why": "情報取得に費用を課すとLLMの買い物エージェントが単価の計算に必要な情報を省き、価格表示に惑わされることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（Tool-Labの枠組み、研究1の刺激・手順・結果、限界）を読んだ。研究2と検証研究の詳細は読んでいない", "preprint": true, "p1": "買い物を任されたLLMエージェントが、情報取得に費用がかかり目標があいまいなとき、単価の計算に必要な情報を省いて「4.99ドル」のような端数価格にだまされる、人間に似たヒューリ
