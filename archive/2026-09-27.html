(In Review)", "date": "2026-09-27", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Square（査読中）に登録された抄録を使用", "preprint": true, "short": true, "p1": "障害のある若者とない若者のメンタルヘルスの格差が、社会的つながり（孤独、社会的支援、交流の頻度など）の程度によってどう変わるかを調べた（抄録）。", "p3": "オーストラリアの家計所得労働動態調査（HILDA）の2022年のデータで、15〜24歳の1,953人を障害なし・心理的障害・非心理的障害に分け、人口で重み付けした線形回帰と交互作用項で、4つの社会的つながりの側面による効果修飾を推定する（抄録）。", "p5": "結果の詳細は取得した抄録の範囲では確認できなかった（未確認）。研究の全段階に障害のある若者の経験を取り入れている（抄録）。", "unverified": "抄録の後半（結果）を取得できず、効果修飾の結果は確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "介護サービスの1人あたり費用は要介護度と年齢でどう違うか", "title": "介護サービスの受給者 1 人 1 か月当たりの費用は、要介護1の 115.7 千円から要介護5の 321.5 千円(2.779 倍)へ上がり、年齢では 65〜69 歳の 181.0 千円から 95 歳以上の 243.0 千円(1.343 倍)へ上がる——年齢の差のうち要介護度の構成の分は 1.097 倍で、同じ要介護度の中の分(1.246 倍)のほうが大きい [M083]", "url": "https://doi.org/10.5281/zenodo.22979033", "authors": "Yuuki YAMAGISHI", "venue": "DataCite preprints", "date": "2026-09-26", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明を使用", "preprint": true, "short": true, "p1": "介護給付費等実態統計（令和6年度）の公表表から、介護サービスの受給者1人1か月あたりの費用が要介護度と年齢でどう違うかを分解した（抄録）。", "p3": "第2表（受給者数）と第8表（費用額）から1人1か月あたりの費用を計算し、年齢による違いを、要介護度の構成の違いによる分と、同じ要介護度の中での違いに分ける（抄録）。", "p5": "費用は要介護1の115.7千円から要介護5の321.5千円へ2.779倍、年齢では65〜69歳の181.0千円から95歳以上の243.0千円へ1.343倍になった（抄録）。年齢の差のうち要介護度の構成による分は1.097倍で、同じ要介護度の中の分（1.246倍）の方が大きかった。", "unverified": "著者は独立の個人研究者で、公開統計の記述的な再集計である。"}}, {"id": "pr35", "rank": 35, "headline": "分布型音響センシングの感度を上げる光ファイバ振動センサ", "title": "Design of a sensitivity-enhanced fiber-optic vibration sensor for distributed acoustic sensing", "url": "https://doi.org/10.2139/ssrn.7528903", "authors": "Zhitao Gao ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "分布型音響センシング（DAS）で弱い振動を捉えるため、慣性質量を載せた薄肉円筒に光ファイバを巻いた感度増幅の素子を設計し、振動台実験で基準のファイバより大幅に高い感度を示した（抄録）。", "p3": "ANSYSの3次元調和応答解析で、壁厚・弾性体の材料・外径・質量の4つの設計変数がファイバのひずみに与える影響を調べ、ポリカーボネート製・壁厚1.5 mm・外径90 mm・質量300 gの設計を選んで、振動台で同じ長さの被覆ファイバと比べる（抄録）。", "p5": "素子は1〜20 Hzで平坦な応答を示し、45 Hz付近で123.7 rad/gのピーク（2次系のあてはめで減衰比0.2342）を持った。基準のファイバは0.90〜3.70 rad/gにとどまった（抄録）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr36", "rank": 36, "headline": "地中レーダーからFEMを自動で作る仮設構造物の安全評価", "title": "An Automated Ground Penetrating Radar-to-FEM Mapping Framework Based on Multi-task Deep Learning for Safety Pre-deployment Evaluation of Temporary Structures", "url": "https://doi.org/10.2139/ssrn.7528528", "authors": "ZongShuai Liu ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "災害時の仮設構造物の安全評価のため、地中レーダー（GPR）の画像から地下の異常と地層を深層学習で読み取り、有限要素法（FEM）の境界条件に自動で写す仕組みを作った（抄録）。", "p3": "改良したYOLOv8のセグメンテーション（Geo-YOLOv8-seg）で異常の検出と地層の区分を同時に行い、変更された境界・荷重の指示だけを疎な更新行列として常駐のソルバーに渡し、全体のモデル再構築や再メッシュを省く（抄録）。", "p5": "検出の精度は94.8%、物理的な深さの定量化の相対誤差は5%以内だった（抄録）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr37", "rank": 37, "headline": "BRICS諸国のコンセッションとPPPの規制を比較", "title": "Concessions and Public-Private Partnerships in the Expanded BRICS Comparative Regulatory Frameworks and Practices for Private Capital Mobilization -A Comparative Analysis and Literature Synthesis", "url": "https://doi.org/10.2139/ssrn.7518858", "authors": "Paulo Roberto Silva", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "拡大BRICS10か国のコンセッションと官民連携（PPP）の規制を比べ、インフラへの民間資本の動員を広げる制度・金融の実践を整理した（抄録）。", "p3": "法令と国際機関の報告書の文書分析に、世界銀行の民間参加インフラ（PPI）データベースと文献レビューを組み合わせる（抄録）。", "p5": "全加盟国にPPPの法的根拠があるが、大規模に資本を動員しているのはブラジル・中国・インドだけで、2020〜2024年の低・中所得国の民間インフラ投資の59%を占めた（抄録）。枠組み法は必要だが十分ではなく、国内の金融の厚みと財政支援の信頼性が成否を分けたとしている。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr38", "rank": 38, "headline": "共同体のための空間配置を測る指標で土地利用を最適化", "title": "Introducing the Spatial Communal Index for Land-use Planning and Layout Optimization: a Case Study of Lagos State Settlement Typologies", "url": "https://doi.org/10.2139/ssrn.7523979", "authors": "Praise Anyanwu", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "私的な住空間と交流の空間の釣り合いを測るため、建物の占有面積に対する共有の未建築空間を、過度な密集への罰則付きで評価する無次元の指標（Spatial Communal Index）を提案した（抄録）。", "p3": "建物に覆われた地面に2乗の罰則を課す形で、配置の性能を規模によらず比べられる指標を作り、ナイジェリア・ラゴスの住宅の類型に当てはめて検証する（抄録）。", "p5": "高密度の在来型・長屋型の配置（Isale Eko、Ebute Metta）は1.0539と1.0405でほぼ均衡、計画的な現代住宅（Ikeja GRA）は3.4742と高かった（抄録）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr39", "rank": 39, "headline": "欧州の乗用車の実走行エネルギーと温室効果ガスの大規模分析", "title": "A Comprehensive Real-World Analysis of Energy Use and GHG Emissions of the Light Duty Vehicle Fleet in Europe", "url": "https://doi.org/10.2139/ssrn.7517979", "authors": "Anne Bouter ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "欧州経済領域で2023年に新規登録された約1,130万台の小型車について、実走行のエネルギー消費と、燃料の採掘から走行・車両製造までの温室効果ガスを大規模に評価した（抄録）。", "p3": "車種（普通車・SUV・ミニバン・バン）を動力源・燃料・大きさで細かく分け、約800万台の車載燃料・電力消費計（OBFCM）のデータと電気自動車の走行試験から実走行の係数を求め、拡張した燃料採掘から走行まで（Well-to-Wheel）の評価に車両製造の影響も加える（抄録）。", "p5": "結果の数値は取得した抄録の範囲では確認できなかった（未確認）。", "unverified": "抄録の後半（結果）を取得できず、車種・動力源別の排出の数値は確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "都市の暑熱研究・特許・報道を2万報規模で横断", "title": "What the World Studies, Invents and Reports About Urban Heat", "url": "https://doi.org/10.17613/bh2an-0af97", "authors": "Narendra Kumar", "venue": "SocArXiv", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "KC Worksのページから抄録を取得。本文PDFは読んでいない", "preprint": true, "p1": "都市のヒートアイランドに関する論文20,422報（抄録のある17,101報は文単位）を読み、ニュース・特許・熱中症などの事故記録・企業登記・資金調達と結合した公開コーパス（UHRC）を作り、研究・報道・発明・市場が都市の暑さをどう扱ってきたかを並べて示した（抄録）。", "p2": "都市の暑熱は研究も報道も急増しているが、研究が扱う原因・場所・対策と、報道や特許・市場の動きが一致しているかを横断的に見た資料はなかった（抄録）。", "p3": "1990〜2025年の論文20,422報（抄録のある17,101報を文ごとに分類）、2021〜2025年のニュース96,726件、特許4,123ファミリー、暑熱事故14,576件、企業・資金調達の記録を結合する。研究から抽出した原因の分類は独立の第2の読み手で検証し、通らなかった3分類は結果に使っていない（抄録）。", "p4": "論文数の伸び、原因の帰属の割合、研究と報道の冒頭文の内容の違い、国・都市ごとの研究と報道の偏り、特許と研究の伸びの比、街路樹による冷却効果の報告値を比べる（抄録）。", "p5": "分野の伸びは学術文献全体の約9倍で、原因を述べた2,409報の48%が都市化・土地利用の変化を挙げ、人工排熱への帰属は18.4%から7.7%へ下がった（抄録）。中国は研究の31%を占めるが英語報道では2.3%にとどまり、遮熱・透水性舗装の特許は10年で12倍に増えたのに研究は2.4倍だった。194研究の街路樹の冷却効果の中央値は2.0℃だった（抄録）。", "p6": "解釈：民間の分析会社による未査読のプレプリントで、報道は英語中心、企業データはインドの会計に偏る。冷却効果の中央値は測定条件の異なる研究をまとめた値で、比較には注意が要る。", "unverified": "本文を読んでおらず、分類の方法と第2の読み手の一致率は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "AIによる人事評価のフィードバックと従業員の反応", "title": "AI-Enhanced Performance Appraisal Systems: Assessing the Interplay Between Machine Feedback, Employee Motivation, and Career Mobility", "url": "https://doi.org/10.5281/zenodo.22932876", "authors": "Dhanraj Kalgi ほか", "venue": "Zenodo", "date": "2026-09-30", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "人事評価へのAIの導入が、機械によるフィードバック・従業員の内発的・外発的動機づけ・長期のキャリアの移動にどう関わるかを論じた（抄録）。", "p3": "リアルタイムで生産性やコミュニケーションを監視するアルゴリズム評価の利点と課題を、文献に基づいて整理する（抄録）。実証データの有無は抄録からは分からない（未確認）。", "p5": "機械のフィードバックが不透明・懲罰的・文脈への共感を欠くと受け取られると、アルゴリズム不安、仕事からの離脱、指標の戦略的な操作を招きうると論じている（抄録）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr42", "rank": 42, "headline": "AIで作業が安くなると専門家の価値は検証と責任に移る", "title": "Liability, Verification, and the Market for Expertise in the Presence of AI", "url": "https://doi.org/10.2139/ssrn.7524324", "authors": "Ricardo Pasquini", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIで作業の実行が安くなると、依頼者は自分で検証できる仕事は自分で行い、検証できない仕事（診断や監査）だけを専門家に頼むようになるが、そのとき本物の専門性と模倣を見分ける仕組みがどう崩れるかをモデル化した（抄録）。", "p3": "外部に頼むか自分でやるかの選択を、専門家が賠償責任の保証金（liability bond）で質を示すシグナリング・ゲームに組み込む（抄録）。", "p5": "専門家と模倣者が分かれる（分離均衡）のは検証のしやすさが中程度の範囲だけで、検証が容易なら依頼者は自分で行い、困難なら大きな保証金を出す模倣者でも排除できない（抄録）。専門家が出せる資本に上限があると、その範囲の下限が上がる。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr43", "rank": 43, "headline": "生成AIの仕事では文脈の組み立てと維持が成果を左右", "title": "Context Systems and Context Fitness in Generative AI Work: A Dynamic Framework for Constructing, Maintaining, and Validating AI Context", "url": "https://doi.org/10.2139/ssrn.7530019", "authors": "Valeriana Colon", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "生成AIの仕事の成果は、検索・記憶・道具・権限・組織の記録などから作られる一時的な「文脈の状態」の作り方と維持に左右されるとして、その理論と実務向けの枠組みを示した（抄録）。", "p3": "文脈設計、検索拡張生成、長文脈の限界、エージェントの記憶などの文献を統合し、2026年9月に4つのAIシステム（ChatGPT、Claude、Gemini、Atlassian Rovo）で、情報の欠落・古い方針・矛盾する情報源などの場面を試す探索的な質的パイロットを行う（抄録）。", "p5": "AIの成果は文脈の組み立て方に左右されることが示唆されたと述べている（抄録）。質的なパイロットで、定量的な検証は抄録にない（未確認）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr44", "rank": 44, "headline": "政府の後押しは製造業のAI導入意向を高めるか", "title": "Government Initiatives and AI Adoption in Manufacturing: An Institutional Extension of the Technology Acceptance Model in Singapore", "url": "https://doi.org/10.2139/ssrn.7529141", "authors": "Shashi Bhushan ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "シンガポールの製造業で、政府のAI支援策が企業のAI導入意向を高めるかを、技術受容モデル（TAM）に政府の施策と知覚費用を加えて検証した（抄録）。", "p3": "シンガポールの製造業の管理者467人の調査データを、偏最小二乗法による構造方程式モデリング（PLS-SEM）で分析し、政府の施策の直接効果と調整効果を調べる（抄録）。", "p5": "知覚された有用性・使いやすさ・政府の施策は導入意向を高め、知覚費用に有意な直接効果はなかった（抄録）。政府の施策は、有用性と費用が導入意向に与える効果を弱める方向に調整した。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr45", "rank": 45, "headline": "経験を否定せずにAIを受け入れる学び直しの枠組み", "title": "Unlearning without Self-negation: An Asset–liability Framework for AI Adoption by Owner-operators in Traditional Industries", "url": "https://doi.org/10.2139/ssrn.7524062", "authors": "Yong-Ho Kim", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "伝統産業の自営の経営者がAIを受け入れる際、過去の経験を否定せずに学び直す（unlearning）ための「資産と負債」の概念的な枠組みを示した（抄録）。", "p3": "独立の飲食店経営者がAIと交わした対話を出発点に、経験と判断は残す資産、方法と道具は手放す負債と区別する枠組みを、組織の学び直しとAIによる職業アイデンティティの脅威の文献と結びつける（抄録）。", "p5": "既存研究は正式な雇用組織の中を対象にしており、人事の支えなしに一人で学び直す自営業者には当てはまりにくいと論じている（抄録）。実証的な検証はない概念研究である（抄録からの解釈）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "ツール応答でなく編集を予測する世界モデル", "title": "Agent-Editing World Model: Rethinking World Modeling for LLM Agents", "url": "https://arxiv.org/abs/2609.28416", "authors": "Shuang Sun ほか", "venue": "arXiv", "date": "2026-09-25", "why": "LLMエージェントの世界モデルを、観測の再構成ではなく行動の編集として捉え直す提案で、長期タスクのエージェント設計の考え方を変えうる。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§2手法、§4.1実験設定、§4.3–4.4結果、§7結論）を読んだ。付録と表1の個別数値は一部のみ確認", "preprint": true, "p1": "LLMエージェントの「世界モデル」を、道具の応答（観測）を予測するものから、エージェント自身の推論と行動の良し悪しを判定して実行前に書き換えるものへと作り替え、長い作業の途中で誤った前提が履歴に残り判断を歪める問題を減らした（抄録、§2）。", "p2": "従来の言語の世界モデルは環境からの観測を予測するが、検索結果やコマンド出力のような実行次第で変わる応答を再現しても、実際の応答が得られる場面では価値が小さい。一方、エージェントは根拠のない仮定や古い計画を履歴に残し、それが後の判断を歪める「タスク状態の汚染（task-state contamination）」に陥る（抄録、§2.1）。", "p3": "AEWMは、①Action Judge：実行前の推論・行動の組を「重要（critical）」「探索的（exploratory）」「雑音（noisy）」に分類し、②State Revision：雑音と判定された組だけを同じ履歴から書き直す（式2）。書き直した行動は実環境で実行され、その結果で履歴が更新される（式3）。これを行動と組み合わせたものがEditActで、同じ結果を出すかの予測ではなく、状態そのものを直す点が従来と違う（式1）。例：検索エージェントが根拠のない推測を事実として次の検索を組もうとすると、それを雑音と判定し、根拠を取りに行く行動に書き換える。", "p4": "検索（BrowseComp、DeepSearchQA）、端末操作（Terminal-Bench 2.0）、ソフトウェア開発（SWE-Bench Pro、Doc2Repo、NL2Repo）の6ベンチマークで、Qwen3.5の3規模のエージェントに対し、ReAct、各手番で3候補から検証器が選ぶBest@3、軌跡単位のBest@3と比べる。各3回の平均で評価する（§4.1）。", "p5": "Action Judgeの独自ベンチマークでマクロF1 70.5%となり、最強の先端モデルを10.6ポイント上回った（抄録）。EditActは6ベンチマークすべてで比較手法を上回り、最強の比較手法に対する平均の上積みは4B・9B・35Bのエージェントでそれぞれ6.7・5.2・3.2ポイントだった（§4.3、表1）。9BにEditActを付けると35BのReActを上回った（44.1対42.2）。EditActの軌跡で追加学習したAEWM-RFTは、AEWMなしでも自己の成功軌跡での学習（Self-RFT）を2.2〜2.6ポイント上回った（§4.4、表2）。", "p6": "著者は、より強いエージェント（Qwen3.5-Plus）では端末・開発での改善が限られ、AEWMとエージェントの能力差が原因と考えられると述べている（§4.3）。解釈：学習データの一部は非公開の検索データで、判定のラベルも別のLLMで作られており、判定基準の偏りが結果に影響する可能性は残る。未査読のプレプリントである。", "unverified": "付録Bの判定ベンチマークの構成と、表1のベンチマーク別の数値は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "未知の人工世界でAIの探索力を検証する", "title": "ExplorationBench: Measuring AI Systems' Exploration in Verifiable Alien Worlds", "url": "https://arxiv.org/abs/2609.30199", "authors": "Ming Zhang ほか", "venue": "arXiv", "date": "2026-09-25", "why": "仮説を立て実験で確かめる『探索』能力を、正解が検証できる架空世界で測るベンチマークで、AIによる科学的発見の評価基盤になりうる。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3ベンチマーク設計、§4結果のRQ1・RQ3、§6限界）と図表キャプションを読んだ。RQ2と付録は未読", "preprint": true, "p1": "AIが仮説を立て実験し結果から学ぶ「探索」の力を、規則が既知の知識と食い違うため暗記では解けず、しかも答えが厳密に検証できる人工の「異星世界」で測るベンチマーク（ExplorationBench）を作った（抄録）。", "p2": "科学的探索の評価では、本当に新しい仮説が正しいかをどう確かめるか、探索で見つけたのか事前学習の知識を思い出しただけなのかをどう見分けるか、が難しい（抄録）。", "p3": "2つの砂場を用意する。AlienCodeは見慣れた演算子が隠れた別の意味で動く小さな計算言語（発見目標31、未見課題70）、AlienLogicは推論規則の一部を書き換えた一階述語の自然演繹（発見目標24、課題70）。システムには誤りを含むマニュアルと例題を渡し、プログラムや証明を「探り（probe）」として投げると、実行結果や検証結果が返る。4ラウンド探索したあと、道具を使えない別の会話で、見つけた規則の報告と未見課題への解答を求める（§3.1–3.2）。例：「+」が実は別の計算をする言語で、試しにプログラムを走らせて出力から規則を推測する。", "p4": "採点はインタプリタと証明検査器で行い、LLMの判定は使わない。10の先端AIシステムがそれぞれ3本の探索軌跡を走らせ、探索前（M0）から4ラウンド後（M4）の未見課題の正答率で比べる。自分で探りを選ぶ条件、最良軌跡の探りを後から与える条件、固定の探りの条件、道具なしの条件を比べて、実験を設計すること自体の寄与を分ける（§3.1、§4.1）。", "p5": "AlienCodeでは探索前はどの軌跡も15.7%以下だったが、4ラウンド後の最良（Best@3）は87.6%に達し、10システム中7つが60%を超えた（§4.2.1）。AlienCodeの中央値は、自分で探りを選ぶと66.0%、同じ探りを後から与えると40.7%、固定の探りでは5.7%で、実験を自分で設計することが効いていた（図4）。一方で同じシステムでも軌跡間の差が最大72.8ポイントあり、30軌跡中6本は途中より3ポイント以上下がって終わった（§4.2.3、図9・10）。", "p6": "著者は、決定的で実行可能な2つの世界に単純化しているため、雑音や不完全な観測、費用のかかる実験、開かれた仮説空間、長い探索期間を含む実際の科学的発見の能力を測るものではないこと、軌跡3本・解答3回では分布を精密に推定できないことを限界に挙げている（§6）。未査読のプレプリントである。", "unverified": "RQ2（規則の発見と使用の関係）の結果と、表1のシステム別の数値は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "カリフォルニアの暑熱規制で労災は減った", "title": "Cooler Laws, Safer Workers: Evaluating California’s Heat Standard and Injury Reduction", "url": "https://doi.org/10.3386/w35772", "authors": "Olesya Fomenko ほか", "venue": "NBER Working Paper", "date": "-", "why": "暑熱対策の法規制が労災を減らすかを行政データの三重差分で評価し、温暖化下の労働安全政策に直接の根拠を与える。", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、§3データ、§4推定方法と式1、§5結論）を読んだ。結果表の個別の係数は結論の要約で確認", "preprint": true, "p1": "2005年にカリフォルニア州が導入した屋外労働の暑熱基準（水・日陰・休憩・暑熱順化・緊急対応の義務）が、暑い日の労働災害を建設・農業・運輸で15〜27%減らしたことを、労災補償の行政データで因果的に示した（抄録、§5）。", "p2": "暑さが労災を増やすことは多くの研究で示されてきたが、暑熱を対象とする法規制が実際に労災を減らすかの証拠はほとんどなく、導入後の減少が基準によるのか他の要因によるのかも切り分けられていなかった（§1）。米国には連邦の暑熱基準がなく、各州で導入が議論されている。", "p3": "WCRIの労災補償請求データ（発生日と居住地の郵便番号つき）と、PRISMの4km格子の日最高気温を郵便番号区域・日単位で結合し、2002〜2022年の5〜10月の平日を対象にする（§3）。「導入前後」×「暑い日と涼しい日」×「屋外の高リスク産業と事務・専門職」の三重差分で、同時期の労災補償制度改革など州全体の変化を差し引く（§4、式1）。例：同じ区域・同じ暑い日に、建設労働者の労災が事務職と比べて基準導入後にどれだけ減ったかを見る。", "p4": "結果は区域・日・産業ごとの労災件数で、三重の交差項の係数が基準の効果を表す。アリゾナ州を比較対照にした別の推定でも結果を確かめる（§4、§5）。", "p5": "暑い日の労災件数は、建設で15〜17%、運輸で19〜25%、農業で24〜27%減った（§5）。効果は外気温が高いほど大きく、若い労働者で大きかった（抄録）。アリゾナを対照にした推定でも建設と農業の結果は再確認されたが、運輸はやや不安定だった（§5）。", "p6": "著者は、運輸の推定の不安定さを業界全体の空調技術の進歩などで説明しており、データが労災補償請求の40〜80%しか覆わないこと、発生場所を居住地の郵便番号で近似していることを注記している（§3脚注9・10、§5）。解釈：報告されない労災の変化は捉えられない。NBERワーキングペーパーで、査読前の版である。", "unverified": "年齢別・気温区分別の係数の具体的な値は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "山火事対策の自助を促す誘因設計", "title": "Incentivizing Self-Protection From Wildfires", "url": "https://doi.org/10.3386/w35764", "authors": "Patrick Baylis ほか", "venue": "NBER Working Paper", "date": "-", "why": "住宅周辺の可燃物管理という安価な対策が普及しない理由と誘因の効果を検証し、災害リスク削減政策に示唆を与える。", "explain": {"basis": "本文", "basis_note": "Semantic Scholarで所在が分かったNBERワーキングペーパーのPDF本文（序論、§3処置群、§5.1主要結果、結論）を読んだ", "preprint": true, "p1": "山火事の危険がある米国オレゴン州の住宅で、住宅周りの可燃物の管理（防御空間：defensible space）の無料点検を受けさせるには、情報提供だけでは効かず、100〜500ドルの金銭的誘因が効くことを、2つの無作為化フィールド実験で示した（抄録、結論）。", "p2": "災害の損失は安価な財産保護への投資で減らせるが採用は少なく、山火事の地域では住宅のすぐ近くの植生や燃料を管理すると建物が燃えにくくなるのに、普及活動を広く行っても推奨に沿う住宅は少ない（抄録）。どんな働きかけが実際に行動を変えるかの因果的な証拠が乏しかった。", "p3": "州の消防当局と地域の消防区（ジャクソン郡第3消防区：JCFD3、ユージーン・スプリングフィールド：ESF）と組み、危険地域の住宅を無作為に、①連絡なしの対照群、②山火事のリスクと推奨行動、既存の無料点検の案内を送る「情報提供」群、③それに加えて点検の合格時に補助金を払う「補助」群に割り付ける（§3.2）。補助額はJCFD3で250ドルと500ドル、ESFで100ドルと200ドル。例：同じ地域でも、案内だけの家と250ドルの補助を示された家に分かれる。", "p4": "主要な結果は、処置の期間中に消防区へ点検を申し込んだかどうか（申込率）で、各処置群と対照群の差をt検定で比べる（§5.1、図4）。住宅の価値や山火事の危険度による反応の違い、現地と衛星による植生の測定も調べる（抄録）。", "p5": "JCFD3では対照群の申込は0.6%未満、情報提供群は約3%にとどまり、道徳的な訴えを加えた群は2%未満で対照群と差がなかった（§5.1）。250ドルの補助群は12%が申し込んだが、500ドルの群は7%で、意外にも250ドル群より低かった（§5.1）。ESFでも情報提供群と100ドル群は約3%、200ドル群は約6%だった（§5.1、図4）。補助への反応は価値の高い住宅で大きく、元々の山火事の危険度は反応を予測しなかった（抄録）。", "p6": "著者は、現地と衛星による植生の測定は処置効果の推定にはノイズが大きいこと、補助金を保険料の割引に置き換えて解釈するには文脈の違いに注意が要ることを述べている（抄録、結論）。解釈：申込は点検の依頼であって、実際に可燃物が減ったかは十分には確かめられていない。NBERワーキングペーパーで、査読前の版である。", "unverified": "500ドル群の申込率が250ドル群より低かった理由の分析と、植生の測定結果の数値は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "深層学習で処置効果を推定し推測まで行う", "title": "Deep Neural Network Estimation and Inference for Treatment Effects with Mixed Binary-Continuous Covariates", "url": "https://doi.org/10.2139/ssrn.7528544", "authors": "Jie Zhou ほか", "venue": "SSRN", "date": "2026-09-26", "why": "連続と2値が混在する共変量の下で、深層ニューラルネットによる平均処置効果と群別処置効果の推定と統計的推測を扱い、機械学習による因果推論の理論的基盤を広げる。", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "2値と連続値が混在する共変量の下で、深層ニューラルネット（DNN）を補助関数の学習器に使う二重機械学習（DML）でも、平均処置効果（ATE）と群別平均処置効果（GATE）を√nの速さで一致推定し、正規近似による推測ができることを理論的に示した（抄録）。", "p2": "政策評価では2値と連続値の混在する共変量が普通だが、DNN回帰の収束理論は入力をすべて連続の領域での滑らかさで扱い、2値変数の離散的な構造を活かしていなかった（抄録）。", "p3": "全結合の深層ReLUネットで結果と処置確率（補助関数）を学習し、DMLでATEとGATEを推定する。2値の座標上では回帰関数を滑らかに補間できることを使い、混在する共変量でのDNN回帰のL2収束の速さを導く。収束の指数は入力の総次元ではなく、連続部分の関数の滑らかさと内在的な次数で決まる（抄録）。例：職業訓練の効果を、性別などの2値と年齢・所得などの連続値を同時に使って推定する場面。", "p4": "補助関数の各成分の滑らかさが入力次元に比べて十分大きいときの理論的な性質を示し、シミュレーションで確かめ、全米職業訓練実験（National Supported Work）のDehejia–Wahba標本に当てはめて、実験の基準値と比べる（抄録）。", "p5": "シミュレーションは理論の予測を裏づけ、実データへの適用ではATEの推定値が既報の実験の基準値と整合し、共変量で定義した部分群の間に大きな効果の異質性が見られた（抄録）。具体的な推定値は抄録にない（未確認）。", "p6": "解釈：理論の前提（補助関数の十分な滑らかさ）が実データで満たされるかの確認方法や、ネットの構造の選び方が結果に与える影響は抄録からは分からない。未査読のプレプリントである。", "unverified": "本文を読めておらず、収束の速さの式、シミュレーションと実データの推定値は確認できなかった。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "階層モデルで多数の条件付き効果を一度に推定", "title": "Using Hierarchical Models to Estimate Heterogeneous Effects", "url": "https://doi.org/10.31235/osf.io/vnp8c_v1", "authors": "Joshua Alley", "venue": "SocArXiv", "date": "2026-09-26", "why": "政治学で増え続ける条件付きの理論を、通常の交互作用モデルに代わる階層モデルで扱う方法を示し、異質な効果の推定の実務を変えうる。", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（シミュレーション、Barber and Popeの再分析の結果、結論）を読んだ。付録の設定は未読", "preprint": true, "p1": "処置効果を変える要因（効果修飾因子）が多くの理論から提案される状況で、通常の交互作用モデルに代えて、効果をグループ単位でモデル化し部分的にプール（部分的な共有）する階層モデルを使う理由・時期・方法を示した（抄録）。", "p2": "政治学では条件付きの理論が増え、1つの説明変数に複数の効果修飾因子が想定されるが、3つ以上を交互作用に入れると解釈できず、別々のモデルで推定すると相関する修飾因子の効果を取り違える（抄録、§4）。", "p3": "効果の異質性の主な源で観測をグループ化し、①処置と結果をつなぐ回帰と、②グループごとの処置効果を修飾因子で説明し、グループ間で部分的にプールする回帰をつないだ階層モデルを当てはめる。系統的な変動と偶然の変動を同時に捉え、推定を正則化する（抄録）。例：党派、知識、大統領支持、イデオロギーごとの有権者グループで、トランプ氏の手がかりへの反応がどう違うかを一度に推定する。", "p4": "標本サイズを2,000に固定してグループ数を変えたシミュレーションで、グループ係数の推定の二乗平均平方根誤差（RMSE）を通常の最小二乗法（全交互作用・加法的な交互作用）と比べ、Barber and Pope（2019）の研究を再分析する（§3、図2）。", "p5": "階層モデルはたいていRMSEが最も小さく、とくにグループが増えるほど有利だった。全交互作用の最小二乗法は8グループでは同程度だが、グループが増えるとRMSEが急に悪化した。効果が完全に加法的な場合だけ、正しく特定した加法モデルが3%正確だった（§3、図2）。再分析では、4つの修飾因子を1つのモデルに統合すると、元の研究で有意だった修飾効果の多くが不確かになり、政治知識だけが明確に非ゼロとして残った（§3、図5）。", "p6": "著者は、小さなグループが多いと事前分布が支配して強く平均に引き寄せられ、部分的なプールの利点が失われることを主な欠点に挙げている（結論）。修飾因子が1〜2個なら単純な交互作用、複雑な異質性の探索には機械学習が向き、階層モデルはその中間と位置づけている。未査読のプレプリントである。", "unverified": "付録のTomz and Weeksの再分析と、正則化された機械学習との比較の結果は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "大規模ネットワークで波及がある内生的処置の効果を識別", "title": "Heterogeneous Effects of Endogenous Treatments with Interference and Spillovers in a Large Network", "url": "https://econpapers.repec.org/RePEc:arx:papers:2512.14515", "authors": "Lin Chen ほか", "venue": "RePEc", "date": "2026-01-26", "why": "処置が内生的で、周囲への波及（干渉）がある大規模ネットワークでの異質な効果の識別と推定を扱い、因果推論の難しい設定を前進させる。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（序論、§6.3シミュレーション結果、§7.3実証結果）を読んだ。§3〜5の識別と漸近理論の証明は未読", "preprint": true, "p1": "1つの大きなネットワークの中で、処置の選択が内生的で、周囲の処置の影響（干渉・波及）もある状況で、自分の処置と近隣の処置の効果を分けた異質な限界曝露効果（MEE）を識別・推定する方法を示し、中国からの輸入競争が米国の地域労働市場に与えた効果に当てはめた（抄録）。", "p2": "大きな単一ネットワークでの因果推論は増えているが、自分の処置と近隣の処置の効果を切り分けた異質な効果の識別・推定はあまり分かっていない。処置の選択も結果も他者の行動に依存するため、両方の干渉を扱うモデルが要る（§1）。", "p3": "処置の選択を、不完全情報の下での合理的期待均衡としてモデル化し、均衡が一意になる条件を導いて傾向スコアを識別する。干渉を低次元に要約する曝露写像（exposure mapping）を仮定し、結果のモデルに関数形を課さずに、近隣の処置状態と観測されない異質性で変わるMEEを識別する。推定は一般化モーメント法（GMM）で、ネットワーク依存に頑健なψ依存の枠組みで漸近理論を示す（§1）。例：ある通勤圏の製造業雇用への輸入競争の効果が、隣接する通勤圏も輸入競争にさらされているかで変わるかを見る。", "p4": "環状ネットワークとランダム幾何グラフでのモンテカルロ実験で、偏り・標準偏差・二乗平均平方根誤差・95%信頼区間の被覆率を標本サイズ250と1,000で比べる（§6.3、表1〜4）。実証ではAutor et al.（2013）の米国の通勤圏（CZ）のデータを使う（§7）。", "p5": "シミュレーションでは、標本サイズを1,000にすると標準偏差がおよそ半分になり（√nの収束）、95%信頼区間の被覆率は名目の水準に近かった（§6.3）。実証では83.59%の通勤圏に処置された隣接圏があり、MEEは大多数の通勤圏で有意に負で、処置された隣接圏がある場合の方が絶対値が大きく、波及が貿易ショックを増幅していた（§7.3、図3）。輸入競争にさらされにくい通勤圏ほど、効果が深刻だった。", "p6": "著者は、この追加の知見は提案した枠組みなしには信頼できる形で得られないと述べる（抄録）。解釈：曝露写像の選び方と均衡の一意性の条件が結果を左右し、実務でそれらをどう確かめるかが課題として残る。未査読のプレプリントである（RePEc経由、arXiv版）。", "unverified": "表1〜4の具体的な偏りと被覆率の値、識別条件の詳細（§3）は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "事前学習済み埋め込みで画像・文章を計量経済に使う", "title": "Econometrics with Pre-Trained Embeddings for Unstructured Data", "url": "https://econpapers.repec.org/RePEc:arx:papers:2607.17378", "authors": "Yuya Shimizu", "venue": "RePEc", "date": "2026-08-24", "why": "画像や文章を事前学習済みの埋め込みで変数にしたときの推定の偏りと推測を扱い、非構造化データを使う実証経済学の標準的な手順に関わる。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（抄録、§1序論の主要な結果と実務への指針、図1の説明）を読んだ。§3〜4の定理と証明、付録は未読", "preprint": true, "p1": "画像や文章を、計算機科学者が作った事前学習済みモデルの埋め込み（embedding）に変えて計量経済分析の共変量に使う実務について、その推定が妥当になる十分条件と収束の速さを示し、二重機械学習（DML）で有効な推測ができる条件を明らかにした（抄録、§1）。", "p2": "事前学習済みモデルは別のデータ・別の課題で学習されているため、目的の分析で信頼して使える条件が不明で、しかも埋め込み関数そのものが識別できない（一意に決まらない）ため、その推定誤差が目的の推定に与える影響を分析しにくかった（抄録）。", "p3": "事前学習（元の課題）から目的の課題への転移学習として定式化し、①両方の課題が近似的に同じ「真の埋め込み関数」を共有すること、②元の課題の識別集合の近傍が目的の課題の近傍に含まれること（転移可能性）を仮定する。ニューラルネットの最終層を埋め込みにして線形モデルを載せる場合、②は目的の課題の係数が元の課題の係数の線形の張る空間にあることを意味する（§1）。例：商品の画像と説明文の埋め込みで品質を統制し、需要の価格弾力性を推定する。", "p4": "元の標本と目的の標本の両方の不確実性を含めた収束の速さを導き、転移可能性を満たす設計と満たさない設計のシミュレーションで推定値の分布を比べる（§1、図1）。部分線形回帰、画像・文章で品質を測る需要推定、欠測の補完、非構造化データの交絡がある平均処置効果への適用例を示す（抄録）。", "p5": "これらの条件の下で、転移学習の収束の速さはn^{-1/4}より速くなりえ、これはDMLで有効な推測をするのに十分である（§1）。目的の課題での速さは、元の側と目的の側の遅い方で決まる。転移可能性を満たす設計では推定値が真値付近に集まり、満たさない設計では明らかにずれた（図1）。", "p6": "著者は、実務への指針として、埋め込みは前の層より最終層を使う方がよいこと、最終層でも埋め込みは可逆な線形変換を除いてしか識別されないため、LASSOのような変数選択は不安定で、リッジ回帰や浅いニューラルネットを使うべきことを挙げている（§1）。深層学習の収束の速さは今後改善しうると述べる。解釈：転移可能性の条件を実データで確かめる方法は難しく、仮定の妥当性の判断が実務の課題として残る。未査読のプレプリントである（RePEc経由、arXiv版）。", "unverified": "収束の速さの具体的な式と、転移可能性の十分条件・必要条件の詳細（§3）は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "配偶者の健康が公的介護の利用を抑える", "title": "The Protective Effects of a Healthy Spouse: Medicare as the Family Member of Last Resort", "url": "https://doi.org/10.3386/w35784", "authors": "Itzik Fadlon ほか", "venue": "NBER Working Paper", "date": "-", "why": "配偶者の急な健康悪化が相方の介護施設利用を増やすことを請求データで示し、家族介護の価値と長期介護保険の設計を定量化する。", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、結論）を読んだ。推定の各節と付録の表は序論の要約で確認", "preprint": true, "p1": "配偶者が心筋梗塞や脳卒中で急に倒れると、もう一方の配偶者の介護施設入所が約30%増えることをメディケアの請求データで示し、その変化から家族（配偶者）による介護の価値の下限を推定して、長期介護の保険を世帯単位で設計すべきことを示した（抄録、§1）。", "p2": "家族による無償の介護（informal care）は記録されず価値の推計も860億〜5,000億ドル超と幅がある。公的な介護保険は、安価な家族介護がある人ほど公費の介護を使い過ぎる（モラルハザード）おそれと、家族介護のない人の保障不足の間で設計を迫られるが、米国のメディケアは世帯構成に関係なく同じ給付をしている（§1）。", "p3": "メディケアの請求記録で夫婦を特定する独自の対応表を作り、介護施設の全数記録と結ぶ。一方の配偶者が急な健康ショックを受けたときの、もう一方の介護施設利用の変化を推定する。さらに、入院後の熟練看護施設（SNF）の自己負担が21日目から急に上がる制度を使った回帰不連続デザインで、配偶者が健康な人と倒れた人の価格への反応の違いを測り、2本の需要曲線の間の面積を家族介護への支払意思額の下限とみなす（§1）。", "p4": "介護施設への入所確率、配偶者の健康ショック後の健康状態、自己負担の境目での退所率の変化（価格弾力性）を比べ、モデルで最適な補助の水準と給付設計の厚生効果をシミュレーションする（§1）。", "p5": "配偶者の健康ショックで、もう一方の翌年の介護施設入所の確率が平均30%上がり、その多くは家族介護から公的な介護への置き換えだった（§1）。配偶者が健康でないときの公的介護1日の追加の消費者余剰は約568ドル高く、これは介護施設1日の費用の約1.6倍にあたる（§1）。最適な補助は配偶者が病気の人で健康な人より80%大きく、政府支出を一定にしたまま給付を配偶者が倒れた人に移すと社会厚生が13.4%増えるとの試算だった（§1）。", "p6": "著者は、推定値は家族介護の価値の下限であり、公的介護と家族介護の代替性が高いほど実際の価値に近づくと述べる（§1）。解釈：対象は夫婦のそろったメディケア受給者で、子による介護や単身者には直接当てはまらない。NBERワーキングペーパーで、査読前の版である。", "unverified": "健康ショックの推定の細部（事象研究の図、異質性の分析）と動学モデルの前提は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "米中貿易戦争で中国輸出は第三国へ向かった", "title": "The Remains of the Trade: The U.S.–China Trade War and its Aftermath", "url": "https://doi.org/10.3386/w35785", "authors": "Pol Antràs ほか", "venue": "NBER Working Paper", "date": "-", "why": "米国向けから第三国向けへの中国輸出の振り替えと波及を月次データで示し、関税政策の国際的な帰結を評価する。日本を含む第三国への影響を考える材料になる。", "explain": {"basis": "本文", "basis_note": "Semantic Scholarで所在が分かったNBERワーキングペーパーのPDF本文（抄録、§1序論の貢献の要約、§3の輸入競争指数の節の一部、結論）を読んだ。§2のデータの詳細と国別の表は未読", "preprint": true, "p1": "米中貿易戦争で米国向けから第三国向けに振り向けられた中国の輸出が、各国にどう効くかを、「輸出での競争」「国内市場での輸入競争」「消費者の利益」「安い中間財による調達の利益」の4つの経路に分けて理論的に導いた指数で測り、よく使われる貿易品目の類似度指標では見誤ることを示した（抄録、§1）。", "p2": "世界の貿易のGDP比は横ばいで「脱グローバル化」ではないが、2018年以降、誰が何を誰と取引するかは大きく組み替わっている（§1、図1）。第三国への影響は輸出・輸入の品目構成の類似度で近似されることが多いが、それは対称的で、品目ごとのショックの大きさや中国の市場浸透度、代替の弾力性などを含まない（抄録）。", "p3": "最新の関税情報と月次の国際貿易データで、米国の輸入先の変化と中国の輸出先の変化を記録する。そのうえで、中国の品目別の輸出価格の低下を共通のショックとし、国ごとの輸出先・部門・投入産出の結びつきによる影響の受け方（重み）を掛け合わせて、4つの経路の指数を作る（§1）。例：同じ中国製品の値下がりが、ある国には輸出市場での競争として、別の国には安い部品による調達の利益として効く。", "p4": "作った指数と、従来の輸出類似度・輸入類似度の指標との国別の相関と順位の違いを比べ、指数が示す影響の大きさを求める。米国市場への依存度が高かった品目ほど、その後の中国の輸出の振り替えが大きかったかも確かめる（§1、§4）。", "p5": "輸出類似度と輸出競争指数の国別の相関は0.493にとどまり、輸入類似度と輸入競争指数の相関は110か国でほぼゼロ（0.039の負）だった（§1、§3）。輸出競争指数は世界の上位20経済のいくつかで0.4〜0.9%の輸出減少を示し、最も影響を受ける国では輸入競争で国内販売が3%を超えて減り、消費者・調達の利益が1%を超える国もあった（§1）。輸入競争と輸入類似度の上位20か国に共通して入ったのは、チェコ、日本、ポーランドだけだった（§3）。", "p6": "著者は、4つの経路は互いに排他的でなく、1つの国が複数の経路で同時に影響を受けうると述べている（結論）。解釈：指数はモデルに基づく予測値で、実際の各国の輸出や国内販売の変化で検証したものではない。NBERワーキングペーパーで、査読前の版である。", "unverified": "§2の関税と貿易の振り替えの具体的な数値、日本の各指数での順位と値は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "出産の遅れが重なり祖母になる年齢が57歳に", "title": "Compound Delay: The Causes and Consequences of Later Grandmotherhood", "url": "https://doi.org/10.3386/w35773", "authors": "Dora L. Costa ほか", "venue": "NBER Working Paper", "date": "-", "why": "出産年齢の上昇が世代をまたいで重なり、健康な祖母が孫と過ごせる年数を大きく減らすことを示す。少子高齢化の家族への影響を捉える視点で、日本にも当てはまりうる。", "explain": {"basis": "本文", "basis_note": "Semantic Scholarで所在が分かったNBERワーキングペーパーのPDF本文（§3の表1の説明、§4国勢調査の結果、§7の生殖管理の反実仮想、結論）を読んだ", "preprint": true, "p1": "母と娘の2世代の出産の遅れが掛け合わさって、初めて祖母になる年齢を大きく押し上げること（複合的な遅延）を示し、それによって健康なうちに孫と過ごせる年数が28年から15年に減ると推計した（抄録）。", "p2": "出産の高年齢化は本人の世代の問題として論じられがちで、祖父母の世代への影響、つまり娘の出産時期が母親の人生に及ぼす影響は、娘の意思決定には入らない外部性として見過ごされてきた（抄録、§1）。", "p3": "ある年の年齢別の初産率が母と娘の両方に当てはまると仮定し、その分布を自分自身と畳み込んで「祖母になる年齢」の分布を作る（§3）。1960・1980・2000・2024年の出生スケジュールで比べ、さらにIPUMSの国勢調査とACSから学歴・人種別の合成コホートの初産率を作り、避妊など生殖の管理手段へのアクセスの有無の反実仮想で寄与を分ける（§4、§7）。例：母が24歳、娘も24歳で初産なら48歳で祖母になるが、両方が遅れると遅れが足し合わさる。", "p4": "祖母になる年齢の中央値と四分位、60歳までに祖母になる確率、55歳までに祖母になる確率の学歴・人種別の推移、そのうち生殖管理へのアクセスで説明される割合を示す（§3〜§7、表1・表5）。", "p5": "祖母になる年齢の中央値は、1960年の出生スケジュールで約44歳、1980年47歳、2000年50歳、2024年57歳で、13年の上昇のうち約7年は2000年以降に起きた（§3、表1）。2007年と2024年を比べると初産年齢の中央値は24.7歳から27.9歳へ約3年上がっただけだが、祖母になる年齢の中央値は50.7歳から56.1歳へ5.5年上がり、60歳までに祖母になる確率は83%から67%に下がった（§3、図1）。祖母になる時期の遅れは人種より学歴で分かれ、1949年生まれの白人大卒女性では、55歳までに祖母になる確率の低下の56%が生殖管理へのアクセスで説明された（§4、§7）。", "p6": "解釈：表1は期間の出生率を仮想コホートに当てはめた計算で、実際のコホートの経験とは異なりうる（著者も§4以降でコホートの推計に置き換えている）。米国のデータであり、日本の値は示されていない。NBERワーキングペーパーで、査読前の版である。", "unverified": "表5の他の学歴・人種の群の値と、祖母の介護・資金提供の分析（§6）の数値は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "同じ上司が会議で助けも害もする一貫しないリーダーシップ", "title": "When the Same Leader Helps and Harms: Inconsistent Leadership Behavior in Team Meetings", "url": "https://doi.org/10.31234/osf.io/9pgk7_v1", "authors": "Amelie Verena Güntner ほか", "venue": "PsyArXiv", "date": "2026-09-26", "why": "建設的な行動と破壊的な行動を同時に見せる「一貫しないリーダーシップ」がチーム会議で部下に与える影響を扱い、心理的安全性とリーダーシップ研究の新しい論点を示す。", "explain": {"basis": "本文", "basis_note": "PsyArXivのプレプリント本文（抄録、方法の参加者・手続き・評定、結果、考察の限界）を読んだ。仮説の理論部分と表1の個別数値は一部のみ確認", "preprint": true, "p1": "同じリーダーが建設的な行動と破壊的な行動を同時に示す「一貫しないリーダーシップ」を、部下の認知ではなく実際の行動として会議の録画から測り、道具的リーダーシップ（instrumental leadership）が行動計画を通じてチームの対立的な発言を減らす効果は、破壊的な行動が少ないときにしか現れないことを示した（抄録）。", "p2": "一貫しないリーダーシップは部下にとって悪い結果と結びつくことが知られていたが、ほぼもっぱら部下の知覚として研究されており、リーダーが実際にどう振る舞い、それがチームの行動をどう変えるかは調べられていなかった（抄録）。", "p3": "ドイツの自動車部品企業と電子機器企業の製造ラインの30チーム（メンバー209人、リーダー30人）の、課題解決のための定例会議の録画を使う（方法）。訓練を受けた5人の評定者がリーダーの道具的行動と破壊的行動（怒鳴る、提案を無視するなど）を評定し、発言単位でリーダーの行動計画とメンバーの対立関連の発言を符号化した（5,430の行動、抄録）。多層の調整媒介モデルをベイズ推定する。例：会議で明確な目標と手順を示すリーダーでも、途中で部下の提案を無視すれば効果が消えるかを見る。", "p4": "道具的リーダーシップ×破壊的リーダーシップの交互作用がリーダーの行動計画に与える影響と、行動計画を介したメンバーの対立関連の発言への条件付き間接効果（破壊的行動が平均より1標準偏差低い・高い場合）を推定する（結果）。評定者間の一致はICCで確かめた（道具的：ICC2 = .88、破壊的：ICC2 = .86）。", "p5": "道具的リーダーシップと行動計画の直接の関連ははっきりしなかったが（B = .137）、破壊的リーダーシップとの交互作用が見られ（B = -.445、90%-CI = [-.771; -.141]）、破壊的な行動が少ないときだけ正の関連になった（結果、図2）。行動計画は対立関連の発言を減らした（B = -.262）。条件付き間接効果は破壊的行動が低いとき -.146（90%-CI = [-.342; -.020]）で、高いときは .072で区間がゼロを含み、差は .224だった（結果）。", "p6": "著者は、1回の会議の観察に限られ時間を通じた変化は分からないこと、リーダーが全員男性で製造ラインのチームにほぼ限られること、部下の知覚を測っていないことを限界に挙げ、縦断的な研究と知覚との対応づけを課題としている（考察）。解釈：30チームの観察研究で、区間は90%の信用区間で報告されており、因果の向きは確定できない。未査読のプレプリントである。", "unverified": "行動計画と対立関連の発言の符号化の信頼性の数値と、表1の記述統計は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "自由移動圏での国際移住の賃金上昇を測る", "title": "The Returns to International Migration in a Free Mobility Setting: Evidence from Austria and Germany", "url": "https://doi.org/10.3386/w35774", "authors": "Andrea Weber ほか", "venue": "NBER Working Paper", "date": "-", "why": "オーストリアとドイツの連結行政データで元同僚を比較群にし、移住による所得の増加とその個人差を推定する。", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "オーストリアとドイツの行政データを国境を越えて結び、元の同僚を比較群にすることで、国際移住による賃金の上昇とその個人差を、移住先にとどまる人と戻る人に分けて推定した（抄録）。", "p2": "国際移住でどれほど所得が増えるか、それが移住者によってどう違うかは、移住する人が選ばれた人であること（選抜）と、帰国後を追えないことのために測りにくい（抄録）。", "p3": "移住前の2〜4年に安定して雇用されていた人を対象に、同じ職場の元同僚をマッチングした比較群とする差の差の分析を行い、出身国と移住先の両方のデータで移住後5年を追う（抄録）。国内の大都市（ウィーン、ドイツの5大都市）への移動も同じ方法で分析して比べる。", "p4": "マッチした元同僚に対する日給の上昇率を、移住の向き、滞在期間（とどまる・1〜4年で戻る・1年未満で戻る）、職場間の既存のつながりの有無で比べる（抄録）。", "p5": "オーストリアからドイツへの移住者は元同僚より日給が約13%上がり、その差はすぐに現れて続いた。ドイツからオーストリアへの移住者は約4%だった（抄録）。差は選抜の違いではなく主にドイツの平均賃金の高さによる。移住先にとどまる人で最も大きく、1年未満で戻る人ではゼロかわずかに負だった。大都市への国内移動では、オーストリア人で約5%、ドイツ人で約10%の上昇だった（抄録）。", "p6": "解釈：言語と制度が近い自由移動圏での結果で、言語や資格の壁が大きい移住への一般化には注意が要る。安定雇用者に限った標本でもある。NBERワーキングペーパーで、査読前の版である。", "unverified": "標本の人数と推定の信頼区間は本文未入手のため確認できなかった。"}}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "戦後の退役軍人給付で見る給付金の景気効果", "title": "The Macroeconomic Effect of Stimulus Checks: Evidence from Postwar Veterans’ Payments", "url": "https://doi.org/10.3386/w35786", "authors": "Joao Guerreiro ほか", "venue": "NBER Working Paper", "date": "-", "why": "景気と無関係に決まった第二次大戦後の一時給付を自然実験に使い、現金給付が消費と経済に与える効果を推定する。", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "第二次世界大戦後の米国の退役軍人への一時金を、景気と無関係に決まった「給付金」の自然実験として使い、現金給付が消費をどれだけ、どんな時間の形で押し上げるかを推定した（抄録）。", "p2": "赤字で賄う一回限りの一律給付（stimulus checks）が経済を押し上げるかは、給付の時期が景気に合わせて決まるため、因果効果を識別しにくい（抄録）。", "p3": "戦後の退役軍人への支払いは給付金に似た性質を持ちつつ、支給の時期が景気とは無関係に決まったと考えられる点を使い、移転支出と消費の時間的な反応を推定する（抄録）。「移転乗数」は、移転1ドルあたりの消費の累積の反応である。", "p4": "消費の反応の時間的な形と移転乗数の大きさを推定し、標準的な異質的エージェント・ニューケインジアン（HANK）モデルと、期待が不完全なモデルの予測と比べる（抄録）。", "p5": "支払いは移転を一時的に増やし、消費を持続的な山型（hump-shaped）に押し上げた。移転乗数は6か月後に1、1年後に2を超えた（抄録）。標準的なHANKモデルは山型の反応を再現できず、家計が当初は過小反応し長期では過大反応する不完全な期待を入れたモデルで推定値に合った（抄録）。", "p6": "解釈：戦後直後の経済は供給制約や物価の動きが現在と大きく違い、現代の給付金への一般化には注意が要る。NBERワーキングペーパーで、査読前の版である。", "unverified": "使った消費のデータの頻度と推定方法は本文未入手のため確認できなかった。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "品詞はSAEの特徴群として現れる", "title": "Parts-of-Speech as Emergent Categories in SAE Latent Space", "url": "https://arxiv.org/abs/2609.29362", "authors": "Alessandro Bondielli ほか", "venue": "arXiv", "date": "2026-09-25", "why": "スパースオートエンコーダの潜在表現に言語学的カテゴリがどう表れるかを品詞で統制して調べ、言語モデル内部の理解に言語学の知見を持ち込む。", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3方法、§4実験設計、§5.1・5.2・5.4結果、限界）と図表キャプションを読んだ。§5.3と付録の数値は未確認", "preprint": true, "p1": "言語モデルの内部表現を疎な特徴に分解するスパースオートエンコーダ（SAE）の中で、品詞（part-of-speech）が「1特徴＝1品詞」ではなく、品詞ごとに大きさの違う特徴のまとまりとして表れていることを、品詞を統制された試験台にして示した（抄録、§5.2）。", "p2": "SAEは言語モデルの表現を人が読める特徴に分ける方法として期待されているが、その特徴がどんな言語学的構造を持っているのか、文法的なカテゴリーが個々の特徴に対応するのか、特徴の群として分散しているのかは分かっていなかった（抄録、§1）。", "p3": "LLaMA-3-8Bの第30層の残差ストリームを公開のSAE（拡大率32倍、4096×32次元）で符号化し、Universal Dependencies英語GUMツリーバンク（14,353文・252,284語）の各語の特徴活性を得る（§3.1–3.2）。品詞ごとにL1正則化ロジスティック回帰で「その品詞か否か」を判別し、正の係数が大きい特徴から順に、その品詞の語の95%で少なくとも1つが活性化するまでの最小の特徴数を数える（§4.2の被覆率の式）。例：名詞を判別する分類器の上位の特徴を足していき、名詞の95%を覆うのに何個要るかを見る。", "p4": "品詞の判別の精度（5分割交差検証のF1）、品詞ごとの必要特徴数、選んだ特徴だけで多クラス分類したときの精度、学習に使わないテストデータと180語の統制データでの活性の安定性を見る。語ごとに品詞を無作為に割り当てた対照プローブで、語の暗記による見かけの精度を差し引く（§4.1–4.4）。", "p5": "ほとんどの品詞でSAEの特徴から高いF1で判別でき、閉じた品詞（前置詞など）や句読点は判別しやすかった（§5.1、図2）。開いた品詞（名詞・動詞など）ほど多くの特徴を使い（図3）、必要な特徴数は品詞によって大きく違った（図4）。選ばれた498特徴（12%は2つ以上の品詞に共有）だけの多クラス分類は、全特徴の場合と同程度の精度だった（§5.2、図5）。無作為ラベルの対照は正解率0.54・マクロF1 0.42で、本来のプローブ（正解率0.88）より大きく低かった（§5.4）。", "p6": "著者は、品詞は言語の1つの階層にすぎないこと、1つのモデル・1つのSAEに限ること、プローブの係数は因果の証拠ではなく介入実験が必要なこと、統制データが小さく名詞と動詞中心であることを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "本来のプローブのマクロF1が本文では0.97、表2では0.78と食い違っており、どちらが正しいか確認できなかった。§5.3（テストデータでの検証）の数値も未確認。"}}, {"id": "pn16", "rank": 16, "field": "経営学", "headline": "利払い控除の制限で企業のイノベーションが縮む", "title": "When Tax Shields Shrink: Interest Deductibility Limitations and Corporate Innovation", "url": "https://doi.org/10.3386/w35775", "authors": "Xinru Chen ほか", "venue": "NBER Working Paper", "date": "-", "why": "2017年の米国税制改革による利払い控除の制限が、影響を受けた企業の特許と技術の幅を狭めたことを示し、税制と企業の革新の関係に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "2017年の米国税制改革（TCJA）で支払利子の損金算入が制限されたことが、企業のイノベーションを減らしたことを示した（抄録）。", "p3": "制限の影響を受けた企業と受けない企業を複数の識別戦略で比べ、特許の件数と技術の範囲を調べる。各国で利子制限の規則が時期をずらして導入されたことを使った国際比較も行う（抄録）。", "p5": "影響を受けた企業は特許が大きく減り、特許の技術範囲も狭まった。減少は既存技術を深める「活用型」の特許に集中した（抄録）。著者は、負債の節税効果が暗黙の補助金として働いていたと解釈している。NBERの査読前の版である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn17", "rank": 17, "field": "経営学", "headline": "巨大IT企業による1,200件の新興企業買収の前後", "title": "Digital (Killer?) Acquisitions", "url": "https://doi.org/10.3386/w35762", "authors": "Florian Ederer ほか", "venue": "NBER Working Paper", "date": "-", "why": "巨大テック企業8社による新興企業の買収の前後で特許と人材を追い、「革新をつぶす買収」の実態を大規模データで検証する。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "大手テック企業8社による1,200件のスタートアップ買収の前後で、イノベーションがどう変わるかを特許と人材のデータで調べ、買収がイノベーションを抑える「キラー買収」の証拠は全体として乏しいと報告した（抄録）。", "p3": "買収案件に特許データと従業員のデータを結びつけ、比較可能な特許との引用の差、従業員・発明者の離職と、残った人・辞めた人の特許の数を比べる。観察されたパターンを説明する簡単なモデルも示す（抄録）。", "p5": "買収された企業の多くは特許を持たず、イノベーションは買収前に増え、その後の買収が続く分野でだけ続いた（抄録）。買収された特許は買収後に引用が増え、1年以内に従業員の31%、発明者の23%が辞めたが、残った発明者は特許を大きく増やした。著者は、これらは買収の効果より選別で説明できると述べる。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "高校での教職体験は教員の供給と多様性を増やすか", "title": "Can Early Exposure to the Teaching Profession Increase Teacher Supply and Diversity? New Evidence on the Teacher Pipeline", "url": "https://doi.org/10.3386/w35776", "authors": "Danielle Sanderson Edwards ほか", "venue": "NBER Working Paper", "date": "-", "why": "テキサス州で段階的に広がった高校の教育課程の効果を推定し、教員不足と多様性の政策に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "高校で教職を体験する授業を広げても、新任教員の数や多様性は増えなかったことを、米国テキサス州のデータで示した（抄録）。", "p3": "テキサス州で高校の教育系の授業が学校ごとに時期をずらして広がったことを使い、授業の導入が新任教員の供給と人種の多様性を変えたかを調べる（抄録）。", "p5": "受講者は教員全体より多様だったが、教員の供給や多様性が増えた証拠はほとんどなかった（抄録）。教員になった受講者は他と同じくらい効果的で、辞めにくかった。多くの受講者は大学入学前に離脱し、4年制大学への進学の人種差が大きな壁だった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "分散型リーダーシップが信頼と知識共有を通じ成果を高める", "title": "Distributed Leadership and Project Success: The Mediating Roles of Trust, Team Self-Efficacy and Knowledge Sharing", "url": "https://doi.org/10.2139/ssrn.7528823", "authors": "Rajdeep Dey ほか", "venue": "SSRN", "date": "2026-09-26", "why": "専門性が組織の境界を越えて分散するプロジェクトで、分散型リーダーシップが信頼・チームの効力感・知識共有を通じて成功に結びつく経路を扱う。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "プロジェクトの成功を、任命されたマネジャー個人ではなく、チームに分散したリーダーシップから説明する枠組みを、文献の統合的レビューで作った（抄録）。", "p3": "組織・プロジェクトの研究、基礎的なメタ分析、最近の査読論文を統合し、分散型リーダーシップが「チーム内の信頼」「チームの自己効力感」「知識共有」の3つを介して成功につながる仕組みを整理する（抄録）。", "p5": "分散型リーダーシップは、単に複数のリーダーがいることではなく、影響力の協調したパターンとして理解するとき最も役立つと結論した（抄録）。3つの媒介要因は理論的に別物で、信頼は対人的な弱みを減らし、知識共有は仕事の理解を動かし、自己効力感は不確実な状況での努力を支えるとする。実証研究ではない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn20", "rank": 20, "field": "経営学", "headline": "生成AIの創造的・戦略的な能力を大規模実験で比較", "title": "Creative and Strategic Capabilities of Generative AI: Evidence from Large-Scale Experiments", "url": "https://econpapers.repec.org/RePEc:cpr:ceprdp:19507", "authors": "Bohren ほか", "venue": "RePEc", "date": "2026-08-24", "why": "生成AIと人間の創造的・戦略的な課題の能力を大規模な実験で比べ、経営における生成AIの使いどころを考える実証の材料になる。", "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": true, "short": true, "p1": "生成AIの創造的な能力と戦略的な能力を、大規模な実験で調べた研究（CEPRのディスカッションペーパー）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "AIでプラットフォームが強くなると補完企業への侵食が進む", "title": "Shared Foundational Capability and Platform Encroachment in Software Ecosystems", "url": "https://doi.org/10.2139/ssrn.7528965", "authors": "Liaoliao Li ほか", "venue": "SSRN", "date": "2026-09-26", "why": "AIでソフトウェアプラットフォームの基盤能力が高まると、第三者開発者との協業と侵食の関係がどう変わるかを理論的に分析する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIでソフトウェアのプラットフォームの基盤能力が強まると、プラットフォームが下流の開発者の市場へ参入（侵食）する誘因がどう変わるかを、ゲーム理論のモデルで調べた（抄録）。", "p3": "基盤能力を持つプラットフォーム、付加価値の能力を持つ開発者、ソフトの機能を価値に変える力が異なる消費者からなるモデルを作り、参入の費用と両者の能力が参入の判断に与える影響を分析する（抄録）。", "p5": "参入の費用が高すぎなければ、基盤能力が強まるにつれて「参入しない→参入する→参入しない」と2回戦略が入れ替わり、参入は中程度の能力のときだけ最適になった（抄録）。開発者の付加価値の能力が強いと、かえって参入の誘因が強まる場合もある。理論モデルの結果である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "基盤モデルの共有は研究探索を狭めうる", "title": "Foundation Models as Innovation Infrastructure Search Narrowing and the Efficiency-Diversity Trade-off in the Life Sciences", "url": "https://doi.org/10.2139/ssrn.7528974", "authors": "Meng Zhou ほか", "venue": "SSRN", "date": "2026-09-26", "why": "生命科学で共有される基盤モデルが探索の幅を狭め、効率と多様性のトレードオフを生む可能性を論じ、AI時代のイノベーション管理の論点を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "生命科学で基盤モデルが共有のインフラになると、技術探索の効率は上がるが分野全体の探索の方向が狭まる「探索の狭まり」が起きうると論じた（抄録）。", "p3": "探索と活用の枠組み、組み換え探索の理論、進化的なイノベーション理論にもとづき、AIが分析の道具から探索のインフラへ変わる3段階と、ベンチマークの標準化・学習データの集中・プラットフォーム依存・誘因の一致という4つの仕組みを示し、医療と農業の事例で説明する（抄録）。", "p5": "2つの分野に似た圧力がありうることを示し、効率と多様性のトレードオフを管理する組織・政策上の仕組みと、仮説を実証するための研究課題を提案した（抄録）。理論的な論考で、狭まりが実際に起きているかは検証していない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "選択的な産業政策がゾンビ企業を生む", "title": "Industrial Policy and the Corporate Undead", "url": "https://doi.org/10.2139/ssrn.7528504", "authors": "Jie Li ほか", "venue": "SSRN", "date": "2026-09-26", "why": "2009年の中国の十大産業振興計画を準自然実験として、選択的な産業政策がゾンビ企業の形成に及ぼす影響を推定する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国の2009年の「十大産業振興計画」という選択的な産業政策が、存続すべきでない「ゾンビ企業」を生んだことを、準自然実験で示した（抄録）。", "p3": "計画の対象となった10産業の企業と対象外の企業を比べ、市場からの退出、生産性、ゾンビ企業になる確率を調べる。計画への関わりの強さ、地方政府の介入の強さでの違いも見る（抄録）。", "p5": "対象産業の企業は退出しにくく、生産性が低く、ゾンビ企業になりやすかった（抄録）。計画への関わりが強い企業、地方政府の介入が強い地域で効果が大きく、著者は政府の非効率な介入が市場の仕組みを損なうという「奪う手」理論と整合的だと解釈している。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "最低資本金の引き下げは起業の量と質をどう変えたか", "title": "Regulating Entrepreneurship: The Case of Capital Requirements", "url": "https://doi.org/10.3386/w35780", "authors": "Annika Bacher ほか", "venue": "NBER Working Paper", "date": "-", "why": "ノルウェーの最低資本金の引き下げを使い、起業の参入と企業の質のトレードオフを包括的な行政データで検証する。", "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": true, "short": true, "p1": "起業に必要な最低資本金などの資本規制が、起業にどう影響するかを調べた研究（NBERワーキングペーパー）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "ベイズのスペクトル回帰のミニマックス最適性と飽和", "title": "Minimax Optimality and Saturation in Bayesian Spectral Regression", "url": "https://doi.org/10.2139/ssrn.7529175", "authors": "Dongu Han", "venue": "SSRN", "date": "2026-09-26", "why": "スペクトル事前分布を使うベイズ回帰の事後収縮の速さを理論的に明らかにし、事前分布の選び方の指針を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベイズの回帰で、係数の事前分散の減り方（幾何級数的か、多項式的か）によって、事後分布が最適な速さで真の関数に集中するか、頭打ち（飽和）になるかが決まることを証明した（抄録）。", "p3": "ガウス誤差の固定計画の回帰で、コサイン基底の係数に減衰する分散を置くスペクトル事前分布を考え、解析的な回帰関数のクラスについて事後分布の収束の速さを理論的に導く（抄録）。", "p5": "幾何級数的に減衰する事前分布は、真の関数の滑らかさと整合すればミニマックスの速さ√(log n/n)で収束した（抄録）。多項式的に減衰する事前分布では、どの有限の次数νでもn^{-ν/(2ν+1)}の速さにとどまり、それより速くはできないことを示した。理論の結果で、数値例は抄録にない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "欠測のある共変量で使えるニューラルネット回帰", "title": "Deep learning with missing data", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:139005", "authors": "Wu ほか", "venue": "RePEc", "date": "2026-08-24", "why": "共変量に欠測がある多変量の非パラメトリック回帰で、欠測のパターンを埋め込むニューラルネットを提案し、実データ分析の現実的な課題に対応する。", "explain": {"basis": "抄録", "basis_note": "LSEの研究リポジトリ（RePEc経由）の抄録（Semantic Scholar）を使用", "preprint": true, "short": true, "p1": "共変量に欠測がある回帰で、どの変数が欠けているかのパターン自体をニューラルネットで表現して予測に組み込む「PENN」を提案し、欠測の仕組みを問わず成り立つ理論保証を示した（抄録）。", "p3": "補完したデータで学習するネットワークに加え、観測の有無を示すベクトルを別のネットワークでまとめ、第3のネットワークで両者を結合して予測する（抄録）。既存のどの補完方法とも組み合わせられる。欠測パターンの区分ごとに回帰関数が似た振る舞いをするという仮定のもとで、有限標本の過剰リスクの上界と下界を導く。", "p5": "PENNは、パターンの区分を事前に知っている場合と同じミニマックスの速さを、対数の因子を除いて達成した（抄録）。シミュレーション、半合成、実データの実験で、パターンの埋め込みを使わない標準のネットワークを一貫して、しばしば大きく上回った。再現用のコードも公開されている。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "ニューラルMIDASの予測改善は比較対象の選び方次第", "title": "Comparator Choice in the Evaluation of Density Neural MIDAS Nowcasts", "url": "https://doi.org/10.2139/ssrn.7525118", "authors": "Hyun Hak Kim", "venue": "SSRN", "date": "2026-09-25", "why": "GDPの即時予測で報告されてきた改善が比較対象の選び方に依存することを示し、予測モデルの評価の作法を問い直す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国GDPの速報推計（ナウキャスト）で大きな改善を報告してきた密度型ニューラルMIDASモデルは、単純な自己回帰と比べると劣ることを、事前に定めた手順で示した（抄録）。", "p3": "公表されたQRNN-MIDASモデルを著者の仕様どおりに実装し、四半期ごとに更新する自己回帰を基準とする3段階の比較群に入れ、四半期内の各月の時点で別々に採点する（抄録）。", "p5": "公表モデルは事前に定めた主要な18の条件すべてで自己回帰より悪く、著者自身が評価しようとした構造化ニューラル推定量も同様だった（抄録）。64四半期のうち3四半期が損失差の70〜80%を占め、比較群や損失の選び方で結論が動くと著者は指摘する。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "同じ行動を男女で評価させてジェンダー態度を測る", "title": "Measuring Gender Attitudes Toward Men and Women", "url": "https://doi.org/10.3386/w35761", "authors": "Joshua T. Dean ほか", "venue": "NBER Working Paper", "date": "-", "why": "同じ行動を男性と女性に割り当てて評価を比べる新しい測定法で、従来の質問紙では分からないジェンダー中立性を測る。", "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": true, "short": true, "p1": "男性と女性それぞれに対するジェンダーに関する態度を測る方法を扱った研究（NBERワーキングペーパー）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "因果推論", "headline": "因果機械学習で住宅の省エネ性能の価格効果の異質性を推定", "title": "Heterogeneous Effects of Home Energy Efficiency in the UK Housing Market: Evidence from Causal Machine Learning Approaches", "url": "https://doi.org/10.2139/ssrn.7528612", "authors": "Yunbei Ou ほか", "venue": "SSRN", "date": "2026-09-26", "why": "英国の住宅市場で省エネ性能が価格に与える効果の異質性を因果機械学習で推定し、省エネ政策の設計に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "英国グレーター・マンチェスターの住宅市場で、省エネ性能の高い住宅の価格上乗せが住宅の種類や地域でどう違うかを、因果機械学習で調べた（抄録）。", "p3": "2017〜2024年の住宅取引で、エネルギー性能証明（EPC）でC以上の住宅とそれ未満の住宅を比べ、X-、DR-、R-learnerという3つのメタ学習器で異質な効果を推定する（抄録）。", "p5": "省エネ性能の高い住宅は平均で2%高く売れた（抄録）。上乗せは古い住宅、テラスハウス、借地権の住宅、低価格の住宅、低所得・高密度・交通の便がよい地域で大きかった。3つの学習器で結果が一致した。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "設計仕様だけからネットワークの容量を測る指標", "title": "Neural Spectral Capacity: Measuring and Designing Architectures from Network Specification Alone", "url": "https://arxiv.org/abs/2609.23087", "authors": "Chenyu Zhu ほか", "venue": "arXiv", "date": "2026-09-25", "why": "パラメータ数や計算量では区別できない構造の違いを、設計仕様だけから測る「スペクトル容量」で評価し、Transformerの設計と圧縮の指針を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Transformerなどの構造の「容量」を、各重み行列の特異値の分布から閉じた式で測る指標NSCを提案し、モデルを作らず・データも使わずに設計の比較と最適化ができるようにした（抄録）。", "p3": "標準的な乱数初期化ではマルチェンコ・パスツール則により、NSCを構造の仕様だけから計算できる。層ごとに足し合わせられる性質を使い、資源の制約のもとでNSCを最大にする構造を動的計画法（NSC-DP）で厳密に求める（抄録）。", "p5": "7つのTransformer・CNNの系統で、NSCはパラメータ数、FLOPs、既存の学習不要の指標より構造の順位づけが良かった（抄録）。FlexiBERTでパラメータ数の差が10%未満の組では、NSCの順位相関τ= 0.505に対しパラメータ数は0.082だった。未査読のプレプリントである。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "信頼境界を組み込んだエージェント用のOS", "title": "AgentKernel: The Trust-Native Agentic Operating System", "url": "https://arxiv.org/abs/2609.29647", "authors": "Zhenhua Zou ほか", "venue": "arXiv", "date": "2026-09-25", "why": "信頼できない入力と特権的な指示・道具が混ざるAIエージェントの攻撃面に対し、OSの考え方で信頼境界を管理する設計を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントを安全に動かすには、アプリの中間層ではなく、身元・入力の仲介・記憶の管理・実行の制御を強制するOSの層が必要だと主張し、その設計AgentKernelを示した（抄録）。", "p3": "エージェントの一生を、Identity、Perception、Cognition、Executionの4つの柱からなる迂回できない境界で包み、古典的なOSの安全原則を、委任の乱用、プロンプト注入、記憶の汚染、道具の誤用といった意味の層の失敗に当てはめる（抄録）。", "p5": "既存の仕組みとの体系的な比較と安全性の分析で、1つの統合された構造がエージェントの一生全体で安全を強制できることを示したとする（抄録）。抄録からは実装での性能評価の有無は分からない。未査読のプレプリントである。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "差分だけを予測する世界行動モデルで両手操作を学ぶ", "title": "DeltaWAM: Delta World Action Models for Bimanual Manipulation", "url": "https://arxiv.org/abs/2609.28811", "authors": "Han Yan ほか", "venue": "arXiv", "date": "2026-09-25", "why": "未来のフレーム全体ではなく変化の差分を予測する世界行動モデルで、ロボットの両手操作の学習を効率化する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前学習した動画生成モデルを使うロボット制御（世界行動モデル）で、未来の画像全体ではなく「変化分（デルタ）」だけを予測することで、両腕操作の成功率を上げ、計算を減らした（抄録）。", "p3": "基準の画像、まばらな変化分、行動の3つの流れを同時に予測する構造を3種類作り、推論時には過去の文脈に観測した変化分だけを加えて更新するStreaming Delta Memory（SDM）で重い動画処理を減らす（抄録）。", "p5": "RoboTwinで、SDM付きのDeltaWAMは平均成功率をFast-WAMの81.3%から85.4%へ、見た目を乱した条件では75.8%から83.9%へ上げた（抄録）。学習のFLOPsは17.78-23.77%減り、SDMは1ステップの推論の遅れを36.57%減らした。未査読のプレプリントである。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "表現の分布合わせで少ステップの動画生成を実現", "title": "ViRDM: Taming Representation Distribution Matching for Few-Step Causal Video Generation", "url": "https://arxiv.org/abs/2609.28923", "authors": "Zichong Meng ほか", "venue": "arXiv", "date": "2026-09-25", "why": "大きな教師モデルやオンラインの批評器なしに、表現の分布を合わせることで少ステップの自己回帰型の動画生成を実現する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "少ないステップで逐次的に動画を生成するモデルの事後学習を、大きな教師モデルとオンラインの批評モデルなしに、生成器だけを事前に計算した目標分布に合わせる方法（ViRDM）で行えるようにした（抄録）。", "p3": "画像生成の表現分布マッチング（RDM）を動画に移す際の3つの壁（メモリに乗らない勾配の経路、動画特有の最適化、時間の動きを縛れない表現分布）を順に解き、確率的に打ち切る監督、軽いVAEデコーダ、段階的なベクトル・ヤコビ積を組み合わせる（抄録）。", "p5": "生成器の更新20回だけで公式のVBenchで84.87となり、少ステップの逐次生成の従来の最良を0.36上回った。必要な計算はA100で16 GPU時間だった（抄録）。未査読のプレプリントである。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "ガスが無料になると家庭の需要はどう反応するか", "title": "Responses to Extreme Price Changes: Evidence from the Residential Demand for Natural Gas", "url": "https://doi.org/10.3386/w35759", "authors": "Anna Alberini ほか", "venue": "NBER Working Paper", "date": "-", "why": "ジョージアでのパンデミック期のガス料金無料化という極端な価格変化への家庭の反応を測り、エネルギー需要の価格弾力性に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "コロナ禍の冬にジョージア（国）政府が家庭用ガスを事実上無料にした政策を使い、極端な価格変化に対する家庭のガス需要の反応を推定した（抄録）。", "p3": "2020年11月から2021年2月末まで、月200 m3以下の使用なら政府が料金を払った。毎冬ガスが無料になる地域（月700 m3まで）の住民を対照群、似た気候と人口密度で期間中だけ無料になった地域の世帯を処置群とし、天候を統制して比べる（抄録）。", "p5": "政策による処置群の平均処置効果（ATT）は、ガス使用量の2-7%の増加だった（抄録）。概算の需要の価格弾力性は-6.5%から-11%で、価格がゼロになっても使用量の反応は小さかった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "親の婚姻状態による子の成果の差は母親の資源で変わる", "title": "The Evolving Marriage Gap in Children’s Outcomes: Family Structure and Young Adult Outcomes Revisited", "url": "https://doi.org/10.3386/w35765", "authors": "Melissa Schettini Kearney ほか", "venue": "NBER Working Paper", "date": "-", "why": "家族構造と子の成果の差が母親自身の資源によって異なることを再検証し、家族政策の議論に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "親が結婚しているかどうかによる子どもの成人期の結果の差が、この10年でどう変わったかを、2023年のPSIDで再検討した（抄録）。", "p3": "母親自身の資源、パートナーが加える資源、結果ごとの資源の見返りで結婚による差が変わるとするKearney and Levine (2017)の枠組みを、2013年版に代えて2023年版の米国パネル調査（PSID）で当てはめる（抄録）。", "p5": "子ども時代の家族構造と若年成人の貧困との関連は大きく弱まったが、大学卒業との関連は残り、学歴の高い母親の子どもに集中していた（抄録）。著者は、ひとり親の経済状況は改善したが、家族構造による資源と高い教育の達成の差は残ると解釈している。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "中国からの借り入れは返済の繰り延べリスクで借り手を縛る", "title": "Borrowing in the Shadow of China", "url": "https://doi.org/10.3386/w35767", "authors": "Illenin O. Kondo ほか", "venue": "NBER Working Paper", "date": "-", "why": "中国の新興国向け融資の「不履行はできないが借り換えを迫られうる」構造が借り手の行動を規律することを理論と実証で示す。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "中国からの融資は踏み倒せない代わりに急な借り換え要求がありうるという独特の構造が、借り手の国の国際市場での借入を抑える「規律づけ効果」を持つことを、定量的な国債モデルで示した（抄録）。", "p3": "長期の国債と債務不履行のモデルに、不履行できず借り換えのリスクがある中国の融資を加え、中国への返済期に市場から借りる必要が生じることで市場の債務が希薄化するリスクを分析する。中国が国際市場からの離脱を条件に融資する陣営形成と、中国の資金が突然引き揚げられるリスクの下での最適な依存度も調べる（抄録）。", "p5": "中国の資金が入ると政府は民間市場の債務を減らし、データの市場債務と利回りの動きもこの規律づけ効果と整合的だった（抄録）。著者は、中国型の公的融資は市場での借入条件を改善しうる一方、新たな不安定要因にもなると結論している。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "リスクプレミアムが上がると企業は賃金の保険を弱める", "title": "Risk Premia, Firm Insurance, and Endogenous Labor Income Risk", "url": "https://doi.org/10.3386/w35781", "authors": "Maarten Meeuwis ほか", "venue": "NBER Working Paper", "date": "-", "why": "金融環境が企業による賃金の保険を通じて労働所得のリスクを左右することを、行政データとモデルで示す。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "金融市場のリスクプレミアムが上がると、企業が労働者に与える所得の保険が弱まり、労働者の所得リスクが高まることを、理論と米国の行政データで示した（抄録）。", "p3": "動学的な賃金契約と双方の限定的なコミットメントを持つ方向づけられた探索モデルを作り、企業固有のショックが賃金にどれだけ伝わるかが景気でどう変わるかを、米国の行政データで確かめる（抄録）。", "p5": "企業へのショックの賃金への伝わり方は不況期に強まり、特に離職の境目に近い低賃金の労働者で強かった（抄録）。モデルは所得リスクの多くの特徴を再現し、個人固有のリスクの厚生費用が大きいこと、不況時に条件づけた移転の利益が大きいことを示す。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "職業内の賃金格差が認知的職業で広がった理由", "title": "Unbundling Labor", "url": "https://doi.org/10.3386/w35783", "authors": "Chris Edmond ほか", "venue": "NBER Working Paper", "date": "-", "why": "労働者が複数の技能を束で提供するモデルで、職業内の賃金格差の拡大が認知的職業に集中した理由を説明する。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（OpenAlex）を使用", "preprint": true, "short": true, "p1": "同じ職業の中での賃金格差が大きく、特に認知的な職業で広がった理由を、労働者が複数の技能を切り離せない「束」として提供するというモデルで説明した（抄録）。", "p3": "異なる技能の組み合わせを持つ労働者が技能を束で供給する一般均衡モデルを作り、この摩擦で同じ技能が職業ごとに異なる価格になることを使って、米国のデータで職業内の格差を分解する（抄録）。", "p5": "認知的な職業ほど職業内格差が大きいのは、労働者の構成ではなく技能の価格の違いによるもので、1980年から2010年の職業内格差の拡大の約3分の1を説明した（抄録）。認知技能の生産性が一様に上がると、認知的な職業で格差が広がり、手作業の職業で縮むこともモデルで再現した。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "現金給付の受給者のスポーツ賭博を禁じた効果", "title": "Restricting Online Sports Betting", "url": "https://doi.org/10.2139/ssrn.7501578", "authors": "Luana Alves ほか", "venue": "SSRN", "date": "2026-09-25", "why": "ブラジルが現金給付の受給者のスポーツ賭博の登録を禁じた政策の効果を評価し、オンライン賭博の規制に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "ブラジルが2025年12月に現金給付の受給者のスポーツ賭博サイトへの登録を禁止した政策が、賭博を大きく減らしたが家計の債務は改善しなかったことを示した（抄録）。", "p3": "登録された賭博者全員の行政データと、合成差分の差分法（synthetic difference-in-differences）で、政策の影響を強く受ける自治体とそうでない自治体を比べる（抄録）。", "p5": "影響の大きい自治体では、活動中の賭博者が12% to 18%、賭けの数が20% to 22%、賭け金の総額が12% to 14%減り、制限のない人の口座を使う抜け道の証拠はなかった（抄録）。2026年4月までに弱い立場の賭博者の損失を少なくとも2,500万ドル減らしたと推定したが、家計の信用の改善は見られなかった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn40", "rank": 40, "field": "地震工学・防災", "headline": "洪水の危険度から家庭の経済損失までを一体で推計", "title": "From Flood Hazard to Economic Loss: Integrated 2D Hydrodynamic and Damage Modelling under Future Climate Change in the Lower Mekong River Basin", "url": "https://doi.org/10.2139/ssrn.7524721", "authors": "Trang  Quang Nguyen ほか", "venue": "SSRN", "date": "2026-09-25", "why": "2次元の水理モデルと被害モデルを統合し、将来の気候変動の下での洪水による家財の直接損失を推計する枠組みを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "メコン川下流域で、2次元の水理モデル、衛星観測、被害の空間評価を組み合わせ、洪水の危険と家計の耐久財・コメ生産の直接の経済損失を、気候変動の将来まで推計した（抄録）。", "p3": "2000・2008・2011・2018年の洪水をHEC-RAS 2Dで再現してLandsat、MODIS、Sentinel-1の浸水範囲と照合し、年超過確率10%・1%・0.2%の設計洪水と、SSP2-4.5とSSP5-8.5での2030・2050・2100年の1%洪水を、曝露と脆弱性を今のまま固定して計算する（抄録）。", "p5": "浸水域は10%の洪水の63,175 km²から0.2%の洪水の72,741 km²に増えたが、5 m超の深い浸水域は約53%増えた（抄録）。耐久財の損失は1.42から2.05 billion ドル、コメの損失は2.30から2.82 billion ドルに増え、リスクの増加は浸水域の拡大より既存の氾濫原での水深の増加による。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn41", "rank": 41, "field": "地震工学・防災", "headline": "反実仮想の人口シミュレーションで洪水による移住を検出", "title": "Detecting potentially flood-induced displacement by counterfactual demographic simulation in a high-resolution agent-based approach: a case study in Kuma River basin, Japan", "url": "https://doi.org/10.2139/ssrn.7528906", "authors": "Shi Feng ほか", "venue": "SSRN", "date": "2026-09-26", "why": "洪水がなかった場合の人口をシミュレーションして比べることで、人口変化だけでは分からない災害による移住を検出する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "2020年の球磨川の豪雨災害について、洪水がなかった場合の人口を世帯単位のエージェントベースモデルで再現し、国勢調査との差から洪水による避難・転居の可能性を検出した（抄録）。", "p3": "年齢集団ごとの人口変化・転出入・世帯の出来事を表す世帯動態の部分と、利便性と世帯の属性で転居先を決める域内移動の部分を組み合わせ、災害前の人口変化に合わせて調整する（抄録）。", "p5": "モデルは洪水前の人口の空間的・時間的な変化をおおむね再現し、2020年国勢調査との比較から、流域内の短距離の転居が中心であることが分かった（抄録）。農村と都市では、施設への近さに応じて人口の反応が対照的だった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn42", "rank": 42, "field": "地震工学・防災", "headline": "途絶に強い複合一貫輸送をシミュレーション最適化で設計", "title": "A Simulation Optimization Approach to Enhance Intermodal Freight Transportation Resilience Under Disruptions", "url": "https://doi.org/10.2139/ssrn.7529192", "authors": "Israt Humayra ほか", "venue": "SSRN", "date": "2026-09-26", "why": "混雑や途絶に弱い貨物輸送網の強靭性を、シミュレーションと最適化の組み合わせで高める方法を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "災害などで輸送網が乱れても、道路・鉄道・水運を組み合わせた米国の複合一貫貨物輸送の費用と遅れを抑える計画を、シミュレーションと最適化を組み合わせて求めた（抄録）。", "p3": "多層の貨物輸送網で、経路・日程・サービスの設計を同時に決める2段階の確率計画を定式化し、運行費用・排出費用・遅延の罰金を最小にする。計算を速くするため、シミュレーションを組み込んだ分解のアルゴリズム（SID）を作る（抄録）。", "p5": "実データの実験で、SIDは解の効率と質をそれぞれ最大59.46%と89.84%改善した（抄録）。ハリケーン・ヘレンの事例では、定時の配送が18.38%増え、遅れが45.62時間短くなった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn43", "rank": 43, "field": "ヒューマンコンピュータインタラクション", "headline": "金融アプリのダークパターンを公正な選択設計に置き換える", "title": "Redesigning Trust: Replacing Dark Patterns with Fair Choice Architecture in Financial Interfaces", "url": "https://doi.org/10.2139/ssrn.7520380", "authors": "Oluwadamilola Awakan ほか", "venue": "SSRN", "date": "2026-09-26", "why": "加入は簡単で解約は面倒という金融アプリの設計（ダークパターン）を、公正な選択設計に置き換える方法を扱い、消費者保護の設計に示唆を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "金融アプリで「加入は簡単、解約は面倒」というダークパターンを避けるため、「解約の手間が加入の手間を超えない」という公平さの条件を数学的に定め、数えるだけで確かめられることを証明した（抄録）。", "p3": "事業者を手間を道具にする敵対者としてモデル化し、画面遷移の数、必須の入力、確認の表示で操作の費用を定義する。この条件を、視覚的な対等さ、言葉の中立性の条件とともに、クレジットカードの加入・解約の試作アプリに当てはめる（抄録）。", "p5": "手間の重みをどう置いても条件が成り立つのは、解約の流れの各要素が加入側の対応する要素を超えないときに限ることを証明した（抄録）。このため公平さは認知的な負担を推定しなくても数えるだけで確かめられる。利用者実験での検証は抄録からは分からない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pn44", "rank": 44, "field": "ヒューマンコンピュータインタラクション", "headline": "車内の操作部に双安定機構を使う：剛性と認知負荷の効果", "title": "Bistable Mechanism as Innovative Interface for AutomotiveContext: Effect of Stiffness and Cognitive Load on Performance, User Experience, Force Exertion and Hand Posture", "url": "https://doi.org/10.2139/ssrn.7529200", "authors": "Kéliane Mégret ほか", "venue": "SSRN", "date": "2026-09-26", "why": "2つの安定状態を持つ機構を車の操作部に使い、剛性と運転者の認知負荷が操作の知覚に与える影響を調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用", "preprint": true, "short": true, "p1": "2つの安定状態を持つ柔軟な機構（双安定機構）を自動車の操作部に使うことを想定し、硬さと認知的負荷が操作の成績・使いやすさ・力・手の姿勢に与える影響を実験で調べた（抄録）。", "p3": "運転シミュレーターの環境で参加者（Seventy-two participants）が双安定機構を操作し、機構の硬さ（3〜100 N.m/rad）と、操作だけか二重課題かという認知的負荷を変えて、成績、力、姿勢を測った（抄録）。", "p5": "硬さと認知的負荷はどちらも反応を遅くした（抄録）。使用感は中程度の硬さで最も高く、力は硬さにだけ応じて増え、姿勢はほとんど変わらなかった。著者は、手応え・快適さ・安全を考えた人間工学的な設計に役立つとしている。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "地震による軌道不整を軌道-橋梁系で確率予測", "title": "Decoupled probabilistic modeling method for seismic-induced track irregularity on CRTS Ⅲ track-bridge system: Prediction and uncertainty quantification", "url": "https://doi.org/10.1016/j.engstruct.2026.123849", "authors": "Wangbao Zhou ほか", "venue": "Engineering Structures", "date": "2026-09-26", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、中国の高速鉄道のCRTS III型スラブ軌道と橋梁からなる系で、地震によって生じる軌道の不整（レールの凹凸・ずれ）を、要素を切り離した確率モデルで予測し、その不確実性を定量化する研究だと分かる（題名からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（手法、データ、結果）はすべて確認できなかった。"}}, {"id": "jr02", "rank": 2, "headline": "温度応答の傾向で橋の点検優先度を決める", "title": "Thermal-response trend screening for inspection prioritisation of prestressed concrete continuous box-girder bridges", "url": "https://doi.org/10.1080/15732479.2026.2738784", "authors": "Wande Li ほか", "venue": "Structure and Infrastructure Engineering", "date": "2026-09-26", "citescore": 8.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、プレストレストコンクリート連続箱桁橋の温度応答の傾向を選別（スクリーニング）し、点検の優先順位づけに使う方法を扱う論文だと分かる。長期の構造モニタリングの温度応答を維持管理の判断に結びつける試みと考えられる（題名からの解釈）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"id": "jr03", "rank": 3, "headline": "車両床から背中への振動伝達で乗り物酔いを推定", "title": "Motion sickness incidence estimation incorporating back-measured torso biodynamic response: Modeling and real-vehicle evaluation", "url": "https://doi.org/10.1177/10775463261491871", "authors": "Jialiang Zhu ほか", "venue": "Journal of Vibration and Control", "date": "2026-09-26", "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "車の床の振動がそのまま乗員に届くと仮定する従来の乗り物酔いの推定を改め、床から背中・上半身への振動の伝わり方を4自由度モデルで表し、再構成した背中の加速度で乗り物酔いの発生率（MSI）をより正確に推定できるようにした（抄録）。", "p2": "振動に基づく乗り物酔いの推定モデルは車両の加速度を直接使うため、車両と乗員の間の力学的な伝達を考慮していなかった（抄録）。", "p3": "着座した乗員の「床→背中」の振動伝達を、上下・左右・前後の軸ごとに独立した4自由度モデルで表す。モデルで再構成した背中・上半身の加速度を、周波数重み付けと時間の累積を考慮した乗り物酔い推定式の入力に使う（抄録）。例：同じ車の揺れでも、座席と体の伝達特性によって背中に届く揺れが変わることを入力に反映する。", "p4": "実車実験で、モデルが予測した床→背中の加速度伝達率の大きさと実測の一致（決定係数R²）を確かめ、直進とスラローム走行で、背中の応答に基づく推定と床の加速度を直接使う推定の誤差（RMSE）を比べる（抄録）。", "p5": "伝達率の大きさのR²は上下0.9648、左右0.9665、前後0.9524だった（抄録）。背中の応答に基づく推定は、直接モデルに比べて集団レベルのRMSEを直進で22.10%、スラロームで17.54%減らした（抄録）。性別や体重の群、スマートフォンを見る条件、入力の揺らぎでの性能も調べている。", "p6": "解釈：伝達率の一致は大きさ（振幅）の特性で示されており、位相の再現は抄録からは分からない。被験者数や車種の範囲も抄録にはない。", "unverified": "被験者数、車両の種類、モデルのパラメータの同定方法は本文未入手のため確認できなかった。"}}, {"id": "jr04", "rank": 4, "headline": "物理情報NNで積層板の振動から損傷を同定", "title": "Vibration-based damage identification in CFRP laminates using physics-informed neural networks 物理情報組込み型ニューラルネットワークを用いたCFRP積層板の振動に基づく損傷同定", "url": "https://doi.org/10.1299/jsmecs.2026.64.01c1", "authors": "Keiji Ogi ほか", "venue": "The Proceedings of Conference of Chugoku-Shikoku Branch（日本機械学会）", "date": "2026-09-24", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、炭素繊維強化プラスチック（CFRP）積層板の損傷を、振動応答から物理情報組込み型ニューラルネットワーク（PINN）で同定する研究だと分かる。日本機械学会中国四国支部の講演会論文である（題名と掲載先からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"id": "jr05", "rank": 5, "headline": "財務状態の履歴が翌年の悪化と回復を予測する", "title": "Financial Distress Trajectories: A Sequence Analysis of Non-Financial Firms Listed on Borsa Istanbul", "url": "https://doi.org/10.3390/ijfs14090254", "authors": "Rafael Bayramli ほか", "venue": "International Journal of Financial Studies", "date": "2026-09-21", "citescore": 5.0, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "企業の財務状態を1年ごとの断面ではなく「健全・危険・困窮」の状態の系列として扱い、過去の状態の推移の履歴が、翌年の悪化と回復を現在の財務比率以上に予測することを示した（抄録）。", "p2": "財務困窮のモデルは企業×年の観測を断面として扱うことが多く、その状態が一時的か、長引いているか、繰り返しているか、最近回復したのかが見えなくなる（抄録）。", "p3": "イスタンブール証券取引所の非金融企業258社の2016〜2024年のデータで、AltmanのZスコアに基づいて毎年の状態を健全・危険・困窮に符号化する。系列全体の型を最適マッチング（optimal matching）とPAMクラスタリングで見つけ、動的ハミング距離で頑健性を確かめる。さらに過去の履歴の指標（状態の移り変わりの回数、現在の困窮の継続年数など）を離散時間ロジットモデルに入れる（抄録）。例：健全な企業でも、過去に状態が何度も変わっていれば翌年悪化しやすいかを見る。", "p4": "企業でクラスター化した標準誤差と、企業単位でまとめた反復交差検証で、履歴の指標が現在の財務比率に加えて翌年の悪化・回復の予測に役立つかを評価する（抄録）。", "p5": "系列の型は「おおむね健全」と「長期・反復的な困窮」の2つの安定した群に分かれた（抄録）。健全な企業では、過去の状態の移り変わりが1回多いごとに翌年悪化するオッズが63.6%高く、健全でない企業では、現在の困窮が1年長いごとに回復のオッズが24.6%低かった（抄録）。悪化と回復は異なる履歴の特徴と結びついていた。", "p6": "解釈：状態はAltmanのスコアから機械的に定義したもので、実際の倒産や債務不履行ではない。1か国・258社の比較的小さな標本で、予測精度の改善幅は抄録にない。", "unverified": "交差検証での予測精度（AUCなど）の数値と、使った財務比率の一覧は本文未入手のため確認できなかった。"}}, {"id": "jr06", "rank": 6, "headline": "東南アジア4か国の上場企業の財務困窮を予測", "title": "Predicting Corporate Financial Distress in Four Southeast Asian Countries", "url": "https://doi.org/10.1162/asep.a.1011", "authors": "Jose Miguel Bautista ほか", "venue": "Asian Economic Papers", "date": "2026-09-21", "citescore": 2.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "インドネシア・マレーシア・フィリピン・タイの上場企業（銀行を除く）の財務困窮を、パネル・ロジットとLASSOで予測し、推定期間を毎年更新する逐次的な標本外予測で性能を確かめた（抄録）。", "p2": "債務不履行やゾンビ企業につながる財務困窮のリスクの定量化は、研究者・投資家・規制当局の関心事だが、東南アジアの上場企業について、標本外の予測性能まで検証した研究は多くない（抄録）。", "p3": "2005〜19年のデータでパネル・ロジットモデルを推定し、2020年の困窮を予測したあと、推定の窓を毎年延ばして2022年まで1年先を予測する（抄録）。この逐次予測自体が推定値と予測の安定性の検証になる。予測精度を上げるため、変数選択に最小絶対値縮小選択演算子（LASSO）を使う。", "p4": "標本外の予測で、困窮企業をどれだけ識別できるかを比べる（抄録）。具体的な指標は抄録に記載がない（未確認）。", "p5": "パネル・ロジットモデルは困窮企業をそれなりによく識別し、LASSOは予想どおり予測精度を改善した（抄録）。数値は抄録にない（未確認）。", "p6": "解釈：困窮の定義や説明変数、コロナ禍の2020年を含む予測期間の影響は抄録からは分からない。Asian Economic Papersには本論文への討論者のコメントも掲載されている（候補一覧による）。", "unverified": "困窮の定義、使った変数、予測精度の数値はすべて本文未入手のため確認できなかった。"}}, {"id": "jr07", "rank": 7, "headline": "生成AIの導入とAIリテラシーの適合が創造性を高める", "title": "Unleashing innovation: how fit between organizational generative AI adoption and employee AI literacy drives creative performance", "url": "https://doi.org/10.1108/lodj-02-2025-0131", "authors": "Yuye Wang ほか", "venue": "Leadership & Organization Development Journal", "date": "2026-09-22", "citescore": 7.7, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "組織による生成AIの導入を「新しい仕事の要求」、従業員のAIリテラシーを「個人の能力」とみなし、両者が合っているほど従業員の創造的な成果が高いことを、上司と部下324組の複数時点のデータで示した（抄録）。", "p2": "組織が上から生成AIを導入する場面で、AIに関わる仕事の要求が従業員のAI能力と合っているかは重要だが、先行研究は組織の導入と個人のAIリテラシーを別々のイノベーションの要因として扱い、その適合を見てこなかった（抄録）。", "p3": "人と職務の適合（person-job fit）理論に基づき、上司と部下324組から複数時点でデータを集め、多項式回帰と応答曲面分析（response surface analysis）で、導入の程度とAIリテラシーの一致・不一致が創造的成果にどう関わるかを調べる（抄録）。例：導入が進んだ職場でリテラシーの高い人（高-高）と、導入が少なくリテラシーも低い人（低-低）を比べる。", "p4": "適合の効果、高-高と低-低の比較、2種類の不一致（能力が要求を上回る「過剰適格」と下回る「過少適格」）の比較、仕事の動機づけ（自律的・統制的）の媒介効果で仮説を検証する（抄録）。", "p5": "組織の生成AI導入と従業員のAIリテラシーの適合は創造的成果と正に関連し、高-高の適合は低-低より創造的成果が高かった（抄録）。不一致の中では、過剰適格の方が過少適格より創造的成果に有利だった。自律的・統制的な動機づけが、適合と創造的成果の関係を媒介した（抄録）。", "p6": "解釈：創造的成果は上司評価と考えられるが、測り方の詳細は抄録からは分からない。対象の国・業種も未確認で、観察データのため因果の向きには限界がある。", "unverified": "標本の国・業種、効果の大きさ、尺度の出典は本文未入手のため確認できなかった。"}}, {"id": "jr08", "rank": 8, "headline": "LLM支援の術前説明で患者不安と医師負担が減少", "title": "Large language model–assisted preoperative communication reduces patient anxiety and physician workload in prostate cancer: a prospective randomized phase II trial", "url": "https://doi.org/10.1038/s41746-026-03309-7", "authors": "Zheng Liu ほか", "venue": "npj Digital Medicine", "date": "2026-09-26", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "前立腺がんの手術前の説明で、患者の質問に院内で動かすLLMが個別に答えてから医師が面談する方式を無作為化試験で検証し、患者の不安を下げ、医師の負担と説明時間を減らせることを示した（抄録）。", "p2": "手術前の説明は患者の不安や病気の理解に大きく関わるが、医師の時間と負担が大きい。LLMによる支援が患者と医師の双方に役立つかを、前向きの無作為化試験で確かめた例は少ない（抄録）。", "p3": "根治的前立腺摘除術を予定する新規診断の患者を、病室単位で通常説明群とAI支援群に割り付ける。AI支援群では、集めた患者の質問に院内に配置したLLMが個別の回答を作り、面談の前に患者に渡す。医師は割り付けを知らされない（単盲検）（抄録）。", "p4": "主要評価項目は患者の不安（GAD-7）と医師の負担（NASA-TLX）で、副次項目は感情、病気の認知、満足度、説明時間（抄録）。第II相の試験で、ClinicalTrials.govに登録されている（NCT07082049）。", "p5": "268人が割り付けられ（通常130人、AI支援138人）、3,507件の質問が集まった（1人平均13.1件）（抄録）。説明後の不安（GAD-7）はAI支援群3.2、通常群5.7（P=0.001）、医師の負担（NASA-TLX）は39.9対56.8（P<0.001）、説明時間は11.3分対19.9分（P<0.001）だった（抄録）。感情、病気の認知、満足度もAI支援群で良かった。", "p6": "解釈：病室単位の割り付けで、患者は自分がAIの回答を受けたと分かる。医師は割り付けを知らされないが、患者の様子から推測できる可能性がある。回答の誤りの有無や安全性の評価、長期の転帰は抄録からは分からない。単施設か多施設かも未確認。", "unverified": "使用したLLMの種類、回答の正確性の検証、施設数は本文未入手のため確認できなかった。"}}, {"id": "jr09", "rank": 9, "headline": "LLMエージェントが事務所の多様な在室者行動を再現", "title": "Large language model agents capture heterogeneous occupant behaviors in building energy simulation of shared office spaces", "url": "https://doi.org/10.1016/j.buildenv.2026.115329", "authors": "Xiaoxiao Xu ほか", "venue": "Building and Environment", "date": "2026-09-26", "sjr": 1.906, "citescore": 15.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、LLMエージェントが共用オフィスの在室者の多様な行動を再現し、建物のエネルギーシミュレーションに組み込めることを示す研究だと分かる（題名からの情報）。どの程度実測と合うかは未確認。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"id": "jr10", "rank": 10, "headline": "ESGの悪い報道の後、企業は実体的な利益調整を増やす", "title": "Camouflaging the damage: the consequences of negative ESG media coverage on earnings management", "url": "https://doi.org/10.1080/01559982.2026.2710588", "authors": "Emma García‐Meca ほか", "venue": "Accounting Forum", "date": "2026-09-21", "citescore": 7.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "ESGの不祥事について否定的な報道を受けた欧州の上場企業が、その後に実体的な利益調整と科目の付け替え（classification shifting）を増やすことを示し、それが資金調達コストの上昇や機関投資家の離反を和らげる「盾」として使われていることを明らかにした（抄録）。", "p2": "ESGの不祥事への報道の目が厳しくなる中で、企業が報道のコストに対応して利益調整の戦略をどう変えるのかは分かっていなかった（抄録）。倫理的な見方（不正を控える）、経営者の機会主義の見方、トレードオフの見方の3つの予測が対立する。", "p3": "2018〜2022年の欧州の上場企業のパネルで、否定的なESG報道のあとの実体的な利益調整と科目の付け替えの変化を調べる（抄録）。気候に関する否定的な報道、資金調達コストと機関投資家の保有比率への影響、国の社会規範・規制の厳しさ・汚職の抑制、取締役会の有効性による違いも分析する。", "p4": "否定的な報道の前後での利益調整の指標の変化と、それを弱める制度・ガバナンスの条件で評価する（抄録）。", "p5": "否定的なESG報道のあと、企業は実体的な利益調整と科目の付け替えを増やし、経営者の機会主義の見方と整合した（抄録）。気候リスクへの露出も同様の反応を招き、利益調整は資金調達コストの上昇と機関投資家の保有の減少を和らげる働きをしていた。社会規範が厳しく規制の目が強く汚職の抑制がよい国の企業や、取締役会が有効な企業では利益操作が起きにくかった（抄録）。", "p6": "解釈：報道の測り方（データベースや言語）と、利益調整の推定モデルは抄録からは分からない。欧州企業に限った結果で、効果の大きさも未確認。", "unverified": "報道データの出典、標本の企業数、係数の大きさは本文未入手のため確認できなかった。"}}, {"id": "jr11", "rank": 11, "headline": "アルゴリズムが決める銀行で管理者の道徳的正統性は", "title": "When the algorithm decides: moral legitimacy, ethical bank managers, and the restorative power of territorial embeddedness", "url": "https://doi.org/10.1108/ijoes-04-2026-0297", "authors": "Rafael Robina-Ramírez ほか", "venue": "International Journal of Ethics and Systems", "date": "2026-09-26", "sjr": 0.672, "citescore": 9.7, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "銀行の意思決定にアルゴリズムが入り込む中で、倫理的な管理者の「解釈」と、地域への根づき（territorial embeddedness）が、従業員の道徳的な自信を支えることを混合研究法で示した（抄録）。", "p2": "アルゴリズムが判断を下す場面で、人間の管理者の道徳的な正統性がどう保たれ、あるいは失われるのかは分かっていない（抄録）。", "p3": "農村と都市の銀行管理者のフォーカスグループ2回で「アルゴリズムによる道徳的な置き換え理論（AMDT）」の枠組みと尺度を調整し、スペイン・エストレマドゥーラ州の79支店（農村44、都市・準都市35）の管理者と従業員606人のデータをPLS-SEMで分析する（抄録）。媒介分析と、地域・役職の多群比較を行う。", "p4": "倫理的リーダーシップ、アルゴリズムの透明性、知覚されたアルゴリズムの権威、地域への根づきと、従業員の道徳的な自信との関係を、媒介経路と群間差で評価する（抄録）。", "p5": "リーダーの道徳的な自律性の知覚が、倫理的リーダーシップ・アルゴリズムの権威・透明性・地域への根づきと従業員の道徳的な自信を結ぶ媒介の仕組みとして現れた（抄録）。アルゴリズムの権威は道徳的な自信と直接には関連せず、管理者の倫理的な解釈への評価を通じて働いた。地域への根づきは特に農村で正に関連し、都市では透明性と倫理的な説明が重視された（抄録）。", "p6": "著者は、道徳的な正統性はアルゴリズムに置き換えられるのではなく組み替えられると解釈している（抄録）。解釈：横断的な自己報告のデータで因果の向きは特定できず、一地域の銀行に限られる。係数の大きさは抄録にない。", "unverified": "パス係数と適合度は本文未入手のため確認できなかった。"}}, {"id": "jr12", "rank": 12, "headline": "スマート工場の規則違反は非効率への対処だった", "title": "Non-compliance at work: Workarounds and inefficiencies in the ‘smart’ factory", "url": "https://doi.org/10.1177/09500170261473534", "authors": "Chiara Benassi ほか", "venue": "Work, Employment and Society", "date": "2026-09-26", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "イタリアの製造業の「スマート」工場で、組立ラインの労働者が規則に従わないのは管理への反抗ではなく、過度な標準化とコスト削減が生む非効率への対処だったことを、68件の聞き取りで示した（抄録）。", "p2": "職場での規則違反は、組織的な不品行（misbehaviour）や労働者の「ゲーム」として説明されてきたが、それでは経営が生んだ非効率への対応としての違反を捉えられない（抄録）。", "p3": "組立ラインの労働者と他の関係者への半構造化面接68件を分析し、情報システム研究の「ワークアラウンド（workaround：公式の手順の回避策）」の概念と、産業社会学・労働過程論を組み合わせて解釈する（抄録）。", "p4": "質的研究で、規則違反の動機と形を、既存の概念（不品行・ゲーム）とワークアラウンドの概念のどちらでよく説明できるかを検討する（抄録）。", "p5": "労働者の規則違反は、経営側が作った非効率（過度の標準化とコスト削減）への応答であり、ワークアラウンドの概念でよりよく理解できると論じる（抄録）。自動化の進んだ仕事でも労働者の創意工夫が重要であり続けることを示し、技術中心の「仕事の未来」の語りに異議を唱えている（抄録）。", "p6": "解釈：1社の事例研究で、他の産業・国への一般化には限界がある。どの程度の違反が生産性にどう影響したかの定量的な評価はない。", "unverified": "工場で導入されていた具体的なデジタル技術と、面接の対象者の内訳は本文未入手のため確認できなかった。"}}, {"id": "jr13", "rank": 13, "headline": "AIインフルエンサーの主体性が感情関与と幸福に影響", "title": "Agentic AI-enabled influencers and psychological persuasion: agenticity shaping emotional engagement and well-being", "url": "https://doi.org/10.1108/jcm-11-2025-8511", "authors": "Arjun J. Nair ほか", "venue": "Journal of Consumer Marketing", "date": "2026-09-26", "citescore": 7.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "自律的にふるまうAIインフルエンサーが、真正性・信頼・感情的な関与を通じて消費者の幸福感にどう関わるかを、専門家のデルファイ法と北米の利用者1,943人の構造方程式モデリングで示した（抄録）。", "p2": "AIによる説得が心理的・社会的にどう働くかを説明する統合的な理論がなく、説得知識モデル、擬似社会的相互作用、自己決定理論が別々に使われてきた（抄録）。", "p3": "第1段階でファジー・デルファイ法により19人の学際的な専門家が「主体的なAIによる説得」の構成概念を検証・優先順位づけし、第2段階でカナダと米国のSNS利用者1,943人のデータを構造方程式モデリングで分析する（抄録）。", "p4": "知覚された主体性（agenticity）と真正性・信頼・感情的関与・幸福感の関係、真正性と信頼の媒介効果、文化的志向とデジタルリテラシーの調整効果を検証する（抄録）。", "p5": "知覚された主体性は、透明性と感情的な応答性を伴うとき、真正性・信頼・感情的関与と正に関連し、消費者の幸福感につながった（抄録）。真正性と信頼が主要な媒介変数で、文化的志向とデジタルリテラシーが関係の強さを調整した（抄録）。著者は、AIによる説得は操作ではなく自律性と感情の一貫性を支えるときに最も効果的だとまとめている。", "p6": "解釈：横断的な自己報告の調査で、幸福感への因果効果は示せない。効果量や適合度は抄録にない。", "unverified": "モデルの係数と適合度、標本の抽出方法は本文未入手のため確認できなかった。"}}, {"id": "jr14", "rank": 14, "headline": "ホームレス状態の若者は制度の外の資本に頼る", "title": "Social Networks From the Margins: Race, Social Capital, and Educational Access Among Youth Experiencing Homelessness", "url": "https://doi.org/10.1177/23328584261482103", "authors": "Earl J. Edwards", "venue": "AERA Open", "date": "2026-09-26", "sjr": 1.435, "citescore": 5.2, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ロサンゼルス郡でホームレス状態にある黒人・ラテン系の若者23人への聞き取りから、住宅・貧困対策と学校の保護制度が分断される中で、信頼できる教職員と家族・地域のネットワークが異なる役割で支えていることを示した（抄録）。", "p2": "米国では毎年150万人以上の児童生徒がホームレス状態と認定されるが、学校で受けられる保護（マッキニー・ベント法）から切り離されている者が多く、人種を踏まえてその理由を分析した研究は少ない（抄録）。", "p3": "Linの社会関係資本理論とStanton-Salazarの「エンパワメントの担い手（empowerment agents）」の概念を使い、23人の若者への聞き取りを分析する（抄録）。", "p4": "質的研究で、若者が制度的な資本と非制度的な資本にどうアクセスするかを主題分析する（抄録）。", "p5": "住宅・貧困対策の制度は学校の保護制度と連携していないことが多く、制度への不信と人種による監視への懸念から、住まいの不安定さを打ち明けない若者もいた（抄録）。信頼できる教職員は、制度上の権限と文化的な信頼・ケアをあわせ持つ「関係の仲介者」として働いた。家族や地域のネットワークは物質的・情緒的な支えと日々の安定を与えたが、学校の正式な保護には必ずしもつながらなかった（抄録）。", "p6": "著者は、支えることと制度にアクセスさせることは補い合うものであって同じではないと結論している（抄録）。解釈：1地域・23人の質的研究で、一般化には限界がある。", "unverified": "対象者の募集方法と年齢構成は本文未入手のため確認できなかった。"}}, {"id": "jr15", "rank": 15, "headline": "動機づけ面接で高齢者虐待の再発を減らせるか", "title": "Motivation Interviewing to Reduce Elder Abuse and Neglect: Findings From a Randomized Controlled Trial in Hong Kong", "url": "https://doi.org/10.1111/jgs.70743", "authors": "Elsie Yan ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-09-26", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "香港の地域に住む高齢者虐待・ネグレクトのリスクのある人に、動機づけ面接（motivational interviewing）を4回行うと、心理的な攻撃や介護者によるネグレクトが減り、自己効力感と社会的支援が高まることを無作為化比較試験で示した（抄録）。", "p2": "高齢者虐待・ネグレクトは深刻な結果をもたらすが、高齢者は助けを求めることをためらいがちで、行動変化への迷いを解く動機づけ面接をこの分野に使った実証評価はほとんどなかった（抄録）。", "p3": "動機づけ面接は、行動を変えることへの両価的な気持ちを、本人の動機を引き出すことで解消する面接技法である。60歳以上の中国語を話す地域在住の高齢者を対象に、支援者が個別に4回の面接で本人の目標を明確にし変化への動機を引き出す。対照群は順番待ち（wait-list）とする（抄録）。", "p4": "主要評価項目は過去1か月の虐待・ネグレクト（改訂版葛藤戦術尺度と高齢者経済的搾取尺度の項目を修正）で、副次項目は主観的健康、心理的幸福感、自己効力感、社会的支援。開始時・介入後・3か月後に測定し、混合効果モデルで比べる（抄録）。事前にISRCTNに登録されている。", "p5": "適格者359人のうち161人が参加を断り、198人（平均73.6歳、女性88.9%）を99人ずつに分けた（抄録）。介入群は3か月後の軽度の心理的攻撃の減少が大きく（Cohenのd=0.92、p<0.001）、介入直後の介護者のネグレクトの減少も大きかった（d=0.57、p<0.05）（抄録）。自己効力感（d=0.67〜0.83）と社会的支援（d=2.08）も改善した。", "p6": "解釈：適格者359人のうち161人が参加を断っており、参加者は変化に前向きな人に偏った可能性がある。対照は順番待ちで盲検化は難しく、結果は自己報告に依存する。追跡は3か月と短い。", "unverified": "脱落率、多重比較の扱い、身体的虐待など他の下位項目の結果は本文未入手のため確認できなかった。"}}, {"id": "jr16", "rank": 16, "headline": "AI知識能力が心理的エンパワメントを通じ革新を促す", "title": "AI knowledge capability and innovation: the power of cognitive processing and empowerment", "url": "https://doi.org/10.1108/jkm-04-2026-0780", "authors": "Dengkai Wu ほか", "venue": "Journal of Knowledge Management", "date": "2026-09-26", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "AIを使った知識の生成と統合の「場（Ba）」が、AIに関する知識能力と心理的エンパワメントを通じてイノベーションの成果につながるという経路を、AI活用組織の専門職301人の調査で示した（抄録）。", "p2": "組織学習論とAIの新しい能力を結びつけ、AIによる知識のプロセスがイノベーションの成果を高める仕組みを説明する枠組みが不足していた（抄録）。", "p3": "米国のAI活用組織で働く専門職301人の質問紙データを構造方程式モデリングで分析し、AIによる知識生成の場と知識統合の場が、AIの知識能力とAIの心理的エンパワメントを介してAIイノベーションの成果に至る経路と、生成AIによる認知処理の調整効果を検証する（抄録）。", "p4": "各経路の係数の有意性と調整効果の有無で仮説を評価する（抄録）。", "p5": "知識生成の場・知識統合の場の両方がAIの知識能力と心理的エンパワメントに正に関連し、その両方がAIイノベーションの成果に正に関連した（抄録）。生成AIの認知処理は、知識能力と成果の関係を強めたが、心理的エンパワメントと成果の関係は調整しなかった（抄録）。", "p6": "解釈：同一回答者の自己報告による横断データで、共通方法バイアスと因果の向きの問題が残る。成果も自己評価の可能性が高い。係数は抄録にない。", "unverified": "尺度の出典、係数の大きさ、適合度は本文未入手のため確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "創造的な上司ほど急進的な提案を脅威と感じにくい", "title": "When and Why Do Leaders Endorse Radical Ideas? A Transactional Theory of Stress Perspective", "url": "https://doi.org/10.1002/job.70131", "authors": "Xuting Jiang ほか", "venue": "Journal of Organizational Behavior", "date": "2026-09-26", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "部下の急進的なアイデアを上司が支持するかどうかを上司側の要因から説明し、創造的な性格の上司はアイデアを脅威と受け取りにくく支持しやすいが、そうでない上司は脅威と受け取って支持しにくいことを、現場調査と実験で示した（抄録）。", "p2": "従来の研究は部下が上司の支持を得るための戦略に注目してきたが、その工夫が上司の脅威感を高めて逆効果になる可能性を見落としていた（抄録）。", "p3": "ストレスの交互作用理論（transactional theory of stress）に基づき、上司の創造的性格を「資源」とみなす。アイデアの急進性が、上司の脅威評価（threat appraisal）・挑戦評価（challenge appraisal）を通じて支持に至る間接効果が、上司の創造的性格の高低で逆向きになると予測する（抄録）。", "p4": "上司と部下167組の3時点の現場調査と、上司役の参加者300人の場面想定実験で、条件付きの間接効果を検証する（抄録）。", "p5": "創造的性格の低い上司では、急進的なアイデアほど脅威評価が高まって支持が下がる負の間接効果が見られ、高い上司では脅威評価が下がって支持が上がる正の間接効果が見られた（抄録）。実験でも、創造的性格の低い上司での負の間接効果が再現された（抄録）。挑戦評価を通じた経路は予測どおりには確認されなかったようである（抄録の記述からの解釈）。", "p6": "解釈：実験で再現されたのは負の経路のみで、正の経路の頑健性は現場データに依存する。効果量は抄録にない。", "unverified": "間接効果の大きさと、挑戦評価の経路の結果の詳細は本文未入手のため確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "都市インフラ劣化モデルの空間検証に局所Shapley指標", "title": "A local Shapley metric for spatial validation of urban infrastructure deterioration", "url": "https://doi.org/10.1016/j.compenvurbsys.2026.102513", "authors": "Pengcheng Zhang ほか", "venue": "Computers, Environment and Urban Systems", "date": "2026-09-26", "sjr": 2.174, "citescore": 17.3, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", ": "左右独立の路面入力を国際規格ISO 8608の路面粗さのパワースペクトル密度（A級・B級など）から生成し、前後輪には車速に応じた時間遅れを入れる（§3、式3.1、表1）。車体の上下・ピッチ・ロールと4輪を含む7自由度モデルに対し、状態と操作量の対応づけと多目的の報酬関数で出力を物理的に制約しながら、TD3で減衰力を決める（抄録、表3）。例：A級の路面を60 km/hで走るとき、各輪の減衰力を時々刻々変えて車体の揺れを抑える。", "p4": "MATLAB/Simulinkのシミュレーションで、受動サスペンション、線形スカイフック制御、ファジー制御と、車体の上下加速度、周波数重み付きの上下加速度の二乗平均、パワースペクトル密度を比べる（抄録、§5）。", "p5": "A級路面・60 km/hで、車体の上下加速度は受動サスペンションより49.41%、スカイフックより9.33%小さく、B級路面・60 km/hではスカイフックより3.19%小さかった（抄録）。ファジー制御よりもすべての条件で周波数重み付きの加速度が低く、ばね上質量の低周波の共振も抑えた（抄録）。受動サスペンションに対する低減率は、抄録では120 km/hで24.82%、結論では主要条件で19.76〜49.41%と書かれている（抄録、§6）。", "p6": "著者は、減衰器の強い非線形のヒステリシスを学習の収束のために単純化しており、実際の減衰器を組み込んだハードウェア・イン・ザ・ループ試験と、乗り心地と消費エネルギーを両立する報酬の設計を今後の課題としている（§6）。解釈：実車での検証はなく、結果はシミュレーションに限られる。", "unverified": "受動サスペンションに対する120 km/hでの低減率が、抄録（24.82%）と結論（19.76〜49.41%の範囲）で対応しているか確認できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "営業チームの仲間への援助は成果の贈与と報酬制度で変わる", "title": "Performance gift-giving and incentive systems: Conditions and effects of peer helping in a sales team", "url": "https://doi.org/10.1016/j.mar.2026.100979", "authors": "Allan Hansen ほか", "venue": "Management Accounting Research", "date": "2026-09-21", "citescore": 8.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Management Accounting Researchの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "営業チームで、個人目標を達成したメンバーが余った実績を未達の同僚に「贈る」という助け合い（実績の贈与）が、組織にとって必ずしも悪くないことを事例研究で示した（抄録）。", "p3": "ある営業チームの事例を調べ、実績の贈与が個人の実績の帰属やボーナスの支払いをどう変えるか、誘因制度とチームの関係にどう効くかを分析する（抄録）。", "p5": "実績の贈与は一見すると共謀のようで、チーム内のボーナスを増やすが、誘因制度の働きとチームの関係の両方に良い効果も生んでいた（抄録）。著者は、目標設定のリスク調整が、管理者の正式な手続きだけでなく、同僚の非公式な助け合いでも行われうると論じる。単一の事例である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr22", "rank": 22, "headline": "CEOの行動の一貫性が企業の信用格付けを高める", "title": "CEO behavioral integrity and corporate credit ratings: evidence from U.S. Firms", "url": "https://doi.org/10.1080/00036846.2026.2733804", "authors": "Yinyan Gong ほか", "venue": "Applied Economics", "date": "2026-09-2
