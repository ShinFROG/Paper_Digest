cts of restaurant atmospheres on the perception of space and quality", "url": "https://doi.org/10.1108/jhtt-03-2025-0214", "authors": "Veysel Tokdemir ほか", "venue": "Journal of Hospitality and Tourism Technology", "date": "2026-09-22", "sjr": 1.785, "citescore": 13.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Hospitality and Tourism Technologyの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "VRで再現した2つのレストランを使い、視覚・音・香り・触覚・味の感覚的な要素が、店の品質、価格の妥当さ、満足にどう影響するかを調べた（抄録）。", "p3": "建築と内装は同じで感覚の条件だけが違う2つのレストラン環境をVRで作り、参加者の五感の評価を量的・質的な方法を組み合わせて調べる（抄録）。", "p5": "感覚的に豊かなR1は高級感、味の良さ、高い品質と結びつき、R2は機能的で早く食べる場所と見られ、料理の品質の評価が下がった（抄録）。参加者の語りからは、音楽、眺め、香りが特に大きな役割を持っていた。参加者の人数は抄録からは分からない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr30", "rank": 30, "headline": "口コミの文章分類でホテルの推薦を個別化", "title": "Discovering customer preference to enhance hotel personalization using text classification and a review-based recommendation system", "url": "https://doi.org/10.1016/j.asej.2026.104471", "authors": "Andry Alamsyah ほか", "venue": "Ain Shams Engineering Journal", "date": "2026-09-22", "citescore": 12.4, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Ain Shams Engineering Journalの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "ホテルのレビューから6つの側面（価値、アクセス、サービス、部屋、清潔さ、睡眠の質）についての好みを読み取り、それにもとづいてホテルを推薦する仕組みを作った（抄録）。", "p3": "BERTとRoBERTaでレビューを6つの側面に分類するモデルを作り、その結果を使ったレビューにもとづく推薦システムを構築して比べる（抄録）。", "p5": "レビューの分類ではBERTが正解率0.8963、マクロF1 0.83でRoBERTaより良く、推薦システムではRoBERTaがコサイン類似度0.99917で最も高かった（抄録）。推薦が利用者の満足を実際に高めるかの検証は抄録からは分からない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr31", "rank": 31, "headline": "オンライン販路の導入に潜む関係の規範のコスト", "title": "The hidden costs of online channel strategy: A relational norm analysis", "url": "https://doi.org/10.22495/cbsrv7i3siart10", "authors": "Md. Mazharul Islam ほか", "venue": "Corporate and Business Strategy Review", "date": "2026-09-25", "citescore": 2.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Corporate and Business Strategy Reviewの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "銀行がオンラインの経路に頼るほど、顧客との共同体的な関係の規範が弱まり、長期の関係づくりが損なわれうることを、顧客調査で示した（抄録）。", "p3": "銀行の顧客245人のデータで、自己観から始まり、経路の利用とサービスの質を介して、共同体的な規範と交換的な規範、口コミと乗り換え意向に至る関係を分析する（抄録）。", "p5": "対面のサービスの質は両方の規範を育てたが、オンラインの利用は両方に負の影響を与えた（抄録）。共同体的な規範の方が、口コミと乗り換え意向をよく予測した。回答者の平均年齢は29.15歳で、横断的な調査である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr32", "rank": 32, "headline": "支援政策は障害のある高齢者の家族・友人による介護を変えるか", "title": "Supportive Policies and the Choice of Care by Relatives and Friends Among Disabled Older Adults in China: A National Population-Based Study", "url": "https://doi.org/10.1093/rescon/vmag086", "authors": "Xinyi Zhang ほか", "venue": "Research Connections", "date": "2026-09-25", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Connectionsの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "中国の介護保険の試行都市で、家族介護を支える政策がある地域の要介護高齢者は、親族や友人による介護を選びやすいことを示した（抄録）。", "p3": "最初の15の試行都市の政策文書と2018年の中国高齢者縦断調査（CLHLS）を結合し、65歳以上の要介護者3,745人で、政策の対象地域かどうかと介護者の種類の関連を、多重代入と重みつきロジスティック回帰で調べる（抄録）。", "p5": "85.8%が家族などの非公式な介護を選び、政策の対象の省では96.2%だった（抄録）。調整後も政策の対象であることは非公式な介護の選択と関連した（OR = 2.68、95% CI: 1.02–7.03）。政策の曝露は省単位で測っており、区間は広い。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr33", "rank": 33, "headline": "介護と差別の経験が黒人女性の政治参加に与える影響", "title": "The politics of care: the effects of caregiving and discrimination on black women’s political engagement", "url": "https://doi.org/10.1080/21565503.2026.2732940", "authors": "Ayana Best", "venue": "Politics Groups and Identities", "date": "2026-09-24", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Politics Groups and Identitiesの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "子どもを育てる黒人女性の政治参加に、子育てと個人的な差別の経験がどう影響するかを、2020年の米国選挙後調査で調べた（抄録）。", "p3": "2020年のCollaborative Multi-racial Post-Elections Survey（CMPS）のデータで、差別の経験と子育ての有無が、選挙での参加と選挙以外の政治活動に与える影響を分析する（抄録）。", "p5": "差別の経験と子育てはそれぞれ政治活動を増やしたが、子育て中の黒人女性が差別を経験すると、選挙と選挙以外のどちらの参加の可能性も下がった（抄録）。著者は仮説として「ケアの政治」を掲げており、結果は一部これと逆向きだった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr34", "rank": 34, "headline": "住居費の支払い困難が15年にわたり健康と幸福を損なう", "title": "Housing-related payment hardship and associations with health and well-being: a 15-year longitudinal study in a National Sample of U.S. adults", "url": "https://doi.org/10.1093/aje/kwag231", "authors": "Renae Wilkinson ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-17", "citescore": 7.1, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "American Journal of Epidemiologyの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "若い成人期に家賃・住宅ローンや光熱費を払えなかった経験が、15年後の心身の健康や幸福の悪さと関連することを、米国の全国縦断調査で示した（抄録）。", "p3": "Add Health（n = 7673）の3つの調査回を使い、Wave IV（2008-2009）の支払い困難と、Wave VI（2022-2025）の36の健康・幸福の結果との関連を、Wave IIIの属性と以前の値を調整して網羅的に推定する（抄録）。", "p5": "Bonferroni補正後も、両方の支払い困難は、自己評価の健康、喫煙、不安、人生の評価、差別の経験、経済的な困難などの悪さと関連した（抄録）。社会的な幸福や向社会的な結果との関連は弱かった。観察研究の関連である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr35", "rank": 35, "headline": "社会関係資本と地域の変化がトランプ支持への転換を促した", "title": "Voting red again: how social capital and local change drove the Trump swing", "url": "https://doi.org/10.1111/jors.70071", "authors": "Pedro Fierro ほか", "venue": "London School of Economics and Political Science Research Online (London School of Economics and Political Science)", "date": "2026-09-30", "citescore": 4.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "LSEのリポジトリに登録された掲載論文（Journal of Regional Science）の抄録を使用", "preprint": false, "short": true, "p1": "米国の郡単位で、社会関係資本の「量」ではなく「中身」が、2016年と2020年の大統領選でのトランプ票の伸びと関係していたことを示した（抄録）。", "p3": "2016年と2020年の大統領選の郡単位データで、地域の内側で結びつける結束型（bonding）の社会関係資本と、社会経済的な違いを越えて人をつなぐ橋渡し型（bridging）の社会関係資本を分け、地域の経済・人口の変化との組み合わせでトランプ票の差を分析する（抄録）。", "p5": "結束型はトランプ票の差の大きさと頑健に結びつき、橋渡し型は逆向きだった（抄録）。同じ経済・人口の変化でも、結束型と橋渡し型の構成によって反体制的な投票への影響が逆向きになった。郡単位の観察データの関連である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr36", "rank": 36, "headline": "洪水リスク管理への地域の関与は回復力を高めるか", "title": "Understanding the relationship between community involvement in flood risk management and community flood resilience.", "url": "https://doi.org/10.21954/ou.ro.00111944", "authors": "Claude Louis Nsobya", "venue": "Open Research Online (The Open University)", "date": "2026-09-25", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Open Research Online（オープン大学）に登録された博士論文の抄録を使用", "preprint": false, "short": true, "p1": "洪水リスク管理への地域住民の参加が、地域の洪水レジリエンスとどう関係するかを、ウガンダと英国の政府主導の事業で質的に調べた博士論文（抄録）。", "p3": "地域のレジリエンスを人的・社会的・制度的・自然・物理的・経済的の6つの能力で捉え、効果的な参加の5つの側面（早く長く関わる、能力と社会関係資本を育てる、相互の学びと利益、包摂、役割の明確さと透明性）を理論的に定め、2つの事例を質的に分析する（抄録）。", "p5": "両方の事例で、知識と技能（人的能力）と関係（社会的能力）が、他の能力とレジリエンスを高める鍵だった（抄録）。参加とレジリエンスの関係は主にこの2つを介し、複雑で常に良い方向とは限らなかった。査読論文ではなく学位論文である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr37", "rank": 37, "headline": "周縁化された住民にとって自然の恩恵は一様でない", "title": "Marginalized Community Members’ Perceptions of Nature and Psychological Wellbeing: Focus Group Findings on Variability in Perceived Benefits", "url": "https://doi.org/10.1016/j.jenvp.2026.103220", "authors": "Everly Jazi ほか", "venue": "Journal of Environmental Psychology", "date": "2026-09-26", "sjr": 2.508, "citescore": 10.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "社会的に周縁化された地域住民が自然をどう捉え、心理的な幸福への恩恵をどう感じるかのばらつきを、フォーカスグループで調べた研究（Journal of Environmental Psychology）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "jr38", "rank": 38, "headline": "街路の幅と高さの比と緑化が都市の音環境を変える", "title": "Soundscape evaluation of urban street canyons: Effects of height-to-width ratio and nature-based interventions", "url": "https://doi.org/10.1016/j.buildenv.2026.115338", "authors": "Haram Lee ほか", "venue": "Building and Environment", "date": "2026-09-26", "sjr": 1.906, "citescore": 15.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "都市の街路の谷間（ストリート・キャニオン）で、建物の高さと道幅の比と、緑などの自然を使った介入が、音環境（サウンドスケープ）の評価に与える影響を調べた研究（Building and Environment）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "jr39", "rank": 39, "headline": "コルカタの地下鉄で土地利用・接続性・サービス品質が結びつく", "title": "Land use accessibility, connectivity, and service quality nexus: Evidence from Kolkata metro", "url": "https://doi.org/10.1016/j.cstp.2026.101972", "authors": "Prosenjit Barman ほか", "venue": "Case Studies on Transport Policy", "date": "2026-09-22", "citescore": 6.1, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Case Studies on Transport Policyの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "インドのコルカタ都市圏で、駅周辺の土地利用へのアクセスのしやすさが、多様な交通手段とのつながりを通じて、地下鉄のサービスの質の評価を高めることを示した（抄録）。", "p3": "公共交通指向型開発（TOD）の要素である土地利用のアクセス性と多モードの接続性、サービスの質を潜在変数として確認的因子分析で確かめ、構造方程式モデリングで関係を推定する（抄録）。", "p5": "土地利用のアクセス性は接続性を強く高め、接続性がサービスの質の評価を高めたが、アクセス性の直接効果は有意でなく、完全な媒介だった（抄録）。著者は、駅の最初と最後の移動をつなぐ統合があって初めて、街の改善が評価に効くと述べる。横断的な調査である。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr40", "rank": 40, "headline": "経路を考慮した大型トラック充電インフラの計画", "title": "Route-informed planning for medium- and heavy-duty truck charging infrastructure in California", "url": "https://doi.org/10.1016/j.trd.2026.105631", "authors": "Runhua Ivan Xiao ほか", "venue": "Transportation Research Part D Transport and Environment", "date": "2026-09-18", "sjr": 2.032, "citescore": 13.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Transportation Research Part Dの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "米国カリフォルニア州の貨物輸送の電動化で、車庫と公共の充電網が、空車の回送や経路の不成立を増やさずにトラック輸送を支えられるかを、運行に即して評価する枠組みを作った（抄録）。", "p3": "ディーゼルと電動トラックが混在する運行について、最適な場所を求めるのではなく、あらかじめ決めた車庫隣接と公共の急速充電の場所を、経路の成立、総走行距離と空車走行距離、充電の停車回数、費用の指標で比べる（抄録）。", "p5": "結果は想定した場面ごとの経路記録の比較で、実際の毎日のトラック運行や充電の滞在時間の観測を反映したものではないと著者は明記している（抄録）。抄録には具体的な数値の結果は書かれていない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr41", "rank": 41, "headline": "道路インフラの維持管理の統治と政策の優先順位", "title": "Rethinking Road Infrastructure Governance: Policy Priorities for Sustainable Improvement and Maintenance", "url": "https://doi.org/10.61987/jsse.v4i2.3079", "authors": "Dwi Putranto Riau", "venue": "Journal of Social Studies and Education", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Social Studies and Educationの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "道路の改良と維持管理を持続的に行うための政策の優先事項を、関係者へのインタビューで整理した（抄録）。", "p3": "道路部門の関係者への詳しいインタビューと文書・先行研究を使い、テーマ分析で優先事項を抽出する質的研究である（抄録）。対象の国や人数は抄録からは分からない。", "p5": "戦略的な道路計画、関係者の調整、維持の優先づけ、予算、監督と評価、住民と民間の参加、技術の導入、予防保全、人材、安全、環境への配慮などの相互に関連した優先事項を挙げた（抄録）。著者は、個別の対策ではなく統合された政策の枠組みが必要だと結論する。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr42", "rank": 42, "headline": "初期の幸福感がへき地教員の仕事への没頭を1年支える", "title": "How early well-being sustains work engagement across a one-year placement: A longitudinal mixed-methods study of rural volunteer teachers", "url": "https://doi.org/10.1016/j.tate.2026.105834", "authors": "Xiaochen Wang ほか", "venue": "Teaching and Teacher Education", "date": "2026-09-26", "sjr": 1.779, "citescore": 8.5, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "農村に1年間派遣されるボランティア教員で、派遣初期の幸福感がその後の仕事への熱意（ワーク・エンゲージメント）をどう支えるかを、縦断的な混合研究法で調べた研究（Teaching and Teacher Education）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "jr43", "rank": 43, "headline": "配達員と家事代行に見るプラットフォーム労働とジェンダー", "title": "Practising Gender Subjectivities in Platform Work: Food Delivery Workers and House Cleaning Workers in China", "url": "https://doi.org/10.1177/09500170261468515", "authors": "Jing Wang ほか", "venue": "Work, Employment and Society", "date": "2026-09-26", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Work, Employment and Societyの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "中国の料理配達と家事清掃のプラットフォーム労働で、働き手の性別に関わる主体性（男らしさ・女らしさの実践）が、プラットフォームの支配と日々の抵抗の両方に関わることを示した（抄録）。", "p3": "料理配達と家事清掃の2つの事例でインタビューを行い、プラットフォームを柔軟性とアルゴリズムによる管理を持つ「性別化された組織」と捉えて、働き手の主体性との相互作用を分析する（抄録）。", "p5": "男性の配達員は男らしさの危機を感じ、収入を最大にするため働き方の柔軟性を自ら手放し、長時間労働とけがのリスクにさらされていた（抄録）。女性の清掃員は偏見のある家事労働で尊重される女らしさを築こうとし、関係づくりでアルゴリズムの制約に対抗したが、不安定さと低賃金は続いた。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr44", "rank": 44, "headline": "LLMの介入開始時点を監査可能に評価する設計", "title": "A Reproducible, Provenance-Preserving Architecture for Sequential Intervention-Threshold Evaluation in Large Language Models", "url": "https://doi.org/10.31449/inf.v50i15.15648", "authors": "Alex Kolesnikov", "venue": "Informatica", "date": "2026-09-25", "citescore": 2.1, "citescore_year": "2024", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Informatica掲載のPDF本文（研究課題、§2.1用語、§2.4シナリオ構成、§4.4限界）と抄録を読んだ。§3結果の表は抄録の数値で確認", "preprint": false, "p1": "LLMに段階的に悪化する状況を順に示し「いつ初めて介入（ACT）を勧めるか」を測る評価を、全記録から結果データを完全に作り直せる監査可能な形にまとめ、離散時間のイベントヒストリー分析（生存時間分析）で扱えるようにした（抄録）。", "p2": "LLMの逐次的な判断の評価では、介入のタイミングを分析的に正しく、しかも提供元のモデルや配信経路が変わっても後から追跡・再構成できる形で記録する方法が確立していない（§1.1）。", "p3": "警告の兆候が段階ごとに積み重なるシナリオを固定し、各段階でそれまでの状況を含むが過去の自分の回答は含まない「状態だけの独立した呼び出し」をモデルに送り、WAIT（様子見）かACT（介入）かを答えさせる（§2.1）。最初のACTの段階をイベント、最後までACTがなければ打ち切り（censoring）として、各段階の「まだACTしていない」行をリスク集合にする。シナリオは健康5段階（A群）、健康10段階（B群）、健康以外（サイバー攻撃・金融詐欺・ガス漏れ・洪水）10段階（C群）の3群で、各8シナリオ（§2.4.2）。例：呼吸器の症状が段階ごとに悪化する話で、何段階目で受診を勧めるかを記録する。", "p4": "評価は、要因の組み合わせが全部そろっていること、預けた記録から結果ファイルとプロンプトの座標がすべて完全一致で再生成できること、各記録の出典をたどれること、段階が進むほどACTが増えるかどうか（条件付きハザードと群内のトレンド）である（§1.1）。", "p5": "13モデルで26,000の段階記録から25,999の判断有効な回答、3,120のシナリオ実行、10,088のリスク集合の行が得られ、結果ファイルと2,000のプロンプト座標は預けた記録から完全に再生成できた（抄録）。条件付きハザードは段階に依存したが単調ではなく、段階の線形トレンドのオッズ比はA群12.591、B群10.346、C群4.377だった（抄録）。ACTを含む実行の21.05%で、その後にWAITに戻る回答があった（抄録）。", "p6": "著者は、書かれた模擬シナリオであって臨床的な正しさや実際の被害防止を検証しないこと、段階の深刻さの順序を独立に検証していないこと、会話を持続させた場合との比較がないこと、英語の1つの言い回しに限ること、各条件1回の回答で確率的な安定性を推定していないことを限界に挙げている（§4.4）。再構成の検証は分析の再現性を示すもので、安定した閾値や安全性の妥当性を示すものではないとも明記している（抄録）。", "unverified": "モデル別の初回ACT段階の分布（§3の表）は確認していない。"}}, {"id": "jr45", "rank": 45, "headline": "LLMの臨床推論を過程で評価する研究計画", "title": "Process-Oriented, Behaviorally Anchored Assessment of Clinical Reasoning in Large Language Models and the Effect of Extended Thinking: Protocol for a Prospective, Multigroup, Comparative Study", "url": "https://doi.org/10.2196/103220", "authors": "Adnan Agha ほか", "venue": "JMIR Research Protocols", "date": "2026-09-22", "citescore": 2.8, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Research Protocolsの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "LLMの臨床推論を、最終的な答えの正誤ではなく推論の過程の質で評価する尺度（REACT–AI）を検証し、「拡張思考」モードが推論の質を上げるかを調べる研究の計画（プロトコル）を示した（抄録）。", "p3": "13の下位領域を持つ行動に基づく評定尺度を作り、6つの主要モデルの標準モードと拡張思考モード（12条件）で、5つの救急外来の症例に各3回答えさせる（180の出力）。専門医5人と医学生も答え、人間の二重盲検の評定とLLMによる判定を並行させ、同じ系統のモデルには判定させない（抄録）。", "p5": "LLMの判定を大規模に使う基準を、重みつきκが0.60以上、ICCが0.75超と事前に定め、第2段階で3600の出力を採点する計画である（抄録）。計画の論文で、結果はまだない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr46", "rank": 46, "headline": "エージェント型の推薦システムの定義と課題", "title": "The Future is Agentic: Definitions, Perspectives, and Open Challenges of Multi-Agent Recommender Systems", "url": "https://doi.org/10.1145/3845988", "authors": "Reza Yousefi Maragheh ほか", "venue": "ACM Transactions on Recommender Systems", "date": "2026-09-24", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "ACM Transactions on Recommender Systemsの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "LLMのエージェントを複数組み合わせた推薦システムを定義・定式化し、課題を整理したうえで、単発の推薦より常に良いわけではないことを小さな実験で示した（抄録）。", "p3": "推薦エージェントを、状態（利用者・文脈・履歴・候補）、推論の中核、推薦用の道具、階層的な記憶、方針の制約で表し、複数エージェントの推薦を「エージェント・共有環境・通信規約」の三つ組で定式化する（抄録）。Amazon-2023のカテゴリで、単発の推薦と複数エージェントの推薦を同じ条件で比べる。", "p5": "代表的な標本では単発の推薦がパレート効率的で、分解やアンサンブルのエージェントは履歴の多様性が高い利用者でだけ役立った（抄録）。著者は、品質の上積みが遅れ・費用・統治のリスクに見合う場合にだけ複雑さを使うべきだと述べ、実装とプロンプトを公開している。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr47", "rank": 47, "headline": "補聴器相談でLLMチャットボットを専門家と一般人が評価", "title": "Evaluation of large language model-based chatbots in hearing aid consultations: A comparative study of experts and non-experts", "url": "https://doi.org/10.1177/20552076261490211", "authors": "Yuseon Byun ほか", "venue": "DIGITAL HEALTH", "date": "2026-09-26", "citescore": 5.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DIGITAL HEALTHの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "補聴器の相談で、汎用のLLM（ChatGPT、HyperCLOVA X、MaumAI）の回答を、専門家と患者・家族がどう評価するかを比べ、両者の評価の食い違いを示した（抄録）。", "p3": "実際の問い合わせ1,632件から7分野の代表的な33項目を専門家の合議で選び、各モデルの回答を10回ずつ作って最良のものを選んだうえで、専門家20人と非専門家33人が正確さと好みを3段階で評価した（抄録）。", "p5": "両群ともChatGPTを統計的に有意に好んだが、群内・群間の一致は非常に低かった（Kendall’s W < 0.07）（抄録）。専門家は臨床的な正確さを、非専門家は実用的で共感的な分かりやすさを重んじた。著者は、専門のデータで学習した小型の言語モデルが必要だと述べる。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr48", "rank": 48, "headline": "ボルト接合の非線形応答をCNNで予測する代理モデル", "title": "JustAct: A Framework for Auditable Multi-Agent Systems Regulated by Inter-Organisational Policies", "url": "https://doi.org/10.46298/lmcs-22(3:9)2026", "authors": "Christopher A. Esterhuyse ほか", "venue": "Logical Methods in Computer Science", "date": "2026-09-24", "citescore": 2.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Logical Methods in Computer Scienceの掲載論文の抄録（Crossref）を使用", "preprint": false, "short": true, "p1": "組織をまたぐマルチエージェントシステムで、エージェントの行動を法律や個別の同意などの方針で規制し、後から監査できるようにする枠組みJustActを提案し、性質を証明して実装した（抄録）。", "p3": "行為者が、動的な方針の表明と合意から集めた十分な情報で自分の行動を正当化するシステムのクラスを定め、その性質を証明する。特定の方針言語と実行系をRocqで仕様化しRustで実装する（抄録）。", "p5": "ある行動が今許されるという判断は、後から表明が加わったり合意が更新されたりしても覆らないことなどを証明した（抄録）。既存の医療データ処理システムBraneの利用場面を再現する事例研究で、実装を示し評価した。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jr49", "rank": 49, "headline": "断面欠損のある鋼梁の横ねじれ座屈を有限要素で解析", "title": "A finite element formulation for the elastic lateral torsional buckling analysis of steel beams with area losses", "url": "https://doi.org/10.1016/j.jobe.2026.117417", "authors": "Cao Thi Mai Huong ほか", "venue": "Journal of Building Engineering", "date": "2026-09-26", "sjr": 1.703, "citescore": 13.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "断面の欠損（腐食などによる減肉）がある鋼の梁について、弾性の横ねじれ座屈を解析する有限要素の定式化を扱った研究（Journal of Building Engineering）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "jr50", "rank": 50, "headline": "アコースティック・エミッションで溶接部の疲労損傷を追跡", "title": "Fatigue damage evolution of Q460C steel welded plate based on acoustic emission signals", "url": "https://doi.org/10.1016/j.tafmec.2026.105996", "authors": "Hongmei Tan ほか", "venue": "Theoretical and Applied Fracture Mechanics", "date": "2026-09-26", "sjr": 1.317, "citescore": 10.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "Q460C鋼の溶接板の疲労による損傷の進み方を、アコースティック・エミッション（AE）信号で調べた研究（Theoretical and Applied Fracture Mechanics）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "都市の有色人種の生徒を郊外の学校へ通わせる効果", "title": "Busing to Opportunity? The Impacts of the METCO Voluntary School Desegregation Program on Urban Students of Color", "url": "https://doi.org/10.1093/qje/qjag043", "authors": "Elizabeth Setren", "venue": "The Quarterly Journal of Economics", "date": "2026-09-26", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "50年以上続くボストンの任意の学校統合プログラムが生徒の成果に与えた効果を推定し、学校割り当て政策による機会の拡大と人種・経済的統合の議論に証拠を与える。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに新たに登録された抄録を使用（Semantic Scholarで所在が分かったPDFは取得できず）", "preprint": false, "p1": "ボストンの有色人種の生徒を郊外の成績の高い学校へバスで通わせる任意の学校統合プログラム（METCO）について、通学の機会を得た生徒は、テストの成績、高校卒業、大学進学・卒業、成人後の所得がいずれも上がったことを、入学の申し出の有無を使った推定で示した（抄録）。", "p2": "学校の割り当て政策は、成績の高い学校への機会を広げ、人種と社会経済的な統合を進める重要な手段だが、郊外の学校に通うこと自体の因果効果は、誰が応募し選ばれるかの偏りのため測りにくい（抄録）。METCOは50年以上続いている。", "p3": "入学の申し出を受けた応募者と受けなかった応募者を比べ、待機リストの優先順位を操作変数とする二段階最小二乗法（2SLS）で、郊外の学校に通う効果を推定する。出生記録と応募データの豊富な属性を統制する（抄録）。例：同じ時期に応募した生徒のうち、待機リストの順位の違いで申し出を受けた生徒と受けなかった生徒を比べる。", "p4": "結果は数学・英語のテストの成績、中退、期限内の高校卒業、4年制大学への進学希望・入学・卒業、成人後の所得で、親の学歴や性別による違い、学校の付加価値・同級生・進学文化などの経路も調べる（抄録）。", "p5": "郊外の学校に通うと、数学と英語の成績が上がり、中退が減り、期限内の高校卒業が増え、4年制大学への進学希望・入学・卒業と成人後の所得も増えた（抄録）。効果は親が大学に行っていない生徒と男子で最も大きかった。参加者は下位の授業クラスに振り分けられやすく、上級の授業を受けられれば効果はさらに大きかった可能性がある（抄録）。効果の大きさの数値は抄録にない（未確認）。", "p6": "解釈：推定されるのは申し出によって通学が変わった生徒（遵守者）についての効果で、全応募者の平均効果とは限らない。1つの都市圏のプログラムの結果である。", "unverified": "効果の大きさ（得点の標準偏差、所得の増加率など）と、待機リストの優先順位が外生的とみなせる根拠は本文未入手のため確認できなかった。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "家庭の節水診断は効くのか：4.5万世帯の実験", "title": "Do Water Audits Work?", "url": "https://doi.org/10.1093/ej/ueag124", "authors": "Jesper Akesson ほか", "venue": "Economic Journal", "date": "2026-09-26", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "why": "英国で約4万5千世帯を無作為に割り付けた自然実験で、家庭向けの節水診断の効果・持続性・厚生への影響を検証し、水資源政策に因果的な証拠を与える。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに新たに登録された抄録を使用（Semantic Scholarで所在が分かったPDFは取得できず）", "preprint": false, "p1": "英国の約45,000世帯を無作為に割り付けた自然の現場実験で、オンラインの家庭向け節水診断（water audit）に金銭的誘因を付けると、受診が増え直後の水使用が大きく減るものの、効果は約2か月で消え、厚生の利益は小さいことを示した（抄録）。", "p2": "水道事業者は家庭の節水診断を節水策として使うことに関心を強めているが、その効果、持続性、厚生への影響についての因果的な証拠は限られていた（抄録）。", "p3": "英国の水道事業者の顧客約45,000世帯を、オンラインの節水診断を受けるよう促す異なる働きかけ（金銭的誘因の有無・大きさなど）に無作為に割り付ける（抄録）。働きかけによって診断を受けた世帯（遵守者：compliers）の水使用の変化を推定する。例：誘因を示された世帯のうち診断を受けた世帯で、その後の使用量がどれだけ減ったかを見る。", "p4": "診断の受診率、遵守者の水使用量の変化とその持続期間、1人あたりの純便益（厚生）、使用量の多い世帯に絞った場合の効果を評価する（抄録）。", "p5": "金銭的誘因は受診を大きく増やし、遵守者の水使用は2か月間で約17%減った（抄録）。誘因の額は受診率には効いたが、節水の大きさには効かなかった。節水効果は急速に弱まり、約2か月後には検出できなくなったため、1人あたりの純便益は幅広い仮定の下で通常1ポンド未満だった（抄録）。使用量の多い世帯に絞ると短期の節水効果はおよそ2倍になったが、持続しないため大きな厚生の利益にはならなかった（抄録）。", "p6": "著者は、節水診断と誘因の政策的な価値は効果が持続するかどうかに決定的に依存すると結論している（抄録）。解釈：オンライン診断という形式と英国の料金制度の下での結果で、訪問型の診断や他国への一般化には注意が要る。", "unverified": "働きかけの各群の内容と受診率、厚生計算の仮定の詳細は本文未入手のため確認できなかった。"}}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "米国の対中関税の一部は中国企業が値下げで負担", "title": "Reconciling Aggregate And Firm-Level Tariff Pass-Through: Evidence From The 2018–2019 Us Tariffs On China", "url": "https://doi.org/10.1093/ej/ueag118", "authors": "Haichao Fan ほか", "venue": "Economic Journal", "date": "2026-09-25", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "why": "製品単位では関税が完全に価格に転嫁されたとする先行研究に対し、企業単位の税関データで中国企業が関税抜き価格を下げていたことを示し、関税の負担者をめぐる理解を改める。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補一覧に載った抄録の冒頭部分（約400字）のみを使用", "preprint": false, "p1": "2018〜2019年の米中貿易戦争で、製品単位では関税が米国の輸入価格に完全に転嫁されたとする先行研究に対し、企業単位の税関データで中国企業が関税抜きの輸出価格を下げていた（不完全な転嫁）ことを示した（抄録冒頭）。", "p2": "先行研究は製品単位のデータで関税の完全な転嫁を見いだしており、関税の負担を米国の輸入者・消費者が負ったと解釈されてきた。集計の水準と企業の水準の結果の食い違いを調整する必要がある（抄録冒頭）。", "p3": "中国企業の企業単位の税関データを使い、米国の関税の引き上げに対する関税抜き価格の反応を推定する（抄録冒頭）。詳細な推定方法は未確認。", "p4": "未確認（抄録の後半・本文を入手できず）", "p5": "関税が1ポイント上がると、中国企業の関税抜きの価格は0.172%下がった（抄録冒頭）。以降の結果（集計との調整の仕組み）は未確認。", "p6": "未確認（抄録の後半・本文を入手できず）", "unverified": "集計水準の結果と企業水準の結果をどう調整したか、推定の頑健性は確認できなかった。"}}, {"id": "jn04", "rank": 4, "field": "因果推論", "headline": "ネイマンの無作為化実験の推測を現代的に整理", "title": "Neymanian inference in randomized experiments", "url": "https://doi.org/10.1515/jci-2025-0037", "authors": "Ambarish Chattopadhyay ほか", "venue": "Journal of Causal Inference", "date": "2026-09-24", "citescore": 3.3, "citescore_year": "2025", "why": "1923年のネイマンの分散推定の問題から出発し、無作為化実験での設計に基づく推測を体系的に論じ、実験データの分析の基礎を示す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "無作為化実験で平均処置効果の差の推定量の分散を推定するネイマン（1923年）の方法を、2つの別の導き方で捉え直し、完全無作為化以外の複雑な実験計画にも使える2つの分散推定の方法（補完による方法と対比による方法）を示した（抄録）。", "p2": "ネイマンの分散推定量は一般に保守的（大きめ）で、処置効果が全員で同じときに不偏になり、完全無作為化では広く使われている。しかし、層別や群単位など、より複雑な計画に拡張する一意で自然な方法はなかった（抄録）。", "p3": "補完による方法は、分散を観測された潜在的結果と観測されない潜在的結果で表し、観測されない方を補完して推定する（フィッシャー流の推測に近い）。対比による方法は、分散を観測できない潜在的結果の差（対比）で表し、それぞれを観測できる対比に置き換えて推定する（抄録）。例：処置群の人の「処置を受けなかった場合の結果」は観測できないので、それを補うか、観測できる差で代用するかの違いである。", "p4": "2つの方法がどちらも完全無作為化ではネイマンの推定量に戻ることを確かめ、より一般的な計画での性質（非負か、保守的か、どの条件で不偏か）を理論的に調べる（抄録）。", "p5": "2つの方法は、一般の計画では根本的に異なる分散推定量を与えた（抄録）。広いクラスの計画で、どちらも非負で保守的な分散推定量を与え、処置効果が同じなら有限標本または漸近的に不偏になることを示した。", "p6": "解釈：抄録からは、どちらの方法をどの計画で選ぶべきか、保守性の程度がどれだけ違うかは分からない。実験の分析で、層別・ペア・群単位など計画に合った標準誤差を作るときの理論的な土台になりうる（Journal of Causal Inferenceに掲載）。", "unverified": "シミュレーションや実例での2つの方法の比較と、対象となる計画のクラスの具体的な条件は確認していない。"}}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "透明性規制の直接効果と間接効果を分ける", "title": "Direct and Indirect Effects of Transparency Regulation", "url": "https://doi.org/10.1016/j.jacceco.2026.101950", "authors": "Matthias Breuer ほか", "venue": "Journal of Accounting and Economics", "date": "2026-09-24", "citescore": 11.7, "citescore_year": "2025", "why": "透明性規制の効果を、規制対象への直接効果と周囲への間接効果に分けて評価する研究で、開示規制の評価の方法に関わる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "企業の情報開示を義務づける透明性の規制が、規制を受ける企業自身の経済活動を減らす一方、関連する他の企業の経済活動を増やし、両者がほぼ打ち消し合うことを、欧州のデータで示した（抄録）。", "p2": "透明性の規制は市場の働きを良くすると期待される一方、開示の費用や競争上の不利を企業に課す。規制の効果を測る研究は多くが対象企業への直接の影響だけを見ており、取引先や競合など関連企業への間接の影響を含めた経済全体への効果は分かっていなかった（抄録）。", "p3": "規制の違いを生む2つの源を使う。①財務報告の要件の範囲が企業によって違うこと、②欧州で電子的な企業登記簿が国ごとに時期をずらして導入されたこと（抄録）。これにより、自社が規制を受ける直接の曝露と、関連企業が規制を受ける間接の曝露を分ける。例：ある企業の決算が公開されると、その企業の生産は減るかもしれないが、公開された情報を使える取引先や競合の活動は増えうる。", "p4": "結果は、生産や雇用などの企業の経済活動である。直接の効果と間接の効果の向きと大きさを比べる（抄録）。", "p5": "規制への直接の曝露は対象企業の経済活動を減らす傾向があり、関連企業への規制による間接の曝露は対象企業の活動を増やす傾向があった（抄録）。負の直接効果と正の間接効果はほぼ同じ大きさで、ほとんど完全に打ち消し合った。", "p6": "著者は、透明性の規制は経済活動の総量を増減させるより、規制の強い市場から弱い市場へ活動を移し替えていると解釈している（抄録）。解釈：直接効果だけを見る評価では規制の害を過大に見積もりうることを示す。関連企業の定義や、どの国・期間かは抄録からは分からない（Journal of Accounting and Economicsに掲載）。", "unverified": "関連企業の定義、効果の具体的な大きさ、対象国と期間は確認していない。"}}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "年長で人脈の厚い研究者と若く創造的な研究者、どちらが新説を広めるか", "title": "Old and connected versus young and creative: Networks and the diffusion of new scientific ideas", "url": "https://doi.org/10.1016/j.respol.2026.105628", "authors": "Wei Cheng ほか", "venue": "Research Policy", "date": "2026-09-24", "citescore": 17.6, "citescore_year": "2025", "why": "科学のネットワークの中で新しいアイデアが誰を通じて広がるかを扱い、知識の普及とイノベーション政策に示唆を与える。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用（オープンアクセス版は取得を拒否された）", "preprint": false, "p1": "生物医学の共著ネットワークで、新しい研究のアイデアが誰から誰へ広がるかを調べ、近い距離では若い研究者のアイデアが、遠い距離では中堅の研究者のアイデアが最も採用されることを示した（抄録）。", "p2": "新しいアイデアの採用は科学の進歩に欠かせず、アイデアを出す人、採用しうる人、その間のネットワークが関わる。研究者の経歴の長さ（キャリア年齢）がアイデアの普及にどう影響するかは、ネットワーク上の距離と合わせては調べられていなかった（抄録）。", "p3": "自然言語処理で論文から新しいアイデアを特定し、共著ネットワーク上の距離と、アイデアを出した人・採用しうる人のキャリア年齢で、採用の起こりやすさを分析する。新しい固定効果の推定戦略で、人やアイデアの違いによる偏りを除く（抄録）。例：共著者の共著者（2歩先）にいる若手が、別の若手の新しい手法を使い始めるかを見る。", "p4": "結果は新しいアイデアの採用で、ネットワーク上の距離（3歩以内か、それより遠いか）ごとに、アイデアを出した人のキャリア年齢による違いを比べる。研究者の高齢化がアイデアの採用に与える影響をシミュレーションで調べる（抄録）。", "p5": "3歩以内の近い距離では若い研究者のアイデアが最も採用され、それより遠い距離では中堅の研究者のアイデアが最も採用された（抄録）。この違いの主な理由は、若い採用者が近くの若い研究者のアイデアを特に採用しやすいことだった。シミュレーションでは、アイデアを出す側の高齢化と採用する側の高齢化が、重要な新しいアイデアの採用に同程度の影響を与えた。", "p6": "解釈：題名の「年長でつながりが多い」対「若く創造的」という対比は、アイデアが遠くまで届くには中堅のネットワークが、近くで広まるには若手同士のつながりが効くことを示唆する。研究者の高齢化が進む中で、若手の間のつながりを支える意味を持つ。生物医学以外の分野に当てはまるかは抄録からは分からない（Research Policyに掲載）。", "unverified": "アイデアの特定方法、固定効果の推定の詳細、効果の大きさの数値は確認していない。"}}, {"id": "jn07", "rank": 7, "field": "因果推論", "headline": "居住地の分離が黒人女性の妊娠しやすさに影響", "title": "Residential Segregation and Fecundability in the Black Women’s Health Study", "url": "https://doi.org/10.1093/aje/kwag229", "authors": "Chen Sheng ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-25", "citescore": 7.1, "citescore_year": "2025", "why": "居住地の人種分離が黒人女性の受胎能（妊娠しやすさ）に与える影響を大規模コホートで調べ、構造的な不平等と健康の研究に証拠を加える。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国の黒人女性の前向きコホート研究で、人種と所得による居住の分離（隔離）が、1周期あたりの妊娠のしやすさ（受胎能：fecundability）と関連するかを調べ、最も恵まれた地域に比べてそれ以外の地域で受胎能がやや低い傾向を示した（抄録）。", "p2": "居住の分離は生殖の結果に影響しうるが、妊娠のしやすさへの影響を調べた研究は少なかった（抄録）。", "p3": "1995年に始まったBlack Women’s Health Studyの参加者が、2011年の追加調査で、各出産について計画した妊娠かと妊娠までの月数を報告した。居住の分離は国勢調査区ごとの「両極への集中の指標」（ICErace + income）で測り、最も恵まれた群から最も周縁化された群まで分ける（抄録）。", "p4": "比例確率回帰と一般化推定方程式で受胎能の比（FR）と95% CIを推定し、年齢、暦年、地域、幼少期の社会経済的地位、学歴を調整する。分析には2183人の参加者の2857回の計画妊娠の試みが含まれた（平均年齢34歳）（抄録）。", "p5": "最も恵まれた群に比べ、最も周縁化された群のFRは0.88（95% CI, 0.74, 1.04）、混合（周縁化）の群は0.89、混合（恵まれた）の群は0.91で、いずれも受胎能はやや低い方向だった（抄録）。大学卒の参加者と出産経験のない参加者で関連が強かった。", "p6": "解釈：3つの群のFRの95% CIはいずれも1を含んでおり、関連は不確かさが大きい。妊娠までの月数は後から思い出して報告したもので、記憶の誤差がありうる。抄録は「効果を推定する」としているが、観察研究である（American Journal of Epidemiologyに掲載）。", "unverified": "本文の感度分析、交絡の扱いの詳細、分離の指標の測定時点は確認していない。"}}, {"id": "jn08", "rank": 8, "field": "因果推論", "headline": "近隣の構造的人種差別を測り出生の格差を理解する", "title": "Beyond poverty and education: measuring structural racism in neighborhoods to understand racialized birth outcome disparities", "url": "https://doi.org/10.1093/aje/kwag193", "authors": "Brittney Francis ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-25", "citescore": 7.1, "citescore_year": "2025", "why": "貧困や教育を超えて近隣の構造的人種差別を測る指標を作り、人種による出生の結果の格差の理解を深める。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用。この論文は別の論文への論評（commentary）である", "preprint": false, "p1": "近隣の環境と、人種による出生の結果の格差を扱った最近の研究への論評で、貧困や学歴ではなく、構造的な人種差別そのものを近隣の水準で測る必要があると論じた（抄録）。", "p2": "近隣の環境は健康の悪さと人種の健康格差の根本原因とされ、出生の結果の格差にも関わる。論評の対象の研究は、サウスカロライナ州の複数世代をつないだ出生証明書から、国勢調査区の豊かさと不利さの一生の軌跡を作り、米国南部に研究を広げた（抄録）。", "p3": "論評は3つの主張をする（抄録）。①近隣と生殖の健康の研究に一生の視点（ライフコース理論）を明示的に取り入れ、近隣の環境を複数の時点で測るべきこと。②近隣の住民の構成に注目するより、介入の目標がはっきりし、構造的な人種差別の複雑な過程を捉える曝露の指標を作るべきこと。③近隣そのものの歴史（近隣の一生）を考えるべきこと。", "p4": "論評であり、新しいデータの分析は行っていない（抄録）。", "p5": "著者は、対象の研究が一生の視点の重要さ、豊かさと不利さの両方が人種格差に果たす役割、南部への拡張の点で貢献したと評価している（抄録）。", "p6": "著者は、近隣を周縁化してきた歴史的・現代的な慣行を調べ、周産期の結果を改善するための具体的な行動につなげる研究を求めている（抄録）。解釈：実証の結果ではなく研究の方向を示す文章である（American Journal of Epidemiologyに掲載）。", "unverified": "論評の対象の論文の著者名（抄録では伏せ字）と、その研究の具体的な結果は確認していない。"}}, {"id": "jn09", "rank": 9, "field": "因果推論", "headline": "アロスタティック負荷を3要素の得点に改良し死亡を予測", "title": "Refining Allostatic Load Measurement: Mortality Associations of an Empirically Derived Three-Component Score in the Women’s Health Initiative", "url": "https://doi.org/10.1093/aje/kwag240", "authors": "Christine Alison Cirovic ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-25", "citescore": 7.1, "citescore_year": "2025", "why": "慢性ストレスによる生理的な乱れの指標（アロスタティック負荷）を実証的に3要素に整理し、死亡との関連を示して測定を改善する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "慢性的なストレスによる体の調節の乱れを表す「アロスタティック負荷」を、収縮期血圧・腰囲・白血球数の3つだけで測る簡単な指標を作り、閉経後の女性150 293人で死亡と強く関連することを示した（抄録）。", "p2": "アロスタティック負荷は広く使われているが、測り方が研究ごとにばらばらで、再現性と公平さを損なっている。一般的な生体指標だけの簡単な指標にすれば、さまざまな場で使いやすくなる（抄録）。", "p3": "Women’s Health Initiativeのデータで、心血管・代謝・免疫の分野の生体指標の中から、死亡との関連が安定しているものを選び、収縮期血圧、腰囲、白血球数の3つからなる0〜3点の指標を作る（抄録）。例：3つのうち2つが基準を超えれば2点になる。", "p4": "Cox比例ハザードモデルで、全死亡、心血管死亡、免疫・炎症による死亡との関連を、人口学的・臨床的な共変量を調整して推定する（抄録）。", "p5": "指標の点が高いほど死亡と強く関連した（抄録）。全死亡のハザード比は、0点に比べて1点で1.34（95% CI, 1.30–1.38）、2点で1.74、3点で2.27（2.15–2.39）で（Ptrend < 0.001）、心血管と免疫・炎症による死亡でも同様だった。", "p6": "解釈：死亡との関連が安定する指標を同じデータで選んでいるため、他の集団でも同じくらい関連するかは別のデータで確かめる必要がある。閉経後の女性に限られる。3つとも健診で測れる指標なので、資源の限られた場や大規模研究で使いやすい（American Journal of Epidemiologyに掲載）。", "unverified": "指標の各要素の基準値、選ばれなかった生体指標、外部データでの検証の有無は確認していない。"}}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "マクロ運用型債券ファンドが示す金融政策の転換", "title": "What can macro-active bond funds tell us about monetary policy change?", "url": "https://doi.org/10.1016/j.jfineco.2026.104378", "authors": "Claire Yurong Hong ほか", "venue": "Journal of Financial Economics", "date": "2026-09-26", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "債券ファンドの運用行動から金融政策の変化に対する市場の読みを取り出す試みで、最上位の金融誌に掲載された。", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、マクロ経済の見通しに基づいて積極的に運用する債券ファンドの行動から、金融政策の変化について何が読み取れるかを調べる研究だと分かる（題名からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"id": "jn11", "rank": 11, "field": "機械学習", "headline": "内在次元を測る普遍的な最近傍推定量", "title": "A Universal Nearest-Neighbor Estimator for Intrinsic Dimensionality", "url": "https://doi.org/10.1109/tpami.2026.3734737", "authors": "Eng-Jon Ong ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "データの内在次元（本質的な自由度）を推定する普遍的な最近傍法を提案し、次元削減や表現学習の基礎的な道具を改良する。", "explain": {"basis": "本文", "basis_note": "arXiv版（2603.10493）のPDF本文（§I序論、§II手法、§IV実験設定、§V結果、§VI考察）と図の説明を読んだ。§IIIの証明と表の個別数値は未確認", "preprint": false, "p1": "データの見かけの次元ではなく本当の自由度である「内在次元（intrinsic dimensionality）」を、最近傍までの距離の比だけから簡単に推定する方法L2N2を提案し、データを生む分布によらず真の次元に収束する（普遍性）ことを証明した（抄録、§I）。", "p2": "高次元のデータは低次元の構造の上や近くに集まるという多様体仮説のもとで、内在次元の推定は機械学習や画像処理の基本的な課題だが、既存の方法は幾何や分布の仮定に頼り、仮定が崩れると大きく失敗する。次元の呪い、尺度への依存、分布への敏感さも課題だった（抄録、§I）。", "p3": "各点からk番目とj番目に近い点までの距離の比の対数の対数（−log log）を全点で平均した統計量を使う（式II.1–II.2）。この平均値は次元の対数とほぼ直線の関係にあり、その傾きと切片は標本の大きさには依存するが分布には依存しないため、d次元の正規分布から作った点群で一度だけ調整すれば、どのデータにも使い回せる（§II、§IV-A、図1）。例：顔写真の画像は画素数が多くても、顔の向きや照明など少数の要因で決まるので、内在次元は小さい。", "p4": "真の次元が分かっている24の標準的な多様体（内在次元1から70、埋め込み次元3から72）、雑音を加えた球面、真の次元が推測されている実データ（ISOMAPの顔画像、MNIST、CIFAR-100、Isolet）で、TwoNN、GriDE、最尤法（MLE）などと平均の相対誤差（MPE）で比べる（§IV-B、§V）。", "p5": "標準の多様体では、L2N2（k = 2, j = 1）が、ベンチマーク用に調整されていないにもかかわらず、比較したすべての方法をすべての標本の大きさで上回った（§V-A、表II）。特に非線形で次元の高い多様体で良く、球面ではTwoNN、GriDE、MLEが次元が高いほど系統的に過小に推定したのに対し、L2N2は正確に推定した（図3）。雑音にはどの方法も敏感で、雑音が増えると推定次元は大きくなった（§V-B）。", "p6": "著者は、証明は有界な密度を持つ滑らかな多様体上のデータに限られ、フラクタルや層状の空間への拡張は今後の課題だと述べている（§I-B）。最も単純な(k, j) = (2, 1)が一貫して最良で、1次元のらせんでは遠い近傍を使うと他の部分の点を拾って推定がずれた（§VI）。解釈：理論は漸近的で、有限標本の補正は正規分布からの調整に頼っており、調整に使う次元の範囲の選び方で精度が変わる（§IV-A）（IEEE TPAMIに掲載）。", "unverified": "§IIIの普遍性の証明の詳細と、表IIの手法別のMPEの数値は確認していない。"}}, {"id": "jn12", "rank": 12, "field": "機械学習", "headline": "時間方向の低ランク性で大規模言語モデルの微調整を省メモリ化", "title": "TeZO: Empowering the Low-Rankness on the Temporal Dimension in the Zeroth-Order Optimization for Fine-Tuning LLMs", "url": "https://doi.org/10.1109/tpami.2026.3734392", "authors": "Yan Sun ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "勾配を使わないゼロ次最適化でLLMを微調整する際に、時間方向の低ランク性を使ってメモリと計算を減らす。", "explain": {"basis": "本文", "basis_note": "arXiv版（2501.19057）のPDF本文（§1序論と図1、§6実験の一部、§7結論）を読んだ。§4手法の式、§5理論解析、付録は未読", "preprint": false, "p1": "勾配を計算せず、損失の値だけでLLMを微調整する0次最適化（zeroth-order optimization：ZO）で、勾配が各時点で低ランクなだけでなく、学習の全期間を通じてほぼ同じ部分空間にあるという性質を使う推定量TeZOを作り、メモリと時間を減らした（抄録、§1）。", "p2": "ZOは逆伝播が要らずメモリを大きく節約できるため、LLMの微調整で注目されている。最近の低ランクのZOは各時点の勾配の低ランク性だけを使っており、T回の反復の総費用はパラメータの次元dとともに増え続けていた（§1）。", "p3": "OPT-1.3Bの微調整で、各時点の勾配が低ランクであり、かつT回の反復の勾配がほぼ同じ部分空間にあることを確かめた（図1）。そこで、ZOの摂動を「行×列×時間」の3次元のテンソルとして表し、正準多進分解（CPD）で低ランクの行列を取り出す。各時点では時間方向の因子ベクトルだけを作ればよいので、費用の増え方が抑えられる。層ごとにランクを動的に選ぶ仕組みと、運動量とAdamの省メモリ版も作る（§1）。例：毎回ランダムな方向を一から作る代わりに、共通の方向の組を使い回し、時点ごとの重みだけを変える。", "p4": "RoBERTa-largeの感情分類・推論・検索の課題（5回の乱数での平均）と、OPT-13B、LLaMA-7Bの大規模モデルで、MeZOなどのZOと低ランクのZOの方法と、精度、GPUメモリ、1反復あたりの時間を比べる（§6、表3、表5、図3）。", "p5": "TeZO-AdamはMeZO-SGDよりメモリが少なく、MeZO-Adamの約35%のメモリで済んだ（抄録、図1c）。中規模のモデルではMeZOが最も正確だったが、低ランクの方法との差は平均で最大0.6%だった（§6）。大規模なモデルでは、TeZO-AdamがMeZOに比べてLLaMA-7Bで約2.2%、OPT-13Bで約2.8%改善した（§6）。", "p6": "著者は、TeZOが従来の低ランクのZOと同じ収束の速さを保ちつつ、訓練の費用が少ないことを証明したと述べる（§7）。解釈：改善は既存のZO同士の比較であり、通常の逆伝播による微調整（全体や LoRA）との精度の差はこの範囲では確認していない。arXiv版は「査読中」と記されていたが、IEEE TPAMIに掲載された。", "unverified": "§5の収束の証明の条件、表の課題別の数値、逆伝播による微調整との比較の有無は確認していない。"}}, {"id": "jn13", "rank": 13, "field": "機械学習", "headline": "連合学習で勾配から入力を復元する新たな攻撃", "title": "Beyond Gradient Inversion: Hidden Subset Sum Problem-Based Input Reconstruction for Federated Learning", "url": "https://doi.org/10.1109/tpami.2026.3735649", "authors": "Qiongxiu Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "連合学習で共有される情報から学習データを復元できることを部分和問題として示し、プライバシー保護の前提を問い直す。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "連合学習（federated learning）で共有される勾配などから元の入力データを復元できてしまう危険を、暗号理論で知られる「隠れ部分和問題（HSSP）」として数学的に定式化し、既存の勾配逆算攻撃の限界を超えることを示した（抄録）。", "p2": "連合学習では、データそのものではなく学習の更新だけを共有するが、勾配からデータを推測する勾配逆算攻撃（GIA）が知られている。既存の経験的な攻撃は、バッチ内のラベルの多様さに依存し、バッチが大きいと性能が落ちるという限界があった（抄録）。", "p3": "計算量理論と暗号で使われる隠れ部分和問題を連合学習に当てはめ、プライバシーの弱さを分析する厳密な枠組みにする（抄録）。例：多数のデータの寄与が足し合わされた更新から、元の個々のデータを「どの組み合わせの和か」という問題として解き戻す。", "p4": "この枠組みで、ラベルの多様さへの依存と大きなバッチでの性能低下という課題を克服できるかを調べ、既存の攻撃がバッチの大きさとともに悪くなる根本的な理由を分析する。安全なデータ集約（秘密計算）を使った場合の攻撃の時間計算量も調べる（抄録）。", "p5": "HSSPにもとづく方法は既存の勾配逆算攻撃の限界に対処し、既存の攻撃がバッチの増加で悪化する根本的な理由も明らかになった（抄録）。秘密計算のような安全な集約を使うと、攻撃の時間計算量が大きく増えた。", "p6": "著者は、HSSPと連合学習を結びつけた最初の研究で、防御策の開発の分析の土台になると述べている（抄録）。解釈：抄録には復元の精度や実験の数値がなく、実際のモデルやデータでどこまで復元できるかは本文で確かめる必要がある（IEEE TPAMIに掲載）。", "unverified": "実験の設定、復元の精度、比較した既存の攻撃の具体名は確認していない。"}}, {"id": "jn14", "rank": 14, "field": "腫瘍学", "headline": "腫瘍変異量の多さが脳転移と関連", "title": "Association of high tumor mutational burden with brain metastases: Insights from a large-scale database analysis", "url": "https://doi.org/10.1093/neuonc/noag222", "authors": "Marana Abboud ほか", "venue": "Neuro-Oncology", "date": "2026-09-26", "sjr": 5.249, "citescore": 21.1, "citescore_year": "2025", "why": "がんの種類を越えて脳転移に共通する分子的特徴を大規模ゲノムデータで探り、脳転移リスクの層別化につながりうる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "150,486の腫瘍検体のゲノムデータから、がんの種類を問わず脳転移に共通する分子的特徴として、腫瘍変異量の多さ（TMB-high）とTP53・KRASの変化を見いだし、種類ごとの特徴（メラノーマのTERTなど）も整理した（抄録）。", "p2": "脳転移はがん死の大きな原因で、脳に定着するには特有の適応が必要と考えられるが、元のがんの種類を越えて共通する分子的特徴があるかは分かっていなかった（抄録）。", "p3": "非小細胞肺がん、大腸がん、乳がん、食道がん、メラノーマ、神経内分泌腫瘍の6種類について、脳転移4,538検体、脳以外の転移43,844検体、原発巣などの局所生検71,738検体を含む150,486検体のゲノム変化、経路の濃縮、TMB-high、マイクロサテライト不安定性の高さ（MSI-H）を比べる（抄録）。", "p4": "3群（脳転移・脳以外の転移・局所生検）の間で、各ゲノム変化とTMB・MSI-Hの頻度、経路ごとの変化の頻度を比較する（抄録）。", "p5": "脳転移は、調べたすべてのがん種で局所生検と脳以外の転移よりTMB-highが多く、TMBの中央値も高かった（抄録）。TMB-highと関連の深いMSI-Hは脳転移で有意に多くなかった。TP53の変化は複数のがん種の脳転移で一貫して多く、KRAS変異は肺がんと大腸がんの脳転移で、TERTの変化はメラノーマの脳転移で多かった（抄録）。経路では、ERK-MAPK経路と、より弱くDNA損傷応答経路の変化が多かった。", "p6": "解釈：検査のために集まった検体の横断比較で、同じ患者の原発巣と転移巣を対にした比較かどうかは抄録からは分からない。治療歴（治療で変異が増える可能性）の影響も未確認。", "unverified": "各がん種の頻度の具体的な値と、多重比較の扱いは本文未入手のため確認できなかった。"}}, {"id": "jn15", "rank": 15, "field": "電気化学・エネルギー", "headline": "ヘマタイト光電極の酸素選択性は反応次数で決まる", "title": "Linking Oxygen Evolution Selectivity to Water Oxidation Reaction Order on Hematite Photoanodes by Operando Photoelectrochemical Mass Spectrometry", "url": "https://doi.org/10.1021/jacs.6c11949", "authors": "Daniele Benetti ほか", "venue": "Journal of the American Chemical Society", "date": "2026-09-26", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "水の酸化が常に酸素を生むという前提を実測で問い直し、表面正孔密度と生成物の選択性を結びつけた。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ヘマタイト（酸化鉄）光電極の水の酸化で、表面の正孔（ホール）が少ないときは酸素がほとんど生じず、正孔が多く複数の正孔が協同して反応するときに初めて酸素が選択的に生じることを、動作中の酸素検出で示した（抄録）。", "p2": "金属酸化物の（光）電極での水の酸化は酸素分子を生むと仮定されることが多いが、実際の生成物の選択性と反応速度の関係は確かめられていなかった（抄録）。", "p3": "動作中（operando）の光電気化学質量分析で酸素を直接検出し、分光電気化学による速度則の解析（表面正孔密度に対する反応次数）と組み合わせる（抄録）。", "p4": "表面正孔密度に対する、酸素生成のファラデー効率（流れた電荷のうち酸素生成に使われた割合）と反応次数の変化を見る。暗所の電気化学条件でも同じ挙動かを確かめる（抄録）。", "p5": "電流と正孔密度が低く1次の反応速度が支配的な領域では、酸素生成のファラデー効率はほぼゼロで、孤立した1つの正孔による水の酸化は酸素分子の生成にほとんどつながらなかった（抄録）。正孔密度が上がると酸素のファラデー効率は急に高まり、協同的な3次の反応への切り替わりが酸素生成への選択性の切り替わりでもあることが分かった（抄録）。暗所でも同じ挙動だった。", "p6": "著者は、この多正孔の化学は半導体の金属酸化物に一般的な特徴である可能性が高いと述べる（抄録）。解釈：酸素以外に何が生じているか（過酸化水素など）は抄録からは分からない。", "unverified": "酸素以外の生成物の同定と、ファラデー効率の具体的な値は本文未入手のため確認できなかった。"}}, {"id": "jn16", "rank": 16, "field": "機械学習", "headline": "拡散モデルの事前分布で気づかれにくい敵対的攻撃", "title": "A Diffusion Prior-based Framework for Imperceptible and Flexible Unrestricted Adversarial Attacks", "url": "https://doi.org/10.1109/tpami.2026.3736884", "authors": "Zhengzhao Pan ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "拡散モデルを使い、知覚されにくく制約の少ない敵対的な例を作る枠組みで、画像認識の頑健性評価に関わる。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "画像に大きいが自然に見える変更を加えて深層学習モデルを誤らせる「制限なしの敵対的サンプル」を、事前学習した拡散モデルを事前分布とするベイズ推論として作る方法DiffAdvMAP+を提案した（抄録）。", "p3": "敵対的サンプルの生成をベイズ推論として定式化し、拡散モデルが学んだデータ分布を使って本物のデータと統計的に整合させる。画像ごとの複雑さに応じて拡散のステップ数や攻撃の確信度を自動で調整する仕組みを加える（抄録）。", "p5": "さまざまなモデル構造、データセット、防御法で、既存の方法より画像の質、柔軟さ、他のモデルへの転用のしやすさの総合的な釣り合いが良かった（抄録）。雑音から作る攻撃と元画像に似せる攻撃の両方に使える。抄録には具体的な数値はない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn17", "rank": 17, "field": "機械学習", "headline": "グラフの多様な分布シフトに強い重み付け学習", "title": "Generalizing on Diverse Shifts: A Unified Topology-Aware Reweighting Algorithm for Graphs", "url": "https://doi.org/10.1109/tpami.2026.3734476", "authors": "Jiaxing Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "グラフデータの多様な分布の変化に対し、構造を考慮した重み付けで汎化を高める統一的な手法を提案する。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "グラフニューラルネットの節点分類で、学習と試験の間で分布がずれても性能を保つため、グラフの構造を考慮して節点の重みを動的に変える汎用の方法TAR+を提案した（抄録）。", "p3": "標本の重みづけをグラフ上のワッサースタイン空間の勾配流として定式化し、予測の難しさとグラフ構造の両方で重みを決める。隣の節点と損失が食い違う節点の影響をHuber型の罰則で抑え、ラベルのない節点には予測のエントロピーを代わりの損失に使う（抄録）。", "p5": "共変量のずれ、概念のずれ、ラベルの雑音、異種の隣接（ヘテロフィリー）、クラスの偏り、ラベルの不足、異常検知などの設定で、競争力のある性能を示した（抄録）。重みづけが局所的な分布頑健最適化と解釈できることも示した。抄録には具体的な数値はない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn18", "rank": 18, "field": "機械学習", "headline": "対話で個人の基準に合わせるクラスタリング", "title": "Interactive Personalized Clustering: Navigating beyond Rigid Criteria and Sample Ambiguity", "url": "https://doi.org/10.1109/tpami.2026.3737483", "authors": "Honglin Liu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "固定の基準に縛られず、利用者との対話で個人の基準に合わせて分類を調整するクラスタリングを提案する。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "クラスタリングに利用者との対話を取り入れ、利用者が指定した基準に沿ってまとめ、境界の紛らわしい標本を利用者の判断で振り分ける方法IPCを提案した（抄録）。", "p3": "2段階で行う。基準合わせの段階では、テキストの基底変換で利用者が指定した基準（例：色か形か）に沿った表現を作る。グループの精緻化の段階では、利用者に尋ねる価値の高い標本の組を選び、その回答と3つの損失でクラスタの割り当てを直す（抄録）。", "p5": "6つのデータセットと16の基準で、最新の比較手法を大きく上回り、平均で23.6%性能が改善した（抄録）。さまざまなLLMと視覚言語モデルで頑健だった。コードは公開予定とされている。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "3次元の理解と生成を統合した運転の世界モデル", "title": "Hermes++: Toward a Unified Driving World Model for 3D Scene Understanding and Generation", "url": "https://doi.org/10.1109/tpami.2026.3735606", "authors": "Xin Zhou ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "自動運転のための3次元の場面理解と未来の生成を一つの世界モデルで扱う枠組みを示す。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "自動運転の「世界モデル」で、3次元の場面の理解（LLMによる説明や質問応答）と将来の形状の予測（点群の生成）を1つの枠組みで行うHERMES++を提案した（抄録）。", "p3": "複数のカメラの情報を鳥瞰図（BEV）の表現にまとめてLLMに渡し、理解の側の知識を未来予測に移すための問い合わせを作り、現在から未来へのつながりで意味の文脈を条件として形状の変化を予測する。明示的な幾何の制約と潜在表現の正則化を組み合わせて最適化する（抄録）。", "p5": "複数のベンチマークで、将来の点群予測と3次元の場面理解の両方で専門の手法を上回ったとする（抄録）。抄録には具体的な数値はない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn20", "rank": 20, "field": "機械学習", "headline": "事前学習モデルと規則の誘導で知識グラフを多段推論", "title": "Multi-Hop Knowledge Graph Reasoning with Pre-trained Models and Continuous Rule Guidance", "url": "https://doi.org/10.1109/tpami.2026.3734451", "authors": "Weidong Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "事前学習済みモデルと連続的な規則の誘導を組み合わせ、知識グラフ上の多段の推論を改善する。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "不完全な知識グラフで、実体と関係をたどって答えを見つける多段の推論を、事前学習したTransformerと連続値の規則の報酬で改善する方法PTM4MRを提案した（抄録）。", "p3": "BERTの次文予測にならい、次の行動・次の実体・次の関係を予測する3つの事前学習課題で、実体と関係の2つのエージェントが次の一歩を選ぶ力を高める。記号的な論理規則の離散的な報酬がまばらになる問題に、関係の引数の埋め込みにもとづく連続的な報酬で対処する（抄録）。", "p5": "複数のベンチマークで、最新の比較手法よりかなり性能が改善したとする（抄録）。ソースコードが公開されている。抄録には具体的な数値はない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "カルマン化した逐次最小二乗注意で流れる動画を理解", "title": "Kalmanized Recursive Least Squares Attention for Streaming Video Understanding", "url": "https://doi.org/10.1109/tpami.2026.3734826", "authors": "Matthew Korban ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "カルマンフィルタの考え方を取り入れた注意機構で、ストリーミング動画の理解を効率化する。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "長い動画を流れのまま理解するため、時間方向の注意機構を、固定サイズの記憶で全履歴を扱うオンラインのカーネル・リッジ回帰に置き換えたKRLS-Attnを提案した（抄録）。", "p3": "線形予測器の事後平均と共分散を記憶として持ち、逐次最小二乗法・カルマンフィルタの再帰で正確に更新する。記憶と各ステップの計算は動画の長さによらず一定で、事後共分散からトークンごとの予測の不確かさが得られ、どのトークンを取り込むかや確信度で重みづけした集約に使う（抄録）。", "p5": "分解型の動画Transformerに組み込むと、Kinetics-400、Something-Something V2、EPIC-KITCHENS-100、Breakfastで精度と効率の釣り合いが良く、学習時より長い文脈への外挿も改善した（抄録）。安定性の保証も導いている。抄録には具体的な数値はない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn22", "rank": 22, "field": "機械学習", "headline": "微分可能な遺伝的プログラミングで高次元の数式を発見", "title": "Differentiable Genetic Programming for High-dimensional Symbolic Regression", "url": "https://doi.org/10.1109/tpami.2026.3734437", "authors": "Xiaotian Song ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "遺伝的プログラミングを微分可能にし、高次元での記号回帰（数式の発見）を可能にする。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）の末尾の一部のみ取得できた", "preprint": false, "short": true, "p1": "高次元の記号回帰（データから数式そのものを見つける問題）のための、微分可能な遺伝的プログラミング（DGP）を提案した研究である（題名、抄録の末尾）。", "p3": "未確認（抄録の方法の部分を入手できず）", "p5": "著者は、DGPが複雑な高次元の記号回帰に信頼でき頑健な解決策で、解釈できる機械学習の道具になると結論している（抄録の末尾）。ソースコードが公開されている。", "unverified": "抄録の前半（方法と比較の設定、数値）は取得できず、確認していない。"}}, {"id": "jn23", "rank": 23, "field": "機械学習", "headline": "任意の脳図譜に対応する多視点の脳ネットワーク基盤モデル", "title": "Toward a Multi-View Brain Network Foundation Model: Cross-View Consistency Learning across Arbitrary Atlases", "url": "https://doi.org/10.1109/tpami.2026.3736359", "authors": "Jiaxing Xu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "異なる脳図譜の間で一貫した表現を学ぶ脳ネットワークの基盤モデルを提案し、神経画像の解析を統一する。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "脳の領域の区切り方（アトラス）が違っても使える、脳ネットワークの基盤モデルMV-BrainFMを提案し、複数のアトラスで作ったネットワークを同じ人のものとして揃えて学習した（抄録）。", "p3": "領域間の解剖学的な距離をTransformerに組み込み、同じ被験者の異なるアトラスによる表現を共有の潜在空間で一致させる教師なしの学習を行う。複数のデータセットとアトラスを同時に事前学習し、順番に学習するより計算を効率化する（抄録）。", "p5": "17のfMRIデータセットの20,000人を超える被験者での実験で、14の既存の脳ネットワーク基盤モデルと課題専用の手法を一貫して上回った（抄録）。データの多様さが増すほど性能が上がり、未知のアトラスでも安定していた。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn24", "rank": 24, "field": "機械学習", "headline": "複数の参照画像で制御する高品質な着せ替え生成", "title": "MMTryon: Multi-Modal Multi-Reference Control for High-Quality Fashion Generation", "url": "https://doi.org/10.1109/tpami.2026.3729775", "authors": "Xujie Zhang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-25", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "複数のモダリティと参照画像で制御できる高品質なファッション画像の生成を示す。", "explain": {"basis": "抄録", "basis_note": "IEEE TPAMIの掲載論文の抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "文章の指示と複数の衣服の画像から、複数の服を組み合わせた仮想試着の画像を作り、着こなし方（ファスナーの開閉、裾を入れるかなど）も指示できる方法MMTryonを提案した（抄録）。", "p3": "参照画像の衣服の情報と、文章の指示の着こなしの情報を組み合わせる多モード・多参照の注意機構を作る。衣服の領域を切り分けるモデルに頼らないエンコーダと、既存の試着データを切り分けなしで学習できる形に変えるデータ生成の手順を用いる（抄録）。", "p5": "高解像度のベンチマークと実環境の画像で、既存の最新手法を質的にも量的にも上回ったとする（抄録）。抄録には具体的な数値はない。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "jn25", "rank": 25, "field": "電池材料", "headline": "化学的脱リチウムで全固体電池の正極界面を安定化", "title": "Chemical-Delithiation-Induced Surface Reconstruction in Layered Oxide Cathodes for High-Performance All-Solid-State Batteries", "url": "https://doi.org/10.1021/jacs.6c11457", "authors": "Yijun Song ほか", "venue": "Journal of the American Chemical Society", "date": "2026-09-26", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "高電圧で劣化しやすい全固体電池の正極／固体電解質界面を表面再構成で安定化する方法で、高エネルギー密度電池の実用化課題に取り組む。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "全固体電池の高容量正極（リチウム過剰層状酸化物）の表面を化学的な脱リチウム処理で作り替え、高電圧での正極と固体電解質の界面の化学的劣化をなくし、1C・1,500サイクルで82.3%の容量維持を得た（抄録）。", "p2": "ニッケル過剰やリチウム過剰の層状酸化物を使う全固体電池は高エネルギー密度と安全性が期待されるが、高電圧で正極と固体電解質の相互作用が強まり、界面が化学的に劣化する（抄録）。", "p3": "NO2BF4による化学的な脱リチウム処理で、リチウム過剰層状酸化物の表面を再構成し、陽イオンが無秩序化した表面下層を作り、そこにフッ素を取り込む（抄録）。高電位で酸素のレドックスが起こる酸化的な表面を不活性化することで、界面劣化を防ぐ。", "p4": "可逆容量と、1Cでの長期サイクルの容量維持率で評価し、同じ手法をニッケル過剰層状酸化物にも当てはめて一般性を確かめる（抄録）。", "p5": "処理したリチウム過剰正極は約300.3 mA h g⁻¹の可逆容量で液系電池と同程度となり、1Cで1,500サイクル後に82.3%の容量を維持した（抄録）。ニッケル過剰層状酸化物への拡張でも有効性を示した（抄録）。", "p6": "解釈：実験室の小型セルでの結果で、実用的な電極の厚さや圧力条件での性能は抄録からは分からない。処理試薬の扱いやすさやコストも未確認。", "unverified": "比較対象（未処理正極）の容量維持率と、試験時の温度・圧力条件は本文未入手のため確認できなかった。"}}, {"id": "jn26", "rank": 26, "field": "電気化学・エネルギー", "headline": "電解アンモニア合成のエネルギーを全セルで評価", "title": "Rethinking Metal-Mediated Electrochemical Ammonia Synthesis through Full-Cell Thermodynamics", "url": "https://doi.org/10.1021/acsenergylett.6c02240", "authors": "Victor Azumah ほか", "venue": "ACS Energy Letters", "date": "2026-09-26", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "why": "陰極側だけの評価で見えにくかった金属介在型アンモニア電解合成の総エネルギーを全セルの熱力学で示し、技術比較の基準を与える。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "リチウムなどの金属を介した電気化学的なアンモニア合成について、陰極側だけの計算で見えにくかった全体のエネルギー費用を、全セルの熱力学で分解して下限を示し、より低エネルギーな経路の設計図を示した（抄録）。", "p2": "金属を介して窒素を解離させる電気化学的な窒素還元は、穏やかな条件で高い選択性が得られるが、陰極だけの収支で評価されることが多く、エネルギー費用が過小に見積もられがちだった（抄録）。", "p3": "反応のサイクルを、①媒介金属の生成、②窒素の取り込み（窒化物の形成）、③プロトン化の3段階に分け、全セルの熱力学で必要な電気的仕事の下限を求める（抄録）。例：リチウムを電気で作り、そのリチウムが窒素と反応して窒化リチウムになり、それにプロトンを与えてアンモニアにする。", "p4": "アンモニア1分子あたりの可逆的な電気的仕事の下限を、媒介金属の種類ごとに比べ、実用上の目安と照らす（抄録）。", "p5": "窒素の取り込みとプロトン化を下り坂（自発的）にすると、電気的仕事の下限は媒介金属の平衡電位で決まる（抄録）。リチウム媒介では、陰極でのリチウム生成だけでアンモニア1分子あたり約9.12 eVの下限があり、陽極の水の酸化を含めた全セルではさらに高くなる。Li・Ca・Mgのような還元力の強い媒介金属は、実用上のエネルギーの目安を超えた（抄録）。", "p6": "著者は、電解質による電位のずらし、合金や挿入による緩衝、電気化学的な窒化、窒化物を経ない中間体を、より低エネルギーの経路の候補として挙げている（抄録）。解釈：熱力学的な下限の議論であり、実際の過電圧や副反応による損失は別に加わる。", "unverified": "他の媒介金属の具体的な下限値は本文未入手のため確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "太陽電池材料", "headline": "4000分子の計算スクリーニングで有機太陽電池材料を探索", "title": "Descriptor‐Guided Computational Screening of Non‐Fullerene Acceptor Cores for Organic Solar Cells", "url": "https://doi.org/10.1002/aenm.71601", "authors": "Kun‐Han Lin ほか", "venue": "Advanced Energy Materials", "date": "2026-09-26", "sjr": 7.677, "citescore": 39.9, "citescore_year": "2025", "why": "膨大な組合せのある非フラーレン受容体を記述子で事前選別する計算手順を示し、材料探索を効率化する。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "有機太陽電池の非フラーレン受容体（NFA）の候補4,000分子超を、素子の性能に関わる記述子で段階的に絞り込む計算スクリーニングの手順を作り、既知の高性能構造（Y6型など）を上位に再発見できることを示した（抄録）。", "p2": "非フラーレン受容体により有機太陽電池の効率は21%近くまで上がったが、受容体–供与体–受容体の組み合わせは膨大で、合成の前に効率よく絞り込む方法が必要だった（抄録）。", "p3": "実験報告のある部品から組み立てたA–B–(D–S)–B–A型の4,000超の分子を最適化し、①双極子モーメントが小さい、②電荷分離に適した四重極モーメント、③電子の輸送を妨げる準位がない、④界面の駆動力が十分、⑤可視光を強く吸収、⑥光起電のギャップが十分大きい、という条件で順に絞り込む（抄録）。", "p4": "一般的な高分子供与体（P3HT、PBDB-Tなど4種）ごとに上位10の候補を選び、既知の高性能構造との一致と、合成済みの参照分子の薄膜の電子・光学的性質との一致で妥当性を見る（抄録）。", "p5": "上位の候補にはY6型やO-IDTBRに似た構造など既知の高性能の型が含まれ、記述子の妥当性を支持した（抄録）。統計的な分析では、供与体の部品がイオン化エネルギーを、受容体・末端基が電子親和力を主に決め、四重極モーメントは軌道エネルギーとの相関が弱く独立に調整できる手がかりだった（抄録）。", "p6": "著者は、薄膜の性質は参照分子とよく合う一方、素子の性能には記述子による事前選別では捉えきれない膜の形態（モルフォロジー）が重要だと述べている（抄録）。", "unverified": "上位候補の具体的な分子構造と計算手法の詳細は本文未入手のため確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "経営学", "headline": "民族・地域の非公式制度がエチオピアの起業家の資源獲得を左右", "title": "How ethnic- and community-based informal institutions shape entrepreneurial resource acquisition in Ethiopia", "url": "https://doi.org/10.1007/s11187-026-01274-9", "authors": "Yamlaksira S. Getachew ほか", "venue": "Small Business Economics", "date": "2026-09-26", "sjr": 2.618, "citescore": 14.2, "citescore_year": "2025", "why": "民族や地域に根ざした非公式の制度が起業家の資源獲得をどう形づくるかを扱い、新興国の起業研究に証拠を加える。", "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "エチオピアで、民族や地域共同体にもとづく非公式な制度が、起業家の資源の獲得をどう形づくるかを調べた研究（Small Business Economics）だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確   var views = parts.map(function (p) { return p[0]; }).concat(["marks", "list"]);
  function groupOf(view) {
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].parts.length; j++) { if (groups[i].parts[j][0] === view) return groups[i]; }
    }
    return null;
  }
  var lastInGroup = store.get("pd-sub-v1", {});
  var marks = store.get("pd-marks-v1", {});
  var saved = store.get("pd-pos-" + REPORT.date, { view: views[0], index: 0 });
  var start = { part1: "related", part2: "notable" }[saved.view] || saved.view;
  var state = { view: views.indexOf(start) >= 0 ? start : views[0], index: saved.index || 0 };
  var stage = document.getElementById("stage");
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  // date selector
  document.getElementById("daylabel").textContent = " " + REPORT.date;
  var sel = document.getElementById("datesel");
  function fillDates(list) {
    ARCHIVE = list;
    while (sel.firstChild) sel.removeChild(sel.firstChild);
    list.forEach(function (d, i) {
      var o = el("option", null, d + (i === 0 ? "（最新）" : ""));
      o.value = d; if (d === REPORT.date) o.selected = true; sel.appendChild(o);
    });
  }
  fillDates(ARCHIVE);
  // the current date list (older pages are not rebuilt every day); the list embedded in the page is the fallback
  try {
    fetch((META.kind === "archive" ? "../" : "") + "dates.json", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (list) { if (Array.isArray(list) && list.length) fillDates(list); })
      .catch(function () {});
  } catch (e) {}
  sel.addEventListener("change", function () {
    var d = sel.value, latest = ARCHIVE[0];
    var href = META.kind === "archive" ? (d === latest ? "../index.html" : d + ".html") : (d === latest ? "index.html" : "archive/" + d + ".html");
    location.href = href;
  });

  // tabs: 最新 / Top誌 / ★ / 一覧, and under a source the 関連 / 注目 sub-tabs
  var tabs = document.getElementById("tabs"), subtabs = document.getElementById("subtabs");
  function select(view) {
    stopSpeech(false);
    state.view = view; if (view !== "list") { state.index = 0; }
    var g = groupOf(view);
    if (g) { lastInGroup[g.key] = view; store.set("pd-sub-v1", lastInGroup); }
    render(); window.scrollTo(0, 0);
  }
  function addTab(key, text, label, onClick) {
    var b = el("button", "tab", text); b.type = "button"; b.dataset.view = key;
    if (label) { b.setAttribute("aria-label", label); b.title = label; }
    b.addEventListener("click", onClick);
    tabs.appendChild(b);
  }
  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);
    addTab("group:" + g.key, g.label + " " + n, null, function () {
      var v = lastInGroup[g.key];
      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
