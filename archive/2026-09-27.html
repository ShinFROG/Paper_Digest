<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-09-27", "intro": "【試行：200本版】プレプリントの新着のうち研究テーマに関連する候補、学術誌の新着（上位10%誌1,242件、その他の学術誌279件）、注目分野の候補（プレプリント205件、論文誌57件）から選びました。注目分野は、組織行動・心理的安全性、経済学、経営学、統計学、機械学習、因果推論の6分野と、今日のおすすめ分野（地震工学・防災、ヒューマンコンピュータインタラクション）です。土日でarXivの新着がなく、注目分野の論文誌も新着が少なかったため、水増しせず、プレプリント・関連45報、プレプリント・注目44報、論文誌・関連50報、論文誌・注目32報としました。各部の上位15報は詳しい解説、16位以下は抄録をもとにした短い解説です。あわせて、DataCiteに直近3日で登録された公開データセット・研究コードから10件を「データ」タブに載せています。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "合成回答者は母集団ごとの較正が要る", "title": "Calibrating Synthetic Respondents: A Within-Persona Experiment on Public Reactions to Protest in Turkey", "url": "https://doi.org/10.31235/osf.io/hp7gz_v1", "authors": "Mehmet Fuat Kina ほか", "venue": "SocArXiv", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（データ・較正設計・結果・考察の節と表1・2、図1・2）を読んだ。付録E〜Hは本文中の要約のみ確認", "preprint": true, "p1": "LLMで作る合成回答者（synthetic respondents）について、どの推論設定が母集団をよく再現するかを先に結果変数ごとに較正し、その設定を固定してから同じペルソナに2つの条件を答えさせる「ペルソナ内実験」を行う手順を示した（抄録、§3.3–3.4）。", "p2": "LLMで調査回答を模す研究は増えているが、ペルソナに何を入れるか、温度、モデル、提示の仕方などの選択で結果が変わり、既知の実験効果を再現できるかで検証する従来のやり方では、設定の良し悪しと効果の真偽が切り分けられない（§1）。", "p3": "2024年トルコ総合社会調査（TGSS、2,615人）の117変数から11種のペルソナ構成（C0＝属性のみ〜C10）を作り、ペルソナから除いた2項目（過去1年のデモ参加：陽性約5%の2値、女性のフルタイム就労への態度：5件法）に照らして、①ペルソナ内容 ②回答方式（直接回答か、確率分布を言わせてから抽出する verbalized sampling）と温度 ③モデル ④提示形式、の順に候補を絞る「較正ファネル」を回す（§3.2–3.3、図1）。例：2値項目ではC6・直接回答・T=0.8・GPT-4o-mini、5件法ではC6・verbalized sampling・T=0.8・GPT-5.4-miniが選ばれた（表2）。", "p4": "良さの基準は、分布の一致（2値はJensen–Shannon距離と陽性率の差、順序尺度はWasserstein-1距離）と、個人単位の一致（陽性クラスの再現率、Matthews相関、重み付きκ）の両方。選ばれた設定は選択に使っていない同形式の6項目でも確かめた（§3.3）。", "p5": "属性だけのペルソナではデモ参加者の再現率0.012、C6・C8で0.512まで上がった（§4.1）。最終設定の3シード平均は、2値で再現率0.512・JSD 0.0011、5件法でWasserstein 0.181・重み付きκ 0.312（表2）。実験では、治安悪化（threat）の文脈は平和交渉（opportunity）の文脈よりクルド語教育を求めるデモの正統性評価を0.41点下げ（95%CI −0.47〜−0.35、dz=−0.26）、参加意向を15.76ポイント下げた（22.5%→6.8%）（§4.2.1、図2）。図2は横軸が「治安−平和」の差で、負ほど平和文脈で高いことを示す。", "p6": "著者は、得られた差は較正済みの手順が生む模擬的な反応であり人間の因果効果として検証されたものではないこと、順序尺度の設定は分布や平均の差を語れても個人の回答の再現には使えないこと（個人の回答が複数シードで完全一致したのは3分の1未満）を認めている（§5）。解釈：較正の基準自体が同じ調査の項目であるため、他国・他時点・他の話題への移しやすさは未確認で、この研究は未査読のプレプリントである。", "unverified": "付録E（全セルの結果）・付録F（シード安定性）・付録G（転移項目の個別値）の数値は本文の要約以外は確認していない。"}}, {"id": "pr02", "rank": 2, "headline": "LLMチームの効果は役割より視点の独立性", "title": "Perspective independence, more than personas, drives LLM teams - and where they reverse", "url": "https://doi.org/10.64898/2026.09.24.26363897", "authors": "Jun Feng ほか", "venue": "medRxiv", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "medRxiv版の本文（結果・考察の限界・図表キャプション、表1・2）を読んだ。補足資料（Supplementary Notes・Tables）は未確認", "preprint": true, "p1": "複数のLLMに役割を与える「チーム」方式の診断が効く理由を要因分解し、効果の源は専門家ペルソナではなく、互いの出力を見ずに独立に考えさせる「視点の独立性」と司会役（moderator）による統合であること、そして実際の救急外来の入力では逆に悪化することを示した（抄録、図3）。", "p2": "マルチエージェント型のプロンプトは診断で相反する結果を出しており、利得が「専門家の役割」から来るのか「視点の独立」から来るのかが分かっていなかった（抄録、§Introduction）。", "p3": "同じモデル（qwen3.8-flash）で、①1回の直接呼び出し（A×1）、②1つの文脈の中で5つの専門家視点を順に語らせる（P）、③同じ5役を互いに見えない独立呼び出しにし、司会役が統合する（MDT、1症例6回呼び出し）を比べる。出力は鑑別診断5つの順位付きリスト（図1）。さらに「役割なしの独立サンプル5つ＋司会」と「機械的なBorda集計」を組み合わせた要因実験で、どの部分が効くかを切り分ける（図3a）。", "p4": "データはNEJMの症例検討（CPC）87例、外部の公開ベンチマークMedCaseReasoning 406例、実際の救急外来364件（ER-Reason）。評価は正解診断が上位1・3・5位に入る割合（top-k recall）で、主要評価項目は事前に決めたtop-3とtop-5。採点は臨床医2人と照合したLLM判定器（κ 0.814・0.878、医師間0.812）を使い、各条件5回の反復で症例単位のWilcoxon検定を行う（§Results冒頭、表1注）。", "p5": "外部ベンチマークでMDTは単発呼び出しよりtop-3で+3.0ポイント（72.9% 対 69.9%、p=0.0079）、top-5で+3.9ポイント（79.6% 対 75.6%）高かった（表1、図2b）。役割なしの独立サンプルに司会を付けた条件はMDTと区別できず、機械的な集計は単発以下だったため、利得は独立生成＋司会統合によると結論している（図3a）。救急外来では逆転し、top-1が単発40.1%、MDT 34.3%（p<0.0001）だった（表1）。図3bはトークン数（対数軸）と再現率の関係で、司会付き独立サンプルは単発の約6倍のトークンでtop-3を+5.3ポイント上げる。", "p6": "著者は、救急の入力が医師の判断の節より前で切られていること、判定器による誤差を完全には排除できないこと、公開済みのCPC症例をモデルが記憶している可能性、事前登録がないことと一部の対照条件が事後に追加されたことを限界として挙げている（§Discussion）。解釈：正解ラベルとの一致で測っており臨床的な妥当性は評価されていない。未査読のプレプリントである。", "unverified": "補足資料（判定器の検証詳細、温度をそろえた解析、モデル規模の比較）の数値は本文の要約以外は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "LLM社会の規範形成は行動の収束だけでは測れない", "title": "Behavior is Not Enough: A Mechanism-Based Evaluation of Social Norm Emergence in LLM Societies", "url": "https://doi.org/10.48550/arxiv.2609.26481", "authors": "Rasika Muralidharan ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（方法、RQ1〜RQ3の結果、考察、限界）と表1・2を読んだ。付録の頑健性分析は未読", "preprint": true, "p1": "LLMエージェントの集団で協力が収束しても、それが共有された期待による「規範」なのか模倣や損得によるのかは行動だけでは分からないため、各エージェントに期待を報告させて、規範の成り立ちを仕組みごとに切り分けて評価する枠組みを示した（抄録）。", "p2": "マルチエージェントのLLMシステムの研究では、行動が一つに揃うことをそのまま規範の出現とみなしてきたが、同じ協力均衡でも、共有された期待、戦略的な誘因、単なる模倣のどれから生じたかで意味が違う（抄録、§Introduction）。", "p3": "12体のエージェントが4人ずつ3グループで公共財ゲームを20ラウンド行う（初期資金10、拠出の合計を1.6倍して均等配分）。毎ラウンドの終わりに、典型的だと思う拠出額（経験的期待）と、社会的に許容される拠出額（規範的期待）を報告させる。これに、グループ内の話し合い（社会的学習）と、相互評価で結びつきの重みを更新し次の組分けに使う仕組み（社会的選択）を組み合わせ、5条件で機能を一つずつ外して比べる（§Methods、表1）。例：拠出の少ないエージェントは低く評価され、結びつきが弱まり、次のグループに入りにくくなる。", "p4": "GPT-4o-mini、Llama 3.1-8B、Qwen 2.5-7B、Mistral-7Bで各条件10回ずつ走らせ、ラウンドごとの平均拠出を、実行単位でクラスター化した最小二乗法で比べる。ラウンド10または20で4体を規範的期待が半分の撹乱エージェントに置き換え、5ラウンドの回復も調べる（§Evaluation、§RQ3）。", "p5": "期待を報告させるだけで、4モデルすべてで拠出が増えた（何もない条件からの差は+0.58〜+1.39、表2）。社会的選択は、拠出が少ない→評価が低い（β=−0.184）→結びつきが弱まる（β=0.240）という経路は働いたが、次のラウンドの拠出の修正は小さく（β=0.068）、話し合いによる修正（β=0.390）の方が大きかった（§RQ2）。撹乱のあと規範的期待と行動はどちらも戻ったが、戻る速さは違い、規範が成熟したラウンド20の撹乱の方が回復が早かった（図4）。", "p6": "著者は、公共財ゲームは単純化が強く現実に一般化できない可能性、リーダーシップや社会的アイデンティティなど他の要因を扱っていないこと、報告させた期待はプロンプトを介したもので、モデル内部の表象の直接の証拠ではないことを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "表2の社会的学習・社会的選択を加えた効果のモデル別の有意性と、付録の頑健性分析の数値は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "開示文の『従業員の幸福』重視度が労働者の健康を予測", "title": "Well-Being Salience in Corporate Disclosures and Worker Health", "url": "https://doi.org/10.3386/w35760", "authors": "Riccardo Di Francesco ほか", "venue": "NBER Working Paper", "date": "-", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、主要結果§5の冒頭、結論）を読んだ。付録の頑健性分析は本文の言及のみ確認", "preprint": true, "p1": "企業が年次報告書で「従業員の幸福（well-being）」をどれほど前面に出しているかを文章から数値化し、デンマークの全人口の行政データと結ぶことで、それが従業員の病欠を増やす一方で医療の利用は変えないことを示した（抄録、§6）。", "p2": "職場が従業員の健康を左右することは分かってきたが、どの職場の特徴が効くのかは行政データに記録されず、職場文化の調査は費用がかかり規模を広げにくい（§1）。", "p3": "心理学の辞書（LIWCなど）から幸福・メンタルヘルスの参照語を決め、事前学習済みの文埋め込み（sentence embedding）で報告書の各文と参照語の意味的な近さを測り、報告書内の類似度の95パーセンタイルを企業の「幸福の顕著さ（salience）スコア」とする（§1、§3）。語調ではなく意味の近さだけを測る。これを2013〜2022年の病欠・医療利用の登録データと結び、転職者（mover）が移る前後で、移籍先と移籍元のスコア差に応じて結果がどう変わるかを見る（§1）。例：スコアの高い会社へ移った人の病欠日数が、移籍の前後でどれだけ変わるかを追う。", "p4": "転職者71,714人（684,432人年）を対象に、転職前3年・後3年のイベントスタディで、病欠（日数と有無）と、処方薬、精神科入院、心理相談、呼吸器・筋骨格の入院を比べる（§1、表3注）。移籍前に傾向の差がないこと、移籍の向きが属性と無関係なことを識別の前提として確かめる（§1）。", "p5": "移籍の1年後、スコア差が1標準偏差大きいと病欠が約0.56日（移籍前平均の約4分の1）増え、病欠する確率が約5ポイント（同約5分の1）上がった（§5、図6）。一方で医療の利用はどの指標も動かなかった（図7〜9）。図6は横軸が移籍からの年、縦軸がスコア差1単位あたりの効果で、移籍前はゼロ付近、移籍時に跳ねて定着する形を見る。増えた病欠日数の約半分は1週間を超える長期の病欠で、転職しない人（stayer）でも同じ非対称が再現された（§1）。", "p6": "著者は、病欠が増えた経路として休みを取ることへの偏見の減少、制度の情報、管理者の寛容さを挙げるが、どれかは特定していない（§6）。解釈：スコアは文章上の強調であって実際の制度や施策の測定ではなく、デンマーク以外の制度（医療が無料で転職が多い）への一般化は未確認。NBERワーキングペーパーで、査読前の版である。", "unverified": "付録（業種効果の分解、代替パーセンタイル、パンデミック前の標本）の数値は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "LLMで作る開示テキスト指標はモデル次第で変わる", "title": "Same Text, Different Numbers: The Divergence of LLM-Based Measures", "url": "https://doi.org/10.2139/ssrn.7519558", "authors": "Hamid Boustanifar ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "決算説明会の書き起こしを生成LLMで数値化した13種の指標が、使うLLMによってどれほど変わるかを測り、LLM由来の変数は「モデルに依存する測定」として複数の提供元で検証すべきことを示した（抄録）。", "p2": "企業の文書をLLMで実証用の変数に変える研究が増えているが、その変数がモデルの選び方に左右されないかは確かめられていなかった（抄録）。", "p3": "異なる提供元の7つのLLMに、S&P 500企業の決算説明会の書き起こしを、感情（sentiment）、経営者の説明の明確さ、不確実性、回答の具体性、気候リスク・政治リスクなど13の概念で採点させ、モデル間の一致と、下流の回帰分析の結果がどう変わるかを調べる（抄録）。", "p4": "モデル間の順位相関、書き起こし単位の共通成分が全体の分散に占める割合、モデル間の不一致がその後のアナリストや市場の意見の不一致を予測するか、回帰係数の大きさ・符号・有意性の変化で評価する（抄録）。", "p5": "モデル間の順位相関は平均0.52にとどまり、提供元に共通する書き起こし間の差は全体の分散の34%しか説明しなかった（抄録）。モデル間の不一致はその後のアナリスト・市場の不一致を予測せず、文書そのものの曖昧さではなくモデル固有の成分が大きいと解釈している。回帰係数の大きさ・符号・有意性もモデルによって大きく変わった（抄録）。", "p6": "著者は、複数の提供元で平均すると多くの指標で順位は安定するが、得点の水準はどのモデルを含めるかに依存し続けると述べる（抄録）。解釈：プロンプトの書き方や温度などの設定の違いがどこまで寄与するかは抄録からは分からない。未査読のプレプリントである。", "unverified": "使用した7モデルの名称、プロンプト、期間、各指標ごとの相関は本文未入手のため確認できなかった。"}}, {"id": "pr06", "rank": 6, "headline": "電子税額票の取引網から企業の倒産を予測", "title": "DefaultGNN: A Dual-Perspective GNN Framework for Predicting Corporate Default from Buyer-Seller Transaction Networks", "url": "https://doi.org/10.48550/arxiv.2609.25542", "authors": "Junghoon Kim ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3データ分析、§5実験設定・結果・時点外検証・事例、§6実運用）と表1・3を読んだ。表2の年別の数値は未確認", "preprint": true, "p1": "財務諸表が乏しい企業でも、電子税額票（電子インボイス）の取引データから作った「買い手側」と「売り手側」の2つの取引ネットワークをグラフニューラルネットワーク（GNN）で統合することで、倒産（債務不履行）をより正確に予測できるようにした（抄録）。", "p2": "従来の信用モデルは財務諸表に頼るが、中小企業や個人事業主は財務報告が少なく使えないことが多い。取引関係を通じて倒産リスクが伝わることは知られているが、売り手が代金を回収できない一方向の伝播として扱われることが多かった（§1、§3.2.2）。", "p3": "韓国の電子税額票システム（2018〜2023年、年ごとに420,687〜985,320社、取引14,175,876〜54,823,028件）から、同じ企業群について売り手側と買い手側の有向ネットワークを作り、取引額の比率で辺に重みを付ける（§3.3、表1）。それぞれを2層のGCNで符号化し、企業の売上と仕入の比に応じて2つの見方の重みを学習的に調整して統合する（§4）。例：主に売る側の企業では、買い手の支払い遅延を通じたリスクを表す売り手側の見方を重く使う。", "p4": "倒産ラベルは信用格付会社のバーゼルIIの定義に基づく記録で、倒産企業は各年約1%。企業を7:1:2に分け、AUCから求める正確度比率（AR＝2×AUC−1）で、ロジスティック回帰・XGBoost、通常のGNN、多関係GNN、多重グラフモデルと比べる。過去の倒産歴がない企業（NoHist）での性能を特に重視し、過去の年で学習し将来の年で試す時点外検証も行う（§5.1、§5.4）。", "p5": "取引相手に倒産歴がある企業は将来の倒産率が高く、売る側・買う側のどちらの取引でも、また取引規模が大きいほどリスクが高かった（§3.2、図1〜5）。DefaultGNNはすべての年で比較手法を上回り（Wilcoxon検定 p=0.016、表2）、アブレーションでは完全版のARが全体0.583・倒産歴なし企業0.472で、片側の見方だけ（0.544・0.420前後）や重みなし（0.535・0.408）より高かった（表3）。格付会社との検証で、既存の信用スコアと併用すると、承認企業の倒産リスクを増やさずに承認率が7〜11ポイント上がった（抄録）。", "p6": "著者は、財務諸表がない条件を想定して非財務の属性だけを使ったと述べており、データは韓国の特定の税額票システムの利用企業に限られる（§3.1、§3.4）。解釈：実運用の検証の詳細は抄録と§6の範囲で、承認率の改善がどの条件で得られたかは確認が要る。未査読のプレプリントである。", "unverified": "表2の年別・手法別のARの値と、実運用検証（§6）の条件の詳細は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "ペルソナ付き生成エージェントで反実仮想の議論を作る", "title": "Persona-Conditioned Generative Agents as a Method for Studying Online Communities", "url": "https://doi.org/10.2139/ssrn.7518938", "authors": "Ishita Chakraborty ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "観測されたプロフィールから作ったペルソナ付き生成エージェントを同じ議論の文脈で順に発言させ、参加者の構成を変えたら議論がどう変わったかという観測できない反実仮想の会話を作り、実際の人間の議論と比べて検証する方法を示した（抄録）。", "p2": "オンラインの議論は、誰が参加しどう応じたかで決まる一つの実現経路しか観測できず、参加者の構成が違えば後続の参加者が見る内容も変わるため、別の構成での議論を推し量るのが難しい（抄録）。", "p3": "Redditの利用者の言語的・人口学的な特徴からペルソナを作り、エージェントが同じスレッドで順に投稿するシミュレーションを行う。参加者の抽出確率を変えて、議論の幅や話題が変わるかを試す（抄録）。例：人間のデータで少ない層の抽出確率を上げたスレッドを生成して比べる。", "p4": "エンタメ・ゲーム・人間関係・技術の4領域のRedditの議論を対象に、ペルソナなしの汎用AI、ペルソナ付きAI、実際の人間の議論を、投稿の長さ、一人称の使用、意味的多様性、感情の向きで比べる（抄録）。", "p5": "ペルソナ付きAIは汎用AIより人間の議論に有意に近いが、議論の意味的な幅は狭く、人間より肯定的な調子に偏った（抄録）。少数派の利用者を多く抽出すると話題は一部変わるものの、議論の幅は広がらず、人間の議論の多様性は再現できなかった（抄録）。具体的な数値は抄録にない（未確認）。", "p6": "著者は、人間の行動について結論を出す前に追加の検証が必要な場面があると述べている（抄録）。解釈：比較指標が文章の表面的な性質中心であり、議論の中身の妥当性の評価は抄録からは分からない。未査読のプレプリントである。", "unverified": "本文を読めておらず、使用したモデル、議論の件数、差の大きさは確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "LLMで作る人物像は画一的になりやすい", "title": "PERSONAWEAVER: Controllable Diversity Beyond Conventional Archetypes in Procedural Character Generation", "url": "https://arxiv.org/abs/2609.26629", "authors": "Maan Qraitem ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3手法、表1、§4.1–4.2実験と結果、§6限界）を読んだ。§4.3以降と付録の定量結果は未読", "preprint": true, "p1": "LLMでゲームやシミュレーションの登場人物を大量に作ると、道徳的に善良で素直に答える人物ばかりになる「画一化」が起きることを示し、世界設定と行動の指定を切り離して手作業で整えた道徳的立場と応答の型を割り当てることで、人物の行動の多様性を広げた（抄録、§3）。", "p2": "既存の方法は、LLMに人物を直接作らせる（WorldWeaver）か、大規模なペルソナ集（PersonaHub）から人物像を借りて設定に合わせるかのどちらかで、職業や外見は多様でも、道徳的判断や質問への応じ方はほぼ同じになっていた（§1、§4.2）。", "p3": "行動の部分には、道徳基盤理論を参考にした8つの道徳的立場（思いやりと公正を重んじる、自己利益で規則を曲げる、など）と、8つの応答の型（拒否、はぐらかし、ためらい、素直な回答、余計な情報まで話す、からかい、敵意、質問そのものへの言及）を用意する（表1）。世界の部分は、LLMに設定ごとに10の属性軸（職業、住まい、所属など）と各30の選択肢を作らせ、人格や価値観は含めない。人物ごとに各軸・各型を独立に等確率で引いて組み合わせる（式1）。例：同じ中世の村でも、自分の得だけを考え質問をはぐらかす鍛冶屋が生まれうる。", "p4": "現実的な設定5つと空想的な設定5つで、方法とモデル（GPT-4o、GPT-5.6 Luna、Qwen 3.5 35B-A3B）の組ごとに1,000人を作る。全員に同じ10の規範的な文への4段階の同意と、10の自由な質問への応答を求め、道徳的判断の分布の広さと、拒否・はぐらかし・回答の割合（別のLLMが分類）で多様性を比べる（§4.1–4.2）。", "p5": "既存の方法では、3つのLLMとも道徳的判断が「同意」に、応答が「素直な回答」に集中した（§4.2、図3）。PersonaWeaverは同意と不同意の両方に判断を広げ、拒否やはぐらかしも生んだ。GPT-5.6 Lunaは割り当てた応答の型（特にはぐらかしと質問への言及）に従いにくく、他の2モデルより応答の多様性が小さかった（§4.2、付録C）。「多様にせよ」という一般的な指示を足すだけでは十分でないことも調べている（§4.2）。", "p6": "著者は、評価が道徳的立場と応答の2つの次元に限られること、道徳的判断を粗い分類でしか見ていないこと、各型を等確率で割り当てており設定ごとに望ましい分布は違いうることを限界に挙げ、多様化が不快・危険な振る舞いを再現するおそれにも触れている（§6）。未査読のプレプリントである。", "unverified": "一般的な多様性の指示を足した条件との定量的な差（§4.2後半）と、§4.3の言語・長さ・感情の多様化の数値は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "LLMの政治的立場を141か国の人々の分布上に置く", "title": "Locating LLM Expressed Ideology in the Global Distribution of Political Attitudes", "url": "https://doi.org/10.2139/ssrn.7522318", "authors": "Aaron Russell Kaufman ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "141か国114万人の調査回答で推定して固定した項目パラメータ上に65のLLMを置くことで、LLMが表明する政治的立場を一国の標本ではなく世界の人々の分布に対して測れるようにした（抄録）。", "p2": "LLMの回答が左に寄るという懸念の根拠はほとんどが一国（多くは米国）の回答者との比較で、モデルの位置と標本の位置が混ざってしまう（抄録）。", "p3": "国際比較調査の1,153項目を、27社の65モデルに温度0・ペルソナなしで答えさせ、人間の回答から推定した項目パラメータ（項目反応理論の考え方）で、社会的リベラル度、経済の左右、民主主義への支持、反エリート感情の4つの潜在次元の得点にする（抄録）。測っているのはモデルが問われて述べる「表明された立場」であって、モデルが何かを信じているという主張ではない。", "p4": "世界の人間の中央値に対するモデルの位置（百分位）、モデル間のばらつきと人間のばらつきの比、どの調査プログラムの項目を使うかで位置がどれだけ動くかで評価する（抄録）。", "p5": "65モデルはすべて社会的リベラル度で世界の人間の中央値よりリベラル側にあり、中央のモデルは31パーセンタイルに位置した（抄録）。モデル間のばらつきは各次元で人間の標準偏差の11〜33%にとどまり、モデル同士は人間同士よりずっと似ていた。項目の出どころを変えるとモデルの位置は人間の標準偏差の0.28〜0.62だけ動き、国の位置の変化の2〜4倍近くになった（抄録）。", "p6": "著者は、リベラル寄りという向きは尺度を変えても頑健だが、その大きさはモデルと質問票の組み合わせの性質だと述べている（抄録）。解釈：ペルソナなしの既定の回答を測っており、ペルソナを与えた合成回答者の偏りは別に検証が要る。未査読のプレプリントである。", "unverified": "本文を読めておらず、モデルごとの位置や言語の影響は確認できなかった。"}}, {"id": "pr10", "rank": 10, "headline": "InSARとPINNで都市の大空間構造物を一斉監視", "title": "Urban-Scale Monitoring of Large-Span Spatial Structures Using MT-InSAR: From Physics-Informed Deformation Reconstruction to Graph-Based Regional Risk Screening", "url": "https://doi.org/10.2139/ssrn.7528614", "authors": "Shiqi Zhu ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "衛星の干渉SAR（MT-InSAR）で得た長期の変位を、有限要素モデルの温度応答を弱い物理的事前情報とするPINNで再構成し、近傍グラフで集約することで、都市全域の大空間構造物（体育館・駅舎の屋根など）の危険候補を一度に洗い出す枠組みを示した（抄録）。", "p2": "大空間構造物は都市に多数あり形式も多様で、密なセンサ配置による従来の監視は設置・維持の費用がかさみ、地域全体のリスク選別が難しい（抄録）。", "p3": "①温度応答に合わせた恒久散乱体（PS/準PS）の同時逆解析で変位時系列を得る。②FEMで予測した温度応答をInSARの観測と空間・時間で照らし、支点の鉛直変位と温度差の回帰から「温度感度の区間」を作り、PINN（物理の知識を損失関数に入れたニューラルネット）の弱い事前情報にする。③再構成した特徴をK近傍グラフの節点に集め、重み付き近傍集約と候補マスクで危険度を判定し、点単位に戻す（抄録）。", "p4": "長沙市の約40 km×40 kmの範囲に適用し、候補節点の警告・危険の分類と、代表的な構造物の現地点検の結果で妥当性を確かめる（抄録）。", "p5": "2,079の候補節点から312の警告（Warning）と104の危険（Danger）節点を特定し、代表的な大空間構造物の現地点検で局所的な劣化が見つかった（抄録）。", "p6": "解釈：現地点検は代表的な1構造物にとどまるようで、見逃し・誤検出の割合（検出性能）は抄録からは分からない。温度以外の荷重や季節変動の扱いも未確認。未査読のプレプリントである。", "unverified": "本文を読めておらず、PINNの構成、使った衛星データの期間、判定のしきい値は確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "運動学だけから接触力を推定する統一逆動力学", "title": "A Unified Framework for Indirect Measurement of Human Ground Reaction Forces from Kinematics under Varying Contact Topologies", "url": "https://doi.org/10.2139/ssrn.7519307", "authors": "Jingtao Li ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "床反力計（force plate）を使わずに、人の動き（運動学の計測）だけから地面反力（GRF）と圧力中心を推定する、接触状態が変わっても使える物理的に一貫した逆動力学の枠組みを示した（抄録）。", "p2": "接触条件が変わる多体系の接触力の同定は難しく、床反力計は設置場所が限られ、複雑な歩行中の連続測定ができない（抄録）。特に両足が接地する時期は力の配分が静的に不定になる。", "p3": "人体を18剛体・33自由度の開いた鎖の多体系とし、スクリュー理論とダランベールの原理で全体の動的つり合いを立てる。両脚支持期の不定な配分は、圧力中心が連続的に動くことと反力モーメントが減衰していくことを物理的な制約として加え、最小ノルムの最小二乗解として一意に決める（抄録）。例：階段を上るとき、左右の足にかかる力の分け方を、圧力中心の滑らかな移動を条件に決める。", "p4": "平地歩行と階段上りで床反力計の実測と比べ、さらに公開の運動学データから5つの移動様式の鉛直反力と圧力中心を再構成し、それを使った歩行様式の識別精度で情報が保たれているかを見る（抄録）。", "p5": "再構成した反力は床反力計の値とよく一致し（具体的な誤差は抄録に記載なし・未確認）、再構成信号による歩行様式の識別は独立テストで正解率84.69%だった（抄録）。", "p6": "解釈：一致度の指標や被験者数が抄録にないため精度の程度は判断できない。識別精度は再構成の正確さを間接的に示すにとどまる。未査読のプレプリントである。", "unverified": "被験者数、誤差の指標（RMSEなど）、最小ノルム解の具体的な制約式は本文未入手のため確認できなかった。"}}, {"id": "pr12", "rank": 12, "headline": "同一被験者の混入で生体信号分類の精度は水増し", "title": "Subject identity leaks into biosignal classifiers: a multi-dataset audit, a pre-training risk index and an open-source toolkit", "url": "https://doi.org/10.5281/zenodo.22980900", "authors": "Selçuk Özçelik", "venue": "Zenodo", "date": "2026-09-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Zenodoの投稿原稿PDFの本文（方法、データ、考察と報告チェックリスト表3）と図表キャプションを読んだ", "preprint": true, "p1": "生体信号の機械学習で、同じ人の区間が学習とテストの両方に入る「被験者リーク（subject leakage）」による性能の水増しを、学習前に分かるデータの性質から予測する指標と、確認用のツール（leakscope）と報告チェックリストを示した（抄録）。", "p2": "心電図・加速度・脳波などの研究では、長い記録を区間に切って無作為に分けることが多く、同じ人の特徴を覚えるだけで高い精度が出てしまうが、その大きさと頻度は整理されていなかった（抄録、§Introduction）。", "p3": "同じデータを、①区間の無作為分割、②被験者内で連続ブロックに分け隣接区間を除く分割、③記録単位、④被験者単位の分割（基準）、⑤1人抜き（LOSO）で評価し、「無作為−ブロック」を隣接によるリーク、「ブロック−被験者単位」を個人識別によるリークに分解する（§Materials and methods、図1）。学習前に計算できる、1近傍法で被験者を当てられる度合い（subject identifiability）とラベルと被験者の依存度から、リスク指標を作る。例：同じ人の心拍が学習にもテストにもあると、不整脈の特徴でなく本人の波形の癖で当ててしまう。", "p4": "公開5データ（MIT-BIH、PTB-XL、UCI HAR、WESAD、Sleep-EDF）に4種のモデル（ロジスティック回帰、k近傍、ランダムフォレスト、1次元CNN）を当て、マクロF1の差を水増し量とする。720の模擬データでリスク指標を検証し、2023〜2026年の同じデータを使った論文100本を無作為抽出して監査する（抄録）。", "p5": "マクロF1の水増しはPTB-XLの0.01以下からMIT-BIHの0.49まで幅があり、曝露と被験者の識別しやすさに従った（抄録、図3）。模擬データでは、リスク指標が柔軟なモデルの識別由来の水増しの85〜88%を説明し、生理的な信号が全くなくてもリークだけで91%の正解率が出た（抄録、図2）。監査では12%の研究が学習に使った被験者で評価しており、40%は判断できるだけの記述がなかった（抄録、図5）。", "p6": "著者は、公式の被験者分離の分割があってもリークは防げていなかったと述べる（§Discussion）。解釈：個人の研究者による単著の投稿中の原稿で、特徴量やモデルの設定は固定したものに限られる。深層学習の大規模モデルでの水増しの大きさは未確認。未査読のプレプリントである。", "unverified": "表1のデータごとの指標値と、監査の個別集計（図5の内訳）は数値を確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "災害時の橋梁補強を多段階で決める強化学習", "title": "An Intelligent Hierarchical Q-Learning Decision-Support Framework for Multi-Stage Bridge-Network Fortification under Disaster Disruptions", "url": "https://doi.org/10.2139/ssrn.7528627", "authors": "Syed Wasif Ahmed ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "災害に備えてどの橋をいつ補強するかを、予算の制約の下で多段階に決める問題を、防御者–攻撃者–防御者の3層最適化と3層の階層型Q学習で解き、解釈できる補強方針を学習できるようにした（抄録）。", "p2": "橋は交通網の中で壊れると地域を分断する重要な要素だが、補強には大きな資源が要り、対象だけでなく実施の時期も決める必要がある。3層の非線形混合整数問題は直接解くのが難しい（抄録）。", "p3": "上位層が予算内の段階的な補強計画を選び、中位層が最も損害の大きい災害シナリオを敵対的に選び、下位層が残った通行可能な網で総交通費用が最小になるよう交通を配分する。この入れ子を階層型Q学習で分解し、交通配分を評価環境として補強方針と被害選択の方針を学ぶ（抄録）。", "p4": "交通研究で標準的なSioux Falls網で評価し、小・中規模の例では厳密解との一致、大規模の例では期待値ベース、近視眼的、中心性ベース、交通量ベース、無作為の方針と比べる（抄録）。", "p5": "小・中規模では厳密またはほぼ厳密な解を得て、大規模では比較した方針をすべて上回った（抄録）。予算に対する強靭性の改善は非線形で、ある投資額を超えると限界的な改善が小さくなり、同じ総予算なら前倒しの補強が最悪時の累積交通費用を減らした（抄録）。", "p6": "解釈：Sioux Falls網は小さな模擬ネットワークで、実際の橋の劣化状態や損傷確率は扱っていないようだ。敵対的な最悪シナリオを前提とするため、確率的な災害評価との違いにも注意が要る。未査読のプレプリントである。", "unverified": "具体的な改善率や計算時間は抄録にないため確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "社会関係資本は自治体の行政成果を高める", "title": "The Effects of Social Capital on Government Performance and Turnover: Evidence from Italian Municipalities", "url": "https://doi.org/10.2139/ssrn.7528956", "authors": "Ben Lockwood ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "イタリアの自治体で、社会関係資本（social capital）が高いほど行政サービスの量と効率が上がり、現職の再選の有利さが弱まることを、操作変数法で示した（抄録）。", "p2": "社会関係資本が政府の成績を高めるという主張は多いが、成績と社会関係資本は互いに影響し合うため因果を切り分けにくく、選挙を通じた経路（規律と選抜）も十分に検証されていなかった（抄録）。", "p3": "成績は公式のOpencivitas指数（自治体の行政サービスの産出と効率）で測り、社会関係資本は近隣自治体の社会関係資本と歴史的な指標を操作変数として扱う（抄録）。1期目と2期目の両方で成績を見ることで、規律（再選のために努力する）と選抜（良い人が選ばれる）を区別する。", "p4": "成績（産出・効率）、現職の再選確率、候補者の特徴（女性の参加など）を結果変数とする（抄録）。", "p5": "社会関係資本が高いと、1期目・2期目とも行政の産出と効率が上がり、規律と選抜の両方が働くことと整合的だった（抄録）。社会関係資本が1標準偏差高いと、立候補した現職の再選確率が3〜6ポイント下がった（抄録）。女性の立候補が増える証拠も一部得られた。", "p6": "解釈：近隣自治体の社会関係資本が成績に直接影響しないという除外制約が識別の鍵であり、その妥当性は本文で確認が要る。社会関係資本の具体的な測り方も抄録からは分からない。未査読のプレプリントである。", "unverified": "社会関係資本の指標の定義、期間、自治体数は本文未入手のため確認できなかった。"}}, {"id": "pr15", "rank": 15, "headline": "介護する家族は配偶者から子へ、90歳以上で60代が中心", "title": "同居で介護する家族が 65 歳以上である割合は、介護を受ける人が 70〜74 歳で 0.836、85〜89 歳で 0.473 と下がり、90 歳以上で 0.594 に戻る——そのあいだに介護する人は配偶者から子に替わり、90 歳以上では 60〜69 歳の人が 0.570 を占める [M060]", "url": "https://doi.org/10.5281/zenodo.22976042", "authors": "Yuuki Yamagishi", "venue": "Zenodo", "date": "2026-09-26", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Zenodoの英語版PDFの本文（記法、調査と設計、データ点検、計算4.1・5.1・6.1、図1）を読んだ", "preprint": true, "p1": "令和7年（2025年）国民生活基礎調査（介護票）の公表表から、介護を受ける人の年齢ごとに同居の主な介護者の続柄と年齢を並べ、85〜89歳あたりで介護する人が配偶者から子へ替わることを数値で示した（§5）。", "p2": "介護する家族の高齢化（老老介護）は語られることが多いが、介護を受ける人の年齢によって、介護する人が誰でどの年代かがどう変わるかは、公表表のままでは読み取りにくい（§1）。", "p3": "介護票の第60・61・81・82表（いずれも介護を要する者10万対）を使い、同居の主な介護者に限って、介護を受ける人の年齢階級ごとに配偶者・子・子の配偶者の割合と、介護者が65歳以上・75歳以上である割合を計算する（§2–§5）。表どうしの合計の一致をSHA-256で固定したファイルで点検している（§3）。著者は、設計を表を見たあとに決めたと明記している（§2）。", "p4": "比べるのは年齢階級ごとの割合の並びで、統計的な検定や推定は行っていない。表間の合計の丸め誤差が1以内であることなど、集計の整合性で数値の正しさを確かめる（§3）。", "p5": "家族が主な介護者のとき、配偶者0.383・子0.498で、介護者の0.732が60歳以上だった（計算4.1）。介護者が65歳以上である割合は、受ける人が70〜74歳で0.836と最も高く、85〜89歳で0.473に下がり、90歳以上で0.594に戻る。同じ区間で配偶者の割合は0.857から0.122へ下がり、子は0.111から0.641へ上がった（計算5.1、図1）。90歳以上では介護者の0.570が60〜69歳で、子の配偶者（0.209）が配偶者（0.122）を上回った。図1は横軸が受ける人の年齢、線が続柄・介護者年齢の割合で、配偶者と子の線が交わる位置を見る。", "p6": "著者は、標本調査の推計（10万対）であること、悩み・ストレスの表は使っていないこと、個々の家族の見通しではないことを断っている（抄録）。解釈：独立の個人研究者による公開統計の記述的な再集計で、別居の介護者や事業者を含めた全体像は扱っていない。未査読のプレプリントである。", "unverified": "計算6.1以降（性別の内訳、介護時間）の数値は一部のみ確認した。"}}, {"id": "pr16", "rank": 16, "headline": "目標設定のやり方を途中で変えると成果と幸福が変わる", "title": "Changes in Leaders' Goal-Setting Approaches: Experimental Evidence on Employee Performance, Well-Being, and Work-Related Attitudes", "url": "https://doi.org/10.2139/ssrn.7528825", "authors": "Lena Peters ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "上司の目標設定のやり方が途中で変わること自体の効果を実験で示し、参加型から指示型への変更の悪影響が、指示型から参加型への変更の好影響より大きいという非対称を明らかにした（抄録）。", "p2": "参加型と指示型の目標設定の効果は調べられてきたが、上司のやり方が時間とともに変わった場合の帰結はほとんど分かっていない（抄録）。", "p3": "場面想定法（vignette）の実験に反復測定を組み合わせ、参加者169人に目標設定のやり方の変化（指示型→参加型＝DPC、参加型→指示型＝PDC）を経験させ、成績、幸福感（well-being）、目標へのコミットメントなどを測る（抄録）。", "p4": "「ベストを尽くせ」型の目標と比べた成績の差、変化の前後での各結果の変化、DPCとPDCの効果の大きさの差で評価する（抄録）。", "p5": "参加型・指示型とも「ベストを尽くせ」より成績が高く、両者の間に全体の差はなかった（抄録）。DPCは成績・幸福感・コミットメントを有意に高め、PDCは幸福感とコミットメントを有意に下げ、DPCの好影響はPDCの悪影響より有意に弱かった（抄録）。効果量は抄録にない（未確認）。", "p6": "解釈：場面想定の実験で、実際の職場での長期の関係や成果は測っていない。169人の標本の属性も抄録からは分からない。未査読のプレプリントである。", "unverified": "効果量、課題の内容、参加者の募集方法は本文未入手のため確認できなかった。"}}, {"id": "pr17", "rank": 17, "headline": "AIは信頼より多く使われる：利用と信頼の動機の違い", "title": "Trust as a Complementary Asset: Motives and the Usage-Trust Gap in Artificial Intelligence", "url": "https://doi.org/10.2139/ssrn.7528973", "authors": "Xuan Tran", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の全国代表パネルで、AIの「利用」と「信頼」を分ける動機を分析し、利用は認知度などで広がる一方、信頼は個人的な利益の見込みが生まれないと育たないことを示した（抄録）。", "p2": "人々はAIを信頼する以上に使っており、ChatGPT公開後に利用が広がる中で信頼は下がったという報告があるが、何が利用と信頼を分けるのかは明らかでなかった（抄録）。", "p3": "Teece（1986）の専有可能性の枠組みを使い、社会の信頼を、AI開発企業が必要とするが自前で作れない「補完的資産」と位置づける。Pew Research CenterのAmerican Trends Panel第152波（2024年8月、米国成人5,410人）で、利用と信頼それぞれの規定要因を比べる（抄録）。", "p4": "AIとの接触頻度、重要な決定をAIに任せる信頼、期待される個人的利益・生産性、知覚リスク、政府・企業のAI統治への信頼などの関係を見る（抄録）。", "p5": "57%が週に数回以上AIに接していると考える一方、重要な決定をAIに任せてもよいと答えたのは13%だった（抄録）。信頼は期待される個人的利益と生産性の向上と最も強く関連し、知覚リスクと負に関連した。利用は主にAIの認知度と自己の制御への懸念と関連し、これらは信頼を予測しなかった（抄録）。政府・企業への信頼は、利益とリスクの評価を通じて間接的にのみ信頼と関連した。", "p6": "解釈：横断データのため因果の向きは特定できない。職場でのAI利用に限った分析かどうかは抄録からは分からない。未査読のプレプリントである。", "unverified": "回帰モデルの形式と係数の大きさは本文未入手のため確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "米国の外国企業上場廃止法への市場反応は一様でない", "title": "The Market Reaction to Geopolitical Delisting: Evidence from the Holding Foreign Companies Accountable Act", "url": "https://doi.org/10.2139/ssrn.7528505", "authors": "Xu Chen", "venue": "SSRN", "date": "2026-09-26", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の外国企業説明責任法（HFCAA：監査調書の検査に応じない外国企業を上場廃止にし得る法律）に対する中国・香港企業の株価反応を、規制イベントごとに分けて調べ、市場が一様な上場廃止ショックとしては扱っていなかったことを示した（抄録）。", "p2": "地政学的な理由による上場廃止の脅威が株価にどう織り込まれるかは、法律全体でまとめて見られがちで、個々の規制の出来事ごとの違いは分かっていなかった（抄録）。", "p3": "市場調整モデルとFama-Frenchの3因子モデルによるイベントスタディで、監査協力の合意、法定期限の変更、SECによる対象企業の指定、中央国有企業の上場撤退などの出来事ごとの異常リターンを測る（抄録）。", "p4": "各イベントの前後の累積異常リターンの符号と有意性、業種による違いで評価する（抄録）。", "p5": "監査協力と法定期限に関する出来事で最も強い正の反応が見られ、SECによる指定と中央国有企業の撤退の出来事では執行とその波及のリスクが表れた（抄録）。市場は規制の出来事の連なり、業種の関与度、政治的な注目度を通じて上場の脅威を価格に織り込んだと結論している（抄録）。", "p6": "解釈：出来事が重なる時期の交絡（米中関係の他のニュース）への対処は抄録からは分からない。数値が抄録にないため効果の大きさも未確認。単著の未査読プレプリントである。", "unverified": "対象企業数、イベントの日付、異常リターンの大きさは本文未入手のため確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "充電待ちの混雑が大型トラック電動化を左右する", "title": "Infrastructure-induced congestion reshapes heavy-duty truck electrification through fleet substitution", "url": "https://doi.org/10.2139/ssrn.7528631", "authors": "Yuheng Zhang ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "大型トラックの電動化で、充電の待ち時間（充電設備の混雑）が一定の条件の下で普及を左右する主因になることを、待ち行列理論による分解で示した（抄録）。", "p2": "大型トラックの電動化の分析は費用の比較が中心で、充電設備の混雑が必要な車両台数（代替に要る車両数）を押し上げる効果はあまり考慮されていなかった（抄録）。", "p3": "待ち行列理論で充電にかかる時間を「サービス時間」と「待ち時間」に分け、設備の利用率と待ち時間から混雑の状態（レジーム）を識別し、待ち時間が非線形に膨らむ効果を捉える（抄録）。例：充電器の利用率が高くなると待ち時間が急に伸び、同じ輸送量を運ぶのにより多くの車両が要る。", "p4": "電池車の費用が50%下がる設定で、混雑を考える場合と考えない場合の普及率を比べ、充電器の数や充電速度を増やした場合の効果を見る（抄録）。", "p5": "経済的な競争力に達したあとは、待ち時間が電池車の普及を決める条件付きの主因になり、待ち時間を無視すると導入判断が偏ることを示した（抄録）。充電器や充電速度を増やすと混雑の効果は和らぐが、待ち時間は代替の費用に影響し続けた（抄録）。数値は抄録にない（未確認）。", "p6": "解釈：どの国・地域の輸送データを使ったか、需要の時間変動をどう扱ったかは抄録からは分からない。未査読のプレプリントである。", "unverified": "対象地域、使ったデータ、普及率の具体的な値は本文未入手のため確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "病院の資源配分を会計・臨床・業務データで最適化", "title": "Healthcare Financial Analytics for Optimizing Resource Allocation and Hospital Operating Efficiency", "url": "https://doi.org/10.2139/ssrn.7521999", "authors": "Nathaniel Sackey", "venue": "SSRN", "date": "2026-09-26", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "病院の人員・病床・手術室・設備・資本の配分を支えるため、会計情報・診療活動・業務の流れ・医療の質を結ぶ財務分析の枠組みを文献に基づいて整理した（抄録）。", "p2": "病院の経営者は、安全・質・財務の実現可能性を保ちながら資源を配分する必要があるが、会計情報と臨床・業務のデータをつなげて意思決定に使う枠組みが整っていない（抄録）。", "p3": "診療科別の貢献利益分析、時間主導型の活動基準原価計算（TDABC）、需要と在院日数の予測、容量分析、包絡分析法（DEA）、制約付き最適化、シナリオシミュレーションを組み合わせ、記述・因果・処方の3種の意思決定支援を区別する（抄録）。導入は、意思決定権限と目標の明確化から、監査可能なデータ層、原価と容量の定量化、需要とリスクの予測、臨床・人員の制約の下での最適化、成果の追跡へと段階的に進める。", "p4": "実データによる検証はなく、文献に基づくモデルと例示の値で枠組みを示す論文である（抄録）。", "p5": "主な結論は、財務の指標を患者の転帰、アクセス、人員の持続可能性、実行可能性と合わせて見たときにだけ、財務分析が組織の成果を高めるというもの（抄録）。費用の付け替えや必要な医療の削減、公平性の悪化で利益率を上げることは目指すべきでないと強調している。", "p6": "著者自身が、病院の非公開記録や独自の臨床実験に基づかない文献ベースのモデルだと明記している（抄録）。解釈：枠組みの有効性は実証されておらず、各手法の組み合わせ方の新しさも抄録からは判断できない。未査読のプレプリントである。", "unverified": "本文の4つの分析表の内容と例示値は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "多エージェント討論は単純な無作為の結びつきで十分", "title": "Do We Need Complex Topology Control? Distinct-Peer Random Routing Improves Cost-Efficiency in Sparse Multi-Agent Debate", "url": "https://doi.org/10.48550/arxiv.2609.27150", "authors": "Boxuan Wang ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント討論（MAD）で、通信の構造を学習・動的に変える複雑な制御がなくても、毎ラウンド異なる2体と無作為に組む単純な経路づけで、精度とコストの釣り合いが改善することを示した（抄録）。", "p3": "各エージェントが毎ラウンド、重複なく新しく抽出した2体の相手とだけ討論する「非復元の無作為経路づけ」を、疎な討論の基準として比べ、討論を早めに打ち切る軽い停止規則も調べる（抄録）。", "p5": "この単純な経路づけは疎な討論の精度とコストの釣り合いを一貫して改善し、軽い停止規則は精度を保ったまま推論コストを大きく減らした（抄録）。著者は、複雑な構造制御はこうした単純な基準と比べて評価すべきだと述べている。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr22", "rank": 22, "headline": "複数LLMの協議は必要なときだけ呼ぶのがよい", "title": "COMED: The Missing Middle Between Routing and Collaboration in Multi-LLM Inference", "url": "https://doi.org/10.48550/arxiv.2609.26913", "authors": "Norah Alballa ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": true, "short": true, "p1": "複数のLLMを組み合わせる推論で、協議が失敗を救う一方で正解を壊すこともある点を示し、必要なときだけ他のモデルに相談する制御法（COMED）で、少ない呼び出しで精度を上げた（抄録）。", "p3": "最初のモデルの自己一貫性、振り分け器の確信度の差、軽い相談の結果から、答えを受け入れる・確かめる・他モデルに協議させるを選ぶ。救えた誤りと協議で生じた害に分解して、選択的な協議が有利になる条件を示す（抄録）。", "p5": "医療・科学・一般の推論ベンチマークで16のオープンモデル設定すべてで改善し、MedQAで最大10.7ポイント上がった（抄録）。先端モデルではHLEでGPT-5.5の正答率を23.1%から28.1%に上げ、密な協議より少ないモデル・トークンで済んだ。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr23", "rank": 23, "headline": "ペルソナの文化ラベルより状況変数が振る舞いを決める", "title": "Situational Variables Versus Cultural Labels in Persona Conditioning: Shared Stereotype, Shared Rule", "url": "https://doi.org/10.5281/zenodo.22983112", "authors": "Williams ほか", "venue": "DataCite preprints", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明を使用", "preprint": true, "short": true, "p1": "ペルソナを付けたLLMの丁寧さの違いは、文化的背景のラベルではなく、力の差・社会的距離・依頼の大きさという状況の変数でも再現できるかを試した（抄録）。", "p3": "先行の監査で使われた8つの文化ラベルを、Brown and Levinsonのポライトネス理論の状況変数で作った8つのプロフィールに置き換え、課題・モデル・試行回数を同じにして比べる（抄録）。", "p5": "Claudeでは状況の変数が文化ラベルと同じ向きの丁寧さの違いを、小さめの大きさで再現し、力の差と社会的距離は予測どおりに働いた（抄録）。GPT-4oでは敬意・集団志向などは少し動いたが、率直さやぼかしは動かなかった。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr24", "rank": 24, "headline": "LLMの出力に含まれる国家プロパガンダを体系的に評価", "title": "Systematic Evaluation of Nation-State Propaganda in LLM Outputs", "url": "https://doi.org/10.31235/osf.io/57buw_v2", "authors": "Kevin T. Greene ほか", "venue": "SocArXiv", "date": "2026-09-27", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLMの回答が国家主導の宣伝（プロパガンダ）をどれほど広めるかを、記録された宣伝と報道から評価質問を自動生成する再現可能な手順で体系的に測った（抄録）。", "p3": "記録されたロシア政府系の宣伝と報道を標本抽出して質問を作り、5つの主要モデルの回答が宣伝と一致する主張を再現するか、訂正なしに一方の見方を示すか、宣伝媒体を引用するかを監査する（抄録）。", "p5": "宣伝と一致する回答や宣伝媒体の引用は、少数の質問に基づく先行研究が示すより大幅に少なく、ウクライナに関する普通の情報検索に近い質問では特にまれだった（抄録）。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr25", "rank": 25, "headline": "LLMは紛争の偽情報をどう配り、どう形づくるか", "title": "Generative Visibility Regimes: How Large Language Models Distribute and Shape Political Disinformation Narratives Across Conflicts and Languages", "url": "https://osf.io/cktxg", "authors": "Petter Bae Brandtzæg ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-09-23", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "原文を取得できず、題名のみ", "preprint": true, "short": true, "p1": "題名からは、大規模言語モデルが紛争と言語をまたいで政治的な偽情報の語りをどう配り、どう形づくるかを調べる研究だと分かる（題名からの情報）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報はすべて確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "LLMアノテーションの高一致は正確さを保証しない", "title": "Agreement Without Accuracy: Six Systematic Defects an LLM Annotation Study Could Not See in Its Own Reliability Statistics", "url": "https://doi.org/10.31235/osf.io/n3zhf_v1", "authors": "Hon-Ren Lin", "venue": "SocArXiv", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（方法、結果の信頼性統計・出現率の節、6つの欠陥の一覧、限界）と表1〜5のキャプションを読んだ", "preprint": true, "p1": "LLMを注釈者（annotator）として使う研究で、同じ設定での再実行一致率などの信頼性統計が高くても、系統的な誤りを見落とし得ることを自らの研究の失敗例で具体的に示し、コードごとの出現率比較と、出力を見る前の盲検読みが最低限の点検だと主張した（抄録、§Limitations）。", "p2": "LLM注釈の信頼性の証拠として、固定シード・温度0での再実行の一致（test–retest agreement）が安価なためよく使われるが、それが正確さを保証するかは確かめられていない（抄録、§Introduction）。", "p3": "台湾の職業系プログラミング授業の受講生が書いたUMLクラス仕様1,902件を、参照仕様と照合して誤りコードを付ける課題で、①元の単一段階プロンプト（v1）、②コード定義を検査可能な条件に書き直した版（v1+）、③3段階に分けたパイプライン（v2：対応表作成→対ごとの判定→階層の読み取り）を各2回実行して比べる（§Method、表1）。", "p4": "信頼性は、2回の実行間の回答単位の完全一致率、コードごとの偶然補正一致（κ）、内部整合性で見る。正確さの手がかりとしては、条件間のコード出現率の比較と、出力を見る前に行った40件の盲検読み（階層宣言の有無の下位コードのみ）を使う（§Method、表4）。", "p5": "3段階化で回答単位の一致率は.647から.845へ上がり（原文の表記）（表2）、どのコードでもκが上がった。しかし条件間でコード出現率が3倍以上動くものがあり（表3）、出力を調べると、与えていない入力を前提にした指示でフラグの64.7%が誤りだったのにκは.971だった、など5つの系統的欠陥が見つかった（抄録、表5）。さらに自分たちの点検ルールは盲検読みと67.5%しか一致しなかった（抄録）。盲検読みの基準では、報告した修正が効いたとは示せなかった（抄録）。", "p6": "著者は、1つのパイプライン・1課題・1モデルの事例報告で欠陥の頻度は言えないこと、盲検読みは1人・40件・1下位コードに限られること、v1だけ実行日が1週間ずれていること、正解データがないため通常の意味での正確さは評価していないことを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "補足資料（コード表・プロンプト）は確認していない。表3の各コードの出現率の数値は一部のみ確認。"}}, {"id": "pr27", "rank": 27, "headline": "同じモデル・同じプロンプトでもハードで答えが変わる", "title": "Same model, same prompts, different answers: item-level cross-hardware reproducibility of LLM evaluation results", "url": "https://doi.org/10.5281/zenodo.22985466", "authors": "Templeman ほか", "venue": "DataCite preprints", "date": "2026-09-27", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明を使用", "preprint": true, "short": true, "p1": "LLMの評価結果は、モデル・プロンプト・採点だけでなく、実行した計算機にも左右されることを、公開済みの評価を別のGPUで項目ごとに再実行して示した（抄録）。", "p3": "11のオープンモデル、14の評価軸、9,757項目の154件の評価結果を、同じモデル・プロンプト・貪欲な復号で、RTX 3090からTesla T4に変えて再実行し、出力と採点の一致を項目単位で比べる（抄録）。", "p5": "出力が完全に一致したのは84.4%の項目、採点の一致は97.3%で、採点が変わった260件（2.66%）は上下両方向で合計ではほぼ打ち消し合った（抄録）。項目単位で完全に一致した評価結果は54件だけで、著者は実行環境の報告と項目単位の一致を求めている。", "unverified": "抄録の範囲のため、詳細な設定や数値は確認していない。"}}, {"id": "pr28", "rank": 28, "headline": "長引く財務困窮の中での一時的な猶予の効果", "title": "Fleeting Forbearance in a World of Persistent Financial Dist
