か", "venue": "Engineering Structures", "sjr": 1.922, "date": "2026-09-26", "rank": 1, "id": "jr01", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossref・OpenAlexにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、中国の高速鉄道のCRTS III型スラブ軌道と橋梁からなる系で、地震によって生じる軌道の不整（レールの凹凸・ずれ）を、要素を切り離した確率モデルで予測し、その不確実性を定量化する研究だと分かる（題名からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（手法、データ、結果）はすべて確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "温度応答の傾向で橋の点検優先度を決める", "title": "Thermal-response trend screening for inspection prioritisation of prestressed concrete continuous box-girder bridges", "url": "https://doi.org/10.1080/15732479.2026.2738784", "authors": "Wande Li ほか", "venue": "Structure and Infrastructure Engineering", "date": "2026-09-26", "rank": 2, "id": "jr02", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、プレストレストコンクリート連続箱桁橋の温度応答の傾向を選別（スクリーニング）し、点検の優先順位づけに使う方法を扱う論文だと分かる。長期の構造モニタリングの温度応答を維持管理の判断に結びつける試みと考えられる（題名からの解釈）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "車両床から背中への振動伝達で乗り物酔いを推定", "title": "Motion sickness incidence estimation incorporating back-measured torso biodynamic response: Modeling and real-vehicle evaluation", "url": "https://doi.org/10.1177/10775463261491871", "authors": "Jialiang Zhu ほか", "venue": "Journal of Vibration and Control", "date": "2026-09-26", "rank": 3, "id": "jr03", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "車の床の振動がそのまま乗員に届くと仮定する従来の乗り物酔いの推定を改め、床から背中・上半身への振動の伝わり方を4自由度モデルで表し、再構成した背中の加速度で乗り物酔いの発生率（MSI）をより正確に推定できるようにした（抄録）。", "p2": "振動に基づく乗り物酔いの推定モデルは車両の加速度を直接使うため、車両と乗員の間の力学的な伝達を考慮していなかった（抄録）。", "p3": "着座した乗員の「床→背中」の振動伝達を、上下・左右・前後の軸ごとに独立した4自由度モデルで表す。モデルで再構成した背中・上半身の加速度を、周波数重み付けと時間の累積を考慮した乗り物酔い推定式の入力に使う（抄録）。例：同じ車の揺れでも、座席と体の伝達特性によって背中に届く揺れが変わることを入力に反映する。", "p4": "実車実験で、モデルが予測した床→背中の加速度伝達率の大きさと実測の一致（決定係数R²）を確かめ、直進とスラローム走行で、背中の応答に基づく推定と床の加速度を直接使う推定の誤差（RMSE）を比べる（抄録）。", "p5": "伝達率の大きさのR²は上下0.9648、左右0.9665、前後0.9524だった（抄録）。背中の応答に基づく推定は、直接モデルに比べて集団レベルのRMSEを直進で22.10%、スラロームで17.54%減らした（抄録）。性別や体重の群、スマートフォンを見る条件、入力の揺らぎでの性能も調べている。", "p6": "解釈：伝達率の一致は大きさ（振幅）の特性で示されており、位相の再現は抄録からは分からない。被験者数や車種の範囲も抄録にはない。", "unverified": "被験者数、車両の種類、モデルのパラメータの同定方法は本文未入手のため確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "物理情報NNで積層板の振動から損傷を同定", "title": "Vibration-based damage identification in CFRP laminates using physics-informed neural networks 物理情報組込み型ニューラルネットワークを用いたCFRP積層板の振動に基づく損傷同定", "url": "https://doi.org/10.1299/jsmecs.2026.64.01c1", "authors": "Keiji Ogi ほか", "venue": "The Proceedings of Conference of Chugoku-Shikoku Branch（日本機械学会）", "date": "2026-09-24", "rank": 4, "id": "jr04", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、炭素繊維強化プラスチック（CFRP）積層板の損傷を、振動応答から物理情報組込み型ニューラルネットワーク（PINN）で同定する研究だと分かる。日本機械学会中国四国支部の講演会論文である（題名と掲載先からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"theme": "会計情報科学", "headline": "財務状態の履歴が翌年の悪化と回復を予測する", "title": "Financial Distress Trajectories: A Sequence Analysis of Non-Financial Firms Listed on Borsa Istanbul", "url": "https://doi.org/10.3390/ijfs14090254", "authors": "Rafael Bayramli ほか", "venue": "International Journal of Financial Studies", "date": "2026-09-21", "rank": 5, "id": "jr05", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "企業の財務状態を1年ごとの断面ではなく「健全・危険・困窮」の状態の系列として扱い、過去の状態の推移の履歴が、翌年の悪化と回復を現在の財務比率以上に予測することを示した（抄録）。", "p2": "財務困窮のモデルは企業×年の観測を断面として扱うことが多く、その状態が一時的か、長引いているか、繰り返しているか、最近回復したのかが見えなくなる（抄録）。", "p3": "イスタンブール証券取引所の非金融企業258社の2016〜2024年のデータで、AltmanのZスコアに基づいて毎年の状態を健全・危険・困窮に符号化する。系列全体の型を最適マッチング（optimal matching）とPAMクラスタリングで見つけ、動的ハミング距離で頑健性を確かめる。さらに過去の履歴の指標（状態の移り変わりの回数、現在の困窮の継続年数など）を離散時間ロジットモデルに入れる（抄録）。例：健全な企業でも、過去に状態が何度も変わっていれば翌年悪化しやすいかを見る。", "p4": "企業でクラスター化した標準誤差と、企業単位でまとめた反復交差検証で、履歴の指標が現在の財務比率に加えて翌年の悪化・回復の予測に役立つかを評価する（抄録）。", "p5": "系列の型は「おおむね健全」と「長期・反復的な困窮」の2つの安定した群に分かれた（抄録）。健全な企業では、過去の状態の移り変わりが1回多いごとに翌年悪化するオッズが63.6%高く、健全でない企業では、現在の困窮が1年長いごとに回復のオッズが24.6%低かった（抄録）。悪化と回復は異なる履歴の特徴と結びついていた。", "p6": "解釈：状態はAltmanのスコアから機械的に定義したもので、実際の倒産や債務不履行ではない。1か国・258社の比較的小さな標本で、予測精度の改善幅は抄録にない。", "unverified": "交差検証での予測精度（AUCなど）の数値と、使った財務比率の一覧は本文未入手のため確認できなかった。"}}, {"theme": "会計情報科学", "headline": "東南アジア4か国の上場企業の財務困窮を予測", "title": "Predicting Corporate Financial Distress in Four Southeast Asian Countries", "url": "https://doi.org/10.1162/asep.a.1011", "authors": "Jose Miguel Bautista ほか", "venue": "Asian Economic Papers", "date": "2026-09-21", "rank": 6, "id": "jr06", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "インドネシア・マレーシア・フィリピン・タイの上場企業（銀行を除く）の財務困窮を、パネル・ロジットとLASSOで予測し、推定期間を毎年更新する逐次的な標本外予測で性能を確かめた（抄録）。", "p2": "債務不履行やゾンビ企業につながる財務困窮のリスクの定量化は、研究者・投資家・規制当局の関心事だが、東南アジアの上場企業について、標本外の予測性能まで検証した研究は多くない（抄録）。", "p3": "2005〜19年のデータでパネル・ロジットモデルを推定し、2020年の困窮を予測したあと、推定の窓を毎年延ばして2022年まで1年先を予測する（抄録）。この逐次予測自体が推定値と予測の安定性の検証になる。予測精度を上げるため、変数選択に最小絶対値縮小選択演算子（LASSO）を使う。", "p4": "標本外の予測で、困窮企業をどれだけ識別できるかを比べる（抄録）。具体的な指標は抄録に記載がない（未確認）。", "p5": "パネル・ロジットモデルは困窮企業をそれなりによく識別し、LASSOは予想どおり予測精度を改善した（抄録）。数値は抄録にない（未確認）。", "p6": "解釈：困窮の定義や説明変数、コロナ禍の2020年を含む予測期間の影響は抄録からは分からない。Asian Economic Papersには本論文への討論者のコメントも掲載されている（候補一覧による）。", "unverified": "困窮の定義、使った変数、予測精度の数値はすべて本文未入手のため確認できなかった。"}}, {"theme": "職場AI・組織行動", "headline": "生成AIの導入とAIリテラシーの適合が創造性を高める", "title": "Unleashing innovation: how fit between organizational generative AI adoption and employee AI literacy drives creative performance", "url": "https://doi.org/10.1108/lodj-02-2025-0131", "authors": "Yuye Wang ほか", "venue": "Leadership & Organization Development Journal", "date": "2026-09-22", "rank": 7, "id": "jr07", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "組織による生成AIの導入を「新しい仕事の要求」、従業員のAIリテラシーを「個人の能力」とみなし、両者が合っているほど従業員の創造的な成果が高いことを、上司と部下324組の複数時点のデータで示した（抄録）。", "p2": "組織が上から生成AIを導入する場面で、AIに関わる仕事の要求が従業員のAI能力と合っているかは重要だが、先行研究は組織の導入と個人のAIリテラシーを別々のイノベーションの要因として扱い、その適合を見てこなかった（抄録）。", "p3": "人と職務の適合（person-job fit）理論に基づき、上司と部下324組から複数時点でデータを集め、多項式回帰と応答曲面分析（response surface analysis）で、導入の程度とAIリテラシーの一致・不一致が創造的成果にどう関わるかを調べる（抄録）。例：導入が進んだ職場でリテラシーの高い人（高-高）と、導入が少なくリテラシーも低い人（低-低）を比べる。", "p4": "適合の効果、高-高と低-低の比較、2種類の不一致（能力が要求を上回る「過剰適格」と下回る「過少適格」）の比較、仕事の動機づけ（自律的・統制的）の媒介効果で仮説を検証する（抄録）。", "p5": "組織の生成AI導入と従業員のAIリテラシーの適合は創造的成果と正に関連し、高-高の適合は低-低より創造的成果が高かった（抄録）。不一致の中では、過剰適格の方が過少適格より創造的成果に有利だった。自律的・統制的な動機づけが、適合と創造的成果の関係を媒介した（抄録）。", "p6": "解釈：創造的成果は上司評価と考えられるが、測り方の詳細は抄録からは分からない。対象の国・業種も未確認で、観察データのため因果の向きには限界がある。", "unverified": "標本の国・業種、効果の大きさ、尺度の出典は本文未入手のため確認できなかった。"}}, {"theme": "LLM熟議・ペルソナ", "headline": "LLM支援の術前説明で患者不安と医師負担が減少", "title": "Large language model–assisted preoperative communication reduces patient anxiety and physician workload in prostate cancer: a prospective randomized phase II trial", "url": "https://doi.org/10.1038/s41746-026-03309-7", "authors": "Zheng Liu ほか", "venue": "npj Digital Medicine", "date": "2026-09-26", "sjr": 4.215, "rank": 8, "id": "jr08", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "前立腺がんの手術前の説明で、患者の質問に院内で動かすLLMが個別に答えてから医師が面談する方式を無作為化試験で検証し、患者の不安を下げ、医師の負担と説明時間を減らせることを示した（抄録）。", "p2": "手術前の説明は患者の不安や病気の理解に大きく関わるが、医師の時間と負担が大きい。LLMによる支援が患者と医師の双方に役立つかを、前向きの無作為化試験で確かめた例は少ない（抄録）。", "p3": "根治的前立腺摘除術を予定する新規診断の患者を、病室単位で通常説明群とAI支援群に割り付ける。AI支援群では、集めた患者の質問に院内に配置したLLMが個別の回答を作り、面談の前に患者に渡す。医師は割り付けを知らされない（単盲検）（抄録）。", "p4": "主要評価項目は患者の不安（GAD-7）と医師の負担（NASA-TLX）で、副次項目は感情、病気の認知、満足度、説明時間（抄録）。第II相の試験で、ClinicalTrials.govに登録されている（NCT07082049）。", "p5": "268人が割り付けられ（通常130人、AI支援138人）、3,507件の質問が集まった（1人平均13.1件）（抄録）。説明後の不安（GAD-7）はAI支援群3.2、通常群5.7（P=0.001）、医師の負担（NASA-TLX）は39.9対56.8（P<0.001）、説明時間は11.3分対19.9分（P<0.001）だった（抄録）。感情、病気の認知、満足度もAI支援群で良かった。", "p6": "解釈：病室単位の割り付けで、患者は自分がAIの回答を受けたと分かる。医師は割り付けを知らされないが、患者の様子から推測できる可能性がある。回答の誤りの有無や安全性の評価、長期の転帰は抄録からは分からない。単施設か多施設かも未確認。", "unverified": "使用したLLMの種類、回答の正確性の検証、施設数は本文未入手のため確認できなかった。"}}, {"theme": "LLM熟議・ペルソナ", "headline": "LLMエージェントが事務所の多様な在室者行動を再現", "title": "Large language model agents capture heterogeneous occupant behaviors in building energy simulation of shared office spaces", "url": "https://doi.org/10.1016/j.buildenv.2026.115329", "authors": "Xiaoxiao Xu ほか", "venue": "Building and Environment", "date": "2026-09-26", "sjr": 1.906, "rank": 9, "id": "jr09", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、LLMエージェントが共用オフィスの在室者の多様な行動を再現し、建物のエネルギーシミュレーションに組み込めることを示す研究だと分かる（題名からの情報）。どの程度実測と合うかは未確認。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"theme": "会計情報科学", "headline": "ESGの悪い報道の後、企業は実体的な利益調整を増やす", "title": "Camouflaging the damage: the consequences of negative ESG media coverage on earnings management", "url": "https://doi.org/10.1080/01559982.2026.2710588", "authors": "Emma García‐Meca ほか", "venue": "Accounting Forum", "date": "2026-09-21", "rank": 10, "id": "jr10", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用（COREでもリポジトリ版は見つからず）", "preprint": false, "p1": "ESGの不祥事について否定的な報道を受けた欧州の上場企業が、その後に実体的な利益調整と科目の付け替え（classification shifting）を増やすことを示し、それが資金調達コストの上昇や機関投資家の離反を和らげる「盾」として使われていることを明らかにした（抄録）。", "p2": "ESGの不祥事への報道の目が厳しくなる中で、企業が報道のコストに対応して利益調整の戦略をどう変えるのかは分かっていなかった（抄録）。倫理的な見方（不正を控える）、経営者の機会主義の見方、トレードオフの見方の3つの予測が対立する。", "p3": "2018〜2022年の欧州の上場企業のパネルで、否定的なESG報道のあとの実体的な利益調整と科目の付け替えの変化を調べる（抄録）。気候に関する否定的な報道、資金調達コストと機関投資家の保有比率への影響、国の社会規範・規制の厳しさ・汚職の抑制、取締役会の有効性による違いも分析する。", "p4": "否定的な報道の前後での利益調整の指標の変化と、それを弱める制度・ガバナンスの条件で評価する（抄録）。", "p5": "否定的なESG報道のあと、企業は実体的な利益調整と科目の付け替えを増やし、経営者の機会主義の見方と整合した（抄録）。気候リスクへの露出も同様の反応を招き、利益調整は資金調達コストの上昇と機関投資家の保有の減少を和らげる働きをしていた。社会規範が厳しく規制の目が強く汚職の抑制がよい国の企業や、取締役会が有効な企業では利益操作が起きにくかった（抄録）。", "p6": "解釈：報道の測り方（データベースや言語）と、利益調整の推定モデルは抄録からは分からない。欧州企業に限った結果で、効果の大きさも未確認。", "unverified": "報道データの出典、標本の企業数、係数の大きさは本文未入手のため確認できなかった。"}}, {"theme": "職場AI・組織行動", "headline": "アルゴリズムが決める銀行で管理者の道徳的正統性は", "title": "When the algorithm decides: moral legitimacy, ethical bank managers, and the restorative power of territorial embeddedness", "url": "https://doi.org/10.1108/ijoes-04-2026-0297", "authors": "Rafael Robina-Ramírez ほか", "venue": "International Journal of Ethics and Systems", "date": "2026-09-26", "sjr": 0.672, "rank": 11, "id": "jr11", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "銀行の意思決定にアルゴリズムが入り込む中で、倫理的な管理者の「解釈」と、地域への根づき（territorial embeddedness）が、従業員の道徳的な自信を支えることを混合研究法で示した（抄録）。", "p2": "アルゴリズムが判断を下す場面で、人間の管理者の道徳的な正統性がどう保たれ、あるいは失われるのかは分かっていない（抄録）。", "p3": "農村と都市の銀行管理者のフォーカスグループ2回で「アルゴリズムによる道徳的な置き換え理論（AMDT）」の枠組みと尺度を調整し、スペイン・エストレマドゥーラ州の79支店（農村44、都市・準都市35）の管理者と従業員606人のデータをPLS-SEMで分析する（抄録）。媒介分析と、地域・役職の多群比較を行う。", "p4": "倫理的リーダーシップ、アルゴリズムの透明性、知覚されたアルゴリズムの権威、地域への根づきと、従業員の道徳的な自信との関係を、媒介経路と群間差で評価する（抄録）。", "p5": "リーダーの道徳的な自律性の知覚が、倫理的リーダーシップ・アルゴリズムの権威・透明性・地域への根づきと従業員の道徳的な自信を結ぶ媒介の仕組みとして現れた（抄録）。アルゴリズムの権威は道徳的な自信と直接には関連せず、管理者の倫理的な解釈への評価を通じて働いた。地域への根づきは特に農村で正に関連し、都市では透明性と倫理的な説明が重視された（抄録）。", "p6": "著者は、道徳的な正統性はアルゴリズムに置き換えられるのではなく組み替えられると解釈している（抄録）。解釈：横断的な自己報告のデータで因果の向きは特定できず、一地域の銀行に限られる。係数の大きさは抄録にない。", "unverified": "パス係数と適合度は本文未入手のため確認できなかった。"}}, {"theme": "職場AI・組織行動", "headline": "スマート工場の規則違反は非効率への対処だった", "title": "Non-compliance at work: Workarounds and inefficiencies in the ‘smart’ factory", "url": "https://doi.org/10.1177/09500170261473534", "authors": "Chiara Benassi ほか", "venue": "Work, Employment and Society", "date": "2026-09-26", "sjr": 2.204, "rank": 12, "id": "jr12", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "イタリアの製造業の「スマート」工場で、組立ラインの労働者が規則に従わないのは管理への反抗ではなく、過度な標準化とコスト削減が生む非効率への対処だったことを、68件の聞き取りで示した（抄録）。", "p2": "職場での規則違反は、組織的な不品行（misbehaviour）や労働者の「ゲーム」として説明されてきたが、それでは経営が生んだ非効率への対応としての違反を捉えられない（抄録）。", "p3": "組立ラインの労働者と他の関係者への半構造化面接68件を分析し、情報システム研究の「ワークアラウンド（workaround：公式の手順の回避策）」の概念と、産業社会学・労働過程論を組み合わせて解釈する（抄録）。", "p4": "質的研究で、規則違反の動機と形を、既存の概念（不品行・ゲーム）とワークアラウンドの概念のどちらでよく説明できるかを検討する（抄録）。", "p5": "労働者の規則違反は、経営側が作った非効率（過度の標準化とコスト削減）への応答であり、ワークアラウンドの概念でよりよく理解できると論じる（抄録）。自動化の進んだ仕事でも労働者の創意工夫が重要であり続けることを示し、技術中心の「仕事の未来」の語りに異議を唱えている（抄録）。", "p6": "解釈：1社の事例研究で、他の産業・国への一般化には限界がある。どの程度の違反が生産性にどう影響したかの定量的な評価はない。", "unverified": "工場で導入されていた具体的なデジタル技術と、面接の対象者の内訳は本文未入手のため確認できなかった。"}}, {"theme": "サービス・マーケティング", "headline": "AIインフルエンサーの主体性が感情関与と幸福に影響", "title": "Agentic AI-enabled influencers and psychological persuasion: agenticity shaping emotional engagement and well-being", "url": "https://doi.org/10.1108/jcm-11-2025-8511", "authors": "Arjun J. Nair ほか", "venue": "Journal of Consumer Marketing", "date": "2026-09-26", "rank": 13, "id": "jr13", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "自律的にふるまうAIインフルエンサーが、真正性・信頼・感情的な関与を通じて消費者の幸福感にどう関わるかを、専門家のデルファイ法と北米の利用者1,943人の構造方程式モデリングで示した（抄録）。", "p2": "AIによる説得が心理的・社会的にどう働くかを説明する統合的な理論がなく、説得知識モデル、擬似社会的相互作用、自己決定理論が別々に使われてきた（抄録）。", "p3": "第1段階でファジー・デルファイ法により19人の学際的な専門家が「主体的なAIによる説得」の構成概念を検証・優先順位づけし、第2段階でカナダと米国のSNS利用者1,943人のデータを構造方程式モデリングで分析する（抄録）。", "p4": "知覚された主体性（agenticity）と真正性・信頼・感情的関与・幸福感の関係、真正性と信頼の媒介効果、文化的志向とデジタルリテラシーの調整効果を検証する（抄録）。", "p5": "知覚された主体性は、透明性と感情的な応答性を伴うとき、真正性・信頼・感情的関与と正に関連し、消費者の幸福感につながった（抄録）。真正性と信頼が主要な媒介変数で、文化的志向とデジタルリテラシーが関係の強さを調整した（抄録）。著者は、AIによる説得は操作ではなく自律性と感情の一貫性を支えるときに最も効果的だとまとめている。", "p6": "解釈：横断的な自己報告の調査で、幸福感への因果効果は示せない。効果量や適合度は抄録にない。", "unverified": "モデルの係数と適合度、標本の抽出方法は本文未入手のため確認できなかった。"}}, {"theme": "包摂的コミュニティ・社会", "headline": "ホームレス状態の若者は制度の外の資本に頼る", "title": "Social Networks From the Margins: Race, Social Capital, and Educational Access Among Youth Experiencing Homelessness", "url": "https://doi.org/10.1177/23328584261482103", "authors": "Earl J. Edwards", "venue": "AERA Open", "date": "2026-09-26", "sjr": 1.435, "rank": 14, "id": "jr14", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ロサンゼルス郡でホームレス状態にある黒人・ラテン系の若者23人への聞き取りから、住宅・貧困対策と学校の保護制度が分断される中で、信頼できる教職員と家族・地域のネットワークが異なる役割で支えていることを示した（抄録）。", "p2": "米国では毎年150万人以上の児童生徒がホームレス状態と認定されるが、学校で受けられる保護（マッキニー・ベント法）から切り離されている者が多く、人種を踏まえてその理由を分析した研究は少ない（抄録）。", "p3": "Linの社会関係資本理論とStanton-Salazarの「エンパワメントの担い手（empowerment agents）」の概念を使い、23人の若者への聞き取りを分析する（抄録）。", "p4": "質的研究で、若者が制度的な資本と非制度的な資本にどうアクセスするかを主題分析する（抄録）。", "p5": "住宅・貧困対策の制度は学校の保護制度と連携していないことが多く、制度への不信と人種による監視への懸念から、住まいの不安定さを打ち明けない若者もいた（抄録）。信頼できる教職員は、制度上の権限と文化的な信頼・ケアをあわせ持つ「関係の仲介者」として働いた。家族や地域のネットワークは物質的・情緒的な支えと日々の安定を与えたが、学校の正式な保護には必ずしもつながらなかった（抄録）。", "p6": "著者は、支えることと制度にアクセスさせることは補い合うものであって同じではないと結論している（抄録）。解釈：1地域・23人の質的研究で、一般化には限界がある。", "unverified": "対象者の募集方法と年齢構成は本文未入手のため確認できなかった。"}}, {"theme": "包摂的コミュニティ・社会", "headline": "動機づけ面接で高齢者虐待の再発を減らせるか", "title": "Motivation Interviewing to Reduce Elder Abuse and Neglect: Findings From a Randomized Controlled Trial in Hong Kong", "url": "https://doi.org/10.1111/jgs.70743", "authors": "Elsie Yan ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-09-26", "sjr": 1.711, "rank": 15, "id": "jr15", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "香港の地域に住む高齢者虐待・ネグレクトのリスクのある人に、動機づけ面接（motivational interviewing）を4回行うと、心理的な攻撃や介護者によるネグレクトが減り、自己効力感と社会的支援が高まることを無作為化比較試験で示した（抄録）。", "p2": "高齢者虐待・ネグレクトは深刻な結果をもたらすが、高齢者は助けを求めることをためらいがちで、行動変化への迷いを解く動機づけ面接をこの分野に使った実証評価はほとんどなかった（抄録）。", "p3": "動機づけ面接は、行動を変えることへの両価的な気持ちを、本人の動機を引き出すことで解消する面接技法である。60歳以上の中国語を話す地域在住の高齢者を対象に、支援者が個別に4回の面接で本人の目標を明確にし変化への動機を引き出す。対照群は順番待ち（wait-list）とする（抄録）。", "p4": "主要評価項目は過去1か月の虐待・ネグレクト（改訂版葛藤戦術尺度と高齢者経済的搾取尺度の項目を修正）で、副次項目は主観的健康、心理的幸福感、自己効力感、社会的支援。開始時・介入後・3か月後に測定し、混合効果モデルで比べる（抄録）。事前にISRCTNに登録されている。", "p5": "適格者359人のうち161人が参加を断り、198人（平均73.6歳、女性88.9%）を99人ずつに分けた（抄録）。介入群は3か月後の軽度の心理的攻撃の減少が大きく（Cohenのd=0.92、p<0.001）、介入直後の介護者のネグレクトの減少も大きかった（d=0.57、p<0.05）（抄録）。自己効力感（d=0.67〜0.83）と社会的支援（d=2.08）も改善した。", "p6": "解釈：適格者359人のうち161人が参加を断っており、参加者は変化に前向きな人に偏った可能性がある。対照は順番待ちで盲検化は難しく、結果は自己報告に依存する。追跡は3か月と短い。", "unverified": "脱落率、多重比較の扱い、身体的虐待など他の下位項目の結果は本文未入手のため確認できなかった。"}}, {"theme": "職場AI・組織行動", "headline": "AI知識能力が心理的エンパワメントを通じ革新を促す", "title": "AI knowledge capability and innovation: the power of cognitive processing and empowerment", "url": "https://doi.org/10.1108/jkm-04-2026-0780", "authors": "Dengkai Wu ほか", "venue": "Journal of Knowledge Management", "date": "2026-09-26", "sjr": 2.382, "rank": 16, "id": "jr16", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "AIを使った知識の生成と統合の「場（Ba）」が、AIに関する知識能力と心理的エンパワメントを通じてイノベーションの成果につながるという経路を、AI活用組織の専門職301人の調査で示した（抄録）。", "p2": "組織学習論とAIの新しい能力を結びつけ、AIによる知識のプロセスがイノベーションの成果を高める仕組みを説明する枠組みが不足していた（抄録）。", "p3": "米国のAI活用組織で働く専門職301人の質問紙データを構造方程式モデリングで分析し、AIによる知識生成の場と知識統合の場が、AIの知識能力とAIの心理的エンパワメントを介してAIイノベーションの成果に至る経路と、生成AIによる認知処理の調整効果を検証する（抄録）。", "p4": "各経路の係数の有意性と調整効果の有無で仮説を評価する（抄録）。", "p5": "知識生成の場・知識統合の場の両方がAIの知識能力と心理的エンパワメントに正に関連し、その両方がAIイノベーションの成果に正に関連した（抄録）。生成AIの認知処理は、知識能力と成果の関係を強めたが、心理的エンパワメントと成果の関係は調整しなかった（抄録）。", "p6": "解釈：同一回答者の自己報告による横断データで、共通方法バイアスと因果の向きの問題が残る。成果も自己評価の可能性が高い。係数は抄録にない。", "unverified": "尺度の出典、係数の大きさ、適合度は本文未入手のため確認できなかった。"}}, {"theme": "職場AI・組織行動", "headline": "創造的な上司ほど急進的な提案を脅威と感じにくい", "title": "When and Why Do Leaders Endorse Radical Ideas? A Transactional Theory of Stress Perspective", "url": "https://doi.org/10.1002/job.70131", "authors": "Xuting Jiang ほか", "venue": "Journal of Organizational Behavior", "date": "2026-09-26", "sjr": 3.999, "rank": 17, "id": "jr17", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "部下の急進的なアイデアを上司が支持するかどうかを上司側の要因から説明し、創造的な性格の上司はアイデアを脅威と受け取りにくく支持しやすいが、そうでない上司は脅威と受け取って支持しにくいことを、現場調査と実験で示した（抄録）。", "p2": "従来の研究は部下が上司の支持を得るための戦略に注目してきたが、その工夫が上司の脅威感を高めて逆効果になる可能性を見落としていた（抄録）。", "p3": "ストレスの交互作用理論（transactional theory of stress）に基づき、上司の創造的性格を「資源」とみなす。アイデアの急進性が、上司の脅威評価（threat appraisal）・挑戦評価（challenge appraisal）を通じて支持に至る間接効果が、上司の創造的性格の高低で逆向きになると予測する（抄録）。", "p4": "上司と部下167組の3時点の現場調査と、上司役の参加者300人の場面想定実験で、条件付きの間接効果を検証する（抄録）。", "p5": "創造的性格の低い上司では、急進的なアイデアほど脅威評価が高まって支持が下がる負の間接効果が見られ、高い上司では脅威評価が下がって支持が上がる正の間接効果が見られた（抄録）。実験でも、創造的性格の低い上司での負の間接効果が再現された（抄録）。挑戦評価を通じた経路は予測どおりには確認されなかったようである（抄録の記述からの解釈）。", "p6": "解釈：実験で再現されたのは負の経路のみで、正の経路の頑健性は現場データに依存する。効果量は抄録にない。", "unverified": "間接効果の大きさと、挑戦評価の経路の結果の詳細は本文未入手のため確認できなかった。"}}, {"theme": "都市・インフラ政策", "headline": "都市インフラ劣化モデルの空間検証に局所Shapley指標", "title": "A local Shapley metric for spatial validation of urban infrastructure deterioration", "url": "https://doi.org/10.1016/j.compenvurbsys.2026.102513", "authors": "Pengcheng Zhang ほか", "venue": "Computers, Environment and Urban Systems", "date": "2026-09-26", "sjr": 2.174, "rank": 18, "id": "jr18", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、都市インフラの劣化モデルの予測を空間的に検証するための局所的なShapley値の指標を提案する研究だと分かる（題名からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "イタリア全土のSentinel-1変位監視10年の総括", "title": "Sentinel-1 operational DInSAR services for surface displacements monitoring of the Italian territory through the P-SBAS processing chain: a review after 10 years of observations and data processing", "url": "https://doi.org/10.1016/j.rse.2026.115692", "authors": "F. Casu ほか", "venue": "Remote Sensing of Environment", "date": "2026-09-26", "sjr": 4.266, "rank": 19, "id": "jr19", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、Sentinel-1衛星の差分干渉SAR（DInSAR）とP-SBAS処理によるイタリア全土の地表変位監視の運用サービスについて、10年間の観測とデータ処理を振り返るレビューだと分かる（題名からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "深層強化学習で全車両のセミアクティブ懸架を制御", "title": "A twin delayed deep deterministic-based control method for a full vehicle semi-active suspension system", "url": "https://doi.org/10.1371/journal.pone.0359102", "authors": "Yongjun Wang ほか", "venue": "PLOS ONE", "date": "2026-09-25", "rank": 20, "id": "jr20", "explain": {"basis": "本文", "basis_note": "PLOS ONE掲載のPDF本文（§3路面凹凸モデル、§5シミュレーション結果の冒頭、§6結論）と抄録を読んだ。各条件の詳細な表は未確認", "preprint": false, "p1": "半能動（セミアクティブ）サスペンションを持つ7自由度の全車両モデルを、深層強化学習の一種TD3（Twin Delayed Deep Deterministic policy gradient）で制御する方法を作り、路面の凹凸と速度を変えたシミュレーションで、受動サスペンションや古典的なスカイフック制御より車体の上下加速度を小さくできることを示した（抄録、§6）。", "p2": "深層強化学習によるサスペンション制御は、全車両の高次元で非線形な動きを扱うと学習が収束しにくく、ネットワークの出力が物理的に無理な値になりがちだった（抄録）。", "p3": "左右独立の路面入力を国際規格ISO 8608の路面粗さのパワースペクトル密度（A級・B級など）から生成し、前後輪には車速に応じた時間遅れを入れる（§3、式3.1、表1）。車体の上下・ピッチ・ロールと4輪を含む7自由度モデルに対し、状態と操作量の対応づけと多目的の報酬関数で出力を物理的に制約しながら、TD3で減衰力を決める（抄録、表3）。例：A級の路面を60 km/hで走るとき、各輪の減衰力を時々刻々変えて車体の揺れを抑える。", "p4": "MATLAB/Simulinkのシミュレーションで、受動サスペンション、線形スカイフック制御、ファジー制御と、車体の上下加速度、周波数重み付きの上下加速度の二乗平均、パワースペクトル密度を比べる（抄録、§5）。", "p5": "A級路面・60 km/hで、車体の上下加速度は受動サスペンションより49.41%、スカイフックより9.33%小さく、B級路面・60 km/hではスカイフックより3.19%小さかった（抄録）。ファジー制御よりもすべての条件で周波数重み付きの加速度が低く、ばね上質量の低周波の共振も抑えた（抄録）。受動サスペンションに対する低減率は、抄録では120 km/hで24.82%、結論では主要条件で19.76〜49.41%と書かれている（抄録、§6）。", "p6": "著者は、減衰器の強い非線形のヒステリシスを学習の収束のために単純化しており、実際の減衰器を組み込んだハードウェア・イン・ザ・ループ試験と、乗り心地と消費エネルギーを両立する報酬の設計を今後の課題としている（§6）。解釈：実車での検証はなく、結果はシミュレーションに限られる。", "unverified": "受動サスペンションに対する120 km/hでの低減率が、抄録（24.82%）と結論（19.76〜49.41%の範囲）で対応しているか確認できなかった。"}}, {"headline": "営業チームの仲間への援助は成果の贈与と報酬制度で変わる", "title": "Performance gift-giving and ince tion", "date": "2026-09-26", "theme": "都市・インフラ政策", "rank": 41, "id": "jr41"}, {"headline": "初期の幸福感がへき地教員の仕事への没頭を1年支える", "title": "How early well-being sustains work engagement across a one-year placement: A longitudinal mixed-methods study of rural volunteer teachers", "url": "https://doi.org/10.1016/j.tate.2026.105834", "authors": "Xiaochen Wang ほか", "venue": "Teaching and Teacher Education", "date": "2026-09-26", "sjr": 1.779, "theme": "職場AI・組織行動", "rank": 42, "id": "jr42"}, {"headline": "配達員と家事代行に見るプラットフォーム労働とジェンダー", "title": "Practising Gender Subjectivities in Platform Work: Food Delivery Workers and House Cleaning Workers in China", "url": "https://doi.org/10.1177/09500170261468515", "authors": "Jing Wang ほか", "venue": "Work, Employment and Society", "date": "2026-09-26", "sjr": 2.204, "theme": "職場AI・組織行動", "rank": 43, "id": "jr43"}, {"theme": "LLM熟議・ペルソナ", "headline": "LLMの介入開始時点を監査可能に評価する設計", "title": "A Reproducible, Provenance-Preserving Architecture for Sequential Intervention-Threshold Evaluation in Large Language Models", "url": "https://doi.org/10.31449/inf.v50i15.15648", "authors": "Alex Kolesnikov", "venue": "Informatica", "date": "2026-09-25", "rank": 44, "id": "jr44", "explain": {"basis": "本文", "basis_note": "Informatica掲載のPDF本文（研究課題、§2.1用語、§2.4シナリオ構成、§4.4限界）と抄録を読んだ。§3結果の表は抄録の数値で確認", "preprint": false, "p1": "LLMに段階的に悪化する状況を順に示し「いつ初めて介入（ACT）を勧めるか」を測る評価を、全記録から結果データを完全に作り直せる監査可能な形にまとめ、離散時間のイベントヒストリー分析（生存時間分析）で扱えるようにした（抄録）。", "p2": "LLMの逐次的な判断の評価では、介入のタイミングを分析的に正しく、しかも提供元のモデルや配信経路が変わっても後から追跡・再構成できる形で記録する方法が確立していない（§1.1）。", "p3": "警告の兆候が段階ごとに積み重なるシナリオを固定し、各段階でそれまでの状況を含むが過去の自分の回答は含まない「状態だけの独立した呼び出し」をモデルに送り、WAIT（様子見）かACT（介入）かを答えさせる（§2.1）。最初のACTの段階をイベント、最後までACTがなければ打ち切り（censoring）として、各段階の「まだACTしていない」行をリスク集合にする。シナリオは健康5段階（A群）、健康10段階（B群）、健康以外（サイバー攻撃・金融詐欺・ガス漏れ・洪水）10段階（C群）の3群で、各8シナリオ（§2.4.2）。例：呼吸器の症状が段階ごとに悪化する話で、何段階目で受診を勧めるかを記録する。", "p4": "評価は、要因の組み合わせが全部そろっていること、預けた記録から結果ファイルとプロンプトの座標がすべて完全一致で再生成できること、各記録の出典をたどれること、段階が進むほどACTが増えるかどうか（条件付きハザードと群内のトレンド）である（§1.1）。", "p5": "13モデルで26,000の段階記録から25,999の判断有効な回答、3,120のシナリオ実行、10,088のリスク集合の行が得られ、結果ファイルと2,000のプロンプト座標は預けた記録から完全に再生成できた（抄録）。条件付きハザードは段階に依存したが単調ではなく、段階の線形トレンドのオッズ比はA群12.591、B群10.346、C群4.377だった（抄録）。ACTを含む実行の21.05%で、その後にWAITに戻る回答があった（抄録）。", "p6": "著者は、書かれた模擬シナリオであって臨床的な正しさや実際の被害防止を検証しないこと、段階の深刻さの順序を独立に検証していないこと、会話を持続させた場合との比較がないこと、英語の1つの言い回しに限ること、各条件1回の回答で確率的な安定性を推定していないことを限界に挙げている（§4.4）。再構成の検証は分析の再現性を示すもので、安定した閾値や安全性の妥当性を示すものではないとも明記している（抄録）。", "unverified": "モデル別の初回ACT段階の分布（§3の表）は確認していない。"}}, {"headline": "LLMの臨床推論を過程で評価する研究計画", "title": "Process-Oriented, Behaviorally Anchored Assessment of Clinical Reasoning in Large Language Models and the Effect of Extended Thinking: Protocol for a Prospective, Multigroup, Comparative Study", "url": "https://doi.org/10.2196/103220", "authors": "Adnan Agha ほか", "venue": "JMIR Research Protocols", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "rank": 45, "id": "jr45"}, {"headline": "エージェント型の推薦システムの定義と課題", "title": "The Future is Agentic: Definitions, Perspectives, and Open Challenges of Multi-Agent Recommender Systems", "url": "https://doi.org/10.1145/3845988", "authors": "Reza Yousefi Maragheh ほか", "venue": "ACM Transactions on Recommender Systems", "date": "2026-09-24", "theme": "LLM熟議・ペルソナ", "rank": 46, "id": "jr46"}, {"headline": "補聴器相談でLLMチャットボットを専門家と一般人が評価", "title": "Evaluation of large language model-based chatbots in hearing aid consultations: A comparative study of experts and non-experts", "url": "https://doi.org/10.1177/20552076261490211", "authors": "Yuseon Byun ほか", "venue": "DIGITAL HEALTH", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "rank": 47, "id": "jr47"}, {"headline": "ボルト接合の非線形応答をCNNで予測する代理モデル", "title": "JustAct: A Framework for Auditable Multi-Agent Systems Regulated by Inter-Organisational Policies", "url": "https://doi.org/10.46298/lmcs-22(3:9)2026", "authors": "Christopher A. Esterhuyse ほか", "venue": "Logical Methods in Computer Science", "date": "2026-09-24", "theme": "VBI・橋梁SHM", "rank": 48, "id": "jr48"}, {"headline": "断面欠損のある鋼梁の横ねじれ座屈を有限要素で解析", "title": "A finite element formulation for the elastic lateral torsional buckling analysis of steel beams with area losses", "url": "https://doi.org/10.1016/j.jobe.2026.117417", "authors": "Cao Thi Mai Huong ほか", "venue": "Journal of Building Engineering", "date": "2026-09-26", "sjr": 1.703, "theme": "VBI・橋梁SHM", "rank": 49, "id": "jr49"}, {"headline": "アコースティック・エミッションで溶接部の疲労損傷を追跡", "title": "Fatigue damage evolution of Q460C steel welded plate based on acoustic emission signals", "url": "https://doi.org/10.1016/j.tafmec.2026.105996", "authors": "Hongmei Tan ほか", "venue": "Theoretical and Applied Fracture Mechanics", "date": "2026-09-26", "sjr": 1.317, "theme": "VBI・橋梁SHM", "rank": 50, "id": "jr50"}], "jnl_notable": [{"field": "経済学", "headline": "都市の有色人種の生徒を郊外の学校へ通わせる効果", "title": "Busing to Opportunity? The Impacts of the METCO Voluntary School Desegregation Program on Urban Students of Color", "url": "https://doi.org/10.1093/qje/qjag043", "authors": "Elizabeth Setren", "venue": "The Quarterly Journal of Economics", "sjr": 33.069, "date": "2026-09-26", "why": "50年以上続くボストンの任意の学校統合プログラムが生徒の成果に与えた効果を推定し、学校割り当て政策による機会の拡大と人種・経済的統合の議論に証拠を与える。", "rank": 1, "id": "jn01", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに新たに登録された抄録を使用（Semantic Scholarで所在が分かったPDFは取得できず）", "preprint": false, "p1": "ボストンの有色人種の生徒を郊外の成績の高い学校へバスで通わせる任意の学校統合プログラム（METCO）について、通学の機会を得た生徒は、テストの成績、高校卒業、大学進学・卒業、成人後の所得がいずれも上がったことを、入学の申し出の有無を使った推定で示した（抄録）。", "p2": "学校の割り当て政策は、成績の高い学校への機会を広げ、人種と社会経済的な統合を進める重要な手段だが、郊外の学校に通うこと自体の因果効果は、誰が応募し選ばれるかの偏りのため測りにくい（抄録）。METCOは50年以上続いている。", "p3": "入学の申し出を受けた応募者と受けなかった応募者を比べ、待機リストの優先順位を操作変数とする二段階最小二乗法（2SLS）で、郊外の学校に通う効果を推定する。出生記録と応募データの豊富な属性を統制する（抄録）。例：同じ時期に応募した生徒のうち、待機リストの順位の違いで申し出を受けた生徒と受けなかった生徒を比べる。", "p4": "結果は数学・英語のテストの成績、中退、期限内の高校卒業、4年制大学への進学希望・入学・卒業、成人後の所得で、親の学歴や性別による違い、学校の付加価値・同級生・進学文化などの経路も調べる（抄録）。", "p5": "郊外の学校に通うと、数学と英語の成績が上がり、中退が減り、期限内の高校卒業が増え、4年制大学への進学希望・入学・卒業と成人後の所得も増えた（抄録）。効果は親が大学に行っていない生徒と男子で最も大きかった。参加者は下位の授業クラスに振り分けられやすく、上級の授業を受けられれば効果はさらに大きかった可能性がある（抄録）。効果の大きさの数値は抄録にない（未確認）。", "p6": "解釈：推定されるのは申し出によって通学が変わった生徒（遵守者）についての効果で、全応募者の平均効果とは限らない。1つの都市圏のプログラムの結果である。", "unverified": "効果の大きさ（得点の標準偏差、所得の増加率など）と、待機リストの優先順位が外生的とみなせる根拠は本文未入手のため確認できなかった。"}}, {"field": "経済学", "headline": "家庭の節水診断は効くのか：4.5万世帯の実験", "title": "Do Water Audits Work?", "url": "https://doi.org/10.1093/ej/ueag124", "authors": "Jesper Akesson ほか", "venue": "Economic Journal", "sjr": 5.181, "date": "2026-09-26", "why": "英国で約4万5千世帯を無作為に割り付けた自然実験で、家庭向けの節水診断の効果・持続性・厚生への影響を検証し、水資源政策に因果的な証拠を与える。", "rank": 2, "id": "jn02", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに新たに登録された抄録を使用（Semantic Scholarで所在が分かったPDFは取得できず）", "preprint": false, "p1": "英国の約45,000世帯を無作為に割り付けた自然の現場実験で、オンラインの家庭向け節水診断（water audit）に金銭的誘因を付けると、受診が増え直後の水使用が大きく減るものの、効果は約2か月で消え、厚生の利益は小さいことを示した（抄録）。", "p2": "水道事業者は家庭の節水診断を節水策として使うことに関心を強めているが、その効果、持続性、厚生への影響についての因果的な証拠は限られていた（抄録）。", "p3": "英国の水道事業者の顧客約45,000世帯を、オンラインの節水診断を受けるよう促す異なる働きかけ（金銭的誘因の有無・大きさなど）に無作為に割り付ける（抄録）。働きかけによって診断を受けた世帯（遵守者：compliers）の水使用の変化を推定する。例：誘因を示された世帯のうち診断を受けた世帯で、その後の使用量がどれだけ減ったかを見る。", "p4": "診断の受診率、遵守者の水使用量の変化とその持続期間、1人あたりの純便益（厚生）、使用量の多い世帯に絞った場合の効果を評価する（抄録）。", "p5": "金銭的誘因は受診を大きく増やし、遵守者の水使用は2か月間で約17%減った（抄録）。誘因の額は受診率には効いたが、節水の大きさには効かなかった。節水効果は急速に弱まり、約2か月後には検出できなくなったため、1人あたりの純便益は幅広い仮定の下で通常1ポンド未満だった（抄録）。使用量の多い世帯に絞ると短期の節水効果はおよそ2倍になったが、持続しないため大きな厚生の利益にはならなかった（抄録）。", "p6": "著者は、節水診断と誘因の政策的な価値は効果が持続するかどうかに決定的に依存すると結論している（抄録）。解釈：オンライン診断という形式と英国の料金制度の下での結果で、訪問型の診断や他国への一般化には注意が要る。", "unverified": "働きかけの各群の内容と受診率、厚生計算の仮定の詳細は本文未入手のため確認できなかった。"}}, {"field": "経済学", "headline": "米国の対中関税の一部は中国企業が値下げで負担", "title": "Reconciling Aggregate And Firm-Level Tariff Pass-Through: Evidence From The 2018–2019 Us Tariffs On China", "url": "https://doi.org/10.1093/ej/ueag118", "authors": "Haichao Fan ほか", "venue": "Economic Journal", "sjr": 5.181, "date": "2026-09-25", "why": "製品単位では関税が完全に価格に転嫁されたとする先行研究に対し、企業単位の税関データで中国企業が関税抜き価格を下げていたことを示し、関税の負担者をめぐる理解を改める。", "rank": 3, "id": "jn03", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、候補一覧に載った抄録の冒頭部分（約400字）のみを使用", "preprint": false, "p1": "2018〜2019年の米中貿易戦争で、製品単位では関税が米国の輸入価格に完全に転嫁されたとする先行研究に対し、企業単位の税関データで中国企業が関税抜きの輸出価格を下げていた（不完全な転嫁）ことを示した（抄録冒頭）。", "p2": "先行研究は製品単位のデータで関税の完全な転嫁を見いだしており、関税の負担を米国の輸入者・消費者が負ったと解釈されてきた。集計の水準と企業の水準の結果の食い違いを調整する必要がある（抄録冒頭）。", "p3": "中国企業の企業単位の税関データを使い、米国の関税の引き上げに対する関税抜き価格の反応を推定する（抄録冒頭）。詳細な推定方法は未確認。", "p4": "未確認（抄録の後半・本文を入手できず）", "p5": "関税が1ポイント上がると、中国企業の関税抜きの価格は0.172%下がった（抄録冒頭）。以降の結果（集計との調整の仕組み）は未確認。", "p6": "未確認（抄録の後半・本文を入手できず）", "unverified": "集計水準の結果と企業水準の結果をどう調整したか、推定の頑健性は確認できなかった。"}}, {"headline": "ネイマンの無作為化実験の推測を現代的に整理", "title": "Neymanian inference in randomized experiments", "url": "https://doi.org/10.1515/jci-2025-0037", "authors": "Ambarish Chattopadhyay ほか", "venue": "Journal of Causal Inference", "date": "2026-09-24", "field": "因果推論", "why": "1923年のネイマンの分散推定の問題から出発し、無作為化実験での設計に基づく推測を体系的に論じ、実験データの分析の基礎を示す。", "rank": 4, "id": "jn04"}, {"headline": "透明性規制の直接効果と間接効果を分ける", "title": "Direct and Indirect Effects of Transparency Regulation", "url": "https://doi.org/10.1016/j.jacceco.2026.101950", "authors": "Matthias Breuer ほか", "venue": "Journal of Accounting and Economics", "date": "2026-09-24", "field": "経営学", "why": "透明性規制の効果を、規制対象への直接効果と周囲への間接効果に分けて評価する研究で、開示規制の評価の方法に関わる。", "rank": 5, "id": "jn05"}, {"headline": "年長で人脈の厚い研究者と若く創造的な研究者、どちらが新説を広めるか", "title": "Old and connected versus young and creative: Networks and the diffusion of new scientific ideas", "url": "https://doi.org/10.1016/j.respol.2026.105628", "authors": "Wei Cheng ほか", "venue": "Research Policy", "date": "2026-09-24", "field": "経営学", "why": "科学のネットワークの中で新しいアイデアが誰を通じて広がるかを扱い、知識の普及とイノベーション政策に示唆を与える。", "rank": 6, "id": "jn06"}, {"headline": "居住地の分離が黒人女性の妊娠しやすさに影響", "title": "Residential Segregation and Fecundability in the Black Women’s Health Study", "url": "https://doi.org/10.1093/aje/kwag229", "authors": "Chen Sheng ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-25", "field": "因果推論", "why": "居住地の人種分離が黒人女性の受胎能（妊娠しやすさ）に与える影響を大規模コホートで調べ、構造的な不平等と健康の研究に証拠を加える。", "rank": 7, "id": "jn07"}, {"headline": "近隣の構造的人種差別を測り出生の格差を理解する", "title": "Beyond poverty and education: measuring structural racism in neighborhoods to understand racialized birth outcome disparities", "url": "https://doi.org/10.1093/aje/kwag193", "authors": "Brittney Francis ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-25", "field": "因果推論", "why": "貧困や教育を超えて近隣の構造的人種差別を測る指標を作り、人種による出生の結果の格差の理解を深める。", "rank": 8, "id": "jn08"}, {"headline": "アロスタティック負荷を3要素の得点に改良し死亡を予測", "title": "Refining Allostatic Load Measurement: Mortality Associations of an Empirically Derived Three-Component Score in the Women’s Health Initiative", "url": "https://doi.org/10.1093/aje/kwag240", "authors": "Christine Alison Cirovic ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-25", "field": "因果推論", "why": "慢性ストレスによる生理的な乱れの指標（アロスタティック負荷）を実証的に3要素に整理し、死亡との関連を示して測定を改善する。", "rank": 9, "id": "jn09"}, {"field": "経済学", "headline": "マクロ運用型債券ファンドが示す金融政策の転換", "title": "What can macro-active bond funds tell us about monetary policy change?", "url": "https://doi.org/10.1016/j.jfineco.2026.104378", "authors": "Claire Yurong Hong ほか", "venue": "Journal of Financial Economics", "date": "2026-09-26", "why": "債券ファンドの運用行動から金融政策の変化に対する市場の読みを取り出す試みで、最上位の金融誌に掲載された。", "sjr": 18.748, "rank": 10, "id": "jn10", "explain": {"basis": "題名", "basis_note": "出版社サイトは取得できず、Crossrefにも抄録の登録がなかった", "preprint": false, "p1": "題名からは、マクロ経済の見通しに基づいて積極的に運用する債券ファンドの行動から、金融政策の変化について何が読み取れるかを調べる研究だと分かる（題名からの情報）。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外の情報（データ、手法、結果）はすべて確認できなかった。"}}, {"headline": "内在次元を測る普遍的な最近傍推定量", "title": "A Universal Nearest-Neighbor Estimator for Intrinsic Dimensionality", "url": "https://doi.org/10.1109/tpami.2026.3734737", "authors": "Eng-Jon Ong ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "データの内在次元（本質的な自由度）を推定する普遍的な最近傍法を提案し、次元削減や表現学習の基礎的な道具を改良する。", "rank": 11, "id": "jn11"}, {"headline": "時間方向の低ランク性で大規模言語モデルの微調整を省メモリ化", "title": "TeZO: Empowering the Low-Rankness on the Temporal Dimension in the Zeroth-Order Optimization for Fine-Tuning LLMs", "url": "https://doi.org/10.1109/tpami.2026.3734392", "authors": "Yan Sun ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "勾配を使わないゼロ次最適化でLLMを微調整する際に、時間方向の低ランク性を使ってメモリと計算を減らす。", "rank": 12, "id": "jn12"}, {"headline": "連合学習で勾配から入力を復元する新たな攻撃", "title": "Beyond Gradient Inversion: Hidden Subset Sum Problem-Based Input Reconstruction for Federated Learning", "url": "https://doi.org/10.1109/tpami.2026.3735649", "authors": "Qiongxiu Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "連合学習で共有される情報から学習データを復元できることを部分和問題として示し、プライバシー保護の前提を問い直す。", "rank": 13, "id": "jn13"}, {"field": "腫瘍学", "headline": "腫瘍変異量の多さが脳転移と関連", "title": "Association of high tumor mutational burden with brain metastases: Insights from a large-scale database analysis", "url": "https://doi.org/10.1093/neuonc/noag222", "authors": "Marana Abboud ほか", "venue": "Neuro-Oncology", "date": "2026-09-26", "why": "がんの種類を越えて脳転移に共通する分子的特徴を大規模ゲノムデータで探り、脳転移リスクの層別化につながりうる。", "sjr": 5.249, "rank": 14, "id": "jn14", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "150,486の腫瘍検体のゲノムデータから、がんの種類を問わず脳転移に共通する分子的特徴として、腫瘍変異量の多さ（TMB-high）とTP53・KRASの変化を見いだし、種類ごとの特徴（メラノーマのTERTなど）も整理した（抄録）。", "p2": "脳転移はがん死の大きな原因で、脳に定着するには特有の適応が必要と考えられるが、元のがんの種類を越えて共通する分子的特徴があるかは分かっていなかった（抄録）。", "p3": "非小細胞肺がん、大腸がん、乳がん、食道がん、メラノーマ、神経内分泌腫瘍の6種類について、脳転移4,538検体、脳以外の転移43,844検体、原発巣などの局所生検71,738検体を含む150,486検体のゲノム変化、経路の濃縮、TMB-high、マイクロサテライト不安定性の高さ（MSI-H）を比べる（抄録）。", "p4": "3群（脳転移・脳以外の転移・局所生検）の間で、各ゲノム変化とTMB・MSI-Hの頻度、経路ごとの変化の頻度を比較する（抄録）。", "p5": "脳転移は、調べたすべてのがん種で局所生検と脳以外の転移よりTMB-highが多く、TMBの中央値も高かった（抄録）。TMB-highと関連の深いMSI-Hは脳転移で有意に多くなかった。TP53の変化は複数のがん種の脳転移で一貫して多く、KRAS変異は肺がんと大腸がんの脳転移で、TERTの変化はメラノーマの脳転移で多かった（抄録）。経路では、ERK-MAPK経路と、より弱くDNA損傷応答経路の変化が多かった。", "p6": "解釈：検査のために集まった検体の横断比較で、同じ患者の原発巣と転移巣を対にした比較かどうかは抄録からは分からない。治療歴（治療で変異が増える可能性）の影響も未確認。", "unverified": "各がん種の頻度の具体的な値と、多重比較の扱いは本文未入手のため確認できなかった。"}}, {"field": "電気化学・エネルギー", "headline": "ヘマタイト光電極の酸素選択性は反応次数で決まる", "title": "Linking Oxygen Evolution Selectivity to Water Oxidation Reaction Order on Hematite Photoanodes by Operando Photoelectrochemical Mass Spectrometry", "url": "https://doi.org/10.1021/jacs.6c11949", "authors": "Daniele Benetti ほか", "venue": "Journal of the American Chemical Society", "date": "2026-09-26", "why": "水の酸化が常に酸素を生むという前提を実測で問い直し、表面正孔密度と生成物の選択性を結びつけた。", "sjr": 5.491, "rank": 15, "id": "jn15", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ヘマタイト（酸化鉄）光電極の水の酸化で、表面の正孔（ホール）が少ないときは酸素がほとんど生じず、正孔が多く複数の正孔が協同して反応するときに初めて酸素が選択的に生じることを、動作中の酸素検出で示した（抄録）。", "p2": "金属酸化物の（光）電極での水の酸化は酸素分子を生むと仮定されることが多いが、実際の生成物の選択性と反応速度の関係は確かめられていなかった（抄録）。", "p3": "動作中（operando）の光電気化学質量分析で酸素を直接検出し、分光電気化学による速度則の解析（表面正孔密度に対する反応次数）と組み合わせる（抄録）。", "p4": "表面正孔密度に対する、酸素生成のファラデー効率（流れた電荷のうち酸素生成に使われた割合）と反応次数の変化を見る。暗所の電気化学条件でも同じ挙動かを確かめる（抄録）。", "p5": "電流と正孔密度が低く1次の反応速度が支配的な領域では、酸素生成のファラデー効率はほぼゼロで、孤立した1つの正孔による水の酸化は酸素分子の生成にほとんどつながらなかった（抄録）。正孔密度が上がると酸素のファラデー効率は急に高まり、協同的な3次の反応への切り替わりが酸素生成への選択性の切り替わりでもあることが分かった（抄録）。暗所でも同じ挙動だった。", "p6": "著者は、この多正孔の化学は半導体の金属酸化物に一般的な特徴である可能性が高いと述べる（抄録）。解釈：酸素以外に何が生じているか（過酸化水素など）は抄録からは分からない。", "unverified": "酸素以外の生成物の同定と、ファラデー効率の具体的な値は本文未入手のため確認できなかった。"}}, {"headline": "拡散モデルの事前分布で気づかれにくい敵対的攻撃", "title": "A Diffusion Prior-based Framework for Imperceptible and Flexible Unrestricted Adversarial Attacks", "url": "https://doi.org/10.1109/tpami.2026.3736884", "authors": "Zhengzhao Pan ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "拡散モデルを使い、知覚されにくく制約の少ない敵対的な例を作る枠組みで、画像認識の頑健性評価に関わる。", "rank": 16, "id": "jn16"}, {"headline": "グラフの多様な分布シフトに強い重み付け学習", "title": "Generalizing on Diverse Shifts: A Unified Topology-Aware Reweighting Algorithm for Graphs", "url": "https://doi.org/10.1109/tpami.2026.3734476", "authors": "Jiaxing Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "グラフデータの多様な分布の変化に対し、構造を考慮した重み付けで汎化を高める統一的な手法を提案する。", "rank": 17, "id": "jn17"}, {"headline": "対話で個人の基準に合わせるクラスタリング", "title": "Interactive Personalized Clustering: Navigating beyond Rigid Criteria and Sample Ambiguity", "url": "https://doi.org/10.1109/tpami.2026.3737483", "authors": "Honglin Liu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "固定の基準に縛られず、利用者との対話で個人の基準に合わせて分類を調整するクラスタリングを提案する。", "rank": 18, "id": "jn18"}, {"headline": "3次元の理解と生成を統合した運転の世界モデル", "title": "Hermes++: Toward a Unified Driving World Model for 3D Scene Understanding and Generation", "url": "https://doi.org/10.1109/tpami.2026.3735606", "authors": "Xin Zhou ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "自動運転のための3次元の場面理解と未来の生成を一つの世界モデルで扱う枠組みを示す。", "rank": 19, "id": "jn19"}, {"headline": "事前学習モデルと規則の誘導で知識グラフを多段推論", "title": "Multi-Hop Knowledge Graph Reasoning with Pre-trained Models and Continuous Rule Guidance", "url": "https://doi.org/10.1109/tpami.2026.3734451", "authors": "Weidong Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "事前学習済みモデルと連続的な規則の誘導を組み合わせ、知識グラフ上の多段の推論を改善する。", "rank": 20, "id": "jn20"}, {"headline": "カルマン化した逐次最小二乗注意で流れる動画を理解", "title": "Kalmanized Recursive Least Squares Attention for Streaming Video Understanding", "url": "https://doi.org/10.1109/tpami.2026.3734826", "authors": "Matthew Korban ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "カルマンフィルタの考え方を取り入れた注意機構で、ストリーミング動画の理解を効率化する。", "rank": 21, "id": "jn21"}, {"headline": "微分可能な遺伝的プログラミングで高次元の数式を発見", "title": "Differentiable Genetic Programming for High-dimensional Symbolic Regression", "url": "https://doi.org/10.1109/tpami.2026.3734437", "authors": "Xiaotian Song ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "遺伝的プログラミングを微分可能にし、高次元での記号回帰（数式の発見）を可能にする。", "rank": 22, "id": "jn22"}, {"headline": "任意の脳図譜に対応する多視点の脳ネットワーク基盤モデル", "title": "Toward a Multi-View Brain Network Foundation Model: Cross-View Consistency Learning across Arbitrary Atlases", "url": "https://doi.org/10.1109/tpami.2026.3736359", "authors": "Jiaxing Xu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-24", "sjr": 4.829, "field": "機械学習", "why": "異なる脳図譜の間で一貫した表現を学ぶ脳ネットワークの基盤モデルを提案し、神経画像の解析を統一する。", "rank": 23, "id": "jn23"}, {"headline": "複数の参照画像で制御する高品質な着せ替え生成", "title": "MMTryon: Multi-Modal Multi-Reference Control for High-Quality Fashion Generation", "url": "https://doi.org/10.1109/tpami.2026.3729775", "authors": "Xujie Zhang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-25", "sjr": 4.829, "field": "機械学習", "why": "複数のモダリティと参照画像で制御できる高品質なファッション画像の生成を示す。", "rank": 24, "id": "jn24"}, {"field": "電池材料", "headline": "化学的脱リチウムで全固体電池の正極界面を安定化", "title": "Chemical-Delithiation-Induced Surface Reconstruction in Layered Oxide Cathodes for High-Performance All-Solid-State Batteries", "url": "https://doi.org/10.1021/jacs.6c11457", "authors": "Yijun Song ほか", "venue": "Journal of the American Chemical Society", "date": "2026-09-26", "why": "高電圧で劣化しやすい全固体電池の正極／固体電解質界面を表面再構成で安定化する方法で、高エネルギー密度電池の実用化課題に取り組む。", "sjr": 5.491, "rank": 25, "id": "jn25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "全固体電池の高容量正極（リチウム過剰層状酸化物）の表面を化学的な脱リチウム処理で作り替え、高電圧での正極と固体電解質の界面の化学的劣化をなくし、1C・1,500サイクルで82.3%の容量維持を得た（抄録）。", "p2": "ニッケル過剰やリチウム過剰の層状酸化物を使う全固体電池は高エネルギー密度と安全性が期待されるが、高電圧で正極と固体電解質の相互作用が強まり、界面が化学的に劣化する（抄録）。", "p3": "NO2BF4による化学的な脱リチウム処理で、リチウム過剰層状酸化物の表面を再構成し、陽イオンが無秩序化した表面下層を作り、そこにフッ素を取り込む（抄録）。高電位で酸素のレドックスが起こる酸化的な表面を不活性化することで、界面劣化を防ぐ。", "p4": "可逆容量と、1Cでの長期サイクルの容量維持率で評価し、同じ手法をニッケル過剰層状酸化物にも当てはめて一般性を確かめる（抄録）。", "p5": "処理したリチウム過剰正極は約300.3 mA h g⁻¹の可逆容量で液系電池と同程度となり、1Cで1,500サイクル後に82.3%の容量を維持した（抄録）。ニッケル過剰層状酸化物への拡張でも有効性を示した（抄録）。", "p6": "解釈：実験室の小型セルでの結果で、実用的な電極の厚さや圧力条件での性能は抄録からは分からない。処理試薬の扱いやすさやコストも未確認。", "unverified": "比較対象（未処理正極）の容量維持率と、試験時の温度・圧力条件は本文未入手のため確認できなかった。"}}, {"field": "電気化学・エネルギー", "headline": "電解アンモニア合成のエネルギーを全セルで評価", "title": "Rethinking Metal-Mediated Electrochemical Ammonia Synthesis through Full-Cell Thermodynamics", "url": "https://doi.org/10.1021/acsenergylett.6c02240", "authors": "Victor Azumah ほか", "venue": "ACS Energy Letters", "date": "2026-09-26", "why": "陰極側だけの評価で見えにくかった金属介在型アンモニア電解合成の総エネルギーを全セルの熱力学で示し、技術比較の基準を与える。", "sjr": 5.783, "rank": 26, "id": "jn26", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "リチウムなどの金属を介した電気化学的なアンモニア合成について、陰極側だけの計算で見えにくかった全体のエネルギー費用を、全セルの熱力学で分解して下限を示し、より低エネルギーな経路の設計図を示した（抄録）。", "p2": "金属を介して窒素を解離させる電気化学的な窒素還元は、穏やかな条件で高い選択性が得られるが、陰極だけの収支で評価されることが多く、エネルギー費用が過小に見積もられがちだった（抄録）。", "p3": "反応のサイクルを、①媒介金属の生成、②窒素の取り込み（窒化物の形成）、③プロトン化の3段階に分け、全セルの熱力学で必要な電気的仕事の下限を求める（抄録）。例：リチウムを電気で作り、そのリチウムが窒素と反応して窒化リチウムになり、それにプロトンを与えてアンモニアにする。", "p4": "アンモニア1分子あたりの可逆的な電気的仕事の下限を、媒介金属の種類ごとに比べ、実用上の目安と照らす（抄録）。", "p5": "窒素の取り込みとプロトン化を下り坂（自発的）にすると、電気的仕事の下限は媒介金属の平衡電位で決まる（抄録）。リチウム媒介では、陰極でのリチウム生成だけでアンモニア1分子あたり約9.12 eVの下限があり、陽極の水の酸化を含めた全セルではさらに高くなる。Li・Ca・Mgのような還元力の強い媒介金属は、実用上のエネルギーの目安を超えた（抄録）。", "p6": "著者は、電解質による電位のずらし、合金や挿入による緩衝、電気化学的な窒化、窒化物を経ない中間体を、より低エネルギーの経路の候補として挙げている（抄録）。解釈：熱力学的な下限の議論であり、実際の過電圧や副反応による損失は別に加わる。", "unverified": "他の媒介金属の具体的な下限値は本文未入手のため確認できなかった。"}}, {"field": "太陽電池材料", "headline": "4000分子の計算スクリーニングで有機太陽電池材料を探索", "title": "Descriptor‐Guided Computational Screening of Non‐Fullerene Acceptor Cores for Organic Solar Cells", "url": "https://doi.org/10.1002/aenm.71601", "authors": "Kun‐Han Lin ほか", "venue": "Advanced Energy Materials", "date": "2026-09-26", "why": "膨大な組合せのある非フラーレン受容体を記述子で事前選別する計算手順を示し、材料探索を効率化する。", "sjr": 7.677, "rank": 27, "id": "jn27", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "有機太陽電池の非フラーレン受容体（NFA）の候補4,000分子超を、素子の性能に関わる記述子で段階的に絞り込む計算スクリーニングの手順を作り、既知の高性能構造（Y6型など）を上位に再発見できることを示した（抄録）。", "p2": "非フラーレン受容体により有機太陽電池の効率は21%近くまで上がったが、受容体–供与体–受容体の組み合わせは膨大で、合成の前に効率よく絞り込む方法が必要だった（抄録）。", "p3": "実験報告のある部品から組み立てたA–B–(D–S)–B–A型の4,000超の分子を最適化し、①双極子モーメントが小さい、②電荷分離に適した四重極モーメント、③電子の輸送を妨げる準位がない、④界面の駆動力が十分、⑤可視光を強く吸収、⑥光起電のギャップが十分大きい、という条件で順に絞り込む（抄録）。", "p4": "一般的な高分子供与体（P3HT、PBDB-Tなど4種）ごとに上位10の候補を選び、既知の高性能構造との一致と、合成済みの参照分子の薄膜の電子・光学的性質との一致で妥当性を見る（抄録）。", "p5": "上位の候補にはY6型やO-IDTBRに似た構造など既知の高性能の型が含まれ、記述子の妥当性を支持した（抄録）。統計的な分析では、供与体の部品がイオン化エネルギーを、受容体・末端基が電子親和力を主に決め、四重極モーメントは軌道エネルギーとの相関が弱く独立に調整できる手がかりだった（抄録）。", "p6": "著者は、薄膜の性質は参照分子とよく合う一方、素子の性能には記述子による事前選別では捉えきれない膜の形態（モルフォロジー）が重要だと述べている（抄録）。", "unverified": "上位候補の具体的な分子構造と計算手法の詳細は本文未入手のため確認できなかった。"}}, {"headline": "民族・地域の非公式制度がエチオピアの起業家の資源獲得を左右", "title": "How ethnic- and community-based informal institutions shape entrepreneurial resource acquisition in Ethiopia", "url": "https://doi.org/10.1007/s11187-026-01274-9", "authors": "Yamlaksira S. Getachew ほか", "venue": "Small Business Economics", "date": "2026-09-26", "sjr": 2.618, "field": "経営学", "why": "民族や地域に根ざした非公式の制度が起業家の資源獲得をどう形づくるかを扱い、新興国の起業研究に証拠を加える。", "rank": 28, "id": "jn28"}, {"headline": "不法移民と暴力被害の関係は立場と地域の政策で異なる", "title": "Heterogeneity in the relationship between undocumented immigration and violent   }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
