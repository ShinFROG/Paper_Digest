<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 10px; font-size: 14px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

：較正の基準自体が同じ調査の項目であるため、他国・他時点・他の話題への移しやすさは未確認で、この研究は未査読のプレプリントである。", "unverified": "付録E（全セルの結果）・付録F（シード安定性）・付録G（転移項目の個別値）の数値は本文の要約以外は確認していない。"}}, {"rank": 2, "theme": "LLM熟議・ペルソナ", "headline": "LLMチームの効果は役割より視点の独立性", "title": "Perspective independence, more than personas, drives LLM teams - and where they reverse", "url": "https://doi.org/10.64898/2026.09.24.26363897", "authors": "Jun Feng ほか", "venue": "medRxiv", "date": "2026-09-26", "id": "pr02", "explain": {"basis": "本文", "basis_note": "medRxiv版の本文（結果・考察の限界・図表キャプション、表1・2）を読んだ。補足資料（Supplementary Notes・Tables）は未確認", "preprint": true, "p1": "複数のLLMに役割を与える「チーム」方式の診断が効く理由を要因分解し、効果の源は専門家ペルソナではなく、互いの出力を見ずに独立に考えさせる「視点の独立性」と司会役（moderator）による統合であること、そして実際の救急外来の入力では逆に悪化することを示した（抄録、図3）。", "p2": "マルチエージェント型のプロンプトは診断で相反する結果を出しており、利得が「専門家の役割」から来るのか「視点の独立」から来るのかが分かっていなかった（抄録、§Introduction）。", "p3": "同じモデル（qwen3.8-flash）で、①1回の直接呼び出し（A×1）、②1つの文脈の中で5つの専門家視点を順に語らせる（P）、③同じ5役を互いに見えない独立呼び出しにし、司会役が統合する（MDT、1症例6回呼び出し）を比べる。出力は鑑別診断5つの順位付きリスト（図1）。さらに「役割なしの独立サンプル5つ＋司会」と「機械的なBorda集計」を組み合わせた要因実験で、どの部分が効くかを切り分ける（図3a）。", "p4": "データはNEJMの症例検討（CPC）87例、外部の公開ベンチマークMedCaseReasoning 406例、実際の救急外来364件（ER-Reason）。評価は正解診断が上位1・3・5位に入る割合（top-k recall）で、主要評価項目は事前に決めたtop-3とtop-5。採点は臨床医2人と照合したLLM判定器（κ 0.814・0.878、医師間0.812）を使い、各条件5回の反復で症例単位のWilcoxon検定を行う（§Results冒頭、表1注）。", "p5": "外部ベンチマークでMDTは単発呼び出しよりtop-3で+3.0ポイント（72.9% 対 69.9%、p=0.0079）、top-5で+3.9ポイント（79.6% 対 75.6%）高かった（表1、図2b）。役割なしの独立サンプルに司会を付けた条件はMDTと区別できず、機械的な集計は単発以下だったため、利得は独立生成＋司会統合によると結論している（図3a）。救急外来では逆転し、top-1が単発40.1%、MDT 34.3%（p<0.0001）だった（表1）。図3bはトークン数（対数軸）と再現率の関係で、司会付き独立サンプルは単発の約6倍のトークンでtop-3を+5.3ポイント上げる。", "p6": "著者は、救急の入力が医師の判断の節より前で切られていること、判定器による誤差を完全には排除できないこと、公開済みのCPC症例をモデルが記憶している可能性、事前登録がないことと一部の対照条件が事後に追加されたことを限界として挙げている（§Discussion）。解釈：正解ラベルとの一致で測っており臨床的な妥当性は評価されていない。未査読のプレプリントである。", "unverified": "補足資料（判定器の検証詳細、温度をそろえた解析、モデル規模の比較）の数値は本文の要約以外は確認していない。"}}, {"rank": 3, "theme": "LLM熟議・ペルソナ", "headline": "ペルソナ付き生成エージェントで反実仮想の議論を作る", "title": "Persona-Conditioned Generative Agents as a Method for Studying Online Communities", "url": "https://doi.org/10.2139/ssrn.7518938", "authors": "Ishita Chakraborty ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr03", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "観測されたプロフィールから作ったペルソナ付き生成エージェントを同じ議論の文脈で順に発言させ、参加者の構成を変えたら議論がどう変わったかという観測できない反実仮想の会話を作り、実際の人間の議論と比べて検証する方法を示した（抄録）。", "p2": "オンラインの議論は、誰が参加しどう応じたかで決まる一つの実現経路しか観測できず、参加者の構成が違えば後続の参加者が見る内容も変わるため、別の構成での議論を推し量るのが難しい（抄録）。", "p3": "Redditの利用者の言語的・人口学的な特徴からペルソナを作り、エージェントが同じスレッドで順に投稿するシミュレーションを行う。参加者の抽出確率を変えて、議論の幅や話題が変わるかを試す（抄録）。例：人間のデータで少ない層の抽出確率を上げたスレッドを生成して比べる。", "p4": "エンタメ・ゲーム・人間関係・技術の4領域のRedditの議論を対象に、ペルソナなしの汎用AI、ペルソナ付きAI、実際の人間の議論を、投稿の長さ、一人称の使用、意味的多様性、感情の向きで比べる（抄録）。", "p5": "ペルソナ付きAIは汎用AIより人間の議論に有意に近いが、議論の意味的な幅は狭く、人間より肯定的な調子に偏った（抄録）。少数派の利用者を多く抽出すると話題は一部変わるものの、議論の幅は広がらず、人間の議論の多様性は再現できなかった（抄録）。具体的な数値は抄録にない（未確認）。", "p6": "著者は、人間の行動について結論を出す前に追加の検証が必要な場面があると述べている（抄録）。解釈：比較指標が文章の表面的な性質中心であり、議論の中身の妥当性の評価は抄録からは分からない。未査読のプレプリントである。", "unverified": "本文を読めておらず、使用したモデル、議論の件数、差の大きさは確認できなかった。"}}, {"rank": 4, "theme": "職場AI・組織行動", "headline": "開示文の『従業員の幸福』重視度が労働者の健康を予測", "title": "Well-Being Salience in Corporate Disclosures and Worker Health", "url": "https://doi.org/10.3386/w35760", "authors": "Riccardo Di Francesco ほか", "venue": "NBER Working Paper", "date": "-", "id": "pr04", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、主要結果§5の冒頭、結論）を読んだ。付録の頑健性分析は本文の言及のみ確認", "preprint": true, "p1": "企業が年次報告書で「従業員の幸福（well-being）」をどれほど前面に出しているかを文章から数値化し、デンマークの全人口の行政データと結ぶことで、それが従業員の病欠を増やす一方で医療の利用は変えないことを示した（抄録、§6）。", "p2": "職場が従業員の健康を左右することは分かってきたが、どの職場の特徴が効くのかは行政データに記録されず、職場文化の調査は費用がかかり規模を広げにくい（§1）。", "p3": "心理学の辞書（LIWCなど）から幸福・メンタルヘルスの参照語を決め、事前学習済みの文埋め込み（sentence embedding）で報告書の各文と参照語の意味的な近さを測り、報告書内の類似度の95パーセンタイルを企業の「幸福の顕著さ（salience）スコア」とする（§1、§3）。語調ではなく意味の近さだけを測る。これを2013〜2022年の病欠・医療利用の登録データと結び、転職者（mover）が移る前後で、移籍先と移籍元のスコア差に応じて結果がどう変わるかを見る（§1）。例：スコアの高い会社へ移った人の病欠日数が、移籍の前後でどれだけ変わるかを追う。", "p4": "転職者71,714人（684,432人年）を対象に、転職前3年・後3年のイベントスタディで、病欠（日数と有無）と、処方薬、精神科入院、心理相談、呼吸器・筋骨格の入院を比べる（§1、表3注）。移籍前に傾向の差がないこと、移籍の向きが属性と無関係なことを識別の前提として確かめる（§1）。", "p5": "移籍の1年後、スコア差が1標準偏差大きいと病欠が約0.56日（移籍前平均の約4分の1）増え、病欠する確率が約5ポイント（同約5分の1）上がった（§5、図6）。一方で医療の利用はどの指標も動かなかった（図7〜9）。図6は横軸が移籍からの年、縦軸がスコア差1単位あたりの効果で、移籍前はゼロ付近、移籍時に跳ねて定着する形を見る。増えた病欠日数の約半分は1週間を超える長期の病欠で、転職しない人（stayer）でも同じ非対称が再現された（§1）。", "p6": "著者は、病欠が増えた経路として休みを取ることへの偏見の減少、制度の情報、管理者の寛容さを挙げるが、どれかは特定していない（§6）。解釈：スコアは文章上の強調であって実際の制度や施策の測定ではなく、デンマーク以外の制度（医療が無料で転職が多い）への一般化は未確認。NBERワーキングペーパーで、査読前の版である。", "unverified": "付録（業種効果の分解、代替パーセンタイル、パンデミック前の標本）の数値は確認していない。"}}, {"rank": 5, "theme": "会計情報科学", "headline": "LLMで作る開示テキスト指標はモデル次第で変わる", "title": "Same Text, Different Numbers: The Divergence of LLM-Based Measures", "url": "https://doi.org/10.2139/ssrn.7519558", "authors": "Hamid Boustanifar ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr05", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "決算説明会の書き起こしを生成LLMで数値化した13種の指標が、使うLLMによってどれほど変わるかを測り、LLM由来の変数は「モデルに依存する測定」として複数の提供元で検証すべきことを示した（抄録）。", "p2": "企業の文書をLLMで実証用の変数に変える研究が増えているが、その変数がモデルの選び方に左右されないかは確かめられていなかった（抄録）。", "p3": "異なる提供元の7つのLLMに、S&P 500企業の決算説明会の書き起こしを、感情（sentiment）、経営者の説明の明確さ、不確実性、回答の具体性、気候リスク・政治リスクなど13の概念で採点させ、モデル間の一致と、下流の回帰分析の結果がどう変わるかを調べる（抄録）。", "p4": "モデル間の順位相関、書き起こし単位の共通成分が全体の分散に占める割合、モデル間の不一致がその後のアナリストや市場の意見の不一致を予測するか、回帰係数の大きさ・符号・有意性の変化で評価する（抄録）。", "p5": "モデル間の順位相関は平均0.52にとどまり、提供元に共通する書き起こし間の差は全体の分散の34%しか説明しなかった（抄録）。モデル間の不一致はその後のアナリスト・市場の不一致を予測せず、文書そのものの曖昧さではなくモデル固有の成分が大きいと解釈している。回帰係数の大きさ・符号・有意性もモデルによって大きく変わった（抄録）。", "p6": "著者は、複数の提供元で平均すると多くの指標で順位は安定するが、得点の水準はどのモデルを含めるかに依存し続けると述べる（抄録）。解釈：プロンプトの書き方や温度などの設定の違いがどこまで寄与するかは抄録からは分からない。未査読のプレプリントである。", "unverified": "使用した7モデルの名称、プロンプト、期間、各指標ごとの相関は本文未入手のため確認できなかった。"}}, {"rank": 6, "theme": "LLM熟議・ペルソナ", "headline": "LLMの政治的立場を141か国の人々の分布上に置く", "title": "Locating LLM Expressed Ideology in the Global Distribution of Political Attitudes", "url": "https://doi.org/10.2139/ssrn.7522318", "authors": "Aaron Russell Kaufman ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr06", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "141か国114万人の調査回答で推定して固定した項目パラメータ上に65のLLMを置くことで、LLMが表明する政治的立場を一国の標本ではなく世界の人々の分布に対して測れるようにした（抄録）。", "p2": "LLMの回答が左に寄るという懸念の根拠はほとんどが一国（多くは米国）の回答者との比較で、モデルの位置と標本の位置が混ざってしまう（抄録）。", "p3": "国際比較調査の1,153項目を、27社の65モデルに温度0・ペルソナなしで答えさせ、人間の回答から推定した項目パラメータ（項目反応理論の考え方）で、社会的リベラル度、経済の左右、民主主義への支持、反エリート感情の4つの潜在次元の得点にする（抄録）。測っているのはモデルが問われて述べる「表明された立場」であって、モデルが何かを信じているという主張ではない。", "p4": "世界の人間の中央値に対するモデルの位置（百分位）、モデル間のばらつきと人間のばらつきの比、どの調査プログラムの項目を使うかで位置がどれだけ動くかで評価する（抄録）。", "p5": "65モデルはすべて社会的リベラル度で世界の人間の中央値よりリベラル側にあり、中央のモデルは31パーセンタイルに位置した（抄録）。モデル間のばらつきは各次元で人間の標準偏差の11〜33%にとどまり、モデル同士は人間同士よりずっと似ていた。項目の出どころを変えるとモデルの位置は人間の標準偏差の0.28〜0.62だけ動き、国の位置の変化の2〜4倍近くになった（抄録）。", "p6": "著者は、リベラル寄りという向きは尺度を変えても頑健だが、その大きさはモデルと質問票の組み合わせの性質だと述べている（抄録）。解釈：ペルソナなしの既定の回答を測っており、ペルソナを与えた合成回答者の偏りは別に検証が要る。未査読のプレプリントである。", "unverified": "本文を読めておらず、モデルごとの位置や言語の影響は確認できなかった。"}}, {"rank": 7, "theme": "LLM熟議・ペルソナ", "headline": "LLMアノテーションの高一致は正確さを保証しない", "title": "Agreement Without Accuracy: Six Systematic Defects an LLM Annotation Study Could Not See in Its Own Reliability Statistics", "url": "https://doi.org/10.31235/osf.io/n3zhf_v1", "authors": "Hon-Ren Lin", "venue": "SocArXiv", "date": "2026-09-26", "id": "pr07", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（方法、結果の信頼性統計・出現率の節、6つの欠陥の一覧、限界）と表1〜5のキャプションを読んだ", "preprint": true, "p1": "LLMを注釈者（annotator）として使う研究で、同じ設定での再実行一致率などの信頼性統計が高くても、系統的な誤りを見落とし得ることを自らの研究の失敗例で具体的に示し、コードごとの出現率比較と、出力を見る前の盲検読みが最低限の点検だと主張した（抄録、§Limitations）。", "p2": "LLM注釈の信頼性の証拠として、固定シード・温度0での再実行の一致（test–retest agreement）が安価なためよく使われるが、それが正確さを保証するかは確かめられていない（抄録、§Introduction）。", "p3": "台湾の職業系プログラミング授業の学生51人が書いたUMLクラス仕様1,902件を、参照仕様と照合して誤りコードを付ける課題で、①元の単一段階プロンプト（v1）、②コード定義を検査可能な条件に書き直した版（v1+）、③3段階に分けたパイプライン（v2：対応表作成→対ごとの判定→階層の読み取り）を各2回実行して比べる（§Method、表1）。", "p4": "信頼性は、2回の実行間の回答単位の完全一致率、コードごとの偶然補正一致（κ）、内部整合性で見る。正確さの手がかりとしては、条件間のコード出現率の比較と、出力を見る前に行った40件の盲検読み（階層宣言の有無の下位コードのみ）を使う（§Method、表4）。", "p5": "3段階化で回答単位の一致率は0.647から0.845へ上がり（表2）、どのコードでもκが上がった。しかし条件間でコード出現率が3倍以上動くものがあり（表3）、出力を調べると、与えていない入力を前提にした指示でフラグの64.7%が誤りだったのにκは0.971だった、など5つの系統的欠陥が見つかった（抄録、表5）。さらに自分たちの点検ルールは盲検読みと67.5%しか一致しなかった（抄録）。盲検読みの基準では、報告した修正が効いたとは示せなかった（抄録）。", "p6": "著者は、1つのパイプライン・1課題・1モデルの事例報告で欠陥の頻度は言えないこと、盲検読みは1人・40件・1下位コードに限られること、v1だけ実行日が1週間ずれていること、正解データがないため通常の意味での正確さは評価していないことを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "補足資料（コード表・プロンプト）は確認していない。表3の各コードの出現率の数値は一部のみ確認。"}}, {"rank": 8, "theme": "VBI・橋梁SHM", "headline": "InSARとPINNで都市の大空間構造物を一斉監視", "title": "Urban-Scale Monitoring of Large-Span Spatial Structures Using MT-InSAR: From Physics-Informed Deformation Reconstruction to Graph-Based Regional Risk Screening", "url": "https://doi.org/10.2139/ssrn.7528614", "authors": "Shiqi Zhu ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr08", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "衛星の干渉SAR（MT-InSAR）で得た長期の変位を、有限要素モデルの温度応答を弱い物理的事前情報とするPINNで再構成し、近傍グラフで集約することで、都市全域の大空間構造物（体育館・駅舎の屋根など）の危険候補を一度に洗い出す枠組みを示した（抄録）。", "p2": "大空間構造物は都市に多数あり形式も多様で、密なセンサ配置による従来の監視は設置・維持の費用がかさみ、地域全体のリスク選別が難しい（抄録）。", "p3": "①温度応答に合わせた恒久散乱体（PS/準PS）の同時逆解析で変位時系列を得る。②FEMで予測した温度応答をInSARの観測と空間・時間で照らし、支点の鉛直変位と温度差の回帰から「温度感度の区間」を作り、PINN（物理の知識を損失関数に入れたニューラルネット）の弱い事前情報にする。③再構成した特徴をK近傍グラフの節点に集め、重み付き近傍集約と候補マスクで危険度を判定し、点単位に戻す（抄録）。", "p4": "長沙市の約40 km×40 kmの範囲に適用し、候補節点の警告・危険の分類と、代表的な構造物の現地点検の結果で妥当性を確かめる（抄録）。", "p5": "2,079の候補節点から312の警告（Warning）と104の危険（Danger）節点を特定し、代表的な大空間構造物の現地点検で局所的な劣化が見つかった（抄録）。", "p6": "解釈：現地点検は代表的な1構造物にとどまるようで、見逃し・誤検出の割合（検出性能）は抄録からは分からない。温度以外の荷重や季節変動の扱いも未確認。未査読のプレプリントである。", "unverified": "本文を読めておらず、PINNの構成、使った衛星データの期間、判定のしきい値は確認できなかった。"}}, {"rank": 9, "theme": "VBI・橋梁SHM", "headline": "運動学だけから接触力を推定する統一逆動力学", "title": "A Unified Framework for Indirect Measurement of Human Ground Reaction Forces from Kinematics under Varying Contact Topologies", "url": "https://doi.org/10.2139/ssrn.7519307", "authors": "Jingtao Li ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr09", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "床反力計（force plate）を使わずに、人の動き（運動学の計測）だけから地面反力（GRF）と圧力中心を推定する、接触状態が変わっても使える物理的に一貫した逆動力学の枠組みを示した（抄録）。", "p2": "接触条件が変わる多体系の接触力の同定は難しく、床反力計は設置場所が限られ、複雑な歩行中の連続測定ができない（抄録）。特に両足が接地する時期は力の配分が静的に不定になる。", "p3": "人体を18剛体・33自由度の開いた鎖の多体系とし、スクリュー理論とダランベールの原理で全体の動的つり合いを立てる。両脚支持期の不定な配分は、圧力中心が連続的に動くことと反力モーメントが減衰していくことを物理的な制約として加え、最小ノルムの最小二乗解として一意に決める（抄録）。例：階段を上るとき、左右の足にかかる力の分け方を、圧力中心の滑らかな移動を条件に決める。", "p4": "平地歩行と階段上りで床反力計の実測と比べ、さらに公開の運動学データから5つの移動様式の鉛直反力と圧力中心を再構成し、それを使った歩行様式の識別精度で情報が保たれているかを見る（抄録）。", "p5": "再構成した反力は床反力計の値とよく一致し（具体的な誤差は抄録に記載なし・未確認）、再構成信号による歩行様式の識別は独立テストで正解率84.69%だった（抄録）。", "p6": "解釈：一致度の指標や被験者数が抄録にないため精度の程度は判断できない。識別精度は再構成の正確さを間接的に示すにとどまる。未査読のプレプリントである。", "unverified": "被験者数、誤差の指標（RMSEなど）、最小ノルム解の具体的な制約式は本文未入手のため確認できなかった。"}}, {"rank": 10, "theme": "VBI・橋梁SHM", "headline": "同一被験者の混入で生体信号分類の精度は水増し", "title": "Subject identity leaks into biosignal classifiers: a multi-dataset audit, a pre-training risk index and an open-source toolkit", "url": "https://doi.org/10.5281/zenodo.22980900", "authors": "Selçuk Özçelik", "venue": "Zenodo", "date": "2026-09-26", "id": "pr10", "explain": {"basis": "本文", "basis_note": "Zenodoの投稿原稿PDFの本文（方法、データ、考察と報告チェックリスト表3）と図表キャプションを読んだ", "preprint": true, "p1": "生体信号の機械学習で、同じ人の区間が学習とテストの両方に入る「被験者リーク（subject leakage）」による性能の水増しを、学習前に分かるデータの性質から予測する指標と、確認用のツール（leakscope）と報告チェックリストを示した（抄録）。", "p2": "心電図・加速度・脳波などの研究では、長い記録を区間に切って無作為に分けることが多く、同じ人の特徴を覚えるだけで高い精度が出てしまうが、その大きさと頻度は整理されていなかった（抄録、§Introduction）。", "p3": "同じデータを、①区間の無作為分割、②被験者内で連続ブロックに分け隣接区間を除く分割、③記録単位、④被験者単位の分割（基準）、⑤1人抜き（LOSO）で評価し、「無作為−ブロック」を隣接によるリーク、「ブロック−被験者単位」を個人識別によるリークに分解する（§Materials and methods、図1）。学習前に計算できる、1近傍法で被験者を当てられる度合い（subject identifiability）とラベルと被験者の依存度から、リスク指標を作る。例：同じ人の心拍が学習にもテストにもあると、不整脈の特徴でなく本人の波形の癖で当ててしまう。", "p4": "公開5データ（MIT-BIH、PTB-XL、UCI HAR、WESAD、Sleep-EDF）に4種のモデル（ロジスティック回帰、k近傍、ランダムフォレスト、1次元CNN）を当て、マクロF1の差を水増し量とする。720の模擬データでリスク指標を検証し、2023〜2026年の同じデータを使った論文100本を無作為抽出して監査する（抄録）。", "p5": "マクロF1の水増しはPTB-XLの0.01以下からMIT-BIHの0.49まで幅があり、曝露と被験者の識別しやすさに従った（抄録、図3）。模擬データでは、リスク指標が柔軟なモデルの識別由来の水増しの85〜88%を説明し、生理的な信号が全くなくてもリークだけで91%の正解率が出た（抄録、図2）。監査では12%の研究が学習に使った被験者で評価しており、40%は判断できるだけの記述がなかった（抄録、図5）。", "p6": "著者は、公式の被験者分離の分割があってもリークは防げていなかったと述べる（§Discussion）。解釈：個人の研究者による単著の投稿中の原稿で、特徴量やモデルの設定は固定したものに限られる。深層学習の大規模モデルでの水増しの大きさは未確認。未査読のプレプリントである。", "unverified": "表1のデータごとの指標値と、監査の個別集計（図5の内訳）は数値を確認していない。"}}, {"rank": 11, "theme": "都市・インフラ政策", "headline": "災害時の橋梁補強を多段階で決める強化学習", "title": "An Intelligent Hierarchical Q-Learning Decision-Support Framework for Multi-Stage Bridge-Network Fortification under Disaster Disruptions", "url": "https://doi.org/10.2139/ssrn.7528627", "authors": "Syed Wasif Ahmed ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr11", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "災害に備えてどの橋をいつ補強するかを、予算の制約の下で多段階に決める問題を、防御者–攻撃者–防御者の3層最適化と3層の階層型Q学習で解き、解釈できる補強方針を学習できるようにした（抄録）。", "p2": "橋は交通網の中で壊れると地域を分断する重要な要素だが、補強には大きな資源が要り、対象だけでなく実施の時期も決める必要がある。3層の非線形混合整数問題は直接解くのが難しい（抄録）。", "p3": "上位層が予算内の段階的な補強計画を選び、中位層が最も損害の大きい災害シナリオを敵対的に選び、下位層が残った通行可能な網で総交通費用が最小になるよう交通を配分する。この入れ子を階層型Q学習で分解し、交通配分を評価環境として補強方針と被害選択の方針を学ぶ（抄録）。", "p4": "交通研究で標準的なSioux Falls網で評価し、小・中規模の例では厳密解との一致、大規模の例では期待値ベース、近視眼的、中心性ベース、交通量ベース、無作為の方針と比べる（抄録）。", "p5": "小・中規模では厳密またはほぼ厳密な解を得て、大規模では比較した方針をすべて上回った（抄録）。予算に対する強靭性の改善は非線形で、ある投資額を超えると限界的な改善が小さくなり、同じ総予算なら前倒しの補強が最悪時の累積交通費用を減らした（抄録）。", "p6": "解釈：Sioux Falls網は小さな模擬ネットワークで、実際の橋の劣化状態や損傷確率は扱っていないようだ。敵対的な最悪シナリオを前提とするため、確率的な災害評価との違いにも注意が要る。未査読のプレプリントである。", "unverified": "具体的な改善率や計算時間は抄録にないため確認できなかった。"}}, {"rank": 12, "theme": "包摂的コミュニティ・社会", "headline": "社会関係資本は自治体の行政成果を高める", "title": "The Effects of Social Capital on Government Performance and Turnover: Evidence from Italian Municipalities", "url": "https://doi.org/10.2139/ssrn.7528956", "authors": "Ben Lockwood ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr12", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "イタリアの自治体で、社会関係資本（social capital）が高いほど行政サービスの量と効率が上がり、現職の再選の有利さが弱まることを、操作変数法で示した（抄録）。", "p2": "社会関係資本が政府の成績を高めるという主張は多いが、成績と社会関係資本は互いに影響し合うため因果を切り分けにくく、選挙を通じた経路（規律と選抜）も十分に検証されていなかった（抄録）。", "p3": "成績は公式のOpencivitas指数（自治体の行政サービスの産出と効率）で測り、社会関係資本は近隣自治体の社会関係資本と歴史的な指標を操作変数として扱う（抄録）。1期目と2期目の両方で成績を見ることで、規律（再選のために努力する）と選抜（良い人が選ばれる）を区別する。", "p4": "成績（産出・効率）、現職の再選確率、候補者の特徴（女性の参加など）を結果変数とする（抄録）。", "p5": "社会関係資本が高いと、1期目・2期目とも行政の産出と効率が上がり、規律と選抜の両方が働くことと整合的だった（抄録）。社会関係資本が1標準偏差高いと、立候補した現職の再選確率が3〜6ポイント下がった（抄録）。女性の立候補が増える証拠も一部得られた。", "p6": "解釈：近隣自治体の社会関係資本が成績に直接影響しないという除外制約が識別の鍵であり、その妥当性は本文で確認が要る。社会関係資本の具体的な測り方も抄録からは分からない。未査読のプレプリントである。", "unverified": "社会関係資本の指標の定義、期間、自治体数は本文未入手のため確認できなかった。"}}, {"rank": 13, "theme": "包摂的コミュニティ・社会", "headline": "介護する家族は配偶者から子へ、90歳以上で60代が中心", "title": "同居で介護する家族が 65 歳以上である割合は、介護を受ける人が 70〜74 歳で 0.836、85〜89 歳で 0.473 と下がり、90 歳以上で 0.594 に戻る——そのあいだに介護する人は配偶者から子に替わり、90 歳以上では 60〜69 歳の人が 0.570 を占める [M060]", "url": "https://doi.org/10.5281/zenodo.22976042", "authors": "Yuuki Yamagishi", "venue": "Zenodo", "date": "2026-09-26", "id": "pr13", "explain": {"basis": "本文", "basis_note": "Zenodoの英語版PDFの本文（記法、調査と設計、データ点検、計算4.1・5.1・6.1、図1）を読んだ", "preprint": true, "p1": "令和7年（2025年）国民生活基礎調査（介護票）の公表表から、介護を受ける人の年齢ごとに同居の主な介護者の続柄と年齢を並べ、85〜89歳あたりで介護する人が配偶者から子へ替わることを数値で示した（§5）。", "p2": "介護する家族の高齢化（老老介護）は語られることが多いが、介護を受ける人の年齢によって、介護する人が誰でどの年代かがどう変わるかは、公表表のままでは読み取りにくい（§1）。", "p3": "介護票の第60・61・81・82表（いずれも介護を要する者10万対）を使い、同居の主な介護者に限って、介護を受ける人の年齢階級ごとに配偶者・子・子の配偶者の割合と、介護者が65歳以上・75歳以上である割合を計算する（§2–§5）。表どうしの合計の一致をSHA-256で固定したファイルで点検している（§3）。著者は、設計を表を見たあとに決めたと明記している（§2）。", "p4": "比べるのは年齢階級ごとの割合の並びで、統計的な検定や推定は行っていない。表間の合計の丸め誤差が1以内であることなど、集計の整合性で数値の正しさを確かめる（§3）。", "p5": "家族が主な介護者のとき、配偶者0.383・子0.498で、介護者の0.732が60歳以上だった（計算4.1）。介護者が65歳以上である割合は、受ける人が70〜74歳で0.836と最も高く、85〜89歳で0.473に下がり、90歳以上で0.594に戻る。同じ区間で配偶者の割合は0.857から0.122へ下がり、子は0.111から0.641へ上がった（計算5.1、図1）。90歳以上では介護者の0.570が60〜69歳で、子の配偶者（0.209）が配偶者（0.122）を上回った。図1は横軸が受ける人の年齢、線が続柄・介護者年齢の割合で、配偶者と子の線が交わる位置を見る。", "p6": "著者は、標本調査の推計（10万対）であること、悩み・ストレスの表は使っていないこと、個々の家族の見通しではないことを断っている（抄録）。解釈：独立の個人研究者による公開統計の記述的な再集計で、別居の介護者や事業者を含めた全体像は扱っていない。未査読のプレプリントである。", "unverified": "計算6.1以降（性別の内訳、介護時間）の数値は一部のみ確認した。"}}, {"rank": 14, "theme": "職場AI・組織行動", "headline": "目標設定のやり方を途中で変えると成果と幸福が変わる", "title": "Changes in Leaders' Goal-Setting Approaches: Experimental Evidence on Employee Performance, Well-Being, and Work-Related Attitudes", "url": "https://doi.org/10.2139/ssrn.7528825", "authors": "Lena Peters ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr14", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "上司の目標設定のやり方が途中で変わること自体の効果を実験で示し、参加型から指示型への変更の悪影響が、指示型から参加型への変更の好影響より大きいという非対称を明らかにした（抄録）。", "p2": "参加型と指示型の目標設定の効果は調べられてきたが、上司のやり方が時間とともに変わった場合の帰結はほとんど分かっていない（抄録）。", "p3": "場面想定法（vignette）の実験に反復測定を組み合わせ、参加者169人に目標設定のやり方の変化（指示型→参加型＝DPC、参加型→指示型＝PDC）を経験させ、成績、幸福感（well-being）、目標へのコミットメントなどを測る（抄録）。", "p4": "「ベストを尽くせ」型の目標と比べた成績の差、変化の前後での各結果の変化、DPCとPDCの効果の大きさの差で評価する（抄録）。", "p5": "参加型・指示型とも「ベストを尽くせ」より成績が高く、両者の間に全体の差はなかった（抄録）。DPCは成績・幸福感・コミットメントを有意に高め、PDCは幸福感とコミットメントを有意に下げ、DPCの好影響はPDCの悪影響より有意に弱かった（抄録）。効果量は抄録にない（未確認）。", "p6": "解釈：場面想定の実験で、実際の職場での長期の関係や成果は測っていない。169人の標本の属性も抄録からは分からない。未査読のプレプリントである。", "unverified": "効果量、課題の内容、参加者の募集方法は本文未入手のため確認できなかった。"}}, {"rank": 15, "theme": "職場AI・組織行動", "headline": "AIは信頼より多く使われる：利用と信頼の動機の違い", "title": "Trust as a Complementary Asset: Motives and the Usage-Trust Gap in Artificial Intelligence", "url": "https://doi.org/10.2139/ssrn.7528973", "authors": "Xuan Tran", "venue": "SSRN", "date": "2026-09-26", "id": "pr15", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の全国代表パネルで、AIの「利用」と「信頼」を分ける動機を分析し、利用は認知度などで広がる一方、信頼は個人的な利益の見込みが生まれないと育たないことを示した（抄録）。", "p2": "人々はAIを信頼する以上に使っており、ChatGPT公開後に利用が広がる中で信頼は下がったという報告があるが、何が利用と信頼を分けるのかは明らかでなかった（抄録）。", "p3": "Teece（1986）の専有可能性の枠組みを使い、社会の信頼を、AI開発企業が必要とするが自前で作れない「補完的資産」と位置づける。Pew Research CenterのAmerican Trends Panel第152波（2024年8月、米国成人5,410人）で、利用と信頼それぞれの規定要因を比べる（抄録）。", "p4": "AIとの接触頻度、重要な決定をAIに任せる信頼、期待される個人的利益・生産性、知覚リスク、政府・企業のAI統治への信頼などの関係を見る（抄録）。", "p5": "57%が週に数回以上AIに接していると考える一方、重要な決定をAIに任せてもよいと答えたのは13%だった（抄録）。信頼は期待される個人的利益と生産性の向上と最も強く関連し、知覚リスクと負に関連した。利用は主にAIの認知度と自己の制御への懸念と関連し、これらは信頼を予測しなかった（抄録）。政府・企業への信頼は、利益とリスクの評価を通じて間接的にのみ信頼と関連した。", "p6": "解釈：横断データのため因果の向きは特定できない。職場でのAI利用に限った分析かどうかは抄録からは分からない。未査読のプレプリントである。", "unverified": "回帰モデルの形式と係数の大きさは本文未入手のため確認できなかった。"}}, {"rank": 16, "theme": "会計情報科学", "headline": "米国の外国企業上場廃止法への市場反応は一様でない", "title": "The Market Reaction to Geopolitical Delisting: Evidence from the Holding Foreign Companies Accountable Act", "url": "https://doi.org/10.2139/ssrn.7528505", "authors": "Xu Chen", "venue": "SSRN", "date": "2026-09-26", "id": "pr16", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の外国企業説明責任法（HFCAA：監査調書の検査に応じない外国企業を上場廃止にし得る法律）に対する中国・香港企業の株価反応を、規制イベントごとに分けて調べ、市場が一様な上場廃止ショックとしては扱っていなかったことを示した（抄録）。", "p2": "地政学的な理由による上場廃止の脅威が株価にどう織り込まれるかは、法律全体でまとめて見られがちで、個々の規制の出来事ごとの違いは分かっていなかった（抄録）。", "p3": "市場調整モデルとFama-Frenchの3因子モデルによるイベントスタディで、監査協力の合意、法定期限の変更、SECによる対象企業の指定、中央国有企業の上場撤退などの出来事ごとの異常リターンを測る（抄録）。", "p4": "各イベントの前後の累積異常リターンの符号と有意性、業種による違いで評価する（抄録）。", "p5": "監査協力と法定期限に関する出来事で最も強い正の反応が見られ、SECによる指定と中央国有企業の撤退の出来事では執行とその波及のリスクが表れた（抄録）。市場は規制の出来事の連なり、業種の関与度、政治的な注目度を通じて上場の脅威を価格に織り込んだと結論している（抄録）。", "p6": "解釈：出来事が重なる時期の交絡（米中関係の他のニュース）への対処は抄録からは分からない。数値が抄録にないため効果の大きさも未確認。単著の未査読プレプリントである。", "unverified": "対象企業数、イベントの日付、異常リターンの大きさは本文未入手のため確認できなかった。"}}, {"rank": 17, "theme": "都市・インフラ政策", "headline": "充電待ちの混雑が大型トラック電動化を左右する", "title": "Infrastructure-induced congestion reshapes heavy-duty truck electrification through fleet substitution", "url": "https://doi.org/10.2139/ssrn.7528631", "authors": "Yuheng Zhang ほか", "venue": "SSRN", "date": "2026-09-26", "id": "pr17", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "大型トラックの電動化で、充電の待ち時間（充電設備の混雑）が一定の条件の下で普及を左右する主因になることを、待ち行列理論による分解で示した（抄録）。", "p2": "大型トラックの電動化の分析は費用の比較が中心で、充電設備の混雑が必要な車両台数（代替に要る車両数）を押し上げる効果はあまり考慮されていなかった（抄録）。", "p3": "待ち行列理論で充電にかかる時間を「サービス時間」と「待ち時間」に分け、設備の利用率と待ち時間から混雑の状態（レジーム）を識別し、待ち時間が非線形に膨らむ効果を捉える（抄録）。例：充電器の利用率が高くなると待ち時間が急に伸び、同じ輸送量を運ぶのにより多くの車両が要る。", "p4": "電池車の費用が50%下がる設定で、混雑を考える場合と考えない場合の普及率を比べ、充電器の数や充電速度を増やした場合の効果を見る（抄録）。", "p5": "経済的な競争力に達したあとは、待ち時間が電池車の普及を決める条件付きの主因になり、待ち時間を無視すると導入判断が偏ることを示した（抄録）。充電器や充電速度を増やすと混雑の効果は和らぐが、待ち時間は代替の費用に影響し続けた（抄録）。数値は抄録にない（未確認）。", "p6": "解釈：どの国・地域の輸送データを使ったか、需要の時間変動をどう扱ったかは抄録からは分からない。未査読のプレプリントである。", "unverified": "対象地域、使ったデータ、普及率の具体的な値は本文未入手のため確認できなかった。"}}, {"rank": 18, "theme": "都市・インフラ政策", "headline": "都市の暑熱研究・特許・報道を2万報規模で横断", "title": "What the World Studies, Invents and Reports About Urban Heat", "url": "https://doi.org/10.17613/bh2an-0af97", "authors": "Narendra Kumar", "venue": "KC Works", "date": "2026-09-26", "id": "pr18", "explain": {"basis": "抄録", "basis_note": "KC Worksのページから抄録を取得。本文PDFは読んでいない", "preprint": true, "p1": "都市のヒートアイランドに関する論文約2万報を文単位で読み、ニュース・特許・熱中症などの事故記録・企業登記・資金調達と結合した公開コーパス（UHRC）を作り、研究・報道・発明・市場が都市の暑さをどう扱ってきたかを並べて示した（抄録）。", "p2": "都市の暑熱は研究も報道も急増しているが、研究が扱う原因・場所・対策と、報道や特許・市場の動きが一致しているかを横断的に見た資料はなかった（抄録）。", "p3": "1990〜2025年の論文20,422報（抄録のある17,101報を文ごとに分類）、2021〜2025年のニュース96,726件、特許4,123ファミリー、暑熱事故14,576件、企業・資金調達の記録を結合する。研究から抽出した原因の分類は独立の第2の読み手で検証し、通らなかった3分類は結果に使っていない（抄録）。", "p4": "論文数の伸び、原因の帰属の割合、研究と報道の冒頭文の内容の違い、国・都市ごとの研究と報道の偏り、特許と研究の伸びの比、街路樹による冷却効果の報告値を比べる（抄録）。", "p5": "分野の伸びは学術文献全体の約9倍で、原因を述べた2,409報の48%が都市化・土地利用の変化を挙げ、人工排熱への帰属は18.4%から7.7%へ下がった（抄録）。中国は研究の31%を占めるが英語報道では2.3%にとどまり、遮熱・透水性舗装の特許は10年で12倍に増えたのに研究は2.4倍だった。194研究の街路樹の冷却効果の中央値は2.0℃だった（抄録）。", "p6": "解釈：民間の分析会社による未査読のプレプリントで、報道は英語中心、企業データはインドの会計に偏る。冷却効果の中央値は測定条件の異なる研究をまとめた値で、比較には注意が要る。", "unverified": "本文を読んでおらず、分類の方法と第2の読み手の一致率は確認できなかった。"}}, {"rank": 19, "theme": "会計情報科学", "headline": "病院の資源配分を会計・臨床・業務データで最適化", "title": "Healthcare Financial Analytics for Optimizing Resource Allocation and Hospital Operating Efficiency", "url": "https://doi.org/10.2139/ssrn.7521999", "authors": "Nathaniel Sackey", "venue": "SSRN", "date": "2026-09-26", "id": "pr19", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "病院の人員・病床・手術室・設備・資本の配分を支えるため、会計情報・診療活動・業務の流れ・医療の質を結ぶ財務分析の枠組みを文献に基づいて整理した（抄録）。", "p2": "病院の経営者は、安全・質・財務の実現可能性を保ちながら資源を配分する必要があるが、会計情報と臨床・業務のデータをつなげて意思決定に使う枠組みが整っていない（抄録）。", "p3": "診療科別の貢献利益分析、時間主導型の活動基準原価計算（TDABC）、需要と在院日数の予測、容量分析、包絡分析法（DEA）、制約付き最適化、シナリオシミュレーションを組み合わせ、記述・因果・処方の3種の意思決定支援を区別する（抄録）。導入は、意思決定権限と目標の明確化から、監査可能なデータ層、原価と容量の定量化、需要とリスクの予測、臨床・人員の制約の下での最適化、成果の追跡へと段階的に進める。", "p4": "実データによる検証はなく、文献に基づくモデルと例示の値で枠組みを示す論文である（抄録）。", "p5": "主な結論は、財務の指標を患者の転帰、アクセス、人員の持続可能性、実行可能性と合わせて見たときにだけ、財務分析が組織の成果を高めるというもの（抄録）。費用の付け替えや必要な医療の削減、公平性の悪化で利益率を上げることは目指すべきでないと強調している。", "p6": "著者自身が、病院の非公開記録や独自の臨床実験に基づかない文献ベースのモデルだと明記している（抄録）。解釈：枠組みの有効性は実証されておらず、各手法の組み合わせ方の新しさも抄録からは判断できない。未査読のプレプリントである。", "unverified": "本文の4つの分析表の内容と例示値は確認できなかった。"}}], "pre_notable": [{"field": "AI（LLMエージェント）", "headline": "ツール応答でなく編集を予測する世界モデル", "title": "Agent-Editing World Model: Rethinking World Modeling for LLM Agents", "url": "https://arxiv.org/abs/2609.28416", "authors": "Shuang Sun ほか", "venue": "arXiv", "date": "2026-09-25", "why": "LLMエージェントの世界モデルを、観測の再構成ではなく行動の編集として捉え直す提案で、長期タスクのエージェント設計の考え方を変えうる。", "id": "pn01", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§2手法、§4.1実験設定、§4.3–4.4結果、§7結論）を読んだ。付録と表1の個別数値は一部のみ確認", "preprint": true, "p1": "LLMエージェントの「世界モデル」を、道具の応答（観測）を予測するものから、エージェント自身の推論と行動の良し悪しを判定して実行前に書き換えるものへと作り替え、長い作業の途中で誤った前提が履歴に残り判断を歪める問題を減らした（抄録、§2）。", "p2": "従来の言語の世界モデルは環境からの観測を予測するが、検索結果やコマンド出力のような実行次第で変わる応答を再現しても、実際の応答が得られる場面では価値が小さい。一方、エージェントは根拠のない仮定や古い計画を履歴に残し、それが後の判断を歪める「タスク状態の汚染（task-state contamination）」に陥る（抄録、§2.1）。", "p3": "AEWMは、①Action Judge：実行前の推論・行動の組を「重要（critical）」「探索的（exploratory）」「雑音（noisy）」に分類し、②State Revision：雑音と判定された組だけを同じ履歴から書き直す（式2）。書き直した行動は実環境で実行され、その結果で履歴が更新される（式3）。これを行動と組み合わせたものがEditActで、同じ結果を出すかの予測ではなく、状態そのものを直す点が従来と違う（式1）。例：検索エージェントが根拠のない推測を事実として次の検索を組もうとすると、それを雑音と判定し、根拠を取りに行く行動に書き換える。", "p4": "検索（BrowseComp、DeepSearchQA）、端末操作（Terminal-Bench 2.0）、ソフトウェア開発（SWE-Bench Pro、Doc2Repo、NL2Repo）の6ベンチマークで、Qwen3.5の3規模のエージェントに対し、ReAct、各手番で3候補から検証器が選ぶBest@3、軌跡単位のBest@3と比べる。各3回の平均で評価する（§4.1）。", "p5": "Action Judgeの独自ベンチマークでマクロF1 70.5%となり、最強の先端モデルを10.6ポイント上回った（抄録）。EditActは6ベンチマークすべてで比較手法を上回り、最強の比較手法に対する平均の上積みは4B・9B・35Bのエージェントでそれぞれ6.7・5.2・3.2ポイントだった（§4.3、表1）。9BにEditActを付けると35BのReActを上回った（44.1対42.2）。EditActの軌跡で追加学習したAEWM-RFTは、AEWMなしでも自己の成功軌跡での学習（Self-RFT）を2.2〜2.6ポイント上回った（§4.4、表2）。", "p6": "著者は、より強いエージェント（Qwen3.5-Plus）では端末・開発での改善が限られ、AEWMとエージェントの能力差が原因と考えられると述べている（§4.3）。解釈：学習データの一部は非公開の検索データで、判定のラベルも別のLLMで作られており、判定基準の偏りが結果に影響する可能性は残る。未査読のプレプリントである。", "unverified": "付録Bの判定ベンチマークの構成と、表1のベンチマーク別の数値は確認していない。"}}, {"field": "AI（科学的探索）", "headline": "未知の人工世界でAIの探索力を検証する", "title": "ExplorationBench: Measuring AI Systems' Exploration in Verifiable Alien Worlds", "url": "https://arxiv.org/abs/2609.30199", "authors": "Ming Zhang ほか", "venue": "arXiv", "date": "2026-09-25", "why": "仮説を立て実験で確かめる『探索』能力を、正解が検証できる架空世界で測るベンチマークで、AIによる科学的発見の評価基盤になりうる。", "id": "pn02", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3ベンチマーク設計、§4結果のRQ1・RQ3、§6限界）と図表キャプションを読んだ。RQ2と付録は未読", "preprint": true, "p1": "AIが仮説を立て実験し結果から学ぶ「探索」の力を、規則が既知の知識と食い違うため暗記では解けず、しかも答えが厳密に検証できる人工の「異星世界」で測るベンチマーク（ExplorationBench）を作った（抄録）。", "p2": "科学的探索の評価では、本当に新しい仮説が正しいかをどう確かめるか、探索で見つけたのか事前学習の知識を思い出しただけなのかをどう見分けるか、が難しい（抄録）。", "p3": "2つの砂場を用意する。AlienCodeは見慣れた演算子が隠れた別の意味で動く小さな計算言語（発見目標31、未見課題70）、AlienLogicは推論規則の一部を書き換えた一階述語の自然演繹（発見目標24、課題70）。システムには誤りを含むマニュアルと例題を渡し、プログラムや証明を「探り（probe）」として投げると、実行結果や検証結果が返る。4ラウンド探索したあと、道具を使えない別の会話で、見つけた規則の報告と未見課題への解答を求める（§3.1–3.2）。例：「+」が実は別の計算をする言語で、試しにプログラムを走らせて出力から規則を推測する。", "p4": "採点はインタプリタと証明検査器で行い、LLMの判定は使わない。10の先端AIシステムがそれぞれ3本の探索軌跡を走らせ、探索前（M0）から4ラウンド後（M4）の未見課題の正答率で比べる。自分で探りを選ぶ条件、最良軌跡の探りを後から与える条件、固定の探りの条件、道具なしの条件を比べて、実験を設計すること自体の寄与を分ける（§3.1、§4.1）。", "p5": "AlienCodeでは探索前はどの軌跡も15.7%以下だったが、4ラウンド後の最良（Best@3）は87.6%に達し、10システム中7つが60%を超えた（§4.2.1）。AlienCodeの中央値は、自分で探りを選ぶと66.0%、同じ探りを後から与えると40.7%、固定の探りでは5.7%で、実験を自分で設計することが効いていた（図4）。一方で同じシステムでも軌跡間の差が最大72.8ポイントあり、30軌跡中6本は途中より3ポイント以上下がって終わった（§4.2.3、図9・10）。", "p6": "著者は、決定的で実行可能な2つの世界に単純化しているため、雑音や不完全な観測、費用のかかる実験、開かれた仮説空間、長い探索期間を含む実際の科学的発見の能力を測るものではないこと、軌跡3本・解答3回では分布を精密に推定できないことを限界に挙げている（§6）。未査読のプレプリントである。", "unverified": "RQ2（規則の発見と使用の関係）の結果と、表1のシステム別の数値は確認していない。"}}, {"field": "AI（解釈可能性）", "headline": "品詞はSAEの特徴群として現れる", "title": "Parts-of-Speech as Emergent Categories in SAE Latent Space", "url": "https://arxiv.org/abs/2609.29362", "authors": "Alessandro Bondielli ほか", "venue": "arXiv", "date": "2026-09-25", "why": "スパースオートエンコーダの潜在表現に言語学的カテゴリがどう表れるかを品詞で統制して調べ、言語モデル内部の理解に言語学の知見を持ち込む。", "id": "pn03", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3方法、§4実験設計、§5.1・5.2・5.4結果、限界）と図表キャプションを読んだ。§5.3と付録の数値は未確認", "preprint": true, "p1": "言語モデルの内部表現を疎な特徴に分解するスパースオートエンコーダ（SAE）の中で、品詞（part-of-speech）が「1特徴＝1品詞」ではなく、品詞ごとに大きさの違う特徴のまとまりとして表れていることを、品詞を統制された試験台にして示した（抄録、§5.2）。", "p2": "SAEは言語モデルの表現を人が読める特徴に分ける方法として期待されているが、その特徴がどんな言語学的構造を持っているのか、文法的なカテゴリーが個々の特徴に対応するのか、特徴の群として分散しているのかは分かっていなかった（抄録、§1）。", "p3": "LLaMA-3-8Bの第30層の残差ストリームを公開のSAE（拡大率32倍、131,072次元）で符号化し、Universal Dependencies英語GUMツリーバンク（14,353文・252,284語）の各語の特徴活性を得る（§3.1–3.2）。品詞ごとにL1正則化ロジスティック回帰で「その品詞か否か」を判別し、正の係数が大きい特徴から順に、その品詞の語の95%で少なくとも1つが活性化するまでの最小の特徴数を数える（§4.2の被覆率の式）。例：名詞を判別する分類器の上位の特徴を足していき、名詞の95%を覆うのに何個要るかを見る。", "p4": "品詞の判別の精度（5分割交差検証のF1）、品詞ごとの必要特徴数、選んだ特徴だけで多クラス分類したときの精度、学習に使わないテストデータと180語の統制データでの活性の安定性を見る。語ごとに品詞を無作為に割り当てた対照プローブで、語の暗記による見かけの精度を差し引く（§4.1–4.4）。", "p5": "ほとんどの品詞でSAEの特徴から高いF1で判別でき、閉じた品詞（前置詞など）や句読点は判別しやすかった（§5.1、図2）。開いた品詞（名詞・動詞など）ほど多くの特徴を使い（図3）、必要な特徴数は品詞によって大きく違った（図4）。選ばれた498特徴（12%は2つ以上の品詞に共有）だけの多クラス分類は、全特徴の場合と同程度の精度だった（§5.2、図5）。無作為ラベルの対照は正解率0.54・マクロF1 0.42で、本来のプローブ（正解率0.88）より大きく低かった（§5.4）。", "p6": "著者は、品詞は言語の1つの階層にすぎないこと、1つのモデル・1つのSAEに限ること、プローブの係数は因果の証拠ではなく介入実験が必要なこと、統制データが小さく名詞と動詞中心であることを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "本来のプローブのマクロF1が本文では0.97、表2では0.78と食い違っており、どちらが正しいか確認できなかった。§5.3（テストデータでの検証）の数値も未確認。"}}, {"field": "労働・環境経済", "headline": "カリフォルニアの暑熱規制で労災は減った", "title": "Cooler Laws, Safer Workers: Evaluating California’s Heat Standard and Injury Reduction", "url": "https://doi.org/10.3386/w35772", "authors": "Olesya Fomenko ほか", "venue": "NBER Working Paper", "date": "-", "why": "暑熱対策の法規制が労災を減らすかを行政データの三重差分で評価し、温暖化下の労働安全政策に直接の根拠を与える。", "id": "pn04", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、§3データ、§4推定方法と式1、§5結論）を読んだ。結果表の個別の係数は結論の要約で確認", "preprint": true, "p1": "2005年にカリフォルニア州が導入した屋外労働の暑熱基準（水・日陰・休憩・暑熱順化・緊急対応の義務）が、暑い日の労働災害を建設・農業・運輸で15〜27%減らしたことを、労災補償の行政データで因果的に示した（抄録、§5）。", "p2": "暑さが労災を増やすことは多くの研究で示されてきたが、暑熱を対象とする法規制が実際に労災を減らすかの証拠はほとんどなく、導入後の減少が基準によるのか他の要因によるのかも切り分けられていなかった（§1）。米国には連邦の暑熱基準がなく、各州で導入が議論されている。", "p3": "WCRIの労災補償請求データ（発生日と居住地の郵便番号つき）と、PRISMの4km格子の日最高気温を郵便番号区域・日単位で結合し、2002〜2022年の5〜10月の平日を対象にする（§3）。「導入前後」×「暑い日と涼しい日」×「屋外の高リスク産業と事務・専門職」の三重差分で、同時期の労災補償制度改革など州全体の変化を差し引く（§4、式1）。例：同じ区域・同じ暑い日に、建設労働者の労災が事務職と比べて基準導入後にどれだけ減ったかを見る。", "p4": "結果は区域・日・産業ごとの労災件数で、三重の交差項の係数が基準の効果を表す。アリゾナ州を比較対照にした別の推定でも結果を確かめる（§4、§5）。", "p5": "暑い日の労災件数は、建設で15〜17%、運輸で19〜25%、農業で24〜27%減った（§5）。効果は外気温が高いほど大きく、若い労働者で大きかった（抄録）。アリゾナを対照にした推定でも建設と農業の結果は再確認されたが、運輸はやや不安定だった（§5）。", "p6": "著者は、運輸の推定の不安定さを業界全体の空調技術の進歩などで説明しており、データが労災補償請求の40〜80%しか覆わないこと、発生場所を居住地の郵便番号で近似していることを注記している（§3脚注9・10、§5）。解釈：報告されない労災の変化は捉えられない。NBERワーキングペーパーで、査読前の版である。", "unverified": "年齢別・気温区分別の係数の具体的な値は確認していない。"}}, {"field": "環境・災害経済", "headline": "山火事対策の自助を促す誘因設計", "title": "Incentivizing Self-Protection From Wildfires", "url": "https://doi.org/10.3386/w35764", "authors": "Patrick Baylis ほか", "venue": "NBER Working Paper", "date": "-", "why": "住宅周辺の可燃物管理という安価な対策が普及しない理由と誘因の効果を検証し、災害リスク削減政策に示唆を与える。", "id": "pn05", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、候補一覧に載ったNBERの抄録の冒頭部分のみを使用", "preprint": true, "p1": "山火事の危険がある地域で、住宅の周りの可燃物の管理という安価な自衛策を人々に実行させるための誘因（インセンティブ）の効果を調べた研究である（抄録冒頭）。", "p2": "自然災害の損失は財産の保護への投資で減らせるが、安価なリスク低減策でも採用は少ない。山火事の地域では住宅のすぐ近くの植生や燃料を管理すると建物の脆弱性が下がるのに、普及活動を広く行っても推奨に沿う物件は少ない（抄録冒頭）。", "p3": "未確認（抄録の後半・本文を入手できず）。", "p4": "未確認（抄録の後半・本文を入手できず）。", "p5": "未確認（抄録の後半・本文を入手できず）。", "p6": "未確認（抄録の後半・本文を入手できず）。NBERワーキングペーパーで、査読前の版である。", "unverified": "手法（どの誘因をどう検証したか）、データ、結果の大きさはすべて確認できなかった。"}}, {"field": "医療経済", "headline": "配偶者の健康が公的介護の利用を抑える", "title": "The Protective Effects of a Healthy Spouse: Medicare as the Family Member of Last Resort", "url": "https://doi.org/10.3386/w35784", "authors": "Itzik Fadlon ほか", "venue": "NBER Working Paper", "date": "-", "why": "配偶者の急な健康悪化が相方の介護施設利用を増やすことを請求データで示し、家族介護の価値と長期介護保険の設計を定量化する。", "id": "pn06", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、結論）を読んだ。推定の各節と付録の表は序論の要約で確認", "preprint": true, "p1": "配偶者が心筋梗塞や脳卒中で急に倒れると、もう一方の配偶者の介護施設入所が約30%増えることをメディケアの請求データで示し、その変化から家族（配偶者）による介護の価値の下限を推定して、長期介護の保険を世帯単位で設計すべきことを示した（抄録、§1）。", "p2": "家族による無償の介護（informal care）は記録されず価値の推計も860億〜5,000億ドル超と幅がある。公的な介護保険は、安価な家族介護がある人ほど公費の介護を使い過ぎる（モラルハザード）おそれと、家族介護のない人の保障不足の間で設計を迫られるが、米国のメディケアは世帯構成に関係なく同じ給付をしている（§1）。", "p3": "メディケアの請求記録で夫婦を特定する独自の対応表を作り、介護施設の全数記録と結ぶ。一方の配偶者が急な健康ショックを受けたときの、もう一方の介護施設利用の変化を推定する。さらに、入院後の熟練看護施設（SNF）の自己負担が21日目から急に上がる制度を使った回帰不連続デザインで、配偶者が健康な人と倒れた人の価格への反応の違いを測り、2本の需要曲線の間の面積を家族介護への支払意思額の下限とみなす（§1）。", "p4": "介護施設への入所確率、配偶者の健康ショック後の健康状態、自己負担の境目での退所率の変化（価格弾力性）を比べ、モデルで最適な補助の水準と給付設計の厚生効果をシミュレーションする（§1）。", "p5": "配偶者の健康ショックで、もう一方の翌年の介護施設入所の確率が平均30%上がり、その多くは家族介護から公的な介護への置き換えだった（§1）。配偶者が健康でないときの公的介護1日の追加の消費者余剰は約568ドル高く、これは介護施設1日の費用の約1.6倍にあたる（§1）。最適な補助は配偶者が病気の人で健康な人より80%大きく、政府支出を一定にしたまま給付を配偶者が倒れた人に移すと社会厚生が13.4%増えるとの試算だった（§1）。", "p6": "著者は、推定値は家族介護の価値の下限であり、公的介護と家族介護の代替性が高いほど実際の価値に近づくと述べる（§1）。解釈：対象は夫婦のそろったメディケア受給者で、子による介護や単身者には直接当てはまらない。NBERワーキングペーパーで、査読前の版である。", "unverified": "健康ショックの推定の細部（事象研究の図、異質性の分析）と動学モデルの前提は確認していない。"}}, {"field": "人口・家族", "headline": "出産の遅れが重なり祖母になる年齢が57歳に", "title": "Compound Delay: The Causes and Consequences of Later Grandmotherhood", "url": "https://doi.org/10.3386/w35773", "authors": "Dora L. Costa ほか", "venue": "NBER Working Paper", "date": "-", "why": "出産年齢の上昇が世代をまたいで重なり、健康な祖母が孫と過ごせる年数を大きく減らすことを示す。少子高齢化の家族への影響を捉える視点で、日本にも当てはまりうる。", "id": "pn07", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "出産の高年齢化が世代をまたいで積み重なり、初めて祖母になる年齢を大きく押し上げることを示し、それによって健康なうちに孫と過ごせる年数が減ることを定量化した（抄録）。", "p2": "出産の遅れは本人の世代の問題として論じられがちだが、娘の出産時期が母親（祖母）の人生に及ぼす影響は、娘自身の損得の計算に入らない外部性として見過ごされてきた（抄録）。", "p3": "1960年と2024年の第1子出生の年齢分布（出生スケジュール）を2世代に重ねて当てはめ、祖母になる年齢の分布と、健康な祖母でいられる年数を計算する（抄録）。例：母も娘も遅く産むと、遅れが足し合わされて祖母になる年齢が上がる。", "p4": "祖母になる年齢の中央値、孫と健康に過ごせる年数、55歳までに祖母になる割合の学歴・人種別の変化と、避妊など生殖の管理手段へのアクセスの寄与を比べる（抄録）。", "p5": "1960年の出生スケジュールでは祖母になる年齢の中央値は44歳だったが、2024年のスケジュールでは57歳になり、孫と健康に過ごせる年数は28年から15年に減った（抄録）。寿命の延びはこの損失を埋めない。遅れは大卒で最も大きく、白人の大卒女性では55歳までに祖母になる割合の低下の半分以上が生殖の管理手段へのアクセスで説明された（抄録）。著者はこれを「Rotten Adult Kid問題」と名づけている。", "p6": "解釈：出生スケジュールを機械的に重ねた計算で、実際の世代間の相関や健康寿命の定義は抄録からは分からない。米国のデータであり、日本の値は示されていない。NBERワーキングペーパーで、査読前の版である。", "unverified": "健康な年数の定義と計算に使ったデータは本文未入手のため確認できなかった。"}}, {"field": "国際経済", "headline": "米中貿易戦争で中国輸出は第三国へ向かった", "title": "The Remains of the Trade: The U.S.–China Trade War and its Aftermath", "url": "https://doi.org/10.3386/w35785", "authors": "Pol Antràs ほか", "venue": "NBER Working Paper", "date": "-", "why": "米国向けから第三国向けへの中国輸出の振り替えと波及を月次データで示し、関税政策の国際的な帰結を評価する。日本を含む第三国への影響を考える材料になる。", "id": "pn08", "explain": {"basis": "抄録", "basis_note": "原文と登録抄録は謝辞しか取得できず、候補一覧に載ったNBERの抄録の冒頭部分のみを使用", "preprint": true, "p1": "米中貿易戦争が世界の貿易の流れをどう作り替え、第三国に波及したかを、最近の関税政策の変更と月次の国際貿易データで調べた研究である（抄録冒頭）。", "p2": "米中間の関税引き上げの影響は二国間で論じられがちだが、中国の輸出が米国以外に振り向けられることで第三国に及ぶ影響は十分に分かっていない（抄録冒頭）。", "p3": "最近の関税政策の変更と月次の国際貿易フローのデータを使い、中国の輸出の向け先の変化を記録し、その再配分の影響をモデルで解釈する（抄録冒頭）。詳細は未確認。", "p4": "未確認（抄録の後半・本文を入手できず）。", "p5": "中国の輸出が米国市場から第三国へ振り向けられたことを記録している（抄録冒頭）。その大きさや第三国への影響の推定値は未確認。", "p6": "未確認（抄録の後半・本文を入手できず）。NBERワーキングペーパーで、査読前の版である。", "unverified": "再配分の大きさ、対象国、モデルの結果はすべて確認できなかった。"}}, {"field": "労働経済", "headline": "自由移動圏での国際移住の賃金上昇を測る", "title": "The Returns to International Migration in a Free Mobility Setting: Evidence from Austria and Germany", "url": "https://doi.org/10.3386/w35774", "authors": "Andrea Weber ほか", "venue": "NBER Working Paper", "date": "-", "why": "オーストリアとドイツの連結行政データで元同僚を比較群にし、移住による所得の増加とその個人差を推定する。", "id": "pn09", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "オーストリアとドイツの行政データを国境を越えて結び、元の同僚を比較群にすることで、国際移住による賃金の上昇とその個人差を、移住先にとどまる人と戻る人に分けて推定した（抄録）。", "p2": "国際移住でどれほど所得が増えるか、それが移住者によってどう違うかは、移住する人が選ばれた人であること（選抜）と、帰国後を追えないことのために測りにくい（抄録）。", "p3": "移住前の2〜4年に安定して雇用されていた人を対象に、同じ職場の元同僚をマッチングした比較群とする差の差の分析を行い、出身国と移住先の両方のデータで移住後5年を追う（抄録）。国内の大都市（ウィーン、ドイツの5大都市）への移動も同じ方法で分析して比べる。", "p4": "マッチした元同僚に対する日給の上昇率を、移住の向き、滞在期間（とどまる・1〜4年で戻る・1年未満で戻る）、職場間の既存のつながりの有無で比べる（抄録）。", "p5": "オーストリアからドイツへの移住者は元同僚より日給が約13%上がり、その差はすぐに現れて続いた。ドイツからオーストリアへの移住者は約4%だった（抄録）。差は選抜の違いではなく主にドイツの平均賃金の高さによる。移住先にとどまる人で最も大きく、1年未満で戻る人ではゼロかわずかに負だった。大都市への国内移動では、オーストリア人で約5%、ドイツ人で約10%の上昇だった（抄録）。", "p6": "解釈：言語と制度が近い自由移動圏での結果で、言語や資格の壁が大きい移住への一般化には注意が要る。安定雇用者に限った標本でもある。NBERワーキングペーパーで、査読前の版である。", "unverified": "標本の人数と推定の信頼区間は本文未入手のため確認できなかった。"}}, {"field": "マクロ経済", "headline": "戦後の退役軍人給付で見る給付金の景気効果", "title": "The Macroeconomic Effect of Stimulus Checks: Evidence from Postwar Veterans’ Payments", "url": "https://doi.org/10.3386/w35786", "authors": "Joao Guerreiro ほか", "venue": "NBER Working Paper", "date": "-", "why": "景気と無関係に決まった第二次大戦後の一時給付を自然実験に使い、現金給付が消費と経済に与える効果を推定する。", "id": "pn10", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "第二次世界大戦後の米国の退役軍人への一時金を、景気と無関係に決まった「給付金」の自然実験として使い、現金給付が消費をどれだけ、どんな時間の形で押し上げるかを推定した（抄録）。", "p2": "赤字で賄う一回限りの一律給付（stimulus checks）が経済を押し上げるかは、給付の時期が景気に合わせて決まるため、因果効果を識別しにくい（抄録）。", "p3": "戦後の退役軍人への支払いは給付金に似た性質を持ちつつ、支給の時期が景気とは無関係に決まったと考えられる点を使い、移転支出と消費の時間的な反応を推定する（抄録）。「移転乗数」は、移転1ドルあたりの消費の累積の反応である。", "p4": "消費の反応の時間的な形と移転乗数の大きさを推定し、標準的な異質的エージェント・ニューケインジアン（H     var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + (THEME_CLASS[it.theme] || "--accent-soft") + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", BASIS_PILL[ex.basis] || ex.basis || ""));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      card.appendChild(el("p", "summary", it.summary));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    card.appendChild(askrow); card.appendChild(askStatus);
    var venue = (it.venue || "") + (it.sjr ? "（SJR " + it.sjr + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ") : "";
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, venue: it.venue, sjr: it.sjr, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
