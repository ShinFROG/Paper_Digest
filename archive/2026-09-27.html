<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-09-27", "intro": "【試行：200本版】プレプリントの新着のうち研究テーマに関連する候補、学術誌の新着（上位10%誌1,242件、その他の学術誌279件）、注目分野の候補（プレプリント205件、論文誌57件）から選びました。注目分野は、組織行動・心理的安全性、経済学、経営学、統計学、機械学習、因果推論の6分野と、今日のおすすめ分野（地震工学・防災、ヒューマンコンピュータインタラクション）です。土日でarXivの新着がなく、注目分野の論文誌も新着が少なかったため、水増しせず、プレプリント・関連45報、プレプリント・注目44報、論文誌・関連50報、論文誌・注目32報としました。各部の上位15報は詳しい解説、16位以下は抄録をもとにした短い解説です。あわせて、DataCiteに直近3日で登録された公開データセット・研究コードから10件を「データ」タブに載せています。", "pre_related": [{"theme": "LLM熟議・ペルソナ", "headline": "合成回答者は母集団ごとの較正が要る", "title": "Calibrating Synthetic Respondents: A Within-Persona Experiment on Public Reactions to Protest in Turkey", "url": "https://doi.org/10.31235/osf.io/hp7gz_v1", "authors": "Mehmet Fuat Kina ほか", "venue": "SocArXiv", "date": "2026-09-26", "rank": 1, "id": "pr01", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（データ・較正設計・結果・考察の節と表1・2、図1・2）を読んだ。付録E〜Hは本文中の要約のみ確認", "preprint": true, "p1": "LLMで作る合成回答者（synthetic respondents）について、どの推論設定が母集団をよく再現するかを先に結果変数ごとに較正し、その設定を固定してから同じペルソナに2つの条件を答えさせる「ペルソナ内実験」を行う手順を示した（抄録、§3.3–3.4）。", "p2": "LLMで調査回答を模す研究は増えているが、ペルソナに何を入れるか、温度、モデル、提示の仕方などの選択で結果が変わり、既知の実験効果を再現できるかで検証する従来のやり方では、設定の良し悪しと効果の真偽が切り分けられない（§1）。", "p3": "2024年トルコ総合社会調査（TGSS、2,615人）の117変数から11種のペルソナ構成（C0＝属性のみ〜C10）を作り、ペルソナから除いた2項目（過去1年のデモ参加：陽性約5%の2値、女性のフルタイム就労への態度：5件法）に照らして、①ペルソナ内容 ②回答方式（直接回答か、確率分布を言わせてから抽出する verbalized sampling）と温度 ③モデル ④提示形式、の順に候補を絞る「較正ファネル」を回す（§3.2–3.3、図1）。例：2値項目ではC6・直接回答・T=0.8・GPT-4o-mini、5件法ではC6・verbalized sampling・T=0.8・GPT-5.4-miniが選ばれた（表2）。", "p4": "良さの基準は、分布の一致（2値はJensen–Shannon距離と陽性率の差、順序尺度はWasserstein-1距離）と、個人単位の一致（陽性クラスの再現率、Matthews相関、重み付きκ）の両方。選ばれた設定は選択に使っていない同形式の6項目でも確かめた（§3.3）。", "p5": "属性だけのペルソナではデモ参加者の再現率0.012、C6・C8で0.512まで上がった（§4.1）。最終設定の3シード平均は、2値で再現率0.512・JSD 0.0011、5件法でWasserstein 0.181・重み付きκ 0.312（表2）。実験では、治安悪化（threat）の文脈は平和交渉（opportunity）の文脈よりクルド語教育を求めるデモの正統性評価を0.41点下げ（95%CI −0.47〜−0.35、dz=−0.26）、参加意向を15.76ポイント下げた（22.5%→6.8%）（§4.2.1、図2）。図2は横軸が「治安−平和」の差で、負ほど平和文脈で高いことを示す。", "p6": "著者は、得られた差は較正済みの手順が生む模 adline": "LLM社会の規範形成は行動の収束だけでは測れない", "title": "Behavior is Not Enough: A Mechanism-Based Evaluation of Social Norm Emergence in LLM Societies", "url": "https://doi.org/10.48550/arxiv.2609.26481", "authors": "Rasika Muralidharan ほか", "venue": "arXiv", "date": "2026-09-22", "rank": 3, "id": "pr03", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（方法、RQ1〜RQ3の結果、考察、限界）と表1・2を読んだ。付録の頑健性分析は未読", "preprint": true, "p1": "LLMエージェントの集団で協力が収束しても、それが共有された期待による「規範」なのか模倣や損得によるのかは行動だけでは分からないため、各エージェントに期待を報告させて、規範の成り立ちを仕組みごとに切り分けて評価する枠組みを示した（抄録）。", "p2": "マルチエージェントのLLMシステムの研究では、行動が一つに揃うことをそのまま規範の出現とみなしてきたが、同じ協力均衡でも、共有された期待、戦略的な誘因、単なる模倣のどれから生じたかで意味が違う（抄録、§Introduction）。", "p3": "12体のエージェントが4人ずつ3グループで公共財ゲームを20ラウンド行う（初期資金10、拠出の合計を1.6倍して均等配分）。毎ラウンドの終わりに、典型的だと思う拠出額（経験的期待）と、社会的に許容される拠出額（規範的期待）を報告させる。これに、グループ内の話し合い（社会的学習）と、相互評価で結びつきの重みを更新し次の組分けに使う仕組み（社会的選択）を組み合わせ、5条件で機能を一つずつ外して比べる（§Methods、表1）。例：拠出の少ないエージェントは低く評価され、結びつきが弱まり、次のグループに入りにくくなる。", "p4": "GPT-4o-mini、Llama 3.1-8B、Qwen 2.5-7B、Mistral-7Bで各条件10回ずつ走らせ、ラウンドごとの平均拠出を、実行単位でクラスター化した最小二乗法で比べる。ラウンド10または20で4体を規範的期待が半分の撹乱エージェントに置き換え、5ラウンドの回復も調べる（§Evaluation、§RQ3）。", "p5": "期待を報告させるだけで、4モデルすべてで拠出が増えた（何もない条件からの差は+0.58〜+1.39、表2）。社会的選択は、拠出が少ない→評価が低い（β=−0.184）→結びつきが弱まる（β=0.240）という経路は働いたが、次のラウンドの拠出の修正は小さく（β=0.068）、話し合いによる修正（β=0.390）の方が大きかった（§RQ2）。撹乱のあと規範的期待と行動はどちらも戻ったが、戻る速さは違い、規範が成熟したラウンド20の撹乱の方が回復が早かった（図4）。", "p6": "著者は、公共財ゲームは単純化が強く現実に一般化できない可能性、リーダーシップや社会的アイデンティティなど他の要因を扱っていないこと、報告させた期待はプロンプトを介したもので、モデル内部の表象の直接の証拠ではないことを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "表2の社会的学習・社会的選択を加えた効果のモデル別の有意性と、付録の頑健性分析の数値は確認していない。"}}, {"theme": "職場AI・組織行動", "headline": "開示文の『従業員の幸福』重視度が労働者の健康を予測", "title": "Well-Being Salience in Corporate Disclosures and Worker Health", "url": "https://doi.org/10.3386/w35760", "authors": "Riccardo Di Francesco ほか", "venue": "NBER Working Paper", "date": "-", "rank": 4, "id": "pr04", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、主要結果§5の冒頭、結論）を読んだ。付録の頑健性分析は本文の言及のみ確認", "preprint": true, "p1": "企業が年次報告書で「従業員の幸福（well-being）」をどれほど前面に出しているかを文章から数値化し、デンマークの全人口の行政データと結ぶことで、それが従業員の病欠を増やす一方で医療の利用は変えないことを示した（抄録、§6）。", "p2": "職場が従業員の健康を左右することは分かってきたが、どの職場の特徴が効くのかは行政データに記録されず、職場文化の調査は費用がかかり規模を広げにくい（§1）。", "p3": "心理学の辞書（LIWCなど）から幸福・メンタルヘルスの参照語を決め、事前学習済みの文埋め込み（sentence embedding）で報告書の各文と参照語の意味的な近さを測り、報告書内の類似度の95パーセンタイルを企業の「幸福の顕著さ（salience）スコア」とする（§1、§3）。語調ではなく意味の近さだけを測る。これを2013〜2022年の病欠・医療利用の登録データと結び、転職者（mover）が移る前後で、移籍先と移籍元のスコア差に応じて結果がどう変わるかを見る（§1）。例：スコアの高い会社へ移った人の病欠日数が、移籍の前後でどれだけ変わるかを追う。", "p4": "転職者71,714人（684,432人年）を対象に、転職前3年・後3年のイベントスタディで、病欠（日数と有無）と、処方薬、精神科入院、心理相談、呼吸器・筋骨格の入院を比べる（§1、表3注）。移籍前に傾向の差がないこと、移籍の向きが属性と無関係なことを識別の前提として確かめる（§1）。", "p5": "移籍の1年後、スコア差が1標準偏差大きいと病欠が約0.56日（移籍前平均の約4分の1）増え、病欠する確率が約5ポイント（同約5分の1）上がった（§5、図6）。一方で医療の利用はどの指標も動かなかった（図7〜9）。図6は横軸が移籍からの年、縦軸がスコア差1単位あたりの効果で、移籍前はゼロ付近、移籍時に跳ねて定着する形を見る。増えた病欠日数の約半分は1週間を超える長期の病欠で、転職しない人（stayer）でも同じ非対称が再現された（§1）。", "p6": "著者は、病欠が増えた経路として休みを取ることへの偏見の減少、制度の情報、管理者の寛容さを挙げるが、どれかは特定していない（§6）。解釈：スコアは文章上の強調であって実際の制度や施策の測定ではなく、デンマーク以外の制度（医療が無料で転職が多い）への一般化は未確認。NBERワーキングペーパーで、査読前の版である。", "unverified": "付録（業種効果の分解、代替パーセンタイル、パンデミック前の標本）の数値は確認していない。"}}, {"theme": "会計情報科学", "headline": "LLMで作る開示テキスト指標はモデル次第で変わる", "title": "Same Text, Different Numbers: The Divergence of LLM-Based Measures", "url": "https://doi.org/10.2139/ssrn.7519558", "authors": "Hamid Boustanifar ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 5, "id": "pr05", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "決算説明会の書き起こしを生成LLMで数値化した13種の指標が、使うLLMによってどれほど変わるかを測り、LLM由来の変数は「モデルに依存する測定」として複数の提供元で検証すべきことを示した（抄録）。", "p2": "企業の文書をLLMで実証用の変数に変える研究が増えているが、その変数がモデルの選び方に左右されないかは確かめられていなかった（抄録）。", "p3": "異なる提供元の7つのLLMに、S&P 500企業の決算説明会の書き起こしを、感情（sentiment）、経営者の説明の明確さ、不確実性、回答の具体性、気候リスク・政治リスクなど13の概念で採点させ、モデル間の一致と、下流の回帰分析の結果がどう変わるかを調べる（抄録）。", "p4": "モデル間の順位相関、書き起こし単位の共通成分が全体の分散に占める割合、モデル間の不一致がその後のアナリストや市場の意見の不一致を予測するか、回帰係数の大きさ・符号・有意性の変化で評価する（抄録）。", "p5": "モデル間の順位相関は平均0.52にとどまり、提供元に共通する書き起こし間の差は全体の分散の34%しか説明しなかった（抄録）。モデル間の不一致はその後のアナリスト・市場の不一致を予測せず、文書そのものの曖昧さではなくモデル固有の成分が大きいと解釈している。回帰係数の大きさ・符号・有意性もモデルによって大きく変わった（抄録）。", "p6": "著者は、複数の提供元で平均すると多くの指標で順位は安定するが、得点の水準はどのモデルを含めるかに依存し続けると述べる（抄録）。解釈：プロンプトの書き方や温度などの設定の違いがどこまで寄与するかは抄録からは分からない。未査読のプレプリントである。", "unverified": "使用した7モデルの名称、プロンプト、期間、各指標ごとの相関は本文未入手のため確認できなかった。"}}, {"theme": "会計情報科学", "headline": "電子税額票の取引網から企業の倒産を予測", "title": "DefaultGNN: A Dual-Perspective GNN Framework for Predicting Corporate Default from Buyer-Seller Transaction Networks", "url": "https://doi.org/10.48550/arxiv.2609.25542", "authors": "Junghoon Kim ほか", "venue": "arXiv", "date": "2026-09-22", "rank": 6, "id": "pr06", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3データ分析、§5実験設定・結果・時点外検証・事例、§6実運用）と表1・3を読んだ。表2の年別の数値は未確認", "preprint": true, "p1": "財務諸表が乏しい企業でも、電子税額票（電子インボイス）の取引データから作った「買い手側」と「売り手側」の2つの取引ネットワークをグラフニューラルネットワーク（GNN）で統合することで、倒産（債務不履行）をより正確に予測できるようにした（抄録）。", "p2": "従来の信用モデルは財務諸表に頼るが、中小企業や個人事業主は財務報告が少なく使えないことが多い。取引関係を通じて倒産リスクが伝わることは知られているが、売り手が代金を回収できない一方向の伝播として扱われることが多かった（§1、§3.2.2）。", "p3": "韓国の電子税額票システム（2018〜2023年、年ごとに420,687〜985,320社、取引14,175,876〜54,823,028件）から、同じ企業群について売り手側と買い手側の有向ネットワークを作り、取引額の比率で辺に重みを付ける（§3.3、表1）。それぞれを2層のGCNで符号化し、企業の売上と仕入の比に応じて2つの見方の重みを学習的に調整して統合する（§4）。例：主に売る側の企業では、買い手の支払い遅延を通じたリスクを表す売り手側の見方を重く使う。", "p4": "倒産ラベルは信用格付会社のバーゼルIIの定義に基づく記録で、倒産企業は各年約1%。企業を7:1:2に分け、AUCから求める正確度比率（AR＝2×AUC−1）で、ロジスティック回帰・XGBoost、通常のGNN、多関係GNN、多重グラフモデルと比べる。過去の倒産歴がない企業（NoHist）での性能を特に重視し、過去の年で学習し将来の年で試す時点外検証も行う（§5.1、§5.4）。", "p5": "取引相手に倒産歴がある企業は将来の倒産率が高く、売る側・買う側のどちらの取引でも、また取引規模が大きいほどリスクが高かった（§3.2、図1〜5）。DefaultGNNはすべての年で比較手法を上回り（Wilcoxon検定 p=0.016、表2）、アブレーションでは完全版のARが全体0.583・倒産歴なし企業0.472で、片側の見方だけ（0.544・0.420前後）や重みなし（0.535・0.408）より高かった（表3）。格付会社との検証で、既存の信用スコアと併用すると、承認企業の倒産リスクを増やさずに承認率が7〜11ポイント上がった（抄録）。", "p6": "著者は、財務諸表がない条件を想定して非財務の属性だけを使ったと述べており、データは韓国の特定の税額票システムの利用企業に限られる（§3.1、§3.4）。解釈：実運用の検証の詳細は抄録と§6の範囲で、承認率の改善がどの条件で得られたかは確認が要る。未査読のプレプリントである。", "unverified": "表2の年別・手法別のARの値と、実運用検証（§6）の条件の詳細は確認していない。"}}, {"theme": "LLM熟議・ペルソナ", "headline": "ペルソナ付き生成エージェントで反実仮想の議論を作る", "title": "Persona-Conditioned Generative Agents as a Method for Studying Online Communities", "url": "https://doi.org/10.2139/ssrn.7518938", "authors": "Ishita Chakraborty ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 7, "id": "pr07", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "観測されたプロフィールから作ったペルソナ付き生成エージェントを同じ議論の文脈で順に発言させ、参加者の構成を変えたら議論がどう変わったかという観測できない反実仮想の会話を作り、実際の人間の議論と比べて検証する方法を示した（抄録）。", "p2": "オンラインの議論は、誰が参加しどう応じたかで決まる一つの実現経路しか観測できず、参加者の構成が違えば後続の参加者が見る内容も変わるため、別の構成での議論を推し量るのが難しい（抄録）。", "p3": "Redditの利用者の言語的・人口学的な特徴からペルソナを作り、エージェントが同じスレッドで順に投稿するシミュレーションを行う。参加者の抽出確率を変えて、議論の幅や話題が変わるかを試す（抄録）。例：人間のデータで少ない層の抽出確率を上げたスレッドを生成して比べる。", "p4": "エンタメ・ゲーム・人間関係・技術の4領域のRedditの議論を対象に、ペルソナなしの汎用AI、ペルソナ付きAI、実際の人間の議論を、投稿の長さ、一人称の使用、意味的多様性、感情の向きで比べる（抄録）。", "p5": "ペルソナ付きAIは汎用AIより人間の議論に有意に近いが、議論の意味的な幅は狭く、人間より肯定的な調子に偏った（抄録）。少数派の利用者を多く抽出すると話題は一部変わるものの、議論の幅は広がらず、人間の議論の多様性は再現できなかった（抄録）。具体的な数値は抄録にない（未確認）。", "p6": "著者は、人間の行動について結論を出す前に追加の検証が必要な場面があると述べている（抄録）。解釈：比較指標が文章の表面的な性質中心であり、議論の中身の妥当性の評価は抄録からは分からない。未査読のプレプリントである。", "unverified": "本文を読めておらず、使用したモデル、議論の件数、差の大きさは確認できなかった。"}}, {"theme": "LLM熟議・ペルソナ", "headline": "LLMで作る人物像は画一的になりやすい", "title": "PERSONAWEAVER: Controllable Diversity Beyond Conventional Archetypes in Procedural Character Generation", "url": "https://arxiv.org/abs/2609.26629", "authors": "Maan Qraitem ほか", "venue": "arXiv", "date": "2026-09-22", "rank": 8, "id": "pr08", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3手法、表1、§4.1–4.2実験と結果、§6限界）を読んだ。§4.3以降と付録の定量結果は未読", "preprint": true, "p1": "LLMでゲームやシミュレーションの登場人物を大量に作ると、道徳的に善良で素直に答える人物ばかりになる「画一化」が起きることを示し、世界設定と行動の指定を切り離して手作業で整えた道徳的立場と応答の型を割り当てることで、人物の行動の多様性を広げた（抄録、§3）。", "p2": "既存の方法は、LLMに人物を直接作らせる（WorldWeaver）か、大規模なペルソナ集（PersonaHub）から人物像を借りて設定に合わせるかのどちらかで、職業や外見は多様でも、道徳的判断や質問への応じ方はほぼ同じになっていた（§1、§4.2）。", "p3": "行動の部分には、道徳基盤理論を参考にした8つの道徳的立場（思いやりと公正を重んじる、自己利益で規則を曲げる、など）と、8つの応答の型（拒否、はぐらかし、ためらい、素直な回答、余計な情報まで話す、からかい、敵意、質問そのものへの言及）を用意する（表1）。世界の部分は、LLMに設定ごとに10の属性軸（職業、住まい、所属など）と各30の選択肢を作らせ、人格や価値観は含めない。人物ごとに各軸・各型を独立に等確率で引いて組み合わせる（式1）。例：同じ中世の村でも、自分の得だけを考え質問をはぐらかす鍛冶屋が生まれうる。", "p4": "現実的な設定5つと空想的な設定5つで、方法とモデル（GPT-4o、GPT-5.6 Luna、Qwen 3.5 35B-A3B）の組ごとに1,000人を作る。全員に同じ10の規範的な文への4段階の同意と、10の自由な質問への応答を求め、道徳的判断の分布の広さと、拒否・はぐらかし・回答の割合（別のLLMが分類）で多様性を比べる（§4.1–4.2）。", "p5": "既存の方法では、3つのLLMとも道徳的判断が「同意」に、応答が「素直な回答」に集中した（§4.2、図3）。PersonaWeaverは同意と不同意の両方に判断を広げ、拒否やはぐらかしも生んだ。GPT-5.6 Lunaは割り当てた応答の型（特にはぐらかしと質問への言及）に従いにくく、他の2モデルより応答の多様性が小さかった（§4.2、付録C）。「多様にせよ」という一般的な指示を足すだけでは十分でないことも調べている（§4.2）。", "p6": "著者は、評価が道徳的立場と応答の2つの次元に限られること、道徳的判断を粗い分類でしか見ていないこと、各型を等確率で割り当てており設定ごとに望ましい分布は違いうることを限界に挙げ、多様化が不快・危険な振る舞いを再現するおそれにも触れている（§6）。未査読のプレプリントである。", "unverified": "一般的な多様性の指示を足した条件との定量的な差（§4.2後半）と、§4.3の言語・長さ・感情の多様化の数値は確認していない。"}}, {"theme": "LLM熟議・ペルソナ", "headline": "LLMの政治的立場を141か国の人々の分布上に置く", "title": "Locating LLM Expressed Ideology in the Global Distribution of Political Attitudes", "url": "https://doi.org/10.2139/ssrn.7522318", "authors": "Aaron Russell Kaufman ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 9, "id": "pr09", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "141か国114万人の調査回答で推定して固定した項目パラメータ上に65のLLMを置くことで、LLMが表明する政治的立場を一国の標本ではなく世界の人々の分布に対して測れるようにした（抄録）。", "p2": "LLMの回答が左に寄るという懸念の根拠はほとんどが一国（多くは米国）の回答者との比較で、モデルの位置と標本の位置が混ざってしまう（抄録）。", "p3": "国際比較調査の1,153項目を、27社の65モデルに温度0・ペルソナなしで答えさせ、人間の回答から推定した項目パラメータ（項目反応理論の考え方）で、社会的リベラル度、経済の左右、民主主義への支持、反エリート感情の4つの潜在次元の得点にする（抄録）。測っているのはモデルが問われて述べる「表明された立場」であって、モデルが何かを信じているという主張ではない。", "p4": "世界の人間の中央値に対するモデルの位置（百分位）、モデル間のばらつきと人間のばらつきの比、どの調査プログラムの項目を使うかで位置がどれだけ動くかで評価する（抄録）。", "p5": "65モデルはすべて社会的リベラル度で世界の人間の中央値よりリベラル側にあり、中央のモデルは31パーセンタイルに位置した（抄録）。モデル間のばらつきは各次元で人間の標準偏差の11〜33%にとどまり、モデル同士は人間同士よりずっと似ていた。項目の出どころを変えるとモデルの位置は人間の標準偏差の0.28〜0.62だけ動き、国の位置の変化の2〜4倍近くになった（抄録）。", "p6": "著者は、リベラル寄りという向きは尺度を変えても頑健だが、その大きさはモデルと質問票の組み合わせの性質だと述べている（抄録）。解釈：ペルソナなしの既定の回答を測っており、ペルソナを与えた合成回答者の偏りは別に検証が要る。未査読のプレプリントである。", "unverified": "本文を読めておらず、モデルごとの位置や言語の影響は確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "InSARとPINNで都市の大空間構造物を一斉監視", "title": "Urban-Scale Monitoring of Large-Span Spatial Structures Using MT-InSAR: From Physics-Informed Deformation Reconstruction to Graph-Based Regional Risk Screening", "url": "https://doi.org/10.2139/ssrn.7528614", "authors": "Shiqi Zhu ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 10, "id": "pr10", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "衛星の干渉SAR（MT-InSAR）で得た長期の変位を、有限要素モデルの温度応答を弱い物理的事前情報とするPINNで再構成し、近傍グラフで集約することで、都市全域の大空間構造物（体育館・駅舎の屋根など）の危険候補を一度に洗い出す枠組みを示した（抄録）。", "p2": "大空間構造物は都市に多数あり形式も多様で、密なセンサ配置による従来の監視は設置・維持の費用がかさみ、地域全体のリスク選別が難しい（抄録）。", "p3": "①温度応答に合わせた恒久散乱体（PS/準PS）の同時逆解析で変位時系列を得る。②FEMで予測した温度応答をInSARの観測と空間・時間で照らし、支点の鉛直変位と温度差の回帰から「温度感度の区間」を作り、PINN（物理の知識を損失関数に入れたニューラルネット）の弱い事前情報にする。③再構成した特徴をK近傍グラフの節点に集め、重み付き近傍集約と候補マスクで危険度を判定し、点単位に戻す（抄録）。", "p4": "長沙市の約40 km×40 kmの範囲に適用し、候補節点の警告・危険の分類と、代表的な構造物の現地点検の結果で妥当性を確かめる（抄録）。", "p5": "2,079の候補節点から312の警告（Warning）と104の危険（Danger）節点を特定し、代表的な大空間構造物の現地点検で局所的な劣化が見つかった（抄録）。", "p6": "解釈：現地点検は代表的な1構造物にとどまるようで、見逃し・誤検出の割合（検出性能）は抄録からは分からない。温度以外の荷重や季節変動の扱いも未確認。未査読のプレプリントである。", "unverified": "本文を読めておらず、PINNの構成、使った衛星データの期間、判定のしきい値は確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "運動学だけから接触力を推定する統一逆動力学", "title": "A Unified Framework for Indirect Measurement of Human Ground Reaction Forces from Kinematics under Varying Contact Topologies", "url": "https://doi.org/10.2139/ssrn.7519307", "authors": "Jingtao Li ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 11, "id": "pr11", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "床反力計（force plate）を使わずに、人の動き（運動学の計測）だけから地面反力（GRF）と圧力中心を推定する、接触状態が変わっても使える物理的に一貫した逆動力学の枠組みを示した（抄録）。", "p2": "接触条件が変わる多体系の接触力の同定は難しく、床反力計は設置場所が限られ、複雑な歩行中の連続測定ができない（抄録）。特に両足が接地する時期は力の配分が静的に不定になる。", "p3": "人体を18剛体・33自由度の開いた鎖の多体系とし、スクリュー理論とダランベールの原理で全体の動的つり合いを立てる。両脚支持期の不定な配分は、圧力中心が連続的に動くことと反力モーメントが減衰していくことを物理的な制約として加え、最小ノルムの最小二乗解として一意に決める（抄録）。例：階段を上るとき、左右の足にかかる力の分け方を、圧力中心の滑らかな移動を条件に決める。", "p4": "平地歩行と階段上りで床反力計の実測と比べ、さらに公開の運動学データから5つの移動様式の鉛直反力と圧力中心を再構成し、それを使った歩行様式の識別精度で情報が保たれているかを見る（抄録）。", "p5": "再構成した反力は床反力計の値とよく一致し（具体的な誤差は抄録に記載なし・未確認）、再構成信号による歩行様式の識別は独立テストで正解率84.69%だった（抄録）。", "p6": "解釈：一致度の指標や被験者数が抄録にないため精度の程度は判断できない。識別精度は再構成の正確さを間接的に示すにとどまる。未査読のプレプリントである。", "unverified": "被験者数、誤差の指標（RMSEなど）、最小ノルム解の具体的な制約式は本文未入手のため確認できなかった。"}}, {"theme": "VBI・橋梁SHM", "headline": "同一被験者の混入で生体信号分類の精度は水増し", "title": "Subject identity leaks into biosignal classifiers: a multi-dataset audit, a pre-training risk index and an open-source toolkit", "url": "https://doi.org/10.5281/zenodo.22980900", "authors": "Selçuk Özçelik", "venue": "Zenodo", "date": "2026-09-26", "rank": 12, "id": "pr12", "explain": {"basis": "本文", "basis_note": "Zenodoの投稿原稿PDFの本文（方法、データ、考察と報告チェックリスト表3）と図表キャプションを読んだ", "preprint": true, "p1": "生体信号の機械学習で、同じ人の区間が学習とテストの両方に入る「被験者リーク（subject leakage）」による性能の水増しを、学習前に分かるデータの性質から予測する指標と、確認用のツール（leakscope）と報告チェックリストを示した（抄録）。", "p2": "心電図・加速度・脳波などの研究では、長い記録を区間に切って無作為に分けることが多く、同じ人の特徴を覚えるだけで高い精度が出てしまうが、その大きさと頻度は整理されていなかった（抄録、§Introduction）。", "p3": "同じデータを、①区間の無作為分割、②被験者内で連続ブロックに分け隣接区間を除く分割、③記録単位、④被験者単位の分割（基準）、⑤1人抜き（LOSO）で評価し、「無作為−ブロック」を隣接によるリーク、「ブロック−被験者単位」を個人識別によるリークに分解する（§Materials and methods、図1）。学習前に計算できる、1近傍法で被験者を当てられる度合い（subject identifiability）とラベルと被験者の依存度から、リスク指標を作る。例：同じ人の心拍が学習にもテストにもあると、不整脈の特徴でなく本人の波形の癖で当ててしまう。", "p4": "公開5データ（MIT-BIH、PTB-XL、UCI HAR、WESAD、Sleep-EDF）に4種のモデル（ロジスティック回帰、k近傍、ランダムフォレスト、1次元CNN）を当て、マクロF1の差を水増し量とする。720の模擬データでリスク指標を検証し、2023〜2026年の同じデータを使った論文100本を無作為抽出して監査する（抄録）。", "p5": "マクロF1の水増しはPTB-XLの0.01以下からMIT-BIHの0.49まで幅があり、曝露と被験者の識別しやすさに従った（抄録、図3）。模擬データでは、リスク指標が柔軟なモデルの識別由来の水増しの85〜88%を説明し、生理的な信号が全くなくてもリークだけで91%の正解率が出た（抄録、図2）。監査では12%の研究が学習に使った被験者で評価しており、40%は判断できるだけの記述がなかった（抄録、図5）。", "p6": "著者は、公式の被験者分離の分割があってもリークは防げていなかったと述べる（§Discussion）。解釈：個人の研究者による単著の投稿中の原稿で、特徴量やモデルの設定は固定したものに限られる。深層学習の大規模モデルでの水増しの大きさは未確認。未査読のプレプリントである。", "unverified": "表1のデータごとの指標値と、監査の個別集計（図5の内訳）は数値を確認していない。"}}, {"theme": "都市・インフラ政策", "headline": "災害時の橋梁補強を多段階で決める強化学習", "title": "An Intelligent Hierarchical Q-Learning Decision-Support Framework for Multi-Stage Bridge-Network Fortification under Disaster Disruptions", "url": "https://doi.org/10.2139/ssrn.7528627", "authors": "Syed Wasif Ahmed ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 13, "id": "pr13", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "災害に備えてどの橋をいつ補強するかを、予算の制約の下で多段階に決める問題を、防御者–攻撃者–防御者の3層最適化と3層の階層型Q学習で解き、解釈できる補強方針を学習できるようにした（抄録）。", "p2": "橋は交通網の中で壊れると地域を分断する重要な要素だが、補強には大きな資源が要り、対象だけでなく実施の時期も決める必要がある。3層の非線形混合整数問題は直接解くのが難しい（抄録）。", "p3": "上位層が予算内の段階的な補強計画を選び、中位層が最も損害の大きい災害シナリオを敵対的に選び、下位層が残った通行可能な網で総交通費用が最小になるよう交通を配分する。この入れ子を階層型Q学習で分解し、交通配分を評価環境として補強方針と被害選択の方針を学ぶ（抄録）。", "p4": "交通研究で標準的なSioux Falls網で評価し、小・中規模の例では厳密解との一致、大規模の例では期待値ベース、近視眼的、中心性ベース、交通量ベース、無作為の方針と比べる（抄録）。", "p5": "小・中規模では厳密またはほぼ厳密な解を得て、大規模では比較した方針をすべて上回った（抄録）。予算に対する強靭性の改善は非線形で、ある投資額を超えると限界的な改善が小さくなり、同じ総予算なら前倒しの補強が最悪時の累積交通費用を減らした（抄録）。", "p6": "解釈：Sioux Falls網は小さな模擬ネットワークで、実際の橋の劣化状態や損傷確率は扱っていないようだ。敵対的な最悪シナリオを前提とするため、確率的な災害評価との違いにも注意が要る。未査読のプレプリントである。", "unverified": "具体的な改善率や計算時間は抄録にないため確認できなかった。"}}, {"theme": "包摂的コミュニティ・社会", "headline": "社会関係資本は自治体の行政成果を高める", "title": "The Effects of Social Capital on Government Performance and Turnover: Evidence from Italian Municipalities", "url": "https://doi.org/10.2139/ssrn.7528956", "authors": "Ben Lockwood ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 14, "id": "pr14", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "イタリアの自治体で、社会関係資本（social capital）が高いほど行政サービスの量と効率が上がり、現職の再選の有利さが弱まることを、操作変数法で示した（抄録）。", "p2": "社会関係資本が政府の成績を高めるという主張は多いが、成績と社会関係資本は互いに影響し合うため因果を切り分けにくく、選挙を通じた経路（規律と選抜）も十分に検証されていなかった（抄録）。", "p3": "成績は公式のOpencivitas指数（自治体の行政サービスの産出と効率）で測り、社会関係資本は近隣自治体の社会関係資本と歴史的な指標を操作変数として扱う（抄録）。1期目と2期目の両方で成績を見ることで、規律（再選のために努力する）と選抜（良い人が選ばれる）を区別する。", "p4": "成績（産出・効率）、現職の再選確率、候補者の特徴（女性の参加など）を結果変数とする（抄録）。", "p5": "社会関係資本が高いと、1期目・2期目とも行政の産出と効率が上がり、規律と選抜の両方が働くことと整合的だった（抄録）。社会関係資本が1標準偏差高いと、立候補した現職の再選確率が3〜6ポイント下がった（抄録）。女性の立候補が増える証拠も一部得られた。", "p6": "解釈：近隣自治体の社会関係資本が成績に直接影響しないという除外制約が識別の鍵であり、その妥当性は本文で確認が要る。社会関係資本の具体的な測り方も抄録からは分からない。未査読のプレプリントである。", "unverified": "社会関係資本の指標の定義、期間、自治体数は本文未入手のため確認できなかった。"}}, {"theme": "包摂的コミュニティ・社会", "headline": "介護する家族は配偶者から子へ、90歳以上で60代が中心", "title": "同居で介護する家族が 65 歳以上である割合は、介護を受ける人が 70〜74 歳で 0.836、85〜89 歳で 0.473 と下がり、90 歳以上で 0.594 に戻る——そのあいだに介護する人は配偶者から子に替わり、90 歳以上では 60〜69 歳の人が 0.570 を占める [M060]", "url": "https://doi.org/10.5281/zenodo.22976042", "authors": "Yuuki Yamagishi", "venue": "Zenodo", "date": "2026-09-26", "rank": 15, "id": "pr15", "explain": {"basis": "本文", "basis_note": "Zenodoの英語版PDFの本文（記法、調査と設計、データ点検、計算4.1・5.1・6.1、図1）を読んだ", "preprint": true, "p1": "令和7年（2025年）国民生活基礎調査（介護票）の公表表から、介護を受ける人の年齢ごとに同居の主な介護者の続柄と年齢を並べ、85〜89歳あたりで介護する人が配偶者から子へ替わることを数値で示した（§5）。", "p2": "介護する家族の高齢化（老老介護）は語られることが多いが、介護を受ける人の年齢によって、介護する人が誰でどの年代かがどう変わるかは、公表表のままでは読み取りにくい（§1）。", "p3": "介護票の第60・61・81・82表（いずれも介護を要する者10万対）を使い、同居の主な介護者に限って、介護を受ける人の年齢階級ごとに配偶者・子・子の配偶者の割合と、介護者が65歳以上・75歳以上である割合を計算する（§2–§5）。表どうしの合計の一致をSHA-256で固定したファイルで点検している（§3）。著者は、設計を表を見たあとに決めたと明記している（§2）。", "p4": "比べるのは年齢階級ごとの割合の並びで、統計的な検定や推定は行っていない。表間の合計の丸め誤差が1以内であることなど、集計の整合性で数値の正しさを確かめる（§3）。", "p5": "家族が主な介護者のとき、配偶者0.383・子0.498で、介護者の0.732が60歳以上だった（計算4.1）。介護者が65歳以上である割合は、受ける人が70〜74歳で0.836と最も高く、85〜89歳で0.473に下がり、90歳以上で0.594に戻る。同じ区間で配偶者の割合は0.857から0.122へ下がり、子は0.111から0.641へ上がった（計算5.1、図1）。90歳以上では介護者の0.570が60〜69歳で、子の配偶者（0.209）が配偶者（0.122）を上回った。図1は横軸が受ける人の年齢、線が続柄・介護者年齢の割合で、配偶者と子の線が交わる位置を見る。", "p6": "著者は、標本調査の推計（10万対）であること、悩み・ストレスの表は使っていないこと、個々の家族の見通しではないことを断っている（抄録）。解釈：独立の個人研究者による公開統計の記述的な再集計で、別居の介護者や事業者を含めた全体像は扱っていない。未査読のプレプリントである。", "unverified": "計算6.1以降（性別の内訳、介護時間）の数値は一部のみ確認した。"}}, {"theme": "職場AI・組織行動", "headline": "目標設定のやり方を途中で変えると成果と幸福が変わる", "title": "Changes in Leaders' Goal-Setting Approaches: Experimental Evidence on Employee Performance, Well-Being, and Work-Related Attitudes", "url": "https://doi.org/10.2139/ssrn.7528825", "authors": "Lena Peters ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 16, "id": "pr16", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "上司の目標設定のやり方が途中で変わること自体の効果を実験で示し、参加型から指示型への変更の悪影響が、指示型から参加型への変更の好影響より大きいという非対称を明らかにした（抄録）。", "p2": "参加型と指示型の目標設定の効果は調べられてきたが、上司のやり方が時間とともに変わった場合の帰結はほとんど分かっていない（抄録）。", "p3": "場面想定法（vignette）の実験に反復測定を組み合わせ、参加者169人に目標設定のやり方の変化（指示型→参加型＝DPC、参加型→指示型＝PDC）を経験させ、成績、幸福感（well-being）、目標へのコミットメントなどを測る（抄録）。", "p4": "「ベストを尽くせ」型の目標と比べた成績の差、変化の前後での各結果の変化、DPCとPDCの効果の大きさの差で評価する（抄録）。", "p5": "参加型・指示型とも「ベストを尽くせ」より成績が高く、両者の間に全体の差はなかった（抄録）。DPCは成績・幸福感・コミットメントを有意に高め、PDCは幸福感とコミットメントを有意に下げ、DPCの好影響はPDCの悪影響より有意に弱かった（抄録）。効果量は抄録にない（未確認）。", "p6": "解釈：場面想定の実験で、実際の職場での長期の関係や成果は測っていない。169人の標本の属性も抄録からは分からない。未査読のプレプリントである。", "unverified": "効果量、課題の内容、参加者の募集方法は本文未入手のため確認できなかった。"}}, {"theme": "職場AI・組織行動", "headline": "AIは信頼より多く使われる：利用と信頼の動機の違い", "title": "Trust as a Complementary Asset: Motives and the Usage-Trust Gap in Artificial Intelligence", "url": "https://doi.org/10.2139/ssrn.7528973", "authors": "Xuan Tran", "venue": "SSRN", "date": "2026-09-26", "rank": 17, "id": "pr17", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の全国代表パネルで、AIの「利用」と「信頼」を分ける動機を分析し、利用は認知度などで広がる一方、信頼は個人的な利益の見込みが生まれないと育たないことを示した（抄録）。", "p2": "人々はAIを信頼する以上に使っており、ChatGPT公開後に利用が広がる中で信頼は下がったという報告があるが、何が利用と信頼を分けるのかは明らかでなかった（抄録）。", "p3": "Teece（1986）の専有可能性の枠組みを使い、社会の信頼を、AI開発企業が必要とするが自前で作れない「補完的資産」と位置づける。Pew Research CenterのAmerican Trends Panel第152波（2024年8月、米国成人5,410人）で、利用と信頼それぞれの規定要因を比べる（抄録）。", "p4": "AIとの接触頻度、重要な決定をAIに任せる信頼、期待される個人的利益・生産性、知覚リスク、政府・企業のAI統治への信頼などの関係を見る（抄録）。", "p5": "57%が週に数回以上AIに接していると考える一方、重要な決定をAIに任せてもよいと答えたのは13%だった（抄録）。信頼は期待される個人的利益と生産性の向上と最も強く関連し、知覚リスクと負に関連した。利用は主にAIの認知度と自己の制御への懸念と関連し、これらは信頼を予測しなかった（抄録）。政府・企業への信頼は、利益とリスクの評価を通じて間接的にのみ信頼と関連した。", "p6": "解釈：横断データのため因果の向きは特定できない。職場でのAI利用に限った分析かどうかは抄録からは分からない。未査読のプレプリントである。", "unverified": "回帰モデルの形式と係数の大きさは本文未入手のため確認できなかった。"}}, {"theme": "会計情報科学", "headline": "米国の外国企業上場廃止法への市場反応は一様でない", "title": "The Market Reaction to Geopolitical Delisting: Evidence from the Holding Foreign Companies Accountable Act", "url": "https://doi.org/10.2139/ssrn.7528505", "authors": "Xu Chen", "venue": "SSRN", "date": "2026-09-26", "rank": 18, "id": "pr18", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の外国企業説明責任法（HFCAA：監査調書の検査に応じない外国企業を上場廃止にし得る法律）に対する中国・香港企業の株価反応を、規制イベントごとに分けて調べ、市場が一様な上場廃止ショックとしては扱っていなかったことを示した（抄録）。", "p2": "地政学的な理由による上場廃止の脅威が株価にどう織り込まれるかは、法律全体でまとめて見られがちで、個々の規制の出来事ごとの違いは分かっていなかった（抄録）。", "p3": "市場調整モデルとFama-Frenchの3因子モデルによるイベントスタディで、監査協力の合意、法定期限の変更、SECによる対象企業の指定、中央国有企業の上場撤退などの出来事ごとの異常リターンを測る（抄録）。", "p4": "各イベントの前後の累積異常リターンの符号と有意性、業種による違いで評価する（抄録）。", "p5": "監査協力と法定期限に関する出来事で最も強い正の反応が見られ、SECによる指定と中央国有企業の撤退の出来事では執行とその波及のリスクが表れた（抄録）。市場は規制の出来事の連なり、業種の関与度、政治的な注目度を通じて上場の脅威を価格に織り込んだと結論している（抄録）。", "p6": "解釈：出来事が重なる時期の交絡（米中関係の他のニュース）への対処は抄録からは分からない。数値が抄録にないため効果の大きさも未確認。単著の未査読プレプリントである。", "unverified": "対象企業数、イベントの日付、異常リターンの大きさは本文未入手のため確認できなかった。"}}, {"theme": "都市・インフラ政策", "headline": "充電待ちの混雑が大型トラック電動化を左右する", "title": "Infrastructure-induced congestion reshapes heavy-duty truck electrification through fleet substitution", "url": "https://doi.org/10.2139/ssrn.7528631", "authors": "Yuheng Zhang ほか", "venue": "SSRN", "date": "2026-09-26", "rank": 19, "id": "pr19", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "大型トラックの電動化で、充電の待ち時間（充電設備の混雑）が一定の条件の下で普及を左右する主因になることを、待ち行列理論による分解で示した（抄録）。", "p2": "大型トラックの電動化の分析は費用の比較が中心で、充電設備の混雑が必要な車両台数（代替に要る車両数）を押し上げる効果はあまり考慮されていなかった（抄録）。", "p3": "待ち行列理論で充電にかかる時間を「サービス時間」と「待ち時間」に分け、設備の利用率と待ち時間から混雑の状態（レジーム）を識別し、待ち時間が非線形に膨らむ効果を捉える（抄録）。例：充電器の利用率が高くなると待ち時間が急に伸び、同じ輸送量を運ぶのにより多くの車両が要る。", "p4": "電池車の費用が50%下がる設定で、混雑を考える場合と考えない場合の普及率を比べ、充電器の数や充電速度を増やした場合の効果を見る（抄録）。", "p5": "経済的な競争力に達したあとは、待ち時間が電池車の普及を決める条件付きの主因になり、待ち時間を無視すると導入判断が偏ることを示した（抄録）。充電器や充電速度を増やすと混雑の効果は和らぐが、待ち時間は代替の費用に影響し続けた（抄録）。数値は抄録にない（未確認）。", "p6": "解釈：どの国・地域の輸送データを使ったか、需要の時間変動をどう扱ったかは抄録からは分からない。未査読のプレプリントである。", "unverified": "対象地域、使ったデータ、普及率の具体的な値は本文未入手のため確認できなかった。"}}, {"theme": "会計情報科学", "headline": "病院の資源配分を会計・臨床・業務データで最適化", "title": "Healthcare Financial Analytics for Optimizing Resource Allocation and Hospital Operating Efficiency", "url": "https://doi.org/10.2139/ssrn.7521999", "authors": "Nathaniel Sackey", "venue": "SSRN", "date": "2026-09-26", "rank": 20, "id": "pr20", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "病院の人員・病床・手術室・設備・資本の配分を支えるため、会計情報・診療活動・業務の流れ・医療の質を結ぶ財務分析の枠組みを文献に基づいて整理した（抄録）。", "p2": "病院の経営者は、安全・質・財務の実現可能性を保ちながら資源を配分する必要があるが、会計情報と臨床・業務のデータをつなげて意思決定に使う枠組みが整っていない（抄録）。", "p3": "診療科別の貢献利益分析、時間主導型の活動基準原価計算（TDABC）、需要と在院日数の予測、容量分析、包絡分析法（DEA）、制約付き最適化、シナリオシミュレーションを組み合わせ、記述・因果・処方の3種の意思決定支援を区別する（抄録）。導入は、意思決定権限と目標の明確化から、監査可能なデータ層、原価と容量の定量化、需要とリスクの予測、臨床・人員の制約の下での最適化、成果の追跡へと段階的に進める。", "p4": "実データによる検証はなく、文献に基づくモデルと例示の値で枠組みを示す論文である（抄録）。", "p5": "主な結論は、財務の指標を患者の転帰、アクセス、人員の持続可能性、実行可能性と合わせて見たときにだけ、財務分析が組織の成果を高めるというもの（抄録）。費用の付け替えや必要な医療の削減、公平性の悪化で利益率を上げることは目指すべきでないと強調している。", "p6": "著者自身が、病院の非公開記録や独自の臨床実験に基づかない文献ベースのモデルだと明記している（抄録）。解釈：枠組みの有効性は実証されておらず、各手法の組み合わせ方の新しさも抄録からは判断できない。未査読のプレプリントである。", "unverified": "本文の4つの分析表の内容と例示値は確認できなかった。"}}, {"headline": "多エージェント討論は単純な無作為の結びつきで十分", "title": "Do We Need Complex Topology Control? Distinct-Peer Random Routing Improves Cost-Efficiency in Sparse Multi-Agent Debate", "url": "https://doi.org/10.48550/arxiv.2609.27150", "authors": "Boxuan Wang ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "rank": 21, "id": "pr21"}, {"headline": "複数LLMの協議は必要なときだけ呼ぶのがよい", "title": "COMED: The Missing Middle Between Routing and Collaboration in Multi-LLM Inference", "url": "https://doi.org/10.48550/arxiv.2609.26913", "authors": "Norah Alballa ほか", "venue": "arXiv", "date": "2026-09-22", "theme": "LLM熟議・ペルソナ", "rank": 22, "id": "pr22"}, {"headline": "ペルソナの文化ラベルより状況変数が振る舞いを決める", "title": "Situational Variables Versus Cultural Labels in Persona Conditioning: Shared Stereotype, Shared Rule", "url": "https://doi.org/10.5281/zenodo.22983112", "authors": "Williams ほか", "venue": "DataCite preprints", "date": "2026-09-26", "theme": "LLM熟議・ペルソナ", "rank": 23, "id": "pr23"}, {"headline": "LLMの出力に含まれる国家プロパガンダを体系的に評価", "title": "Systematic Evaluation of Nation-State Propaganda in LLM Outputs", "url": "https://doi.org/10.31235/osf.io/57buw_v2", "authors": "Kevin T. Greene ほか", "venue": "SocArXiv", "date": "2026-09-27", "theme": "LLM熟議・ペルソナ", "rank": 24, "id": "pr24"}, {"headline": "LLMは紛争の偽情報をどう配り、どう形づくるか", "title": "Generative Visibility Regimes: How Large Language Models Distribute and Shape Political Disinformation Narratives Across Conflicts and Languages", "url": "https://osf.io/cktxg", "authors": "Petter Bae Brandtzæg ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-09-23", "theme": "LLM熟議・ペルソナ", "rank": 25, "id": "pr25"}, {"theme": "LLM熟議・ペルソナ", "headline": "LLMアノテーションの高一致は正確さを保証しない", "title": "Agreement Without Accuracy: Six Systematic Defects an LLM Annotation Study Could Not See in Its Own Reliability Statistics", "url": "https://doi.org/10.31235/osf.io/n3zhf_v1", "authors": "Hon-Ren Lin", "venue": "SocArXiv", "date": "2026-09-26", "rank": 26, "id": "pr26", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（方法、結果の信頼性統計・出現率の節、6つの欠陥の一覧、限界）と表1〜5のキャプションを読んだ", "preprint": true, "p1": "LLMを注釈者（annotator）として使う研究で、同じ設定での再実行一致率などの信頼性統計が高くても、系統的な誤りを見落とし得ることを自らの研究の失敗例で具体的に示し、コードごとの出現率比較と、出力を見る前の盲検読みが最低限の点検だと主張した（抄録、§Limitations）。", "p2": "LLM注釈の信頼性の証拠として、固定シード・温度0での再実行の一致（test–retest agreement）が安価なためよく使われるが、それが正確さを保証するかは確かめられていない（抄録、§Introduction）。", "p3": "台湾の職業系プログラミング授業の受講生が書いたUMLクラス仕様1,902件を、参照仕様と照合して誤りコードを付ける課題で、①元の単一段階プロンプト（v1）、②コード定義を検査可能な条件に書き直した版（v1+）、③3段階に分けたパイプライン（v2：対応表作成→対ごとの判定→階層の読み取り）を各2回実行して比べる（§Method、表1）。", "p4": "信頼性は、2回の実行間の回答単位の完全一致率、コードごとの偶然補正一致（κ）、内部整合性で見る。正確さの手がかりとしては、条件間のコード出現率の比較と、出力を見る前に行った40件の盲検読み（階層宣言の有無の下位コードのみ）を使う（§Method、表4）。", "p5": "3段階化で回答単位の一致率は.647から.845へ上がり（原文の表記）（表2）、どのコードでもκが上がった。しかし条件間でコード出現率が3倍以上動くものがあり（表3）、出力を調べると、与えていない入力を前提にした指示でフラグの64.7%が誤りだったのにκは.971だった、など5つの系統的欠陥が見つかった（抄録、表5）。さらに自分たちの点検ルールは盲検読みと67.5%しか一致しなかった（抄録）。盲検読みの基準では、報告した修正が効いたとは示せなかった（抄録）。", "p6": "著者は、1つのパイプライン・1課題・1モデルの事例報告で欠陥の頻度は言えないこと、盲検読みは1人・40件・1下位コードに限られること、v1だけ実行日が1週間ずれていること、正解データがないため通常の意味での正確さは評価していないことを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "補足資料（コード表・プロンプト）は確認していない。表3の各コードの出現率の数値は一部のみ確認。"}}, {"headline": "同じモデル・同じプロンプトでもハードで答えが変わる", "title": "Same model, same prompts, different answers: item-level cross-hardware reproducibility of LLM evaluation results", "url": "https://doi.org/10.5281/zenodo.22985466", "authors": "Templeman ほか", "venue": "DataCite preprints", "date": "2026-09-27", "theme": "LLM熟議・ペルソナ", "rank": 27, "id": "pr27"}, {"headline": "長引く財務困窮の中での一時的な猶予の効果", "title": "Fleeting Forbearance in a World of Persistent Financial Distress", "url": "https://doi.org/10.18651/rwp2026-13", "authors": "José Mustre-del-Río ほか", "venue": "The Federal Reserve Bank of Kansas City Research Working Papers", "date": "2026-09-18", "theme": "会計情報科学", "rank": 28, "id": "pr28"}, {"headline": "感情状態で会計判断のフレーミング効果が変わる", "title": "WHEN FRAMING FAILS THE ROLE OF AFFECTIVE STATES AS COGNITIVE TRIGGERS IN ACCOUNTING DECISION-MAKING", "url": "https://doi.org/10.2139/ssrn.7528303", "authors": "Amril Amril ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "会計情報科学", "rank": 29, "id": "pr29"}, {"headline": "中小企業向けIFRSの新しい開示で流動性はどう読めるか", "title": "Three New IFRS for SMEs Disclosures and What they May Tell Readers About Liquidity A Document analysis with a Hypothetical example", "url": "https://doi.org/10.2139/ssrn.7524379", "authors": "Doris Msuurshater Mena", "venue": "SSRN", "date": "2026-09-26", "theme": "会計情報科学", "rank": 30, "id": "pr30"}, {"headline": "国連グローバル・コンパクトへの参加は資本市場で評価されるか", "title": "Symbolic or Substantive? United Nations G 2026-09-26", "theme": "VBI・橋梁SHM", "rank": 36, "id": "pr36"}, {"headline": "BRICS諸国のコンセッションとPPPの規制を比較", "title": "Concessions and Public-Private Partnerships in the Expanded BRICS Comparative Regulatory Frameworks and Practices for Private Capital Mobilization -A Comparative Analysis and Literature Synthesis", "url": "https://doi.org/10.2139/ssrn.7518858", "authors": "Paulo Roberto Silva", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "rank": 37, "id": "pr37"}, {"headline": "共同体のための空間配置を測る指標で土地利用を最適化", "title": "Introducing the Spatial Communal Index for Land-use Planning and Layout Optimization: a Case Study of Lagos State Settlement Typologies", "url": "https://doi.org/10.2139/ssrn.7523979", "authors": "Praise Anyanwu", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "rank": 38, "id": "pr38"}, {"headline": "欧州の乗用車の実走行エネルギーと温室効果ガスの大規模分析", "title": "A Comprehensive Real-World Analysis of Energy Use and GHG Emissions of the Light Duty Vehicle Fleet in Europe", "url": "https://doi.org/10.2139/ssrn.7517979", "authors": "Anne Bouter ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "都市・インフラ政策", "rank": 39, "id": "pr39"}, {"theme": "都市・インフラ政策", "headline": "都市の暑熱研究・特許・報道を2万報規模で横断", "title": "What the World Studies, Invents and Reports About Urban Heat", "url": "https://doi.org/10.17613/bh2an-0af97", "authors": "Narendra Kumar", "venue": "SocArXiv", "date": "2026-09-26", "rank": 40, "id": "pr40", "explain": {"basis": "抄録", "basis_note": "KC Worksのページから抄録を取得。本文PDFは読んでいない", "preprint": true, "p1": "都市のヒートアイランドに関する論文20,422報（抄録のある17,101報は文単位）を読み、ニュース・特許・熱中症などの事故記録・企業登記・資金調達と結合した公開コーパス（UHRC）を作り、研究・報道・発明・市場が都市の暑さをどう扱ってきたかを並べて示した（抄録）。", "p2": "都市の暑熱は研究も報道も急増しているが、研究が扱う原因・場所・対策と、報道や特許・市場の動きが一致しているかを横断的に見た資料はなかった（抄録）。", "p3": "1990〜2025年の論文20,422報（抄録のある17,101報を文ごとに分類）、2021〜2025年のニュース96,726件、特許4,123ファミリー、暑熱事故14,576件、企業・資金調達の記録を結合する。研究から抽出した原因の分類は独立の第2の読み手で検証し、通らなかった3分類は結果に使っていない（抄録）。", "p4": "論文数の伸び、原因の帰属の割合、研究と報道の冒頭文の内容の違い、国・都市ごとの研究と報道の偏り、特許と研究の伸びの比、街路樹による冷却効果の報告値を比べる（抄録）。", "p5": "分野の伸びは学術文献全体の約9倍で、原因を述べた2,409報の48%が都市化・土地利用の変化を挙げ、人工排熱への帰属は18.4%から7.7%へ下がった（抄録）。中国は研究の31%を占めるが英語報道では2.3%にとどまり、遮熱・透水性舗装の特許は10年で12倍に増えたのに研究は2.4倍だった。194研究の街路樹の冷却効果の中央値は2.0℃だった（抄録）。", "p6": "解釈：民間の分析会社による未査読のプレプリントで、報道は英語中心、企業データはインドの会計に偏る。冷却効果の中央値は測定条件の異なる研究をまとめた値で、比較には注意が要る。", "unverified": "本文を読んでおらず、分類の方法と第2の読み手の一致率は確認できなかった。"}}, {"headline": "AIによる人事評価のフィードバックと従業員の反応", "title": "AI-Enhanced Performance Appraisal Systems: Assessing the Interplay Between Machine Feedback, Employee Motivation, and Career Mobility", "url": "https://doi.org/10.5281/zenodo.22932876", "authors": "Dhanraj Kalgi ほか", "venue": "Zenodo", "date": "2026-09-30", "theme": "職場AI・組織行動", "rank": 41, "id": "pr41"}, {"headline": "AIで作業が安くなると専門家の価値は検証と責任に移る", "title": "Liability, Verification, and the Market for Expertise in the Presence of AI", "url": "https://doi.org/10.2139/ssrn.7524324", "authors": "Ricardo Pasquini", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "rank": 42, "id": "pr42"}, {"headline": "生成AIの仕事では文脈の組み立てと維持が成果を左右", "title": "Context Systems and Context Fitness in Generative AI Work: A Dynamic Framework for Constructing, Maintaining, and Validating AI Context", "url": "https://doi.org/10.2139/ssrn.7530019", "authors": "Valeriana Colon", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "rank": 43, "id": "pr43"}, {"headline": "政府の後押しは製造業のAI導入意向を高めるか", "title": "Government Initiatives and AI Adoption in Manufacturing: An Institutional Extension of the Technology Acceptance Model in Singapore", "url": "https://doi.org/10.2139/ssrn.7529141", "authors": "Shashi Bhushan ほか", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "rank": 44, "id": "pr44"}, {"headline": "経験を否定せずにAIを受け入れる学び直しの枠組み", "title": "Unlearning without Self-negation: An Asset–liability Framework for AI Adoption by Owner-operators in Traditional Industries", "url": "https://doi.org/10.2139/ssrn.7524062", "authors": "Yong-Ho Kim", "venue": "SSRN", "date": "2026-09-26", "theme": "職場AI・組織行動", "rank": 45, "id": "pr45"}], "pre_notable": [{"field": "機械学習", "headline": "ツール応答でなく編集を予測する世界モデル", "title": "Agent-Editing World Model: Rethinking World Modeling for LLM Agents", "url": "https://arxiv.org/abs/2609.28416", "authors": "Shuang Sun ほか", "venue": "arXiv", "date": "2026-09-25", "why": "LLMエージェントの世界モデルを、観測の再構成ではなく行動の編集として捉え直す提案で、長期タスクのエージェント設計の考え方を変えうる。", "rank": 1, "id": "pn01", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§2手法、§4.1実験設定、§4.3–4.4結果、§7結論）を読んだ。付録と表1の個別数値は一部のみ確認", "preprint": true, "p1": "LLMエージェントの「世界モデル」を、道具の応答（観測）を予測するものから、エージェント自身の推論と行動の良し悪しを判定して実行前に書き換えるものへと作り替え、長い作業の途中で誤った前提が履歴に残り判断を歪める問題を減らした（抄録、§2）。", "p2": "従来の言語の世界モデルは環境からの観測を予測するが、検索結果やコマンド出力のような実行次第で変わる応答を再現しても、実際の応答が得られる場面では価値が小さい。一方、エージェントは根拠のない仮定や古い計画を履歴に残し、それが後の判断を歪める「タスク状態の汚染（task-state contamination）」に陥る（抄録、§2.1）。", "p3": "AEWMは、①Action Judge：実行前の推論・行動の組を「重要（critical）」「探索的（exploratory）」「雑音（noisy）」に分類し、②State Revision：雑音と判定された組だけを同じ履歴から書き直す（式2）。書き直した行動は実環境で実行され、その結果で履歴が更新される（式3）。これを行動と組み合わせたものがEditActで、同じ結果を出すかの予測ではなく、状態そのものを直す点が従来と違う（式1）。例：検索エージェントが根拠のない推測を事実として次の検索を組もうとすると、それを雑音と判定し、根拠を取りに行く行動に書き換える。", "p4": "検索（BrowseComp、DeepSearchQA）、端末操作（Terminal-Bench 2.0）、ソフトウェア開発（SWE-Bench Pro、Doc2Repo、NL2Repo）の6ベンチマークで、Qwen3.5の3規模のエージェントに対し、ReAct、各手番で3候補から検証器が選ぶBest@3、軌跡単位のBest@3と比べる。各3回の平均で評価する（§4.1）。", "p5": "Action Judgeの独自ベンチマークでマクロF1 70.5%となり、最強の先端モデルを10.6ポイント上回った（抄録）。EditActは6ベンチマークすべてで比較手法を上回り、最強の比較手法に対する平均の上積みは4B・9B・35Bのエージェントでそれぞれ6.7・5.2・3.2ポイントだった（§4.3、表1）。9BにEditActを付けると35BのReActを上回った（44.1対42.2）。EditActの軌跡で追加学習したAEWM-RFTは、AEWMなしでも自己の成功軌跡での学習（Self-RFT）を2.2〜2.6ポイント上回った（§4.4、表2）。", "p6": "著者は、より強いエージェント（Qwen3.5-Plus）では端末・開発での改善が限られ、AEWMとエージェントの能力差が原因と考えられると述べている（§4.3）。解釈：学習データの一部は非公開の検索データで、判定のラベルも別のLLMで作られており、判定基準の偏りが結果に影響する可能性は残る。未査読のプレプリントである。", "unverified": "付録Bの判定ベンチマークの構成と、表1のベンチマーク別の数値は確認していない。"}}, {"field": "機械学習", "headline": "未知の人工世界でAIの探索力を検証する", "title": "ExplorationBench: Measuring AI Systems' Exploration in Verifiable Alien Worlds", "url": "https://arxiv.org/abs/2609.30199", "authors": "Ming Zhang ほか", "venue": "arXiv", "date": "2026-09-25", "why": "仮説を立て実験で確かめる『探索』能力を、正解が検証できる架空世界で測るベンチマークで、AIによる科学的発見の評価基盤になりうる。", "rank": 2, "id": "pn02", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3ベンチマーク設計、§4結果のRQ1・RQ3、§6限界）と図表キャプションを読んだ。RQ2と付録は未読", "preprint": true, "p1": "AIが仮説を立て実験し結果から学ぶ「探索」の力を、規則が既知の知識と食い違うため暗記では解けず、しかも答えが厳密に検証できる人工の「異星世界」で測るベンチマーク（ExplorationBench）を作った（抄録）。", "p2": "科学的探索の評価では、本当に新しい仮説が正しいかをどう確かめるか、探索で見つけたのか事前学習の知識を思い出しただけなのかをどう見分けるか、が難しい（抄録）。", "p3": "2つの砂場を用意する。AlienCodeは見慣れた演算子が隠れた別の意味で動く小さな計算言語（発見目標31、未見課題70）、AlienLogicは推論規則の一部を書き換えた一階述語の自然演繹（発見目標24、課題70）。システムには誤りを含むマニュアルと例題を渡し、プログラムや証明を「探り（probe）」として投げると、実行結果や検証結果が返る。4ラウンド探索したあと、道具を使えない別の会話で、見つけた規則の報告と未見課題への解答を求める（§3.1–3.2）。例：「+」が実は別の計算をする言語で、試しにプログラムを走らせて出力から規則を推測する。", "p4": "採点はインタプリタと証明検査器で行い、LLMの判定は使わない。10の先端AIシステムがそれぞれ3本の探索軌跡を走らせ、探索前（M0）から4ラウンド後（M4）の未見課題の正答率で比べる。自分で探りを選ぶ条件、最良軌跡の探りを後から与える条件、固定の探りの条件、道具なしの条件を比べて、実験を設計すること自体の寄与を分ける（§3.1、§4.1）。", "p5": "AlienCodeでは探索前はどの軌跡も15.7%以下だったが、4ラウンド後の最良（Best@3）は87.6%に達し、10システム中7つが60%を超えた（§4.2.1）。AlienCodeの中央値は、自分で探りを選ぶと66.0%、同じ探りを後から与えると40.7%、固定の探りでは5.7%で、実験を自分で設計することが効いていた（図4）。一方で同じシステムでも軌跡間の差が最大72.8ポイントあり、30軌跡中6本は途中より3ポイント以上下がって終わった（§4.2.3、図9・10）。", "p6": "著者は、決定的で実行可能な2つの世界に単純化しているため、雑音や不完全な観測、費用のかかる実験、開かれた仮説空間、長い探索期間を含む実際の科学的発見の能力を測るものではないこと、軌跡3本・解答3回では分布を精密に推定できないことを限界に挙げている（§6）。未査読のプレプリントである。", "unverified": "RQ2（規則の発見と使用の関係）の結果と、表1のシステム別の数値は確認していない。"}}, {"field": "経済学", "headline": "カリフォルニアの暑熱規制で労災は減った", "title": "Cooler Laws, Safer Workers: Evaluating California’s Heat Standard and Injury Reduction", "url": "https://doi.org/10.3386/w35772", "authors": "Olesya Fomenko ほか", "venue": "NBER Working Paper", "date": "-", "why": "暑熱対策の法規制が労災を減らすかを行政データの三重差分で評価し、温暖化下の労働安全政策に直接の根拠を与える。", "rank": 3, "id": "pn03", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、§3データ、§4推定方法と式1、§5結論）を読んだ。結果表の個別の係数は結論の要約で確認", "preprint": true, "p1": "2005年にカリフォルニア州が導入した屋外労働の暑熱基準（水・日陰・休憩・暑熱順化・緊急対応の義務）が、暑い日の労働災害を建設・農業・運輸で15〜27%減らしたことを、労災補償の行政データで因果的に示した（抄録、§5）。", "p2": "暑さが労災を増やすことは多くの研究で示されてきたが、暑熱を対象とする法規制が実際に労災を減らすかの証拠はほとんどなく、導入後の減少が基準によるのか他の要因によるのかも切り分けられていなかった（§1）。米国には連邦の暑熱基準がなく、各州で導入が議論されている。", "p3": "WCRIの労災補償請求データ（発生日と居住地の郵便番号つき）と、PRISMの4km格子の日最高気温を郵便番号区域・日単位で結合し、2002〜2022年の5〜10月の平日を対象にする（§3）。「導入前後」×「暑い日と涼しい日」×「屋外の高リスク産業と事務・専門職」の三重差分で、同時期の労災補償制度改革など州全体の変化を差し引く（§4、式1）。例：同じ区域・同じ暑い日に、建設労働者の労災が事務職と比べて基準導入後にどれだけ減ったかを見る。", "p4": "結果は区域・日・産業ごとの労災件数で、三重の交差項の係数が基準の効果を表す。アリゾナ州を比較対照にした別の推定でも結果を確かめる（§4、§5）。", "p5": "暑い日の労災件数は、建設で15〜17%、運輸で19〜25%、農業で24〜27%減った（§5）。効果は外気温が高いほど大きく、若い労働者で大きかった（抄録）。アリゾナを対照にした推定でも建設と農業の結果は再確認されたが、運輸はやや不安定だった（§5）。", "p6": "著者は、運輸の推定の不安定さを業界全体の空調技術の進歩などで説明しており、データが労災補償請求の40〜80%しか覆わないこと、発生場所を居住地の郵便番号で近似していることを注記している（§3脚注9・10、§5）。解釈：報告されない労災の変化は捉えられない。NBERワーキングペーパーで、査読前の版である。", "unverified": "年齢別・気温区分別の係数の具体的な値は確認していない。"}}, {"field": "因果推論", "headline": "山火事対策の自助を促す誘因設計", "title": "Incentivizing Self-Protection From Wildfires", "url": "https://doi.org/10.3386/w35764", "authors": "Patrick Baylis ほか", "venue": "NBER Working Paper", "date": "-", "why": "住宅周辺の可燃物管理という安価な対策が普及しない理由と誘因の効果を検証し、災害リスク削減政策に示唆を与える。", "rank": 4, "id": "pn04", "explain": {"basis": "本文", "basis_note": "Semantic Scholarで所在が分かったNBERワーキングペーパーのPDF本文（序論、§3処置群、§5.1主要結果、結論）を読んだ", "preprint": true, "p1": "山火事の危険がある米国オレゴン州の住宅で、住宅周りの可燃物の管理（防御空間：defensible space）の無料点検を受けさせるには、情報提供だけでは効かず、100〜500ドルの金銭的誘因が効くことを、2つの無作為化フィールド実験で示した（抄録、結論）。", "p2": "災害の損失は安価な財産保護への投資で減らせるが採用は少なく、山火事の地域では住宅のすぐ近くの植生や燃料を管理すると建物が燃えにくくなるのに、普及活動を広く行っても推奨に沿う住宅は少ない（抄録）。どんな働きかけが実際に行動を変えるかの因果的な証拠が乏しかった。", "p3": "州の消防当局と地域の消防区（ジャクソン郡第3消防区：JCFD3、ユージーン・スプリングフィールド：ESF）と組み、危険地域の住宅を無作為に、①連絡なしの対照群、②山火事のリスクと推奨行動、既存の無料点検の案内を送る「情報提供」群、③それに加えて点検の合格時に補助金を払う「補助」群に割り付ける（§3.2）。補助額はJCFD3で250ドルと500ドル、ESFで100ドルと200ドル。例：同じ地域でも、案内だけの家と250ドルの補助を示された家に分かれる。", "p4": "主要な結果は、処置の期間中に消防区へ点検を申し込んだかどうか（申込率）で、各処置群と対照群の差をt検定で比べる（§5.1、図4）。住宅の価値や山火事の危険度による反応の違い、現地と衛星による植生の測定も調べる（抄録）。", "p5": "JCFD3では対照群の申込は0.6%未満、情報提供群は約3%にとどまり、道徳的な訴えを加えた群は2%未満で対照群と差がなかった（§5.1）。250ドルの補助群は12%が申し込んだが、500ドルの群は7%で、意外にも250ドル群より低かった（§5.1）。ESFでも情報提供群と100ドル群は約3%、200ドル群は約6%だった（§5.1、図4）。補助への反応は価値の高い住宅で大きく、元々の山火事の危険度は反応を予測しなかった（抄録）。", "p6": "著者は、現地と衛星による植生の測定は処置効果の推定にはノイズが大きいこと、補助金を保険料の割引に置き換えて解釈するには文脈の違いに注意が要ることを述べている（抄録、結論）。解釈：申込は点検の依頼であって、実際に可燃物が減ったかは十分には確かめられていない。NBERワーキングペーパーで、査読前の版である。", "unverified": "500ドル群の申込率が250ドル群より低かった理由の分析と、植生の測定結果の数値は確認していない。"}}, {"headline": "深層学習で処置効果を推定し推測まで行う", "title": "Deep Neural Network Estimation and Inference for Treatment Effects with Mixed Binary-Continuous Covariates", "url": "https://doi.org/10.2139/ssrn.7528544", "authors": "Jie Zhou ほか", "venue": "SSRN", "date": "2026-09-26", "field": "統計学", "why": "連続と2値が混在する共変量の下で、深層ニューラルネットによる平均処置効果と群別処置効果の推定と統計的推測を扱い、機械学習による因果推論の理論的基盤を広げる。", "rank": 5, "id": "pn05"}, {"headline": "階層モデルで多数の条件付き効果を一度に推定", "title": "Using Hierarchical Models to Estimate Heterogeneous Effects", "url": "https://doi.org/10.31235/osf.io/vnp8c_v1", "authors": "Joshua Alley", "venue": "SocArXiv", "date": "2026-09-26", "field": "因果推論", "why": "政治学で増え続ける条件付きの理論を、通常の交互作用モデルに代わる階層モデルで扱う方法を示し、異質な効果の推定の実務を変えうる。", "rank": 6, "id": "pn06"}, {"headline": "大規模ネットワークで波及がある内生的処置の効果を識別", "title": "Heterogeneous Effects of Endogenous Treatments with Interference and Spillovers in a Large Network", "url": "https://econpapers.repec.org/RePEc:arx:papers:2512.14515", "authors": "Lin Chen ほか", "venue": "RePEc", "date": "2026-01-26", "field": "因果推論", "why": "処置が内生的で、周囲への波及（干渉）がある大規模ネットワークでの異質な効果の識別と推定を扱い、因果推論の難しい設定を前進させる。", "rank": 7, "id": "pn07"}, {"headline": "事前学習済み埋め込みで画像・文章を計量経済に使う", "title": "Econometrics with Pre-Trained Embeddings for Unstructured Data", "url": "https://econpapers.repec.org/RePEc:arx:papers:2607.17378", "authors": "Yuya Shimizu", "venue": "RePEc", "date": "2026-08-24", "field": "因果推論", "why": "画像や文章を事前学習済みの埋め込みで変数にしたときの推定の偏りと推測を扱い、非構造化データを使う実証経済学の標準的な手順に関わる。", "rank": 8, "id": "pn08"}, {"field": "経済学", "headline": "配偶者の健康が公的介護の利用を抑える", "title": "The Protective Effects of a Healthy Spouse: Medicare as the Family Member of Last Resort", "url": "https://doi.org/10.3386/w35784", "authors": "Itzik Fadlon ほか", "venue": "NBER Working Paper", "date": "-", "why": "配偶者の急な健康悪化が相方の介護施設利用を増やすことを請求データで示し、家族介護の価値と長期介護保険の設計を定量化する。", "rank": 9, "id": "pn09", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパーの本文（序論、結論）を読んだ。推定の各節と付録の表は序論の要約で確認", "preprint": true, "p1": "配偶者が心筋梗塞や脳卒中で急に倒れると、もう一方の配偶者の介護施設入所が約30%増えることをメディケアの請求データで示し、その変化から家族（配偶者）による介護の価値の下限を推定して、長期介護の保険を世帯単位で設計すべきことを示した（抄録、§1）。", "p2": "家族による無償の介護（informal care）は記録されず価値の推計も860億〜5,000億ドル超と幅がある。公的な介護保険は、安価な家族介護がある人ほど公費の介護を使い過ぎる（モラルハザード）おそれと、家族介護のない人の保障不足の間で設計を迫られるが、米国のメディケアは世帯構成に関係なく同じ給付をしている（§1）。", "p3": "メディケアの請求記録で夫婦を特定する独自の対応表を作り、介護施設の全数記録と結ぶ。一方の配偶者が急な健康ショックを受けたときの、もう一方の介護施設利用の変化を推定する。さらに、入院後の熟練看護施設（SNF）の自己負担が21日目から急に上がる制度を使った回帰不連続デザインで、配偶者が健康な人と倒れた人の価格への反応の違いを測り、2本の需要曲線の間の面積を家族介護への支払意思額の下限とみなす（§1）。", "p4": "介護施設への入所確率、配偶者の健康ショック後の健康状態、自己負担の境目での退所率の変化（価格弾力性）を比べ、モデルで最適な補助の水準と給付設計の厚生効果をシミュレーションする（§1）。", "p5": "配偶者の健康ショックで、もう一方の翌年の介護施設入所の確率が平均30%上がり、その多くは家族介護から公的な介護への置き換えだった（§1）。配偶者が健康でないときの公的介護1日の追加の消費者余剰は約568ドル高く、これは介護施設1日の費用の約1.6倍にあたる（§1）。最適な補助は配偶者が病気の人で健康な人より80%大きく、政府支出を一定にしたまま給付を配偶者が倒れた人に移すと社会厚生が13.4%増えるとの試算だった（§1）。", "p6": "著者は、推定値は家族介護の価値の下限であり、公的介護と家族介護の代替性が高いほど実際の価値に近づくと述べる（§1）。解釈：対象は夫婦のそろったメディケア受給者で、子による介護や単身者には直接当てはまらない。NBERワーキングペーパーで、査読前の版である。", "unverified": "健康ショックの推定の細部（事象研究の図、異質性の分析）と動学モデルの前提は確認していない。"}}, {"field": "経済学", "headline": "米中貿易戦争で中国輸出は第三国へ向かった", "title": "The Remains of the Trade: The U.S.–China Trade War and its Aftermath", "url": "https://doi.org/10.3386/w35785", "authors": "Pol Antràs ほか", "venue": "NBER Working Paper", "date": "-", "why": "米国向けから第三国向けへの中国輸出の振り替えと波及を月次データで示し、関税政策の国際的な帰結を評価する。日本を含む第三国への影響を考える材料になる。", "rank": 10, "id": "pn10", "explain": {"basis": "本文", "basis_note": "Semantic Scholarで所在が分かったNBERワーキングペーパーのPDF本文（抄録、§1序論の貢献の要約、§3の輸入競争指数の節の一部、結論）を読んだ。§2のデータの詳細と国別の表は未読", "preprint": true, "p1": "米中貿易戦争で米国向けから第三国向けに振り向けられた中国の輸出が、各国にどう効くかを、「輸出での競争」「国内市場での輸入競争」「消費者の利益」「安い中間財による調達の利益」の4つの経路に分けて理論的に導いた指数で測り、よく使われる貿易品目の類似度指標では見誤ることを示した（抄録、§1）。", "p2": "世界の貿易のGDP比は横ばいで「脱グローバル化」ではないが、2018年以降、誰が何を誰と取引するかは大きく組み替わっている（§1、図1）。第三国への影響は輸出・輸入の品目構成の類似度で近似されることが多いが、それは対称的で、品目ごとのショックの大きさや中国の市場浸透度、代替の弾力性などを含まない（抄録）。", "p3": "最新の関税情報と月次の国際貿易データで、米国の輸入先の変化と中国の輸出先の変化を記録する。そのうえで、中国の品目別の輸出価格の低下を共通のショックとし、国ごとの輸出先・部門・投入産出の結びつきによる影響の受け方（重み）を掛け合わせて、4つの経路の指数を作る（§1）。例：同じ中国製品の値下がりが、ある国には輸出市場での競争として、別の国には安い部品による調達の利益として効く。", "p4": "作った指数と、従来の輸出類似度・輸入類似度の指標との国別の相関と順位の違いを比べ、指数が示す影響の大きさを求める。米国市場への依存度が高かった品目ほど、その後の中国の輸出の振り替えが大きかったかも確かめる（§1、§4）。", "p5": "輸出類似度と輸出競争指数の国別の相関は0.493にとどまり、輸入類似度と輸入競争指数の相関は110か国でほぼゼロ（0.039の負）だった（§1、§3）。輸出競争指数は世界の上位20経済のいくつかで0.4〜0.9%の輸出減少を示し、最も影響を受ける国では輸入競争で国内販売が3%を超えて減り、消費者・調達の利益が1%を超える国もあった（§1）。輸入競争と輸入類似度の上位20か国に共通して入ったのは、チェコ、日本、ポーランドだけだった（§3）。", "p6": "著者は、4つの経路は互いに排他的でなく、1つの国が複数の経路で同時に影響を受けうると述べている（結論）。解釈：指数はモデルに基づく予測値で、実際の各国の輸出や国内販売の変化で検証したものではない。NBERワーキングペーパーで、査読前の版である。", "unverified": "§2の関税と貿易の振り替えの具体的な数値、日本の各指数での順位と値は確認していない。"}}, {"field": "経済学", "headline": "出産の遅れが重なり祖母になる年齢が57歳に", "title": "Compound Delay: The Causes and Consequences of Later Grandmotherhood", "url": "https://doi.org/10.3386/w35773", "authors": "Dora L. Costa ほか", "venue": "NBER Working Paper", "date": "-", "why": "出産年齢の上昇が世代をまたいで重なり、健康な祖母が孫と過ごせる年数を大きく減らすことを示す。少子高齢化の家族への影響を捉える視点で、日本にも当てはまりうる。", "rank": 11, "id": "pn11", "explain": {"basis": "本文", "basis_note": "Semantic Scholarで所在が分かったNBERワーキングペーパーのPDF本文（§3の表1の説明、§4国勢調査の結果、§7の生殖管理の反実仮想、結論）を読んだ", "preprint": true, "p1": "母と娘の2世代の出産の遅れが掛け合わさって、初めて祖母になる年齢を大きく押し上げること（複合的な遅延）を示し、それによって健康なうちに孫と過ごせる年数が28年から15年に減ると推計した（抄録）。", "p2": "出産の高年齢化は本人の世代の問題として論じられがちで、祖父母の世代への影響、つまり娘の出産時期が母親の人生に及ぼす影響は、娘の意思決定には入らない外部性として見過ごされてきた（抄録、§1）。", "p3": "ある年の年齢別の初産率が母と娘の両方に当てはまると仮定し、その分布を自分自身と畳み込んで「祖母になる年齢」の分布を作る（§3）。1960・1980・2000・2024年の出生スケジュールで比べ、さらにIPUMSの国勢調査とACSから学歴・人種別の合成コホートの初産率を作り、避妊など生殖の管理手段へのアクセスの有無の反実仮想で寄与を分ける（§4、§7）。例：母が24歳、娘も24歳で初産なら48歳で祖母になるが、両方が遅れると遅れが足し合わさる。", "p4": "祖母になる年齢の中央値と四分位、60歳までに祖母になる確率、55歳までに祖母になる確率の学歴・人種別の推移、そのうち生殖管理へのアクセスで説明される割合を示す（§3〜§7、表1・表5）。", "p5": "祖母になる年齢の中央値は、1960年の出生スケジュールで約44歳、1980年47歳、2000年50歳、2024年57歳で、13年の上昇のうち約7年は2000年以降に起きた（§3、表1）。2007年と2024年を比べると初産年齢の中央値は24.7歳から27.9歳へ約3年上がっただけだが、祖母になる年齢の中央値は50.7歳から56.1歳へ5.5年上がり、60歳までに祖母になる確率は83%から67%に下がった（§3、図1）。祖母になる時期の遅れは人種より学歴で分かれ、1949年生まれの白人大卒女性では、55歳までに祖母になる確率の低下の56%が生殖管理へのアクセスで説明された（§4、§7）。", "p6": "解釈：表1は期間の出生率を仮想コホートに当てはめた計算で、実際のコホートの経験とは異なりうる（著者も§4以降でコホートの推計に置き換えている）。米国のデータであり、日本の値は示されていない。NBERワーキングペーパーで、査読前の版である。", "unverified": "表5の他の学歴・人種の群の値と、祖母の介護・資金提供の分析（§6）の数値は確認していない。"}}, {"headline": "同じ上司が会議で助けも害もする一貫しないリーダーシップ", "title": "When the Same Leader Helps and Harms: Inconsistent Leadership Behavior in Team Meetings", "url": "https://doi.org/10.31234/osf.io/9pgk7_v1", "authors": "Amelie Verena Güntner ほか", "venue": "PsyArXiv", "date": "2026-09-26", "field": "組織行動・心理的安全性", "why": "建設的な行動と破壊的な行動を同時に見せる「一貫しないリーダーシップ」がチーム会議で部下に与える影響を扱い、心理的安全性とリーダーシップ研究の新しい論点を示す。", "rank": 12, "id": "pn12"}, {"field": "経済学", "headline": "自由移動圏での国際移住の賃金上昇を測る", "title": "The Returns to International Migration in a Free Mobility Setting: Evidence from Austria and Germany", "url": "https://doi.org/10.3386/w35774", "authors": "Andrea Weber ほか", "venue": "NBER Working Paper", "date": "-", "why": "オーストリアとドイツの連結行政データで元同僚を比較群にし、移住による所得の増加とその個人差を推定する。", "rank": 13, "id": "pn13", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "オーストリアとドイツの行政データを国境を越えて結び、元の同僚を比較群にすることで、国際移住による賃金の上昇とその個人差を、移住先にとどまる人と戻る人に分けて推定した（抄録）。", "p2": "国際移住でどれほど所得が増えるか、それが移住者によってどう違うかは、移住する人が選ばれた人であること（選抜）と、帰国後を追えないことのために測りにくい（抄録）。", "p3": "移住前の2〜4年に安定して雇用されていた人を対象に、同じ職場の元同僚をマッチングした比較群とする差の差の分析を行い、出身国と移住先の両方のデータで移住後5年を追う（抄録）。国内の大都市（ウィーン、ドイツの5大都市）への移動も同じ方法で分析して比べる。", "p4": "マッチした元同僚に対する日給の上昇率を、移住の向き、滞在期間（とどまる・1〜4年で戻る・1年未満で戻る）、職場間の既存のつながりの有無で比べる（抄録）。", "p5": "オーストリアからドイツへの移住者は元同僚より日給が約13%上がり、その差はすぐに現れて続いた。ドイツからオーストリアへの移住者は約4%だった（抄録）。差は選抜の違いではなく主にドイツの平均賃金の高さによる。移住先にとどまる人で最も大きく、1年未満で戻る人ではゼロかわずかに負だった。大都市への国内移動では、オーストリア人で約5%、ドイツ人で約10%の上昇だった（抄録）。", "p6": "解釈：言語と制度が近い自由移動圏での結果で、言語や資格の壁が大きい移住への一般化には注意が要る。安定雇用者に限った標本でもある。NBERワーキングペーパーで、査読前の版である。", "unverified": "標本の人数と推定の信頼区間は本文未入手のため確認できなかった。"}}, {"field": "経済学", "headline": "戦後の退役軍人給付で見る給付金の景気効果", "title": "The Macroeconomic Effect of Stimulus Checks: Evidence from Postwar Veterans’ Payments", "url": "https://doi.org/10.3386/w35786", "authors": "Joao Guerreiro ほか", "venue": "NBER Working Paper", "date": "-", "why": "景気と無関係に決まった第二次大戦後の一時給付を自然実験に使い、現金給付が消費と経済に与える効果を推定する。", "rank": 14, "id": "pn14", "explain": {"basis": "抄録", "basis_note": "原文を取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "第二次世界大戦後の米国の退役軍人への一時金を、景気と無関係に決まった「給付金」の自然実験として使い、現金給付が消費をどれだけ、どんな時間の形で押し上げるかを推定した（抄録）。", "p2": "赤字で賄う一回限りの一律給付（stimulus checks）が経済を押し上げるかは、給付の時期が景気に合わせて決まるため、因果効果を識別しにくい（抄録）。", "p3": "戦後の退役軍人への支払いは給付金に似た性質を持ちつつ、支給の時期が景気とは無関係に決まったと考えられる点を使い、移転支出と消費の時間的な反応を推定する（抄録）。「移転乗数」は、移転1ドルあたりの消費の累積の反応である。", "p4": "消費の反応の時間的な形と移転乗数の大きさを推定し、標準的な異質的エージェント・ニューケインジアン（HANK）モデルと、期待が不完全なモデルの予測と比べる（抄録）。", "p5": "支払いは移転を一時的に増やし、消費を持続的な山型（hump-shaped）に押し上げた。移転乗数は6か月後に1、1年後に2を超えた（抄録）。標準的なHANKモデルは山型の反応を再現できず、家計が当初は過小反応し長期では過大反応する不完全な期待を入れたモデルで推定値に合った（抄録）。", "p6": "解釈：戦後直後の経済は供給制約や物価の動きが現在と大きく違い、現代の給付金への一般化には注意が要る。NBERワーキングペーパーで、査読前の版である。", "unverified": "使った消費のデータの頻度と推定方法は本文未入手のため確認できなかった。"}}, {"field": "機械学習", "headline": "品詞はSAEの特徴群として現れる", "title": "Parts-of-Speech as Emergent Categories in SAE Latent Space", "url": "https://arxiv.org/abs/2609.29362", "authors": "Alessandro Bondielli ほか", "venue": "arXiv", "date": "2026-09-25", "why": "スパースオートエンコーダの潜在表現に言語学的カテゴリがどう表れるかを品詞で統制して調べ、言語モデル内部の理解に言語学の知見を持ち込む。", "rank": 15, "id": "pn15", "explain": {"basis": "本文", "basis_note": "arXiv HTML版の本文（§3方法、§4実験設計、§5.1・5.2・5.4結果、限界）と図表キャプションを読んだ。§5.3と付録の数値は未確認", "preprint": true, "p1": "言語モデルの内部表現を疎な特徴に分解するスパースオートエンコーダ（SAE）の中で、品詞（part-of-speech）が「1特徴＝1品詞」ではなく、品詞ごとに大きさの違う特徴のまとまりとして表れていることを、品詞を統制された試験台にして示した（抄録、§5.2）。", "p2": "SAEは言語モデルの表現を人が読める特徴に分ける方法として期待されているが、その特徴がどんな言語学的構造を持っているのか、文法的なカテゴリーが個々の特徴に対応するのか、特徴の群として分散しているのかは分かっていなかった（抄録、§1）。", "p3": "LLaMA-3-8Bの第30層の残差ストリームを公開のSAE（拡大率32倍、4096×32次元）で符号化し、Universal Dependencies英語GUMツリーバンク（14,353文・252,284語）の各語の特徴活性を得る（§3.1–3.2）。品詞ごとにL1正則化ロジスティック回帰で「その品詞か否か」を判別し、正の係数が大きい特徴から順に、その品詞の語の95%で少なくとも1つが活性化するまでの最小の特徴数を数える（§4.2の被覆率の式）。例：名詞を判別する分類器の上位の特徴を足していき、名詞の95%を覆うのに何個要るかを見る。", "p4": "品詞の判別の精度（5分割交差検証のF1）、品詞ごとの必要特徴数、選んだ特徴だけで多クラス分類したときの精度、学習に使わないテストデータと180語の統制データでの活性の安定性を見る。語ごとに品詞を無作為に割り当てた対照プローブで、語の暗記による見かけの精度を差し引く（§4.1–4.4）。", "p5": "ほとんどの品詞でSAEの特徴から高いF1で判別でき、閉じた品詞（前置詞など）や句読点は判別しやすかった（§5.1、図2）。開いた品詞（名詞・動詞など）ほど多くの特徴を使い（図3）、必要な特徴数は品詞によって大きく違った（図4）。選ばれた498特徴（12%は2つ以上の品詞に共有）だけの多クラス分類は、全特徴の場合と同程度の精度だった（§5.2、図5）。無作為ラベルの対照は正解率0.54・マクロF1 0.42で、本来のプローブ（正解率0.88）より大きく低かった（§5.4）。", "p6": "著者は、品詞は言語の1つの階層にすぎないこと、1つのモデル・1つのSAEに限ること、プローブの係数は因果の証拠ではなく介入実験が必要なこと、統制データが小さく名詞と動詞中心であることを限界に挙げている（§Limitations）。未査読のプレプリントである。", "unverified": "本来のプローブのマクロF1が本文では0.97、表2では0.78と食い違っており、どちらが正しいか確認できなかった。§5.3（テストデータでの検証）の数値も未確認。"}}, {"headline": "利払い控除の制限で企業のイノベーションが縮む", "title": "When Tax Shields Shrink: Interest Deductibility Limitations and Corporate Innovation", "url": "https://doi.org/10.3386/w35775", "authors": "Xinru Chen ほか", "venue": "NBER Working Paper", "date": "-", "field": "経営学", "why": "2017年の米国税制改革による利払い控除の制限が、影響を受けた企業の特許と技術の幅を狭めたことを示し、税制と企業の革新の関係に証拠を与える。", "rank": 16, "id": "pn16"}, {"headline": "巨大IT企業による1,200件の新興企業買収の前後", "title": "Digital (Killer?) Acquisitions", "url": "https://doi.org/10.3386/w35762", "authors": "Florian Ederer ほか", "venue": "NBER Working Paper", "date": "-", "field": "経営学", "why": "巨大テック企業8社による新興企業の買収の前後で特許と人材を追い、「革新をつぶす買収」の実態を大規模データで検証する。", "rank": 17, "id": "pn17"}, {"headline": "高校での教職体験は教員の供給と多様性を増やすか", "title": "Can Early Exposure to the Teaching Profession Increase Teacher Supply and Diversity? New Evidence on the Teacher Pipeline", "url": "https://doi.org/10.3386/w35776", "authors": "Danielle Sanderson Edwards ほか", "venue": "NBER
