まらず期待が自己実現し得る状態）が生じるパラメータの範囲が広がった。推定では、製品創出の経路の内生的な増幅が重要で、アニマル・スピリッツも米国の景気循環に無視できない役割を果たしていた（抄録）。", "p6": "本文を読めず、推定の期間やデータ、各ショックの寄与の大きさは未確認。解釈：結果はモデルの特定化に依存する。", "fun": "大企業が強くなると、景気は安定するのでしょうか。このモデルでは逆に、大企業の割合が高いほど、『景気が良くなる』とみんなが思うだけで本当に景気が良くなるような、気分に左右される経済になりやすいことが示されました。市場の集中が、景気の揺れ方そのものを変える可能性があるのです。", "unverified": "本文を読めず、推定値と頑健性は未確認。"}}, {"id": "pn15", "rank": 15, "field": "オペレーションズ・リサーチ", "headline": "動的ロットサイズ問題が多項式で解ける理由", "title": "Grid Theory and Polynomiality in Dynamic Lot-Sizing", "url": "https://arxiv.org/abs/2610.03559", "authors": "El-Mehdi Mehiri ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Mehiri, E.-M., Absi, N., & Suzanne, E. (2026). Grid Theory and Polynomiality in Dynamic Lot-Sizing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03559", "why": "累積生産量の格子構造に注目し、多くのロットサイズ問題が多項式時間で解ける理由を統一的に説明した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3の主格子定理と例1、§6.9、§7の考察）を読んだ。§4〜§6の各族の証明は見出しと要旨のみ", "preprint": true, "p1": "単一品目の動的ロットサイズ問題がなぜ多項式時間で解けるのかを、累積生産量と生産の上下限の『加法的な構造』から統一的に説明する『格子理論』を作り、生産能力の値の種類が計画期間とともに増えても多項式で解ける族があることを示した（抄録）。", "p2": "Wagner-Whitin以来、能力制約付きの問題にはNP困難な場合と多項式で解ける場合が混在し、多項式性は個別の構造の議論で説明されてきた。最適解の累積生産量の候補が少なく済む共通の原理は明示されていなかった（§1）。", "p3": "各再生区間（在庫が0に戻る区間）の中で、高々1期を除き生産量が上下限のどちらかの境界値にとる最適な端点解が存在する（定理1）。これから境界値の部分和の集合（加法的な格子）を作り、最適な累積生産量の軌跡がその離散集合の上に乗ることを示す（定理2、主格子定理）。例：能力をC_t=2^{T−t}とすると、部分和がすべて異なり格子は2^{T−1}以上に膨らむ（例1）。そこで境界値の和を低次元で表せる程度『加法的次元』を導入する（§5）。", "p4": "評価は、格子の大きさが計画期間Tの多項式で抑えられるか、それに基づく格子上の動的計画法が多項式時間で動くかである（§4〜§5）。既存の計算量の結果との対応を表1で整理した（§6.9）。", "p5": "加法的次元が有界なら、多項式時間で作れる格子の包絡と、多項式時間の格子動的計画法が得られた（抄録）。分離可能な凹費用に拡張でき、一定能力、最小発注量、一定数の能力水準、固定次数の多項式能力、周期的能力、区分多項式能力の各族で多項式で解けることを示した（抄録、§6）。", "p6": "有界な加法的次元は多項式性の十分条件であって必要条件ではなく、格子が指数的でもNP困難とは限らない。生産の境界が他の運用上の決定に依存する場合や、エネルギー・排出量など新たな状態変数を加える場合は、そのままでは扱えない（§7.2）。", "fun": "工場で『毎月いくつ作るか』を決める問題は、条件しだいで簡単にも超難問にもなります。この論文は、その分かれ目が、生産能力の値が『何種類あるか』ではなく、『足し算したときにどれだけ整った形になるか』にあると見抜きました。数字の足し算の構造が計算の難しさを決める、という発想の転換が面白い点です。", "unverified": "§6の各族の具体的な計算量の次数は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "エージェントの外枠を意識した小型モデル蒸留", "title": "Harness-Aware Distillation for Small Language Model Agents", "url": "https://arxiv.org/abs/2610.02858", "authors": "Moonseok Choi ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Choi, M., Moon, T., Nam, G., & Lee, J. (2026). Harness-Aware Distillation for Small Language Model Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02858", "why": "道具や文脈管理などの外枠ごと小型エージェントへ知識を移す蒸留法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "文脈・道具・フィードバックを管理する外枠（ハーネス）ごと動く言語モデルのエージェントを小型化するとき、外枠が補えない教師の能力だけに集中して蒸留する手法HADを提案した（抄録）。", "p3": "同じ教師が外枠の情報ありとなしで選ぶ行動を対比した行動選好を、学生自身の推論の後で採点し、外枠の記録と矛盾する選好対は除く。タスク報酬や成功ラベルは要らない（抄録）。", "p5": "複数の長期タスクのエージェント評価とモデルで、同じ外枠の方策上蒸留の基準を上回り、無駄な堂々巡りが減り、誤りからの回復が増えた（抄録）。", "fun": "カーナビ付きの車で運転を教わるなら、ナビが教えてくれる道順を覚える必要はありません。覚えるべきは、ナビの情報を見てどう判断するかです。この研究は、AIを小さくするときにも『周りの道具が補ってくれる部分は学ばず、判断のしかたを学ぶ』のが効率的だと示しました。", "unverified": "使ったベンチマーク名と改善幅の数値は未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "誤りの変化から学ぶ方策上蒸留の反復修正", "title": "Learning from Evolving Errors: Adaptive Iterative Repair for On-Policy Distillation", "url": "https://arxiv.org/abs/2610.02700", "authors": "Rui Li ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Li, R., He, L., Zhang, Z., Huang, Z., Zhu, L., & Liu, Q. (2026). Learning from Evolving Errors: Adaptive Iterative Repair for On-Policy Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02700", "why": "学生モデル自身の誤りを反復的に直すことで方策上の自己蒸留を改善した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "学生モデル自身の誤答から出発し、誤りに合わせた修正の手引きを繰り返し与えて教師が監督する、方策上の蒸留の改良法AIR-OPDを提案した（抄録）。", "p3": "誤答に対して手引き生成器が修正の指針を作り、学生が再挑戦し、なお誤れば新しい誤りに合わせて指針を作り直す。教師は指針を特権情報として受け、最新の誤答の該当部分を監督する（抄録）。", "p5": "DAPO-Math-17Kで学習し、AIME24・AIME25・HMMT25で評価した。Qwen3-4Bと8Bで最良の数学推論の平均を得て、最強の基準を最大3.6ポイント上回り、分布外の評価でも性能を保った（抄録）。", "fun": "答えを丸写しさせても、生徒は自分のどこが間違っていたかは分かりません。この方法は、生徒の間違いを見てから『ここをこう直そう』と段階的にヒントを出す、良い家庭教師のような学ばせ方をAIに当てはめました。", "unverified": "各ベンチマークの個別の得点は未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "幾何と物理で非構造格子のPDE代理モデルを事前学習", "title": "Geometry Meets Physics: Data-Efficient Pre-Training for Unstructured Neural PDE Solvers", "url": "https://arxiv.org/abs/2610.03363", "authors": "Luis Medrano-Navarro ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Medrano-Navarro, L., Baldan, G., Liu, Q., Holzschuh, B., Hagnberger, J., Niepert, M., & Thuerey, N. (2026). Geometry Meets Physics: Data-Efficient Pre-Training for Unstructured Neural PDE Solvers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03363", "why": "3次元の非構造形状でのPDE代理モデルを少ないデータで汎化させる事前学習を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "3次元の非構造格子上の偏微分方程式（PDE）を解くニューラル代理モデルを、大量の事前計算データなしで事前学習する枠組みを示した（抄録）。", "p3": "定常問題では形状の内在的な記述子で複雑な3次元領域の表現を学び、非定常問題では合成したPDEのデータをその場で生成して事前学習する（抄録）。", "p5": "複数の実験で、微調整時の収束が速く、データ効率と精度が高まり、とくに少データの条件で効果が大きかったと報告している（抄録）。", "fun": "シミュレーションを学ぶAIには、本来は高価な計算結果が大量に必要です。この研究は、形の特徴そのものや、その場で作る簡単な練習問題で下地を作っておけば、本番の少ないデータでもよく学べることを示しました。", "unverified": "比較対象と精度の数値は抄録にない。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "物理系のモジュール構造を還元なしに発見する", "title": "Dirac-Interconnected Neural Elements: Discovering Modularity in Physical Systems Without Reduction", "url": "https://arxiv.org/abs/2610.02960", "authors": "Reiho Li ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Li, R., Khosrovian, R. A., Yaguchi, T., Yoshimura, H., & Matsubara, T. (2026). Dirac-Interconnected Neural Elements: Discovering Modularity in Physical Systems Without Reduction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02960", "why": "ディラック構造でつないだ要素で、物理系のモジュール性をデータから見つける手法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "物理系を部品のつながりとして表し、つながり方（ディラック構造）と各部品の特性をデータから同時に学ぶニューラルモデルDINEを提案した（抄録）。", "p3": "系を微分代数方程式として表し、代数的な拘束を核表現のディラック構造で与える。常微分方程式へ縮約せずに部品を学ぶので、部品を取り出したり組み替えたりできる（抄録）。", "p5": "再学習なしに学んだ部品を組み合わせて新しい系を作れ、部分観測の系も扱えることを、既存手法の及ばない物理系で示した（抄録）。", "fun": "ばねとおもりの組み合わせを学んだAIが、部品を組み替えた新しい装置の動きも予測できたら便利です。この研究は、全体をひとまとめに覚えるのではなく、部品とつなぎ方を分けて学ぶことでそれを可能にしました。レゴのように組み替えられる物理モデルです。", "unverified": "対象とした物理系の具体例と誤差の数値は未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "多忠実度の方策勾配でデータ不足の強化学習を安定化", "title": "Multi-Fidelity Policy Gradients Stabilize Data-Scarce Reinforcement Learning", "url": "https://arxiv.org/abs/2610.02505", "authors": "Xinjie Liu ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Liu, X., Zhao, R., Chaudhuri, A., Neary, C., Topcu, U., & Fridovich-Keil, D. (2026). Multi-Fidelity Policy Gradients Stabilize Data-Scarce Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02505", "why": "安価な低忠実度シミュレーションを組み合わせ、少ない実データでも方策勾配を安定させた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "高価で少ない本番データと、安くて偏りのある簡易シミュレータのデータを組み合わせ、偏りなく方策勾配のばらつきを減らす多忠実度方策勾配を、PPOと実ロボットに拡張した（抄録）。", "p3": "低忠実度のデータは制御変量としてのみ使い、推定量に偏りを入れない。サンプリング・アドバンテージ推定・制御変量の作り方を作り直して忠実度間の相関を保ち、推定の不確かさを監視する（抄録）。", "p5": "最も難しい課題の最小予算で、16倍の本番データを使うPPOに並んだ。Franka腕では更新ごとに実機4エピソードだけで、人の実演なしに安定して学習した（抄録）。", "fun": "本番の練習が少ししかできないとき、ゲームの練習で得た勘を、そのまま信じるのではなく『本番のぶれを打ち消す補助』としてだけ使う、という発想です。こうすると、練習と本番の違いに惑わされずに上達を速められます。", "unverified": "課題ごとの詳しい成績は未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "自動運転の安全監視に局所的な適合予測", "title": "Localized Conformal Safety Monitoring with Vision-Language Models for Autonomous Driving", "url": "https://arxiv.org/abs/2610.02765", "authors": "Lu\\'is Marques ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Marques, L., Fang, R., Kamale, D., & Berenson, D. (2026). Localized Conformal Safety Monitoring with Vision-Language Models for Autonomous Driving (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02765", "why": "視覚言語モデルの衝突推定に局所的な適合予測を組み合わせ、確率保証のある監視を作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "視覚言語モデル（VLM）の不確かな衝突予測に、場面に応じた適合予測（conformal prediction）の較正層をかぶせ、確率的な保証のある安全判定に変える手法SLLCPを提案した（抄録）。", "p3": "凍結したVLMの出力を事後に較正し、観測された運転場面に関係する過去の経験に重みを付けて閾値を決める。交換可能性のもとでラベル条件付きの有限標本の被覆を保証する（抄録）。", "p5": "未見の場面のCARLA軌跡1万5千件で、衝突につながる軌跡をQwenで89.6%、Cosmosで88.4%検出した。元のVLMはそれぞれ4.6%と39.1%しか検出できなかった（抄録）。", "fun": "AIの『たぶん安全』は当てになりませんが、過去の似た場面での当たり外れを使って『この確率で見逃さない』と保証付きに変える方法があります。この研究は、場面ごとに似た経験を重視することで、危ない運転計画の見逃しを大きく減らしました。", "unverified": "誤警報率など他の指標は未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "残差の像に注目した大規模疎線形系の解法", "title": "RINS: Residual-Image Neural Subspace Solvers for Large Sparse Linear Systems", "url": "https://arxiv.org/abs/2610.02217", "authors": "Zhongyan Ouyang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Ouyang, Z., Liao, W., Feng, M., Tang, Y., & Yan, J. (2026). RINS: Residual-Image Neural Subspace Solvers for Large Sparse Linear Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02217", "why": "PDE離散化の大規模疎線形系で、残差を説明する補正部分空間をニューラルに学ぶ解法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "偏微分方程式の離散化から生じる大規模な疎な連立一次方程式を、残差を説明する補正の方向をニューラルネットで選ぶ部分空間法Gate-RINSで速く解いた（抄録）。", "p3": "保存した残差のプローブから多項式の補正基底を作り、残差と座標に依存する軽いゲートで調整する。射影した最小二乗の更新はそのままで、ニューラル部分は拡張方向の選択だけを担う（抄録）。", "p5": "6つのPDE由来の課題と2つの規模の多くの設定で、GMRESとグラフのみのニューラル手法より短い実時間で所定の相対残差に達した。グラフ制御器との併用でさらに改善した（抄録）。", "fun": "巨大な連立方程式は、少しずつ答えを直していく方法で解きます。この研究は、どの方向に直すかの『勘』だけをAIに任せ、計算の正しさは従来の数学的な手順で守りました。AIと数値計算の役割分担がうまい例です。", "unverified": "速度向上の倍率は抄録にない。"}}, {"id": "pn23", "rank": 23, "field": "機械学習（Hugging Face）", "headline": "Simulinkモデル生成エージェントを工学要件で評価", "title": "SimuVerity: Benchmarking Agents for Engineering-Grade Simulink Model Generation", "url": "https://arxiv.org/abs/2610.02304", "authors": "Ruiqi Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "Zhang, R., Wang, J., Li, M., Luo, H., Wang, C., Mou, G., Lai, K., Lv, H., Wang, J., Zheng, Y., Yang, A., & Wang, X. (2026). SimuVerity: Benchmarking Agents for Engineering-Grade Simulink Model Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02304", "why": "コンパイルできるかではなく工学要件を満たすかで、モデル生成エージェントを評価する基準を作った。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "文章からSimulinkモデルを生成するAIエージェントを、動くかどうかではなく工学上の要件を満たすかで評価するベンチマークSimuVerityを作った（抄録）。", "p3": "10の工学分野の101課題について、実行可能な系の仕様と4種のシミュレーション場面を用意し、提出・実行・工学的な合格を順に確かめた後、精度や動的応答など6次元で採点した（抄録）。", "p5": "6つのエージェントを評価し、最良でも総合点は42.86にとどまった。構造が参照モデルに似ていることは工学的な性能の代わりにならないと示した（抄録）。", "fun": "プログラムがエラーなく動いても、設計としては使い物にならないことがあります。この研究は、AIが作った制御系のモデルを、橋の設計審査のように『要件を満たすか』で採点しました。満点の半分にも届かない結果は、AIの工学力の現在地を教えてくれます。", "unverified": "エージェントごとの得点と失敗例の詳細は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習（Hugging Face）", "headline": "13言語・多モードのウェブ閲覧エージェント試験", "title": "HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents", "url": "https://arxiv.org/abs/2610.03574", "authors": "Alham Fikri Aji ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "Aji, A. F., Ramadhan, F. R., Zuhri, Z. M. K., Han, S. H. E., Diandaru, R., Cui, Q., Cruz, J. C. B., Chandana, B., Chomphooyod, P., Attia, A., Mansurov, J., Villa-Cueva, E., Nguyen, C. D., Turganov, I., Wu, M., Limkonchotiwat, P., & Nikishina, I. (2026). HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03574", "why": "人手で作り検証した423問で、多言語・多モードの閲覧エージェントの弱点を測る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "13言語・多モードで、ウェブ上の目立たない証拠を何段もたどらないと答えられない423問からなる、閲覧エージェントの高難度ベンチマークHyperBrowseCompを作った（抄録）。", "p3": "母語話者または高い習熟の話者が問題を作り人手で検証した。動画・スキャン文書・画像・地図など異種の情報源を調べる必要があり、ネット接続なしのモデルで解ける易しい問題は除いた（抄録）。", "p5": "複数のモデルを共通のエージェント手順で評価し、一部の問題では人間による評価も行った。抄録には具体的な正答率の記載はない（抄録）。", "fun": "英語以外の言語で、地図や古い書類の画像の中にしか答えがない問題を、AIはどこまで粘り強く探せるでしょうか。この試験は、知識の暗記では解けないよう工夫し、本当に『調べる力』を測ろうとしています。", "unverified": "モデルごとの正答率と人間の成績は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習（Hugging Face）", "headline": "LLM採点者の順序依存を測り減らす", "title": "Equal Ranking Quality, Different Decisions: Measuring and Reducing Order Dependence in LLM Scorers", "url": "https://arxiv.org/abs/2608.26762", "authors": "Markus Frohmann ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "Frohmann, M., Alavi, M. A. A., Lingg, E., & Rekabsaz, N. (2026). Equal Ranking Quality, Different Decisions: Measuring and Reducing Order Dependence in LLM Scorers (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2608.26762", "why": "複数候補をまとめて採点するときの順序依存を測る指標と低減法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "複数の候補を1つのプロンプトでまとめて採点するLLMの採点者で、候補の並び順によって判断が変わる問題を測り、学習で減らす手法OC-SFTを示した（抄録）。", "p3": "同じ候補の並べ替えの間で点数が食い違うことに罰を与える教師あり微調整を行い、閾値で残る集合などの判断の安定性で評価した（抄録）。", "p5": "文章の再順位付けで、nDCG@10の差が0.010以内の5つの採点者でも、並べ替えると残る集合の重なりは0.66〜0.84だった。OC-SFTは順位付けの質を保ちつつ、3つの課題すべてで判断の安定性が最も高かった（抄録）。", "fun": "同じ答案の束でも、上から読むか下から読むかで先生の点数が変わったら困ります。AIの採点者にも同じ癖があり、順位の当たり具合が同じでも合否の線引きは大きく変わる、と示しました。成績表の平均点だけでは分からない落とし穴です。", "unverified": "他の2つの課題の具体的な数値は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "米国の金融政策ショックは中南米にどう波及するか", "title": "The Macroeconomic Consequences of U.S. Monetary Policy Shocks in Latin America", "url": "https://doi.org/10.2139/ssrn.7554698", "authors": "Juan Camilo Laborde Vera", "venue": "SSRN", "date": "2026-10-05", "apa": "Laborde Vera, J. C. (2026). The Macroeconomic Consequences of U.S. Monetary Policy Shocks in Latin America. https://doi.org/10.2139/ssrn.7554698", "why": "中南米5か国の月次データで、米国金融政策の波及を識別付きで推計した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "米国の金融政策ショックが中南米5か国の経済・金融に波及する経路を、高頻度で識別したショックと局所射影で推定した（抄録）。", "p3": "ブラジル・チリ・コロンビア・メキシコ・ペルーの1994〜2019年の月次データに、Bauer and Swanson（2023b）の高頻度ショックを当て、パネルと国別の局所射影で動学的な反応を追った（抄録）。", "p5": "米国の引き締めは商品価格とリスク選好を下げ、国債スプレッドを広げ、通貨安と株安を招いた。各国の中銀は利下げしたが長期金利は上がり、利回り曲線が急になった。引き締めの波及は大きく、緩和の効果は小さいという非対称性があった（抄録）。", "fun": "アメリカが金利を上げると、遠く離れた中南米の国々で通貨や株が下がり、景気が冷えます。しかも地元の中央銀行が金利を下げても、長期の金利は逆に上がってしまう。世界のお金の流れが一つの国の決定に強く左右されることがよく分かる研究です。", "unverified": "効果の大きさ（何%の変化か）は抄録にない。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "AI利用の強度と輸出の集約度、ユーロ圏12か国", "title": "Intensity of Artificial Intelligence Use and the Intensive Margin of Exports: Evidence from Firms in 12 Euro Area Countries in 2025", "url": "https://econpapers.repec.org/RePEc:iza:izadps:dp18939", "authors": "Wagner, Joachim", "venue": "RePEc NEP", "date": "2026-10-05", "why": "2025年の企業データで、AI利用の強度と輸出量の関係を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "ユーロ圏12か国の企業の2025年のデータで、AI利用の強さと売上に占める輸出の割合が正に関連することを示した（抄録）。", "p3": "関数形を仮定しない機械学習の推定量であるカーネル正則化最小二乗（KRLS）を使い、輸出の集約度とAI利用の強度・統制変数の関係を推定した（抄録）。", "p5": "AIをより強く使う企業ほど売上に占める輸出の割合が高かった（抄録）。解釈：横断データの関連であり、因果の方向は抄録からは判断できない。", "fun": "AIをよく使う会社ほど海外によく売っている、という関係が見つかりました。ただ、AIのおかげで輸出が増えたのか、もともと国際的な会社がAIを使いやすいのかは、この分析だけでは区別できません。相関と因果の違いを考える良い題材です。", "unverified": "標本の企業数と効果の大きさは未確認。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "災害で本当に損をするのは誰か、生涯厚生で", "title": "Who Really Loses from Disasters? Life-Cycle Welfare with Experience-Induced Risk Preferences", "url": "https://doi.org/10.2139/ssrn.7565134", "authors": "Martijn de Vries", "venue": "SSRN", "date": "2026-10-05", "apa": "de Vries, M. (2026). Who Really Loses from Disasters? Life-Cycle Welfare with Experience-Induced Risk Preferences. https://doi.org/10.2139/ssrn.7565134", "why": "経験で変わるリスク選好を入れると、災害の生涯厚生損失がどの世代に偏るかが変わることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "災害がリスク選好を変えることを組み込んだライフサイクルの資産選択モデルで、災害の生涯の厚生損失がどの年齢層に重いかを比べた（抄録）。", "p3": "同じ災害が異なる年齢で起きる場合を比べ、CRRA型の選好のもとで、資産の損失と、経験によるリスク選好の変化の影響を分けて評価した（抄録）。", "p5": "働き始めの時期の災害は、資産の損失は小さくても残りの生涯の厚生を約11%下げた。選好の変化そのものの効果は小さいが、所得と資産の同時の損失への対応を変えた。資産ベースと厚生ベースでは同じ補償予算の配分先が変わる（抄録）。", "fun": "災害でなくした財産の額だけで補償すると、若い人の損失を見落とすかもしれません。若いうちに怖い経験をすると、その後ずっと投資に慎重になり、長い人生で得られたはずの豊かさが減るからです。『何を損失と数えるか』で、助けるべき世代が変わることを示しました。", "unverified": "モデルのパラメータ設定の詳細は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "M&Aを行う企業の特徴と業績への効果", "title": "Mergers and acquisitions: firm characteristics and performance effects", "url": "https://econpapers.repec.org/RePEc:bdi:opques:qef_1045_26", "authors": "Irene Di Marzio ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "企業合併・買収の企業特性と業績効果を整理し、競争政策への含意を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "イタリアと欧州の主要国の企業合併・買収（M&A）について、関わる企業の特徴と業績への効果を、商工会議所とOrbisのデータで示した（抄録）。", "p3": "過去10年のM&A案件を記述し、取引後の雇用などの業績を、取引がなかった場合と比べて推定した（抄録）。", "p5": "イタリアでは年に約6,000件のM&Aがあり、技術的に進んだ企業が中心だった。取引から5年以内の雇用は取引がない場合より約4%低く、一部は事業部門の売却による。国際競争にさらされにくい業種では市場支配力の上昇も見られた（抄録）。", "fun": "会社の合併は、効率を上げるためか、競争相手を減らして値段を上げるためか、どちらの面もあり得ます。この研究は、外国との競争が少ない業種でだけ市場支配力が強まることを見つけました。競争の環境が、同じ合併の意味を変えるのです。", "unverified": "比較の方法（反実仮想の作り方）の詳細は未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "景気後退への技能に応じた時間配分の限界", "title": "Limits to Skill-based Countercyclical Adaptation in Business Cycles", "url": "https://doi.org/10.2139/ssrn.7555898", "authors": "Sudong Hua", "venue": "SSRN", "date": "2026-10-05", "apa": "Hua, S. (2026). Limits to Skill-based Countercyclical Adaptation in Business Cycles. https://doi.org/10.2139/ssrn.7555898", "why": "不況時の家計の時間配分による緩衝効果が技能によって限られることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "不況のとき家計が市場労働・家事生産・余暇の間で時間と支出を配分し直す反循環的な適応が、ショックをどこまで和らげるかとその限界を示した（抄録）。", "p3": "静学的な枠組みで、技能の高い家計と低い家計の時間と支出の調整を、代替効果と所得効果、時間とお金の両方を使う消費の観点から分析した（抄録）。", "p5": "技能の高い家計は市場労働を家事に置き換え支出を減らし、低い家計は逆に動いた。調整は時点間より地域間で強く、余暇より家事生産で大きかった。人口属性の違いや、労働市場の硬直性・流動性制約がこの緩衝を弱める（抄録）。", "fun": "不景気で仕事が減ると、外食をやめて自炊を増やすなど、お金の代わりに時間を使って暮らしを守ります。この研究は、その工夫がどの家計でどこまで効くかを調べ、すぐには切り替えられない事情が緩衝を弱めることを示しました。", "unverified": "データの出所と数値の大きさは未確認。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "婚姻習俗改革が地域の起業を増やす", "title": "Marriage customs reform and regional entrepreneurial activity: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7564947", "authors": "Runnan Zhou ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Zhou, R., & Cao, S. (2026). Marriage customs reform and regional entrepreneurial activity: Evidence from China. https://doi.org/10.2139/ssrn.7564947", "why": "結納金をめぐる政策の試行を準自然実験として、地域の起業への効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "中国の婚姻習俗改革（高額な結納金の抑制）の試行が、地域の起業活動を増やしたことを準自然実験で示した（抄録）。", "p3": "2016〜2023年の県・区のパネルで、傾向スコアで共通の範囲に絞った標本に差の差（DID）を当てた。結納金をめぐる118,669件の判決から婚姻関連の支出の指標を作り、三重差で検証した（抄録）。", "p5": "改革は試行地域の起業活動を有意に増やし、頑健性の検定でも保たれた。改革前の婚姻支出の負担が重い地域ほど効果が強い傾向が示唆された（抄録）。", "fun": "結婚のたびに多額のお金が動く慣習を改めると、そのお金が商売の元手に回り、起業が増えた、という結果です。裁判の判決文を11万件以上集めて結納金の重さを測った工夫も面白い点で、慣習という目に見えにくい制度を数字にしています。", "unverified": "効果の大きさ（何%増えたか）は抄録にない。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "州外学生を増やす州立大学、その原因と結果", "title": "Where Does the Tide Roll? The Causes and Consequences of Out-of-State Enrollment at Public Universities", "url": "https://doi.org/10.2139/ssrn.7562460", "authors": "Ryan Haygood ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Haygood, R., & Cooper, C. (2026). Where Does the Tide Roll? The Causes and Consequences of Out-of-State Enrollment at Public Universities. https://doi.org/10.2139/ssrn.7562460", "why": "州の財政支援の減少が州外学生の受け入れを増やす経路と、その影響を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "州の財政支援が減った州立旗艦大学が高所得の州外学生を増やす仕組みと、それが卒業生の州外流出や州財政に与える影響を示した（抄録）。", "p3": "アラバマ大学の20年分の卒業記録を、入試担当の訪問記録と個人の就業履歴に結び付け、訪問の効果を差の差で、州外学生の影響をシフトシェア操作変数で推定した（抄録）。", "p5": "新たな訪問で将来の卒業生が8〜10%増えた。州外学生100人ごとに、州内出身の学生が9〜15人多く卒業後に州外へ出た。州外学生からの収入の余剰は州内学生の半分以上を補助でき、平均で年1万3千ドルの補助に当たる（抄録）。", "fun": "州外の裕福な学生を呼ぶと大学はもうかり、地元学生の学費も支えられます。ところが、州外の友人ができた地元学生が卒業後に州を出ていくという副作用もありました。お金の流れと人のつながりが絡み合う、意外な因果の連鎖です。", "unverified": "州財政の損失額の具体的な数値は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "付加価値貿易で測り直す為替転嫁と貿易弾力性", "title": "Value-added Trade, Exchange Rate Pass-Through, and Trade Elasticity: Revisiting the Trade Competitiveness", "url": "https://doi.org/10.2139/ssrn.7555418", "authors": "Syed Uddin ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Uddin, S., & Aziz, A. (2026). Value-added Trade, Exchange Rate Pass-Through, and Trade Elasticity: Revisiting the Trade Competitiveness. https://doi.org/10.2139/ssrn.7555418", "why": "国際分業の深化で為替転嫁の測り方がどう変わるかを付加価値ベースで示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "国際的な分業（グローバル・バリューチェーン）を考慮した付加価値貿易で為替転嫁率を測り直し、従来の測り方が転嫁率を過大に見積もることを示した（抄録）。", "p3": "世界産業連関データベース（WIOD）、IMFの世界経済見通し、OECDの統計を使い、付加価値ベースの貿易で為替転嫁を推定した（抄録）。", "p5": "付加価値貿易を無視すると為替転嫁率の推定に系統的な上方バイアスが生じた。国際市場への統合が深い部門ほど転嫁率が低いという部門間の違いも大きかった（抄録）。", "fun": "スマホ一台にも、多くの国の部品が行き来して組み込まれています。だから円安になっても、輸出品の値段は単純には変わりません。この研究は、部品のやり取りまで考えると為替の影響が小さく見えることを示しました。", "unverified": "対象期間・国・推定値の大きさは未確認。"}}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "適応外使用の規制と製薬企業の追加承認申請", "title": "Strategic Submissions : An Analysis of Supplemental Drug Approvals", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05752206", "authors": "Pierre Dubois ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "規制変更が製薬企業の追加承認の申請戦略をどう変えたかを分析した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "適応外使用の宣伝を守る2012年の米国の判決をきっかけに、製薬企業が追加の効能の正式承認を求めにくくなったことを示した（抄録）。", "p3": "製薬企業の研究開発プロジェクトの独自データで、規制の変化の前後で、元の効能と追加の効能の承認のハザード（承認に至る速さ）を比べた（抄録）。", "p5": "判決の後、追加の効能の承認のハザードは元の効能に比べて下がった。特許保護・潜在的な市場規模・競争も承認の重要な決定要因だった（抄録）。", "fun": "正式に承認を取らなくても宣伝してよくなると、会社は手間のかかる承認試験をやめてしまうかもしれません。この研究はまさにその変化を見つけました。規制をゆるめると、薬の効き目を確かめる良いデータが作られにくくなる、という思わぬ副作用です。", "unverified": "効果の大きさとデータの規模は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "「市場の1%で十分」という起業家の誤り", "title": "The 1% Fallacy: Defining a Market Small Enough to Win and Forecasting Growth Through Adoption, Capacity, and Risk", "url": "https://doi.org/10.2139/ssrn.7553863", "authors": "Yoram Solomon", "venue": "SSRN", "date": "2026-10-05", "apa": "Solomon, Y. (2026). The 1% Fallacy: Defining a Market Small Enough to Win and Forecasting Growth Through Adoption, Capacity, and Risk. https://doi.org/10.2139/ssrn.7553863", "why": "市場規模からの売上予測の誤りを示し、採用・能力・リスクに基づく予測法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "起業家の『市場の1%を取れば十分』という予測を批判し、勝てる小さな市場の定義と、採用と自社の能力の両側から成長を予測する方法を示した概念的な論文である（抄録）。", "p3": "境界を越えると顧客の必要や価値が大きく落ちるかで正当な市場区分を判定する『境界の崖』と、販売・提供・資金・意図的なリスク上限から成る『内部成長上限』を導入した（抄録）。", "p5": "短期の現実的な売上上限は、採用で制限される需要と内部成長上限の小さい方だと整理し、2005年のTexas InstrumentsのUSB 3.0の事業計画を例に示した（抄録）。", "fun": "『日本の人口の1%が買ってくれれば…』という計算は正しくても、作戦にはなりません。この論文は、まず自分が一番になれる小さな池を決め、そこで本当に今買う人と、自社が作って届けられる量の小さい方を予測にせよと説きます。", "unverified": "概念的な提案で、実証データはない。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "創業者に依存する中小企業の管理の継続性", "title": "Beyond the Founder: Administrative Continuity as a Resilience Mechanism for Founder-led Small Enterprises in Transitional Economies", "url": "https://doi.org/10.2139/ssrn.7557800", "authors": "Viktoriya Sydoruk", "venue": "SSRN", "date": "2026-10-05", "apa": "Sydoruk, V. (2026). Beyond the Founder: Administrative Continuity as a Resilience Mechanism for Founder-led Small Enterprises in Transitional Economies. https://doi.org/10.2139/ssrn.7557800", "why": "移行経済の創業者主導の中小企業で、管理の継続性が回復力の仕組みになることを論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "移行経済の創業者主導の中小企業が、意思決定の速さを保ちながら創業者への依存を減らすための継続性の枠組みを提案した概念的な論文である（抄録）。", "p3": "判断理由の外部化、取引関係の分散保管、段階的な権限委譲、継続性と結び付けた財務計画の4要素を、創業者依存が危険になる仕組みと対応づけた（抄録）。", "p5": "4つの反証可能な命題と、その検証の研究設計を示し、創業者や支援者向けの実務の道具に落とし込んだ。実証結果はない（抄録）。", "fun": "社長一人が取引先も規則も全部頭に入れている会社は、社長が倒れた瞬間に止まってしまいます。この論文は、社長の強みを残したまま、判断の理由を書き残す、取引先との関係を複数人で持つ、といった形で会社を一人に頼らない体にする方法を考えました。", "unverified": "概念的な提案で、検証は今後の課題。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "消費者のLLM利用からネット購買へ至る経路", "title": "From Chatbots to Checkouts: Modeling the Path from Consumer LLM Adoption to E-Commerce Utilization", "url": "https://doi.org/10.2139/ssrn.7554898", "authors": "Miguel A. Figliozzi", "venue": "SSRN", "date": "2026-10-05", "apa": "Figliozzi, M. A. (2026). From Chatbots to Checkouts: Modeling the Path from Consumer LLM Adoption to E-Commerce Utilization. https://doi.org/10.2139/ssrn.7554898", "why": "消費者のLLM採用がネット購買の利用にどうつながるかを属性別にモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "消費者が大規模言語モデルを使い始めてから、ネット通販で使う頻度に至るまでの経路を、1,005人の調査で段階的にモデル化した探索的研究である（抄録）。", "p3": "4段階の同時逐次型一般化順序プロビットモデルを完全情報最尤法で推定した（抄録）。", "p5": "若さ・高学歴・高所得がLLMの採用を促したが、通販での利用頻度には所得は効かなかった。オンライン学習などのデジタルな素地と通販の定期購入が利用を促し、実店舗のスーパーをよく使う人ほど採用も利用も少なかった（抄録）。", "fun": "AIを使い始めるかどうかには所得が効くのに、買い物でどれだけ使うかには所得が関係しない、という結果は面白い点です。入口の壁と、その先の使い込みでは、効いている要因が違うのです。", "unverified": "調査対象国と係数の大きさは未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "米国の生成AI期待で中国企業のSCF言及が減った", "title": "Talking Less About Supply Chain Finance: How U.S. Generative AI Expectations Reshaped Discourse in Chinese Tech Firms", "url": "https://doi.org/10.2139/ssrn.7565256", "authors": "Qiumei Li ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Li, Q., Zhang, Z., & Huang, K. (2026). Talking Less About Supply Chain Finance: How U.S. Generative AI Expectations Reshaped Discourse in Chinese Tech Firms. https://doi.org/10.2139/ssrn.7565256", "why": "生成AIへの期待の高まりが中国テック企業の開示上の話題構成を変えたことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "米国発の生成AIへの期待の高まりを機に、中国のテック企業が年次報告書でサプライチェーン・ファイナンス（SCF）に触れる量を減らしたことを示した（抄録）。", "p3": "年次報告書の語の頻度からSCF開示指数を作り、テック企業とそれ以外を比べる差の差で推定した。ChatGPT公開前から調整が始まるため、期待と注目の期間として解釈する（抄録）。", "p5": "テック企業のSCFの言及は相対的に有意に減った。資金調達の効率指標とは正に関連し、資金制約と負債コストは強まった。著者は技術の断絶に伴う戦略的な語りの再配分と解釈している（抄録）。", "fun": "会社の年次報告書に何をどれだけ書くかは、会社が投資家に何を見せたいかを映します。生成AIの話題が盛り上がると、中国のテック企業は地味な資金調達の話を減らしていました。技術の流行が、遠く離れた国の会社の『語り口』まで変えるという発見です。", "unverified": "標本の企業数と効果の大きさは未確認。"}}, {"id": "pn39", "rank": 39, "field": "統計学", "headline": "砕屑性ジルコンの混合比の信頼度をベイズで評価", "title": "Grading the credibility of detrital-zircon mixing weights: GPU-accelerated Bayesian uncertainty quantification of Jurassic–Cretaceous samples from NE Asia", "url": "https://doi.org/10.2139/ssrn.7564926", "authors": "Lujia Pan", "venue": "SSRN", "date": "2026-10-05", "apa": "Pan, L. (2026). Grading the credibility of detrital-zircon mixing weights: GPU-accelerated Bayesian uncertainty quantification of Jurassic–Cretaceous samples from NE Asia. https://doi.org/10.2139/ssrn.7564926", "why": "点推定で報告されがちな混合比に、GPUを使ったベイズ推定で信頼度を付けた。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "砕屑性ジルコンの起源の混合比を点推定で報告する慣行に対し、ベイズ推定で各混合比の信頼度を個別に評価する枠組みを示した（抄録）。", "p3": "北東アジアのジュラ紀〜白亜紀の15試料について、121通りの事前分布×100回のブートストラップ、計181,500回のMCMCを、GPUで並列化したGoodman-Weare法で74分で回し、emceeと照合した（抄録）。", "p5": "クラトン由来の比率は安定（ばらつき0.000〜0.085）だったが、弧と基盤の配分は不安定で、その不安定さは粒子数のn^(−1/2)の計数雑音（中央値の指数−0.507）で説明でき、年代測定を増やせば減らせると示した（抄録）。", "fun": "砂粒の年代から『この地層の砂は何割がどの山から来たか』を推定するとき、答えの確からしさは比率ごとに違います。この研究は、あいまいさの原因が数えた粒の少なさだと突き止め、『あと何粒測ればよいか』に答えられるようにしました。", "unverified": "試料ごとの推定値は未確認。"}}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "モデル不一致に強いリザバー委員会推定器", "title": "Nominal-Physics-Guided Reservoir Committee Estimator for Highly Maneuverable and Hypersonic Flight Vehicles under Strong Model Mismatch", "url": "https://doi.org/10.2139/ssrn.7564503", "authors": "Yinchao Yang ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Yang, Y., Xu, X., Zhang, X., Tao, T., Li, X., & Zhang, Q. (2026). Nominal-Physics-Guided Reservoir Committee Estimator for Highly Maneuverable and Hypersonic Flight Vehicles under Strong Model Mismatch. https://doi.org/10.2139/ssrn.7564503", "why": "位置しか観測できない高機動の飛行体で、モデル不一致に強い状態推定法を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "詳しい運動方程式が分からず位置しか測れない高機動・極超音速の飛行体で、単純な物理の事前知識とリザバー計算を組み合わせた状態推定器NP-RCEを提案した（抄録）。", "p3": "基本的な物理で位置と速度の伝播を固定し、説明できない残差の動力学をリザバー計算が初期の観測区間から学ぶ。記憶の長さが異なる推定器の委員会を、位置の更新残差に応じて融合する。安定性の上界も示した（抄録）。", "p5": "シミュレーションで、最良の基準に比べ位置のRMSEを約18〜28%、速度のRMSEを約28〜66%減らした。較正と推定の全工程は物理時間の約0.4〜1.4%で済んだ（抄録）。", "fun": "相手の動きの法則が分からなくても、ニュートンの運動の基本だけを土台にし、ずれの部分をAIに学ばせれば追跡できる、という発想です。長い記憶と短い記憶の推定器を組み合わせ、状況に応じて頼る相手を変える工夫が光ります。", "unverified": "シミュレーションの設定の詳細は未確認。実機データでの検証はない。"}}, {"id": "pn41", "rank": 41, "field": "交通・都市計画", "headline": "街路網と都市運用を統合する公開計算基盤", "title": "StreetOps: An Open Computational Framework for Integrating Street Networks and Urban Operations into Adaptive Urban Design", "url": "https://econpapers.repec.org/RePEc:osf:socarx:g3z7j_v1", "authors": "Riggs, William", "venue": "RePEc NEP", "date": "2026-10-05", "why": "街路網・移動・需要・アクセシビリティの分析をつなぐ都市設計の計算基盤を公開した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "都市の運用の観察から、物理的・規制的な街路設計の介入へ移る段階を、再現できる計算手順にする公開の枠組みStreetOpsを提案した（抄録）。", "p3": "中核のOpsGraphで、インフラ・活動・時間条件・運用規則・公共の優先度・衝突・介入候補を、時間と規則を扱える一つのモデルで表す。取得・統合・診断・変換・シナリオ生成・評価の6段階で分析を組み立てる（抄録）。", "p5": "サンフランシスコのヘイズバレーでの自動運転車の乗降を例に、公共交通・アクセシビリティ・歩行者の安全を守りつつ、時間と場所で振り分ける縁石設計に変換できることを示した（抄録）。", "fun": "道路のどこで車が止まり、人が乗り降りしているかはデータで分かっても、『だからこの縁石をこう使おう』という設計への一歩は、これまで専門家の勘に頼っていました。この研究は、その一歩を手順として書き出し、誰でも確かめられるようにしようとしています。", "unverified": "概念実証の定量的な評価結果は未確認。"}}, {"id": "pn42", "rank": 42, "field": "交通・都市計画", "headline": "保護自転車レーンの設計と安全・移動の効果", "title": "Protected Bike Lanes Are Not Created Equal: A Review of Design, Safety, and Mobility Outcomes", "url": "https://econpapers.repec.org/RePEc:osf:socarx:ytrjd_v1", "authors": "Bharati ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "保護自転車レーンの設計要素ごとに安全と移動の効果、意図しない影響を整理した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "保護自転車レーンの効果は、分離があるかどうかではなく、分離の連続性や緩衝帯の幅、交差点の処理など設計の質で決まることを文献から整理した（抄録）。", "p3": "Google Scholarで2026年3〜4月までの文献150件を選別し、66件を対象に構造化した叙述的レビューを行った（抄録）。", "p5": "連続した物理的分離、十分な緩衝帯、よく設計された交差点で安全上の効果が最大だった。保護レーンは通常の自転車レーンより自転車の利用を増やし、渋滞や商店への影響、反対などの副作用は一般に思われているより小さかった（抄録）。", "fun": "『自転車レーンを作れば安全』とは限らず、途中で途切れたり、交差点で車とぶつかりやすい作りだったりすると効果が落ちます。この研究は、レーンを一括りに評価せず、作り方の細部で比べるべきだと示しました。", "unverified": "叙述的レビューで、効果量の統合はない。"}}, {"id": "pn43", "rank": 43, "field": "オペレーションズ・リサーチ", "headline": "一次のみの確率的二層最適化の滑らかさのコスト", "title": "The Minimax Cost of Smoothness in Fully First-Order Stochastic Bilevel Optimization", "url": "https://arxiv.org/abs/2610.03638", "authors": "Wendao Wu ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Wu, W., Zhang, H., Zhang, C., Li, Y., Zheng, C., Fang, C., Li, H., & Lin, Z. (2026). The Minimax Cost of Smoothness in Fully First-Order Stochastic Bilevel Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03638", "why": "一次情報だけを使う二層最適化で、滑らかさの仮定が標本複雑度に与える最小最大の代償を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "一次の確率的な情報だけを使う非凸-強凸の二層最適化で、下位変数の滑らかさの次数pに応じた標本複雑度の上界と一致する下界を証明した（抄録）。", "p3": "既知の上界O(pε^{-4-2/p})の指数が必要かという未解決の問いに、乱択アルゴリズム一般に対する下界を構成し、より一般の滑らかさの条件でも最小最大の複雑度を特徴づけた（抄録）。", "p5": "Θ_p(ε^{-4-2/p})が上下で一致した。無限の次数ではβ=0でΘ(ε^{-4})、β=1でΘ(ε^{-4}log^2(1/ε))となり、定量的な滑らかさなしの解析性だけではΘ(ε^{-6})の複雑度があり得ると示した（抄録）。", "fun": "ある問題を解くのに最低どれだけのデータが必要かを、上からも下からも挟んでぴったり決めるのは、理論研究の到達点の一つです。この論文は、関数が『どれだけ滑らかか』を数で表せると、必要なデータがどう減るかを正確に示しました。", "unverified": "本文の証明は未確認。"}}, {"id": "pn44", "rank": 44, "field": "オペレーションズ・リサーチ", "headline": "ヘッセ行列を時々だけ使う凸最適化のほぼ最適性", "title": "Near-Optimal Convex Optimization with Lazy Second-Order Oracles", "url": "https://arxiv.org/abs/2610.03222", "authors": "Xinliang Zhang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Zhang, X., Chen, L., Liu, C., & Zhang, J. (2026). Near-Optimal Convex Optimization with Lazy Second-Order Oracles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03222", "why": "ヘッセ行列を間引いて使う2次法の計算量をほぼ最適まで詰めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "勾配は毎回、ヘッセ行列はm回に1回だけ使う『怠惰な2次オラクル』の凸最適化で、反復回数の下界と、それに対数因子を除いて一致する手法を示した（抄録）。", "p3": "新しいブロック・ゼロ連鎖の構成で下界Ω(m + m^{1/7}ε^{-2/7})を示し、それを達成する新手法を提案した（抄録）。", "p5": "上界をÕ(m + m^{1/7}ε^{-2/7})とし、従来のÕ(m + m^{13/21}ε^{-2/7})から大きく改善して、対数因子を除き最適であることを示した（抄録）。", "fun": "山の形（曲がり具合）を正確に測るのは手間がかかるので、たまにしか測らずに山を下りる方法があります。この研究は、その『たまに測る』方式で、これ以上速くはできない限界と、それに届く方法の両方を示しました。", "unverified": "本文の証明と数値実験の有無は未確認。"}}, {"id": "pn45", "rank": 45, "field": "オペレーションズ・リサーチ", "headline": "GPUで並列に節点を生成・探索する混合整数の発見法", "title": "PaNGEA: Parallel Node Generation and Exploration Algorithm on GPU", "url": "https://arxiv.org/abs/2610.03090", "authors": "Jean Pauphilet ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Pauphilet, J., & Wu, Y. (2026). PaNGEA: Parallel Node Generation and Exploration Algorithm on GPU (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03090", "why": "GPUで実行可能解を高速に探す混合整数最適化の発見的手法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "混合整数最適化で良い実行可能解を探す発見的手法を、GPUで一度に多数の部分問題を生成・探索する形にしたPaNGEAを提案した（抄録）。", "p3": "線形緩和の求解と、GPUでまとめて実行できる局所探索を組み合わせて制限した部分問題を探索し、変数の固定を一つの発見法に頼らず並列に複数試す（抄録）。", "p5": "MIPcc26とMIPLIBの283問題で、単一節点の発見法をGPUに載せるとCPU版より平均ギャップ積分が8〜18%減り、複数節点の並列探索でさらに12〜19%減った（抄録）。", "fun": "整数で答える最適化問題は、組み合わせが爆発するため、まず『そこそこ良い答え』を早く見つけることが大切です。この研究は、ゲーム画面の描画に使うGPUの並列力で、たくさんの候補を同時に試すことで、その発見を速めました。", "unverified": "最適解までの時間など他の指標は未確認。"}}, {"id": "pn46", "rank": 46, "field": "オペレーションズ・リサーチ", "headline": "ユークリッド巡回セールスマン定数の新しい上下界", "title": "New Bounds for the Euclidean TSP Constant", "url": "https://arxiv.org/abs/2610.02809", "authors": "Zhuolun Dong ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Dong, Z., & Cao, J. (2026). New Bounds for the Euclidean TSP Constant (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02809", "why": "ランダムな点を巡る最短路の漸近定数について新しい評価を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "単位正方形内の一様乱数点をすべて巡る最短巡回路の長さがβ√nに近づくという定理の定数βについて、上下の評価を改善した（抄録）。", "p3": "Beardwood-Halton-Hammersleyの定理の定数βの上下界を新たに導き、さらに重点サンプリングで確率的な評価も与えた（抄録）。", "p5": "従来の0.6277≤β≤0.90367を0.6421≤β≤0.8810に改善した。重点サンプリングでは、少なくとも1−2×10^{-4}の確率で0.6536≤β≤0.8749が成り立つとした（抄録）。", "fun": "地図にばらまいたn軒の家を全部回る最短の道の長さは、nが大きいとほぼβ√nになります。このβの正確な値は60年以上分かっていません。この論文は、βが入る範囲を両側から少し狭めました。単純な問いほど難しい、数学の典型です。", "unverified": "証明の方法の詳細は未確認。"}}, {"id": "pn47", "rank": 47, "field": "オペレーションズ・リサーチ", "headline": "合意形成型最適化の平均場極限を定量化", "title": "Quantitative Mean-Field Limits for Recent Variants of Consensus-Based Optimization Optimization", "url": "https://arxiv.org/abs/2610.02901", "authors": "Konstantin Haug", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Haug, K. (2026). Quantitative Mean-Field Limits for Recent Variants of Consensus-Based Optimization Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02901", "why": "多粒子の勾配を使わない最適化法について平均場極限への収束を定量的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ（学位論文として登録）", "preprint": true, "short": true, "p1": "多数の粒子で勾配を使わずに大域最適を探す合意形成型最適化（CBO）の3つの変種について、粒子数を増やすと平均場方程式に収束することを定量的に示した（抄録）。", "p3": "拡散を一定にしたδ-CBO、合意点を区間ごとに固定する方式、合意点を中心とするガウス分布へ跳ぶ方式を対象に、結合法でカオスの伝播の評価を導いた（抄録）。", "p5": "3変種すべてで、粒子数N→∞で経験測度が対応する平均場方程式の解に収束することを、確率の高い集合上と制限のない場合の2通りで示した（抄録）。", "fun": "たくさんの探検隊がそれぞれ山を探し、ときどき一番良い場所に集まり直すと、全体として一番高い山にたどり着けます。この研究は、隊の数を増やしたときに、その動きが一つの滑らかな方程式で正確に表せることを証明しました。", "unverified": "収束の速さの具体的な次数は未確認。"}}, {"id": "pn48", "rank": 48, "field": "オペレーションズ・リサーチ", "headline": "観測された均衡から目的を学ぶ逆ゲームの扱いやすい学習", "title": "Learning in Inverse Games: Tractable Training with Probabilistic Guarantees", "url": "https://arxiv.org/abs/2610.03481", "authors": "Arghya Mallick ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Mallick, A., Baghbadorani, R. R., Esfahani, P. M., & Grammatico, S. (2026). Learning in Inverse Games: Tractable Training with Probabilistic Guarantees (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03481", "why": "逆ゲームの学習を凸に保ちつつ確率的な保証を与える手法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "観測された均衡行動からプレイヤーの未知の目的を学ぶ逆ゲーム理論で、強単調性を保つ凸な学習の枠組みと、有限標本の予測保証を示した（抄録）。", "p3": "一次条件とNikaido-Isodaの損失を使い、再生核ヒルベルト空間でのHelmholtz-Hodge分解などの作用素の表現で強単調性を担保した。雑音のある系列には後退ホライズンの頑健な学習を作った（抄録）。", "p5": "ラデマッハ複雑度で標本外の予測保証を示し、数値実験で、自動運転車の衝突回避を含む例で予測精度と測定雑音への頑健さを示した（抄録）。", "fun": "他の車の動きを見て、その運転手が何を大事にしているか（急ぎたいのか、安全第一か）を推測できれば、次の動きを予想できます。この研究は、その推測を、答えが一つに決まる扱いやすい形の学習問題にしました。", "unverified": "数値実験の誤差の値は未確認。"}}, {"id": "pn49", "rank": 49, "field": "統計学", "headline": "部分観測下の最適フィルタの漸近安定性をPDEで定量化", "title": "A PDE approach to quantitative asymptotic stability of the optimal filter in the linear detectable setting", "url": "https://arxiv.org/abs/2610.02850", "authors": "Minh Van Hoang Nguyen ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Nguyen, M. V. H., & Park, S. (2026). A PDE approach to quantitative asymptotic stability of the optimal filter in the linear detectable setting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02850", "why": "初期状態が不明な線形検出可能系で、最適フィルタが真の推定に戻る速さをPDEの手法で定量的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "初期状態の分布を間違えて始めた最適フィルタが、正しいフィルタに指数的に追いつくことを、線形で検出可能な系で、初期分布がガウスでなくても示した（抄録）。", "p3": "非正規化フィルタが満たすZakai方程式を調べ、ゲージ変換で有限次元の確率的な部分と無限次元の決定論的な部分に分けて解を表した（抄録）。", "p5": "この表現を使い、χ^pダイバージェンス、全変動ノルム、2-Wasserstein距離で、フィルタの漸近的な指数安定性を示した（抄録）。", "fun": "カルマンフィルタは、雑音の多い観測から本当の状態を推定する道具で、ロケットやスマホの位置推定に使われます。最初の思い込みが外れていても、観測を続ければやがて正しい推定に戻るのか。この論文は、その安心感を、より広い条件で数学的に保証しました。", "unverified": "安定性の速さの具体的な表式は未確認。"}}, {"id": "pn50", "rank": 50, "field": "オペレーションズ・リサーチ", "headline": "拡散過程の法則の凸幾何と確率制御の勾配流", "title": "Convex geometry of diffusion laws and gradient flows for stochastic control", "url": "https://arxiv.org/abs/2610.03487", "authors": "Yupeng Bai ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Bai, Y., Chaintron, L.-P., Ren, Z., & Wang, S. (2026). Convex geometry of diffusion laws and gradient flows for stochastic control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03487", "why": "非凸な確率制御を経路空間の法則で見ると凸構造が現れることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "弱い意味の確率制御を、制御された拡散過程の経路空間上の法則で捉えると、ドリフトについて非凸でも法則については凸になることを使い、収束の保証された勾配流を作った（抄録）。", "p3": "一様に凸な走行コストがブレグマン幾何を生むことを使い、陰的な近接スキームと連続時間のミラー流を構成した。一般の場合は2次BSDEのBMO評価で自然勾配流を大域的に作った（抄録）。", "p5": "最適解への指数収束、離散化の1次の誤差、有限粒子近似の平均場最適からのO(1/N)の差を示し、マルコフの場合はフィードバック制御の指数収束も示した（抄録）。", "fun": "どう舵を切るかで考えると答えの景色がでこぼこでも、『その結果できる道筋の分布』で考えると、なだらかなお椀型になることがあります。見る角度を変えると難問が解きやすくなる、という数学の醍醐味を示す論文です。", "unverified": "本文の証明は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "塔の風遮蔽で列車が揺れる、車間ダンパの効き", "title": "Vehicle–Bridge Interaction Under Bridge-Tower Wind Shielding: Effects of Inter-Car Dampers and Response Interference Between Adjacent Towers", "url": "https://doi.org/10.3390/app16199805", "authors": "Jun Lu ほか", "venue": "Applied Sciences", "date": "2026-10-05", "citescore": 6.1, "citescore_year": "2025", "apa": "Lu, J., Yang, H., Zhang, H., Yang, X., & Jin, Z. (2026). Vehicle–Bridge Interaction Under Bridge-Tower Wind Shielding: Effects of Inter-Car Dampers and Response Interference Between Adjacent Towers. Applied Sciences, 16(19), 9805. https://doi.org/10.3390/app16199805", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Applied Sciencesの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "高速列車が橋の主塔の風下を通るときの急な風荷重の変化に対し、車両間ダンパの揺れの抑制効果と、隣り合う2つの主塔を続けて通るときの応答の干渉を、車両-橋梁相互作用（VBI）モデルで明らかにした（抄録）。", "p2": "主塔による風の遮蔽は、高速列車に働く空気力を急変させ、大きな過渡振動を起こし得る。車間ダンパの効果と、連続する主塔の間の応答の重なりは十分に調べられていなかった（抄録）。", "p3": "車間ダンパを含むVBIモデルを作り、局所的な塔の遮蔽と空間的に一様でない風の場を、区間ごとの準定常の空気力モデルで表した（抄録）。解釈：列車が塔の陰に入る・出るたびに横風が抜けたり戻ったりするのを、区間ごとの荷重の切り替えで表現したものと読み取れる。", "p4": "車体のヨー角加速度と車体端部の横加速度、輪重・横圧などの車輪-レールの安全指標、橋の変位で、ダンパの効果と塔の間隔による干渉の大きさを比べたと読み取れる（抄録）。具体的な車両・橋梁の諸元は抄録に記載がない。", "p5": "車間ダンパは主に隣り合う車体の相対的なヨー運動を抑え、ヨー角加速度と車体端の横加速度を減らしたが、車輪-レールの安全指標と橋の変位への影響は限られた。2つの塔を続けて通ると、1つ目で生じた残留振動が2つ目の応答を増幅も抑制もし、その干渉は塔の間隔が広がるにつれ振動しながら弱まり、主に低次の横揺れのモードに支配された（抄録）。", "p6": "結論はモデル解析に基づき、実測での検証は抄録にない。著者は、応答が重なりやすい不利な塔間隔を避けるよう設計上の注意を促している（抄録）。数値の大きさは本文を読めず未確認。", "fun": "ブランコを押すタイミングがちょうど揺れに合うと大きく揺れ、ずれると揺れが止まります。列車が2本の塔の陰を続けて通るときも同じで、1本目でついた揺れが残ったまま2本目に入ると、塔の間隔しだいで揺れが強まったり弱まったりします。橋の塔の『間隔』が乗り心地を左右するという面白い視点です。", "unverified": "本文を読めず、ダンパの諸元、風速条件、低減率の数値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "橋梁モニタリングから温度応答を物理指標で分離", "title": "Thermal Component Decoupling in Structural Response Time Series Using Time–Frequency Assessment and Digital Signal Method", "url": "https://doi.org/10.3390/buildings16193937", "authors": "Zixiang Yue ほか", "venue": "Buildings", "date": "2026-10-05", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Yue, Z., Yin, Z., Liu, X., & Ding, Y. (2026). Thermal Component Decoupling in Structural Response Time Series Using Time–Frequency Assessment and Digital Signal Method. Buildings, 16(19), 3937. https://doi.org/10.3390/buildings16193937", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Buildingsの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "橋梁モニタリングの応答から温度による成分を取り出すウェーブレットの多重解像度分解で、経験に頼っていたパラメータ選択を、時間・周波数の両面での温度との類似度という物理的な指標で自動化した（抄録）。", "p2": "温度による応答を正確に取り出すことは、温度場から応答を予測する回帰モデルと、安全評価の基準値を作る前提である。従来のウェーブレット分解はパラメータを経験で選ぶため、分離の精度と汎化に限界があった（抄録）。", "p3": "取り出した応答と元の温度データの、時間領域の類似度と周波数領域の類似度の2つの指標を作り、両方を統合して最適なウェーブレットのパラメータの組を自動で決める（抄録）。解釈：温度に由来する成分なら、温度の時系列と形も周波数の中身も似ているはずだ、という物理的な整合性を選択基準にしている。", "p4": "異なるパラメータで処理した応答について、温度場から応答を写す深層学習の回帰モデルを作り、決定係数R²で比べた（抄録）。", "p5": "提案法で処理した応答に対する回帰モデルが最も良い予測性能を示し、R²は0.90に達した（抄録）。他の設定との差の大きさは本文を読めず未確認。", "p6": "評価は回帰の当てはまりという間接的な指標で、温度成分の真値との直接比較ではない（解釈）。対象の橋梁・期間・センサの種類は抄録に記載がなく未確認。", "fun": "橋は昼に温まると伸び、夜に冷えると縮みます。この『温度の揺らぎ』は、傷による小さな変化を隠してしまう厄介者です。この研究は、取り出した成分が本当に温度のせいかを『気温の変化と形も周期も似ているか』で確かめながら、うまく取り除くための目盛り合わせを自動化しました。", "unverified": "本文を読めず、対象の橋梁と比較した設定の詳細は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "開発済み地区で民間負担を集める価値獲得の制度", "title": "Implementing post-development value capture: institutional arrangements in London and Brainport Eindhoven", "url": "https://doi.org/10.3828/tpr.2026.18", "authors": "Simon van Zoest", "venue": "Town Planning Review", "date": "2026-10-05", "citescore": 2.5, "citescore_year": "2025", "apa": "van Zoest, S. (2026). Implementing post-development value capture: institutional arrangements in London and Brainport Eindhoven. Town Planning Review, 1–25. https://doi.org/10.3828/tpr.2026.18", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Town Planning Reviewの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "すでに開発済みの地区で、インフラの受益者である民間から資金の拠出を引き出す『開発後の価値獲得』を実現する制度の組み立てを、ロンドンとアイントホーフェン周辺のブレインポート地域の事例から明らかにした（抄録）。", "p2": "価値獲得（インフラ整備で上がる土地の価値の一部を公共が回収する手法）は新規開発で使われることが多く、既成市街地で民間の拠出をどう実現するかは分かっていない（抄録）。", "p3": "Ostromの制度分析と開発（IAD）の枠組みで、2地域の事例を分析し、民間の受益者間の集団行動を支える制度上の取り決めを特定した（抄録）。解釈：誰が先に払うかの駆け引きや、払わずに得をする者の問題を、ルールの束として整理する方法と読み取れる。", "p4": "評価は事例研究による制度の型の抽出で、定量的な指標はない（抄録から言える範囲）。", "p5": "『チキンゲーム（先に動いた方が損をする駆け引き）を乗り越える』『ただ乗りの問題に対処する』『拠出の内容を定める』という3つのルールの束が見いだされた。公共当局が拠出を促し支えるための4つの戦略的な介入が示され、局所的で協働的な取り決めが開発後の価値獲得の普及を支え得ると論じた（抄録）。", "p6": "2地域の事例に基づき、他の制度環境への一般化は限られる（解釈）。4つの介入の具体的な内容は本文を読めず未確認。", "fun": "新しい駅ができると周りの店や会社は得をしますが、『あなたも費用を少し出して』と頼んでも、誰も最初に払いたがりません。この研究は、ロンドンとオランダの例から、そうした『お見合い状態』をほどくルールの組み合わせを見つけました。お金の問題であると同時に、信頼と約束づくりの問題なのです。", "unverified": "本文を読めず、4つの戦略的介入の中身と事例の詳細は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "AI窓口から人へ戻る客、慣性が乗り換えを阻む", "title": "From Conversational Agents Back to Human Agents? Drivers and Inhibitors of Customer Switching Intention and Behavior", "url": "https://doi.org/10.1002/mar.70280", "authors": "Tobias Marx ほか", "venue": "Psychology and Marketing", "date": "2026-10-05", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Marx, T., Hubert, M., & Mariani, M. (2026). From Conversational Agents Back to Human Agents? Drivers and Inhibitors of Customer Switching Intention and Behavior. Psychology & Marketing. https://doi.org/10.1002/mar.70280", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Psychology and Marketingの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "顧客サービスでAIの会話エージェントから人の担当者へ乗り換える要因を、プッシュ・プル・係留の枠組みで2時点の縦断調査により検証し、慣性と習慣が乗り換えを阻むこと、難しい課題ほど人への乗り換えが起きやすいことを示した（抄録）。", "p2": "企業は効率や即応性のために人の担当者をAIの会話エージェントに置き換えているが、顧客はさまざまな理由で人の対応を求め続ける。何がAIから人への乗り換えを決めるかは分かっていない（抄録）。", "p3": "移住研究のプッシュ（現状への不満）・プル（代替の魅力）・係留（とどまらせる慣性や習慣）の枠組みを用い、研究1で乗り換え意図（N=468）、2か月後に再接触した研究2で自己申告の乗り換え行動（N=237）を測った欧州の顧客の縦断オンライン調査である（抄録）。", "p4": "3要因の意図と行動への効果、課題の難しさによる調整、意図から行動への効果を推定した（抄録）。", "p5": "人の担当者の有用性によるプル要因は乗り換え意図を高め、慣性と習慣による係留要因は意図と行動の両方を抑えた。プッシュ要因はむしろ意図を下げ、AIでの悪い体験が人への乗り換えではなくサービスからの離脱につながる可能性を示した。課題の難しさはプッシュとプルを強め係留を弱め、意図は後の行動を正に予測した（抄録）。", "p6": "自己申告の行動で、欧州の顧客に限られる（抄録から言える範囲）。解釈：実際の通話記録などの行動データでの検証や、業種による違いは本文を読めず未確認。", "fun": "チャットボットにうんざりした客は、人の窓口に乗り換えるかと思いきや、そもそも問い合わせをあきらめてしまう傾向がありました。不満はかえって乗り換えを減らすのです。だから企業は、難しい問い合わせだと分かったら、客が離れる前に『人と話す』ボタンを見える所に出すべきだ、と著者は提案しています。", "unverified": "本文を読めず、係数の大きさとモデルの適合度は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "AI要約の導入でレビュー投稿はむしろ増えた", "title": "Navigating the Sea of Reviews: Unveiling the Effects of Introducing AI-Generated Summaries in E-Commerce", "url": "https://doi.org/10.1287/isre.2024.1282", "authors": "Qili Wang ほか", "venue": "Information Systems Research", "date": "2026-10-05", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "apa": "Wang, Q., SU, Y., Qiu, L., & Chen, R. (2026). Navigating the Sea of Reviews: Unveiling the Effects of Introducing AI-Generated Summaries in E-Commerce. Information Systems Research. https://doi.org/10.1287/isre.2024.1282", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Information Systems Researchの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "ECサイトでレビューのAI生成要約（AIGS）を導入すると、消費者のレビュー投稿はむしろ増え、内容も要約を補う方向に豊かになることを示した（抄録）。", "p2": "生成AIの商用利用は広がっているが効果の実証は乏しい。AIが作った内容は利用者の投稿の意欲を奪い置き換えると考えられがちだった（抄録）。", "p3": "AIGSの導入前後のレビュー行動を分析し、その仕組みとして『集団的効力感』（自分の投稿が共有の知識に意味ある貢献をするという信念）を提案し、統制された実験室実験で直接測って媒介効果を検証した（抄録）。解釈：導入の時期の違いを使った観察データの分析と読み取れる。", "p4": "レビューの件数、レビューを書く確率、製品のレビュー数の多寡と評価の割れ方による調整、レビューの内容（要約が触れた属性・触れていない属性への言及）で評価した（抄録）。", "p5": "AIGSの導入でレビュー数が増え、実験では集団的効力感が投稿の可能性への効果を媒介した。効果はレビューの多い製品と評価が割れる製品で大きかった。導入後のレビューは要約が扱った属性への言及が減り、扱っていない属性への言及が増え、要約の内容を繰り返すより掘り下げていた（抄録）。", "p6": "本文を読めず、データの出所（どのプラットフォームか）、識別の方法、効果の大きさは未確認。解釈：要約の品質や偏りによって効果が変わる可能性は抄録からは分からない。", "fun": "AIがレビューをまとめてくれたら、もう誰も書かなくなると思いますよね。ところが実際は逆で、『みんなの声がちゃんと形になる』と感じた人が、かえって書くようになりました。しかも要約にない点を補うように書くので、レビュー全体が豊かになったのです。AIと人の役割分担がうまく回った例です。", "unverified": "本文を読めず、効果の大きさと分析期間は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "韓国の監査人指定制で報酬37.5%増・時間も増", "title": "Periodic Auditor Designation, Audit Fees and Audit Effort: Evidence from the Korean Mandatory Designation Regime", "url": "https://doi.org/10.3390/jrfm19100778", "authors": "Gee-Jung Kwon", "venue": "Journal of Risk and Financial Management", "date": "2026-10-05", "citescore": 5.5, "citescore_year": "2025", "apa": "Kwon, G.-J. (2026). Periodic Auditor Designation, Audit Fees and Audit Effort: Evidence from the Korean Mandatory Designation Regime. Journal of Risk and Financial Management, 19(10), 778. https://doi.org/10.3390/jrfm19100778", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Managementの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "韓国の監査人の定期指定制（同じ監査人を6年続けた上場企業に規制当局が監査人を3年指定する制度）について、監査報酬と監査時間を大きく押し上げる一方、利益の質の改善は見られないことを示した（抄録）。", "p2": "2020年度から導入された指定制は監査の独立性を高める狙いだが、その費用と効果は定量化されていなかった（抄録）。", "p3": "2015〜2024年の2,258社・17,890企業年のデータで、法令が定める監査人交代の型から指定を特定し、自発的に監査人を替えた企業を比較対象として、企業と年の固定効果の回帰で推定した（抄録）。", "p4": "監査報酬、契約上の監査時間、監査人が別に開示する実際の作業時間、監査チームの構成、裁量的発生高の絶対値（利益調整の指標）で費用と効果を測った（抄録）。", "p5": "指定で監査報酬は37.5%、契約監査時間は14.8%上がり、時間当たり報酬は19.7%上がった。実作業時間でも同じ結果で、チーム構成は変わらなかった。自発的な交代を差し引いても報酬は0.1475対数ポイント、時間は0.0866上がった。裁量的発生高は動かず、標準偏差の10分の1を超える改善は信頼区間で否定された。効果は指定年に現れ、任期の終了とともに消えた（抄録）。", "p6": "利益の質は発生高ベースの1指標のみで評価しており、他の監査品質の指標は抄録からは未確認。指定の識別は交代の型からの推定に依存する（抄録）。", "fun": "監査人を国が強制的に入れ替えると、監査料は4割近く上がりましたが、会社の決算の『化粧』の度合いは変わりませんでした。良かれと思った制度の費用ははっきり測れても、効果は見えない、という厳しい結果です。しかも効果は指定期間が終わるとすぐ消えていました。", "unverified": "本文を読めず、頑健性の検定の詳細は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "CEOの違法行為、投資家は監査人より重く見る", "title": "The Relevance and Materiality of Illegal Acts: Examining Auditor and Investor Judgments", "url": "https://doi.org/10.1007/s10551-026-06477-4", "authors": "Eileen Z. Taylor ほか", "venue": "Journal of Business Ethics", "date": "2026-10-05", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "apa": "Taylor, E. Z., & Wright, N. S. (2026). The Relevance and Materiality of Illegal Acts: Examining Auditor and Investor Judgments. Journal of Business Ethics. https://doi.org/10.1007/s10551-026-06477-4", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Journal of Business Ethicsのオープンアクセス本文（仮説、実験方法、結果、考察と結論、表1〜3の記述）を読んだ", "preprint": false, "p1": "CEOの違法行為の情報について、監査経験のない投資家は監査人より関連性と重要性を高く評価し、監査人も投資家の役割に置かれると重要性を高く見ることを実験で示し、違法行為をめぐる監査の『期待ギャップ』を具体的に測った（抄録、Results）。", "p2": "監査の期待ギャップ（社会が監査に期待することと監査人が実際に担うことの差）は時代とともに形を変えて残る。投資家は経営幹部の違法行為を重視するようになっているが、監査人の判断との差は実証されていなかった（抄録、Introduction）。", "p3": "監査経験の有無（自己申告）と役割（監査人か投資家か）の2×2の一部実施の被験者間の準実験で、監査経験者だけが監査人役にもなれる3条件とした（Experimental Method）。参加者は合併を控えた架空の会社のCEOの違法行為の新聞記事を読み、関連性と重要性を1〜9の尺度で答えた。重要性の定義は全員に同じ文で示した（Dependent Variables）。", "p4": "参加者はMTurk62人、LinkedIn経由61人、会計の大学院生40人で、監査経験者108人の平均経験は4.36年だった。条件間で人口統計に有意差はなかった（Participants、表1）。条件間の平均の差をF検定で比べ、自由記述の理由も分析した（Results）。", "p5": "関連性は監査人が4.01、非監査人が5.45（F=6.25、p=0.01、片側）、重要性は5.31対6.18（p<0.001、片側）で、監査人の評価が低かった（表2・表3）。監査経験者でも投資家の役割に置かれると関連性の評価は上がった（4.25対5.45、p=0.05、片側）（Results）。", "p6": "参加者の集め方が混在し、扱ったのは1つの違法行為のシナリオだけである。著者は、監査人の判断の揺れや他の定性的な情報の扱いを今後の課題とし、投資家を教育するより職業が投資家の期待に応える方法を探るべきだと提言する（Discussion）。解釈：片側検定を用いている点は結果の解釈で考慮が要る。", "fun": "社長がプライベートで法を犯したというニュースを、一般の投資家は『会社の価値に大事な情報だ』と感じますが、監査のプロは『財務諸表の話ではない』と低めに見がちでした。面白いのは、同じプロでも『あなたは投資家です』と役を与えると評価が上がったことです。立場が判断の物差しを変えるのです。", "unverified": "表4の回帰結果の詳細と、付録のシナリオ全文は確認していない。"}}, {"id": "jr08", "rank": 8, "headline": "中国農村の隣人互助介護が長続きする仕組み", "title": "“Task-Based Relations” and the Sustainable Provision of Rural Neighbor-Assisted Eldercare Services in China*", "url": "https://doi.org/10.1177/00977004261476203", "authors": "Yaoyao Cheng", "venue": "Modern China", "date": "2026-10-05", "sjr": 0.713, "citescore": 2.2, "citescore_year": "2025", "apa": "Cheng, Y. (2026). “Task-Based Relations” and the Sustainable Provision of Rural Neighbor-Assisted Eldercare Services in China*. Modern China. https://doi.org/10.1177/00977004261476203", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Modern Chinaの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "中国の農村の隣人による互助型の高齢者介護が、資源の乏しい中でも長く安定して続く仕組みを、華北のH村の事例から『任務に基づく関係（事縁関係）』として説明した（抄録）。", "p2": "農村の互助介護では『熱く始まり冷たく終わる』ような事業の縮小がよく起きる。担い手が分散し、過程が生活に埋め込まれ、必要が状況依存で、監督が難しいため、外部からの一時的な資源投入が安定したサービスにつながりにくい（抄録）。", "p3": "H村の事例研究で、『センター（駅站）と互助点』の2層の網、村の党支部と村民委員会による『行政の保障はするが全面的には管理しない』戦略、半ば公式の拠点による外部資金の日常の介護への翻訳、簡素な記録と訪問による最小限の追跡、口コミと社会的な圧力による監督の補完を分析した（抄録）。", "p4": "評価は質的な事例分析で、定量的な指標はない（抄録から言える範囲）。", "p5": "H村の成功は資源の投入や『有能な個人』ではなく、介護を中心とした安定した『任務に基づく関係』の構造を生み出したことにあり、この構造が公式の官僚的なルールと地域の非公式なネットワークを結び付けていると論じた（抄録）。", "p6": "1村の事例で、他の地域や制度環境への一般化は限られる（解釈）。継続性を示す具体的な期間や利用者数は本文を読めず未確認。", "fun": "ボランティアの助け合いは、最初は盛り上がっても、だんだん続かなくなりがちです。この村では、お金や熱心なリーダーではなく、『介護という仕事』を軸に人と人が結び付く仕組みを作ったことで長続きしていました。役所のルールと、近所の評判という昔ながらの力をうまく組み合わせた点が面白いところです。", "unverified": "本文を読めず、調査方法（聞き取りの数など）は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "社内SNSの私的利用が仕事と生活の両立を支える", "title": "Replenishing resources with enterprise social media (ESM): overload-moderated effects on work-life balance, exhaustion, and turnover", "url": "https://doi.org/10.1108/intr-12-2025-2167", "authors": "Murad Moqbel ほか", "venue": "Internet Research", "date": "2026-10-05", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Moqbel, M., Charki, M. H., & Soror, A. (2026). Replenishing resources with enterprise social media (ESM): overload-moderated effects on work-life balance, exhaustion, and turnover. Internet Research, 1–20. https://doi.org/10.1108/intr-12-2025-2167", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Internet Researchの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "社内SNS（企業向けソーシャルメディア、ESM）の私的な利用は仕事と生活の両立（WLB）を直接高め、仕事の過負荷が大きい従業員では業務上の利用も両立を高めることを示した（抄録）。", "p2": "ESMの利用が従業員のwell-beingに良いか悪いかは研究で食い違っていた。資源保存（COR）理論に基づき、いつ・どのように効くかを問う（抄録）。", "p3": "米国中西部の大手IT企業の専門職276人の調査を、PLS-SEMで分析した。業務上と業務外のESM利用→WLB→仕事の消耗・離職意図の経路と、知覚された仕事の過負荷による調整を検証した（抄録）。", "p4": "WLBへの直接効果、消耗と離職意図への効果、過負荷による条件付きの効果で評価した（抄録）。", "p5": "業務外の利用だけがWLBを直接高めた。過負荷の高い従業員では、業務上・業務外の両方の利用がWLBを高めた。WLBは消耗と離職意図を下げ、消耗は離職意図を高めた。過負荷がESMの効果を左右する重要な境界条件だった（抄録）。", "p6": "1つの組織の横断データで、縦断的な検証や家族生活への波及の検討が今後の課題と著者は述べる（抄録）。著者は、一律の規制ではなく負荷に応じた方針と、心理的に安全なつながりの規範を提案する（抄録）。", "fun": "仕事中に社内チャットで雑談するのはサボりに見えるかもしれません。ところが、忙しすぎる人ほど、その雑談が心の支えになり、仕事と生活のバランスを保つ助けになっていました。同じ道具でも、置かれた状況によって『負担』にも『救い』にもなるのです。", "unverified": "本文を読めず、係数の大きさは未確認。"}}, {"id": "jr10", "rank": 10, "headline": "欠測のあるGNSS時系列の雑音を情報を捨てず推定", "title": "Information-preserving maximum likelihood noise analysis of GNSS coordinate time series with missing values in the first-differenced domain", "url": "https://doi.org/10.1186/s43020-026-00220-0", "authors": "Yueyang Huan ほか", "venue": "Satellite Navigation", "date": "2026-10-05", "sjr": 3.423, "citescore": 19.9, "citescore_year": "2025", "apa": "Huan, Y., Chang, G., Wang, Q., He, X., & Montillet, J.-P. (2026). Information-preserving maximum likelihood noise analysis of GNSS coordinate time series with missing values in the first-differenced domain. Satellite Navigation, 7(1). https://doi.org/10.1186/s43020-026-00220-0", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Satellite Navigationのオープンアクセス本文（抄録、シミュレーション実験、実データ実験、結論）を読んだ。手法の式展開と付録は見出しのみ", "preprint": false, "p1": "欠測を含むGNSSの座標時系列の雑音解析で、1階差分を取ると欠測に隣接する差分まで捨ててしまう従来の最尤推定（MLE）を改め、使える差分情報を失わない2つの修正版の差分MLEを提案した（抄録）。", "p2": "GNSSの座標時系列には時間相関のある有色雑音と欠測がある。非定常な雑音は1階差分で定常化できるが、標準の差分MLEは欠測を含む差分をすべて捨てて情報を失い、雑音の共分散行列のテプリッツ構造も崩れてパラメータが偏る（抄録、Conclusions）。", "p3": "欠測を線形変換行列で扱う方法と、周辺尤度で扱う方法の2つを作った（§Handling missing values）。雑音は白色雑音＋べき乗則雑音（WN+PL）で表し、軌道モデルは線形の傾き＋年周・半年周の項とした（式40）。解釈：差分を取る前の観測のつながりを保ったまま尤度を書くことで、欠測の前後の情報を捨てずに済む。", "p4": "5,000日の模擬系列にスペクトル指数α=−0.8・−1・−1.4（定常・弱非定常・強非定常）の雑音を与え、欠測を5%刻みで増やした計10,800系列と、ネバダ測地研究所（NGL）の60観測点・180系列（1995〜2026年）で、通常のMLE・標準の差分MLEと比べた（Simulated/Real data experiments）。", "p5": "2つの修正版は雑音のパラメータと速度の不確かさでほぼ同じ推定を与え、非定常な雑音と高い欠測率のもとで通常のMLEより正確だった（抄録）。計算効率は欠測率約60〜65%を境に逆転し、それ以下では周辺尤度法、それ以上では線形変換法が速かった。実データでは12%の系列で線形変換法が速く、欠測60%超の系列の割合に近かった（図8、Conclusions）。", "p6": "効率の逆転点はこの研究のデータ長・欠測の型・実装に固有の経験的な値で、一般的な閾値ではない。雑音モデルはWN+PLを主とし、WN+GGMは非定常雑音のもとで速度の不確かさを楽観的に見積もる傾向があった。不規則な標本化や非ガウス誤差への適用には修正が要る（Conclusions）。", "fun": "毎日の位置の記録に抜けがあると、『前日との差』を取る計算では、抜けた日の前後の2日分の情報まで捨ててしまいます。この研究は、抜けの前後をうまくつなぐ計算の工夫で、その無駄をなくしました。欠けたデータを補うのではなく、残っているデータを一滴も無駄にしない、という発想です。", "unverified": "表2〜3の推定値の具体的な誤差と、補足資料の欠測パターン別の結果は確認していない。"}}, {"id": "jr11", "rank": 11, "headline": "細粒分の量と形が粒状体の限界状態を決める", "title": "Coupled Control of Fines Content and Morphology on the Critical State and Fabric Evolution of Binary Granular Mixtures", "url": "https://doi.org/10.1002/nag.70447", "authors": "Tao Zhang ほか", "venue": "International Journal for Numerical and Analytical Methods in Geomechanics", "date": "2026-10-05", "sjr": 0.995, "citescore": 5.9, "citescore_year": "2025", "apa": "Zhang, T., Nikzad, A. E., Sun, Z., Wu, C., & Zhang, C. (2026). Coupled Control of Fines Content and Morphology on the Critical State and Fabric Evolution of Binary Granular Mixtures. International Journal for Numerical and Analytical Methods in Geomechanics. https://doi.org/10.1002/nag.70447", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "International Journal for Numerical and Analytical Methods in Geomechanicsの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "粗粒と細粒の2種の粒子の混合体で、細粒分の量と細粒の形状がせん断挙動をどう共同で決めるかを、DEM-FDM連成の数値三軸試験で示し、粒子の規則性を入れた等価骨格間隙比で限界状態線を1本にまとめた（抄録）。", "p2": "細粒分を含む砂などの粒状土の力学挙動は細粒分の量に強く依存するが、細粒の形状との共同の効果はよく分かっていない（抄録）。", "p3": "個別要素法（DEM、粒子を一つずつ計算）と有限差分法（FDM）を連成させ、細粒分含有率f_cと細粒の形状Pを変えた排水三軸圧縮の数値試験を行い、巨視的な強度と接触ネットワークの微視構造を分析した（抄録）。", "p4": "ピーク摩擦角、最大ダイレイタンシー角、限界状態摩擦角、e-p′空間の限界状態線、接触力の異方性で評価した（抄録）。", "p5": "ピーク摩擦角と最大ダイレイタンシー角はf_cとともに増え中間のf_cで最大になった後、粗粒の骨格が崩れるにつれ下がった。限界状態摩擦角は主にPで決まり、全体の粒子の規則性O_Rと明確に相関した。e-p′空間でばらばらだった限界状態線は、O_Rを入れた修正等価骨格間隙比で表すと1本に収束した。強度の変化は粗粒主体から細粒主体への接触網の構造転換で支配され、法線接触力の異方性が巨視的な強度の主な担い手だった（抄録）。", "p6": "結果は数値シミュレーションに基づき、室内試験との定量比較の有無は抄録からは未確認。粒子形状の表し方とモデルのパラメータの較正も本文を読めず未確認。", "fun": "大きな石の間に細かい砂を混ぜていくと、最初は隙間が埋まって強くなりますが、混ぜすぎると大きな石同士が離れて弱くなります。しかも、砂の粒が丸いか角張っているかで、崩れきった後の強さが決まっていました。ばらばらの線が、粒の形を入れると一本にまとまる、という見通しの良さが魅力です。", "unverified": "本文を読めず、数値の値（摩擦角など）は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "論文執筆のプロンプト全文開示義務に反対する", "title": "Against mandatory prompt disclosure in AI-assisted scholarship", "url": "https://doi.org/10.1007/s00146-026-03326-w", "authors": "Brian D. Earp ほか", "venue": "AI and Society", "date": "2026-10-05", "sjr": 1.504, "citescore": 10.9, "citescore_year": "2025", "apa": "Earp, B. D., Schüklenk, U., Savulescu, J., & Porsdam Mann, S. (2026). Against mandatory prompt disclosure in AI-assisted scholarship. AI & SOCIETY. https://doi.org/10.1007/s00146-026-03326-w", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "AI and Societyのオープンアクセス本文（§3の利点、§4の8つの問題の見出しと要旨、§5の総合評価、§6の代替案）を読んだ", "preprint": false, "p1": "論文執筆にLLMを使った研究者にプロンプトと出力の全文の提出を義務づける案（MFI）に対し、通常の文章支援については害が利益を上回ると論じ、再現性や妥当性に関わる場合に限った『比例的な開示』の枠組みを提案した（抄録、§5〜§6）。", "p2": "LLMが原稿の下書き・編集・推敲に日常的に使われる中で、研究の公正さ・著者性・説明責任のためにどこまでの透明性が要るかが問われている。一部の論者は全プロンプトと出力の補足資料での提出を求めている（抄録）。", "p3": "研究の善を『成果の善』（新しい知識など）と『過程の善』（技能の育成、正当な功績の配分など）に分け（§3）、MFIの利点と8つの問題（執行できない、実行できない場合がある、誠実な開示を妨げる、有益な利用を妨げる、プライバシーと監視・ホーソン効果、資源の乏しい研究者に不利、編集者と査読者への過大な期待、既存の透明性基準との不整合）を比べる規範的な論証である（§4）。", "p4": "評価は概念的な費用便益の検討で、実証データはない。判断の基準は、2種類の研究の善への純効果である（§3、§5）。", "p5": "MFIの利益は、根拠のない著者性の主張の抑止や、幻覚の参考文献の削減などにとどまり、しかも順守を前提とするため疑わしい。一方で誠実な研究者の開示を減らし、有益な利用を抑え、書く過程を歪め、周縁化された研究者の不利を強めるため、害が上回ると結論した（§5）。代替案は、AI不使用・校正のみ・実質的な使用の3択の申告と、データ分析やコード生成などでは第三者評価に足る方法レベルの記録（必要ならプロンプトの記録）を求める方式である（§6）。", "p6": "規範的な議論で、MFIが実際にどんな効果を持つかの実証はない。解釈：著者は利益相反の申告のような規範づくりの開示には賛成しており、反対の対象は妥当性・再現性と無関係な全文開示に限られる（§5）。", "fun": "AIと一緒に文章を書いたら、AIとのやり取りを全部提出せよ、という提案があります。でも、同僚との相談や下書きのメモまで全部出せとは誰も言いません。この論文は、正直な人ほど損をして、ずるい人は簡単にすり抜けるルールは逆効果だと論じ、本当に必要な場面だけ詳しく記録しようと提案しています。", "unverified": "§4の各問題の具体例と§2の議論の詳細は読み切れていない。"}}, {"id": "jr13", "rank": 13, "headline": "客の無礼が従業員の思いやり接客を減らす", "title": "How customer incivility reduces employees’ compassionate service behaviors: the exacerbating role of leader–member exchange", "url": "https://doi.org/10.1108/josm-05-2025-0238", "authors": "Huy Gip ほか", "venue": "Journal of Service Management", "date": "2026-10-05", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Gip, H., Currie, R., & Chang, W. (2026). How customer incivility reduces employees’ compassionate service behaviors: the exacerbating role of leader–member exchange. Journal of Service Management, 37(6), 271–292. https://doi.org/10.1108/josm-05-2025-0238", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Service Managementの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "客の無礼な振る舞いが職場の不確実性を高め、それを通じて現場の従業員の思いやりのある接客を減らすこと、しかも上司との関係（LMX）が良い従業員ほどこの悪影響が強まることを示した（抄録）。", "p2": "客の無礼の影響はよく研究されてきたが、思いやりのある接客がどの経路で損なわれるか、上司との良好な関係が常に守りになるかは分かっていない（抄録）。", "p3": "不確実性低減理論と資源保存理論に基づき、Prolificで集めた米国の顧客接点の従業員316人に4時点の時間差調査を行い、PROCESSマクロで調整付き媒介モデルを検証した（抄録）。", "p4": "客の無礼→職場の不確実性→思いやりのある接客の間接効果と、LMX（上司と部下の交換関係の質）による調整を評価した（抄録）。", "p5": "客の無礼は職場の不確実性を通じて思いやりのある接客に有意な負の間接効果を持った。不確実性と思いやり接客の関係、および間接効果は、LMXの高い従業員で強かった（抄録）。著者は、関係の明確さに慣れた人ほど不確実性を大きな乱れと感じるためと解釈している。", "p6": "自己申告の調査で、オンラインで集めた米国の従業員に限られる（抄録から言える範囲）。解釈：効果の大きさと共通方法バイアスへの対処は本文を読めず未確認。", "fun": "上司と良い関係にある人ほど困難に強い、と思いがちです。ところがこの研究では、客に失礼な態度をとられて先行きが不安になったとき、上司と仲の良い人ほど、思いやりのある接客がより大きく落ち込みました。普段の安心感が大きい人ほど、それが揺らいだときの動揺も大きいのかもしれません。", "unverified": "本文を読めず、効果の大きさは未確認。"}}, {"id": "jr14", "rank": 14, "headline": "断続節理のある岩盤斜面の進行破壊をペリダイナミクスで", "title": "Rock Bridge Fracture and Differential Deformation During Progressive Failure of Rock Slopes with Intermittent Joints Using a Stabilized Peridynamics Model", "url": "https://doi.org/10.3390/math14193608", "authors": "Leitao Zhang ほか", "venue": "Mathematics", "date": "2026-10-05", "citescore": 5.4, "citescore_year": "2025", "apa": "Zhang, L., Song, Y., Gong, B., & Che, Y. (2026). Rock Bridge Fracture and Differential Deformation During Progressive Failure of Rock Slopes with Intermittent Joints Using a Stabilized Peridynamics Model. Mathematics, 14(19), 3608. https://doi.org/10.3390/math14193608", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Mathematicsの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": false, "p1": "断続的な節理のある岩盤斜面の進行性破壊で、節理間の岩橋の破断と、斜面内の部分ごとに異なる変位（差動変形）が生じる過程を、安定化した非通常状態ベースのペリダイナミクスで再現し、主な破断経路と二次亀裂の役割を分けて示した（抄録）。", "p2": "断続節理を持つ岩盤斜面の崩壊は、健全な岩の部分（岩橋）を亀裂が貫いて進むが、その過程と変形の分化の関係は十分に理解されていない（抄録）。", "p3": "結合ごとの変形勾配の安定化に、引張強度の基準と三重せん断エネルギーの基準を組み合わせたペリダイナミクス（亀裂を自然に扱える非局所の連続体モデル）を用いた。まず健全な固着部を持つ3区間の地すべりモデルで適用性を確かめ、平行節理・非平行節理・3節理の不規則配置の3つの斜面を解析した（抄録）。", "p4": "亀裂の発生・進展の経路、岩橋の破断、変位場と応力場で比べた。検証は既往の実験と数値結果との定性的な一致による（抄録）。", "p5": "固着部を貫く予測の破断経路は既往の結果と定性的に一致した。平行節理では亀裂が分散して発生し岩橋を順に破断し、非平行節理では局所的に発生してより枝分かれした亀裂網になった。不規則配置では斜面表面に達する二次亀裂が岩盤を変位の異なる領域に分けた。岩橋の進行性の破断が主な破断経路を、二次亀裂が差動変形を支配した（抄録）。", "p6": "既往の結果との比較は定性的で、定量的な検証は抄録にない。著者は、違いは単一の幾何パラメータではなく節理の幾何と配置の組み合わせによると述べる（抄録）。", "fun": "岩の斜面に入った割れ目は、つながっていない『途切れた線』のことが多く、崩れるにはその間の硬い岩（岩橋）が割れなければなりません。この研究は、割れ目の並び方しだいで、岩橋の割れ方も、斜面がどのブロックに分かれて動くかも変わることを計算で見せました。点線を実線にしていく破壊のドラマです。", "unverified": "本文を読めず、モデルのパラメータと定量的な比較は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "SPTから液状化の発生と地表被害を同時に確率評価", "title": "SPT-Based Evaluations of Seismic Soil Liquefaction Initiation and Severity of Its Ground Surface Manifestation", "url": "https://doi.org/10.1061/jggefk.gteng-15103", "authors": "K. Onder Cetin ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-05", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Cetin, K. O., Ilgac, M., Kayen, R. E., Ayhan, B. U., Moss, R. E. S., Can, G., & Seed, R. B. (2026). SPT-Based Evaluations of Seismic Soil Liquefaction Initiation and Severity of Its Ground Surface Manifestation. Journal of Geotechnical and Geoenvironmental Engineering, 152(12). https://doi.org/10.1061/jggefk.gteng-15103", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Geotechnical and Geoenvironmental Engineeringの抄録（候補の収集時に取得）を読んだ。本文は取得できず", "preprint": false, "p1": "標準貫入試験（SPT）に基づき、自由地盤での液状化の発生確率と、その地表への現れ方の深刻度を同時に評価する確率的な予測モデルを提案した（抄録）。", "p2": "液状化の発生の判定と、地表での被害の程度を一緒にモデル化するのは難しい課題だった（抄録）。", "p3": "事例データベースの拡充、上載圧・エネルギー効率・短いロッドの補正を更新したSPTの解釈、指向性と地盤の影響を考えた繰返しせん断応力比（CSR）の調整、事例の厳格な選別、発生と地表の深刻度の同時モデル、設計条件がデータベースでどれだけ代表されているかを示す代表性指標、ベイズ推論によるモデルの更新を組み合わせた（抄録）。", "p4": "地震の継続時間、有効上載圧、細粒分の量のばらつきへの調整を含め、発生の可能性と地表の深刻度を評価した（抄録）。性能の比較の指標は抄録に記載がない。", "p5": "抄録は手法の改良点を列挙しており、具体的な予測精度や既存の相関式との比較の数値は示していない（抄録）。本文を読めず未確認。", "p6": "本文を読めず、データベースの事例数、地域の偏り、既存モデルとの差は未確認。解釈：代表性指標は、設計条件が事例の範囲外にあるときに予測を過信しないための工夫と読める。", "fun": "地震のとき地面が液体のようになる液状化は、起きるかどうかと、地表にどれだけ噴砂や沈下が出るかが別の問題です。この研究は、過去の多くの被害事例と現場の簡単な試験の結果から、その両方を確率で同時に見積もる式を作りました。『このデータは自分の現場に当てはまるか』を数字で示す工夫も加えています。", "unverified": "本文を読めず、予測精度と事例数は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "AIへの意思決定委任がwell-beingを上げ下げする", "title": "The Algorithmic Well‐Being Paradox: When AI Decision Delegation Helps and Hurts Consumer Well‐Being", "url": "https://doi.org/10.1002/mar.70277", "authors": "Jingru Xu ほか", "venue": "Psychology and Marketing", "date": "2026-10-05", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Xu, J., Ji, C., Chu, H., & Prentice, C. (2026). The Algorithmic Well‐Being Paradox: When AI Decision Delegation Helps and Hurts Consumer Well‐Being. Psychology & Marketing. https://doi.org/10.1002/mar.70277", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Psychology and Marketingの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "同じAIへの意思決定の委任が、体験の消費ではwell-beingを高め、モノの消費では下げるという『アルゴリズムのwell-beingの逆説』を示した（抄録）。", "p3": "味わい（savoring）の理論と自己決定理論を統合し、カメラ・ガイドツアー・椅子・グランピングなどを題材にした2×2の被験者間実験を4つ（N=1427）行った（抄録）。", "p5": "体験の消費ではAI委任が期待の味わいを高め、自律性の懸念を上回ってwell-beingを高めた。モノの消費では自律性の阻害が増えて便利さの利益を打ち消し、well-beingを下げた（抄録）。", "fun": "旅行の計画をAIに任せると、当日までのわくわくが増えて幸せになります。ところが椅子やスマホをAIに選ばせると、『自分で選んだ』感じが失われて満足が下がるのです。同じ『AIにお任せ』でも、買う物の種類で心への効き方が逆になるという発見です。", "unverified": "効果量と実験の具体的な操作は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "近隣の社会的要因と小児再入院リスク", "title": "Multidimensional neighborhood social drivers of health and pediatric hospital readmission risk", "url": "https://doi.org/10.1002/jhm.70504", "authors": "Britanny Winckler ほか", "venue": "Journal of Hospital Medicine", "date": "2026-10-05", "sjr": 0.904, "citescore": 2.9, "citescore_year": "2025", "apa": "Winckler, B., Pinkerton, C., Qu, A., & Ehwerhemuepha, L. (2026). Multidimensional neighborhood social drivers of health and pediatric hospital readmission risk. Journal of Hospital Medicine. https://doi.org/10.1002/jhm.70504", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Hospital Medicineの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "小児の予定外の再入院に、近隣の社会的な健康要因が一律にではなく、特定の病状との相互作用を通じて関わることを示した（抄録）。", "p3": "1施設の2019年2月〜2023年12月の39,930件の受診を国勢調査区の指標（COI、SVI、AHRQの変数）に結び付け、AHRQの変数を主成分分析で10成分に縮約し、ロジスティック回帰で7日・30日の再入院との関連を調べた（抄録）。", "p5": "再入院は7日で3.8%、30日で8.6%だった。COIとSVIはどちらの再入院とも関連しなかった（すべてp>.05）が、主成分で得た『軍関連の地域環境』が再入院と独立に関連し、複数の近隣の次元が臨床要因の効果を修飾した（抄録）。", "fun": "『貧しい地域ほど再入院が多い』という単純な物差しでは差が見えませんでした。ところが地域の特徴を細かく分けて見ると、特定の病気の子どもでだけ地域の影響が表れました。地域は全員に同じように効くのではなく、弱いところを強めるように働くのかもしれません。", "unverified": "単一施設の研究で、他地域への一般化は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "ボルト緩みをVolterra非線形特徴で検出", "title": "An Interpretable Frequency–Domain Volterra Nonlinear Feature for Bolt Damage Detection and Preload Identification in Bolted Joints", "url": "https://doi.org/10.3390/app16199843", "authors": "Haifeng Xu ほか", "venue": "Applied Sciences", "date": "2026-10-05", "citescore": 6.1, "citescore_year": "2025", "apa": "Xu, H., Chu, Q., Li, J., Ni, F., Li, Q., & Zhang, Z. (2026). An Interpretable Frequency–Domain Volterra Nonlinear Feature for Bolt Damage Detection and Preload Identification in Bolted Joints. Applied Sciences, 16(19), 9843. https://doi.org/10.3390/app16199843", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Applied Sciencesの抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "ボルト締結部の振動応答から、Volterra級数の周波数領域での非線形の特徴を取り出し、ボルトの緩みと予張力を解釈しやすい形で同定した（抄録）。", "p3": "締結部を非線形の動的系とみなし、Kautz展開のVolterraモデルで入出力関係を同定し、一般化周波数応答関数から高次の高調波に関わる成分を特徴（VNFF）とした。初期状態の特徴中心から教師なしの指標を作り、機械学習で予張力を同定した（抄録）。", "p5": "同定したモデルは実測の応答を正確に再構成し、指標は予張力の低下とともに単調に増えた。予張力の同定精度は3つのデータセットで最良97.73%、95.45%、93.18%だった（抄録）。", "fun": "ボルトがゆるむと、接触面がぱたぱたと当たったり離れたりして、加えた振動の2倍、3倍の周波数の『にごり』が出ます。この研究は、そのにごりの成分を数式で取り出し、ゆるみ具合を測る物差しにしました。音色の変化で楽器の調子を聞き分けるのに似ています。", "unverified": "試験体と加振条件の詳細は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "砂混じり流による橋脚基礎の摩耗をSPHで予測", "title": "Durability Analysis of Bridge Foundations over Service Time under Sand-Laden Flow Abrasion Using an SPH Model", "url": "https://doi.org/10.1061/jbenf2.beeng-8395", "authors": "Xiaolong Ma ほか", "venue": "Journal of Bridge Engineering", "date": "2026-10-05", "citescore": 7.2, "citescore_year": "2025", "apa": "Ma, X., Xiong, W., Zhou, D., & Cai, C. S. (2026). Durability Analysis of Bridge Foundations over Service Time under Sand-Laden Flow Abrasion Using an SPH Model. Journal of Bridge Engineering, 31(12). https://doi.org/10.1061/jbenf2.beeng-8395", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Bridge Engineeringの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "砂を含む流れによる橋梁基礎のコンクリートの摩耗を、粒子の衝突を明示的に扱うSPH（平滑化粒子流体力学）で予測し、供用期間中の耐久性を評価した（抄録）。", "p3": "粒子の跳ね返り時の運動量の受け渡しを考える摩耗モデルをSPHに組み込んで検証し、水理・構造のパラメータと摩耗速度の関係を応答曲面で式にし、確率的な流量データで橋脚の摩耗深さの時間変化を予測した（抄録）。", "p5": "設計かぶり厚60mmのとき、推定の供用寿命は5パーセンタイルで8.95年、95パーセンタイルで9.37年だった（抄録）。", "fun": "川底の砂粒が橋脚に当たり続けると、硬いコンクリートでも少しずつ削れていきます。この研究は、砂粒一つ一つの衝突を計算機の中で再現し、『あと何年で保護層が削れ切るか』を予測しました。小さな衝突の積み重ねが、橋の寿命を決めるのです。", "unverified": "対象とした流況と粒径の条件は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "水圧破砕後の2相流をDEM-FEMで連成解析", "title": "Gas–water two-phase transport after hydraulic fracturing in dual-porosity coal: A sequential discrete element method–finite element method study", "url": "https://doi.org/10.1063/5.0346863", "authors": "Ximing Zhu ほか", "venue": "Physics of Fluids", "date": "2026-10-05", "citescore": 5.4, "citescore_year": "2025", "apa": "Zhu, X., & Zhao, G. (2026). Gas–water two-phase transport after hydraulic fracturing in dual-porosity coal: A sequential discrete element method–finite element method study. Physics of Fluids, 38(10). https://doi.org/10.1063/5.0346863", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Physics of Fluidsの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "水圧破砕でできた亀裂網を個別要素法（DEM）で作り、その後のガスと水の2相流を有限要素法（FEM）で解く逐次連成の枠組みで、二重間隙の石炭からのガス生産を評価した（抄録）。", "p3": "粒子流コードで得た亀裂の痕跡を、メタンの脱着・拡散、飽和度に依存する相対浸透率、間隙率と浸透率の変化を含む連続体の排水モデルに移し、4つの独立な粒子充填で感度を調べた（抄録）。", "p5": "350日後の累積ガス生産は水なしの場合が水ありより109%多かった。注水圧50→52MPaの増分は48→50MPaより90.59〜95.07%小さく、孔径100→114mmの増加の効果は孔径1mmあたりで90→100mmの3.57〜3.86倍だった（抄録）。", "fun": "岩に水圧で割れ目を入れるところは粒の集まりとして、その後に気体と水が流れ出るところは連続した物体として、得意な計算法を受け渡しでつなぎました。圧力を上げても割れ目は増えるのに、取れるガスはあまり増えない、という頭打ちが見えた点も面白い結果です。", "unverified": "実測データとの照合の有無は未確認（数値実験のみの可能性）。"}}, {"id": "jr21", "rank": 21, "headline": "FEと実験を組み合わせ高荷重のひずみを外挿", "title": "A Dual‐Branch Neural Network for High‐Load Strain Extrapolation Using Finite Element and Experimental Data", "url": "https://doi.org/10.1155/stc/3970814", "authors": "Haotian Chu ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-05", "citescore": 10.3, "citescore_year": "2025", "apa": "Chu, H., Zhao, Q., Xu, H., Yu, F., Yang, C., Luo, Y., Vatin, N. I., & Sun, B. (2026). A Dual‐Branch Neural Network for High‐Load Strain Extrapolation Using Finite Element and Experimental Data. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/3970814", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Control and Health Monitoringの抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "有限要素の解析結果と実験の計測を組み合わせ、高荷重域のひずみを外挿して予測する2分岐のニューラル回帰モデルを提案した（抄録）。", "p3": "1/8縮尺のRCフレームをABAQUSでモデル化し、設計荷重の1.35倍までの計測を基に3つの荷重条件のFEひずみを作った。Transformerの符号化ブロックの非線形分岐と、荷重-ひずみの主傾向を表すMLP分岐を組み合わせ、大ひずみに重みを置く損失で学習した（抄録）。", "p5": "検証のR^2は最良で0.9975と0.9997、高荷重のMAPEは実験S7の外挿で2.56%、FEの条件間予測で0.39%だった。強い雑音下で多源データを融合すると、R^2が0.9621から0.9965へ、MAPEが11.15%から3.09%へ改善した（抄録）。", "fun": "壊れる手前の大きな荷重をかける実験は危険で回数も限られます。そこで、計算機のシミュレーションと少ない実測をAIに一緒に学ばせ、まだ試していない大きな荷重でのひずみを予測しました。異なる情報源を組み合わせると雑音に強くなる点が見どころです。", "unverified": "試験体が1種類のため、他の構造への一般化は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "斜橋の地震時衝突応答を振動台実験で検証", "title": "Seismic Pounding Response of a Single-Span Simply Supported Skew Bridge Based on Shaking Table Tests", "url": "https://doi.org/10.3390/app16199853", "authors": "Jinfei Liu ほか", "venue": "Applied Sciences", "date": "2026-10-05", "citescore": 6.1, "citescore_year": "2025", "apa": "Liu, J., Sun, Y., Zhuo, W., Chen, T., & Gu, Y. (2026). Seismic Pounding Response of a Single-Span Simply Supported Skew Bridge Based on Shaking Table Tests. Applied Sciences, 16(19), 9853. https://doi.org/10.3390/app16199853", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Applied Sciencesの抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "45°の斜角を持つ単純支持のRC床版橋の地震時の衝突応答を振動台実験で調べ、衝突モデルと衝突剛性の選び方の目安を示した（抄録）。", "p3": "振動台実験とSAP2000の有限要素モデルで、Kelvinモデルと Hertz-dampモデルを衝突剛性0.1〜0.5kの範囲で比べた（抄録）。", "p5": "衝突を考えると加速度が大きく増幅され、最大加速度は入力最大地動加速度の5〜22倍に達し、縦方向の変位と面内回転は抑えられた。Hertz-dampモデルが主な特徴を再現し、剛性0.2〜0.3kが加速度と変位の精度の釣り合いが良く、0.2kを参考値とした（抄録）。", "fun": "斜めに架かった橋は地震で桁が回転しやすく、端が橋台にぶつかります。ぶつかると変位は小さくなる一方、揺れの加速度は入力の何倍にも跳ね上がりました。ぶつかることは良くも悪くも働く、という橋の地震応答の難しさを示しています。", "unverified": "縮尺と入力地震波の詳細は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "中小支間の鉄道橋と軌道の相互作用要因", "title": "Factors affecting the interaction between railway track structure and bridge structures with small and medium spans", "url": "https://doi.org/10.1088/1742-6596/3329/1/012010", "authors": "Tsvetan Blagoev", "venue": "Journal of Physics: Conference Series", "date": "2026-10-05", "citescore": 1.1, "citescore_year": "2025", "apa": "Blagoev, T. (2026). Factors affecting the interaction between railway track structure and bridge structures with small and medium spans. Journal of Physics: Conference Series, 3329(1), 12010. https://doi.org/10.1088/1742-6596/3329/1/012010", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Physics: Conference Seriesの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "中小支間の鉄道橋で、軌道構造と橋梁の相互作用による縦方向の力の配分を左右する要因を整理した（抄録）。", "p3": "ロングレールの条件で、有道床と無道床の軌道について解析的モデルと有限要素モデルを作り、制動・加速の力、温度、下部構造の剛性、軌道の特性の影響を調べた（抄録）。", "p5": "道床・下部構造・レール締結の剛性が縦方向の力の配分とレール・橋梁の付加応力に大きく効き、温度の作用はとくに無道床で剛性の高い橋で大きな付加応力を生むことを示した（抄録）。", "fun": "長くつないだレールは、夏の暑さで伸びようとしても伸びられず、その力が橋に伝わります。この研究は、レールと橋の間の『ばね』の硬さが力の行き先を決めることを示しました。見えない力の綱引きが、橋とレールの両方に負担をかけているのです。", "unverified": "具体的な数値結果は抄録にない。"}}, {"id": "jr24", "rank": 24, "headline": "GNSSが使えない環境での分散駆動車両の状態推定", "title": "Multi-Source Information-based State Fusion Estimation for Distributed Electric Drive Vehicles", "url": "https://doi.org/10.24425/mms.2026.3086", "authors": "Zixian Li ほか", "venue": "Metrology and Measurement Systems", "date": "2026-10-05", "citescore": 2.1, "citescore_year": "2025", "apa": "Li, Z., Zhang, Y., Sun, Y., Bi, C., & Xu, Y. (2026). Multi-Source Information-based State Fusion Estimation for Distributed Electric Drive Vehicles. Metrology and Measurement Systems, 33(2), 1–22. https://doi.org/10.24425/mms.2026.3086", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Metrology and Measurement Systemsの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "GNSSが使えない複雑な地形で、分散駆動の電気自動車の縦速度と横滑り角を、車両力学モデルとデータ駆動モデルを融合して推定する方法を提案した（抄録）。", "p3": "車両力学に基づくキュバチャー・カルマンフィルタ（CKF）と、CNNで路面の種類を認識しLSTMで8種の時系列から推定する方法を用意し、物理に基づく傾向の参照との差で両者の重みを二分法で実時間に調整した（抄録）。", "p5": "8輪の分散駆動車で4つの走行条件の実験を行い、縦速度と横滑り角の推定精度と環境への適応性が向上したと報告している（抄録）。", "fun": "衛星の電波が届かない山道では、車は自分の速さや横滑りを直接は測れません。この研究は、物理の式で予想する方法とAIで学ぶ方法を、その場でどちらが信用できるか比べながら混ぜ合わせました。二人の専門家の意見を状況に応じて使い分けるようなものです。", "unverified": "改善の具体的な数値は抄録にない。"}}, {"id": "jr25", "rank": 25, "headline": "欧州の銀行の循環型知的資本の開示", "title": "Governing circular intellectual capital disclosure: evidence from European banks", "url": "https://doi.org/10.1108/jic-03-2026-0194", "authors": "Vitiana L'Abate ほか", "venue": "Journal of Intellectual Capital", "date": "2026-10-05", "sjr": 1.382, "citescore": 14.9, "citescore_year": "2025", "apa": "L’Abate, V., Degennaro, P., Vitolla, F., & Bussoli, C. (2026). Governing circular intellectual capital disclosure: evidence from European banks. Journal of Intellectual Capital, 1–24. https://doi.org/10.1108/jic-03-2026-0194", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Intellectual Capitalの抄録（候補の収集時に取得）を読んだ", "preprint": false, "short": true, "p1": "欧州の上場銀行が公式サイトで循環型の知的資本（CIC）の情報をどれだけ開示しているかを測り、取締役会の構成がその開示に与える影響を示した（抄録）。", "p3": "欧州の上場銀行120行の公式サイトを手作業で内容分析して開示の水準を測り、取締役会の規模・女性比率・独立性・サステナビリティ委員会の有無との関係を計量分析した（抄録）。", "p5": "開示はまだ限られていた。取締役会の規模・女性比率・独立性は開示を高めたが、サステナビリティ委員会の有無は有意な効果がなかった（抄録）。", "fun": "資源を捨てずに循環させる力も、会社の目に見えない財産（知的資本）だと考えられます。この研究は、銀行がそれをどれだけ外に伝えているかを数え、取締役の顔ぶれが多様なほど伝える量が増えることを見つけました。専用の委員会を作るだけでは効かなかった点も興味深いところです。", "unverified": "分析期間と係数の大きさは未確認。"}}, {"id": "jr26", "rank": 26, "headline": "担保を揃えると中小企業の貸出金利差はどこまで縮むか", "title": "THE COLLATERAL-ADJUSTED SIZE PREMIUM: HOW MUCH OF THE EURO AREA SME LOANSIZE PREMIUM IS ATTENUATED UNDER FULL COLLATERALISATION", "url": "https://doi.org/10.35774/jee2026.03.638", "authors": "André ANTÃO", "venue": "JOURNAL OF EUROPEAN ECONOMY", "date": "2026-10-05", "citescore": 0.9, "citescore_year": "2025", "apa": "ANTÃO, A. (2026). THE COLLATERAL-ADJUSTED SIZE PREMIUM: HOW MUCH OF THE EURO AREA SME LOANSIZE PREMIUM IS ATTENUATED UNDER FULL COLLATERALISATION. Journal of European Economy, 25(3), 638. https://doi.org/10.35774/jee2026.03.638", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of European Economyの抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "ユーロ圏の中小企業が大企業より高い貸出金利を払う『貸出規模プレミアム』のうち、全額の担保・保証があると消える部分（CAG）を定義し測った（抄録）。", "p3": "欧州中央銀行の金利統計で、全貸出のプレミアムから全額担保付き貸出のプレミアムを引いてCAGとし、20か国とユーロ圏の2015年1月〜2026年5月の月次データで記述した（抄録）。", "p5": "ユーロ圏のCAGは2019年6月の0.21%ポイントから2024年12月の0.48%ポイントへ広がり、全額担保後も残るプレミアムは0.79から0.15%ポイントに下がった。国の間の四分位範囲は2023年8月に0.91%ポイントに達した。著者は記述的で因果ではないとしている（抄録）。", "fun": "小さな会社がお金を借りると、大きな会社より金利が高くなります。その差のうち、どれだけが『担保がないから』で説明できるのかを測ったのがこの研究です。担保を十分に出せば差のかなりの部分が消える時期もあり、小さな会社の不利の正体を分解して見せています。", "unverified": "記述統計で、因果の解釈はできない（著者も明記）。"}}, {"id": "jr27", "rank": 27, "headline": "スマートシティ等のパイロット政策と都市の生態レジリエンス", "title": "Dual Pilot Policies and Urban Ecological Resilience: Evidence from New Energy Demonstration and Smart City Initiatives", "url": "https://doi.org/10.3390/urbansci10100572", "authors": "Yinlu Zhang ほか", "venue": "Urban Science", "date": "2026-10-05", "citescore": 3.7, "citescore_year": "2025", "apa": "Zhang, Y., Wang, F., Luo, Q., & Niu, Y. (2026). Dual Pilot Policies and Urban Ecological Resilience: Evidence from New Energy Demonstration and Smart City Initiatives. Urban Science, 10(10), 572. https://doi.org/10.3390/urbansci10100572", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Urban Scienceの抄録（Crossref登録）を読んだ", "preprint": false, "short": true, "p1": "中国の新エネルギー実証とスマートシティの2つの試行政策を同時に受けた都市で、都市の生態的レジリエンスが単独の政策より高まることを示した（抄録）。", "p3": "都市のパネルデータに差の差（DID）の枠組みを当て、政策の組み合わせの効果と、汚染対策・グリーン技術・エネルギー効率を通じた経路を分析した（抄録）。", "p5": "2政策の協調実施は、どちらか一方より大きな有意な正の効果を持ち、西部と資源依存でない都市で顕著だった。政府の関心・世論の監視・グリーン金融・グリーンインフラが効果を強めた（抄録）。", "fun": "二つの政策を同時に行うと、足し算以上の効果が出ることがあります。この研究は、省エネの実験都市とスマートシティを兼ねた都市で、自然環境の打たれ強さが特に高まったと報告しました。政策の『組み合わせ方』も設計の対象になる、という視点です。", "unverified": "対象都市数・期間・効果の大きさは未確認。"}}, {"id": "jr28", "rank": 28, "headline": "生成AIの利用と少数民族留学生の学習エンゲージメント", "title": "Multidimensional engagement effects of generative AI adoption among minority ethnic international students in UK higher education", "url": "https://doi.org/10.1111/bjet.70093", "authors": "Olatunji David Adekoya ほか", "venue": "British Journal of Educational Technology", "date": "2026-10-05", "sjr": 3.83, "citescore": 23.1, "citescore_year": "2025", "apa": "Adekoya, O. D., Ajonbadi, H. A., & Mordi, C. (2026). Multidimensional engagement effects of generative AI adoption among minority ethnic i
