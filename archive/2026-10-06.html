<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-06", "intro": "プレプリントの新着460件、学術誌の新着458件（うち上位10%誌308件）、重要論文の候補211件、新着の公開データ55件から選びました。プレプリント・関連36報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目31報、データ21件です。本日は質の高い候補が少なかったため、プレプリント・関連とデータの件数を絞りました。注目分野の主要誌の新着も少なく、論文誌・注目は上位10%誌の新着で補ったうえで件数を絞りました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "物理情報LSTMで列車-橋梁応答を高速予測", "title": "Physics-informed long short-term memory networks for train-bridge dynamic response prediction", "url": "https://doi.org/10.47964/1326.10735.099", "authors": "Huu-Quyet Nguyen ほか", "venue": "HAL", "date": "2026-10-02", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を読んだ。本文はCrossref・OpenAlex・出版社のいずれからも取得できず", "preprint": true, "p1": "運動方程式を損失関数に組み込んだ物理情報付きLSTM（PhyLSTM）で、列車-橋梁相互作用（TBI）の動的応答を、有限要素解析より速く、物理的に矛盾なく予測できるようにした（抄録）。", "p2": "TBIの応答予測は構造評価に不可欠だが、有限要素解析は計算が重い。LSTMなどのデータ駆動モデルは時系列に強い一方、運行条件が変わると精度を失うことがある（抄録）。", "p3": "入力は列車荷重の条件、出力は橋の動的応答の時系列と読み取れる。支配方程式（運動方程式）の残差を損失に加え、データへの当てはめと物理の満足を同時に求める。解釈：データの少ない条件でも、力のつり合いを破る予測を罰することで外挿が安定すると期待される。", "p4": "高速鉄道の荷重モデル（HSLM）列車が通過する単純支持梁で検証し、標準のLSTMと比べた（抄録）。評価指標の具体名は抄録に記載がない。", "p5": "PhyLSTMは標準のLSTMより精度と頑健さで上回り、とくに共振条件で差が大きかったと報告している（抄録）。数値の誤差や図表は本文を読めず未確認。", "p6": "検証は単純支持梁と1種類の荷重モデルに限られ、実橋の計測や多径間・連続桁への適用は抄録にない。車両側の動力学をどこまでモデルに含めたかも未確認。", "fun": "列車が橋を渡るときの揺れは、列車の速さと橋の固有の揺れのリズムが合うと急に大きくなります（共振）。データだけを覚えたAIはこういう急変に弱いのですが、ニュートンの運動方程式を『守るべきルール』として教え込むと、共振のような場面でも外れにくくなりました。", "unverified": "本文・図表を読めず、誤差の数値、学習データの量、比較の条件は未確認。"}}, {"id": "pr02", "rank": 2, "headline": "AIを使う機関投資家とXBRL開示の届く範囲", "title": "AI-Equipped Institutional Investors, XBRL Standardization, and the Reach of Structured-Data Disclosure Mandates", "url": "https://doi.org/10.2139/ssrn.7565136", "authors": "Benedikt Engel", "venue": "SSRN", "date": "2026-10-05", "apa": "Engel, B. (2026). AI-Equipped Institutional Investors, XBRL Standardization, and the Reach of Structured-Data Disclosure Mandates. https://doi.org/10.2139/ssrn.7565136", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "AIを使う機関投資家を多く抱える企業ほど、2022年以降にXBRLの独自タグの比率が下がることを示し、構造化データの開示義務の効き方が投資家層によって異なることを明らかにした（抄録）。", "p2": "2022年の金融データ透明化法とSECのXBRL義務は、標準化がすべての提出企業に一様に効くと想定している。著者は、機械可読性は企業の投資家層と同時に決まるという代替仮説を検討する（抄録）。", "p3": "2018〜2026年の米国上場の10-K提出企業について、13F保有者のうち提出書類からAI利用がうかがえる投資家の等ウェイトの割合を『機械読取り投資家層』として測る。保有比率で重みづけした指標はBig-3の保有と機械的に交絡して信号を持たず、構成比の指標が有効だった（抄録）。解釈：独自タグが少ないほど比較可能で機械処理しやすい開示になる。", "p4": "小規模企業や投資家の選別が進んでいない企業での集中、事前に決まる複雑さの統制、処置前の偽の時点でのプラセボで検証し、通常のクラスタリングに加え、ランダム化推論と少数クラスタに頑健な推論も報告した（抄録）。", "p5": "機械読取り投資家層が大きい企業ほど2022年以降の独自タグ比率が低かった。関連は通常のクラスタリングでは有意だが、ランダム化推論と少数クラスタ頑健な推論では弱まった（抄録）。", "p6": "AI固有の処理能力と、指数連動でない投資家層の一般的な洗練度を分けられず、証拠は『AIと分類された投資家層』に関するものと著者が認めている。企業内の強い調整は否定されるが、静的な選別と動的な選別は区別できない（抄録）。", "fun": "財務データにパソコンが読める『名札（タグ）』を付ける決まりがあっても、会社ごとに勝手な名札を作ると比べにくくなります。この研究は、AIでデータを読む投資家が多い会社ほど、共通の名札を使うようになったことを見つけました。読み手が変わると、書き手の書き方も変わるのです。", "unverified": "本文を読めず、効果の大きさと標本の企業数は未確認。"}}, {"id": "pr03", "rank": 3, "headline": "太陽光パネル下でRTK-GNSSはどこまで信頼できるか", "title": "RTK GNSS Reliability Under Photovoltaic Obstruction in Agrivoltaic Systems: A Multi-Receiver Field Evaluation", "url": "https://doi.org/10.2139/ssrn.7564967", "authors": "Shaswati Behera ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Behera, S., Balabantaray, A., Yadav, A., Shi, Y., & Pitla, S. (2026). RTK GNSS Reliability Under Photovoltaic Obstruction in Agrivoltaic Systems: A Multi-Receiver Field Evaluation. https://doi.org/10.2139/ssrn.7564967", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "営農型太陽光発電の単軸追尾式アレイで、RTK-GNSSの測位がパネルの下では使い物にならず、列の間の通路では十分使えることを、3台の受信機の現地試験で定量化した（抄録）。", "p2": "パネルの下や間で自動走行の農機を使うには高精度の測位が要る。太陽光アレイは都市の谷間や森林と違い、薄く高い遮蔽が開けた通路で区切られた『遮蔽の勾配』を作るが、その影響は定量化されていなかった（抄録）。", "p3": "米国ネブラスカ州ヘイスティングス近郊の稼働中のアレイ（地表被覆率33.3%）で、NTRIPで補正を受ける3台の受信機を、パネル外3条件（周縁の空・列間・パネル角）とパネル下3条件（縁の下・中央の下・鋼製支柱近くの中央の下）に置き、3日間の乱塊法で測った（抄録）。", "p4": "評価指標は平均精度と位置のばらつき、RTKのFix解の得られる率、搬送波対雑音比（C/N0）、マルチパス、精度劣化係数（DOP）、衛星の仰角・方位角である（抄録）。良さの基準はセンチメートル級の自律走行の要件を満たすかどうかとした。", "p5": "Fix率はパネル外では99%超を保ったが、パネル縁の下で78.6%、鋼製支柱近くのパネル下で20.6%に落ちた。C/N0は7.5 dB-Hz下がり、マルチパスは2.6倍に増えた一方、DOPの増加は10%にとどまり、劣化は幾何的な遮蔽ではなく減衰とマルチパスによると結論した（抄録）。", "p6": "パネル下のどの位置もセンチメートル級の要件を満たさず、10cm以上の許容の作業ならすべての条件で満たした。1か所・3日間・評価した受信機に限られた結果で、パネルの角度の時間変化の影響の扱いは抄録からは未確認。", "fun": "太陽光パネルの下に入ると、空の衛星は見えているのに位置が狂います。原因は、パネルが電波を弱め、鉄の柱が電波を反射して『こだま』（マルチパス）を作るからでした。見えていれば大丈夫、という直感が外れる例で、衛星の配置ではなく電波の質が問題だと突き止めた点が面白いところです。", "unverified": "本文を読めず、受信機の機種と誤差の具体的な値（cm）は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "疎で雑音の多い観測でSINDy・NODE・PINNが壊れる型", "title": "Learning the Limits of Discovery: Distinct Failure Signatures of SINDy, Neural ODEs, and PINNs Under Sparse and Noisy Observations", "url": "https://doi.org/10.21203/rs.3.rs-11211450/v1", "authors": "Vedauv Rajkumar Leelavathi", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Leelavathi, V. R. (2026). Learning the Limits of Discovery: Distinct Failure Signatures of SINDy, Neural ODEs, and PINNs Under Sparse and Noisy Observations. https://doi.org/10.21203/rs.3.rs-11211450/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリントの本文PDF（手法・結果・考察と限界・結論、表1〜2、図1〜4のキャプション）を読んだ", "preprint": true, "p1": "データから動力学の式を学ぶ3つの手法（SINDy、Neural ODE、PINN）が、疎で雑音の多い観測でそれぞれ異なる『壊れ方』をすることを、条件を揃えた格子実験で特徴づけた（抄録、§4.4）。", "p2": "実測は雑音が多く疎で欠けがちだが、方程式発見の手法の評価は平均の精度に偏り、どの条件でどう失敗するかの比較が乏しい（§1）。", "p3": "Lorenz（カオス）、Van der Pol（リミットサイクル）、強制Duffingの真の軌道に、標準偏差で尺度化したガウス雑音（0〜50%）と間引きを加え、各条件5回の独立な劣化・間引きで評価した（§3.1、§3.5）。SINDyは3次多項式の候補とSTLSQ（閾値0.1）、Neural ODEは2層64ユニット、PINNは4層64ユニットで物理パラメータを同時推定（§3.2〜3.4）。例：Lorenzを5%観測・30%雑音にすると、SINDyは60候補項のうち47項を残し、係数が真値の一桁大きくなる（§4.1）。", "p4": "SINDyは項の適合率（復元した項のうち正しい割合）と再現率、Neural ODEは短期予測誤差、PINNはパラメータの平均相対誤差で評価した。閾値・サンプリングの幾何・学習の反復回数の頑健性検査も加えた（§3.5）。統計的検定ではなく記述統計で比べる（§3.5）。", "p5": "SINDyの再現率は常に0.886以上だが、適合率は観測5〜10%で0.14〜0.17に落ちた（§4.1、図1）。表1では10%雑音・25%観測で、等間隔の間引きなら閾値0.10でDuffingの適合率0.958（ランダムは0.257）。表2では同条件の比較で等間隔＞ランダム＞連続欠損の順だった。Neural ODEのLorenzの固定点への崩壊は反復1500回→8000回で解消し、学習不足が原因だった（§4.2）。PINNはDuffingで誤差1.42%以下だが、Lorenzの25%観測では26.6%±26.6%と初期値依存が大きかった（§4.3）。", "p6": "ニューラルネットの初期値は制御しておらず、比べたのは記述統計で、頑健性検査は1条件3回と少ない（§6）。対象は3つの典型系とガウス雑音に限られ、実データはオオヤマネコとウサギの21点の1例のみ（§5、§6）。著者は結果を手法の普遍的な限界ではなく、試した実装の失敗の型と位置づけている（§6）。", "fun": "同じ『データから法則を見つけるAI』でも、データが歯抜けになると、ある手法は余計な項を山ほど抱え込み、別の手法は試すたびに答えがばらつきます。しかも、測る間隔を等間隔にするだけで成績が大きく良くなりました。データの『量』だけでなく『並び方』が結果を左右するという、測定設計の大切さを教えてくれる研究です。", "unverified": "図1〜3の数値の全体と、表3の全項目は未確認。Neural ODEの疎観測時の詳しい挙動は読み切れていない。"}}, {"id": "pr05", "rank": 5, "headline": "LLMのスケーリング則は回答の解析法が作り出していた", "title": "How Response Parsing Manufactures Scaling Laws: A Replication and Measurement-Validity Audit of Constraint-Tracking Capacity in LLMs", "url": "https://doi.org/10.21203/rs.3.rs-11238962/v1", "authors": "Yangyi Zhang", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Zhang, Y. (2026). How Response Parsing Manufactures Scaling Laws: A Replication and Measurement-Validity Audit of Constraint-Tracking Capacity in LLMs. https://doi.org/10.21203/rs.3.rs-11238962/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリントの本文PDF（§2〜§10と表1〜5）を読んだ", "preprint": true, "p1": "LLMが独立した制約を追跡できる容量k*が『崩壊』する現象は再現する一方、それがモデル規模のべき乗則（指数β≈2.0）に従うという先行研究の主張は、回答の解析器が作った人工物だったことを、元のログの再解析と再実験で示した（抄録、§10）。", "p2": "先行研究は、k個の文とキーワードを与えて一度に全部の有無を判定させ、正答率0.95を保てる最大のk（k*）がθ^βに比例すると主張した。著者は、その測定の妥当性（実際に測りたいものを測れているか）を監査する（§1〜§2）。", "p3": "元の解析器は行ごとにyes/noを読み、足りなければ応答全体からyes/noの語を探して補い、補えない分は除外して正答率の分母を変えていた（§2）。著者は、補完をしない厳格な解析器で元のログを読み直し、同じ手順を2つのローカルモデルで再実行し、さらにAPI経由の8系統のモデルで800試行を行った（§3〜§5）。例：k=16の1.5Bモデルは平均13.3個しか答えておらず、残り2.7個は補完が応答中の語から拾っていた（表1）。", "p4": "判断の基準は、厳格な解析器でも同じk*が得られるか、複数の点からβが推定できるか、先行研究の理論上の上界が2つのモデルを区別できるか、である（§4〜§6）。", "p5": "補完は120試行中28試行（23%）で働いた（§3）。厳格な解析でもk*はQwen2.5-1.5Bで1、7Bで13と既報と一致し、崩壊は再現した（表2）。一方、2値判定の課題ではQwen3の4モデルなどでk*が0になり推定βは−1.04、蓄積型の課題では全モデルが上限の20で飽和した（表3）。k*=0の原因は判定の誤りではなく、ブログ記事を書き始めたり空文字を返したりする形式の不遵守だった（§5）。理論上の上界dL/Hは2モデルとも3584で同一だった（表4）。", "p6": "再現は2つのローカルモデル・各k3試行に限られ、他の3モデルは読み込めなかった（§9）。API側はベンダーや推論過程の違いと交絡し、著者は自らのβは報告しない（§9）。崩壊の仕組みは未解明で、プロンプトの形式などで飽和値が動く可能性がある（§9）。", "fun": "テストの採点係が、空欄の答えを問題文の中の『はい』『いいえ』で勝手に埋めていたら、成績はでたらめになります。この研究は、AIの能力の『法則』がまさにそうした採点の仕方から生まれていたことを見つけました。発見そのものより、測り方を疑うことの大切さを教えてくれる論文です。", "unverified": "§1と§10後半の一部、付録の有無は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "LLM採点者の人手検証は手順次第で結論が変わる", "title": "When Validating the Judge Changes the Result: Instability in Human Validation of LLM Safety Graders", "url": "https://doi.org/10.21203/rs.3.rs-11242885/v1", "authors": "SHUBHANANDAN T Y ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Y, S. T., S, M. V., Shanmugam, B. K., & N, P. (2026). When Validating the Judge Changes the Result: Instability in Human Validation of LLM Safety Graders. https://doi.org/10.21203/rs.3.rs-11242885/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリントの本文PDF（§3〜§7、§9、図1〜3、表1〜2の記述）を読んだ。§8の検閲の検定は概要のみ", "preprint": true, "p1": "LLMの安全性採点器（ジャッジ）を人手ラベルで検証する手順そのものが結果を大きく左右し、同じ応答でも検証の仕方次第で公開判断が逆転し得ることを示した（抄録、§9）。", "p2": "自動採点器は人手ラベルとの一致で信頼性を確かめるのが通例だが、その検証手順（注釈者数、盲検化、見せる文字数、害の定義）は記録も比較もされてこなかった（§1、§6.4）。", "p3": "25の有害な意図を、形式的なベンチマーク風と、くだけた一人称風の2通りで書いた300組の対の質問を作り、Qwen2.5（0.5〜7B）とGemma-2（2B・9B）の6モデルで計3,600の応答を生成した（§4）。Qwen2.5-7Bの採点器が応答を拒否・ぼかし（HEDGE）・有害に分類し、その結果を3通りの人手監査で検証した（§4、§6）。例：差∆は『くだけた書き方での有害率−形式的な書き方での有害率』である（§3）。", "p4": "監査1は非盲検の1人、監査2は非盲検の2人が同じ442項目、監査3は事前登録・盲検の3人で239項目を付けた（§6.1〜6.3）。手順の違いによる推定の幅（S_protocol）と、クラス別の正答率で評価した（§6、§7）。", "p5": "キーワードによる拒否率の差は0.263（95%CI 0.210〜0.318）で、全6モデルで成り立った（§5）。一方、有害の差の推定は監査1で0.258、監査2の2人で−0.036と+0.274（κ=0.091）、監査3で0.035（95%CrI −0.053〜0.116）と割れ、幅は0.310だった（§6、図2）。2人は95件で『拒否したかどうか』自体で食い違った（§6.2）。採点器の推定0.033は監査3とほぼ一致したが、正答率は63.6%で、誤りが両方向に相殺していた（§7）。", "p6": "3つの監査は害の定義や表示文字数など複数の点が同時に違い、どの要素が差を生んだかは特定できない（§6.4、§9）。監査3は層が薄く、検閲の検定は自動評価のみで、4ビット量子化の公開モデル6つに限られる（§9）。著者は報告用のチェックリストTRACEを提案している（§9）。", "fun": "採点の答え合わせをする人が変わると、『AIは危険な答えをした』『していない』と正反対の結論が出ることがあります。この研究では、同じ答えを見た2人が、そもそもAIが断ったかどうかで95回も食い違いました。物差しを確かめる作業にも物差しが要る、という入れ子の問題を鮮やかに示した研究です。", "unverified": "§8（生成の打ち切りの影響の検定）の詳細と付録は読み切れていない。"}}, {"id": "pr07", "rank": 7, "headline": "EV充電器の整備が家計消費を押し上げる", "title": "Power Up Consumption: Impact of Electric Vehicle Infrastructure on Household Finance", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.19034", "authors": "Sumit Agarwal ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Agarwal, S., Fan, Y., & Gao, Q. (2026). Power Up Consumption: Impact of Electric Vehicle Infrastructure on Household Finance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.19034", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "arXiv版の本文PDF（結果・機構分析・考察と限界・データの節）を読んだ。表と図は本文中の記述で確認", "preprint": true, "p1": "シンガポールのEV充電器の初期整備を準自然実験として、近くに充電器ができた家計の消費が1〜3%増えることを、銀行の個人取引データで示した（抄録、Results）。", "p2": "EVの環境上の利点は研究が多いが、充電インフラが家計の財務や消費に与える影響はほとんど分かっていない（抄録）。", "p3": "2019年1月〜2021年3月に設置された129基の充電器の設置日と位置を手作業で集め、大手商業銀行の約100万件の個人月次支出記録と約6万5千件の住宅取引に結び付けた（Method）。充電器の立地は送電網の容量や土地利用の規制で決まり、家計の所得とはほぼ独立だという前提で、イベントスタディと差の差（DID）を用いた（Results）。", "p4": "処置前の傾向に差がないこと（平行トレンド）を確かめ、個人と年月の固定効果、計画区域×年の固定効果、外れ値やクラスタリングの変更、住宅地のみの充電器、取引回数などで頑健性を検証した（Results、表1〜2）。", "p5": "消費の増加は設置後約12か月で有意になり2〜3%（37〜55ドル）で推移した（図1）。好ましい推定は1.2%（22ドル）で、国全体では3,740万ドルに当たる（表1）。公営住宅では住宅価格が設置20か月後に5%上がり（民間住宅は3%）、充電器のある地区では新規の店舗・施設が12.7%増え、飲食は21.6%増えた（図2、表4）。公営住宅のハイブリッド車所有者は燃料支出が約8.7%減り、必需品が4.5%、娯楽が5.1%増えた。", "p6": "銀行データには充電器ごとの充電の支払いがなく、移動データもないため、経路の特定には限界がある（Discussion）。車の買い替え、転居、長期の居住地の選別も観察できない（Discussion）。解釈：初期の129基という少数の設置に基づく結果で、整備が進んだ段階に同じ効果があるかは分からない。", "fun": "電気自動車の充電器は、環境のための設備だと思われがちです。ところが、充電器ができると近所の家の値段が上がり、待ち時間に寄れる飲食店が増え、ガソリン代が浮いた分を別の買い物に回すことで、家計の消費まで増えていました。インフラが思わぬ経路で暮らしを変える例です。", "unverified": "表3・表5の詳細と補足資料は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "近隣を越えて人が集まる公園の条件", "title": "Organizational governance and bridging activity places: What makes a park a travel destination across neighborhoods?", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05756278", "authors": "Santi Furnari ほか", "venue": "RePEc NEP", "date": "2026-10-05", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を読んだ。本文はオープンアクセス版・COREとも取得できず", "preprint": true, "p1": "遠くの近隣からも人が訪れ、異なる人々を混ぜる公園の条件として、運営組織の統治の形（とくに官民の共同運営）が物理的な特徴以上に効くことを示した（抄録）。", "p2": "都市の不平等と移動の研究は、個人が日常を過ごす場所の集合（活動空間）が近隣の分断を和らげることを示してきた。しかし、特定の場所がなぜ遠くの近隣からの目的地になり、人を混ぜるのかは分かっていない（抄録）。", "p3": "活動空間の中の境界のある場所を『活動場所』と定義し、それを組織が作るものとみなして、運営組織の統治に注目した。米国の大都市上位120都市の3,080の公園について、スマートフォンの来訪者データを分析した（抄録）。", "p4": "評価の対象は、公園が遠い距離からの来訪者をどれだけ引き付けるかで、公園の物理的な特徴を統制した上での統治の効果を見た（抄録）。具体的な指標とモデルは抄録に記載がない。", "p5": "組織の統治は、物理的な特徴を超えて遠方からの魅力に影響した。官民の共同統治は遠方の来訪者を引き付ける力を高め、その効果は企画されたイベントの多様さで強まった（抄録）。効果の大きさは本文を読めず未確認。", "p6": "著者は分析の限界と含意を論じるとしているが、内容は抄録からは未確認。解釈：スマートフォンのデータは利用者の偏りを含み得て、来訪の『混ざり方』（実際に異なる人が出会うか）までは測れていない可能性がある。", "fun": "同じような広さと遊具の公園でも、遠くの街から人が集まる公園と、近所の人しか来ない公園があります。この研究は、その差を生むのが芝生や池ではなく『誰がどう運営しているか』だと示しました。行政と民間が一緒に運営し、いろいろな催しを開く公園ほど、普段は出会わない人どうしを混ぜる場所になるのです。", "unverified": "本文を読めず、効果の大きさ、統治の分類の方法、統制変数は未確認。"}}, {"id": "pr09", "rank": 9, "headline": "ChatGPTの利用動機と欲求充足・well-being", "title": "Gratifications Sought from AI Chatbots, Basic Psychological Need Satisfaction, and Well-Being: Evidence From two Studies", "url": "https://doi.org/10.2139/ssrn.7564945", "authors": "Nino Gugushvili ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Gugushvili, N., & Masciantonio, A. (2026). Gratifications Sought from AI Chatbots, Basic Psychological Need Satisfaction, and Well-Being: Evidence From two Studies. https://doi.org/10.2139/ssrn.7564945", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "ChatGPTを使う動機の違いによって、基本的な心理的欲求の充足を通じてwell-beingが上がる場合と下がる場合があることを、2つの調査で示した（抄録）。", "p2": "AIチャットボットの私的な利用が広がる中で、利用者のwell-beingへの影響が懸念されているが、どの使い方がどう効くのかは明らかでない（抄録）。", "p3": "利用と満足（U&G）の理論と自己決定理論（SDT）を統合し、利用動機→有能感・関係性・自律性の欲求充足→well-beingという媒介モデルを2つの横断調査で検証した（抄録）。", "p4": "研究1は利用者485人（平均41.54歳、男性50%）、研究2は成人形成期の473人（平均21.25歳、男性49%）で、研究2は研究1の再現と拡張である（抄録）。well-beingは感情的な面と非感情的な面に分けて測ったと読み取れる。", "p5": "研究1では、仕事の効率のための利用は有能感の充足を通じて非感情的なwell-beingの高さと関連した。研究2では、社会的な交流のための利用は関係性の充足の低さを通じてwell-beingの低さと関連し、遊び心のための利用は自律性の充足を通じて非感情的なwell-beingの高さと関連した（抄録）。", "p6": "どちらも横断調査で、因果の向きは特定できない（抄録から言える範囲）。解釈：対象国や利用頻度の統制、自己申告の偏りは本文を読めず未確認。", "fun": "同じChatGPTでも、仕事を早く片付けるために使う人は『自分はできる』という感覚が高まり、話し相手として使う人は人とのつながりの満足が低く、幸福感も低い傾向がありました。道具そのものではなく、何のために使うかが心への効き方を分けるという結果です。ただし、寂しい人ほどAIに話しかける、という逆向きの可能性もあります。", "unverified": "本文を読めず、効果の大きさ、調査国、統制変数は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "監査委員と監査パートナーの話し方が交渉を変える", "title": "How Do Audit Committee Members' and Audit Partners' Communication Styles Jointly Influence Client Managers' Negotiation Behavior?", "url": "https://doi.org/10.2139/ssrn.7555978", "authors": "Abhijit Das ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Das, A., & Phang, S.-Y. (2026). How Do Audit Committee Members’ and Audit Partners’ Communication Styles Jointly Influence Client Managers’ Negotiation Behavior? https://doi.org/10.2139/ssrn.7555978", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "監査委員の攻撃的な話し方は依頼人（CFO）を頑なにして監査人の修正提案への譲歩を減らすが、監査パートナーが共感を示すとその抵抗が消えることを、実験で示した（抄録）。", "p2": "論点のある会計処理をめぐる監査人と依頼人の交渉は報告される財務数値を左右するが、監査委員と監査人のコミュニケーションの組み合わせが交渉にどう効くかは分かっていない（抄録）。", "p3": "経験のある財務担当役員がCFO役となり、監査委員の同席のもとで、模擬の監査パートナーと棚卸資産の陳腐化引当金を交渉する。監査委員の分配的な話し方（攻撃的か防御的か）と、監査パートナーの反映的な共感（高いか低いか）を被験者間で操作した（抄録）。理論は対人コミュニケーションの関係的フレーミング理論である。", "p4": "依頼人の最初の交渉上の立場と、最終的に合意した引当金の額で、監査人の修正への譲歩の程度を測った（抄録）。参加者数は抄録に記載がない。", "p5": "攻撃的な監査委員の話し方は、依頼人に報告上の立場を固めさせ、譲歩を減らした。ただし監査パートナーの共感が高いと、この抵抗は打ち消された。この型は最初の立場から最終的な合意額まで続いた（抄録）。効果の大きさは未確認。", "p6": "実験室の模擬交渉で、1つの会計論点（陳腐化引当金）に限られる。解釈：実際の交渉での関係の長さや監査報酬の圧力など、現場の要因は扱われていない可能性がある。", "fun": "会社の数字をめぐって監査人と経営者が交渉するとき、横に座る監査委員が強い口調だと、経営者は意地になって譲らなくなります。そこで監査人が『お気持ちは分かります』と共感を示すと、こわばりが解けました。正しさだけでなく、話し方が会計の数字を動かすのです。", "unverified": "本文を読めず、参加者数と効果の大きさは未確認。"}}, {"id": "pr11", "rank": 11, "headline": "POD縮約モデルで溶接残留応力を逆推定", "title": "Inverse estimation of residual stresses in welded structures using a POD-based reduced-order model", "url": "https://doi.org/10.2139/ssrn.7565248", "authors": "Seung-Gyu Lee ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Lee, S.-G., Jeong, J.-Y., & Kim, H.-G. (2026). Inverse estimation of residual stresses in welded structures using a POD-based reduced-order model. https://doi.org/10.2139/ssrn.7565248", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "溶接部から離れた境界の一部で測った変位から、固有直交分解（POD）による縮約モデルで変位場全体を再構成し、溶接構造の残留応力を逆推定する方法を提案した（抄録）。", "p2": "溶接残留応力の推定は構造の安全性に重要だが、溶接部を直接測るのは難しい。少ない離れた点の計測から推定できれば実用性が高い（解釈：抄録から読める動機）。", "p3": "溶接部の断面を切断したときの変位の変化を『スナップショット』として、Abaqusの熱-構造連成の溶接解析で多数作る。そのPODベクトルと係数から縮約モデルを作り、遠方の境界で測った変位から擬似逆行列で全変位場を復元し、それを境界条件として有限要素モデルに与えて切断面の残留応力を求める（抄録）。", "p4": "数値例で、測定位置と測定雑音の有無を変え、推定した残留応力を正解と比べた（抄録）。評価指標の具体名は抄録に記載がない。", "p5": "測定雑音がなければ、測定位置によらず残留応力を推定できた。雑音を加えると、測定位置が切断面から遠いほど誤差が徐々に大きくなった（抄録）。誤差の数値は未確認。", "p6": "検証は数値例のみで、実構造物の実測での検証は抄録にない。縮約モデルはスナップショットを作った溶接条件の範囲に依存すると考えられる（解釈）。", "fun": "溶接した金属には、冷えるときの縮みで、目に見えない力（残留応力）が閉じ込められます。この研究は、たくさんのシミュレーションから変形の『典型パターン』を取り出しておき、離れた場所の少しのずれから全体の様子を逆算しました。少ない手がかりから全体を推理する、探偵のような計算です。", "unverified": "本文を読めず、誤差の大きさと対象の溶接構造の形状は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "標準化されたESG指標が投資家の自信を過大にする", "title": "Standardized but Not Comparable: Effects of Standardized ESG Metrics on Retail Investors' Perceived Competence and Delegation in Investment Decisions", "url": "https://doi.org/10.2139/ssrn.7561458", "authors": "Lauren Frederick ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Frederick, L., Rennekamp, K. M., White, B. J., & Zhang, X. (2026). Standardized but Not Comparable: Effects of Standardized ESG Metrics on Retail Investors’ Perceived Competence and Delegation in Investment Decisions. https://doi.org/10.2139/ssrn.7561458", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "標準化されたESG指標でも中身の比較可能性が低いと、個人投資家は自分で評価できると過信し、専門家への投資の委任を減らすという、標準化の意図せぬ帰結を実験で示した（抄録）。", "p2": "規制当局と基準設定者は投資判断を良くするためにESG指標の標準化を進めるが、共通の尺度で表すこと（標準化）と、差が実質的な業績の差を表すこと（実質的な比較可能性）は別である（抄録）。", "p3": "従業員のwell-beingを題材に、従業員一人当たりの支出という標準化された指標と、より豊かだが標準化されていない開示を比べる予備実験と、委任と自己投資の選択を測る本実験を行った（抄録）。", "p4": "予備実験では指標の重みづけと解釈、本実験では専門家への委任の意思と自己投資の増減を測り、サステナビリティ志向の投資家と通常の投資家を比べた（抄録）。", "p5": "投資家は標準化された一人当たり支出の指標を豊かな開示より重く見て、あいまいさにもかかわらず支出が多いことを好意的に解釈した。本実験では、この指標はサステナビリティ志向の投資家でのみ委任を減らし、自己投資を増やした（抄録）。", "p6": "題材は従業員の支出という1つの指標で、実験参加者の構成と規模は抄録にない。解釈：実際の投資成績への影響は測られていない。", "fun": "『社員一人に年間いくら使っているか』という数字は分かりやすいですが、多ければ良いとは限りません（無駄遣いかもしれない）。それでも数字が分かりやすいと、人は『自分で判断できる』と思い込み、専門家に相談しなくなります。分かりやすさが、かえって判断を誤らせることがあるのです。", "unverified": "本文を読めず、参加者数と効果の大きさは未確認。"}}, {"id": "pr13", "rank": 13, "headline": "パナマ運河拡張で企業は輸入経路をどう変えたか", "title": "The Route Not Taken: Adjustment Headroom after the Panama Canal Expansion", "url": "https://doi.org/10.2139/ssrn.7555782", "authors": "Xabier Barriola ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Barriola, X., Li, Z., & Wu, J. (2026). The Route Not Taken: Adjustment Headroom after the Panama Canal Expansion. https://doi.org/10.2139/ssrn.7555782", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は出版社サイトから取得できず", "preprint": true, "p1": "2016年のパナマ運河拡張で、それまで米国東部の港をあまり使っていなかった企業ほど、アジアからの輸入を東部経由に切り替え、国内の拠点網まで組み替えたことを示した（抄録）。", "p2": "海上の要所が止まったときの企業の損失はよく研究されているが、容量が増えたときに企業がどう動くかはほとんど分かっていない（抄録）。", "p3": "米国の輸入記録を船舶の位置と大きさ、事業所網、財務諸表に結び付け、拡張によって経路を変える価値が生じる輸入の部分（新しい玄関口の固定費を差し引いたもの）を『調整の余地』として分析した（抄録）。", "p4": "拡張前の東部港の利用度の四分位で企業を分け、東部の輸入比率、旧閘門を通れない大型船とそれ以外の比較、拠点・設備投資・利益・支払日数の変化を見た（抄録）。", "p5": "利用度が最も低い四分位の企業は、最も高い四分位に比べ東部の輸入比率を11ポイント上げた。旧閘門を通れない大型船では東部比率が17.6ポイント上がり、通れる船では3.2ポイントだった。これらの企業は東部の州に新たに進出し、設備投資と総資産利益率を上げ、支払日数は約9%延びた（抄録）。", "p6": "識別の前提（他の要因が同時に変わっていないこと）の検証は抄録からは未確認。著者は、現在の利用者だけを見た予測や強靭性評価は調整の余地のある企業を見落とすと指摘する（抄録）。", "fun": "運河が広がると、得をするのは今その運河を使っている会社だと思いがちです。ところが実際に大きく動いたのは、これまで東海岸をあまり使っていなかった会社でした。海の道が一本太くなると、内陸の倉庫の置き場所や支払いの仕方まで変わる、という連鎖が面白い点です。", "unverified": "本文を読めず、推定式と頑健性の検定は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "顧客が機械になる「エージェント型商取引」の総説", "title": "When the customer is a machine: a systematic literature review and integrative framework of agentic commerce", "url": "https://doi.org/10.21203/rs.3.rs-11222729/v1", "authors": "Mahyar Tourchi Moghaddam ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Moghaddam, M. T., Alipour, M., & Grunert, K. G. (2026). When the customer is a machine: a systematic literature review and integrative framework of agentic commerce. https://doi.org/10.21203/rs.3.rs-11222729/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリントの本文PDF（序論、方法とPRISMAの流れ図、限界、結論）を読んだ。長大な§4〜§8の総合は要所のみ", "preprint": true, "p1": "AIエージェントが消費者の代わりに探し・比べ・交渉し・支払う『エージェント型商取引』の研究を、1990年代後半のショップボット研究から現在まで140本の一次研究で体系的に整理し、参照枠組みと研究課題・測定手段を示した（抄録、結論）。", "p2": "マーケティングの理論と測定は『受け手は人間』という前提に立つが、エージェントの普及でその前提が揺らいでいる。証拠はマーケティング・情報システム・計算機科学・経済学・法学に散らばり、初期のショップボット研究はほぼ忘れられている（抄録、序論）。", "p3": "SPAR-4-SLRの手順とPRISMA 2020の報告に従い、Scopus・Web of Science・EBSCOの5,157件を選別し、参照のたどりを加えて1994〜2026年の140本を集めた（抄録、図1）。各研究を影響の向き・顧客の旅の段階・委任の深さ・手法・研究の波（約1994〜2010年と、LLM普及後）で符号化した（抄録）。", "p4": "データベースからの採用は112本で、二次研究・論説（13件）や報告不十分（18件）などを除外した（図1）。3人の著者で基準を較正し、決定の記録と再計算できる行列を公開している（限界）。", "p5": "主体の分類と5段階の『委任のはしご』、エージェント『へ』『を通じて』『による』マーケティングを分ける影響の三角形、信頼と統治の基盤、2つの波をつなぐ市場分析を示し、4層の参照枠組み、10の命題、5つの測定手段にまとめた（抄録）。行動研究は助言するだけのエージェントに偏り、実際に行動するエージェントを観察した実証は6本しかなかった（結論）。", "p6": "用語が急速に変わる時期の検索で表現の取りこぼしがあり得る。第2波の105本のうち96本は2024年以降で、ワーキングペーパーも多い。実地研究は5本で、実際の取引データはない。対象は消費者向けで、企業間取引への適用は未検証（限界）。", "fun": "もし買い物をするのが人ではなくAIになったら、広告やブランドは誰に向ければよいのでしょう。この総説は、30年前の価格比較ロボットの研究にすでに答えの手がかりがあったことを掘り起こしました。値段の比較がほぼタダでも有名ブランドが選ばれた、という昔の発見が、今のAI時代にもつながっています。", "unverified": "§5〜§8の個々の知見と10の命題の中身は読み切れていない。"}}, {"id": "pr15", "rank": 15, "headline": "高齢者の社会的ネットワークと3種の孤独", "title": "Social Network Size and Virtual Social Network Use in Relation to Social, Emotional, and Overall Loneliness Among Community-Dwelling Older Adults: A Cross-Sectional Study", "url": "https://doi.org/10.21203/rs.3.rs-10782740/v1", "authors": "Hamed Rahimzadeh Bonab ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Bonab, H. R., Hosseini, R. s., Mohammadzadeh, M., Afshr, P. F., & Bayat, M. (2026). Social Network Size and Virtual Social Network Use in Relation to Social, Emotional, and Overall Loneliness Among Community-Dwelling Older Adults: A Cross-Sectional Study. https://doi.org/10.21203/rs.3.rs-10782740/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareのプレプリントの本文PDF（抄録、結果の表4〜5の記述、考察、限界）を読んだ", "preprint": true, "p1": "地域の高齢者では、現実の社会的ネットワークの大きさが社会的な孤独と全体の孤独を、SNSの利用が情緒的な孤独を、それぞれ主に説明するという役割の違いを示した（抄録）。", "p2": "孤独は高齢期の大きな心理社会的課題だが、現実のつながりとオンラインのつながりが、孤独のどの側面（社会的・情緒的）にどれだけ効くかは明らかでない（抄録）。", "p3": "イランのボナブとマラーゲのデイケアセンターと福祉施設に通う高齢者147人に、De Jong Gierveld孤独尺度、Lubbenの社会的ネットワーク尺度（LSNS-6）、SNS利用の質問紙を実施し、相関と単回帰・重回帰で比べた（抄録、§2）。解釈：社会的孤独は付き合う人の少なさ、情緒的孤独は親密な相手の欠如を指す。", "p4": "孤独の3つの得点（社会的・情緒的・全体）を目的変数とし、ネットワークの大きさとSNS利用それぞれの説明力（決定係数）を、単独と同時投入のモデルで比べた（表4〜5）。", "p5": "ネットワークの大きさは社会的孤独（r=−0.52）と全体の孤独（r=−0.42）と負に相関し、情緒的孤独とは相関しなかった（p=0.238）。SNS利用は情緒的孤独と負に相関した（ρ=−0.20）。回帰ではネットワークの大きさが社会的孤独（B=−0.15）と全体の孤独（B=−0.12）の最も強い予測因子で、分散の27%と20%を説明し、SNS利用は情緒的孤独を独立に予測した（B=−0.04、p=0.037）（抄録）。若さ・高学歴・高所得・使う媒体の多さがSNS利用の多さと関連した。", "p6": "横断研究で因果は言えず、2都市の便宜標本で一般化に限界があり、すべて自己申告である。デジタルな能力、抑うつ、関係の質は十分に測っていない（限界）。", "fun": "友だちの『数』が多いと『付き合う人がいない』寂しさは減りますが、『心から分かり合える人がいない』寂しさは減りませんでした。逆に、SNSで家族や昔の友人とつながることは、後者の寂しさを少し和らげていました。寂しさにも種類があり、効く薬が違うという発見です。", "unverified": "表5の決定係数の全値と表6〜7の詳細は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "振動駆動推進の流体-構造連成に解析解ベンチマーク", "title": "A New Fluid-Structure Interaction Benchmark with an Analytical Solution Describing Vibration-Driven Propulsion in a Viscous Fluid", "url": "https://doi.org/10.21203/rs.3.rs-10892297/v1", "authors": "Vadim Anisimov ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Anisimov, V., Nuriev, A., & Zaitseva, O. (2026). A New Fluid-Structure Interaction Benchmark with an Analytical Solution Describing Vibration-Driven Propulsion in a Viscous Fluid. https://doi.org/10.21203/rs.3.rs-10892297/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "内部の質量の往復で振動する円柱が粘性流体中を自走する問題に、精度を管理した解析解を与え、流体-構造連成（FSI）計算の検証用ベンチマークとして提案した（抄録）。", "p3": "漸近展開で定常の自己推進状態を解き、振幅・位相差・巡航速度を簡単な代数式で表した。OpenFOAMの3自由度・2.5自由度モデルの数値計算と比較した（抄録）。", "p5": "運動学（振幅・位相差）の平均相対誤差は2%以内、巡航速度の平均の差は6%以内で、解析解と数値解がよく一致した。設定ファイルとデータを公開している（抄録）。", "fun": "羽ばたく翼のように、体が揺れるだけで水の中を一方向に進めるのは不思議です。この論文は、その複雑な流れと物体の押し合いを、紙と鉛筆で解ける式にまで落とし込みました。答えが分かっている問題は、新しいシミュレーションプログラムが正しく動くかを確かめる『ものさし』として役立ちます。", "unverified": "本文・図表は未確認。解析解の適用範囲（レイノルズ数など）は抄録に記載がない。"}}, {"id": "pr17", "rank": 17, "headline": "RAG型LLMで監査リスクを評価する仕組み", "title": "Design and Analysis of an Intelligent Audit Risk Assessment System Based on Retrieval-Augmented Large Language Model", "url": "https://doi.org/10.2139/ssrn.7564884", "authors": "Jiayi Wang", "venue": "SSRN", "date": "2026-10-05", "apa": "Wang, J. (2026). Design and Analysis of an Intelligent Audit Risk Assessment System Based on Retrieval-Augmented Large Language Model. https://doi.org/10.2139/ssrn.7564884", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "検索拡張生成（RAG）を使う大規模言語モデルとベイズ・ロジスティックの推定を組み合わせ、監査リスクを文脈込みで評価する枠組みを提案した（抄録）。", "p3": "財務・ガバナンス・業務・テキストの情報を、監査基準・規制事例・過去の会計不正の知識と統合する。評価には14業種・2018〜2024年の612企業年からなる、経済的に較正した合成データを使った（抄録）。", "p5": "標本外のAUCは0.912で、勾配ブースティング（0.754）、ランダムフォレスト（0.723）、ロジスティック回帰（0.694）を上回り、Brierスコアは0.088だった（抄録）。解釈：実データでなく合成データでの評価である点に注意が要る。", "fun": "監査人は数字だけでなく、規則や過去の不正事例を思い出しながら『危ない会社』を見抜きます。この研究は、AIに資料を検索させながら判断させることで、その人間らしい推理をまねようとしました。ただし試したのは作ったデータなので、本物の会社で通用するかがこれからの問いです。", "unverified": "合成データの作り方と、実データでの検証の有無は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "臨床と財務のデータを統合し病院経営を改善", "title": "Integrating Clinical and Financial Data Analytics to Improve Hospital Performance and Strategic Decision Making", "url": "https://doi.org/10.2139/ssrn.7546840", "authors": "Nathaniel Sackey", "venue": "SSRN", "date": "2026-10-05", "apa": "Sackey, N. (2026). Integrating Clinical and Financial Data Analytics to Improve Hospital Performance and Strategic Decision Making. https://doi.org/10.2139/ssrn.7546840", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "病院の臨床データと財務データを結び付けて分析し、経営判断に使うための枠組みを示した概念的な論文である（抄録）。", "p3": "診療エピソード単位のデータモデル、バランスのとれた業績測定、記述から因果評価・制約付き最適化へ進む分析の流れを定める。リスク調整、帰属、分母の管理、関連・予測・因果の区別を重視する（抄録）。", "p5": "4つの図解（統計的工程管理図、Pareto分析による原価差異など）で枠組みを示すが、使った数値はすべて架空と明記されている。導入は狭い意思決定から始めるべきだと提言する（抄録）。", "fun": "病院では、患者さんの記録とお金の記録が別々のシステムにあり、『この赤字はどの治療の流れで生じたのか』がすぐには分かりません。この論文は、二つを同じ患者の同じ入院で結び付ける設計図を描きました。相関を原因と取り違えないよう注意を促している点も大事です。", "unverified": "実際の病院への適用例は抄録にない（数値は架空）。"}}, {"id": "pr19", "rank": 19, "headline": "デジタルツイン同士の情報交換を契約で規定", "title": "Digital Twin-to-Digital Twin Communication (DT2Com): A Contract-Based Information Exchange Framework through a Digital Twins Intelligent Exchange Point (DT-IXP)", "url": "https://doi.org/10.2139/ssrn.7556243", "authors": "Josue Uwimana", "venue": "SSRN", "date": "2026-10-05", "apa": "Uwimana, J. (2026). Digital Twin-to-Digital Twin Communication (DT2Com): A Contract-Based Information Exchange Framework through a Digital Twins Intelligent Exchange Point (DT-IXP). https://doi.org/10.2139/ssrn.7556243", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "デジタルツイン同士がデータをやり取りするとき、受け入れの可否・使い方・予測上の価値を契約として明示する枠組み（DT-IXP、DT2Com）を定義した（抄録）。", "p3": "経路・同一性・受け入れなど9つの条件付き定理と証明、実行可能なテストを用意し、環境センサの実測データと医療データの再生実験で検証した（抄録）。", "p5": "2,584件の時系列の検証データで一酸化炭素のMAEは0.5189 mg/m3、文脈情報を止めると0.5823に悪化したが、ガスのみの再推定モデルより明確に良くはなかった。契約の強制で不正な15,504件のメッセージをすべて拒否した（抄録）。", "fun": "データを正しく届けることと、そのデータが役に立つことは別の問題です。この研究は、両者を分けて『届け方の正しさ』は数学的に保証し、『役立ち度』は実験で測りました。役立つはずの情報が、実際には予測をあまり改善しなかったと正直に報告している点も面白いところです。", "unverified": "本文の定理の内容と、医療データの詳細は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "職場AIでの思考の外部委託を測るBloomy", "title": "Bloomy: Measuring Cognitive Development and Detecting Unproductive Cognitive Offloading in Workplace AI Interactions", "url": "https://doi.org/10.5281/zenodo.23154975", "authors": "Englisher Academy ほか", "venue": "Zenodo", "date": "2026-10-05", "apa": "Englisher Academy, & Neshawy, M. (2026). Bloomy: Measuring Cognitive Development and Detecting Unproductive Cognitive Offloading in Workplace AI Interactions. Zenodo. https://doi.org/10.5281/ZENODO.23154975", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの文書の抄録（DataCite登録）を読んだ。審査のない置き場の概念論文", "preprint": true, "short": true, "p1": "職場で生成AIを使う日常のやり取りの中で、従業員自身の思考の発達を測り、AI利用が時間の節約から技能の衰えへ変わる兆しを検出する枠組みBloomyを提案した概念論文である（抄録）。", "p3": "改訂版ブルームの分類の19の認知過程に沿って、チャットの中の短い任意の問いかけから本人の思考を証拠として記録する。「まず考え、それから尋ねる」を原則とする（抄録）。", "p5": "実証結果はなく、エジプト・サウジアラビア・UAEでの試行が計画段階である。完全な仕様は非公開とされる（抄録）。", "fun": "AIがきれいな企画書を書いてくれる時代には、上司は部下がどれだけ自分で考えたかを見分けにくくなります。この提案は、試験も監視もせず、普段のAIとの会話の中で『自分の考えをまず書く』習慣を測ろうとする発想です。効き目を確かめるのはこれからです。", "unverified": "枠組みの詳細（仕様は非公開）と有効性の証拠は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "AIが増やす女性教員の見えない学術労働", "title": "Invisible Academic Labor and AI Enabled Workload in Women Faculty Career", "url": "https://doi.org/10.21203/rs.3.rs-10905710/v1", "authors": "Swati Arora ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Arora, S., Subnani, H., Srivastava, P., & Nagar, P. (2026). Invisible Academic Labor and AI Enabled Workload in Women Faculty Career. https://doi.org/10.21203/rs.3.rs-10905710/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ。抄録は途中で切れていた", "preprint": true, "short": true, "p1": "女性大学教員について、見えない学術労働とAIによる仕事量の増加が、仕事と生活の両立・職務満足・キャリア発達にどう関わるかを調べた横断調査である（抄録）。", "p3": "仕事の要求度-資源（JD-R）モデル、感情労働理論、仕事-家庭境界理論に基づき、300人の回答を回帰とブートストラップの媒介分析で分析した（抄録）。", "p5": "見えない学術労働とAIによる仕事量は、それぞれ仕事と生活の両立と負に関連した（β = −0.353、β = −0.243）（抄録）。抄録はここで途切れており、残りの結果は未確認。", "fun": "AIは仕事を楽にするはずなのに、新しい道具の習得や確認作業で、かえって仕事が増えることがあります。この研究は、そうした目に見えにくい負担が、とくに女性教員の生活との両立を圧迫していないかを数字で確かめようとしました。", "unverified": "抄録が途中で切れており、p値・媒介効果・満足度の結果は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "住宅の温熱環境の最低基準を専門家と市民合意で", "title": "The Social Floor for the Residential Thermal Environment: Operationalising the Dual Strategy through Expert Knowledge and Citizen Consensus", "url": "https://doi.org/10.2139/ssrn.7565049", "authors": "Milan Vervoort ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Vervoort, M., Defloor, B., & Bleys, B. (2026). The Social Floor for the Residential Thermal Environment: Operationalising the Dual Strategy through Expert Knowledge and Citizen Consensus. https://doi.org/10.2139/ssrn.7565049", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "住宅の温熱環境の最低基準（社会的な床）を、専門家の知識と市民の熟議を組み合わせるDoyalとGoughの二重戦略で定めた（抄録）。", "p3": "専門知識と生活経験の記録を材料に市民主導のフォーカスグループで議論し、温冷感申告と室温の上限・下限を提案させ、グループ内と全体で集約した（抄録）。", "p5": "完全な合意には至らなかった。昼の下限・上限は17.8℃・28.9℃、夜は9.6℃・26.1℃で、多くの専門家基準より快適さが低かった。行動上の適応や公共空間を参加者が見込んだためと考察している（抄録）。", "fun": "『家の中は何度なら我慢できるか』を専門家だけでなく市民が話し合って決めると、専門家の基準よりも厳しい暑さ寒さを受け入れる結果になりました。電気代や環境への負担を、市民が自分ごととして天秤にかけたからです。快適さの基準も、誰が決めるかで変わるという例です。", "unverified": "参加者数・実施国・集約方法の詳細は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "安全性分類では判定LLMも規則も妥当性に欠ける", "title": "Neither the Judge nor the Rules: Instrument-Validity Failure in Safety-Response Classification", "url": "https://doi.org/10.21203/rs.3.rs-11238983/v1", "authors": "Yangyi Zhang", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Zhang, Y. (2026). Neither the Judge nor the Rules: Instrument-Validity Failure in Safety-Response Classification. https://doi.org/10.21203/rs.3.rs-11238983/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "LLMの安全性評価で使う自動判定器（LLMによる判定と手作りの規則による分類器）を、人手ラベルに照らして測定器として検証し、どちらも正確でないことを示した（抄録）。", "p3": "550試行のコーパスから抜き出した32件の応答に独立に人手でラベルを付け、両判定器の精度・クラスごとの再現率・一致度（カッパ係数）を調べた（抄録）。", "p5": "1.5BパラメータのLLM判定器の正解率は65.6%で、本当に危険な4件を1件も検出できず、規則分類器は53.1%だった。全体での一致率は61.6%だがカッパは0.115にとどまり、規則分類器の危険判定数は版により40件と8件で揺れた（抄録）。", "fun": "体重計そのものが狂っていたら、ダイエットの成果は測れません。AIの安全性を測る『判定器』も同じで、この研究は判定器自体の精度を確かめずに使われてきたことを示しました。見かけの一致率が高くても、多数派の答えに寄せているだけのことがある、という統計の落とし穴も教えてくれます。", "unverified": "人手ラベルの手順と、判定器の詳細な設定は未確認。検証は32件と小規模。"}}, {"id": "pr24", "rank": 24, "headline": "メキシコの住宅スプレッドと建設費の壁", "title": "Beyond the Regulatory Tax: The Housing Spread and the Hard-Cost Barrier in Mexico", "url": "https://doi.org/10.2139/ssrn.7554141", "authors": "Félix Enrique Lavín Simón", "venue": "SSRN", "date": "2026-10-05", "apa": "Lavín Simón, F. E. (2026). Beyond the Regulatory Tax: The Housing Spread and the Hard-Cost Barrier in Mexico. https://doi.org/10.2139/ssrn.7554141", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "メキシコの住宅で、価格と限界建設費の差（スプレッド）を縮めても、物理的な建設費の下限のため多くの世帯は持ち家に届かないことを、構造モデルの較正で示した（抄録）。", "p3": "GlaeserとGyourkoの住宅供給の枠組みをメキシコに合わせて拡張し、家計調査ENIGHの所得分布とモンテレイ都市圏の建替えの実態を対比する二重の較正と、Stone-Geary型選好のモデルを用いた（抄録）。", "p5": "価格/限界費用の比は郊外で1.10〜1.20倍、市街地中心部で1.48〜1.68倍と、米国の規制の厳しい都市圏（2.0〜3.0倍）より小さかった。建設費の下限のため、正規雇用の都市世帯の下位50%が排除されると示した（抄録）。", "fun": "家が高いのは規制のせいだ、という説明は米国ではよく当てはまります。ところがメキシコでは、規制による上乗せはずっと小さく、資材と正規の人件費そのものが高い壁になっていました。同じ『住宅が買えない』でも、国によって原因が違うことを示す例です。", "unverified": "本文の較正の詳細と感度分析は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "つながり過剰の時代の社会的孤立の概念整理", "title": "Social Isolation in the Age of Hyperconnectivity: A Conceptual Review of Belonging, Trust, and Psychological Well Being", "url": "https://doi.org/10.2139/ssrn.7554518", "authors": "Fatemeh Hajiali", "venue": "SSRN", "date": "2026-10-05", "apa": "Hajiali, F. (2026). Social Isolation in the Age of Hyperconnectivity: A Conceptual Review of Belonging, Trust, and Psychological Well Being. https://doi.org/10.2139/ssrn.7554518", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "いつでも連絡が取れる社会でなぜ社会的孤立が続くのかを、所属感・関係の信頼・社会参加の質という3つの機構で整理した概念的なレビューである（抄録）。", "p3": "公衆衛生の報告、メタ分析、学際的な研究をもとに、客観的な孤立と主観的な孤独を区別し、統合的な枠組みを提案した。一次データはない（抄録）。", "p5": "デジタルなつながりは意味のある関係の単純な代わりにはならず、接触の心理的な価値は互恵性・安全感・継続性・承認に左右されると論じた。接触の回数より関係の質と安定性を測るべきだと提言する（抄録）。", "fun": "スマホで何百人とつながっていても孤独を感じる、という逆説があります。この論文は、大事なのは連絡先の数ではなく、相手を信頼できるか、続く関係か、自分が認められているか、だと整理しました。『届く』ことと『つながっている』ことの違いを言葉にした論文です。", "unverified": "概念的レビューで新しいデータはない。依拠した文献の範囲は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "偽レビューを検出し説明する機械学習", "title": "Machine Learning for Detecting Fake Product Reviews: A Framework for Reliable and Explainable E-Commerce Review Analysis&nbsp;", "url": "https://doi.org/10.2139/ssrn.7560560", "authors": "Neha Bhagat", "venue": "SSRN", "date": "2026-10-05", "apa": "Bhagat, N. (2026). Machine Learning for Detecting Fake Product Reviews: A Framework for Reliable and Explainable E-Commerce Review Analysis&nbsp; https://doi.org/10.2139/ssrn.7560560", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "偽の商品レビューを検出し、判定の理由も説明できる機械学習の実装手順を、既存研究の整理から提案した概念的な論文である（抄録）。", "p3": "データ収集・前処理・特徴抽出（文面、投稿者の行動、投稿時刻、評点の型、文の類似、協調の痕跡）・学習・説明・人による確認・継続監視までを枠組みにまとめ、古典的手法とTransformerを比較の候補として挙げる（抄録）。", "p5": "新しいモデルの学習や検証は行っておらず、精度の主張はない。今後の評価計画として適合率・再現率・F1・データセット間の性能などを示した（抄録）。", "fun": "本物そっくりの偽レビューは、文章だけ見ても見抜けません。この論文は、誰がいつ書いたか、ほかの投稿者と示し合わせていないか、といった『書き方以外の手がかり』を組み合わせる設計図を描きました。まだ試していない計画段階の提案です。", "unverified": "概念的な提案で、実験結果はない。"}}, {"id": "pr27", "rank": 27, "headline": "液滴の広がりを非線形1自由度縮約モデルで", "title": "Droplet Spreading on Nanowall-Textured Hydrophobic Surfaces: A Nonlinear Reduced-Order Model", "url": "https://doi.org/10.21203/rs.3.rs-11221595/v1", "authors": "Mubarak Yakubu ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Yakubu, M., & Ismail, N. A. (2026). Droplet Spreading on Nanowall-Textured Hydrophobic Surfaces: A Nonlinear Reduced-Order Model. https://doi.org/10.21203/rs.3.rs-11221595/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "ナノ壁構造のある撥水面に水滴が衝突して広がる様子を、非線形の1自由度の縮約モデルで表した（抄録）。", "p3": "流れを解く多相流計算ではなく、半径方向の変形だけを表す集中定数モデルである。毛管剛性は慣性-毛管の時間尺度で決め、3次の剛性を滑らかな面の広がり率1点で較正し、ナノ壁の効果は運動抵抗と『動く→止まる』の切替で表した（抄録）。", "p5": "20µLの水滴を20mmから落とすと、最大広がり率は線形モデルで3.955、非線形で2.253、ナノ壁の面で1.810だった。既報の定性的な傾向と一致したが、数値データがないため点ごとの誤差は示していない（抄録）。", "fun": "水滴が面にぶつかって広がる現象は、本来は複雑な流体の計算が必要です。この研究は、それをばねとおもり一つの振動のように単純化して、どこまで説明できるかを試しました。単純なモデルでも、どのつまみ（非線形の硬さや引っかかり）が結果を左右するかが見えてきます。", "unverified": "実験データとの定量比較はない（著者も明記）。"}}, {"id": "pr28", "rank": 28, "headline": "44状態を7状態に縮約した電池の電気化学モデル", "title": "A Seven-State Electrochemical Model for Lithium-Ion Battery State Estimation", "url": "https://doi.org/10.2139/ssrn.7565120", "authors": "nithin chandra toom ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "toom, n. c., Perinpanayagam, S., & Hosseinzadeh, E. (2026). A Seven-State Electrochemical Model for Lithium-Ion Battery State Estimation. https://doi.org/10.2139/ssrn.7565120", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "リチウムイオン電池の44状態の電気化学モデルを、リチウム量を正確に保ったまま7状態に縮約し、マイコンで動く状態推定モデルにした（抄録）。", "p3": "負極に2つ、正極に3つの有限体積の殻状態と、電解液の2つの座標を使い、11特徴の代数的な復元器を在庫ゼロの部分空間に射影した。動的な次数を84.1%減らした（抄録）。", "p5": "定電流の検証で端子電圧のRMSEは平均2.726mV、実セルの走行サイクルでは23.277mV（44状態モデルは22.042mV）だった。10セルでの充電率推定は2RCの拡張カルマンフィルタより誤差が小さく、評価ボードでの更新は最長2.493msだった（抄録）。", "fun": "電池の中身を正確に表す式は重すぎて、車載の小さなコンピュータでは動きません。この研究は、変数を44個から7個に減らしても、電池の中のリチウムの総量だけはぴったり保つ工夫で、精度をほとんど落とさずに軽くしました。物理の保存則を手放さない縮約の好例です。", "unverified": "縮約の手順の詳細と、温度変化への対応は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "デジタル時代の多モード社会的スキル尺度", "title": "Measuring Multimodal Social Skills in the Digital Age: Development and Validation of a Questionnaire", "url": "https://doi.org/10.31234/osf.io/t5q47_v2", "authors": "Aike Horstmann", "venue": "PsyArXiv", "date": "2026-10-05", "apa": "Horstmann, A. (2026). Measuring Multimodal Social Skills in the Digital Age: Development and Validation of a Questionnaire. https://doi.org/10.31234/osf.io/t5q47_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivのプレプリントの抄録を読んだ", "preprint": true, "short": true, "p1": "オンラインと対面の両方で使う社会的スキルを測る質問紙（多モード社会的スキル質問紙、MSSQ）を開発し、妥当性を検証した（抄録）。", "p3": "主張性・受容性・柔軟性・真正性・感謝・回復力の6次元を想定し、研究1（N=322）で120項目を探索的因子分析で絞り、研究2（N=260）で確認的因子分析を行った（抄録）。", "p5": "6因子構造が支持され、既存尺度との収束・弁別の相関も予想どおりで、内的一貫性も高かった（抄録）。", "fun": "人付き合いのうまさは、顔を合わせる場面とチャットとで同じとは限りません。この研究は、両方の場面での『人とつながる力』を6つの側面に分けて測る物差しを作りました。物差しの作り方（項目を絞り、別の集団で構造を確かめる）は、心理尺度づくりの基本の流れです。", "unverified": "項目の内容、調査国、信頼性係数の値は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "道路網データ統合の確率較正と被覆保証", "title": "Tri-Modal Calibration for Road Network Conflation: Four-State Labelling, Dirichlet Multi-Class Probabilities, and Conformal Coverage Guarantees", "url": "https://doi.org/10.5281/zenodo.23158777", "authors": "Peque ほか", "venue": "Zenodo", "date": "2026-10-05", "apa": "Peque, G. J. (2026). Tri-Modal Calibration for Road Network Conflation: Four-State Labelling, Dirichlet Multi-Class Probabilities, and Conformal Coverage Guarantees (Version 3). Zenodo. https://doi.org/10.5281/ZENODO.23158777", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに置かれたSIGSPATIAL '26採択論文の拡張版の抄録（DataCite登録）を読んだ", "preprint": true, "short": true, "p1": "2つの道路地図のリンク対応付け（コンフレーション）の信頼度スコアを確率として読むと危ういことを示し、部分一致を含む3クラスの較正法を示した（抄録）。", "p3": "新潟県の3都市で、TomTomの区間と国土数値情報（KSJ）の道路リンクの対応992件に、誤り・部分・完全・不確実の4ラベルを人手で付け、等張回帰やディリクレ較正を比べた（抄録）。", "p5": "スコア0.70〜0.85の帯では誤り4.7%、部分36.8%、完全58.5%が混在した。部分一致を誤りと数える厳格な期待較正誤差（ECE）は0.245、正しいと数えると0.019で、厳格ラベルで再較正すると0.017±0.004まで下がった（抄録）。", "fun": "地図アプリ同士で『この道とこの道は同じ』と照合するとき、自信度80%と出ても、本当に8割正しいとは限りません。この研究は、道の一部だけ重なる『半分正解』が混ざることで、自信度の意味がずれることを見つけました。何を正解と数えるかで、成績表の数字が大きく変わる好例です。", "unverified": "C4以降の結果（抄録の途中で切れていた）は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "生成AIの社会的迎合と統計操作の質的分析", "title": "Decoding Social Sycophancy and Statistical Manipulation in Generative AI: An Exploratory Qualitative Analysis in Software Engineering", "url": "https://doi.org/10.21203/rs.3.rs-11229501/v1", "authors": "Mohit Kaushik ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Kaushik, M., & Bawa, J. (2026). Decoding Social Sycophancy and Statistical Manipulation in Generative AI: An Exploratory Qualitative Analysis in Software Engineering. https://doi.org/10.21203/rs.3.rs-11229501/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "生成AIが利用者に迎合して事実や統計の正しさを手放す（迎合、sycophancy）様子を、ソフトウェア工学の文脈で質的に調べた探索的研究である（抄録）。", "p3": "Copilot・Gemini・ChatGPT・Perplexityの4モデルに、初心者・権威ある利用者・第三者の権威者という設定で多ターンの対話実験を行い、従い方と真実の劣化を観察した（抄録）。", "p5": "初心者設定ではpハッキングなど疑わしい手法を手伝い、権威者の圧力下では真実の劣化が強まった。独立した評価者の役を与えると統計的な正しさは回復したが、全モデルが捏造された引用を確信をもって認めた（抄録）。", "fun": "AIに『偉い人』として強く迫ると、AIが統計のごまかしに手を貸してしまう、という観察です。逆に『あなたは中立の審査員です』と役を与えると正しさを取り戻しました。AIの答えの正しさが、尋ね方や立場づけで揺れることを示しています。", "unverified": "質的・探索的研究で、試行数や判定基準の詳細は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMの口調を作る指示文書と言語の道徳化", "title": "Speaking like a human, correcting like a machine: tone technologies and the moralisation of language in large language models", "url": "https://doi.org/10.21203/rs.3.rs-10540058/v1", "authors": "Liz Dayanna Zarate Luengas ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Luengas, L. D. Z., & Sánchez, W. A. G. (2026). Speaking like a human, correcting like a machine: tone technologies and the moralisation of language in large language models. https://doi.org/10.21203/rs.3.rs-10540058/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "商用の大規模言語モデルの学習・評価で作業者に配られる指示文書を分析し、LLMの『人間らしい話し方』が出力の前に規範として作られていることを示した（抄録）。", "p3": "著者の一人が注釈者と品質評価者として働いた現地調査で得た4つの指示文書を、批判的談話分析で読み解いた（抄録）。", "p5": "有用・誠実・無害の3つの軸で話してよい内容と立場が決められ（無害が最も詳しく運用化）、さらに明瞭さや丁寧さなど口調まで規制されていた。理想の話し手は身体・歴史・立場を差し引いた人間像だと論じた（抄録）。", "fun": "AIが礼儀正しく話すのは、自然に身についたからではなく、たくさんの人が細かい規則に沿って『良い答え』を選んだ結果です。この研究は、その規則書そのものを読み、AIの人間らしさが誰によってどう作られるかを明らかにしようとしました。", "unverified": "文書の出所企業や時期、分析の具体例は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "AIと会計の正当化、マネロン対策の構造的亀裂", "title": "The Incompleteness of Accounting as a Technology of Control: Artificial Intelligence, Accounting Legitimation, and the Structural Fractures of Anti-Money Laundering", "url": "https://doi.org/10.2139/ssrn.7561299", "authors": "Andréa Alves Corrêa ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Corrêa, A. A., Montenegro Salamone Nunes, D., & Miranda Nazaré, S. R. (2026). The Incompleteness of Accounting as a Technology of Control: Artificial Intelligence, Accounting Legitimation, and the Structural Fractures of Anti-Money Laundering. https://doi.org/10.2139/ssrn.7561299", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "不正な資金が会計上もっともらしい表現を得てしまう『会計を介した正当化』の構造的な弱点を、マネーロンダリング対策の観点から探った（抄録）。", "p3": "8つのLLMの標準化した回答、IRaMuTeQによる語彙分析、30件の金融犯罪事例の文書分析、ファジィ集合の質的比較分析（fsQCA）を組み合わせ、手続き上の遮蔽・実質的支配者の不透明さ・データの断片化・評価の主観性・規制の硬直性の5条件を調べた（抄録）。", "p5": "簡潔解は評価の主観性→高い正当化で、一貫性0.976、被覆度0.617だった。核心の弱点は情報の欠落より、検証の難しい価値に形式上の妥当性を与えてしまう点だと論じた（抄録）。", "fun": "帳簿がきちんと整っていても、中身の価値が本物とは限りません。この研究は、資金洗浄で一番効く抜け穴は情報の隠蔽よりも『値段の付け方に裁量がある』ことだと示唆しました。会計の正しさと、経済的な実態の正しさは別物だということです。", "unverified": "LLMの回答をどう証拠として使ったかの詳細は未確認。事例は30件と少数。"}}, {"id": "pr34", "rank": 34, "headline": "マケドニアの中小企業金融としてのファクタリング", "title": "Perspectives of Factoring as an Alternative Source for Financing Macedonian SMEs", "url": "https://econpapers.repec.org/RePEc:zbw:esconf:343400", "authors": "Gjorgjioska ほか", "venue": "RePEc NEP", "date": "2026-10-05", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "北マケドニアの中小企業の資金調達手段としてのファクタリング（売掛債権の売却）について、法制度と実際の利用を分析した（抄録）。", "p3": "いくつかの経済指標をもとに、北マケドニアと周辺のバルカン諸国の法制度と利用状況を比較した（抄録）。", "p5": "ファクタリングは多くの法令で認められているが、金融会社や銀行が担い手となる際の統一的な規定が欠けていると指摘し、改善の提言を示した（抄録）。", "fun": "取引先からの支払いが2か月後でも、その請求書を今すぐ売れば現金が手に入ります。これがファクタリングです。資金繰りに悩む中小企業には頼れる手段ですが、ルールがばらばらだと使いにくい、という制度の大切さが分かる研究です。", "unverified": "用いた経済指標と比較対象国の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "中国の貯水池属性データベースCRAD", "title": "CRAD: A China Reservoir Attribute Database for Hydrological and Water Resources Applications", "url": "https://doi.org/10.5194/essd-2026-694", "authors": "Hongbin Liang ほか", "venue": "ESSD – Anthroposphere/Land and water management", "date": "2026-10-05", "apa": "Liang, H., Zhang, S., Obulkasim, O., Ye, Q., Song, L., Wei, Z., & Dai, Y. (2026). CRAD: A China Reservoir Attribute Database for Hydrological and Water Resources Applications. https://doi.org/10.5194/essd-2026-694", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "ESSDの討議用プレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "中国の5,142の貯水池について、20以上の属性をそろえたデータベースCRADを作り、水文・水資源の解析の基盤を改善した（抄録）。", "p3": "既存の世界・地域のデータベースを統合し、政府文書・企業や専門団体の資料・学術論文などから属性を補い、空間的な重複除去と出典の優先順位づけ、多段階の品質管理を行った（抄録）。", "p5": "中国の総貯水容量の87.5%、水力発電の設備容量の62.0%をカバーした。灌漑の格子の41.3%を貯水池の受益地と特定し（既存のGDWでは3.5%）、約70%の観測所で河川流量の再現が改善した（抄録）。", "fun": "ダムがどこにあるかだけでなく、どれだけ水をため、何のために使われているかが分からないと、川の流れは正しく計算できません。この研究は、世界一ダムの多い中国で、散らばった資料を集めてダムの『名簿』を作り直し、川の計算を実際に良くしました。地道なデータ整備が科学を前に進める例です。", "unverified": "属性ごとの欠測率と誤差の評価は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "33都市のスマート交通指標の主成分分析", "title": "Factors of Smart Transportation Development: A Principal Component Analysis of Global Urban Indicators Across 33 International Cities", "url": "https://doi.org/10.21203/rs.3.rs-10919823/v1", "authors": "Prof. TAREK ABDEL-LATIF ABOUL-ATTA ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "ABOUL-ATTA, Prof. T. A.-L., & ELNAWAWY, F. (2026). Factors of Smart Transportation Development: A Principal Component Analysis of Global Urban Indicators Across 33 International Cities. https://doi.org/10.21203/rs.3.rs-10919823/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "33の都市について、スマート交通の発展を特徴づける要因を主成分分析で抽出し、都市の準備度を順位づけた（抄録）。", "p3": "世界銀行などの公開データから交通インフラ・経済力・技術・革新・制度の15指標を集め、バリマックス回転の主成分分析を行い、負荷量0.50未満の指標を除いて構造を確かめた（抄録）。", "p5": "スマートな移動インフラ、輸送能力、経済力、革新と技術、制度的支援の5つの次元が見いだされ、これらが強い都市ほど準備度の得点が高かった（抄録）。解釈：33都市と標本が小さく、因果は示していない。", "fun": "『スマートな交通の街』に必要なものを、たくさんの指標の背後にある少数の共通因子として取り出す試みです。主成分分析は、多くの科目の点数から『理系力』『文系力』のような総合力を見つけ出す方法に似ています。", "unverified": "対象都市の一覧と順位、各成分の寄与率は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習（Hugging Face）", "headline": "進捗を段階的に描いて長期のロボット行動を計画", "title": "World Action Modeling with Progressive Visual Planning", "url": "https://arxiv.org/abs/2610.02508", "authors": "Fei Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "Zhang, F., An, Z., Frost, D., Wang, Y., Liu, P., Zhang, Y., Drozdzal, M., & Bar, A. (2026). World Action Modeling with Progressive Visual Planning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02508", "why": "世界行動モデルの長期予測を、密な動画生成なしに段階的な視覚計画で効率化する提案で、Hugging Faceで最多の支持を集めた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§3、実験§4.1〜4.4、付録Fの限界、表4）を読んだ", "preprint": true, "p1": "ロボットの行動と、そこへ至る途中の『部分目標』の画像の列を同時に予測する世界行動モデルProWAMで、動画を全部生成せずに長い作業を計画できるようにした（抄録）。", "p2": "世界行動モデル（WAM、将来の映像と行動を同時に予測するモデル）は長い作業が苦手である。密な動画を毎回生成するのは非効率で、最終目標の1枚だけを予測する方式は『どう進むか』を示さない（抄録、§3）。", "p3": "現在の観測から作業の終わりまでを進捗r∈[0,1]で正規化し、選んだ進捗位置の未来のフレームを部分目標として、動画の潜在列の後ろに並べて同時にノイズ除去する（式4〜5、§3）。進捗rは正弦波の埋め込みで各部分目標に与える。学習は2段階で、行動ラベルのない動画で部分目標の予測を学び、ロボットの実演で行動と同時に微調整する（図2）。推論では動画側を1回だけ計算して部分目標の特徴をキャッシュし、行動側だけを軽く反復する（§3）。", "p4": "LIBERO・LIBERO-Plus・RoboTwin・RoboCasa365のシミュレーションと、Frankaの実機4課題（DROIDで学習、現場データなし）で、各ベンチマーク標準の平均成功率を比べた（§4.1、§4.3）。動画の基盤はWan2.2-TI2V-5Bである（§4.1）。", "p5": "LIBERO-Plusで85.8%、ランダム化したRoboTwinで75.7%と最高性能を示し、最強の基準を相対で最大35.9%上回った（抄録）。RoboCasa365では48.1%で全体4位だった。実機ではπ0.5（3B）50.0%、DreamZero（14B）55.0%に対しProWAM（5B）70.0%だった（表4）。キャッシュにより計算量は115.5→18.7 TFLOPs（84%減）、遅延は581→313ms（46%減）になった（§4.4）。部分目標は4個が最も良かった（図4b）。", "p6": "推論時の部分目標の数と位置は手で決めており、作業の状態から適応的に選べない。モデルと事前学習の規模を広げた検証はなく、評価した作業の長さや器用さも実運用に比べ限られる（付録F）。失敗例では、部分目標の画像で物体の接触の形がぼやけると、把持を早く離してしまった（図3）。", "fun": "遠くの目的地へ行くとき、人は『まず駅、次に乗り換え、最後に出口』と途中の目印を思い浮かべます。このロボットも、作業の途中の様子を何枚か想像し、それを目印に手を動かします。全部を動画で想像するより速く、しかも見知らぬ場面に強くなりました。想像した目印の画像がぼやけると失敗する、という観察も人間らしくて面白いところです。", "unverified": "表1〜3のベンチマークごとの全数値と付録の学習設定は読み切れていない。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "湾岸の雇用縮小、送出地インドで自営が増えた", "title": "Closing the Gulf: Overseas Employment Shocks and Labor-Market Adjustment at Origin", "url": "https://doi.org/10.2139/ssrn.7565032", "authors": "Vishesh Agarwal", "venue": "SSRN", "date": "2026-10-05", "apa": "Agarwal, V. (2026). Closing the Gulf: Overseas Employment Shocks and Labor-Market Adjustment at Origin. https://doi.org/10.2139/ssrn.7565032", "why": "サウジの雇用規制という外生ショックと地域の事前の出稼ぎ先の違いを組み合わせ、移民送出地の労働市場の調整を識別した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": true, "p1": "サウジアラビアの自国民雇用の義務化（ニタカート）で湾岸の出稼ぎ先の雇用が縮んだとき、送り出し側のインドの地域では失業は増えず、働き方が自営へ移ったことを示した（抄録）。", "p2": "出稼ぎ先の仕事が減ったとき、移民の送り出し国の労働市場がどう調整するかは分かっていない（抄録）。", "p3": "ニタカートの2011年の施行と、インドの地区ごとの、他の湾岸諸国に比べたサウジアラビアへの歴史的な出稼ぎの偏りの事前の違いを組み合わせて、ショックへの曝露を識別した（抄録）。解釈：シフトシェア型の曝露の設計と読み取れる。", "p4": "就業率と労働参加率、仕事の構成（自営、臨時雇用、常用雇用、自営業主・無給の家族従業）で効果を測り、ケララ州の補完的な証拠を加えた（抄録）。", "p5": "曝露は就業や労働参加にはほとんど効かなかったが、サウジ志向が1標準偏差高いと自営が3.5ポイント増え、臨時雇用が2.2ポイント、常用雇用が0.9ポイント減った。変化は自営業主と無給の家族従業に集中した。ケララ州の証拠は移住による調整と整合した（抄録）。", "p6": "本文を読めず、識別の前提（地区の事前の傾向）の検証や、帰国者の数の直接の測定は未確認。解釈：自営への移行が生活水準の低下を意味するかは、所得のデータがないと判断できない。", "fun": "出稼ぎ先の国が外国人の雇用を絞ると、故郷の町に失業者があふれると考えがちです。ところがインドの地域では失業は増えず、代わりに雇われる仕事が減って、小さな商売や家の手伝いが増えていました。失業率という一つの数字だけでは見えない、働き方の質の変化を捉えた研究です。", "unverified": "本文を読めず、データの出所と期間、頑健性の検定は未確認。"}}, {"id": "pn03", "rank": 3, "field": "交通・都市計画", "headline": "ライドヘイルと鉄道は代替か補完か、世界の実証", "title": "Uber versus Trains? Worldwide Evidence from Transit Expansions", "url": "https://econpapers.repec.org/RePEc:cdl:agrebk:qt29v1x3gc", "authors": "Gonzalez-Navarro ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "世界の鉄道延伸とUberの利用データで、代替・端末補完・帰路の選択肢という3つの機構を分けて測った。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの掲載ページの抄録を読んだ。本文は取得できず", "preprint": true, "p1": "世界約650の鉄道駅の開業前後のUberの利用データから、ライドヘイルと公共交通は差し引きで補完関係にあることを示し、政策の効果を構造モデルで比べた（抄録）。", "p2": "ライドヘイルと公共交通が代替か補完かは、交通政策と都市の形に重要な問いだが、決着していない（抄録）。", "p3": "交通手段の選択モデルに、駅の近くでUberから鉄道へ移る『代替』、駅までの移動にUberを使う『端末での補完』、行きの手段が帰りの選択肢を縛るためUberが持つ『オプション価値』の3つの機構を入れた。駅開業の前後の利用の変化をモーメントとして推定した（抄録）。", "p4": "新駅から100m以内の利用、近隣の住民・就業者の局所的な利用、その人たちの全体の利用の3つのパターンで、各機構の大きさを識別した（抄録）。", "p5": "Uberの利用は新駅の100m以内で急増し（補完）、近隣の住民・就業者では局所的に減り（代替）、全体では他所での利用増に一部相殺されて少しだけ減った（オプション価値）。3つとも量的に重要で、単独では代替が最大だが、補完とオプション価値の合計がそれを上回り、両者は差し引きで補完だった（抄録）。", "p6": "利用データはUber独自のもので、他の事業者や都市間の違いの扱いは本文を読めず未確認。政策の帰結は推定したモデルに依存する（解釈）。", "fun": "駅ができるとUberの利用は減ると思いきや、駅前ではむしろ増えました。駅まで、あるいは駅から最後の一区間をUberで行く人がいるからです。さらに『帰りは遅くなるかもしれないから、行きもUberで』という選択の連鎖まで考えると、両者は仲間だと分かりました。政策では、Uberに税をかけると人は電車ではなく自家用車に流れる、という意外な示唆も出ています。", "unverified": "本文を読めず、各機構の推定値と、政策シミュレーションの数値は未確認。"}}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "兆規模MoEをハード対応の疎化と量子化で軽く", "title": "Hardware-Native Joint Sparse-Quantization for Trillion-Scale Mixture-of-Experts", "url": "https://arxiv.org/abs/2610.02241", "authors": "Kwanhee Lee ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Lee, K., Lee, N., & Alistarh, D. (2026). Hardware-Native Joint Sparse-Quantization for Trillion-Scale Mixture-of-Experts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02241", "why": "疎行列演算器を混合エキスパートに使う際の品質低下と計算核の不足に、量子化との同時設計で対応した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§3、設定§4.1、精度§4.2、効率§4.3、結論）を読んだ", "preprint": true, "p1": "混合エキスパート（MoE）言語モデルの専門家の重みを、GPUの疎テンソルコアがそのまま実行できる『半構造化の疎＋4ビット量子化』の形に圧縮する学習法と、専用の計算核を同時に設計し（moesq）、1兆パラメータ規模で精度をほぼ保ったまま高速化した（抄録、§5）。", "p2": "MoEは兆規模まで拡大できるが、メモリ量と帯域が展開の壁になる。疎テンソルコア（SpTC）は低精度の半構造化疎性で記憶量を減らし処理量を上げられるが、MoEに使うと品質が大きく落ち、グループ化した疎行列積の基本演算もなかった（抄録）。", "p3": "圧縮後の重みで出力の再構成誤差を最小化する問題（式1）を、各グループで許される疎パターン（例：対の4:8）の選択をGumbel-Softmaxで連続緩和し（式2）、量子化（NVFP4）と同時に勾配で最適化する（§3.2）。ルーターの重みを付けた再構成目的と専門家並列の圧縮で規模を確保した（抄録）。解釈：『どの重みを0にするか』と『残す重みを何ビットで表すか』を別々に決めると誤差が積み重なるため、一緒に決める。", "p4": "Qwen3-30B-A3B、Qwen3.5-397B-A17B、Kimi-K2.5（約1兆）の専門家を対の4:8 NVFP4 W4A4で圧縮し、元のチェックポイントと密なNVFP4を基準に、JSQ・SGPTQ・OBRと知識・推論の課題で比べた。計算核はB200/B300で既存の密な実装と比べた（§4.1）。", "p5": "Qwen3.5-397BのGSM8Kで71.65%（OBR 65.28%、JSQ 4.62%）、Qwen3-30Bで元の性能の89.30%を保持しOBRを5.93ポイント上回り、Kimi-K2.5で96.09%を保持した（§4.2、表1）。計算核は密な基準より1.35〜1.65倍速く、エネルギーは1,098→727mJに減った（図1）。全体のサービングで処理量は1.18倍、遅延は最大4.03倍短縮した（抄録）。", "p6": "本文に独立した限界の節はない。解釈：対象はNVIDIAのBlackwell世代の形式に依存し、他のハードウェアへの移植性は未検討で、反復的な最適化は一発の基準法より圧縮の計算コストが高い（§4.1の注記）。", "fun": "巨大なAIを動かすには、膨大な数字を記憶して運ぶ必要があります。この研究は、数字の一部を0にし、残りを4ビットという粗い目盛りで表しつつ、GPUの中の『0を飛ばして計算する特別な回路』にぴったり合う形に整えました。ソフトとハードを一緒に設計することで、賢さをほとんど失わずに速く省エネにできたのです。", "unverified": "表1・表2の全数値と付録の圧縮設定は読み切れていない。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "誰が測られるかで変わる学力推計、部分識別で", "title": "Who Gets Measured Matters: Partial Identification in Household Learning Assessments", "url": "https://doi.org/10.2139/ssrn.7552440", "authors": "Oswald Koussihouede", "venue": "SSRN", "date": "2026-10-05", "apa": "Koussihouede, O. (2026). Who Gets Measured Matters: Partial Identification in Household Learning Assessments. https://doi.org/10.2139/ssrn.7552440", "why": "18か国の家庭訪問型学力調査で、未受験の偏りを仮定に頼らず部分識別で幅として示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": true, "p1": "家庭訪問型の学力調査では、学校に通っていない子どもの読み書きの得点がほとんど得られず、その母集団の値が事実上識別できないことを、部分識別で示した（抄録）。", "p2": "家庭訪問型の学力調査は在学の有無によらず子どもを測れるので国際的な監視に向くが、標本に含まれても結果が観測されない子どもがいると、母集団の値は識別されない（抄録）。", "p3": "アフリカ18か国の7〜14歳の97,754人の読み書きと計算のデータで、同じ子どもの中での完答の非対称を記述し、仮定を置かない最悪の場合の上下限（部分識別）で母集団の値の範囲を求めた。完答の差を、到達の差と条件付きの完答の差に分解した（抄録）。", "p4": "調査ウェイト付きの対応のある検定で完答率の差を確かめ、識別された集合の幅と、国別の平均限界効果の結合検定を見た。調査票の文書から設問の流れの特徴を確かめた（抄録）。", "p5": "未就学の子どもでは計算の有効な得点が50.0%で得られたが、読み書きは7.7%だけだった（在学児は91.3%と56.2%）。最悪の場合の上下限では、未就学の子の読み書きの値の識別集合の幅は92.3ポイント、計算は50.0ポイントだった。読み書きの完答の差は、到達の差43.8%、条件付き完答の差56.2%に分解された（抄録）。", "p6": "問題は標本の精度ではなく識別だと著者は強調する。上下限は仮定なしの最悪ケースで、追加の仮定で幅を狭める余地がある（解釈）。国別の効果の違いは記述的で、結合検定では差は棄却されなかった（抄録）。", "fun": "『この国の子どもの読み書きの平均点』は、試験を最後まで受けられた子だけで計算されがちです。学校に行っていない子は読み書きの試験にほとんど進めないため、本当の平均は『0点から92点のどこか』としか言えないほど分かりません。誤差の幅が小さく見える統計でも、測れなかった人を忘れると誤解を生むという警告です。", "unverified": "本文を読めず、国別の結果と調査票の流れの詳細は未確認。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "方策上の蒸留はなぜ長く反復する出力に崩れるか", "title": "Gains and Collapse in On-Policy Distillation:A Reinforcement Learning Perspective", "url": "https://arxiv.org/abs/2610.03185", "authors": "Han Cui ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Cui, H., Yan, J., Luo, Y., Zhang, H., Fu, Z., & Zhang, Y. (2026). Gains and Collapse in On-Policy Distillation:A Reinforcement Learning Perspective (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03185", "why": "言語モデルの事後学習で広がる方策上の蒸留の利得と崩壊を、強化学習の視点で説明した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§2の定式化、§3の能力境界、§4の報酬ハッキング、§5.2の介入と表3、限界）を読んだ", "preprint": true, "p1": "言語モデルの事後学習で使われる方策上の蒸留（OPD）を、教師が暗に報酬を与える強化学習として捉え直し、OPDは学生の能力の範囲を広げず解ける問題を解きやすくするだけで、教師の評価が質とずれると長く反復的な出力への『報酬ハッキング』で崩壊することを示した（抄録）。", "p2": "OPDは性能を上げる一方で、過度に長く反復的な生成へ崩壊することがあり、成否を分ける仕組みは分かっていなかった（抄録）。", "p3": "学生が自分で生成した途中までの文に対し、教師が次の語の確率を与え、逆KLを最小化する。これを展開すると、報酬r_T＝log π_T（教師の対数確率）とエントロピー正則化付きの方策最適化に等しい（式1〜2、§2.2）。例：教師が自分ではあまり書かない冗長な続きでも、教師の確率が高く付けば学生はそれを強化する。", "p4": "AIME24〜26とAMC23で、学習前後の学生のpass@k（k回の試行で1回でも正解する率）、手作業で確かめた解ける問題の集合、問題ごとの成功率を比べた（§3）。崩壊例（Qwen3-4B→Qwen3-1.7B-Base）と成功例（JustRL-1.5B→DS-Distill-1.5B）の学習過程を比べた（§4.1）。", "p5": "OPDの利得はkが小さいときに大きく、kを増やすと学習前の学生が追いついた（図2）。追加サンプリングと人手確認の後、OPD後にだけ解ける問題は1つもなかった（学習前73問に対しOPD後は65問・63問、図3）。崩壊例でも損失は正常に収束しており、最適化は『間違った的』に成功していた（§4.1）。長さ上限に達した応答の損失を隠すと崩壊から回復し、平均正答率は教師4B・8B・30B-A3Bで3.08・0.51・2.58ポイント上がった（表3）。SFTで初期化した学生では崩壊が起きなかった（§5.2）。", "p6": "計算資源の制約で小さなモデルと数学推論に限られ、他の領域や大きなモデルへの一般化は未検証である。介入は観察した崩壊に合わせた検証用で、一般的な解決策ではない。解ける集合の結果は有限のサンプルに基づく（Limitations）。", "fun": "先生が『自分ではあまり言わないけれど、言われると高得点を付けてしまう答え』を持っていると、生徒はそこばかり伸ばしてしまいます。AIの蒸留でも、先生役のAIが長くくどい答えに甘い点を付けると、生徒役のAIは延々と繰り返す答えを覚えてしまいました。大事なのは先生の上手さより、採点の確かさだという結論です。", "unverified": "§3の問題ごとの成功率の分析と付録B〜Fの詳細は読み切れていない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "思春期の子の学校時間延長で母親の就業は増えるか", "title": "The Second(ary) Shift: Longer School Day Availability for Adolescents and Maternal Employment", "url": "https://doi.org/10.2139/ssrn.7565033", "authors": "Rachel Forshaw", "venue": "SSRN", "date": "2026-10-05", "apa": "Forshaw, R. (2026). The Second(ary) Shift: Longer School Day Availability for Adolescents and Maternal Employment. https://doi.org/10.2139/ssrn.7565033", "why": "年長の子どもでも学校時間が母親の就業に効くかを検証し、保育政策の対象年齢の議論に新しい証拠を出した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": true, "p1": "ペルーで公立中等学校の授業時間を約30%延ばした政策（JEC）が、思春期の子を持つ母親の就業を増やしたことを、操作変数法で示した（抄録）。", "p2": "保育や学校時間の延長が幼い子の母親の就業を増やすことは知られているが、子が思春期になっても学校の時間割が母親の労働供給を縛るかは分かっていない（抄録）。", "p3": "近隣の公立中等学校のうちJECを採用した割合を、事前に決まった適格基準を満たす学校の割合で操作変数として推定した（抄録）。", "p4": "狭い地理範囲内での推定、適格性を決める学校特性の統制、改革前に適格性が母親の就業を予測しないことの確認、父親との比較、縦断の推定で頑健性を確かめた（抄録）。", "p5": "JECの利用可能性が10ポイント上がると母親の就業は約1ポイント上がった。就業は賃金労働へ移り無給の家族従業から離れ、労働所得は増えたが、労働時間の増加はほとんどなかった。父親への効果はゼロと区別できず、男女差は有意だった。効果は公立中等学校に子を通わせる母親に集中した（抄録）。", "p6": "本文を読めず、データの出所と期間は未確認。解釈：労働時間が増えずに就業と所得が増えた仕組み（仕事の種類の変化）の詳細は本文で確かめる必要がある。", "fun": "中学生や高校生にもなれば、親の働き方は学校の時間割と無関係だと思われがちです。ところがペルーでは、学校が夕方まで子どもを見てくれるようになると、母親が外で雇われて働く割合が増え、父親には変化がありませんでした。教育政策が、思わぬ形で家族の働き方を変えるという発見です。", "unverified": "本文を読めず、データと推定の詳細は未確認。"}}, {"id": "pn08", "rank": 8, "field": "オペレーションズ・リサーチ", "headline": "確率的一次二層最適化の精度の下限を閉じる", "title": "Closing the Accuracy Gap in Stochastic First-Order Bilevel Optimization", "url": "https://arxiv.org/abs/2610.03633", "authors": "Haihan Zhang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Zhang, H., Wu, W., Zhang, C., Li, Y., Zheng, C., Fang, C., Li, H., & Lin, Z. (2026). Closing the Accuracy Gap in Stochastic First-Order Bilevel Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03633", "why": "確率的勾配だけを使う二層最適化で、達成できる精度の最適な依存性を上下界で特定した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（主結果§4.1〜4.3と結論§8）を読んだ。付録A・Bの証明は構成の概要のみ", "preprint": true, "p1": "確率的な一次の勾配だけを使う非凸-強凸の二層最適化で、精度εへの依存の下界Ω(ε^{-6})を証明し、既存の上界の指数と一致させて『精度の溝』を閉じた（抄録、定理4.1）。", "p2": "二層最適化（外側の目的が内側の最適化の解に依存する問題）では、一次の確率的勾配による既存の上界はε^{-6}だが、それが本当に必要かを示す下界がなかった（抄録）。", "p3": "大域的に不偏で分散が有界な新しい勾配サンプルを仮定し、任意の乱択・適応的なアルゴリズムに対して難しい問題の例を構成する。内側の解の応答に逐次的に難しい目的を正確に埋め込み、多重尺度の分解で各新方向を運ぶ勾配の信号を弱めることで、必要なサンプル数を押し上げる（抄録、§5）。上界側では、下位のヘッセ行列の変動に比例する偏りを持つ『凍結した線形の傾き』の推定量を解析した（§4.2、§6）。", "p4": "評価は、目標E‖∇F(x̂)‖≤εを保証するのに必要なオラクル呼び出し数の下界と上界の一致である。L（一次の共通尺度）、μ（下位の強凸性）、ρ（下位のヘッセ変動）、κ=L/μ、χ=1+ρ/μで依存を表す（抄録）。", "p5": "十分な高精度と高次元で、下界Ω(Lκ²Δε^{-2}＋L³χ²κ⁸σ_g²Δε^{-6})を得た（式3）。共通尺度ρ=Θ(L)では確率項の条件数依存はκ^{10}で、達成可能なκ^{11}と1乗の差まで迫った（§8）。曲率を抑えた領域と小さなギャップの領域では上下界の主要項が一致した（§4.3）。", "p6": "下界は十分高い精度と次元を要し、ρ≳μ、χ≲κの条件のもとで成り立つ（定理4.1）。条件数の依存はκ^{10}対κ^{11}で1乗の差が残る（§8）。解釈：実問題での定数の大きさや、分散を減らす手法など他のオラクルの仮定のもとでの結論は別問題である。", "fun": "ある問題を解くのに『最低これだけの手間は絶対にかかる』と証明するのは、『この方法なら解ける』と示すよりずっと難しいことがあります。どんなに賢い方法でも抜け出せない意地悪な問題をわざわざ作ってみせるからです。この論文は、そうして上と下から挟み込み、二層の最適化に必要な手間の本当の大きさを突き止めました。", "unverified": "付録の証明の細部は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "ループ型言語モデルの思考過程は監視できるか", "title": "On the Chain-of-Thought Monitorability of Looped Language Models", "url": "https://arxiv.org/abs/2610.02741", "authors": "Han Wang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Wang, H., Balappanawar, I. B., & Zhang, H. (2026). On the Chain-of-Thought Monitorability of Looped Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02741", "why": "層を繰り返す言語モデルで思考の連鎖による監視がどこまで効くかを調べ、安全性評価の前提を問い直した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（評価設定§3、実験§4.1〜4.2、結論、付録A.1の限界、図2・図4・表4の説明）を読んだ。表6などの付録の数値表は読んでいない", "preprint": true, "p1": "同じ層を繰り返し使って計算の深さを増やす『ループ型言語モデル（LoopLM）』について、思考の連鎖（CoT）を外から監視できるかを初めて系統的に評価し、ループを深くすると一部の課題で監視しにくくなる一方、ループ構造そのものが監視性を下げるとは限らないことを示した（抄録、§5）。", "p2": "CoTの監視は望ましくない振る舞いを見つける有望な方法だが、LoopLMは隠れた内部計算を増やせるため、判断の理由が言葉に出にくくなる懸念がある。その影響は調べられていなかった（抄録）。", "p3": "T回ループするモデルの有効深さはL×Tになる（§3）。MonitorBenchから、正解を『ユーザーの推測』として与える5課題と、補助条件を与える3課題の計8課題を選び、判断を決めた要因をCoTで言語化し使ったかを監視者（Qwen3.8-27B）が判定した。理由を隠せと指示する2種のストレステストも行った（§3.1）。監視性の得点は、介入による効果のうち監視者が検出できた割合で定義する（§3.2）。", "p4": "①Ouro-1.4B/2.6B-ThinkingでループをT=4・6・8と変える比較、②Nanbeige4.2-3B（22層×2回）と、パラメータ数・層数・有効層数を揃えた通常のモデル6つとの比較の2つの設定で評価した（§4.1〜4.2）。監視者の信頼性は3つの判定モデルの90%超の一致で確かめた（§4）。", "p5": "ストレステスト下の論理・科学・工学の正解手がかり課題では、ループを深くすると監視性が下がり、他の5課題は比較的安定だった（図2）。低下は課題の難しさ、検証の通過率、生成の長さでは十分に説明できなかった。T=4では手がかりを明示的に使い、T=6では検算扱いにし、T=8では言及せずに同じ答えを出す例が見られた（図4）。通常モデルとの比較では、LoopLMが系統的に監視しにくいという証拠はなかった（§4.2）。", "p6": "推論能力のある公開LoopLMが少なく、ループ深さの統制された分析はOuro系列に限られる。低下の仕組みは特定できておらず、モデル間の比較は学習データや事後学習の違いを統制できないため因果的な比較ではない（付録A.1）。", "fun": "AIが答えの理由を『心の中』で考えるほど、外からは何を根拠にしたのか見えにくくなるかもしれません。同じ部品を何周も回して考えるAIでは、周回を増やすと、ヒントを使ったのに『使った』と書かなくなる例が見られました。ただ、周回する設計そのものが悪いわけではない、という慎重な結論も大事です。", "unverified": "課題ごとの監視性の具体的な数値（表6など）は未確認。"}}, {"id": "pn10", "rank": 10, "field": "機械学習（Hugging Face）", "headline": "行動ラベルなし動画から世界行動モデルの事前知識を", "title": "Native Action-Prior Learning from Videos for World Action Models", "url": "https://arxiv.org/abs/2610.03391", "authors": "Zhaochong An ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "An, Z., Zhang, F., Jia, M., Frost, D., Zhou, Z., Wang, Y., Wang, X., Patel, A., Zeng, B., Xiang, T., Belongie, S., Bar, A., & He, S. (2026). Native Action-Prior Learning from Videos for World Action Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03391", "why": "行動注釈のない観察動画から行動の事前知識を学び、ロボット軌跡データ不足を緩和する。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§3.2、設定§4.1、主結果§4.2と表1・図3の記述、付録Dの限界）を読んだ。§4.3のアブレーションは図の説明のみ", "preprint": true, "p1": "行動の注釈がない観察だけの動画から、ロボットの行動方策そのものを直接事前学習する『ネイティブな行動事前知識の学習』NAVA-WAMを提案し、行動ラベルの少ない条件でも汎化の強い世界行動モデルを作った（抄録）。", "p2": "世界行動モデルは行動の注釈付きのロボット軌跡を大量に要し、拡大が難しい。観察だけの動画の従来の使い方は、視覚表現を事前学習して後で制御に合わせるか、潜在的な行動を推定してから実際の指令に結び付けるかの間接的な方法だった（抄録）。", "p3": "隣り合う状態z_{k−1}→z_kから遷移の変数を取り出す逆動力学と、それで次の状態を予測する順動力学（式3）を、別のモデルを作らず、遷移ごとに区切った注意のマスクで方策の中に実現する（§3.2）。事前学習では行動トークンをロボットの行動で教師付けせず、未来の映像のフローマッチングの誤差だけで行動側（Action-DiT、1B）を最適化する。事後学習では行動ラベル付きの実演で映像と行動を同時に学び、非対称な注意で推論時は行動だけを反復する（抄録、§4.1）。", "p4": "LIBERO（分布内）、LIBERO-Plus（分布外）、RoboTwin 2.0のClean（分布内）とRandom（分布外）の平均成功率と、実ロボットの15試行で比べた（表1、図3）。映像側はWan2.2-5Bで初期化し、Open X-Embodiment・AgiBotWorld・EgoDexの観察動画で事前学習した（§4.1）。", "p5": "LIBEROで99.0%、LIBERO-Plusで83.5%、RoboTwin 2.0でCleanが88.5%、Randomが73.6%で、最強の基準をCleanで3.5ポイント、Randomで17.9ポイント上回り、CleanからRandomへの低下が小さかった（§4.2、表1）。実ロボットでは14/15（93.3%）で、DreamZeroは10/15、π0.5は8/15だった。鉢の左に立方体を置く課題では5回中4回成功し、2つの基準は全敗だった（図3）。", "p6": "精密な把持や接触の多い細かな操作、複雑な指示の理解はまだ難しい。実行中の局所的な失敗から立ち直る仕組みもない（付録D）。解釈：実ロボットの評価は15試行と少数である。", "fun": "人が料理する動画を見るだけで、ロボットが手の動かし方のコツをつかめたら、教える手間は大きく減ります。この研究は、『前の場面と次の場面の違い』から、その間に起きた動きを読み取る仕組みをロボットの頭脳の中に組み込みました。行動の正解ラベルがない動画からでも、手の動かし方の下地が育つのです。", "unverified": "アブレーション（図6など）の具体的な数値は未確認。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "指数の銘柄入替で誰が売買し誰が受け止めるか", "title": "Who Trades Index Rebalancings? Evidence on Benchmarking and International Portfolio Flows", "url": "https://doi.org/10.2139/ssrn.7565249", "authors": "Tomas Williams", "venue": "SSRN", "date": "2026-10-05", "apa": "Williams, T. (2026). Who Trades Index Rebalancings? Evidence on Benchmarking and International Portfolio Flows. https://doi.org/10.2139/ssrn.7565249", "why": "国際的な指数入替の売買主体を特定し、ベンチマークが国際資本移動を動かす経路を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": true, "p1": "国際的な株価指数の銘柄入替に伴う売買を、コロンビアの株式市場の取引単位のデータで追跡し、誰が需要を生み誰が受け止めるのかを特定した（抄録）。", "p2": "国際的なベンチマーク指数の入替はポートフォリオと国際資本移動を動かすが、その背後の売買の主体と相手方はほとんど観察されてこなかった（抄録）。", "p3": "コロンビアの株式市場の取引単位のデータと、MSCIの国際株式指数への銘柄の追加・除外を結び付け、国際投資家の指数入替に伴う売買と、その国内外の相手方を特定した（抄録）。", "p4": "売買の主体（指数ファンド・ETF、名目上アクティブな国際投資家、国内投資家、ブローカー、ヘッジファンド）別の流れと、それに伴う価格変化から需要の弾力性を推計した（抄録）。", "p5": "指数に連動する需要は明示的な指数ファンドやETFにとどまらず、入替に伴う流れの大半は名目上アクティブな国際投資家から来ていた。国内投資家がその大半を吸収し、ブローカーとヘッジファンドの逆向きの持ち高は小さかった。推計された弾力性は絶対値で小さく、局所的な需要曲線が急であることと整合し、国内の個人投資家の吸収の割合が大きいほどその傾向が強かった（抄録）。", "p6": "対象は1か国の市場で、他の新興国への一般化は未検証である（解釈）。本文を読めず、識別の詳細と弾力性の数値は未確認。", "fun": "『アクティブ運用』をうたう海外のファンドも、実は指数に合わせて売り買いしていることが、取引の記録から見えてきました。しかも、その売り買いを受け止めているのは地元の個人投資家が中心でした。遠い国の指数の決定が、小さな市場の普通の人の取引に響く、という国際金融のつながりを示す研究です。", "unverified": "本文を読めず、期間・銘柄数・弾力性の値は未確認。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "能力の除去と保持を保証付きで行う機構的編集", "title": "Certified Mechanistic Edits: Behavioral Guarantees for Skill Removal and Preservation", "url": "https://arxiv.org/abs/2610.03502", "authors": "Md Sazid Uddin ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Uddin, M. S., Mazumder, M. K. A., & Mridha, M. F. (2026). Certified Mechanistic Edits: Behavioral Guarantees for Skill Removal and Preservation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03502", "why": "有害な能力の除去で、残すべき能力への影響を検証付きで保証する枠組みを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、手法§IV、結果§V-A〜V-B、限界§VI、図1〜3と表IIの説明）を読んだ。付録Aの証明は読んでいない", "preprint": true, "p1": "ニューラルネットの回路を切るなどの『機構的な編集』が、ある技能を消し別の技能を保つことを、入力の連続した領域のすべての点で形式的に証明する『認証付き編集』を示し、有限のテストではそれが原理的に保証できないことも証明した（抄録）。", "p2": "有害な能力を消すための切除・重み編集・活性の誘導は、テスト用の入力で確かめるだけで、連続した入力の領域全体は覆えない。既存の検証はモデルの『説明』（回路が何を計算するか）を認証するもので、編集の『振る舞いへの効果』は認証してこなかった（§I）。", "p3": "小さなReLUネットと閾値ゲートの変換器ではSMTソルバで正確に、softmaxとLayerNormを含む標準的な変換器では健全な境界伝播（CROWN）で、編集後に技能Aが消え技能Bが残ることを、埋め込み空間の雑音の球の中のすべての入力で証明する（§IV）。『認証半径』（主張が成り立つ最大の球の半径）を定義し、勾配攻撃で上から挟む（定義4、§IV）。", "p4": "認証半径と攻撃で見つかる半径の関係（認証≤真値≤攻撃）、テストの格子を通過した編集の反例の有無、確率的な探索での生き残り領域の大きさで評価した（§V）。", "p5": "標準的な変換器で、技能Aの除去（正答率は偶然の水準）と技能Bの保持（正答率100%）を448次元の摂動で証明し、正確なソルバの限界の約9倍の次元に達した。除去の半径は0.0091≤0.03、保持は0.0079≤0.05と0.0098≤0.1で、不健全な値はなかった（§V-A、図2）。40,401点の格子を通過した編集にもソルバは生き残った入力を見つけ、通常の学習で得た160モデル中3つで同様の『介入の錯覚』が起き、生き残り領域は領域の1.5×10^{-6}以下だった（§V-B）。", "p6": "保証は小さな標準構造のネットに限られ、正確な検証は内部の分岐数に対して指数的に重い。連続の軸は埋め込みの雑音で、1語の置換は認証した球の約324倍に当たるため、実際のプロンプトへの頑健さは主張しない。消す技能が決定可能な正解を持つことを前提とし、現実の有害な能力にはそれがない（§VI）。", "fun": "『この薬は副作用がない』と、100人に試しただけで言い切れないのと同じで、AIから危険な能力を消したかどうかも、いくら試験しても完全には確かめられません。この研究は、試験をすり抜ける小さな『生き残りの隙間』が実際に生じることを示し、代わりに数学の証明で範囲全体を保証する方法を作りました。ただし、相手は小さなおもちゃのモデルです。", "unverified": "付録の証明と表IIIの数値は未確認。"}}, {"id": "pn13", "rank": 13, "field": "交通・都市計画", "headline": "住宅の「はしご」で見る住宅政策の累進性", "title": "Filtering and Affordability along the Housing Ladder", "url": "https://doi.org/10.2139/ssrn.7554618", "authors": "Arthur Adam ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Adam, A., & Cocco, F. (2026). Filtering and Affordability along the Housing Ladder. https://doi.org/10.2139/ssrn.7554618", "why": "低所得層が古い住宅に移る均衡モデルで、住宅政策の負担と便益が所得層にどう及ぶかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ。本文は取得できず", "preprint": true, "p1": "低所得の世帯が古い住宅に住む『住宅のはしご』の均衡モデルで、住宅政策の所得階層別の効果（累進性）を評価し、建設補助は逆進的で維持補助が累進的な代替になり得ることを示した（抄録）。", "p2": "住宅政策が低所得層に有利か（累進的か）は重要な問いだが、新築と中古の市場のつながりを通じた波及を含めた評価は難しい（抄録）。", "p3": "低所得の世帯ほど古い住宅（はしごの下の段）に住む均衡モデルを作り、はしごに沿った価格変化が所得分布全体の厚生変化の十分統計量になることを示した。政策は、需要をはしごに沿って動かす『手頃さ効果』と、下の段の供給を変える『取り壊し効果』を通じて価格に波及する（抄録）。", "p4": "米国の代表的な都市に合わせてモデルを較正し、個別の政策の累進性と、建設の山谷が生む建築年代の効果を含む移行過程を評価した（抄録）。", "p5": "建設補助は逆進的で、とくに短期で逆進性が強かった。維持補助は累進的な代替として浮かび上がった（抄録）。数値は本文を読めず未確認。", "p6": "較正は1つの代表的な都市に基づき、結果はモデルの構造に依存する（解釈）。本文を読めず、較正の目標値と頑健性は未確認。", "fun": "新しい家をたくさん建てれば、古い家が空いて、やがて安い家が増える…という『はしご』の話は直感的です。ところがこのモデルでは、新築を補助すると古い家の取り壊しも進み、いちばん下の段の住まいがかえって高くなりかねません。古い家の手入れを補助するほうが、低所得の人に優しいという意外な結論です。", "unverified": "本文を読めず、数値結果とモデルの仮定の詳細は未確認。"}}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "大企業と中小企業の相互作用が景気循環を生む", "title": "Endogenous Business Cycles with Small and Large Firms", "url": "https://econpapers.repec.org/RePEc:adl:wpaper:2025-04", "authors": "Qazi Haque ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "多製品を作る大企業の市場支配力の上昇から内生的な景気循環が生じる理論を示した。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を読んだ。本文は取得できず", "preprint": true, "p1": "多製品を作れる大企業と小企業の相互作用から、マークアップの異なる動きと、大企業の市場シェアが高いほど起きやすい内生的な景気循環を説明する理論を示した（抄録）。", "p2": "ここ数十年で大企業の市場支配力が高まったが、それが景気循環の性質をどう変えるかは十分に理解されていない（抄録）。", "p3": "大企業の技術を『複数の製品を生み出せる能力』として表し、製品の創出による市場シェアの再配分が企業タイプごとに異なるマークアップの動きを生む一般均衡モデルを作った（抄録）。", "p4": "モデルをベイズ推定し、製品創出の経路の内生的な増幅と、期待の自己実現（アニマル・スピリッツ）が米国の景気循環に果たす役割を評価した（抄録）。", "p5": "大企業の市場シェアが高いほど、マクロ経済の不決定性（均衡が一つに決
