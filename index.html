<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

d the Distribution of Gains", "url": "https://doi.org/10.3386/w36003", "authors": "Panle Jia Barwick ほか", "venue": "NBER Working Paper", "why": "中国の大手EC基盤が2024年に業務ソフトへ生成AIを組み込んだ事例で、企業ごとのAI利用記録と月次の販売を結び、マッチングした差の差分析と操作変数で効果を推定した。年商500万元未満の企業では採用により月次売上が51.6%増え、主に注文数の47.0%増によることを示し、AIを共有の事業基盤として提供したときの成果の行き先を実証した。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "開発経済学のRCTの有意な結果の約3割は偽発見", "title": "(In)Credible Development RCTs: False Discoveries, Low Power, and a Solution", "url": "https://doi.org/10.3386/w35999", "authors": "Qingyuan Chai ほか", "venue": "NBER Working Paper", "why": "主要誌190本の745の主要な検定を集め、出版の選択を考慮した経験ベイズの混合モデルで、開発経済学の無作為化比較試験の検出力と偽発見率を推定した。公表された棄却の約30%が偽発見で、平均の方向性検出力は40%にとどまると推定し、追試への資源配分の最適化も示した。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "経済学論文の約半数でコードと本文に重大な食い違い", "title": "Code-Paper Consistency in Economics and Finance", "url": "https://doi.org/10.2139/ssrn.7681378", "authors": "Christoph Huber ほか", "venue": "SSRN", "date": "2026-11-09", "why": "主要な経済学・ファイナンス誌の1,820本について、LLMを使った構造化手順で論文の記述と分析コードの不一致を点検した。結論に至った主張の10%に不一致があり、論文の49%（頑健性の確認で37〜56%）が中心的な結果に関わる重大な不一致の可能性を含むと報告した。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "最貧層への的絞りは援助の効く世帯を見逃す", "title": "Target What? The Foundations of Poverty Targeting", "url": "https://doi.org/10.3386/w35984", "authors": "Rema Hanna ほか", "venue": "NBER Working Paper", "why": "インドネシアの600村で5,500人超の住民に他の住民の暮らし向きと少額の給付の効き目を順位づけてもらい、消費額や自己評価と比べた。消費で対象を選ぶと、追加の1ドルの社会的価値が最も高い世帯の77%を見逃すことを示し、貧困の的絞りの前提を問い直した。"}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "演劇型の研修で警察官の性暴力への対応が改善", "title": "Debiasing Law Enforcement Officers: Evidence from an Expressive Arts Intervention in India", "url": "https://doi.org/10.3386/w35986", "authors": "Sofia Amaral ほか", "venue": "NBER Working Paper", "why": "インドのビハール州警察と417署・約2,500人の現職の警察官を対象にクラスター無作為化試験を行い、被抑圧者の演劇にもとづく3日間の研修を評価した。約7か月後に性暴力への態度・共感・法知識が改善し、1年後の標準化された被害者役の監査でも実際の対応の変化が観察された。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "ネットワーク干渉下の因果推論の最適設計と推定量", "title": "Minimax designs and estimators for causal inference under network interference", "url": "https://arxiv.org/abs/2611.08560", "authors": "Vishesh Karwa ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "処置が他者にも波及する干渉のもとで、線形の因果推定対象に対する設計ベースのミニマックス理論を構築した。推定量の最適化、設計と推定量の同時最適化など3つの問題でミニマックスリスクを調べ、干渉を潜在的結果の同時抽出の制約として超グラフで表した。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "AIエージェントへの介入の価値を因果推論で評価", "title": "Knowing When to Intervene: Causal Evaluation of AI Agents", "url": "https://arxiv.org/abs/2611.09792", "authors": "Ayush Sawarni ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "エージェントの行動の途中で検証や軌道修正の介入をすべきかを、最終結果への因果効果として評価する枠組みを提案した。介入の効果が文脈と将来の行動に依存する動的な問題を扱い、静的なベンチマークでは分からない運用時の介入の価値を推定できるようにした。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "総額表示の義務化で民泊の価格はむしろ4.8%上昇", "title": "Clearing the Fog: Price Transparency, Market Churn, and Consumer Welfare in Short-Term Rentals", "url": "https://doi.org/10.3386/w35989", "authors": "Ginger Zhe Jin ほか", "venue": "NBER Working Paper", "why": "2024年7月にカリフォルニア州で手数料込みの総額表示を義務化した法律の効果を、他都市と比べる粗い完全一致マッチングで調べた。客の価格感応度は高まったのに平均宿泊価格は4.8%上がり、清掃料に頼る物件の退出など市場の入れ替わりが起き、隠れた手数料による「厚生の錯覚」が解消されたことを示した。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "新しい共同制作者と組むとアイデアの新しさが増す", "title": "What Do You Bring to the Table? New Teams and New Ideas", "url": "https://doi.org/10.2139/ssrn.7681467", "authors": "William Arbour", "venue": "SSRN", "date": "2026-11-09", "why": "ボードゲームのデザイナーと作品の仕組みの記録を使い、チームに新しい人が加わると創造性がどう変わるかを調べた。なじみの相手から全く新しい相手に移ると、デザイナーにとって新しい仕組みの割合が16.2ポイント増え、共同作業で得たアイデアは5年後も11.8ポイント多く使い続けられていた。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "標本分割なしで高次元のオフ方策評価を行う", "title": "High-Dimensional Off-Policy Evaluation without Sample Splitting using an Onsager Correction", "url": "https://arxiv.org/abs/2611.08794", "authors": "Saksham Jain ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "文脈の次元と標本数が比例して増える高次元の状況では、検証用データでの報酬モデルの選択が最適でなくなりうることを示した。オンサガー補正を加えた基準で、全データで学習したモデルの標本外リスクを学習データだけから推定し、標本分割なしの早期打ち切りを可能にした。"}, {"id": "pn11", "rank": 11, "field": "オペレーションズ・リサーチ", "headline": "3次元の最適な格子量子化器は体心立方格子と証明", "title": "The BCC lattice is the optimal 3D lattice quantizer for all $p\\geq1$", "url": "https://arxiv.org/abs/2611.09523", "authors": "Senping Luo", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "有限のp≥1のすべてについて、体心立方格子がボロノイ胞のp次モーメントを最小にする3次元格子であることを証明し、グラフ–ルシュギーの予想を3次元で解決した。連続量を離散化する点の最適な配置という古典的な問題に決着をつける結果である。"}, {"id": "pn12", "rank": 12, "field": "心理学・認知科学", "headline": "先に自分で決めてからAIを見ると熟慮が増える", "title": "Thinking Twice: A Sequential Approach to Nudge Towards Reflective Judgment in GenAI-Assisted Decision Making", "url": "https://arxiv.org/abs/2611.09269", "authors": "H\\\"useyin Hussein Keke ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "生成AIの助言を受ける意思決定で、先に自分で判断してから助言を受ける逐次的なやり取りが、直観的な判断から熟慮的な判断への切り替えを促すかを130人の実験で検証した。二重過程理論の三段階モデルにもとづき、判断の食い違いの検出を熟慮のきっかけにする設計を示した。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "エージェントの自己改良では解ける課題が入れ替わる", "title": "Beneath the Surface: What We Overlook When We Talk About Agent Evolution", "url": "https://arxiv.org/abs/2611.07624", "authors": "Xiaobo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "why": "モデルの重みを変えずに実行環境（ハーネス）を進化させる自己改良の4手法を、反復評価と介入実験で調べた。進化した16のエージェントすべてが新たに解ける課題を得る一方で以前解けた課題を失っており、ベンチマークの得点の上昇が信頼性や移転可能な改善を意味しないことを示した。"}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "AIに任せたい仕事と自分に残したい仕事の境界", "title": "What to Delegate, What to Preserve: Human Preferences for Agentic AI Across Everyday Life and Work", "url": "https://arxiv.org/abs/2611.09730", "authors": "Sarah Wheeler ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "AIの利用経験がある米国の成人289人に9つの生活領域の45の場面を評価してもらい、AIエージェントへの委任の選好を調べた。AIへの信頼や費用の節約の見込みが自動化への選好を高め、自己実現が損なわれるという懸念が選好を下げることを一般化推定方程式で示した。"}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "ガウス点の間隔をそろえ任意の場面を3D再構成", "title": "SplatAnything: Gaussian Spacing Normalization for Feed-forward 3DGS across Arbitrary Scenes", "url": "https://arxiv.org/abs/2611.08264", "authors": "Hao Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "why": "画像から一度の推論で3次元ガウススプラッティングを作る手法で、場面の大きさやカメラ配置によって隣り合うガウスの間隔がばらつき、学習の目標がずれる問題を指摘した。ガウス間隔の正規化（GSNorm）でこれをそろえ、多様なデータ・疎な入力・外挿視点を含む新しいベンチマークで最高水準の性能を報告した。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "LLMの一対比較で作文を採点する効率的な組合せ", "title": "Adaptive Pair Selection in Large Language Model–Based Comparative Judgment of Writing", "url": "https://doi.org/10.2139/ssrn.7681477", "authors": "Sterett H. Mercer", "venue": "SSRN", "date": "2026-11-09", "why": "1,714本の作文への676,326件のLLMの一対比較の判断を使い、4つの適応的なペアの選び方と5つのブラッドリー–テリー推定量を比べた。適応的なペア選択は中程度の比較回数で効率を上げたが、複合的な選び方に明確な利点はなかった。"}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "貧困卒業プログラム49研究のベイズ型メタ分析", "title": "Doing Better at Doing Good: Lessons from a Bayesian Meta-Analysis After 20 Years of Poverty Graduation Programs", "url": "https://doi.org/10.3386/w35991", "authors": "Samantha Carter ほか", "venue": "NBER Working Paper", "why": "消費支援・貯蓄・技能訓練・指導・一括給付のうち3つ以上を含む貧困卒業プログラムの49研究（81の処置）を階層ベイズでメタ分析した。月間消費が購買力平価で38ドル（11%）、所得が28ドル（15%）増え、貯蓄・食料安全・精神的健康なども改善したことを示した。"}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "税の知識を教えても納税は増えない（ガーナ）", "title": "Knowledge Without Taxation? Experimental Evidence from a Tax Education Program", "url": "https://doi.org/10.3386/w36002", "authors": "Anders Jensen ほか", "venue": "NBER Working Paper", "why": "ガーナで固定資産税の教育を所有者と現場の徴税職員に無作為に提供した実験で、知識は増え近隣にも広がったが、納税額は増えなかった。納税者は徴税の執行力を低く見積もるようになり、合法的に負担を減らす方法にも気づいたことから、知識が国家の執行力の弱さを露呈させうることを示した。"}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "罰金に違反点数を加えると速度違反の再犯が減る", "title": "Sanctions, Evasion, and Deterrence: Evidence from Speeding Enforcement", "url": "https://arxiv.org/abs/2611.09337", "authors": "Romain Gauriot ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "オーストラリアのクイーンズランド州での制裁強化を利用し、罰金と違反点数が速度違反の再犯と他の運転者への責任転嫁に与える因果効果を推定した。罰金の引上げだけでは再犯の減少は小さく、違反点数の追加を伴うと再犯が4.6ポイント減った。"}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "海水温の変化が欧州の漁業収入を減らす", "title": "The Impact of Climate Change on Fisheries", "url": "https://doi.org/10.3386/w35994", "authors": "Fabio Cevenini ほか", "venue": "NBER Working Paper", "why": "欧州の全漁船の2013〜2022年の250万件の空間的な漁獲収入データと、魚種ごとの耐温度範囲にもとづく「海洋積算温度」を使い、海水温の変化が漁業収入に与える因果効果を初めて推定したと報告した。好適な温度からの逸脱、とくに高温で収入が大きく減ることを示した。"}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "近所の仲間の出願が大学出願を後押しする", "title": "Peer Influence in College Applications", "url": "https://doi.org/10.3386/w35993", "authors": "Ana M. Gazmuri ほか", "venue": "NBER Working Paper", "why": "異なる高校に通う近所の生徒を使って共通のショックを除き、教室単位の詳細なデータで仲間の出願行動が自分の出願に与える影響を推定した。出願した仲間への接触は出願率を高めるが合格者の追加効果はなく情報が経路であることを示し、反実仮想では都市と地方・男女の出願の差を埋めうる大きさだった。"}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "有意でない政策評価も効果の分布で判断に使う", "title": "Policy Evaluation Beyond Significance Testing: Evidence from Chicago's ShotSpotter Contract", "url": "https://doi.org/10.3386/w36005", "authors": "Terence Chau ほか", "venue": "NBER Working Paper", "why": "検出力が不足した評価では、効果がゼロかどうかの検定より効果の確率分布を推定すべきだと論じ、シカゴの銃声検知システムShotSpotterの契約を例に示した。統計的に有意でない推定でも、費用を上回る便益の確率を評価することで政策判断に使えることを示した。"}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "景気変動を最もよく説明する金融政策ショック", "title": "The Main Monetary Policy Shock", "url": "https://doi.org/10.3386/w36004", "authors": "Christoph Boehm ほか", "venue": "NBER Working Paper", "why": "高頻度の利回り曲線のサプライズなどの線形結合として、マクロ変動を最もよく説明する「主要な金融政策ショック」を識別する手法を提案した。このショックは過去30年の景気変動の無視できない部分を説明し、引締めでも金利はほぼ動かないまま物価を持続的に下げドル高をもたらすなど、教科書的なショックと異なることを示した。"}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "AIの買い物助手が価格競争を弱めることがある", "title": "Artificial Shoppers and Attention Competition", "url": "https://arxiv.org/abs/2611.09399", "authors": "Xiaomeng Guo ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "AIによる買い物の支援（推薦）と委任（代理購入）が、価格競争・プラットフォームの利益・消費者厚生に与える影響を理論モデルで分析した。消費者が目立つ属性を過大評価する状況では、品揃えへのアクセスが広がっても推薦型の支援が競争を弱めうることを示した。"}, {"id": "pn25", "rank": 25, "field": "オペレーションズ・リサーチ", "headline": "LLMが重みを書いた分枝規則の利点は軽さだけ", "title": "Can a Language Model Write the Weights? An Empirical Study of LLM-Written Scoring Networks for Column Generation and MILP Branching, with a Bus-Driver Scheduling Application", "url": "https://arxiv.org/abs/2611.09559", "authors": "Renan Butkeraites", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "勾配学習なしにLLMが小さなニューラルネットの重みを直接書く「重み空間プログラミング」を、配送計画の列生成とSCIPの分枝変数の選択に試した。列生成では実質的な改善がなく、分枝では合成問題で既定規則より速い一方、MIPLIB 2017の39問では解けた数が19対24と劣り、実データの乗務員スケジューリングでは単純な擬似費用規則と同等だった。著者は、利点は計算の軽さによるもので、論文自体をAIで作成したと明記している。"}, {"id": "pn26", "rank": 26, "field": "オペレーションズ・リサーチ", "headline": "入れ子ロジットの制約付き価格設定を厳密に最適化", "title": "Constrained Nested-Logit Pricing: An Exact Reformulation and Global Optimization Method", "url": "https://arxiv.org/abs/2611.09023", "authors": "Hoang Giang Pham ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "類似商品間の代替を表す入れ子ロジットの需要で、価格の上下限や加重価格上限の制約がある価格設定問題を厳密に再定式化し、大域最適化する方法を示した。難しい相互作用を入れ子の水準に集約し、計算量の指数が商品数ではなく入れ子の数で決まるようにした。"}, {"id": "pn27", "rank": 27, "field": "オペレーションズ・リサーチ", "headline": "ADMMの乗数ステップは黄金比を超えても収束", "title": "The multiplier step size in classical two-block ADMM: convergence and counterexamples", "url": "https://arxiv.org/abs/2611.09169", "authors": "Benqi Liu ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "古典的な2ブロックのADMMで、乗数更新のステップ幅を黄金比より大きくしても制約像と乗数が収束する範囲を示した。さらに2未満の明示的な閾値以上では、実行不可能な周期軌道を持つ反例を構成した。"}, {"id": "pn28", "rank": 28, "field": "心理学・認知科学", "headline": "米国の州別の集団主義指標を25年ぶりに更新", "title": "Revisiting collectivism across the United States after twenty-five years: an updated state-level index and its geographic and psychological correlates", "url": "https://doi.org/10.31234/osf.io/akyhq", "authors": "Mark S. Chen ほか", "venue": "PsyArXiv", "date": "2026-11-09", "why": "家族構造・婚姻の安定性・宗教性・交通手段・自営業などの指標を統合し、米国の州レベルの集団主義指数を25年ぶりに更新した。南部ほど集団主義が高い傾向は再現した一方、緯度による勾配は元の指数より弱かった。"}, {"id": "pn29", "rank": 29, "field": "心理学・認知科学", "headline": "報酬の与え方で記憶の想起の始まり方が変わる", "title": "Value-based control over memory encoding and search", "url": "https://doi.org/10.31234/osf.io/ygduf", "authors": "Sven Wientjes ほか", "venue": "PsyArXiv", "date": "2026-11-08", "why": "報酬を記銘時に与えるか後の想起の成功に応じて与えるかで、自由再生の時間的な組織化がどう変わるかを調べた。想起の成功に報酬が伴うと、報酬のついた項目の始まりから想起を始める「リスト中間の初頭効果」が生じることを示した。"}, {"id": "pn30", "rank": 30, "field": "心理学・認知科学", "headline": "脳との対応は自然言語で学習したモデルに現れる", "title": "Language, Not Code Abstraction: Natural-language Training Shapes Brain-aligned Geometry", "url": "https://arxiv.org/abs/2611.09027", "authors": "I\\~nigo Parra", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "物語・Python・C・アセンブリ・機械語で25のGPT-2-smallを学習し、脳活動データとの対応（ブレインスコア）を比べた。物語で学習したモデルは2つのベンチマークでコードのモデルの平均を上回り（Δr=0.053、0.059）、コードの学習は無作為な重みと同程度にとどまった。"}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "専門家モデルの重みを事前情報に蒸留を加速", "title": "P^2-MOPD: Accelerating Multi-Teacher On-Policy Distillation via Parameter Priors", "url": "https://arxiv.org/abs/2611.03953", "authors": "Sinuo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-09", "why": "複数の教師モデルからの方策上の蒸留で、学生と専門家のパラメータの線形結合の係数と学生の重みを同時に最適化するP²-MOPDを提案した。専門家の重みを事前情報として使いつつ学生を結合の範囲に閉じ込めない設計で、4つの領域・2つの規模で検証した。"}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "テスト時強化学習の多数決ラベルの誤差を分解", "title": "On the Reliability of Majority-Vote Pseudo-Labels in Test-Time Reinforcement Learning", "url": "https://arxiv.org/abs/2611.09872", "authors": "Haoyu Wang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "ラベルなしデータで多数決の擬似ラベルを使うテスト時強化学習の誤差を、母集団の多数派の偏りと有限回の生成による変動に分解した。後者の影響を抑える頑健なDPO（PC-Dr.DPO）と忘却を減らす仕組みを提案し、6つの推論ベンチマークで評価した。"}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "正規化層のある深層網はリプシッツ定数が指数増大", "title": "On Lipschitz Explosion in Deep Neural Networks with Normalization: Consequences for Optimization and Adversarial Robustness", "url": "https://arxiv.org/abs/2611.08775", "authors": "Ashkan Soleymani ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "バッチ正規化などの正規化層を持つ深層網では、各層の重みのノルムを抑えても入力と重みに対するリプシッツ定数が深さとともに指数的に増えうることを証明した。最適化の保証や敵対的な頑健性の議論に影響する結果である。"}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "小さなチームを並列に走らせるとエージェントが伸びる", "title": "Test-Time Compute Scales Better with Parallel Agent Teams", "url": "https://arxiv.org/abs/2611.09798", "authors": "Junlin Wang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "検証器で採点できる長期の課題で、多数の独立エージェントから最良を選ぶ方法と大きな1チームの協働の長所を合わせ、小さなチームを多数並列に走らせて最良を残す方法を提案した。27Bのモデル・100エージェントの予算で、10体のチームの並列化が12課題中10課題で独立エージェントの並列化を上回った。"}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "LLMの創造的な出力の新しさを構造的に測る", "title": "AlienBench: A Benchmark of Structural Novelty in Language Model Outputs", "url": "https://arxiv.org/abs/2611.09094", "authors": "Jonas Oppenlaender ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "人が異星の生物を想像する認知心理学の課題を使い、LLMの出力が地球の動物の特徴という既知の基準からどれだけ離れるかで新しさを測るベンチマークを作り、評定者の主観に頼らない新規性の尺度を示した。"}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "エージェントが自分の働き方を改良できるかを測る", "title": "Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents", "url": "https://arxiv.org/abs/2611.08946", "authors": "Jingdong Zhang ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "視覚とロボティクスの課題で、エージェントが課題の評価を使って解法だけでなくプロンプト・道具・記憶などの実行環境を改良できるかを、固定予算で評価するベンチマークFlex-RSIを提案した。"}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "異分散ノイズを均して低ランク信号を回復", "title": "Blind Noise Equalization for Large Data Matrices under General Variance Profiles", "url": "https://arxiv.org/abs/2611.08784", "authors": "Boris Landa ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "成分ごとにノイズ分散が異なる大規模データ行列で、行と列を反復的に再尺度化してノイズ分散を均すBRINEを提案した。適切な条件のもとでノイズのスペクトルにマルチェンコ–パスツール則を回復し、信号やノイズの構造を知らなくても弱い信号成分を見えやすくする。"}, {"id": "pn38", "rank": 38, "field": "統計学", "headline": "資産の分位点を小地域・属性別にベイズ推定", "title": "Bayesian Unit-level Quantile Modeling with Application to Wealth Data", "url": "https://arxiv.org/abs/2611.08843", "authors": "Daniel Vedensky ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "正負の値をとり裾の重い資産データについて、調査ウェイトを考慮した非対称ラプラス疑似尤度のベイズ単位レベルモデルを提案し、時間・地域・細かな属性別の分位点を推定できるようにした。"}, {"id": "pn39", "rank": 39, "field": "統計学", "headline": "移流の向きに合わせた時空間ガウス過程の近似", "title": "Advection-aligned block Vecchia inference for spatio-temporal Gaussian processes", "url": "https://arxiv.org/abs/2611.08938", "authors": "Joonwon Lee ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "大規模な時空間ガウス過程のベッキア近似で、データから推定した移流（輸送）の方向に沿って過去の観測を条件づけに選ぶ方法を提案した。静止衛星GEMSのオゾン全量の観測を動機とし、観測地点が格子上になくても使える。"}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "相関行列のボックス・コックス変換族を理論化", "title": "Box-Cox Transformations of Correlation Matrices", "url": "https://arxiv.org/abs/2611.09790", "authors": "Ilya Archakov ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "相関行列に対するボックス・コックス変換の族を定義し、生の相関や一般化フィッシャー変換を特別な場合として含むことを示した。逆問題が厳密に凸であることや、α≤0のときに限り全空間への写像になることなどを証明した。"}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "ChatGPTの広告導入後に週間利用者が5.4%減", "title": "Monetization of Generative AI: Advertising, User Engagement, and Market Outcomes", "url": "https://doi.org/10.2139/ssrn.7681558", "authors": "Jingwei Dai ほか", "venue": "SSRN", "date": "2026-11-09", "why": "米国でのChatGPTへの広告導入を、他国を対照とした差の差分析で調べ、週間アクティブ利用者が5.4%減ったことを示した。AIアプリの利用者が多い都市圏ほど減少が大きかった。"}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "LLMの順位表の競争が能力の画一化を招く条件", "title": "Strategic Competition and Convergence in LLM Leaderboards", "url": "https://arxiv.org/abs/2611.09780", "authors": "Naveen Raman ほか", "venue": "arXiv", "date": "Mon, 09 Nov 2026", "why": "LLMの開発者が勝率を最大化するよう能力ごとに資源を配分するゲームとして順位表の競争を定式化した。生産関数が似ていると能力の構成が似通い、比較優位があれば多様性が保たれ、収穫逓減が上位の過密化を招くことを示した。"}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "モデルポートフォリオが投資信託の競争を弱める", "title": "Centralized Financial Advice and Competition for Capital&nbsp;", "url": "https://doi.org/10.2139/ssrn.7681563", "authors": "Pietro Lazzare   function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);

    });

  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);

  }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech

  function jaVoice() {

  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");

  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")

  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);

  }

    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
