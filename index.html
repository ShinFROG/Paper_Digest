でもLLM 0.85〜0.90に対しSARIMA 1.71、ETS 1.31だった。国名と日付の文脈を与えることが最も効いた。Diebold–Mariano検定は32の比較中31でLLMに有利な方向だった（抄録）。", "p6": "著者は、国ごとの検定標本が14〜23件と少なく個別国では統計的有意に達しないこと、月次の国単位データとゼロショットに限られることを限界に挙げる（抄録）。解釈：比較手法のMASEが1を大きく超えており、ベンチマークの設定がLLMの優位を大きく見せていないか本文で確認したい。", "fun": "天気予報のような専用の数式モデルより、文章を書くAIに「この国の過去の観光客数」を見せるだけのほうが、来月の観光客数をよく当てました。しかもAIが答えを覚えていた可能性を、AIの知識の締め切り後の期間でも確かめている点が面白いところです。", "unverified": "使用した3系統のLLMの名称、プロンプトの全文は抄録になく未確認。"}}, {"id": "jr16", "rank": 16, "headline": "同僚との成績差が知識隠しを生む二つの経路", "title": "The dual-pathway mechanism of the relative performance gap on knowledge hiding from the perspective of stress cognitive appraisal", "url": "https://doi.org/10.1108/jkm-04-2026-0785", "authors": "Xueyan Zhang ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-20", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Zhang, X., & Cao, Y. (2026). The dual-pathway mechanism of the relative performance gap on knowledge hiding from the perspective of stress cognitive appraisal. Journal of Knowledge Management, 30(11), 637–659. https://doi.org/10.1108/jkm-04-2026-0785", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "同僚との相対的な成績差が知識隠しにつながる経路に、妨害的評価と挑戦的評価という逆向きの2つがあることを示した（抄録）。", "p3": "従業員400人のオンライン調査で、確認的因子分析とブートストラップにより直接・媒介・調整媒介効果を検定した。手続き的公正の知覚を調整変数とした（抄録）。", "p5": "成績差は知識隠しと正に関連し、妨害的評価は知識隠しを増やし、挑戦的評価は減らした。手続き的公正は妨害経路を弱め、挑戦経路を強めた（抄録）。", "fun": "できる同僚との差を「脅威」と受け止めると知識を隠し、「成長の機会」と受け止めると隠さなくなります。同じ差でも受け止め方で行動が正反対になり、職場が公正だと感じられるほど良い方向に傾く点が面白いところです。", "unverified": "効果量は抄録になく未確認。横断調査である。"}}, {"id": "jr17", "rank": 17, "headline": "組織変革の特性が変革推進行動と心の健康を左右", "title": "An examination of serial mediators linking change characteristics with employee change championing behaviors and positive mental health", "url": "https://doi.org/10.1111/apps.70151", "authors": "Alannah E. Rafferty ほか", "venue": "Applied Psychology", "date": "2026-10-20", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "apa": "Rafferty, A. E., & Nguyen, P. T. (2026). An examination of serial mediators linking change characteristics with employee change championing behaviors and positive mental health. Applied Psychology, 75(5). https://doi.org/10.1111/apps.70151", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "組織変革の6つの特性が、変革への信念・感情・準備性を順に介して、従業員の変革推進行動と心の健康に結び付くことを示した（抄録）。", "p3": "複数の組織のオーストラリアの従業員397人の3時点調査で、4つの直列媒介のモデルを検証した（抄録）。", "p5": "悪い変革の履歴と変革への参加は、肯定的感情と準備性を通じて推進行動と間接的に関連し、変革的な変化は否定的感情と準備性を通じて関連した。変革の履歴は肯定的感情・準備性・推進行動を通じて心の健康と関連した（抄録）。", "fun": "会社が何かを変えようとするとき、社員が前向きになれるかは「過去の変革がうまくいったか」や「自分が参加できたか」に左右されます。感情という中間地点を通って行動や心の健康に届く、という道筋を分けて描いた点が面白いところです。", "unverified": "各経路の効果量は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "金融業での男性育休が職場規範と結束を変える", "title": "The Paternity Leave Ripple Effect in the Finance Industry: Shaping Norms and Social Cohesion", "url": "https://doi.org/10.1002/hrm.70104", "authors": "Almudena Cañibano ほか", "venue": "Human Resource Management (USA)", "date": "2026-10-20", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "apa": "Cañibano, A., Festing, M., & Titze, S. (2026). The Paternity Leave Ripple Effect in the Finance Industry: Shaping Norms and Social Cohesion. Human Resource Management. https://doi.org/10.1002/hrm.70104", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "男性中心のフランス金融業で、男性の長期育休が職場と家庭の社会的なつながりと結束にどう影響するかを理論化した（抄録）。", "p3": "長期の育休を取った父親と、職場（同僚・人事・経営層）と家庭（パートナー）の関係者への面接による解釈主義的な研究（抄録）。", "p5": "育休は社会的関係やつながり、集団のwell-beingへの関心の変化と結び付けられていた。性別規範を揺るがす変革的な循環と、規範が維持される循環という2つの経路を示し、その分かれ目を制度設計・経営層の関与・組織風土・上司と同僚の支援に求めた（抄録）。", "fun": "父親が育休を取ると、その本人だけでなく周りの同僚の考え方や職場のつながりまで変わることがあります。ただしそれは職場の条件次第で、何も変わらない循環もある、という両面を描いた点が面白いところです。", "unverified": "面接の人数は抄録になく未確認。"}}, {"id": "jr19", "rank": 19, "headline": "日本で初職が非正規だと長期的に出生が減る", "title": "Scarring the Life Course: Early Career Precarity and Long-Term Fertility Outcomes in Japan", "url": "https://doi.org/10.1177/09500170261462746", "authors": "Fumiya Uchikoshi ほか", "venue": "Work, Employment and Society", "date": "2026-10-21", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "apa": "Uchikoshi, F., & Chen, M. (2026). Scarring the Life Course: Early Career Precarity and Long-Term Fertility Outcomes in Japan. Work, Employment and Society. https://doi.org/10.1177/09500170261462746", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "日本で初職が非正規雇用だと、特に男性で長期的に結婚・出生が減ることを示した（抄録）。", "p3": "1970〜2015年の就職コホートを含む回顧的な職歴データを、多状態生命表モデルで分析した（抄録）。", "p5": "正規雇用に比べ、初職が非正規の男性は45歳までに結婚している確率が約18ポイント、子をもつ確率が約14ポイント低かった。差は景気後退後に就職したコホートで拡大し、結婚の遅れ・断念が男性の出生ペナルティの約3分の1を説明した（抄録）。", "fun": "最初の仕事が非正規かどうかで、40代半ばの家族の姿まで変わる、という長い時間をまたいだ「傷跡」の研究です。仕事の入口のつまずきが人生全体に響くという、日本の雇用の仕組みの重さが見えてくる点が面白いところです。", "unverified": "女性についての結果の詳細は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "都市のデジタル化は企業の従業員福利を高める", "title": "City Digitalization and Employee Welfare: A Stakeholder Empowerment View", "url": "https://doi.org/10.1177/00076503261492087", "authors": "Liwen Wang ほか", "venue": "Business and Society", "date": "2026-10-20", "sjr": 2.832, "citescore": 14.9, "citescore_year": "2025", "apa": "Wang, L., Ji, B., Luo, D., Zhou, K. Z., & Jin, J. L. (2026). City Digitalization and Employee Welfare: A Stakeholder Empowerment View. Business & Society. https://doi.org/10.1177/00076503261492087", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国で都市のデジタル化が、その都市の企業の従業員福利支出を増やすことを示した（抄録）。", "p3": "地方政府・市民・地元の労働者を力付けるというステークホルダーのエンパワーメントの視点から仮説を立て、2014〜2019年の中国上場企業のパネルで分析した（抄録）。", "p5": "都市のデジタル化は従業員福利支出に正の影響をもち、法制度の強い地域、世間の注目の高い企業、教育水準の高い従業員をもつ企業で効果が大きかった（抄録）。", "fun": "街がデジタル化すると、情報が行き渡り、市民や働く人の声が届きやすくなります。その結果、会社が社員の福利にお金をかけるようになる、という街と会社のつながりが面白いところです。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr21", "rank": 21, "headline": "非法人地域の山火事対策に土地利用計画を組み込む", "title": "Land Use–Based Wildfire Planning for Unincorporated Communities", "url": "https://doi.org/10.1177/0739456x261494478", "authors": "Tasnim Isaba ほか", "venue": "Journal of Planning Education and Research", "date": "2026-10-20", "sjr": 1.054, "citescore": 7.3, "citescore_year": "2025", "apa": "Isaba, T., Chandrasekhar, D., Bhandari, S., & Loquellano, F. A. (2026). Land Use–Based Wildfire Planning for Unincorporated Communities. Journal of Planning Education and Research. https://doi.org/10.1177/0739456x261494478", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国西部の非法人地域の山火事対策で、土地利用計画の組み込みが植生管理や建築規制に比べて遅れていることを示した（抄録）。", "p3": "11州の郡レベルの地域山火事防護計画60件を内容分析し、重回帰で組み込みの要因を調べた（抄録）。", "p5": "用途地域規制や予防策に大きな欠落があり、州の義務付けと過去の山火事経験は組み込みを進め、人口増加と利害関係者の多様さは土地利用計画の成果に負に働いた（抄録）。", "fun": "山火事の対策というと木を切ったり燃えにくい家を建てたりを思い浮かべますが、そもそも危ない場所に家を建てない計画のほうが根本的です。それが一番遅れているという指摘が面白いところです。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr22", "rank": 22, "headline": "従業員重視の姿勢が顧客の組織同一化を生む", "title": "EXPRESS: From Employee Orientation to Customer Identification: A Three-Level Study of Restaurant Service Encounters", "url": "https://doi.org/10.1177/10963480261500768", "authors": "Jie Cao ほか", "venue": "Journal of Hospitality and Tourism Research", "date": "2026-10-20", "sjr": 1.953, "citescore": 14.3, "citescore_year": "2025", "apa": "Cao, J., Liu, J., & Li, J. (2026). EXPRESS: From Employee Orientation to Customer Identification: A Three-Level Study of Restaurant Service Encounters. Journal of Hospitality & Tourism Research. https://doi.org/10.1177/10963480261500768", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "飲食店で、従業員を大切にする組織の価値観が、従業員の同一化と顧客志向を通じて顧客の組織への同一化につながることを示した（抄録）。", "p3": "中国の飲食店44店の従業員866人と顧客2,583人の対応付けたデータを、3水準のマルチレベル構造方程式モデルで分析した（抄録）。", "p5": "従業員志向は従業員の同一化と正に関連し、それが顧客志向と顧客の同一化に関連した。顧客志向は従業員と顧客の同一化の関係を媒介し、組織の公式化は過程全体を強めた（抄録）。", "fun": "社員を大事にする店は、社員が店を好きになり、その気持ちが接客を通じてお客さんにも伝わって、お客さんも店のファンになる、というリレーです。店・社員・客の三段をつないで確かめた点が面白いところです。", "unverified": "効果量は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "救急外来でのサービス相互作用の脆弱性", "title": "The Fragile Encounter: Service Interaction Vulnerability in Emergency Department Care", "url": "https://doi.org/10.1177/10946705261474258", "authors": "Ania Izabela Rynarzewska ほか", "venue": "Journal of Service Research", "date": "2026-10-21", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Rynarzewska, A. I., Tanner, E. C., Tanner, J., Ruch, A., Jones, L., & Dalton, D. (2026). The Fragile Encounter: Service Interaction Vulnerability in Emergency Department Care. Journal of Service Research. https://doi.org/10.1177/10946705261474258", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "救急外来で患者と医療者の双方が脆弱になる「サービス相互作用の脆弱性」の理論枠組みを示した（抄録）。", "p3": "病院データの分析とネトノグラフィー（オンライン上の言説の民族誌）を組み合わせた混合研究法（抄録）。", "p5": "患者と医療者の相互作用が脆弱性を悪化させも緩和もし、それがサービスの失敗や成功の可能性を左右することを示した（抄録）。", "fun": "救急外来では、具合の悪い患者だけでなく、疲れ切った医療者も弱い立場にあります。どちらか一方ではなく「両方が弱っている出会い」としてサービスを捉え直した点が面白いところです。", "unverified": "病院データの規模は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "直接購入の経験が越境EC規制への反対を生む", "title": "When Consumers Say no: Direct Purchase Experience and Opposition to Cross‐Border E‐Commerce Regulation in South Korea", "url": "https://doi.org/10.1111/ijcs.70260", "authors": "Byunggeor Moon", "venue": "International Journal of Consumer Studies", "date": "2026-10-21", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "apa": "Moon, B. (2026). When Consumers Say no: Direct Purchase Experience and Opposition to Cross‐Border E‐Commerce Regulation in South Korea. International れた抄録を使用", "preprint": false, "short": true, "p1": "子ども時代に住んでいた地域の歩きやすさや公園へのアクセスが、晩年の心の健康と関連するかを調べた（抄録）。", "p3": "1958〜1972年に乳歯を提供したセントルイスの人々を2020年以降に再接触したデータで、5〜13歳時の住所を1960年国勢調査と歴史的な街路地図に結び付け、歩きやすさと公園アクセスの指標を作り、抑うつ・不安の尺度との関連を一般化推定方程式で推定した（抄録）。", "p5": "抄録が途中で切れており、関連の有無と大きさは未確認。", "fun": "子どもの頃に抜けた乳歯の寄付が、60年後に「育った街と心の健康」を調べる手がかりになりました。古い地図と国勢調査で昔の街並みを再現する、時間をさかのぼる工夫が面白いところです。", "unverified": "結果（関連の方向と大きさ）は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "感謝は社会的支援を通じてwell-beingを高める", "title": "Social support processes link gratitude and well-being across cultures and over time", "url": "https://doi.org/10.1007/s10902-026-01126-z", "authors": "Carley Vornlocher ほか", "venue": "Journal of Happiness Studies", "date": "2026-10-20", "sjr": 1.378, "citescore": 7.1, "citescore_year": "2025", "apa": "Vornlocher, C., & Wormley, A. S. (2026). Social support processes link gratitude and well-being across cultures and over time. Journal of Happiness Studies, 27(8). https://doi.org/10.1007/s10902-026-01126-z", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "感謝がwell-beingを高める仕組みの一部が、受けている支援への気付き（知覚された社会的支援）と支援の提供にあることを示した（抄録）。", "p3": "2つの研究の14万8千人超のデータで、横断と縦断の両方から社会的支援の媒介を検証した（抄録）。", "p5": "社会的支援の過程、特に知覚された社会的支援が感謝とwell-beingの関連を部分的に媒介した。集団主義的な国ほど感謝と支援提供の関連が弱かった（抄録）。", "fun": "「ありがとう」と感じる人は、周りが自分を支えてくれていることに気付きやすくなり、それが幸福感につながります。ただし助け合いが当たり前の文化では、感謝がさらに助ける行動を増やす効果は弱い、という文化差が面白いところです。", "unverified": "媒介の割合は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "アジア系米国人の祖父母による孫育ての動向", "title": "Trends and patterns of Asian American grandparents living with and raising grandchildren", "url": "https://doi.org/10.1111/josi.70089", "authors": "Hongwei Xu ほか", "venue": "Journal of Social Issues", "date": "2026-10-20", "sjr": 1.309, "citescore": 9.6, "citescore_year": "2025", "apa": "Xu, H., & Wu, E. (2026). Trends and patterns of Asian American grandparents living with and raising grandchildren. 水面波形のモデル化を組み合わせ、波の型・空間応答・水面の変化を調べた（抄録）。", "p5": "衝撃波は非線形振動波と非線形遷移波が主で、卓越周波数は1〜2 Hz。振幅は地すべりの正面で最大、上流側、下流側の順で、合流角30°では流量比は振幅への影響が小さかった。第1波の振幅と波高の予測式を作った（抄録）。", "fun": "山あいのダム湖に土砂が滑り込むと、津波のような大きな波が起こります。川が合流する場所では流れが波の広がり方を変えるので、どちらの方向に高い波が向かうかを模型で確かめた点が面白いところです。", "unverified": "予測式の精度は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "物理情報RNNで地すべりの時空間確率的早期警報", "title": "Spatiotemporal probabilistic analysis for landslide early warning using physics-informed recurrent neural network model: case study Mt. Umyeon, Korea", "url": "https://doi.org/10.1007/s11069-026-08478-y", "authors": "Ba-Quang-Vinh Nguyen ほか", "venue": "Natural Hazards", "date": "2026-10-20", "citescore": 7.6, "citescore_year": "2025", "apa": "Nguyen, B.-Q.-V., & Nguyen, T.-H. (2026). Spatiotemporal probabilistic analysis for landslide early warning using physics-informed recurrent neural network model: case study Mt. Umyeon, Korea. Natural Hazards, 122(22). https://doi.org/10.1007/s11069-026-08478-y", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、物理情報を組み込んだ再帰型ニューラルネットで地すべりの時空間的な確率的早期警報を行い、韓国・牛眠山（ウミョン山）を事例とした研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「物理の法則と機械学習を組み合わせて、いつどこで崩れそうかを確率で示せるか」です。都市のすぐそばの山を対象にしている点も、問いの切実さを感じさせます。", "unverified": "手法の詳細と警報の精度は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "デジタル化が利益の質を高める条件は監査保証", "title": "DIGITALIZATION, AUDIT ASSURANCE, AND EARNINGS MANAGEMENT: WHEN DOES TECHNOLOGY ENHANCE REPORTING QUALITY?", "url": "https://doi.org/10.62441/actainnovations.vi.2005", "authors": "Sekar Mayangsari ほか", "venue": "Acta Innovations", "date": "2026-10-18", "apa": "(Ed.). (2026). DIGITALIZATION, AUDIT ASSURANCE, AND EARNINGS MANAGEMENT: WHEN DOES TECHNOLOGY ENHANCE REPORTING QUALITY? Acta Innovations, 63(2s). https://doi.org/10.62441/actainnovations.vi.2005", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの上場企業で、デジタル化が進んだ企業ほど利益調整が少なく、監査の規律効果は事業が複雑な企業で弱まることを示した（抄録）。", "p3": "2020〜2024年の非金融137社・685企業年について、年次報告書のNVivoによるテキスト分析でデジタル化を、修正ジョーンズモデルの裁量的発生高の絶対値で利益の質を測り、ランダム効果パネル回帰で分析した（抄録）。", "p5": "デジタル化は利益調整の少なさと関連し、Big4監査も利益調整と負に関連した。事業の複雑さはデジタル化の効果は変えなかったが、監査の効果を弱めた（抄録）。", "fun": "会社の仕組みがデジタル化すると、数字をこっそりいじりにくくなるようです。一方、外部の監査人の目は、会社の組織が複雑になるほど届きにくくなる、という対比が面白いところです。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr41", "rank": 41, "headline": "中小宿泊業の財務困窮予測：Zスコア対機械学習", "title": "Predictive Financial Distress Modelling for Small and Medium Hospitality Enterprises: Comparing Altman Z-Score, Logistic Regression and Ensemble Machine-Learning Classifiers under Seasonal Cash-Flow Constraints", "url": "https://doi.org/10.63468/jpsa.4.3.92", "authors": "Sara Anwar ほか", "venue": "Journal of Political Stability Archive", "date": "2026-10-20", "apa": "Anwar, S., Ajmal, M. M., Malik, U., & Khan, N. (2026). Predictive Financial Distress Modelling for Small and Medium Hospitality Enterprises: Comparing Altman Z-Score, Logistic Regression and Ensemble Machine-Learning Classifiers under Seasonal Cash-Flow Constraints. Journal of Political Stability Archive, 4(3), 1444–1473. https://doi.org/10.63468/jpsa.4.3.92", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "季節性の強い中小の飲食・宿泊業で、翌年の財務困窮の予測を、AltmanのZスコア、ロジット、アンサンブル機械学習、深層学習で比較した（抄録）。", "p3": "SEC XBRLから作った米国の小規模な飲食・ホテル13社のパネル（145企業年、困窮54件）で、四半期売上から季節性と谷の四半期の現金余力を作り、企業単位の除外検証と時点外検証で評価した（抄録）。", "p5": "Altman Z″は識別が良い（AUC = 0.845）が慣例の閾値では特異度が低かった（0.56）。4比率のロジット再推定（AUC = 0.901）と木のアンサンブル（勾配ブースティング0.925、ランダムフォレスト0.911）が高次元ロジットを有意に上回った（抄録）。", "fun": "季節によって売上が大きく揺れるお店では、年に一度の決算だけ見ていると危険信号を見落とします。昔ながらのZスコアの材料をそのまま使い、重み付けだけ学び直すと大きく改善する点が面白いところです。", "unverified": "13社という小標本であり、時点外での詳細な結果は抄録が途中で切れており未確認。"}}, {"id": "jr42", "rank": 42, "headline": "財務困窮の継続期間依存と業種差：セルビア", "title": "Duration dependence and sectoral heterogeneity in financial distress: Evidence from Serbian enterprises, 2013-2023", "url": "https://doi.org/10.5937/ekopre2606285j", "authors": "Danko Jevtović ほか", "venue": "Economics of Enterprise", "date": "2026-10-20", "apa": "Jevtović, D., & Stefanović, N. (2026). Duration dependence and sectoral heterogeneity in financial distress: Evidence from Serbian enterprises, 2013-2023. Economics of Enterprise, 74(5-6), 285–286. https://doi.org/10.5937/ekopre2606285j", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "セルビアの中・大企業で、財務困窮が長引くほど抜け出す確率が下がり、規制業種では困窮が長く続くことを示した（抄録）。", "p3": "2013〜2023年の困窮エピソード609件を離散時間ハザードモデルで分析した（抄録）。", "p5": "困窮から抜け出す推定確率は1年目の37.8%から6年目に10.4%まで下がり、強い負の期間依存があった。困窮期間の中央値は規制業種で4年、市場志向の業種で2年だった（抄録）。", "fun": "経営が苦しい状態は、長引くほど抜け出しにくくなる「沼」のような性質があります。だから立て直しは早いほどよく、規制の多い業種ではとくに沼が深い、という見方が面白いところです。", "unverified": "企業特性の効果の詳細は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "韓国の地方公立病院の財務困窮の予測因子", "title": "Predictors of Financial Distress in Korean Regional Public Hospitals: Focusing on Cash Flow Indicators and Regional Conditions", "url": "https://doi.org/10.12811/kshsm.2026.20.3.001", "authors": "Geun-Chan Lee", "venue": "The Korean Journal of Health Service Management", "date": "2026-10-21", "apa": "Lee, G.-C. (2026). Predictors of Financial Distress in Korean Regional Public Hospitals: Focusing on Cash Flow Indicators and Regional Conditions. The Korean Journal of Health Service Management, 20(3), 1–17. https://doi.org/10.12811/kshsm.2026.20.3.001", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、韓国の地方公立病院の財務困窮の予測因子を、キャッシュフロー指標と地域の条件に注目して調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「地方の公立病院の経営難は、お金の流れと地域の事情のどちらで予測できるか」です。採算と地域医療の両立という難題につながる問いが面白いところです。", "unverified": "対象病院数・指標・結果は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "系列外の構成単位監査人と監査報酬の低価格受注", "title": "Unaffiliated Component Auditors and Audit Fee Models: The Case of Lowballing", "url": "https://doi.org/10.1016/j.jacceco.2026.101956", "authors": "Angela Pettinicchio ほか", "venue": "Journal of Accounting and Economics", "date": "2026-10-21", "sjr": 8.748, "citescore": 11.7, "citescore_year": "2025", "apa": "Pettinicchio, A., Pope, P. F., & Scimeca, A. (2026). Unaffiliated Component Auditors and Audit Fee Models: The Case of Lowballing. Journal of Accounting and Economics, 101956. https://doi.org/10.1016/j.jacceco.2026.101956", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、グループ監査で系列外の構成単位監査人が関わる場合の監査報酬モデルと、低価格受注（ローボーリング）を扱う研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「子会社の監査を別の事務所に任せると、監査報酬の決まり方や安値受注がどう変わるか」です。監査の値段が監査の質を映すか、という古くて新しい問いが面白いところです。", "unverified": "データ・手法・結果は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "UCLA孤独感尺度の3項目版と20項目版を直接比較", "title": "Measuring loneliness: a head-to-head psychometric comparison of the 3- and 20-item UCLA Loneliness Scales", "url": "https://doi.org/10.1017/S0033291724002083", "authors": "Corentin J. Gosling ほか", "venue": "HAL (ART) Psychological Medicine", "date": "2026-10-19", "citescore": 12.2, "citescore_year": "2025", "apa": "Gosling, C. J., Colle, R., Cartigny, A., Jollant, F., Corruble, E., & Frajerman, A. (2024). Measuring loneliness: a head-to-head psychometric comparison of the 3- and 20-item UCLA Loneliness Scales. Psychological Medicine, 54(14), 3821–3827. https://doi.org/10.1017/s0033291724002083", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用", "preprint": false, "short": true, "p1": "UCLA孤独感尺度の3項目版は、連続得点としては20項目版とほぼ同等だが、二値化して有病率を出す用途には向かないことを示した（抄録）。", "p3": "助産学生1,742人の大規模疫学研究で、20項目版と3項目版、不安・抑うつなどの尺度に回答してもらい、心理測定的性質を直接比較した（抄録）。", "p5": "両尺度は強く関連し、信頼性・収束・弁別・既知群の妥当性は同程度に高かった。二値化すると3項目版の感度・特異度は閾値によらず許容水準を下回り、孤独の有病率は閾値によって大きく変わった（抄録）。", "fun": "たった3問で孤独の程度はかなり正確に測れますが、「孤独な人は何%」と線を引いて数えると、線の引き方で結果が大きく変わってしまいます。測れることと数えられることは違う、という点が面白いところです。", "unverified": "対象が助産学生に限られる。数値の詳細は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "第一線公務員の職務要求とwell-beingの関係", "title": "Balancing Workplace Demands Against Employee Wellbeing for Street Level Bureaucrats: The Intricate Interrelationships Between Psychological Capital, Burnout, Discretionary Power, Work Harassment and Wellbeing", "url": "https://doi.org/10.1177/07349149261491221", "authors": "Geremy Farr-Wharton ほか", "venue": "Public Administration Quarterly", "date": "2026-10-21", "citescore": 1.8, "citescore_year": "2025", "apa": "Farr-Wharton, G., Xerri, M. J., & Brunetto, Y. (2026). Balancing Workplace Demands Against Employee Wellbeing for Street Level Bureaucrats: The Intricate Interrelationships Between Psychological Capital, Burnout, Discretionary Power, Work Harassment and Wellbeing. Public Administration Quarterly. https://doi.org/10.1177/07349149261491221", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "第一線の医療系公務員で、心理的資本とwell-beingの関係を、燃え尽きと組織的な職場ハラスメントが完全に媒介することを示した（抄録）。", "p3": "行動行政学と資源保存理論を統合し、オーストラリアの医療系の第一線公務員259人の4週間間隔の2時点パネルを構造方程式モデルで分析した（抄録）。", "p5": "燃え尽きと組織的な職場ハラスメントが心理的資本とwell-beingの関係を完全に媒介し、well-beingの分散の半分以上を説明した（抄録）。", "fun": "前向きな心の力（心理的資本）がある人でも、燃え尽きやハラスメントを経由しないと幸福感にはつながらない、という結果です。個人の心がけより、職場の負担を減らすことのほうが効く、という示唆が面白いところです。", "unverified": "裁量権の役割の結果の詳細は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "義務的な環境サービスで信頼は部分的にしか回復しない", "title": "PARTIAL TRUST REPAIR IN A MANDATORY GREEN SERVICE: EVIDENCE ON THE SERVICE RECOVERY PARADOX FROM CHINA'S VEHICLE INSPECTION INDUSTRY", "url": "https://doi.org/10.35631/ijirev.826034", "authors": "Wang Xiugen ほか", "venue": "International Journal of Innovation and Industrial Revolution", "date": "2026-10-21", "apa": "Xiugen, W., Hong, G., Al-haimi, B., & Xuan, Z. (2026). PARTIAL TRUST REPAIR IN A MANDATORY GREEN SERVICE: EVIDENCE ON THE SERVICE RECOVERY PARADOX FROM CHINA’S VEHICLE INSPECTION INDUSTRY. International Journal of Innovation and Industrial Revolution, 8(26), 560. https://doi.org/10.35631/ijirev.826034", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の車検のような義務的な環境サービスでは、サービス回復で信頼は部分的にしか戻らず、回復の逆説はほとんど起きないことを示した（抄録）。", "p3": "中国の車検の中小企業での事例研究で、苦情87件、顧客10人と従業員5人への面接、3サイクルの内部者アクションリサーチを組み合わせ、完全な40件で探索的回帰を行った（抄録）。", "p5": "想起による失敗前の信頼3.8は失敗後2.1に下がり、回復後3.3に戻った。回復後の満足が失敗前を上回ったのは3件（3.4%）だけで、相互作用的公正が回復後の信頼と最も強く関連した（β = 0.45、p < .001）（抄録）。", "fun": "失敗した店がうまく謝ると、前よりファンになってくれることがある（回復の逆説）と言われます。でも避けられない車検のような義務のサービスでは、そんな逆転はほとんど起きず、丁寧に対応しても「被害を抑える」のがせいぜいだった点が面白いところです。", "unverified": "失敗前の信頼は想起にもとづき、想起の偏りの可能性がある（抄録）。"}}, {"id": "jr48", "rank": 48, "headline": "市民参加を計算的に分析する言語・主体性・熟議の枠組み", "title": "Language, agency, and deliberation: a multilevel theoretical framework for the computational analysis of citizen participation", "url": "https://doi.org/10.3389/frai.2026.1878502", "authors": "Claudio Fuentes-Bravo ほか", "venue": "Frontiers in Artificial Intelligence", "date": "2026-10-21", "citescore": 8.0, "citescore_year": "2025", "apa": "Fuentes-Bravo, C., & Raveau, M. P. (2026). Language, agency, and deliberation: a multilevel theoretical framework for the computational analysis of citizen participation. Frontiers in Artificial Intelligence, 9. https://doi.org/10.3389/frai.2026.1878502", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "市民参加の言説を計算的に分析するために、どの言語的次元が心理的・政治的な情報を担うかを示す多水準の理論枠組みを提案した（抄録）。", "p3": "チリの参加型コーパスでの10年の研究をもとに、内容、相互作用の同調（言語スタイルの一致）、物語上の立ち位置の3次元を相補的なものとして立て、熟議理論と対話させた（抄録）。", "p5": "相互作用の同調が低いことはコミュニケーション志向のやり取りでない証拠になるが、高いことはその証拠にならないという非対称性により、枠組みを熟議の失敗の検出に使えるとした。主張は仮説として述べている（抄録）。", "fun": "話し合いがうまくいっているかを、言葉の選び方の「合わせ具合」から見抜こうとする研究です。話し方がそろっていないのは失敗のサインだが、そろっていても成功とは限らない、という一方向だけの判定が面白いところです。", "unverified": "実証的な検証は今後の課題とされている（抄録）。"}}, {"id": "jr49", "rank": 49, "headline": "ドイツのプロジェクト専門職のAI導入と役割変化の認知", "title": "Human-AI Orchestration in Project Business An empirical study of AI adoption, competence recombination, and perceived role change among German project professionals", "url": "https://doi.org/10.1016/j.plas.2026.100249", "authors": "Reinhard Wagner ほか", "venue": "Project Leadership and Society", "date": "2026-10-21", "sjr": 1.036, "citescore": 9.2, "citescore_year": "2025", "apa": "Wagner, R., & Mihaljević, D. (2026). Human-AI Orchestration in Project Business An empirical study of AI adoption, competence recombination, and perceived role change among German project professionals. Project Leadership and Society, 100249. https://doi.org/10.1016/j.plas.2026.100249", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、ドイツのプロジェクト専門職を対象に、AI導入、能力の再結合、役割変化の認知を実証的に調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「AIを使い始めると、プロジェクトの仕事で求められる能力の組合せや自分の役割はどう変わるか」です。人とAIの分担を「指揮（オーケストレーション）」と表現している点も興味を引きます。", "unverified": "標本・手法・結果は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "PEの関与が銀行の監視を代替しノンバンク融資を増やす", "title": "How Private Equity Fuels Nonbank Lending", "url": "https://doi.org/10.1093/rfs/hhag092", "authors": "Sharjil Haque ほか", "venue": "The Review of Financial Studies", "date": "2026-10-20", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "apa": "Haque, S., Mayer, S., & Wang, T. (2026). How Private Equity Fuels Nonbank Lending. The Review of Financial Studies. https://doi.org/10.1093/rfs/hhag092", "why": "PEの積極的関与が銀行の監視や情報生産の必要を減らし、融資がノンバンクに移る仕組みを示した。"}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "投資家の政治志向と企業の象徴的・実質的な気候対応", "title": "Investors' ideology and corporate symbolic and substantive ronment", "date": "2026-10-20", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "環境製品のクラウドファンディングで、誤解を招く環境訴求が成功に効く条件を検証した。"}, {"id": "jn15", "rank": 15, "field": "情報通信", "headline": "熱雑音を変調する後方散乱通信の第一原理チャネルモデル", "title": "First-principles channel model and capacity-achieving transmission scheme in thermal noise backscatter links", "url": "https://doi.org/10.1073/pnas.2606732123", "authors": "Geneva Ecola ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "電源なしで熱放射を変調して通信する方式のチャネルモデルと容量達成方式を示した。"}, {"id": "jn16", "rank": 16, "field": "計算社会科学・ネットワーク科学", "headline": "研究の卓越は専門の深さと分野横断の両方から生まれる", "title": "Depth or Breadth? Domain-Specific Expertise and Cross-Domain Engagement in the Development of Scholarly Excellence", "url": "https://doi.org/10.1177/17456916261490574", "authors": "Lorne M. Hartman", "venue": "Perspectives on Psychological Science", "date": "2026-10-20", "sjr": 4.859, "citescore": 27.4, "citescore_year": "2025", "why": "科学の科学と熟達研究を統合し、深さと幅の補完関係を論じた概念論文。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "研究の卓越性について、単一分野の深い専門性と分野横断的な関与は補完的であり、その寄与はキャリア段階や制度の文脈で変わると論じた概念論文（抄録）。", "p3": "科学の科学（science of science）、熟達の認知研究、組織研究の知見を統合し、多分野的な接触、学際的統合、まれな超学際的貢献を区別して検討した（抄録）。", "p5": "分野固有の専門性は技術的熟達・信頼・効率的な知識蓄積を支え、統合的な分野横断は組み合わせ直し・問題の捉え直し・長期的な知的影響を促す。学術の報酬構造は深さを優遇すると指摘する（抄録）。", "fun": "研究者は一つのことを深く掘るべきか、いろいろな分野に手を出すべきか。答えは「どちらも」で、時期によって比重が変わる、という整理です。評価の仕組みが深さばかりを褒めるので、幅が育ちにくいという指摘が面白いところです。", "unverified": "概念論文で新しい実証データは用いていない（抄録）。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "女性取締役の比率とLGBTQ+平等方針", "title": "Board Gender Diversity and LGBTQ + Equality Policies: Evidence From Corporate Social Responsibility Practices in United States Firms", "url": "https://doi.org/10.1002/csr.71095", "authors": "Yan Wang ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-20", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "取締役会の女性比率と企業のLGBTQ+平等方針の関係を米国企業で検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国大企業で、女性取締役の存在とLGBTQ+平等方針（企業平等指数）の関連は正だが、推定方法によって強さが変わることを示した（抄録）。", "p3": "2012〜2022年の大企業の非バランスパネルで、二元の企業固定効果を中心に、プールOLS、ラグモデル、差分GMMなどで頑健性を確かめた（抄録）。", "p5": "女性取締役の存在はプールとラグのモデルで指数と正に関連したが、企業固定効果の推定は弱く、GMMでは有意でなかった。女性取締役が1・2・3人以上と増えるにつれ係数は上がったが、明確な閾値の証拠は限られた（抄録）。", "fun": "女性取締役がいる会社ほど多様性に配慮した方針をもつように見えますが、同じ会社の中の変化だけを比べると関係は弱くなります。「そういう会社だから両方ある」のか「女性取締役が変えた」のかを見分ける難しさが見える点が面白いところです。", "unverified": "因果関係や従業員が実際に感じる包摂は扱っていない（抄録）。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "AI経済の規制：法制度・規制手段・厚生の体系的レビュー", "title": "Regulating the Artificial Intelligence Economy: A Systematic Search and Mechanism‐based Review of Legal Institutions, Regulatory Mechanisms, Economic Trade‐offs, and Welfare Consequences", "url": "https://doi.org/10.1111/joes.70175", "authors": "Yaobin Wang ほか", "venue": "Journal of Economic Surveys", "date": "2026-10-20", "sjr": 2.483, "citescore": 14.1, "citescore_year": "2025", "why": "AI規制が参入・学習・競争・労働に与える影響の法学・経済学研究を体系的に整理した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "AI規制の法制度・規制手段・経済的トレードオフ・厚生への帰結を、体系的検索と仕組みにもとづく統合でレビューした（抄録）。", "p3": "2026年8月21日までの学術論文84本と法・制度文書20点を対象に、制度-仕組み-帰着-厚生の枠組みで法的権限から行動・戦略的適応・厚生までをつないだ（抄録）。", "p5": "リスク規制・保証・責任・データの権利・競争政策・労働保護は補完的に働く。固定的な遵守費用は害を減らしても既存企業に有利になりうる。証拠はプライバシーや職場導入など狭い衝撃で強く、包括的AI法の総体的な厚生効果では弱い（抄録）。", "fun": "AIの規制は安全を高める一方で、書類仕事の負担が大企業には軽く新興企業には重いため、結果として大企業を守ってしまうことがあります。良かれと思った規則の思わぬ副作用を整理した点が面白いところです。", "unverified": "コーパスは仕組みを網羅する設計で、知見の頻度の推定ではない（抄録）。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "移民と連邦研究費が米国のAI優位を支える", "title": "How Immigration and Federal Funding Sustain American AI Leadership", "url": "https://doi.org/10.1145/3815125", "authors": "Nur Ahmed ほか", "venue": "Communications of the ACM", "date": "2026-10-20", "sjr": 1.54, "citescore": 14.1, "citescore_year": "2025", "why": "研究者の出自と研究費の手集めデータで、米国のAI研究の基盤を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国のAI分野の優位が、海外出身の研究者と連邦研究費という2つの基盤に支えられていることを数量化した（抄録）。", "p3": "研究者の出身とスタートアップ創業者の手集めデータに、特許・論文・資金源を結んだ大規模データを組み合わせた（抄録）。", "p5": "海外出身者は計算機科学の新規博士の66%、5つの主要AI会議の米国機関の受賞者の平均61%、最も引用されたAI論文50本の米国機関の著者の59%を占めた。連邦研究費は計算機科学博士の訓練の75〜80%を支えていた（抄録）。", "fun": "アメリカのAIの強さは、世界中から集まった人材と国の研究費という2本の柱で支えられている、ということを数字で示しています。移民の制限や予算削減がその柱を削ることになる、という政策上の含意がはっきりしている点が面白いところです。", "unverified": "推計の手法の詳細は未確認。"}}, {"id": "jn20", "rank": 20, "field": "計算社会科学・ネットワーク科学", "headline": "女性嫌悪のネット上ヘイトに対抗するユーザーの特徴", "title": "Guardians of the cyberverse: Dispositional, attitudinal, and autobiographical correlates of user engagement against misogynist digital hate", "url": "https://doi.org/10.1177/14614448261492098", "authors": "Rinat Meerson ほか", "venue": "New Media and Society", "date": "2026-10-21", "sjr": 2.723, "citescore": 14.3, "citescore_year": "2025", "why": "利用者による介入の意思を性向・態度・経験から説明した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "女性嫌悪のネット上のヘイトに対して、利用者が介入する意思を強める最大の要因が「共感的な怒り」であることを示した（抄録）。", "p3": "オーストリア（791人）・フランス（800人）・ハンガリー（775人）・スウェーデン（785人）の国際調査で、性向・態度・経験の特性と、直接・間接の介入、モデレーション支持の関係を調べた（抄録）。", "p5": "共感的な怒りは全国で3つの結果すべての最も強い正の予測因子だった。有害な脱抑制はモデレーション支持とは負、直接介入とは正に関連した（抄録）。", "fun": "ネットで攻撃的になりやすい性格の人ほど、ヘイトに直接言い返す行動も取りやすい、という意外な結果です。その性格を「反論する力」として良い方向に使えるかもしれない、という見方が面白いところです。", "unverified": "横断調査であり因果は示していない。"}}, {"id": "jn21", "rank": 21, "field": "社会学", "headline": "社会的場面のパターンを理解・評価・変革する", "title": "Searching for the Pattern: Understanding, Assessing, and Transforming Social Settings", "url": "https://doi.org/10.1177/17456916261473152", "authors": "Edward Seidman", "venue": "Perspectives on Psychological Science", "date": "2026-10-20", "sjr": 4.859, "citescore": 27.4, "citescore_year": "2025", "why": "システム理論の考え方が社会学・心理学に取り入れられた歴史を分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "システム理論の考え方が社会学や心理学に取り入れられた歴史を分析し、教室・地域組織・職場などの社会的場面を理解・評価・変革する枠組みを示した（抄録）。", "p3": "生物学・物理学のシステム理論の概念の歴史的分析から、情報と意味を伝える動的なやり取りの創発的なパターン「社会的規則性」を中心概念として取り出した（抄録）。", "p5": "社会的規則性は、統制と権力、伝達の様式、情報の流れという経路で意味を伝え、それが分配上の公正の結果をもたらすとし、より公正な結果を生むための場面の変革モデルを示した（抄録）。", "fun": "教室や職場の「空気」は、誰が決め、どう話し、情報がどう流れるかという繰り返しのパターンから生まれます。そのパターンを見つけて変えれば、そこにいる人たちの結果の公平さも変えられる、という発想が面白いところです。", "unverified": "理論論文で実証データは用いていない（抄録）。"}}, {"id": "jn22", "rank": 22, "field": "社会学", "headline": "英国テレビ制作の長時間労働は不平等を生む", "title": "Sacrificial merit: Working time, commitment and inequality in UK television production", "url": "https://doi.org/10.1177/01634437261497910", "authors": "Beth Johnson ほか", "venue": "Media, Culture and Society", "date": "2026-10-20", "sjr": 1.957, "citescore": 7.2, "citescore_year": "2025", "why": "過剰な労働時間が献身の証として不平等を再生産する仕組みを論じた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "英国のテレビ制作で、過剰な労働時間が職業的価値を測る評価の仕組み（犠牲的なメリット）になり、長時間労働が問題にされにくいことを示した（抄録）。", "p3": "英国の連続ドラマの制作現場での半構造化面接40件と民族誌的観察に、参加者が語る他のテレビ業界の経験を加えた（抄録）。", "p5": "最長24時間の勤務、無給の準備作業、休憩の欠如が語られ、理不尽な要求を引き受ける意思と能力がプロ意識や適性の証とみなされていた（抄録）。", "fun": "どれだけ無理をしたかが「本気度」や「プロらしさ」の証明になってしまうと、長時間労働はむしろ誇りとして再生産されます。フリーランスで評判が次の仕事を決める世界だからこそ抜け出しにくい、という構造が面白いところです。", "unverified": "単一の制作現場が中心である（抄録）。"}}, {"id": "jn23", "rank": 23, "field": "エネルギー・気候", "headline": "陰極中間層の配向制御で二元系有機太陽電池を高効率化", "title": "Directed assembly of cathode interlayers enables efficient binary organic solar cells", "url": "https://doi.org/10.1038/s41560-026-02148-w", "authors": "Jia Yao ほか", "venue": "Nature Energy", "date": "2026-10-20", "sjr": 20.769, "citescore": 78.4, "citescore_year": "2025", "why": "界面双極子を作る陰極中間層の組み立てを制御して効率を高めた。", "explain": {"basis": "抄録", "basis_note": "Nature Energyの抄録を使用", "preprint": false, "short": true, "p1": "有機太陽電池の陰極中間層の分子の向きを段階的な成膜で揃え、二元系で認証効率20.65%を達成した（抄録）。", "p3": "極性溶媒で活性層を前処理し、両極性溶媒で中間層を自己組織化させる段階的成膜を用い、和周波発生振動分光で分子の向きを調べた（抄録）。", "p5": "中間層分子は垂直方向に配向し、表面電位を高め電荷輸送抵抗を下げた。認証効率20.65%、曲線因子82.7%を達成し、他の中間層や活性層にも使える方法とした（抄録）。", "fun": "太陽電池の性能が、たった一層の薄い膜の分子が「立っているか寝ているか」で変わる、という話です。分子の向きを溶媒の選び方だけで揃えた点が面白いところです。", "unverified": "安定性の評価は抄録になく未確認。"}}, {"id": "jn24", "rank": 24, "field": "材料工学", "headline": "磁気で制御できる生体模倣の非対称な熱機械保護", "title": "Magnetically guided programmable thermomechanical protection enabled by biomimetic asymmetric design", "url": "https://doi.org/10.1073/pnas.2615691123", "authors": "Zimu Li ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "過酷環境の精密機器を守るプログラム可能な熱機械保護を示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録を使用", "preprint": false, "short": true, "p1": "貝やウニに学んだ非対称な設計のせん断硬化ゲルで、磁気で制御できる熱と衝撃の防護材料を作った（抄録）。", "p3": "せん断硬化ゲルを非対称に設計し、片面は貝殻のレンガとモルタル構造、もう片面はウニの衝撃硬化を模した磁気粘弾性エラストマーにした（抄録）。", "p5": "貯蔵弾性率は11.29〜450.28 kPaの40倍の調整幅をもち、衝撃力を85%減らし、光熱制御で40 °Cの温度差を実現した（抄録）。", "fun": "貝殻の丈夫な積み重ね構造と、ウニの「叩かれると硬くなる」性質を、一枚の材料の表と裏に持たせました。磁石で形や硬さを遠隔操作できるという、生き物の知恵と工学の組合せが面白いところです。", "unverified": "耐久性の評価は未確認。"}}, {"id": "jn25", "rank": 25, "field": "惑星科学", "headline": "火星磁気シースに広がるプラズマジェットを2機で観測", "title": "Widespread plasma jets in the Martian magnetosheath revealed by dual-spacecraft observations", "url": "https://doi.org/10.1073/pnas.2616582123", "authors": "Abigail Tadlock ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "2機の探査機の同時観測で火星周辺のプラズマジェットの広がりを示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録を使用", "preprint": false, "short": true, "p1": "MAVENと天問1号の2機の同時観測で、火星の磁気シース全体にプラズマジェットが広く生じていることを示した（抄録）。", "p3": "火星周回の2機の探査機の同時観測データを解析し、地球での発生条件と比較した（抄録）。", "p5": "地球ではジェットの発生が惑星間磁場の向きに強く左右され準平行衝撃波の領域に限られるのに対し、火星では磁気シース全体で発生した。火星の広がった水素コロナが生むピックアップイオンが原因と提案した（抄録）。", "fun": "太陽風が惑星にぶつかってできる領域に吹き出すジェットは、地球では限られた場所でしか起きませんが、火星ではあちこちで起きていました。惑星自身がまとう薄い水素の大気が原因かもしれない、という発想が、彗星や系外惑星の理解にもつながる点が面白いところです。", "unverified": "発生頻度の具体的な数値は未確認。"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "機械学習でペロブスカイト界面の水素結合の型を解読", "title": "Decoding Perovskite Interfaces: Machine Learning Uncovers Geometry‐Matched Dual‐Site Hydrogen Bonding", "url": "https://doi.org/10.1002/anie.9718249", "authors": "Can Cheng ほか", "venue": "Angewandte Chemie - International Edition", "date": "2026-10-21", "sjr": 5.495, "citescore": 25.7, "citescore_year": "2025", "why": "分子による界面不動態化の設計原理を機械学習で明らかにした。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "文献データにもとづく解釈可能な機械学習で、ペロブスカイト太陽電池の界面不動態化分子を選び、効率27.13%の素子を作った（抄録）。", "p3": "約100点の文献データで6つの分子・材料特徴と性能の関係をモデル化し、SHAPで寄与を順位付けし、9つの未検討分子をスクリーニングした（抄録）。", "p5": "水素結合能と吸着強度が最も影響の大きい因子だった。ATCは幾何学的に整合した多点の水素結合でヨウ化物の移動障壁を0.39から0.67 eVに上げ、ATCで修飾したセルはPCE 27.13%を達成した（抄録）。", "fun": "新しい材料探しは、化学者の勘と試行錯誤に頼るのが普通でした。たった約100件の過去の実験データから「効く分子の条件」を読み取り、まだ誰も試していない分子を当てた点が面白いところです。", "unverified": "認証された安定化効率の値は抄録が途中で切れており未確認。"}}, {"id": "jn27", "rank": 27, "field": "地球科学", "headline": "南アジア・インド洋の最終間氷期の海水準指標データベース", "title": "A review of Last Interglacial sea-level proxies in South Asia and the Indian Ocean", "url": "https://doi.org/10.5194/essd-18-7627-2026", "authors": "Mubashir Ali ほか", "venue": "Earth System Science Data", "date": "2026-10-20", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "最終間氷期の海水準指標を標準化したデータベースを提示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "南アジア・インド洋の最終間氷期（約13.2万〜8万年前）の海水準指標を標準化したデータベースを作った（抄録）。", "p3": "査読論文17本のデータを世界最終間氷期海岸線アトラス（WALIS）の形式で体系的にレビューし、54の海水準指標点の古相対海水準の標高と不確実性を再計算した（抄録）。", "p5": "過去の相対海水準の指標の標高には地域差があり、主に地殻変動、動的地形、氷河・水の荷重による地殻の変形が原因とした（抄録）。", "fun": "今より暖かかった約12万年前の海面の高さは、温暖化の未来を考える手がかりになります。ただし土地そのものが上下に動くので、昔の海岸線の跡をそのまま読       card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
