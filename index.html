白いところです。", "unverified": "回答者の属性の内訳と、上司の関わりの効果の大きさは抄録では未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "公的研究開発だけでは次のシリコンバレーは作れない", "title": "Can Government Support for Innovation Create the Next Silicon Valley?", "url": "https://doi.org/10.1257/jep.20251493", "authors": "E. Jason Baron ほか", "venue": "Journal of Economic Perspectives", "date": "2026-11-06", "sjr": 8.181, "citescore": 15.4, "citescore_year": "2025", "apa": "Baron, E. J., Kantor, S., & Whalley, A. (2026). Can Government Support for Innovation Create the Next Silicon Valley? Journal of Economic Perspectives, 40(4), 31–52. https://doi.org/10.1257/jep.20251493", "why": "大学、知的財産のルール、研究機関、戦時の研究開発などの因果的な証拠を整理し、公的研究開発は地域のイノベーションを高めうるが効果は費用に比べ小さく、起業家や資本などの補完的な要素が欠かせないと論じた。", "explain": {"basis": "抄録", "basis_note": "Journal of Economic Perspectivesの抄録を使用", "preprint": false, "short": true, "p1": "政府の研究開発支援で次のシリコンバレーを作れるかを、歴史と因果的な証拠から検討し、公的研究開発は拠点づくりを助けうるが単独では作れないと結論した（抄録）。", "p3": "成功した拠点の起源の歴史の記録と、大学、知的財産のルールの変更、新しい研究機関、戦時の研究開発、宇宙開発競争からの因果的な証拠を整理した（抄録）。", "p5": "多くの拠点は偶然と有利な初期条件に起源を持っていた。公的研究開発は地域のイノベーション・雇用・所得を高めうるが、効果は不均一で費用に比べ控えめなことが多く、他地域からの移転を一部反映しうる。起業家やリスク資本などの補完的な要素が中心的な役割を果たす（抄録）。", "fun": "「国がお金を出せば第二のシリコンバレーが生まれる」と考えたくなりますが、この論文は歴史と研究の証拠から、そう単純ではないと示します。成功した地域の多くは偶然や恵まれた出発点に助けられており、国の支援は起業家やお金の出し手がそろって初めて生きるのです。国の力と地域の力の役割分担が見える点が面白いところです。", "unverified": "個々の研究の効果の大きさは抄録では未確認。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "共通の基幹ソフトへの依存がサイバーリスクを集中させる", "title": "Systemic Cyber Risk: Linking Measurement, Market Incentives, and Policy", "url": "https://doi.org/10.1257/jep.20261513", "authors": "Susan Athey ほか", "venue": "Journal of Economic Perspectives", "date": "2026-11-06", "sjr": 8.181, "citescore": 15.4, "citescore_year": "2025", "apa": "Athey, S., Gandal, N., & Moore, T. (2026). Systemic Cyber Risk: Linking Measurement, Market Incentives, and Policy. Journal of Economic Perspectives, 40(4), 115–136. https://doi.org/10.1257/jep.20261513", "why": "多くの企業が少数の重要な技術製品とソフトウェアに依存することで単一の障害点が生まれる問題を、経済学の原理と事例・新しいデータから4つの教訓として整理した。", "explain": {"basis": "抄録", "basis_note": "Journal of Economic Perspectivesの抄録を使用", "preprint": false, "short": true, "p1": "多くの企業が少数の重要な技術製品とソフトウェアに依存することで生じるシステミックなサイバーリスクを、経済学の原理から4つの教訓として整理した（抄録）。", "p3": "事例研究、新しいデータ、政策の議論を組み合わせ、リスクの集中と攻撃者の誘因、個々の防御策の限界を経済学の観点から論じた（抄録）。", "p5": "限られた製品とサービスへの広い依存が多くの単一障害点を生んで侵害の影響を増幅させ、個々の防御の進歩はシステミックな事象への脆弱性の高まりに相殺されていると論じた（抄録）。4つの教訓の内容は抄録に記載がない。", "fun": "世界中の会社が同じソフトや同じクラウドを使っていると、そこが一か所やられただけで、あちこちが同時に止まってしまいます。この論文は、一社ごとに守りを固めても、みんなが同じ所に頼る限り全体の危険はむしろ増えると、経済学の考え方で説明しています。一人ひとりの合理的な選択が社会全体のリスクを生む構図が面白いところです。", "unverified": "4つの教訓の具体的な内容と新しいデータの中身は抄録では未確認。"}}, {"id": "jn23", "rank": 23, "field": "統計学", "headline": "境界の変わる地域を郵便番号でつないで時系列化", "title": "A Simple Spatial Harmonization Technique by Aggregation for Ecological Studies: An Application Using Swiss Healthcare Regions", "url": "https://doi.org/10.1029/2026gh001875", "authors": "Jacopo Vanoli ほか", "venue": "GeoHealth", "date": "2026-11-06", "sjr": 1.515, "citescore": 7.3, "citescore_year": "2025", "apa": "Vanoli, J., & Vicedo‐Cabrera, A. M. (2026). A Simple Spatial Harmonization Technique by Aggregation for Ecological Studies: An Application Using Swiss Healthcare Regions. GeoHealth, 10(11). https://doi.org/10.1029/2026gh001875", "why": "行政区域の境界の改定で生じる多対多の対応を、郵便番号で結んだグラフの連結成分として安定した地域に統合する簡便な方法を提案し、スイスの全国の時系列分析に適用した。", "explain": {"basis": "抄録", "basis_note": "GeoHealthの抄録を使用", "preprint": false, "short": true, "p1": "行政区域の境界が時期によって変わる問題に対し、郵便番号でつないだグラフの連結成分として、時間的に安定した地域に統合する簡便な方法を提案した（抄録）。", "p3": "異なる版の行政区域をグラフの節点とし、共通の郵便番号を持つ地域を辺で結んで、連結成分を統合した地域とする。2008年に境界が大きく変わったスイスの医療統計地域（多対多の対応）に適用した（抄録）。", "p5": "統合した地域で、1998〜2023年のスイス全国の夏の気温と65歳以上の呼吸器疾患による救急入院の時系列分析を行った。事象がまれで曝露を集約でき、解像度の低下を許せる場合に適し、局所的な異質性の隠蔽などが限界とした（抄録）。", "fun": "市町村の合併などで地域の区切りが変わると、昔と今のデータをそのまま比べられなくなります。この研究は、変わりにくい郵便番号を「のりしろ」にして、新旧の地域を一つにまとめ直す簡単な方法を考えました。細かさを少し犠牲にする代わりに、何十年もの比較を可能にする割り切りが面白いところです。", "unverified": "統合後の地域の数と、気温と入院の関係の結果は抄録では未確認。"}}, {"id": "jn24", "rank": 24, "field": "統計学", "headline": "道路網の災害脆弱性を共形予測で不確実性つきに推定", "title": "Multi-hazard road-network criticality from earth observation data using spatial graph attention networks with conformal uncertainty", "url": "https://doi.org/10.3389/frsen.2026.1996538", "authors": "Srinivasarao Tanniru ほか", "venue": "Frontiers in Remote Sensing", "date": "2026-11-06", "sjr": 1.192, "citescore": 6.9, "citescore_year": "2025", "apa": "Tanniru, S., Bhowmik, P. N., & Saini, K. (2026). Multi-hazard road-network criticality from earth observation data using spatial graph attention networks with conformal uncertainty. Frontiers in Remote Sensing, 7. https://doi.org/10.3389/frsen.2026.1996538", "why": "インドの沿岸デルタの道路網で、空間的なグラフ注意ネットワークによる区間の不通しやすさの推定を空間ブロック交差検証と分割共形予測で評価し、空間的に較正された不確実性を付けた。", "explain": {"basis": "抄録", "basis_note": "Frontiers in Remote Sensingの抄録を使用", "preprint": false, "short": true, "p1": "インドの沿岸デルタの道路網で、洪水・土壌の飽和・暑熱の複合災害による区間の不通しやすさを空間的なグラフ注意ネットワーク（GAT）で推定し、空間ブロック交差検証と分割共形予測で不確実性を評価した（抄録）。", "p3": "道路閉鎖の記録がないため、多重災害の閾値規則で学習用ラベルを作り、予測を途絶の受けやすさとして解釈した。2016〜2025年の気候・衛星・地形・道路網・人口の多源データを使った（抄録）。", "p5": "GATのAUCは無作為の交差検証で0.923、空間ブロック交差検証で0.682に下がり、後者ではランダムフォレスト（0.746）が5分割すべてで上回った。危険度の順位の上位5%を守ると、模擬したアクセス損失の56%を避けられた（抄録）。", "fun": "地図上の近い道路は似た条件にあるので、AIの成績を測るときに近い場所のデータが練習用と試験用に混ざると、実力以上の点数が出てしまいます。この研究は、場所ごとにまとめて分けて試験すると成績が大きく下がることを正直に示しました。試験のやり方で評価が変わることを見せた点が面白いところです。", "unverified": "予測は閾値規則によるラベルに基づき、実際の道路閉鎖での検証は未確認。"}}, {"id": "jn25", "rank": 25, "field": "地球科学", "headline": "始新世の高CO2は南大洋の生物ポンプの弱化と関係", "title": "Elevated early Eocene atmospheric CO2 tied to reduced Southern Ocean biological pump efficiency", "url": "https://doi.org/10.1038/s41561-026-02142-7", "authors": "Simone Moretti ほか", "venue": "Nature Geoscience", "date": "2026-11-06", "sjr": 6.141, "citescore": 27.3, "citescore_year": "2025", "apa": "Moretti, S., Fripiat, F., Hain, M. P., Luciani, V., Lourens, L., Borucki, P., Gerber, L., Agterhuis, T., Haynes, L., Filippi, G., Schiebel, R., Haug, G. H., Sigman, D. M., & Martínez-García, A. (2026). Elevated early Eocene atmospheric CO2 tied to reduced Southern Ocean biological pump efficiency. Nature Geoscience. https://doi.org/10.1038/s41561-026-02142-7", "why": "有孔虫に含まれる窒素の同位体の測定から、始新世の最温暖期に南大洋の表層の硝酸濃度が高く、生物による炭素の隔離が非効率だったことを示し、当時の高い大気CO2の一因を明らかにした。", "explain": {"basis": "抄録", "basis_note": "Nature Geoscienceの抄録を使用", "preprint": false, "short": true, "p1": "有孔虫に含まれる窒素の同位体の測定から、始新世の最温暖期（53〜49 Ma、Maは百万年前）に南大洋の生物による炭素の隔離が非効率だったことを示し、当時の高い大気CO2の少なくとも半分を説明しうるとした（抄録）。", "p3": "最近の氷期サイクルでCO2を左右した南大洋の生物ポンプが新生代の初めにも働いたかを、有孔虫に結合した窒素の同位体の測定で検証した（抄録）。", "p5": "最温暖期の南大洋では表層の硝酸濃度が高く、炭素の隔離が非効率だった。深海から大気へのCO2の移動は、当時の低いpHと高いカルシウムイオン濃度による緩衝能力の低さで増幅された。風化の働きが弱かったとすれば、大気CO2の増加の少なくとも半分を説明できる（抄録）。", "fun": "今から4900万年以上前の始新世には、地球が今よりずっと暑く、空気中の二酸化炭素もとても多い時期がありました。この研究は、小さな殻を持つ生き物（有孔虫）の化石に残る窒素の痕跡から、当時の南の海では生き物が炭素を海の底に送る働きが弱かったことを突き止めました。海の生き物の働きが地球全体の気候を左右していたという点が面白いところです。", "unverified": "測定した地点と試料の数は抄録では未確認。"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "機械学習で水中のイオン対の自由エネルギーを高精度に", "title": "From Accurate Quantum Chemistry to Converged Thermodynamics for Ion Pairing in Solution", "url": "https://doi.org/10.1021/jacs.6c20276", "authors": "Niamh O’Neill ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-06", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "apa": "O’Neill, N., Shi, B. X., Witt, W. C., Armstrong, B. I., Niyogi, A., Baldwin, W. J., Raiteri, P., Schran, C., Michaelides, A., & Gale, J. D. (2026). From Accurate Quantum Chemistry to Converged Thermodynamics for Ion Pairing in Solution. Journal of the American Chemical Society. https://doi.org/10.1021/jacs.6c20276", "why": "機械学習と電子状態理論を組み合わせ、水中の炭酸カルシウムのイオン対の自由エネルギーを明示的な溶媒で求め、実験と定量的に一致させるには密度汎関数理論を超える結合クラスター法の精度が必要なことを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of the American Chemical Societyの抄録を使用", "preprint": false, "short": true, "p1": "機械学習と電子状態理論を組み合わせ、水中の炭酸カルシウムのイオン対の自由エネルギーを明示的な溶媒で求め、実験と定量的に一致させるには結合クラスター法CCSD(T)の精度が必要であることを示した（抄録）。", "p3": "系統的に改良できる一連のモデルを作り、密度汎関数理論からゴールドスタンダードのCCSD(T)までの精度で、十分な統計的サンプリングによる熱力学量を求めた（抄録）。", "p5": "核形成の前のCaとCO3イオンの最初の会合の仕組みを、エンタルピーとエントロピーの寄与まで定量化し、カルシウムイオンの水和の仕組みについての長年の合意の欠如も解消した（抄録）。", "fun": "海の中で鉱物になる炭酸カルシウムが水の中でどうくっつくかは、二酸化炭素を閉じ込める技術にも関わる問題です。ところが計算で正確に予測するのは長年難しいままでした。この研究は、AIを使って最も精密な量子化学の計算に相当する精度で大量の計算を回せるようにし、実験と合う答えを出しました。精密さと計算量の両立を実現した点が面白いところです。", "unverified": "計算コストと、ほかのイオン対への適用は抄録では未確認。"}}, {"id": "jn27", "rank": 27, "field": "開発経済学", "headline": "農村電化の経済効果は4年以上たって現れる", "title": "The long-run returns to rural electrification: Evidence from a randomized experiment", "url": "https://doi.org/10.1016/j.jdeveco.2026.103960", "authors": "Matthieu Chemin ほか", "venue": "Journal of Development Economics", "date": "2026-11-05", "citescore": 8.2, "citescore_year": "2025", "apa": "Chemin, M., & Kokossou, T. (2026). The long-run returns to rural electrification: Evidence from a randomized experiment. Journal of Development Economics, 103960. https://doi.org/10.1016/j.jdeveco.2026.103960", "why": "ケニアの農村の小水力発電による電化で、2016年から家庭を段階的に接続するランダム化比較試験を行い最長8年追跡して、非農業の仕事や事業の創出などの経済効果は接続から4年以上たって初めて現れることを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of Development Economicsの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "ケニアの農村の小水力発電による電化を、家庭を段階的に接続するランダム化比較試験で最長8年追跡し、経済活動への効果は長期になって初めて現れることを示した（抄録）。", "p3": "2016年に始まった段階的な家庭の接続を利用したランダム化比較試験で、労働時間の配分、事業、利益、雇用、電気の生産利用、家電の普及を接続後8年まで調べた（抄録）。", "p5": "家庭は非農業の仕事の時間を78%増やして農作業の時間を減らしたが、この効果は4年後以降に現れた。事業の創出と拡大、利益と雇用の増加が見られ、照明と携帯電話はすぐに、コンピュータは8年後に普及した（抄録）。", "fun": "村に電気が来れば、すぐに暮らしが豊かになりそうに思えます。ところがケニアの村で8年間追いかけたこの実験では、仕事の中身が農業から他の仕事へ移り始めたのは、電気が来てから4年以上たってからでした。電灯はすぐ使われても、パソコンが広まるのは8年後だったという変化の時間差が面白いところです。", "unverified": "効果の推定の誤差と、対象地域の詳細は抄録では未確認。"}}, {"id": "jn28", "rank": 28, "field": "開発経済学", "headline": "国際生産網で仲買人が果たす交換の技術", "title": "Middlemen as an exchange technology in international production networks", "url": "https://doi.org/10.1016/j.jdeveco.2026.103959", "authors": "Bernardo S. Blum ほか", "venue": "Journal of Development Economics", "date": "2026-11-03", "citescore": 8.2, "citescore_year": "2025", "apa": "Blum, B. S., Claro, S., Dasgupta, K., Horstmann, I. J., & Rangel, M. A. (2026). Middlemen as an exchange technology in international production networks. Journal of Development Economics, 103959. https://doi.org/10.1016/j.jdeveco.2026.103959", "why": "題名によれば、国際的な生産ネットワークで仲買人を取引を成り立たせる技術として捉える研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Journal of Development Economicsの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、国際的な生産ネットワークで、仲買人を取引を成り立たせる「交換の技術」として捉える研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名からは、国境をまたいで部品や製品が行き来する生産の網の目の中で、売り手と買い手の間に立つ仲買人が、取引を成り立たせる「技術」のような役割を果たしているという見方を示す研究だと読み取れます。省かれがちな仲買人の価値を問い直す点が面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jn29", "rank": 29, "field": "開発経済学", "headline": "ペルーの小規模金採掘でリスクと信頼が技術向上を左右", "title": "“Seeing is believing”: Risk, trust and technological upgrading in Peru’s artisanal gold mining landscape", "url": "https://doi.org/10.1016/j.worlddev.2026.107615", "authors": "Alejandra Villanueva Ubillús ほか", "venue": "World Development", "date": "2026-11-06", "sjr": 2.027, "citescore": 9.3, "citescore_year": "2025", "apa": "Ubillús, A. V., & Maconachie, R. (2027). “Seeing is believing”: Risk, trust and technological upgrading in Peru’s artisanal gold mining landscape. World Development, 211, 107615. https://doi.org/10.1016/j.worlddev.2026.107615", "why": "題名によれば、ペルーの零細な金採掘の現場で、リスクと信頼が技術の向上にどう関わるかを扱う研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "World Developmentの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、ペルーの零細な金採掘の現場で、リスクと信頼が技術の向上にどう関わるか（「見ることは信じること」）を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "新しい技術がどれだけ良くても、使う人が信じなければ広まりません。題名の「見ることは信じること」からは、ペルーの小さな金鉱山で、目で見て確かめることが不安を和らげ、技術を取り入れる後押しになるかを調べた研究だと読み取れます。技術の普及を心の問題から考       card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
