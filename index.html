定の物理モデルの両方で説明した（抄録）。", "p2": "地形、土層の厚さ、過渡的な間隙水圧が発生を左右することは知られているが、斜面に沿って連続的に変わるこれらの相互作用が、発生位置をどう決めるかは十分に定量化されていなかった。従来のセル単位の方法は、斜面に沿った空間的な依存を無視していた（抄録）。", "p3": "斜面の縦断に沿った連続的な地形と土層厚を入力として、発生位置を予測する深層学習の方法を作り、特徴の寄与を分析した。あわせて、過渡的な水文モデルと3次元の斜面安定モデルを連成させ、発生位置の集中を過程に基づいて解釈した（抄録）。", "p4": "中国・諸曁の地すべりの目録で学習と検証を行い、発生位置のずれを斜面長で正規化した誤差（MNPE）で評価する。水文モデルは観測斜面の現地データで較正し、553の縦断について、地図上の発生位置と照合する（抄録）。", "p5": "深層学習の方法のMNPEは9%未満だった。寄与の大きい予測変数は土層厚、平面曲率、傾斜角の順で、寄与は縦断に沿って系統的に変わった。物理モデルでは、発生地点の85.0%で過渡的な飽和度が臨界値を超え、水理・力学的に推定した発生位置のMNPEは14.9%だった（抄録）。", "p6": "結果は諸曁の条件での説明であり、著者も「この地域の設定で」と限定している（抄録）。他の地質・降雨条件への一般化、土層厚の推定の不確かさ、発生の時刻の予測は、本文を読めておらず未確認。", "fun": "大雨で山の斜面が崩れるとき、崩れ始める場所は斜面の下のほうではなく、意外にも尾根に近い上のほうであることが多い。この研究は、まずAIに地形と土の厚さから「どこが崩れ始めるか」を当てさせ、次に、雨水のしみ込み方と土の強さの計算で「なぜそこなのか」を確かめた。答えは、水が速くたまりやすく、しかも土の踏ん張りが弱い場所が重なるところだった。当てるAIと、説明する物理を組み合わせた点が良い。", "unverified": "本文は取得できず、目録の件数、深層学習の構造、水文モデルの詳細、他地域での検証は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "疎なセンサからの状態推定を縮約モデルで高速化", "title": "Online-efficient data assimilation informed reduced order modeling using offline PBDW", "url": "https://doi.org/10.1051/m2an/2026088", "authors": "Amina Benaceur", "venue": "ESAIM Mathematical Modelling and Numerical Analysis", "date": "2026-11-10", "citescore": 3.0, "citescore_year": "2025", "apa": "Benaceur, A. (2026). Online-efficient data assimilation informed reduced order modeling using offline PBDW. ESAIM: Mathematical Modelling and Numerical Analysis. https://doi.org/10.1051/m2an/2026088", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "まばらなセンサの観測から状態を実時間で推定するために、データ同化を事前の段階で済ませ、実行時は低次元の最小二乗問題を解くだけにする縮約モデルの作り方を示した（抄録）。", "p2": "物理モデルと観測を組み合わせる標準的な方法（PBDW）は、実行時の計算費用が大きい。実時間の状態推定には、物理と観測の構造の両方を取り込みつつ、実行時の負荷を下げる方法が必要だった（抄録）。", "p3": "事前の段階で、訓練用のパラメータの集合について高忠実度の偏微分方程式と、縮約した制約つき最適化問題を解き、データ同化で補正した解を得る。この補正済みの解から、支配する物理と観測の構造の両方を含む縮約空間を作る。実行時は、得られた観測だけから低次元の最小二乗系を解いて状態を復元する（抄録）。背景：PBDWは、パラメータ化された背景モデルと観測を弱い形で結ぶ変分データ同化の方法。", "p4": "数学的な定式化と標準のPBDWとの構造の違いを導き、適切性、誤差評価、連続性の理論的な結果を論じたうえで、2次元と3次元の数値例で性能を示す（抄録）。比較の指標と数値は抄録に記載なし。", "p5": "提案法は標準のPBDWに比べて計算を大きく節約できるとする（抄録）。節約の大きさと推定の精度の数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。訓練用のパラメータの集合の外での精度、観測の雑音やモデル誤差への頑健性、非線形・時間発展の問題への適用範囲は、本文を読めておらず未確認。", "fun": "天気予報は、物理の計算と観測データを突き合わせて「今の大気の状態」を推定している。同じことを工場や構造物で瞬時に行いたいが、その場で重い計算をする時間はない。この研究は、時間のかかる突き合わせを前もって何通りも済ませておき、その結果から「ありそうな状態の型」を少数用意する。本番では、センサの値に合うように型を足し合わせるだけでよい。料理の下ごしらえを先に済ませておく発想である。", "unverified": "本文は取得できず、数値例の対象の方程式、計算時間の比、誤差評価の式は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "定型的な返信は返信を増やすが満足度を下げる", "title": "EXPRESS: The Implications of Generic Responses in Online Customer Service Operations", "url": "https://doi.org/10.1177/10591478261508621", "authors": "Jitsama Tanlamai ほか", "venue": "Production and Operations Management", "date": "2026-11-11", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Tanlamai, J., Kar, W., Khern-am-nuai, W., & Adulyasak, Y. (2026). EXPRESS: The Implications of Generic Responses in Online Customer Service Operations. Production and Operations Management. https://doi.org/10.1177/10591478261508621", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "SNS上の顧客対応で使われる定型的な返信が、顧客の反応と満足度にどう影響するかを、米国の大手銀行のデータで調べ、返信は増えるが満足度は下がりやすいことを示した（抄録）。", "p2": "企業はSNSで顧客の問い合わせに対応しており、定型的な返信の利用が広がっている。しかし、その運用が顧客の関与と満足にどう影響するかは明らかでなかった（抄録）。", "p3": "米国最大級の銀行のSNSのデータを使い、機械学習で文章から必要な情報を取り出す。顧客の問い合わせに定型的な返信が付いたことを処置とみなせる準実験的な状況を利用して、効果を推定する（抄録）。", "p4": "定型的な返信を受けた顧客が銀行に返信する確率と、返信した顧客の満足度を結果とする。条件による違いも追加で分析する（抄録）。標本の大きさ、期間、満足度の測り方は抄録に記載なし。", "p5": "定型的な返信は、顧客が銀行に返信する確率を高めた。返信した顧客の中では、定型的な返信は低い満足度と関連した。ただし一定の条件のもとでは、定型的な返信の戦略的な利用が高い満足度と関連した（抄録）。効果の大きさと条件の内容は抄録に記載なし。", "p6": "抄録には限界の記載がない。一つの銀行の事例であること、準実験の識別の仮定、満足度をテキストから推定する場合の誤差は、本文を読めておらず未確認。", "fun": "SNSで銀行に質問すると、「お問い合わせありがとうございます。詳しくはこちらへ」という決まり文句が返ってくることがある。この研究では、そうした定型の返事をもらった客は、もう一度書き込むことが増えた。話が終わらなかったからである。そして書き込んだ客の満足度は下がりやすかった。手間を省くための決まり文句が、かえってやり取りを増やしてしまう。ただし使いどころを選べば満足度が上がる場合もあり、単純に悪者とは言えない点が面白い。", "unverified": "本文は取得できず、データの規模と期間、準実験の設計、満足度が上がる条件の具体的な内容は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "AIサービスの公正・説明責任・透明性の知覚尺度", "title": "Perceived fairness, accountability and transparency toward ML-based AI service delivery: conceptualization and measurement", "url": "https://doi.org/10.1108/josm-11-2025-0609", "authors": "Oscar (Hengxuan) Chi ほか", "venue": "Journal of Service Management", "date": "2026-11-11", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Chi, O. (., Jia, S., Jo, E. H., & Chu, H. C. (2026). Perceived fairness, accountability and transparency toward ML-based AI service delivery: conceptualization and measurement. Journal of Service Management, 1–27. https://doi.org/10.1108/josm-11-2025-0609", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "機械学習によるAIサービスに対して消費者が感じる公正さ・説明責任・透明性（FAT）を、AIの開発の段階ごとに測る尺度を開発し、信頼と利用意図を予測できることを確かめた（抄録）。", "p2": "AIサービスの倫理的な知覚の概念化は研究ごとにばらばらで、サービスの文脈に合った測定の手段が限られていた。消費者の知覚が、目標の設定、コーディングと開発、実装のどの段階で生じるかも整理されていなかった（抄録）。", "p3": "文献の検討と20件の面接で項目を作り、専門家のフォーカスグループで表面妥当性を確かめる。二つの調査で探索的因子分析、確認的因子分析、PLS-SEMを行い、下位の因子が上位の次元を形づくる形成的な構造を検証する。三つ目の調査で、既存のFAT尺度、信頼、利用意図との関係から収束的・法則定立的妥当性を確かめる（抄録）。", "p4": "三つの調査の回答者は448人、535人、455人である。信頼性と妥当性の指標と、信頼・利用意図への効果の大きさで尺度を評価する（抄録）。調査の対象国とサービスの種類は抄録に記載なし。", "p5": "FATは、目標の設定、コーディングと開発、実装の各段階にまたがる多次元の構成概念として確認された。9つの一次因子はすべて、3つの上位の次元を有意に形づくった。尺度は高い信頼性と妥当性を示し、公正さと透明性が信頼と利用意図に最も強い効果を持った（抄録）。係数の値は抄録に記載なし。", "p6": "抄録には限界の記載がない。横断の自己報告の調査であること、対象のAIサービスの範囲、文化による違い、消費者が開発段階を実際に区別して知覚できるかどうかは、本文を読めておらず未確認。", "fun": "AIが融資の審査やおすすめを決めるとき、利用者は「公平か」「誰が責任を取るのか」「どう決めたのか分かるか」を気にする。面白いのは、この研究が、その気持ちをAIが「作られる前の目的の決め方」「作る途中」「使われる場面」の三つの段階に分けて測ろうとした点である。出来上がったAIの振る舞いだけでなく、どんな目的で、どう作られたかにまで、人は公正さを感じ取る。物差しを作ることで、どこを直せば信頼されるかが見えてくる。", "unverified": "本文は取得できず、項目の文言、因子の名称、信頼性係数、効果の大きさは未確認。"}}, {"id": "jr11", "rank": 11, "headline": "孤独とつながり感は別の構成概念か", "title": "An Examination of the Empirical Distinctions Between Loneliness, Social Connectedness, and Affective Social Connection", "url": "https://doi.org/10.1007/s11205-026-03965-y", "authors": "Jayme Verhagen ほか", "venue": "Social Indicators Research", "date": "2026-11-11", "sjr": 0.918, "citescore": 6.4, "citescore_year": "2025", "apa": "Verhagen, J., Karg, A., Sivasubramaniam, D., Yeomans, C., & Farmer, J. (2026). An Examination of the Empirical Distinctions Between Loneliness, Social Connectedness, and Affective Social Connection. Social Indicators Research, 185(2). https://doi.org/10.1007/s11205-026-03965-y", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "出版社のPDFの本文（方法・結果・限界の節）を読んだ。背景と考察の一部、補足資料は読んでいない", "preprint": false, "p1": "孤独感、主観的なつながり感、認知的なつながり感、社会的つながりの感情の次元は、実証的に別々の概念なのかを確かめ、どれが個人のwell-beingの分散を最もよく説明するかを比べた。主観的なつながり感と感情の次元は重なるが、孤独感、感情の次元、認知的なつながり感は区別できた（抄録、§3.2）。", "p2": "孤独と社会的つながりは世界的に重視されているが、概念と測定が入り組み、尺度が互換的に使われてきた。UCLA孤独感尺度は一つの孤独感の尺度として扱われることが多いが、肯定的な項目と否定的な項目は別の因子に載るという知見がある（抄録、§2.2）。", "p3": "検証済みの既存の尺度を使う。孤独感と主観的なつながり感はUCLA孤独感尺度の否定的な項目と肯定的な項目、感情の次元は16項目のADS、認知的なつながり感は8項目のSCS、well-beingはPWI-Aで測る。確認的因子分析で適合と弁別的妥当性を調べ、構造方程式モデルでwell-beingとの関連を、単独のモデル、同時のモデルの順に推定した（§2.2、§2.3）。", "p4": "対象はオンラインのパネルで集めたオーストラリアの成人398人（男性60%、女性39%）。年齢分布を人口に合わせるため、事後に40件を除いた。適合度はCFI、TLI、SRMR、RMSEAで判断した（§2.1、§2.3）。", "p5": "UCLA尺度は10項目・2因子のモデルが最もよく適合した（CFI 0.96、表1）。主観的なつながり感と感情の次元の相関は0.85で、孤独感との相関（−0.65）より強く、両者の弁別的妥当性は確立できなかった（§3.2）。単独のモデルでは、感情の次元がwell-beingの分散の54%、主観的なつながり感が49%、孤独感が44%、認知的なつながり感が27%を説明した。同時のモデルでは孤独感の係数が最も大きく（−0.43）、認知的なつながり感の係数は負に転じた（−0.23）（§3.3）。", "p6": "著者が挙げる限界は三つある。標本は男性に偏り、オーストラリアに限られる。横断の設計なので因果は言えず、パスの向きは理論上の順序にすぎない。自己報告による共通方法分散が関連を大きく見せうる。ADSの説明力の高さは項目数の多さと項目の冗長さを映している可能性があり、単独のモデルのR²は上限の見積もりと読むべきだとする（§4.5）。肯定的な項目の因子は適合が基準に届かなかった（§3.1）。", "fun": "「孤独ではない」と「人とつながっていると感じる」は同じことだろうか。同じ質問紙の中でも、「さびしい」と尋ねる項目と「仲間がいると感じる」と尋ねる項目は、別々のものを測っていた。しかも幸福感をいちばんよく説明したのは、さびしさの少なさではなく、安心や受け入れられている感じのほうだった。孤独を減らす対策と、つながりを増やす対策は、同じ物差しでは評価できないことになる。", "unverified": "図1の係数の全体、補足の表、考察の各節の詳細は読んでいない。データは倫理上の理由で公開されていない（§2.1）。"}}, {"id": "jr12", "rank": 12, "headline": "自閉スペクトラムの「意味ある包摂」への態度尺度", "title": "Community Attitudes Toward Meaningful Autism Inclusion", "url": "https://doi.org/10.1177/13623613261498495", "authors": "Nicole L. Matthews ほか", "venue": "Autism", "date": "2026-11-11", "sjr": 1.935, "citescore": 9.7, "citescore_year": "2025", "apa": "Matthews, N. L., Honda, H., O’Rourke, H., Southard, C., Verbeke, M., Schimmel, K., Babendure, J., Koke, J., & Smith, C. J. (2026). Community Attitudes Toward Meaningful Autism Inclusion. Autism. https://doi.org/10.1177/13623613261498495", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録と一般向け要旨を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "自閉症の人の「意味のある包摂」に対する地域住民の態度を測る尺度（MAIA）を、自閉症の当事者の意見を取り入れて作り、妥当性を確かめた。態度は4つの因子に分かれた（抄録）。", "p2": "自閉症への地域の態度を測る道具は複数あるが、否定的な態度（スティグマ）や中立的な態度（受容）に焦点があった。自閉症の人が地域にもたらす価値を認め、包摂への投資に意義があると考える「意味のある包摂」は測られていなかった（抄録、一般向け要旨）。", "p3": "25項目のMAIAと、神経多様性への一般的な態度を測る既存の尺度（NDAQ、28項目）に回答してもらい、探索的構造方程式モデリングで因子を特定した。そのうえで、居住する州、自閉症との個人的な接触、人口学的な変数によって態度が違うかを調べた（抄録）。", "p4": "米国の4つの州（アリゾナ、フロリダ、ミズーリ、オクラホマ）の772人が対象である。内的一貫性、NDAQとの収束的妥当性、各因子の群による違いで評価した（抄録）。募集の方法と標本の代表性は抄録に記載なし。", "p5": "因子は、自閉症の人の能力、対人関係での包摂、包摂の影響、包摂的な地域づくりの4つで、内的一貫性は許容できる水準から良好な水準だった。個人的な接触は能力と影響の因子を正に予測した。一方、友人・親族・知人に自閉症の人がいる回答者は、接触のない回答者より対人関係での包摂に肯定的でなかった。アリゾナの回答者は他の3州より対人関係での包摂に肯定的だった（抄録、一般向け要旨）。", "p6": "著者は「再現されれば」と条件を付けている（抄録）。4州の標本であること、探索的な分析であること、接触と態度の関連が因果かどうか、当事者の意見の取り入れ方の詳細は、本文を読めておらず未確認。", "fun": "「自閉症の人を受け入れる」と答える人でも、「地域に良いものをもたらしてくれる」とまで考えているとは限らない。この研究は、その一歩先の気持ちを測る質問紙を作った。意外なのは、身近に自閉症の人がいる回答者ほど、能力や社会への良い影響は高く評価するのに、個人的な付き合いにはやや消極的だった点である。知っていることと、近くで付き合いたいと思うことは別だった。態度をひとまとめにせず、分けて測る意味がここにある。", "unverified": "本文は取得できず、項目の文言、信頼性係数、回帰の係数、人口学的な変数ごとの違いの内容は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "48のLLMが作る求人票に性別の偏り", "title": "Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models", "url": "https://doi.org/10.1111/gwao.70291", "authors": "Jennifer M. Krebsbach ほか", "venue": "Gender, Work and Organization", "date": "2026-11-11", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Krebsbach, J. M., Lee, J. E., Zeck, S., Thakur, A., & Hilbert, M. (2026). Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models. Gender, Work & Organization. https://doi.org/10.1111/gwao.70291", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "職名だけから求人票を作らせる使い方で、職名に性別が含まれるかどうかが言語モデルの出力をどう変えるかを、多数のモデルで監査した（抄録）。", "p2": "人事の担当者が効率化のために、職名だけから求人票をLLMに作らせることが増えている。この慣行が応募者の集まり方と採用の結果に、性別に関してどんな影響を持ちうるかは調べられていなかった（抄録）。", "p3": "32の職業について、女性を示す職名、男性を示す職名、中立の職名の3通りを用意し、48のLLMに求人票を生成させるアルゴリズム監査を行った。賃金の差、覆いをしない比較評価、性役割の尺度（BSRI）に基づく言葉づかいの型を測る（抄録）。例：消防士の職名を、女性形・男性形・中立形で与える。", "p4": "計4608件の求人票を比べる。指標は、提示された賃金、LLMによる比較評価の得点、記述の言葉づかいである。指示文を少し工夫した場合と最大限工夫した場合の効果も調べる（抄録）。", "p5": "事務系の職名では、男性を示す職名の求人票に高い賃金が付いたが、すべての分析で頑健ではなかった。職業を通じて、性別を含む職名から作った求人票は、中立の職名から作ったものより比較評価が高く、女性を示す職名のものが最も高かった。指示文の最小限の工夫は評価の差を大きく減らし、最大限の工夫と同程度だったが、中立の職名から始めた場合の水準には届かなかった（抄録）。", "p6": "賃金の差は分析によって頑健でないと著者自身が述べる（抄録）。比較評価をLLMに行わせていること、実際の応募行動への影響は測っていないこと、モデルと職業の選び方の影響は、本文を読めておらず未確認。", "fun": "「消防士」の求人票をAIに書かせるとき、職名を男性形にするか、女性形にするか、中立の形にするかで、文章や給料が変わるだろうか。多数のAIで試すと、変わった。しかも指示文を工夫しても、差は小さくなるだけで消えなかった。職名という最初の一語が、その後の文章全体の調子を決めてしまうのである。便利な道具ほど、入り口の言葉選びに気をつける必要があることを、数千件の求人票が示している。", "unverified": "本文は取得できず、賃金の差の大きさ、評価の方法の詳細、使用したモデルの一覧は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "仕事用SNSが仕事と生活の境界を曖昧にする", "title": "Job Demands‐Resources, Well‐Being and Work‐Life Boundaries: The Pervasiveness of Social Networking Platforms", "url": "https://doi.org/10.1111/1748-8583.70074", "authors": "Severina Cartwright ほか", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "Cartwright, S., Hughes, E., Davies, I., & Harris, L. C. (2026). Job Demands‐Resources, Well‐Being and Work‐Life Boundaries: The Pervasiveness of Social Networking Platforms. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70074", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず。抄録は短い）", "preprint": false, "p1": "仕事向けのSNSの広がりが、仕事の要求と資源、仕事と生活の境界、well-beingにどう影響するかを、管理職への面接から整理し、境界のあいまい化を3つの次元で捉えた（抄録）。", "p2": "仕事向けのSNSが職場に浸透しているが、それが仕事の要求と資源、仕事と生活の境界にどう作用するかの理論的な理解は進んでいなかった。人的資源管理の研究でも、well-being、境界の管理、ソーシャルメディアは別々に論じられがちだった（抄録）。", "p3": "仕事の要求度-資源理論（Job Demands-Resources）と境界理論を統合する。67人の管理職への詳しい質的面接を行い、仕事向けのSNSが要求、資源、境界、well-beingに与える影響を分析した（抄録）。背景：境界理論は、人が仕事と私生活の間に引く線の強さと越え方を扱う。", "p4": "質的研究であり、統計的な検証ではなく、面接から概念の次元を導く（抄録）。対象の国・業種、分析の手順は抄録に記載なし。", "p5": "仕事向けのSNSの文脈で、仕事と生活の境界があいまいになる3つの次元が示された。職業上と私的、つながる状態とつながらない状態、統制と自律である。SNSの運用、well-beingの方針、非公式の文化的な規範をそろえるための実務的な提言を導いた（抄録）。", "p6": "抄録には限界の記載がない。管理職だけを対象とした面接であること、一般の従業員への当てはまり、国や組織文化による違いは、本文を読めておらず未確認。", "fun": "仕事の連絡にSNSを使うと、すばやく助け合える反面、夜や休日にも通知が届く。便利さが負担にもなるこの状況を、この研究は「線引き」の問題として捉えた。仕事の自分と私的な自分の線、連絡がつく時間とつかない時間の線、会社に管理されることと自分で決めることの線。三本の線がそれぞれぼやけていく。道具そのものより、職場の暗黙の決まりが線の位置を決めている、という指摘が面白い。", "unverified": "本文は取得できず、面接の対象の国と業種、分析の方法、提言の具体的な内容は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "自治体のAI導入は能力だけでなく政治で決まる", "title": "Understanding AI Adoption in Local Government: Capacity Constraints or Political Caution?", "url": "https://doi.org/10.1177/02750740261506489", "authors": "Yung-Yu Tsai ほか", "venue": "American Review of Public Administration", "date": "2026-11-11", "sjr": 1.221, "citescore": 4.7, "citescore_year": "2025", "apa": "Tsai, Y.-Y., Keiser, L., & Jabbari, N. (2026). Understanding AI Adoption in Local Government: Capacity Constraints or Political Caution? The American Review of Public Administration. https://doi.org/10.1177/02750740261506489", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "米国の自治体のAI導入の差は、財政や基盤といった能力の違いだけでなく、住民の態度や公務員の組織化といった政治的な制約によっても同じくらい説明されることを示した（抄録）。", "p2": "政府でAIの導入が広がっているが、導入の有無と程度は自治体によって異なる。その差が能力の違いによるのか、政治的な制約によるのかは、支援策の設計を左右する重要な問いだった（抄録）。", "p3": "自治体の管理者団体の調査、世論の継続調査、人口動態調査などの公開データを組み合わせ、能力の要因（財政力、基盤の支援）と政治の要因（住民のAIへの態度、公務員の組合の組織率）が導入とどう関連するかを、ロジスティック回帰とポアソン回帰で推定した（抄録）。", "p4": "結果は、AIを導入しているかどうかと、導入の広がりである（抄録）。標本の自治体数、調査年、変数の定義は抄録に記載なし。", "p5": "AI導入は、住民のAIへの態度、公務員の組合の組織率、自治体の財政力、基盤の支援と関連していた。政治の要因は、能力の要因と同じくらい、場合によってはそれ以上に導入を説明した（抄録）。係数の値は抄録に記載なし。", "p6": "抄録には限界の記載がない。観察データの相関で因果は示せないこと、住民の態度を自治体の単位でどう測ったか、導入の質や成果は扱っていないことは、本文を読めておらず未確認。", "fun": "役所がAIを使わないのは、お金や専門家が足りないからだ、と考えがちである。この研究はそれだけではないことを示した。住民がAIを警戒している地域や、公務員の組合が強い地域では、お金があっても導入が進みにくかった。新しい技術が入るかどうかは、「できるか」だけでなく「してよいと周りが思うか」で決まる。技術の話に見えて、実は人々の合意の話だった、という点が面白い。", "unverified": "本文は取得できず、標本の大きさ、効果の大きさ、組合の組織率と導入の関係の向きの詳細は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "車両-橋梁相互作用の応答で吊材の損傷を同定", "title": "Multi-head-attention locally fused GAN for few-shot hanger damage identification in arch bridges using vehicle-bridge interaction responses", "url": "https://doi.org/10.1016/j.oceaneng.2026.129376", "authors": "Longde Su ほか", "venue": "Ocean Engineering", "date": "2026-11-11", "sjr": 1.524, "citescore": 10.2, "citescore_year": "2025", "apa": "Su, L., Su, J., Cheng, L., & Ouyang, T. (2027). Multi-head-attention locally fused GAN for few-shot hanger damage identification in arch bridges using vehicle-bridge interaction responses. Ocean Engineering, 371, 129376. https://doi.org/10.1016/j.oceaneng.2026.129376", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、アーチ橋の吊材（ハンガー）の損傷を、車両と橋の相互作用で生じる応答から同定する研究で、少数の学習例でも使えるように、多頭注意で局所的に融合する敵対的生成ネットワーク（GAN）を用いるとみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、橋に多数のセンサを付けなくても、車が渡るときの揺れの情報だけで、アーチ橋を吊っている部材のどれが傷んでいるかを当てられるか、というものである。損傷した橋のデータはめったに手に入らないので、少ない例から学ぶ工夫が鍵になると読める。結果は未確認。", "unverified": "抄録・本文を入手できず、手法の詳細、検証データ、精度はすべて未確認。"}}, {"id": "jr17", "rank": 17, "headline": "準静的な影響線をウェーブレットで自動抽出", "title": "Adaptive extraction of high-fidelity quasi-static influence lines via reference-free PSO-EFI wavelet parameter optimization", "url": "https://doi.org/10.1007/s13349-026-01177-z", "authors": "Kaiqi Zhao ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-11", "citescore": 8.0, "citescore_year": "2025", "apa": "Zhao, K., Yin, S., Yang, Y., & Qin, T. (2026). Adaptive extraction of high-fidelity quasi-static influence lines via reference-free PSO-EFI wavelet parameter optimization. Journal of Civil Structural Health Monitoring, 17(1). https://doi.org/10.1007/s13349-026-01177-z", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、橋の準静的な影響線（荷重の位置と応答の関係を表す線）を、参照信号なしで、粒子群最適化（PSO）などでウェーブレットのパラメータを最適化して高い忠実度で自動抽出する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、車が橋を渡るときの計測波形には、車の重さによるゆっくりした変形と、揺れによる速い振動が混ざっているが、その中から「ゆっくりした成分」だけをきれいに取り出せるか、というものである。取り出し方の調整を人の勘でなく計算で自動化する点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、手法の詳細（題名の「EFI」の内容を含む）、検証した橋、精度はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "運用条件の変化に強い確率的な仮想センシング", "title": "MoRF-AST: Calibrated probabilistic virtual sensing for structural monitoring under changing operating conditions", "url": "https://doi.org/10.1016/j.cacaie.2026.100269", "authors": "Wingho Feng ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-10", "sjr": 2.155, "citescore": 14.7, "citescore_year": "2025", "apa": "Feng, W., Li, Q., Zhong, M., Yang, J., & Wang, C. (2026). MoRF-AST: Calibrated probabilistic virtual sensing for structural monitoring under changing operating conditions. Computer-Aided Civil and Infrastructure Engineering, 100269. https://doi.org/10.1016/j.cacaie.2026.100269", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社サイトの本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "少数のセンサの計測から構造物全体の応答を確率的に復元する仮想センシングで、運用条件が学習時と変わっても不確実性の幅が正しく保たれる方法MoRF-ASTを提案した（抄録）。", "p3": "正規化したモード座標で解析的なガウスの参照事後分布を作り、その残差だけを条件付きフローで学習する（MoRF）。運用時には、設置センサの過去の計測から応答の大きさを推定し、平均を保つ輸送で事後分布の広がりを調整する（AST）（抄録）。", "p5": "橋の床版のベンチマークで事後平均の正規化誤差（NRMSE）は6.88%だった。交通条件をずらした8つの領域で、ASTは被覆率の誤差の平均を3.53%から2.73%に下げた（抄録）。", "fun": "橋の全部の場所にセンサを付けることはできないので、数か所の計測から残りを推定する。そのとき「推定値はこのくらいの幅で確かです」と言えると安心だが、交通量が学習時と変わると、その幅が当てにならなくなる。この研究は、今の交通の様子に合わせて幅を広げたり縮めたりし、「確かさの表示」そのものを正しく保とうとした。", "unverified": "本文未読のため、センサの数と配置、ベンチマークの詳細、高速道路橋の数値事例の結果は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "交通を止めずに中空床版橋のヒンジ損傷を評価", "title": "Traffic-undisrupted assessment of hinge joint damage in hollow slab bridges using computer vision and LDIL inversion", "url": "https://doi.org/10.1016/j.istruc.2026.113508", "authors": "Haozhe Jiang ほか", "venue": "Structures", "date": "2026-11-10", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Jiang, H., Yuan, L., Zhuge, P., & Jie, Z. (2026). Traffic-undisrupted assessment of hinge joint damage in hollow slab bridges using computer vision and LDIL inversion. Structures, 94, 113508. https://doi.org/10.1016/j.istruc.2026.113508", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、中空床版橋の桁どうしをつなぐヒンジ継手の損傷を、通行止めにせず、画像計測（コンピュータビジョン）と逆解析で評価する研究とみられる（題名の「LDIL」の内容は未確認）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、橋を通行止めにせず、ふだん通りに車が走っている状態のまま、カメラの映像から床版のつなぎ目の傷みを見つけられるか、というものである。検査のために交通を止める費用と不便をなくせるかどうかが関心の中心だと読める。結果は未確認。", "unverified": "抄録・本文を入手できず、手法の詳細、対象の橋、評価の精度はすべて未確認。"}}, {"id": "jr20", "rank": 20, "headline": "斜張ケーブルとダンパーをオンラインで自動同定", "title": "An online automated identification method for stay cable-damper systems aimed at updating semiactive control parameters", "url": "https://doi.org/10.1016/j.engstruct.2026.124119", "authors": "Xu Chen ほか", "venue": "Engineering Structures", "date": "2026-11-11", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Chen, X., Li, C., Han, Y., Yuan, B., Li, K., & Cai, C. (2027). An online automated identification method for stay cable-damper systems aimed at updating semiactive control parameters. Engineering Structures, 371, 124119. https://doi.org/10.1016/j.engstruct.2026.124119", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、斜張橋などのケーブルとダンパーからなる系の特性を、オンラインで自動的に同定し、その結果で半能動制御のパラメータを更新する方法の研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、橋のケーブルの揺れを抑えるダンパーの調整値を、人が測り直さなくても、ケーブル自身の揺れの記録から自動で推定し直し続けられるか、というものである。ケーブルの状態は時間とともに変わるので、調整を追随させる必要があるという背景が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、同定の方法、検証（実験か実橋か）、精度はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "PS-InSARの2次元分解で老朽橋の水平変形を検出", "title": "Two-dimensional PS-InSAR decomposition for detecting horizontal-dominant deformation in aging bridge structures", "url": "https://doi.org/10.1007/s13349-026-01179-x", "authors": "Moon-Soo Song ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-11", "citescore": 8.0, "citescore_year": "2025", "apa": "Song, M.-S., Park, S., Das Adhikari, M., Kim, J., & Yum, S.-G. (2026). Two-dimensional PS-InSAR decomposition for detecting horizontal-dominant deformation in aging bridge structures. Journal of Civil Structural Health Monitoring, 17(1). https://doi.org/10.1007/s13349-026-01179-x", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、衛星の合成開口レーダーによる永続散乱体干渉法（PS-InSAR）の観測を二次元の成分に分解し、老朽化した橋の水平方向が ", "apa": "Xiao, S., Li, l., Hou, J., & Sun, B. (2026). A novel zero-shot bearing fault diagnosis method based on physics-informed digital twin model and domain-alignment strategy. Measurement Science and Technology. https://doi.org/10.1088/1361-6501/aebfbb", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "故障時のラベルつきデータがなくても軸受の故障を診断できるよう、物理を組み込んだデジタルツインで仮想の振動信号を作り、実測信号と領域を合わせる方法を示した（抄録）。", "p3": "4自由度の軸受の力学モデルとニューラルネットを融合し、支配方程式との整合を課す物理残差の損失と、スペクトルの忠実さを保つ周波数の事前損失を使う。雑音のある実測信号を仮想信号の領域に合わせて差を埋める（抄録）。", "p5": "自作の試験装置で95.53±1.46%、公開のCWRUデータで95.15±1.89%の平均のゼロショット診断精度を得て、既存手法を精度と安定性で上回ったと報告する（抄録）。", "fun": "機械の故障を見つけるAIを作るには、壊れたときのデータが要る。しかし実際の現場で、わざと機械を壊してデータを取ることは難しい。この研究は、物理の式に従う「コンピュータの中の軸受」を壊して偽の揺れを作り、それで学習させた。本物と偽物の揺れの違いを埋める工夫を加えると、本物の故障も高い割合で当てられた。", "unverified": "抄録の末尾が切れており、切除実験の結果は未確認。運転条件の範囲も未確認。"}}, {"id": "jr24", "rank": 24, "headline": "不完全飽和砂の非排水応答をFEMとDEMの連成で", "title": "FEM enhanced DEM modeling on the undrained response of imperfectly saturated sand: numerical algorithm and its application in static liquefaction", "url": "https://doi.org/10.1016/j.compgeo.2026.108820", "authors": "Teng Zhao ほか", "venue": "Computers and Geotechnics", "date": "2026-11-10", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Zhao, T., Xie, X., Ye, J., & Yang, Z. (2027). FEM enhanced DEM modeling on the undrained response of imperfectly saturated sand: numerical algorithm and its application in static liquefaction. Computers and Geotechnics, 203, 108820. https://doi.org/10.1016/j.compgeo.2026.108820", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、完全には飽和していない砂の非排水条件での応答を、有限要素法（FEM）で補強した個別要素法（DEM）でモデル化する数値アルゴリズムを示し、静的液状化に適用する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、砂粒一つひとつの動きを追う計算に、粒のすき間の水と空気の働きをどう組み込めば
