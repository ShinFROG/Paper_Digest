<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

cottish Residents Experience Increased Community Well-Being? Equitable Access to Community Well-Being-Promoting", "url": "https://doi.org/10.5281/zenodo.22902731", "authors": "Hill, Taylor G.", "venue": "Zenodo", "date": "2026-11-17", "theme": "包摂的コミュニティ・社会", "theme_no": 4}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "コーディングAIの分析は有意を作りやすい", "title": "Inference after coding agents", "url": "https://arxiv.org/abs/2611.23174", "authors": "Florian Gunsilius ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "AIのコーディング・エージェントが実証分析を担うと、推定法の探索と再実行が容易なため新しい種類の選択後推論の問題が生じると論じる。効果ゼロの模擬データで4つの最先端エージェントが54〜98%の割合で有意なp値を報告し、エージェントを部分標本で再実行して選択の確率を推定する補正検定を提案する。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "多変量拡散過程の厳密な最尤推定の理論を確立", "title": "Exact and Approximate Maximum Likelihood Estimation for Multivariate Diffusions under High-Frequency Sampling", "url": "https://arxiv.org/abs/2611.22675", "authors": "Duy Nguyen", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "高頻度・長期間で離散観測される多変量エルゴード拡散過程について、厳密な最尤推定量の一致性・漸近正規性・有効性を示し、先行研究が残した未解決問題を解いたとする。閉形式の密度展開との対数尤度の差が一様に無視できることを示す証明で、近似最尤推定が厳密な推定と同等になる条件も得る。"}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "LLMが自分の重みを書き換えて賢くなる", "title": "Language Models Can Rewrite Their Own Weights", "url": "https://arxiv.org/abs/2611.21885", "authors": "Jiajun Fan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "勾配も訓練も使わず、27Bのモデルが自分の重みと採点結果から失敗を診断し、原因となる重みを書き換える「自己書き換え」を示す。事前に固定した未見の490問で正答率が6.6ポイント上がり、自らのテストで裏づけた編集だけを提出して改善を重ねたと報告する。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "LLMリーダーボード首位の「勝者の呪い」を補正", "title": "SOTA or Luck? The Winner's Curse in LLM Leaderboards", "url": "https://arxiv.org/abs/2611.22227", "authors": "Sikun Xu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "雑音のあるベンチマーク得点で順位をつけると首位の性能が運によって過大になる偏りを定式化し、m-out-of-Nブートストラップで補正する。14のベンチマークで首位の補正は約0.09〜3.86ポイントで、SWE-bench Verifiedでは173モデル中13モデルが首位層に入るとする。"}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "戦争によるエネルギー高で低所得層の支出が不安定に", "title": "Wars, Energy Shocks and Household Finances: A Natural Experimental Investigation of Financial Vulnerability", "url": "https://doi.org/10.2139/ssrn.7696459", "authors": "Gbenga Ibikunle ほか", "venue": "SSRN", "date": "2026-11-17", "why": "英国大手銀行の約70万口座の取引データを使い、ロシアのウクライナ侵攻を外生的なショックとして所得水準が家計の脆弱性に与える因果的な調整効果を推定する。低所得者の月内の支出の変動が高所得者に比べて64.7%増えたなど、消費の平準化の制約が大きいことを示す。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "米中貿易戦争でAIに曝された職種の求人がより減少", "title": "Trade Shocks and Hiring Reallocation along a Technology-Related Task Margin Evidence from Chinese Online Vacancy Postings", "url": "https://doi.org/10.2139/ssrn.7719679", "authors": "Hongling Chen ほか", "venue": "SSRN", "date": "2026-11-17", "why": "約9億件の中国のオンライン求人と301条関税の業種別の曝露、AI職業曝露指数を使い、関税の影響が大きいほど求人が減り、AI曝露の高い職種でより大きく減ったことを示す。技術志向の貿易ショックが企業内の職種構成の再配分を通じて労働需要を変えることを明らかにする。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "短期の実験と長期の観察で長期の分位処置効果", "title": "Long-Term Quantile Treatment Effects with Combined Experimental and Observational Data", "url": "https://arxiv.org/abs/2611.22984", "authors": "Nan Liu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "短期の実験データに長期の観察データを組み合わせる設定で、長期の分位処置効果の曲線の識別、効率的影響関数、セミパラメトリック効率推定、分位全体での同時信頼帯を与える。平均だけでなく効果の分布の長期的な違いを推論できる。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "重なりの診断はDMLの識別を保証しない", "title": "Overlap Is Not Identification: Reactive Pricing, Exogenous Variation, and Double Machine Learning", "url": "https://doi.org/10.2139/ssrn.7697558", "authors": "Vikranth Reddy Moola ほか", "venue": "SSRN", "date": "2026-11-18", "why": "アルゴリズムで価格を決めるプラットフォームでは価格と結果が予測を通じて交絡し、二重機械学習で使われる重なり（overlap）の診断値が高くても推定が大きく偏りうることを示す。調整を細かくすると重なりが下がり推定値が動く場合に警告する診断を提案し、ライドシェアなどのデータで検証する。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "AIレビュアーで保守の負担はむしろ増える", "title": "Does the AI Reviewer Alleviate or Aggravate the Maintenance Burden? Evidence from GitHub Copilot Reviewer", "url": "https://arxiv.org/abs/2611.22793", "authors": "Feiyang (Amber) ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "GitHub Copilot Reviewerの導入を自然実験とし、AIによるコードレビューがOSSの保守者の負担と貢献行動をどう変えるかを分析する。導入直後にプルリクエストとレビューの負担が急増し、人の貢献は減る一方でボットの提出が続き、AIレビューは効率を上げても保守の負担を重くすると報告する。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "封印した検証データでAIアナリストの発見を認証", "title": "Refereeing the AI Agentic Analyst Community: Rolling Sealed Folds and Online e-values for False Discovery Control in Autonomous Data Analysis", "url": "https://doi.org/10.2139/ssrn.7700421", "authors": "John Christiansen", "venue": "SSRN", "date": "2026-11-18", "why": "自律的なAIアナリストが大量の仕様探索をする状況で、データを探索用と封印した部分に分け、e値で発見を逐次に認証する「ローリング・シール」を提案する。分析者の振る舞いや主張の順序・依存関係によらず、認証された発見の偽発見率を指定の水準以下に抑えることを証明する。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "LLMが重みを直接書いて実機のトラクタを操舵", "title": "Weight-space programming for tractor guidance controller: large language models natively write neural network weights that steer a real tractor", "url": "https://arxiv.org/abs/2611.21958", "authors": "Timo Oksanen", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "LLMが自然言語の仕様に従ってニューラルネットの重みを直接読み書きする「重み空間プログラミング」を、253パラメータの自動操舵ネットワークに適用する。別のトラクタ用の重みの修復とゼロからの書き込みを少ないシミュレーション評価で行い、進化戦略・勾配降下・純追従法とシミュレーションと実機で比べた。"}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "AI4Scienceのチームは知識の組合せの幅で差", "title": "Embedding or bridging? AI4Science teams differ more in knowledge recombination than in problem novelty", "url": "https://arxiv.org/abs/2611.22366", "authors": "Yun Fu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "1990〜2025年のAI4Science論文489,409本を所属に基づく7つの組織構成に分け、問題の新規性・知識の組合せの幅・掲載先・被引用を比べる。構成による差は問題の新規性では小さく知識の組合せの幅では大きく、部門をまたぐ橋渡し型ほど組合せが広いと報告する。"}, {"id": "pn13", "rank": 13, "field": "環境・気候政策", "headline": "2026年の世界のCO2排出は前年並みと日次推計", "title": "Projection of global daily CO2 emissions in 2026", "url": "https://arxiv.org/abs/2611.22406", "authors": "Tao Li ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "Carbon Monitorの日次推計（2019年〜2026年9月）とProphetによる年末までの予測を組み合わせ、2026年の世界の化石燃料・産業のCO2排出を38.1 Gt（前年比+0.10%）と見積もる。地域ごとの増減の約94%が相殺し合い、世界全体ではほぼ横ばいになるとする。"}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "LLMの気まぐれな拒否で利用者離脱を因果推定", "title": "RAW: Refusal Aversion in the Wild, A Causal Measurement Method for Deployed LLMs", "url": "https://arxiv.org/abs/2611.21641", "authors": "Pavel Kireyev", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "同じモデルが似たプロンプトに拒否したりしなかったりする確率的な揺らぎを自然実験とみなし、拒否が利用者の会話継続に与える因果効果を既存のログから推定する方法RAWを提案する。LMSYS-Chat-1MとWildChatの15モデルに適用し、約半数のモデルで効果を精密に推定できたとする。"}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "共変量の異質性で反実仮想の写像を識別・検定", "title": "Symmetries of Counterfactuals: Identification and Testability of Counterfactual Maps from Covariate Heterogeneity", "url": "https://arxiv.org/abs/2611.22948", "authors": "Marc Braun ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "反実仮想は一般にデータだけでは識別できないが、結果に潜在原因を通じてだけ影響する共変量があれば、データと整合する反実仮想写像の集合を対称性の群として特徴づけられることを示す。単調写像や最適輸送写像などの仮定はひとつの条件付き独立性と同値になり、仮定を検定できる。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "推論を増やしても買い物エージェントは賢くならない", "title": "Thinking Harder Doesn't Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents", "url": "https://arxiv.org/abs/2611.22033", "authors": "Adi Krishnamoorthy ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "10の最先端モデルを3つの商品選択ベンチマークで比べ、推論の努力を増やしても購入判断の質は統計的に改善しないことを示す。モデルが報告する確信度が誤りの可能性の目安になるかも検証し、LLMを買い物の代理人に使う際の問題を示す。"}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "正しいラベルでも付随する目印が挙動を支配", "title": "Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior", "url": "https://arxiv.org/abs/2611.04395", "authors": "Renee Jia ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "微調整データに正解を示すメタ情報（報酬スコアなど）があると、ラベルがすべて正しくてもモデルがそれに依存することを示す。テスト時にその目印を誤答の選択肢に移すとCommonsenseQAで97〜100%その選択肢を選び、目印を除いた評価では依存が見えないと報告する。"}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "国産チップで開発した大規模モデルXing 4", "title": "TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "url": "https://arxiv.org/abs/2611.22115", "authors": "Xingchen AGI Lab ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "why": "TeleChatの系譜を継ぐXing 4シリーズについて、Ascendチップ上でのアーキテクチャ選択、大規模事前学習、推論とエージェントの事後学習の設計と計算基盤を報告する。スパース活性化・注意機構・深さと幅・投機的デコーディングの得失を、計算量とメモリアクセスの観点から整理する。"}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "重みを手で書くならTransformerは要らない", "title": "Weight-Space Programming Doesn't Need Transformers", "url": "https://arxiv.org/abs/2611.22055", "authors": "Hyunjong Ok ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "why": "LLMが勾配を使わずに重みを書く設定ではTransformerを使う理由がなくなると指摘し、3つのLLMに重みの生成とアーキテクチャの設計を任せる。自由に設計させると事実を疎な表と固定手順に編み込み、同じLLMが書いた最良のTransformerより約1,800分の1のパラメータで高い正答率を得たとする。"}, {"id": "pn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "LLMのチームは裏切る仲間をどう見抜くか", "title": "Bad Apples in the Kitchen: How LLM Teams Detect, Correct, and Calibrate Against Their Misaligned Members", "url": "https://arxiv.org/abs/2611.22342", "authors": "Dongseok Heo ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "4人で調理するOvercookedの環境に、発言と行動のずれ・役割侵犯・全体進捗の妨害の3種の不整合なエージェントを入れ、720回の試行で検知・修正・較正の3段階に分けて頑健性を調べる。ほぼすべての妨害者は最終的に名指しされるが、回復は原因の帰属と状況の診断がそろったときに限られると報告する。"}, {"id": "pn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "現金を多く持つ企業ほど職場の多様性を推進", "title": "The Bright Side of Cash Holdings: Evidence from Workplace Diversity and Inclusion", "url": "https://doi.org/10.2139/ssrn.7698178", "authors": "Md Safiullah ほか", "venue": "SSRN", "date": "2026-11-18", "why": "15,205の企業・年のパネルで、現金保有の多い企業ほど職場の多様性と包摂を推進することを示し、操作変数法と傾向スコアで内生性に対処する。昇進機会・柔軟な働き方・包摂的な採用が経路で、包摂を進める現金保有企業では企業価値との関係もみられたとする。"}, {"id": "pn22", "rank": 22, "field": "組織行動・心理的安全性", "headline": "能動的AIの「見る」と「口を出す」を分けて制御", "title": "Controlling Proactive Multimodal AI: Separating Perception from Participation", "url": "https://arxiv.org/abs/2611.22431", "authors": "Muawiz Feroze Khan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "画面・音声・操作を感知して作業に入るかを決める能動的なAIについて、何を知覚してよいかとどこまで参加してよいかを利用者が別々に設定できる試作を作り、16人の研究で検証する。利用者は知覚の経路を残したまま参加を質問や沈黙に下げることができたと報告する。"}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "アルゴリズム選択の競争は競争価格を保証しない", "title": "Algorithmic Pricing under Strategic Delegation", "url": "https://doi.org/10.2139/ssrn.7697359", "authors": "Zhengge Zhou ほか", "venue": "SSRN", "date": "2026-11-17", "why": "マーケットメーカーが学習アルゴリズム（基本のQ学習か、追加の市場データを要する反実仮想Q学習）を選ぶゲームを分析し、データが十分安くないと互いに基本型を選ぶ均衡になり、競争的な価格が実現しないことを示す。報酬を歪めたアルゴリズムへの委任は市場の質をさらに悪くしうる。"}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "プラットフォーム競争が差分プライバシー基準を変える", "title": "How Platform Competition Shapes Differential Privacy Standards", "url": "https://doi.org/10.2139/ssrn.7695760", "authors": "Zhe Chen ほか", "venue": "SSRN", "date": "2026-11-18", "why": "プラットフォームが監査可能なプライバシー予算を選んでから価格競争する複占モデルで、均衡の予算が厚生上の基準を上回りうることを示し、予算の上限規制と精度の上限規制を比べる。競争の強さによって望ましい規制の形が入れ替わりうるとする。"}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "あえて好みでない商品を見せると消費者が得をする", "title": "How to Mismatch Consumers", "url": "https://doi.org/10.2139/ssrn.7696198", "authors": "Wenhao Li", "venue": "SSRN", "date": "2026-11-17", "why": "プラットフォームが一部の消費者に好みの劣る商品だけを見せる「ミスマッチ」が、価格を下げさせることで消費者余剰の合計を高めうることを独占と複占で示す。一様分布の例では全員に最適な商品を見せる場合より消費者余剰が約41%高くなる。"}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "開示義務がかかる階層で報告の中身が変わる", "title": "Where Disclosure Binds: Entity-Level Obligations and Product-Level Reporting", "url": "https://doi.org/10.2139/ssrn.7720801", "authors": "Franco Fiore ほか", "venue": "SSRN", "date": "2026-11-18", "why": "EUの持続可能な金融開示規則（SFDR）は運用会社単位では主要な悪影響（PAI）の定量開示を求めるが、ファンド単位では原則任意である。14,215のUCITSファンドの17指標で、対象の運用会社のファンドほど定量開示は多いが網羅性は低いことを示し、保有から再構成した指標とも比べる。"}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "美容師免許の訓練時間が開業を減らすか", "title": "Occupational Licensing and Entrepreneurship: Do Higher Entry Barriers Reduce Business Formation in Cosmetology?", "url": "https://doi.org/10.2139/ssrn.7702478", "authors": "Ethan Youn", "venue": "SSRN", "date": "2026-11-18", "why": "2017年に州ごとに1,000〜2,300時間と異なる美容師免許の訓練要件と、従業員のいない事業も含む美容院の数を組み合わせて分析する。州間の関係は地域間の違いによるもので、同じ地域内の比較では消えることを示し、要件を変えた州の事例も追う。"}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "住居費の差が米国のインフレ格差を生む", "title": "Housing and Inflation Inequality in the United States", "url": "https://doi.org/10.2139/ssrn.7697858", "authors": "Zong Huang", "venue": "SSRN", "date": "2026-11-17", "why": "American Community Surveyで家賃指数を作りCPIとよく一致することを示したうえで、世帯の属性ごとの住居費のインフレを推計する。2006〜2019年の住居費のインフレは非白人の世帯で5.5ポイント高く、学歴では差がなかったとし、空間均衡モデルで説明する。"}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "有給育休の拡充で従業員の離職が減る", "title": "Bucks for Bumps: How Paid Parental Leave Pays Off for Firms", "url": "https://doi.org/10.31235/osf.io/qb5pa", "authors": "Hillary Cookler", "venue": "SocArXiv", "date": "2026-11-17", "why": "手作業で集めた企業の育休制度の変更のデータで、有給育休の拡充が従業員の定着に与える因果効果を差の差法で推定する。拡充で離職率が3.0%下がり、これは1.4%以上の恒久的な賃上げに相当するとし、効果の経路が労働者によって異なることを論じる。"}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "独サプライチェーン法に株式市場は負の反応", "title": "Much Ado About Due Diligence? Capital Market Reactions to the German Supply Chain Act", "url": "https://doi.org/10.2139/ssrn.7695584", "authors": "Karolin Schulte ほか", "venue": "SSRN", "date": "2026-11-17", "why": "ドイツのサプライチェーン・デューデリジェンス法の立法の節目での異常リターンを調べ、対象企業の株価が下がり、規模の小さい企業と早く対象になる企業ほど下落が大きいことを示す。持続可能性の責任を課す規制の遵守費用を市場が織り込むことを明らかにする。"}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "米国の関税ショックは金融ショックとして波及", "title": "Tariffs as Financial Shocks: Trade Policy Persistence and the Global Financial Cycle", "url": "https://doi.org/10.2139/ssrn.7700659", "authors": "Marcelo Silva", "venue": "SSRN", "date": "2026-11-17", "why": "ベイズ状態空間モデルで米国の関税率を一時的・恒久的な成分に分けて識別したショックを、合成した世界の金融環境指数と42か国の資本移動に追跡する。関税の引き上げで市場のボラティリティやドル高、新興国のソブリン・スプレッドなど世界の金融環境が引き締まることを示す。"}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "記憶の長さが違う因子をもつ因子モデルの推定", "title": "Estimation and Model Selection in Factor Models with Long Memory", "url": "https://arxiv.org/abs/2611.22289", "authors": "Dominik Ammon ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "記憶の長さ（分数和分の次数）が未知で異なる共通因子をもつ近似因子モデルについて、水準のパネルに主成分分析を使う漸近理論を与える。標本共分散の固有値が記憶の長さで順序づけられることを使い、因子群の一致推定と分離を示す。"}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "スケール不変性から頑健に有効な信頼集合", "title": "COSI: A Framework for Robustly Valid Inference", "url": "https://arxiv.org/abs/2611.22096", "authors": "Arun K. Kuchibhotla ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "分割した標本ごとの推定値を使うHulCを発展させ、多くの推定量が持つスケール不変性の検定を通る値を集めて信頼集合を作るCOSIを提案する。古典的なWald法やブートストラップより弱い仮定で漸近的に有効で、小標本で名目水準に近い被覆を得られるとする。"}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "オンライン共形予測で外れ回数を守る代償", "title": "The Price of Hard Coverage Constraints in Online Conformal Prediction", "url": "https://arxiv.org/abs/2611.22646", "authors": "Mingrui Liu", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "逐次の共形予測で、累積の外れ回数を常に予算内に収める厳しい被覆保証を課すときに、予測集合をどれだけ広げる必要があるかという避けられない効率の代償をT回の予測について特徴づける。独立同分布でスコアの分布が既知でもこの代償が残ることを示す。"}, {"id": "pn35", "rank": 35, "field": "統計学", "headline": "潜在分布が柔軟だと潜在変数モデルは識別できない", "title": "Identifiability of latent variable models with flexible latent distributions", "url": "https://arxiv.org/abs/2611.23052", "authors": "Chengyu Cui ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "潜在分布を自由に学習する潜在変数モデルでは、厳密な識別可能性がほとんどいたるところで成り立たず、異なるが任意に近いパラメータと潜在分布の組が同じ観測分布を生むことを示す。柔軟な潜在構造を使うモデルの解釈に注意を促す。"}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "小地域ごとの因果効果を経験最良予測で推定", "title": "Small Area Causal Inference", "url": "https://arxiv.org/abs/2611.22339", "authors": "Yilin Li ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "二重頑健推定ではなく経験最良予測（EBP）に基づいて、小地域ごとの因果効果を予測する枠組みを開発する。線形混合モデルの下で最尤推定の一致性と漸近正規性、地域別の因果効果の予測の平均二乗予測誤差の最小化を示す。"}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "高次元時系列の分布の変化点を計算制約下で検出", "title": "Distributional change point analysis: high dimensionality, nonstationary dependence, and computational constraints", "url": "https://arxiv.org/abs/2611.22422", "authors": "Leheng Cai ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "非定常な時間依存をもつ高次元時系列で、特性関数に基づく疎なランダム射影により雑音の蓄積と計算量を抑えて分布の変化点を検出する。射影の必要数が次元の多項式で増えることを示し、ガウス乗数ブートストラップで誤検出の制御を保証する。"}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "欠測のMAR仮定を因果の経路で特徴づける", "title": "A mechanistic characterization of missingness at random", "url": "https://arxiv.org/abs/2611.22022", "authors": "Maya B. Mathur ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "欠測が無作為（MAR）という抽象的な独立性の仮定を、変数が欠測すると一部の矢印が働かなくなるよう修正したDAGの経路の条件で特徴づける。実務家が欠測の発生メカニズムから仮定の妥当性を判断できるようにする。"}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "NZの農業補助金撤廃は生産性を上げたか", "title": "Causal effects of liberalization on agriculture in New Zealand", "url": "https://doi.org/10.2139/ssrn.7700061", "authors": "Vicente Moreno Casas", "venue": "SSRN", "date": "2026-11-17", "why": "農業自由化の代表例とされる1984年のニュージーランドの農業支援の撤廃を、改革しなかった10か国による合成コントロールで評価する。農業の全要素生産性への効果は検出されず、生産の構成の組み替えが起きたとし、通説の前後比較による解釈を見直す。"}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "視覚と言語を混ぜる時期のスケーリング則", "title": "Scaling Laws for Vision-Language Fusion", "url": "https://arxiv.org/abs/2611.22351", "authors": "Seng Pei Liew ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "言語モデルに後から画像を学ばせる後期融合と、事前学習の最初から混ぜる早期融合の得失を、学習の動きの分析から整理する。融合時の検証損失を基本の学習軌道とそこからのずれに分けてモデル化し、高価で経験則に頼っていた学習手順の設計に指針を与える。"}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "LLMの推論でMCTSは数えるものを間違えている", "title": "MCTS Is Counting the Wrong Thing: Learning Exploration Counts for LLM Reasoning", "url": "https://arxiv.org/abs/2611.22301", "authors": "Xuan Zhang ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "LLM推論でのモンテカルロ木探索は、同じ推論戦略の言い換えに別々の訪問回数を与えて探索ボーナスを重複させることを指摘し、この断片化が後悔を増やすことを理論的に示す。方策の隠れ表現から擬似的な訪問回数を学習するLPC-MCTSを提案する。"}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "画像群から4次元の形状と運動を復元する基盤モデル", "title": "π^4: A Foundation Model for 4D Scene Geometry and Motion", "url": "https://arxiv.org/abs/2611.23144", "authors": "Yifan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "why": "1枚の画像・順不同の画像群・動画から、密な形状、カメラ姿勢、実寸のスケール、2D・3Dの点の追跡と動く物体のマスクを一つのモデルで推定する。形状の評価で総合的に最もよい平均順位を得たと報告する。"}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "光で形状記憶ポリマーの振動特性を時空間に制御", "title": "Spatiotemporal programming of shape memory polymers for tunable vibration responses", "url": "https://arxiv.org/abs/2611.21930", "authors": "Samantha Averitt ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "why": "炭素を混ぜた形状記憶ポリマーの表面に光のパターンを投影して温度分布を作り、弾性波の伝わり方と振動モードを空間と時間の両方で書き換えられるメタマテリアルを示す。透過スペクトルや振動モードを再構成できる適応的な構造の設計の幅を広げる。"}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "浮体式洋上風車の船体形状を連成時刻歴で設計", "title": "Nonlinear Coupled Time-Domain Modeling of Hull Geometry Effects for Improved Dynamic Response of Floating Wind Platforms", "url": "https://doi.org/10.21203/rs.3.rs-11457709/v1", "authors": "Mohammad Javad Eslahi ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "why": "空力・流体力・制御・構造の動力学を一体で解く時刻歴の連成解析に、非線形の波の運動学と粘性減衰を入れ、浮体式洋上風車のセミサブ型浮体の柱寸法とヒーブプレートを遺伝的アルゴリズムで探索する。線形・分離した解析が見落とす二次の漂流力や過渡応答を考慮した設計を示す。"}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "二次経路補償で薄肉部品の切削びびりを抑制", "title": "Secondary-Path-Compensated FxLMS Active Control of Milling Chatter in Thin-Walled Workpieces", "url": "https://doi.org/10.21203/rs.3.rs-10982997/v1", "authors": "Zicheng Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "why": "圧電アクチュエータで薄肉部品のびびり振動を能動制御する際、制御出力が計測点に届くまでの二次経路の利得・位相・遅れが更新方向を偏らせる問題に、等価な制御力-加速度モデルで参照信号を前処理するFxLMS法で対処する。アルミ板の実験で実装する。"}, {"id": "pn46", "rank": 46, "field": "工学", "headline": "崩壊時の強度で設計する耐震設計の考え方", "title": "The Philosophy of Collapse-Based Design of Structures: A Modern and Unified Framework for Seismic Practices", "url": "https://doi.org/10.2139/ssrn.7702200", "a year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "米国の労働者の月給は大きく揺れている", "title": "Earnings Instability", "url": "https://doi.org/10.1093/qje/qjag059", "authors": "Peter Ganong ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-17", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "高頻度の行政データで、米国の多くの労働者は同じ雇用関係の中でも月ごとの給与が大きく変動し、年次データではそれが隠れることを示す。不安定さは低所得で時給制の労働者に偏り、企業による労働時間の変動が大きな割合を占め、支出の変動と離職を増やすとする。"}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "選考の偏りを数字で示すだけで多様性が増える", "title": "Does Feedback Enhance Diversity in Selection Decisions?", "url": "https://doi.org/10.1287/mnsc.2025.01479", "authors": "Jose A. Cervantez ほか", "venue": "Management Science", "date": "2026-11-17", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "過去の選考で女性や人種的少数者が少なかったことを示すだけの記述的なフィードバックが、偏見なく振る舞おうとする動機を引き起こし、その後の選考で少数者を選ぶ割合を高めることを、計6,502人の7つの事前登録実験で示す。偏見と結びつかない属性のフィードバックでは効果が小さい。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "熱帯低気圧が各国の債務比率を押し上げてきた", "title": "The debt burden of tropical cyclones and climate change", "url": "https://doi.org/10.1073/pnas.2603924123", "authors": "June Choi ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-17", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "熱帯低気圧に曝される国々では1980〜2019年の債務対GDP比の平均20%が熱帯低気圧に帰せられ、自然の熱帯低気圧と人為的温暖化の影響を合わせるとGDP水準が平均12%低いと推定する。気候変動が資金調達の障壁を高め適応への投資を妨げる悪循環の証拠を示す。"}, {"id": "jn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "権限のない社員が組織の不正を常態化させる過程", "title": "Influence Without Authority: Bottom-Up Normalization of Organizational Corruption", "url": "https://doi.org/10.1287/orsc.2023.18274", "authors": "Patricia Helena Hein ほか", "venue": "Organization Science", "date": "2026-11-18", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "組織の不正の常態化は経営主導で進むとされてきたが、ドイツの人材紹介会社のコロナ禍での実務の質的研究から、正式な権限の弱い社員が許容された規則の曲げで影響力を築き、混乱の中で不正を拡大         ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
