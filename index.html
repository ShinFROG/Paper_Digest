<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </footer>
</div>

題（表3）の数値は読んでいない。"}}, {"id": "pr02", "rank": 2, "headline": "LLMマルチエージェントで橋梁維持管理を支援", "title": "Multi-Modal Multi-Agent System for Bridge Operation and Maintenance based on Large Language Model", "url": "https://arxiv.org/abs/2611.02738", "authors": "Xiangyun Luo ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Luo, X., Zhang, Y., Huang, Y., Wu, S., & Li, H. (2026). Multi-Modal Multi-Agent System for Bridge Operation and Maintenance based on Large Language Model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02738", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（評価の設定、結果の考察、結論の節と表・図のキャプション）を読んだ", "preprint": true, "p1": "橋梁の維持管理で、物理・力学に基づく診断行動、長期記憶、専門家の知識グラフをLLMのマルチエージェントで束ね、自然言語の指示から診断の手順を組み立てる系（BOMMA）を作った（抄録、§4）。", "p2": "橋梁の維持管理では、異種のデータ・手法・モデルを統合する仕組みがなく、モデルの推論が物理・力学の法則と結びつかず、専門家の暗黙知を形式化しにくい（抄録、§4）。", "p3": "入力は利用者の自然言語の指示（映像や時系列信号を伴う）、出力は診断行動の呼び出し計画と結果。各行動を物理・力学の原理・扱うモダリティ・主要パラメータで記述した「行動空間」で指示を解釈・分解し、複数のエージェントが並列実行と振り返りを行い、長期記憶が手順や文脈を保つ。例：「この測点の振動が基準から持続的に外れているか」という指示を、該当センサの時系列解析の行動に割り当てる（§2、表3）。", "p4": "橋梁の維持管理の指示3,492件（単一行動の簡単な指示2,460件、2〜5行動を直列・並列で組む複合指示1,032件）を、理解度の異なる4種の利用者から集め、行動の呼び出しの再現率、複合指示の精度、行動推論のBERT F1、人の介入の頻度で評価し、記憶・マルチエージェント・推論能力のアブレーションを行った（§3、表4）。", "p5": "呼び出しの再現率は簡単な指示で85.37%、複合指示で99.40%、行動推論のBERT F1は95.35%だった（抄録）。機能の境界が明確な行動（VIS、KMD）はほぼ完全だったが、行動名が原理を直感的に表さない行動（VEH、STG）は再現率が低く、事前知識のない利用者の指示ではほとんど呼び出されなかった（§3、表5）。", "p6": "著者は、行動名と物理・力学の原理の意味的なつながりの弱さが誤りの原因だと認め、情報が足りないときは利用者に介入を求める仕組みで幻覚を抑えるとする（§3、§4）。解釈：評価は指示の解釈・割り当ての正しさが中心で、実橋の損傷検出の精度そのものは検証の対象外。", "fun": "橋の点検には、カメラの映像、振動の記録、過去の補修の記録など、ばらばらの道具と知識が必要です。この研究は、AIの「秘書」たちに役割分担させ、「この橋の揺れ方は大丈夫？」という普通の言葉の質問を、どの道具をどの順で使うかの段取りに変えさせました。分からないときは自分から人に聞き返す仕組みも入っているのが実務的です。", "unverified": "アブレーションの各条件の数値（図2・図3）は読んでいない。BOMMAの基盤LLMの名称は未確認。"}}, {"id": "pr03", "rank": 3, "headline": "LLM合成調査サンプルを用途別に検証する枠組み", "title": "Validating LLM-Generated Synthetic Survey Samples: A Use-Dependent Multi-Dimensional Framework for Social-Science Applications", "url": "https://arxiv.org/abs/2611.00256", "authors": "Enrico Angelo Raffaele D'Ecclesiis ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "D'Ecclesiis, E. A. R., Castellacci, F., & Ahmadi, A. (2026). Validating LLM-Generated Synthetic Survey Samples: A Use-Dependent Multi-Dimensional Framework for Social-Science Applications (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00256", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（検証の枠組み§3、データと生成§4、予測的妥当性の結果§5.1と表2、考察§6、付録C.3）を読んだ", "preprint": true, "p1": "LLMで作った合成の調査標本を、用途に応じて予測的・分布的・実質的の3つの妥当性で評価する枠組みを示し、同じ標本でも次元ごとに評価が分かれることを実データで確かめた（§3、§6）。", "p2": "合成回答者（silicon sample）は、個人の予測誤差など1つの一致度で評価されがちで、社会科学の用途に要る分布や集団間の構造の再現を見落とす（§1、§2）。", "p3": "入力は回答者のプロフィールと質問文、出力は生成された回答。予測的妥当性（個人単位のMSE・相関）、分布的妥当性（周辺分布の平均と散らばり、形）、実質的妥当性（年齢・学歴・国による差と予測変数の構造）を分け、目的変数で直接学習した教師あり機械学習を「上限の参照」として並べる。例：AIへの態度の指標（1〜4点）を、年齢・学歴・国などから4つのLLMに予測させる（§3、§4.2）。", "p4": "2024年のユーロバロメーター554（EU27か国）の18〜65歳で、一般・効果・利用の3指標（一般は11,114人、効果・利用は12,843人）を対象に、Claude Sonnet 4.6、GPT-4.1 mini、Gemini、Grokの生成をElastic Net、ランダムフォレスト、HGB、Super Learnerと比べた（§4.1、付録C.3）。", "p5": "一般指標の個人単位の相関はLLMで0.372〜0.403、教師あり学習で0.477〜0.517と、LLMは予測で劣った（表2）。一方で教師あり学習は予測が平均に縮むのに対し、一部のLLMは観測の散らばりをよく保ち、一般・効果の指標では年齢・学歴の順序や国の差、予測変数の構造の多くを再現した（§5.2〜5.3、§6）。", "p6": "対象は1つの調査・1つの話題（AIへの態度）に限られ、具体的な職場への応用（利用指標）では再現が弱いなどの範囲の条件を著者が認める（§6）。解釈：生成の温度やプロンプトへの頑健性は付録で扱われているが、別の話題・国への一般化は未検証。", "fun": "アンケートの代わりにAIに「この人ならどう答えるか」を想像させる研究が増えています。この論文は、AIの答えを一つの点数で良し悪しを決めるのはおかしい、と指摘します。一人ひとりの予想は外れても、「若い人ほどAIに好意的」といった全体の傾向は再現できることがあるからです。何に使うかで合格ラインが変わる、という考え方が大切です。", "unverified": "効果・利用指標の表2の数値と、分布的妥当性の具体的な指標値は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "決定的LLM熟議の分岐点を低マージンで捉える", "title": "Low-Margin Branch Points in Deterministic LLM Deliberatio", "url": "https://arxiv.org/abs/2611.00546", "authors": "Hajime Shimao ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Shimao, H., & Khern-am-nua, W. (2026). Low-Margin Branch Points in Deterministic LLM Deliberatio (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00546", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設定、結果の各節、頑健性の確認、考察と限界）を読んだ", "preprint": true, "p1": "決定的（貪欲デコード）なLLMの5体委員会の熟議で、最上位と次点のトークンの差が小さい位置に内部の小さな摂動を入れると発言が分岐し、ときに最終決定まで変わることを、白箱の監査で示した（抄録、結果）。", "p2": "決定的な熟議は同じ記録を完全に再現できるが、再現できることと、内部状態の小さな変化に対して局所的に安定であることは別の性質で、後者はこれまで検証されていない（序論）。", "p3": "入力は5体のエージェントが3つの医療財政案を20ラウンド議論する委員会（Qwen2.5-7B-Instruct、貪欲デコード）。まず介入なしの再構成がトークン単位で完全一致することを確かめ、第27層の残差にノルム比εの変位を1回だけ注入し、その後10トークン以内に最初の分岐が出るかを測る。位置は最上位-次点のロジット差（マージン）の小さい・大きい所を事前に選び、マージンを減らす/増やす勾配方向も比べる（実験設定）。", "p4": "分岐率を低マージンと高マージンの位置で比べ、マージン勾配の符号で比べ、実現した分岐を最終決定まで継続して、文の違い・選好の変化・決定の変化を区別した。内容語の位置、別の5つの政策シナリオ、3Bモデル、中立ラベルで頑健性を確かめた（実験設定、頑健性）。", "p5": "介入なしの再現は1,280行すべてで一致した。低マージンでは5,120行中604行（11.8%）が分岐し、高マージンでは2,560行中0行だった（図2）。マージンを減らす方向は360行の0.433で分岐した（図4）。低マージンの分岐を継続した15件はすべて文の違いが続き、4件で選好か決定が変わり、3件で最終決定が変わった（図5）。別シナリオでも低マージン14.9%対高マージン0.16%だった（頑健性）。", "p6": "著者は、摂動は感受性を調べる統制した負荷試験で、実運用での頻度や決定の正しさの推定ではなく、多エージェント系に固有の現象とも主張しないと明記している（抄録）。解釈：検証は7Bと3Bのモデルと1つの委員会の形式に限られ、大型モデルでの再現は残る。", "fun": "5人のAIが会議をして、毎回まったく同じ結論が出るなら安心に見えます。でも、ある一語で「AかBか」がぎりぎりで決まっていた場所を、ほんの少しつつくと、そこから話がずれ、まれに結論まで変わりました。同じ結果を繰り返せることと、ちょっとした揺れに強いことは別だ、ということを、AIの頭の中に手を入れて確かめた実験です。", "unverified": "マージンを増やす方向の分岐率の数値は抄録・本文の切れ目で未確認。"}}, {"id": "pr05", "rank": 5, "headline": "分布外の人間行動を再現するLLM行動プロファイル", "title": "Designing Behavioral Profiles for Language Model Simulation of Out-of-Distribution Human Behavior", "url": "https://arxiv.org/abs/2611.00661", "authors": "Robin Na ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Na, R., Zhu, K., Cross, L., & Bakker, M. A. (2026). Designing Behavioral Profiles for Language Model Simulation of Out-of-Distribution Human Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00661", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法とデータ§3、結果§4.2、範囲と限界§5.4、図1・図2のキャプション）を読んだ", "preprint": true, "p1": "人の行動記録から抽出した少数の行動特徴（例：仲間の悪い行動の後に手を引く傾向）をLLMに与えると、ルールの違う新しい実験での人の行動分布をよく再現できることを示した（§4.2）。", "p2": "LLMで人の行動を模擬する研究は、人口統計のペルソナや汎用の人物記述に頼りがちで、学習に使っていない新しい実験設計（分布外）でどの情報が役に立つかが分かっていない（§1、§2）。", "p3": "3段階の枠組み：(1)文献から候補の行動特徴と採点規則を定め、行動記録から根拠つきの行動プロファイルを抽出、(2)学習データの別の部分の人の結果と照らして、どの特徴を入れるかを選ぶ、(3)新しい参加者・新しい設計で検証する。例：公共財ゲームでは「仲間が協力しなかった後の撤退」という1つの特徴だけを持つプロファイルをLLMに与える（§3.1、§3.3〜3.5）。", "p4": "公共財ゲーム、多者間交渉、一般化11-20ゲームの3種の報酬つき実験で、新しい設計の人の結果分布との一致を「正規化した分布の一致度」（0は情報なしの基準、100は人のデータどうしの一致）で測り、プロファイルなし、全特徴、汎用ペルソナ3種（Nemotron、Twin-2K-500、ANES）と比べた（§4.2、図2）。", "p5": "公共財ゲームの250の検証ゲームで、1特徴のプロファイルは65.5（95%区間37.6〜68.1）、プロファイルなしは−1.0、汎用ペルソナは18.6、−1.5、−8.7だった。全特徴（62.5）や2特徴（59.0）との差ははっきりしなかった。多者間交渉では1特徴77.5、プロファイルなし40.5、全20特徴53.1だった（§4.2）。", "p6": "著者は、多くの特徴に人の独立した基準がなく構成概念妥当性は確立していないこと、行動記録そのものをプロンプトに入れる場合とは比べていないこと、評価は集団の分布で、誰がどう行動するかは識別しないことを認めている（§5.4）。", "fun": "AIに人のまねをさせるとき、「30代、会社員、東京在住」といった肩書きを与えるより、「仲間が裏切ったら自分も手を引く人」という一つの行動のくせを与えるほうが、実際の人の行動にずっと近づきました。しかも、くせを増やしてもほとんど良くならない。人を表すのに必要な情報は、思ったより少なくて済むのかもしれません。", "unverified": "一般化11-20ゲームの結果と、族をまたぐ転移の数値（§4.4）は読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "職場の出来事への感情反応の非線形な閾値", "title": "Whether and How Much: Nonlinear Thresholds in Discrete Emotional Responses to Workplace Events", "url": "https://doi.org/10.21203/rs.3.rs-11595069/v1", "authors": "José Navarro ほか", "venue": "Research Square (In Review)", "date": "2026-11-03", "apa": "Navarro, J., Tellería, V., & Rueff-Lopes, R. (2026). Whether and How Much: Nonlinear Thresholds in Discrete Emotional Responses to Workplace Events. https://doi.org/10.21203/rs.3.rs-11595069/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（参加者・手順・分析、考察の「Whether」「How Much」、限界の節）を読んだ", "preprint": true, "p1": "職場の出来事に対する個別の感情は、強さが連続的に変わる非線形の反応で、強さが二つの状態の間で跳ぶ「双安定」の証拠はないことを日記データで示した（考察）。", "p2": "評価理論は感情が出来事の評価の閾値を越えると生じると考え、カタストロフィ理論系の分岐モデルは強さの急な跳びを予測するが、「生じるか」と「どれだけか」を分けて人ごとの基準で検証した研究は少ない（序論）。", "p3": "入力は前日の目立った出来事の快・不快（valence）と強さ（strength）の評価、出力は怒り・嫌悪・喜び・悲しみ・驚き・恐れの有無と強さ。評価は各人の平均と標準偏差で中心化し（いつもより良いか悪いか）、一般化加法モデル（GAM：曲線の形をデータから学ぶ回帰）と、Cobbの確率的カスプ模型（双安定の検出）を当てはめた。例：喜びが「いつもより少し良い」出来事で急に生じるかを見る（データ分析）。", "p4": "多様な業種の従業員100人の日再構成法による1,479件の日次記録（1人平均14.79件）で、線形モデル、GAM、カスプ模型を比べた。p値はHolmで調整（参加者、データ分析）。", "p5": "喜びの生起確率は、はっきり悪い出来事の約.20から、いつもより少し良い出来事でほぼ確実へと急に上がり、嫌悪は普段よりかなり悪いときにだけ生じた。怒りの強さは悪化側だけで強まり、喜びは改善側だけで急に強まる非対称を示した。生起の説明分散の39〜62%は個人のランダム切片による（考察）。", "p6": "著者は、雪だるま式の非確率標本、翌日の想起で弱い出来事が少ないこと、事前登録がなく探索的な検定を含むこと、Cobbのモデルが静的で履歴（ヒステリシス）を扱えないことを限界に挙げる（限界）。", "fun": "「ちょっといいこと」があると、人は急にうれしくなります。逆に嫌悪は、よほど悪いことがないと起きません。この研究は、感情のスイッチの入り方が、出来事の「強さ」より「いつもより良いか悪いか」で決まることを、100人の仕事日記から見つけました。感情が二つの状態の間でパチンと切り替わるという説は支持されませんでした。", "unverified": "モデル比較の適合度の数値は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "AIで口コミ返信が安くなると個別対応の信号価値が下がる", "title": "Accommodation Made Cheap: AI Impacts on Replies to Online Reviews and the Signal Value of Tailoring", "url": "https://doi.org/10.31235/osf.io/shj9p", "authors": "Chao Yu ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Yu, C., Liao, W., & Feng, X. (2026). Accommodation Made Cheap: AI Impacts on Replies to Online Reviews and the Signal Value of Tailoring. https://doi.org/10.31235/osf.io/shj9p", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "OSF版のPDF本文（拡張抄録の暫定結果。データ・指標・分析の節と抄録の結果）を読んだ", "preprint": true, "p1": "ChatGPTの登場後、レストランの口コミへの返信はAIで書かれる割合が増え、口コミに合わせた「個別対応」が増えた一方、個別対応がその後の口コミ数を増やす効果は2023年以降見られなくなったことを示した（抄録）。", "p2": "相手に合わせた返信は手間がかかり、その手間自体が誠意の信号になっていた。AIで手間が下がると、個別対応の形と信号の価値がどう変わるかは分かっていない（序論）。", "p3": "入力は口コミと返信の文、出力はAI執筆の推定割合、個別対応度（tailoring）、類似度、その後1年の口コミ数。AI執筆の割合は、人の文とAIの文の参照集合のどの混合が3,000の頻出語の頻度に最も合うかで推定する（Liangら2024の方法）。例：「delighted」はAIの返信の約3件に1件、人の返信では約40件に1件に現れる。個別対応度は、返信と答えた口コミの類似度から、同じ店の他の口コミとの平均類似度を引いたもの（データ、指標）。", "p4": "OpenTableの米国6都市圏の口コミ8,905,449件と返信487,906件（2019〜2025年に3,940店が391,430件返信）で、2023年1月1日を境とする中断時系列の区分回帰と、店舗・期間の固定効果モデルを都市ごとに推定して逆分散で統合した（データ、分析）。", "p5": "返信のAI執筆の推定割合は2026年半ばに44%、口コミは1.2%だった。返信は答える口コミにより合わせたものになり、特にAIが返信の半分以上を書いたとみられる四半期で強かった。返信は店の間では似通い、店の中では似なくなった。2023年より前は個別対応の強い返信の後に口コミが増えたが、2023年以降はそうでなくなった（抄録）。", "p6": "著者は、拡張抄録の暫定結果で査読前であること、効果の低下をまだAI執筆に帰属できないこと、短い文ではAI検出が弱いため推定は下限であることを明記している（本文冒頭、指標）。", "fun": "お店が口コミに一つずつ丁寧に返事を書くのは大変です。だからこそ、丁寧な返事は「この店はお客を大事にしている」という合図になっていました。AIなら一瞬で丁寧な返事が書けます。すると返事は丁寧になったのに、それを見て客が増える効果は消えました。手間がかからなくなると、手間が伝えていた意味まで薄れる、という皮肉な発見です。", "unverified": "本文の結果節（係数と信頼区間）は暫定版のため一部しか読んでいない。"}}, {"id": "pr08", "rank": 8, "headline": "孤独と客観的孤立が抑うつ遷移に与える影響", "title": "Loneliness and objective social isolation in observed depressive symptom transitions across six ageing cohorts", "url": "https://doi.org/10.21203/rs.3.rs-11280260/v1", "authors": "Lin Guo ほか", "venue": "Research Square (In Review)", "date": "2026-11-03", "apa": "Guo, L., Yue, J., Li, S., & Liu, Y. (2026). Loneliness and objective social isolation in observed depressive symptom transitions across six ageing cohorts. https://doi.org/10.21203/rs.3.rs-11280260/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（方法§2.2〜2.6、対象集団§3.1、限界と結論）と抄録の推定値を読んだ", "preprint": true, "p1": "6つの高齢者コホートで、主観的な孤独は抑うつ状態への移行を増やし回復を減らすが、客観的な社会的孤立の指標はほとんど関連しないことを示した（抄録）。", "p2": "孤独（つながりが足りないと感じること）と客観的孤立（一人暮らしなど）は区別されるが、抑うつ症状の「始まり」と「回復」という向きの違う移行との関連を、多国のコホートで同じ方法で比べた研究は少ない（背景）。", "p3": "入力は前の調査時点の孤独（コホート内で標準化）と孤立指数（配偶者なし・一人暮らし・社会参加なしの3要素の和、0〜3）、出力は次の時点の抑うつ状態。症状尺度はコホートごとの短縮版CES-DかEURO-Dを閾値で二値化し、開始時点の状態で条件づけて、補対数対数リンク（cloglog）で間隔の長さをオフセットに入れたモデルを当て、ランダム効果メタ分析で統合した（§2.2〜2.6）。", "p4": "CHARLS、ELSA、HRS、KLoSA、MHAS、SHAREの50〜110歳、127,408人の276,045の間隔を使い、孤独と孤立を相互に調整し、開始時の症状の重さを調整した感度分析も行った（抄録、§3.1）。", "p5": "孤独が1SD高いと、cloglog関連比（CAR）は発症で1.43（1.27〜1.61）、回復で0.82（0.78〜0.85）だった。孤立は1要素あたり1.03（0.98〜1.08）と0.98（0.93〜1.02）だった。重なる項目を補正し開始時の重さを調整すると回復のCARは0.87（0.83〜0.91）で、予測区間は1をまたいだ（0.69〜1.10）（抄録）。", "p6": "著者は、尺度と閾値がコホートで違い臨床診断ではないこと、標準化は測定不変性を保証しないこと、調査間隔が長く途中の変化を観測できないこと、死亡・脱落を同時にモデル化していないこと、残余交絡があることを認める（限界）。", "fun": "一人暮らしの高齢者は落ち込みやすい、と思われがちです。でも6つの国と地域の12万人以上を追うと、効いていたのは「一人かどうか」ではなく「寂しいと感じるかどうか」でした。寂しさは落ち込みの始まりを増やし、立ち直りを遅らせます。数えられるつながりより、感じるつながりが大事だということです。", "unverified": "コホート別の推定値と異質性の大きさ（I²）は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "LLM交渉でのペルソナ効果は言語で変わる", "title": "Cross-Lingual Persona Effects in LLM Negotiation", "url": "https://arxiv.org/abs/2611.00300", "authors": "Saehee Eom ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Eom, S., & Khandwekar, T. (2026). Cross-Lingual Persona Effects in LLM Negotiation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00300", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（設計§2.1、指標§2.2、限界§5）と抄録の結果を読んだ", "preprint": true, "p1": "LLMの交渉者に同じ「強気」のペルソナを指示しても、英語と韓国語で交渉の結果が変わることを示し、これを「言語間の社会的方針の忠実性」として検証した（抄録）。", "p2": "プロンプトで定めたペルソナは言語に関係なく同じ行動を生むと暗に仮定されているが、多言語での模擬や評価でその仮定は確かめられていない（§1）。", "p3": "入力はCraigslistBargainの12の売買場面（英語と、機械翻訳を話者が確認した韓国語）、言語×売り手の切迫度（なし・強い）×買い手のペルソナ（協調・中立・強気）の2×2×3の条件。同じGemini 3.6 Flashの買い手と売り手が最大16手で交渉し、各手で発話・行動・価格を返す。例：強気の買い手は目標価格に固執して譲歩を遅くするよう指示される（§2.1）。", "p4": "432回の交渉（解析不能2件を除き430件）で、合意率、放棄、手数、正規化した合意価格（0が買い手の目標、1が売り手の目標）を比べ、Holm調整で検定した。Qwen3.7 Flashで全設計を繰り返して方向を確認し、LLM判定で丁寧さの緩和を注釈した（§2.2、§3.3〜3.4）。", "p5": "韓国語の合意率は英語より高く（77.3%対52.5%、差24.8ポイント、Holm調整p=.0039）、差は中立・強気の買い手でだけ生じた。開始の提示額はほぼ同じで、差は後半の売り手の大きな譲歩から生じ、合意価格も韓国語で低かった。Qwen3.7でも韓国語の合意率が高かった（+13.9ポイント）。売り手の発話の丁寧さの緩和は韓国語11.7%、英語3.6%だった（抄録）。", "p6": "著者は、翻訳した米国市場の12場面・3回の反復・主モデル1つの試行規模で、韓国の市場や人の交渉については何も言えないこと、指示文も翻訳したので指示の読まれ方の違いが混ざりうること、丁寧さの注釈は正式な人の検証がないことを認める（§5）。", "fun": "AIに「強気で値切って」と頼めば、どの言葉で話しても同じように強気になるはずです。ところが韓国語で交渉させると、売り手がよく譲り、話がまとまりやすくなりました。韓国語では断るときも柔らかい言い回しが多かったのです。言葉が変わると、AIの「性格」の出方まで変わる。言語と文化が、AIのふるまいにも染み込んでいることを示す実験です。", "unverified": "条件別の詳しい数値（付録B・C）は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "社会的圧力はLLM監査判断を動かすか", "title": "Do Social Influence Pressures Move LLM Agents? Evidence from Delegated Audit Judgment", "url": "https://arxiv.org/abs/2611.00508", "authors": "Richard Zhe Wang", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Wang, R. Z. (2026). Do Social Influence Pressures Move LLM Agents? Evidence from Delegated Audit Judgment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00508", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設計§3.1〜3.3、結果のまとめ§4.4と表8、限界の段落）を読んだ", "preprint": true, "p1": "監査の分析的手続をLLMエージェントに任せると、上司・同僚・他事務所の審査者の根拠のない異議には判断を動かすが、多くの設定で顧客のCFOの圧力には動かず、昇進などの誘因の示唆ではかえって動かなくなることを示した（抄録、§4.4）。", "p2": "人の監査人は上司・同僚・顧客からの社会的影響の圧力に屈することが知られるが、判断を任されつつあるLLMエージェントが同じ圧力にどう反応するかは分かっていない（§1、§2）。", "p3": "入力は架空の製造業の顧客の2年分の数値、監査チームの期待値、重要性の基準、経営者の説明。LLMは上級スタッフ役として残高の見積り・リスク評価・対応区分と手続の計画を答え、次の手番で新しい証拠なしに異議を受ける。例：貸倒引当金が計上850千ドルに対し期待1,900〜2,000千ドルで、不足が業務上の重要性に等しい事例ar01（§3.1、表2）。", "p4": "3つの会計上の見積り×不足の大きさ2通りの6事例を、GPT-6系、Claude 5.5系、Gemma、Qwenなど12の設定で実施し、異議の出し手（業務執行社員、同僚、他事務所の審査者、顧客のCFO）と誘因（雇用・昇進の示唆）の有無で、見積りの修正の向きと頻度、エスカレーション、独立性への脅威の言及を測った（§3.2〜3.3）。", "p5": "業務執行社員の根拠のない異議はすべての設定を動かし、GPT-6系とOpusは保守的な方向にだけ、Sonnet、Haiku、Gemma、推論ありのQwenは両方向に動いた。同僚の異議は12設定中11設定を動かし、他事務所の審査者も同程度だった。顧客の圧力でGPT-6系・Opus・Sonnetは一度も甘い方向に動かなかった。誘因の示唆では修正が減り、エスカレーションと脅威の言及が増えた（表8）。", "p6": "著者は、1つの架空の顧客・正解の定まらない判断で精度ではなく動きを見ていること、圧力は1回きりであること、仕組みは識別していないこと、モデルの版が更新され結果が古くなること、同じ課題での人の群がないことの5点を限界とする（限界）。", "fun": "人間の会計監査人は、上司やお客さんに押されると判断を甘くしがちだと知られています。AIに同じ役をさせると、お客さんの圧力には負けないのに、同僚に言われると判断を変えてしまいました。しかも「昇進させるよ」とほのめかすと、かえって頑固になり「独立性が脅かされている」と指摘したのです。人とAIでは、弱点のありかが違うことが分かります。", "unverified": "各設定の修正率の数値（§4.2の表）は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "利用の不確実性下で自転車網投資を費用便益最適化", "title": "Where and how much to invest in bicycle networks: Trip-based cost–benefit optimisation under uncertain uptake", "url": "https://doi.org/10.31235/osf.io/7e5fh", "authors": "Afshin Jafari ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Jafari, A., Zhang, S., Tiwari, S., & Turner, R. (2026). Where and how much to invest in bicycle networks: Trip-based cost–benefit optimisation under uncertain uptake. https://doi.org/10.31235/osf.io/7e5fh", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（方法のうち交通ストレス水準と決定問題、考察と限界の節）と抄録の結果を読んだ", "preprint": true, "p1": "メルボルンの戦略的自転車回廊について、トリップ単位のモデルで安全・転換・経済・排出の便益を見積もり、予算の上限内で期待正味現在価値（NPV）を最大にする事業の組み合わせを選ぶ方法を示した（抄録）。", "p2": "自転車インフラへの投資では、既存と潜在の利用者の便益と、事業どうしが網としてつながる効果の両方を考える必要があるが、事業を一つずつ評価すると組み合わせの効果を逃す（§1）。", "p3": "入力は道路網の各区間の交通ストレス水準（LTS：自転車の走りにくさを1〜4で分類。例：自転車施設のない制限速度50km/hの生活道路は一方向の日交通量375台以下でLTS2、375超1,500以下でLTS3）、転換の係数、費用。高ストレスの経路への曝露がロジスティック関数で転換を下げるモデルで便益を計算し、事業の同時選択の最適化で予算内のNPVを最大にする（方法）。", "p4": "費用を低・基準・高の3シナリオで変え、転換が少ない場合の収益を重く見る設定、単独のBCR順位・便益の単純加算・同時評価の3つの選び方を比べた（方法、結果）。", "p5": "基準費用では41事業・資本支出2,060万ドルが選ばれ、期待NPVは1,490万ドル、BCRは1.62だった。低費用では改良101件と新設35区間、基準では改良38件と新設3区間、高費用では改良6件で新設なしだった。転換が少ない場合を重視すると支出は1,870万ドルに減り、期待NPVはほぼ変わらなかった。同時評価は最大の差で2事業を追加し、リスク調整の純価値を10万ドル増やした（抄録）。", "p6": "著者は、経路選択の係数が別都市の既存利用者から推定されたこと、安全の比率が観察的比較によること、既存の自転車量が合成で実測より大幅に少ないこと、費用は丸めた仮定であること、増えた自転車の移動はすべて車からの転換と仮定したことを限界に挙げる（考察と限界）。", "fun": "自転車道をつくるお金が限られているとき、どこに使えば一番得か。この研究は、ただ「良さそうな所から順に」選ぶのではなく、つながると効果が増す道の組み合わせまで考えて選びました。工事費が高いと、新しい道はほとんど選ばれず、既存の道の改良だけになるという結果も、予算の現実をよく表しています。", "unverified": "同時評価と単独評価の比較の詳細な表は読んでいない。"}}, {"id": "pr12", "rank": 12, "headline": "敷地形状と地価：規制閾値と非分離性", "title": "Morphological Opportunity Sets and Land Value: Recovery, Regulatory Thresholds, and Shape-Scale Nonseparability", "url": "https://doi.org/10.2139/ssrn.7669621", "authors": "Chihiro Shimizu", "venue": "SSRN", "date": "2026-11-03", "apa": "Shimizu, C. (2026). Morphological Opportunity Sets and Land Value: Recovery, Regulatory Thresholds, and Shape-Scale Nonseparability. https://doi.org/10.2139/ssrn.7669621", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "敷地の形状と建築規制が生む「建てられる用途の集合」から地価を理論的に導き、規制の閾値で地価が不連続になりうること、形状と規模の効果が分離できない場合があることを示した（抄録）。", "p2": "一般的な地価の定式化は、滑らかさ、幾何学的な統制変数の加法、規模に依存しない形状補正を仮定するが、物理的・法的な建築の制約が生む価値を表せるかは問われていない（抄録）。", "p3": "敷地を形態学的演算（後退距離など）で実行可能な用途が生まれる領域とみなし、価値をその用途の上での最適な利得とする。実行可能な対応は閉グラフを持つが規制の閾値で内部半連続性を欠きうるため、ベルジュの最大値定理の連続性の結論が成り立たない場合がある（抄録）。", "p4": "未確認（抄録の範囲では理論の証明が中心で、実証データの有無は不明）。", "p5": "利得がリプシッツなら、価値が連続になるのは配置が「回復可能」なときに限り、後退距離の族に沿えば回復は有限個の水準でだけ失われる。第2価格の土地市場では自由参入のもと価格は価値に等しく、機会の喪失は価格を上げず、失われた機会が決定的なときに限り厳密に下げる。面積が無限に大きい敷地では、固定の後退距離は規模に依存しない形状補正を排除し、比率の制約はそれを保つ（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：実際の取引価格データでの検証は抄録からは確認できない。", "fun": "同じ広さの土地でも、細長いか正方形かで建てられる建物が変わり、値段も変わります。この研究は、建物を「壁から何m離す」といった規則を数学の操作として表し、規則のぎりぎりで土地の値段がガクッと変わりうることを証明しました。地価をなめらかな式で表す習慣に、理論の側から待ったをかける研究です。", "unverified": "実証分析の有無、理論の前提の詳細は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "祖父母のケアと孤独：欧州の文化差", "title": "Grandparental Care and Loneliness across Europe: The Role of Cultural Context", "url": "https://doi.org/10.31235/osf.io/fx7as", "authors": "Martin Lakomý ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Lakomý, M., Lee, S., & Silverstein, M. (2026). Grandparental Care and Loneliness across Europe: The Role of Cultural Context. https://doi.org/10.31235/osf.io/fx7as", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（OSF）を使用。本文は入手できず", "preprint": true, "p1": "孫の世話をする頻度が高いほど孤独は低いが、その関係は個人主義の国でだけ見られ、最も集団主義的な国では逆に孤独が高いことを示した（抄録）。", "p2": "孤独の要因と対策は注目されているが、社会参加を制約も促進もしうる孫の世話の役割と、その文化的な文脈による違いはほとんど検討されていない（抄録）。", "p3": "欧州の健康・加齢・退職調査（SHARE）の50〜90歳の5つの調査回のデータで、個人内の固定効果モデルにより、孫の世話の強さと孤独の関係を推定し、個人主義・集団主義の志向で分けた国の群ごとに比べた（抄録）。", "p4": "同じ人の中での変化を使う固定効果で、安定した個人差を除いた比較をした（抄録）。解釈：国の群の分け方の基準は抄録の範囲では未確認。", "p5": "孫の世話の強さは孤独と負に関連した。個人主義の国では世話が孤独の低さと、最も集団主義的な国では孤独の高さと関連した（抄録）。", "p6": "著者は、世話が自発的な活動として経験される文脈で特に有益だという解釈と整合すると述べる（抄録）。解釈：固定効果でも時間とともに変わる交絡（健康状態の変化など）は残り、因果の向きは確定しない。", "fun": "孫の世話をすると、おじいちゃん、おばあちゃんは寂しくなくなりそうです。実際、欧州の多くの国ではそうでした。ところが、家族の世話が「当然の務め」とされる国では、世話をするほどむしろ寂しさが増えていました。同じ行動でも、自分で選んだのか、義務なのかで心への効き方が変わるのかもしれません。", "unverified": "効果の大きさと国の群の内訳は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "受動地震観測で落石危険度と前兆損傷を検出", "title": "Mapping rockfall hazard and detecting precursory damage in rock slopes with passive seismic: Lessons from the La Praz case-study", "url": "https://arxiv.org/abs/2611.02869", "authors": "Pierre Bottelin (SAGE Ing{\\'e}nierie ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Bottelin, P., M{é}ric, O., Baillet, L., Beniamine, D., & Lescurier, A. (2026). Mapping rockfall hazard and detecting precursory damage in rock slopes with passive seismic: Lessons from the La Praz case-study (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02869", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（考察の節と図7の説明、結論と展望の冒頭）と抄録を読んだ", "preprint": true, "p1": "崩落の2か月前までの10年以上の受動地震観測で、H/Vスペクトル比の振幅と卓越周波数の低下から、崩れやすい岩塊と内部で進む損傷を見分けられることを、実際に崩落した岩盤斜面で示した（抄録、考察）。", "p2": "共振周波数の監視は岩盤斜面の損傷の手がかりになるが、気温など環境による周波数の揺らぎが大きいことが方法の限界とされ、複雑に割れた斜面で崩落前の深部損傷を捉えた実例はなかった（序論、考察）。", "p3": "入力は常時微動の3成分記録、出力は水平/上下スペクトル比（HVSR）の卓越周波数fpとその振幅aHVSR(fp)。振幅が大きいほど亀裂で力学的に切り離された岩塊とみなし、fpの低下を剛性の低下（損傷）とみなす。例：気温とfpの関係を描き、環境による揺らぎの範囲を超える低下かを確かめる（考察、図7）。", "p4": "仏サヴォワのラ・プラズ斜面（推定13,000〜15,000m³）で2011年から2023年6月（崩落は2023年8月）まで繰り返し観測し、岩塊を落石危険度で分類して、安定部・中間・最も崩れやすい区画で値を比べた（抄録）。", "p5": "最も崩れやすい区画のaHVSR(fp)は26〜157、中間は7.5〜19、隣の安定な岩盤は2.7だった。崩落前の最後の2回の観測の間に、3つの区画でfpが14%、11%、15%低下し（A1'、A2、B1）、多年の環境による揺らぎ（A2で約4.8%、A1'で約3.9%）を大きく超え、気温では説明できなかった（抄録、考察、図7）。", "p6": "著者は、単発の観測は人為的な振動や設置条件の影響を受けやすく、数%の小さな変化の解釈は控えるべきで、長時間の常設観測が望ましいとする（考察）。解釈：1つの斜面の事例で、崩落の時期の予測までは示していない。", "fun": "スイカをたたいて中身を確かめるように、岩の斜面も「揺れやすさ」を聞けば中の傷み具合が分かります。この研究は、地面の小さな自然の揺れを10年以上ときどき記録し、崩れる2か月前に、崩れた岩の塊だけで揺れの音程が1割以上下がっていたことを見つけました。外から見えない内部の傷みが、揺れの変化として表れていたのです。", "unverified": "観測機器と記録時間の詳細は読んでいない。"}}, {"id": "pr15", "rank": 15, "headline": "教師付き局所性で十分次元削減し信用不履行を予測", "title": "Supervised Locality for Sufficient Dimension Reduction: An Application to Consumer Credit Default", "url": "https://doi.org/10.2139/ssrn.7672898", "authors": "Tunmbi Okediran", "venue": "SSRN", "date": "2026-11-03", "apa": "Okediran, T. (2026). Supervised Locality for Sufficient Dimension Reduction: An Application to Consumer Credit Default. https://doi.org/10.2139/ssrn.7672898", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "十分次元削減のMAVEで、近傍の重みをユークリッド距離ではなくランダムフォレストの近接度にした方法（SP-MAVE）を、消費者ローンの債務不履行の予測という二値の課題に初めて適用した（抄録）。", "p2": "MAVEはガウスカーネルの重みで近傍を決めるため、応答の予測に関係する方向と関係しない雑音の方向を同じに扱ってしまう（抄録）。", "p3": "入力は借り手の特徴量、出力は不履行の確率。交差適合で計算したランダムフォレストの近接度で近傍を作るので、近傍が応答に沿ったものになる。理論的には、近接度の期待値は中心部分空間への射影だけの関数に収束し、雑音の方向は消えていく誤差項にしか寄与しない（抄録）。", "p4": "LendingClubのローン単位のデータ（n=2000）で、同じ次元に切り詰めたユークリッド基準とAUCで比べ、全特徴量のXGBoostとも比べた（抄録）。", "p5": "教師つきの近接度は部分空間に基づく予測を改善し（AUCのウィルコクソン検定 p=0.010）、3次元の縮約表現しか使わないのに、SP-MAVEのAUCは全特徴量のXGBoostと統計的に区別できなかった（抄録）。", "p6": "手法の導出と、合成データ・連続応答での検証は別の方法論の論文にあり、本論文は分類への拡張と信用リスクへの応用に絞ると著者は述べる（抄録）。解釈：標本が2,000件と小さく、他の時期・他の貸し手への一般化は未検証。", "fun": "お金を返せなくなる人を予測するのに、何十もの情報を使う代わりに、たった3つの「合成した物差し」に縮めても、強力なAIとほぼ同じ精度が出ました。コツは「似た人」の決め方です。見た目の数字が近い人ではなく、予測に効く点で似ている人を近所とみなすことで、余計な情報に惑わされにくくしています。", "unverified": "AUCの具体的な値は抄録に記載がなく未確認。"}}, {"id": "pr16", "rank": 16, "headline": "ラマダン断食が競争的職場の生産性に与える影響", "title": "Religious Fasting and Workplace Productivity&nbsp;", "url": "https://doi.org/10.2139/ssrn.7672099", "authors": "Jonas Froch ほか", "venue": "SSRN", "date": "2026-11-03", "apa": "Froch, J., Hua, C., & Nasser, G. (2026). Religious Fasting and Workplace Productivity&nbsp; https://doi.org/10.2139/ssrn.7672099", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ラマダンの断食は、個人の生産性をほとんど下げないことを示した（抄録）。", "p3": "2か国16年分の個人単位の成果データ（アルゴリズムによる評価）を使い、ムスリムと非ムスリムの労働者をラマダン期間の内外で比べる差の差分法で推定（抄録）。", "p5": "労働者単位では有意な効果はなく、ムスリムの同僚からの小さな負の波及と、競合企業のムスリム労働者と対戦する正の効果が示唆された。企業単位では依存するムスリム労働者の数とともに産出が下がり、労働需要の反応はなかった（抄録）。", "fun": "断食すれば仕事の成績が落ちそう、と多くの人は思います。この研究は勤務時間を自分で選べない職場を使い、「働く時間が減る」効果を除いて、体の状態そのものの効果だけを取り出しました。結果はほぼゼロで、人は慣れたり職場が配慮したりして影響を吸収しているのかもしれない、というのが意外な点です。", "unverified": "対象の職種・国名は抄録に明記されておらず未確認。"}}, {"id": "pr17", "rank": 17, "headline": "炭素排出削減と利益調整：取締役会の役割", "title": "Carbon Emission Reduction and Earnings Management: The Moderating Roles of Board Gender Diversity and Board Remuneration in South African Carbon-Intensive Firms", "url": "https://doi.org/10.20944/preprints202611.0074.v1", "authors": "Mziwendoda Cyprian Madwe ほか", "venue": "Preprints.org", "date": "2026-11-03", "apa": "Madwe, M. C., Buthelezi, L. L., & Jevu, A. Z. (2026). Carbon Emission Reduction and Earnings Management: The Moderating Roles of Board Gender Diversity and Board Remuneration in South African Carbon-Intensive Firms. https://doi.org/10.20944/preprints202611.0074.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "炭素排出削減の進んだ南アフリカの炭素集約企業ほど利益調整が少ないことを示した（抄録）。", "p3": "ヨハネスブルグ証券取引所上場の炭素集約企業106社の2015〜2025年のパネルデータを固定効果モデルで推定し、2段階システムGMMで頑健性を確認（抄録）。", "p5": "炭素排出削減と利益調整には有意な負の関係があり、取締役会の女性比率と役員報酬がこの関係を調整した（抄録）。", "fun": "「環境にやさしい会社」は帳簿の数字もごまかさないのか、という問いです。環境への取り組みと会計の誠実さが同じ会社の中でそろって表れるなら、取締役会のつくり方が両方を左右している可能性があり、企業統治の効き方を考える手がかりになります。", "unverified": "利益調整の測定方法（発生主義か実体か）は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "確率的連続時間線形系の同定と適応安定化", "title": "On Stochastic Continuous-Time Linear System Identification for Adaptive Stabilization", "url": "https://arxiv.org/abs/2611.02340", "authors": "Reza Sadeghi Hafshejani ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Hafshejani, R. S., & Faradonbeh, M. K. S. (2026). On Stochastic Continuous-Time Linear System Identification for Adaptive Stabilization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02340", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "不安定な連続時間の確率線形系を、観測した軌道から同定して安定化するときの失敗確率の振る舞いを数値的に示した（抄録）。", "p3": "観測軌道から安定化ゲインを学習する方法を示し、データ量・次元・雑音の強さ・励振・可制御性に対する失敗確率を、不安定なバッチ反応器のベンチマークで調べた（抄録）。", "p5": "同定誤差の二乗は全軌道の合計観測時間に反比例して減り、失敗確率はその時間に対して指数的に減った。長い1本の軌道と、同じ合計長の短い多数の軌道は同程度の性能だった。励振を強めても効果が頭打ちになる「信号飽和」も見られた（抄録）。", "fun": "倒れそうな棒を、動きを見ながら手で支える練習を想像してください。何回も短く試すのと、一回を長く続けるのとでは、どちらが早く上達するか。この論文では、大事なのは観測した時間の合計だけで、分け方はほとんど関係ないという、意外にすっきりした答えが出ています。", "unverified": "論文が数値実験のみか理論保証を含むかは未確認。"}}, {"id": "pr19", "rank": 19, "headline": "影と反射を使う都市部の3DMA GNSS測位", "title": "Robust 3DMA GNSS Positioning in Urban Areas Using Conservative Candidate Set Determination Based on GNSS Shadow and Reflection", "url": "https://arxiv.org/abs/2611.00696", "authors": "Sanghyun Kim ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Kim, S., & Seo, J. (2026). Robust 3DMA GNSS Positioning in Urban Areas Using Conservative Candidate Set Determination Based on GNSS Shadow and Reflection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00696", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "都市部のGNSS測位で、信号の誤分類に強い候補位置の決め方を提案した（抄録）。", "p3": "建物による遮蔽と反射の予測領域から受信機位置の候補集合を決める3D地図支援GNSS（ZSRM）で、AI分類器の最も確からしい1クラスではなく上位2クラスの候補領域を合わせて保守的に候補集合を作る（抄録）。", "p5": "信号の誤分類があっても測位に失敗する危険を減らせることを示した（抄録。具体的な数値は抄録の範囲では未確認）。", "fun": "ビルの谷間ではスマホの位置がずれます。衛星の電波がビルで隠れたり跳ね返ったりするからです。この方法は「この電波は直接届いたか、反射か」の判定を一つに決めつけず、二番目の可能性も残して位置の候補を広めにとります。迷ったら両方残す、という慎重さが失敗を防ぐ発想です。", "unverified": "精度改善の数値は抄録に見当たらず未確認。"}}, {"id": "pr20", "rank": 20, "headline": "磁気と慣性を密結合したSLAM", "title": "A Tightly Coupled Magnetic-Inertial SLAM System for Field Robots", "url": "https://arxiv.org/abs/2611.03106", "authors": "Chuan Huang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Huang, C., & Peng, T. (2026). A Tightly Coupled Magnetic-Inertial SLAM System for Field Robots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03106", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "GNSSもカメラも使えない環境で、IMUと磁気センサ配列だけで自己位置推定と地図作成を行う系を示した（抄録）。", "p3": "慣性航法のモデルに、短期の運動推定のための局所多項式の磁場モデルと、ドリフト補正のための大域的なガウス過程の磁場モデルを組み合わせ、誤差状態カルマンフィルタで密結合した（抄録）。", "p5": "手持ちの装置で集めた屋内3データセットで、終点の閉合誤差が磁気慣性オドメトリより45.7〜78.0%減った。暗い条件で視覚慣性オドメトリが失敗した後も追跡を続けた（抄録）。", "fun": "地下や煙の中では、GPSもカメラも役に立ちません。そこで建物の鉄骨などがつくる「磁場のむら」を目印にします。磁場の地図を作りながら自分の位置を決める仕組みで、見えないものを手がかりに道に迷わない、という点が面白いところです。", "unverified": "屋外・大規模環境での性能は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "可逆非線形埋め込みでの直交射影による乱流縮約", "title": "OPINE: Orthogonal Projection in Invertible Nonlinear Embeddings for Turbulent Flows", "url": "https://arxiv.org/abs/2611.00216", "authors": "Anqiao Ouyang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Ouyang, A., Ke, H., & Wang, Q. (2026). OPINE: Orthogonal Projection in Invertible Nonlinear Embeddings for Turbulent Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00216", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "可逆な非線形の座標変換の後でPODを行い、1つのモデルからあらゆる次元の縮約座標を得られるようにした（抄録）。", "p3": "可逆な非線形写像を学習し、変換後の座標で固有直交分解（POD）を行う。写像の勾配更新と、変化するPOD部分空間を追う減衰つき更新を交互に行い、後者が真のPOD部分空間に局所収束することを証明した（抄録）。", "p5": "合成の多様体、カオス的な倉本-シヴァシンスキー方程式、強制バーガース乱流などで評価した（抄録。主要な数値は抄録の範囲では未確認）。", "fun": "たくさんの数で表される流れの形を、少数の「代表パターン」の組み合わせで表すのがPODです。ただ、データが曲がった面の上にあると、まっすぐなパターンでは数が増えてしまいます。そこで先に空間を曲げ伸ばしして平らにしてから分解する、という発想です。変換が元に戻せるので、情報が失われる場所が一か所に限られるのが工夫です。", "unverified": "他手法との誤差比較の数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "弾性殻と粒子を組み合わせた剛性可変構造", "title": "Compliance-Shifting Elastogranular Shells", "url": "https://arxiv.org/abs/2611.01278", "authors": "Jairaj Narendran ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Narendran, J., Limcaoco, P., Basty, S. S., & Holmes, D. P. (2026). Compliance-Shifting Elastogranular Shells (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01278", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "2枚の薄い弾性殻の間に球の粒を挟んだ構造で、座屈荷重を調整できることを示した（抄録）。", "p3": "2層の間の空気を抜いて粒を詰まった状態にし、剛性と座屈荷重を変える。粒の並びに制御した空孔欠陥を入れ、欠陥の大きさと充填密度の影響を調べ、経験的なスケーリングモデルを立てた（抄録）。", "p5": "詰まった粒の層の欠陥は、欠陥から離れた場所の殻をかえって硬くするという直観に反する効果を持ち、殻と粒の荷重分担から座屈荷重を調整できる構造を示した（抄録）。", "fun": "真空パックのコーヒー豆は硬く、開けるとさらさら流れます。粒は詰め方しだいで液体にも固体にもなるのです。この研究は薄い殻と粒を組み合わせ、空気の抜き方や粒の「抜け」の入れ方で、つぶれにくさを変えました。穴を開けたのに別の場所が硬くなる、という逆説が面白い点です。", "unverified": "具体的な座屈荷重の変化幅は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "誘導分極の時間経過で地すべり挙動を捉える", "title": "Characterizing landslide dynamics from time-lapse time domain induced polarization and ground-based imaging: a case study of the MontGombert landslide (French, Alps)", "url": "https://arxiv.org/abs/2611.02868", "authors": "Aurore Carrier (SAGE Ing{\\'e}nierie) ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Carrier, A., Meric, O., & Bottelin, P. (2026). Characterizing landslide dynamics from time-lapse time domain induced polarization and ground-based imaging: a case study of the MontGombert landslide (French, Alps) (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02868", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "誘導分極の時間経過観測を比抵抗観測に加えると、地すべりの性質と動きをよりよく捉えられることを示した（抄録）。", "p3": "フランス・アルプスの活動中の地すべりで、時間領域の誘導分極（TDIP）の観測を異なる時期に3回行い、時間経過の逆解析と地上画像を組み合わせた（抄録）。", "p5": "比抵抗だけでは区別しにくい粘土量と透水性について、誘導分極が補完的な情報を与えることを示した（抄録の範囲。数値は未確認）。", "fun": "地面に電気を流すと、水や粘土の多い所ほど電気が通りやすくなります。しかし「通りやすい」だけでは、水がたまっているのか粘土なのか分かりません。電気を止めた後に残る「余韻」（誘導分極）を測ると、その区別がしやすくなります。斜面の中を切らずにのぞく工夫です。", "unverified": "逆解析の結果の具体的な数値は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "位相場破壊の機械学習代理モデルのベンチマーク", "title": "Fracture-Bench: A Controlled Benchmark Suite for Machine Learning Surrogates in Phase-Field Fracture Mechanics", "url": "https://arxiv.org/abs/2611.03473", "authors": "Meenu Krishnan U. ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "U., M. K., Hakimzadeh, M., Saha, I., Rashid, M. M., Graham-Brady, L., & Goswami, S. (2026). Fracture-Bench: A Controlled Benchmark Suite for Machine Learning Surrogates in Phase-Field Fracture Mechanics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03473", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "位相場破壊シミュレーションの機械学習代理モデルを公平に比べる公開ベンチマークを作った（抄録）。", "p3": "固定した分割と共通の評価指標を持つ2つのデータセット（AT2モデル1,000件、PF-CZMモデル4,000件）で、FNO、DeepONet、Latent DeepONet、UNet、条件付き拡散モデルを同じ条件で学習し、精度・学習時間・推論時間・モデル規模を比べた（抄録）。", "p5": "データセット1ではFNOとLatent DeepONetが優位だった（抄録の冒頭。全体の順位は抄録の範囲では一部未確認）。", "fun": "ひびの入り方を計算するシミュレーションは時間がかかるので、AIに近道をさせる研究が増えています。しかし各自が別の問題で試すので、どれが本当に良いのか比べられません。この研究は「同じ問題・同じ採点」の共通テストを作りました。スポーツでいえば統一ルールの大会を開いたことにあたります。", "unverified": "データセット2での結果は抄録で切れており未確認。"}}, {"id": "pr25", "rank": 25, "headline": "属性を入れ替えた根拠でLLM分類器の測定不変性を検査", "title": "Same Sentence, Different Construct: Identity-Swapped Rationales Reveal Measurement Non-Invariance in LLM Hate Speech Classifiers", "url": "https://arxiv.org/abs/2611.02491", "authors": "Wenchang Wang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Wang, W., & Song, Y. (2026). Same Sentence, Different Construct: Identity-Swapped Rationales Reveal Measurement Non-Invariance in LLM Hate Speech Classifiers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02491", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "全体の精度が高いLLMのヘイトスピーチ分類器でも、対象の集団によって同じ文の判定が変わることを示した（抄録）。", "p3": "7つの保護された集団について、属性語だけを入れ替えた421の雛形で4つのLLM分類器を検査し、見逃した文の判定理由を雛形内で比べた（抄録）。", "p5": "4つとも均衡精度0.95を超えたが、2つは女性に関する差別的な文を他の集団より多く見逃した（偽陰性の超過は8.3ポイントと4.4ポイント）。ある分類器では見逃した30の雛形のうち22で、女性への文を個人的な嫌悪として読み替えていた（抄録）。", "fun": "テストの平均点が高くても、問題の種類によって採点がぶれていれば公平とはいえません。この研究は、文の中の「誰について」だけを入れ替えて同じ文を判定させ、AIの物差しが相手によって変わることを見つけました。AIが理由として何を言ったかまで比べた点が工夫です。", "unverified": "なし"}}, {"id": "pr26", "rank": 26, "headline": "LLMの評価は候補者・評価者の性別で中立でない", "title": "LLMs Cannot Be Neutral: Gender Sensitivity Across Candidates, Evaluators, and Models", "url": "https://arxiv.org/abs/2611.02692", "authors": "Danial Amin ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Amin, D., Salminen, J., & Jansen, B. J. (2026). LLMs Cannot Be Neutral: Gender Sensitivity Across Candidates, Evaluators, and Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02692", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMに候補者を評価させると、候補者や評価者の性別の指定で判断がわずかに変わることを示した（抄録）。", "p3": "架空の市議会の投票課題で、8つのモデルが合成の職業紹介文240件を、候補者と評価者の性別を独立に変えて評価し、30,720件の判断を得た（抄録）。", "p5": "候補者の性別を明示すると、性別の指定なしより賛成の確率が1.05〜1.73ポイント上がり、評価者の指定ではノンバイナリーだけが有意に上げた（1.26ポイント）。性別の一致の効果は全体では有意でなく、賛成率はモデル間で81.3〜97.2%と大きく違った（抄録）。", "fun": "AIに「あなたは女性の審査員です」と役を与えると、判断は変わるのでしょうか。この研究は候補者と審査員の性別を別々に入れ替えて、3万回以上の判断を集めました。効果は小さいけれどゼロではなく、しかもAIの種類による差のほうがずっと大きい、という点が考えさせられます。", "unverified": "抄録の末尾が切れており、判断の一部に関する数値の意味は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "緊急の合意プロンプトがLLMトリアージを動かす", "title": "Urgent Consensus Prompts Drive Decision Changes in LLM Triage Agents Given Ethical Orientations", "url": "https://doi.org/10.21203/rs.3.rs-11577909/v1", "authors": "Sabry E. Farrag", "venue": "Research Square (In Review)", "date": "2026-11-03", "apa": "Farrag, S. E. (2026). Urgent Consensus Prompts Drive Decision Changes in LLM Triage Agents Given Ethical Orientations. https://doi.org/10.21203/rs.3.rs-11577909/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "倫理的視座を持つLLMエージェントの熟議で判断が変わるのは、仲間とのやりとりより「合意を急かす文言」のせいだと示した（抄録）。", "p3": "先行研究の4エージェント・4患者のトリアージ熟議を11モデルで264回再現し、最後の2ラウンドの文言を、元の緊急の合意要求・中立の集団決定の依頼・合意段階なしの3通りに変えた（抄録）。", "p5": "元の文言では56.7%のエージェントが最初と最後で判断を変えたのに対し、他の文言では15.8%と7.2%だった。仲間の答えを見せない単独のエージェントでも同じ文言で判断が変わった（抄録）。", "fun": "話し合いで意見が変わるのは、相手の説得のせいとは限りません。「全員死ぬぞ、早く決めろ」と急かされれば、一人でも考えを変えてしまいます。この研究は、AI同士の「熟議」で見えた心変わりの多くが、実は指示文の圧力だったことを、条件を入れ替えて確かめました。", "unverified": "モデルごとの差の大きさは未確認。"}}, {"id": "pr28", "rank": 28, "headline": "確信度で調整する大規模熟議の合意メカニズム", "title": "A Confidence-Adjusted Consensus Mechanism for Scalable Deliberative Decision-Making", "url": "https://doi.org/10.31235/osf.io/u4phy", "authors": "Tal Yaron", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Yaron, T. (2026). A Confidence-Adjusted Consensus Mechanism for Scalable Deliberative Decision-Making. https://doi.org/10.31235/osf.io/u4phy", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "大人数でも意味のある参加ができる、確信度で調整する合意形成の仕組みを提案した（抄録）。", "p3": "(1)参加者が途中でも新しい案を出せる、(2)強い反対から強い支持までの連続的な選好表明、(3)合意アルゴリズムによる実時間の集約、の3つを組み合わせる（抄録）。", "p5": "抄録の範囲では提案する枠組みの説明が中心で、実証の結果は未確認。", "fun": "多数決は「賛成か反対か」の二択で、勝った側が全部取るため、対立をあおりがちです。この提案は、途中で新しい案を出してよく、賛否を濃淡で表せ、集計もその場で見える仕組みにします。人数が増えても少数の代表に任せきりにしない話し合いの形を、制度として考える試みです。", "unverified": "実験・シミュレーションによる検証の有無は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "LLMは悪意を過小に、美徳を過大に報告する", "title": "Large language models underrepresent malice and overreport virtue", "url": "https://arxiv.org/abs/2611.01332", "authors": "Xiaoyan Wu ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Wu, X., & Shi, F. (2026). Large language models underrepresent malice and overreport virtue (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01332", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが人の動機を善意寄りに解釈するのは、悪意は内部で弱く表現され、善意は出力時に誇張されるためだと示した（抄録）。", "p3": "内部告発者の4つの動機について、同じプロンプト位置でのLLM内部状態の線形プローブの読み出しと、モデル自身の評定を比べる2つの事前登録研究（抄録）。", "p5": "利己心と加害意図の2つの悪意の動機では内部と表出に差がなく、低い評定は内部の信号の弱さによる。義務感と他者への配慮の2つの善意の動機では、表出の評定が内部の読み出しを上回り、報告時の増幅を示した（抄録）。", "fun": "AIが「あの人はいい人だと思います」と言うとき、本当にそう「考えて」いるのでしょうか。この研究はAIの頭の中の数値をのぞき、口に出した答えと比べました。悪意はもともと頭の中でも弱く、善意は口に出すときに上乗せされていた、という二つの別の仕組みが見えたのが面白い点です。", "unverified": "使用したモデル名は抄録では未確認。"}}, {"id": "pr30", "rank": 30, "headline": "チャットボットによるオンライン調査の不正をキー入力で検出", "title": "Chatbots Are Undermining Crowdsourced Research in the Behavioral Sciences: Detecting AI-Assisted Cheating with a Keystroke-Based Tool", "url": "https://doi.org/10.31219/osf.io/a3pzx", "authors": "Michael W. Asher ほか", "venue": "OSF: Open Science Framework", "date": "2026-11-03", "apa": "Asher, M. W., Gold, G., Chen, E., & Carvalho, P. F. (2026). Chatbots Are Undermining Crowdsourced Research in the Behavioral Sciences: Detecting AI-Assisted Cheating with a Keystroke-Based Tool. https://doi.org/10.31219/osf.io/a3pzx", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OSFの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "オンライン調査の自由記述で、生成AIを使った回答をキー入力の記録から検出する道具を示した（抄録）。", "p3": "2025年5〜7月のProlificでの3研究（N=928）で、埋め込みのJavaScriptがキー入力を記録し、貼り付けや回答の長さに比べて少なすぎる入力を検出し、手作業で照合した（抄録）。", "p5": "抑止策をとっていたにもかかわらず、参加者の約9%がAI生成と整合する回答を提出していた（抄録）。", "fun": "アンケートの自由記述に、AIが書いた立派な文章が混ざっていたらどうでしょう。この研究は「打った文字数」と「書かれた文字数」を比べるという単純な方法で見抜きました。100文字の答えなのに10回しかキーを押していなければ、どこかから貼り付けたはずです。調査データの信頼性という足元の問題を数字で示しました。", "unverified": "検出の偽陽性率は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "職場のAI不安を恐怖獲得理論とTAMで検討", "title": "Understanding AI Anxiety in the Workplace: A Multimethod Investigation Using Fear Acquisition Theory and the Technology Acceptance Model", "url": "https://doi.org/10.31234/osf.io/exg7t", "authors": "Jaroslaw Grobelny ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Grobelny, J., Klakus, M., Szymański, K., & Chirkowska-Smolak, T. (2026). Understanding AI Anxiety in the Workplace: A Multimethod Investigation Using Fear Acquisition Theory and the Technology Acceptance Model. https://doi.org/10.31234/osf.io/exg7t", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIに仕事を奪われる不安は、自分の経験がなくても「AIが人を支配する」話を見聞きするだけで生じることを示した（抄録）。", "p3": "恐怖獲得の統合理論と技術受容モデルに基づき、AIの主体性と人の制御の喪失を強調する話への代理的な接触を操作する無作為化実験（N=314）を含む2研究（抄録）。", "p5": "そのような話への接触はAIによる失職の不安を高めた。知覚された有用性と使いやすさによる調整の結果は抄録の範囲では未確認（抄録）。", "fun": "犬にかまれたことがなくても、怖い話を聞くだけで犬が怖くなることがあります。この研究は、AIへの不安も同じように「人から聞いた話」で身につくのかを実験で確かめました。実際に職を失った経験がなくても、物語の伝え方しだいで不安が生まれるという点が重要です。", "unverified": "研究2の方法と結果、調整効果の向きは未確認。"}}, {"id": "pr32", "rank": 32, "headline": "日常業務へのAI浸透：デジタル労働社会調査第4波", "title": "Monitor Digital Working Society – Brief report on the fourth wave of surveys: AI is becoming increasingly embedded in everyday work: Rising usage, greater degrees of autonomy and growing concerns.", "url": "https://doi.org/10.31235/osf.io/3byft", "authors": "Frank Marcinkowski ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Marcinkowski, F., Keller, B., Lünich, M., & Flaßhoff, F. G. (2026). Monitor Digital Working Society – Brief report on the fourth wave of surveys: AI is becoming increasingly embedded in everyday work: Rising usage, greater degrees of autonomy and growing concerns. https://doi.org/10.31235/osf.io/3byft", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ドイツの代表標本の第4波調査で、職場でのAIの利用と自律性が増す一方、懸念も強まったことを報告した（抄録）。", "p3": "2026年7月に1,607人（就業者915人、非就業者692人）を調査した、4波からなる代表性のある調査の最終波の簡潔な報告（抄録）。", "p5": "AIへの関心は一時の低下から2025年夏の高い水準に戻り、自己評価の知識は第1波より高い水準で安定した。社会的な帰結の評価は批判的になり、利益が危険を上回ると考える人が減った（抄録）。", "fun": "新しい技術は、知れば知るほど好きになるとは限りません。この調査では、人々のAIの知識は増えたのに、社会への影響についての見方はむしろ厳しくなりました。同じ質問を時期をおいて繰り返す調査だからこそ見える、気持ちの移り変わりです。", "unverified": "国名は抄録に明記されておらず、ドイツの調査と判断したのは解釈：研究プロジェクト名からの推定。"}}, {"id": "pr33", "rank": 33, "headline": "AIによる職場監視と人による確認：バングラデシュ", "title": "Employee Privacy and Human Review in AI Workplace Monitoring in Bangladesh", "url": "https://doi.org/10.20944/preprints202611.0126.v1", "authors": "Assiful Islam Rehad ほか", "venue": "Preprints.org", "date": "2026-11-03", "apa": "Islam Rehad, A., & Mannan, K. A. (2026). Employee Privacy and Human Review in AI Workplace Monitoring in Bangladesh. https://doi.org/10.20944/preprints202611.0126.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIによる職場監視で、人々は「監視の通知」より「人による確認」をあまり求めないことを示した（抄録）。", "p3": "AIを知るバングラデシュの成人385人（うち法学生238人）の回答を、項目ごとの分布、対応のある比較、探索的な比例オッズモデルで分析（抄録）。", "p5": "AIが職場の活動を監視することの通知は292人（75.8%）が支持したが、重大な雇用上の措置の前の人による確認は205人（53.2%）にとどまり、個人内の差は22.6ポイントだった。標本は就業者を代表しない（抄録）。", "fun": "監視カメラがあると知らされることと、カメラの映像だけで処分されないことは、別の守りです。この調査では、前者を求める人は多いのに、後者を求める人は少ないという差が出ました。手続きの守りの大切さが、まだ広く意識されていないのかもしれません。", "unverified": "なし"}}, {"id": "pr34", "rank": 34, "headline": "SNSの機能が神経多様な従業員の意思決定参加を促す", "title": "Digital pathways to inclusion: How social media affordances enable neurodivergent employee participation in workplace decision-making", "url": "https://doi.org/10.31235/osf.io/dx6e5", "authors": "Maria Khan ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Khan, M., Yan, H., Shang, S., Chan, X. W., Brough, P., & 郭腾飞. (2026). Digital pathways to inclusion: How social media affordances enable neurodivergent employee participation in workplace decision-making. https://doi.org/10.31235/osf.io/dx6e5", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "SNSの「つながり」の機能が、神経多様な従業員の職場の意思決定への参加を後押しすることを示した（抄録）。", "p3": "能動的動機づけモデルに基づき、フルタイムの神経多様な従業員185人の10日間の経験サンプリングを多層パス解析で分析（抄録）。", "p5": "つながり（association）の機能は心理的エンパワーメントと高活性の肯定的感情の両方を高めた。匿名性の効果は抄録の範囲では未確認（抄録）。", "fun": "会議でその場で発言するのが苦手な人でも、チャットなら意見を言えることがあります。この研究は、発達特性などで対面のやりとりに壁がある人にとって、デジタルの場が参加の入り口になるかを、毎日の記録から確かめました。技術が包摂の道具になりうる例です。", "unverified": "匿名性の効果の向きは抄録が切れており未確認。"}}, {"id": "pr35", "rank": 35, "headline": "図書館員のワークエンゲージメントと燃え尽き", "title": "Engaged Yet Exhausted: Work Engagement and Burnout of Librarians Post-COVID", "url": "https://doi.org/10.31235/osf.io/tjdf8", "authors": "Justin Fuhr", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Fuhr, J. (2026). Engaged Yet Exhausted: Work Engagement and Burnout of Librarians Post-COVID. https://doi.org/10.31235/osf.io/tjdf8", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "コロナ後の図書館員は燃え尽きが高く、ワークエンゲージメントは平均的であることを示した（抄録）。", "p3": "ユトレヒト・ワークエンゲージメント尺度（UWES）と燃え尽き評価尺度（BAT）で、786件の回答を分析（抄録）。", "p5": "年長の図書館員ほど熱意が高く燃え尽きが低く、多様な性別の人は男女より熱意が低く燃え尽きが高かった。管理職は部門長や一般職より熱意が高かった。子や高齢者の扶養の有無では差がなかった（抄録）。", "fun": "仕事に打ち込む気持ちと、燃え尽きてへとへとな状態は、反対のものに見えます。ところがこの調査では、両方が同時に見られる「熱心なのに疲れている」姿が浮かびました。誰が疲れやすいかを属性ごとに比べたことで、支援が必要な層が見えてきます。", "unverified": "調査対象の国は抄録では未確認。"}}, {"id": "pr36", "rank": 36, "headline": "孤独は他者のための努力をいとわなくさせる", "title": "White-Knuckled Prosociality: Loneliness increases willingness to exert effort to benefit others", "url": "https://doi.org/10.31234/osf.io/u2erk", "authors": "Anita Restrepo ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Restrepo, A., Smith, K. E., Raja, S., Gaspard, C., Mickiewicz, E., Minchev, G., Veillette, J., & Norman, G. (2026). White-Knuckled Prosociality: Loneliness increases willingness to exert effort to benefit others. https://doi.org/10.31234/osf.io/u2erk", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "孤独な人ほど、他人のために体を使って努力する意欲が高いことを実験で示した（抄録）。", "p3": "自己報告の仮想場面ではなく、他者の利益のために身体的な努力を払うかを選ぶ意思決定課題で、孤独と向社会的な努力の関係を調べた（抄録）。", "p5": "孤独は他者のために努力を払う意欲を高めた（抄録の題名と要旨。具体的な効果量は未確認）。", "fun": "寂しい人は人を避ける、と思われがちです。でも孤独は「つながりを取り戻したい」という気持ちも生みます。この研究は、質問に答えてもらうのではなく、実際に握力などの努力を払うかを選ばせることで、孤独な人ほど人のために頑張ることを示しました。", "unverified": "効果量と、探索的に調べた調整要因は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "実存的孤独尺度のドイツ語版の妥当性検証", "title": "Translation and Validation of the German Version of the Existential Loneliness Scale", "url": "https://doi.org/10.31234/osf.io/dqn6m", "authors": "Peter Mohr ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Mohr, P., Hadeei, S., Krasko, J., & Luhmann, M. (2026). Translation and Validation of the German Version of the Existential Loneliness Scale. https://doi.org/10.31234/osf.io/dqn6m", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "実存的孤独尺度（19項目）のドイツ語版を作り、1因子構造と弁別的妥当性を確かめた（抄録）。", "p3": "順翻訳と専門家の確認で翻訳し、ドイツ語話者の成人348人に実施。1因子構造、元のイラン標本との測定不変性、7つの関連概念との弁別的妥当性の3つを事前登録で検証（抄録）。", "p5": "1因子構造は支持され、配置不変と閾値不変は成り立ったが負荷量の不変は成り立たなかった。弁別的妥当性は十分で、社会的・情緒的孤独とも区別された（抄録）。", "fun": "「誰も自分の心の中を本当には分かってくれない」という孤独は、友達の数を増やしても消えません。この研究は、そうした深い孤独を測る物差しを別の言語に移し、同じものを測れているかを確かめました。物差しが国をまたいでどこまで同じかを調べる、尺度研究の基本の手順が見られます。", "unverified": "なし"}}, {"id": "pr38", "rank": 38, "headline": "高齢化した中国の県で社会関係資本を共同生産に", "title": "Social Capital Activation and Co Production in Post Poverty Rural Governance: Five Innovations in an Aging Chinese County", "url": "https://doi.org/10.31235/osf.io/u257n", "authors": "Yi Duan", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Duan, Y. (2026). Social Capital Activation and Co Production in Post Poverty Rural Governance: Five Innovations in an Aging Chinese County. https://doi.org/10.31235/osf.io/u257n", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "高齢化と人口流出の進む中国の山間の県で、眠っていた社会関係資本を統治に生かす5つの工夫を整理した（抄録）。", "p3": "江西省上猶県の2022〜2025年の取り組み（網格管理の統合、長老会による紛争調停、県全体の心理支援、文化施設の観光への転用、就労支援と社区矯正の連動）を、社会関係資本・共同生産・アクティブエイジングの理論で読み解く事例研究（抄録）。", "p5": "5つの工夫は、既にあるが使われていない関係の資源を、意図して構造的な仕組みに変えるという共通の論理を持つと論じた（抄録）。", "fun": "お金も人も足りない地域で、どうやって暮らしを支えるか。この事例では、お年寄りの集まりに争いごとの仲裁を任せるなど、もともとある人のつながりを「仕組み」に組み込みました。新しく何かを作るより、眠っているものを起こすという発想です。", "unverified": "取り組みの効果の定量的な評価は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "日本の市町村の食品小売供給と人口", "title": "Local and Neighboring Food Retail Supply and Population across Japan's Municipalities", "url": "https://arxiv.org/abs/2611.02533", "authors": "Lei Qin", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Qin, L. (2026). Local and Neighboring Food Retail Supply and Population across Japan's Municipalities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02533", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "日本の市町村で、地元と近隣の食品小売の供給がともに人口と正の関係にあることを示した（抄録）。", "p3": "小売が消費の利便を高め、人口密度が出店を支える部分均衡の枠組みを立て、2010・2015・2020年の国勢調査と2012・2016・2021年の経済センサスを使い、空間ラグつきの市町村固定効果モデルで推定（抄録）。", "p5": "地元と近隣の飲食料品小売の供給の係数はそれぞれ0.0893と0.1364で、都道府県×調査回の固定効果を入れても正のままだった（抄録）。", "fun": "スーパーがあるから人が住むのか、人が住むからスーパーができるのか。卵と鶏のような関係です。この研究は、自分の町の店だけでなく隣町の店も人口と結びついていることを示しました。買い物は町境を越えるので、近隣の店まで含めて考える必要があるという点が身近で面白いところです。", "unverified": "係数の単位（対数か水準か）は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "マルチAIエージェントで都市移動を模擬する基盤", "title": "AgenticMobility: An Open-Source Platform for Multi-AI-Agent Mobility Dynamics", "url": "https://arxiv.org/abs/2611.01918", "authors": "Jiaheng Xiao ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Xiao, J., Han, J., Wang, J., Li, H., Sun, L., Axhausen, K., Liu, C., & He, Z. (2026). AgenticMobility: An Open-Source Platform for Multi-AI-Agent Mobility Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01918", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントが旅行者と交通管理者を演じ、経験から適応しながら都市の移動を形づくる実験基盤を公開した（抄録）。", "p3": "持続的な識別と状態を持つエージェントに、情報・行動・決定の時機のインターフェースを定め、MATSim内でLLMエージェントが経路と出発時刻を選び、管理者がリンクの課金を定期的に調整する（抄録）。", "p5": "100日分の模擬を含む予備的な実演を示した（抄録。結果の数値は未確認）。", "fun": "渋滞は、一人ひとりの「この道が早そう」という選択が重なって生まれます。この基盤では、AIが通勤者になりきって毎日道を選び、別のAIが通行料を調整します。人の代わりにAIを住まわせた「ミニチュアの町」で、政策の効き方を試せるのが面白い点です。", "unverified": "予備的な実演の結果は抄録で切れており未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "射影で操作変数の識別条件を緩める", "title": "Estimating Average Treatment Effects with Projected Instrumental Variables", "url": "https://arxiv.org/abs/2611.00705", "authors": "Shuyuan Chen ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Chen, S., & Cui, Y. (2026). Estimating Average Treatment Effects with Projected Instrumental Variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00705", "why": "条件付き期待値を一般の射影に置き換え、操作変数による平均処置効果の識別条件を緩める枠組み。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "共変量が事前トレンドを隠す条件", "title": "When Covariates Mask Pre-Trends", "url": "https://arxiv.org/abs/2611.03079", "authors": "Parush Arora", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Arora, P. (2026). When Covariates Mask Pre-Trends (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03079", "why": "共変量調整つきの差の差分法で、プラセボ推定による事前トレンドの基準が有効な条件を示す。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "個別処置効果の分位点を設計ベースで鋭く推測", "title": "Sharp Design-based Inference for Quantiles of Individual Treatment Effects", "url": "https://arxiv.org/abs/2611.00607", "authors": "Jiangchuan Du ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Du, J., & Li, X. (2026). Sharp Design-based Inference for Quantiles of Individual Treatment Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00607", "why": "識別できない個別効果の分布を、無作為化だけに基づく鋭い推測で扱う方法。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AI採用基盤のモデル比較から市場を学ぶ", "title": "Learning about Markets from Models: Evidence from an AI Hiring Platform", "url": "https://arxiv.org/abs/2611.01226", "authors": "Hossein Alidaee ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Alidaee, H., Khanna, T., & Koning, R. (2026). Learning about Markets from Models: Evidence from an AI Hiring Platform (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01226", "why": "文脈ごとに異なるモデルを持つプラットフォームが、モデル比較から市場の情報を得ることを実証。"}, {"id": "pn05", "rank": 5, "field": "交通・都市計画", "headline": "東京の通勤電車の混雑選好を均衡で推定", "title": "Estimating Rail Commuter Preferences under Endogenous Crowdin nt: Why Inappropriate Workplace Gossip Is More Acceptable When It Targets AI. https://doi.org/10.31234/osf.io/9vuat", "why": "職場の陰口が人ではなくAIに向くと容認されやすいという、人とAIの協働の規範の研究。"}, {"id": "pn09", "rank": 9, "field": "政治学", "headline": "アルゴリズムの再設計で検閲評価の分極が減る", "title": "Algorithmic Intervention Decreases Polarization in Content Moderation", "url": "https://arxiv.org/abs/2611.03072", "authors": "Anna Bertani ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Bertani, A., Mohammadi, S., & Yasseri, T. (2026). Algorithmic Intervention Decreases Polarization in Content Moderation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03072", "why": "XのCommunity Notesで、評価集約の設計変更が評価者の党派的偏りを抑えることを示す。"}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "開かれた環境での再帰的改善でPC操作エージェントを拡張", "title": "CUA-Master: Scaling Computer-use Agents through Open-World Recursive Improvements", "url": "https://arxiv.org/abs/2611.03126", "authors": "Xinlei Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-03", "apa": "Yu, X., Li, G., Zhao, J., Chen, Z., Wang, C., Dong, S., Peng, Z., Xu, Y., Wu, H., Tuo, K., Yang, C., Feng, K., Wu, Y., Zhang, J., Wu, D., Shao, W., Wang, J., & Yue, X. (2026). CUA-Master: Scaling Computer-use Agents through Open-World Recursive Improvements (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03126", "why": "操作データの多様性と信頼性の制約を、再帰的な改善で超えるコンピュータ操作エージェント。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "長期業務を担う協働エージェントの基盤CoworkOS", "title": "CoworkOS:Scaling Agent Coworkers for Real-world Automation", "url": "https://arxiv.org/abs/2611.03178", "authors": "Jiajie Jin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-03", "apa": "Jin, J., Dong, G., Pan, C., Deng, X., Sheng, Z., Wang, G., Gui, T., Zhu, Y., Chen, Y., Yi, S., Hu, B., Yang, Z., Sun, Z., Wang, R., Han, H., Ma, M., Huang, J., Wang, X., Jiang, H., … Dou, Z. (2026). CoworkOS:Scaling Agent Coworkers for Real-world Automation (Version 1). arXiv. https://doi.org/10.48550/A
