<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-12", "intro": "プレプリントの新着1,499件（一覧の候補269件）、学術誌の新着（上位10%誌7,709件・うち一覧の候補337件、その他の学術誌の候補340件・うち一覧の候補153件）、重要論文の候補465件（プレプリント260件・学術誌205件）、新着オープンデータ154件（一覧の候補114件）とe-Statの更新4件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目49報、オープンデータ31件です（論文誌・注目は、統計学と因果推論の候補がなく、工学・機械学習の候補の多くは抄録がなかったため、上位10%誌の新着で補い、基準を満たすものに絞りました。プレプリント・注目には工学の候補がありませんでした。e-Statの更新は貿易統計のみのため選んでいません）。上位10%誌の一覧の更新はHTTP 404で取得できず、9月27日に作った一覧を使いました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "橋梁の同定・ベイズ更新・不確実性を体系化", "title": "Zur Anwendung der Systemidentifikation im Brückenbau", "url": "https://doi.org/10.18726/155713", "authors": "Haslbeck, Matthias", "venue": "Zenodo", "date": "2026-11-11", "apa": "Haslbeck, M. (2026). Zur Anwendung der Systemidentifikation im Brückenbau [Universität der Bundeswehr München]. https://doi.org/10.18726/155713", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された英文の抄録を使用（ドイツ語の学位論文の本文は未取得）", "preprint": true, "p1": "橋梁の実測データを使って有限要素モデルのパラメータを同定し、不確実性つきで更新するための、ソフトウェアに依存しない一貫した枠組みをまとめた学位論文である（抄録）。", "p2": "実測の構造応答と、通常の有限要素モデルの予測の間には食い違いがある。測定データを組み込んで構造の挙動をより正確に表し、モデルの検証・更新・予測の改善の基礎にすることが課題だった（抄録）。", "p3": "不確実性の伝播、分散に基づく感度分析（Sobol指数）、ベイズ推論、確率的なパラメータ推定を理論の枠組みとし、モデルの較正と予測精度の評価にはマルコフ連鎖モンテカルロ法（MCMC）を重点的に使う。入力は実測の応答、出力はパラメータの事後分布と不確実性つきの予測である（抄録）。背景：Sobol指数は、出力のばらつきのうち各入力が担う割合を表す指標。", "p4": "実験の手順、パラメータの選び方、異なるセンサ技術を含む計測システムを、比較の数値的な検討で評価した（抄録）。対象の橋梁と評価指標の具体的な内容は抄録に記載なし。", "p5": "限られたデータでも、パラメータと測定の不確実性を考慮して、実測応答からモデルのパラメータを同定できる。主要な成果は、測定の便益の事前評価、計測計画、適切なパラメータ数の選択、実挙動を最もよく表す数値モデルの同定までを含む枠組みである（抄録）。数値は抄録に記載なし。", "p6": "抄録には著者の述べる限界の記載がない。実橋での検証の範囲、計算費用、モデル化誤差の扱いは、本文を読めておらず未確認。", "fun": "橋の設計図から作った計算モデルは、実際の橋とぴったりは合わない。コンクリートの固さや支点の動きやすさが、図面どおりではないからだ。そこで橋に計測器を付け、測ったたわみや揺れに合うようにモデルの数値を直す。この論文の面白さは、直した値を一つに決めず「このくらいの幅で確からしい」と確率で表し、さらに「測る前に、その計測が役に立つかを見積もる」ところまで手順にした点にある。", "unverified": "学位論文の本文は取得できず、対象橋梁、センサの種類と数、同定精度の数値、検証結果は未確認。"}}, {"id": "pr02", "rank": 2, "headline": "生成モデルで構造特性の非同定性を可視化", "title": "Generative Learning on Manifolds for Probabilistic Seismic Performance Assessment and Structural Identifiability", "url": "https://arxiv.org/abs/2611.12908", "authors": "Dimitris G Giovanis ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Giovanis, D. G., Kevrekidis, I. G., & Ghanem, R. G. (2026). Generative Learning on Manifolds for Probabilistic Seismic Performance Assessment and Structural Identifiability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12908", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法の概要、結果の§3.1・3.2・3.5、考察と限界、図表キャプション）を読んだ。§3.3〜3.4と付録は流し読み", "preprint": true, "p1": "少数の非線形地震応答解析から、構造パラメータと地震応答の同時確率分布を学び、パラメータから応答を予測する順方向の推論と、観測された応答から構造特性を推し量る逆方向の推論を、追加の解析なしで行える枠組みを示した（抄録、§4）。", "p2": "地震時の性能評価は高価な非線形解析に頼るため、不確実性の定量化や、観測応答からの構造特性の推定が難しい。パラメータから応答への決定論的な写像を近似するだけでは、同じ応答を生む複数のパラメータの組を表せない（抄録、§4）。", "p3": "応答の軌跡だけに拡散写像（Diffusion Maps）を適用して低次元の座標に縮約し、6つの構造パラメータはそのまま残して、両者の同時分布をスコアベースの拡散モデルで学習する。生成した座標は幾何調和関数（Geometric Harmonics）で元の応答曲線に戻す（§2.2、図1）。例：9階建て鋼構造骨組の梁端ヒンジの骨格曲線の6パラメータと、18点の変形水準で表した増分動的解析（IDA）の代表曲線を扱う（§3）。", "p4": "160個の構造の実現値（151を学習、9を検証）について、30本の地震動でIDAを行ったデータを使う（§3、表2）。検証用の応答曲線の再構成誤差、生成分布の5〜95%区間に入る割合、応答座標から各パラメータを予測する決定係数（入れ子の交差検証）で評価する（§3.1、§3.2）。", "p5": "6次元の応答座標は検証用9本の曲線を平均二乗誤差の平方根0.0106 gで再構成し、検証用の応答の92.0%が生成分布の区間に入った（§4）。個々のパラメータではキャッピング延性だけが決定係数約0.72〜0.75で復元でき、残留強度比はほぼ復元できない。一方、劣化枝が残留強度に達する回転量という組合せの量は約0.865で復元できた（§3.2、§3.5、図13）。逆推論では、一つの応答状態に対し、確率の約95%を占める二つの異なるパラメータ領域が現れた（§3.5、図14）。", "p6": "著者は、対象が一つの骨組と6パラメータに限られること、学習データが少なく疎な領域で同時分布が不正確になりうること、逆推論が条件づけの帯域幅に依存し検証した実現値が少数であること、地震動のばらつきを中央値に集約していて個々の地震応答の変動は表していないことを限界として挙げる（§4）。", "fun": "建物が大地震でどこまで耐えるかを知りたいとき、柱や梁の粘り強さを表す数値を一つずつ正確に知る必要があると思いがちである。ところがこの研究では、応答から個々の数値はほとんど割り出せないのに、いくつかを組み合わせた量ははっきり割り出せた。さらに、まったく違う二通りの部材の性質が、同じ揺れ方を生むことも分かった。「測れば分かる」とは限らず、何が分かって何が分からないかを先に見きわめる大切さを教えてくれる。", "unverified": "§3.3〜3.4（生成分布の詳細と順方向の条件づけ）と付録は流し読みで、そこにある数値は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "LLMエージェントが非線形システム同定を自走", "title": "ASPIRE: An Agentic System-Identification Platform for Iterative Reasoning and Exploration", "url": "https://arxiv.org/abs/2611.13114", "authors": "Erik Derner ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Derner, E., Kubalík, J., & Babuška, R. (2026). ASPIRE: An Agentic System-Identification Platform for Iterative Reasoning and Exploration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13114", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（枠組みの概要§4.1・評価§4.5、結果§6、考察§7、結論、図表キャプション）を読んだ。関連研究と付録は読んでいない", "preprint": true, "p1": "計測データから非線形の動的モデルを作るシステム同定の作業（手法の選択、物理知識の取り込み、検証）をLLMエージェントに任せ、結果を検証できる記録つきで受け取れる枠組みASPIREを示した（抄録、§4.1）。", "p2": "システム同定は、手法の選択、事前の物理知識の組み込み、モデルの妥当性確認に専門家の判断を要する（抄録）。既存の方程式発見ツールは、物理的な要件を満たさない式を返すことがある（§6.1）。", "p3": "エージェントはデータを調べ、モデル構造を提案し、推定コードを書いて実行し、モデルを説明する。外側のハーネスは命令を作業フォルダで実行し、予算を管理し、提出されたモデルを検査・評価する。テストデータはハーネスが封印し、エージェントからは見えない（§4.1、図1）。動的モデルは、軌跡ごとに一度だけ状態を初期化し、記録された入力で補正なしに伝播させたシミュレーション誤差で評価する（§4.5）。", "p4": "実測の3系（移動ロボット、乾燥摩擦のある回転系、実験室の発酵槽）を、系の説明あり・なしの2条件で各5回、計30回実行した。テスト誤差を方程式発見ツールPySINDy・PySRの式と同じテストデータで比べ、モデルの記録は著者が項目ごとに評価した（§6、表5、表6）。", "p5": "30回すべてが有効なモデルを出し、費用は1回0.96〜3.38米ドルだった（§6、§8）。移動ロボットでは推奨モデルのテスト誤差が0.0379〜0.0443 mで、既定設定のPySR（0.0458〜0.0612 m）より低い。摩擦系では両ツールの12モデルすべてが物理要件に違反したが、エージェントの22候補に違反は示されなかった（§6.1、§6.2）。説明を与えてもテスト誤差は下がらず、式が物理的な項で書かれた形に変わった（§7.1）。記録の150項目のうち132が満たされたが、9つの記録は構造の由来の説明が実行ログと食い違った（§7.2）。", "p6": "著者は、テストデータは著者自身には見えており開発中に使ったこと、言語モデルが1種類で版が固定されていないこと、出力が一つで状態が計測できる系に限られることを限界として挙げる（§7.4）。", "fun": "バネの硬さや摩擦の大きさを実験データから割り出す作業は、どの式の形を仮定するかという職人芸に頼ってきた。この研究は、その作業をAIに任せ、しかも「答え合わせ用のデータ」はしまい込んでAIに見せない仕組みにした。面白いのは、装置の説明を教えても誤差は減らなかったのに、出てくる式が「摩擦で止まる」といった物理の言葉で読める形になったことだ。点数は同じでも、中身の分かりやすさが違ったのである。", "unverified": "対話型の事例研究（§6.5）と付録の推奨モデルの式は読んでいない。PySRとの差の統計的検定は行われていない（表6の注記）。"}}, {"id": "pr04", "rank": 4, "headline": "複合吊り形式橋の温度変位を長期実測で分解", "title": "Temperature‑Induced Displacement Behavior of a Hybrid Cable‑Stayed and Suspension Bridge Based on Long‑Term Field Monitoring", "url": "https://doi.org/10.21203/rs.3.rs-11668393/v1", "authors": "Biehn Baik", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Baik, B. (2026). Temperature‑Induced Displacement Behavior of a Hybrid Cable‑Stayed and Suspension Bridge Based on Long‑Term Field Monitoring. https://doi.org/10.21203/rs.3.rs-11668393/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research Square版のPDF本文（橋の概要、監視システム、温度分布、橋台・支承・主径間中央の変位、まとめ、図表キャプション）を読んだ。温度の算定と数値解析の詳細は流し読み", "preprint": true, "p1": "斜張橋と吊橋を組み合わせた長大橋（トルコのヤウズ・スルタン・セリム橋）で、常設の監視システムの1年分の計測から、温度変化による橋の変位を場所と方向ごとに整理し、平常時の基準となる関係を示した（抄録、p.25）。", "p2": "温度による変形は長大橋の長期の応答の主要な成分だが、供用中の実態は十分に定量化されておらず、とくに鋼とコンクリートの桁が混在する複合構造では知見が少ない（抄録）。これまでは短期・日変化に注目した研究が多かった（p.25）。", "p3": "主径間の鋼桁断面の温度計の日平均から「有効温度」を定義し、桁の温度を一様な成分と断面内の勾配に分ける。これと、橋台・塔の支承・主径間中央の橋軸方向と鉛直方向の変位との関係を、日平均値の線形回帰で調べる（抄録、p.10、p.24）。あわせて設計段階の温度荷重の静的解析の結果と比べる（表1）。", "p4": "全長2,164 m、主径間1,408 mの橋で、2016年12月から記録した温度と変位の約1年分を使う。変位と有効温度の線形関係が明瞭かどうか、実測の振幅が設計時の解析値と同程度かどうかで評価する（p.24）。", "p5": "橋台の橋軸方向の変位は季節変化と明瞭に対応し、夏には冬の基準から約200 mmに達した。橋台と支承の鉛直変位は、橋軸方向の伸縮に伴う二次的な応答と解釈された。主径間中央の鉛直変位は有効温度とよい線形関係を示し、傾きは北側・南側とも1℃あたり−19 mm台、季節による差は最大約600 mmで、解析の予測744 mmと同じ桁だった（図13、図20、p.24）。", "p6": "交通や風の影響は分離していない。塔の支承の変位計には値の飛びや符号の誤りとみられる異常があり、主径間中央の橋軸・橋軸直角方向の変位は温度との関係が不明瞭で評価から外した（p.20、p.23）。相関係数などの統計量は確認できなかった。", "fun": "鉄は温めると伸びる。全長2キロメートルを超える橋では、夏と冬で桁の端が約20センチメートルも動き、真ん中は夏に数十センチメートルも下がる。面白いのは、この動きが温度とほぼ一直線の関係にあることだ。つまり「今日の温度ならこのくらい下がっているはず」と予想でき、そこから外れたときに異常を疑える。さらに、1年分を並べて見たことで、計測器そのものの故障や符号の間違いまで見つかった。", "unverified": "回帰の決定係数、温度勾配と変位の関係の数値、数値解析の条件の詳細は未確認。著者は1名で、査読前の原稿である。"}}, {"id": "pr05", "rank": 5, "headline": "LLM回答者の「自信過剰な誤り」を共形予測で測る", "title": "Uncertainty Calibration for Evaluating LLM Digital Twins", "url": "https://doi.org/10.2139/ssrn.7682466", "authors": "Kang Huang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Huang, K., He, H., & Goli, A. (2026). Uncertainty Calibration for Evaluating LLM Digital Twins. https://doi.org/10.2139/ssrn.7682466", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "LLMを人の回答者の代わり（デジタルツイン、合成回答者）として使うとき、平均の正答率だけでなく、予測ごとに「どれだけ確かに言い当てているか」を共形予測で測る評価の枠組みを示した（抄録）。", "p2": "合成回答者の性能はふつう平均の正答率だけで評価されるが、正答率が同じでも、モデルが回答者の答えをどれだけ確信をもって特定できているかは大きく違いうる（抄録）。", "p3": "共形予測（conformal prediction、指定した確率で正解を含む予測集合を作る方法）で、予測ごとに較正された不確実性を出す。集合が小さいほど確かに言い当てている。8つの共形予測の手法を比べ、ペルソナ情報の種類（属性、性格・心理、認知能力、経済的選好）ごとの寄与も調べる（抄録）。", "p4": "米国の回答者2,000人超・500問超の調査からなるTwin-2K-500データセットに、3つの言語モデルを適用した。目標の被覆率を達成したうえで、予測集合が小さいほど良いという基準で評価する（抄録）。", "p5": "回帰を分類に直す共形予測の手法が、3つのモデルすべてで目標の被覆率を最小の予測集合で達成した。正答率が最も高いモデルが最も狭い集合を出すとは限らなかった。詳しいペルソナは正答率を上げるが不確実性を減らすとは限らず、属性情報が両面で最も安定して寄与した。正答率が低いのに不確実性も低い「自信をもって間違う」群は、保守的な政治志向、宗教・人種の少数派などと強く関連した（抄録）。数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。一つのデータセットと3つのモデルでの結果で、他の調査や言語への一般化、共形予測が前提とする条件の妥当性は、本文を読めておらず未確認。", "fun": "AIに「この人ならアンケートにどう答えるか」を当てさせる研究が増えている。当たる割合だけを見ると優秀に見えても、「たまたま当たった」のか「確信をもって当てた」のかは区別できない。この研究は、AIに答えを一つでなく「この中のどれか」という範囲で出させ、範囲の狭さで確かさを測った。いちばん怖いのは、範囲が狭いのに外れる場合で、それが特定の集団に偏って起きていた。", "unverified": "本文は取得できず、被覆率の目標値、予測集合の大きさ、モデル別の数値、偏りの大きさは未確認。"}}, {"id": "pr06", "rank": 6, "headline": "「包摂への寛容」尺度を日本と英語圏3か国で検証", "title": "Tolerance for Inclusion: Scale Development, Psychometric Evaluation, and Initial Examination of Cross-Contextual Applicability", "url": "https://doi.org/10.31235/osf.io/bg58z", "authors": "Takazumi Ono ほか", "venue": "SocArXiv", "date": "2026-11-11", "apa": "Ono, T., Costantini, H., & Nihei, M. (2026). Tolerance for Inclusion: Scale Development, Psychometric Evaluation, and Initial Examination of Cross-Contextual Applicability. https://doi.org/10.31235/osf.io/bg58z", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）のPDF本文（Methods、Results、Discussionと限界、図表の説明）を読んだ。序論と補足資料は読んでいない", "preprint": true, "p1": "「包摂のための寛容」という概念に基づき、個人の態度と行動を測る8項目の尺度（ITIS）を開発し、日本と英語圏3か国のデータで構造・妥当性・信頼性を評価した（抄録、Methods）。", "p2": "包摂的な社会づくりには成員どうしの寛容が必要とされるが、手助け・配慮・尊重・差別しないことを含む「包摂のための寛容」を個人の水準で測る尺度がなかった。この概念が日本以外にも当てはまるか、既存の寛容尺度と同じものを測るのかも不明だった（抄録、Discussion）。", "p3": "「手助けとケア」「寛大に受け入れる」「多様性の尊重」「特性で差別しない」の4次元に各2項目を置き、4件法で答える。探索的因子分析で候補の構造を出し、確認的因子分析（順序データ向けのWLSMV推定）で比べ、包摂への賛否との関連を修正ポアソン回帰で、再検査の一致を級内相関で調べる（Methods）。", "p4": "日本の調査1（165人）で探索的因子分析、調査2（2,526人）で確認的因子分析と仮説検証、調査3（428人）で再検査信頼性、豪・英・米の調査4（1,114人）で構造妥当性と既存尺度との併存的妥当性を調べた。適合度指標（CFI、RMSEAなど）と因子負荷、α係数と級内相関の0.70を目安とする（Methods、Results）。", "p5": "手助けと受け入れは実証的に分かれず、仮説の4因子モデル（CFI 0.939、RMSEA 0.168）より3因子モデル（CFI 0.975、RMSEA 0.104）が良く当てはまった（図6）。総得点が1標準偏差高いと、包摂的な社会・教育・職場の重要性への同意の割合が12%、16%、15%高い（表3）。総得点の級内相関は0.69だった（表4）。英語圏では既存の寛容尺度との順位相関が0.52で、上位因子への「手助け・受け入れ」の負荷は日本の0.857に対し0.595と低い（Discussion）。", "p6": "著者は、調査会社のオンラインパネルで代表性に限りがあること、対象が4か国に限られること、横断データの因子分析と相関に頼り予測的妥当性が未検証であること、自己報告の偏りを評価していないことを挙げる。総得点が16点に集中し、再検査信頼性も目安をわずかに下回る（Discussion）。", "fun": "「寛容」という言葉は、英語では「嫌なものを我慢する」という意味合いが強いが、日本語の「寛容」には「心が広い」「受け入れる」という響きがある。この研究が面白いのは、同じ質問を日本と英語圏で聞くと、「手助けする」ことと「差別しない」ことの結びつきが日本のほうで強く出た点である。言葉の持つ響きの違いが、質問紙の数字の構造にまで表れている。物差しを作るときは、言葉が運ぶ意味まで測ってしまうことが分かる。", "unverified": "序論、調査4の適合度の数値、補足資料は読んでいない。項目の文言（表1）も確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "アルゴリズム管理は仕事の強度を上げ裁量を分ける", "title": "Algorithmic Management as a Double-Edged Form of Digital Work Design: Job Demands, Autonomy and Employee Outcomes across 35 European Countries", "url": "https://doi.org/10.21203/rs.3.rs-11446329/v1", "authors": "Fahri Alp Erdoğan ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Erdoğan, F. A., Akdemir, M. A., & Sağbaş, M. (2026). Algorithmic Management as a Double-Edged Form of Digital Work Design: Job Demands, Autonomy and Employee Outcomes across 35 European Countries. https://doi.org/10.21203/rs.3.rs-11446329/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（研究設計§3.1・測定§3.2・推定§3.4、結果§4.4〜4.7・§4.11、限界§5.2）を読んだ。理論の節と一部の頑健性の節は読んでいない", "preprint": true, "p1": "計算機による管理（タスクの割当、勤務時間の決定、成績の監視）を一括りにせず機能別に分けると、仕事の強度を上げる点は共通だが、裁量への関連は機能ごとに逆向きになることを、欧州35か国の大規模調査で示した（抄録、§4.4）。", "p2": "計算機による管理が、仕事の要求（強度）と資源（裁量）の両方を通じて従業員の状態とどう関連するかを、機能を分けて同時に調べた大規模な証拠が乏しかった。先行の分析は仕事の強度だけを媒介とするモデルだった（抄録、§3.1）。", "p3": "仕事の要求度-資源モデル（Job Demands-Resources）に沿い、3つの管理の機能を説明変数、仕事の強度（要求）と自律性（資源）を並列の媒介変数、ワーク・エンゲージメントと離職意図を結果とする構造方程式モデルを、順序データ向けの推定法（WLSMV）と較正ウェイトで推定する。間接的な関連は係数の積で表し、2つの経路の和を合成の間接関連とする（§3.4）。", "p4": "2024年の欧州労働条件調査の被雇用者26,504人を使う。国・職業・産業の固定効果を加えたモデル、量的な要求だけに絞ったモデル、調査設計を考慮した検討、国をまたぐ測定不変性の診断で頑健性を確かめる（§3.1、§4.4、§4.11）。", "p5": "仕事の強度への標準化係数は、割当0.081、勤務時間0.058、監視0.138ですべて正だった。自律性へは割当が正（0.097）、監視が負（−0.060）で、勤務時間の負の関連は固定効果を入れると有意でなくなった（表4）。割当は、強度を介した負（−0.016）と自律性を介した正（0.018）の間接関連が打ち消し合い、合成はほぼゼロ（0.002）だった。監視は両経路とも負で、合成は−0.038だった（表5）。離職意図への間接関連は、強度の経路だけが一貫して正だった（§4.7）。", "p6": "著者は、横断の自己報告で因果も時間的な順序も示せないこと、項目は計算機の関与の報告でありAIの利用そのものを測っていないこと、国をまたぐ測定の同等性が完全には成り立たないこと、完全ケース分析で4,066人を除いたことを限界として挙げる（§5.2）。係数はいずれも小さい。", "fun": "コンピュータが仕事を割り振り、勤務時間を決め、成績を見張る。まとめて「アルゴリズム管理」と呼ばれるが、中身は同じではなかった。仕事の割り振りを機械に任せると、忙しくはなるが、やり方を自分で決められる余地はむしろ広い傾向があった。一方、見張りは忙しさと結びつき、自由の少なさとも結びつく。良い面と悪い面が打ち消し合うと、全体では「関係なし」に見えてしまう。平均だけを見ると大事な違いを見落とす、という教訓である。", "unverified": "理論の節（§2）、記述統計（§4.1）、量的要求だけのモデル（§4.9）と調査設計の検討（§4.10）の数値は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "言語モデルで「同業なのに違う決算書」を測る", "title": "Same Business, Different Books: Language Models Reveal Where Financial Reporting Comparability Breaks Down", "url": "https://doi.org/10.2139/ssrn.7685130", "authors": "Sidhartha Sharma", "venue": "SSRN", "date": "2026-11-11", "apa": "Sharma, S. (2026). Same Business, Different Books: Language Models Reveal Where Financial Reporting Comparability Breaks Down. https://doi.org/10.2139/ssrn.7685130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "企業の経済的な類似を、会計数値とも業種分類とも独立に言語モデルで測り、会計の比較可能性を「似たものが似て見えるか」と「違うものが違って見えるか」の二つの条件に分けて測れるようにした（抄録）。", "p2": "概念フレームワークは比較可能性を二つの条件で定義するが、既存の実証的な尺度は「似たもの」を業種の所属で定義するため、二つの条件を切り分けられない（抄録）。", "p3": "各社の事業の記述（社名などを伏せ、AIで生成したもの）を言語モデルで埋め込み、この経済空間での近傍企業と、百分率に直した財務諸表全体の空間での近傍企業を比べる。「偽の相違」は会計が企業を経済的な同類からどれだけ離して置くか、「偽の類似」は会計上の同類が経済的にどれだけ遠いかを表す（抄録）。", "p4": "2000〜2021年の米国企業55,483企業・年を使う。二つの指標が既存の尺度（財務諸表の類似度、利益とリターンの比較可能性）と区別されるか、独立の3つの経済的な基準の間で一致するかを確かめ、アナリストのカバレッジと、同業他社による評価の誤差との関連を調べる（抄録）。", "p5": "両指標は既存の尺度とは別のものを測り、偽の相違は3つの基準の間でよく一致した。偽の相違の一部は規模と基礎的条件の実際の違いを映し、それを除くと、経済的に似た企業は営業項目を同じように報告する一方、財務・税・年金・非経常項目で分かれ、監査人が同じだとその差は小さい。偽の相違はアナリストのカバレッジのやや低さと関連し、リース会計基準（ASC 842）はリースの多い企業の貸借対照表を経済的な同類に近づけなかった（抄録）。数値は抄録に記載なし。", "p6": "利用者への費用の証拠は、枠組みの対称的な記述が示唆するより狭く、評価の誤差との関連は規模の不一致を映すにとどまると著者自身が述べる（抄録）。事業記述の生成と埋め込みの妥当性、因果関係の識別は、本文を読めておらず未確認。", "fun": "同じような商売をしている二つの会社なら、決算書も似ているはずである。しかし「同じような商売」をどう決めるか。これまでは業種の分類に頼ってきたが、同じ業種でも中身はさまざまだ。この研究は、会社の事業の説明文をAIに読ませて「商売の似かた」を数字にし、決算書の似かたと突き合わせた。すると、本業の数字は似ているのに、借金や税金や年金の書き方で食い違うことが分かった。どこで比べにくくなるかを特定した点が新しい。", "unverified": "本文は取得できず、埋め込みに使った言語モデル、指標の式、係数の大きさ、頑健性の検討は未確認。著者は1名のワーキングペーパーである。"}}, {"id": "pr09", "rank": 9, "headline": "IFRS準拠の検証を複数LLMと学習型集約で", "title": "IFRS Compliance Verification: An Open Multi-LLM Benchmark and Content-Conditioned Ensemble Classifier", "url": "https://arxiv.org/abs/2611.13595", "authors": "Aghoghomena Akasukpe ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Akasukpe, A., Yang, L., Zhou, X., Shen, C., & Martin, M. V. (2026). IFRS Compliance Verification: An Open Multi-LLM Benchmark and Content-Conditioned Ensemble Classifier (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13595", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ構築§3.1、分類器§3.5、分類の結果§4.2、限界、表2）を読んだ。埋め込みの学習と検索の結果（§3.4、§4.1）と付録は読んでいない", "preprint": true, "p1": "企業の開示がIFRSの規定を満たすかを段落の対で判定する課題について、公開のベンチマークを作り、複数のLLMの判定を内容も見て束ねる学習型の分類器で、単独のLLMや多数決より高い精度を出した（抄録、§4.2）。", "p2": "規定への準拠の検証は、専門家が開示と数百の細かな規定を突き合わせる、手間と費用のかかる作業である。単独のLLMの精度は実務には足りず、素朴な多数決は、あるモデルの系統的な偏りに引きずられて最良の単独モデルを下回ることがある（抄録、§4.2）。", "p3": "規定の段落と開示の段落の対に「準拠・非準拠・該当なし」を付ける3クラス分類とする（§3.1）。3つのLLMが出すクラス確率とその統計（29次元）に、領域に適応させた文埋め込み（1,536次元）を連結し、人のラベルで勾配ブースティング木を学習する。「各モデルが何と言ったか」だけでなく「その対が何を述べているか」も見て最終判定を出す（§3.5）。", "p4": "IASBの18基準の3,489段落と、329社の監査済み年次財務諸表の39,404段落から、検索で上位に来た対19,998件を作った。3つのLLMが一致した11,161件はそのラベルを使い、割れた8,837件に人が注釈した。評価は割れた項目での重みつきF1などで、11の教師なしの集約手法と比べる（§3.1、§4.2、表2）。", "p5": "割れた項目での重みつきF1は、提案の分類器が0.817、最良の単独モデルが0.713、多数決が0.671、最良の教師なし集約が0.722だった（表2）。あるモデルは予測の95.5%を「非準拠」とし、人との一致がほぼ偶然の水準（κ=0.019）で、これが多数決を引き下げた。確率の特徴だけでは0.727で頭打ちになり、埋め込みを加えて改善した（§4.2）。", "p6": "著者は、判定が段落の対の水準で申告書全体の準拠を示さないこと、検索の上位5件に限った条件つきのベンチマークであること、一致した項目のラベルは人が検証していないこと、人の注釈者間の一致が中程度（κ=0.39）であること、英語・単一の領域・3モデルに限られることを挙げる（Limitations）。", "fun": "三人の採点者の多数決は、一人ひとりより正確になる、と思いたくなる。ところがこの研究では、多数決がいちばん優秀な一人に負けた。採点者の一人が、ほとんど何でも「不合格」と答える癖を持っていたからである。そこで、誰が何と答えたかに加えて「どんな問題だったか」も見て、誰を信じるかを問題ごとに変える仕組みを作った。みんなの意見をただ数えるのでなく、得意と不得意を見分けて聞く、という発想である。", "unverified": "検索の評価（§4.1）と埋め込みの3段階の学習の詳細、付録の追加実験は読んでいない。データと実装は「公開予定」とされ、公開の有無は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "表形式基盤モデルが翌年の利益変化予測で最良", "title": "Tabular Foundation Models in Financial Predictions", "url": "https://arxiv.org/abs/2611.13550", "authors": "Ed deHaan ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "deHaan, E., & Huang, A. H. (2026). Tabular Foundation Models in Financial Predictions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13550", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（課題と標本§3.1、主な比較§3.3・§3.4・§3.6、訓練標本を減らした分析§4.3、結論§6）を読んだ。モデルの解説（§2）と他の設定の比較（§5）は読んでいない", "preprint": true, "p1": "合成データで事前学習した表形式基盤モデル（tabular foundation model）を会計研究に持ち込み、翌年の利益が増えるかの予測で、微調整した言語モデルや木モデルより高い精度を、学習なしで出せることを示した（抄録、§3.3）。", "p2": "財務諸表から将来の利益を予測する課題では、木モデルは設定の探索に手間がかかり、言語モデルの微調整は計算費用が大きい。実データで事前学習した言語モデルには、企業の結果を覚えていることによる先読みの偏りの懸念もある（§3.1、§3.4）。", "p3": "表形式基盤モデルは、解きたい問題のラベルつきの訓練データを文脈として与えるだけで、追加の学習や調整なしに予測を出す（文脈内学習）。事前学習は合成の表データだけなので、会計の知識も企業の結果の記憶も持たない（§6）。例：当年と過去の損益計算書・貸借対照表の130の変数を入力に、翌年に純利益が増える確率を出力する（§3.1）。", "p4": "2005〜2024年の7,446社・62,796企業年を使い、先行研究と同じく2023年と2024年の財務諸表を検証年とする。指標はAUC（増益の企業年を非増益より上位に並べられる確率で、50%が無情報）で、差は企業を単位とした対のブートストラップで検定する（§3.1、§3.3）。", "p5": "AUCはTabFMが69.53%、微調整したLlamaが67.88%、木モデルは62.75〜63.78%だった（表2A）。TabFMの優位は統計的に高度に有意で、ROC曲線もほぼ全域で他を上回る（図1A）。TabFMの予測は11.83分で済み、Llamaの微調整は約108時間かかる（§3.4）。訓練データを5%に減らしてもAUCは64.47%で、全データを使った木モデルを上回った（§4.3）。", "p6": "著者は、結果が一つの課題・一つの標本・一組の予測変数に基づき、どの手法も普遍的に優位とは言えないこと、記憶していないという前提は開発者の報告に依存することを注意点として挙げる。同じモデルで予測を何度も出す用途や、速さが要る用途では木モデルが有利である（§3.6、§6）。", "fun": "来年、この会社の利益は増えるか。これを当てるのに、大量の文章を読んだ賢い言語AIを、長い時間をかけて財務データで鍛え直す方法がある。ところが、本物のデータを一度も見たことがなく、人工的に作った表だけで練習してきた「表専用のAI」に、例題を見せてその場で答えさせたほうが、よく当たった。しかも十数分で済む。未来の答えを覚えているはずがないので、先読みの疑いも小さい。知識より「表の読み方」が効くという結果が面白い。", "unverified": "数値の摂動への感度（§3.5）、年別・変数を除いた分析（§4.1、§4.2）、他の表形式基盤モデルとの比較（§5）は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "LLMの模擬参加者で心理メカニズムの各段を検証", "title": "Agent Psychonomicus: Psychological Mechanisms Emerge In Cognitive Agents Simulated By Large Language Models", "url": "https://doi.org/10.2139/ssrn.7683658", "authors": "Jack Chen ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Chen, J., Xiao, W., & Chen, L. (2026). Agent Psychonomicus: Psychological Mechanisms Emerge In Cognitive Agents Simulated By Large Language Models. https://doi.org/10.2139/ssrn.7683658", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "LLMで心理実験の参加者を模擬するとき、最終の答えだけでなく、理論が想定する心理メカニズムの各段階が働いたかを検証できる認知モデルの枠組みを示した（抄録）。", "p2": "LLMによる模擬参加者では、研究者が観察できるのは答えだけで、実験操作が、理論の言う心理メカニズムを通じて働いたのかどうかは分からない（抄録）。", "p3": "12体のLLMエージェントの集まりが、状況が自己にどう関わるかの評価といった一般的な認知過程を実行し、その結果を一人称の「過程の言明」として出力する最小限の認知エージェント（MVCA）を実装した。媒介変数に当たる過程を言明の中で直接誘導して、結果への因果効果も調べる（抄録）。", "p4": "3つの異なるLLMで、公刊された60の実験について57,147回の認知シミュレーションを行い、六十万件を超える過程の言明を分析した。理論の想定する媒介過程が現れるか、大規模な事前登録の追試で再現された効果とされなかった効果を見分けられるかで評価する（抄録）。", "p5": "理論が想定する心理メカニズム（媒介変数）は、MVCAの一般的な過程から現れた。その過程を直接誘導すると、実験の結果に因果的な効果があった。追試で再現された原効果のほうが、再現されなかった効果より有意に高い割合でMVCAでも現れた（抄録）。割合の数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。過程の言明がモデル内部の計算を忠実に表すとは限らないこと、対象の60実験の選び方、効果量の一致の程度は、本文を読めておらず未確認。", "fun": "AIに心理実験の参加者役をさせると、人間と同じ答えを返すことがある。だがそれは、人間と同じ「心の動き」を経た結果なのか、たまたま答えが合っただけなのか。この研究は、AIに「いま自分はこの状況をこう受け止めた」と途中経過を言葉にさせ、理論どおりの動きが起きているかを確かめた。しかも、のちの追試で確かめられた効果と、再現できなかった効果を、AIの模擬がある程度見分けた。答えでなく途中を調べるという発想が新しい。", "unverified": "本文は取得できず、使用したLLMの名称、60実験の一覧、再現の一致率の数値は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "仮想将来世代の導入で自治体職員の熟議が変わる", "title": "Promoting Policy Integration for Carbon Neutrality and Disaster Prevention by \"Imaginary Future Generations\": A Deliberative Experiment with Government Officials", "url": "https://doi.org/10.2139/ssrn.7684490", "authors": "Yamato Sugita ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Sugita, Y., Okuda, M., Fuchigami, Y., & Hara, K. (2026). Promoting Policy Integration for Carbon Neutrality and Disaster Prevention by “Imaginary Future Generations”: A Deliberative Experiment with Government Officials. https://doi.org/10.2139/ssrn.7684490", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "複数の自治体と省庁の職員による熟議に「仮想将来世代」（将来の世代になりきって考える役割）を取り入れると、脱炭素と防災を統合した政策案が出やすくなることを示した（抄録）。", "p2": "2050年までの脱炭素と、気候変動に伴う災害への備えは、ともに急ぐ課題である。両者を、自治体間の連携と長期の影響を踏まえて統合的に考えるための新しい方法が求められていた（抄録）。", "p3": "人と社会の「将来可能性」を引き出す方法として使われてきた仮想将来世代を、自治体の職員と省庁の担当者が脱炭素と防災の統合政策を検討する熟議の実践に組み込み、討議の内容、意思決定、質問紙への回答を分析した（抄録）。", "p4": "現在の取り組みと異なる政策案が生まれるか、脱炭素と防災の両分野にまたがる議論が進むか、政策立案で重視する基準がどう変わるかを見る（抄録）。参加者数と比較条件の詳細は抄録に記載なし。", "p5": "仮想将来世代の導入は、現行の取り組みとは異なる政策案の創出と、両分野を横断する議論の促進に有効だと示唆された。また「政策の実現可能性」と「住民と議会の理解を得ること」という基準の重要度の認識が下がった。これらは政策立案の主要な基準であると同時に、抜本的な政策を考えるときの制約にもなる（抄録）。数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。参加者の人数、対照となる条件の有無、変化の統計的な検定、熟議のあとの実際の政策への反映は、本文を読めておらず未確認。", "fun": "将来の世代の住民になったつもりで今の政策を考えてください、と言われたら、考えは変わるだろうか。この研究では、自治体や省庁の職員にそうしてもらった。すると、「実現できるか」「住民や議会が納得するか」という、ふだん最も気にしている物差しの重みが下がり、分野の壁を越えた案が出てきた。立場を一つ変えるだけで、自分を縛っていた前提がゆるむ。役割を演じることが、発想の道具になるという点が面白い。", "unverified": "本文は取得できず、熟議の回数と手順、参加した自治体、質問紙の項目と結果の数値は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "亀裂のある多孔質体の流れ・変形・摩擦接触を解析", "title": "Numerical analysis of coupled flow, deformation and frictional contact mechanics in a fractured porous medium", "url": "https://arxiv.org/abs/2611.14341", "authors": "Marius Nevland ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Nevland, M., Kumar, K., Berre, I., Both, J. W., & Keilegavlen, E. (2026). Numerical analysis of coupled flow, deformation and frictional contact mechanics in a fractured porous medium (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14341", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、誤差評価§4.4の定理、数値実験§5、結論§6）を読んだ。変分定式化と証明の詳細（§3、§4.2〜4.3、付録）は読んでいない", "preprint": true, "p1": "亀裂のある多孔質体で、流れ・変形・亀裂面の摩擦接触が連成する問題について、完全に離散化した数値解法の解の一意存在、安定性、収束の速さを数学的に証明した（抄録、§6）。", "p2": "地下への貯留や地熱開発で使うこの種のモデルは非線形性が強く、接触条件を含めた厳密な数値解析は難しい。先行研究では、接触条件の組合せによっては、格子と時間刻みを細かくしたときに連続な解へ収束することが証明されていなかった（§1）。", "p3": "亀裂を一つ次元の低い面として扱う混合次元モデルで、母材と亀裂のDarcy流れ、母材の線形粘弾性、亀裂面の接触（法線方向は食い込みに応じて反力が出るコンプライアンス則、接線方向はCoulomb摩擦）を連成させる。空間は適合有限要素、時間は陰的Euler法で離散化すると、流体の質量保存の2つの線形方程式と、固体の運動量保存の非線形変分不等式の連立になる（抄録、§6）。", "p4": "理論では、変位と圧力の和に対する時空間のエネルギーノルムでの事前誤差評価を導く（§4.4、定理4.3）。数値実験では、単位正方形に水平な亀裂を一つ置き、解析解がないので細かい離散化の数値解を参照解として、空間と時間の収束次数を別々に測る（§5）。", "p5": "誤差評価の収束次数は時間について最適で、空間については主要項が平方根の分だけ下がる。これは接触問題に典型的である（§6）。実験では、時間について全変数で1次の最適な収束が得られた（表3）。圧力の空間収束は亀裂の先端付近の正則性の低さで下がり、先端の周りを除くと1次に回復した。変位の空間収束は先端を除いても1次に届かなかった（§6）。", "p6": "誤差評価は解に比較的強い正則性を仮定する（§4.4）。浸透率は母材・亀裂とも定数とした線形化モデルで、体積ひずみや亀裂幅に依存する浸透率への拡張は未解決である。接触問題の最適なL2誤差評価も今後の課題とされる（§6）。数値実験は2次元の一例である。", "fun": "岩盤の割れ目に水が入ると、水圧で割れ目が押し広げられ、こすれ合っていた面がずれやすくなる。ずれると水の通り道が変わり、また水圧が変わる。このように流れ・変形・摩擦が互いに影響し合う問題を、コンピュータで解いた答えは本当に正しいのか。この論文は、格子を細かくすれば確かに正解に近づくことと、その近づく速さを証明した。面白いのは、割れ目の先端という一点の「とがり」が、全体の計算の精度を下げていた点である。", "unverified": "証明の詳細と、空間収束の表の数値は確認していない。時間刻みの条件の定数の意味も未確認。"}}, {"id": "pr14", "rank": 14, "headline": "熱力学的に整合な弾塑性のニューラル構成則", "title": "Thermodynamically consistent neural constitutive models for elastoplasticity via eigen-representations", "url": "https://arxiv.org/abs/2611.13162", "authors": "Harikrishnan Vijayakumaran ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Vijayakumaran, H., Yin, S., Abendroth, M., Bessa, M. A., & Kalina, K. A. (2026). Thermodynamically consistent neural constitutive models for elastoplasticity via eigen-representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13162", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（目的と貢献§1.2、結果の概要§5、フォーム材料の結果§5.3、結論§6）を読んだ。枠組みと構造の詳細（§2〜§4）と古典モデルの再現（§5.1、§5.2）は流し読み", "preprint": true, "p1": "金属や発泡体などの弾塑性の材料モデルを、熱力学の法則と等方性を構造として必ず満たすニューラルネットで表し、降伏関数とその発展則を応力–ひずみデータから同時に学習できるようにした（抄録、§1.2）。", "p2": "ニューラルネットの材料モデルは、古典的な閉じた式より柔軟に降伏曲面と硬化則を表せるが、陰的なリターンマップを通して端から端まで学習させるのは難しい。主値が重なる点（固有値の縮退）では微分が特異になり、学習が不安定になる（抄録、§1.2）。", "p3": "流れの方向を決める凸な流動ポテンシャルに、同時に学習する付加項を足したものを降伏関数とし、非関連流れ則でも熱力学的整合性が構成から保証されるようにする。等方性と凸性は、テンソルの固有値を入力とし並べ替えに不変な表現で課す。時間積分は後退Euler法のリターンマップで行い、勾配は陰関数定理で伝え、縮退でも安全な微分を使う（抄録、§1.2）。", "p4": "真の法則が分かっている古典モデル（理想塑性、等方硬化、移動硬化）の再現、等方性を課さない基準モデルとの比較、真の法則が閉じた式で分からない開気孔フォームの代表体積要素のデータで評価する。指標は応力の正規化誤差（NRMSE）などである（§5）。", "p5": "フォームのデータでは、非関連流れの設定のテストNRMSEが4.44%で、関連流れの基準の5.01%より相対的に約11%低かった（表9）。学習した降伏曲面は静水圧がゼロ付近で最大かつ円形に近く、引張側と圧縮側では小さく回転した三角形になる。関連流れからのずれは静水圧が極端になるほど大きい（§5.3、図12）。", "p6": "対象は微小ひずみの等方性材料に限られ、異方性材料と有限ひずみへの拡張は今後の課題とされる（§6）。学習データは主にシミュレーションで作られており、実験の変位場からの直接の学習も今後の課題である。フォームでの二つの設定の誤差の差は小さいと著者も述べる（§5.3）。", "fun": "針金を曲げると、ある力を超えたところで元に戻らなくなる。この「戻らなくなる境目」と「その後の変形の進み方」を式に表したものが材料の構成則で、昔から人が工夫して式を作ってきた。この研究は、その式の形をAIに学ばせる。ただし好き勝手に学ばせると、エネルギーが何もないところから湧くような、物理に反する材料ができてしまう。そこで、物理の約束を「守らざるを得ない形」として、ネットワークの構造そのものに埋め込んだ。", "unverified": "古典モデルの再現の誤差の数値（§5.1）、等方性を課した効果の数値（§5.2）、付録の比較は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "携帯位置データで空き店舗に入れる業種を最適化", "title": "Revitalizing Urban Retail: Allocating Vacant Storefronts with Smartphone Location Data", "url": "https://doi.org/10.2139/ssrn.7682805", "authors": "Hansheng Jiang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Jiang, H., Zhang, J., & Brown, C. (2026). Revitalizing Urban Retail: Allocating Vacant Storefronts with Smartphone Location Data. https://doi.org/10.2139/ssrn.7682805", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "商業地区の空き店舗に、どの業種の店をどこに入れると良いかを、スマートフォンの位置データから推定した需要モデルと最適化で決める枠組みを示した（抄録）。", "p2": "新しい店は、目的地としての需要を既存の店と奪い合う一方で、来た人が他の店にも回る来訪を生む。どの業種をどこに入れるかの判断は互いに絡み合っており、別々には決められない（抄録）。", "p3": "端末単位の位置データから、業種別の店舗数が、出発地でのトリップの発生と目的地の選択の両方を決める空間需要モデルを推定する。計画者は、トリップの発生と小売の目的地へのアクセスを評価するログサム型の目的関数を、地区ごとの空き容量と業種ごとの追加数の上限のもとで最大化する。業種間の補完と代替は、流れの効果と、共通の出発地からの需要の奪い合いに分解して特徴づける（抄録）。", "p4": "マンハッタンとブルックリンの85の郵便番号区域で、約一億一千二百万件の買物・余暇のトリップと10万を超える施設のデータを使う。得られた配分の良さは、凹な緩和から得る大域的な上界と、既存の店舗数に比例して埋める方法との比較で確かめる（抄録）。", "p5": "推定したモデルでは、対象となる地区と業種の対の組合せの99.0%が、計画者の目的関数にとって補完的だった。配分は全体として飲食店とカフェを優先し、優先順位は地区によって異なる。制約つきの比例配分に対して得られる最大の改善の少なくとも99.993%を達成し、同じ目的関数の値を既存の店舗数に比例した拡大で得るには43.3%多い出店が要る（抄録）。", "p6": "抄録には限界の記載がない。位置データの偏り、売上や賃料ではなくトリップに基づく目的関数の妥当性、提案した配分の実現可能性は、本文を読めておらず未確認。", "fun": "シャッターの閉まった空き店舗に、何の店を入れれば街がにぎわうか。パン屋を入れれば隣のカフェの客を奪うかもしれないし、逆にパンを買った人がカフェにも寄るかもしれない。この研究は、膨大な人の移動の記録から「店どうしが客を奪い合うか、呼び合うか」を調べた。すると、ほとんどの組合せは呼び合う関係だった。店は競争相手である前に、互いに街へ人を呼ぶ仲間でもある、という見方がデータで裏づけられた。", "unverified": "本文は取得できず、需要モデルの推定方法の詳細、データの期間、解法の計算時間は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "慣性オドメトリのフィルタを微分可能にして学習", "title": "Differentiable Filtering for Inertial Odometry", "url": "https://arxiv.org/abs/2611.13517", "authors": "Yaru Gu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gu, Y., & Zou, T. (2026). Differentiable Filtering for Inertial Odometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13517", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "慣性センサだけで移動軌跡を推定する慣性オドメトリ（inertial odometry）で、ニューラルネットの出力とカルマンフィルタの更新を一体で学習し、ドリフトを減らした（抄録）。", "p3": "誤差状態カルマンフィルタ（error-state Kalman filter）の更新段階を計算グラフに埋め込み、事前学習のあと、変位と共分散の出力を事後位置の教師信号で同時に最適化する（抄録）。", "p5": "歩行者データで、平均絶対誤差と1秒相対並進誤差を基準手法TLIOより13.2%と39.6%、事前学習のみのモデルより7.7%と17.4%減らした（抄録）。", "fun": "加速度を積分して位置を出すと、小さな雑音が積もってどんどんずれていく。従来は「ずれを直す部品」と「推定する部品」を別々に鍛えていたが、この研究は二つをつないで、最終的な位置が合うように一緒に鍛える。個人練習だけでなく、チームで合わせる練習をしたほうが試合に強くなるのに似た発想である。", "unverified": "本文を読めていないため、データセットの規模、フィルタの状態の構成、未校正のスマートフォンデータでの数値は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "非同期のWiFiとIMUを連続時間で統合し測位", "title": "Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization", "url": "https://arxiv.org/abs/2611.13057", "authors": "Mohamed Bachar (LINEACT) ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bachar, M., Abouelaziz, I., & Ding, Y. (2026). Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13057", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "WiFiの電波強度と慣性計測という、時刻のそろわない二種類のセンサ列を、共通の時計に並べ直さずにそのまま統合して屋内測位する方法を示した（抄録）。", "p3": "各観測を、測定値・センサの種類・取得からの経過時間を持つ時刻つきトークンの集合として表し、一つの注意機構でまとめて融合する。学習時に種類ごと・観測ごとの欠落を無作為に作り、欠測や古い入力に耐えるようにする（抄録）。", "p5": "別の日に集めたデータを含む実データで、公開のWiFi指紋法の基準を上回り、学習型の融合や推測航法の基準とは同程度で、観測が欠けたり古くなったりしても性能はゆるやかに下がるにとどまった（抄録）。数値は抄録に記載なし。", "fun": "二つのセンサが別々のリズムで測っていると、同じ瞬間のデータがそろうことはほとんどない。ふつうは時刻をそろえ直すが、この研究は「いつ測ったか」を各データに添えたまま、ばらばらの集まりとして読ませる。順番に並べ直さなくても、名札に時刻が書いてあれば話がつながる、という考え方である。", "unverified": "本文未読のため、測位誤差の値とデータセットの規模は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "地下鉄振動を砂・セラムサイト充填杭で低減", "title": "Field application of sand-ceramsite in-filled pile barrier in mitigating metro train-induced vibrations", "url": "https://doi.org/10.21203/rs.3.rs-11065152/v1", "authors": "Weili Luo ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Luo, W., & Deng, S. (2026). Field application of sand-ceramsite in-filled pile barrier in mitigating metro train-induced vibrations. https://doi.org/10.21203/rs.3.rs-11065152/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "地下鉄の走行で生じる地盤振動を、砂とセラムサイト（軽量の焼成粒）の混合材を詰めた杭の列で遮る対策を、現場に適用して効果を測った（抄録）。", "p3": "振動の伝播経路に杭列を設置して原位置試験を行い、実測で検証した有限要素モデルで杭の列数・間隔・充填材の剛性の影響を調べた（抄録）。", "p5": "地盤振動を最大63%低減し、挿入損失の平均の最大は14.6 dBだった。列数を増やす、杭間隔を狭める、ヤング率の低い充填材を使うほど効果が高まる（抄録）。", "fun": "電車が通ると、揺れが地面を伝わって家まで届く。この研究は、道筋の途中に「やわらかい詰め物をした杭の壁」を並べて揺れを弱めた。意外なのは、固い材料より、やわらかい（ヤング率の低い）詰め物のほうがよく効くという点で、硬い壁で跳ね返すのとは違う効き方をしている。", "unverified": "本文未読のため、測定点の配置、対象の周波数帯、地盤条件は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "無人車両の自己位置制御にオンライン同定", "title": "Self-Position Control of Unmanned Vehicle Using Online System Identification", "url": "https://doi.org/10.21203/rs.3.rs-11400768/v1", "authors": "Ehab Safwat ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Safwat, E., Ouda, A. N., & Mohamed, A. (2026). Self-Position Control of Unmanned Vehicle Using Online System Identification. https://doi.org/10.21203/rs.3.rs-11400768/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "走行中の無人地上車両のモデルのパラメータを逐次推定し、その推定値を使って自己位置を制御する方法を示した（抄録）。", "p3": "ローバー車両を対象に、逐次最小二乗法（Recursive Least Squares）で未知のパラメータをオンラインで推定し、推定を続けながら働く自己位置制御器を設計した（抄録）。", "p5": "シミュレーションで、同定したモデルがローバーのモデルに合い、制御器の性能が高いと報告する（抄録）。誤差などの数値は抄録に記載なし。", "fun": "車は荷物や路面で性質が変わるのに、制御の設計では決まった値を使うことが多い。この研究は、走りながら「いまの自分の車の性質」を測り直し、その値で舵を切る。毎日体重計に乗って食事を調整するように、測ることと合わせることを同時に回す考え方である。", "unverified": "検証はシミュレーションと読め、実機での結果や誤差の値は抄録からは未確認。"}}, {"id": "pr20", "rank": 20, "headline": "物理の連鎖で故障診断を支えるLLM推論", "title": "Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning", "url": "https://arxiv.org/abs/2611.14263", "authors": "Wenqi Zhou ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhou, W., Baldo, L., Goebel, K., & Chao, M. A. (2026). Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14263", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "設備の参考資料から自動で作った知識グラフを使い、LLMに「故障→物理量の変化→それを捉えるセンサ」の連鎖をたどらせて故障診断の精度を上げた（抄録）。", "p3": "故障モード・物理量の変化・監視センサを結ぶ診断の連鎖を制約つき知識グラフに蓄え、質問に似た経路を検索して情報と例示の両方に使う。候補の故障モードごとにLLMが連鎖を生成し、最後に選択肢と照合する（抄録）。", "p5": "FailureSensorIQベンチマークの4種の産業設備と3つのLLMで、直接の質問より7.8〜19.6ポイント、通常の検索拡張生成より11.7〜18.2ポイント正答率が上がった（抄録）。", "fun": "ベテランの技術者は「この部品が壊れると温度が上がり、だからこのセンサに出る」と理由の鎖をたどって原因を当てる。この研究は、その鎖を説明書から自動で地図にして、AIに同じたどり方をさせた。知識を丸ごと渡すより、理由の道筋を見せたほうが当たるようになる、という結果が面白い。", "unverified": "本文未読のため、知識グラフの規模と設備ごとの正答率は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "非凸の粒状ローターが対を作り鎖に自己集合", "title": "Mechanical pairing and self-assembled chains of non-convex granular rotors", "url": "https://arxiv.org/abs/2611.14120", "authors": "Thomas Barois ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Barois, T., Labiausse, M., Boudet, J.-F., Lintuvuori, J. S., & Kellay, H. (2026). Mechanical pairing and self-assembled chains of non-convex granular rotors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14120", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "回転する非凸形状の粒（粒状ローター）が、互いに引き合って対を作り、鎖状の構造に自己集合することを実験と数値計算で示した（抄録）。", "p3": "まず二つのローターの間の相互作用を調べ、回転の活動度と雑音の比、およびローターの形で決まる引力的な相互作用を確かめた（抄録）。", "p5": "ローター対の結合した状態から丈夫な鎖ができ、鎖は初めに並べても、自己集合で自然に生じても得られる（抄録）。数値は抄録に記載なし。", "fun": "磁石でも糊でもないのに、回るだけの粒どうしがくっついて鎖になる。決め手は、粒がへこみのある形をしていることと、回る勢いが揺らぎに比べてどれだけ強いかである。ばらばらの部品が設計図なしに形を作る「自己集合」が、目に見える大きさの粒でも起きるのが面白い。", "unverified": "本文未読のため、ローターの形状と寸法、鎖の長さの分布は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "湿った粒状体の山を体積率を制御して再現性よく", "title": "Cohesive granular piles with controlled volume fraction", "url": "https://arxiv.org/abs/2611.14128", "authors": "Pierre Jodlowski ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Jodlowski, P., Dalbe, M.-J., & Vandenberghe, N. (2026). Cohesive granular piles with controlled volume fraction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14128", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "湿った粒状体の実験で結果がばらつく問題に対し、円筒容器に体積率（volume fraction）を制御した大きな試料を再現性よく作る手順を示した（抄録）。", "p3": "異なる粒状材料と体積率で試料を作って再現性を定量的に確かめ、マイクロCTのX線撮影で内部の微細構造を調べた（抄録）。", "p5": "試料全体の体積率と局所の体積率の差は小さく、同じ試料の異なる高さでの撮影でも均質さが確かめられた（抄録）。数値は抄録に記載なし。", "fun": "砂場の湿った砂は、握り方ひとつで固さが変わる。実験でも同じで、詰め方が毎回違うと結果を比べられない。この研究は「同じ詰まり具合の砂山を何度でも作れる手順」を作り、X線で中まで均一かを確かめた。派手な発見ではないが、測定の土台をそろえる仕事の大切さが分かる。", "unverified": "本文未読のため、体積率の範囲とばらつきの大きさは未確認。"}}, {"id": "pr23", "rank": 23, "headline": "地すべりの認識と理解を統合する基盤モデル", "title": "LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding", "url": "https://arxiv.org/abs/2611.12936", "authors": "Shanwen Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, S., Wang, S., Sun, X., & Han, J. (2026). LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12936", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "地すべりの画像から場所を見つける視覚タスクと、状況を文章で説明・推論するタスクを一つにつないだ基盤モデルLandslideFMを提案した（抄録）。", "p3": "少ないラベルつきデータと多数のラベルなしデータを使う半教師あり学習で複数の視覚タスクに適応させ、予測した地すべり領域を空間的な手がかりとして、効率的に微調整した視覚言語モデルに渡す（抄録）。", "p5": "公開データと新しく作ったベンチマークLandslideVLで定量・定性ともに優れ、地すべりの推論と場面分析で汎用の視覚言語モデルを上回ったと報告する（抄録）。数値は抄録に記載なし。", "fun": "これまでのAIは「写真のどこが地すべりか」を塗るだけで、なぜ危ないかは答えられなかった。この研究は、塗った結果を手がかりにして、言葉で状況を説明するところまで一つのモデルでつないだ。見つける目と説明する口を別々にせず、一体にした点が新しい。", "unverified": "本文未読のため、精度の数値とベンチマークの規模は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "不確かな非線形系の状態分布の伝播を学習", "title": "Learn-To-Propagate: Distributionally Robust Motion Planning for Nonlinear Uncertain Systems", "url": "https://arxiv.org/abs/2611.13863", "authors": "Eduardo Figueiredo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Figueiredo, E., Banse, A., Ho, Q. H., Jungers, R., Lahijanian, M., & Laurenti, L. (2026). Learn-To-Propagate: Distributionally Robust Motion Planning for Nonlinear Uncertain Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13863", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "初期状態と雑音の確率分布が分からない非線形の確率システムに対し、安全性の保証つきで経路を計画するアルゴリズムを示した（抄録）。", "p3": "最適輸送を使って、真の分布を高い信頼度で含む「あいまいさ集合」を学習し、それを系のダイナミクスに沿って伝播させて安全性を検証しながら、状態空間に探索木の森を成長させる（抄録）。", "p5": "返される計画が指定した信頼度で仕様を満たすこと（正しさ）と、条件のもとでの確率的完全性を証明し、ロボットのベンチマークで既存手法を大きく上回った（抄録）。数値は抄録に記載なし。", "fun": "ロボットの位置には必ず誤差があり、時間がたつほどその「あやふやさの雲」は広がる。この研究は、雲の形を仮定せず、データから「本当の雲はこの範囲に入っている」という枠を学び、その枠ごと未来へ運んで、ぶつからない道を探す。分からないことを分からないまま安全に扱う工夫である。", "unverified": "本文未読のため、対象のベンチマークと計算時間、保証の信頼度の値は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "少ない高精度データで作る多忠実度の縮約モデル", "title": "Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity", "url": "https://arxiv.org/abs/2611.13624", "authors": "Vivian Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, V., Koike, T., Rex, A., & Qian, E. (2026). Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13624", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "高精度の計算データが少ないとき、粗い計算の安価なデータを併用して、偏微分方程式の縮約モデルを低い分散で学習する方法（MF-OpInf）を示した（抄録）。", "p3": "状態とその時間微分のデータから縮約した演算子を当てはめる演算子推論（Operator Inference）に、多忠実度の線形回帰を組み込み、粗い離散化で得た低忠実度データで推定を補う（抄録）。", "p5": "モデル的な偏微分方程式の数値実験で、同じ計算予算のもと、高忠実度データだけの演算子推論より解の場を高い精度で予測した（抄録）。数値は抄録に記載なし。", "fun": "精密な計算は高くて少ししかできず、粗い計算は安いが不正確である。この研究は両方を混ぜ、「少ない精密な答え」のばらつきを「たくさんの粗い答え」で抑える。高い模試を数回、安い小テストをたくさん受けて、合わせて実力を見積もるのに近い考え方である。", "unverified": "本文未読のため、対象とした方程式と精度の改善幅は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "信用リスクの時変特徴量は偽薬検定で確かめる", "title": "A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models", "url": "https://doi.org/10.2139/ssrn.7684404", "authors": "Nawaz Muhammad", "venue": "SSRN", "date": "2026-11-10", "apa": "Muhammad, N. (2026). A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models. https://doi.org/10.2139/ssrn.7684404", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "信用リスクモデルに時変の特徴量（景気指標や文章のトーン）を足してAUCが上がるかを見る通常の検証が、無意味な特徴量でも高率で通ってしまうことを示し、代わりの偽薬検定を提案した（抄録）。", "p3": "実際の系列と同じ持続性を持つ偽の系列を生成して同じ検証にかけ、本物の特徴量がそれらを上回るかで判定する。単に並べ替えただけの偽系列は、期間効果を統制したときにだけ妥当になる（抄録）。", "p5": "信用循環を統制しないと、純粋な雑音の特徴量が基準のシミュレーションで38%、循環が漂うと67%通過する（名目は5%）。持続性を合わせた偽薬検定では2〜5%に収まるが、検出力は73%から30%に下がる（抄録）。", "fun": "「この指標を足したら予測が良くなった」は、実は当てにならないことがある。景気のようにゆっくり動く数字は、中身がでたらめでも景気の波をなぞって、見かけ上役に立ってしまうからだ。そこで、同じくらいゆっくり動く偽物を作って比べる。薬の効き目を偽薬と比べるのと同じ発想を、予測モデルの検証に持ち込んでいる。", "unverified": "本文未読のため、シミュレーションの設定と、公開の融資データ2件での詳しい結果は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "炭素クレジット開示を少数例で分類するBERT", "title": "CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures", "url": "https://doi.org/10.21203/rs.3.rs-11679188/v1", "authors": "Hang Thanh Bui ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bui, H. T., Lee, E., & Evans, M. C. (2026). CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures. https://doi.org/10.21203/rs.3.rs-11679188/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "企業報告書の中の炭素クレジットに関する記述を、関連性・論調・クレジットの使い方の三点で分類し、不確かなものは人の確認に回す枠組みCarbonCrediBERTを示した（抄録）。", "p3": "専門家が定めた分類体系、紛らわしいが無関係な文章を使った難しい負例、少数の専門家ラベルに向く分類手法を組み合わせる。豪州のASX100企業の2024〜2025年の報告書から8,299件の文と15,026段落の候補を作り、課題ごとに100段落の専門家ラベルで評価した（抄録）。", "p5": "関連性の判定では微調整したClimateBERTが交差検証で選ばれて正解率93.8%、論調とクレジットの使い方では少数例学習のSetFit–MiniLMが選ばれ、三つの課題すべてで最良になる単一の手法はなかった（抄録）。", "fun": "「クレジット」「オフセット」「ネット」という言葉は、会計や金融の話にも普通に出てくるので、単語を探すだけでは炭素クレジットの話かどうか分からない。この研究は、わざと紛らわしい文章を「違う例」として学ばせ、自信のないものは人に回す。AIに全部任せず、迷ったら聞く仕組みにした点が実務的である。", "unverified": "抄録の末尾が切れており、棄権（人への回付）の割合と論調・使い方の課題の精度は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "顧客企業の融資関係が監査の生産過程を変える", "title": "Client Lending Relationships and Audit Production (WP)", "url": "https://doi.org/10.2139/ssrn.7685030", "authors": "Jie Hao ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hao, J., & Pham, V. T. (2026). Client Lending Relationships and Audit Production (WP). https://doi.org/10.2139/ssrn.7685030", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "企業と貸し手の融資関係の強さが、監査人の作業の進め方（監査の生産過程）に関係することを示した（抄録）。", "p3": "貸し手は審査と監視を繰り返して借り手の下振れリスクを評価し続けるため、融資関係が監査計画の手がかりになると考え、関係の強さと監査報酬・監査報告までの日数・継続企業に関する意見の正確さとの関連を調べた（抄録）。", "p5": "融資関係が強いほど監査報酬が低く、監査報告の遅れが短く、不正確な継続企業の意見を出す可能性が低い。貸し手のリスク評価の情報量が多い場合や、貸し手と監査人の連絡が効率的な場合に関連が強い（抄録）。効果の大きさは抄録に記載なし。", "fun": "監査人は会社の帳簿を一から調べる、と思いがちだが、銀行が長年その会社を見張ってきた事実も手がかりになる。銀行との付き合いが深い会社ほど、監査にかかる手間が少なく、判断も外れにくかった。別々の仕事に見える「貸す人の目」と「調べる人の目」がつながっている点が面白い。", "unverified": "本文未読のため、標本の国・期間・規模、融資関係の強さの測り方は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "気候リスクの開示と炭素テールリスクの関係", "title": "Climate Change Risk Disclosure and Carbon Tail Risk", "url": "https://doi.org/10.2139/ssrn.7683085", "authors": "Charlie Xiaowu Cai ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Cai, C. X., Qiu, J., Zhang, Z., & Zhao, R. (2026). Climate Change Risk Disclosure and Carbon Tail Risk. https://doi.org/10.2139/ssrn.7683085", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "米国企業の年次報告書（10-K）のリスク要因での気候変動リスクの開示が、排出量とオプション市場のテールリスクの結びつきを弱めることを示した（抄録）。", "p3": "2006年以降の米国企業について、排出量に対するテールリスクの傾きを、オプション価格から求めた3つのリスク指標で測り、開示との関係を調べた（抄録）。", "p5": "開示のある企業は3つの指標のすべてで傾きが緩やかで、この弱まりは負債の少ない企業や、情報需要・監視の強い企業で大きい。基準の結果を動かすのは移行リスクの開示で、決算説明会での言及にも同じ効果があるが10-Kより小さい（抄録）。", "fun": "二酸化炭素をたくさん出す会社ほど、将来の規制で大きく損をするかもしれないと市場は心配する。ところが、会社が自分の気候リスクを文章で説明していると、その心配の度合いが小さくなっていた。数字でなく「言葉での説明」が、先行きの読みにくさを減らして値づけに効く、という点が面白い。", "unverified": "抄録の対象期間の終わりの年は表記が不明瞭（「2006-024」）で未確認。効果の大きさも抄録に記載なし。"}}, {"id": "pr30", "rank": 30, "headline": "CEOと従業員の政治的距離が業績予想を減らす", "title": "CEO–Employee Political Alignment and Financial Reporting Outcomes", "url": "https://doi.org/10.2139/ssrn.7684538", "authors": "Sang Woo Sohn", "venue": "SSRN", "date": "2026-11-11", "apa": "Sohn, S. W. (2026). CEO–Employee Political Alignment and Financial Reporting Outcomes. https://doi.org/10.2139/ssrn.7684538", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "CEOと従業員の政治的な立場の隔たりが大きい企業ほど、自発的な業績予想が少なく、財務報告の質も低いことを示した（抄録）。", "p3": "個人の政治献金からCEOと従業員の党派性を測り、その距離と、経営者の業績予想の頻度、内部統制の重要な欠陥の報告、修正再表示の可能性との関連を調べた（抄録）。", "p5": "距離が大きいほど業績予想が少なく、重要な欠陥が多く、修正再表示の可能性が高い。予想との関連は、従業員数が多い、地理的に分散している、事業区分が多い、労働集約的な企業で強い（抄録）。効果の大きさは抄録に記載なし。", "fun": "社長と社員の支持政党が違うことが、決算の数字の正確さに関係するとは思いにくい。しかしこの研究は、政治的な距離が大きい会社ほど、見通しの公表が減り、後からの訂正が増えることを見つけた。社内で情報が上に上がりにくくなるためだと著者は解釈している。職場の「話しにくさ」が会計の質にまで届く、という視点が新しい。", "unverified": "本文未読のため、標本の期間と規模、因果関係の識別の方法は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "決算説明会の質疑応答の多ラベルデータセット", "title": "Bridging Public Relations Theory and Corporate Communication: A Multi-Label Dataset of Earnings-Call Q&amp;A Exchanges", "url": "https://doi.org/10.2139/ssrn.7685489", "authors": "Leyi Ouyang", "venue": "SSRN", "date": "2026-11-11", "apa": "Ouyang, L. (2026). Bridging Public Relations Theory and Corporate Communication: A Multi-Label Dataset of Earnings-Call Q&amp;A Exchanges. https://doi.org/10.2139/ssrn.7685489", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "米国の主要企業の決算説明会の質疑応答を、広報研究の理論と経営者の答え方の両面から多ラベルで注釈した縦断データセットを作った（抄録）。", "p3": "2015〜2024年の質疑を対象に、文献から導いた437の研究課題（132の理論・モデル・枠組み、12の研究領域）との関連づけと、応答の的確さ・情報開示・評判の修復など9次元77区分の応答分類という、二つの注釈体系を付けた（抄録）。", "p5": "理論の網羅は広いが偏りがあり、組織の説明・正統性・利害関係者との関係の枠組みが多く現れた。業種や時期による答え方の違いがあり、時間変化の解釈では応答の長さを考慮する必要がある（抄録）。質疑の件数は抄録に記載なし。", "fun": "決算説明会では、アナリストの鋭い質問に経営者がどう答えるかが見ものである。正面から答えるのか、はぐらかすのか、言い訳をするのか。この研究は、その答え方を細かく区分して、長い期間の質疑に札を付けた。理論の本に書かれた「組織の語り方」が、実際の会話でどれだけ起きているかを数えられるようにした点が面白い。", "unverified": "本文未読のため、質疑の件数、注釈の方法（人手かモデルか）と信頼性は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMは心理的構成概念を内部に持つのか", "title": "Tracing Psychometric Inference in Large Language Models", "url": "https://arxiv.org/abs/2611.12937", "authors": "Chih-Hao Hsu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Hsu, C.-H., Chou, F.-C. B., & Chen, P.-H. A. (2026). Tracing Psychometric Inference in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12937", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "LLMが心理尺度どうしの相関らしい出力を出すだけでなく、内部表現にも対応する構造を持つかを、ペルソナを横断する課題で調べた（抄録）。", "p3": "実在の272人（台湾の大学生）の一つの心理尺度への回答を与えて他の六つの尺度への回答を予測させ、2系統14種のモデルで、行動の水準（尺度間相関の再現）と内部の水準（対照方向の解析と活性化のプローブ）を比べた（抄録）。", "p5": "大きいモデルは人間の尺度間相関を再現し、さらに増幅した。指示調整版では内部の幾何が人間の相関行列と整合し、その強さは行動の増幅と関連した（r = 0.68）。ただし測った方向が回答を媒介することまでは示していない（抄録）。", "fun": "性格テストでは「外向的な人は不安が低い傾向がある」のように、尺度どうしにつながりがある。LLMにある人の一つのテスト結果を見せて他のテストを予測させると、このつながりを人間の実際より強く出すことが分かった。AIは人の性格の「型」を、現実よりくっきりした形で持っているらしい、という発見が面白い。", "unverified": "本文未読のため、使用した尺度の名称と、増幅の大きさの詳細は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "非対称な協力パズルでLLMの協働を評価", "title": "PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles", "url": "https://arxiv.org/abs/2611.14242", "authors": "Javier Hernandez ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Hernandez, J., & Wilson, A. D. (2026). PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14242", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "情報が片方ずつに分かれた協力パズルでLLMエージェント同士の協働を調べる基盤PARLEYを作り、失敗の型を整理した（抄録）。", "p3": "認知心理学に基づく4種の非対称パズル（指示対象の伝達、共同の調整、視点取得、空間推論）をGPT-4oの二体組に解かせ、会話から、知覚・適応・調整の3領域6種の失敗分類をデータに基づいて導いた（抄録）。", "p5": "400会話の成功率は60.5%で、課題により34〜80%の幅があった。外部からのフィードバックを取り込めず同じ失敗を繰り返すことが不成功の重要な目印で、分類に基づく介入で平均成功率は70.5%に上がった（抄録）。", "fun": "二人で協力しないと解けないパズルを、AI同士にやらせるとどうなるか。賢いはずのAIでも、相手から「それは違う」と言われても同じやり方を繰り返して失敗することが多かった。人間のグループワークでもよくある失敗であり、原因を型に分けて対策を入れると成功率が上がった点が実用的である。", "unverified": "本文未読のため、各パズルの具体的な内容と介入の方法は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "性格を介した文化適応の対話生成", "title": "HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation", "url": "https://arxiv.org/abs/2611.13207", "authors": "Lingzhi Shen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Shen, L., Cai, X., Long, Y., Razzak, I., & Jameel, S. (2026). HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13207", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "文化に合わせた対話生成に話し手の性格を組み込み、まず文化の調子に合わせ、次に性格に応じて表現と内容を調整する枠組みHiCAPを提案した（抄録）。", "p3": "性格で条件づけた制御機構が応答の様式を階層的に調整する。教師つき微調整と指示による調整を組み合わせ、動的な指示テンプレートと複数エージェントの実演で、文化と性格の多様な組合せを学ばせる（抄録）。", "p5": "CulturalPersonasとCPEDの二つのデータで、対話生成の各指標を通じて全体として最も高い性能を示した（抄録）。数値は抄録に記載なし。", "fun": "同じ国の人でも、おしゃべりな人と無口な人では話し方が違う。これまでの対話AIは「その文化らしい話し方」だけを合わせようとしていたが、この研究は、文化という大枠の中に個人の性格という細かい違いを重ねた。まず土地の言葉づかい、次にその人らしさ、という二段構えが自然な会話に近い。", "unverified": "本文未読のため、評価指標の値、比較した手法、扱った文化と性格特性の範囲は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "判断を先取りしない市民向けAIで環境正義を議論", "title": "EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice", "url": "https://arxiv.org/abs/2611.13525", "authors": "Evan Pa\\v{c}es-Wiles ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Pačes-Wiles, E., Alvarez, B., Gulabani, S., Kolipaka, A., & Gaikwad, S. 'N. S. (2026). EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13525", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "データセンターの立地をめぐる環境正義の議論で、AIが結論を先に出さず、住民が根拠を自分で確かめて提言を作れるようにする市民向けシステムEJAIを作った（抄録）。", "p3": "対話型の地図、検索した根拠資料、データの欠落の明示、立場の異なる二つの利害関係者ペルソナを結びつける。21件の質問による機能評価と、住民役の15人が模擬の公聴会に備える参加者内実験で調べた（抄録）。", "p5": "事実に関する主張の98.4%が検索した根拠に支えられ、根拠の欠落は33件中32件で認めた。一方、企業幹部のペルソナは、割り当てられた優先事項に反する根拠の一部を省いた（抄録）。", "fun": "AIに「データセンターを建てるべきか」と聞くと、もっともらしい答えが返ってきて、人は自分で証拠を見なくなる。この研究は逆に、AIに答えを出させず、地図と資料と「ここはデータがない」という表示を並べ、立場の違う二人の役を演じさせた。考える手間を省くのでなく、考える材料をそろえるAIという設計が面白い。", "unverified": "本文未読のため、参加者実験の定量的な結果と、ペルソナの設定の詳細は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "LLM交渉では余剰が残る場面で目的の指定が効く", "title": "Value Headroom Moderates Whether Specification Beats Style in LLM Negotiation", "url": "https://doi.org/10.5281/zenodo.24118722", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). Value Headroom Moderates Whether Specification Beats Style in LLM Negotiation (Version 1.1.1). Zenodo. https://doi.org/10.5281/ZENODO.24118722", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "LLMエージェント同士の交渉で、口調（温かさ・支配性）と目的の指定（優先順位、留保価値、譲歩の規則）のどちらが効くかは、取り残される共同利益の大きさ（価値の余地）で決まることを示した（抄録）。", "p3": "先行研究の公開資料から実験を再構成し、3つのモデル系統・7つの条件・4,920組の交渉で、目的を先に指定する指示と対人的な口調の指示を比べた（抄録）。", "p5": "余地がほぼない場面では両者は同等（事前登録した帰無結果）だが、余地があると目的の指定のほうが共同の価値が高い。切除実験では、利点は利得表を漏らすことでなく、互いの譲り合い（ログローリング）を教えることから来ていた（抄録）。", "fun": "交渉では「感じよく話すこと」が大事だという結果が以前に報告されていた。この研究は、それは「もう取り分を増やす余地がない場面」に限った話だと示した。まだ双方が得をできる余地が残っている場面では、口調より「何を優先し、どこまで譲るか」をはっきり決めておくほうが、二人合わせた利益が大きくなる。", "unverified": "審査のない置き場（Zenodo）の単著の報告で、本文未読のため、交渉課題の内容と統計処理の詳細は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "Redditのガザ議論から意見集団を検出し分極を測る", "title": "Quantifying polarization: detection and analysis of opinion groups on the Gaza conflict in English-language Reddit discourse", "url": "https://econpapers.repec.org/RePEc:cte:wsrepe:51001", "authors": "Scielzo Ortiz ほか", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "ガザ紛争をめぐるRedditの英語コメントから、LLMで抽出した言説の変数を使って意見集団を検出し、分極の構造を測る方法を比べた（抄録）。", "p3": "18のサブレディットから一年間に集めた約七万七千件のコメントについて、政治的立場・感情・論調・主題の枠組み・議論の質の5変数をゼロショットの規則つきプロンプトで抽出し、専門家の符号化で検証した。特徴空間とクラスタリング手法を組み合わせた5構成を比べた（抄録）。", "p5": "文章の埋め込みに基づく構成は語り口と政治的立場を混同し、思想の軸を復元できなかった。検証済みの変数に限り、混合データ向けの頑健な手法を使うと、対称な4集団の構造が得られた（抄録）。", "fun": "ネットの議論を機械に自動で仲間分けさせると、「賛成か反対か」でなく「口調が荒いか丁寧か」で分かれてしまうことがある。この研究は、文章を丸ごと数値にする方法がまさにその罠にはまることを示し、先にLLMで立場や論調を読み取ってから分けるほうが、意見の対立の形を正しく取り出せることを確かめた。", "unverified": "抄録の末尾が切れており、得られた4集団の中身と分極の指標の値は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "技術者のトークン消費は何を測っているのか", "title": "The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures", "url": "https://arxiv.org/abs/2611.13396", "authors": "Shyam Agarwal ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Agarwal, S., Lvova, O., Sergeyuk, A., Serova, A., Bryksin, T., Zimmermann, T., & Vasilescu, B. (2026). The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13396", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "技術者のトークン消費量という指標が、成果ではなく、さまざまな仕事でどれだけエージェントを使ったかを測っていることを、社内データで示した（抄録）。", "p3": "JetBrainsの技術者404人について、コーディングエージェントの5週間のトークン使用量をコミットと結びつけ、社員412人の調査も分析した（抄録）。", "p5": "消費量の差は主に人の間の差で、コミット数が同程度の週でも上位（90パーセンタイル）は下位（10パーセンタイル）の39〜240倍だった。同じ人では消費を倍にしてもコミットは約10%増にとどまり、仕事の指標で説明できたのは人の間の変動の38%、週ごとの変動の13%だった（抄録）。", "fun": "昔は「書いたプログラムの行数」で技術者の働きを測ろうとして失敗した。行数が多いことと良い仕事は別だからである。AI時代の新しい物差しとして「AIをどれだけ使ったか」が出てきたが、この研究は同じ失敗の繰り返しになりうることをデータで示した。たくさん使う人が、たくさん成果を出しているとは限らない。", "unverified": "本文未読のため、分析の統計モデルと調査の詳しい結果は未確認。一社の事例である。"}}, {"id": "pr39", "rank": 39, "headline": "AI利用が同僚同士の評価と協力をどう変えるか", "title": "Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another", "url": "https://doi.org/10.31234/osf.io/ehbjv_v2", "authors": "Maxine Parker ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Parker, M., Huang, C., & Krastev, S. (2026). Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another. https://doi.org/10.31234/osf.io/ehbjv_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "職場で生成AIを使うことが、同僚からの見られ方と同僚の振る舞いをどう変えるかについての研究を、既存の対人関係の理論で整理した総説である（抄録）。", "p3": "帰属理論、社会的行為者としてのコンピュータ、組織的信頼の統合モデル、社会的交換理論、資源に基づく理論を枠組みとして、AI利用者に対する知覚・判断・行動の知見をまとめた（抄録）。", "p5": "観察者はAI利用を状況でなく人柄のしるしと読み、利用者を有能さ・意欲・温かさ・誠実さが低いと判断しがちで、利用の開示は信頼の低下を埋めない。同僚からの返報や知識共有も減る。ただし効果は条件つきで、上司の支援などの関係的な緩衝が費用を相殺しうる（抄録）。", "fun": "AIを使って仕事をすると、成果物は良くなっても「あの人は手を抜いている」「本物ではない」と見られやすい、という研究結果がまとめられている。しかも「AIを使いました」と正直に言っても信頼は戻らない。道具の性能でなく、人が人をどう見るかという昔からの心理が、AI時代の職場の人間関係を左右している。", "unverified": "抄録の末尾が切れており、総説の対象文献の数と選び方、結論部分は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "AIの語り方で労働市場政策への支持が変わるか", "title": "Artificial Intelligence and Support for Labor Market Policies: Evidence from a Survey Experiment", "url": "https://econpapers.repec.org/RePEc:zbw:glodps:1856", "authors": "Angei ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "AIについての語り方（代替・補完・学び直し）が労働者の労働市場政策への支持を変えるかを調査実験で調べ、効果は職場でAIを使っているかどうかで分かれることを示した（抄録）。", "p3": "イタリアの被雇用者の代表標本（約二千百人）を、対照群と3つの情報処置に無作為に割り当て、失業給付などの受動的な施策と訓練などの能動的な施策を含む5つの政策手段への支持を尋ねた（抄録）。", "p5": "平均の効果は小さいが、AIを使っていない人では代替の語りが公的な訓練と雇用補助金への支持を高め、使っている人では代替・補完の語りが失業保険と短時間労働制度への支持を下げた。学び直しの語りはどちらの群でも有意な効果がなかった（抄録）。", "fun": "「AIが仕事を奪う」と聞いたとき、人は国の支援を求めるようになるだろうか。答えは、その人がすでに職場でAIを使っているかどうかで逆になった。使っていない人は訓練の充実を求め、使っている人はむしろ失業保険への支持を下げた。同じ知らせでも、自分の経験によって受け取り方が変わることを実験で示している。", "unverified": "抄録の末尾が切れており、効果の大きさと結論の後半は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "AI不安・デジタル過負荷と情緒的消耗", "title": "AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors", "url": "https://doi.org/10.21203/rs.3.rs-11253139/v1", "authors": "Usha Shree Rathod Bhukya ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bhukya, U. S. R., & Muddasani, R. (2026). AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors. https://doi.org/10.21203/rs.3.rs-11253139/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得。抄録の結果の部分は取得時に一部欠けている）", "preprint": true, "short": true, "p1": "AI不安・デジタル過負荷・技術ストレスという仕事の要求が、情緒的消耗を通じて心理的well-beingの低さと関連することを、仕事の要求度-資源モデルで調べた（抄録）。", "p3": "IT、医療、教育、銀行・金融の正規雇用者340人に6つの心理尺度の横断調査を行い、共分散構造分析（5,000回のブートストラップ）で調整媒介モデルを検証し、業種別の多母集団分析とfsQCAも行った（抄録）。", "p5": "3つの要求はいずれも情緒的消耗を予測し（AI不安はβ = 0.396）、要求とwell-beingの関連は主に情緒的消耗を介していた。要求の目立ち方は業種で異なり、心理的資本の低さはwell-beingの低さの共通の条件だった（抄録）。", "fun": "AIに仕事を奪われるかもしれないという不安、鳴りやまない通知、新しい道具についていく負担。この三つは、まず「心がすり減る」状態と結びつき、それが幸福感の低さにつながっていた。希望や立ち直る力といった心の資源が少ない人ほど影響を受けやすい。どの負担が強く効くかが業種で違う点も興味深い。", "unverified": "抄録の結果の部分が欠けており、他の係数と調整効果の値は未確認。横断調査のため因果関係は示せない。"}}, {"id": "pr42", "rank": 42, "headline": "ビデオ判定の導入は選手の危険な行為を減らすか", "title": "Inspection and Workplace Safety: Evidence from the Video Assistant Referee", "url": "https://doi.org/10.2139/ssrn.7685019", "authors": "Yuxiao Ye ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Ye, Y., Jiang, S., & Xu, Y. (2026). Inspection and Workplace Safety: Evidence from the Video Assistant Referee. https://doi.org/10.2139/ssrn.7685019", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "サッカーのビデオ判定（VAR）の導入が、相手を危険にさらす行為を抑え、けがを減らしたことを示し、監視技術と職場の安全の関係を論じた（抄録）。", "p3": "欧州の主要5リーグでVARが段階的に導入されたことを利用し、2014/15〜2021/22シーズンのチーム・試合・選手単位のデータに差の差分析とイベントスタディを適用した（抄録）。", "p5": "チーム・シーズンあたりのけがの総数は約27%減った。相手のけがと正に関連する攻撃的・非スポーツ的な行為は減り、言葉での抗議や暴言は増えた。けがのリスクの低下には、一部の生産的な貢献の減少が伴った（抄録）。", "fun": "ビデオ判定は誤審を減らすための道具だが、思わぬ効果があった。危ない反則をしても後から映像で見つかるので、選手がそうした行為を控えるようになり、けがが減ったのである。一方で、審判への文句は増えた。見張りの仕組みは、狙った行動だけでなく、周りの行動まで変えてしまうことが分かる。", "unverified": "抄録の末尾が切れており、実務への含意の後半は未確認。推定の詳細（対照群、標準誤差）も本文未読のため未確認。"}}, {"id": "pr43", "rank": 43, "headline": "自閉スペクトラムの成人の職場ストレス対処尺度", "title": "Coping with workplace stress in autism: Development of a multidimensional coping inventory", "url": "https://doi.org/10.31234/osf.io/m9cet", "authors": "Johanna Finnemann ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Finnemann, J., & Erdal, K. (2026). Coping with workplace stress in autism: Development of a multidimensional coping inventory. https://doi.org/10.31234/osf.io/m9cet", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "自閉スペクトラム症の成人が職場のストレスにどう対処しているかを測る、33項目・11因子の多次元の自己報告尺度を開発した（抄録）。", "p3": "自閉スペクトラム症の従業員233人で探索的因子分析を行って項目を絞り、他の神経発達の特性を持つ従業員221人で測定不変性を確かめ、診断のある別の標本で11項目の短縮版の参考値を示した（抄録）。", "p5": "二つの標本の間で計量不変と尺度不変が十分に成り立ち、自閉スペクトラム症の働く人に特有の対処の姿を測れる、信頼できる尺度だと結論する（抄録）。信頼性係数などの数値は抄録に記載なし。", "fun": "音や光が気になる、雑談が負担になるなど、自閉スペクトラム症の人が職場で感じるストレスは、多数派の人のものと種類が違う。対処の工夫も独自なので、これまでの質問紙ではうまく測れなかった。この研究は、当事者が実際に挙げた工夫から質問項目を作った。測る物差しを当事者の側から作り直した点が大事である。", "unverified": "本文未読のため、因子の名称、信頼性係数、確認的因子分析の有無は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "小さな緑化は地区の貧富による知覚差を縮めるか", "title": "Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status", "url": "https://doi.org/10.31234/osf.io/6rmcg", "authors": "Paula Latorre ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Latorre, P., Ferreira, C. P., Molina-Muñoz, A., Castaño-Castaño, S., Morales-Navas, M., & Nieto-Escamez, F. (2026). Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status. https://doi.org/10.31234/osf.io/6rmcg", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "街路に小さな緑を足す工夫が、地区の豊かさによる心理的な格差を縮める働きを持つかを、仮想現実と視線計測で調べた（抄録）。", "p3": "75人の参加者が、社会経済的地位が低・中・高の地区の360°の仮想ツアーを、元の状態と緑を加えた状態で評価し、60 Hzの視線計測で注意の動きを測った（抄録）。", "p5": "緑の追加は注視の総数を変えなかったが、平均の注視時間を有意に短くした。肯定的な感情・好ましさ・美的評価・くつろぎは上がり、知覚されたストレスは全体として有意には変わらなかった（抄録）。", "fun": "緑の多い街は気分が良い、というのは誰でも感じるが、その「見方」まで変わるのかを目の動きで調べた研究である。緑を足した街では、一点をじっと見つめる時間が短くなっていた。がんばって注意を向けなくても自然に目が引かれる状態と整合する結果で、頭が休まるしくみの手がかりになる。", "unverified": "抄録の末尾が切れており、地区の豊かさによる差が縮まったかどうかの結論は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "有給の家族休暇は睡眠時間と就業を変えるか", "title": "The Effect of Paid Family Leave on Sleep Duration and Labor Market Outcomes in the U.S", "url": "https://doi.org/10.2139/ssrn.7685643", "authors": "Niloufar Erfanibehrouz", "venue": "SSRN", "date": "2026-11-11", "apa": "Erfanibehrouz, N. (2026). The Effect of Paid Family Leave on Sleep Duration and Labor Market Outcomes in the U.S. https://doi.org/10.2139/ssrn.7685643", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "米国の州の有給家族休暇制度が、雇用と労働時間を増やし、睡眠時間もわずかに改善することを示した（抄録）。", "p3": "1998〜2020年の州ごとの導入時期の違いを使う段階的な差の差分析で、人口動態調査（CPS）から雇用・労働力参加・週の労働時間を、生活時間調査（ATUS）から睡眠時間を推定した（抄録）。", "p5": "制度は雇用と労働時間を増やし、効果は既婚男性で強い。女性では、未婚・離別の人は労働力参加と労働時間が増え、既婚の人は有意な変化がなかった。睡眠時間は女性と単身者を中心に少し増えた（抄録）。効果の大きさは抄録に記載なし。", "fun": "家族の世話のために休める制度を作ると、働く人が減りそうに思える。ところが実際は雇用も労働時間も増えていた。休めるからこそ仕事を辞めずに戻ってこられる、ということらしい。さらに睡眠時間まで少し増えていた。制度の効果を「働くかどうか」だけでなく「眠れているか」で測った点が面白い。", "unverified": "本文未読のため、推定値の大きさと、段階的導入に伴う推定上の対処は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "小児がん経験者の介護者を地域資源につなぐ", "title": "Connecting Caregivers to Community Resources: A Mixed-Methods Evaluation of a Virtual Assistant for Childhood Cancer Survivorship", "url": "https://doi.org/10.21203/rs.3.rs-11270648/v1", "authors": "Micah A. Skeens ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Skeens, M. A., Booze, A. M., Wisne, L. M., Dyer, E. C., Olshefski, R., & Sezgin, E. (2026). Connecting Caregivers to Community Resources: A Mixed-Methods Evaluation of a Virtual Assistant for Childhood Cancer Survivorship. https://doi.org/10.21203/rs.3.rs-11270648/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "小児がん経験者の介護者を地域の支援資源につなぐ仮想アシスタントの使いやすさと受け入れやすさを評価した（抄録）。", "p3": "介護者15人が試用したあと、使いやすさの尺度（SUS）、満足度の質問紙、反応カード、半構造化面接に答え、居住地の機会・困窮の指標や農村かどうかとの関係を探索的に調べた（抄録）。", "p5": "SUSの平均は77.09（標準偏差18.04）で平均以上の使いやすさを示し、全員が使いやすいと評価した。困窮度の高い地区の介護者ほど、自力では見つけられない資源を見つけられたという満足が高かった（抄録）。", "fun": "病気が治ったあとも、子どもを支える家族には学習支援や相談先など、探すべきものがたくさんある。しかし地域にどんな支援があるかを一人で調べるのは大変だ。この研究の道具は、恵まれない地域に住む家族ほど「自分では見つけられなかった」と役立ちを感じていた。支援の情報が届きにくい人にこそ効く点が大事である。", "unverified": "抄録の末尾が切れており、面接から得た主題の内容は未確認。標本は15人と小さい。"}}, {"id": "pr47", "rank": 47, "headline": "外食のカロリー表示が家庭の食料品購入に波及", "title": "Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases", "url": "https://doi.org/10.2139/ssrn.7682397", "authors": "Ali Umut Guler", "venue": "SSRN", "date": "2026-11-11", "apa": "Guler, A. U. (2026). Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases. https://doi.org/10.2139/ssrn.7682397", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "飲食店でのカロリー表示の義務化が、対象外であるスーパーでの家庭の食料品購入にも波及することを示した（抄録）。", "p3": "6つの地域の義務化の前後について、家計の購買パネルデータに積み上げ型の差の差分析を適用し、表示が実施に至った地域と至らなかった地域を比べた。593人の無作為化実験で、食料品のカロリーの過小評価とメニュー表示による修正も測った（抄録）。", "p5": "過小評価が多く、メニューの品と直接結びつけやすい品目で波及が明確で、パン・焼き菓子類では食料品店で買うカロリーが1人1日あたり2.31kcal（18.7%）減った。牛乳では低脂肪のものへの移行が見られた（抄録）。", "fun": "飲食店のメニューに「このマフィンは何キロカロリー」と書いてあると、店で食べる量が変わるだけではなかった。その知識がスーパーでの買い物にも持ち込まれ、家で食べるパンや菓子のカロリーまで減っていた。ある場所で得た情報が、別の場所の行動を変える。政策の効果を店の中だけで測ると見落とす、という指摘である。", "unverified": "本文未読のため、対象の地域と期間、他の品目の推定値は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "LLMのブランド評価は親会社の開示で変わるか", "title": "Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception", "url": "https://doi.org/10.5281/zenodo.24117389", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception (Version 1.3.0). Zenodo. https://doi.org/10.5281/ZENODO.24117389", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "LLMによるブランド評価は、そのブランドの親会社を明かしてもほとんど変わらないことを、多数のモデルで示した（抄録）。", "p3": "13のLLMに、7つの型のブランド群から選んだ20ブランドを、直接の評価・自然な推薦・対話の途中での親会社の開示・母語での提示の4つの方式で評価させ、7,975件の観測を得た。別の20ブランドを加えて合計9,925件にした（抄録）。", "p5": "親会社の提示による評価の集中度の変化はほぼゼロで、20ブランド中18で同等性の検定が帰無を支持した。対話の途中で明かす方式では一部の構造で小さな変化があったが、ブランド群と方式に限られた（抄録）。", "fun": "人間は「この高級ブランドは実はあの大衆メーカーの子会社だ」と知ると、印象が変わることがある。ではAIはどうか。調べると、AIは親会社を教えられても評価をほとんど変えなかった。著者は、AIが所有関係をもともと知識として持っているためだと考えている。人とAIで「知らされること」の効き方が違う点が面白い。", "unverified": "審査のない置き場（Zenodo）の単著の報告で、本文未読のため、評価指標の定義と統計処理の詳細は未確認。抄録の末尾は切れている。"}}, {"id": "pr49", "rank": 49, "headline": "韓国旅行の「本物らしさ」を口コミから抽出", "title": "Tourist Perceptions of Authentic Travel in South Korea: A Text Mining Analysis of Online Travel Comments", "url": "https://econpapers.repec.org/RePEc:zbw:esrepo:344186", "authors": "Chae, Jinwoo", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "韓国旅行のオンラインのコメントから、旅行者が「本物らしい体験」をどう語っているかをテキストマイニングで調べた（抄録）。", "p3": "韓国の観光地と体験に関する英語の旅行コメント一万件を、キーワードの頻度、共起分析、感情分析、主題の符号化で分析した（抄録）。", "p5": "本物らしさは、地元の食べ物、伝統文化、住民との交流、商業化の進んでいない場所と結びついて語られ、商業化と混雑は否定的な評価と結びついていた（抄録）。数値は抄録に記載なし。", "fun": "「本物の旅」とは何だろうか。質問紙で聞くと、研究者が用意した選択肢の中からしか答えが出てこない。この研究は、旅行者が自分から書いた感想を大量に読み、何が「本物」と感じられているかを拾った。答えは歴史の古さだけでなく、地元の人と話せたか、観光地化されすぎていないか、という手ざわりだった。", "unverified": "本文未読のため、コメントの収集元と期間、分析の検証方法は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "東京は水準1位でも生産性の伸びは下位", "title": "東京パズルの観測事実: 県民経済計算による人口・生産性・所得・雇用者報酬の地域比較", "url": "https://doi.org/10.51094/jxiv.7112", "authors": "大塚, 章弘", "venue": "Jxiv", "date": "2026-11-08", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Jxivの抄録（英文）を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "県民経済計算を使い、東京は生産性・所得・雇用者報酬の水準では1位なのに、伸びでは下位にあるという「東京パズル」の観測事実を整理した（抄録）。", "p3": "47都道府県の2012〜2023年度の県民経済計算（2023年度版）で、人口・生産性・所得・雇用者報酬の水準と伸びの順位を比べた（抄録）。", "p5": "東京は住民1人あたり実質産出の伸びで47位、労働生産性の伸びで33位だった。首都圏の4都県の労働生産性の伸びはどの期間も全国を下回り、圏内では産出の増加が東京に、雇用の増加が周辺県に集中した（抄録）。", "fun": "東京は日本でいちばん豊かで生産性も高い。それなのに「伸び」で見ると、全国の中で最下位になる項目がある。人と会社が集まれば集まるほど成長するはず、という直感に合わない結果で、これが「東京パズル」と呼ばれる。水準と伸びを分けて見ると、同じデータからまったく違う姿が見えてくる。", "unverified": "抄録の末尾が切れており、5つの発見のうち後半（格差の指標の推移など）は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "交差検証の分散を有限標本で厳密に表す恒等式", "title": "A Theory of Cross-Validation Variance", "url": "https://arxiv.org/abs/2611.14463", "authors": "Nathaniel S. O'Connell ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "O'Connell, N. S., & Speiser, J. L. (2026). A Theory of Cross-Validation Variance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14463", "why": "交差検証の推定値の分散を、各観測が「評価される役割」と「学習に使われる役割」で受け取る重みの関数として有限標本で厳密に表した。分散は標本抽出による部分と分割の乱数による部分に分かれ、K分割は一次の意味で分散最適、その一次の分散はKに依存せず、条件のもとで1個抜きが最小になることを示し、推定値の漸近正規性も導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、分散の恒等式§3.2、標本分散と分割ノイズ§4.2、実証§6、結論§7、図1の説明）を読んだ。証明の付録と漸近正規性の節（§5）は読んでいない", "preprint": true, "p1": "交差検証で得る性能の推定値の分散を、有限標本で厳密に成り立つ恒等式として表し、どの分割の設計が分散を小さくするかを一つの理論で説明できるようにした（抄録、§7）。", "p2": "K分割、モンテカルロ分割、ブートストラップなどは別々に研究され、モデル・訓練割合・再標本化の設計が分散をどう決めるかの一般理論がなかった。各観測が「評価される役割」と「学習に使われる役割」の二つを持つことを分けて扱った結果もなかった（§1）。", "p3": "交差検証を無作為化された設計とみなし、分割が各観測に与える二つの重み（検証の重みと訓練の重み）で推定値を表す。一次の分散は、検証の影響の分散、訓練の影響の分散、両者の共分散という3つの定数に、重みの二乗和と積和を掛けた形になる（§3.2）。さらに全分散を、データの抽出による標本分散と、分割の乱数による分割ノイズに分ける（§4.2）。背景：K分割では各観測がちょうど一度検証され、重みが全観測で等しい。", "p4": "固定の帯域幅の核平滑化を対象に、二乗誤差・Brierスコア・AUCの3指標、K分割（K=2、5、10）・1個抜き・モンテカルロ分割、標本数250・500・1000で、反復データから測った分散と恒等式の予測の比を調べる。定数は定義から計算し、結果に当てはめていない（§6、図1）。", "p5": "51の条件で全分散の実測と予測の比は0.992〜1.060、45の条件で分割ノイズの比は0.899〜1.051に収まった。一次の項だけでは全分散で最大23%、分割ノイズで73%ずれ、対の相互作用の項が必要だった（§6）。同じ訓練サイズでは設計による違いは分割ノイズだけで、K分割は一次で釣り合っているため主要な分散がKによらず、1個抜きは分割ノイズがなく、条件のもとでK分割の中で最小の分散になる（§4.2、§7）。", "p6": "結論は、標本分散が訓練サイズとともに増えないなどの条件に依存する。AUCのような対の指標では、通常のK分割は同じ分割内の対しか評価せず、分割数とともにノイズが増える。複雑な学習法でこれらの分散成分を実用的に推定する方法と、従属な観測への拡張は今後の課題とされる（§7）。検証は一つの学習器でのシミュレーションである。", "fun": "データをいくつかに分け、順番に一つを試験用、残りを勉強用にして成績の平均を出すのが交差検証である。その結果がどれだけぶれるかは、長く経験則で語られてきた。「1個だけ抜いて残り全部で学習する方法は、勉強用のデータがほとんど同じなので、ぶれが大きい」という通説もその一つである。この論文は、ぶれの大きさを厳密な式で書き下し、その通説が一般には正しくないことを示した。よく使う道具の足元を固め直した仕事である。", "unverified": "定理の正確な仮定（条件A2など）と証明、漸近正規性（§5）、対の指標の詳しい結果（§4.6）は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "重みのビット反転を最適化して言語モデルを修復", "title": "Tree-Ising: Repairing Language Models with Bit-Level Ising Edits", "url": "https://arxiv.org/abs/2611.14210", "authors": "Hadi Salloum ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Salloum, H., & Ali, A. (2026). Tree-Ising: Repairing Language Models with Bit-Level Ising Edits (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14210", "why": "言語モデルの推論ループの修復を、重み（BF16）の符号反転と指数シフトだけを許す疎な離散最適化として定式化し、出力行ごとの独立なQUBO（イジング）問題に厳密に分解して焼きなまし等で解く。LLMエージェントによる修復と同じ評価手順でMATH-500が54.6%（エージェントの編集は51.7%）となり、必要な順伝播の要求は4回、LLMのトークンは不要だったと報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（貢献の要約、目的関数§3.3、精度§4.2、費用§4.3、別モデルへの転用§5、限界§8、表3・表4）を読んだ。状態木の表現、切除実験、量子ハードウェアの付録は読んでいない", "preprint": true, "p1": "言語モデルが推論を終えられず同じ思考を繰り返す不具合を、勾配も言語モデルのエージェントも使わず、重みのビット単位の編集を組合せ最適化で選ぶことで、安く速く修復する方法を示した（抄録、§4.3）。", "p2": "先行研究（重み空間プログラミング）では、最先端のLLMエージェントがネットワークの重みを読んで修復を書いたが、158回の応答と89.7Mトークン、50回の順伝播の要求を要し、費用も時間も大きかった（抄録、表4）。", "p3": "ループ中のトークンでの入力の平均と、守りたいトークンでの入力の二次モーメントという順伝播の統計から、ループの方向への書き込みを弱める「用量」と、守るべき出力の乱れである「副作用」を定義し、用量・副作用・変更する重みの数の和を最小化する（§3.3）。許す編集はBF16形式の重みの符号反転と指数のずらしだけで、目的関数は出力行ごとの独立なQUBO（イジング）問題に厳密に分解でき、焼きなましなどで解く（§3.4、§3.5）。", "p4": "Qwen3.5-0.8Bで、エージェントが選んだ層に対して編集を作り、同じ評価の仕組みで、5つの数学ベンチマークの正解率と、トークン上限で打ち切られた割合をエージェントの編集と比べる。一回の修復の費用も比べる（§4.2、§4.3）。別のモデルQwen3.5-2Bでは参照の編集なしで試す（§5）。", "p5": "MATH-500（1問4回）の正解率は54.6%でエージェントの編集の51.7%を上回り、GSM8Kでも70.5%対65.6%だった。この2つの差は多重比較の補正後も有意である（表3）。必要な順伝播の要求は4回、費用は0.90ドルで、エージェントの312ドルに対し約350分の1だった（表4）。Qwen3.5-2Bでは、貪欲復号でのGSM8Kの正解率が21.6%から69.4%に上がった（抄録、§5）。", "p6": "著者は、対象が一つのモデル系列・一つの不具合（推論のループ）・数学のベンチマークに限られ、他の能力への副作用を測っていないこと、手順がエージェントの公開記録を見たあとで作られ、小さいモデルでは層と用量をエージェントの編集に依存したこと、目的関数が一次の近似であること、各評価が一つの乱数種であることを挙げる（§8）。", "fun": "考え始めると同じところをぐるぐる回って、いつまでも答えを出せないAIがいた。これを直すのに、以前は最先端のAIに「手術」を任せ、何百ドル
