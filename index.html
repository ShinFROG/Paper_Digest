., & Nguyen, P. T. (2026). Cumulative spectral moment distribution for robust damage detection in structural health monitoring under uncertain excitation. Proceedings of the Institution of Mechanical Engineers, Part C: Journal of Mechanical Engineering Science. https://doi.org/10.1177/09544062261497329", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "非定常な加振と雑音の下でも、小さな損傷や分布した損傷を検出しやすい周波数領域の指標として、累積スペクトルモーメント分布（CMSD）を提案した（抄録）。", "p3": "スペクトルモーメントの理論に時間・空間方向のエネルギーの累積を組み合わせ、エネルギーの分布、スペクトルの広がり、裾の振る舞いを捉える。スペクトルモーメントの統計とパーセバルの定理で裏づける（抄録）。", "p5": "従来のパワースペクトル密度に基づく指標より解釈しやすく雑音に強いと主張する（抄録）。検証の数値は抄録からは未確認。", "fun": "構造物の揺れを周波数ごとに分けると、損傷で「音色」が少し変わります。でも風や交通のように揺らし方が毎回違うと、その変化は雑音に埋もれます。この研究は、周波数成分の重心や広がりといった全体の形を積み上げて見ることで、小さな変化を見分けようとしています。", "unverified": "検証に使ったデータと検出性能の数値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "粒状基礎上の梁の動的接触問題の解の存在", "title": "A Snowpiercer Model: Dynamic Beam Solution for Highly Nonlinear Reaction, Energy Inequality, and Granular Foundation", "url": "https://doi.org/10.68381/jca34027", "authors": "Victor A. Kovtunenko", "venue": "Journal of Convex Analysis", "date": "2026-10-30", "citescore": 1.2, "citescore_year": "2025", "apa": "Kovtunenko, V. A. (2027). A Snowpiercer Model: Dynamic Beam Solution for Highly Nonlinear Reaction, Energy Inequality, and Granular Foundation. Journal of Convex Analysis, 34(1), 408–414. https://doi.org/10.68381/jca34027", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "高速車両が走る粒状基礎上のレールのたわみを、強い非線形の反力を持つオイラー・ベルヌーイ梁の動的接触問題として定式化し、解の存在を示した（抄録）。", "p3": "エネルギー不等式とガレルキン近似により、発展型の半線形微分方程式の変分解の存在を証明した（抄録）。", "p5": "周期的な梁の振動に対する粒状基礎の反力を示し、塑性・時効・硬化の現象を描いた（抄録）。", "fun": "線路の下の砂利（バラスト）は、押されると硬くなったり、くり返し押されると形が変わったりする、とても扱いにくい支え方をします。この研究は、そんな支えの上を高速列車が走るときの梁の方程式に、数学的にきちんとした解があることを示しました。", "unverified": "数値例の詳細は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "振動する床の上の土砂輸送を粒子解像で計算", "title": "Particle-resolved simulation of sediment transport over vibrating beds", "url": "https://doi.org/10.1017/jfm.2026.12228", "authors": "Yuanqing Liu ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-30", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Liu, Y., Seibert, C., Paola, C., McHugh, C., Seeber, L., & Shen, L. (2026). Particle-resolved simulation of sediment transport over vibrating beds. Journal of Fluid Mechanics, 1046. https://doi.org/10.1017/jfm.2026.12228", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "大地震による土砂輸送の仕組みを理解するため、振動する河床の上の土砂輸送を、流れと個々の粒子の動きの両方を解像して計算した（抄録）。", "p3": "地震の揺れを水平・鉛直の正弦振動で表し、位相平均の統計で振動が乱流・応力・土砂の動きをどう変えるかを調べた（抄録）。", "p5": "土砂輸送率とその位相平均の分解から、振動へのリズミカルな応答、輸送の増加、移動層の厚さの変化などが示された（抄録）。", "fun": "大地震のあとに海や湖の底にできる独特の地層は、過去の地震の記録として使われます。この研究は、揺れる川底の上で一粒一粒の砂と水の流れをすべて計算し、揺れが砂の運ばれ方をどう変えるかを調べています。目に見えない粒の動きから地層のでき方を説明する点が面白いです。", "unverified": "輸送率の増加の大きさは未確認。"}}, {"id": "jr19", "rank": 19, "headline": "粒子を追う確率的ラグランジュ型の海洋炭素モデル", "title": "SLAMS‐2.0: A Stochastic, Lagrangian Particle‐Resolving Modeling Framework for Investigating the Biological Carbon Pump", "url": "https://doi.org/10.1029/2026ms005869", "authors": "A. Rufas ほか", "venue": "Journal of Advances in Modeling Earth Systems", "date": "2026-10-30", "sjr": 2.154, "citescore": 8.0, "citescore_year": "2025", "apa": "Rufas, A., Khatiwala, S., & Jokulsdottir, T. (2026). SLAMS‐2.0: A Stochastic, Lagrangian Particle‐Resolving Modeling Framework for Investigating the Biological Carbon Pump. Journal of Advances in Modeling Earth Systems, 18(11). https://doi.org/10.1029/2026ms005869", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "海洋の生物ポンプを担う沈降粒子の形成・変化・行方を、個々の粒子と確率的な相互作用を扱いつつ効率よく計算するラグランジュ型の枠組みSLAMS-2.0を示した（抄録）。", "p3": "粒子集団を分布で扱う方法と個々の粒子を追う方法の中間として、異質な個々の粒子とその確率的な相互作用を明示的にシミュレーションする（抄録）。", "p5": "粒子スケールの過程と粒子フラックスの創発を両方捉えられると主張する（抄録）。数値の結果は未確認。", "fun": "海の表面で作られた有機物の粒は、くっついたり分解されたりしながら深海へ沈み、炭素を運びます。粒を全部追うと計算が重すぎ、平均で扱うと粒ごとの違いが消えます。この研究は、確率を使って粒の出会いを表すことで、その間を取る方法を作っています。", "unverified": "観測との比較結果は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "貯水位と間隙水圧の関係を解析と実測で解く", "title": "Reservoir-Piezometric Water Level Relationship: Analytical-Numerical Modeling with Field Observations", "url": "https://doi.org/10.1139/cgj-2026-0665", "authors": "Seyyed Kazem Razavi ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-30", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Razavi, S. K., & Zarnani, S. (2026). Reservoir-Piezometric Water Level Relationship: Analytical-Numerical Modeling with Field Observations. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0665", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "貯水施設で測る間隙水圧と上流水位の関係の傾向が何を意味し、時間とともにどう変わるかを、解析解・数値解析・現地観測で明らかにした（抄録）。", "p3": "上流水位が上がり続ける1次元の流れの解析解を導き、主要なパラメータが間隙水圧の応答に与える影響を評価した（抄録）。", "p5": "抄録の範囲では解析の構成が示され、観測との照合結果は抄録の切れた部分にあり未確認。", "fun": "ダムや堤防では、地中の水圧を測って水位との関係を見るのが基本の監視方法です。でも、水位が上がっても水圧がすぐ追いつかないなど、グラフの傾きが何を意味するかは意外とはっきりしていません。この研究は、その傾向の物理的な意味を式で説明しようとしています。", "unverified": "現地観測との一致の程度は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "大型三軸試験で見る内部侵食と透水性の変化", "title": "Large-Scale Triaxial Testing on Suffusion Characteristics and Permeability Evolution of Gap-Graded Soils under Different Controlling Constriction Sizes", "url": "https://doi.org/10.1061/jggefk.gteng-15822", "authors": "Yongkui Fu ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-31", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Fu, Y., Zou, D., Liu, J., Ning, F., Zhou, C., & Cui, G. (2027). Large-Scale Triaxial Testing on Suffusion Characteristics and Permeability Evolution of Gap-Graded Soils under Different Controlling Constriction Sizes. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15822", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "粗粒土の内部侵食（細かい粒が流れ出すサフュージョン）を、自作の浸透・応力連成の大型三軸試験で調べ、流出口の大きさを表す指標の影響を示した（抄録）。", "p3": "支配的な狭窄サイズD_C*を流出口の大きさの指標として導入し、条件ごとに粒子の流出、粒度の変化、水理特性の変化を系統的に分析した（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "大小の粒が混ざった土に水が流れると、大きい粒のすき間から小さい粒だけが流れ出すことがあります。すると土の中がすかすかになり、ダムや堤防が弱くなります。この研究は、大型の試験装置で、出口の大きさによってその流れ出し方がどう変わるかを調べています。", "unverified": "D_C*ごとの流出量などの具体的な結果は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "AIの司会がオンライン熟議の感情を変える", "title": "AI facilitation and affective dynamics of online deliberation", "url": "https://doi.org/10.1007/s44202-026-00976-1", "authors": "Sofia Sahab ほか", "venue": "Discover Psychology", "date": "2026-10-30", "citescore": 1.8, "citescore_year": "2025", "apa": "Sahab, S., Haqbeen, J., & Ito, T. (2026). AI facilitation and affective dynamics of online deliberation. Discover Psychology. https://doi.org/10.1007/s44202-026-00976-1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "AIによる司会が、オンラインの集団討論で表される感情（センチメント）とどう関係するかを調べた（抄録）。", "p3": "アフガニスタンで行った2つの実証研究（規則ベースの司会役と大規模言語モデルに基づく司会役）で、表された感情の違いを分析した（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "オンラインの話し合いにAIの司会者を入れると、発言の量や効率が変わることは調べられてきましたが、場の「雰囲気」がどう変わるかはあまり分かっていません。この研究は、AIの司会で参加者の言葉に表れる感情が変わるかを、実際の討論で調べています。", "unverified": "AI司会の有無による感情の差の大きさは未確認。"}}, {"id": "jr23", "rank": 23, "headline": "LLMの個体間で内部機構はどこまで一致するか", "title": "Mechanistic Convergence and Divergence Across LLM Instances: Axes of Correspondence for Generalizable Interpretability Research", "url": "https://doi.org/10.1162/coli.a.663", "authors": "Sean Trott", "venue": "Computational Linguistics", "date": "2026-10-30", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Trott, S. (2026). Mechanistic Convergence and Divergence Across LLM Instances: Axes of Correspondence for Generalizable Interpretability Research. Computational Linguistics, 1–65. https://doi.org/10.1162/coli.a.663", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "あるLLMで見つかった内部機構の説明が別のLLMにも当てはまるかを判断するために、「機構の収束」に基づく考え方を提案した（抄録）。", "p3": "大きさや学習方法といった外から見える性質による参照クラスだけでは機構の共通性を保証できないとし、神経生理学の研究を手がかりに、2つのモデルが「同じ」機構を持つことの5つの対応の軸を提案した（抄録）。", "p5": "概念的な提案であり、数値の結果は示されていない（抄録）。", "fun": "あるAIの中で「この部分がこの働きをしている」と分かっても、それが別のAIにも当てはまるとは限りません。この研究は、脳科学で異なる動物の脳を比べるときの考え方を借りて、AI同士の「同じ仕組み」とは何かを整理しています。", "unverified": "5つの軸の具体的な内容は抄録の範囲で未確認。"}}, {"id": "jr24", "rank": 24, "headline": "欠けた情報源に強い財務諸表不正検知", "title": "Robust Multimodal Financial Fraud Detection via Missing-Modality-Aware Adaptive Fusion", "url": "https://doi.org/10.54097/tm3v0y54", "authors": "Beatrice Reed ほか", "venue": "Journal of Mathematical Finance and Risk Management", "date": "2026-10-29", "apa": "Reed, B., & Huang, O. (2026). Robust Multimodal Financial Fraud Detection via Missing-Modality-Aware Adaptive Fusion. Journal of Mathematical Finance and Risk Management, 1(3), 32–39. https://doi.org/10.54097/tm3v0y54", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "財務諸表不正の検知で、当期の財務諸表・発生主義の比率・複数年の推移・同業比較などの情報源の一部が欠けても順位づけが崩れない融合法MAAFを示した（抄録）。", "p3": "各情報源を専門モデルで標準化された証拠得点にまとめ、観測された情報源から欠けた情報源の証拠を推定する代理を学習して適応的に融合する（抄録）。", "p5": "欠損があると従来の検知器の得点の尺度が観測された情報源に依存し、監査対象の選定に使う順位が大きく悪化することを問題として示した（抄録）。改善の数値は未確認。", "fun": "不正を見つけるAIは、いろいろな種類の情報を組み合わせると強くなります。でも現実には、会社によってはある年のデータが欠けていることがよくあります。この研究は、欠けた情報を他の情報から推測して埋め、欠けがあっても公平に疑わしさを比べられるようにしています。", "unverified": "MAAFの性能改善の数値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "回帰・混合型表データの反実仮想説明を拡張", "title": "Extending PPCEF: probabilistically plausible counterfactual explanations for regression and heterogeneous tabular data", "url": "https://doi.org/10.1007/s10618-026-01286-9", "authors": "Oleksii Furman ほか", "venue": "Data Mining and Knowledge Discovery", "date": "2026-10-30", "citescore": 9.7, "citescore_year": "2025", "apa": "Furman, O., Lenkiewicz, Ł. u., Stefanowski, J., Wielopolski, P., & Zięba, M. (2026). Extending PPCEF: probabilistically plausible counterfactual explanations for regression and heterogeneous tabular data. Data Mining and Knowledge Discovery, 40(6). https://doi.org/10.1007/s10618-026-01286-9", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "確率的にもっともらしい反実仮想説明（PPCEF）を、回帰、カテゴリ変数を含む表データ、変えられない変数の制約へと拡張した（抄録）。", "p3": "条件付き正規化フローの密度推定で「ありそうな」反実仮想を作る元の方法に、連続値の目標、脱量子化とGumbel-Softmax緩和による質的変数の扱い、行動可能性の制約を加えた（抄録）。", "p5": "性能の数値は抄録の切れた部分にあり未確認。", "fun": "「何をどれだけ変えれば審査に通ったか」を示すのが反実仮想説明です。ただし、現実にはありえない組み合わせを提案しても役に立ちません。この研究は、データの分布から見て「ありそうな」変え方だけを提案し、年齢のように変えられない項目は動かさないようにしています。", "unverified": "評価に使ったデータと性能の数値は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "仕訳データの機械学習で小口金融の不正を早期発見", "title": "Early Detection of Fraud Indications in Ultra-Micro Financial Institutions Using Machine-Learning-based Financial Journal Data Analysis", "url": "https://doi.org/10.55927/ijis.v5i10.78", "authors": "Epa Yulaikha ほか", "venue": "International Journal of Integrative Sciences", "date": "2026-10-31", "apa": "Yulaikha, E., & Wulandari, S. S. (2026). Early Detection of Fraud Indications in Ultra-Micro Financial Institutions Using Machine-Learning-based Financial Journal Data Analysis. International Journal of Integrative Sciences, 5(10), 1273–1280. https://doi.org/10.55927/ijis.v5i10.78", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの超小口金融機関で、集計された財務諸表では見えにくい不正の兆候を、取引単位の仕訳データの機械学習で早期に見つける枠組みを示した（抄録）。", "p3": "PNMマゲ me_no": 4, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "トルコの活動的な高齢化（アクティブエイジング）政策の歩みと、WHOの高齢者に優しい都市のモデルとの整合を評価した（抄録）。", "p3": "第10〜12次開発計画のための高齢化の専門委員会報告と、高齢者の権利に関する国家行動計画（2023〜2025年）を、WHOの8つの中核領域で文書分析した（抄録）。", "p5": "温情的・サービス中心の考え方から、自律と権利を重視する考え方への転換が見られた（抄録）。", "fun": "高齢者を「お世話する対象」と見るか、「自分で決めて暮らす権利を持つ人」と見るかで、町づくりの政策は大きく変わります。この研究は、トルコの政府の計画書を読み比べ、その考え方が時代とともにどう変わってきたかを国際的な物差しで整理しています。", "unverified": "実施状況や監視の仕組みの評価の詳細は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "ボランティア活動の設計が孤独を和らげる経路", "title": "Toward Meaningful Voluntary Work Design Through Social Capital Pathways for Addressing Loneliness (MVP‐SC): A Cross‐Sectional Study Among Older Adults in Hong Kong", "url": "https://doi.org/10.1155/hsc/1915585", "authors": "Shiyu Lu", "venue": "Health & Social Care in the Community", "date": "2026-10-30", "citescore": 6.7, "citescore_year": "2025", "apa": "Lu, S. (2026). Toward Meaningful Voluntary Work Design Through Social Capital Pathways for Addressing Loneliness (MVP‐SC): A Cross‐Sectional Study Among Older Adults in Hong Kong. Health & Social Care in the Community, 2026(1). https://doi.org/10.1155/hsc/1915585", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "高齢者のボランティア活動の仕事の設計が、社会関係資本を通じて孤独とどう関係するかを検証した（抄録）。", "p3": "2024〜2025年に香港の60歳以上のボランティア457人に横断調査を行い、仕事の多様性・重要性・自律性・フィードバック・社会的支援・承認の6特性が、構造的・関係的・認知的な社会関係資本を通じて孤独と結びつくかを調べた（抄録）。", "p5": "経路の強さの数値は抄録の切れた部分にあり未確認。", "fun": "ボランティアをすると孤独が和らぐと言われますが、どんなボランティアでも同じとは限りません。この研究は、仕事を任されている感じや感謝される経験といった「活動の中身」が、人とのつながりを通じて孤独を減らすのかを調べています。", "unverified": "どの特性がどの経路で効いたかは未確認。"}}, {"id": "jr30", "rank": 30, "headline": "地域の「ネイバーフッドハウス」がつながりを育む", "title": "How Neighbourhood Houses Foster Social Connection and Strengthen Community", "url": "https://doi.org/10.1155/hsc/4405112", "authors": "Rosanne Freak-Poli ほか", "venue": "Health & Social Care in the Community", "date": "2026-10-28", "citescore": 6.7, "citescore_year": "2025", "apa": "Freak-Poli, R., Lombardo, C., Barry, R., Htun, H. L., Johnston, J., Perry, D., & Baker, J. R. (2026). How Neighbourhood Houses Foster Social Connection and Strengthen Community. Health & Social Care in the Community, 2026(1). https://doi.org/10.1155/hsc/4405112", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "地域主導の拠点であるネイバーフッドハウスに人が通う理由と、感じている利益を調べた（抄録）。", "p3": "メルボルン北部の歴史あるネイバーフッドハウスで、2024年8〜9月に13歳以上の204人を対象に地域主導の悉皆調査を行い、属性・参加の仕方・動機・自己評価の利益を量的・質的に集めた（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "誰でも気軽に立ち寄って学んだり話したりできる地域の家は、政策や予算の場では価値が見えにくい存在です。この研究は、通う人自身に理由と効果を聞くことで、目に見えにくい「つながりを生む場所」の働きを数字と言葉で示そうとしています。", "unverified": "参加の動機と利益の具体的な割合は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "レビューを続けて読む順序が判断を変える", "title": "The Power of Review Contiguity: How Sequential Viewing Shapes Consumer Judgment", "url": "https://doi.org/10.1002/mar.70299", "authors": "Woocheol Kim ほか", "venue": "Psychology and Marketing", "date": "2026-10-30", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Kim, W., Nelson, N. M., & Attari, A. (2026). The Power of Review Contiguity: How Sequential Viewing Shapes Consumer Judgment. Psychology & Marketing. https://doi.org/10.1002/mar.70299", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "オンラインレビューを1件ずつ順に見るとき、少数派のレビューがまとまって並ぶと、その多さが過大に知覚され製品評価が動くことを示した（抄録）。", "p3": "口コミ研究と作業記憶の理論から仮説を立て、4つの実験で提示の仕方（順次か一覧か）と少数派レビューのまとまり方を操作した（抄録）。", "p5": "順次提示では少数派レビューを連続させると知覚される割合が上がり評価が動いたが、散らばっていると効果は弱かった。この効果は肯定・否定の両方の少数派で現れた（抄録）。", "fun": "同じ10件のレビューでも、悪い評価が3件続けて出てくると、ばらばらに出てくるときより「悪い評価が多い」と感じてしまいます。人の記憶は直前のまとまりに引っ張られるからです。並べ方だけで判断が変わるという、身近だけれど気づきにくい現象を実験で示した点が面白いです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "飲食店の儀式的サービスは喜びか迷惑か", "title": "Pleasure or annoyance? The opposing effects of food-service rituals", "url": "https://doi.org/10.1108/ijchm-04-2026-0569", "authors": "Jiaying Ye ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-10-30", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Ye, J., & Mattila, A. S. (2026). Pleasure or annoyance? The opposing effects of food-service rituals. International Journal of Contemporary Hospitality Management, 1–19. https://doi.org/10.1108/ijchm-04-2026-0569", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "料理の提供時の儀式的な演出が、接客の満足を高める場合と下げる場合があり、その分かれ目を示した（抄録）。", "p3": "相互作用儀礼連鎖の理論に基づき、レストランを舞台にした映像による3つの実験を行った（抄録）。", "p5": "研究1で演出が満足を高める主効果を示し、研究2で快楽的な目的の客には喜びを生んで満足を高める一方、別の目的の客には苛立ちを生むことを示した（抄録）。", "fun": "店員が目の前で料理を仕上げてくれる演出は、楽しみに来た客にはうれしい一方、急いでいる客にはじれったく感じられます。同じサービスが客の目的によって正反対の効果を持つことを実験で確かめた点が面白いです。", "unverified": "研究3の内容と効果の大きさは未確認。"}}, {"id": "jr33", "rank": 33, "headline": "B2B購買チームは解釈をどうすり合わせるか", "title": "Collective Sensemaking When Purchasing Complex B2B Services: How Buying Centers Construct and Align Interpretations of Vendor Service Offering", "url": "https://doi.org/10.1177/10946705261496818", "authors": "Kofi Osei-Frimpong ほか", "venue": "Journal of Service Research", "date": "2026-10-30", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Osei-Frimpong, K., Amegbe, H., McLean, G., & Berrada, N. (2026). Collective Sensemaking When Purchasing Complex B2B Services: How Buying Centers Construct and Align Interpretations of Vendor Service Offering. Journal of Service Research. https://doi.org/10.1177/10946705261496818", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "複雑なB2Bサービスを買う購買センターが、ベンダーのサービスの解釈をどう作り、争い、すり合わせるかを「集団的なサービス提供物の意味づけ」として説明した（抄録）。", "p3": "6組織の多段階の質的な複数事例研究（2022〜2024年、面接24件、フォーカスグループ3回、調達会議の観察5回）を行った（抄録）。", "p5": "サービスの評価は、部門などのアイデンティティに根ざした解釈の枠組みから始まることを示した（抄録）。", "fun": "会社が高価なサービスを買うとき、担当者たちは別々に点数をつけて平均しているわけではありません。それぞれの立場から見えるものが違い、話し合いの中で「このサービスは何なのか」という理解をすり合わせていきます。買う側の集団の頭の中を描こうとしている点が面白いです。", "unverified": "すり合わせの過程の段階の詳細は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "線形都市は本当に到達しやすいのか", "title": "What defines the linear city? Examining accessibility premises with novel flow-based linearity indices", "url": "https://doi.org/10.1177/23998083261500494", "authors": "Yongki Kim", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-10-30", "sjr": 1.018, "citescore": 7.5, "citescore_year": "2025", "apa": "Kim, Y. (2026). What defines the linear city? Examining accessibility premises with novel flow-based linearity indices. Environment and Planning B: Urban Analytics and City Science. https://doi.org/10.1177/23998083261500494", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "線形都市のモデルが到達のしやすさの効率と公平の両方を高めるという通説を、流れに基づく新しい線形性の指標で検証した（抄録）。", "p3": "スペースシンタックスの立場から、経路が1本の軸に沿う度合いの形態的線形性指標と、経路が共通の街路に集まる度合いの構造的線形性指標を作り、ネットワークの構成だけから導いたアクセシビリティ指標と関係づけた（抄録）。", "p5": "韓国の60都市に適用し、回廊を中心とする構造だけでは到達のしやすさを保証しないことを示した（抄録）。", "fun": "「町を1本の大通りに沿って細長く作れば、誰でも移動しやすい」という考え方は、未来都市の構想でもよく登場します。この研究は、道のつながり方から人の流れを数値にし、細長いだけでは便利で公平な町にならないことを60都市で確かめています。", "unverified": "指標とアクセシビリティの関係の数値は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "建設業のAI求人は本当に遅れているか", "title": "Beyond the laggard myth: time-series analysis of AI job market dynamics in construction", "url": "https://doi.org/10.1108/sasbe-03-2026-0225", "authors": "M. Reza Hosseini ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-10-31", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "apa": "Hosseini, M. R., Gheisari, M., Vergés, R., Elghaish, F., Arashpour, M., & Rahimian, F. (2026). Beyond the laggard myth: time-series analysis of AI job market dynamics in construction. Smart and Sustainable Built Environment, 1–31. https://doi.org/10.1108/sasbe-03-2026-0225", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "建設業のAI求人市場を、デジタル産業や伝統的産業と比べる時系列分析で、建設業はAI導入が遅れているという通説を検討した（抄録）。", "p3": "Lightcastの51か月分（2021年1月〜2025年3月）の求人を使い、STL分解（周期12）、月ごとのブートストラップなどの解釈しやすい分析手法を組み合わせた（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "建設業は新しい技術の導入が遅い「後れた業界」と言われがちです。この研究は、AIに関わる求人の数を月ごとに追い、ほかの業界とどう違うのかを確かめています。後から追いつくのか、そもそも違う広がり方をするのか、という問いが面白い点です。", "unverified": "建設業と他産業の差の結果は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "仕事の欲求充足尺度のブラジル版の検証", "title": "The Work Needs Satisfaction Scale in Brazil: Psychometric Evidence and Differences by Gender and Race/Color", "url": "https://doi.org/10.1177/10690727261504430", "authors": "Alexsandro Luiz de Andrade ほか", "venue": "Journal of Career Assessment", "date": "2026-10-29", "sjr": 1.413, "citescore": 7.0, "citescore_year": "2025", "apa": "de Andrade, A. L., Nunes, J. P. R., & Pires, F. M. (2026). The Work Needs Satisfaction Scale in Brazil: Psychometric Evidence and Differences by Gender and Race/Color. Journal of Career Assessment. https://doi.org/10.1177/10690727261504430", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "仕事の欲求充足尺度のブラジル版の心理測定的な性質を確かめ、性別と人種・肌の色による欲求充足の違いを交差性の観点から調べた（抄録）。", "p3": "3回の独立した調査で集めたブラジルの成人1,521人（女性67.2%、平均年齢35.09歳）に、確認的因子分析と多群の不変性の検定を行った（抄録）。", "p5": "生存・社会的貢献・有能さ・関係性・自律性の5因子構造が適切な適合を示した（CFI = .94）（抄録）。", "fun": "「仕事でどんな欲求が満たされているか」を測る質問紙を別の国で使うには、その国でも同じ意味で測れているかを確かめる必要があります。この研究はブラジルでそれを確かめたうえで、性別や人種によって仕事で満たされるものが違うかを調べています。", "unverified": "群間差の具体的な結果は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "適応拡張カルマンフィルタで路面摩擦係数を推定", "title": "Estimation of road adhesion coefficient using an innovation-based adaptive extended Kalman filter for vehicle active safety", "url": "https://doi.org/10.1177/09544070261499852", "authors": "Kuiyang Wang ほか", "venue": "Proceedings of the Institution of Mechanical Engineers, Part D: Journal of Automobile Engineering", "date": "2026-10-30", "citescore": 4.0, "citescore_year": "2025", "apa": "Wang, K., Zhu, C., Li, S., Zhang, Y., & Zhang, J. (2026). Estimation of road adhesion coefficient using an innovation-based adaptive extended Kalman filter for vehicle active safety. Proceedings of the Institution of Mechanical Engineers, Part D: Journal of Automobile Engineering. https://doi.org/10.1177/09544070261499852", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "路面の摩擦係数（路面付着係数）を、イノベーションに基づく適応拡張カルマンフィルタ（AEKF）で4輪それぞれ実時間で推定する方法を示した（抄録）。", "p3": "従来のEKF・UKFが固定のプロセス雑音の仮定とタイヤの強い非線形への適応不足で、収束の遅さや路面の急変への弱さを持つ点に対し、雑音を適応的に調整するAEKFと3自由度の車両モデルを使った（抄録）。", "p5": "推定精度の数値は抄録の切れた部分にあり未確認。", "fun": "ABSや自動運転が正しく働くには、今走っている道路がどれくらい滑りやすいかをすぐに知る必要があります。でも路面は直接見えないので、車の揺れや回転から推測するしかありません。この研究は、路面が急に変わっても推定がついてこられるように、推定の「自信」を自動で調整しています。", "unverified": "比較手法に対する改善の数値は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "高速SSIとクラスタリングでモード同定を自動化", "title": "Efficient data-adaptive modal parameter identification based on fast stochastic subspace identification and anisotropic density clustering", "url": "https://doi.org/10.1016/j.compstruc.2026.108502", "authors": "Qingyang Wei ほか", "venue": "Computers and Structures", "date": "2026-10-30", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "apa": "Wei, Q., Zhang, S., Chen, X., Kövesdi, B., Dunai, L., & Cao, M. (2026). Efficient data-adaptive modal parameter identification based on fast stochastic subspace identification and anisotropic density clustering. Computers & Structures, 333, 108502. https://doi.org/10.1016/j.compstruc.2026.108502", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、高速な確率的部分空間同定と異方性の密度クラスタリングを組み ick, M., & Woywode, M. (2026). A Moral Foundations Perspective on CEO Political Ideology. Journal of Management. https://doi.org/10.1177/01492063261489261", "why": "CEOの政治的イデオロギーを道徳基盤理論で分解し、戦略的意思決定の予測の仕方を見直す。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "インフレへの注目には閾値がある", "title": "The Inflation Attention Threshold and Inflation Surges", "url": "https://doi.org/10.1257/aer.20250051", "authors": "Oliver Pfäuti", "venue": "American Economic Review", "date": "2026-10-30", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "apa": "Pfäuti, O. (2026). The Inflation Attention Threshold and Inflation Surges. American Economic Review, 116(11), 4203–4242. https://doi.org/10.1257/aer.20250051", "why": "インフレへの人々の注目がいつどれだけ変わるかを定量化し、注目の閾値がインフレ急騰を増幅することを示す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "人々のインフレへの注目がいつどれだけ変わるかを定量化し、その変化のマクロ経済上の意味を導いた（抄録）。", "p3": "注目の閾値を推定し、閾値を組み込んだモデルを作った（抄録）。", "p5": "注目の閾値はインフレ率4%にあり、それを超えると注目が倍になり、注目が高いときには供給ショックがインフレに強く長く効くことを示した（抄録）。", "fun": "物価が少し上がる程度なら、人はあまり気にしません。ところがインフレ率が4%を超えると急に注目が倍になり、値上げのニュースへの反応も強まる、というのがこの研究の発見です。人の「気にする・気にしない」の切り替わりが、経済全体の動きを変えるという点が面白いです。", "unverified": "モデルによる説明の定量的な結果は未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "格差縮小への人種的反発：再建期の解放民局", "title": "Inequality and Racial Backlash: Evidence from the Reconstruction Era and the Freedmen's Bureau", "url": "https://doi.org/10.1257/aer.20241561", "authors": "Eric Chyn ほか", "venue": "American Economic Review", "date": "2026-10-30", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "apa": "Chyn, E., Haggag, K., & Stuart, B. A. (2026). Inequality and Racial Backlash: Evidence from the Reconstruction Era and the Freedmen’s Bureau. American Economic Review, 116(11), 4158–4202. https://doi.org/10.1257/aer.20241561", "why": "再建期の解放民局による格差縮小に対し、多数派がどう反発したかを歴史データで示す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "人種的に分断された環境で格差が縮まるとき多数派がどう反応するかを、南北戦争後の解放民局の影響から調べた（抄録）。", "p3": "新しい歴史記録とイベントスタディの手法で、解放民局が政治・社会・経済の結果に与えた影響を推定した（抄録）。", "p5": "解放民局のある郡では、奴隷制を支持し黒人の公民権に反対していた民主党の得票率が当初は下がったが、その効果は連邦の関与が弱まるにつれて薄れた（抄録）。", "fun": "差別されてきた人々の暮らしが良くなると、それまで有利だった側が反発することがあります。この研究は150年以上前の記録を掘り起こし、格差を縮める政策が政治にどんな反応を生んだかを調べています。政策の効果が支える力の弱まりとともに消えていく様子が印象的です。", "unverified": "反発の具体的な指標と大きさは未確認。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "耐久財が限界消費性向の大きな部分を占める", "title": "Durables and the Marginal Propensity to Spend", "url": "https://doi.org/10.1257/aer.20240666", "authors": "Nathan Zorzi ほか", "venue": "American Economic Review", "date": "2026-10-30", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "apa": "Zorzi, N., & Beraja, M. (2026). Durables and the Marginal Propensity to Spend. American Economic Review, 116(11), 4077–4115. https://doi.org/10.1257/aer.20240666", "why": "家計の限界支出性向に耐久財が大きく寄与することを示し、財政政策の効果の理解を変える。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "家計の限界支出性向（MPX）の大きな部分を耐久財が占めることを踏まえ、耐久財を含む支出の定量モデルを作った（抄録）。", "p3": "多くの実証的な規則性を同時に再現するモデルで、非耐久財の反応を拡大するだけの近似と比べた（抄録）。", "p5": "その近似は耐久財のMPXの分布・持続性・景気循環性をうまく表せず、給付金の額が大きくなってもMPXの低下は非耐久財だけのモデルより緩やかだった（抄録）。", "fun": "給付金をもらったとき、人は食料品のような日用品だけでなく、家電や車のような長く使うものも買います。この研究は、長く使うものの買い方を入れると、給付金がどれくらい消費に回るかの見積もりが変わることを示しました。", "unverified": "MPXの具体的な数値は未確認。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "極端気象に対する生産ネットワーク内の企業適応", "title": "Firm Adaptation in Production Networks: Evidence from Extreme Weather Events in Pakistan", "url": "https://doi.org/10.1257/aer.20241027", "authors": "Clare Balboni ほか", "venue": "American Economic Review", "date": "2026-10-30", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "apa": "Balboni, C., Boehm, J., & Waseem, M. (2026). Firm Adaptation in Production Networks: Evidence from Extreme Weather Events in Pakistan. American Economic Review, 116(11), 4282–4325. https://doi.org/10.1257/aer.20241027", "why": "パキスタンの極端気象を使い、企業が取引網の中でどこまで適応できるかを示す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "パキスタンの企業間取引データから、企業が洪水の後にどう適応し、気候リスクへの将来の脆弱性をどこまで減らせるかを調べた（抄録）。", "p3": "月次の企業間取引データを使い、内生的な生産ネットワーク形成の空間モデルで集計的な影響を定量化した（抄録）。", "p5": "洪水の被害を受けた企業は安全な場所へ移転し、洪水の少ない地域や道路でつながる仕入れ先へ取引を移した。企業は洪水リスクを不完全にしか知らず、洪水後に考えを更新していた（抄録）。", "fun": "洪水にあった会社は、次の洪水に備えて引っ越したり、仕入れ先を変えたりします。この研究は、何百万件もの会社間の取引記録から、そうした「学び」が実際に起きていることを示しました。逆に言えば、被害にあうまでリスクを十分に知らなかったという点も興味深いです。", "unverified": "集計的な影響の数値は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "インド150万近隣の居住分離と公共サービスの格差", "title": "Residential Segregation and Unequal Access to Local Public Services in India: Evidence from 1.5 Million Neighborhoods", "url": "https://doi.org/10.1257/aer.20240179", "authors": "Sam Asher ほか", "venue": "American Economic Review", "date": "2026-10-30", "sjr": 23.489, "citescore": 19.6, "citescore_year": "2025", "apa": "Asher, S., Jha, K., Novosad, P., Adukia, A., & Tan, B. (2026). Residential Segregation and Unequal Access to Local Public Services in India: Evidence from 1.5 Million Neighborhoods. American Economic Review, 116(11), 4041–4076. https://doi.org/10.1257/aer.20240179", "why": "150万の近隣単位のデータで、ムスリムと指定カーストの居住分離と公共サービスへのアクセスの格差を示す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "インドの都市・農村の150万の近隣単位で、居住の分離と公共サービスへのアクセスの格差を調べた（抄録）。", "p3": "全国の近隣単位のデータで、ムスリムと指定カーストの居住分離の程度と、近隣ごとの公共施設・インフラの有無を比べた（抄録）。", "p5": "分離の程度は世界的に見て高く、米国の黒人・白人の分離よりわずかに低い程度だった。都市内ではムスリムと指定カーストの近隣で公共施設とインフラが系統的に少なく、逆進的な配分のほとんどが都市内の近隣の間で生じていた（抄録）。", "fun": "同じ町の中でも、住んでいる人の宗教やカーストによって、学校や水道などの公共サービスの届き方が違うことがあります。この研究は150万もの小さな地区を比べ、格差の多くが国や州ではなく町の中の地区の間で生まれていることを示しました。", "unverified": "格差の大きさの具体的な数値は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "企業支配権市場の進化", "title": "The Evolution of the Market for Corporate Control", "url": "https://doi.org/10.1111/jofi.70099", "authors": "MIKE BURKART ほか", "venue": "The Journal of Finance", "date": "2026-10-30", "sjr": 22.27, "citescore": 16.8, "citescore_year": "2025", "apa": "BURKART, M., LEE, S., & VOSS, P. (2026). The Evolution of the Market for Corporate Control. The Journal of Finance. https://doi.org/10.1111/jofi.70099", "why": "情報を持つ大株主が市場で売買するか経営に介入するかの選択をモデル化し、支配権市場の変化を説明する。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "情報を持つ大株主が、自ら買収提案をするか、他の買い手への売却を始めるか（買収アクティビズム）を選べるモデルで、企業支配権市場の変化を説明した（抄録）。", "p3": "大株主の選択そのものが情報の非対称の問題を和らげるという理論モデルを作った（抄録）。", "p5": "市場に参加する投資家が増えるにつれ、買収アクティビズムが直接の買収に代わって主な規律づけの方法になり、実務の変化と一致することを示した（抄録）。", "fun": "経営がうまくいっていない会社を立て直す方法として、大株主が自分で買い取るか、別の買い手を探してくるかの2つがあります。この研究は、どちらを選ぶかという行動そのものが、会社の本当の価値についての情報を周りに伝えるという点に注目しています。", "unverified": "モデルの実証的な検証は未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "競争上の休眠がライバルの行動を変える", "title": "Competitive Dormancy in Interfirm Rivalry: Consequences for Rival Actions", "url": "https://doi.org/10.1177/01492063261492636", "authors": "Tianxu Chen ほか", "venue": "Journal of Management", "date": "2026-10-30", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Chen, T., Chen, J., Pan, L., Tsai, W., & Chen, M.-J. (2026). Competitive Dormancy in Interfirm Rivalry: Consequences for Rival Actions. Journal of Management. https://doi.org/10.1177/01492063261492636", "why": "企業が競争行動を控える期間がライバルの行動にどう影響するかを示す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "ある企業が普段の間隔を超えて競争行動をしない「競争上の休眠」が、ライバルの次の行動にどう影響するかを調べた（抄録）。", "p3": "期待違反理論と競争ダイナミクスの研究を統合し、休眠がライバルの予想と食い違うことで解釈の過程が生じるという仮説を立てた（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "いつも新商品を出してくるライバルが急に静かになると、何かを準備しているのではと不安になります。この研究は、「何もしないこと」も相手へのメッセージになり、ライバルの行動を変えるという点に注目しています。", "unverified": "実証の結果は未確認。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "需要の構造的状態依存を実験で推定", "title": "Experimental Evidence on Structural State Dependence in Demand", "url": "https://doi.org/10.1287/mksc.2024.1274", "authors": "Sebastian Gabel ほか", "venue": "Marketing Science", "date": "2026-10-30", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Gabel, S., Guhl, D., Hitsch, G. J., & Kook, K. H. (. (2026). Experimental Evidence on Structural State Dependence in Demand. Marketing Science. https://doi.org/10.1287/mksc.2024.1274", "why": "223ブランドの自然なフィールド実験から、構造的状態依存をノンパラメトリックに推定する。", "explain": {"basis": "題名", "basis_note": "記録にあるのは1文の要約のみで、題名と要約の範囲", "preprint": false, "short": true, "p1": "自然なフィールド実験から、223ブランドについて需要の構造的な状態依存（過去に買ったことが次の選択に影響すること）をノンパラメトリックに推定した（要約）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "前に買ったブランドをまた買うのは、本当に気に入ったからなのか、単に慣れているからなのか、データだけでは区別しにくい問題です。題名からは、実験を使ってその区別に挑む研究と読めます。", "unverified": "推定結果はすべて未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "Flammer (2013)の環境CSRへの投資家反応の追試", "title": "Materiality and investor reaction to environmental corporate social responsibility : A replication and extension of Flammer (2013)", "url": "https://doi.org/10.1002/smj.70135", "authors": "Steven D. Kofford ほか", "venue": "Strategic Management Journal", "date": "2026-10-31", "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "apa": "Kofford, S. D., Lewis, B. W., & Melancon, M. (2026). Materiality and investor reaction to environmental corporate social responsibility : A replication and extension of Flammer (2013). Strategic Management Journal. https://doi.org/10.1002/smj.70135", "why": "環境CSRへの投資家反応のイベントスタディを追試・拡張し、重要性（マテリアリティ）による違いを検討する。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "環境CSRへの投資家の反応を調べたFlammer（2013）のイベントスタディを追試・拡張した（抄録）。", "p3": "元の研究の範囲の狭い追試と、標本を2019年まで延ばした準追試を行い、重要性（マテリアリティ）による違いを検討した（抄録）。", "p5": "狭い追試で元の結果を確認し、環境に良い出来事への正の反応が弱まり悪い出来事への負の反応が強まる時間的な傾向は、持続可能性をめぐる制度の大きな変化にもかかわらず2019年まで続いた（抄録）。", "fun": "企業の環境への良い行いや悪い行いのニュースに、株価はどう反応するのか。有名な研究を同じ方法でやり直し、期間を10年延ばしても同じ傾向が続くかを確かめています。良いことより悪いことに市場が敏感になっていくという結果が面白い点です。", "unverified": "マテリアリティによる違いの結果は未確認。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "データ保護規制は推薦システムの性能を下げるか", "title": "Impact of Data Privacy Regulations on Recommender Systems Performance", "url": "https://doi.org/10.1287/isre.2024.1230", "authors": "Liben Chen ほか", "venue": "Information Systems Research", "date": "2026-10-30", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "apa": "Chen, L., Zhou, M., Song, Y., & Adomavicius, G. (2026). Impact of Data Privacy Regulations on Recommender Systems Performance. Information Systems Research. https://doi.org/10.1287/isre.2024.1230", "why": "消費者がデータ収集を拒否できる規制が、データ駆動の推薦システムの性能に与える影響を示す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "企業がデータ保護規制に対応して取りうるさまざまなプライバシーの実務が、推薦システムの性能に与える影響を調べた（抄録）。", "p3": "現実のデータ保護の実務を想定した条件で推薦システムの性能を比べ、影響が個人化の文脈や応用によってどう異なるかを検討した（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "「自分のデータを集めないで」と選べる仕組みは消費者を守りますが、そのぶんおすすめ機能の精度は下がるかもしれません。この研究は、プライバシーを守る方法の違いによって、おすすめの質がどれくらい変わるかを調べています。", "unverified": "性能の低下の大きさは未確認。"}}, {"id": "jn26", "rank": 26, "field": "人口学", "headline": "フランスの人口転換の文化的起源", "title": "The cultural origins of the demographic transition in France", "url": "https://doi.org/10.1093/ej/ueag140", "authors": "Guillaume Blanc", "venue": "Economic Journal", "date": "2026-10-29", "sjr": 5.181, "citescore": 7.2, "citescore_year": "2025", "apa": "Blanc, G. (2026). The cultural origins of the demographic transition in France. The Economic Journal. https://doi.org/10.1093/ej/ueag140", "why": "世俗化が出生率低下の早い開始につながったことを示し、人口転換の文化的要因を明らかにする。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "フランスの出生率の早い低下が世俗化によって説明できることを示した（抄録）。", "p3": "オンラインの家系図からクラウドソースで作った新しいデータで出生率低下とその時期を記録し、カトリック教会の影響力の低下との関係を調べた（抄録）。", "p5": "教会の影響力の低下と人口転換の時期の間に強く頑健な関連が見られた（抄録）。", "fun": "フランスでは、ほかの国より100年も早く子どもの数が減り始めました。豊かさや教育だけでは説明がつかないこの謎に、この研究は多くの人が趣味で作った家系図のデータを使って挑み、宗教の影響力が弱まったことが鍵だったと示しています。", "unverified": "因果関係の検証の詳細は未確認。"}}, {"id": "jn27", "rank": 27, "field": "地震工学・防災", "headline": "弾性境界の吊り天井の耐震性を振動台で評価", "title": "Shake Table and Numerical Evaluation on the Seismic Performance of Elastic‐boundary Ceiling Systems", "url": "https://doi.org/10.1002/eqe.70324", "authors": "Qinghua Guo ほか", "venue": "Earthquake Engineering & Structural Dynamics", "date": "2026-10-31", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Guo, Q., Gao, W., Yang, T. Y., & Lu, X. (2026). Shake Table and Numerical Evaluation on the Seismic Performance of Elastic‐boundary Ceiling Systems. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70324", "why": "非構造部材である吊り天井の耐震性能を振動台実験と数値解析で評価する。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "吊り天井の周囲を壁と結ぶ弾性スリーブ接続を提案し、振動台実験と数値解析で耐震性能を評価した（抄録）。", "p3": "埋め込んだばねで剛性を調整できる接続で天井の周辺と壁を結び、境界の剛性の役割を調べた（抄録）。", "p5": "性能の数値は抄録の切れた部分にあり未確認。", "fun": "大地震では、建物の骨組みが無事でも天井が落ちて使えなくなることがあります。この研究は、天井と壁のすき間をばねでつなぎ、その硬さを調整することで揺れへの強さを変えられるかを確かめています。", "unverified": "ばね剛性ごとの性能の結果は未確認。"}}, {"id": "jn28", "rank": 28, "field": "地震工学・防災", "headline": "方位に依存しない応答スペクトル適合波の生成", "title": "Generation of Orientation‐Independent Response Spectrum‐Matched Records Satisfying Minimum Fourier Amplitude and Power Spectral Density Requirements", "url": "https://doi.org/10.1002/esp4.70136", "authors": "Luis A. Montejo", "venue": "Earthquake Spectra", "date": "2026-10-28", "citescore": 7.7, "citescore_year": "2025", "why": "最小フーリエ振幅とパワースペクトル密度の条件を満たす、方位に依存しない応答スペクトル適合記録を生成する。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "重要施設の耐震設計に使う、方位に依存しない応答スペクトル適合の加速度記録を、最小フーリエ振幅とパワースペクトル密度の条件を満たすように作る方法を示した（抄録）。", "p3": "スペクトル適合の過程で特定の周波数のエネルギーが失われ、建屋内の応答スペクトルが不安定・非保守的になる問題に対し、米国原子力規制委員会の審査指針の条件を取り入れた（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "原子力発電所などの設計では、目標の揺れの強さに合わせて調整した地震の波を使います。ところが合わせ込む途中で一部の周波数の揺れが抜け落ち、建物の中の機器の揺れを小さく見積もってしまうことがあります。この研究はその抜け落ちを防ぐ方法を示しています。", "unverified": "生成した記録の性能評価は未確認。"}}, {"id": "jn29", "rank": 29, "field": "地震工学・防災", "headline": "サイト固有の地震ハザード解析SSHACの再検討", "title": "SSHAC Revisited: Adapting Site‐Specific Seismic Hazard Analyses for Modern Applications", "url": "https://doi.org/10.1002/esp4.70132", "authors": "Julian J. Bommer ほか", "venue": "Earthquake Spectra", "date": "2026-10-31", "citescore": 7.7, "citescore_year": "2025", "why": "30年の経験をもとに、SSHACによるサイト固有の地震ハザード解析を現代の用途に合わせて見直す。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "地震ハザード解析のSSHACの指針を30年実施してきた経験から、手順の改善と、まだ指針に入っていない教訓を整理した（抄録）。", "p3": "とくにレベル1〜3の研究の位置づけ、参加者の選び方、解析中の参加者同士の関わり方の構成についての教訓を論じた（抄録）。", "p5": "概念的・実務的な整理であり、数値の結果はない（抄録）。", "fun": "ある場所でどれくらいの地震が起こりうるかの見積もりは、専門家の間でも意見が分かれます。SSHACは、その意見の違いをきちんと集めて扱うための手順です。誰を集め、どう議論させるかが答えの信頼性を左右する、という点が面白いです。", "unverified": "具体的な改善の提案の全体は未確認。"}}, {"id": "jn30", "rank": 30, "field": "地震工学・防災", "headline": "堤防決壊シナリオの洪水被害を確率的に評価", "title": "A probabilistic framework for flood damage assessment under levee-breach scenarios for insurance applications", "url": "https://doi.org/10.1016/j.ijdrr.2026.106538", "authors": "Marco D’Oria ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-10-30", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "why": "堤防決壊のシナリオに基づく洪水被害の確率的評価の枠組みを、保険の用途に向けて示す。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、堤防決壊のシナリオに基づく洪水被害を、保険の用途に向けて確率的に評価する枠組みの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "堤防がどこで切れるかによって、浸水する範囲も被害額も大きく変わります。題名からは、そのたくさんの可能性を確率として扱い、保険料の計算などに使える形にする研究と読めます。", "unverified": "手法の内容と結果はすべて未確認。"}}, {"id": "jn31", "rank": 31, "field": "地震工学・防災", "headline": "酷暑は「周縁化された災害」である", "title": "Extreme heat as an actively marginalised disaster: A layered heat marginalisation framework from Nagpur’s non-notified slums", "url": "https://doi. 動かす折り紙の状態機械で、どんな未知の初期状態からでも目標の状態へ確実に移せることを示した（抄録）。", "p3": "クレスリング折り紙のモジュールを組み合わせた構造で、エネルギー障壁が互いに異なると仮定し、すべての状態に到達できる遷移グラフを実現した。グラフに従って回転磁場を与える（抄録）。", "p5": "状態空間を拡大できる完全に到達可能な遷移グラフが得られた（抄録）。", "fun": "折り紙の筒は、押すとパチンと別の形に切り替わり、その形のまま止まります。これをいくつもつなげて磁石で動かすと、たくさんの形の中から好きな形を遠隔で選べる「機械」になります。今どの形かが分からなくても目標の形にたどり着ける手順がある点が面白いです。", "unverified": "実験での状態数と成功率は未確認。"}}, {"id": "jn34", "rank": 34, "field": "総合誌", "headline": "粗い気候モデルは沿岸の湿熱極値を過小評価する", "title": "Coarse climate model grids underestimate coastal humid-heat extremes", "url": "https://doi.org/10.1126/sciadv.ael4020", "authors": "Cosimo E. Carniel ほか", "venue": "Science Advances", "date": "2026-10-30", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "気候モデルの格子が粗いと沿岸の湿熱の極値が過小評価されることを示し、人への熱リスクの評価を見直させる。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "アラビア半島周辺の沿岸の湿熱極値が、粗い格子の気候モデルでは過小評価されることを示した（抄録）。", "p3": "nextGEMSの約9 kmの解像度の結合シミュレーション（ICONとIFS-FESOM）を、観測所の観測、ERA5、CMIP6の予測と比べた（抄録）。", "p5": "IFS-FESOMは観測された湿球温度の上側の裾をよく再現し、CMIP6の分布の高い側に位置した（抄録）。", "fun": "暑さに湿気が加わると、汗が乾かず体を冷やせなくなり、人が生きられる限界に近づきます。そうした極端な蒸し暑さは海岸沿いの狭い範囲で起きるため、粗い目の気候モデルでは見逃されがちです。細かい目のモデルで、そのリスクを見直している点が重要です。", "unverified": "過小評価の大きさの数値は未確認。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "AIの責任は機械学習の枠組みに根ざして考える", "title": "Where intention goes, responsibility flows: Grounding AI accountability in the machine learning paradigm", "url": "https://doi.org/10.1073/pnas.2610670123", "authors": "Martin Hilbert", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-30", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "AIの説明責任を、設計者の意図が学習過程を通じてどう流れるかという機械学習の枠組みから整理する。", "explain": {"basis": "抄録", "basis_note": "上位10%誌の記録の抄録を使用", "preprint": false, "short": true, "p1": "米国でAI企業の責任を問う訴訟の流れを整理し、その共通原理が機械学習の設計そのものにあると論じた（抄録）。", "p3": "製造物責任や代理法の議論と、通信品位法230条や表現の自由の議論を比べ、すべての機械学習システムは学習前に人が定めた目的関数から成るという点に着目した（抄録）。", "p5": "概念的な論考であり、数値の結果はない（   var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
