<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

hamed Bachar (LINEACT) ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bachar, M., Abouelaziz, I., & Ding, Y. (2026). Continuous-Time Set-Transformers for Asynchronous WiFi-IMU Indoor Localization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13057", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "WiFiの電波強度と慣性計測という、時刻のそろわない二種類のセンサ列を、共通の時計に並べ直さずにそのまま統合して屋内測位する方法を示した（抄録）。", "p3": "各観測を、測定値・センサの種類・取得からの経過時間を持つ時刻つきトークンの集合として表し、一つの注意機構でまとめて融合する。学習時に種類ごと・観測ごとの欠落を無作為に作り、欠測や古い入力に耐えるようにする（抄録）。", "p5": "別の日に集めたデータを含む実データで、公開のWiFi指紋法の基準を上回り、学習型の融合や推測航法の基準とは同程度で、観測が欠けたり古くなったりしても性能はゆるやかに下がるにとどまった（抄録）。数値は抄録に記載なし。", "fun": "二つのセンサが別々のリズムで測っていると、同じ瞬間のデータがそろうことはほとんどない。ふつうは時刻をそろえ直すが、この研究は「いつ測ったか」を各データに添えたまま、ばらばらの集まりとして読ませる。順番に並べ直さなくても、名札に時刻が書いてあれば話がつながる、という考え方である。", "unverified": "本文未読のため、測位誤差の値とデータセットの規模は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "地下鉄振動を砂・セラムサイト充填杭で低減", "title": "Field application of sand-ceramsite in-filled pile barrier in mitigating metro train-induced vibrations", "url": "https://doi.org/10.21203/rs.3.rs-11065152/v1", "authors": "Weili Luo ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Luo, W., & Deng, S. (2026). Field application of sand-ceramsite in-filled pile barrier in mitigating metro train-induced vibrations. https://doi.org/10.21203/rs.3.rs-11065152/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "地下鉄の走行で生じる地盤振動を、砂とセラムサイト（軽量の焼成粒）の混合材を詰めた杭の列で遮る対策を、現場に適用して効果を測った（抄録）。", "p3": "振動の伝播経路に杭列を設置して原位置試験を行い、実測で検証した有限要素モデルで杭の列数・間隔・充填材の剛性の影響を調べた（抄録）。", "p5": "地盤振動を最大63%低減し、挿入損失の平均の最大は14.6 dBだった。列数を増やす、杭間隔を狭める、ヤング率の低い充填材を使うほど効果が高まる（抄録）。", "fun": "電車が通ると、揺れが地面を伝わって家まで届く。この研究は、道筋の途中に「やわらかい詰め物をした杭の壁」を並べて揺れを弱めた。意外なのは、固い材料より、やわらかい（ヤング率の低い）詰め物のほうがよく効くという点で、硬い壁で跳ね返すのとは違う効き方をしている。", "unverified": "本文未読のため、測定点の配置、対象の周波数帯、地盤条件は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "無人車両の自己位置制御にオンライン同定", "title": "Self-Position Control of Unmanned Vehicle Using Online System Identification", "url": "https://doi.org/10.21203/rs.3.rs-11400768/v1", "authors": "Ehab Safwat ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Safwat, E., Ouda, A. N., & Mohamed, A. (2026). Self-Position Control of Unmanned Vehicle Using Online System Identification. https://doi.org/10.21203/rs.3.rs-11400768/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "走行中の無人地上車両のモデルのパラメータを逐次推定し、その推定値を使って自己位置を制御する方法を示した（抄録）。", "p3": "ローバー車両を対象に、逐次最小二乗法（Recursive Least Squares）で未知のパラメータをオンラインで推定し、推定を続けながら働く自己位置制御器を設計した（抄録）。", "p5": "シミュレーションで、同定したモデルがローバーのモデルに合い、制御器の性能が高いと報告する（抄録）。誤差などの数値は抄録に記載なし。", "fun": "車は荷物や路面で性質が変わるのに、制御の設計では決まった値を使うことが多い。この研究は、走りながら「いまの自分の車の性質」を測り直し、その値で舵を切る。毎日体重計に乗って食事を調整するように、測ることと合わせることを同時に回す考え方である。", "unverified": "検証はシミュレーションと読め、実機での結果や誤差の値は抄録からは未確認。"}}, {"id": "pr20", "rank": 20, "headline": "物理の連鎖で故障診断を支えるLLM推論", "title": "Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning", "url": "https://arxiv.org/abs/2611.14263", "authors": "Wenqi Zhou ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhou, W., Baldo, L., Goebel, K., & Chao, M. A. (2026). Chain of Physics: Supporting Fault Diagnosis with Engineering-Inspired Large Language Model Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14263", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "設備の参考資料から自動で作った知識グラフを使い、LLMに「故障→物理量の変化→それを捉えるセンサ」の連鎖をたどらせて故障診断の精度を上げた（抄録）。", "p3": "故障モード・物理量の変化・監視センサを結ぶ診断の連鎖を制約つき知識グラフに蓄え、質問に似た経路を検索して情報と例示の両方に使う。候補の故障モードごとにLLMが連鎖を生成し、最後に選択肢と照合する（抄録）。", "p5": "FailureSensorIQベンチマークの4種の産業設備と3つのLLMで、直接の質問より7.8〜19.6ポイント、通常の検索拡張生成より11.7〜18.2ポイント正答率が上がった（抄録）。", "fun": "ベテランの技術者は「この部品が壊れると温度が上がり、だからこのセンサに出る」と理由の鎖をたどって原因を当てる。この研究は、その鎖を説明書から自動で地図にして、AIに同じたどり方をさせた。知識を丸ごと渡すより、理由の道筋を見せたほうが当たるようになる、という結果が面白い。", "unverified": "本文未読のため、知識グラフの規模と設備ごとの正答率は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "非凸の粒状ローターが対を作り鎖に自己集合", "title": "Mechanical pairing and self-assembled chains of non-convex granular rotors", "url": "https://arxiv.org/abs/2611.14120", "authors": "Thomas Barois ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Barois, T., Labiausse, M., Boudet, J.-F., Lintuvuori, J. S., & Kellay, H. (2026). Mechanical pairing and self-assembled chains of non-convex granular rotors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14120", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "回転する非凸形状の粒（粒状ローター）が、互いに引き合って対を作り、鎖状の構造に自己集合することを実験と数値計算で示した（抄録）。", "p3": "まず二つのローターの間の相互作用を調べ、回転の活動度と雑音の比、およびローターの形で決まる引力的な相互作用を確かめた（抄録）。", "p5": "ローター対の結合した状態から丈夫な鎖ができ、鎖は初めに並べても、自己集合で自然に生じても得られる（抄録）。数値は抄録に記載なし。", "fun": "磁石でも糊でもないのに、回るだけの粒どうしがくっついて鎖になる。決め手は、粒がへこみのある形をしていることと、回る勢いが揺らぎに比べてどれだけ強いかである。ばらばらの部品が設計図なしに形を作る「自己集合」が、目に見える大きさの粒でも起きるのが面白い。", "unverified": "本文未読のため、ローターの形状と寸法、鎖の長さの分布は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "湿った粒状体の山を体積率を制御して再現性よく", "title": "Cohesive granular piles with controlled volume fraction", "url": "https://arxiv.org/abs/2611.14128", "authors": "Pierre Jodlowski ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Jodlowski, P., Dalbe, M.-J., & Vandenberghe, N. (2026). Cohesive granular piles with controlled volume fraction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14128", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "湿った粒状体の実験で結果がばらつく問題に対し、円筒容器に体積率（volume fraction）を制御した大きな試料を再現性よく作る手順を示した（抄録）。", "p3": "異なる粒状材料と体積率で試料を作って再現性を定量的に確かめ、マイクロCTのX線撮影で内部の微細構造を調べた（抄録）。", "p5": "試料全体の体積率と局所の体積率の差は小さく、同じ試料の異なる高さでの撮影でも均質さが確かめられた（抄録）。数値は抄録に記載なし。", "fun": "砂場の湿った砂は、握り方ひとつで固さが変わる。実験でも同じで、詰め方が毎回違うと結果を比べられない。この研究は「同じ詰まり具合の砂山を何度でも作れる手順」を作り、X線で中まで均一かを確かめた。派手な発見ではないが、測定の土台をそろえる仕事の大切さが分かる。", "unverified": "本文未読のため、体積率の範囲とばらつきの大きさは未確認。"}}, {"id": "pr23", "rank": 23, "headline": "地すべりの認識と理解を統合する基盤モデル", "title": "LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding", "url": "https://arxiv.org/abs/2611.12936", "authors": "Shanwen Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, S., Wang, S., Sun, X., & Han, J. (2026). LandslideFM: A Foundation Model Towards Unified Landslide Perception and Understanding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12936", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "地すべりの画像から場所を見つける視覚タスクと、状況を文章で説明・推論するタスクを一つにつないだ基盤モデルLandslideFMを提案した（抄録）。", "p3": "少ないラベルつきデータと多数のラベルなしデータを使う半教師あり学習で複数の視覚タスクに適応させ、予測した地すべり領域を空間的な手がかりとして、効率的に微調整した視覚言語モデルに渡す（抄録）。", "p5": "公開データと新しく作ったベンチマークLandslideVLで定量・定性ともに優れ、地すべりの推論と場面分析で汎用の視覚言語モデルを上回ったと報告する（抄録）。数値は抄録に記載なし。", "fun": "これまでのAIは「写真のどこが地すべりか」を塗るだけで、なぜ危ないかは答えられなかった。この研究は、塗った結果を手がかりにして、言葉で状況を説明するところまで一つのモデルでつないだ。見つける目と説明する口を別々にせず、一体にした点が新しい。", "unverified": "本文未読のため、精度の数値とベンチマークの規模は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "不確かな非線形系の状態分布の伝播を学習", "title": "Learn-To-Propagate: Distributionally Robust Motion Planning for Nonlinear Uncertain Systems", "url": "https://arxiv.org/abs/2611.13863", "authors": "Eduardo Figueiredo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Figueiredo, E., Banse, A., Ho, Q. H., Jungers, R., Lahijanian, M., & Laurenti, L. (2026). Learn-To-Propagate: Distributionally Robust Motion Planning for Nonlinear Uncertain Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13863", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "初期状態と雑音の確率分布が分からない非線形の確率システムに対し、安全性の保証つきで経路を計画するアルゴリズムを示した（抄録）。", "p3": "最適輸送を使って、真の分布を高い信頼度で含む「あいまいさ集合」を学習し、それを系のダイナミクスに沿って伝播させて安全性を検証しながら、状態空間に探索木の森を成長させる（抄録）。", "p5": "返される計画が指定した信頼度で仕様を満たすこと（正しさ）と、条件のもとでの確率的完全性を証明し、ロボットのベンチマークで既存手法を大きく上回った（抄録）。数値は抄録に記載なし。", "fun": "ロボットの位置には必ず誤差があり、時間がたつほどその「あやふやさの雲」は広がる。この研究は、雲の形を仮定せず、データから「本当の雲はこの範囲に入っている」という枠を学び、その枠ごと未来へ運んで、ぶつからない道を探す。分からないことを分からないまま安全に扱う工夫である。", "unverified": "本文未読のため、対象のベンチマークと計算時間、保証の信頼度の値は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "少ない高精度データで作る多忠実度の縮約モデル", "title": "Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity", "url": "https://arxiv.org/abs/2611.13624", "authors": "Vivian Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, V., Koike, T., Rex, A., & Qian, E. (2026). Multifidelity Operator Inference for Non-intrusive Model Reduction under Data Scarcity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13624", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "高精度の計算データが少ないとき、粗い計算の安価なデータを併用して、偏微分方程式の縮約モデルを低い分散で学習する方法（MF-OpInf）を示した（抄録）。", "p3": "状態とその時間微分のデータから縮約した演算子を当てはめる演算子推論（Operator Inference）に、多忠実度の線形回帰を組み込み、粗い離散化で得た低忠実度データで推定を補う（抄録）。", "p5": "モデル的な偏微分方程式の数値実験で、同じ計算予算のもと、高忠実度データだけの演算子推論より解の場を高い精度で予測した（抄録）。数値は抄録に記載なし。", "fun": "精密な計算は高くて少ししかできず、粗い計算は安いが不正確である。この研究は両方を混ぜ、「少ない精密な答え」のばらつきを「たくさんの粗い答え」で抑える。高い模試を数回、安い小テストをたくさん受けて、合わせて実力を見積もるのに近い考え方である。", "unverified": "本文未読のため、対象とした方程式と精度の改善幅は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "信用リスクの時変特徴量は偽薬検定で確かめる", "title": "A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models", "url": "https://doi.org/10.2139/ssrn.7684404", "authors": "Nawaz Muhammad", "venue": "SSRN", "date": "2026-11-10", "apa": "Muhammad, N. (2026). A Calibrated Placebo Test for Time-Varying Features in Credit Risk Models. https://doi.org/10.2139/ssrn.7684404", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "信用リスクモデルに時変の特徴量（景気指標や文章のトーン）を足してAUCが上がるかを見る通常の検証が、無意味な特徴量でも高率で通ってしまうことを示し、代わりの偽薬検定を提案した（抄録）。", "p3": "実際の系列と同じ持続性を持つ偽の系列を生成して同じ検証にかけ、本物の特徴量がそれらを上回るかで判定する。単に並べ替えただけの偽系列は、期間効果を統制したときにだけ妥当になる（抄録）。", "p5": "信用循環を統制しないと、純粋な雑音の特徴量が基準のシミュレーションで38%、循環が漂うと67%通過する（名目は5%）。持続性を合わせた偽薬検定では2〜5%に収まるが、検出力は73%から30%に下がる（抄録）。", "fun": "「この指標を足したら予測が良くなった」は、実は当てにならないことがある。景気のようにゆっくり動く数字は、中身がでたらめでも景気の波をなぞって、見かけ上役に立ってしまうからだ。そこで、同じくらいゆっくり動く偽物を作って比べる。薬の効き目を偽薬と比べるのと同じ発想を、予測モデルの検証に持ち込んでいる。", "unverified": "本文未読のため、シミュレーションの設定と、公開の融資データ2件での詳しい結果は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "炭素クレジット開示を少数例で分類するBERT", "title": "CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures", "url": "https://doi.org/10.21203/rs.3.rs-11679188/v1", "authors": "Hang Thanh Bui ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bui, H. T., Lee, E., & Evans, M. C. (2026). CarbonCrediBERT: Expert-Guided Few-Shot and Selective Classification of Carbon Credit Disclosures. https://doi.org/10.21203/rs.3.rs-11679188/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "企業報告書の中の炭素クレジットに関する記述を、関連性・論調・クレジットの使い方の三点で分類し、不確かなものは人の確認に回す枠組みCarbonCrediBERTを示した（抄録）。", "p3": "専門家が定めた分類体系、紛らわしいが無関係な文章を使った難しい負例、少数の専門家ラベルに向く分類手法を組み合わせる。豪州のASX100企業の2024〜2025年の報告書から8,299件の文と15,026段落の候補を作り、課題ごとに100段落の専門家ラベルで評価した（抄録）。", "p5": "関連性の判定では微調整したClimateBERTが交差検証で選ばれて正解率93.8%、論調とクレジットの使い方では少数例学習のSetFit–MiniLMが選ばれ、三つの課題すべてで最良になる単一の手法はなかった（抄録）。", "fun": "「クレジット」「オフセット」「ネット」という言葉は、会計や金融の話にも普通に出てくるので、単語を探すだけでは炭素クレジットの話かどうか分からない。この研究は、わざと紛らわしい文章を「違う例」として学ばせ、自信のないものは人に回す。AIに全部任せず、迷ったら聞く仕組みにした点が実務的である。", "unverified": "抄録の末尾が切れており、棄権（人への回付）の割合と論調・使い方の課題の精度は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "顧客企業の融資関係が監査の生産過程を変える", "title": "Client Lending Relationships and Audit Production (WP)", "url": "https://doi.org/10.2139/ssrn.7685030", "authors": "Jie Hao ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hao, J., & Pham, V. T. (2026). Client Lending Relationships and Audit Production (WP). https://doi.org/10.2139/ssrn.7685030", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "企業と貸し手の融資関係の強さが、監査人の作業の進め方（監査の生産過程）に関係することを示した（抄録）。", "p3": "貸し手は審査と監視を繰り返して借り手の下振れリスクを評価し続けるため、融資関係が監査計画の手がかりになると考え、関係の強さと監査報酬・監査報告までの日数・継続企業に関する意見の正確さとの関連を調べた（抄録）。", "p5": "融資関係が強いほど監査報酬が低く、監査報告の遅れが短く、不正確な継続企業の意見を出す可能性が低い。貸し手のリスク評価の情報量が多い場合や、貸し手と監査人の連絡が効率的な場合に関連が強い（抄録）。効果の大きさは抄録に記載なし。", "fun": "監査人は会社の帳簿を一から調べる、と思いがちだが、銀行が長年その会社を見張ってきた事実も手がかりになる。銀行との付き合いが深い会社ほど、監査にかかる手間が少なく、判断も外れにくかった。別々の仕事に見える「貸す人の目」と「調べる人の目」がつながっている点が面白い。", "unverified": "本文未読のため、標本の国・期間・規模、融資関係の強さの測り方は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "気候リスクの開示と炭素テールリスクの関係", "title": "Climate Change Risk Disclosure and Carbon Tail Risk", "url": "https://doi.org/10.2139/ssrn.7683085", "authors": "Charlie Xiaowu Cai ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Cai, C. X., Qiu, J., Zhang, Z., & Zhao, R. (2026). Climate Change Risk Disclosure and Carbon Tail Risk. https://doi.org/10.2139/ssrn.7683085", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "米国企業の年次報告書（10-K）のリスク要因での気候変動リスクの開示が、排出量とオプション市場のテールリスクの結びつきを弱めることを示した（抄録）。", "p3": "2006年以降の米国企業について、排出量に対するテールリスクの傾きを、オプション価格から求めた3つのリスク指標で測り、開示との関係を調べた（抄録）。", "p5": "開示のある企業は3つの指標のすべてで傾きが緩やかで、この弱まりは負債の少ない企業や、情報需要・監視の強い企業で大きい。基準の結果を動かすのは移行リスクの開示で、決算説明会での言及にも同じ効果があるが10-Kより小さい（抄録）。", "fun": "二酸化炭素をたくさん出す会社ほど、将来の規制で大きく損をするかもしれないと市場は心配する。ところが、会社が自分の気候リスクを文章で説明していると、その心配の度合いが小さくなっていた。数字でなく「言葉での説明」が、先行きの読みにくさを減らして値づけに効く、という点が面白い。", "unverified": "抄録の対象期間の終わりの年は表記が不明瞭（「2006-024」）で未確認。効果の大きさも抄録に記載なし。"}}, {"id": "pr30", "rank": 30, "headline": "CEOと従業員の政治的距離が業績予想を減らす", "title": "CEO–Employee Political Alignment and Financial Reporting Outcomes", "url": "https://doi.org/10.2139/ssrn.7684538", "authors": "Sang Woo Sohn", "venue": "SSRN", "date": "2026-11-11", "apa": "Sohn, S. W. (2026). CEO–Employee Political Alignment and Financial Reporting Outcomes. https://doi.org/10.2139/ssrn.7684538", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "CEOと従業員の政治的な立場の隔たりが大きい企業ほど、自発的な業績予想が少なく、財務報告の質も低いことを示した（抄録）。", "p3": "個人の政治献金からCEOと従業員の党派性を測り、その距離と、経営者の業績予想の頻度、内部統制の重要な欠陥の報告、修正再表示の可能性との関連を調べた（抄録）。", "p5": "距離が大きいほど業績予想が少なく、重要な欠陥が多く、修正再表示の可能性が高い。予想との関連は、従業員数が多い、地理的に分散している、事業区分が多い、労働集約的な企業で強い（抄録）。効果の大きさは抄録に記載なし。", "fun": "社長と社員の支持政党が違うことが、決算の数字の正確さに関係するとは思いにくい。しかしこの研究は、政治的な距離が大きい会社ほど、見通しの公表が減り、後からの訂正が増えることを見つけた。社内で情報が上に上がりにくくなるためだと著者は解釈している。職場の「話しにくさ」が会計の質にまで届く、という視点が新しい。", "unverified": "本文未読のため、標本の期間と規模、因果関係の識別の方法は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "決算説明会の質疑応答の多ラベルデータセット", "title": "Bridging Public Relations Theory and Corporate Communication: A Multi-Label Dataset of Earnings-Call Q&amp;A Exchanges", "url": "https://doi.org/10.2139/ssrn.7685489", "authors": "Leyi Ouyang", "venue": "SSRN", "date": "2026-11-11", "apa": "Ouyang, L. (2026). Bridging Public Relations Theory and Corporate Communication: A Multi-Label Dataset of Earnings-Call Q&amp;A Exchanges. https://doi.org/10.2139/ssrn.7685489", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "米国の主要企業の決算説明会の質疑応答を、広報研究の理論と経営者の答え方の両面から多ラベルで注釈した縦断データセットを作った（抄録）。", "p3": "2015〜2024年の質疑を対象に、文献から導いた437の研究課題（132の理論・モデル・枠組み、12の研究領域）との関連づけと、応答の的確さ・情報開示・評判の修復など9次元77区分の応答分類という、二つの注釈体系を付けた（抄録）。", "p5": "理論の網羅は広いが偏りがあり、組織の説明・正統性・利害関係者との関係の枠組みが多く現れた。業種や時期による答え方の違いがあり、時間変化の解釈では応答の長さを考慮する必要がある（抄録）。質疑の件数は抄録に記載なし。", "fun": "決算説明会では、アナリストの鋭い質問に経営者がどう答えるかが見ものである。正面から答えるのか、はぐらかすのか、言い訳をするのか。この研究は、その答え方を細かく区分して、長い期間の質疑に札を付けた。理論の本に書かれた「組織の語り方」が、実際の会話でどれだけ起きているかを数えられるようにした点が面白い。", "unverified": "本文未読のため、質疑の件数、注釈の方法（人手かモデルか）と信頼性は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMは心理的構成概念を内部に持つのか", "title": "Tracing Psychometric Inference in Large Language Models", "url": "https://arxiv.org/abs/2611.12937", "authors": "Chih-Hao Hsu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Hsu, C.-H., Chou, F.-C. B., & Chen, P.-H. A. (2026). Tracing Psychometric Inference in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12937", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "LLMが心理尺度どうしの相関らしい出力を出すだけでなく、内部表現にも対応する構造を持つかを、ペルソナを横断する課題で調べた（抄録）。", "p3": "実在の272人（台湾の大学生）の一つの心理尺度への回答を与えて他の六つの尺度への回答を予測させ、2系統14種のモデルで、行動の水準（尺度間相関の再現）と内部の水準（対照方向の解析と活性化のプローブ）を比べた（抄録）。", "p5": "大きいモデルは人間の尺度間相関を再現し、さらに増幅した。指示調整版では内部の幾何が人間の相関行列と整合し、その強さは行動の増幅と関連した（r = 0.68）。ただし測った方向が回答を媒介することまでは示していない（抄録）。", "fun": "性格テストでは「外向的な人は不安が低い傾向がある」のように、尺度どうしにつながりがある。LLMにある人の一つのテスト結果を見せて他のテストを予測させると、このつながりを人間の実際より強く出すことが分かった。AIは人の性格の「型」を、現実よりくっきりした形で持っているらしい、という発見が面白い。", "unverified": "本文未読のため、使用した尺度の名称と、増幅の大きさの詳細は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "非対称な協力パズルでLLMの協働を評価", "title": "PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles", "url": "https://arxiv.org/abs/2611.14242", "authors": "Javier Hernandez ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Hernandez, J., & Wilson, A. D. (2026). PARLEY: Evaluating LLM Collaboration Through Cooperative Asymmetric Puzzles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14242", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "情報が片方ずつに分かれた協力パズルでLLMエージェント同士の協働を調べる基盤PARLEYを作り、失敗の型を整理した（抄録）。", "p3": "認知心理学に基づく4種の非対称パズル（指示対象の伝達、共同の調整、視点取得、空間推論）をGPT-4oの二体組に解かせ、会話から、知覚・適応・調整の3領域6種の失敗分類をデータに基づいて導いた（抄録）。", "p5": "400会話の成功率は60.5%で、課題により34〜80%の幅があった。外部からのフィードバックを取り込めず同じ失敗を繰り返すことが不成功の重要な目印で、分類に基づく介入で平均成功率は70.5%に上がった（抄録）。", "fun": "二人で協力しないと解けないパズルを、AI同士にやらせるとどうなるか。賢いはずのAIでも、相手から「それは違う」と言われても同じやり方を繰り返して失敗することが多かった。人間のグループワークでもよくある失敗であり、原因を型に分けて対策を入れると成功率が上がった点が実用的である。", "unverified": "本文未読のため、各パズルの具体的な内容と介入の方法は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "性格を介した文化適応の対話生成", "title": "HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation", "url": "https://arxiv.org/abs/2611.13207", "authors": "Lingzhi Shen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Shen, L., Cai, X., Long, Y., Razzak, I., & Jameel, S. (2026). HiCAP: Hierarchical Cultural Adaptation via Personality for Dialogue Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13207", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "文化に合わせた対話生成に話し手の性格を組み込み、まず文化の調子に合わせ、次に性格に応じて表現と内容を調整する枠組みHiCAPを提案した（抄録）。", "p3": "性格で条件づけた制御機構が応答の様式を階層的に調整する。教師つき微調整と指示による調整を組み合わせ、動的な指示テンプレートと複数エージェントの実演で、文化と性格の多様な組合せを学ばせる（抄録）。", "p5": "CulturalPersonasとCPEDの二つのデータで、対話生成の各指標を通じて全体として最も高い性能を示した（抄録）。数値は抄録に記載なし。", "fun": "同じ国の人でも、おしゃべりな人と無口な人では話し方が違う。これまでの対話AIは「その文化らしい話し方」だけを合わせようとしていたが、この研究は、文化という大枠の中に個人の性格という細かい違いを重ねた。まず土地の言葉づかい、次にその人らしさ、という二段構えが自然な会話に近い。", "unverified": "本文未読のため、評価指標の値、比較した手法、扱った文化と性格特性の範囲は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "判断を先取りしない市民向けAIで環境正義を議論", "title": "EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice", "url": "https://arxiv.org/abs/2611.13525", "authors": "Evan Pa\\v{c}es-Wiles ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Pačes-Wiles, E., Alvarez, B., Gulabani, S., Kolipaka, A., & Gaikwad, S. 'N. S. (2026). EJAI: Judgment-Preserving Civic AI for Data Center Environmental Justice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13525", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "データセンターの立地をめぐる環境正義の議論で、AIが結論を先に出さず、住民が根拠を自分で確かめて提言を作れるようにする市民向けシステムEJAIを作った（抄録）。", "p3": "対話型の地図、検索した根拠資料、データの欠落の明示、立場の異なる二つの利害関係者ペルソナを結びつける。21件の質問による機能評価と、住民役の15人が模擬の公聴会に備える参加者内実験で調べた（抄録）。", "p5": "事実に関する主張の98.4%が検索した根拠に支えられ、根拠の欠落は33件中32件で認めた。一方、企業幹部のペルソナは、割り当てられた優先事項に反する根拠の一部を省いた（抄録）。", "fun": "AIに「データセンターを建てるべきか」と聞くと、もっともらしい答えが返ってきて、人は自分で証拠を見なくなる。この研究は逆に、AIに答えを出させず、地図と資料と「ここはデータがない」という表示を並べ、立場の違う二人の役を演じさせた。考える手間を省くのでなく、考える材料をそろえるAIという設計が面白い。", "unverified": "本文未読のため、参加者実験の定量的な結果と、ペルソナの設定の詳細は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "LLM交渉では余剰が残る場面で目的の指定が効く", "title": "Value Headroom Moderates Whether Specification Beats Style in LLM Negotiation", "url": "https://doi.org/10.5281/zenodo.24118722", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). Value Headroom Moderates Whether Specification Beats Style in LLM Negotiation (Version 1.1.1). Zenodo. https://doi.org/10.5281/ZENODO.24118722", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "LLMエージェント同士の交渉で、口調（温かさ・支配性）と目的の指定（優先順位、留保価値、譲歩の規則）のどちらが効くかは、取り残される共同利益の大きさ（価値の余地）で決まることを示した（抄録）。", "p3": "先行研究の公開資料から実験を再構成し、3つのモデル系統・7つの条件・4,920組の交渉で、目的を先に指定する指示と対人的な口調の指示を比べた（抄録）。", "p5": "余地がほぼない場面では両者は同等（事前登録した帰無結果）だが、余地があると目的の指定のほうが共同の価値が高い。切除実験では、利点は利得表を漏らすことでなく、互いの譲り合い（ログローリング）を教えることから来ていた（抄録）。", "fun": "交渉では「感じよく話すこと」が大事だという結果が以前に報告されていた。この研究は、それは「もう取り分を増やす余地がない場面」に限った話だと示した。まだ双方が得をできる余地が残っている場面では、口調より「何を優先し、どこまで譲るか」をはっきり決めておくほうが、二人合わせた利益が大きくなる。", "unverified": "審査のない置き場（Zenodo）の単著の報告で、本文未読のため、交渉課題の内容と統計処理の詳細は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "Redditのガザ議論から意見集団を検出し分極を測る", "title": "Quantifying polarization: detection and analysis of opinion groups on the Gaza conflict in English-language Reddit discourse", "url": "https://econpapers.repec.org/RePEc:cte:wsrepe:51001", "authors": "Scielzo Ortiz ほか", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "ガザ紛争をめぐるRedditの英語コメントから、LLMで抽出した言説の変数を使って意見集団を検出し、分極の構造を測る方法を比べた（抄録）。", "p3": "18のサブレディットから一年間に集めた約七万七千件のコメントについて、政治的立場・感情・論調・主題の枠組み・議論の質の5変数をゼロショットの規則つきプロンプトで抽出し、専門家の符号化で検証した。特徴空間とクラスタリング手法を組み合わせた5構成を比べた（抄録）。", "p5": "文章の埋め込みに基づく構成は語り口と政治的立場を混同し、思想の軸を復元できなかった。検証済みの変数に限り、混合データ向けの頑健な手法を使うと、対称な4集団の構造が得られた（抄録）。", "fun": "ネットの議論を機械に自動で仲間分けさせると、「賛成か反対か」でなく「口調が荒いか丁寧か」で分かれてしまうことがある。この研究は、文章を丸ごと数値にする方法がまさにその罠にはまることを示し、先にLLMで立場や論調を読み取ってから分けるほうが、意見の対立の形を正しく取り出せることを確かめた。", "unverified": "抄録の末尾が切れており、得られた4集団の中身と分極の指標の値は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "技術者のトークン消費は何を測っているのか", "title": "The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures", "url": "https://arxiv.org/abs/2611.13396", "authors": "Shyam Agarwal ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Agarwal, S., Lvova, O., Sergeyuk, A., Serova, A., Bryksin, T., Zimmermann, T., & Vasilescu, B. (2026). The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13396", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "技術者のトークン消費量という指標が、成果ではなく、さまざまな仕事でどれだけエージェントを使ったかを測っていることを、社内データで示した（抄録）。", "p3": "JetBrainsの技術者404人について、コーディングエージェントの5週間のトークン使用量をコミットと結びつけ、社員412人の調査も分析した（抄録）。", "p5": "消費量の差は主に人の間の差で、コミット数が同程度の週でも上位（90パーセンタイル）は下位（10パーセンタイル）の39〜240倍だった。同じ人では消費を倍にしてもコミットは約10%増にとどまり、仕事の指標で説明できたのは人の間の変動の38%、週ごとの変動の13%だった（抄録）。", "fun": "昔は「書いたプログラムの行数」で技術者の働きを測ろうとして失敗した。行数が多いことと良い仕事は別だからである。AI時代の新しい物差しとして「AIをどれだけ使ったか」が出てきたが、この研究は同じ失敗の繰り返しになりうることをデータで示した。たくさん使う人が、たくさん成果を出しているとは限らない。", "unverified": "本文未読のため、分析の統計モデルと調査の詳しい結果は未確認。一社の事例である。"}}, {"id": "pr39", "rank": 39, "headline": "AI利用が同僚同士の評価と協力をどう変えるか", "title": "Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another", "url": "https://doi.org/10.31234/osf.io/ehbjv_v2", "authors": "Maxine Parker ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Parker, M., Huang, C., & Krastev, S. (2026). Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another. https://doi.org/10.31234/osf.io/ehbjv_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "職場で生成AIを使うことが、同僚からの見られ方と同僚の振る舞いをどう変えるかについての研究を、既存の対人関係の理論で整理した総説である（抄録）。", "p3": "帰属理論、社会的行為者としてのコンピュータ、組織的信頼の統合モデル、社会的交換理論、資源に基づく理論を枠組みとして、AI利用者に対する知覚・判断・行動の知見をまとめた（抄録）。", "p5": "観察者はAI利用を状況でなく人柄のしるしと読み、利用者を有能さ・意欲・温かさ・誠実さが低いと判断しがちで、利用の開示は信頼の低下を埋めない。同僚からの返報や知識共有も減る。ただし効果は条件つきで、上司の支援などの関係的な緩衝が費用を相殺しうる（抄録）。", "fun": "AIを使って仕事をすると、成果物は良くなっても「あの人は手を抜いている」「本物ではない」と見られやすい、という研究結果がまとめられている。しかも「AIを使いました」と正直に言っても信頼は戻らない。道具の性能でなく、人が人をどう見るかという昔からの心理が、AI時代の職場の人間関係を左右している。", "unverified": "抄録の末尾が切れており、総説の対象文献の数と選び方、結論部分は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "AIの語り方で労働市場政策への支持が変わるか", "title": "Artificial Intelligence and Support for Labor Market Policies: Evidence from a Survey Experiment", "url": "https://econpapers.repec.org/RePEc:zbw:glodps:1856", "authors": "Angei ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "AIについての語り方（代替・補完・学び直し）が労働者の労働市場政策への支持を変えるかを調査実験で調べ、効果は職場でAIを使っているかどうかで分かれることを示した（抄録）。", "p3": "イタリアの被雇用者の代表標本（約二千百人）を、対照群と3つの情報処置に無作為に割り当て、失業給付などの受動的な施策と訓練などの能動的な施策を含む5つの政策手段への支持を尋ねた（抄録）。", "p5": "平均の効果は小さいが、AIを使っていない人では代替の語りが公的な訓練と雇用補助金への支持を高め、使っている人では代替・補完の語りが失業保険と短時間労働制度への支持を下げた。学び直しの語りはどちらの群でも有意な効果がなかった（抄録）。", "fun": "「AIが仕事を奪う」と聞いたとき、人は国の支援を求めるようになるだろうか。答えは、その人がすでに職場でAIを使っているかどうかで逆になった。使っていない人は訓練の充実を求め、使っている人はむしろ失業保険への支持を下げた。同じ知らせでも、自分の経験によって受け取り方が変わることを実験で示している。", "unverified": "抄録の末尾が切れており、効果の大きさと結論の後半は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "AI不安・デジタル過負荷と情緒的消耗", "title": "AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors", "url": "https://doi.org/10.21203/rs.3.rs-11253139/v1", "authors": "Usha Shree Rathod Bhukya ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Bhukya, U. S. R., & Muddasani, R. (2026). AI Anxiety, Digital Overload, and Technostress in a Polycrisis Context: A Moderated Mediation Study of Emotional Exhaustion and Psychological Well-Being Across Four Industry Sectors. https://doi.org/10.21203/rs.3.rs-11253139/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得。抄録の結果の部分は取得時に一部欠けている）", "preprint": true, "short": true, "p1": "AI不安・デジタル過負荷・技術ストレスという仕事の要求が、情緒的消耗を通じて心理的well-beingの低さと関連することを、仕事の要求度-資源モデルで調べた（抄録）。", "p3": "IT、医療、教育、銀行・金融の正規雇用者340人に6つの心理尺度の横断調査を行い、共分散構造分析（5,000回のブートストラップ）で調整媒介モデルを検証し、業種別の多母集団分析とfsQCAも行った（抄録）。", "p5": "3つの要求はいずれも情緒的消耗を予測し（AI不安はβ = 0.396）、要求とwell-beingの関連は主に情緒的消耗を介していた。要求の目立ち方は業種で異なり、心理的資本の低さはwell-beingの低さの共通の条件だった（抄録）。", "fun": "AIに仕事を奪われるかもしれないという不安、鳴りやまない通知、新しい道具についていく負担。この三つは、まず「心がすり減る」状態と結びつき、それが幸福感の低さにつながっていた。希望や立ち直る力といった心の資源が少ない人ほど影響を受けやすい。どの負担が強く効くかが業種で違う点も興味深い。", "unverified": "抄録の結果の部分が欠けており、他の係数と調整効果の値は未確認。横断調査のため因果関係は示せない。"}}, {"id": "pr42", "rank": 42, "headline": "ビデオ判定の導入は選手の危険な行為を減らすか", "title": "Inspection and Workplace Safety: Evidence from the Video Assistant Referee", "url": "https://doi.org/10.2139/ssrn.7685019", "authors": "Yuxiao Ye ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Ye, Y., Jiang, S., & Xu, Y. (2026). Inspection and Workplace Safety: Evidence from the Video Assistant Referee. https://doi.org/10.2139/ssrn.7685019", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "サッカーのビデオ判定（VAR）の導入が、相手を危険にさらす行為を抑え、けがを減らしたことを示し、監視技術と職場の安全の関係を論じた（抄録）。", "p3": "欧州の主要5リーグでVARが段階的に導入されたことを利用し、2014/15〜2021/22シーズンのチーム・試合・選手単位のデータに差の差分析とイベントスタディを適用した（抄録）。", "p5": "チーム・シーズンあたりのけがの総数は約27%減った。相手のけがと正に関連する攻撃的・非スポーツ的な行為は減り、言葉での抗議や暴言は増えた。けがのリスクの低下には、一部の生産的な貢献の減少が伴った（抄録）。", "fun": "ビデオ判定は誤審を減らすための道具だが、思わぬ効果があった。危ない反則をしても後から映像で見つかるので、選手がそうした行為を控えるようになり、けがが減ったのである。一方で、審判への文句は増えた。見張りの仕組みは、狙った行動だけでなく、周りの行動まで変えてしまうことが分かる。", "unverified": "抄録の末尾が切れており、実務への含意の後半は未確認。推定の詳細（対照群、標準誤差）も本文未読のため未確認。"}}, {"id": "pr43", "rank": 43, "headline": "自閉スペクトラムの成人の職場ストレス対処尺度", "title": "Coping with workplace stress in autism: Development of a multidimensional coping inventory", "url": "https://doi.org/10.31234/osf.io/m9cet", "authors": "Johanna Finnemann ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Finnemann, J., & Erdal, K. (2026). Coping with workplace stress in autism: Development of a multidimensional coping inventory. https://doi.org/10.31234/osf.io/m9cet", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "自閉スペクトラム症の成人が職場のストレスにどう対処しているかを測る、33項目・11因子の多次元の自己報告尺度を開発した（抄録）。", "p3": "自閉スペクトラム症の従業員233人で探索的因子分析を行って項目を絞り、他の神経発達の特性を持つ従業員221人で測定不変性を確かめ、診断のある別の標本で11項目の短縮版の参考値を示した（抄録）。", "p5": "二つの標本の間で計量不変と尺度不変が十分に成り立ち、自閉スペクトラム症の働く人に特有の対処の姿を測れる、信頼できる尺度だと結論する（抄録）。信頼性係数などの数値は抄録に記載なし。", "fun": "音や光が気になる、雑談が負担になるなど、自閉スペクトラム症の人が職場で感じるストレスは、多数派の人のものと種類が違う。対処の工夫も独自なので、これまでの質問紙ではうまく測れなかった。この研究は、当事者が実際に挙げた工夫から質問項目を作った。測る物差しを当事者の側から作り直した点が大事である。", "unverified": "本文未読のため、因子の名称、信頼性係数、確認的因子分析の有無は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "小さな緑化は地区の貧富による知覚差を縮めるか", "title": "Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status", "url": "https://doi.org/10.31234/osf.io/6rmcg", "authors": "Paula Latorre ほか", "venue": "PsyArXiv", "date": "2026-11-11", "apa": "Latorre, P., Ferreira, C. P., Molina-Muñoz, A., Castaño-Castaño, S., Morales-Navas, M., & Nieto-Escamez, F. (2026). Testing Socio-Perceptual Equigenesis with Biophilic Interventions: A Virtual Reality Eye-Tracking Study Across Neighborhood Socioeconomic Status. https://doi.org/10.31234/osf.io/6rmcg", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "街路に小さな緑を足す工夫が、地区の豊かさによる心理的な格差を縮める働きを持つかを、仮想現実と視線計測で調べた（抄録）。", "p3": "75人の参加者が、社会経済的地位が低・中・高の地区の360°の仮想ツアーを、元の状態と緑を加えた状態で評価し、60 Hzの視線計測で注意の動きを測った（抄録）。", "p5": "緑の追加は注視の総数を変えなかったが、平均の注視時間を有意に短くした。肯定的な感情・好ましさ・美的評価・くつろぎは上がり、知覚されたストレスは全体として有意には変わらなかった（抄録）。", "fun": "緑の多い街は気分が良い、というのは誰でも感じるが、その「見方」まで変わるのかを目の動きで調べた研究である。緑を足した街では、一点をじっと見つめる時間が短くなっていた。がんばって注意を向けなくても自然に目が引かれる状態と整合する結果で、頭が休まるしくみの手がかりになる。", "unverified": "抄録の末尾が切れており、地区の豊かさによる差が縮まったかどうかの結論は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "有給の家族休暇は睡眠時間と就業を変えるか", "title": "The Effect of Paid Family Leave on Sleep Duration and Labor Market Outcomes in the U.S", "url": "https://doi.org/10.2139/ssrn.7685643", "authors": "Niloufar Erfanibehrouz", "venue": "SSRN", "date": "2026-11-11", "apa": "Erfanibehrouz, N. (2026). The Effect of Paid Family Leave on Sleep Duration and Labor Market Outcomes in the U.S. https://doi.org/10.2139/ssrn.7685643", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "米国の州の有給家族休暇制度が、雇用と労働時間を増やし、睡眠時間もわずかに改善することを示した（抄録）。", "p3": "1998〜2020年の州ごとの導入時期の違いを使う段階的な差の差分析で、人口動態調査（CPS）から雇用・労働力参加・週の労働時間を、生活時間調査（ATUS）から睡眠時間を推定した（抄録）。", "p5": "制度は雇用と労働時間を増やし、効果は既婚男性で強い。女性では、未婚・離別の人は労働力参加と労働時間が増え、既婚の人は有意な変化がなかった。睡眠時間は女性と単身者を中心に少し増えた（抄録）。効果の大きさは抄録に記載なし。", "fun": "家族の世話のために休める制度を作ると、働く人が減りそうに思える。ところが実際は雇用も労働時間も増えていた。休めるからこそ仕事を辞めずに戻ってこられる、ということらしい。さらに睡眠時間まで少し増えていた。制度の効果を「働くかどうか」だけでなく「眠れているか」で測った点が面白い。", "unverified": "本文未読のため、推定値の大きさと、段階的導入に伴う推定上の対処は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "小児がん経験者の介護者を地域資源につなぐ", "title": "Connecting Caregivers to Community Resources: A Mixed-Methods Evaluation of a Virtual Assistant for Childhood Cancer Survivorship", "url": "https://doi.org/10.21203/rs.3.rs-11270648/v1", "authors": "Micah A. Skeens ほか", "venue": "Research Square (In Review)", "date": "2026-11-10", "apa": "Skeens, M. A., Booze, A. M., Wisne, L. M., Dyer, E. C., Olshefski, R., & Sezgin, E. (2026). Connecting Caregivers to Community Resources: A Mixed-Methods Evaluation of a Virtual Assistant for Childhood Cancer Survivorship. https://doi.org/10.21203/rs.3.rs-11270648/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "小児がん経験者の介護者を地域の支援資源につなぐ仮想アシスタントの使いやすさと受け入れやすさを評価した（抄録）。", "p3": "介護者15人が試用したあと、使いやすさの尺度（SUS）、満足度の質問紙、反応カード、半構造化面接に答え、居住地の機会・困窮の指標や農村かどうかとの関係を探索的に調べた（抄録）。", "p5": "SUSの平均は77.09（標準偏差18.04）で平均以上の使いやすさを示し、全員が使いやすいと評価した。困窮度の高い地区の介護者ほど、自力では見つけられない資源を見つけられたという満足が高かった（抄録）。", "fun": "病気が治ったあとも、子どもを支える家族には学習支援や相談先など、探すべきものがたくさんある。しかし地域にどんな支援があるかを一人で調べるのは大変だ。この研究の道具は、恵まれない地域に住む家族ほど「自分では見つけられなかった」と役立ちを感じていた。支援の情報が届きにくい人にこそ効く点が大事である。", "unverified": "抄録の末尾が切れており、面接から得た主題の内容は未確認。標本は15人と小さい。"}}, {"id": "pr47", "rank": 47, "headline": "外食のカロリー表示が家庭の食料品購入に波及", "title": "Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases", "url": "https://doi.org/10.2139/ssrn.7682397", "authors": "Ali Umut Guler", "venue": "SSRN", "date": "2026-11-11", "apa": "Guler, A. U. (2026). Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases. https://doi.org/10.2139/ssrn.7682397", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "飲食店でのカロリー表示の義務化が、対象外であるスーパーでの家庭の食料品購入にも波及することを示した（抄録）。", "p3": "6つの地域の義務化の前後について、家計の購買パネルデータに積み上げ型の差の差分析を適用し、表示が実施に至った地域と至らなかった地域を比べた。593人の無作為化実験で、食料品のカロリーの過小評価とメニュー表示による修正も測った（抄録）。", "p5": "過小評価が多く、メニューの品と直接結びつけやすい品目で波及が明確で、パン・焼き菓子類では食料品店で買うカロリーが1人1日あたり2.31kcal（18.7%）減った。牛乳では低脂肪のものへの移行が見られた（抄録）。", "fun": "飲食店のメニューに「このマフィンは何キロカロリー」と書いてあると、店で食べる量が変わるだけではなかった。その知識がスーパーでの買い物にも持ち込まれ、家で食べるパンや菓子のカロリーまで減っていた。ある場所で得た情報が、別の場所の行動を変える。政策の効果を店の中だけで測ると見落とす、という指摘である。", "unverified": "本文未読のため、対象の地域と期間、他の品目の推定値は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "LLMのブランド評価は親会社の開示で変わるか", "title": "Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception", "url": "https://doi.org/10.5281/zenodo.24117389", "authors": "Zharnikov, Dmitry", "venue": "Zenodo", "date": "2026-11-10", "apa": "Zharnikov, D. (2026). Does Corporate Ownership Matter to AI? Portfolio Interference in Large Language Model Brand Perception (Version 1.3.0). Zenodo. https://doi.org/10.5281/ZENODO.24117389", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "LLMによるブランド評価は、そのブランドの親会社を明かしてもほとんど変わらないことを、多数のモデルで示した（抄録）。", "p3": "13のLLMに、7つの型のブランド群から選んだ20ブランドを、直接の評価・自然な推薦・対話の途中での親会社の開示・母語での提示の4つの方式で評価させ、7,975件の観測を得た。別の20ブランドを加えて合計9,925件にした（抄録）。", "p5": "親会社の提示による評価の集中度の変化はほぼゼロで、20ブランド中18で同等性の検定が帰無を支持した。対話の途中で明かす方式では一部の構造で小さな変化があったが、ブランド群と方式に限られた（抄録）。", "fun": "人間は「この高級ブランドは実はあの大衆メーカーの子会社だ」と知ると、印象が変わることがある。ではAIはどうか。調べると、AIは親会社を教えられても評価をほとんど変えなかった。著者は、AIが所有関係をもともと知識として持っているためだと考えている。人とAIで「知らされること」の効き方が違う点が面白い。", "unverified": "審査のない置き場（Zenodo）の単著の報告で、本文未読のため、評価指標の定義と統計処理の詳細は未確認。抄録の末尾は切れている。"}}, {"id": "pr49", "rank": 49, "headline": "韓国旅行の「本物らしさ」を口コミから抽出", "title": "Tourist Perceptions of Authentic Travel in South Korea: A Text Mining Analysis of Online Travel Comments", "url": "https://econpapers.repec.org/RePEc:zbw:esrepo:344186", "authors": "Chae, Jinwoo", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "韓国旅行のオンラインのコメントから、旅行者が「本物らしい体験」をどう語っているかをテキストマイニングで調べた（抄録）。", "p3": "韓国の観光地と体験に関する英語の旅行コメント一万件を、キーワードの頻度、共起分析、感情分析、主題の符号化で分析した（抄録）。", "p5": "本物らしさは、地元の食べ物、伝統文化、住民との交流、商業化の進んでいない場所と結びついて語られ、商業化と混雑は否定的な評価と結びついていた（抄録）。数値は抄録に記載なし。", "fun": "「本物の旅」とは何だろうか。質問紙で聞くと、研究者が用意した選択肢の中からしか答えが出てこない。この研究は、旅行者が自分から書いた感想を大量に読み、何が「本物」と感じられているかを拾った。答えは歴史の古さだけでなく、地元の人と話せたか、観光地化されすぎていないか、という手ざわりだった。", "unverified": "本文未読のため、コメントの収集元と期間、分析の検証方法は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "東京は水準1位でも生産性の伸びは下位", "title": "東京パズルの観測事実: 県民経済計算による人口・生産性・所得・雇用者報酬の地域比較", "url": "https://doi.org/10.51094/jxiv.7112", "authors": "大塚, 章弘", "venue": "Jxiv", "date": "2026-11-08", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Jxivの抄録（英文）を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "県民経済計算を使い、東京は生産性・所得・雇用者報酬の水準では1位なのに、伸びでは下位にあるという「東京パズル」の観測事実を整理した（抄録）。", "p3": "47都道府県の2012〜2023年度の県民経済計算（2023年度版）で、人口・生産性・所得・雇用者報酬の水準と伸びの順位を比べた（抄録）。", "p5": "東京は住民1人あたり実質産出の伸びで47位、労働生産性の伸びで33位だった。首都圏の4都県の労働生産性の伸びはどの期間も全国を下回り、圏内では産出の増加が東京に、雇用の増加が周辺県に集中した（抄録）。", "fun": "東京は日本でいちばん豊かで生産性も高い。それなのに「伸び」で見ると、全国の中で最下位になる項目がある。人と会社が集まれば集まるほど成長するはず、という直感に合わない結果で、これが「東京パズル」と呼ばれる。水準と伸びを分けて見ると、同じデータからまったく違う姿が見えてくる。", "unverified": "抄録の末尾が切れており、5つの発見のうち後半（格差の指標の推移など）は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "交差検証の分散を有限標本で厳密に表す恒等式", "title": "A Theory of Cross-Validation Variance", "url": "https://arxiv.org/abs/2611.14463", "authors": "Nathaniel S. O'Connell ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "O'Connell, N. S., & Speiser, J. L. (2026). A Theory of Cross-Validation Variance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14463", "why": "交差検証の推定値の分散を、各観測が「評価される役割」と「学習に使われる役割」で受け取る重みの関数として有限標本で厳密に表した。分散は標本抽出による部分と分割の乱数による部分に分かれ、K分割は一次の意味で分散最適、その一次の分散はKに依存せず、条件のもとで1個抜きが最小になることを示し、推定値の漸近正規性も導いた。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "重みのビット反転を最適化して言語モデルを修復", "title": "Tree-Ising: Repairing Language Models with Bit-Level Ising Edits", "url": "https://arxiv.org/abs/2611.14210", "authors": "Hadi Salloum ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Salloum, H., & Ali, A. (2026). Tree-Ising: Repairing Language Models with Bit-Level Ising Edits (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14210", "why": "言語モデルの推論ループの修復を、重み（BF16）の符号反転と指数シフトだけを許す疎な離散最適化として定式化し、出力行ごとの独立なQUBO（イジング）問題に厳密に分解して焼きなまし等で解く。LLMエージェントによる修復と同じ評価手順でMATH-500が54.6%（エージェントの編集は51.7%）となり、必要な順伝播の要求は4回、LLMのトークンは不要だったと報告する。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "横断面比較の動学効果の偏りをパネルLP-IVで除く", "title": "Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV", "url": "https://arxiv.org/abs/2611.14434", "authors": "Endong Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, E., & Zhang, R. (2026). Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14434", "why": "集計的な処置の部分均衡効果を横断面の設計で推定すると、処置への曝露と集計的な交絡要因への曝露が相関する場合や交絡が処置に跳ね返る場合に偏ることを解析的に示した。曝露で重みづけたショックの代理変数で処置と交絡の経路を操作変数にするHELP-IVを提案し、州の財政乗数と株式資産効果に適用すると従来より小さい効果が得られた。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "表形式基盤モデルで媒介分析の信頼区間を償却推論", "title": "MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis", "url": "https://arxiv.org/abs/2611.13219", "authors": "Shi Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bo, S., & Hu, J. (2026). MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13219", "why": "事前学習した表形式基盤モデルを条件付き平均と傾向スコアの推定に使い、交差適合した影響関数推定量で組み合わせて因果媒介分析を行う。推定量の標準化誤差の分位点を、間接効果が既知の模擬データから別のヘッドで学習して信頼区間を作り、被覆率の限界を示した。ブートストラップより59.1倍速いと報告する。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "重みを更新せず文脈だけでロボット操作を学ぶ", "title": "World In-Context Learning for Agentic Robot Manipulation", "url": "https://arxiv.org/abs/2611.12885", "authors": "Heng Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Fang, H., Guo, Z., Zhang, Y., Du, M., Liang, D., & Bai, X. (2026). World In-Context Learning for Agentic Robot Manipulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12885", "why": "凍結したモデルが1回の実演から出発し、シミュレータで課題を予行して得たフィードバックを重みでなく文脈（タスクメモリ）に書き込む学習の枠組みを提案した。RoboTwin 2.0の50課題で、課題ごとに実演1回・勾配更新なしで平均成功率83.4%となり、学習済みの行動方策の最良を20ポイント以上上回ったと報告する。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "処置をまとめた操作変数推定が何を識別するか", "title": "Instrumental variables with treatment clusters", "url": "https://arxiv.org/abs/2611.13313", "authors": "Didier Nibbering ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Nibbering, D., Oosterveen, M., & Silva, P. L. (2026). Instrumental variables with treatment clusters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13313", "why": "順序のない多数の処置をいくつかの群にまとめて2値処置として操作変数法を使う慣行について、まとめる前の処置の水準での仮定のもとで、局所平均処置効果の加重平均が識別されることを示した。まとめる前の選択のデータがあれば因果的解釈の必要条件を検定でき、専攻分野の効果の例で示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "関税は仕入先を通じて輸入しない企業にも及ぶ", "title": "Trade Wars on the Income Statement: The Effects of Tariffs on Firms", "url": "https://doi.org/10.2139/ssrn.7683087", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Barbiero, O., Sheremirov, V., Silva, A., & Stein, H. (2026). Trade Wars on the Income Statement: The Effects of Tariffs on Firms. https://doi.org/10.2139/ssrn.7683087", "why": "2018年と2025年の米国の関税への企業別の曝露を、自社の輸入・仕入先の輸入・報復関税の3経路で作り、四半期財務諸表で効果を推定した。2025年は費用面の曝露が3四半期以内に売上高と売上原価を同程度（直接輸入企業の平均で約1.2%、仕入先経由で0.5%）減らし、企業は利幅を削らず価格転嫁と生産縮小で対応した。報復関税は粗利益率を圧縮した。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "末尾平均SGDのリスクの上界と下界の隙間を解消", "title": "Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression", "url": "https://arxiv.org/abs/2611.13383", "authors": "Qingyue Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhao, Q., Li, X., & Gu, Q. (2026). Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13383", "why": "高次元線形回帰での一定ステップ幅のオンラインSGD（末尾平均）について、初期値を明示した一致する上界と下界を、軌跡のスペクトル条件のもとで示した。従来の上界は初期誤差の寄与を減衰なしで残し、下界は落としていたが、初期の4次モーメントのエネルギーが遅いモードに散って平均区間まで残ることを示し、両者の緩さを明らかにした。"}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "記憶の教訓を元の軌跡で確かめるLLMエージェント", "title": "Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents", "url": "https://arxiv.org/abs/2611.14320", "authors": "Yukyeong Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Lee, Y., Choi, Y., Baek, J., & Hwang, S. J. (2026). Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14320", "why": "LLMエージェントの外部記憶は、誤った教訓や誤用によって、記憶なしなら解ける課題を落とすことがある。各教訓を、成功・失敗の理由の要約と元の軌跡に結びつけて保存し、詳細が足りない・矛盾する・失敗由来の教訓は元をたどって確かめる記憶システムを提案し、5つのベンチマークで既存の記憶手法を上回ったと報告する。"}, {"id": "pn10", "rank": 10, "field": "経営学", "headline": "差の差分析で企業の同時反応を測る統計量", "title": "From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research", "url": "https://doi.org/10.2139/ssrn.7682778", "authors": "Josh Feng ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Feng, J., & Mahalingam, A. (2026). From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research. https://doi.org/10.2139/ssrn.7682778", "why": "環境変化に対して企業が相互依存する選択を一緒に変えるという理論に対し、選択ごとの差の差推定は平均の反応しか識別せず、独立な反応・決定の依存・共通要因が同じ推定値を生むことを示した。両方を変えた処置企業の割合から独立の場合の期待を引く超過同時反応（EJR）統計量と、連続結果・段階的導入への拡張を示し、4つの実証例に適用した。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "若年失業者への就職支援の4年間の因果効果", "title": "Active Labor Market Policy for Unemployed Youths", "url": "https://doi.org/10.2139/ssrn.7690604", "authors": "Jeremy Hervelin ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hervelin, J., Villedieu, P., & Terriau, A. (2026). Active Labor Market Policy for Unemployed Youths. https://doi.org/10.2139/ssrn.7690604", "why": "フランスの大規模な若年失業者向けプログラム（集中的な求職支援と訓練への配置）を、担当者への準ランダムな割当てと担当者ごとの登録傾向を操作変数にして評価した。修了後の就業確率は約10%上がるが、賃金・契約の安定・職種の向上は伴わず、非参加者への負の波及もモデルと合わせて示した。"}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "チーム固有の技能への投資は過少だが誘因に反応", "title": "Dynamic investment and coordination in teams: Theory and experimental evidence", "url": "https://arxiv.org/abs/2611.13230", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gill, D., Prowse, V., & Reddinger, J. L. (2026). Dynamic investment and coordination in teams: Theory and experimental evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13230", "why": "チーム内に蓄積して協調生産の収益を高める技能への投資を、動学ゲームとして初めて体系的に分析し、実験室で検証した。効率的な水準より投資は少ないが、誘因には理論の予測どおり強く反応し、事前登録した特性（心の理論、協調の傾向）が投資とチームの効率を予測した。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "文脈内学習の「汎化」は暗記の途中段階だった", "title": "You Don't Need Feature Learning to Do In-Context Learning", "url": "https://arxiv.org/abs/2611.13431", "authors": "Joseph Turnbull ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Turnbull, J., & Simon, J. (2026). You Don't Need Feature Learning to Do In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13431", "why": "回転不変なカーネル機械が文脈内の線形回帰課題を学ぶ過程を固有基底で分解し、標本が増えるにつれ暗記解の高次成分を順に学ぶことを示した。汎化解は暗記解の低次の打ち切りに近く、モデルはまず汎化してから暗記へ移る。特徴学習は文脈内学習に必須でなく、Transformerの実験でも理論が予測する高次統計を通じた暗記が確認された。"}, {"id": "pn14", "rank": 14, "field": "計算社会科学・ネットワーク科学", "headline": "確信度の表示は情報源選びを変えるが精度は上げず", "title": "Displayed judgment certainty reorganizes source selection in self-formed networks", "url": "https://doi.org/10.31234/osf.io/fja3d_v5", "authors": "Gaël Carniel ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Carniel, G., Guigon, V., Moisan, F., Barrat, A., & Dreher, J.-C. (2026). Displayed judgment certainty reorganizes source selection in self-formed networks. https://doi.org/10.31234/osf.io/fja3d_v5", "why": "273人が真偽のニュース見出しを評価し、費用を払って観察相手を選ぶネットワークを作る実験で、相手の確信度（確率判断の極端さ）を表示する効果を調べた。表示はネットワークを密にし確信の強い相手へリンクを向けたが、確信が強く誤った判断への接触を増やし、正確さの明確な改善は検出されなかった。"}, {"id": "pn15", "rank": 15, "field": "経営学", "headline": "ブラウザ選択画面はSafariからChromeへ移した", "title": "The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones", "url": "https://doi.org/10.2139/ssrn.7682467", "authors": "Leon Knoke ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Knoke, L., & Peukert, C. (2026). The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones. https://doi.org/10.2139/ssrn.7682467", "why": "EUのデジタル市場法で2024年に導入されたiPhoneの既定ブラウザ選択画面の効果を、EUと非EUの国の比較で推定した。SafariからGoogle Chromeへの大きなシェア移動と他ブラウザの小幅な増加が起き、補完的な検索市場ではGoogleのシェアはほぼ変わらなかった。エコシステムの補完性が個別市場の是正措置の届く範囲を限ることを示す。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "選択後推論を擬似周辺MCMCで効率よくサンプリング", "title": "Pseudo-marginal Sampling for Selective Inference", "url": "https://arxiv.org/abs/2611.13492", "authors": "Jiali He ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "He, J., & Liu, S. (2026). Pseudo-marginal Sampling for Selective Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13492", "why": "適応的な選択のあとの推論で、選択事象で条件づけた分布からのサンプリングを擬似周辺MCMCで行う方法を提案した。選択事象がまれなときに棄却サンプリングが高価になる問題に対処し、弱ポアンカレ不等式で棄却法に対する計算効率を解析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "適応的な選択のあとの推論（選択後推論）で、選択事象で条件づけた分布からのサンプリングを、擬似周辺MCMCで効率よく行う方法を示した（抄録）。", "p3": "提案分布から引いて観測と同じ選択を再現した標本だけを残す棄却サンプリングは、選択事象がまれだと極端に高価になる。これに代えて、選択的な分布を標的とする擬似周辺マルコフ連鎖モンテカルロを使い、弱ポアンカレ不等式で棄却法に対する効率を解析した（抄録）。", "p5": "古典的な「お蔵入り問題」で両手法の計算費用を厳密に導き、選択事象がまれになるほど指数的に改善することを示した。複雑な選択手続きの数値実験では棄却法の数百倍効率的なことが多く、検定は名目の選択的第一種過誤を保った（抄録）。", "fun": "たくさん試して、うまくいったものだけを報告すると、偶然の当たりを本物と見間違える。これを正すには「選ばれたという条件」のもとで確率を計算し直す必要があるが、その計算がとても重い。この研究は、めったに起きない選ばれ方ほど、従来より桁違いに楽に計算できる方法を示した。正直な統計を、実際に計算できるものにする工夫である。", "unverified": "本文未読のため、数値実験の選択手続きの内容と効率の具体的な倍率は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "スパース性を仮定しない偏相関の推論", "title": "Projection-Based Partial Correlation Inference Beyond Sparsity", "url": "https://arxiv.org/abs/2611.13657", "authors": "Youwu Lin ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Lin, Y., Zhou, Z., Shi, S., & Sun, X. (2026). Projection-Based Partial Correlation Inference Beyond Sparsity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13657", "why": "条件づけ変数が密に依存する高次元ガウスモデルで、座標のスパース性を仮定せずに偏相関を推定・検定する、対象に特化した射影の枠組みを示した。線形の次元削減が保つ情報を2次の基準で特徴づけ、条件のもとで1次元の射影が元の偏相関を保つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "条件づける変数どうしが密に依存し、スパース性を仮定できない高次元ガウスモデルで、偏相関を推定・検定できる射影の枠組みを示した（抄録）。", "p3": "線形の次元削減が保つ情報を母集団の2次の基準で表すと、最適なのは1次元の射影になり、ランク1の整合条件のもとで元の偏相関が保たれる。この方向を、独立な学習用標本で対角リッジ正則化を使って推定する（抄録）。", "p5": "方向の推定誤差が偏相関に与える影響は2次であることを示し、分割標本の推定量の漸近正規性と、偏相関ゼロの帰無仮説の漸近的に妥当な検定を導いた。次元が標本数を超える密なモデルでも必要な収束率が成り立つ（抄録）。", "fun": "「AとBは、他の全部の影響を除いても関係があるか」を調べるのが偏相関である。変数が何千もあると、ふつうは「本当に効くのは少数だけ」と仮定して計算する。しかし現実には全部が少しずつ絡むことも多い。この研究は、その仮定なしで、多数の変数を一本の物差しにまとめ直すだけで正しく検定できる条件を示した。", "unverified": "抄録の末尾が切れており、数値実験の結果は未確認。整合条件が実データでどの程度成り立つかも未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "ロジスティック回帰の混合のノンパラメトリック最尤推定", "title": "Nonparametric Maximum Likelihood Estimation for Mixtures of Logistic Regressions", "url": "https://arxiv.org/abs/2611.14445", "authors": "Muheng Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Li, M., Zhang, P., & Bing, X. (2026). Nonparametric Maximum Likelihood Estimation for Mixtures of Logistic Regressions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14445", "why": "混合分布を特定しないロジスティック回帰の混合モデルについて、ふるい（sieve）型のノンパラメトリック最尤推定量の非漸近的な誤差の上界を、固定・確率的な計画の両方で導き、推定誤差と近似誤差のトレードオフから収束率を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "混合分布の形を特定しないロジスティック回帰の混合モデルについて、ふるい型のノンパラメトリック最尤推定量の誤差の上界と、それを計算する有限粒子アルゴリズムを示した（抄録）。", "p3": "固定・確率的な計画のもとで混合回帰関数の推定誤差の非漸近的な上界を導き、推定誤差とふるいの半径による近似誤差のトレードオフから収束率を求めた。計算には、有限個の点に台を持つ混合分布の位置と重みを最適化する方法を使う（抄録）。", "p5": "任意の固定データについて、粒子数が有限のしきい値を超えれば尤度が制限つき最尤値へ大域的に収束することを示し、真の混合分布が有限個の点に台を持つ場合は、アルゴリズムの誤差と統計的誤差を分けた上界を導いた（抄録）。", "fun": "「買う・買わない」のような二択を説明するロジスティック回帰は、全員が同じ傾向を持つと仮定する。だが実際は、値段に敏感な人も鈍い人もいる。この研究は「何種類の人がいるか」を決めずに、データに一番合う人の混ざり方を探す方法について、どれだけ正確に推定できるか、計算が正解に届くかを数学的に保証した。", "unverified": "抄録の末尾が切れており、識別可能性の結果の内容と数値実験は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "種標本抽出過程の厳密な有限表現と事前分布の構成", "title": "Species sampling priors through exact augmentation", "url": "https://arxiv.org/abs/2611.13323", "authors": "Rams\\'es H. Mena ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Mena, R. H., Merkatas, C., Nicoleris, T., & Rodríguez, C. E. (2026). Species sampling priors through exact augmentation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13323", "why": "ベイズノンパラメトリクスの混合モデルで使う離散確率測度について、すべての適正な種標本抽出過程が、有限個の原子の選択と再重みづけからなる厳密な2段階の有限表現を持つことを示し、これを逆にたどって事前分布を作る一般的な方法を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "ベイズノンパラメトリクスで使う種標本抽出過程（species sampling process）が、有限個の原子を使う厳密な二段階の表現を持つことを示し、そこから新しい事前分布を作る方法を与えた（抄録）。", "p3": "ほとんど確実に有限な指数が最初の原子の集合を選び、そこから明示的に重みを付け直した確率で抽出する。減少する「可視性の予定表」が重みの付け直しと指数の法則を決め、有限の条件付き測度をこの法則で平均すると元の過程が復元される（抄録）。", "p5": "この恒等式を逆にたどると、無限個の重みを直接指定する代わりに、指数の分布と有限の割当確率から事前分布を構成できる。裾の軽い・重い・多峰の指数分布を使って、完全な弱い台を持つ新しい事前分布を作った（抄録）。", "fun": "データをいくつのグループに分けるかを前もって決めず、「必要なら新しいグループを作る」統計モデルがある。その裏側には無限個の重みを持つ確率分布があり、扱いが難しい。この研究は、その無限の対象を「まず有限個を選び、そこから引く」という二段階で正確に言い換えられることを示した。無限を有限で扱う道具が一つ増えた。", "unverified": "抄録の末尾が切れており、具体的な分割則・予測則の式と応用例は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "一対比較からの順位推定を差分プライバシーつきで", "title": "Differentially Private Statistical Inference for Rankings from Pairwise Comparisons", "url": "https://arxiv.org/abs/2611.13485", "authors": "Xintao Xia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Xia, X., & Gu, J. (2026). Differentially Private Statistical Inference for Rankings from Pairwise Comparisons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13485", "why": "人による一対比較から言語モデルなどの順位を推論するとき、個々の選好記録の秘匿を保つ方法を、Bradley–Terryモデルと辺の差分プライバシーのもとで開発した。摂動つき推定量の有限標本の誤差の上界と、得点・得点差の漸近的に妥当な信頼区間を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "人による一対比較から言語モデルなどの順位を推論するとき、個々の選好の記録を差分プライバシーで守りながら、得点と順位の信頼区間を作る方法を示した（抄録）。", "p3": "Bradley–Terryモデルと辺の差分プライバシーのもとで、目的関数に摂動を加える推定量を使い、新しい1個抜きの解析で有限標本の誤差の上界を導いた。リッジの偏りの補正とガウス・ラプラスの較正を組み合わせ、同時の順位推論にはブートストラップを使う（抄録）。", "p5": "個々の得点と得点差の漸近的に妥当な信頼区間、個々の順位の信頼集合、上位K位に入るかの検定が得られる。比較の確率が公開で既知なら、追加のプライバシー予算は要らない。創作文の課題で言語モデルの順位づけに適用した（抄録）。", "fun": "「AとBのどちらの回答が良いか」という投票を集めてAIの順位を決める仕組みがある。投票の記録には個人の好みが表れるので、そのまま公開すると危ない。この研究は、わざと少し雑音を混ぜて個人を守りつつ、「この順位はどのくらい確かか」という幅まで正しく出せる方法を作った。守ることと正確さの両立を数学で示している。", "unverified": "本文未読のため、シミュレーションの結果と実データでの順位の具体的な内容は未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "LLM審査員と適応的に集めた人手評価で順位を推定", "title": "Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback", "url": "https://arxiv.org/abs/2611.13186", "authors": "Gabriel Sargent ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Sargent, G., Sun, W. W., Zhang, Z., & Liu, Y. (2026). Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13186", "why": "言語モデルの順位づけで、適応的に集めた高価な人手評価に、安価なLLM審査員の予測を組み合わせて精度を上げつつ、審査員の偏りと適応的な標本抽出のもとでも妥当な推論を与える枠組み（PP-Rank）を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "言語モデルの順位づけで、適応的に集めた高価な人手評価に安価なLLM審査員の予測を組み合わせ、精度を上げつつ妥当な推論を保つ枠組みPP-Rankを提案した（抄録）。", "p3": "審査員の偏りと、過去の結果に応じて比較を選ぶ適応的な標本抽出による依存を、同時マルチンゲール解析で扱う。予測に付ける重みはデータから決め、提案した推定量の族の中で漸近共分散のトレースを最小にする（抄録）。", "p5": "一般の評価対象と同時の順位推論について漸近正規性を示した。半合成の実験で、人手評価だけの基準より得点の推定、信頼区間の幅、順位の認証が改善した（抄録）。改善の大きさは抄録に記載なし。", "fun": "AIの出来を人が採点するのは正確だが高い。AIにAIを採点させるのは安いが、ひいきや癖がある。この研究は、安い採点をたくさん使って大まかな形をつかみ、少しの人手の採点で癖を直す。しかも、次にどれを比べるかをその場で決める集め方をしても、統計の保証が崩れないようにした点が技術的に難しいところである。", "unverified": "抄録の末尾が切れており、合成実験の結果の詳細は未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "雑音だけから型紙に似た像が出る現象を統計的に解析", "title": "Statistical Analysis of the Structure from Noise Phenomenon in Generalized Procrustes Problems", "url": "https://arxiv.org/abs/2611.13546", "authors": "Jiayang Yin ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Yin, J., & Ling, S. (2026). Statistical Analysis of the Structure from Noise Phenomenon in Generalized Procrustes Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13546", "why": "クライオ電子顕微鏡で、参照の型紙を使う照合と平均化が、観測が雑音だけでも型紙に似た出力を生む現象（Einstein from noise）を、一般化プロクラステス問題として統計的に解析した研究。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "クライオ電子顕微鏡で、型紙（テンプレート）を使った位置合わせと平均化が、雑音だけの観測からも型紙に似た像を作ってしまう現象を、一般化直交プロクラステス問題で解析した（抄録）。", "p3": "連続な直交群の作用と、順序つき点群の低次元への射影を含む、解析的に扱える設定で型紙との照合と平均化を調べ、純粋なガウス雑音のもとでの推定量の平均の構造を特異値分解で特徴づけた（抄録）。", "p5": "雑音だけのとき、位置合わせして平均した推定量の平均は型紙と同じ左右の特異ベクトルの基底を持ち、特異値だけが歪む。特異値の歪みの上界、有限標本の作用素ノルムの上界、母平均が揺らぎを上回るのに十分な標本数を示した（抄録）。", "fun": "有名な人物の顔写真を型紙にして、ただの砂嵐の画像を大量に「顔に合うように」回して重ねると、砂嵐の中からその顔が浮かび上がる。信号は何もないのに、探し方そのものが答えを作ってしまうのである。この現象は「雑音からのアインシュタイン」と呼ばれる。この研究は、型紙のどの性質が結果に写り込むのかを数学的に突き止めた。", "unverified": "抄録の末尾が切れており、弱い信号がある場合の結果の後半は未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "媒介確率の比で重みづける媒介分析を一つの枠組みに", "title": "Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance", "url": "https://arxiv.org/abs/2611.13206", "authors": "Ariel Linden", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Linden, A. (2026). Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13206", "why": "結果をモデル化せず媒介変数の分布を重みづけ直して自然な直接・間接効果を推定する方法（RMPW）を共通の推定の枠組みにまとめ、連続の媒介変数の不均一分散モデルと2段階の分散推定の拡張を加え、全国健康調査などで例示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "結果をモデル化せず、媒介変数の分布を重みづけ直して自然な直接・間接効果を推定する方法（RMPW）を、一つの推定の枠組みにまとめ、実用上の指針を示した（抄録）。", "p3": "既存の手法を共通の枠組みに置き、連続の媒介変数に不均一分散の正規モデルを入れ、2段階の分散推定を複数のパラメトリックな重みに拡張した。全国健康調査と福祉から就労への無作為化実験で例示し、目的を絞ったシミュレーションで評価した（抄録）。", "p5": "モデルが適切で重みが安定していれば性能は良いが、正しい特定だけでは重みの集中による不安定を防げない。層別による重みづけは誤特定にある程度強く、推定した重みを固定とみなす標準誤差は信頼できず、2段階とブートストラップの推論は良好だった（抄録）。", "fun": "「就労支援を受けた母親の気分の落ち込みが変わった」として、それは就職できたからなのか、それ以外の経路なのか。この二つを分けるのが媒介分析である。この研究が扱う方法は、結果の式を立てる代わりに「重み」で調整する。ただし重みが一部の人に集中すると答えがぐらつく。使う前に重みの様子を確かめよ、という実用的な教訓が得られる。", "unverified": "抄録の末尾が切れており、指針の全体と例示の推定値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "条件をずらして偽スコア網なしで数ステップ動画生成", "title": "Few-Step Streaming Video Generation via Condition Shifting", "url": "https://arxiv.org/abs/2611.14033", "authors": "Deyuan Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Liu, D., Li, J., Zheng, K., Jiang, K., Chen, J., Wang, Y., Lin, M., Lin, T., Chen, J., Zhu, J., & Zhang, J. (2026). Few-Step Streaming Video Generation via Condition Shifting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14033", "why": "ストリーミング動画生成の数ステップ蒸留で、別に学習する偽スコアのネットワークを使わず、条件をずらすことで同じ生成器の中で生成分布の速度場を推定する方法を示した。同じ学習設定でGPUメモリの最大値が4.4%、反復時間が9.2%減ったと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "ストリーミング動画生成の数ステップ蒸留で、別に学習させる偽スコアのネットワークをなくし、同じ生成器の中で条件をずらして代用する方法を示した（抄録）。", "p3": "元の文章条件は生成に、ずらした条件は生成分布の速度場の推定に使い、同じパラメータで両方を担わせる。凍結した参照教師などの要素は保ち、180秒の動画で、70件の人手評価と320件のベンチマーク比較を行った（抄録）。", "p5": "比較対象より、指示の達成度（3.856対3.831）と見た目の美しさが高く、人の評価では指示への追従で+30.0%の純選好を得た。動きの質は比較対象が上回った。同じ学習設定でGPUメモリの最大値は4.4%、反復時間は9.2%減った（抄録）。", "fun": "動画を作るAIを速くするには、時間のかかる先生役のモデルから、数歩で作れる生徒役へ技を移す。従来は、生徒の出来を見張る「もう一つの見張り役」を別に育てる必要があり、その分メモリと時間を食っていた。この研究は、生徒自身に合図を変えて見張り役も兼ねさせた。一人二役で、部品を一つ減らす発想である。", "unverified": "本文未読のため、評価指標の定義と、差の統計的な有意性は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "k-meansを10分の1のエポックで超える", "title": "e-means: outperforming k-means (in one-tenth the epochs)", "url": "https://arxiv.org/abs/2611.09501", "authors": "Swann Bessa ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-10", "apa": "Bessa, S., Mazaré, P.-E., Szilvasy, G., Touvron, H., Picard, D., Douze, M., & Jégou, H. (2026). e-means: outperforming k-means (in one-tenth the epochs) (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09501", "why": "ミニバッチ更新と指数移動平均によるk-meansの最適化手順（e-means）と、減衰率・バッチサイズの決め方のスケーリング則を示した。Lloyd法の25エポック時の損失を1.4〜2.6エポックで下回り、100億件の埋め込みを1,600万クラスタに2.5エポックで分割したと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "クラスタリングの定番k-meansを、ミニバッチ更新と指数移動平均で最適化し直した手法e-meansを示し、はるかに少ない計算で低い損失に達することを示した（抄録）。", "p3": "深層学習の最適化の道具を使った指数移動平均の更新手順を導入し、減衰率とバッチサイズが最終性能に与える影響のスケーリング則を定めて、問題の大きさが変わっても調整なしで値を決められる規則を作った（抄録）。", "p5": "多くの埋め込みデータで、Lloyd法の25エポック時の損失を1.4〜2.6エポックで下回り、GPUでの実時間で10〜45倍の高速化に当たる。100億件の埋め込みを1,600万クラスタに2.5エポックで分割した（抄録）。", "fun": "k-meansは、点の集まりをいくつかのグループに分ける、長く使われてきた定番の方法である。全部の点を何十回も見直すのが普通だったが、この研究は、少しずつ見ては重心を「なめらかに」動かす更新に変えるだけで、十分の一ほどの回数で、より良い分け方に届くことを示した。古典的な方法にも、まだ大きな改善の余地が残っていた。", "unverified": "本文未読のため、スケーリング則の式と、比較した実装の詳細は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "答えを変えるニューロン群は一つに決まらない", "title": "Are Causal Neuron Circuits Unique and Transferable?", "url": "https://arxiv.org/abs/2611.13885", "authors": "Ömer Tekin Yavuz", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Yavuz, Ö. T. (2026). Are Causal Neuron Circuits Unique and Transferable? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13885", "why": "ニューロン群への介入でモデルの答えが変わる実演について、選んだ12個のMLPニューロンの全4,096通りの部分集合を測り、群全体が必要なことはまれで、互いに重ならない部分集合がそれぞれ単独で答えを変える場合があること、効果は言い換えには移るが他の連鎖では弱いことを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由の抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "ニューロン群への介入でモデルの答えが変わるという解釈可能性の実演について、その群のどれだけが本当に必要か、他の群でも同じことが起きるかを系統的に調べた（抄録）。", "p3": "選んだ12個のMLPニューロンの全4,096通りの部分集合について効果を測り、首都を答える二択課題と、二段階の関係をたどる課題で、ゼロにする介入と、別の質問の値に差し替える介入を比べた（抄録）。", "p5": "二択課題では12個をゼロにすると答えの余裕が27%下がるが、別の質問の値に差し替えてもほとんど変わらず、質問に固有の内容を運んでいる証拠はなかった。二段階の課題では、群全体が必要なことはまれで、重ならない部分集合がそれぞれ単独で答えを変える場合が多い（抄録）。", "fun": "AIの頭の中で「この18個のニューロンを止めると答えが変わる」という実験は、そこに知識がしまってあるように見える。しかし本当にその18個でなければいけないのか。この研究が全部の組合せを試すと、数個で足りたり、別の組でも同じことが起きたりした。「ここが原因だ」と言い切ることの難しさを示す、慎重で大事な検証である。", "unverified": "抄録の末尾が切れており、他の入力への転移の結果の詳細は未確認。小さいモデルでの検証である。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "有限予算での神経回路のスケーリング則のずれを解析", "title": "Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws", "url": "https://arxiv.org/abs/2611.13534", "authors": "Tianyu Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhao, T., & Ren, Z. (2026). Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13534", "why": "モデル容量とデータ量の分離したべき乗則からの有限規模でのずれを、スペクトルと領域の不均一性から解析し、容量方向について3項の展開を導いた。損失の下限を差分で消して安定に当てはめる方法も示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "モデル容量とデータ量についてのべき乗則（スケーリング則）が、有限の計算予算ではずれていく様子を理論的に解析し、ずれを補正する推定法を示した（抄録）。", "p3": "容量の方向では共分散のレゾルベントの解析から3項の展開を導き、損失の下限を1階の差分で消して安定な閉形式の初期値を得る。データの方向では複数領域の混合を水充填の問題に帰着させ、計算量一定の線上で最適な配分の指数がずれることを証明した（抄録）。", "p5": "45の作用素スペクトルと、既存の言語モデル群の学習記録（245回の実行など）、17領域の混合データで、ホールドアウトの平均絶対パーセント誤差5.89%を達成し、大きな計算量での配分の後悔を最大76.4%、混合の誤差を59.4%減らした（抄録）。", "fun": "AIは「モデルを大きくし、データを増やせば、決まった割合で賢くなる」という経験則に支えられて巨大化してきた。両対数グラフで直線になる、きれいな法則である。しかし限られた予算の範囲では、その線は実は曲がっている。この研究は曲がり方を式で表し、小さな試し計算から大きな計算の最適な配分を、より正確に見積もれるようにした。", "unverified": "本文未読のため、展開の式の具体形と、検証に使ったデータの詳細は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "事前学習・微調整・強化学習の計算配分を解析モデルで", "title": "An Analytical Model of Compute-limited Multistage Training Pipelines", "url": "https://arxiv.org/abs/2611.13276", "authors": "Nishil Patel ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Patel, N., Lee, J. H., Confavreux, B., & Saxe, A. (2026). An Analytical Model of Compute-limited Multistage Training Pipelines (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13276", "why": "教師なし事前学習、雑音のある教師つき微調整、疎な報酬の強化学習を組み合わせた高次元の解析可能なモデルを導入し、ランダム行列理論で低次元の学習ダイナミクスを導いて、段階間の相互作用と計算資源の配分を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "基盤モデルの多段階の学習（事前学習、教師つき微調整、強化学習）の相互作用と、計算資源の配分を、解析的に解けるモデルで調べた（抄録）。", "p3": "線形オートエンコーダによる教師なし事前学習、雑音のある段階的なラベルによる微調整、疎な報酬の強化学習を組み合わせた高次元モデルを導入し、ランダム行列理論などで低次元の学習ダイナミクスを近似的に導いた。結果はシミュレーションとよく合う（抄録）。", "p5": "事前学習データが有限だと表現に依存した性能の限界が生じ、ベイズ分類誤差は事前学習の標本比の平方根の逆数で減る。微調整を先に行うと、疎な報酬による強化学習の初期の停滞が短くなる。最適な計算配分は教師の質と総予算に依存する（抄録）。", "fun": "いまのAIは、まず大量の文章を読み、次にお手本で練習し、最後に「正解なら報酬」という訓練を受ける、という三段階で育てられる。では限られた計算時間を、どの段階にどれだけ使うのが良いか。この研究は、数式で解ける小さな模型を作ってその答えを探した。お手本の質と予算の大きさで、最適な配分が変わることが分かった。", "unverified": "抄録の末尾が切れており、補完的な合成モデルの結果は未確認。実モデルでの確認は一例にとどまる。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "記号的な推論機構はデータの多様性から生まれる", "title": "What drives the emergence of symbolic mechanisms in large language models?", "url": "https://arxiv.org/abs/2611.13270", "authors": "Melody Zixuan Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Li, M. Z., & Webb, T. (2026). What drives the emergence of symbolic mechanisms in large language models? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13270", "why": "抽象的な系列課題でニューラルネットを一から学習させ、構造とデータ分布の要因を変えて、抽象推論を支える記号的な機構の出現条件を調べた。データの多様性が大きいほど機構が強く現れることを、表現・注意・因果媒介の分析で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "ニューラルネットの中に抽象推論を支える記号的な機構が現れる主な要因は、構造ではなくデータの多様性であることを示した（抄録）。", "p3": "抽象的な系列課題でネットワークを一から学習させ、構造とデータ分布の要因を変えて、表現・注意・因果媒介の分析で記号的な機構の現れ方を調べた（抄録）。", "p5": "データの多様性が大きいほど記号的な特徴が強く現れた。同じ特徴は、改変したTransformerや多層パーセプトロンでも現れ、構造上の帰納バイアスは必要でなかった。実体と属性を結びつける課題でも同じ傾向だった（抄録）。数値は抄録に記載なし。", "fun": "AIが抽象的な規則を扱えるのは、Transformerという特別な構造のおかげだと考えられがちだった。ところが、ずっと単純な構造のネットワークでも同じ仕組みが現れた。決め手は、どれだけ多様な例を見せたかだった。賢さの源は器の形より、中に入れる経験の幅にある、という結果が面白い。", "unverified": "本文未読のため、課題の具体的な内容、モデルの規模、特徴の強さの指標は未確認。"}}, {"id": "pn30", "rank": 30, "field": "因果推論", "headline": "競合事象があるときの生存時間の因果媒介分析", "title": "Causal mediation analysis for a time-to-event endpoint in the presence of competing events", "url": "https://arxiv.org/abs/2611.13327", "authors": "Yuhao Deng ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Deng, Y., Gilbert, P., Fong, Y., & Zhang, B. (2026). Causal mediation analysis for a time-to-event endpoint in the presence of competing events (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13327", "why": "主要な事象を妨げる競合事象があるときの生存時間エンドポイントについて、原因別累積発生率への総効果を、直接効果、対象の媒介変数を通る間接効果、競合事象を通る間接効果に分ける統一的な扱いを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "主要な事象の発生を妨げる競合事象があるとき、生存時間の結果についての因果媒介分析を統一的に扱う方法を示した（抄録）。", "p3": "原因別の累積発生率への総効果を、直接効果、対象の媒介変数を通る間接効果、競合事象を通る間接効果に分ける。この分解を自然効果・確率的介入効果・分離可能効果の3つの枠組みで定式化し、効率的影響関数に基づく二重機械学習型の推定量を提案した（抄録）。", "p5": "ある設定では、3つの枠組みは異なる識別の仮定に立ちながら同じ統計的な汎関数になる。提案した推定量は多重頑健で半パラメトリック効率限界に達し、未測定の共通原因への感度分析も備える（抄録）。応用例の数値は抄録に記載なし。", "fun": "ある処置が効くのは、途中のある指標が変わるからなのかを調べたいとする。ところが観察の途中で別の出来事が起きると、目当ての出来事が起きたかどうかは永遠に分からなくなる。この「邪魔をする出来事」があると、効果の経路を分ける計算は一気に難しくなる。この研究は分け方を整理し、三つの流儀が同じ答えに行き着く条件を示した。", "unverified": "本文未読のため、応用したデータと推定結果、シミュレーションの内容は未確認。"}}, {"id": "pn31", "rank": 31, "field": "因果推論", "headline": "因果構造が部分的にしか分からないときの介入の選び方", "title": "Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals", "url": "https://arxiv.org/abs/2611.14066", "authors": "Min Woo Park ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Park, M. W., & Lee, S. (2026). Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14066", "why": "構造的因果バンディットを、因果構造が部分的にしか分からない場合（マルコフ同値類）、他の環境の情報（輸送可能性）、実現可能な反実仮想の行動へ拡張し、最小の介入集合の図的な基準と探索アルゴリズム、目標環境の報酬の上下界を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "因果の知識を使って試すべき介入を絞る構造的因果バンディットを、因果構造が部分的にしか分からない場合、他の環境の情報がある場合、反実仮想の行動ができる場合へ広げた（抄録）。", "p3": "マルコフ同値のもとでの最小介入集合の図的な基準を作り、部分的な輸送可能性によって元の環境の分布から目標環境の報酬の上下界を導き、実験でできることに支えられた反実仮想の行動を定式化した（抄録）。", "p5": "同値な選択肢や劣った選択肢を、最適な行動を残したまま取り除くアルゴリズムが得られ、妥当な事前の上下界のもとで後悔の保証を示した。構造的因果モデルを指定した実験で、これらの削減と移した上下界が学習に与える影響を調べた（抄録）。", "fun": "たくさんのスイッチのうち、どれを押すと一番良い結果になるかを、試しながら探す問題がある。全部を片端から試すのは無駄が多い。因果関係の図が分かっていれば「これを押しても意味がない」ものを先に外せる。この研究は、図が一部しか分からない場合や、別の場所での経験しかない場合でも、どこまで外せるかを明らかにした。", "unverified": "抄録の末尾が切れており、実験の結果の数値と結論の後半は未確認。"}}, {"id": "pn32", "rank": 32, "field": "因果推論", "headline": "予測による反実仮想で波及効果のある処置を評価", "title": "Causal Inference under Interference with Forecast-Based Counterfactuals", "url": "https://doi.org/10.2139/ssrn.7682605", "authors": "Viviana Celli ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Celli, V., Cerqua, A., & Pellegrini, G. (2026). Causal Inference under Interference with Forecast-Based Counterfactuals. https://doi.org/10.2139/ssrn.7682605", "why": "処置の波及（干渉）があるとき、汚染されていない対照群や相互作用の構造への強い仮定に頼らず、予測に基づく反実仮想の方法で平均処置効果を識別・推定できる条件を、潜在結果の枠組みで形式的に分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "処置の影響が他の単位にも及ぶ（波及がある）場合でも、予測に基づく反実仮想の方法で平均処置効果と波及効果を識別・推定できる条件を、初めて形式的に分析した（抄録）。", "p3": "潜在結果の枠組みで、処置がなかった場合の結果を予測で作る方法（FBCM）の識別を検討し、シミュレーションと実証の応用で、対照群に基づく通常の方法と比べた（抄録）。", "p5": "波及が広く及ぶ場合や、誰が誰に影響するか（曝露の写像）が分からない場合でも、主要な集計的な因果効果を識別できることを示した（抄録）。応用の内容と数値は抄録に記載なし。", "fun": "ある町に補助金を出すと、隣の町の景気も良くなるかもしれない。すると「隣の町」を比べる相手に使えなくなる。比べる相手がいなくなったらどうするか。この研究は、過去のデータから「補助金がなかったら自分はどうなっていたか」を予測して、それと比べる方法を調べた。他人ではなく、もう一人の自分と比べる発想である。", "unverified": "本文未読のため、識別に必要な仮定の内容、実証の対象、この方法の限界の具体的な記述は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "災害の前に注目だけが高まると住宅価格はどう動くか", "title": "Environmental Risk Salience and Real Estate Markets", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13073", "authors": "Marco Letta ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "以前から知られていた地震リスクが、被害や区分変更なしに注目だけ高まったイタリアの事例を自然実験として使い、最も曝露の大きい持ち家市場で売買価格が下がり、家賃は上がることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "以前から知られていた環境リスクが、被害が出る前に急に注目されたとき、不動産市場がどう反応するかを、イタリアの事例で示した（抄録）。", "p3": "地震活動の再燃によって、広い破壊・死者・公式の危険区分の変更なしに世間の注目が高まった状況を自然実験として使い、売買価格と家賃、および注目が他の出来事と競合するときの反応を調べた（抄録）。", "p5": "最も曝露の大きい持ち家市場で売買価格が下がり、家賃は上がった。無関係な出来事が注目を奪うときには、地震の信号への反応が弱まった（抄録）。変化の大きさは抄録に記載なし。", "fun": "「ここは地震の危険がある」ことは前から誰もが知っている。それでも、実際に揺れが続いて話題になると、被害がなくても家の値段が下がった。危険そのものは変わっていないのに、である。しかも、他の大きな出来事があると反応は弱まった。人は「知っている」だけでは動かず、「気になった」ときに初めて動くことが分かる。", "unverified": "本文未読のため、対象の地域と期間、価格・家賃の変化の大きさは未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "関税の報道で家計のインフレ予想が上がる", "title": "Tariff News and Household Inflation Expectations: The Role of Prior Beliefs", "url": "https://doi.org/10.2139/ssrn.7683852", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-10", "apa": "Ramakrishnan, V. (2026). Tariff News and Household Inflation Expectations: The Role of Prior Beliefs. https://doi.org/10.2139/ssrn.7683852", "why": "2018〜2025年の米国の7つの関税の局面について、検索の注目のピーク前後で同じ人の予想の改定を比べ、2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の再開で1.72ポイントの1年先予想の上昇を見いだした。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1
