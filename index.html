<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-13", "intro": "プレプリントの新着1,101件、学術誌の新着1,810件（うち上位10%誌1,484件）、重要論文の候補306件、新着の公開データ84件から選びました。第1部（プレプリント・関連）50報、第2部（プレプリント・注目）50報、第3部（論文誌・関連）50報、第4部（論文誌・注目）50報、第5部（オープンデータ）30件です。情報源の取得失敗はありません。e-Statは直近7日の新規公表が該当なしのため、第5部はDataCiteの登録分のみです。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "重車両で橋のモード特性はどう動くか", "title": "Variation of Modal Parameters in Bridges Under Heavy Load Configurations: A Case Study", "url": "https://doi.org/10.1002/cepa.3373", "authors": "Buka-Vaivade ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Buka‐Vaivade, K., Nicoletti, V., Quarchioni, S., & Gara, F. (2025). Variation of Modal Parameters in Bridges Under Heavy Load Configurations: A Case Study. Ce/Papers, 8(5), 49–55. https://doi.org/10.1002/cepa.3373", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは403で取得できず、Zenodo登録の抄録を読んだ。抄録の末尾に、これがce/papers 2025, 8(5), 49–55の査読済み著者最終稿であると記されている", "preprint": false, "p1": "供用荷重の範囲内で重車両を載せたとき、橋の固有振動数・減衰比・モード形がどこまで動くかを、実橋で測った幅として示せるようになった（抄録）。", "p2": "構造ヘルスモニタリング（SHM, structural health monitoring）では固有振動数の変化を損傷の兆候と読むが、健全なままでも重い荷重が載れば振動特性は動く。その「安全だが高荷重」の状態での変動幅が分かっていないと、損傷判定の閾値を決められない（抄録）。", "p3": "入力は常時微動の加速度記録、出力は常時微動解析（operational modal analysis, OMA）で推定したモード特性。満載トラックを複数の配置で置き、曲げモーメントが極大になるように載荷する。無載荷の状態と載荷状態で同じ解析をかけ、同一構造・同一計測系のまま荷重条件だけを変えて比較する設計である（抄録）。", "p4": "対象はイタリア中部の氾濫原に新設された連続・免震の鋼コンクリート合成橋（San Carlo橋）。評価は無載荷時のモード特性を基準とした、載荷配置ごとのモード特性の差で行う（抄録）。", "p5": "抄録は、載荷方式によってモード特性に変動が生じ、安全だが高荷重の状態を特徴づける動的応答の範囲が定まったと述べる。具体的な振動数の低下量や減衰の増加量は、抄録に数値が示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。新設の免震橋1橋の事例研究であり、支承特性や橋種の違う橋にそのまま移せるかは残る疑問である。", "fun": "橋は重いものが載ると「音程」が変わる。弦を強く張ると高い音が出るのと同じで、荷重のかかり方で橋の揺れやすい周波数がずれる。だから振動数が下がったという測定を見ても、それが傷のせいか、たまたまトラックが何台も載っていたせいか区別がつかない。この研究はトラックの置き方をわざと変えて、健全な橋でも起こる「音程のぶれ幅」を先に測っておく。異常を見つけるには、まず正常のばらつきを知る必要があるという発想が面白い。", "unverified": "固有振動数・減衰比の具体的な変化量、モード形の相関（MACなど）の値、載荷配置の数と各配置の荷重量。本文が入手できず確認できなかった。"}}, {"id": "pr02", "rank": 2, "headline": "LLM模擬回答は係数を項目ごとに歪める", "title": "Where Silicon Samples Go Wrong: Item-Level Coefficient Distortion in LLM-Simulated Chinese Public Opinion", "url": "https://doi.org/10.31235/osf.io/276rd_v2", "authors": "Mingkun Cui ほか", "venue": "SocArXiv", "date": "2026-10-12", "apa": "Cui, M., & Xiong, S. (2026). Where Silicon Samples Go Wrong: Item-Level Coefficient Distortion in LLM-Simulated Chinese Public Opinion. https://doi.org/10.31235/osf.io/276rd_v2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF（SocArXiv）のPDF本文を読んだ。方法（§3.1–3.4）、結果（§4.1–4.3）、限界（§5.4）、結論（§6）と図2・表3の説明を参照した", "preprint": true, "p1": "LLMの模擬回答で回帰を走らせたとき、どの項目のどの係数がどちら向きに歪むかを、人間データと同じ推定対象で項目単位に特定できるようになった（§3.3、§4.2）。", "p2": "従来の検証は分布の一致や係数の相関で全体の忠実度を採点してきた。しかし分布が合っても回帰係数が合う保証はなく、本文も分布適合の指標では歪みの所在が分からないと述べる（§4.1、§6）。", "p3": "CGSS回答者の属性ベクトルをペルソナとして1波1,000人分与え、同じ人の態度項目への回答を生成させる。核は推定対象を揃えた照合で、人間と模擬の回答を同じペルソナで積み上げ y ~ source × (female + age_z + edu + urban + inc) を項目ごとに当て、sourceとの交互作用項を「模擬−人間」の係数差として読む。所得項なら、所得が1段階上がるときの公平感への効果が模擬で何単位大きいかがそのまま出る（§3.3）。", "p4": "人間側はCGSS 2017（n=12,582、24項目）を主、CGSS 2021（n=8,148、17項目）を独立の追試とする。2026年の4モデル（Claude、DeepSeek、GPT-5.4、Qwen）を一次エンドポイントで呼ぶ。所得・都市農村・性別の3係数について10項目×4モデル×2波の各80検定、計240検定にHolm法を一括して当て、人間の平均・標準偏差で両者を標準化する人間基準尺度を主とする（§3.1–3.3）。", "p5": "図2は行が10項目、列が4モデル×2波、パネルが3係数で、各セルが係数差、支持されたセルが太字と点で示される。人間基準尺度では所得10/80、都市農村12/80、性別6/80が支持され、28差のうち19が公平感の所得勾配・婚前交渉の道徳の都市農村勾配・男性の能力信念の性差という3項目に集中した（§4.2、表3）。源内標準化に変えると240検定のうち33の判定が入れ替わる（§4.3）。", "p6": "著者は、復号の制御が不完全で温度の感度検証が2モデル1波に限られること、各模擬回答者が全項目を1回の生成で答えるためペルソナの一貫性が勾配を平滑化または増幅しうること、1国1調査の2波・4モデル・順序尺度の態度項目に限られることを限界に挙げる（§5.4）。", "fun": "LLMに「この属性の人ならどう答えるか」と尋ねて作った偽の世論調査は、平均値を見るとかなり本物に似ている。ところが「収入が高い人ほど社会は公平だと思うか」という関係の強さを調べると、偽データは実際より勾配を大きく出す。平均は合うのに関係が合わない状態がありうるわけだ。さらに面白いのは、どの尺度で標準化するかを決めるだけで有意差の判定が240件中33件も入れ替わる点。何を測るか先に宣言しないと、同じデータから違う結論が出てしまう。", "unverified": "表1・表4の個別の数値（モデルごとのTVDや下位集団の相関値）は本文の表が機械可読に崩れており読み取れなかったため引用していない。"}}, {"id": "pr03", "rank": 3, "headline": "文脈内学習でモデル推定を飛ばす同定", "title": "In-Context Learning for System Identification: Probabilistic Formulation, Long-Sequence Handling, and Benchmark Validation", "url": "https://arxiv.org/abs/2610.13411", "authors": "Matteo Rufolo ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Rufolo, M., Piga, D., Pura, F., & Forgione, M. (2026). In-Context Learning for System Identification: Probabilistic Formulation, Long-Sequence Handling, and Benchmark Validation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13411", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。手法（§3.3–3.4）、長系列の扱い（§4.1–4.2）、実験（§6.2、表1–3）、限界（§7）を参照した", "preprint": true, "p1": "系ごとにモデルを推定せずに、入出力の文脈データと問い合わせ入力を与えるだけで、未知の動的系の出力を不確実性つきで予測できるようになった（§3.3）。", "p2": "古典的なシステム同定は、学習データからモデルを推定し次にそれで予測する二段階をとる。系ごとに構造を決める手間がかかり、データが乏しい系では不安定になる。既存の文脈内学習型は点推定しか出さず、注意機構が系列長の2乗で重くなるため長い文脈も扱えなかった（§3.3、§4）。", "p3": "入力は文脈入出力列と初期条件と問い合わせ入力、出力は各時刻の予測分布の母数。未知の条件付き分布をq_φで近似するという定式化からKLダイバージェンスの期待値を最小化すると、残るのは負の対数尤度 J(φ) になる（式5–7）。q_φは対角共分散のガウス分布で、平均μ_kが従来の点推定、標準偏差σ_kが不確かさを表す（式8–9）。長い文脈には学習時のパッチング（計算量をL²分の1に）と推論時のアンサンブルで対処する（§4.1–4.2）。", "p4": "合成データのみで事前学習し、ベンチマークの学習データは使わない。評価は、学習分布と同じWiener–Hammerstein系320実現、実データの非線形同定ベンチマーク3件でのゼロショット予測、別クラス（CSTR）への微調整の3段階で、指標はRMSEと、古典手法の学習時間に対するメタ推論時間である（§6.2）。", "p5": "表1（分布内）はパッチングがRMSE 0.048・0.019秒、アンサンブルが0.038・0.039秒で精度はほぼ同等。表2（実ベンチマーク）はWiener–Hammersteinで0.0014（dynoNet 0.0017、LSTM 0.0015、ARX 0.0434）、縦続タンクで0.429（同0.421、0.452、0.697）で、所要時間は提案法0.17〜5.91秒に対し古典手法の学習は1分〜24時間。表3（CSTR）はゼロショット1.249、入力クラスだけ合わせて0.242、系クラスまで合わせて0.115で雑音下限0.1に近づく。", "p6": "著者は、メタ学習に大規模な合成コーパス上のオフライン計算が必要なこと、推論時のモデルが重く組込みに向かないこと、良質なデータが豊富な単一系では古典手法の漸近精度が上回りうること、得られるのは予測で解釈可能な母数表現ではないため周波数応答解析や制御設計に使いにくいことを挙げる（§7）。", "fun": "ふつうは「まず方程式を当てはめ、それから予測する」。この研究はその順番を飛ばし、過去の入出力の記録をそのまま読ませて次の応答を直接当てさせる。人が初見の楽器を少し鳴らして勘所をつかむのに近い。学習は全部人工データで済ませたのに、実物の装置でも古典手法と同程度の誤差で、計算時間は数分〜数十時間から1秒以下に縮む。入力信号の種類だけ現実に合わせると誤差が5分の1になった点も示唆的である。", "unverified": "なし"}}, {"id": "pr04", "rank": 4, "headline": "DEM供試体の初期剛性を現実に近づける", "title": "A Relaxation-Recompression Method for Preparing Dense DEM Soil Specimens with Realistic Initial Stiffness", "url": "https://doi.org/10.2139/ssrn.7601317", "authors": "Yuxuan SHI ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "SHI, Y., OTSUBO, M., & KUWANO, R. (2026). A Relaxation-Recompression Method for Preparing Dense DEM Soil Specimens with Realistic Initial Stiffness. https://doi.org/10.2139/ssrn.7601317", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ", "preprint": true, "p1": "摩擦係数を瞬時に戻す従来のDEM供試体作成が初期剛性を過大にする理由を接触スケールで突き止め、密な充填を保ったまま小ひずみ剛性を実測に近づける作成法を示した（抄録）。", "p2": "密な粒状土のDEM（離散要素法, discrete element method）解析では、人為的に低い粒子間摩擦係数で等方圧縮し、その後に目標の摩擦係数へ瞬時に戻す手順が広く使われる。高密度は得られるが、供試体の初期剛性が非現実的に大きくなる（抄録）。", "p3": "抄録によれば、従来法と提案法について配位数（coordination number, CN）の変化と接触のせん断力動員比の分布を調べる。摩擦の瞬時回復は多くの接触を低い動員比に集め、せん断抵抗の余力を過剰に残す。これに対し、応力制御の緩和はほとんど変化を生まないが、ひずみ制御の緩和は接触の動員比を再配分し、CNを下げ、その後のせん断で発達するファブリックを変える（抄録）。", "p4": "評価は、初期のヤング率とせん断弾性係数、間隙比、ピーク強度と残留強度、および等方拘束圧を変えたときのCNとの関係で行う。良しとする基準は、密な充填を保ちながら小ひずみ剛性が室内試験の測定値に近づくことである（抄録）。", "p5": "抄録の報告では、ひずみ制御の緩和は初期のヤング率とせん断弾性係数を30%以上下げる一方、間隙比の変化はわずかで、ピーク強度と残留強度は実質的に変わらない。初期のヤング率は、調べた等方拘束圧の範囲でCNとほぼ線形に相関した（抄録）。", "p6": "著者が認める限界は抄録に示されていない。緩和・再圧縮の手順が粒子形状や粒度分布の違う材料でも同じ効果を持つかは、残る疑問である。", "fun": "砂を計算機の中で「密に詰める」には、粒どうしをいったん滑りやすくしてから押し固め、後で摩擦を戻すという裏技が使われてきた。ところがこの裏技を使うと、できた砂は実物よりずっと硬くなってしまう。原因は、ほとんどの接触点が摩擦の余力をたっぷり残した状態で固定されるから。だから少し揺らして余力を配り直すと、密度も強度もほぼ変えずに硬さだけが3割以上下がり、実物に近づく。配り直しという一手で現実に寄るのが面白い。", "unverified": "緩和・再圧縮の具体的な手順（緩和量や再圧縮の経路）、CNの変化量の数値、対象とした粒子形状と粒度。本文が入手できず確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "取引明細の文章から信用スコアを強化", "title": "Enhancing credit risk scorecards with transactional-based behavioural features", "url": "https://arxiv.org/abs/2610.13199", "authors": "Dian Prinsloo ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Prinsloo, D., Verster, T., & Smit, N. (2026). Enhancing credit risk scorecards with transactional-based behavioural features (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13199", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXivのPDF本文を読んだ。方法（§3）、結果（§4：表3・4・6・7と図3）、結論と限界（§5）を参照した", "preprint": true, "p1": "取引明細の自由文の摘要を、解釈できる支出カテゴリの行動変数に変換して、既存の信用スコアカードの判別力を上げられるようになった（§3.3、§4.3）。", "p2": "信用リスクのモデルは信用履歴・返済行動・所得・残債を使うのが通例で、取引データは直近性・頻度・金額という集計指標でしか使われてこなかった。摘要の生テキストの行動情報は非構造のためほとんど使われておらず、本文はここを空白と位置づける（§1–2）。", "p3": "入力は南アフリカの大手金融機関の中小企業顧客の取引明細（月あたり約4,000万件規模）、出力は34カテゴリの分類結果とそこから作る行動変数。頻度・金額の分析と業務知識でカテゴリ語彙を作り、階層的な正規表現で摘要を振り分ける。小売店名を含む摘要はPOS系、税務の語を含むものはTAXに落ち、カテゴリ別の支出の趨勢が変数になる（§3.2–3.3）。", "p4": "2023年の12か月を開発期間とし、2021・2022・2024・2025年の年別サンプルで分類精度を測る。34カテゴリに等割当の層化抽出で各年1,000件を取り、手作業分類を正解として一対他方式のF1をマクロ平均で評価し、安定性はPSIで見る。スコアカードは期間・不良顧客の定義・変数本数を揃え、行動変数なしのモデルA（従来10本）とありのモデルB（従来4本＋取引行動6本）をGini係数とHHIで比べる（§3.4、§4.3）。", "p5": "分類は多くのカテゴリでF1が高く、2021年と2025年で落ちる。2023年だけで作った語彙に、それ以前に消えた小売や以後に現れた小売が入らないためと説明される（図3、表3）。直近サンプルのマクロ平均F1は約90%、PSIは10%未満（§5）。最低のF1はEFT_TYPE_1で、件数が多く自由記述の摘要を最も多く含む。スコアカードではモデルBがGiniで14%の相対改善を示し、取引行動変数がモデルBの寄与の約60%を占めた（表6・7）。表6の60%→68%は守秘のための例示値で、本文も差分だけが真の改善を反映すると明記する。", "p6": "著者は、語彙作成に人手の確認が入るため完全自動化はできないこと、精度と安定性が開発期間から約2年で基準を外れ始め定期更新が必要なこと、南アフリカの取引慣行と言語に固有で他国には追加研究が要ること、取引履歴のある既存顧客で作られたため新規申込のスコアカードには適用が限られることを挙げる（§5）。", "fun": "銀行の明細に並ぶ「○○スーパー」「振込 ○○」といった短い文字列は、人間が見れば何に使ったか察しがつくのに、機械には意味のない記号列だった。この研究はそこに正規表現と業務知識で34個の引き出しを作り、文字を支出行動に翻訳した。すると与信の判別力が14%改善し、最終モデルの6割がこの変数で占められた。意外なのは精度が2年ほどで落ち始めること。店が入れ替わる街の変化が、そのまま辞書の賞味期限になっている。", "unverified": "モデルAとモデルBの実際のGini値（守秘のため例示値のみ）、HHIの具体値、表4のマクロ平均の年別の値。"}}, {"id": "pr06", "rank": 6, "headline": "社会的補強が口コミの強さを決める", "title": "How Social Reinforcement Shapes Word-of-Mouth: A Conviction-Based Model for Marketing Diffusion and Network Targeting", "url": "https://arxiv.org/abs/2610.13890", "authors": "Abhishek K. Umrawal ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Umrawal, A. K., Stutsman, C., Woods, C., & Robson, E. W. (2026). How Social Reinforcement Shapes Word-of-Mouth: A Conviction-Based Model for Marketing Diffusion and Network Targeting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13890", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。モデル定義（§3.2）、定理（§4.1–4.3）、近似保証（§5.2.3、§7.2）、計算実験（§6.1–6.5）、実データ検証（§8）、今後の課題（§10.2）を参照した", "preprint": true, "p1": "採用時に受けた社会的圧力の大きさがその人の後の発信力を決めるという機構を拡散モデルに組み込み、口コミ施策で誰を最初に狙うべきかが従来と変わることを示した（§3.2、§6.3）。", "p2": "従来の閾値型の拡散モデルは誰が採用するかは扱うが、影響の強さを固定した静的な重みとして扱う。消費者は採用するかどうかだけでなくどれだけ強く推奨するかでも異なるのに、その機構が抜けていた（§1–2）。", "p3": "有向グラフ上で各辺に重みw_uv、各節点に一様乱数の閾値θ_vを置き、活性な入隣接からの重みの和が閾値以上になると活性化する（線形閾値モデルと同じ規則）。追加は1点だけで、節点vが活性化した時刻に受けた累積影響I_vに比例して、未活性の隣接への出力重みを w' = min(1, w + α·I_v) と1回だけ更新する（§3.2）。αは社会的圧力をどれだけ内面化するかを表し、α=0なら元のモデルに戻る。更新を1回に限ることで再帰的な増幅ループを避けている。", "p4": "構造的性質を定理で検討する。影響最大化はNP困難（定理4.1）、単調性は一般に不成立（定理4.4）、劣モジュラ性も不成立（定理4.7）。そのうえで上下から挟むサンドイッチ近似でデータ依存の保証を計算する（§5.2.3）。実験は実3種とランダムグラフ、予測精度はHiggs Twitterのリツイート連鎖100件でNMSEにより測る（§6.1、§8）。", "p5": "種選択（表2、k=20）は序盤は両モデルでほぼ一致し、8反復目付近から分岐して、提案モデルは密に結ばれた局所構造の節点を選ぶようになる。影響の総量は同じ予算で全ネットワークで提案モデルの方が大きい（図6–9）。k=5、α=0.5の例（表3）では提案モデル由来の種集合の期待拡散258.912が最大で、上界モデルとの比231.67/260.00≈0.891から最適値の約56.3%という保証が得られる（古典的な63.2%に近い）。実データではαを上げると予測誤差が改善し、ある点を超えると止まる（図12）。", "p6": "著者は今後の課題として、影響関数が近似的に単調または劣モジュラになる条件の特徴づけ、大規模な拡散データからのαの推定、社会的圧力への感度の個人差や時間変化の取り込みを挙げる（§10.2）。倫理面では影響工作や誤情報増幅への悪用という二重用途性に注意を促している。", "fun": "同じ商品を買った二人でも、まわりの何人もに勧められてから買った人のほうが、その後に熱心に人に勧める。この当たり前のことをモデルに入れると、数学的に困ったことが起きる。「種を増やせば必ず広がる」も「増やすほど効き目が薄れる」も成り立たなくなり、定番の貪欲法の保証が崩れるのだ。それでも上下から挟む工夫で最適の56%程度は保証でき、狙う相手は有名人より「密に結びついた集団の一員」へ寄る。常識の一歩が理論を壊し、別の道で立て直される。", "unverified": "なし"}}, {"id": "pr07", "rank": 7, "headline": "被覆石が波による海底液状化を抑える", "title": "Numerical Modelling of Wave-Induced Seabed Liquefaction Around Marine Structures: Assessment of Mitigation Measures", "url": "https://doi.org/10.2139/ssrn.7601302", "authors": "Ranjith Khumar Shanmugasundaram ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Shanmugasundaram, R. K., Vanjakula, V. K., Windt, C., Rusche, H., Kirca, V. S. Ö., Sumer, B. M., & Goseberg, N. (2026). Numerical Modelling of Wave-Induced Seabed Liquefaction Around Marine Structures: Assessment of Mitigation Measures. https://doi.org/10.2139/ssrn.7601302", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ", "preprint": true, "p1": "洗掘対策として置かれる被覆石が、同時に地盤工学的な上載荷重として残留液状化を抑える効果を、波・地盤・構造・被覆石を一つのソルバで解いて定量化できるようになった（抄録）。", "p2": "波の繰返し荷重を受ける飽和粒状土は強度と剛性を失う。被覆石や捨石は洗掘対策として日常的に設置されるが、それが同時に有効応力を上げて液状化を抑える役割は定量化されておらず、設計で使われていない（抄録）。", "p3": "入力は波条件と地盤・構造・被覆層の配置、出力は間隙水圧の蓄積と液状化域の発達である。OpenFOAM上でBiotのポロ弾性理論とドリフトフラックスモデルを組み合わせ、非液状化域はポロ弾性、液状化域はドリフトフラックスで表し、液状化判定で両者を切り替える。波・地盤相互作用、波・地盤・構造相互作用、被覆石を加えた場合の3段階で計算する（抄録）。", "p4": "モデルは既存の実験データと照合して残留液状化の発生を再現できることを確認したうえで使う。評価は、正規化した間隙水圧比（1.0で破壊）と、初期の平均有効応力の増加率で行う（抄録）。", "p5": "抄録の報告では、被覆石は初期の平均有効応力を上げることで間隙水圧の蓄積を抑え、泥線近傍で1層のゆるい被覆で42%、3層で最大129%の増加をもたらす。構造物の自重は局所的な拘束を与えるが、600 Nの動的な係留力は水圧の蓄積を加速させ、60秒で残留液状化に至る。被覆石を加えると最大の正規化間隙水圧比が破壊状態の1.0から約0.12まで下がる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。単一の波条件・地盤条件での計算であり、粒度や透水性の異なる地盤や不規則波への一般化は残る疑問である。", "fun": "海底に構造物を置くとき、まわりに石を敷くのは「波で土が掘られるのを防ぐため」と説明されてきた。ところが同じ石が、上から重しをかけて土の中の水圧が上がりにくくするという、まったく別の仕事もしていた。石を3層置くと土にかかる有効な圧力が最大で2倍以上になり、壊れる寸前（指標1.0）だった状態が0.12まで下がる。目的が1つだと思っていた対策に、設計で使われてこなかった第二の効能が隠れていたという話である。", "unverified": "波の諸元（波高・周期・水深）、地盤の透水係数や相対密度、液状化判定の具体的な基準。本文が入手できず確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "AI要約が投資家の質問を増やす", "title": "Enhancing Corporate Communication with AI-summarized Disclosures", "url": "https://doi.org/10.2139/ssrn.7593921", "authors": "T.J. Wong ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Wong, T. J., Yi, Y., Yu, G., Zhang, S., & Zhang, T. (2026). Enhancing Corporate Communication with AI-summarized Disclosures. https://doi.org/10.2139/ssrn.7593921", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ", "preprint": true, "p1": "年次報告書のAI要約を投資家に配ると説明会での対話の量と質がどう変わるかを、フィールド実験で測れるようになった（抄録）。", "p2": "開示書類は長く、読み通せる投資家は限られる。AIによる要約が対話を助けるのか、それとも要約に書かれた話題へ注意を縛るのかは分かっていなかった（抄録）。", "p3": "中国のバーチャル説明会（オンラインの投資家向け会議）で、投資家に年次報告書のAI生成要約を提供する処理をランダムに割り当てる。出力は質問の本数、長さ、数値的な内容の量、認知的な処理の水準、および株価の反応である（抄録）。", "p4": "比較対象は要約を提供しなかった対照群の企業。評価は、質問の量（本数）と質（長さ・数値含有・認知処理の水準）、投資家の種類による違い、そして説明会に対する資本市場の反応で行う（抄録）。", "p5": "抄録の報告では、処理群の企業は対照群に比べて投資家の質問数が39.2%増え、質問はより長く、数値的な内容を多く含み、より高次の認知処理を反映した。効果は投資家の種類によって異なり、それまで沈黙していた投資家が会話に加わるが質問は要約の話題に集中し、もともと発言の多い投資家はより広く、要約の外の話題にも広がった。資本市場の反応は処理群の説明会でより強く、特に投資家の関与が大きい説明会で顕著だった（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。要約の生成に用いたモデルや要約の品質、効果が中国のバーチャル説明会という制度に固有かどうかは、残る疑問である。", "fun": "長い決算書類をAIが短くまとめて渡すと、読む負担が減るので投資家は黙ってしまうのではないか、と思うかもしれない。結果は逆で、質問は4割近く増え、しかも数字を含む踏み込んだ質問になった。面白いのはその増え方に偏りがあること。これまで発言しなかった人は要約に書かれた話題に集まり、もともとよく話す人は要約の外へ広がった。要約は入口を広げる一方で、新しい人の視野をその枠に閉じてしまう面もある。", "unverified": "実験の企業数と期間、要約に使ったモデル、株価反応の具体的な大きさ。本文が入手できず確認できなかった。"}}, {"id": "pr09", "rank": 9, "headline": "個人資源と構造要因は孤独に足し算で効く", "title": "Personal Resources and Structural–Relational Circumstances Show Additive Associations With Loneliness in Spanish Adults Aged 55 and Older", "url": "https://doi.org/10.21203/rs.3.rs-10883362/v1", "authors": "Raúl Gil-Ballesteros ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Gil-Ballesteros, R., Corregidor-Sánchez, A. I., Llopis, R. L., & Cervigón, R. (2026). Personal Resources and Structural–Relational Circumstances Show Additive Associations With Loneliness in Spanish Adults Aged 55 and Older. https://doi.org/10.21203/rs.3.rs-10883362/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文を読んだ。方法（§2.1–2.3）、結果（§3、表2）、限界（§4）を参照した", "preprint": true, "p1": "個人資源を強めれば構造的な不利が緩和されるという前提を直接検証し、少なくとも検出できる大きさの緩衝効果は無いと示せるようになった（§3.2、§4）。", "p2": "晩年の孤独への介入は、レジリエンス・人生の意味・共感といった個人資源を強めれば構造的・関係的な不利を打ち消せるという前提に立つことが多い。しかしこの調整（moderation）の主張が直接検証されることはまれだった（§1）。", "p3": "入力は構造的・関係的な状況（配偶関係、学歴、同居形態、パンデミック時の恐怖、メッセージアプリの利用頻度）と個人資源（共感、レジリエンス、人生の意味の所在と探求）。出力はDe Jong Gierveldの11項目孤独感尺度スペイン語版の総得点（ω=.813）。3ブロックの階層的回帰を当てたうえで、3つの構造的リスク（死別、家族と同居していない、低学歴）×3つの資源の9通りの交互作用を検定する。緩衝があるなら交互作用項が有意になるという設計である（§2.2）。", "p4": "対象はスペイン・カスティーリャ＝ラ・マンチャ州の地域センターで募った55歳以上の在宅高齢者302名（女性70.2%、都市96%、死別28.5%）。評価の基準を結果より先に置くため、事後の感度分析で検出力80%で検出できる最小の交互作用の大きさを求めている（§2.1、§2.3）。", "p5": "二変量では構造要因が孤独と関連する（死別は既婚に対しr=.26、Holm調整後p=.006）。個人資源の方が関連は強い（共感ρ=−.323、レジリエンスρ=−.312、意味の所在ρ=−.268）。最終モデルで有意なのは3つの資源だけで、共感β=−0.156（p=.007）、レジリエンスβ=−0.164（p=.005）、意味β=−0.206（p<.001）。死別と低学歴は年齢や同居形態と重なって説明された。9つの交互作用はいずれも有意に近づかず、係数は−0.144〜+0.149、p値は.19〜.94（表2）。検出力80%で検出できたのは|β|≈.14以上で、観測された最大の係数とほぼ同じ大きさである。", "p6": "著者は、横断デザインのため因果は読めないこと、小さい効果は盲点に入ること、共感・レジリエンス・社会的孤独下位尺度の信頼性が低め（ω≈.65〜.68）で測定誤差は主効果より交互作用項を強く減衰させること、1地域の便宜標本で女性と都市に偏ること、事前登録がないことを挙げる（§4）。", "fun": "「心の強さを鍛えれば、ひとり暮らしや配偶者との死別のつらさも和らぐはず」という直感は広く共有されている。この研究はその直感を9通りの組み合わせで正面から検定し、どれも支持されなかった。しかも著者は「有意差なし」で終わらせず、どのくらいの大きさなら検出できたかを先に計算しておき、観測された最大の係数とほぼ同じ水準だと示す。つまり「小さい効果は見逃したかもしれないが、大きな緩衝はない」と言い切れる。", "unverified": "表3（他の構造要因で調整した交互作用係数）と表4（下位尺度別の係数）の個別の数値は、本文の表が機械可読に崩れており読み取れなかったため引用していない。"}}, {"id": "pr10", "rank": 10, "headline": "作用素推定で非圧縮流の縮約模型を作る", "title": "Non intrusive parametric Reduced Order Models based on physics for incompressible flow", "url": "https://arxiv.org/abs/2610.13425", "authors": "Cyrille Allery ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Allery, C., & Beghein, C. (2026). Non intrusive parametric Reduced Order Models based on physics for incompressible flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13425", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。手法（§3.1.1–3.1.3）、多孔質媒体への適用（§4）、結果（§5.1–5.2、表1・2）、結論（§6）を参照した", "preprint": true, "p1": "支配方程式を陽に射影せずに、POD係数から縮約作用素を直接同定して、時間とパラメータの両方に外挿できる非圧縮流の縮約モデルを作れるようになった（§3、§6）。", "p2": "標準的なGalerkin射影による縮約モデルは、方程式を基底に射影する侵入的な実装が必要で、Forchheimer項のような非線形項は射影で扱いにくい。既存の非侵入的な作用素推定は、パラメータ付きの過渡非圧縮流には拡張されていなかった（§1、§6）。", "p3": "速度と圧力に別々の大域的な縮約基底を取り、縮約係数a(t,Re)の時間微分と二次項・線形項・定数項からなる残差 R_i = da_i/dt + ΣΣQ_ijk a_j a_k + ΣL_ij a_j + F_i を定義する（§3.1.1）。POD係数が既知なら残差は未知係数について線形なので、同定は正則化付き最小二乗に帰着する（§3.1.2）。要点は未知ベクトルX_iが方程式ごとに独立に決まり行列Aが共通なので連立を解かずに済むこと。未学習のReでは、同定した係数で縮約系を時間積分するだけで予測が得られる（§3.1.3）。", "p4": "検証は2つ。(a) 周期的な領域にある蓋駆動キャビティ流で時間外挿と未学習パラメータでの予測を調べる。(b) 正方形障害物を含む多孔質媒体中の過渡流で、非線形のForchheimer項を含むためGalerkin射影が直接使えない場合を扱う。評価は基準解に対する速度・圧力の平均および最大の相対誤差で行う（§5）。", "p5": "キャビティ流では、固定Reで学習データの50%のみを使っても速度の相対誤差は約0.01〜0.03%に収まる（§5.1.2）。パラメータを変えた多ケース比較（表1）では、内挿で平均相対誤差0.126〜0.222%・最大0.71%未満、外挿で平均0.84%未満・最大2.27%と2.72%で、全ケースで平均1%未満・最大3%未満。圧力（表2）は内挿で平均0.229〜0.556%・最大1.2%未満だが、外挿では平均6.53%・最大12.39%（ケースA）、平均21.1%・最大43.8%（ケースE）まで悪化する。圧力の縮約モデルが速度の縮約係数に依存するためである（§5.1.3）。", "p6": "著者は結論で、パラメータ外挿では誤差が大きくなること、特に圧力場でそれが顕著であること、圧力の再構成が速度予測の精度に強く依存することを指摘する（§6）。", "fun": "流れのシミュレーションは重いので、少数の「代表的な流れの形」の足し算で近似する縮約モデルが使われる。ふつうは方程式をその形に投影して係数を作るが、この研究は投影を飛ばし、計算結果の係数の時間変化だけを見て方程式の係数を当てる。すると、投影では扱いにくい非線形項があっても同じ手順で済む。ただし面白いのは精度の出方で、速度は外挿でも誤差3%以内なのに、圧力は最大44%まで崩れる。圧力は速度から作るので、誤差が後ろに溜まる構造が見える。", "unverified": "表3〜6（多孔質媒体ケースの誤差値）の個別の数値は本文の表が機械可読に崩れており、代表値のみを引用した。"}}, {"id": "pr11", "rank": 11, "headline": "自由回答のLLM分類を総調査誤差で評価", "title": "Evaluating Large Language Models (LLMs) for Coding Open-Ended Survey Responses: A Total Survey Error Framework", "url": "https://doi.org/10.31235/osf.io/2rjm6_v1", "authors": "Laone Maphane ほか", "venue": "SocArXiv", "date": "2026-10-12", "apa": "Maphane, L., & Durrant, G. (2026). Evaluating Large Language Models (LLMs) for Coding Open-Ended Survey Responses: A Total Survey Error Framework. https://doi.org/10.31235/osf.io/2rjm6_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF（SocArXiv）のPDF本文を読んだ。枠組み（§3）、適用（§5.1–5.7）、推定への含意（§6）、結論と限界（§7）を参照した", "preprint": true, "p1": "自由回答のLLMによる自動コーディングを、人間との一致率だけでなく調査データ生産の一部として6つの面から評価できるようになった（§3、§5.7）。", "p2": "自動コーディングの評価は分類精度と人間との一致に偏ってきた。しかし一致率が近い複数のシステムが、同じ分布の符号化データを生み同じ推定値を返すとは限らない。本文はこの点を既存評価の限界と位置づける（§2.3、§5.7）。", "p3": "入力は自由回答と固定コードブック、出力は割り当てられたコードの集合である。総調査誤差（Total Survey Error, TSE）の枠組みに置き、(1)処理上の一致、(2)測定の妥当性、(3)有病率の歪み、(4)コーディング密度、(5)回答形式への感度、(6)運用上の信頼性の6次元で評価する。人間のコーディングは高品質の運用基準として使うが完全に正しいとは扱わず、差異を「誤り」ではなく「不一致」と呼ぶ（§3、§5.1）。", "p4": "対象はNatCen Opinion Panelの2025年3月波の自由回答（英国で今より注目されるべき社会問題は何か）で、96カテゴリの固定コードブックで符号化され、1件に複数コードが付きうる。5,231件のうち共通の1,552件を評価用に取り分ける。比較するのは埋め込み型の局所システム2種（MiniLM、BGE）と、GPT 5.4 nanoのゼロショットとフューショットの2条件である（§5.1）。", "p5": "処理上の一致はマイクロF1が0.718〜0.736、完全一致が0.517〜0.601である（§5.2）。完全一致0.601は約6割の回答が人間と同一のコード集合を得たことを意味する。しかしカテゴリ分布を見ると、平均の絶対有病率差は0.0030〜0.0044（約0.3〜0.4ポイント）にすぎないのに、カテゴリ単位の最大差は0.0245〜0.0393（約2.5〜3.9ポイント）に達する（§5.3、図4）。4システムは一致率が近いのに、割り当てたコード数とカテゴリ単位の差の大きさで異なった（§5.7）。", "p6": "著者は、1つの調査の1波の1問と1つの固定コードブックに基づくため他の主題・集団・言語に当てはまるとは限らないこと、不一致を一件ずつ独立に裁定していないため一部は妥当な別解釈かもしれないこと、重み付き推定値・下位集団比較・回帰結果への影響は今後の課題であることを挙げる（§7）。", "fun": "自由回答の分類をAIに任せるとき、ふつうは「人間とどれだけ一致したか」で合否を決める。ところがこの研究は、一致率がほぼ同じ4つのシステムが、実は違う形のデータを作っていたと示す。全カテゴリの平均では0.3ポイントほどの差でも、特定のカテゴリでは4ポイント近くずれる。96個の引き出しに均せば小さな差が、ひとつの引き出しの中では大きい。平均で評価すると見落とすものがあるという、統計の基本が自動化の現場で効いてくる。", "unverified": "表2（条件ごとの回答単位の対応とコーディング強度）の個別の数値と、回答形式別（短・中・長）の完全一致・Jaccard類似度の値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pr12", "rank": 12, "headline": "アルゴリズム管理下の幸福が成果を媒介", "title": "Wellbeing under Algorithmic Management: Explaining How Human Needs Shape Performance in Platform Work", "url": "https://doi.org/10.21203/rs.3.rs-10872787/v1", "authors": "Qi Zhong ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Zhong, Q., Lim, T. S., & Dousin, O. (2026). Wellbeing under Algorithmic Management: Explaining How Human Needs Shape Performance in Platform Work. https://doi.org/10.21203/rs.3.rs-10872787/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文を読んだ。理論（§2.1–2.2）、測定モデル（§4.2）、構造モデルと仮説検定（§4.3）、限界（§5.5）を参照した", "preprint": true, "p1": "アルゴリズムに管理される就業で、存在・関係・成長の欲求が主観的幸福を介して成果につながる経路を、係数つきで切り分けられるようになった（§4.3）。", "p2": "プラットフォーム就業が労働者の幸福に影響することは繰り返し示されてきたが、幸福が結果として測られるばかりで、働く条件と成果をつなぐ心理的な機構として扱われてこなかった（§1、§2.1）。", "p3": "ERG理論（存在・関係・成長の3欲求）を枠組みに置き、3欲求を外生変数、主観的幸福（生活満足・肯定的感情・否定的感情）を媒介、職務成果（課題遂行・サービス遂行・適応的遂行）を結果とする構造モデルを立てる。二段階のPLS-SEM（部分最小二乗構造方程式モデリング）で、直接効果と幸福を介した間接効果を同時に推定する（§4.2–4.3）。", "p4": "対象は中国広州のプラットフォーム労働者277名の横断調査。評価の基準は、潜在変数の信頼性と内的VIF（多重共線性）の確認を先に行い、そのうえで調整済みR²で説明力を、ブートストラップ信頼区間つきの標準化係数で各仮説を判定するという順序で置かれている（§4.3）。", "p5": "モデルは主観的幸福の分散の44.1%、職務成果の分散の49.9%を説明した。直接効果（表5）は、存在欲求→成果がβ=0.305（p<0.001）、成長欲求→成果がβ=0.291（p<0.001）で支持されたが、関係欲求→成果はβ=0.093（p=0.105、95%区間が0をまたぐ）で支持されなかった。一方、幸福に対しては3欲求すべてが正で、存在β=0.334（p<0.001）、関係β=0.174（p=0.004）、成長β=0.287（p<0.001）。幸福→成果はβ=0.187（p=0.002）である。つまり関係欲求は成果に直接は効かず、幸福を経由してのみ効く（§4.3.1）。", "p6": "著者は、横断デザインのため因果推論が弱く、プラットフォームのアルゴリズムは頻繁に更新されるため経路は固定ではなく動的に理解すべきこと、広州という単一の労働市場に基づくため制度環境の違う地域へ一般化できないこと、アルゴリズム管理を労働者の知覚で捉えており透明性や自動化の程度といったシステム側の特性を区別していないこと、成果が自己報告でプラットフォーム側の評価指標と乖離しうることを挙げる（§5.5）。", "fun": "配車や配達のアプリで働く人の成果は、アルゴリズムの指示に従う速さで決まると思われがちだ。この研究が示したのは、仲間とのつながりへの欲求が満たされているかどうかが、成果に直接は効かないのに、幸福感を経由してはっきり効くという二段構えの関係である。つまり「人間関係は仕事の役に立たない」ように見えても、心の状態を通して後から効いている。媒介を測らないと見えない効果があるという、設計上の教訓になっている。", "unverified": "間接効果（媒介）の個別の係数と信頼区間、測定モデルの収束妥当性・弁別妥当性の指標値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pr13", "rank": 13, "headline": "橋梁補助金は改善の傾きを変えなかった", "title": "Did the Bridge Formula Program Change the Trajectory of State Bridge Condition?&nbsp;An Annual Event-study Panel, 2017 to 2025", "url": "https://doi.org/10.2139/ssrn.7598418", "authors": "Gongkang Sinha", "venue": "SSRN", "date": "2026-10-12", "apa": "Sinha, G. (2026). Did the Bridge Formula Program Change the Trajectory of State Bridge Condition?&nbsp;An Annual Event-study Panel, 2017 to 2025. https://doi.org/10.2139/ssrn.7598418", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "p1": "米国の橋梁補助金の配分の濃さが、州ごとの橋梁状態の改善の傾きを変えたかどうかを、事前の傾向と区別して検定できるようになった（抄録）。", "p2": "先行研究は2021年以降の橋梁状態の改善が予測より速いことをインフラ投資・雇用法（IIJA）に帰しているが、資金データと照らした検証をしていない。前後比較だけでは、もともと改善していた州の傾きを法律の効果と誤認しうる（抄録）。", "p3": "入力はFHWA（連邦道路庁）の州別橋梁状態の件数と、2024会計年度の橋梁定式補助（BFP）の配分額。出力は「不良（Poor）」の割合の年次変化である。橋1本あたりの配分額が多い州と少ない州で、法律の前後に状態の軌跡が変わったかを、二方向固定効果とイベントスタディ、さらに傾きの折れを直接推定する定式化で比べる（抄録）。", "p4": "データは2017年から2025年までの9時点、51管轄、459州・年のパネルで、各列はFHWAの公表合計と完全に一致することを確認している。評価は、ワイルドクラスター・ブートストラップのp値と、クラスター頑健標準誤差による傾きの折れの区間推定で行う（抄録）。", "p5": "全国では不良の割合が2017年の7.73%から2021年半ばに7.01%（年0.21ポイント）、2025年半ばに6.65%（年0.09ポイント）へ下がり、51管轄のうち35で2021年以降の改善が遅くなった。二方向固定効果の前後比較では配分額に負の係数（1,000ドルあたり−0.0118ポイント、標準誤差0.0081、ブートストラップp=0.06）が出るが、イベントスタディの係数は高配分州が法律の前からすでに相対的に改善していたことを示す。傾きの折れの定式化では変化が見られない（1,000ドルあたり年−0.0004ポイント、クラスター頑健標準誤差0.0017、ブートストラップp=0.82）。折れの95%区間は約−0.004〜+0.003ポイント／年／1,000ドルで、配分額の1標準偏差の差に対して年0.1ポイントを超える折れは排除できる（抄録）。", "p6": "著者自身が、この設計は州間の配分の濃さの差だけを識別するため、法律の集計的な効果を支持も否定もしないと明記している。また、これより小さい効果は設計上検出できないとしている。良好（Good）の割合、不良件数の対数、下限適用州の指示変数、不良橋1本あたりの配分額でも結果は同様に決定的でない（抄録）。", "fun": "「法律ができてから橋の状態が良くなった」という話は、前後を比べれば簡単に言えてしまう。この論文はそこで立ち止まり、お金を多くもらった州と少ない州を比べ、さらに法律の前からの傾きを見る。すると高配分の州は法律の前からすでに改善が速く、法律の前後で傾きは変わっていなかった。しかも著者は「効果がない」とは言わず、「この設計では年0.1ポイントを超える変化なら否定できるが、それ以下は見えない」と検出限界まで示す。言えることの境界を明示する誠実さが印象に残る。", "unverified": "イベントスタディの各年の係数、良好割合など副次的な結果の具体値、BFP配分額の分布。本文が入手できず確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "事業承継M&Aが中小企業の取引網を変える", "title": "The Impact of Business Succession Mergers & Acquisitions on SME Survival, Scale, and Transaction Networks: Evidence from Japanese Firm Microdata", "url": "https://econpapers.repec.org/RePEc:hit:tdbcdp:e-2026-03", "authors": "HARA, Yasushi", "venue": "RePEc NEP", "date": "2026-10-12", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "一橋大学機関リポジトリのPDF本文を読んだ。データ（§3.1–3.2）、推定戦略（§4）、結果（§5.1–5.2、表3a）、結論（§6）を参照した", "preprint": true, "p1": "日本の中小企業で、事業承継としてのM&Aが存続・規模・取引ネットワークに何をもたらすかを、無条件の生存比較と条件付きハザードを区別して示せるようになった（§5.1、§6）。", "p2": "M&Aを経験した企業は平均的に規模が大きいが、それは選択の結果でもあり得る。無条件の生存曲線と条件付きハザードは別の問いに答えるのに混同されやすい。また取引先の数の増減だけでは、関係の喪失なのか戦略的な整理なのか区別できない（§2、§5.1）。", "p3": "入力は帝国データバンクのCOSMOSに由来する企業レベルのパネル（売上高、従業員数、取引先数、退出指標）で、建設・製造・小売・農業の4産業、1990〜2021年を覆う。出力は法人の消失（DEL）と倒産（TOSAN）のハザード、イベントスタディによる水準推定、取引先の入替わりの質である。時変のCox比例ハザードモデルでM&A・代表者交代・事業活動変更を同時に入れる（§4）。", "p4": "評価は3層。記述的なKaplan–Meier曲線で無条件の生存を見て、条件付きCoxでハザード比を推定し、さらに新規の取引先と打ち切られた取引先の資本規模・売上を比べる。農業のM&A回帰標本は278観測で、建設5,885、製造9,798、小売10,723と大きく異なる（§3.1、§5）。", "p5": "記述的なKaplan–Meier曲線には一律のM&A生存優位は現れず、倒産の対数順位検定はどの産業でも5%水準で等質性を棄却しない。一方、条件付きCoxでは4産業すべてでM&Aが低いハザードに結びつく。建設はDELのハザード比0.425、TOSANが0.210（57.5%、79.0%低い条件付きハザード）で、TOSANのハザード比は製造0.185、小売0.315、農業0.145。ただし農業はイベント0のセルがあり準完全分離の疑いがある。事業活動の変更は倒産ハザードを上げ、建設2.450、製造2.810、小売2.120、農業1.950（表3a）。建設では新規の顧客の資本規模と売上が打ち切られた取引先より有意に大きい（§6）。", "p6": "著者は、イベントスタディがコホート固有の水準推定であって単一の成長率を識別しないこと、事前の差や追跡期間の不均一さと農業の小標本により解釈が限られること、代表者交代が内部承継か外部承継かを識別しないこと、取引先数が記録された関係の数であって取引額や相手の質を表さないことを挙げる（§6）。", "fun": "「後継者がいないならM&Aで会社を残せばよい」と言われる。この論文がまず示すのは、生存曲線を素朴に比べてもM&Aに一律の延命効果は見えないという事実だ。ところが企業ごとの条件をそろえると、倒産の危険は産業によって8割以上も下がる。さらに興味深いのは取引先の変化で、建設業では取引先の数が減っても、新しく加わった相手は辞めた相手より資本も売上も大きい。数が減ることは必ずしも衰退ではなく、相手を選び直しているという読み替えができる。", "unverified": "表1（M&A経験別の平均）と表3b以降のイベントスタディ係数の個別の数値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pr15", "rank": 15, "headline": "同じ開示でも国名でESG採点が動く", "title": "Same Disclosure, Different Score: Country and Identity Sensitivity in AI ESG Ratings, with an Exploratory Nigeria Effect", "url": "https://doi.org/10.2139/ssrn.7592459", "authors": "Samuel Omolaiye", "venue": "SSRN", "date": "2026-10-12", "apa": "Omolaiye, S. (2026). Same Disclosure, Different Score: Country and Identity Sensitivity in AI ESG Ratings, with an Exploratory Nigeria Effect. https://doi.org/10.2139/ssrn.7592459", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "p1": "LLMがサステナビリティ開示を採点するとき、文面が同一でも企業の見かけの国籍によって点が動くかを、反実仮想監査で測れるようになった（抄録）。", "p2": "金融機関はESG開示の読み取りと採点にLLMを使い始めている。しかし同じ内容でも企業の属性情報によって判断が変わるのかは検証されていなかった（抄録）。", "p3": "実際のサステナビリティ報告書22件から57の抜粋を取り、社名・本社都市・上場取引所・法人格の接尾辞・国籍への言及という国を示す手がかりの束だけを差し替えた13版（匿名の対照、アフリカ6か国、西欧6か国）を作る。入力は同一内容で属性だけが異なる文章、出力は0〜100点のスコアである。4モデル（Qwen3-8B、Llama 3.1 8B、Mistral 7Bの4ビット公開モデルとGPT-5.4 nano）が全版を採点し、計13,338点を得る（抄録）。", "p4": "評価は、まずアフリカ版と西欧版のスコア差を主要な仮説として置き、次に匿名の対照との差、個別の国どうしの差を見る。有意性は95%信頼区間と、12か国にわたるファミリーワイズの並べ替え検定で判定する（抄録）。", "p5": "主要な結果は否定的で、全モデルをプールするとアフリカ版は西欧版より0〜100点の尺度で0.23点低いだけ（95%区間−0.60〜+0.14）であり、予備調査が示した広いアフリカ・ペナルティは再現しなかった。それでもスコアは属性に反応する。公開モデルは西欧2か国間（英国対フランス）で最大2.5点の差を出し、Llama 3.1 8Bは社名入りの版を匿名版より7.3点高く採点した。探索的な分析では、ナイジェリア版が4モデルのうち3つで12か国中最低となった（プール差−1.07点、95%区間−1.64〜−0.53、並べ替えp<0.001）。著者はこれが事前登録された比較でないため、独立した追試を要する仮説として扱うとしている。これらの効果はモデルが書いた採点理由には現れなかった（抄録）。", "p6": "著者は、ナイジェリアの結果が事前に特定した比較ではなく、同じ文章を採点させた設計であることを理由に、確定した知見ではなく仮説として提示している（抄録）。テストセットとコードを公開し、新しいモデルを同じ方法で監査できるようにすると述べる。", "fun": "同じ文章を読ませて、会社の名前と所在地だけを入れ替える。中身は一字も変えていないのに、AIの採点は動く。この研究で意外なのは、心配されていた「アフリカだから低く採点される」という大きな偏りは見つからなかった一方で、社名を入れただけで7点も高くなるモデルがあったこと。さらに効果はAIが書いた「採点の理由」には一切現れない。理由の文章が納得できるからといって、採点が内容だけを見ているとは限らないわけだ。", "unverified": "抜粋の選定基準、プロンプトの詳細、モデルごとの個別のスコア分布。本文が入手できず確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "流木を見つけて橋の監視を切り替える", "title": "Event-driven bridge SHM concept with AI-based flood debris detection", "url": "https://doi.org/10.1201/9781003778677-202", "authors": "Buka-Vaivade ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Buka Vaivade, K., Nicoletti, V., & Gara, F. (2026). Event-driven bridge SHM concept with AI-based flood debris detection. Moving toward Smart, Resilient and Sustainable Bridges, 1678–1685. https://doi.org/10.1201/9781003778677-202", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "pr17", "rank": 17, "headline": "複合劣化に対応するデジタルツイン構想", "title": "A Sensor-Integrated, Explainable Machine-Learning Digital-Twin Framework for Field-Validated Service-Life Prediction of Cementitious Materials under Coupled Chloride–Sulfate Carbonation Degradation", "url": "https://doi.org/10.21203/rs.3.rs-11026995/v1", "authors": "Devesh Ojha ほか", "venue": "Research Square (In Review)", "dat  "rank": 1, "field": "因果推論", "headline": "複雑な割付でも標準誤差は単純にできる", "title": "Simple Standard Errors for Complicated (Quasi-)Experimental Designs", "url": "https://arxiv.org/abs/2610.12674", "authors": "Sylvia Klosin ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Klosin, S., & Roth, J. (2026). Simple Standard Errors for Complicated (Quasi-)Experimental Designs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12674", "why": "波及や空間相関で処理の割付が複雑に依存する設計に対し、Neyman分散推定量の性質を一般の設計へ拡張した分散推定量を与えた。完全ランダム化ではNeyman型、クラスター化ではクラスター頑健型に帰着し、二次形式の分散推定量の中で許容的であることも示す。実例で既存法の2〜3分の1の長さの標準誤差が得られた。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。設定（§2）、推定量と性質（§3、命題3.1）、他の推定量との比較（§4）、シミュレーションと適用（§7、表1・表3）、結論（§8）を参照した", "preprint": true, "p1": "波及や空間相関で処理の割付が複雑に依存する設計でも、完全ランダム化のNeyman分散推定量の性質を受け継ぐ標準誤差を計算できるようになった（§3、§8）。", "p2": "割付の仕組みが分かっていても、ある単位の潜在結果どうしが同時に観測できないと分散に入る積の項が推定できない。従来は設計ごとに最適化問題を解く必要があり、計算も重かった（§1、§4）。", "p3": "着想は「同時に観測できない潜在結果」をグラフにすることである。潜在結果kとk'が同時に観測される確率π_kk'が0のとき辺を張ったグラフを作り、その連結成分で添字を分割する。成分が同じなら s=1、違えば s=−1/(C−1) と重みを調整し、π>0の組だけを足し上げて分散推定量 V_CC を作る（§3）。命題3.1によれば E[V_CC] = Var(τ̂) + (C/K²)Var_c(τ_c) で、上側のずれは成分ごとの処理効果の和のばらつきに比例し、効果が一様なら不偏になる。完全ランダム化ではNeyman推定量、クラスターランダム化ではクラスター頑健推定量に一致する（§4）。", "p4": "評価は実証に基づくシミュレーションと実データ適用。Paluck et al. (2016) の学校ネットワーク実験で2つの対比について、Aronow–Samii推定量とHarshaw et al. (2026) の2つの推定量と比べる。指標は偏り、精度、名目95%区間の被覆率、区間幅、計算時間である（§7.1）。", "p5": "表1・2では、鋭い帰無を課したパネルA・Bで提案推定量の比例偏りはVar(τ̂)の1%未満、異質性の大きい混合パネルCで64%と16%の上方偏り。被覆率は全設定で名目95%に対し93.5%以上で、偏りと区間幅はすべての設計で最小。Aronow–Samii推定量に対する区間幅の比は44〜84%。計算時間は最適化型が直接効果で31時間と2時間を要したのに対し提案法は1秒未満。実データ（表3）では直接対間接の対比でt値が2.4（トレース1.97、複合1.6）になり、空間処理の設定では標準誤差が約3分の1になった（§7.2）。", "p6": "著者は、二次形式の分散推定量に限ること、曝露が離散の場合に絞ること、正規近似の信頼区間を正当化する中心極限定理がこの設定のすべてでは得られていないこと、曝露写像が正しく特定されていると仮定することを限界に挙げる（§8）。", "fun": "実験で「効果があった」と言うには、推定値と一緒に誤差の幅が必要だ。ところが隣の人の処理が自分に影響する実験では、誰と誰の結果を同時に見られないかが複雑に絡み合い、誤差の計算が難しくなる。この論文の発想は、同時に観測できない組を線でつないだ地図を描き、その「島」ごとに重みを割り振るというもの。効果が島ごとに揃っていれば誤差の見積りはぴったりで、ばらつくほど安全側に外れる。計算は31時間から1秒未満になり、誤差の幅は3分の1まで縮んだ。", "unverified": "表1・表2の提案推定量の行の数値（偏り・精度・被覆率・幅の具体値）は本文の表が機械可読に崩れており、文章中で言及された値のみ引用した。"}}, {"id": "pn02", "rank": 2, "field": "機械学習（Hugging Face）", "headline": "マルチモーダルLLMの中に空間の作業場がある", "title": "S-Space: Exploring Spatial Workspace in Multimodal Language Models", "url": "https://arxiv.org/abs/2610.13527", "authors": "Zhiyuan Shi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Shi, Z., Li, X., Guo, X., Miao, S., Chen, W., Dai, Q., Ren, J., Lyu, J., Liu, F., Long, M., & Wu, J. (2026). S-Space: Exploring Spatial Workspace in Multimodal Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13527", "why": "物体トークンの表現が水平・垂直・奥行きの連続座標を線形部分空間に符号化していることを見つけ、介入でその空間だけを操作すると空間判断だけが変わると示した。知覚は位置をここに書き込み、推論は視点変換のために変形するという役割分担まで記述し、視点変化に弱い原因を知覚と計算に分解した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。定式化（§2.1–2.3）、内部作業場としての検証（§3.1–3.3）、創発の事例（§4）、失敗の診断（§5.1–5.3、表1）、考察（§6）を参照した", "preprint": true, "p1": "マルチモーダル言語モデルの内部に、物体の位置を水平・垂直・奥行きの連続座標として符号化する3次元の線形部分空間があることを見つけ、読み出し・書き換え・診断の道具にできるようになった（§2.1、§5）。", "p2": "マルチモーダルモデルは空間推論ができそうに見えるが、内部機構は分かっていなかった。失敗したときに、位置を知覚できていないのか、知覚した位置を変換する計算ができていないのかを切り分ける手段もなかった（§1、§5.1）。", "p3": "概念が内部表現で線形に符号化されるという仮説を空間座標に広げ、物体名トークンの隠れ表現に観察者中心の座標が線形に入っていると考える。相対的な空間を問う質問への応答を物体トークンの活性で微分して3つの軸（水平・垂直・奥行き）を特定し、中間層に3次元の線形部分空間（S-Space）を定義する（§2.1–2.2）。読み出しは隠れ表現をこの部分空間に射影するだけでよい（§2.3）。", "p4": "検証は3段構え。(1)正確さ：読み出した座標と真の位置の相関、および座標だけで空間関係に答えた正解率をモデルの言語応答と比べる。(2)因果性：座標を編集して書き戻し、空間判断が変わるか色の判断が保たれるかを見る。(3)持続性：プロンプトを非空間の質問に替えても座標が使えるかを見る。評価は3つのベンチマークで行う（§3.1–3.3）。", "p5": "座標の読み出しは個々の物体の座標と対の座標差の両方で真値と強く相関し、座標だけの読み出しがモデルの言語応答と同等の正解率に達する（図3）。座標の編集は空間判断を大きく変える一方、色の判断にはほとんど影響しない（図4）。視点変換（SpinBench）では知覚と計算を分けて座標に明示的な回転を施すと大きく改善し、表1では前提なしでMolmo2-ERが60.96%→94.52%（+33.56ポイント）、Qwen3.5-4Bが60.96%→91.10%（+30.14）、Qwen3.6-27Bが60.96%→95.21%（+34.25）で、思考連鎖による改善（+22.60）を上回る（§5.1）。", "p6": "著者は、水平・垂直の軸に画像平面の座標を使い奥行き依存の遠近効果を分離していないこと、参照枠が固定ではなく文脈で動きうることを述べる。また事前学習から受け継いだ偏りが見つかったとし、単一のモデルに全ての空間操作を担わせる必要はなく専用道具をつなぐ方向を示唆する（§2.2、§6）。", "fun": "AIの中をのぞくと、物の位置が「左から何番目」といった言葉ではなく、横・縦・奥行きの数値として、しかも足し算のできる形で入っていた。その数値を書き換えると空間の答えだけが変わり、色の答えは変わらない。つまり本当にそこを使っている。さらに面白いのは、視点を変える問題で正解率が6割しかないモデルでも、位置の読み取り自体は正しく、取り出した座標を外から回転させてやると9割以上になること。見えていないのではなく、頭の中で回せないのだった。", "unverified": "表4〜10（答えの向きごとの正解率や層ごとの介入結果）の個別の数値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "RCTは制度的な差別をどこまで測れるか", "title": "What Can (and Cannot) Be Learned about Systemic Racial Discrimination from Randomized Controlled Trials?", "url": "https://doi.org/10.3386/w35882", "authors": "Dania V. Francis ほか", "venue": "NBER Working Paper", "apa": "Francis, D. V., Gillezeau, R., Jones, D., & Viceisza, A. C. G. (2026). What Can (and Cannot) Be Learned about Systemic Racial Discrimination from Randomized Controlled Trials? (NBER Working Paper No. 35882). National Bureau of Economic Research. https://www.nber.org/papers/w35882", "why": "直接的な差別の検出に大きな役割を果たしてきたランダム化比較試験が、制度に埋め込まれた差別に対して同じ役割を果たせるかを7つの切り口で検討した。大規模な操作の実現可能性、顕在性の操作、情報の役割などを整理し、RCTが埋められない部分を他の手法が補う必要を論じている。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を読んだ", "preprint": true, "p1": "ランダム化比較試験（RCT）が制度に埋め込まれた人種差別の解明にどこまで使えるかを、7つの切り口に分けて検討できるようになった（抄録）。", "p2": "RCTは、採用の書類審査のような直接的な差別の検出に大きな役割を果たしてきた。しかし制度的な人種差別は、個々の判断の集まりではなく制度の構造に埋め込まれているため、同じ道具が同じように使えるとは限らない（抄録）。", "p3": "抄録によれば、先行する制度的人種差別の定義をもとに概念モデルを立て、そのうえでRCTの可能性と限界を7つの切り口で検討する。(1)制度的な人種差別を大規模に操作する実現可能性、(2)より小規模な接近、(3)異なる構造的な環境にまたがるRCTの実施、(4)制度的な力の顕在性の操作、(5)差別を減らすうえでの情報の役割、(6)人種的アイデンティティの顕在性の操作、(7)制度的な人種差別への戦略的な反応の検討、である（抄録）。", "p4": "これはエッセイであり、新しいデータによる検証ではない。評価は、各切り口についてRCTで識別できる対象と識別できない対象を区別するという、概念的な整理によって行われる（抄録）。", "p5": "抄録は結果として、7つの切り口それぞれにRCTが寄与できる余地があることと、限界が残ることを示し、RCTが埋められない空白を他の手法で補う必要があると述べる。切り口ごとの具体的な結論は抄録に示されていないため未確認。", "p6": "著者自身が、RCTには限界があり、他の接近法が残された空白を埋めうると明記している（抄録）。どの手法がどの空白を埋めるかの具体は、抄録の範囲では確認できなかった。", "fun": "「同じ履歴書で名前だけ変えて送る」実験は、採用での差別をはっきり示してきた。では、特定の地域に学校の予算が回らない、そこに住む人の家の価値が上がらない、といった制度に組み込まれた差別はどう測ればよいのか。ひとつの判断を入れ替えることはできても、制度そのものをくじ引きで変えることはできない。この論文は、実験という最強の道具が届かない場所を7つに分けて丁寧に並べていく。道具の限界を知ることも研究の仕事だと分かる。", "unverified": "概念モデルの具体的な定式化、7つの切り口それぞれについての結論。本文が入手できず確認できなかった。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "要約統計量の学習に有限標本の保証を付ける", "title": "Neural Estimation of Summary Statistics for Simulation-Based Inference with Non-Asymptotic Guarantees", "url": "https://arxiv.org/abs/2610.13031", "authors": "Rui Li ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Li, R., & Tang, R. (2026). Neural Estimation of Summary Statistics for Simulation-Based Inference with Non-Asymptotic Guarantees (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13031", "why": "尤度が扱えないシミュレーションベース推論で、要約統計量と事後推定器を同時に学習する枠組みを与え、ノンパラメトリック条件付き分布推定の観点から有限標本挙動を解析した。低次元の要約が次元の呪いをどう緩和するかを具体例で示し、観測ごとの局所的な微調整で償却誤差を縮める手続きも加えた。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。主要な貢献（§1.1）、枠組みと損失（§2–2.1）、局所的な微調整（§2.2）、数値実験（§4.1–4.3）、考察（§5）を参照した", "preprint": true, "p1": "尤度が扱えないシミュレーションベース推論で、要約統計量と事後推定器を同時に学習する枠組みを作り、有限標本の保証を与えた（§1.1）。", "p2": "シミュレーションベース推論（SBI）では観測の次元が上がると性能が急落するため、情報量の多い低次元の要約統計量が要になる。しかし既存研究の大半は推論ネットワーク側に集中し、要約の学習には有限標本の保証が与えられていなかった（§1.1、§5）。", "p3": "着想は、全データの事後分布と要約で条件づけた事後分布の食い違いを最小化するように符号器S(·)を学ぶことである。食い違いはKLダイバージェンス、最大平均差異（MMD）、スライス版MMDから選べる。推定できるよう補助的な復号器W(·)を同時に学習する（§2.1）。MMD系の目的は推論ネットワークの標本から直接推定できるため、密度が計算できない暗黙的な生成器でもよい。さらに償却誤差を縮める局所的な微調整を2つ用意する（§2.2）。", "p4": "理論は条件付き分布推定の観点からオラクル不等式を立て、十分統計量が存在する指数型分布族と、n→∞でBernstein–von Mises定理により近似的に十分な統計量を構成できる滑らかな密度の2つに適用する。数値実験は、多峰の事後分布を持つ例、学習予算が小さいSIRモデル、曖昧な事前分布のLotka–Volterraモデルで、校正・偏り・被覆率・計算時間を評価する（§1.1、§4）。", "p5": "理論の要点は、低次元の要約を通すことで条件付き分布推定の次元の呪いを避けられることで、期待MMDで測った目標精度（たとえば1/n）を得るのに必要なNはnに対して多項式的にしか増えない（§1.1）。SIRモデル（n=10から80、N=768）では微調整が偏りを下げ被覆率を名目に近づけるが、微調整後は保守的で過被覆の傾向があり、有限のABC許容幅による平滑化が原因と推測される（§4.2）。Lotka–Volterraでは同じ予算のもとRefine+が低い偏りを達成しSNPE-Cより速く、スライスMMDが最小の校正誤差を得た（§4.3）。", "p6": "著者は、大標本の系が i.i.d. データについて述べられていること、局所的な微調整の対象をABC事後分布に限ること、代替のベイズ合成尤度は要約がパラメータ条件付きで近似的にガウスである必要があり現在の目的関数はそれを保証しないことを挙げる（§5）。", "fun": "シミュレーションはできるが確率の計算式が書けないモデルは科学に多い。そこでデータを少数の「要約」に潰してから推論するのだが、どんな要約がよいかは職人技だった。この研究は要約そのものを学習し、しかも「データの点数が増えても必要な計算量は爆発しない」ことを証明した。面白いのは、学習予算が足りず全体の推論がうまくいかない場合でも、学習された要約だけは役に立つという結果。地図を描く力と、地図を読む力は別々に身につくらしい。", "unverified": "表1〜3の個別の数値（偏り・被覆率・校正誤差の具体値）は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "日銀のETF買いは金利次第で効き方が変わる", "title": "The Impact of Central Bank Stock Purchases: Evidence from Discontinuities in Policy Rules", "url": "https://doi.org/10.3386/w35886", "authors": "Masao Fukui ほか", "venue": "NBER Working Paper", "apa": "Fukui, M., & Yagasaki, M. (2026). The Impact of Central Bank Stock Purchases: Evidence from Discontinuities in Policy Rules (NBER Working Paper No. 35886). National Bureau of Economic Research. https://www.nber.org/papers/w35886", "why": "株価指数の動きが閾値を下回ると買入れが発動するという日銀の政策ルールの不連続性を使って識別した。平常時は長期金利が上がる一方で株価には検出可能な効果がなく、イールドカーブ・コントロール導入後は金利が反応せず株価が頑健に上がる。需給が価格を決めるという元の仮説とは整合しないと結論している。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を主に読んだ。原文ファイルにはSemantic Scholar由来の別版の抄録も入っており、数値はそちらにのみ含まれる", "preprint": true, "p1": "中央銀行による株式の買入れが長期金利と株価に何をするかを、政策ルールの不連続性を使って識別できるようになった（抄録）。", "p2": "中央銀行が株式を買うと価格が上がるのかは、需給だけで価格が決まる（市場が非弾力的）という仮説の検証そのものだが、買入れは市場が下がったときに行われるため、素朴な相関では因果が取れない（抄録）。", "p3": "識別の鍵は、日本銀行の政策ルールが株価指数の動きが閾値を下回ったときに買入れを発動するという点である。閾値のすぐ上と下を比べれば、市場環境がほぼ同じで買入れの有無だけが変わる。出力は長期金利と株価の反応である（抄録）。", "p4": "比較の軸は時期で、平常時と、長期金利を0%に固定するイールドカーブ・コントロール（YCC）導入後に分ける。YCC下では金利が動けないため、同じ買入れの効果が別の経路に現れるかどうかが検証できるという設計である（抄録）。", "p5": "NBERの抄録によれば、平常時は買入れによって長期金利が上がる一方、株価には検出可能な効果が見られない。YCC導入後は金利が反応しなくなり、株価が頑健に上がる。原文ファイルに入っていた別版の抄録は、時価総額の0.01%の買入れが長期金利を持続的に1.5ベーシスポイント上げ、YCC下では株価が0.22%上がるという数値を挙げている。", "p6": "NBERの抄録は、これらの結果が元の形の非弾力的市場仮説とは整合しないとし、内生的な金利を含む一般均衡への拡張が説明を与えると述べる。一方で別版の抄録は株式と債券の両市場が実質的に非弾力的だという理論を支持すると述べており、版によって結論の言い方が異なる。どちらが最終版かは抄録の範囲では確認できなかった。", "fun": "中央銀行が株を買えば株価は上がりそうに思える。ところが日本銀行の買入れを、発動の閾値のすぐ上と下で比べると、平常時には株価がほとんど動かず、代わりに長期金利が上がった。お金が株に向かうぶん債券から抜けるので、金利が動いて効果が逃げていたらしい。そして金利を0%に固定した時期には金利が動けなくなり、そのとき初めて株価が上がる。逃げ道をふさぐと効果が現れるという、実験のような構図になっている。", "unverified": "NBERの抄録と原文ファイルに併載された別版の抄録で結論の述べ方が異なり、どちらが最終版か確認できなかった。数値（1.5ベーシスポイント、0.22%）は別版の抄録にのみ含まれる。標本期間と買入れの件数、推定手法の詳細は本文が入手できず確認できなかった。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "低技能の子に早期投資が雪だるま式に効く", "title": "Early Investment Snowballs for Low-Skill Children: Average Marginal Returns and the Dynamics of Skill Formation", "url": "https://arxiv.org/abs/2610.12509", "authors": "Liam Puknys", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Puknys, L. (2026). Early Investment Snowballs for Low-Skill Children: Average Marginal Returns and the Dynamics of Skill Formation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12509", "why": "プログラム評価が低技能の子への投資で大きな効果を見出す一方、構造モデルは技能と投資が補完的だと推定してきた。この食い違いが別の量を測っているだけだと整理し、技能と投資は補完的でも低技能の子には投資が極端に少ないため幼児期の平均限界収益が高くなる、そしてそれが後の年齢で逆転すると示した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。枠組み（§2.1–2.4）、データ（§3.1–3.2）、実証モデル（§4）、結果と考察（§6.1、表4）、結論（§8）を参照した", "preprint": true, "p1": "低技能の子に投資するほど収益が大きいという実験の知見と、技能と投資が補完的だという構造モデルの知見が矛盾しない理由を、2つの異なる量の区別として説明できるようになった（§2.3）。", "p2": "プログラム評価は低技能・不利な立場の子で効果が大きいと繰り返し見出すのに、技能形成の構造モデルは技能と投資が補完的だと推定してきた。この食い違いが長く残っていた（§1）。", "p3": "区別の核は2つの量である。Beckerian収益表（BSR）は、他の投入を固定したうえでの産出の投入に対する弾性値。平均限界収益（AMR）は、その弾性値を投入の同時分布の上で平均した値である。補完性はBSRの性質だが、現実には低技能の子が受ける投資が極端に少ないため、その位置での弾性値が大きくなり、平均するとAMRが高技能の子より大きくなりうる。本文は、交互作用項を含む対数線形モデルが両者を混同してどちらも正確に推定しないと示す（§2.1–2.4）。", "p4": "データはNLSY79の子ども世代を追うCNLSY（1986年から2020年まで隔年）。認知技能はPIATの数学・語彙・読解、非認知技能はBPIの下位尺度、親の投資はHOME目録の項目（蔵書数、読み聞かせの頻度、習い事など）で代理する。離散の代理変数が多いため順序プロビットの測定系を用いる。母の認知技能はASVAB、非認知技能はRosenberg自尊感情尺度で代理する（§3）。", "p5": "表4は各投入の平均限界収益（AMR）を期間別に報告する。主要な結果は、両方の技能生産関数のすべての期間で投入が強い補完（ρ<0）であり Cunha et al. (2010) と整合すること、そして低技能の子のAMRが幼児期では高く学齢期以降に逆転することである（§6.1）。方法面では、離散の代理変数を連続として扱うとAMRの推定に偏りが生じ、幼児期の逆転を検出できなくなる。また母の恒常所得を統制すると現在の世帯所得は親の投資を予測しない（§8）。", "p6": "著者は、弾性値が維持された関数形のもとでの記述にすぎず投資の因果効果とは解釈できないこと、推定された弾性値が小さく相関の高い親の投資と親の技能の影響を一貫して区別できないこと、幼児期にのみAMRが技能と逆向きになる理由を検証していないこと、CNLSYの学校の質の情報が乏しいことを挙げる（§6.1、§8）。", "fun": "「恵まれない子に投資するほど効果が大きい」と「投資は能力の高い子にこそ効く」は、正反対に聞こえる。この論文は、2つが違う問いに答えていると整理した。前者は実際の投資の配られ方を含めた平均、後者は条件を固定したときの効き目である。少ししか投資されていない子は、1単位増やしたときの伸びが大きい。収穫逓減という当たり前の性質が、平均の取り方しだいで結論を反転させる。数式の中では両立していた話である。", "unverified": "表4の個別の弾性値（期間別・投入別）は、本文の表が機械可読に崩れており読み取れなかったため引用していない。幼児期の逆転が現れる具体的な年齢区分も確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "ニューロン単位で見ないと見えない部品構造", "title": "Neural networks are more modular than single neurons suggest", "url": "https://arxiv.org/abs/2610.12842", "authors": "Shreya Saha ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Saha, S., Bergen, B., & Khosla, M. (2026). Neural networks are more modular than single neurons suggest (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12842", "why": "個々のニューロンが複数の機能に関わることを理由にニューラルネットは部品構造を持たないとされてきた。ユニット単位・直交・線形という入れ子の階層を定義し、選択的な破壊で因果的に評価すると、ユニット単位では部品的でない網でも部分空間のレベルでは明確に分離すると示した。視覚では内容と様式、言語では統語と意味が分離する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。分解の階層（§2.1）、学習目的と評価（§2.2–2.3）、結果（§3.1–3.4、図2・図8）、考察と限界（§4）を参照した", "preprint": true, "p1": "個々のニューロンが複数の機能に関わる網でも、部分空間の水準では機能が明確に分離していることを、因果的な破壊実験で確かめられるようになった（§2.1、§3.1）。", "p2": "ニューラルネットでは1つのニューロンが複数の役割を担うため、網は部品構造（モジュール性）を持たないと広く考えられてきた。しかしそれはニューロンという座標軸に沿って見たときの話にすぎない（§1、§4）。", "p3": "着想は、モジュール性を入れ子の3段階として定義することである。層の表現h(x)に線形変換Qをかけ、z = Qh(x) を機能Aの部分空間、機能Bの部分空間、残差の3ブロックに分ける（式1）。Qに許す自由度で段階を作り、置換（座標の並べ替えのみ）、直交（剛体回転）、可逆（条件数に上限を置いた可逆行列）の順で制約が弱くなる。分離が成功する最も厳しい段階が、計算の幾何的な組織を教える。残差ブロックは必須で、捨てると圧縮と分解が混ざる（§2.1）。", "p4": "評価は選択的な破壊（ablation）による因果的な検証で、二重乖離指数（DDI）で測る。対象は、11の認知課題で学習した多課題RNN（Yang et al., 2019。計算要件を共有しないAnti課題とDM1課題の対）、視覚モデルの内容と様式の分離（同じ内容99枚・同じ様式99枚が必ず存在する検証集合で評価）、言語モデルの統語と意味の分離の3種である（§2.3、§3.1–3.3）。", "p5": "図2が中心の結果で、softplus活性の多課題RNNはどの段階でも選択的な破壊効果が出る（DDI 0.59〜0.73）。tanh活性の網はユニット水準のDDIが0.00、つまりニューロン単位では完全にモジュール性がないのに、直交で0.37、線形で0.47となり、ユニット水準では見えないモジュール性を回復する。視覚では内容と様式、言語では統語と意味が、ニューロン集団を共有したまま部分空間の破壊で乖離した。脳データでは初期視覚領野（V1、V2）は様式の部分空間、高次領野は内容の部分空間でよく予測される（図8B）。", "p6": "著者は、分解の学習が非凸最適化でハイパーパラメータに敏感なこと、視覚と言語では部分空間の質を検索ベースの選択性で評価しており行動的な評価で補うべきことを限界に挙げる。残差部分空間が課題に関わる情報を含むが共有・冗長な形で入っており選択的でないことも未解明としている（§4）。", "fun": "「1つのニューロンがいくつもの仕事を兼ねているから、脳や人工神経網に部品の区切りはない」と言われてきた。この研究は、見る向きを変えればよいと示す。ニューロンという軸ではなく、それらを混ぜた別の軸の組（部分空間）で切ると、きれいに機能が分かれる。実際、ニューロン単位では分離度0.00の網が、回転してみると0.47になった。さらにその分かれ目が脳の階層とも対応し、画風に反応する部分は初期視覚、意味に反応する部分は高次領野をよく予測する。", "unverified": "§3.2・§3.3の検索選択性の個別の数値（内容指標CM、様式指標SM、Top-k選択性）は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn08", "rank": 8, "field": "経営学", "headline": "戦略的補完性が総体の持続性を決める", "title": "Strategic Complementarity and Persistence in Linear-Quadratic Mean Field Games", "url": "https://doi.org/10.3386/w35892", "authors": "Fernando E. Alvarez ほか", "venue": "NBER Working Paper", "apa": "Alvarez, F. E., & Argente, D. (2026). Strategic Complementarity and Persistence in Linear-Quadratic Mean Field Games (NBER Working Paper No. 35892). National Bureau of Economic Research. https://www.nber.org/papers/w35892", "why": "線形二次の平均場ゲームで、均衡の総体動学が戦略的相互作用に応じて曲率を調整した単一主体の制御問題と一致することを示した。状態の補完性が強いほど持続性が増し、行動の補完性が強いほど減るという条件を、同時対角化できない多次元の場合まで与えている。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を読んだ", "preprint": true, "p1": "多数の主体が互いの状態と行動を見ながら動く線形二次の平均場ゲームで、総体の動きが「相互作用で曲率を補正した単一主体の制御問題」と一致すると示せるようになった（抄録）。", "p2": "戦略的補完性（他者が増やすほど自分も増やしたくなる関係）が、集計された量の持続性にどう効くかは、多次元で行列が同時対角化できない場合には扱いが難しかった（抄録）。", "p3": "枠組みは線形二次の平均場ゲームで、状態（資本などの蓄積）と行動（価格設定などの選択）の両方に相互作用を入れる。核になる結果は、均衡の総体動学が、状態と行動の曲率を戦略的相互作用のぶんだけ補正した単一主体の線形二次制御問題の動学と一致するというものである。これにより均衡の存在条件と一意性が得られ、相互作用と総体の調整速度が結びつく（抄録）。", "p4": "枠組みは資本蓄積と複数財の価格設定というマクロの標準的な問題の局所近似を与えると位置づけられる。評価は、持続性が相互作用の強さとともにどちらに動くかという符号条件の導出と、功利主義的な社会計画者の配分との比較によって行われる（抄録）。", "p5": "抄録の報告では、状態の補完性が強いほど持続性が増し、行動の補完性が強いほど持続性が減る条件が、行列が同時対角化できない多次元の問題でも得られる。この条件のもとで、状態の補完性を内部化すると計画者の配分はより持続的になり、行動の補完性を内部化するとより持続性が下がる。さらに共通ショックがある場合に、個別の動学と総体の動学を組み合わせて相互作用とモデルのパラメータを識別できる条件も与えられる。最後に、状態分布の高次モーメントを通じた相互作用に拡張される（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。線形二次という関数形と局所近似に依存するため、大きなショックや非線形性が本質的な場合にどこまで使えるかは残る疑問である。", "fun": "大勢の企業が「他社が値上げするなら自分も」と考えると、経済全体の動きは一社の問題より複雑になりそうだ。この論文が示すのは、ある形の問題なら、全体の動きは「他者の影響のぶんだけ目的関数の曲がり方を書き換えた一社の問題」とぴったり同じになるということ。しかも状態を通じた影響は変化を長引かせ、行動を通じた影響は短くするという向きの違いまで分かる。多数の相互作用が一人の問題に畳み込めるのは、ちょっと驚く。", "unverified": "均衡の存在・一意性の具体的な条件、持続性の符号条件の数式、識別に必要な観測量。本文が入手できず確認できなかった。"}}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "情報の多様性が新しさへの支持を減らす", "title": "Bias Against Novelty in Teams: How Informational Diversity Amplifies Uncertainty and Reduces Support for Novelty", "url": "https://doi.org/10.2139/ssrn.7602103", "authors": "Wen-Xin Xie ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Xie, W.-X., Zhang, H., Annath, P., Harvey, S. R., & Bottom, W. P. (2026). Bias Against Novelty in Teams: How Informational Diversity Amplifies Uncertainty and Reduces Support for Novelty. https://doi.org/10.2139/ssrn.7602103", "why": "多様な情報を持つチームはアイデア生成に強いとされてきたが、評価の段になると新規なアイデアほど不確実性が増幅され支持が下がると予測した。経験ある投資家282名と実際に相互作用する231チームの事前登録実験で確認し、効果が新規なアイデアに限られることも示した。多様性の負の側面を評価段階に特定している。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ。抄録に標本数と設計が詳しく含まれている", "preprint": true, "p1": "情報の多様なチームでは、新規なアイデアほど不確実性が増幅されて支持が下がるという、チーム水準の新規性バイアスの源を特定できるようになった（抄録）。", "p2": "新規なアイデアが拒まれる理由は、成功するかどうかの不確実性に求められてきた。一方、情報の多様性はアイデアの生成に役立つとして長く評価されてきたが、評価の場面での作用は検討されていなかった（抄録）。", "p3": "着想は、不確実性の源をアイデア自体ではなくアイデアが評価される場に求めることである。多様な情報は、より広い範囲の懸念と評価の観点をチームにもたらす。新規なアイデアには確立した参照点や共有された判断基準が乏しいため、それらの観点を調整できず、知覚される不確実性が増し、支持が下がる（抄録）。入力は情報の多様性とアイデアの新規性、出力は知覚される不確実性とアイデアへの支持である。", "p4": "検証は2つの事前登録された実験。研究1は新規な製品を評価する経験ある投資家282名、研究2は実際に相互作用するチーム231組がアイデアを選ぶ場面である。研究2では新規性の低いアイデアも用意され、効果が新規なアイデアに特異かどうかを検証できる設計になっている（抄録）。", "p5": "抄録の報告では、両実験で情報の多様性が新規なアイデアについて知覚される不確実性を増幅し、それが支持を下げた。研究2ではこの効果が新規なアイデアに限られ、新規性の低いアイデアでは現れなかった。知覚される不確実性が媒介であることが示されている（抄録）。個別の係数や効果量は抄録に示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。実験室と投資家の評価課題という設定で、実務のチームが長期にわたって新規なアイデアを扱う場面に当てはまるかは残る疑問である。", "fun": "「いろいろな専門の人が集まったチームのほうが新しい発想が出る」とよく言われる。この研究が示したのは、その同じ多様性が、出てきた新しい案を選ぶ段では足を引っぱるということだ。多様な人は多様な心配をするので、前例のない案には判断の基準が足りず、不確実に見えてしまう。しかも新規性の低い案ではこの現象が起きない。アイデアを出す場面と選ぶ場面で、同じ条件が逆に働く。会議の設計を考え直したくなる結果である。", "unverified": "媒介分析の係数と効果量、情報の多様性の操作方法、研究2のチーム構成。本文が入手できず確認できなかった。"}}, {"id": "pn10", "rank": 10, "field": "教育", "headline": "アファーマティブ・アクションは誰を押し出すか", "title": "Affirmative Action in Centralized College Admissions Systems", "url": "https://doi.org/10.3386/w35893", "authors": "Nano Barahona ほか", "venue": "NBER Working Paper", "apa": "Barahona, N., Dobbin, C., & Otero, S. (2026). Affirmative Action in Centralized College Admissions Systems (NBER Working Paper No. 35893). National Bureau of Economic Research. https://www.nber.org/papers/w35893", "why": "ブラジルで連邦の全高等教育機関に定員の半分を留保させた大規模政策を、合格ラインの不連続性と学位選択モデルの両方で評価した。恩恵を受けた学生の卒業増は押し出された学生の損失の約2倍だが、均衡の再配置で恩恵より約3割多い学生が押し出され、非対象学生の損失が恩恵の約3分の2を打ち消す。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を読んだ。抄録に主要な数値が含まれている", "preprint": true, "p1": "大学入試のアファーマティブ・アクションについて、直接に恩恵を受けた学生と押し出された学生の効果と、再配置を含む政策全体の効果を分けて評価できるようになった（抄録）。", "p2": "合格ラインの不連続性を使えば、ぎりぎりで恩恵を受けた学生とぎりぎりで押し出された学生の効果は測れる。しかし政策全体の効果には均衡の再配置が含まれる。恩恵を受けた学生が空けた席は別の誰かが埋め、押し出された学生は他校の席を取り、その先でまた誰かを押し出す（抄録）。", "p3": "実証の枠組みを2段に分ける。第1段は合格ラインの不連続性を使い、ぎりぎりの学生についての効果を推定する。第2段は学位選択と潜在結果のモデルを推定し、再配置の連鎖を含む全体の効果を評価する（抄録）。出力は進学先の質と卒業である。", "p4": "対象はブラジルの大規模な政策で、すべての連邦立の高等教育機関に、人種的・社会経済的に不利な出願者のために定員の半分を留保させたものである。評価は、恩恵を受けた学生の利得と押し出された学生の損失の比、押し出された学生と恩恵を受けた学生の人数の比、そして全学生にわたる純効果で行う（抄録）。", "p5": "抄録の報告では、ぎりぎりで恩恵を受けた対象学生はより質の高い課程に進学し卒業する。その卒業の利得は、ぎりぎりで押し出された非対象学生の損失の約2倍で、これは対象学生の外部選択肢が弱いことを反映する。再配置された全学生でみても恩恵を受けた学生の利得は押し出された学生の損失の約2倍だが、均衡の再配置によって政策が押し出す学生は恩恵を受ける学生より約30%多くなる。結果として非対象学生の損失が対象学生の卒業の利得の約3分の2を打ち消し、全学生にわたる純利得は小さいものにとどまる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。第2段が学位選択と潜在結果のモデルに依存するため、モデルの定式化への感度は残る疑問である。", "fun": "入試の定員の半分を不利な立場の出願者に留保する。ぎりぎりで入れた人の得は、ぎりぎりで落ちた人の損の2倍だった。ここで話が終われば単純に良い政策である。ところが席には連鎖がある。入れた人が空けた席に別の人が入り、落ちた人が他の大学で誰かを押し出す。数えてみると、得をした人より3割多い人が押し出されていた。1人あたりの得は大きいのに、人数が多いせいで全体の純益は小さい。個人の効果と全体の効果が違うという教科書的な話が、実際の数字で現れている。", "unverified": "標本期間と規模、学位選択モデルの定式化、推定された効果の信頼区間。本文が入手できず確認できなかった。"}}, {"id": "pn11", "rank": 11, "field": "機械学習（Hugging Face）", "headline": "拡散モデルの強化学習を12倍速くする", "title": "DiffusionART: Efficient, Stable and Scalable Reinforcement of Diffusion Models", "url": "https://arxiv.org/abs/2610.12572", "authors": "Zhenglin Wan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Wan, Z., Chen, J., Zhang, Z., Zhou, P., Zhao, W., Kong, F., Wan, P., Gai, K., & You, Y. (2026). DiffusionART: Efficient, Stable and Scalable Reinforcement of Diffusion Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12572", "why": "逆過程型の手法は功績の割当が弱く、順過程型は指数移動平均の調整なしでは不安定という二分を、隠れた順逆整合力の存在として説明した。報酬をまとめて共通方向に変える設計でその力を構造的に消し、信頼領域マスクつきの 2回目の更新で復元を担わせる。動画生成で同等の報酬水準に約12倍少ないGPU時間で到達した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。既存手法の分析（§3.1–3.2）、提案手法（§4.1–4.3、補題2、式5）、実験（§5.1–5.2、表1・3、図5・6）、結論（§6）を参照した", "preprint": true, "p1": "拡散モデルの強化学習で、不安定さの原因となる隠れた力を構成の段階で消し、指数移動平均の調整なしで安定かつ高速に報酬を上げられるようになった（§4）。", "p2": "逆過程を使う手法（Flow-GRPOなど）は功績の割当が弱く効率が悪い。順過程を使う手法（DiffusionNFTなど）は効率はよいが、指数移動平均（EMA）の調整を課題ごとに行わないと不安定になる（§1、§3）。", "p3": "本文はまず原因を特定する。NFT型の目的関数は回帰の目標を順方向の速度場から作るため、逆方向の場との差という隠れた順逆自己整合力が入り込み、正例と負例を同時に学ぶだけでは部分的にしか打ち消されない（命題1、§3.1）。提案手法は各プロンプトの終点と報酬だけを先に集約して配る。核は補題2で、高報酬の終点を重く見るよう分布を傾けると終点の平均は報酬と終点の共分散の方向に動く。これをK本のロールアウトから推定して誘導に使い（式5）、信頼領域マスク付きの2回目の更新で復元を担わせる（§4）。", "p4": "評価は画像と動画の生成。画像ではSD3.5-M（512×512、LoRAランク32）でGenEval、OCR、PickScoreの単一報酬と4指標の多報酬を比較し、Flow-GRPOやDiffusionNFT（EMAあり・なし）と並べ、FLUX.1-devにも広げる。動画はHunyuanVideo-13Bで視覚品質（VQ）と動きの品質（MQ）に等重みを置く（§5）。", "p5": "画像では、課題ごとのEMA調整なしでDiffusionNFT（方策内）の崩壊を避けつつDiffusionNFT（EMA）と同等の効率に達し、Flow-GRPOのステップ500時点の報酬にGenEvalで10.0倍、OCRで5.2倍、PickScoreで9.6倍少ない訓練ステップで到達する（図5）。動画ではVQ 5.5の到達が24ステップ・63.4 GPU時間で、DiffusionNFT（EMA）の273ステップ・1,401.4 GPU時間に対し22.1倍少ない。400ステップの評価VQとMQは8.970と4.224で、最良の既存手法に対し31.4%と57.4%の改善である（表3）。", "p6": "著者は結論で順過程の学習に対する理解を与えたと述べるが、限界を明示する節は置いていない。報酬モデルの選択に依存する点や、信頼領域の閾値と傾けの強さτの決め方は検討されておらず、残る疑問である。", "fun": "画像や動画を作るAIを「良い出来のものを増やす」方向に訓練すると、速いやり方は不安定で、安定なやり方は遅いという困った二択があった。この研究は不安定さの正体を、目的関数の中に紛れ込んだ余計な力として突き止め、報酬の情報を先にまとめてから配ることでその力を構造的に消した。結果、同じ品質に届くまでのGPU時間が20倍以上短くなった。原因を数式で特定すると、調整の職人技ではなく設計で直せるという好例である。", "unverified": "表1・表2の個別の数値（ステップ400時点の評価値とGPU時間の一覧）は本文の表が機械可読に崩れており、文章中で言及された値のみ引用した。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "半導体の知識は市場を通って国境を越える", "title": "How Knowledge Crosses Borders: Evidence from Semiconductor Manufacturing", "url": "https://doi.org/10.3386/w35879", "authors": "Pinelopi K. Goldberg ほか", "venue": "NBER Working Paper", "apa": "Goldberg, P. K., Juhász, R., Forte, G. L., & Thurk, J. (2026). How Knowledge Crosses Borders: Evidence from Semiconductor Manufacturing (NBER Working Paper No. 35879). National Bureau of Economic Research. https://www.nber.org/papers/w35879", "why": "現代の半導体製造で国境を越える学習が重要であり、その経路がサプライチェーン上の知識共有、多国籍企業内の技術者の移動、対外直接投資といった意図的な経済関係であって、匿名の技術的波及ではないと示した。最先端の知識へのアクセスが自動的でないという政策含意を導いている。", "explain": {"basis": "本文", "basis_note": "機関リポジトリ経由のPDF本文を読んだ。実証枠組み（§3）、データ（§3.5）、学習率の推定（§3.5以降、付録A.3の表A.2の説明）、結論を参照した", "preprint": true, "p1": "半導体製造の学習が自国内の経験だけでなく国境を越えた経験からも進むことを、学習率の推定で分けて示せるようになった（§3.5、結論）。", "p2": "半導体の経験による学習（learning-by-doing）は古くから知られるが、議論は企業内の蓄積か同一国内の企業間の波及に偏ってきた。現代の製造が国際的な生産体制に埋め込まれていることが反映されていなかった（§1）。", "p3": "学習の源を3つに分ける。(a)あるファウンドリがある技術を作って積み上げた経験、(b)同じファウンドリが他の技術を作って積み上げた経験、(c)他国のファウンドリが同じ技術を作って積み上げた経験である。価格の推移に学習を織り込んだ需給モデルを立て、技術間・国間の費用差（賃金を含む）と供給者の品質差を統制したうえで寄与を分けて推定する（§3）。", "p4": "データは世界半導体アライアンス（GSA）のウェハ価格調査で、2004〜2019年の17,089件の四半期回答。ウェハの価格・数量・特性とファウンドリの所在国を含み、世界のファブレス向けウェハの約5分の1に当たるとされる。マイクロプロセッサ、SoC、汎用ICを対象としメモリは除く。標本期間の平均で米国7%、台湾56%、中国10%である（§3.5）。", "p5": "供給者と技術の組にだけ学習を認めると学習率は3.7%（95%区間2.9〜4.4%）で、Irwin and Klenow (1994) の20〜30%という先行値を大きく下回る。国境を越えた学習まで認めると17.3%（95%区間9.5〜24.4%）に上がる。90nm技術では後発の中国が既存の台湾・日本より低い価格で参入しており、これが他国の経験からの学習として現れる。基準の定式化ではγ、α、μが順に−0.27、0.14、0.12で、自社・自技術の累積生産1単位からの学習が他国からの1単位より約8倍大きい。ただし他国の累積生産は1社の8倍を超えることが多いため、合計では国境を越えた学習が上回ると見られる（§3.5）。", "p6": "著者は結論で、知識の伝達が市場関係を通じて内部化されているなら、波及が内部化されないことを根拠にする産業政策の正当化は弱くなる一方、各国政府は自国の技術進歩が海外に生む便益を内部化しないため緊張が生じると述べる。実証面では、各注文を満たした具体的なファウンドリを識別できず市場の寡占構造から推測していることが制約である（§3.5）。", "fun": "半導体は「作れば作るほど上手くなる」産業として知られる。ところが自社の経験だけで学習率を測ると3.7%にしかならず、業界の常識の20〜30%とまるで合わない。国境を越えた学習を認めると17%台まで上がり、謎が解ける。決定的なのは、後から参入した国の価格が先行国より低いところから始まるという事実。ゼロから学び直すなら高いはずなのに安い。知識は空気中に漂っているのではなく、取引先や転職する技術者という具体的な経路を通って運ばれていた。", "unverified": "表A.2の個別の推定値と標準誤差、§4の経路ごとの誘導形の推定結果は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "マスク拡散が潜在構造を学べる理由", "title": "Transformer-Based Masked Diffusion Models Provably Learn Distributions with Latent Structure", "url": "https://arxiv.org/abs/2610.12544", "authors": "Jingda Wu ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Wu, J., & Cai, C. (2026). Transformer-Based Masked Diffusion Models Provably Learn Distributions with Latent Structure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12544", "why": "マスク拡散モデルの誤差を並列化誤差と推定誤差に分けて扱ってきた既存理論に対し、端から端までの統計的保証を与えた。隠れマルコフ木の混合として潜在構造を表すと、標本複雑度が語彙サイズの系列数ではなく潜在構造で決まり、木の構造や成分パラメータを知らなくても自動的に適応すると示した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。主要な貢献（§1.1）、準備（§2.1–2.2）、問題設定（§3）、主結果（§4.1–4.2、定理1・2）を参照した", "preprint": true, "p1": "マスク拡散モデルの標本複雑度が、系列空間の大きさではなくデータの潜在構造で決まることを、マスク予測器の学習から生成分布のKL精度までつないで示せるようになった（§1.1、定理2）。", "p2": "マスク拡散モデル（MDM, masked diffusion model）は離散データを並列にマスク解除して生成する。その誤差は並列化によるものと有限標本でのマスク予測器の推定によるものに分かれるが、既存理論は両者を別に扱い、統計的な上界は語彙サイズVに対する長さLの系列の総数V^Lに比例して次元の呪いを受けていた（§1、§1.2）。", "p3": "着想は、低次元の構造を隠れマルコフ木の混合としてモデル化することである。各成分の内部では潜在変数が木構造の依存を持ち、成分の違いが異質性を表す。重要なのは、データ分布がこのクラスに厳密に属する必要はなく、近似されていればよい点である。そのうえで、トランスフォーマーのマスク予測器と並列のマスク解除手順が、木の形や成分のパラメータを事前に知らなくても、未知の潜在構造に適応することを示す（§1.1、§3）。", "p4": "評価は理論的な保証そのもので、定理1がマスク予測器の推定誤差（任意の木構造に適用できる）、定理2が端から端までの標本誤差を与える。良しとする基準は、生成分布と真の分布のKLダイバージェンスをεに抑えるのに必要な訓練標本数が、系列空間の大きさに依存しないことである（§4.1–4.2）。", "p5": "主結果は、データ分布がこの混合でよく近似され、並列化誤差が十分小さいとき、トランスフォーマーベースのMDMがKLダイバージェンスでε精度の標本生成を達成するのに Õ(L·K_par/ε) の訓練標本で足りるというものである（式1）。ここでLは系列長、構造複雑度K_parは系列長・語彙サイズV・隠れ状態数・成分数の多項式であり、系列空間の大きさV^Lには比例しない。これが次元の呪いを避ける要点である（§1.1）。", "p6": "著者が明示する限界は、結果が隠れマルコフ木の混合による近似の良さと並列化誤差の小ささという条件に依存することである（§1.1）。この条件が実データでどの程度満たされるか、並列化誤差を実際にどう抑えるかは本文の範囲外で、残る疑問である。", "fun": "長さLの文を語彙V語から作る場合、ありうる組み合わせはV^L通りで、すぐ天文学的な数になる。これだけ候補があるのに、実際の生成モデルは現実的なデータ量で学習できてしまう。なぜかを説明するのがこの論文で、答えは「本物のデータには隠れた木のような構造があるから」。必要なデータ量は、組み合わせの総数ではなくその木の複雑さで決まる。しかもモデルは木の形を教えられなくても自動的に合わせていく。", "unverified": "定理1・定理2の条件の具体的な形、並列化誤差の定量的な評価。長い数式を含む節は読み切れなかった。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "尤度がなくても逐次監視に耐える信頼区間", "title": "SLICE: Sequential Likelihood-Free Inference via Conformal E-Values", "url": "https://arxiv.org/abs/2610.13855", "authors": "Stefano Cortinovis ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "シミュレーションはできるが尤度が扱えないモデルに対し、厳密でいつ止めても有効な信頼列を構成した。各観測で候補の帰無仮説からシミュレーションし、予測可能なスコアを等角化して条件付きe値にし、その積が検定マルチンゲールになる。スコアの精度によらず妥当性が保たれる点が強い。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。準備（§3.1–3.2）、手法（§4.1–4.2、式6–10）、実験（§5）、考察と限界（§6）を参照した", "preprint": true, "p1": "シミュレーションはできるが尤度が計算できないモデルについて、いつ観測を止めても有効な厳密な信頼列を作れるようになった（§4.1、§6）。", "p2": "尤度が扱えないモデルでは頻度論的な不確実性の定量化が難しい。固定標本の方法は、観測を見ながら止めるかどうかを決めると被覆の保証が崩れる。逐次的に監視しながら妥当性を保つ枠組みが必要だった（§1）。", "p3": "構成は4段である。各時点で過去の情報だけから決まる正の予測可能なスコアT_iを選び（式6）、候補パラメータθのもとでK個の参照シミュレーションを生成し（式7）、観測と参照を合わせて等角化して条件付きのe値に変換し、その積が検定マルチンゲールになるのでパラメータについて反転させて信頼列を得る。要点は妥当性がスコアの精度に依存せず、スコアは信頼列が縮む速さだけを決めることである（§4.1）。最適なスコアは期待対数成長率（式10）を最大化するもので、これが尤度比に当たる。", "p4": "評価は3段。合成実験（ガウスモデルとg-and-kモデル）で等角化や尤度比の学習が効率に払う代償を測り、次にLLM APIのモデル置き換えの半合成的な監査、最後にOGLE-IVのマイクロレンズ観測から恒星の初期質量関数を推論する。α=0.1に固定し、真値が既知なら累積の非被覆を報告し、効率は信頼集合の幅と候補の残存確率で評価する（§5）。", "p5": "LLM APIの監査は、宣伝されたモデルPの代わりに安価なモデルRが使われる割合θを推定する設定で、監査者は両モデルから標本を取れるが尤度は評価できない。P=qwen3:8b、R=qwen3:1.7bとし、返答の確率質量は f_θ=(1−θ)p+θr となるため尤度比は比ρ=r/pだけで決まる。本文は、信頼列が逐次監視のもとで妥当なままである一方、固定標本の方法はそうならないこと、ニューラルスコアが厳密な尤度比や応用固有のスコアと競合する性能を保つことを報告する（§5、§6）。", "p6": "著者は、候補パラメータの格子に依存すること、参照シミュレーションが信頼列に余分なランダム性を加えること、最良の効率を得るには良い予測可能な対立仮説が必要なこと、そしてモデルベースの方法である以上シミュレータが正しく特定されている必要があることを限界として挙げる（§6）。前2つの拡張は付録Cで議論され、3つ目は事前情報の取り込みなどが今後の課題とされる。", "fun": "データを集めながら「もう結論を出していいか」を何度も確かめると、ふつうの統計の保証は壊れる。見るたびに偶然当たる機会が増えるからだ。この論文は、確率の計算式が書けないモデルでも、何回のぞいても壊れない区間の作り方を示した。仕掛けは、観測1つごとに新しくシミュレーションを走らせて比べ、その比の積を使うこと。しかも面白いのは、使うスコアがどれだけ下手でも区間の正しさは保たれ、上手なら区間が速く縮むだけという役割分担である。", "unverified": "図1の数値（累積非被覆や平均幅の具体値）、マイクロレンズ応用の推定結果は、本文の図表から読み取れなかった。"}}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "資金が凍ると延滞債権の買戻しが止まる", "title": "The Financing of Debt Relief: Intermediary Liquidity and the Value of Borrower Information", "url": "https://arxiv.org/abs/2610.12875", "authors": "Arka P. Bandyopadhyay", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "2019〜2022年のGinnie Mae買戻しオプション190万件を使い、2020年に調達市場が凍結したときノンバンク発行者が同じプールの預金取扱金融機関より買戻しを大きく減らし、現金を最も要する大口債権から手を引いたと示した。約190億ドルの買戻しが遅れ、多くは後に実施された。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。制度（§2）、理論（§3–4、命題1・4・5）、実証（§5.1–5.2）、結論（§7）を参照した", "preprint": true, "p1": "仲介者の資金繰りが延滞債権のどれをいつ救済するかを決めることを、ランキングに沿った配分の縮小として示せるようになった（§5.2、§7）。", "p2": "介入の原資がどこから来るかは、介入の有無だけでなく「どの案件が選ばれるか」を変えうる。しかし借り手の情報の価値と資金枠の制約を一緒に評価する枠組みがなかった（§1、§7）。", "p3": "理論の核は、仲介者が「現金1ドルあたりの価値」の高い順に資金を出し、価値がゼロになるところで止めるという配分（命題1）である。各介入に現金kが必要で枠がKなら資金を出せる割合はm=K/kになる。信号の配分価値ΔV(m)は、情報を使って上位から選んだ価値V_G(m)と、情報なしで一律に選んだ価値V_0(m)=m(Rp−c)の差である（式4–5）。命題4はこの配分価値が中間の資金枠で最大になることを示す。枠が十分なら全部に資金を出すので情報は選別にしか使われず、枠が極小なら使う余地がないためである（§4）。", "p4": "データはGinnie Maeの一戸建てプール向け公開ローン単位開示（2013年12月〜2022年12月）。2019年1月から2022年9月に権利が発生した1,922,668件の買戻しオプションを120の発行者について使う（ノンバンク1,298,771件、預金取扱623,897件）。ノンバンクは上限のある融資枠、預金取扱機関は預金で資金を出す。ランキングは観測できないため、2016〜2018年のノンバンク自身の298,723件の決定から推定した線形予測子を代理とする（§5.1）。", "p5": "2020年に調達市場が凍結したとき、ノンバンクは同じプールの預金取扱機関より買戻しを大きく減らし、同じ発行者・同じ月の中でも大口残高、つまり最も現金を要する債権から手を引いた。買戻しは基準から約190億ドル下回った。凍結コホートに衝撃前の残高加重の行使率を当てると3か月以内で188億ドルの不足だが、24か月でみると差は51億ドルに縮まり、多くは後に実行された（§5.2）。ランキング自体は変わらず、資金が戻ると同じ順序を下に辿り直す形になっている。", "p6": "著者は、これらのパターンが現金制約と整合的だが、観測できない資金調達の条件、事前のトレンド、発行者ごとの評価の違いがあるため因果の解釈には限界があると明記する。また基準からの買戻し不足は行動のタイミングを表すもので厚生損失ではなく、流動性支援の評価には資金調達やその後の処理についての証拠が必要だと述べる（§7）。", "fun": "延滞した住宅ローンを買い戻して処理する仕事では、どの案件を扱うかは価値の順に決まっていそうだ。2020年に資金が凍ったとき、その順序は崩れなかった。崩れたのは「どこまで下まで手を伸ばすか」で、現金を多く食う大口から先に手を引いた。順番を保ったまま打ち切り線が上がる、という予測が当たった形である。さらに面白いのは、情報の価値が資金枠が中くらいのときに最大になること。全部やれるなら選ぶ必要がなく、何もできないなら選んでも意味がない。", "unverified": "§5.3〜5.7の個別の推定値（資金枠ごとの反応、残高勾配、発行者類型内の資金圧力の指標）は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn16", "rank": 16, "field": "機械学習（Hugging Face）", "headline": "見て即座に反応するヒューマノイド制御", "title": "Reflex: Visually Grounded Reactive Humanoid Control", "url": "https://arxiv.org/abs/2610.12772", "authors": "Taoyang Jia ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "why": "テニスの返球や落ちるコップを掴むような、視覚に基づく反射的な行動をヒューマノイドで実現する研究である。計画して動くのではなく、視覚的に接地した反応として制御を組む設計で、投票数も多く注目されている。"}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "LLMの強化学習をダイバージェンスで統一", "title": "Generalized Proximal Policy Optimization: Unifying LLM RL Algorithms from the Perspective of Divergence", "url": "https://arxiv.org/abs/2610.13015", "authors": "Zhicheng Cai ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "LLMの推論強化の主流であるPPOが幾何的に特定のダイバージェンスに依存している点を指摘し、一般化された近接方策最適化としてLLMの強化学習アルゴリズム群を統一的に捉える視点を与えた。アルゴリズム選択の根拠を整理する研究である。"}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "トランジスタだけの物理学習器が文脈内学習する", "title": "An all-transistor physical-learning transformer can be trained to perform in-context learning", "url": "https://arxiv.org/abs/2610.12571", "authors": "Michael C. Abbott ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "平衡伝播や結合学習で訓練される系は多層パーセプトロンと同類で連想的な課題に弱かった。全てトランジスタで構成した物理的な学習トランスフォーマが、訓練によって文脈内学習を行えると示している。学習を物理系そのもので実現する方向の成果である。"}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "トランスフォーマをEMと確率伝播で読む", "title": "Neural expectation-maximization and meta-models", "url": "https://arxiv.org/abs/2610.12741", "authors": "Zhuolin Fu", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "トランスフォーマを、max-product型のループ確率伝播とEM法を組み合わせた混成の確率推論手続きの学習された近似として解釈した。注意機構を確率的グラフィカルモデルの推論として位置づける見方を与えている。"}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "スコア作用素を文脈内で学ぶ拡散モデル", "title": "Transformer-based In-Context Score Operator Learning for Diffusion Models", "url": "https://arxiv.org/abs/2610.13690", "authors": "Wuzhe Xu ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "拡散モデルは通常ひとつの目標分布か訓練時に固定された条件変数の族を学ぶが、スコア作用素自体を文脈内で学習することでその制約を外す方向を示した。生成モデルの汎用化に関わる定式化である。"}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "グラフで反実仮想予測を償却する", "title": "Amortized Counterfactual Prediction with Graph Neural Networks", "url": "https://arxiv.org/abs/2610.13724", "authors": "Hendrik Stumpf ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "別の条件なら結果がどう違ったかという反実仮想の推論を、グラフニューラルネットで償却して予測する枠組みである。個別に推論を解き直す必要を減らす設計で、因果推論と表現学習の接点にある。"}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "選択が繰り返される場でも被覆を保つ", "title": "Sequential Conformal Calibration under Recursive Selection", "url": "https://arxiv.org/abs/2610.12937", "authors": "Yuning Yang (Georgia Institute of Technology) ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "等角予測の有限標本・分布非依存の被覆保証は、多段階で前段の決定が後段の母集団を決める問題では崩れる。再帰的な選択の下で逐次的に校正を行う手法を与えており、意思決定を含む予測の妥当性に関わる。"}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "研究の外的妥当性をカーネルで定式化する", "title": "Kernel-based External Validity of Experimental Studies", "url": "https://arxiv.org/abs/2610.13625", "authors": "Federico Matteucci ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "ある研究の知見が未観測の実験条件やデータセットにどこまで一般化するかを、研究の結果と研究設問を合わせて形式化し、カーネル法で扱えるようにした。追試や一般化可能性の議論に定量的な枠組みを与える。"}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "事前分布適合網はベイズ推論をどこまで再現するか", "title": "How Well Do Prior-Data Fitted Networks Amortize Bayesian Inference?", "url": "https://arxiv.org/abs/2610.13764", "authors": "Manuel H\\\"ulskamp ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "事前分布適合網は合成事前分布のベイズ事後予測分布を近似するよう訓練されるが、近似の質についての結果は意外に乏しい。その近似精度を正面から評価した研究で、償却推論の信頼性に関わる。"}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "不均衡でも効く深層ノンパラメトリック検定", "title": "From Imbalance to Evidence: Deep Nonparametric Testing for Complex Data under Severe Sample Imbalance", "url": "https://arxiv.org/abs/2610.12946", "authors": "Guanhao Zhou ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "標本数が極端に偏る状況で分布を比較する際、多数側の情報を活かしながら少数側の差に感度を保つことが難しい。深層ノンパラメトリック検定でこの両立を図る手法を提案している。"}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "非ガウス空間場に疎な自己回帰変分推論", "title": "Scalable Sparse Autoregressive Variational Inference for Non-Gaussian Spatial Fields", "url": "https://arxiv.org/abs/2610.13656", "authors": "Paul F. V. Wiemann ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "ガウス過程事前分布でも尤度が非ガウスだと潜在場の事後分布が解析的に扱えない。疎な自己回帰構造を使った変分推論でこれをスケールさせる手法で、空間統計の計算に関わる。"}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "大次元標本共分散の固有ベクトル統計量", "title": "On Eigenvector Statistics of Large-Dimensional Sample Covariance Matrices with Applications", "url": "https://arxiv.org/abs/2610.12928", "authors": "Weiming Li ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "大次元の標本共分散行列について、固有ベクトルで重みづけたスペクトル統計量の挙動を解析し応用を示した。高次元統計の基礎にあたる結果である。"}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "未測定交絡への感度を図で示すRパッケージ", "title": "confoundvis for Visualizing and Reporting Sensitivity to Unmeasured Confounding in R", "url": "https://arxiv.org/abs/2610.13731", "authors": "Subir Hait", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "観測研究の結論が覆るには未測定交絡がどれほど強くなければならないかを問う感度分析は、手法ごとに違う量で答えてきた。それらを可視化して報告するRパッケージで、感度分析の実務的な標準化に寄与する。"}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "局所射影をあえて過剰識別する", "title": "Intentionally Overidentifying Local Projections", "url": "https://arxiv.org/abs/2610.13269", "authors": "Junjie Guo ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "マクロの動的効果推定で標準となった局所射影は、ラグ次数を決めて最小二乗で推定する metric insider trading in Chinese state-owned enterprises", "url": "https://doi.org/10.2139/ssrn.7601267", "authors": "Xu Ting Xu Ting", "venue": "SSRN", "date": "2026-10-12", "why": "中国の国有企業でコンプライアンス管理改革が機会主義的なインサイダー取引を抑えるかを検証し、買いと売りで効果が異なるかまで分けて推定している。"}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "学習しても取り付けは一方に固まらない", "title": "Selection Without Lock-In: Adaptive Learning, Residual Strategy Sets,and Incomplete Clearance in the 2008 and 2022–23 Crises", "url": "https://doi.org/10.2139/ssrn.7597444", "authors": "Philip Fellman", "venue": "SSRN", "date": "2026-10-11", "why": "ファンダメンタルズの開示と観測可能な逐次的引き出しが、Diamond-Dybvig型の調整ゲームでどちらの均衡が選ばれるかを決めうると論じ、長期記憶をもつ強化学習の下で2008年と2022〜23年の危機を対照している。"}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "戦略的業績測定が競争優位に結ぶか", "title": "The association between strategic performance measurement systems, innovation and competitive advantage", "url": "https://doi.org/10.2139/ssrn.7601268", "authors": "Kevin Baird ほか", "venue": "SSRN", "date": "2026-10-12", "why": "多次元の業績指標、価値ドライバーとの連結、戦略との連結という3類型の戦略的業績測定システムが、革新と競争優位にどう関係するかを検証している。"}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "レジーム情報は運用に残るのか", "title": "From Regimes to Portfolios: An Interpretable Machine-Learning Framework for Strategic and Tactical Cross-Asset Allocation", "url": "https://doi.org/10.2139/ssrn.7595598", "authors": "Chalam Raja Ankam", "venue": "SSRN", "date": "2026-10-12", "why": "マクロのレジームモデルは資産配分に広く提案されてきたが、経済的に実装可能な形にしたときにその情報が価値を保つかはほとんど検証されていない。解釈可能な機械学習の枠組みでこれを検証している。"}, {"id": "pn39", "rank": 39, "field": "組織行動・心理的安全性", "headline": "痕跡からチームらしさを測る", "title": "Teams without teams: a trace-based method for measuring team-like organization", "url": "https://arxiv.org/abs/2610.13529", "authors": "Thomas Baillie-Dawe (Lab-STICC ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "why": "デジタルプラットフォームに残る協働の痕跡は、貢献が独立なままか構造化された組織になっているかを直接には示さない。痕跡からチームらしい組織化の度合いを測る方法を提案している。"}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "LLM時
