rg/10.2139/ssrn.7672860", "authors": "Sixun Tang", "venue": "SSRN", "date": "2026-11-03", "apa": "Tang, S. (2026). Competing through Patent Litigation:&nbsp;Product-market Targeting and Innovation. https://doi.org/10.2139/ssrn.7672860", "why": "特許訴訟を製品市場の競争の手段として分析し、提訴の判断と投資の決まり方を示す。"}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "人とエージェントのチームを統制されたメッセージで運営", "title": "Getting a Grip: Operating Human-Agent Software Teams Through Governed Messages", "url": "https://arxiv.org/abs/2611.00689", "authors": "Michael Granitzer ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Granitzer, M., Dastidar, K. G., Einwiller, A., Mitrović, J., & Zerhoudi, S. (2026). Getting a Grip: Operating Human-Agent Software Teams Through Governed Messages (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00689", "why": "複数の人が多数のコーディングエージェントを指揮する開発チームの運営方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の人が多数のコーディングエージェントを指揮するチームを、型と宛先を持つメッセージの規約で統制する中継の仕組みを示した（抄録）。", "p3": "人とエージェントを認証された主体とし、目標・決定規則・経路と追記のみの記録を持つ「部屋」で型つきの宛先つきメッセージを交わす中継系yoarsを提案し、部屋の規則を変えた統制実験を行った（抄録）。", "p5": "926回の統制実行（解析可能899回）で小さなエージェントチームにプログラムを作らせ、一部には悪意ある参加者を入れた（抄録。主な結果の数値は未確認）。", "fun": "人間のチームでも「誰が誰に頼めるか」「どの発言で決まったか」があいまいだと混乱します。AIが何体も加わればなおさらです。この研究は、チームの約束事を「メッセージの書式と記録」として機械的に決め、裏切り者がまじっても崩れないかを実験しました。会議の議事録を仕組みにした発想です。", "unverified": "統制実験の主要な結果は抄録で切れており未確認。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "集団的リーダーシップを強制選択式で測る", "title": "Innovations in leadership measurement: Developing contextualized forced-choice metrics for collective leadership capacities", "url": "https://doi.org/10.31234/osf.io/uvweq", "authors": "Alvin Vista ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Vista, A., Boruchowicz, C., & Tolescu, A. (2026). Innovations in leadership measurement: Developing contextualized forced-choice metrics for collective leadership capacities. https://doi.org/10.31234/osf.io/uvweq", "why": "文脈に合わせた強制選択式の尺度で、集団のリーダーシップ能力を測る新しい方法。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "自己評定の偏りを避けるため、集団的リーダーシップ能力を強制選択式で測る尺度を開発した（抄録）。", "p3": "Teach For Allのネットワークの教育の文脈に合わせ、自己理解・システム思考・生徒への信頼・集団的な心構え・教育の目的観の5次元を強制選択式で測り、イプサティブ（個人内比較）の限界に対処した（抄録）。", "p5": "開発と初期の妥当性検証を示した（抄録。妥当性の指標値は未確認）。", "fun": "「あなたは協調的ですか」と聞かれると、多くの人は「はい」と答えます。そこで「AとBのどちらがよりあなたらしいか」と選ばせると、良く見せる答え方がしにくくなります。この研究は、その強制選択の方法で、個人ではなく集団としてのリーダーシップを測ろうとしました。", "unverified": "妥当性検証の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "上司の天職意識が部下に移るかは信頼次第", "title": "The Moderating Role of Trust on the Relation Between a Leader’s Calling and an Employee’s Calling", "url": "https://doi.org/10.31234/osf.io/djuc8", "authors": "Sophie Gerdel ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Gerdel, S., Vercillo, M., Duffy, R. D., & Vianello, M. (2026). The Moderating Role of Trust on the Relation Between a Leader’s Calling and an Employee’s Calling. https://doi.org/10.31234/osf.io/djuc8", "why": "リーダーの天職意識と従業員の天職意識の関係を、信頼が調整することを示す。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "信頼する上司が天職意識を持っていると、部下の天職意識も時間をかけて育つことを示した（抄録）。", "p3": "社会的認知キャリア理論と意味づけ理論に基づき、米国の従業員285人の3時点の縦断データで、上司の天職意識の知覚と信頼が部下の天職意識の伸びを予測するかを検証（抄録）。", "p5": "信頼する上司に天職意識を感じると部下の天職意識が育ち、この過程は他の模倣の過程より遅く、少なくとも4〜8か月を要した（抄録）。", "fun": "「この仕事は自分の天職だ」という感覚は、どうやって生まれるのでしょう。この研究は、それが上司から部下へゆっくり「うつる」ことを示しました。ただし信頼している上司の場合に限ります。尊敬できる先輩の背中を見て育つ、という昔からの言い方を、数か月の追跡で確かめた形です。", "unverified": "なし"}}, {"id": "pn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "生成AIへの信頼と不信を集団で交渉する", "title": "Collectively Negotiating Trust and Mistrust in Generative AI: Evidence from Reddit Discussions of ChatGPT and Claude", "url": "https://doi.org/10.31234/osf.io/dnxyk", "authors": "Rita Tang ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Tang, R., Lin, Z., & Liu, J. (2026). Collectively Negotiating Trust and Mistrust in Generative AI: Evidence from Reddit Discussions of ChatGPT and Claude. https://doi.org/10.31234/osf.io/dnxyk", "why": "Redditの議論から、生成AIへの信頼が集団でどう形づくられるかを分析。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "生成AIへの信頼と不信が、オンライン共同体の中でどう話し合われるかを30万件の投稿から示した（抄録）。", "p3": "r/ChatGPTとr/ClaudeAIの301,498件の投稿を、構造的トピックモデル、理論に基づく信頼・不信の辞書、人による解釈で分析（抄録）。", "p5": "信頼に関わる9つのトピック（信頼1、不信4、両義的4）を特定した。信頼はAIとの交友やセラピーのような支えに集まり、不信は脱獄やモデルの劣化などに関わった（抄録）。", "fun": "AIを信じるかどうかは、一人ひとりの気持ちの問題に見えます。でもネットの掲示板では、みんなで「この使い方は大丈夫か」と話し合いながら信頼が形づくられています。30万件の投稿から、信頼が「相談相手としてのAI」に、不信が「勝手に性能が変わること」に向いていると分かったのが興味深い点です。", "unverified": "「モデルの劣化」は抄録の切れた語からの解釈：model dの後は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "労働市場の教育収益と家族内の教育格差", "title": "Labor Market Returns to Education and Intra-family Educational Inequality: Theory and Experimental Evidence", "url": "https://arxiv.org/abs/2611.02959", "authors": "Esther Gehrke ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Gehrke, E., & Amador, M. G. (2026). Labor Market Returns to Education and Intra-family Educational Inequality: Theory and Experimental Evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02959", "why": "労働市場の条件が兄弟姉妹間の教育配分を変えるかを理論と実験で検証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "学歴の賃金収益が凸である労働市場で、親が兄弟姉妹の教育投資の差を広げるか縮めるかは、親の不平等回避で決まることを示した（抄録）。", "p3": "理論モデルを立て、メキシコ・サンルイスポトシの親246人による高い報酬つきの実地実験で、トークンの配分が子のAI講座への参加を決める6つの場面から構造パラメータの分布を推定（抄録）。", "p5": "収益の凸性は、親の不平等回避の大きさによって兄弟姉妹間の差を増やしも減らしもする（抄録の理論結果。推定値は未確認）。", "fun": "勉強すればするほど給料が「加速度的に」増える社会では、親は出来のよい子に集中投資したくなるかもしれません。でも子どもの間の公平も気になります。この研究は、親が本物の講座の席を子どもに配る実験で、その迷いの強さを測りました。家庭の中の小さな配分が、社会の格差につながる道筋を考えさせます。", "unverified": "推定された不平等回避の分布は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "洪水と自動車産業の生産の二重化", "title": "Floods and the Duplication of Production: Evidence from the Global Car Industry", "url": "https://arxiv.org/abs/2611.01329", "authors": "Michele Fioretti ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Fioretti, M., Praetorius, S., & Mayer, T. (2026). Floods and the Duplication of Production: Evidence from the Global Car Industry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01329", "why": "洪水によるサプライチェーン途絶が、企業の生産拠点の重複配置を促すかを実証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "洪水に遭った自動車メーカーは、生産を移すのではなく複数拠点に重複させることを示した（抄録）。", "p3": "工場単位のデータと手作業で確認した洪水記録を使い、時期のずれた差の差分法で、車両と主要部品の生産の適応と、保険・公的な治水との関係を分析（抄録）。", "p5": "洪水から5年以上たってもエンジンが2つ以上の工場で作られる確率は19ポイント高く、多くは海外の、近くで組み立てる車向けだった。被災工場の生産は洪水の年の一時的な減少の後、持続的には下がらなかった（抄録）。", "fun": "洪水で工場が止まったら、別の場所に引っ越すのが普通に思えます。ところが実際の自動車メーカーは、元の工場を残したまま別の国でも同じ部品を作り始めました。「引っ越し」ではなく「予備を持つ」選択です。災害への備えが、世界の生産地図を静かに変えていることが分かります。", "unverified": "なし"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "較正は正しいモデルを選ぶか：所得リスクの尤度", "title": "Does Calibration Pick the Right Model? Likelihood Evidence from Income Risk", "url": "https://arxiv.org/abs/2611.02029", "authors": "Jiuyi Cheng ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Cheng, J., & Toda, A. A. (2026). Does Calibration Pick the Right Model? Likelihood Evidence from Income Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02029", "why": "モーメント一致による較正と尤度による証拠を比べ、所得リスクのモデル選択を検証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "いくつかのモーメントを合わせる較正では、所得リスクの正しいモデルを選べないことを尤度で示した（抄録）。", "p3": "有限状態の隠れマルコフ近似で、短いパネルの非線形・非ガウスの潜在過程の尤度推定とモデル選択をシミュレーションなしで可能にし、PSIDの所得データに適用した（抄録）。", "p5": "所得変動のモーメントに最もよく合う較正は、ガウスの持続成分を持つ尤度推定の過程より所得履歴全体への当てはまりが悪かった。標準的な貯蓄モデルでは、目標に同程度に合う較正どうしで平均資産が3倍違った（抄録）。", "fun": "テストの平均点と分散が同じでも、クラスの中身は違うことがあります。経済のモデルも、いくつかの統計量を合わせただけでは「同じに見えて別物」になります。この研究は、データ全体の当てはまりで比べると、どのモデルが良いかが変わり、貯金の予測が3倍もずれることを示しました。", "unverified": "なし"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "レビューを促すと評価の分布が変わる", "title": "Ask More, Hear Less: How a Review Prompt Changes What Online Ratings Show", "url": "https://arxiv.org/abs/2611.02623", "authors": "Zihan Chen ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Chen, Z., Zheng, L. N., & Zhu, D. (2026). Ask More, Hear Less: How a Review Prompt Changes What Online Ratings Show (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02623", "why": "レビュー依頼が自己選択を減らすかを検証し、評価の見え方の変化を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "レビューの依頼が評価の情報量を増やすか減らすかの対立する理論を、信号検出理論でまとめて検証した（抄録）。", "p3": "評価が「何を知っているか」（感度）と「何を表すか」（基準）を分け、Steamが約3時間のプレイ後にレビューを促し始めた2019年10月の閾値で、315ゲームの2,160万件のレビューに差の不連続デザインを適用した（抄録）。", "p5": "抄録の範囲では結果の詳細は切れており、題名から、依頼によって評価が示すものが変わることが主張と読める（解釈）。", "fun": "「レビューを書いてください」とお願いすれば、もっと多くの人の本音が集まりそうです。でも頼まれて書く人は、熱心な人ほど強い意見を持っていないかもしれません。この研究は、ゲームを3時間遊ぶと依頼が出る仕組みの境目を使い、お願いが評価の「見え方」をどう変えるかを2千万件超のレビューで調べました。", "unverified": "主要な結果（感度と基準の変化）は抄録で切れており未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "女性殺害の注目が全国的な対応を動かす", "title": "Public salience mobilizes nationwide responses to violence against women", "url": "https://arxiv.org/abs/2611.02647", "authors": "Augusto Cerqua ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Cerqua, A., Letta, M., Giannantoni, C., & Pinto, G. (2026). Public salience mobilizes nationwide responses to violence against women (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02647", "why": "公的な注目が社会の対応を動員するか、さらなる被害を招くかを実証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "注目を集めた女性殺害事件が、全国で支援の求めや通報を増やし、模倣は起こさないことを示した（抄録）。", "p3": "2017〜2024年のイタリアの女性殺害の事例単位のデータを新たに作り、最も注目された事件が支援の求め、警察への通報、致死的な暴力に与える全国的な影響を分析（抄録）。", "p5": "注目度の高い親密なパートナーによる女性殺害は全国で支援の求めを増やし、特に注目された1件は通報も大きく増やしたが、女性殺害の増加は見られず模倣説と整合しなかった。注目の低い事件では同様の動員はなかった（抄録）。", "fun": "悲しい事件が大きく報道されると、まねをする人が出るのでは、と心配されます。この研究はイタリアの記録を使い、むしろ「自分も危ないかもしれない」と気づいた人が相談や通報を増やしたことを示しました。報道の注目が、被害を広げる方向ではなく、助けを求める方向に働いたという発見です。", "unverified": "なし"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "機械が上場の時機を決める市場", "title": "Machine-Timed Markets: Artificial Intelligence and the Timing and Outcomes of Initial Public Offerings", "url": "https://doi.org/10.2139/ssrn.7672098", "authors": "Leo Will", "venue": "SSRN", "date": "2026-11-03", "apa": "Will, L. (2026). Machine-Timed Markets: Artificial Intelligence and the Timing and Outcomes of Initial Public Offerings. https://doi.org/10.2139/ssrn.7672098", "why": "AIがIPOの時機と結果に与える影響を分析。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIを起業の主体とみなし、IPOの時機と成果をどう変えるかの理論を提示した（抄録）。", "p3": "リアルオプション、シグナリング理論、企業年齢とメディア感情の非線形効果の研究に基づく概念的な理論構築（抄録）。", "p5": "AIは市場の窓の察知を鋭くし、上場準備の時間を縮め、開示の精度を高め、募集の物語を最適化して、時機を改善し過小値付けを減らすと論じた。その他の帰結は抄録で切れている（抄録）。", "fun": "会社を株式市場に出すタイミングは、早すぎても遅すぎても損をします。これまでは経験豊富な専門家の勘に頼ってきました。この論文は、AIがその勘の代わりになったら何が起きるかを理屈で組み立てます。みんなが同じAIを使うと、かえって同じ時期に殺到する心配も考えられます（解釈）。", "unverified": "実証の有無と、理論が示す負の帰結は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "起業家の条件つき納税倫理", "title": "Conditional Tax Morale Among Entrepreneurs: Within-Person Evidence on Fiscal Reciprocity, Deterrence, and Peer Behavior", "url": "https://doi.org/10.2139/ssrn.7668859", "authors": "Baiba Renerte ほか", "venue": "SSRN", "date": "2026-11-03", "apa": "Renerte, B., & Sauka, A. (2026). Conditional Tax Morale Among Entrepreneurs: Within-Person Evidence on Fiscal Reciprocity, Deterrence, and Peer Behavior. https://doi.org/10.2139/ssrn.7668859", "why": "個人内の変動から、財政的互恵性・抑止・同僚行動が納税倫理に与える影響を検証。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "起業家の納税倫理は、取締りの弱まりや同業者の脱税より、政府の浪費に最も強く反応することを示した（抄録）。", "p3": "2026年のラトビア・リトアニア・エストニアの企業の所有者・経営者1,513人の調査で、同じ回答者内で1つの条件を変える3組のビネットにより、脱税がどれほど正当化できるかを判断させた（抄録）。", "p5": "判断は政府の浪費に最も、取締りの弱まりにそれに次いで、同業者の脱税に最も小さく反応し、この順序はどの国でも、各回答者が信じる現状のもとでも成り立った（抄録）。", "fun": "人が税金を払うのは、罰が怖いからだけではありません。この調査では、経営者が「脱税も仕方ない」と思う一番の理由は、周りがずるをしていることではなく、政府がお金を無駄遣いしていることでした。払う側が「税がきちんと使われているか」を見ている、という互恵の感覚が浮かびます。", "unverified": "なし"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "欧州航空業の炭素規制と競争", "title": "Carbon regulation and competition in the European airline industry", "url": "https://econpapers.repec.org/RePEc:azt:cemmap:20/26", "authors": "Ertian Chen ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "EU排出量取引の強化が航空会社間の競争に与える影響を分析。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "EU排出量取引の強化が欧州の航空市場に与える影響は、航空会社の型と市場によって大きく偏ることを示した（抄録）。", "p3": "内生的な路線参入、直行便の頻度、価格設定を持つ2段階の航空競争モデルを推定し、炭素価格の上昇を模擬（抄録）。", "p5": "消費者余剰は全体で最大34%、中・長距離市場で最大95%減り、短距離市場は容量の再配分で厚生が増えた。航空会社の利潤は1〜42%減るが、19〜29億ドルの炭素税収と27〜40億ドルの回避排出の社会的価値が民間の損失を上回った（抄録）。", "fun": "飛行機に炭素の値段をつけると、みんなが同じだけ損をするわけではありません。この研究では、長い路線ほど打撃が大きく、短い路線はむしろ便が増えて得をする、という意外な結果が出ました。航空会社が路線を組み替えるという「反応」まで計算に入れたからこそ見えた姿です。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "正規-正規経験ベイズの事前母数を頑健に推定", "title": "Robust Estimation of Prior Parameters in Normal-Normal Empirical Bayes", "url": "https://arxiv.org/abs/2611.00326", "authors": "Manu Burson ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Burson, M., & Kessler, R. (2026). Robust Estimation of Prior Parameters in Normal-Normal Empirical Bayes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00326", "why": "大規模A/Bテストで使う経験ベイズの事前分布推定を外れ値に強くする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大規模A/Bテストの正規-正規経験ベイズで、真の効果の分散の推定を少数の極端な観測に強くする推定量を提案した（抄録）。", "p3": "モデルとの不整合に比例して極端な観測の重みを下げる有界影響最尤推定量（BIMLE）を提案。極端な観測がなければ通常の最尤推定と一致し、標本はすべて使う（抄録）。", "p5": "Amazonで実施したA/Bテストに適用した（抄録。改善の大きさは抄録で切れており未確認）。", "fun": "たくさんの実験結果をまとめて「本当の効果のばらつき」を見積もるとき、たった数件の異常な結果が全体を大きく動かしてしまうことがあります。この方法は、怪しい結果を捨てずに、怪しさに応じて発言力を下げます。多数決で一人の大声に振り回されない工夫に似ています。", "unverified": "Amazonでの適用結果の数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "少数の単位が変動を支配する無作為化実験の推測", "title": "Studentized inference in randomized experiments when a few units dominate the outcome variation", "url": "https://arxiv.org/abs/2611.03561", "authors": "Xinyuan Chen ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Chen, X., Kiesel, J. W., & Woody, J. R. (2026). Studentized inference in randomized experiments when a few units dominate the outcome variation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03561", "why": "裾の重い結果での無作為化実験の推測を、スチューデント化で安定させる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "裾の重い結果の無作為化実験で、少数の単位が残差変動を占めると、スチューデント化した統計量が正規分布に近づかないことを示した（抄録）。", "p3": "有限母集団を固定し、処置の割り当てだけを確率とする設計ベースの枠組みで、平均の差とLinの回帰調整推定量のスチューデント化統計量の極限を調べた（抄録）。", "p5": "極限は一般に非正規で、潜在結果の周辺分布が同じでも、観測できない2つの潜在結果の組み合わせ方によって極限が変わる（抄録）。", "fun": "実験の参加者が増えれば、平均の差は正規分布に従う、というのが統計の常識です。でも、ごく少数の「桁違いの人」がいると話が変わります。例えば売上の実験で一人の大口客がいるような場合です。この研究は、そのとき常識的な信頼区間が当てにならない理由を数学的に示しました。", "unverified": "提案する修正法の有無は抄録で切れており未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "確率標本と非確率標本の傾向スコアによる統合", "title": "Data integration using propensity score weighting under missing at random", "url": "https://arxiv.org/abs/2611.03353", "authors": "Caleb Leedy ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Leedy, C., & Kim, J. K. (2026). Data integration using propensity score weighting under missing at random (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03353", "why": "MAR下で確率標本と非確率標本を統合する傾向スコア重みづけの理論。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "確率標本と非確率標本を傾向スコアの重みで統合し、母平均を推定する方法の理論を示した（抄録）。", "p3": "補助変数は両方の標本で、調査変数は非確率標本だけで観測される設定で、非確率標本への包含のパラメトリックな傾向スコアモデルを条件付き最尤法で推定し、逆確率重みづけ推定量を作る（抄録）。", "p5": "適切な正則条件のもとで、提案する推定量の一致性と漸近正規性を示した（抄録）。", "fun": "ネットで集めたアンケートは安く大量に集まりますが、答える人が偏っています。きちんと無作為に選んだ小さな調査には偏りがありません。この方法は、小さな「正しい」調査を手がかりに、大きな「偏った」調査の回答者に重みをつけ直して、全体の平均を推定します。", "unverified": "シミュレーションや実データの結果は未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "事後分布の併合で速いベイズ逐次変化点検出", "title": "Bagel: A Fast Bayesian Online Changepoint Detection Algorithm for Linear Models via Posterior Merging", "url": "https://arxiv.org/abs/2611.03230", "authors": "Ziyang Yang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Yang, Z., Fearnhead, P., & Grose, D. (2026). Bagel: A Fast Bayesian Online Changepoint Detection Algorithm for Linear Models via Posterior Merging (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03230", "why": "線形モデルのベイズオンライン変化点検出を高速化するアルゴリズム。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形モデルのベイズ逐次変化点検出を、事後分布の併合で高速化するアルゴリズムBagelを示した（抄録）。", "p3": "平均や傾きの変化と季節効果などの共通構造を含む回帰モデルの類について、変化の有無と時点の事後分布を統一的に計算・更新する方法を示し、素朴な実装では計算量が線形に増える問題を併合で抑える（抄録）。", "p5": "抄録の範囲では計算量削減の具体的な結果は未確認。", "fun": "機械の振動や売上の推移を見ていて、「いつ何かが変わったか」をその場で見つけたい場面は多くあります。ベイズの方法は「変わった確率」を示せますが、データが増えるほど計算が重くなります。この研究は、似た候補をまとめていくことで、計算を軽くしたまま判断できるようにしました。", "unverified": "計算速度と検出精度の数値は未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "予測が現実を変える下での統計的推測", "title": "Statistical Inference under Performativity: From Policy Feedback to Self-Evolving Systems", "url": "https://arxiv.org/abs/2611.00438", "authors": "Tianwei Gao ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Gao, T., Wen, G. G., Zhong, H., Lei, L., Su, W., & Deng, Z. (2026). Statistical Inference under Performativity: From Policy Feedback to Self-Evolving Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00438", "why": "予測に基づく意思決定がデータ生成を変える状況での推測の枠組み。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "予測にもとづく決定がデータの生成過程を変える「遂行性」のもとでの統計的推測の枠組みを示した（抄録）。", "p3": "繰り返しのリスク最小化と繰り返しの勾配降下について、固定した展開回での中心極限定理を示し、共分散の再帰式を導いた（抄録）。", "p5": "以前の予測器の推定誤差が後のデータ分布に影響して伝わる仕組みを扱える推測の方法を示した（抄録。数値例は未確認）。", "fun": "天気予報は天気を変えませんが、渋滞予報はみんなが道を変えるので渋滞そのものを変えます。予測が現実を変え、その現実で次の予測を学ぶ、という堂々めぐりです。AIが自分の作ったデータで学び直す時代に、そうした循環の中でも誤差の大きさを正しく見積もる方法が必要だという問題意識です。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "因果推論のためのレコードリンケージ", "title": "Causal Record Linkage", "url": "https://arxiv.org/abs/2611.00760", "authors": "Kayan\\'e Robach ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Robach, K., Hof, M. H., van de Wiel, M. A., & van der Pas, S. L. (2026). Causal Record Linkage (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00760", "why": "複数のデータ源の結合誤りが因果効果の推定に与える影響を扱う方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のデータ源を結合するレコードリンケージが、因果効果の識別の仮定とどう衝突するかを示した（抄録）。", "p3": "リンケージの誤りが因果の枠組みのどの仮定を脅かすかを理論的に調べた（抄録）。", "p5": "リンケージの誤りは主に一致性（consistency）を脅かし、結合データの食い違いによる減衰バイアスを生む。結合を厳しくすると今度は標本選択のバイアスが生じる（抄録）。", "fun": "名前や誕生日で別々の名簿をつなぐと、ときどき別人どうしがつながってしまいます。すると「薬を飲んだ人」と「その人の結果」がずれ、効果が実際より小さく見えます。かといって確実な人だけつなぐと、今度はつなぎやすい人ばかりが残ります。どちらに転んでも偏る板ばさみを整理した研究です。", "unverified": "提案する対処法の詳細は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "GRPOでは学習データのずれが効く", "title": "Dataset Mismatch Matters in Group Relative Policy Optimization for Reinforcement Learning from Verifiable Rewards", "url": "https://arxiv.org/abs/2611.00586", "authors": "Zhen-Yu Zhang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Zhang, Z.-Y., Zhang, J., Yao, H., Niu, G., & Sugiyama, M. (2026). Dataset Mismatch Matters in Group Relative Policy Optimization for Reinforcement Learning from Verifiable Rewards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00586", "why": "検証可能な報酬による強化学習で、データセットの不一致が性能を左右することを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "検証可能な報酬の強化学習（GRPO）で、学習データとテストデータの分布のずれを考慮した選択的ロールアウトの必要性を示した（抄録）。", "p3": "既存の選択的ロールアウトは学習側の学習動態だけで学習プロンプトの分布を最適化する。法やプライバシーの制約でテスト側に通常アクセスできない状況で、分布のずれを扱う方法を提案（抄録）。", "p5": "抄録の範囲では提案法の結果は未確認。", "fun": "試験勉強で、過去問ばかり解いていると、本番の出題傾向がずれたときに弱くなります。AIの強化学習でも同じで、どの練習問題を何回解かせるかの選び方が大切です。この研究は、本番の問題を直接見られない状況でも、そのずれを意識して練習の配分を決める必要があることを示しました。", "unverified": "提案法の具体的な仕組みと効果の大きさは未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "RLVRで汎化する推論戦略と汎化しない戦略", "title": "Not All Reasoning Generalizes: A Case Study on Learning Generalizable Reasoning Strategies in RLVR", "url": "https://arxiv.org/abs/2611.03627", "authors": "Ziqi Pang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Pang, Z., & Wang, Y.-X. (2026). Not All Reasoning Generalizes: A Case Study on Learning Generalizable Reasoning Strategies in RLVR (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03627", "why": "検証可能な報酬の強化学習で、どの推論戦略が汎化するかを事例で検証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "検証可能な報酬の強化学習が、分布内の課題は解けても汎化しない推論戦略を教えてしまう失敗を示した（抄録）。", "p3": "全単射でない文字列関数fについてf(x)=yとなる複数のxを見つける方程式の課題を作り、推論戦略を観察でき、解の数やyの長さで易から難への分布外のずれを定義できる設定で調べた（抄録）。", "p5": "RLVRがモデルに分布内の課題を高い精度で解かせる一方で、汎化しない戦略を身につけさせる微妙な失敗があることを示した（抄録。数値は未確認）。", "fun": "九九を丸暗記した子は、九九の範囲では満点でも、二けたのかけ算になると手が止まります。AIも「正解ならごほうび」という学び方だけだと、丸暗記のような近道を覚えることがあります。この研究は、解き方そのものが見える問題を作って、どの学び方なら応用が利くかを確かめました。", "unverified": "汎化を促す方法の効果の大きさは未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "表形式基盤モデルTabAbaxの技術報告", "title": "TabAbax: A Tabular Foundation Model Technical Report", "url": "https://arxiv.org/abs/2611.00562", "authors": "Zhixiong Cheng ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Cheng, Z., Gao, X., Han, S., Suo, J., & Wang, Z. (2026). TabAbax: A Tabular Foundation Model Technical Report (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00562", "why": "学習なしで未知の表データを予測する表形式基盤モデルの報告。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式基盤モデルの改良を、合成事前学習の事前分布と列・行の符号化器に集中させたTabAbaxを報告した（抄録）。", "p3": "TabICLv2を土台に、合成事前学習の事前分布の質と複雑さを高め、行の前に特徴間の相互作用を強める2段の列・行スタックを入れた（抄録）。", "p5": "文脈内学習のTransformerを深くしても効果が小さいという既存の知見に基づく設計で、上流の2つの部品に改善の余地があるとした（抄録。性能の数値は未確認）。", "fun": "表計算のようなデータを、問題ごとに学習しなくても見本を見せるだけで予測するAIがあります。この研究は、AIの「頭」を大きくするより、練習に使う作り物のデータと、列や行の読み取り方を工夫するほうが効くと考えて改良しました。どこに伸びしろがあるかを見極めた設計です。", "unverified": "ベンチマークの成績は未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "完全に公開されたエージェント基盤モデルAxion 1.0", "title": "Axion 1.0: Open Agent Foundation Models, Simplified", "url": "https://arxiv.org/abs/2611.03233", "authors": "Yuqi Jia ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Jia, Y., Tian, Y., Zheng, J., Liang, Y., Sun, J., Zhao, M., & Fu, D. (2026). Axion 1.0: Open Agent Foundation Models, Simplified (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03233", "why": "幅広いエージェント能力を持つ完全公開の基盤モデル。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "簡単な3段階の学習だけで幅広いエージェント能力を持つ、完全に公開された基盤モデルAxion 1.0を示した（抄録）。", "p3": "2つの軽い教師ありファインチューニングと強化学習の3段階で、専用の中間学習、DPO、オンポリシー蒸留を使わない。第1段階では基盤モデル自身の成功した解法に基づき、難しい問題を合成して敵対的に強化する（抄録）。", "p5": "抄録の範囲ではベンチマークの数値は未確認。", "fun": "強いAIを作るには、複雑な手順を何段も重ねるのが当たり前になっていました。この研究は、手順を3つに絞っても十分強くなることを示そうとしています。しかも作り方を全部公開しているので、ほかの研究者が同じものを作って確かめられるのが大事な点です。", "unverified": "他モデルとの比較結果は未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "AIエージェントをチームメイトとして測る", "title": "Measuring AI Agents as Teammates with Collaborative Intelligence", "url": "https://arxiv.org/abs/2611.02633", "authors": "Sean Wu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-03", "apa": "Wu, S., Pappu, A., Zou, J., Kim, Y., Mao, Y., Zhou, H., Yu, J., Chen, J., & Zou, J. (2026). Measuring AI Agents as Teammates with Collaborative Intelligence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02633", "why": "単独性能ではなく人との協働での知能を測る評価法。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントがチームメイトとしてどれだけうまく働くかを測るベンチマークを作った（抄録）。", "p3": "人のチーム研究にならい、危険な近道を断ることから、弱いモデルの仕事を確かめることまで、チームワークの8次元にわたる240課題からなる協働知能ベンチマークを作った（抄録）。", "p5": "抄録の範囲では各モデルの成績は未確認。", "fun": "一人で100点を取る生徒が、グループ活動でも頼れるとは限りません。AIも同じで、これまでは単独の成績ばかり測られてきました。この研究は、「仲間の間違いに気づくか」「危ない近道を止められるか」など、チームの一員としての力を測る問題集を作りました。", "unverified": "評価したモデルと結果は未確認。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "アウトストルメンタル変数回帰", "title": "Outstrumental Variable Regression", "url": "https://arxiv.org/abs/2611.00266", "authors": "Felix Schur ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Schur, F., Kühne, L., von Kügelgen, J., & Peters, J. (2026). Outstrumental Variable Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00266", "why": "観測されない交絡がある場合の処置効果推定の新しい変数の使い方。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "処置の分布が変わらなくても、結果の仕組みが環境ごとに変われば因果効果を識別できることを示した（抄録）。", "p3": "アウトストルメンタル変数回帰（OVR）を提案し、第1段階として各環境でXを与えたYの条件付き期待値を計算する3段階の手順をとる（抄録）。", "p5": "操作変数法が処置の外生的な変動を使うのに対し、結果側の環境間の変動を使って識別できることを示した（抄録。残りの手順は抄録で切れている）。", "fun": "薬の効果を知るために、ふつうは「薬の飲み方が偶然ばらつく」状況（操作変数）を探します。この研究は逆に、「薬の飲み方は同じだが、効き方の背景が地域ごとに違う」状況でも効果を割り出せることを示しました。原因の側ではなく結果の側の変化を使う、という発想の転換です。", "unverified": "手順の第2・第3段階と識別条件の詳細は未確認。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "因果探索には明示的な認識基準が要る", "title": "Causal discovery needs explicit epistemic standards", "url": "https://arxiv.org/abs/2611.03166", "authors": "Harald Kugler ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Kugler, H., Henckel, L., & Weichwald, S. (2026). Causal discovery needs explicit epistemic standards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03166", "why": "多数ある因果探索アルゴリズムを選ぶための原則を提案。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多数ある因果探索アルゴリズムを比べ、選ぶための共有された認識の基準がないと論じた（抄録）。", "p3": "手法の比較に使われる識別可能性・一致性・ベンチマークの3つの観点を検討し、それぞれが検証できないデータ生成過程の仮定を持ち込むことを示す（抄録）。", "p5": "識別可能性の仮定は原理より慣習で選ばれがちで、一様な一致性にはさらに検証できない仮定が要ることを示した（抄録）。", "fun": "データから「何が何の原因か」を自動で見つける道具は、たくさん作られています。でも、どの道具が良いかを決める物差し自体があいまいだ、とこの論文は指摘します。物差しの裏にある前提が確かめられないまま「慣れているから」で選ばれている、という耳の痛い問題提起です。", "unverified": "提案する基準の具体的な内容は未確認。"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "因果の仮定違反に対する一般的な感度分析", "title": "A General Approach for Assessing Sensitivity to Violations of Causal Assumptions", "url": "https://arxiv.org/abs/2611.02239", "authors": "Guilherme Duarte", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Duarte, G. (2026). A General Approach for Assessing Sensitivity to Violations of Causal Assumptions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02239", "why": "さまざまな因果の仮定の違反に適用できる感度分析の一般的方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "特定の設計に限らず、幅広い離散の因果モデルと推定対象に使える感度分析の枠組みを示した（抄録）。", "p3": "仮定を緩める母集団の最大割合の関数として因果推定対象の鋭い上下限を導く。一般化した主層別の考え方で、仮定・推定対象・データを多項式の制約に翻訳する（抄録）。", "p5": "既存の感度分析が個別の設計向けに作られている限界を、一般的な枠組みで扱えるようにした（抄録。適用例の結果は未確認）。", "fun": "因果の結論は、いくつかの前提が正しいことに支えられています。では「前提が全体の何割で破れていたら結論がひっくり返るか」。この研究は、その問いに多くの場面で共通に答えられる方法を作りました。結論の「もろさ」を一つの数字で語れるようにする試みです。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "干渉下でミニマックス最適な静的推定量", "title": "Minimax-Optimal Static Estimators Under Interference", "url": "https://arxiv.org/abs/2611.02048", "authors": "Arthur Delarue ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Delarue, A., & Lobel, I. (2026). Minimax-Optimal Static Estimators Under Interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02048", "why": "無作為化実験で単位間の干渉があるときの全体処置効果の推定。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "単位間の干渉がある無作為化実験で、全体処置効果のミニマックス最適な静的推定量を導いた（抄録）。", "p3": "結果と干渉が有界な関数の類から敵対者が結果関数を選ぶミニマックスの枠組みで、ある単位の処置が他の単位の結果に与える最大の影響をスカラーδで表す（抄録）。", "p5": "幅広い干渉の構造に頑健な推定量を導き、干渉が大きい場合の性質も示した（抄録。後半は抄録で切れている）。", "fun": "ワクチンの効果を調べるとき、隣の人が打つと自分も感染しにくくなるので、一人ずつの比較では全体の効果を見誤ります。この「干渉」の形が分からなくても、最悪の場合でも大きく外さない推定の方法を、ゲームの相手を想定する考え方で導きました。", "unverified": "干渉が大きい場合の結論は未確認。"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "測定誤差と非線形交絡：SEM対二重機械学習", "title": "Measurement Error and Nonlinear Confounding: Structural Equation Modeling Versus Double Machine Learning", "url": "https://arxiv.org/abs/2611.01375", "authors": "Eunjeong Song ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Song, E., & Hong, S. (2026). Measurement Error and Nonlinear Confounding: Structural Equation Modeling Versus Double Machine Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01375", "why": "誤差のある指標で測った潜在交絡の調整で、SEMとDMLを比べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "誤差のある指標で測った潜在交絡の調整で、SEMと二重機械学習のどちらの偏りが小さいかの境目を導いた（抄録）。", "p3": "測定誤差を補正するが関数形の指定が要る構造方程式モデリング（SEM）と、関数形を学ぶが測定誤差を無視する二重機械学習（DML）の母集団の偏りを導き、46条件のモンテカルロ実験で確かめた（抄録）。", "p5": "DMLの方が線形SEMより偏りが小さくなる合成信頼性の境目（クロスオーバー信頼性）は、交絡の非線形の割合に依存し、共変量が交絡を予測すると下がる（抄録）。", "fun": "体重計が不正確でも、何度も量れば誤差は補正できます。一方、体重と健康の関係が曲線なら、まっすぐな線を仮定すると外れます。この研究は「測り方の誤差」と「関係の形の誤り」のどちらを重く見るべきかを、物差しの信頼性という一つの数で判断できるようにしました。", "unverified": "なし"}}, {"id": "pn44", "rank": 44, "field": "交通・都市計画", "headline": "空間均衡で交通改善を評価する", "title": "Evaluating transport improvements in spatial equilibrium", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141748", "authors": "Redding, Stephen J.", "venue": "RePEc NEP", "date": "2026-11-02", "why": "定量的都市モデルで交通改善の効果を評価する方法の整理。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "交通改善の評価で、従来の費用便益分析と定量的都市モデルの結果が違うことを比べて示した（抄録）。", "p3": "部分均衡の従来の費用便益分析、市場アクセスの変化に基づく十分統計量の方法、モデルに基づく反実仮想の3つで、同じ交通改善を評価して比べた（抄録）。", "p5": "定量的都市モデルは都市内の経済活動の再編を予測する（抄録。評価額の違いは抄録で切れており未確認）。", "fun": "新しい鉄道ができると、移動時間が縮むだけではありません。人が住む場所や会社の場所も動き、街の形が変わります。従来の評価は「時間の節約」だけを数えがちでした。この研究は、街全体の組み替えまで含めると評価がどう変わるかを、三つの方法を並べて比べました。", "unverified": "評価額の比較の数値は未確認。"}}, {"id": "pn45", "rank": 45, "field": "交通・都市計画", "headline": "交通政策の受容をファクトリアル実験で測る", "title": "Acceptance of transport policies: A factorial survey experiment in the German Longitudinal Environmental Study (GLEN)", "url": "https://doi.org/10.31235/osf.io/dyz7c", "authors": "Christiane Bozoyan ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Bozoyan, C., Schmiedeberg, C., & Best, H. (2026). Acceptance of transport policies: A factorial survey experiment in the German Longitudinal Environmental Study (GLEN). https://doi.org/10.31235/osf.io/dyz7c", "why": "ドイツの縦断環境調査での実験から、交通政策の受容を分析。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ドイツで議論中の、内燃機関車から電気自動車への移行を促す交通政策の受容を測るファクトリアル調査実験を報告した（抄録）。", "p3": "2025年1〜2月のドイツ縦断環境調査（GLEN）の開始調査の一部として、政策介入の組み合わせを変えるファクトリアル調査実験を行った（抄録）。", "p5": "本報告は実験の記録で、抄録の範囲では受容の結果は未確認。", "fun": "「ガソリン車に税をかける」「電気自動車に補助金を出す」など、政策は組み合わせ方で賛成の度合いが変わります。ファクトリアル調査は、条件をいろいろに組み替えた架空の政策を見せて、どの要素が賛否を動かすかを切り分けます。政策づくりの前に、人々の受け止め方を試す方法です。", "unverified": "実験の結果は未確認（記録の報告）。"}}, {"id": "pn46", "rank": 46, "field": "交通・都市計画", "headline": "電動モビリティの見た目が路上の弱さを左右", "title": "Visual Properties of E-Mobility Devices Shape Their On-Road Vulnerability: Effects of Size and Speed", "url": "https://doi.org/10.31234/osf.io/zy8gv_v2", "authors": "Laura Wang ほか", "venue": "PsyArXiv", "date": "2026-11-02", "apa": "Wang, L., Jarvis, M., Du Plessis, E., Stephen, A., Jones, B., Haworth, N., & Hogendoorn, H. (2026). Visual Properties of E-Mobility Devices Shape Their On-Road Vulnerability: Effects of Size and Speed. https://doi.org/10.31234/osf.io/zy8gv_v2", "why": "大きさと速さの見え方が、運転者の電動モビリティの認知に与える影響。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "電動キックボードなどの電動モビリティは、小さく速いために運転者の到着予測を系統的に誤らせるかを調べた（抄録）。", "p3": "自然な動画の刺激を使い、観察者が電動モビリティを他の一般的な車両と比べて判断するときの系統的な偏りを調べた（抄録）。", "p5": "抄録の範囲では、大きさと速さの効果の結果は未確認。", "fun": "交差点で右折するとき、運転者はわずか一瞬で「向こうの車が来るまでに曲がれるか」を判断します。小さな物は遠くに、ゆっくりに見えがちです。電動キックボードは小さいのに速いので、この直感がだまされやすいのではないか、という身近で大事な問いです。", "unverified": "実験の結果は抄録で切れており未確認。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "結果を知りながら投票する：ペルー大統領選", "title": "Voting When You Already Know the Results: Electoral Information and Strategic Coordination in Peru’s 2026 Presidential Election", "url": "https://doi.org/10.31235/osf.io/dzntx", "authors": "Alejandro Plaza", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Plaza, A. (2026). Voting When You Already Know the Results: Electoral Information and Strategic Coordination in Peru’s 2026 Presidential Election. https://doi.org/10.31235/osf.io/dzntx", "why": "開票途中の情報が有権者の戦略的な調整を促すかを分析。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "開票途中の情報を知った有権者は、思想の近い範囲で最も有力な候補に寄る「思想に制約された調整」をすると論じ、自然実験で検証した（抄録）。", "p3": "2026年のペルー大統領選で、運営の失敗により一部の投票所が部分的な結果の公表後に1日遅れて投票した自然実験を使う（抄録）。", "p5": "抄録の範囲では推定結果は未確認。", "fun": "途中経過を知ってから投票できたら、人は「勝ち馬」に乗るでしょうか。この研究は、ペルーで一部の投票所が一日遅れたという偶然を使いました。人は全国の首位に流れるのではなく、自分の考えに近い候補の中で一番有力な人に票を寄せる、という仮説を確かめています。", "unverified": "推定結果は未確認。"}}, {"id": "pn48", "rank": 48, "field": "政治学", "headline": "選挙不正検出モデルを韓国20年の選挙で検証", "title": "Fraud Detection Without Specificity: A Null-Calibration Evaluation of the eforensics Model on Two Decades of Korean Elections", "url": "https://doi.org/10.31235/osf.io/6ka47", "authors": "Minseong Kim", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Kim, M. (2026). Fraud Detection Without Specificity: A Null-Calibration Evaluation of the eforensics Model on Two Decades of Korean Elections. https://doi.org/10.31235/osf.io/6ka47", "why": "ベイズ混合モデルによる選挙不正検出の特異度を、帰無較正で評価。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "集計データだけから不正を判定する選挙鑑識モデルを、不正のない合成対照で検証し、特異度がないことを示した（抄録）。", "p3": "eforensicsの準二項ロジスティックモデルを2002〜2025年の韓国の選挙に228回当てはめ、各実データの投票率に合わせて独立に作った不正のない合成対照2種と比べた（抄録）。", "p5": "題名のとおり、不正のないデータでも不正を検出してしまい、特異度を欠くことを示した（抄録の題名と要旨。率の数値は未確認）。", "fun": "病気の検査が、健康な人まで「陽性」と判定するなら役に立ちません。この研究は、選挙の不正を見つけるとされる統計モデルに、わざと不正のない作り物のデータを与えました。すると、そこでも「不正あり」と出たのです。道具を使う前に、まず白紙の答案で試す大切さが分かります。", "unverified": "誤検出の割合は未確認。"}}, {"id": "pn49", "rank": 49, "field": "政治学", "headline": "政治学のための順位データ", "title": "Ranking Data in Political Science", "url": "https://doi.org/10.31235/osf.io/5t2f9", "authors": "Yuki Atsusaka ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Atsusaka, Y., & Singh, S. (2026). Ranking Data in Political Science. https://doi.org/10.31235/osf.io/5t2f9", "why": "順位づけデータを政治学で使う方法と注意点の整理。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "主要な政治学誌の研究に基づく、初の大規模な政治的順位データのデータベースを作った（抄録）。", "p3": "統計学・機械学習のPrefLibのような既存の基盤は社会科学の累積的研究向けに作られていないため、政治学の研究から順位データを集めて整理した（抄録）。", "p5": "抄録の範囲では収録件数などの数値は未確認。", "fun": "「好きな政党を順に並べてください」という質問から得られる順位のデータは、賛否の二択より多くを語ります。でも研究ごとにばらばらに保存され、比べにくいのが現状でした。この研究は、それらを一か所に集めて誰でも使えるようにしました。研究の積み重ねを助ける土台づくりです。", "unverified": "収録件数は未確認。"}}, {"id": "pn50", "rank": 50, "field": "政治学", "headline": "反汚職の訴えはいつ支持につながるか", "title": "When Does Anticorruption Pay off? Voter Support for Anticorruption Efforts in Latin America", "url": "https://doi.org/10.31235/osf.io/qvhxy", "authors": "Gustavo Guajardo", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Guajardo, G. (2026). When Does Anticorruption Pay off? Voter Support for Anticorruption Efforts in Latin America. https://doi.org/10.31235/osf.io/qvhxy", "why": "中南米での反汚職を掲げる政治家への有権者の支持を分析。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "政治家の反汚職の訴えは、文脈・発信者・政策の中身から本気度を読み取られて評価されることを示した（抄録）。", "p3": "コロンビアとメキシコでの2つの独自の調査実験で、汚職の文脈、訴える人、政策の内容を変えた（抄録）。", "p5": "最近の汚職スキャンダルがないとき、提案者が野党の政治家のときに評価が好意的だった（抄録。その他の条件は抄録で切れている）。", "fun": "「汚職をなくします」と言うだけなら誰でもできます。有権者は、誰がどんな状況でそれを言うかを見て、本気かどうかを判断しています。この研究は、スキャンダルの直後の与党の訴えより、野党の訴えのほうが信じられやすいことを実験で示しました。言葉の中身より、言う人の立場が効くのです。", "unverified": "政策内容の効果は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "橋梁振動AI診断794研究の成熟度を監査", "title": "AI-Enabled Bridge Nondestructive Testing Using Vibration and Dynamic Response: An Investigation of Diagnostic Capability and Evidence Maturity", "url": "htt pa": "Dong, L., Wang, S., & Lu, C. (2026). Data-Driven Prediction Method for the Seismic Response of Cable-Stayed Bridges and Cross-Structure Calibration Motion Design. Buildings, 16(21), 4366. https://doi.org/10.3390/buildings16214366", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "新しい斜張橋の地震応答の代理モデルを、1回の非線形時刻歴解析だけで較正する合成較正地震動を設計した（抄録）。", "p3": "主径間210〜980mの浮体式斜張橋100橋と実際の2方向地震動100組から10,000の応答履歴のベンチマークを作り（入力の水平最大加速度は0.29g以下）、11の代理モデル手法を非線形時刻歴解析と比べた（抄録）。", "p5": "抄録の範囲では代理モデルの精度の数値は未確認。", "fun": "橋の耐震性を確かめる詳しい計算は、1回でも重く、普通は何十回も繰り返します。この研究は、色々な揺れの特徴を一本に詰め込んだ「特製の揺れ」を作り、1回の計算だけで予測モデルを合わせ込めるようにしました。百の橋と百の地震で作った大きな練習帳があってこそできる工夫です。", "unverified": "代理モデルの誤差の数値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "適応拡張カルマンでハイブリッド実験のモデル更新", "title": "Model updating method for real-time hybrid simulation based on adaptive extended Kalman filter", "url": "https://doi.org/10.1016/j.istruc.2026.113384", "authors": "Yuanfeng Duan ほか", "venue": "Structures", "date": "2026-11-03", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Duan, Y., Liu, J., Deng, N., Su, L., Zhang, H., Cheng, J. J. R., & Yun, C. B. (2026). Model updating method for real-time hybrid simulation based on adaptive extended Kalman filter. Structures, 94, 113384. https://doi.org/10.1016/j.istruc.2026.113384", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、実時間ハイブリッドシミュレーションで、適応拡張カルマンフィルタによりモデルを更新する方法を提案した論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、実験と計算を同時に走らせる「ハイブリッド実験」で、計算側のモデルをその場で直していけるか、です。実物の一部だけを揺らし、残りを計算で補うとき、計算の模型がずれていれば結果全体が狂います。測りながら模型を合わせ込むという発想です。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "表形式基盤モデルで雑音に強い信頼性解析", "title": "Noise-robust active-learning structural reliability analysis using an in-context tabular foundation model with conformal calibration", "url": "https://doi.org/10.1016/j.istruc.2026.113323", "authors": "Anh-Tuan Vu ほか", "venue": "Structures", "date": "2026-11-03", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Vu, A.-T., Do, K.-A., Nguyen, T.-T., & Dang, V.-H. (2026). Noise-robust active-learning structural reliability analysis using an in-context tabular foundation model with conformal calibration. Structures, 94, 113323. https://doi.org/10.1016/j.istruc.2026.113323", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、文脈内学習の表形式基盤モデルと適合的較正を使い、雑音に強い能動学習の構造信頼性解析を提案した論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、構造物が壊れる確率を、少ない計算回数で、しかも計算結果に雑音があっても見積もれるか、です。どこを計算すべきかをAIに選ばせつつ、その予測の自信の幅を統計的に保証する、という二つの道具の組み合わせが題名に表れています。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "環境を考慮したGNSSデータセット", "title": "An Environment-Aware GNSS Dataset", "url": "https://doi.org/10.1038/s41597-026-08460-0", "authors": "Qi Yao ほか", "venue": "Scientific Data", "date": "2026-11-03", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Yao, Q., Dong, J., Dong, C., Yang, J., & Huang, M. (2026). An Environment-Aware GNSS Dataset. Scientific Data. https://doi.org/10.1038/s41597-026-08460-0", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexで見つけた同じ記録（Zenodoのデータ記述）の抄録を使用", "preprint": false, "short": true, "p1": "周囲の遮蔽環境の違う複数地点で、複数の衛星系・周波数のGNSS観測を集めたデータセットを公開した（抄録）。", "p3": "固定観測点11か所と同期観測点3か所の生のUBXメッセージ、処理済みの衛星×時刻の観測行列、地点の情報を含む。固定点は開けた空・建物遮蔽・植生遮蔽・混合の各環境で衛星の可視周期を網羅する（抄録）。", "p5": "同期観測は同じ時刻・衛星配置・周波数の条件での比較に使え、電離層などの解析に使えるとした（抄録）。", "fun": "GPSの精度は、空が開けているか、ビルや木に囲まれているかで大きく変わります。でも条件をそろえて比べるデータは意外に少ないのです。この研究は、同じ時刻に違う環境で同時に測ったデータを公開しました。「場所の違い」だけを取り出して比べられるのが価値です。", "unverified": "データの期間と規模は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "DEMで粒状ダンパーのエネルギー散逸を解明", "title": "Study on the Vibration-Damping Mechanism of Granular Dampers Based on the Discrete Element Method", "url": "https://doi.org/10.3390/pr14213518", "authors": "Zhi Zhang ほか", "venue": "Processes", "date": "2026-11-03", "citescore": 5.7, "citescore_year": "2025", "apa": "Zhang, Z., Li, N., Zhang, Q., Deng, T., Ni, H., Chen, K., Zou, B., & Shi, Y. (2026). Study on the Vibration-Damping Mechanism of Granular Dampers Based on the Discrete Element Method. Processes, 14(21), 3518. https://doi.org/10.3390/pr14213518", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "個別要素法で粒状ダンパーの正弦加振下のエネルギー散逸の仕組みを調べた（抄録）。", "p3": "粒子要素とクランプ要素の2つの作り方を比べてクランプ要素を選び、ヘルツ接触モデルと単一粒子の跳ね返り実験で摩擦係数と法線の臨界減衰比を較正した（抄録）。", "p5": "抄録の範囲では、散逸の内訳など主要な結果の数値は未確認。", "fun": "箱に砂を入れて揺れる物に取り付けると、粒どうしがぶつかりこすれ合って、振動のエネルギーが熱に変わり揺れが収まります。この研究は、その一粒一粒の衝突を計算で再現し、どの擦れ方が効いているかを調べました。電気も制御もいらない、粒だけの揺れ止めです。", "unverified": "散逸機構の定量的な結果は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "DEMとCSTR網で充填層反応器を縮約", "title": "DEM ‐ CSTR network model for packed‐bed reactor: A particle‐resolved reduced‐order modeling approach", "url": "https://doi.org/10.1002/aic.70753", "authors": "Yupeng Du ほか", "venue": "AIChE Journal", "date": "2026-11-02", "citescore": 7.9, "citescore_year": "2025", "apa": "Du, Y., Liu, S., Liu, Z., Li, S., Li, Y., Liu, Y., Zhang, C., Chen, X., Tian, H., & Yang, C. (2026). DEM ‐ CSTR network model for packed‐bed reactor: A particle‐resolved reduced‐order modeling approach. AIChE Journal. https://doi.org/10.1002/aic.70753", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "触媒粒子を完全混合槽の節点、粒子の接触を有向辺に対応させ、充填層反応器の計算を約5桁速くした（抄録）。", "p3": "個別要素法で作った充填層の各触媒粒子を連続撹拌槽（CSTR）の節点に、接触を有向辺に写す網のモデルで、幾何の不均一性を保ったまま粒子解像の数値流体計算を縮約した（抄録）。", "p5": "計算時間は8時間から3秒になり、粒子解像CFDの滞留時間と反応率の予測を相対偏差2%以内で再現した（抄録）。", "fun": "粒がぎっしり詰まった筒に気体を流す反応器では、流れを細かく計算すると何時間もかかります。この研究は、一粒を一つの「小さなかき混ぜ鍋」、粒の接点を「鍋をつなぐ管」とみなして、網目の計算に置き換えました。8時間が3秒になったのに結果はほぼ同じ、という大胆な単純化です。", "unverified": "なし"}}, {"id": "jr22", "rank": 22, "headline": "ハンケル型縮約モデルとTCNで風圧予測", "title": "Wind field and pressure prediction of a ground-mounted rectangular cylinder based on Hankel-inspired reduced order model and temporal convolutional network-transformer", "url": "https://doi.org/10.1063/5.0351583", "authors": "Wei Lu ほか", "venue": "Physics of Fluids", "date": "2026-11-03", "citescore": 5.4, "citescore_year": "2025", "apa": "Lu, W., Lu, Z., Hu, G., Zhang, H., Chen, J., & He, J. (2026). Wind field and pressure prediction of a ground-mounted rectangular cylinder based on Hankel-inspired reduced order model and temporal convolutional network-transformer. Physics of Fluids, 38(11). https://doi.org/10.1063/5.0351583", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "時間遅れ埋め込みを使うハンケル型縮約モデルとTCN-Transformerを組み合わせ、地表の矩形柱まわりの風速場と表面圧を予測した（抄録）。", "p3": "時間遅れ埋め込みで拡大した力学の位相空間を再構成し、縮約表現が剥離・せん断層・後流の大規模なモードの時間発展を保つようにした（抄録）。", "p5": "縮約モデルが流れの剥離やせん断層、後流に関わる主要な大規模モードを抽出できることを示した（抄録。予測誤差の数値は未確認）。", "fun": "建物のまわりの風は、渦が生まれては流れ去る複雑な動きをします。この研究は「今の様子」だけでなく「少し前の様子」も並べて見ることで、渦の動きの流れを捉えやすくしました。過去の何コマかを重ねて見ると動きの向きが分かる、パラパラ漫画のような発想です。", "unverified": "予測精度の数値は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "降雨と洪水の連成で渓岸が崩れる過程を実験", "title": "Experimental Investigation on Debris Flow Gully Bank Instability Triggered by Coupled Rainfall and Flood", "url": "https://doi.org/10.1155/gfl/1342119", "authors": "Kang Yan ほか", "venue": "Geofluids", "date": "2026-11-03", "citescore": 3.9, "citescore_year": "2025", "apa": "Yan, K., Tang, K., Chen, Z., Dong, S., & Qi, Z. (2026). Experimental Investigation on Debris Flow Gully Bank Instability Triggered by Coupled Rainfall and Flood. Geofluids, 2026(1). https://doi.org/10.1155/gfl/1342119", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "先行降雨の有無で、洪水による渓岸の崩れ方がどう変わるかを水路実験で示した（抄録）。", "p3": "先行降雨ありとなしの2条件で洪水を与える水路模型実験を行い、2方向の画像系と間隙水圧センサで崩壊の様子と地中の水理応答を観測した（抄録）。", "p5": "洪水による渓岸の崩壊は、典型的な後退性の地すべりとして現れた（抄録。先行降雨の効果は抄録で切れており未確認）。", "fun": "土石流の土砂は、谷の岸が崩れることで供給されます。雨で岸が湿っている時と乾いている時では、同じ洪水でも崩れ方が違うはずです。この研究は、小さな水路で雨と洪水を再現し、岸の内部の水の圧力を測りながら崩れる様子を記録しました。災害の「仕込み」の段階を見る実験です。", "unverified": "先行降雨の有無による違いは未確認。"}}, {"id": "jr24", "rank": 24, "headline": "FDM-DEM連成でコーン貫入の応力低減を解析", "title": "The FDM-DEM Coupled Method for Studying the Stress Reduction Characteristics of the Cone Penetration Test", "url": "https://doi.org/10.3390/geotechnics6040112", "authors": "Daofei Tang ほか", "venue": "Geotechnics", "date": "2026-11-02", "citescore": 3.8, "citescore_year": "2025", "apa": "Tang, D., & Meng, Y. (2026). The FDM-DEM Coupled Method for Studying the Stress Reduction Characteristics of the Cone Penetration Test. Geotechnics, 6(4), 112. https://doi.org/10.3390/geotechnics6040112", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "コーン貫入試験で、コーンの肩から周面摩擦スリーブにかけて半径方向の応力が下がる程度を、FDM-DEM連成で定量化した（抄録）。", "p3": "円筒空洞拡張理論で周面摩擦を解釈するとき、肩を通過した後の除荷と応力再配分のため、限界空洞拡張応力はスリーブに働く応力を表さない。これを有限差分と個別要素の連成モデルで調べた（抄録）。", "p5": "応力低減の大きさとその仕組みを定量化した（抄録。数値は未確認）。", "fun": "地盤の強さを調べるために、先のとがった棒を地中に押し込む試験があります。棒の側面に働く摩擦から土の性質を読み取りますが、先端が通り過ぎた後の土は少しゆるんでいます。この研究は、土を粒の集まりとして計算し、そのゆるみの大きさを確かめました。読み取りの誤差の原因を正す研究です。", "unverified": "応力低減の比率の数値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "薄い柔軟層の衝突を変剛性接触モデルで表現", "title": "A variable-stiffness contact model for the impact of a flexible thin layer on a rigid substrate", "url": "https://doi.org/10.1016/j.ymssp.2026.115168", "authors": "Jie Zhang ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-03", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Zhang, J., Xi, Y., Liu, L., Li, W., Xiong, L., Zhao, Q., Zhao, Z., Zhao, L., Yuan, J., "p3": "脱植民地の枠組みで生活経験と共同体の知を中心に据え、2025年7〜9月にダッカ、ラジシャヒ、パブナで、移動・知的・発話の障害のある人に8件の半構造化面接を行った（抄録）。", "p5": "抄録の範囲では、主な知見の詳細は未確認。", "fun": "地震や洪水と違い、熱波は建物を壊さないので「見えない災害」と呼ばれます。でも、暑さから逃げにくい人にとっては命に関わります。この研究は、障害のある人が実際にどう暑さをしのいでいるかを本人の言葉から集めました。災害対策を、最も影響を受ける人の目線から見直す試みです。", "unverified": "面接から得られた主要なテーマは未確認。"}}, {"id": "jr29", "rank": 29, "headline": "地域食料支援の世帯・週単位の原価計算", "title": "Household-week measurement and cost accounting for community food provisioning: framework specification and partial pilot demonstration", "url": "https://doi.org/10.3389/fsufs.2026.1813246", "authors": "Craig Steven Wright", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-11-03", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "apa": "Wright, C. S. (2026). Household-week measurement and cost accounting for community food provisioning: framework specification and partial pilot demonstration. Frontiers in Sustainable Food Systems, 10. https://doi.org/10.3389/fsufs.2026.1813246", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "地域の食料支援を、世帯×週の単位で提供義務と実績・原価を結びつけて記録する枠組みを示した（抄録）。", "p3": "収穫・損失・配布・労働参加・費用・水の6つの記録を、事前に宣言した提供義務（受給者×提供期間×パラメータの組）に結びつけ、週を標準の期間とする方法論の論文（抄録）。", "p5": "この設計への最も強い反論（結合は事実表の粒度にすぎない、など）を述べたうえで、部分的な試行で示した（抄録。試行の数値は未確認）。", "fun": "「今年は野菜を1トン配りました」という報告では、困っている家庭に毎週きちんと届いたかは分かりません。この研究は、記録の単位を「どの家庭に、どの週に」に変えて、量だけでなく約束が守られたかを測れるようにしました。会計の「何を一単位として数えるか」の選び方が、支援の見え方を変えます。", "unverified": "試行の結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "SMOTEが財務困窮予測と特徴量重要度に与える影響", "title": "Analyzing the Impact of SMOTE on Predictive Performance and Random Forest Feature Importance Stability in Financial Distress Prediction", "url": "https://doi.org/10.32520/stmsi.v15i10.6935", "authors": "Alan Kusuma Soesanto ほか", "venue": "SISTEMASI", "date": "2026-10-31", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "財務困窮予測でSMOTEを使うと、少数クラスの検出は上がっても特徴量重要度の安定性に影響することを調べた（抄録）。", "p3": "台湾の企業倒産データ（6,819社）でランダムフォレストを学習し、SMOTEの有無で予測性能と特徴量重要度の一貫性を比べた（抄録）。", "p5": "抄録の範囲では、性能と安定性の結果の数値は未確認。", "fun": "倒産する会社は全体のごく一部なので、AIは「みんな倒産しない」と答えるだけで高い正解率になってしまいます。そこで少数派の例を人工的に増やすのがSMOTEです。でも、増やしたせいで「どの指標が効いているか」の説明がぶれるなら、説明として信用できません。予測と説明の両立を問う研究です。", "unverified": "倒産企業の数と結果は抄録で切れており未確認。"}}, {"id": "jr31", "rank": 31, "headline": "隠れたコストの会計が家族企業の変革を媒介", "title": "Moving beyond the invisible: hidden cost accounting as a mediating device for organizational change in crisis-stricken small family-owned businesses", "url": "https://doi.org/10.1108/jaoc-01-2026-0067", "authors": "Alexan Hagopian ほか", "venue": "Journal of Accounting & Organizational Change", "date": "2026-11-02", "citescore": 7.1, "citescore_year": "2025", "apa": "Hagopian, A., & Baker, C. R. (2026). Moving beyond the invisible: hidden cost accounting as a mediating device for organizational change in crisis-stricken small family-owned businesses. Journal of Accounting & Organizational Change, 1–29. https://doi.org/10.1108/jaoc-01-2026-0067", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "危機下の小規模な家族企業で、隠れたコストの計算が組織の意味づけと専門職化を媒介することを示した（抄録）。", "p3": "社会経済的経営アプローチ（SEAM）とそのクオリメトリクスの手順を使う介入研究で、レバノンの工業系の小規模家族企業を縦断的に追った事例研究（抄録）。", "p5": "隠れたコストの計算は、非公式な機能不全を見えるようにし、話し合え、管理の手順に結びつけられるものにし、媒介する会計表現として働いた（抄録）。", "fun": "会社の「むだ」は、帳簿に載らないことが多いものです。例えば手戻りや欠勤の穴埋めにかかる時間です。この研究は、そうした隠れたコストをお金に換算して見せることで、家族経営の会社が「なんとなくの不満」を具体的な改善の話題に変えられたことを示しました。数字が話し合いの共通語になる例です。", "unverified": "隠れたコストの金額は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "グリーンなブランド資産は失敗時に守るか燃えるか", "title": "Does Green Brand Equity Buffer or Burn? Understanding Boundary Conditions in Justice Evaluations of Sharing Economy Service Failure", "url": "https://doi.org/10.1515/roms-2026-0070", "authors": "Taiba Musadiq Sahaf ほか", "venue": "Review of Marketing Science", "date": "2026-11-02", "citescore": 2.1, "citescore_year": "2025", "apa": "Sahaf, T., & Fazili, A. (2026). Does Green Brand Equity Buffer or Burn? Understanding Boundary Conditions in Justice Evaluations of Sharing Economy Service Failure. Review of Marketing Science. https://doi.org/10.1515/roms-2026-0070", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "シェアリングエコノミーのサービス失敗で、グリーンなブランド資産が回復の公正評価とロイヤルティの関係を守るか損なうかを調べた（抄録）。", "p3": "グリーンなブランド資産を、道徳的な信号・規範的な期待・価値を帯びたアイデンティティの手がかりとみなし、期待不一致と同化・カテゴリー化の判断の対立から役割を検討した（抄録）。", "p5": "抄録の範囲では、どの役割が支持されたかは未確認。", "fun": "「環境にやさしい」と評判の会社が失敗したとき、客は「いつもいい会社だから」と許すでしょうか、それとも「期待していたのに」と余計に怒るでしょうか。この研究は、良い評判がクッションにも火種にもなりうるという二面性を、サービスの失敗と回復の場面で確かめようとしています。", "unverified": "研究の方法と結果は抄録で切れており未確認。"}}, {"id": "jr33", "rank": 33, "headline": "企業の社会的無責任がブランド憎悪と悪い口コミへ", "title": "Corporate social irresponsibility unleashed: igniting brand hate and betrayal to fuel negative eWOM", "url": "https://doi.org/10.1108/srj-12-2025-1333", "authors": "Davood Ghorbanzadeh ほか", "venue": "Social Responsibility Journal", "date": "2026-11-02", "citescore": 9.6, "citescore_year": "2025", "apa": "Ghorbanzadeh, D., Elsayed, A. M., Karimov, N., Chandra, S., Prasad, K. D. V., & Alhitmi, H. K. (2026). Corporate social irresponsibility unleashed: igniting brand hate and betrayal to fuel negative eWOM. Social Responsibility Journal, 1–16. https://doi.org/10.1108/srj-12-2025-1333", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "企業の社会的無責任が、ブランド憎悪と裏切られ感を通じてSNSでの否定的な口コミを生むことを、集団主義の文化圏で調べた（抄録）。", "p3": "イランのテヘランの消費者への横断的な調査を、偏最小二乗の構造方程式モデリングで分析した（抄録）。", "p5": "抄録の範囲では、媒介効果の大きさは未確認。", "fun": "会社が不祥事を起こすと、客は「嫌い」になるだけでなく「裏切られた」と感じます。この研究は、その二つの気持ちが、SNSでの悪い口コミにつながる道筋を調べました。個人より集団の和を重んじる文化で、怒りがどう広がるかに注目しているのが特徴です。", "unverified": "結果の数値は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "顧客から製造者へ：プラットフォームの協業範囲", "title": "EXPRESS: Customer-to-Manufacturer: Should a Platform Cooperate with More Manufacturers?", "url": "https://doi.org/10.1177/10591478261507271", "authors": "Tonghuan Shi ほか", "venue": "Production and Operations Management", "date": "2026-11-03", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Shi, T., Tian, L., & Xu, Z. (2026). EXPRESS: Customer-to-Manufacturer: Should a Platform Cooperate with More Manufacturers? Production and Operations Management. https://doi.org/10.1177/10591478261507271", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "消費者の声を製造者に直接届けるC2Mモデルで、プラットフォームが何社の製造者と協力すべきかを分析モデルで調べた（抄録）。", "p3": "1つのプラットフォームと競合する2つの製造者からなるオンライン市場で、C2Mモデルの戦略的な採用を分析する理論モデル（抄録）。", "p5": "抄録の範囲では、協力の範囲についての結論は未確認。", "fun": "新製品の多くは売れずに終わります。作る側が客の声を聞かずに作るからです。ネット通販の会社が客の声をメーカーに直接伝えれば、当たる製品が増えるかもしれません。でも、それをライバルのメーカー両方に教えるべきかは悩ましい問題です。情報の配り方の損得を数式で考える研究です。", "unverified": "モデルの主な結論は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "埋立処分の家計負担は費用配分の設計で決まる", "title": "Household affordability of sanitary landfilling is governed by cost allocation rather than metropolitan economic capacity", "url": "https://doi.org/10.1038/s43247-026-04208-1", "authors": "Yugo Sato ほか", "venue": "Communications Earth and Environment", "date": "2026-11-03", "sjr": 3.168, "citescore": 11.3, "citescore_year": "2025", "apa": "Sato, Y., & Chen, G. (2026). Household affordability of sanitary landfilling is governed by cost allocation rather than metropolitan economic capacity. Communications Earth & Environment. https://doi.org/10.1038/s43247-026-04208-1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "途上国の巨大都市で衛生埋立の家計負担を左右するのは、都市の経済力ではなく費用の配分の仕方だと示した（抄録）。", "p3": "埋立地の空間的な立地選定、工学的な正味現在価値モデル、衛星から推計した都市圏の総生産を組み合わせた都市規模の枠組みを、6つの途上国の巨大都市に適用した（抄録）。", "p5": "制度全体としての実行可能性が、家計にとっての負担可能性には結びつかないことを定量化した（抄録。数値は未確認）。", "fun": "ごみを野積みから衛生的な埋立地に変えるには、お金がかかります。都市全体としては払える額でも、それを誰がどれだけ負担するかで、貧しい家庭には重すぎることがあります。この研究は、問題は町の豊かさより「分け方」にあることを示しました。同じケーキでも切り方で不公平が生まれるのです。", "unverified": "6都市の具体的な結果は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "都市デジタルツインと行政におけるAIの役割", "title": "Roles of Artificial Intelligence in Urban Digital Twins and Governance", "url": "https://doi.org/10.3390/smartcities9110187", "authors": "Jenna-Riia Oldenburg ほか", "venue": "Smart Cities", "date": "2026-11-03", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Oldenburg, J.-R., & Virtanen, J.-P. (2026). Roles of Artificial Intelligence in Urban Digital Twins and Governance. Smart Cities, 9(11), 187. https://doi.org/10.3390/smartcities9110187", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "都市のデジタルツインと行政の中でAIが果たす役割を整理した（抄録）。", "p3": "行政の自動化、意思決定支援、市民との接点、予測分析など、交通・保健福祉・環境の各領域でのAIの利用を文献から検討した（抄録）。", "p5": "既存の証拠は主に内部の効率に集中しており、都市デジタルツインの中でのAIの役割は十分に示されていないとした（抄録）。", "fun": "街をまるごとコンピュータの中に写した「デジタルツイン」は、欧州の多くの都市で使われています。そこにAIが入ると何ができるのか。この論文は、これまでの成果が役所の仕事の効率化に偏っていて、市民にとっての価値や政策の質の向上はまだよく分かっていない、と整理しました。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "SNSの街並み投稿から集合的感情を読む", "title": "Evaluating urban street views through collective emotional perception from multimodal social media cityscape posts: An R-ECoT-based interpretable framework", "url": "https://doi.org/10.1016/j.landurbplan.2026.105822", "authors": "Jianyu Fu ほか", "venue": "Landscape and Urban Planning", "date": "2026-11-03", "sjr": 2.952, "citescore": 19.6, "citescore_year": "2025", "apa": "Fu, J., Wang, X., Ma, J., Zhao, C., Ogawa, Y., & Sekimoto, Y. (2027). Evaluating urban street views through collective emotional perception from multimodal social media cityscape posts: An R-ECoT-based interpretable framework. Landscape and Urban Planning, 278, 105822. https://doi.org/10.1016/j.landurbplan.2026.105822", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、SNSの街並みの投稿（画像と文）から集合的な感情の知覚を読み取り、解釈可能な枠組み（R-ECoT）で街路景観を評価する論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、人々がSNSに投稿する街の写真と言葉から、その街並みが「心地よい」「怖い」などとどう感じられているかを読み取れるか、です。一人の感想ではなく、大勢の投稿を重ねた「みんなの感じ方」を地図にする発想と読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "LLMと人間の文章の性格表現と知覚", "title": "Personality expression and perception in large language models and humans", "url": "https://doi.org/10.1038/s41598-026-75546-5", "authors": "Sophie T. Koerner ほか", "venue": "Scientific Reports", "date": "2026-11-03", "citescore": 6.4, "citescore_year": "2025", "apa": "Koerner, S. T., Egloff, B., & Osterholz, S. (2026). Personality expression and perception in large language models and humans. Scientific Reports, 16(1). https://doi.org/10.1038/s41598-026-75546-5", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "7つのLLMが自分をどう描写するかを人と比べ、性格の表れ方と知覚を調べた（抄録）。", "p3": "ChatGPT-4o、ChatGPT-3.5、Llama 3、Gemma、Gemini、Phi-3、Orca-2に、ビッグファイブ、自尊感情、自己愛の質問紙と、短い自己紹介文を引き出すプロンプトで回答させ、人の回答と比べた（抄録）。", "p5": "抄録の範囲では、人とLLMの違いや見分けやすさの結果は未確認。", "fun": "AIに「あなたはどんな性格ですか」と聞くと、どう答えるでしょう。この研究は、人と同じ性格テストをAIに受けさせ、自己紹介文も書かせて、人の答えと比べました。AIが描く「自分」は人間らしいのか、それとも見破れるほど違うのかを、心理学の物差しで確かめています。", "unverified": "結果は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "データ由来とLLM由来の指標重みを比較", "title": "Comparing Data-Derived and LLM-Elicited Indicator Weights for EU Circular Economy Assessment: An MCDA Study", "url": "https://doi.org/10.3390/su182111148", "authors": "Puren Veziroglu-Bicer", "venue": "Sustainability", "date": "2026-11-02", "citescore": 8.9, "citescore_year": "2025", "apa": "Veziroglu-Bicer, P. (2026). Comparing Data-Derived and LLM-Elicited Indicator Weights for EU Circular Economy Assessment: An MCDA Study. Sustainability, 18(21), 11148. https://doi.org/10.3390/su182111148", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "EUの循環経済指標の重みを、データから求めた場合とLLMに専門家役で求めさせた場合で比べた（抄録）。", "p3": "27か国・2022年の13指標について、CRITIC、エントロピー、MERECでデータ由来の重みを求め、2つのLLMに専門家ペルソナでAHPの一対比較をさせ、TOPSISとMARCOSで順位づけ。LLMの重みは繰り返しとプロンプトの変更で検証した（抄録）。", "p5": "抄録の範囲では、重みと順位の一致度の結果は未確認。", "fun": "国の環境の成績を比べるとき、どの指標を重く見るかで順位が変わります。この研究は、データの散らばりから機械的に決めた重みと、AIに「専門家になったつもりで」決めさせた重みを比べました。AIの判断が、人の専門家の代わりになりうるか、どれほど安定しているかを試す試みです。", "unverified": "比較の結果は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "汚職場面でLLMエージェントは合理的か道徳的か", "title": "Digital Homo Economicus or Homo Moralis? Assessing the rationality of LLM agents in corrupt situations", "url": "https://doi.org/10.46554/1993-0453-2026-10-264-189-199", "authors": "M. S. Sidorov ほか", "venue": "Vestnik of Samara State University of Economics", "date": "2026-10-31", "apa": "Sidorov, N. S., Kapustina, Iu. I., Apanovich, A. M., & Sidorov, S. B. (2026). Digital Homo Economicus or Homo Moralis? Assessing the rationality of LLM agents in corrupt situations. Vestnik of Samara State University of Economics, (10), 189–199. https://doi.org/10.46554/1993-0453-2026-10-264-189-199", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "汚職の場面を模擬し、LLMエージェントが経済合理的にふるまうか道徳的にふるまうかを調べた（抄録）。", "p3": "ベッカーの犯罪の経済理論とトヴェルスキー・カーネマンのフレーミング効果に基づき、汚職の取引をモンテカルロ・シミュレーションで定式化した（抄録）。", "p5": "抄録の範囲では結果は未確認。", "fun": "賄賂を受け取るかどうかを、損得だけで決める人もいれば、良心で断る人もいます。AIに同じ場面を与えたらどうするでしょう。この研究は、罰の確率や見返りの大きさ、話の言い回しを変えて、AIの判断が損得と道徳のどちらに傾くかを試しました。AIの「人柄」を経済学の目で調べる研究です。", "unverified": "結果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "ESG活動が従業員のwell-beingを高める経路", "title": "The Impact of ESG Activity on Employees' Psychological Wellbeing and Intention to Participate: The Mediating Effect of Authenticity, Organizational Trust, and Identification", "url": "http  "why": "チームの戦略実行におけるリーダーシップの役割を検証。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "組織の目的がチームの努力に与える意味を説くリーダーシップが、戦略の理解を通じてチームの戦略実行を動機づけることを論じた（抄録）。", "p3": "意味に基づくリーダーシップ理論を使い、リーダーが組織の目的の意味を説くことが、チームが戦略の実行にどう貢献できるかの共有理解を育てるという過程を示した（抄録）。", "p5": "抄録の範囲では、実証の結果と集団間リーダーシップの役割は未確認。", "fun": "会社の大きな目標は、現場のチームから見ると「自分たちに何の関係が」と感じがちです。この研究は、リーダーが「この仕事はこういう意味で会社の目的につながる」と語ることで、チームが自分たちの役割を理解し、戦略が動き出すと考えます。大きな話と目の前の仕事をつなぐ通訳としてのリーダーです。", "unverified": "実証の方法と結果は未確認。"}}, {"id": "jn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "美徳の逆説：組織の恥が変化への抵抗を生む", "title": "The virtue paradox: how perceived organizational social responsibility and organizational shame fuel resistance to change among motivated public servants", "url": "https://doi.org/10.1080/14719037.2026.2752047", "authors": "Marc Ohana ほか", "venue": "Public Management Review", "date": "2026-11-03", "sjr": 2.54, "citescore": 11.5, "citescore_year": "2025", "why": "組織の社会的責任の認知と恥の感情が、公務員の変化への抵抗を強める過程。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、組織の社会的責任の認知と組織の恥の感情が、意欲の高い公務員の変化への抵抗を強めるという逆説を扱う論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「良いことをしている職場」に誇りを持つ真面目な公務員ほど、かえって改革に抵抗するのはなぜか、です。立派な理想があるからこそ、それに届かない現実に恥を感じ、変化を拒む。美徳が裏目に出る逆説を扱っていると読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jn18", "rank": 18, "field": "政治学", "headline": "平和維持部隊の出入りが民間人への暴力に与える影響", "title": "Here Today, Gone Tomorrow: Dynamics of peacekeeper entry and exit on violence against civilians", "url": "https://doi.org/10.1177/01925121261492253", "authors": "Sky Kunkel ほか", "venue": "International Political Science Review", "date": "2026-11-03", "sjr": 1.344, "citescore": 7.0, "citescore_year": "2025", "why": "部隊の参入と撤退の時期による民間人への暴力の変化を分析。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "平和維持部隊の駐留は、反政府勢力の民間人への暴力を減らす一方、その地域の国家の暴力を増やし移動させることを示した（抄録）。", "p3": "2000〜2017年のアフリカ全域の平和維持部隊の展開の細かな位置データと、230万の観測による差の差分法で、反政府勢力と政府の暴力への影響を推定した（抄録）。", "p5": "平和維持部隊は地域の国家の暴力を増やして移動させ、反政府勢力の能力と民間人への暴力はおそらく減らした（抄録）。", "fun": "平和維持部隊が来れば、暴力は減るはずだと考えられてきました。この研究は、誰の暴力かを分けて見ると話が違うことを示しました。反政府勢力の暴力は減っても、政府側の暴力はむしろ増えたり、別の場所に移ったりします。全体の数字に隠れた「暴力の付け替え」を地図の細かさで見つけた点が鋭いところです。", "unverified": "撤退時の効果の詳細は抄録で切れており未確認。"}}, {"id": "jn19", "rank": 19, "field": "気候科学", "headline": "海面上昇は生態系サービスの価値を不均等に奪う", "title": "Sea-level rise drives unequal erosion of global ecosystem service value", "url": "https://doi.org/10.1093/pnasnexus/pgag339", "authors": "Hongyu Hu ほか", "venue": "PNAS Nexus", "date": "2026-11-03", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "why": "海面上昇による沿岸の生態系サービスの価値の損失を世界規模で評価。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "海面上昇による世界の生態系サービスの価値の損失を5つの社会経済経路で評価し、その偏りを示した（抄録）。", "p3": "IPCC第6次評価の予測と詳しい価値評価モデルを組み合わせ、2030〜2100年について5つのSSPに沿った海面上昇の経路で生態系サービスの価値の曝露を評価した（抄録）。", "p5": "2100年の所得調整済みの年間損失は、SSP3-7.0の1,300億6百万（130.06 billion）国際ドルからSSP5-8.5の3,394億1千万（339.41 billion）国際ドルまでの幅だった。不浸透面と農地が絶対損失の約59〜60%を占め、湿地の相対損失が最大だった（SSP1-1.9で1.21%、SSP5-8.5で2.20%）（抄録）。", "fun": "海面が上がると、海辺の湿地や農地が失われ、そこから人が受けていた恵みも失われます。この研究はその恵みをお金に換算し、世界全体でどれだけ失われるかを見積もりました。さらに、これまで二酸化炭素をあまり出してこなかった国の人ほど、一人あたりの損失が大きくなるというずれも示しています。", "unverified": "一人あたりの責任と損失のずれの数値は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "制度の弱い国の環境配慮型中小企業の資源の組み合わせ", "title": "How Green SMEs Combine Resources for Financial Performance and Environmental Action: Multiple Pathways in Weak Institutional Contexts", "url": "https://doi.org/10.1002/bse.71774", "authors": "Hande Karadağ ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-03", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "財務成果と環境行動を両立させる資源の組み合わせを複数の経路で示す。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "制度の弱い経済で、環境配慮型の中小企業が高い財務成果に至る資源の組み合わせが複数あることを示した（抄録）。", "p3": "動的能力の視点に立ち、質的比較分析（QCA）で、高い財務成果と環境行動の強さに結びつく資源の組み合わせを調べた（抄録）。", "p5": "財務・技術・人的・制度的資源が複雑に組み合わさり、知識集約の経路、制度に支えられた経路、人的資本中心の経路など、同じ結果に至る4つの構成が見つかった（抄録）。", "fun": "成功への道は一つではありません。ある会社は技術の知恵と民間の支えで、別の会社は公的な支援で、また別の会社は人材の力で、同じように成果を上げていました。QCAは、こうした「別々の道が同じ山頂に着く」パターンを見つけるのに向いた方法です。", "unverified": "4つ目の経路の内容と環境行動の結果は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "差別化された港湾料金と効率：米中定期航路", "title": "Differentiated port fees and efficiency: evidence from Sino–U.S. liner shipping", "url": "https://doi.org/10.1016/j.tra.2026.105332", "authors": "Kevin X. Li ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-30", "citescore": 12.1, "citescore_year": "2025", "why": "港湾料金の差別化が海運の効率に与える影響（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、米中の定期船航路で港湾料金の差別化が効率に与える影響を実証した論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、港が船によって料金を変えると、海運全体の効率は上がるのか下がるのか、です。高速道路の料金を時間帯で変えると渋滞が減るように、港の料金も設計しだいで船の流れを変えるかもしれません。米中の航路という大きな舞台での検証と読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "高技能労働と職場の自動化の相乗効果：企業イノベーション", "title": "Synergistic gains between high skilled labor and workplace automation: The case of corporate innovation", "url": "https://doi.org/10.1016/j.respol.2026.105659", "authors": "Shiu-Yik Au ほか", "venue": "Research Policy", "date": "2026-11-03", "citescore": 17.6, "citescore_year": "2025", "why": "高技能労働と自動化の組み合わせが企業のイノベーションに与える影響（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、高技能の労働者と職場の自動化の組み合わせが企業のイノベーションに相乗効果をもたらすかを調べた論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、機械化が進むと人の仕事が奪われるのか、それとも腕のいい人と機械が組むと新しいものが生まれやすくなるのか、です。自動化と人材を対立ではなく掛け算として見る視点が題名に表れています。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jn23", "rank": 23, "field": "交通・都 ": "Psychometrika", "date": "2026-11-03", "sjr": 1.928, "citescore": 5.1, "citescore_year": "2025", "why": "順位保存の構造方程式モデルによる媒介分析（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "逐次無視可能性の仮定に頼らず、潜在的な媒介変数を特定できる順位保存の構造方程式モデル（RAPSEM）を示した（抄録）。", "p3": "G推定で頑健性を高め、2段階のモーメント法で因子得点を補正して測定モデルを保つ。媒介変数と結果の未測定の交絡がないという仮定を、観測されない効果修飾がないというより弱い仮定に置き換える（抄録）。", "p5": "処置の無作為化を使い、媒介変数に影響するが結果に直接の効果を持たない処置×共変量の交互作用が操作変数のように働くことで識別を達成する（抄録）。", "fun": "「薬が効くのは、まず睡眠を改善するからだ」というような途中の経路（媒介）を調べるとき、普通は「経路の途中に隠れた原因はない」と仮定します。これは破れやすい仮定です。この方法は、その仮定をより弱いものに替え、無作為化の力を借りて経路を取り出します。", "unverified": "シミュレーションや適用例の結果は未確認。"}}, {"id": "jn33", "rank": 33, "field": "物理・材料", "headline": "個々の炭素原子を3次元で撮像", "title": "Three-dimensional imaging of individual carbon atoms", "url": "https://doi.org/10.1038/s41565-026-02316-9", "authors": "Na Yeon Kim ほか", "venue": "Nature Nanotechnology", "date": "2026-11-03", "sjr": 13.056, "citescore": 57.8, "citescore_year": "2025", "why": "炭素原子1個ずつの3次元撮像（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "ねじれた2層グラフェンで、個々の炭素原子の3次元座標を0.11オングストロームの精度で決めた（抄録）。", "p3": "タイコグラフィー原子電子トモグラフィー（pAET）を使い、ねじれ2層グラフェンを模型系として個々の炭素原子の3次元の原子座標を決定した（抄録）。", "p5": "得られた3次元の原子模型は、ファンデルワールス相互作用による、メロン状・スキルミオン状の構造を示すキラルな格子のゆがみを明らかにした（抄録）。", "fun": "炭素は軽く、電子顕微鏡で一つずつ立体的に見るのはとても難しい原子です。この研究は、たくさんの角度からの散乱の模様をつなぎ合わせる方法で、炭素原子一つひとつの位置を、原子の大きさの10分の1ほどの精度で決めました。2枚のシートを少しずらして重ねると、格子が渦を巻くようにゆがむ様子まで見えています。", "unverified": "なし"}}, {"id": "jn34", "rank": 34, "field": "機械学習", "headline": "物理を取り入れた機械学習で粒子の物質通過を高速模擬", "title": "Passage of particles through matter and the effective straggling-function: High-fidelity accelerated simulation via Physics-Informed Machine Learning", "url": "https://doi.org/10.1103/vlq6-x64d", "authors": "Oleksandr Borysov ほか", "venue": "Physical Review X", "date": "2026-11-03", "sjr": 6.494, "citescore": 23.2, "citescore_year": "2025", "why": "物質中を通る粒子の       var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }

  function shareText(it) {
    var ex = it.explain || {}, lines = [];

  function copyText(text, status, ok) {
    var card = status.parentNode;

      ta.focus(); ta.select();

  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
