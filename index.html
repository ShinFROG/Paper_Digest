録にない（未確認）。", "fun": "自信がないのにもっともらしく答えるAIは困りものだ。この研究では、「この確率以上で正しいと思うときだけ答えて」と頼むと、AIが自信のない問題には答えを控えるように訓練した。どこまで慎重にするかを、使う人がその場で自由に決められるのが新しい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "人とLLMの協働で質的コーディングを拡張する", "title": "Scaling Qualitative Analysis with Large Language Models: Development and Validation of the Smart Coder Framework for Human-LLM Collaborative Coding", "url": "https://arxiv.org/abs/2610.33205", "authors": "Cheng Tang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "教師へのインタビュー72件で、指示・プロンプト戦略・信頼性確認の3段階の枠組みを検証し、指示と思考の連鎖が人の合意との一致を高めることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMで質的データのコーディングを行う際の信頼性と人の監督を確保するため、指示・プロンプト戦略・信頼性の確認の3段階からなるSmart Coder Frameworkを提案し、検証した（抄録）。", "p3": "中学校の数学教師への面接記録72件と人の合意による基準を使い、指示の有無、few-shotと思考の連鎖の追加、1回のコーディングと自己整合性を要因計画で比べた。12件を開発と較正、60件を正式な評価に使った（抄録）。", "p5": "指示は一貫して一致度を高め、思考の連鎖は十分な指示のもとでさらに高めた。自己整合性の効果は小さくテーマに依存したが、人が確認すべき不安定な判断を見つけるのに役立った（抄録）。", "fun": "インタビューの記録を読んで「この発言はこのテーマ」と分類する作業は、研究者が何日もかけて行う。この研究は、AIに明確な指示を与えて何度か答えさせ、答えが揺れた部分だけを人が確認する手順を作り、72件の記録で確かめた。最終判断は人が持つという点が大事だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "CFL条件を辺に与えて双曲型輸送をGNNで解く", "title": "CFL-aware edge design for graph neural solvers of hyperbolic transport", "url": "https://arxiv.org/abs/2610.33769", "authors": "Jinyoung Jeong ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "辺ごとに輸送の向き・長さ・波速を与えると、学習時より大きな時間刻みでも衝撃波がぼやけにくくなることを、構造を固定した比較で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "衝撃波などの不連続を伴う双曲型偏微分方程式をグラフニューラルネットワーク（GNN）で解くとき、各辺に局所的なCFL数を与える設計の効果を調べた（抄録）。背景：CFL数は1時間刻みで情報が格子間隔に対してどれだけ進むかを表す。", "p3": "構造は固定し、各辺に与える情報だけを、生の辺の表現から方向・長さ・波の速さを順に明示する形まで変えた。同じ材料から計算するので、変わるのは情報の量ではなく形である（抄録）。", "p5": "生の辺の表現にCFLを付け足してもほぼ効果がなく、辺の情報が輸送の相互作用を表しているときに最終ステップの誤差を10.4〜14.4%減らし、時間刻みが大きいほど改善が広がった。改善は解をぼかすのでなく衝撃波付近の振動を抑えることで生じた（抄録）。", "fun": "波や衝撃波の動きをAIで計算すると、時間を大きく進めたときに波の形が崩れやすい。この研究は、AIに「1ステップで波がどれだけ進むか」という目安を辺ごとに渡す工夫を試し、情報を増やすより、渡し方を整える方が誤差を減らせることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習（Hugging Face）", "headline": "利用者の暗黙の意図を先読みする動画エージェント", "title": "StreamVibe: Proactive Video Agents for Evolving User Intent", "url": "https://arxiv.org/abs/2610.34662", "authors": "Chengzhi Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "why": "明示・暗黙・変化する意図を含むベンチマークを作り、連続観測から意図を推定して対話を変える能動的な視覚言語モデルを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "利用者が口に出さない意図や刻々と変わる意図をくみ取り、先回りして応答する動画エージェントのため、ベンチマークStreamVibe-Bench、モデルStreamVibe-VL、意図を状態として保つ仕組みStreamVibe-Harnessを提案した（抄録）。", "p3": "明示的・暗黙的・動的な意図にわたる評価用4.1K件と学習用85K件の事例を作り、連続する観測から暗黙の意図を推定するモデルと、階層的な記憶で最新の意図と環境の状態を追う仕組みを作った（抄録）。", "p5": "StreamVibe-VLは一般的な動画理解を保ちながら応答のタイミングと回答の質を他の基準より10.7%高め、Harnessは長い対話での一貫性と適応を高めて先回りの対話を12.3%改善した（抄録）。既存の先回り型モデルは、暗黙・動的な意図の理解と応答の時機の判断に限界があった（抄録）。", "fun": "ウェブサイトで迷っているとき、「次はどこを押せばいい？」と口に出さなくても察して教えてくれるAIがあれば便利だ。この研究は、画面の動きを見続けながら利用者の気持ちの変化をくみ取るAIを作り、応答のタイミングと質を10.7%高めた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn39", "rank": 39, "field": "機械学習（Hugging Face）", "headline": "仕事を担うエージェントの体系と能力", "title": "Work Agents: Systems, Capabilities, and Optimization", "url": "https://arxiv.org/abs/2610.35845", "authors": "Zishan Xu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "why": "基盤モデルと実行環境を組み合わせて検証可能な成果を出す「仕事エージェント」を、仕事の持続性と開放性の2軸で整理し、必要な5つの能力を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "基盤モデルがデジタルな仕事を実行する段階に進んだことを受け、仕事を任されるエージェントを、基盤モデルと実行環境の仕組み（ハーネス）を組み合わせたシステムとして捉える総説を示した（抄録）。", "p3": "仕事の持続性と開放性という2つの軸で作業条件を整理し、デジタルな仕事を課題の範囲と組織のされ方で5つの形に分類したうえで、信頼できる実行に必要な5つの能力群と、モデル・ハーネス・両者の同時最適化を検討した（抄録）。", "p5": "既存の評価法と指標を仕事の成果の観点から分析し、長期の仕事の委任、開かれた環境への適応、仕事の実行と能力向上の相互作用を今後の課題とした（抄録）。総説のため新しい実験結果はない（抄録）。", "fun": "AIは文章を書くだけでなく、ソフトを操作して仕事を最後までこなす段階に入りつつある。この論文は、そうした「働くAI」が仕事を確実にやり遂げるには何が必要かを整理した見取り図だ。仕事の種類を分けて、必要な能力と評価の仕方を体系的にまとめている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習（Hugging Face）", "headline": "精度の目的を加えて採点基準RLの報酬ハックを抑制", "title": "Eat Your Precision: Precision Objective Mitigates Reward Hacking in Rubric-based RL", "url": "https://arxiv.org/abs/2610.33512", "authors": "Hyun Ryu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "why": "採点基準の網羅率だけを報酬にすると冗長で誤りを含む回答が増える問題に対し、必要性と事実の正しさを測る精度目的を加えた報酬を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "評価基準（ルーブリック）に基づく報酬での強化学習が、基準を網羅しようとして冗長で誤りの多い回答を生む問題に対し、網羅性に加えて精度を最適化する報酬FORKを提案した（抄録）。", "p3": "回答の各部分が必要で事実として正しいかを、ルーブリックに基づく必要性の得点と事実の正しさの採点器で測り、網羅性（再現率）と精度を同時に最適化した（抄録）。", "p5": "FORKは既存のルーブリック型の強化学習を上回り、網羅性を保ったまま精度を高めて回答を短くした（抄録）。元の方策に対する勝率は、再現率型の報酬の10.6%からFORKの68.0%（RubricHub-Medical）、22.1%から74.1%（HealthBench）に上がった（抄録）。", "fun": "採点基準の項目を全部書けば点が取れるテストだと、答案はどんどん長くなり、余計なことや間違いも混ざる。AIも同じで、この研究は「必要で正しいことだけを書く」ことにも点を与えた。すると医療の質問で元のAIに勝つ割合が10.6%から68.0%に上がった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "操作変数でも平均処置効果の符号を推論する", "title": "Informative inference on the average treatment effect with instrumental variables", "url": "https://arxiv.org/abs/2610.33254", "authors": "Luca Locher ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "局所平均処置効果や広すぎる限界に頼らず、平均処置効果の符号が信頼できる仮定のもとで推論できるかを判断する簡単な感度分析を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "操作変数の設定で、平均処置効果（ATE）がある基準値を超えるかを判断するため、ATEに焦点を保ったまま使える簡単な感度分析を提案した（抄録）。", "p3": "ATEの点識別には正当化しにくい強い仮定が必要で、局所平均処置効果（LATE）は政策との関連が疑問視され、ATEの範囲は広すぎることが多い。提案法は、研究者が信頼できる仮定のもとでATEの符号が推論できるかを原理的に判断できるようにし、範囲推定との関係も論じた（抄録）。", "p5": "方法は適用が簡単で、2つの実データの例で価値を示し、Rパッケージivateで実装した（抄録）。数値の結果は抄録にない（未確認）。", "fun": "政策の効果がプラスかマイナスかを知りたいとき、データだけでは答えが出ないことがある。この研究は、「どのくらいの仮定なら認められるか」を変えながら、効果の向きを確実に言える条件を調べる簡単な方法を作った。結論の強さと仮定の強さを天秤にかける発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "外れ値を使って未観測交絡を除く識別", "title": "Extreme proxies for causal identification: deconfounding with outliers", "url": "https://arxiv.org/abs/2610.34002", "authors": "Juraj Bodik ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "交絡要因が極端な値をとると別の観測変数も極端になるという仮定のもと、極端な処置の観測を選んで交絡を漸近的に無視できるようにする識別法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測されない交絡があるとき、裾の重い変数の極端な値を使えば、操作変数や代理変数がなくても因果効果を識別できることを示した（抄録）。", "p3": "交絡因子が極端な値をとると系内のある観測変数（セーフガード）も高い確率で極端になると仮定し、処置が極端でセーフガードが極端でない観測を選んで交絡を漸近的に無視できるようにした（認証）。必要なグラフ上と分布上の条件を導いた（抄録）。", "p5": "枠組みは有効な操作変数と二重代理の構造を特別な場合として含み、多くの方法で無効な交絡した操作変数も扱える（抄録）。シミュレーションで非線形の交絡と裾の重い場合の性能向上と裾の軽い場合の限界を示し、河川流量の応用で真の流れを復元した（抄録）。", "fun": "原因と結果の関係を調べるとき、見えない第三の要因がじゃまをする。この研究は、まれに起こる極端な値に注目すると、そのじゃまがほとんど消える場面があることを示した。極端な出来事が、ふだんは見えない因果関係を照らし出すという発想が面白い。河川の流量のデータで実際に確かめている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "処置効果の比の回帰調整を直接行う", "title": "Regression Adjustment for Ratios of Treatment Effects in Randomized Experiments", "url": "https://arxiv.org/abs/2610.35666", "authors": "Haruo Kakehi", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "分子と分母を別々に調整すると効率を失う問題に対し、変換した結果を交差適合で予測する2段階推定量と疎性を仮定しないLASSO理論を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "完全無作為化実験で処置効果の比を共変量で回帰調整して推定するとき、分子と分母を別々に調整する従来法は効率の目標を外すとし、変換した結果を直接予測する2段階推定量を提案した（抄録）。", "p3": "交差適合で高次元の予測を使いながら最終的な調整は固定次元に保ち、スパース性を仮定せず、観測数より多い共変量と交差検証による罰則の選択を許すLASSOの理論を作った（抄録）。", "p5": "拡張した2段階推定量は基準の調整空間を含むため漸近的に基準の推定量より効率が劣らず、保守的な分散推定量も同じ順序を満たした（抄録）。シミュレーションと実データで既存法より良い性能を示した（抄録）。", "fun": "薬の効果を調べる実験で、「効果の大きさの比」を知りたいことがある。このとき、参加者の年齢などの情報を上手に使うと、同じ人数でもより正確に推定できる。この研究は、その情報の使い方を見直し、比を直接ねらって調整する方がよいことを数学的に示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn44", "rank": 44, "field": "因果推論", "headline": "限界処置効果モデルの本質的異質性を検定", "title": "Testing for Essential Heterogeneity in the Marginal Treatment Effects Model", "url": "https://arxiv.org/abs/2610.34198", "authors": "Yuhao Li ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "加法分離を仮定せず、傾向スコアに対する条件付き平均のアフィン性を検定することで本質的な異質性を調べる方法を示し、ウガンダの事業に適用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "限界処置効果（MTE）モデルで、加法分離性を仮定せずに「本質的な異質性」があるかを検定する方法を提案した（抄録）。背景：本質的な異質性とは、処置を受けるかどうかの選択が効果の大きさと結びついている状態を指す。", "p3": "異質性がなければ結果の条件付き平均が傾向スコアのアフィン関数になることを鋭い検定可能な含意として示し、第1段階の推定誤差にネイマン直交な射影ガウス過程統計量と乗数ブートストラップで検定を実装した（抄録）。", "p5": "モンテカルロ実験でサイズの制御が正確で検出力も良く、データに基づく中央値の規則は条件付けの次元が増えても検出力を保った（抄録）。ウガンダのELAプログラムへの応用では、中間追跡時の志について異質性なしの帰無仮説を棄却した（抄録）。", "fun": "同じ支援策でも、効果の大きい人ほど参加しやすいなら、平均の効果だけを見ても本当の姿は分からない。この研究は、そうした「効果の違いと参加の選び方の結びつき」があるかを、強い仮定なしで確かめる検定を作り、ウガンダの支援プログラムのデータで試した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn45", "rank": 45, "field": "因果推論", "headline": "短いコーチングが中学生の性別観と自信を変える", "title": "The Scope of Coaching: Experimental Evidence on Adolescents' Gender Beliefs, Self-Perceptions, and Preferences", "url": "https://doi.org/10.2139/ssrn.7665421", "authors": "Alessandro Castagnetti ほか", "venue": "SSRN", "date": "2026-10-27", "why": "イタリア北部の中学生1,500人超のRCTで、6時間のコーチングが職業の性別適性の認識を弱め、自尊心と自己効力感を高めたことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "北イタリアの中学生1,500人以上を対象としたランダム化比較試験で、ジェンダーの固定観念を振り返る活動と自己認識や将来の機会に関する活動を組み合わせた6時間のコーチングの効果を調べた（抄録）。", "p3": "コーチングを受けた群と受けない群で、職業やスポーツの向き不向きに関するジェンダー観、自尊心、自己効力感、仕事の属性の重視度、高校の進路の希望を比べた（抄録）。", "p5": "向き不向きのジェンダー観を0.10標準偏差減らし、自尊心と自己効力感を0.14と0.09標準偏差、男性的とされる認知的な仕事の属性の重視度を0.13標準偏差高めた（抄録）。広い性別役割の考え方や高校の進路の希望には効果がなく、男女の効果の差もほとんどなかった（抄録）。", "fun": "「この仕事は男向き、このスポーツは女向き」という思い込みは、進路選びにも影響する。この研究は、イタリアの中学生1,500人以上に6時間のコーチングを行い、思い込みが少し弱まり、自分への自信が少し高まることを確かめた。一方で、高校の進路の希望は変わらなかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn46", "rank": 46, "field": "組織行動・心理的安全性", "headline": "強い職業的アイデンティティと沈黙が共存する看護師", "title": "Professional Identity, Self-Silencing and Professional Voice in Nursing: A Qualitative Study of Australian Registered Nurses", "url": "https://doi.org/10.2139/ssrn.7650007", "authors": "Johanna Wilhelmina (Welma) van Schalkwyk ほか", "venue": "SSRN", "date": "2026-10-27", "why": "オーストラリアの看護師への質的調査で、強い職業的アイデンティティを持ちながら組織の階層や文化のために声を上げない経験を描いた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "オーストラリアの正看護師が、強い職業的アイデンティティを持ちながら懸念を口に出さない（自己沈黙）経験を、質的研究で探った（抄録）。", "p3": "職業的自己概念と自己沈黙に関する全国横断調査に続く質的段階として、調査の参加者から9人の正看護師と5回のオンライン半構造化セッション（小グループ3回、個別2回）を行い、再帰的テーマ分析で分析した（抄録）。", "p5": "抑えられた職業的正当性、沈黙の文化、自己犠牲の規範など5つのテーマが得られ、アイデンティティは必ずしも発言につながらなかった（抄録）。階層関係、対人的な懸念、限られた心理的安全性、言っても無駄という感覚が発言を妨げ、専門性、経験、指導、支え合う関係が後押しした（抄録）。", "fun": "患者のために働く誇りを強く持つ看護師でも、職場で「おかしい」と声を上げられないことがある。この研究は、9人の看護師への聞き取りから、黙ってしまうのは誇りが弱いからではなく、上下関係や「言っても変わらない」という職場の状況への反応だと示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "シロイルカのAIアバターが環境配慮の選択を促す", "title": "Whale You Go Green? Immediate and Longitudinal Effects of Embodied Conversational AI Avatars on Sustainable Behavioral Tendencies and Pro-Environmental Attitudes", "url": "https://arxiv.org/abs/2610.33191", "authors": "Rachel Poonsiriwong ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "576人の無作為化実験で、具現化した会話AIアバターが文章のチャットボットより持続可能な商品の選択を増やし、シロイルカの条件では2か月後にも効果が残ることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "身体を持つ会話型AIのアバターが、持続可能な行動の傾向と環境への態度を高めるかを、576人のランダム化実験で、直後と2か月後について調べた（抄録）。", "p3": "シロイルカ、グレタ・トゥーンベリ、エマ・ワトソン、一般的な人物の4つのアバターを、文字だけのチャットボットと介入なしの対照群と比べた（抄録）。", "p5": "どのアバターも直後の持続可能な商品の選択を対照群とチャットボットより増やし、アバター間の差は有意でなかった（抄録）。補正後に直後の環境への態度を高めたのはシロイルカだけで、2か月後に戻った287人でもシロイルカは対照群より持続可能な商品を多く選んだ（抄録）。", "fun": "環境を守ろうと呼びかけるのは、有名人とかわいいシロイルカのどちらが効くだろうか。576人の実験では、どのアバターも話した直後のエコな買い物を増やした。2か月後に戻ってきた人でも、シロイルカと話した人は対照群より環境にやさしい商品を多く選んでいた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "AIエージェント時代にプルリクエストは何に代わるか", "title": "What Will Replace Pull Requests? Rethinking Software Collaboration for AI Agents", "url": "https://arxiv.org/abs/2610.34933", "authors": "Christoph Treude ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "2025年10月〜2026年10月の灰色文献50件を分析し、エージェントが大量のプルリクエストを出す時代のソフトウェア協働の代替策と研究上の含意を整理した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIのコーディングエージェントが月に数百万件のプルリクエストを出す中、それに代わる仕組みとして実務者が何を提案・採用しているかと、それがソフトウェア工学の実証研究に与える意味を調べた（抄録）。", "p3": "31の組織や個人が公開した灰色文献50件を、挙げた問題、提案・採用した仕組み、プルリクエストの5つの役割（統合、レビュー、根拠、責任、外部からの貢献）のどれを引き継ぐか、示した証拠でコード化した（抄録）。", "p5": "多くの対応は道具の追加や参加の制限などでプルリクエストを何らかの形で残し、採用の報告が最も多いのは制限だった（抄録）。代替を実際に使うと報告したのはZedだけで、エージェントとの対話で行うレビューはプルリクエストのデータに残らず、従来のデータでは変化を捉えられないと指摘した（抄録）。", "fun": "ソフトウェアの共同開発では、変更案を「プルリクエスト」として出し、仲間が確認してから取り込む。ところがAIが大量の変更案を出すようになり、受け付けを制限する開発の場も出てきた。この研究は50件の文書を調べ、この仕組みがどう変わりつつあるかを整理した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "視覚障害者が3Dモデリングするための言語記述", "title": "Beyond Being Accurate: Implications for Using Natural Language Descriptions for Accessible 3D Modeling with~Blind and Low Vision Makers", "url": "https://arxiv.org/abs/2610.35562", "authors": "Gene S-H Kim ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "視覚障害のある第一著者の自己エスノグラフィーとWizard-of-Oz研究で、編集を支える3Dモデルの記述の戦略を体系化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "視覚に障害のある人（BLV）が3Dモデルを編集できるよう、自然言語の説明だけで必要な空間理解を支えられるかを、2つの研究で調べた（抄録）。", "p3": "全盲の筆頭著者が晴眼の参加者12人と説明の戦略の分類を作る自己エスノグラフィーの予備研究と、その戦略を理想的な台本としてBLVの参加者10人に適用するオズの魔法使い法の本研究を行った（抄録）。", "p5": "正確だが不完全な心的モデルを支える説明では変更の指定に足りないという「利用と編集の溝」を見いだし、それが正確さ・完全さ・表現・ナビゲーションの4種類の失敗を生み、正確さだけの評価では検出できないと示した（抄録）。失敗の種類を診断する2段階の評価枠組みを提案した（抄録）。", "fun": "目の見えない人が3Dの立体を作るには、言葉で形を説明してもらう必要がある。見るだけなら正確な説明で足りても、作り変えるには「聞こうとも思わなかった部分」の情報まで要る。この研究は、全盲の研究者自身が参加者と共に、説明のどこが足りなくなるかを丁寧に分類した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn50", "rank": 50, "field": "情報システム", "headline": "SNSでの注目が政治的有能さと取り違えられる", "title": "From Visibility to Presumed Competence: Digital Performance and Attribution of Political Aptitude", "url": "https://doi.org/10.2139/ssrn.7663279", "authors": "Pablo Dietrich", "venue": "SSRN", "date": "2026-10-27", "why": "SNSでの成功が統治の能力の証拠とみなされる「推定された有能さ」を概念化し、その置き換えの3つの様態と5つの移行を整理した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "SNSでの成功が宣伝の道具を超えて公職を担う能力の証拠と受け取られる条件を論じ、職務の遂行を示さない指標から能力が推定されることを「推定された能力」と名づけた理論研究（抄録）。", "p3": "注目を集める力、票を得る力、公職の職務を果たす能力を区別し、マナン、ブルデュー、ハーバーマス、ポストマンの議論と情報の近道やデジタル基盤の文献に基づいて論じ、1994〜2026年のブラジルの事例で例示した（抄録）。", "p5": "発信の成功が職務に直接関わる証拠への要求を減らす置き換えを、3つの様式と5つの移行に分類し、任期中も見せ方が有権者による選択の修正を妨げうると論じた（抄録）。有権者の間での頻度は今後の実証課題とし、予測と方法を示した（抄録）。", "fun": "SNSで人気の人は、政治家としても有能だと思われがちだ。でも、注目を集める力と、選挙に勝つ力と、実際に良い政治をする力は別物だ。この論文は、人気が能力の証拠として扱われてしまう仕組みを理論的に整理し、ブラジルの事例で例示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "人とLLMの討議は情報の結びつけ方が違う", "title": "Semantic network sharing in human versus LLM discussion groups", "url": "https://doi.org/10.1016/j.chbah.2026.100414", "authors": "Yoshiko Arima", "venue": "Computers in Human Behavior Artificial Humans", "date": "2026-10-23", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr02", "rank": 2, "headline": "口コミ8万件で顧客満足の非線形関数を推定", "title": "Interpretable machine learning for customer satisfaction optimization", "url": "https://doi.org/10.1108/ijchm-01-2026-0089", "authors": "Xin Li ほか", "venue": "International Journal of Contem 客品質を下げ人の回復が補う", "title": "The impact of AI hallucination on the chatbot service quality in e-commerce: the moderating role of human agent based service recovery", "url": "https://doi.org/10.3389/fpsyg.2026.1870991", "authors": "Xi Chen ほか", "venue": "Frontiers in Psychology", "date": "2026-10-27", "citescore": 7.0, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "ECのチャットボットでAIのハルシネーション（事実と異なる応答）が知覚されるサービス品質を下げる仕組みと、人間の担当者による回復策の効果を、2つのシナリオ実験で調べた（抄録）。", "p3": "事前に書いた応答を使う台本型のチャットボット（LLMの生成は使わない）で、模擬的なハルシネーションの程度と人間の担当者による回復の有無を2×2の参加者間計画で操作した。研究1は236人、研究2は364人だった（抄録）。", "p5": "ハルシネーションの知覚が高いほど、認知的不協和と技術的な苛立ちを通じてサービス品質の評価が下がった（抄録）。人間の担当者による回復は苛立ちを和らげたが、認知的不協和は元に戻しにくかった（抄録）。", "fun": "AIの店員がもっともらしい間違いを言うと、客はがっかりする。この研究は、AIの間違いのあとに人間の店員が対応すると、イライラは収まるが「話が違う」というもやもやは残りやすいことを、2つの実験で示した。人とAIの役割分担を考えるヒントになる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "不祥事後の報告書とSNSの開示は切り離される", "title": "Decoupling Sustainability Reporting and Social Media Communication After a Sustainability Scandal: Strategic Silence, Selective Disclosure and Legitimacy Stabilisation", "url": "https://doi.org/10.1002/bse.71775", "authors": "Alice Pennesi ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-27", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "サステナビリティの不祥事の前後で、企業の正式なサステナビリティ報告とソーシャルメディアでの発信がどう分かれていくかを、イタリアの有機食肉メーカーの事例で調べた（抄録）。", "p3": "2021〜2024年について、サステナビリティ報告、Facebookの投稿と利害関係者の反応、規制・背景の文書、経済指標を、出来事を中心とした質的な縦断の単一事例として分析した（抄録）。", "p5": "正式な報告は続いて拡充された一方、Facebookでのサステナビリティの発信は、投稿全体は続いていたのに不祥事後に大きく減った（抄録）。利害関係者の反応は不祥事中に批判的になって2024年に落ち着き、著者らはこれを活発な発信の中で特定の話題を避ける「戦略的沈黙」として概念化した（抄録）。", "fun": "不祥事を起こした会社は、何を語り、何を語らなくなるのか。イタリアの食肉メーカーを調べると、分厚い報告書では環境への取り組みを書き続けたのに、SNSではその話題だけをぴたりと出さなくなっていた。黙ることも一つの戦略だという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "現代奴隷を調べる社会監査人の労働条件", "title": "Accounting for the working conditions of social compliance auditors investigating modern slavery in supply chains", "url": "https://doi.org/10.1108/aaaj-07-2025-8130", "authors": "Pavel Castka ほか", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-10-27", "sjr": 1.574, "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "サプライチェーンの現代奴隷を調べる社会的コンプライアンス監査人の労働条件を、32件の面接から明らかにした（抄録）。", "p3": "監査人、認証機関、NGO、認定機関など監査に関わる人々への32件の面接を、労働過程論と複数の依頼主を持つ雇用ネットワークの観点から分析した（抄録）。", "p5": "監査は遠隔の、しばしば敵対的な現場での資源の乏しい激務で、監査人は身体的な危害や、不利な指摘を操作・抑圧しようとする威圧に直面していた（抄録）。それでも監査人は小さな抵抗、安全のための適応、非公式な道具や関係の活用（「責任の緩衝材」）で調査の誠実さを保とうとしていた（抄録）。", "fun": "外国の工場で強制労働がないかを調べる監査人は、企業の評判を守る最前線にいる。ところがこの研究によると、監査人自身が脅されたり、暴力を受けたり、都合の悪い報告を握りつぶされそうになったりしていた。監視する側の働く環境にも目を向ける必要があることが分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "監査委員会の特性と気候関連開示", "title": "Do Audit Committee Characteristics Influence Climate‐Related Disclosure? Evidence From Italian Listed Firms", "url": "https://doi.org/10.1002/bse.71788", "authors": "Giovanna Crocco ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-27", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "監査委員会の特性が気候関連の開示の程度を説明するかを、イタリアの上場企業211社で調べた（抄録）。", "p3": "TCFDに沿った13項目の気候開示指数を2024年の非財務報告から手作業でコード化し、エージェンシー理論と利害関係者理論に基づいて階層的回帰で分析した（抄録）。", "p5": "監査委員会の女性比率と会議の頻度は開示の程度と正に有意に関連したが、規模と独立性は関連せず、環境に敏感な業種の企業は開示が多かった（抄録）。トービット回帰や地域の統制、エントロピー・バランシングでも結果は保たれた（抄録）。", "fun": "会社が気候変動への備えをどこまで公開するかは、取締役会だけでなく、帳簿をチェックする「監査委員会」のあり方でも変わるらしい。イタリアの211社を調べると、女性が多く、よく集まる委員会のある会社ほど詳しく開示していた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "CSR報告は財務報告の質とどう関わるか", "title": "CSR Reporting as Strategic Communication: Financial Reporting Quality and Its Stakeholder Communication Implications", "url": "https://doi.org/10.1002/csr.71090", "authors": "Raziyeh Salehi ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-27", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "企業の社会的責任（CSR）と財務報告の質の関係と、報告の質の向上がコミュニケーションに持つ意味を、混合研究法で調べた（抄録）。", "p3": "第1段階でロンドン証券取引所の上場企業に勤める財務の専門家150人の調査をPLS-SEMで分析し、第2段階で上場企業32社の報告と開示を統合マーケティング・コミュニケーションの理論から内容分析した（抄録）。", "p5": "CSRは財務報告の目的適合性、忠実な表現、理解可能性、比較可能性と正に有意に関連した（抄録）。質的分析では透明性の合図、情報の簡素化、比較優位の伝達など5つのテーマが見いだされたが、コミュニケーション上の成果は直接測っていない探索的な示唆と位置づけた（抄録）。", "fun": "社会貢献に熱心な会社は、お金の報告も分かりやすく正確なのだろうか。この研究では、イギリスの上場企業の財務の専門家150人への調査で、両者がそろって高い傾向が見られた。報告の質そのものが、会社の信頼を伝える手段になるという見方だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "都市計画の生成AIと人の共創の枠組み", "title": "Generative AI in Urban Planning: A Systematic Review and Human–AI Co-Creation Framework for Responsible Urban Futures", "url": "https://doi.org/10.1177/08854122261488063", "authors": "Farshad Shariatpour ほか", "venue": "Journal of Planning Literature", "date": "2026-10-27", "sjr": 1.963, "citescore": 11.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "都市計画での生成AIの利用を体系的にレビューし、人間とAIの共創の枠組みを示した（抄録）。", "p3": "PRISMAに従い、2015〜2025年の査読論文と一部のプレプリント計63件を統合し、6つのモデル群、5つの応用分野、5つの人間の役割（起動、制約、共創、評価、実装）を整理した（抄録）。", "p5": "問題の設定と制約の設定には重点が置かれていたが、反復的な共創、人間中心の評価、ガバナンス、実装の証拠は限られていた（抄録）。この偏りを解釈するため、作業の全過程で人の判断と制度的な説明責任を保つ「役割を完備したAI都市論」を提案した（抄録）。", "fun": "AIは街の土地利用の案や交通の予測、まちの姿の絵を次々に作れる。でも63件の研究を調べると、AIに条件を与えるところまではよく研究されている一方、住民と一緒に案を練り直したり、実際の街づくりに使ったりする段階の研究はまだ少なかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "人種・階級・空間が再ゾーニングの受け止めを分ける", "title": "Framing Struggles: How Race, Class, and Space Shape Perceptions of Rezonings among Residents and State Actors", "url": "https://doi.org/10.1177/15356841261496211", "authors": "Viktor Bensus", "venue": "City and Community", "date": "2026-10-27", "sjr": 1.181, "citescore": 6.3, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "住宅の手頃さへの対策としてよく使われる用途地域の変更（リゾーニング）をめぐる政治的な対立を、ニューヨーク市の2つの地区で比べた（抄録）。", "p3": "2014〜2021年の参加型のリゾーニングの過程について、詳細な面接、資料調査、オンライン公聴会の観察を行い、階級と人種の構成が異なる地区の市職員、地域の活動家、住民の語りを分析した（抄録）。", "p5": "場所に根ざした政策は空間・社会・時間の3つの緊張を生み、推進派は技術官僚的な枠組み、反対派はポピュリスト的な枠組みでそれを解消しようとした（抄録）。正義と地域の変化の枠組みは両地区で使われたが、地区の社会空間的な特徴によって使われ方が大きく異なった（抄録）。", "fun": "「家賃を下げるため、もっと高い建物を建てられるようにしよう」という市の計画に、住民は賛成も反対もする。この研究はニューヨークの2つの地区を比べ、同じ種類の計画でも、立場や地区の性格によって「何のための計画か」の語られ方が大きく違うことを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "米国の小都市の中心業務地区の境界データ", "title": "A national dataset of downtown business district boundaries for pre-automobile U.S. cities and towns", "url": "https://doi.org/10.1177/23998083261500874", "authors": "Andrew J. Van Leuven", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-10-26", "sjr": 1.018, "citescore": 7.5, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "米国の中小の市や町について、自動車時代以前からある中心商業地区の境界を全国で一貫した方法で定めた公開データを作った（抄録）。", "p3": "歴史的な国勢調査記録、現在の人口、都市圏の分類で対象地を選び、Overture Maps Foundationの施設データにカーネル密度推定を適用して商業施設が最も集中する地区を中心部とする、再現可能なRの手順で作った（抄録）。", "p5": "本土47州にわたる6,551の中心部のポリゴンを作り、検討した2州ではメインストリート事業の地区を高い割合で覆った（抄録）。データはHarvard DataverseにCC0 1.0で、Rのコードは全てGitHubで公開された（抄録）。", "fun": "「町の中心はどこまでか」には、意外にも決まった地図がない。この研究は、お店や施設が集まる場所をコンピュータで見つけ、アメリカの6,551の町の中心部の範囲を同じ方法で描き、誰でも使えるように公開した。古い町の商店街の再生を調べる土台になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "低交通量時の救急拠点の配置と担当割当", "title": "Location-Allocation of Emergency Service Systems in Light Traffic", "url": "https://doi.org/10.1287/opre.2024.1272", "authors": "Xin Wang ほか", "venue": "Operations Research", "date": "2026-10-27", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "救助隊をどこに置き、どの地域を担当させるかを決める問題で、呼び出しの少ない状況（軽負荷）の漸近解析を使い、待ちによる損失を明示的に扱う最適化モデルを作った（抄録）。", "p3": "呼び出しの到着率が0に近づくときの待ち行列の極限の振る舞いを、待たされる呼び出しの損失の明示的な近似に変え、解の質の理論保証を持つ混合整数線形計画として定式化した（抄録）。", "p5": "シンガポールのエレベーター閉じ込め救助のデータを使ったシミュレーションで、最適化した計画は現行の配置に比べて年間の予測遅延救助を約70%減らした（抄録）。", "fun": "エレベーターに閉じ込められたとき、救助隊がすぐ来てくれるかは、隊がどこに待機しているかで決まる。この研究は、呼び出しが少ないときの数学的な性質を使って配置を計算し、シンガポールのデータで遅れる救助を約70%減らせることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "環境に配慮した仕事の特性が行動を促す", "title": "How Green Work Characteristics Drive Pro‐Environmental Behavior: The Mediating Role of Green Self‐Efficacy Among Hotel Employees", "url": "https://doi.org/10.1002/bse.71751", "authors": "Charoenchai Agmapisarn ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-26", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "ホテル従業員の環境配慮行動に仕事の環境面の特性がどう影響するかと、環境面の自己効力感の媒介の役割を調べた（抄録）。", "p3": "仕事の要求–資源モデルと社会的認知理論に基づき、環境面の仕事の要求、裁量、上司の支援、同僚の支援を特性とし、ホテル従業員374人から1か月の間隔で2回集めたデータを一貫したPLS-SEMで分析した（抄録）。", "p5": "環境面の裁量と同僚の支援は自己効力感を高めたが、要求と上司の支援は有意な効果がなかった（抄録）。自己効力感は環境配慮行動を強く予測し、裁量と同僚の支援の効果を媒介した（抄録）。", "fun": "ホテルで働く人が節電やごみの分別に熱心になるには、何が効くのか。374人を調べると、上司の応援や求められる仕事の量より、自分で工夫できる裁量と同僚の後押しが「自分にもできる」という自信を育て、行動につながっていた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "職場で経験する持続可能性とwell-being", "title": "Work as a Lever for Sustainability Transitions: Measuring Experienced Workplace Sustainability and Its Link to Agency and Well‐Being", "url": "https://doi.org/10.1002/csr.71030", "authors": "Jorrit Holst ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-27", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "職場で経験されるサステナビリティを測る尺度を検証し、ドイツの代表標本で、その経験と主観的な幸福や持続可能性に関わる主体性との関連を調べた（抄録）。", "p3": "全機関アプローチ（WIA）の検証済みの尺度を職場に移した6項目のWIA-Work-Scaleを作り、ドイツの代表標本1747人で検証・適用した（抄録）。", "p5": "職場でサステナビリティをより多く経験する人ほど主観的な幸福が高く、仕事以外の場でも持続可能性に関わる主体性の感覚が強かった（抄録）。著者らは職場環境と組織開発への示唆を論じた（抄録）。", "fun": "働く場所が環境や社会に配慮していると感じる人は、毎日の満足感も高いのだろうか。ドイツの1747人を調べると、そう感じる人ほど幸福度が高く、職場の外でも「自分も社会を変えられる」と感じていた。職場が社会を変える入口になるという見方だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "起業での生成AI利用の力づけと罠", "title": "Generative AI use in entrepreneurship: An integrative review and the Empowerment–Entrapment Framework", "url": "https://doi.org/10.1002/sej.70050", "authors": "Jackson G. Lu ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-10-27", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "起業での生成AIの利用について、起業家を中心に据えた統合的なレビューを行い、生成AIの利点と代償を整理する「力づけと罠」の枠組みを提案した（抄録）。", "p3": "機会の認識と着想、評価と決断、資源の結集、事業の立ち上げと成長の4段階ごとに生成AIの影響をまとめ、効果の背後にある生成AIの特徴と、専門性や使い方、個人の特性などの境界条件を検討した（抄録）。", "p5": "生成AIは事業案の質を高めうる一方でハルシネーションや偏りを生み、自己効力感を高める一方で過信を強め、生産性を高める一方で認知的な関与や学習、記憶を損ないうるといったトレードオフを示した（抄録）。起業家は出力を検証し、重要な判断は人に残すべきだとした（抄録）。", "fun": "AIを使えば、起業のアイデア出しも資料作りも一人でこなせる。でもこの論文によると、AIに頼りすぎると自信過剰になったり、自分で考えて学ぶ力が落ちたりするおそれもある。使うかどうかより、どう使うかが大事だという結論だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "地方病院の予測AIの採用と評価", "title": "Rural Hospital AI Use and Evaluation", "url": "https://doi.org/10.1111/jrh.70237", "authors": "Josiah A. Cruikshank ほか", "venue": "Journal of Rural Health", "date": "2026-10-27", "sjr": 1.411, "citescore": 5.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "2023年の米国の病院で、予測AIの導入・利用・評価に都市と農村の差があるかと、農村の病院で導入や評価に関連する特性を調べた（抄録）。", "p3": "予測モデルの利用を初めて尋ねた米国病院協会の2023年の情報技術補足調査を使い、調整済みWald検定で都市と農村を比べ、農村の病院だけで重み付きのロジスティック回帰を行った（抄録）。", "p5": "農村の病院の予測AIの導入率は都市より大幅に低く（51%対81%）、導入した病院でも正確さ（59%対65%）と偏り（39%対47%）を評価する割合が低く、電子カルテの業者が作ったAIに頼る傾向が強かった（抄録）。病院グループへの所属と良好な財務は導入と正に、重要アクセス病院と営利であることは負に関連した（抄録）。", "fun": "病院でAIが予測に使われるのは、もう珍しくない。でもアメリカの農村の病院でAIを使っている割合は51%で、都市の81%より大きく低かった。AIが正しく働いているかを確かめる余裕も少なく、地域による医療の差がAIでも生まれつつある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "訪問看護ステーション選びと望む働き方の実現", "title": "Decision-making structure in selecting home-visit nursing stations and its association with achievement of preferred work style: a nationwide cross-sectional study in Japan", "url": "https://doi.org/10.1186/s12912-026-05585-w", "authors": "Keiko Ono-Ogawa ほか", "venue": "BMC Nursing", "date": "2026-10-27", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "日本の訪問看護師が訪問看護ステーションを選ぶときの動機の構造と、希望する働き方の実現との関連を、全国オンライン調査で調べた（抄録）。", "p3": "2025年の全国横断調査に回答した看護師2,046人のうち、訪問看護ステーションで働く95人を分析し、職場選びの重視度を探索的因子分析にかけ、希望する働き方の実現との関連をロジスティック回帰で調べた（抄録）。", "p5": "「専門職としての成長と地域志向の実践」と「仕事と生活の統合」の2因子が得られ、内的一貫性は高かった（α=0.902と0.818）（抄録）。育児・介護休暇の取りやすさなどとの関連は18比較のボンフェローニ補正後は有意でなく、多変量の結果も不安定で、著者らは仮説を生む探索的な結果と位置づけた（抄録）。", "fun": "高齢化が進む日本では、家を訪ねてケアする訪問看護師が欠かせない。全国の看護師2,046人の回答から訪問看護で働く95人を調べると、職場選びの理由は「成長と地域」と「仕事と生活の両立」の2つにまとまった。人数が少ないため、結論はまだ仮のものだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "家族予防介入の家庭練習を促す要因", "title": "Caregiver-Reported Promoters of Home Practice in a Family-Based Preventive Intervention", "url": "https://doi.org/10.1007/s11121-026-01991-3", "authors": "Carlie J. Sloan ほか", "venue": "Prevention Science", "date": "2026-10-27", "sjr": 1.477, "citescore": 7.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "子どもの心と行動の問題を予防する家族向けプログラムで、保護者が家で技能を練習する（家庭練習）のを助けるものは何かを、保護者の自由記述から調べた（抄録）。", "p3": "家族向け予防介入のランダム化比較試験に参加した母親225人と父親80人の記述をCOM-Bモデルに基づいて「促進要因」としてコード化し、以前の研究で報告された家庭練習の困難との対応を多水準ロジスティック回帰で調べた（抄録）。", "p5": "最も多い促進要因は、自分や子どもの行動・考え・感情への気づき、練習を増やすこと、計画に関する工夫だった（抄録）。日々のストレスを挙げた保護者は計画を、プログラムへの考えに関する困難を挙げた保護者は気づきを挙げやすく、スペイン語で受講した保護者は気づきを多く挙げた（抄録）。", "fun": "子育てのプログラムで学んだことも、家で続けられなければ効果は薄い。母親225人と父親80人に「何があれば家で練習できるか」を尋ねると、外からの助けより、自分や子どもの気持ちに気づくことや、前もって計画することが多く挙がった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "日常の対人過程と瞬間的な孤独", "title": "Interpersonal processes in daily life: Within-person dynamics of experiential avoidance, responsiveness, vulnerability, and momentary loneliness", "url": "https://doi.org/10.1521/jscp.2026.45.5.492", "authors": "Daniel W. M. Maitland ほか", "venue": "Journal of Social and Clinical Psychology", "date": "2026-10-27", "citescore": 1.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "孤独感の瞬間ごとの決定要因を、体験の回避と親密さの対人過程モデルに基づいて、生態学的瞬間評価で調べた（抄録）。", "p3": "参加者31人が最長14日間、1日3回の調査（計1201回分）に答え、体験の回避、弱さの開示と応答性、つながりの感覚、孤独感、心の健康を測った（抄録）。", "p5": "交流の量と質の両方が瞬間の孤独感と関連し、つながりの感覚の方が交流の頻度より強く関連した（抄録）。つながりの感覚は弱さの開示より相手に応え・応えてもらう応答性で最もよく予測され、時間差の効果はほぼ有意でなく、心の健康がその後の孤独感を予測したが逆はなかった（抄録）。", "fun": "寂しさは、人と会う回数だけで決まるのだろうか。31人に1日3回、最長14日間気持ちを記録してもらうと、会った回数より「分かってもらえた」と感じるつながりの方が寂しさと強く関係していた。量より質という、身近な実感を裏づける結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "一人でいたい欲求の尺度開発と妥当性", "title": "Measuring the need for solitude in emerging adulthood: Development and validation of the Need for Solitude (NFS) scale", "url": "https://doi.org/10.1016/j.actpsy.2026.108029", "authors": "Liza Keessen ほか", "venue": "Acta Psychologica", "date": "2026-10-26", "sjr": 0.918, "citescore": 3.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "デジタル技術で常に人とつながれる時代に、成人形成期（18〜25歳）の一人になりたい欲求の強さを測る自己報告尺度NFSを開発・検証した（抄録）。", "p3": "事前登録した2つのオンライン調査で、研究1ではオランダの学生で14項目の1次元構造を定め（224人）、妥当性と信頼性を確かめた（303人）。研究2ではオランダと英国の一般の若者841人で性質を再現し、測定不変性を確かめた（抄録）。", "p5": "NFSは孤独感などの関連する特性と重なりつつも異なる、測定可能な特性であることが示された（抄録）。", "fun": "スマホでいつでも誰かとつながれる今、「一人になりたい」気持ちの強さは人によって違う。この研究は、その強さを14の質問で測る物差しを作り、オランダとイギリスの若者で確かめた。一人でいたい気持ちは寂しさとは別物だという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "黒人の接客従業員の有能さ評価と逆境の推測", "title": "Inferring Struggle, Judging Strength: How Inferred Adversity and Sympathy Shape Competence Evaluations of Black Frontline Employees", "url": "https://doi.org/10.1177/01461672261494231", "authors": "Shahin Sharifi", "venue": "Personality and Social Psychology Bulletin", "date": "2026-10-27", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "人種に関する推測が第三者による従業員の有能さの評価にどう影響するかを、4つの実験で調べた（抄録）。", "p3": "黒人の客が関わるサービスの失敗場面で、白人の米国人観察者に黒人と白人の第一線の従業員を評価させ、推測される逆境と同情の役割を検証した（抄録）。", "p5": "観察者は黒人の従業員を、条件が同じ白人の従業員より有能と判断し、これは人種が逆境の推測を、逆境が同情を呼び、同情が有能さの判断を高める直列の過程と整合した（抄録）。ぎこちない振る舞いは差を弱め、構造的な機会の情報は白人の従業員への同情と有能さの判断を特に高めて差を縮めた（抄録）。", "fun": "失敗した店員を見て「この人は苦労してきたのだろう」と想像すると、評価が甘くなることがある。この研究は、アメリカの観察者が黒人の店員をより有能と判断する傾向を見つけ、その背景に苦労の想像と同情があることを4つの実験で示した。好意的に見えても人種に基づく判断だという点で複雑な結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "信頼の低い時代に実店舗の支店が安心を与える", "title": "The branch is strong when the tree is healthy: symbolic reassurance in retail banking in a post-trust economy", "url": "https://doi.org/10.1108/ijbm-08-2025-0678", "authors": "Lavy Khoushinsky ほか", "venue": "International Journal of Bank Marketing", "date": "2026-10-26", "citescore": 15.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "信頼が揺らいだ経済で実店舗の銀行支店が持つ戦略的な役割を「象徴的な安心」という概念で理論化し、どの顧客体験の次元が安心の合図を忠誠と口コミに変えるかを検証した（抄録）。", "p3": "3つの研究からなる混合研究法で、フォーカスグループ（20人）、シナリオ実験（298人）、Googleの口コミ363,184件のトピックモデルと機械学習を組み合わせた（抄録）。", "p5": "支店は費用がかかり目に見え長続きする合図として働き、周囲の環境（SURROUND）、人との交流（SOCIALIZE）、地域への根づき（SITUATE）が最も重要な次元だった（抄録）。革新的な体験は機能面の最低限を超える効果が小さく、口コミの評価を最もよく予測したのは人との交流だった（抄録）。", "fun": "スマホで何でもできる時代に、なぜ銀行は街に支店を構えるのか。363,184件の口コミなどを調べると、支店は「この銀行はしっかりしている」と伝える看板の役割を果たしていた。評価を最も左右したのは、最新の機械よりも行員とのやりとりだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "高温・真三軸の砂岩をDEMで解析", "title": "Mechanical Behaviors of Reservoir Sandstone Under Coupled High Temperature and True Triaxial Stress Conditions: A Discrete Element Modeling Study", "url": "https://doi.org/10.1002/nag.70469", "authors": "Kaihui Li ほか", "venue": "International Journal for Numerical and Analytical Methods in Geomechanics", "date": "2026-10-27", "sjr": 0.995, "citescore": 5.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "地熱開発で深部の貯留岩が受ける冷水注入による熱衝撃と真三軸応力の連成を、鉱物組成に基づく3次元の熱–力学連成の粒子モデル（3D TM-GBM）で調べた（抄録）。", "p3": "砂岩の鉱物の不均質性を考慮したモデルを通常の三軸試験で較正し、加熱・水冷の処理と真三軸圧縮の数値実験に拡張した（抄録）。", "p5": "ゆっくり加熱すると粒界の亀裂が主だが、水冷では粒内の亀裂が主になった（抄録）。最小主応力σ3の増加は強度を大きく高め、中間主応力σ2は強度を初めに高めのちに下げる非線形の効果を示し、温度の上昇は引張亀裂を、σ2とσ3の上昇は粒界のせん断すべりを増やして、引張主体から引張・せん断の混合の破壊に移った（抄録）。", "fun": "地下深くの熱を利用する地熱発電では、熱い岩に冷たい水を流し込む。この研究は、岩を小さな鉱物の粒の集まりとしてコンピュータで再現し、急に冷やすと粒の内部が割れやすくなることや、三方向からの押され方で壊れ方が変わることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "DEM–SPHで粒状地すべりの段波を予測", "title": "Research on the Optimized 3D DEM‒SPH Algorithm and Impact Parameters of Surge Wave Amplitude for Granular Landslides", "url": "https://doaj.org/article/0a05a3976daa408abf1efacacd110cd5", "authors": "LI Yang ほか", "venue": "DOAJ (DOAJ: Directory of Open Access Journals)", "date": "2026-11-01", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "粒状の地すべりが水域に突入して起こす大きな波（サージ）を、メッシュを使わない3次元の半解像のDEM–SPH連成法で再現し、最大振幅を支配するパラメータを調べた（抄録）。", "p3": "結合面の体積分率を多相流モデルで最適化し、浮力・抗力・反力を半解像の方式で計算した。3次元の造波水槽の実験で検証し、地すべりの長さ・幅・厚さ・突入速度・斜面の角度を変えて解析した（抄録）。", "p5": "波の振幅の相対誤差は5〜12%で、半解像の方式は完全解像の連成より計算時間を約30%減らした（抄録）。第1波は突入速度（感度係数0.583）、厚さ（0.391）、斜面の角度（0.338）の影響が大きく、地すべりが長いほど衝撃でできるくぼみへの埋め戻しが減って第2波が約40%小さくなった（抄録）。", "fun": "山の斜面が崩れて湖やダムに流れ込むと、大きな波が起きて岸を襲うことがある。この研究は、砂と水を小さな粒の集まりとしてコンピュータで再現し、実験との誤差を5〜12%に収めた。最初の波の大きさを最も左右したのは、崩れた土砂が水に入る速さだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "LS-VOF-DEMで土砂を含むダム決壊流を解く", "title": "Modeling of dam-break flow with sediment particles over different riverbed forms by coupled level set and volume of fluid-discrete element method", "url": "https://doi.org/10.1063/5.0349683", "authors": "Jun Ouyang ほか", "venue": "Physics of Fluids", "date": "2026-10-27", "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "土砂粒子を含むダム決壊流を、レベルセット法とVOF法を組み合わせた界面の捕獲と離散要素法（DEM）を連成したCLSVOF-DEMモデルで解析した（抄録）。", "p3": "CLSVOF法で空気と水の界面を再構成して正確に捉え、DEMで粒子の接触と衝突を解き、流体–粒子の相互作用力を支配方程式に直接組み込んだ。モデルを検証したうえで、異なる河床形状の上の土砂を含むダム決壊流に適用した（抄録）。", "p5": "土砂の材料特性が第一の要因で、動きやすいポリ塩化ビニルの粒子が大量に巻き込まれると流れの運動エネルギーを消費し、波の先端の伝播を約20%遅らせ、河床の変形の振幅を天然の砂の約3倍にした（抄録）。河床地形と下流の水位は第二の要因だった（抄録）。", "fun": "ダムが壊れると、水は川底の砂を巻き込みながら一気に流れ下る。この研究は、水と空気の境目と、砂粒一つ一つの動きを同時に計算するモデルを作った。軽くて動きやすい粒だと、粒を運ぶのにエネルギーが使われて、波の先端が約20%遅くなった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "重なりを保つ多ラベル分割で橋梁の損傷を検出", "title": "Study of Overlap-Preserving Multi-Label Semantic Segmentation for Visual Bridge Inspection", "url": "https://doi.org/10.3390/app162110630", "authors": "Shiji Ma ほか", "venue": "Applied Sciences", "date": "2026-10-27", "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "橋梁の目視点検の自動化に向け、損傷の種類と部材の注釈が重なるDACL10K v2の19クラスを独立した2値の目標として扱う、多ラベルのセマンティックセグメンテーションを検討した（抄録）。", "p3": "注釈の監査で学習画素の約15.8%が複数のラベルを持つことを確かめ、公式の学習画像6935枚を内部の学習・検証に分け、選んだ構成を公式の検証画像975枚で評価した。DeepLabV3+、SegFormer、Mask2Formerを共通の手順で比べ、損失の設定と特徴強化モジュールを検討した（抄録）。", "p5": "2分岐の局所–大域文脈の精緻化（LGCR）の構成を作ったが、公式の検証集合でのmIoUはSegFormerが37.38%、LGCRが37.44%で、3つの乱数シードでの差の平均は0.06ポイント、差の向きはシードで変わった（抄録）。著者らはLGCRの一貫した優位は示されないと結論した（抄録）。", "fun": "橋のひび割れやさびを写真からAIで見つける研究は多い。この研究は、新しく工夫したAIの部品が本当に効くかを3回の試行で丁寧に確かめ、差はわずか0.06ポイントで向きも試行ごとに変わったため、「効果があるとは言えない」と正直に報告した。うまくいかなかった結果を示すことも研究の大事な仕事だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "非接触モード試験で薄肉円筒のFEモデルを更新", "title": "Regularised Finite-Element Model Updating of a Thin-Walled Cylinder Based on Non-Contact Experimental Modal Analysis", "url": "https://doi.org/10.3390/s26216755", "authors": "Miaoshuo Li ほか", "venue": "Sensors", "date": "2026-10-27", "citescore": 9.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "加工で材料を削ると薄肉部品の振動特性が変わるため、加工前の基準となる有限要素モデルを、非接触の計測と形状の再構成、材料特性の更新で作る手順を示した（抄録）。", "p3": "レーザー振動計で目標の固有振動数を、画像計測で端面の周方向の形状を求め、3次元スキャンを編集可能なCADに再構成した。形状とポアソン比を固定し、ヤング率と密度をTikhonov正則化つきの相対振動数誤差の最小化で更新し、重みはL曲線で選んだ（抄録）。", "p5": "薄肉の鋼製円筒の事例で、再構成モデルの半径方向の偏差の中央値は0.0362 mm（平均肉厚の約1%）で、目標の3つのモードの相対RMSEは1.71%から1.00%に、当てはめに使わないモードでは0.68%から0.65%に下がった（抄録）。自由状態の振動数はE/ρの比しか同定できず、正則化が代表的な組を選ぶと位置づけた（抄録）。", "fun": "薄い金属の筒を削ると、叩いたときの響き方が変わる。この研究は、筒に触れずにレーザーやカメラで響き方と形を測り、コンピュータの模型を本物に合わせ込んだ。振動数の誤差は1.71%から1.00%に下がった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "曲率モード情報エントロピーで節点の死角を解消", "title": "Generalized Local Curvature Modal Information Entropy (GLCME) for Mitigating Nodal Blindness in Beam Damage Assessment", "url": "https://doi.org/10.3311/ppci.43008", "authors": "Zi Yuan ほか", "venue": "Periodica Polytechnica Civil Engineering", "date": "2026-10-27", "citescore": 3.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "曲率モード指標がモード形の節の近くの損傷に鈍感という限界に対し、一般化局所曲率モード情報エントロピー（GLCME）を導入して梁の損傷評価を改善した（抄録）。", "p3": "GLCMEを数学的に導き、高次モード形の性質を使って損傷指標を作った。単純支持梁と連続梁橋の数値モデルと単純支持の鋼梁の実験で動的データを得て、曲率モードとGLCMEをそれぞれ順伝播型ニューラルネットワークの入力にして比べた（抄録）。", "p5": "GLCMEを入力にすると損傷の位置と程度を信頼性高く同定でき、特に節の近くの損傷で従来の曲率モードより精度と感度が大きく高かった（抄録）。曲率モードは節から離れた損傷に向き、両者は補い合うとした。具体的な数値は抄録にない（未確認）。", "fun": "橋の揺れ方を測ると、傷んだ場所が分かることがある。でも揺れの「節」、つまりほとんど動かない点の近くの傷は見つけにくい。この研究は、揺れの形の乱れ具合を情報の量として測る指標を作り、節の近くの傷も見つけられるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "税と財務報告の整合残差で異常を検出", "title": "EXPLAINABLE IDENTIFICATION OF TAX-RELATED FINANCIAL REPORTING ANOMALIES IN U.S. PUBLIC COMPANIES: CROSS-FITTED TAX-CONSISTENCY RESIDUALS AND OWEN-VALUE SHAPLEY PROPAGATION", "url": "https://doi.org/10.61784/wjebr4125", "authors": "JiaYing Chen ほか", "venue": "World Journal of Economics and Business Research", "date": "2026-10-27", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "法人税の勘定と財務諸表の他の部分との整合性に注目し、米国上場企業の税関連の財務報告の異常を説明可能な形で見つける枠組みTRACEを提案した（抄録）。", "p3": "各年度で法人税費用と未払税金の同業に基づく期待値をラベルなしの交差適合モデルで推定して残差を作り、Compustatの28項目と組み合わせた勾配ブースティングで評価し、Shapley値の伝播で33の明細項目まで説明を届けた（抄録）。", "p5": "SECの執行通牒でラベル付けした146,045企業年を時間外（2003〜2008年）で評価し、上位1%の選別でのNDCGは0.0330と最も高く、RUSBoostより99%、LightGBMより89%改善した（抄録）。検出された虚偽表示は、同業より速い税費用の伸びと期待より少ない未払税金の組み合わせが多かった（抄録）。", "fun": "会社の決算書の不正は、税金の数字のつじつまに表れることがある。この研究は、同業他社と比べて税金の数字が不自然な会社をAIで探し、どの項目が怪しいかまで説明できるようにした。146,045件のデータで、既存の方法よりうまく不正を上位に挙げられた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "車両–橋梁連成系の瞬時周波数応答の解析解", "title": "Instantaneous frequency response of vehicle–bridge interaction systems – Analytical formulation and parametric study", "url": "https://doi.org/10.1016/j.engstruct.2026.124034", "authors": "Xian-Zheng Hong ほか", "venue": "Engineering Structures", "date": "2026-10-27", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、車両と橋梁の相互作用系の瞬時周波数応答について、解析的な定式化とパラメータの検討を行ったEngineering Structuresの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「車が橋を渡る間、車と橋が一緒に揺れる周波数は刻々とどう変わるのか」だ。その変化を数式で表し、条件を変えて調べた研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jr43", "rank": 43, "headline": "速度と軸重が変わる列車での合成桁鉄道橋の監視", "title": "Structural health monitoring of composite girder railway bridge under variable speed and axle load—a case study and numerical modelling", "url": "https://doi.org/10.1007/s13349-026-01148-4", "authors": "A /ssrn.6511613）のCrossref登録の抄録を使用。掲載版との違いは未確認", "preprint": false, "short": true, "p1": "人口が減少する大都市圏で、都市構造が住民の生活満足度にどう影響するかを、東京圏の公共交通指向型開発（TOD）に注目して調べた（抄録）。", "p3": "独自の生活満足度調査と都市構造の地理空間指標を組み合わせ、ロジスティック回帰と構造方程式モデリングで直接・間接の関係を分析した（抄録）。", "p5": "駅勢圏の住民は、より外側の地域の住民より生活満足度が低く、アクセスと密度が生活の質を高めるという前提に疑問を投げかけた（抄録）。土地利用の混合は正だが非線形の効果を持ち、住宅の条件は特に外側の地域で重要で、単身世帯では自由時間の過ごし方などを通じた間接効果が有意だった（抄録）。", "fun": "駅の近くに住めば便利で幸せになれる、と思いがちだ。ところが東京圏の調査では、駅の近くの住民の方が、より外側の地域の住民より生活の満足度が低かった。便利さだけでなく、住まいの条件や日々の過ごし方と街の作りが合っているかが大切らしい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "大規模マルチモーダルAIは歩きやすさを見抜くか", "title": "Does AI see what we see? Evaluating large multimodal models for perceived urban walkability", "url": "https://doi.org/10.1016/j.habitatint.2026.104021", "authors": "Li-Chih Ho ほか", "venue": "Habitat International", "date": "2026-10-27", "sjr": 1.892, "citescore": 11.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、大規模マルチモーダルモデルが、人が感じる都市の歩きやすさをどこまで人と同じように評価できるかを検証したHabitat Internationalの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「AIは街の写真を見て、人と同じように『歩きやすそう』と感じるのか」だ。AIの見方と人の感じ方のずれを確かめる研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jr47", "rank": 47, "headline": "人とAIの協働によるサービス回復と許し", "title": "Human-AI collaboration recovery: How complaint type and managerial response shape consumer forgiveness", "url": "https://doi.org/10.1016/j.jretconser.2026.105179", "authors": "Guangmei Yang ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-27", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、人間とAIが協力して行うサービスの回復で、苦情の種類と管理者の対応が消費者の許しにどう影響するかを調べたJournal of Retailing and Consumer Servicesの論文と読める。", "p3": "未確認（抄録・本文を入   }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
