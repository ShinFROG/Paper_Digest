学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、乾燥した砂地盤でのトンネル切羽（掘削面）の崩壊のふるまいの不確実性を、地盤の性質を確率場で表し、粒子法の一種であるSPH（平滑化粒子流体力学）で解析する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、トンネルを掘っている最前面の砂が崩れるとき、地盤の強さが場所ごとにばらついていることを考えると、崩れ方や崩れる範囲がどのくらい変わりうるか、というものである。一つの答えでなく、起こりうる結果の幅を求めようとする点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、確率場の設定、計算の回数、結果はすべて未確認。"}}, {"id": "jr27", "rank": 27, "headline": "正例とラベルなしの学習で財務諸表不正を検出", "title": "Proving a negative is difficult: positive and unlabeled financial statement fraud detection via multi-modal graph auto-encoders", "url": "https://doi.org/10.1016/j.dss.2026.114798", "authors": "Xusheng Sun ほか", "venue": "Decision Support Systems", "date": "2026-11-12", "sjr": 2.079, "citescore": 13.5, "citescore_year": "2025", "apa": "Sun, X., Zhou, L., Wang, G., Tan, C.-W., & Yang, S. (2026). Proving a negative is difficult: positive and unlabeled financial statement fraud detection via multi-modal graph auto-encoders. Decision Support Systems, 114798. https://doi.org/10.1016/j.dss.2026.114798", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、財務諸表不正の検出を、「不正と確認された企業（正例）」と「ラベルのない企業」だけから学ぶ問題として扱い、複数の種類のデータを使うグラフ自己符号化器で解く研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「この会社は不正をしていない」と証明することはできない、という事情をどう扱うかである。不正が見つかった会社は確かに不正だが、見つかっていない会社が潔白とは限らない。そのため確かな「白」のお手本がないまま学習しなければならない、という難しさが題名に表れている。結果は未確認。", "unverified": "抄録・本文を入手できず、使用データ、グラフの作り方、検出精度はすべて未確認。"}}, {"id": "jr28", "rank": 28, "headline": "監査完了前の決算発表は監査報酬を約1割上げる", "title": "Does Releasing Earnings When the Audit Is Less Complete Increase Audit Costs?", "url": "https://doi.org/10.2308/ajpt-2024-102", "authors": "Ashleigh Bakke ほか", "venue": "Auditing", "date": "2026-11-10", "sjr": 2.32, "citescore": 5.3, "citescore_year": "2025", "apa": "Bakke, A., Bronson, S. N., Masli, A. N. S., & Schroeder, J. H. (2026). Does Releasing Earnings When the Audit Is Less Complete Increase Audit Costs? Auditing: A Journal of Practice & Theory, 1–28. https://doi.org/10.2308/ajpt-2024-102", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "監査が終わる前に年次の利益を発表する企業は、監査報酬が高くなることを示した（抄録）。", "p3": "利益発表は早いほど価値があるため、多くの企業が監査の完了前に発表する。この早期の発表と監査報酬の関連を調べ、発表日と監査報告書の日付の間隔による違いや、早期発表に切り替えた企業の変化の分析も行った（抄録）。", "p5": "監査完了前に発表する企業は平均で10.8%高い報酬を払っていた。この上乗せは発表から監査報告までの日数が長いほど大きく、早期発表に切り替えたあと少なくとも2年続いた（抄録）。", "fun": "会社は決算の数字を一日でも早く知らせたい。しかし監査人の確認がまだ終わっていないうちに発表すると、あとで数字が違っていたときの危険を監査人も背負うことになる。その分が監査の料金に上乗せされていた。早く知らせることの便利さには、目に見える値段が付いていることを示した研究である。", "unverified": "本文未読のため、標本の国・期間・規模と、因果関係の識別の程度は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "表形式データ合成の手法と評価を整理した総説", "title": "A Survey on Tabular Data Synthesis: Generation, Evaluation, and Benchmarking", "url": "https://doi.org/10.1002/wics.70078", "authors": "Suyeong Kim ほか", "venue": "Wiley Interdisciplinary Reviews: Computational Statistics", "date": "2026-11-11", "sjr": 1.486, "citescore": 9.0, "citescore_year": "2025", "apa": "Kim, S., Jeong, D., Lee, H., Kim, J. H. T., Kim, Y. M., & Im, J. (2026). A Survey on Tabular Data Synthesis: Generation, Evaluation, and Benchmarking. WIREs Computational Statistics, 18(4). https://doi.org/10.1002/wics.70078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "表形式データの合成について、古典的な統計手法、深層生成モデル、大規模言語モデルを使う手法をまとめ、評価の考え方を整理した総説である（抄録）。", "p3": "各手法の生成の仕組み、モデルの仮定、限界を検討し、評価を分布の類似性、下流の課題での有用性、プライバシーの3つの観点から論じた。12の生成器の構成を6つのデータセットで比べる例示的なベンチマークを添えた（抄録）。", "p5": "結果はデータセットと指標に依存し、類似性と有用性の得点は、プライバシーの診断と計算上の要求とあわせて解釈する必要がある。型の混在、まれな観測、再現性などの課題と、LLMを直接の生成器として使うべき場面という未解決の問いを挙げた（抄録）。", "fun": "本物のデータは個人情報を含むので外に出せない。そこで、本物そっくりの統計的な性質を持つ「偽のデータ」を作って配る方法が研究されている。難しいのは、良い偽物の条件が一つではないことだ。本物に似ているほど役に立つが、似すぎると元の人が分かってしまう。この総説は、その綱引きを三つの物差しで整理している。", "unverified": "本文未読のため、ベンチマークで比べた手法の名称と結果の数値は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "外国の税務当局によるEDGAR閲覧と利益移転", "title": "The Effect of Non‐US Tax Authority Monitoring on Income Shifting by Affiliates of US Multinationals: Evidence From EDGAR Search Activity", "url": "https://doi.org/10.1111/1911-3846.70101", "authors": "Sabrina Chi ほか", "venue": "Contemporary Accounting Research", "date": "2026-11-11", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Chi, S., Persson, A. V., Shevlin, T., & Urcan, O. (2026). The Effect of Non‐US Tax Authority Monitoring on Income Shifting by Affiliates of US Multinationals: Evidence From EDGAR Search Activity. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70101", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "外国の税務当局が米国の多国籍企業の年次報告書をダウンロードする記録を監視の指標として使い、その監視が企業の利益移転を抑えるかを調べた（抄録）。", "p3": "米国証券取引委員会に提出された年次報告書への外国税務当局からのアクセスを測り、子会社の所在国の当局による監視と、企業グループ全体で受けた監視の合計のそれぞれと、子会社の利益移転との関連を分析した（抄録）。", "p5": "子会社の現地当局の監視だけでは利益移転は系統的に減らないが、グループ全体での監視の合計は、現地当局が監視していない子会社にも効いていた。この関連は、情報交換条約がある場合、開示が詳しい場合、執行能力が高い場合に強い（抄録）。", "fun": "税務署が会社の公開資料を見ているかどうかは、ふつう外からは分からない。この研究は、米国の開示サイトのアクセス記録から「どの国の税務署が、どの会社の資料を落としたか」を拾い出した。すると、一つの国が見ているだけでは効かず、多くの国に見られている会社ほど利益の付け替えを控えていた。見張りの目は数が効く。", "unverified": "抄録の末尾が切れており、政策への含意の後半は未確認。標本の期間と規模も未確認。"}}, {"id": "jr31", "rank": 31, "headline": "監査の試験問題でLLMと学習者を比較", "title": "Large Language Models In Auditing Assessments: Comparisons Between Human Learners, Model Scale, and Enhancement Techniques", "url": "https://doi.org/10.22146/abis.v14i4.125774", "authors": "Arizona Mustikarini", "venue": "ABIS: Accounting and Business Information Systems Journal", "date": "2026-11-11", "apa": "Mustikarini, A. (2026). Large Language Models In Auditing Assessments: Comparisons Between Human Learners, Model Scale, and Enhancement Techniques. ABIS: Accounting and Business Information Systems Journal, 14(4), 301. https://doi.org/10.22146/abis.v14i4.125774", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "言語モデルは監査の知識を問う試験では学生を上回るが、データを使って監査手続を実行する課題では得点が低いという、知識と実行の隔たりを示した（抄録）。", "p3": "公開されている7つの言語モデルに、会計の学生352人が受けた学部の監査論の試験4回分と、SQLで実証手続を計画・実行して収益の実在性と費用の網羅性を確かめる事例課題を解かせ、自己省察とエージェント型の手順という二つの強化手法も試した（抄録）。", "p5": "知識の試験では、大きいモデルは学生の78〜98パーセンタイルに位置した。事例課題ではどのモデルも採点基準の満点の50%を超えず、モデルの大小で有意な差はなく、二つの強化手法も成績を上げなかった（抄録）。", "fun": "監査の教科書の内容を問うと、AIは優秀な学生並みに答えられる。ところが、実際のデータを渡して「売上が本当にあったか確かめよ」と作業をさせると、半分も点が取れなかった。知っていることと、できることは別である。しかも自分で見直させても間違いは直らなかった。外から誤りを指摘される仕組みの大切さが分かる。", "unverified": "抄録の末尾が切れており、含意の議論は未確認。事例課題の採点方法の詳細も未確認。"}}, {"id": "jr32", "rank": 32, "headline": "脆弱な消費者を支えるサービスが害を再生産する", "title": "The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives", "url": "https://doi.org/10.1177/10946705261502647", "authors": "Shuai Qin ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Qin, S., & Chen, X. (2026). The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives. Journal of Service Research. https://doi.org/10.1177/10946705261502647", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "消費者の脆弱さを減らすはずの変革的なサービスが、サービスの組み立て方しだいで脆弱さを繰り返し生み出してしまう仕組みを、難民の起業支援を例に示した（抄録）。", "p3": "研究1では33の支援組織の管理者42人に面接し、資源へのアクセスと使い方の統制の組み合わせから3つのサービスモデルを見いだした。研究2では一つの支援組織を3年間観察し（面接70件、観察144回）、利用者が与えられた立場に異議を唱える過程を追った（抄録）。", "p5": "各モデルは利用者を受け身の受給者、条件つきの行為者、自律的な努力者として位置づけ、それぞれに特有の脆弱さの型を生みやすい。利用者は、参加の負担を見えるようにする、資源があれば何ができるかを示すという二つのやり方で立場を変えようとした（抄録）。", "fun": "困っている人を助けるサービスが、かえってその人を弱い立場に固定してしまうことがある。たとえば支援する側が何でも決めてしまうと、利用者は「受け取るだけの人」になる。この研究は、助け方の型ごとに、どんな弱さが生まれやすいかを整理した。善意の仕組みにも副作用があり、利用者の側からそれを変える動きがあることが分かる。", "unverified": "抄録の末尾が切れており、理論的な含意の後半は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "消費者が感じるAIの人工共感の6次元尺度", "title": "Measuring Consumer‐Perceived Artificial Empathy: Development and Validation of a Six‐Dimensional Scale", "url": "https://doi.org/10.1111/ijcs.70280", "authors": "Heng Chu ほか", "venue": "International Journal of Consumer Studies", "date": "2026-11-11", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "apa": "Chu, H., Ji, C., Li, M., & Prentice, C. (2026). Measuring Consumer‐Perceived Artificial Empathy: Development and Validation of a Six‐Dimensional Scale. International Journal of Consumer Studies, 50(6). https://doi.org/10.1111/ijcs.70280", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "サービスの場面でAIが示す「人工共感」を消費者がどう知覚するかを測る、6次元・24項目の尺度を開発し、妥当性を確かめた（抄録）。", "p3": "文献の検討と質的な面接で項目を作り、専門家の評価で表面・内容妥当性を確かめたうえで、3つの独立した標本を使い、探索的因子分析（413人）、確認的因子分析（476人）、PLS-SEMによる予測妥当性の検討（537人）を行った（抄録）。", "p5": "察知、注意深さ、包括性、適応性、真正さ、敬意の6次元からなる24項目の尺度が支持された（抄録）。信頼性係数などの数値は抄録に記載なし。", "fun": "AIの窓口が「お困りですね」と言うとき、客はそれを思いやりと感じるだろうか。AIには心がないのに、共感されたと感じることはある。この研究は、その「共感された感じ」を六つの面に分け、質問紙で測れるようにした。気づいてくれるか、合わせてくれるか、うわべでないか、など、人が相手に求めるものがそのまま並んでいる。", "unverified": "抄録の末尾が切れており、予測妥当性の対象とした結果変数と係数は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "動画配信の乗り換え意図と切替障壁", "title": "Platform Dissatisfaction to Switching Intention: The Roles of Trust, Switching Barriers, and Alternative Attractiveness in Video Streaming Services", "url": "https://doi.org/10.12688/f1000research.189722.1", "authors": "Rafael Latif ほか", "venue": "F1000Research", "date": "2026-11-11", "citescore": 2.9, "citescore_year": "2025", "apa": "Latif, R., Ferrencya, F., Amalia, A., Silvia, D., & Arianto, R. (2026). Platform Dissatisfaction to Switching Intention: The Roles of Trust, Switching Barriers, and Alternative Attractiveness in Video Streaming Services. F1000Research, 15, 1767. https://doi.org/10.12688/f1000research.189722.1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の結果の部分は取得時に切れている）", "preprint": false, "short": true, "p1": "定額制の動画配信サービスで、利用者が他のサービスへ乗り換えようとする意図を、不満・信頼・切替の障壁・代替の魅力から説明するモデルを検証した（抄録）。", "p3": "押し出し・引き寄せ・係留（Push–Pull–Mooring）の枠組みを使い、複数の動画配信サービスの利用経験があるインドネシアの利用者417人の横断調査を、PLS-SEM（5,000回のブートストラップ）で分析した（抄録）。", "p5": "13の仮説のうち11が支持され、乗り換え意図の有意な予測変数の中では、サービス品質への不満の正の効果が最も強かった（β = 0.183）（抄録）。他の係数は抄録が切れており未確認。", "fun": "今のサービスに不満があっても、すぐ乗り換える人ばかりではない。乗り換えには、押し出す力（不満）、引き寄せる力（他社の魅力）、引き止める力（手続きの面倒さや信頼）の三つが働く。この研究は、引っ越しを説明するために作られたこの考え方を、動画配信の契約に当てはめた。人の移動とサービスの乗り換えが同じ型で語れる点が面白い。", "unverified": "抄録の結果の部分が切れており、切替の障壁と信頼の効果の大きさは未確認。有意抽出の横断調査である。"}}, {"id": "jr35", "rank": 35, "headline": "世代で違う口コミの動機と場所", "title": "Why, where, and how generations from Baby Boomers to GenZ share eWOM: fresh insights from generational cohort theory", "url": "https://doi.org/10.1080/02508281.2025.2528225", "authors": "Kristína Pompurová ほか", "venue": "HAL (ART) Tourism Recreation Research", "date": "2026-11-09", "citescore": 11.3, "citescore_year": "2025", "apa": "Pompurová, K., Filieri, R., & Medeková, K. (2025). Why, where, and how generations from Baby Boomers to GenZ share eWOM: fresh insights from generational cohort theory. Tourism Recreation Research, 51(5), 2014–2038. https://doi.org/10.1080/02508281.2025.2528225", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用（掲載誌 Tourism Recreation Research の本文は未取得）", "preprint": false, "short": true, "p1": "ベビーブーム世代からZ世代までの4つの世代が、観光地についての電子的な口コミを、なぜ・どこで・どのように共有するかの違いを明らかにした（抄録）。", "p3": "世代コホート理論に基づき、チェコとスロバキアの代表標本のデータで、口コミへの関与、動機、媒体の好みを世代間で比べた。幅広い種類の口コミの場を対象にした（抄録）。", "p5": "Z世代とY世代は視覚的な媒体を好み、自己高揚と外的な報酬に動かされる。年長の世代は利他的な動機が強く、公式性の高い場を好む。どの世代でも肯定的な口コミが優勢だった（抄録）。数値は抄録に記載なし。", "fun": "旅行の感想をネットに書くとき、若い人は写真や動画の場で「自分をよく見せたい」「ごほうびがほしい」気持ちから書き、年長の人は公式の評価サイトで「他の人の役に立ちたい」気持ちから書く傾向があった。同じ口コミでも、書く理由と場所が世代で違う。ただし著者は、世代の線引きを固く考えすぎないようにとも述べている。", "unverified": "本文未読のため、標本の大きさ、調査の時期、差の統計的な検定の結果は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "市場の公正感は仕組みは同じで基準が変わった", "title": "Evolving Norms of Market Fairness: Stable Mechanisms and Shifting Standards in a Contemporary Replication of Kahneman et al. (1986)", "url": "https://doi.org/10.1177/01461672261495988", "authors": "William Rose ほか", "venue": "Personality and Social Psychology Bulletin", "date": "2026-11-11", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "apa": "Rose, W., & Gladstone, J. J. (2026). Evolving Norms of Market Fairness: Stable Mechanisms and Shifting Standards in a Contemporary Replication of Kahneman et al. (1986). Personality and Social Psychology Bulletin. https://doi.org/10.1177/01461672261495988", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "市場での公正さの判断についての1986年の古典研究を追試し、判断の仕組みは変わっていないが、何を不公正とみなすかの基準は変わったことを示した（抄録）。", "p3": "Kahnemanらの1986年の研究を、元の場面設定と現代風に直した設定で、クラウドワーカーと一般人口の標本を使って4回追試した（計1,016人）（抄録）。", "p5": "参加者は今も、既存の価格と賃金を権利とみなし、賃下げを昇給の見送りより厳しく評価し、市場支配力を利用する企業を非難した。一方、値上げに反対する割合は1986年よりどの標本でもおよそ40〜55%低く、雇用主の行為への反対が強まったのは若いクラウドワーカーの標本だけだった（抄録）。", "fun": "四十年前の人も今の人も、「いつもの値段」を当然の権利と感じ、給料を下げられると強く怒る。この心の仕組みは変わっていなかった。ところが「値上げは不公正だ」と感じる人は大きく減っていた。値段が動くことに慣れたためかもしれない。公正さの感じ方は、変わらない型と、時代に合わせて動く基準の二つでできているらしい。", "unverified": "本文未読のため、個々の場面設定ごとの結果と、基準が変わった理由の検討は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "地域の仲介的な場の利用が瞬間のストレスを下げる", "title": "Activity spaces, community resource brokers, and real-time stress and affect: Evidence from the Boston Activity Space and Health Study", "url": "https://doi.org/10.1177/00420980261500260", "authors": "Gregory Sharp ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Sharp, G., & Walton, E. (2026). Activity spaces, community resource brokers, and real-time stress and affect: Evidence from the Boston Activity Space and Health Study. Urban Studies. https://doi.org/10.1177/00420980261500260", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "日常の行動範囲にある地域の施設や組織（資源の仲介役）を実際に利用することが、その場のストレスと気分の苦しさを和らげることを示した（抄録）。", "p3": "ボストンの成人を対象に、スマートフォンでGPSの位置と、その時々の気分を尋ねる調査を7日間集めたデータを使い、変量効果モデルで、仲介役へのアクセスと利用が、その場のストレスと感情にどう関連するかを推定した（抄録）。", "p5": "仲介役となる施設にふだんから行ける範囲にいることに加えて、それを日常的に利用していることが、その場の情緒的・生理的な苦しさの軽減と関連していた（抄録）。効果の大きさは抄録に記載なし。", "fun": "健康には「どこに住んでいるか」が効くと言われるが、人は一日の大半を、職場や店や礼拝所など、家の外で過ごす。この研究は、スマートフォンで人の足どりとその瞬間の気分を一緒に記録した。すると、地域の施設が近くにあるだけでなく、実際に通っている人ほど、その時々の苦しさが軽かった。場所は、使われて初めて支えになる。", "unverified": "本文未読のため、標本の大きさ、仲介役の定義、推定値は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "退職後の孤独を防ぐ短い介入を日本の正社員で検証", "title": "Testing a WOOP-SET intervention to promote loneliness-prevention intentions and examine ageism among middle-aged Japanese regular employees", "url": "https://doi.org/10.3389/frsps.2026.1978965", "authors": "Yuho Shimizu", "venue": "Frontiers in Social Psychology", "date": "2026-11-11", "citescore": 1.6, "citescore_year": "2025", "apa": "Shimizu, Y. (2026). Testing a WOOP-SET intervention to promote loneliness-prevention intentions and examine ageism among middle-aged Japanese regular employees. Frontiers in Social Psychology, 4. https://doi.org/10.3389/frsps.2026.1978965", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得）", "preprint": false, "short": true, "p1": "退職後の孤独に備える意図を高める短いオンラインの介入を、日本の中年の正規雇用者で試し、意図は高まるが、年齢への偏見を減らす効果ははっきりしないことを示した（抄録）。", "p3": "願い・成果・障害・計画を書き出す演習（WOOP）と、今の自分と将来の高齢の自分の連続性を強調するメッセージを組み合わせた。40〜64歳を対象に、研究1は一群の事前事後の設計（200人）、研究2は無関係な課題と比べる準無作為化の設計（759人）で行った（抄録）。", "p5": "研究1では孤独予防の行動意図が上がり年齢への偏見が下がった。研究2では、介入群の孤独予防の意図の上昇が対照群より有意に大きかったが、偏見には群間の有意な効果がなかった（抄録）。", "fun": "会社勤めの人は、仕事のつながりが退職で一気になくなりやすい。そこで働き盛りのうちに「退職後に誰とつながるか」を考えてもらう短い課題を試した。効果があったのは「やってみよう」という気持ちまでで、年を取ることへの思い込みは変わらなかった。気持ちを動かすことと、考え方を変えることは別物だと分かる。", "unverified": "本文未読のため、効果量と、意図が実際の行動に結びついたかどうかは未確認。測定は介入の直後である。"}}, {"id": "jr39", "rank": 39, "headline": "独居の高齢保健ボランティアは支える側で支えられない", "title": "When the Caregiver Needs Care: Mental Health Experiences of Elderly Health Cadres with Hypertension Living Alone in Rural Indonesia", "url": "https://jurnal.unitri.ac.id/index.php/care/article/view/8776", "authors": "Retno Lestari ほか", "venue": "Care Jurnal Ilmiah Ilmu Kesehatan", "date": "2026-11-08", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "地域の人の健康を支える高齢の保健ボランティア自身が、高血圧を抱え、一人暮らしで、十分な支えを受けていない実態を、インドネシアの農村で聞き取った（抄録）。", "p3": "東ジャワの農村に住む60〜67歳の女性の保健ボランティア7人（全員が独居で高血圧）に、半構造化の深い面接をオンラインで行い、主題分析の6段階の手順で分析した（抄録）。", "p5": "高血圧への心理社会的な反応、対処と回復力、独居、医療サービスへの障壁、仲間の支え、複数の病気という6つの主題が得られた。恐れ・不安・孤独が多く語られ、信仰と世話をする役割が支えになっていた（抄録）。", "fun": "村で近所の人の血圧を測り、健康の相談に乗っている人たち自身が、高齢で、病気を持ち、一人で暮らしている。支える側の人を、誰が支えるのか。この研究は、ふだん表に出ないその人たちの声を聞いた。寂しくても人の世話を続けることが、本人の生きる力にもなっているという点が、聞き取りならではの発見である。", "unverified": "抄録の末尾が切れており、提言の後半は未確認。対象は7人で、結果を一般化する設計ではない。"}}, {"id": "jr40", "rank": 40, "headline": "互恵的なケアを地域のwell-beingにつなぐモデル", "title": "Reciprocal care as a psychosocial practice: a relational model of interdependence, agency, and community well-being", "url": "https://doi.org/10.3389/fpsyg.2026.2020169", "authors": "José Antonio Younis Hernández ほか", "venue": "Frontiers in Psychology", "date": "2026-11-11", "citescore": 7.0, "citescore_year": "2025", "apa": "Younis Hernández, J. A., Etopa Bitata, M. d. P., Morales Almeida, P., & Morata Sampaio, L. (2026). Reciprocal care as a psychosocial practice: a relational model of interdependence, agency, and community well-being. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.2020169", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "ケアを「依存する人への作業」や規範としてではなく、互いに支え合う関係が人の主体性と地域のwell-beingを生み出す心理社会的な過程として捉える概念モデルを提案した（抄録）。", "p3": "社会心理学、承認論、フェミニストのケアの倫理、社会問題の社会学を踏まえ、脆弱さを人間の基本的な条件、相互依存をその社会的な表れと位置づけ、承認を、共有された脆弱さを関係的な主体性に変える中心の仕組みとして概念化した（抄録）。", "p5": "互恵的なケアは、依存への応答にとどまらず、信頼・互恵・責任・社会参加を育てる生成的な過程だと論じる（抄録）。概念的な論文で、データによる検証は示されていない。", "fun": "「世話をする人」と「世話をされる人」は、はっきり分かれているように見える。しかしこの論文は、誰もが弱さを持ち、誰もが誰かに頼って生きているという点から出発する。弱さを認め合うことが、かえって「自分も人の役に立てる」という力になり、それが地域全体の暮らしやすさにつながる、という見方を示している。", "unverified": "抄録の末尾が切れており、モデルの構成要素の全体と政策への含意は未確認。実証データはない。"}}, {"id": "jr41", "rank": 41, "headline": "人格のないAIの「性格」は再検査で安定する", "title": "Personality without a person: measuring personality in generative AI", "url": "https://doi.org/10.3389/fcomp.2026.1940035", "authors": "Jason L. Harman ほか", "venue": "Frontiers in Computer Science", "date": "2026-11-10", "citescore": 6.2, "citescore_year": "2025", "apa": "Harman, J. L., Scheuerman, J., & Loganathan, N. R. K. (2026). Personality without a person: measuring personality in generative AI. Frontiers in Computer Science, 8. https://doi.org/10.3389/fcomp.2026.1940035", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得）", "preprint": false, "short": true, "p1": "生成AI（LLM）に「性格」と呼べる安定した傾向があるか、指示でペルソナを与えると測定値がどう変わるかを、自己報告と行動課題の両方で調べた（抄録）。", "p3": "4つのLLMを、指示を与えない初期状態と、指示による3種のペルソナの条件で、自己報告式の性格検査と、ゲーム形式の新しい行動的な測定で評価した（抄録）。", "p5": "先行研究と異なり、LLMは非常に高い再検査信頼性を示した。性格の得点はペルソナの指示に沿って予測どおりに変わったが、二つの測定法の一致は、モデルとペルソナの条件によって異なった（抄録）。数値は抄録に記載なし。", "fun": "人の性格は、今日と来週で大きくは変わらない。ではAIはどうか。同じ性格テストを繰り返すと、AIは意外にもほぼ同じ結果を返した。さらに「こういう人物として答えて」と頼むと、その通りに得点が動いた。ただし、質問に答えさせる方法と、ゲームでの行動を見る方法では結果が食い違うこともあり、何を測っているのかはまだ問いが残る。", "unverified": "本文未読のため、モデルの名称、検査の種類、信頼性係数の値は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "多エージェントLLMで都市排水モデルを校正", "title": "Call my agents – multi-agent LLM-based calibration of urban drainage models: performance and reliability across model scales", "url": "https://doi.org/10.2166/wst.2026.365", "authors": "Katharina Teuber", "venue": "Water Science & Technology", "date": "2026-11-11", "citescore": 6.1, "citescore_year": "2025", "apa": "Teuber, K. (2026). Call my agents – multi-agent LLM-based calibration of urban drainage models: performance and reliability across model scales. Water Science & Technology. https://doi.org/10.2166/wst.2026.365", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（図解抄録の説明文を含む）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "都市排水モデルの校正を、複数のLLMエージェントが分担して自動で進める、手元の計算機で動かせる枠組みを作り、性能と信頼性を調べた（抄録）。", "p3": "監督役のエージェントの下に、モデル担当・校正担当・分析担当の3つのエージェントを置き、モデルの準備、校正、評価を反復して実行させる。調整池の例と、より大きい実流域のモデルで、複数のLLMを比べた（抄録）。", "p5": "調整池の校正では最良の当てはまりがNSE = 0.97で、自動校正（NSE ≈ 0.97〜0.98）と同程度だった。ただし作業の完了とLLMが選ぶ校正の設定はモデルと繰り返しで大きくばらつき、大きいLLMは正確だが計算費用が高く、小さいLLMは速いが不安定だった（抄録）。", "fun": "雨水が下水道をどう流れるかを計算する模型は、実測に合うように多くの数値を調整する必要があり、専門家でも手間がかかる。この研究は、監督役と三人の担当役のAIに会話で作業を進めさせた。結果は専門の自動手法に並ぶこともあったが、同じ指示でも毎回うまくいくとは限らなかった。腕はあるが、まだ安定しない新人のようである。", "unverified": "抄録の末尾が切れており、大きい実流域モデルでの結果の数値は未確認。比べたLLMの名称も未確認。"}}, {"id": "jr43", "rank": 43, "headline": "エージェント型AIの知識統合で厄介な問題を支援", "title": "Decision support through agentic AI: Knowledge-integration mechanisms for wicked-problem solving and the design-maturity paradox", "url": "https://doi.org/10.1016/j.dss.2026.114799", "authors": "Shaofeng Wang ほか", "venue": "Decision Support Systems", "date": "2026-11-12", "sjr": 2.079, "citescore": 13.5, "citescore_year": "2025", "apa": "Wang, S., & Zhang, H. (2026). Decision support through agentic AI: Knowledge-integration mechanisms for wicked-problem solving and the design-maturity paradox. Decision Support Systems, 114799. https://doi.org/10.1016/j.dss.2026.114799", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、エージェント型のAIによる意思決定支援について、解き方も正解も定まらない「厄介な問題」を解くための知識統合の仕組みと、設計の成熟度に関する逆説を扱う研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、関係者ごとに何が問題かの見方さえ違うような難題に対して、自分で段取りを立てて動くAIが、ばらばらの知識をどうまとめれば助けになるか、というものである。題名にある「設計の成熟度の逆説」は、作り込むほど良くなるとは限らないことを示唆するが、内容は未確認である。", "unverified": "抄録・本文を入手できず、研究の方法（設計研究か実証か）、対象の問題、結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "AI導入がwell-being経由で成績に効く仮説は不支持", "title": "AI Adoption, Employee Well-being and Job Performance", "url": "https://doi.org/10.68379/sbzf3x83", "authors": "Mehreen Aslam", "venue": "Dyal Singh Journal of Humanities & Social Sciences", "date": "2026-11-11", "apa": "Aslam, M. (2026). AI Adoption, Employee Well-being and Job Performance. Dyal Singh Journal of Humanities & Social Sciences, 4(1), 117–149. https://doi.org/10.68379/sbzf3x83", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "AI導入が従業員のwell-beingを通じて職務成績を高め、AI不安がその関係を弱めるという仮説を検証したが、媒介も調整も支持されなかった（抄録）。", "p3": "仕事の要求度-資源モデルと資源保存理論に基づき、3時点の時間差のある調査で、従業員の回答と上司が評価した職務成績を組にした400件を、回帰とブートストラップによる条件付き間接効果で分析した（抄録）。", "p5": "well-beingはその後の成績と正に関連した（b = 0.24）が、AI導入とwell-beingの関連は有意でなく（b = 0.03）、条件付き間接効果も交互作用も有意でなかった。AI導入は成績と直接に正の関連を持ち（b = 0.23）、AI不安はwell-beingと成績の両方と負に関連した（抄録）。", "fun": "「AIを入れると働く人が元気になり、だから成績が上がる」という筋書きは、もっともらしい。しかしこの研究で実際に測ると、AI導入と元気さの間にはっきりした関係は見つからなかった。成績は上がっていたが、元気さを通る道ではなかったのである。予想が外れた結果をそのまま報告している点に価値がある。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。掲載誌は小規模で、標本の国と業種も未確認。"}}, {"id": "jr45", "rank": 45, "headline": "AIは高齢化による労働力不足を埋められるか", "title": "AI and the Peak Retirement Wave in the U.S.: Can AI Bridge the Coming Labor Gap?", "url": "https://doi.org/10.1093/workar/waag018", "authors": "Mo Wang ほか", "venue": "Work, Aging and Retirement", "date": "2026-11-09", "sjr": 1.396, "citescore": 6.5, "citescore_year": "2025", "apa": "Wang, M., & Fang, Y. (2026). AI and the Peak Retirement Wave in the U.S.: Can AI Bridge the Coming Labor Gap? Work, Aging and Retirement. https://doi.org/10.1093/workar/waag018", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "米国で退職が集中する時期に、AIが労働力の不足をどこまで埋められるかを論じ、部分的には補えるが、政策と組織の設計しだいだと結論した（抄録）。", "p3": "2024年に65歳になった人は過去最多で、2035年までに約1,600万人が退職すると見込まれる。この状況で、AIの可能性を、作業の自動化だけでなく、残る従業員の仕事の拡張と、長く働けるようにする役割の再設計の面から検討した論考である（抄録）。", "p5": "AIは、判断、暗黙知、対人のケア、手先の器用さに頼る職業の代替には明確な限界がある。急速な導入は、若手と中堅の働き手の育成の道筋を乱す危険も生む（抄録）。データによる推定は抄録に記載なし。", "fun": "働き手が一斉に退職していくなら、足りない分をAIに任せればよい、と考えたくなる。しかし、長年の経験でしか身につかない勘や、人の世話、細かい手作業は、AIが苦手とするところである。この論考は、AIを「人の代わり」でなく「年を重ねても働き続けられるようにする道具」として設計することを提案している。", "unverified": "抄録の末尾が切れており、提言の全体は未確認。実証分析ではなく論考と読める。"}}, {"id": "jr46", "rank": 46, "headline": "ハイデラバード都市圏の地価を成長分析で可視化", "title": "Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India", "url": "https://doi.org/10.1061/jupddm.upeng-6450", "authors": "D. Shivaram Reddy ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-11", "citescore": 3.9, "citescore_year": "2025", "apa": "Shivaram Reddy, D., & Onkar, P. S. (2027). Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India. Journal of Urban Planning and Development, 153(1). https://doi.org/10.1061/jupddm.upeng-6450", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得）", "preprint": false, "short": true, "p1": "インドのハイデラバード都市圏を例に、都市の成長の広がり方と地価の変動を空間データの可視化で結びつけ、土地の需要が高い区域を把握しようとした（抄録）。", "p3": "都市の物理的な成長の型を分析し、成長と地価の変化を対応づけて、地価から見た土地需要の区域を空間的に可視化した（抄録）。手法の詳細は抄録に記載なし。", "p5": "都市の成長の型を使って土地需要の区域を理解できるとする（抄録）。抄録は背景の説明が中心で、得られた区域の内容や数値は記載されていない。", "fun": "街が広がると、どこの土地の値段が上がるのか。地図の上に、街の広がり方と地価の動きを重ねてみると、需要が集まる場所が浮かび上がる。土地は増やせない資源なので、どこが求められているかを早くつかむことが、計画の出発点になる。この研究は、その見える化を急成長する大都市で試みている。", "unverified": "抄録に手法と結果の具体的な記述がなく、使用データ、期間、区域の内容はすべて未確認。"}}, {"id": "jr47", "rank": 47, "headline": "スマートシティの包摂的イノベーションを116報で整理", "title": "Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps", "url": "https://doi.org/10.3389/frsc.2026.1983822", "authors": "Seyedeh Sedigheh Ghorashi ほか", "venue": "Frontiers in Sustainable Cities", "date": "2026-11-09", "citescore": 5.1, "citescore_year": "2025", "apa": "Ghorashi, S. S., Karvonen, A., Mobini Dehkordi, A., & Yadollahi Farsi, J. (2026). Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps. Frontiers in Sustainable Cities, 8. https://doi.org/10.3389/frsc.2026.1983822", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "スマートシティ研究で使われる「包摂的イノベーション」という概念が、ばらばらに定義・運用されている現状を、系統的な文献レビューで整理した（抄録）。", "p3": "ScopusとWeb of Scienceの検索で特定した査読つき文献116件を、PRISMAの手順に従い、語の共起の計量書誌分析と、主題の統合によって分析した（抄録）。", "p5": "スマートな統治と市民参加、デジタル包摂と基盤、公平・正義と社会イノベーション、環境の持続可能性と都市の回復力、知識の共同生産と都市の実験の場という5つの主題群が得られた。包摂的イノベーションは技術へのアクセスを超え、市民の主体性や手続きの正義を含む多次元の概念だとした（抄録）。", "fun": "スマートシティは、便利な技術で街を良くする計画である。しかし「誰にとって良いのか」は別の問題で、技術を使いこなせる人だけが得をする街になるおそれもある。そこで「みんなを取り残さない」という言葉が掲げられるが、その中身は研究ごとにばらばらだった。この研究は多数の論文を読み比べ、言葉の中身を五つの束に整理した。", "unverified": "抄録の末尾が切れており、指摘された研究の空白の内容は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "循環型の都市代謝に向けた技能と空間の転換", "title": "Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy", "url": "https://doi.org/10.1177/00420980261499471", "authors": "Claudia Faraone ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Faraone, C., Gambarotto, F., Nicoletto, L., & Pedrini, G. (2026). Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy. Urban Studies. https://doi.org/10.1177/00420980261499471", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "循環型の経済へ移るうえで、都市の製造業の立地と技能がどう働き、都市計画がそれを助けているか妨げているかを、イタリアの二つの工業地域で調べた（抄録）。", "p3": "パドヴァとヴェネツィアについて、製造業の空間分布の最近の変化を、形態・空間の分析、都市計画の評価、雇用と廃棄物の定量データを組み合わせた混合手法で調べた（抄録）。", "p5": "技術系の製造業が、技術的な技能と環境関連の雇用に支えられ、廃棄物の発生抑制と再資源化を通じて循環の実績を引っ張っていた。一方、両都市とも、新しい循環の動きと既存の用途地域の枠組みがかみ合っておらず、計画は断片的で受け身だった（抄録）。", "fun": "ごみを出さず、資源を回して使う経済に変えるには、工場どうしが近くにあって、ある工場の廃棄物を別の工場の材料にできると都合がよい。ところが、街の用途の区分けは昔の考えで決められていて、そうした近さを生かしにくい。この研究は、技能を持つ人と工場の近さを「街の資源」と見て、区分けの決め方を変えるよう求めている。", "unverified": "抄録の末尾が切れており、提言の後半は未確認。定量データの数値も抄録に記載なし。"}}, {"id": "jr49", "rank": 49, "headline": "据置充電と電化道路の回廊単位のインフラ費用", "title": "Corridor-level infrastructure costs of static charging versus electric road systems in Germany", "url": "https://doi.org/10.1016/j.trd.2026.105725", "authors": "Mathias Schmidt ほか", "venue": "Transportation Research, Part D: Transport and Environment", "date": "2026-11-10", "sjr": 2.032, "citescore": 13.6, "citescore_year": "2025", "apa": "Schmidt, M., & Walther, G. (2027). Corridor-level infrastructure costs of static charging versus electric road systems in Germany. Transportation Research Part D: Transport and Environment, 163, 105725. https://doi.org/10.1016/j.trd.2026.105725", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社サイトの本文は未取得）", "preprint": false, "short": true, "p1": "ドイツの高速道路網で、電気トラックのための据置型の充電設備と、走りながら給電する電化道路（Electric Road Systems）の費用を、同じ単位で比べられるようにした（抄録）。", "p3": "電気トラックの需要が必要とする据置の設備（荷さばき場の充電、公共の充電拠点、変電所、蓄電、系統接続）を積み上げ式に設計・積算し、費用を区間の長さで割って、電化道路の基準と比べられる1kmあたりの指標にした（抄録）。", "p5": "据置型は、対象とした回廊の長さの37.6%で電化道路より高く、最も混む区間では1kmあたり400万ユーロという基準の2.6〜3.2倍に達した。区間ごとに安いほうを割り当てると、理想的には投資を21%節約できる（抄録）。", "fun": "電気トラックを走らせるには、止まって充電する場所を増やすか、道路に架線などを付けて走りながら電気を送るかの二つの道がある。後者は工事費が高すぎると見られてきた。しかし交通量の多い区間では、充電場所を大量に作るほうがかえって高くつくことが分かった。どちらか一方でなく、区間ごとに使い分けるのが得になる。", "unverified": "本文未読のため、需要の想定年次、費用の前提、電化道路の基準値の出どころは未確認。"}}, {"id": "jr50", "rank": 50, "headline": "都市の土地資本化が農村産業の発展を縛る", "title": "Urban land capitalization and rural industrial development: How spatial fix theory explains constraints on urban-rural integration in China", "url": "https://doi.org/10.1016/j.jrurstud.2026.104508", "authors": "Zhenzhen Chen ほか", "venue": "Journal of Rural Studies", "date": "2026-11-11", "sjr": 1.731, "citescore": 10.9, "citescore_year": "2025", "apa": "Chen, Z., & Lei, P. (2027). Urban land capitalization and rural industrial development: How spatial fix theory explains constraints on urban-rural integration in China. Journal of Rural Studies, 129, 104508. https://doi.org/10.1016/j.jrurstud.2026.104508", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、中国で都市の土地が資本として扱われること（土地の資本化）と農村の産業発展の関係を取り上げ、都市と農村の統合を妨げる制約を「空間的回避（spatial fix）」の理論で説明する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、都市の土地の値上がりで資金を生み出す仕組みが、なぜ農村の産業を育てる妨げになるのか、というものである。資本が行き場を求めて場所を移していくという地理学の理論で、都市と農村の関係を読み解こうとしている点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、研究の方法、対象地域、結論はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "脆弱な保険会社が住宅ローンの気候リスクを隠す", "title": "When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets", "url": "https://doi.org/10.1093/qje/qjag053", "authors": "Parinitha Sastry ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-07", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Sastry, P., Sen, I., & Tenekedjieva, A.-M. (2026). When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag053", "why": "フロリダ州の2009〜2018年の住宅ローンと保険の新しいデータで、資本と分散の乏しい保険会社が市場を占め、その破綻が災害後のローン不履行を因果的に増やすことを示した。政府支援機関（GSE）は第三者の格付けに頼って破綻リスクの高い保険を値づけせずに受け入れており、フロリダでのGSEの期待損失の推定25%が保険の脆弱さに由来する。貸し手は自ら保有するジャンボ融資でだけ保険の質に反応する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "気候リスクが住宅ローンと住宅保険で正しく価格づけされていないことが、納税者の大きな負担と、危険な地域への過剰な信用供与を生んでいることを、フロリダ州のデータと複数の自然実験で示した。中心の原因は、政府支援機関（GSE）が保険会社を評価する方針にあるとする（抄録）。", "p2": "背景：米国では住宅ローンの借り手に住宅保険への加入が求められ、GSEが基準に合うローンを買い取る。保険会社が破綻すれば災害後に保険金が支払われず、ローンの焦げつきにつながりうる。保険の質の低下がローン市場でどう扱われているかが、この論文の問いである（抄録）。", "p3": "2009〜2018年のフロリダ州について、住宅ローンと保険の両方を含む包括的なデータを新たに作った。まず、資本が薄く分散の乏しい新興の保険会社が市場を占めるようになったことを記録する。次に、保険会社の破綻が災害後のローンの債務不履行を因果的に増やすことを示す。さらに、GSEに売却される適合ローンと、貸し手が保有し続けるジャンボローンで、審査が保険の質にどう反応するかを比べる（抄録）。", "p4": "結果は、保険会社の破綻率、災害後の債務不履行、GSEの期待損失、ローンの否決率である（抄録）。自然実験の具体的な内容と標本の大きさは抄録に記載なし。", "p5": "脆弱な保険会社は破綻率が高く、破綻は災害後の債務不履行を増やした。GSEは第三者による格付けに頼るため、破綻の危険が高い会社の保険を、価格に反映しないまま受け入れていた。フロリダ州でのGSEの期待損失のうち推定25%が、保険の脆弱さに由来する。ローンの否決率は、貸し手が保有するジャンボでは保険の質に敏感だが、GSEに売る適合ローンでは敏感でなかった（抄録）。", "p6": "抄録には限界の記載がない。フロリダ州の一時期の結果であること、他の州や近年への当てはまり、期待損失の推定の前提は、本文を読めておらず未確認。", "fun": "家を買うとき、銀行は「火災や台風の保険に入ること」を条件にお金を貸す。では、その保険会社が台風のあとに倒産したらどうなるか。保険金が出ず、家を直せない人はローンを返せなくなる。この研究が面白いのは、銀行の振る舞いの違いを突いた点である。自分で持ち続けるローンでは保険会社の質をよく見るのに、国の関連機関に売ってしまうローンでは見ていなかった。損を誰がかぶるかで、同じ銀行の慎重さが変わる。", "unverified": "本文は取得できず、自然実験の内容、データの規模、期待損失の推定方法は未確認。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "誤った信念が大量のデータのもとでも残る理由", "title": "Channeled Attention and Stable Errors", "url": "https://doi.org/10.1093/qje/qjag055", "authors": "Tristan Gagnon-Bartsch ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-09", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Gagnon-Bartsch, T., Rabin, M., & Schwartzstein, J. (2026). Channeled Attention and Stable Errors. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag055", "why": "人は自分の（誤っているかもしれない）モデルを通して注意を向けるため、データに触れてもモデルの誤りを示す統計を追わない、という注意に基づく枠組みを示した。「関係ない」「区別はない」と何かを誤って除外するモデルは、反証するデータから注意をそらすので安定しやすい。誤りが見つかるかは損害の大きさと結びつかず、新しい目が誤りに気づく理由などを説明する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "利害が大きく、データが豊富で、学ぶ機会が何度あっても誤った信念が直らない理由を、注意の向け方から説明する理論を作った。人は自分のモデルが関係があるとみなすデータにしか注意を向けないので、モデルの誤りを示す統計を追わない（抄録）。", "p2": "標準的な議論では、利害が大きくデータが十分にあれば、人は誤りを正すはずである。しかし現実には誤った信念が持続する。データに触れていることと、自分のモデルが誤りだと分かる統計を追っていることは同じではない、という点が説明されていなかった（抄録）。", "p3": "人が、誤って定式化されているかもしれない自分のモデルを通して注意を配分する、という枠組みを立てる。本人が関係があるとみなすデータが、長期的にもそのモデルをありえないものに見せないとき、そのモデルを「注意の面で安定」と呼ぶ。この定義のもとで、どんな誤りが持続するかを分析する（抄録）。例：ある変数は関係ないと信じる人は、その変数を記録しないので、関係があっても気づけない。", "p4": "理論研究であり、データによる検証ではない。枠組みを、心理的なバイアスと経験的な誤解の安定性の分析に当てはめる（抄録）。当てはめた具体例は抄録に記載なし。", "p5": "何かを誤って「ない」とするモデル（ある変数は関係ない、ある区別は存在しない）は、反証するデータから注意をそらすので安定しやすい。誤って「ある」とするモデルは安定しにくい。誤りが見つかるかどうかは意思決定の問題の構造で決まり、害の大きさとは強く結びつかない。どれほど高くつく誤りも持続しうるし、ささいな誤りが見つかることもある。ただし、意思決定の環境の変化と、注意を広げるショックの両方に頑健な誤りは存在しない（抄録）。", "p6": "抄録には限界の記載がない。注意の配分の定式化、仮定の強さ、実証的に検証する方法は、本文を読めておらず未確認。", "fun": "「朝ごはんの中身は午後の集中力に関係ない」と思っている人は、何を食べたかを記録しない。だから、もし関係があっても気づく機会がない。この理論の面白さは、間違いの「向き」に注目した点にある。「関係ない」と切り捨てる間違いは、証拠を見なくなるので直りにくい。「関係がある」と思い込む間違いは、気にして見るので外れに気づきやすい。新人や部外者が誤りを見つけやすいのも、見る場所が違うからだと説明できる。", "unverified": "本文は取得できず、モデルの数学的な定式化、命題の条件、応用例の内容は未確認。"}}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "A/Bテストの因果信号で言語モデルを調整", "title": "EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests", "url": "https://doi.org/10.1177/00222437261510017", "authors": "Panagiotis Angelopoulos ほか", "venue": "Journal of Marketing Research", "date": "2026-11-11", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Angelopoulos, P., Lee, K., & Misra, S. (2026). EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests. Journal of Marketing Research. https://doi.org/10.1177/00222437261510017", "why": "無作為化実験が示す「どの方向に直せば良くなるか」を教師信号として言語モデルを微調整し、成果の低い文面を高い文面に変える改善器を作る枠組みを示した。36キャンペーン・2億8,300万インプレッションのメール配信の実地実験で、改善した件名のクリック率は専門家だけの場合より32%高く、パラメータ数が30倍の汎用モデルは改善しなかった。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず。早期公開版）", "preprint": false, "p1": "A/Bテストに含まれる因果の信号に言語モデルを合わせることで、マーケティングの文面を改善する枠組みを作り、大規模な実地実験でクリック率が上がることを示した（抄録）。", "p2": "ランダム化実験は、どの文面が最もよいかだけでなく、どの方向に直せばよくなるかも明らかにする。著者らは、この「改善の方向」を生成モデルの教師信号として使えると考えた。モデルの規模を大きくすれば足りるのか、実験データへの適合が必要なのかも問いになる（抄録）。", "p3": "同じ実験の中での比較を使って言語モデルを微調整し、成績の低い文面を成績の高い文面に書き換える「改善器」を作る。この改善器は、人間の専門家など任意の意思決定者と組み合わせて、新しい文面への改善案を出せる（抄録）。", "p4": "メールマーケティングの実地実験で検証した。36の新しいキャンペーン、二億八千三百万回の表示が対象である。件名のクリック率を、支援を受けない人間の専門家と比べ、微調整したモデルの30倍のパラメータを持つ汎用の言語モデルとも比べた（抄録）。", "p5": "適合させたモデルが改善した件名は、支援を受けない専門家の件名より32%高いクリック率を得た。30倍のパラメータを持つ汎用の言語モデルは成果を改善しなかった。著者は、実験データへの適合が、モデルの能力そのものを超える価値を加えると述べる（抄録）。", "p6": "抄録には限界の記載がない。メールの件名という一つの用途の結果であること、購入や配信停止などクリック率以外の成果への影響、企業や業種による違いは、本文を読めておらず未確認。", "fun": "メールの件名を二通り用意し、ランダムに送り分けて、どちらがよく開かれるかを比べる。企業はこの実験を日々繰り返している。この研究は、その勝ち負けの記録をAIの教材にした。「負けた件名を勝った件名に書き直す」練習を積ませたのである。結果、ずっと大きな汎用のAIには出せなかった改善を、小さなAIが出した。賢さの大きさより、実験が教える「直す方向」を学んだかどうかが効いた、という点が面白い。", "unverified": "本文は取得できず、微調整したモデルの種類、実験の割り付けの単位、効果の信頼区間は未確認。"}}, {"id": "jn04", "rank": 4, "field": "天文学", "headline": "M87*のブラックホールの影を独立の手法で確認", "title": "Independent interferometric observable confirms black hole shadow in M87*", "url": "https://doi.org/10.1038/s41586-026-11241-9", "authors": "Samuel Lai ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Lai, S., Thyagarajan, N., Wong, O. I., & Diakogiannis, F. (2026). Independent interferometric observable confirms black hole shadow in M87*. Nature, 659(8140), 317–323. https://doi.org/10.1038/s41586-026-11241-9", "why": "超長基線電波干渉計の観測は疎で、画像の再構成は校正や事前の仮定に左右されるため、M87*のリング状の構造には異論もあった。形の事前仮定を置かず、装置の校正誤差に影響されない観測量に基づく独立の画像化アルゴリズムを同じデータに適用し、角直径42.2±1.5マイクロ秒角のリング（質量は太陽の65±5億倍に相当）を再現した。", "explain": {"basis": "本文", "basis_note": "出版社のPDFの本文（主文とMethodsの前半）を読んだ。拡張データの図とMethodsの後半は読んでいない", "preprint": false, "p1": "地球規模の電波干渉計（EHT）が捉えたM87銀河の中心ブラックホールの「影」を、装置の較正誤差に影響されない観測量だけを使う独立のアルゴリズムで画像化し、リング状の構造を再確認した。直径は42.2±1.5マイクロ秒角だった（抄録）。", "p2": "EHTは少数の望遠鏡を結ぶので開口がまばらにしか埋まらず、画像の再構成は解が一つに定まらない。解は較正、後処理、画像化の設定に敏感で、従来の方法は人手で調整した正則化や初期画像に頼っていた。外部の再解析には、視野を120マイクロ秒角より広げると細長い輝点になるとして、リングの形を疑うものもあった（p.1）。", "p3": "観測量には「クロージャー不変量」を使う。望遠鏡の組の信号を三角形に組み合わせた量で、各望遠鏡の較正誤差が打ち消される。アルゴリズムGenDIReCTは、この量だけを条件として潜在拡散モデルで画像を多数生成し、データに合う一枚にまとめる。学習には天文学と無関係な自然画像（主にCIFAR-10）を使い、検証の後はモデルを変えずに実データへ適用した（p.2〜3、Methods）。", "p4": "公開されている波長1.3ミリのデータのうち、2017年の4日、2018年の2日、2021年の2日を使う。視野は128、225、450マイクロ秒角四方の3通りで、データと視野の組ごとに独立のモデルを作る。EHTと同じ特徴抽出法でリングの直径と向きを測って公表値と比べ、幾何学モデルのベイズ推定でも確かめた（p.3、p.5）。", "p5": "すべての観測日で、約40マイクロ秒角のリング状の構造が得られた。各年で最も質の高いデータでは、視野によらず同じ直径と向きのリングになった。直径の平均42.2±1.5は、幾何学モデルの42.3±1.1と整合する。距離を16.8メガパーセクとすると、質量は太陽の約六十五億倍（誤差は約五億倍）で、星の運動からの推定と合う。ジェットから約20°傾いて見た場合に最もよく合った（表1、p.5〜6）。", "p6": "質の低いデータでは、まれにリングがはっきりしない再構成が出る。最もあいまいなのは、望遠鏡が一つ欠けた2018年4月25日である。リングの幅と中心の明るさは方法による違いが大きく、天体の本来の性質とはみなせない。スピンの大きさは制約できなかった。生成される解のばらつきは、ベイズの意味での不確かさではないと著者は断っている（p.4〜6、Methods）。", "fun": "初めて公開されたブラックホールの「影」の画像は、直接撮った写真ではない。地球上の数か所の望遠鏡の信号から、計算で組み立てたものである。望遠鏡が少ないので組み立て方には選択の余地があり、「輪に見えるのは解析のやり方のせいではないか」という批判もあった。この研究は、天文学と無関係な日常の写真だけで学習したAIに、機器の誤差が打ち消される量だけを渡して画像を作らせた。輪の形を教えていないのに、輪が現れた。", "unverified": "拡張データの図、検証試験の詳細、学習データに輪や三日月の形が含まれる影響の検討（Methods）は読んでいない。"}}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "エボラの恐怖が黒人の住宅ローン否決率を上げた", "title": "Deadly Disease, Fear, and Ostracism in the Credit Market", "url": "https://doi.org/10.1287/mnsc.2025.01919", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Agarwal, S., Lin, P., Lin, Y., Lu, R., & Zhang, X. (2026). Deadly Disease, Fear, and Ostracism in the Credit Market. Management Science. https://doi.org/10.1287/mnsc.2025.01919", "why": "2014年の米国のエボラ流行を自然実験として、感染リスクがほぼないのに黒人申請者の住宅ローン否決率が3.8ポイント上がったことを示した。承認された借り手は信用力が高く不履行も少なく、アルゴリズムによるフィンテック融資では効果がなく、流行後すぐ戻ることから、統計的差別では説明できないと論じる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "2014年の米国でのエボラ出血熱の発生を自然実験として、恐怖が住宅ローンの配分を歪めるかを調べた。感染の危険がほとんどないにもかかわらず、発生中に黒人の申請者の否決率が上がった（抄録）。", "p2": "背景：貸し手が属性によって審査を変える理由として、属性から返済の見込みを推し量る統計的差別がよく議論される。この研究は、感染への恐怖という、返済能力と無関係な要因が審査を変えるかを問う（抄録）。", "p3": "エボラの発生を外生的な出来事として、発生中の黒人の申請者の否決率の変化を推定する。承認された借り手の信用の質、債務不履行率、延滞したときの条件変更の受けやすさも調べ、アルゴリズムで審査するフィンテックの貸し手と比べる。政治の周期、労働市場への影響、申請者の構成の変化、銀行の財務状況による説明は、頑健性の検定で検討する（抄録）。", "p4": "結果は、住宅ローンの否決率、承認された借り手の信用の質と債務不履行率、延滞時の条件変更である（抄録）。データの出所、比較の設計の詳細、標本の大きさは抄録に記載なし。", "p5": "発生中、黒人の申請者の否決率は3.8パーセントポイント上がった。承認された黒人の借り手は信用の質が高く債務不履行率が低かったが、延滞したときに条件変更を受けにくかった。この効果はフィンテックの貸し手では見られず、発生の後すぐに元に戻った。著者はこれを統計的差別とは整合しない型とみる。エボラへの恐怖に強くさらされた経験は、COVID-19の流行時に有意な学習効果を生まなかった（抄録）。", "p6": "抄録には限界の記載がない。恐怖にさらされた度合いの測り方、地域による違い、黒人の申請者に効果が出た経路の特定は、本文を読めておらず未確認。", "fun": "2014年、米国でエボラ出血熱の感染者が出て、大きな不安が広がった。この時期、黒人の人が住宅ローンを断られる割合が上がった。感染の危険とは関係がないのに、である。しかも審査を通った人たちはむしろ返済が確実だったので、「返せなさそうだから断った」という説明は成り立たない。機械が審査する貸し手では、この変化は起きなかった。恐怖という感情がお金を貸す判断に入り込んだ跡を、データから読み取った研究である。", "unverified": "本文は取得できず、データの出所、推定の設計、恐怖の指標、効果の持続期間の詳細は未確認。"}}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "非上場企業の開示が上場企業の銀行依存を下げる", "title": "Private Firm Disclosures and Public Firms' Debt Choice", "url": "https://doi.org/10.2308/tar-2024-0646", "authors": "Fengqin Chen ほか", "venue": "The Accounting Review", "date": "2026-11-10", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Chen, F., Pittman, J., & Saffar, W. (2026). Private Firm Disclosures and Public Firms’ Debt Choice. The Accounting Review, 1–30. https://doi.org/10.2308/tar-2024-0646", "why": "複数国の標本で、非上場企業の開示の透明性が情報の非対称性を狭め、上場企業の銀行借入への依存を下げることを示した。電子的な商業登記の段階的な導入を外生的なショックとして用い、監視需要の低下・借入費用の低下・格付けの質の向上という経路を確かめた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "非上場企業の情報開示が透明であるほど、情報の非対称性が縮まり、上場企業が銀行借入に頼る度合いが下がることを、複数の国の標本で示した（抄録）。", "p2": "背景：銀行は借り手を監視できるので、外から見えにくい企業は社債より銀行借入に頼りやすい。この研究は、非上場企業の開示という、上場企業自身のものではない情報が、上場企業の負債の選択に波及するかを問う（抄録）。", "p3": "複数の国の標本で、非上場企業の開示の透明性と、上場企業の銀行借入への依存の関係を推定する。経路として、監視の需要、借入費用、信用格付けの質を調べる。内生性に対処するため、電子的な商業登記簿の導入時期が国によってずれることを外生的なショックとして使い、模擬的に求めた開示の範囲を操作変数として使う（抄録）。", "p4": "結果は、上場企業の銀行借入への依存度である。上場企業の情報の不透明さ、非上場企業の開示の重要度、社債市場の発達の度合いによる違いも調べる（抄録）。対象の国の数、期間、標本の大きさは抄録に記載なし。", "p5": "非上場企業の開示が透明なほど、上場企業の銀行借入への依存は低かった。監視の需要と借入費用が下がり、信用格付けの質が上がるという経路が支持された。効果は、上場企業の情報が不透明なとき、非上場企業の開示が上場の同業者にとって重要なとき、社債市場が発達しているときに大きかった。登記簿の電子化と操作変数を使った分析でも、結果は保たれた（抄録）。係数の値は抄録に記載なし。", "p6": "抄録には限界の記載がない。開示の透明性の測り方、国の制度の違いの統制、登記簿の電子化が別の経路で負債の選択に影響する可能性は、本文を読めておらず未確認。", "fun": "国によっては、株式を公開していない会社にも決算の公表が求められる。その情報は誰の役に立つのか。この研究の答えは意外で、同じ業界の「上場している会社」の役に立っていた。業界全体の様子が分かると、投資家は上場企業のことも判断しやすくなる。すると上場企業は、銀行に見張ってもらわなくても、社債で直接お金を集めやすくなる。他社の情報公開が、自社の資金調達の選択肢を広げるという波及が面白い。", "unverified": "本文は取得できず、対象の国と期間、透明性の指標、効果の大きさは未確認。"}}, {"id": "jn07", "rank": 7, "field": "工学", "headline": "しなるゴム翼で潮流タービンの疲労荷重を3分の1減", "title": "Flexible rubber blades for tidal turbines", "url": "https://doi.org/10.1038/s41586-026-11278-w", "authors": "Zhehong Zhang ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Zhang, Z., Tan, J., Neba, E.-C., Morival, S., Frankowski, K., Daval, B., & Viola, I. M. (2026). Flexible rubber blades for tidal turbines. Nature. https://doi.org/10.1038/s41586-026-11278-w", "why": "潮流発電のタービンは非定常な流体荷重を受け、大型機は複雑で高価な能動ピッチ制御に頼っている。翼弦方向に後縁が変形する柔らかいゴム製の翼が、模擬した潮汐周期で能動ピッチ制御つきの剛な翼と同等の総発電量を保ちつつ、疲労の原因となる高周波の荷重変動を最大3分の1抑えることを実験で示した。", "explain": {"basis": "本文", "basis_note": "出版社のPDFの本文（主文とMethodsの実験設備・翼の節）を読んだ。補足資料と拡張データの図は読んでいない", "preprint": false, "p1": "潮流発電のタービンの翼を、後縁がしなるゴム製にすると、複雑なピッチ制御装置なしで、同等の発電量を保ちながら、疲労の原因になる荷重の変動を減らせることを、水槽実験で示した（抄録）。", "p2": "潮流は予測しやすい再生可能エネルギーだが、流速の変化や乱れによる荷重の変動が疲労を早め、費用を押し上げる。大型機は翼の角度を能動的に変えるピッチ制御で対処するが、海中でのセンサと駆動装置の信頼性に懸念があり、応答が遅く高周波の変動には追いつかない。翼を付け根で受動的に回す方式も、可動部が増える（p.1）。", "p3": "翼の前側の厚い部分は剛体のままとし、後縁を付け根から先端までしなるようにした。無負荷の形は反りを大きく作ってあり、流れの力を受けると後縁がたわんで反りが平らになり、力を逃がす。翼は、鋼の芯のまわりの型にゴムを注入して作る（p.2、p.4、Methods）。背景：反りは翼断面の曲がりの大きさで、大きいほど揚力が増える。", "p4": "エディンバラ大学の円形水槽（直径25m）で、回転直径1.26mの3枚翼の模型を、流速0.444〜0.923m/sで試験した。剛体翼とゴム翼について、出力、推力、付け根の曲げモーメントの平均と変動を測り、翼端の変形を水中カメラの画像相関法で測った。潮汐の周期を模擬して、能動ピッチ制御つきの剛体翼と比べた（p.2〜4、Methods）。", "p5": "定格流速以上で、ゴム翼の出力係数は剛体翼とほぼ同じで、最大は約0.37だった。模擬した潮汐周期では、出力の時間変化が能動ピッチ制御つきの剛体翼と重なり、発電量の差は無視できた。速度制御だけの剛体翼では推力が定格の約1.65倍まで上がるが、ゴム翼の推力は能動ピッチ制御と同程度に収まった。定格流速での変動は、出力で約18%、推力で約23%、曲げモーメントで約28%小さかった（図1〜3、p.3）。", "p6": "模型はレイノルズ数が低く、出力係数の最大値は実機より小さい。低い流速では、ゴム翼の推力係数は剛体翼よりやや高く、変動も相対的に増える。実機（直径20m）への適用は数値計算で確かめた段階で、鋼の芯の剛性は実際には相似に拡大できない。ゴムの配合は非公開である（p.2〜5、Methods）。", "fun": "潮の流れで回る水車は、流れが強すぎると壊れやすい。そこで今の大型機は、羽根の角度を機械で変えて力を逃がしている。しかし海の底で動く機械は故障が心配である。この研究の羽根は、後ろ側がゴムでできている。流れが強くなると勝手にしなって平たくなり、余分な力を受け流す。魚や木が形を変えて流れをやり過ごすのと同じ理屈である。機械を足すのではなく、材料の柔らかさに仕事をさせる発想が面白い。", "unverified": "能動ピッチ制御つきの剛体翼の曲線の求め方、補足資料（寸法の効果、芯の設計、疲労寿命の試算、産業上の影響）、拡張データの図は読んでいない。"}}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "洪水域からの買い上げ移転の便益は裕福な地区に偏る", "title": "Does government-assisted relocation help households", "url": "https://doi.org/10.1126/sciadv.aef4602", "authors": "Rachel Young", "venue": "Science Advances", "date": "2026-11-11", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Young, R. (2026). Does government-assisted relocation help households. Science Advances, 12(46). https://doi.org/10.1126/sciadv.aef4602", "why": "米国FEMAの住宅買い上げプログラムを、全国の世帯の縦断記録で評価した。参加世帯は洪水危険区域の外へ移りやすく、短期的に負債が減り近隣の社会経済条件が改善するが、便益は裕福で白人が多い地区の参加者に集中する。便益費用比は3つのシナリオで0.84〜1.28だった。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "洪水の危険が高い地域から世帯を移転させる米国連邦政府の買い取り制度が、世帯の移転、洪水の危険、家計にどう影響したかを、全国の追跡記録で評価した。参加世帯は危険区域の外へ移りやすくなったが、利益は裕福な地域の世帯に偏っていた（抄録）。", "p2": "気候変動で洪水と暴風雨が激しくなり、政府は危険の高い地域からの世帯の移転を検討している。しかし、こうした制度が実際に危険を減らし、世帯の暮らしをよくするかどうかの証拠はほとんどなかった（抄録）。", "p3": "米国連邦緊急事態管理庁（FEMA）の物件買い取り制度について、承認の前後で世帯を追跡する全国の縦断記録を使う。地図上の洪水の危険が同程度の世帯を比べ、移転、危険区域での居住、家計の結果への効果を推定する。費用便益分析も行う（抄録）。", "p4": "結果は、FEMAが指定する洪水危険区域の外への移転、負債、移転先の近隣の社会経済的な条件である。費用便益比を3つのシナリオで求める（抄録）。世帯数、期間、比較の方法の詳細は抄録に記載なし。", "p5": "参加世帯は洪水危険区域の外へ移る確率が高く、短期的に負債が減り、近隣の社会経済的な条件が改善した。ただし利益は、裕福で白人が多数を占める地域からの参加者に集中した。そうした世帯は移転が早く、危険の減少も大きかった。費用便益比は3つのシナリオで0.84から1.28だった（抄録）。", "p6": "著者は、制度の価値が実施費用と、実際に実現した危険の減少に左右されると述べる（抄録）。参加が自発的であることによる選択の偏り、長期の結果、元の地域に残った世帯への影響は、本文を読めておらず未確認。", "fun": "洪水が繰り返す土地の家を、政府が買い取って住民に引っ越してもらう制度がある。危ない場所から人を移すのだから、良い政策に見える。この研究は全国の世帯を追いかけ、確かに危険な区域から出られることを確かめた。しかし、得をしたのは主に裕福な地域の人たちだった。早く引っ越せて、より安全な場所へ移れたからである。費用に見合うかどうかも、条件によって分かれた。善意の制度でも、誰に届くかは別の問題である。", "unverified": "本文は取得できず、世帯数、追跡の期間、識別の方法、費用便益分析のシナリオの内容は未確認。"}}, {"id": "jn09", "rank": 9, "field": "計算社会科学・ネットワーク科学", "headline": "150年分の独議会の移民論戦をLLMで注釈", "title": "LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade", "url": "https://doi.org/10.1162/coli.a.666", "authors": "Aida Kostikova ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Kostikova, A., Pütz, O., Eger, S., Sabelfeld, O., & Paassen, B. (2026). LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade. Computational Linguistics, 1–94. https://doi.org/10.1162/coli.a.666", "why": "ドイツ議会（1867〜2025年）の移民をめぐる発言の連帯・反連帯をLLMで注釈し、最良のモデルは人間同士の一致に近いmacro-F1に達するが系統誤差が下流の推定を偏らせうることを示した。設計に基づく教師あり学習（DSL）で補正した長期の傾向では、戦後に連帯が高く、2015年以降に反連帯が目立って増えた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "ドイツ議会の150年以上の討論で、移民への連帯と反連帯の表現を大規模言語モデル（LLM）に注釈させ、その精度と、下流の推定への影響を評価した。そのうえで、戦後の連帯の高さと、2015年以降の反連帯の増加を示した（抄録）。", "p2": "移民は、戦後の被追放者の受け入れ、労働移民、近年の難民と、ドイツの政治討論の中心的な話題だった。こうした言説の大規模な分析には手作業の注釈が必要で、対象が限られていた。LLMは拡張できる代替手段だが、得られたラベルが下流の推論を妥当に支えるかは確かめる必要があった（抄録）。", "p3": "理論に基づく注釈の体系で、連帯と反連帯の下位の型を定める。複数のLLMを、モデルの大きさ、指示文の方式、微調整、歴史的な文書と現代の文書の違い、系統的な誤りの観点で評価する。長期の傾向の推定では、モデルの確率的なラベルを、設計に基づく教師あり学習（DSL）と組み合わせて偏りを減らす（抄録）。背景：DSLは、少数の人手のラベルを使って、機械の予測ラベルによる推定の偏りを補正する方法。", "p4": "対象は、帝国議会（1867〜1933年）、西ドイツの連邦議会（1949〜1990年）、統一後の連邦議会（1990〜2025年）の討論である。戦後（1949〜1957年）と現代（2009〜2025年）を詳しく分析する。精度はマクロF1で測り、人間どうしの一致と比べる（抄録）。", "p5": "最も性能の高いモデル（GPT-5とgpt-oss-120B）は、人間の一致に並ぶマクロF1を達成した。ただし系統的な誤りが下流の結果を偏らせうる。分析では、戦後の時期に連帯が比較的高く、とくに集団に基づく連帯と思いやりに基づく連帯が目立った。2015年以降は反連帯が目立って増えた（抄録）。F1の値は抄録に記載なし。", "p6": "著者自身が、LLMの出力には厳密な検証が必要で、系統的な誤りがあれば統計的な補正が要ると述べる（抄録）。注釈の体系の妥当性、時代による言葉づかいの変化の扱い、議会での発言が世論を表すかどうかは、本文を読めておらず未確認。", "fun": "150年分を超える国会の発言を人間が読んで分類するのは、ほぼ不可能である。AIに読ませれば速いが、AIには癖があり、ある種類の発言を取り違えやすい。その癖を放置すると、「増えた」「減った」という結論そのものが歪む。この研究は、人間が丁寧に分類した少数の見本を使って、AIの癖を統計的に打ち消した。そうして見えてきたのは、戦後の助け合いの言葉の多さと、この十年ほどの拒絶の言葉の増加だった。", "unverified": "本文は取得できず、注釈の件数、F1の値、補正の前後での傾向の違いは未確認。"}}, {"id": "jn10", "rank": 10, "field": "人口学", "headline": "共同名義の土地権利証は夫婦の絆の証になる", "title": "Joint Land Titling and the Marital Bond in Southwestern Uganda", "url": "https://doi.org/10.1111/padr.70103", "authors": "Michelle Poulin ほか", "venue": "Population and Development Review", "date": "2026-11-11", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "apa": "Poulin, M., & Pierotti, R. S. (2026). Joint Land Titling and the Marital Bond in Southwestern Uganda. Population and Development Review. https://doi.org/10.1111/padr.70103", "why": "ウガンダ南西部で土地権利証を全額補助した無作為化介入では、夫の多くが妻の名を加えた。その意味を観察と面接で調べ、共同名義が妻の交渉力を高めるだけでなく、夫の結婚への関与の象徴として働き、結婚への投資を促す「協力的な力」を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "ウガンダ南西部で、土地の権利証に妻の名前を加える共同名義が、夫婦にとって実際に何を意味するのかを、現地調査と面接で調べた。妻の交渉力が上がるだけでなく、共同名義が夫の結婚への誓約の象徴として働くことを見いだした（抄録）。", "p2": "ウガンダ南西部で、農家に全額補助の土地権利証を提供するランダム化介入が行われ、夫の過半数が妻の名前を権利証に加えることを選んだ。アフリカでは土地の所有の男女差が根強いので、これは目を引く結果だった。その背後にある社会的な力学と、女性が意図どおりに利益を得ているかどうかは分かっていなかった（抄録）。", "p3": "現地での観察、選んだ夫婦への会話形式の面接、地域の指導者への面接を用いる質的研究である。数値で表された結果に民族誌的な方法を当て、行動の背後にある意味、動機、社会的な論理を調べる（抄録）。", "p4": "統計的な検証ではなく、面接と観察から経路を解釈する（抄録）。面接した夫婦の数、選び方、調査の期間は抄録に記載なし。", "p5": "女性の夫婦内での交渉力は高まっており、世帯内交渉のモデルと整合した。加えて、共同名義は、夫が配偶者と結婚に誓約していることの象徴になる、という経路が見つかった。結婚が不安定だと女性の財産権は脅かされるので、この象徴の面が重要だとする。著者らは、強まった夫婦の絆が結婚への投資を促す働きを「協力的な力」と名づけた（抄録）。", "p6": "抄録には限界の記載がない。面接の対象が選ばれた夫婦であること、共同名義を選ばなかった世帯の事情、長期的に女性の権利が守られるかどうかは、本文を読めておらず未確認。", "fun": "土地の権利証に妻の名前も書く。それは本来、妻の財産の権利を守るための手続きである。ところが現地で話を聞くと、夫婦にとってはもう一つの意味があった。「この結婚を続けるつもりだ」という、夫からの目に見える約束である。約束があると、妻も安心して畑や家に力を注げる。数字の調査では「妻の名前が載った」という事実しか分からない。その一行の裏にある気持ちを、聞き取りが明らかにした。", "unverified": "本文は取得できず、面接の件数と方法、元の介入の設計、共同名義を選んだ世帯の割合は未確認。"}}, {"id": "jn11", "rank": 11, "field": "工学", "headline": "アンカー定着部の接触応力を超音波の非線形で推定", "title": "A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity", "url": "https://doi.org/10.1177/14759217261501265", "authors": "Linqiang Zhou ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Zhou, L., Qian, J., & Guo, C. (2026). A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity. Structural Health Monitoring. https://doi.org/10.1177/14759217261501265", "why": "橋梁のアンカー定着部の接触面の応力を非破壊で評価するため、接触力学と非線形音響を統合した理論モデルを作り、反射の非線形係数を界面剛性から導いた。表面の粗さと材料定数から剛性と応力の関係を導くので経験的な当てはめが減り、現場の多数より線の定着部で予測と実測の接触応力の相対誤差は8.49%だった。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "橋の定着部の接触面にかかる応力を、壊さずに超音波で評価するための理論モデルを、接触力学と非線形音響を組み合わせて作り、室内試験と現場試験で確かめた（抄録）。", "p2": "接触面の剛性と圧力の関係には、べき乗則のモデルが使われてきた。簡潔だが、剛性と圧力の経験的な当てはめに頼り、表面の形状や材料の性質を明示的に含まない。そのため、較正した圧力の範囲の外への外挿に限界があった（抄録）。", "p3": "1次元の縦波の散乱理論に基づき、1次と2次の界面剛性を含む、反射の非線形係数の解析式を導く。べき乗則を物理に基づいて補うものとして、楕円体の突起が段階的に接触するモデルを導入し、粗い表面の形状と材料の定数から、剛性と応力の関係を導く（抄録）。背景：粗い面どうしは突起の先で接しており、押す力が増えると接する突起が増えて界面が硬くなる。", "p4": "単一のより線の定着具での室内の段階的な緊張と超音波の試験、複数のより線の定着具での現場の緊張と超音波の試験で検証する。指標は、決定係数と、接触応力の予測と測定の相対誤差である（抄録）。", "p5": "反射の非線形係数は接触応力とともに単調に増え、界面が締まって剛性が高まることを反映した。室内の単一より線の試験で、接触モデルに基づく音響のモデルは、反射の非線形係数について決定係数0.9460を与えた。現場の複数より線の試験では、接触応力の予測と測定の相対誤差は8.49%だった（抄録）。", "p6": "べき乗則は較正した範囲では便利だと著者も認める（抄録）。提案モデルに必要な表面の形状の測定方法、腐食や経年による表面の変化の扱い、試験の件数は、本文を読めておらず未確認。", "fun": "橋を支えるケーブルの端は、金具で強く締めつけて固定されている。その締めつけの強さを、分解せずに知りたい。この研究は超音波を当て、はね返ってくる音の「ひずみ方」を聞く。金属の面は拡大するとでこぼこで、強く押されるほど山と山がつぶれて密着し、音のはね返り方が変わる。その関係を、でこぼこの形から計算で導いた点が新しい。経験則に頼らないので、測ったことのない条件にも使いやすくなる。", "unverified": "本文は取得できず、解析式の形、試験の件数と荷重の範囲、べき乗則との精度の比較は未確認。"}}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "リスク・曖昧さへの態度と主観的信念を同時に測る", "title": "Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty", "url": "https://doi.org/10.1287/mnsc.2024.06232", "authors": "Adeline Delavande ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Delavande, A., Ganguli, J., & Mengel, F. (2026). Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty. Management Science. https://doi.org/10.1287/mnsc.2024.06232", "why": "一般の人々を対象に、健康と金融の意思決定について、リスクと曖昧さへの態度（個人別の確率加重と損失回避）と事象の主観確率を同時に集めた。選好も信念も大きくばらつき、源泉依存の確率加重を持つプロスペクト理論は主観的期待効用より一部の文脈で厳密に良く当てはまる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "一般の人々を対象とした調査実験で、リスクと曖昧さへの態度と、主観的な確率の信念を同じ個人から集め、健康と金融の意思決定を、主観的期待効用を超える構造モデルで分析した（抄録）。", "p2": "背景：不確実性のもとでの選択は、選好（リスクや曖昧さへの態度）と信念（起こる確率の見積もり）の両方で決まる。著者らは、個人ごとの選好のパラメータと主観的な信念を同時に得ることで、両者の異質性と相互の相関を詳しく調べられるとする（抄録）。", "p3": "調査実験で、リスクと曖昧さへの個人の態度（個人ごとの確率加重と損失回避を含む）と、対象とする意思決定に関わる出来事についての個人の確率的な信念を集める。これらを使い、主観的期待効用と、プロスペクト理論に情報源に依存する確率加重を組み合わせたモデルを推定して、当てはまりを比べる（抄録）。", "p4": "対象は一般の人々で、健康と金融の意思決定に焦点を当てる（抄録）。標本の大きさ、国、調査の時期は抄録に記載なし。", "p5": "選好も信念も個人差が大きかった。プロスペクト理論と情報源に依存する確率加重の組み合わせは、主観的期待効用に比べて、ある文脈では厳密によく当てはまり、他の文脈では同程度だった。プロスペクト理論は、信念の分布が極端な値に集中しているときに、とくによく当てはまった（抄録）。", "p6": "抄録には限界の記載がない。調査での回答が実際の選択を表すかどうか、パラメータの測定誤差、文脈の選び方の影響は、本文を読めておらず未確認。", "fun": "健康診断を受けるか、投資をするか。こうした決断は、「どれくらい起こりそうだと思っているか」と「不確かさをどれくらい嫌うか」の二つで決まる。同じ行動でも、理由は人によって違う。病気になる確率を低く見ている人もいれば、確率は分かっているのに不確かさが苦手な人もいる。この研究は、その二つを同じ人から別々に聞き出した。人の決め方は一つの理論では括れず、場面によって合う理論が変わる、という結果が面白い。", "unverified": "本文は取得できず、標本の大きさ、質問の形式、モデルの当てはまりの指標は未確認。"}}, {"id": "jn13", "rank": 13, "field": "心理学", "headline": "夏時間への切替え直後は詐欺メールを13%多く踏む", "title": "Modest loss of sleep increases susceptibility to cybersecurity threats", "url": "https://doi.org/10.1073/pnas.2622467123", "authors": "Eitan Schechtman", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-11", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Schechtman, E. (2026). Modest loss of sleep increases susceptibility to cybersecurity threats. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2622467123", "why": "夏時間への移行（睡眠が短くなる）の直後の月曜朝か1週間前に、大学の職員11,218人へ模擬のフィッシングメールを無作為に送った。移行後は不審なリンクをクリックする確率が約13%高く、メールを開く確率や迷惑メールとして報告する確率は変わらなかった。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "夏時間への切り替えに伴うわずかな睡眠不足が、フィッシング詐欺に引っかかる確率を上げるかを、大学の職員を対象とした無作為割り付けの実験で確かめた。切り替えの直後は、疑わしいリンクをクリックする確率が約13%高かった（抄録）。", "p2": "睡眠の制限は、さまざまな領域の認知処理を損なう。この研究は、ふつう睡眠の乱れを伴う夏時間への切り替えが、現実の場面で模擬のフィッシング攻撃に引っかかる確率を上げるかを問う（抄録）。", "p3": "模擬の詐欺メールを、夏時間への切り替え直後の月曜の朝か、その1週間前のどちらかに送る。送る時期は無作為に割り付け、盲検化した。完全に自然な状況での実験である（抄録）。", "p4": "対象はカリフォルニア大学アーバイン校の職員11,218人である。結果は、疑わしいリンクをクリックする確率、メールを開く確率、迷惑メールとして報告する確率である（抄録）。", "p5": "切り替えは、疑わしいリンクをクリックする確率を約13%高めた。メールを開く確率と、迷惑メールとして報告する確率には影響がなかった（抄録）。基準となるクリック率と信頼区間は抄録に記載なし。", "p6": "抄録には限界の記載がない。睡眠時間を個別に測ったかどうか、切り替えに伴う睡眠以外の変化と区別できるか、一つの大学の結果が他の組織に当てはまるか、効果が何日続くかは、本文を読めておらず未確認。", "fun": "夏時間が始まる日は時計を1時間進めるので、多くの人の睡眠が少し短くなる。その翌朝、怪しいメールのリンクを押してしまう人が増えた。面白いのは、メールを開く人の割合は変わらなかった点である。見る機会は同じなのに、「これは怪しい」と立ち止まる力だけが落ちた。徹夜のような極端な寝不足ではなく、誰にでもある小さな寝不足で起きたことである。一万人を超える職員を、くじ引きで二つの送信日に分けた設計も確かである。", "unverified": "本文は取得できず、基準となるクリック率、効果の信頼区間、割り付けの単位は未確認。"}}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "単一項目尺度で示せる性質と示せない性質", "title": "A Psychometric Evaluation of Single‐Item Measures", "url": "https://doi.org/10.1111/1748-8583.70071", "authors": "Justin A. DeSimone", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "DeSimone, J. A. (2026). A Psychometric Evaluation of Single‐Item Measures. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70071", "why": "人的資源管理の研究で増えている単一項目の尺度について、古典的テスト理論・項目反応理論・一般化可能性理論から、因子構造と内的一貫性は実証的に示せず、時間的な安定性・評定者間信頼性・基準関連妥当性は評価に適することを整理し、使用を判断するチェックリストを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "質問1項目だけの尺度が、どの心理測定的な性質を示すことができ、どれを示すことができないかを、古典的テスト理論、項目反応理論、一般化可能性理論に基づいて整理した（抄録）。", "p2": "人的資源管理の研究では、調査の長さ、回答者の負担、繰り返しの測定といった実務上の制約から、単一項目の尺度の利用が増えている。しかし、単一項目の尺度がどの性質を意味のある形で示せるかについての情報は、断片的で不完全だった（抄録）。", "p3": "論理、数学、これまでの心理測定の研究に基づいて、単一項目の尺度の因子構造、信頼性、妥当性を評価するときの仮定、実務上の考慮点、トレードオフを検討する（抄録）。解釈：新しいデータの分析ではなく、理論と方法の評価である。", "p4": "実証的な検証ではない。検討の対象は、因子構造、内的一貫性、時間的な一貫性、評定者間の信頼性、基準関連妥当性、構成概念妥当性、内容的妥当性である（抄録）。", "p5": "単一項目の尺度は、潜在的な因子構造と内的一貫性を実証的に示すことができない。よく使われる回避策は、検証できず支持しがたい仮定に頼っている。一方、時間的な一貫性や評定者間の信頼性、基準関連妥当性や構成概念妥当性の一部は、概念的にも数学的にも単一項目の評価に適している。内容の網羅と文言の明確さを含む内容的妥当性が、決定的に重要である。利用が正当かどうかを判断するためのチェックリストを示した（抄録）。", "p6": "抄録には限界の記載がない。チェックリストの項目、複数項目の尺度と比べた具体的な数値例、分野による当てはまりの違いは、本文を読めておらず未確認。", "fun": "「あなたは仕事に満足していますか」という一問だけで、満足度を測ってよいだろうか。質問が十問あれば、答えが互いにそろっているかを見て、物差しの安定を確かめられる。一問ではそれができない。この論文は、だから駄目だとは言わない。同じ人に日を置いて尋ねて答えが安定するか、実際の行動を予測できるかなら、一問でも確かめられると整理した。何を確かめられて、何を確かめられないかを分けることが、手抜きと工夫の境目になる。", "unverified": "本文は取得できず、チェックリストの内容、数式による説明、推奨される報告の仕方は未確認。"}}, {"id": "jn15", "rank": 15, "field": "工学", "headline": "橋の吊材ワイヤのフレッティング疲労の進み方", "title": "Fretting Wear and Fatigue Interaction Evolution of Bridge Suspender Wires under Various Contact Conditions and Cyclic Load Characteristics", "url": "https://doi.org/10.1061/jbenf2.beeng-8091", "authors": "Yafei Ma ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-11", "citescore": 7.2, "citescore_year": "2025", "apa": "Ma, Y., Fu, Z., Wang, G., Liu, H., & Wang, L. (2027). Fretting Wear and Fatigue Interaction Evolution of Bridge Suspender Wires under Various Contact Conditions and Cyclic Load Characteristics. Journal of Bridge Engineering, 32(1). https://doi.org/10.1061/jbenf2.beeng-8091", "why": "接触条件と繰返し応力を精密に制御できる新しい試験装置で、吊材ワイヤのフレッティング疲労を光学顕微鏡・走査電子顕微鏡・3次元レーザー走査で多段階に観察した。き裂は応力集中の大きい摩耗痕の縁から生じ、疲労寿命は接触角に対して単調でなく、接触角と応力比の交互作用に強く左右される。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "橋の吊り材の鋼線で、接触による微小なすり減り（フレッティング）と疲労がどう影響し合って破断に至るかを、接触条件と繰り返し応力を精密に制御できる新しい試験装置で調べた（抄録）。", "p2": "フレッティング疲労は、局所的な接触条件と繰り返し応力が組み合わさって起こる、橋のケーブルの重大な破壊の形である。この研究は、異なる供用条件のもとでの摩耗の進み方、き裂の進展、疲労寿命を調べる（抄録）。", "p3": "接触条件と繰り返し応力を精密に制御できる試験装置を新たに開発し、異なる供用条件で吊り材の鋼線を試験する。光学顕微鏡、走査型電子顕微鏡、3次元の走査レーザーで、複数の尺度の損傷の過程を観察する。接触角と応力比を変えるパラメータ分析を行う（抄録）。", "p4": "評価の対象は、摩耗痕の形の変化、き裂の発生位置と進展、疲労寿命である（抄録）。試験片の数、荷重の水準、接触角と応力比の範囲は抄録に記載なし。", "p5": "摩耗痕の形は、はっきりした幾何学的な段階を経て変化した。き裂は、応力集中が最も厳しい摩耗痕の縁で優先的に発生した。その後の疲労き裂の進展は、繰り返しのすべりの機構に支配された。疲労寿命は接触角に対して単調でない依存を示し、接触角と応力比の交互作用に大きく左右された（抄録）。寿命の数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。腐食環境の影響、実際の橋の鋼線の束の中での接触状態との対応、寿命を予測する式の有無は、本文を読めておらず未確認。", "fun": "吊り橋の吊り材は、細い鋼の線を何本も束ねてできている。車が通るたびに線どうしがわずかにこすれ、目に見えない傷がつく。そこから金属疲労のひびが育つ。この研究は、線が触れ合う角度を変えて試験した。面白いのは、角度が大きいほど悪い、といった単純な関係にならなかった点である。寿命は角度とともに一方向に変わるのではなく、途中で向きが変わり、力のかかり方によってその様子も変わった。こすれと疲れは、足し算では済まない。", "unverified": "本文は取得できず、試験条件の範囲、寿命の数値、摩耗痕の段階の定義は未確認。"}}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "プライバシー保護が推薦を歪め双方を害しうる", "title": "Recommender Systems Under Privacy Protection", "url": "https://doi.org/10.1287/mnsc.2024.05007", "authors": "Can Küçükgül ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Küçükgül, C., Özer, Ö., & Wang, S. (2026). Recommender Systems Under Privacy Protection. Management Science. https://doi.org/10.1287/mnsc.2024.05007", "why": "利益を追うプラットフォームの推薦の設計を、プライバシー保護の制度ごとに分析した。オプトアウト型の保護は無保護と機能的に同じで、消費者が個人データを偽れると推薦が歪んで双方が損をし、推薦が商品の割当ても担う場合は不利な少数者を機会から締め出す差別が生じうる。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "利益を追うプラットフォームが、プライバシー保護の制度の違いに応じて推薦の方針をどう設計するかを理論的に分析し、保護がかえって双方を害する場合があることを示した（抄録）。", "p3": "オプトアウト型の保護、消費者が個人データを偽れる保護などの制度のもとで、推薦が情報提供だけを担う場合と、商品へのアクセスの割当ても担う場合を比べた（抄録）。", "p5": "オプトアウト型の保護は無保護と機能的に同じになる。消費者がデータを偽れると推薦が歪み、双方が損をしうる。推薦が情報提供だけなら個別化そのものが行われなくなりうるが、割当ても担う場合は、不利な少数者が価値ある機会から締め出されるアルゴリズム上の差別が生じうる（抄録）。", "fun": "「自分の情報を隠したり、うそを書いたりできる権利」は、利用者を守るように見える。ところが、店の側は「この情報はうそかもしれない」と考えて推薦の出し方を変えるので、結局は利用者も店も損をすることがある。良かれと思って作った決まりが、相手の出方まで考えると裏目に出る。ゲーム理論らしい結論である。", "unverified": "本文未読のため、モデルの仮定の詳細と、結果が成り立つ条件の範囲は未確認。理論研究で実証データは使っていないと読める。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "環境に熱心な企業ほどCEOは説明会で語らない", "title": "CEO environmental communication, speech acts, and firm value", "url": "https://doi.org/10.1007/s11747-026-01221-w", "authors": "Hai-Anh Tran ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-11", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Tran, H.-A., Ludwig, S., Nguyen, B., Noble, C. H., & Grewal, D. (2026). CEO environmental communication, speech acts, and firm value. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01221-w", "why": "364社・14,523件の決算説明会の質疑を微調整したDeBERTaで分析し、環境への取り組みが強い企業ほどCEOがそれを語らないこと、語る場合は断定・指示の言い方が企業価値と正に、感情表明・約束の言い方が負に関連することを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "環境への取り組みが強い企業ほど、CEOが決算説明会でそれをあまり語らないこと、語り方しだいで企業価値との関連が正にも負にもなることを示した（抄録）。", "p3": "2007〜2022年の上場364社・14,523件の決算説明会の質疑応答について、環境評価の得点と財務データを組み合わせ、微調整したDeBERTaモデルで、CEOの環境に関する発言と、その発話の意図（言語行為の種類）を測った（抄録）。", "p5": "取り組みの強い企業のCEOは、多くではなく少なく語っていた。語る場合、断定と指示の言い方は企業価値との正の関連を保ち、感情の表明と約束の言い方は負に関連した（抄録）。効果の大きさは抄録に記載なし。", "fun": "環境に熱心な会社の社長ほど、その話をたくさんすると思いきや、実際は逆に口数が少なかった。さらに、話すときの言い方が大事だった。「こうしています」「こうします」と言い切る話し方は評価され、「心を痛めています」「約束します」という話し方は、かえって株式市場の評価と負に結びついていた。何を言うかより、どう言うかが効く。", "unverified": "本文未読のため、言語行為の分類の精度と、企業価値の指標の定義は未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "サービス生態系の設計で意見の対立をどう扱うか", "title": "Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations", "url": "https://doi.org/10.1177/10946705261492132", "authors": "Audun Formo Hay ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Hay, A. F., Vink, J., Thøgersen, D. M., Ness, O., von Heimburg, D., & Sangiorgi, D. (2026). Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations. Journal of Service Research. https://doi.org/10.1177/10946705261492132", "why": "相互依存する関係者がサービス生態系の仕組みを作り替えるとき、構造の受け止め方の違いから対立が起きる。省察を個人の能力でなく関係の性質として捉え、その育て方を調べた研究。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "立場の違う関係者が、サービスの仕組みを支える社会的な構造を一緒に見えるようにし、問い直し、作り替えられる状態にする「省察的な関係」の育て方を明らかにした（抄録）。", "p3": "省察を個人の能力でなく関係の性質として定義し、ノルウェーの児童福祉を対象にした2年間の協同的な探究で、その関係が生まれる過程を調べた（抄録）。", "p5": "省察的な関係は「つながった摩擦」という弁証法的な動きを通じて生まれ、画一化と断絶はそれを妨げる。この動きを支える状況の条件を4つ特定した（抄録）。条件の一部は抄録が切れており未確認。", "fun": "多くの人が関わる仕組みを変えようとすると、意見がぶつかる。ぶつかりを避けて皆が同じ考えになれば楽だが、それでは見落としが出る。逆に、ぶつかって関係が切れてしまえば何も進まない。この研究は、切れずにぶつかり続ける「つながった摩擦」こそが、仕組みを良い方向へ作り替える力になると論じている。", "unverified": "抄録の末尾が切れており、4つの条件の全体と実践への含意は未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "LLMの幻覚と関連する7つの変数を回帰で特定", "title": "Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective", "url": "https://doi.org/10.1162/coli.a.665", "authors": "Vicente Ivan Sanchez Carmona ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Carmona, V. I. S., Jiang, S., & Dong, B. (2026). Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective. Computational Linguistics, 1–12. https://doi.org/10.1162/coli.a.665", "why": "30のLLMと9つの幻覚データセットの質問を使い、15の変数と幻覚の関連を回帰分析で調べた。7つの変数が関連し、その効果はモデルや質問によって異なり、2変数の交互作用もあることを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "言語モデルの幻覚（事実と違う、または入力に忠実でない出力）がどんな変数と関連するかを、多数のモデルにまたがる回帰分析で調べた（抄録）。", "p3": "9つの幻覚のデータセットの質問を使い、30のLLMについて15の変数と幻覚の関連を調べた（抄録）。変数の内容は抄録に記載なし。", "p5": "7つの変数が幻覚と関連していた。一部の変数は、モデル全体に共通する系統的な効果だけでなく、モデルや入力の質問ごとに異なる効果を持ち、2変数の交互作用もあって、幻覚の生じ方はこれまで考えられていたより複雑だった（抄録）。", "fun": "AIがもっともらしいうそを言ってしまう「幻覚」は、何が原因で起きるのか。この研究は、たくさんのAIとたくさんの質問を集めて、統計の方法で関係を探した。分かったのは、「これが原因」と一つに言える単純な話ではない、ということだった。同じ要因でも、AIや質問によって効き方が違い、要因どうしが組み合わさって働いていた。", "unverified": "本文未読のため、15の変数と関連のあった7つの変数の具体的な内容は未確認。"}}, {"id": "jn20", "rank": 20, "field": "機械学習", "headline": "5トンの建機が2輪で立つ曲芸を強化学習で", "title": "Heavy metal acrobatics: Learning dynamic control for skid-steer loaders", "url": "https://doi.org/10.1126/scirobotics.aef0894", "authors": "Pierre-Jean Lorentz ほか", "venue": "Science Robotics", "date": "2026-11-11", "sjr": 5.883, "citescore": 32.1, "citescore_year": "2025", "apa": "Lorentz, P.-J., Egli, P., Jelavic, E., Li, C., Sundar, R., Suresh, H., Montgomery, P., Redden, L., Müller, M., Sener, O., Koltun, V., & Hutter, M. (2026). Heavy metal acrobatics: Learning dynamic control for skid-steer loaders. Science Robotics, 11(120). https://doi.org/10.1126/scirobotics.aef0894", "why": "油圧駆動で動特性が複雑な5トンのスキッドステアローダーについて、シミュレーションでの強化学習と実機への転移で、2輪に立ち上がって不整地を走り、軌道を描き、旋回して安全に着地する曲芸的な操作を自律で実現した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "油圧で動く5トンの建設機械に、片側の2輪だけで立って走るような曲芸的な操作を、強化学習で自律的に行わせることに成功した（抄録）。", "p3": "実機での試行は危険なため、シミュレーションの中で強化学習の方策を訓練し、それを実際のスキッドステアローダー（John Deere 332G）に移した（抄録）。", "p5": "方策は、機械を2輪の上に振り上げ、その姿勢を保ったまま不整地を走り、指定された軌道を描き、旋回し、バケットを前後に振ってから、安全に4輪へ戻すことを自律で行った。こうした操作は、これまでごく少数の熟練の操縦者だけが成し遂げていた（抄録）。", "fun": "重さ5トンのショベルカーのような機械が、片輪走行をする。油圧は液体で力を伝えるので、反応が遅れたり、ぐにゃりとしたりして、数式どおりには動かない。しかも失敗すれば大事故になる。この研究は、コンピュータの中で何度も転ばせて学ばせ、その技を本物に移した。危ない練習を仮想の世界で済ませる方法の、迫力ある実例である。", "unverified": "抄録の末尾が切れており、成功率などの数値と、シミュレーションと実機の差を埋めた方法の詳細は未確認。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "電解液を自動で探索する自律実験室", "title": "A Self-Driving Laboratory for Accelerated Electrolyte Discovery", "url": "https://doi.org/10.1021/acsenergylett.6c01693", "authors": "Kai-Jui Pan ほか", "venue": "ACS Energy Letters", "date": "2026-11-10", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "apa": "Pan, K.-J., Lin, D.-Z., Rajesh, A., Yau, A., Li, T., Jayarapu, K. N., McDaniel, G., Powell, N., Tran, J. V., Langevin, S. A., McHale, C. A., Ko, J. S., & Liu, Y. (2026). A Self-Driving Laboratory for Accelerated Electrolyte Discovery. ACS Energy Letters. https://doi.org/10.1021/acsenergylett.6c01693", "why": "分注ロボット、オンラインの電気化学測定、ベイズ最適化を統合し、96ウェルの形式で電解液の調合・測定・代替モデルの更新を自動で繰り返す実験室を報告した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "電解液の配合の探索を、分注ロボット・測定・最適化をつないだ自律実験室で自動化し、低温用の亜鉛金属電池の電解液を見つけた（抄録）。", "p3": "96ウェルの形式で、候補の電解液の調合、温度を制御した電気化学測定、代替モデルの更新を自動で繰り返し、ベイズ最適化で高次元の配合の空間を探索する。高エントロピーの水系電解液の開発に適用した（抄録）。", "p5": "数百の配合を調べ、多目的最適化で、導電率134.1 mS/cm、電気化学的な安定窓2.50 Vの電解液を得た。対称セルでは−20 °Cで約2019時間のサイクル安定性を示した（抄録）。", "fun": "電池の中の液体は、何種類もの成分をどんな割合で混ぜるかで性能が決まる。組合せは膨大で、人が一つずつ試していては終わらない。この研究では、ロボットが混ぜて、測って、その結果から「次はこの配合を試そう」と自分で決める。実験する手と考える頭をつないで、休まず回り続ける実験室を作ったのである。", "unverified": "本文未読のため、探索した成分の種類、人手による探索との比較、得られた電解液の組成は未確認。"}}, {"id": "jn22", "rank": 22, "field": "工学", "headline": "8つの安定形を持つ構造を4Dプリントで設計", "title": "Programmable multistable structures via bioinspired, mechanically guided 4D printing", "url": "https://doi.org/10.1073/pnas.2614289123", "authors": "Yan Zhao ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-10", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Zhao, Y., Zhu, H., He, Y., Zhang, Y., Ye, X., Lv, R., Tian, Y., Wang, Z., Xiang, J., Zhao, S., Zhou, K., & Jiang, C. (2026). Programmable multistable structures via bioinspired, mechanically guided 4D printing. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2614289123", "why": "植物の葉や果実の成長による変形にならい、力学的に誘導する4Dプリントで8安定・双安定の単位構造を設計・製作した。無次元の形状パラメータで安定性を調整でき、単位を連ねた10cm規模の帯で10億超の安定状態を持つ構成空間を示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "植物の葉や果実が成長しながら形を変える仕組みにならい、力学的に誘導する4Dプリントで、多数の安定な形を持つ構造を設計・製作する方法を示した（抄録）。", "p3": "8つの安定状態を持つ単位構造と、さまざまな双安定の単位を作り、無次元の形状パラメータを変えることで安定性の地形を調整し、座屈解析で確かめた（抄録）。", "p5": "8安定の単位を複数つなぐと、10cm規模の帯で十億を超える数の安定状態を持つ構成空間が得られた。形状パラメータを変えると曲げから折りへの転移が現れ、双安定のヒンジを作れる。液滴の誘導、電気の切替え、不規則な物体の把持などの装置で実演した（抄録）。", "fun": "髪留めのパッチン留めは、反った形と逆に反った形の二つで安定する。このような「手を離してもその形のまま」の状態を、一つの部品にたくさん持たせられれば、電気を使わずに形を覚えておける。この研究は、葉が育つときの縮み方の違いをまねて印刷することで、小さな帯に途方もない数の安定な形を作り込んだ。", "unverified": "抄録の末尾が切れており、材料と印刷の方法の詳細、実演の定量的な結果は未確認。"}}, {"id": "jn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "新興産業の熱狂の波の中での人材マネジメント", "title": "How Can Talent Managers Create Organizational Value Throughout the Hype Cycles of Emerging and Innovative Industries?", "url": "https://doi.org/10.1111/1748-8583.70076", "authors": "Francine Schlosser ほか", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "Schlosser, F., de Azevedo, M. C., & McPhee, D. (2026). How Can Talent Managers Create Organizational Value Throughout the Hype Cycles of Emerging and Innovative Industries? Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70076", "why": "カナダの嗜好用大麻産業と太陽光産業の経営幹部14人への面接などから、期待・正統性・規制・資金が揺れ動く「ハイプ・サイクル」の局面ごとに、人材マネジメントの課題と対応がどう変わるかを調べた。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "期待が急に膨らんではしぼむ新興産業で、人材マネジメントの重点が、産業の熱狂の波（ハイプ・サイクル）の局面ごとにどう移るかを理論化した（抄録）。", "p3": "カナダの嗜好用大麻産業と太陽光産業の経験豊かな経営幹部14人への面接と、報道・業界研究を使い、既存の人材価値の枠組みを、変化する産業の文脈へ拡張した（抄録）。", "p5": "人材の価値を生む過程の重みは、技術の引き金、膨らんだ期待、幻滅、安定化へと産業が進むにつれて時間的に付け替えられる。新興産業の人材の構成は、決まった最良の慣行の束ではなく、外部の期待・正統性・規制・資源に応じて組み直すべき配置だとした（抄録）。", "fun": "新しい産業は、最初は「これからはこれだ」と期待が集まり、人もお金も流れ込む。しばらくすると期待がしぼみ、冷たい目で見られる。この波の中で、会社はいつ人を集め、いつ守り、いつ育てるべきか。この研究は、良い人事のやり方は一つではなく、世間の熱の上がり下がりに合わせて変えるものだと論じている。", "unverified": "抄録の末尾が切れており、局面ごとの具体的な対応の内容は未確認。面接は14人と少数である。"}}, {"id": "jn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "女性経営者の企業は女性を多く雇い支援も手厚い", "title": "Female Managers, Women's Employment, and Gendered Laws", "url": "https://doi.org/10.1111/gwao.70276", "authors": "Hiep Manh Nguyen ほか", "venue": "Gender, Work and Organization", "date": "2026-11-10", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Nguyen, H. M., & Nguyen, H. T. (2026). Female Managers, Women’s Employment, and Gendered Laws. Gender, Work & Organization. https://doi.org/10.1111/gwao.70276", "why": "世界銀行の企業調査の多国データで、女性が経営トップの企業は女性の雇用が多く、訓練・保育支援・出産給付を提供しやすいこと、その効果は法的な男女平等が弱い国で強いことを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "経営トップが女性の企業は女性を多く雇い、女性向けの支援も手厚いことを、多くの国の企業データで示した（抄録）。", "p3": "世界銀行の企業調査の大規模な多国データを使い、経営トップの性別と、女性の雇用、訓練・保育支援・出産給付の提供、企業の生産性との関連を、国の法制度や産業による違いとあわせて分析した（抄録）。", "p5": "女性トップの効果は、法的な男女平等が弱く、女性の事業への制度的な支えが限られる国で強く、男性が多い産業では弱い。女性従業員の割合は、女性トップと生産性の負の関連を媒介するが、女性従業員の割合が同程度の男性トップの企業と比べても、成績は下回っていた（抄録）。", "fun": "社長が女性だと、その会社で働く女性が増え、子育ての支援も整いやすい。しかも、法律が女性を十分に守っていない国ほど、その効果が大きかった。法律が弱いところでは、トップの人柄や考えが、制度の代わりを果たしているのかもしれない。一方で、女性トップの会社の成績が低く出る理由は、まだ説明しきれていない。", "unverified": "本文未読のため、国と企業の数、効果の大きさ、因果関係の識別の程度は未確認。"}}, {"id": "jn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "文化戦争から利益を得る資源動員", "title": "Benefiting from Culture Wars: Resource Mobilization in Polarized Issue Domains", "url": "https://doi.org/10.5465/amj.2024.0699", "authors": "Ludovica Castiglia ほか", "venue": "Academy of Management Journal", "date": "2026-11-10", "sjr": 10.781, "citescore": 19.8, "citescore_year": "2025", "apa": "Castiglia, L., & Ferraro, F. (2026). Benefiting from Culture Wars: Resource Mobilization in Polarized Issue Domains. Academy of Management Journal. https://doi.org/10.5465/amj.2024.0699", "why": "題名から、意見が分極した争点の領域で組織がどのように資源を動員するかを扱う研究（Academy of Management Journal、SJR 10.781）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、意見が鋭く分かれる争点の領域（いわゆる文化戦争）で、組織がその対立からどのように利益を得て資源を集めるかを扱う研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、世の中の意見が真っ二つに割れているとき、その対立は組織にとって損なのか、それとも資金や支持を集める機会になるのか、というものである。対立を避けるのが得策だという常識に対して、対立から「利益を得る」という見方を題名が示している点が目を引く。結果は未確認。", "unverified": "抄録・本文を入手できず、対象の組織、データ、結論はすべて未確認。"}}, {"id": "jn26", "rank": 26, "field": "人口学", "headline": "一人っ子政策の効果は官僚の誘因に左右された", "title": "Bureaucratic incentives shaped effectiveness of the one-child policy in China", "url": "https://doi.org/10.1038/s41586-026-11232-w", "authors": "Lingsheng Meng ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Meng, L., Yang, H., Miller, G., & Li, H. (2026). Bureaucratic incentives shaped effectiveness of the one-child policy in China. Nature. https://doi.org/10.1038/s41586-026-11232-w", "why": "題名から、中国の一人っ子政策の効果が官僚の誘因によって形づくられたことを示す研究（Nature、SJR 19.713）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "選定の後に抄録を取得できた。OpenAlexの題名検索で得た同名の記録の抄録を使用。Nature掲載版の本文は未取得", "preprint": false, "short": true, "p1": "中国の一人っ子政策が出生率を下げたのは、政策の導入そのものより、守れなかった役人の昇進を禁じる「一票否決」の制度で官僚の誘因が強められてからだったことを示した（抄録）。", "p3": "合計特殊出生率は1979〜1980年の政策実施後にはあまり下がらず、1990年代初めに3分の1以上急落した。省ごとに「一票否決」の実施時期が違うことを使って、その効果を推定した（抄録）。", "p5": "「一票否決」は1990年代の中国の合計特殊出生率の低下のほぼ半分を説明し、出生率を人口置換水準より下に押し下げた。地方の役人が「推奨」した子宮内避妊具の使用の増加がとくに目立った（抄録）。", "fun": "決まりを作っても、それを現場で実行する人が本気にならなければ効果は出ない。中国の一人っ子政策は、導入からしばらくは出生率をあまり下げなかった。大きく下がったのは、「目標を守れなかった役人は昇進させない」という仕組みが加わってからだった。政策の中身より、実行する人の損得の設計が結果を決めた、という発見である。", "unverified": "使用した抄録は掲載版そのものではなく、同名の関連記録のもので、掲載版との差は未確認。推定の方法の詳細も未確認。"}}, {"id": "jn27", "rank": 27, "field": "計算社会科学・ネットワーク科学", "headline": "2,000万件の論文と特許で探索と産業化を比較", "title": "Scientific exploration outlasts industrial momentum and sustains innovation in genetic research: survey of 20 million papers and patents", "url": "https://doi.org/10.1140/epjds/s13688-026-00715-5", "authors": "Junghun Chae ほか", "venue": "EPJ Data Science", "date": "2026-11-11", "citescore": 5.3, "citescore_year": "2025", "apa": "Chae, J., Kim, W., Jung, W., Jeong, D., Lim, R., Chamlagain, M., Jung, G., Jang, J., Lee, J. W., Kang, N. K., Baek, K., Shin, J., Lee, Y.-G., Koh, H. G., Kim, C., Yook, S., Cheung, A. K. L., Jin, Y.-S., Youn, H., et al. (2026). Scientific exploration outlasts industrial momentum and sustains innovation in genetic research: survey of 20 million papers and patents. EPJ Data Science. https://doi.org/10.1140/epjds/s13688-026-00715-5", "why": "題名から、遺伝学研究の論文と特許2,000万件を調べ、科学的な探索が産業の勢いより長く続いてイノベーションを支えることを示す研究（EPJ Data Science）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "選定の後に抄録を取得できた。Semantic Scholarに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "遺伝学の研究で、産業界の研究開発が下火になったあとも、科学的な探索が新しい遺伝子の組合せを試し続け、イノベーションの機会を支えていることを示した（抄録）。", "p3": "約2,000万件の論文と、米国・中国・欧州の特許を分析し、遺伝子ごとに科学研究と産業の活動の経過を比べた（抄録）。", "p5": "新しい遺伝子そのものの研究は2000年代初めから減ったが、新しい遺伝子の組合せの探索は活発なままだった。実用・商業志向の強い分野は新しい組合せを試しにくく、産業の研究開発は各遺伝子への科学的な関心より早く減る傾向があった（抄録）。", "fun": "新しい発明は、まったく新しい部品の発見だけでなく、すでにある部品の新しい組合せからも生まれる。企業は、もうかる見込みが薄れるとその研究から早く手を引く。しかし大学などの研究は、その後も「この二つ ": false, "short": true, "p1": "全体としては存続が得なのに個々の債権者は早く回収したい、という状況で、支払不能の債務者がどれだけ長く破綻を避けられるかを実験で調べ、債権の流通市場の影響を確かめた（抄録）。", "p3": "標準的な理論は、借換えが行われず直ちに破綻すると予測する。実験でこの状況を作り、債権を売買できる流通市場がある場合とない場合で、清算までの期間と利得を比べた（抄録）。", "p5": "清算は理論の予測より遅れた。流通市場があっても信用の集まりが続く期間は変わらなかったが、償還までに債権が長く保有されるため平均の純利得は増え、実現した利得のばらつきは有意に大きくなった。価格は清算の時期を予測しなかった（抄録）。", "fun": "銀行の取り付け騒ぎのように、「みんなが待てば全員助かるのに、自分だけ先に引き出したほうが得」という状況がある。理屈では、全員がすぐ引き出して一瞬で崩れるはずだ。ところが実験すると、人はしばらく待つ。この研究は、そこに「債権を他人に売れる市場」を足すとどうなるかを調べた。崩れる時期は変わらず、利得の分かれ方が変わった。", "unverified": "本文未読のため、実験の参加者数、設定の詳細、効果の大きさは未確認。"}}, {"id": "jn30", "rank": 30, "field": "経済学", "headline": "優先入学枠の誘因効果を実験と構造モデルで", "title": "Beliefs and the Incentive Effects of Preferential College Admissions: Evidence from an Experiment and a Structural Model", "url": "https://doi.org/10.1086/744916", "authors": "Michela Maria Tincani ほか", "venue": "Journal of Political Economy", "date": "2026-11-11", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "apa": "Tincani, M. M., Kosse, F., & Miglino, E. (2026). Beliefs and the Incentive Effects of Preferential College Admissions: Evidence from an Experiment and a Structural Model. Journal of Political Economy. https://doi.org/10.1086/744916", "why": "題名から、大学の優先的な入学制度が生徒の信念を通じて努力の誘因に与える効果を、実験と構造モデルで調べる研究（Journal of Political Economy、SJR 16.25）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、大学の優先的な入学制度（特定の集団に枠や加点を与える制度）が、生徒の信念を通じて努力の誘因に与える効果を、実験と構造モデルで調べる研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、入試で優先枠を設けると、対象の生徒は「がんばれば届く」と思って勉強を増やすのか、それとも「枠があるから大丈夫」と思って減らすのか、というものである。答えは、生徒が自分の合格の見込みをどう信じているかに左右される、という見方が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、実験の対象と国、モデルの内容、結論はすべて未確認。"}}, {"id": "jn31", "rank": 31, "field": "経済学", "headline": "途上国の現金給付の地域乗数と集計効果", "title": "Cash transfers in developing countries: Local multipliers, aggregate effects, and external adjustment", "url": "https://doi.org/10.1 ィ構造の胴体と、爪による連結機構を組み合わせ、単独でも動け、複数が自分でつながって形を変えられるモジュール型ロボットを作った（抄録）。", "p3": "硬いモジュールをつなぎ替える従来の再構成ロボットには柔軟さがなく、柔らかい連続体ロボットは自分でつながり直せない。両者の利点を一つにまとめ、鎖・輪・枝分かれなどの形に再構成できるようにした（抄録）。", "p5": "各ロボットは単独で物を操作し移動でき、複数では協調して物を操作・運搬し、複数の移動様式と、移動しながらの操作を実環境の場面で実演した（抄録）。数値は抄録に記載なし。", "fun": "棒と糸だけでできた、押すとたわんで元に戻る「テンセグリティ」という構造がある。この研究は、それを体にしたロボットに爪を付け、仲間どうしでつかまり合えるようにした。一台でも動けるが、何台かつながると鎖にも輪にもなって、大きな物を一緒に運ぶ。仕事に合わせて体の形のほうを変える、という発想が面白い。", "unverified": "抄録の末尾が切れており、ロボットの寸法、制御の方法、性能の数値は未確認。"}}, {"id": "jn39", "rank": 39, "field": "工学", "headline": "トポロジカル材料を深層学習と強化学習で逆設計", "title": "Inverse design framework for topological metamaterials integrating deep learning and reinforcement learning", "url": "https://doi.org/10.1016/j.engstruct.2026.124080", "authors": "Chengcheng Chu ほか", "venue": "Engineering Structures", "date": "2026-11-07", "citescore": 12.0, "citescore_year": "2025", "apa": "Chu, C., Guo, Z., Zou, R., Liu, H., & Hu, G. (2027). Inverse design framework for topological metamaterials integrating deep learning and reinforcement learning. Engineering Structures, 371, 124080. https://doi.org/10.1016/j.engstruct.2026.124080", "why": "題名から、深層学習と強化学習を統合してトポロジカル・メタマテリアルを逆設計する枠組みの研究（Engineering Structures）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、波の伝わり方に位相幾何学的な性質を持たせた人工材料（トポロジカル・メタマテリアル）を、深層学習と強化学習を統合した枠組みで、望む性質から逆に設計する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「この振動だけを通し、欠陥があっても伝わり方が乱れない」といった望みの性質を先に決めて、それを実現する形を計算機に探させられるか、というものである。形から性質を求めるのは計算できるが、性質から形を求める逆向きの問題は答えが無数にあって難しい、という点が背景にあると読める。結果は未確認。", "unverified": "抄録・本文を入手できず、設計の対象、学習の方法、検証の結果はすべて未確認。"}}, {"id": "jn40", "rank": 40, "field": "工学", "headline": "変分エネルギー損失のPINNで積層シェルを解析", "title": "A new physics-informed neural network approach using variational energy losses for bending, vibration, and damping analysis of laminated composite cylindrical shells", "url": "https://doi.org/10.1016/j.engstruct.
