741", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "地盤の監視に使うMEMS傾斜計の記録から、温度の変化による見かけの傾き（ドリフト）を取り除く、頑健な方法を示した。", "p3": "重みつき最小二乗法に基づく枠組みで、温度の変化と傾きの応答の間の時間遅れを動的に求め、それに応じて適応的な多重スケールの時間窓を決める。長い窓は最適化した2次の分割で自動的に細分し、非定常な温度の影響を表す（抄録）。", "p5": "独立に設置した3台の傾斜計の現場データで、従来の方法に比べて温度に関連する成分の除去が大きく改善した。ただし低周波やゆっくり変化する動きなど、全ての変形成分が保たれる保証はない（抄録）。", "fun": "地盤のわずかな傾きを測る小さなセンサーは、温度が上がり下がりするだけで、変形の信号を覆い隠すような値の変化を出してしまう。しかも温度の変化が値に表れるまでには時間の遅れがある。この研究は、その遅れを動的に見積もりながら温度の影響を差し引いた。本物の動きと温度の影響を見分ける工夫が面白い。", "unverified": "改善の大きさを示す数値は抄録になく未確認。"}}, {"id": "jr31", "rank": 31, "headline": "ESG不祥事後の銀行は象徴的な開示を増やす", "title": "Symbolic Disclosure or Substantive Governance? European Banks' Responses to ESG Controversies", "url": "https://doi.org/10.1002/csr.71185", "authors": "Nicola Del Sarto", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-23", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Del Sarto, N. (2026). Symbolic Disclosure or Substantive Governance? European Banks’ Responses to ESG Controversies. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71185", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ESGに関する不祥事が起きた銀行が、開示の文章を増やすだけの象徴的な対応をとるのか、実質的な統治の仕組みを整えるのかを、2つの指数で測り分けた。", "p3": "欧州の上場銀行の2019〜2023年のパネルで、報告の量・語りの方向・一般的なサステナビリティの言葉を自動のテキスト分析で測る象徴的対応の指数と、測定可能な目標・取締役会の監督・外部保証を手作業で集めた実質的統治の指数を作り、銀行と年の固定効果モデルで推定した（抄録）。", "p5": "不祥事は象徴的な開示の増加と関連し、いくつかの定式化では統治面の対応とも関連した。制度の質が高い環境は統治面の対応との関連を強めたが、開示による対応は抑えなかった。過去に不祥事があった銀行は、新しい不祥事のあと象徴的な開示への依存が強まった（抄録）。", "fun": "不祥事を起こした会社は、報告書の語りを増やすことがある。でも言葉が増えることと、中身が変わることは別だ。この研究は銀行について「どれだけ語ったか」と「実際に何を整えたか」を別々の指数にして比べ、不祥事のあとには象徴的な開示が増えることを示した。開示の量だけを説明責任の目安にしてはいけないという教訓になる。", "unverified": "係数の大きさと対象の銀行の数は抄録になく未確認。"}}, {"id": "jr32", "rank": 32, "headline": "表面遮水ダムの浸透破壊を3次元FEMで検証", "title": "Seepage Failure Mechanism of the Shaidham Concrete-Face Random-Fill Dam During Reservoir Water Infiltration", "url": "https://doi.org/10.3390/infrastructures11120436", "authors": "Dima A. Husein Malkawi ほか", "venue": "Infrastructures", "date": "2026-11-23", "sjr": 0.671, "citescore": 5.7, "citescore_year": "2025", "apa": "Malkawi, D. A. H., & Husein Malkawi, A. I. (2026). Seepage Failure Mechanism of the Shaidham Concrete-Face Random-Fill Dam During Reservoir Water Infiltration. Infrastructures, 11(12), 436. https://doi.org/10.3390/infrastructures11120436", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ヨルダンのコンクリート表面遮水型のダムで起きた損傷について、浸透した水がどこを流れ、どんな力を生んだ可能性があるかを3次元の計算で検討した。", "p3": "2012年に供用を始め、2020年の高い貯水位のあとに遮水壁の大きな損傷が報告されたShaidhamダムを対象に、現地の写真と観察を整理し、3つの理想化した定常浸透のシナリオを3次元の有限要素法で解析して、間隙水圧、偏差応力、堤体の変形、下流のコンクリート被覆の揚圧を求めた（抄録）。", "p5": "証拠は、損傷が主に左右の地山に沿った集中的な浸透と堤体内の高い動水勾配に関連することを示し、地質の把握や設計・維持管理の不備、8年間の運用での監視と安全点検の欠如を反映している。計算は破壊の始まりの順序を一意に定めるものではない（抄録）。", "fun": "ダムは水をせき止めるが、水は堤の中や脇の地山にしみ込む。しみ込む流れの勢いが強い場所は、損傷の原因になりうる。この研究は、損傷したダムについて、水がどの道を通ったかの筋書きを3通り考えて計算で確かめた。8年間、監視も安全点検もなかったという指摘は、維持管理の大切さを物語る。", "unverified": "計算は定常状態の理想化で、時間を追った破壊の再現ではないと著者が断っている。フィルターの水理的な効果は計算に入っていない。"}}, {"id": "jr33", "rank": 33, "headline": "ブランド不祥事への反応は集団で増幅・再解釈される", "title": "David versus Goliath: understanding how consumers navigate their relationship with a brand involved in online moral-panic dynamics", "url": "https://doi.org/10.1108/jpbm-05-2025-6017", "authors": "Alice Venturini", "venue": "Journal of Product and Brand Management", "date": "2026-11-23", "sjr": 2.139, "citescore": 13.9, "citescore_year": "2025", "apa": "Venturini, A. (2026). David versus Goliath: understanding how consumers navigate their relationship with a brand involved in online moral-panic dynamics. Journal of Product & Brand Management, 1–20. https://doi.org/10.1108/jpbm-05-2025-6017", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ブランドの不祥事がSNSで道徳的な騒動に発展するとき、消費者が個人としても集団としてもブランドとの関係をどう作り直すかを示した。", "p3": "2022年のバレンシアガをめぐる論争について、Redditの議論を9か月のネトノグラフィーで分析した。関連する16のサブレディットの中の最も活発な20のスレッドから、2022年から2024年にかけて投稿された約800件の会話を集めた（抄録）。", "p5": "個人の水準では関係の不安定化、切り離し、断絶が、集団の水準では断絶の増幅、断絶の正当性の否定、再解釈という交渉の実践が見られた。消費者とブランドの関係は、個人的に経験されると同時に社会的に作られる（抄録）。", "fun": "好きだったブランドが問題を起こしたとき、人は1人で「もう買わない」と決めるだけではない。ネットの掲示板では、断絶を大きくする人、それは正当でないと言う人、別の見方を示す人がやり取りし、ブランドとの付き合い方がみんなの手で作り直されていく。この研究は約800件の書き込みを読み込み、その共同作業の型を取り出した。", "unverified": "質的な研究で、どの実践がどれくらい多かったかの数は抄録になく未確認。"}}, {"id": "jr34", "rank": 34, "headline": "航空チャットボットは満足を介しロイヤルティと関連", "title": "AI-Driven Chatbots, Customer Loyalty and Sustainable Airline Management: Evidence from South Korean Passengers", "url": "https://doi.org/10.3390/su182311851", "authors": "Jungyoon Jang ほか", "venue": "Sustainability", "date": "2026-11-23", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "apa": "Jang, J., & Park, J.-W. (2026). AI-Driven Chatbots, Customer Loyalty and Sustainable Airline Management: Evidence from South Korean Passengers. Sustainability, 18(23), 11851. https://doi.org/10.3390/su182311851", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "航空会社のAIチャットボットが、効率化だけでなく、満足を通じて顧客のロイヤルティと結びついていることを示した。", "p3": "チャットボットに込められたマーケティングの努力を、対話、個別対応、問題解決、楽しさからなる2次の構成概念として捉え、韓国の利用者303人の調査を確認的因子分析と構造方程式モデルで分析した。代替モデルの比較と、内生性のガウスコピュラ検定も行った（抄録）。", "p5": "マーケティングの努力は、有用性の知覚、満足、ロイヤルティと強く関連した。満足はどの定式化でもロイヤルティへの最も頑健な経路だったが、有用性の寄与はマーケティングの努力と切り分けられなかった。結果は関連であり因果ではない（抄録）。", "fun": "航空会社のチャットボットは、問い合わせを効率よくさばくための道具だと思われがちだ。この調査は、チャットボットとのやり取りに満足した人ほど、その航空会社へのロイヤルティが高いことを示した。つまりチャットボットは費用を減らす道具であるだけでなく、お客との関係を作る窓口でもある。ただし著者は、原因と結果までは言えないと断っている。", "unverified": "係数の大きさは抄録になく未確認。"}}, {"id": "jr35", "rank": 35, "headline": "ライブ配信購買の幸福感は知覚価値から生まれる", "title": "Consumers’ well-being in livestreaming commerce: antecedents and consequences", "url": "https://doi.org/10.3389/fpsyg.2026.1940417", "authors": "Chunyan Zhang ほか", "venue": "Frontiers in Psychology", "date": "2026-11-23", "sjr": 0.941, "citescore": 7.0, "citescore_year": "2025", "apa": "Zhang, C., Liu, Q., Zha, T., & Yang, N. (2026). Consumers’ well-being in livestreaming commerce: antecedents and consequences. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1940417", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ライブ配信での買い物で、消費者の「買い物の幸福感」が何から生まれ、また使い続けたい気持ちにどうつながるかを示した。", "p3": "情報的・感情的な支援、配信者の特性（専門性、信頼性、魅力）、配信環境の特性（双方向性、混雑感、社会的存在感）と、知覚価値、買い物の幸福感、継続意図の関係を、中国の利用者301人の調査で、PLS-SEM、必要条件分析、重要度と成果の地図の分析を組み合わせて調べた（抄録）。", "p5": "知覚価値と買い物の幸福感は継続意図と正に関連し、知覚価値は幸福感と正に関連した。専門性、双方向性、混雑感、社会的存在感は知覚価値と有意な正の関連を示したが、情報的・感情的な支援、信頼性、魅力の直接の関連は有意でなかった（抄録）。", "fun": "配信者が商品を紹介し、見ている人がその場で買うライブ配信の買い物が広がっている。この研究は、買う人がその買い物で得る幸福感に注目した。意外なのは、配信者の魅力や信頼性よりも、専門性や、混んでいる感じ、人がそこにいる感じのほうが価値の感じ方と結びついていた点だ。", "unverified": "係数の大きさは抄録になく未確認。調査データの分析で因果は分からない。"}}, {"id": "jr36", "rank": 36, "headline": "認知症ケアの担い手の未充足ニーズは人種で差がある", "title": "Unraveling Dementia Care: Unmet Care Needs Among Spousal and Non-Spousal Care Partners by Race and Gender", "url": "https://doi.org/10.1177/08982643261504926", "authors": "Gretchen G. Tucker ほか", "venue": "Journal of Aging and Health", "date": "2026-11-23", "sjr": 1.146, "citescore": 5.4, "citescore_year": "2025", "apa": "Tucker, G. G., Gruber-Baldini, A. L., Samus, Q. M., Girling, L. M., Wallace, B. H., & Orwig, D. L. (2026). Unraveling Dementia Care: Unmet Care Needs Among Spousal and Non-Spousal Care Partners by Race and Gender. Journal of Aging and Health. https://doi.org/10.1177/08982643261504926", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "認知症の人を世話する家族などのケアの担い手で、満たされていないニーズが、配偶者かどうか、人種、性別によってどう違うかを示した。", "p3": "地域での2つの研究から得た多様な595人のケアの担い手の横断的な二次分析で、ジョンズ・ホプキンス認知症ケアニーズ評価2.0により18項目のニーズを評価し、担い手の特性と未充足のニーズの種類・割合の関係を回帰モデルで調べた（抄録）。", "p5": "配偶者かどうかと性別は、未充足のニーズの割合の有意な相関要因ではなかった。人種は有意に関連し、黒人の担い手は白人の担い手より未充足のニーズの割合が高かった（抄録）。", "fun": "認知症の家族を世話する人は、病気についての知識や使える資源など、いろいろな助けを必要としている。夫や妻が世話する場合と、それ以外の人が世話する場合で困りごとの多さは違いそうに思えるが、この研究では差は見つからなかった。差があったのは人種で、支援の届き方に偏りがあることを示している。", "unverified": "差の大きさを示す数値は抄録になく未確認。横断的な分析で因果は分からない。"}}, {"id": "jr37", "rank": 37, "headline": "農村の地域支援の介入は幸福と関連、証拠は限定的", "title": "Community-based social support interventions for mental wellbeing and quality of life among vulnerable adults in rural settings: a scoping review.", "url": "https://doi.org/10.1007/s11136-026-04448-w", "authors": "Shuha FJ ほか", "venue": "Quality of life research : an international journal of quality of life aspects of treatment, care and rehabilitation", "date": "2026-11-22", "sjr": 1.154, "citescore": 5.9, "citescore_year": "2025", "apa": "Shuha, F. J., & Eklund Karlsson, L. (2026). Community-based social support interventions for mental wellbeing and quality of life among vulnerable adults in rural settings: a scoping review. Quality of Life Research, 35(12). https://doi.org/10.1007/s11136-026-04448-w", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "農村に住む弱い立場の成人を対象にした、地域ベースの社会的支援の取り組みと、心の幸福や生活の質との関係についての研究を見取り図にまとめた。", "p3": "ArkseyとO'Malleyの枠組みに従うスコーピングレビューで、4つのデータベースから1,767件の記録を特定し、2段階の選別を経て15の研究を対象にした。量的研究が10、質的研究が2、混合研究が3で、無作為化比較試験は1つだった（抄録）。", "p5": "ピアグループの支援、社会的処方、ボランティア活動、組織された地域参加の活動は、幸福感の高さ、交流の増加、社会的な結びつきの強まりと関連していた。ただし証拠は限られ、標本が小さく追跡期間が短いなど、方法がまちまちだった（抄録）。", "fun": "農村では、社会的な孤立や地理的な壁のために、弱い立場の人に医療の支援が届きにくい。そこで注目されるのが、仲間どうしの集まりやボランティアのような、病院の外の支え合いだ。このレビューは研究を集め、そうした取り組みが心の健康と結びついていることを確かめた。ただし条件に合う研究は15件で、証拠がまだ薄いことも正直に示している。", "unverified": "個々の研究の効果の大きさは抄録になく未確認。"}}, {"id": "jr38", "rank": 38, "headline": "高齢化団地の評価は専門家と住民でずれる", "title": "Governance in Dual-Aging Communities: A Competence–Press–Governance Framework and Evidence from Shanghai", "url": "https://doi.org/10.3390/buildings16234675", "authors": "Xianjun Wang ほか", "venue": "Buildings", "date": "2026-11-23", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Wang, X., Kang, J., Zhang, H., & Ji, X. (2026). Governance in Dual-Aging Communities: A Competence–Press–Governance Framework and Evidence from Shanghai. Buildings, 16(23), 4675. https://doi.org/10.3390/buildings16234675", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "住民も建物も高齢化した団地の改修で、制度の整い方と住民の日々の経験の両方を評価する枠組みを当てはめ、専門家と住民の評価のずれを示した。", "p3": "上海の3つの地区で、能力・環境圧力・統治の枠組みを使い、高齢の住民287人の調査と専門家15人による2回のデルファイ調査を行った。個人レベルの関連は、完全な回答239件で分析した（抄録）。", "p5": "5段階の尺度での住民の重みつきの評価は、地区によって3.96、3.50、3.02だった。評価の最も低い地区では、専門家は社会的空間を、住民は物理的空間を最も低く評価し、下位3つの指標のうち共通するのは1つだけだった（抄録）。", "fun": "古い団地を高齢者に住みやすく直すとき、何から手をつけるべきか。ある地区では、専門家は人が集まる社会的な空間を、住んでいる人は物理的な空間を最も低く評価した。この研究は上海の団地で、両者の答えが食い違うことを数字で示した。住む人の毎日の不便は、外から見ているだけでは分からないということだ。", "unverified": "3つの地区だけの調査で、結果がほかの都市に当てはまるかは抄録からは分からない。"}}, {"id": "jr39", "rank": 39, "headline": "災害時には社会関係資本だけでは農村の支援が届かない", "title": "Inaccessible: Weakened Social Capital and Barriers to Getting by in a New Mexico Community During the COVID ‐19 Pandemic", "url": "https://doi.org/10.1111/ruso.70082", "authors": "Morgan Montañez", "venue": "Rural Sociology", "date": "2026-11-23", "sjr": 0.853, "citescore": 4.6, "citescore_year": "2025", "apa": "Montañez, M. (2026). Inaccessible: Weakened Social Capital and Barriers to Getting by in a New Mexico Community During the COVID ‐19 Pandemic. Rural Sociology, 91(4). https://doi.org/10.1111/ruso.70082", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "人のつながり（社会関係資本）は、ふだんは農村の不便を補っていても、災害や長引く困難のときには弱まり、支援の代わりにはならないことを示した。", "p3": "ニューメキシコ州北部のヒスパニック系が多数を占める地域の住民58人への、郡レベルの質的調査（2021年の夏）である（抄録）。", "p5": "交通やインターネットなど農村のインフラの乏しさが構造的な障壁になっており、以前は社会関係資本がそれを和らげていた。コロナ禍で社会的・物理的な状況が変わると、その仕組みは一部の人にとって働かなくなった。農村の支援は社会関係資本だけに頼るべきではないとする（抄録）。", "fun": "田舎では、人のつながりによる助け合いが、足りない交通や通信を補っている。だから「絆があるから大丈夫」と言われがちだ。この研究は、コロナ禍で状況が変わると、その助け合いが弱まり、もともと設備が足りないという問題がむき出しになったことを住民の語りから示した。絆は設備の代わりにはならないという指摘が重い。", "unverified": "1つの地域の質的調査で、ほかの地域に当てはまるかは抄録からは分からない。"}}, {"id": "jr40", "rank": 40, "headline": "地域の回復力が高い県は寒さによる心血管死が少ない", "title": "Regional vulnerability and community resilience are associated with cold- and heat-related cardiovascular mortality in monsoon-affected Taiwan", "url": "https://doi.org/10.1088/1748-9326/aec579", "authors": "Hsiao-Yu Yang ほか", "venue": "Environmental Research Letters", "date": "2026-11-23", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "apa": "Yang, H.-Y., Chen, D.-R., & Chang, H.-Y. (2026). Regional vulnerability and community resilience are associated with cold- and heat-related cardiovascular mortality in monsoon-affected Taiwan. Environmental Research Letters. https://doi.org/10.1088/1748-9326/aec579", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "暑さ・寒さによる心血管疾患の死亡の負担が、地域の脆弱性や地域社会のレジリエンスによってどう変わるかを台湾の県ごとに示した。", "p3": "台湾の19の県の心血管疾患による死亡500,297件（2008〜2021年）を対象に、県ごとの分布ラグ非線形モデルを多変量メタ分析で統合する2段階の時系列研究を行い、気温に帰属できる死亡の割合を推定した。11の県レベルの指標による効果の修飾をメタ回帰で調べた（抄録）。", "p5": "寒さは心血管死亡の9.63%、暑さは1.46%を占めた。寒さによる負担は、地域社会のレジリエンスが高い県（−3.24%）と社会福祉支出が多い県（−2.36%）で低く、先住民の住民が多い県で高かった。暑さによる負担は、障害のある人の割合が高い県で大きかった（抄録）。", "fun": "暑さや寒さで亡くなる人の数は、気温だけで決まるわけではない。この研究は台湾の2008年から2021年の死亡の記録を使い、寒さによる心臓や血管の病気の死亡が、地域社会のレジリエンスが高く福祉の支出が多い県では少ないことを示した。意外なのは、寒さのほうが暑さよりずっと多くの死亡と結びついていた点だ。", "unverified": "県レベルの関連であり、個人の水準での因果を示すものではない。レジリエンスの指標の測り方の詳細は抄録からは分からない。"}}, {"id": "jr41", "rank": 41, "headline": "熟練者の助言の型を学んだ複数LLMが新人を支援", "title": "Mining and Automating Expert Guidance in Open Source: A Multi-Agent Framework Informed by the PyTorch Community", "url": "https://doi.org/10.1145/3862335", "authors": "Xiao Long ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-11-24", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "apa": "Long, X., Tan, X., Lian, X., & Zhang, L. (2026). Mining and Automating Expert Guidance in Open Source: A Multi-Agent Framework Informed by the PyTorch Community. ACM Transactions on Software Engineering and Methodology. https://doi.org/10.1145/3862335", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "オープンソースの開発に新しく参加する人を、熟練者の助言の型を学んだ複数のLLMエージェントが支援する仕組みを作り、助言の質を高めた。", "p3": "PyTorchのリポジトリの初心者向け課題から、熟練者と新人の対話383件を集めて分析し、11の主題にわたる50の助言の方略の分類を作った。これを使い、方略の知識とプロジェクト・課題・対話の文脈を、検索拡張生成で連携するLLMエージェントに組み込んだStrategicMentorを作った（抄録）。", "p5": "対話は短く、新人の問い合わせの3分の1超は返事がなく、最初の返答までの中央値は6.3時間だった。利用者調査で、StrategicMentorは基準のLLMや抽出した熟練者の返答より高く評価され、新人にも経験者にもおおむね好まれた（抄録）。", "fun": "みんなで作るソフトウェアの世界では、新しく参加した人の質問に、熟練者がいつもすぐ答えられるわけではない。この研究は、熟練者が実際にどう助言しているかを383件の対話から型として取り出し、その型をAIに持たせた。知識だけでなく「助言のしかた」を組み込んだところが面白く、抽出した熟練者の返答より高く評価された。", "unverified": "利用者調査の人数と評価の数値は抄録になく未確認。"}}, {"id": "jr42", "rank": 42, "headline": "言い換えに安定なLLMの判断でも正しいとは限らない", "title": "Stable but Not Always Correct: Large Language Model Judgments of Nurse-Assessed Symptoms and Care Problems in Rewritten Discharge Summaries", "url": "https://doi.org/10.3390/nursrep16110424", "authors": "Yanjie Sun ほか", "venue": "Nursing Reports", "date": "2026-11-23", "sjr": 0.759, "citescore": 2.9, "citescore_year": "2025", "apa": "Sun, Y., Fan, C., Tao, X., Zhou, X., Gururajan, R., Islam, M. R., & Zhang, J. (2026). Stable but Not Always Correct: Large Language Model Judgments of Nurse-Assessed Symptoms and Care Problems in Rewritten Discharge Summaries. Nursing Reports, 16(11), 424. https://doi.org/10.3390/nursrep16110424", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "患者の記録についてのLLMの判断は、文章を言い換えても変わらなければ信頼できると考えられがちだが、安定していても誤っている場合が多いことを示した。", "p3": "2つの公開重みのLLM（Llama 3.3 70BとQwen2.5 72B）に、医師が書いた60件の退院サマリーと、意味を保つよう作った522件の言い換えについて、看護師が評価する8つの症状・ケア上の問題が記載されているかを判定させ、2人の看護師の注釈（κ = 0.93）を基準にした（抄録）。", "p5": "両モデルは記載された問題の大半を見つけたが（感度0.97と0.93）、記載のない問題も多く報告した（陽性的中率0.66と0.76）。どの言い換えでも変わらなかった判断の正解率は90%と94%、変わった判断は55%と58%だったが、誤った判断の43〜53%は一度も変わらなかった（抄録）。", "fun": "同じ質問を言い方を変えて何度かして、答えが毎回同じなら、その答えは信用できそうに思える。この研究はAIでそれを確かめ、答えがぶれたときは確かに見直したほうがよいが、ぶれない答えの中にも間違いがたくさん残っていることを示した。何度聞いても同じことを言うからといって、正しいとは限らないのである。", "unverified": "1つの施設のデータによる研究で、分析計画は事前登録されていないと抄録にある。"}}, {"id": "jr43", "rank": 43, "headline": "失敗への備えはLLMの予測の信念を変えるか", "title": "Does a safety net change what a model believes? Failure buffers, qualitative evidence and deliberation in LLM forecasts", "url": "https://doi.org/10.1016/j.knosys.2026.117358", "authors": "Yimin Du ほか", "venue": "Knowledge-Based Systems", "date": "2026-11-23", "sjr": 1.753, "citescore": 13.7, "citescore_year": "2025", "apa": "Du, Y., & Wu, G. (2026). Does a safety net change what a model believes? Failure buffers, qualitative evidence and deliberation in LLM forecasts. Knowledge-Based Systems, 117358. https://doi.org/10.1016/j.knosys.2026.117358", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、失敗に備えた緩衝（セーフティネット）、質的な証拠、熟議が、LLMの予測の中で示される信念を変えるかどうかを調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIに予測をさせるとき、失敗したときの備えがあると伝えたり、数字以外の証拠を見せたり、じっくり議論させたりすると、AIが信じている内容そのものは変わるのだろうか。題名から読み取れるのは、その問いである。", "unverified": "抄録・本文を入手できず、実験の設計、使ったモデル、結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "LLMから集団の知識を移す：都市の知覚の事例", "title": "Transferring group knowledge from LLMs: The case of urban perception", "url": "https://doi.org/10.1016/j.cities.2026.107745", "authors": "Ce Hou ほか", "venue": "Cities", "date": "2026-11-23", "sjr": 1.772, "citescore": 11.5, "citescore_year": "2025", "apa": "Hou, C., Zhang, F., Kang, Y., Fan, Z., & Li, S. (2026). Transferring group knowledge from LLMs: The case of urban perception. Cities, 180, 107745. https://doi.org/10.1016/j.cities.2026.107745", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、LLMが持っている集団の知識を別の課題に移すことを、都市の知覚を事例に調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "街がどう感じられるかという印象は、人の集団が共有している知識の一種だ。大量の文章から学んだAIは、そうした集団の知識をすでに身につけているのだろうか。それを取り出して街の知覚の評価に使えるのか、というのが題名から読み取れる問いだ。", "unverified": "抄録・本文を入手できず、方法、使ったデータ、結果はすべて未確認。"}}, {"id": "jr45", "rank": 45, "headline": "TODは公平を計画に入れないと環境効果も減る", "title": "Advancing Sustainable and Just Cities Through Transit-Oriented Development: A Scoping Review", "url": "https://doi.org/10.3390/su182311913", "authors": "Ali Bokhari ほか", "venue": "Sustainability", "date": "2026-11-23", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "apa": "Bokhari, A., & Sharifi, F. (2026). Advancing Sustainable and Just Cities Through Transit-Oriented Development: A Scoping Review. Sustainability, 18(23), 11913. https://doi.org/10.3390/su182311913", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "駅を中心に街を高密度に開発する公共交通指向型開発（TOD）が、持続可能で公正な都市づくりにどう役立ち、どんな危険を伴うかを研究の蓄積から整理した。", "p3": "2025年1月までの91の研究を系統的な検索で特定したスコーピングレビューで、高密度化の戦略が経済的な生産性、環境の持続可能性、社会的な公正にどう関わるかを主題分析で評価した。暮らしの経験や統治の質的な分析と、土地利用の効率や到達しやすさの量的な研究を統合した（抄録）。", "p5": "立ち退き、地価の上昇、住宅と公共交通の利用の不平等といった危険が指摘されている。持続可能性と公正の成果は結びついており、公正が計画に組み込まれていないと、開発後の住民の構成の変化が環境面の利益を減らしうる（抄録）。", "fun": "駅のまわりに住宅や店を集めれば、公共交通を使う暮らしができて環境に良い。ところが開発が進むと土地の値段が上がり、もともと住んでいた人が立ち退かざるをえなくなることがある。住む人の顔ぶれが入れ替わると、環境への効果も薄れることがあるという。公平さを考えないと環境の目標にも届かない、というつながりが面白い。", "unverified": "個々の研究の効果の大きさは抄録になく未確認。"}}, {"id": "jr46", "rank": 46, "headline": "高速鉄道時代の新駅はほぼ未開発地に立地した", "title": "A Siting-Paradigm Shift in Railway Passenger Stations of the High-Speed-Rail Era: Cross-Scale Open-Data Evidence from 83 Stations Along the Beijing–Shanghai Corridor", "url": "https://doi.org/10.3390/buildings16234645", "authors": "Shujia Li ほか", "venue": "Buildings", "date": "2026-11-23", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Li, S., & Li, W. (2026). A Siting-Paradigm Shift in Railway Passenger Stations of the High-Speed-Rail Era: Cross-Scale Open-Data Evidence from 83 Stations Along the Beijing–Shanghai Corridor. Buildings, 16(23), 4645. https://doi.org/10.3390/buildings16234645", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "高速鉄道の時代に新しく作られた駅は、従来の駅と違って、ほとんど開発されていない場所に立地していることを、北京–上海の回廊の駅全体の比較で示した。", "p3": "回廊の旅客駅83駅について、駅周辺の水準ではOpenStreetMapの道路網・施設とGlobal Human Settlement Layerのデータから類型を作り、建てこみの強さに関連する要因をランダムフォレストとSHAPで順位づけた。駅舎の水準では、3つの例のコンコースを可視グラフ分析で調べた（抄録）。", "p5": "高速鉄道の時代に新設された駅は、既存の駅よりはるかに建てこんでいない場所にあり（r = −0.59）、開業前の用地はほとんど未開発だった（2000年の建てこみ率が0.05に対し0.29）。同じ周辺の強さでは、幹線の高速鉄道駅の中心部は既存の駅の1.74倍の規模を持つ（抄録）。", "fun": "昔からの駅は建てこんだ街の中にあるが、高速鉄道の時代に新しく作られた駅は、ほとんど建物のない場所に立地している。この研究は中国の北京と上海を結ぶ回廊の83駅を、公開されている地図のデータで調べ、その違いを数字で確かめた。駅ができる前の土地がほとんど未開発だったことまで、過去のデータからたどれるのが面白い。", "unverified": "駅の立地とその後の開発の因果関係は抄録からは分からない。可視グラフ分析は3つの例にとどまる。"}}, {"id": "jr47", "rank": 47, "headline": "下水管の付着物リスクを点検記録から3段階に分類", "title": "A data-driven framework for encrustation prediction and risk-based inspection of urban sewer networks", "url": "https://doi.org/10.1108/sasbe-05-2026-0498", "authors": "Dramani Arimiyaw ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-11-23", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "apa": "Arimiyaw, D., Zayed, T., Yang, J., & Nashat, M. (2026). A data-driven framework for encrustation prediction and risk-based inspection of urban sewer networks. Smart and Sustainable Built Environment, 1–32. https://doi.org/10.1108/sasbe-05-2026-0498", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "下水管の内側に付着物（エンクラステーション）ができる危険を、点検の記録から予測し、管を低・中・高の3段階に分けて点検の優先順位を決める枠組みを作った。", "p3": "香港の排水網の管内カメラ（CCTV）の点検記録（2007〜2021年）に、施設・環境・人口のデータを統合し、10の分類器を層化5分割交差検証で比べた。確率の較正を、未加工の出力、Plattスケーリング、等調回帰で比べ、SHAPで特徴の寄与を解釈した（抄録）。", "p5": "ランダムフォレストが最も良く（AUC-ROC = 0.8728、F1スコア = 0.6343）、未加工の確率が較正後より良かった。3段階の危険度の付着物の割合は11.5%、55.4%、80.4%で、高リスクの管は試験データの8.7%だけだった。影響の大きい予測因子は湿度、気温、地区、降雨だった（抄録）。", "fun": "下水管の内側には付着物がこびりつき、水を流す力を少しずつ減らしていく。全部の管をカメラで調べるのは大変なので、どの管が危ないかを前もって当てたい。この研究は過去の点検記録から危険な管を3段階に分けた。高リスクとされた管は全体の8.7%だけで、その80.4%に付着物があったから、点検の的を絞る助けになる。", "unverified": "ほかの都市の下水網に当てはまるかは抄録からは分からない。"}}, {"id": "jr48", "rank": 48, "headline": "駅に近くても住みよさにつながらない地区の再生", "title": "Transit Proximity Without Livability: A Performance-Based Urban Regeneration Framework for Inner-City Districts in Hot-Arid Gulf Cities", "url": "https://doi.org/10.3390/urbansci10120681", "authors": "Jalal Hoblos ほか", "venue": "Urban Science", "date": "2026-11-23", "sjr": 0.673, "citescore": 3.7, "citescore_year": "2025", "apa": "Hoblos, J., & Furlan, R. (2026). Transit Proximity Without Livability: A Performance-Based Urban Regeneration Framework for Inner-City Districts in Hot-Arid Gulf Cities. Urban Science, 10(12), 681. https://doi.org/10.3390/urbansci10120681", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "地下鉄の駅のすぐそばにあるのに住みよくならない市街地について、原因を診断し、再生の枠組みを提案した。", "p3": "ドーハの最も初期に計画された地区の1つであるAl-Najmaを対象に、統合的修正手法（IMM）、地理空間分析、系統的な現地観察、街頭での調査を組み合わせた混合研究法で、まとまり・複雑さ・つながりの観点から診断した（抄録）。", "p5": "課題は3つで、土地利用の多様性の乏しさと公共空間の不在、細かく分かれた敷地と劣化した建物、地下鉄までの最後の区間を妨げる不十分な街路である。土地の再調整、段階的な住宅の更新、歩行者優先の街路、日陰のある緑の回廊などからなる多層の再生の枠組みを提案した（抄録）。", "fun": "駅が近ければ住みよい街になる、とは限らない。この研究が調べたドーハの地区は、地下鉄の駅が3つも隣にあるのに、土地が細かく分かれて建物が劣化し、駅までの最後の道のりを支える街路も十分でない。交通への大きな投資の効果は、街の中身が整っていないと住みよさとして表れないことを教えてくれる。", "unverified": "提案の枠組みは設計の提案で、実施した結果の検証は抄録からは確認できない。"}}, {"id": "jr49", "rank": 49, "headline": "現場従業員は超自動化に不安と職務設計の機会をみる", "title": "Human-Centric Hyperautomation Using Supply Chain 5.0 Principles: A Front-Line Perspective", "url": "https://doi.org/10.1177/10596011261509184", "authors": "Andrew Birkbeck ほか", "venue": "Group and Organization Management", "date": "2026-11-23", "sjr": 2.543, "citescore": 11.3, "citescore_year": "2025", "apa": "Birkbeck, A., Rowe, L., & Pimblett, C. (2026). Human-Centric Hyperautomation Using Supply Chain 5.0 Principles: A Front-Line Perspective. Group & Organization Management. https://doi.org/10.1177/10596011261509184", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "物流の現場で働く人が、業務の徹底した自動化（ハイパーオートメーション）の導入をどう受け止めているかを調べ、人を中心にした進め方の手引きをまとめた。", "p3": "英国に拠点を置く家族経営の国際物流会社の4つの事業部門で、現場の従業員への質的な半構造化の調査を行い、帰納的・現象学的な事例研究として主題分析した（抄録）。", "p5": "課題は、従業員の自動化への不安と、会社と従業員の意思疎通に関わる信頼だった。機会は、職務の設計、個人の両利きの働き方、より価値の高い仕事、人事管理に見いだされた。技能の習得と職務設計で不安に対処する、人を中心にした道具立てを提案する（抄録）。", "fun": "物流の現場に徹底した自動化が入ると、現場の人は不安を感じる。この研究は現場の人に話を聞き、その不安と信頼が、会社と従業員の意思疎通に結びついていることを見いだした。自動化を入れる計画だけでなく、技能を身につける機会や仕事の作り直しを考える必要があるという結論は、当たり前のようでいて見落とされやすい。", "unverified": "1つの会社の質的な調査で、回答者の人数は抄録になく未確認。"}}, {"id": "jr50", "rank": 50, "headline": "地震による斜面崩壊の年発生確率を推定", "title": "Estimation of annual earthquake-induced landslide occurrence probabilities from calibrated machine learning predictions and seismic hazard curves", "url": "https://doi.org/10.1016/j.ijdrr.2026.106592", "authors": "Hiroki Ishibashi ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-23", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "apa": "Ishibashi, H., & Kawara, K. (2026). Estimation of annual earthquake-induced landslide occurrence probabilities from calibrated machine learning predictions and seismic hazard curves. International Journal of Disaster Risk Reduction, 106592. https://doi.org/10.1016/j.ijdrr.2026.106592", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、較正した機械学習の予測と地震ハザード曲線を組み合わせて、地震が引き起こす地すべりの年あたりの発生確率を推定する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "地震で崩れやすい斜面が分かっても、「1年のうちに崩れる確率はどれくらいか」まで答えるのは難しい。崩れやすさの予測と、地震がどのくらいの強さでどのくらい起きやすいかという情報を組み合わせれば、年あたりの確率として表せるのか、というのが題名から読み取れる問いだ。", "unverified": "抄録・本文を入手できず、予測の方法、対象の地域、結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "出稼ぎは収入を倍にするが幸福感は下がる", "title": "The Costs and Benefits of Guest Worker Programs: Experimental Evidence from the India-UAE Migration Corridor,", "url": "https://doi.org/10.1093/jeea/jvag075", "authors": "Suresh Naidu ほか", "venue": "Journal of the European Economic Association", "date": "2026-11-23", "sjr": 7.259, "citescore": 6.7, "citescore_year": "2025", "apa": "Naidu, S., Nyarko, Y., & Wang, S.-Y. (2026). The Costs and Benefits of Guest Worker Programs: Experimental Evidence from the India-UAE Migration Corridor,. Journal of the European Economic Association. https://doi.org/10.1093/jeea/jvag075", "why": "インドからUAEの建設の仕事に応募した人を対象にした無作為化実験で、一時的な合法移民の収益を推定した。移住した人の収入は2倍になったが、仲介業者に多額の前払い費用を払い、幸福感は大きく下がった。申し出を断った人に外挿すると、金銭的な収益は同程度でも幸福感の低下はより大きく、幸福感と仲介費用を考慮すると厚生の利得は金銭的な利得の半分になる。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "競争が激しくても情報開示は部分的にとどまる", "title": "Limits of Disclosure in Search Markets", "url": "https://doi.org/10.1093/restud/rdag129", "authors": "Raphael Boleslavsky ほか", "venue": "Review of Economic Studies", "date": "2026-11-20", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "apa": "Boleslavsky, R., & Krasteva, S. (2026). Limits of Disclosure in Search Markets. Review of Economic Studies. https://doi.org/10.1093/restud/rdag129", "why": "探索費用のかからない目利きの消費者と、費用のかかる一般の消費者が混在する探索市場での企業の情報開示を分析した。前者は正直な開示を、後者は隠蔽を促すため、均衡では競争が激しくても部分的な開示が残る。競争の激化は目利きの消費者を利するが一般の消費者を害しうること、探索費用の変化が開示に非単調な効果を持つことを示した。"}, {"id": "jn03", "rank": 3, "field": "政治学", "headline": "政治投稿が人かAIかを人はほとんど見分けられない", "title": "Humans show limited ability to distinguish human-authored from AI-generated political content on social media", "url": "https://doi.org/10.1073/pnas.2534309123", "authors": "Sejin Paik ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Paik, S., Ventura, T., Ansell, R., Bode, L., Toney-Wails, A., & Singh, L. (2026). Humans show limited ability to distinguish human-authored from AI-generated political content on social media. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2534309123", "why": "2024年の米大統領選討論会に関するSNS投稿について、人が書いたものとLLMが生成したものを対にして、どちらがAIかを判定させる行動実験を行った。人の投稿は6つのうち5つのLLMの出力より人間らしいと評価されたが、判別の精度は偶然をわずかに上回る程度で、新しいLLMほど難しく、プラットフォームや党派で変わった。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "日本の投信は設定9か月で資産のピークを迎える", "title": "Short-horizon capital in a bank-centered financial system: Japanese mutual fund launches relative to the U.S.", "url": "https://doi.org/10.1057/s41267-026-00916-0", "authors": "Toshiki Honda ほか", "venue": "Journal of International Business Studies", "date": "2026-11-23", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "apa": "Honda, T., Huang, A. G., Miyakawa, D., Nishiuchi, S., & Wermers, R. (2026). Short-horizon capital in a bank-centered financial system: Japanese mutual fund launches relative to the U.S. Journal of International Business Studies. https://doi.org/10.1057/s41267-026-00916-0", "why": "日本の国内株式アクティブ投信は、設定から運用資産のピークまでの中央値が9か月で、米国の4.6年と大きく違う。設定時の強い資金流入がすぐに継続的な流出に変わるためで、銀行中心の集中した販売網と販売時に偏った手数料体系に結びついていることを示した。設定規模と販売手数料が大きいほどピークが早いのは日本だけで、同じ金融商品でも仲介と報酬の制度で寿命が変わる。"}, {"id": "jn05", "rank": 5, "field": "機械学習", "headline": "標本の偏りに上限を置いて頑健な決定規則を学習", "title": "Learning from a Biased Sample", "url": "https://doi.org/10.1287/mnsc.2024.08073", "authors": "Roshni Sahoo ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Sahoo, R., Lei, L., & Wager, S. (2026). Learning from a Biased Sample. Management Science. https://doi.org/10.1287/mnsc.2024.08073", "why": "経験リスク最小化は、訓練データが運用時と同じ条件で得られていることを前提とする。観測される共変量は標本に選ばれる確率をいくらでも変えうるが、説明されない変動は定数倍までに限られるという偏りのモデルを提案し、その範囲で最悪の場合のリスクを最小にする決定規則を分布頑健最適化で学習する方法を示した。"}, {"id": "jn06", "rank": 6, "field": "統計学", "headline": "小さな採用集団の不利益影響はベイズ法で検出力が上がる", "title": "Small N, High Stakes: Simulating Adverse Impact With Bayesian Logistic Regression Analysis and Permutation Tests", "url": "https://doi.org/10.1177/10944281261491767", "authors": "Patrick J. Rolwes ほか", "venue": "Organizational Research Methods", "date": "2026-11-23", "sjr": 14.268, "citescore": 48.0, "citescore_year": "2025", "apa": "Rolwes, P. J., Courey, K. A., Oswald, F. L., & Martín-Raugh, M. P. (2026). Small N, High Stakes: Simulating Adverse Impact With Bayesian Logistic Regression Analysis and Permutation Tests. Organizational Research Methods. https://doi.org/10.1177/10944281261491767", "why": "採用での集団間の不利益影響（adverse impact）の判定に使われる経験則や検定は、採用人数が少ないと性能が悪い。効果量・選抜率・集団の大きさを現実的な範囲で変えたモンテカルロ実験で、ベイズのロジスティック回帰と並べ替え検定を評価した。弱情報事前分布などのベイズのオッズ比の規則は小標本で頻度論の方法より検出力が高いが、平均で0.80には届かなかった。"}, {"id": "jn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "苦しくても組織が求める自己像にしがみつく仕組み", "title": "The unconscious relational binds of identity regulation: Social defenses and structuring fantasies", "url": "https://doi.org/10.1177/00187267261500376", "authors": "Louise Colling ほか", "venue": "Human Relations", "date": "2026-11-23", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Colling, L., Dufays, F., & Van Caillie, D. (2026). The unconscious relational binds of identity regulation: Social defenses and structuring fantasies. Human Relations. https://doi.org/10.1177/00187267261500376", "why": "従業員は、苦しみを伴っても組織が勧めるアイデンティティになぜ固執するのか。職員に「熱心なスカウト」であることを暗に求めるベルギーの医療組織の事例から、熱意の要求による負担を、年長者と若手が対照的な自己像を採り互いを責めるという世代間の分断で無意識に処理していることを示した。この防衛と空想の働きが、アイデンティティ統制の拘束をさらに強める。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "担保の需要がレポ市場と金融政策の波及を弱める", "title": "Collateral Demand in Wholesale Funding Markets", "url": "https://doi.org/10.1093/rfs/hhag099", "authors": "Jamie Coen ほか", "venue": "The Review of Financial Studies", "date": "2026-11-23", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "apa": "Coen, J., Coen, P., & Hüser, A.-C. (2026). Collateral Demand in Wholesale Funding Markets. The Review of Financial Studies. https://doi.org/10.1093/rfs/hhag099", "why": "レポ市場は資金調達の場であると同時に、担保の資産を手に入れる場でもある。英国債レポ市場での異質な企業間の取引のモデルを構造推定し、この担保需要が市場の活動を押し下げ、金融政策の波及を妨げうることを示した。量的緩和で中央銀行が抱えた資産を貸し出せば、波及は20%、企業の余剰は38%改善すると試算する。"}, {"id": "jn09", "rank": 9, "field": "工学", "headline": "ガス田の誘発地震が暴走破壊になる条件を理論化", "title": "Conditions for runaway ruptures during reservoir operations: Magnitude–frequency distribution implications and application to Groningen", "url": "https://doi.org/10.1073/pnas.2625955123", "authors": "Qian Shi ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Shi, Q., Sáez, A., Li, L., Im, K., Bourne, S., van Elk, J., & Avouac, J.-P. (2026). Conditions for runaway ruptures during reservoir operations: Magnitude–frequency distribution implications and application to Groningen. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2625955123", "why": "ガス貯留層から下位の地層へ伝わる誘発地震の破壊が、自然に止まるか暴走するかの条件を線形破壊力学で導き、貯留層の厚さ・圧力低下・背景応力・破壊エネルギーを2つの無次元量にまとめた相図を示した。オランダのフローニンゲンガス田に当てはめると、暴走は原理的にはありえたが条件は満たされていなかった可能性が高く、M3.0超の地震が統計則の予想より少ないことも再現した。"}, {"id": "jn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "「大きすぎて潰せない」が安全の過信を強める", "title": "EXPRESS: Supercharging the Confidence Trap: Too-Big-to-Fail and Man-Made Disasters", "url": "https://doi.org/10.1177/10591478261510216", "authors": "Akhil Bhardwaj ほか", "venue": "Production and Operations Management", "date": "2026-11-23", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Bhardwaj, A., Akkermans, H., & Van Wassenhove, L. N. (2026). EXPRESS: Supercharging the Confidence Trap: Too-Big-to-Fail and Man-Made Disasters. Production and Operations Management. https://doi.org/10.1177/10591478261510216", "why": "ボーイングのように規制の厳しい組織で人為的な大事故が起きる仕組みを、システムダイナミクスの枠組みの中のエージェントベースモデルで調べた。過去にリスクを取って成功したことが今後のリスクも正当化するという「過信の罠」に規制者と事業者の双方が陥り、組織が大きすぎて潰せないと見なされると市場の淘汰が働かず悪化する。役員報酬の返還などの政策手段を提案する。"}, {"id": "jn11", "rank": 11, "field": "機械学習", "headline": "生成された科学画像の忠実さを形の持続性で検証", "title": "Topological validation of generated scientific images", "url": "https://doi.org/10.1073/pnas.2622414123", "authors": "Asim K. Dey ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Dey, A. K., Goel, J., Chatterjee, S., Gel, Y. R., & Poor, H. V. (2026). Topological validation of generated scientific images. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2622414123", "why": "自動運転・遠隔探査・デジタルツインなどで使われる合成の科学画像について、品質と不確実性の厳密な評価は難しい。合成電力網の検証で発展した位相的・幾何学的な方法をもとに、画像の多重スケールの形のパターンの「持続性」を生存時間解析の統計的な枠組みで比べる体系的な方法を提案した。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "既存品の欠品は新商品の試し買いを促す", "title": "Stockouts and the Success of New Products", "url": "https://doi.org/10.1287/mnsc.2023.02602", "authors": "Diego Aparicio ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Aparicio, D., & Simester, D. I. (2026). Stockouts and the Success of New Products. Management Science. https://doi.org/10.1287/mnsc.2023.02602", "why": "新商品の発売時に既存品が欠品していると、新商品の売上が少なくとも6か月高いことを示した。過去の欠品と他店の同時期の欠品を操作変数に使って因果を確かめ、個人の取引データから、欠品が新商品の試し買いを促し、その後の反復購入につながる仕組みを裏づけた。在庫が商品の試用を左右するという、在庫政策の新しいトレードオフを示す。"}, {"id": "jn13", "rank": 13, "field": "経営学", "headline": "公務員制度改革で米国債の利回りが下がった", "title": "Corruption Perceptions, the Pendleton Act, and Sovereign Borrowing Costs", "url": "https://doi.org/10.1111/puar.70236", "authors": "John A. Dove ほか", "venue": "Public Administration Review", "date": "2026-11-23", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "apa": "Dove, J. A., & Trudeau, N. J. (2026). Corruption Perceptions, the Pendleton Act, and Sovereign Borrowing Costs. Public Administration Review. https://doi.org/10.1111/puar.70236", "why": "官職の猟官制は汚職と非効率を生むとされるが、市場がその改革をどう評価したかは調べられてこなかった。ペンドルトン公務員制度改革法の成立を中断時系列分析で評価し、連邦政府の借入費用が仕様により63〜84ベーシスポイント下がったことを示した。"}, {"id": "jn14", "rank": 14, "field": "経済学", "headline": "収入の不安が高まると宗教への寄付が増える", "title": "Hedging by Giving: Spiritual Insurance and Religious Donations", "url": "https://doi.org/10.1017/s0022109026103482", "authors": "Yu-Jane Liu ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-23", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "apa": "Liu, Y.-J., Meng, J., Sheng, D., Yang, G., & Zhang, Y. (2026). Hedging by Giving: Spiritual Insurance and Religious Donations. Journal of Financial and Quantitative Analysis, 1–37. https://doi.org/10.1017/s0022109026103482", "why": "善行と引き換えに加護を期待してリスクに備える「精神的な保険」を、銀行の取引データで調べた。所得の不確実性と健康のショックは寄付、とくに宗教団体への寄付を増やし、宗教団体に寄付する人は保険への支出を減らす傾向がある。数百万人を対象にしたオンラインの現場実験でも、精神的な保険の語りが寄付を増やした。"}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "多国籍企業は気候変動に強い国に子会社を置く", "title": "Adapting to the new abnormal: multinational corporations’ foreign subsidiary investment and country resilience to climate change", "url": "https://doi.org/10.1057/s41267-026-00912-4", "authors": "Chang Hoon Oh ほか", "venue": "Journal of International Business Studies", "date": "2026-11-23", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "apa": "Oh, C. H., Rivera, J., & Oetzel, J. (2026). Adapting to the new abnormal: multinational corporations’ foreign subsidiary investment and country resilience to climate change. Journal of International Business Studies. https://doi.org/10.1057/s41267-026-00912-4", "why": "Global Fortune 500の企業の155か国への投資（2003〜2017年）を分析し、気候変動へのレジリエンスが高い国ほど完全所有の子会社が多く設立されることを示した。この関係はESGの能力が高い企業や、レジリエンスの高い国での経験がある企業で強く、財務的な余裕が大きい企業では弱い。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "情報を増やすと投資の誘因を損ねる場合がある", "title": "Information Design with Supplemental Investment", "url": "https://doi.org/10.1287/mnsc.2025.00524", "authors": "Lin Nan ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Nan, L., Qiu, L., Wen, X., & Zheng, R. (2026). Information Design with Supplemental Investment. Management Science. https://doi.org/10.1287/mnsc.2025.00524", "why": "企業の基礎的な質と、追加投資の性質（上振れを伸ばすか、下振れを抑えるか）の2次元の情報の非対称があるとき、基礎的な質についての情報を増やしても効率は必ずしも上がらず、害になりうることを示した。最適な情報システムは信用リスクの水準によって、情報を出さないか、楽観的に偏ったものになる。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "企業の質についての情報を増やせば資金の配分は必ず良くなるという常識が、企業の投資の性質も外から見えない場合には成り立たないことを示した。", "p3": "企業の基礎的な質（良いか悪いか）と、追加投資の性質（上振れの可能性を高めるか、下振れのリスクを抑えるか）の2次元で情報の非対称がある設定で、基礎的な質の次元だけを扱える情報システムの最適な設計を分析した理論研究（抄録）。", "p5": "情報の非対称が基礎的な質だけなら、情報が多いほど効率は上がる。2次元の場合は、基礎的な質についての情報を増やしても効率が上がるとは限らず、害になりうる。最適な情報システムは、信用リスクの水準に応じて、情報を出さないものか楽観的に偏ったものになりうる（抄録）。", "fun": "会社についての情報は、多ければ多いほど資金の出し手のためになると考えるのが普通だ。この研究は、会社が選ぶ追加の投資の性質まで見えない場合には、話が変わることを示した。情報を増やしすぎると、会社が投資をする誘因を損ねてしまうことがある。全部見せるより、あえて情報を出さないほうが効率的な場合があるというのが意外だ。", "unverified": "理論モデルの研究で、実際のデータでの検証は抄録からは確認できない。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "分権的な動的マッチングで全件提出を促す仕組み", "title": "Optimal Incentive Design for Decentralized Dynamic Matching Markets", "url": "https://doi.org/10.1287/mnsc.2025.01346", "authors": "Chen Chen ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Chen, C., Qian, P., & Zhang, J. (2026). Optimal Incentive Design for Decentralized Dynamic Matching Markets. Management Science. https://doi.org/10.1287/mnsc.2025.01346", "why": "複数病院の腎臓交換のように、各主体が自分の案件を抱え込める分権的な動的マッチング市場で、到着した案件をすべて提出させる金銭的・非金銭的な仕組みを設計した。提出した案件の限界価値に応じて報いる仕組みは、確率的に選んだ主体にマッチングを任せる形で金銭なしでも実装できる。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "複数の病院による腎臓交換のように、参加者が自分の案件を抱え込める動的なマッチング市場で、全ての案件を出し合うように促す仕組みを設計した。", "p3": "自己の利益を追う複数の主体が、それぞれの手元で動的なマッチングを管理するモデルを考える。案件は確率的に到着し、一定時間で失効する。提出した案件の限界価値に応じて報いる仕組みと、それにクレジットを加えた改良版を提案した（抄録）。", "p5": "限界価値の仕組みは、確率的に選んだ主体にマッチングを任せて報酬を受け取らせる形で、金銭なしでも実装できる。この仕組みのもとで全件の提出は近似的なナッシュ均衡になり、抜け駆けの利得は主体の数が増えると消える。腎臓交換のデータによる数値実験でも、抜け駆けの利得は小さかった（抄録）。", "fun": "腎臓の交換では、病院どうしが案件を持ち寄ると、組み合わせの可能性が広がる。でも各病院は、自分の所で済ませられる案件を抱え込みたくなる。この研究は、出した案件が全体にもたらす価値に応じて報いれば、全部を出すのがほぼ得になることを示した。しかも金銭のやり取りなしで実現できる形があるのが面白い。", "unverified": "数値実験の具体的な数値は抄録になく未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "近い客を優先する配達は遅延を減らすが公平を損なう", "title": "Proximity-Based Delivery Policies: Efficiency, Coverage, and Fairness", "url": "https://doi.org/10.1287/mnsc.2025.02206", "authors": "Zhongbin Wang ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Wang, Z., Cui, S., Li, Y., & Zhang, Q. (2026). Proximity-Based Delivery Policies: Efficiency, Coverage, and Fairness. Management Science. https://doi.org/10.1287/mnsc.2025.02206", "why": "即時配達で、先着順ではなく店に近い客の注文を優先する方針は、配達員を増やさずに平均の遅延を大きく減らすが、遠い客の待ち時間が延びる。近い客が優先のために払い、遠い客が補償を受ける誘因両立的な仕組みで、効率を保ったまま先着順並みの公平さを取り戻せることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "即時配達で、注文の順ではなく店に近い客から届ける方針が、配達員を増やさずに遅れを減らすこと、そのとき生じる不公平を料金と補償で抑えられることを示した。", "p3": "先着順の代わりに、店に近い客の注文を優先する近接優先の方針を提案して分析した。さらに、近い客が優先のために料金を払い、遠い客が長い待ち時間の補償を受ける、誘因両立的な仕組みを導入した（抄録）。", "p5": "近接優先は平均の配達の遅れを大きく減らすが、遠い客の待ち時間が延び、市場の範囲が縮みうる。誘因両立的な仕組みは、効率を保ったまま公平さを先着順に近い水準に戻し、需要と消費者余剰を増やす。効果は、中程度に密な市場で大きい（抄録）。", "fun": "出前を頼んだ順に届けるのは公平に見える。でも店に近い客から届ければ、配達員を増やさなくても平均の待ち時間は大きく減る。ただしそれでは遠い客が後回しになる。この研究は、近い客が優先の料金を払い、遠い客が埋め合わせを受け取る仕組みにすれば、速さと公平さを両立できることを示した。", "unverified": "遅れの減少の大きさを示す数値は抄録になく未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "深層学習で接点ポートフォリオの重みを直接推定", "title": "Deep Tangency Portfolio", "url": "https://doi.org/10.1287/mnsc.2023.03136", "authors": "Guanhao Feng ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "高次元の企業特性から作るロング・ショートの「深層ファクター」を基準ファクターに加え、シャープレシオの最大化を目的に接点ポートフォリオの重みを直接推定する枠組み。米国社債と132の特性への適用で、深層ファクターの標本外シャープレシオは1を超え、市場ファクターを基準にした接点ポートフォリオでは2を超えた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "多数の企業特性から深層学習で作った「深層ファクター」を既存のファクターに加え、接点ポートフォリオの重みを直接推定する枠組みを作った。", "p3": "シャープレシオの最大化を目的に、高次元の特性から作るロング・ショートの深層ファクターを学習する。深層ファクターは、基準のリスクに対する自然なヘッジになり、複数の市場の信号を取り込んで基準の成績を高める。米国の社債に、債券・株式・オプションの132の企業レベルの特性を使って適用した（抄録）。", "p5": "深層ファクターの標本外のシャープレシオは1を超え、市場ファクターを基準にした深層接点ポートフォリオは2を超えて、観測できる共通のファクターや潜在ファクターで張られるポートフォリオを上回った。債券のリスクの信号は密で、複数の市場の情報の非線形な統合が要ることを示す（抄録）。", "fun": "投資では、リスクに対してどれだけ収益が得られるかを表すシャープレシオが大事になる。この研究は、会社の132種類の特徴を深層学習に読み込ませ、その比を最大にする組み合わせを直接学習させた。株やオプションの市場の情報が、社債のリスクを読む手がかりになるという結果は、市場どうしのつながりの深さを示している。", "unverified": "取引費用を考えたときの成績や、対象期間は抄録からは分からず未確認。"}}, {"id": "jn20", "rank": 20, "field": "オペレーションズ・リサーチ", "headline": "消費者が公平さを求めると両方の販路で価格が上がりうる", "title": "EXPRESS: The Role of Consumer Fairness Seeking in Live-Stream E-Commerce", "url": "https://doi.org/10.1177/10591478261512635", "authors": "Baozhuang Niu ほか", "venue": "Production and Operations Management", "date": "2026-11-23", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "ブランドの直販とインフルエンサーのライブ配信販売が併存すると価格差が生じ、消費者は価格の公平さを気にする。ゲーム理論のモデルで、消費者の公平さへの関心が高まると、値下げ競争の予想に反して両方の販路の価格が上がりうること、売り手の損得はネットワーク効果の強さなどで変わることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ブランドの直販とインフルエンサーのライブ配信販売が並ぶとき、価格の公平さを気にする消費者が増えると、両方の販路で価格がかえって上がりうることを示した。", "p3": "直販のブランド所有者と、ライブ配信で売るインフルエンサー（KOL）の価格決定を、消費者が他の人と比べて公平さを求める行動を入れたゲーム理論のモデルで分析した（抄録）。", "p5": "消費者の公平さへの関心が高まると、値下げ競争になるという通常の予想に反して、両方の販路で価格が上がることがある。公平さの追求は、ネットワーク効果の強さや競争の激しさに応じて、両方の売り手を得させることも損させることもあり、両得・両損・片方だけ得という結果を特定した（抄録）。", "fun": "同じ商品が、直販とライブ配信で違う値段で売られていると、消費者は価格の公平さを気にする。それなら売り手は値下げを競いそうなものだ。ところがこの研究のモデルでは、消費者が公平さを強く求めるほど、両方の値段が上がることがある。公平を求める気持ちが、かえって高い値段につながりうるという逆説が面白い。", "unverified": "理論モデルの研究で、実際の販売データでの検証は抄録からは確認できない。"}}, {"id": "jn21", "rank": 21, "field": "オペレーションズ・リサーチ", "headline": "分散型の最適潮流計算の収束を有限時間の更新則で加速", "title": "Alternating Direction Method of Multipliers-Based Distributed Optimal Power Flow with Fixed- and Finite-Time Update Rules", "url": "https://doi.org/10.1287/ijoc.2025.1563", "authors": "Milad Hasanzadeh ほか", "venue": "INFORMS Journal on Computing", "date": "2026-11-23", "sjr": 1.974, "citescore": 6.6, "citescore_year": "2025", "why": "交互方向乗数法（ADMM）で解く分散型の最適潮流計算について、主変数と双対変数のそれぞれに有限時間・固定時間の更新則を導入し、隣り合う部分問題の合意を速める方法を提案した。安定性と収束を解析し、事例で反復回数の削減を確かめた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "電力網の最適な運用を部分に分けて解く分散計算で、部分どうしの合意を速める更新の規則を提案し、計算の反復回数を減らした。", "p3": "交互方向乗数法で解く分散型の最適潮流計算に、有限時間・固定時間の更新則を導入した。1つ目は主変数の更新で、隣り合う部分問題の合意を速める重みつきの調整を行う。2つ目は双対変数（ラグランジュ乗数）の更新で、どちらも安定性と収束を解析した（抄録）。", "p5": "事例研究で、提案の方法が反復回数を減らし、交互方向乗数法による最適潮流計算の性能を改善することを確かめた。抄録には具体的な数値は示されていない（抄録）。", "fun": "電力網の発電の割り振りをまとめて計算する代わりに、部分ごとに計算して、隣どうしの値が合うまで調整を繰り返す方法がある。問題は、その調整がまとまるまでに回数がかかることだ。この研究は、有限の時間や決まった時間でそろうように作った更新の規則を取り入れて、調整の回数を減らした。", "unverified": "反復回数の削減の大きさと、試した電力網の規模は抄録になく未確認。"}}, {"id": "jn22", "rank": 22, "field": "ヒューマンコンピュータインタラクション", "headline": "利用者による誤情報の注記は専門家の検証を代替できない", "title": "Promises and pitfalls of community moderation on social media", "url": "https://doi.org/10.1073/pnas.2518033123", "authors": "Isabelle Augenstein ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "XやMetaが導入したコミュニティノートのような利用者参加型の誤情報対策について、可能性と課題を検討した展望論文。真偽の認識は個人の偏りや政治的立場、文化に左右されるため合意が得られにくく、専門のファクトチェックを置き換えることはできないとし、両者を組み合わせる協働と技術の方向を示す。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "SNSの利用者どうしが誤情報に注記を付けるコミュニティノートのような仕組みの可能性と限界を整理し、専門家によるファクトチェックと組み合わせる方向を示した展望論文。", "p3": "XやMetaが、社内の審査や独立のファクトチェック機関との提携から、利用者参加型の仕組みへ移りつつある状況を踏まえ、大規模に運用するときの利点と課題を批判的に検討した（抄録）。", "p5": "うまく拡大し統治できれば、かつて利用者の力がスパムに効いたように誤情報にも効く可能性がある。しかし真偽の認識は個人の偏り、政治的な立場、文化に左右されるので合意が難しく、専門のファクトチェックの代わりにはならない。両者を統合する協働と技術の工夫を示す（抄録）。", "fun": "スパムは、利用者の力を集めることでうまく減らせた。同じやり方で、誤った情報も減らせるだろうか。この論文は、誤情報の判断はスパムよりずっと複雑だと指摘する。何を本当と感じるかは人の立場や文化で変わるからだ。利用者による方法と専門家が調べる方法の、どちらか一方ではなく組み合わせが要るという結論になる。", "unverified": "展望論文で、新しいデータによる検証は抄録からは確認できない。"}}, {"id": "jn23", "rank": 23, "field": "経済学", "headline": "銀行取り付けのリスクと公的な情報発信の役割", "title": "Keep calm and bank on: Bank run risks and the role of public communication", "url": "https://doi.org/10.1016/j.jfineco.2026.104417", "authors": "Damiano Sandri ほか", "venue": "Journal of Financial Economics", "date": "2026-11-23", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "題名から、銀行取り付けのリスクに対して公的なコミュニケーションが果たす役割を分析した研究と読める。Journal of Financial Economics掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、銀行の取り付けのリスクと、公的なコミュニケーションが果たす役割を扱った研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "銀行の取り付けの危険が高まったとき、公的な立場から発せられる言葉は、人々を落ち着かせることができるのだろうか。題名から読み取れるのは、言葉が金融の安定に果たす役割という問いである。", "unverified": "抄録・本文を入手できず、分析の方法、データ、結果はすべて未確認。"}}, {"id": "jn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "学際チームの成果とリーダーの性別、信頼される協力者", "title": "Leader Gender and Interdisciplinary Team Effectiveness: Why Trusted Collaborators Matter Most", "url": "https://doi.org/10.5465/amd.2026.0026", "authors": "Jessica Siegel Christian ほか", "venue": "Academy of Management Discoveries", "date": "2026-11-23", "sjr": 3.416, "citescore": 8.7, "citescore_year": "2025", "why": "題名から、リーダーの性別と学際的なチームの有効性の関係を調べ、信頼された協力者の存在が最も重要だとする研究と読める。Academy of Management Discoveries掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、リーダーの性別と学際的なチームの有効性の関係を調べ、信頼された協力者の存在が最も重要だとする研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "専門の違う人が集まるチームの成果は、リーダーの性別と関係があるのだろうか。題名は、信頼された協力者の存在が最も重要だと示唆している。どんな証拠でそう言えるのかが気になる問いだ。", "unverified": "抄録・本文を入手できず、データ、分析の方法、結果はすべて未確認。"}}, {"id": "jn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "いじめ被害の移り変わりと役割葛藤・役割の明確さ", "title": "Transitions in bullying exposure over time: A person-based analysis examining how role conflict and clarity relate to face-to-face and cyberbullying target profiles", "url": "https://doi.org/10.1080/02678373.2026.2766412", "authors": "Samuel Farley ほか", "venue": "Work & Stress", "date": "2026-11-24", "sjr": 2.762, "citescore": 15.1, "citescore_year": "2025", "why": "題名から、対面のいじめとネットいじめの被害のプロフィールが時間とともにどう移り変わるかを人を単位とする分析で調べ、役割葛藤と役割の明確さとの関係を検討した研究と読める。Work & Stress掲載。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、題名検索で見つかったOpenAlexの記録の抄録を使用", "preprint": false, "short": true, "p1": "職場のいじめの被害は、対面とネット上で別々に起きるのではなく同時に起きること、役割の葛藤と役割の明確さが被害の移り変わりに関わることを示した。", "p3": "従業員748人を6か月の間隔で2回調査し、人を単位とする方法（潜在プロファイル分析）で被害の型を分け、役割葛藤と役割の明確さが型の所属と、時間をまたぐ型の移行に関わるかを調べた（抄録）。", "p5": "被害の型は「いじめなし」「まれないじめ」「常態的ないじめ」の3つだった。役割葛藤は、まれな型と常態的な型への所属と、横断的にも時間をまたいでも関連した。役割の明確さの変化は「なし」と「まれ」の間の移行と、役割葛藤の変化は「常態的」と「まれ」の間の移動と結びついた（抄録）。", "fun": "職場のいじめは、面と向かってのものと、ネット上のものに分けて考えられがちだ。この調査では、被害にあう人は両方を同時に受けているようだった。さらに面白いのは、役割がはっきりすることはいじめの予防に、役割の葛藤が減ることはいじめの沈静化に結びつく可能性が示された点で、段階によって効く手が違うらしい。", "unverified": "抄録は題名検索で見つかったOpenAlexの記録のもので、関連の大きさを示す数値は書かれていない。"}}, {"id": "jn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "中小企業の従業員は破壊的な上司に適応・抵抗・退出で対処", "title": "How Do Employees Navigate Destructive Leadership Behaviour? A Focus on SMEs", "url": "https://doi.org/10.1111/1467-8551.70116", "authors": "Afsaneh Bagheri ほか", "venue": "British Journal of Management", "date": "2026-11-23", "sjr": 2.694, "citescore": 12.4, "citescore_year": "2025", "why": "破壊的なリーダーシップに従業員がどう応じるかを、人間関係が近く組織の支援が限られる中小企業で調べた。さまざまな中小企業の従業員26人への面接から、適応・抵抗・退出の3つの対処を見いだし、どれを選ぶかは個人的・職業的なリスクへの耐性と、状況を変えられるという力の認識で決まることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "中小企業で働く人が、破壊的な上司の振る舞いにどう対処するかを調べ、適応・抵抗・退出の3つの対処と、その選び方を決める要因を示した。", "p3": "リーダーとメンバーの交換関係（LMX）の理論に基づき、さまざまな中小企業と職務の従業員26人に半構造化面接を行い、主題分析した（抄録）。", "p5": "従業員がどの対処を選ぶかは、個人的・職業的なリスクにどこまで耐えられるかと、状況に影響を与えたり変えたりする力が自分にあると思うかの評価で決まる。この評価によって、上司の振る舞いを受け入れるか、抵抗するか、組織を去るかが分かれる（抄録）。", "fun": "小さな会社では上司との関係が近く、組織の支えも限られる。そこで破壊的な上司に出会った人はどうするのか。この研究は、適応する、抵抗する、去るの3つの道から、人が自分の負うリスクと自分の力を見積もって選んでいることを聞き取りから示した。部下は受け身の存在ではなく、状況を評価して動いている。", "unverified": "26人の面接による質的な研究で、どの対処が多いかの割合は抄録になく未確認。"}}, {"id": "jn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "自己犠牲的なリーダーはチームの協力がないと心が離れる", "title": "When Self‐Sacrifice Backfires: Resource Appraisal, Psychological Contract Breach, and Leader Psychological Withdrawal Behavior", "url": "https://doi.org/10.1111/apps.70163", "authors": "Qingxiong (Derek) Weng ほか", "venue": "Applied Psychology", "date": "2026-11-24", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "why": "自己犠牲的なリーダーシップは効果的とされるが、リーダー自身の心理的な負担は分かっていなかった。2つのシナリオ実験と3時点の現場調査（107チーム・398人）で、チームからリーダーへの組織市民行動が少ないと、自己犠牲は心理的契約の不履行の認識を高め、それがリーダーの心理的な離脱につながることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "自分を犠牲にしてチームに尽くすリーダーは、チームがそれに応えてくれないと義務が果たされていないと感じ、心が仕事から離れていくことを示した。", "p3": "資源保存理論に基づき、心理的契約の不履行を、リーダーとチームの間の義務が果たされているかについてのリーダーの評価として捉えた。2つのシナリオ実験（157人と103人）と、107チームの従業員398人の3時点の現場調査で検証した（抄録）。", "p5": "チームからリーダーへの組織市民行動が少ないと、自己犠牲的なリーダーシップは心理的契約の不履行の認識と正に関連し、多いと負に関連した。不履行の認識はリーダーの心理的な離脱と正に関連し、間接効果はチームの行動が少ないときの正から多いときの負へ移った（抄録）。", "fun": "自分を犠牲にしてチームに尽くす上司は、良いリーダーの見本とされる。でも尽くす側の心理的な負担は、あまり分かっていなかった。この研究は、チームが協力的な行動で応えてくれないと、上司の気持ちが仕事から離れていくことを実験と調査で示した。献身の結果は、周りの反応しだいで変わるという指摘が面白い。", "unverified": "効果の大きさを示す数値は抄録になく未確認。"}}, {"id": "jn28", "rank": 28, "field": "経営学", "headline": "組織を会員とする「メタ組織」の競争を5つの場で整理", "title": "Competition Within and Across Meta-Organizations: Loci of Competition in Multi-Level Organizational Architectures", "url": "https://doi.org/10.1177/26317877261504463", "authors": "Pierre Garaudel", "venue": "Organization Theory", "date": "2026-11-23", "sjr": 4.852, "citescore": 13.2, "citescore_year": "2025", "why": "会員自体が組織である「メタ組織」が広がっているが、そこでの競争はほとんど分析されてこなかった。誰と誰がどの水準で競争相手になるかを表す「競争の場」の概念を使い、メタ組織どうし、メタ組織と会員、会員どうしなど5つの場を区別する概念枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "会員自体が組織である「メタ組織」の中と間で起きる競争を、誰と誰がどの水準で競うかという「競争の場」の概念で整理する枠組みを示した。", "p3": "概念的な論文で、競争の場を、行為者が競争相手として構成され位置づけられる集計の水準と関係の構図として定義し、欧州のプロサッカーの分析を主な例に、高等教育と国際的な経済競争を補助的な例にして説明した（抄録）。", "p5": "メタ組織どうし、メタ組織と会員、メタ組織と非会員の組織、同じメタ組織の会員どうし、別のメタ組織の会員どうしという5つの競争の場を区別した。メタ組織は、競争する主体、社会的な舞台、協調と競争の仕掛け、競争の主催者などの位置を占めうる（抄録）。", "fun": "プロサッカーの世界では、クラブが集まって組織を作っている。クラブどうしは競い合うが、その組織自体もほかの組織と競い、ときには組織と会員が競い合う。この論文は、こうした「組織が集まってできた組織」では、競争が何層にも重なっていることを5つに整理した。誰が誰の競争相手なのかを数え直すだけで、見え方が変わるのが面白い。", "unverified": "概念的な枠組みの提案で、実証的な検証は抄録からは確認できない。"}}, {"id": "jn29", "rank": 29, "field": "工学", "headline": "有限要素法の手順とAMOREを機械学習で強化", "title": "Enhancing finite element procedures and AMORE with machine learning", "url": "https://doi.org/10.1016/j.compstruc.2026.108510", "authors": "Klaus-Jürgen Bathe", "venue": "Computers & Structures", "date": "2026-11-23", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "why": "題名から、有限要素法の解析手順と解析手法AMOREを機械学習で強化する研究と読める。Computers & Structures掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、有限要素法の手順と、AMOREと呼ばれる手法を、機械学習で強化する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物の変形などを計算する有限要素法の手順のどこかを、機械学習に手伝わせると、何が良くなるのだろうか。題名から読み取れるのは、長く使われてきた計算の方法と学習の技術の組み合わせという問いである。", "unverified": "抄録・本文を入手できず、機械学習をどこに使うのか、検証と結果はすべて未確認。"}}, {"id": "jn30", "rank": 30, "field": "工学", "headline": "材料の結合則から断面の破壊へ：薄肉構造の位相場定式化", "title": "From material cohesive laws to sectional fracture: A generalized cohesive phase-field formulation for thin structures", "url": "https://doi.org/10.1016/j.compstruc.2026.108548", "authors": "Jian-Ying Wu ほか", "venue": "Computers & Structures", "date": "2026-11-23", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "why": "題名から、材料の結合力則から断面レベルの破壊までを扱う、薄肉構造のための一般化した結合力型の位相場（フェーズフィールド）定式化と読める。Computers & Structures掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、材料の結合力則から断面の破壊までをつなぐ、薄肉構造のための一般化した結合力型の位相場（フェーズフィールド）の定式化を示した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "薄い構造が壊れるとき、材料の水準で働く結合力の法則と、断面全体の破壊は、どうつながるのだろうか。ひび割れを場として表す計算の方法で、その2つの水準を橋渡しできるのか、というのが題名から読み取れる問いだ。", "unverified": "抄録・本文を入手できず、定式化の内容、検証、結果はすべて未確認。"}}, {"id": "jn31", "rank": 31, "field": "工学", "headline": "1対1内部共振の非線形減衰を導出し振動実験で検証", "title": "Nonlinear damping for one-to-one internal resonance: derivation and nonlinear vibration experiments", "url": "https://doi.org/10.1016/j.ymssp.2026.115226", "authors": "Marco Amabili", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-23", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "題名から、1対1の内部共振における非線形減衰を導出し、非線形振動の実験を行った研究と読める。Mechanical Systems and Signal Processing掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、1対1の内部共振における非線形の減衰を導出し、非線形振動の実験を行った研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "1対1の内部共振という、2つの揺れが影響し合う状況で、揺れが収まっていく性質（減衰）は非線形にどう表せるのだろうか。理論で導いた式を振動の実験と突き合わせるという、題名から読み取れる筋道が興味を引く。", "unverified": "抄録・本文を入手できず、導出の内容、実験の対象、結果はすべて未確認。"}}, {"id": "jn32", "rank": 32, "field": "工学", "headline": "整合場処理で圧力管路のパラメータを逆推定", "title": "Parameter inversion in pressurized pipelines using matched-field processing", "url": "https://doi.org/10.1016/j.ymssp.2026.115238", "authors": "Can Xu ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-23", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "題名から、整合場処理（matched-field processing）を使って圧力管路のパラメータを逆推定する研究と読める。Mechanical Systems and Signal Processing掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、整合場処理（matched-field processing）を使って、圧力のかかった管路のパラメータを逆推定する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "圧力のかかった管路の性質を、測定から逆向きに割り出したい。測った信号と、モデルが予想する信号を突き合わせて、よく合う条件を探すという考え方で、管路のパラメータを推定できるのだろうか。題名から読み取れるのは、その照合による逆推定という問いである。", "unverified": "抄録・本文を入手できず、推定するパラメータ、検証、結果はすべて未確認。"}}, {"id": "jn33", "rank": 33, "field": "工学", "headline": "鉄筋コンクリートの腐食とひび割れを20年の暴露で追跡", "title": "Variability of corrosion and corrosion-induced cracking in reinforced concrete: A 20-year natural exposure study", "url": "https://doi.org/10.1016/j.cemconres.2026.108464", "authors": "Filipe Pedrosa ほか", "venue": "Cement and Concrete Research", "date": "2026-11-23", "sjr": 6.233, "citescore": 25.9, "citescore_year": "2025", "why": "題名から、自然環境に20年間暴露した鉄筋コンクリートの腐食と、腐食によるひび割れのばらつきを調べた研究と読める。Cement and Concrete Research掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、鉄筋コンクリートを自然の環境に20年間さらし、腐食と、腐食によるひび割れのばらつきを調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "鉄筋コンクリートの腐食と、それによるひび割れは、どれくらいばらつくのだろうか。20年という長い時間をかけて自然の環境で観察し続けたからこそ答えられる問いだと、題名から読み取れる。", "unverified": "抄録・本文を入手できず、試験体、環境、結果はすべて未確認。"}}, {"id": "jn34", "rank": 34, "field": "工学", "headline": "ポー川の堤防4 kmを地震探査と電気探査で同時に計測", "title": "Dataset of a 4 km combined seismic and electric streamer survey along the embankment of the Po river in Crescentino", "url": "https://doi.org/10.5194/essd-18-8783-2026", "authors": "Cesare Comina ほか", "venue": "Earth System Science Data", "date": "2026-11-23", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "河川堤防の調査で、土の骨格の性質を示す地震探査と、間隙の流体の性質を示す電気探査を、牽引式のストリーマーで同時に行ったイタリア・クレシェンティーノのポー川堤防4 kmのデータセット。長い区間の調査への適用を示し、大量のデータに合わせた処理法の開発に使える。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "川の堤防を掘らずに調べる方法として、地震探査と電気探査を牽引式のケーブルで同時に行う調査の、4 kmにわたるデータセットを公開した。", "p3": "電気探査は間隙の流体の性質、地震探査は土の骨格の性質についての情報を与え、互いに補い合う。イタリア北西部のトリノ近郊、クレシェンティーノのポー川の堤防で、両方のストリーマーを組み合わせた調査を行い、取得の方法と予備的な分析を報告した（抄録）。", "p5": "調査は、組み合わせたストリーマーの効率と可能性を示した。取得した全ての物理探査のデータを、地盤・地形・気象の補足情報とともに構造化したデータセットとして公開し、処理と解釈の方法を試し比べる場として使えるとする（抄録）。", "fun": "堤防の状態は、通常の地盤の試験だけでなく、掘らない方法でも調べたい。この研究は、地震探査と電気探査の両方のケーブルを引いて、4 kmの区間を調べた。地震探査は土の骨格を、電気探査は間隙の流体を教えてくれるので、2つは補い合う。集めたデータを公開し、ほかの人が処理の方法を試せるようにしたところも面白い。", "unverified": "調査で見つかった異常の具体的な内容は抄録になく未確認。"}}, {"id": "jn35", "rank": 35, "field": "工学", "headline": "送電線の風による微振動で発電しながら振動も抑える", "title": "Broadband Aeolian Vibration Harvesting and Electrical‐Damping‐Induced Suppression via Triboelectric‐Electromagnetic Coupling Mechanism", "url": "https://doi.org/10.1002/aenm.71861", "authors": "Baichuan Leng ほか", "venue": "Advanced Energy Materials", "date": "2026-11-23", "sjr": 7.677, "citescore": 39.9, "citescore_year": "2025", "why": "架空送電線では、センサの電源不足と風による微振動（エオリアン振動）の疲労が課題である。摩擦帯電型と電磁型の発電機を組み合わせた装置で、5〜50 Hzの全域で47 µFのコンデンサを5.2 Vまで充電でき（最大出力287.28 mW）、発電に伴う電気的な減衰が振動も抑えることを実験で示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "架空送電線の風による微振動から電気を取り出しながら、その振動自体も抑える装置を作り、センサーの電源不足と疲労の2つの問題を同時に扱えることを示した。", "p3": "摩擦帯電型の発電機と電磁型の発電機を組み合わせ、周波数の面で補い合う特性と、エネルギー変換のときに生じる電気的な減衰を利用する摩擦帯電-電磁の結合装置を開発した（抄録）。", "p5": "5〜50 Hzのどの周波数でも47 µFのコンデンサを5.2 Vの供給のしきい値まで安定して充電でき、最大出力は287.28 mWに達した。電気的な減衰は、30 Hzの加振のもとで主構造の振動の加速度を86%減らした（抄録）。", "fun": "送電線は風による微振動で疲労し、一方で送電線のセンサーは電源の不足に困っている。この研究は、振動のエネルギーを電気に変える過程で生じる電気的な減衰に目をつけた。困りものの振動を電源に変え、同時に振動も抑えるという一石二鳥の発想が面白く、30 Hzの加振では加速度が86%減った。", "unverified": "実際の送電線での長期の試験は抄録からは確認できない。"}}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "LLMとロボットの閉ループで高エントロピー触媒を設計", "title": "Autonomous AI-Robotics Design of High-Entropy Catalysts for the Urea Oxidation Reaction", "url": "https://doi.org/10.1021/jacs.6c19432", "authors": "Yan Huang ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-23", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "文献の検索に基づく知識の抽出、理論を取り入れた機械学習、信頼性を考慮した組成の絞り込み、ロボットによる高速実験をつないだ自律的な閉ループで、尿素酸化反応の高エントロピー触媒を探索した。LLMは候補の生成と証拠の評価に使い、人の判断は問題設定などに組み込む。ロボットで検証した40組成から最良の組成を特定した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "組み合わせが膨大な高エントロピー触媒の探索を、文献からの知識の抽出、機械学習、ロボットによる実験をつないだ自律的な閉ループで行い、高性能な組成を見つけた。", "p3": "LLMを、構造化した証拠の評価の枠組みの中で、意味の推論と検索に基づく候補の生成に使い、人の科学的な判断は問題設定、手順の較正、実験の優先順位づけに組み込んだ。理論と実験を合わせたモデルと、適用範囲・不確実性の分析で、5成分の組成の空間を絞り込んだ（抄録）。", "p5": "性能と信頼性で優先した40の組成をロボットで検証し、最良の組成を特定した。この組成は10 mA cm–2で1.371 Vという低い尿素酸化反応の電位を示し、フローセルでは0.5 A cm–2で300時間安定して動作した（抄録）。", "fun": "5種類の成分をどんな割合で混ぜれば良い触媒になるか。組み合わせが膨大で、試行錯誤では探しきれない。この研究は、文献から候補を考える役をAIに、実際に作って測る役をロボットに任せ、つながった循環にした。人は問いの立て方や優先順位を決める役を担うという分業の姿が面白い。", "unverified": "人の関与なしでどこまで自律的に動くのか、探索にかかった時間は抄録からは分からず未確認。"}}, {"id": "jn37", "rank": 37, "field": "機械学習", "headline": "時系列を記号に変えて小型言語モデルで予測", "title": "From Numbers to Prompts: A Cognitive Symbolic Transition Mechanism for Lightweight Time-Series Forecasting", "url": "https://doi.org/10.1145/3871069", "authors": "Namkyung Yoon ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-11-24", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "why": "LLMによる時系列予測は計算資源が大きい。連続値を量子化して記号の列に変え、記号の遷移で時間的な動きを表してプロンプトに入れる仕組み（STM）を提案した。言語モデル本体は変えず、4つの小型モデルと6つのデータセットで、評価した方法の中で最小の平均NMAE 0.540を得た。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "時系列の数値を記号の列に変えてプロンプトに入れることで、小さな言語モデルでも時系列の予測の精度を上げられる仕組みを示した。", "p3": "記号遷移の仕組み（STM）は、連続した時系列の値を、人の認知の構造に着想を得た量子化で記号に変え、記号の変化の並びで時間的な動きを捉える。言語モデルの本体は変えず、パラメータの当てはめも要らない。凍結した4つの小型言語モデルと6つの時系列データで評価した（抄録）。", "p5": "評価した方法の中で最小の平均NMAE 0.540を得て、6つの基準のうち4つに対して統計的に有意な差があった（補正後のp値はすべて0.015未満）（抄録）。", "fun": "言葉を扱うAIに数字をそのまま並べて見せるより、数字を記号に置き換え、その移り変わりも記号で伝えたほうが、うまく予測できるのではないか。この研究はその考えを試した。人が数の並びを「上がっている」「下がっている」とまとめてとらえるのに似たやり方で、小さなAIでも予測がうまくなったという。", "unverified": "6つのデータセットの名前と、大きな言語モデルとの比較は抄録からは分からず未確認。"}}, {"id": "jn38", "rank": 38, "field": "政治学", "headline": "デリーの水道補助金の受給資格の改革への市民の選好", "title": "Assessing public preferences for reforming water subsidy eligibility rules in Delhi", "url": "https://doi.org/10.1038/s44284-026-00546-5", "authors": "Saumitra Sinha ほか", "venue": "Nature Cities", "date": "2026-11-23", "why": "題名から、インド・デリーの水道補助金の受給資格のルールを改める案に対する市民の選好を調べた研究と読める。Nature Cities掲載。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、インドのデリーで、水道の補助金の受給資格のルールを改めることに対する市民の選好を調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "水道の補助金は、誰に、どんな条件で配るべきか。受給資格のルールを変えるとしたら、市民はどんな変え方を望むのだろうか。その選好を確かめようとした研究だと、題名から読み取れる。", "unverified": "抄録・本文を入手できず、調査の方法、対象、結果はすべて未確認。"}}, {"id": "jn39", "rank": 39, "field": "ヒューマンコンピュータインタラクション", "headline": "人はChatGPTを心の健康の自己管理に転用している", "title": "Leveraging ChatGPT as a tool to self-manage psychological well-being: an affordance perspective", "url": "https://doi.org/10.1108/intr-08-2025-1260", "authors": "Polina Durneva ほか", "venue": "Internet Research", "date": "2026-11-23", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "why": "汎用のLLMを心の健康の自己管理に使う人20人への半構造化面接を、アフォーダンス理論とグラウンデッド・セオリーで分析した。利用者は周囲の影響・試行・過去の経験から使い道を学び、理解が進むにつれてさまざまなアフォーダンスを実現するが、転用の際の障壁にも直面する。LLMチャットボットの設計指針を提案する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "汎用のLLM（ChatGPT）を心の健康の自己管理に使う人が、その使い道をどう見つけ、どう使いこなし、何につまずくかを示した。", "p3": "アフォーダンス理論に基づき、20人の参加者に半構造化面接を行い、心の健康のためのChatGPTの利用をグラウンデッド・セオリーの手法で分析した（抄録）。", "p5": "利用者は、外からの影響、試行、過去の経験を通じてChatGPTの可能性を知った。理解が進むにつれてさまざまなアフォーダンスを実現したが、道具を心の健康のために転用するときの障壁にも出会った。LLMを使うチャットボットの設計指針を提案する（抄録）。", "fun": "ChatGPTは汎用の道具で、心の健康の自己管理はもともとの使い道とは限らない。それでも、そのために使う人がいる。この研究は、そういう人たちがどうやって使い道に気づき、理解を深めていったかを聞き取った。使う人が道具を別の目的に転用していく過程と、そこで出会う壁を描いた点が面白い。", "unverified": "20人の面接による質的な研究で、利用が心の健康を実際に改善したかは抄録からは分からない。"}}, {"id": "jn40", "rank": 40, "field": "ヒューマンコンピュータインタラクション", "headline": "生成AIの個別フィードバックで学習の動機を保つ", "title": "Performance, Perceptions and Productive Behaviors in Generative AI-Supported Personalized Game-Based Cybersecurity Learning: A Sustained Motivation-Enhanced Learning Framework", "url": "https://doi.org/10.1177/07356331261504306", "authors": "Jian-Wen Fang ほか", "venue": "Journal of Educational Computing Research", "date": "2026-11-23", "sjr": 2.457, "citescore": 14.8, "citescore_year": "2025", "why": "サイバーセキュリティ教育のゲームで、固定的なフィードバックは学習者の自律性・有能感・関係性の欲求を満たしにくい。自己決定理論などに基づき、動機づけを高める生成AIの個別フィードバックを提案し、中学校の授業での準実験で効果を検証した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "サイバーセキュリティを学ぶゲームに、動機づけを高める工夫を組み込んだ生成AIの個別フィードバックを入れ、成績・意識・学習の動機を高めた。", "p3": "目標・利用しやすさ・フィードバック・挑戦・協働のモデルと自己決定理論に基づき、動機づけを高める生成AIの個別フィードバックの方法を提案し、中学校のサイバーセキュリティの授業での準実験で効果を調べた（抄録）。", "p5": "提案の方法は、生徒の学習成績、意識、学習の動機を有意に高めた。行動の分析では、実験群は助言を求める行動と学習に戻る行動が多く、統制群は直接の答えを求める型に頼ることが多かった（抄録）。", "fun": "学習用のゲームのフィードバックが固定的だと、自分で決めたい、できるようになりたい、つながりたいという気持ちに応えにくい。この研究は、動機づけを高める工夫を入れたAIの個別フィードバックを試した。すると生徒は、直接の答えを求めるより助言を求めるようになった。AIの返事のしかたで、学ぶ側のふるまいが変わるのが面白い。", "unverified": "参加した生徒の数と、効果の大きさを示す数値は抄録になく未確認。"}}, {"id": "jn41", "rank": 41, "field": "エネルギー・材料", "headline": "界面に凹凸をつけ全固体電池の放電時の空隙を抑える", "title": "Contouring mitigates voiding at the lithium/ceramic electrolyte interface on discharging solid-state batteries", "url": "https://doi.org/10.1038/s41560-026-02172-w", "authors": "Shengming Zhang ほか", "venue": "Nature Energy", "date": "2026-11-23", "sjr": 20.769, "citescore": 78.4, "citescore_year": "2025", "why": "リチウム金属の全固体電池では、放電時に界面に空隙ができることが性能を制限する。リチウムと硫化物固体電解質の界面に卵パック状の凹凸をつけると、空隙ができ始める放電電流が0.2から2 mA/cm²へ10倍に上がり（2 MPa、30 °C）、実際の電気自動車の走行を模した放電にも耐えることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "リチウム金属を使う全固体電池で、リチウムと固体電解質の境目に凹凸の形をつけるだけで、放電のときにできる空隙を抑え、実用的な電流で放電できるようにした。", "p3": "リチウムと硫化物系の固体電解質の界面に、卵パックのような凹凸の形を導入し、空隙ができ始める放電電流や、パルス電流、実際の電気自動車の走行に基づく放電の条件で、平らな界面と比べた（抄録）。", "p5": "空隙ができ始める放電電流は、2 MPa・30 °Cで0.2から2 mA cm−2へ十倍になった。凹凸のある界面は、30 °Cで3 mA cm−2、60 °Cで8 mA cm−2までのパルス電流に故障なく耐えた。空隙を完全になくすわけではないが、成長と電圧の分極を抑える（抄録）。", "fun": "リチウム金属の全固体電池は、放電のときにリチウムと電解質の境目に空隙ができ、性能が制限されるのが弱点だ。この研究は、境目を卵パックのようなでこぼこの形にした。それだけで、空隙ができ始める電流が十倍になった。境目の形を工夫するという方法で、実用に近い放電の速さを実現したところが面白い。", "unverified": "長期の充放電の繰り返しでの耐久性は抄録からは分からず未確認。"}}, {"id": "jn42", "rank": 42, "field": "地球科学", "headline": "北大西洋の循環が弱まると北太平洋の酸素は増えた", "title": "Last glacial North Pacific oxygenation due to North Atlantic circulation changes", "url": "https://doi.org/10.1038/s41561-026-02122-x", "authors": "Martin Tetard ほか", "venue": "Nature Geoscience", "date": "2026-11-23", "sjr": 6.141, "citescore": 27.3, "citescore_year": "2025", "why": "海洋の貧酸素域は温暖化で広がると予想されるが、その大きさは不確かである。11本の堆積物コアの有孔虫群集2,569件から、過去5.5万年の亜寒帯・東部北太平洋の貧酸素域の変化を定量的に復元した。温暖化の時期に拡大した一方、北大西洋の循環が弱まった時期には再び酸素が増えて縮小していた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "海の中で酸素が極端に少ない水域（貧酸素域）が、過去5.5万年の気候の変動に合わせてどう広がり縮んだかを北太平洋で復元し、北大西洋の循環の変化と結びついていたことを示した。", "p3": "11本の堆積物コアの有孔虫の群集の測定2,569件から、亜寒帯と東部の北太平洋の貧酸素域の変化を、空間と時間の両方について定量的に復元し、地球システムのシミュレーションと照らし合わせた（抄録）。", "p5": "東部北太平洋の貧酸素域は、最終氷期の温暖化の時期と最終退氷期に拡大した。一方、北大西洋の循環が弱まった時期には、再び酸素が増えて縮小した。将来の貧酸素域の応答は複雑で、地球規模の循環の変化が温暖化の直接の影響を和らげる可能性がある（抄録）。", "fun": "海には酸素がひどく少ない水域があり、温暖化で広がると予想されている。この研究は、海底の堆積物に残った有孔虫を手がかりに、過去5.5万年の広がり方を復元した。面白いのは、北太平洋の酸素が、遠く離れた北大西洋の循環の強さと結びついていたことで、海がつながって動いていることが分かる。", "unverified": "酸素の濃度の変化の大きさを示す数値は抄録になく未確認。"}}, {"id": "jn43", "rank": 43, "field": "考古学", "headline": "幅広い食性は欠乏ではなく不確実な環境への適応", "title": "Rethinking broad diet breadth as a sign of scarcity: A 50,000-y record of subsistence from northwestern Australia", "url": "https://doi.org/10.1073/pnas.2619837123", "authors": "Tiina Manne ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "更新世の食性の復元に使われる獲物選択モデルは、人はまず少数の高順位の獲物に集中し、必要に迫られて対象を広げると予測する。オーストラリア北西部の5万年の動物遺存体の記録では、幅広い食性が早くから確立して続いており、これは資源の欠乏ではなく、雨の予測できない環境で多様な獲物を使い分ける戦略だと論じる。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "先史時代の人々が多くの種類の獲物を食べていたことは食料が乏しかった証拠だとされてきたが、オーストラリア北部では、それが不確実な環境への理想的な戦略だったことを示した。", "p3": "更新世の食性の復元に広く使われる獲物選択モデルの予測を、オーストラリア北部の乾燥・半乾燥地域の考古学的な動物の記録（題名によれば5万年の記録）と突き合わせた（抄録）。", "p5": "幅広い食性は早い時期に確立し、完新世を通じて続いた。著者は、これは資源の欠乏ではなく、雨の予測できない環境で、数が多く危険の少ない隠れた獲物と、危険が大きく目立つ獲物の両方を利用する理想的な戦略だと論じる。固定した獲物の順位という考え方の見直しが要る（抄録）。", "fun": "人はまず順位の高い獲物をねらい、必要に迫られると順位の低い獲物にも手を広げる。考古学ではそう考え、幅広い食性を欠乏のしるしと読んできた。この研究は長い期間の記録から、最初から幅広く食べるのが理想的な場所もあったと論じる。雨がいつ降るか分からない土地では、柔軟に獲物を変えることが強みになる。", "unverified": "遺跡の数や動物遺存体の量は抄録になく未確認。"}}, {"id": "jn44", "rank": 44, "field": "環境科学", "headline": "デリー周辺では農村のPM2.5が都市より約2割高い", "title": "Rural outdoor air pollution exceeds urban levels in the Delhi megacity region", "url": "https://doi.org/10.1073/pnas.2526851123", "authors": "Mark Joseph Campmier ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "インドの大気汚染対策は大都市に集中してきた。デリーの内外の人口密度の違う49地点に較正した低価格センサの網を置き、2024年7〜11月の5か月を測ったところ、農村のPM2.5濃度は調査期間のどの月も都市より約20%高かった。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "インドのデリー周辺では、都市よりも農村のほうが微小粒子状物質（PM2.5）の濃度が高いことを、観測網で示した。", "p3": "よく較正した低価格のPM2.5センサーの網を、人口密度が300〜30,000人/km2と大きく違うデリーの内外の49地点に置き、160 kmの測定の横断線も含めて、2024年の5か月を観測した（抄録）。", "p5": "農村の地点のPM2.5濃度は、調査期間のどの月も都市の地点を約20%上回った。農村では朝（およそ06:00〜10:00）と夕方（およそ16:00〜20:00）に鋭い濃度の山があり、都市にはなかった。著者は調理・暖房・小規模な産業での固形燃料の使用が原因だとする（抄録）。", "fun": "空気が汚れているのは大都市だ、と思いがちだ。ところがデリーとその周りの49か所で測ると、農村のほうが都市より約20%も濃度が高かった。とくに朝と夕方に濃度が跳ね上がり、著者は調理や暖房に使う固形燃料が原因だと考えている。人工衛星の観測では見逃されていた事実で、世間の思い込みをくつがえす。", "unverified": "センサーの較正の方法と測定の不確かさは抄録からは分からず未確認。"}}, {"id": "jn45", "rank": 45, "field": "地球科学", "headline": "19世紀からの海洋貯熱量を古い観測の品質管理で推定", "title": "Historical Nansen cast temperature profiles and the ocean heat content changes since 19th century", "url": "https://doi.org/10.5194/essd-18-8693-2026", "authors": "Viktor Gouretski ほか", "venue": "Earth System Science Data", "date": "2026-11-23", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "海洋貯熱量の時系列の多くは1950年代に始まる。それ以前から蓄積されていたナンセン採水器による水温の鉛直分布を、自動・手動・偏差の3段階で品質管理し、1990〜2025年の高品質な気候値を基準にして、海洋貯熱量の推定をさかのぼるためのデータを整備した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "1950年代より前の古い水温の観測を品質管理して使えるようにし、海がためこんだ熱の量の変化を1870年代までさかのぼって推定した。", "p3": "ナンセン採水器による水温の鉛直分布について、自動と手動の点検、水温の偏差の点検の3段階の品質管理を行い、1990〜2025年の高品質な観測に基づく気候値を基準にした。鉛直方向の内挿には水温偏差の方法を使い、深さの偏りの補正も提案した（抄録）。", "p5": "1870年代から2020年代までの6つの期間で海洋貯熱量の変化を推定した。0〜2000 mの層で、1920–1944年から1945–1969年への増加は、1920–1944年から2010–2025年への増加全体の32.7±6.8%（元の分布）または37.5±3.8%（深さ補正後）に当たる（抄録）。", "fun": "海がためこむ熱の量の記録は、多くが1950年代から始まる。でもそれより前にも、水温を測った記録がたくさん残っている。この研究は、その古い記録を点検して使えるようにした。すると、海の熱の増加のうち3割あまりが、1920–1944年から1945–1969年にか   var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
