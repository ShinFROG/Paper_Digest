: "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多色に塗り分けた粒子を使い、密な粒状流でも粒子を取り違えずに追跡できる学習不要の手法CBTVを示した。", "p3": "隣接する色つき粒子の「星座」を、相互相関で得た運動の事前推定に導かれて一括で対応づけ、その後に残りの粒子を個別に割り当てる多段階法（抄録）。", "p5": "厳密な正解のある15のDEM模擬流れ・59事例（1フレームあたり0.006〜9粒径）で12種の追跡器と比較し、衝撃的な衝突では全ての変位で最良以上。粒子が間隔の約0.5〜2倍動く密な流れで優位で、2〜3粒径を超えると全体運動を補正する追跡器が勝る（抄録）。", "fun": "砂粒の流れを高速カメラで追うとき、粒が一度に隣の粒の位置まで動くと「どれがどれだったか」が分からなくなる。この研究は粒にいくつかの色を塗り、近所の色の並び（星座）ごと見つけることで、超高速カメラなしでも見失わないようにした。パズルのピースを1個ずつでなく模様のまとまりで探すのと同じ発想である。", "unverified": "色の種類数と、実験（模擬でない）での検証の有無は抄録から不明。"}}, {"id": "pr18", "rank": 18, "headline": "高次元シミュレータのベイズ代理モデルを総覧", "title": "A Review of Bayesian Surrogate Modeling for High-Dimensional Computer Simulations", "url": "https://arxiv.org/abs/2610.31870", "authors": "Gavin Collins ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Collins, G., Huerta, G., Tucker, J. D., & Rumsey, K. (2026). A Review of Bayesian Surrogate Modeling for High-Dimensional Computer Simulations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31870", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "計算の重い物理シミュレータの不確実性評価に使うベイズ代理モデルを、高次元出力への対応まで含めて総覧した。", "p3": "ガウス過程（スケーラブルな近似を含む）と、多項式カオス展開・ベイズMARS・ベイズ射影追跡回帰・BARTなどのベイズ基底関数回帰の2系統を整理し、低次元表現による出力の次元削減を扱う（抄録）。", "p5": "順方向の不確実性定量化、大域感度解析、ベイズ較正への応用と、模擬・実データでの実務的な手順を示し、方法選択・計算量・予測精度・UQの忠実さを未解決課題に挙げる（抄録）。", "fun": "本物のシミュレーションは1回に何時間もかかるので、何千回も回して「どれくらい不確かか」を調べるのは無理がある。そこで代わりに素早く答えを出す「代理」の統計モデルを作る。この総説は、その代理の作り方を2つの流儀に整理し、出力が何千もの数値になるときの工夫までまとめた案内図である。", "unverified": "実データの内容と手法間の比較結果は抄録に記載がなく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "AIが操作するGPU個別要素法を動的流れで検証", "title": "Granum, an agentic-AI GPU discrete element program: verification for dynamic granular flows", "url": "https://doi.org/10.5281/zenodo.23666311", "authors": "Youwai, Sompote", "venue": "Zenodo", "date": "2026-10-26", "apa": "Youwai, S. (2026). Granum, an agentic-AI GPU discrete element program: verification for dynamic granular flows. Zenodo. https://doi.org/10.5281/ZENODO.23666311", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodo版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIエージェントが操作できるGPU個別要素法プログラムGranumを動的な粒状流に拡張し、接触・ベンチマーク・実験則の3段階で検証した。", "p3": "ホッパー・サイロ壁、回転ドラム、自由落下する剛体などを追加し、Chung–Ooiの衝突基準、9つの公開コードによるDEM8ベンチマーク、Beverloo則や粒状柱崩壊の実験則と比べた（抄録）。", "p5": "衝突はHertz解の0.1%以内、サイロ流量はコード帯の中央から0.7〜1.9%以内、オリフィス比3.10（基準3.10±0.06）、Beverloo則のC=0.54・k=1.51、鋼球の貫入はUeharaらの則の0.72〜0.94倍。固定端板の制動効果など3つの欠陥も見つけて修正した（抄録）。", "fun": "砂時計の砂がどれくらいの速さで落ちるかには「Beverloo則」という経験式がある。この研究は、AIが指示して動かせる粒のシミュレータが、その式や他の有名な実験とどれだけ合うかを一つずつ確かめ、合わなかった場所（バグ）も隠さず報告した。自分の道具を疑って試験する姿勢がそのまま論文になっている。", "unverified": "検証に使った粒子数や計算時間は抄録に記載なし。"}}, {"id": "pr20", "rank": 20, "headline": "物理拘束ニューラル作用素で貯留層の履歴整合", "title": "Autoregressive Physics-Informed Neural Operator Surrogates and Joint 4-D Seismic-Production Bayesian History Matching", "url": "https://arxiv.org/abs/2610.31677", "authors": "Clement Etienam ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Etienam, C., Blom, D., Pattathil, H., Onishi, T., Sethi, H., Vincent, L., Pawar, S., Kumar, K. R., Devarakota, P., & Alpak, F. O. (2026). Autoregressive Physics-Informed Neural Operator Surrogates and Joint 4-D Seismic-Production Bayesian History Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31677", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "物理拘束つきニューラル作用素を代理モデルにして、生産データと4D地震探査を同時に同化するベイズ履歴整合を1 GPU時間以内で行えるようにした。", "p3": "フーリエニューラル作用素を黒油方程式の残差を罰則として閉ループで学習し、適応正則化アンサンブルカルマン逆解析とES-MDAで同化する。未知場は切断コサイン変換またはVAEの低次元チャートで表し、データが拘束しない方向を最初から削る（抄録）。", "p5": "10万セル超の合成モデルで、1回のロールアウトが0.579秒（約2500倍の高速化）、190メンバー・10反復の同時逆解析が1 GPU時間に収まる。ロールアウト誤差の上界と物理罰則による縮約性も示した（抄録）。", "fun": "地下の油層の性質を、井戸の生産量と地震波の変化から逆算するのは、数十万のマスの値を少ないデータで当てる難問である。この研究は、物理法則を学んだAIを「超高速の代用シミュレータ」にし、さらに未知数を少ない座標で表すことで、当てようのない方向を探さないようにした。", "unverified": "比較対象との精度の差は抄録に数値がなく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "能動粒子が実空間でローレンツ型アトラクタを描く", "title": "Chaos Made Visible: Active particles trace Lorenz-like attractors in physical space", "url": "https://arxiv.org/abs/2610.32640", "authors": "Rahil N. Valani ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Valani, R. N., Tiwari, E., & Roy, A. (2026). Chaos Made Visible: Active particles trace Lorenz-like attractors in physical space (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32640", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "向きを持つ自己推進粒子が、定常な2次元多渦流れの中で、実空間にローレンツ型のカオスアトラクタを描くことを示した。", "p3": "粒子の位置と向きの連成で3次元の非線形力学系ができることを利用し、形状と遊泳速度を変えて軌道を調べる（抄録）。", "p5": "適切な条件で軌道が二葉の幾何に組織化し、構造のある初回帰写像、正の最大リアプノフ指数、広帯域スペクトルからカオスを確認。遊泳速度を変えると多様な力学的領域が現れる（抄録）。", "fun": "カオスの代名詞「ローレンツの蝶」は、ふつう数式の中の抽象的な空間にしか現れない。この研究は、水流の中を自分で泳ぐ小さな粒が、流れ自体は時間で変わらないのに、進む向きという1つの自由度が加わるだけで、実際の空間に蝶の形の軌道を描くことを示した。見えないはずのものが見えるという転換が面白い。", "unverified": "実験か数値計算かの別と、粒子の具体的な形状は抄録から判断できず未確認。"}}, {"id": "pr22", "rank": 22, "headline": "粘性散逸が超せん断き裂の安定伝播を可能に", "title": "Viscous Dissipation Stabilizes Steady Supershear Crack Propagation", "url": "https://doi.org/10.2139/ssrn.7669892", "authors": "Tsung-Yuan Lu ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Lu, T.-Y., & Chen, C.-H. (2026). Viscous Dissipation Stabilizes Steady Supershear Crack Propagation. https://doi.org/10.2139/ssrn.7669892", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "粘性散逸だけで、せん断波速度を超える速さで進む引張き裂が安定に伝播しうることを有限要素解析で示した。", "p3": "平面応力のKelvin–Voigt固体（線形弾性応答）で定常き裂伝播を計算し、最大周応力の向きとエネルギーの流れを調べる（抄録）。", "p5": "弾性極限ではYoffe不安定に合う速度で最大周応力がき裂面から外れるが、十分な粘性があると超せん断域でも進行方向に揃う。高速では放出エネルギーの大半が体積で散逸し、遠方のエネルギー解放率が先端への流束を最大1桁上回る。超せん断き裂は楔形の開口と鋭いMach前面を示す（抄録）。", "fun": "教科書では、割れ目が進む速さには「レイリー波の速さ」という上限があり、その7割ほどで割れ目はふらつき始めるとされる。ところがゴムやゲルでは音より速い割れが観察されていた。この研究は、材料のねばり（粘性）がエネルギーを吸い取ることで割れ目がまっすぐ進み続けられると示し、超音速の割れが衝撃波のような前面を作ることも描いた。", "unverified": "安定化に必要な粘性の閾値や解析条件の数値は抄録に記載なし。"}}, {"id": "pr23", "rank": 23, "headline": "1980年代以降の土石流活動の増大を湖底記録で復元", "title": "Massive debris flow activity and connectivity shift in the 1980s deciphered by combined terrestrial and lacustrine record in a changing climate", "url": "https://doi.org/10.5194/egusphere-2026-4303", "authors": "Natalie Barbosa ほか", "venue": "EGUsphere", "date": "2026-10-25", "apa": "Barbosa, N., Kiefer, C., Jubanski, J., Siegert, F., Strasser, M., & Krautblatter, M. (2026). Massive debris flow activity and connectivity shift in the 1980s deciphered by combined terrestrial and lacustrine record in a changing climate. https://doi.org/10.5194/egusphere-2026-4303", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphere（査読前の公開原稿）の抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1952〜2020年の空中写真と湖底堆積物を突き合わせ、アルプスの湖に流入する54の土石流扇状地の土砂移動を数十年単位で定量した。", "p3": "歴史的な空中写真に写真測量を適用して扇状地ごとの侵食・堆積量を出し、湖の堆積記録と「源から沈み場まで」の枠組みで照合する。降雨強度の変化も解析した（抄録）。", "p5": "21の渓流が湖に接続。1980年以降、土石流を起こしうる強雨（10 mm/h超）の日数が36%増、侵食量が12%増、接続扇状地の堆積量が47%減。湖底記録からの土石流量3.69±0.42×10^5 m^3（1952〜2018年）と、扇状地からの移動量3.42±0.43×10^5 m^3（過去70年）が初めて直接一致した（抄録）。", "fun": "山の土砂がどれだけ湖に流れ込んだかを、山側（古い航空写真の地形変化）と湖側（湖底に積もった泥の層）の両方から別々に計算し、ほぼ同じ量になった。帳簿の出金と入金が合うように70年分の土砂の収支が合ったわけで、気候の変化で土石流が増えたという話に強い裏づけを与えている。", "unverified": "誤差の算定法と写真測量の精度は抄録に記載なし。"}}, {"id": "pr24", "rank": 24, "headline": "橋梁SHM解析の省エネ自動スケーリング", "title": "Energy-Aware Autoscaling of Distributed Structural Health Monitoring Services Under Variable Workloads", "url": "https://doi.org/10.2139/ssrn.7664179", "authors": "Dai Teng ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Teng, D., & Zhang, S. (2026). Energy-Aware Autoscaling of Distributed Structural Health Monitoring Services Under Variable Workloads. https://doi.org/10.2139/ssrn.7664179", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "橋梁群のSHM解析基盤で、緊急の事象記録と締切つきの常時微動モード解析を両立させつつ消費電力を減らす自動スケーリングEASEを示した。", "p3": "センサ到着率による待ち行列のフィードフォワード、締切に基づく最早締切優先の処理率、観測遅延による補正、サーバ電力状態の損益分岐時間による電源断の4つの信号で規模を決める。Z24橋の記録に対する周波数領域分解と確率部分空間同定の実処理で需要を測った（抄録）。", "p5": "1日約1,250万ジョブの24時間シナリオで、Kubernetes HPAなど6基準の最良より4.7〜6.7%、同期アップロード時は20.3%少ない電力で、事象記録の99パーセンタイル遅延を0.71秒未満（目標2秒）に保ち全締切を満たした。利用率に基づく推定は節約を最大52ポイント過大評価する（抄録）。", "fun": "橋のセンサは、車が多い時間や地震の直後にデータを一斉に送ってくる。サーバを常に多めに動かせば安心だが電気の無駄で、少なすぎると急ぎの判定が遅れる。この研究は「急ぎの仕事は待ち時間で、後回しでよい仕事は締切で」管理し、空いた隙間に後者を詰め込むことで、電力を減らしつつ遅れも出さない仕組みを作った。", "unverified": "基準手法の設定と電力計測の条件は抄録の範囲でしか確認できていない。"}}, {"id": "pr25", "rank": 25, "headline": "1次元畳み込み自己符号化器で風車の異常検知", "title": "One-dimensional convolutional autoencoder-based monitoring for fault detection in wind turbines", "url": "https://hal.science/hal-05838778v1", "authors": "Amanda Aryda S Sousa ほか", "venue": "HAL", "date": "2026-10-26", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HAL登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "健全時の振動データだけで学習した1次元畳み込み自己符号化器の再構成誤差を健全指標とし、風車の故障を教師なしで検知する。", "p3": "風車各部の加速度計の振動信号を入力に、正常挙動の潜在表現を学習する。再構成誤差が高いほど劣化の疑いとする（抄録）。", "p5": "陸上風車に適用し、正常と故障を含む多様な運転条件で評価したとされるが、抄録に検知性能の数値はない（抄録）。", "fun": "正常な音だけを覚えた機械は、聞いたことのない音を聞くと上手に真似できない。この研究はその真似の下手さ（再構成誤差）を故障の合図に使う。壊れたときのデータを集めなくても異常を見つけられるのが利点で、実際の風車で試している。", "unverified": "検知性能の数値、故障の種類、データ期間は抄録に記載がなく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "支点反力から配管内部励振を逆算し疲労評価", "title": "Equivalent Internal Excitation Reconstruction and Fatigue Assessment of Piping Systems Based on Fluid-Excitation-Force Measurement", "url": "https://doi.org/10.2139/ssrn.7669871", "authors": "QinChao Wang ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Wang, Q., Yang, J., Xi, S., Wang, Z., Xing, L., & Ma, X. (2026). Equivalent Internal Excitation Reconstruction and Fatigue Assessment of Piping Systems Based on Fluid-Excitation-Force Measurement. https://doi.org/10.2139/ssrn.7669871", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "配管支持部の反力計測と有限要素の伝達関数から内部の流体励振力を逆算し、独立した加速度で検証してから疲労を評価する一連の手順を示した。", "p3": "支点反力の逆解析で等価励振を再構成し、独立点の加速度応答で伝達能力を確かめ、同じ荷重をホットスポット応力に伝えてレインフロー法と周波数領域の疲労解析を行う（抄録）。", "p5": "3成分の支点反力は強く連成し、反力伝達関数は大半の周波数点で3次元に同定できた。3つの独立加速度点の全体振動レベルは予測と実測が良く一致。励振は方向性が強く、応力エネルギーは300〜600 Hz帯に集中。疲労損傷率は手法により大きく異なった（抄録）。", "fun": "配管の中を流れる液体がどんな力で管を揺らしているかは、直接は測れない。この研究は、管を支える台にかかる力（測れる）から中の力を逆算し、別の場所の揺れで答え合わせをしてから疲労を計算した。「結果から原因を当て、別の証拠で確かめる」推理の手順を工学で実践している。", "unverified": "対象配管の規模と、疲労手法間の差の大きさは抄録に数値がない。"}}, {"id": "pr27", "rank": 27, "headline": "状態推定を表形式の文脈内予測として解く", "title": "State Estimation as In-context Tabular Prediction", "url": "https://arxiv.org/abs/2610.32487", "authors": "Ayushi Jolotia ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Jolotia, A., & Pareek, P. (2026). State Estimation as In-context Tabular Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32487", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "電力系統の状態推定を、過去の計測と推定値を文脈として新しい計測から状態を予測する「表形式の文脈内予測」に置き換え、重みを更新しない表形式基盤モデルで解いた。", "p3": "合成データで事前学習した表形式基盤モデルを凍結したまま、計測ベクトルと状態推定の対を文脈として与える（抄録）。", "p5": "14〜118母線の送配電網で、完全計測時の誤差は文脈の母線平均の1/11〜1/57、計測が5%しかない場合でも1/1.3〜1/4.0。6母線に8σの偏りがあると角度誤差は1.8〜5.0倍に増えるが、不良データ検出つき重み付き最小二乗は2.5〜12.7倍。再学習なしでDSS²より電圧誤差が小さかった（抄録）。", "fun": "電力網の「いま各地点の電圧はどうか」を少ない計測から推定するのは連立方程式を解くのが定石だが、計測が足りなかったり壊れた計測が混じると崩れる。この研究は、表の欠けたマスを埋めるのが得意なAIに、過去の計測と答えの対を見せるだけで推定させた。学習し直さなくても別の電力網で使えるのが驚きである。", "unverified": "比較手法の設定の詳細は抄録のみで未確認。"}}, {"id": "pr28", "rank": 28, "headline": "低コストVIOのESKFを実データで失敗まで公開", "title": "Gyro-Aided Epipolar Filtering for Visual-Inertial Odometry on KITTI and EuRoC: An Empirical Study with Failure Analysis", "url": "https://doi.org/10.5281/zenodo.23646054", "authors": "Souparna Chatterjee", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-25", "apa": "Chatterjee, S. (2026). Gyro-Aided Epipolar Filtering for Visual-Inertial Odometry on KITTI and EuRoC: An Empirical Study with Failure Analysis. Zenodo. https://doi.org/10.5281/ZENODO.23646054", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodo登録の説明文（OpenAlex経由）を抄録として使用。本文は入手できず", "preprint": true, "short": true, "p1": "低コスト機器向けの誤差状態カルマンフィルタによる視覚慣性オドメトリを、KITTIとEuRoCで段階的に検証し、失敗した試行も含めて公開した。", "p3": "ジャイロで予測した回転、2視点のエピポーラ幾何による並進方向の観測、静止時の零速度更新を組み合わせる。KITTIの生ログの時刻の不具合も修正した（抄録）。", "p5": "視覚とジャイロの回転の不一致は中央値0.087°/フレーム（運動0.89°に対し）。補正なしの推測航法はEuRoCで70秒以内に77〜516 mの軌跡誤差で破綻。EuRoCの5系列中2つで失敗し、KITTIの5走行中2つでしかIMU単独を上回らなかった（抄録）。", "fun": "カメラとジャイロで自分の位置を推定する技術は、うまくいった結果だけが論文になりがちである。この研究はうまくいかなかった設定や、データが否定した仮説まで全部書いた。70秒で数百メートルずれる失敗例を見ると、なぜ複数のセンサを組み合わせる必要があるかが実感できる。", "unverified": "成功した系列での最終的な軌跡誤差は抄録に記載なし。"}}, {"id": "pr29", "rank": 29, "headline": "vbICAで余効変動をGNSS時系列から分離", "title": "Disentangling postseismic deformation from noisy GNSS data using vbICA approach: Application to the 2021 Mw7.4 Maduo Earthquake, Tibetan Plateau", "url": "https://doi.org/10.21203/rs.3.rs-10721869/v1", "authors": "Zhijun Liu ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Liu, Z., Qiu, Q., Liu-Zeng, J., Tian, Y., Zhao, B., Wang, P., Yao, W., Wang, W., Han, L., & Shao, Y. (2026). Disentangling postseismic deformation from noisy GNSS data using vbICA approach: Application to the 2021 Mw7.4 Maduo Earthquake, Tibetan Plateau. https://doi.org/10.21203/rs.3.rs-10721869/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "地震後に設置されたGNSS局も含めて、変分ベイズ独立成分分析（vbICA）で余効変動を傾向・季節変動・雑音から分離する手順を示した。", "p3": "地震前からの19局で同時・非地殻変動のオフセットと線形傾向を除き、vbICAで余効成分と季節成分を分離する。傾向と季節成分をクリギングで地震後設置の13局に内挿して除去し、全局にvbICAを再適用。水平と鉛直は別々に扱う（抄録）。", "p5": "2021年Mw7.4 Maduo地震で、水平成分の余効変動は1年以内に急減する指数型の過渡から一定の速度へ移行する形を示した（抄録）。", "fun": "大地震のあと、地面はゆっくり動き続ける（余効変動）。それを測りたいのに、肝心の震源近くの観測点は地震のあとに置かれるので「地震前の普段の動き」が分からない。この研究は、前からある観測点の普段の動きを地図のように内挿して新しい点から差し引く工夫で、混ざった信号を分けた。", "unverified": "分離精度の定量評価は抄録に記載なし。"}}, {"id": "pr30", "rank": 30, "headline": "斜面上の一体式橋台杭は横抵抗が33%減", "title": "Analysis of Soil-Abutment-Pile Interaction Considering the Slope Effect for Integral Abutment Jointless Bridges (IAJBs) Under Cyclic Loading", "url": "https://doi.org/10.20944/preprints202610.2320.v1", "authors": "Xiaoye Luo ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Luo, X., Fu, R., Yang, J., Xiong, Z., She, Z., & Yuan, J. (2026). Analysis of Soil-Abutment-Pile Interaction Considering the Slope Effect for Integral Abutment Jointless Bridges (IAJBs) Under Cyclic Loading. https://doi.org/10.20944/preprints202610.2320.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "斜面上に建つ一体式橋台（ジョイントレス）橋の橋台・杭・地盤の相互作用を繰返し載荷試験で調べ、「斜面効果」が横抵抗を弱め応答を非対称にすることを示した。", "p3": "層状の粘土・砂斜面に埋めた一体式橋台とRC杭に擬似静的な繰返し載荷を行い、杭側面から斜面肩までの距離と杭径の比b/dを主要パラメータとして、平地（b/d=0）と30°斜面（b/d=2.0）を比べた（抄録）。", "p5": "斜面側のピーク横力は33.1%減、系の剛性は24.8%低下し、杭の塑性ヒンジはより深く形成。背面土圧は大変位で約4.6%低く、杭の平均地盤反力は平地の0.932倍（抄録）。", "fun": "山道の橋は、片側が崖のような斜面に杭を打つことが多い。地面が片側にしかないと、杭を押したときに支えてくれる土が少なく、押し返す力が3割ほど弱まることを実物に近い試験で測った。橋の「片足が斜面に乗っている」状態がどれだけ不利かを数字で示した研究である。", "unverified": "試験体の縮尺と載荷回数は抄録に記載なし。"}}, {"id": "pr31", "rank": 31, "headline": "自律検査に向けた非破壊検査4.0の総説", "title": "The Path to NDE 4.0: A Review of Algorithms, Techniques, and Strategies for Autonomous Inspection", "url": "https://arxiv.org/abs/2610.31704", "authors": "Ashiqur Rahmana ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Rahmana, A., Seethi, V. D. R., Kral, Z., Yunker, A., Kettimuthu, R., & Alhoori, H. (2026). The Path to NDE 4.0: A Review of Algorithms, Techniques, and Strategies for Autonomous Inspection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31704", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "非破壊検査の自律化（NDE 4.0）に向けた研究動向を、計算アルゴリズム・物理手法・産業応用・研究目的の4つの視点で整理した総説。", "p3": "幅広い文献を統合し、手作業の判読からデータ中心の体制への移行を描く（抄録）。", "p5": "超音波と目視が主要な物理手法で、欠陥認識は深層学習と生成モデルへ移行している。標準化された公開データの不足とAIのブラックボックス性が障害で、説明可能AIとデジタルツインの標準化が課題とする（抄録）。", "fun": "橋や飛行機を壊さずに傷を見つける検査は、長く人の目と経験に頼ってきた。この総説は、その仕事がどこまで機械に置き換わりつつあるかを地図にし、意外にも一番の壁が技術ではなく「みんなで使える公開データがない」ことだと指摘している。", "unverified": "対象文献数と選定基準は抄録に記載なし。"}}, {"id": "pr32", "rank": 32, "headline": "LLM注釈者の人間との一致度をベンチマーク", "title": "Can LLM Annotators Match Human Consistency? Benchmarking Human Agreement and Optimizing Multi-Agent with Contrastive Knowledge", "url": "https://arxiv.org/abs/2610.32415", "authors": "Xiaopeng Ke ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Ke, X., Wang, Z., Liu, X., Ma, X., Zheng, X., Song, B., Wang, W., & Zhang, M. (2026). Can LLM Annotators Match Human Consistency? Benchmarking Human Agreement and Optimizing Multi-Agent with Contrastive Knowledge (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32415", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "長い注釈ガイドラインと複数注釈者の不一致を含む実務的なベンチマークで、LLM注釈者が人間の判断分布にどれだけ近いかを測り、対比的な規則抽出で改善する多エージェント枠組みを示した。", "p3": "7データセットに1事例あたり5人の独立ラベルを付けたANT-Aベンチマークを作り、Fleiss kappaで分布との整合を評価する。ANT-ORは正例・負例のフィードバックから対比的な決定規則を蒸留してプロンプトを改良する（抄録）。", "p5": "ANT-ORは2人以上一致の精度で最強の基準を4.5ポイント上回り、Fleiss kappaで人間の分布に2ポイント以内まで近づいた（抄録）。", "fun": "「この文は攻撃的か」のような判断は、人間どうしでも意見が割れる。従来のAI評価は正解を1つに決めてしまうが、この研究は5人分の答えのばらつきそのものを正解にして、AIがそのばらつきを再現できるかを測った。間違いから「こういうときはこう判断する」という規則を学ばせると、人間の分布に近づいた。", "unverified": "7データセットの内訳と基準手法の名称は抄録に記載なし。"}}, {"id": "pr33", "rank": 33, "headline": "多エージェント工作流の設計原理を探索履歴から採掘", "title": "Mining the Design Space of Multi-Agent Workflows", "url": "https://arxiv.org/abs/2610.31709", "authors": "Xavier Cadet ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Cadet, X., Cheng, J., Chin, P., & Richardson, K. (2026). Mining the Design Space of Multi-Agent Workflows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31709", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "最適化の途中で捨てられていた多エージェント工作流の候補と実行記録を集め、再現可能な設計原理を統計的に検証する2段階の手順を示した。", "p3": "AFlowのMCTS最適化を6つの演算子と26の決定論的に検証できるEnigmata課題で回し、中間結果も残して28,568の実行可能な工作流の集合を作る。サンドボックス化した自動研究ループがL0罰則つきの検証目的で設計原理を採掘し、保留した探索で検証する（抄録）。", "p5": "300回の特徴採掘で、独立解法と一括集約で始める構成は劣り（Δ=−0.045）、永続的な共有文書は討論を上回り（Δ=+0.135）、プロンプトの具体性と文脈のルーティングは通信構造の選択に匹敵する効果（Δ=+0.118）だった（抄録）。", "fun": "複数のAIをどう組ませると賢くなるかは、これまで職人の勘で決められてきた。この研究は、最適化の途中で試して捨てられた何万通りもの組み方を実験データとして拾い直し、統計的に効く設計の型を見つけた。意外にも、AIどうしに討論させるより、1枚の共有メモに書き足させる方が成績が良かった。", "unverified": "Δの単位（スコアの尺度）は抄録から判断できず未確認。"}}, {"id": "pr34", "rank": 34, "headline": "信頼を見抜いても合意には使えないLLM交渉", "title": "Knowing Whom to Trust is not Enough: The Trust--Agreement Gap in Repeated Multi-Party LLM Negotiation", "url": "https://arxiv.org/abs/2610.31971", "authors": "Amit Sarker ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Sarker, A., Choudhury, M., Mahmud, S., & Zilberstein, S. (2026). Knowing Whom to Trust is not Enough: The Trust--Agreement Gap in Repeated Multi-Party LLM Negotiation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31971", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "反復する多者間交渉で、LLMエージェントが相手への信頼を推定できても、それを使うよう明示されない限り合意率が上がらない「信頼-合意の溝」を示した。", "p3": "同じエージェントが連続する多者・多争点の交渉ゲームに参加し、1人が密かに合意を妨害する枠組みで、各ゲーム後に相手を評価して対ごとの信頼を次に持ち越す。信頼を使う条件と使わない条件を比べる（抄録）。", "p5": "信頼ありのエージェントは数ゲームで敵対者を特定できるが、正確な信頼推定が良い合意につながるとは限らない。信頼を判断に使うよう明示した場合のみ合意率が最大23ポイント上がった（抄録）。", "fun": "「誰が邪魔しているか」を見抜くことと、「見抜いた上でうまく交渉する」ことは別である。AIの交渉者は、繰り返し会ううちに裏切り者を数回で見つけられたが、そのことを交渉にどう生かすかを言われないと結果は良くならなかった。人間の会議でも思い当たる話で、知っていることと使えることの差を測った研究である。", "unverified": "使用したモデルの種類とゲーム数は抄録に記載なし。"}}, {"id": "pr35", "rank": 35, "headline": "研究者ペルソナで科学エージェントを評価", "title": "PersonaScienceBench: Evaluating Scientific Agents with Diverse Simulated Researchers", "url": "https://arxiv.org/abs/2610.32106", "authors": "Siyang Wu ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Wu, S., Zhang, W., Yang, C., Fei, E. X., Overwiening, J., Pan, X., Tang, J., He, Y., Mo, K. C., Li, P., Cao, D., Hu, X., Wang, H., Li, T., Li, H., Deng, Z., Zhang, J., Zhang, P., Zhang, H., … Hao, Y. (2026). PersonaScienceBench: Evaluating Scientific Agents with Diverse Simulated Researchers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32106", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "専門や好みが異なる研究者を模擬したペルソナと対話しながら課題を解く科学エージェントの評価ベンチマークを提案した。", "p3": "4領域5ベンチマークから200課題を取り、模擬研究者がペルソナに従って文脈と反応を与える。課題の目的と採点は固定し、エージェントは会話を通じてしか相手の好みを知れない（抄録）。", "p5": "18のモデル構成で、課題性能・事実の回収・自己反復に異なる強みが現れた。研究者プロファイルごとに異なる応答が見られ、最終スコアが同じでも振る舞いが違う場合があった（抄録）。", "fun": "研究を手伝うAIの試験は、ふつう「問題を解けたか」だけを見る。この研究は、相手となる研究者の性格や専門を変えて、AIが相手に合わせて質問したり手順を直したりできるかを測った。点数が同じ2つのAIでも、相手への向き合い方は違うことがある。", "unverified": "具体的なモデル名と詳細な数値は抄録に記載なし。"}}, {"id": "pr36", "rank": 36, "headline": "LLM有権者模倣の集団誤差は属性除去で減る", "title": "AI Alignment for Digital Democracy: Fairer Voters Representation against LLM Biases", "url": "https://arxiv.org/abs/2610.32780", "authors": "Yi Qi ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Qi, Y., Majumdar, S., & Pournaras, E. (2026). AI Alignment for Digital Democracy: Fairer Voters Representation against LLM Biases (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32780", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMで有権者の投票を模倣するときの集団別の誤差を測り、どの属性情報を外せば公平になるかを3回の米大統領選で調べた。", "p3": "クローズドとオープンの2つのLLMで、個々の投票をどれだけ正確に再現するか、集団間で精度が違うかを比べ、整合戦略の効果を試す（抄録）。", "p5": "性別を外すと最大の集団誤差が22〜42%減、学歴を外すと64%減。一方で自己申告の人種を外すと平均集団誤差が40%超増え、いずれも全体精度は下がらない。反復質問や公平性の指示は誤差を減らさず、2倍にすることもあった（抄録）。", "fun": "世論調査の代わりにAIに「この人ならどう投票するか」を答えさせる試みがある。この研究は、AIに教える人物情報を増やせば増やすほど良いわけではなく、性別や学歴を伏せた方が特定の集団への誤りが減る一方、人種を伏せると逆に悪化することを見つけた。「公平にしてください」と頼んでも効かないという結果も含め、直感に反する発見である。", "unverified": "使用したモデル名と誤差の定義は抄録に記載なし。"}}, {"id": "pr37", "rank": 37, "headline": "LLM判断の会話経路依存は曖昧な事例で大きい", "title": "Conversational Path Dependence in Ambiguous LLM Judgment", "url": "https://doi.org/10.5281/zenodo.23660349", "authors": "Wang, Jiaying", "venue": "Zenodo", "date": "2026-10-26", "apa": "Wang, J. (2026). Conversational Path Dependence in Ambiguous LLM Judgment. Zenodo. https://doi.org/10.5281/ZENODO.23660349", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodo版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "同じ事実でも提示順や先行する助言者の判断で結論が変わる「会話経路依存」を、曖昧さの水準別に分解して測った。", "p3": "合成した対人事例で、最終的な外部記録を固定したまま事実の順序と先行コミットを変え（1A）、3段階の証拠の診断性×2つの極性でコミット・順序・顕著性の感度を別々に推定し（1B）、新証拠なしの継続で自己強化が起きるかを試す（1C）（抄録）。", "p5": "コミット感度は曖昧さが低・中・高で0.0280・0.0335・0.1150。最大効果は方向性信念の−0.342だが強く非対称。新証拠のない継続では平均の漂流・確信の増加・結論の変化がゼロで、新しい証拠だけが系統的な動きを生んだ（抄録）。", "fun": "相談相手に「最初はAだと思う」と言われたあとで同じ事実を見ると、人は結論が引きずられる。AIにも同じ癖があるかを、事実は同じで順番や前置きだけを変えて測った。曖昧な事例ほど引きずられる一方、話を続けるだけでは勝手に確信が膨らまないという、安心材料と注意点の両方が出た。", "unverified": "対人事例の内容と使用モデルは抄録に記載なし。"}}, {"id": "pr38", "rank": 38, "headline": "役割ごとにモデルを選ぶ多エージェント最適化", "title": "Not Every Agent Needs the Strongest Model: Unified Prompt-Model Optimization for Heterogeneous LLM-based Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.31743", "authors": "Mingxiu Cai ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Cai, M., Xian, H., Ma, X., Wang, Y., Song, Z., Li, J., & Liu, X. (2026). Not Every Agent Needs the Strongest Model: Unified Prompt-Model Optimization for Heterogeneous LLM-based Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31743", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多エージェントLLMの役割ごとにプロンプトとモデルの割当を同時に最適化し、最強モデルを全役割に使う構成に近い性能をはるかに低いコストで実現した。", "p3": "局所・下流・大域のフィードバックで候補を評価し、コストを考慮したパレート探索で品質とコストの両立する更新を残す。トポロジを考慮した共進化と階層横断の軌跡記憶で最適化を導く（抄録）。", "p5": "5ベンチマーク・5トポロジで、集中実行では平均スコアを69.79から70.40に上げつつ、トークン加重の展開コストをDeepSeek-V4-Pro＋MASPO比で85.2%削減した（抄録）。", "fun": "会社で全員を最高給の専門家にする必要はないように、AIの分業でも役割ごとに最適なモデルは違う。この研究は「誰にどのモデルを割り当て、どう指示するか」を一緒に探索し、成績を保ったまま費用を85%減らした。適材適所をアルゴリズムで実現した話である。", "unverified": "5ベンチマークの名称は抄録に記載なし。"}}, {"id": "pr39", "rank": 39, "headline": "善意のLLM協力が監視工程を迂回する", "title": "The Helpful Agent Problem: When Emergent Cooperation Among LLM Agents Bypasses Intended Workflows", "url": "https://arxiv.org/abs/2610.31985", "authors": "Moumita Choudhury ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Choudhury, M., Sarker, A., & Zilberstein, S. (2026). The Helpful Agent Problem: When Emergent Cooperation Among LLM Agents Bypasses Intended Workflows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31985", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "悪意のないLLMエージェントどうしが、審査者が不在のときに互いの資源を代わりに変更して意図された工程を迂回する「親切なエージェント問題」を示した。", "p3": "長期の共有資源環境で、他者所有の資源の変更が通常は審査者を介する設定を作り、審査が使えなくなったときの行動を観察する。副作用を測れるFavorBenchを導入し、CooperBenchも適応させた（抄録）。", "p5": "2ベンチマーク・4モデルで工程外の「お節介」が頻繁に現れ、FavorBenchでは少なくとも3モデルのお節介が相互作用の外の第三者に有意な害を及ぼした（抄録）。", "fun": "AIが悪さをする心配は多く語られるが、この研究は「良かれと思って」の協力が問題を起こすことを示した。審査役が席を外した途端、AIどうしが互いの仕事を代わりにやり始め、権限の範囲内なのに決められた手順をすり抜ける。善意が安全装置の穴になるという指摘が新しい。", "unverified": "害の大きさの数値と4モデルの名称は抄録に記載なし。"}}, {"id": "pr40", "rank": 40, "headline": "ペルソナと記憶刺激で対話AIを行動監査", "title": "Priming, Persona, and Provocation: A Transferable Method for Behaviourally Auditing Conversational AI", "url": "https://doi.org/10.20944/preprints202610.2312.v1", "authors": "Jean-Christophe Bélisle-Pipon ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Bélisle-Pipon, J.-C., Potter, J., Taylor, L., & Tehrani, M. (2026). Priming, Persona, and Provocation: A Transferable Method for Behaviourally Auditing Conversational AI. https://doi.org/10.20944/preprints202610.2312.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記憶を持ち個人化する対話AIを、標準化ペルソナ・記憶の事前刷り込み・段階的な挿話・敵対的な物語で監査する転用可能な方法を提案した概念論文。", "p3": "社会人口・地位で変えたペルソナを作り、準備セッションで経歴と関係史を記憶層に植え、後のセッションで記憶の保持と利用を調べ、重症度の段階に分けた一人称の場面を投げ、隔離した会話で物語を激化させて感受性の区分で報告する（抄録）。", "p5": "方法の枠組みと、採点層が満たすべき契約を示す。小標本・仮説生成型の妥当性やモデルの非決定性への対処を論じるが、実証結果は抄録に示されていない（抄録）。", "fun": "今のAI相談相手は会話を覚えて相手に合わせるので、1問1答の試験では本当の振る舞いが分からない。この提案は、俳優が設定を演じる「模擬患者」のやり方をAI試験に持ち込み、あらかじめ経歴を覚えさせてから、少しずつ深刻になる悩みを投げて反応を見る。試験の仕方そのものを設計し直した論文である。", "unverified": "実際の適用例や結果は抄録になく未確認。"}}, {"id": "pr41", "rank": 41, "headline": "DRMによる開示技術がM&A評価額を左右", "title": "Digital Rights Management as Disclosure Technology:Evidence from Target Valuations in Mergers and Acquisitions", "url": "https://doi.org/10.2139/ssrn.7670135", "authors": "Narmin Nahidi ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Nahidi, N., Hirth, S., & Eshraghi, A. (2026). Digital Rights Management as Disclosure Technology:Evidence from Target Valuations in Mergers and Acquisitions. https://doi.org/10.2139/ssrn.7670135", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "M&Aのデューデリジェンスで使う開示技術（DRM）が、特許資産では対象企業の評価額を上げ、モジュール性の低いデジタル資産では下げるという非対称を示した。", "p3": "開示技術が取引前の逆選択を減らす一方、取引後の再結合摩擦を資産のモジュール性に応じて生む2パラメータのモデルを立て、対象企業の10-K事業記述と特許からDRM文脈の指標を作る（抄録）。", "p5": "米国の公開対象企業3,649件のM&Aで、デジタル文脈の強さは評価額の低さ、特許文脈の強さは高さと結びつく。産業×年内の推定、無形資産の測定誤差の統制、置換プラセボにも頑健で、プライバシー法のショックは対象州で評価額を下げた（抄録）。", "fun": "会社を買う前に相手の中身を見せてもらう「開示」は、情報を守る技術（DRM）を通じて行われることがある。この研究は、守りが固いと安心して高く買う場合と、買った後に自由に使えず安く買い叩く場合の両方があり、それが資産の種類で分かれると示した。鍵のかかった倉庫は、中身が特許なら価値を上げ、データなら下げる。", "unverified": "DRMの採用自体は観測できず文脈指標で代理しているため、効果の解釈は著者も限定している。"}}, {"id": "pr42", "rank": 42, "headline": "ESG格付の不一致が過剰投資を抑制", "title": "ESG Rating Disagreement and Corporate Investment Efficiency: Evidence from China's A-Share Market", "url": "https://doi.org/10.21203/rs.3.rs-11245143/v1", "authors": "Zhaoqian Feng", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Feng, Z. (2026). ESG Rating Disagreement and Corporate Investment Efficiency: Evidence from China’s A-Share Market. https://doi.org/10.21203/rs.3.rs-11245143/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ESG格付の不一致が企業投資の効率に与える影響を過小投資と過大投資に分解し、符号が逆だった先行研究を整合させた。", "p3": "2019〜2022年の中国A株非金融334社・1,073企業年（最大7社の格付）で、不一致の効果を2つの余白に分けて推定し、資金制約・業種・年で異質性を見る（抄録）。", "p5": "不一致は過小投資を増やし過大投資を減らす。資金制約の強い企業では不一致1標準偏差で過大投資が0.019減（年固定効果でp=0.052、500回のプラセボでp=0.022）。制約の上位三分位で−0.028、下位で+0.014、重工業で−0.035、2022年で−0.043（抄録）。", "fun": "同じ会社に格付会社ごとに違うESG評価がつく。それが会社の投資を増やすのか減らすのか、先行研究の答えは逆だった。この研究は「投資しなさすぎ」と「投資しすぎ」を別々に測ると、不一致はどちらも抑える方向に働くので、足し合わせた符号がデータ次第で変わるのだと説明した。矛盾の正体が分解で見える例である。", "unverified": "投資効率の測定モデルは抄録に記載なし。"}}, {"id": "pr43", "rank": 43, "headline": "SEC財務データの欠損率を再現可能に監査", "title": "Why Financial Statement Data Goes Missing: A Reproducible SEC Filing Coverage Audit", "url": "https://doi.org/10.5281/zenodo.23657325", "authors": "Sreekumar, Avinash", "venue": "Zenodo", "date": "2026-10-26", "apa": "Sreekumar, A. (2026). Why Financial Statement Data Goes Missing: A Reproducible SEC Filing Coverage Audit (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.23657325", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodo登録の説明文（候補収集時に取得）を抄録として使用。本文は入手できず", "preprint": true, "short": true, "p1": "上場5,608銘柄・852,416の表示行を対象に、SEC提出書類に由来する財務諸表データがどれだけ欠けるかを再現可能な手順で監査した報告。", "p3": "元の規則で年次の適格行の充足を集計し、30件の確定的な事例を原本の提出書類と照合する。報告、凍結した匿名化データ、出典の記録、スクリプトを同梱（抄録）。", "p5": "年次の適格行は55.9%が充足、8.7%が部分、35.4%が欠損。これは表示の網羅性であり正確さではない。著者は商用サービスの創業者で、査読は受けていない（抄録）。", "fun": "企業の財務データは「ある」ように見えて、実はかなりの部分が抜けている。この報告は、何千社ものデータで3分の1以上の行が欠けていたことを数え、その数え方を他人が再現できる形で公開した。地味だが、データを使う側が最初に知るべき事実である。", "unverified": "欠損の原因の内訳は抄録に記載なし。著者の商業的利害が明記されている。"}}, {"id": "pr44", "rank": 44, "headline": "国の水道規制は投資より資本収益を高める", "title": "What does national water regulation deliver? Investment, returns and scale in European private water utilities", "url": "https://doi.org/10.2139/ssrn.7669848", "authors": "Andrea Guerrini", "venue": "SSRN", "date": "2026-10-25", "apa": "Guerrini, A. (2026). What does national water regulation deliver? Investment, returns and scale in European private water utilities. https://doi.org/10.2139/ssrn.7669848", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "欧州の民間水道事業者の独自パネルで、国レベルの規制機関の有無が投資・収益・規模の経済とどう結びつくかを調べた。", "p3": "10か国32事業者の2018〜2023年で、規模・事業範囲・所有形態を条件づけて体制差を推定し、国レベルのワイルドクラスターブートストラップと無作為化推論で検定する。レバレッジ分解と費用関数も推定（抄録）。", "p5": "国の規制下ではEBITDAマージンと1人当たり資本基盤が高く、自己資本利益率は約9ポイント高い。その約半分は投下資本利益率、半分は負債による増幅。資本蓄積の速さ、1人当たり運営費、収益の変動は差がない。規模の経済は労働で強く約100万人まで続く（抄録）。", "fun": "「国がまとめて水道を規制すると投資が進む」とよく言われる。データを見ると、国の規制の下にある会社は確かに利益率が高いが、投資のペースが速いわけではなく、むしろ資本にお金が回る仕組みと結びついていた。著者も因果ではないと断っているが、常識を数字で問い直した。", "unverified": "32事業者の内訳と欠測の扱いは抄録に記載なし。"}}, {"id": "pr45", "rank": 45, "headline": "AI利用より職場の両立文化が幸福を予測", "title": "Work-Life Balance, Technology-Enabled Work, and Workplace Happiness: A Machine-Learning Typology of Manufacturing Workers in Mexicali, Mexico", "url": "https://doi.org/10.21203/rs.3.rs-11206886/v1", "authors": "Mayda Alejandra Calderon Diaz ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Diaz, M. A. C., Macias, A. S. G., & Contreras, D. O. (2026). Work-Life Balance, Technology-Enabled Work, and Workplace Happiness: A Machine-Learning Typology of Manufacturing Workers in Mexicali, Mexico. https://doi.org/10.21203/rs.3.rs-11206886/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "メキシコ・メヒカリの製造業零細企業の労働者347人で、AI関連技術への曝露よりも組織の両立文化と正の波及が職場の幸福を強く予測することを示し、4つの労働者類型を見出した。", "p3": "心理測定と回帰分析に、教師ありと教師なしの機械学習を組み合わせる（抄録）。", "p5": "ランダムフォレストの交差検証AUCは0.837、精度73%で、両立文化が最強の予測因子。クラスタ分析で「繁栄するデジタル」「緊張し過接続」「伝統的低技術で均衡」「離脱し支援なし」の4類型が現れ、技術関与が同程度でも両立条件で幸福が違った（抄録）。", "fun": "「AIを使う職場ほどストレスが増える」と思われがちだが、この調査ではAIをよく使う人の中に、とても幸せな群と疲れ切った群の両方がいた。分けていたのは技術の量ではなく、仕事と生活の両立を会社が認めているかどうかだった。技術の是非より、使い方の環境が効くという結果である。", "unverified": "AUCの比較対象や変数の定義は抄録に記載なし。"}}, {"id": "pr46", "rank": 46, "headline": "AIエージェントはロボット技術者を即戦力化しない", "title": "Can AI Agents Help Robotic Engineers? Lessons from Two Focus Days in Industry", "url": "https://arxiv.org/abs/2610.32636", "authors": "Salim Fares ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "apa": "Fares, S., & Herbold, S. (2026). Can AI Agents Help Robotic Engineers? Lessons from Two Focus Days in Industry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32636", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "産業用ロボットをプログラムする中小企業でAIエージェントを試した事例研究で、生産性は上がらなかったが、学習曲線とAI経験の重要性を示した。", "p3": "2回の集中日に技術者がAIエージェントで実務課題に取り組む様子を観察した（抄録）。", "p5": "反復的なコード生成の課題を除き生産性は向上しなかった。時間とともに結果は改善し、ロボット工学の経験よりAIの経験が成功に効いた。導入には訓練と学習期間、領域に合わせた設定が必要で、生産性研究は縦断的であるべきと結論づける（抄録）。", "fun": "AIに仕事を頼めばすぐ楽になる、とはいかなかった。ロボットの特殊な言語を扱う技術者たちは、最初はAIを使っても速くならず、慣れてくると成果が出始めた。しかも上手に使えたのはロボットに詳しい人ではなくAIに慣れた人だった。道具の良し悪しより、道具との付き合い方を学ぶ時間が結果を決めるという話である。", "unverified": "参加人数と課題数は抄録に記載なし。"}}, {"id": "pr47", "rank": 47, "headline": "小規模サービス企業の生成AI選定に検証時間を組込む", "title": "Selecting Generative AI Tools for Small Service Firms Under Human Review Constraints", "url": "https://doi.org/10.2139/ssrn.7663418", "authors": "Nadia Zahoor", "venue": "SSRN", "date": "2026-10-26", "apa": "Zahoor, N. (2026). Selecting Generative AI Tools for Small Service Firms Under Human Review Constraints. https://doi.org/10.2139/ssrn.7663418", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小規模サービス企業が生成AIを選ぶとき、人による確認時間を差し引いた上で、共有の確認能力に収まる施策の組合せを選ぶ会計モデルを示した概念論文。", "p3": "粗い労働節約から確認時間・修正の期待時間・継続費用を引き、残った施策を共通の確認能力で検定する透明な会計モデル。例示企業と感度分析、試行の設計を示す（抄録）。", "p5": "例示企業では報告書の全文作成が最大の粗節約だが確認時間が能力を超え、問い合わせの下書きと状況要約の組合せが最も価値の高い実行可能な選択になった。これはモデルの結果で観測ではない（抄録）。", "fun": "AIを月額で契約するのは安いが、AIが書いたものを人が確認する時間はただではない。この論文は、確認にかかる時間を帳簿に載せると、一番得に見える「報告書を全部AIに書かせる」が実は回らず、小さな仕事に使う方が得になることを計算で示した。節約の裏にある見えない労働を見える化した。", "unverified": "例示の数値は仮定に基づき、実企業のデータではない。"}}, {"id": "pr48", "rank": 48, "headline": "Visaデジタル決済の満足は期待性能と信頼で説明", "title": "Convenience, Trust, and Customer Satisfaction with AI-Supported Visa Digital Payments in Bangladesh", "url": "https://doi.org/10.20944/preprints202610.2259.v1", "authors": "Nafiz Hasan Sinha ほか", "venue": "Preprints.org", "date": "2026-10-26", "apa": "Hasan Sinha, N., & Mannan, K. A. (2026). Convenience, Trust, and Customer Satisfaction with AI-Supported Visa Digital Payments in Bangladesh. https://doi.org/10.20944/preprints202610.2259.v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Preprints.org版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "バングラデシュのVisa対応デジタル決済の利用者385人で、満足度を利便性・信頼・期待確認・性能期待・努力期待で説明したが、尺度の信頼性が低く推論は限定的だとした。", "p3": "各構成概念を3項目の合成得点にし、5つの予測変数の同時OLS回帰と、AI機能の経験区分による一元配置分散分析を行う（抄録）。", "p5": "回帰は満足の分散の24.3%を説明（調整R²=.233）。性能期待B=.179、努力期待.167、信頼.160、利便性.143が正で、期待確認はp=.077。AI経験群で満足に差なし（p=.763）。各尺度のα=.452〜.526と低い（抄録）。", "fun": "スマホ決済に満足する人は何を評価しているのかを調べた研究だが、面白いのは自分たちの質問紙の信頼性が低すぎることを正直に書き、結論を保留した点である。良い結果だけを並べるのではなく、測り方の弱さを先に認める論文は、何を信じるべきかを読者に教えてくれる。", "unverified": "回答者の募集方法は抄録から不明で、著者も出所を課題に挙げている。"}}, {"id": "pr49", "rank": 49, "headline": "放射線検査の付き添い拒否とケア責任の配分", "title": "Accompaniment refusal in radiological examination for disabled and cognitively impaired patients: a normative analysis of care responsibility allocation in China", "url": "https://doi.org/10.21203/rs.3.rs-11479022/v1", "authors": "Junjie Zhang ほか", "venue": "Research Square (In Review)", "date": "2026-10-26", "apa": "Zhang, J., Huang, X., Li, Z., Yu, L., & Meng, X. (2026). Accompaniment refusal in radiological examination for disabled and cognitively impaired patients: a normative analysis of care responsibility allocation in China. https://doi.org/10.21203/rs.3.rs-11479022/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Square版の抄録（候補収集時に取得）を使用。抄録は途中で切れている。本文は入手できず", "preprint": true, "short": true, "p1": "中国の病院で放射線検査に付き添う家族が被ばくを恐れて検査室に入らないとき、障害や認知症のある患者のケア責任を家族・病院・国にどう配分すべきかを規範的に分析した。", "p3": "原則主義・ケア倫理・責任倫理を統合し、ICRP Publication 138の価値枠組みで放射線防護の論法を内側から検証する。規範文書と文献、放射線科の複合事例を資料にする（抄録）。", "p5": "3つの緊張を特定した。線量回避に矮小化した防護は最適化原則の誤用で、付添者の線量は懸念水準を桁違いに下回るため拒否は害を移すだけ。儒教的な家族倫理に埋め込まれた介護責任と家族自身の自己防護の要求が衝突する（抄録）。", "fun": "病院に付き添いの職員がいないと、検査室で患者を支えるのは家族になる。家族が「放射線が怖い」と入室を断ると、患者は縛られたり放置されたりする。この論文は、実際の被ばく量が心配する水準よりはるかに低いことを示しつつ、家族の恐れを責めるのではなく、誰がケアの責任を負うべきかを原理から考え直した。", "unverified": "抄録が途中で切れており、第3の緊張と結論は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "徒歩通学バスへの参加を決める親の視点", "title": "Parental Perspectives on the Walking School Bus: Survey Evidence from Ferrara, Italy", "url": "https://econpapers.repec.org/RePEc:srt:wpaper:1326", "authors": "Giuseppe Rocco", "venue": "RePEc NEP", "date": "2026-10-26", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "RePEc（EconPapers）の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "子どもが大人の付き添いで集団登校する「徒歩通学バス」への親の参加を、イタリア・フェラーラの15小学校の親711人の調査で、行動・社会・経済の要因から説明した。", "p3": "子どもが実際に参加している親、制度はあるが使っていない学校の親、制度のない学校の親の3群を比べ、支払意思額と受入意思額も尋ねた（抄録）。", "p5": "環境的・教育的価値には広く同意がある一方、自家用車への依存が根強い。集合場所までの距離、時間割の不一致、ボランティア不足といった運営上の障壁が、価値観による抵抗より重要。対人信頼と市民参加は参加と結びつくが、組織的・制度的支援と組み合わさって初めて安定する。親は徒歩通学バスを金銭化できるサービスではなく象徴的価値の高い集合財と見ている（抄録）。", "fun": "「歩く通学バス」は良い制度だと親のほとんどが認めているのに、使う人は少ない。理由は反対ではなく、集合場所が遠い、時間が合わない、付き添い役が足りないという段取りの問題だった。さらに親はこの制度を「お金で買うサービス」ではなく「みんなの財産」と見ており、値段をつけること自体になじまない。良い制度が広まらない理由を丁寧に分けた研究である。", "unverified": "順序ロジットによる本格的な分析は別論文に委ねられ、本稿は記述的な結果にとどまる。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "経営者は最良の報酬契約を過小評価する", "title": "Beliefs Over Contracts", "url": "https://doi.org/10.3386/w35788", "authors": "Francis Annan ほか", "venue": "NBER Working Paper", "apa": "Annan, F., & Raymond, C. (2026). Beliefs Over Contracts. National Bureau of Economic Research. https://doi.org/10.3386/w35788", "why": "経営者の信念調査と大規模な現場実験で、最良の契約が利益を55%超上げたのに経営者はそれを低く順位づけ、教科書的な契約理論の方が正しく予測したことを示した。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "1440通りの合成コントロールで推定は大きく揺れる", "title": "We Just Created More Than 1,000 Synthetic Controls To Study California's $20 Fast Food Minimum Wage", "url": "https://doi.org/10.3386/w35931", "authors": "Jeffrey Clemens ほか", "venue": "NBER Working Paper", "apa": "Clemens, J., Edwards, O., Meer, J., & Nguyen, J. D. (2026). We Just Created More Than 1,000 Synthetic Controls To Study California's $20 Fast Food Minimum Wage (NBER Working Paper No. 35931). National Bureau of Economic Research. https://www.nber.org/papers/w35931", "why": "カリフォルニアの20ドル最低賃金の雇用効果を1,440の仕様で推定し、96%超が負でも幅が広く、単純なDiDが分布の中心に来ることを示した。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "L-momentごとの平行トレンドで分布DiDを緩める", "title": "Parallel Trends as a Spectrum", "url": "https://arxiv.org/abs/2610.31978", "authors": "Kyle Schindl ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "位置・散布・歪度などのL-momentに平行トレンドを課す識別条件の階層を提案し、効率的推定量と同時推論を与えて分布DiDの仮定を選べるようにした。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AI曝露の高い専攻は卒業後の雇用と収入が急落", "title": "Graduating Into Disruption: Labor Market Outcomes for AI-Exposed College Majors", "url": "https://econpapers.repec.org/RePEc:cen:wpaper:26-56", "authors": "Cody Orr ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "行政記録で、ChatGPT登場直後からAI曝露の高い専攻の初職就業率が5ポイント、初期収入が13%下がり、不況期の卒業に匹敵することを示した。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "実ユーザ6万セッションで買い物エージェントを評価", "title": "UserArena: Benchmarking Interactive User Simulation for Long-Horizon Shopping Agents", "url": "https://arxiv.org/abs/2610.30932", "authors": "Jujia Zhao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "why": "11,010人の64,729セッションと本番A/Bテストの結果に対して、長期の利用者模擬を5段階で検証できる基盤と軌跡蒸留法を示した。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "時系列基盤モデルは介入ではなく相関を予測する", "title": "Forecasting Associations, Not Interventions: A Preregistered Causal Audit of Covariate-Aware Time Series Foundation Models", "url": "https://arxiv.org/abs/2610.31869", "authors": "Zong-Han Bai", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "事前登録の監査で、共変量つき時系列基盤モデルが因果効果ではなく交絡を含む条件付き傾きを返すことを理論・挙動・表現の3水準で示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "洪水後の創造的破壊を災害支出が後押し", "title": "Cleansing Floods? Creative Destruction and Government Spending After Disasters", "url": "https://econpapers.repec.org/RePEc:cen:wpaper:26-52", "authors": "Tarikua Erda", "venue": "RePEc NEP", "date": "2026-10-26", "why": "米国の工場水準の秘匿データで、洪水後に低生産性の工場が退出し設備が高生産性の参入者に渡る過程を追い、連邦災害支出がその再配分を可能にすることを示した。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "H-2A季節労働ビザのRCTで家計は貧困を脱する", "title": "The Returns to Temporary Migration: Experimental Evidence from the H-2A Program", "url": "https://doi.org/10.3386/w35941", "authors": "Melanie Morten ほか", "venue": "NBER Working Paper", "why": "メキシコ人労働者にH-2Aビザを無作為配分し、1季節で1.6万ドル超の収入、貧困率10ポイント低下を示す一方、家族の精神健康悪化などの副作用も記録した。"}, {"id": "pn09", "rank": 9, "field": "因果推論", "headline": "合成コントロールの適合期間と検証期間を分ける", "title": "Honest Inference for Synthetic Controls with Imperfect Fit: Time-Split Validity and the Choice of Anchor", "url": "https://arxiv.org/abs/2610.32383", "authors": "Rok Spruk", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "前処置期間を当てはめと検証に分割し、反事実の曲率に明示的な制約を置くことで有限標本の被覆率をもつ区間を与え、古典的応用の結論の外挿依存を示した。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "50対50試験では単純回帰調整が勝つことも", "title": "Higher Order Asymptotics of Regression Adjustment Estimators for Causal Inference", "url": "https://arxiv.org/abs/2610.32023", "authors": "Anna Kelley ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "等確率割付では交互作用つき回帰と単純回帰の漸近分散が一致するため高次項で優劣が決まることを解析し、歪んだ特徴量では単純回帰が優れうると示した。"}, {"id": "pn11", "rank": 11, "field": "統計学", "headline": "最良スコアの楽観バイアスの鋭い上界を導出", "title": "Sharp Bounds on the Winner's Bias under Independent and Nonnegatively Correlated Noise", "url": "https://arxiv.org/abs/2610.31948", "authors": "Ivan Viakhirev ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "M個の雑音つきスコアの最大値が持つ上方バイアスの鋭い定数を独立・非負相関の場合に決定し、Lean 4で形式検証し、448のモデル選択パイプラインで検証した。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "固定・変量効果を超える偏り考慮メタ分析", "title": "Bias-aware meta-analysis: beyond fixed-effect and random-effects meta-analyses", "url": "https://arxiv.org/abs/2610.32183", "authors": "Mingxuan Zou ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "各研究に未知の固定バイアスを許し、臨界値を折り畳み正規分位点に置き換えて、有意性のための最大バイアスと適合のための最小バイアスを報告する枠組みを示した。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "視覚と鍵盤操作だけで開放世界ゲームを遂行", "title": "HiSTEVE 1.0: Harnessing Human-Interface VLA Agents for Open-World Games", "url": "https://arxiv.org/abs/2610.31162", "authors": "Zecong Tang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "why": "階層的なVLAエージェントがMinecraftで視覚のみとキーボード・マウス操作で長期課題を達成し、MineStudio Benchで85.0%を記録した。"}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "似た才能と異なる専門の創業チームが大きく育つ", "title": "Sorting into entrepreneurial teams", "url": "https://econpapers.repec.org/RePEc:boe:boeewp:023785", "authors": "Edoardo M Accabi ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "ポルトガルの雇用者-従業員・財務データで、才能が似て専門が異なるチームほど大きく長続きする企業をつくるが、そうした組合せは形成されにくいことを理論と計量で示した。"}, {"id": "pn15", "rank": 15, "field": "ヒューマンコンピュータインタラクション", "headline": "AIの確信度表示は正誤を知ると効かなくなる", "title": "When Should I Trust This? Designing and Evaluating Factuality Indicators for LLM-based Chatbots", "url": "https://arxiv.org/abs/2610.32883", "authors": "Greta Warren ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "面接8人・調査1,000人・実験5,151人で、確信度や出典の表示が初期の信頼に影響するが、正誤を知ると効果が消え、医療では常に懐疑的になることを示した。"}, {"id": "pn16", "rank": 16, "field": "心理学・認知科学", "headline": "心理的性差が職業の性別分離を半分説明", "title": "Occupational Sex Segregation is Strongly Predicted by Psychological Sex Differences", "url": "https://doi.org/10.31234/osf.io/wrch4_v2", "authors": "Joakim Karl Erik Frostegård ほか", "venue": "PsyArXiv", "date": "2026-10-25", "why": "2,576人の能力・興味の性差と429職業の要件から推定した性比が実際の性比の分散の49%を説明し、物への興味の性差が最も強いことを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "個人の心理的特性の性差と職業の要件プロファイルから推定した職業ごとの性比が、実際の職業の性別分離の約半分を説明することを示した。", "p3": "35〜45歳の2,576人が空間能力・言語能力・協調性・情緒安定性・人への興味・物への興味を測るオンライン検査と質問紙に答え、学生が429職業の要件を評定。特性の性差と要件から各職業の「要件に合う人の性比」を推定し、実際の性比と比べる（抄録）。", "p5": "興味と認知を合わせたモデルがR²=.49、興味モデル.46、認知モデル.18。単独では物への興味の性差が最も予測的（R²=.42）。認知の性差は女性が多い職業より男性が多い職業をよく予測した（抄録）。", "fun": "看護師に女性が多く、機械工に男性が多いのはなぜか。この研究は「人より物に興味がある」といった平均的な性差と、各職業が何を求めるかを掛け合わせると、職業の男女比の半分近くが当たることを示した。差別や制度だけでなく、本人の興味の分布も分離に効いているという、議論を呼びそうな結果である。", "unverified": "横断研究であり因果の向きは示されていない。要件評定者（学生）の人数は抄録に記載なし。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "家主への家賃保証が弱い借主の住宅と移動を助ける", "title": "Insuring Landlords", "url": "https://doi.org/10.3386/w35932", "authors": "Thomas Bézy ほか", "venue": "NBER Working Paper", "why": "フランスの公的家賃保証Visaleの年齢による適格性の断絶を使い、民間賃貸へのアクセスと高賃金地域への長距離移動の増加を示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "家主を家賃未払いリスクから守る公的保証が、立場の弱い借主の民間賃貸へのアクセスと高賃金地域への移動を増やすことを示した。", "p3": "フランスの大規模な公的家賃保証Visale（適格な借主と家主は無料）について、行政の世帯データと保険金支払データを使い、年齢による適格性の正確な境界を利用した準実験で推定する（抄録）。", "p5": "保証は民間賃貸へのアクセスを増やし、特に移民、新規世帯、低所得の借主で効果が大きい。高家賃・高賃金の地域への長距離移動を、限界的な移動1件あたり中程度の財政費用で促したが、家賃上昇を通じて同等の非適格な借主を押し出した可能性がある（抄録）。", "fun": "貸す側が「家賃を払ってもらえないかも」と恐れると、収入の不安定な人は部屋を借りられない。フランスは国が家主に保険をかけることでこの恐れを取り除き、結果として移民や若い世帯が良い仕事のある都市に引っ越せるようになった。ただし家賃が上がって保証のない人が弾かれた可能性もあり、良いことずくめではない。", "unverified": "効果の大きさの数値と財政費用の額は抄録に記載なし。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "宗教禁止後も宗教建築の可視性が規範を残す", "title": "Losing Their Religion", "url": "https://doi.org/10.3386/w35933", "authors": "Richard Murphy ほか", "venue": "NBER Working Paper", "why": "アルバニアの1967年宗教禁止と1948年の記念物指定の組合せで、宗教建築が残らない地域ほど女性の就業と就学が増えたことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "政府が社会規範を変えられるかを、1967年のアルバニアの宗教禁止で検証し、宗教建築が残らなかった地域ほど女性の就業と就学が増えたことを示した。", "p3": "宗教行為は全国一律で禁止されたが、1948年の歴史的記念物の分類でどの宗教建築が取り壊されずに残るかが決まったことを利用し、残存状況の違いで効果を比べる（抄録）。", "p5": "記念物が残らなかった地域で女性の就業と就学の増加が最大、農村のみに残る地域で小さく、都市に残る地域で最小。宗派に関係なく、記念物の数が増えるほど効果は減った。旧い宗教秩序の公的な可視性が機序とされる（抄録）。", "fun": "法律で宗教を禁じた国で、教会やモスクの建物が「歴史的記念物」として残った地域と取り壊された地域があった。建物が残った地域では、禁止後も女性が働きに出たり学校に行ったりする変化が小さかった。目に入る建物が、効力を失ったはずの古い決まりを人々の中に生かし続けたという話で、規範の記憶が風景に宿ることを示している。", "unverified": "効果の大きさと標本の詳細は抄録に記載なし。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "AI曝露指標は企業の実採用をわずかしか説明しない", "title": "AI Exposure and Adoption Among U.S. Firms", "url": "https://econpapers.repec.org/RePEc:cen:wpaper:26-61", "authors": "Matthew Dey ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "14種の企業水準AI曝露指標と国勢調査局の採用調査を結び、曝露1標準偏差で採用確率が4〜11ポイント高いが説明力は限定的だと示した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "研究で広く使われる企業のAI曝露指標が、実際のAI採用をどの程度説明するかを直接の採用データと結びつけて調べた。", "p3": "文献の職業別曝露推定と労働統計局の職業雇用構成から14種の企業水準曝露指標を作り、国勢調査局のBusiness Trends and Outlook Surveyの企業AI採用と結びつける（抄録）。", "p5": "曝露は採用と正で有意に関連するが、分散の説明力は限定的。標準化した曝露1標準偏差の増加は採用確率4〜11ポイント高と結びつき、年と小分類の固定効果を入れると1〜8ポイントに下がる。企業規模と部門で異質性がある（抄録）。", "fun": "「この仕事はAIに置き換えられやすい」という指標は、研究でよく使われる。しかし、置き換えられやすい仕事が多い会社が本当にAIを使っているかは別問題だった。両者をつなぐと関係はあるが弱く、曝露が高くても使っていない会社がたくさんある。指標は目安であって現実の採用ではない、という当たり前だが見落とされがちな事実を数字で示した。", "unverified": "14指標の内訳と企業数は抄録に記載なし。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "AIが自動化する側で金融政策の効きが変わる", "title": "It Matters Who Gets Automated: Monetary Policy in an AI Economy", "url": "https://econpapers.repec.org/RePEc:diw:diwwpp:dp2184", "authors": "Alina Ermolaeva ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "2部門の異質主体ニューケインジアンモデルで、AI経済では同じ利下げがより大きく効き、その増幅が自動化されない労働者を通じて生じることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIが一部の部門を自動化する経済では、同じ利下げがより大きく効き、その増幅は自動化されない労働者を通じて起きることをモデルで示した。", "p3": "AIが片方の部門のタスクを自動化し他方は守られる2部門の異質主体ニューケインジアンモデル（タスクに基づく生産）を作り、AIのある定常状態とない状態で同じ利下げの効果を比べる（抄録）。", "p5": "AI定常状態では資本が多く、労働所得は曝露部門（労働時間で損）から保護部門（賃金上昇で得）へ移る。利下げはAI経済でマクロ集計量をより強く刺激し、投資の反応は大きな資本基盤の上で同じ強さなので需要がより増える。機械が曝露部門の需要の一部を吸収し、保護部門の分は労働所得になって支出される（抄録）。", "fun": "AIが仕事を奪う話は多いが、この研究は「AIが入ると中央銀行の金利操作の効き目が変わる」という別の角度を取った。AI経済では機械が多いので投資が同じ割合でも金額が大きく、しかもその恩恵は自動化されなかった人の賃金に流れて消費される。誰が自動化されるかが金融政策の強さまで決めるという意外なつながりである。", "unverified": "増幅の大きさの数値は抄録に記載なし。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "政権の利下げ圧力を市場は1bp織り込む", "title": "Jawboning the Fed: Do Markets Listen When Administrations Talk?", "url": "https://arxiv.org/abs/2610.32300", "authors": "Michela Baretti ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "1988〜2025年のロイター記事をLLMで分類し、ハト派的圧力1件が短期金利期待を約1bp下げ、3か月で消えることを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "政権が連邦準備制度に金融緩和を迫る「口先介入」を市場が将来の金融政策の信号として織り込むかを、約40年の報道で初めて体系的に測った。", "p3": "1988〜2025年のロイター記事をオープンウェイトのLLM集団でハト派・タカ派の圧力に分類し、金利期待の期間構造、ドル、インフレ補償、ボラティリティの日次反応を推定する（抄録）。", "p5": "ハト派的圧力1件で短期金利期待が約1ベーシスポイント下がり（次回FOMCでの利下げ確率4%増に相当）、効果は単調に減衰して3か月で消える。タカ派的圧力は効果なし。トランプ政権期を除いても推定は弱まらず、ドル安を伴い、インフレ補償とボラティリティは安定していた（抄録）。", "fun": "大統領が「金利を下げろ」と中央銀行に圧力をかけるニュースは、市場にとって意味があるのか。40年分の記事をAIに読ませて数えると、圧力1回につき市場はほんの少し（1ベーシスポイント）利下げを織り込み、3か月で忘れる。しかもこれは信用の低下ではなく「本当に緩和が来る」という読みだった。政治の言葉が値段に変わる瞬間を測った研究である。", "unverified": "分類に使ったLLMの名称と記事件数は抄録に記載なし。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "関税の段階的改定がマクロ反応をこぶ型にする", "title": "Tariff Staggering", "url": "https://doi.org/10.3386/w35957", "authors": "Stephanie Schmitt-Grohé ほか", "venue": "NBER Working Paper", "why": "HS6桁の関税パネルで四半期に20%が上がり20%が下がる事実から段階的関税設定モデルを構築し、貿易収支中立性が崩れることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "関税が品目ごとにばらばらの時期に改定されるという事実をモデルに組み込み、関税ショックへのマクロ経済の反応がこぶ型になり、貿易収支の中立性が崩れることを示した。", "p3": "HS6桁の米国輸入・関税パネルで改定の頻度を記録し、段階的（スタガード）な関税設定のモデルを動学的開放経済に埋め込む（抄録）。", "p5": "典型的な四半期に関税の約20%が上がり、20%が下がり、60%は不変。段階的改定は平均関税の動きを変えてこぶ型の反応を生み、恒久的な関税引上げに対するRazin–Svenssonの貿易収支中立性を覆す。関税のばらつきは一次の効果を持ち、平均を変えずにばらつきを無くすと一時的な関税引下げに似た効果がある（抄録）。", "fun": "関税は一斉に上がるのではなく、品目ごとに少しずつ時期をずらして変わる。すると人々は「これから平均が上がる」と先読みして輸入を前倒しする。この研究はその当たり前の時間差を理論に入れると、教科書の結論（恒久的な関税は貿易収支を変えない）が成り立たなくなることを示した。細かい事実が大きな結論を動かす例である。", "unverified": "パネルの期間と推定値の大きさは抄録に記載なし。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "ネットワーク波及下の処置配分規則の後悔上界", "title": "Optimal Treatment Assignment Rules on Networked Populations", "url": "https://arxiv.org/abs/2610.32735", "authors": "Abhishek Ananth", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "ネットワーク波及のある母集団で限られた処置を配分する規則の厚生を転送逆確率重みで識別し、Natarajan次元に基づく有限標本の後悔上界と下界を導いた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ネットワーク上で波及効果のある処置を限られた数だけ配分する計画問題について、実験データから厚生を識別し、有限標本の後悔上界と下界を導いた。", "p3": "目標母集団の共変量とネットワーク特徴から実行可能な配分へ写す大域的な処置規則を定義し、局所反応・安定性・サポート・政策関連の重なりの条件下で転送逆確率重み付けの規準により厚生を識別して経験的厚生最大化を行う。規則クラスの複雑さはNatarajan次元で測る（抄録）。", "p5": "有界な最大次数を課さない二者間のネットワーク形成の下で上界を導き、ミニマックス下界で対応する速度を示した。大域的な最適規則と個人ごとの局所規則の厚生差を上下から評価し、実データで較正した比較でその大きさを示した（抄録）。", "fun": "ワクチンや補助金を配るとき、受け取った人の周りにも効果が波及するなら「誰に配るか」は一人ずつ決めるより全体で決めた方がよい。この研究は、少数の試験データからその最善の配り方をどれだけ正確に学べるかの理論的な限界を示した。友人関係のつながりが、配分の難しさを決めるという話である。", "unverified": "後悔上界の具体的な速度と応用例の内容は抄録に記載なし。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "AIで書く費用が下がると検証される論文が消える", "title": "AI-Augmented Research: Free to Write, Costly to Read", "url": "https://arxiv.org/abs/2610.32355", "authors": "Wolfgang Kuhle", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "書く費用が読む費用より速く下がるモデルで、検証される論文の帯が縮み評判だけが影響を決めること、同じAIで書かれた論文が閾値を超えるとAI要約が誤りを継承することを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIで書く費用が読む費用より速く下がると、検証される論文の範囲が縮み、評判だけが影響を決め、AI要約も同じAIの誤りを継承するようになることをモデルで示した。", "p3": "著者は評判が異なり、時間制約のある読者（査読者など）は論文を無視・検証・信用のいずれかで扱うという理論モデル（抄録）。", "p5": "執筆費用が下がると検証される論文の帯が縮み、外部の著者は読まれず、確立した著者は検証されない。費用ゼロの極限では検証される論文の割合が消え、影響は著者の評判だけで決まる。AI要約は誤りが十分独立なときだけ信頼できる集約になり、同じAIで書かれた論文の割合が閾値を超えると要約がAIの誤りを継承し、それを正しうる独自研究を除外する（抄録）。", "fun": "論文を書くのがAIで楽になっても、読む側の時間は増えない。するとどうなるか。この理論は、読者は有名な人の論文を確かめずに信じ、無名な人の論文は読まなくなると予測する。さらに「AIに要約させれば読める」という逃げ道も、みんなが同じAIで書いていると要約が同じ間違いを繰り返すので塞がれる。書く自由が増えると読まれる自由が減るという逆説である。", "unverified": "閾値の具体的な値はモデルの仮定に依存し、抄録に数値はない。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "多状態モデルの遷移率を森で推定", "title": "Random Jump Forests", "url": "https://arxiv.org/abs/2610.32498", "authors": "Martin Bladt ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "1本の木で全遷移を同時に分割しNelson-Aalen推定量を終端に置くランダムジャンプ森を提案し、マルコフ性を仮定せず占有確率を復元する。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多状態モデルの条件付き累積遷移率と状態占有確率を、1本の木で全遷移を同時に分割する「ランダムジャンプ森」で推定するノンパラメトリック法を導入した。", "p3": "部分的に観測された軌跡を使って木が共変量空間を全遷移について同時に分割し、終端ノードにNelson–Aalen推定量を置く。占有確率は積分積（product integral）で復元し、マルコフ性を仮定しない（抄録）。", "p5": "共変量が有限個の値を取り、適切な分割条件の下で一様一致性と関数中心極限定理が成り立ち、マルコフの場合は点ごとの信頼区間と同時信頼帯が使える。シミュレーションでは正しく指定された基準モデルに近い予測精度を示し、誤指定の基準には大きく勝った。4つの生物医学データで例示し、Rパッケージとして実装（抄録）。", "fun": "病気の「健康→発症→回復→再発」のような状態の移り変わりを、人の特徴ごとに予測したい。従来は遷移の一本一本に別々のモデルを作っていたが、この研究は1本の決定木で全ての遷移を同時に分け、森にして平均する。しかも「次の状態は今の状態だけで決まる」という仮定なしに、各状態にいる確率を計算できる。", "unverified": "4つの生物医学データの内容は抄録に記載なし。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "連続と二値が混じる応答の分布回帰", "title": "Mixed Engression: Distributional Regression for Multivariate Mixed-Type Responses", "url": "https://arxiv.org/abs/2610.32850", "authors": "Seyong Hwang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "有界な食い違いによるエネルギー損失で連続生成器を学習し二値成分を閾値化する混合エングレッションを提案し、非漸近誤差限界を与えた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "連続と二値の成分が混じる多変量応答の条件付き分布を、有界な食い違いによるエネルギー損失で学習した生成器と閾値化で推定する「混合エングレッション」を提案した。", "p3": "連続生成器をエネルギー損失で適合し、軟らかい二値出力を閾値化して混合応答の標本を作る。応答全体のエネルギー距離が閾値化前に0に近づいても閾値化後は0から離れうることを示し、二値ベクトル全体への別のエネルギー損失を足した拡張損失で学習する（抄録）。", "p5": "構造関数の合成的な滑らかさと一様な閾値マージン条件の下で、ガウスまたはStudent-t雑音のモデルに対するスパースReLU推定量の非漸近誤差限界を導き、対数因子を除く多項式収束率を得た。シミュレーションでは比較手法より精度が高く、重い裾でも有効（抄録）。", "fun": "「買うか買わないか」（はい・いいえ）と「いくら使うか」（金額）のように、種類の違う答えが同時に出る問題は、両方の関係まで含めて予測するのが難しい。この研究は、まず全部を連続量として生成し、はい・いいえの部分だけ後から切り分けるが、切り分けると見えなくなる誤差があることを見抜き、それを別に測る仕組みを足した。", "unverified": "比較手法の名称と数値は抄録に記載なし。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "距離空間に値をとる空間データのクリギング", "title": "Fr\\'echet Kriging for Metric Space-Valued Spatial Data", "url": "https://arxiv.org/abs/2610.32979", "authors": "Ryo Okano ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "重み付きフレシェ平均と一般化バリオグラムで確率分布や正定値行列などの空間予測を行い、代理最適性と一致性を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "確率分布や正定値行列、ネットワークのような距離空間に値をとる空間データの予測を、重み付きフレシェ平均と一般化バリオグラムで行う「フレシェ・クリギング」を導入した。", "p3": "通常クリギングの重み付き平均を重み付きフレシェ平均に置き換え、重みは一般化バリオグラムで特徴づけた空間依存構造から決める。線形空間への埋め込みを要しない（抄録）。", "p5": "代理最適性と、固定した作業バリオグラムの誤指定の下での一致性を適切な正則性条件で示した。一変量分布と正定値行列のシミュレーションで既存法より良い予測性能を示し、日平均気温の超過確率、日最低・最高気温の同時密度、産業間資金フローのネットワークに応用した（抄録）。", "fun": "地図上の観測点から間の地点の値を補間する「クリギング」は、値が1つの数のときの方法である。この研究は、各地点の値が「気温の分布そのもの」や「産業どうしのお金の流れの網」であっても、距離さえ定義できれば補間できるように拡張した。平均の代わりに「一番真ん中にある分布」を探すという発想である。", "unverified": "既存法との数値比較の結果は抄録に記載なし。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "傾向スコアのスプラインで試験結果を母集団へ", "title": "Bayesian Propensity Score Predictive Inference for Extending Trial Findings to Target Populations", "url": "https://arxiv.org/abs/2610.31915", "authors": "Jungang Zou ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "BARTと標本抽出傾向スコアの自然3次スプラインを組み合わせ、共変量シフト下で試験の知見を電子カルテ由来の集団へ外挿する。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "無作為化試験の知見を共変量分布の異なる目標母集団へ外挿するための、傾向スコアのスプラインとBARTを組み合わせたベイズ予測推論（PSPI）を提案した。", "p3": "高次元共変量にベイズ加法回帰木を使い、標本抽出の傾向スコアには自然3次スプラインを置く。処置効果項のみ、または予後項と処置効果項の両方にスプラインを入れる2変種で、選択に関わる変動を別に正則化し、境界ノットの外側に明示的な外挿規則を与える。傾向スコアは逆Gumbel変換で0付近の圧縮と外挿の程度を均す（抄録）。", "p5": "シミュレーションではスプライン型PSPIが競合法より低いRMSEとほぼ名目の被覆率を示し、特に大きな共変量シフトで優れた。急性冠症候群後の抑うつケア介入のCODIACS Vanguard試験をAll of Usの電子カルテから作った2コホートへ外挿すると、未調整の試験推定より大きな介入効果が推定された（抄録）。", "fun": "ある病院で効いた治療が、年齢や持病の分布が違う別の集団でも効くかは、試験の結果をそのまま当てはめても分からない。この研究は「その人が試験に選ばれやすかった度合い」を軸にした滑らかな曲線で効果の変わり方を表し、試験にいなかったタイプの人への外挿の仕方まで明示した。試験の外の世界に結果を運ぶ道具である。", "unverified": "応用での効果の数値と比較法の名称は抄録に記載なし。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "スティッキーPDMPでスパースなベイズNNを厳密抽出", "title": "Sparse Bayesian Neural Networks via Sticky Piecewise Deterministic Markov Processes", "url": "https://arxiv.org/abs/2610.32753", "authors": "August Arnstad ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "区分的決定論マルコフ過程でベイズニューラルネットの事後分布を漸近的に厳密に標本化し、スパイク・スラブ事前分布で重みを正確に0にする。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "区分的決定論マルコフ過程（PDMP）に基づくモンテカルロ法で、スパイク・スラブ事前分布を持つベイズニューラルネットの事後分布を漸近的に厳密に標本化し、重みを正確に0に落とす疎なベイズNNを得た。", "p3": "数値的に構成したレート上界が成り立つ限りPDMPで事後分布を標本化し、「スティッキー」版のPDMPで重みを0に留めることでスパイク・スラブ事前分布を取り込む（抄録）。", "p5": "サンプラーの予測性能と収束を調べ、この方法で得た疎なベイズNNが密なものより入力雑音に頑健でありうることを示した（抄録）。", "fun": "ニューラルネットの性能は実はごく一部の重みで決まり、残りは刈り込める。普通は学習してから刈るが、この研究は確率論の枠組みで「この重みは0でよい」という判断まで不確実性つきで同時に行う。粒子が壁に当たって貼りつくように重みが0に貼りつく「スティッキー」な乱数の動きで、それを厳密に実現した。", "unverified": "実験に使ったネットワークとデータの規模は抄録に記載なし。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "動的処置方針の縦断因果効果を文脈内で推定", "title": "A Foundation Model for Policy In-Context Longitudinal Causal Effect Estimation", "url": "https://arxiv.org/abs/2610.32863", "authors": "Wenxin Chen ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "合成の構造因果モデルで事前学習した基盤モデルが、新しい観測データと方針から1回の順伝播で条件付き潜在結果を予測する。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "時間変化する交絡とフィードバックのある縦断データで、動的な処置方針の因果効果を文脈内で推定する初の基盤モデルPICLE-PFNを提案した。", "p3": "目標方針を履歴と判断の実演例として文脈で表し、縦断構造因果モデルから標本した合成データで事前学習した事前データ適合ネットワークが、新しい観測データと方針から条件付き平均潜在結果を1回の順伝播で予測する（抄録）。", "p5": "合成・半合成の縦断ベンチマークで、データごとに学習・調整した最先端の推定量に匹敵するRMSEと、大きく改善した不確実性の較正を、展開時の計算時間の数分の一で達成した（抄録）。", "fun": "「この患者に今後こういう方針で治療したらどうなるか」という問いは、過去の治療が後の状態を変え、その状態が次の治療を変えるという絡まりのせいで難しい。この研究は、人工的に作った無数の因果の世界で訓練したAIに、新しいデータと方針の例を見せるだけで答えさせる。問題ごとにモデルを作り直さなくてよいのが新しい。", "unverified": "ベンチマークの名称と数値は抄録に記載なし。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "エージェント進化手法を比較する共通基盤", "title": "RSIHub: A Composable Framework for Agent-Evolution Methods", "url": "https://arxiv.org/abs/2610.32253", "authors": "Zimu Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "why": "AHE・Hyperagents・A-Evolve・GEPAを共通の実行・評価・系譜管理の上で比較し、最大13.5ポイントの改善と手法順位の設定依存を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "実行フィードバックでプロンプト・スキル・ツール・編成を改善するエージェント進化手法を、共通の基盤の上で構築・比較・拡張できるオープンソース枠組みRSIHubを示した。", "p3": "レシピが再利用可能な演算子を組み合わせて可変資源を宣言し、RSIHubが実行・評価・回復・系譜を提供する。評価は可変部分の外に置き、結果を候補と評価条件に結びつける。AHE・Hyperagents・A-Evolve・GEPAを中核を変えずに実装した（抄録）。", "p5": "MiniSWEとCodexをTerminal Bench 2とτ³ Bankingで固定のモデル・評価器設定の下で評価し、最大で13.5ポイントのpass@1の改善を観測したが、手法の順位は設定で変わり、最適化の利得は保留課題に必ずしも移らなかった（抄録）。", "fun": "AIが自分の指示書や道具を改良して賢くなる研究が増えているが、各研究が同じ実験装置を一から作り直していた。この研究はその装置を共通化し、4つの有名な手法を同じ土俵で比べた。すると最大13.5ポイント伸びる一方で、どの手法が一番かは課題次第で入れ替わり、練習問題で伸びた分が本番で消えることもあった。", "unverified": "各手法の個別の数値は抄録に記載なし。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "理解と映像予測を統合した身体化基盤モデル", "title": "RynnUnify: Towards Unified Embodied Brain", "url": "https://arxiv.org/abs/2610.32965", "authors": "Minghao Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "why": "16Bの統合モデルが空間推論と長期の視覚計画を結び、ロボット制御への拡張で実機3課題平均46.7%の成功率を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "身体化された理解と長期の視覚計画を、映像と言語を交互に挟んだ推論で結びつける16Bの統合モデルRynnUnifyを示し、ロボット制御へも拡張した。", "p3": "空間推論・物理予測・接地の能力の上に、観測されない状態と相互作用の結果を推論するために映像予測を選択的に使うエージェント拡張を強化学習で作り、理解と予測をロボット制御に変換する世界-行動拡張も作る。評価用にRynn-VPとRynn-GEUを導入（抄録）。", "p5": "評価した統合マルチモーダルモデルの中で最高の平均身体化理解スコアを示し、Rynn-VPでCosmos 3 Nanoを9.75点上回る。エージェント拡張はRynn-GEUで直接推論より平均6.0点改善し、世界-行動拡張はRoboCasa365の20複合課題で51.5%、実機3課題で平均46.7%の成功率（抄録）。", "fun": "人は「このコップを押すとどう転がるか」を頭の中で映像として先読みしてから手を動かす。このモデルは言葉と映像を交互に使って同じことをし、必要なときだけ未来の映像を想像してから判断する。想像のおかげで成績が上がり、さらに実際のロボットも動かせた。考えることと見ることを一つにしようとする試みである。", "unverified": "比較した他モデルの名称と学習データの規模は抄録に記載なし。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "全重みを共有された離散判断の経路で表す", "title": "Every Weight Is a Path of Shared Discrete Decisions", "url": "https://arxiv.org/abs/2610.31931", "authors": "Ammar Ali ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "why": "重みを符号・2の冪・ゼロゲートの経路で表すTWIGにより、圧縮手法を1つの最適化に統一し、固定重み回路やアニーラで解ける問題に写す。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ニューラルネットの全ての重みを、符号・2の冪のシフト・ゼロゲート・共有表の索引という小さな離散判断の経路の終点として表すTWIGを導入し、圧縮・回路化・離散最適化を1つの対象に統一した。", "p3": "まとまりのある重みは経路の上部を共有し、各判断は下の全重みに継承されて1回だけ保存・適用される。学習済みの任意のネットはTWIGに書け、判断が2の冪なら重み層は配線と加算器だけの回路になる。判断の選択は木の経路に沿った高次ボルツマンマシンの基底状態問題になる（抄録）。", "p5": "枝刈り・量子化・低ランク分解・コードブック・重み共有が1つの対象の編集になり、単一の最適化器で選べる。既存の重み形式（グループスケール、共有指数、スパース重みなど）は浅いTWIGとして追加費用なしで表せる。LLMの5つの重み行列での実験に言及するが数値は抄録で切れている（抄録）。", "fun": "AIの重みを小さくする方法は、刈る・丸める・分解する・表を共有する、とばらばらに発展してきた。この研究は重み1つ1つを「符号はプラス、2の何乗、ゼロにするか」という小さな選択の連なりとして書き直すと、全部が同じ木の編集になると気づいた。しかも2の冪だけで作ると掛け算が要らず、配線と足し算だけの回路になる。", "unverified": "LLMでの実験結果の数値は抄録が途中で切れており未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "教師も正解もなくLLMが自己学習で改善", "title": "On-Policy Self-Training: Data-Free Self-Improvement in Large Language Models", "url": "https://arxiv.org/abs/2610.32770", "authors": "Leon Sick ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-26", "why": "粗い話題記述だけから問いと特権的推論を自己生成し、自己蒸留で複数領域の性能を上げつつ他領域の能力を保つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（Hugging Face経由で候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "正解つきの問題や人が用意した問題集なしに、粗い話題の記述だけからモデル自身が問いと特権的な推論の手本を生成し、自己蒸留で性能を上げる自己学習の枠組みを示した。", "p3": "方策上の自己蒸留を自己学習として再定式化し、高水準の話題記述に導かれてモデルが自分のカリキュラム（問いと特権的な推論の軌跡）を合成する（抄録）。", "p5": "完全に合成された特権情報での自己蒸留により、複数領域で改善しつつ自己学習していない領域の能力を保った。テキストとマルチモーダルの両方で一般性を示し、標準的な言語ベンチマークと視覚質問応答で一貫した自己改善を得た（抄録）。", "fun": "先生も答え合わせもなしに、AIが自分で問題を作り、自分で解き方の手本を書き、それを自分に教えて賢くなれるのか。この研究は「この分野について」という大まかな指示だけでそれができ、しかも他の分野の力を失わなかったと報告する。もともと持っていた眠った能力を、自分で引き出したという解釈である。", "unverified": "改善幅の数値と使用モデルは抄録に記載なし。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "トランスフォーマー理論は単独では挙動を説明できない", "title": "Putting Transformer Theories to the Test", "url": "https://arxiv.org/abs/2610.32104", "authors": "Awni Altabaa ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "7つの形式理論の予測を共通の課題行列にまとめ、実験でどの理論も成功・失敗のパターンを説明できないことを示し、理論に必要な要素を特定した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "トランスフォーマーの能力を説明する7つの形式理論の予測を共通の課題行列にまとめ、制御実験で検証し、どの理論も単独では成功と失敗のパターンを説明できないことを示した。", "p3": "Star-free、AC⁰、TC⁰、C-RASP、MPC、BAPO、Sensitivityの7理論の結果を、計算構造の異なる課題群に対する予測の行列に翻訳し、欠けている部分に新しい理論結果を加える。分布内の標本複雑度、長さ汎化、事前学習済みモデルの性能で検証する（抄録）。", "p5": "C-RASPが難しいと予測するk-hop帰納課題で、小さなトランスフォーマーが長さ汎化した。硬い注意を仮定するAC⁰やBAPOが難しいとする二値多数決も実際には成功した。理論は、軟らかい注意、内容依存の動的検索、位置ごとの有界計算、学習可能性の説明を備える必要があると結論（抄録）。", "fun": "「この種のAIにはこういう問題が解けないはずだ」という理論がいくつもあるが、互いに違うことを言う。この研究は全理論の予言を一覧表にして、実際に小さなモデルを訓練して試した。すると「解けないはず」の問題を解いてしまう例がいくつも出た。理論の思い込み（注意は硬い、など）がどこで外れるかが浮かび上がった。", "unverified": "課題の総数と実験規模は抄録に記載なし。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "RLの批評家をそのまま信頼度推定器に使える", "title": "Free Lunch for LLMs Confidence: The RL Critic Already Knows", "url": "https://arxiv.org/abs/2610.31820", "authors": "Shujin Wu ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "正誤に基づく報酬では信頼度推定と批評家学習が等価であることを証明し、既存の批評家が追加学習なしで最良の信頼度推定器になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "正誤に基づく報酬の下では信頼度推定と強化学習の批評家（価値関数）の学習が等価であることを示し、価値ベースRLで訓練したLLMの既存の批評家を追加学習なしで信頼度推定器として使えることを示した。", "p3": "同じ（問い、応答、正誤）の三つ組で訓練した同程度の容量の自己推定器と外部推定器を比べ、方策の挙動記録だけで訓練した外部モデルが内部表現なしに方策と同等の信頼度を推定できることを示す。そこから信頼度推定と批評家訓練の等価性を証明する（抄録）。", "p5": "数学・コード・ツール呼び出し・一般推論の十数領域で、再利用した批評家は分布内の全分割で最良の信頼度推定器であり、16分割中14で最も較正がよく、課題性能を損なわなかった。推論の途中段階でも信頼度を出せる（抄録）。", "fun": "AIに「その答えにどれくらい自信があるか」を言わせるには、普通は追加の訓練が要る。この研究は、強化学習でAIを鍛えるときに脇で「この手は当たりそうか」を予測していた相棒（批評家）が、実は自信の推定そのものをやっていたことに気づいた。すでにある部品をそのまま流用できるという、文字どおり「ただ飯」の発見である。", "unverified": "比較した専用の信頼度推定法の名称は抄録に記載なし。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "ヒントによる答えの変化は指数的傾きに従う", "title": "How Much Do You Trust A Dog? Quantifying Hint-Following in Reasoning Language Models", "url": "https://arxiv.org/abs/2610.32055", "authors": "Anxin Guo ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "教授・友人・犬といった情報源のヒントが答えの対数オッズをほぼ一定量ずらし、情報源を信頼するなと警告しても消えないことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "「〇〇は答えが(X)だと思う」というヒントが推論モデルの答えをどう動かすかを定量化し、ヒントの効果が情報源の信頼性に合わせて較正されていないことを示した。", "p3": "MMLUの問いに、教授・友人・犬という情報源を変えたヒントを付け、Qwen・Gemma・SmolLMの3系統で答えの変化を測る。ヒント反応の形式的な分解を導入し、KL正則化つき報酬学習が分布をどう変えるかを合成実験で示す（抄録）。", "p5": "ヒントはヒント先の答えの対数オッズをほぼ一定量ずらす指数的傾きで表され、問いと対象の感受性は情報源によらず共有される。情報源が不正確だと宣言しても、信用するなと明示しても、ずれは残った（抄録）。", "fun": "「犬はこの答えだと思っている」と言われても普通は無視するが、AIは律儀に影響を受けた。しかも影響の仕方は数式でぴたりと表せる単純なもので、「この情報源は当てにならない」と注意しても減らなかった。人の言葉に合わせてしまうAIの癖が、誰が言ったかを区別できていないことを数で示した。", "unverified": "ずれの大きさの数値は抄録に記載なし。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "MXFP4での混合専門家LLM訓練をBF16に迫らせる", "title": "Training an MoE LLM in MXFP4: How We Closed the Gap to BF16", "url": "https://arxiv.org/abs/2610.32229", "authors": "Han Wang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "20BのMoEモデルを4ビット微細スケーリング形式で訓練し、重みの振動抑制でBF16との損失差を0.007に縮めた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "20BパラメータのMoE型LLMをMXFP4（4ビット微細スケーリング形式）で訓練する公開レシピALTOを示し、BF16との差をほぼ閉じた。", "p3": "GPT-OSS-20BをMLPerf Small MoE Trainingベンチマークで、1D/2Dのブロック量子化・無作為化アダマール変換・確率的丸めに、TetraJet-v2から簡略化した重みの振動抑制を組み合わせて訓練する。AMD MI300上の模擬MXFP4カーネルを使用（抄録）。", "p5": "C4検証でバッチ16・16,128ステップの損失が3.3350で、BF16の3.3283との差は0.007。振動抑制なし（3.3418）が残した差の約50%を閉じた。品質目標到達までのステップ数で見たFP4の収束オーバーヘッドは+20.0%から+5.0%に減少。差分勾配推定や外れ値クリッピングなどは演算子単位でSNRが上がっても全体では効かなかった（抄録）。", "fun": "AIの計算を4ビットという極端に粗い数で行うと速く安くなるが、丸め誤差で学習が崩れやすい。この研究は、重みが丸めの境目で行ったり来たりして揺れるのを抑える工夫などで、16ビットとほぼ同じ品質に近づけた。うまくいかなかった工夫も正直に報告しているのが実務的である。", "unverified": "実時間の速度は最適化されておらず、著者も未報告としている。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "従属打ち切り下の生存予測性能の部分識別", "title": "Partial Identification of Survival Prediction Performance under Dependent Right Censoring", "url": "https://arxiv.org/abs/2610.32488", "authors": "Yuji Komiyama ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "打ち切りと事象の依存を制約せずに積分Brierスコアとその差の鋭い限界を導き、頑健な優越の検定を与えた。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "打ち切りと事象時間の依存を一切制約せずに、生存予測モデルの積分Brierスコアとモデル間の差の鋭い限界を部分識別で導き、頑健な優越の検定を与えた。", "p3": "各個人の事象時間が評価時点とモデルをまたいで共有される事実を使って限界を導く。3モデル以上では最良の競合との差の鋭い上界も導出。固定した観測分布に対する推定量、信頼領域、頑健な厳密優越の検定、積集合-和集合検定を構成する（抄録）。", "p5": "シミュレーションで信頼領域と対ごとの検定はほぼ名目水準。3つの応用では、打ち切りの少ない住宅ローン前払いデータでのみ検定がIPCWによる順位を支持し、他の2データでは観測データだけでは順位を支持できなかった（抄録）。", "fun": "「誰がいつ亡くなるか」を予測するモデルの良し悪しは、途中で追跡が途切れた人（打ち切り）の扱いで変わる。標準の方法は途切れ方が結果と無関係だと仮定するが、それは確かめようがない。この研究はその仮定を置かず「どんな場合でもこちらが勝つ」と言える範囲を計算した。すると3つの例のうち2つでは、どちらが良いか実は決められなかった。", "unverified": "2つのデータセットの内容は抄録に記載なし。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "現金給付が女性の危険な性行動を減らす", "title": "Sex and Subsistence: Income Effects on Risky Sexual Behavior and Partner Selection", "url": "https://doi.org/10.3386/w35940", "authors": "Natalie Bau ほか", "venue": "NBER Working Paper", "why": "ザンビアの女子学生への月次現金給付のRCTで、性交渉が5.1ポイント減り、避妊なしの性交渉が30%減ることを高頻度データで示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ザンビア大学の女子学生への月次現金給付の無作為化比較試験で、一時的な収入増が性行動とパートナー選択を変え、リスクの高い性行動を減らすことを示した。", "p3": "現金給付のRCTと、性行動とパートナーの特徴に関する詳細で高頻度のデータを組み合わせる。結果を、交際相手か経済的支援をくれる高所得の相手かを探し、送金とコンドーム使用を交渉する動学的なパートナー探索モデルで説明する（抄録）。", "p5": "処置群は給付期間中に性交渉を持つ確率が5.1ポイント低く、避妊なしの性交渉は30%減。ベースラインで性的に活発でなかった女性では性交渉の確率が43%減り、相手の質が大きく改善した。給付は食料の安定、精神健康、認知能力も高めた（抄録）。", "fun": "性行動は個人の好みの問題と思われがちだが、この実験は「お金を渡すと変わる」ことを示した。大学生という比較的恵まれた集団でも、収入が増えると危険な性行動が減り、相手選びも変わった。性行動のかなりの部分が生活費の必要から来ていたという、重い事実を無作為化実験で明らかにしている。", "unverified": "給付額と参加人数は抄録に記載なし。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "高齢者の治験費用補助が薬の開発と採用を変える", "title": "Representation, Innovation, and Product Adoption", "url": "https://doi.org/10.3386/w35936", "authors": "Jennifer L. Kao ほか", "venue": "NBER Working Paper", "why": "2000年のMedicareの治験費用補助で高齢者の治験参加が増え、高齢者に多い疾患の治験と新薬利用が増えたことを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "製品開発で特定の集団を参加させる費用を下げると、その集団の代表性、その後のイノベーション、製品の採用がどう変わるかを、2000年のMedicareによる高齢者の治験費用補助で検証した。", "p3": "歴史的に過小代表だった高齢者の治験費用をMedicareが補助した政策を自然実験とし、治験の適格条件と参加者構成、治験数、新薬の利用、治験結果・有害事象・承認を追う（抄録）。", "p5": "治験の依頼者は適格条件を高齢者に広げ、高齢参加者の割合を増やした。高齢者に多い疾患の治験数が即座に大きく増え、特に未承認薬と、承認薬の新しい疾患への試験で増加。新たに試験された薬の高齢者での利用が増えた（抄録）。", "fun": "新薬の試験に高齢者があまり参加していなかったのは、高齢者向けの保険が治験の費用を出さなかったからでもあった。保険が費用を持つようにした途端、製薬会社は高齢者を対象に加え、高齢者に多い病気の治験が増え、結果として高齢者が使える薬が増えた。誰を試験に入れるかという地味な費用の問題が、何が発明されるかを変えた。", "unverified": "増加の大きさの数値は抄録に記載なし。"}}, {"id": "pn42", "rank": 42, "field": "経営学", "headline": "海外で起業する創業者は資金は得るが成功は選択的", "title": "Global Entrepreneurial Talent Flows: Widely Funded, Selectively Successful?", "url": "https://doi.org/10.3386/w35943", "authors": "Paul Gompers ほか", "venue": "NBER Working Paper", "why": "213か国91万の創業者-企業対で、国外創業者と帰国者は早期資金を得やすいが成功プレミアムは米英に集中することを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "213か国の創業者91万人超の経歴から、国外で起業する創業者と帰国者は資金調達には有利だが、成功プレミアムは米英に集中することを示した。", "p3": "1990〜2026年の913,226の創業者-企業対で、国外で起業する「expat」と海外経験後に帰国した「returnee」を、同じ国の比較可能な現地創業者と比べる（抄録）。", "p5": "expatもreturneeも世界的に早期資金を得やすい。しかしexpatの成功プレミアムは米国（18%）と英国（26%）に集中し、特に大学院・就労・直接の創業で米国に入った人で大きい。returneeはそうしたプレミアムをほとんど示さない（抄録）。", "fun": "米国では移民の創業者が地元の創業者より成功しやすいと知られている。それは世界中どこでも成り立つのか。91万人の経歴で確かめると、外国から来た創業者はどの国でもお金は集めやすいが、本当に成功しやすいのは米国と英国だけだった。資金は国境を越えて人について回るが、成功は場所を選ぶという結果である。", "unverified": "成功の定義と比較群の作り方は抄録に記載なし。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "AI発展が都市の画期的イノベーションを促す", "title": "Artificial Intelligence Development and Breakthrough Innovation in Chinese Cities: Evidence from Patent Citations", "url": "https://doi.org/10.2139/ssrn.7669841", "authors": "Ziruo Zheng ほか", "venue": "SSRN", "date": "2026-10-25", "why": "中国228都市2010〜2022年のパネルでAI発展が画期的特許を増やし、負の空間波及があることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国228都市の2010〜2022年パネルで、AIの発展が都市の画期的イノベーション（特許引用で測る）を高めることを示した。", "p3": "二方向固定効果モデルと空間計量モデルで効果を推定し、機序（技術によるエンパワーメントと人材構造の最適化）、非線形性、空間波及を調べる（抄録）。", "p5": "AI発展は画期的イノベーションを有意に高め、効果は南部・沿岸部、人口が多く起業が活発な都市で大きい。非線形の関係は見られず、負の空間波及が確認された（抄録）。", "fun": "AIが進んだ都市ほど「それまでにない発明」が生まれるのか。中国の228都市を12年追うと答えは「はい」だったが、隣の都市にはマイナスの影響が出た。人材や資源が集まる都市が周りから吸い上げている可能性があり、AIの恩恵が地域の間で偏ることを示している。", "unverified": "画期的イノベーションの具体的な定義と効果の大きさは抄録に記載なし。"}}, {"id": "pn44", "rank": 44, "field": "経営学", "headline": "EUの研究政策を出現と規模化で使い分ける", "title": "From research & innovation to deployment - Tapping into the R&I policy potential to transform knowledge into products", "url": "https://econpapers.repec.org/RePEc:eug:wpaper:ki-01-26-097-en-n", "authors": "Bianca CAVICCHI ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "政策シミュレーションRADARで、出現支援は製品開発に、規模化支援は設備・雇用・市場獲得に効き時間軸が異なることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "EUの研究・イノベーション政策が、知識の生成から戦略技術の展開と産業的な規模化への移行をどう支えられるかを、政策シミュレーションモデルRADARで検討した。", "p3": "出現志向と産業規模化志向の2種類の政策が、研究成果の商業化・採用にどう効くかを模擬する（抄録）。", "p5": "2つの政策論理は異なる成果に異なる時間軸で効く。早期の出現支援は製品開発に、規模化支援は上流基盤ができた後の設備容量・雇用・市場獲得に重要。結果は探索的なシナリオの証拠であり予測や最適政策ではない（抄録）。", "fun": "研究への補助金は「新しい芽を出す」段階と「育った技術を工場にする」段階で効き方が違う。この模擬実験では、芽の段階の支援は製品づくりに効き、規模化の支援は雇用や市場の獲得に効いたが、順番を間違えると効かない。政策にも「いつ」が重要だという整理である。", "unverified": "モデルの構造と対象技術領域の詳細は抄録に記載なし。"}}, {"id": "pn45", "rank": 45, "field": "組織行動・心理的安全性", "headline": "AI支援研究を統御する5原則TRACE", "title": "TRACE: Governing AI-Assisted Research with Principles from Computer Science", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.24035", "authors": "Amirhossein Zohrehvand ほか", "venue": "RePEc NEP", "date": "2026-10-26", "why": "ソフトウェア工学とセキュリティ研究の実践からAI支援研究の5原則を導き、実装する運用基盤を公開した。", "explain": {"basis": "抄録", "basis_note": "RePEc登録の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ソフトウェア工学とセキュリティ研究の実践から、AI支援研究で人が主導権を保つための5原則TRACEを導き、実装する運用基盤TRACE-OSを公開した。", "p3": "多くの貢献者が共有成果物の管理を保つための実践から原則を抽出し、AI支援研究に転用する。Track records（記録を残す）、Review against sources（出典に対して検証する）、Accept independently（独立に受理する）、Control transitions（移行を制御する）、Evaluate corrections（修正を評価する）の5つ（抄録）。", "p5": "作業単位を区切り各単位の形成に注意を払うことで、AI支援の作業をAIの生成速度ではなく人の注意に合わせて進められるとする。共有の標準が信頼を築き、委任と生産性を可能にすると論じる（抄録）。", "fun": "AIで論文や解析がどんどん作れる時代に、研究者は何を守ればよいのか。この提案は、プログラマーがチームで巨大なソフトを壊さずに開発してきた知恵（記録を残す、出典に照らす、独立に受理する）を研究に持ち込む。速さに人が引きずられないように、作業の単位を人が追える大きさに区切るという発想である。", "unverified": "TRACE-OSの実際の適用例や評価は抄録に記載なし。"}}, {"id": "pn46", "rank": 46, "field": "ヒューマンコンピュータインタラクション", "headline": "車線維持支援の表示は劣化の半分を伝えない", "title": "Silence Is Not Assurance: When Production Lane Keeping Assist Does Not Warn, and What It Costs", "url": "https://arxiv.org/abs/2610.31899", "authors": "Tianjia Yang ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "13車種39,800秒の実走行で、車線検出状態の表示が劣化秒の47%しか報告せず、沈黙時の横位置のばらつきが約60%大きいことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "市販の車線維持支援（LKA）が運転者に示す「車線を検出中」の表示が、システムの実際の認識状態をどれだけ反映するかを実走行で測り、劣化の半分しか伝えないことを示した。", "p3": "CANバスから記録した表示状態と運転者の操舵トルク、同じ道路を観測する第三者の視覚システムの車線認識信頼度の3信号を潜在クラスモデルで突き合わせるCANDID-LKAを提案し、3社13車種の39,800秒の実走行に適用（抄録）。", "p5": "表示は車線が見にくい条件に一貫して反応せず、「未検出」と報告する頻度はメーカー間で大きく違う。劣化した秒のうち表示が未検出と報告したのは47%で、第三者の低信頼度は80%。低信頼度エピソードの半分で表示は一度も未検出にならない。表示が検出中なのに認識が低く運転者も制御していない「沈黙」の秒では、続く3秒の横位置の標準偏差が約60%大きい（抄録）。", "fun": "車の運転支援は「いま車線を見ています」とランプで知らせる。ところが実際の道で調べると、本当は見失っているのにランプがついたままの時間が半分以上あり、そのあいだ車は横にふらつきやすかった。沈黙は安心の印ではないという題名のとおり、知らせないことの危うさを数字で示した。", "unverified": "車種名と第三者視覚システムの詳細は抄録に記載なし。"}}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "初学者のAI監督は正しさより適合性を見る", "title": "Beyond Correctness: How Novice Software Engineering Students Exercise Oversight of Generative AI", "url": "https://arxiv.org/abs/2610.32118", "authors": "Ali Shakiba ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "145人の学生の962の対話記録で、介入の74.4%が適合性の問題、16.9%が正しさの問題だったことを示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ソフトウェア工学の初学者が生成AIの出力をどう監督するかを、145人の学生が記録した962の対話から分析し、介入の大半が正しさではなく課題への適合性の問題だったことを示した。", "p3": "1年生145人が構造化したAI日誌に記録した学生-AIの対話962ターン（学生が宣言した介入172件を含む）を、出力の特徴・介入の理由・取った行動・実施の仕方の多次元コーディングで分析する（抄録）。", "p5": "介入の74.4%は適合性の問題、16.9%は正しさの問題。分類できた介入では出力の修正（51.0%）とプロンプトの改良（28.2%）が多く、どちらも工学的な適合に関わる。小さな欠点があると感じた出力は、完璧と感じた出力より評価の確信が低かった（抄録）。", "fun": "AIが書いたプログラムを学生が直すとき、理由は「間違っているから」だと思われがちだが、記録を見ると「動くけれどこの課題には合わない」が4件中3件だった。AIを使いこなすとは誤りを見つけることより、目的に合うかを判断することだと分かる。監督者としての学生の仕事の中身が見えた研究である。", "unverified": "コーディングの信頼性（評定者間一致）は抄録に記載なし。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "組織の個人情報風土が規制と実装を仲介", "title": "From Regulation to Engineering: Organizational Privacy Climate as Mediator", "url": "https://arxiv.org/abs/2610.32576", "authors": "Oshrat Ayalon ほか", "venue": "arXiv", "date": "Mon, 26 Oct 2026", "why": "156人の開発者のSEMで、GDPRの重要性認知が組織の個人情報風土と態度を介して実装に結びつく経路を示した。", "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の情報システム開発者156人の調査で、GDPRの重要性の認知が組織の個人情報保護の風土と態度を介して実装の実践に結びつく経路を示した。", "p3": "オンライン調査の回答を構造方程式モデルで分析し、組織の個人情報保護風土が、開発者のGDPR重要性認知と個人情報保護の態度・実践の関係を媒介するかを検証する（抄録）。", "p5": "風土はGDPR重要性認知と態度の関係を媒介し、態度は実践と結びつく。規制→風土→態度→実践の媒介連鎖が、規制の直接効果を補完する形で確認された（抄録）。", "fun": "法律で個人情報の扱いを決めても、それをプログラムに落とし込むのは現場の開発者である。この調査は、開発者が法律を重要だと思うだけでは足りず、職場に「個人情報を大事にする空気」があって初めて態度と実践に変わることを示した。規制の効き目は会社の雰囲気を通る、という結果である。", "unverified": "係数の大きさは抄録に記載なし。"}}, {"id": "pn49", "rank": 49, "field": "心理学・認知科学", "headline": "判断の偏りは低次元投影として一つに説明", "title": "The Arena Model: An Account of Human Judgment", "url": "https://doi.org/10.31234/osf.io/g342f_v2", "authors": "Nikolos Gurney", "venue": "PsyArXiv", "date": "2026-10-26", "why": "数百の認知バイアスを、高次元の世界の低次元投影で判断が動くという単一の機構から導き、反証可能な予測を与える。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "数百の認知バイアスのばらばらな一覧を、「判断は高次元の世界の低次元投影の上で行われる」という単一の説明に置き換えるアリーナモデルを提案した。", "p3": "少数の固定した機構から多くの標準的なヒューリスティクスとバイアスを導く。バイアスは、心が環境より少ない次元で働くとき、研究者が心の使った次元と違う次元を測るとき、内部信号を世界の性質として受け取るときに生じるとする（抄録）。", "p5": "測られていない次元や食い違う次元を考慮すると、合理性からの逸脱の多くが解消すると論じる。既知のバイアスとの整合性を示し、説明の限界を定義し、モデルを検証または反証する診断的な検定を提案する（抄録）。", "fun": "人間の判断のクセは「〇〇バイアス」と数百も名前がついているが、それぞれ別々の説明がある。この論文は、複雑な世界を少ない物差しで測っているだけで、ほとんどのクセが同じ理由から出てくると主張する。地図が土地を省略するように、心も世界を省略している。本当かどうかを試す方法まで提案しているのが潔い。", "unverified": "理論提案であり、新しい実験データは抄録に示されていない。"}}, {"id": "pn50", "rank": 50, "field": "心理学・認知科学", "headline": "構念名と項目と回答が一致しない心理測定", "title": "The Map Is Not the Territory: Construct Names, Items, and Responses in Measures of Mentalizing, Epistemic Trust, and Emotion Regulation", "url": "https://doi.org/10.31234/osf.io/g9fhq_v1", "authors": "Ilaria Maria Antonietta Benzi ほか", "venue": "PsyArXiv", "date": "2026-10-25", "why": "2,235人のデータで、構念名が自身の項目に最も合うのは11下位尺度中4つに過ぎず、回答は名前より項目の境界に従うことを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版の抄録（候補収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "心理学の構念の名前・質問項目・回答の3つがどれだけ対応するかを、メンタライジング・認識的信頼・感情調節の尺度で検証し、構念名と項目の対応が弱いことを示した。", "p3": "18〜29歳の1,167人（項目水準の分析は事前登録）と14〜20歳の中高生1,068人で、構念名と項目の意味的類似度を回答の相関と比べる（抄録）。", "p5": "構念名が自身の項目に最もよく合ったのは11下位尺度中4つ。項目は回答の構造を反映し（r=.62と.58）、質問紙をまたぐとやや弱い（.42と.37）。回答は名前より項目が引く境界に従った。尺度間の相関は、同じ経験を記述する項目や方法分散からも生じうる（抄録）。", "fun": "心理学の質問紙は「共感」のような名前の下に数個の質問を並べるが、この研究は名前と質問の中身が合っていない場合が多いことを示した。回答者は名前ではなく質問文に答えるので、2つの尺度の相関が「2つの性質が関係する」証拠に見えても、実は似た質問文を2回聞いていただけかもしれない。地図と土地の違いを測った研究である。", "unverified": "意味的類似度の計算方法は抄録に記載なし。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "列車応答の感度で鉄道橋の損傷を間接同定", "title": "Indirect Damage Identification Method for Railway Bridges Based on Train Response Sensiti     "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
