": "認知症のない2,993人を16年追跡し（477人が発症）、住居の周り100m・250m・500mの植生指数（NDVI）で緑を測り、Cox回帰で四分位範囲あたりのハザード比を推定し、大気汚染・騒音・水辺・年齢・性別・APOE-ε4による修飾を調べた（抄録）。", "p5": "100m以内の緑が多いほど発症が少なく（HR=0.79、95%CI 0.64〜0.96）、より広い範囲では関連が弱まった（抄録）。関連は女性（HR=0.69）で男性（HR=0.93）より強かった（抄録）。", "fun": "家の窓から見えるくらいの近さの緑が多い人ほど、16年の間に認知症になりにくかった。少し離れた公園の緑では関係が弱くなり、特に女性で関係が強かった。毎日目にする身近な自然が脳の健康と関係しているかもしれない、という結果が面白い。", "unverified": "本文が入手できず、調整した交絡因子の一覧と修飾の検定の結果は確認できていない。"}, "citescore": 13.9, "citescore_year": "2025"}, {"rank": 33, "theme": "包摂的コミュニティ・社会", "headline": "人助けをする人は生物学的老化が遅いか", "title": "Association between Helping Behaviors and Epigenetic Aging: Findings from the United States and Northern Ireland", "url": "https://doi.org/10.1016/j.ssmph.2026.101977", "authors": "Seoyoun Kim ほか", "venue": "SSM - Population Health", "date": "2026-09-29", "sjr": 1.504, "id": "jr33", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "米国と北アイルランドの高齢者の縦断研究で、ボランティアやインフォーマルな援助と、5つのエピジェネティック時計による生物学的老化の関係を調べた（抄録）。", "p3": "米国の健康と引退調査（2014・2016年）と北アイルランドのNICOLA（2016年）で、正式なボランティアと非公式な援助の時間と、Horvath・Hannum・PhenoAge・GrimAge・DunedinPACEの関係を分析した（抄録）。", "p5": "米国では両方の援助の中程度の関与（年1〜99時間）が老化の減速と関連し、特にPhenoAge・GrimAge・DunedinPACEで見られたが、非公式な援助が年200時間以上だと老化の加速と関連した（抄録）。北アイルランドでは週1〜4時間のボランティアがGrimAgeの減速と関連した（抄録）。", "fun": "人助けをする人は体の中の「生物学的な年齢」が若い傾向があった。ただし、家族の世話などの非公式な援助が多すぎると、逆に老化が進んでいた。ほどよい人助けは体に良いが、背負いすぎは負担になる、という結果は介護を考える上でも面白い。", "unverified": "抄録が途中までしか読めず、結論の全体と効果の大きさは確認できていない。"}, "citescore": 7.0, "citescore_year": "2025"}, {"rank": 34, "theme": "包摂的コミュニティ・社会", "headline": "農村の退役軍人を地域ボランティアにつなぐ", "title": "The Rural WAVE (Wellness and Veteran Engagement) Initiative", "url": "https://doi.org/10.1111/jrh.70211", "authors": "Kimber J. Parry ほか", "venue": "Journal of Rural Health", "date": "2026-09-29", "sjr": 1.411, "id": "jr34", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "農村部の退役軍人を地域のボランティア活動につなぐ米国退役軍人省の取り組み「Rural WAVE」の内容と評価を報告した（抄録）。", "p3": "RE-AIM（到達・有効性・採用・実施・維持）の枠組みに沿い、行事と活動の行政データ、ボランティア（市民・退役軍人）と職員への面接、現地訪問による混合研究法で評価した（抄録）。", "p5": "2021年の開始以来17の退役軍人保健局の施設が採用し、2025年10月時点で223の活動・行事、111人のボランティア、2,944時間のボランティア活動があった（抄録）。", "fun": "軍を退いた人の多くは、地域の暮らしに戻るのに苦労する。ボランティア活動は人とのつながりや心の健康につながるが、農村には機会が少ない。そこで国が地域の活動と退役軍人をつなぐ仕組みを作った。「役に立つ場所」を用意することが孤立を防ぐ、という発想が面白い。", "unverified": "抄録が途中までしか読めず、効果（つながりや心の健康の変化）の評価結果は確認できていない。"}, "citescore": 5.8, "citescore_year": "2025"}, {"rank": 35, "theme": "包摂的コミュニティ・社会", "headline": "強い絆・弱い絆のメディア利用とウェルビーイング", "title": "Media Use for Strong and Weak Ties: A Configural Examination of Personal Media System and Well-Being", "url": "https://doi.org/10.1177/00936502261487784", "authors": "Ceciley X. Zhang ほか", "venue": "Communication Research", "date": "2026-09-29", "sjr": 2.304, "id": "jr35", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "米国の成人1,143人で、強い絆（家族・親友）と弱い絆（知人）とのやりとりに使うメディアの構成（規模・密度・中心性・均質性）が、デジタルストレスを通じてウェルビーイングとどう関係するかを調べた（抄録）。", "p3": "メディアの構成の属性と、5つのデジタルストレス（つながり過剰、コミュニケーション過多、自己制御の不足、自己呈示の圧力、技術への苛立ち）を介した直接・間接の関連を分析した（抄録）。", "p5": "弱い絆のメディアの構成が大きく、相互に結びつき、中心化しており、全体が均質であるほどウェルビーイングに有利だった（抄録）。ただし弱い絆の構成が大きいと技術への苛立ちを通じてウェルビーイングが下がり、強い絆の構成が大きいと苛立ちが減って上がった（抄録）。", "fun": "家族や親友とはLINE、知り合いとはSNS、というようにメディアを使い分ける人は多い。知り合いとのつながりを広く保つことは幸福感にプラスだが、アプリが増えるほどイライラも増える。人間関係の「道具箱」の中身が心の健康に関わる、という見方が面白い。", "unverified": "本文が入手できず、効果の大きさの数値は確認できていない。"}, "citescore": 14.3, "citescore_year": "2025"}, {"rank": 36, "theme": "LLM熟議・ペルソナ", "headline": "LLMは開発国びいきか：米中の監査", "title": "Do Large Language Models Prefer Their Developer’s Home Country? A US–China Audit of Scores Under National Attribution", "url": "https://doi.org/10.3390/make8100303", "authors": "Martin Pavlíček ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-09-29", "sjr": 1.548, "id": "jr36", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "米国と中国のLLMが、国籍を入れ替えた同じ行為の記述に与える感情の点数に、開発国びいきがあるかを、11モデル・4,065,600件の応答で監査した（抄録）。", "p3": "22の出来事の分類、2つの極性、3つの時間枠からなる13,200組の国籍対の英中二言語の刺激を7条件で評価し、開発国の推論には米中の10モデルと9開発元の感度分析を使った（抄録）。", "p5": "英語の基準での開発国の差は+0.698点で、置換検定では有意でなかった（p=0.175、開発元単位p=0.238）（抄録）。市民としての視点を指示すると、米国ペルソナで+5.20点、中国ペルソナで−5.76点の帰属の変化が生じ、10モデルすべてが指示の方向に動いた（抄録）。", "fun": "AIは自分を作った国をひいきするのだろうか。4,065,600件の答えを調べると、開発国びいきははっきりしなかったが、「アメリカ人として」「中国人として」と役を与えると、どのAIも点数を大きく動かした。AIの偏りは作り手より使い方で強く出る、という点が面白い。", "unverified": "抄録が途中までしか読めず、中国語での結果と以前のコーパスとの比較は確認できていない。"}, "citescore": 12.7, "citescore_year": "2025"}, {"rank": 37, "theme": "LLM熟議・ペルソナ", "headline": "検証型ペルソナでLLM広告文の反応差を出す", "title": "Inter-Segment Response Differences in LLM Copywriting through Verification-Based Strategic Persona", "url": "https://doi.org/10.47116/apjcri.2026.09.22", "authors": "Hyuk Park ほか", "venue": "Asia-pacific Journal of Convergent Research Interchange", "date": "2026-09-28", "id": "jr37", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "LLMで作る顧客ペルソナが顧客層を問わず一様に好意的な反応を示す問題に対し、戦略的な顧客層の区分と、顧客データとの事実整合性を検証して磨く2層のペルソナ生成を提案した（抄録）。", "p3": "生成・判別・精練（GDR）のループで、ペルソナを入力の顧客データと照合して繰り返し修正し、顧客データ→ペルソナ→広告文→LLMによる反応模擬の流れで、4つの条件の反応を比べた（抄録）。", "p5": "検証つきの戦略的ペルソナ、静的な区分ペルソナ、制約なしのペルソナなどの条件を比べたと述べるが、結果の数値は抄録の読めた範囲にない（抄録）。", "fun": "AIに「若い会社員」「年配の主婦」などになりきって広告を評価させると、たいていどの人も「いいですね」と答えてしまい、違いが出ない。そこで、実際の顧客データと食い違わないかをAI自身に何度も点検させて、層ごとの反応の違いを引き出そうとした。", "unverified": "抄録が途中までしか読めず、条件間の反応差の大きさは確認できていない。"}}, {"rank": 38, "theme": "LLM熟議・ペルソナ", "headline": "FRBの熟議の病理：住宅バブル警告の黙殺", "title": "Pathologies of Deliberation: Narrative Suppression and Policy Apathy at the Federal Reserve", "url": "https://doi.org/10.1017/s0003975626100496", "authors": "Pierre Pénet", "venue": "European Journal of Sociology", "date": "2026-09-29", "id": "jr38", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "2008年の住宅バブルの早期警告にFRB（米連邦準備制度）が動かなかった理由を、2005年6月の連邦公開市場委員会の議事録の詳細な分析から、熟議そのものの病理として説明した（抄録）。", "p3": "不確実性下のエリートの政策決定への熟議論的なアプローチをとり、議事録の厚い記述分析で、参加者が証拠をバブルの診断の物語と3つの政策の物語（金融・監督・システム）に織り上げる過程を追った（抄録）。", "p5": "いずれの物語も支持を得られず、その失敗は3つの病理（グリーンスパン議長の強圧的な議事運営と性別による発言の遮りで偏った参加、内部モデルを優先し外部の証拠を退ける言説の閉鎖、限られた権限の認識による政策への無関心）を反映していた（抄録）。", "fun": "住宅バブルの危険に気づいていた人は会議の中にもいた。それでも行動に移せなかったのは、分析のモデルが悪かったからだけでなく、議長の強い仕切りや発言の遮り、「それは自分たちの仕事ではない」という空気のせいだった。会議の病気を議事録から診断した点が面白い。", "unverified": "本文が入手できず、議事録の具体的な発言の分析の詳細は確認できていない。"}, "citescore": 3.9, "citescore_year": "2025"}, {"rank": 39, "theme": "LLM熟議・ペルソナ", "headline": "LLMで交通に関するSNS投稿を細かく分類", "title": "Fine-Grained Analysis of Bilingual Transportation Discourse on Reddit Using Large Language Models: A Quebec City Case Study", "url": "https://doi.org/10.3390/smartcities9100164", "authors": "Negar Shabanpour ほか", "venue": "Smart Cities", "date": "2026-09-29", "sjr": 1.193, "id": "jr39", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "カナダ・ケベック市の英仏二言語のRedditの議論から、交通手段ごとの態度・意図・報告された行動と感情の向きをLLMで細かく抽出する注釈の枠組みを作った（抄録）。", "p3": "GPT-5.5とDeepSeek-Flashを、人手で注釈した200の議論で少数例の文脈内学習により評価し、平均の緩和F1が高いGPT-5.5を残り2,475の議論に適用した（抄録）。", "p5": "重複除去後、交通手段の言及23,634件と、手段別の構成概念の記述10,760件を抽出した（抄録）。公共交通が最も多く言及され、手段内で否定的な記述の割合が最も高かったが、肯定的な記述の数は否定を上回った（抄録）。態度が最も多く、意図が最も少なかった（抄録）。", "fun": "SNSには、バスや自転車についての不満や感想があふれている。それをAIで「態度」「これからしたいこと」「実際にしたこと」に分けて数えると、公共交通は一番よく話題にされ、文句も多いが褒め言葉の方がやや多かった。街の声を大量に聞き取る道具として面白い。", "unverified": "抄録が途中までしか読めず、モデルのF1の値は確認できていない。"}, "citescore": 13.0, "citescore_year": "2025"}, {"rank": 40, "theme": "都市・インフラ政策", "headline": "道路損傷検出の連合学習の国をまたぐ限界", "title": "Scaling limits of federated learning for vision-based road damage detection across countries", "url": "https://doi.org/10.1016/j.aei.2026.105307", "authors": "Shubham Kumar Dwivedi ほか", "venue": "Advanced Engineering Informatics", "date": "2026-09-29", "sjr": 2.021, "id": "jr40", "explain": {"basis": "題名", "basis_note": "Advanced Engineering Informaticsの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、画像による道路損傷の検出を、データを共有せずに各国で学習する連合学習で行ったとき、国をまたいで規模を広げる際の限界を調べた研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "道路のひび割れや穴をAIで見つけるには、多くの国の写真で学ばせたいが、データを国外に出せないこともある。そこで写真は各国に置いたまま学習だけを共有する「連合学習」が考えられる。題名からは、その方法で参加国を増やすとどこで頭打ちになるかを問う研究だと読み取れる。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}, "citescore": 15.8, "citescore_year": "2025"}, {"rank": 41, "theme": "都市・インフラ政策", "headline": "都市交通計画でのビッグデータ活用のメタ統合", "title": "A meta-synthesis of the big data in urban transportation planning processes", "url": "https://doi.org/10.1016/j.cities.2026.107632", "authors": "Prasongchai Setthasuravich ほか", "venue": "Cities", "date": "2026-09-28", "sjr": 1.772, "id": "jr41", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、題名検索で見つけた記録の抄録を読んだ（OpenAlex）", "preprint": false, "short": true, "p1": "ビッグデータが都市交通計画の過程をどう変えたかを、質的メタ統合で整理し、データの4分類と、計画上の価値を生む5つの仕組みを示した（抄録）。", "p3": "計画の事前分析・技術分析・事後分析の段階に沿って、データ源を移動のセンシング、インフラと環境、社会と行動、合成・模擬の4群に分類した（抄録）。", "p5": "前・技術段階では移動のセンシングとインフラ・環境のデータが、事後分析では社会・行動と合成・模擬のデータが多かった（抄録）。従来の調査と大規模なデジタルの痕跡を組み合わせた手法が最も有効で、代表性の偏り、従来調査の衰退、データ・ガバナンスの分断が課題として残った（抄録）。", "fun": "スマホの位置情報やICカードの記録など、街の交通のビッグデータは増え続けている。でも、たくさんの研究をまとめると、昔ながらのアンケート調査をやめて置き換えるより、両方を組み合わせた方がうまくいっていた。新しいデータは古いデータの代わりではなく相棒、という結論が面白い。", "unverified": "本文が入手できず、統合した研究の数は確認できていない。"}, "citescore": 11.5, "citescore_year": "2025"}, {"rank": 42, "theme": "都市・インフラ政策", "headline": "州政府そのものが成長連合になる仕組み", "title": "The state as democratic growth coalition: Embeddedness within state planning", "url": "https://doi.org/10.1177/00420980261488773", "authors": "Kevin Keenan", "venue": "Urban Studies", "date": "2026-09-29", "sjr": 1.809, "id": "jr42", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "米国のある州の州計画の影響評価を率いた著者の内部の経験を事例として、成長連合（開発を推進する官民の同盟）が州政府そのものの内部に埋め込まれうることを示した（抄録）。", "p3": "二十年以上ぶりの州計画の改定で州政府の最上層に接した経験を質的データとし、都市地理学の成長連合論をドゥルーズ的な資本主義の拡大の枠組みで分析した（抄録）。", "p5": "成長連合は地方や広域の水準では理論化されてきたが、州そのものに完全に埋め込まれた形では理論化されていなかったとし、政府の職員自身が連合になりうることを明らかにした（抄録）。", "fun": "街の開発を進める「成長連合」は、ふつう地元の企業や政治家の集まりとして考えられる。この研究は、州政府の中の役人そのものがその連合になりうることを、州の計画づくりの内側にいた著者の経験から描いた。内部の人だからこそ見える光景が面白い。", "unverified": "抄録が途中までしか読めず、残り2つの理論的な貢献は確認できていない。"}, "citescore": 9.9, "citescore_year": "2025"}, {"rank": 43, "theme": "都市・インフラ政策", "headline": "猛暑と日常の消費：韓国のカード取引から", "title": "Weather, extreme heat, and everyday spending in cities: Evidence from longitudinal and nationwide credit card transactions in South Korea", "url": "https://doi.org/10.1016/j.apgeog.2026.104187", "authors": "Mengqi Sun ほか", "venue": "Applied Geography", "date": "2026-09-29", "sjr": 1.597, "id": "jr43", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "韓国全国のクレジットカード取引（2019〜2020年）と都市の気象データを結びつけ、体感温度・降水・猛暑の持続と日常の消費の関係を、取引件数・支出額・業種・都市別に調べた（抄録）。", "p3": "体感温度20〜25℃を基準に、33℃以上の日、降水量、直前3日の猛暑日数と取引・支出の関係を推定し、都市間で比べた（抄録）。", "p5": "体感温度33℃以上の日は全体の取引件数が3.44%増え、支出が2.30%減った（抄録）。降水量10mmの増加で取引は1.05%、支出は0.94%減り、直前3日の猛暑日が1日増えるごとに取引は0.34%、支出は1.60%減った（抄録）。小売・飲食・娯楽では増え、家庭・ネット通販では減った（抄録）。", "fun": "とても暑い日には、買い物の回数は増えるのに使うお金は減った。暑さしのぎに冷たい飲み物を少しずつ買うのかもしれない。しかも猛暑が何日も続くと、財布のひもはさらに固くなった。天気が街の経済を細かく動かす様子が見えて面白い。", "unverified": "本文が入手できず、都市間の違いの詳細は確認できていない。"}, "citescore": 10.0, "citescore_year": "2025"}, {"rank": 44, "theme": "職場AI・組織行動", "headline": "在宅勤務者の「見せるための」デジタル行動", "title": "Establishing digital presence: How occupational status, job insecurity and job dissatisfaction shape digital availability, visibility and faking behaviours among home-based workers", "url": "https://doi.org/10.1177/09500170261476006", "authors": "Anja-Kristin Abendroth ほか", "venue": "Work, Employment and Society", "date": "2026-09-29", "sjr": 2.204, "id": "jr44", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "ドイツの在宅勤務者の代表標本で、デジタル上での可用性（すぐ応答する）、成果の可視化、常にいるふりの偽装という「デジタルの存在感」の行動が、職位・職の不安・仕事の不満とどう関係するかを調べた（抄録）。", "p3": "可用性を理想の働き手の規範への反応、可視化と偽装を理想の働き手の印象を保つための能動的な印象管理とみなし、見かけ上無関係な回帰（SUR）で分析した（抄録）。", "p5": "可用性と可視化の行動は比較的広く見られ、職位の高い人ほど可用性が高く、職の不安は3つすべてを増やし、仕事の不満は偽装を促し可視化を抑えた（抄録）。", "fun": "在宅勤務では、上司に働いている姿が見えない。そこで、すぐに返信したり、成果をこまめに報告したり、チャットの状態を「在席」にしておいたりする。職を失う不安が強い人ほどこうした行動が増え、仕事に不満がある人ほど「いるふり」をしていた。画面越しの働き方の心理が見えて面白い。", "unverified": "本文が入手できず、効果の大きさの数値は確認できていない。"}, "citescore": 9.0, "citescore_year": "2025"}, {"rank": 45, "theme": "職場AI・組織行動", "headline": "看護の現場でストレスを生む出来事を生理指標で特定", "title": "Identifying stress-relevant events in everyday nursing practice using psychophysiological outcomes - an observational multimethod study", "url": "https://doi.org/10.1186/s12912-026-05434-w", "authors": "Elizabeth A. M. Michels ほか", "venue": "BMC Nursing", "date": "2026-09-29", "sjr": 1.368, "id": "jr45", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "ドイツの大学病院の看護師の8時間勤務を観察し、どの日常の出来事が急性のストレス反応（観察者の評定と心拍変動）と結びつくかを調べた（抄録）。", "p3": "訓練を受けた観察者が勤務中の出来事を連続的に記録して瞬間のストレスを評定し、装着型の心電図で心拍変動（lnRMSSD）を測り、出来事を臨床ケアの負担・組織上の負担・肯定的な出来事に分類し、身体活動を統制した多層モデルで分析した（抄録）。", "p5": "結果の記述は抄録の読めた範囲に含まれていない。", "fun": "看護師のストレスは「忙しいから」とひとまとめにされがちだが、この研究は、ナースコール、書類仕事、患者からの感謝など、勤務中の一つひとつの出来事と、心臓の拍動のゆらぎ（ストレスの体のサイン）を結びつけて調べた。どの出来事が本当に体にこたえるのかを測る発想が面白い。", "unverified": "抄録が途中までしか読めず、出来事の種類ごとの結果は確認できていない。"}, "citescore": 5.3, "citescore_year": "2025"}, {"rank": 46, "theme": "職場AI・組織行動", "headline": "都市と農村の病院でのAI導入と用途", "title": "Adoption of AI and its Use Cases in Urban and Rural Hospitals", "url": "https://doi.org/10.1111/jrh.70224", "authors": "Nicole M. Summers‐Gabr", "venue": "Journal of Rural Health", "date": "2026-09-29", "sjr": 1.411, "id": "jr46", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "2024年の米国病院協会の年次調査（6,173病院）で、病院のAIの導入が都市圏からの距離によって違うかを、臨床8用途・業務6用途について調べた（抄録）。", "p3": "郡単位の都市・農村連続コード（RUCC）で地理を区分し、病院の所有形態と規模を統制して用途ごとの導入の確率を分析した（抄録）。", "p5": "全国で約30%の病院が臨床の作業に、26%が管理の作業にAIを導入していたが、都市圏から遠い病院ほど導入が少なかった（抄録）。", "fun": "病院にAIが入り始めているが、都会の病院と田舎の病院で差がある。全国6千以上の病院を調べると、都市から遠いほどAIを使っていなかった。新しい技術ほど、人材や設備のそろった都会に偏りやすいという「デジタル格差」が医療にも表れている。", "unverified": "抄録が途中までしか読めず、用途別の差の大きさは確認できていない。"}, "citescore": 5.8, "citescore_year": "2025"}, {"rank": 47, "theme": "職場AI・組織行動", "headline": "AIが入った職場で人間が主導する枠組み", "title": "Human-as-the-Lead (HatL): reconceptualising human agency in AI-augmented work and its implications for employee and customer experience", "url": "https://doi.org/10.1080/02642069.2026.2740555", "authors": "K. Vinaykumar Nair ほか", "venue": "The Service Industries Journal", "date": "2026-09-29", "id": "jr47", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "AIで拡張された仕事で、人を受け身の監視役でなく方向を決める主導者とみなす構成概念「Human-as-the-Lead（HatL）」を定義し、従業員と顧客の体験への影響の命題を示した（抄録）。", "p3": "2段階の系統的レビューに基づき、アフォーダンス理論・自己決定理論・心理的エンパワーメント理論を統合して、主導の優位、拒否権、情報に基づく指揮、独立した主体性の4次元でHatLを展開した（抄録）。", "p5": "AIの導入から従業員のエンパワーメントを経て顧客体験に至る7つの命題を示し、AIの自律性が高いとHatLが損なわれ、導入の動機であるエンパワーメントの利益が崩れる「拡張と主導の逆説」を特定した（抄録）。", "fun": "AIが賢くなるほど人は楽になるはずが、AIが何でも自分で決めるようになると、人が「主役」でいられなくなり、やりがいや力を発揮できる感覚がかえって失われる。この逆説を理論として整理した点が、AIと働く未来を考える上で面白い。", "unverified": "理論論文で、実証的な検証は行われていない（抄録から読み取れる範囲）。"}, "citescore": 17.4, "citescore_year": "2025"}, {"rank": 48, "theme": "位相空間・土木三力学", "headline": "非線形確率偏微分方程式の縮約モデル", "title": "Reduced Order Modeling of Some Nonlinear Stochastic Partial Differential Equations", "url": "https://doi.org/10.4208/ijnam.v4.n3-4.p368", "authors": "J. Burkardt ほか", "venue": "International Journal of Numerical Analysis and Modeling", "date": "2026-09-29", "id": "jr48", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "確率偏微分方程式の出力の統計量を、固有直交分解（POD）に基づく縮約モデルで安く大量に計算するとき、標本数の増加と縮約による精度低下の兼ね合いを調べた（抄録）。", "p3": "非線形の確率PDEの多数の実現を縮約モデルで計算し、アンサンブルから出力の統計情報を求める際の、標本数とモデルの忠実度の相反する効果を検討した（抄録）。", "p5": "具体的な数値結果は抄録にない。縮約モデルでずっと大きなアンサンブルを安く作れるが、その利点は状態の近似の忠実度の低さと相殺されると述べる（抄録）。", "fun": "不確かさのある問題では、何千回もシミュレーションを回して結果のばらつきを調べたい。そこで計算を大幅に軽くした「簡易版のモデル」を使えば回数は増やせるが、1回ごとの正確さは落ちる。数を取るか質を取るか、そのちょうどよい釣り合いを探る研究である。", "unverified": "本文が入手できず、どの方程式で検証したか、最適な釣り合いの結論は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 49, "theme": "位相空間・土木三力学", "headline": "鉛直振動する粒状ダンパの運動学モデル", "title": "On the kinematic model approximation of granular dampers under vertical vibration", "url": "https://doi.org/10.18245/ijaet.2015038", "authors": "Furkan Terzioglu", "venue": "International Journal of Automotive Engineering and Technologies", "date": "2026-09-29", "id": "jr49", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "鉛直に加振された粒状体ダンパの粒子の集団運動を、粒状体を容器から離れて重力で自由に飛び、容器の端と非弾性衝突する一つの剛体とみなす簡単な運動学モデルでどこまで表せるかを調べた（抄録）。", "p3": "離脱と再接触の瞬間の条件と、集団的な衝突が最も効果的になる加振振幅の条件を導き、既報の個別要素法（DEM）のシミュレーションと円筒形ダンパの散逸パワーの測定と比べた（抄録）。", "p5": "比較の具体的な数値は抄録の読めた範囲にない。", "fun": "箱の中に砂粒を入れて揺らすと、粒どうしがぶつかって振動のエネルギーを吸い取る。何千もの粒を一つずつ計算するのは大変だが、「粒のかたまりを一つのボールとみなし、箱の中で跳ねる」と考えるだけでかなり説明できるかもしれない。単純化の大胆さが面白い。", "unverified": "抄録が途中までしか読めず、モデルと測定の一致の程度は確認できていない。"}}, {"rank": 50, "theme": "位相空間・土木三力学", "headline": "本震-余震で斜面の永久変位の信頼性を評価", "title": "Reliability analysis method for soil slopes permanent displacement under mainshock–aftershock sequences", "url": "https://doi.org/10.5194/nhess-26-4611-2026", "authors": "Tianyi Wang ほか", "venue": "Natural hazards and earth system sciences", "date": "2026-09-28", "id": "jr50", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "本震と余震の連続（MAS）を受ける土の斜面の永久変位について、確率密度発展法（PDEM）に基づく信頼性評価の枠組みを提案した（抄録）。", "p3": "理論モデルと実データを統合してMASの確率的な入力場を作り、21の候補パラメータの相関分析で累積絶対速度（CAV）を斜面応答の支配的なパラメータとして特定し、PDEMで信頼性を評価する（抄録）。", "p5": "既存の方法との比較の結果は抄録の読めた範囲では途中まで。", "fun": "大地震のあとに続く余震が、少しずつ斜面を崩していく。この研究は、揺れの最大値ではなく「揺れの積み重ね」を表す量が斜面のずれを一番よく説明することを見つけ、ずれがどのくらいの確率で起きるかを、確率の分布が時間とともに変わる様子を計算する方法で評価した。", "unverified": "抄録が途中までしか読めず、既存法との比較の数値は確認できていない。"}, "citescore": 8.2, "citescore_year": "2025"}], "jnl_notable": [{"rank": 1, "field": "経営学", "headline": "TikTokの短尺動画は画面時間と睡眠を削る", "title": "Impact of Short-Form Videos on Screentime and Sleep: Evidence from TikTok", "url": "https://doi.org/10.1287/mnsc.2024.08260", "authors": "Saharsh Agarwal ほか", "venue": "Management Science", "date": "2026-09-29", "sjr": 6.428, "why": "短尺動画の採用が利用時間と睡眠に与える因果効果を実データで推定した。", "id": "jn01", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "米国のAndroid利用者の大規模パネルの操作ログで、TikTokを使い始めた約7,000人の前後を差の差法で比べ、短尺動画の採用が画面時間を大きく増やし、深夜の利用と就寝の遅れ・睡眠の短縮を招くことを因果的に示した（抄録）。", "p2": "短尺動画はデジタルの使いすぎや睡眠の乱れの議論の中心にあるが、行動への影響の因果的な証拠は限られていた（抄録）。", "p3": "同意を得た米国Android利用者のパネルのタッチ操作の記録から、アプリ利用、画面時間、推定される睡眠行動を採用の前後で追跡し、差の差法で推定した（抄録）。", "p4": "結果は総画面時間、他のSNS・ゲームの利用、時間帯別の利用、就寝時刻と睡眠時間で、利用の強度（重度・軽度）別に比べた（抄録）。", "p5": "重度のTikTok利用者では採用後に総画面時間が週平均221分増え、他のSNSとゲームの利用は減り強い代替が見られた（抄録）。画面時間の効果は深夜に最も大きく、高強度の利用者では就寝の遅れと睡眠時間の中程度の短縮が見られたが、軽度の利用者には効果がなかった（抄録）。短尺動画は注意を他から移すだけでなく、デジタルの注意の総量を増やした（抄録）。", "p6": "解釈：採用は自己選択であり、採用の時期と同時に起きた生活の変化との区別は差の差法の仮定に依存する。睡眠は操作ログからの推定で、実際の睡眠の測定ではない。参加者は同意したAndroidの利用者に限られる。", "fun": "TikTokを始めると、他のアプリを見る時間が減るだけで合計は変わらない…のではなく、スマホを見る合計時間が週に3時間半以上も増えた。しかも増えたのは夜中で、よく使う人ほど寝る時間が遅くなり睡眠が短くなった。「ついもう一本」の積み重ねがデータで見える点が身近で面白い。", "unverified": "本文が入手できず、睡眠時間の短縮の大きさ（分）と、推定の頑健性の検討は確認できていない。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 2, "field": "経営学", "headline": "職場の不正への処分は政治的少数派に厳しい", "title": "Partisanship, Information, and Punishment for Misconduct at Work", "url": "https://doi.org/10.1111/1475-679x.70089", "authors": "VIVEK PANDEY ほか", "venue": "Journal of Accounting Research", "date": "2026-09-29", "sjr": 9.774, "why": "金融アドバイザーの個人データで、同じ不正でも社内の政治的少数派ほど退職に追い込まれることを示した。", "id": "jn02", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "金融アドバイザーの個人データで、社内で政治的に少数派のアドバイザーは、不正の頻度と深刻さは同僚と変わらないのに、不正の後に退職に追い込まれやすい「党派的な処罰基準」があることを示した（抄録）。", "p2": "企業は従業員の不正にどう対応するかを裁量で決めるが、その基準に政治的な立場の偏りがあるかは検証されていなかった（抄録）。", "p3": "アドバイザーの政治的傾向と社内の多数派を結びつけ、同じ会社・同じ時期の同僚と比べて、不正の発生と、不正後の退職・公表を分析した（抄録）。社内の情報の質（外部報告の質、非上場か、内部統制報告の独立会計士の有無）で違いを調べた（抄録）。", "p4": "結果は不正の発生と深刻さ、不正後の退職、不正の公的な開示、その後の企業の成長である（抄録）。", "p5": "少数派のアドバイザーは不正の発生と深刻さで同僚と差がないのに、不正の後に有意に退職しやすかった（抄録）。この傾向は社内の情報の質が低い企業で特に強く、企業は少数派の不正をより公表しやすい「党派的な報告基準」も示した（抄録）。党派的な処罰を行う企業はその後の成長が遅かった（抄録）。", "p6": "解釈：政治的傾向の測り方（政治献金の記録など）と、少数派であることの判定の方法は抄録からは分からない。効果の大きさも抄録に記載がない。", "fun": "同じような失敗をしても、職場で「政治的な考えが多数派と違う人」だけが辞めさせられやすかった。しかも、社内の情報が乏しい会社ほどこの差が大きく、そういう会社はその後の成長も遅かった。公平なはずの処分に、見えない偏りが入り込む様子が分かる。", "unverified": "本文が入手できず、効果の大きさ、標本の規模、政治的傾向の測定方法は確認できていない。"}, "citescore": 13.4, "citescore_year": "2025"}, {"rank": 3, "field": "因果推論", "headline": "事象時点の回帰不連続で薬の効果を推定", "title": "Event-time regression discontinuity for biomedical data: LATT estimation and covariate distribution tests", "url": "https://doi.org/10.1093/aje/kwag243", "authors": "Yesong Choe ほか", "venue": "American Journal of Epidemiology", "date": "2026-09-27", "why": "UK Biobankの記録で、事象時点を使う回帰不連続デザインと共変量分布の検定を開発した。", "id": "jn03", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "処方記録は縦断的だがバイオマーカーは一時点しか測られていない連結データで、測定日と初回処方日の間隔で人を並べる「事象時点の回帰不連続デザイン」を開発し、UK Biobankでスタチンの処方前後のLDLコレステロールの不連続を示した（抄録）。", "p2": "薬の臨床検査値への因果効果はランダム化試験で調べにくく、観察データでは実験に近い条件を作るデザインが要る（抄録）。", "p3": "最終的に服薬する人を、検査値の測定が初回処方の直前か直後かで比べ、測定と処方の間隔を代理の割当変数とする（抄録）。連続性の仮定のもとで、処置を受けた人の局所平均処置効果（LATT）が識別される（抄録）。共変量の分布のバランスの診断、頑健なバイアス補正の推論、少数の共変量調整を行った（抄録）。", "p4": "2006〜2013年のUK Biobankの連結記録で、スタチンとLDL、メトホルミンとHbA1cの2例を分析し、帯域幅やドーナツ（境界近くを除く）の指定を変えて頑健性を確かめた（抄録）。", "p5": "スタチンでは初回処方日の前後でLDLの局所的な下向きの不連続があり、向きと有意性はバイアス補正、帯域幅、ドーナツの指定で頑健だった（抄録）。ただし割当変数の密度の検定は有意で、ドーナツ推定は−1.00〜−1.72mmol/Lとばらつき、局所的な比較可能性に不確かさが残った（抄録）。メトホルミン-HbA1cは不安定で、局所線形の大きな低下はバイアス補正の推論で裏づけられなかった（抄録）。", "p6": "著者は、結論が局所的な時点の外生性と連続性の仮定に依存すると明記する（抄録）。解釈：割当変数の密度の偏り（処方前後で測定されやすさが違う可能性）は、識別の仮定への疑問を残す。", "fun": "薬を飲み始めた日の「少し前」に検査した人と「少し後」に検査した人を比べれば、飲み始めた効果が見えるはず、という発想の研究だ。コレステロールの薬では効果が見えたが、糖尿病の薬でははっきりしなかった。しかも、検査日が処方日の前後で偏っている兆候もあり、著者自身が慎重に解釈を促している点が誠実で面白い。", "unverified": "本文が入手できず、標本数と推定値の信頼区間は確認できていない。"}, "citescore": 7.1, "citescore_year": "2025"}, {"rank": 4, "field": "経済学", "headline": "遠隔地交易の自由化は経済活動の配置を長く変える", "title": "Long-Distance Trade and Long-Term Persistence", "url": "https://doi.org/10.1257/mac.20230017", "authors": "Sebastian Ellingsen", "venue": "American Economic Journal: Macroeconomics", "date": "2026-09-29", "sjr": 12.637, "why": "18世紀スペイン帝国の交易制限の撤廃を使い、交易機会の場所が経済活動の場所を変えるかを推定した。", "id": "jn04", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "18世紀のスペイン帝国での交易制限の撤廃を使い、交易機会の場所の変化が経済活動の場所を変えるかを、差の差法と動学的な空間モデルで調べ、改革が市場統合と都市の成長をもたらしたが、国内市場の大きい場所では効果が小さかったことを示した（抄録）。", "p2": "交易機会の場所の変化が経済活動の場所を因果的に変えるのか、それとも経済活動は歴史的な経路に固定されるのかは、経済地理の中心的な問いである（抄録）。", "p3": "スペイン帝国内の交易の自由化という歴史的な改革を自然実験とし、差の差法と動学的な空間モデルを組み合わせた（抄録）。", "p4": "結果は市場統合と都市の成長で、国内市場の大きさによる違いを調べた（抄録）。", "p5": "改革は市場統合を改善し都市の成長を促したが、国内市場の大きい場所では効果が小さかった（抄録）。経済活動の場所は交易機会の場所の変化に適応するが、変化の前に都市が成長していた場合は持続する（抄録）。", "p6": "解釈：歴史データの都市の人口などの測定の精度や、改革の実施の時期の外生性は抄録からは検討できない。効果の大きさも抄録に記載がない。", "fun": "18世紀、スペインは植民地との貿易を一部の港に限っていたが、その制限を外すと、新しく貿易できるようになった町が成長した。ただ、すでに大きな町の周りでは変化が小さかった。貿易の窓口がどこにあるかで街の盛衰が決まり、一度栄えた街は簡単には動かない、という歴史の重みが見える。", "unverified": "本文が入手できず、効果の大きさ、データの都市数と期間は確認できていない。"}, "citescore": 11.1, "citescore_year": "2025"}, {"rank": 5, "field": "組織行動・心理的安全性", "headline": "上司の能力過剰は部下の行動をどう変えるか", "title": "Linking Leader Overqualification to Employee Organizational Citizenship Behaviors Toward the Leader: A Personal Identification Process Model", "url": "https://doi.org/10.1002/job.70132", "authors": "Yuanyuan Gong ほか", "venue": "Journal of Organizational Behavior", "date": "2026-09-29", "sjr": 3.999, "why": "部下が上司を能力過剰と感じることが、上司への組織市民行動に与える影響を個人的同一化の過程で説明した。", "id": "jn05", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "部下が上司を「能力が今の地位に対して過剰」と感じると、上司への個人的な同一化が強まり、上司に向けた組織市民行動（OCBL）が増えること、その効果が部下のナルシシズムの型で逆向きに調整されることを、米国の実験と中国の多時点・多情報源の調査2つで示した（抄録）。", "p2": "能力過剰は本人への影響が主に研究され、その下で働く部下への影響の研究は限られていた（抄録）。上司の能力過剰の知覚は部下に良い面と悪い面の両方を持ちうる（抄録）。", "p3": "同一化の構築と個人的同一化の過程モデルに基づき、上司の能力過剰の知覚→上司への同一化→上司への組織市民行動という媒介を仮定し、ナルシシズムの賞賛型は正の関係を強め、対抗型は弱めるという調整つき媒介モデルを立てた（抄録）。", "p4": "米国での場面想定の実験1つと、中国での多時点・多情報源の調査2つで検証した（抄録）。", "p5": "3つの研究はいずれも調整つき媒介モデルを一貫して支持した（抄録）。賞賛型のナルシシズムは能力過剰の知覚と同一化の正の関連を強め、対抗型は弱め、上司への組織市民行動への間接効果が分かれた（抄録）。", "p6": "解釈：効果の大きさと標本数は抄録から分からない。場面想定の実験と、中国の組織での調査の結果の一般化には注意が要る。", "fun": "「この上司は本当はもっと上に行ける人だ」と部下が感じると、その上司を慕い、自分から手助けするようになることがある。ただ、自分をすごいと思いたいタイプの部下では、憧れる人と張り合う人で反応が逆になった。上司の有能さが、部下の性格次第で追い風にも向かい風にもなるのが面白い。", "unverified": "本文が入手できず、各研究の標本数と効果量は確認できていない。"}, "citescore": 14.2, "citescore_year": "2025"}, {"rank": 6, "field": "総合誌の成果", "headline": "食事制限なしで飲める経口GLP-1薬の第3相試験", "title": "Oral small-molecule GLP-1 receptor agonist safiglipron in early type 2 diabetes: a randomized, double-blind, placebo-controlled trial", "url": "https://doi.org/10.1038/s41591-026-04651-9", "authors": "Miao Yu ほか", "venue": "Nature Medicine", "date": "2026-09-29", "sjr": 17.496, "why": "食事制限なしで服用できる低分子の経口GLP-1受容体作動薬の早期2型糖尿病での第3相試験。", "id": "jn06", "explain": {"basis": "本文", "basis_note": "出版社（Nature Medicine）のHTML本文（試験デザイン、主要・確認的副次評価項目、安全性、考察の限界）と図2のキャプションを読んだ", "preprint": false, "p1": "食事制限なしで1日1回飲める低分子の経口GLP-1受容体作動薬サフィグリプロンが、薬を使っていない早期の2型糖尿病患者でHbA1cを32週でプラセボより最大1.45ポイント下げることを、中国46施設の第3相ランダム化二重盲検試験（OUTSTAND-1）で示した（抄録、§主要評価項目）。", "p2": "背景：GLP-1受容体作動薬は有効だが、注射薬が多く、既存の経口薬には空腹時の服用などの制約がある。本試験は、食事・運動のみで治療中の早期の患者での単剤の効果と安全性を評価した（§試験デザイン）。", "p3": "18〜75歳、HbA1c 7.0〜10.0%の成人284人を、30mg・60mg・90mg（4週ごとに30mgずつ増量）とプラセボに割り付け、32週のプラセボ対照期と20週の延長期（プラセボ群は30mgに切替）を設けた（§試験デザイン）。主要評価項目は32週のHbA1cの変化で、治療方針エスティマンド（途中の出来事にかかわらず全員を割付どおりに解析する推定の目標）で推定した（§主要評価項目）。", "p4": "確認的副次評価項目はHbA1c 7.0%未満・6.5%以下の達成率、空腹時血糖、体重の変化率で、固定順序の検定で多重性を調整した（§確認的副次評価項目）。参加者はすべてアジア人（中国）で、平均49.4歳、女性33.1%、罹病期間の中央値1.6年、平均HbA1c 7.95%だった（§試験デザイン）。", "p5": "プラセボとのHbA1cの差は30mgで−1.22%、60mgで−1.20%、90mgで−1.45%（すべてP<0.0001）だった（§主要評価項目、図2a）。HbA1c 7.0%未満の達成は71.4〜77.8%対プラセボ25.0%、空腹時血糖の差は−1.58〜−2.08mmol/Lだった（§副次評価項目）。体重のプラセボとの差は−0.65%（有意でない）、−2.23%、−3.56%と控えめだった（§体重）。胃腸の有害事象が最も多く（44.3〜73.6%対15.3%）、有害事象による中止は1.4〜6.9%、重い低血糖はなかった（§安全性）。", "p6": "著者は、参加者が全員中国人で、BMIが高い集団や罹病期間の長い集団に一般化できないこと、まれな有害事象や心血管・腎の結果を評価する規模でないこと、中止後の効果の持続を評価する期間がないことを限界に挙げる（§考察）。解釈：延長期はプラセボ対照がなく、52週の結果は非対照の比較になる。", "fun": "糖尿病の治療で注目されるGLP-1という薬は、多くが注射か、空腹時に水と一緒に飲む決まりがある。この研究の薬は、食事を気にせず1日1回飲むだけで、血糖の目安の数値を大きく下げた。飲みやすさは、毎日続ける薬にとって効き目と同じくらい大切だ。ただし吐き気などの胃腸の副作用は用量が多いほど増えた。", "unverified": "延長期（52週）の有効性の数値と、探索的な心血管・腎の指標の結果は確認していない。"}, "citescore": 73.9, "citescore_year": "2025"}, {"rank": 7, "field": "経営学", "headline": "到着と出発の雑音から施設の人数を追跡", "title": "Data-Driven Population Tracking in Service Systems", "url": "https://doi.org/10.1287/mnsc.2024.05152", "authors": "Fernando Bernstein ほか", "venue": "Management Science", "date": "2026-09-29", "sjr": 6.428, "why": "空港の事例から、雑音のある到着・出発の観測だけでサービス施設内の人数を推定する方法を示した。", "id": "jn07", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "空港のように到着と出発の雑音のある観測しかないサービス施設で、施設内の人数を追跡する方策について、どの方策にも当てはまる損失の下界と、それを対数の因子の範囲で達成する単純な方策を示し、ローリー・ダーラム国際空港の実データで性能を示した（抄録）。", "p2": "管理者は混雑に応じて人員などを判断したいが、施設内の人数は直接観測できず、到着と出発の計数には誤差がある（抄録）。誤差の積み重なりで素朴な追跡は崩れる（背景）。", "p3": "「混んでいるかどうか」を判定する問題と、人数を追跡して二乗誤差を累積する問題の2つを定式化し、長い期間の漸近的な体制で各方策の累積損失を特徴づけた（抄録）。費用をかけて定期的に点検できる場合の影響も分析した（抄録）。", "p4": "累積損失の下界の証明と、提案方策と素朴な方策の比較を行い、空港に人数計測センサを設置して集めた実データで性能を示した（抄録）。", "p5": "提案方策は下界を対数の因子の範囲で達成し、多くの場合に素朴な追跡を上回った（抄録）。効果的な方策は、正確な推定に数をリセットする機会を使って誤差の蓄積を止め、点検がなければ出発の流れからほぼ空だと分かったときに数を0に戻す（抄録）。点検は費用がかかるが、修正の時期の柔軟性を高め性能を改善した（抄録）。", "p6": "解釈：理論は長期の漸近的な結果で、短期の性能や、センサの誤差の性質が変わる場合の頑健性は抄録からは分からない。", "fun": "入口と出口で人数を数えれば中にいる人数が分かるはずだが、数え間違いが少しずつたまると、そのうち大きくずれる。そこで「たぶん今は空っぽだ」と分かった瞬間に数を0に戻すと、誤差の蓄積を断ち切れる。空港の人数を実際に数えて確かめた、ごく身近な工夫が面白い。", "unverified": "本文が入手できず、実データでの誤差の改善幅は確認できていない。"}, "citescore": 11.8, "citescore_year": "2025"}, {"rank": 8, "field": "情報システム", "headline": "AI文献検索ツールの臨床エビデンスの見落とし", "title": "Blind spots in AI-assisted healthcare evidence search: multiplatform evaluation of clinical retrieval gaps and risk-of-bias", "url": "https://doi.org/10.1038/s41746-026-03277-y", "authors": "Ahmed N. Farrag ほか", "venue": "npj Digital Medicine", "date": "2026-09-29", "sjr": 4.215, "why": "非公開の基準集合でAI・LLMの文献検索ツールを比べ、系統的な見落としとバイアスを評価した。", "id": "jn08", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "臨床医や研究者が使う検索拡張型・LLMのエビデンス検索ツール（Consensus、Ai2 Paper Finder、ChatGPT、Gemini、Claude）を、非公開の基準集合と15通りの問い方で評価し、どの問い方でも関連するエビデンスを取りこぼす系統的な「盲点」があることを示した（抄録）。", "p2": "現実的な質問で関連するエビデンスが確実に出てくるのか、臨床のエビデンスや研究の統合を歪める系統的な欠落があるのかは不明だった（抄録）。公開ベンチマークはモデルの学習に混入している恐れがある（抄録）。", "p3": "ベンチマークの混入を避けるため前向きに集めた非公開の基準の文献集合を使い、5つのプラットフォームを15の問い方で比べた（抄録）。", "p4": "主要評価項目は、問い方ごとの再現率（1回の問いでどれだけ拾えるか）と、1回の問いである領域の関連文献がゼロになる確率で、副次的に全問い方を合わせた再現率を評価した（抄録）。", "p5": "問い方ごとの再現率の中央値は7.2〜42.2%、全問い方を合わせても45.8〜72.3%だった（抄録）。最大の文献区分では1回の問いで関連文献がゼロになる確率が47〜80%で、1つのプラットフォームは2016年以前の文献に顕著な欠落があった（抄録）。12.0%の文献はどのプラットフォームでも一度も拾われず、会議録は学術誌論文より拾われにくかった（38.9%対4.6%、p<0.001）（抄録）。", "p6": "著者は、欠落はプラットフォーム・文献区分・出版年・媒体で異なり、臨床や研究で使う前に領域ごとの評価が必要だとする（抄録）。解釈：一つの臨床領域の基準集合での結果で、他の領域への一般化と、ツールの版の更新による変化は未確認である。", "fun": "AIに「この病気の治療の研究を探して」と頼むと、便利そうに一覧を出してくれる。ところが正解の論文リストと照らし合わせると、1回の質問では関連する論文を半分以上見落とすことが多く、どのAIにも見つからない論文が1割以上あった。特に学会発表はほとんど拾われない。AIの検索は便利でも万能ではない。", "unverified": "本文が入手できず、対象の臨床領域と基準集合の文献数は確認できていない。"}, "citescore": 18.2, "citescore_year": "2025"}, {"rank": 9, "field": "経済学", "headline": "変動が大きいと金融政策の効き方が変わる", "title": "Price Setting and Volatility: Evidence from Oil Price Volatility Shocks", "url": "https://doi.org/10.1257/mac.20210258", "authors": "Matthew Klepacz", "venue": "American Economic Journal: Macroeconomics", "date": "2026-09-29", "sjr": 12.637, "why": "石油価格の変動ショックで、価格改定の頻度とばらつきが変わり金融政策の効果が変わることを示した。", "id": "jn09", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Semantic Scholarに登録された抄録のみを読んだ", "preprint": false, "p1": "外生的な原油価格の変動ショックと産業ごとの石油使用の違いを使い、全体の変動が大きいとき生産者物価の個別の価格改定は、頻度が下がりばらつきが増える（そろって動かない）ことを示し、金融政策の効果はあまり弱まらないと結論した（抄録）。", "p2": "全体の変動が高まると個別の価格が同じ方向にそろって動き、価格の柔軟性が上がって金融政策の効果が弱まるのではないか、という問いがある（抄録）。先行研究は個別企業の変動（特異的な変動）の効果を主に扱っていた（抄録）。", "p3": "生産者物価指数（PPI）のミクロデータで、原油価格の変動ショックへの反応を、石油をより多く使う産業との比較で識別した（抄録）。結果を状態依存型の価格設定モデルで解釈した（抄録）。", "p4": "結果は個別の価格改定の頻度とばらつきで、モデルが実証の関係を再現できるかを検討した（抄録）。", "p5": "全体の変動が大きいとき、価格改定はばらつきが増え頻度が下がり、同じ方向にそろいにくかった（抄録）。これは特異的な変動についての先行研究の結果と対照的だった（抄録）。モデルが原油の変動と価格改定のばらつきの正の関係を再現するには、ランダムなメニューコスト（価格改定の費用）が必要で、モデルは全体の変動の増加が金融政策の産出の刺激力を大きくは損なわないことを含意した（抄録）。", "p6": "解釈：原油価格の変動を外生とみなす仮定と、米国のPPIに基づく結果の他国への一般化は抄録からは評価できない。効果の大きさは抄録に記載がない。", "fun": "景気が不安定なとき、企業が一斉に値上げや値下げをすると、中央銀行の金利政策が効きにくくなると心配される。原油の値動きが荒い時期を調べると、実際には企業の値段の付け直しはばらばらで、むしろ回数は減った。「みんなが同時に動く」という心配は当たらなかった点が面白い。", "unverified": "本文が入手できず、データの期間と効果の大きさは確認できていない。"}, "citescore": 11.1, "citescore_year": "2025"}, {"rank": 10, "field": "統計学", "headline": "観察研究の再現性：仕様の制限から拡張へ", "title": "A Replication Framework for Observational Research: From Specification Restriction to Specification Expansion", "url": "https://doi.org/10.1177/00491241261490850", "authors": "Jonathan Ben-Menachem ほか", "venue": "Sociological Methods and Research", "date": "2026-09-29", "sjr": 3.471, "why": "社会学の再現性改革を、分析仕様を絞る改革と広げる改革に分けて整理した枠組み。", "id": "jn10", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "社会学の再現性の議論のために、研究改革を「分析の仕様を事前に絞る改革」と「仕様を広げる改革」に区別し、観察研究では後者を中心にした再現の枠組みがよいと提案した（抄録）。", "p2": "社会学は「再現性の危機」の議論から比較的距離を置いてきた（抄録）。仕様を絞る改革（事前登録など）は偽陽性を抑える方法として推奨されるが、観察研究ではその統計的な根拠が弱い（抄録）。", "p3": "実験と観察研究で、偽陽性の制御を正当化する仮定の成り立ちやすさを比べ、事前の固い分析の約束が観察研究ではかえって脆い仕様を固定しうると論じた（抄録）。", "p4": "方法論の論考で、実証データによる検証は抄録からは読み取れない。", "p5": "見かけの再現率の低さは偽陽性の多さを必ずしも意味しないと論じ、仕様を広げる改革、確認的研究への強い誘因、メタ分析を中心にした再現の枠組みを提案した（抄録）。", "p6": "解釈：提案の有効性は実際の社会学の研究群での検証を待つ。仕様を広げる分析（多元的分析など）の具体的な手順は抄録からは分からない。", "fun": "研究結果が本当かを確かめる方法として、「分析のやり方を先に決めておく」ことがよく勧められる。しかし、実験ではなく社会の観察データを使う研究では、先に決めた一つのやり方がたまたま脆いこともある。むしろいろいろなやり方で試して結果が揺らがないかを見る方がよい、という逆転の発想が面白い。", "unverified": "本文が入手できず、具体的な事例や提案の手順は確認できていない。"}, "citescore": 16.2, "citescore_year": "2025"}, {"rank": 11, "field": "機械学習", "headline": "言語から心の理論の個人差を測る：人とAI", "title": "Assessing Individual Differences in Adult Theory of Mind Through Mental State Language: Human and Artificial Intelligence Approaches", "url": "https://doi.org/10.1177/10731911261486664", "authors": "Chloe C. Hudson ほか", "venue": "Assessment", "date": "2026-09-29", "sjr": 2.04, "why": "心的状態を表す言葉の使用から大人の心の理論の個人差を測る方法を、人の評定とAIで比べた。", "id": "jn11", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "大学生334人が初対面の相手と協力課題をする場面の発話で、心の状態を表す言葉（「思う」「感じる」など）の使用を心の理論の自然な指標として評価し、既存の測定と収束し対人機能をよりよく予測すること、LLMが人の符号化を再現できることを示した（抄録）。", "p2": "心の理論（他者の心を推し量る能力）は社会的行動の中心だが、実証研究は偏りがあり生態学的妥当性の限られた測定に頼ってきた（抄録）。", "p3": "2人組の協力課題の会話から心的状態の言葉を符号化し、既存の心の理論の測定との収束的妥当性と、対人機能の予測的妥当性を調べた（抄録）。微調整したTransformerとオープンの生成LLMで人の符号化を再現できるかを試した（抄録）。", "p4": "参加者は334人（非ヒスパニック白人63.8%、女性74.3%）で、既存の測定との相関と、対人機能の予測を比べた（抄録）。", "p5": "心的状態の言葉は既存の心の理論の測定と強い収束的妥当性を示し、既存の測定より対人機能をよく予測した（抄録）。微調整Transformerとオープンの生成LLMは人の符号化を確実に再現し、大規模な評価を可能にした（抄録）。", "p6": "著者は構成概念妥当性の初期の証拠と位置づけ、自然な対話への拡張を今後の課題とする（抄録）。解釈：参加者は大学生で女性・白人が多く、他の集団への一般化は未確認である。", "fun": "他人の気持ちを推し量る力（心の理論）は、ふつうテストの問題で測る。この研究は、初対面の人と協力して話すときに「あなたはどう思う？」「たぶん困ってるよね」のような心を表す言葉をどれだけ使うかで、その力が測れることを示した。しかもAIがその言葉を人と同じように数えられた。会話そのものが心の物差しになる点が面白い。", "unverified": "本文が入手できず、相関の大きさとLLMの一致度の数値は確認できていない。"}, "citescore": 10.4, "citescore_year": "2025"}, {"rank": 12, "field": "ヒューマンコンピュータインタラクション", "headline": "没入型VR学習の認知負荷と学習効果", "title": "Immersive VR learning environments: cognitive load, engagement, and learning analytics", "url": "https://doi.org/10.1186/s40561-026-00466-w", "authors": "ZuoYuan Liu ほか", "venue": "Smart Learning Environments", "date": "2026-09-29", "sjr": 4.239, "why": "没入型VR・非没入型・従来型の教材を比べ、認知負荷と関与、学習分析の指標を評価した。", "id": "jn12", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "大学生・大学院生150人を8週間、従来型・非没入型マルチメディア・没入型VRの3つの教え方に割り付け、VRが知識の伸び、関与、動機づけで最も良く、主観的な認知負荷が最も低かったことを示した（抄録）。", "p2": "没入型VRは空間的な構成や多感覚の提示で複雑な内容を表せるが、従来型や非没入型のマルチメディア学習と比べた教育的な価値ははっきりしていなかった（抄録）。", "p3": "量的中心の混合研究法で、前後の知識テスト、関与・動機づけ・認知負荷の尺度、VR群のシステムログの行動指標、30人への事後面接を組み合わせた（抄録）。探索的な経路分析で関与と認知負荷と成績の関係を調べた（抄録）。", "p4": "2つの大学の150人を各条件50人に配置し、知識の伸び（前後差）と正規化された伸びで比べた（抄録）。", "p5": "3群とも伸びたが、VR群の平均の知識の伸びは22.91ポイント、正規化された伸びは0.45で最大だった（抄録）。VR群は関与と動機づけが高く、主観的な認知負荷が低かった（抄録）。関与と認知負荷は、基準の成績を調整後も事後テストの成績と関連したが、測定が同時期のため因果的な解釈はできない（抄録）。", "p6": "著者は、事後の測定が同時期で間接効果を因果と解釈できないと明記する（抄録）。解釈：割付の方法（無作為か）と、VR群の新しさの効果（物珍しさ）の影響は抄録からは分からない。", "fun": "VRのゴーグルで教材の中に入り込んで学ぶと、教科書や画面の動画より、知識の伸びが大きく、やる気も高く、しかも「頭が疲れた感じ」は少なかった。立体的に見て動かせると理解しやすいのかもしれない。ただ新しい体験の楽しさの影響もありうるので、長く続けたときの効果も知りたくなる。", "unverified": "本文が入手できず、群間差の統計的な有意性と、割付の方法は確認できていない。"}, "citescore": 33.4, "citescore_year": "2025"}, {"rank": 13, "field": "経済学", "headline": "米国の医療費の伸びは価格の上乗せが主因", "title": "Health Sector Structural Change", "url": "https://doi.org/10.1257/mac.20240013", "authors": "Nick Pretnar ほか", "venue": "American Economic Journal: Macroeconomics", "date": "2026-09-29", "sjr": 12.637, "why": "二部門の一般均衡モデルで、医療サービスの相対価格の上昇がほぼマークアップの増加で説明できることを示した。", "id": "jn13", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "米国の医療サービス部門の支出比率と相対価格の上昇を、独占的競争と内生的な人口を持つ2部門の一般均衡モデルで分解し、相対価格の上昇はほぼすべて部門の相対的なマークアップ（価格の上乗せ）の増加によることを示した（抄録）。", "p2": "米国の医療は支出の比率も相対価格も上がってきたが、その原因が高齢化などの需要か、供給側の要因かの切り分けが課題だった（抄録）。", "p3": "独占的競争と内生的な人口を持つ2部門の一般均衡モデルで、価格・支出の変化を需要（高齢化）、マークアップ、全要素生産性（TFP）に分解した（抄録）。", "p4": "一般均衡の効果と相対マークアップの上昇を統制して、医療部門のTFPの成長率を推定した（抄録）。", "p5": "相対価格の上昇はほぼすべて相対的なマークアップの増加に起因し、高齢化による需要効果は価格と支出比率の押し上げに小さな役割しか果たさなかった（抄録）。医療部門のTFPは1980年代以降、年1%を超える率で成長し、相対価格の上昇を抑えつつ産出を増やし、全体の支出比率の上昇の一部をもたらした（抄録）。", "p6": "解釈：マークアップの推計はモデルの構造に依存し、医療の質の向上をどう扱ったかは抄録からは分からない。", "fun": "アメリカの医療費が上がり続けている理由は、お年寄りが増えたからだと思われがちだ。経済のモデルで分解すると、主な原因は高齢化ではなく、医療の値段にのせる「上乗せ分」が増えたことだった。一方で医療の生産性は年1%以上伸びていた。原因の思い込みを数字で覆す点が面白い。", "unverified": "本文が入手できず、マークアップの推計の方法と数値は確認できていない。"}, "citescore": 11.1, "citescore_year": "2025"}, {"rank": 14, "field": "総合誌の成果", "headline": "麻酔下の脳の動態は生物種をまたいで共通", "title": "Comprehensive profiling of brain dynamics during anesthesia across phylogeny", "url": "https://doi.org/10.1038/s41593-026-02460-4", "authors": "Andrea I. Luppi ほか", "venue": "Nature Neuroscience", "date": "2026-09-29", "sjr": 11.041, "why": "ヒトから魚まで複数の種の神経活動を集め、麻酔による脳の動態の共通性を示した。", "id": "jn14", "explain": {"basis": "本文", "basis_note": "出版社（Nature Neuroscience）のHTML本文（抄録、結果のデータ構成と局所動態の表現型、図2のキャプション、局所から大域の節の冒頭、考察の限界）を読んだ。遺伝子発現・計算モデルの節の詳細は読んでいない", "preprint": false, "p1": "ヒト・マカク・マーモセット・マウス・ゼブラフィッシュ・線虫の6種の覚醒時と麻酔時の神経活動を集め、6,000を超える時系列の特徴量で調べて、麻酔が種を越えて共通に「局所の神経活動の時間スケールを短くし、領域間の同期を弱める」ことを示した（抄録）。", "p2": "麻酔薬の行動への効果は種を越えて保存されており、共通の基盤があると示唆されるが、既存研究は少数の特徴や種・薬に限られていた（抄録、考察）。", "p3": "各データセットで覚醒と麻酔の条件を対比し、hctsaツールボックスで各領域（線虫・ゼブラフィッシュでは各ニューロン）の時系列から6,827の特徴量を抽出し、Hedgesのgの効果量で種・データ間を比較可能にした（§結果）。領域間の機能的結合と動態の類似度も計算し、遺伝子発現との対応と生物物理モデルで分子機序とのつながりを調べた（抄録、§局所から大域）。", "p4": "データはヒトのfMRI（n=15、セボフルラン）、マカク（n=5、セボフルラン・プロポフォール・ケタミン）、マーモセット（n=4）、マウス（n=43）、ゼブラフィッシュのカルシウムイメージング（n=7）、線虫（n=10）で、さらにマカク2頭の視床の深部脳刺激（DBS）のデータを含む（§結果）。", "p5": "種・薬・計測法の違いにかかわらず、同じ特徴が同じ向きに変わる縦の帯が一貫して見られた（図2）。麻酔中にマカクの中心内側視床をDBSで刺激して覚醒させると、この動態のプロファイルが逆向きに変わり行動の応答が戻った（抄録、§結果）。この動態の表現型は興奮性・抑制性の神経伝達の転写プロファイルと共変し、麻酔は局所の神経活動を時空間的に孤立させるという共通の終点が示された（抄録）。", "p6": "著者は、種と計測法の異なるデータを組み合わせる方法論上の不均一性を限界に挙げ、種や薬の違いの由来の解明は今後の課題とする（考察）。解釈：各種の標本数は小さく（マカク5頭など）、共通点に焦点を当てた分析のため、薬ごとの違いは十分に扱われていない。", "fun": "人も猿もネズミも魚も、さらに体長1mmの線虫まで、麻酔をかけると同じように動かなくなる。6種の脳の活動を6,000通り以上の物差しで比べると、どの種でも「脳の各部分の活動が短い時間でせかせか変わり、互いに足並みがそろわなくなる」という共通の変化が見つかった。進化の枝を越えて意識の消え方に共通点がある、という発見が面白い。", "unverified": "遺伝子発現との対応の定量的な結果と、計算モデルの詳細（§計算モデル）は確認していない。"}, "citescore": 33.0, "citescore_year": "2025"}, {"rank": 15, "field": "組織行動・心理的安全性", "headline": "尊厳ある人生は職場の外の関係からも生まれる", "title": "Life’s dignity within and beyond the workplace: Results from a national sample of US workers", "url": "https://doi.org/10.1177/09500170261468238", "authors": "Matthew A. Andersson ほか", "venue": "Work, Employment and Society", "date": "2026-09-29", "sjr": 2.204, "why": "米国の働き手の全国標本で、職場内外の人間関係の質と生活の尊厳の関係を調べた。", "id": "jn15", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "2021年のGallupの米国の働き手551人の調査で、職場内と職場外の人間関係の質（尊重、承認、本物らしさ、親密さ、支援）が、尊厳ある人生を送っているという感覚と強く結びつき、女性では職場外、男性では職場内の関係がより重要なことを示した（抄録）。", "p2": "社会関係は尊厳に不可欠とされるが、関係の中核的な質が尊厳ある人生とどう結びつくかは実証されていなかった（抄録）。現代の働き手の疎外を考えると、尊厳は職場の外の関係から同じかそれ以上に生まれるかもしれない（抄録）。", "p3": "職場と職場外の関係について、尊重・承認・本物らしさ・親密さ・支援という幅広い過程を測り、尊厳ある人生の知覚との関連を分析した（抄録）。", "p4": "米国のGallupの2021年の調査（N=551）で、性別と大卒かどうかによる違いを比べた（抄録）。", "p5": "職場と職場外の関係はどちらも尊厳ある人生の知覚と強く結びつき、承認と本物らしさは尊重・親密さ・情緒的支援より得にくかった（抄録）。職場外の関係は女性の尊厳に、職場の関係は男性の尊厳により重要だった（抄録）。大卒かどうかによる違いはなく、主体性と境界づくりが尊厳の構築に重要だと示唆された（抄録）。", "p6": "解釈：横断調査で因果の向きは分からず、標本は551人と中程度である。尊厳の測り方の詳細は抄録からは分からない。", "fun": "「自分は尊厳のある人生を送っている」と感じられるかは、職場で尊重されるかだけでなく、家族や友人との関係にも大きく左右された。しかも女性は職場の外の関係、男性は職場の関係がより効いていた。人生の誇りの源が人によって違う場所にある、という発見が面白い。", "unverified": "本文が入手できず、効果の大きさと尊厳の測定項目は確認できていない。"}, "citescore": 9.0, "citescore_year": "2025"}, {"rank": 16, "field": "経済学", "headline": "新興国の景気順応的な財政政策の理由", "title": "Procyclical Fiscal Policy and Asset Market Incompleteness", "url": "https://doi.org/10.1257/mac.20220304", "authors": "Andrés Fernández ほか", "venue": "American Economic Journal: Macroeconomics", "date": "2026-09-29", "sjr": 12.637, "why": "資産市場の不完備性から、新興国で税率と政府支出が景気に順応的になる理由を説明した。", "id": "jn16", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "新興国で財政政策が景気に順応的（好況で支出拡大・減税）になる理由を、最適な税率と政府支出の景気循環上の同時の振る舞いのモデルで説明した（抄録）。", "p3": "新興国の重要な特徴である金融摩擦を、資産市場の不完備性の程度と、負債に弾力的な金利スプレッドの水準で表したモデルを構築した（抄録）。", "p5": "不完備な市場は政府支出の順応性を説明できるが、税の順応性は必ずしも説明できず、それには民間消費と公的消費の比率が景気と正に連動することも必要だった（抄録）。", "fun": "本当は景気が悪いときに政府がお金を使い、良いときに控えるのが教科書どおりだが、新興国では逆のことがよく起きる。お金を借りにくい市場の不完全さがその理由の一部を説明するが、税の動きまで説明するには別の条件が要る、という整理が面白い。", "unverified": "本文が入手できず、モデルの較正と定量的な結果は確認できていない。"}, "citescore": 11.1, "citescore_year": "2025"}, {"rank": 17, "field": "経済学", "headline": "法の支配が世界金融循環から国を守る", "title": "Leaning against the Global Financial Cycle", "url": "https://doi.org/10.1257/mac.20220388", "authors": "Andrea Ferrero ほか", "venue": "American Economic Journal: Macroeconomics", "date": "2026-09-29", "sjr": 12.637, "why": "制度の質が高い新興国ほど世界金融循環の影響を受けにくいことを示した。", "id": "jn17", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "法の支配が強い新興国ほど、世界的な金融の逆風を受けたときの国内の金融・マクロ経済の引き締まりが小さいことを示し、金融摩擦のモデルで説明した（抄録）。", "p3": "制度の質（契約の執行、財産権の保護）と、世界金融循環の不利なショックへの国内の反応の関係を実証し、担保制約を含む簡略化したモデルで解釈した（抄録）。", "p5": "法の支配の強い国は世界金融のショックでの国内の条件の悪化が小さく、強い制度とガバナンスが担保制約を緩めて世界の金融圧力の影響を和らげることを示した（抄録）。", "fun": "アメリカの金利が上がると、世界中の新興国からお金が引き上げられやすい。でも、契約がきちんと守られ財産が守られる国ほど、その打撃が小さかった。ルールの信頼が経済の防波堤になる、という見方が面白い。", "unverified": "本文が入手できず、対象国・期間と効果の大きさは確認できていない。"}, "citescore": 11.1, "citescore_year": "2025"}, {"rank": 18, "field": "経済学", "headline": "企業のインフレ期待はどう作られるか", "title": "Information and the Formation of Inflation Expectations by Firms: Evidence from a Survey of Israeli Firms", "url": "https://doi.org/10.1257/mac.20230289", "authors": "Yuriy Gorodnichenko ほか", "venue": "American Economic Journal: Macroeconomics", "date": "2026-09-29", "sjr": 12.637, "why": "イスラエル企業の調査から、体制変化後の企業のインフレ期待の形成を分析した。", "id": "jn18", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "イスラエル銀行の企業調査で、金融政策の体制転換と低インフレへの移行の後、企業がインフレ期待をどう形成し、新しい情報でどう更新するかを分析した（抄録）。", "p3": "企業のインフレ期待の基本的な性質を記述し、インフレや金融政策の新情報を受けたときの更新を調べた（抄録）。", "p5": "ドル化の解消と物価の安定が成功した後でも、予想外のインフレ上昇はインフレ期待の大きな上方修正を招き、経営者の経験が物価安定の後も長く企業をインフレに敏感にさせていると示唆された（抄録）。", "fun": "一度ひどいインフレを経験した国の経営者は、物価が落ち着いた後もインフレに敏感なままだった。予想より少し物価が上がると、すぐに将来の見通しを大きく引き上げる。昔の経験が人の予想を長く左右する、という点が面白い。", "unverified": "本文が入手できず、効果の大きさと調査の期間は確認できていない。"}, "citescore": 11.1, "citescore_year": "2025"}, {"rank": 19, "field": "経済学", "headline": "気候リスクと農地の耕作放棄", "title": "Multidimensional climate physical risk and reported farmland abandonment among rural farm households in China: evidence from household panel data", "url": "https://doi.org/10.3389/fsufs.2026.1948860", "authors": "Ruofan Liao ほか", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-09-28", "sjr": 0.768, "why": "中国の農家パネルで、多次元の気候物理リスクと耕作放棄の関係を調べた。", "id": "jn19", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "中国の家計パネル（CLDS 2014・2016・2018年）で、多次元の気候の物理的リスクが農家の申告した耕作放棄と関連するかを調べた（抄録）。", "p3": "調査の各波を直前の農業年の省レベルの気候物理リスク指数（CPRI）と結びつけ、27省の11,982世帯・19,311の世帯・年の不均衡パネルで、世帯固定効果の線形確率モデル、調査波の固定効果、省クラスターの標準誤差とワイルド・クラスター・ブートストラップで推定した（抄録）。", "p5": "結果の記述は抄録の読めた範囲では途中まで。放棄は請負農地の一部が期間中に耕作されなかったという申告で、一時的か持続的か、理由は調査からは分からない（抄録）。", "fun": "気候が荒れると、農家は畑を手放しやすくなるのか。中国の11,982世帯の調査で、前の年の気候のリスクと「耕さなかった畑がある」という回答の関係を調べた。気候変動が農村の暮らしに与える影響を身近な単位で測る試みである。", "unverified": "抄録が途中までしか読めず、関連の向きと大きさは確認できていない。"}, "citescore": 6.0, "citescore_year": "2025"}, {"rank": 20, "field": "経済学", "headline": "ブラジルの自然喪失は国内市場が主因", "title": "The role of domestic and international markets in the loss of nature across Brazil", "url": "https://doi.org/10.1088/1748-9326/aeacfe", "authors": "Damares Lopes Afonso ほか", "venue": "Environmental Research Letters", "date": "2026-09-28", "sjr": 1.933, "why": "農地転換による自然喪失に国内市場と国際市場がどれだけ寄与したかを分解した。", "id": "jn20", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "ブラジルの地域間産業連関モデルで、2010〜2015年の6つのバイオームの自然植生の転換を、36の産業部門・47の国内地域・4つの海外の貿易相手の需要に結びつけた（抄録）。", "p3": "転換の要因を、州内の消費、他州の需要、国際貿易（EU・米国・中国・その他）に分解する地域間の投入産出モデルを作った（抄録）。", "p5": "転換の37.8%は州内の消費、35.2%は他州の需要、残る27%は国際貿易によるものだった（抄録）。森林以外の転換の面積は森林の転換を上回った（抄録）。", "fun": "アマゾンの森林破壊というと、輸出用の大豆や牛肉のためと思われがちだ。ところが産業のつながりをたどると、自然を畑に変えた原因の7割以上はブラジル国内の消費だった。しかも森林より草原や湿地の方が多く失われていた。思い込みを数字で正す研究として面白い。", "unverified": "抄録が途中までしか読めず、バイオーム別の結果の詳細は確認できていない。"}, "citescore": 9.3, "citescore_year": "2025"}, {"rank": 21, "field": "経営学", "headline": "戦略ワークショップに「賢い遊び」を入れる", "title": "Between Play and Reason: Integrating Sensible Foolishness Into Strategy‐Making Workshops", "url": "https://doi.org/10.1111/joms.70167", "authors": "Rebecca Lu ほか", "venue": "Journal of Management Studies", "date": "2026-09-29", "sjr": 5.178, "why": "遊びと合理性の相互作用が戦略づくりのワークショップで果たす役割を調べた。", "id": "jn21", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "中小企業3社の質的な実験研究で、戦略づくりのワークショップに遊びを通じた「賢い愚かさ」を取り入れると、遊びと理性の相互作用が戦略的な洞察を生むことを示した（抄録）。", "p3": "高い賭け金の戦略課題に賢い愚かさでどう取り組めるかを、3社のワークショップの質的な分析で調べた（抄録）。", "p5": "参加者が遊びの雰囲気を共に作り、より表現的で身体的なあり方に移ると、遊びと理性の相互作用が生成的な勢いを得た（抄録）。遊びと理性を統合する3つの移行の様式（意図的、弁証法的、滞留的）を特定し、過程理論を示した（抄録）。", "fun": "会社の大事な戦略を決める会議に、あえて「遊び」を持ち込むと、固い常識から抜け出して新しいアイデアが生まれることがある。この研究は、遊びと真面目な理屈を行き来する3つのやり方を見つけた。真剣な場でふざけることの価値を示した点が面白い。", "unverified": "本文が入手できず、3社の事例の具体的な内容は確認できていない。"}, "citescore": 14.7, "citescore_year": "2025"}, {"rank": 22, "field": "経営学", "headline": "起業における社会移動をどう研究するか", "title": "How Can We Research Social Mobility in Entrepreneurship?", "url": "https://doi.org/10.1177/10422587261485969", "authors": "Elsa T. Chan ほか", "venue": "Entrepreneurship Theory and Practice", "date": "2026-09-29", "sjr": 5.67, "why": "起業を通じた社会移動の研究の概念と方法を整理した。", "id": "jn22", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "起業を通じた社会移動の研究を進めるため、概念と方法の課題とその解決策、所得以外の多次元の社会移動の指標、量的・質的な代替手法を示した（抄録）。", "p3": "起業での社会移動を捉える際の固有の概念・方法の課題を検討し、多次元の指標を導入し、代替の量的・質的方法の使い方を示した方法論の論文（抄録）。", "p5": "所得中心の既存の量的研究を超える多次元の社会移動の指標と、より全体的な証拠を生む手法を示したと述べる（抄録）。実証結果は抄録にない。", "fun": "起業すると人生の階段を上れるのか。これまでは収入の増減で測ることが多かったが、それだけでは不十分だ。この論文は、職業の地位や暮らしの安定など、いろいろな物差しで「上がった・下がった」を測る方法を整理した。起業と格差の関係を考える土台として面白い。", "unverified": "本文が入手できず、提案された指標の具体的な内容は確認できていない。"}, "citescore": 21.9, "citescore_year": "2025"}, {"rank": 23, "field": "経営学", "headline": "社会的周縁化の統合的レビュー", "title": "Toward a Framework of Social Marginalization: An Integrative Review and Research Agenda", "url": "https://doi.org/10.5465/annals.2025.0093", "authors": "McKenzie Preston ほか", "venue": "Academy of Management Annals", "date": "2026-09-29", "sjr": 14.367, "why": "社会的周縁化の概念を統合し研究課題を示したレビュー。", "id": "jn23", "explain": {"basis": "題名", "basis_note": "Academy of Management Annalsの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、社会的周縁化（人々が社会の中心から外れ、排除されていく過程）について、既存研究を統合したレビューと枠組み、研究課題を示した論文だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "社会の端に追いやられる人々は、どのようにしてそうなり、それはどう続いていくのか。題名からは、組織や経営の研究でばらばらに語られてきた「周縁化」を一つの枠組みにまとめ直そうとする試みが読み取れる。包摂を考える上での土台になりうる問いである。", "unverified": "抄録・本文とも入手できず、方法・内容はすべて確認できていない。"}, "citescore": 27.7, "citescore_year": "2025"}, {"rank": 24, "field": "経営学", "headline": "スタートアップの複数プラットフォーム参加", "title": "Startup multihoming in enterprise software ecosystems: The role of skill breadth and organizational learning", "url": "https://doi.org/10.1002/sej.70048", "authors": "Vijayaraghavan Venkataraman ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-09-29", "sjr": 3.821, "why": "企業向けソフトの生態系で、提携期間と複数参加の逆U字の関係を学習の観点で示した。", "id": "jn24", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "スタートアップが最初のプラットフォームとの提携の長さに応じて別のプラットフォームにも参加（マルチホーミング）するかを、探索から活用への学習の移行で説明し、SAPのパートナーのデータで検証した（抄録）。", "p3": "提携の期間と複数参加の確率の逆U字の関係と、技能の幅による違いを理論化し、Oracleの買収で複数参加の期待利益が増えたことを使ってSAPパートナーの新しいデータで検証した（抄録）。", "p5": "実証の結果は仮説と整合的だった（抄録）。技能の幅が広いスタートアップは初めは学習が遅いが、時間とともに適応力が増して複数参加に有利になった（抄録）。", "fun": "新しい会社が大きなソフトの「生態系」に参加すると、はじめは学ぶことが多く、やがて得意分野を深める。その途中の時期に別の生態系にも手を広げやすく、長すぎても短すぎても広げにくい、という山型の関係が見つかった。成長の段階で戦略が変わる点が面白い。", "unverified": "本文が入手できず、標本の規模と効果の大きさは確認できていない。"}, "citescore": 11.4, "citescore_year": "2025"}, {"rank": 25, "field": "経営学", "headline": "参加型の戦略を組織能力に変える", "title": "Turning Participation into Durable Organizational Capability", "url": "https://doi.org/10.1177/00081256261484946", "authors": "Laure Marty ほか", "venue": "California Management Review", "date": "2026-09-29", "sjr": 2.746, "why": "SaaS企業の3年の事例から、従業員参加の戦略づくりが能力の刷新につながる仕組みを示した。", "id": "jn25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "欧州のSaaSの急成長企業の3年間の事例研究で、範囲を限った「開かれた戦略」の介入が、従業員の参加を組織能力の刷新につなげる3つの仕組みを特定した（抄録）。", "p3": "戦略の転換期に、従業員が参加する戦略づくりが仕事のやり方を変えるかを、3年間の事例で分析した（抄録）。", "p5": "部門横断の三角測量、作成者としての正当性、分散した翻訳の3つの仕組みが、介入を超えて調整を作り変え、参加型の過程で能力の刷新が実現することを説明した（抄録）。結果を実務の枠組みRESETにまとめた（抄録）。", "fun": "社員を戦略づくりに参加させても、形だけで終わることが多い。この会社では、いろいろな部署の人が意見を突き合わせ、「自分たちが作った」と思え、それぞれの現場の言葉に訳して広めたことで、参加が本当の力になった。参加を飾りで終わらせない条件が分かる。", "unverified": "本文が入手できず、事例の具体的な経過は確認できていない。"}, "citescore": 14.4, "citescore_year": "2025"}, {"rank": 26, "field": "経営学", "headline": "ゲーム開発のアジャイル手法とリリース時期", "title": "EXPRESS: Agile Approaches for Gaming Software Development", "url": "https://doi.org/10.1177/10591478261495695", "authors": "Joohyun Kim ほか", "venue": "Production and Operations Management", "date": "2026-09-29", "sjr": 3.612, "why": "ライブサービス型のゲームで、リリース時期を運用の制御変数としてモデル化した。", "id": "jn26", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "アジャイル開発と継続的な配信で運営されるライブサービス型のオンラインゲームで、リリースの時期を運用上の制御変数として内生化する複数回リリースの最適制御の枠組みを作った（抄録）。", "p3": "機能の成長とエラーの動態のモデル（Jiら2005）を拡張し、繰り返しのリリース判断を開発過程に組み込み、構築の努力・デバッグ 読めた範囲に含まれていない。", "fun": "大けがをした人を救うには、治療のできる病院にどれだけ早く運べるかが勝負だ。でも外傷センターを増やすにはお金も専門家も要る。限られた数のセンターをどこに置けば、一番多くの人を早く救えるか、そして地域間の不公平をどう減らすかを、地図と計算で考えた研究だ。", "unverified": "抄録が途中までしか読めず、配置の改善による到達時間の変化は確認できていない。"}, "citescore": 14.3, "citescore_year": "2025"}, {"rank": 29, "field": "経営学", "headline": "動的な定期サービス網設計の費用関数近似", "title": "Cost Function Approximation for the Dynamic Scheduled Service Network Design Problem", "url": "https://doi.org/10.1287/trsc.2025.0428", "authors": "Alexander Bode ほか", "venue": "Transportation Science", "date": "2026-09-29", "sjr": 2.371, "why": "物流事業者の確率的・動的なサービス網設計を費用関数近似で解いた。", "id": "jn29", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "物流事業者が将来の荷物を知らないまま、中継拠点のネットワークで定期的に荷物を経路づけする確率的・動的なサービス網設計の問題を、逐次決定過程として定式化し、費用関数近似（CFA）で解いた（抄録）。", "p3": "時間展開ネットワークで実行可能な終着点を示す中間目的地ノード（IDN）で決定空間を再定式化し、IDNごとのCFA項で将来の混載の可能性が高い方へ荷物を導いた（抄録）。", "p5": "大規模な計算実験で、CFAに基づく方法が基準の方策より優れ、IDNがその性能に寄与することを示した（抄録）。", "fun": "宅配便の会社は、明日どんな荷物が来るか分からないまま、今日の荷物をどこでまとめてトラックに載せるかを決めなければならない。「将来まとめやすそうな拠点」に少し点数を足して誘導するだけで、全体の費用が下がった。先の見えない中での段取りの工夫が面白い。", "unverified": "抄録が途中までしか読めず、費用の改善幅は確認できていない。"}, "citescore": 10.0, "citescore_year": "2025"}, {"rank": 30, "field": "組織行動・心理的安全性", "headline": "プラットフォーム労働者は不安定か", "title": "Precarious platform work, Precarious platform workers? A multi-level approach towards the economic situation of platform workers in Germany", "url": "https://doi.org/10.1177/09500170261471066", "authors": "Sabrina Glanz ほか", "venue": "Work, Employment and Society", "date": "2026-09-29", "sjr": 2.204, "why": "ドイツのプラットフォーム労働者の経済状況を世帯全体の中で位置づけた。", "id": "jn30", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "ドイツのプラットフォーム労働者430人の調査で、プラットフォームでの稼ぎを他の雇用の収入と世帯収入の中に位置づけ、多層的な経済的不安定さを調べた（抄録）。", "p3": "プラットフォーム労働の種類を区別し、プラットフォームの稼ぎ、他の雇用の収入、世帯収入の相互作用と、社会人口学的な変数の効果を分析した（抄録）。", "p5": "プラットフォームの低い稼ぎは広く見られたが、通常は他の収入源で補われ、それでも 波の全数調査で、急性の危機期と慢性の負担期で、職業ストレス・不安・不眠の症状のつながり方（ネットワーク）が変わることを示した（抄録）。", "p3": "急性期（2022年秋、October–November 2022、n=1,565）と慢性期（2023年末〜2024年初め、November 2023–January 2024、n=1,718）に、応答率96%超で調査し、グラフィカルLASSOの無向ネットワークとベイジアン・ネットワークで症状の結びつきを推定し、年齢と勤務時間で下位集団を分析した（抄録）。", "p5": "全体の苦痛は慢性期の方が低かったが、中心となる症状は違い、急性期は役割の不明確さや努力の要求などの運用の不安定さと不安の過覚醒、慢性期は持続する業務負担とくつろげないなどの回復の障害が中心だった（抄録）。ベイジアン・モデルでは仕事のストレス要因が上流に位置し、36歳未満では急性期の症状の結びつきがより強かった（抄録）。", "fun": "感染症の大流行のさなかと、それが長引いた後では、看護師の心の不調の「中心」が違った。最初は役割のあいまいさや焦りが、長引くと疲れて休めないことが中心になった。時期によって必要な支え方が違う、という結論は災害時の支援にも通じる。", "unverified": "本文が入手できず、中心性の指標の値は確認できていない。"}, "citescore": 12.4, "citescore_year": "2025"}, {"rank": 33, "field": "統計学", "headline": "大きなショックを含むマクロモデルの高速推定", "title": "Fast and Efficient Estimation of Macromodels with Large Shocks", "url": "https://doi.org/10.1080/07350015.2026.2740570", "authors": "Luisa Corrado ほか", "venue": "Journal of Business & Economic Statistics", "date": "2026-09-29", "sjr": 3.508, "why": "大きなショックを含むマクロ計量モデルの効率的な推定法。", "id": "jn33", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "大きなショックを受けるマクロ経済モデルを効率よく推定・分析する方法を提案し、コロナ禍への部門ごとの異なる露出をとらえる2部門モデルに適用した（抄録）。", "p3": "モデルを非線形に解き、大きなショックの発生源と時点を識別するための非線形・非ガウスのフィルタを提案した（抄録）。", "p5": "モンテカルロ実験で、大きなショックの推定と識別が大幅に短い計算時間で可能と示し、実証ではパンデミックの景気後退は大きな需要ショックと供給ショックの組み合わせで説明できた（抄録）。", "fun": "コロナ禍の景気の落ち込みは、人が買わなくなった（需要）のか、作れなくなった（供給）のか。普段の経済モデルは大きな衝撃が苦手だが、この研究は大きな揺れに強い計算方法を作り、両方が組み合わさった結果だと示した。", "unverified": "本文が入手できず、計算時間の短縮の程度は確認できていない。"}, "citescore": 5.9, "citescore_year": "2025"}, {"rank": 34, "field": "統計学", "headline": "分割共分散交差による分散カルマンフィルタ", "title": "Multi-Split Covariance Intersection Based Distributed Kalman Filter for Multi-Agent Systems", "url": "https://doi.org/10.1109/tac.2026.3738000", "authors": "Chao Xue ほか", "venue": "IEEE Transactions on Automatic Control", "date": "2026-09-29", "sjr": 3.929, "why": "多エージェント系で相関が未知の推定値を融合する分散カルマンフィルタを提案した。", "id": "jn34", "explain": {"basis": "題名", "basis_note": "IEEE Transactions on Automatic Controlの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、多数のエージェントが協力して状態を推定する分散カルマンフィルタで、推定値の相関が分からないまま融合する「共分散交差」を複数に分割して用いる方法を提案した研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "たくさんのロボットやセンサがそれぞれ推定した値を持ち寄るとき、同じ情報を二重に数えると自信過剰になる。題名からは、情報の重なりが分からなくても安全に推定値を合わせる方法を改良した研究だと読み取れる。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}, "citescore": 13.6, "citescore_year": "2025"}, {"rank": 35, "field": "機械学習", "headline": "細胞診の汎用基盤モデル", "title": "From task-specific tools to a universal foundation model for cytology", "url": "https://doi.org/10.1038/s43018-026-01239-7", "authors": "-", "venue": "Nature Cancer", "date": "2026-09-29", "sjr": 12.443, "why": "個別課題の道具から、細胞診全般に使える基盤モデルへの移行を示した。", "id": "jn35", "explain": {"basis": "抄録", "basis_note": "出版社のページに掲載された短い要約のみを読んだ（本文は取得できず）", "preprint": false, "short": true, "p1": "臓器・疾患・臨床の場面を越えて幅広い診断に使える、細胞診の汎用の基盤モデルCROWNを開発した（出版社ページの要約）。", "p3": "細胞診は、がんの検診と診断に必要だが、既存のAIの多くは個別の作業や特定の検体の種類に限られていたことを背景に、汎用の基盤モデルを開発したと述べる（要約）。", "p5": "具体的な性能の数値は要約にない。", "fun": "細胞を顕微鏡で見てがんを見つける細胞診では、これまで臓器ごと・作業ごとに別々のAIが作られてきた。この研究は、一つのAIでいろいろな臓器や病気の細胞診をこなせる「何でも屋」を目指した。専門の道具から万能の道具へ、という流れが医療AIにも来ている。", "unverified": "出版社ページの短い要約のみで、データ・評価・性能は確認できていない。"}, "citescore": 38.5, "citescore_year": "2025"}, {"rank": 36, "field": "機械学習", "headline": "視線推定の正準埋め込み", "title": "GazeManifold: Learning Canonical Gaze Embeddings for Interpretable and Mapping-Efficient Gaze Estimation", "url": "https://doi.org/10.1109/tpami.2026.3738559", "authors": "Yiwei Bao ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-29", "sjr": 4.829, "why": "解釈しやすく写像効率のよい視線推定のための埋め込み学習。", "id": "jn36", "explain": {"basis": "題名", "basis_note": "IEEE TPAMIの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、視線の方向を推定するために、解釈しやすく、人ごとの写像の調整が効率的な「正準的な視線の埋め込み」を学習する方法を提案した研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "カメラの映像から人がどこを見ているかを当てる技術は、人ごとに目の形や見え方が違うので調整が面倒だ。題名からは、人に依らない共通の「視線の地図」を学んでおき、少ない調整で個人に合わせられるようにした研究だと読み取れる。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}, "citescore": 41.1, "citescore_year": "2025"}, {"rank": 37, "field": "機械学習", "headline": "複数人の脳活動から画像を再構成", "title": "Unified Multi-Subject Image Reconstruction From Human Brain Activity", "url": "https://doi.org/10.1109/tpami.2026.3738650", "authors": "Ruijie Quan ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-09-29", "sjr": 4.829, "why": "被験者をまたいで脳活動から画像を再構成する統一モデル。", "id": "jn37", "explain": {"basis": "題名", "basis_note": "IEEE TPAMIの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、複数の被験者の脳活動から、見ていた画像を一つの統一モデルで再構成する研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "脳の活動から見ている画像を再現する研究は、これまで一人ずつモデルを作ることが多かった。脳の形は人それぞれだからだ。題名からは、複数の人の脳のデータをまとめて一つのモデルで扱えるようにした研究だと読み取れ、脳の個人差をどう乗り越えるかが面白い。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}, "citescore": 41.1, "citescore_year": "2025"}, {"rank": 38, "field": "機械学習", "headline": "ゲノムからファージと宿主の相互作用を予測", "title": "Phylogeny-agnostic strain-level prediction of phage–host interactions from genomes using machine learning", "url": "https://doi.org/10.1038/s41564-026-02482-5", "authors": "Avery J. C. Noonan ほか", "venue": "Nature Microbiology", "date": "2026-09-29", "sjr": 7.44, "why": "系統に依らず菌株レベルでファージと宿主の相互作用を機械学習で予測した。", "id": "jn38", "explain": {"basis": "抄録", "basis_note": "出版社（Nature Microbiology）の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": false, "short": true, "p1": "ゲノム配列だけから、細菌の系統に依らず菌株単位でファージ（細菌に感染するウイルス）と宿主の相互作用を予測する機械学習の枠組みを作り、実験で検証した（抄録）。", "p3": "6つのデータセット（115,037の相互作用、949菌株、518ファージ）で1,320万回の学習を行って流れを体系的に最適化し、予測した大腸菌のファージ-宿主の相互作用1,240件を実験で検証し、ゲノム全体のRB-TnSeqで感染の仲介因子を確かめた（抄録）。", "p5": "系統の制約をなくしつつ種特異的な手法と同等の性能（AUROC 0.67〜0.94）を達成し、実験検証でAUROC 0.84、実験で見つかった感染の仲介因子の68.6%を計算で捉えた（抄録）。モデルに導かれたカクテルの設計は5つのファージで最大97.5%の菌株を覆い、単一ファージの選択は乱交性に基づく選択の最大3.1倍の改善だった（抄録）。", "fun": "抗生物質が効かない細菌には、細菌だけを食べるウイルス（ファージ）を使う治療が期待されている。でも、どのファージがどの菌株に効くかを調べるのが大変だった。遺伝子の配列だけで相性を予測し、5種類の組み合わせで97.5%の菌をカバーできた点が面白い。", "unverified": "本文は取得したが短い解説のため抄録の範囲で書いた。応用の臨床的な検証は確認していない。"}, "citescore": 28.8, "citescore_year": "2025"}, {"rank": 39, "field": "機械学習", "headline": "LLMで特許網からAIの進化を描く", "title": "Mapping the evolution of artificial intelligence: an LLM-driven patent network analysis", "url": "https://doi.org/10.1007/s11192-026-05827-3", "authors": "Jiahui Zhang ほか", "venue": "Scientometrics", "date": "2026-09-29", "sjr": 1.077, "why": "LLMを使った特許ネットワーク分析でAI技術の発展を可視化した。", "id": "jn39", "explain": {"basis": "抄録", "basis_note": "出版社のページに掲載された抄録のみを読んだ（本文は取得できず）", "preprint": false, "short": true, "p1": "LLMで特許の文章から最小の機能単位を抽出して親子の技術構造に組み上げる枠組みを作り、2000〜2024年の世界のAI特許774,737件で時間変化する技術ネットワークを構築した（抄録）。", "p3": "コミュニティ検出、PageRank、正規化相互情報量で、AI技術の内部構造の時間変化を調べた（抄録）。", "p5": "AIは比較的分散したアルゴリズムの構成から、データ処理・表現・モデル学習の要素がより目立つ、モジュール化された階層的な構造へと非線形に進化したことが示唆された（抄録）。", "fun": "774,737件のAIの特許を、AIに読ませて「どの部品がどの部品の上に乗っているか」という技術の家系図にした。すると、昔はばらばらだったAIの技術が、データの処理、表現、学習という部品を組み合わせる形に整理されてきた様子が見えた。技術の進化を地図にした点が面白い。", "unverified": "抽出の精度の検証方法は確認できていない。"}, "citescore": 6.9, "citescore_year": "2025"}, {"rank": 40, "field": "機械学習", "headline": "LLMで海面水温を予測", "title": "LLM4SST: Harnessing LLMs with Spatiotemporal Distribution-Aware Optimization Strategy for Structurally Consistent Sea Surface Temperature Prediction", "url": "https://doi.org/10.1016/j.eswa.2026.134587", "authors": "Yuwei Chen ほか", "venue": "Expert Systems with Applications", "date": "2026-09-29", "sjr": 1.939, "why": "時空間分布を考慮した最適化でLLMを海面水温予測に使った。", "id": "jn40", "explain": {"basis": "題名", "basis_note": "Expert Systems with Applicationsの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、時空間の分布を考慮した最適化の戦略でLLMを海面水温の予測に活用し、構造的に一貫した予測を目指した研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "文章を扱うAIを     m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, following the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私",
    "- 詳しさ：{depth}",
    "- 成果物：会話での解説のみ。ファイルは作らない。",
    "",
    "進め方",
    "- 研究用ドライブを読める環境なら、最初に skill「shin-paper-explain」を使う（Claude Code は /shin-paper-explain、Codex は $shin-paper-explain。見つからなければ agent-config の skills/shin-paper-explain/SKILL.md を読む）。読めない環境では、以下の手順だけで進める。",
    "- 論文ファイルが手元になければ、対象案件の文献フォルダ（研究案件は B_research の INDEX.md から探す）、DOI・出版社の一次資料の順に探す。",
    "- サブエージェントは使わない。",
    "",
    "手順",
    "1. 原文を読んでから書く。本文・図表・付録まで確かめる。概要しか読めないときは、その範囲の解説だと最初に書く。",
    "2. 次の順で説明する。",
    "   (1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "   (2) 問い：何が課題で、従来の方法のどこが足りないか",
    "   (3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "   (4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "   (5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "   (6) 限界：著者が認める限界と、残る疑問。私の研究への示唆は、求めたときだけ加える",
    "3. 数値・主張には節・図・式・ページを添える。論文の主張、解説として補った背景、あなたの解釈を区別する。",
    "4. 数値を孫引きしない。未査読のプレプリントはその旨を書く。専門用語は初出で定義し、英語の原語を併記する。比喩で正確さを落とさない。",
    "5. 答える前に、書いた数値・図表番号・主張を原文と照合する。照合できなかった箇所は推測で埋めず「未確認」と書く。",
    "",
    "出力",
    "- (1)〜(6) を見出しにして日本語で書く。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。",
    "- 解説教科書や論文紹介スライドを作る依頼に変わったら、SKILL.md の表にある正本（例：研究論文解説の paper_guides）に従い、この会話用の手順は使わない。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。Claude Code や Codex で頼むときは、依頼文をコピーして貼り付けます。"
    : "依頼文をコピーして、Claude Code・Codex やAIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIのチャットや Claude Code・Codex に貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
