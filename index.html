トポロジー設計と脱均質化を結びつけ、低次元の形状記述子を、製造できる高解像度の構造に変換する。NSGA-IIによる選択、変分オートエンコーダの潜在空間での交叉、画像の変形に基づく新しい突然変異を統合した混合型の進化アルゴリズムを使う（抄録）。", "p5": "数値結果により、この方法が効率と設計の自由度の釣り合いを取り、形状の連続性を保ちながら最適化できることを確かめた（抄録）。性能の数値は抄録に記載なし。", "fun": "軽くて丈夫な部品を作るには、中身を骨のようなすかすかの構造にするとよい。その細かい形を計算で決める従来の方法は、手間がかかるうえ、複雑すぎて作れない形になりがちだった。この研究は、生き物の進化をまねて「良い形を掛け合わせ、少し変えて、また選ぶ」ことを繰り返し、実際に作れる形に着地させる。", "unverified": "本文未読のため、対象とした構造、計算時間、勾配法との比較の数値は未確認。"}}, {"id": "jn42", "rank": 42, "field": "工学", "headline": "ダフィング型共振器の履歴を積分共振制御で抑える", "title": "Semiglobal Monostability and Hysteresis Suppression in Duffing-Type Resonators via Modified Integral Resonant Control", "url": "https://doi.org/10.1016/j.jsv.2026.120248", "authors": "Sumeet S. Aphale ほか", "venue": "Journal of Sound and Vibration", "date": "2026-11-11", "citescore": 10.2, "citescore_year": "2025", "apa": "Aphale, S. S., & MacLean, J. D. J. (2026). Semiglobal Monostability and Hysteresis Suppression in Duffing-Type Resonators via Modified Integral Resonant Control. Journal of Sound and Vibration, 120248. https://doi.org/10.1016/j.jsv.2026.120248", "why": "題名から、修正した積分共振制御でダフィング型共振器を準大域的に単安定化し、履歴（ヒステリシス）を抑える研究（Journal of Sound and Vibration）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、ダフィング型の非線形共振器に修正した積分共振制御を適用し、広い範囲で応答を一つの安定状態にして、履歴（ヒステリシス）を抑える研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、ばねが変形につれて硬くなるような振動系では、同じ揺らし方でも「大きく揺れる状態」と「小さく揺れる状態」の二つがありえて、周波数を上げるときと下げるときで応答が食い違うが、これを制御で一つにそろえられるか、というものである。結果は未確認。", "unverified": "抄録・本文を入手できず、制御則の内容、安定性の証明、実験の有無はすべて未確認。"}}, {"id": "jn43", "rank": 43, "field": "工学", "headline": "複素テンソル分解で微弱な故障特徴を抽出", "title": "Robust complex tensor decomposition: A novel paradigm for extracting weak fault features from high-frequency carriers", "url": "https://doi.org/10.1016/j.ymssp.2026.115181", "authors": "He Dai ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-11", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Dai, H., Zhao, S., Luo, S., Wang, Y., Zhang, T., Zhao, P., & Zi, B. (2027). Robust complex tensor decomposition: A novel paradigm for extracting weak fault features from high-frequency carriers. Mechanical Systems and Signal Processing, 262, 115181. https://doi.org/10.1016/j.ymssp.2026.115181", "why": "題名から、頑健な複素テンソル分解で高周波の搬送波から微弱な故障特徴を取り出す方法の研究（Mechanical Systems and Signal Processing、SJR 2.342）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "選定の後に抄録を取得できた。同じ題名のSSRN版の抄録（Crossrefの題名検索で取得）を使用。出版版の本文は未取得", "preprint": false, "short": true, "p1": "強い背景雑音、不規則な外部の衝撃、高エネルギーの高調波に埋もれた複素数値の信号から、微弱な故障の特徴を取り出せる頑健なテンソル分解の方法を提案した（抄録）。", "p3": "振動信号をヒルベルト変換で複素数値の信号に変えると、微弱な故障の特徴を高周波の搬送波から切り離せる。そこに、スチューデントのt分布に基づく新しい頑健な類似度の指標を導入し、複素領域の半二次最適化と共役勾配法でその指標を最大化する（抄録）。", "p5": "シミュレーションと実験で、提案法が高周波の搬送波から微弱な故障の特徴を取り出せることを示した（抄録）。比較の数値は抄録に記載なし。", "fun": "機械の軸受に小さな傷ができると、ごく弱い周期的な衝撃が出る。しかしその合図は、機械自体の大きな振動や、たまたま起きる外からの衝撃に埋もれてしまう。この研究は、外れ値に強い統計の考え方を使って、目立つ邪魔者の影響を抑えながら信号を分解する。大きな声にかき消された小さな声を聞き分ける工夫である。", "unverified": "抄録はプレプリント版のもので、出版版との差は未確認。対象の機械と検出性能の数値も未確認。"}}, {"id": "jn44", "rank": 44, "field": "工学", "headline": "渦電流式同調粘性マスダンパーの閉形式の最適設計", "title": "Closed-form optimal design for eddy-current-based tuned viscous mass damper (EC-TVMD) under harmonic excitation and its seismic application", "url": "https://doi.org/10.1016/j.istruc.2026.113458", "authors": "Ziyuan Zhang ほか", "venue": "Structures", "date": "2026-11-11", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Zhang, Z., Tan, P., Li, Y., Chen, H., & Xiang, Y. (2026). Closed-form optimal design for eddy-current-based tuned viscous mass damper (EC-TVMD) under harmonic excitation and its seismic application. Structures, 94, 113458. https://doi.org/10.1016/j.istruc.2026.113458", "why": "題名から、渦電流を使う同調粘性マスダンパーの調和加振下の最適設計を閉形式で導き、地震応答に適用する研究（Structures、SJR 1.108）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、渦電流を使う同調粘性マスダンパー（EC-TVMD）について、調和加振のもとでの最適な設計値を閉じた式で導き、地震応答の低減に適用する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、建物の揺れを吸い取る装置の調整値を、何度も計算を繰り返して探すのでなく、紙の上の式一本で求められるか、というものである。磁石と金属板の間に生じる渦電流のブレーキを減衰に使う装置を対象にしている点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、最適化の基準、式の形、地震応答での効果はすべて未確認。"}}, {"id": "jn45", "rank": 45, "field": "工学", "headline": "少ないデータと表形式基盤モデルで浸水深を予測", "title": "Data-efficient flood depth prediction through domain-aware coreset selection and tabular foundation models", "url": "https://doi.org/10.1016/j.cacaie.2026.100268", "authors": "Lipai Huang ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-09", "citescore": 14.7, "citescore_year": "2025", "apa": "Huang, L., Srinath, A., Singh, M., Ma, J., & Mostafavi, A. (2026). Data-efficient flood depth prediction through domain-aware coreset selection and tabular foundation models. Computer-Aided Civil and Infrastructure Engineering, 100268. https://doi.org/10.1016/j.cacaie.2026.100268", "why": "題名から、領域知識に基づく代表点（コアセット）の選択と表形式基盤モデルで、少ないデータから浸水深を予測する研究（Computer-Aided Civil and Infrastructure Engineering）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "選定の後に抄録を取得できた。OpenAlexに登録された抄録を使用（出版社サイトの本文は未取得。抄録中の数値は取得時に欠けている）", "preprint": false, "short": true, "p1": "表形式の基盤モデルに、領域知識に基づいて選んだ少数の代表データ（コアセット）を推論時に与えることで、流域ごとの学習なしに浸水深を予測する方法を示した（抄録）。", "p3": "降雨を再現期間と最も影響を受ける流域で層別し、目標を意識した空間の選び方で六角形の区画を抽出して、コアセットを作る。物理シミュレータ並みの精度を得るのに流域ごとに数百万行の学習データを要する教師あり学習と比べた（抄録）。", "p5": "ヒューストン周辺の9流域で、教師ありの基準と統計的に区別できない精度を得て、同じ都市圏の未学習の流域にも再学習なしで移せた。実際の降雨では、分布から大きく外れた事例で基準を上回り、中程度に外れた混合の事例では下回った（抄録）。精度の数値は抄録から欠けている。", "fun": "洪水でどこが何センチ浸かるかを素早く予測したい。物理の計算は正確だが遅く、AIに覚えさせるには流域ごとに膨大なデータが要る。この研究は、あらかじめ大量の表データで鍛えた汎用のAIに、「この流域の代表的な例」を少しだけ見せて答えさせた。全部を覚え直させるのでなく、見本を上手に選んで見せる、という発想である。", "unverified": "取得した抄録では数値が欠けており、使用したデータの割合、精度の指標の値は未確認。"}}, {"id": "jn46", "rank": 46, "field": "工学", "headline": "らせん形の音響ブラックホールで薄板の広帯域制振", "title": "Broadband vibration attenuation of stiffened thin-walled plates using an add-on quasi-three-dimensional spiral acoustic-black-hole attachment", "url": "https://doi.org/10.1016/j.tws.2026.115972", "authors": "Qikai Wang ほか", "venue": "Thin-Walled Structures", "date": "2026-11-11", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "apa": "Wang, Q., Kong, W., Lin, Y., Wang, W., & Wu, W. (2026). Broadband vibration attenuation of stiffened thin-walled plates using an add-on quasi-three-dimensional spiral acoustic-black-hole attachment. Thin-Walled Structures, 115972. https://doi.org/10.1016/j.tws.2026.115972", "why": "題名から、後付けの準3次元のらせん形音響ブラックホールで補剛薄板の振動を広帯域に減衰させる研究（Thin-Walled Structures、SJR 1.734）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、補剛された薄板の振動を、後付けできる準三次元のらせん形の音響ブラックホール（先細りの形で振動エネルギーを集めて消す構造）で、広い周波数帯にわたって減らす研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、板の厚みをだんだん薄くしていくと波が先端に吸い込まれて戻ってこなくなる、という現象を利用した部品を、らせん状に巻いて小さくまとめ、既存の板にあとから取り付けるだけで振動を抑えられるか、というものである。場所を取らずに広い音域に効かせる工夫が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、形状の設計、減衰の大きさ、実験の有無はすべて未確認。"}}, {"id": "jn47", "rank": 47, "field": "物理学", "headline": "3次元の探索ではコーシー歩行がほぼ最適", "title": "Intermittent Cauchy walks enable optimal 3D search across target shapes and sizes", "url": "https://doi.org/10.1073/pnas.2614625123", "authors": "Matteo Stromieri ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-11", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Stromieri, M., Natale, E., & Korman, A. (2026). Intermittent Cauchy walks enable optimal 3D search across target shapes and sizes. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2614625123", "why": "3次元での間欠的なレヴィ歩行による探索の効率が、標的の体積・表面積・細長さに強く依存することを解析し、その中でコーシー歩行（指数μ=2）が幅広い標的の形と大きさにわたってほぼ最適な頑健な戦略になることを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "三次元の空間でまれな標的を探すとき、標的の形や大きさが違っても、コーシー歩行と呼ばれる動き方がほぼ最適になることを証明した（抄録）。", "p3": "短い移動とときどきの長い移動を混ぜる間欠的なレヴィ歩行を三次元で解析し、標的の体積・表面積・細長さが探索効率をどう左右するかを、レヴィ歩行の指数全体にわたって調べた（抄録）。", "p5": "体積nの領域にある表面積Δの凸な標的について、最適な検出時間の期待値はn/Δに比例する。指数μ = 2のコーシー歩行は対数の多項式の因子を除いてこの比例関係を達成し、他のレヴィ歩行は標的の形によって最適でなくなる（抄録）。", "fun": "海でえさを探すサメや、体の中で病原体を探す免疫細胞は、近くを細かく探すことと、遠くへ一気に移ることを混ぜている。どのくらいの割合で混ぜるのが良いかは、探す相手の形しだいで変わりそうに思える。ところが数学的に調べると、ある決まった混ぜ方が、相手が丸くても細長くても、ほぼ最良だった。万能の探し方があったのである。", "unverified": "本文未読のため、証明の前提（探索者の検出の規則など）と数値実験の有無は未確認。"}}, {"id": "jn48", "rank": 48, "field": "数学", "headline": "希薄フェルミ気体のHuang–Yang予想を証明", "title": "The Huang–Yang conjecture for the low-density Fermi gas", "url": "https://doi.org/10.1007/s00222-026-01459-9", "authors": "Emanuela L. Giacomelli ほか", "venue": "Inventiones Mathematicae", "date": "2026-11-11", "sjr": 5.202, "citescore": 6.6, "citescore_year": "2025", "apa": "Giacomelli, E. L., Hainzl, C., Nam, P. T., & Seiringer, R. (2026). The Huang–Yang conjecture for the low-density Fermi gas. Inventiones Mathematicae. https://doi.org/10.1007/s00222-026-01459-9", "why": "斥力の短距離相互作用を持つスピン1/2の希薄なフェルミ気体の基底エネルギーについて、1957年にHuangとYangが予言した3項の漸近展開を、対応する下界を証明することで確立した。式は相互作用の詳細によらず散乱長だけに依存する。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "斥力の短距離相互作用を持つ希薄なフェルミ気体の基底エネルギーについて、1957年にHuangとYangが予言した公式を数学的に証明した（抄録）。", "p3": "スピン1/2のフェルミ粒子の希薄な気体の基底エネルギーの、3項からなる漸近展開を扱う。著者らは先に望む形の上界を証明しており、本論文では対応する下界を証明して証明を完成させた（抄録）。", "p5": "展開は幅広い種類の相互作用ポテンシャルについて成り立ち、ポテンシャルの詳細にはよらず散乱長だけを通じて決まるという意味で普遍的である（抄録）。", "fun": "まばらに飛び回る粒子の集まりが、いちばん低いエネルギーの状態でどれだけのエネルギーを持つか。物理学者は七十年近く前に答えの式を予想し、実験や計算に使ってきた。しかしそれが数学的に厳密に正しいとは証明されていなかった。この論文は、上からと下からの両側ではさみ込むことで、その式が正しいことを確かめた。", "unverified": "本文未読のため、証明の手法と、必要な仮定の正確な範囲は未確認。"}}, {"id": "jn49", "rank": 49, "field": "電子工学", "headline": "単結晶の高誘電率絶縁膜で低電力の2次元CFET", "title": "Low-power 2D CFETs using single-crystal high-κ dielectrics", "url": "https://doi.org/10.1038/s41586-026-11272-2", "authors": "Ni Yang ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Yang, N., Zhang, J., Lu, Y.-C., Wang, Z., Chang, Y.-M., Zheng, F., Yang, Z.-L., Li, L., Chou, A.-S., Yang, Z., Liu, H., Huang, L.-Y., Li, C., Yao, C., Yang, P., Li, W., Meng, W., Li, M.-Y., Cheng, C.-C., et al. (2026). Low-power 2D CFETs using single-crystal high-κ dielectrics. Nature. https://doi.org/10.1038/s41586-026-11272-2", "why": "シリコンの微細化では消費電力の低減が難しくなっており、2次元半導体は原子層の薄さでゲート制御に優れるが、チャネルとゲート絶縁膜の界面の不完全さが障害だった。題名と抄録の冒頭から、単結晶の高誘電率（high-κ）絶縁膜を使った相補型の積層トランジスタ（CFET）で低電力動作を示す研究（Nature）。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "二次元半導体とゲート絶縁膜の界面の不完全さという障害を、ウエハー規模で転写できる単結晶のアナターゼ型酸化チタンの絶縁膜で克服し、低消費電力の相補型トランジスタを実証した（抄録）。", "p3": "単結晶の酸化チタンの絶縁膜を、二次元の遷移金属ダイカルコゲナイドとファンデルワールス力で積層し、きれいな界面を作る（抄録）。", "p5": "熱的な限界に近いサブスレッショルド・スイング、記録的に小さいヒステリシス、n型とp型でよくそろった特性が得られた。これを使った相補型トランジスタのインバータは、高い電圧利得と大きな雑音余裕を、ピコワット未満の静的な消費電力で実現した（抄録）。数値は抄録に記載なし。", "fun": "半導体の部品は小さくするほど電気がもれやすくなり、電力の節約が難しくなっている。原子数個分の厚さしかない新しい半導体は有望だが、その上に重ねる絶縁膜との境目が荒れると性能が出ない。この研究は、結晶がきれいにそろった絶縁膜を別に作ってそっと載せるという方法で、境目の問題を解いた。貼り合わせの丁寧さが性能を決める。", "unverified": "抄録の末尾が切れており、具体的な数値（スイング、利得、消費電力）と素子の寸法は未確認。"}}], "data_related": [{"rank": 1, "headline": "インドネシア上場324社の財務困窮パネルと同定コード", "title": "Replication data and code for \"Financial distress dynamics in emerging markets by using a sparse system identification approach\"", "url": "https://doi.org/10.5281/zenodo.24128239", "authors": "Ihsan ほか", "venue": "Zenodo", "date": "2026-11-11", "apa": "Ihsan, A. F., & Titik Kristanti, F. (2026). Replication data and code for \"Financial distress dynamics in emerging markets by using a sparse system identification approach\" (Version 1.0.0) [Dataset]. Zenodo. https://doi.org/10.5281/ZENODO.24128239", "summary": "インドネシアの非金融上場企業324社を2013〜2023年に観測した修正済みパネルと、財務困窮の動態をスパースなシステム同定 <script id="page-meta" type="application/json">{"kind": "latest"}</script>
<script>
(function () {
  "use strict";
  var REPORT = JSON.parse(document.getElementById("report-data").textContent);
  var ARCHIVE = JSON.parse(document.getElementById("archive-data").textContent);
  var META = JSON.parse(document.getElementById("page-meta").textContent);
  if (REPORT.part1 && !REPORT.related) REPORT.related = REPORT.part1;  // reports made before the merge
  if (REPORT.part2 && !REPORT.notable) REPORT.notable = REPORT.part2;
  // two sources (preprints, journals), each with papers related to the owner's research and important papers;
  // the last two groups are the layout of the reports of 2026-09-26
  var GROUPS = [
    { key: "pre", label: "プレプリント", parts: [["pre_related", "関連", "プレプリント：研究に関連する論文"], ["pre_notable", "注目", "プレプリント：注目分野の最先端"]] },
    { key: "jnl", label: "論文誌", parts: [["jnl_related", "関連", "論文誌：研究に関連する論文"], ["jnl_notable", "注目", "論文誌：注目分野の最先端"]] },
    { key: "data", label: "データ", parts: [["data_related", "関連", "オープンデータ：研究に関連する新着データセット"]] },
    { key: "latest", label: "最新", parts: [["related", "関連", "最新：研究に関連する論文"], ["notable", "重要", "最新：分野を問わない重要論文"]] },
    { key: "topj", label: "Top誌", parts: [["top", "関連", "Top誌（SJR上位10%）：研究に関連する論文"], ["top_notable", "重要", "Top誌（SJR上位10%）：分野を問わない重要論文"]] }
  ];
  var LABELS = [["p1", "(1) 一言で"], ["p2", "(2) 問い"], ["p3", "(3) 手法"], ["p4", "(4) 検証"], ["p5", "(5) 結果"], ["p6", "(6) 限界"]];
  var BASIS_PILL = { "本文": "本文を読んだ解説", "抄録": "抄録の範囲の解説", "題名": "題名だけの情報" };
  // a theme comes with its colour number (theme_no 1-8 -> --t1 ... --t8); the page holds no theme names of its own
  function themeColor(it) { return it.theme_no ? "--t" + it.theme_no : "--accent-soft"; }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var groups = GROUPS.map(function (g) {
    return { key: g.key, label: g.label, parts: g.parts.filter(function (p) { return (REPORT[p[0]] || []).length > 0; }) };
  }).filter(function (g) { return g.parts.length > 0; });
  var parts = [].concat.apply([], groups.map(function (g) { return g.parts; }));
  var views = parts.map(function (p) { return p[0]; }).concat(["marks", "list"]);
  function groupOf(view) {
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].parts.length; j++) { if (groups[i].parts[j][0] === view) return groups[i]; }
    }
    return null;
  }
  var lastInGroup = store.get("pd-sub-v1", {});
  var marks = store.get("pd-marks-v1", {});
  var saved = store.get("pd-pos-" + REPORT.date, { view: views[0], index: 0 });
  var start = { part1: "related", part2: "notable" }[saved.view] || saved.view;
  var state = { view: views.indexOf(start) >= 0 ? start : views[0], index: saved.index || 0 };
  var stage = document.getElementById("stage");
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  // date selector
  document.getElementById("daylabel").textContent = " " + REPORT.date;
  var sel = document.getElementById("datesel");
  function fillDates(list) {
    ARCHIVE = list;
    while (sel.firstChild) sel.removeChild(sel.firstChild);
    list.forEach(function (d, i) {
      var o = el("option", null, d + (i === 0 ? "（最新）" : ""));
      o.value = d; if (d === REPORT.date) o.selected = true; sel.appendChild(o);
    });
  }
  fillDates(ARCHIVE);
  // the current date list (older pages are not rebuilt every day); the list embedded in the page is the fallback
  try {
    fetch((META.kind === "archive" ? "../" : "") + "dates.json", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (list) { if (Array.isArray(list) && list.length) fillDates(list); })
      .catch(function () {});
  } catch (e) {}
  sel.addEventListener("change", function () {
    var d = sel.value, latest = ARCHIVE[0];
    var href = META.kind === "archive" ? (d === latest ? "../index.html" : d + ".html") : (d === latest ? "index.html" : "archive/" + d + ".html");
    location.href = href;
  });

  // tabs: 最新 / Top誌 / ★ / 一覧, and under a source the 関連 / 注目 sub-tabs
  var tabs = document.getElementById("tabs"), subtabs = document.getElementById("subtabs");
  function select(view) {
    stopSpeech(false);
    state.view = view; if (view !== "list") { state.index = 0; }
    var g = groupOf(view);
    if (g) { lastInGroup[g.key] = view; store.set("pd-sub-v1", lastInGroup); }
    render(); window.scrollTo(0, 0);
  }
  function addTab(key, text, label, onClick) {
    var b = el("button", "tab", text); b.type = "button"; b.dataset.view = key;
    if (label) { b.setAttribute("aria-label", label); b.title = label; }
    b.addEventListener("click", onClick);
    tabs.appendChild(b);
  }
  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);
    addTab("group:" + g.key, g.label + " " + n, null, function () {
      var v = lastInGroup[g.key];
      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
