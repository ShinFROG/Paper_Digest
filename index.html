未確認。"}}, {"id": "jn21", "rank": 21, "field": "社会学", "headline": "自営業への転身はメンタルヘルスを改善するか", "title": "Does the transition to self-employment benefit mental health? Evidence from the UK", "url": "https://doi.org/10.1177/09500170261475931", "authors": "Liming Li ほか", "venue": "Work, Employment and Society", "date": "2026-11-05", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "apa": "Li, L., Glaser, K., & Geiger, B. (2026). Does the transition to self-employment benefit mental health? Evidence from the UK. Work, Employment and Society. https://doi.org/10.1177/09500170261475931", "why": "英国のパネルデータの差の差分析で、雇用から自営業への移行が精神的健康に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "Work, Employment and Societyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "英国で雇用から自営業へ移ると心理的苦痛がわずかだが有意に減ることを、マッチングを組み合わせた差の差分析で示した（抄録）。", "p3": "英国家計縦断調査（2009〜2021年）のデータで、自営業へ移行した人と移行しなかった人を、差の差のデザインとマッチングで比べた（抄録）。", "p5": "自営業への移行は心理的苦痛の小さいが有意な減少と結びつき、当初の精神的健康が悪い人ほど効果が大きかった。移行に伴って社会経済的地位は下がったが、仕事の自律性、仕事の満足度、余暇の満足度は改善した（抄録）。", "fun": "会社員をやめて独立すると、収入や地位は不安定になりがちです。それでも英国のデータでは、独立した人の心の健康は少し良くなっていました。独立に伴って仕事の自律性や満足度が高まったことも示されています。もともと心の調子が悪かった人ほど改善が大きい、という点も面白いところです。", "unverified": "苦痛の減少幅の数値は抄録では未確認。"}}, {"id": "jn22", "rank": 22, "field": "社会学", "headline": "労働の社会的組織が仕事への愛着を条件づける", "title": "From a distance: How the social organisation of labour conditions personal attachment to work", "url": "https://doi.org/10.1177/09500170261469828", "authors": "Anne Gravelle Antoni ほか", "venue": "Work, Employment and Society", "date": "2026-11-05", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "apa": "Gravelle Antoni, A., Asshidi, H., Rose, J., & Louisgrand, N. (2026). From a distance: How the social organisation of labour conditions personal attachment to work. Work, Employment and Society. https://doi.org/10.1177/09500170261469828", "why": "仕事への個人的な愛着が、労働の社会的な組織のされ方によってどう形づくられるかを分析した。", "explain": {"basis": "抄録", "basis_note": "Work, Employment and Societyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "コロナ禍で仕事と生活の区切りが崩れた状況を手がかりに、ホワイトカラーの従業員が雇用としての労働と主観的な営みとしての仕事への関わりをどう区別するかを示した（抄録）。", "p3": "フランスの民間の高等教育機関の従業員50人に半構造化面接を行った（抄録）。", "p5": "人々は雇用としての労働への投資は問い直したが、主観的な営みとしての仕事への投資は問い直さなかった。労働の社会的な組織の物質的・社会的な文脈が、仕事への個人的な愛着を条件づけていた（抄録）。", "fun": "コロナ禍で在宅勤務になり、仕事と生活の境目が急に崩れたとき、人は「この組織のために頑張ること」と「自分の仕事そのものへの思い入れ」を分けて考え直したようです。組織への献身は見直しても、仕事への愛着は手放さない。働く意味をどこに置くかが見える点が面白いところです。", "unverified": "質的研究で、分析手法の詳細は抄録では未確認。"}}, {"id": "jn23", "rank": 23, "field": "社会学", "headline": "高級住宅街の社会的インフラの衰退と活力", "title": "The simultaneous slow death and persistent vitality of social infrastructure in elite neighbourhoods", "url": "https://doi.org/10.1177/00420980261499481", "authors": "Sharda Rozena ほか", "venue": "Urban Studies", "date": "2026-11-05", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Rozena, S., & Atkinson, R. (2026). The simultaneous slow death and persistent vitality of social infrastructure in elite neighbourhoods. Urban Studies. https://doi.org/10.1177/00420980261499481", "why": "ロンドンの高級住宅街ケンジントンで、高級な施設と日常の社会的インフラが共存する街路の社会生活の活力を、長期にわたって調べた。", "explain": {"basis": "抄録", "basis_note": "Urban Studiesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ロンドンの高級住宅街ケンジントンでも、格安ホテル、家賃規制の住宅、カフェ・公園・ベンチといった日常の社会的インフラが高級な施設と共存し、街路の社会生活は複雑で多様であり続けていることを示した（抄録）。", "p3": "さまざまなデータ源を使い、高級な施設や住宅と、日常の働く街を形づくる多様な社会的インフラが、時間と空間の中でどう重なり合っているかを調べた（抄録）。", "p5": "裕福な人々の地域の社会生活への関わりは限られ部分的で、移動性が高かった。一方で街路には、幅広い住民と利用者の多様な社会史・文化・経験があった（抄録）。", "fun": "高級住宅街というと、お金持ちだけの閉じた街を想像しがちです。でもロンドンの一等地でも、格安のホテルや家賃の抑えられた住宅、ベンチや公園といった誰でも使える場所がしぶとく残り、いろいろな人の暮らしが重なっていました。街のにぎわいを支える目立たない仕組みに光を当てた点が面白いところです。", "unverified": "使ったデータ源の種類と観察の期間は抄録では未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "ハイブリッドワークが変える公式の組織構造", "title": "The new meaning of office: how hybrid work changes formal organizational structure from a place perspective", "url": "https://doi.org/10.1007/s11846-026-01074-1", "authors": "Christina Fuchs ほか", "venue": "Review of Managerial Science", "date": "2026-11-05", "sjr": 2.587, "citescore": 21.2, "citescore_year": "2025", "apa": "Fuchs, C., & Reichel, A. (2026). The new meaning of office: how hybrid work changes formal organizational structure from a place perspective. Review of Managerial Science. https://doi.org/10.1007/s11846-026-01074-1", "why": "場所の視点から、ハイブリッドワークが公式の組織構造をどう変えるかを理論化した。", "explain": {"basis": "抄録", "basis_note": "Review of Managerial Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ハイブリッドワークが組織の公式構造を変えることを「場所」の視点から示し、人事の職位が機能別にまとめられ集権化される傾向を見いだした（抄録）。", "p3": "2つの国際的な組織の従業員の面接49件を、2つの時点で分析した（抄録）。", "p5": "それまで分散していた人事の職位の機能別のまとまりと集権化が現れ、その後に空間的な移転が続く可能性があった。仮想・物理の空間での場所の作り直しが職場を仮想的なものとして再定義し、構造を見直す機会を生む一方、社会的なつながりの欲求は満たされなかった（抄録）。", "fun": "在宅と出社を組み合わせる働き方が広がると、変わるのは働く場所だけではありません。この研究では、誰がどの部署に属し誰に報告するかという組織の形まで、計画しないうちに変わり始めていました。オフィスが仮想の場所になることで組織図を描き直す機会が生まれる、という見方が面白いところです。", "unverified": "質的研究で、組織の業種と国は抄録では未確認。"}}, {"id": "jn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "昇進と賃金の決定を性別に帰属する従業員", "title": "The Role of Gender Attributions in Shaping Employee Attitudes and Behaviors: A Perspective From Attribution Theory", "url": "https://doi.org/10.1002/hrdq.70035", "authors": "Francesco Candia ほか", "venue": "Human Resource Development Quarterly", "date": "2026-11-05", "sjr": 1.52, "citescore": 11.6, "citescore_year": "2025", "apa": "Candia, F., Boccoli, G., Gastaldi, L., & Corso, M. (2026). The Role of Gender Attributions in Shaping Employee Attitudes and Behaviors: A Perspective From Attribution Theory. Human Resource Development Quarterly. https://doi.org/10.1002/hrdq.70035", "why": "昇進と賃金の決定を能力と性別のどちらで説明するかが、従業員の態度と行動にどう関わるかを帰属理論で調べた。", "explain": {"basis": "抄録", "basis_note": "Human Resource Development Quarterlyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "昇進と賃金の決定を能力と性別のどちらで説明するかという帰属の組み合わせから従業員を4つのプロファイルに分け、所属を決めるのは役職や賃金の客観的な指標より年齢・勤続・性別であることを示した（抄録）。", "p3": "イタリアの大手銀行の従業員1,651人の調査データと組織データに潜在プロファイル分析を当てはめ、プロファイルと分配的公正、ワーク・エンゲイジメント、情緒的コミットメント、知覚された組織的支援の関係を調べた（抄録）。", "p5": "能力と性別への帰属の組み合わせが異なる4つのプロファイルが見つかり、プロファイルへの所属は、役職・賃金の客観的な指標（職位別の男女の賃金差を含む）より、年齢・勤続年数・性別などの属性でよく予測された（抄録）。", "fun": "昇進や給料の決定を見て「能力で決まった」と思う人もいれば、「性別が影響した」と感じる人もいます。この研究は、そうした受け止め方の組み合わせで従業員を4つのタイプに分けました。どのタイプになるかは、実際の給料や男女の賃金差よりも、年齢や勤続年数、本人の性別で決まりやすかった点が面白いところです。", "unverified": "各プロファイルと態度との関係の結果は、抄録が途中で切れているため未確認。"}}, {"id": "jn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "地方テレビ局の燃え尽きと上司・組織の支援", "title": "“Burnout with shrapnel.” The influence of perceived supervisor and organizational support on worker burnout and retention in U.S. local television newsrooms", "url": "https://doi.org/10.1177/14648849261505015", "authors": "Carey L Higgins-Dobney", "venue": "Journalism", "date": "2026-11-04", "sjr": 2.087, "citescore": 8.3, "citescore_year": "2025", "apa": "Higgins-Dobney, C. L. (2026). “Burnout with shrapnel.” The influence of perceived supervisor and organizational support on worker burnout and retention in U.S. local television newsrooms. Journalism. https://doi.org/10.1177/14648849261505015", "why": "米国の地方テレビ局で、上司と組織からの支援の認知が燃え尽きと定着に与える影響を組織支援理論で調べた。", "explain": {"basis": "抄録", "basis_note": "Journalismの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米国の地方テレビ局の報道現場で、上司と組織からの支援の認知（PSSとPOS）が低いことが燃え尽きと離職につながっている実態を、面接で明らかにした（抄録）。", "p3": "組織支援理論の枠組みで、地方テレビ局の報道職員21人に面接し、ストレス、メンタルヘルス、燃え尽き、業界での将来の計画を尋ねた（抄録）。", "p5": "多くの職員は上司と組織の支援をともに低いと感じ、仕事に必要なものと組織が提供できる（しようとする）ものの間に大きな差があった。支援の認知が高い職員は、指導やメンタルヘルスの支えが強く、職場の離職も少ないと語った（抄録）。", "fun": "毎日の締め切りに追われるテレビの報道現場では、燃え尽きて辞める人が後を絶たないそうです。インタビューから見えたのは、上司や会社が自分を支えてくれると感じられるかどうかで、同じ激務でも続けられるかが変わることでした。題名の「破片を伴う燃え尽き」という言葉が、現場の厳しさを物語っています。", "unverified": "面接による質的研究で、燃え尽きの量的な測定は行っていない（抄録）。"}}, {"id": "jn27", "rank": 27, "field": "気候科学", "headline": "氷期の海洋循環の変化は氷床記録より遅かった", "title": "Glacial abrupt transitions in ocean circulation were much slower than ice-core records imply", "url": "https://doi.org/10.1126/science.aed4270", "authors": "Xiyu Dong ほか", "venue": "Science", "date": "2026-11-05", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Dong, X., Zhang, X., Sun, Y., Kathayat, G., Li, Y., Rasmussen, S. O., Svensson, A., Buizert, C., Sinha, A., Barker, S., Pérez-Mejías, C., Knorr, G., Chen, R., Zhao, K., Du, W., Zhang, H., Li, H., Columbu, A., Tan, L., et al. (2026). Glacial abrupt transitions in ocean circulation were much slower than ice-core records imply. Science, 394(6824), 654–659. https://doi.org/10.1126/science.aed4270", "why": "アジアモンスーン域の鍾乳石の酸素同位体記録から、氷期の急激な温暖化が1世紀以上かけて進み、大西洋子午面循環の回復は氷床記録が示すより遅かったことを示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "氷期のダンスガード・オシュガー（DO）事象の温暖化は、グリーンランドの氷床コアが示す数十年ではなく、アジアモンスーン域の鍾乳石の記録では1世紀以上かけて進んでいたことを示した（抄録）。", "p3": "精密に年代を決めたアジアモンスーン域の鍾乳石の酸素同位体記録を使い、同位体のモデル計算でグリーンランドの記録が何を捉えているかを調べた（抄録）。", "p5": "グリーンランドの記録は北東大西洋の初期の海氷後退による大気の急速な再編を主に捉えており、並行する大西洋子午面循環（AMOC）の回復と半球規模の熱的な調整ははるかにゆっくり進んでいた（抄録）。", "fun": "氷期には、わずか10年ほどで急に暖かくなる出来事が何度もあったと、グリーンランドの氷の記録は語ってきました。ところが、アジアの洞窟の鍾乳石の記録では、同じ温暖化に1世紀以上かかっていました。速く変わったのは大気で、海の大きな流れはゆっくり変わっていた、と見分けた点が面白いところです。", "unverified": "鍾乳石の記録の地点数と年代の精度は抄録では未確認。"}}, {"id": "jn28", "rank": 28, "field": "天文学", "headline": "物理モデルで恒星光を差し引き系外惑星を撮像", "title": "Imaging exoplanets below the telescope stability limit", "url": "https://doi.org/10.1038/s41586-026-11213-z", "authors": "Rodrigo Ferrer-Chavez ほか", "venue": "Nature", "date": "2026-11-04", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Ferrer-Chavez, R., Wang, J. J., Bouman, K. L., Freeman, W. T., Pueyo, L., Feng, B. Y., & Perrin, M. D. (2026). Imaging exoplanets below the telescope stability limit. Nature, 659(8139), 58–62. https://doi.org/10.1038/s41586-026-11213-z", "why": "参照画像に頼る恒星光の除去が望遠鏡の不安定さに制約される問題に対し、物理モデルと多段階の最適化による新しい差し引き法を示した。", "explain": {"basis": "抄録", "basis_note": "Natureの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "望遠鏡の不安定さを物理モデルで扱いながら恒星の光を差し引く新しい方法を示し、JWSTのコロナグラフ観測で標準的な手法より2〜15倍高い感度を得た（抄録）。", "p3": "多段階の最適化と柔軟な物理モデルを組み合わせて恒星光のモデルを作り、装置の不安定さをモデル化して補償した。自動微分で数百万のモデル・パラメータを最適化し、JWSTの近赤外カメラ（NIRCam）のコロナグラフ観測に適用した（抄録）。", "p5": "感度は標準的な手法の2〜15倍で、波長4.3 μmでのエリダヌス座51番星bの初検出を含む（抄録）。", "fun": "遠くの惑星を写真に撮るのは、灯台の強い光のすぐ横にいる蛍を写すようなものです。これまでは別に撮った星の写真を手本に光を消していましたが、望遠鏡がわずかに揺らぐと手本がずれてしまいました。望遠鏡の揺らぎそのものを物理の式で計算に組み込み、見えなかった惑星の光を取り出した点が面白いところです。", "unverified": "検出できた天体の数と、手法の計算コストは抄録では未確認。"}}, {"id": "jn29", "rank": 29, "field": "数学", "headline": "ゴパクマー・ヴァッファの有限性予想を証明", "title": "The Gopakumar--Vafa finiteness conjecture", "url": "https://doi.org/10.4007/annals.2026.204.3.1", "authors": "Aleksander Doan ほか", "venue": "Annals of Mathematics", "date": "2026-11-05", "sjr": 9.137, "citescore": 9.8, "citescore_year": "2025", "apa": "Doan, A., Ionel, E.-N., & Walpuski, T. (2026). The Gopakumar--Vafa finiteness conjecture. Annals of Mathematics, 204(3), 819–871. https://doi.org/10.4007/annals.2026.204.3.1", "why": "BPS不変量が各ホモロジー類で有限個を除き0になるという有限性の部分を、Ionel–Parkerのクラスター形式を幾何学的測度論で修正して証明した（整数性の部分は既に証明済み）。", "explain": {"basis": "抄録", "basis_note": "Annals of Mathematicsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "シンプレクティック6次元多様体のBPS不変量が各ホモロジー類で有限個を除いて0になるという、ゴパクマー・ヴァッファ予想の有限性の部分を証明した（抄録）。", "p3": "Gromov–Witten不変量から定義されるBPS不変量について、IonelとParkerのクラスター形式を幾何学的測度論の結果を使って修正し、証明に用いた（抄録）。", "p5": "予想のうち整数性の部分はIonelとParkerが先に証明しており、本論文は残っていた有限性の部分を示した（抄録）。", "fun": "ある6次元の図形の上の曲線の数え上げに関わる不変量が、必ず整数になり、しかも各クラスで有限個を除いてゼロになる、と主張する予想があります。整数になる部分は以前に証明されていて、この論文は残りの部分を証明しました。複数の研究者のリレーで一つの予想が片づいていく過程が面白いところです。", "unverified": "証明の構成の詳細は抄録では未確認。"}}, {"id": "jn30", "rank": 30, "field": "組織行動・心理的安全性", "headline": "応募書類の記述を辞書で採点する人材選抜", "title": "Natural language processing word dictionaries for personnel selection: Achieving explainable, generalizable, and incremental prediction with low impact when passively scoring narrative application information.", "url": "https://doi.org/10.1037/apl0001438", "authors": "Emily D. Camp , "url": "https://doi.org/10.1016/j.jfineco.2026.104398", "authors": "Kim Fe Cramer ほか", "venue": "Journal of Financial Economics", "date": "2026-11-05", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "apa": "Cramer, K. F., Ghosh, P., Kulkarni, N., & Vats, N. (2026). Shadow banks on the rise: Evidence across market segments. Journal of Financial Economics, 186, 104398. https://doi.org/10.1016/j.jfineco.2026.104398", "why": "インドの小口融資の信用情報と天候ショックを使い、フィンテックは無担保の市場で、その他のシャドーバンクは担保付きの市場でより強く反応し、強みがそれぞれ技術と規制の軽さにあることを示した。", "explain": {"basis": "抄録", "basis_note": "JFE掲載版の抄録は取得できず、同じ論文のSSRN版の抄録（Crossrefの題名検索で取得）を使用", "preprint": false, "short": true, "p1": "インドの小口融資のデータで、フィンテックは無担保の市場で、それ以外のシャドーバンクは担保付きの市場で信用需要の変化に強く反応し、強みが市場によって異なることを示した（抄録）。", "p3": "インドの小口融資の信用情報データに、信用需要の代理として天候ショックを組み合わせた。デジタル決済の普及の地域差でフィンテックの技術的な強みを識別し、4つの自然実験で非フィンテックのシャドーバンクにとっての規制の軽さの重要性を示した（抄録）。", "p5": "フィンテックの強みは技術に、非フィンテックのシャドーバンクの強みは規制の軽さにあり、シャドーバンクの比較優位は市場セグメントによって異なった（抄録）。", "fun": "銀行以外の貸し手（シャドーバンク）と一口に言っても、スマホで審査するフィンテック企業と、昔ながらのノンバンクでは得意分野が違うようです。天候の変化でお金の需要が増えたとき、担保なしの融資ではフィンテックが、担保つきの融資ではノンバンクがよく応じました。それぞれの強みの源を自然実験で見分けた点が面白いところです。", "unverified": "反応の大きさの数値と4つの自然実験の中身は抄録では未確認。抄録はSSRN版のもので、掲載版との違いは未確認。"}}, {"id": "jn35", "rank": 35, "field": "経済学", "headline": "担保制約の緩和と金融政策の波及", "title": "Financial constraints and the transmission of monetary policy: Evidence from relaxation of collateral constraints", "url": "https://doi.org/10.1016/j.jfineco.2026.104405", "authors": "Nishant Vats", "venue": "Journal of Financial Economics", "date": "2026-11-05", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "apa": "Vats, N. (2026). Financial constraints and the transmission of monetary policy: Evidence from relaxation of collateral constraints. Journal of Financial Economics, 186, 104405. https://doi.org/10.1016/j.jfineco.2026.104405", "why": "担保制約の緩和を使い、金融制約が金融政策の波及に与える影響を調べた研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Journal of Financial Economicsの記録は題名のみで、抄録・本文は nomicsの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "コロナ禍のスウェーデンで、遠隔授業は十代の子を持つ親の就業に影響せず、働く親への「二重の負担」の証拠は見られなかったことを示した（抄録）。", "p3": "封じ込め策が最小限で、社会的な安全網が強く、デジタル教育の基盤が整ったスウェーデンで、遠隔授業が親の労働市場の成果に与えた影響を推定した（抄録）。", "p5": "十代の子を持つ親で就業状態への影響の証拠はなく、子の年齢によって異なる短期的な収入の増加が一部で見られた。母親と父親の系統的な差や、職業の在宅勤務のしやすさによる違いもなかった（抄録）。", "fun": "学校がオンライン授業になると、家で子どもを見ながら働く親は大変だったはずです。ところがスウェーデンでは、十代の子を持つ親の仕事にはほとんど影響が見られませんでした。社会の支えの仕組みやデジタル教育の備えが整っていた国だった、という背景とあわせて考えると面白いところです。", "unverified": "推定の方法（比較の設計）と収入の増加の大きさは抄録では未確認。"}}, {"id": "jn38", "rank": 38, "field": "経営学", "headline": "技術を強制する規制と自動車の発明の地理", "title": "When the music changes, so must your dance: Technology-forcing regulation and the shifting geography of automotive invention", "url": "https://doi.org/10.1016/j.respol.2026.105655", "authors": "Seyyed Milad Shirvani ほか", "venue": "Research Policy", "date": "2026-11-05", "citescore": 17.6, "citescore_year": "2025", "why": "技術を強制する規制が自動車関連の発明の地理的な分布をどう変えたかを扱った研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "Research Policyの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、技術の導入を強制する規制が、自動車関連の発明の地理的な分布をどう変えたかを扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「この技術を使え」と求める規制ができると、どこで新しい発明が生まれるかが変わるかもしれません。「音楽が変われば踊りも変えよ」という題名どおり、規制の変化に企業や地域がどう対応したのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、対象の規制とデータは未確認。"}}, {"id": "jn39", "rank": 39, "field": "経営学", "headline": "SaaSのクラウドは中小企業の成長により効く", "title": "Scaling up to the cloud: Cloud technology use and growth rates in small and large firms", "url": "https://doi.org/10.1016/j.respol.2026.105644", "authors": "Bernardo Caldarola ほか", "venue": "Research Policy", "date": "2026-11-05", "citescore": 17.6, "citescore_year": "2025", "why": "フランスの企業のミクロデータで、クラウドの利用は企業の成長と正に関連し、その関連はSaaSを通じて中小企業でより強いことを示した。", "explain": {"basis": "抄録", "basis_note": "Research Policyの抄録（Semantic Scholarで取得）を使用", "preprint": false, "short": true, "p1": "フランスの企業のミクロデータで、クラウドの利用は企業の成長と正に関連し、その関連は中小企業でより強く、その差はSaaSによって生じていることを示した（抄録）。", "p3": "複数のミクロデータを独自に組み合わせ、クラウドをIaaSとSaaSに分けて企業の成長率との関係を調べ、操作変数法などで頑健性を確かめた（抄録）。", "p5": "中小企業の優位はICT能力を持つ企業でのみ現れた。SaaSの利用は、とくに中小企業で、手作業・事務職からICT・管理・中間職への社内の職の再編と結びついていた。部門別にはクラウドと市場集中の負の相関があった（抄録）。", "fun": "デジタル技術は大企業ほど得をする、というのがこれまでの通説でした。ところがクラウド、特に月額で使えるソフト（SaaS）は、小さな会社の成長により強く結びついていました。ただし、もともとITに強い人材がいる会社に限られます。道具を借りられるようになっても使いこなす力が要る、という点が面白いところです。", "unverified": "成長率の差の大きさと操作変数の内容は抄録では未確認。"}}, {"id": "jn40", "rank": 40, "field": "統計学", "headline": "対話的に使える共形選択の枠組みACS", "title": "ACS: An interactive framework for conformal selection", "url": "https://doi.org/10.1080/01621459.2026.2757634", "authors": "Yu Gui ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-04", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "共形選択を拡張し、データを探索しながら逐次に判断しても偽発見率を厳密に制御できる対話的な選択の枠組みACSを示した。", "explain": {"basis": "抄録", "basis_note": "JASAの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "共形選択を拡張し、分析者がデータを探索しながら逐次に判断しても偽発見率（FDR）を厳密に制御できる、対話的なモデルフリーの選択の枠組みACSを示した（抄録）。", "p3": "意思決定に使える情報を制御する原理を設計し、データの一部を再利用して選択の検出力を高め、新しい情報や好みを途中で取り込めるようにした。モデルの更新・選択、多様化した選択、新しいラベル付きデータの取り込みの具体的なアルゴリズムを示した（抄録）。", "p5": "大規模な数値シミュレーションと、LLMの運用と創薬の実データへの応用で有効性を示した（抄録）。", "fun": "たくさんの候補から「当たり」を選ぶとき、データを見ながら途中で方針を変えたくなるものです。でも見ながら選ぶと、たまたまの当たりを本物と思い込む誤りが増えがちです。途中で方針を変えても、誤った発見の割合を約束どおりに抑えられる仕組みを作った点が面白いところです。", "unverified": "シミュレーションでの検出力の改善幅は抄録では未確認。"}}, {"id": "jn41", "rank": 41, "field": "統計学", "headline": "交差ランダム効果モデルを多方向の離散化で推定", "title": "Scalable Estimation of Crossed Random Effects Models via Multi-way Discretization", "url": "https://doi.org/10.1080/01621459.2026.2754930", "authors": "Shota Takeishi ほか", "venue": "Journal of the American Statistical Association", "date": "2026-11-04", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "交差ランダム効果の分布を離散分布で近似して多方向の離散構造として表し、非ガウスの結果変数でも高速に推定できる方法と、その一致性・漸近正規性を示した。", "explain": {"basis": "抄録", "basis_note": "JASAの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "交差ランダム効果の分布を有限個の代表値からなる離散分布で近似し、非ガウスの結果変数でも交差分類データのモデルを高速に推定できる方法を示した（抄録）。", "p3": "近似によってモデルを多方向の離散構造として表し、単純で速い反復アルゴリズムで推定する。2方向を超える交差分類にも使え、一般的な分類水準のもとで推定量の一致性と漸近正規性を示した（抄録）。", "p5": "シミュレーションと実データへの応用で、交差分類の構造を持つロジスティック・ポアソン・順序プロビット回帰での実用的な性能を示した（抄録）。", "fun": "人は学校と地域、病院と担当医のように、いくつもの集団に同時に属しています。こうした「二重の所属」を持つデータは、普通のモデルでは計算が重くなりがちです。この研究は、一人ひとりの違いを少数の代表的な値に丸めて計算を軽くし、それでも理論的に正しい答えに近づくことを示しました。", "unverified": "計算時間の比較の数値は抄録では未確認。"}}, {"id": "jn42", "rank": 42, "field": "機械学習", "headline": "マルチモーダル領域汎化を統一的に扱う枠組み", "title": "Invariance, Stability, and Diversity: A Unified Framework for Multimodal Domain Generalization", "url": "https://doi.org/10.1109/tpami.2026.3750284", "authors": "Hongzhao Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-04", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "マルチモーダルの領域汎化を不変性・安定性・多様性の観点で統一的に扱う枠組みの研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "IEEE TPAMIの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、マルチモーダルの領域汎化を、不変性・安定性・多様性の3つの観点で統一的に扱う枠組みを提案した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "画像と音など複数の種類のデータで学んだAIを、学習時と違う環境でも使えるようにするには何が必要か。変わらない特徴をつかむこと、揺らぎに強いこと、多様さを保つことの三つを一つの枠組みで両立できるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、手法と結果は未確認。"}}, {"id": "jn43", "rank": 43, "field": "機械学習", "headline": "Q学習の過大推定バイアスの伝播を断つ", "title": "Revisiting Overestimation Bias of Q-learning: Breaking Bias Propagation Chains Does Well", "url": "https://doi.org/10.1109/tpami.2026.3750927", "authors": "Hong Xie ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-05", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "Q学習の過大推定バイアスが伝播する連鎖を断つことで性能を改善する研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "IEEE TPAMIの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、Q学習の過大推定バイアスを見直し、バイアスが伝播する連鎖を断ち切ることで性能が改善することを示した研究     "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
