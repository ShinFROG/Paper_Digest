しかなくても、音が伝わるうちに変わる「音色の変化」から位置を読み取ろうとした。耳一つで音の出どころを当てるような難しさに挑んでいる点が面白い。", "unverified": "位置の特定精度の具体的な値と、複数センサの方法との比較は未確認（抄録が途中まで）。"}}, {"id": "jr22", "rank": 22, "headline": "物理に基づく時間周波数マップで回転部品の故障を診断", "title": "Adaptive optimization of large-margin learning for physics-informed time–frequency maps for the diagnosis of rotating components", "url": "https://doi.org/10.1177/14759217261495422", "authors": "Govind Vashishtha ほか", "venue": "Structural Health Monitoring", "date": "2026-11-02", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Vashishtha, G., & Chauhan, S. (2026). Adaptive optimization of large-margin learning for physics-informed time–frequency maps for the diagnosis of rotating components. Structural Health Monitoring. https://doi.org/10.1177/14759217261495422", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "回転機械の部品の故障を、物理にもとづく時間周波数マップから取り出した解釈しやすい特徴で診断する、ラージマージン学習の枠組みを提案した（抄録）。", "p3": "特徴モード分解と短時間フーリエ変換で時間周波数マップを作って特徴を取り出し、ラージマージン学習のモデルの五つの重要なハイパーパラメータを粘菌アルゴリズムで適応的に最適化する（抄録）。", "p5": "CWRUとIMSの軸受のデータセットで、診断の正解率はCWRUで88.75%、IMSで96.67%となり、同じ条件で実装した七つの最先端の分類手法を上回った（抄録）。", "fun": "機械の軸受が壊れかけると、振動の中に特有の「リズム」が混じる。この研究は、AIに丸投げするのではなく、振動を物理的に意味のある成分に分けてから学ばせることで、なぜその判断になったのかが分かる診断を目指した。粘菌のふるまいをまねた方法で設定を探す点も面白い。", "unverified": "ほかの軸受や実機での汎化の検証の有無は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "落石の運動解析と橋への衝撃応答の事例", "title": "Kinematic simulation of rockfall and dynamic response analysis of bridge structures: A case study of a rockfall-bridge impact event", "url": "https://doi.org/10.1016/j.trgeo.2026.102521", "authors": "Han Bao ほか", "venue": "Transportation Geotechnics", "date": "2026-11-01", "sjr": 1.447, "citescore": 9.3, "citescore_year": "2025", "apa": "Bao, H., Zhu, J., Zhang, J., Li, C., Dong, Q., Yang, J., & Liang, N. (2026). Kinematic simulation of rockfall and dynamic response analysis of bridge structures: A case study of a rockfall-bridge impact event. Transportation Geotechnics, 102521. https://doi.org/10.1016/j.trgeo.2026.102521", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "落石の運動のシミュレーションと、落石が橋に衝突したときの橋の動的応答の解析を、実際の衝突事例で行った研究と題名から読み取れる（Transportation Geotechnics）。背景：山間部の橋では、斜面からの落石の衝突が構造の安全性に関わる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "山の斜面から転がり落ちた岩が橋にぶつかると、橋はどう揺れ、どこが傷むのか。題名からは、実際に起きた衝突を手がかりに、岩の転がり方と橋の揺れの両方を再現しようとした研究だと分かる。自然災害と構造物の力学をつなぐ問いが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr24", "rank": 24, "headline": "業種をまたぐ倒産パターンで業種別の倒産予測を改善", "title": "Rethinking sector-specific bankruptcy prediction: Leveraging cross-sector failure patterns through distance-based company representations", "url": "https://doi.org/10.1016/j.ejor.2026.10.045", "authors": "Philippe du Jardin ほか", "venue": "European Journal of Operational Research", "date": "2026-11-02", "sjr": 2.373, "citescore": 14.0, "citescore_year": "2025", "apa": "du Jardin, P., & De Bock, K. W. (2026). Rethinking sector-specific bankruptcy prediction: Leveraging cross-sector failure patterns through distance-based company representations. European Journal of Operational Research. https://doi.org/10.1016/j.ejor.2026.10.045", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "業種ごとの倒産予測で、ほかの業種の倒産のパターンを、距離にもとづく企業の表現を通じて活用する研究と題名から読み取れる（European Journal of Operational Research）。背景：業種ごとの倒産の事例が少ないと、業種別の予測モデルは学習が難しくなる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "倒産する会社はどの業種でも少数なので、業種ごとにモデルを作ると例が足りなくなる。題名からは、会社どうしの「似ている度合い」を測って、別の業種の倒産の例からも学ぼうとする研究だと読み取れる。業種の壁を越えて経験を借りる発想が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr25", "rank": 25, "headline": "サステナビリティ報告が会計専門職の役割をどう変えるか", "title": "Emerging Sustainability Roles in the Accounting Profession: An Empirical Analysis of Identities, Responsibilities and Competencies", "url": "https://doi.org/10.1002/csr.71134", "authors": "Liliana Ionescu‐Feleagă ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-02", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Ionescu‐Feleagă, L., Rîndaşu, S.-M., Dragomir, V. D., Mateescu, O.-C., Ignat, I., Petcu, M. A., & Isip, A. (2026). Emerging Sustainability Roles in the Accounting Profession: An Empirical Analysis of Identities, Responsibilities and Competencies. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71134", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "サステナビリティ報告と保証の要求（EUのCSRD）によって、会計士の責任と必要な能力がどう変わっているかを、役割理論にもとづいて実証的に調べた（抄録）。", "p3": "2024年にEUの18か国で集めたサステナビリティ関連の会計職の求人広告139件を、帰納と演繹を組み合わせた内容分析とクラスタリングで分析した（抄録）。", "p5": "複雑な役割と幅広い能力が現れており、組織は会計士というなじみのある職業的アイデンティティを保ったまま、それに付随する責任と能力を変えることで、サステナビリティの仕事を取り込んでいた（抄録）。", "fun": "環境や人権への取り組みを報告する仕事が増えると、会計士は「数字の専門家」から何に変わるのか。この研究は、実際の求人広告を読み比べて、肩書きはそのままで中身が大きく変わりつつあることを示した。求人票から職業の変化を読み取る方法が面白い。", "unverified": "役割の類型の数とそれぞれの内容は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "ESGの改善は将来の不祥事を予告するか：取締役会の監視", "title": "Board monitoring and the informational content of ESG performance", "url": "https://doi.org/10.1108/sampj-02-2026-0339", "authors": "Aso Abdullah", "venue": "Sustainability Accounting, Management and Policy Journal", "date": "2026-11-02", "sjr": 1.808, "citescore": 15.7, "citescore_year": "2025", "apa": "Abdullah, A. (2026). Board monitoring and the informational content of ESG performance. Sustainability Accounting, Management and Policy Journal, 1–31. https://doi.org/10.1108/sampj-02-2026-0339", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ESGの改善がその後の不祥事、環境事故、投資の非効率、業績を予測するか、そして取締役会の監視がその関係を強めるかを、英国のFTSE 350企業で検証した（抄録）。", "p3": "2010〜2024年の314社・4,396社年の非均衡パネルで、LSEGのESG・ガバナンス・財務データを使い、業種と年の固定効果つきのパネル回帰で分析した。監視は、取締役会の独立性、CEOと会長の分離、取締役会のESGの専門性による合成指標で測った（抄録）。", "p5": "ESGの改善は、その後の不祥事、投資の非効率、将来の業績とは一貫した関連がなかった。環境事故については、ESGの改善と監視の交互作用が負で有意で、監視が強いほど望ましい関連になった（抄録）。", "fun": "ESGの点数が上がった会社は、本当にその後の環境事故が減るのか。この研究では、点数の改善だけでは将来をほとんど予言できず、取締役会がしっかり見張っている会社でだけ環境事故との関係が良い方向に変わった。数字の中身を支える仕組みが大事だと示した点が面白い。", "unverified": "交互作用の効果の大きさの数値は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "生成AIをESG報告に使う事例と導入プロセスの枠組み", "title": "Generative AI in ESG Reporting: A Case Study and Process Framework", "url": "https://doi.org/10.1002/bse.71795", "authors": "Nitin Singh ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-02", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Singh, N., Lai, K.-h., & Zhang, J. Z. (2026). Generative AI in ESG Reporting: A Case Study and Process Framework. Business Strategy and the Environment. https://doi.org/10.1002/bse.71795", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "企業が生成AIをESG報告にどう使って価値を生めるかを事例研究で調べ、デジタルなESG報告の基盤に生成AIを導入するための枠組みを示した（抄録）。", "p3": "生成AIのESG報告への導入を事例研究で分析した（事例の企業や資料の詳細は抄録の範囲で未確認）（抄録）。", "p5": "生成AIは、データの自動抽出、分析の高速化、動的な報告でESG報告のデジタル革新を進め、多様なデータの統合と情報の入手しやすさの向上で利害関係者との対話を強める一方、データガバナンスと人とAIの協働に大きな課題があった（抄録）。", "fun": "企業が環境や社会への取り組みを報告する書類は分厚く、作るのに大きな手間がかかる。この研究は、その作業を生成AIに手伝わせたときに何が良くなり、どこでつまずくかを企業の例から整理した。便利さの裏で「誰がデータに責任を持つか」が課題になる点が見えてくる。", "unverified": "事例の企業の数と業種、分析の資料は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "ビッグデータ分析と戦略的管理会計と組織業績", "title": "The associations between big data analytics, strategic management accounting and organisational performance", "url": "https://doi.org/10.1016/j.adiac.2026.100908", "authors": "Thanh Phan ほか", "venue": "Advances in Accounting", "date": "2026-11-02", "citescore": 2.5, "citescore_year": "2025", "apa": "Phan, T., & Baird, K. (2026). The associations between big data analytics, strategic management accounting and organisational performance. Advances in Accounting, 71, 100908. https://doi.org/10.1016/j.adiac.2026.100908", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "ビッグデータ分析、戦略的管理会計、組織の業績の関係を調べた研究と題名から読み取れる（Advances in Accounting）。背景：戦略的管理会計は、競合や市場の情報も使って長期的な意思決定を支える管理会計の考え方。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "大量のデータを分析する力を持つ会社は、本当に業績が良くなるのか。題名からは、その間に「戦略的な管理会計」という経営の仕組みが入ることで、データの力が成果に結びつくかを調べた研究だと読み取れる。道具とその使い方の関係を問う点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr29", "rank": 29, "headline": "エスニック料理店の本物らしさの要因と効果をメタ分析", "title": "Perceived authenticity in ethnic and cultural restaurants: a systematic review and meta-analysis", "url": "https://doi.org/10.1108/ijchm-04-2026-0679", "authors": "Forrest (Haosen) Wang ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-02", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Wang, F. (., Zhu, D., Kim, C. S., & Kim, P. B. (2026). Perceived authenticity in ethnic and cultural restaurants: a systematic review and meta-analysis. International Journal of Contemporary Hospitality Management, 1–29. https://doi.org/10.1108/ijchm-04-2026-0679", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "エスニック料理店などでの「本物らしさ」の感じ方について、その先行要因と顧客の反応への効果をメタ分析で統合した（抄録）。", "p3": "系統的レビューで100研究を特定し、採用基準を満たした50研究の効果量をランダム効果モデルで統合し、文化・年齢・性別の調整効果を分析した（抄録）。", "p5": "本物らしさはブランドイメージと料理の質などの目に見える手がかりで強く形づくられ、顧客満足、再訪意図、口コミに頑健な正の効果をもった。個人主義の文化では本物らしさと前向きな感情の関係が強く、年長の消費者は記憶に残る体験で本物らしさを重視し、女性は人とのやり取りの手がかりに敏感だった（抄録）。", "fun": "「本場の味」と感じるかどうかは、料理そのものだけでなく、店のブランドの印象にも大きく左右される。この研究は50の研究をまとめて、その「本物らしさ」が満足や口コミを生む力が強いことを示した。感じ方が文化や年齢で変わる点も面白い。", "unverified": "各効果量の具体的な値は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "実時間の顧客セグメンテーションを動的能力として捉え直す", "title": "Dynamic Capabilities for Real‐Time Customer Segmentation: Insights From a Sequential Mixed‐Methods Study", "url": "https://doi.org/10.1002/cb.70269", "authors": "Subhajit Pahari ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-11-02", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "apa": "Pahari, S., Lim, W. M., Patra, M., Marak, Z. R., & Bandyopadhyay, A. (2026). Dynamic Capabilities for Real‐Time Customer Segmentation: Insights From a Sequential Mixed‐Methods Study. Journal of Consumer Behaviour. https://doi.org/10.1002/cb.70269", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "顧客セグメンテーションを、受け身の分類ではなく、市場の変化に合わせて実時間で組み替える動的な能力として捉え直した（抄録）。", "p3": "実務家への質的な聞き取りと、構造方程式モデリングによる量的な検証を順に行う混合研究法で、感知・捕捉・再構成という動的能力の枠組みを検証した（抄録）。", "p5": "顧客理解、市場の監視、データ統合の能力がビッグデータの処理能力を高め、データ解釈の能力と機敏な戦略の能力を強め、実時間の区分の組み替えを支えた。情報の過負荷と組織の慣性は経路を弱める方向だったが、三つの交互作用はどれも有意ではなかった（抄録）。", "fun": "「若い女性」「シニア男性」といった固定の客層の分け方は、流行が速い今の市場ではすぐに古くなる。この研究は、客の分け方そのものを、データを使って組み替え続ける「会社の能力」として見直した。分類を作業ではなく能力として捉える発想の転換が面白い。", "unverified": "量的調査の標本の大きさと、各経路の係数は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "観光・接客の場での迷惑客行動を体系的レビューで整理", "title": "Consumer misbehavior in tourism and hospitality contexts: a framework-based systematic review and future agenda", "url": "https://doi.org/10.1108/ijchm-03-2026-0349", "authors": "Xiaoling He ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-02", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "He, X., Huang, S. (., & Yu, Z. (2026). Consumer misbehavior in tourism and hospitality contexts: a framework-based systematic review and future agenda. International Journal of Contemporary Hospitality Management, 1–24. https://doi.org/10.1108/ijchm-03-2026-0349", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "観光と接客の場での顧客の迷惑行為について、発生、行為、帰結、介入を整理する統合的な枠組みを系統的レビューで作った（抄録）。", "p3": "ScopusとWeb of Scienceから得た査読つき論文83本を、先行要因・行為・帰結・介入（AECI）の枠組みで統合した（抄録）。", "p5": "迷惑行為は主に外的な状況要因と消費者の心理的なきっかけで生まれ、否定的な感情、防衛的な調整、脅威の評価が媒介の仕組みだった。影響は従業員、ほかの客、住民に及び、介入の研究は予防策に偏り、従業員や住民への事後の対処策はほとんど見過ごされていた（抄録）。", "fun": "店員に暴言を吐いたり、観光地でルールを破ったりする客の問題は、その場の店員だけでなく、ほかの客や地元の住民にも波及する。この研究は、これまでの研究が「起こさせない工夫」に偏り、「起きた後に傷ついた人を支える工夫」が手薄だと指摘した。視点の偏りを見つけた点が面白い。", "unverified": "対象論文の年代と地域の分布は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "映像解析で空港の待ち行列を測りサービス水準を評価", "title": "Airport level-of-service assessment using video analytics: a data-driven framework for airport queue monitoring", "url": "https://doi.org/10.1016/j.jjimei.2026.100450", "authors": "Decio Yoshimoto ほか", "venue": "International Journal of Information Management Data Insights", "date": "2026-11-02", "sjr": 1.784, "citescore": 25.1, "citescore_year": "2025", "apa": "Yoshimoto, D., Pinto Alves, C. J., da Silva, E. J., & Caetano, M. (2026). Airport level-of-service assessment using video analytics: a data-driven framework for airport queue monitoring. International Journal of Information Management Data Insights, 6(2), 100450. https://doi.org/10.1016/j.jjimei.2026.100450", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "映像解析で空港の待ち行列を監視し、空港のサービス水準を評価するデータ駆動の枠組みを提案する研究と題名から読み取れる。背景：空港のサービス水準は、保安検査や手続きの待ち時間などで評価されることが多い。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "空港の保安検査の長い列は、利用者の満足を大きく左右する。題名からは、カメラの映像から列の長さや待ち時間を自動で測り、サービスの質を数字で評価しようとする研究だと読み取れる。目で見ていた混雑をデータとして扱う発想が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr33", "rank": 33, "headline": "歯科のオンライン口コミをトピックモデルで分析", "title": "Customer service in dentistry: Analysing online reviews of oral care using topic modelling and semantic annotation", "url": "https://doi.org/10.1016/j.acorp.2026.100259", "authors": "Luke C. Collins ほか", "venue": "Applied Corpus Linguistics", "date": "2026-11-02", "sjr": 1.288, "citescore": 4.4, "citescore_year": "2025", "apa": "Collins, L. C., Feizollah, A., Hanchard, M., Listl, S., & Byrne, M. (2026). Customer service in dentistry: Analysing online reviews of oral care using topic modelling and semantic annotation. Applied Corpus Linguistics, 100259. https://doi.org/10.1016/j.acorp.2026.100259", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "歯科の口腔ケアに関するオンラインの口コミを、トピックモデルと意味注釈で分析し、顧客サービスの観点を探る研究と題名から読み取れる（Applied Corpus Linguistics）。背景：トピックモデルは大量の文章から話題のまとまりを自動で見つける手法。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "歯医者さんの口コミには、治療の腕だけでなく、受付の対応や説明のわかりやすさへの声も多い。題名からは、そうした大量の口コミを言語の分析で整理し、患者が何を「サービス」として見ているかを探った研究だと読み取れる。医療を接客の目で見る点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr34", "rank": 34, "headline": "ケララ州の地域緩和ケアの実施と移転可能な教訓", "title": "The Kerala model of community-based palliative care: A scoping review of service delivery, implementation strategies, implementation gaps, and transferable lessons", "url": "https://doi.org/10.1177/26323524261488422", "authors": "Franco Johny V ほか", "venue": "Palliative Care and Social Practice", "date": "2026-11-03", "sjr": 0.805, "citescore": 3.1, "citescore_year": "2025", "apa": "Johny V, F., Paul, T., John, R. L., Sulfath, T. S., Rajmohan, P., Mohan, M., Murali, N. V., & Thomas, J. (2026). The Kerala model of community-based palliative care: A scoping review of service delivery, implementation strategies, implementation gaps, and transferable lessons. Palliative Care and Social Practice, 20. https://doi.org/10.1177/26323524261488422", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "インド・ケララ州の地域に根ざした緩和ケア（ケララ・モデル）について、提供の仕方、実施の戦略と課題、他地域に移せる教訓を、スコーピングレビューで整理した（抄録）。", "p3": "JBIの方法とPRISM ry value evaluation on policies to improve the accessibility of public transport for people with a disability", "url": "https://doi.org/10.1016/j.urbmob.2026.100306", "authors": "Jelmer Nederhof ほか", "venue": "Journal of Urban Mobility", "date": "2026-11-02", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "apa": "Nederhof, J., Vroom, R., van Oort, N., & Mouter, N. (2026). Please repair the broken elevator! A participatory value evaluation on policies to improve the accessibility of public transport for people with a disability. Journal of Urban Mobility, 10, 100306. https://doi.org/10.1016/j.urbmob.2026.100306", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "障害のある人の公共交通の利用しやすさを高める政策を、参加型価値評価（PVE）で評価した研究と題名から読み取れる（Journal of Urban Mobility）。背景：参加型価値評価は、限られた予算の中で市民に政策の組み合わせを選んでもらい、選好を測る方法。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「壊れたエレベーターを直して！」という題名は、駅のエレベーター一基の故障が、ある人たちにとっては移動そのものを左右することを思わせる。題名からは、限られた予算でどの改善を優先すべきかを、市民の選択から決めようとした研究だと読み取れる。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr37", "rank": 37, "headline": "LLMによる医学記述式問題の採点の精度と一貫性", "title": "Use of Large Language Models for Automated Short-Answer Question Grading in Second-Cycle Medical Education: Performance and Consistency Evaluation Study", "url": "https://doi.org/10.2196/89445", "authors": "Sabrina Sidali ほか", "venue": "JMIR Medical Education", "date": "2026-11-02", "sjr": 2.482, "citescore": 16.0, "citescore_year": "2025", "apa": "Sidali, S., Soret, P.-A., Wagner, M., Voron, T., & Vanderbecq, Q. (2026). Use of Large Language Models for Automated Short-Answer Question Grading in Second-Cycle Medical Education: Performance and Consistency Evaluation Study. JMIR Medical Education, 12, e89445. https://doi.org/10.2196/89445", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "医学教育の記述式問題（肝臓・消化器）の採点を、LLMが人間の採点者とどれだけ同じ水準で、一貫して行えるかを評価した（抄録）。", "p3": "パリのソルボンヌ大学の試験（2023〜2025年）の記述式問題について、三人の採点者が全回答を二回ずつ採点した多数一致の得点を基準とし、六つのLLM（GPT-4o、GPT-4.5、GPT-4o3、GPT-5、Claude Sonnet 4、Mistral Pro）にも同じ基準で二回ずつ採点させ、重みつきκ、ICC、平均絶対誤差で一致を比べた（抄録）。", "p5": "12問への902件の回答を分析した。人間どうしの一致はほぼ完全（QWK 0.90〜0.92）で、Claude Sonnet 4とGPT-4o3は多数一致の基準に対して人間に近い水準の性能を示した（抄録）。", "fun": "記述式の答案の採点は手間がかかり、採点者によって点数がぶれることもある。この研究では、いくつかのAIが人間の採点者に近い精度で採点できた。人間どうしの一致がもともと高い分野で、AIがどこまで追いつけるかを確かめた点が面白い。", "unverified": "各LLMの採点の一貫性（同じ答案を二回採点したときの一致）の数値は未確認（抄録が途中まで）。"}}, {"id": "jr38", "rank": 38, "headline": "LLMで訪日客の移動軌跡を生成し人の移動を理解する", "title": "Large language models for human mobility understanding: A case study of inbound tourist trajectories generation in Japan", "url": "https://doi.org/10.1016/j.trc.2026.106110", "authors": "Jiawei Wang ほか", "venue": "Transportation Research Part C: Emerging Technologies", "date": "2026-11-02", "sjr": 2.396, "citescore": 15.4, "citescore_year": "2025", "apa": "Wang, J., Li, P., Jiang, W., Chen, J., Koshizuka, N., Shibasaki, R., & Jiang, R. (2027). Large language models for human mobility understanding: A case study of inbound tourist trajectories generation in Japan. Transportation Research Part C: Emerging Technologies, 194, 106110. https://doi.org/10.1016/j.trc.2026.106110", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "大規模言語モデルで訪日外国人旅行者の移動軌跡を生成し、人の移動の理解に役立てる事例研究と題名から読み取れる（Transportation Research Part C）。背景：人の移動の軌跡データは交通計画や観光政策の基礎になるが、個人情報の制約で得にくい。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "外国から来た旅行者は、日本の中をどんな順番で回るのか。題名からは、言語モデルに旅行者の移動の軌跡を作らせ、本物のデータの代わりや補いにできるかを試した研究だと読み取れる。AIに「旅をさせる」発想が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr39", "rank": 39, "headline": "ランダム力学系の理論でLLMの幻覚を捉える", "title": "Stochastic fixed points and Lyapunov exponents: A random dynamical systems theory of hallucination in large language models", "url": "https://doi.org/10.1016/j.knosys.2026.117289", "authors": "Yonghong Yao ほか", "venue": "Knowledge-Based Systems", "date": "2026-11-02", "sjr": 1.753, "citescore": 13.7, "citescore_year": "2025", "apa": "Yao, Y., Adeniran, R. I., & Shehu, Y. (2026). Stochastic fixed points and Lyapunov exponents: A random dynamical systems theory of hallucination in large language models. Knowledge-Based Systems, 117289. https://doi.org/10.1016/j.knosys.2026.117289", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "大規模言語モデルの幻覚（もっともらしい誤り）を、確率的な固定点とリアプノフ指数を用いたランダム力学系の理論で説明しようとする研究と題名から読み取れる（Knowledge-Based Systems）。背景：リアプノフ指数は、わずかな違いが時間とともに広がるか縮むかを表す安定性の指標。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "言語モデルが堂々とでたらめを言う「幻覚」は、なぜ起きるのか。題名からは、文章を一語ずつ生み出す過程を、振り子や天気のような「動きの系」として捉え、わずかなずれが雪だるま式に広がるかどうかで説明しようとする研究だと読み取れる。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr40", "rank": 40, "headline": "米国の地方政府はAI導入をどう意味づけたか", "title": "Organizational sensemaking and AI adoption in U.S. local governments", "url": "https://doi.org/10.1080/14719037.2026.2756938", "authors": "Jihoon Jeong", "venue": "Public Management Review", "date": "2026-11-02", "sjr": 2.54, "citescore": 11.5, "citescore_year": "2025", "apa": "Jeong, J. (2026). Organizational sensemaking and AI adoption in U.S. local governments. Public Management Review, 1–24. https://doi.org/10.1080/14719037.2026.2756938", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "米国の地方政府でのAI導入を、組織のセンスメイキング（意味づけ）の観点から分析した研究と題名から読み取れる（Public Management Review）。背景：センスメイキングは、組織の人々が新しい状況を解釈し、意味を与えて行動につなげる過程を指す。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "役所がAIを導入するかどうかは、技術の性能だけでは決まらない。題名からは、職員たちがAIを「何のための道具か」とどう意味づけたかが導入の進み方を左右する、という視点の研究だと読み取れる。技術より先に解釈がある、という問いが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"i ment, and emotional exhaustion. Social Psychology of Education, 29(1). https://doi.org/10.1007/s11218-026-10311-0", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "教員の社会情緒的なコンピテンスの自己認識（PSEC）を五つの次元で捉え、リーダー行動との関係と、組織コミットメント・情緒的消耗とのつながりを調べた（抄録）。", "p3": "オーストラリアの教員473人の横断データを構造方程式モデリングで分析し、自律を支えるリーダー行動と自律を妨げるリーダー行動を予測変数とした（抄録）。", "p5": "自律を支えるリーダー行動は五つの次元すべてと正に関連したが、妨げる行動はどの次元とも関連しなかった。寛容さと感情調整の有能感は組織コミットメントの高さと、自己主張の有能感は情緒的消耗の低さと関連し、社会的調整の有能感は情緒的消耗の高さと関連した（抄録）。", "fun": "人づきあいがうまいと感じている先生ほど疲れにくい、とは限らない。この研究では、周りの調整役を引き受ける力があると感じる先生ほど、かえって消耗が大きかった。一方で、自分の意見をきちんと言える力は疲れを減らしていた。得意なことが負担にもなる、という逆説が面白い。", "unverified": "横断データのため因果の向きは未確認。"}}, {"id": "jr43", "rank": 43, "headline": "日本の男性育休が同僚の生産性とウェルビーイングに与える影響", "title": "Male parental leave and workplace factors associated with coworkers’ work productivity and well-being in Japan", "url": "https://doi.org/10.1007/s44202-026-00985-0", "authors": "Hiromi Ono", "venue": "Discover Psychology", "date": "2026-11-02", "citescore": 1.8, "citescore_year": "2025", "apa": "Ono, H. (2026). Male parental leave and workplace factors associated with coworkers’ work productivity and well-being in Japan. Discover Psychology. https://doi.org/10.1007/s44202-026-00985-0", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "日本で男性が育児休業を取ることと職場の要因が、同僚の仕事の生産性とウェルビーイングにどう関係するかを調べた研究と題名から読み取れる（Discover Psychology）。背景：男性の育休の取得が増える中、その間に業務を分担する同僚への影響も議論されている。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "男性が育休を取るとき、職場の同僚は「仕事が増えて大変」になるのか、それとも「お互いさま」の雰囲気で前向きになるのか。題名からは、その分かれ目に職場のどんな要因があるのかを日本で調べた研究だと読み取れる。身近で答えが気になる問いだ。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "1960年以降のソウルの街区形態を類型化し変化を追う", "title": "Urban form typologies in Seoul since 1960: A framework for block-level classification and their changin 物が互いに力を及ぼし合う。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "砂と水と岩や杭が入り混じる世界は、それぞれ別の方程式で扱われがちだ。題名からは、その三つを一つの枠組みでまとめて計算しようとする研究だと分かる。複数の物質が絡み合う現象を一度に解きたい、という問いが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr46", "rank": 46, "headline": "地すべり危険度を確率的な時空間の枠組みで評価", "title": "A probabilistic spatiotemporal framework for landslide hazard assessment", "url": "https://doi.org/10.1016/j.enggeo.2026.109179", "authors": "Shengwu Qin ほか", "venue": "Engineering Geology", "date": "2026-11-02", "sjr": 2.913, "citescore": 14.0, "citescore_year": "2025", "apa": "Qin, S., Zhang, C., Feng, C., Lv, J., & Liu, X. (2026). A probabilistic spatiotemporal framework for landslide hazard assessment. Engineering Geology, 109179. https://doi.org/10.1016/j.enggeo.2026.109179", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "地すべりの危険度を、確率にもとづく時空間の枠組みで評価する研究と題名から読み取れる（Engineering Geology）。背景：地すべりのハザード評価では、どこで、いつ、どのくらいの確率で起きるかを合わせて考える必要がある。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "地すべりの危険は「この斜面は危ない」という地図だけでは足りず、「どの時期に、どのくらいの確率で」も知りたい。題名からは、場所と時間の両方で起こりやすさを確率として表そうとする研究だと読み取れる。地図に時間の軸を加える問いが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr47", "rank": 47, "headline": "脆性破壊で摂動法と変分法をつなぐ", "title": "Bridging perturbation and variational approaches in brittle fracture", "url": "https://doi.org/10.1016/j.cma.2026.119468", "authors": "Serafim Egorov ほか", "venue": "Computer Methods in Applied Mechanics and Engineering", "date": "2026-11-02", "sjr": 2.323, "citescore": 13.7, "citescore_year": "2025", "apa": "Egorov, S., Sanner, A., Sulem, J., Pastewka, L., & Lebihain, M. (2027). Bridging perturbation and variational approaches in brittle fracture. Computer Methods in Applied Mechanics and Engineering, 464, 119468. https://doi.org/10.1016/j.cma.2026.119468", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "不均質で完全に脆い固体の中を平らに進む三次元の鋭いき裂について、変分的な破壊の定式化とライスの摂動理論をつなぐ、縮約した変分モデルを作った（抄録）。", "p3": "き裂前縁の形を、前縁の変形から漸近的に評価した弾性ポテンシャルエネルギーと、破壊エネルギーの場で決まる散逸エネルギーの和の最小化で求める。エネルギーと導関数は高速フーリエ変換で効率よく計算し、非凸の制約つき最小化を信頼領域つきのニュートン共役勾配法で解く（抄録）。", "p5": "新たに導いた解析解で実装を検証し、乱れた媒質での引張とせん断のき裂の進展を116,000回の大規模なシミュレーションで調べた。滑らかな進展から断続的な進展への移り変わりを再現し、モードの混合は断続性の始まりにはあまり影響しないが、II+IIIの混合荷重では楕円に近い前縁を生むことを示した（抄録）。", "fun": "ガラスや岩が割れるとき、ひびはまっすぐ滑らかに進むとは限らず、引っかかっては一気に進む「ぎくしゃく」した動きをする。この研究は、ひびの先端の形を効率よく追う計算法を作り、十万回を超える計算でその動きの起こり方を調べた。二つの理論を橋渡しした点も面白い。", "unverified": "有限サイズの効果についての定量的な結論は、抄録が途中で切れており未確認。"}}, {"id": "jr48", "rank": 48, "headline": "偏心した排出口のサイロで粒状体の流れが偏る仕組み", "title": "Flow localization, asymmetry, and velocity fluctuations in eccentric granular discharge from a quasi-two-dimensional silo", "url": "https://doi.org/10.1063/5.0349844", "authors": "Gaurav Kumar Mishra ほか", "venue": "Physics of Fluids", "date": "2026-11-02", "citescore": 5.4, "citescore_year": "2025", "apa": "Mishra, G. K., Maiti, R., & Mandal, S. (2026). Flow localization, asymmetry, and velocity fluctuations in eccentric granular discharge from a quasi-two-dimensional silo. Physics of Fluids, 38(11). https://doi.org/10.1063/5.0349844", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "準二次元のサイロから粒状体を排出するとき、排出口の偏り（偏心）、側壁の摩擦、排出口の大きさが、流れの局所化、速度の非対称、揺らぎにどう効くかを、実験と個別要素法（DEM）で調べた（抄録）。", "p3": "偏心率0、0.5、0.75、0.92で、滑らかな側壁と粗い側壁の条件の実験を行い、自由表面の変化、排出率、速度の分布を測ってDEMの予測と比べた。接触ネットワークの解析も行った（抄録）。", "p5": "偏心が大きいほど壁に沿った非対称で局所的な流れになった。規格化した排出率は偏心が小さいうちはあまり変わらず、0.75あたりの経験的な境目より上で偏心への依存が強まった。高い偏心では側壁の摩擦の影響が目立ち、壁際の粒子の動きを弱めた（抄録）。", "fun": "砂時計の穴を真ん中から端にずらすと、砂の流れ方はどう変わるか。この研究では、穴が端に寄るほど流れが壁際に集まって偏り、ある程度を超えると流れ出る量の変わり方が急に強まった。身近な現象の中にはっきりした「境目」がある点が面白い。", "unverified": "接触ネットワーク解析の結論は、抄録が途中で切れており未確認。"}}, {"id": "jr49", "rank": 49, "headline": "摩擦融解と間隙水圧を含む氷・土砂なだれの深さ平均モデル", "title": "A thermo-mechanically coupled depth-averaged framework for full process granular-ice avalanches: Frictional melting, pore pressure generation, and debris flow transition", "url": "https://doi.org/10.1016/j.compfluid.2026.107335", "authors": "Yinrui Zhang ほか", "venue": "Computers & Fluids", "date": "2026-11-02", "citescore": 5.6, "citescore_year": "2025", "apa": "Zhang, Y., Lyu, L., Zhang, Y., Zhang, L., Zhu, P., Hou, C., Li, J., Zhang, X., & Lu, X. (2026). A thermo-mechanically coupled depth-averaged framework for full process granular-ice avalanches: Frictional melting, pore pressure generation, and debris flow transition. Computers & Fluids, 107335. https://doi.org/10.1016/j.compfluid.2026.107335", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "摩擦による融解と間隙水圧の発生を含めて、氷と土砂のなだれの全過程と土石流への移り変わりを、熱と力学を連成した深さ平均の枠組みで表す研究と題名から読み取れる（Computers & Fluids）。背景：深さ平均モデルは、流れの厚さ方向を平均して広い範囲の流れを効率よく計算する方法。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "氷と岩が混ざったなだれは、すべり落ちる摩擦で氷が解け、水が増えて土石流のように性格を変えていく。題名からは、その変化を熱と力の両方から追いかける研究だと読み取れる。一つの災害が途中で別の災害に変わっていく点が面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "組織は導入する革新をどう選ぶか：設計と利用の溝", "title": "Crossing the Design–Use Divide: How Organizations Select Innovations to Adopt", "url": "https://doi.org/10.1177/00018392261493079", "authors": "Rebecca Karp", "venue": "Administrative Science Quarterly", "date": "2026-11-02", "sjr": 9.595, "citescore": 13.4, "citescore_year": "2025", "apa": "Karp, R. (2026). Crossing the Design–Use Divide: How Organizations Select Innovations to Adopt. Administrative Science Quarterly. https://doi.org/10.1177/00018392261493079", "why": "技術の設計と利用を別々に論じてきた研究に対し、組織が採用する革新をどのように選ぶかを分析した。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "外国機関のドル資産が危機時に自国国債利回りを揺らす", "title": "Unintended Consequences of Holding Dollar Assets", "url": ar": "2025", "why": "生涯に受けたストレスの蓄積が、相手とのやり取りの中での信頼の形成と社会的学習の認知過程とどう関係するかを示した。"}, {"id": "jn14", "rank": 14, "field": "環境・人口", "headline": "中国の子どもの暑熱曝露は温暖化と人口移動で変化", "title": "Rising temperatures, shifting population: Changes in children’s ambient heat exposure in China", "url": "https://doi.org/10.1073/pnas.2615409123", "authors": "Kai Feng ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-02", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "熱波の増加が子どもの暑さへの曝露にどう結びつくかを、気温の変化と子どもの人口分布の変化の両面から測った。"}, {"id": "jn15", "rank": 15, "field": "環境科学", "headline": "植林は温帯の山火事の起き方を変える", "title": "Afforestation reshapes wildfire activity across global temperate biomes", "url": "https://doi.org/10.1073/pnas.2623623123", "authors": "Irene Repeto-Deudero ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-02", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "気候対策として広がる植林が、温帯の生態系で山火事の活動をどう変えるかを世界規模で分析した。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "一党優位の日本で省庁組織はどう存続してきたか", "title": "The Immortality Paradox: One‐Party Dominance, Political Tenure, and Organizational Continuity in Japanese Agencies", "url": "https://doi.org/10.1111/gove.70160", "authors": "Ayako Nakamura", "venue": "Governance", "date": "2026-11-02", "sjr": 1.581, "citescore": 6.1, "citescore_year": "2025", "why": "政権交代が少ない日本の省庁を対象に、一党優位と政治家の在任期間が行政組織の存続にどう関わるかを検証した。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "政権交代が少なく首相の在任が短い戦後日本で、行政機関が廃止・再編されずに存続してきたかを検証した（抄録）。", "p3": "公的組織は「不死」とするカウフマンの1976年の古典的な主張と、組織はしばしば廃止されるとする近年の研究を対比し、一党優位の日本の行政機関の存続を分析した（抄録）。", "p5": "日本の行政機関はおおむね「不死」のままで、移行が起きるのは在任の長い首相のもとでの小さな見かけ上の変更と結びつく傾向があり、そうした出来事の後も機関は存続していた（抄録）。", "fun": "首相が次々に交代する国では、役所の組織もころころ変わりそうに思える。ところがこの研究によると、日本の省庁はほとんど「死なない」。変化が起きるのはむしろ長く続いた首相のときで、それも看板の掛け替え程度だった。政治の短さが役所の長さを生む逆説が面白い。", "unverified": "分析の対象期間と機関の数、使った手法は未確認。"}}, {"id": "jn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "職務知識テストの妥当性の証拠を30年ぶりに更新", "title": "What do we know about job knowledge tests? A 30-year update of validity evidence.", "url": "https://doi.org/10.1037/apl0001427", "authors": "Sara J. Bianco ほか", "venue": "Journal of Applied Psychology", "date": "2026-11-02", "sjr": 5.473, "citescore": 15.0, "citescore_year": "2025", "why": "採用選考で使われる職務知識テストの妥当性の証拠を、30年ぶりに更新した研究。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "採用や昇進、資格認定で広く使われる職務知識テストの、仕事の成果を予測する妥当性を、30年ぶりのメタ分析で更新した（抄録）。", "p3": "87の独立した標本のデータを分析し、職務の成果、訓練の成果、離職への予測的な妥当性を推定した。職務知識が他の要因と職務の成果の間をつなぐかも検証した（抄録）。", "p5": "運用上の妥当性の平均は、職務の成果で.30、訓練の成果で.35、離職で-.09だった。職務に特化したテスト（.36）は組織・職業に特化したテスト（.19、.21）より高く、選考・昇進に使うテスト（.47）は研究用（.31）や資格用（.21）より高かった。職務知識は認知能力と職務の成果の関係を完全に説明した（抄録）。", "fun": "入社試験の「知識のテスト」は、本当に仕事ができる人を見分けられるのか。この研究は87の標本をまとめ、ある程度は見分けられ、とくにその仕事に特化した問題ほど当たることを示した。頭の良さが成果につながるのは「知識を身につけるから」だという説明も面白い。", "unverified": "標本の業種と国の分布は未確認。"}}, {"id": "jn18", "rank": 18, "field": "統計学", "headline": "複数のしきい値で切り替わる変化平面自己回帰モデル", "title": "A Multi-threshold Change Plane Autoregressive Model", "url": "https://doi.org/10.1080/07350015.2026.2757073", "authors": "Shiwen Huang ほか", "venue": "Journal of Business & Economic Statistics", "date": "2026-11-02", "sjr": 3.508, "citescore": 5.9, "citescore_year": "2025", "why": "複数のしきい値で構造が切り替わる変化平面型の自己回帰モデルを提案した研究。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "複数のしきい値で構造が切り替わる「変化平面」型の自己回帰モデルを提案する研究と題名から読み取れる（Journal of Business & Economic Statistics）。背景：しきい値自己回帰モデルは、ある変数が境目を越えると時系列の動き方が変わる現象を表す。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "景気や市場は、ある水準を越えると急に振る舞いが変わることがある。題名からは、その境目が一本ではなく複数あり、しかも変数の組み合わせでできた面で切り替わる場合を扱う時系列モデルを作った研究だと読み取れる。境目の形まで推定しようとする問いが面白い。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "欠けた多視点データでの部分多ラベル分類の表現学習", "title": "Theory-Inspired Task-Relevant Representation Learning for Incomplete Multi-View Partial Multi-Label Classification", "url": "https://doi.org/10.1109/tpami.2026.3749817", "authors": "Quanjiang Li ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-02", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "一部の視点やラベルが欠けたデータの多ラベル分類のため、理論に基づく表現学習を提案した研究。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "一部の視点（データの種類）やラベルが欠けたデータの多ラベル分類で、理論に着想を得た、タスクに関係する表現の学習を提案する研究と題名から読み取れる（IEEE TPAMI）。背景：多視点学習は、画像と文章など異なる種類のデータを組み合わせて学習する方法。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "写真には説明文がない、説明文には写真がない、しかも付いているはずのタグも一部しかない。現実のデータはこうした「穴だらけ」のことが多い。題名からは、そんなデータからでも必要な特徴だけを学び取る方法を、理論を手がかりに作ろうとした研究だと読み取れる。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jn20", "rank": 20, "field": "オペレーションズ・リサーチ", "headline": "FISTAの反復点の強収束を増大条件の下で示す", "title": "Strong convergence of FISTA iterates under Hölderian and quadratic growth conditions", "url": "https://doi.org/10.1007/s10107-026-02431-4", "authors": "J.-F. Aujol ほか", "venue": "Mathematical Programming", "date": "2026-11-02", "sjr": 2.111, "citescore": 6.3, "citescore_year": "2025", "why": "加速近接勾配法FISTAの反復点が、ヘルダー型・二次の増大条件の下で強収束することを示した研究。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "凸最適化で広く使われる加速近接勾配法FISTAの反復点が、ヘルダー型または二次の増大条件のもとで最小解に強収束することを、最小解の一意性を仮定せずに示した（抄録）。", "p3": "ネステロフの加速勾配法を連続時間で表す「漸近的に消える減衰」の力学系をまず調べ、その解析をFISTAの反復に移した（抄録）。", "p5": "強制的で局所的な増大条件を満たす関数では、FISTAの点列は最小解に強収束し、関数値の収束も速くなる。力学系の解についても、軌道の長さが有限になるなどの改良した収束結果を示した（抄録）。", "fun": "最適化の計算では「目的の値が小さくなる」ことは保証されても、「答えの点そのものに行き着く」ことは別の問題だ。有名な手法FISTAでも、答えが一つでない場合はそこが分かっていなかった。この研究は、谷の形に条件をつけることで、その空白を埋めた。", "unverified": "数値例による確認の有無は未確認。"}}, {"id": "jn21", "rank": 21, "field": "心理学", "headline": "自尊感情と人間関係の相互影響を縦断研究のメタ分析で", "title": "Self-esteem and social relationships: A meta-analytic review of longitudinal studies with continuous time modeling.", "url": "https://doi.org/10.1037/bul0000540", "authors": "Ulrich Orth ほか", "venue": "Psychological Bulletin", "date": "2026-11-02", "sjr": 8.496, "citescore": 30.2, "citescore_year": "2025", "why": "自尊感情と社会的関係の関係を、縦断研究を連続時間のモデルで統合するメタ分析で検討した研究。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "自尊感情と社会的な関係が互いにどう影響し合うかを、縦断研究を連続時間モデルで統合したメタ分析で検討した研究と題名から読み取れる（Psychological Bulletin）。背景：連続時間モデルは、測定の間隔が研究ごとに違っても効果を比べられるようにする方法。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "自分に自信があるから友だちができるのか、友だちがいるから自信が持てるのか。題名からは、この「にわとりと卵」の問いに、時間の流れを追った多くの研究をまとめて答えようとした研究だと読み取れる。調査の間隔の違いをそろえて比べる工夫も気になる。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "信頼と行動の不確実性はともに変化する：脆弱性受容の理論", "title": "The coevolution of trust and behavioral uncertainty: Toward a theory of vulnerability acceptance in entrepreneurial ventures", "url": "https://doi.org/10.1002/sej.70068", "authors": "Lars Huemer ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-11-02", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "起業の過程で信頼と相手の行動の不確実性がともに変化する仕組みを、脆弱性の受容の過程理論として示した概念研究。", "explain": {"basis": "抄録", "basis_note": "候補の収集時に取得した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "起業の過程で、信頼と行動の不確実性がどのようにともに変化するかを説明する「脆弱性の受容」の過程理論を示した概念研究（抄録）。", "p3": "予測可能性や評価可能性で信頼を説明する従来の見方は、それらが事前に欠ける起業の機会には合わないとし、不確実性を生む信頼、解き放つ信頼、減らす信頼の三つの形を区別した（抄録）。", "p5": "それぞれの形は関わる不確実性を変え、その不確実性が形を強めたり揺るがしたりするので、終点となる形はない。機会の形成、解釈の組み替え、実現の段階で重要な形が移り、形と状況が合わないと起業の進展が妨げられる（抄録）。", "fun": "「信頼する」というと、相手の行動が読めるから任せる、と考えがちだ。でも新しい事業では、相手が何をするか読めないまま任せる場面がある。この研究は、信頼を不確実さへの反応ではなく、不確実さを生み出したり減らしたりする道具として捉え直した。", "unverified": "概念研究のため、実証的な検証は行われていない（抄録の範囲）。"}}, {"id": "jn23", "rank": 23, "field": "ヒューマンコンピュータインタラクション", "headline": "LinkedInでの公私を混ぜた自己呈示と社会関係資本", "title": "Professional or Personal? How     var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
