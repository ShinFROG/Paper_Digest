ジュ、移転などで他の環境へ向かう戦略的退出という3つの戦略を見いだした（抄録）。", "fun": "知り合いのいない国で会社を起こすとき、人脈は待っていても手に入らない。この研究は、移民の起業家が現地のやり方に合わせたり、母国のつながりを使ったり、時には見切りをつけて別の土地へ移ったりと、自分から人脈を作り変えていく様子を描いた。つながりを「与えられるもの」でなく「作るもの」と見る視点が面白い。", "unverified": "本文は入手できず、面接の対象者の属性と各戦略の頻度は確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "組織行動・心理的安全性", "headline": "世代の違う創業者で仕事の有意味感が異なる", "title": "Generational Differences in Organizational Leaders: An Interpretive Phenomenological Analysis of Work Meaningfulness in the Nordic High-tech Organizations", "url": "https://doi.org/10.2139/ssrn.7702820", "authors": "Ahmad Arslan ほか", "venue": "SSRN", "date": "2026-11-19", "why": "フィンランドのハイテク企業5社の創業者を解釈的現象学的分析で調べ、世代の異なるリーダーの間で仕事の有意味感の捉え方に違いがあり、それが組織の中で表れることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。Technological Forecasting and Social Changeに2022年に掲載された論文のSSRN版で、本文は入手できず", "preprint": false, "short": true, "p1": "北欧のハイテク企業の創業者の世代の違いが、仕事の有意味感の捉え方にどう表れるかを解釈的現象学的分析で示した（抄録）。論文誌に掲載済みの論文のSSRN版。", "p3": "フィンランドの5社の事例企業で、創業者たちの語りを解釈的現象学的分析（IPA）で分析した（抄録）。", "p5": "世代間で、物質的な豊かさ、住宅の所有、自由、チームワーク、共同所有者として働くか従業員として働くかについての見方に違いがあった。雇用の安定や有期・パート・ギグの働き方が幸福や有意味感に一律に悪いとは限らず、ミレニアル世代以降は変化を否定的に捉えないことがあると示した（抄録）。", "fun": "「安定した正社員がいちばん」という考えは、どの世代にも当てはまるだろうか。フィンランドのIT企業の創業者たちを調べると、若い世代は変化の多い働き方を必ずしも悪いとは感じていなかった。働くことの意味は時代とともに変わるという、身近な世代間の違いを丁寧に描いた点が面白い。", "unverified": "本文は入手できず、事例企業の規模と語りの具体例は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "ストリーミング動画モデルを対話的に", "title": "ALIVE: Making Streaming Video Models Interactive", "url": "https://arxiv.org/abs/2611.21366", "authors": "Jinzhao Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "映像を連続して見る動画LLMが利用者の依頼を個別にしか扱えない問題に対し、能動的な監視・タスクの調整・フィードバックを求める対話を備えたALIVEを提案し、教師あり微調整と強化学習の2段階で学習する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersで候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "連続して映像を見る動画LLMに、能動的な監視、ストリーミング中のタスクの調整、フィードバックを求める対話を加えたALIVEを提案した（抄録）。未査読。", "p3": "ALIVE-SFT-288KとALIVE-RL-3Kの2つのデータで2段階に学習した。対照的な教師あり微調整で応答の時機と仕方を教え、軌跡と局所の優位度を組み合わせる強化学習（BACA）で、多ターンの判断・応答・沈黙を磨いた。フィードバックを求める能力の評価用にFSI-Benchも作った（抄録）。", "p5": "4つの公開ベンチマークとFSI-Benchで、比較したモデルの中で最も高い総合得点を得た（抄録）。具体的な得点は抄録にない。", "fun": "今の動画AIは、聞かれたことに答えるだけで、見張りながら「今だ」と自分から声をかけるのは苦手だ。料理の動画を見ながら「火を止める時間ですよ」と教えてくれる相棒のように、黙っているべき時と話すべき時を学ばせた点が面白い。黙ることも答えの一つとして学習している。", "unverified": "本文は入手できず、各ベンチマークの得点と比較したモデルは確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "事前学習済み気象モデルを低ランクで高解像度化", "title": "PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling", "url": "https://arxiv.org/abs/2611.11318", "authors": "Minseo Yoon ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "粗い現在の状態から将来の高解像度の気象場を予測する課題を予測的な時空間ダウンスケーリングとして定式化し、大規模な事前学習済み気象モデルを主成分と直交する低ランク適応（PROLA）で効率よく適応させる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersで候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "粗い現在の状態から将来の高解像度の気象場を予測する課題（予測的時空間ダウンスケーリング）を定式化し、事前学習済みの気象モデルを効率よく適応させる低ランク適応PROLAを提案した（抄録）。未査読。", "p3": "予測を、共有の事前学習済みバックボーン、固定の数値的な足場、軽い残差ヘッドで空間と時間の段階に分け、固定の低ランクの予算を事前学習の重みの主方向とその直交補空間に配分する。勾配の信号でランク1の更新を再スケールし、学習するランクを増やさずに適応を改善する（抄録）。", "p5": "このダウンスケーリングの設定でPROLAは代表的な低ランク適応の基準法を上回り、ほかのデータセットと課題でも有効性が示された（抄録）。具体的な数値は抄録にない。", "fun": "天気予報の大きなAIは地球全体を粗い網目で見ているので、町ごとの細かい雨の降り方は苦手だ。この研究は、大きなAIの中身はほとんど変えず、ほんの一部の調整だけで細かい予報に作り変える。調整の向きを、元の知識の主な方向とそれ以外の方向に分けて配る工夫が面白い。", "unverified": "本文は入手できず、使った気象データと改善の大きさの数値は確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "事後の情報で世界行動モデルを学習", "title": "HINT-WAM: Hindsight-Informed Training for World Action Models", "url": "https://arxiv.org/abs/2611.24789", "authors": "Phuong Tuan Dat ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "将来の視覚的な変化の予測と行動の生成を組み合わせた世界行動モデル（WAM）のロボット操作での実行の信頼性を高めるため、事後的な情報で学習を補う方法（HINT-WAM）を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersで候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ロボット操作の世界行動モデル（WAM）を、実演の将来の映像（後知恵）を特権情報として使う方策上の自己蒸留で学習するHINT-WAMを提案した（抄録）。未査読。", "p3": "生徒は展開時の入力だけで自分のノイズ除去の軌跡に沿って行動を生成し、その軌跡上の各状態で、同じモデルが実演の将来の映像を追加で見る教師として条件付きの行動分布を与える。教師の分布を、速度場の回帰ではなくエネルギー・スコアで生徒自身の標本から合わせ、環境の報酬やシミュレータは使わない（抄録）。", "p5": "抄録には成功率などの実験結果の記載はなく、自分の軌跡に後知恵を使う最初の方策上の自己蒸留の枠組みであることを主張している（抄録）。", "fun": "お手本の動画を見てロボットが動きを学ぶとき、ふつうはお手本の動きそのものを真似させる。この研究では、ロボットが自分で動いてみた途中の状態ごとに、「お手本ならこの先こうなる」という未来の映像を見た自分自身が先生役になって教える。答えを知っている自分が、知らない自分を指導するという発想が面白い。", "unverified": "本文は入手できず、実験の課題と成功率は確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "低曲率の更新で能力を保ちつつLLMを調整", "title": "CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning", "url": "https://arxiv.org/abs/2611.24654", "authors": "Zeguan Xiao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "why": "LLMを適応させると目的は達成しても一般的な能力が落ちる問題に対し、保持すべき能力の局所的な幾何（曲率）を更新のパラメータ化に組み込むCurvDeltaを提案し、狙った学習と忘却（アンラーニング）を行う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersで候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMを新しい能力の獲得や選択的な忘却に適応させるとき、一般的な能力を保つ制約を更新のパラメータ化に組み込むCurvDeltaと、その低ランク版CurvLoRAを提案した（抄録）。未査読。", "p3": "適応前のモデルの周りで保持すべき損失の局所的な幾何を解析し、更新しても保持の損失がほとんど変わらない低曲率の空間を作る。LLMで使えるよう、K-FACによる曲率の近似と分解した射影を用いる（抄録）。", "p5": "数学的推論とコード生成では下流の性能を保ちつつ一般能力をよりよく保持し、知識の忘却（TOFU・MUSE）では狙った忘却と知識の保持のバランスが基準法より良く、保持はゼロからの再学習に近かった（抄録）。", "fun": "AIに新しいことを教えると、前に覚えていたことを忘れてしまうことがある。この研究は、元の能力に影響しにくい「なだらかな方向」を数学的に探し、その方向にだけ変化させる。特定の知識だけを消す用途にも使える。外科手術のように狙った部分だけを変えるという発想が面白い。", "unverified": "本文は入手できず、各課題の具体的な得点は確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "同値な表現で推論時計算を増やすスケーリング則", "title": "Test-Time Symmetrization: Scaling Laws for Model-Agnostic Learning under Structure", "url": "https://arxiv.org/abs/2611.24032", "authors": "Behrooz Tahmasebi ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "同じ問題の等価な表現を複数使って推論時に対称化すると精度がどう伸びるかのスケーリング則を示し、同じプロンプトからの反復サンプリングに限っていた推論時計算のスケーリングを拡張する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "入力を等価に書き換えた複数の版で推論し答えを集約する「推論時の対称化」について、同じプロンプトからの反復サンプリングでは代替できないことと、必要な書き換えの数が対数でしか増えないことを示した（抄録）。未査読。", "p3": "グラフの頂点の番号付けやプログラムの変数名のように答えに関係しない書き換えの群Gを考え、書き換えた入力への前向き計算の答えを群で集約する。単一の表現からのサンプリングでは書き換えを代替できず、O(log |G|)個のランダムな書き換えで全書き換えの情報を回復できることを証明した（抄録）。", "p5": "Qwen2.5-7B・Phi-4-mini・Llama-3.1-8B・Qwen2.5-14Bでグラフ推論・論理推論・多肢選択を解かせると、答えが書き方に依存する場合、同じ計算量なら書き換えに使う方が反復サンプリングよりかなり正確だった（抄録）。", "fun": "同じ問題でも、聞き方を少し変えるとAIの答えが変わることがある。そこで、意味を変えずに言い換えた問題を何通りも解かせて多数決をとる。同じ聞き方で何回も聞き直すより聞き方を変える方が効果的で、しかも言い換えの数は少しで足りると数学的に示した点が面白い。", "unverified": "本文は入手できず、正答率の具体的な数値は確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "表形式の基盤モデルのスケーリング則を検証", "title": "Towards Reliable Scaling Laws for Tabular Foundation Models", "url": "https://arxiv.org/abs/2611.24214", "authors": "Johannes Hog ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "合成データで事前学習し実データで評価する表形式の基盤モデルでは、通常のスケーリング則がそのまま成り立つとは限らない。計算資源の配分の指針として信頼できるスケーリング則が得られるかを調べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "合成データで事前学習し実データで評価する表形式の基盤モデル（TabPFNv2型）について、スケーリング則が大きな計算予算へ外挿でき、評価の設定を越えて一般化するかを調べた（抄録）。未査読。", "p3": "合成データと実データでのスケーリングの振る舞いを比べ、当てはまりの良さと未知のデータセットでの処方の信頼性の関係、評価データセットの数、事前学習の合成データの大きさの範囲を、公開の学習パイプラインnanoTabPFNで検討した（抄録）。", "p5": "合成と実データでスケーリングの振る舞いが異なり、当てはまりの良いスケーリング則が未知のデータで信頼できる処方を与えるとは限らなかった。少ない評価データセットで設定を選ぶと性能を系統的に楽観視した。計算最適なスケーリングには、合成データの大きさの範囲もモデルとともに広げる必要があった（抄録）。", "fun": "AIを大きくすればどれだけ賢くなるかを予測する「スケーリング則」は、どこに計算資源を使うかの道しるべだ。でも表データ用のAIは作り物のデータで練習して本物のデータで試験を受けるので、練習での伸びが本番に当てはまるとは限らない。少ない試験問題で良し悪しを決めると見積もりが甘くなるという注意も、身近な教訓として面白い。", "unverified": "本文は入手できず、具体的なスケーリング則の係数と評価の数値は確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "勾配ノイズ尺度の初の公開データセット", "title": "OpenGNS: An Open Dataset of the Gradient Noise Scale across Vision, Language, and Diffusion Models", "url": "https://arxiv.org/abs/2611.24331", "authors": "Marcel Aach ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "SGDの勾配の信号対雑音比で、臨界バッチサイズの近似に使える勾配ノイズ尺度（GNS）を、画像・言語・拡散モデルの現代的な構造にわたって測った初の公開データセットを提供する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "SGDの勾配の信号対雑音比を表す勾配ノイズ尺度（GNS）について、画像・言語・拡散モデルにわたる初の公開データセットOpenGNSを作り、その性質を調べた（抄録）。未査読。", "p3": "ResNetによる画像分類、GPTによる自己回帰の言語モデル、DiTによる画像生成の3領域で、11Mから1Bパラメータのモデルを最大更新パラメータ化（muP）で学習し、バッチサイズと学習率を細かく振って400以上のGNSの軌跡を測った（抄録）。", "p5": "GNSは学習の一貫した「温度」のように振る舞い、muPの下で同じ損失ならモデルの大きさによらず安定していた。臨界バッチサイズとの関係には課題による偏りがあり、分類では過大に、生成の課題では過小に見積もる傾向があった（抄録）。", "fun": "AIの学習では、一度に何問ずつ解かせるか（バッチの大きさ）で効率が大きく変わる。勾配ノイズ尺度は、その最適な大きさの目安になる「学習の温度計」のようなものだ。大企業の報告には出てくるのに、比べられる形のデータは公開されていなかった。その温度計の読みを400以上集めて公開した点が面白い。", "unverified": "本文は入手できず、各領域の具体的なGNSの値は確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "LLMの推論の記述と内部計算の関係を追う", "title": "Tracking Representations in LLM Reasoning Traces for Iterated Games", "url": "https://arxiv.org/abs/2611.23403", "authors": "Chaipat Tirapongprasert ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "不完全情報の反復ゲームで意思決定するLLMエージェントについて、書き出された思考の連鎖と内部表現の関係を追跡し、推論の記述がモデルの実際の計算をどれだけ反映するかを調べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "不完全情報の反復ゲームで意思決定するLLMエージェントについて、書き出された思考の連鎖（CoT）と内部の計算の関係を、機械論的解釈可能性の手法で調べた（抄録）。未査読。", "p3": "一連の機械論的解釈可能性の手法で、思考の連鎖の進行に沿ったゲームの内部表現の形成と修正を、推論の記述と層の活性の両方から追跡した（抄録）。", "p5": "モデルは思考の連鎖の間にゲームの内部表現を作って繰り返し修正していた。いったん誤った信念に早まって確定すると回復はまれで、この失敗は推論の記述と層の活性の両方に現れた（抄録）。", "fun": "AIが「考えています」と書き出す文章は、本当に頭の中でしていることを表しているのか。この研究はAIの内部をのぞき、ゲームの状況についての「思い込み」を途中で作り直しながら考えている様子を見つけた。そして一度間違って思い込むと、なかなか立ち直れない。人の失敗の仕方とよく似ている点が面白い。", "unverified": "本文は入手できず、使ったモデルとゲームの種類、失敗の頻度は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "LLMが作る子ども向け物語の性別の固定観念", "title": "Once Upon a Bias: Gender Stereotyping in LLM-Generated Children's Stories", "url": "https://arxiv.org/abs/2611.24156", "authors": "Sayumi Muthukumarana ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "why": "娘向けと息子向けで条件をそろえた大規模な実験でLLMに寝る前の物語を作らせ、受け手の性別によって登場人物の描き方が固定観念に沿って変わるかを調べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMが作る寝る前の物語で、受け手が娘か息子かによって描き方が性別の固定観念に沿って変わるかを大規模に調べた（抄録）。未査読。", "p3": "娘向けと息子向けの対になったプロンプトと5回の生成で、16のLLM・35の国の設定・12の語り手の役割から62,873話を分析した。文脈で調整した語彙の比率の対比、固定観念との相対的な一致、語り手と受け手の相互作用、人による評価、内部表現への介入を組み合わせた（抄録）。", "p5": "息子向けの物語は娘向けより主体性が高く共同性が低い描き方に系統的に偏った。語り手の性別による調整は限られたが社交性の高さは強い交互作用を示し、隠れ層から受け手の性別の情報を読み取れた（抄録）。", "fun": "AIに「娘に聞かせるお話」と「息子に聞かせるお話」を頼むと、どう違うのか。62,873話を調べると、男の子向けには自分で切り開く主人公、女の子向けには人とのつながりを大切にする主人公が多く描かれていた。気づかないうちに古い役割分担を子どもに伝えてしまうおそれを、数字で示した点が面白い。", "unverified": "本文は入手できず、偏りの大きさの数値と人による評価の詳細は確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "耐震基準の執行と学習が地震被害を分けた", "title": "From Seismic Codes to Disaster Outcomes: Institutional Learning, Enforcement, and Casualty Patterns in Türkiye and Japan", "url": "https://doi.org/10.21203/rs.3.rs-10901888/v1", "authors": "Mustafa DALLI ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "why": "同程度の規模の地震でも死者数が大きく異なる理由を、トルコと日本の耐震規制・執行・耐震改修政策・災害後の制度的学習の違いから比較し、基準が存在するだけでは被害を説明できないことを示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "同程度の規模の地震でも死者数が大きく異なる理由を、トルコと日本の耐震規制・執行・耐震改修政策・災害後の制度的学習の違いから比較し、基準が存在するだけでは被害を説明できないことを示した（抄録）。未査読。", "p3": "構造化された焦点比較の事例設計で、1923〜2024年の12の地震を法令・公式の事後報告・査読論文から追跡し、被害の教訓を基準・検査・耐震改修・土地利用・政策の対応に結びつける枠組みを作った。新築への対策と既存の建物に届く対策を区別した（抄録）。", "p5": "両国の違いは現行の耐震規定の技術水準より、執行の一貫性と、災害後の学習を既存の建物への介入に移せる程度にあった。2023年のカフラマンマラシュ地震と2024年の能登半島地震は、古い建物が評価・改修の仕組みの外に残ると、進んだ基準の下でも大きな脆弱性が残ることを示した（抄録）。", "fun": "地震に強い建物の決まり（耐震基準）があっても、守られなければ意味がない。そして新しい決まりは新しい建物にしか効かず、古い建物は取り残されやすい。1923年から2024年までのトルコと日本の地震を比べたこの研究は、能登半島地震も例に挙げ、決まりを作ることより古い家まで届けることの難しさを示した点が考えさせられる。", "unverified": "本文は入手できず、12の地震の一覧と事例ごとの比較の詳細は確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "地盤の軟化で同調質量ダンパの調整がずれる", "title": "Hysteretic foundation softening and the tuning of tuned mass dampers in frames on soil: is adaptive retuning worth it?", "url": "https://doi.org/10.21203/rs.3.rs-11336344/v1", "authors": "Seyyed Mostafa Razavi ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "why": "強い揺れで地盤と基礎の境界が履歴的に軟化して骨組の周期が伸びると、屋上の同調質量ダンパ（TMD）の同調がずれる。そのずれの大きさと、適応的な再同調が複雑さに見合うかを定量化する。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "強い揺れで地盤と基礎の境界が履歴的に軟化して骨組の周期が伸びると、屋上の同調質量ダンパ（TMD）の同調がどれだけずれ、適応的な再同調が複雑さに見合うかを定量化した（抄録）。未査読。", "p3": "7層と11層のせん断型骨組を、2種類の地盤のBouc–Wen型の水平・回転の基礎マクロ要素に載せ、0.2 gと0.5 gに調整した確率的なKanai–Tajimi地震動を入力した。質量比2%の5つのTMDの設計（固定基礎の振動数、小ひずみの地盤-構造の振動数、最適化、推定振動数による適応型、真の振動数による適応型）を比べた（抄録）。", "p5": "系の振動数は3〜32%低下し、基準のケースでは小ひずみの振動数に合わせたTMDが記録の64%の時間で10%以上ずれた。それでも地盤-構造の振動数に合わせると屋上の最大変位の低減が平均7.2ポイント増え、適応的な再同調による変化は推定振動数で−1.3、真の振動数で+0.1ポイントにとどまった（抄録）。", "fun": "高いビルの屋上には、ビルと逆向きに揺れて揺れを打ち消す重り（同調質量ダンパ）を置くことがある。重りはビルの揺れのテンポに合わせてあるが、大地震では地盤が柔らかくなってテンポが変わってしまう。揺れながら自動で合わせ直せばよさそうだが、最初から地盤の柔らかさを考えて合わせておけば十分だったという結果が面白い。", "unverified": "本文は入手できず、地盤の2分類の内容は確認できなかった（著者は結論が合成地震動と2つの骨組に限られるとしている）。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "非平面断層でリッジクレスト地震の高周波を再現", "title": "High-Frequency Ground-Motion Simulation of the 2019 Ridgecrest Earthquake Using a k-2 Kinematic Source Model on a 3-D Non-Planar Fault and Empirical Green's Functions", "url": "https://doi.org/10.21203/rs.3.rs-11635760/v1", "authors": "Arpit Kumar Maurya ほか", "venue": "Research Square (In Review)", "date": "2026-11-19", "why": "2019年のリッジクレスト地震の1〜15 Hzの地震動を、非平面の3次元断層上の確率的なk-2運動学的震源と経験的グリーン関数で計算し、近地の高周波の地震動の再現に必要な震源の複雑さを検討する。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "2019年のリッジクレスト地震（Mw 7.1）の1〜15 Hzの地震動を、非平面の3次元断層上の確率的なk-2運動学的震源と経験的グリーン関数（EGF）で再現した（抄録）。未査読。", "p3": "硬岩・軟岩・沖積層にわたる4つの観測点のそれぞれで震源を20通り生成し、放射特性を補正したEGFと組み合わせて計算した最大加速度（RotD50 PGA）を、BSSA14・CB14・CY14の地震動予測式と比べた（抄録）。", "p5": "硬岩の観測点CLCではPGAが予測式の中央値の約1.4倍以内に入り、破壊の南端に近い軟岩のCCCでは1.5〜1.7倍だった。硬岩の観測点ではEGFの選び方の影響が大きく、組内の残差の標準偏差（多くのケースで0.30〜0.56）は予測式と同程度以下だった。盆地の観測点には非線形の地盤応答の解析が必要とした（抄録）。", "fun": "大地震の揺れを計算で再現するとき、断層が平らでなく曲がっていることや、地面の硬さの違いが効いてくる。この研究は、小さな地震の記録を「部品」として組み合わせ、大地震の細かい揺れを作り出した。どの小地震を部品に選ぶかで結果が変わるという、計算の「材料選び」の大切さが見えた点が面白い。", "unverified": "本文は入手できず、震源モデルの詳細なパラメータは確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "工学", "headline": "溶接部の結晶粒径でパリス則は予測できない", "title": "Can Weld-Zone Grain Size Predict Paris-Law Parameters? An Evidence-Constrained Reanalysis of Fatigue Crack Growth in Three Steel Weld Systems", "url": "https://doi.org/10.2139/ssrn.7710559", "authors": "Rabia AlAllawi", "venue": "SSRN", "date": "2026-11-19", "why": "溶接部の疲労き裂進展の違いを結晶粒径で説明する通説を、3つの鋼溶接系の公開実験データの再監査で検証し、パリス則の係数には相構成・残留応力・き裂閉口・応力比なども効くことを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "溶接部の疲労き裂進展の違いを結晶粒径で説明する通説を、3つの鋼溶接系の公開実験データの再監査で検証し、パリス則の係数には粒径以外の要因も強く効くことを示した（抄録）。未査読。", "p3": "2.25Cr1Mo0.25V、Q370qENH、D32の鋼の溶接の3つの公開実験データを再監査し、直接報告されたデータで粒径だけによる当てはめを調べ、パリス則の係数Cとmの結びつきと凝集エネルギーの単位の整合を確かめた（抄録）。", "p5": "2.25Cr継手では粒径だけの当てはめは弱く（log Cで決定係数0.288、mで0.247）、Q370qENHではCとmがほぼ完全に連動していた（相関−0.998）。破壊靱性から導くエネルギーを誤った単位で報告すると10の3乗倍の単位の誤りが生じうることも示した（抄録）。", "fun": "金属を溶接した部分は、細かい粒の集まり方が場所ごとに違い、ひびの伸び方も違う。その違いを「粒の大きさ」だけで説明するのは分かりやすいが、本当にそうか。公開データを見直すと粒の大きさだけではよく説明できず、単位の取り違えで千倍の誤りが起きる危険まで見つかった。データの再点検の大切さが分かる点が面白い。", "unverified": "本文は入手できず、提案した証拠の階層の詳細は確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "選挙での政治的損失を株価はどう織り込むか", "title": "Pricing a Political bet: Tesla, SpaceX and the 2026 US Midterms", "url": "https://doi.org/10.2139/ssrn.7702961", "authors": "Ricardo Buscariolli", "venue": "SSRN", "date": "2026-11-18", "why": "2026年米中間選挙で多額の資金を投じた支配株主の候補の敗北がベッティング市場で織り込まれた後、関連企業の株価がその政治的損失をどれだけ速く反映したかを測る。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "支配株主の政治的な損失を株価がどれだけ速く織り込むかを、2026年の米中間選挙でのマスク氏の支援候補の敗北を例に、分単位のデータで測った（抄録）。未査読。", "p3": "Polymarketの分単位の価格と、テスラ・SpaceX・Nasdaq-100の24時間取引の無期限先物の価格を使い、選挙当夜の時間帯ごとの異常リターンを調べた。マスク氏は中間選挙に約4.74億ドル（うちテキサスに2.24億ドル）を投じていた（抄録）。", "p5": "ニューヨーク時間21時までに民主党候補の勝利の確率は90%を超えたが、テスラとSpaceXは水曜の終値までに市場に対して3.6%と5.1%（合計約1,500億ドル）の価値を失い、夜間の下落の3分の2〜4分の3は結果が判明した後に生じた。夜間も流動性は十分で、取引の摩擦では遅れを説明できなかった（抄録）。", "fun": "選挙で応援した候補が負けると、その人が率いる会社の株価はどうなるか。開票の夜、賭けの市場では勝敗が早々に決まっていたのに、株価が下がりきったのは何時間も後だった。誰が勝ったかはすぐ分かっても、それが会社にとって何を意味するかを市場が飲み込むには時間がかかるという点が面白い。", "unverified": "本文は入手できず、異常リターンの推定方法の詳細は確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "政治学", "headline": "移民取締りの地域差を州の協力政策が説明", "title": "State cooperation policies and local political geography explain spatial patterns in U.S. immigration enforcement, 2023-2026", "url": "https://doi.org/10.31235/osf.io/gp4yk", "authors": "Asad L. Asad ほか", "venue": "SocArXiv", "date": "2026-11-19", "why": "米国の郡ごとの移民取締り（拘置中の逮捕と地域社会での逮捕）の空間的な違いを、州の協力政策と地域の政治地理から説明し、政権による変化を調べる。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の郡ごとの移民取締り（拘置中の逮捕と地域社会での逮捕）の空間的な違いを、州の協力政策と地域の政治地理という2つの説明から検証した（抄録）。未査読。", "p3": "2023年末から2026年8月までの移民逮捕のデータで、第2次トランプ政権とバイデン政権の郡ごとの逮捕の型を比べた（抄録）。", "p5": "逮捕は州の協力政策にかかわらず多くの郡で増えたが、州が協力を義務づける郡で特に増えた。拘置中の逮捕は2024年選挙でトランプ氏の得票が多い郡で増え、地域社会での逮捕は協力義務の州かつトランプ氏の得票の多い郡で増えた一方、その急増はハリス氏の得票が多い郡で起きやすかった（抄録）。", "fun": "同じ国の同じ法律の下でも、移民の取締りが厳しい地域とそうでない地域がある。州のルールだけでなく、その地域の住民がどの政党を支持しているかも関係していた。法律が同じでも、地域の政治の色によって取締りの実際が変わるという、政治と行政の結びつきが見える点が面白い。", "unverified": "本文は入手できず、分析モデルと効果の大きさの数値は確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "政治学", "headline": "政治的委任で例外的な政策体制が生じる条件", "title": "Unified vs. Classified Policy Regimes in Political Delegation", "url": "https://doi.org/10.2139/ssrn.7703981", "authors": "Jidong Chen ほか", "venue": "SSRN", "date": "2026-11-18", "why": "立法府が官僚の裁量の構造を設計する空間モデルで、情報取得を含めて、単一の区間委任と複数の政策体制のどちらが生じるかの条件と含意を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "立法府が官僚の裁量の構造を設計する空間モデルで、単一の裁量区間の委任と、例外を含む複数の政策体制のどちらが生じるかの条件と含意を示した（抄録）。未査読。", "p3": "委任者（立法府など）が先に裁量の構造を設計し、代理人（官僚など）が情報を取得するかどうかと政策を選ぶ、情報取得を含む空間モデルを分析した（抄録）。", "p5": "単一の裁量区間が最適な場合、情報取得の費用が高いほど専門性を引き出すのに必要な追加の裁量が政策上の利益をもたらし、機関がかえって得をする逆説がある。課題が複雑になると、機関が好む情報なしの代替案を取り除く分類された政策体制に改めることで、統制を失わずに専門性の獲得を促せる（抄録）。", "fun": "国会が役所に仕事を任せるとき、どこまで自由にさせるかは難しい。自由を与えすぎると勝手をされ、絞りすぎると役所は調べる手間をかけなくなる。調べるのが大変な課題ほど役所がむしろ得をすることがあるという逆説と、例外のルールを設けてそれを解く工夫が面白い。", "unverified": "本文は入手できず、モデルの具体的な仮定と数式は確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "交通・都市計画", "headline": "電動自転車が公共の論点になるとき", "title": "From Private Troubles to Public Issues: E-bike Mobility and Shared Space in Shenzhen", "url": "https://econpapers.repec.org/RePEc:osf:socarx:kzwau_v3", "authors": "ZHANG ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "深センを対象にSNS（RedNote）の405スレッドを分析し、電動自転車の移動が共有された都市空間をめぐる公共の論点になる条件を、移動実践の空間的公共性という概念で示す。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載されたワーキングペーパーの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "深センの電動自転車の移動が、共有された都市空間をめぐる公共の論点になる条件を、SNSの投稿の分析から「移動実践の空間的公共性」という概念で示した（抄録）。未査読。", "p3": "新しい移動の論と社会技術レジーム論に基づき、深センのRedNoteの405スレッド（元の投稿・画像・コメント）を2段階の質的比較分析で分析した（抄録）。", "p5": "元の投稿での社会技術的な根拠づけ（技術的な媒介、空間的な定着、公共の問題としての枠組み、実践者の立場）が空間的公共性の必要条件で、十分条件の組合せは4つあった。公共になるのは止めてある車両に関するものが多く、取締りの負担は市の労働と住宅の地理に不均等にかかっていた（抄録）。", "fun": "歩道に止めてある電動自転車は、いつもは誰も気にしないが、何かが壊れたり撤去されたりした時に急に「みんなの問題」として語られ始める。この研究はSNSの投稿を手がかりに、私的な困りごとが公共の議論に変わる瞬間を捉えた。走っている時より止まっている乗り物こそが都市の問題になるという視点が面白い。", "unverified": "本文は入手できず、4つの条件の組合せの詳しい内容とその頻度は確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "較正不要の2眼カメラで3次元振動変位を計測 0.368, "citescore": 3.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr15", "rank": 15, "headline": "緩傾斜地盤の深い液状化を構成則で解析", "title": "Insights into the response of deep liquefaction beneath mildly sloping ground using advanced constitutive models", "url": "https://doi.org/10.1139/cgj-2026-0073", "authors": "Kota Abe ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-18", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr16", "rank": 16, "headline": "サービスロボットの評価の決め手は国で違う", "title": "Contextual contingencies in robot-enabled service encounters: how innovation attributes shape customer experience evaluations", "url": "https://doi.org/10.1108/jsm-02-2026-0130", "authors": "Min-Hsin Huang ほか", "venue": "Journal of Services Marketing", "date": "2026-11-19", "sjr": 1.536, "citescore": 9.4, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "サービスロボットの革新属性（相対的優位・適合性・観察可能性）が、使いやすさと楽しさを介してロボットによるサービス体験の評価にどう効くかを、台湾とインドの顧客で比べた（抄録）。", "p3": "イノベーション普及理論を主な枠組み、利用と満足の理論を補完として、ロボットのサービスを経験した台湾（n = 415）とインド（n = 510）の顧客の調査に、測定不変性を確認したうえで多母集団の構造方程式モデルを当てはめた（抄録）。", "p5": "使いやすさと楽しさは両国で体験評価と正に関連した。相対的優位はインドで、適合性は台湾でより重要で、観察可能性は両国で有意でなかった。上流の属性の重要さは文脈に依存し、下流の評価の関係は比較的頑健だった（抄録）。", "fun": "店でロボットが料理を運んでくるとき、客が喜ぶポイントは国によって違うのだろうか。インドの客は「人より速く便利か」を、台湾の客は「自分の生活に合うか」を重視していた。一方で、使いやすく楽しいことが満足につながる点は共通だった。同じ機械でも売り込み方は国に合わせるべきだという示唆が面白い。", "unverified": "出版社の本文は入手できず、構造方程式モデルの係数の値は確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "孤立の5領域と心理的苦痛ががん生存に関連", "title": "Impact of Social Isolation and Psychological Distress on Overall Survival in Cancer: A Population-Based Cohort Study", "url": "https://doi.org/10.1200/op-26-00436", "authors": "Danlin Zeng ほか", "venue": "JCO Oncology Practice", "date": "2026-11-18", "sjr": 1.985, "citescore": 6.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "がん患者45,651人の集団コホートで、社会的孤立の5領域と抑うつ・不安が全生存とそれぞれ独立に関連することを示した（抄録）。", "p3": "2011〜2016年にBC Cancerの初診で心理社会的スクリーニング（PSSCAN-R）に回答した患者を対象に、孤立の5領域・抑うつ・不安を導き、年齢・性別・転移の有無を調整した多変量Cox回帰で生存との関連を推定した（抄録）。", "p5": "32.5%が1つ以上の孤立の領域で陽性で、多いのは独居（23.0%）と最近の配偶者の喪失（10.9%）だった。孤立の領域が1つ増えるごとに死亡のハザードが約9%増え、定期的な社会的接触の欠如（HR 1.29）、独居（HR 1.18）、抑うつ（HR 1.43）、不安（HR 1.23）がそれぞれ独立に死亡と関連した（抄録）。", "fun": "一人暮らしや、人と定期的に会わないことが、がん患者の生存に関係していた。しかも、これらは簡単な質問票で見つけられる。病気の治療は薬や手術だけでなく、患者のまわりの人とのつながりにも目を配る必要があることを、45,651人の大規模なデータで示した点が考えさせられる。", "unverified": "出版社の本文は入手できず、がんの種類別の結果と孤立の各領域の定義の詳細は確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "慢性的な孤独はその後の認知症リスクと関連", "title": "Loneliness exposure groups and 20-year dementia risk: a longitudinal population-based study.", "url": "https://doi.org/10.1080/13607863.2026.2733938", "authors": "Simon Y ほか", "venue": "Aging & mental health", "date": "2026-11-17", "sjr": 1.207, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "8年間の反復測定で孤独を「なし・時々・慢性」の3群に分け、その後20年の認知症リスクとの関連を調べ、慢性的な孤独だけがリスクを高めることを示した（抄録）。", "p3": "単一の項目で8年間にわたり孤独を測り、最初の8年間に認知症のなかった高齢者1,540人について、illness-deathモデルでその後20年の認知症のリスクを推定した（抄録）。", "p5": "560人が認知症を発症し、発症率は孤独なしの群の33.1%から慢性の群の49.1%にわたった。慢性的な孤独の群は孤独なしの群より認知症のリスクが有意に高く（調整HR 1.38、95%CI 1.03〜1.86）、時々の孤独は関連しなかった（抄録）。", "fun": "誰でもときどきは寂しくなる。この研究では、ときどき寂しいだけでは認知症の危険は高まらず、何年も続く寂しさだけが関係していた。1回の調査では分からない「寂しさの続き方」を長く追ったからこそ見えた違いだ。人とのつながりを長く保つことが予防につながりうるという点が身近で面白い。", "unverified": "出版社の本文は入手できず、調査の対象国と調整した共変量は確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "言語とペルソナでLLMの感情評価は変わる", "title": "Multilingual Emotion Profiling of Large Language Models Through Literary Texts and Persona Conditioning", "url": "https://doi.org/10.20965/jaciii.2026.p1866", "authors": "Naruki Shirahama ほか", "venue": "Journal of Advanced Computational Intelligence and Intelligent Informatics", "date": "2026-11-19", "sjr": 0.231, "citescore": 1.9, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "6つのLLMに文学作品の感情を評価させ、言語（日本語・英語・繁体字中国語）とペルソナの条件が評価を実質的に変えるかを、事前登録の分析で調べた（抄録）。国内誌の論文。", "p3": "OpenRouterを共通の推論層として、6モデル×3言語×3作品×4ペルソナ×3回の648評価を計画し、各回答に面白さ・驚き・悲しみ・怒りの4次元の評点と短い理由を出させ、HC3頑健標準誤差による事前登録の最小二乗法で分析した（抄録）。", "p5": "作品の内容が評点の主な要因（特に悲しみと怒り）だった一方、モデルと言語の交互作用は4つの感情すべてで有意だった。英語は面白さ・驚き・悲しみの平均が最も高く、日本語は怒りの平均が最も高かったが、集計の傾向はモデルごとの強い違いを隠していた（抄録）。", "fun": "同じ小説でも、日本語で読むか英語で読むかで感じ方が変わることがある。AIでも同じことが起きるのか。調べると、言語によって感情の評価が変わり、その変わり方はAIの種類ごとにばらばらだった。AIに文章の感想を聞くとき、どの言語で聞くかも結果を左右する「実験の条件」になるという点が面白い。", "unverified": "出版社の本文は入手できず、モデル名とペルソナの内容、言語ごとの評点の数値は確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "温度依存のダンパで確率的な風応答を制御", "title": "Stochastic response control of wind-disturbed transmission tower-line systems by viscoelastic dampers considering temperature effect", "url": "https://doi.org/10.1142/s0219455428501027", "authors": "Mingjing Chang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-19", "sjr": 0.703, "citescore": 6.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "送電鉄塔-架線系に温度依存の粘弾性ダンパを付けたときの確率的な風応答を解析する方法を作り、ダンパの最適な位置と温度の影響を示した（抄録）。", "p3": "ラグランジュ方程式による集中質量モデル、温度依存の一般化マクスウェル模型によるダンパのモデル、非比例減衰の系の確率的な解析の枠組みを組み合わせ、極値応答を初通過の基準で評価した。中国の実際の送電鉄塔-架線系を事例とした（抄録）。", "p5": "粘弾性ダンパは確率的な風応答を大きく減らした。制御の性能は粘弾性材料の温度依存性に支配され、平衡剛性と緩和時間にも影響された（抄録）。低減の具体的な数値は抄録にない。", "fun": "送電線の鉄塔は風で揺れ続け、少しずつ傷んでいく。揺れを吸収するゴムのような部品（粘弾性ダンパ）は安くて便利だが、その効き目は気温で変わる。寒い日と暑い日で効き方が違う部品を、でたらめに吹く風に対してどう配置するかを計算で示した点が面白い。", "unverified": "出版社の本文は入手できず、応答の低減率と最適位置の具体的な結果は確認できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "スマートシティ試行は都市のレジリエンスを高める", "title": "Smart City Pilots Promote Urban Resilience and Security: A Quasi-Natural Experiment from China", "url": "https://doi.org/10.1061/jupddm.upeng-6375", "authors": "Chang Su ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-19", "sjr": 0.536, "citescore": 3.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "中国の2012年のスマートシティ試行政策を準自然実験として、試行政策が都市のレジリエンスと安全を高めることを多期間の差の差法で示した（抄録）。", "p3": "272の地級市の2001〜2021年のパネルデータで多期間の差の差法を用い、産業構造の高度化・技術の進歩・デジタル基盤の強化という経路と、都市の種類による異質性、空間的な波及を調べた（抄録）。", "p5": "試行政策は都市のレジリエンスと安全を有意に高め、反実仮想と複数の頑健性の検定でも結果は保たれた。効果は省都・経済規模の大きい都市・東部で大きく、周辺の都市への正の空間的な波及もあった（抄録）。", "fun": "街中にセンサーやデータの仕組みを入れる「スマートシティ」は、災害や危機に強い街を作るのか。中国の試行政策を、始めた街と始めていない街の変化の差で比べると効果があり、近くの街にまで良い影響が広がっていた。ただし大きな街ほど効果が大きいという差も見えた点が面白い。", "unverified": "出版社の本文は入手できず、レジリエンスの指標の作り方と効果の大きさの数値は確認できなかった。"}}, {"id": "jr22", "rank": 22, "headline": "入力を追跡できる橋梁の地震損失評価", "title": "Fragility and loss assessment of a multi-span highway bridge with traceable inputs and verified computation", "url": "https://doi.org/10.1177/13694332261507477", "authors": "Jila Pashaei Marani ほか", "venue": "Advances in Structural Engineering", "date": "2026-11-17", "sjr": 0.643, "citescore": 5.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "4径間のRC道路橋のフラジリティと地震損失を、出典を追える入力と独立に検算した計算で評価し、橋梁の地震損失評価を追跡可能な形で示した（抄録）。", "p3": "柱の損傷指標はOpenSeesのファイバー断面が既に課すひずみ限界に基づき、11の記録地震動による88の非線形解析に最尤法でフラジリティを当てはめ、収束しなかった解析も残して未観測の結果の不確実性を極端な割当で調べた（抄録）。", "p5": "周期0.631秒での中央値は鉄筋の初降伏で0.352 g、かぶりの剥落で0.719 gだった。価格を付けた性能群の期待年損失は3地点で625〜2846米ドル（4.6倍の差）で、割引率を0.5%にすると50年の現在価値は規定の3.1%のときの1.75倍になった（抄録）。", "fun": "橋が地震でどれくらい壊れ、修理にいくらかかるかの計算は、どの数字を使ったかを読者がたどれないことが多い。この研究は、すべての入力に出典を付け、計算を別の方法で確かめた。お金の価値を将来に換算する割合を少し変えるだけで、損失の見積もりが大きく変わることも示した点が面白い。", "unverified": "出版社の本文は入手できず、付録Bの感度分析の結果は確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "医師のAI利用の開示が患者の信頼を左右", "title": "Physician AI disclosure, condition severity, and public trust in digital medicine", "url": "https://doi.org/10.1038/s41746-026-03484-7", "authors": "Yifan Yang ほか", "venue": "npj Digital Medicine", "date": "2026-11-19", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "医師のAI利用の開示（事務・診断・治療）と疾患の重さが、患者の医師への評価と受診意向にどう影響するかを、中国の要因実験で示した（抄録）。", "p3": "中国本土の成人1,574人を、AI利用の種類と疾患の重さが異なる医師のプロフィールに無作為に割り当てる5×2の要因実験を行い、探索的な媒介分析とマカオの対面の補足標本（n = 128）で確かめた（抄録）。", "p5": "事務のAIは診断・治療のAIより医師の評価と受診意向で好意的に評価された。重い疾患では治療のAIへの否定的な反応が強まり、AIを使わないという明示の開示が予約の意向を高めた。能力・信頼・共感が反応の違いを説明した（抄録）。", "fun": "お医者さんが「AIを使っています」と言ったら、患者はどう感じるか。予約や書類の整理に使うなら気にしないが、診断や治療に使うとなると警戒し、病気が重いほどその傾向が強まった。AIの利用を隠すのでも一律に伝えるのでもなく、何に使うかで伝え方を変える必要があるという点が面白い。", "unverified": "出版社の本文は入手できず、効果の大きさと媒介分析の数値は確認できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "障害児を支えるケアのネットワークを追跡", "title": "Caregiving networks and children with neurologic impairment: A multicenter social network analysis protocol", "url": "https://doi.org/10.1002/jhm.70549", "authors": "Ryan J. Coller ほか", "venue": "Journal of Hospital Medicine", "date": "2026-11-19", "sjr": 0.904, "citescore": 2.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "神経障害のある子どもを支える有償・無償の担い手の集まり（ケアリング・ネットワーク）の特徴が、重い健康事象と生活の質に関連するかを追う多施設の前向きコホート研究（THRIvE）の計画を示した（抄録）。", "p3": "過去12か月に入院か救急受診のあった2〜16歳の神経障害のある子どもと主・副の介護者を5つの大学病院で登録し、主介護者への自己中心ネットワーク分析（副介護者の調査で検証）でネットワークの密度・中心化・三者閉包・大きさ・構成を測る（抄録）。", "p5": "主な結果は12か月時点の重い健康事象（死亡・入院）と子どもの生活の質で、施設のクラスタリング・交絡・多重比較を考えた混合効果回帰で分析する計画である（抄録）。研究計画のため結果はまだない。", "fun": "障害のある子どもの世話は、親だけでなく、祖父母、近所の人、ヘルパーなど多くの人で支えられていることがある。その「支え手のつながり方」が子どもの健康に関係するのではないか、という問いを本格的に調べる計画だ。家族を1人の介護者でなくチームとして見る視点が面白い。", "unverified": "研究計画の段階で結果はなく、目標の登録者数は抄録から確認できなかった。"}}, {"id": "jr25", "rank": 25, "headline": "高齢化とエネルギー貧困をデジタルと社会資本が緩和", "title": "Demographic ageing and household energy poverty in China: the moderating roles of digital access and social capital", "url": "https://doi.org/10.3389/fpubh.2026.1889899", "authors": "Qianwen Sun ほか", "venue": "Frontiers in Public Health", "date": "2026-11-18", "sjr": 1.103, "citescore": 6.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "中国家計パネル調査（CFPS 2022）で、世帯の高齢化がエネルギー貧困と正に関連し、デジタル接続と社会関係資本がその関連を弱めることを示した（抄録）。", "p3": "ロジットモデルで世帯の高齢化とエネルギー貧困の関連を推定し、デジタル接続と社会関係資本の調整効果を検定し、世帯の種類ごとの異質性を分析した。傾向スコアマッチングなどで頑健性も確かめた（抄録）。", "p5": "高齢化が10ポイント上がるとエネルギー貧困に陥る予測確率が約1.27ポイント上がった。デジタル接続と社会関係資本はこの正の関連を弱め、関連は低所得・小規模・低学歴・農村の世帯で強かった（抄録）。", "fun": "お年寄りのいる家庭ほど、電気やガスの費用に困りやすい。ところが、インターネットにつながっていたり、頼れる人間関係があったりすると、その困りやすさが和らいでいた。暖房や電気といった生活の基盤の問題にも、人とのつながりや情報へのアクセスが効いてくるという点が面白い。", "unverified": "出版社の本文は入手できず、エネルギー貧困の定義と調整効果の大きさの数値は確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "薬局のサービス品質が満足と再来意向に効く", "title": "Development and validation of an integrated community pharmacy service performance model: Implications for client satisfaction and revisit intentions", "url": "https://doi.org/10.1016/j.rcsop.2026.100876", "authors": "Theophilus Ehidiamen Oamen ほか", "venue": "Exploratory Research in Clinical and Social Pharmacy", "date": "2026-11-15", "sjr": 0.649, "citescore": 3.6, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "ナイジェリアの地域薬局の顧客367人で、サービス品質尺度SERVPERFの構造を検証し、統合された「顧客関係」の次元が満足と再来意向に効くことを示した（抄録）。", "p3": "便宜抽出によるオンライン調査で、確認的因子分析で尺度の妥当性を確かめ、構造方程式モデルで満足と再来意向への関係を調べた（抄録）。", "p5": "応答性・信頼性・共感が統合された顧客関係と、有形性・確実性からなる3因子の構造がよく適合した（CFI 0.980、RMSEA 0.066）。顧客関係は満足（β = 0.305）と再来意向（β = 0.270）に直接効き、有形性と確実性は効かなかった。満足は顧客関係と再来意向の関係を部分的に媒介した（抄録）。", "fun": "薬局の良し悪しを測る物差しは、もともと「応答の速さ」「確実さ」「思いやり」など5つに分かれていた。ところがこの国の客にとっては、そのうち3つが「店の人との関係」という1つのまとまりとして感じられていた。サービスの評価の分かれ方そのものが、地域や業種によって変わりうる点が面白い。", "unverified": "出版社の本文は入手できず、調査の時期と回答者の属性は確認できなかった。"}}, {"id": "jr27", "rank": 27, "headline": "住区の開放性が高齢者の交流を左右する", "title": "Planning for Social Interaction in Aging Communities: A Machine Learning and Configurational Approach of Residential Area Openness", "url": "https://doi.org/10.1061/jupddm.upeng-6697", "authors": "Yang Mi ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-19", "sjr": 0.536, "citescore": 3.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "大連の住区の開放性を5つの空間指標で捉え、高齢者の社会的交流に効く計画の条件を、機械学習と構成的な比較分析で示した（抄録）。", "p3": "k-means法で建築環境を6つの開放性の類型に分け、ランダムフォレストで変数の重要度を、ファジー集合の質的比較分析で高い交流に至る条件の組合せの経路を調べた（抄録）。", "p5": "暮らしやすい街路の密度、出入口の密度、袋小路の割合、活動空間への近さ、施設の多様さの5指標が最も影響し、交流との関係は非線形だった。暮らしやすい街路の密度はほぼすべての類型で最も強い正の効果を示した（抄録）。", "fun": "団地を塀で囲むか、通り抜けできるようにするかで、お年寄りが近所の人と話す機会は変わるのか。この研究は、歩きやすい道の多さがどんな住区でも一番効いていたことを示した。ただし効き方は直線的でなく、単純に「開けば開くほど良い」とは限らない点が面白い。", "unverified": "出版社の本文は入手できず、調査の対象者数と交流の測り方は確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "橋梁点検の知能化とデジタル化を総説", "title": "From defect recognition to maintenance decision-making: A review of intelligent bridge inspection technologies and their digital evolution", "url": "https://doi.org/10.1177/13694332261507475", "authors": "Yaohui Zhang ほか", "venue": "Advances in Structural Engineering", "date": "2026-11-17", "sjr": 0.643, "citescore": 5.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "橋梁の損傷点検の知能化技術を、センシングの基盤・認識アルゴリズム・融合と位置特定・意思決定支援の4つの視点から体系的に整理した総説（抄録）。", "p3": "UAVとロボットによる点検、深層学習による損傷の認識、マルチモーダルなデータの融合、デジタルツイン、知識グラフによる橋梁管理の進展を、相互につながる4つの視点で統合した（抄録）。", "p5": "データセットの断片化、場面をまたぐ一般化の不足、点検結果と構造性能の評価の結びつきの弱さ、維持管理の知識の閉じたループの不完全さを、残る課題として挙げた（抄録）。", "fun": "橋の点検は、人が近づいてひび割れを目で探す作業から、ドローンやロボットが撮った画像をAIが見る方向へ変わりつつある。ただ、ひび割れを見つけることと、その橋がまだ安全かを判断することの間には大きな溝がある。見つけるから決めるまでをつなぐという、点検の次の課題を整理した点が面白い。", "unverified": "出版社の本文は入手できず、取り上げた文献の数と各手法の比較の詳細は確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "結氷期と将来気候での橋脚の洗掘を評価", "title": "Bridge Pier Scour Characteristics and Hydrodynamic Loads in Current and Future Climates for Ice-Free and Ice-Covered Periods: A Case Study of Alexandra Bridge", "url": "https://doi.org/10.3390/infrastructures11110430", "authors": "Boyuan Yu ほか", "venue": "Infrastructures", "date": "2026-11-19", "sjr": 0.671, "citescore": 5.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "カナダ・オタワ川のアレクサンドラ橋を対象に、河川規模の水理・氷のシミュレーションと局所洗掘の大規模渦シミュレーション（LES）をつなぎ、現在と将来の気候で結氷期を含む橋脚の洗掘を評価した（抄録）。", "p3": "橋のある152 kmの区間で、地域気候モデル（SSP5-8.5）の流量などを使って現在（1991〜2020年）と将来（2071〜2100年）の水理・熱の連成計算を行い、75年再現期間の流量と氷の厚さで橋脚まわりのLESを駆動した（抄録）。", "p5": "結氷のない期間では75年再現の流量が7.05%減り、最大洗掘深はわずかに減った。結氷期は流量の4.14%減と氷の厚さの48.2%減が重なり、洗掘深は滑らかな氷で約4.96%、粗い氷で5.13%減った（抄録）。", "fun": "川の中に立つ橋の脚は、流れが周りの砂を削る「洗掘」で弱くなる。寒い地域では川が凍り、氷の下の流れが削り方を変える。温暖化で氷が薄くなると洗掘はどうなるかを計算すると、この橋ではむしろ少し減る見込みだった。気候の変化が橋に与える影響は、単純に「悪くなる」とは限らない点が面白い。", "unverified": "出版社の本文は入手できず、LESの検証に使った観測データの詳細は確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "センサ対の応答関係の場で振動SHMを行う", "title": "A frequency-diverse sensor-pair response-relation field for vibration-based structural health monitoring", "url": "https://doi.org/10.1016/j.ymssp.2026.115234", "authors": "Jin Niu", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-19", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、題名検索で見つけた同じ論文の別の記録（SSRN）の抄録を使用", "preprint": false, "short": true, "p1": "振動ベースのSHMで、センサ対ごとの局所的な周波数帯での応答関係を索引つきの「場」として作り、損傷ラベルなしで異常の検出と解釈を行う一クラス教師なしの枠組みPLD-RBIRを提案した（抄録）。", "p3": "センサ対ごとに決定論的な基数逆数による層化で局所の周波数帯を事前に割り当て、各帯で2つのセンサの帯域エネルギーの対数比（RBIR）を計算する。正常時のデータで尺度・頑健な較正・Ledoit–Wolfの共分散による新規性スコアを定め、同じずれをセンサ単位の関連の地図とセンサ対・帯のずれの場に集約する（抄録）。", "p5": "QUGS（観客席のシミュレータ）とLUMO（監視用の試験構造）のベンチマークで、試した手順の下で一貫した順位の分離と解釈しやすいずれのパターンを示した。スペクトルのピーク・全帯域・固定参照などの対照も、応答関係の表現を支持した（抄録）。", "fun": "建物の揺れを複数のセンサで測るとき、1つの数字で「いつもと違う」と知らせるだけでは、どこがどう変わったのか分からない。この方法は、2つのセンサの揺れの強さの比を周波数ごとに並べた「地図」を作る。損傷のデータがなくても、普段の地図と比べて変化の場所と周波数が見える点が面白い。", "unverified": "出版社の本文は入手できず、検出性能の具体的な数値と損傷のシナリオは確認できなかった。抄録は同じ論文の別の記録から取った。"}}, {"id": "jr31", "rank": 31, "headline": "疎な変位とPINNで斜張橋の損傷位置を推定", "title": "Damage localization of cable-stayed bridge based on extended physics-informed neural network and sparse displacement measurements", "url": "https://doi.org/10.1016/j.ymssp.2026.115246", "authors": "Yi-Fan Li ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-18", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、拡張した物理情報ニューラルネット（PINN）と疎な変位計測を使って、斜張橋の損傷の位置を推定する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、斜張橋のような大きな橋で、少ない場所の変位の計測だけから、物理の法則を組み込んだAIで傷んだ場所を突き止められるか、というものだ。センサーを付けられる場所が限られる実際の橋で、見えない部分の状態をどこまで推し量れるかという問いが面白い。", "unverified": "抄録・本文とも入手できず、手法・対象の橋・結果は確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "PC橋のプレストレスと移動荷重を同時に同定", "title": "Improved Synergic Prestress and Moving Force Identification for Prestressed Concrete Bridges", "url": "https://doi.org/10.34133/adi.0244", "authors": "Jeyamohan Kunaratnam ほか", "venue": "Advanced Devices and Instrumentation", "date": "2026-11-19", "sjr": 1.225, "citescore": 7.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、プレストレストコンクリート橋のプレストレス（導入した緊張力）と移動荷重を協調して同定する手法を改良した研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、橋の中に仕込まれた見えない力（プレストレス）と、上を通る車の重さを同時に見分けられるか、というものだ。どちらも橋の揺れやたわみに影響するので、片方だけを推定するより難しい。2つの未知を同時に解きほぐすという問いが面白い。", "unverified": "抄録・本文とも入手できず、手法・検証の方法・結果は確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "台風時の長大橋の振動を確率的に予測", "title": "Time-variant probabilistic prediction of typhoon-induced long-span bridge vibration via an uncertainty-aware transformer framework", "url": "https://doi.org/10.1016/j.istruc.2026.113561", "authors": "Xiang-Yu Wang ほか", "venue": "Structures", "date": "2026-11-18", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、不確実性を考慮したTransformerで、台風時の長大橋の振動を時間とともに変わる確率として予測する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、台風の風で大きな橋がどれだけ揺れるかを、1つの値でなく幅（確率）を持って予測できるか、というものだ。風は刻々と変わり、予測には必ず不確かさが伴う。その不確かさの大きさまで含めて予測するという問いが面白い。", "unverified": "抄録・本文とも入手できず、対象の橋・データ・予測の精度は確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "層間すべりを考えた短いタイロッドの張力同定", "title": "A hybrid dynamic model for cable force identification of parallel-wire short tie-rods: Accounting for interlayer slippage and elastic end restraints", "url": "https://doi.org/10.1016/j.jsv.2026.120269", "authors": "Jiangtao Zhang ほか", "venue": "Journal of Sound and Vibration", "date": "2026-11-18", "sjr": 1.331, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "bas い。", "unverified": "抄録・本文とも入手できず、手法の詳細と検証の結果は確認できなかった。"}}, {"id": "jr37", "rank": 37, "headline": "解釈可能なAutoMLで橋梁の地震応答を予測", "title": "Physics-Informed Automated Machine Learning with Attention-Based INVASE for Interpretable Seismic Response Prediction of Bridges", "url": "https://doi.org/10.1016/j.cacaie.2026.100278", "authors": "Wenshan Li ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-19", "sjr": 2.155, "citescore": 14.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、物理情報と注意機構つきのINVASE（特徴選択の手法）を組み合わせた自動機械学習で、橋梁の地震応答を解釈可能な形で予測する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、橋が地震でどう揺れるかをAIで予測するとき、どの入力が効いたのかを人が理解できる形で示せるか、というものだ。当たるだけのAIでは、技術者は安心して設計に使えない。予測の理由まで見せるという問いが面白い。", "unverified": "抄録・本文とも入手できず、対象の橋・データ・予測の精度は確認できなかった。"}}, {"id": "jr38", "rank": 38, "headline": "周期的な軌道不整での輪軸の分岐を解析", "title": "Nonlinear dynamics and bifurcations in a railway wheelset on a periodically misaligned track", "url": "https://doi.org/10.1007/s00419-026-03222-1", "authors": "Seyed Ali Mousavi ほか", "venue": "Archive of Applied Mechanics", "date": "2026-11-17", "sjr": 0.505, "citescore": 4.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、周期的に不整列な軌道の上を走る鉄道の輪軸の非線形動力学と分岐（振る舞いが質的に変わる点）を扱う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、線路にわずかな周期的なずれがあるとき、車輪と車軸の揺れ方が、ある条件を境に急に変わること（分岐）があるか、というものだ。小さな原因が質的に違う揺れを生むという非線形の世界が、身近な鉄道の安全につながっている点が面白い。", "unverified": "抄録・本文とも入手できず、モデルと解析の結果は確認できなかった。"}}, {"id": "jr39", "rank": 39, "headline": "粒径分離が粒状流の到達と衝撃を変える", "title": "Particle size segregation effects on granular flow mobility: Physical mechanism and implications for flow-barrier interaction", "url": "https://doi.org/10.1016/j.compgeo.2026.108856", "authors": "Hantao He ほか", "venue": "Computers and Geotechnics", "date": "2026-11-19", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、題名検索で見つけた同じ論文の別の記録（SSRN）の抄録を使用", "preprint": false, "short": true, "p1": "2種類の粒径からなる粒状流が防護壁に衝突するとき、細粒の割合が増えると最大衝撃力が「下がって上がって下がる」非単調な変化をすることを示し、その原因を粒径分離による底部層の動きやすさで説明した（抄録）。", "p3": "細粒の質量比と粒径比を系統的に変えた3次元DEMで二分散の粒状流の防護壁への衝突を計算し、粒子レベルで底部層の粒子の回転と接触を分析した（抄録）。", "p5": "分離で底に移った細粒は速く回転する「ころ」として流れを加速する一方、小さいため隣の底部粒子との接触を増やして転がりを妨げ、減速もさせる。分離の度合いが高いほどフルード数が低く、衝撃力の推定の補正係数αは最大30%増えた（抄録）。", "fun": "大小の石が混ざった土石流では、流れるうちに小さな粒が下へ潜り込む（粒径分離）。その小さな粒は、ころのように流れを速くすることもあれば、底でつっかえて遅くすることもある。この二面性のせいで、壁にぶつかる力が粒の混ぜ方によって上がったり下がったりするという、一筋縄ではいかない振る舞いが面白い。", "unverified": "出版社の本文は入手できず、衝撃力の具体的な数値は確認できなかった。抄録は同じ論文の別の記録から取った。"}}, {"id": "jr40", "rank": 40, "headline": "深さ平均SPHで2023年の土石流を逆解析", "title": "Back-analysis of the 2023 Shiv Bawdi debris flow using depth-averaged SPH: insights into flow dynamics and mitigation approaches", "url": "https://doi.org/10.1007/s10346-026-02876-w", "authors": "Sourabh Mhaski ほか", "venue": "Landslides", "date": "2026-11-19", "sjr": 1.778, "citescore": 12.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、深さ平均のSPH（粒子法）で2023年のインドのシヴ・バウディ土石流を逆解析し、流れの動態と対策を論じる研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、実際に起きた土石流を計算で再現し、どう流れたのか、どこで止められたのかを後から確かめることだ。起きてしまった災害から学び、次の対策に生かすための「事故の再現実験」を計算機で行うという問いが面白い。", "unverified": "抄録・本文とも入手できず、解析の条件と結果は確認できなかった。"}}, {"id": "jr41", "rank": 41, "headline": "回転ドラム内の湿った粒状流をDEMで解析", "title": "Rheology and micromechanics of wet granular flows in a rotating drum: A DEM investigation", "url": "https://doi.org/10.1016/j.compgeo.2026.108853", "authors": "Zhongrong Wang ほか", "venue": "Computers and Geotechnics", "date": "2026-11-18", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、回転ドラムの中の湿った粒状流のレオロジー（流れ方）と微視的な力学を、個別要素法（DEM）で調べた研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、砂が乾いているときと湿っているときで流れ方がどう変わるかを、粒一つ一つの動きから説明することだ。湿った砂なら砂の城が作れるように、わずかな水が粒をくっつける。その小さな力が全体の流れをどう変えるかという問いが面白い。", "unverified": "抄録・本文とも入手できず、解析の条件と結果は確認できなかった。"}}, {"id": "jr42", "rank": 42, "headline": "ポートハミルトン学習で劣化と余寿命を予測", "title": "A Structured Port-Hamiltonian Learning Framework for Industrial Health Monitoring and Remaining Useful Life Prediction", "url": "https://doi.org/10.1016/j.ress.2026.113903", "authors": "Zhongze He ほか", "venue": "Reliability Engineering and System Safety", "date": "2026-11-19", "sjr": 2.838, "citescore": 21.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、構造化されたポートハミルトン系の学習の枠組みで、産業設備の健全性の監視と余寿命の予測を行う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、機械の劣化をAIで予測するとき、エネルギーの出入りという物理の基本ルールを守らせることで予測を信頼できるものにできるか、というものだ。自由に学ぶAIに物理の「骨組み」を与えるという問いが面白い。", "unverified": "抄録・本文とも入手できず、対象の設備と予測の精度は確認できなかった。"}}, {"id": "jr43", "rank": 43, "headline": "POD基底と勾配ブースティングで代理モデル", "title": "A Proper Orthogonal Decomposition–Based Gradient Boosting Machine for Efficient Surrogate Modeling", "url": "https://doi.org/10.1016/j.jcp.2026.115597", "authors": "Andrew N. Kitterman ほか", "venue": "Journal of Computational Physics", "date": "2026-11-18", "sjr": 1.552, "citescore": 7.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、題名検索で見つけた同じ論文の別の記録（SSRN）の抄録を使用", "preprint": false, "short": true, "p1": "低・高忠実度の解の対からPOD（固有直交分解）で写像を学ぶ多忠実度の代理モデル（PODMM）に、勾配ブースティングで残差を順に補正する拡張PODGBを提案した（抄録）。", "p3": "PODMMの学習で生じる残差の傾向を、連続するPODに基づくモデルで近似して補正する。学習損失の停留点に収束することを証明した（抄録）。", "p5": "2つの簡単な問題と工学規模の試験問題で、乱流などの流体計算で従来のPODMMが苦手とした関心量の再構成の誤差を、残差の補正が大きく減らした（抄録）。誤差の数値は抄録にない。", "fun": "細かい計算は正確だが時間がかかり、粗い計算は速いが不正確だ。粗い結果から細かい結果を推し量る「変換表」を作るのがこの種の代理モデルだが、表だけでは取りこぼしが出る。その取りこぼしを何段階も少しずつ埋めていく工夫（ブースティング）で補う発想が面白い。", "unverified": "出版社の本文は入手できず、誤差の削減率は確認できなかった。抄録は同じ論文の別の記録から取った。"}}, {"id": "jr44", "rank": 44, "headline": "中小企業の拡張信用格付けの頑健性", "title": "Robustness analysis in an augmented credit rating for Small and Medium-sized Enterprises", "url": "https://doi.org/10.1016/j.omega.2026.103708", "authors": "Silvia Angilella ほか", "venue": "Omega", "date": "2026-11-18", "sjr": 2.428, "citescore": 13.7, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、中小企業向けの拡張した信用格付けについて、その頑健性を分析する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、中小企業にお金を貸してよいかを判断する格付けが、使う情報や前提を少し変えても同じ結論になるか、というものだ。小さな会社は情報が少ないので、格付けが揺れやすい。判断の「ぶれにくさ」を確かめるという問いが面白い。", "unverified": "抄録・本文とも入手できず、格付けの方法とデータは確認できなかった。"}}, {"id": "jr45", "rank": 45, "headline": "資産構造の収益性と役員報酬の粘着性", "title": "Asset structural profitability and executive compensation stickiness: evidence from China", "url": "https://doi.org/10.1016/j.irfa.2026.105536", "authors": "Yongheng Wang ほか", "venue": "International Review of Financial Analysis", "date": "2026-11-18", "sjr": 2.373, "citescore": 13.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、資産の構造的な収益性と役員報酬の粘着性（業績が下がっても報酬が下がりにくい性質）の関係を、中国企業で調べた研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、会社の業績が上がると役員の給料は上がるのに、下がっても同じだけは下がらないという「粘り」が、会社の資産の稼ぎ方とどう関係するか、というものだ。給料の上がり方と下がり方の非対称が面白い。", "unverified": "抄録・本文とも入手できず、データと分析の結果は確認できなかった。"}}, {"id": "jr46", "rank": 46, "headline": "金融商品の会計基準改訂と score_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、AIや医療情報技術による技術ストレスと臨床医の燃え尽き、チームのレジリエンスの関係を扱う研究である（掲載誌は質的研究の誌）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、病院に新しいAIや電子カルテが入ったとき医師たちのストレスはどうなり、チームとしてどう乗り越えるのか、というものだ。技術の導入が人を楽にするとは限らず、支え合うチームの力が鍵になるかもしれないという問いが面白い。", "unverified": "抄録・本文とも入手できず、対象と方法、結果は確認できなかった。"}}, {"id": "jr49", "rank": 49, "headline": "中小企業の職場改善を社内の進行役が担う", "title": "Workplace health interventions in SMEs – experiences of employees performing as in-house facilitators", "url": "https://doi.org/10.1108/ijwhm-10-2025-0278", "authors": "Christine Ipsen ほか", "venue": "International Journal of Workplace Health Management", "date": "2026-11-19", "sjr": 0.733, "citescore": 5.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "デンマークの中小企業3社の健康・組織介入で、専門の訓練を受けていない社内の従業員が進行役（ファシリテーター）を務めた経験を、複数事例研究で分析した（抄録）。", "p3": "製造業とITの3社がそれぞれ2つの介入を行い、各社で訓練歴のない従業員2人を進行役に任命した。6か月にわたり特性要因図、時系列のワークショップ、従業員・進行役・管理者への面接、終了時の調査でデータを集めた（抄録）。", "p5": "社内の進行役は職場の健康の課題の特定を助け、文脈に合った解決策に貢献した。既存の進行役の能力に加え、組織の環境と参加者の必要に行動を合わせる文脈への感受性と、個人の経験と関心に基づく創造的な問題解決（ブリコルール的な役割）が特徴だった（抄録）。", "fun": "職場の働きやすさを良くする話し合いには上手に進める司会役が欠かせないが、小さな会社では専門家を呼ぶ余裕がない。この研究では普通の社員が司会役を務め、職場をよく知る強みと、手持ちのもので工夫する力を発揮していた。専門家でないことが、かえって強みになる場面がある点が面白い。", "unverified": "出版社の本文は入手できず、介入の具体的な内容と効果の評価は確認できなかった。"}}, {"id": "jr50", "rank": 50, "headline": "スマートシティと健康な高齢化の文献を整理", "title": "Smart Cities and Healthy Ageing: A Rapid Scoping Review of Enablers, Barriers, and Equity Considerations for Age-Inclusive Urban Transformation", "url": "https://doi.org/10.1093/geront/gnag258", "authors": "Jed Montayre ほか", "venue": "Gerontologist", "date": "2026-11-18", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "スマートシティの施策と健康な高齢化の関係を、2015〜2025年の文献の迅速なスコーピングレビューで整理し、促進要因・障壁・公平性の論点を示した（抄録）。", "p3": "5つのデータベースとScienceDirectの対象を絞った検索で、健康な高齢化に関わるデジタルまたはデータに基づく都市・地域のシステムを扱う研究を選び、システムに統合されない個別の家庭用の技術は除いた（抄録）。", "p5": "26研究が含まれ、19件（73.1%）が2023〜2025年の発表、14件がアジアの研究だった。証拠は4つの領域（スマートな統治と参加、移動と公共空間、データに基づく計画、地域と統合したケア）に集まり、使いやすい設計や人の支援が促進要因、デジタル・リテラシーの不足や費用・プライバシーの懸念が障壁だった（抄録）。", "fun": "便利なデジタルの街づくりは、お年寄りにとっても便利だろうか。調べてみると、使い方が難しい、お金がかかる、個人情報が心配といった壁があり、人による手助けやデジタル以外の選択肢を残すことが鍵だった。最新の技術ほど、取り残される人への配慮が要るという点が面白い。", "unverified": "出版社の本文は入手できず、各研究の質の評価は確認できなかった。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "Amazonの推奨枠は需要を自社へ誘導しうる", "title": "Two‐Sided Markets Shaped by Platform‐Guided Search", "url": "https://doi.org/10.3982/ecta22288", "authors": "Kwok Hao Lee ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "Amazonで商品ごとに1つの出品者を目立たせるBuybox（推奨枠）の販売データで構造モデルを推定し、消費者の95%がBuyboxの出品しか検討しないため、プラットフォームが需要を誘導できることを示す。Buyboxは価格に強く反応するが、自社の出品に偏る。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "超富裕層の富は貯蓄・相続・運用益で決まる", "title": "Why Are the Wealthiest so Wealthy? New Longitudinal Empirical Evidence and Implications for Theories of Wealth Inequality", "url": "https://doi.org/10.3982/ecta23194", "authors": "Joachim Hubmer ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "ノルウェーの1993〜2019年の行政パネルで、45〜64歳の上位0.1%世帯の中央値に対する超過資産を、高い貯蓄率・相続・運用収益・労働所得に分解する。超富裕層の4分の1は負の資産から急速に富を築いた新興の富で、残りは相続した富を平均以上の貯蓄と運用で増やしている。"}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "人は現金給付より仕事を通じた再分配を選ぶ", "title": "Informal Redistribution Through Work", "url": "https://doi.org/10.3982/ecta22079", "authors": "Elisa Macchi ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "ウガンダ・カンパラのフィールド実験と企業調査で、雇用主も労働者も現金給付より仕事を通じた再分配を一貫して選び、限界生産物がゼロの作業にも雇用主が支払うことを示す。生産価値や社会的評判では説明できず、仕事を通じて再分配すべきだという内面化された規範が動機だとする。"}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "予測アルゴリズムから理論の反例を自動生成", "title": "From Predictive Algorithms to the Automatic Generation of Anomalies", "url": "https://doi.org/10.3982/ecta22958", "authors": "Sendhil Mullainathan ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "研究者の直観に代えて予測アルゴリズムを使い、理論の欠陥を示すアノマリー（アレのパラドックスのような反例）を自動生成する手順を開発する。くじの選択を正確に予測するニューラルネットから、期待効用理論の既知のアノマリーを再発見し、新しいアノマリーも見つける。"}, {"id": "jn05", "rank": 5, "field": "因果推論", "headline": "公式で決まる処置の最適な操作変数", "title": "Optimal Formula Instruments", "url": "https://doi.org/10.3982/ecta24250", "authors": "Kirill Borusyak ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "政策の受給資格のように複雑な公式で決まる処置の効果を推定する際、外生ショックへの曝露の異質性を取り込み、再中心化で偏りを避けたより強い操作変数を構成して、その漸近的に効率的な形と実行可能な近似のアルゴリズムを示す。シミュレーション操作変数に比べて標準誤差が大きく下がる。"}, {"id": "jn06", "rank": 6, "field": "統計学", "headline": "回帰係数の厳密に有効なランダム化t検定", "title": "An Exact t ‐Test", "url": "https://doi.org/10.3982/ecta22545", "authors": "Guillaume A. Pouliot", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "誤差が交換可能なら厳密に有効で、そうでなく条件付き不均一分散があっても最良線形予測子について漸近的に有効な、回帰係数1つのランダム化検定を、連続・離散の相関した共変量を含む一般の設計で構成する。長く未解決だった問題に答える。"}, {"id": "jn07", "rank": 7, "field": "政治学", "headline": "密な住宅開発への反対は美的判断が動かす", "title": "How Sociotropic Aesthetic Judgments Drive Opposition to Dense Housing Development", "url": "https://doi.org/10.1017/s0003055426102226", "authors": "DAVID E. BROOCKMAN ほか", "venue": "American Political Science Review", "date": "2026-11-19", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "why": "米国の住宅不足の一因である密な住宅開発への有権者の反対を、持ち家の自己利益（NIMBY）でなく、社会全体の景観についての美的判断から説明する理論を立て、記述研究と実験で検証する。密な地域を選んで住む人は密度への美的な嗜好を持ち、密な開発をより支持する。"}, {"id": "jn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "悪い人間関係が常に強く効くわけではない", "title": "Examining Negative Asymmetry in Employee Social Networks: A Meta-Analysis", "url": "https://doi.org/10.1177/01492063261495910", "authors": "Kameron M. Carter ほか", "venue": "Journal of Management", "date": "2026-11-19", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "職場の否定的な関係は肯定的な関係より従業員の成果に強く関係するという負の非対称性の仮定を、71標本・13,369人・248の効果量のメタ分析で検証する。負の非対称性に沿う証拠は一部の関係に限られ、むしろ正の非対称性に沿う結果も見られ、効果量のばらつきも大きかった。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "主要顧客のAI導入が取引先へ波及する", "title": "Artificial Intelligence Along the Supply Chain", "url": "https://doi.org/10.1287/msom.2024.1549", "authors": "Ling Cen ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "サプライチェーンでつながる企業間のAI技術の普及を調べ、主要顧客のAI導入がそれに依存する供給企業のその後の導入を有意に予測することを示し、内生性に対処する複数の実証戦略で因果効果を確かめる。"}, {"id": "jn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "猛暑で配達員は多く働き遅配も増える", "title": "The Impact of Heat Hazard on Gig Economy Workers: Evidence from An On-demand Food Delivery Platform", "url": "https://doi.org/10.1287/msom.2025.0410", "authors": "Run Ge ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "中国の大手料理配達プラットフォームの運用データと高頻度の気象データで、極端な暑さの下で配達員が受ける注文と労働時間が増え、遅配の割合も高まり、時給は少し上がることを示す。暑熱による健康費用の試算も加え、短期の供給拡大と労働者の健康の間の緊張を示す。"}, {"id": "jn11", "rank": 11, "field": "物理学", "headline": "2+1次元の相対論的量子場を原子で模擬", "title": "Analogue simulation of massive relativistic quantum fields in 2 + 1 dimensions", "url": "https://doi.org/10.1038/s41586-026-11268-y", "authors": "Yansheng Zhang ほか", "venue": "Nature", "date": "2026-11-18", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "一様な2次元のボース・アインシュタイン凝縮体の2つの結合したスピン成分の相対位相で、サイン・ゴルドン模型を符号化し、2+1次元の質量を持つ相対論的量子場を模擬する。調整できる質量ギャップを持つ相対論的な分散と、位相が2πだけ巻く位相的な磁壁などの非摂動的な現象を観測した。"}, {"id": "jn12", "rank": 12, "field": "地球科学", "headline": "断層帯の非弾性変形が大小の地震を生む", "title": "Small and large earthquakes driven by inelastic deformation in weak fault zones", "url": "https://doi.org/10.1126/sciadv.aef7106", "authors": "Peng Zhai ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "断層面だけでなく周囲の断層帯の岩石の損傷と回復を含む動的な地震サイクルモデルで、同じ断層上の小さな地震と大きな地震が、断層すべりと断層帯の非弾性変形の相互作用から自然に生じることを示し、規模別頻度などの観測を再現する。"}, {"id": "jn13", "rank": 13, "field": "物理学", "headline": "重力で遮断できない無線通信を実証", "title": "Unblockable communication with gravity", "url": "https://doi.org/10.1126/sciadv.aee0802", "authors": "Andrew J. Groszek ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "電磁波は遮蔽されうるため、遮断できない通信路はあるかを問い、質量を動かして2値のメッセージを符号化し、受信側が重力計でその信号を検出する通信の手順を提案する。レンガの壁越しに約0.7メートル、毎分1ビットでの伝送に成功した。"}, {"id": "jn14", "rank": 14, "field": "機械学習", "headline": "視覚言語モデルで脚ロボットが野外を踏破", "title": "Bridging vision-language reasoning and learned control for legged navigation in the wild", "url": "https://doi.org/10.1126/scirobotics.aee1549", "authors": "Takahiro Miki ほか", "venue": "Science Robotics", "date": "2026-11-18", "sjr": 5.883, "citescore": 32.1, "citescore_year": "2025", "why": "インターネット規模で事前学習した視覚言語モデルの常識的な推論と、シミュレーションの強化学習で得た歩行・局所計画を、開語彙セグメンテーションによるリスク地図でつないだROAMを提案する。脚ロボットが高山と都市の環境で、標識を読み危険を避けながらキロメートル規模の移動を行った。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "労働増大型の技術を入れた生産関数の推定", "title": "Production Function Estimation With Factor‐Augmenting Technology: An Application to Markups", "url": "https://doi.org/10.3982/ecta19299", "authors": "Mert Demirer", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "CES型に頼らず多次元の生産性を許すようOlley–Pakesの枠組みを拡張して、労働増大型の技術を持つ生産関数を推定する方法を開発し、米国と途上国4か国の製造業に適用する。労働増大型の生産性を無視すると、資本の弾力性を過小に、可変投入の弾力性とマークアップを過大に推定する。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "中間財の長期の代替弾力性は高い", "title": "Intermediate Input Substitutability", "url": "https://doi.org/10.3982/ecta21141", "authors": "Alessandra Peter ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "1990年代初めのインドの貿易自由化による恒久的で異質な関税の引下げを自然実験として、製造業事業所の8種類の中間投入の長期の代替弾力性を推定し、コブ・ダグラスの1を大きく上回る高い代替性を示す。短期や一時的な価格ショックではずっと低い弾力性になる。"}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "資産価格の変動を入れたキャピタルゲイン税", "title": "Putting the ‘Finance’ Into ‘Public Finance’: A Theory of Capital Gains Taxation", "url": "https://doi.org/10.3982/ecta24013", "authors": "Mark Aguiar ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "資産価格がキャッシュフローだけでなく割引率でも変動するという現代ファイナンスの見方を入れた最適再分配課税を分析し、実現ベースのキャピタルゲイン税とキャッシュフロー税の組合せが価格変動の源によらず最適配分を実現することを示す。総純取引を対象にすることでロックイン効果も避けられる。"}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "ネットワークの社会的学習には速度の上限", "title": "The Social Learning Barrier", "url": "https://doi.org/10.3982/ecta24769", "authors": "Florian Brandl", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "社会ネットワークで隣人の行動を見ながら繰り返し行動する主体について、最も学習の遅い主体の学習速度は、最も情報量の多い私的シグナルの分布だけで決まる定数で抑えられ、主体の数・ネットワーク構造・シグナルの相関・戦略によらないことを示す。"}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "試行回数が主体で異なるときの極値理論", "title": "Extreme Value Theory With Heterogeneous Agents", "url": "https://doi.org/10.3982/ecta22276", "authors": "Sephorah Mangin", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "生産性やアイデアなど、主体が分布から多数の値を引きその最大値で結果が決まる経済モデルで、引ける回数が主体によって異なる場合を探索技術として扱い、平均的な結果が変わるかを示す新しい極値分布のクラスを導く。"}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "繰り返しゲームで連合を抑止する枠組み", "title": "Coalitions in Repeated Games", "url": "https://doi.org/10.3982/ecta23921", "authors": "S. Nageeb Ali ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "継続的な約束と罰で連合による阻止を抑止する履歴依存の仕組みをモデル化し、譲渡可能な効用の有無で有効性を評価する解概念を提案する。応用として労働市場の賃金の透明性の含意を分析する。"}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "プロスペクト理論の価値が通貨の収益を予測", "title": "Prospect Theory and Currency Returns: Empirical Evidence", "url": "https://doi.org/10.1017/s0022109026103469", "authors": "Qi Xu ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-19", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "why": "為替収益の過去の分布から通貨ごとのプロスペクト理論の価値を作ると将来の超過収益を負に予測し、それに基づくロング・ショート戦略は年約5%を生む。裁定が限られるほど予測力が強く、ファンドは逆向きに取引して裁定者として働く。"}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "トレンドの明瞭さがモメンタムを強める", "title": "Trended Momentum", "url": "https://doi.org/10.1017/s0022109026103275", "authors": "Charlie Xiaowu Cai ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-19", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "why": "価格のトレンドがはっきりしているほどモメンタムの収益が大きくなることを示し、トレンドの明瞭さが最も高い5分位で通常のモメンタム戦略を上回る収益を得る。パターン認識に基づく投資家の期待の形成から説明する。"}, {"id": "jn23", "rank": 23, "field": "因果推論", "headline": "技術採用の相関ランダム係数モデルの弱識別", "title": "Comment on ‘Selection and Comparative Advantage in Technology Adoption’ by Tavneet Suri", "url": "https://doi.org/10.3982/ecta21760", "authors": "Emilia Tjernström ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "why": "農業技術の採用を相関ランダム係数（CRC）モデルで分析した先行研究を公開データで再分析すると点推定値が大きく異なることを示し、より一般的なランダム係数モデルとして再定式化して、鍵となる構造パラメータの識別が弱いことを明らかにする。"}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "著名な最初の顧客は新興企業の後の契約を改善", "title": "Temporal tradeoffs and contracting dynamics in buyer–supplier agreements", "url": "https://doi.org/10.1002/smj.70142", "authors": "Jeffrey J. Reuer ほか", "venue": "Strategic Management Journal", "date": "2026-11-19", "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "why": "陸上の石油・ガス掘削で、新興の掘削会社は著名な顧客と最初に契約するとき多くのリスクを負うが、その後の他の顧客との契約では負うリスクが減ることを示す。後の顧客が掘削会社の能力について多くの情報を持つほど、この改善は小さくなる。"}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "サステナビ   function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
