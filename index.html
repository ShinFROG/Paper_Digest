評価した。持続的な偏りの文書間SDはSol 0.07、Sonnet 0.11、Gemini 0.11だった（偏りの分解）。", "p6": "著者は、偏りはモデルが洗練されると減るかもしれないこと、メタデータを消すことで名前の効果は「名前なしの偏り」に減らせるが、透かしやLLM特有の語彙・文体は消しにくいことを述べる（結論）。解釈：文書は少数で、評価の観点（文章の質）も1つに限られる。", "fun": "論文の審査をAIに手伝わせる時代になりました。でも、まったく同じ文章なのに、ファイル名に人の名前があると点が上がり、名前の種類によって上がったり下がったりしました。AIの採点が、内容と関係のない「表紙」に引っ張られるのです。対策として、採点の前にファイル名などの付帯情報を消してしまう方法が提案されています。", "unverified": "研究2の主要な推定値（自己優遇の大きさ）は読んでいない。"}}, {"id": "pn14", "rank": 14, "field": "経営学", "headline": "AIと練習して起業の技能を高める", "title": "Improving Entrepreneurial Skills by Practicing with AI", "url": "https://arxiv.org/abs/2611.02016", "authors": "Amir Globerson ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Globerson, A., Choudhury, A., Iurchenko, A., Hassidim, A., Cheung, C., Kim, E., Olanubi, F., Espinosa, G., Andrews, G., Elidan, G., Lieber, H., Mu, H., Chou, K., Kerem, N., Efron, N., Kapadia, R., Levitt, R., Yulzary, R., Agarwal, S., … Matias, Y. (2026). Improving Entrepreneurial Skills by Practicing with AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02016", "why": "批判的思考や創造性など起業に要る技能を、AIとの練習で高められるかを検証。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（RCTの設計§4.2、分析標本と処置効果§5.1.1〜5.1.2、用量の分析§5.1.4、考察§6）と抄録を読んだ", "preprint": true, "p1": "現実的な事業の場面で学習者に挑むAIの仲間と練習できる環境（Vantage）を使った高校生は、通常のAIツールだけの生徒より、起業プログラムの最終事業計画の得点が高いことを無作為化比較試験で示した（抄録、§5.1.2）。", "p2": "批判的思考・創造性・協働など長く役立つ技能はイノベーションに欠かせないが、教えるのも測るのも難しい。AIの教育への利用は数学・理科などの教科が中心だった（§1、§6）。", "p3": "入力は事業の場面のシナリオ、出力は学習者とAIの仲間の対話による練習。Google Researchが作ったVantageを起業教育向けに拡張し、AIの仲間が場面を進めながら学習者に主要な技能を使わせる。カリキュラムに合わせた6つの課題がある（§2、付録7.1）。", "p4": "NFTEの夏の起業プログラム（BizCamp）の9会場のうち5会場で生徒単位の無作為割り当てを行い、成果データのある4会場の52人（処置36人、対照16人）で最終事業計画の得点を比べ、共変量調整と課題の完了数による用量の分析も行った（§4.2、§5.1.1）。", "p5": "処置群の平均は67.6%（SD 11.5）、対照群は60.5%（SD 11.4）で、差は+7.1ポイント（Cohenのd=0.62、p=.047）だった。4会場すべてで同じ向き（+2.0〜+9.9ポイント）だった。課題を0件しかしなかった10人は59.3%で対照と変わらず、1〜2件で65.7%、3〜4件で69.5%、5〜6件で79.7%だった（§5.1.2、§5.1.4）。", "p6": "著者は結果を予備的とし、会場ごとの対照群は2〜5人しかおらず個別の信頼区間は広いとする（抄録、§5.1.2）。解釈：標本は52人と小さく、p値は境界に近い。用量の分析は練習量を自分で選んでいるため、意欲の高い生徒ほど練習した可能性があり因果ではない。", "fun": "起業の授業で、AIが「気難しい投資家」や「意見の違う共同経営者」の役を演じてくれたら、本番さながらの練習ができます。実際にそうした練習をした高校生は、最後の事業計画の点数が7ポイントほど高くなりました。しかも練習をたくさんした生徒ほど点が高い一方、使える状態でも練習しなかった生徒は差がなかった、というのが分かりやすい結果です。", "unverified": "共変量調整後の推定（§5.1.3）と学習者の体験の調査（§5.2）の数値は読んでいない。"}}, {"id": "pn15", "rank": 15, "field": "経営学", "headline": "特許訴訟は製品市場で競争相手を狙う手段", "title": "Competing through Patent Litigation:&nbsp;Product-market Targeting and Innovation", "url": "https://doi.org/10.2139/ssrn.7672860", "authors": "Sixun Tang", "venue": "SSRN", "date": "2026-11-03", "apa": "Tang, S. (2026). Competing through Patent Litigation:&nbsp;Product-market Targeting and Innovation. https://doi.org/10.2139/ssrn.7672860", "why": "特許訴訟を製品市場の競争の手段として分析し、提訴の判断と投資の決まり方を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "事業会社どうしの特許訴訟は、製品市場で最も近い競争相手を狙い撃ちにする競争の手段として使われ、周囲の競争相手のイノベーションも抑えることを示した（抄録）。", "p2": "特許の権利行使はイノベーションを守るためのものとされるが、事業会社が競争相手を犠牲にして製品市場の利益を守るために訴訟を戦略的に使う可能性は、十分に実証されていない（抄録）。", "p3": "簡単なモデルで、提訴の判断と訴訟に投じる資源はいずれも、当事者の製品市場での近さで表される争いの的の市場地位とともに増えると予測する。近さは従業員の技能の構成から、訴訟の努力は裁判所の記録と弁護士の請求記録から作った2つの新しい指標で測る（抄録）。", "p4": "米国の事業会社間の特許訴訟の全数を使い、特許の強さへの不利なショックへの曝露、侵害リスクの指標で条件づけた提訴の相手の選び方、訴訟の費用、勝訴率、訴訟後の周囲の競争相手の画期的な特許の数を調べた（抄録）。", "p5": "特許の強さへの不利なショックへの曝露が1SD高いと提訴は25%減った。1SD近い競争相手は訴えられるオッズが1.7倍で、双方の訴訟費用が18〜22%高かったが、近い相手に対して原告が勝つ割合は高くなかった。訴訟の後、権利行使者の最も近い競争相手は2年後の画期的な特許が約4.6%少なく、被告の競争相手には同様の反応はなかった（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：近さの指標は従業員の技能に基づく代理で、製品の実際の重なりとはずれうる。", "fun": "特許は発明を守るための制度です。でもこの研究は、会社が「一番のライバル」を狙って訴え、しかも勝てるかどうかに関係なくお金をかけて戦うことを示しました。さらに、訴えられていないライバルまで、新しい発明が減っていました。「次は自分かも」と萎縮するのかもしれません。守るための道具が、攻めの武器にもなっているのです。", "unverified": "モデルの詳細と推定の頑健性は未確認。"}}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "人とエージェントのチームを統制されたメッセージで運営", "title": "Getting a Grip: Operating Human-Agent Software Teams Through Governed Messages", "url": "https://arxiv.org/abs/2611.00689", "authors": "Michael Granitzer ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Granitzer, M., Dastidar, K. G., Einwiller, A., Mitrović, J., & Zerhoudi, S. (2026). Getting a Grip: Operating Human-Agent Software Teams Through Governed Messages (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00689", "why": "複数の人が多数のコーディングエージェントを指揮する開発チームの運営方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の人が多数のコーディングエージェントを指揮するチームを、型と宛先を持つメッセージの規約で統制する中継の仕組みを示した（抄録）。", "p3": "人とエージェントを認証された主体とし、目標・決定規則・経路と追記のみの記録を持つ「部屋」で型つきの宛先つきメッセージを交わす中継系yoarsを提案し、部屋の規則を変えた統制実験を行った（抄録）。", "p5": "926回の統制実行（解析可能899回）で小さなエージェントチームにプログラムを作らせ、一部には悪意ある参加者を入れた（抄録。主な結果の数値は未確認）。", "fun": "人間のチームでも「誰が誰に頼めるか」「どの発言で決まったか」があいまいだと混乱します。AIが何体も加わればなおさらです。この研究は、チームの約束事を「メッセージの書式と記録」として機械的に決め、裏切り者がまじっても崩れないかを実験しました。会議の議事録を仕組みにした発想です。", "unverified": "統制実験の主要な結果は抄録で切れており未確認。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "集団的リーダーシップを強制選択式で測る", "title": "Innovations in leadership measurement: Developing contextualized forced-choice metrics for collective leadership capacities", "url": "https://doi.org/10.31234/osf.io/uvweq", "authors": "Alvin Vista ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Vista, A., Boruchowicz, C., & Tolescu, A. (2026). Innovations in leadership measurement: Developing contextualized forced-choice metrics for collective leadership capacities. https://doi.org/10.31234/osf.io/uvweq", "why": "文脈に合わせた強制選択式の尺度で、集団のリーダーシップ能力を測る新しい方法。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "自己評定の偏りを避けるため、集団的リーダーシップ能力を強制選択式で測る尺度を開発した（抄録）。", "p3": "Teach For Allのネットワークの教育の文脈に合わせ、自己理解・システム思考・生徒への信頼・集団的な心構え・教育の目的観の5次元を強制選択式で測り、イプサティブ（個人内比較）の限界に対処した（抄録）。", "p5": "開発と初期の妥当性検証を示した（抄録。妥当性の指標値は未確認）。", "fun": "「あなたは協調的ですか」と聞かれると、多くの人は「はい」と答えます。そこで「AとBのどちらがよりあなたらしいか」と選ばせると、良く見せる答え方がしにくくなります。この研究は、その強制選択の方法で、個人ではなく集団としてのリーダーシップを測ろうとしました。", "unverified": "妥当性検証の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "上司の天職意識が部下に移るかは信頼次第", "title": "The Moderating Role of Trust on the Relation Between a Leader’s Calling and an Employee’s Calling", "url": "https://doi.org/10.31234/osf.io/djuc8", "authors": "Sophie Gerdel ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Gerdel, S., Vercillo, M., Duffy, R. D., & Vianello, M. (2026). The Moderating Role of Trust on the Relation Between a Leader’s Calling and an Employee’s Calling. https://doi.org/10.31234/osf.io/djuc8", "why": "リーダーの天職意識と従業員の天職意識の関係を、信頼が調整することを示す。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "信頼する上司が天職意識を持っていると、部下の天職意識も時間をかけて育つことを示した（抄録）。", "p3": "社会的認知キャリア理論と意味づけ理論に基づき、米国の従業員285人の3時点の縦断データで、上司の天職意識の知覚と信頼が部下の天職意識の伸びを予測するかを検証（抄録）。", "p5": "信頼する上司に天職意識を感じると部下の天職意識が育ち、この過程は他の模倣の過程より遅く、少なくとも4〜8か月を要した（抄録）。", "fun": "「この仕事は自分の天職だ」という感覚は、どうやって生まれるのでしょう。この研究は、それが上司から部下へゆっくり「うつる」ことを示しました。ただし信頼している上司の場合に限ります。尊敬できる先輩の背中を見て育つ、という昔からの言い方を、数か月の追跡で確かめた形です。", "unverified": "なし"}}, {"id": "pn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "生成AIへの信頼と不信を集団で交渉する", "title": "Collectively Negotiating Trust and Mistrust in Generative AI: Evidence from Reddit Discussions of ChatGPT and Claude", "url": "https://doi.org/10.31234/osf.io/dnxyk", "authors": "Rita Tang ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Tang, R., Lin, Z., & Liu, J. (2026). Collectively Negotiating Trust and Mistrust in Generative AI: Evidence from Reddit Discussions of ChatGPT and Claude. https://doi.org/10.31234/osf.io/dnxyk", "why": "Redditの議論から、生成AIへの信頼が集団でどう形づくられるかを分析。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "生成AIへの信頼と不信が、オンライン共同体の中でどう話し合われるかを30万件の投稿から示した（抄録）。", "p3": "r/ChatGPTとr/ClaudeAIの301,498件の投稿を、構造的トピックモデル、理論に基づく信頼・不信の辞書、人による解釈で分析（抄録）。", "p5": "信頼に関わる9つのトピック（信頼1、不信4、両義的4）を特定した。信頼はAIとの交友やセラピーのような支えに集まり、不信は脱獄やモデルの劣化などに関わった（抄録）。", "fun": "AIを信じるかどうかは、一人ひとりの気持ちの問題に見えます。でもネットの掲示板では、みんなで「この使い方は大丈夫か」と話し合いながら信頼が形づくられています。30万件の投稿から、信頼が「相談相手としてのAI」に、不信が「勝手に性能が変わること」に向いていると分かったのが興味深い点です。", "unverified": "「モデルの劣化」は抄録の切れた語からの解釈：model dの後は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "労働市場の教育収益と家族内の教育格差", "title": "Labor Market Returns to Education and Intra-family Educational Inequality: Theory and Experimental Evidence", "url": "https://arxiv.org/abs/2611.02959", "authors": "Esther Gehrke ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Gehrke, E., & Amador, M. G. (2026). Labor Market Returns to Education and Intra-family Educational Inequality: Theory and Experimental Evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02959", "why": "労働市場の条件が兄弟姉妹間の教育配分を変えるかを理論と実験で検証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "学歴の賃金収益が凸である労働市場で、親が兄弟姉妹の教育投資の差を広げるか縮めるかは、親の不平等回避で決まることを示した（抄録）。", "p3": "理論モデルを立て、メキシコ・サンルイスポトシの親246人による高い報酬つきの実地実験で、トークンの配分が子のAI講座への参加を決める6つの場面から構造パラメータの分布を推定（抄録）。", "p5": "収益の凸性は、親の不平等回避の大きさによって兄弟姉妹間の差を増やしも減らしもする（抄録の理論結果。推定値は未確認）。", "fun": "勉強すればするほど給料が「加速度的に」増える社会では、親は出来のよい子に集中投資したくなるかもしれません。でも子どもの間の公平も気になります。この研究は、親が本物の講座の席を子どもに配る実験で、その迷いの強さを測りました。家庭の中の小さな配分が、社会の格差につながる道筋を考えさせます。", "unverified": "推定された不平等回避の分布は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "洪水と自動車産業の生産の二重化", "title": "Floods and the Duplication of Production: Evidence from the Global Car Industry", "url": "https://arxiv.org/abs/2611.01329", "authors": "Michele Fioretti ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Fioretti, M., Praetorius, S., & Mayer, T. (2026). Floods and the Duplication of Production: Evidence from the Global Car Industry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01329", "why": "洪水によるサプライチェーン途絶が、企業の生産拠点の重複配置を促すかを実証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "洪水に遭った自動車メーカーは、生産を移すのではなく複数拠点に重複させることを示した（抄録）。", "p3": "工場単位のデータと手作業で確認した洪水記録を使い、時期のずれた差の差分法で、車両と主要部品の生産の適応と、保険・公的な治水との関係を分析（抄録）。", "p5": "洪水から5年以上たってもエンジンが2つ以上の工場で作られる確率は19ポイント高く、多くは海外の、近くで組み立てる車向けだった。被災工場の生産は洪水の年の一時的な減少の後、持続的には下がらなかった（抄録）。", "fun": "洪水で工場が止まったら、別の場所に引っ越すのが普通に思えます。ところが実際の自動車メーカーは、元の工場を残したまま別の国でも同じ部品を作り始めました。「引っ越し」ではなく「予備を持つ」選択です。災害への備えが、世界の生産地図を静かに変えていることが分かります。", "unverified": "なし"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "較正は正しいモデルを選ぶか：所得リスクの尤度", "title": "Does Calibration Pick the Right Model? Likelihood Evidence from Income Risk", "url": "https://arxiv.org/abs/2611.02029", "authors": "Jiuyi Cheng ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Cheng, J., & Toda, A. A. (2026). Does Calibration Pick the Right Model? Likelihood Evidence from Income Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02029", "why": "モーメント一致による較正と尤度による証拠を比べ、所得リスクのモデル選択を検証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "いくつかのモーメントを合わせる較正では、所得リスクの正しいモデルを選べないことを尤度で示した（抄録）。", "p3": "有限状態の隠れマルコフ近似で、短いパネルの非線形・非ガウスの潜在過程の尤度推定とモデル選択をシミュレーションなしで可能にし、PSIDの所得データに適用した（抄録）。", "p5": "所得変動のモーメントに最もよく合う較正は、ガウスの持続成分を持つ尤度推定の過程より所得履歴全体への当てはまりが悪かった。標準的な貯蓄モデルでは、目標に同程度に合う較正どうしで平均資産が3倍違った（抄録）。", "fun": "テストの平均点と分散が同じでも、クラスの中身は違うことがあります。経済のモデルも、いくつかの統計量を合わせただけでは「同じに見えて別物」になります。この研究は、データ全体の当てはまりで比べると、どのモデルが良いかが変わり、貯金の予測が3倍もずれることを示しました。", "unverified": "なし"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "レビューを促すと評価の分布が変わる", "title": "Ask More, Hear Less: How a Review Prompt Changes What Online Ratings Show", "url": "https://arxiv.org/abs/2611.02623", "authors": "Zihan Chen ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Chen, Z., Zheng, L. N., & Zhu, D. (2026). Ask More, Hear Less: How a Review Prompt Changes What Online Ratings Show (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02623", "why": "レビュー依頼が自己選択を減らすかを検証し、評価の見え方の変化を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "レビューの依頼が評価の情報量を増やすか減らすかの対立する理論を、信号検出理論でまとめて検証した（抄録）。", "p3": "評価が「何を知っているか」（感度）と「何を表すか」（基準）を分け、Steamが約3時間のプレイ後にレビューを促し始めた2019年10月の閾値で、315ゲームの2,160万件のレビューに差の不連続デザインを適用した（抄録）。", "p5": "抄録の範囲では結果の詳細は切れており、題名から、依頼によって評価が示すものが変わることが主張と読める（解釈）。", "fun": "「レビューを書いてください」とお願いすれば、もっと多くの人の本音が集まりそうです。でも頼まれて書く人は、熱心な人ほど強い意見を持っていないかもしれません。この研究は、ゲームを3時間遊ぶと依頼が出る仕組みの境目を使い、お願いが評価の「見え方」をどう変えるかを2千万件超のレビューで調べました。", "unverified": "主要な結果（感度と基準の変化）は抄録で切れており未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "女性殺害の注目が全国的な対応を動かす", "title": "Public salience mobilizes nationwide responses to violence against women", "url": "https://arxiv.org/abs/2611.02647", "authors": "Augusto Cerqua ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Cerqua, A., Letta, M., Giannantoni, C., & Pinto, G. (2026). Public salience mobilizes nationwide responses to violence against women (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02647", "why": "公的な注目が社会の対応を動員するか、さらなる被害を招くかを実証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "注目を集めた女性殺害事件が、全国で支援の求めや通報を増やし、模倣は起こさないことを示した（抄録）。", "p3": "2017〜2024年のイタリアの女性殺害の事例単位のデータを新たに作り、最も注目された事件が支援の求め、警察への通報、致死的な暴力に与える全国的な影響を分析（抄録）。", "p5": "注目度の高い親密なパートナーによる女性殺害は全国で支援の求めを増やし、特に注目された1件は通報も大きく増やしたが、女性殺害の増加は見られず模倣説と整合しなかった。注目の低い事件では同様の動員はなかった（抄録）。", "fun": "悲しい事件が大きく報道されると、まねをする人が出るのでは、と心配されます。この研究はイタリアの記録を使い、むしろ「自分も危ないかもしれない」と気づいた人が相談や通報を増やしたことを示しました。報道の注目が、被害を広げる方向ではなく、助けを求める方向に働いたという発見です。", "unverified": "なし"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "機械が上場の時機を決める市場", "title": "Machine-Timed Markets: Artificial Intelligence and the Timing and Outcomes of Initial Public Offerings", "url": "https://doi.org/10.2139/ssrn.7672098", "authors": "Leo Will", "venue": "SSRN", "date": "2026-11-03", "apa": "Will, L. (2026). Machine-Timed Markets: Artificial Intelligence and the Timing and Outcomes of Initial Public Offerings. https://doi.org/10.2139/ssrn.7672098", "why": "AIがIPOの時機と結果に与える影響を分析。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIを起業の主体とみなし、IPOの時機と成果をどう変えるかの理論を提示した（抄録）。", "p3": "リアルオプション、シグナリング理論、企業年齢とメディア感情の非線形効果の研究に基づく概念的な理論構築（抄録）。", "p5": "AIは市場の窓の察知を鋭くし、上場準備の時間を縮め、開示の精度を高め、募集の物語を最適化して、時機を改善し過小値付けを減らすと論じた。その他の帰結は抄録で切れている（抄録）。", "fun": "会社を株式市場に出すタイミングは、早すぎても遅すぎても損をします。これまでは経験豊富な専門家の勘に頼ってきました。この論文は、AIがその勘の代わりになったら何が起きるかを理屈で組み立てます。みんなが同じAIを使うと、かえって同じ時期に殺到する心配も考えられます（解釈）。", "unverified": "実証の有無と、理論が示す負の帰結は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "起業家の条件つき納税倫理", "title": "Conditional Tax Morale Among Entrepreneurs: Within-Person Evidence on Fiscal Reciprocity, Deterrence, and Peer Behavior", "url": "https://doi.org/10.2139/ssrn.7668859", "authors": "Baiba Renerte ほか", "venue": "SSRN", "date": "2026-11-03", "apa": "Renerte, B., & Sauka, A. (2026). Conditional Tax Morale Among Entrepreneurs: Within-Person Evidence on Fiscal Reciprocity, Deterrence, and Peer Behavior. https://doi.org/10.2139/ssrn.7668859", "why": "個人内の変動から、財政的互恵性・抑止・同僚行動が納税倫理に与える影響を検証。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "起業家の納税倫理は、取締りの弱まりや同業者の脱税より、政府の浪費に最も強く反応することを示した（抄録）。", "p3": "2026年のラトビア・リトアニア・エストニアの企業の所有者・経営者1,513人の調査で、同じ回答者内で1つの条件を変える3組のビネットにより、脱税がどれほど正当化できるかを判断させた（抄録）。", "p5": "判断は政府の浪費に最も、取締りの弱まりにそれに次いで、同業者の脱税に最も小さく反応し、この順序はどの国でも、各回答者が信じる現状のもとでも成り立った（抄録）。", "fun": "人が税金を払うのは、罰が怖いからだけではありません。この調査では、経営者が「脱税も仕方ない」と思う一番の理由は、周りがずるをしていることではなく、政府がお金を無駄遣いしていることでした。払う側が「税がきちんと使われているか」を見ている、という互恵の感覚が浮かびます。", "unverified": "なし"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "欧州航空業の炭素規制と競争", "title": "Carbon regulation and competition in the European airline industry", "url": "https://econpapers.repec.org/RePEc:azt:cemmap:20/26", "authors": "Ertian Chen ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "EU排出量取引の強化が航空会社間の競争に与える影響を分析。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "EU排出量取引の強化が欧州の航空市場に与える影響は、航空会社の型と市場によって大きく偏ることを示した（抄録）。", "p3": "内生的な路線参入、直行便の頻度、価格設定を持つ2段階の航空競争モデルを推定し、炭素価格の上昇を模擬（抄録）。", "p5": "消費者余剰は全体で最大34%、中・長距離市場で最大95%減り、短距離市場は容量の再配分で厚生が増えた。航空会社の利潤は1〜42%減るが、19〜29億ドルの炭素税収と27〜40億ドルの回避排出の社会的価値が民間の損失を上回った（抄録）。", "fun": "飛行機に炭素の値段をつけると、みんなが同じだけ損をするわけではありません。この研究では、長い路線ほど打撃が大きく、短い路線はむしろ便が増えて得をする、という意外な結果が出ました。航空会社が路線を組み替えるという「反応」まで計算に入れたからこそ見えた姿です。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "正規-正規経験ベイズの事前母数を頑健に推定", "title": "Robust Estimation of Prior Parameters in Normal-Normal Empirical Bayes", "url": "https://arxiv.org/abs/2611.00326", "authors": "Manu Burson ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Burson, M., & Kessler, R. (2026). Robust Estimation of Prior Parameters in Normal-Normal Empirical Bayes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00326", "why": "大規模A/Bテストで使う経験ベイズの事前分布推定を外れ値に強くする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大規模A/Bテストの正規-正規経験ベイズで、真の効果の分散の推定を少数の極端な観測に強くする推定量を提案した（抄録）。", "p3": "モデルとの不整合に比例して極端な観測の重みを下げる有界影響最尤推定量（BIMLE）を提案。極端な観測がなければ通常の最尤推定と一致し、標本はすべて使う（抄録）。", "p5": "Amazonで実施したA/Bテストに適用した（抄録。改善の大きさは抄録で切れており未確認）。", "fun": "たくさんの実験結果をまとめて「本当の効果のばらつき」を見積もるとき、たった数件の異常な結果が全体を大きく動かしてしまうことがあります。この方法は、怪しい結果を捨てずに、怪しさに応じて発言力を下げます。多数決で一人の大声に振り回されない工夫に似ています。", "unverified": "Amazonでの適用結果の数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "少数の単位が変動を支配する無作為化実験の推測", "title": "Studentized inference in randomized experiments when a few units dominate the outcome variation", "url": "https://arxiv.org/abs/2611.03561", "authors": "Xinyuan Chen ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Chen, X., Kiesel, J. W., & Woody, J. R. (2026). Studentized inference in randomized experiments when a few units dominate the outcome variation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03561", "why": "裾の重い結果での無作為化実験の推測を、スチューデント化で安定させる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "裾の重い結果の無作為化実験で、少数の単位が残差変動を占めると、スチューデント化した統計量が正規分布に近づかないことを示した（抄録）。", "p3": "有限母集団を固定し、処置の割り当てだけを確率とする設計ベースの枠組みで、平均の差とLinの回帰調整推定量のスチューデント化統計量の極限を調べた（抄録）。", "p5": "極限は一般に非正規で、潜在結果の周辺分布が同じでも、観測できない2つの潜在結果の組み合わせ方によって極限が変わる（抄録）。", "fun": "実験の参加者が増えれば、平均の差は正規分布に従う、というのが統計の常識です。でも、ごく少数の「桁違いの人」がいると話が変わります。例えば売上の実験で一人の大口客がいるような場合です。この研究は、そのとき常識的な信頼区間が当てにならない理由を数学的に示しました。", "unverified": "提案する修正法の有無は抄録で切れており未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "確率標本と非確率標本の傾向スコアによる統合", "title": "Data integration using propensity score weighting under missing at random", "url": "https://arxiv.org/abs/2611.03353", "authors": "Caleb Leedy ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Leedy, C., & Kim, J. K. (2026). Data integration using propensity score weighting under missing at random (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03353", "why": "MAR下で確率標本と非確率標本を統合する傾向スコア重みづけの理論。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "確率標本と非確率標本を傾向スコアの重みで統合し、母平均を推定する方法の理論を示した（抄録）。", "p3": "補助変数は両方の標本で、調査変数は非確率標本だけで観測される設定で、非確率標本への包含のパラメトリックな傾向スコアモデルを条件付き最尤法で推定し、逆確率重みづけ推定量を作る（抄録）。", "p5": "適切な正則条件のもとで、提案する推定量の一致性と漸近正規性を示した（抄録）。", "fun": "ネットで集めたアンケートは安く大量に集まりますが、答える人が偏っています。きちんと無作為に選んだ小さな調査には偏りがありません。この方法は、小さな「正しい」調査を手がかりに、大きな「偏った」調査の回答者に重みをつけ直して、全体の平均を推定します。", "unverified": "シミュレーションや実データの結果は未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "事後分布の併合で速いベイズ逐次変化点検出", "title": "Bagel: A Fast Bayesian Online Changepoint Detection Algorithm for Linear Models via Posterior Merging", "url": "https://arxiv.org/abs/2611.03230", "authors": "Ziyang Yang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Yang, Z., Fearnhead, P., & Grose, D. (2026). Bagel: A Fast Bayesian Online Changepoint Detection Algorithm for Linear Models via Posterior Merging (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03230", "why": "線形モデルのベイズオンライン変化点検出を高速化するアルゴリズム。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形モデルのベイズ逐次変化点検出を、事後分布の併合で高速化するアルゴリズムBagelを示した（抄録）。", "p3": "平均や傾きの変化と季節効果などの共通構造を含む回帰モデルの類について、変化の有無と時点の事後分布を統一的に計算・更新する方法を示し、素朴な実装では計算量が線形に増える問題を併合で抑える（抄録）。", "p5": "抄録の範囲では計算量削減の具体的な結果は未確認。", "fun": "機械の振動や売上の推移を見ていて、「いつ何かが変わったか」をその場で見つけたい場面は多くあります。ベイズの方法は「変わった確率」を示せますが、データが増えるほど計算が重くなります。この研究は、似た候補をまとめていくことで、計算を軽くしたまま判断できるようにしました。", "unverified": "計算速度と検出精度の数値は未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "予測が現実を変える下での統計的推測", "title": "Statistical Inference under Performativity: From Policy Feedback to Self-Evolving Systems", "url": "https://arxiv.org/abs/2611.00438", "authors": "Tianwei Gao ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Gao, T., Wen, G. G., Zhong, H., Lei, L., Su, W., & Deng, Z. (2026). Statistical Inference under Performativity: From Policy Feedback to Self-Evolving Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00438", "why": "予測に基づく意思決定がデータ生成を変える状況での推測の枠組み。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "予測にもとづく決定がデータの生成過程を変える「遂行性」のもとでの統計的推測の枠組みを示した（抄録）。", "p3": "繰り返しのリスク最小化と繰り返しの勾配降下について、固定した展開回での中心極限定理を示し、共分散の再帰式を導いた（抄録）。", "p5": "以前の予測器の推定誤差が後のデータ分布に影響して伝わる仕組みを扱える推測の方法を示した（抄録。数値例は未確認）。", "fun": "天気予報は天気を変えませんが、渋滞予報はみんなが道を変えるので渋滞そのものを変えます。予測が現実を変え、その現実で次の予測を学ぶ、という堂々めぐりです。AIが自分の作ったデータで学び直す時代に、そうした循環の中でも誤差の大きさを正しく見積もる方法が必要だという問題意識です。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "因果推論のためのレコードリンケージ", "title": "Causal Record Linkage", "url": "https://arxiv.org/abs/2611.00760", "authors": "Kayan\\'e Robach ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Robach, K., Hof, M. H., van de Wiel, M. A., & van der Pas, S. L. (2026). Causal Record Linkage (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00760", "why": "複数のデータ源の結合誤りが因果効果の推定に与える影響を扱う方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のデータ源を結合するレコードリンケージが、因果効果の識別の仮定とどう衝突するかを示した（抄録）。", "p3": "リンケージの誤りが因果の枠組みのどの仮定を脅かすかを理論的に調べた（抄録）。", "p5": "リンケージの誤りは主に一致性（consistency）を脅かし、結合データの食い違いによる減衰バイアスを生む。結合を厳しくすると今度は標本選択のバイアスが生じる（抄録）。", "fun": "名前や誕生日で別々の名簿をつなぐと、ときどき別人どうしがつながってしまいます。すると「薬を飲んだ人」と「その人の結果」がずれ、効果が実際より小さく見えます。かといって確実な人だけつなぐと、今度はつなぎやすい人ばかりが残ります。どちらに転んでも偏る板ばさみを整理した研究です。", "unverified": "提案する対処法の詳細は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "GRPOでは学習データのずれが効く", "title": "Dataset Mismatch Matters in Group Relative Policy Optimization for Reinforcement Learning from Verifiable Rewards", "url": "https://arxiv.org/abs/2611.00586", "authors": "Zhen-Yu Zhang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Zhang, Z.-Y., Zhang, J., Yao, H., Niu, G., & Sugiyama, M. (2026). Dataset Mismatch Matters in Group Relative Policy Optimization for Reinforcement Learning from Verifiable Rewards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00586", "why": "検証可能な報酬による強化学習で、データセットの不一致が性能を左右することを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "検証可能な報酬の強化学習（GRPO）で、学習データとテストデータの分布のずれを考慮した選択的ロールアウトの必要性を示した（抄録）。", "p3": "既存の選択的ロールアウトは学習側の学習動態だけで学習プロンプトの分布を最適化する。法やプライバシーの制約でテスト側に通常アクセスできない状況で、分布のずれを扱う方法を提案（抄録）。", "p5": "抄録の範囲では提案法の結果は未確認。", "fun": "試験勉強で、過去問ばかり解いていると、本番の出題傾向がずれたときに弱くなります。AIの強化学習でも同じで、どの練習問題を何回解かせるかの選び方が大切です。この研究は、本番の問題を直接見られない状況でも、そのずれを意識して練習の配分を決める必要があることを示しました。", "unverified": "提案法の具体的な仕組みと効果の大きさは未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "RLVRで汎化する推論戦略と汎化しない戦略", "title": "Not All Reasoning Generalizes: A Case Study on Learning Generalizable Reasoning Strategies in RLVR", "url": "https://arxiv.org/abs/2611.03627", "authors": "Ziqi Pang ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Pang, Z., & Wang, Y.-X. (2026). Not All Reasoning Generalizes: A Case Study on Learning Generalizable Reasoning Strategies in RLVR (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03627", "why": "検証可能な報酬の強化学習で、どの推論戦略が汎化するかを事例で検証。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "検証可能な報酬の強化学習が、分布内の課題は解けても汎化しない推論戦略を教えてしまう失敗を示した（抄録）。", "p3": "全単射でない文字列関数fについてf(x)=yとなる複数のxを見つける方程式の課題を作り、推論戦略を観察でき、解の数やyの長さで易から難への分布外のずれを定義できる設定で調べた（抄録）。", "p5": "RLVRがモデルに分布内の課題を高い精度で解かせる一方で、汎化しない戦略を身につけさせる微妙な失敗があることを示した（抄録。数値は未確認）。", "fun": "九九を丸暗記した子は、九九の範囲では満点でも、二けたのかけ算になると手が止まります。AIも「正解ならごほうび」という学び方だけだと、丸暗記のような近道を覚えることがあります。この研究は、解き方そのものが見える問題を作って、どの学び方なら応用が利くかを確かめました。", "unverified": "汎化を促す方法の効果の大きさは未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "表形式基盤モデルTabAbaxの技術報告", "title": "TabAbax: A Tabular Foundation Model Technical Report", "url": "https://arxiv.org/abs/2611.00562", "authors": "Zhixiong Cheng ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Cheng, Z., Gao, X., Han, S., Suo, J., & Wang, Z. (2026). TabAbax: A Tabular Foundation Model Technical Report (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00562", "why": "学習なしで未知の表データを予測する表形式基盤モデルの報告。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式基盤モデルの改良を、合成事前学習の事前分布と列・行の符号化器に集中させたTabAbaxを報告した（抄録）。", "p3": "TabICLv2を土台に、合成事前学習の事前分布の質と複雑さを高め、行の前に特徴間の相互作用を強める2段の列・行スタックを入れた（抄録）。", "p5": "文脈内学習のTransformerを深くしても効果が小さいという既存の知見に基づく設計で、上流の2つの部品に改善の余地があるとした（抄録。性能の数値は未確認）。", "fun": "表計算のようなデータを、問題ごとに学習しなくても見本を見せるだけで予測するAIがあります。この研究は、AIの「頭」を大きくするより、練習に使う作り物のデータと、列や行の読み取り方を工夫するほうが効くと考えて改良しました。どこに伸びしろがあるかを見極めた設計です。", "unverified": "ベンチマークの成績は未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "完全に公開されたエージェント基盤モデルAxion 1.0", "title": "Axion 1.0: Open Agent Foundation Models, Simplified", "url": "https://arxiv.org/abs/2611.03233", "authors": "Yuqi Jia ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Jia, Y., Tian, Y., Zheng, J., Liang, Y., Sun, J., Zhao, M., & Fu, D. (2026). Axion 1.0: Open Agent Foundation Models, Simplified (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03233", "why": "幅広いエージェント能力を持つ完全公開の基盤モデル。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "簡単な3段階の学習だけで幅広いエージェント能力を持つ、完全に公開された基盤モデルAxion 1.0を示した（抄録）。", "p3": "2つの軽い教師ありファインチューニングと強化学習の3段階で、専用の中間学習、DPO、オンポリシー蒸留を使わない。第1段階では基盤モデル自身の成功した解法に基づき、難しい問題を合成して敵対的に強化する（抄録）。", "p5": "抄録の範囲ではベンチマークの数値は未確認。", "fun": "強いAIを作るには、複雑な手順を何段も重ねるのが当たり前になっていました。この研究は、手順を3つに絞っても十分強くなることを示そうとしています。しかも作り方を全部公開しているので、ほかの研究者が同じものを作って確かめられるのが大事な点です。", "unverified": "他モデルとの比較結果は未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "AIエージェントをチームメイトとして測る", "title": "Measuring AI Agents as Teammates with Collaborative Intelligence", "url": "https://arxiv.org/abs/2611.02633", "authors": "Sean Wu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-03", "apa": "Wu, S., Pappu, A., Zou, J., Kim, Y., Mao, Y., Zhou, H., Yu, J., Chen, J., & Zou, J. (2026). Measuring AI Agents as Teammates with Collaborative Intelligence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02633", "why": "単独性能ではなく人との協働での知能を測る評価法。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントがチームメイトとしてどれだけうまく働くかを測るベンチマークを作った（抄録）。", "p3": "人のチーム研究にならい、危険な近道を断ることから、弱いモデルの仕事を確かめることまで、チームワークの8次元にわたる240課題からなる協働知能ベンチマークを作った（抄録）。", "p5": "抄録の範囲では各モデルの成績は未確認。", "fun": "一人で100点を取る生徒が、グループ活動でも頼れるとは限りません。AIも同じで、これまでは単独の成績ばかり測られてきました。この研究は、「仲間の間違いに気づくか」「危ない近道を止められるか」など、チームの一員としての力を測る問題集を作りました。", "unverified": "評価したモデルと結果は未確認。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "アウトストルメンタル変数回帰", "title": "Outstrumental Variable Regression", "url": "https://arxiv.org/abs/2611.00266", "authors": "Felix Schur ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Schur, F., Kühne, L., von Kügelgen, J., & Peters, J. (2026). Outstrumental Variable Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00266", "why": "観測されない交絡がある場合の処置効果推定の新しい変数の使い方。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "処置の分布が変わらなくても、結果の仕組みが環境ごとに変われば因果効果を識別できることを示した（抄録）。", "p3": "アウトストルメンタル変数回帰（OVR）を提案し、第1段階として各環境でXを与えたYの条件付き期待値を計算する3段階の手順をとる（抄録）。", "p5": "操作変数法が処置の外生的な変動を使うのに対し、結果側の環境間の変動を使って識別できることを示した（抄録。残りの手順は抄録で切れている）。", "fun": "薬の効果を知るために、ふつうは「薬の飲み方が偶然ばらつく」状況（操作変数）を探します。この研究は逆に、「薬の飲み方は同じだが、効き方の背景が地域ごとに違う」状況でも効果を割り出せることを示しました。原因の側ではなく結果の側の変化を使う、という発想の転換です。", "unverified": "手順の第2・第3段階と識別条件の詳細は未確認。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "因果探索には明示的な認識基準が要る", "title": "Causal discovery needs explicit epistemic standards", "url": "https://arxiv.org/abs/2611.03166", "authors": "Harald Kugler ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Kugler, H., Henckel, L., & Weichwald, S. (2026). Causal discovery needs explicit epistemic standards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03166", "why": "多数ある因果探索アルゴリズムを選ぶための原則を提案。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多数ある因果探索アルゴリズムを比べ、選ぶための共有された認識の基準がないと論じた（抄録）。", "p3": "手法の比較に使われる識別可能性・一致性・ベンチマークの3つの観点を検討し、それぞれが検証できないデータ生成過程の仮定を持ち込むことを示す（抄録）。", "p5": "識別可能性の仮定は原理より慣習で選ばれがちで、一様な一致性にはさらに検証できない仮定が要ることを示した（抄録）。", "fun": "データから「何が何の原因か」を自動で見つける道具は、たくさん作られています。でも、どの道具が良いかを決める物差し自体があいまいだ、とこの論文は指摘します。物差しの裏にある前提が確かめられないまま「慣れているから」で選ばれている、という耳の痛い問題提起です。", "unverified": "提案する基準の具体的な内容は未確認。"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "因果の仮定違反に対する一般的な感度分析", "title": "A General Approach for Assessing Sensitivity to Violations of Causal Assumptions", "url": "https://arxiv.org/abs/2611.02239", "authors": "Guilherme Duarte", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Duarte, G. (2026). A General Approach for Assessing Sensitivity to Violations of Causal Assumptions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02239", "why": "さまざまな因果の仮定の違反に適用できる感度分析の一般的方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "特定の設計に限らず、幅広い離散の因果モデルと推定対象に使える感度分析の枠組みを示した（抄録）。", "p3": "仮定を緩める母集団の最大割合の関数として因果推定対象の鋭い上下限を導く。一般化した主層別の考え方で、仮定・推定対象・データを多項式の制約に翻訳する（抄録）。", "p5": "既存の感度分析が個別の設計向けに作られている限界を、一般的な枠組みで扱えるようにした（抄録。適用例の結果は未確認）。", "fun": "因果の結論は、いくつかの前提が正しいことに支えられています。では「前提が全体の何割で破れていたら結論がひっくり返るか」。この研究は、その問いに多くの場面で共通に答えられる方法を作りました。結論の「もろさ」を一つの数字で語れるようにする試みです。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "干渉下でミニマックス最適な静的推定量", "title": "Minimax-Optimal Static Estimators Under Interference", "url": "https://arxiv.org/abs/2611.02048", "authors": "Arthur Delarue ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Delarue, A., & Lobel, I. (2026). Minimax-Optimal Static Estimators Under Interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.02048", "why": "無作為化実験で単位間の干渉があるときの全体処置効果の推定。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "単位間の干渉がある無作為化実験で、全体処置効果のミニマックス最適な静的推定量を導いた（抄録）。", "p3": "結果と干渉が有界な関数の類から敵対者が結果関数を選ぶミニマックスの枠組みで、ある単位の処置が他の単位の結果に与える最大の影響をスカラーδで表す（抄録）。", "p5": "幅広い干渉の構造に頑健な推定量を導き、干渉が大きい場合の性質も示した（抄録。後半は抄録で切れている）。", "fun": "ワクチンの効果を調べるとき、隣の人が打つと自分も感染しにくくなるので、一人ずつの比較では全体の効果を見誤ります。この「干渉」の形が分からなくても、最悪の場合でも大きく外さない推定の方法を、ゲームの相手を想定する考え方で導きました。", "unverified": "干渉が大きい場合の結論は未確認。"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "測定誤差と非線形交絡：SEM対二重機械学習", "title": "Measurement Error and Nonlinear Confounding: Structural Equation Modeling Versus Double Machine Learning", "url": "https://arxiv.org/abs/2611.01375", "authors": "Eunjeong Song ほか", "venue": "arXiv", "date": "Tue, 03 Nov 2026", "apa": "Song, E., & Hong, S. (2026). Measurement Error and Nonlinear Confounding: Structural Equation Modeling Versus Double Machine Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.01375", "why": "誤差のある指標で測った潜在交絡の調整で、SEMとDMLを比べる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "誤差のある指標で測った潜在交絡の調整で、SEMと二重機械学習のどちらの偏りが小さいかの境目を導いた（抄録）。", "p3": "測定誤差を補正するが関数形の指定が要る構造方程式モデリング（SEM）と、関数形を学ぶが測定誤差を無視する二重機械学習（DML）の母集団の偏りを導き、46条件のモンテカルロ実験で確かめた（抄録）。", "p5": "DMLの方が線形SEMより偏りが小さくなる合成信頼性の境目（クロスオーバー信頼性）は、交絡の非線形の割合に依存し、共変量が交絡を予測すると下がる（抄録）。", "fun": "体重計が不正確でも、何度も量れば誤差は補正できます。一方、体重と健康の関係が曲線なら、まっすぐな線を仮定すると外れます。この研究は「測り方の誤差」と「関係の形の誤り」のどちらを重く見るべきかを、物差しの信頼性という一つの数で判断できるようにしました。", "unverified": "なし"}}, {"id": "pn44", "rank": 44, "field": "交通・都市計画", "headline": "空間均衡で交通改善を評価する", "title": "Evaluating transport improvements in spatial equilibrium", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141748", "authors": "Redding, Stephen J.", "venue": "RePEc NEP", "date": "2026-11-02", "why": "定量的都市モデルで交通改善の効果を評価する方法の整理。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "交通改善の評価で、従来の費用便益分析と定量的都市モデルの結果が違うことを比べて示した（抄録）。", "p3": "部分均衡の従来の費用便益分析、市場アクセスの変化に基づく十分統計量の方法、モデルに基づく反実仮想の3つで、同じ交通改善を評価して比べた（抄録）。", "p5": "定量的都市モデルは都市内の経済活動の再編を予測する（抄録。評価額の違いは抄録で切れており未確認）。", "fun": "新しい鉄道ができると、移動時間が縮むだけではありません。人が住む場所や会社の場所も動き、街の形が変わります。従来の評価は「時間の節約」だけを数えがちでした。この研究は、街全体の組み替えまで含めると評価がどう変わるかを、三つの方法を並べて比べました。", "unverified": "評価額の比較の数値は未確認。"}}, {"id": "pn45", "rank": 45, "field": "交通・都市計画", "headline": "交通政策の受容をファクトリアル実験で測る", "title": "Acceptance of transport policies: A factorial survey experiment in the German Longitudinal Environmental Study (GLEN)", "url": "https://doi.org/10.31235/osf.io/dyz7c", "authors": "Christiane Bozoyan ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Bozoyan, C., Schmiedeberg, C., & Best, H. (2026). Acceptance of transport policies: A factorial survey experiment in the German Longitudinal Environmental Study (GLEN). https://doi.org/10.31235/osf.io/dyz7c", "why": "ドイツの縦断環境調査での実験から、交通政策の受容を分析。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ドイツで議論中の、内燃機関車から電気自動車への移行を促す交通政策の受容を測るファクトリアル調査実験を報告した（抄録）。", "p3": "2025年1〜2月のドイツ縦断環境調査（GLEN）の開始調査の一部として、政策介入の組み合わせを変えるファクトリアル調査実験を行った（抄録）。", "p5": "本報告は実験の記録で、抄録の範囲では受容の結果は未確認。", "fun": "「ガソリン車に税をかける」「電気自動車に補助金を出す」など、政策は組み合わせ方で賛成の度合いが変わります。ファクトリアル調査は、条件をいろいろに組み替えた架空の政策を見せて、どの要素が賛否を動かすかを切り分けます。政策づくりの前に、人々の受け止め方を試す方法です。", "unverified": "実験の結果は未確認（記録の報告）。"}}, {"id": "pn46", "rank": 46, "field": "交通・都市計画", "headline": "電動モビリティの見た目が路上の弱さを左右", "title": "Visual Properties of E-Mobility Devices Shape Their On-Road Vulnerability: Effects of Size and Speed", "url": "https://doi.org/10.31234/osf.io/zy8gv_v2", "authors": "Laura Wang ほか", "venue": "PsyArXiv", "date": "2026-11-02", "apa": "Wang, L., Jarvis, M., Du Plessis, E., Stephen, A., Jones, B., Haworth, N., & Hogendoorn, H. (2026). Visual Properties of E-Mobility Devices Shape Their On-Road Vulnerability: Effects of Size and Speed. https://doi.org/10.31234/osf.io/zy8gv_v2", "why": "大きさと速さの見え方が、運転者の電動モビリティの認知に与える影響。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "電動キックボードなどの電動モビリティは、小さく速いために運転者の到着予測を系統的に誤らせるかを調べた（抄録）。", "p3": "自然な動画の刺激を使い、観察者が電動モビリティを他の一般的な車両と比べて判断するときの系統的な偏りを調べた（抄録）。", "p5": "抄録の範囲では、大きさと速さの効果の結果は未確認。", "fun": "交差点で右折するとき、運転者はわずか一瞬で「向こうの車が来るまでに曲がれるか」を判断します。小さな物は遠くに、ゆっくりに見えがちです。電動キックボードは小さいのに速いので、この直感がだまされやすいのではないか、という身近で大事な問いです。", "unverified": "実験の結果は抄録で切れており未確認。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "結果を知りながら投票する：ペルー大統領選", "title": "Voting When You Already Know the Results: Electoral Information and Strategic Coordination in Peru’s 2026 Presidential Election", "url": "https://doi.org/10.31235/osf.io/dzntx", "authors": "Alejandro Plaza", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Plaza, A. (2026). Voting When You Already Know the Results: Electoral Information and Strategic Coordination in Peru’s 2026 Presidential Election. https://doi.org/10.31235/osf.io/dzntx", "why": "開票途中の情報が有権者の戦略的な調整を促すかを分析。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "開票途中の情報を知った有権者は、思想の近い範囲で最も有力な候補に寄る「思想に制約された調整」をすると論じ、自然実験で検証した（抄録）。", "p3": "2026年のペルー大統領選で、運営の失敗により一部の投票所が部分的な結果の公表後に1日遅れて投票した自然実験を使う（抄録）。", "p5": "抄録の範囲では推定結果は未確認。", "fun": "途中経過を知ってから投票できたら、人は「勝ち馬」に乗るでしょうか。この研究は、ペルーで一部の投票所が一日遅れたという偶然を使いました。人は全国の首位に流れるのではなく、自分の考えに近い候補の中で一番有力な人に票を寄せる、という仮説を確かめています。", "unverified": "推定結果は未確認。"}}, {"id": "pn48", "rank": 48, "field": "政治学", "headline": "選挙不正検出モデルを韓国20年の選挙で検証", "title": "Fraud Detection Without Specificity: A Null-Calibration Evaluation of the eforensics Model on Two Decades of Korean Elections", "url": "https://doi.org/10.31235/osf.io/6ka47", "authors": "Minseong Kim", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Kim, M. (2026). Fraud Detection Without Specificity: A Null-Calibration Evaluation of the eforensics Model on Two Decades of Korean Elections. https://doi.org/10.31235/osf.io/6ka47", "why": "ベイズ混合モデルによる選挙不正検出の特異度を、帰無較正で評価。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "集計データだけから不正を判定する選挙鑑識モデルを、不正のない合成対照で検証し、特異度がないことを示した（抄録）。", "p3": "eforensicsの準二項ロジスティックモデルを2002〜2025年の韓国の選挙に228回当てはめ、各実データの投票率に合わせて独立に作った不正のない合成対照2種と比べた（抄録）。", "p5": "題名のとおり、不正のないデータでも不正を検出してしまい、特異度を欠くことを示した（抄録の題名と要旨。率の数値は未確認）。", "fun": "病気の検査が、健康な人まで「陽性」と判定するなら役に立ちません。この研究は、選挙の不正を見つけるとされる統計モデルに、わざと不正のない作り物のデータを与えました。すると、そこでも「不正あり」と出たのです。道具を使う前に、まず白紙の答案で試す大切さが分かります。", "unverified": "誤検出の割合は未確認。"}}, {"id": "pn49", "rank": 49, "field": "政治学", "headline": "政治学のための順位データ", "title": "Ranking Data in Political Science", "url": "https://doi.org/10.31235/osf.io/5t2f9", "authors": "Yuki Atsusaka ほか", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Atsusaka, Y., & Singh, S. (2026). Ranking Data in Political Science. https://doi.org/10.31235/osf.io/5t2f9", "why": "順位づけデータを政治学で使う方法と注意点の整理。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "主要な政治学誌の研究に基づく、初の大規模な政治的順位データのデータベースを作った（抄録）。", "p3": "統計学・機械学習のPrefLibのような既存の基盤は社会科学の累積的研究向けに作られていないため、政治学の研究から順位データを集めて整理した（抄録）。", "p5": "抄録の範囲では収録件数などの数値は未確認。", "fun": "「好きな政党を順に並べてください」という質問から得られる順位のデータは、賛否の二択より多くを語ります。でも研究ごとにばらばらに保存され、比べにくいのが現状でした。この研究は、それらを一か所に集めて誰でも使えるようにしました。研究の積み重ねを助ける土台づくりです。", "unverified": "収録件数は未確認。"}}, {"id": "pn50", "rank": 50, "field": "政治学", "headline": "反汚職の訴えはいつ支持につながるか", "title": "When Does Anticorruption Pay off? Voter Support for Anticorruption Efforts in Latin America", "url": "https://doi.org/10.31235/osf.io/qvhxy", "authors": "Gustavo Guajardo", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Guajardo, G. (2026). When Does Anticorruption Pay off? Voter Support for Anticorruption Efforts in Latin America. https://doi.org/10.31235/osf.io/qvhxy", "why": "中南米での反汚職を掲げる政治家への有権者の支持を分析。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "政治家の反汚職の訴えは、文脈・発信者・政策の中身から本気度を読み取られて評価されることを示した（抄録）。", "p3": "コロンビアとメキシコでの2つの独自の調査実験で、汚職の文脈、訴える人、政策の内容を変えた（抄録）。", "p5": "最近の汚職スキャンダルがないとき、提案者が野党の政治家のときに評価が好意的だった（抄録。その他の条件は抄録で切れている）。", "fun": "「汚職をなくします」と言うだけなら誰でもできます。有権者は、誰がどんな状況でそれを言うかを見て、本気かどうかを判断しています。この研究は、スキャンダルの直後の与党の訴えより、野党の訴えのほうが信じられやすいことを実験で示しました。言葉の中身より、言う人の立場が効くのです。", "unverified": "政策内容の効果は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "橋梁振動AI診断794研究の成熟度を監査", "title": "AI-Enabled Bridge Nondestructive Testing Using Vibration and Dynamic Response: An Investigation of Diagnostic Capability and Evidence Maturity", "url": "https://doi.org/10.3390/ndt4040033", "authors": "Muhammad Ziad Bacha ほか", "venue": "NDT", "date": "2026-11-03", "apa": "Bacha, M. Z., Sassu, M., & Puppio, M. L. (2026). AI-Enabled Bridge Nondestructive Testing Using Vibration and Dynamic Response: An Investigation of Diagnostic Capability and Evidence Maturity. Ndt, 4(4), 33. https://doi.org/10.3390/ndt4040033", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "振動・動的応答をAIで解釈する橋梁の非破壊検査・SHMの794研究を、診断能力と検証の現実性・成熟度で体系的に符号化し、診断の幅は広いが実橋への展開に要る証拠が乏しいことを示した（抄録）。", "p2": "AI手法のデータセット上の精度は、その方法が実際の橋で使える準備ができていることを示さない。どの水準の証拠がどれだけあるかの全体像はなかった（抄録）。", "p3": "2026年8月にScopus、Web of Science、IEEE Xploreを検索し、再現率の監査を加えて794の学術誌の研究を集め、診断能力（推論・検出・予後など）、検証の現実性、損傷の真正性、一般化、時間的な成熟、工学的な利用の成熟、5つの信頼性の属性で符号化した（抄録）。", "p4": "10の感度分析のシナリオ（52研究の全文での確認を含む）で傾向の頑健性を確かめ、元のスクリーニングと350記録の独立した人のスクリーニングの一致をκで評価した（抄録）。", "p5": "推論と検出が研究の67.8%、予後は0.6%だった。数値による検証が最大で45.5%、供用中の検証は30.7%。実物大の確認された物理的変化は61研究だが、供用中の監視と組み合わせたのは6研究（0.8%）。未知の橋への転移は16研究（2.0%）、年単位の証拠は20研究（2.5%）、維持管理の意思決定支援は1研究（0.1%）で、65.2%は信頼性の属性を1つも示さなかった（抄録）。", "p6": "元のスクリーニングと人の独立スクリーニングの一致は中程度（κ=0.43）で、対象になるべき研究の一部が漏れている可能性があると著者は認める（抄録）。", "fun": "AIで橋の傷みを見抜く研究は、800本近くもあります。でも、その多くはコンピュータの中の模型や実験室の結果で、本物の橋で使いながら確かめたのは一部、実物大の損傷を本物の監視で捉えたのはわずか6本でした。「テストで高得点」と「現場で使える」の間には大きな溝がある、ということを数字で示した研究です。", "unverified": "本文が読めず、符号化の基準の詳細と感度分析の結果は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "IMUで層間変形角とモード形の微分を推定", "title": "Structural Monitoring Strategies of Buildings Using Inertial Measurement Units for Drift Ratio Estimation, Mode‐Shape Derivatives, and Damage Diagnosis", "url": "https://doi.org/10.1155/stc/8927258", "authors": "Chieh-Yu Liu ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-03", "citescore": 10.3, "citescore_year": "2025", "apa": "Liu, C.-Y., Chuang, C.-H., & Chang, C.-M. (2026). Structural Monitoring Strategies of Buildings Using Inertial Measurement Units for Drift Ratio Estimation, Mode‐Shape Derivatives, and Damage Diagnosis. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/8927258", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "加速度に加えて角速度を測るIMUで、建物の層間変形角の推定、連続的なモード形の傾き・曲率の再構成、損傷診断を行う構造ヘルスモニタリングの方法を示した（抄録）。", "p2": "加速度計だけの振動ベースの方法は、層間変形角のような変位に関わる指標を推定しにくく、分布した損傷への感度も低い（抄録）。", "p3": "入力はまばらな位置のIMUの並進と角速度、出力は層間変形角、モード形の傾きと曲率、損傷の位置と程度。角速度を積分して回転応答を得、境界条件つきの多項式当てはめで連続的なモード形の傾き・曲率を再構成し、せん断と曲げが支配的な成分に分けて統合ひずみエネルギー損傷指標（ISEDI）に組み込み、逐次フィルタで複数の損傷箇所の干渉を減らす（抄録）。", "p4": "5層の模型建物の振動台実験で変位計と比べ、せん断・曲げ・混合が支配的な構造の実験と数値解析で損傷の位置と程度の推定を検証した（抄録）。", "p5": "IMUは並進と回転の応答を高精度で捉え、二乗平均平方根誤差は0.04 m/s²未満、変形角の偏差は変位計に比べ5%未満だった。提案法は95%を超える損傷位置の特定精度と頑健な変形角の推定を達成した（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：検証は模型実験と数値解析で、実建物の長期監視や環境変動の影響は抄録の範囲では示されていない。", "fun": "建物が揺れたとき、加速度計は「どれだけ速さが変わったか」は分かっても、「どれだけ傾いたか」は苦手です。この研究は、スマホにも入っている回転を測るセンサを使い、床ごとの傾きを直接とらえました。少ないセンサの点から建物全体の曲がり方を滑らかに描き直し、壊れた場所を95%以上の精度で当てています。", "unverified": "本文が読めず、損傷のシナリオ数や逐次フィルタの詳細は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "演算子に合わせたモード空間で圧密逆解析", "title": "Operator-Adapted Modal Spaces for Reduced-Order Forward Modeling and Parameter Inversion in Layered Consolidation", "url": "https://doi.org/10.3390/buildings16214360", "authors": "Shuai Zhang ほか", "venue": "Buildings", "date": "2026-11-03", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Zhang, S., Hu, J., Shi, J., Zhao, S., Lin, M., & Dang, H. (2026). Operator-Adapted Modal Spaces for Reduced-Order Forward Modeling and Parameter Inversion in Layered Consolidation. Buildings, 16(21), 4360. https://doi.org/10.3390/buildings16214360", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "多層地盤の圧密方程式の逆解析で、層の位置と相対的な透水係数の分布だけから作る「演算子に適応したモード空間」を2つ構成し、少ないモード数で高い精度の縮約モデルと係数の同定ができることを示した（抄録）。", "p2": "間隙水圧の監視から各層の圧密係数を同定するには、パラメータ探索中に圧密方程式を何度も解く必要があり、前向き計算の空間は逆解析を通して固定でき、層の境界の流束条件にも合う必要がある。古典的な層ごとの固有基底と大域的な正弦の空間は、それぞれ一方しか満たさない（抄録）。", "p3": "透水演算子の重みなし固有値問題で作る基底と、鉛直透水係数に比例する貯留の重みつき一般化固有値問題で作る「凍結貯留」基底の2つを作る。どちらも層の位置と相対的な透水係数だけに依存し、絶対値には依存しない（抄録）。", "p4": "高い透水係数のコントラストを持つ4層の構成で、投影・伝播・全次元の有限要素の参照解を統一して、3つの空間を比べ、同じ空間の中で直接の行列伝播＋有界最小二乗と、時間係数のニューラルな表現を比べた（抄録）。", "p5": "相対誤差10⁻²に達するのは、演算子に適応した空間が20モード、正弦の空間が80モードだった。初期の時間（t<10⁻³）の後、適応した空間の誤差はモード数Kに対しK⁻²·¹〜K⁻⁴·¹で減り、正弦の空間は約K⁻¹だった。透水係数のコントラストが大きいほど縮約の利得が増え、行列伝播＋有界最小二乗のほうがニューラルな表現よりパラメータと場の誤差が小さかった（抄録）。", "p6": "2つの適応基底のどちらも一様に精度が高いわけではないと著者は述べる（抄録）。解釈：検証は1つの4層の構成の数値実験で、実際の監視データでの同定は抄録の範囲では示されていない。", "fun": "地面の下の何層もの土が、水が抜けてゆっくり沈む様子を計算するとき、層ごとの水の通りやすさの違いが計算を難しくします。この研究は、その違いをあらかじめ取り込んだ「型」を作っておくことで、ふつうの型の4分の1の数で同じ精度に達しました。答えを探すたびに重い計算をしなくて済むので、観測から土の性質を逆算するのが速くなります。", "unverified": "本文が読めず、計算時間の比較などは未確認。"}}, {"id": "jr04", "rank": 4, "headline": "潜在空間のアンサンブルKFで強非線形同化", "title": "Latent Autoencoder Ensemble Kalman Filter for Nonlinear Data Assimilation", "url": "https://doi.org/10.1137/26m1850230", "authors": "Xin T. Tong ほか", "venue": "SIAM Journal on Scientific Computing", "date": "2026-11-03", "sjr": 1.618, "citescore": 4.4, "citescore_year": "2025", "apa": "Tong, X. T., Wang, Y., & Yan, L. (2026). Latent Autoencoder Ensemble Kalman Filter for Nonlinear Data Assimilation. SIAM Journal on Scientific Computing, 48(6), C1403–C1436. https://doi.org/10.1137/26m1850230", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "強い非線形の系のデータ同化で、オートエンコーダの潜在空間に安定な線形の時間発展と観測写像を学習し、その中でカルマンフィルタの予報と解析を行う方法（LAE-EnKF）を示した（抄録）。", "p2": "アンサンブル・カルマンフィルタ（EnKF）は高次元の同化で広く使われるが、強い非線形の力学ではカルマンの更新と系の振る舞いの構造の不一致で性能が落ちる。既存の潜在空間の方法は制約のない非線形の潜在力学に頼る（抄録）。", "p3": "非線形のエンコーダ・デコーダと、安定な線形の潜在発展作用素、整合した潜在の観測写像を同時に学習し、潜在座標で閉じた線形の状態空間モデルを作る。これでカルマンフィルタの枠組みとの整合を取り戻す（抄録）。", "p4": "代表的な非線形・カオスの系で、部分的・まばら・非線形な観測の下で、標準のEnKFと関連する潜在空間の方法と比べた（抄録）。", "p5": "LAE-EnKFは標準のEnKFや関連する潜在空間の方法より正確で安定な同化を示した（抄録。具体的な誤差の数値は抄録にない）。低次元の多様体上で線形の力学を学ぶことの理論的な分析と、潜在モデルの汎化誤差の上界も示した（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：線形の潜在力学で表せない系（分岐や強い間欠性）への適用範囲は残ると考えられる。", "fun": "天気のように複雑に動くものを、観測と計算を組み合わせて追いかけるのがデータ同化です。おなじみの方法は、まっすぐな関係を前提にしているので、曲がりくねった動きには弱いのです。この研究は、AIでうまく座標を変換して、変換後の世界では動きがまっすぐになるようにしてから、おなじみの方法を使いました。問題そのものを解きやすい形に言い換える発想です。", "unverified": "本文が読めず、対象の系と誤差の数値は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "回答者ごとに政策を検索して作る調査法", "title": "Retrieval-Augmented Surveys", "url": "https://doi.org/10.1017/pan.2026.10064", "authors": "Yamil Velez ほか", "venue": "Political Analysis", "date": "2026-11-03", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "apa": "Velez, Y., & Ewig, A. (2026). Retrieval-Augmented Surveys. Political Analysis, 1–16. https://doi.org/10.1017/pan.2026.10064", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（検索の方法§3.3、調査設計§4.1、表面的妥当性§4.2、議会への応用§4.5、考察§5）と抄録を読んだ", "preprint": false, "p1": "回答者が自由記述で挙げた最重要の争点を、政策データベースの具体的な法案と意味的な近さで結びつけ、回答者ごとに作った調査で代表の成否を測る「検索拡張型調査」を示した（抄録）。", "p2": "政策の代表を測る従来の調査は、決まった争点の質問群で条件づけるため、人々が本当に重視する争点と、制度が実際に扱う提案との対応を個人ごとに測れない（§2）。", "p3": "入力は回答者の自由記述の最重要争点（明確化の質問で立場を確かめる）、出力はその立場に最も近い3つの法案と、それへの支持の評価。立場と全法案を公開の埋め込みモデル（mxbai-embed-large-v1）で符号化し、コサイン類似度で最近傍を検索する。例：「原子力発電を支持する」と書いた人には、原子力の利用拡大の決議、原子力をグリーン電力と認める法案、先進原子力の許認可を簡素化する法案が示される（§3.3）。", "p4": "Verasightの全米成人2,000人（2024年10月）で、回答者自身の評価、専門家の手作業の監査、3週間後のパネルでの安定性、回答者ごとに作ったコンジョイント実験での候補者選択への効果の4つで妥当性を確かめ、第118議会の法案に適用した（§4.1）。", "p5": "最も近い法案を「おおむね」か「完全に」関心に応えると評価した人は69%、3つのうち少なくとも1つでは81%だった（§4.2）。最上位の支持の人の82%が3週間後もそこにとどまった（抄録）。立場を表明した人の77%は関心を満たす法案が議題に含まれていたが、本会議の審議以上に進んだ法案があるのは12%で、満たす法案の84%は委員会付託の後で止まり、成立は1%未満だった（§4.5）。", "p6": "著者は、争点を挙げられない回答者がいて代表の測定が難しいこと、エージェント型の検索は検索の質をわずかに上げるが遅延が長く、調査では脱落を招きうることを述べる（§5）。解釈：最近傍の判定は埋め込みモデルの性質に依存し、モデルの更新で結果が変わりうる。", "fun": "「あなたが一番大事だと思う政治の問題は？」と自由に書いてもらい、AIがその場で、国会に出ている法案の中から一番近いものを探して見せる調査です。多くの人の願いに合う法案は、実はすでに出されていました。でも、そのほとんどが委員会で止まっていて、法律になったのはごくわずか。声が届かないのは「議題にない」からではなく「途中で止まる」から、という発見です。", "unverified": "手作業の監査の一致率とコンジョイントの効果の大きさは読んでいない。"}}, {"id": "jr06", "rank": 6, "headline": "会計の比較可能性と共通株主の関係", "title": "Accounting Comparability and Common Owners", "url": "https://doi.org/10.1111/1467-8551.70124", "authors": "Maimuna Akter ほか", "venue": "British Journal of Management", "date": "2026-11-03", "sjr": 2.694, "citescore": 12.4, "citescore_year": "2025", "apa": "Akter, M., Chircop, J., Cumming, D., & Tarsalewska, M. (2026). Accounting Comparability and Common Owners. British Journal of Management. https://doi.org/10.1111/1467-8551.70124", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "米国企業で、会計の比較可能性が高いほど共通株主（同業の複数社を同時に保有する機関投資家）の保有が多いことを示し、その関係が情報の非対称性の低下によることを示した（抄録）。", "p2": "会計の比較可能性は情報の取得・処理の費用を下げて企業と投資家の情報の非対称性を減らす一方、共通株主のような洗練された投資家が使う私的な情報の優位を減らしうる。どちらの力が勝つかは実証の問題である（抄録）。", "p3": "入力は企業間の会計の比較可能性の指標と共通株主の保有、出力はその関係の向きと強さ。共通株主を一時的なものとそうでないものに分け、情報環境の強弱で比べる（抄録）。", "p4": "1999〜2021年の米国企業の標本を使い、追加の分析で関係の経路（情報の非対称性の低下）と、情報環境の弱い企業での違いを調べた（抄録）。", "p5": "会計の比較可能性は共通株主の保有、特に一時的でない共通株主の保有と正に関連した。この関係は情報の非対称性の低下によって生じ、情報環境が弱い企業でかなり強かった（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：比較可能性が保有を引き寄せるのか、共通株主が比較可能な会計を促すのかの因果の向きは、抄録の範囲では確定できない。", "fun": "同じ業界の会社の決算書が同じ書き方で作られていると、比べやすくなります。比べやすいと、情報を独り占めできる「通」の投資家の強みは減りそうです。ところが実際には、比べやすい会社ほど、同業の何社もの株を持つ大口投資家に好まれていました。情報の集めやすさの得が、強みを失う損を上回っていたのです。", "unverified": "比較可能性の指標の作り方と効果の大きさは未確認。"}}, {"id": "jr07", "rank": 7, "headline": "デジタル化はレバレッジの困窮効果を変えるか", "title": "Does digitalization modify the effect of leverage on financial distress? Evidence from logistic models with interaction effects", "url": "https://doi.org/10.24136/oc.4586", "authors": "Katarina Valaskova ほか", "venue": "Oeconomia Copernicana", "date": "2026-11-03", "sjr": 1.546, "citescore": 18.9, "citescore_year": "2025", "apa": "Valaskova, K., Gajdosikova, D., & Nagy, M. (2026). Does digitalization modify the effect of leverage on financial distress? Evidence from logistic models with interaction effects. Oeconomia Copernicana, 17(3), 977–1041. https://doi.org/10.24136/oc.4586", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社のサイトから取得できたのは抄録と参考文献で、本文の節は含まれていなかったため抄録を使用", "preprint": false, "p1": "ヴィシェグラード4か国の企業で、業種のデジタル化の度合いは、レバレッジや収益性が財務困窮に与える効果を体系的には変えないことを示した（抄録）。", "p2": "デジタル化は効率・柔軟性・回復力の源とされるが、企業を財務困窮から守るのか、伝統的な財務リスクの効果を変えるのかは分かっていない（抄録）。", "p3": "入力はORBISの2023年の企業の財務データと、Eurostatの国×業種のデジタル強度指数（DII）、出力は財務困窮の有無。交互作用つきの二項ロジスティック回帰を国×業種でクラスタ化した標準誤差で推定し、国ごとに異なる交互作用の傾きとその同等性の結合検定、平均限界効果で、DIIの水準ごとのレバレッジと困窮の関係を調べた（抄録）。", "p4": "スロバキア、チェコ、ポーランド、ハンガリーの46,909企業を対象とした（抄録）。", "p5": "レバレッジが困窮の最も強い財務的な決定要因で、統合したモデルではデジタル強度がレバレッジや収益性の効果を調整する頑健な証拠はなかった。レバレッジと困窮の強い正の関係はDIIのどの水準でも見られ、低いDIIと高いDIIの差は有意でなかった。一方で、特にレバレッジとDIIの関係に国間の有意な異質性があった（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：デジタル化は企業単位ではなく国×業種の指標で、1年の横断データのため、企業自身のデジタル化の効果や時間的な変化は捉えていない。", "fun": "デジタル化が進んだ業界の会社は、借金が多くても倒れにくいのでしょうか。4か国の約4万7千社を調べると、借金の多さが一番の危険信号である点は、デジタル化の進んだ業界でも遅れた業界でも変わりませんでした。ただし国によって効き方が違いました。「デジタルなら安心」と単純には言えない、という慎重な結果です。", "unverified": "財務困窮の定義と、国ごとの推定値は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "看護師と生成AIの協働が生む疎外と便宜行動", "title": "The dark side of nurse–generative AI collaboration in the workplace: unveiling work alienation and nurse expediency", "url": "https://doi.org/10.1186/s12912-026-05624-6", "authors": "Changde Chi ほか", "venue": "BMC Nursing", "date": "2026-11-03", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Chi, C., Jiang, H., Gong, G., Zhang, Y., Chen, J., Zhang, X., & Cai, X. (2026). The dark side of nurse–generative AI collaboration in the workplace: unveiling work alienation and nurse expediency. BMC Nursing. https://doi.org/10.1186/s12912-026-05624-6", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "看護師と生成AIの協働の強さが、仕事の意味の低下と情緒的消耗を通じて仕事からの疎外と結びつき、それが「便宜行動」（規則を回避する近道の行動）と強く結びつくことを示した（抄録）。", "p2": "生成AIの看護実践への導入は効率と意思決定の改善が期待される一方、疎外や逆生産的な行動といった負の側面と、その媒介の仕組み・個人の境界条件はほとんど検討されていない（抄録）。", "p3": "仕事の要求度-資源（JD-R）モデルに基づき、仕事の意味（認知の経路）と情緒的消耗（感情の経路）の二重の媒介と、生成AI不安による調整を仮定した調整つき媒介モデルを、偏最小二乗の構造方程式モデリング（PLS-SEM）で分析した（抄録）。", "p4": "仕事で生成AIを使ったことのある中国の複数の病院の登録看護師306人の横断的な調査で、協働・仕事の意味・情緒的消耗・疎外・便宜行動・生成AI不安を妥当性の確認された尺度で測った（抄録）。", "p5": "協働は仕事の意味と負に（β=−0.299、p<0.001）、情緒的消耗と正に（β=0.231、p=0.008）関連した。疎外への間接効果は仕事の意味経由（β=0.120）と消耗経由（β=0.071）でともに有意で、直接効果は有意でなかった。疎外は便宜行動と強く関連した（β=0.668）。生成AI不安は両方の第1段階を調整し（交互作用β=−0.262、β=0.166）、不安が高いほど関連が強かった（抄録）。", "p6": "著者は結論を横断的な中国の看護師の標本に限定している（抄録）。解釈：横断データのため因果の順序は確定せず、自己報告の共通方法バイアスの可能性がある。", "fun": "AIと一緒に働けば、仕事は楽になりそうです。ところが看護師への調査では、AIとの協働が多い人ほど「この仕事に意味がある」と感じにくく、疲れ切りやすい傾向がありました。そうした人は職場から心が離れ、規則をすり抜ける近道に走りやすくなります。特にAIに不安を感じる人ほど、その傾向が強く出ました。", "unverified": "本文が読めず、便宜行動の尺度の内容は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "サービス回復でのAI透明性は温かさ次第", "title": "The contingent effects of AI transparency in service recovery: a moderated mediation model of perceived warmth and competence", "url": "https://doi.org/10.1108/oir-08-2025-0646", "authors": "Yujie Chen ほか", "venue": "Online Information Review", "date": "2026-11-03", "citescore": 8.4, "citescore_year": "2025", "apa": "Chen, Y., Salahuddin, N., & Khamarudin, M. (2026). The contingent effects of AI transparency in service recovery: a moderated mediation model of perceived warmth and competence. Online Information Review, 1–17. https://doi.org/10.1108/oir-08-2025-0646", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "サービスの失敗の後にAIが判断の理由を示す「透明性」は、温かさと有能さの知覚を通じて回復の満足を高めるが、失敗が重大なときはその効果が消えることを示した（抄録）。", "p2": "AIがサービス回復を担う場面が増えているが、AIの判断過程を見せることが顧客の反応をどう変えるか、その仕組みと境界条件は分かっていない（抄録）。", "p3": "社会的認知理論に基づき、AIの透明性を判断の過程を明かす擬人化の手がかりととらえ、透明性→温かさ・有能さの知覚→回復の満足の並列媒介と、失敗の重大さによる調整を仮定した（抄録）。", "p4": "3つの場面想定の実験を行った。研究1（N=98）は透明性の直接効果、研究2（N=230）は温かさと有能さの並列媒介、研究3（N=284）は失敗の重大さの調整と条件つき間接効果を検証した（抄録）。", "p5": "AIの透明性は回復の満足を有意に高め、その効果は温かさと有能さを通じて間接的に働いた。失敗の重大さは両方の媒介への透明性の効果を調整し、温かさと有能さを通じた間接効果は重大さが低いときに有意で、高いときには有意でなかった（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：場面想定の実験で、実際のサービスの失敗と回復での行動（再購入や口コミ）は測っていない。", "fun": "注文を間違えたお店のAIが、「なぜこう判断したか」を説明してくれると、客は「ちゃんと考えてくれている」と感じて、温かさも頼もしさも上がりました。ところが失敗が大きいと、説明しても満足は上がりませんでした。小さなミスなら丁寧な説明で許せても、大きな失敗では説明だけでは足りない、という人間らしい反応です。", "unverified": "本文が読めず、効果量は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "孤独が強迫的購買を通じ消費者厚生を損なう", "title": "When Loneliness Becomes a Consumer Welfare Risk: Symptom‐Level and Neurocognitive Evidence From Compulsive Buying", "url": "https://doi.org/10.1111/joca.70082", "authors": "Miao‐wen Hu ほか", "venue": "Journal of Consumer Affairs", "date": "2026-11-03", "sjr": 1.043, "citescore": 7.8, "citescore_year": "2025", "apa": "Hu, M.-w., Hua, Y.-c., Wu, Z.-k., Lyu, W., Lu, J.-x., & Zheng, H. (2026). When Loneliness Becomes a Consumer Welfare Risk: Symptom‐Level and Neurocognitive Evidence From Compulsive Buying. Journal of Consumer Affairs, 60(4). https://doi.org/10.1111/joca.70082", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "孤独が強迫的購買と結びつく経路として、衝動買いの傾向という「購買の調節不全」の経路と、探索的な脳の経路（デフォルトモードネットワーク）を示した（抄録）。", "p2": "孤独は補償的な購買を通じて消費者の厚生を損なう危険がありうるが、どの症状・どの仕組みが関わるかは十分に分かっていない（抄録）。", "p3": "研究1は調査データで、年齢と性別を調整して、衝動買いの傾向が孤独と強迫的購買の関連を媒介するかを調べ、項目単位の分析も行った。研究2は安静時の機能的MRIで、孤独と強迫的購買の両方に関わる脳のネットワークを探した（抄録）。", "p4": "研究1は大学生の消費者2,433人、研究2は89人の安静時fMRIのデータを使った（抄録）。", "p5": "衝動買いの傾向は孤独と強迫的購買の関連を統計的に説明した（間接効果0.140、95%区間0.113〜0.168）が、人生満足との関連は説明しなかった。強迫的購買との関連は女性で強く、項目では衝動的・行動志向・無謀な買い方が目立った。男性ではデフォルトモードネットワークだけが孤独と強迫的購買の両方と名目上関連し、事後のモデルで有意な間接効果（0.223、95%区間0.017〜0.534）があった（抄録）。", "p6": "脳の経路は、構成要素の相関が全体の多重比較補正を通らず探索的にとどまると著者は認める（抄録）。解釈：大学生の横断データで、因果の向きは確定しない。", "fun": "寂しいとき、つい買い物をしてしまうことがあります。この研究は、寂しさがそのまま買いすぎにつながるのではなく、「思いつきで、すぐ、後先考えずに買う」くせを通じてつながることを示しました。脳の画像からも、ぼんやり考えごとをするときに働く脳の回路が関わっている可能性が見えましたが、こちらはまだ仮説の段階です。", "unverified": "本文が読めず、強迫的購買の尺度の名称は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "舗装状態と交通量を道路利用者満足に統合", "title": "Road User Satisfaction Based on Integrated Pavement Condition and Traffic Load in North Toraja, Indonesia", "url": "https://doi.org/10.52088/ijesty.v6i4.1894", "authors": "Rilva Toding Bua ほか", "venue": "International Journal of Engineering Science and Information Technology", "date": "2026-11-02", "apa": "Bua’, R. T., Sombolinggi, A. T., Arrang, A. T., & Payung, Z. (2026). Road User Satisfaction Based on Integrated Pavement Condition and Traffic Load in North Toraja, Indonesia. International Journal of Engineering, Science and Information Technology, 6(4), 263–276. https://doi.org/10.52088/ijesty.v6i4.1894", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（舗装状態指数§4.2と表4、限界§4.10）と抄録の結果を読んだ", "preprint": false, "p1": "道路の舗装状態と交通量という客観的な指標を、利用者の知覚と組み合わせた統合的な道路サービスの評価枠組みを作り、利用者満足との関係と改善の優先順位を道路区間ごとに示した（抄録）。", "p2": "道路のサービス品質の評価には客観的な施設の状態と利用者の知覚の両方が要るが、両者を一つの評価に統合し満足との関係を区間ごとに見る方法は少ない（序論）。", "p3": "舗装状態はASTM D6433-20に従う舗装状態指数（PCI：損傷の種類・程度・範囲から50mごとに算出し、高いほど良い）、交通量はピーク時の乗用車換算台数（PCU/h）で測る。客観的指標を5段階に換算し、対応する知覚の得点と50:50で重みづけして「統合舗装状態」と「統合交通負荷」を作り、利用者満足を重回帰で説明する。重要度-実績分析（IPA）で改善の優先項目を特定する（抄録、§4.2）。", "p4": "インドネシア北トラジャ県の教育・商業回廊の4つの道路区間で、2026年5〜7月に道路利用者277人の質問紙と、舗装・交通の調査を行った（抄録）。", "p5": "回帰モデルは満足の変動の39.6〜58.1%を説明した。統合舗装状態は4区間すべてで満足と有意に正の関係があり、統合交通負荷は3区間で有意で、Rantepao–Sa'dan道路では有意でなかった。顧客満足度指数は67.4〜73.4%で、全区間で利用者は満足していた。IPAはRantepao–Bolu道路で統合舗装状態を改善の優先項目とした（抄録）。2区間の平均PCIは100（優良）だった（表4）。", "p6": "著者は、選んだ4区間の結果で他の道路網に一般化できないこと、交通の指標がピーク時の交通量だけで時間変動・車両重量・軸重を含まないこと、区間単位の客観指標と個人単位の知覚を組み合わせたため個々の利用者が経験する空間的な違いを捉えきれないことを限界とする（§4.10）。", "fun": "道路の良し悪しは、ひび割れの数を測れば分かる、と考えがちです。でも使う人がどう感じるかは別の話です。この研究は、道路の傷み具合や混み具合の測定値と、利用者のアンケートを半分ずつ混ぜた点数を作り、満足とのつながりを道ごとに調べました。同じ地域でも、道によって「直すべきところ」が違うことが見えてきます。", "unverified": "他の2区間の平均PCIと、回帰係数の値は読んでいない。50:50の重みの根拠は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "街路什器の広告権益化と都市空間の資産化", "title": "Street Furniture as an Assetizing Apparatus: Advertising Concessions, Public Maintenance and the Production of Neoliberal Urban Space in Glasgow", "url": "https://doi.org/10.1111/anti.70231", "authors": "Sinan Wang", "venue": "Antipode", "date": "2026-11-03", "sjr": 1.442, "citescore": 7.0, "citescore_year": "2025", "apa": "Wang, S. (2026). Street Furniture as an Assetizing Apparatus: Advertising Concessions, Public Maintenance and the Production of Neoliberal Urban Space in Glasgow. Antipode, 58(6). https://doi.org/10.1111/anti.70231", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "グラスゴーで、バス停の上屋などの街路什器の維持が広告権益による収入に置き換えられ、都市の公共空間が「資産化」されていく過程を、委員会の記録・調達文書・交通当局の契約からたどった（抄録）。", "p2": "英国の都市では、日常の街路インフラが市の直接の予算から切り離され、収益を生む権益契約で維持されるようになっているが、その仕組みがどう積み重なって定着するかは見えにくい（抄録）。", "p3": "委員会の記録、調達文書、交通当局の契約を細かく追う微視的な政治経済学のたどり方で、維持の義務が公的予算から広告による収入の流れへどう移され、調達で標準化され、権益のポートフォリオとしてまとめられるかを分析した（抄録）。", "p4": "グラスゴーの長い緊縮財政の期間の事例研究（抄録）。解釈：比較対象となる他都市の分析は抄録の範囲では確認できない。", "p5": "資産化は公共空間の突然の民営化ではなく、通約（異なるものを同じ尺度で測ること）、束ね、契約期間を通じて段階的に積み重なる制度的な過程として現れた。バス停の上屋のような目立たないインフラが、新自由主義的な都市統治を持続させ、日常の公共空間を市場の成果に結びつけ、公的責任をめぐる民主的な議論の余地を狭める場になっていると論じた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：1都市の事例で、財政や利用者の便益への定量的な効果は扱っていない。", "fun": "バス停の屋根や広告の看板は、いつの間にか街にあって、誰が維持しているか気にする人は少ないでしょう。この研究は、グラスゴーで、その維持費が「広告を出す権利」と引き換えに企業に任されていった経緯を、役所の書類から一つずつ追いました。目立たない設備こそ、公共のものが少しずつ市場の論理に組み込まれていく入り口になっている、という指摘です。", "unverified": "契約の年数や金額などの具体的な数値は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "大規模インフラ管理者のDXを組織変革で読む", "title": "Digital Transformation Processes in Large Infrastructure Owners: An Organizational Change Perspective", "url": "https://doi.org/10.1061/jmenea.meeng-7835", "authors": "Tong Peng ほか", "venue": "Journal of Management in Engineering", "date": "2026-11-03", "sjr": 1.486, "citescore": 13.1, "citescore_year": "2025", "apa": "Peng, T., Le, Y., & Xue, Y. (2027). Digital Transformation Processes in Large Infrastructure Owners: An Organizational Change Perspective. Journal of Management in Engineering, 43(1). https://doi.org/10.1061/jmenea.meeng-7835", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "中国の空港グループの事例から、大規模インフラ管理者のデジタル変革が、組織の戦略で構成員の関与を段階的に深めていく再帰的な過程として進むことを示した（抄録）。", "p2": "大規模インフラ管理者のデジタル変革の研究は技術の導入に集中し、途切れない運用を守りながら変革を実行する構成員がどう変革を担うようになるかは説明されていない（抄録）。", "p3": "組織変革の視点と、組織と個人の水準にまたがる過程の枠組みを使い、組織が既存の仕組みを作り変えて構成員を変革に引き込む過程を単一事例でたどった（抄録）。", "p4": "中国の空港グループの単一事例研究（抄録）。解釈：データの種類（聞き取り・文書など）と期間は抄録の範囲では確認できない。", "p5": "段階ごとの3つの戦略の仕組みを特定した：権威あるリーダーシップのもとでの正統性の確立、技術と組織化における安全第一の論理の実行、構成員の中でのアイデンティティの変化の定着。これらから、変革を特定の文脈条件のもとで構成員の関与を深めて進む再帰的な過程とする構成員中心のモデルを抽象化した（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：単一事例で、中国の空港という強い階層と安全規制のある文脈に依存する可能性がある。", "fun": "空港や鉄道のように、一瞬も止められないインフラでデジタル化を進めるのは、走る列車の車輪を取り替えるようなものです。この研究は、ある空港グループで、まず上から正統性を示し、次に「安全第一」を技術と組織の両方で守り、最後に働く人の自己像を変えていく、という三段の流れを見つけました。技術より人の関わり方が鍵だということです。", "unverified": "本文が読めず、事例の期間と資料は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "サスペンション剛性と速度が乗り心地に与える影響", "title": "Influence of Suspension Stiffness and Vehicle Speed on Passenger Vehicle Ride Comfort over Random Road Profiles", "url": "https://doi.org/10.53941/ijamm.2026.100029", "authors": "Anh Hoang Nguyen ほか", "venue": "International Journal of Automotive Manufacturing and Materials", "date": "2026-11-03", "citescore": 3.1, "citescore_year": "2025", "apa": "Nguyen, A. H., Nguyen, D. Q., & Le Xuan, D. P. (2026). Influence of Suspension Stiffness and Vehicle Speed on Passenger Vehicle Ride Comfort over Random Road Profiles. International Journal of Automotive Manufacturing and Materials. https://doi.org/10.53941/ijamm.2026.100029", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（乗り心地の評価指標の節、結論§4と限界）と抄録を読んだ", "preprint": false, "p1": "四隅のサスペンションの連成を含む7自由度の全車両モデルで、ISO 8608の不規則な路面を走る乗用車の振動を調べ、路面の粗さが速度より強く振動を左右すること、サスペンション剛性に乗り心地と車体の動きの抑制の明確なトレードオフがあることを示した（抄録、§4）。", "p2": "1/4車両や半車両のモデルは、車体の上下（バウンス）・縦揺れ（ピッチ）・横揺れ（ロール）の連成を表せず、四隅の連成を含む全車両の振る舞いを路面の等級・速度・剛性の組み合わせで系統的に調べた研究は限られる（序論）。", "p3": "入力はISO 8608:2016の等級で生成した不規則な路面、出力は車体の変位と上下加速度の二乗平均平方根（RMS）。MATLAB/Simulinkで、車体のバウンス・ピッチ・ロールと4つのばね下質量の上下運動からなる7自由度の空間モデルを作る。乗り心地はISO 2631-1に基づき、RMSが小さいほど良いとする（抄録、§2）。", "p4": "路面の等級B〜E、速度20〜80km/h、サスペンション剛性を基準の0.5〜1.5倍に変えて応答を計算し、簡略な車両振動モデルや文献の全車両モデルと比べた（抄録）。", "p5": "80km/hでRMSの上下加速度はB級路面の0.101m/s²からE級の0.829m/s²へ、RMSの車体変位は2.37mmから28.70mmへ増えた。E級・80km/hで剛性を0.5Kから1.5Kにすると、RMSの車体変位は35.01mmから23.53mm（32.8%減）になったが、RMSの上下加速度は0.680から0.978m/s²（43.8%増）になった（§4）。", "p6": "著者は、線形のばね・ダンパーを使い、サスペンションの摩擦・非線形減衰・バンプストップ・タイヤの剛化・パラメータ誤差を含まないこと、時間領域のRMSだけで周波数重みつきのISO 2631の指標や振動暴露量を含まないこと、安定性・路面保持・タイヤ荷重は対象外であることを認める（§4）。", "fun": "車のばねを硬くすると、車体のゆさゆさした揺れは小さくなりますが、路面のごつごつが直接伝わって、乗っている人はかえって揺さぶられます。この計算では、硬さを3倍にすると揺れ幅は3分の1ほど減る一方、体に感じる加速度は4割以上増えました。「ちょうどいい硬さ」は一つに決まらず、何を優先するかで変わるのです。", "unverified": "実車の振動計測による検証の内容は結論の段落が切れており未確認。"}}, {"id": "jr15", "rank": 15, "headline": "支配方程式が一部不明でも使える縮約モデル", "title": "Residual-compensated physics-reinforced neural networks for reduced-order modeling with incomplete governing equations", "url": "https://doi.org/10.1063/5.0353589", "authors": "Honglin Wan ほか", "venue": "Physics of Fluids", "date": "2026-11-03", "citescore": 5.4, "citescore_year": "2025", "apa": "Wan, H., Chen, Y., Sun, X., & Gao, Z. (2026). Residual-compensated physics-reinforced neural networks for reduced-order modeling with incomplete governing equations. Physics of Fluids, 38(11). https://doi.org/10.1063/5.0353589", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "支配方程式が一部しか分かっていないパラメータつきのPDE系で、PODの縮約モデルに残差の補償ネットワークを加え、不完全な物理を補正した物理強化ニューラルネット（RC-PRNN）を示した（抄録）。", "p2": "物理の制約を使う縮約モデルは、支配方程式が不完全だとモデル誤差を抱え、純粋にデータ駆動の方法は物理の制約を生かせない（抄録）。", "p3": "PODで低次元表現を作り、時間とパラメータから縮約係数への写像を学ぶ。補助の残差補償ネットワークが、時間・パラメータ・縮約係数の関数として不完全な縮約ダイナミクスの実効的な残差補正を学び、それを縮約方程式に組み込んで補正した物理制約とする。学習は、POD係数のデータの不一致と補償された縮約残差の損失を組み合わせ、目標の時間・パラメータ領域の残差点で高精度の全次元計算を追加せずに物理制約を増やす（抄録）。", "p4": "複雑で不完全な物理を持つパラメータつき力学系の数値実験で、従来のPRNNと純粋なデータ駆動法、PDE保存型のニューラルネットと比べた（抄録）。", "p5": "RC-PRNNは従来のPRNNと純粋なデータ駆動法より予測精度が高く、高次元の問題ではPDE保存型のニューラルネットより計算費用が大幅に低かった（抄録。具体的な誤差の数値は抄録にない）。", "p6": "未確認（抄録に限界の記述はない）。解釈：補償ネットワークが学ぶ残差が物理的に解釈できるか、学習範囲外のパラメータへどこまで外挿できるかは残る。", "fun": "物理の法則を教え込んだAIは賢いのですが、法則が一部しか分かっていないと、その欠けた部分で間違えます。この研究は、欠けた部分を補う「修正係」のAIを別に用意し、本体のAIが守るべき法則を少しずつ直していく仕組みにしました。分かっている物理はそのまま使い、分からない部分だけをデータで埋める、という役割分担です。", "unverified": "本文が読めず、対象の系と誤差の数値は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "1回の解析で斜張橋地震応答の代理モデルを較正", "title": "Data-Driven Prediction Method for the Seismic Response of Cable-Stayed Bridges and Cross-Structure Calibration Motion Design", "url": "https://doi.org/10.3390/buildings16214366", "authors": "Li Dong ほか", "venue": "Buildings", "date": "2026-11-03", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Dong, L., Wang, S., & Lu, C. (2026). Data-Driven Prediction Method for the Seismic Response of Cable-Stayed Bridges and Cross-Structure Calibration Motion Design. Buildings, 16(21), 4366. https://doi.org/10.3390/buildings16214366", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "新しい斜張橋の地震応答の代理モデルを、1回の非線形時刻歴解析だけで較正する合成較正地震動を設計した（抄録）。", "p3": "主径間210〜980mの浮体式斜張橋100橋と実際の2方向地震動100組から10,000の応答履歴のベンチマークを作り（入力の水平最大加速度は0.29g以下）、11の代理モデル手法を非線形時刻歴解析と比べた（抄録）。", "p5": "抄録の範囲では代理モデルの精度の数値は未確認。", "fun": "橋の耐震性を確かめる詳しい計算は、1回でも重く、普通は何十回も繰り返します。この研究は、色々な揺れの特徴を一本に詰め込んだ「特製の揺れ」を作り、1回の計算だけで予測モデルを合わせ込めるようにしました。百の橋と百の地震で作った大きな練習帳があってこそできる工夫です。", "unverified": "代理モデルの誤差の数値は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "適応拡張カルマンでハイブリッド実験のモデル更新", "title": "Model updating method for real-time hybrid simulation based on adaptive extended Kalman filter", "url": "https://doi.org/10.1016/j.istruc.2026.113384", "authors": "Yuanfeng Duan ほか", "venue": "Structures", "date": "2026-11-03", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Duan, Y., Liu, J., Deng, N., Su, L., Zhang, H., Cheng, J. J. R., & Yun, C. B. (2026). Model updating method for real-time hybrid simulation based on adaptive extended Kalman filter. Structures, 94, 113384. https://doi.org/10.1016/j.istruc.2026.113384", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、実時間ハイブリッドシミュレーションで、適応拡張カルマンフィルタによりモデルを更新する方法を提案した論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、実験と計算を同時に走らせる「ハイブリッド実験」で、計算側のモデルをその場で直していけるか、です。実物の一部だけを揺らし、残りを計算で補うとき、計算の模型がずれていれば結果全体が狂います。測りながら模型を合わせ込むという発想です。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "表形式基盤モデルで雑音に強い信頼性解析", "title": "Noise-robust active-learning structural reliability analysis using an in-context tabular foundation model with conformal calibration", "url": "https://doi.org/10.1016/j.istruc.2026.113323", "authors": "Anh-Tuan Vu ほか", "venue": "Structures", "date": "2026-11-03", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Vu, A.-T., Do, K.-A., Nguyen, T.-T., & Dang, V.-H. (2026). Noise-robust active-learning structural reliability analysis using an in-context tabular foundation model with conformal calibration. Structures, 94, 113323. https://doi.org/10.1016/j.istruc.2026.113323", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、文脈内学習の表形式基盤モデルと適合的較正を使い、雑音に強い能動学習の構造信頼性解析を提案した論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、構造物が壊れる確率を、少ない計算回数で、しかも計算結果に雑音があっても見積もれるか、です。どこを計算すべきかをAIに選ばせつつ、その予測の自信の幅を統計的に保証する、という二つの道具の組み合わせが題名に表れています。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr19", "rank": 19, "headline": "環境を考慮したGNSSデータセット", "title": "An Environment-Aware GNSS Dataset", "url": "https://doi.org/10.1038/s41597-026-08460-0", "authors": "Qi Yao ほか", "venue": "Scientific Data", "date": "2026-11-03", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Yao, Q., Dong, J., Dong, C., Yang, J., & Huang, M. (2026). An Environment-Aware GNSS Dataset. Scientific Data. https://doi.org/10.1038/s41597-026-08460-0", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexで見つけた同じ記録（Zenodoのデータ記述）の抄録を使用", "preprint": false, "short": true, "p1": "周囲の遮蔽環境の違う複数地点で、複数の衛星系・周波数のGNSS観測を集めたデータセットを公開した（抄録）。", "p3": "固定観測点11か所と同期観測点3か所の生のUBXメッセージ、処理済みの衛星×時刻の観測行列、地点の情報を含む。固定点は開けた空・建物遮蔽・植生遮蔽・混合の各環境で衛星の可視周期を網羅する（抄録）。", "p5": "同期観測は同じ時刻・衛星配置・周波数の条件での比較に使え、電離層などの解析に使えるとした（抄録）。", "fun": "GPSの精度は、空が開けているか、ビルや木に囲まれているかで大きく変わります。でも条件をそろえて比べるデータは意外に少ないのです。この研究は、同じ時刻に違う環境で同時に測ったデータを公開しました。「場所の違い」だけを取り出して比べられるのが価値です。", "unverified": "データの期間と規模は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "DEMで粒状ダンパーのエネルギー散逸を解明", "title": "Study on the Vibration-Damping Mechanism of Granular Dampers Based on the Discrete Element Method", "url": "https://doi.org/10.3390/pr14213518", "authors": "Zhi Zhang ほか", "venue": "Processes", "date": "2026-11-03", "citescore": 5.7, "citescore_year": "2025", "apa": "Zhang, Z., Li, N., Zhang, Q., Deng, T., Ni, H., Chen, K., Zou, B., & Shi, Y. (2026). Study on the Vibration-Damping Mechanism of Granular Dampers Based on the Discrete Element Method. Processes, 14(21), 3518. https://doi.org/10.3390/pr14213518", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "個別要素法で粒状ダンパーの正弦加振下のエネルギー散逸の仕組みを調べた（抄録）。", "p3": "粒子要素とクランプ要素の2つの作り方を比べてクランプ要素を選び、ヘルツ接触モデルと単一粒子の跳ね返り実験で摩擦係数と法線の臨界減衰比を較正した（抄録）。", "p5": "抄録の範囲では、散逸の内訳など主要な結果の数値は未確認。", "fun": "箱に砂を入れて揺れる物に取り付けると、粒どうしがぶつかりこすれ合って、振動のエネルギーが熱に変わり揺れが収まります。この研究は、その一粒一粒の衝突を計算で再現し、どの擦れ方が効いているかを調べました。電気も制御もいらない、粒だけの揺れ止めです。", "unverified": "散逸機構の定量的な結果は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "DEMとCSTR網で充填層反応器を縮約", "title": "DEM ‐ CSTR network model for packed‐bed reactor: A particle‐resolved reduced‐order modeling approach", "url": "https://doi.org/10.1002/aic.70753", "authors": "Yupeng Du ほか", "venue": "AIChE Journal", "date": "2026-11-02", "citescore": 7.9, "citescore_year": "2025", "apa": "Du, Y., Liu, S., Liu, Z., Li, S., Li, Y., Liu, Y., Zhang, C., Chen, X., Tian, H., & Yang, C. (2026). DEM ‐ CSTR network model for packed‐bed reactor: A particle‐resolved reduced‐order modeling approach. AIChE Journal. https://doi.org/10.1002/aic.70753", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "触媒粒子を完全混合槽の節点、粒子の接触を有向辺に対応させ、充填層反応器の計算を約5桁速くした（抄録）。", "p3": "個別要素法で作った充填層の各触媒粒子を連続撹拌槽（CSTR）の節点に、接触を有向辺に写す網のモデルで、幾何の不均一性を保ったまま粒子解像の数値流体計算を縮約した（抄録）。", "p5": "計算時間は8時間から3秒になり、粒子解像CFDの滞留時間と反応率の予測を相対偏差2%以内で再現した（抄録）。", "fun": "粒がぎっしり詰まった筒に気体を流す反応器では、流れを細かく計算すると何時間もかかります。この研究は、一粒を一つの「小さなかき混ぜ鍋」、粒の接点を「鍋をつなぐ管」とみなして、網目の計算に置き換えました。8時間が3秒になったのに結果はほぼ同じ、という大胆な単純化です。", "unverified": "なし"}}, {"id": "jr22", "rank": 22, "headline": "ハンケル型縮約モデルとTCNで風圧予測", "title": "Wind field and pressure prediction of a ground-mounted rectangular cylinder based on Hankel-inspired reduced order model and temporal convolutional network-transformer", "url": "https://doi.org/10.1063/5.0351583", "authors": "Wei Lu ほか", "venue": "Physics of Fluids", "date": "2026-11-03", "citescore": 5.4, "citescore_year": "2025", "apa": "Lu, W., Lu, Z., Hu, G., Zhang, H., Chen, J., & He, J. (2026). Wind field and pressure prediction of a ground-mounted rectangular cylinder based on Hankel-inspired reduced order model and temporal convolutional network-transformer. Physics of Fluids, 38(11). https://doi.org/10.1063/5.0351583", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "時間遅れ埋め込みを使うハンケル型縮約モデルとTCN-Transformerを組み合わせ、地表の矩形柱まわりの風速場と表面圧を予測した（抄録）。", "p3": "時間遅れ埋め込みで拡大した力学の位相空間を再構成し、縮約表現が剥離・せん断層・後流の大規模なモードの時間発展を保つようにした（抄録）。", "p5": "縮約モデルが流れの剥離やせん断層、後流に関わる主要な大規模モードを抽出できることを示した（抄録。予測誤差の数値は未確認）。", "fun": "建物のまわりの風は、渦が生まれては流れ去る複雑な動きをします。この研究は「今の様子」だけでなく「少し前の様子」も並べて見ることで、渦の動きの流れを捉えやすくしました。過去の何コマかを重ねて見ると動きの向きが分かる、パラパラ漫画のような発想です。", "unverified": "予測精度の数値は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "降雨と洪水の連成で渓岸が崩れる過程を実験", "title": "Experimental Investigation on Debris Flow Gully Bank Instability Triggered by Coupled Rainfall and Flood", "url": "https://doi.org/10.1155/gfl/1342119", "authors": "Kang Yan ほか", "venue": "Geofluids", "date": "2026-11-03", "citescore": 3.9, "citescore_year": "2025", "apa": "Yan, K., Tang, K., Chen, Z., Dong, S., & Qi, Z. (2026). Experimental Investigation on Debris Flow Gully Bank Instability Triggered by Coupled Rainfall and Flood. Geofluids, 2026(1). https://doi.org/10.1155/gfl/1342119", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "先行降雨の有無で、洪水による渓岸の崩れ方がどう変わるかを水路実験で示した（抄録）。", "p3": "先行降雨ありとなしの2条件で洪水を与える水路模型実験を行い、2方向の画像系と間隙水圧センサで崩壊の様子と地中の水理応答を観測した（抄録）。", "p5": "洪水による渓岸の崩壊は、典型的な後退性の地すべりとして現れた（抄録。先行降雨の効果は抄録で切れており未確認）。", "fun": "土石流の土砂は、谷の岸が崩れることで供給されます。雨で岸が湿っている時と乾いている時では、同じ洪水でも崩れ方が違うはずです。この研究は、小さな水路で雨と洪水を再現し、岸の内部の水の圧力を測りながら崩れる様子を記録しました。災害の「仕込み」の段階を見る実験です。", "unverified": "先行降雨の有無による違いは未確認。"}}, {"id": "jr24", "rank": 24, "headline": "FDM-DEM連成でコーン貫入の応力低減を解析", "title": "The FDM-DEM Coupled Method for Studying the Stress Reduction Characteristics of the Cone Penetration Test", "url": "https://doi.org/10.3390/geotechnics6040112", "authors": "Daofei Tang ほか", "venue": "Geotechnics", "date": "2026-11-02", "citescore": 3.8, "citescore_year": "2025", "apa": "Tang, D., & Meng, Y. (2026). The FDM-DEM Coupled Method for Studying the Stress Reduction Characteristics of the Cone Penetration Test. Geotechnics, 6(4), 112. https://doi.org/10.3390/geotechnics6040112", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "コーン貫入試験で、コーンの肩から周面摩擦スリーブにかけて半径方向の応力が下がる程度を、FDM-DEM連成で定量化した（抄録）。", "p3": "円筒空洞拡張理論で周面摩擦を解釈するとき、肩を通過した後の除荷と応力再配分のため、限界空洞拡張応力はスリーブに働く応力を表さない。これを有限差分と個別要素の連成モデルで調べた（抄録）。", "p5": "応力低減の大きさとその仕組みを定量化した（抄録。数値は未確認）。", "fun": "地盤の強さを調べるために、先のとがった棒を地中に押し込む試験があります。棒の側面に働く摩擦から土の性質を読み取りますが、先端が通り過ぎた後の土は少しゆるんでいます。この研究は、土を粒の集まりとして計算し、そのゆるみの大きさを確かめました。読み取りの誤差の原因を正す研究です。", "unverified": "応力低減の比率の数値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "薄い柔軟層の衝突を変剛性接触モデルで表現", "title": "A variable-stiffness contact model for the impact of a flexible thin layer on a rigid substrate", "url": "https://doi.org/10.1016/j.ymssp.2026.115168", "authors": "Jie Zhang ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-03", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Zhang, J., Xi, Y., Liu, L., Li, W., Xiong, L., Zhao, Q., Zhao, Z., Zhao, L., Yuan, J., Zhang, M., & He, G. (2027). A variable-stiffness contact model for the impact of a flexible thin layer on a rigid substrate. Mechanical Systems and Signal Processing, 262, 115168. https://doi.org/10.1016/j.ymssp.2026.115168", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、剛な基板に柔らかい薄層が衝突するときの接触を、剛性が変わる接触モデルで表す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、薄くて柔らかいものが硬い面にぶつかるとき、つぶれ具合によって「硬さ」が変わる様子をどう表すか、です。ボールが床に当たると、つぶれるほど反発が強くなるように、接触の硬さは一定ではありません。その変化を式に取り込もうとする研究と読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr26", "rank": 26, "headline": "予後の限られた高齢者の社会的well-being変化", "title": "Changes in Social Wellbeing Among Older Adults With Limited Prognosis: Results From a Nationally Representative Cohort", "url": "https://doi.org/10.1111/jgs.70822", "authors": "Louise Hawkley ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-11-03", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "apa": "Hawkley, L., Wroblewski, K., Waite, L., & Kotwal, A. (2026). Changes in Social Wellbeing Among Older Adults With Limited Prognosis: Results From a Nationally Representative Cohort. Journal of the American Geriatrics Society. https://doi.org/10.1111/jgs.70822", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "死亡の予後指標で、2年間に社会的なwell-beingが悪化する高齢者を見分けられるかを調べた（抄録）。", "p3": "全米社会生活・健康・加齢調査（NSHAP）の第4回（2021〜2023年）と第4.2回（2024年）の高齢者1,630人で、予後指標と社会的well-beingの基準時と2年間の変化の関係を分析（抄録）。", "p5": "抄録の範囲では主要な結果の数値は未確認。", "fun": "残りの時間が限られた高齢者にとって、検査や治療より、人とのつながりの方が大切かもしれません。この研究は、医師が使う「余命の見積もり」で、孤立が進みやすい人を前もって見つけられるかを確かめました。医療の物差しを、暮らしの支えの優先順位づけに生かそうとする試みです。", "unverified": "予後指標と社会的well-beingの関連の向きと大きさは未確認。"}}, {"id": "jr27", "rank": 27, "headline": "孤独とスマホ依存はどちらが先かをパネルで検証", "title": "Which Is the Antecedent: Loneliness or Problematic Mobile Phone Use? Evidence from the Random Intercept Cross-Lagged Panel Model and Cross-Lagged Panel Network Analysis", "url": "https://doi.org/10.1177/20501579261504067", "authors": "Mengmeng Zhang ほか", "venue": "Mobile Media and Communication", "date": "2026-11-03", "sjr": 1.467, "citescore": 8.8, "citescore_year": "2025", "apa": "Zhang, M., & Yang, X. (2026). Which Is the Antecedent: Loneliness or Problematic Mobile Phone Use? Evidence from the Random Intercept Cross-Lagged Panel Model and Cross-Lagged Panel Network Analysis. Mobile Media & Communication. https://doi.org/10.1177/20501579261504067", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "孤独とスマホの問題的な使用のどちらが先に来るかを、変数と症状の両方の水準のパネル分析で検証した（抄録）。", "p3": "孤独が対処としての使用を増やすという理論と、使用が孤独を生むという置き換え仮説を比べるため、ランダム切片の交差遅延パネルモデル（RI-CLPM）と交差遅延パネルネットワーク分析を使った（抄録）。", "p5": "抄録の範囲では、時間的な方向の結論は未確認。", "fun": "寂しいからスマホに頼るのか、スマホばかり見ているから寂しくなるのか。どちらもありそうな話です。この研究は同じ人を何度も調べ、「その人らしさ」を差し引いたうえで、前の時点の一方が次の時点のもう一方を予測するかを確かめました。卵と鶏の順番を、データで見分ける工夫です。", "unverified": "推定された因果の方向は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "熱波を障害と気候正義の視点で見えない災害に", "title": "Heatwaves as Invisible Disasters: Disability, Climate Justice, and Urban and Peri-Urban Risk Reduction in Bangladesh", "url": "https://doi.org/10.1007/s13753-026-00778-y", "authors": "Arifatul Kibria ほか", "venue": "International Journal of Disaster Risk Science", "date": "2026-11-03", "sjr": 1.225, "citescore": 8.4, "citescore_year": "2025", "apa": "Kibria, A., Datta, R., & Hasan, J. (2026). Heatwaves as Invisible Disasters: Disability, Climate Justice, and Urban and Peri-Urban Risk Reduction in Bangladesh. International Journal of Disaster Risk Science. https://doi.org/10.1007/s13753-026-00778-y", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "バングラデシュの障害のある人が、都市・郊外で猛暑をどう経験し、どう対処しているかを質的に示した（抄録）。", "p3": "脱植民地の枠組みで生活経験と共同体の知を中心に据え、2025年7〜9月にダッカ、ラジシャヒ、パブナで、移動・知的・発話の障害のある人に8件の半構造化面接を行った（抄録）。", "p5": "抄録の範囲では、主な知見の詳細は未確認。", "fun": "地震や洪水と違い、熱波は建物を壊さないので「見えない災害」と呼ばれます。でも、暑さから逃げにくい人にとっては命に関わります。この研究は、障害のある人が実際にどう暑さをしのいでいるかを本人の言葉から集めました。災害対策を、最も影響を受ける人の目線から見直す試みです。", "unverified": "面接から得られた主要なテーマは未確認。"}}, {"id": "jr29", "rank": 29, "headline": "地域食料支援の世帯・週単位の原価計算", "title": "Household-week measurement and cost accounting for community food provisioning: framework specification and partial pilot demonstration", "url": "https://doi.org/10.3389/fsufs.2026.1813246", "authors": "Craig Steven Wright", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-11-03", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "apa": "Wright, C. S. (2026). Household-week measurement and cost accounting for community food provisioning: framework specification and partial pilot demonstration. Frontiers in Sustainable Food Systems, 10. https://doi.org/10.3389/fsufs.2026.1813246", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "地域の食料支援を、世帯×週の単位で提供義務と実績・原価を結びつけて記録する枠組みを示した（抄録）。", "p3": "収穫・損失・配布・労働参加・費用・水の6つの記録を、事前に宣言した提供義務（受給者×提供期間×パラメータの組）に結びつけ、週を標準の期間とする方法論の論文（抄録）。", "p5": "この設計への最も強い反論（結合は事実表の粒度にすぎない、など）を述べたうえで、部分的な試行で示した（抄録。試行の数値は未確認）。", "fun": "「今年は野菜を1トン配りました」という報告では、困っている家庭に毎週きちんと届いたかは分かりません。この研究は、記録の単位を「どの家庭に、どの週に」に変えて、量だけでなく約束が守られたかを測れるようにしました。会計の「何を一単位として数えるか」の選び方が、支援の見え方を変えます。", "unverified": "試行の結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "SMOTEが財務困窮予測と特徴量重要度に与える影響", "title": "Analyzing the Impact of SMOTE on Predictive Performance and Random Fores
