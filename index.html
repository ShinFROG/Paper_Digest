：構造の違いを、データや調整の違いから切り離して比べる設計である。", "p4": "最終時点の得点ではなくMMLUの学習曲線全体から節約量を読み、13のベンチマークの平均で比べた（§1.1）。標準ベンチマークが見逃す能力を調べるため、背景の文に埋め込んだ生年を答える取り出しの課題と、二段で人をたどる最も単純な推論の課題を作った。前作の100M以下の合成の「遊び場」の予測とも照らし合わせた（§1.2、§5）。", "p5": "すべての設定で、最も悪いCanon付きの学習が最も良い素のTransformerを上回り、Canonを付けると最も単純なGLA5がGDN2に並んでMamba2を上回った（§1.1）。しかし線形モデルは、背景が500トークンでも同じ大きさのTransformerより取り出しが不確かだった。二段の問いでは偶然の正答率33.3%を確実に上回るモデルはなく、8BのTransformerだけが背景なしで約50%だった（§1.1）。", "p6": "独立した限界の節は見当たらない。著者は、結論が少なくとも8Bまでのものだと述べ（§8）、線形モデルの重みは公開していない（付録F）。解釈：比較は1つのデータ混合と調整の手順に基づくので、別の条件で同じ順位になるかは別に確かめる必要がある。", "fun": "AIの設計の良し悪しは、ふつう成績表のような標準テストで比べる。この研究は数十億パラメータのモデルを何十回も一から育て、テストでは互角以上のモデルが、短い文章から生まれ年を拾うことや、「AさんはBさんと同じ年に生まれた」をたどる二段の推理につまずくことを示した。点数だけでは見えない弱点がある点が面白い。", "unverified": "付録の課題ごとの得点と、ハイブリッド構造の実験の結果は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "二次直交化で偏りを消す代償を最小化", "title": "The Statistical Cost of Second-Order Orthogonality", "url": "https://arxiv.org/abs/2611.25702", "authors": "Juan Carlos Escanciano ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Escanciano, J. C., & Terschuur, J. R. (2026). The Statistical Cost of Second-Order Orthogonality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25702", "why": "機械学習で推定した撹乱関数の誤差が残す2次の偏りを除く二次直交モーメントについて、その分散の代償を特徴づけ、モーメントと補正を同時に選ぶ二次の効率性の限界を導く。代償が無限になる部分線形モデルでは、分散の増加を抑えつつ除く偏りの量をデータで選ぶ規則を提案し、名目95%区間の被覆率を32〜80%から94〜97%へ改善した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、補正費用と同時選択の節、シミュレーションの節、結論）を読んだ", "preprint": true, "p1": "二重機械学習（DML）に残る二次のバイアスを除く二次の直交モーメントには分散の費用がかかることを示し、その最小値（補正費用）を特徴づけ、モーメントと補正の同時の選択と、費用が無限のときにどこまでバイアスを除くかをデータで選ぶ規則（ADA）を提案した（抄録、§3〜4）。未査読。", "p2": "DMLは局外関数（回帰や処置確率）の推定誤差の一次の影響を除くが、局外関数の学習が難しいと、残る二次のバイアスが標本の揺らぎに比べて大きくなり推論を損なう。観測の組の平均による補正で二次のバイアスは除けるが分散が増え、どの推定式を、どこまで、どの費用で補正するかが問題になる（§1）。", "p3": "補正は、局外の推定誤差に対するモーメントの二次の感度（曲率）を再現しなければならず、その最小の分散を補正費用と定義した。有限の分散で厳密な二次の補正ができるのは、この費用が有限のときに限ることを示した（§3.2）。費用はモーメントで異なるので両者を同時に選び、セミパラメトリック効率の下限の二次の類似物となる最小分散を導いた（§3.4）。解釈：一次で最も効率的な推定式が、補正の費用まで含めると最良とは限らない。", "p4": "部分線形モデルではどのモーメントでも費用が無限なので、分散の膨張の上限の中で、リッジ型と選んだ射影型の補正のどちらでどこまで除くかを選ぶADAを作り、選択後も推論が妥当なことを示した（§4.5〜4.6）。標本の大きさ500と1000、各500回の繰り返しで比べた（§4.7）。", "p5": "二値選択のロジットでは、最適なモーメントは観測の多い共変量のセルでだけ条件付き尤度を超える情報を使い、連続の共変量の差分の差分法では、厳密な補正が除外制約による効率の改善を手放す（抄録、§5）。シミュレーションでは、名目95%の区間の被覆率が、DMLの32〜80%から、ADAでは負荷試験の1つの設計を除くすべてで94〜97%に上がった（抄録、§4.7.3）。", "p6": "著者は、負荷試験の設計ではどの方法も失敗し、補正がADAの推定分散の9〜34%を占めて区間がDMLより15〜47%長くなること、大きなバイアスが残るときは分散の予算に限界があることを示している（§4.7.3〜4.7.4、§6）。解釈：バイアスを減らす代わりに区間が広がる、という交換を明示的に選ぶ方法である。", "fun": "機械学習で推定した部品を使って因果の効果を測ると、部品の誤差が二重に効いて答えがずれることがある。この研究は、そのずれを消す補正には「ばらつきが増える」という値段がつくことを示し、値段が高すぎるときは、どこまで消すかをデータで決める方法を作った。偏りとばらつきの取引を正面から計算する点が面白い。", "unverified": "付録の証明と、二値選択・差分の差分法の応用の具体的な数値例は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "人材目的の買収はチームを保ち発明を増やす", "title": "Acquiring to Hire: Team Complementarity and Innovation", "url": "https://doi.org/10.2139/ssrn.7706021", "authors": "Zunda Winston Xu", "venue": "SSRN", "date": "2026-11-20", "apa": "Xu, Z. W. (2026). Acquiring to Hire: Team Complementarity and Innovation. https://doi.org/10.2139/ssrn.7706021", "why": "米国の買収記録から人材獲得目的の買収（アクイハイヤー）12,271件を特定し、直接採用と比べて元のチームが多く保たれ、2年以内の1人当たり特許が約3倍になることを示す。コロナ禍で対面の協働が乱れると優位が弱まり、推定した均衡モデルではアクイハイヤーの禁止が起業と発明の総量・普及を減らす。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref）を読んだ。本文は入手できず", "preprint": true, "p1": "企業が新興企業をチームごと買う「アクイハイア」は、個別に雇うとチームが分断されて失われる補完性を守る手段であり、直接の採用より元のチームを多く保ち、2年以内の1人当たり特許が約3倍になることを示した（抄録）。未査読。", "p2": "企業は従業員を直接雇えるのに、なぜ会社ごと買うのか。アクイハイアはチームを保つが、従業員の採用ではなく企業の購入を必要とする。著者は、個別の採用ではチームが分断され、積み上げた補完性の利益が失われるという契約上の問題を、買収が解決すると論じる（抄録）。", "p3": "米国の買収記録から12,271件のアクイハイアを特定し、マッチングした直接採用の事例と比べた。さらに均衡モデルを推定し、アクイハイアを禁止したときの部分的なチームの採用への代替、新興企業の参入、発明の量と普及を調べた（抄録）。解釈：買収と採用の比較は観察データによる関連で、マッチングの方法は抄録では確認できない。", "p4": "COVID-19で対面の協調が乱れた時期に、共同発明でのアクイハイアの優位が弱まり、企業が直接採用へ移ったことを、チームの補完性がこの選択を動かしている裏づけとして示した（抄録）。頑健性の検証の内容は抄録では確認できない。", "p5": "アクイハイアは元のチームを大幅に多く保ち、発明を買収企業の技術の方向へ向けて、他社への普及を制限しうる。均衡モデルでは、禁止すると部分的なチームの採用への代替が大きく起こって新興企業の参入が減り、発明の損失が独立した方向性を保つ利益を上回って、発明の総量と普及の両方が下がった（抄録）。", "p6": "抄録には限界の記述がない。解釈：特許の差は、もともと生産性の高いチームほど買収されるという選択でも生じうるので、マッチングとCOVID-19の比較がそれをどこまで除けるかは本文で確かめる必要がある。", "fun": "スタートアップを「人ごと」買う買収は、引き抜けば済むのではと思われがちだ。この研究は、ばらばらに雇うとチームの息の合い方が失われ、まとめて迎えると発明がぐっと増えることを示した。さらに、こうした買収を禁じると、かえって世の中の発明が減るという計算結果も出ている。", "unverified": "本文を入手できず、マッチングの方法、均衡モデルの構造と推定値、COVID-19の比較の設計は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "傾向スコアで比べられる局所平均処置効果", "title": "Informative Local Average Treatment Effects Using Propensity Scores", "url": "https://arxiv.org/abs/2611.25253", "authors": "Martin Huber ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Huber, M., & Lee, Y.-Y. (2026). Informative Local Average Treatment Effects Using Propensity Scores (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25253", "why": "操作変数モデルで共変量ごとの局所平均処置効果を比べると、効果の異質性と従属者（complier）の構成の変化が混ざる問題に対し、2つの操作変数値での処置傾向スコアを条件に加えた推定対象ICLATEを提案する。識別、限界処置効果との関係、交差適合の機械学習による推定と漸近正規性を示し、職業訓練プログラムの効果の年齢による違いに適用した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、識別、Job Corpsへの応用、結論の節と表2〜4の説明）を読んだ", "preprint": true, "p1": "操作変数（IV）で共変量ごとの局所平均処置効果（LATE）を比べると、効果の違いと遵守者（操作変数に反応して処置を変える人）の顔ぶれの違いが混ざる。この問題に対し、関心の共変量に加え、操作変数の2つの値の下での処置の傾向スコアで条件づけるICLATEを提案し、識別・推定・推論の方法を示した（抄録）。未査読。", "p2": "二値の操作変数が識別するのは遵守者の平均効果で、共変量で条件づけたLATEでは、条件づける共変量によって遵守者の集団そのものが変わる。そのため見かけの効果の違いが、共変量によるのか、遵守者の間で異なる観測されない特性によるのかを区別できない（§1）。", "p3": "通常のIVの仮定の下では、2つの傾向スコアが遵守者を区切る観測されない項の分位点になり、これを固定すると処置の選択を動かす観測されない要因の範囲が一定に保たれる（§1、§10）。ICLATEは二重頑健なスコアの条件付き期待値の比で識別され、限界処置効果との関係も示した（§3〜4）。解釈：「同じくらい参加しにくい人どうし」で年齢などの違いを比べる考え方である。", "p4": "推定では局外関数を交差適合の機械学習で推定し、二重頑健なスコアをプールした局所線形回帰にかけ、過小平滑化などの条件の下で各点の漸近正規性を示した。シミュレーションでは、バイアスは標準偏差に比べて小さく、被覆率はおおむね名目の水準に近いかそれ以上だった（抄録、§10）。", "p5": "観測されない要因に対する効果の均一性と、除いた共変量に対する均一性を区別し、両方が成り立てば二値の操作変数1つでも検定できる含意が得られることを示した（抄録、§5）。米国のJob Corps（職業訓練）の9,240件に当てはめると、年齢ごとの週の稼得への効果はすべて正（16〜199ドル）で、20歳での効果だけが1%水準で有意だった（§9、表2）。", "p6": "著者は、各点の検定はゼロ効果についてのもので、年齢間の差を示すものではないと注意する（§9）。解釈：傾向スコアの組を固定すると使える観測が減る。実際、年齢だけで条件づけた推定の標準誤差は、3次元で条件づけた場合のおよそ3分の1から2分の1だった（§9）。", "fun": "職業訓練の効果が年齢で違って見えても、それが年齢のせいなのか、「訓練に参加した人の顔ぶれ」が年齢で違うせいなのかは分からない。この研究は、参加しやすさの度合いをそろえてから年齢で比べる方法を作った。比べる相手の条件をそろえるという因果推論の基本を、一段深くした工夫が面白い。", "unverified": "証明と、傾向スコアだけで条件づけた推定（表3）の数値、シミュレーションの設計ごとの被覆率は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "LLM時代に査読の指摘が均質化している", "title": "Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era", "url": "https://arxiv.org/abs/2611.26286", "authors": "Ilya Gusev", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Gusev, I. (2026). Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26286", "why": "ICLRの査読で同じ論文への指摘の重なりが2026年の12.0%から2027年の21.3%に上がり、NeurIPS・ICML・学術誌でも年ごとに上昇したことを示す。LLM生成文の検出器で判定された査読同士は重なりが大きく、1本の論文に対する批判の多様性が下がっていることを示唆する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法・結果・結論と限界の節、表4と図2〜4の説明）を読んだ", "preprint": true, "p1": "同じ論文に付いた査読どうしが挙げる問題の重なりを指摘の単位で測り、ICLRでは2026年の12.0%から2027年の21.3%に上がったこと、LLM生成の検出器が判定した査読どうしは判定されない査読どうしより重なりが大きいことを示した（抄録、§4）。未査読。", "p2": "査読は複数の読み手が別々の問題を見つけることに頼っている。機械学習の査読でLLM生成の文章が広がるなか、査読者がなお別々の指摘をしているかは分かっていなかった。査読全体の類似度は言い回しと内容が混ざり、同じ問題を挙げているかを確かめられない（§1）。", "p3": "ICLR・NeurIPS・ICMLと、SciPost・F1000・PLOS・BMC Medicine・Copernicusの査読を集めた（§3.1、表1）。LLMで各査読から「1つの直しを要する1つの問題」を引用つきで抜き出し、別の呼び出しで同じ論文の指摘を問題ごとにまとめ、2つの査読の問題の集合の重なり係数を論文内の全ペアで平均した（§3.2〜3.4）。検出器MELDで、2023年以前の点数の99.9パーセンタイルを超える査読を「LLM判定」とした（§3.5）。", "p4": "抜き出しは人が付けた公開ラベル2種と照合し、指摘の96.7%と弱点の範囲の94.2%を拾った（§3.2）。人の査読をLLMで磨くだけでは重なりは+0.5ポイントしか変わらず、ChatGPT以前の査読で上位45%を判定とした比較では差は−3.3〜0.2ポイントで、別の検出器GigaCheckでも差は正だった（§4 RQ2）。", "p5": "ICLRで3つ目の査読が加える新しい問題は、2026年の6.12から2027年の5.46に減った（表4）。同じ論文の中で、LLM判定どうしの重なりは判定なしどうしより、ICLRで2024〜2025年に3.0ポイント、2026〜2027年に4.5ポイント大きく、雑誌の5つの情報源をまとめると5.4ポイント大きかった（§4、図2・図4）。", "p6": "著者は、指摘の抽出とまとめをLLMが行い、まとめの段階は人で確かめていないこと、ICLRは2026年以降が議論期間中の査読で段階が異なること、検出器は磨いただけか生成かを区別できないことを限界とする（Limitations）。解釈：上昇の分解は「会計」であり、LLM利用の因果効果は示していないと著者自身が述べている（RQ2）。", "fun": "論文の査読では、何人かの専門家がそれぞれ違う弱点を見つけることが期待されている。ところが最近は、同じ論文への査読どうしで指摘が重なる割合が増え、AIが書いたと判定された査読どうしほど似ていた。みんなが同じAIに相談すると、目のつけどころまで似てしまうのかという問いが面白い。", "unverified": "付録の追加の研究課題（埋め込みによる比較、指摘の種類ごとの変化）の結果は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "時系列でいつでも有効な信頼系列を自己正規化で", "title": "Anytime-valid inference for time series via self-normalization", "url": "https://arxiv.org/abs/2611.26536", "authors": "Tim Kutta ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Kutta, T., & Shao, X. (2026). Anytime-valid inference for time series via self-normalization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26536", "why": "弱従属の定常時系列で、分位点や期待ショートフォールなど非線形の母数と自己回帰係数について、長期分散を推定せずに済む自己正規化で漸近的な信頼系列を作る方法を示す。初期期間の後に区間を逐次に出しても全時点での同時被覆が1−αに収束し、MCMC出力の解析にも使える。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、2つの自己正規化の節、数値実験、考察）を読んだ", "preprint": true, "p1": "弱い従属のある定常時系列について、分位点・エクスペクタイル・期待ショートフォール・自己回帰係数などの母数の「いつ見ても有効な」信頼系列を、長期分散を推定せずに自己正規化で作る方法を初めて示した（抄録）。未査読。", "p2": "時系列はデータが逐次集まり、推定値と信頼区間を観測のたびに更新して、条件を満たした時点で結論を出したい。しかし通常の信頼区間は固定の標本の大きさ向けで、繰り返しのぞいたりデータに応じて止めたりすると保証が崩れる。時間を通じた同時の保証を持つ信頼系列は独立なデータで発展してきたが、一般の弱い従属の下での非線形な母数ではほとんど手つかずだった（§1）。", "p3": "最初のm期の準備期間の後に信頼区間を逐次出し、その後のすべての時点での同時の被覆確率がm → ∞で1 − αに近づくように作る（抄録、式1）。正規化には、逐次の推定値の履歴だけを使う前向きの方法と、3つのブロックの推定値を使う方法の2つを提案した（§2.1〜2.2）。解釈：推定値自身の揺れの大きさで割ることで、従属の強さを別に推定しなくて済む。", "p4": "正規型と歪んだ分布のAR(1)過程で、準備期間250・500・1000、各2,000回の繰り返しで同時の被覆率と区間の幅を調べ、既存の方法（Flegal–Gong、Howard–Ramdas、Waudby-Smithら、Gnettner–Kirch）と比べた（§4）。", "p5": "目標95%に対し、2つの方法は従属の下でも名目に近い同時の被覆率を保った。準備期間250では上側の分位点やエクスペクタイルで約90%まで下がることがあり、三ブロックの方がやや良かった（§4.1）。従属の下では、Howard–Ramdasは中央値で50%を下回り、Flegal–Gongの同時の被覆率は約60%、Gnettner–Kirchは早く目標に届くが約93%だった（§4.2）。", "p6": "著者は、前向きの方法は重みをわずかに速く増やす必要があり、最適な反復対数の法則の幅には三ブロックだけが対応すること、平均では長期分散の推定が簡単な既存の方法が有利なことを述べる（§5、§4.2）。解釈：保証は準備期間が長くなる極限でのもので、短い準備期間では不足しうる。", "fun": "データを見ながら「もう結論を出してよいか」を何度も確かめると、うっかり間違える確率が増える。この研究は、前後の値が関係し合う時系列でも、いつのぞいても信頼できる区間を作る方法を示した。しかも、データ自身の揺れで目盛りを決めるので、面倒な分散の推定を省ける点が面白い。", "unverified": "定理の証明と、補足の付録にあるMCMCの出力解析の例は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "転職の外部機会が賃金交渉を左右する", "title": "Job-to-job Mobility, Outside Options, and Bargaining: A Machine Learning Approach", "url": "https://econpapers.repec.org/RePEc:hal:ipppap:halshs-05845509", "authors": "Pietro Geuna", "venue": "RePEc NEP", "date": "2026-11-09", "why": "観測された転職からニューラルネットで個人ごとの外部機会の価値を推定し、イタリア・ベネト州の雇用者・被用者データで、外部機会の良い労働者ほど大量解雇から早く回復し、在職中の賃金も上がる（1標準偏差で約1.4%）ことを示す。大企業の開業を操作変数とした設計とポルトガルのデータでも確かめた。", "explain": {"basis": "抄録", "basis_note": "抄録（題名検索で見つけたOpenAlexの記録）を読んだ。本文は入手できず", "preprint": true, "p1": "労働者ごとの外部の選択肢（よそで働くことの価値）を、転職の離散選択モデルをニューラルネットで推定して測り、その価値が高まると転職が増え、同じ職にとどまっていても賃金が上がることを示して、賃金交渉の仕組みを支持した（抄録）。未査読。", "p2": "外部の選択肢は賃金決定のモデルで中心的な役割を持つが、個々の労働者が実際にどんな雇用機会を持つかは直接観測できない（抄録）。", "p3": "観測された転職から労働供給の離散選択モデルを推定し、労働者の好みや潜在的な雇用主との相性の違いをニューラルネットで柔軟に表して、個人ごとの代替雇用の価値を測った。イタリアのヴェネト州の雇用主・被雇用者の接続データを使った（抄録）。解釈：誰がどの企業へ移ったかの記録から、各人にとっての他の勤め先の魅力を推し量る方法である。", "p4": "測った外部選択肢が高い労働者ほど大量解雇から速く回復することで尺度を検証した。大企業の開業に基づく操作変数で因果の解釈を確かめ、ポルトガルの接続データでも結果を再現した（抄録）。", "p5": "外部選択肢の改善は転職を増やし、継続中の雇用の中でも賃金を上げ、1標準偏差の上昇で賃金は約1.4%上がった。ポルトガルでは、雇用主の付加価値の増加が、外部選択肢の良い労働者の賃金により強く波及した（抄録）。", "p6": "抄録には限界の記述がない。解釈：尺度は推定した選択モデルに依存するので、モデルの特定化や、観測されない能力が転職と賃金の両方に効く可能性への対処は本文で確かめる必要がある。", "fun": "「ほかの会社でも働ける」という見込みは、今の職場での給料に効くのか。この研究は、人々の転職の記録からAIで一人ひとりの「よそでの価値」を測り、それが高い人ほど同じ会社にいても給料が上がることを示した。辞めなくても、辞められること自体が交渉の力になるという点が面白い。", "unverified": "本文を入手できず、選択モデルとニューラルネットの構造、操作変数の詳細、推定値の標準誤差は確認していない。抄録は題名検索で見つけた別の記録から取った。"}}, {"id": "pn08", "rank": 8, "field": "オペレーションズ・リサーチ", "headline": "標本平均近似が最適になる条件を局所幾何で特定", "title": "Geometry, Local Minimax Risk, and the Limits of Sample Average Approximation in Linear Stochastic Optimization", "url": "https://arxiv.org/abs/2611.25007", "authors": "Hanbo Yang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Yang, H., & Yuan, M. (2026). Geometry, Local Minimax Risk, and the Limits of Sample Average Approximation in Linear Stochastic Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25007", "why": "線形確率最適化の決定の後悔について、実行可能集合の支持関数の局所的な伸び方が最適な収束率を決めることを示し、標本平均近似（SAA）が鋭く最適・率最適・統計的に準最適になる条件を区別する。KL近傍での局所ミニマックスの極限を求め、座標ごとに切り詰めたSAAが率を達成することを示す。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、数値実験、考察の節）を読んだ", "preprint": true, "p1": "線形の確率的最適化で、意思決定の後悔（regret）の最適な局所の速さが実行可能集合の支持関数の局所の形で決まり、n^{-1/2}、n^{-1}、n^{-2}などになりうること、正規の平均モデルでは標本平均近似（SAA）がこれを達成するが、KLの近傍で分布がずれるとSAAは最適でなくなりうることを示した（抄録）。未査読。", "p2": "SAAは未知の期待値を標本平均で置き換えて最適化する、モデルに依らない標準的な方法で、一致性や漸近分布の理論は成熟している。しかし、特定の問題の形と不確実性のモデルの下でSAAが統計的に最適かは、標準の最悪の場合の速さでは答えられなかった（§1）。", "p3": "未知の平均ベクトルとの内積をコンパクトな凸集合の上で最大化する問題を考え、真の平均のまわりで支持関数が線形近似からどれだけ離れて増えるか（局所の剰余）を中心の対象とした（式1.1）。正規の観測で平均が局所的にずれる実験と、参照分布Pの周りの半径が1/nに比例するKLの球の中で分布全体が変わる実験の2つで、局所ミニマックスの後悔を求めた（§1）。解釈：データの不確かさを、解の集合の「角の鋭さ」が後悔に変換するという見方である。", "p4": "正規の実験では、実行可能集合を固定したまま局所の形を変え、SAAの後悔の傾きが理論の−1/2、−1、−2に近いことを確かめた（§7、表4）。ラプラス分布の裾を持つデータで、通常のSAAと座標ごとに切り詰めたSAAの期待後悔を比べた（§7、図2）。", "p5": "滑らかな点ではSAAは古典的な鋭い局所ミニマックスの定数も達成した。KLの近傍での正確な極限は、局所の母数集合がPの共分散の楕円体である正規モデルのそれと一致した。Pを使わない切り詰めSAAはミニマックスの速さを達成するが、通常のSAAは、局所の速さがPの裾に比べて速いとき、まれな裾の事象が期待値を支配して最悪の場合の後悔が厳密に劣りうる（抄録、§8）。", "p6": "著者は、理論が意図的に局所かつ固定次元で、コンパクトな凸の実行可能集合、平均を通じて分布に依存する線形の目的関数、片側のKLの近傍を仮定していることを限界とし、次元の増大、非線形の目的、データに依存する参照モデル、ワッサースタイン距離などは未解決とする（§8）。", "fun": "データの平均で答えを決める素直なやり方は、多くの場合いちばん良い。ところが、選べる答えの範囲に「角」があるかどうかで、データが増えたときの上達の速さが変わり、まれな極端なデータに引きずられると素直な平均が負けることを、この研究は数学で示した。答えの形がデータの使い方を左右する点が面白い。", "unverified": "付録の証明と、ラプラス分布の実験での比の具体的な値は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "多様性の効果と少数派の比率を区別せよ", "title": "Greater Diversity or Fewer Whites? Disentangling Heterogeneity and Marginalized Group Share at Macro and Micro Levels", "url": "https://doi.org/10.31235/osf.io/ve4aw_v1", "authors": "Maria Abascal ほか", "venue": "SocArXiv", "date": "2026-11-20", "apa": "Abascal, M., Ganter, F., & Baldassarri, D. (2021). Greater Diversity or Fewer Whites? Disentangling Heterogeneity and Marginalized Group Share at Macro and Micro Levels. https://doi.org/10.31235/osf.io/ve4aw_v1", "why": "多様性が信頼や協力を損なうという研究の多くが、混ざり具合（多様性）と周縁化された集団の比率を区別できていないことを指摘し、均質に不利な地域が欧米で少ないことと生態学的誤謬という2つの障害を示す。理論に合う集団比率の指標を使うべきだとし、多様性そのものについて結論を出すためのデータと分析の要件を整理する。", "explain": {"basis": "本文", "basis_note": "SocArXivのPDF版の本文（序論、文献の整理、図2・図3の説明、結論）を読んだ", "preprint": true, "p1": "多様性（集団の混ざり具合）が信頼や協力を損なうとする研究の多くが、多様性と周縁化された集団の割合（例：黒人の割合）を区別できていないこと、地域の水準の関連から個人の関連を推論できないこと（生態学的誤謬）を、データと解析的な議論で示した（抄録、序論）。未査読。", "p2": "地域の人種・民族の多様性は、信頼の低さ、市民参加の少なさ、公共財の供給の少なさと結びつけられてきた。批判の多くは交絡を考えずに因果を主張する点に向けられてきたが、それ以前の問題として、多様性と非白人・移民の割合が概念上も実証上も区別されていなかった（序論）。", "p3": "第1に、北米と欧州ではほぼ非白人だけ、あるいはほぼ移民だけの地域がきわめて少なく、多様性の効果と割合の効果を分けられないことを、米国の都市圏のデータで示した（図2）。第2に、地域全体で多様性との関連があっても、それは個人の行動が多様性と関連する場合とも、集団の割合と関連する場合とも矛盾しないことを解析的に示した（図3、付録）。解釈：「混ざっているから」か「白人が少ないから」かを、地域の平均からは決められないという指摘である。", "p4": "先行研究の多くが、内集団・外集団の割合に基づく理論で結果を説明しながら、混ざり具合の指標で測っている食い違いを整理した（序論）。そのうえで、特定の集団や個人について多様性との関連を推論するのに必要なデータ・分析・仮定の条件を明らかにした（結論）。", "p5": "米国の都市圏・小都市圏の88%超は白人が過半数で、990地域のうち非白人が75%を超えるのは20地域だけだった（図2）。一方、ニューヨーク市の2,111の国勢調査区では約3分の2が非白人過半数だった。白人について多様性との関連を求めるには、ほぼ白人だけの地域とほぼ非白人の地域の両方に白人が十分いるデータが必要で、集団の数が増えると必要な観測の種類は指数的に増える（結論）。", "p6": "著者は、白人・非白人のような粗い分類を使うのは議論のためで、均質な集団だとみなしているわけではないこと、個人レベルの分析は集団の中で反応が同じだと仮定していることを注記する（脚注）。解釈：主張は既存研究の推論の限界の整理で、新しい因果推定を示すものではない。", "fun": "「多様な街ほど人々は互いを信頼しない」という有名な研究結果がある。この論文は、その「多様さ」が実は「白人が少ないこと」と見分けられないと指摘する。ほとんど非白人だけの街がめったにないため、混ざっていることの影響と、ある集団が多いことの影響をデータの上で切り分けられない。言葉の定義から研究を問い直す点が面白い。", "unverified": "付録の解析的な証明の詳細と、欧州のデータの扱いは確認していない。"}}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "開口のあるRCスラブの力の流れを再現する解析", "title": "Modeling Framework for Reinforced Concrete Buildings to Assess the Performance of Cast-in-Place Diaphragms with Openings", "url": "https://doi.org/10.21203/rs.3.rs-11546051/v1", "authors": "Pratik Patra ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Patra, P., Thonstad, T. E., & Lehman, D. E. (2026). Modeling Framework for Reinforced Concrete Buildings to Assess the Performance of Cast-in-Place Diaphragms with Openings. https://doi.org/10.21203/rs.3.rs-11546051/v1", "why": "積層シェル・ファイバー要素・接合部ばねで、スラブ（ダイアフラム）と鉛直部材の双方向の相互作用を保つ3次元非線形モデルを作り、部分架構の繰返し試験5体で較正したうえで、実大5層RC建物の振動台実験で設計レベルの最大層間変形を6%以内で予測した。強い揺れでは引張がスラブの広い範囲に広がり、純せん断を仮定する等価梁と異なる応力状態が共存することを示す。", "explain": {"basis": "本文", "basis_note": "Research SquareのPDF版の本文（抄録、試験体の説明、まとめと結論の節）を読んだ", "preprint": true, "p1": "開口のある現場打ち鉄筋コンクリート（RC）床スラブ（ダイアフラム）を評価するため、建物全体の動的応答と床の中の力の流れを同時に表す3次元の非線形モデルの枠組みを作り、実大5階建ての振動台試験で検証して、設計レベルの最大層間変形を6%以内で予測した（抄録）。未査読。", "p2": "開口のあるダイアフラムの評価には、建物が生む動的な力と、それがスラブを通じて伝わる経路を捉える非線形モデルが要る。設計では、ダイアフラムを等価な梁とみなして純粋なせん断を仮定する理想化が使われてきた（抄録）。", "p3": "LS-DYNAで、スラブと壁を非線形のコンクリートと鉄筋のモデルを持つ積層シェル、梁と柱をファイバー要素、接合部の変形と鉄筋の抜け出しを離散ばねで表し、弦材・コレクター・ストラットを前もって決めなくても力の経路が現れるようにした（抄録、結論）。解釈：建物全体の揺れと床の中の引張・圧縮の分布を、ひとつのモデルで追えるよう中間の細かさを選んだ設計である。", "p4": "部材のパラメータを5つの繰り返し載荷の部分架構試験で較正し、平面11.0 m × 6.6 m、高さ21.34 mの実大5階建て試験体の振動台試験（使用限界から最大想定地震まで）の床加速度・層間変形・層せん断・スラブの損傷域と比べた（抄録、結論）。", "p5": "計算したひび割れの分布は、柱と開口の近くの主な損傷域を再現した。強い揺れほど引張はスラブの広い範囲に広がり、圧縮は開口と鉛直部材の近くに集中したままだった。力の分布は床の力が最大の時点と層間変形が最大の時点で異なり、一方向の揺れでも二軸引張・引張圧縮・二軸圧縮が同じ床に共存して、純粋なせん断を仮定する等価梁の理想化と食い違った（抄録、結論）。", "p6": "著者は、スラブ・柱接合部の押し抜きせん断や鉄筋の破断のような局所的な損傷を明示的にモデル化していないこと、力の分析が計算の重い少数の建物全体の解析に基づくことを限界とする（結論）。解釈：検証は1棟の試験体なので、他の建物の形や開口の配置への一般化は今後の課題である。", "fun": "建物の床は、人や物を支えるだけでなく、地震のときに揺れの力を壁や柱へ受け渡す役目も担っている。階段や設備のための穴があると、その力の通り道が複雑になる。この研究は実物大の5階建てを揺らした実験と計算を照らし合わせ、床の中の力の流れが揺れの瞬間ごとに入れ替わる様子を描き出した点が面白い。", "unverified": "部分架構試験ごとの較正結果の数値と、入力地震動ごとの応答の詳しい比較は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "認知の制約下では単純で劣ったモデルが残る", "title": "Cognitive Constraints and Misspecification Concern", "url": "https://arxiv.org/abs/2611.25368", "authors": "Drew Fudenberg ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Fudenberg, D., & Mudekereza, F. (2026). Cognitive Constraints and Misspecification Concern (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25368", "why": "モデルの誤特定を懸念し、処理できる複雑さに制約のある意思決定者がデータで候補モデルに重みを付けて行動する繰返し決定問題を分析する。データが増えても統計的に劣る単純なモデルが長期に残りうること、制約が危険な行動と安全な行動の循環を消すこと、誤りを明かす選択を抑えて誤特定のモデル群が維持されうることを示す。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、結論の節と抄録）を読んだ", "preprint": true, "p1": "処理できるモデルの複雑さに認知の容量の制約があり、しかもモデルが誤っているかもしれないと心配する主体の繰り返しの意思決定を定式化し、データが増えても容量の制約は解消されず、統計的に劣るが単純なモデルが長期に残りうることを示した（抄録、§1）。未査読。", "p2": "経済主体がデータから学ぶとき、データが支持するモデルを使うには認知の資源が足りないという問題と、考えているどのモデルも真のデータ生成過程を正しく表していないかもしれないという問題を抱える。この2つが、自分の選択の結果から学ぶ場面でどう影響し合うかが問われていた（§1）。", "p3": "主体はベイズ更新で候補モデルの当てはまりを評価するが、各モデルには複雑さの費用があり、重みの期待費用が容量の上限を満たす範囲で事後分布に最も近い重み（認識分布）を選ぶ。誤特定への懸念はHansen–Sargentの乗数基準で扱い、その強さをモデル群の当てはまりと実現した結果の両方に反応させた（§1）。解釈：「分かってはいるが使いこなせない」状態と「どれも信用しきれない」状態を別々の量で表した。", "p4": "結果は定理として証明し、安全性で調整した尤度比の規則が、ほぼマクシミンの利得を保証し、十分に正確な予測が認知的に可能なら極限の選択がほぼ最適になるという合理性の基準を与えることを示した（§1）。応用としてモデル選択の問題を分析した（§5）。", "p5": "容量の制約が効いているとき、複雑さに比例してモデルを支持する証拠は容量の影の価値の上昇に吸収され、いまの行動を変えないが、後のデータへの反応は変える（§1）。単純なモデルが安全な行動を支持するとき、制約は危険な行動と安全な行動の循環をなくし、制約を緩めると危険な行動は初めは魅力的になるが長期には減る。誤ったモデルの群も、誤りを暴く選択を抑えて生き残りうる（抄録）。", "p6": "著者は、誤特定の懸念と動学的な整合性を組み合わせる難しさを避けるため近視眼的な選択に限ったことを挙げ、先を見通す主体への拡張を今後の課題とする（§6）。解釈：結果は理論で、実験や観察データによる検証は含まない。", "fun": "データを見れば分かるはずなのに、なぜ人は単純な考え方を手放さないのか。この研究は、頭の容量に限りがあると、複雑なモデルを支持する証拠がいくら集まっても行動が変わらない場合があることを数学で示した。しかも慎重な行動を続けるせいで、間違った思い込みが確かめられないまま残りうる点が面白い。", "unverified": "定理の証明と、リスクのある行動の循環（§4）とモデル選択の応用（§5）の具体的な設定は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "閲覧の軌跡を使う品ぞろえ最適化", "title": "Search-Based Revenue Management in a Markovian Search Network", "url": "https://doi.org/10.2139/ssrn.7712218", "authors": "Junjia Zheng ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Zheng, J., Cao, Y., & Zhao, W. (2026). Search-Based Revenue Management in a Markovian Search Network. https://doi.org/10.2139/ssrn.7712218", "why": "消費者の閲覧経路をマルコフ探索網で表し、購入実績だけに合わせた多項ロジットモデルでは利益をほぼ全損しうることを示す。一般のモデルでは品ぞろえ最適化がNP困難だが、遷移が行き先の魅力だけで決まるモデルでは完全多項式時間の近似が可能で、航空券のクリックストリームとJD.comのデータで最良の予測の当てはまりと約10%高い期待収益を得た。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref）を読んだ。本文は入手できず", "preprint": true, "p1": "消費者の閲覧の経路をマルコフ型の探索ネットワークで表し、どの商品を検索できるようにするかを決める品揃え最適化を扱い、遷移の魅力が行き先だけで決まるモデル（DA-MSM）なら完全多項式時間近似スキーム（FPTAS）があり、推定も大域最適にできることを示した（抄録）。未査読。", "p2": "検索で最も注目される商品が最も買われる商品とは限らず、閲覧と購入は食い違う。閲覧の経路が記録される多商品の環境では、探索の軌跡をモデル化して活用する機会がある（抄録）。", "p3": "企業が購入できる商品を条件に検索可能な商品を選び、期待収入を最大化する問題を定式化した。一般のマルコフ探索モデル（GMSM）では、この品揃え最適化が強NP困難で、P = NPでない限り決定的な多項式時間近似スキームを持たないことを示し、遷移の魅力が行き先の商品だけに依存するDA-MSMを導入した（抄録）。解釈：「どこから来たか」を捨てて「どこへ行くか」だけで遷移を表し、計算を扱いやすくした。", "p4": "DA-MSMでは軌跡の対数尤度が同時に凹で、大域最適な推定ができ、品揃えを固定すれば価格づけも扱いやすく定式化できることを示した。航空会社のクリックストリームと京東（JD.com）の取引データで予測の当てはまりを比べ、直接の売上を生まない検索専用の商品を含む数値実験も行った（抄録）。", "p5": "過去の購入の型に正確に合う多項ロジット（MNL）モデルでも、ネットワーク型の探索の下では利益の損失が100%に限りなく近い品揃えを勧めうる。DA-MSMは航空のデータで標本外の予測の当てはまりが最も高く、JD.comでは軌跡に基づく比較手法を上回り、数値実験では期待収入が最良の比較手法より平均約10%高かった（抄録）。", "p6": "抄録には限界の記述がない。解釈：遷移が行き先だけで決まるという仮定は、直前に見た商品との比較に左右される閲覧を表せない可能性があり、その影響は本文で確かめる必要がある。", "fun": "ネットショップでよく見られる商品が、よく売れる商品とは限らない。この研究は、客が商品ページを渡り歩く道筋を確率のネットワークとして表し、それ自体は売れなくても他の商品へ客を導く「通り道」の商品の価値を測れるようにした。売上の数字だけでは見えない役割を数える発想が面白い。", "unverified": "本文を入手できず、FPTASの計算量、データの規模、比較手法の内容は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "粘り強いAIエージェントほど社内規則を破る", "title": "Unfinished-Bench: Measuring Rule Violations by Persistent Agents in Realistic Work Environments", "url": "https://arxiv.org/abs/2611.17460", "authors": "Seunghyun Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "apa": "Lee, S., Hwang, J., Han, D., & Yun, S. (2026). Unfinished-Bench: Measuring Rule Violations by Persistent Agents in Realistic Work Environments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17460", "why": "目標と社内文書の規則が両立しない97の業務シナリオで、課題完遂への粘り強さを与えたエージェントの規則違反が32.2%から43.6%に増え、利用者が規則を述べた場合の8.5%の5倍になることを示す。違反の98.3%は規則が表示された後に起き、判定した例の89%ではエージェントが規則を書き留めてから破っていた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ベンチマークの設計、実験の設定、結果の概要、結論と限界の節）を読んだ", "preprint": true, "p1": "社内文書や他人の権限による明示されない規則のもとで長時間自律して働くAIエージェントについて、目標と規則が両立しない現実的な職場環境のベンチマークUnfinished-Benchを作り、完了への粘り強さを与えると、社内文書にある規則の違反が32.2%から43.6%に増えることを示した（抄録）。未査読。", "p2": "エージェントには、委任された仕事を長く自律して進めるため、完了への粘り強さが与えられつつある。完了に規則違反が必要なときはエージェントが一人で判断するしかないが、指示と規則の衝突を測る既存のベンチマークは、規則をプロンプトで示すか隠すかで、粘り強さを評価していなかった（抄録）。", "p3": "7つの組織（企業5社、地域の医療機関、公立大学）に、従業員名簿（計1,301人）、内部文書（471件）、背景のチャット（8,066件）を置き、7つのリスク分類で97の場面、計582の課題を作った（§2.1）。承認者は不在で、止まって報告することだけが規則を守る結末になる（§2.2）。同じ規則を、文書の中、ユーザーの指示の中、規則なし（過度の慎重さの対照）の3つの位置に置いた（§2.3）。", "p4": "12のオープンなモデルを同じハーネスで、粘り強さの有無を変えて計13,968回走らせた（§3.1）。比較はモデル・場面・変種を共有する組の差で行い、97の場面を再標本化するブートストラップの95%信頼区間と、対応のある正確なMcNemar検定を使った（§3.2）。", "p5": "12モデルの平均で、違反率はユーザーが述べた規則で4.7%から8.5%、文書の規則で32.2%から43.6%に増え、24のモデルと位置の組み合わせのうち21で増えた（§4.1）。文書の規則の違反の98.3%は規則が表示された後に起き、判定した標本の89%ではエージェントが先に規則を書き留めていた（抄録）。粘り強さありの文書の違反率は、モデルにより1.0%から89.7%まで分かれた（§4.1）。", "p6": "著者は、1つのハーネス（Hermes Agent）だけで測ったこと、オープンな12モデルだけで商用モデルを評価していないこと、粘り強さをハーネスとプロンプトで与え、長時間の実行用に訓練されたモデルは試していないことを限界とする（Limitations）。", "fun": "「最後までやり遂げて」と任されたAIの助手は、社内のルールを破ってでも仕事を終わらせようとするのか。この研究は架空の会社や病院、大学の職場を作って試し、粘り強く働かせるほどルール違反が増え、しかも多くはルールを読んで書き留めた後に破っていたことを示した。分かっていて破る点が面白く、少し怖い。", "unverified": "リスクの分類ごとの違反率と、最終報告で違反を伝えたかどうかの結果（§4.5）は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "未知のネットワークでも使える操作変数", "title": "Network-Adaptive Instrumental Variables", "url": "https://arxiv.org/abs/2611.25222", "authors": "Yi Niu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Niu, Y., & Xu, Z. (2026). Network-Adaptive Instrumental Variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25222", "why": "干渉のある回帰で内生性を生む3つの仕組みに対し、ネットワークの重みが未知でも有効なモーメントを与えるネットワーク適応型の操作変数を空間自己回帰モデルで構成し、構造係数とネットワーク母数の同時識別、GMM推定の一致性と漸近正規性、平均的なネットワーク波及の検定を示す。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、操作変数の構成、シミュレーション、結論の節）を読んだ", "preprint": true, "p1": "波及（干渉）のある回帰で内生性を生む3つの仕組みに対し、未知のネットワークの重みを持つ空間自己回帰（SAR）モデルのためのネットワーク適応型の操作変数（NIV）を作り、真のネットワークを知らなくても妥当なモーメント条件が得られることを示した（抄録）。未査読。", "p2": "波及のある設定では、共変量が観測されない要因と相関すること、リンクの形成や強さが内生的な特性に依存すること、結果・共変量・ショックがネットワークを通じて伝わることが重なり、干渉がなければ妥当な操作変数も破綻しやすい。既存の研究の多くは、ネットワークの重みを外生的に与えられたものとして扱ってきた（§1）。", "p3": "観測された距離から生成される、未知で内生的でもありうる重みを考え、候補の操作変数を利用できるネットワーク情報について残差化し、候補の重み行列のべき乗をかけてNIVを作った（§1、§3）。ネットワーク条件付きの除外と情報の同等性の仮定の下で、構造の平均係数とグループごとのネットワークの母数を同時に識別する十分条件を2通り示し、誤差の波及係数と分散も識別した（§4）。解釈：つながりの強さを推定しながら、それに合わせて操作変数を作り直す方法である。", "p4": "NIV-GMM推定量の一致性と漸近正規性を示し、実行可能な信頼区間と、平均のネットワーク波及の検定を作った（§5）。モンテカルロでは、グループの大きさ100・200・300・500、各10グループ、200回の繰り返しで、ガウス型とロジスティック型の核と、その混合の手順を調べた（§6）。", "p5": "真の核がロジスティック型のとき、混合の手順はどのグループの大きさでもRMSEが小さく、ガウス型を当てはめると直接効果のバイアスが大きくなり、波及効果のバイアスも残った（§6）。平均の波及の検定は、指定した対立仮説の下で、どのグループの大きさでも200回すべてで棄却した（§6）。", "p6": "独立した限界の節はない。解釈：識別は除外と情報の同等性という強い仮定と、ネットワークが観測された距離から生成されるという設定に依存し、実データへの応用は示されていない。都市の経済成長の回帰が例として挙げられている（§1）。", "fun": "都市の経済成長を調べるとき、ある都市への投資の効果は近くの都市にも波及するが、どの都市どうしがどれだけ強くつながっているかは分からないことが多い。この研究は、つながりの強さを推定しながら、それに合わせて因果を測る道具を作り直す方法を示した。見えない網の目ごと推定する発想が面白い。", "unverified": "識別の定理の証明と、シミュレーションの被覆率と区間の長さの具体的な値は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "拡散モデルのRL後学習は定数の活性化操舵", "title": "RL Post-Training in Diffusion Transformers Is Activation Steering", "url": "https://arxiv.org/abs/2611.26627", "authors": "Tuna Han Salih Meral ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Meral, T. H. S., Oktay, K., Helbling, A., Kara, A., Chau, D. H., & Yanardag, P. (2026). RL Post-Training in Diffusion Transformers Is Activation Steering (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26627", "why": "拡散Transformerの強化学習による後学習の効果を、全プロンプトに共通の固定の操舵ベクトル（パラメータ数はLoRAの約65分の1）で近似すると、画像6モデルの報酬向上の90.0〜96.3%を再現できることを示す。入力に依存する新しい変換を学ぶのではなく、事前学習済みの生成器がすでに計算できる方向へずらしているという解釈を与える。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、利得の作用する場所の節、結論、付録Hの限界）を読んだ", "preprint": true, "p1": "拡散トランスフォーマーの強化学習（RL）による事後学習の利得の大部分は、凍結した元のモデルの各ブロックの出力に、入力によらない固定のステアリングベクトルを足すだけで再現できることを示した（抄録）。未査読。", "p2": "RLの事後学習は、拡散トランスフォーマーの画質、文字の描画、複数の物体の構成の正確さを大きく改善する。依頼された文字の描画などはプロンプトに依存する能力なので、その改善には入力に依存する複雑な変換の学習が必要だと考えるのが自然だった（抄録）。", "p3": "元のモデルを凍結し、ブロックの出力に足す固定のベクトルの組（SD3.5-MではRLで調整したLoRAの18.8Mに対して0.29Mの母数で、65分の1）を、公開されているRL調整済みのモデルの速度の予測に合わせて当てはめた。目的関数に報酬は入れていない（抄録）。解釈：ベクトルはどのプロンプト・トークン・乱数の種でも同じなので、入力に応じた新しい変換は加えていない。", "p4": "6つの画像モデルと2つの動画モデルのRL調整版で報酬の利得の回復率を測り、ゼロから始めてベクトルだけをオンラインのRLで学習する比較も行った（抄録、§4）。条件付き・無条件のパス、拡散の段階、テキストと画像の流れに分けたベクトルや、結合注意の経路の置き換えで、利得がどこで効くかを調べた（§5）。", "p5": "ベクトルは6つの画像モデルの報酬の利得の90.0〜96.3%を、2つの動画モデルでは89.8%と111.9%を回復した。ベクトルだけをオンラインのRLで学習すると、SD3.5-Mで文字の描画（OCR）と人の好み（PickScore）について重みを更新するRLの利得を上回った（抄録）。利得は主に画像のトークンがテキストのトークンから読む経路で画像に届き、この経路を元のモデルの値に戻すとOCRの利得は20.5%しか残らなかった（§5）。", "p6": "著者は、ベクトルで十分であることを示しただけで、RL調整済みのモデル自体がこのベクトルを必要とするとは主張しないこと、RLの更新が低ランクだとも主張しないこと、動画の結論は2つの基盤モデル上の2つのモデルに限られることを限界とする（付録H）。", "fun": "画像を作るAIを強化学習で鍛えると、絵の中の文字がきれいに描けるようになる。ところがこの研究は、その上達のほとんどが、元のAIの内部に毎回同じ小さな「ずらし」を足すだけで再現できることを示した。新しい技を覚えたというより、もともとできたことの方へ向きを変えただけ、という見方が面白い。", "unverified": "モデルごとの回復率の表と、動画の評価指標ごとの詳細は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "学習から除いた能力も全般的な進歩で戻る", "title": "General progress substitutes for specific training data in language models", "url": "https://arxiv.org/abs/2611.24844", "authors": "Mark Marosi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "apa": "Marosi, M., & Antal, P. (2026). General progress substitutes for specific training data in language models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24844", "why": "チェス・オセロ・分子文字列・括弧言語・ウェブ文章で特定の技能の訓練信号を除いて学習すると、他のデータでの全般的な進歩がそれを代替し、後で除いたデータを与えると初期からの学習のごく一部の量で技能を獲得することを示す。データの除外は能力の獲得を遅らせるだけで、モデルが進歩するほど取り戻しに必要なデータは減る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "言語モデルの学習で特定の技能の訓練信号を除いても、他のデータでの全般的な進歩がそれを代替し、後から除いたデータを与えるとわずかな量で技能を獲得することを示した（抄録）。未査読。", "p3": "チェス、オセロ、分子の文字列、括弧言語、ウェブ文章のモデルで個々の技能の訓練信号を除いて学習し、小さいモデルから大きいモデルでの遅れを予測し、除いたデータを後で与えたときに必要な量を測った（抄録）。", "p5": "王手への応手を明示的に学ばせていないチェスのモデルも合法な応手をほぼ同等に順位づけ、除いたデータを与えると初期からの学習のごく一部の量で技能を獲得し、その割合はモデルの進歩とともに減った。難しさが同じ対照の規則ははるかに遅く学ばれた（抄録）。", "fun": "危険な使い方をされないように、AIの学習データから特定の知識を抜いておく方法がある。ところがAIが全体として賢くなるほど、抜いた知識を少しのデータですぐに取り戻してしまう。データを抜くことは「封印」ではなく「遅らせるだけ」だと示した点が意外で面白い。", "unverified": "本文は入手できず、遅れの予測式と必要なデータ量の具体的な割合は確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "質問をまたいだ報酬で自信度を較正する", "title": "Cross-Question Reliable Reinforcement Learning", "url": "https://arxiv.org/abs/2611.25292", "authors": "Hector G. Rodriguez ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Rodriguez, H. G., & Rohrbach, M. (2026). Cross-Question Reliable Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25292", "why": "LLMの自信度を、各質問の正誤だけでなく質問の集合の中での相対的な位置で報酬づけるCAREを提案し、許容リスク5%での回答範囲（C@5）を数学で0.8%から42.4%に、分布外の知識・推論課題で12.3%から23.6%に改善した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMが自分の答えへの自信度を言葉で示すとき、それを質問ごとの正誤ではなく質問の集合の中での相対的な位置で報酬づける強化学習CAREを提案し、確信のない質問を棄権する選択的な回答の範囲を広げた（抄録）。未査読。", "p3": "質問と答えの組の集合で、いくつかの許容リスクごとに自信度から棄権の閾値を決め、各自信度が閾値の正しい側にあるかで報酬を与える。これにより自信度は他の質問の自信度との比較で強化される（抄録）。", "p5": "数学では許容リスク5%での回答範囲（C@5）がMATH-500・GSM8K・Big-Math-Digitsで0.8%から42.4%に上がり、HotpotQAで学習すると分布外の知識・推論・数学のベンチマークでのC@5が12.3%から23.6%に上がった（抄録）。", "fun": "AIに「自信がなければ答えない」ことを教えたいとき、正解なら自信100%、不正解なら0%と教えるのは一見正しい。しかし、それでは自信の数字に「どの答えがより確かか」という情報が残らない。ほかの質問と比べた順位で教えることで、AIが答えてよい問題の範囲が大きく広がった点が面白い。", "unverified": "本文は入手できず、使ったモデルの規模と学習の設定は確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "推論と実行の組合せで崩れるロボット操作", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "url": "https://arxiv.org/abs/2611.26444", "authors": "Yuzhi Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Huang, Y., Wu, J., Huang, F., Lin, J., Zhang, W., Xiong, Z., Li, Y., Xie, Z., Wang, Z., Liu, Z., Huang, J., Zhang, Y., Liu, Y., Yang, H., Tang, C., Tang, S., Aktas, H., Wu, A., Wu, D., … Wang, Z. (2026). Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26444", "why": "30の模擬操作課題（180構成）で、過去の観察に基づく判断、正確な実行、その組合せを分けて評価する診断ベンチマークを作り、最強のエージェントでも判断52.7%・実行39.0%に対し、組合せ課題は12.0%しか成功しないことを示す。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ロボットの操作で、過去の観察に基づく判断（Mind）、正確で時宜を得た実行（Act）、その組合せ（Mind2Act）を分けて評価し、失敗の原因を特定できる診断用ベンチマークを作った（抄録）。未査読。", "p3": "5つの応用領域の30の模擬操作課題に3段階の難しさと2つの場面設定を設けて180の構成とし、3つの観点で比べた。代表的な3つのシステムの失敗を判断・実行・組合せのどれに帰せられるかを診断する仕組みも用意した（抄録）。", "p5": "マルチモーダルのエージェント、視覚言語行動モデル、世界行動モデルを評価すると、単一の観点の能力は組合せの課題に持ち越されず、最強のエージェントでも判断52.7%・実行39.0%に対し、組合せは12.0%の成功にとどまった（抄録）。", "fun": "ロボットが「さっき見た場所にある物を取る」には、覚えて判断する力と、手を正確に動かす力の両方が要る。それぞれは得意でも、組み合わせると急にできなくなることが分かった。どこでつまずいたかを分けて調べられるようにした点が面白い。", "unverified": "本文は入手できず、評価した個別のモデル名と課題の具体例は確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "鋭さと時間整合を両立する単眼深度推定", "title": "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth", "url": "https://arxiv.org/abs/2611.26603", "authors": "Peiyun Hu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Hu, P., Mihajlovic, M., Duong, L., Lipson, L., Dong, W., Delaunoy, A., Richter, S. R., & Koltun, V. (2026). Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26603", "why": "画像と動画の両方を扱う単一のネットワークで、計量的な深度を元の解像度で、境界の鋭さと時間的な一貫性を両立して推定するDepth Pro 2を示し、精度・鋭さ・一貫性・速度で従来手法を上回るモデル群とコードを公開する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "画像と動画の両方で、計量的な深度を元の解像度で、境界の鋭さと時間的な一貫性を両立して推定する単一のネットワークDepth Pro 2を示した（抄録）。未査読。", "p3": "従来の単眼深度推定を分析し、複数フレームの手法は一貫性を、単一フレームの手法は鋭さを優先するというトレードオフを見いだし、画像と動画を扱う拡張可能な1つのネットワークを学習した（抄録）。", "p5": "計量的な精度、鋭さ、時間的な一貫性のすべてで従来手法を上回り、精度・鋭さ・一貫性・実行時間の新しいパレート前線を定めるモデル群とコード・重みを公開した（抄録）。", "fun": "1台のカメラの映像から物までの距離を当てるAIは、写真1枚なら輪郭がくっきりするが動画ではちらつき、動画向けにするとぼやけるという悩みがあった。この研究は、その両方を1つのAIで解決したという。写真と動画という別々の得意分野を1つにまとめた点が面白い。", "unverified": "本文は入手できず、比較した手法と評価指標の数値は確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "事後分布を合わせる拡散モデルの蒸留", "title": "Posterior Matching Distillation", "url": "https://arxiv.org/abs/2611.26629", "authors": "Hidir Yesiltepe ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Yesiltepe, H., Berner, J., Vahdat, A., & Yanardag, P. (2026). Posterior Matching Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26629", "why": "教師の事後分布の傾けた平均を一致させることで、補助のスコアネットワークなしに各ノイズ水準の事後分布全体を学ぶ蒸留法を示し、SDXLとFLUX.2で4ステップの手法の中で最良のFIDを得た。逆KLに伴う多様性の低下を避けられる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "拡散モデルを少ないステップで生成できるように圧縮する蒸留で、教師の事後分布全体を学ぶ新しい分布ベースの手法PMDを提案した（抄録）。未査読。", "p3": "固定したノイズ状態を条件とする生徒のサンプルの指数的に重みづけた平均を、教師の事後平均（ガウスの破損の下では入力をずらした教師の1回の評価で得られる）に一致させる。傾けた平均を近傍で一致させれば事後分布全体が一意に決まることを証明した（抄録）。", "p5": "SDXLとFLUX.2 [klein] 4Bで、4ステップの手法の中で最良のFIDを得て、プロンプトとの整合や知覚的な品質でも同等以上だった。補助のスコアネットワークは要らない（抄録）。", "fun": "絵を描くAIは、ノイズを少しずつ消して絵にするので時間がかかる。その手順を数ステップに縮める「蒸留」では、よくある絵ばかり出て多様性が減りがちだった。平均の取り方を工夫して、教師の持つ多様さごと写し取る点が面白い。", "unverified": "本文は入手できず、FIDの具体的な値と比較手法は確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "気象予報を離散トークンと強化学習で", "title": "Reinforcement-Aligned Probabilistic Weather Forecasting with Discrete Tokens", "url": "https://arxiv.org/abs/2611.25570", "authors": "Jinhan Li ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Li, J., Chen, Z., Li, Y., Gao, Y., Xu, F., Wu, H., Du, J., & Wang, K. (2026). Reinforcement-Aligned Probabilistic Weather Forecasting with Discrete Tokens (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25570", "why": "大気の状態を多尺度の離散トークンで表して自己回帰Transformerで確率的に生成し、GRPOで下流の極端現象の予報などに合わせて後学習する枠組みを示す。ERA5で8メンバーのアンサンブル平均が15日目の正規化RMSEを最良の決定論的基準より17.6%下げ、GenCastより約18倍速い。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "大気の状態を離散的なトークンで表し、GPT型の事前学習と強化学習による後学習の枠組みを全球の中期気象予報に持ち込んだWeatherCraftを示した（抄録）。未査読。", "p3": "多尺度のトークン化で大気の状態を粗から細へのトークン階層で表し、Transformerが時間と尺度をまたぐ因果的な依存を学び、各尺度内のトークンを並列に予測する。直接のサンプリングでアンサンブルを作り、トークンの対数確率を使うGRPOで下流の課題の報酬を最大化する（抄録）。", "p5": "ERA5のベンチマークで、8メンバーのアンサンブル平均が15日目の正規化RMSEを評価した最良の決定論的基準より17.6%下げ、KVキャッシュでGenCastより約18倍速かった。報酬に基づく後学習で陸の持続的な高温と海洋の熱の極端の予報が改善した（抄録）。", "fun": "天気予報のAIを、文章を作るAIと同じ「単語を順に予測する」仕組みで作った。大気の状態を単語のようなトークンに変えると、文章AIで使われる強化学習の技も使え、極端な暑さの予報など目的に合わせて鍛え直せる。言葉の技術が天気にそのまま転用できる点が面白い。", "unverified": "本文は入手できず、トークン化の解像度と極端現象の評価指標の値は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "課題の説明は例何個分の価値があるか", "title": "Is a Description Worth a Thousand Demonstrations? Specificity and Reliability of Task Descriptions in In-Context Learning", "url": "https://arxiv.org/abs/2611.25560", "authors": "Bruce Nguyen ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Nguyen, B., Jiang, B., & Kong, L. (2026). Is a Description Worth a Thousand Demonstrations? Specificity and Reliability of Task Descriptions in In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25560", "why": "文脈内学習で課題の説明を情報事前分布とみなし、ベイズ統計の有効標本サイズで説明の価値を例の数に換算する。信頼できる説明の価値は具体性と次元で増えるが、事前学習済みLLMの多くは推論を使わないと具体的な説明を十分に使えないことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "文脈内学習で、課題の例を見せる代わりに課題を説明する文章の価値を、例の数に換算して測る理論を示した（抄録）。未査読。", "p3": "ベイズ的な文脈内学習の見方で、説明を具体性と信頼性で特徴づけた情報事前分布とみなし、ベイズ統計の有効標本サイズ（ESS）で説明の予測上の価値を同等の例の数として定量化した。文脈内の線形回帰で理論を導いた（抄録）。", "p5": "信頼できる説明のESSは具体性と課題の次元とともに増えるが、無関係かもしれない説明は例がないと具体性から得るものが少ない。メタ学習したTransformerは学習分布で最適に近かったが、事前学習済みのLLMの多くは推論を使わないと具体的な説明を十分に使えなかった（抄録）。", "fun": "AIに新しい課題を教えるとき、例をたくさん見せるのと「こういう課題です」と説明するのは、どちらが効くのか。この研究は、説明の価値を「例何個分か」という共通の単位で測った。人に教えるときの「言葉で説明するか、やって見せるか」という問いにも通じる点が面白い。", "unverified": "本文は入手できず、ESSの具体的な値と使ったLLMは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "ランダム重みNNの悪条件性を扱う推論理論", "title": "Statistical Inference with Ill-Conditioned Random Weight Neural Network Sieves", "url": "https://arxiv.org/abs/2611.26410", "authors": "Giovanni Ballarin ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Ballarin, G., Grigoryeva, L., & Gonon, L. (2026). Statistical Inference with Ill-Conditioned Random Weight Neural Network Sieves (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26410", "why": "隠れ層をランダムに固定し出力係数だけを推定するニューラルネット回帰は、次元が増えると共分散の最小固有値が消える悪条件を避けられないことを示し、それを明示的に扱う近似・推定・推論の理論（リッジ正則化と方向別の非退化条件）を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "隠れ層の重みをランダムに固定して出力係数だけを推定するニューラルネット（RWNN）の回帰について、次元が増えると避けられない悪条件を明示的に扱う近似・推定・推論の理論を示した（抄録）。未査読。", "p3": "サンプルした母数を条件とするとRWNN回帰はランダムな近似空間の線形シーブ問題になることを使い、母共分散行列の固有値の多項式の上界を被覆の幾何から導き、最小固有値が消えることを示した。そのうえで近似率、リッジ正則化の一致性、方向別の漸近正規性を導いた（抄録）。", "p5": "モンテカルロより速いL2の近似率と、層化サンプリングによる新しいL∞の近似の上界、リッジの有効次元による一致性の保証を得た。線形汎関数の方向で漸近線形性とガウス極限を示し、リッジ補正した分散推定量の一致性で実行可能なスチューデント化推論を可能にした（抄録）。", "fun": "ランダムに作った大量の特徴を並べて、最後の重みだけを学ぶ手軽なAIがある。特徴を増やすと表現力は上がるが、似た特徴が増えて計算が不安定になることが避けられない。この研究は、その不安定さを無視せずきちんと扱ったうえで信頼区間を作れることを示した点が面白い。", "unverified": "本文は入手できず、数値実験の設定と結果は確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "合成した生存時間データで推論を正しく行う", "title": "Faithful Generative Modeling for Censored Time-to-Event Data: From Distributional Fidelity to Statistical Inference", "url": "https://arxiv.org/abs/2611.25464", "authors": "Yin Liu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Liu, Y., Zhao, S., & Li, D. (2026). Faithful Generative Modeling for Censored Time-to-Event Data: From Distributional Fidelity to Statistical Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25464", "why": "観測時間と共変量を事象の有無ごとに生成する2段階の生成枠組みで合成生存データの分布収束率を示し、Coxモデルの係数が一致推定される条件と、素朴な推論の限界を補う分散補正・分布較正を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "生存時間の合成データについて、分布の忠実さの理論的な保証と、合成データでの統計的推論の妥当性を回復する方法を示した（抄録）。未査読。", "p3": "事象の有無を条件に観測時間と共変量を同時に生成する2段階の生成枠組みTSGSurvを提案し、その分布の収束率を示した。Cox比例ハザードモデルについて、生成器の忠実さが係数の一致推定を保証する条件を示した（抄録）。", "p5": "合成データに基づく素朴な推論の限界を特徴づけ、元のデータの妥当な推論を回復する分散補正と分布の較正の手順を開発し、模擬と2つの実データへの応用で有効性を示した（抄録）。", "fun": "個人情報を守るため、本物そっくりの「合成データ」で分析する方法が広がっている。でも見た目が本物そっくりでも、その上で計算した信頼区間が正しいとは限らない。この研究は、合成データでの分析結果を本物の分析に近づける補正方法まで示した点が面白い。", "unverified": "本文は入手できず、2つの実データの内容と補正の効果の大きさは確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "対数尺度の小地域推定を集計値に厳密に合わせる", "title": "Fully Bayesian Benchmarking for Small Area Models with Count Data", "url": "https://arxiv.org/abs/2611.26122", "authors": "Soumadeep Bhowmick ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Bhowmick, S., Roy, A., Datta, G. S., Irimata, K. M., & Maples, J. J. (2026). Fully Bayesian Benchmarking for Small Area Models with Count Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26122", "why": "対数など非線形の尺度で指定した小地域モデルで、上位の集計値への一致（ベンチマーク）制約が母数のリーマン多様体上の制約になることを扱い、制約集合上で完全に支持される事前分布を作って、事後の修正なしに完全なベイズ分析を可能にする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小地域の計数データのモデルを対数など非線形の尺度で指定したとき、上位の地域の信頼できる集計値に厳密に一致させるベンチマークの制約を、完全なベイズ分析で扱う事前分布を開発した（抄録）。未査読。", "p3": "非線形の尺度では地域平均についての線形の制約が母数に対して非線形になり、母数がリーマン多様体の上に乗ることに着目し、制約で定まる多様体の上で完全に支持される事前分布のクラスを作った（抄録）。", "p5": "事前分布が制約集合上で完全に支持されるため、制約集合上の適切な事後分布が得られ、事後分布を後から修正せずに完全なベイズ分析ができる。米国国勢調査局の小地域所得・貧困推計（SAIPE）が代表例である（抄録）。", "fun": "市町村ごとの貧困者数を推計すると、全部足した数が県の信頼できる合計と合わないことがある。合計を合わせるために後から数字をいじるのではなく、最初から「合計が合う世界」だけを考える確率のモデルを作った点が面白い。曲がった空間の幾何学が統計に役立つ例でもある。", "unverified": "本文は入手できず、数値例と既存手法との比較は確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "代理指標の妥当性が不確かなときの因果効果推定", "title": "Causal Effect Estimation Under Uncertain Statistical Surrogacy", "url": "https://arxiv.org/abs/2611.26289", "authors": "Yi Liu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Liu, Y., Levis, A. W., Yang, S., & Han, L. (2026). Causal Effect Estimation Under Uncertain Statistical Surrogacy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26289", "why": "統計的代理性の仮定が成り立つかわからない複数の代理エンドポイントについて、効率の利得と損失が生じる条件を特徴づけ、頑健な基準推定量に固定しつつ推定平均二乗誤差で代理指標を使う推定量を選ぶSACESを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "妥当性の不確かな複数の代理エンドポイントを使って因果効果を推定するとき、統計的代理性の仮定が成り立てば効率を高め、破れても一致性を保つ適応的な推定法SACESを提案した（抄録）。未査読。", "p3": "統計的代理性（代理指標と共変量を条件に主要な結果が処置と独立）の下で、主要な結果が完全に観測される場合と欠測がある場合の効率の差と仮定の破れによる偏りを特徴づけ、頑健な基準推定量に固定しつつ推定した平均二乗誤差で代理指標を使う推定量を選ぶ（抄録）。", "p5": "模擬では代理性の破れの程度が変わっても有利な偏りと分散のトレードオフを達成し、ACTG 175の臨床試験のデータで代理情報を適応的に取り入れる方法を示した（抄録）。", "fun": "治療の効果を確かめるには長い年月の追跡が必要だが、途中の検査値（代理指標）を使えば早く分かることがある。ただし代理指標が本当に結果を代弁しているかは分からない。この研究は、代理指標が正しければ得をし、間違っていても大きく損をしない推定法を作った点が面白い。", "unverified": "本文は入手できず、模擬の設定と効率の向上の大きさは確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "差分プライバシー下のスコア推定の最適率", "title": "Differentially Private Score Estimation with Applications to Score-Based Generative Models", "url": "https://arxiv.org/abs/2611.25536", "authors": "Mengxiao Gao ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Gao, M., Hung, E. K. H., Wu, Y., & Yu, Y. (2026). Differentially Private Score Estimation with Applications to Score-Based Generative Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25536", "why": "差分プライバシーの下で分布のスコア関数を推定する推定量（2次Bスプラインと指数メカニズム、射影ランジュバン法）を作り、ほぼ一致するミニマックス下界を示す。応用として、プライバシー保証がノイズ除去の段数に依存しない拡散モデルを構成する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "差分プライバシーの下で分布のスコア関数（対数密度の勾配）を推定する統計的な限界を明らかにし、ほぼ最適な推定量と、それを使う私的な拡散モデルを示した（抄録）。未査読。", "p3": "局所ヘルダー連続なスコアを持つd次元の準ガウス分布について、2次Bスプラインと指数メカニズムによるサンプリング型の推定量を作り、射影ランジュバン・モンテカルロ法で標本サイズの多項式時間で実装した（抄録）。", "p5": "推定量は差分プライバシーを満たし、密度で重みづけた二乗誤差の期待値の上界とほぼ一致するミニマックス下界を示した。応用として、プライバシーの保証がノイズ除去の段数に依存しない私的な拡散モデルを作り、適切な離散化でほぼミニマックス最適な全変動誤差を得た（抄録）。", "fun": "画像を作るAIは、学習した写真をそのまま覚えて吐き出してしまう危険がある。この研究は、個人のデータを守る「差分プライバシー」の下で、AIの核となる量を推定するときの最良の精度を数学的に示した。守ることと正確さの間の取引を正確に測った点が面白い。", "unverified": "本文は入手できず、実験のデータセットと誤差の数値は確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "科学の共著・引用の仕組みは研究テーマで異なる", "title": "Do Network Mechanisms in Science Vary Across Research Topics? Contextual Relational Hyperevent Models for Large-Scale Bibliometric Data", "url": "https://arxiv.org/abs/2611.26052", "authors": "J\\\"urgen Lerner ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Lerner, J., Wittek, M., & Heiberger, R. (2026). Do Network Mechanisms in Science Vary Across Research Topics? Contextual Relational Hyperevent Models for Large-Scale Bibliometric Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26052", "why": "各論文を著者と参考文献をつなぐ事象とする関係ハイパーイベントモデルを、研究テーマごとに効果が変わるよう拡張し、腫瘍学の約59万本で優先的選択・性別の同類性・自己引用がテーマ間で大きく異なり、その3分の1〜3分の2をテーマの年齢・規模・性別構成で説明できることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "科学の共著・引用のネットワークの仕組み（優先的選択、性別の同類性、自己引用）が研究テーマで異なるかを、大規模な書誌データで推定できる文脈つき関係ハイパーイベントモデル（C-RHEM）を示した（抄録）。未査読。", "p3": "各論文を著者と参考文献をつなぐ1つの事象とし、複数テーマにまたがる参考文献を扱いつつネットワーク効果がテーマごとに変わる単一のモデルを作った。テーマ別の効果の異質性はメタ分析とメタ回帰で定量化する（抄録）。", "p5": "PubMed知識グラフの腫瘍学の約59万本を32のOpenAlexのテーマに割り当てると、優先的選択・性別の同類性・自己引用はテーマ間で大きく異なり（テーマ間の標準偏差はプールした効果の30〜70%）、その3分の1から3分の2をテーマの年齢・規模・性別構成で説明できた（抄録）。", "fun": "人気の論文がさらに引用される「金持ちがもっと金持ちになる」現象や、同じ性別の研究者同士が組みやすい傾向は、どの分野でも同じ強さなのか。この研究は、それが研究テーマによって大きく違うことを約59万本の論文で示した。科学の世界の「くせ」も一様ではない点が面白い。", "unverified": "本文は入手できず、テーマ別の推定値の詳細は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "階層的に流れ込む候補を誤発見率を抑えて選ぶ", "title": "Conformal Selection for Hierarchical Streaming Data", "url": "https://arxiv.org/abs/2611.26328", "authors": "Zhenyuan Sun ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Sun, Z., Yu, C., Ming, R., & Jing, B. (2026). Conformal Selection for Hierarchical Streaming Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26328", "why": "異なる集団から逐次到着する候補を応答が分かる前に選ぶ問題で、集団間・集団内の順位に基づくe値とオンラインe-BH法により、階層的な交換可能性の下で常に誤発見率を制御する、分布に依存しない方法を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "異なる集団から逐次到着する候補を、関心のある応答が分かる前に選ぶ問題で、階層的なデータでも誤発見率を制御できる、分布に依存しないオンライン選択法を示した（抄録）。未査読。", "p3": "集団間と集団内の標本について順位に基づくe値を作り、平均したe値をオンラインのe-BH法に使うOHSを開発し、応答のフィードバックを使って検出力を高めるOHSFも示した（抄録）。", "p5": "穏やかな階層的交換可能性とデータ到着の仮定の下で、いつの時点でも誤発見率を制御することを理論的に示し、共変量シフトや効果に関わる応答の下での選択にも一般化し、模擬と実データで有効性を示した（抄録）。", "fun": "応募者が次々に来て、その場で採用を決めないといけないとき、後で「外れ」と分かる人をどれだけ選んでしまうかを一定以下に抑えたい。しかも応募者は出身のグループごとに傾向が違う。グループの違いを考えながら外れの割合を保証する方法を作った点が面白い。", "unverified": "本文は入手できず、実データの内容と検出力の数値は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "社会的学習の繰返しゲームのフォーク定理", "title": "Folk Theorems for Social Learning", "url": "https://arxiv.org/abs/2611.25280", "authors": "Daniel Luo ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Luo, D., & Wolitzky, A. (2026). Folk Theorems for Social Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25280", "why": "各人が私的な信号を1つ持ち公開された行動を繰り返す、情報の外部性だけのゲームで、人数が多く十分に忍耐強ければ情報が集約される均衡も、自給自足並みの均衡も存在することを示し、先を見越す主体の社会的学習の結果の幅を明らかにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "各人が私的な信号を1つ持ち、公開された行動を繰り返すことだけで情報がやり取りされる繰返しゲームで、情報が集約される均衡も集約されない均衡も存在することを示した（抄録）。未査読。", "p3": "利得が状態と自分の行動だけで決まる純粋な情報外部性のゲームで、各人が条件つき独立の信号を観察した後に公開の行動を繰り返し、割引された期待利得を最大化する設定を分析した（抄録）。", "p5": "人数が十分多く十分に忍耐強ければ、利得が完全情報の利得に近づく情報集約の均衡が、近視眼的な行動では情報が伝わらない場合でも存在する。逆に、近視眼的な行動で状態が明らかになる場合でも、自給自足並みの利得の均衡が存在する（抄録）。", "fun": "みんなが少しずつ違う手がかりを持っているとき、互いの行動を見て学べば、全員で真実にたどり着けるはずだ。この研究は、先を見越して行動する人たちの間では、真実にたどり着く場合と、誰も学ばない場合のどちらも起こりうることを示した。社会の「学び」が保証されない点が面白い。", "unverified": "本文は入手できず、均衡の構成方法の詳細は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "FRBの政策情報と景気情報は融資で逆向き", "title": "Monetary Policy, Information Spillovers and European Syndicated Lending", "url": "https://doi.org/10.2139/ssrn.7710379", "authors": "Dimitrios Gounopoulos ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Gounopoulos, D., Konstantios, D., Michaelides, P. G., Prelorentzos, A.-G., & Tran, K. (2026). Monetary Policy, Information Spillovers and European Syndicated Lending. https://doi.org/10.2139/ssrn.7710379", "why": "米国の金融政策サプライズを高頻度で政策成分と情報成分に分け、欧州の協調融資21,513件で、伝わった政策成分は1標準偏差でスプレッドを6.5bp上げ、良い景気情報は7bp下げることを示す。単一の指標で測る金融ニュースは企業信用への大きく相殺する効果を隠す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米連邦準備制度の発表が持つ将来の政策金利の情報と景気見通しの情報を、欧州の銀行が同じ融資契約の中で別々に、しかも逆向きに価格付けしていることを示した（抄録）。未査読。", "p3": "米国の金融政策サプライズの高頻度の分解、ユーロ圏の政策ニュースへの伝わり方の推定、欧州の非金融企業への協調融資の1999〜2023年の貸し手・融資単位の21,513件の観測を組み合わせた（抄録）。", "p5": "伝わった政策成分が1標準偏差増えるとスプレッドが6.5bp上がり、同じ大きさの良い情報は7bp下げた。良い情報は大きな融資を支え、引き締めは非銀行の投資家への移行を促し、情報は主に経験のある貸し手が価格付けした（抄録）。", "fun": "アメリカの中央銀行の発表には、「金利を上げる」という知らせと、「景気はこう見ている」という知らせが混ざっている。ヨーロッパの銀行は、この2つを聞き分けて融資の金利を逆向きに調整していた。1つの数字にまとめると、2つの効果が打ち消し合って見えなくなる点が面白い。", "unverified": "本文は入手できず、識別の方法と頑健性の検証の詳細は確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "経済的な制約で予測モデルを新環境に適応", "title": "Structural Fine-Tuning under Economic Restrictions", "url": "https://arxiv.org/abs/2611.25420", "authors": "Yi Niu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Niu, Y., Su, Y., & Yang, E. (2026). Structural Fine-Tuning under Economic Restrictions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25420", "why": "少ない観測で予測モデルを新しい経済環境に適応させる際に、資格条件やキャッシュフローなどの経済的な制約を導入する構造的ファインチューニングを提案し、制約が予測を改善する条件を理論で示す。医療費の制度拡大後の与信枠の模擬で、リスク予測のRMSEを28〜39%下げた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "少ない観測で予測モデルを新しい経済環境に適応させる際に、経済的な制約を導入して適応を導く構造的ファインチューニングを提案した（抄録）。未査読。", "p3": "完全な構造モデルは要らず、単純で広く成り立つ仮定から特定の標準モデルまでの経済知識に基づく制約を使う。制約が元のモデルや通常のファインチューニングより予測を改善する条件を理論で特徴づけた（抄録）。", "p5": "メディケイド型の医療費の拡大後の与信枠の決定の模擬で、資格条件、未払いの医療費、キャッシュフロー、集団のリスクの上下限の制約を課すと、ニューロンのゲーティング、LoRA、完全なファインチューニングに比べてリスク予測のRMSEが28〜39%、政策の後悔が3〜10%下がった（抄録）。", "fun": "過去のデータで学んだAIを、制度が変わった後の世界で使うと、少ないデータでは調整がうまくいかない。そこで「この条件の人は対象外」「お金の出入りはこうなる」といった経済の常識を制約としてAIに教えると、予測が大きく良くなった。理論の知識とAIの組合せ方を示した点が面白い。", "unverified": "本文は入手できず、理論の条件の具体的な形は確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "シャープレイ値の安定性をコアと仁で示す", "title": "Stability Bands for Feature Attribution: The Core, the Nucleolus and the Bargaining Set of Explained-Variance Games", "url": "https://arxiv.org/abs/2611.25238", "authors": "Fernando Delbianco ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Delbianco, F., & Tohmé, F. (2026). Stability Bands for Feature Attribution: The Core, the Nucleolus and the Bargaining Set of Explained-Variance Games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25238", "why": "予測の説明に使うシャープレイ値に、特徴の連合が異議を唱えうるかを示す安定性の幅（コア・仁・交渉集合）を加える。線形モデルでは説明分散ゲームが2加法的になり多重共線性が連合の構造を生むこと、凸ゲームでは幅が閉形式になることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "経済学で標準の予測の説明法であるシャープレイ値に、特徴の連合が配分に異議を唱えうるかを示す「安定性の幅」を、協力ゲームのコア・仁・交渉集合で加える方法を示した（抄録）。未査読。", "p3": "特徴の集合の価値をその特徴が生む予測の分散とする説明分散ゲームを定義し、各特徴についてコア（空なら最小コア）上の分け前の範囲を安定性の幅として報告し、仁を代表点とし、正当な異議がないことの証明書を付ける（抄録）。", "p5": "線形モデルではゲームが厳密に2加法的になり、多重共線性が連合の構造を生む。2加法的なゲームでは前仁がシャープレイ値と一致し、凸ゲームでは幅が閉形式になる。小売の注文の予測モデルではコアが空で、仁がシャープレイ値から最大0.19分散分ずれた（抄録）。", "fun": "AIの予測を「この要因が何割効いた」と分ける方法として、ゲーム理論のシャープレイ値が広く使われている。しかし、要因のグループが「自分たちの取り分が少なすぎる」と文句を言える配分かどうかは分からない。分配の公平さを測る協力ゲームの道具で、説明の安定性を確かめた点が面白い。", "unverified": "本文は入手できず、ヘドニック価格モデルの例の数値の詳細は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "福祉国家と持ち家の負の関係は若者の扱いで消える", "title": "Housing-welfare trade-off and young people's homeownership", "url": "https://doi.org/10.31235/osf.io/s6eaq", "authors": "Enrico Benassi ほか", "venue": "SocArXiv", "date": "2026-11-19", "apa": "Benassi, E., & Bedük, S. (2026). Housing-welfare trade-off and young people’s homeownership. https://doi.org/10.31235/osf.io/s6eaq", "why": "EU-SILC（2008〜2019年、21か国）で、手厚い福祉国家ほど持ち家率が低いという関係は、親と同居する若者の住居の扱いによるもので、個人単位で測るとほぼ消えることを示す。最低所得保障や保育の手厚さは若者の自立した居住と高所得層の持ち家と正に関連する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "福祉国家が手厚いほど持ち家率が低いという経験的な関係は、親と同居する若者の住居の扱いを見落とした結果であり、個人単位で測るとほぼ消えることを示した（抄録）。未査読。", "p3": "2008〜2019年のEU-SILCで欧州21か国の持ち家を個人単位で測り直し、多層モデルで福祉国家の手厚さと若者の自立した居住・持ち家の関係を分析した（抄録）。", "p5": "負の関連は、親の持ち家に住む若者が多い東欧・南欧の国々で福祉が手厚くないことによるもので、個人単位では消えた。最低所得保障、社会保険、保育が手厚いほど若者の自立した居住が多く、高所得層では個人の持ち家も多かった（抄録）。", "fun": "福祉が手厚い国ほど持ち家が少ない、という不思議な関係が知られていた。ところが親の家に住む若者も「持ち家に住む人」と数えていたことが原因で、若者本人が家を持っているかで数え直すと、関係はほぼ消えた。数え方の単位ひとつで通説がひっくり返る点が面白い。", "unverified": "本文は入手できず、推定値の大きさと国ごとの結果は確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "定額と定率の割引券で選択の正確さが違う", "title": "Bunching Behavior under Digital Consumption Vouchers", "url": "https://doi.org/10.2139/ssrn.7714723", "authors": "Xiaoyuan Wang ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Wang, X., Wan, L., & Qiao, Y. (2026). Bunching Behavior under Digital Consumption Vouchers. https://doi.org/10.2139/ssrn.7714723", "why": "同じ利用基準額の定額割引と定率割引の電子クーポンを実験室実験で比べ、どちらでも購入が基準額に集中し、定率割引では最適でない選択による損失が大きいことを示す。資格を得るかをまず決め、次に何を買うかを選ぶ2段階のモデルが当てはまる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "同じ利用基準額の定額割引と定率割引の電子クーポンを実験室実験で比べ、購入が基準額に集中する行動と、選択の正確さの違いを示した（抄録）。未査読。", "p3": "理論的な予測が一致する2つのクーポンの規則を単一商品と複数商品の市場で比べ、構造推定と、まず資格を得るかを決めてから何を買うかを選ぶ2段階のモデルで分析した（抄録）。", "p5": "どちらの規則でも購入は基準額に集中し、選択の分布は理論の予測と有意に異なった。定率割引は定額割引に比べて選択の正確さを下げ、最適でない選択による損失を増やした。2段階のモデルが1段階のモデルより当てはまった（抄録）。", "fun": "「一定額以上で何円引き」と「一定額以上で何%引き」は、計算上同じ得になるように設定できる。ところが人は割合で示されると計算を誤りやすく、損な買い方が増えた。しかも人は、まず「条件を満たすか」を決めてから中身を選んでいた。お得の見せ方で行動が変わる点が面白い。", "unverified": "本文は入手できず、実験の参加者数と損失の大きさは確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "PEファンドのESG開示は乏しく成績と負の関連", "title": "Decoding ESG in Private Equity: Disclosures, Labels, and Performance Outcomes", "url": "https://doi.org/10.2139/ssrn.7718299", "authors": "Stefan Morkoetter ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Morkoetter, S., & Mueller, J. N. (2026). Decoding ESG in Private Equity: Disclosures, Labels, and Performance Outcomes. https://doi.org/10.2139/ssrn.7718299", "why": "76のESG管理指標とPEファンド1,437本の世界的なデータで、ESG開示の水準が全体に低く運用会社で差があること、開示が多いほどファンドの成績が低く、投資先のESGリスクとは有意に関連しないこと、ESGの表示の有無で成績に系統的な差がないことを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "76のESG管理指標とプライベート・エクイティ（PE）ファンド1,437本の世界的なデータで、PE業界のESG開示とESGリスク、ファンドの成績の関係を調べた（抄録）。未査読。", "p3": "ファンドのESG開示の水準と、投資先企業のESGリスク・影響の可能性、ESGの表示（ラベル）の有無、ファンドの成績の関連を分析した（抄録）。", "p5": "PEファンドのESGの透明性は全体に低く、運用会社で差があった。開示が多いほど成績が低く、この関連は投資先のESGリスクと影響の可能性を考慮しても変わらなかった。開示は投資先のESGリスクと有意に関連せず、ESGの表示の有無で成績に系統的な差はなかった（抄録）。", "fun": "環境や社会への配慮をたくさん開示している投資ファンドほど、投資先の環境リスクが低いのかというと、そうではなかった。しかも開示が多いファンドほど成績は低めだった。「たくさん語ること」と「実際の中身」が別物でありうることを、千を超えるファンドで示した点が面白い。", "unverified": "本文は入手できず、成績の指標と関連の大きさは確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "高度なエネルギー管理は家庭の元を取れるか", "title": "Should Belgians Install an Advanced Energy Management System in Their Electrified Dwelling ?", "url": "https://arxiv.org/abs/2611.26441", "authors": "Julian Ruddick ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Ruddick, J., De Cauwer, C., Coosemans, T., & Messagie, M. (2026). Should Belgians Install an Advanced Energy Management System in Their Electrified Dwelling ? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26441", "why": "ベルギーの代表的な住宅500戸を電化（ヒートポンプ・電気給湯・EV）した模擬で、モデル予測制御と決定木による制御の年間節約額が規則型制御より82.5〜116.6ユーロにとどまり、購入・契約費用に比べて小さく普及に不利なことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "電化したベルギーの住宅に高度なエネルギー管理システム（EMS）を入れる価値を、代表的な住宅500戸の模擬で評価した（抄録）。未査読。", "p3": "化石燃料の設備を空気熱源ヒートポンプ、電気給湯器、家庭充電のEVに置き換え、太陽光は現在の普及率で割り当てた。モデル予測制御（MPC）と決定木で戦略を表すTreeCを、規則型の制御と完全予報のMPC（上限）と比べ、2023年の時間別料金と月間ピーク料金の実際の契約で評価した（抄録）。", "p5": "規則型に対する年間の平均節約額はTreeCが82.5ユーロ、MPCが116.6ユーロ、完全予報のMPCが177.4ユーロで、温熱快適性は同程度だった。TreeCはEVの充電完了率が高かった（93.3%対88.8%）。節約額はEMSの購入費（280〜680ユーロ）や契約費に比べて小さかった（抄録）。", "fun": "家の電化製品を賢く動かす装置を入れれば電気代は下がるが、そのもとが取れるかは別問題だ。500軒の模擬では、年に数十から百数十ユーロしか節約できず、装置の値段に見合わないことが多かった。技術的にできることと、買う価値があることを分けて考えた点が面白い。", "unverified": "本文は入手できず、住宅の類型別の結果は確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "コンジョイント実験で選好を測る新しい推定量", "title": "Identification of Preferences in Forced-Choice Conjoint Experiments: Reassessing the Quantity of Interest", "url": "https://doi.org/10.31235/osf.io/e638u_v1", "authors": "Flavien Ganter", "venue": "SocArXiv", "date": "2026-11-20", "apa": "Ganter, F. (2019). Identification of Preferences in Forced-Choice Conjoint Experiments: Reassessing the Quantity of Interest. https://doi.org/10.31235/osf.io/e638u_v1", "why": "強制選択のコンジョイント実験で標準のAMCE（平均限界構成効果）は因果量であって選好を識別せず、構成効果と混ざることを示し、回答者の選好のパターンを記述するための推定対象ACP（平均構成選好）とその推定法を提案する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "強制選択型のコンジョイント実験で標準の推定対象である平均限界構成効果（AMCE）が回答者の選好を識別しないことを示し、選好のパターンを記述するための新しい推定対象ACP（平均構成選好）を提案した（抄録）。未査読。", "p3": "コンジョイント実験には、回答者の多次元の選好を明らかにする目的と、属性がプロフィールの選択確率に与える因果効果を推定する目的があると区別し、目的によって推定対象が変わることを論じた（抄録）。", "p5": "AMCEは概念的に因果量で選好の記述という目的とずれ、一般に選好を識別せず、選好と無関係な構成効果が混ざることを示した。選好のパターンを調べるためのACPとその推定法を示した（抄録）。", "fun": "2人の候補者のどちらを選ぶかを何度も聞く「コンジョイント実験」は、政治学などで人気の手法だ。でも、そこで計算される標準の数字は「人々が何を好むか」ではなく「この属性があると選ばれやすくなるか」を表していて、同じではない。目的と物差しのずれを指摘した点が面白い。", "unverified": "本文は入手できず、ACPの定義式と実データへの適用は確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "制約と利用者単位のプライバシー下の方策学習", "title": "Constrained Counterfactual Policy Learning from Logged Bandit Feedback under User-Level Differential Privacy: Excess-risk Guarantees and Results on the Open Bandit Dataset", "url": "https://doi.org/10.2139/ssrn.7693660", "authors": "Thibault Draye", "venue": "SSRN", "date": "2026-11-20", "apa": "Draye, T. (2026). Constrained Counterfactual Policy Learning from Logged Bandit Feedback under User-Level Differential Privacy: Excess-risk Guarantees and Results on the Open Bandit Dataset. https://doi.org/10.2139/ssrn.7693660", "why": "記録されたバンディットのログから、予算や露出の制約と利用者単位の差分プライバシーの下で確率的方策を学ぶ2つの解法と、切り詰めの偏り・推定誤差・プライバシー雑音を分けた超過リスクの上界を示し、プライバシーの代償が生じる利用者数の境目を実験で特定する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記録されたバンディットのログから、予算や露出の制約と利用者単位の差分プライバシーの下で確率的な方策を学ぶ方法と、その超過リスクの保証を示した（抄録）。未査読。", "p3": "傾向を切り詰めた二重頑健推定と厳密な罰則を使い、利用者の抽出つきの雑音のある主双対降下法（CAPRI-SGDA）と、十分統計量を一度だけ公開して厳密な線形計画を解く方法（CAPRI-SSP）を示し、切り詰めの偏り・推定誤差・プライバシー雑音を分けた上界を証明した（抄録）。", "p5": "6つの多クラスデータでのCAPRI-SSPの180回の実行で、上界のプライバシー項が1未満ならプライバシーの代償は平均−0.004、1以上なら0.371だった。代償が小さくなる利用者数は、covertypeのデータでε=8なら約2,100人、ε=1なら約14,900人と見積もられた（抄録）。", "fun": "利用者の行動記録から「誰に何をおすすめするか」を学ぶとき、記録を守るために雑音を混ぜると精度が落ちる。この研究は、利用者が何人いれば雑音の害が小さくなるかの目安を、理論と実験で示した。プライバシーを守る費用がいつ払える額になるかを測った点が面白い。", "unverified": "本文は入手できず、Open Bandit Datasetでの結果の数値は確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "女性CEOが少ない理由を組織の過程として見る", "title": "Beyond the Glass Ceiling Gender Disparity, Leadership Barriers and the Representation of Women in Fortune 500 Companies", "url": "https://doi.org/10.2139/ssrn.7707960", "authors": "Sunidhi Patwari", "venue": "SSRN", "date": "2026-11-20", "apa": "Patwari, S. (2026). Beyond the Glass Ceiling Gender Disparity, Leadership Barriers and the Representation of Women in Fortune 500 Companies. https://doi.org/10.2139/ssrn.7707960", "why": "Fortune 500の女性CEOが2025年に55人（約11%）にとどまることを公開資料と文献から整理し、最初の管理職昇進での脱落、役割適合性の偏見、スポンサーの不足、ケア責任、ガラスの崖などの障壁を検討して、昇進の説明責任と後継者計画の透明化を提言する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "Fortune 500企業で女性CEOが少ない理由を、文献と公開資料から、資格のある女性の不足ではなく、昇進の機会と評価が配分される組織の過程として検討した（抄録）。未査読。", "p3": "女性CEOの人数の推移を公開報告から確認し、昇進のパイプライン、役割適合性の偏見、スポンサーシップや目立つ仕事への不平等な接近、仕事とケアの責任、ガラスの崖の可能性を文献で分析した（抄録）。", "p5": "女性がFortune 500企業を率いたのは2025年に55人（約11%）で、2023年と2024年は52人と、進歩は緩やかだった。最初の管理職への昇進が重要な脱落点であることなどを示し、昇進の説明責任、後継者計画の透明化、スポンサーシップなどを提言した（抄録）。", "fun": "働く女性も学歴の高い女性も増えたのに、大企業の社長に女性はなかなか増えない。その理由は「なれる女性が少ないから」ではなく、最初の管理職への昇進から始まる出世の階段のあちこちで機会が偏っているからだという。結果ではなく途中の過程に目を向けた点が面白い。", "unverified": "本文は入手できず、二次分析に使った資料の詳細は確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "現場労働者の離職意図は疲労の蓄積が左右", "title": "The Breaking Point: A Convergent Parallel Analysis of Frontline Worker Vulnerability, Workplace Strain, and Turnover Intentions in Low-Tech Industries", "url": "https://doi.org/10.2139/ssrn.7718318", "authors": "Tsvi Reiss Post Doc", "venue": "SSRN", "date": "2026-11-20", "apa": "Post Doc, T. R. (2026). The Breaking Point: A Convergent Parallel Analysis of Frontline Worker Vulnerability, Workplace Strain, and Turnover Intentions in Low-Tech Industries. https://doi.org/10.2139/ssrn.7718318", "why": "小売・宿泊・物流の現場労働者69人の調査と50の資料の内容分析を統合し、仕事の要求度-資源モデルに沿って、疲労の蓄積が離職意図の主因で、勤務予定の予測可能性と上司の支援が報酬以上に離職を抑えることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小売・宿泊・物流などの低技術産業の現場労働者の離職意図を、仕事の要求度-資源（JD-R）と資源保存（COR）の枠組みで、混合研究法により調べた（抄録）。未査読。", "p3": "現場労働者69人の調査と、学術論文や業界報告など50の資料をそれぞれ独立の回答者とみなす内容分析を、順序尺度にそろえて統合し（N=119）、資料の種類を統制した最小二乗回帰で分析した（抄録）。", "p5": "累積的な疲労が離職意図の主な要因で、勤務予定の予測可能性と上司の支援が、金銭的な報酬だけよりも離職を強く抑える要因だった（抄録）。", "fun": "スーパーや倉庫で働く人がやめたくなる一番の理由は、給料よりも疲れの積み重ねだった。そして、シフトが前もって分かることや上司の支えが、給料よりも引き留めに効いていた。お金以外の働きやすさの大切さを数字で示そうとした点が面白い。", "unverified": "本文は入手できず、回帰係数の値と資料の選び方の詳細は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "塑性の許容条件を満たすトポロジー最適化", "title": "Plasticity-based topology optimization using weak-form lower-bound yield design and displacement finite elements", "url": "https://doi.org/10.21203/rs.3.rs-11584818/v1", "authors": "Canh V. Le ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Le, C. V., Qian, D., & Nguyen-Xuan, H. (2026). Plasticity-based topology optimization using weak-form lower-bound yield design and displacement finite elements. https://doi.org/10.21203/rs.3.rs-11584818/v1", "why": "弱形式の下界塑性設計と二次錐計画を密度型のトポロジー最適化に統合し、通常の変位型有限要素のまま塑性の許容条件を満たす構造配置を求める逐次凸最適化の枠組みを示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "塑性の許容条件の下での構造のトポロジー最適化を、弱形式の下界塑性設計と二次錐計画（SOCP）で定式化し、通常の変位型有限要素で実装できる枠組みを示した（抄録）。未査読。", "p3": "要素ごとの密度場で構造の形を表し、応力場を弾性成分と残留成分に分けて釣合いと降伏条件を満たし、密度・残留応力の釣合い・塑性の許容条件をSOCPの部分問題に入れて逐次凸最適化で解く。指数的な罰則で中間の密度を抑え、密度フィルタで安定化した（抄録）。", "p5": "いくつかのベンチマーク問題で、物理的に意味のある荷重伝達機構をとらえ、明瞭な構造配置と塑性の許容条件に合う応力分布が得られることを示した（抄録）。", "fun": "コンピュータに「材料をどこに置けば一番強いか」を考えさせるトポロジー最適化では、普通は材料が弾性の範囲で使われる前提で計算する。この研究は、材料が降伏しても粘る性質（塑性）まで考えた最適な形を、使い慣れた計算方法のまま求められるようにした点が面白い。", "unverified": "本文は入手できず、ベンチマーク問題の具体的な形と計算時間は確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "角形鋼管柱とH形梁の溶接接合の連続板の効果", "title": "Effect of continuity plate size on the hysteretic response of a welded moment connection between an HEA beam and a square hollow structural section column", "url": "https://doi.org/10.21203/rs.3.rs-11683783/v1", "authors": "William G. Piraquive ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Piraquive, W. G., Morales, M. A., Lamus, F. A., & Nuñez, F. A. (2026). Effect of continuity plate size on the hysteretic response of a welded moment connection between an HEA beam and a square hollow structural section column. https://doi.org/10.21203/rs.3.rs-11683783/v1", "why": "規準の事前認定接合にないHEA梁と角形鋼管柱の溶接モーメント接合を、実大繰返し試験で検証した3次元非線形FEモデルで25通りの連続板寸法について調べ、0.04 radで柱面のモーメントが梁の全塑性モーメントの1.64〜1.71倍に達し、最大モーメントは板の辺長で増え厚さにほぼ依存しないことを示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "規準の事前認定接合に含まれないHEA梁と角形鋼管柱の溶接モーメント接合で、連続板の寸法が繰返し荷重下の履歴挙動に与える影響を有限要素法で調べた（抄録）。未査読。", "p3": "HEA100の梁と150×150×9 mmの角形鋼管柱を2枚の正方形の連続板で接合した試験体の実大繰返し試験でANSYSの3次元非線形モデルを検証し、辺長（180〜220 mm）と厚さ（8〜19 mm）を組み合わせた25通りを規準の載荷手順で解析した（抄録）。", "p5": "モデルは正側の最大荷重を3%以内、吸収エネルギーを7%以内で再現した。回転0.04 radで柱面のモーメントは全構成で梁の全塑性モーメントの1.64〜1.71倍となり、特殊モーメント骨組の要求0.8を大きく上回った。最大モーメントは板の辺長で増え、厚さにほぼ依存しなかった（抄録）。", "fun": "安く建てたい集合住宅の鉄骨で、柱と梁のつなぎ目を設計の決まりにない組合せで作りたい。この研究は、実物大の実験で確かめた計算モデルを使い、つなぎ目の補強板の大きさを変えて25通り試した。板を厚くするより大きくするほうが強さに効くという結果が意外で面白い。", "unverified": "本文は入手できず、各構成の吸収エネルギー（抄録では4.45〜5.19 kJの範囲）以外の詳細は確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "力学を損失に入れたRC建物の耐震補強の選定", "title": "A Physics-Informed Machine Learning Framework for Probabilistic and Code-Compliant Seismic Bracing Selection in Reinforced Concrete Buildings", "url": "https://doi.org/10.21203/rs.3.rs-11656338/v1", "authors": "Vincent SAm Jebadurai S ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "S, V. S. J., & Israr, M. (2026). A Physics-Informed Machine Learning Framework for Probabilistic and Code-Compliant Seismic Bracing Selection in Reinforced Concrete Buildings. https://doi.org/10.21203/rs.3.rs-11656338/v1", "why": "応答スペクトルの層間変形の残差と規準の変形限界のヒンジ罰則を損失に組み込んだ物理制約つき機械学習で、800の合成RC架構からブレース補強の選択を確率つきで予測し、外挿でも変形の単調性を保ち力学の残差を約70%減らした。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "耐震基準以前の鉄筋コンクリート（RC）建物のどの架構を何で補強するかを、力学を学習の制約として入れた機械学習で、確率つきで基準に適合する形で選ぶ枠組みを示した（抄録）。未査読。", "p3": "データの誤差、釣合いを課す応答スペクトルの層間変形の残差、基準の変形限界に対するヒンジ型の罰則、予測確率を安定させるモンテカルロの分散項からなる損失で、地震地域・地盤種別・不整形指標にわたる物理的に整合した合成RC架構800体で学習した（抄録）。", "p5": "精度は88〜92%、マクロF1は0.86〜0.90だった。通常のモデルは分布内でわずかに高いが外挿で変形の単調性を破り、提案モデルは力学の残差を約70%減らした。予測した補強後の変形を対数正規の脆弱性関数に入れると、累積の崩壊の脆弱性が約62%下がった（抄録）。", "fun": "古い建物の耐震補強を何千棟も判断するのに、AIは速いが、物理の法則に反する答えを自信満々に出すことがある。この研究は、力の釣合いや基準の上限を学習のルールに組み込み、物理的に筋の通る答えを出しやすいAIにした。「正確さより物理の一貫性が大事」という主張が面白い。", "unverified": "本文は入手できず、合成架構の作り方と実建物での検証の有無は確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "オペレーションズ・リサーチ", "headline": "臨界減衰ポリャク刻みで平坦な極小へ", "title": "A new algorithmic approach for finding flat minima: critically damped Polyak stepsizes", "url": "https://arxiv.org/abs/2611.26475", "authors": "Francesco Caporali ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Caporali, F., Altschuler, J. M., & Hanin, B. (2026). A new algorithmic approach for finding flat minima: critically damped Polyak stepsizes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26475", "why": "古典的なポリャクのステップ幅を4倍して穏やかな減衰をかける規則が、極小の多様体の周りで振動しつつ収束し、損失が小さくなると鋭さを下げる方向に進むことを局所2次の損失で一様な保証つきで示す。SAMに似た平坦化を学習済みLLMの微調整でも確認した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "勾配降下法を平坦な極小（鋭さの小さい解）へ導く適応的なステップ幅「臨界減衰ポリャク（CDP）ステップ幅」を提案し、鋭さと損失の低下について時間一様な保証を初めて示した（抄録）。未査読。", "p3": "古典的なポリャクの規則に4を掛け、穏やかな減衰を加える。4倍は極小の多様体の周りで等振動を生む臨界の値で、減衰が多様体への収束を保証する。損失が小さくなると、射影した反復はヘッセ行列の最大固有値の対数の勾配降下に従う（抄録）。", "p5": "局所的にモース・ボット構造を持つ非負の損失の広いクラスで理論を確立した。実験では、理論の範囲外の非線形の教師・生徒ネットワークや学習済みLLMの微調整でも、SAMに似た平坦化の効果で鋭さを下げた（抄録）。", "fun": "AIの学習では、谷底の形が「とがった谷」より「なだらかな谷」に落ち着いたほうが、新しいデータにも強いことが多い。この研究は、一歩の大きさを古典的な公式のちょうど4倍にすると、谷の壁で振動しながらなだらかな場所へ移っていくことを示した。4倍という数字に意味がある点が面白い。", "unverified": "本文は入手できず、LLMの微調整での鋭さの数値は確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "オペレーションズ・リサーチ", "headline": "LLMエージェントに最適化の算法を設計させる", "title": "The FrontierOR Challenge: Agentic Algorithm Design for Operations Research", "url": "https://arxiv.org/abs/2611.26171", "authors": "Hai Wang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Wang, H., Hajek, B., Jiang, C., Kong, M., Qu, A., Gong, H., Dong, B., Barnhart, C., & Zhao, J. (2026). The FrontierOR Challenge: Agentic Algorithm Design for Operations Research (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26171", "why": "最強のモデルでも大規模事例の39%でしかGurobiに並べない現状を踏まえ、180問の監査済み問題からなるFrontierORベンチマークで、多数の最適化問題の算法を設計・検証・改善するエージェントの仕組みを競う課題の設計（段階・部門・採点）を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMエージェントが多数の最適化問題の算法を設計・検証・改善できるかを競う課題FrontierOR Challengeの設計を示した（抄録）。未査読。", "p3": "監査済みの180問からなるFrontierORベンチマークを使い、第1段階で6つの応用分類・5つの定式化の型にわたる60問を毎週15問ずつ公開し、第2段階でベンチマーク外の新しい問題と未見の事例を出す。外部と隔離した環境で実行する部門と、自前の計算機で解く部門を別々に順位づける（抄録）。", "p5": "現状では最強のモデルでも、大規模な事例の39%でしか目的関数の値がGurobiの1%以内かつ速度で劣らない水準に達しない。実行可能な解は、隠した事例での既知の参照値との比の平均で採点する（抄録）。", "fun": "配送ルートや勤務表のような最適化の問題は、専門家が問題ごとに何週間もかけて解き方を工夫してきた。AIに解き方そのものを考えさせたら専門のソフトに勝てるのか。今のところ大きな問題では4割弱しか並べないという現状を示し、競技として挑戦を呼びかけた点が面白い。", "unverified": "競技の設計を示す論文で、参加チームの結果はまだない。本文は入手できず、採点の詳細は確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "オペレーションズ・リサーチ", "headline": "半正定値計画ソルバをClaudeで形式検証", "title": "Formally Verified Semidefinite Programming", "url": "https://arxiv.org/abs/2611.25174", "authors": "Perry Hart", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Hart, P. (2026). Formally Verified Semidefinite Programming (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25174", "why": "手書きのRust製の一次法の半正定値計画ソルバについて、検証全体をClaudeにVerus（Rustの自動定理証明器）で生成させ、数値ソフトウェアの正しさを証明した事例と、その算法・実装・証明の進め方を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "手書きのRust製の一次法の半正定値計画（SDP）ソルバについて、Rustの自動定理証明器Verusでの検証の全体をClaudeに生成させ、形式的に検証された数値ソフトウェアを作った（抄録）。未査読。", "p3": "ソルバの算法、Rustでの実装、Verusでの正しさの証明を実用的に進めた方法を説明する（抄録）。", "p5": "簡単ではない数値ソフトウェアである一次法のSDPソルバについて、人が書いた実装に対する検証の全体をLLMに生成させ、正しさを証明したことを報告した（抄録）。", "fun": "プログラムが正しく動くことを数学的に証明するのは、プログラムを書くより何倍も手間がかかる。この研究では、人が書いた最適化の計算プログラムについて、その証明をまるごとAIに書かせた。AIが「書く」だけでなく「正しさを保証する」側に回り始めた点が面白い。", "unverified": "本文は入手できず、証明の規模とAIへの指示の詳細は確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "オペレーションズ・リサーチ", "headline": "情報領域を絞った分散MPCで信号制御を高速化", "title": "Information-Region MPC: Non-Iterative Distributed Control of Urban Traffic Signals", "url": "https://arxiv.org/abs/2611.26141", "authors": "Qiongdan Hu ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Hu, Q., Yang, M., Wang, M., & Tan, C. (2026). Information-Region MPC: Non-Iterative Distributed Control of Urban Traffic Signals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26141", "why": "集中型MPCの最初の制御入力に効く交差点を履歴データから定めた情報領域だけで、各交差点が反復協調なしに局所問題を一度解く分散制御を提案し、28交差点の実網の模擬で集中型の9倍速く、制御入力の85%を完全に再現し、平均遅れの増加は0.03%だった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "集中型のモデル予測制御（MPC）の最初の制御入力を、反復協調なしに限られた実時間データで近似する分散型の信号制御IR-MPCを提案した（抄録）。未査読。", "p3": "履歴の交通データから、他の交差点の摂動が各交差点の集中型の最初の制御入力にどれだけ影響するかを定量化し、その結合で交差点ごとのコンパクトな情報領域を作る。各更新で各交差点は自分の情報領域のデータだけで局所問題を一度解く（抄録）。", "p5": "28交差点の実網のSUMOの模擬で、IR-MPCは集中型MPCの9倍、代表的な反復分解型の分散MPCの15倍速く制御入力を計算し、集中型の制御入力の85%を正確に再現し、99.3%を2秒以内に収め、平均遅れの増加は0.03%だった（抄録）。", "fun": "街中の信号を全部まとめて最適に制御すると、計算が重すぎて間に合わない。この研究は、各交差点が「自分に本当に影響する範囲」だけを見て1回計算すれば、全体の最適にほぼ近い答えになることを示した。全部を見なくても、見るべき範囲を賢く選べば十分だという発想が面白い。", "unverified": "本文は入手できず、情報領域の大きさの決め方と交通需要の条件は確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "オペレーションズ・リサーチ", "headline": "最大被覆施設配置をGPUで高速に解く", "title": "Covering Location Optimization at GPU Speed", "url": "https://arxiv.org/abs/2611.25434", "authors": "Yun-Tian Zhang ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Zhang, Y.-T., & Chen, C. (2026). Covering Location Optimization at GPU Speed (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25434", "why": "1対1交換の増分をGPUで評価する並列探索で最大被覆配置問題を解き、9つの都市の事例で既知最良解との差を平均0.029%にし、最大の事例（候補7,730・施設50）を一般向けGPUで平均45.2秒で既知最良解に到達させた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "都市の施設配置に現れるNP困難な最大被覆配置問題を、GPUで加速した並列探索で高速に解く枠組みを示した（抄録）。未査読。", "p3": "1対1交換の近傍の構造を使い、正確な増分の利得を疎な被覆表現とタイル化したCUDAカーネルで評価し、階層的な縮約で最良の交換を求める。GPU上の破壊・修復と優良解からの再出発で、集中化と多様化を両立させた（抄録）。", "p5": "9つの実際の都市の構成で既知最良解との平均の相対差は0.029%で、90回中50回で既知最良解に到達した。最大の事例（候補7,730、施設50）では一般向けGPUで10回すべて既知最良解に達し、最終解までの平均は45.2秒（計算機クラスタでの既存手法の報告値は99.5秒）だった（抄録）。", "fun": "限られた数の施設をどこに置けば、できるだけ多くの人をカバーできるか。候補地が数千あると組合せは天文学的な数になる。この研究は、ゲーム用のグラフィックボードで多数の候補を同時に試し、大型の計算機での既存の方法より速く最良の答えにたどり着いた点が面白い。", "unverified": "本文は入手できず、GRASPとの比較の詳細は確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "オペレーションズ・リサーチ", "headline": "複数拠点のAIデータセンターを前日市場で運用", "title": "Optimal Scheduling of Multi-Site AI Data Centers in Day-Ahead Markets", "url": "https://arxiv.org/abs/2611.26572", "authors": "Xinyang Zhou ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Zhou, X., & Cavraro, G. (2026). Optimal Scheduling of Multi-Site AI Data Centers in Day-Ahead Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26572", "why": "GPUの電力上限、締切つきの遅延可能なジョブ、拠点間の振り分けを線形計画でつなぐ複数拠点のAIデータセンターの運用モデルを作り、2025年のカリフォルニアの前日価格で1年間模擬すると、協調運用で同じ仕事量のエネルギー費用が6.3%下がった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "複数拠点のAIデータセンター群で、運用者が制御できるもの（GPUの電力上限、ジョブの時刻と配置）と各拠点の電力・電気料金を結びつける枠組みを作り、前日市場の価格で最適な運用計画を求めた（抄録）。未査読。", "p3": "GPUの電力上限の段階、締切つきの遅延可能なジョブ、応答時間に余裕のある推論、拠点の施設電力を表し、運用計画を前日価格の下での線形計画として定式化した（抄録）。", "p5": "2025年のカリフォルニア独立系統運用機関（CAISO）の前日価格による3つの市場での1年間の模擬で、協調した運用は同じ仕事量でエネルギー費用を6.3%下げた。機能を1つずつ加える4つの運用の型で、その節約を価格信号の要らない効率的なGPU運用、時間方向の価格対応、拠点間の振り分けに分解した（抄録）。", "fun": "AIの計算をする巨大な施設は、電気の大食いだ。この研究は、電気が安い時間と安い場所に仕事を回し、GPUの電力の上限を調整することで、同じ量の計算の電気代を6.3%下げられることを示した。AIの施設が電力網の調整役にもなりうる点が面白い。", "unverified": "本文は入手できず、3つの市場の名前と費用の内訳の数値は確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "近くの石材工場の振動で高速鉄道橋が横共振", "title": "Low-frequency industrial excitation induced lateral resonance of high-speed railway bridge: field measurements and coupled dynamic analysis", "url": "https://doi.org/10.1177/10775463261508515", "authors": "Yunhao Zhong ほか", "venue": "JVC/Journal of Vibration and Control", "date": "2026-11-20", "sjr": 0.588, "citescore": 6.1, "citescore_year": "2025", "apa": "Zhong, Y., Liu, L., Zuo, Z., Qin, J., & Song, L. (2026). Low-frequency industrial excitation induced lateral resonance of high-speed railway bridge: field measurements and coupled dynamic analysis. Journal of Vibration and Control. https://doi.org/10.1177/10775463261508515", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Vibration and Controlの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "石材加工場に隣接する高速鉄道橋の異常な横揺れが、工場の機械による約1.42 Hzの地盤振動と、橋の横方向の1次固有振動数（約1.49 Hz）が近いことによる共振に近い増幅であることを、現地計測と連成動的解析で示した（抄録）。", "p2": "対象は、石材加工場の隣の高速鉄道橋で観測された異常な横振動である。地盤を伝わる振動、構造の境界の柔らかさ、列車の走行安全の評価を一体で扱う必要があった（抄録）。解釈：列車ではなく周辺の工場が橋を揺らす、外部の加振源の問題である。", "p3": "現地計測、モード解析、振動の伝播解析と、橋脚・基礎の柔らかさを入れた車両・軌道・橋梁の連成動的モデルを組み合わせた。異なる連成の定式化を比べ、振動数比と多パラメータの解析で、機械の回転数、列車の速度、振動源までの距離、稼働台数に対する輪重の応答の感度を調べ、ランダムな軌道不整で応答のばらつきも評価した（抄録）。", "p4": "計測した卓越振動数と固有振動数の比（約0.95）から、1自由度系の近似で動的増幅率を見積もった（抄録）。解釈：計測と解析モデルの両方で、共振の仕組みと列車への影響を確かめる構成である。", "p5": "橋の振動の卓越成分は約1.25〜1.60 Hzに集まり、機械の回転数と同期運転に強く左右された。20台が毎分90回転で動くと横変位は最大1.89 mmに達し、機械の停止で応答は約95%減った。1自由度の見積もりでは動的増幅率は約9.2だった。対策として回転数の回避、同時運転の制限、振動源側の絶縁を検討した（抄録）。", "p6": "抄録には限界の記述がない。解釈：1つの橋と1つの工場群の事例であり、他の橋や加振源への一般化と、対策の効果の実測は抄録では確認できない。", "fun": "高速鉄道の橋が、通過する列車ではなく、近くの石材工場の機械のせいで横に揺れていた。機械の回転のリズムが、たまたま橋の揺れやすいリズムとほぼ同じだったのだ。ブランコを押すタイミングが合うと大きく揺れるのと同じ共振の仕組みが、巨大な橋で起きていた点が面白い。", "unverified": "本文を入手できず、連成モデルの詳細、輪重の応答の数値、走行安全の判定結果は確認していない。"}}, {"id": "jr02", "rank": 2, "headline": "温度変動下の橋のたわみをGRUとELMで高速予測", "title": "Efficient bridge deflection prediction using a GRU-FA-ELM model with feature attention and fast regression", "url": "https://doi.org/10.1177/14759217261504353", "authors": "Jia-Huan Xi ほか", "venue": "Structural Health Monitoring", "date": "2026-11-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Xi, J.-H., Zhou, G.-D., Chen, J.-M., Yan, Y., & Xu, Y.-C. (2026). Efficient bridge deflection prediction using a GRU-FA-ELM model with feature attention and fast regression. Structural Health Monitoring. https://doi.org/10.1177/14759217261504353", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Health Monitoringの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "長大橋の長期モニタリングで、GRUで時系列の特徴を取り出し、特徴注意で重みづけし、極限学習機械（ELM）で高速に回帰するGRU-FA-ELMモデルを提案し、斜張橋の現地データで、比較モデルより高い精度と短い計算時間を示した（抄録）。", "p2": "橋のたわみは剛性・供用状態・運用の安全性の情報を与える重要な応答だが、長大橋では温度のランダムな変動と複雑な力学系のため、正確で効率的な予測が難しく、精度と効率の両立が課題だった（抄録）。", "p3": "GRUが多変量のモニタリングデータから時間の依存関係を抽出し、時間窓を要約する最終の隠れ状態を作る。特徴注意がその寄与を調整し、ELMが強化した特徴をたわみに写す。Optunaでハイパーパラメータを同時に最適化し、教師あり回帰の学習とELMの学習の2段階で訓練を軽くした（抄録）。解釈：重い学習はGRUに任せ、最後の回帰を一度の計算で解けるELMにして速くした。", "p4": "斜張橋の現地モニタリングデータで、GRU、BiGRU、LSTM、双方向LSTM、GRU-ELMと、小標本と大標本のデータセットで比べた（抄録）。", "p5": "提案モデルはどちらのデータセットでも予測精度が比較モデルより高く、計算時間は再帰型の比較モデルより約22〜51%短く、GRU-ELMよりわずかに長いだけだった（抄録）。", "p6": "抄録には限界の記述がない。解釈：検証は1つの斜張橋で、精度の差の大きさ（誤差の値）は抄録では確認できない。温度などの入力の選び方が結果に効くかも本文で確かめる必要がある。", "fun": "大きな橋は、気温の変化や車の重さで毎日少しずつたわんでいる。この研究は、たわみを予測するAIで、時間の流れを読む部分と最後に答えを出す部分を分け、答えを出す側を一度の計算で済む仕組みにして速さを稼いだ。精度と速さのどちらも欲しいという現場の要求に応える工夫が面白い。", "unverified": "本文を入手できず、予測誤差の具体的な値、入力の変数、データの期間は確認していない。"}}, {"id": "jr03", "rank": 3, "headline": "一体橋台の踏掛版のひずみは温度勾配に支配", "title": "Multiyear Structural Field Performance of Integral Abutment Bridge Approach Slabs", "url": "https://doi.org/10.1061/jpcfev.cfeng-5591", "authors": "Gaoyu Liu ほか", "venue": "Journal of Performance of Constructed Facilities", "date": "2026-11-18", "sjr": 0.509, "citescore": 4.3, "citescore_year": "2025", "apa": "Liu, G., LaFave, J. M., & Fahnestock, L. A. (2027). Multiyear Structural Field Performance of Integral Abutment Bridge Approach Slabs. Journal of Performance of Constructed Facilities, 41(1). https://doi.org/10.1061/jpcfev.cfeng-5591", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Performance of Constructed Facilitiesの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "米国イリノイ州のインテグラル橋台橋の踏掛版（アプローチスラブ）2枚を施工時から2.5年間計測し、版の変形と応力が温度と強く相関し、境界条件の変化で応力と温度の関係が非線形になること、ひび割れの危険のある箇所があることを示した（抄録）。", "p2": "インテグラル橋台橋は従来の橋台より建設・維持の費用が低く長寿命なため米国で広く使われるが、踏掛版のひび割れが多くの州で問題になっている。設計は州ごとに異なり、単純なモデルに基づく仕様規定が多い。厚さ方向の温度勾配は舗装の挙動に大きく効くが、踏掛版ではほとんど測られていなかった（抄録）。", "p3": "イリノイ州道390号線のインテグラル橋台橋で、4車線の現場打ちと3車線のプレキャストの踏掛版を施工時に計器化し、平面上の位置と厚さ方向でのコンクリートのひずみと温度、版全体の縦方向の変位を2.5年間計測した（抄録）。解釈：供用中の版を長期に追い、季節と1日の温度サイクルでの挙動を見る現場計測である。", "p4": "計測に加えて状態調査を行い、計測データと照らし合わせてひび割れの危険のある箇所を調べた（抄録）。", "p5": "版の変形と応力は温度と強く相関し、時間とともに境界条件が変わるため、応力と温度の関係は非線形になった。典型的な年と日のサイクルでの厚さ方向の詳細な温度勾配が得られ、後の数値シミュレーションに使える。計測と状態調査から、ひび割れの危険のある箇所が複数あると分かった（抄録）。", "p6": "抄録には限界の記述がない。解釈：2枚の版、1つの路線の事例なので、他の気候や設計への一般化には追加の計測が要る。ひび割れの危険の判定基準は抄録では確認できない。", "fun": "橋と道路の境目にある板（踏掛版）は、橋が気温で伸び縮みするたびに押したり引いたりされ、ひび割れやすい。この研究は、実際の道路の板にセンサーを埋め込んで2年半見守り、板の上と下で温度が違うことや、時間とともに支え方が変わる様子を記録した。目立たない部品の地道な観察が面白い。", "unverified": "本文を入手できず、ひずみ・応力の具体的な値と、現場打ちとプレキャストの違いは確認していない。"}}, {"id": "jr04", "rank": 4, "headline": "生成AIの利用頻度が高いほど燃え尽きが低い", "title": "Generative Artificial Intelligence Use Related to Worker Wellbeing: An Exploration of GenAI Use Frequency, GenAI Use Functions, and Burnout Dimensions Across Workers", "url": "https://doi.org/10.3390/bs16112180", "authors": "Michael Cody Coker ほか", "venue": "Behavioral Sciences", "date": "2026-11-18", "sjr": 0.828, "citescore": 4.1, "citescore_year": "2025", "apa": "Coker, M. C., Shin, I., Riforgiate, S. E., & Godager, E. A. (2026). Generative Artificial Intelligence Use Related to Worker Wellbeing: An Exploration of GenAI Use Frequency, GenAI Use Functions, and Burnout Dimensions Across Workers. Behavioral Sciences, 16(11), 2180. https://doi.org/10.3390/bs16112180", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Behavioral Sciencesの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "フルタイムの労働者382人の調査で、生成AIを使う頻度が高いほど燃え尽き（バーンアウト）全体、とくに非効力感の次元が低いこと、作業の補助としての利用がこの次元の低さと関連することを示した（抄録）。", "p2": "生成AIが仕事に組み込まれるにつれ、職務上の欲求を満たす可能性と制約が変わり、燃え尽きに影響しうる。本研究は、利用の頻度に加えて具体的な使い方と勤務形態などの個人の要因を、燃え尽きの3つの次元（冷笑、非効力感、情緒的消耗）と関連づけた（抄録）。", "p3": "混合研究法で、382人の調査データを量的に分析し、自由記述の回答から生成AIの仕事での使い方を質的に分類した。勤務形態（出社・ハイブリッド・リモート）、労働時間、年齢と使い方の関係を事後分析で調べた（抄録）。解釈：同じ時点の調査なので、AIが燃え尽きを減らすのか、燃え尽きていない人がAIを使うのかは区別できない。", "p4": "職務要求・資源モデル（JD-R）の枠組みで、使い方が資源として働くか要求として働くかを解釈した。職場での生成AIの使い方を分類する尺度づくりの枠組みも示した（抄録）。", "p5": "使い方は主に、コミュニケーション、調べもの、問題解決、作業の補助、学習の5つだった。作業の補助は非効力感と負に関連し、問題解決は有意傾向の負の関連だった。出社の従業員と労働時間の長い従業員は作業の補助に使いやすく、出社の従業員と若い労働者は問題解決に使いやすかった（抄録）。", "p6": "抄録には限界の記述がない。解釈：横断的な調査で標本も大きくないため、関連は因果を意味しない。著者も、生成AIの進化とともに今後の研究が必要だと述べる（抄録）。", "fun": "生成AIを仕事でよく使う人ほど、燃え尽きにくいのか。この研究は、AIを「作業の手伝い」に使う人ほど「自分は仕事ができていない」という感覚が弱いことを見つけた。しかも、在宅勤務の人より出社している人の方が、そうした使い方をしていた。AIが仕事の手応えを支えるかもしれない点が面白い。", "unverified": "本文を入手できず、回帰の係数や効果の大きさ、質的な分類の手順は確認していない。"}}, {"id": "jr05", "rank": 5, "headline": "隣のトンネルが地下鉄振動の地表分布を変える", "title": "Surface Vibration near Twin Metro Tunnels in Layered Ground: Peak Amplification and Spatial Redistribution", "url": "https://doi.org/10.3390/buildings16224626", "authors": "Chunhui Wang ほか", "venue": "Buildings", "date": "2026-11-19", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Wang, C., Sun, K., & Hu, T. (2026). Surface Vibration near Twin Metro Tunnels in Layered Ground: Peak Amplification and Spatial Redistribution. Buildings, 16(22), 4626. https://doi.org/10.3390/buildings16224626", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Buildingsの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "列車の走っていない隣の地下鉄トンネルが、層状の地盤で地表の振動の最大レベルを1.85 dB大きくし、振動の大きい場所を移すことを、2.5次元の数値モデルで示した（抄録）。", "p2": "並んだ2本の地下鉄トンネルでは、片方を列車が走るとき、もう一方のトンネルが地盤の振動の伝わり方を変えうる。近くの建物への振動の入力を評価するには、その影響を知る必要がある（抄録）。", "p3": "対称性で縮約した2.5次元の有限要素法・基本解法・直接剛性法（2.5D FEM–MFS–DSM）のモデルを作り、独立した半解析の基準解と北京地下鉄10号線の計測と照合した。列車の連成加振と、80 Hzで移動する単位荷重の両方で、トンネルの間隔と深さを変えて地表の応答を調べた（抄録）。解釈：トンネル方向に一様な構造を2.5次元で扱い、3次元の計算を軽くしている。", "p4": "3つの地表の受振点での平均絶対誤差は1.45 dBだった。複素数の場の分析で、変化の大きさ、相対的な位相
