で評価した（§5）。比較は線形のWald区間、ランダム特徴、TabPFNの予測区間、ブートストラップ、AMPの5つで、95%名目での被覆率と区間長を指標とした（§5）。", "p5": "TabConはすべての設定で被覆率が95%を上回り名目に最も近く、十分な被覆を得た手法の中ではほぼすべての設定で区間が最も短かった（§5、表1）。ストレステストの個別の設定でも被覆率は94%以上を保った（図2）。TabPFNの予測区間は過大被覆で、TabConより13〜148%長かった（§1、§5）。推論時の計算はブートストラップ（50標本でも）より50倍速かった（抄録、表2）。専門家の頭部と強化学習を外すと、個別の設定で被覆が大きくずれた（図3）。", "p6": "著者は、仮説検定など信頼区間以外の推論を同じ基盤モデルで償却できるかは未解決とする（§6）。解釈：保証は学習に使った種類のデータ生成過程にどれだけ近いかに依存し、分布から大きく外れた実データでの被覆率の理論保証はない。未査読のプレプリントである。", "fun": "統計の授業では、問題ごとに公式を選んで「この値は95%の確率でこの範囲」と区間を計算する。この研究は、何万通りもの練習問題で「自分の推定がどれくらい外れるか」をAIに覚えさせ、新しいデータには一瞬で区間を答えさせた。しかも計算の重い方法より50倍速い。統計学者の仕事を丸ごと学習させる大胆な発想が面白い。", "unverified": "表1の設定別の被覆率・区間長の数値と、強化学習の報酬設計の重みは確認していない。"}}, {"rank": 10, "field": "機械学習", "headline": "事前学習中にLMはオウムと知性を行き来する", "title": "Generalization Dynamics of LM Pre-training", "url": "https://arxiv.org/abs/2609.33150", "authors": "Jiaxin Wen (UC Berkeley) ほか", "venue": "arXiv", "date": "2026-09-29", "why": "言語モデルが事前学習の途中で丸暗記的な振る舞いと汎化的な振る舞いを突然行き来することを示した。", "id": "pn10", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（本文冒頭の要旨、序論、評価スイートの節、§3.1、第4節の帰無仮説の検討、§5.1）を読んだ。§3.2〜3.6と付録の図の数値は一部のみ", "preprint": true, "p1": "言語モデルは事前学習の間に「オウムのような表面的パターン合わせ」から「汎化する知性」へ安定して成熟していくという通念に反し、訓練の途中で両者の間を突然何度も行き来する「モード・ホッピング」を示し、それを使って汎化しやすいチェックポイントを選べることを示した（本文冒頭の要旨）。", "p2": "事前学習の損失や下流のベンチマークは滑らかに改善するため、汎化の能力も安定して育つと想定されてきた（§1、図1）。しかし、表面的なパターンと本当の推論を区別する振る舞いの指紋を、訓練の全過程で追った研究はなかった（§1）。", "p3": "訓練データと途中のチェックポイントを公開しているOLMo3とApertusを対象に、表面的パターンと汎化を区別する6種の小さな評価（ラベルを反転した文脈内学習、「答え+1」の誘惑、もっともらしさと真実、直感的な答え、ペルソナの多段推論など）を作り、正解と誤答の答えの確率を比べた（§2、表1）。4つの乱数で平均した（§2）。", "p4": "対立仮説として、評価の一般的な雑音（一般的なデータセットでは性能は安定）、指標選択の錯覚（確率でも同様に跳ぶ）、通常の最適化の振動（1ステップの更新では変わらない局所安定性）を検討した（第4節）。応用として、選んだチェックポイントを事後学習し、GPQAへの汎化とプリフィル攻撃への頑健性を比べた（§5.1）。", "p5": "OLMo3-32Bの「答え+1」の評価で、2.17兆トークン時点の正解率81%が2.19兆で0%に崩れ、2.21兆で81.7%に戻った（§1）。この振る舞いはチンチラ最適の9〜90倍の学習量でも続き、チェックポイントの平均では緩和されても消えなかった（§1）。評価で選んだ4.5兆トークンのチェックポイントは、4.9兆のものより数学の事後学習後のGPQAが36.3%対29.8%、一般の事後学習後のプリフィル攻撃への頑健性が53%対21%と良く、最終の事前・中間学習のチェックポイントより汎化した（§5.1、図13）。", "p6": "著者は、モード・ホッピングがデータセット間で常に共通とは限らないこと（§4.4）、データ選択の実験は小規模な予備的なものであることを述べる（§5.2）。解釈：容量の配分という説明は仮説で、直接の因果の検証はまだない。未査読のプレプリントである。", "fun": "AIは勉強を続けるほど賢くなると思いがちだが、訓練の途中で「ちゃんと考える」状態と「パターンを丸暗記でまねる」状態を行ったり来たりしていた。ある問題では、わずかな学習の差で正解率が81%から0%に落ち、また81%に戻った。テストの点が同じでも中身の考え方が違うことがある、という点は人間の勉強にも通じて面白い。", "unverified": "§3.2〜3.6の各評価での振る舞いの具体的な数値と、データ選択の実験（§5.2）の結果は確認していない。"}}, {"rank": 11, "field": "経営学", "headline": "生成AIの回答が検索広告の競争をどう変えるか", "title": "Generative AI and Seller Competition in Sponsored Search Quality, Placement, and Access", "url": "https://doi.org/10.2139/ssrn.7530542", "authors": "Gaoyan Lyu ほか", "venue": "SSRN", "date": "2026-09-29", "why": "検索基盤が直接答える時代の、AI回答の質・配置と広告主の競争の関係をモデル化した。", "id": "pn11", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "p1": "検索基盤が生成AIで質問に直接答えるようになったとき、AI回答の質・表示位置・利用料金をどう設計すべきかを、閲覧者が順に検索し売り手が自分の適合度を私的に知るモデルで分析し、AIの質と目立たせ方が一緒に動くとは限らないことなどを示した（抄録）。", "p2": "AIの回答が良く目立つほど閲覧者の価値は上がるが、スポンサーリンクに届く前に検索が終わって広告収入が減る。この運営上の緊張関係を、質・配置・料金の同時設計として扱った研究は乏しかった（抄録）。", "p3": "閲覧者は結果を順に見て探索を止めうる逐次探索者、売り手は適合度を私的に知る広告主とし、プラットフォームがAIの質、表示順（スポンサーリンクの前か後か）、閲覧者への課金を選ぶ理論モデルを解いた（抄録）。", "p4": "比較の軸は、無料利用と有料利用、無料の検索の選択肢を残すか、プラットフォームの利潤と社会的厚生・消費者余剰の違いである（抄録）。実データでの検証は抄録に記載がない。", "p5": "無料利用では、AIの収益化が進むとAIを前に置きつつ質を下げるのが最適になりうる（前に置くほど広告収入の共食いが増えるため）（抄録）。有料化すると参加の誘因が加わり、AIの露出が儲かるほど質を上げ価格を下げて有料利用者を増やしうる（抄録）。無料の選択肢を残すことも全経路の課金も、常に有利とは限らない（抄録）。売り手の私的情報のため、プラットフォームはAIの質に過剰投資しうり、利潤最大の中間配置はAIを広告の後に置く配置に厚生で劣りうる（抄録）。", "p6": "解釈：理論モデルの結果で、実際の検索基盤のデータでの検証は抄録からは読み取れない。モデルの仮定（逐次探索、売り手の情報構造）に結論が依存する。未査読のプレプリントである。", "fun": "検索するとAIがいきなり答えを出してくれる時代、便利になるほど人は下の広告を見なくなる。検索会社にとってAIを賢くすることは、広告収入を自分で削ることにもなる。この研究は、会社にとって得な設計と社会にとって良い設計がずれることを数式で示した。便利さの裏にある商売の事情が見えて面白い。", "unverified": "本文が入手できず、モデルの具体的な設定と命題の条件は確認できていない。"}}, {"rank": 12, "field": "因果推論", "headline": "不完全な遵守下での異質な因果効果を木で推定", "title": "Estimating Heterogeneous Causal Effects with Tree-Based Methods under Imperfect Compliance", "url": "https://arxiv.org/abs/2609.31769", "authors": "Karolina Gliszczy\\'nska-Schroeder", "venue": "arXiv", "date": "2026-09-29", "why": "操作変数つきベイズ因果フォレストなどで、遵守者の条件付き効果と部分集団の発見の性能を比べた。", "id": "pn12", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（抄録、模擬実験の設定と結果の§3、計算時間、実データの§4.2）を読んだ。第2節の手法の導出と付録は読んでいない", "preprint": true, "p1": "治療の割り当てに従わない人がいる（不完全な遵守）状況で、操作変数を使って「遵守者」の部分集団ごとの因果効果（CCACE）を推定し部分集団を発見する方法を、ベイズ因果フォレスト（BCF-IV）から任意の機械学習を使える2段階の枠組みに一般化し、非ベイズの森の手法2つ（DRRF-IV、GRF-IV）を実装・比較した（抄録）。", "p2": "異質な処置効果の推定は、遵守が不完全だと操作変数が必要になる（抄録）。既存のBCF-IVは有効だが計算が重く、他の学習器を使えなかった（抄録、§3.2）。", "p3": "第1段階で任意の方法でCCACEを推定し、第2段階で部分集団の木を作って推定する2段階の手法（抄録）。DRRF-IVは変換した結果変数の回帰森で偏りを除く方法、GRF-IVは一般化ランダムフォレストの操作変数版である（抄録）。例えば、治療に割り当てられた人のうち0.75の確率で実際に治療を受ける片側の不遵守で、共変量の組み合わせで効果の符号が変わる部分集団を探す（§3.1）。", "p4": "N=2,000と10,000の標本を500回ずつ模擬し、強い異質性（明確な2つの効果のある部分集団）と弱い異質性（4つの部分集団）で、効果の大きさk=0.5〜4を変えて、部分集団の発見（真の発見率TDR、真陽性率TPR、偽発見率FDR）と推定精度（MSE、偏り、MAE）を比べた（§3）。実データは英国NHSの48病院の患者のICU即時入室と28日死亡で、ICUの空床を操作変数とした（§4）。", "p5": "強い異質性・k=0.5ではBCF-IVの発見力が最も高く（TDR 0.786、TPR 0.594）、森の手法はTPR 0.518・0.499だったが、k=4では全手法がTDR 0.93超・TPR 0.92超に達した（§3.2）。弱い異質性・k=0.5では森の手法のTDRは0.381・0.262と低いが、k=1.5以上で全手法0.98超になった（§3.2）。N=10,000の計算時間はGRF-IV約2.6〜2.8秒、DRRF-IV約14.3〜15.2秒、BCF-IV約23.5〜23.8秒だった（§3.2）。ICUの実データでは全体のCACEは約−0.07で有意でなく、多くの葉が弱い操作変数と判定された（§4.2）。", "p6": "著者は、効果が小さく標本が少ないときは非ベイズの手法の性能が落ちること（§3.2）、実データの部分集団の推定は探索的で、弱い操作変数の葉では極端な値が出ることを注意する（§4.2）。実データは元データを再標本化した疑似データである（§4）。未査読のプレプリントである。", "fun": "「薬を割り当てられても飲まない人」がいると、薬の本当の効き目は見えにくい。そこで、偶然の事情（ICUのベッドが空いていたか）を手がかりに効き目を推し量り、さらに「どんな患者によく効くか」を木の形で探した。効果が小さいと見つけた部分集団の多くが当てにならないことも正直に示している点が面白い。", "unverified": "第2節の手法の理論的性質（付録Bの証明）と、表2の全設定の数値は確認していない。"}}, {"rank": 13, "field": "機械学習", "headline": "2万回の評価で見たEEG基盤モデルの実力", "title": "Benchmarking EEG Foundation Models at Scale: Lessons from 20,000 Evaluations", "url": "https://arxiv.org/abs/2609.32743", "authors": "Zhige Chen ほか", "venue": "arXiv", "date": "2026-09-29", "why": "脳波の基盤モデルを大規模なベンチマークで教師あり手法と比べ、利点と拡張の見込みを検証した。", "id": "pn13", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（本文冒頭の要旨、第3節の5つの研究課題の結果と図4〜7のキャプション）を読んだ。第2節の評価手順の詳細と膨大な付録の表は読んでいない", "preprint": true, "p1": "脳波（EEG）の基盤モデル30種と教師ありの基準手法25種を、23の公開データセットの57課題で2万回以上評価する公開ベンチマークEEG-Arenaを作り、基盤モデルの優位性、事前学習の効果、モデル規模とデータ規模の拡大則、電極構成への頑健性を体系的に明らかにした（本文冒頭の要旨）。", "p2": "EEGの基盤モデルは転用可能な神経表現をうたうが、強い課題別の教師あり手法に本当に勝るのか、さらに規模を大きくする見込みがあるのかは不明だった（本文冒頭の要旨）。", "p3": "5つの評価手順を設けた：①基盤モデルと教師あり手法の比較（双極・非双極の電極構成別の平均順位と上位5回数）、②同じ構造をゼロから学習した場合との比較（学習データ量を2〜100%で変える）、③パラメータ数と性能、④同じ構造で事前学習データを600〜3万時間に増やす制御実験、⑤残す電極の割合を変えた頑健性（§2、§3）。", "p4": "課題は被験者内・被験者間の分類など57課題で、平均順位、事前学習による利得（最終エポックの性能差）、パラメータの変位や表現の変化を指標とした（§3）。", "p5": "非双極の構成では、REVE-baseやST-EEGFormer-smallなど複数の基盤モデルが教師あり手法を一貫して上回った（§3.1）。事前学習の利得は下流の学習データが2%から100%に増えると平均0.4%から8.2%に増え、25%以上では10モデルすべてで正だった（§3.2）。パラメータ数と性能に一貫した正の関係はなく、REVE-baseがREVE-largeを上回る例もあった（§3.3）。事前学習データを600時間から3万時間に増やすと、被験者内で6.69ポイント、被験者間で4.22ポイント性能が上がった（§3.4）。", "p6": "著者は、評価したモデルは構造・データ・学習法が異なるため、規模の効果はパラメータ数だけに帰せず、規模を制御した実験が必要だとする（§3.3）。双極入力専用のモデルを非双極の設定で比べると過小評価になりうる（§3.1）。未査読のプレプリントである。", "fun": "脳波を読むAIにも、文章のAIのような「大量のデータで事前に学習した基盤モデル」が登場している。2万回の評価で比べると、基盤モデルはたいてい専用に作ったAIより強かったが、「モデルを大きくすれば賢くなる」とは限らず、効いたのは学習に使う脳波データを増やすことだった。何を増やせば伸びるかが分野ごとに違うのが面白い。", "unverified": "電極構成の頑健性の具体的な数値（§3.5）と、付録E以降の課題別の結果は確認していない。"}}, {"rank": 14, "field": "経済学", "headline": "クリエイター市場で稼ぐのは技能か運か模倣か", "title": "Skill, Luck, or Imitation? What Actually Pays in Creator Markets", "url": "https://arxiv.org/abs/2609.32925", "authors": "Samiha Tariq", "venue": "arXiv", "date": "2026-09-29", "why": "YouTubeのサムネイル・発話・題名を大量に測り、収入の差を生む要因を分解した。", "id": "pn14", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（本文冒頭の要旨、序論、識別戦略、結果の表4・表7、設計の妥当性の§7.1）を読んだ。理論モデルの詳細と頑健性の個々の結果は読んでいない", "preprint": true, "p1": "YouTubeのVlogの投稿者について、サムネイル・発話・題名などの中身を大量に測り、全投稿の視聴履歴と結びつけて、何が稼ぎを分けるのかを調べ、中身は成功をほとんど予測せず、最初の「ヒット」だけがその後の全作品の視聴を大きく押し上げることを示した（本文冒頭の要旨）。", "p2": "創作市場の極端な格差は、わずかな才能差が拡大されるのか（Rosen）、同程度の才能でも偶然と人気の自己強化で決まるのか（Adler）の二つの説明が競ってきた（§1）。しかし質は観測できず、成功で質を測れば答えを前提にしてしまう（§1）。また公開データは見つけられた生存者のチャンネルに偏っていた（§1）。", "p3": "3,728枚のサムネイル（顔・文字・色・構図）、384.7時間の発話（2,940,197語）、題名とタグから36の中身の指標を作り、420チャンネル・56,419本の視聴履歴と結びつけた（§1）。チャンネルを開設日で抽出し、伸びなかった多数も含めた（§1、§4.2）。ヒットは「チャンネルの中央値の5倍以上の視聴」とし、最初のヒットの前後をチャンネル固定効果つきの中断時系列で比べ、偽のヒットを置く対照も用いた（§4.7、表4）。", "p4": "中身の指標の予測力（チャンネル内の視聴の差の説明）、練習量（ヒットのない投稿数）の効果、最初のヒットの効果、ヒットの見た目・話題をまねることの見返りを検証した（§5）。ヒットの効果は17の代替の定式化で頑健性を確かめた（§6）。", "p5": "視聴の対数のばらつきの80.2%はチャンネル間で、チャンネル内は19.8%だった（§5）。36の中身の指標はチャンネル内の視聴の差の最大1.1%しか説明せず、ヒットのない投稿を40本増やしても効果はなかった（本文冒頭の要旨）。最初のヒットは以後の投稿の視聴を対数で+0.4219（t=7.63）、平均164%押し上げ、偽のヒットの対照は+0.0339で有意でなかった（表4、要旨）。ヒット後、話題の類似は1標準偏差あたり+0.0635（p<0.05）の見返りがあったが、見た目の類似は+0.0386で有意でなかった（表7）。", "p6": "ヒットは無作為に起きないため、直前の緩やかな上昇（1本あたり0.0166）を延長しても即時の跳ね上がりは+65%残ると著者は点検している（§7.1）。解釈：対象はVlogの一分野で、収入は視聴から推計した広告収入であり、他のジャンルや収入源への一般化は未確認である。開設日の中央値のチャンネルの4か月の広告収入は1.61ドルだった（§1）。未査読のプレプリントである。", "fun": "YouTubeで成功するコツとして「サムネイルに顔を大きく」「最初の10秒で引き込む」などが語られるが、実際に測るとそうした工夫は視聴数の差をほとんど説明しなかった。効いたのは一度バズったかどうかで、その後は何を出しても見られやすくなった。しかも真似して得するのは見た目ではなく話題だけ。実力と運の境目を数字で測った点が面白い。", "unverified": "表3の予測力の数値と、17の頑健性の定式化の個々の結果、参入の収益（§5.5）は確認していない。"}}, {"rank": 15, "field": "ヒューマンコンピュータインタラクション", "headline": "個人の回答を予測する記憶と使い方を分ける", "title": "Separating Memory and Workflow Effects in Predicting Individual Answers", "url": "https://arxiv.org/abs/2609.33321", "authors": "Tianzhu Qin ほか", "venue": "arXiv", "date": "2026-09-29", "why": "188人・1,768課題で、個人についての記憶の内容と使い方の効果を分けて評価した。", "id": "pn15", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（本文冒頭の要旨、序論、評価の§3、§4〜6の結果）を読んだ。§7〜8の詳細と付録は要旨と序論の要約の範囲で確認した", "preprint": true, "p1": "個人に合わせて答えるLLMエージェントについて、「何を覚えておくか（記憶の作り方）」と「覚えたものをどう使うか（回答の手順）」の効果を分けて測り、具体的な事実の記憶が性格の記述より有効で、複数回答の統合はむしろ悪化させ、本人の言葉をそのまま検索して使う単純な方法（OwnWords）が書き直した記憶を上回ることを示した（本文冒頭の要旨）。", "p2": "個人の回答を予測するエージェントは、購入や経験の具体、性格の要約、ビッグファイブのような枠組みなど、記憶の作り方を選び、さらに複数回の生成と統合を行うことが多い（§1）。検証可能な課題では繰り返しと統合が効くが、特定の個人が何と言ったかの予測でも効くかは測られておらず、記憶と手順の効果が混ざって評価されていた（§1）。", "p3": "AIが司会する利用者調査のインタビューの前半から、後半の質問への本人の答えを予測する（§3.1、式1）。同じ前半から、事実を残す「具体的な記憶」と、物・場所・出来事・数字を除いた「特性の記憶」（各約100語）を作り、1回の生成、3回生成して統合、同じ候補から選ぶ手順と掛け合わせた（§5〜7）。OwnWordsは本人の文をBM25で質問と照合し、文字数の予算内で原文のまま残して1回で答える（図1）。採点はLLMの審査員が4段階の内容一致で行う（§3.2）。", "p4": "188人・194セッション・1,768課題の非公開ベンチマークで、人ごとにまとめて再標本化するブートストラップで区間を出した（§3）。OwnWordsはベンチマーク外の500人、300人（4つの予算）、114人で確かめ、公開の調査ベンチマークTwin-2K-500でも比べた（要旨）。審査員は時期によりGrok 4.5とGemini 3.1 Proで、両者の一致は重みつきκ=0.83だった（§3.2）。", "p5": "前半の履歴を与えると4つのモデルで得点が+0.062〜+0.087上がった（§4）。具体的な記憶は特性の記憶を+0.0158（95%区間0.0044〜0.0271）上回った（§5）。3回生成の統合は具体的な記憶の得点を−0.0123下げ、選択は無作為な候補を上回らなかった（要旨）。OwnWordsは外部の500人で書き直した記憶を+0.0127、300人の4予算で平均+0.0218上回ったが、直近の発話を切り取るだけの方法との差は検出されなかった（要旨）。", "p6": "著者は、採点が人手の評定のないLLMの基準によること、元のベンチマークの参加者を開発中に見ていたこと、差が言い回しそのものによるのか保持した内容によるのかは切り分けられないこと、調査の多肢選択では正答率が改善しなかったことを限界に挙げる（要旨、§9）。未査読のプレプリントである。", "fun": "AIにある人の代わりに答えさせるとき、その人を「几帳面で慎重な人」とまとめて覚えるより、「先月こういう買い物をした」という具体的な話を覚えさせた方が当たった。さらに、AIにまとめさせた要約より、本人が話した言葉をそのまま引っ張ってくる方が良かった。人を理解するには、ラベルより本人の言葉が大事というのは人間にも当てはまりそうで面白い。", "unverified": "共通実験（§7）の全条件の得点表と、Twin-2K-500での数値（付録H）は確認していない。"}}, {"rank": 16, "field": "経済学", "headline": "AIが職歴のシグナルを売り買いできたら", "title": "AI and the Market for Signals", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.17752", "authors": "Doruk Cetemen ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "AIのトークンで成果を作れる世界での、若手の能力シグナルと技能形成を理論分析した。", "id": "pn16", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "若手の仕事が能力のシグナルと長期の技能形成の両方を担うキャリアのシグナリング・モデルに、自分の成果と見分けのつかない成果を作れる「トークン」を売るAI産業を導入し、取引の制度ごとの均衡と厚生を分析した（抄録）。", "p3": "トークン取引なし、購入のみ、転売を含む自由取引の3つの制度を比べた（抄録）。", "p5": "取引なしではシグナルのための過剰な労働（ラットレース）が生じ、購入のみでは低い能力の人が成果を買い、高い能力の人はより多く働く必要が生じた（抄録）。転売があり安価なAIが豊富なら、シグナルは努力に依存しなくなり、すべてのタイプが技能に過少投資した（抄録）。教育のように成果に価値がない場では、分離均衡で全員が損をした（抄録）。", "fun": "若いうちの頑張りは「自分は優秀だ」と示すシグナルであり、同時に力をつける練習でもある。AIが本人と見分けのつかない成果を売るようになると、努力はシグナルにならなくなり、皆が練習をやめてしまうかもしれない。レポートをAIに書かせる問題を経済学で考えた点が面白い。", "unverified": "抄録が途中までしか読めず、成果に価値がある場合の結論の全体は確認できていない。"}}, {"rank": 17, "field": "経済学", "headline": "学校選択のくじ番号は公開すべきか", "title": "The Double-Edged Sword of Information: Revealed versus Hidden Lotteries in School Choice", "url": "https://arxiv.org/abs/2609.34074", "authors": "Parinaz Naghizadeh ほか", "venue": "arXiv", "date": "2026-09-29", "why": "くじ番号の公開・非公開がマッチングの結果と情報の価値に与える影響を分析した。", "id": "pn17", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "学校選択で同順位を分けるくじ番号を生徒に公開すると、マッチングの結果が良くなる場合も悪くなる場合もあることを、生徒の選好が異なる場合のゲーム理論のモデルで示した（抄録）。", "p3": "全員が同じ学校の順位を持つという単純化をやめ、選好の異なる生徒の戦略がベイズ・ナッシュ均衡をなすモデルで、受入保留（DA）方式のもとでの公開・非公開を、マッチ率と社会厚生の2つの指標で比べた（抄録）。くじの部分的な公開も分析した（抄録）。", "p5": "くじ番号の公開がマッチの結果を改善する場面と悪化させる場面を特徴づけ、学生が得る情報量に対して効果が単調でないことを示した（抄録）。先行理論の「公開は常にマッチ数を増やす」という結果は、同一選好の仮定に依存していた（抄録）。", "fun": "人気の学校に希望者が集まると、くじで順番を決める。ニューヨーク市は透明性のためにくじの番号を生徒に教えるようにしたが、自分の番号が分かると志望の書き方が変わる。この研究は、それが全体にとって良いとは限らず、情報を少し増やすと逆に悪くなることもあると示した。情報の「もろ刃の剣」が面白い。", "unverified": "改善・悪化の条件の具体的な形と、数値例の大きさは確認していない。"}}, {"rank": 18, "field": "経済学", "headline": "不等式制約への射影推定の最適な幾何", "title": "Minimax Choice of Projection Geometry under Linear Inequality Constraints", "url": "https://arxiv.org/abs/2609.32725", "authors": "Joachim Freyberger ほか", "venue": "arXiv", "date": "2026-09-29", "why": "経済理論の不等式制約を課す射影推定で、ミニマックスの観点から射影の幾何の選び方を示した。", "id": "pn18", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "経済理論が示す線形の不等式制約を推定に課すために、制約のない推定量を実行可能集合に射影するとき、射影の幾何（距離の測り方）の選び方が危険（誤差）を大きく左右することを示し、最悪の境界での危険を最小化する選び方を提案した（抄録）。", "p3": "次元固定の局所的なガウス実験と二乗損失で、共分散の逆行列による射影の性質を調べ、局所的に害をなさない条件のもとで最悪の境界の危険を最小にする幾何を選ぶ実行可能な方法を作った（抄録）。", "p5": "1つの不等式だけが効く境界では逆共分散の射影が点ごとに最適で、2つまでならミニマックスになるが、3つが効きうると反例がありミニマックスでない（抄録）。模擬実験とガソリン需要の応用で有限標本の性能を調べた（抄録）。", "fun": "「価格が上がれば需要は減る」のように、経済学には答えの向きを決める制約が多い。推定値がその制約を破ったとき、一番近い許される値に動かすのが普通だが、「近さ」の測り方で結果の良し悪しが変わる。制約が3つ以上になると定番のやり方が最善でなくなる、という反例が面白い。", "unverified": "ガソリン需要の応用の具体的な推定結果は確認していない。"}}, {"rank": 19, "field": "経済学", "headline": "1万8千のオッズ市場の較正と胴元の取り分", "title": "Well Calibrated, Unevenly Priced: Market Calibration and the Location of the Bookmaker's Margin in 18,238 Modern Fixed-Odds Markets", "url": "https://doi.org/10.2139/ssrn.7530258", "authors": "Edward Glush", "venue": "SSRN", "date": "2026-09-29", "why": "現代のオンライン固定オッズ市場で、較正の良さと胴元の利ざやの位置を検証した。", "id": "pn19", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "現代のオンライン固定オッズ市場18,238件（2024年から2026年（November 2024〜July 2026）、5競技）で、胴元の取り分を除いた確率の較正と、取り分の偏った配分を調べた（抄録）。", "p3": "2つの結果のみの市場の両側（36,476の結果の観測）について、胴元の利ざやを除いたオッズの暗黙の確率と実際の結果の頻度を十分位ごとに比べた（抄録）。", "p5": "利ざやを除いた確率は非常によく較正され、どの十分位でも実際の頻度は約2ポイント以内だった（抄録）。残るずれは系統的で、50%未満の結果は1〜2ポイント上回り本命は同程度下回り、選手個人の成績に賭ける市場ではずれが約±5ポイントに倍増した（抄録）。", "fun": "スポーツの賭けでは「大穴に賭けすぎる」偏りが昔から知られている。18,238件の賭けを調べると、オッズは驚くほど正確だったが、胴元のもうけの乗せ方が本命と大穴で違っていた。市場の予測の正しさと、値段のつけ方の偏りを分けて見た点が面白い。", "unverified": "抄録が途中までしか読めず、胴元の利ざやの配分に関する結論の全体は確認できていない。"}}, {"rank": 20, "field": "経済学", "headline": "家庭用蓄電池の同期ピークは過大評価", "title": "The missing price feedback: Why studies overstate local peaks from synchronized home batteries under dynamic pricing", "url": "https://arxiv.org/abs/2609.35111", "authors": "Lion Hirth", "venue": "arXiv", "date": "2026-09-29", "why": "価格のフィードバックを入れないと、動的料金下の蓄電池による地域の負荷ピークが過大に見積もられることを示した。", "id": "pn20", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "家庭用の蓄電池が動的な電気料金に一斉に反応すると地域の配電網に新しいピークができるとする先行研究は、卸電力価格を外生とみなして過大評価しており、価格の反応を入れるとピークはほぼ半分に減ることを示した（抄録）。", "p3": "2025年のドイツのデータで較正し、卸電力価格の均衡モデルを組み込んで、屋根の太陽光と蓄電池を持つ世帯がスポット連動の料金で動く模擬を行い、価格を外生とした場合と比べた（抄録）。", "p5": "価格を外生とすると、同時充電で地域の同時の受電ピークは蓄電池なしの83%増になったが、価格を内生にすると同じ台数でピークは蓄電池なしより6%低かった（抄録）。18の先行研究のうち1つを除き価格を外生として扱っていた（抄録）。結果は25のシナリオと3年の過去の年で頑健だった（抄録）。", "fun": "電気代が安い時間に家中の蓄電池がいっせいに充電すると、町の電線がパンクしそうに思える。でも実際には、皆が充電すると電気の値段が上がって充電の得が減るので、自然にばらける。この「値段の跳ね返り」を入れるだけで、心配されていたピークがほとんど消えた点が面白い。", "unverified": "配電網の構成と世帯数などの模擬の詳細な設定は確認していない。"}}, {"rank": 21, "field": "経済学", "headline": "事前分布なしで委任ルールを設計する", "title": "Delegation without Priors", "url": "https://arxiv.org/abs/2609.35156", "authors": "Wei He ほか", "venue": "arXiv", "date": "2026-09-29", "why": "偏りのある代理人への委任を、最悪の後悔を最小化する基準で設計した。", "id": "pn21", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "偏りのある代理人の情報に頼る依頼人が、起こりうる状況の事前分布を持たないまま最悪の後悔を最小化するよう委任のルールを設計すると、既定の行動、その上の固定の隙間、境界が確率的に決まる上の裁量区間を組み合わせた形が最適になることを示した（抄録）。", "p3": "事前分布なしで最悪の後悔を最小化する基準のもと、確率的なものを含むすべての誘因両立的なメカニズムの中で最適な委任ルールを導いた（抄録）。", "p5": "最適ルールは、既定から離れるかどうかと、離れたときの裁量の大きさの2つの余白を分ける（抄録）。既定と隙間は小さな調整で済むときの過剰な調整を抑え、上の区間は大きな調整が要るときの柔軟性を保ち、区間の上下限の無作為化は最悪の状態への備えになる（抄録）。", "fun": "部下に判断を任せたいが、部下はいつも少し大げさに動きたがる。先のことが全く読めないとき、どう任せるのが一番安全か。答えは「基本はいつもどおり、動くなら一定以上大きく、その範囲の端はくじで決める」という意外な形だった。わざとくじを入れるのが面白い。", "unverified": "最適ルールのパラメータの具体的な式は確認していない。"}}, {"rank": 22, "field": "経済学", "headline": "情報の遅れという不完全情報の経済学", "title": "Information Latency: Theory and Economic Consequences", "url": "https://arxiv.org/abs/2609.31951", "authors": "Gaurav Subedi (RALP Technologies) ほか", "venue": "arXiv", "date": "2026-09-29", "why": "意思決定と最新観測の間の経過時間を新しい不完全情報の源として理論化した。", "id": "pn22", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "意思決定と、状態の最新の観測との間の経過時間（情報の遅れ）を、不完全情報の独立した源として理論化し、その経済的な帰結を分析した（抄録）。", "p3": "連続時間のマルコフ過程で、遅れと条件付き分散の関係を調べ、オルンシュタイン=ウーレンベック過程を基準に、CARA-正規の枠組みでリスク・プレミアムと仲介者の競争を分析した（抄録）。", "p5": "遅れは観測が正確で期待が合理的でも減らせない不確かさを生み、OU過程では遅れとともに逓減しながら有限の上限へ増える（抄録）。まれな状態の観測の後は、不確かさが中間の遅れで最大になりうる（抄録）。平均の遅れや更新頻度だけでは情報の質は決まらず、情報の到着の規則性が独立に重要である（抄録）。", "fun": "天気予報も株価も、見ている情報は少し前のものだ。この研究は、情報の「古さ」そのものが、どれだけ正確に測っても消えない不確かさを生むことを数学で示した。しかも平均が同じでも、情報が規則正しく届くかどうかで質が変わる。遅れを一つの経済的な要因として扱った点が面白い。", "unverified": "抄録が途中までしか読めず、仲介者の競争の結論の全体は確認できていない。"}}, {"rank": 23, "field": "経済学", "headline": "肩書のデフレとIT人材不足の測定", "title": "The Ancient Art of the Job Title: Title Deflation, Hidden Engineers, and the Measurement of the IT Talent Shortage", "url": "https://doi.org/10.2139/ssrn.7534480", "authors": "Jason Chapman", "venue": "SSRN", "date": "2026-09-29", "why": "職務内容と肩書のずれが、IT人材不足の測定を歪めることを示した。", "id": "pn23", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "IT分野で、技術者級の仕事を入門級の「サポート」の肩書のまま担う「肩書のデフレ」が、賃金・自動採用の選別・労働市場の統計を歪め、IT人材不足の測定を誤らせると論じた（抄録）。", "p3": "職務を課題の束とみる労働経済学と、肩書で取引される労働市場のずれに注目し、肩書のインフレ（管理職の肩書で残業代を避けるなど）の逆の現象として肩書のデフレを定式化した（抄録）。", "p5": "2025年5月の米国の年収の中央値は、コンピュータ利用者サポート専門職で61,860ドル、ネットワーク・システム管理者で99,130ドルと大きく異なり、肩書のずれの賃金上の意味は大きいと述べる（抄録）。", "fun": "同じようにサーバーやクラウドの仕事をしていても、肩書が「サポート係」なら給料は低く、求人検索のAIにも技術者として見つけてもらえない。肩書が実際の仕事より低いことで、人材不足の統計まで狂ってしまう、という指摘が面白い。", "unverified": "抄録が途中までしか読めず、実証の方法とデータは確認できていない。"}}, {"rank": 24, "field": "経営学", "headline": "企業ごとの証拠記憶で四半期売上を予測", "title": "CAME: Company-Aware Evidence-Memory Experts for Interpretable Quarter-Ahead Revenue Forecasting", "url": "https://arxiv.org/abs/2609.33143", "authors": "Ya-Wen Wu ほか", "venue": "arXiv", "date": "2026-09-29", "why": "開示文書の情報と過去の数値を企業ごとに組み合わせ、解釈可能な売上予測を行った。", "id": "pn24", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "統計的な基準予測を、開示文書などの現在の意味的な証拠と過去の誤差のパターンが正当化するときだけ補正する残差予測の枠組みCAMEで、四半期先の売上を解釈可能に予測した（抄録）。", "p3": "情報漏れのない統計的な基準に対し、製品の移行、供給制約、経営陣の見通しなどの証拠と、過去の誤差の記憶に基づいて調整し、調整を出典つきの証拠カードと記憶の痕跡に結びつけた（抄録）。", "p5": "大手テクノロジー・プラットフォーム企業12社の336の企業・四半期のローリング・バックテストで、報告された手法の中で集計の誤差が最も小さく、対応する統計的基準に対してマクロsMAPEの統計的に支持された改善を示し、「履歴＋ガイダンス」を6つの集計指標すべてで上回った（抄録）。", "fun": "会社の来期の売上を予想するとき、過去の数字の延長だけでは新製品や部品不足の影響を見落とし、AIに決算書の文章を読ませると桁違いの数字を出すことがある。そこで、基本は過去の数字で予想し、文章に強い根拠があるときだけAIが修正する。役割分担の工夫が面白い。", "unverified": "企業名と、誤差の改善幅の具体的な数値は確認していない。"}}, {"rank": 25, "field": "経営学", "headline": "CEOアリーナ：市場で競うAIエージェントの評価", "title": "CEO Arena: Evaluating Long-Horizon Multi-Agent Decision-Making in Competitive Markets", "url": "https://arxiv.org/abs/2609.34821", "authors": "An Yan ほか", "venue": "arXiv", "date": "2026-09-29", "why": "長期の競争市場での意思決定をAIエージェントで評価するベンチマークを作った。", "id": "pn25", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "長期の競争市場でLLMのCEOエージェントが事業判断を行う能力を、ライバルと市場への影響も含めて評価するベンチマークCEO Arenaを作った（抄録）。", "p3": "8社が共有する市場で500日の模擬を行い、各CEOは価格・調達・マーケティング・研究開発・サービスを、私的な情報と雑音のある市場の信号、資源制約と遅れたフィードバックのもとで決める（抄録）。同じ会社・同じ乱数で参照方策と入れ替えて比べる「対応づけ置換評価」を使った（抄録）。", "p5": "8つのLLMのCEOを主要27回・頑健性26回で評価すると、ほとんどのエージェントの平均リターンは負で、自社の利益が市場全体の損失と同時に起こることもあった（抄録）。", "fun": "AIに会社の社長をさせて、ライバル会社と500日間競わせる実験をした。すると多くのAI社長は損を出し、自分がもうけても市場全体を悪くすることもあった。一回の問題を解くのと、長い競争を勝ち抜くのとは別の能力だと分かる。", "unverified": "抄録が途中までしか読めず、エージェント間の相互作用の結果の詳細は確認できていない。"}}, {"rank": 26, "field": "経営学", "headline": "1996年の「インターネットと企業戦略」再訪", "title": "Internet and Enterprise Strategy Revisited: From Digital Connectivity to AI-Enabled Enterprises, 1996 - 2026", "url": "https://arxiv.org/abs/2609.33850", "authors": "Carlos J. Costa", "venue": "arXiv", "date": "2026-09-29", "why": "30年前の命題がAI時代までにどう確かめられ、変わったかを検討した。", "id": "pn26", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "1996年の論文「インターネットと企業戦略」の命題が、2026年のAIを使う企業環境までにどう確かめられ、変わり、否定されたかを再検討した（抄録）。", "p3": "歴史的な解釈と、インターネットによる能力、産業構造、価値連鎖の変化、プラットフォームの仲介、サイバーセキュリティ、データ・ガバナンス、AI、デジタル主権の構造的な比較を組み合わせた（抄録）。", "p5": "元の論文は電子市場、サイバー仲介者、取引の安全、オンライン共同体、社内のインターネット利用規則の戦略的な重要性を正しく予見したが、現在のインターネットはプラットフォーム化・データ集約・クラウド依存・規制・地政学的な競合・AI仲介の環境へと元の枠組みを超えた（抄録）。AI企業システムへの移行はインターネット戦略を置き換えるのでなく拡張すると論じた（抄録）。", "fun": "30年前に書かれた「インターネットと会社の戦略」の論文を、同じ視点で今に照らして答え合わせした。ネット上の市場や安全の大切さは当たっていたが、巨大なプラットフォームやAI、国どうしのデータの取り合いまでは想像を超えていた。未来予測の答え合わせとして面白い。", "unverified": "比較の具体的な表の内容は確認していない。"}}, {"rank": 27, "field": "統計学", "headline": "干渉のある実験でのリランダマイゼーション", "title": "Rerandomization under Interference", "url": "https://arxiv.org/abs/2609.33730", "authors": "Ziang Yuan ほか", "venue": "arXiv", "date": "2026-09-29", "why": "ユニット間の干渉がある実験で、共変量によるリランダマイゼーションの性質を示した。", "id": "pn27", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "ユニット間の干渉（他者の処置が自分の結果に影響する）がある無作為化実験で、共変量の偏りが小さい割り付けだけに制限する「リランダマイゼーション」が、干渉の構造をほとんど特定せずに推定の精度を改善することを示した（抄録）。", "p3": "Hájek推定量による期待平均処置効果の推定について、処置された隣人の割合のように割り付けに依存する共変量も許すリランダマイゼーションを分析し、控えめな依存グラフがある場合の最適化に基づく保守的な分散推定量を作った（抄録）。", "p5": "干渉があっても、単位間の依存構造への穏やかな条件だけで、リランダマイゼーションは制限のないベルヌーイ無作為化より漸近的に精度を改善しうることを示した（抄録）。", "fun": "ワクチンの試験のように、周りの人が処置を受けると自分にも効果が及ぶ実験では、普通の統計の工夫がかえって推定を悪くすることがある。この研究は、「偏りの大きいくじ引きの結果は引き直す」という単純な方法なら、影響の広がり方を細かく知らなくても精度が上がることを示した。", "unverified": "模擬実験や応用例の結果は確認していない。"}}, {"rank": 28, "field": "統計学", "headline": "時系列の共形予測の被覆率を検定する", "title": "Conformal Coverage of Time Series: Validity and Inference", "url": "https://arxiv.org/abs/2609.33868", "authors": "Percy S. Zhai ほか", "venue": "arXiv", "date": "2026-09-29", "why": "共形予測の実際の被覆率が異常かどうかを時系列で推論する方法を示した。", "id": "pn28", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "時間依存のあるデータで分割共形予測の実際の被覆率が異常かどうかを検定できるよう、混合条件を仮定しない非漸近的な誤差の上界と、実現した被覆率の初の中心極限定理を与えた（抄録）。", "p3": "隣接する較正集合と検証集合をとる分割共形予測で、関数的依存の尺度を使って評価し、Bahadur表現から中心極限定理を導き、ブロックに基づく標準誤差の推定量で検定を作った（抄録）。長期記憶の時系列も扱った（抄録）。", "p5": "ガウス線形過程では、非常に強い時間依存があると実現した被覆率の極限分布が正規分布でなくなることを示した（抄録）。", "fun": "「高い確率で当たる」はずの予測区間を時系列に使って、実際には外れが多かったとき、それが偶然か異常かを判断するのは難しい。この研究は、データに時間のつながりがあっても使える判定の方法を作った。つながりがとても強いと、ばらつき方の形そのものが変わるという結果も面白い。", "unverified": "抄録が途中までしか読めず、長期記憶の場合の結論の全体は確認できていない。"}}, {"rank": 29, "field": "統計学", "headline": "共変量シフト下の共形予測の条件付き被覆", "title": "Sharp training-conditional coverage for conformal prediction under covariate shift", "url": "https://arxiv.org/abs/2609.33456", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "2026-09-29", "why": "重み付き分割共形予測の、較正データに条件付けた被覆率の鋭い評価を与えた。", "id": "pn29", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "共変量シフト下の重み付き分割共形予測について、較正データに条件付けた被覆率の、定数を含まない明示的で鋭い上界を与えた（抄録）。", "p3": "固定した母集団分位点での一つの集中不等式による初等的な議論で、関係する尺度が尤度比の上限ではなく、シフトのカイ二乗ダイバージェンスなどから作る分散の代理量であることを示し、2点の下界で率の本質性を示した（抄録）。", "p5": "明示的に水準を上げた重み付き分位点は決定論的なPAC予測集合になり、無作為な棄却標本化や重要度重み付きの方法と比べたと述べる（抄録）。", "fun": "訓練データとテストデータで条件がずれていても「この範囲に高い確率で入る」と言うには、ずれの大きさを補正する必要がある。この研究は、その補正がどれくらい効くかを、較正に使ったデータが一組だけのときにも保証する式を、ごく単純な不等式から導いた。", "unverified": "抄録が途中までしか読めず、比較実験の結果は確認できていない。"}}, {"rank": 30, "field": "統計学", "headline": "合成データで補う順位付けの最尤推定", "title": "Maximum Likelihood Estimation for Entity Ranking under Iterative Synthetic Data Augmentation", "url": "https://arxiv.org/abs/2609.32987", "authors": "Yiqiao Jin ほか", "venue": "arXiv", "date": "2026-09-29", "why": "疎な比較グラフに合成の比較データを加えたときのBradley-Terry-Luceモデルの推定と推論を扱った。", "id": "pn30", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "疎な比較グラフのBradley-Terry-Luce（BTL）モデルで、あてはめたモデルから生成した合成の比較を繰り返し追加する学習の流れについて、最尤推定量の有限標本の誤差率と漸近正規性を導き、実データの割合が消えていってもモデル崩壊を避けられる条件を示した（抄録）。", "p3": "反復的な合成データ拡張で得られる最尤推定量について、高次元の有限標本でℓ2とℓ∞の最適な統計的な率を導き、自然な識別条件のもとで漸近正規性を示した（抄録）。", "p5": "実データの割合が減ってもモデル崩壊が起きない領域を特徴づけ、大規模な数値実験とArena Human Preference 140kデータへの応用で理論を確かめた（抄録）。", "fun": "AIの出した答えでAIを学習させ続けると、だんだんおかしくなる「モデル崩壊」が心配されている。この研究は、対戦の勝ち負けから順位をつける問題で、AIが作った対戦結果を足し続けても、どんな条件なら順位の推定が壊れないかを数学で示した。合成データの使いどころが分かって面白い。", "unverified": "崩壊を避ける条件の具体的な式と、Arenaデータでの結果は確認していない。"}}, {"rank": 31, "field": "統計学", "headline": "1枚の観測から雑音の大きさを推定する理論", "title": "A statistical theory for blind denoising: minimax estimation of the noise level from a single sample", "url": "https://arxiv.org/abs/2609.33008", "authors": "Zhuoer Shen", "venue": "arXiv", "date": "2026-09-29", "why": "拡散モデルのブラインド除雑音を動機に、雑音水準の推定のミニマックス誤差を特徴づけた。", "id": "pn31", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "拡散モデルのブラインド除雑音を動機に、信号の分布Pが既知のもとで、1つの高次元の観測から未知のガウス雑音の大きさを推定する問題のミニマックス平均二乗誤差を特徴づけた（抄録）。", "p3": "信号の分布について、被覆の複雑さkを持つ場合と、α-強対数凹の場合の2つの構造仮定のもとで率を導いた（抄録）。", "p5": "被覆の複雑さkの信号では、制約つき最尤推定が対数の因子の範囲でミニマックスの率を達成し、強対数凹の信号では、Pを中心としたノルムの推定量が定数倍の範囲で達成した（抄録）。信号の分布の構造が、推定の難しさと適切な推定量の両方を決める（抄録）。", "fun": "写真のざらつき（ノイズ）の強さを、たった1枚の写真から当てられるか。元の絵がどんな種類の絵かを知っていれば可能で、その種類の性質によって、どれだけ正確に当てられるかと、どの方法を使うべきかが決まることを数学で示した。画像生成AIの基礎理論として面白い。", "unverified": "率の式に現れる記号の定義の詳細は確認していない。"}}, {"rank": 32, "field": "統計学", "headline": "ポアソン回帰の最尤推定量の存在の相転移", "title": "Finite sample behavior of the maximum likelihood estimator in the Poisson model under Gaussian design", "url": "https://arxiv.org/abs/2609.34757", "authors": "Matthieu Lerasle ほか", "venue": "arXiv", "date": "2026-09-29", "why": "ガウス計画のもとでポアソン回帰の最尤推定量が存在する確率の鋭い相転移を示した。", "id": "pn32", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "正しく特定されたポアソン回帰で、係数の最尤推定量が存在する確率が標本数n>次元dで鋭い相転移を示し、最適な誤差率d/nを達成するにはβのノルムに指数的な標本数が必要な中間の領域があることを示した（抄録）。", "p3": "経験過程の理論と無作為錐の幾何を使い、存在の確率の相転移と、高い確率で過剰危険がd/nの漸近オーダーになる標本数の下限を導いた（抄録）。副産物としてsub-Gammaの確率ベクトル・行列のPAC-Bayes不等式を一般化した（抄録）。", "p5": "nがdより大きいが指数的な閾値より小さい中間の領域では、最尤推定量は存在するが最適率d/nを達成しない（抄録）。n>d^(1+ε)ならMLEとβの距離の上界を与え、2つの領域の隙間をd^(1+ε)の項の範囲で埋めた（抄録）。", "fun": "数を数えるデータ（事故件数など）でよく使うポアソン回帰は、データが変数の数より少しだけ多いと、答えは出ても精度が悪い「中途半端な時期」がある。データの数が指数的に多くないと本来の精度に届かない、という意外な結果を数学で示した。", "unverified": "指数的な閾値の具体的な形は確認していない。"}}, {"rank": 33, "field": "統計学", "headline": "断面データだけから半マルチンゲールのドリフトを識別", "title": "Identifying the Predictable Drift of a Semimartingale from Marginal Laws", "url": "https://arxiv.org/abs/2609.33372", "authors": "Jakub Marecek ほか", "venue": "arXiv", "date": "2026-09-29", "why": "繰り返し断面しか観測できないときに、確率過程の予測可能なドリフトを識別する方法を示した。", "id": "pn33", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "確率過程を繰り返しの横断面（同じ個体を追跡しない集計）でしか観測できないとき、半マルチンゲールの予測可能なドリフト部分を識別する方法を示した（抄録）。", "p3": "推定対象を、観測可能な特徴のフィルトレーションへの予測可能な補償子の射影と定め、ドリフトが観測されたラグの窓の線形関数なら凸二次計画（計量経済学の疑似パネル回帰）に帰着させる（抄録）。ドリフトが隠れた線形力学系の出力で、その力学も周辺分布から識別する場合は双線形の二次問題になる（抄録）。", "p5": "拡散係数を固定すると、周辺分布の流れはドリフトをマルコフ射影の範囲でしか識別しないことを示した（抄録）。数値の結果は抄録の読めた範囲にない。", "fun": "同じ人を追いかけず、毎年違う人を調べる調査だけから、「全体がどの方向に動いているか」の法則を取り出せるか、という問題を扱った。追跡データがない社会調査でもよく出会う問題で、何が分かり何が分からないかの境界を数学で示した点が面白い。", "unverified": "抄録が途中までしか読めず、隠れた力学系の場合の識別の結論は確認できていない。"}}, {"rank": 34, "field": "統計学", "headline": "転移で較正する予測強化推論", "title": "Transfer Calibrated Prediction Powered Inference", "url": "https://arxiv.org/abs/2609.34156", "authors": "Aditya T. Vadlamani ほか", "venue": "arXiv", "date": "2026-09-29", "why": "事前学習済みの予測器が合わない場合でも、予測強化推論の効率を保つ転移較正を提案した。", "id": "pn34", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "別の領域で事前学習した予測器を、少数の正解ラベルで目的の領域に適応させてから使う予測強化推論（TC-PPI）を提案した（抄録）。", "p3": "交差適合で予測器を目的の領域に較正し、疎な線形較正、LoRA、微調整など様々な適応法に対応させ、共同調整した推定量で不偏性を保つ（抄録）。", "p5": "提案する推定量は、古典的な推論、PPI、PPI++の少なくともいずれにも劣らない効率を同時に持ち、負の転移を防ぐ（抄録）。高次元でのMSEの上界を示し、実データで基準手法より改善したと述べる（抄録）。", "fun": "AIの予測を使って少ない正解データから確かな結論を出す方法は、AIが別の分野で学んだものだとうまく働かない。そこで、少ない正解データでまずAIを目的の分野に「なじませて」から使う。少なくとも元の方法より悪くならない保証つき、という安全設計が面白い。", "unverified": "本文が入手できず、実データの応用例と改善幅は確認できていない。"}}, {"rank": 35, "field": "機械学習", "headline": "複数の教師からの方策上蒸留を領域で正規化", "title": "Beyond Teacher Assignment: Domain-Normalized Multi-Teacher On-Policy Distillation", "url": "https://arxiv.org/abs/2609.35347", "authors": "Xin Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "専門家モデルを一つにまとめる多教師の方策上蒸留を、領域ごとの正規化で改善した。", "id": "pn35", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "数学・コード・指示従いなどの専門家モデルを一つの生徒モデルにまとめる多教師の方策上蒸留（MOPD）で、領域ごとのフィードバックの強さの偏りを正規化して改善する手法DN-MOPDを提案した（抄録）。", "p3": "生徒が各プロンプトに答え、その領域の専門家が各トークンにフィードバックする仕組みはそのままに、各領域のフィードバックを測定したばらつきで再尺度化する（抄録）。", "p5": "3つの大きさのQwen3.5で、従来のMOPDの生徒は最良の単一専門家に教わった生徒を上回らず、数学の専門家の利点をほとんど得られなかった（抄録）。指示従いのフィードバックのばらつきは数学の数倍で、生徒の更新を支配していた（抄録）。", "fun": "数学が得意なAI、プログラムが得意なAIなど何人もの先生から一人の生徒AIに教えると、声の大きい先生（ばらつきの大きいフィードバック）の言うことばかり聞いてしまう。声の大きさをそろえるだけで改善するという、教室の運営のような発見が面白い。", "unverified": "抄録が途中までしか読めず、DN-MOPDの改善幅の数値は確認できていない。"}}, {"rank": 36, "field": "機械学習", "headline": "視覚エンコーダなしのマルチモーダル学習の規模則", "title": "How Far Are We from Removing the Visual Encoder? Scaling Laws for Encoder-Free Multimodal Pretraining", "url": "https://arxiv.org/abs/2609.35457", "authors": "Lin Chen ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "画素から直接学ぶエンコーダなしのモデルの規模則を調べた。", "id": "pn36", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "事前学習済みの視覚エンコーダを持つ多モーダルLLMと、生の画素から直接学ぶエンコーダなしのモデルの規模則を比べた（抄録）。", "p3": "計算量と損失の関係（規模則）を、テキストの目的と多モーダルの目的で両方の構造について推定した（抄録）。", "p5": "エンコーダを除くと多モーダルの目的での計算最適な配分がより大きなモデルへ移り、テキストの目的ではほぼ変わらなかった（抄録）。テキストの損失と計算量の関係はほぼ重なったが、多モーダルでは小規模でエンコーダなしが劣り、約10²²FLOPで追いつくと予測された（抄録）。エンコーダがないと言語モデルが視覚特有の適応でその役割を肩代わりした（抄録）。", "fun": "画像を読むAIには、ふつう「目」にあたる専用の部品が付いている。この研究は、目の部品を外して画素から直接学ばせても、十分に大きく計算すれば追いつけると予測した。専用の部品なしで脳が目の役割まで学ぶ、という発想が面白い。", "unverified": "抄録が途中までしか読めず、視覚特有の適応の詳細は確認できていない。"}}, {"rank": 37, "field": "機械学習", "headline": "事後学習が自信満々の幻覚を増やす", "title": "The Alignment Paradox: How Post-Training Amplifies Confident Hallucinations in Language Models", "url": "https://arxiv.org/abs/2609.32617", "authors": "Qingjia Huang ほか", "venue": "arXiv", "date": "2026-09-29", "why": "事後学習が確信度の高い誤答を増幅する仕組みを示した。", "id": "pn37", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "指示調整などの事後学習が、言語モデルの自信満々の誤答（高確信の幻覚）を大きく増やす主因であることを示した（抄録）。", "p3": "5つのモデル系統で、調整前の基盤モデルと指示調整済みモデルを事実のベンチマークで比べ、Logit Lensで層ごとに誤答の余裕（マージン）を調べた（抄録）。", "p5": "基盤モデルはまれな事実の質問で高確信の誤りが少ないが、指示調整済みモデルは確信度0.95以上の誤りを10〜35倍に増やした（抄録）。過信は後半の層で生じ、誤答のマージンは前半・中間の層ではほぼ0だが後半で4.0を超えた（抄録）。", "fun": "AIを人に好かれる受け答えに調整すると、知らないことでも自信満々に間違えるようになる。調整前のAIは分からないと迷うのに、調整後は迷いを見せなくなるらしい。「感じの良さ」と「正直さ」がぶつかるという指摘が面白い。", "unverified": "抄録が途中までしか読めず、提案された対策の有無と効果は確認できていない。"}}, {"rank": 38, "field": "機械学習", "headline": "Transformer作用素ネットワークの規模則の理論", "title": "Neural Scaling Laws of Transformer Operator Network", "url": "https://arxiv.org/abs/2609.33533", "authors": "Haoran Yan ほか", "venue": "arXiv", "date": "2026-09-29", "why": "物理系の解作用素を学ぶTransformerの誤差がデータ量とモデル規模で下がる理由を理論化した。", "id": "pn38", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "物理系の解作用素を学ぶTransformerについて、近似誤差と汎化誤差を理論的に評価し、データ量に対する予測誤差の規模則を導いた（抄録）。", "p3": "ソフトマックス注意と整合する局所から大域への近似原理に基づき、離散化に依らない出力関数を得て、Hölder正則な作用素に対する普遍近似誤差を導いた（抄録）。", "p5": "予測誤差と学習データ量の間にべき乗の規模則が成り立つことを示した（抄録）。規模則の指数の決まり方は抄録の読めた範囲では途中まで。", "fun": "天気や流れのシミュレーションを学ぶAIは、データやモデルを大きくするほど誤差が決まった割合で減る「規模則」が経験的に知られていた。この研究は、それがなぜ成り立つのかを数学で説明しようとした。経験則に理由を与える仕事として面白い。", "unverified": "抄録が途中までしか読めず、収束率の指数の値は確認できていない。"}}, {"rank": 39, "field": "機械学習", "headline": "記号と音声を統合した音楽生成", "title": "YuE2: Unifying Symbolic and Audio Music Generation at Frontier Quality", "url": "https://arxiv.org/abs/2609.33757", "authors": "Ruibin Yuan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "旋律・和声などの記号表現と完成音源の生成を一つにまとめた音楽生成モデル。", "id": "pn39", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "旋律・和声を明示する記号の楽譜の計画と、完成した音源の生成を一つのモデルで統合した音楽生成モデルYuE2を提案した（抄録）。", "p3": "一つのAR-NARの混合Transformerが、まず読める楽譜を書き、それを意味的な音楽トークンに展開し、曲全体の音声として実現する（抄録）。", "p5": "同じチェックポイントの比較で、専門家は記号の計画ありを全体の質と音楽性で好み（49.3%対計画なし34.6%）、WildSongBenchのSongBench全体平均は6.73で公開の比較手法すべてを上回り、8候補から選ぶと6.96だった（抄録）。", "fun": "作曲するAIには、楽譜を書くのが得意なものと、いきなり音を作るのが得意なものがあった。この研究は、まず楽譜で設計図を書いてから音にする、という人間の作曲家に近い順番を一つのAIで行い、専門家の評価も高かった。設計図を先に書く大切さが分かる。", "unverified": "本文が入手できず、専門家評価の人数と評価の詳細は確認できていない。"}}, {"rank": 40, "field": "機械学習", "headline": "ループ型Transformerで推論時の計算を伸ばす", "title": "Improving Test-Time Scaling with Adaptive Looped Transformers", "url": "https://arxiv.org/abs/2609.35748", "authors": "Yichen You ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "層を再利用するループ型Transformerが推論時の計算量拡大に有利かを調べた。", "id": "pn40", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "同じ層を繰り返し使うループ型Transformerで、推論時の計算量を増やしたときの精度の伸びを調べ、必要なトークンにだけ追加の反復を割り当てる手法TaH2を提案した（抄録）。", "p3": "事後学習したループ型Transformerで、推論の計算量を倍にするごとの精度の伸び（傾き）を測り、本体と反復回数の決定器を先読みの深さの教師で同時に学習する（抄録）。", "p5": "既存のループ型は非ループ型より傾きが急なことが多いが、同じ計算量では劣っていた（抄録）。固定の深さのループは全トークンに反復を費やすが、多くのトークンは追加の反復の恩恵を受けないことを示した（抄録）。", "fun": "難しい問題だけ何度も考え直し、簡単なところはさっと済ませるのは人間の賢い勉強法だ。AIも全部の言葉に同じだけ考える時間を使うのは無駄が多く、必要な言葉だけ繰り返し考えさせると効率が上がる、という発想が面白い。", "unverified": "抄録が途中までしか読めず、TaH2の改善幅は確認できていない。"}}, {"rank": 41, "field": "機械学習", "headline": "拡散モデルで報酬の分布を表す", "title": "Diffusion Reward Models", "url": "https://arxiv.org/abs/2609.33803", "authors": "Xiangyang Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "人の選好の多峰性を表すため、報酬を拡散モデルで分布として学ぶ報酬モデルを提案した。", "id": "pn41", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "人の選好の多峰性を表すため、報酬モデルを条件付き密度推定p(r|x,y)として定式化し、凍結したLLMの符号化器に条件づけた小さな拡散Transformerで報酬の分布を生成する拡散報酬モデル（DRM）を提案した（抄録）。", "p3": "出力分布に母数の仮定を置かず、多属性の回帰とペアの選好データを一つの構造で扱い、推論時にN個のサンプルから報酬の経験分布を作ってスカラー・分散・分位点にまとめる（抄録）。", "p5": "5つのベンチマークで、同じデータと基盤のもとで基準と同等以上、はるかに大きな報酬モデルとも競合し、従来の出力が一点につぶれるところで多峰の構造を回復した（抄録）。不確かさを考慮した棄却と下側信頼限界の集約が判断を改善し、RLHFの報酬に使うと方策の性能が上がった（抄録）。", "fun": "AIの答えの良し悪しを採点する「採点係のAI」は、ふつう一つの点数しか出さない。でも人の好みは割れるもので、同じ答えを高く評価する人も低く評価する人もいる。この研究は、画像生成で使う拡散モデルで「点数の分布」ごと出すようにした。好みの割れ方まで表す発想が面白い。", "unverified": "ベンチマーク名と改善幅の数値は確認していない。"}}, {"rank": 42, "field": "機械学習", "headline": "注意機構が自ら計算量を配分する", "title": "MassAlloc Attention: Let Attention Allocate Its Own Compute", "url": "https://arxiv.org/abs/2609.32712", "authors": "Jingze Shi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "注意の重みがほぼゼロの部分の計算を省く融合注意機構を提案した。", "id": "pn42", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "注意機構で寄与のほぼない部分の計算を、寄与の大きさに応じて省く融合注意の演算MALAを提案した（抄録）。", "p3": "すべての因果的な相互作用のスコアへのアクセスを保ちつつ、正規化された寄与で後段の計算を配分し、順伝播はオンラインのソフトマックス正規化、逆伝播は確定した正規化を再利用する（抄録）。", "p5": "8Kの長さで後段の総計算を揃えた比較では、省かれた質量の平均が0.0188%で、事例ごとの参照の上限0.0182%に近かった（抄録）。1K〜32Kトークンで同じ許容値のまま出力と勾配の誤差を低く保ったと述べる（抄録）。", "fun": "AIが文章を読むとき、実はほとんどの単語どうしの関係はほぼ無視されているのに、計算機は律儀に全部を計算している。この研究は、効いていない部分の計算を自動で省きながら、結果はほとんど変えない仕組みを作った。手を抜く場所を賢く選ぶ技術として面白い。", "unverified": "抄録が途中までしか読めず、速度の改善幅は確認できていない。"}}, {"rank": 43, "field": "因果推論", "headline": "打ち消し合う媒介効果を測る新指標", "title": "Quantifying Inconsistent Mediation: The Mediated Magnitude Share and the Degree of Suppression", "url": "https://arxiv.org/abs/2609.33846", "authors": "Md. Niamul Islam Sium ほか", "venue": "arXiv", "date": "2026-09-29", "why": "直接効果と間接効果が逆向きのときに使える媒介の大きさの指標を提案した。", "id": "pn43", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "直接効果と間接効果が逆向きに打ち消し合う「不整合な媒介」では媒介割合が0〜1を外れたり不安定になったりするため、有界で解釈しやすい2つの指標（媒介の大きさの割合MMSと抑制の度合い）を提案した（抄録）。", "p3": "MMSは間接経路の絶対的な大きさを直接と間接の絶対値の和に対する比で表し、抑制の度合いはその和のうち逆向きの経路で打ち消される割合を表す（抄録）。2経路での上下限と極限の振る舞いを示し、複数の間接経路と、対数をとったオッズ比・リスク比の尺度に拡張した（抄録）。", "p5": "MMSは整合的な媒介では従来の媒介割合に一致する（抄録）。経路の向きがそろわない媒介の仕組みを、有界で解釈しやすく特徴づけられる（抄録）。", "fun": "ある原因が結果を増やす道と減らす道の両方を持つと、効果が打ち消し合って「媒介の割合が全体の効果より大きい」というような変な数字が出てしまう。そこで、道ごとの効き目の大きさと、どれだけ打ち消し合っているかを別々に0〜1の範囲で表す物差しを作った。分かりにくい数字を分かりやすくする工夫が面白い。", "unverified": "実データへの適用例は確認していない。"}}, {"rank": 44, "field": "因果推論", "headline": "メディケイド拡大と早産：段階的DID", "title": "Medicaid Expansion And Singleton Preterm Birth In The USA, 2009–24: A Staggered Difference-In-Differences Analysis Of National Natality Data", "url": "https://doi.org/10.2139/ssrn.7511468", "authors": "Oluwasegun  Austine AKINYEMI ほか", "venue": "SSRN", "date": "2026-09-29", "why": "全米の出生データでメディケイド拡大と早産の関係を段階的な差の差法で推定した。", "id": "pn44", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "米国の医療保険の拡大（ACAのメディケイド拡大）が単胎の早産に与えた影響を、2009〜24年の全出生データで段階的な差の差法により推定した（抄録）。", "p3": "国立保健統計センターの制限つきの出生ファイルで、50州とワシントンDCの単胎出生を対象に、2014〜23年の州の拡大の実施を曝露、非拡大州を対照とし、Callaway-Sant'Annaの推定量（未処置の州を対照、州クラスターの標準誤差）で州・年（州・年・人種）単位で分析した（抄録）。", "p5": "結果の記述は抄録の読めた範囲に含まれていない。", "fun": "米国では、医療保険の対象を広げた州と広げなかった州がある。州によって始めた年が違うことを利用して、保険の拡大が早産を減らしたかを確かめた。始まる時期がばらばらな政策の効果を正しく測る、新しい差の差法を使っている点が見どころだ。", "unverified": "抄録が途中までしか読めず、推定された効果の大きさと人種別の結果は確認できていない。"}}, {"rank": 45, "field": "因果推論", "headline": "測度に線形なモデルの識別・計算・推論", "title": "An Adversarial Approach to Identification, Computation, and Inference in Models with a Linear-in-Measures Representation", "url": "https://arxiv.org/abs/2609.32076", "authors": "Irene Botosaru ほか", "venue": "arXiv", "date": "2026-09-29", "why": "潜在変数を含む計量モデルの識別と推論を敵対的な定式化で統一的に扱った。", "id": "pn45", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "観測・潜在の入力の同時確率測度について制約が線形に書ける計量経済モデルで、識別集合を特徴づける敵対的な乖離関数を作り、識別・計算・推論を統一的に扱う枠組みを示した（抄録）。", "p3": "乖離関数のゼロ点が構造・反実仮想パラメータの識別集合になり、出力の台が有限なら有限の線形計画で計算するか確かな上下限を与え、罰則つきブートストラップで点ごとの一様な被覆を持つ信頼集合を作る（抄録）。", "p5": "固定効果と離散の共変量を持つ二値選択のパネルで、未解決だった2つの場合（誤差分布を特定しない逐次外生性など）に適用したと述べる（抄録）。", "fun": "経済のモデルで「データからどこまで言えるか」を調べるとき、答えが一点に決まらず範囲になることがある。この研究は、その範囲を、敵対するプレーヤーとの勝負のような形の関数で表し、線形計画という計算しやすい問題に直した。難問を計算できる形にする工夫が面白い。", "unverified": "抄録が途中までしか読めず、応用例の具体的な結果は確認できていない。"}}, {"rank": 46, "field": "組織行動・心理的安全性", "headline": "分散チームの熟議をエージェントで仲介する", "title": "Evaluating an Agentic Hyper-Communication Framework for Optimized Human Deliberation Across Distributed Teams", "url": "https://doi.org/10.2139/ssrn.7538678", "authors": "Louis Rosenberg ほか", "venue": "SSRN", "date": "2026-09-29", "why": "人の集団の多対多の熟議のボトルネックを、エージェントによる仲介で緩和する枠組みを評価した。", "id": "pn46", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "分散したチームの人間の熟議で、参加者それぞれに専用のAIエージェントを付け、重要な論点を要約・選別して他の参加者に配る「ハイパー・コミュニケーション」の枠組みを評価した（抄録）。", "p3": "105人・15グループが隠れたプロフィール課題（各人が異なる情報を持つ課題）を解く比較研究で、通常のグループ討議と比べた（抄録）。", "p5": "意思決定の正解率はハイパー・コミュニケーション93.3%、通常の討議92.3%と同程度で、決定までの時間は19%短く、統計的に有意だった（p=0.023）（抄録）。", "fun": "大勢で話し合うと、話す順番待ちや情報の多さで混乱しがちだ。一人に一台AIの秘書を付けて、大事な情報だけを仲間に伝えてもらうと、正解率はそのままで決めるまでの時間が約2割短くなった。会議の「交通整理」をAIに任せる発想が面白い。", "unverified": "本文が入手できず、課題の内容と参加者の属性は確認できていない。"}}, {"rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "この本はAI製？レビューに現れる疑い", "title": "\"Is This Book AI-Generated?\" How Authorship Suspicion Manifests in Marketplace Reviews", "url": "https://arxiv.org/abs/2609.33950", "authors": "Victor Dibia", "venue": "arXiv", "date": "2026-09-29", "why": "ベストセラーの低評価レビューから、AI著作への疑いの表れ方を分析した。", "id": "pn47", "explain": {"basis": "抄録", "basis_note": "arXiv版の本文を取得したが、短い解説のため抄録の範囲で書いた", "preprint": true, "short": true, "p1": "アマゾンのベストセラー78冊の低評価レビュー863件を分析し、AIが書いたのではという疑いがどの分野のレビューにも現れ、星の評価では見えないことを示した（抄録）。", "p3": "8つの分野を、AIとの近さの3段階に分けて選んだ本の低評価レビューを分析し、AIの著作への疑いの現れ方と生じ方を調べた（抄録）。", "p5": "疑いは生成AIの本に集中した（35.1%）が、園芸（5.7%）を含むすべての分野に現れた（抄録）。疑いは、決まりきった文章への一般的な不満としての「漠然とした疑い」と、複数の読者が独立に具体的な証拠を挙げる「裏づけのある疑い」の2つの形をとった（抄録）。最も疑われた本は星4.1なのに、批判的なレビューの50%がAIの著作を指摘していた（抄録）。", "fun": "ネットの本のレビューに「これAIが書いたでしょ」という書き込みが増えている。調べると、AIがテーマの本だけでなく園芸の本にまで現れ、星4.1の人気本でも低評価の半分がAI疑惑を指摘していた。星の数だけでは見えない読者の不信感を掘り出した点が面白い。", "unverified": "疑いの2つの生じ方の比率など詳細は確認していない。"}}, {"rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "スプレッドシートの失敗事例の解剖", "title": "Anatomy of a Spreadsheet Failure, Analysing the EuSpRIG Horror Story Corpus", "url": "https://arxiv.org/abs/2609.31815", "authors": "Simon Thorne ほか", "venue": "arXiv", "date": "2026-09-29", "why": "30年分のスプレッドシート事故の事例集から、失敗の型と帰結を整理した。", "id": "pn48", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "欧州スプレッドシートリスク関心グループ（EuSpRIG）の「失敗事例集」から、1995〜2026年の121件のスプレッドシート事故を12の類型に分類し、仕組み・文脈・帰結を分析した（抄録）。", "p3": "事例集を整理・重複除去し、失敗の類型ごとに原因と影響を整理した（抄録）。", "p5": "数式の誤り、入力ミス、データ処理の誤りが7 下に関連することを示した（抄録）。", "p3": "ベースライン8,519人、4年後の追跡1,873人で、体の丸み指数（BRI）や腹囲身長比（WHtR）とBMIを比べ、皮質の変化による媒介と、脂肪の蓄積の速さの予測力を調べた（抄録）。", "p5": "ベースラインでは中心性の脂肪の指標がBMIより認知の低下（抑制制御、エピソード記憶）をよく予測し、前頭・側頭の皮質の変化が一部を媒介した（抄録）。縦断的には脂肪の蓄積の速さが重要で、速いほど頭頂葉の皮質の薄化が遅く（発達の遅れ）、追跡時の実行機能が低かった（抄録）。", "fun": "子どもの肥満は体重（BMI）で測られがちだが、お腹まわりの脂肪の方が、記憶や集中などの脳の働きとよく関係していた。しかも、太っているかどうかより、どれだけ速く脂肪が増えたかが、脳の発達の遅れとつながっていた。成長期の体と脳の関係の研究として面白い。", "unverified": "抄録が途中までしか読めず、効果の大きさの数値は確認できていない。eLifeの評価（important/solid）は候補の情報による。"}}], "jnl_related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "走行車両で橋を診る手法を実験で検証", "title": "Experimental Validation of a Drive-By Bridge Monitoring Algorithm", "url": "https://doi.org/10.1016/j.prostr.2026.07.058", "authors": "Suzana Ereiz ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr01", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "p1": "走行するトラックの加速度だけから橋の固有振動数とモード形を同定するMATLABのドライブバイ・アルゴリズムを、4径間の実橋で速度を系統的に変えた走行実験により検証し、主要モードは振動数とモード形の両方を信頼して同定できることを示した（抄録）。", "p2": "ドライブバイ監視は解析と数値では広く研究されてきたが、条件を系統的に変えた実物大の橋での実験的な検証は限られていた（抄録）。", "p3": "入力は4軸トラックに載せた加速度計の応答、出力は橋の固有振動数とモード形である（抄録）。独立な基準として橋の3次元有限要素モデルを作り、MATLABで2次元の車両-橋梁相互作用（VBI）の数値モデルを実装して、実験・FEM・アルゴリズムの結果を比べた（抄録）。", "p4": "4径間の連続RC橋で、トラックを一定速度20・30・40・50km/hで走行させて測定した（抄録）。評価は振動数の一致と、モード形の一致度を表すMAC（モード保証基準）で、車両質量と走行速度のパラメータ研究も行った（抄録）。", "p5": "実験で同定した振動数、FEMの予測、アルゴリズムの結果は主要な振動モードでよく一致し、高次モードでは車両応答に含まれるエネルギーが小さいため差が大きいが物理的に整合していた（抄録）。MACにより主要な振動数だけでなくモード形も信頼して同定できることが確かめられた（抄録）。同定の質を決める支配的な要因は走行速度だった（抄録）。", "p6": "解釈：一つの橋・一台の車両の検証で、路面凹凸や交通のある通常の運用条件、他の構造形式への一般化は抄録からは分からない。振動数の誤差の数値は抄録に記載がない。", "fun": "橋にセンサを付けず、上を走るトラックに加速度計を載せるだけで、橋の揺れやすいリズムと揺れ方の形を当てられるかを、本物の橋で4つの速さで走って確かめた。主な揺れはちゃんと当たり、一番効いたのは車の重さではなく走る速さだった。机の上の理論が現場で通用するかを確かめる大事な一歩である。", "unverified": "本文が入手できず、振動数の誤差の値、橋の支間長、最適な速度の結論は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 2, "theme": "VBI・橋梁SHM", "headline": "車両群の走行振動から橋の変形形状を得る", "title": "Fleet monitoring of bridges using drive-by operational deflection shapes", "url": "https://doi.org/10.1016/j.prostr.2026.08.063", "authors": "Kun Feng ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr02", "explain": {"basis": "題名", "basis_note": "Procedia Structural Integrityの出版社サイトからは抄録・本文とも取得できず、題名のみ", "preprint": false, "p1": "題名から言えるのは、複数の車両（フリート）の走行計測から、橋の運用時のたわみ形状（operational deflection shapes）を求めて橋を監視する研究だということだけである。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "fun": "一台の車の測定では雑音が多くても、たくさんの車が何度も橋を渡れば、そのデータを集めて橋のたわみ方の形を浮かび上がらせられるかもしれない。題名からは、「数の力」で車からの橋の診断を確かにしようとする問いが読み取れ、面白い。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "ドライブバイと常設計測を組み合わせる枠組み", "title": "A Hybrid Drive-by Framework Towards Integrated Bridge Health Monitoring", "url": "https://doi.org/10.1016/j.prostr.2026.08.062", "authors": "Joshua Irawan ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr03", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "p1": "橋に付けた少数の加速度計と走行車両の加速度を組み合わせるハイブリッド型のドライブバイ点検（HDBI）で、時間積分なしに橋の変位とたわみ角の空間分布を再構成できることを数値で示した（抄録）。", "p2": "固定の密なセンサ網は費用がかかり、車両だけのドライブバイは車両自身の動特性・路面凹凸・雑音に橋の振動が埋もれやすい（抄録）。橋のセンサは直接だが空間的に疎、車両は連続だが間接的な情報を与えるので、両者の統合が有用である（抄録）。", "p3": "2自由度のハーフカー模型で車両-橋梁相互作用を模擬する（抄録）。橋の3か所の加速度を帯域制限したモード状態推定に使い、低周波のたわみ角情報で準静的応答を補う（抄録）。車両の加速度から簡略化した動力学モデルで車軸力を再構成し、それをモード外力に射影して、疎な橋の加速度とともに橋の応答を再構成する（抄録）。", "p4": "数値の車両-橋梁連成応答で、変位とたわみ角の再構成の実現可能性を検証した（抄録）。評価指標の具体は抄録に記載がない。", "p5": "結果は提案枠組みの実現可能性を確認し、統合的な構造ヘルスモニタリングへの可能性を示したと抄録は述べる。再構成の誤差の数値は抄録にない。", "p6": "解釈：検証は2自由度の車両の数値模擬で、路面凹凸や実測雑音のもとでの性能、実橋での検証は今後の課題と考えられる。", "fun": "橋に付けたセンサは確かだが数が少なく、車に載せたセンサは橋全体を走り抜けるが間接的だ。この研究は、車の揺れから「車が橋を押す力」を逆算し、橋の3つのセンサの情報と組み合わせて、橋全体のたわみを描き出した。弱点の違う二つの目を組み合わせる発想が面白い。", "unverified": "本文が入手できず、再構成の精度、路面凹凸の扱い、車両速度の条件は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 4, "theme": "VBI・橋梁SHM", "headline": "高速列車とアーチ橋の共振を実橋で計測", "title": "High-speed testing of a tied arch railway bridge Vehicle-bridge interaction at resonance", "url": "https://doi.org/10.1016/j.prostr.2026.07.055", "authors": "Florian A. Schlegel ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr04", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "p1": "新型の高速列車の検証試験で意図的に共振を起こしたタイドアーチ鉄道橋について、列車・橋・軌道の応答の実測と多体動力学の数値モデルで、共振時の車両-橋梁相互作用の動的な仕組みを示した（抄録）。", "p2": "共振による大きな振動は橋と軌道の健全性・耐久性に危険なため通常運用では避けられ、共振の数値解析は増えたが、厳しい振幅に達した現地測定の公表はまれだった（抄録）。", "p3": "高速試験で列車・橋・軌道の反応を監視し、多体モデルの数値評価で背後の動的な仕組みを調べた（抄録）。", "p4": "新しい高速列車の許容できる動的挙動を示すために、意図的に共振振動を励起した試験のデータを用いた（抄録）。評価指標の具体は抄録に記載がない。", "p5": "共振時の列車・橋・軌道の応答の測定結果を示し、車両-橋梁相互作用の効果を動的解析に取り込む議論に貢献すると述べる（抄録）。振幅などの数値は抄録にない。", "p6": "解釈：一つの橋での試験で、測定の詳細と数値モデルとの一致の程度は抄録からは分からない。", "fun": "列車の車輪が作るリズムが橋の揺れやすいリズムと一致すると、ブランコを押すように揺れがどんどん大きくなる。ふつうは避けるこの共振を、新型列車の試験であえて起こし、橋全体がたわむ様子を実際に測った。めったに見られない「本気の共振」の記録である点が面白い。", "unverified": "本文が入手できず、橋の諸元、共振速度、振幅の値は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 5, "theme": "VBI・橋梁SHM", "headline": "ひずみから長大吊橋の形状と損傷を再構成", "title": "On the applicability of the 1D inverse FEM to long-span bridges with applications to shape sensing and damage detection", "url": "https://doi.org/10.1177/14759217261490508", "authors": "Jacopo Bardiani ほか", "venue": "Structural Health Monitoring", "date": "2026-09-29", "sjr": 1.364, "id": "jr05", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "長大な吊橋の構造ヘルスモニタリングに逆有限要素法（iFEM：ひずみの計測から変形を再構成する方法）を適用し、外力を知らなくてもひずみから変形形状を再構成（形状センシング）し、ハンガーの張力喪失を検出・位置特定できることを縮尺模型で示した（抄録）。", "p2": "吊橋の監視では、作用する荷重が分からないまま構造の応答を知る必要がある（抄録）。背景：従来のモデル更新型の方法は荷重や境界条件の仮定に依存しがちである。", "p3": "入力は主径間に沿って設置したFBG（ファイバー・ブラッグ・グレーティング）光ファイバのひずみ、出力は変位場の再構成と損傷指標である（抄録）。iFEMで荷重に依らず変位を復元し、異常指数と組み合わせて損傷の検出と位置特定を行う（抄録）。", "p4": "1:250の3径間吊橋の模型で、静的荷重と、床版上を移動する荷重を含む動的荷重で実験し、再構成した変位をレーザ変位計の独立な計測と比べた（抄録）。損傷は主径間の選んだハンガーの張力の完全な喪失とした（抄録）。", "p5": "再構成した変位はレーザ変位計の計測と照合され、手法の精度が示されたと抄録は述べる。異常指数とiFEMの組み合わせで、ハンガーの張力喪失の検出と位置特定ができた（抄録）。誤差の数値は抄録にない。", "p6": "解釈：検証は縮尺模型の実験で、実橋の温度変化や交通の雑音のもとでの性能、張力の部分的な低下のような軽い損傷の検出力は抄録からは分からない。著者は実橋への適用の可能性が高いと述べる（抄録）。", "fun": "吊橋のケーブルから床を吊っている細い綱（ハンガー）が1本切れても、外から見て気づくのは難しい。この研究は、橋の床に貼った光ファイバの伸び縮みだけから、どんな重さの車が通っているかを知らなくても、橋全体の曲がり方を再現し、切れた綱の場所まで当てた。力を知らずに形を知る、という発想が面白い。", "unverified": "本文が入手できず、再構成の誤差、センサの数、検出の感度は確認できていない。"}, "citescore": 14.4, "citescore_year": "2025"}, {"rank": 6, "theme": "VBI・橋梁SHM", "headline": "スマホと縮尺車両で構造物の動特性を同定", "title": "Smartphone-Assisted Dynamic Identification of Infrastructures Using Scaled Vehicles", "url": "https://doi.org/10.1016/j.prostr.2026.08.049", "authors": "Chiara Masnata ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr06", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "p1": "イタリア・パレルモで、従来の加速度計とスマートフォンを載せた縮尺の小型車両を構造物の上で走らせ、スマートフォンのMEMS加速度計で構造物の振動モニタリングができるかを実験で予備的に評価した（抄録）。", "p2": "都市の交通インフラの振動による評価を、安価で手軽な方法で継続的に行いたいが、スマートフォンのセンサの感度・雑音・同定精度が十分かは確かめられていなかった（抄録）。", "p3": "車両-構造物相互作用の考え方で、計測車両を構造物の上で繰り返し走行させ、車両と構造物の動的応答を集めた（抄録）。スマートフォンのMEMS加速度計と従来の圧電式加速度計を、感度・雑音水準・モード特性の同定精度で比べた（抄録）。", "p4": "パレルモ市内の構造物での実験で、2種のセンサの性能を比較した（抄録）。定量的な評価の値は抄録に記載がない。", "p5": "抄録は予備的な成果として、スマートフォンのセンサによる低コストの振動モニタリングの方法論の開発に貢献すると述べる。性能の数値は抄録にない。", "p6": "解釈：縮尺の車両での予備的な実験で、実車両での適用や、スマートフォンの時刻同期・サンプリングの不安定さの影響は抄録からは分からない。", "fun": "スマホには、画面の向きを知るための小さな揺れのセンサが入っている。それを小さな模型の車に載せて構造物の上を走らせ、専門の高価なセンサと比べて、構造物の揺れやすさを当てられるかを試した。誰でも持っている道具で橋の健康診断を、という夢に近づく実験だ。", "unverified": "本文が入手できず、対象の構造物、雑音水準の比較、同定精度の値は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 7, "theme": "LLM熟議・ペルソナ", "headline": "LLMの記憶の与え方が選好の一貫性を変える", "title": "How Model Choice and Memory Shape Preference Consistency in Large Language Models", "url": "https://doi.org/10.1177/00491241261492203", "authors": "Yick Chung", "venue": "Sociological Methods and Research", "date": "2026-09-29", "sjr": 3.471, "id": "jr07", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "LLMに一連の質問に答えさせるとき、自分の過去の回答をプロンプトにどう戻すか（記憶の条件）が、選好の内的な一貫性を最大48ポイントも変える「調査方式の効果」として働くことを、顕示選好理論で示した（抄録）。", "p2": "LLMを社会科学の道具として使う研究は、モデル名や温度は報告しても、過去の回答について何をどう伝えたかはほとんど報告してこなかった（抄録）。", "p3": "顕示選好の一般化公理（GARP：選択が一つの効用関数で説明できるかの検査）を使い、4つのLLM系統に道徳・経済・社会の課題で連続した選択をさせ、過去の選択の戻し方を変えた（抄録）。シリコン・サンプリング（LLMで人間の回答分布を模擬する）への拡張も行った（抄録）。", "p4": "N=5,926の選択の系列で、内的に一貫した被験者の割合、表明される選好、人間の分布との近さを比べた（抄録）。", "p5": "記憶の条件は、一貫した被験者の割合を最大48ポイント動かし、その変化は元の割合が最も低いところで大きかった（抄録）。記憶は表明される選好も変え、シリコン・サンプリングでは答えを人間の分布に近づけた（抄録）。ただし一貫性と見かけの忠実さの向上は、代表性の向上を意味しなかった（抄録）。", "p6": "著者は、一貫して人間らしく見えるモデルでも、どの人間集団も代表していない可能性を警告する（抄録）。解釈：記憶の条件の具体的な種類とモデルごとの差は抄録からは分からない。", "fun": "経済学には、選び方に矛盾がないか（AよりB、BよりC、なのにCよりAを選んでいないか）を調べる方法がある。AIに次々と選ばせると、前に何を選んだかを見せるかどうかだけで、矛盾のないAIの割合が最大48ポイントも変わった。しかも筋が通って人間らしく見えても、実在の誰かを代表しているとは限らない。", "unverified": "本文が入手できず、記憶の条件の具体的な設定、モデル名、課題別の結果は確認できていない。"}, "citescore": 16.2, "citescore_year": "2025"}, {"rank": 8, "theme": "LLM熟議・ペルソナ", "headline": "LLMの評判判断が人間の協力を左右する", "title": "How large language models judge and influence human cooperation", "url": "https://doi.org/10.1093/pnasnexus/pgag297", "authors": "Alexandre S Pires ほか", "venue": "PNAS Nexus", "date": "2026-09-29", "sjr": 1.339, "id": "jr08", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Semantic Scholarに登録された抄録のみを読んだ", "preprint": false, "p1": "21のLLMに、さまざまな社会的文脈での協力・非協力の行為をどう評価すべきかを判断させ、その判断が評判による間接互恵の社会で支配的になったときの協力の長期的な動態を、進化ゲーム理論のモデルで評価した（抄録）。", "p2": "人は社会的な判断にLLMを使うようになり、LLMが道徳的・政治的な判断を左右しうることは知られていたが、他人の行為の評価をLLMに頼ったときの協力への長期的な影響は分かっていなかった（抄録）。協力はしばしば間接互恵（評判）で支えられる（抄録）。", "p3": "協力する・しない行為の多数の例をLLMに示して評価させ、抽出した評価の規範（誰を良い人とみなすか）を進化ゲームのモデルに入れて、集団での協力の広がりを計算した（抄録）。目的志向のプロンプトなどで規範を誘導できるかも試した（抄録）。", "p4": "評価の一致度（モデル内・モデル間のばらつき）と、その規範のもとで集団に協力がどれだけ広がるかを指標とした（抄録）。", "p5": "良い評判の相手への協力の評価はモデル間で顕著に一致したが、評判の悪い相手への協力の評価はモデル内・モデル間でばらついた（抄録）。このモデル間の違いは協力の広がりに大きく影響し、プロンプトで規範を変えられ、特に目的志向のプロンプトが効いた（抄録）。", "p6": "著者は、人の協力を守るにはLLMの規範を慎重に整合させる必要があると述べる（抄録）。解釈：結果は理論モデル上の動態で、人々が実際にLLMの評価に従う程度は検証されていない。", "fun": "「悪い評判の人を助けた人は、良い人か悪い人か」という判断は、社会の協力のしくみを左右する。21のAIに判断させると、良い人を助けることの評価はそろったが、悪い評判の人を助けることの評価はばらばらだった。どのAIの価値観が広まるかで、社会全体の助け合いの量が変わりうる、という指摘が面白い。", "unverified": "本文が入手できず、モデル名、評価の一致度の数値、協力の割合の値は確認できていない。"}, "citescore": 6.7, "citescore_year": "2025"}, {"rank": 9, "theme": "位相空間・土木三力学", "headline": "不連続ポテンシャルのリウヴィル方程式解法の安定性", "title": "The $l^1$-Stability of a Hamiltonian-Preserving Scheme for the Liouville Equation with Discontinuous Potentials", "url": "https://doi.org/10.4208/jcm.v27.n1.p45", "authors": "Xin Wen ほか", "venue": "Journal of Computational Mathematics", "date": "2026-09-29", "id": "jr09", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "不連続なポテンシャルを持つ1次元のリウヴィル方程式（位相空間での分布の移流を表す方程式）に対するハミルトニアン保存型の数値スキーム（Jin・Wen 2005）が、適切な初期値に対してl¹ノルムで安定であることを証明した（抄録）。", "p2": "ポテンシャルが不連続だと、粒子が壁を越えるか跳ね返るかの判定が必要になり、スキームの安定性の保証は難しい（背景）。同じスキームのl¹収束の結果（Wen・Jin 2008）はあったが、安定性の証明が欠けていた（抄録）。", "p3": "双曲型のCFL条件（時間刻みと格子幅の比の条件）のもとで、l¹ノルム（分布の差の総量）での安定性を示した（抄録）。", "p4": "数学的な証明の論文で、数値実験による検証は抄録からは読み取れない。", "p5": "適切な初期値では、スキームはl¹で安定で、安定定数は計算時間に依存しない（抄録）。一方、測度値の初期値（点に集中した分布など）では数値解がl¹不安定になりうる反例を示した（抄録）。", "p6": "結果は1次元に限られ、多次元や測度値の初期値の扱いは今後の課題として残る（抄録から読み取れる範囲）。解釈：粒子を点で表すような初期値での不安定性は、少数粒子系を位相空間で扱う場合の注意点になりうる。", "fun": "ボールが段差にぶつかるとき、勢いが足りなければ跳ね返り、十分なら乗り越える。位置と速さの「地図」の上でたくさんのボールの分布を動かす計算で、この段差の判定をうまく組み込んだ方法が、長い時間計算しても誤差が膨らまないことを証明した。ただし、ボールが一点に集中した初期状態では壊れうる、という反例も面白い。", "unverified": "本文が入手できず、証明の手法と反例の具体的な構成は確認できていない。"}, "citescore": 1.8, "citescore_year": "2025"}, {"rank": 10, "theme": "位相空間・土木三力学", "headline": "CNNで確率密度発展法を高速化し信頼性評価", "title": "A CNN-Enhanced Probability Density Evolution Framework for Reliability Analysis of Offshore Wind Turbines", "url": "https://doi.org/10.1016/j.cacaie.2026.100238", "authors": "Jia-Xuan Li ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-09-29", "sjr": 2.155, "id": "jr10", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "p1": "風・波・地震の確率的な複合外力を受ける洋上風車の動的信頼性を、CNNで応答を再構成して確率密度発展法（PDEM）と組み合わせるCNN-PDEMで評価し、従来のPDEMより誤差を約7割減らした（抄録）。", "p2": "洋上風車の応答と信頼性は時間とともに変わる大きな不確かさを持つ（抄録）。背景：PDEMは少数の代表標本から確率密度の時間発展を解くが、標本数が限られると精度が落ちやすい。", "p3": "検証済みのAbaqusの3次元モデルで200本の確率的な入力-応答の軌道（塔頂変位）を作り、等確率の標本分割を用い、CNN-BiLSTM-SE注意機構で変位の軌道を再構成して、PDEMで確率密度を発展させる（抄録）。吸収境界で破壊した軌道の確率を取り除き、安全域に残る密度から初通過の信頼度を直接得る（抄録）。", "p4": "モンテカルロ法（MCS）を参照解とし、時間変化する平均と標準偏差のRMSE、信頼性の遷移領域でのRMSE・MAE・最大絶対誤差、許容誤差0.05で評価し、ブートストラップ区間・対応のある検定・同等性の分析も行った（抄録）。標本数を160から200に増やしたときの主要指標の変化は5%未満だった（抄録）。", "p5": "従来のPDEMに比べ、変位の平均と標準偏差のRMSEをそれぞれ71.1%、70.8%減らした（抄録）。信頼性の遷移領域のRMSE・MAE・最大絶対誤差はCNN-PDEMで0.012・0.010・0.020、PDEMで0.053・0.043・0.091で、CNN-PDEMの誤差はすべて許容値0.05以内だった（抄録）。", "p6": "解釈：一つの風車モデル・一つの応答量（塔頂変位）での検証で、学習用の軌道も同じモデルの計算によるため、モデル誤差を含む実構造への適用は未確認である。", "fun": "洋上の風車は、風と波と地震という三つのでたらめな力を同時に受ける。壊れる確率を調べるには何万回も計算したいが大変だ。そこで200回の計算からAIで揺れ方を補い、「確率の雲」が時間とともに流れて、壊れた分だけ消えていく様子を追った。確率を流体のように扱う発想が面白い。", "unverified": "本文が入手できず、外力のモデル化の詳細と計算時間の比較は確認できていない。"}, "citescore": 14.7, "citescore_year": "2025"}, {"rank": 11, "theme": "会計情報科学", "headline": "ワイヤーカード事件で監査法人網に評判が波及", "title": "Reputational spillovers within audit firm networks – evidence from the Wirecard scandal", "url": "https://doi.org/10.1080/09638180.2026.2735876", "authors": "Benedikt Downar ほか", "venue": "European Accounting Review", "date": "2026-09-29", "sjr": 2.272, "id": "jr11", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "p1": "ドイツのWirecard不正事件へのEYドイツの関与を使い、大規模な会計不正による評判の損失が、国際的な監査法人ネットワークの他国の提携法人にまで国境を越えて波及することを示した（抄録）。", "p2": "先行研究は主に当該国の監査法人の評判の損失を調べており、ネットワークの他国の提携法人への波及、事件への近さの影響、評判回復の対応は調べられていなかった（抄録）。", "p3": "EYの監査先企業の株価反応と監査市場の顧客の変化を、ドイツ国内と他の欧州諸国、ドイツとの近さ別に分析した（抄録）。", "p4": "結果は監査先の株式市場の反応、顧客の喪失と獲得、事件後の評判回復の兆候である（抄録）。", "p5": "ドイツだけでなく他の欧州諸国のEYの監査先でも株価の負の反応があった（抄録）。EYドイツは顧客を失い新たな上場顧客を得られず、他の欧州の提携法人も、特にドイツと国境を接する国で新規顧客の獲得に苦労した（抄録）。提携法人の評判回復と整合する証拠もあった（抄録）。法的な独立は国境を越えた評判の波及を完全には防がない（抄録）。", "p6": "解釈：一つの事件・一つのネットワークの事例で、効果の大きさと他の不正事件への一般化は抄録からは分からない。", "fun": "大きな会計不正で監査法人の信用が落ちると、法律上は別会社の隣の国の「同じ看板」の事務所まで客を失った。とくにドイツに近い国ほど影響が大きかった。ブランドを共有するということは、評判の傷も共有するということだ、という点が分かりやすく面白い。", "unverified": "本文が入手できず、株価反応の大きさ、分析対象の国と企業数は確認できていない。"}, "citescore": 7.5, "citescore_year": "2025"}, {"rank": 12, "theme": "サービス・マーケティング", "headline": "受取ロッカーは通販の購買を増やすか減らすか", "title": "EXPRESS: The Double-Edged Offline Touchpoint: How Self-Pickup Stations Reshape Pure-Play E-Commerce Transactions", "url": "https://doi.org/10.1177/00222429261496232", "authors": "Jingcun Cao ほか", "venue": "Journal of Marketing", "date": "2026-09-29", "sjr": 12.226, "id": "jr12", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "p1": "アジアの通販サイトの個人単位の取引データと合成差の差法で、受取ロッカー（セルフピックアップ拠点）の開設が顧客の支出と購買頻度を純増させ、宅配を食わず、顧客離れを減らすことを示した（抄録）。", "p2": "受取拠点は購入後の利便を高め取引費用を下げうるが、客の手間が増え、近くの実店舗との競争にさらされるため、純効果は不確かだった（抄録）。", "p3": "合成差の差法（SDID：処置群に似せた対照群を重みで作り、処置前の傾向を合わせて効果を推定する方法）で、拠点の開設の前後の個人の購買を比べた（抄録）。", "p4": "結果は顧客の支出と購買頻度、宅配への影響、顧客の離脱と関与の深さ、新規顧客の獲得で、拠点へのアクセス、近隣の実店舗の競争、商品の属性による違いも調べた（抄録）。", "p5": "拠点の開設は支出と購買頻度に正の純効果を持ち、宅配を共食いしなかった（抄録）。効果は新規顧客の獲得ではなく、離脱の減少と既存客の関与の深まりによる（抄録）。効果は近くに大型の実店舗の代替がある場所では小さくなることを初めて実証した（抄録）。", "p6": "解釈：一つのプラットフォームのデータで、拠点の立地は無作為でないため、SDIDの仮定の妥当性の検討は本文で確認する必要がある。効果の大きさは抄録に記載がない。", "fun": "ネット通販で買った物をコンビニや駅のロッカーで受け取れるようにすると、客は店に足を運ぶ手間が増えるのに、買い物は増えた。新しい客が増えたのではなく、今の客が離れにくくなったのだ。ただしロッカーの近くに大きなお店があると、そっちに流れてしまう。便利さと誘惑が隣り合う様子が面白い。", "unverified": "本文が入手できず、効果の大きさ、国・期間・標本の規模は確認できていない。"}, "citescore": 29.5, "citescore_year": "2025"}, {"rank": 13, "theme": "職場AI・組織行動", "headline": "教師のウェルビーイングと生徒の学習の関係", "title": "Association of Teacher Well-Being With Student Motivation and Achievement: A Systematic Review and Meta-Analysis", "url": "https://doi.org/10.1007/s10648-026-10216-6", "authors": "Theresa Dicke ほか", "venue": "Educational Psychology Review", "date": "2026-09-29", "sjr": 4.84, "id": "jr13", "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（方法の効果量の符号化・分析戦略、結果の採択論文数とメタ分析#1・領域別の節）を読んだ。調整変数とバイアス評価の節、補足資料は抄録の範囲で確認した", "preprint": false, "p1": "教師のウェルビーイングと不調（ill-being）が生徒の動機づけと学業達成にどれだけ関連するかを、186論文・811の効果量・教師355,637人の3水準メタ分析で推定し、小〜中程度の安定した関連を示した（抄録）。", "p2": "教師のウェルビーイングは多次元の概念で、仕事の要求度-資源（JD-R）モデル、交互作用的ストレスモデル、自己決定理論、PERMAなど複数の理論で扱われてきたが、先行レビューは領域や結果の種類を分けて統合できていなかった（§先行レビューの限界、抄録）。", "p3": "相関係数と標準化回帰係数をFisherのzに変換して統合し、同じ論文の複数の効果量の依存を扱うため、効果量を論文に入れ子にした3水準のメタ分析モデルを使った（§分析戦略）。望ましい方向がそろうよう符号を統一した（例：教師の情緒的消耗と生徒の離反の正の相関は不調の統合では負として入る）（§効果量の符号化）。", "p4": "結果は生徒の動機づけと達成で、教師側を仕事の満足と献身、教師の動機づけ、心理的機能、自己効力感の4領域に分けた（§結果）。外れ値・標本の水準・回帰係数の扱いの感度分析と、学校段階・報告者などの調整変数の分析を行った（§感度分析、§調整分析）。", "p5": "ウェルビーイングと生徒の成果の関連はr=.18（95%CI .14〜.21）、不調はr=−.13だった（抄録、§メタ分析#1）。達成（r=.16）と動機づけ（r=.20）の差は有意でなかった（χ²(1)=1.54、p=.21）（§メタ分析#1）。領域別では教師の動機づけr=.24、心理的機能r=.21、自己効力感r=.17、満足と献身r=.13で、領域間の差は有意でなかった（§RQ1）。中等教育で関連が強く、教師と生徒の変数を同じ報告者が答えると関連が大きかった（抄録）。", "p6": "著者は、証拠の大部分が相関的で、同じ報告者による測定の影響もあるため、因果の方向を明らかにするには縦断研究と介入研究が必要だとする（抄録）。領域ごとの効果量の数に偏りがあり（自己効力感が大半）、領域間の比較の検出力は均等でない（§RQ1）。", "fun": "先生が元気で仕事にやりがいを感じていると、生徒のやる気や成績も少し高い傾向がある。35万人以上の先生のデータを集めて確かめると、関係は小さいが確かにあった。ただし、先生が元気だから生徒が伸びるのか、生徒が伸びるから先生が元気なのかは、まだ分からない。学校の空気が伝わり合う様子が見える。", "unverified": "不調の統合（34論文・91効果量）の信頼区間と、出版バイアスの評価の結果は確認していない。"}, "citescore": 20.1, "citescore_year": "2025"}, {"rank": 14, "theme": "包摂的コミュニティ・社会", "headline": "高齢者に優しい地域の度合いと認知機能", "title": "Effect of age-friendly community degree on the cognitive function of older adults", "url": "https://doi.org/10.3389/fpsyt.2026.1927936", "authors": "Laiyou Li ほか", "venue": "Frontiers in Psychiatry", "date": "2026-09-28", "id": "jr14", "explain": {"basis": "本文", "basis_note": "出版社（Frontiers）のPDF本文（方法、結果の記述統計と地域の尺度得点、限界）と抄録を読んだ。回帰の表3〜4の個々の係数は確認していない", "preprint": false, "p1": "中国・寧波の認知機能の低下した60歳以上450人の横断調査で、地域の高齢者に優しい度合い（エイジフレンドリー・コミュニティ）を5つの次元で測り、住環境・交通・地域環境の低さが認知機能障害の独立した危険因子であることを示した（抄録）。", "p2": "個々の環境指標と高齢者の心身の健康の関連は多く調べられてきたが、地域の高齢者への優しさを全体として捉えたときの認知機能への影響は十分に明らかでなかった（抄録、序論）。", "p3": "エイジフレンドリー・コミュニティ評価尺度（住環境の質、交通、地域環境、地域参加、社会・医療サービスの5次元、33〜160点）と、認知症の簡易スクリーニングAD8で認知機能を測り、人口学的要因とともに段階的な重回帰・多変量ロジスティック回帰で分析した（§方法、抄録）。", "p4": "2024年6〜9月に寧波の5つの地域から便宜的抽出で募集し、在宅の介護者の助けで質問紙に回答した（§対象）。必要な標本数は20変数の10〜15倍と欠測20%から360人超と見積もった（§標本数）。", "p5": "参加者の平均年齢は73.5歳だった（§結果）。尺度の総得点は平均115.26±35.87点で、住環境の質10.37±3.66、交通24.63±8.21、地域環境21.32±7.11、地域参加21.65±7.21、社会・医療サービス35.47±10.09点、項目平均では地域参加が3.56±1.21で最も高かった（表2）。年齢・性別・教育・経済状況・住居・飲酒・慢性疾患が認知機能に有意に関連し、住環境・交通・地域環境が認知機能障害の有意な予測因子だった（抄録、表3〜4）。", "p6": "著者は、便宜的抽出と自己報告による共通方法の偏り、1都市のみのデータ、横断研究で時間的な因果の順序が分からないことを限界に挙げる（§限界）。解釈：対象がすでに認知機能の低下した人に限られ、回答に介護者が関わっており、地域の評価と認知機能の関係の向きの解釈には注意が要る。", "fun": "お年寄りが住む地域の「住みやすさ」を、住まい、交通、まちの環境、地域の活動、医療福祉の5つで点数にすると、住まいや交通、まちの環境の点が低い地域の人ほど、物忘れなどの認知機能の低下が目立った。脳の健康は本人の体だけでなく、住む街のつくりとも関係しているかもしれない、という視点が面白い。", "unverified": "表3〜4の回帰係数・オッズ比の値と、社会的包摂の次元の結果の詳細は確認していない。"}, "citescore": 6.3, "citescore_year": "2025"}, {"rank": 15, "theme": "都市・インフラ政策", "headline": "都市デジタルツインの公共的な計算基盤", "title": "The Urban Model Platform: a public backbone for modeling and simulation in urban digital twins", "url": "https://doi.org/10.1016/j.compenvurbsys.2026.102534", "authors": "Rico H. Herzog ほか", "venue": "Computers, Environment and Urban Systems", "date": "2026-09-29", "sjr": 2.174, "id": "jr15", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Semantic Scholarに登録された抄録のみを読んだ", "preprint": false, "p1": "ハンブルク市との参加型デザインを通じて、都市のデジタルツインでモデルとシミュレーションを分散的・多元的に統合する公共の基盤「Urban Model Platform」を提案した（抄録）。", "p2": "都市のデジタルツインではモデルとシミュレーションが「もし〜なら」の検討に中心的だが、都市の複雑さや不確かな仮定、背後の力関係をどう表すかが難しく、既存の取り組みは一枚岩で中央集権的な解決に偏り、多元的で相互運用可能なモデルを妨げていた（抄録）。", "p3": "参加型システムのための参加型デザインの方法で、市とともに基盤を設計した（抄録）。基盤は開かれた標準に基づき、モデルを分散的に統合し、モデル間の通信を可能にし、複数のモデルで都市を表す（抄録）。", "p4": "設計研究で、定量的な評価指標は抄録に示されていない。", "p5": "開かれた基盤が、技術的な公共の背骨であると同時に、都市の過程を協働的・多元的に表すための社会技術的な枠組みとして機能しうることを見いだした（抄録）。", "p6": "解釈：一つの都市との設計の事例で、他都市への移転性や、実際の計画判断への効果は抄録からは分からない。", "fun": "街の「デジタルの分身」を作るとき、一社の巨大なシステムにまとめると便利だが、誰の見方で街を描くかが偏ってしまう。この研究は、いろいろな人が作った交通や人口などのモデルを、共通のルールでつなげる公共の基盤を市と一緒に設計した。街のモデルづくりを民主的にしようという発想が面白い。", "unverified": "本文が入手できず、基盤の技術仕様と利用事例は確認できていない。"}, "citescore": 17.3, "citescore_year": "2025"}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "市民のスマホ計測で構造物を監視する実証", "title": "Mobile Crowdsensing for Structural Health Monitoring: Field Validation", "url": "https://doi.org/10.1016/j.prostr.2026.08.061", "authors": "Mohsen Rezvani Alile ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr16", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "専用のセンサを置かず、利用者のスマートフォンが記録した振動データ（モバイル・クラウドセンシング）から橋の固有振動数を推定する処理の枠組みを示し、実在の歩道橋で検証した（抄録）。", "p3": "ばらつきの大きいスマートフォンの記録を、品質で重みづけした信号処理とブートストラップ再標本化で処理し、固有振動数の推定値を得た（抄録）。", "p5": "実在の歩道橋に適用し、同じ構造物で専門の計測機器を使った基準の研究と比べて、有効性と精度を示したと述べる（抄録）。数値は抄録にない。", "fun": "橋の点検のために高価なセンサを付け続けるのは大変だが、橋を渡る人のスマホにも揺れは記録されている。質の違う大勢のデータを、信頼できるものほど重く扱ってまとめれば、橋の揺れやすさが分かる。みんなの持ち物で橋を見守る発想が面白い。", "unverified": "本文が入手できず、推定誤差の値と参加者の数は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 17, "theme": "VBI・橋梁SHM", "headline": "橋梁SHMデータの欠損・雑音への耐性試験", "title": "A Group-Aware Data Quality Stress Testing Framework for Bridge Structural Health Monitoring: Evidence from the Vänersborg and Z24 Datasets", "url": "https://doi.org/10.3390/infrastructures11100344", "authors": "Jianxin Hu ほか", "venue": "Infrastructures", "date": "2026-09-29", "id": "jr17", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "橋梁の構造ヘルスモニタリングのデータの欠損・雑音・スパイク・ドリフトなどへの異常検知の頑健性を、グループを考慮した固定の手順で試験する枠組みを示した（抄録）。", "p3": "Vänersborg橋の開閉64イベントとZ24の153の処理済み記録で、健全データのみで学習し、劣化は検証用のグループに限定して加え、ROC-AUCと平均適合率（AP）を主指標とした（抄録）。", "p5": "VänersborgのPCAの基準はAUC 0.500・AP 0.454で、20%の欠損で0.188・0.327、0.5%のスパイクで0.058・0.298に下がった（抄録）。Z24のPCAの基準は0.731・0.929で、摂動の影響は小さかった（抄録）。", "fun": "橋に付けたセンサのデータには、途切れや雑音、突然の飛び値がつきものだ。そうした「汚れ」をわざと加えて、損傷を見つけるAIがどれだけ惑わされるかを試すと、橋によっては少しの汚れで判定がほぼ当てずっぽうになった。データの品質管理の大切さが分かる。", "unverified": "抄録が途中までしか読めず、他の検出器の結果と感度分析の結論は確認できていない。"}, "citescore": 5.7, "citescore_year": "2025"}, {"rank": 18, "theme": "VBI・橋梁SHM", "headline": "箱桁の断面内の剛性分布を更新する手法", "title": "Stiffness Distribution Updating Method for Box Girder Bridges Considering Nonuniform Cross-Section Stiffness", "url": "https://doi.org/10.1061/jbenf2.beeng-8466", "authors": "Hong Zhou ほか", "venue": "Journal of Bridge Engineering", "date": "2026-09-29", "id": "jr18", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "長期の荷重で箱桁の断面内の剛性分布が不均一になることを考慮し、断面の剛性分布を更新する方法を提案した（抄録）。", "p3": "一般化梁理論（GBT）で薄肉閉断面の応力・ひずみ状態を解析し、局所的な剛性の変化をよく反映するひずみゲージの配置を設計し、まず従来のモデル更新で全体の剛性を求めてから断面内の分布を更新する2段階の手順とした（抄録）。", "p5": "結果の数値は抄録の読めた範囲にない。", "fun": "箱のような断面を持つ橋の桁は、長年の荷重で断面の場所ごとに硬さが違ってくる。全体の硬さだけでなく、断面の中のどこが弱ったかまでを、ひずみの測定から推定しようとした。薄い板でできた箱の複雑な変形を扱う理論を使っている点が面白い。", "unverified": "抄録が途中までしか読めず、検証の方法と精度は確認できていない。"}, "citescore": 7.2, "citescore_year": "2025"}, {"rank": 19, "theme": "VBI・橋梁SHM", "headline": "衛星SARの多重反射で橋下空間を計測", "title": "BridgeSAR: Measuring Bridge‐Water Clearance From Space Using SAR Multipath Signatures", "url": "https://doi.org/10.1029/2026gl124805", "authors": "Jinwoo Kim ほか", "venue": "Geophysical Research Letters", "date": "2026-09-29", "sjr": 1.949, "id": "jr19", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "衛星の合成開口レーダ（SAR）画像に現れる橋の多重反射の縞から、橋と水面の間の高さ（クリアランス）を宇宙から推定する手法BridgeSARを提案した（抄録）。", "p3": "OpenStreetMapの橋の幾何で1回・2回・3回反射の縞の抽出を導き、橋の軸に垂直な方向にSARの振幅を積み上げ、縞の間隔を観測の幾何と構造の厚さでクリアランスに換算する（抄録）。", "p5": "2016〜2025年のSentinel-1画像で米国の5橋に適用し、1回と3回の反射の縞の間隔が最も安定し、多くの地点で潮汐と季節の変化を再現し、最良のRMSEは0.39〜0.61mだった（抄録）。", "fun": "橋の下を船が通れるかは、橋と水面の間の高さで決まる。その高さを、宇宙の衛星が撮ったレーダー画像に映る「電波の跳ね返りの縞」の間隔から測った。橋そのものを物差しにして潮の満ち引きまで追える点が面白い。", "unverified": "抄録が途中までしか読めず、性能に影響する要因の定量的な分析は確認できていない。"}, "citescore": 8.1, "citescore_year": "2025"}, {"rank": 20, "theme": "VBI・橋梁SHM", "headline": "まくらぎ加速度とカルマンフィルタで軌道不整推定", "title": "Railway track irregularity estimation based on sleeper acceleration and Kalman filter (KF) method", "url": "https://doi.org/10.1016/j.prostr.2026.07.057", "authors": "Xiaodong Han ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr20", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "まくらぎに付けた加速度計の計測をカルマンフィルタの観測として使い、車両-軌道モデルに基づく逐次の状態推定で軌道の不整（レールの凹凸）を推定する枠組みを提案した（抄録）。", "p3": "多数のまくらぎに支えられた柔らかい軌道の上を1軸の車両が走るモデルを観測モデルとし、まくらぎの加速度から不整を再帰的に再構成した（抄録）。SN比15・25・35・45の条件で評価した（抄録）。", "p5": "不整の全体形状と卓越波長を回復でき、SN比が高いと真値とよく一致し、SN比が下がると誤差が増えて振幅の再構成の精度が落ちた（抄録）。短波長の特徴は頑健に保たれ、雑音は主に振幅の一致と長波長の成分に影響した（抄録）。", "fun": "列車が通るとまくらぎが揺れ、その揺れにはレールの凹凸が映っている。この研究は、揺れの測定と車両・線路の動きのモデルを組み合わせて、凹凸の形を逆算した。雑音が多いと大きな波の形は崩れやすいが、細かい凹凸は残る、という結果が面白い。", "unverified": "本文が入手できず、誤差の具体的な値は確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 21, "theme": "VBI・橋梁SHM", "headline": "一般車両で路面の段差を調べる手法", "title": "一般車両を使った路面状態の調査手法と安全運転に資するデータ利用法の検討", "url": "https://doi.org/10.11247/jssd.73.0_786", "authors": "俵 典和 ほか", "venue": "日本デザイン学会研究発表大会概要集", "date": "2026-09-30", "id": "jr21", "explain": {"basis": "題名", "basis_note": "J-STAGEから抄録・本文とも取得できず、題名（と英題）のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、一般の自家用車を使って道路の路面状態（段差など）を調べる手法と、そのデータを安全運転に役立てる利用法を検討した研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "道路の段差を調べるには専用の点検車が要るが、ふだん走っている普通の車のデータを集めれば、もっと広く頻繁に調べられるかもしれない。題名からは、その調べ方と、運転する人の安全に役立てる使い道を考えた研究だと読み取れる。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}}, {"rank": 22, "theme": "VBI・橋梁SHM", "headline": "クラウド型デジタルツインで橋を長期監視", "title": "Validation of a cloud-based digital twin for long-term structural health monitoring of the Terfener Inn Bridge", "url": "https://doi.org/10.1016/j.prostr.2026.08.246", "authors": "Nils Weissenbach ほか", "venue": "Procedia Structural Integrity", "date": "2026-09-29", "id": "jr22", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録のみを読んだ（朝の時点では題名のみだったが、後で抄録が登録された）", "preprint": false, "short": true, "p1": "オーストリア道路公社（ASFINAG）のプレストレストコンクリートの道路橋で、建設から4年以上連続運用した高忠実度のデジタルツインを現地で検証した（抄録）。", "p3": "床版・ウェブ・橋脚・基礎に埋め込んだ7km超の光ファイバで分布ひずみと温度を測り、非線形有限要素解析と逆解析のパラメータ同定を、クラウドのSHM基盤で物理情報ニューラルネット（PINN）と運用モード解析とともに統合した（抄録）。", "p5": "長期の監視で、クリープ・乾燥収縮・温度勾配による測定と設計予測の大きなずれが見られ、毎日の非線形解析でもそれが長期応答の主因と確認された（抄録）。載荷試験では測定と解析のひずみの一致が1%以内だった（抄録）。", "fun": "橋の中に7km以上の光ファイバを張りめぐらせ、コンピュータの中の「橋の分身」を毎日実物に合わせて更新し続けた。すると、コンクリートがゆっくり縮んだり温度で伸び縮みしたりする影響が、設計の想定より大きかった。4年以上続けて確かめた点が貴重である。", "unverified": "本文が入手できず、設計予測とのずれの大きさは確認できていない。"}, "citescore": 1.7, "citescore_year": "2025"}, {"rank": 23, "theme": "VBI・橋梁SHM", "headline": "常時微動で箱桁橋のモード同定", "title": "Operational Modal Analysis of a Box Girder Bridge using Fast Fourier Transform and Stochastic Subspace Identification", "url": "https://doi.org/10.21831/inersia.v21i2.83380", "authors": "Muhammad Akbar ほか", "venue": "INERSIA lnformasi dan Ekspose Hasil Riset Teknik Sipil dan Arsitektur", "date": "2026-09-29", "id": "jr23", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "インドネシア・マカッサルのA.P. Pettarani高架橋で、常設の加速度計の常時微動データから、FFTと確率的部分空間同定（SSI）で固有振動数と減衰比を求めた（抄録）。", "p3": "交通と環境による振動の応答から、FFTとSSI（データ型と共分散型）の運用モード解析で比較した（抄録）。", "p5": "FFTで卓越振動数3.92Hzが得られ、SSIのデータ型・共分散型でも3.92Hzと一致した（抄録）。", "fun": "橋は車が通るたびに少しずつ揺れていて、その揺れには橋の「固有の揺れやすいリズム」が隠れている。3つの異なる計算方法で調べて、どれも同じ3.92Hzという答えになったことで、測定の信頼性を確かめた。橋の健康診断の基本となる測り方の例である。", "unverified": "抄録が途中までしか読めず、減衰比の値は確認できていない。"}}, {"rank": 24, "theme": "会計情報科学", "headline": "ESGは利益調整による株価暴落を和らげるか", "title": "Does Firms' Environmental, Social and Governance ( ESG ) Performance Buffer the Crash‐Risk Consequences of Earnings Management? Evidence From Emerging Markets", "url": "https://doi.org/10.1002/sd.71690", "authors": "Vaibhav Pandey ほか", "venue": "Sustainable Development", "date": "2026-09-29", "sjr": 1.799, "id": "jr24", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "新興国の4,048社年で、ESGの成績が利益調整と将来の株価暴落リスクの結びつきを弱めるかを調べた（抄録）。", "p3": "会計発生高による利益調整と実体的な利益調整の両方を考え、2段階のシステムGMMで推定した（抄録）。", "p5": "ESGの成績が高いほど、発生高による利益調整と株価暴落リスクの正の関連は弱まり、裁量的発生高と業績調整済みの裁量的発生高の両方で見られた（抄録）。実体的な利益調整については一貫した調整効果は見られなかった（抄録）。", "fun": "会社が利益を良く見せかけると、後でばれたとき株価が急落しやすい。環境や社会への取り組みの評価が高い会社では、帳簿上の見せかけによる急落の危険が小さかった。ただ、事業の中身そのものを操作するやり方には効かなかった。見せかけの種類で効き方が違う点が面白い。", "unverified": "抄録が途中までしか読めず、効果の大きさの数値は確認できていない。"}, "citescore": 13.6, "citescore_year": "2025"}, {"rank": 25, "theme": "会計情報科学", "headline": "CSR開示は利益と市場価値で逆の効果", "title": "Divergent Impacts of Voluntary CSR Disclosure on Profitability and Market Value: The Moderating Role of Environmentally Sensitive Industry", "url": "https://doi.org/10.1002/csr.71033", "authors": "Anni Liu ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-09-29", "sjr": 2.147, "id": "jr25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "米国の年次報告書（10-K）の経営者による分析（MD&A）の文章で測った任意のCSR開示が、会計上の収益性（ROA）を高める一方で市場評価（トービンのQ）を下げることを示した（抄録）。", "p3": "ステークホルダー理論に基づき、開示を業務上の関係者は約束のシグナル、投資家は資源の流用や代理人費用のシグナルと解釈する二経路の枠組みを立て、1998〜2023年の10-KのMD&Aの文章で検証した（抄録）。", "p5": "任意のCSR開示はROAと正、トービンのQと負に関連し、業界の環境への敏感さは市場の負の反応を和らげた（抄録）。", "fun": "同じ「社会貢献しています」という開示でも、取引先や従業員は約束と受け取って仕事がうまくいき、投資家は「お金を無駄遣いしている」と受け取って株価が下がる。聞き手によって同じ文章の意味が変わることを、報告書の文章の分析で示した点が面白い。", "unverified": "抄録が途中までしか読めず、効果の大きさと標本数は確認できていない。"}, "citescore": 14.5, "citescore_year": "2025"}, {"rank": 26, "theme": "会計情報科学", "headline": "破産から抜け出せる経営者の特徴", "title": "Cleared for Takeoff: CEO Attributes and the Successful Exit from Corporate Bankruptcy", "url": "https://doi.org/10.1177/10564926261487340", "authors": "Leslie (Les) Doss ほか", "venue": "Journal of Management Inquiry", "date": "2026-09-29", "sjr": 2.292, "id": "jr26", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "企業の破産手続きからうまく抜け出せる企業の最高経営責任者（CEO）の属性を、成功・失敗した企業のCEOや関係者への面接で探索的に特定した（抄録）。", "p3": "破産を抜け出した企業と抜け出せなかった企業のCEO、その他の破産の関係者への面接に基づく探索的な質的研究（抄録）。", "p5": "認知的柔軟性、他業界の経験、広い職業上のネットワーク、人を見る目、説得力、交渉力の6つの属性が、資源と時間の制約のもとで型破りな戦略を立て実行するのを助け、認知的柔軟性を中心とする「組み合わせ」をなしていた（抄録）。", "fun": "倒産しかけた会社を立て直す社長には、どんな力が必要なのか。社長たちへの聞き取りから、頭の切り替えの柔らかさを中心に、人脈や交渉力などがセットで働くことが見えてきた。お金も時間もない中で型破りな手を打つ、という状況の描写が面白い。", "unverified": "本文が入手できず、面接の人数と企業の属性は確認できていない。"}, "citescore": 8.3, "citescore_year": "2025"}, {"rank": 27, "theme": "会計情報科学", "headline": "良質な財務諸表は融資制約を緩め生産性を上げる", "title": "High-quality financial statements, credit constraints, and labor productivity", "url": "https://hal.science/hal-05769488v1", "authors": "Dorgyles C.M. Kouakou", "venue": "HAL (ART) Economics Bulletin", "date": "2026-09-29", "id": "jr27", "explain": {"basis": "題名", "basis_note": "Economics Bulletin（HAL掲載）の抄録・本文を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から言えるのは、質の高い財務諸表が企業の信用制約（借入の難しさ）と労働生産性にどう関係するかを調べた研究だということだけである。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "帳簿をきちんと付けて信頼できる決算書を出す会社は、銀行からお金を借りやすく、その結果として設備などに投資して生産性が上がるのかもしれない。題名からは、会計の質と、借りやすさ、働く人の生産性の三つをつなぐ問いが読み取れる。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}}, {"rank": 28, "theme": "サービス・マーケティング", "headline": "購入後の連絡が返品と次の購買を変える", "title": "EXPRESS: The Role of Post-Purchase Communications on Product Returns and Downstream Consequences in Online Apparel Retail", "url": "https://doi.org/10.1177/10591478261495686", "authors": "Punya Chatterjee ほか", "venue": "Production and Operations Management", "date": "2026-09-29", "sjr": 3.612, "id": "jr28", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "オンライン衣料品販売で、購入後に売り手から送るメッセージ（品質の安心づけ、想定との違いの説明、対処の提案）が返品とその後の行動を減らすかを、3つの実証研究で調べた（抄録）。", "p3": "仮想試着など購入前の対策が中小の売り手には難しいことを踏まえ、低コストの代替として購入後の戦略的なメッセージを検討した（抄録）。", "p5": "消費者が期待と実物の小さなずれを経験するとき、購入後のメッセージが効果を持つと抄録は述べる（詳細の数値は抄録の読めた範囲にない）。", "fun": "ネットで服を買うと、色や手触りが思っていたのと少し違って返品したくなる。買った後に店から「色は画面と少し違って見えることがあります」などと先回りして伝えると、返品が減るかもしれない。お金をかけずにできるサービス回復の工夫として面白い。", "unverified": "抄録が途中までしか読めず、返品率の変化の大きさは確認できていない。"}, "citescore": 11.3, "citescore_year": "2025"}, {"rank": 29, "theme": "サービス・マーケティング", "headline": "身体の痛みが他者への同調を強める", "title": "Beyond Pain: The Impact of Physical Pain on Conformity", "url": "https://doi.org/10.1002/mar.70264", "authors": "Emanuela Stagno ほか", "venue": "Psychology and Marketing", "date": "2026-09-29", "sjr": 3.642, "id": "jr29", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": false, "short": true, "p1": "身体の痛みを感じていると、消費者が多数派の選ぶ選択肢に同調しやすくなることを、予備の現地調査・実験室実験・事前登録のオンライン研究2つで示した（抄録）。", "p3": "痛みの経験が、他者の選好・判断・行動の情報（社会的証明）への依存を強めるかを複数の研究で検証した（抄録）。", "p5": "痛みは多数派が支持する選択肢への同調を高め、多数派の選択肢が客観的に劣る場合でも同調が起きた（抄録）。仕組みの検証は今後の課題とされた（抄録）。", "fun": "頭や体が痛いとき、人は「みんなが選んでいるもの」を選びやすくなるらしい。しかも、みんなの選択が明らかに損な場合でもそうなった。痛みで考える余裕が減ると、周りに合わせるという近道に頼るのかもしれない。体の状態が買い物の判断を変える点が面白い。", "unverified": "本文が入手できず、効果の大きさと参加者数は確認できていない。"}, "citescore": 17.7, "citescore_year": "2025"}, {"rank": 30, "theme": "サービス・マーケティング", "headline": "滞納の免除で水道料金の支払いは増えるか", "title": "Forgive Us Our Sins—Experimental Evidence on Arrears Forgiveness and Bill Payment From Nairobi, Kenya", "url": "https://doi.org/10.1002/pam.70132", "authors": "David Fuente ほか", "venue": "Journal of Policy Analysis and Management", "date": "2026-09-29", "sjr": 1.741, "id": "jr30", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録のみを読んだ", "prep
