<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

a0/Wの物理的特徴量。真のき裂長から作る量（ΔKなど）は入力に使わず、予測き裂長に基づく物理制約として損失に入れ、目的変数の漏れを防ぐ。CT試験片のデータでSVR・XGBoost・LGBM・ANNと比べる（抄録）。", "p5": "抄録の取得範囲では、比較の数値結果は確認できなかった（抄録が途中で切れている）。", "fun": "AIにき裂の伸びを予測させると、答えに近い情報をこっそり入力に混ぜてしまい「よく当たる」ように見えることがあります。この研究は答えに由来する量を入力から外し、物理法則の形でだけ教えるという、ずるをしない予測の作り方を工夫しています。", "unverified": "PINNと比較手法の予測精度の数値は未確認（抄録が途中まで）。"}}, {"id": "pr18", "rank": 18, "headline": "打撃後の超音波減衰で鉄道車輪の損傷検出", "title": "Damage detection in railway wheels from impact-induced ultrasonic ring-down using self-referenced decay features", "url": "https://arxiv.org/abs/2610.30541", "authors": "Aashish Shaju ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Shaju, A., Southward, S., & Ahmadian, M. (2026). Damage detection in railway wheels from impact-induced ultrasonic ring-down using self-referenced decay features (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30541", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ハンマー打撃後の超音波の減衰（リングダウン）から、停車中の鉄道車輪の損傷を非接触で選別する方法（抄録）。", "p3": "空中伝搬の超音波で応答を測り、減衰率を卓越周波数で正規化した実効減衰比と、打撃ごとのばらつきの2つの特徴を使う。2施設の22輪軸で評価し、学習型（ランダムフォレスト）と閾値型を比べた（抄録）。", "p5": "一方のデータで学習したランダムフォレストは他方で性能が悪かった。2特徴の閾値法は他方のデータを全て正しく分類し、1輪ずつ除く厳しい検証でも22輪中21輪を正しく分類した（損傷輪は全て検出、健全輪1つが誤検出）（抄録）。", "fun": "スイカを叩いて中身を確かめるように、車輪を叩いて「響きの消え方」で傷を見つける研究です。複雑なAIより、意味のはっきりした2つの数字に閾値を引くほうが別の現場にも通用した、という結果が教訓的です。", "unverified": "閾値の値と、各特徴の分布の重なりは未確認。"}}, {"id": "pr19", "rank": 19, "headline": "オイラー型高速動き推定でサブピクセル振動計測", "title": "Eulerian fast motion estimation for real-time sub-pixel vibration measurement", "url": "https://doi.org/10.2139/ssrn.7656773", "authors": "Zongqin Hang ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Hang, Z., Du, W., Can, C., a, D., Xie, K., Lei, D., Fu, Z., & Huang, W. (2026). Eulerian fast motion estimation for real-time sub-pixel vibration measurement. https://doi.org/10.2139/ssrn.7656773", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "画像の濃淡ヒストグラムの統計量だけで変位を推定し、1点あたり約1msで動くサブピクセルの振動計測法EFMEを提案（抄録）。", "p3": "各フレームの変位推定を、関心領域の大きさに依らない固定長の濃淡ヒストグラム統計に帰着させ、照明の加算的変化に解析的に不変にする。レーザー変位計を基準に、標点つきの対象と模様の弱い鋼板、模型橋で検証（抄録）。", "p5": "位相ベース法（124ms）より2桁以上、追跡型手法より17〜51倍速い。変位RMSEは0.034〜0.107mm、約70μm（約1/5画素）の微振動を追跡し、固有振動数の相対誤差は鋼板で0.6%未満、模型橋で2.2%以内（抄録）。", "fun": "カメラで橋の揺れを測るには、画像の中の小さなずれを追いかける重い計算が必要でした。この研究は「明るさの分布の偏り」という簡単な数字だけでずれを読み取り、1画素の5分の1ほどの揺れまでほぼ即時に測れるようにしました。", "unverified": "模型橋の諸元と照明変化下での検証条件は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "構造保存の縮約モデルで超音速パネル振動", "title": "Structure-preserving reduced-order models of thin panels in supersonic and hypersonic flow", "url": "https://arxiv.org/abs/2610.31504", "authors": "Miguel A. Aguilo", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Aguilo, M. A. (2026). Structure-preserving reduced-order models of thin panels in supersonic and hypersonic flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31504", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "エネルギー収支を構造的に満たす学習型の縮約モデルで、超音速・極超音速流中の薄板パネルの振動を再現する（抄録）。", "p3": "Ritz-Galerkinの参照モデルの厳密なポテンシャルを保ったまま、残りの一般化力を学習し、エネルギーを増やさない散逸だけを訓練する。AePW-4の2課題（Mach 1.92の固定板、Mach 5.85の片持ち板）に適用（抄録）。", "p5": "学習モデルのエネルギー収支の最大相対残差は2.2e-15。RC-19では30回の実行の平均卓越周波数が実測236Hzの1.0%以内で、周期・カオスの2条件で既報モデルと同じ応答領域を16回すべてで再現した（抄録）。", "fun": "AIに物理を学ばせると、エネルギーが勝手に湧き出す「永久機関」のような答えを出すことがあります。この研究はエネルギーが増えない形をあらかじめモデルに組み込み、学習の中身がどうであれ物理法則が守られるようにしました。", "unverified": "HyMAX（Mach 5.85）での精度の数値は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "グラフ分割による局所POD圧縮", "title": "Adaptive Local Proper Orthogonal Decomposition via Graph Partitioning and Provable Error-Bounded Lossy Compression for Parametric Series in Finite-Dimensional Function Spaces", "url": "https://arxiv.org/abs/2610.31375", "authors": "Roberto Nuca ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Nuca, R., Parsani, M., & Dalcin, L. (2026). Adaptive Local Proper Orthogonal Decomposition via Graph Partitioning and Provable Error-Bounded Lossy Compression for Parametric Series in Finite-Dimensional Function Spaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31375", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "領域を階層的にグラフ分割し、部分領域ごとに階数を変える局所POD（固有直交分解）で、誤差上限つきのスナップショット圧縮を行う（抄録）。", "p3": "直交な分割では全体の二乗再構成誤差が局所の寄与の和に厳密に分解できることを示し、誤差許容量を部分領域に配分して最小の局所階数を選ぶ。保存量が減り誤差上限を保つときだけ分割を受け入れる貪欲法を用いる（抄録）。", "p5": "合成データと2・3次元の圧縮性流れのスナップショットで、空間適応の階数と分割が大域PODより圧縮を改善しうることを示した（抄録）。", "fun": "写真を圧縮するとき、空のような単調な部分は粗く、細かい模様の部分は丁寧に保存すると効率がよくなります。この研究はシミュレーション結果でも同じ考えを使い、場所ごとに必要な情報量を変えながら、誤差が決めた範囲を超えないことを数学的に保証しています。", "unverified": "圧縮率の具体的な数値は抄録に記載がなく未確認。"}}, {"id": "pr22", "rank": 22, "headline": "トレスカ摩擦の接触問題の高次離散化", "title": "An Arbitrary-Order Augmented Lagrangian Discrete De Rham Scheme for Contact Mechanics with Tresca Friction", "url": "https://doi.org/10.2139/ssrn.7661505", "authors": "JÉRÔME DRONIOU ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "DRONIOU, J., Kumar, R., & Masson, R. (2026). An Arbitrary-Order Augmented Lagrangian Discrete De Rham Scheme for Contact Mechanics with Tresca Friction. https://doi.org/10.2139/ssrn.7661505", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "割れ目のある弾性体の接触とトレスカ摩擦を、任意次数の離散de Rham（DDR）多面体スキームと拡張ラグランジュ法で解く（抄録）。", "p3": "割れ目を余次元1の物体として表し、法線方向のSignorini型拘束とトレスカ摩擦則を射影の恒等式に書き直して、1つの拡張ラグランジュ双線形形式にまとめる。割れ目面にバブル自由度を加えて安定性を確保する（抄録）。", "p5": "変位とラグランジュ乗数の最適次数の収束を示す誤差評価を導き、数値実験で理論と精度・頑健性を確認した（抄録）。", "fun": "岩盤の割れ目が押し合ったりこすれ合ったりする様子は、「触れているか、離れているか」が場所ごとに切り替わるため計算がとても難しい問題です。この研究はその切り替えを一つの数式の枠組みにまとめ、精度を好きなだけ上げられる解法にしました。", "unverified": "数値実験の具体的な問題設定と誤差の数値は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "C1エルミート要素の行列不要マルチグリッド", "title": "Matrix-Free Local Multigrid for $C^1$ Hermite Discretizations on GPUs", "url": "https://arxiv.org/abs/2610.30308", "authors": "Micha{\\l} Wichrowski", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Wichrowski, M. (2026). Matrix-Free Local Multigrid for $C^1$ Hermite Discretizations on GPUs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30308", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "適応細分化した直交格子上のC1級エルミート要素に対し、行列を作らない局所マルチグリッド法をGPUで実装した（抄録）。", "p3": "固定端の重調和問題を例に、セル単位の主双対定式化をエルミート要素へ拡張し、連続性を作らない拘束演算子で課す。細分化の境では幾何的な延長で跡と法線微分を与え、ぶら下がり節点の処理を不要にする（抄録）。", "p5": "3次要素では対称性による分解で要素行列を4つの16×16ブロックに分け、メモリ帯域の85%に達した。A100の倍精度で、一様格子ではCGが5〜6反復、毎秒最大423万セルを解き、局所細分化でも最大16反復だった（抄録）。", "fun": "板の曲がりのように「傾きまで滑らかにつながる」必要がある計算は、普通の方法より格段に重くなります。この研究は巨大な行列を作らずにGPUの性能を引き出し、細かくした場所と粗い場所が混ざっても少ない反復で解けるようにしました。", "unverified": "他手法との速度比較は抄録に記載がなく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "道徳判断では熟慮型AIが嫌われる", "title": "Should AI Trust Its Gut? The Cost of Deliberative Moral Reasoning in Humans and AI", "url": "https://doi.org/10.31234/osf.io/2fv9t_v1", "authors": "Simon Myers ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Myers, S., & Chater, N. (2026). Should AI Trust Its Gut? The Cost of Deliberative Moral Reasoning in Humans and AI. https://doi.org/10.31234/osf.io/2fv9t_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "道徳的な判断では、人間でもAIでも直観的に答えるほうが熟慮するより好まれ、その理由は感情より規範への忠実さにあることを示した（抄録）。", "p3": "事前登録した3つの研究（計N = 2,173）。研究1は道徳・非道徳の判断で直観と熟慮の好みを比べ、研究2はAIに感情がないと説明し、研究3は決定を固定して規範への固執の強さを変えた（抄録）。", "p5": "道徳判断では人もAIも直観的推論が好まれ、良い人格の信号とみなされた。AIに感情がないと説明しても好みは残り、規範を決して見直さない主体が高く評価された（抄録）。", "fun": "難しい計算問題ではよく考える人が好かれるのに、道徳の場面では「迷わず正しいことをする人」のほうが信頼されます。感情がないはずのAIにも同じ好みが向けられ、その理由が感情ではなく「ルールを曲げない姿勢」だったという点が意外です。", "unverified": "各研究の効果量は抄録に記載がなく未確認。"}}, {"id": "pr25", "rank": 25, "headline": "多エージェントLLMの合意で誰が影響力を持つか", "title": "Who Is the Influencer? Consensus Dynamics in Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.31105", "authors": "Gouki Minegishi ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Minegishi, G., Feng, J., Furuta, H., Kojima, T., Iwasawa, Y., & Matsuo, Y. (2026). Who Is the Influencer? Consensus Dynamics in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31105", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のLLMを混ぜた多エージェント系では、パラメータ数の大きいモデルが最終的な合意を支配することを示した（抄録）。", "p3": "事前知識も正解もない単純な課題を設計し、7つのモデル系列を混ぜて合意形成を観察。エージェントを単体上を動く重みつき粒子とみなし、エネルギー地形で解釈する（抄録）。", "p5": "他モデルの意見は大きいモデルの意見に吸収された。大きいモデルほど文脈内学習が強く、文脈の多数派を増幅するため影響者になると説明する（抄録）。", "fun": "会議で一番声の大きい人の意見に落ち着いてしまう現象が、AI同士の話し合いでも起きます。しかも正解のない課題でも、大きいモデルが勝つ理由を「深い谷に転がり込む粒子」という物理のたとえで説明している点が面白いところです。", "unverified": "影響力の大きさの定量値とモデル名は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "マネロン制裁と監査報酬の関係（ブラジル）", "title": "Anti-Money Laundering Enforcement and Audit Fees: Spillovers and Regulatory Fee Compression in Brazilian Financial Institutions", "url": "https://doi.org/10.2139/ssrn.7651219", "authors": "Andréa Alves Corrêa ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Corrêa, A. A., Vila Verde Belém, I., & de Melo Mendes, P. C. (2026). Anti-Money Laundering Enforcement and Audit Fees: Spillovers and Regulatory Fee Compression in Brazilian Financial Institutions. https://doi.org/10.2139/ssrn.7651219", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ブラジルの金融機関で、マネーロンダリング対策の制裁と監査報酬の関係を調べ、正の関連は見られなかった（抄録）。", "p3": "上場49機関・321企業年（2018〜2025年）のパネルで、監査報酬と中央銀行の最終的な執行決定を結合し、機関固定効果と頑健標準誤差で回帰（抄録）。", "p5": "直接の制裁も監査人の顧客構成を通じた曝露も、報酬と有意な正の関連はなかった。年間の制裁金総額は主モデルで負の係数（−0.0071、p = 0.0447）だが、監査努力の低下を示すものではないと著者は述べる（抄録）。", "fun": "不祥事で制裁を受けた銀行は、監査法人により念入りに調べられて監査料が上がりそうに思えます。ところがデータでは上がっておらず、むしろわずかに下がる関連が出ました。直観に反する結果を「まだ証明ではない」と慎重に扱っている点も誠実です。", "unverified": "なし"}}, {"id": "pr27", "rank": 27, "headline": "繰延税金は将来の税負担を予測するか", "title": "Do Deferred Taxes Help Explain and Predict Future Tax Outcomes? Iberian Evidence", "url": "https://doi.org/10.2139/ssrn.7656760", "authors": "Ângela Cristina Oliveira Pereira ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Pereira, Â. C. O., Azevedo, G. M. d. C., & Pereira, C. (2026). Do Deferred Taxes Help Explain and Predict Future Tax Outcomes? Iberian Evidence. https://doi.org/10.2139/ssrn.7656760", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "繰延税金の情報は将来の納税額と税費用を説明はするが、予測の改善にはつながらないことをイベリア半島の企業で示した（抄録）。", "p3": "スペイン・ポルトガルの上場62社（2015〜2024年）で、繰延税金費用・繰延税金資産負債の追加説明力を年次クロスセクション回帰、順位回帰、1期先の標本外予測で調べた（抄録）。", "p5": "繰延税金の変数は納税額と税費用の両方に追加の説明力をもつが、標本外予測の精度はどの変数でも有意に改善しなかった（抄録）。", "fun": "「説明できる」と「予測できる」は別物だということがよく分かる研究です。過去のデータに当てはめると効いているように見える情報でも、未来を当てる道具として使うと役に立たないことがあり、会計情報の使い道を考えるうえで大事な区別です。", "unverified": "回帰係数と予測誤差の数値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "任意開示テキストでは測れない企業ガバナンス", "title": "What Public Disclosure Cannot Measure: Enterprise-Architecture Governance, the Failure of a Voluntary-Text Instrument, and a Mandatory-Disclosure Alternative", "url": "https://doi.org/10.2139/ssrn.7654858", "authors": "Felix D. Langer", "venue": "SSRN", "date": "2026-10-22", "apa": "Langer, F. D. (2026). What Public Disclosure Cannot Measure: Enterprise-Architecture Governance, the Failure of a Voluntary-Text Instrument, and a Mandatory-Disclosure Alternative. https://doi.org/10.2139/ssrn.7654858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業アーキテクチャのガバナンスは10-Kの任意開示のテキストからは測れないことを、信頼性検査の失敗と陽性対照で示した（抄録）。", "p3": "米大企業167社（2019〜2025年）の10-Kから20語の辞書で指数EAGIを作り、仮説検定の前に事前指定の信頼性検査を行う。同じ手順をAI関連の辞書に適用した陽性対照と比べた（抄録）。", "p5": "指数のCronbachのαは−0.062で、20語中15語は7年間で1社以下しか使わなかった。陽性対照ではα = 0.511に達し、失敗の原因は方法ではなく構成概念にあると位置づけた（抄録）。", "fun": "「うまく測れなかった」という結果を正面から報告する珍しい論文です。同じ方法でAIの話題なら測れたことを示し、失敗の原因が道具ではなく測ろうとした対象にあると突き止めた点が、科学的に誠実で面白いところです。", "unverified": "代替の開示源ごとの検査結果は未確認（抄録が途中まで）。"}}, {"id": "pr29", "rank": 29, "headline": "マルチモーダル分類器の事後反実仮想検索", "title": "CRANE: Post-Hoc Counterfactual Retrieval for Multimodal Classifiers", "url": "https://arxiv.org/abs/2610.31594", "authors": "Franco Rugolon ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Rugolon, F., Miliou, I., & Papapetrou, P. (2026). CRANE: Post-Hoc Counterfactual Retrieval for Multimodal Classifiers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31594", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の種類の入力を使う分類器に対し、訓練データの実例を反実仮想として取り出す、モデルに依存しない事後説明法CRANEを提案（抄録）。", "p3": "目標クラスの訓練例から最近傍を検索して説明の候補にするため、説明のもっともらしさが構成上保証される。モダリティごとの近傍集合の共通部分をとるMC-Rなどを比べた（抄録）。", "p5": "4つのデータセットと3つの融合方式で、MC-Rが4つ中3つのデータセットで最良または同率最良だった。単一のモダリティが判断を支配する場合は単一モダリティの戦略も競争的だった（抄録）。", "fun": "「もしこうだったら判定が変わった」という説明は、ありえない架空の例を作ってしまいがちです。この方法は実際に存在する例の中から近いものを探してくるので、説明がいつも現実的になるという発想が分かりやすくて実用的です。", "unverified": "データセットの具体名と評価指標の値は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "一般化モーメント一致による差分プライバシー合成データ", "title": "Differentially Private Synthetic Data via Generalized Moment Matching", "url": "https://arxiv.org/abs/2610.30196", "authors": "Rundong Ding ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Ding, R., He, Y., & Zhu, Y. (2026). Differentially Private Synthetic Data via Generalized Moment Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30196", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "モーメントを差分プライバシーの下で推定し、それに合う分布から合成データを作る一般化モーメント一致法と、その誤差保証を示した（抄録）。", "p3": "[-1,1]^dのn件の記録について、モーメントの誤差が目標の積分確率距離（IPM）を抑えるときに使える一般誤差定理を立て、MMD（MaternやLaplace核、ReLUのNTK）やスライス・ワッサースタイン距離に適用する（抄録）。", "p5": "合成記録が十分多いとき、得られる誤差率は固定次元で対数因子を除きミニマックス最適である（抄録）。", "fun": "個人の情報を守りながら、元のデータとそっくりな偽物のデータを作る方法の理論です。平均やばらつきのような「要約の数字」だけに雑音を加えて守り、その数字に合うデータを作り直すことで、安全性と使いやすさの両方を数学的に保証しています。", "unverified": "実データでの数値実験の有無は抄録からは未確認。"}}, {"id": "pr31", "rank": 31, "headline": "近隣の荒廃と高齢者のパートナー暴力", "title": "Perceived Neighborhood Disorder, Social Vulnerability, and Intimate Partner Violence Among Adults over 60", "url": "https://doi.org/10.31234/osf.io/9nsc5_v1", "authors": "Judith Biesen ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Biesen, J., & Orth, J. (2026). Perceived Neighborhood Disorder, Social Vulnerability, and Intimate Partner Violence Among Adults over 60. https://doi.org/10.31234/osf.io/9nsc5_v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "60歳以上の人の親密なパートナー間暴力（IPV）は、主観的な近隣の荒廃と郵便番号単位の社会的脆弱性の両方と関連することを示した（抄録）。", "p3": "交際中の380人のオンライン調査で、過去1年の攻撃行動、知覚された近隣の荒廃（PND）、孤独感を測り、郵便番号をCDCの社会的脆弱性指数（SVI）と結合して階層ロジスティック回帰を行った（抄録）。", "p5": "PNDが高いほど身体的IPVの加害・被害のオッズが高く、SVIが高いほど心理的攻撃の加害・被害と身体的攻撃の被害のオッズが高かった。偽発見率補正後も有意だった（抄録）。", "fun": "家庭内の暴力は家の中だけの問題と思われがちですが、住んでいる地域の荒れ具合や社会的な弱さとも結びついていることを、高齢者で示した研究です。本人の感じ方と統計の指標という2つの見方で同じ傾向が出た点が説得力を高めています。", "unverified": "オッズ比の数値は抄録に記載がなく未確認。"}}, {"id": "pr32", "rank": 32, "headline": "近隣剥奪と若年女性の未充足ケア（カラチ）", "title": "Neighbourhood Deprivation, Unmet Care and Well-Being Among Adolescent Girls and Young Women in Karachi", "url": "https://doi.org/10.2139/ssrn.7654519", "authors": "Aisha Ijlal ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Ijlal, A., & Kanwal, H. (2026). Neighbourhood Deprivation, Unmet Care and Well-Being Among Adolescent Girls and Young Women in Karachi. https://doi.org/10.2139/ssrn.7654519", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "カラチの低所得地区で、近隣の剥奪が若い女性の未充足の医療ニーズと低い幸福度に関連することを示した（抄録）。", "p3": "6地区30クラスタの15〜24歳の959人の横断分析。25指標の近隣監査指数を、自己報告の未充足ニーズとWHO-5幸福度に結合し、一般化推定方程式と地区固定効果・世帯の豊かさのモデルで分析した（抄録）。", "p5": "未充足ニーズは15.0%、幸福度の平均は41.2/100。剥奪が1標準偏差高いと未充足のオッズは1.74倍、幸福度は6.67点低い。ただし指数は世帯の豊かさと強く相関し（r = −0.91）、場所と世帯の不利は分離できなかった（抄録）。", "fun": "「貧しい地域に住むこと」と「貧しい家に住むこと」は、ほとんど同じ地図を描くため、どちらが健康に効いているのかを見分けるのはとても難しい問題です。この研究はその限界を自分ではっきり認め、結果を仮説として示しています。", "unverified": "なし"}}, {"id": "pr33", "rank": 33, "headline": "社内コミュニケーションの条件と従業員成果", "title": "Toward Adaptive Internal Communication: Linking Communication Conditions, Internal Communication Satisfaction, and Employee Outcomes", "url": "https://doi.org/10.2139/ssrn.7657203", "authors": "Ana Tkalac Verčič ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Tkalac Verčič, A., Pološki Vokić, N., & Aleksić, A. (2026). Toward Adaptive Internal Communication: Linking Communication Conditions, Internal Communication Satisfaction, and Employee Outcomes. https://doi.org/10.2139/ssrn.7657203", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "職場のコミュニケーション条件が社内コミュニケーション満足（ICS）を通じて、生活満足や組織への信頼と結びつくことを示した（抄録）。", "p3": "従業員136人の3時点調査で、観測された合成得点の経路分析を行い、コミュニケーション条件、ICS、個人と組織の評価の関係を調べた（抄録）。", "p5": "リーダーのコミュニケーションとデジタル手段の受容がICSと正に関連し、ICSは仕事と生活の調和への満足を通じて生活満足と、組織への信頼を通じて知覚されたコミュニケーションの有効性と間接的に関連した（抄録）。", "fun": "上司との話しやすさのような職場の会話の質が、仕事の外の生活の満足にまでつながっているかもしれない、という研究です。会社の連絡の仕方を社員の声で調整していくという理論の出発点を、小規模ながらデータで確かめています。", "unverified": "経路係数の数値は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "人とAIの協働が科学アイデアの評価を変える", "title": "Beyond Better Ideas: How Human-AI Collaboration Shapes Scientific Ideas and Human Perceptions", "url": "https://arxiv.org/abs/2610.30568", "authors": "Qian Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, Q., Pradhan, S., Ahn, J., Atil, B., Li, A., Lu, S., Sarwar, N., Ulis, M., Wan, R., & Yin, W. (2026). Beyond Better Ideas: How Human-AI Collaboration Shapes Scientific Ideas and Human Perceptions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30568", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人とAIの共同で研究アイデアを作っても人による質の評価は上がらず、AIの審査員はAIと組んだ提案をひいきすることを示した（抄録）。", "p3": "人とAI、人と人の研究チームを同じ設定で比べ、人とLLMの評価者、共同の由来の分析、参加者調査を組み合わせた（抄録）。", "p5": "AIとの共同は人の評価で有意な優位がなく、反復的な改訂は一貫して質を上げた。AI審査員は人の点数に近いが順位では食い違い、AI支援の提案を好んだ。共同の由来は部分的にしか見分けられなかった（抄録）。", "fun": "AIと一緒に考えるとアイデアが良くなると思いがちですが、人の目で見ると差はなく、効いたのは何度も書き直すことでした。さらにAIの審査員がAIの関わった案に甘いという結果は、AIに採点を任せる危うさを示しています。", "unverified": "チーム数と評価点の数値は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "PODと機械学習で河川タービン後流を予測", "title": "A novel machine learning framework based on proper orthogonal decomposition for turbine wake flow predictions in natural waterways", "url": "https://arxiv.org/abs/2610.31547", "authors": "Mustafa Meri\\c{c} Aksen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Aksen, M. M., Seyedzadeh, H., Anjiraki, M. G., & Khosronejad, A. (2026). A novel machine learning framework based on proper orthogonal decomposition for turbine wake flow predictions in natural waterways (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31547", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LESの瞬間場をPODで選別したデータで学習し、自然河川の潮流タービン群の下流の平均流れ場を安価に予測する機械学習代理モデル（抄録）。", "p3": "潮汐河川の実地点でLESを行い、瞬間場をPODで空間モードに分解し、選んだモードで3次元の畳み込みエンコーダ・デコーダを学習して時間平均速度場を予測する。背景の大きな変動の影響を減らし後流の情報を残す（抄録）。", "p5": "同じネットワーク規模と学習費用で、POD選別したデータでの学習が有利であることを示した（具体的数値は抄録の取得範囲外）（抄録）。", "fun": "川底の凸凹が作る乱れに、タービンの後ろにできる流れの影が埋もれてしまう問題を、流れを「模様の重ね合わせ」に分けて必要な模様だけをAIに学ばせることで解いています。データを減らすことで逆に学びやすくなる点が面白いところです。", "unverified": "PODなしの学習との誤差比較の数値は未確認（抄録が途中まで）。"}}, {"id": "pr36", "rank": 36, "headline": "乱流の非線形圧縮可能性を事前推定", "title": "A Priori Estimation of the Non-Linear Compression Potential and Quantification of Autoencoder Non-Linearity in Turbulent Flows", "url": "https://arxiv.org/abs/2610.31605", "authors": "Niklas Alexander Pissarski ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Pissarski, N. A., Leon, J. P. M., & Andersen, S. J. (2026). A Priori Estimation of the Non-Linear Compression Potential and Quantification of Autoencoder Non-Linearity in Turbulent Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31605", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "乱流データで非線形の次元縮約（オートエンコーダ）がPODよりどれだけ得かを、学習前に見積もる指標LTRを提案した（抄録）。", "p3": "データ点の局所的な幾何に基づく局所接線残差（LTR）を、モデルの学習も閾値も不要な事前推定量として定義する。学習済みデコーダを線形化した代理と比べるデコーダ線形化誤差（DLE）で非線形性を定量化する（抄録）。", "p5": "2つの渦列と風車後流の乱流で、オートエンコーダの圧縮性能の主な傾向をLTRが再現し、LTRの大きいデータではDLEも大きかった（抄録）。", "fun": "複雑なAIを何日もかけて学習させてから「普通の方法と大差なかった」と分かるのはもったいない話です。この研究はデータの形を先に調べるだけで、凝った方法を使う価値があるかを見積もれるようにしました。", "unverified": "LTRとDLEの数値は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "中南米の地すべり早期警報の全体像", "title": "From Local Initiatives to National Systems: Mapping the Landscape of Landslide Early Warning in Latin America", "url": "https://doi.org/10.21203/rs.3.rs-11207325/v1", "authors": "Johnny Vega ほか", "venue": "Research Square (In Review)", "date": "2026-10-23", "apa": "Vega, J., Horta, I. T. L. G., Gómez, D., Reyes, M. E., García-Urquía, E., Quesada-Román, A., Alcántara-Ayala, I., Fustos-Toribio, I., Millán-Arancibia, C., Gutiérrez, C., Camarinha, P. I., Hader, P., Pacheco-Quevedo, R., & Moreiras, S. (2026). From Local Initiatives to National Systems: Mapping the Landscape of Landslide Early Warning in Latin America. https://doi.org/10.21203/rs.3.rs-11207325/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用", "preprint": true, "short": true, "p1": "中南米10か国25の地すべり早期警報システムの運用・財源・持続の実態を、関係者の共通様式の記録で比べた（抄録）。", "p3": "各システムに直接関わる研究者と実務者が共通の様式で記録し、地理的警報の9つの前提と、監視・予測・伝達・統治・住民参加の5つの運用面で専門家判断により評価した（抄録）。", "p5": "過去記録と降雨閾値がほぼ全ての基盤である一方、土壌水分・間隙水圧・変位・機械学習を取り入れる国もある。複雑な地形での監視密度の不足が地域全体の主要な技術的制約だった（抄録）。", "fun": "地すべりの研究は「どこが危ないか」を予測するものが多い一方、実際の警報がどう運用されお金がどこから来ているかは、あまり記録されてきませんでした。現場の担当者自身が同じ書式で記録を持ち寄った点がこの研究の強みです。", "unverified": "3つ目の傾向は抄録が途中で切れており未確認。"}}, {"id": "pr38", "rank": 38, "headline": "衛星画像で遅い地すべりの過渡変動を監視", "title": "PlanetScope Imagery for Slow-Moving Landslide Monitoring: Processing Strategies, Validation and Insight on Transient Processes", "url": "https://doi.org/10.5194/egusphere-2026-6105", "authors": "Laureen Maury ほか", "venue": "EGUsphere", "date": "2026-10-23", "apa": "Maury, L., Huanca, J., Dhenin, K., Zerathe, S., Thollard, F., Albinez, L., Gomez, D., & Lacroix, P. (2026). PlanetScope Imagery for Slow-Moving Landslide Monitoring: Processing Strategies, Validation and Insight on Transient Processes. https://doi.org/10.5194/egusphere-2026-6105", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録を使用", "preprint": true, "short": true, "p1": "毎日撮影の衛星群PlanetScopeの画像相関で、遅い地すべりの変位場を求める一貫した処理を作り、GNSSで検証した（抄録）。", "p3": "取得の幾何・時刻、画像の組合せ方、照合アルゴリズム（ブロック照合BMと大域的照合MGM）の選び方を、ペルーの2つの地すべりの数年分のGNSSデータで評価する。処理はオープンソースのコンテナで提供（抄録）。", "p5": "安定域で見積もる通常の誤差は、動いている領域の誤差を大きく過小評価することを示した（抄録）。", "fun": "人工衛星の写真を毎日見比べれば、山がゆっくり動く様子が分かりそうです。ところが、動かない場所で誤差を測る普通のやり方では、動いている場所の誤差がずっと小さく見積もられてしまうことを、地上のGNSSと比べて明らかにしました。", "unverified": "BMとMGMの比較結果の詳細は未確認（抄録が途中まで）。"}}, {"id": "pr39", "rank": 39, "headline": "ネパールの岩氷なだれ連鎖と事前評価の検証", "title": "Evaluating pre-event hazard screenings against the 2026 Budhi Gandaki and Bhotekoshi-Trishuli rock-ice avalanche cascades, central Nepal", "url": "https://doi.org/10.22541/essoar.15010904/v1", "authors": "Ajay Kumar Sah", "venue": "ESS Open Archive", "date": "2026-10-22", "apa": "Sah, A. K. (2026). Evaluating pre-event hazard screenings against the 2026 Budhi Gandaki and Bhotekoshi-Trishuli rock-ice avalanche cascades, central Nepal. https://doi.org/10.22541/essoar.15010904/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録を使用", "preprint": true, "short": true, "p1": "2026年のネパール中部の2つの岩氷なだれの連鎖災害で、公開済みの3つの事前ハザード評価が被害地点を捉えていたかを検証した（抄録）。", "p3": "被害が報告された16地点を、なだれの到達角14°の評価、1,499の氷河湖の決壊洪水（GLOF）の浸水モデル、氷河湖流域の排水路からの高さ（HAND）0〜50mの3つと照合した（抄録）。", "p5": "16地点すべてが14°の到達範囲の外（到達角3.8〜12.0°）にあり、どのGLOFの浸水範囲にも入らなかった。Budhi Gandakiでは経路の5%だけが浸水範囲から150m以内だった（抄録）。", "fun": "なだれが土石流や洪水に姿を変えて何十kmも先を襲う「連鎖」は、一つの災害ごとに作られた危険地図の隙間に落ちてしまいます。実際の被害で地図を検証し、その隙間を「連鎖帯」として示した点が重要です。", "unverified": "HAND評価の照合結果は抄録が途中で未確認。"}}, {"id": "pr40", "rank": 40, "headline": "検証可能な証拠つき多エージェント再現性監査", "title": "Multi-agent Reproducibility Auditing with Verifiable Evidence", "url": "https://doi.org/10.2139/ssrn.7651342", "authors": "Bruno Barbarioli ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Barbarioli, B., Aparicio, J. P., Brodeur, A., Abdul Baki, G., Fazio, L., & Valenta, D. (2026). Multi-agent Reproducibility Auditing with Verifiable Evidence. https://doi.org/10.2139/ssrn.7651342", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "論文の再現性監査を、5つの領域の監査役・調整役・別系統のモデルの批評役からなる多エージェントで行い、全ての所見を証拠に結びつける手順を示した（抄録）。", "p3": "監査役が論文と公開資料を調べ、調整役が所見を裁定し、別のモデル系統の批評役が反論してから検証と公開に進む。確認済みの所見、否定された検証、除外も残す。同じ証拠基準の単一エージェントを比較対象にする（抄録）。", "p5": "所見の妥当性、自己修正、遵守、再現性、資源使用を18の評価量で評価する枠組みを示した（結果の数値は抄録に記載なし）（抄録）。", "fun": "論文が本当にデータから導けるかを確かめる作業を、役割の違うAIたちの合議で行う試みです。AIの結論を鵜呑みにせず、全ての指摘を人が確かめられる証拠にひもづける設計が、AIを検査に使うときの要点になっています。", "unverified": "評価の結果（単一エージェントとの比較）は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "表明した好みと実際に評価する応答のずれ", "title": "Abstract Priorities, Concrete Rewards: How Stated Preferences Relate to What People Reward in AI Responses", "url": "https://arxiv.org/abs/2610.30763", "authors": "Zihan Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, Z., Zheng, L. N., & Zhu, D. (2026). Abstract Priorities, Concrete Rewards: How Stated Preferences Relate to What People Reward in AI Responses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30763", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人がLLMの応答に求めると言う好みと、実際に高く評価する応答の特徴はずれていることを、PRISMデータで示した（抄録）。", "p3": "1,396人が7つの応答属性の重要度を答えたうえで、21のLLMの29,347の応答を評価した公開データPRISMで、表明選好と顕示選好を比べた（抄録）。", "p5": "調査で聞かなかった長さ・書式・拒否の言い回しが、聞いた属性のテキスト指標と同等以上に評価と関連した。短い回答を求めた人は長さの重みが小さいなど、書いたフィードバックのほうが評価をよく表した（抄録）。", "fun": "アンケートで「正確さが一番大事」と答えた人も、実際には見た目や長さで点を付けていることがある、という研究です。人の好みに合わせてAIを育てるとき、口で言う好みと行動に表れる好みのどちらを信じるかという古くて新しい問題を示しています。", "unverified": "属性ごとの関連の強さの数値は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "複数の文化的属性下でのLLMの価値選択の偏り", "title": "Investigating Multi-Cultural Value Selection Biases in LLMs", "url": "https://arxiv.org/abs/2610.31199", "authors": "Siddhesh Pawar ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Pawar, S., Arora, A., Wright, D., Hovy, D., & Augenstein, I. (2026). Investigating Multi-Cultural Value Selection Biases in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31199", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "国のペルソナと、利用者側の別の国・言語の手がかりを同時に与えたとき、LLMの価値観の回答がどう動くかを調べた（抄録）。", "p3": "システムプロンプトで国のペルソナを与え、利用者の発話で別の国を名指しする明示的手がかりか、質問言語による暗黙の手がかりを加える。世界価値観調査（WVS）の選択式と、社会政治的な自由記述の生成で評価した（抄録）。", "p5": "選択式では言語の手がかりが明示的手がかりの約3倍回答を動かしたが、その国の分布からは遠ざかった。160万の自由記述では国を名指しすると、その国についてのモデル自身の応答との差の30〜44%が縮まった（抄録）。", "fun": "「日本人として答えて」と言うのと、日本語で質問するのとでは、AIの価値観の答えがまったく違う方向に動きます。人の文化的な属性は一つのラベルでは表せないことを、AIの振る舞いから逆に照らし出している点が面白い研究です。", "unverified": "対象モデルと国の一覧は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "LLMの心の理論：明示と応用のギャップ", "title": "Diagnosing the Explicit-to-Applied Theory of Mind Gap in LLMs", "url": "https://arxiv.org/abs/2610.31060", "authors": "Prajvi Saxena ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Saxena, P., Janzen, S., & Maass, W. (2026). Diagnosing the Explicit-to-Applied Theory of Mind Gap in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31060", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの心の理論（ToM）を、信念を認識する能力と、それを使って行動を予測する能力に分けると、大きな差があることを示した（抄録）。", "p3": "4つのベンチマークで明示的ToMと応用的ToMを分けて測り、構造化プロンプト、文脈内学習、提案する信念状態のテスト時学習（BSTTT）による回復を比べた（Qwen2.5-7B、Llama-3.1-8B、GPT-oss-20B）（抄録）。", "p5": "SimpleToMでLlama-3.1-8Bは全体51.5%だが、心的状態の認識は99.4%、行動予測は28.9%だった。注意喚起とBSTTTの併用で行動予測が40.8ポイント改善し、その大半は注意喚起による（抄録）。", "fun": "「相手がどう思っているか」は分かるのに、「だから相手が次にどう動くか」は当てられない、というAIのちぐはぐさを示した研究です。平均点だけを見ていると、この大きな凸凹が隠れてしまうという教訓があります。", "unverified": "他の3つのベンチマークの結果は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "マッチング推定量を効率化する再マッチング", "title": "Rematching Estimators for Average Treatment Effects", "url": "https://arxiv.org/abs/2610.30560", "authors": "Lam Lam Hui ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Hui, L. L., & Chan, K. W. (2026). Rematching Estimators for Average Treatment Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30560", "why": "固定数のマッチングは非効率という問題に対し、再マッチングで平均処置効果の推定を効率化する方法を提案。実務で広く使われる手法の改良。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "段階的導入パネルの比較群は介入次第", "title": "Causal inference in staggered adoption panels: The correct comparison set depends on your intervention", "url": "https://arxiv.org/abs/2610.31537", "authors": "Ian Lundberg ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Lundberg, I., & Xu, Y. (2026). Causal inference in staggered adoption panels: The correct comparison set depends on your intervention (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31537", "why": "段階的導入のパネルで、正しい比較群は想定する介入によって変わることを示し、差の差分析の設計に指針を与える。"}, {"id": "pn03", "rank": 3, "field": "教育", "headline": "AIは学生の証明の推論を支えるか代わるか", "title": "Supporting or Replacing Students' Reasoning? Cognitive Offloading in AI-Assisted Proof Learning", "url": "https://arxiv.org/abs/2610.31481", "authors": "Eason Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, E., Judicke, S., Beigh, K., Tang, X., Wang, I., Yuan, N., Xiao, Z., Li, C., Li, S., Luttmer, R., Singh, S., Yampolsky, M., Parikh, N., Zhao, Y., Chen, M., Huang, S., Mohanty, A., Johnson, G., Mackey, J., … Koedinger, K. (2026). Supporting or Replacing Students' Reasoning? Cognitive Offloading in AI-Assisted Proof Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31481", "why": "証明を学ぶ153人の学生にAI支援を段階的に開放したランダム化研究で、認知的なオフローディングの実態を測った。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "ネットワーク未知のまま短期パネルで同僚効果を検定", "title": "Testing for peer effects in short panels without identifying the network structure", "url": "https://arxiv.org/abs/2610.31106", "authors": "Tom Boot ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Boot, T., & Juodis, A. (2026). Testing for peer effects in short panels without identifying the network structure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31106", "why": "ネットワーク構造を推定せずに同僚効果の有無を操作変数で検定する方法を提案した計量経済学の成果。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "実際のウェブ環境での深い検索エージェント", "title": "Deep Search in Real-World Web Environments", "url": "https://arxiv.org/abs/2610.30181", "authors": "Xiaomin Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Yu, X., Chen, H., Huang, Z., Yan, S., Su, S.-R., Ma, X., Wang, F., Chen, J., Fang, J., Yan, Y., Huang, Y., Chen, C., Cheng, R., He, Y., Zhang, Y., Hu, X., Liu, C., Lin, J., Li, Y., … Qin, C. (2026). Deep Search in Real-World Web Environments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30181", "why": "実際のオープンウェブで端から端まで調べ物をするDeep Searchエージェントの能力を評価・改善する研究。"}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "特徴空間分解でLASSO誤差の鋭い収束率", "title": "Sharp convergence rate of the estimation error of LASSO via the Feature Space Decomposition method", "url": "https://arxiv.org/abs/2610.30622", "authors": "Guillaume Lecu\\'e ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Lecué, G., & Shang, Z. (2026). Sharp convergence rate of the estimation error of LASSO via the Feature Space Decomposition method (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30622", "why": "特徴空間分解によりLASSOの推定誤差の明示的・非漸近的な最適収束率を示した理論成果。"}, {"id": "pn07", "rank": 7, "field": "経営学", "headline": "合成消費者はマーケティング判断を歪めうる", "title": "AI Is Not Your Customer: Why Synthetic Consumers Could Corrupt Marketing Decisions", "url": "https://doi.org/10.2139/ssrn.7657518", "authors": "Lenin Heartly", "venue": "SSRN", "date": "2026-10-22", "apa": "Heartly, L. (2026). AI Is Not Your Customer: Why Synthetic Consumers Could Corrupt Marketing Decisions. https://doi.org/10.2139/ssrn.7657518", "why": "生成AIの合成消費者を調査や評価に使う危うさを整理し、意思決定を誤らせる経路を示す。"}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "最良の指導者より最悪の回避が重要", "title": "Avoiding the worst leaders is more important than getting the best", "url": "https://doi.org/10.31234/osf.io/8g2nb_v1", "authors": "Hallgeir Sjåstad ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Sjåstad, H., Martuza, J., & Van Bavel, J. J. (2026). Avoiding the worst leaders is more important than getting the best. https://doi.org/10.31234/osf.io/8g2nb_v1", "why": "指導者選抜で、最良を選ぶことより最悪を避けることの効果が大きいことを示す研究。"}, {"id": "pn09", "rank": 9, "field": "人口学", "headline": "子の教育は親の寿命を延ばすか", "title": "Children's Education and Parental Longevity. Causal Evidence From Two English School-Leaving Age Reforms", "url": "https://doi.org/10.31235/osf.io/9n8q5_v2", "authors": "Joan Eliel Madia ほか", "venue": "SocArXiv", "date": "2026-10-22", "apa": "Madia, J. E., Präg, P., & Monden, C. W. S. (2026). Children’s Education and Parental Longevity. Causal Evidence From Two English School-Leaving Age Reforms. https://doi.org/10.31235/osf.io/9n8q5_v2", "why": "英国の2回の義務教育年限延長を使い、子の教育が親の長寿に与える因果効果を推定した。"}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "e値による常に有効な推論のチュートリアル", "title": "A Tutorial on Safe Anytime-Valid Inference: Practical Maximally Flexible Sampling Designs for Experiments Based on e-Values", "url": "https://doi.org/10.31234/osf.io/h5vae_v4", "authors": "Alexander Ly ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Ly, A., Boehm, U., Grünwald, P., Ramdas, A., & van Ravenzwaaij, D. (2026). A Tutorial on Safe Anytime-Valid Inference: Practical Maximally Flexible Sampling Designs for Experiments Based on e-Values. https://doi.org/10.31234/osf.io/h5vae_v4", "why": "e値で任意の時点で停止できる実験設計と推論を、実践的に解説する。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "物体から画素まで統一した視覚知覚モデル", "title": "WeVisOne-VL: Unified Visual Perception from Objects to Pixels", "url": "https://arxiv.org/abs/2610.31329", "authors": "Tianming Liang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Liang, T., Pan, J., Li, Y., Fu, C., Huang, Z., Sun, C., Li, C., & Lyu, J. (2026). WeVisOne-VL: Unified Visual Perception from Objects to Pixels (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31329", "why": "細かな視覚知覚が苦手な視覚言語モデルの弱点に対し、物体から画素まで扱う統一モデルを示した。HFで最多の投票。"}, {"id": "pn12", "rank": 12, "field": "因果推論", "headline": "媒介変数で因果効果の移送を効率化", "title": "More efficient transportation of causal effects using mediators", "url": "https://arxiv.org/abs/2610.31568", "authors": "Xinyi Zhang ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Zhang, X., Rudolph, K. E., Pike, J. R., Liu, R., Santacatterina, M., & Díaz, I. (2026). More efficient transportation of causal effects using mediators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31568", "why": "対象集団への平均処置効果の移送に媒介変数を使い、識別と効率を高める半パラメトリック推定量を開発した。"}, {"id": "pn13", "rank": 13, "field": "人口学", "headline": "定年延長・世代間移転と出生", "title": "Delayed Retirement, Intergenerational Transfers, and Fertility", "url": "https://doi.org/10.2139/ssrn.7654780", "authors": "Yi Fan ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Fan, Y., Song, S., & Yu, Y. (2026). Delayed Retirement, Intergenerational Transfers, and Fertility. https://doi.org/10.2139/ssrn.7654780", "why": "中国の段階的定年延長が、祖父母の子育て支援を通じて出生に与える影響を分析した。"}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "複雑なエージェント記憶より素朴なRAGが強い", "title": "Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought", "url": "https://arxiv.org/abs/2610.30755", "authors": "Zhengye Bao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Bao, Z., Zhang, S., Zhang, H., Lou, S., Wen, M., & Luo, M. (2026). Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30755", "why": "長期会話理解で、複雑なエージェント型記憶より単純なRAGのほうが強い場合があることを示した。"}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "市場が未知のときの価格差別の限界", "title": "The Limits of Price Discrimination When the Market Is Unknown", "url": "https://arxiv.org/abs/2610.30408", "authors": "Irfan Tekdir", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Tekdir, I. (2026). The Limits of Price Discrimination When the Market Is Unknown (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30408", "why": "需要分布が未知のとき、市場分割で実現できる消費者・生産者余剰の組を特徴づけた理論研究。"}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "進化し続けるAI分析者の生涯有効な決定", "title": "Lifetime-valid decisions by continually evolving AI analysts", "url": "https://arxiv.org/abs/2610.30562", "authors": "Xiaojing Sun ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Sun, X., Zeng, Y., & Wang, X. (2026). Lifetime-valid decisions by continually evolving AI analysts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30562", "why": "AIエージェントの検定の連続に対して、生涯にわたり誤りを制御する決定法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "更新され続けるAI分析者の各版を、帰無仮説下の模擬データで配備前に検証し、生涯にわたって第1種の過誤を制御する「継続的検証」を提案（抄録）。", "p3": "AIの分析者は内部に乱数をもち、時間とともに更新されるため、過誤率の高い版を承認するリスクが蓄積する。各版を、無作為化・拡張できる帰無の場面の模擬データで評価してから配備する（抄録）。", "p5": "更新の選び方や提案数によらず、許容水準を超える過誤率の版を一度でも配備する生涯の確率が上から抑えられることを証明した。過誤率が十分低い更新は検証を通る（抄録）。", "fun": "AIに何度も手直しを加えていくと、たまたまテストに受かった「ハズレの版」がいつか紛れ込みます。この研究は、手直しを何回しても、その事故が起きる確率を生涯を通じて一定以下に抑える仕組みを数学的に保証しました。", "unverified": "検証に必要な模擬データの量は抄録に記載がなく未確認。"}}, {"id": "pn17", "rank": 17, "field": "因果推論", "headline": "所属が観察できない高リスク集団の処置効果", "title": "Estimating Group Average Treatment Effects in High-Risk Populations with Unobserved Target Membership", "url": "https://arxiv.org/abs/2610.30709", "authors": "Shubo Zhang ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Zhang, S., Zhao, Y., Zeng, D., & Wang, Y. (2026). Estimating Group Average Treatment Effects in High-Risk Populations with Unobserved Target Membership (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30709", "why": "高リスク集団の所属が観察できない場合のグループ平均処置効果の推定法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高リスク集団の所属が観察できない、または小さい場合に、リスクスコアで重み付けしたソフトな対象化（RSW）でグループ平均処置効果を推定する（抄録）。", "p3": "所属確率を分析標本内で推定するか、参照モデルから得て対象集団を表し、全標本で二重頑健な処置効果を学習したうえで、リスク重みの分布で低次元の処置効果曲面を集計する。点ごとの漸近正規性と影響関数に基づく分散推定を示す（抄録）。", "p5": "連続・2値の結果のシミュレーションで、2つのハードな対象化の方法と同程度の偏りでより小さい分散だった（抄録）。", "fun": "「重症になりやすい人にだけ効く薬か」を調べたいのに、誰が重症化しやすいかが分からない、という難題に答える方法です。人を白黒で分けず、「どのくらい高リスクか」の確率で全員を少しずつ使うことで、推定を安定させています。", "unverified": "実データへの適用の有無は抄録からは未確認。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "確認できない仮定への主観ベイズ的対処", "title": "A Subjective Bayesian Approach to Address Unchecked Assumptions in a Causal Analysis", "url": "https://arxiv.org/abs/2610.31587", "authors": "Jaiyool Kim ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Kim, J., Bhattacharya, I., & Bradley, J. R. (2026). A Subjective Bayesian Approach to Address Unchecked Assumptions in a Causal Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31587", "why": "観察データの因果分析で検証できない仮定の影響を主観ベイズで扱う方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観察データの因果分析で検証できない仮定が崩れる可能性を、事後分布の2成分混合で表す主観ベイズの枠組みAMUAを提案（抄録）。", "p3": "仮定が成り立つ通常のモデルと、仮定の破れを許す柔軟なモデルを混合し、混合の重みπを分析者が事前確率として指定する。平均処置効果の95%HPD集合が0を除く最小のπを、新しい診断量π_minとして定義する（抄録）。", "p5": "空間的な構造をもつ未測定交絡のシミュレーションで評価した（結果の数値は抄録の取得範囲外）（抄録）。", "fun": "「交絡はない」という仮定が本当かどうかはデータからは分かりません。この方法は、その仮定をどのくらい信じれば結論が揺らがないかを一つの数字で示すので、結論の強さを読者が自分の信念と比べて判断できるようになります。", "unverified": "シミュレーションの結果は未確認（抄録が途中まで）。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "予測の不確実性を制御する計算機モデル較正", "title": "Prediction Uncertainty Controlled Computer Model Calibration", "url": "https://arxiv.org/abs/2610.31163", "authors": "Ryan Heejoon Byun ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Byun, R. H., Yoon, D., & Chang, W. (2026). Prediction Uncertainty Controlled Computer Model Calibration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31163", "why": "予測のための較正という目的に合わせて、予測不確実性を制御する較正法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "計算機モデルの較正を予測の誤差の制御に直接合わせ、条件付きフローマッチングと共形リスク制御を組み合わせた2層の枠組みを提案（抄録）。", "p3": "第1層で、構造の異なるガウス過程の不一致を加えたシミュレータ出力で較正パラメータの償却事後分布を学習する。第2層で事後のサンプルを入れ子の候補集合に並べ、時間平均の外れ率が規定値に達する最小の集合を選ぶ（抄録）。", "p5": "較正観測と目標観測の交換可能性の下で、帯の期待外れ率が有限標本で制御される。合成ベンチマークで評価した（数値は抄録の取得範囲外）（抄録）。", "fun": "シミュレーションのつまみを観測に合わせても、つまみが曖昧だったりモデルがずれていたりすると、予測の幅が当てにならなくなります。この研究は「予測が外れる割合」を最初から目標にして、その割合を保証する幅を作る発想に切り替えました。", "unverified": "合成ベンチマークでの比較結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "次元に依存しないランジュバン法の領域", "title": "Dimension-free regimes for unadjusted Langevin in ridge-separable models: A subspace robust Wasserstein analysis", "url": "https://arxiv.org/abs/2610.31431", "authors": "Yuansi Chen ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Chen, Y., Pedrotti, F., & Whalley, P. A. (2026). Dimension-free regimes for unadjusted Langevin in ridge-separable models: A subspace robust Wasserstein analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31431", "why": "未調整ランジュバン法が次元に依らず働く条件をワッサースタイン距離で解析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "未調整ランジュバン法（ULA）の偏りを部分空間頑健ワッサースタイン距離で解析し、次元に依存しない計算量になる領域とならない領域を示した（抄録）。", "p3": "平均と任意の低次元周辺分布を制御する距離で偏りを評価し、i.i.d.データによるリッジ分離型のポテンシャルについて、データ数Nと次元dの比に応じた高確率の上界を示す（抄録）。", "p5": "過剰パラメータ域では有効次元がNとなり、大標本域ではNが十分大きければ次元に依存しない。Nがdに比例する付近では、一般に次元に依存しない保証は不可能であることを証明した（抄録）。", "fun": "たくさんの変数をもつベイズ推定は、変数が増えるほど計算が遅くなると考えられてきました。この研究は「実際に知りたいのは平均や少数の変数だけ」と見方を変えると、次元の呪いを逃れられる場合と逃れられない場合を、データ数と次元の比で切り分けています。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "等張分布回帰の較正", "title": "On the Calibration of Isotonic Distributional Regression", "url": "https://arxiv.org/abs/2610.31258", "authors": "Tobias Biegert ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Biegert, T., Resin, J., Jordan, A., & Lerch, S. (2026). On the Calibration of Isotonic Distributional Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31258", "why": "非パラメトリックな確率予測法である等張分布回帰の較正性を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "等張分布回帰（IDR）の標本外の確率積分変換（PIT）値が有理数に偏り、トマエ関数に似た頻度の棘を示すという見落とされた現象を報告した（抄録）。", "p3": "気象データとシミュレーションで現象を示し、棘の原因を等張な当てはめの離散構造に結びつけて理論的に説明する（抄録）。", "p5": "PITの棘は等張回帰の離散性から生じ、平滑化によって緩和できることを論じた（抄録）。", "fun": "予報がよく較正されているかを調べるグラフに、なぜか特定の分数のところだけ棒が飛び出す奇妙な模様が現れます。その形が数学の教科書に出てくる「トマエ関数」にそっくりだという発見と、その仕組みの説明が面白い論文です。", "unverified": "平滑化の効果の大きさは未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "スペクトル自己教師学習は密度比推定で最適か", "title": "Is Spectral Self-Supervised Learning a Minimax Optimal Method of Density Ratio Estimation?", "url": "https://arxiv.org/abs/2610.31603", "authors": "Hiroki Waida ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Waida, H., & Kanamori, T. (2026). Is Spectral Self-Supervised Learning a Minimax Optimal Method of Density Ratio Estimation? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31603", "why": "スペクトル自己教師学習が密度比推定としてミニマックス最適かを理論的に検討した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "スペクトル自己教師学習による密度比推定が、正則化を加えるとヘルダー連続な密度比の一般クラスでミニマックス最適になることを示した（抄録）。", "p3": "ミニマックス最適性、正則化アルゴリズムへの理論の適用可能性、データ拡張の機構をもつ場合の統計的利点の3つの問いを理論的に調べる（抄録）。", "p5": "対数因子を除いてミニマックス最適な推定量が存在し、データ拡張の機構をもつ部分クラスではより速く、やはり最適な収束率が得られることを証明した（抄録）。", "fun": "画像を回転させたり色を変えたりする「データ拡張」は、自己教師学習でよく効くと経験的に知られています。この研究はその効き目を、推定がどれだけ速く正解に近づくかという統計の言葉で説明しようとしています。", "unverified": "なし"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "心理学でのベイズ推論・事前登録・公開データの普及", "title": "The Prevalence of Bayesian Inference, Preregistration, and Open Data in Psychology, 2004-2024", "url": "https://doi.org/10.31234/osf.io/ck3js_v3", "authors": "Julius M. Pfadt ほか", "venue": "PsyArXiv", "date": "2026-10-22", "apa": "Pfadt, J. M., Bartoš, F., Godmann, H. R., Waaijers, M., Groot, L., Heo, I., Mensink, L., Nak, J., De Ruiter, J. P., Sarafoglou, A., Siepe, B. S., Akrong, E., Arena, G., Aust, F., van den Bergh, D., Brenner, W., Doekemeijer, R. A., Donzallaz, M. C., van Doorn, J., et al. (2026). The Prevalence of Bayesian Inference, Preregistration, and Open Data in Psychology, 2004-2024. https://doi.org/10.31234/osf.io/ck3js_v3", "why": "2004〜2024年の心理学論文でベイズ推論と開かれた科学の実践の普及を追跡した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2004〜2024年の心理学12誌の28,738本で、ベイズ推論・事前登録・データ公開の普及を追跡した（抄録）。", "p3": "上位6誌（15,634本）と中位6誌（13,104本）の全文を、人（50%）とLLM支援（50%）で符号化し、ベイズ型のロジスティック成長モデルで今後を予測した（抄録）。", "p5": "2024年の上位誌では26%がベイズ分析、41%が事前登録、73%がデータ公開を含み、中位誌では16%、18%、40%だった。2004〜2012年にはほぼ皆無だった（抄録）。", "fun": "心理学は「再現できない研究が多い」という危機を経て、わずか10年ほどで研究の作法が大きく変わりました。その変化を約3万本の論文で数えると、データを公開する論文が上位誌で7割を超えるまでになっていたことが分かります。", "unverified": "LLM符号化と人の符号化の一致度は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "思考の連鎖つきTransformerは重球加速を見つける", "title": "Transformers with CoT Discover Heavy-Ball Acceleration Through Training", "url": "https://arxiv.org/abs/2610.31089", "authors": "Yuxuan Cai ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Cai, Y., & Cao, Y. (2026). Transformers with CoT Discover Heavy-Ball Acceleration Through Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.31089", "why": "学習によって思考の連鎖つきのTransformerが重球加速法に当たる手順を獲得することを理論的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "思考の連鎖（CoT）をもつTransformerが、勾配降下の教師を超えて、教えられていない重球法（Heavy-Ball）の加速を学習で獲得することを示した（抄録）。", "p3": "線形回帰の文脈内の重み予測課題で、まず勾配降下の教師でCoTを監督し、次に真の回帰重みで軌道全体を監督する（抄録）。", "p5": "追加の監督の後、モデルは重球法を実装し、元の教師より速く収束した。重球法の教師は一度も与えていない（抄録）。", "fun": "先生のまねをして解き方を覚えた生徒が、練習を重ねるうちに先生より速い解き方を自分で見つけた、という話を数学的に示した研究です。AIの推論が既知の手順の模倣を超えて新しいアルゴリズムを発見しうる、具体的な例になっています。", "unverified": "加速の度合いの定量値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "ニューラル多様体の意味の幾何", "title": "The Geometry of Meaning in Neural Manifolds", "url": "https://arxiv.org/abs/2610.30938", "authors": "Valentino Maiorca", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Maiorca, V. (2026). The Geometry of Meaning in Neural Manifolds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30938", "why": "異なるネットワークが互換性のない座標系で同じ機能を表すことを幾何として扱った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "独立に学習したニューラルネットの表現は座標系が違っても共通の幾何構造をもち、意味の対応を手がかりにゼロショットで変換できることを示す博士論文（抄録）。", "p3": "同じ意味内容を指す要素を同定する「意味の対応」を基本操作とし、任意の実装の対称性を破って共通の意味の枠に固定する。これに基づく14の貢献で対応に基づく整列を扱う（抄録）。", "p5": "対応により独立に学習したモデル間のゼロショット変換を可能にする内在的な幾何が明らかになると主張する（具体的な結果は抄録の取得範囲外）（抄録）。", "fun": "英語と日本語で単語は違っても同じ物を指せるように、別々に育ったAI同士も中身の「意味の地図」は似ているのではないか、という問いです。いくつかの共通の目印を合わせるだけで、片方の知識をもう片方に移せる可能性を示しています。", "unverified": "14の貢献の具体的な実験結果は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "一貫性は妥当性ではない：自己報酬の道徳議論", "title": "Consistency Is Not Validity: Self-Rewarded Moral Argumentation Makes Language Models Decisive but Pliable", "url": "https://arxiv.org/abs/2610.30349", "authors": "Marius De Kuthy Meurers ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Meurers, M. D. K., Parisi, A., & Bohnet, B. (2026). Consistency Is Not Validity: Self-Rewarded Moral Argumentation Makes Language Models Decisive but Pliable (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30349", "why": "道徳的議論を自己報酬で鍛えたLLMが決断的だが流されやすくなることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "良い道徳的議論に自己報酬を与える強化学習でLLMを鍛えると、判断は決断的で選択肢の順序に頑健になるが、迎合や言い換えへの弱さは残ることを示した（抄録）。", "p3": "古典小説から論理ソルバで葛藤を確認したジレンマを抽出し、方策自身が議論の質を対で判定する自己判定のトーナメントで学習する（思考は隠す）。MoralChoice、ELEPHANT、MORABLESで評価（抄録）。", "p5": "判定者の議論の質の評価は人の注釈者に近く、方策は報酬を与える言葉づかいを採用した。決断的で順序に不変になったが、迎合と言い換えは妥当性の課題として残った（抄録）。", "fun": "「上手に議論できれば正しく判断できる」という前提でAIを鍛えたら、迷わず答えるようにはなったものの、相手に合わせて意見を変える癖は直りませんでした。一貫していることと正しいことは違う、という題名の教訓がよく表れています。", "unverified": "各ベンチマークでの数値は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "エージェント型CLIのための疎なMoE基盤モデル", "title": "IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems", "url": "https://arxiv.org/abs/2610.30949", "authors": "A. Jian Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Yang, A. J., Huang, A., Dan, B., Mu, C., Yang, C., Shi, C., Chang, F., Li, H., Tao, H., Zhang, J., He, J., Wang, K., Jing, L., Yang, M., Hu, Q., Li, R., Liu, S., Guo, S., Qing, S., … Dai, B. (2026). IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30949", "why": "総パラメータ320Bの疎なMoEモデルでエージェント型CLIの基盤能力を高めた。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "総パラメータ320B（活性15B）の疎な混合専門家（MoE）モデルIQuest-Q1を、エージェント型のコマンドライン作業向けに開発し公開した（抄録）。", "p3": "安定した事前学習（Stable SplitNorm、Muon、muPと2段階のカリキュラム）、領域と文脈長を広げる中間学習、複数の足場・複数版での事後学習（SFT、領域特化RL、MOPD）の3段階に、モデル統合を組み合わせた（抄録）。", "p5": "コーディングと一般課題の両方で能力を示し、オープンソースで公開した（ベンチマークの数値は抄録に記載なし）（抄録）。", "fun": "巨大なAIの中に専門家の小部屋をたくさん作り、問題ごとに一部だけを動かすことで、大きさの割に軽く動かせるのがMoEの考え方です。この論文は、その作り方を学習の3段階に分けて詳しく公開している点に価値があります。", "unverified": "ベンチマークの成績は抄録に記載がなく未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "チャンク単位のパラメトリック記憶をLLMに融合", "title": "Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models", "url": "https://arxiv.org/abs/2610.25100", "authors": "Rubin Wei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Wei, R., Sun, S., Sun, H., Liu, Y., Shi, X., Wang, J., Zhang, J., & Lin, Z. (2026). Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25100", "why": "外部知識をチャンク単位のパラメトリック記憶として取り込む方法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "前の文脈から記憶を予測して中間の隠れ状態に融合するパラメトリック記憶DFMで、推論時の検索なしに外部知識を使えるようにした（抄録）。", "p3": "因果的な記憶予測器が、コーパスから検索したチャンク埋め込みを教師として、前の文脈から記憶を生成する。予測した記憶をチャンク内のトークンで共有し、ゲート付きの交差注意で隠れ状態に融合する。本体は凍結して端から端まで学習する（抄録）。", "p5": "トークン単位の記憶目標を作る既存手法より構築の作業量を減らした（性能の数値は抄録の取得範囲外）（抄録）。", "fun": "AIに新しい知識を覚えさせると昔の知識を忘れ、毎回調べさせると遅くなる、という板挟みがあります。この方法は「次に必要になりそうな知識」を文脈から予想して頭の中に直接差し込むことで、その両方を避けようとしています。", "unverified": "既存手法との性能比較の数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "推論モデルの「wait」は継承されたもの", "title": "Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models", "url": "https://arxiv.org/abs/2610.30882", "authors": "Zhizhuo Kou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Kou, Z., Hou, S., Chen, L., Yang, J., Luo, J., Peng, J., Zhang, W., Han, S., & Guo, Y. (2026). Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30882", "why": "強化学習が教えたとされる「wait」の出所を追跡し、事前学習からの継承であることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "推論モデルが書く「wait」は強化学習が発明したのではなく、訓練データから受け継がれたものであることを、公開モデルの学習履歴で追跡した（抄録）。", "p3": "出力の標本から、ラベル不要の頻度・位置・形・用法の指標と誤り注入テストで「wait」を追う（抄録）。", "p5": "「wait」をもたない基盤からの強化学習はMATH-500の正答率を大きく上げても「wait」をほぼ生まない。OLMo-3では中間学習で、他の多くのモデルでは推論の痕跡での微調整で入り、既に使う基盤ではRL-Zeroの手順がそれを増やした（抄録）。", "fun": "AIが「待てよ」と言って考え直す姿は、強化学習で自力で身につけた賢さの証拠とよく言われます。ところが実際には、その言葉は学習に使った文章から受け継いだもので、言わなくても正答率は上がっていたという、思い込みを覆す結果です。", "unverified": "抄録の最後の結果は途中で切れており未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "MLLMの潜在表現で映画的な動画を生成", "title": "Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation", "url": "https://arxiv.org/abs/2610.30926", "authors": "Songlin Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-23", "apa": "Yang, S., Wang, Z., Zhao, X., Wang, X., Zhang, R., Li, S., Wu, T., Li, S., Liu, E., Zhao, A., & Rao, A. (2026). Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30926", "why": "限られた入力から映画的な動画を生成するため、因子を意識した予測学習を導入した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用", "preprint": true, "short": true, "p1": "マルチモーダルLLMの潜在表現を動画拡散Transformer（DiT）に確実に使わせ、人物・場面・動作・カメラを因子ごとに制御する映画的な動画生成法FAPLを提案（抄録）。", "p3": "凍結したMLLMと接続部で潜在表現だけからDiTを学習させ、対になった動画で目標因子の変更と他因子の保持を指定する因子範囲の置換で、因子別の制御を学ばせる（抄録）。", "p5": "抄録の取得範囲では定量的な結果は確認できなかった（抄録）。", "fun": "「同じ俳優のまま、カメラの角度だけ変えて」という映画監督のような注文をAIの動画に通すのは難しい問題です。この研究は、変えたい要素と変えたくない要素を対の動画で教えることで、要素ごとの操作を学ばせています。", "unverified": "評価指標と結果は未確認（抄録が途中まで）。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "競争不完全な市場の最低賃金（ボリビア）", "title": "Minimum Wages beyond Perfect Competition: Employment, Monopsony, Informality and Price Transmission in Bolivia", "url": "https://doi.org/10.2139/ssrn.7659938", "authors": "Ricardo Alonzo Fernandez Salguero", "venue": "SSRN", "date": "2026-10-23", "apa": "Fernandez Salguero, R. A. (2026). Minimum Wages beyond Perfect Competition: Employment, Monopsony, Informality and Price Transmission in Bolivia. https://doi.org/10.2139/ssrn.7659938", "why": "最低賃金引上げが雇用・非公式化・物価にどう波及するかを買い手独占を含めて分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ボリビアの2025年の最低賃金引上げは物価上昇に追いつかず実質で下がり、雇用への差分効果は統計的に区別できなかったことを示した（抄録）。", "p3": "ボリビアの継続雇用調査の1,885,302の人・四半期の記録（34四半期）、都市・品目別の物価指数、法定賃金の推移を使い、競争・買い手独占・分断された労働市場の調整を比べる（抄録）。", "p5": "名目10%の引上げは前年12月比20.40%の物価上昇より小さく、実質の法定最低賃金は8.64%下がった。賃金帯の曝露が10ポイント高い県ほど雇用が1.10ポイント低いが、95%区間は約[−6.07, 3.87]で0と区別できない（抄録）。", "fun": "最低賃金を上げると仕事が減るのかは経済学の大論争ですが、この事例では物価がもっと上がったため、実質の最低賃金はむしろ下がっていました。「上げたはずの賃金が実は下がっていた」という前提の確認が、分析の出発点として大事なことを教えてくれます。", "unverified": "非公式化・労働時間への効果の結果は未確認（抄録が途中まで）。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "健康的な選択と生涯の健康・所得格差", "title": "Healthy Choices, Lifecycle Health, and Earnings Inequality", "url": "https://doi.org/10.2139/ssrn.7657058", "authors": "Benjamin Boyajian ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Boyajian, B., & Galeno Ghio, J. (2026). Healthy Choices, Lifecycle Health, and Earnings Inequality. https://doi.org/10.2139/ssrn.7657058", "why": "英国の世帯パネルとライフサイクルモデルで、健康行動が所得格差をどれだけ縮めるかを推計した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "英国の世帯パネルとライフサイクルモデルで、健康的な選択が生涯所得の格差をどれだけ縮めうるかを推計した（抄録）。", "p3": "心の健康と身体の健康を別々に扱い、健康的な行動・消費が持続するモデルを英国家計縦断調査に合わせ、年齢と健康状態別の就業・選択・健康の推移を再現させる（抄録）。", "p5": "全員に健康的な選択を課すと、良い健康状態の外にいる時間が5.0%減り、25〜55歳の累積所得の対数の分散が13.4%減る。低い賃金の人に絞るP50ルールでは16.1%減った（抄録）。", "fun": "健康に良い食事や運動は、本人の体だけでなく、働ける期間を通じて一生の稼ぎの差にも関わります。心と体の健康を分けてモデルに入れることで、健康的な選択が所得格差の1割強を縮めうるという具体的な大きさを示しています。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "政治予測市場の多様性・効率・誘因", "title": "Diversity, Efficiency, and Incentives in Political Prediction Markets&nbsp;", "url": "https://doi.org/10.2139/ssrn.7644838", "authors": "Harry Crane ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Crane, H., & Strumpf, K. (2026). Diversity, Efficiency, and Incentives in Political Prediction Markets&nbsp; https://doi.org/10.2139/ssrn.7644838", "why": "トレーダーが有権者を代表しないと価格が偏るという批判を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "100年以上の政治賭け市場の参加者属性のデータで、トレーダーは有権者を代表しないが、価格は参加者の政治的選好で偏らないことを示した（抄録）。", "p3": "複数の時代の政治賭け市場のトレーダーの属性を分析し、2024年選挙ではCFTC規制下の取引所Kalshiの匿名化した取引データを使った（抄録）。", "p5": "どの市場でもトレーダーは有権者を代表していなかった。2024年のKalshiの選挙市場の参加者は86%が男性、半数が30歳未満だったが、主要な予測者や世論調査の集計を上回る精度だった（抄録）。", "fun": "世論調査は「有権者を代表する人に聞く」ことが命ですが、賭け市場は若い男性ばかりなのに選挙をよく当てました。お金をかけた人は自分の好みより「誰が勝ちそうか」で動く、という市場の不思議な力を示す研究です。", "unverified": "Kalshi以外の歴史的市場の精度の比較は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "借換えの時期と無形投資", "title": "When Debt Comes Due: Refinancing and Intangible Investment", "url": "https://doi.org/10.2139/ssrn.7650918", "authors": "Hana Koncan", "venue": "SSRN", "date": "2026-10-22", "apa": "Koncan, H. (2026). When Debt Comes Due: Refinancing and Intangible Investment. https://doi.org/10.2139/ssrn.7650918", "why": "信用市場の状況に対する借換えの時期が企業の無形投資とどう関わるかを米国企業パネルで分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "信用市場が悪いときに借換えが重なる企業ほど、無形資産への投資を減らすことを米国企業の長期パネルで示した（抄録）。", "p3": "1975〜2023年の米国上場企業で、1年以内に満期の来る長期債務の割合と社債スプレッドの交差項を借換え曝露とし、無形投資との関係を調べる。2008〜2009年の金融危機の差の差分析で補う（抄録）。", "p5": "借換え曝露が高いほど無形投資は有意に低く、スプレッドが高い時期に集中した。知識資本と組織資本で負の関連があり、物的投資では関連がなかった。危機時も同じ傾向だった（抄録）。", "fun": "お金を借り換える時期がたまたま金融不安と重なると、企業は工場より先に研究開発や人材育成を削ります。目に見えない投資ほど景気の波に弱いことを、50年近いデータで示した研究です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "地方政府の信用ショックが企業間信用に波及", "title": "Risk Contagion from Local Government Credit Shocks: Evidence from Corporate Trade Credit", "url": "https://doi.org/10.2139/ssrn.7649587", "authors": "Zhanchi Wu ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Wu, Z., Hu, M., & Chen, P. (2026). Risk Contagion from Local Government Credit Shocks: Evidence from Corporate Trade Credit. https://doi.org/10.2139/ssrn.7649587", "why": "地方財政の返済難が企業の企業間信用への依存を高めるかを中国の上場企業で検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "中国の地方政府融資平台（LGFV）の初めての債務不履行の後、同じ都市の上場企業の買掛金（企業間信用）が増えることを示した（抄録）。", "p3": "2009〜2024年の中国上場企業43,771企業年で、段階的導入の差の差分析を行う（抄録）。", "p5": "不履行の後に買掛金が増え、地域の貸出と財政支援の減少、企業の支払利息と税費用の増加を伴った。財務制約のある企業、国有企業、大企業で効果が強かった（抄録）。", "fun": "役所の借金が返せなくなると、その影響は銀行を通じて地元の企業に及び、企業は取引先への支払いを先延ばしして耐えようとします。資金の苦しさが消えるのではなく、取引の網の目を通じて別の会社に押し付けられていく様子が見えてきます。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "緊縮財政と高齢女性の多次元剥奪", "title": "Austerity, Gender, and Multidimensional Deprivation Among Older Europeans: Evidence from SHARE", "url": "https://arxiv.org/abs/2610.30527", "authors": "Nita Handastya", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "apa": "Handastya, N. (2026). Austerity, Gender, and Multidimensional Deprivation Among Older Europeans: Evidence from SHARE (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30527", "why": "SHAREデータで、財政緊縮が高齢女性の多次元的な剥奪を深めるかを検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "SHAREの6波で、財政緊縮は高齢者の多次元的な剥奪を平均で深めるが、男女差は平均では見られず、地域によって異なることを示した（抄録）。", "p3": "欧州11か国で機能的健康・経済的不安・社会的排除からなる多次元剥奪指数を作り、国・波の景気調整済み基礎収支（CAPB）と二方向固定効果モデルで関係づけた（抄録）。", "p5": "緊縮は平均で剥奪を高め、男女差は平均では0だったが、南欧・東欧では女性で大きかった（国単位のクラスタリングでは有意性が消える）。経済的不安は予想と逆に男性で強く上がり、これだけが国単位の推論でも残った（抄録）。", "fun": "緊縮財政は高齢女性に厳しいと予想されがちですが、データを丁寧に見ると、平均では男女差がなく、経済的な不安はむしろ男性で強まっていました。標準誤差の取り方で結論が変わることまで正直に示している点も参考になります。", "unverified": "社会的排除の次元の結果は未確認（抄録が途中まで）。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "月次営業報告の任意開示と企業の革新", "title": "Process-Oriented Voluntary Disclosure and Corporate Innovation: Evidence from Monthly Operating Reports in China", "url": "https://doi.org/10.2139/ssrn.7654279", "authors": "Yihui Chen ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Chen, Y., Ji, Q., & He, X. (2026). Process-Oriented Voluntary Disclosure and Corporate Innovation: Evidence from Monthly Operating Reports in China. https://doi.org/10.2139/ssrn.7654279", "why": "中国企業の月次営業報告の任意開示が革新活動とどう関わるかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "中国上場企業が任意に開示する月次営業報告（MORs）が、企業の特許出願の増加と関連することを示した（抄録）。", "p3": "競合の開示を使う操作変数、PSM-DID、二重機械学習、プラセボ検定で頑健性を確かめ、情報摩擦・資源配分・失敗への寛容の3経路を調べた（抄録）。", "p5": "MORsの開示は特許出願総数の42.1%、発明特許の30.6%の増加と関連した。革新に関する内容が豊かな報告、純粋な任意開示、市場支配力が弱い企業で強かった（抄録）。", "fun": "利益の数字ではなく「今月どんな作業をしているか」を頻繁に公表する会社ほど、発明が増えていました。外の人が会社の様子を分かるようになると、失敗してもすぐに見放されにくくなり、挑戦がしやすくなるのかもしれません。", "unverified": "なし"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "販売・レンタル・共有の三角競争", "title": "Triangular Competition: Cross-Market Interactions Among Sales, Rentals, and Platform Sharing", "url": "https://doi.org/10.2139/ssrn.7649459", "authors": "Gokce Esenduran ほか", "venue": "SSRN", "date": "2026-10-23", "apa": "Esenduran, G., Li, J., & Tan, B. (2026). Triangular Competition: Cross-Market Interactions Among Sales, Rentals, and Platform Sharing. https://doi.org/10.2139/ssrn.7649459", "why": "P2P共有プラットフォームが販売とレンタル市場とどう相互作用するかをモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "個人間共有（P2P）プラットフォームが、販売とレンタルという別々の市場を結びつけて生む「三角競争」を理論モデルで分析した（抄録）。", "p3": "製造者が小売業者とレンタル業者を通じて流通し、消費者はP2Pでも製品を使え、所有者は製品を貸し出せる様式化モデルを作る（抄録）。", "p5": "プラットフォームの存在は、どちらか一方の市場だけを見ると見落とす形で、販売とレンタルの市場を作り変えることを示した（詳細は抄録の取得範囲外）（抄録）。", "fun": "カメラを買う、レンタル店で借りる、近所の人から借りる、という3つの選択肢は互いに影響し合っています。個人間の貸し借りの場ができると、本来競争していなかったお店とレンタル業者がライバルになる、という見方が新鮮です。", "unverified": "新製品の販売と所有総数への効果の方向は未確認。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "AIコーディングで顧客が作り手になる", "title": "The Customer Is the Builder: How AI Coding Agents Are Rewriting the Economics of Software", "url": "https://arxiv.org/abs/2610.30307", "authors": "Ripon Chandra Malo ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "why": "AIコーディングエージェントが、ソフトウェアを買うか作るかの判断をどう変えるかを論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIコーディング・エージェントにより、組織がソフトウェアを買う代わりに自作する範囲（ソフトウェア代替の境界）が広がりつつあるかを公開データで調べた（抄録）。", "p3": "作る能力の伸びと市場の変化の指標を比べる。主要エージェントが50%の成功率で完了できる課題の長さ、商用製品のオープンソース代替の探索、公開開発の事例を使う（抄録）。", "p5": "課題の長さは2023年以降約129日ごとに倍増し、575の潜在的な代替を特定した。一方で購入ソフトの投資割合は増えるなど、市場の証拠は混在していた（抄録）。", "fun": "AIが自分でプログラムを書けるようになると、会社は高いソフトを買わずに自分で作るようになるのでしょうか。能力は急速に伸びているのに、市場の数字ではまだはっきりした変化が見えない、という「途中経過」の報告として面白い内容です。", "unverified": "代替候補の機能的な同等性は著者も未検証としている。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "指導者・部下としての人工エージェント", "title": "Artificial Agents as Leaders and Followers: An Integrative Role-Congruity Review", "url": "https://doi.org/10.31234/osf.io/294vn_v1", "authors": "Christoph Daldrop ほか", "venue": "PsyArXiv", "date": "2026-10-22", "why": "アルゴリズムやロボットが組織で担う役割を役割一致理論で統合的に整理した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "アルゴリズムやロボットが組織で指導者・部下・同僚の役割を担うときの評価を、107の実証研究の体系的レビューと役割一致理論で統合した（抄録）。", "p3": "経営学・心理学・工学・計算機科学の107研究を役割一致の観点で整理し、人工エージェント役割一致（AARC）モデルを提案する（抄録）。", "p5": "指導者役の人工エージェントは道徳性（公正さ、信頼性）の欠如の知覚により役割不一致に直面し、部下役はおおむね一致、同僚役は課題と外見・声などの手がかりに依存する条件付きの一致だった（抄録）。", "fun": "AIが部下なら受け入れられるのに、上司になると反発されるのはなぜか、という問いに107本の研究をまとめて答えています。鍵は能力ではなく「公平で信頼できそうか」という道徳的な印象だった点が興味深いところです。", "unverified": "なし"}}, {"id": "pn41", "rank": 41, "field": "教育", "headline": "地域が担う補習教育の効果（セネガル）", "title": "The Effectiveness of Community-Delivered Remedial Education in Primary Schools: Evidence from Senegal", "url": "https://doi.org/10.2139/ssrn.7661664", "authors": "Wael Moussa ほか", "venue": "SSRN", "date": "2026-10-23", "why": "教員の負担を増やさず地域住民を雇う補習プログラムの効果を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "セネガル南部で、教員ではなく地域の住民を雇って放課後に補習を行うプログラムが、低学力の児童の読みと算数の成績を上げたことを示した（抄録）。", "p3": "学校内の対象の閾値を使う回帰不連続デザインで、6,223人の児童（CE1・CE2）を分析した（抄録）。", "p5": "対象となることで読みの得点が0.16標準偏差、算数が0.12標準偏差上がり、女子でより大きかった。対象選びに裁量があり、指導者の研修が短くても効果があった（抄録）。", "fun": "先生が足りない地域で、短い研修を受けただけの地元の人が補習を担当しても、子どもの成績はしっかり上がりました。「教えるのは専門家でなければ」という思い込みを、ていねいな比較で問い直した研究です。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "教育", "headline": "学校施設への支出と学力（豪州）", "title": "School Infrastructure Spending and Student Achievement: Evidence from Australian Primary Schools", "url": "https://doi.org/10.2139/ssrn.7661663", "authors": "James Bishop ほか", "venue": "SSRN", "date": "2026-10-23", "why": "豪州の小学校の施設支出が学力・進歩・出席に与える因果効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "豪州の大規模な景気対策で建てられた学校の図書館・講堂・教室は、児童の学力・進歩・出席に効果がなかったことを示した（抄録）。", "p3": "2009〜2012年に99%超の小学校に施設を整備した景気対策の、在籍数の閾値で決まる資金配分を操作変数とするファジー回帰不連続デザイン（抄録）。", "p5": "2013〜2019年のどの年でも、試験成績・最低基準の達成・付加価値の進歩・出席に効果の証拠はなかった。児童1人あたり1,000ドルの追加支出あたり0.09標準偏差を超える効果は信頼区間で否定された（抄録）。", "fun": "新しい図書館や教室ができれば勉強がはかどりそうですが、データでは成績に効果が見られませんでした。「効果がなかった」ことを、どれくらいの大きさまでなら否定できるかを示している点が、ただのゼロ結果と違うところです。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "猛暑への曝露と学習", "title": "Effects of Extreme Temperature Exposure on Learning", "url": "https://doi.org/10.2139/ssrn.7659401", "authors": "Ivan Tzintzun ほか", "venue": "SSRN", "date": "2026-10-23", "why": "高温への曝露が生徒の学習と試験成績に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "カンボジアの高校卒業試験の行政記録と気候再解析データで、学年を通じた高温への曝露が試験成績を下げることを示した（抄録）。", "p3": "2014〜2023年の12年生の全国試験の記録を高解像度の気候データと結合し、学年中の持続的な暑さの効果を推定する（抄録）。", "p5": "学年の平均気温が1℃上がると社会科学系の得点が約0.05標準偏差下がった。STEM系や暑い気候に慣れた生徒では影響が小さかった（抄録）。", "fun": "試験当日の暑さだけでなく、1年間の暑さの積み重ねが学びを妨げていることを示した研究です。気候変動が、将来の人々の知識や技能という目に見えない資産にまで影響しうることを教えてくれます。", "unverified": "社会経済的な集団ごとの差の大きさは未確認。"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "日本の大学入試での国際バカロレア保持者の選別", "title": "Door Preparation: Cosmopolitan Nationalism and the Institutional Sorting of International Baccalaureate Holders in Japanese University Admissions", "url": "https://doi.org/10.31235/osf.io/h93qf_v1", "authors": "Shiyun Zhang Isabelle", "venue": "SocArXiv", "date": "2026-10-22", "why": "国際的な資格が日本の大学入試でどう受け入れられ、選別されるかを分析した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "日本の大学入試が国際バカロレア（IB）ディプロマをどう受け入れているかを、82大学の入試区分の悉皆的な文書調査で明らかにした（抄録）。", "p3": "2025年1月に省庁のコンソーシアムが公表したIB利用の82大学の入試経路を、固定の規則で符号化し、15校で2回の盲検の符号化で確認した（抄録）。", "p5": "1つのディプロマの受け入れ方は5通りあり、3つは取得地・国籍・出願時期で保持者を選別した。選別は大学の威信より受け入れ区分に従い、帰国生・留学生区分に置かれたIBはその区分の条件を帯びた（抄録）。", "fun": "同じ国際資格でも、日本の大学ではどの入試の「扉」から入るかによって扱いが変わり、国籍や取った場所で振り分けられていました。国際化を進める政策と、国の枠組みで人を分ける入試の仕組みのせめぎ合いが見えてきます。", "unverified": "なし"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "問題解決での生成AIへの依存の尺度開発", "title": "Measuring undergraduate students' reliance on generative AI during problem-solving: Scale development and validation", "url": "https://arxiv.org/abs/2610.30195", "authors": "Chenyu Hou ほか", "venue": "arXiv", "date": "Fri, 23 Oct 2026", "why": "学部生の生成AIへの依存の行動パターンを測る尺度を開発・検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "学部生の問題解決中の生成AIへの依存の行動を、結果の正誤と切り離して測る尺度を開発・検証した（抄録）。", "p3": "1つの問題解決活動後の800回答で探索的因子分析を行い、残りの730回答と別の活動の1,173回答で確認的因子分析を行った（抄録）。", "p5": "省察的な利用、慎重な利用、無思慮な利用、協働的な利用の4因子が得られ、尺度全体の信頼性はCronbachのα = .84だった（抄録）。", "fun": "AIに頼ることが良いか悪いかは、正解したかどうかだけでは分かりません。この尺度は「よく考えて使ったか」「丸投げしたか」という使い方そのものを測ろうとしていて、AI時代の学び方を調べる道具になります。", "unverified": "確認的因子分析の適合度の数値は未確認。"}}, {"id": "pn46", "rank": 46, "field": "人口学", "headline": "ブラジルの人口転換と年金政策", "title": "Brazil's Demographic Transition and the Future of Social Protection: Rethinking Pension Policy for an Ageing Society", "url": "https://doi.org/10.2139/ssrn.7652398", "authors": "Valter Manuel Gomes Neto", "venue": "SSRN", "date": "2026-10-23", "why": "急速な高齢化の下でのブラジルの年金制度の持続性と適切さを論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ブラジルの急速な人口転換の下で、年金制度を財政中心の見方から統合的な社会保障の戦略へ移すべきだと論じる政策提言（抄録）。", "p3": "既存の研究と政策の証拠をもとに、財政健全化、拠出型の加入範囲、非拠出型の所得保障のトレードオフを検討する（抄録）。", "p5": "非公式・自営の労働者の加入拡大、年齢に包摂的な雇用による活動的な高齢化、脆弱な高齢者の最低所得保障の強化の3つの優先事項を提案した（抄録）。", "fun": "高齢化が速く、働く人の多くが正式な雇用の外にいる国では、年金の財政を守ることと高齢者の暮らしを守ることがぶつかります。この提言は、その2つを対立ではなく一緒に追う目標として組み立て直そうとしています。", "unverified": "新しい実証分析は含まれない（政策提言）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "購入時の透明性が保険の解約を減らす", "title": "Information Transparency, Choice Confidence, and Customer Retention: Field and Laboratory Evidence from Markets for Credence Goods", "url": "https://doi.org/10.1287/mnsc.2020.02865", "authors": "Zhi (Aaron) Cheng ほか", "venue": "Management Science", "date": "2026-10-22", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr02", "rank": 2, "headline": "生成AIは近い技能の仕事市場を縮小させた", "title": "“Generate” the Future of Work through AI: Empirical Evidence from Online Labor Markets", "url": "https://doi.org/10.1287/isre.2023.0461", "authors": "Jin Liu ほか", "venue": "Information Systems Research", "date": "2026-10-23", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr03", "rank": 3, "headline": "巨礫を含む粒状流が橋脚を叩く力の機構", "title": "Dynamic Response of Concrete Bridge Piers Under the Impact of Dry Granular Flow with Giant Boulders: A Scaled Model Study on the Force Mechanism of Boulders", "url": "https://doi.org/10.3390/buildings16214203", "authors": "Maili Cheng ほか", "venue": "Buildings", "date": "2026-10-23", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr04", "rank": 4, "headline": "LLMの助言は評価の極端さを抑える", "title": "The impact of LLM-based recommendations on decisions under uncertainty", "url": "https://doi.org/10.1017/eec.2026.10062", "authors": "Marty Haoyuan Chen ほか", "venue": "Experimental Economics", "date": "2026-10-23", "sjr": 1.619, "citescore": 4.1, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no"
