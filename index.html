ctures from Vibration Signatures. Infrastructures, 11(12), 440. https://doi.org/10.3390/infrastructures11120440", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "形のよく似た2つのPC道路橋を、大型車の通過時の常時加速度から作った特徴量だけで見分ける「構造物の指紋認証」を調べた。ウェーブレット系と周波数系の特徴はどちらも釣り合い正解率0.975で差を確認できず、両方を合わせると0.989になった（抄録）。", "p2": "監視データが、帰属するとされる構造物から本当に来ているかを自動で確かめることは、長期のセンサ網、ドライブバイや群衆参加型の計測に役立ち、構造物の中の変化を追う第一歩にもなる（抄録）。ウェーブレットにもとづく特徴が、周波数領域の特徴に上積みをもたらすかを問う。", "p3": "約20年離れて建設された形状の似た2橋で、9日間の大型車1705回の通過時の常時加速度を使う。コーシー・ポール・ウェーブレットの連続ウェーブレット変換から、周波数ごとのエネルギーの指標を帯域内のピークと分布の形で記述した24特徴と、係数の絶対値の尖度・歪度による12特徴を作り、時間領域・包絡線・FFTの特徴と合わせて67特徴とした（抄録）。", "p4": "ロジスティック回帰、RBF-SVM、ランダムフォレストを、1日分を丸ごと試験に回す交差検証で評価し、試験日は常に未見とした。夜間・昼間・暴風の期間でも確かめ、学習に使っていない後の時期（8月、B橋のみ）の3364事象でも検証した（抄録）。", "p5": "最良の釣り合い正解率は両系統とも0.975で、組合せが最も強く0.989だった。選ぶ特徴の数をそろえると、ごく少数では周波数特徴が良く、10個では差がはっきりせず、組合せで約2ポイント上がる。後の時期の事象は94〜98%が正しく割り当てられた。モーメント特徴だけでは0.74〜0.78と弱い（いずれも抄録）。", "p6": "著者は識別の手がかりを高い周波数の共振の位置と帯域エネルギーの形に結びつけるが、経年変化によるものとはしていない（抄録）。本文を入手できず、センサの配置、特徴選択の手順、通過事象の切り出し方は確認できない。解釈：2橋の間の識別であり、橋の数が増えた場合の難しさは分からない。", "fun": "スマートフォンが指紋で持ち主を見分けるように、橋も揺れ方で見分けられるかを試した研究である。形がそっくりで建設時期が約20年違う2つの橋について、大型車が通ったときの揺れ1705回分を機械学習にかけると、釣り合い正解率0.989でどちらの橋かを当てられた。手の込んだウェーブレットの特徴と昔ながらの周波数の特徴には、はっきりした差が出なかったことも、著者は隠さず報告している。", "unverified": "本文、センサ配置、特徴量の定義の詳細、特徴選択の方法、分類器の設定は確認できなかった（抄録のみ）。"}}, {"id": "jr02", "rank": 2, "headline": "自動微分のヤコビアンで逆解析の同定可能性を診断", "title": "Jacobian-Based Local Identifiability and Sensitivity Analysis of Jointed Plate Systems", "url": "https://doi.org/10.1061/jenmdt.emeng-9081", "authors": "Jaime Hernandez", "venue": "Journal of Engineering Mechanics", "date": "2026-11-26", "sjr": 0.765, "citescore": 6.3, "citescore_year": "2025", "apa": "Hernandez, J. (2027). Jacobian-Based Local Identifiability and Sensitivity Analysis of Jointed Plate Systems. Journal of Engineering Mechanics, 153(2). https://doi.org/10.1061/jenmdt.emeng-9081", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "目地でつながった板のパラメータ逆解析について、自動微分で得たヤコビアンの特異値分解から、どのパラメータが局所的に識別できるかを調べた。弾性係数と板厚が支配する数値的な零方向があり、目地の回転剛性はせん断剛性に比べて拘束が弱い（抄録）。", "p2": "逆解析は計測した構造応答からモデルのパラメータを推定するのに広く使われるが、順モデルの正確なヤコビアンを得にくいため、識別可能性を厳密に評価しないまま行われることが多い（抄録）。どのパラメータの組が観測から決まり、どれが決まらないかを診断できるかを問う。", "p3": "微分可能な有限帯板法（FSM–DP）を作り、自動微分で勾配とヤコビアンを計算する。これにより、有限差分のヤコビアンにつきまとう摂動幅への依存を避ける。得られたヤコビアンを特異値分解し、剛性・幾何・目地のパラメータについて、局所的な識別可能性、感度、条件の良さ、パラメータ間のトレードオフを評価する（抄録）。", "p4": "まず有限帯板法の定式化を検証し、そのうえでヤコビアンを解析した。観測をたわみ速度から直接のたわみに替えた場合を比べ、勾配にもとづく逆解析で所見を確かめ、有限差分のヤコビアンとも比べた（抄録）。検証に使った参照解や実測の有無は抄録からは分からない。", "p5": "弾性係数Eと板厚hが支配する零方向が見つかり、曲げ剛性がEとhの3乗の積に比例するという力学的な不変性と整合する。観測をたわみに替えても数値的な階数とこの零方向は変わらず、条件の良さと相対的な感度が変わる。有限差分では、ヤコビアン全体の食い違いが小さくても、摂動幅の選び方が特異値の並びと階数の判定に影響しうる（いずれも抄録）。", "p6": "解釈：ヤコビアンにもとづく解析は基準点のまわりの局所的な性質を示すもので、離れた点や大域的な一意性は保証しない。本文を入手できず、板と目地のモデル、観測点の配置、雑音の扱い、実測データへの適用の有無は確認できない。", "fun": "板の曲がりにくさは、材料の硬さEと厚さhの3乗の掛け算で決まる。だから板のたわみを測っても、「材料が硬くて薄い板」と「材料が柔らかくて厚い板」を区別できないことがある。この研究は、計算プログラムをまるごと微分できるように作り、どのパラメータの組合せが測定から決まらないかを洗い出した。実際に、Eとhが互いに入れ替えのきく方向として現れた。", "unverified": "本文、数式、数値例の条件、特異値の値、実測データへの適用は確認できなかった（抄録のみ）。"}}, {"id": "jr03", "rank": 3, "headline": "映像から橋の交通荷重を時空間で復元する研究の総説", "title": "A Review of Vision‐Based Spatiotemporal Traffic Load Reconstruction for Bridge Health Monitoring", "url": "https://doi.org/10.1155/stc/3199394", "authors": "Danhui Dan ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-26", "sjr": 1.147, "citescore": 10.3, "citescore_year": "2025", "apa": "Dan, D., Hu, J., Ge, L., Luleci, F., Catbas, F. N., & Xia, Y. (2026). A Review of Vision‐Based Spatiotemporal Traffic Load Reconstruction for Bridge Health Monitoring. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/3199394", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "橋梁ヘルスモニタリングのために、カメラ映像から交通荷重の時空間分布を復元するコンピュータビジョンの手法を体系的に整理し、車両検出から荷重の割り付けまでの工程を一続きで論じた総説である（抄録）。", "p2": "交通荷重の正確な定量化は信頼できる橋梁監視の前提だが、従来の監視は出力のみで行われ、稼働時の荷重を未知とするか、WIMの疎で離散的なデータに頼ってきた。この不完全さが構造解析に認識論的な不確かさを持ち込む（抄録）。映像でこの穴を埋められるかを問う。", "p3": "総説であり、車両検出、カメラ間の軌跡の接続、重量の推定、荷重の割り付けという工程に沿って既存手法を整理する（抄録）。文献の選定基準、対象期間、件数は抄録に記載がない。", "p4": "既存手法の有効性を、構造工学が求める厳しい精度の要件に照らして批判的に評価し、多モーダル融合の現行の戦略にあるボトルネックを特定する（抄録）。評価に使った定量的な基準や比較表の有無は抄録からは分からない。", "p5": "映像由来の荷重データを入力・出力型の橋梁監視の枠組みに組み込むための見取り図を示す。映像による計測で荷重監視の輪を閉じることが、高忠実なデジタルツインと予防的な維持管理への重要な一歩だと結論する（抄録）。個々の手法の精度の数値は抄録にない。", "p6": "本文を入手できず、どの手法がどの精度に達しているか、重量推定の誤差がどの程度かは確認できない。解釈：映像から位置や車種は得やすいが、重量の推定は他の情報との融合に頼る部分が大きく、抄録がボトルネックとして挙げる融合の部分が実用上の要になると考えられる。", "fun": "橋の健康診断では、橋がどう揺れたかは測れても、そのときどんな重さの車がどこを走っていたかは分からないことが多い。答えだけ見て問題文を知らないまま解析しているようなものだ。この総説は、カメラの映像から車を見つけ、複数のカメラで追いかけ、重さを推定して橋の上の荷重の分布に直すまでの技術をまとめている。入力が分かれば、橋の状態の推定はそれだけ確かになる。", "unverified": "本文、取り上げた文献の範囲と件数、各手法の精度、著者の示す見取り図の中身は確認できなかった（抄録のみ）。"}}, {"id": "jr04", "rank": 4, "headline": "少数のモードから信号柱のボルト緩みと腐食を推定", "title": "Physics-Guided Machine Learning Framework for Damage Assessment of Traffic Signal Structure Populations", "url": "https://doi.org/10.1061/jsendh.steng-16294", "authors": "Mahta Zakaria ほか", "venue": "Journal of Structural Engineering", "date": "2026-11-26", "sjr": 1.206, "citescore": 7.5, "citescore_year": "2025", "apa": "Zakaria, M., Alqurashi, I., Nomura, Y., & Catbas, N. (2027). Physics-Guided Machine Learning Framework for Damage Assessment of Traffic Signal Structure Populations. Journal of Structural Engineering, 153(2). https://doi.org/10.1061/jsendh.steng-16294", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "信号機を支える片持ちの腕（マストアーム）について、腐食とボルトの緩みによる領域ごとの剛性低下を、低次のモード情報だけから推定する物理誘導型の機械学習の枠組みを提案した。基部と腕の中間の接合部では決定係数が0.9を超えた（抄録）。", "p2": "信号柱などの付属構造物は都市と道路のインフラの重要な要素だが、点検は頻度が低く、目視には限界がある（抄録）。振動から得られる少数の特徴で、どの部位の剛性がどれだけ落ちたかを推定できるかを問う。", "p3": "学習は教師あり回帰で、支配方程式の残差を損失に入れる方式ではない。物理は、有限要素モデルが作るラベルと、無次元のモード特徴量を通じて取り込む。実験のモードデータで検証した有限要素モデルから、21年の供用期間の劣化を表す確率的なモデル群を作り、固有振動数と、曲げとねじりのモードの相対的なずれを表す無次元の比を入力とした（抄録）。", "p4": "9,500件の模擬の劣化ケースで、損傷の位置特定、計測雑音の下での頑健性、経験的な予測区間を評価した（抄録）。評価は有限要素モデルによる模擬データで行われている。", "p5": "単純なニューラルネットで基部と腕の中間の接合部の剛性低下を精度よく予測でき、腕の分布的で非線形な劣化を捉えるにはより深いネットワークが必要だった。低次のモードだけで位置を特定できるので、センサ1個や映像による現場計測と両立すると著者は述べる（抄録）。", "p6": "実測の振動データによる現場での検証は今後の課題と著者自身が認めている（抄録）。本文を入手できず、有限要素モデルの検証の程度、雑音の水準、予測区間の作り方は確認できない。解釈：ラベルも入力も同じ有限要素モデルから作るため、モデル化誤差への頑健性は別に確かめる必要がある。", "fun": "交差点の信号機を支える腕は、根元のボルトが緩んだり錆びたりしても、見た目では分かりにくい。この研究は、腕の揺れの音程にあたる固有振動数を使う。曲げの揺れとねじりの揺れの音程の比は、どこが弱ったかによって変わり方が違うので、その比から弱った場所と程度を言い当てる仕組みを、9,500通りの模擬ケースで学習させた。実物の計測での確認はこれからである。", "unverified": "本文、有限要素モデルと実験の照合結果、特徴量の定義、ネットワークの構成、雑音の条件は確認できなかった（抄録のみ）。"}}, {"id": "jr05", "rank": 5, "headline": "XBRL義務化でSECの開示審査が増え質も上がる", "title": "XBRL adoption and SEC monitoring", "url": "https://doi.org/10.1007/s11142-026-10003-2", "authors": "Minjae Koo ほか", "venue": "Review of Accounting Studies", "date": "2026-11-26", "sjr": 5.56, "citescore": 10.7, "citescore_year": "2025", "apa": "Koo, M., Zhang, Y., Zhao, M., & Zhao, Y. (2026). XBRL adoption and SEC monitoring. Review of Accounting Studies. https://doi.org/10.1007/s11142-026-10003-2", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社のHTML本文のうち、§3冒頭・§4.1・§4.2・§5.1.1・§5.1.4冒頭・§5.2冒頭・§5.3冒頭・§5.5・§6を読んだ。", "preprint": false, "p1": "XBRLの義務化で開示の処理コストが下がると、米国証券取引委員会（SEC）による開示の監視が強まることを示した。義務化後、10-Kへのコメントレターが出る確率は4.0ポイント上がり、質も上がった（抄録、§5.1.1）。", "p2": "情報処理のコストは開示のあらゆる利用者の妨げになるが、それがSEC自身の監視にどう影響するかを調べた研究は限られる（§6）。機械可読な報告が当局の審査を変えるかを問い、経路として、データ抽出の自動化、標準化による同業比較、複雑な報告事項の精査の3つを考える（§3）。", "p3": "XBRLの義務化は2009〜2011年に企業規模に応じて3段階で導入された。この時期のずれを使い、2007〜2011年度の10-Kについて、企業と年の固定効果を入れた差の差分析を行う（§4.1）。標本は、コメントレターの発行の分析が15,802企業年、質の分析が5,047企業年である（§4.2）。", "p4": "並行トレンドの検定、XBRLの対象外である定性的開示や取引関連の書類での反証テスト、導入の閾値の前後各100社の回帰不連続、積み上げ型の差の差で確かめた（§5.5、表8）。義務化への対応の不備の指摘が増えただけという説明は、5,047通のうちXBRLの順守に触れたものが1通だけだったことで退けている（§5.5）。", "p5": "コメントレターの確率は4.0ポイント上がり、標本平均31.9%に対して12.5%の増加にあたる（§5.1.1、表3）。最初のレターまでの日数は13.2%（約19.8日）短くなった（§5.2、表5）。コメントを受けなかった10,755企業年では、のちの訂正報告の確率が下がった（§5.1.4）。標準タグの多い企業、同業と似たタグを使う企業、複雑な勘定科目で効果が大きい（§6）。", "p6": "導入は企業規模の順であり、大きい企業への監視の強化と完全には切り分けにくい。著者は固定効果、反証テスト、回帰不連続で対処している（§5.5）。SECが実際に審査した企業は直接には観察できず、注意度の指標で代用している（§5.1.4）。対象は義務化の前後の米国に限られる。", "fun": "会社の決算書が、人が読むだけの文書から、コンピュータがそのまま読めるタグ付きデータ（XBRL）に変わったら、監督官庁の仕事はどう変わるか。米国ではタグ付けが義務になった後、当局から会社への「ここを説明してください」という手紙が増え、出るまでの日数は約19.8日短くなり、見逃しも減った。データを手で写し取る手間が省けた分、分析に人手を回せたという説明である。", "unverified": "§1、§2、§5.1.2、§5.1.3、§5.4、表の係数の詳細、注は読んでいない。質の指標の定義、分析ツールの導入時期を使った検証の中身は確認していない。"}}, {"id": "jr06", "rank": 6, "headline": "交通荷重スペクトルで鋼橋の疲労設計係数を再較正", "title": "Extreme Value Return Period–Based Fatigue–Reliability Modeling and Damage Equivalence Factor Calibration for Highway Bridges", "url": "https://doi.org/10.1061/jbenf2.beeng-8144", "authors": "He Zhang ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-25", "sjr": 1.087, "citescore": 7.2, "citescore_year": "2025", "apa": "Zhang, H., Lin, L., Zhou, Y., Yao, L., & Zheng, X. (2027). Extreme Value Return Period–Based Fatigue–Reliability Modeling and Damage Equivalence Factor Calibration for Highway Bridges. Journal of Bridge Engineering, 32(2). https://doi.org/10.1061/jbenf2.beeng-8144", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "ユーロコードの疲労設計で使う損傷等価係数と最大損傷等価係数を、極値の再現期間を取り入れた1つの損傷進展の枠組みに統合する疲労信頼性モデルを提案した。現行の疲労荷重モデルFLM3の信頼性指標は−0.5から3.5まで広くばらつくという（抄録）。", "p2": "損傷等価係数の体系は、鋼橋の疲労設計に単純な単一車両モデルを使えるようにするが、その近似の精度と信頼性には懸念が残る（抄録）。別々に扱われてきた2つの係数を整合的に扱い、設計式の信頼性の余裕をそろえられるかを問う。", "p3": "修正したHeulerのモデルで車両荷重スペクトルをパラメータ化し、スペクトルの形と疲労損傷の非線形な連成を示す。一般化パレート分布による外挿で、再現期間と過積載率の関係を定量化し、最大損傷等価係数の推定を改善する。そのうえで、非線形回帰により改訂した部分係数の関数を導く（抄録）。", "p4": "この確率モデルを使い、代表的な設計基準の疲労設計の方式の信頼性を、同じ交通スペクトルと不確かさの仮定の下で比べた。交通量、支間長、影響線の種類、車線構成への感度を見ている（抄録）。使った交通データや橋の条件は抄録に記載がない。", "p5": "設計基準の方式ごとに、信頼性の余裕と感度が異なる。FLM3の信頼性指標は−0.5〜3.5と広くばらつき、系統的な過小評価の危険を示す。損傷等価係数は荷重スペクトルの形に、最大損傷等価係数は過積載率と再現期間に強く左右される。提案モデルでは100年の設計期間の信頼性指標が3.8に上がる（いずれも抄録）。", "p6": "本文を入手できず、仮定した交通スペクトル、疲労強度の曲線、不確かさのモデル、較正に使ったデータは確認できない。解釈：信頼性指標の値は荷重と抵抗の確率モデルの仮定に依存するので、3.8という数値は同じ仮定の下での相対比較として読むのが安全である。", "fun": "橋の鋼材は、トラックが通るたびに少しずつ疲れていく。設計では、実際のさまざまな車の列を単純な車両モデルに置き換え、係数を掛けて帳尻を合わせる。この研究は、その置き換えによる安全の余裕が、橋の長さや交通量によって大きく変わってしまうことを示した。ヨーロッパの現行の方式では、安全度の指標が−0.5から3.5までばらついた。めったに来ない重い車の影響を、極値の統計で取り込む改良を提案している。", "unverified": "本文、数式、交通データの出所、比較した設計基準の名前、改訂した係数の形は確認できなかった（抄録のみ）。"}}, {"id": "jr07", "rank": 7, "headline": "震災被災者の社会的孤立は男性の脳卒中リスクを高める", "title": "Association Between Social Isolation and Stroke Risk among Survivors Following the Great East Japan Earthquake: A Prospective Cohort Study.", "url": "https://doi.org/10.2188/jea.je20260379", "authors": "Kotozaki Y ほか", "venue": "Journal of epidemiology", "date": "2026-11-26", "sjr": 1.121, "citescore": 7.0, "citescore_year": "2025", "apa": "Kotozaki, Y., Nasu, T., Akasaka, H., Koeda, Y., Omama, S., Tanaka, F., & Tanno, K. (2026). Association Between Social Isolation and Stroke Risk among Survivors Following the Great East Japan Earthquake: A Prospective Cohort Study. Journal of Epidemiology. https://doi.org/10.2188/jea.je20260379", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "J-STAGEの早期公開PDFの本文のうち、§2.1・§2.2・§2.3・§2.5・§3.2・§3.4・§3.6・§4.1を読んだ。PDFは行番号つきで抽出が乱れている。", "preprint": false, "p1": "東日本大震災の被災者27,379人を平均5.99年追跡し、社会的孤立が男性では脳卒中の発症リスクの上昇（ハザード比1.42）と関連し、女性では関連しないことを示した（抄録）。", "p2": "社会的孤立と脳卒中の発症を結ぶ証拠は限られ、とくに災害後の集団と性差については乏しい（抄録）。被災者で、孤立と脳卒中の関連が男女で異なるかを問う。", "p3": "岩手県の被災者を対象とするTMM CommCohort Studyのデータを使う前向きコホート研究である（§2.1）。孤立は、家族と友人のつながりを6項目で尋ねるLSNS-6の日本語版で測り、合計30点のうち12点未満を孤立とした（§2.2）。脳卒中は地域の全病院のデータにもとづく岩手県の脳卒中登録で把握し、2021年末まで追跡した（§2.3）。", "p4": "性別ごとのコックス比例ハザードモデルを3段階で調整した。年齢、生活習慣と検査値、さらに婚姻・同居・学歴・就労・心理的苦痛・住宅被害を加えている（§2.5）。性別と孤立の交互作用を検定し、年齢・住宅被害・病型による部分集団の解析と、死亡を競合事象とするFine–Grayモデルなどの感度分析を行った（§2.5、§3.6）。", "p5": "追跡中に男性208人、女性156人が脳卒中を発症した（§3.2）。完全調整モデルのハザード比は男性1.42（95%CIは1.06〜1.92）、女性1.03（0.62〜1.40）で、交互作用は有意だった（p=0.005）（§3.2）。男性では主に脳梗塞で関連がみられ（ハザード比1.50、抄録）、住宅被害のない男性で関連がより目立った（1.48、§3.4）。競合リスクを考慮しても交互作用は有意だった（p=0.038、§3.6）。", "p6": "孤立は基準時点（震災の約2〜4年後）に自己申告で1回測っただけで、その後の変化は捉えていない（§4.1）。発症前の体調の低下が社会参加を減らしたという逆の因果を排除しきれない（§4.1）。登録の対象地域の外で治療された脳卒中は漏れた可能性があり、循環器の薬の使用の詳しい情報もない（§4.1）。", "fun": "人づきあいが少ないことは、体の病気とも関係するのだろうか。東日本大震災の被災者27,379人を平均5.99年追いかけたこの研究では、家族や友人とのつながりが乏しい男性は、そうでない男性に比べて脳卒中の発症リスクが1.42倍だった。女性ではこの差が見られなかった。同じ孤立でも、男女で健康への現れ方が違うらしい。災害の後は、孤立した男性を見つけて支えることが予防につながりうる。", "unverified": "§1、§2.4、§2.6、§3.1、§3.3、§3.5、§4の考察の本文、表の全体、補足資料は読んでいない。除外の内訳の人数は一部しか確認していない。女性で関連がない理由についての著者の考察は読んでいない。"}}, {"id": "jr08", "rank": 8, "headline": "米国の職場AI利用を医療職と他職種で比べる", "title": "Workplace Artificial Intelligence Use in Health Care and Non–Health Care Occupations", "url": "https://doi.org/10.1001/jamahealthforum.2026.4427", "authors": "Rosemary A. Martoma ほか", "venue": "JAMA Health Forum", "date": "2026-11-25", "sjr": 2.833, "citescore": 7.9, "citescore_year": "2025", "apa": "Martoma, R. A., McBain, R. K., Mandl, K. D., Brownstein, J. S., Cantor, J. H., & Rader, B. (2026). Workplace Artificial Intelligence Use in Health Care and Non–Health Care Occupations. JAMA Health Forum, 7(11), e264427. https://doi.org/10.1001/jamahealthforum.2026.4427", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は入手できなかった（出版社のページは取得できず）。Crossrefの抄録は1文だけで、それを読んだ。", "preprint": false, "p1": "米国の被雇用者について、医療職とそれ以外の職種でAIの利用がどの程度広がっているかを、11種類の業務別に調べた横断研究である（抄録）。", "p2": "職場でのAIの利用の広がりは、医療職と非医療職でどう違い、どの業務で使われているかを問う（抄録）。背景：医療では誤りの影響が大きく、導入の実態を職種の間で比べたデータは制度の議論の土台になる。", "p3": "横断研究で、対象は米国の被雇用者であり、AIの利用を11の業務ごとに集計している（抄録）。調査の名称、実施時期、標本の大きさ、AIの利用の尋ね方は抄録に記載がない。", "p4": "医療職と非医療職の比較が中心とみられるが、重みづけや調整の方法、統計的な検定の内容は抄録からは分からない。抄録は1文のみである。", "p5": "抄録は研究の目的を述べるだけで、利用率の数値や、医療職と非医療職の差の向きは書かれていない。結果は本文で確認する必要がある。", "p6": "本文を入手できず、結果も限界も確認できない。解釈：横断研究なので、利用の広がりの時間変化や、AIの利用と仕事の成果との因果関係は、この設計からは分からない。", "fun": "病院などで働く人と、それ以外の仕事の人とで、仕事にAIを使う割合はどれくらい違うのだろうか。この研究は米国の働く人を対象に、11種類の作業に分けてAIの利用の広がりを調べた。作業ごとに分けて見ると、AIが仕事のどの部分に入り込んでいるかが分かる。入手できた要旨は1文だけで、どちらの職種で多いのかという答えはまだ読めていない。", "unverified": "本文、結果の数値、標本と調査方法、11の業務の中身は確認できなかった（抄録は1文のみ）。"}}, {"id": "jr09", "rank": 9, "headline": "地震波から2017年グリーンランド地すべりの力を復元", "title": "Source Dynamics of the 2017 Greenland Landslide From Force‐Time Inversion With Ambient‐Noise‐Constrained Velocity Models", "url": "https://doi.org/10.1029/2026jf009167", "authors": "Jun Xie ほか", "venue": "Journal of Geophysical Research: Earth Surface", "date": "2026-11-25", "sjr": 1.437, "citescore": 6.6, "citescore_year": "2025", "apa": "Xie, J., Zeng, X., Chu, R., & Ni, S. (2026). Source Dynamics of the 2017 Greenland Landslide From Force‐Time Inversion With Ambient‐Noise‐Constrained Velocity Models. Journal of Geophysical Research: Earth Surface, 131(12). https://doi.org/10.1029/2026jf009167", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "2017年のグリーンランド・ヌーガーツィアクの地すべりについて、常時微動の相互相関から経路ごとの速度構造を作り、それを使って地すべりの力の時間変化を逆解析した。波形の分散低減は、標準モデルIASP91の51.10%に対し74.49%になった（抄録）。", "p2": "この地すべりは、北極域の大規模な地すべりの震源過程と災害を調べる重要な事例で、強い広帯域の地震波と、フィヨルドの水の定常振動（セイシュ）に伴う単色の信号を生んだ（抄録）。観測が疎で構造が複雑な地域で、速度モデルの選び方が力の逆解析をどこまで変えるかを問う。", "p3": "常時微動の相互相関から表面波の分散を測り、経路ごとの1次元速度モデルを作る。そのモデルで理論グリーン関数を計算し、周波数領域で地すべりの力の時間関数を逆解析する（抄録）。", "p4": "条件をそろえて3つの速度モデル（IASP91、CRUST1.0、常時微動で拘束したモデル）を比べ、分散低減を指標とした。21の波形ごとに改善の有無も見ている（抄録）。", "p5": "分散低減はIASP91で51.10%、CRUST1.0で68.52%、常時微動で拘束したモデルで74.49%だった。IASP91からの改善は明確だが、CRUST1.0からの上積みは小さく、経路と成分によって異なり、21のうち14の波形で改善した。復元された力の履歴は約100秒続き、初期の鉛直力のパルス、約25〜40秒のより強い正の振れ、その後の極性の反転を含む（いずれも抄録）。", "p6": "CRUST1.0に対する改善は控えめで一様ではないと著者自身が述べている（抄録）。本文を入手できず、逆解析の周波数帯、観測点の配置、力の履歴の不確かさ、セイシュの信号の扱いは確認できない。解釈：力の履歴と崩壊の運動との対応づけは、本文の議論を確認する必要がある。", "fun": "山が崩れると、動く土砂が地面を押したり引いたりする力が地震波になって遠くまで伝わる。その波形から逆算すれば、現場を見ていなくても、どんな力がいつ働いたかが分かる。この研究は、ふだんの地面の微かな揺れを使って波の通り道の地下構造を先に調べておくと、逆算の当てはまりが良くなることを、2017年のグリーンランドの地すべりで示した。復元された力は約100秒続いていた。", "unverified": "本文、観測点と経路の詳細、逆解析の設定、力の大きさの値、既往研究との比較は確認できなかった（抄録のみ）。"}}, {"id": "jr10", "rank": 10, "headline": "中小企業の財務困窮予測を計量と機械学習で比較", "title": "Predicting Small and Medium-sized Enterprise Financial Distress in Africa and the Rest of the World: Evidence from Econometric and Machine Learning Models", "url": "https://doi.org/10.1177/09721509261494422", "authors": "Yudhvir Seetharam ほか", "venue": "Global Business Review", "date": "2026-11-24", "sjr": 0.672, "citescore": 12.5, "citescore_year": "2025", "apa": "Seetharam, Y., Chipeta, C., Nyakurukwa, K., Mani, G., McSharry, P., & Luhanga, E. (2026). Predicting Small and Medium-sized Enterprise Financial Distress in Africa and the Rest of the World: Evidence from Econometric and Machine Learning Models. Global Business Review. https://doi.org/10.1177/09721509261494422", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "中小企業の経営困窮の予測因子が、アフリカとそれ以外の地域でどう違うかを、世界銀行の企業調査の大きな標本で比べた。伝統的な計量モデルと機械学習の分類器を並べ、SHAPで解釈している（抄録）。", "p2": "困窮を予測する要因は地域の文脈によって変わるのか、アフリカに特有のパターンは何かを問う（抄録）。", "p3": "世界銀行のエンタープライズ・サーベイの標本に、世界的なセンチメントと不確実性の指数を加えたデータを使う。伝統的な計量経済モデルを機械学習の分類器と比べ、Shapleyの加法的説明（SHAP）で結果を解釈する（抄録）。困窮の定義、標本の大きさ、対象年、モデルの種類は抄録に記載がない。", "p4": "計量モデルと機械学習を併用する進め方で、アフリカとその他の地域を比べている（抄録）。予測精度の指標や、標本外での評価の方法は抄録からは分からない。", "p5": "アフリカでは、女性の従業員の構成と非熟練労働の指標が低い困窮の予測と結びつくが、女性の経営トップは有意な予測因子ではない。インフォーマルな競争は困窮の予測を高めるが、他の地域では低い困窮と結びつく。非公式の支払いは低い困窮の予測と結びつき、行政の遅れを減らす「潤滑油」の仕組みと整合する（いずれも抄録）。", "p6": "解釈：これらは予測上の関連であり、因果効果を示すものではない。非公式の支払いについての説明は、著者も「もっともらしい」ものとして述べるにとどめている（抄録）。本文を入手できず、困窮の測り方、国ごとの標本の偏り、頑健性は確認できない。", "fun": "会社が行き詰まる前触れは世界共通だろうか。この研究によると、そうではない。アフリカの中小企業では、役人への非公式の支払いをしている会社のほうが、行き詰まると予測されにくかった。支払いで手続きの遅れを縮めている、という説明がつく。インフォーマルな業者との競争は、アフリカでは危険の印なのに、他の地域では逆だった。同じ指標でも、土地によって意味が変わる。", "unverified": "本文、標本の大きさ、困窮の定義、モデルの精度、SHAPの値は確認できなかった（抄録のみ）。"}}, {"id": "jr11", "rank": 11, "headline": "データ同化で金星大気のロスビー波の再現を改善", "title": "Evaluating the Ability of Data Assimilation to Improve Rossby Wave Representation in the Venus Atmosphere Using an Observing System Simulation Experiment", "url": "https://doi.org/10.1029/2026je009838", "authors": "Nobumasa Komori ほか", "venue": "Journal of Geophysical Research: Planets", "date": "2026-11-25", "sjr": 1.535, "citescore": 6.5, "citescore_year": "2025", "apa": "Komori, N., Sugimoto, N., Fujisawa, Y., Abe, M., Kouyama, T., Ando, H., Takagi, M., & Yamamoto, M. (2026). Evaluating the Ability of Data Assimilation to Improve Rossby Wave Representation in the Venus Atmosphere Using an Observing System Simulation Experiment. Journal of Geophysical Research: Planets, 131(12). https://doi.org/10.1029/2026je009838", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "金星の雲頂で観測されるロスビー波を、観測システム模擬実験とデータ同化によって大気大循環モデルの中で修正できることを示した。同化を終えた後も、同化した観測の「記憶」は地球の約2か月持続した（抄録）。", "p2": "金星の雲頂では中緯度のロスビー波が観測されており、スーパーローテーションの維持に重要な役割を果たすと考えられている（抄録）。モデルの中のロスビー波を、雲の追跡から得られる風の観測の同化で改善できるかを問う。", "p3": "ロスビー波に伴う水平風の模擬観測を線形の波動伝播モデルで作り、雲頂（約70 km）で地球の30日間、現実的な条件で同化した。観測は、金星周回機の紫外画像の雲追跡から得られると想定している（抄録）。同化手法の名称、アンサンブルの大きさ、使ったモデルは抄録に記載がない。", "p4": "評価にはエリアッセン–パームフラックスを使い、波の活動と東西平均の東西風への影響を診断した。同化の終了後にモデルの場がどう推移するかも追っている（抄録）。", "p5": "中緯度でロスビー波の活動が強まると、東西平均の東西風の減速が引き起こされた。同化の終了後、モデルの場は地球の約10日以内に別の準平衡状態に達した。著者はこれを、新しい観測がなくても同化した観測の記憶が地球の約2か月持続することを示すものとしている（いずれも抄録）。", "p6": "模擬観測による実験であり、実際の観測データを同化したものではない（抄録）。解釈：模擬観測を線形モデルで作っているため、現実の波の非線形性や観測の誤差の構造がどこまで表されているかは本文の確認が要る。本文を入手できず、同化の設定と改善の定量値は確認できない。", "fun": "金星では、大気が惑星の自転よりずっと速く回っている。その維持に関わるとされる大きな波（ロスビー波）を、計算モデルの中で正しく表せるかが課題である。この研究は「探査機の雲の写真から風が測れたとしたら」という仮の観測を作ってモデルに取り込み、波を直せることを確かめた。取り込みをやめた後も、その効果が地球の時間で約2か月残ったという点が面白い。", "unverified": "本文、同化手法とモデルの名称、実験の設定、改善の定量的な指標、約10日と約2か月という2つの時間の関係の説明は確認できなかった（抄録のみ）。"}}, {"id": "jr12", "rank": 12, "headline": "サービスの価値のばらつきは市場シェアを下げる", "title": "Impact of service value fluctuation on market share: a simulation study", "url": "https://doi.org/10.1007/s42001-026-00505-z", "authors": "Yukihisa Fujita ほか", "venue": "Journal of Computational Social Science", "date": "2026-11-25", "sjr": 0.599, "citescore": 5.2, "citescore_year": "2025", "apa": "Fujita, Y., Amakasu, T., & Toriumi, F. (2026). Impact of service value fluctuation on market share: a simulation study. Journal of Computational Social Science, 10(1). https://doi.org/10.1007/s42001-026-00505-z", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文のうち、§3.1・§3.2冒頭・§3.3・§4.1・§5.1〜§5.3・§6・§7冒頭を読んだ。PDFは数式の抽出が乱れている。", "preprint": false, "p1": "サービスが提供する価値が毎回ばらつくと市場シェアにどう響くかを、利用経験と口コミで価値を推定する消費者のエージェントモデルで調べた。ばらつきは、受け取る価値が平均より高くなる場合を含んでいても、シェアを下げる（抄録）。", "p2": "高い価値を一貫して提供するのは、人為的なミスや予期しない出来事のため難しい（抄録）。先行研究の多くは単一のサービスを対象としていた（§5.2）。競合がある市場で、ばらつきが価値の優位をどれだけ打ち消すか、市場の性質でどう変わるかを問う。", "p3": "サービスの価値は平均と標準偏差を持つ正規分布から毎回引かれる（§3.2）。消費者は平均を知らず、自分の利用経験と他の消費者からの情報から価値を推定し、最も高いと見込むサービスを選ぶ。他人からの情報は自分の経験より雑音が大きいと信じ、最近の観測を重くみる（§3.1、§3.2）。各時刻で情報の拡散、選択と利用、情報の生成を行う（§3.3）。", "p4": "解析的な検討と消費者1人のシミュレーションでモデルの挙動を確かめたうえで（§4.1）、ばらつきと価値の優位の関係と、利用頻度と口コミの広がりやすさによる市場の違いを調べた（§5.1）。後者は消費者200人、500ステップを100回実行した平均で、対象サービスの選択率を指標とした（§5.3、表2）。", "p5": "選択が切り替わる境界は、ばらつきがおよそ「8×価値の優位＋0.05」となる線で、ばらつきは価値の優位の8分の1に相当する効果を持つ（§5.2、図4）。利用確率を0.2から0.8に上げると、ある設定での選択率は0.576から0.521に下がり、情報の拡散確率を上げると0.576から0.855に上がった（§5.3、図5）。利用頻度の高い市場では、情報提供に加えて価値の向上とばらつきの削減が要ると著者は述べる（§6）。", "p6": "価値の定義は抽象的で、特定のサービスに当てはめるには調整が要る（§6）。消費者は一度に1つのサービスしか選べず、複数の併用は扱えない（§6）。消費者は均質で、知識や動機の違いを考えていない（§6）。実データとの照合は読んだ範囲になく、結果はモデルの中での性質である。", "fun": "いつも同じ出来の店と、平均は少し上だけれど日によって当たり外れのある店。この研究のシミュレーションでは、客は当たり外れの大きい店から離れやすかった。外れを引いた客が他へ移りやすくなるからだ。当たり外れの大きさは、その8分の1だけ平均の価値が低いのと同じ不利として働いた。頻繁に使うサービスほどこの影響が強く、口コミがよく広がる市場では和らいだ。", "unverified": "§1、§2、§3.2の式の詳細、§4.2〜§4.3、表1の設定値は読んでいない。信念のパラメータの値、先行研究の知見の再現の中身は確認していない。"}}, {"id": "jr13", "rank": 13, "headline": "沈降の妨げを含む浮遊砂の式をPINNで解く", "title": "A Physics-Informed Neural Network Approach to Nonlinear Suspended Sediment Dynamics in Open Channels", "url": "https://doi.org/10.1061/jenmdt.emeng-9159", "authors": "Angshuman Mahata ほか", "venue": "Journal of Engineering Mechanics", "date": "2026-11-26", "sjr": 0.765, "citescore": 6.3, "citescore_year": "2025", "apa": "Mahata, A., Kumbhakar, M., Sarkar, S., Dubey, R. K., & Singh, V. P. (2027). A Physics-Informed Neural Network Approach to Nonlinear Suspended Sediment Dynamics in Open Channels. Journal of Engineering Mechanics, 153(2). https://doi.org/10.1061/jenmdt.emeng-9159", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "濃度が高いほど沈降が妨げられる「干渉沈降」を含む、開水路の浮遊砂の2次元定常の移流拡散方程式を、物理情報ニューラルネットワーク（PINN）で解いた。相対L2誤差ノルムは2.82×10の−2乗だった（抄録）。", "p2": "開水路の浮遊砂輸送は、干渉沈降のような濃度に依存する効果が支配方程式に強い非線形性を持ち込むと、モデル化が難しくなる（抄録）。格子を作らずに、この非線形の問題を精度よく解けるかを問う。", "p3": "基準面と自由水面での一般化した境界条件と、土砂を含まない流入の条件を組み込む。支配方程式と境界条件を損失関数に入れて物理的な整合を保ち、データ損失の項には、単純化した部分問題の解析解から作った雑音つきの合成データを使って頑健性を持たせる（抄録）。", "p4": "限られた数の代表的なハイパーパラメータの組合せで学習の挙動を調べ、適した構成を選んだ。予測は、既存の解析解と、指定された流れの条件での実験データの両方で検証した（抄録）。", "p5": "相対L2誤差ノルムは2.82×10の−2乗で、著者は枠組みの信頼性を示すものとしている（抄録）。この誤差がどの比較に対するものか、条件ごとのばらつきがどの程度かは抄録からは分からない。", "p6": "定常・2次元の問題に限られ、ハイパーパラメータの検討は限定的だと抄録自身が述べている。本文を入手できず、流速分布や拡散係数の与え方、実験データの出所、従来の数値解法との精度と計算時間の比較は確認できない。解釈：格子が要らない利点は、同じ精度に達するまでの学習の手間と比べて評価する必要がある。", "fun": "川の水に舞う細かい砂は、砂が多いほど互いに邪魔をして沈みにくくなる。この性質を入れると方程式が急に解きにくくなる。この研究は、川を細かい格子に区切って計算する代わりに、ニューラルネットワークに「方程式と境界条件を破ったら減点」という決まりで答えの形を覚えさせた。単純な場合の正解にわざと雑音を足したものを手本として混ぜ、実験データとも比べている。", "unverified": "本文、支配方程式と境界条件の具体形、ネットワークの構成、検証に使った解析解と実験データの出所は確認できなかった（抄録のみ）。"}}, {"id": "jr14", "rank": 14, "headline": "ESG評価は財務困窮の予測をわずかしか改善しない", "title": "ESG Ratings as Predictors of Financial Distress: Implications for Sustainable Development, Investment Risk Assessment, and Corporate Resilience", "url": "https://doi.org/10.1002/sd.71981", "authors": "Rabia Bashir ほか", "venue": "Sustainable Development", "date": "2026-11-26", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "apa": "Bashir, R., Ahmad, M., Shabbir, M. S., Paraschivescu, A. O., Radu, F., Bordeianu, G. D., Hazaparu, V., & Fotache, G. (2026). ESG Ratings as Predictors of Financial Distress: Implications for Sustainable Development, Investment Risk Assessment, and Corporate Resilience. Sustainable Development. https://doi.org/10.1002/sd.71981", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "ESG評価が、1年先の企業の経営困窮（アルトマンにもとづく困窮域への移行）の予測を改善するかを、37か国7698社の55,557企業年で調べた。ESGには統計的に有意な関連があるが、予測の改善は小さい（抄録）。", "p2": "ESG評価は持続可能な投資の選別で重みを増しているが、表面化しつつある経営困窮の予測に役立つかは不確かである（抄録）。総合スコアと環境・社会・ガバナンスの各柱が、財務指標の基準モデルに上積みをもたらすかを問う。", "p3": "2016〜2024年の標本にロジスティック回帰を使い、ESGの総合スコアと各柱を、アルトマンの5つの構成要素と企業属性からなる財務の基準モデルと比べる（抄録）。", "p4": "予測性能は、モデルの当てはまり、情報量規準、識別力、確率の正確さ、時間方向の検証で評価した。国の固定効果、別のアルトマンの困窮分類、別のESG総合スコアでも確かめている（抄録）。", "p5": "総合スコア、環境、ガバナンスは元のモデルで困窮の発生と負の関連を持つ。社会は単独では有意でないが、同時に入れると正になる。柱を同時に入れたモデルが標本内で最も良く当てはまり、時間方向の検証ではガバナンスのAUCが最も高いが、統計的に有意ではない。予測の改善は期間によって変わる（いずれも抄録）。", "p6": "国の固定効果を入れると環境の負の関連は確認されるが、総合スコアとガバナンスの推定は変わりやすい。別の困窮分類では結果が混在し、別の総合スコアは有意でない（抄録）。本文を入手できず、AUCの値や改善幅は確認できない。解釈：困窮の定義自体が財務指標から作られており、基準モデルが強く上積みの余地が小さい設計である。", "fun": "環境や社会への配慮の点数（ESG評価）が高い会社は、経営が傾きにくいのだろうか。37か国の7698社を調べたこの研究の答えは、関係はあるが予測の役にはあまり立たない、だった。財務の数字で作った予測に点数を足しても、当たりやすさはわずかしか上がらず、どの点数を使うか、どの時期で試すかで結果が変わった。統計的に有意であることと、予測に使えることは別だと分かる例である。", "unverified": "本文、AUCなどの数値、ESG評価の提供元、困窮域の定義の詳細、国別の標本の内訳は確認できなかった（抄録のみ）。"}}, {"id": "jr15", "rank": 15, "headline": "若年の家族介護は女性の抑うつを強める", "title": "Young Adults as Family Caregivers: Gender Differences in the Association Between Informal Care and Depressive Symptoms in Seoul, South Korea", "url": "https://doi.org/10.1111/jomf.70144", "authors": "Keun Young Kwon ほか", "venue": "Journal of Marriage and Family", "date": "2026-11-26", "sjr": 1.821, "citescore": 6.4, "citescore_year": "2025", "apa": "Kwon, K. Y., Nam, N., & Kim, J. (2026). Young Adults as Family Caregivers: Gender Differences in the Association Between Informal Care and Depressive Symptoms in Seoul, South Korea. Journal of Marriage and Family. https://doi.org/10.1111/jomf.70144", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "ソウルの18〜35歳の若年成人5106人の3時点のパネル（2022〜2024年）を使い、家族の介護を担うことが抑うつ症状の増加と関連し、その関連は男性より女性で有意に強いことを示した（抄録）。", "p2": "介護者の健康の研究は、人生の中で介護が期待される時期に担う人を主に対象としてきた。韓国では急速な高齢化と家族による介護への依存が続き、若い成人期の介護が社会的な問題になっているが、精神的健康との関連や性差はほとんど分かっていない（抄録）。", "p3": "ソウル若年成人パネル調査の3時点（12,485人・時点）を使い、個人の固定効果モデルで、同じ人の中の変化から関連を推定する。時間で変わらない個人の特性は統制される（抄録）。", "p4": "性別ごとのモデル、交互作用の分析、介護の相手ごとのモデルを推定した（抄録）。抑うつの尺度、介護の定義、時間で変わる統制変数は抄録に記載がない。", "p5": "介護は抑うつ症状の有意な増加と関連し、この関連は女性で男性より有意に強い。相手別では、祖父母と親の介護が女性の抑うつ症状の高さと結びつき、男性ではどの相手も有意に関連しなかった（いずれも抄録）。", "p6": "解釈：固定効果は時間で変わらない交絡を除くが、介護の開始と同じ時期に起こる変化（家族の病気、就労や家計の変化など）の影響は残りうる。対象はソウルの3年間に限られる。本文を入手できず、効果の大きさと脱落の扱いは確認できない。", "fun": "祖父母や親の世話は中高年が担うものと思われがちだが、韓国では18〜35歳の若いうちに担う人が社会的な問題になっている。ソウルの若者5106人を3時点にわたって追うと、同じ人が介護を担っている時期には気分の落ち込みが強かった。その傾向は女性ではっきりしていて、男性では確認できなかった。大人になる途中の時期に、家族の世話の重みが女性に偏っていることをうかがわせる。", "unverified": "本文、抑うつの尺度、介護の定義と頻度、効果量、脱落と欠測の扱いは確認できなかった（抄録のみ）。"}}, {"id": "jr16", "rank": 16, "headline": "LLMの感情評定は尺度の取り方で結果が変わる", "title": "From Semantics to Scales: The Ordinalization Gap in LLM-Based Sentiment Analysis", "url": "https://doi.org/10.3390/make8120400", "authors": "David Herrera-Poyatos ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-11-25", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "apa": "Herrera-Poyatos, D., Zuheros, C., Peláez-González, C., Herrera-Poyatos, A., Montes, R., & Herrera, F. (2026). From Semantics to Scales: The Ordinalization Gap in LLM-Based Sentiment Analysis. Machine Learning and Knowledge Extraction, 8(12), 400. https://doi.org/10.3390/make8120400", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "LLMに文章の感情を採点させるとき、連続値で答えさせるか段階評価で答えさせるかで結果の性質が変わり、出力の表し方は中立な選択ではないことを示した。", "p3": "3つのLLM（GPT-5.2、Ministral 3 8B、Gemma 4 E4B）に、レストランのレビュー474件とソーシャルメディアの投稿300件を、連続値・7段階・5段階の方式でそれぞれ10回ずつ分類させ、繰り返しの間の一致を調べた（抄録）。", "p5": "段階評価の出力は、多くの項目では毎回まったく同じ答えに固まり、残りでは隣の段階へ揺れるという構造を示した。安定は妥当性を意味せず、GPT-5.2ではソーシャルメディアの項目の15〜22%が、正解ラベルと違う段階に固まっていた（抄録）。", "fun": "「この文章の感情は何段階目？」とAIに何度も聞くと、多くは毎回同じ答えが返る。安定していて良さそうだが、この研究は落とし穴を示した。毎回同じでも、それが正解と違う答えに固まっている場合が15〜22%あったのだ。何度測っても同じ値が出るからといって、その値が正しいとは限らない。はかりがいつも同じだけずれているのに似ている。", "unverified": "集計の順位が変わる条件の詳細、3モデルの個別の数値は抄録の範囲では未確認。"}}, {"id": "jr17", "rank": 17, "headline": "感情的な問いはLLMの事実確認を正確にし信頼を下げる", "title": "Correctness Costs Credibility? The Emotional Loop in AI-Powered Fact-Checking", "url": "https://doi.org/10.1177/20563051261502615", "authors": "Wenbo Zhao ほか", "venue": "Social Media and Society", "date": "2026-11-26", "sjr": 2.088, "citescore": 8.7, "citescore_year": "2025", "apa": "Zhao, W., & Tang, J. (2026). Correctness Costs Credibility? The Emotional Loop in AI-Powered Fact-Checking. Social Media + Society, 12(4). https://doi.org/10.1177/20563051261502615", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "LLMに事実確認をさせるとき、利用者の感情的な問いかけは判定を正確にする一方、返ってくる答えも感情的になり、それが受け手の信頼を下げうるという「感情のループ」を示した。", "p3": "研究1では、広く使える4つのLLMの24,000件の応答を、部分的に偽の主張について監査した。研究2と3（400人と299人）では、感情的な調子のLLMの事実確認を利用者がどう評価するかを調べた（抄録）。", "p5": "感情的な問いかけ、特に否定的なものは、部分的に偽の主張を見分ける正確さを高めたが、出力の感情の強さも高めた。否定的な調子の答えは、否定的な感情を抱いている利用者で、知覚される信頼性を下げた（抄録）。", "fun": "感情をこめてAIに「これは本当か」と尋ねると、AIは誤りをより正確に見抜いた。ところがAIの答えも感情的な調子を帯び、そうなると、否定的な気分の利用者にはかえって信用されにくくなった。正しさが増すのに信頼が減る、という逆説だ。AIの答えは中身だけでなく、言い方まで含めて受け取られていることが分かる。", "unverified": "正確さの向上の幅、信頼性の低下の大きさ、4つのLLMの名前は抄録になく未確認。"}}, {"id": "jr18", "rank": 18, "headline": "スイス全土の鉄道に対する土石流の危険箇所を地図化", "title": "National-scale debris-flow hazard indication modelling for Swiss railway infrastructure", "url": "https://doi.org/10.5194/nhess-26-6093-2026", "authors": "Feiko Bernard van Zadelhoff ほか", "venue": "Natural hazards and earth system sciences", "date": "2026-11-25", "sjr": 1.418, "citescore": 8.2, "citescore_year": "2025", "apa": "van Zadelhoff, F. B., Bühler, Y., & Bründl, M. (2026). National-scale debris-flow hazard indication modelling for Swiss railway infrastructure. Natural Hazards and Earth System Sciences, 26(11), 6093–6115. https://doi.org/10.5194/nhess-26-6093-2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "スイス全土の鉄道について、土石流に襲われうる区間を、発生しやすい場所の抽出と流下の計算を組み合わせて洗い出した。", "p3": "高解像度の地形モデル、気候・地質の層とランダムフォレストによる統計モデルで発生域を抽出し、スイスの災害データベースと交差検証した。流下は、モデル化した極端な降水から流量の体積を定め、RAMMS::Debrisflowの改変版で計算した（抄録）。", "p5": "発生しやすさの平均の正解率は81.4%だった。再現期間30年・100年・300年で、それぞれ55km・76km・85kmの鉄道が土石流の危険の影響を受ける。発生域を固定している点と、パラメータを決定論的に与えている点が限界だとする（抄録）。", "fun": "山の多いスイスでは、土石流が線路を襲うことがある。国じゅうの線路を1か所ずつ現地で調べるのは大変なので、この研究は地形や地質のデータから発生しやすい場所を統計モデルで拾い出し、そこから土砂が流れ下る計算をして、線路に届くかを調べた。300年に1度の規模まで考えると、85kmの線路が影響を受けるという。全国を一度に見渡す道具になる。", "unverified": "鉄道の総延長に対する割合、流下計算の検証は抄録の範囲では未確認。"}}, {"id": "jr19", "rank": 19, "headline": "コロナ後も都市中心部の移動は戻らず格差が固定", "title": "Sustained changes to urban mobility after COVID-19 reinforced socioeconomic inequalities in Argentina, Chile and Colombia", "url": "https://doi.org/10.1038/s41467-026-79361-4", "authors": "Carmen Cabrera ほか", "venue": "Nature Communications", "date": "2026-11-26", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Cabrera, C., González-Leonardo, M., Nasuto, A., Neville, R., & Rowe, F. (2026). Sustained changes to urban mobility after COVID-19 reinforced socioeconomic inequalities in Argentina, Chile and Colombia. Nature Communications, 17(1). https://doi.org/10.1038/s41467-026-79361-4", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "南米3か国で、コロナ禍の始まりから2年たっても、都市の中心部と豊かな地域の移動量が元に戻っていないことを、位置情報の記録から示した。", "p3": "アルゼンチン・チリ・コロンビアの、匿名化・集計されたMeta（Facebook）利用者の位置記録1.7億件超（2020年4月〜2022年5月）を使い、流行前の基準に対する移動量の変化を、社会経済的な水準と都市・農村の違いに沿って調べた（抄録）。", "p5": "流行の開始から2年後も、3か国とも最も人口密度の高い都市の中心部の移動は基準より約25〜50%低いままで、最も豊かな上位33%の地域も基準に戻っていなかった。この違いは、その後の回復の速さではなく、最初の落ち込みの大きさで説明された（抄録）。", "fun": "外出が制限された時期が終われば、人の動きは元に戻ると思いがちだ。ところが南米の3か国では、2年たっても都心の人の動きは基準より約25〜50%少ないままだった。しかも差を生んだのは、その後の戻り方ではなく、最初にどれだけ大きく落ち込んだかだった。一度の大きな出来事が、人の動き方の違いを長く固定してしまうことがある。", "unverified": "移動量の指標の定義、Facebook利用者の偏りの扱いは抄録の範囲では未確認。"}}, {"id": "jr20", "rank": 20, "headline": "医療職のAI利用と燃え尽き・満足度の関係を整理", "title": "Artificial intelligence and the changing work of healthcare professionals: a scoping review of work- and health-related outcomes", "url": "https://doi.org/10.3389/frai.2026.1998157", "authors": "Lena Kristin Klimaschewski ほか", "venue": "Frontiers in Artificial Intelligence", "date": "2026-11-25", "sjr": 1.007, "citescore": 8.0, "citescore_year": "2025", "apa": "Klimaschewski, L. K., Harth, V., Klußmann, A., & Mache, S. (2026). Artificial intelligence and the changing work of healthcare professionals: a scoping review of work- and health-related outcomes. Frontiers in Artificial Intelligence, 9. https://doi.org/10.3389/frai.2026.1998157", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "臨床の現場でAIを使う医療職について、AIの利用とストレス・燃え尽き・well-being・職務満足・人間関係・多職種連携との関係を報告した研究を集めて整理し、結果が一致していないことを示した。", "p3": "JBIの方法とPRISMA-ScRに従うスコーピングレビュー。PubMed、Web of Science、PsycINFOを2025年8月12日に検索し、実際の臨床でAIを使う、またはその影響を受ける医療職を対象にした査読つきの実証研究を選んだ（抄録）。", "p5": "27件の研究が含まれた。職務満足、燃え尽き、知覚されたストレスが最も多く調べられていた。ストレスや燃え尽きの低下など好ましい関連を報告する研究がある一方、関連なし、混在、好ましくない関連を報告する研究もあった（抄録）。", "fun": "AIが医療の現場に入ると、医療職は楽になるのか、それとも負担が増えるのか。この論文は、それを調べた27の研究を集めて見比べた。答えは「研究によってばらばら」だった。良くなったという報告もあれば、変わらない、かえって悪いという報告もある。使うAIも対象も測り方も違うので、ひとまとめに「AIは働く人に良い」とは言えない、というのが正直な結論だ。", "unverified": "各領域ごとの研究数の内訳は抄録になく未確認。研究の質の正式な評価は行われていないと著者が述べている。"}}, {"id": "jr21", "rank": 21, "headline": "口コミから歴史地区の音の体験をLLMで地図化", "title": "Differentiated Soundscape Experiences in Public Spaces of a Tourism-Oriented Historic District: A Large Language Model-Assisted Study of Huishan Ancient Town", "url": "https://doi.org/10.3390/buildings16234751", "authors": "Bozhu Sheng ほか", "venue": "Buildings", "date": "2026-11-26", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Sheng, B., & Guo, J. (2026). Differentiated Soundscape Experiences in Public Spaces of a Tourism-Oriented Historic District: A Large Language Model-Assisted Study of Huishan Ancient Town. Buildings, 16(23), 4751. https://doi.org/10.3390/buildings16234751", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "観光地になっている歴史地区の口コミから、どこでどんな音が聞こえ、どう感じられているかをLLMで抜き出し、場所ごとの音の体験の違いを整理した。", "p3": "中国の恵山古鎮の口コミを対象に、課題ごとの指示文で、音に関する記述の選別、原文の抜き出し、感情の符号化、場所の特定をLLMに行わせ、モデルの比較、人手の確認、BERTopic、空間クラスタリングと組み合わせた（抄録）。", "p5": "4301の断片から27の話題を得た。会話・放送・音楽が混じる音の話題が45.57%を占め、感情はほぼ中立だった。泉の水や葉ずれには落ち着きや楽しさ、音声の再生や繰り返される大声の会話には苛立ちのラベルが多かった。場所と結びつく2353の断片は25mの格子で89区画に及び、6つの群に分かれた（抄録）。", "fun": "観光地の評価というと景色や建物の話になりがちだが、訪れた人は音についても書いている。この研究は口コミから「音の話」だけをAIに拾わせた。泉の水音や葉のそよぐ音は心地よいと書かれ、電話や動画の音を流すことや大声の会話は苛立ちの種になっていた。音の大きさを測るのとは違い、人がその音をどう感じたかまで、場所ごとに分かるのが面白い。", "unverified": "LLMの抽出の正確さ（人手との一致度）、使ったモデルは抄録になく未確認。"}}, {"id": "jr22", "rank": 22, "headline": "外出できない高齢者の半数に介助不足の実害", "title": "Homebound Status and Frailty Predict Adverse Consequences of Unmet Care Needs", "url": "https://doi.org/10.1111/jgs.70853", "authors": "Melissa M. Garrido ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-11-25", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "apa": "Garrido, M. M., Liu, Y., Leff, B., & Ornstein, K. A. (2026). Homebound Status and Frailty Predict Adverse Consequences of Unmet Care Needs. Journal of the American Geriatrics Society. https://doi.org/10.1111/jgs.70853", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "介助が足りないために入浴できないなどの実害を被る高齢者を、どんな特徴から見つけられるかを調べ、外出できない状態と虚弱が最も強い手がかりだと示した。", "p3": "米国の全国調査NHATSの2011〜2019年のデータ（9155人、延べ39,000件の観測）を使い、80%を学習用として、50の候補からlasso罰則つきロジスティック回帰と逐次の特徴選択で予測因子を選び、残り20%で性能を評価した（抄録）。", "p5": "観測の13.7%で介助不足による実害があり、外出できない人ではほぼ半数（48.4%）にのぼった。最も強い予測因子は虚弱と外出できない状態（係数の絶対値が1.3超）で、虚弱の前段階、認知症の疑い、移動補助具の使用も強かった（抄録）。", "fun": "手助けが必要なのに得られず、入浴できないといった目に遭う高齢者がいる。誰がそうなりやすいかを前もって見つけられれば、支援を先回りして届けられる。この研究は全国調査のデータから、50の手がかりの中でどれが効くかを統計の手法に選ばせた。答えは意外に単純で、「家からほとんど出られない」「体が弱っている」の2つが抜きん出ていた。", "unverified": "モデルの予測精度（評価用データでの成績）は抄録になく未確認。"}}, {"id": "jr23", "rank": 23, "headline": "気候政策は物理リスクの開示だけを増やした", "title": "Climate change policy and climate risk disclosure: evidence from machine learning and textual analysis", "url": "https://doi.org/10.1108/jal-04-2026-0227", "authors": "Farhan Hussain ほか", "venue": "Journal of Accounting Literature", "date": "2026-11-25", "sjr": 0.912, "citescore": 4.8, "citescore_year": "2025", "apa": "Hussain, F., Zhou, Z., & Zhang, T. (2026). Climate change policy and climate risk disclosure: evidence from machine learning and textual analysis. Journal of Accounting Literature, 1–34. https://doi.org/10.1108/jal-04-2026-0227", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "国の気候変動政策が企業の気候リスクの開示に与えた影響を、開示文から作った指標で調べ、物理リスクの開示は増えたが移行リスクの開示は減ったことを示した。", "p3": "パキスタン証券取引所の上場企業の2007〜2022年のデータを使った。Word2Vecの埋め込み、語の意味的な拡張、多段階の専門家の検証を組み合わせて、移行リスクと物理リスクの開示指数を別々に作り、政策への曝露の違いにもとづく差分の差分で分析した（抄録）。", "p5": "政策は物理リスクの開示を有意に増やしたが、基本の推定では移行リスクの開示は減った。効果は徐々に現れた。政策に関わる政治的なつながりのある企業で反応が強く、CSRに熱心な企業では移行リスクの開示の減少が和らいだ（抄録）。", "fun": "気候変動のリスクには、災害のような物理的な被害のリスクと、社会が脱炭素へ移る過程で生じるリスクがある。国が気候政策を打ち出したあと、企業は前者については多く語るようになったが、後者についてはかえって語らなくなった。同じ政策でも、リスクの種類で反応が逆になる。会社の報告書の文章を数値に直して比べる手法ならではの発見だ。", "unverified": "効果の大きさの数値、企業数、指標の妥当性の検証の詳細は抄録になく未確認。"}}, {"id": "jr24", "rank": 24, "headline": "スキル要求はAIへの期待と脅威を介して活力に効く", "title": "Job skill demand and thriving at work: mediating roles of AI perceptions and moderating effect of approach motivation", "url": "https://doi.org/10.3389/fpsyg.2026.2024702", "authors": "Wenjie Cheng ほか", "venue": "Frontiers in Psychology", "date": "2026-11-25", "sjr": 0.941, "citescore": 7.0, "citescore_year": "2025", "apa": "Cheng, W., Xin, Y., & Ding, Y. (2026). Job skill demand and thriving at work: mediating roles of AI perceptions and moderating effect of approach motivation. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.2024702", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "仕事で求められるスキルの高さが、AIを機会とみる見方を強め、脅威とみる見方を弱めることを通じて、仕事での活力（スライビング）につながることを示した。", "p3": "仕事の要求度-資源モデルとカテゴリー化の理論にもとづき、中国の従業員の2時点の独立した2標本（研究1は298人、研究2は301人）で、階層的回帰とPROCESSマクロにより媒介と調整を検証した（抄録）。", "p5": "スキル要求はAIを機会とみる認知を正に、脅威とみる認知を負に予測し、両方の認知がスキル要求と活力の関係を有意に媒介した。接近動機はこれらの第1段階の関係を強めたが、調整つき媒介の全体の効果は通常の有意水準に達しなかった（抄録）。", "fun": "高い技能が求められる仕事をしている人ほど、AIを「脅威」ではなく「機会」と見ていた。そして機会と見る人ほど、仕事で活力を感じていた。AIが怖いかどうかは、AIそのものより、自分の仕事がどんな仕事かで変わるのかもしれない。同じ結果を別の集団でも確かめた一方で、一部の仮説ははっきりした結果にならなかったと書かれている点も参考になる。", "unverified": "効果の大きさ（係数）、尺度の内容、標本の業種は抄録になく未確認。自己報告の調査にもとづく。"}}, {"id": "jr25", "rank": 25, "headline": "離島の暮らしを支える非公式な食の分け合い", "title": "Local Sharing—Informal Food Practices in Remote Island Communities", "url": "https://doi.org/10.1111/soru.70069", "authors": "David Marshall ほか", "venue": "Sociologia Ruralis", "date": "2026-11-26", "sjr": 1.231, "citescore": 9.1, "citescore_year": "2025", "apa": "Marshall, D., & Freathy, P. (2026). Local Sharing—Informal Food Practices in Remote Island Communities. Sociologia Ruralis, 67(1). https://doi.org/10.1111/soru.70069", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "スコットランドの離島で、家族や地域の間で食べ物を分け合う非公式なやり取りがどう行われ、暮らしをどう支えているかを現地調査で明らかにした。", "p3": "西部諸島（Western Isles）での現地調査と聞き取りにもとづく質的研究。孤立、供給網の途絶、物価の上昇に応じて育ってきた、住民主導の食の分け合いを調べた（抄録）。", "p5": "家族の中での「内への分け合い」、地域を通じた「外への分け合い」、一般の人への「外部への販売」という多様な交換の形を見いだした。信頼と伝統にもとづくこれらの実践は、食料へのアクセス、社会的な結束、文化的な独自性を高めるが、食料の安定供給全体への効果は公式の市場に比べて限られる（抄録）。", "fun": "供給が途絶えやすい離島では、人々は食べ物を分け合って暮らしを支えてきた。この研究は、その分け合いに「家族の中で」「地域の中で」「外の人に売る」という型があることを聞き取りから描き出した。お金のやり取りの統計には現れにくい助け合いが、食卓と人のつながりの両方を支えている。政策がこの見えにくい仕組みを認めるべきだ、という主張につながる。", "unverified": "聞き取りの人数、調査期間、分析の手順は抄録になく未確認。"}}, {"id": "jr26", "rank": 26, "headline": "30代の仕事の不満は老後の孤立と関連する", "title": "Work Dissatisfaction in Established Adulthood and Social Isolation at Older Ages: Gendered Patterns of Family and Friend Confidant Ties.", "url": "https://doi.org/10.1177/01640275261510862", "authors": "Campbell C ほか", "venue": "Research on aging", "date": "2026-11-24", "sjr": 0.93, "citescore": 5.4, "citescore_year": "2025", "apa": "Campbell, C., & Oliva, G. (2026). Work Dissatisfaction in Established Adulthood and Social Isolation at Older Ages: Gendered Patterns of Family and Friend Confidant Ties. Research on Aging. https://doi.org/10.1177/01640275261510862", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "30代半ばに仕事に不満だった人は、50〜70代になって親しく相談できる家族や友人がいない状態になりやすいことを、長期の追跡データで示した。", "p3": "ウィスコンシン縦断研究のデータ（8,232人・時点）で、30代半ばの仕事への不満と、50代・60代・70代での親しい相談相手（家族・友人）の不在との関連を、社会経済的な地位、家族、幼少期の背景を調整して調べた（抄録）。", "p5": "仕事への不満が高いほど、のちに家族にも友人にも相談相手がいないオッズが高かった。この関連は、もともとの友人との接触を調整しても残った。男女差は友人関係に集中し、仕事の不満とのちの友人の不在の関連は男性で女性よりかなり強かった（抄録）。", "fun": "老後の孤立は、年を取ってから急に始まるわけではないのかもしれない。この研究は、同じ人たちを長年追いかけたデータを使い、30代半ばに仕事に不満を持っていた人ほど、50代以降に親しく話せる相手がいない状態になりやすいことを見つけた。とくに男性の友人関係でその傾向が強い。働き盛りの仕事の経験が、ずっと後の人づきあいにまで関わるという話だ。", "unverified": "オッズ比の具体的な値、仕事の不満の測り方は抄録になく未確認。観察研究で因果は確定しない。"}}, {"id": "jr27", "rank": 27, "headline": "板状粒子の鉱滓でも限界状態理論で液状化を説明", "title": "Investigation of the Instability of Platinum Tailings in Direct Simple Shear Space", "url": "https://doi.org/10.1061/jggefk.gteng-14769", "authors": "Mohammad Emdadul Karim ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-11-25", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Karim, M. E., Rahman, M. M., Karim, M. R., Fourie, A. B., & Reid, D. (2027). Investigation of the Instability of Platinum Tailings in Direct Simple Shear Space. Journal of Geotechnical and Geoenvironmental Engineering, 153(2). https://doi.org/10.1061/jggefk.gteng-14769", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "薄い板のような粒子からなる白金の鉱滓でも、土の力学の標準的な枠組みである限界状態理論が使えることを示し、せん断応力を保ったまま有効応力が下がるときの液状化の条件を調べた。", "p3": "単純せん断試験機を使い、体積一定の試験、通常の排水単純せん断試験、せん断応力一定の排水試験（CSD）を行い、限界状態理論の枠組みでせん断挙動を分析した（抄録）。", "p5": "粒子の形が特異でも限界状態理論は適用できた。CSD条件での静的液状化は、有効応力の低下だけでなく間隙水圧の上昇によっても引き起こされうる。有効応力が下がる速さが液状化の始まりを左右し、排水条件を保てる最大の低下速度を見積もる簡易法を評価した（抄録）。", "fun": "鉱石から金属を取り出したあとに残る細かい粒（鉱滓）は、砕く工程を経ているので、自然の土とは粒の形が違う。この研究は、粒が薄い板の形をした白金の鉱滓で、かかる力は変えずに粒どうしを押さえる力だけが減っていく状況を試験機で再現した。揺すらなくても、その力が減る速さしだいで液状のように崩れ始めることが分かった。速さが決め手になる点が面白い。", "unverified": "試験条件と数値（限界状態線、低下速度のしきい値）は抄録になく未確認。"}}, {"id": "jr28", "rank": 28, "headline": "角ばった粒子ほど強いが壊れやすいことをDEMで再現", "title": "Discrete element method analysis of macro-micro mechanical responses of calcareous sand considering particle angularity-breakage coupling effect", "url": "https://doi.org/10.3389/fmars.2026.1940364", "authors": "Danda Shi ほか", "venue": "Frontiers in Marine Science", "date": "2026-11-25", "sjr": 0.959, "citescore": 6.5, "citescore_year": "2025", "apa": "Shi, D., Fan, X., Guan, J., Zhu, J., Chao, Z., Cui, P., & Zhang, W. (2026). Discrete element method analysis of macro-micro mechanical responses of calcareous sand considering particle angularity-breakage coupling effect. Frontiers in Marine Science, 13. https://doi.org/10.3389/fmars.2026.1940364", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "粒が割れやすく形が不規則な石灰質の砂について、粒の角ばりと割れが強度にどう効くかを、粒子1つひとつを計算する個別要素法で調べた。", "p3": "個別要素法に、割れた粒子を破片に置き換える方法を組み込んだ粒子破砕モデルを作り、角ばりの度合いと拘束圧を変えた数値供試体で真三軸のせん断の模擬実験を行った（抄録）。", "p5": "角ばりが大きいほどピークのせん断応力比は高まるが、ピーク後の強度の低下も速かった。軸ひずみ30%で、角ばりの大きい供試体の相対破砕率は小さい供試体より約40%高かった。拘束圧が高いほど、角ばりが破砕に与える影響は強まった（抄録）。", "fun": "海に広く分布する石灰質の砂は、形が不規則で、しかも割れやすい。角ばった粒は強そうだが、割れやすくもある。この研究は計算機の中で砂粒を1つずつ動かし、その両面を確かめた。角ばった砂は最初は強いが、粒が割れ始めると強度の低下が速い。せん断の前半は角ばりが、後半は粒の割れが効くという役割の交代が面白い。", "unverified": "粒子数、モデルの較正と実験との照合は抄録になく未確認。"}}, {"id": "jr29", "rank": 29, "headline": "利用者レビュー10万件からAI統治への関心を抽出", "title": "AI governance through the eyes of users: a large-scale study of online reviews", "url": "https://doi.org/10.1108/itp-10-2025-1579", "authors": "Stefan Pasch", "venue": "Information Technology and People", "date": "2026-11-25", "sjr": 1.956, "citescore": 15.5, "citescore_year": "2025", "apa": "Pasch, S. (2026). AI governance through the eyes of users: a large-scale study of online reviews. Information Technology & People, 1–28. https://doi.org/10.1108/itp-10-2025-1579", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "AI製品の利用者レビューから、利用者が実際に気にしている「AIの統治」に関わる話題を取り出し、政策側の枠組みが見落としている領域を示した。", "p3": "レビューサイトG2.comのAI製品のレビュー10万件超に、BERTopicによるトピックモデルを当てて潜在的な話題を抽出し、意味的な類似度でAIの統治に最も関係する話題を特定した（抄録）。", "p5": "計画・調整・コミュニケーションといった組織の過程や、導入の基盤、データの扱い、分析といったAIの価値連鎖の各段階にわたる話題が見つかった。プライバシーや透明性は制度側の枠組みと重なる一方、プロジェクト管理、戦略づくり、顧客とのやり取りは見落とされていた（抄録）。", "fun": "AIをどう管理するかという議論は、ふつう政策担当者や専門家が原則を掲げる形で進む。この研究は逆に、実際にAI製品を使っている人たちのレビュー10万件超から、現場の関心を拾い上げた。するとプライバシーや透明性に加えて、プロジェクトの進め方や顧客対応といった、もっと実務に近い話題が出てきた。上からの原則と下からの声を見比べる発想が面白い。", "unverified": "抽出された話題の数、類似度のしきい値、レビューの期間は抄録になく未確認。"}}, {"id": "jr30", "rank": 30, "headline": "点予測が当たるLLMほど予測区間が狭すぎることがある", "title": "Calibration inversion and data-freshness characterize AI reliability in indeterminate domains", "url": "https://doi.org/10.1038/s41598-026-80543-9", "authors": "Kuldeep Kumar Pandit ほか", "venue": "Scientific Reports", "date": "2026-11-24", "sjr": 0.893, "citescore": 6.4, "citescore_year": "2025", "apa": "Pandit, K. K., Pandit, V. K., & Pandit, A. (2026). Calibration inversion and data-freshness characterize AI reliability in indeterminate domains. Scientific Reports. https://doi.org/10.1038/s41598-026-80543-9", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "消費者向けのLLM製品に翌日の数値を予測させると、点の予測が正確な製品が、自分で示す予測の幅を狭く見積もりすぎていることがあると示した。", "p3": "6つのLLM製品をiOSアプリから2026年2〜3月に使い、142回のセッションで調べた。そのうち1つの手順では、金融・天気・スポーツ・暗号資産の7つの変数について、翌日の予測と90%の予測区間を答えさせた（抄録）。", "p5": "区間が実際の値を含んだ割合は、65.7〜80.0%の群（Claude、ChatGPT、Grok）と22.9〜29.7%の群（Gemini、DeepSeek、Perplexity）に分かれた。Geminiは点予測が最も正確な部類だったが、区間の幅が全体の中央値の約半分で、被覆は29.7%（37回中11回）だった（抄録）。", "fun": "「明日の値はこのくらいで、90%の確率でこの範囲に入る」と答える予報があったとする。予想がよく当たるなら、範囲の言い方も適切だと思いたいが、AIではそうとは限らなかった。あるAIは予想の中心はよく当たるのに、範囲を狭く言いすぎて、90%と言いながら実際には29.7%しか範囲に入らなかった。答えの正確さと、自分の確かさを正しく言えるかどうかは別の能力だと分かる。", "unverified": "記述的な結果で、製品6つ・少ない予測数にもとづくと著者が述べている。各変数の誤差の詳細は抄録の範囲では未確認。"}}, {"id": "jr31", "rank": 31, "headline": "ウクライナ侵攻後に石油・ガス企業は利益を小さく見せた", "title": "Earnings Management of Oil & Gas Firms After the Russian Invasion of Ukraine", "url": "https://doi.org/10.1007/s10551-026-06490-7", "authors": "Jochen Bigus ほか", "venue": "Journal of Business Ethics", "date": "2026-11-25", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "apa": "Bigus, J., Georgiou, N., & Hain, N. (2026). Earnings Management of Oil & Gas Firms After the Russian Invasion of Ukraine. Journal of Business Ethics. https://doi.org/10.1007/s10551-026-06490-7", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ロシアのウクライナ侵攻のあと、欧州の石油・ガス企業が利益を小さく見せる方向の利益調整を行っていたことを示した。", "p3": "差分の差分の設計で、侵攻後の欧州の石油・ガス企業の利益調整を、発生主義による調整と実体的な活動による調整の両方について、対照企業と比べた（抄録）。", "p5": "利益を減らす方向の有意な利益調整が見られ、2022年の第3四半期と2023年の第1四半期でとくに顕著だった。超過利潤税を導入した国と、民主的な統治の強い環境で実体的な利益調整が強く、サステナビリティの評点が低い企業に効果が集中していた（抄録）。", "fun": "会社は利益を大きく見せたがるもの、と思われがちだ。ところが政治的な危機でエネルギーの値段が跳ね上がったとき、欧州の石油・ガス会社は逆に、利益を小さく見せる方向に動いた。並外れて高い利益は倫理に反すると見られかねず、評判を損なうからだ。決算の数字は、税金だけでなく世間の目も気にして動くことがある、という会計の一面が見える。", "unverified": "利益調整の大きさの数値、標本の企業数と期間は抄録になく未確認。"}}, {"id": "jr32", "rank": 32, "headline": "汚職対策の強化は困窮企業の再建を助ける", "title": "Institutions and corporate financial distress in Central and Eastern Europe", "url": "https://doi.org/10.1007/s10657-021-09702-9", "authors": "Nicolae Stef", "venue": "HAL (ART) European Journal of Law and Economics", "date": "2026-11-25", "sjr": 0.579, "citescore": 3.1, "citescore_year": "2025", "apa": "Stef, N. (2021). Institutions and corporate financial distress in Central and Eastern Europe. European Journal of Law and Economics, 52(1), 57–87. https://doi.org/10.1007/s10657-021-09702-9", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "中東欧の上場企業で、汚職対策が強まった国ほど、財務的に行き詰まった企業が立ち直りやすいことを示した。", "p3": "2004〜2017年に財務的な困難に陥った中東欧の上場企業823社を対象に、制度の質と財務の特徴の内生性を統制した動学パネル推定で、制度の環境と財務困窮からの回復の関連を調べた（抄録）。", "p5": "汚職対策の強化は、企業の財務の健全性の回復に寄与していた。賄賂と官僚的な手続きによる費用を減らすことで、困窮を乗り越える企業の努力を助けると解釈される。複数の国が金融危機の前か直後に汚職対策機関を設けていた（抄録）。", "fun": "会社が財務的に行き詰まったとき、立ち直れるかどうかは、その会社の努力だけで決まるのだろうか。この研究は、国の制度、とくに汚職対策が効くことを示した。賄賂や役所の手続きにかかる費用が減れば、そのぶん立て直しがしやすくなる。経営の話に見える「会社の再生」が、国の制度の質とつながっているという視点が面白い。", "unverified": "効果の大きさ、制度の質の指標、国別の内訳は抄録になく未確認。"}}, {"id": "jr33", "rank": 33, "headline": "路面の3次元点群に合成のひび割れと穴を埋め込む", "title": "Synthetic Road-Surface Defect Generation for 3D Point Cloud Segmentation", "url": "https://doi.org/10.1093/jcde/qwag108", "authors": "Hyung Ju Lee ほか", "venue": "Journal of Computational Design and Engineering", "date": "2026-11-24", "sjr": 1.15, "citescore": 12.3, "citescore_year": "2025", "apa": "Lee, H. J., Song, J., & Yoon, S. (2026). Synthetic Road-Surface Defect Generation for 3D Point Cloud Segmentation. Journal of Computational Design and Engineering. https://doi.org/10.1093/jcde/qwag108", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社がCrossrefに登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "道路の路面の3次元点群に、合成したひび割れとポットホール（穴）を埋め込んで学習用のラベルつきデータを作り、点群の分類モデルがどこまで見分けられるかを評価した。", "p3": "ランダムウォークでひび割れの経路を、パーリンノイズとガウス型の減衰でポットホールの形と深さを作る。計測で生じる欠測領域を別に模擬し、その縁に補助のラベルを付ける。PointNet、PointNet++、DGCNNをそれぞれ3回学習し、学習に使っていない2つの道路の場面で評価した（抄録）。", "p5": "PointNet++が4クラスの平均mIoUで最も高く、2つの場面で85.27±1.28%と84.64±1.21%だった。ひび割れのIoUはDGCNNが両方の場面で最も高かった。深さのノイズの効果は小さいか、場面によって変わった（抄録）。", "fun": "道路の傷みを立体のデータからAIに見つけさせたいが、「ここがひび、ここが穴」と印を付けた手本のデータは足りない。そこでこの研究は、路面のデータに、計算で作ったひびと穴を埋め込むことで手本を作った。本物の傷を集める代わりに合成の傷で練習させる、というやり方で、どの型のAIが何を得意とするかを比べている。", "unverified": "実際の路面の損傷での検証は、3つの切り出しによる定性的な観察にとどまると読める。合成した損傷の寸法の詳細は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "タクシーのGPSで都市の中心性と移動の関係を捉える", "title": "A Multi-Source Framework Integrating Urban Centrality and Taxi Mobility Dynamics for Smart Mobility Planning", "url": "https://doi.org/10.3390/smartcities9120203", "authors": "Pawinee Iamtrakul ほか", "venue": "Smart Cities", "date": "2026-11-25", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Iamtrakul, P., & Saraphol, P. (2026). A Multi-Source Framework Integrating Urban Centrality and Taxi Mobility Dynamics for Smart Mobility Planning. Smart Cities, 9(12), 203. https://doi.org/10.3390/smartcities9120203", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "衛星画像や施設の分布から都市の「中心」を特定したうえで、タクシーのGPSデータを重ね、都市の構造とタクシーの動きの関係を捉える二段階の枠組みを示した。", "p3": "バンコクを対象に、約30年分の衛星画像、POI、交通網のデータを統合して形態的な中心と機能的な中心を特定し、次に1か月分のタクシーのGPSデータで、運行の空間的・時間的なパターンを調べた（抄録）。", "p5": "23の都市の中心が特定され、形態的な中心性と機能的な中心性は必ずしも一致しなかった。タクシーの存在と移動は、統合された都市の中心と公共交通の施設の周辺に集中し、停車や待機は別の空間的・時間的なパターンを示した（抄録）。", "fun": "都市の「中心」はどこか。建物の形から見た中心と、施設が集まる機能の面から見た中心は、同じとは限らない。この研究は、衛星画像などからバンコクの中心を23か所見つけ、そこにタクシーの位置の記録を重ねた。タクシーは街を走る動くセンサーのようなもので、走っている場所と、止まって待つ場所の違いから、街の使われ方が見えてくる。", "unverified": "タクシーの台数とデータの件数、中心の特定方法の詳細は抄録になく未確認。"}}, {"id": "jr35", "rank": 35, "headline": "粒子間の水の橋の形を格子ボルツマン法で再現", "title": "Phase-field lattice Boltzmann study of air–water capillary bridge geometry", "url": "https://doi.org/10.1016/j.compgeo.2026.108051", "authors": "Nabil Younes ほか", "venue": "HAL (ART) Computers and Geotechnics", "date": "2026-11-25", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Younes, N., & Millet, O. (2026). Phase-field lattice Boltzmann study of air–water capillary bridge geometry. Computers and Geotechnics, 196, 108051. https://doi.org/10.1016/j.compgeo.2026.108051", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "粒と粒の間にできる水の橋（液架橋）の形を、気体と液体を同時に扱う格子ボルツマン法で精密に再現した。", "p3": "非圧縮性流体のナビエ・ストークス方程式と、界面の動きを表すアレン・カーン方程式を組み合わせたフェーズフィールド型の多相の格子ボルツマン法を使い、密度差の大きい空気と水の系を、濡れの境界条件つきでGPU上で計算した（抄録）。", "p5": "2次元・3次元の標準的な検証で濡れの挙動を確かめたうえで、2つの球形の粒子の間の軸対称の液架橋を、粒子間の距離を変えて計算した。結果はヤング・ラプラスの解析解とよく一致し、平均曲率の符号の反転といった特徴も再現した（抄録）。", "fun": "水を少し含んだ土では、粒と粒の間に小さな水の橋ができて、粒どうしを結びつける。この研究は、その水の橋の形を、水と空気の境目の動きまで含めて計算機で再現し、古くから知られる理論の式とよく合うことを確かめた。粒の間のごく小さな水のふるまいが、水を含んだ土全体の力学を理解する土台になる、という積み上げの研究だ。", "unverified": "計算の解像度、誤差の数値、対象にした接触角は抄録になく未確認。"}}, {"id": "jr36", "rank": 36, "headline": "車両と橋梁の相互作用を入れたRC橋の供用寿命評価", "title": "A risk-informed reliability-based framework for service-life assessment of reinforced concrete bridges in India considering vehicle-bridge interaction under operational conditions", "url": "https://doi.org/10.1016/j.ijdrr.2026.106568", "authors": "Irfan Sahidullah ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-25", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "apa": "Sahidullah, I., Biam, E., Fernandes, T. M., Dutta, S., Adak, D., Majumdar, S., & Lopez, R. H. (2026). A risk-informed reliability-based framework for service-life assessment of reinforced concrete bridges in India considering vehicle-bridge interaction under operational conditions. International Journal of Disaster Risk Reduction, 106568. https://doi.org/10.1016/j.ijdrr.2026.106568", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "車両が走るときの橋との相互作用を取り入れて、鉄筋コンクリート橋の供用寿命を、想定した劣化のシナリオごとに確率的に評価する枠組みを示した。", "p3": "3次元の有限要素解析で検証した2次元の車両・橋梁相互作用モデルで、構造の劣化と路面の凹凸を考慮しながら、標準の車両荷重と較正した車両荷重のもとでの応答を求める。ガウス過程回帰の代理モデルと一次信頼性法で時間依存の信頼性解析を行う（抄録）。", "p5": "実際の車両の通過時の現地計測で、供用状態でのモデルを独立に検証したと述べる。抄録には信頼性指標や供用年数の数値は示されていない（抄録）。", "fun": "橋はいつまで使えるのか。答えを出すには、車が走ったときに橋がどう揺れるかを知る必要があるが、その揺れは車と橋が互いに影響し合って決まり、路面のでこぼこや橋の傷み具合でも変わる。この研究は、その揺れの計算を軽い代用のモデルに置き換え、傷みが進むシナリオごとに信頼性を計算できるようにした。実際の車の通過で確かめている点も大事だ。", "unverified": "対象の橋の諸元、劣化シナリオの内容、信頼性指標と供用寿命の数値は抄録になく未確認。"}}, {"id": "jr37", "rank": 37, "headline": "携帯型IMUで列車の車体振動に走行位置を付ける", "title": "Mileage Positioning for Train Carbody Vibration Data Using a Portable Inertial Measurement Unit", "url": "https://doi.org/10.1016/j.cacaie.2026.100279", "authors": "Hengdan Liang ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-26", "sjr": 2.155, "citescore": 14.7, "citescore_year": "2025", "apa": "Liang, H., Wang, F., Tang, Y., Wang, Z., & Zhuang, Y. (2026). Mileage Positioning for Train Carbody Vibration Data Using a Portable Inertial Measurement Unit. Computer-Aided Civil and Infrastructure Engineering, 100279. https://doi.org/10.1016/j.cacaie.2026.100279", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録は取得できず、SSRNに登録された同じ題名の原稿の抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "列車に持ち込んだ携帯型の慣性計測装置だけで、車体の振動データが線路のどの位置（キロ程）で取られたかを、外部の機器なしに数メートルの精度で特定する方法を示した。", "p3": "複数の領域の特徴を融合する深層学習モデルで停止・直線走行・曲線走行を識別し、線路の地理情報を事前知識として初期の方位合わせを行い、走行状態に応じて制約つきの観測方程式を切り替える適応フィルタで航法の誤差を抑える（抄録）。", "p5": "複数の都市鉄道の路線での現地試験で、キロ程のずれは5mを超えず、平均誤差は±2m以内だった（抄録）。", "fun": "列車の揺れを小さな携帯型の装置で測れば、安く高い頻度でデータが集まる。ただし困るのは、その揺れが「線路のどこで」起きたのかが記録に残らないことだ。この研究は、止まっているのか、まっすぐ走っているのか、曲がっているのかを揺れから見分け、線路の形の知識と組み合わせて位置を割り出した。外の機器に頼らずに、ずれが5mを超えなかったという。", "unverified": "出版版の本文と抄録は入手できず、SSRNの原稿の抄録にもとづく。出版版で数値が変わっている可能性、試験の路線数と走行距離は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "マイク内蔵タイヤで道路インフラの状態を監視", "title": "マイクロフォン搭載タイヤによる道路インフラモニタリング方法", "url": "https://doi.org/10.1299/jsmeiip.2026.IIP-H5-5", "authors": "谷 弘詞 ほか", "venue": "IIP情報・知能・精密機器部門講演会講演論文集", "date": "2026-11-25", "apa": "TANI, H., ISHIDA, K., LU, R., & KOGANEZAWA, S. (2026). マイクロフォン搭載タイヤによる道路インフラモニタリング方法. The Proceedings of the Conference on Information, Intelligence and Precision Equipment : IIP, 2026(0), IIP–H5. https://doi.org/10.1299/jsmeiip.2026.iip-h5-5", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された英語の抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "タイヤの内側に取り付けた小型マイクの音から、ふつうに走るだけで路面の段差や舗装の劣化、橋の上での振動の変化まで捉えられることを示した。", "p3": "タイヤの内部にMEMSマイクロフォンを設置し、通常の走行中の音を測る。タイヤの空洞共鳴を抑えて検出の感度を上げるため、吸音材を取り付けた。室内実験と現地の実験で確かめた（抄録）。", "p5": "路面の段差、舗装の劣化、橋による振動の減衰をはっきり検出できた。とくに橋の上では700〜800Hz付近の高調波成分が大きく減り、そのピークの比は橋の年齢とともに下がった（抄録）。", "fun": "タイヤの中にマイクを入れて走る。それだけで道路や橋の状態が分かるかもしれない、という研究だ。タイヤは路面にじかに触れているので、でこぼこや傷みが音として伝わる。面白いのは橋の上で特定の高さの音が小さくなり、その比が橋の古さとともに変わっていたことだ。車がふつうに走るだけで手がかりが集まれば、小さな橋まで見守りやすくなる。", "unverified": "講演論文の抄録にもとづく。実験した橋の数、車速、ピーク比と橋の年齢の関係の強さ（数値）は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "多点の振動からチャープ成分を分けてモードを同定", "title": "An iterative method with Fourier series for multi-channel blind chirp component source separation in structural modal analysis", "url": "https://doi.org/10.1016/j.ymssp.2026.115280", "authors": "Pengfei Jin ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-25", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Jin, P., Shi, Z., Sun, G., Peng, X., & Wang, G. (2027). An iterative method with Fourier series for multi-channel blind chirp component source separation in structural modal analysis. Mechanical Systems and Signal Processing, 263, 115280. https://doi.org/10.1016/j.ymssp.2026.115280", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけにもとづく", "preprint": false, "short": true, "p1": "多チャンネルの振動信号に混ざったチャープ成分（時間とともに周波数が変わる成分）を、発生源ごとに分けて取り出す反復的な方法を、構造のモード解析のために提案する論文と読める（題名から）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物の揺れには、いくつもの振動が重なっている。しかも条件が変わると、それぞれの振動の高さが時間とともに滑るように変わることがある。重なったまま、しかも高さが動く成分を、もとの一つひとつに分けられるか、というのが題名から読み取れる問いだ。何人もが同時に、音程を変えながら歌う声を聞き分けるのに似た難しさがある。", "unverified": "抄録・本文を入手できず、方法、データ、結果はすべて未確認。"}}, {"id": "jr40", "rank": 40, "headline": "浮体の揺れから波の高さを逆算する", "title": "Floating structures as wave buoys: Wave elevation estimation from dynamic responses of floating structures", "url": "https://doi.org/10.1016/j.ymssp.2026.115231", "authors": "Yujie Gan ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-25", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Gan, Y., Li, L., Lin, Q., Liu, W., Su, Q., Zhao, X.-L., & Lai, Z. (2027). Floating structures as wave buoys: Wave elevation estimation from dynamic responses of floating structures. Mechanical Systems and Signal Processing, 263, 115231. https://doi.org/10.1016/j.ymssp.2026.115231", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録は取得できず、SSRNに登録された同じ題名の原稿の抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "海に浮かぶ構造物の揺れそのものを波の計測器として使い、構造物の応答から波の高さの時間変化と波のスペクトルを逆算する枠組みを示した。", "p3": "まず、簡略化した解析モデルとニューラル常微分方程式を組み合わせた、物理を取り入れた学習モデルで、波を受ける浮体の動きを代理する。次に、この順方向のモデルにもとづいて波による荷重を逆同定し、そこから波高の時刻歴とスペクトルを再構成する（抄録）。", "p5": "波だけを受ける縮尺模型の浮体式洋上風車の実験で検証した。代理
