<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

を読めず、曲面の形状、破壊確率の数値、検証方法は確認できなかった。"}}, {"rank": 2, "theme": "VBI・橋梁SHM", "headline": "1回の計測の瞬時振動数から区間FEモデル更新", "title": "Time-varying uncertainty quantification and interval finite element model updating using instantaneous modal frequencies", "url": "https://doi.org/10.2139/ssrn.7533244", "authors": "Jinyan Li ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr02", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "繰り返し実験をせず、1回だけの計測から瞬時固有振動数（instantaneous modal frequency, IMF）の区間を求め、それを使って構造パラメータを区間として更新する有限要素モデル更新（FEMU）の枠組みを示した（抄録）。", "p2": "不確実性を扱うFEMUは、繰り返し実験でばらつきのデータを集めるのが普通で、条件が時間とともに変わり同じ試験を繰り返せない系には使いにくい（抄録）。", "p3": "短時間線形変化自己回帰移動平均（STLV-ARMA）法で時変系のIMFの区間を同定し、その区間の変動で時変の不確実性を表す。区間表現の漸近的な完全性と一貫性を理論的に示し、IMF区間を入力とする区間FEMUで不確実な構造パラメータを同定する。区間の過大評価を減らし効率を上げるため制約区間アルゴリズム（CIA）を組み込む（抄録）。", "p4": "3自由度のばね-質量系の数値例と、時変の梁の実験で検証した（抄録）。評価指標（真値の区間を含むか、区間幅など）の詳細は未確認。", "p5": "提案枠組みは、再現できない1回の実験から不確実性を定量化し、区間の構造パラメータを正確に更新できたと報告している（抄録）。具体的な誤差・区間幅の数値は抄録にない。", "p6": "検証は小規模な数値系と実験室の梁に限られる（抄録）。解釈：区間の幅は同定窓の長さやARMA次数の選択に依存しうるため、その感度と、雑音の大きい実構造での有効性は未確認。未査読のプレプリントである。", "unverified": "本文を読めず、CIAの具体的な定式化と実験の数値結果は確認できなかった。"}}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "似た構造の集団で損傷同定を移す物理流れモデル", "title": "Physics-informed flow model for structural damage localization and quantification in populations of structurally similar systems", "url": "https://doi.org/10.2139/ssrn.7533387", "authors": "Luigi Caglio ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr03", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "似た構造の集団（population）で、ある構造で学んだ損傷の効き方を別の構造へ移す際に、移せる条件を固有値の摂動理論から明示した物理情報付きの損傷同定モデルを示した（抄録）。", "p2": "データ駆動の損傷同定は個々の構造で訓練されるが、対象構造の損傷時のデータはほとんど得られない。集団ベースのSHM（PBSHM）は類似構造間で知識を移すが、移転が成功する条件の理論的保証がなかった（抄録）。", "p3": "固有値の損傷による変化を損傷の程度の2次多項式で表し、固有値に非線形の特徴変換をかけて、集団で共通の「損傷係数」と構造固有の性質を分離する（多項式ベースのflow model）。係数は元の構造（source）で学び、摂動理論から係数が集団内で不変となる数学的条件を導いて移転可能性の判定基準とする。損傷の位置と程度は最適化で同時推定する（抄録）。", "p4": "せん断型建物モデルの集団と2次元骨組で、性質のばらつきが小さい場合と大きい場合を数値的に検証した（抄録）。評価指標は位置と程度の同定精度。", "p5": "すべての場合で、対象構造の損傷時データなしに高い位置・程度の同定精度を得たと報告している（抄録）。具体的な精度の数値は未確認。", "p6": "検証は数値モデルのみで、環境変動（温度など）や計測雑音、実構造での検証は抄録に記載がない。解釈：固有値のみを特徴とするため、固有値の感度が低い局所損傷では識別が難しい可能性がある。未査読のプレプリントである。", "unverified": "本文を読めず、判定基準の式と精度の数値は確認できなかった。"}}, {"rank": 4, "theme": "VBI・橋梁SHM", "headline": "LSTMとEKFで急変する振動数・減衰を追跡", "title": "Fast-varying Natural Frequencies and Damping Ratio Identification for Linear Time-Varying System", "url": "https://doi.org/10.2139/ssrn.7533386", "authors": "Melisa Bozaci ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr04", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "運転条件で固有振動数が速く変わる線形時変（Linear Time-Varying, LTV）構造について、長短期記憶ネットワーク（LSTM）と拡張カルマンフィルタ（EKF）を組み合わせ、変化する固有振動数と減衰比を同定する方法を示した（抄録）。", "p2": "風・波浪を受ける洋上風車のように振動数が運転中に速く変わる系では、定常を仮定する従来の同定（共分散駆動型の確率的部分空間法 SSI-cov など）は追随が難しく、減衰比の同定はさらに難しい（抄録）。", "p3": "入力は複数点の変位・速度計測、仮定したモード減衰比、振動数の時間依存を近似する物理モデルの3つ。EKFの推定値で学習したモデルと物理モデルのデータで学習したモデルを作り、前者は減衰の仮定に敏感、後者は頑健という性質の差を利用して、両者の誤差（RMSE）が最小になる減衰比を格子探索で求める（抄録）。", "p4": "2枚翼の洋上風車の有限要素モデルで現実的な環境・運転条件の合成データを作り、1次前後方向（FA-1）モードを対象にした。減衰比を誤って与えた場合の頑健性と、複数の運転条件での適用性を評価し、減衰比はSSI-covと比較した（抄録）。", "p5": "FA-1モードの速く変わる固有振動数を最大RMSE 1.2×10⁻³ Hzで同定した（抄録）。減衰比は格子探索で良い近似が得られ、SSI-covより大きく改善したとしている（抄録）。減衰比の誤差の数値は抄録にない。", "p6": "検証は合成データのみで、実測での検証はない（抄録）。解釈：振動数の時間依存を近似する物理モデルが手元にあることが前提で、それがない構造（例：車両が通過する橋）への適用には別途モデル化が必要。未査読のプレプリントである。", "unverified": "本文を読めず、減衰比の同定誤差の数値と、ネットワーク構成の詳細は確認できなかった。"}}, {"rank": 5, "theme": "会計情報科学", "headline": "反実仮想説明の型を公理から体系化", "title": "Axiomatic Foundations of Counterfactual Explanations", "url": "https://doi.org/10.65109/CKPK5561", "authors": "Leila Amgoud ほか", "date": "2026-09-27", "venue": "HAL", "id": "pr05", "explain": {"basis": "抄録", "basis_note": "HALの本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "反実仮想説明（counterfactual explanation：「どう変われば判断が変わったか」を示す説明）を、望ましい性質を公理として並べる公理的枠組みで整理し、5つの根本的に異なる型の反実仮想があることを示した（抄録）。", "p2": "既存の説明器は1種類の反実仮想だけを扱い、個々の事例についての局所的な説明に限られていた。反実仮想の型の体系的な比較や、システム全体の推論を示す大域的な反実仮想の研究がなかった（抄録）。", "p3": "説明器が満たすべき性質を公理として定め、同時に満たせない公理の組み合わせを示す不可能性定理を証明し、両立する組をすべて特徴づける。さらに表現定理で、公理の部分集合と、それを満たす説明器の族との5つの一対一対応を示す（抄録）。背景：これは社会的選択理論などで使われる公理的アプローチを説明可能AIに当てはめたものである。", "p4": "理論研究であり、実データによる検証はない。既存の説明器をこの分類に位置づけ、その振る舞いを形式的に特徴づけ、説明の生成の計算量を分析している（抄録）。", "p5": "5つの型のうち一部は局所的説明、他は大域的説明に対応する（抄録）。どの型がどの既存手法に当たるか、計算量の結果の具体的な内容は抄録からは未確認。", "p6": "公理の選び方自体が妥当かは利用場面に依存し、利用者にとっての分かりやすさなどの実証は範囲外（解釈）。HALに登録された論文で、査読の有無は未確認のため未査読として扱う。", "unverified": "本文を読めず、5つの型の定義、不可能性定理の具体的な公理の組、計算量の結論は確認できなかった。"}}, {"rank": 6, "theme": "包摂的コミュニティ・社会", "headline": "結束型と橋渡し型の関係は効く先が違う", "title": "Different ties, different returns? Bonding and bridging social capital across mental health and academic transitions", "url": "https://doi.org/10.5281/zenodo.22999350", "authors": "Pohlenz ほか", "date": "2026-09-27", "venue": "Zenodo", "id": "pr06", "explain": {"basis": "本文", "basis_note": "Zenodo版の本文PDF（データと方法・結果の節、表3〜5）を読んだ。考察・限界の節は一部のみ確認", "preprint": true, "p1": "ドイツの大学生コホートを10年追い、同級生との結束型（bonding）の関係は孤独感を通じて後の心の不調を減らす一方、教員との良好な関係（橋渡し型 bridging の代理指標）が博士課程進学に結びつくとは確認できない、と関係の種類で「効く先」が違うことを示した（抄録、§4.2–4.3）。", "p2": "大学での人間関係は一括りに「社会関係資本」として扱われがちで、同級生との横のつながりと教員との身分を越えたつながりが、心の健康と進路という別々の結果にどう効くかを長期データで分けて検証した研究は少ない（§1–2）。", "p3": "ドイツ全国教育パネル（NEPS）の開始コホート5（2010/11年入学、17,909人、2022年まで）を使い、2012年の同級生との結束（3項目、α=.84）と教員との関係（4項目、α=.79）→2013年の孤独感（1項目）→2017・2019・2020・2022年の「心の調子が悪かった日数」（過去30日、0〜30）という時間順の媒介モデルを最小二乗法（PROCESS Model 4、ブートストラップ5,000回）で推定した（§3.1–3.3）。博士課程への初進学はロジスティック回帰、2020・2022年の不調日数は2019年の値で調整した負の二項回帰で分析した（§3.3）。", "p4": "媒介モデルのサンプルは3,429〜4,365人、博士進学モデルは2,245人（初進学161件）（§3.1）。基準は、間接効果（結束→孤独→不調）のブートストラップ95%信頼区間が0を含まないこと、オッズ比（OR）・発生率比（IRR）の信頼区間である（§3.3）。", "p5": "結束が強いほど孤独感が低く（経路a、B=−0.3256〜−0.3366）、孤独感は不調日数を増やし（経路b、B=0.6238〜1.2787）、間接効果は4時点すべてで信頼区間が0を含まなかった（B=−0.2031〜−0.4280、2020年が最大）（表3）。教員との関係と博士進学はOR=1.404（95%CI 0.956–2.063、p=.084）で確かとは言えず（表4）、2019年の不調を調整すると、どちらの関係も2020・2022年の不調とは一貫した関連を示さなかった（表5）。", "p6": "著者は、観察研究で因果効果は識別できず、関係への自己選択やパネル脱落を除けないこと、重み付けをしていないので母集団の効果ではないこと、教員との関係の指標は実際の情報提供や推薦を観測していないことを認めている（§3.2–3.3）。解釈：孤独感は1項目で、結果変数の説明率（R²）は.035〜.060と小さい（表3）。Zenodoに置かれた未査読のプレプリントである。", "unverified": "表3の信頼区間は抽出テキストで符号が一部欠けており、本文の記述（すべて0を含まない）で確認した。考察の節の全文は読んでいない。"}}, {"rank": 7, "theme": "LLM熟議・ペルソナ", "headline": "AI助言は政治判断を動かすが本人は自覚しない", "title": "AI advice shifts political choices while people continue to experience them as their own", "url": "https://doi.org/10.2139/ssrn.7532151", "authors": "Esme Stanford-Durkin", "date": "2026-09-27", "venue": "SSRN", "id": "pr07", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMが作った推薦は架空の選挙での投票先を推薦された候補へ約17.5ポイント寄せる一方、推薦を受けた人も自分で考えて決めたと感じていた、という「行動は動くが自覚はない」乖離を実験で示した（抄録）。", "p2": "LLMが日常の意思決定支援に入り込み、判断そのものを動かす懸念があるが、影響を受けた判断が本人に自分のものと感じられるか、出所の開示や内省の促しで影響を減らせるかは確かめられていなかった（抄録）。", "p3": "英国の成人三百人が6つの仮想の投票場面に答える実験で、5つの条件を比べた：助言なし（対照）、助言あり、助言がAI製だと開示、助言を見る前に選択を宣言させる介入、政策の優先順位を先に書かせる介入（抄録）。結果は推薦された候補との一致率と、判断の自己所有感・自分で推論した感覚の自己報告。", "p4": "対照群に対する推薦候補との一致率の差で影響を測り、自己所有感は対照群との統計的同等性で評価した（抄録）。検定の詳細（同等性の許容幅など）は抄録からは未確認。", "p5": "AIの推薦は一致率を対照より約17.5ポイント高めた（抄録）。AI製であることの開示は影響を弱めず、2つの内省介入もどちらも効かなかった（抄録）。推薦を受けた群の自己所有感・自己推論感は対照群と統計的に同等だった（抄録）。", "p6": "場面は仮想の投票で、実際の選挙での行動や長期の影響は測っていない（抄録から読み取れる範囲）。解釈：候補や争点の情報が少ない場面ほど助言の影響が大きくなりうるため、情報量を変えたときの頑健性は未確認。未査読のプレプリントである。", "unverified": "本文を読めず、条件ごとの一致率、同等性検定の基準、場面の具体的な内容は確認できなかった。"}}, {"rank": 8, "theme": "LLM熟議・ペルソナ", "headline": "公開LLMベンチマークの僅差は多くが検出不能", "title": "Which AI model is truly the best: how reliable are public benchmarks of frontier AI models?", "url": "https://doi.org/10.5281/zenodo.22998205", "authors": "Kankaraš ほか", "date": "2026-09-27", "venue": "Zenodo", "id": "pr08", "explain": {"basis": "本文", "basis_note": "Zenodo版の本文PDF（データ・方法・結果の一部・考察と限界の節、表1・2）を読んだ", "preprint": true, "p1": "公開されている項目単位の結果だけから61のAIリーダーボードの「成績表」を作り、上位の順位差の多くは統計的に区別できないことを示した（抄録、§5–6）。", "p2": "AIモデルの優劣はリーダーボードの1〜2点差で語られるが、その差がベンチマークの項目数と誤差で検出できる大きさなのかは、公表された順位表では示されていない（§1、§6）。", "p3": "HELM、Desai et al.、SWE-bench Verified、tau2-bench、Open LLM Leaderboardの保存版から、保守者が公開した項目単位の結果を再実行なしで使う（§3、表1）。各スコアに正答率のClopper–Pearson区間と項目の再標本化による誤差を付け、2モデルを共通項目上の正確McNemar検定で比べ、全ペアをBenjamini–Hochberg法で補正してq<.05を「本当の差」とする（§4）。順位を上から見て、首位と区別できたところで新しい層（tier）を作る。エージェント課題は課題ごとに平均し、符号反転の置換検定を使う（§4）。例：GPQAではGemini 3 Pro（80.3%）とGPT-5（79.1%）の差1.1点はq=0.661で区別できない（表2）。", "p4": "良さの基準は「その順位差を検出できるか」であり、測りたい能力を測れているか（妥当性）は評価の対象外（§6 限界）。上位5モデル間の10ペアのうち何ペアが本当の差か、首位が他と区別できるかを数える（§4）。", "p5": "何らかの識別ができる58のリーダーボードのうち55は上位5モデルを完全には分けられず、16は10ペアのどれも分けられず、40では首位が少なくとも1モデルと区別できない（抄録）。SWE-bench Verifiedでエージェントを固定するとClaude Opus 4.5と4.6は区別できず、精度は項目数の平方根則に従い（傾き−0.49）、tau2-benchではハーネスの版の違いだけで1モデルのスコアが14.9点動いた（抄録）。", "p6": "著者は、分離能力を評価するもので妥当性は判定しないこと、最新モデルはtau2-benchの1領域にしかないこと、モデル設定やプロンプトは各出典のままであることを限界に挙げている（§6）。解釈：項目を母集団からの標本とみなす前提に立つため、固定された問題集の成績だけに関心がある場合は区間の意味が変わる（著者も同旨）。Zenodoに置かれた未査読のプレプリントである。", "unverified": "結果の節のうち§5.3〜5.6（ハーネスの影響、データの欠陥）の詳細な数値は抄録の範囲でしか確認していない。"}}, {"rank": 9, "theme": "包摂的コミュニティ・社会", "headline": "交差遅延モデルの因果的結論は分析選択次第", "title": "Questionable prospective effects between shame, loneliness, and non-suicidal self-injury among Chinese adolescents: A reassessment of Chen et al. (2026)", "url": "https://doi.org/10.31234/osf.io/9rxy6_v1", "authors": "Kimmo Sorjonen ほか", "date": "2026-09-27", "venue": "PsyArXiv", "id": "pr09", "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）版の本文（方法・結果・考察と図2・3のキャプション）を読んだ", "preprint": true, "p1": "中国の青少年で恥・孤独感・非自殺性自傷が互いに将来を予測するとしたChen et al.（2026）の結論が、分析の仕方を変えると正にも負にもゼロにもなり、統合すると有意な効果が残らないことを示した再検討（抄録、Results）。", "p2": "交差遅延パネルモデルで有意な係数が出ても、それだけでは真の前向きの影響とは言えず、ベースライン調整に伴う回帰の人工産物などでも同様の推定値が生じうる（抄録、Introduction）。", "p3": "原データは入手できず著者も応答しなかったため、Chen et al.の報告した標本数と相関行列を再現する模擬データを生成した（Method）。背景：調整済みの回帰係数は変数間の相関構造で決まるので、相関行列を再現したデータで元の推定を近似できる。T1→T2とT2→T3の各区間で、①初期の結果変数を調整、②追跡時の結果変数を調整、③どちらも調整しない、の3通りで効果を推定し、ランダム効果メタ分析で統合した（Method、図2）。", "p4": "基準は、同じ前向き関係の複数の妥当な操作化（多元宇宙分析 multiverse analysis）を通じて効果の向きと大きさが一貫するかであり、統合効果の95%信頼区間が0を含むかで判断した（図2）。", "p5": "初期値を調整する通常の方法はChen et al.の結論を再現したが、追跡時の値を調整すると向きが逆転し、調整しない場合は小さく多くが非有意だった（Results、図2の効果1〜6）。メタ分析の統合効果はどれも0と有意に異ならなかった（図2の効果7）。直接の前向き経路を置かず、特性と持続する状態を仮定したモデルで観測相関をよく再現できた（図3、CFI=0.986、RMSEA=0.036）。", "p6": "原データではなく相関行列からの模擬データに基づくため、欠測や非正規性など相関行列に現れない特徴は反映されない（Method からの解釈）。解釈：3通りの仕様を同じ重みで統合することの妥当性には議論の余地がある。未査読のプレプリントである。", "unverified": "図2の各効果の具体的な推定値と、代替モデルのχ²の値（抽出テキストで欠落）は確認できなかった。"}}, {"rank": 10, "theme": "都市・インフラ政策", "headline": "ソウルの自転車共有の男女差を街路画像とVLMで分析", "title": "Beyond the Gender Gap: A Multi-Scale and Human–AI Assessment of Bike-Sharing Environments in Seoul, South Korea", "url": "https://doi.org/10.2139/ssrn.7531698", "authors": "Seung Jun Choi ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr10", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ソウルの公共自転車の2,799駅を男性多数・女性多数に分け、街路画像の解析と視覚言語モデル（VLM）の評価を人の評価と突き合わせて、利用の男女差が駅周辺の環境と「見え方」の違いにも現れることを示した（抄録）。", "p2": "自転車共有の男女差は利用回数などの記録で論じられることが多く、周辺の建造環境や、空間がどう知覚されるかという多面的な違いまでは十分に調べられていなかった。また、AIによる環境評価が人の評価とどこで食い違うかも不明だった（抄録）。", "p3": "2025年の利用記録から駅を男性多数・女性多数に分類し、都市形態の指標、SegFormerによる街路画像の意味的分割（緑・建物などの割合）、Places365による景観の独自性を複数の空間スケールで比べた。ChatGPTのVLMに自転車の走りやすさを採点・説明させ、人の監査者の評価と照合し、両者の不一致を最小二乗回帰で説明した（抄録）。", "p4": "比較は男女多数駅の環境指標の差と、VLMと人の評価の一致度（定量的な一致）である（抄録）。一致度の指標名と数値は抄録からは未確認。", "p5": "男性の利用回数が多く、女性は長い距離を走っていた（抄録）。女性多数の駅は土地利用の多様性・緑地・景観の独自性が高く、男性多数の駅は商業活動と安全関連の設備が多かった（抄録）。VLMと人の評価は中程度に一致したが、景観の独自性が高いほど両者の不一致が有意に大きくなった（抄録）。", "p6": "1都市・1年の記録で、駅の「男女多数」は利用者の構成の分類であり、環境が利用を生む因果関係は示していない（抄録からの解釈）。VLMの評価はプロンプトやモデルの版に依存しうる。未査読のプレプリントである。", "unverified": "本文を読めず、分類の閾値、一致度の数値、回帰係数は確認できなかった。"}}, {"rank": 11, "theme": "位相空間・土木三力学", "headline": "少ない崩壊記録では評価の仕方で結論が変わる", "title": "Where do slopes fail in Rudraprayag? A small-inventory landslide susceptibility study, and how evaluation choices change the answer", "url": "https://doi.org/10.31223/x5kb9j", "authors": "Gauri Makker", "date": "2026-09-27", "venue": "EarthArXiv", "id": "pr11", "explain": {"basis": "本文", "basis_note": "EarthArXiv版の本文PDF（方法・限界の節、表1・2と図4・5のキャプション）と抄録の数値を読んだ", "preprint": true, "p1": "インド・ヒマラヤのルドラプラヤグ県で、衛星画像から38件の斜面崩壊の記録を自作し、少ない記録での崩壊しやすさ（susceptibility）の評価が、非崩壊点の取り方と評価の仕方しだいで大きく過大評価されることを実例で示した（抄録）。", "p2": "崩壊しやすさ地図は機械学習で作られることが多いが、記録が少ない地域では、背景点（非崩壊点）の抽出や検証の設計によってAUCなどの成績が見かけ上高くなりうる。そもそも公開された崩壊記録もなかった（抄録、Introduction）。", "p3": "Sentinel-2の2025年モンスーン後の画像で、植生指数NDVI<0.2・傾斜>25°の裸地を候補として抽出し、高解像度画像で1件ずつ確認して38件の記録を作った（§4.1）。標高・傾斜・斜面方位・河川からの距離の4因子でランダムフォレストを学習し、空間交差検証で評価した。背景点を県全域から取る場合と各崩壊から3km以内で対応させる場合を比べ、背景点の抽出を20回やり直して成績の幅を示した（抄録、表2）。", "p4": "基準は空間ブロック内のAUCと、座標だけを使うモデル（地形情報なし）に勝てるかどうか。背景点の20回の抽出での平均と95%範囲を報告する（表2、図4）。", "p5": "県全域から背景点を取ると、座標だけのモデルが地形モデルとほぼ同じAUC（0.83対0.85）を出し、植生・土地被覆を加えたAUC 0.93〜0.95は崩壊を裸地として検出したことの循環にすぎなかった（抄録）。同じモデルでも背景点の抽出しだいでAUCは0.42〜0.86に振れた（抄録）。3km以内で対応させると地形モデルのAUCは平均0.74（95%範囲0.52〜0.85）で、座標のみのモデルに90%の抽出で勝った（抄録、表2）。20モデル平均の地図は、面積40%の上位2区分に検証用崩壊の87%を含んだ（抄録、図5）。", "p6": "著者は、1人の判読による38件で現地確認がないこと、2025年末に裸地で0.2ha以上のものしか検出できないこと、地質・断層・道路を入れていないこと、地図の38%が学習点から5km以上離れた外挿であること、降雨データが約11kmと粗いことを限界に挙げ、結果は暫定的としている（Limitations）。未査読のプレプリントである。", "unverified": "結果の節（Results）の本文と図4の各数値は抄録の範囲でのみ確認した。"}}, {"rank": 12, "theme": "位相空間・土木三力学", "headline": "衛星干渉SARで崩壊前の斜面運動を15事例検証", "title": "Pre-failure landslide kinematics patterns assessment using spaceborne multi-temporal interferometry", "url": "https://doi.org/10.2139/ssrn.7529147", "authors": "Mariana Ormeche ほか", "date": "2026-09-26", "venue": "SSRN", "id": "pr12", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "衛星の多時期干渉SAR（Multi-Temporal Interferometry, MTI）で得た崩壊前1年の変位時系列を15件の斜面崩壊で調べ、前兆の加速がどの型の崩壊で捉えられ、どの型で捉えられないかを4群に整理した（抄録）。", "p2": "崩壊前の検知は世界的な課題だが、崩壊前の運動（kinematics）は十分にわかっていない。MTIは数日ごとの再訪とミリ〜数十ミリの変位計測で一部の崩壊の速度域を捉えうるが、その能力は批判的に検証されていなかった（抄録）。", "p3": "3つの解析法を使う：3次クリープ（崩壊直前の加速段階）を検出する指数曲線のあてはめ、平均速度の計算、無次元化した傾向分析（抄録）。背景：3次クリープの加速を捉えることが斜面の崩壊時刻予測（例：福囿法）の前提になる。", "p4": "15件の崩壊の崩壊前1年の変位時系列を、加速段階が検出できるかで分類した（抄録）。比較対象や定量的な評価指標は抄録に記載がない。", "p5": "群1は末端（toe）で明確な加速が見え、崩壊の発生域を特定できた。群2は複数の区域で加速が見られ、複数箇所から始まる複合的な破壊の可能性を示した。群3は時系列の数は少ないが明確な加速があった。群4は加速段階がなくほぼ一定の速度で、別の破壊機構と考えられたが地質・地盤データがなく検討できなかった（抄録）。", "p6": "著者は、MTIは地表の運動しか捉えず干渉性と雑音の制約があるため推定した機構は示唆にとどまること、MTIは万能ではなく崩壊の型・データの質・解析法に依存することを認めている（抄録）。各群の件数は抄録からは未確認。未査読のプレプリントである。", "unverified": "本文を読めず、各群の件数、対象崩壊の所在、各手法の検出結果の数値は確認できなかった。"}}, {"rank": 13, "theme": "職場AI・組織行動", "headline": "ChatGPT後のAI露出産業の雇用鈍化は有意でない", "title": "The Impact of Artificial Intelligence Adoption on U.S. Employment Growth", "url": "https://doi.org/10.2139/ssrn.7518598", "authors": "Xuanwen Wang", "date": "2026-09-26", "venue": "SSRN", "id": "pr13", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ChatGPTの公開（2022年秋、November 2022）を外生的な出来事として、AIへの露出が高い米国の産業で雇用の伸びが鈍ったかを差の差（difference-in-differences, DiD）で推定し、鈍化の方向は見られるが統計的に有意ではないと報告した（抄録）。", "p2": "生成AIが雇用を置き換えるかは関心が高いが、公開後の期間が短く、産業レベルでの実証はまだ限られている（抄録）。", "p3": "米国労働統計局の雇用統計（CES、季節調整済み、2021年1月〜2026年6月）で14の主要産業を比べ、情報、金融、専門・ビジネスサービスをAI露出の高い処置群、それ以外を対照群としてChatGPT公開前後の雇用の推移の差を推定する（抄録）。", "p4": "処置群と対照群の雇用成長の差の、公開前後での変化（DiD推定量）とその有意性で評価する（抄録）。並行トレンドの検証などは抄録からは未確認。", "p5": "ChatGPT公開後、AI露出の高い産業の雇用成長は低い産業より遅かったが、差は統計的に有意ではなかった（抄録）。推定値の大きさは抄録にない。", "p6": "著者は、公開後3.5年と期間が短く推定が不精確なため確定的な結論は出せず、より長い期間と職種単位のデータが必要だとしている（抄録）。解釈：処置群は3産業だけで、同時期の金利上昇などの産業別ショックと区別しにくい。未査読のプレプリントである。", "unverified": "本文を読めず、推定値・標準誤差・事前トレンドの検定は確認できなかった。"}}, {"rank": 14, "theme": "会計情報科学", "headline": "LLMの古い知識が金融予測と意思決定を誤らせる", "title": "When the Market Moves but the Model Does Not: Stale Financial Information in LLMs", "url": "https://doi.org/10.2139/ssrn.7532758", "authors": "Sumanjay Dutta", "date": "2026-09-27", "venue": "SSRN", "id": "pr14", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMの金融予測が、学習データの知識の範囲（情報の境界）を越えると急に悪化し、最新の正しい価格を1つ与えるとほぼ回復し、誤った価格を与えるとそれをそのまま取り込むことを、4モデル・4資産の対応づけた予測で示した（抄録）。", "p2": "LLMを金融予測や投資判断に使う動きがあるが、古い情報や不正確な情報が予測をどれだけ損ない、それが経済的に意味のある損失になるかは体系的に調べられていなかった（抄録）。", "p3": "GPT-4o、GPT-4o-mini、Claude Sonnet 4.5、Llama 3.3 70Bに、ビットコイン・金・銀・S&P500の予測を、各モデル固有の情報境界の前後で対応づけて行わせる。条件は、記憶のみ、検証済みの最新値を与える、わざと歪めた価格を与える、古い値と新しい値を同時に与える、の4つ（抄録）。予測を共通の売買ルールで投資判断に変換して損益も比べる。", "p4": "予測誤差と、共通の売買ルールでの方向性のポジションと損益で評価し、市場全体のドリフトを除いた場合の感度も確かめる（抄録）。誤差指標の名前は抄録からは未確認。", "p5": "目標期間が情報境界の内側なら記憶による予測は良好だが、境界を越えると誤差が急増した（抄録）。検証済みの最新値を1つ与えると精度はおおむね回復し、歪めた価格は予測に強く伝わり、古い値と新しい値を並べると新しい値に大きな重みを置いた（抄録）。境界後の古い予測は持続的な方向性の偏りと不利な損益を生んだが、その経済的な大きさは市場環境に依存し、共通の市場ドリフトを除くと弱まった（抄録）。", "p6": "対象は4資産で、個別企業の財務情報のような情報は扱っていない（抄録からの解釈）。モデルの版や提示の順序への依存も残る。未査読のプレプリントである。", "unverified": "本文を読めず、予測誤差・損益の具体的な数値は確認できなかった。"}}, {"rank": 15, "theme": "VBI・橋梁SHM", "headline": "ランダムな板でも固有値数え上げは信頼できるか", "title": "Uncertainty propagation through the transcendental Wittrick–Williams eigenvalue count for free vibration of porous functionally graded Mindlin plates", "url": "https://doi.org/10.2139/ssrn.7533248", "authors": "Frank Sanhueza", "date": "2026-09-27", "venue": "SSRN", "id": "pr15", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "多孔質の傾斜機能材料（FG）でできたMindlin板の固有振動数を、離散化なしの動的剛性法とWittrick–Williams（WW）アルゴリズムで求める際、材料と形状がランダムでもWWの固有値の数え上げが1つも取りこぼさないことを200例で確かめ、そのうえで不確実性伝播と信頼性評価を行った（抄録）。", "p2": "動的剛性（Trefftz）モデルの超越的な固有値問題 det K(ω)=0 はWWアルゴリズムの符号の数え上げで固有振動数の見落としを防ぐが、パラメータが確率的なときにもこの保証が保たれるかは確立していなかった（抄録）。", "p3": "傾斜指数、空隙率、構成材料の弾性率と密度、細長比、さらに空隙率の分布則（6種類）を離散的なモデル形式の変数として不確実にし、横せん断補正係数も5/6に固定せず厚さ方向のせん断分布から計算する（抄録）。ラテン超方格の200標本でWWの数え上げを解析解（Navier解）の数と照合し、非侵入型の多項式カオス代替モデルで基本振動数の分布と感度を、能動学習のPC-Krigingで共振回避の閾値を超える確率を求める（抄録）。", "p4": "数え上げの正しさは独立な解析解との一致数、分布はSobol感度指数、信頼性評価は同精度の粗いモンテカルロとの計算回数の比で評価する（抄録）。", "p5": "WWの数え上げは200/200例で解析解と一致し、取りこぼしはゼロだった（縮退したモード対を含む）（抄録）。基本振動数の変動係数は10.6%で、1次感度指数は傾斜指数0.60、空隙率0.12、空隙率の分布則の選択だけで分散の18%を説明した（抄録）。共振回避の破壊確率は約0.202（β≈0.84）で、厳密解50回で求められ、同精度のモンテカルロの1,391回より28倍少なかった（抄録）。", "p6": "検証は数値解析のみで、実際の板の製造ばらつきとの照合はない（抄録からの解釈）。入力分布の設定が結果を左右するが、その根拠は抄録からは確認できない。未査読のプレプリントである。", "unverified": "本文を読めず、入力分布の設定と、脆弱性曲線の具体的な形は確認できなかった。"}}, {"rank": 16, "theme": "位相空間・土木三力学", "headline": "粒度とジオグリッドがダム材料の繰返し剛性を決める", "title": "Coupled effects of particle gradation and geogrid configuration on the cyclic performance of reinforced coarse-grained dam materials: Large-scale tests and DEM analysis", "url": "https://doi.org/10.2139/ssrn.7532168", "authors": "Zeyi Li ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr16", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ジオグリッドで補強した粗粒のダム材料で、粒度と補強の配置が繰返し載荷時の剛性と減衰にどう効くかを大型試験と個別要素法（DEM）で定量化し、最適な粒度条件を示した（抄録）。", "p3": "連続的な粒度を「粒度面積S」で表し、最大粒径、S、ジオグリッドの層数と目合いを変えて大型の繰返し三軸試験と3次元DEMを行い、動弾性係数と減衰比を調べた（抄録）。", "p5": "Sが増えると動弾性係数は増えてから減り、減衰比は逆の傾向で、その境の最適粒度面積は最大粒径と層数とともに増え、目合いが大きいと小さくなった（抄録）。最適粒度では力の鎖が連続し粒子とグリッドのかみ合いが十分に働いた。", "unverified": "各条件の具体的な数値と半経験式の形は未確認。"}}, {"rank": 17, "theme": "位相空間・土木三力学", "headline": "粘弾性球の衝突を接触面積まで実測と比較", "title": "Impacts of viscoelastic solids: A numerical and experimental analysis", "url": "https://doi.org/10.2139/ssrn.7528608", "authors": "Michele Santeramo ほか", "date": "2026-09-26", "venue": "SSRN", "id": "pr17", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "粘弾性のアクリル球が硬いサファイア板に衝突するときの運動と接触面積の変化を実験で測り、線形粘弾性の接触力学モデルが経験的な減衰項なしで再現できることを示した（抄録）。", "p3": "落球試験、レーザー変位計、高速度撮影で球の運動と接触面積を測り、線形粘弾性接触力学に基づく数値モデルと比べた（抄録）。", "p5": "落下高さを変えても、相対隙間・接触面積・接触半径の変化は特に最初の3回の衝突でよく一致した（抄録）。衝突試験で動的粘弾性試験を置き換えられる可能性を示している。", "unverified": "一致度の定量的な指標は未確認。"}}, {"rank": 18, "theme": "位相空間・土木三力学", "headline": "振動下の残留相の再移動を圧力境界で模せる条件", "title": "Predicting residual-phase remobilization and permeability recovery under vibration: conditional validity of boundary pressure forcing in hydrologic pore networks", "url": "https://doi.org/10.2139/ssrn.7532360", "authors": "Shilin Yu ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr18", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "振動による多相流の擾乱を境界での圧力振動で模す実験・モデル化について、その代用がどの条件で分布した慣性力を再現できるかを判定する枠組みを作った（抄録）。", "p3": "喉部中心の動的な間隙ネットワークモデルで、局所の残留相の移動と界面の事象を、ネットワーク全体の残留飽和度と有効透水係数に結びつけ、4種の対応づけ方（喉部スケール、軸方向勾配、周期平均の仕事率、局所RMS）を比べた（抄録）。", "p5": "普遍的な優劣ではなく、モデルと許容誤差に依存する判定基準を示すことを目的とし、数値検証やCFDとの一致、ネットワークの実現値によるばらつきも調べた（抄録）。具体的な基準値は抄録にない。", "unverified": "判定基準の数値と、どの対応づけが有利だったかは未確認。"}}, {"rank": 19, "theme": "位相空間・土木三力学", "headline": "関心域だけ浅水方程式を解くGPU洪水モデル", "title": "A GPU-accelerated hybrid model for flood simulations with multi-region local time stepping", "url": "https://doi.org/10.2139/ssrn.7531842", "authors": "Xi Shen ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr19", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "洪水計算で、関心のある領域だけ完全な2次元浅水方程式を解き、他は簡略な局所慣性近似で解く混合モデルをGPUで実装し、計算時間を減らした（抄録）。", "p3": "背景領域は局所慣性近似（LIA）、関心領域はHLLCソルバで解き、両者を界面の質量フラックスで結ぶ。関心領域ごとに独自のCFL条件で細かい時間刻みを取り、LIAの大きな時間刻みで同期する（抄録）。Taichiで実装。", "p5": "洪水伝播、ダム決壊波、跳水、障害物周りの非線形流れを良く再現し、全域HLLCに対する速度向上はセル数とともに1.59倍から2.64倍に増え、最大の例で計算時間を62.1%減らした（抄録）。", "unverified": "セル数の具体的な値（抽出テキストで欠落）は未確認。"}}, {"rank": 20, "theme": "位相空間・土木三力学", "headline": "混合モードの破壊と自己修復を扱う結合帯モデル", "title": "A thermodynamically consistent mixed-mode cohesive zone model for fracture of self-healing materials", "url": "https://doi.org/10.2139/ssrn.7528848", "authors": "Oliver Giraldo-Londoño ほか", "date": "2026-09-26", "venue": "SSRN", "id": "pr20", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "自己修復材料の破壊と修復を、モードIだけでなく混合モードで熱力学的に整合して扱う結合帯モデル（cohesive zone model）を提案した（抄録）。", "p3": "Park–Paulino–Roesler結合帯モデルを拡張し、法線・接線方向の最大有効開口変位を内部変数として、き裂面が接触して静止しているときだけ働くモード依存の修復則を与え、有限要素に実装した（抄録）。", "p5": "載荷・除荷・修復・再載荷を統一的に記述でき、熱力学的整合性を示し、単一要素のモードI・混合モード試験で損傷の回復を予測した（抄録）。", "unverified": "実験との比較の有無は未確認。"}}, {"rank": 21, "theme": "位相空間・土木三力学", "headline": "遅い部分空間への縮約の妥当性を測る指標", "title": "Symplectic Defect of Spectral Slow Subspaces: Projected Commutators, Exceptional Points, and Canonical Validity", "url": "https://doi.org/10.2139/ssrn.7521898", "authors": "Francis Procaccia", "date": "2026-09-26", "venue": "SSRN", "id": "pr21", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "線形化した開放量子系で、遅い固有部分空間への縮約が正準（シンプレクティック）構造を保つかを測る指標「シンプレクティック欠損」を定義し、その性質を証明した（抄録）。", "p3": "部分空間に制限したシンプレクティック形式の歪標準形の係数 0≤a₁≤…≤aₘ≤1 から D_sp=1−a₁ と定義し、D_sp<1 が縮約空間上の非退化なシンプレクティック構造の存在と同値であることを示す（抄録）。", "p5": "閾値 D_sp=1 は基底の取り方と座標変換によらないが、閾値から離れた値は不変量ではない（抄録）。(1−D_sp)^(−1/2) は正準対に直す変換の最小ノルムに等しい（抄録）。", "unverified": "例外点との関係など抄録末尾以降の結果は未確認。"}}, {"rank": 22, "theme": "VBI・橋梁SHM", "headline": "閉ループ柔構造の過渡解析の検証手順", "title": "Solver selection and consistency checks for closed-loop structural dynamics", "url": "https://doi.org/10.2139/ssrn.7531839", "authors": "Zhongxu Tian ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr22", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "閉ループ状の柔構造の過渡解析で、剛性の特異性、履歴に整合した初期化、陰解法のソルバ選択、時空間の分散誤差をまとめて検査する枠組みを作り、ソルバの性能を比べた（抄録）。", "p3": "重み付きの周期接続行列で荷重の適合性とゲージの選択を分け、履歴に整合した初期化、行列を作らないNewmark演算子、真の残差の検証、分散とエネルギーの検査を組み合わせた。6つのソルバ戦略を単一スレッドで比較した（抄録）。", "p5": "載荷を保持した場合、変位ゼロで初期化すると残差がほぼ丸め誤差でも最大応答が平衡初期化より36.6%大きくなった（抄録）。65,536節点では、O(N)の直接消去の合計75.90 msに対し位相コアの共役勾配法は111.37 msだった（抄録）。", "unverified": "なし"}}, {"rank": 23, "theme": "VBI・橋梁SHM", "headline": "原発天井クレーンの地震応答ベンチマークの総括", "title": "Assessment of the dynamic behaviour of overhead crane bridges under seismic loads – Summary of results and feedback following SOCRAT Benchmark", "url": "https://doi.org/10.2139/ssrn.7533186", "authors": "Ibrahim Bitar ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr23", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "原子力発電所の天井クレーンの地震応答について、1/5縮尺模型の振動台実験を使った国際ベンチマーク（SOCRAT）の結果と教訓をまとめた（抄録）。", "p3": "2007年中越沖地震の柏崎刈羽原発5号機タービン建屋（高さ22m）の記録に基づく狭帯域の地震波を、段階的に大きくして模型に入力した2015年の実験データに対し、複数のチームが数値モデルで応答を予測した（抄録）。", "p5": "ベンチマークは2020年6月から2022年まで行われ、OECD/NEAのもとで数値モデル化の戦略を比べた（抄録）。予測の一致度などの結果は抄録の範囲では確認できない。", "unverified": "各チームの予測と実験の差の数値、主な教訓は未確認。"}}, {"rank": 24, "theme": "位相空間・土木三力学", "headline": "柔らかいいかだは自ら起こす波で進む", "title": "Wave-driven propulsion of a flexible raft", "url": "https://doi.org/10.48550/arxiv.2609.28884", "authors": "Elvis A. Agüero ほか", "date": "2026-09-24", "venue": "arXiv", "id": "pr24", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は取得できず）", "preprint": true, "short": true, "p1": "水面に浮かぶ柔らかい「いかだ」を周期的に加振すると自ら起こす表面波で進む現象で、柔らかさが推力を強めたり逆転させたりすることを流体-構造連成モデルで示した（抄録）。", "p3": "いかだをEuler–Bernoulli梁、下の流体を弱い散逸をもつ準ポテンシャル流としてモデル化し、剛体・弾性モードへの射影で流体力をモード・インピーダンスとして表す縮約モデルを作った（抄録）。", "p5": "曲げ剛性と加振位置を変えると推力の増強と逆転が生じた（抄録）。一様ないかだでは単一モードだけでは正味の推力が出ず、干渉する複数モードの組み合わせが必要だった（抄録）。", "unverified": "なし"}}, {"rank": 25, "theme": "会計情報科学", "headline": "データ漏洩を除いた説明可能な信用リスク予測", "title": "Data Leakage-Free Explainable AI for Decentralized Credit Scoring: A SHAP-Interpretable Approach to Default Prediction", "url": "https://doi.org/10.2139/ssrn.7532225", "authors": "Sai Srikanth Madugula ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr25", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "請求書担保の企業向け融資のデフォルト予測で、SMOTEによるデータ漏洩を除いた評価と、SHAPによる説明、確率の較正を組み合わせた再現可能な手順を示した（抄録）。", "p3": "不均衡な12,000件の融資データでXGBoostを学習し、SMOTEによる合成を訓練分割の内側だけで行う交差検証で漏洩を防ぎ、期待較正誤差（ECE）で確率の較正を評価し、SHAPで局所説明を出した（抄録）。", "p5": "AUC-ROCは0.89、ECEは0.08で、支払日数（DPO）と請求書の経過日数が主なデフォルト要因だった（抄録）。", "unverified": "データの出所（実データか合成か）は未確認。"}}, {"rank": 26, "theme": "会計情報科学", "headline": "SECの非公開調査中は株式発行が減る", "title": "When Regulators Knock:SEC Investigations and Corporate Financing", "url": "https://doi.org/10.2139/ssrn.7532171", "authors": "Najah Attig ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr26", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "SECの非公開の調査が始まると、調査期間中に企業の株式発行が減り、負債での代替も起きないことを、スタック型の差の差分析で示した（抄録）。", "p3": "非公開のSEC調査の開始を処置として、スタック型の差の差（stacked DiD）とイベントスタディで資金調達・流動性・財務方針への影響を推定した（抄録）。", "p5": "株式発行の減少は調査開始後に現れて強まり、事前トレンドはなかった（抄録）。財務報告・開示に関する調査に集中し、流動性の低下と株主資本コストの上昇、手元現金の積み増しなど保守的な財務方針、雇用と間接費の削減が見られた（抄録）。", "unverified": "効果の大きさの数値は未確認。"}}, {"rank": 27, "theme": "会計情報科学", "headline": "気候リスク開示の負債コスト効果は信頼性次第", "title": "Climate risk disclosure and the cost of debt: the conditioning role of environmental performance", "url": "https://doi.org/10.2139/ssrn.7532276", "authors": "Hua Tang ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr27", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "気候リスク開示が負債コストを下げるかは、時間トレンドの扱いで答えが変わり、残る効果は環境成績が良く開示に信頼性がある企業に限られることを示した（抄録）。", "p3": "中国の上場企業（2016〜2024年、20,721企業年）で、共通の時間トレンドを吸収するかどうかで平均的な関連を比べ、環境成績の高低で分けて推定した（抄録）。", "p5": "開示の増加と借入コストの低下が同時に進んでいたため、見かけの開示プレミアムの一部はトレンドだった（抄録）。負の関連は環境成績の良い企業でのみ有意で、分け方、多重検定の補正、極端値の8通りの扱いに頑健だった（抄録）。", "unverified": "係数の大きさは未確認。"}}, {"rank": 28, "theme": "会計情報科学", "headline": "IP所在地の表示義務で株価の情報効率が低下", "title": "The Anonymity Paradox: Identity Disclosure, Online Information Production, and Stock Price Efficiency", "url": "https://doi.org/10.2139/ssrn.7532270", "authors": "Weixing Cai ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr28", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "中国で2022年にSNS利用者のIP所在地の表示が義務化されると、個人投資家の投稿と取引が減り、株価の情報効率が下がったことを準自然実験で示した（抄録）。", "p3": "2021〜2023年の企業・四半期データで、政策施行を準自然実験とする差の差分析を行い、株価同期性で情報効率を測り、投資SNSの投稿量などで経路を調べた（抄録）。", "p5": "政策後、株価同期性が有意に上がり（情報効率の低下）、投資SNSの全体・情報的な投稿量と個人の売買が減った（抄録）。投資家は公式の対話プラットフォームへ情報探索を移し、予想外の利益への株価の反応は強まった。ガバナンスや開示
