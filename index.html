://doi.org/10.1177/21501319261505386", "authors": "Aldiene Henrieke van Dijk – Hengelaar ほか", "venue": "Journal of Primary Care and Community Health", "date": "2026-11-04", "sjr": 0.915, "citescore": 3.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr11", "rank": 11, "headline": "AIが関わる口コミ「合成WOM」の枠組み", "title": "From eWOM to Synthetic WOM: A Systematic Review and Integrative Framework for AI-Mediated Persuasion in Tourism and Hospitality", "url": "https://doi.org/10.3390/jtaer21110409", "authors": "Sofia K. Gkarane", "venue": "Journal of theoretical and applied electronic commerce research", "date": "2026-11-04", "citescore": 7.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr12", "rank": 12, "headline": "粒子形状がダイレイタンシーに効くのは低応力", "title": "Three-Dimensional Particle Shape and Stress–Dilatancy Behavior of Carbonate and Silica Sands at Low Normal Stresses: A Direct Simple Shear Investigation", "url": "https://doi.org/10.1061/jggefk.gteng-15701", "authors": "Sanchari Mondal ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-11-05", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr13", "rank": 13, "headline": "AIによる否定的フィードバックの受け止め方", "title": "How AI negative feedback shapes employee appraisals and job crafting", "url": "https://doi.org/10.1080/02642069.2026.2754018", "authors": "Fuda Li ほか", "venue": "Service Industries Journal", "date": "2026-11-03", "citescore": 17.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr14", "rank": 14, "headline": "FEMから粒子へ物理量を保存して切り替える", "title": "A framework for a macro-micro transformation which conserves physical quantities", "url": "https://doi.org/10.1016/j.apm.2026.117394", "authors": "Momme Jahn ほか", "venue": "Applied Mathematical Modelling", "date": "2026-10-28", "citescore": 10.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr15", "rank": 15, "headline": "社会的支援が社会的幸福を介し共同体感覚へ", "title": "Social support and social wellbeing in relation to sense of community among adults in an urban–rural area of southern Peru: a network and latent factor analysis approach", "url": "https://doi.org/10.3389/fpsyg.2026.1877120", "authors": "Julio Cesar Huamani-Cahua ほか", "venue": "Frontiers in Psychology", "date": "2026-11-04", "citescore": 7.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr16", "rank": 16, "headline": "生成AIは知識の多様化と収斂の両方を招く", "title": "The generative AI duality trap: a knowledge governance perspective on knowledge diversity and epistemic convergence in AI-augmented organisations", "url": "https://doi.org/10.1108/jkm-05-2026-1037", "authors": "Hui Chun Chan ほか", "venue": "Journal of Knowledge Management", "date": "2026-11-04", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Knowledge Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "生成AIの利用が組織によって知識の多様化にも収斂にもつながる理由を、技術ではなく知識統治の設計に求める枠組み（生成AIの二面性の罠）を示した（抄録）。", "p3": "組織調査（n=67）、従業員の測定（n=1,247）、SBERTによる意味的多様性の指標を組み合わせ、3つの制度レジームにわたる9つの仮説をPLS-SEMと多群分析で検証した（抄録）。", "p5": "知識統治は人とAIの相互作用の質を通じて多様性と関連した。透明性、分散的なアクセス、AIリテラシーへの投資は批判的な関与と関連し、それが知覚された多様性と意味的多様性に関連した。制度レジームは3つの経路すべてを調整し、市場主導で強く国家主導で弱かった（抄録）。", "fun": "同じ生成AIを使っても、ある会社では社員のアイデアが多様になり、別の会社では皆が似た考えに寄っていきます。この研究は、その分かれ道がAIの性能ではなく、情報の透明さや誰でも使えるかといった使い方のルールにあると示しました。文章の意味の多様さをAIで測って確かめている点も面白いところです。", "unverified": "経路係数の大きさと、3つの制度レジームの具体的な区分は抄録では未確認。"}}, {"id": "jr17", "rank": 17, "headline": "研究者が仮想社会に入り込む生成エージェント実験", "title": "Computational Multi-Agent Society Experiments: Social Modeling Framework Based on Generative Agents", "url": "https://doi.org/10.1145/3860291", "authors": "Hanzhong Zhang ほか", "venue": "ACM Transactions on Social Computing", "date": "2026-11-05", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "ACM Transactions on Social Computingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "研究者がシミュレーションの中に役割を持って入り込み、介入できる生成エージェント型の社会実験の枠組みCMASEを提案した（抄録）。", "p3": "シミュレーションを模擬的なエスノグラフィーの現場とみなし、研究者を外部の操作者から内部の参加者に変える。リアルタイムの介入、統制された計算実験と観察・インタビューの組み合わせ、介入の軌跡と社会的な反応の探索の3つを目指し、知覚・記憶・感情を持つエージェントで実現する（抄録）。", "p5": "取得できた抄録の範囲は枠組みの設計と目標が中心で、検証の結果は含まれていない（抄録）。", "fun": "AIの住人が暮らす仮想の町を作る研究はいくつもありますが、研究者は外から設定をいじるだけでした。この研究は、研究者自身が町の住人の一人として入り込み、話しかけたり出来事を起こしたりして反応を観察できるようにしました。フィールドワークを仮想社会で行う、という発想が面白いところです。", "unverified": "抄録は途中で切れており、エージェントの実装と検証の結果は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "擬人的な言葉遣いのチャットボットと口コミ", "title": "Chatbot Schema Activation: When Anthropomorphic Language Leverages Word-of-Mouth", "url": "https://doi.org/10.1177/14413582261499475", "authors": "Mai Nguyen ほか", "venue": "Australasian Marketing Journal", "date": "2026-11-05", "citescore": 11.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Australasian Marketing Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "共感的な言葉や絵文字などの擬人的な言葉遣いが電子口コミを増やすのは、顧客のチャットボット・スキーマ（チャットボットを理解する認知的な枠組み）が働いているときに限られることを示した（抄録）。", "p3": "2つの実験で、擬人的な言語、チャットボット・スキーマ、チャットボットの能力が、真正性の知覚と電子口コミに与える影響を調べた（抄録）。", "p5": "研究1ではスキーマが活性化しているときに擬人的な言語が口コミの増加と関連する方向の証拠を得た。研究2では、擬人的な言語の真正性と口コミへの効果がチャットボットの能力に左右されることを示した（抄録）。", "fun": "チャットボットが共感の言葉や絵文字で話しかけると、親しみがわいて人に勧めたくなるでしょうか。この研究は、相手をチャットボットだと意識しているときに限って効果があり、その効果も役に立つチャットボットかどうかで変わることを示しました。見た目より言葉づかいで印象が変わる点が面白いところです。", "unverified": "参加者数と効果量は抄録では未確認。"}}, {"id": "jr19", "rank": 19, "headline": "集積の便益と気候災害の費用で住宅立地を選ぶ", "title": "Urban densification to support climate adaptation: balancing costs and agglomeration benefits in the Netherlands", "url": "https://doi.org/10.1093/jeg/lbag077", "authors": "Yashvant R Premchand ほか", "venue": "Journal of Economic Geography", "date": "2026-11-04", "sjr": 1.949, "citescore": 7.1, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Economic Geographyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "気候適応の費用を地点別に見積もっても高密度の都市は大きな純便益を生み、気候適応はむしろ高密度化を後押しすることを、オランダで示した（抄録）。", "p3": "集積の便益を地価で代理し、洪水防御と地盤沈下の工学的な費用推計から適応費用を求め、両者を組み合わせて空間的なトレードオフを地図にした（抄録）。", "p5": "高密度の都市は費用の高い場所でも強い純便益を生み、低密度の集落での新築は厚生の損失になった。開発が成り立つ密度の閾値を示し、多くの中規模都市はすでにそれを超えており、郊外への拡張より高密度化が有利だった（抄録）。", "fun": "洪水や地盤沈下のおそれがある土地には家を建てない方がよい、と考えがちです。でもオランダの計算では、守るための費用がかかっても、人が集まる都市の便利さ（集積の利益）の方が大きく、むしろ街を密にする方が得になりました。気候対策がコンパクトな街づくりを後押しする、という結論が面白いところです。", "unverified": "閾値となる密度の値と、費用推計の不確実性の扱いは抄録では未確認。"}}, {"id": "jr20", "rank": 20, "headline": "生成AIが青少年役を演じて指導者を訓練", "title": "Simulating Adolescents Using a Generative Text-Based AI Chatbot to Support Facilitator Training in a Motivational Interviewing-Based Prevention Program", "url": "https://doi.org/10.1007/s11121-026-02006-x", "authors": "Francisco Cardozo ほか", "venue": "Prevention Science", "date": "2026-11-05", "sjr": 1.477, "citescore": 7.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Prevention Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "動機づけ面接に基づく物質使用の予防プログラムで、青少年役を演じる生成AIチャットボットを作り、指導者の練習に使えるかを予備的に検証した（抄録）。", "p3": "チャットボットを反復的に改良し、認定を受けた指導者5人がそれぞれ2回の模擬セッションを行った（計374メッセージ）。訓練を受けた3人の評定者が一貫性・現実味・文脈への適合を評価し、指導者に半構造化面接を行った（抄録）。", "p5": "評定はセッション全体で高いメッセージの質を示し、一貫して文脈に合った青少年らしい応答が生成されていた。指導者はチャットボットを現実的と受け止めた（抄録）。", "fun": "カウンセリングの練習には相手役が必要ですが、人を集めるのは手間も費用もかかります。この研究は、生成AIに思春期の若者を演じさせ、指導者の練習相手にしました。AIが「それらしい若者」をどこまで演じられるかを、専門の評定者が一つひとつのメッセージで採点して確かめた点が面白いところです。", "unverified": "指導者5人の小規模な予備研究で、訓練の効果そのものは未検証。評定の数値は抄録では未確認。"}}, {"id": "jr21", "rank": 21, "headline": "STARAへの認識が社内起業行動を左右する", "title": "How STARA-enabled technological readiness shapes intrapreneurial behaviour and digital competence in China's electric vehicle (EV) manufacturing sector", "url": "https://doi.org/10.1108/jeim-04-2026-0576", "authors": "Syed Hussain Murtaza ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-05", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Enterprise Information Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "従業員がSTARA（スマート技術・AI・ロボット・アルゴリズム）を前向きに受け止めるほど社内起業行動とデジタル能力が高いことを、中国の電気自動車製造の従業員で示した（抄録）。", "p3": "動的能力理論や社会技術システム理論などに基づく統合モデルを作り、層化した目的的抽出によるオンライン調査の有効回答193件をPLS-SEMで分析した（抄録）。", "p5": "STARAへの前向きな認識は社内起業行動とデジタル能力の高さと関連し、社内起業行動がその媒介役だった。デジタル環境の変化の激しさは、STARAの認識とデジタル能力の正の関係を弱めた（抄録）。", "fun": "職場にAIやロボットが入ってくるとき、それを前向きに受け止めるかどうかで、働く人の行動は変わります。この研究では、前向きな人ほど自ら新しいことに挑戦し、その挑戦を通じてデジタルの力が身についていました。ただ、変化が激しすぎる環境ではその効果が弱まる、という点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。経路係数の値は抄録では未確認。"}}, {"id": "jr22", "rank": 22, "headline": "地下水上昇による斜面変動と建物被害のFE解析", "title": "Finite Element Greenfield Modelling for building damage assessment under groundwater-induced slope movements", "url": "https://doi.org/10.1139/cgj-2026-0245", "authors": "Davide Luongo ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-05", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Canadian Geotechnical Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "地下水位の上昇による斜面の地盤変位を平面ひずみの有限要素法で解析し、浅い基礎の建物の被害を評価するグリーンフィールド斜面解析の枠組みを示した（抄録）。", "p3": "排水・定常浸透の条件でMohr–Coulombの構成則を使い、限界引張ひずみ法（LTSM）を緩速地すべりの影響を受ける建物の被害評価に適用した。変位とひずみの場から最大引張ひずみを求め、安定性の変化も評価した（抄録）。", "p5": "地下水位の上昇で地盤の変位は次第に増え、ひずみの分布は主に斜面の運動の形で決まった。中央部は並進的、頂部と先端部は回転的な成分を持ち、頂部は引張、先端部は圧縮の水平ひずみが主だった。斜面に平行な正規化変位が変形の水準の代理指標になりうる（抄録）。", "fun": "雨で地下水位が上がると、斜面はゆっくりと動き出します。この研究は、斜面の上の方では地面が引っ張られ、下の方では押し縮められることを計算で示し、同じ斜面でも建っている場所によって建物の傷み方が違うことを明らかにしました。斜面全体の動きの大きさから被害の目安を素早く見積もれる点が面白いところです。", "unverified": "層厚が一様な理想化した斜面での結果で、実測との照合は抄録では未確認。"}}, {"id": "jr23", "rank": 23, "headline": "水中の柔軟な茎の群れと流れの連成", "title": "Fluid–structure interaction in a square array of submerged flexible stems", "url": "https://doi.org/10.1017/jfm.2026.12218", "authors": "Weilin Chen ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-11-05", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Fluid Mechanicsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "3次元の正方配列の柔軟な茎を通る流れを直接数値シミュレーションし、柔軟性によって3つの動的な領域が現れ、中間の柔軟性で固有振動数と振動の周波数のロックインが起きることを示した（抄録）。", "p3": "柔軟性のパラメータKを変えて、茎の連成した運動、流れの分布、渦の構造を調べ、抗力、底面せん断応力、底面せん断摩擦の二乗平均の分布でエネルギー散逸と土砂輸送の効果を定量化した（抄録）。", "p5": "Kが大きいと茎はほぼ剛で隙間の流れが加速し、中間では完全なロックインで大振幅の振動が起き、小さいと振幅は減るが変形が増えて不規則になった。中間のKの配列は、剛な配置を上回る最も高いエネルギー散逸の効率を示した（抄録）。", "fun": "水草の群れは、水の流れを弱め、川底の砂の動きを変えます。この計算では、茎が硬すぎず柔らかすぎないしなやかさのとき、茎の揺れと流れのリズムがぴったり合って大きく揺れ、流れのエネルギーを最もよく吸収しました。硬い杭よりもしなやかな茎の方が流れを弱めるという点が面白いところです。", "unverified": "Kの値の範囲と、底面せん断応力の結果は抄録が途中で切れているため未確認。"}}, {"id": "jr24", "rank": 24, "headline": "都市規模のSHMに向けた差し込み型の枠組み", "title": "Toward city-scale structural health monitoring: Architectural gaps, a modular plug-and-play framework, and research directions", "url": "https://doi.org/10.1177/13694332261506126", "authors": "Fatih Yesevi Okur", "venue": "Advances in Structural Engineering", "date": "2026-11-05", "citescore": 5.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Advances in Structural Engineeringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "個々の構造物で成熟したSHMを、多数の異種の資産からなる都市規模に広げるためのモジュール型・差し込み型の構成枠組みMPnP-SHMを示した（抄録）。", "p3": "構造中心のSHM、無線センサネットワークとIoT、エッジ-クラウドとサイバーフィジカルシステム、デジタルツイン、集団ベースのSHMを概観して構成上の欠落を特定し、センサと解析部品が能力や状態を機械可読で示すメタデータ駆動の、制約つきの実行時の編成を導入した（抄録）。", "p5": "データ品質と来歴の管理、多忠実度のデジタルツイン、既存システムの統合、段階的な機能縮退、資産間・集団レベルの解析の接点を組み込んだ。差し込み型の運用は構造工学の判断の自動化ではないと明記している（抄録）。", "fun": "一つの橋を見張るセンサの仕組みはかなり成熟しましたが、街じゅうの橋や建物をまとめて見張ろうとすると、機器も形式もばらばらで、毎回専門家が手で組み合わせる必要がありました。この研究は、部品が自分の能力を名札のように示し、条件に合うものを自動で組み合わせる設計を提案しています。「差せば動く」監視を目指す発想が面白いところです。", "unverified": "実際の都市での運用による実証の有無は抄録では未確認。"}}, {"id": "jr25", "rank": 25, "headline": "温湿度と交通荷重を入れたLSTMで橋のたわみ予測", "title": "LSTM-Based Deflection Prediction for Medium and Small-Span Bridges Considering Temperature, Humidity, and Traffic Loads", "url": "https://doi.org/10.3390/computers15110783", "authors": "Chaoyu Yang ほか", "venue": "Computers", "date": "2026-11-02", "citescore": 9.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Computers（MDPI）の抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "ガウスフィルタで橋のたわみを傾向成分と細部成分に分け、物理的な特徴量を加えた2つのLSTMで予測する軽量な2段階の枠組みで、中小橋のたわみ予測の精度を上げた（抄録）。", "p3": "熱の遅れを考えた有効温度の特徴と、影響線の重みに基づく動的な荷重流の特徴を作り、傾向と細部を並列の2つのLSTMで別々に予測して足し合わせた（抄録）。", "p5": "対象の橋で、提案モデルはNaiveとBaselineのモデルよりRMSEとMAEが小さく、2つの枝の並列実行によりBaselineに対して推論が1.91倍速くなった（抄録）。", "fun": "橋のたわみには、気温による伸び縮みのようなゆっくりした変化と、車が通るたびの速い揺れが重なっています。この研究は、まずその二つを分け、それぞれを別のAIで予測してから足し合わせました。温まるまでの時間の遅れや、車の位置による効き方の違いといった物理の知識を入力に組み込んだ点が面白いところです。", "unverified": "対象は1つの橋で、誤差の具体的な数値は抄録では未確認。"}}, {"id": "jr26", "rank": 26, "headline": "GNSSが途切れる自動車LiDAR-慣性データセット", "title": "Odyssey: An automotive lidar-inertial odometry dataset with GNSS-denied situations", "url": "https://doi.org/10.1177/02783649261495584", "authors": "Aaron Kurda ほか", "venue": "International Journal of Robotics Research", "date": "2026-11-05", "sjr": 2.022, "citescore": 12.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal of Robotics Researchの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "GNSSが長く使えない環境を含む自動車のLiDAR-慣性オドメトリのデータセットOdysseyを公開し、航法級の基準軌道で評価できるようにした（抄録）。", "p3": "リングレーザージャイロに基づくRTK/INSで基準軌道を作り、農村の屋外から都市・屋内まで36の系列を収録し、基準誤差の不確かさを実験で検証した。同じ軌道の3回の繰り返しと測地座標により、場所の認識や外部地図との統合にも使える（抄録）。", "p5": "既存の自動車のベンチマークが短いGNSS欠落区間に限られていたのに対し、長く続くGNSS欠落環境を含むデータとデータローダ、補足資料をオンラインで公開した（抄録）。", "fun": "カーナビの位置はふつう衛星（GNSS）で決まりますが、トンネルやビルの谷間では電波が途切れます。そこで車は自分のセンサだけで位置を推定しますが、その腕前を確かめるには正解の軌道が必要です。この研究は、航法級の精密なジャイロで正解を作り、長い電波なしの区間でも採点できるデータを用意した点が面白いところです。", "unverified": "系列ごとの長さとGNSS欠落の時間は抄録では未確認。"}}, {"id": "jr27", "rank": 27, "headline": "VRSとGNSS時間差分で構造変位を高頻度計測", "title": "Mixed use of multi-rate double-differenced VRS and time-differenced GNSS data for high-rate structural displacement monitoring", "url": "https://doi.org/10.1016/j.measurement.2026.123803", "authors": "Xuanyu Qu ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-11-05", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Measurementの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、多レートの二重差分VRS（仮想基準点）データと時間差分GNSSデータを併用し、構造物の変位を高頻度で計測する方法を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名が問うのは、衛星測位（GNSS）で建物や橋のわずかな動きをどこまで細かく、速く測れるかです。測る間隔の違うデータを組み合わせることで、精度と速さを両立できるのか、という問いそのものが面白いところです。", "unverified": "内容は題名からの推測で、手法と精度は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "ノイズとモデル誤差の下での応答再構成のセンサ配置", "title": "Sensor placement optimization for structural response reconstruction with measurement noise and model error", "url": "https://doi.org/10.1016/j.ymssp.2026.115172", "authors": "Mingyue Wang ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-05", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Mechanical Systems and Signal Processingの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、計測ノイズとモデル誤差がある条件で、構造応答を再構成するためのセンサ配置を最適化する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "限られた数のセンサで構造物全体の揺れを推定するには、どこにセンサを置くかが勝負です。測定のノイズと計算モデル自体のずれの両方を考えたとき、最適な置き場所はどう変わるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、手法と結果は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "異種センサ融合による橋梁モニタリングの凸最適化", "title": "Nonlinear Convex Optimization for Heterogeneous Sensor Data Fusion and Risk Assessment in Bridge Monitoring", "url": "https://doi.org/10.1587/transfun.2026eap1197", "authors": "Lianjiang LIU ほか", "venue": "IEICE Transactions on Fundamentals of Electronics, Communications and Computer Sciences", "date": "2026-11-04", "citescore": 1.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "IEICE Transactionsの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、橋梁モニタリングで種類の異なるセンサのデータを非線形の凸最適化で融合し、リスクを評価する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋には性質の違う何種類ものセンサが付けられますが、それぞれの情報をどう重ね合わせれば一番確かな判断になるのか。数学の最適化の道具でその組み合わせ方を決める、という問いが面白いところです。", "unverified": "内容は題名からの推測で、センサの種類と結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "物質点法で黄天地すべり津波を3次元再現", "title": "Three-dimensional material point method modeling of the full-scale Huangtian landslide-tsunami with a phase-transition model", "url": "https://doi.org/10.1007/s10346-026-02869-9", "authors": "Hang Feng ほか", "venue": "Landslides", "date": "2026-11-06", "sjr": 1.778, "citescore": 12.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "Landslidesの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、相転移モデルを組み込んだ3次元の物質点法（MPM）で、黄天の地すべりとそれに伴う津波を実規模で再現した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "山の斜面が崩れて水に飛び込むと、津波が起きることがあります。崩れる土砂のふるまいの「状態の変わり目」を計算にどう組み込めば、地すべりから津波までを一続きに再現できるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、相転移モデルの中身と再現の精度は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "限界状態土質力学とμ(I)レオロジーをつなぐ", "title": "An elasto-plastic-inertial constitutive model bridging Critical State Soil Mechanics and μ(I)–ϕ(I) rheology", "url": "https://doi.org/10.1016/j.jmps.2026.106906", "authors": "Retief Lubbe ほか", "venue": "Journal of the Mechanics and Physics of Solids", "date": "2026-11-05", "sjr": 1.766, "citescore": 10.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "Journal of the Mechanics and Physics of Solidsの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、限界状態土質力学とμ(I)–ϕ(I)レオロジー（粒状流の慣性数に基づく摩擦と体積分率の法則）をつなぐ弾塑性-慣性の構成モデルを提案した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "砂は、じっとしていれば固体のように建物を支え、勢いよく流れれば液体のようにふるまいます。土の止まった状態を扱う理論と、流れる粒の理論を一つの式でつなげられるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、モデルの式と検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "月面の重力下での粒状流の分級", "title": "Segregation in Granular Flow Under Lunar Conditions", "url": "https://doi.org/10.3390/fluids11110279", "authors": "Masami Nakagawa ほか", "venue": "Fluids", "date": "2026-11-04", "citescore": 4.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Fluids（MDPI）の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "月面での資源利用に必要な月の土の輸送で、地球の粒の偏析（分級）の理論がどこまで通用するかを、粒状ボンド数を軸に概念的に整理した（抄録）。", "p3": "月の土は細かく角ばり、凝集した粒を含み静電的に活発で、真空かつ6分の1の重力で扱われるため、凝集力と重力の釣り合いが変わると指摘した。粒状ボンド数と慣性数の平面に概念的な領域図を描き、7つの検証可能な仮説を導いた（抄録）。", "p5": "低重力の実験では凝集性の排出で目詰まりが起きやすく、データは重力より粒状ボンド数で整理されることが示されているが、偏析で同じことが成り立つかは未検証だと述べる（抄録）。", "fun": "月で酸素や水を取り出す計画は、どれも月の砂を運ぶことから始まります。砂を運ぶと大きな粒と小さな粒が分かれる現象は地球ではよく知られていますが、重力が6分の1で、砂が静電気を帯びてくっつきやすい月でも同じことが起きるのか。物差しを重力から「くっつく力と重さの比」に変えて考える点が面白いところです。", "unverified": "概念的な研究で、月の条件の実験データによる検証は行っていない（抄録）。"}}, {"id": "jr33", "rank": 33, "headline": "IoTで土石流と地すべりを実時間監視した事例", "title": "Case studies on IoT monitoring of debris flow and landslides", "url": "https://doi.org/10.1371/journal.pone.0361584", "authors": "Lei Huang ほか", "venue": "PLoS ONE", "date": "2026-11-04", "citescore": 4.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "PLoS ONEの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "土石流と地すべりの両方に使える統一的なIoT監視の構成を提案し、著者らの3つの工事事例で早期警報に役立つことを示した（抄録）。", "p3": "事例1では剛な防護堰の構造に合わせた土石流のIoT監視を、事例2と3では変形センサ、雨量計、映像監視などで降雨による地すべりの早期警報を行った。太陽電池と蓄電池の電源、データ伝送、警報の方式、クラウドでの処理を統合した（抄録）。", "p5": "提案した構成の有効性を、早期警報に成功した事例で確かめたと述べる（抄録）。", "fun": "山の斜面の見回りを人が手作業で行うと、記録が遅れたり途切れたりします。この研究は、センサ、太陽電池、映像、通信、クラウドをひとまとめにした見張りの仕組みを、土石流と地すべりの両方に使える形で示しました。現場で警報が実際に役立った例を示している点が面白いところです。", "unverified": "警報の的中率などの数値と、事例の所在地は抄録では未確認。"}}, {"id": "jr34", "rank": 34, "headline": "説明可能なAIで裁量的発生高から利益調整を検出", "title": "Detecting Earnings Management through Explainable Artificial Intelligence: A Machine Learning Approach Using Financial Statement Data", "url": "https://doi.org/10.70568/ijdafs.3.1.1", "authors": "Safwat Al Tal", "venue": "International Journal of Digital Accounting and Fintech Sustainability", "date": "2026-11-05", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "International Journal of Digital Accounting and Fintech Sustainabilityの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "財務諸表データから、裁量的発生高が異常に大きい企業年（発生高による利益調整の代理）を分類する説明可能な機械学習の枠組みを作り、Beneish M-Scoreを上回ることを示した（抄録）。", "p3": "Compustat北米の非金融上場企業の2010〜2023年度の7,800企業年で、修正ジョーンズ・モデルの裁量的発生高が業種-年内で上位5分位のもの（1,560件、20.0%）をラベルとし、ラベルの構成要素を除いた財務比率で4つのアルゴリズムを学習した。2021〜2023年の1,000件で標本外評価した（抄録）。", "p5": "XGBoostのROC-AUCは0.748、PR-AUCは0.421で、Beneish M-Scoreの0.612を上回った。LightGBMは閾値0.50でF1が0.484、均衡正解率が0.653と最も高く、ROC-AUCの優位はDeLong検定で有意だった（p=0.004）（抄録）。", "fun": "会社が決算の数字を都合よく見せる「利益調整」は、外からは見えにくいものです。この研究は、決算書の比率だけから疑いの強い会社を見分けるAIを作り、昔からある判定式より成績が良いことを示しました。しかも答えのもとになった数字を入力から外して、いわばカンニングを防いでいる点が面白いところです。", "unverified": "利益調整の代理ラベルに基づく評価で、実際の不正事例での検証は未確認。SHAP分析の結果は抄録が途中で切れているため未確認。"}}, {"id": "jr35", "rank": 35, "headline": "ケベック州会計士の懲戒432件を類型化", "title": "A Profile of Disciplinary Offenses in Québec's Accounting Profession", "url": "https://doi.org/10.1111/1911-3838.70060", "authors": "Sylvie Côté ほか", "venue": "Accounting Perspectives", "date": "2026-11-05", "citescore": 2.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Accounting Perspectivesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ケベック州の公認会計士の倫理違反を、2012〜2023年の有罪裁定432件のクラスター分析で4つの違反者像に分類した（抄録）。", "p3": "Gower距離とk-medoidsのクラスター分析を使い、Jonesの道徳的強度モデルに沿って違反の型を特定した（抄録）。", "p5": "手続きの不備が中心の「怠慢者」、横領や詐欺など重大な違反の「不正者」、管理・資格の違反の「不遵守者」、監督への抵抗と再犯の多い「妨害者」の4類型が得られ、専門職の特徴、倫理的な重さ、再犯の可能性がそれぞれ異なった（抄録）。", "fun": "会計士の不祥事と聞くと横領のような大事件を思い浮かべますが、実際の懲戒には、うっかりした手続きの誤りから監督への抵抗まで、性質の違うものが混ざっています。この研究は、それらを統計で4つの型に分け、型ごとに再発のしやすさも違うことを示しました。一律の研修より型に合った対策が必要だ、という点が面白いところです。", "unverified": "各類型の件数と再犯率の数値は抄録では未確認。"}}, {"id": "jr36", "rank": 36, "headline": "環境公益訴訟の試行で監査報酬は上がったか", "title": "Does environmental judicial reform influence audit fees? Evidence from China's environmental public interest litigation", "url": "https://doi.org/10.1108/cafr-11-2025-0247", "authors": "Simiao Song ほか", "venue": "China Accounting and Finance Review", "date": "2026-11-05", "citescore": 0.4, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "China Accounting and Finance Reviewの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "中国の環境公益訴訟の試行政策を準自然実験として使い、試行地域の企業の監査報酬が4.7%高くなったことを示した（抄録）。", "p3": "試行地域と非試行地域の企業を差の差の枠組みで比べ、平行トレンドの確認、プラセボ検定、傾向スコアのマッチング、同時期の政策の統制で頑健性を確かめた（抄録）。", "p5": "試行政策は監査人が感じる訴訟・規制のリスクを高め、作業時間の増加を伴わないリスク・プレミアムとして報酬に上乗せされた。ESGが弱い、情報の非対称性が大きいなどの企業で効果が強く、報酬の上昇は監査品質の改善につながらなかった（抄録）。", "fun": "環境を汚した企業を訴えやすくする制度ができると、企業の決算をチェックする監査人は「この会社は訴えられるかも」と身構えます。その結果、監査の手間は増えないのに料金だけが上がり、監査の質は良くならなかった、という結果が面白いところです。", "unverified": "報酬の上昇幅以外の係数の値と、標本の規模・期間は抄録では未確認。"}}, {"id": "jr37", "rank": 37, "headline": "気候リスクと上場企業の財務困窮", "title": "Climate Risk and Corporate Financial Distress: Evidence from Chinese Listed Firms", "url": "https://doi.org/10.1080/1540496x.2026.2745695", "authors": "Lei Zhang ほか", "venue": "Emerging Markets Finance and Trade", "date": "2026-11-06", "citescore": 6.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "Emerging Markets Finance and Tradeの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、気候リスクと企業の財務困窮の関係を中国の上場企業で実証した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "猛暑や洪水などの気候のリスクは、工場や物流を通じて会社の財布にも響きうるはずです。そのリスクが本当に会社を経営難に近づけているのかを、データで確かめようとする問いが面白いところです。", "unverified": "内容は題名からの推測で、気候リスクの測り方と結果は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "食肉加工の副産物を内部回収する原価モデル", "title": "An Extended Sustainable Strategic Costing Model for Circular Value in the Meat Processing Industry", "url": "https://doi.org/10.3390/jrfm19110864", "authors": "Silviya Petrova Chukanska ほか", "venue": "Journal of risk and financial management", "date": "2026-11-01", "citescore": 5.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Management（MDPI）の抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "食肉加工企業が自社の動物性副産物を外部処理から内部回収に切り替える判断を、生産・経済・環境の面から評価する拡張した戦略的原価計算モデルを作り、適用した（抄録）。", "p3": "活動基準原価計算、マテリアルフローコスト会計、品質原価、ライフサイクルコスティングを、結合原価の配分、投資評価、限定的な排出評価と組み合わせ、共通の物質収支と二重計上を防ぐ規則でつないだ（抄録）。", "p5": "肉骨粉と動物油脂の収入は全部原価の99.76%を賄った。10年・割引率7%の事前評価で単独の正味現在価値は323万ユーロ、外部処理の回避分を含む比較の価値は1,442万ユーロで、パラメータを変えても比較上の優位は保たれた（抄録）。", "fun": "食肉工場では骨や脂などの副産物が大量に出ます。お金を払って外部で処理してもらう代わりに、自分で肉骨粉や油脂に加工して売ると得になるのか。この研究は、お金・ものの流れ・二酸化炭素の三つを同じ帳簿の上で数えて判断できるようにしました。捨てていたものを資源として数え直す会計の工夫が面白いところです。", "unverified": "対象企業の規模と所在国は抄録では未確認。排出の評価は限定的な範囲と記載。"}}, {"id": "jr39", "rank": 39, "headline": "家族・地域と公共サービスの微視的な協働", "title": "Digging Into the Subsoil: Considering and Theorizing Human Services Delivery at the Sub‐Micro‐Level of the Public Service Ecosystem", "url": "https://doi.org/10.1111/puar.70234", "authors": "Kate Broadhurst ほか", "venue": "Public Administration Review", "date": "2026-11-05", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Public Administration Reviewの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "公共サービス・エコシステム理論の最も微視的な層として、公共サービスの価値創造を下支えする家族と地域のエコシステムに注目する「下層土の感受性」という概念を示した（抄録）。", "p3": "家族と地域の非公式なシステムを価値の創造と破壊の場とみなし、マクロの政策をミクロの実践に翻訳する接続点として立法・政策のノードを提案した。児童保護の事例（ビネット）で枠組みを示した（抄録）。", "p5": "ノードが相互作用の条件を作る一方、力の非対称性や信念体系の違いの中で、下層の動きが価値の共創と共破壊のどちらになるかを左右することを示した（抄録）。", "fun": "公共サービスは役所だけで完結せず、家族や近所の人たちの支えの上に成り立っています。この研究は、そうした目に見えにくい家族や地域のつながりを、植物を支える「下層土」にたとえて理論の中に位置づけました。サービスが価値を生むか壊すかが、その土台との相性で決まるという視点が面白いところです。", "unverified": "概念研究で、量的な検証は行っていない（抄録）。"}}, {"id": "jr40", "rank": 40, "headline": "AIによるB2Bサービス回復で顧客は何を推論するか", "title": "More than the messenger: Industrial customer inferences and failure severity in AI-enabled B2B service recovery", "url": "https://doi.org/10.1016/j.indmarman.2026.10.003", "authors": "Cristiana Raquel Lages ほか", "venue": "Industrial Marketing Management", "date": "2026-11-01", "citescore": 15.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "Industrial Marketing Managementの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、AIが関わるB2Bのサービス回復で、産業顧客が何を推論し、失敗の深刻さがその受け止めにどう影響するかを扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "取引先とのトラブルの対応をAIが担うとき、相手の会社はAIを単なる伝言役と見るのか、それとも対応の姿勢そのものを読み取るのか。失敗の深刻さによって受け止め方が変わるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、手法と結果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "デジタル・サービス革新が価値共創を促す", "title": "Digital service innovation and ecosystem value co-creation: the moderating role of B2C contexts under service-dominant logic", "url": "https://doi.org/10.1108/jmtm-05-2026-0549", "authors": "Matilde Morales-Gallego ほか", "venue": "Journal of Manufacturing Technology Management", "date": "2026-11-05", "sjr": 1.566, "citescore": 14.4, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Manufacturing Technology Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "製造業のデジタル・サービス革新（スマートな対話型サービスとスマートな作業技術）がエコシステムでの価値共創の基盤になり、その効果がB2Cの文脈で強まることを示した（抄録）。", "p3": "サービス・ドミナント・ロジックに沿って、製造業者303社のデータに高次の構成概念を含むPLS-SEMを当てはめ、市場志向（B2CかB2Bか）の調整効果を調べた（抄録）。", "p5": "デジタル・サービス革新は価値共創を支え、B2Cの環境ではB2Bより関係が強かった。B2Bでは構造的な慣性と能力の壁が相互作用の摩擦を生んでいた。スマートな作業技術と対話型サービスには相乗効果があった（抄録）。", "fun": "製品を売って終わりではなく、使われている間もデジタルのサービスで顧客と価値を作っていく、という考え方が製造業に広がっています。この研究では、一般消費者向けの方が企業向けより効果が強く、企業間の取引では昔ながらの仕組みが壁になっていました。同じ技術でも相手によって効き方が違う点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。係数の値は抄録では未確認。"}}, {"id": "jr42", "rank": 42, "headline": "ラストワンマイル配送を体験価値から設計", "title": "Conceptualising and designing experiential consumer logistics: a literature synthesis towards a value-based framework", "url": "https://doi.org/10.1108/ijpdlm-01-2026-0015", "authors": "Xueqin Wang ほか", "venue": "International Journal of Physical Distribution and Logistics Management", "date": "2026-11-05", "sjr": 2.015, "citescore": 15.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "International Journal of Physical Distribution and Logistics Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ラストワンマイル配送の価値を体験の面から捉える「体験型の消費者物流」を、物流とサービスデザインの文献の統合で概念化した（抄録）。", "p3": "2段階の文献レビューで、研究1は物流の文献から価値の構成と体験の仕組みを、研究2はサービスデザインの文献から体験価値を強める方法を整理した（抄録）。", "p5": "価値提案（ハイタッチかハイテクか）と価値の享受（個別か網の目か）の2軸で、伝統型・技術型・倫理型・プラットフォーム型の4つの構成を示し、関係構築と見えない設計の「寄り添い型」と、見える設計と共同体づくりの「力づけ型」の2つの設計の方向を対応づけた（抄録）。", "fun": "宅配便の価値は、早く確実に届くことだけではなくなりつつあります。配達する人とのやり取りや、倫理的な届け方といった「体験」も価値になる、という見方です。この研究は、その体験の型を2本の軸で4つに整理しました。毎日の荷物の受け取りを体験として設計し直す視点が面白いところです。", "unverified": "文献レビューで、実証データによる検証は行っていない（抄録）。"}}, {"id": "jr43", "rank": 43, "headline": "Instagramの日常行動から孤独の側面を読む", "title": "Everyday Instagram behavior maps distinct facets of loneliness in young adults", "url": "https://doi.org/10.1038/s44184-026-00252-z", "authors": "Yueyi Jiang ほか", "venue": "npj Mental Health Research", "date": "2026-11-06", "sjr": 1.814, "citescore": 7.2, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "npj Mental Health Researchの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米国の大学生415人のInstagramのデータから、孤独の社会的・情緒的な側面を行動の違いで見分けられる一方、構造的な孤立は捉えにくいことを示した（抄録）。", "p3": "同意を得たInstagramのデータの書き出しを使い、活動パターン、言語、画像から孤独に関する5つの妥当性の確認された尺度をモデル化し、モデルの説明分析で特徴を調べた（抄録）。", "p5": "マルチモーダルな痕跡は主観的な孤独を区別できたが、構造的な孤立には情報が少なかった。社会的な孤独は少ない「いいね」やコメントと、情緒的な孤独は否定的な言語、悲しい・怒った表情、深夜の活動と結びついていた（抄録）。", "fun": "孤独には、友達が少ないと感じる「社会的な孤独」と、心を通わせる相手がいないと感じる「情緒的な孤独」があります。SNSの使い方を調べると、前者は「いいね」やコメントの少なさに、後者は暗い言葉づかいや深夜の利用に表れていました。同じ孤独でも種類によって表れ方が違う点が面白いところです。", "unverified": "標本は大学生で女性とアジア系・白人が多く、一般化は今後の課題と著者が注記。予測精度の数値は抄録では未確認。"}}, {"id": "jr44", "rank": 44, "headline": "低所得高齢者のQOLは福祉レジームで違う", "title": "Comparing quality of life among older adults with relative low-income status across different welfare regimes in Europe", "url": "https://doi.org/10.1177/09589287261502284", "authors": "Shlomit Weiss-Dagan ほか", "venue": "Journal of European Social Policy", "date": "2026-11-05", "sjr": 1.181, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of European Social Policyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "欧州の4つの福祉レジームで、相対的低所得が高齢者の生活の質（QoL）を下げる程度が異なり、社会民主主義型と自由主義型で格差が小さいことを示した（抄録）。", "p3": "SHAREとELSAのデータ（N=120,577）で60歳以上を対象に、調査重み付きのOLSで、福祉レジームが相対的低所得とQoLの関係をどう調整するかを調べた（抄録）。", "p5": "相対的低所得はすべてのレジームでQoLを下げたが、社会民主主義型と自由主義型では低所得の有無によるQoLの差が有意に小さく、保守主義型と地中海型では大きく、両者の間に差はなかった。自由主義型（英国）は慢性疾患のある高齢者を的を絞って守っていた（抄録）。", "fun": "同じように所得が低い高齢者でも、住む国の福祉の仕組みによって暮らしの質は大きく違います。北欧型や英国型では低所得による差が小さく、大陸欧州型と南欧型では差が大きいままでした。個人の蓄えだけでなく、社会の仕組みが老後の暮らしを形づくるという点が面白いところです。", "unverified": "QoLの差の具体的な数値は抄録では未確認。"}}, {"id": "jr45", "rank": 45, "headline": "アイスランドの英語評議会と移民の地域参加", "title": "Language politics and immigrants’ inclusion in local governance in Iceland", "url": "https://doi.org/10.1515/soci-2026-0040", "authors": "Anna Wojtyńska ほか", "venue": "Sociolinguistica", "date": "2026-11-05", "sjr": 0.387, "citescore": 1.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Sociolinguisticaの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "外国生まれの住民が人口の半分を超えるアイスランド南部の小さな自治体で、2022年に設けられた英語の評議会を、言語的正義の観点から民族誌的に分析した（抄録）。", "p3": "移民の包摂と言語政策が交わる点を、地域の参加者への民族誌的な調査で調べた（抄録）。", "p5": "評議会の設置は地域の参加者に好意的に受け止められたが、移民の統合と社会的結束にとってのアイスランド語の重要性をめぐる批判と報道での論争を招いた。英語が地域の統合政策の中心になる一方、評議会はアイスランド語の講座と社会への接点の改善を優先していた（抄録）。", "fun": "住民の半分以上が外国生まれの町で、行政の話し合いを英語で行う場を作ったら、国中で「アイスランド語を守るべきだ」という議論が起きました。ところが、その英語の評議会が力を入れたのは、移民がアイスランド語を学べる機会を増やすことでした。包摂のための言葉選びの難しさと工夫が見える点が面白いところです。", "unverified": "参加者の人数と調査の期間は抄録では未確認。"}}, {"id": "jr46", "rank": 46, "headline": "孤独な高齢者とAIの「デジタル親族」", "title": "Older adults’ social responses to AI virtual humans in digital kinship contexts: associations of loneliness, perceived cues and appraisals with purchase intention", "url": "https://doi.org/10.3389/fpsyg.2026.1882559", "authors": "Yanxue Zou ほか", "venue": "Frontiers in Psychology", "date": "2026-11-04", "citescore": 7.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Frontiers in Psychologyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "短い動画の「デジタル親族」コンテンツに登場するAIバーチャルヒューマンへの高齢者の社会的・情緒的な反応と、購買意図との関係を調べた（抄録）。", "p3": "擬人化の3要因理論とCASA（コンピュータは社会的な行為者）のパラダイムに基づき、孤独、情緒的な訴え、人らしさ、同類性、社会的存在感、共感を位置づけた。65歳以上の中国人372人に標準化した動画を見せ、PLS-SEMとfsQCAで分析した（抄録）。", "p5": "PLS-SEMの結果は先行要因の異なるパターンを示したと述べるが、具体的な結果は取得した抄録の範囲に含まれない（抄録）。", "fun": "家族のような呼びかけで話しかけてくるAIの動画が、高齢者のスマホに流れてくるようになりました。そのやさしさが、いつの間にか商品のおすすめにつながっていることもあります。孤独な人ほどAIの「家族」に心を動かされ、物を買いたくなるのか、という問いが面白いところです。", "unverified": "抄録が途中で切れており、孤独と購買意図の関係の結果は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "スポンジシティ移行の政策目的と社会技術変化", "title": "Governing Sponge City Transitions: Policy Objectives and Socio‐Technical Change", "url": "https://doi.org/10.1002/eet.70156", "authors": "Valentin Meilinger", "venue": "Environmental Policy and Governance", "date": "2026-11-05", "sjr": 1.394, "citescore": 7.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Environmental Policy and Governanceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ドイツとオーストリアのスポンジシティ（雨水をためて浸透させる都市）づくりが、目標どおりの政策の循環ではなく、関係者が制度や知識を少しずつ組み替える「絡み合った改良」として進むことを示した（抄録）。", "p3": "質的なインタビューと文書分析で、オッフェンバッハ、ボーフム、ウィーンでの取り組みが各規模でどう運用・統治されているかを調べた（抄録）。", "p5": "回復した都市の水循環をめぐる競合する描写が、スポンジ都市の考え方を目標主導の都市再生事業へ翻訳する仕方に影響し、植生の住みやすさ、健康、公正への関心が雨水管理の論理を押し返していた（抄録）。", "fun": "大雨をためて地面にしみこませる「スポンジのような街」づくりは、計画どおりに進む技術の話に見えます。でも実際の街では、緑の心地よさや健康、公平さといった別の願いがぶつかり合い、関係者が少しずつ手直しを重ねていました。都市の水の問題が「誰のための街か」という問いにつながる点が面白いところです。", "unverified": "インタビューの人数と期間は抄録では未確認。"}}, {"id": "jr48", "rank": 48, "headline": "都市道路の移動行動を観察する道具の開発", "title": "Development, Pilot Testing, and Validation of the System for Observing Travel-Related Activity on Urban Roads (SOTRAVEL)", "url": "https://doi.org/10.1007/s11524-026-01174-z", "authors": "Alejandra Jáuregui ほか", "venue": "Journal of Urban Health", "date": "2026-11-05", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Urban Healthの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "都市の道路での歩行や自転車などの移動行動を、性別・年齢層・手段別に直接観察して数える道具SOTRAVELを開発し、妥当性を確かめた（抄録）。", "p3": "公園などでの観察法SOPARCの経路用の様式を、公道での能動的な移動に合わせて改変した。交通量の異なる8つの街路区間で15分の観察を、単独の観察者、2人の観察者、基準とする動画の3つの方法で行い、スピアマン相関とウィルコクソン符号順位検定で比べた（抄録）。", "p5": "動画と観察者による記録の相関は、性別・年齢などにわたって全体に強かった（r≥0.7）と述べる（抄録）。", "fun": "街を歩く人や自転車の数を数えるのに、高価なセンサではなく人の目で記録する方法を、信頼できる道具に仕立てました。動画を正解にして比べると、人の目の記録はよく一致していました。誰でも同じように使える「数え方の型」を作った点が面白いところです。", "unverified": "抄録は途中で切れており、手段別の一致度と調査した都市は未確認。"}}, {"id": "jr49", "rank": 49, "headline": "住民の土地提供で非正規居住地の道路を改良", "title": "Negotiating shared access space in informal settlements through micro-adjustments: Community leadership, land contribution and road upgrading in Dar Es Salaam", "url": "https://doi.org/10.1016/j.cities.2026.107748", "authors": "Gasper Kabendela ほか", "venue": "Cities", "date": "2026-11-04", "sjr": 1.772, "citescore": 11.5, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "Citiesの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、ダルエスサラームの非正規居住地で、地域の指導者のもとで住民が土地を提供し、小さな調整を重ねて共有の通路を作り道路を改良した過程を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "家が密集した地区に道を通すには、誰かが土地を少しずつ差し出す必要があります。お金で土地を買い上げるのではなく、住民どうしの話し合いと小さな譲り合いで道を広げられるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、対象地区と結果は未確認。"}}, {"id": "jr50", "rank": 50, "headline": "デジタル化と非倫理的な親組織行動", "title": "Digitalization and employees' unethical pro-organizational behavior in international engineering projects: mediating mechanisms and contextual moderators", "url": "https://doi.org/10.1108/ecam-03-2026-0451", "authors": "VanHieu Tran ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-05", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Engineering, Construction and Architectural Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "国際建設プロジェクトでデジタル化は従業員の非倫理的な親組織行動（組織のためと称する不正）に直接は影響せず、デジタル・ストレスと情報の透明性を通じて間接的に影響することを示した（抄録）。", "p3": "予備調査で質問票を改良し、国際建設プロジェクトに従事する請負業者の従業員の有効回答201件をPLS-SEMとIPMAで分析した（抄録）。", "p5": "デジタル化の直接効果は有意でなく、デジタル・ストレスはリスクを高める経路、情報の透明性はリスクを下げる経路として働いた。文化の違いと地理的な分散がこの関係を調整した（抄録）。", "fun": "「会社のためなら多少のごまかしも」という行動は、デジタル化で減るのでしょうか、増えるのでしょうか。この研究の答えは「どちらにも転ぶ」でした。デジタル化でストレスが増えればごまかしが増え、情報が見えやすくなれば減る。道具そのものより、それが職場に何をもたらすかが分かれ道だという点が面白いところです。", "unverified": "横断調査のため因果は確定できない（解釈）。経路係数の値は抄録では未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "地球科学", "headline": "東北沖のプレート境界は地震前の固着に戻った", "title": "Seafloor geodesy delineates fast megathrust relocking after the giant 2011 Tohoku earthquake", "url": "https:/       var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
