5", "rank": 5, "field": "因果推論", "headline": "不遵守のあるクラスターRCTで直接・波及効果を推定", "title": "A Bayesian machine learning approach to direct and spillover effects in cluster-randomized trials with noncompliance", "url": "https://arxiv.org/abs/2610.27425", "authors": "Saurabh Bhandari ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Bhandari, S., Li, F., & Daniels, M. J. (2026). A Bayesian machine learning approach to direct and spillover effects in cluster-randomized trials with noncompliance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27425", "why": "ベイズ加法回帰木とg計算で、遵守しない参加者がいる場合の波及効果を柔軟に推定する方法。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（動機の事例§2、モデル§5.1、シミュレーション§8、応用§9、考察§10）を読んだ。識別の証明（付録A）は読んでいない", "preprint": true, "p1": "処置を受けない人がいる（不遵守の）クラスター無作為化試験で、全体の効果を「本人が処置を受けた効果（直接効果）」と「仲間が受けた効果（波及効果）」に分けて推定するベイズ機械学習の方法を作った（抄録、§10）。未査読のプレプリントである。", "p2": "学校単位で割り付ける試験では、本人の受診と同級生の受診の両方が結果に効く。両者は強く相関するため、柔軟なモデルでも全体の効果は当てられても、その内訳を正しく分けるのが難しい（§8.1、§8.2）。", "p3": "結果と処置受領を、ベイズ加法回帰木（BART、多数の小さな決定木の和）にクラスターの変量効果を加えたBART-REでモデル化し、ベイズg計算で効果を求める（§5、§7）。工夫は「仲間の処置の巧妙な共変量（clever covariate）」で、事前の受領モデルから予測した仲間の受領割合を結果モデルに加え、正則化による内訳のゆがみを抑える（§5.1）。", "p4": "ケニアの学校駆虫事業（PSDP）に合わせて較正したデータで、正しく特定したパラメトリックなプロビットモデルと比べ（各500回の複製）、偏り・RMSE・95%信用区間の被覆率を評価した（§8.1）。巧妙な共変量の有無も、波及の強さを5段階に変えて比べた（§8.2）。応用は49校2,383人のPSDPデータ（§2、§9）。", "p5": "モデルが正しい場合はプロビットが良いが、非線形性があるとプロビットの被覆率は学校平均ITTの波及効果で8.2%（N=1,500）・0.6%（N=2,250）に落ち、BART-REは名目水準に近かった（§8.1）。巧妙な共変量がないと波及の便益が本人の効果に誤って付け替えられ、加えると中〜強い波及で両成分のMSEが半分以下になった（§8.2、図1）。PSDPでは学校への割付で感染確率が0.150低下（95%CrI −0.277〜−0.029）し、直接効果は−0.123（−0.272〜0.016）、波及効果は小さく不確かだった（§9）。", "p6": "著者は、本人が受けて仲間が受けていない組合せがデータにほとんどないと内訳はモデルの外挿に依存すること、片側の不遵守（対照群は誰も受けない）のため受領の依存性への感度分析が限られること、両側の不遵守での評価が今後の課題であることを認める（§10）。成分の信用区間は保守的で広い（§8.2）。", "fun": "全体の効き目は正しく当てられても、その内訳を「自分が薬を飲んだおかげ」と「周りが飲んだおかげ」に分けると、間違った振り分けが互いに打ち消し合って見えなくなることがあります。合計が合っていても中身が合っているとは限らない、という落とし穴を示した点が面白いところです。", "unverified": "感度分析（付録D・E）の具体的な結果は読んでいない。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "職業固有のタスク変化が賃金上昇を左右する", "title": "Occupational Uniqueness and Wage Growth", "url": "https://arxiv.org/abs/2610.28133", "authors": "R. Vestrelli ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Vestrelli, R., & Colladon, A. F. (2026). Occupational Uniqueness and Wage Growth (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28133", "why": "タスクが職業間にどう分布するかという新しい次元で職業の変化を測る枠組みを提示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（データと測定§3、結果§4の表2〜4、考察と結論§5）を読んだ。付録は未読", "preprint": true, "p1": "職業の仕事内容（タスク）の変化を、量だけでなく「そのタスクが他の職業でどれだけ行われているか」という構造で測る枠組みを作り、職業の独自性（タスクの組合せの他職業との違い）が高まった職業ほど賃金が伸びたことを示した（抄録、§4）。未査読のプレプリントである。", "p2": "タスクの追加・削除の研究は職業を独立したタスクの束として扱い、追加・削除されたタスクが職業固有か経済全体に広く普及しているかを区別してこなかった（抄録、§1）。", "p3": "1977年の職業辞典（DOT）と2018年のO*NET（v23.0）のタスク記述196,563件を、文章の正規化、1,536次元の埋め込みによる類似タスクの候補抽出と人手確認で調和させ、職業間・時点間のタスクのネットワークを作る（§3）。そこからタスクの普及度、職業の独自性、職業内と経済全体（グローバル）のタスク追加・削除を測る。例：追加されたタスクが他の多くの職業でも行われていれば、職業の独自性は下がる。", "p4": "302の調和した職業について、1980〜2018年の対数賃金の変化、労働者構成を調整した賃金、予測賃金を、独自性の変化（1977年分布の標準偏差単位）に回帰した（12大分類の固定効果、初期雇用で加重）（§4、表3）。賃金データはAutorら（2024）のセンサス・ACS由来。", "p5": "タスクの平均的な普及度は1977〜2018年に上がった（§5）。好ましい定式化（表3列4）では、独自性の1標準偏差の上昇が構成調整賃金の44.5%の上昇と関連し、独自性だけで構成調整賃金の伸びの変動の10%超を説明した。普及したタスクの追加は賃金の伸びの低さ、職業固有タスクの削除も低さと関連したが、経済全体で新しいタスクの追加は正、削除は負に関連した（抄録、§5）。", "p6": "著者は分析が関連の記述であり因果ではなく、独自性の変化の決定要因の分析は今後の課題だとする（§5）。賃金上昇の仕組みとして交渉力やタスク固有の人的資本を挙げるが、一つの可能な説明にとどめている（§5）。解釈：観察単位は302職業で、文章の調和の手作業の判断が測定に影響しうる。", "fun": "同じ「仕事が一つ増えた」でも、それがどの職業でもやっている仕事なら賃金は伸びにくく、その職業にしかない仕事なら伸びやすい、という結果です。コミュニケーション系の仕事は多くの職業に広がり、より専門的な頭脳労働が職業ごとの「売り」になりつつある、という変化の描き方も面白いところです。", "unverified": "表4の個々の係数の値は抽出テキストで数値が欠けており確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "ロボット審判で誰が得をしたか：韓国プロ野球", "title": "Who Gains When the Umpire Is a Machine? Evidence from the Automated Ball-Strike System (ABS)", "url": "https://arxiv.org/abs/2610.27576", "authors": "Seung Jin Cho ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Cho, S. J., & Lee, J. Y. (2026). Who Gains When the Umpire Is a Machine? Evidence from the Automated Ball-Strike System (ABS) (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27576", "why": "100万球超のデータで、人間の裁量の除去とゾーン形状の変化の効果を分けて測った自然実験。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（概念枠組み§2、制度とデータ§3、結果の要約§5.5、結論§6）を読んだ。§5の個別推定表は一部のみ", "preprint": true, "p1": "2024年に韓国プロ野球（KBO）が球審のボール・ストライク判定を自動判定システム（ABS）に置き換えた変化を、人間の裁量の除去と新しいストライクゾーンの形状の押し付けに分解し、誰が得をし誰が損をしたかを測った（抄録、§6）。未査読のプレプリントである。", "p2": "アルゴリズムが人間の評価者を置き換えると何が起きるかは、評価の質を一つ一つ測れる場面がほとんどなく検証が難しい。野球の投球判定はすべての判定が記録され、正しさを測れるまれな場である（§1、§6）。", "p3": "判定確率の変化を、①ルールのゾーンと人間の平均ゾーンの差（幾何的成分：位置・身長・利き手だけに依存）と、②文脈に応じた人間の判断のずれ（裁量的成分：カウント、捕手のフレーミング、スター打者への配慮）に分ける（§2.2、式2）。ABSのゾーンは打者の登録身長の27.64〜56.35%（2025年から27.04〜55.75%）で身長に比例する（§3.1）。", "p4": "Naver Sportsの追跡データから2021〜2026年の4〜9月の公式戦1,203,755球（判定657,201球、打席308,959）を集め、判定・投手・打者の各段階で、身長・利き手・露出の違いによるリーグ内の比較とシーズン固定効果で同時期の他の規則変更を吸収した（§3.2、§4）。", "p5": "ABSでカウント依存の判定、捕手のフレーミングの価値、スター打者のわずかな優遇はいずれも検出できなくなったが、その価値は捕手1シーズン当たり数点、スター打者1シーズン当たり約1点にすぎなかった（§6）。ゾーン上部3分の1の投球はストライク判定が13.9ポイント上がり、背の高い打者へストライクが移ったが、最も影響の大きい対戦でも23打席に1回以下で、打席結果への効果はほぼゼロだった（§6）。投手は高めの投球を素早く増やしたが、打者の適応は見られなかった（§5.5）。", "p6": "著者は、1リーグ・変更後3シーズンのみで打者が後で適応するかは不明、年俸や契約は観測できない、スター性の指標が過去の出塁率で不完全、2024年以前の投球位置を独立に検証できない、他の規則変更の吸収はリーグ内比較の仮定に依存する、と認める（§6）。", "fun": "機械の審判は「えこひいき」や「空気を読んだ判定」を消しましたが、同時にゾーンを身長に比例させたことで背の高い打者に不利なストライクが増えました。それでも結果にほとんど差が出なかったのは、ちょうど境目に来る球が少ないからです。ルールの公平さは、判定そのものより「どこに線を引くか」で決まる、という点が面白いところです。", "unverified": "判定・投手・打者の各推定表（§5.1〜5.3）の個々の係数は一部しか確認していない。"}}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "予測市場は参加者が偏っても価格は偏らない", "title": "Diversity, Efficiency, and Incentives in Political Prediction Markets", "url": "https://arxiv.org/abs/2610.28277", "authors": "Harry Crane ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Crane, H., & Strumpf, K. (2026). Diversity, Efficiency, and Incentives in Political Prediction Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28277", "why": "100年超の政治賭博市場と規制取引所のデータで、参加者の非代表性と価格の偏りの関係を検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ§2、予測精度§3.2、解釈§5.8、結論§7）を読んだ。§4〜§5の個別の分析表と付録の理論は一部のみ", "preprint": true, "p1": "政治の予測市場では参加者が有権者を代表していなくても価格は偏らないことを、2024年米大統領選の規制取引所Kalshiの匿名化取引データと、100年以上の政治賭博市場の記録で示した（抄録、§7）。未査読のプレプリントである。", "p2": "予測市場への批判として、参加者が若い男性に偏っており、その政治的な好みが価格をゆがめる、という議論がある。参加者の構成と価格の正確さの関係を、取引者単位のデータで直接確かめた研究はなかった（抄録、§5.8）。", "p3": "理論的には、価格が真の確率に収束するのは「金額で重み付けした信念の誤差」が消えるときで、それは参加者の分布に言及しない（付録A、§5.8）。実証では、Kalshiの取引を郵便番号の党派性・性別・年齢と結び付け、取引の方向が属性に左右されるかを取引頻度別に調べた（§5）。予測精度は日次のブライアースコア（予測確率と結果の差の二乗、低いほど良い）で比べた（§3.2）。", "p4": "比較対象は市場5つ（Kalshi、Polymarket、PredictIt、Betfair、英国ブックメーカーの合議）と世論調査ベースのモデル3つ（The Economist、FiveThirtyEight、Silver Bulletin）で、全国・激戦7州・上院19選挙などを、確定した選挙結果で採点した（§3.2）。外部の再現として、1人1契約850ドル上限のPredictIt（2016年）と1900年のニューヨークの市場を用いた（抄録）。", "p5": "Kalshiの取引者は86%が男性、半数が30歳未満だった（抄録）。全国の大統領選（10月7日〜11月5日）では上限のない市場のブライアースコアが0.166〜0.185、世論調査モデルは0.241〜0.252で、すべての市場がすべてのモデルを上回った。上限のあるPredictItは0.219だった（§3.2、表1）。取引1回だけの層は出来高の73%をハリス側に置き、取引100回超の層では居住地の党派性が取引方向も成果も予測しなかった（§5.8）。", "p6": "著者は、Kalshiの証拠は1回の選挙の最終1か月で結果が既知のため利益の結果に事後的な要素があること、性別は推定値、党派性は郵便番号単位の生態学的指標であること、価格が他の取引所から取り込まれた可能性を分離できないことを認める（§5.8）。解釈：データはKalshiから提供されており（謝辞）、独立の再現が望まれる。", "fun": "予測市場の参加者は若い男性ばかりなのに、価格は世論調査より正確でした。鍵は「たくさん取引する人ほど自分の政治的な好みではなく、もうけで動く」こと。1回だけ賭けた人は負けた側に多く賭け、ヘビーな取引者は勝った側を適正な値段で買っていた、という対比が面白いところです。", "unverified": "下位の選挙（激戦州・上院）の個別のブライアースコアと付録Aの定理の詳細は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "分位点しか公表されないデータで回帰を推定する", "title": "Quantile-Only Regression: Inference and Partial Identification under Quantile Disclosure", "url": "https://arxiv.org/abs/2610.27224", "authors": "Masamune Iwasawa ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Iwasawa, M., & Nakanishi, H. (2026). Quantile-Only Regression: Inference and Partial Identification under Quantile Disclosure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27224", "why": "平均ではなく分位点だけが開示される状況での推定・推論と部分識別の方法を体系化した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論§1、モデル§2、シミュレーション§5、実証例§6.1〜6.2、結論§7）を読んだ。証明（補足資料A）は読んでいない", "preprint": true, "p1": "公的統計などで集団の平均が公表されず分位点（中央値・四分位など）だけが公表される場合に、集団平均の線形回帰の係数を推定・推論する方法と、情報が足りないときの部分識別の方法を体系化した（抄録、§7）。未査読のプレプリントである。日本の科研費（JSPS KAKENHI）の支援を受けている。", "p2": "プライバシーや報告の慣習のため、統計はしばしば集団の人数と分位点だけを公表する。中央値を平均の代わりに使うと、平均と中央値の差が集団の特性と系統的に関係する場合に回帰係数を誤る（§1）。", "p3": "公表された分位点を区分線形に補間して積分し集団平均を再構成し、標本数で重み付けした最小距離法で係数を推定する（§1、§2）。分位点が増えていく場合は、再構成の誤差を「格子の粗さ」と「分位点の推定誤差」に分解し、一致性と漸近正規性を示す（§3）。分位点が固定のときは一般に点識別できず、鋭い識別集合と同時信頼領域を導く（§4）。例：児童福祉の評価日数では、下限0と四分位から m̂ = 0.25Q(0.25) + 0.25Q(0.50) + 0.375Q(0.75) と再構成する（§6.2）。", "p4": "シミュレーション（10群、1万回の複製）で、分位点の数Kと配置（等間隔か右裾が粗いか）を変えて偏り・MSE・被覆率を調べた（§5）。実証では、公表平均を検証用に残した2024年NAEP（全米学力調査）8年生数学の104群、英国の児童福祉の評価期間と議会の政治的支配、医療関連感染と医療費の3例に適用した（§6）。", "p5": "Kが増えると偏りとMSEが下がり、等間隔の格子は少ない分位点で被覆率95%近くに達したが、右裾が粗い格子では標本数を増やしても再構成の偏りが残り被覆率が大きく下がった（§5.1、図1）。NAEPでは3種の開示とも公表平均による基準値28.4に近く、四分位から5つの百分位に増やすと射影区間の幅が約54%縮んだ（§6.1、表2）。児童福祉の例では主推定値 −0.830日（標準誤差0.061）だが、射影区間はすべて0を含んだ（§6.2、表3）。", "p6": "著者は、分位点の間の形状制約による識別の強化、パネル・非線形モデル、効率的な重み付け、変量効果メタ分析、群の数が増える場合の局所多項式RDへの拡張を今後の課題とする（§7）。解釈：通常の信頼区間は有限格子の再構成の偏りを考慮しないため、分位点が少ない場合は部分識別の区間で慎重に解釈する必要がある。", "fun": "統計表に平均がなく「真ん中の値」や「4分の1の値」しか載っていない、という状況はよくあります。いくつかの目盛りを線でつないで面積を求めれば平均を近似でき、目盛りの数と置き方しだいで分かることの限界が決まる、という点が面白いところです。統計の公表の仕方そのものが研究の質を左右することを示しています。", "unverified": "医療関連感染の例（§6.3）の結果と定理の正確な条件は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "合成コントロール：シリアの所得差は閉じない", "title": "A Break That Does Not Close: Synthetic Control Evidence from Syria, 2000–2022", "url": "https://doi.org/10.2139/ssrn.7642962", "authors": "Mazen Diwani", "venue": "SSRN", "date": "2026-10-20", "apa": "Diwani, M. (2026). A Break That Does Not Close: Synthetic Control Evidence from Syria, 2000–2022. https://doi.org/10.2139/ssrn.7642962", "why": "標本を延長し対照国群を見直すと、内戦後の回復という先行研究の結論が覆ることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "2011年のシリア内戦の開始で生じた1人当たりGDPの差は閉じておらず、2022年まで広がり続けたことを合成コントロール法で示し、「回復した」という先行研究の結論を覆した（抄録）。未査読のプレプリントである。", "p2": "内戦で開いた所得の差が戦闘の沈静化後に閉じるのか、それとも本来の経路より低いまま続くのかは、復興計画の前提を左右する。唯一の先行の合成コントロール研究は2021年で標本が終わり、2013年以降の回復でパンデミック前にほぼ反実仮想に収束したと報告していた（抄録）。", "p3": "合成コントロール法は、処置を受けていない国々（ドナー）の加重平均で「内戦がなかった場合のシリア」を作り、実際との差を効果とみなす（背景）。本研究は標本を2022年まで延長し、UCDP（ウプサラ紛争データ）で紛争国を除いた98か国のドナー群を用いた（抄録）。", "p4": "基準の推定に加え、拡張合成コントロール（Ben-Michaelら 2021）、一般化合成コントロール（Xu 2017）、ドナー群の制限、ジャックナイフで頑健性を確かめ、20の内戦の平均年損失17.5%（Costalliら 2017）と比べた（抄録）。", "p5": "実際と合成の1人当たりGDPの差は処置後のどの時点でも閉じず、2022年に1,096ドル（60.6%）に達し、年平均49.4%だった。拡張合成コントロールは1,107ドルで基準を確認し、推定法とドナーの制限をまたいで損失は[1,025, 1,626]ドル、ジャックナイフ区間[−1,350, −863]ドルは0を含まず、7つの定式化のうち6つが59.0〜64.9%の狭い幅に入った（抄録）。", "p6": "著者は、先行研究の回復という読みは、2019年以降の乖離の前で終わる標本と、紛争の有無を質的にしか選別しなかったドナー群による産物だとする（抄録）。解釈：戦時のシリアのGDP統計自体の信頼性は抄録では論じられておらず、データの質が結論に影響しうる。", "fun": "「戦争が終われば経済は元に戻る」と思いがちですが、シリアでは差が10年以上たっても縮まらず、むしろ広がっていました。比べる相手の国の選び方と、いつまでのデータを見るかで結論が正反対になる、という点が、データ分析の怖さと面白さを同時に教えてくれます。", "unverified": "ドナー国の重みや予測因子の一覧、GDPデータの出典は抄録になく未確認。"}}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "処置効果は項目ごとの異質性に頑健か検定する", "title": "Testing Whether Reported Treatment Effects are Robust to Item-Level Heterogeneity", "url": "https://doi.org/10.31234/osf.io/9ru45_v3", "authors": "Peter Francis Halpin ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Halpin, P. F., & Gilbert, J. B. (2026). Testing Whether Reported Treatment Effects are Robust to Item-Level Heterogeneity. https://doi.org/10.31234/osf.io/9ru45_v3", "why": "多項目の尺度で報告される処置効果が、項目反応理論の潜在変数への効果と一致しない条件を示した。", "explain": {"basis": "本文", "basis_note": "PsyArXiv版のPDF本文（結論、何をすべきか§4.1、限界§4.2、要約§4.3と図5・6）を中心に読んだ。理論の導出と事例研究の節は一部のみ", "preprint": true, "p1": "複数の設問（項目）からなる教育・心理尺度で報告される処置効果が、項目ごとの効果のばらつき（IL-HTE）に頑健かを判定する診断検定を提案し、再分析では素朴な効果がしばしば上方に偏っていることを示した（抄録、結論）。未査読のプレプリントである。", "p2": "処置効果は項目の単純平均で報告されることが多いが、項目反応理論（IRT）で考えると、①測りたい潜在特性への効果（impact）、②項目の集計値での効果、③項目ごとの効果は、項目ごとに効果が異なると一致しない。これを区別しないと研究の妥当性が損なわれる（抄録、結論）。", "p3": "項目の単純平均による効果と、外れた項目の効果の重みを下げる頑健な推定値を比べ、その差（Δ統計量、式11）が有意なら素朴な効果は項目の異質性に影響されていると判断する（結論）。直観は、標本平均が外れ値に引っ張られるのと同じように、少数の項目の大きな効果が平均を押し上げる、というもの。", "p4": "事例研究で使い方を示し、項目単位のデータが入手できた22研究34データセットを再分析した小さなメタ分析で、どれだけの頻度で問題が起きるかを調べた。研究者が自作した尺度（RD）と独立に開発された尺度（ID）を比べた（結論、図5）。", "p5": "34データセット中11で、素朴な効果が5%水準で項目の異質性の影響を受けていた。素朴な効果は頑健な推定値より上方に偏る傾向があり、その傾向は素朴な効果が大きい研究で強かった。研究者自作の尺度で効果が大きく出るというよく知られた関連の大部分が、この上方の偏りで説明された（結論、図6）。", "p6": "著者は、異質性がない場合に一次元IRTモデルが妥当であることを前提とし、同じ方向に異質な項目が半数を超えると検出力が落ちること、1群500人未満では検出力が低いこと、無作為割付を前提とし観察研究には未対応であること、メタ分析が項目データの入手可能性にもとづく小さな便宜標本であることを限界に挙げる（§4.2）。", "fun": "テストの平均点が上がったとき、それは「本当に力がついた」のか「授業で扱った数問だけ点が上がった」のかで意味が違います。少数の問題だけが平均を押し上げているかを見抜く方法で調べると、研究者が自分で作ったテストほど効果が大きく見える理由の多くが説明できた、という点が面白いところです。", "unverified": "事例研究の具体的な数値と、Δ統計量の分布の詳細は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "計算社会科学・ネットワーク科学", "headline": "誤情報の特徴を分類する練習が騙されにくさを高める", "title": "Prebunking via Induction: Categorization Practice Reduces Misinformation Susceptibility", "url": "https://doi.org/10.31234/osf.io/w2bmp_v2", "authors": "Benjamin Motz ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Motz, B., Moore, K., Gregg, K., & Roozenbeek, J. (2026). Prebunking via Induction: Categorization Practice Reduces Misinformation Susceptibility. https://doi.org/10.31234/osf.io/w2bmp_v2", "why": "高校の授業内で無作為割付し、カテゴリー帰納による誤情報対策を通常の指導と比較した。", "explain": {"basis": "本文", "basis_note": "PsyArXiv版のPDF本文（方法、結果RQ1〜RQ5、考察の限界の節）を読んだ", "preprint": true, "p1": "高校の公民の授業で、SNS投稿を誤情報の手口ごとに分類する練習（カテゴリー帰納）をした生徒は、手口の解説動画と選択式問題で学んだ生徒より、未知の本物・偽物の見出しをよく見分け、操作的な投稿を共有しにくくなったことを、授業内の無作為割付で示した（抄録、結果）。未査読のプレプリントである。", "p2": "誤情報への抵抗力には練習が要るとされるが、どんな練習が良いかは不明だった。手口を説明して確認問題を解かせる標準的な教え方（事前の免疫付け、プレバンキング）が、実際の見分けに転移するかも確かではない（抄録、序論）。", "p3": "AIで作った投稿を、人身攻撃・感情的な言葉・誤った二分法・支離滅裂・スケープゴートの5手口か「誤情報なし」に分類させ、10問連続正解か30問で終了とした。対照群は既存の5本の解説動画と8問の選択式問題（例は一切示さない）で学んだ（方法）。直観は、多くの具体例を自分で仕分けることで手口の「型」を身に付ける、というもの。", "p4": "米国の高校9年生の上級公民の生徒191人（2025・2026年春）を、教育研究基盤Terracottaで週1回5週間の課題に無作為割付した（方法）。主な評価は、別の形式の転移課題MIST（本物・偽物の見出し10件）の識別指標（正しく偽と判定した数−本物を偽と誤判定した数）（RQ4）。", "p5": "分類練習で正答率は60.5%から77.3%に上がった（OR 2.06）。MISTの識別指標は分類練習群2.13、対照群1.29で有意な差があり（b = 0.84、95%CI [0.22, 1.46]、p = .008、d = 0.42）、誤警報は少なく（1.52対2.06）、全体の「偽」と答える傾向には差がなかった（p = .21）。概念知識の事後テストは52.9%対48.1%で差は有意でなかった（結果）。", "p6": "著者は、研究は探索的で、事後テストに正確さの誘因がなく週の課題より正答率が低かったこと、訓練した手口の範囲を超えて共有意向が変わるわけではないことを認め、実際のオンライン行動への持続的な効果は今後の課題とする（方法、考察）。解釈：1つの学校の上級クラスで同じ教員が担当しており、一般化には追試が要る。", "fun": "「だましの手口」を説明で覚えるより、実際の投稿を手口ごとに仕分ける練習を繰り返した生徒のほうが、初めて見るニュースの真偽をよく見抜けました。しかも何でも疑うようになったわけではなく、本物を偽物と決めつける失敗が減った点が面白いところです。図鑑を読むより実物を見分ける練習が効く、という学びの原理に通じます。", "unverified": "共有意向（RQ5）とメタ認知（RQ6）の具体的な推定値は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "計算社会科学・ネットワーク科学", "headline": "複数の話題をつなぐ多層ネットワークの意見形成", "title": "DeGroot Dynamics on Multiplex Networks with Directed and Acyclic Interlayer Connectivities", "url": "https://arxiv.org/abs/2610.27198", "authors": "Mia Zender ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zender, M., Shi, K., Hickok, A., Chu, W., & Porter, M. A. (2026). DeGroot Dynamics on Multiplex Networks with Directed and Acyclic Interlayer Connectivities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27198", "why": "話題間の影響を有向・非巡回の層間結合で表したDeGrootモデルの合意条件を解析した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデル§4、理論結果の要旨§5、数値シミュレーション§6、結論§7）を読んだ。定理の証明（付録A）は読んでいない", "preprint": true, "p1": "人の意見が同じ話題の周囲の意見だけでなく自分の関連する話題の意見にも影響される状況を、話題ごとの層を有向・非巡回につないだ多層（マルチプレックス）DeGrootモデルで表し、収束と合意の条件を証明した（抄録、§7.1）。未査読のプレプリントである。", "p2": "意見形成のモデルは、ある話題の意見がネットワークの隣人の同じ話題の意見にどう影響されるかを主に扱ってきた。しかし選挙での候補者の評価は、さまざまな争点への自分の意見に左右される（抄録、§1）。", "p3": "更新則は x_iα(t+1) = Σ_j D_α(i,j) x_jα(t) + Σ_(β>α) b_αβ x_iβ(t)（式5）で、同じ話題の隣人の意見の加重平均と、自分の関連話題の意見の加重和の和である。層間の影響は循環しない（DAG）ため、行列は上三角のブロック構造になる（§4.2）。例：「基本的な信念」の層（入力のない源層）が「候補者への意見」の層（出力のない吸収層）に一方向に影響する。", "p4": "各層内の影響行列の対角が正という穏やかな条件で収束を証明し、源層が強連結なら各層で合意に至ることを示した（§5、§7.1）。数値実験では2層ネットワークで、完全グラフ、有向ER、核-周辺、共同体構造のSBMを、均等な初期意見と分極した初期意見で比べた（§6）。", "p5": "層αの極限の意見は、αへの経路をもつ源層の初期意見だけで決まる（§7.1）。源層が強連結なら、他の層がそれ自体では分極するような構造でも、基本的な信念の合意が他の話題の合意を導いた（抄録）。層間の重みの和が0に近づく極限と、ちょうど0の場合では動態が質的に異なった（§7.1）。数値実験では有向ER（p = 0.05）や4共同体のSBMでも合意が観察された（§6.2）。", "p6": "著者は、より一般的な多層構造（循環を含む層間結合）、意見更新の一般化、AIエージェントを含む場合の検討を今後の課題とする（§7.2）。解釈：初期意見はモデル上の設定で、実データの意見分布での検証は行っていない。", "fun": "「どの候補者が好きか」という意見は、税や環境など根っこにある考えに引っ張られます。その根っこの考えについて人々がつながって話し合っていれば、たとえ候補者の話では分断されていても、最終的には意見がまとまっていく、という数学的な結論が面白いところです。", "unverified": "定理の正確な仮定と証明、シミュレーションの全図（図2〜図43）の詳細は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "機械学習（Hugging Face）", "headline": "ロボット群が経験を共有して方策を改善する", "title": "Learning from Fleet Experience: A Collective Learning Paradigm for Robots", "url": "https://arxiv.org/abs/2610.25736", "authors": "Chao Yu, Shu&#39 ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Yu, C., Yu, S., Lin, H., Zang, H., Yan, Y., Jiang, C., Guo, Z., Li, C., Chen, Y., Xu, X., Fu, X., Zhou, J., Shi, L., Ren, H., Liu, Y., Wu, J., Wang, Y., Wu, C., Dai, B., … Wang, Y. (2026). Learning from Fleet Experience: A Collective Learning Paradigm for Robots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25736", "why": "人手の修正に頼らず、配備されたロボットの失敗と成功の経験を共有して共通方策を改善する学習法。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法の概要§3.1、実験設定§4.1、結果§4.2〜4.3、結論§6）を読んだ。システム設計§3.2の詳細と付録は未読", "preprint": true, "p1": "配備されたロボット群（フリート）が自分たちの実行経験を共有して共通の方策を改善する「集団経験学習（CEL）」を提案し、人間の追加の修正なしに5つの実作業で成功率93.3〜99.2%に到達した（抄録、§6）。未査読のプレプリントである。", "p2": "ロボットは配備中の経験から学べるが、人間の修正で学ぶ方法では、遠隔操作者が実行を監視して失敗時に介入し続ける必要があり、台数が増えると人手が追いつかない（抄録、§1）。", "p3": "FERT（失敗に導かれた経験検索による微調整）は、①各ロボットが非同期に経験を集め、②経験を符号化し、③失敗した場面を手がかりに、フリートが共有する成功軌跡から似た場面の区間を検索し、④その成功時の行動を教師として優先的に微調整する（§3.1）。人間が与えるのは成功・失敗の二値ラベルと環境のリセットだけ（§4.1.2）。耐障害性のある非同期学習システムFATSが、一部のロボットが止まっても収集・最適化・配布を続ける（§3.2）。", "p4": "双腕ロボットAgiBot G2で、花の生け込み、服たたみ、充電、スツール組立、スマホの箱詰めの5作業を評価した。学習に使っていない2台で各60回、計120回試行し、Wilsonの95%信頼区間で成功率を比べた。比較対象は単体のオンライン強化学習RLT、フリートの経験を使うオフライン強化学習RECAP、人間の遠隔操作（§4.1）。", "p5": "複数ロボットのHG-DAggerで平均成功率は36.3%から81.0%に上がり、FERTは追加の専門家データなしで97.3%に高めた（失敗率の相対86.0%減）（§4.2、表3）。充電は60.0%→97.5%、箱詰めは96台で79.2%→98.3%で、FERTは5作業すべてで人間の遠隔操作を平均16.7ポイント上回った（§4.2）。1台当たりの収集時間を固定すると、台数が多いほどおおむね成功率が上がった（§4.3、図6）。", "p6": "著者は、評価が単一のロボット機種での作業別の方策と5作業に限られ、より広い作業の分布、異なる機種の混在、長期運用での変化への適応が今後の課題だと認める（§6）。解釈：初期方策は人間の介入データで作られており、FERTの改善はそのよい出発点を前提にしている。", "fun": "たくさんのロボットが同じ作業をしていれば、どこかのロボットはうまくいった経験をもっています。あるロボットが失敗したら、仲間の成功例から似た場面を探して真似する、という「みんなの経験の共有」で、人が手取り足取り教えなくても上達できた点が面白いところです。", "unverified": "アブレーション（§4.4）とシステム計測（§4.5）の具体的な数値、理論解析（付録B）は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "最適輸送の汎関数に対する中心極限定理", "title": "Central Limit Theorems for Optimal Transport Functionals", "url": "https://arxiv.org/abs/2610.27857", "authors": "Haruki Kono", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Kono, H. (2026). Central Limit Theorems for Optimal Transport Functionals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27857", "why": "二次最適輸送のスカラー汎関数の経験推定量について中心極限定理を確立した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（動機と設定§1.1、結果の概要§1.2、結論§6）を読んだ。§2〜§5の詳細と証明（付録A）は読んでいない", "preprint": true, "p1": "二次最適輸送の写像とポテンシャルのスカラー汎関数（ワッサースタイン費用や輸送ベースの多変量分位点によるリスク尺度など）について、経験的なプラグイン推定量の中心極限定理、ブートストラップの妥当性、準パラメトリック効率性を確立した（抄録、§6）。未査読のプレプリントである。", "p2": "自然な方法は、推定した輸送写像の極限定理と関数のデルタ法を組み合わせることだが、著者らは2次元以上では経験的な輸送写像の誤差がどんな正規化でもL²でゼロでない弱極限をもたないことを示した（定理1）。このため従来の道筋は使えない（抄録、§1.1）。", "p3": "写像の極限を経由せず、汎関数を目標分布について直接線形化する。θ(R) − θ(P) = (R − P)ψ_P + 剰余、剰余は輸送写像の誤差のr乗で抑えられる（式2、r ∈ (1, 2]）。影響関数ψ_Pは線形の楕円型偏微分方程式で特徴付けられる（抄録、§1.2）。例：参照分布を一様分布、目標を観測データの分布とすると、輸送写像は多変量の「分位点関数」になり、ワッサースタイン距離の2乗や裾の最大相関がその汎関数になる（§1.1）。", "p4": "理論論文で、剰余が√n尺度で無視できる条件を、既知の経験的輸送写像の収束速度で確かめる。滑らかな汎関数（ワッサースタイン距離など）は r = 2、重みが不連続な裾の最大相関は r = 4/3 で、どの次元で正規近似が成り立つかを判定する（§1.2）。", "p5": "r = 2 の汎関数では2次元と3次元で、r = 4/3 では2次元で、√nのガウス極限が成り立つ（§1.2）。展開はリサンプリング後にも成り立ち、同じ次元で経験的ブートストラップ信頼区間が妥当になる。漸近分散 Pψ_P² は局所摂動に正則などんな推定量も下回れない情報限界で、プラグイン推定量はそれを達成する（§1.2、§5）。", "p6": "著者は、高次元への拡張と、参照分布を推定する場合が今後の課題だと述べる（§6）。展開自体はすべての次元で成り立つが、高次元では剰余が√n尺度で無視できるとは限らない（§1.2）。参照分布は既知、台は有界凸領域という前提がある（§1.1）。", "fun": "分布全体の「運び方」（輸送写像）は、データが増えてもきれいな正規分布の揺らぎに落ち着かないことが証明されました。それでも、知りたいのが距離やリスクのような一つの数なら、きちんと正規分布で信頼区間が作れる。全体は扱えなくても要約なら扱える、という発想が面白いところです。", "unverified": "定理の正確な正則性条件と、部分群の評価の結果（付録A.2）は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "データストリームでのオンライン適合予測の実用性", "title": "Practical Advantages of Online Conformal Prediction for Data Streams", "url": "https://arxiv.org/abs/2610.27740", "authors": "St\\'ephane Chr\\'etien ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Chrétien, S., Hoseini-Behbahani, M., & Metzler, G. (2026). Practical Advantages of Online Conformal Prediction for Data Streams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27740", "why": "厳密な全適合予測の計算負担を避けるオンライン版の実用上の利点を整理した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "データストリームでの4種類の逐次的な適合予測（conformal prediction）を、重み付き全適合予測と被覆率・区間幅・計算量で比較した（抄録）。", "p3": "通常または忘却係数付きの最小二乗と、一様・指数重みの残差分位点、またはオンライン勾配による分位点追跡を組み合わせた手順を、独立同分布の対照、2つの合成分布シフト、4つの実データで評価した（抄録）。", "p5": "回帰モデルと適合予測の閾値の両方を適応させることの利点を示唆している（抄録の途中まで）。", "fun": "予測に「どのくらい外れうるか」の幅を付けるのが適合予測です。データの性質が時間とともに変わる流れの中では、昔のデータを少しずつ忘れていく工夫が効くかを、計算の手間も含めて比べた点が実用的で面白いところです。", "unverified": "抄録の結論部分が切れており、手順間の優劣は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "事前データ適合ネットワークの偏りを除いた準パラメトリック推論", "title": "Debiased Prior-Data Fitted Networks for Amortized Bayesian Semi-Parametric Inference", "url": "https://arxiv.org/abs/2610.28314", "authors": "Valentyn Melnychuk ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Melnychuk, V., Javurek, E., & Feuerriegel, S. (2026). Debiased Prior-Data Fitted Networks for Amortized Bayesian Semi-Parametric Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28314", "why": "償却型ベイズ推論のPFNに偏り補正を加え、準パラメトリック推論に使えるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前データ適合ネットワーク（PFN）を、欠測下の平均や因果効果などの準パラメトリックな推論に使うための偏り除去の理論を与えた（抄録）。", "p3": "理想化したPFNでも、目標の事後分布の集中の速さが潜在的な撹乱関数の集中の速さに依存し、事前分布が多様になると遅くなることを示し、2つの一般的な偏り除去の戦略を導入した（抄録）。", "p5": "偏り除去により目標の事後集中の速さを改善するとしている。数値結果は抄録の範囲では未確認。", "fun": "PFNは「たくさんの模擬問題で練習したニューラルネットが、新しいデータを見るだけで推論する」仕組みです。そんな賢いネットでも、知りたい量以外の余計な部分の推定の粗さに引きずられることを示し、その補正法を考えた点が面白いところです。", "unverified": "偏り除去の具体的な手順と数値実験の結果は未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "測度で添字付けたカーネルリッジ回帰で文脈内学習", "title": "Nonparametric In-Context Learning and Inference via Measure-Indexed Kernel Ridge Regression", "url": "https://arxiv.org/abs/2610.28056", "authors": "Zuofeng Shang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Shang, Z., Hu, T., Yang, F., & Li, Y. (2026). Nonparametric In-Context Learning and Inference via Measure-Indexed Kernel Ridge Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28056", "why": "複数タスクから学ぶ文脈内学習を非パラメトリック推論として定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文脈内学習（in-context learning）を、測度で添字付けた再生核ヒルベルト空間の枠組みで非パラメトリックな推論として定式化した（抄録）。", "p3": "推定量の適応性を、文脈の経験測度に対する平均汎関数の依存として捉える測度添字付きRKHSを作り、文脈内学習推定量の分布的な振る舞いを扱う（抄録）。", "p5": "抄録が途中で切れており、収束や推論の具体的な結果は未確認。", "fun": "大規模言語モデルは、例をいくつか見せるだけで新しい課題に対応できます。この「例を見て学ぶ」能力を、統計学の言葉で推定量として扱い、どのくらい確かな答えが出るかを論じようとする点が面白いところです。", "unverified": "理論結果の詳細は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "潜在変数を含む線形SEMの有向非巡回グラフを学習", "title": "Data-Driven Learning of Directed Acyclic Graphs in Gaussian Linear Structural Equation Models with Latent Variables", "url": "https://arxiv.org/abs/2610.27873", "authors": "Siliang Zhang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zhang, S., Chen, Y., & Moustaki, I. (2026). Data-Driven Learning of Directed Acyclic Graphs in Gaussian Linear Structural Equation Models with Latent Variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27873", "why": "確認的に使われがちな構造方程式モデルを、潜在変数込みでデータ駆動に構造学習する方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "潜在変数をもつガウス線形構造方程式モデルで、測定モデルは既知のまま、構造の経路図（DAG）をデータから学習する方法DAGGLEを提案した（抄録）。", "p3": "構造モデルの識別可能性を示した上で（DAGはマルコフ同値類まで識別可能）、学習アルゴリズムDAGGLEを提案した（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "構造方程式モデルは、研究者が「この要因がこれに効く」と矢印を先に決めて確かめるのが普通です。その矢印の向きをデータから探す半探索的なやり方を、潜在変数があっても成り立つように整えた点が面白いところです。", "unverified": "シミュレーションや実データでの結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "LSTMで非反復g公式のプラグイン推定量", "title": "A plug-in estimator of the non-iterative conditional expectation g-formula using long short-term memory models", "url": "https://arxiv.org/abs/2610.27354", "authors": "Jing Li ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Li, J., Rein, S. M., Wang, Z., Wang, Z., McGrath, S., Robins, J. M., Kolokotrones, T., Mukherjee, R., & Hernán, M. A. (2026). A plug-in estimator of the non-iterative conditional expectation g-formula using long short-term memory models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27354", "why": "時間変化する交絡のある因果効果推定のg公式に、系列モデルを組み込んだ。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "時間とともに変わる交絡がある場合のg公式の非反復条件付き期待（NICE）プラグイン推定量を、LSTMで推定する方法を検討した（抄録）。", "p3": "交換可能性・正値性・一致性の仮定の下で、交絡・処置・結果の時系列の同時分布をパラメトリックモデルの代わりにLSTMで推定する（抄録）。", "p5": "抄録が途中で切れており、推論の妥当性の評価結果は未確認。", "fun": "治療を続けるかやめるかで結果がどう変わるかを観察データから推定するとき、途中の体調がその後の治療を左右し、さらに結果にも効くという「堂々巡り」が難所です。この堂々巡りを、系列データに強いLSTMで表そうとする点が面白いところです。", "unverified": "シミュレーションの設定と結果は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "相手ごとに反応が異なる社会的相互作用の離散選択", "title": "Discrete Choice with Generalized Social Interactions", "url": "https://arxiv.org/abs/2610.27324", "authors": "Oscar Volpe", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Volpe, O. (2026). Discrete Choice with Generalized Social Interactions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27324", "why": "ネットワーク内の相手によって影響の強さが異なる場合の離散選択モデルの識別を扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ネットワーク内の相手によって同調したり差別化したりする一般化した社会的相互作用を、離散選択モデルで推定する方法を示した（抄録）。", "p3": "ネットワーク内の選択の変動を使って内生的相互作用効果の差を推論し、観察されない文脈効果を考慮し、測定誤差の偏りを補正する内部操作変数を構成する（抄録）。", "p5": "テネシー州の小学校の学級の仲間効果とケニアの駆虫治療の波及に適用し、いずれでも社会的相互作用の差を見いだした（抄録）。", "fun": "人は友だちの真似をすることもあれば、あえて違う行動を取ることもあります。誰に合わせ、誰と差をつけるかをデータから見分けるという、人間関係の微妙さを数理モデルに持ち込んだ点が面白いところです。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "構造VARによる証拠に基づくマクロ政策選択", "title": "Evidence-Based Policy Choice in Macroeconomics", "url": "https://arxiv.org/abs/2610.27405", "authors": "Toru Kitagawa ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Kitagawa, T., & Martinalli, S. (2026). Evidence-Based Policy Choice in Macroeconomics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27405", "why": "データ駆動のマクロ政策選択を構造VARの枠組みで定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "構造VARの枠組みで、データにもとづくマクロ経済政策の選択を統計的意思決定問題として定式化した（抄録）。", "p3": "毎期の予期しないショックで政策経路を実行する体制と、予告して予期されたショックで実行するフォワードガイダンスの体制で、オラクル・ベイズ最適・頑健ベイズの決定ルールを導いた（抄録）。", "p5": "決定問題が構造回転行列に依存するのは政策ショックに対応する列の張る空間を通じてのみであることを示した（抄録）。", "fun": "金利をどう動かすかを決めるとき、経済の仕組みを完全には知らないまま決めなければなりません。分からない部分が残っていても、決定に必要な情報だけは取り出せる、という整理が面白いところです。", "unverified": "実データへの適用結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "共通優先順位のない重複リザーブ：チリの学校選択", "title": "Overlapping Reserves without a Common Priority: Theory and an Application to School Choice in Chile", "url": "https://arxiv.org/abs/2610.28471", "authors": "Battal Do\\u{g}an ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Doğan, B., Imamura, K., & Yenmez, M. B. (2026). Overlapping Reserves without a Common Priority: Theory and an Application to School Choice in Chile (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28471", "why": "異なる優先順位をもつ重複リザーブのマッチング理論とその応用。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "優先順位が異なる重複リザーブ（優先枠）のあるマッチング市場で、枠を最大限使い優先順位を尊重する、耐戦略的な受入保留方式を設計した（抄録）。", "p3": "分類と順位付けによる選択ルールを導入し、受入の結果を公理的に特徴付け、2種類の枠でのリザーブの順序の基礎付けと分配上の含意を示した（抄録）。", "p5": "チリの学校入学の9回分のデータで、実際に使われた方式では枠の未使用が生じていたことを示した（抄録）。", "fun": "入試の優先枠に複数当てはまる生徒を、どの枠で合格させるかによって、枠が余ったり別の生徒が落ちたりします。この「割り振り方」の工夫だけで、より多くの生徒に枠を届けられるという点が面白いところです。", "unverified": "新方式で改善される人数などの数値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "昇進シグナルと肩書きインフレ", "title": "Promotion Signaling and Signal Jamming: An Analysis of Job Title Inflation", "url": "https://doi.org/10.2139/ssrn.7634938", "authors": "Yi Chen ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Chen, Y., Waldman, M., & Yin, Z. (2026). Promotion Signaling and Signal Jamming: An Analysis of Job Title Inflation. https://doi.org/10.2139/ssrn.7634938", "why": "昇進がシグナルになる労働市場で、肩書きのインフレが起きる仕組みを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "肩書きのインフレが昇進のシグナル価値を弱める「シグナル撹乱」として働くことを理論的に示した（抄録）。", "p3": "2期間モデルで均衡としての肩書きインフレを導き、さらに若い労働者の人的資本投資の選択を加えた（抄録）。", "p5": "肩書きインフレは、労働者が立派な肩書きを直接好むことと、シグナリングによる配置の非効率を減らすことで厚生を高めうるが、人的資本投資を入れると厚生を下げうる（抄録）。", "fun": "「マネージャー」の肩書きを気前よく配ると、昇進が能力の証明として機能しにくくなります。それが社会にとって得にも損にもなりうる、という両面を数理モデルで示した点が面白いところです。", "unverified": "厚生が下がる条件の詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "離職できる労働者への業務量と賃金の保険", "title": "Workload and Wage Insurance When Workers Can Quit", "url": "https://doi.org/10.2139/ssrn.7632058", "authors": "Kyoung Jin Choi ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Choi, K. J., & Jeon, J. (2026). Workload and Wage Insurance When Workers Can Quit. https://doi.org/10.2139/ssrn.7632058", "why": "需要変動に対する業務量調整と賃金保険の同時設計を理論分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業は契約に縛られるが労働者はいつでも辞められる状況で、業務量と賃金の同時設計の最適政策を示した（抄録）。", "p3": "市場状態が高・低の業務量のもとでの収入を決め、切替えに双方向の費用がかかるモデルで、すべての再開費用について最適政策を特徴付けた（抄録）。", "p5": "各業務量のもとで賃金は事前に決まった経路をたどり、外部機会が拘束的になるときだけ上がる。業務量の切替えの閾値は賃金や業務量が変わるたびに改定すべきである（抄録）。", "fun": "景気が悪いと仕事を減らし、良くなると戻すとき、給料をどう保証すれば社員が辞めずにすむか、という問題です。辞められる自由がある相手との約束をどう設計するかは、身近な雇用の悩みそのものです。", "unverified": "数値例の有無は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "最適停止ゲームで重なるデジタルナッジが打ち消し合う", "title": "Digital Nudge Effects in Optimal Stopping Games: Antagonistic Interactions in Layered Choice Architectures", "url": "https://arxiv.org/abs/2610.28154", "authors": "Batisse Manhardt ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Manhardt, B., & Duane, J.-N. (2026). Digital Nudge Effects in Optimal Stopping Games: Antagonistic Interactions in Layered Choice Architectures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28154", "why": "複数の層からなる選択アーキテクチャでナッジ同士の拮抗的な相互作用を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "アンカリング・顕著性・社会的証明のデジタルナッジを組み合わせると、互いに打ち消し合って意思決定の質が下がることを示した（抄録）。", "p3": "秘書問題にもとづく逐次意思決定課題で、2³の参加者間要因計画（N = 181）により個別と組合せの効果を調べた（抄録）。", "p5": "アンカーのナッジは探索を制約せず増やし（b = 1.207、p = .017）、顕著性のナッジの効果は最小で、アンカーと社会的証明の組合せは成果の質が最も悪かった（アンカーのみ192.21ドルに対し181.83ドル）（抄録）。", "fun": "良かれと思って「おすすめ」や「みんなが選んでいます」を重ねると、かえって判断が悪くなることがある、という結果です。効く薬を混ぜたら効かなくなる、という飲み合わせの問題に似ている点が面白いところです。", "unverified": "抄録の後半（単調な低下の詳細）は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習（Hugging Face）", "headline": "記憶を基盤モデルの内在能力にするMemT-1.0", "title": "MemT-1.0: Towards Memory-Native Evolution", "url": "https://arxiv.org/abs/2610.26825", "authors": "Zhiyu Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Li, Z., Zhang, Z., Liu, L., Bu, Y., Xi, C., Zhang, X., Yu, Y., Yu, Y., Liu, Z., Yi, Y., Li, C., Liu, H., Ding, Z., Zhou, L., Zhang, J., Chen, B., Lin, Z., Li, G., Fu, R., … Xiong, F. (2026). MemT-1.0: Towards Memory-Native Evolution (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.26825", "why": "外部記憶ではなくモデル自体に記憶を組み込んで進化させる方向を提示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "記憶をモデルの計算の一部として内在化する記憶基盤モデルMemT-1.0を提案した（抄録）。", "p3": "Metisを基に、各ターン内でトークン単位の安定な記憶更新を行うGated DeltaNet-2を使い、記憶容量を拡張するMixture-of-Storageを導入した。340億トークンのデータで継続事前学習と事後学習の2段階で訓練した（抄録）。", "p5": "MemT-1.0-NanoとMemT-1.0-Flashのモデル群を公開した（抄録）。性能評価の数値は抄録の範囲では未確認。", "fun": "今のAIは会話の記憶を外のメモ帳に書いて読み直すことが多いのですが、このモデルは記憶をモデルの中に溶け込ませようとしています。人間の記憶のように、使いながら覚えていくAIへの一歩という点が面白いところです。", "unverified": "ベンチマークでの性能は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習（Hugging Face）", "headline": "人の一人称映像から世界に根ざした表現を学習", "title": "EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience", "url": "https://arxiv.org/abs/2610.26625", "authors": "Xinhao Ji ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Ji, X., Pang, H. E., Li, H., Hu, K., Wang, J., Sun, M., Cao, Z., Dai, Y., Luu, T., Ma, Q., Chen, H., Cao, Y., Hong, F., Chen, Z., & Liu, Z. (2026). EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26625", "why": "一人称映像からの人間活動の再構成に向けた表現学習。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "一人称映像から、観察者の動き・周囲の形状・手と物体の相互作用を一つの整合した世界として再構成するための、データ収集から評価までの一式EgoXperienceを示した（抄録）。", "p3": "幾何学的に検証した物体追跡とSLAMによる世界座標の整合を組み合わせた自動注釈エンジンEgoX-Engineで、カメラ・シーン・手などの一貫した教師信号を作る（抄録）。", "p5": "抄録が途中で切れており、統一モデルとベンチマークの結果は未確認。", "fun": "頭に付けたカメラの映像から「自分がどう動き、手で何をつかんだか」を立体的に復元するには、部品ごとに推定するのではなく全体のつじつまを合わせる必要があります。その「つじつま合わせ」を自動で大量に作る工夫が面白いところです。", "unverified": "モデルの性能の数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習（Hugging Face）", "headline": "音声・画面を同時に扱う全モダリティGUIエージェント", "title": "Focused Omni-Modal GUI Agents", "url": "https://arxiv.org/abs/2610.26203", "authors": "Fuyao Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Zhang, F., He, W., Zhang, J., Hao, Y., Wang, X., Guan, G., Wang, C., Huang, L., & Lim, W. Y. B. (2026). Focused Omni-Modal GUI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26203", "why": "スクリーンショットや音声などの流れる観測に注意を絞って操作するGUIエージェント。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "画面・音声・映像などを同時に受け取るGUIエージェントで、その都度関係する情報だけに注意を絞る軽量アダプタFocusGUIを提案した（抄録）。", "p3": "ある行動を決めた信号が次の行動では雑音になり、誤りが積み重なる「逐次的な注意散漫」を問題とし、段階適応的・行動に十分・非侵襲的な「焦点を絞った知覚」を要件として定式化した（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "パソコンを操作するAIに画面も音も履歴も全部見せると、かえって気が散って操作を誤り、その誤りが次の誤りを呼びます。人がスマホを操作するときのように、その場で必要なものだけを見る工夫が面白いところです。", "unverified": "改善の程度は未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習（Hugging Face）", "headline": "進捗に合わせた再帰で状態追跡の長さ汎化", "title": "PAR: Progress-Aligned Recurrence for Length Generalization in State Tracking", "url": "https://arxiv.org/abs/2610.27628", "authors": "Pan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Wang, P., Hu, Y., Dong, G., Lin, Y., Wang, H., Liu, Z., Wen, Z., Li, J., Yang, J.-M., Wu, W., & Tong, Y. (2026). PAR: Progress-Aligned Recurrence for Length Generalization in State Tracking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27628", "why": "ループ型言語モデルが推論時に反復を増やしても長い系列に汎化できるようにする工夫。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "ループ型言語モデルで、反復ごとに進むべき量をそろえる学習法PARにより、学習長の16倍の状態追跡に汎化させた（抄録）。", "p3": "k回目の反復の予測が最初のk個の操作後の状態に一致するよう学習し、再帰状態のノルムを最初の反復の値に再スケールする（抄録）。", "p5": "swap-S5で、最大32手で学習したQwen2.5-0.5Bが512手（学習長の16倍）で平均の全状態正解率95.5%を達成し、同じ基盤でRLTの55.7%、明示的な思考の連鎖の0.8%を上回った（抄録）。", "fun": "5つの物の入れ替えを何百回も追いかける課題で、32回分しか練習していないのに512回分も正しく追えるようになりました。1回の反復で1手ずつ進む、と歩幅をそろえて教えるだけで大きく変わる点が面白いところです。", "unverified": "他の課題での結果は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習（Hugging Face）", "headline": "長期実行から科学探索へ：Sage-A1.5", "title": "Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition", "url": "https://arxiv.org/abs/2610.28578", "authors": "Wenjie Lou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Lou, W., Peng, T., Feng, S., Tang, S., Ma, R., Chen, R., Shi, J., Peng, H., Yu, F., Zhong, Z., Zhou, Y., Fan, Y., Chen, Y., Wu, Y., Wang, Y., Jiang, Y., Jiang, Y., Xie, Y., Guo, X., … Zhang, B. (2026). Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28578", "why": "能力の組合せで長期タスクと科学的探索をこなす35BのMoEモデルの技術報告。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "350億パラメータの専門家混合（MoE）エージェントモデルSage-A1.5で、能力を組み合わせて長期の問題解決と科学的探索を行う（抄録）。", "p3": "文脈を分けたサブエージェントへのタスク委任と並列協調によるエージェント的オーケストレーション、検証、開かれた科学的発見の3点を改善した（抄録）。", "p5": "抄録が途中で切れており、性能の数値は未確認。", "fun": "大きな仕事を小さく分けて部下に任せ、結果を確かめながら進めるという、人間のチームの働き方をAIの中に持ち込んでいます。一人の天才より、上手に分担する組織のほうが強いかという問いが面白いところです。", "unverified": "評価ベンチマークと結果は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "エージェントのハーネス最適化の利得は引き出しか拡張か", "title": "Elicitation or Expansion? Demystifying Gains from Agent Harness Optimization", "url": "https://arxiv.org/abs/2610.27889", "authors": "Younghyun Kim ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Kim, Y., Seo, W., Kim, M., Oh, S., Lee, M., Kim, D., Koo, H. I., Kim, J., & Kang, W. (2026). Elicitation or Expansion? Demystifying Gains from Agent Harness Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27889", "why": "重みを変えずにハーネスを最適化したときの性能向上の正体を分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "重みを変えないハーネス最適化による言語モデルエージェントの性能向上が、もともと解ける課題をより確実に解く「引き出し」か、解ける範囲を広げる「拡張」かを区別して分析した（抄録）。", "p3": "文脈・道具の使用・実行の流れを形作るハーネスの最適化について、単純な成功率では区別できない引き出しと拡張を分けて測る（抄録）。", "p5": "抄録が途中で切れており、結論は未確認。", "fun": "AIの成績が上がったとき、それは「できることを確実にできるようになった」のか「できなかったことができるようになった」のかで意味が違います。テストの点数が上がった理由を見分けるのと同じ発想が面白いところです。", "unverified": "どちらが主だったかの結果は未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "視覚言語モデルでの逆スケーリング", "title": "On the Limits of Scale: Inverse Scaling in Vision-Language Models", "url": "https://arxiv.org/abs/2610.27360", "authors": "Rohit Saxena ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Saxena, R., Suglia, A., Rei, M., & Minervini, P. (2026). On the Limits of Scale: Inverse Scaling in Vision-Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27360", "why": "モデルを大きくすると性能が下がる課題が視覚言語モデルにもあることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "視覚言語モデルでは、大きなモデルほど成績が下がる質問の種類（サブタスク単位の逆スケーリング）が系統的に存在することを示した（抄録）。", "p3": "4系統19モデルを8つのマルチモーダルベンチマーク（9評価分割）で評価し、1モデル当たり29,386問、計558,334のモデル・問題の評価で、系統内の全モデル対を問題ごとに比較した（抄録）。", "p5": "逆スケーリングを示すサブタスクとモデル対の組合せを375個特定した（抄録）。", "fun": "AIは大きくするほど賢くなると言われますが、問題の種類によっては大きいほうが間違えやすいことが分かりました。全体の平均点だけを見ていると見逃す「苦手科目」を、問題ごとの比較で掘り出した点が面白いところです。", "unverified": "逆スケーリングの原因の分析は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "活性化空間の操作で検証可能報酬RLの探索を促す", "title": "Exploration via Activation-Space Steering for Reinforcement Learning with Verifiable Rewards", "url": "https://arxiv.org/abs/2610.27012", "authors": "Yunan Zeng ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zeng, Y., Jing, J., Cheng, X., & Wang, Y. (2026). Exploration via Activation-Space Steering for Reinforcement Learning with Verifiable Rewards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27012", "why": "検証可能な報酬による強化学習の探索不足を、内部表現の操作で補う方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "検証可能な報酬による強化学習（RLVR）で、内部の活性化を操作して訓練時の解答の多様性を高める方法ASEを提案した（抄録）。", "p3": "同じ問題への正答と誤答の活性化の差をクラスタリングして潜在的な探索ベクトルの集まりを作り、異なるベクトルを適用して解答を多様化する（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "同じAIに何度も答えさせても、似た考え方ばかりになりがちです。正解と不正解のときの「頭の中の違い」を取り出して、わざと違う考え方の方向へ押してやるという発想が面白いところです。", "unverified": "改善の数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "相対表現でモデル間を移植できるホワイトボックス監視", "title": "Relative Representations Enable Portable White-Box Monitoring Across Language Models", "url": "https://arxiv.org/abs/2610.28366", "authors": "Tim Bakker ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Bakker, T., & Louizos, C. (2026). Relative Representations Enable Portable White-Box Monitoring Across Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28366", "why": "別々に学習した言語モデル間で内部監視器を使い回せることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "別々に学習した言語モデルでも、内部表現が行動上重要な情報を似た形で整理しており、ある モデルで作った監視用プローブを別のモデルに使い回せることを示した（抄録）。", "p3": "活性化の座標の違いを乗り越えるため、各例を共有のアンカー集合への角度距離で表す相対表現を使い、全層の情報をまとめる大域アンカー構成を導入した（抄録）。", "p5": "対象のラベル付きデータなしで、モデルが変わってもプローブを再利用できるとしている。数値は抄録の範囲では未確認。", "fun": "AIの頭の中を覗く「探知機」は、モデルを替えるたびに作り直すのが普通でした。いくつかの目印との距離で表すという、地図の座標を相対位置に置き換えるような工夫で、別のAIにも使えるようにした点が面白いところです。", "unverified": "移植後の検出性能の数値は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "偏微分方程式を記号的に発見する生成基盤モデル", "title": "FoundPDE: A generative foundation model for data-driven symbolic discovery of partial differential equations", "url": "https://arxiv.org/abs/2610.26963", "authors": "Langchen Liu ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Liu, L., Luo, J., Zhu, M., Yang, Z., & Lu, L. (2026). FoundPDE: A generative foundation model for data-driven symbolic discovery of partial differential equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26963", "why": "データから支配方程式を記号で発見する生成的な基盤モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測した時空間の軌跡から、偏微分方程式を記号の形で発見する事前学習済みの基盤モデルFoundPDEを提案した（抄録）。", "p3": "離散化した時空間の軌跡をトランスフォーマーで記号方程式に写像し、フーリエ特徴と一階の空間情報を用いる（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "データから「どんな法則が成り立っているか」を数式として取り出せれば、予測だけでなく理解や再利用ができます。たくさんの方程式で事前に練習したAIに、新しいデータの法則を一目で言い当てさせようという発想が面白いところです。", "unverified": "雑音や疎な観測への頑健性の数値は未確認。"}}, {"id": "pn37", "rank": 37, "field": "計算社会科学・ネットワーク科学", "headline": "人と生成AIの協働での交換記憶システム", "title": "The GenAI Who Knew Too Little: Revisiting Transactive Memory Systems in Human GenAI Collaboration", "url": "https://arxiv.org/abs/2610.28343", "authors": "Christian Meske ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Meske, C., Hermanns, T., & Brachten, F. (2026). The GenAI Who Knew Too Little: Revisiting Transactive Memory Systems in Human GenAI Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28343", "why": "知識労働者への面接から、人と生成AIの間の専門性の認識の非対称を描いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人と生成AIの協働で、交換記憶システム（TMS：誰が何を知っているかの共有）がどう現れるかを描いた（抄録）。", "p3": "知識労働者14人への質的な解釈的面接と主題分析（抄録）。", "p5": "専門性の認識は非対称で、人はAIの能力を把握するがAIは人の専門性を一時的にしか認識しない。信頼性については、人はAIに両義的な信頼を形成していた（抄録）。", "fun": "チームでは「あの件は○○さんが詳しい」と分かっていることが力になります。ところがAIは相手が誰で何に詳しいかをすぐ忘れてしまうため、人だけが一方的に相手を覚える関係になる、という指摘が面白いところです。", "unverified": "14人の面接にもとづく探索的な結果である（抄録）。"}}, {"id": "pn38", "rank": 38, "field": "計算社会科学・ネットワーク科学", "headline": "情報理論で社会ネットワークの進化を記述", "title": "An Information-Theoretic Model for the Evolution of a Social Network", "url": "https://arxiv.org/abs/2610.28016", "authors": "Johnathan Brink ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Brink, J., Mitchell, L., & Ye, M. (2026). An Information-Theoretic Model for the Evolution of a Social Network (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28016", "why": "エコーチェンバーやフィルターバブルを情報理論的なネットワーク進化モデルで扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文章を生成するノード間の交差エントロピーに応じて辺を張り替える進化的ネットワークモデルで、エコーチェンバーの形成を調べた（抄録）。", "p3": "Quoterモデルを拡張し、ノードが新規性の高い隣人を求めるか低い隣人を求めるか（強化か探索か）をパラメータで表した（抄録）。", "p5": "シミュレーションで構造の出現を観察したとしている（抄録の途中まで）。", "fun": "SNSで似た意見の人とばかりつながるのは、新しい情報を嫌って「聞き慣れた話」を好むからかもしれません。会話の「意外さ」を情報理論で測り、それがつながり方をどう変えるかを模擬した点が面白いところです。", "unverified": "シミュレーションの具体的な結果は未確認。"}}, {"id": "pn39", "rank": 39, "field": "計算社会科学・ネットワーク科学", "headline": "技術能力の断続平衡と最先端の予測可能性", "title": "Punctuated Equilibrium in Technological Capabilities: Commercial Selection and the Predictability of Frontier Advances", "url": "https://arxiv.org/abs/2610.26971", "authors": "Kenzi M'Hamdi ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "M'Hamdi, K., & Jeong, D. (2026). Punctuated Equilibrium in Technological Capabilities: Commercial Selection and the Predictability of Frontier Advances (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26971", "why": "技術の最先端の進歩が断続的に起きるかを商業的選択の観点から検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "電子部品の製品記録約174万件で、技術能力の最先端の向上が断続的に一度に起きることを示した（抄録）。", "p3": "手作業で選んだ29の能力について、最先端の改善のテンポと商業的に提供される製品の多様性を分析した（抄録）。", "p5": "大きな進歩の局面の77.8%が単一の進歩年からなり、進歩で始まる3年間の改善のうち最初の年の向上が平均79.3%を占めた。最先端付近の製品記録の割合の中央値は1.46%だった（抄録）。", "fun": "技術はなだらかに進歩するように見えて、実際には「ある年にどんと進んで、あとは横ばい」が多いことが分かりました。生物の進化で言われる断続平衡のような進み方が技術にも見られる点が面白いところです。", "unverified": "後半の204の能力への拡張分析の結果は未確認。"}}, {"id": "pn40", "rank": 40, "field": "計算社会科学・ネットワーク科学", "headline": "STVでは選挙区の定数が比例性を左右する", "title": "District Size Matters: How Seats Per District Shapes Proportionality Under STV", "url": "https://arxiv.org/abs/2610.27297", "authors": "Daryl DeFord ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "DeFord, D., Ratliff, T., & Veomett, E. (2026). District Size Matters: How Seats Per District Shapes Proportionality Under STV (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27297", "why": "単記移譲式投票で選挙区当たりの議席数が比例性に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数定数の選挙区と単記移譲式投票（STV）を使うと、選挙区当たりの定数によって党派的な比例性がどう変わるかを調べた（抄録）。", "p3": "イリノイ・ニューハンプシャー・ニューメキシコの州上院を対象に、2・3・4人区を中心とする区割り案の集合を、選挙区の積み上げと既存小選挙区の統合の2方法で作り、修正Bradley-TerryモデルとPlackett-Luceモデルで投票を生成した（抄録）。", "p5": "抄録が途中で切れており、結論は未確認。", "fun": "1つの選挙区から何人選ぶかで、議席の配分が得票の割合にどれだけ近づくかが変わります。仮想の区割りを大量に作って比べることで、制度の設計の効果を「もしも」の世界で確かめる点が面白いところです。", "unverified": "定数ごとの比例性の結果は未確認。"}}, {"id": "pn41", "rank": 41, "field": "計算社会科学・ネットワーク科学", "headline": "AIと科学的コモンズの囲い込み", "title": "AI and The Enclosure of the Scientific Commons", "url": "https://arxiv.org/abs/2610.27251", "authors": "P. K. G. Williams (Center for Astrophysics | Harvard ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Williams, P. K. G. (2026). AI and The Enclosure of the Scientific Commons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27251", "why": "科学文献を情報コモンズとみなし、AIによる囲い込みの問題を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "科学文献を「情報コモンズ」とみなし、AIによる囲い込みの問題を、歴史と経済・政治の枠組みから論じた入門的な論考（抄録）。", "p3": "産業革命前のイングランドの共有地の歴史とそれに関するコモンズの理論を紹介し、情報コモンズとかつての共有地の違いを検討する（抄録）。", "p5": "情報コモンズは頑健で非常に価値が高いのに対し、イングランドの農業の共有地はもはや実質的に存在しない、という対比から議論を進める（抄録）。", "fun": "昔のイギリスでは、みんなの牧草地が囲い込まれて私有地になりました。誰もが使える科学の論文の山も、AIによって同じように囲い込まれるかもしれない、という歴史のたとえが面白いところです。", "unverified": "論考の具体的な提言は未確認。"}}, {"id": "pn42", "rank": 42, "field": "社会学", "headline": "アルゴリズム差別は社会的不平等を再生産する", "title": "Algorithmic Discrimination and the Reproduction of Social Inequality: A Sociological Review with Evidence Relevant to Bangladesh", "url": "https://doi.org/10.2139/ssrn.7635778", "authors": "Mahade Hasan Kazi", "venue": "SSRN", "date": "2026-10-21", "apa": "Kazi, M. H. (2026). Algorithmic Discrimination and the Reproduction of Social Inequality: A Sociological Review with Evidence Relevant to Bangladesh. https://doi.org/10.2139/ssrn.7635778", "why": "AIによる分類・推薦が不平等を再生産する仕組みを社会学的に整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "アルゴリズムによる差別を社会学的に整理し、バングラデシュに関する証拠も合わせて検討した叙述的レビュー（抄録）。", "p3": "雇用・医療・顔分析の記録された事例と、ベンガル語モデルやバングラデシュのデジタルアクセスの証拠をレビューし、AIモデルで測られた偏り、自動化された制度的決定による害、AIの恩恵を受ける人を左右する既存の不平等という3種類の証拠を区別した（抄録）。", "p5": "国際的な事例から、過去の採用データが偏りを再生産する仕組みなどを示す（抄録の途中まで）。", "fun": "AIの差別というと「モデルの精度の偏り」を思い浮かべがちですが、そもそも誰がAIを使えるかという社会の格差も含めて考える必要があります。3種類の証拠を混同しないように分けた点が面白いところです。", "unverified": "バングラデシュに関する具体的な結論は未確認。"}}, {"id": "pn43", "rank": 43, "field": "統計学", "headline": "Tobitモデルの特定化を乗数ブートストラップで検定", "title": "A multiplier bootstrap score test for Tobit specification", "url": "https://arxiv.org/abs/2610.28169", "authors": "Xuewen Li ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Li, X., Song, X., Wang, X., & Zhang, F. (2026). A multiplier bootstrap score test for Tobit specification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28169", "why": "Tobit回帰の特定化を、計算の軽いスコア検定と乗数ブートストラップで検定する方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Tobit回帰モデルの特定化を、計算の軽い乗数ブートストラップで行うスコア型の検定を提案した（抄録）。", "p3": "一般化Tobit残差の条件付き平均がゼロという条件付きモーメント制約を、推定したインデックスで条件付けた積分条件付きモーメント法で検定し、平滑化や調整パラメータを不要にした（抄録）。", "p5": "実行可能な過程の一次の一様表現を導き、構造パラメータの最尤推定がその極限挙動にどう影響するかを示した（抄録）。", "fun": "支出額のように「ゼロで止まる」データにはTobitモデルがよく使われますが、そのモデルが本当に合っているかを確かめる手軽な方法は意外と少ないのです。調整のつまみを使わずに検定できる点が実用的で面白いところです。", "unverified": "シミュレーションでの検出力は未確認。"}}, {"id": "pn44", "rank": 44, "field": "組織行動・心理的安全性", "headline": "進化する多エージェントチームで誰の技能を変えるか", "title": "Which Agent's Skill Should Change? Group-Relative Credit Assignment for Evolving Multi-Agent Teams", "url": "https://arxiv.org/abs/2610.27227", "authors": "Yanan Ma ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Ma, Y., Wang, Y., Le, D., Yuan, C., Sun, Y., Zhang, G., Xiao, C., Lin, C., & Banerjee, I. (2026). Which Agent's Skill Should Change? Group-Relative Credit Assignment for Evolving Multi-Agent Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27227", "why": "協調するLLMエージェントの改善でグループ相対の貢献配分を行う方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "協調するLLMエージェントのチームで、チーム報酬をどのエージェントのどの技能の責任かに帰属させて技能を改善する方法GRSEを提案した（抄録）。", "p3": "GRPOに着想を得て、同じ技能ライブラリで各質問を複数回実行し、実行同士を比較してエージェントと技能の組に貢献を割り当て、失敗を構造的に診断する（抄録）。", "p5": "HotpotQAとLoCoMoで評価した（抄録の途中まで）。数値は未確認。", "fun": "チームが成功したとき、その場にいただけのメンバーまで手柄を得ると、実は足を引っ張っていた人が見逃されます。同じ条件で何度もやらせて比べることで「誰のおかげか」を見極める点が、人間の組織の評価にも通じて面白いところです。", "unverified": "改善の数値は未確認。"}}, {"id": "pn45", "rank": 45, "field": "組織行動・心理的安全性", "headline": "リーダーのマインドフルネスはマインドフル・リーダーシップではない", "title": "Leader Mindfulness Is Not Mindful Leadership: A Conceptual Analysis of Construct Boundaries in Leadership Research", "url": "https://doi.org/10.31234/osf.io/a9hpc_v1", "authors": "Barry Tse", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Tse, B. (2026). Leader Mindfulness Is Not Mindful Leadership: A Conceptual Analysis of Construct Boundaries in Leadership Research. https://doi.org/10.31234/osf.io/a9hpc_v1", "why": "リーダーシップ研究での構成概念の境界を概念的に整理した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "マインドフル・リーダーシップは、まだ独立したリーダーシップの構成概念として確立していないと論じた概念分析（抄録）。", "p3": "意図的に集めた58本の全文を対象に、構成概念の内容と位置、実証での表現、研究デザイン、推論の根拠を個々の主張の水準で検討した（抄録）。", "p5": "リーダーのマインドフルネスは個人水準の心理的構成概念であり、リーダー行動や集団成果との結び付きには別に特定された仕組みと証拠が必要だとする（抄録）。", "fun": "「リーダーが瞑想的に落ち着いている」ことと「チームを上手に導く」ことは別物です。個人の心の状態を、そのまま組織の指導力と呼んでよいのか、という言葉の使い方に厳しく切り込む点が面白いところです。", "unverified": "概念分析で新しいデータは用いていない（抄録）。"}}, {"id": "pn46", "rank": 46, "field": "組織行動・心理的安全性", "headline": "政治的つながりと融資：人脈かノウハウか", "title": "Loans, Links, and Leadership: Evidence on Know-Who and Know-How Mechanisms", "url": "https://doi.org/10.2139/ssrn.7642961", "authors": "Jeremie Bertrand ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Bertrand, J., Perrin, C., & Léon, F. (2026). Loans, Links, and Leadership: Evidence on Know-Who and Know-How Mechanisms. https://doi.org/10.2139/ssrn.7642961", "why": "政治的つながりが企業の資金調達に効く経路を人脈とノウハウに分けて検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業の政治活動が借り手の資金調達のためらいを減らす効果を、人脈（know-who）とノウハウ（know-how）に分け、政権交代への頑健さを調べた（抄録）。", "p3": "複数国の企業レベルの調査データで、政権交代が企業の政治活動と借入をためらう傾向の関係をどう変えるかを分析した（抄録）。", "p5": "抄録が途中で切れており、結果は未確認。", "fun": "政治とのつながりがお金を借りやすくするとして、それが特定の政治家との縁なのか、役所との付き合い方のノウハウなのかで、政権が替わったときの強さが違うはずです。その違いを見分けようとする点が面白いところです。", "unverified": "人脈とノウハウのどちらが頑健だったかは未確認。"}}, {"id": "pn47", "rank": 47, "field": "経営学", "headline": "コネクテッド製品のロイヤリティと革新誘因", "title": "Digital Connected Products, Royalties, and Innovation Incentives", "url": "https://doi.org/10.2139/ssrn.7642418", "authors": "Carlo Cambini ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Cambini, C., Kraemer, J., & Pino, F. (2026). Digital Connected Products, Royalties, and Innovation Incentives. https://doi.org/10.2139/ssrn.7642418", "why": "データアクセスに使用料を課すメーカーの品質選択と革新誘因を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "コネクテッド製品のメーカーが第三者のデータアクセスに使用料を課しても、第三者の革新を促しうることを示した（抄録）。", "p3": "自社サービスの品質を選び、補完または代替のサービスを提供する第三者に利用量当たりの使用料を課すメーカーのモデルを分析した（抄録）。", "p5": "使用料が高いほど製品価格が下がり第三者の需要と品質への限界収益が増えるため、革新を促しうる。メーカーは使用料を排除ではなく地代の回収に使い、品質を戦略的に排除に使うこともない（抄録）。", "fun": "データを使わせる料金を上げると、ライバルの意欲をそぐと思いきや、かえって製品が安くなり利用が増えて、ライバルもやる気を出す、という逆説的な結果です。", "unverified": "モデルの前提の詳細は未確認。"}}, {"id": "pn48", "rank": 48, "field": "経営学", "headline": "レイク・ウォビゴン・ゲーム：参入と競争", "title": "The Lake Wobegon Game", "url": "https://doi.org/10.2139/ssrn.7639562", "authors": "John Duffy ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Duffy, J., Matros, A., & Miao, C.-H. (2026). The Lake Wobegon Game . https://doi.org/10.2139/ssrn.7639562", "why": "能力を外生的に割り当てたN人の参入・コンテストゲームを導入した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "参加者の平均より能力が高い人だけが賞金を分ける参入型コンテスト「レイク・ウォビゴン・ゲーム」を導入し、基本形では誰も参入しないことを示した（抄録）。", "p3": "各プレイヤーは既知の有限集合から異なる能力を割り当てられ、参加料を払って参入するかを同時に決める。賞金は参加料の合計で、参入者の平均能力を超える人で等分する（抄録）。", "p5": "基本形は支配戦略で解け、誰も参入しない唯一のベイズ・ナッシュ均衡をもつ。変種も検討した（抄録）。", "fun": "「みんなが平均以上」の町の名前を冠したゲームです。能力の高い人が得をしそうに見えるのに、いちばん下の人から順に抜けていくと、最後には誰も参加しなくなる、という連鎖が面白いところです。", "unverified": "変種での均衡の結果は未確認。"}}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "高次の情報競争と適応的再配線でみる供給網の途絶", "title": "Supply chain disruption dynamics with higher-order information competition and adaptive rewiring", "url": "https://doi.org/10.2139/ssrn.7643827", "authors": "Xuemei You ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "You, X., Duan, X., & Li, Y. (2026). Supply chain disruption dynamics with higher-order information competition and adaptive rewiring. https://doi.org/10.2139/ssrn.7643827", "why": "リスク情報と取引関係の組み替えが供給網の途絶をどう形作るかをモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "リスク情報の高次の競争、防護戦略の進化、取引相手の付け替えを統合した2層ネットワークモデルで、供給網の途絶の動態を分析した（抄録）。", "p3": "3つの防護戦略（D/N/P）と制約付きの相手替えを組み込み、7状態のミクロなマルコフ連鎖近似で侵入条件を導いた（抄録）。", "p5": "情報は知覚されたリスクを通じて防護の選択に影響し、高次相互作用の効果は強化される情報の種類によって異なる。利得による戦略の進化は防護を支えうるが、防護の放棄を加速することもある（抄録）。", "fun": "取引先が止まるリスクの噂が広まると、会社は備えたり、相手を替えたりします。噂同士の競争と、備え方の流行と、つながりの付け替えが同時に起きる様子を、感染症のモデルのように描いた点が面白いところです。", "unverified": "数値実験の具体的な結果は未確認。"}}, {"id": "pn50", "rank": 50, "field": "経営学", "headline": "eBayオークションの戦略的な低価格スタート", "title": "Strategic Under-Pricing in Online Auctions: Testing the Moderating Roles of Seller Reputation and Bidder Competition on eBay", "url": "https://doi.org/10.2139/ssrn.7637918", "authors": "Karan Aggarwal ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Aggarwal, K., Garg, T., Seitova, A., & Panyala, A. (2026). Strategic Under-Pricing in Online Auctions: Testing the Moderating Roles of Seller Reputation and Bidder Competition on eBay. https://doi.org/10.2139/ssrn.7637918", "why": "出品者の評判と入札競争が低い開始価格の効果をどう調整するかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "eBayのオークションで、低い開始価格が高い落札価格につながるか、出品者の評判と入札競争がそれを調整するかを検証した（抄録）。", "p3": "カルティエの時計、Palm Pilot M515、Xboxのオークションを対象に3つの分析を行った（抄録）。", "p5": "開始価格は落札価格と正の関係にあった（β = 0.862〜0.998、p < 0.001）が、カテゴリ内で下位25%や10%の低い開始価格は高い落札価格につながらなかった。出品者の評判（β = 247.69、p = .848）の調整効果は有意でなかった（抄録）。", "fun": "「安く始めれば競り上がって高く売れる」という作戦は、データで見るとうまくいっていませんでした。よく語られる商売のコツを、実際の取引記録で確かめると違う結果が出る点が面白いところです。", "unverified": "入札競争の調整効果のp値は抄録が切れており未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "分布型光ファイバのひずみ面補間でスラブのひび位置特定", "title": "Statistical strain-based surface interpolation method for crack localization in distributed-fiber-optic-monitored concrete slab structures", "url": "https://doi.org/10.1177/14759217261496391", "authors": "Kedi Peng ほか", "venue": "Structural Health Monitoring", "date": "2026-10-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Peng, K., Zhao, H., Zeng, M., & Limongelli, M. P. (2026). Statistical strain-based surface interpolation method for crack localization in distributed-fiber-optic-monitored concrete slab structures. Structural Health Monitoring. https://doi.org/10.1177/14759217261496391", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "分布型光ファイバのひずみ計測で、弾性床上のコンクリートスラブのひび割れ位置を特定する統計的ひずみ面補間法（S3IM）を提案し、従来の決定論的な方法よりF1スコアを0.2から0.8に上げた（抄録）。", "p2": "振動ベースの損傷同定は有望だが、センサがまばらで環境雑音に弱い。面補間法（SIM）をスラブ構造に、しかも分布型光ファイバのひずみに拡張した例はなかった（抄録）。", "p3": "ひずみ速度の伝達率関数から、ひずみにもとづく運用応答形状（operational response shape）を作り、面補間で健全な形状を推定してずれを損傷指標とし、適応的な閾値で異常の位置を判定する（抄録）。解釈：ひびの近くではひずみの分布形状が局所的に乱れるため、周囲から補間した「滑らかな形」との差がひびの位置を示す、という直観である。", "p4": "有限要素シミュレーションで損傷の程度、計測雑音、荷重と損傷の距離の影響を調べ、分布型光ファイバを設置した1.5 × 1.5 mのスラブ6体に表面ののこぎり切り込みで損傷を与え、制御した加振で連続振動データを取って検証した。比較対象は決定論的なSIM（抄録）。", "p5": "提案法はF1スコアを0.2から0.8に上げ、誤警報と見逃しをともに4件から1件に（75%）減らした（抄録）。", "p6": "抄録の範囲では、損傷は表面の切り込みによる模擬で、実際の荷重履歴や温度変化の下でのひび割れでの検証ではない（解釈）。6体という小規模な実験で、F1の評価単位（領域の数など）は抄録から未確認。", "fun": "光ファイバをコンクリートに沿わせると、その全長にわたって「どこがどれだけ伸びたか」を連続的に測れます。揺らしたときの伸び方の模様を、周りから予想される滑らかな模様と比べると、ずれている場所がひびの位置になる、という発想が面白いところです。", "unverified": "加振の方法、光ファイバの空間分解能、F1の算出単位は抄録になく未確認。"}}, {"id": "jr02", "rank": 2, "headline": "LLMペルソナ集団でHEXACO性格構造を再現できるか", "title": "Applying psychometrics to large language model simulated populations: recreating the HEXACO personality inventory experiment with generative agents", "url": "https://doi.org/10.1098/rsos.251802", "authors": "Sarah Mercer ほか", "venue": "Royal Society Open Science", "date": "2026-10-21", "citescore": 5.2, "citescore_year": "2025", "apa": "Mercer, S., Martin, D., & Swatton, P. (2026). Applying psychometrics to large language model simulated populations: recreating the HEXACO personality inventory experiment with generative agents. Royal Society Open Science, 13(10). https://doi.org/10.1098/rsos.251802", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "GPT-4で動く310体のペルソナ・エージェントにHEXACO性格検査を実施して因子分析し、元の人間の研究（Ashtonら 2004）の性格構造を部分的に再現できること、ただしモデルによって性格の現れ方がばらつくことを示した（抄録）。", "p2": "人物の経歴を与えたLLMエージェントは、社会科学研究で人間の参加者の安価な代わりとして使われ始めているが、人間の集団を本当に代表できるかの妥当性は十分に検証されていない（抄録）。", "p3": "経歴にもとづくペルソナを与えたGPT-4エージェント310体にHEXACO（正直さ-謙虚さを含む6因子の性格モデル）の質問紙に回答させ、因子分析で回答の構造を取り出し、元の研究の因子構造と比べた（抄録）。複数のモデルでも比較した。", "p4": "判断の基準は、①回答から一貫した信頼性の高い性格構造が取り出せるか、②その構造がHEXACOの枠組みとどれだけ一致するか、③モデル間で性格の現れ方が安定するか、である（抄録）。", "p5": "①一貫した信頼性のある性格構造が回復でき、HEXACOと部分的に一致した。②十分に吟味したペルソナ集団と組み合わせれば、GPT-4内では得られた次元が一貫し信頼できた。③モデル間の分析では性格のプロファイルにばらつきがあり、モデル固有の偏りと限界が示唆された（抄録）。", "p6": "著者は、人間の心理測定の枠組みを生成エージェントに当てはめることの限界を指摘する（抄録）。解釈：一致が「部分的」である具体的な因子と、ペルソナの吟味の方法が結果を左右しており、本文での確認が必要である。", "fun": "AIに310人分の人物設定を与えて性格テストを受けさせると、人間と同じような「性格の6つの軸」がある程度浮かび上がりました。ただしAIの種類を変えると性格の出方が変わるので、AIの回答は「人間の代わり」ではなく「そのAIの癖」も映している、という点が面白いところです。", "unverified": "一致した因子と一致しなかった因子、比較したモデルの名称は抄録になく未確認。"}}, {"id": "jr03", "rank": 3, "headline": "AI窓口で精神医療の受診前の摩擦を減らす設計", "title": "De-Sludging High-Friction Frontlines: Designing an AI-Mediated Service Gateway for Mental Health", "url": "https://doi.org/10.1177/10946705261487151", "authors": "Yi Tang ほか", "venue": "Journal of Service Research", "date": "2026-10-20", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Tang, Y., Sinha, K. K., & Moen, A. (2026). De-Sludging High-Friction Frontlines: Designing an AI-Mediated Service Gateway for Mental Health. Journal of Service Research. https://doi.org/10.1177/10946705261487151", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "精神医療の利用の入口で人を遠ざける認知的・感情的・手続き的な摩擦（サービス・スラッジ）を減らすため、AIによるサービスの入口MyMatcherを設計し、3つの設計原則と研究命題を導いた（抄録）。", "p2": "世界で約10億人が精神疾患を抱えるが、サービスが利用でき費用も手頃で知られていても35〜85%が治療を受けていない。障壁は供給不足だけでなく、入口での行動上の摩擦にあると考えられる（抄録）。", "p3": "デザインサイエンス研究の方法で、①日常の言葉で語られた苦痛から臨床的な意図を推定する感知エンジン、②打ち明けることの社会的リスクを下げる「自動的な社会的存在感（ASP）」の低いチャットボット、③提供者探しを厳選した候補一覧にまとめる照合モジュール、の3つからなる入口を設計した（抄録）。", "p4": "精神医療の実務家への診断的・評価的な面接と、4,000件超のラベル付き文章による分類の検証で評価した（抄録）。", "p5": "3つの設計原則と3つの研究命題を導いた。理論面では、3A（Affordability・Access・Awareness）の枠組みに4つ目の行動の次元Agency（主体性）を加え、入口を人の補助や代替とは異なる「出会いの前」の存在と位置付け、「低いASPが偏見の強い文脈での打ち明けを促す」という親密さの逆転を命題とした（抄録）。", "p6": "抄録の範囲では、利用者（患者）による実際の利用実験や受診率の変化は示されておらず、評価は実務家の面接と分類の検証にとどまる（解釈）。分類の精度の数値は抄録にない（未確認）。", "fun": "悩みを打ち明けるとき、相手が人間らしすぎると、かえって話しにくいことがあります。そこで、あえて人間らしさを抑えたAIを窓口にすると打ち明けやすくなる、という「親密さの逆転」の考えが面白いところです。サービスに届かない理由が、距離や費用ではなく「最初の一歩の重さ」にあると捉え直しています。", "unverified": "分類モデルの精度、面接の人数は抄録になく未確認。"}}, {"id": "jr04", "rank": 4, "headline": "大型水路実験で波-地盤-構造物の間隙水圧変化", "title": "Large-Scale Flume Investigation of Pore Water Pressure Evolution under Wave–Soil–Structure Interaction", "url": "https://doi.org/10.1061/jggefk.gteng-15428", "authors": "Ahmad Klait ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-20", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Klait, A., Mirghafouri, S., Ghayoomi, M., Farhadzadeh, A., & Hsu, T.-J. (2027). Large-Scale Flume Investigation of Pore Water Pressure Evolution under Wave–Soil–Structure Interaction. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15428", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "大型の造波水路実験で、孤立波が当たるときの砂地盤の間隙水圧と浸透の変化を、構造物の有無と根入れ深さを変えて測り、数値解析の大規模な実験基準を提供した（抄録）。", "p2": "波・地盤・構造物の相互作用で、間隙水圧と浸透圧がどう発達し、それが液状化や構造物の不安定化にどう関わるかは、大規模な実験の裏付けが不足していた（抄録）。", "p3": "砂地盤の異なる深さと水平位置に間隙水圧計を埋め、構造物なし（自由地盤）と基礎あり（地盤-基礎）の条件で、波高と基礎の根入れ深さを変えて孤立波を作用させた。過剰間隙水圧と浸透勾配を既存の浸透・液状化の判定基準と比べた（抄録）。", "p4": "判断の基準は、過剰間隙水圧と鉛直の浸透圧が限界の閾値を超えるか、浸透の向き（上向き・下向き）が深さと位置でどう変わるか、である（抄録）。", "p5": "どちらの条件でも過剰間隙水圧と鉛直の浸透圧は限界閾値を超えなかった。基礎ありでは、根入れを固定して波高を上げると浅い層で下向き、深い層で上向きの浸透が生じ、根入れを深くすると特に基礎直下で上向きの浸透圧が減った。自由地盤では波の衝撃で正の過剰間隙水圧のピークの後、引き波で蓄積が生じた（抄録）。", "p6": "著者は、液状化は主には観察されなかったが、高い波荷重と基礎直下の上向き浸透の発達の組合せが構造物の不安定化に影響した可能性を述べる（抄録）。解釈：孤立波（単発の波）の条件であり、繰り返し波による累積の挙動は抄録の範囲では扱われていない。", "fun": "津波のような大きな波が岸の建物に当たると、地面の中の水の圧力が上下に押し引きされます。地面が液状化しなくても、基礎の下で水が上向きに押し上げる力が建物を不安定にしうる、という指摘が面白いところです。実物に近い大きさの水路で確かめた点も貴重です。", "unverified": "水路の寸法、波高と根入れの具体的な値、間隙水圧の数値は抄録になく未確認。"}}, {"id": "jr05", "rank": 5, "headline": "状態パラメータ空間での確率的液状化発生モデル", "title": "Probabilistic State Parameter–Based Liquefaction Triggering Model", "url": "https://doi.org/10.1061/jggefk.gteng-15418", "authors": "Pedro Reyes ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-10-20", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Reyes, P., Montalva, G., San Martín, V., & Moss, R. (2027). Probabilistic State Parameter–Based Liquefaction Triggering Model. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15418", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "室内試験に基づき状態パラメータ（土の密度状態を表す指標）の空間で定式化した確率的な液状化発生モデルを作り、独立のCPTu事例データベースで、広く使われる方法と同等以上の判別性能を示した（抄録）。", "p2": "現在の液状化判定は、地震の事例と地表の噴砂などのラベルで較正した半経験的手順に頼っており、ラベルの偏りや地震・地質・地形条件の偏在の影響を受けうる（抄録）。", "p3": "20種の砂の繰返し・単調三軸試験で繰返し抵抗を較正し、材料内のばらつきと材料間の違いを分ける階層ベイズ回帰で試料単位の不確実性を伝播させる。CPTu（間隙水圧付きコーン貫入試験）から、抵抗・外力・状態パラメータ推定の不確実性を同時に考慮したモンテカルロで安全率FSと液状化確率PLの分布を求める（抄録）。", "p4": "独立のCPTu事例データベースで、ROC（受信者動作特性）にもとづいて判別性能を広く使われるCPTu手順と比べた（抄録）。単一材料の較正例も示した。", "p5": "判別性能は広く使われるCPTu手順と同等で、一部ではそれを上回った。現場を代表する室内試験データを加えると、繰返し抵抗の不確実性が平均で80%減った（抄録）。", "p6": "著者は、集団レベルの予測はスクリーニングに有用だが、重要な事業では材料固有の較正を推奨するとしている（抄録）。解釈：室内試験の20種の砂が現場の多様な土（細粒分を含む土など）をどこまで代表するかは抄録から判断できない。", "fun": "液状化の判定はこれまで「過去の地震でどこが噴砂したか」という記録に頼ってきました。代わりに実験室で砂を揺らした結果から出発し、不確かさまで確率として運ぶと、従来並みかそれ以上に当たる、という発想の転換が面白いところです。", "unverified": "ROCのAUCの値、比較した手順の名称は抄録になく未確認。"}}, {"id": "jr06", "rank": 6, "headline": "生成AIが組織の知識創造に加わると起業が変わる", "title": "When machines learn with organizations: AI ‐enabled knowledge creation and entrepreneurship", "url": "https://doi.org/10.1002/sej.70062", "authors": "Linhui Wu ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-10-20", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "apa": "Wu, L., Zahra, S. A., & Hashai, N. (2026). When machines learn with organizations: AI ‐enabled knowledge creation and entrepreneurship. Strategic Entrepreneurship Journal. https://doi.org/10.1002/sej.70062", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録（研究要約と経営者向け要約）を使用", "preprint": false, "p1": "企業専用の閉じた生成AIが組織の過程に組み込まれると、知識創造は人間だけの活動ではなく人とAIの混成の過程になる、という理論的な見方を示し、それに合わせて知識創造のサイクルを組み替えた概念論文（抄録）。", "p2": "技術変化と根本的な不確実性の下で、企業は新事業のために新しい形の知識創造に頼る必要がある。従来の組織的知識創造の理論は人間同士の相互作用を前提にしていた（抄録）。", "p3": "組織的知識創造を人とAIの混成の過程として再概念化し、複数の知識スパイラルを生み、新しい主体の出現と多様な種類の知識の生成を捉え、より速い時間的な動きをもつ、順序を組み替えた知識創造のサイクルを提案した（抄録）。解釈：野中のSECIモデルのような知識の螺旋に、AIを新しい主体として組み込む試みと読める。", "p4": "実証研究ではなく理論と研究課題の提示である。知識の生成・組み合わせ直し・内面化・共有・社内起業やスピンオフへの転換にAIがどう関わるかを論じる（抄録）。", "p5": "閉じた生成AIは人の判断を置き換えるのではなく、知識がどこで生まれ、どれだけ速く変わり、組織の境界をどれだけ広く巡るかを変える、と主張する。経営上の課題はAIの導入より、知識システムの設計と知識の流れの構造化にあるとする（抄録）。", "p6": "著者は、混成の知識創造は速く多様な学習を約束する一方、不透明性、信頼、認知的なロックインのリスクをもたらすと指摘する（抄録）。解釈：概念論文であり、提案したサイクルの実証的な検証はこれからである。", "fun": "会社の知恵は、人と人が話し合い、経験を言葉にし、また身に付けることで育つと考えられてきました。そこに社内専用のAIが加わると、知恵の生まれる場所も速さも変わる、という見方です。AIを道具ではなく「知恵づくりの仲間」として扱う点が面白いところです。", "unverified": "提案したサイクルの具体的な段階と研究課題の内容は抄録になく未確認。"}}, {"id": "jr07", "rank": 7, "headline": "近隣の治安認知と結束の軌跡が抑うつ・孤独を左右", "title": "Perceived neighborhood crime and social cohesion trajectories and mental health during COVID‐19: Evidence from a 2020–2024 cohort", "url": "https://doi.org/10.1002/ajcp.70116", "authors": "Yong Yang ほか", "venue": "American Journal of Community Psychology", "date": "2026-10-20", "sjr": 1.195, "citescore": 6.0, "citescore_year": "2025", "apa": "Yang, Y., & Khan, A. H. (2026). Perceived neighborhood crime and social cohesion trajectories and mental health during COVID‐19: Evidence from a 2020–2024 cohort. American Journal of Community Psychology. https://doi.org/10.1002/ajcp.70116", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "p1": "米国の成人895人を2020〜2024年に追跡し、近隣の治安の悪化の認知と地域の結束の低さが、抑うつ・不安・孤独と一貫して関連することを、人を単位とする方法と変数を単位とする方法の両方で示した（抄録）。", "p2": "近隣の認知と心の健康の関連は横断研究で示されることが多く、コロナ禍の期間を通じた変化の軌跡との関係は十分に調べられていなかった（抄録から読み取れる問い）。", "p3": "集団ベースの軌跡モデル（似た変化をたどる人のグループを見つける方法）で治安認知と結束の軌跡を分類し、多変量ロジスティック回帰で心の健康との関連を推定した。補完として、個人内の変化と個人間の差を分ける混合効果モデル（within-between）を使った（抄録）。", "p4": "2020年春に募集し、2024年まで少なくとも1回の年次追跡に答えた895人を対象に、抑うつ・不安・孤独のオッズ比と、個人内変化の標準化係数を評価した（抄録）。", "p5": "治安認知は低い（71.7%）・上昇（14.9%）・低下（8.7%）・高い（4.8%）の4軌跡、結束は高・中・低の3つの安定した軌跡だった。高い・上昇する治安不安は抑うつ（OR 2.61、1.82）と不安（OR 3.08、1.87）の高さと関連し、低い結束は抑うつ（OR 6.38）、不安（OR 4.81）、孤独（OR 4.17）の高さと関連した。個人内で治安認知が上がると孤独も上がった（β = .19）（抄録）。", "p6": "抄録の範囲では、観察研究であり因果は示されず、追跡の脱落や標本の代表性の扱いは不明である（解釈）。結束の個人内変化の効果（β = −0.02〜−0.04）は小さい（抄録）。", "fun": "「この辺りは物騒になった」と感じるようになった人ほど、孤独や不安が強まっていました。そして近所の人とのつながりが弱い人は、抑うつのオッズが約6倍でした。住んでいる場所の安全さと人間関係が、心の健康と切り離せないことを4年間の追跡で示した点が面白いところです。", "unverified": "募集方法、追跡率、調整した共変量は抄録になく未確認。"}}, {"id": "jr08", "rank": 8, "headline": "バスは精神疾患からの回復を支えるケアのインフラ", "title": "Urban Infrastructures of Care: Buses as Resources for Recovery and Mental Wellbeing", "url": "https://doi.org/10.1111/1467-9566.70278", "authors": "Marc Winz ほか", "venue": "Sociology of Health and Illness", "date": "2026-10-20", "sjr": 1.18, "citescore": 5.4, "citescore_year": "2025", "apa": "Winz, M., Söderström, O., Ruggeri, A., Favrod, J., Brischoux, J., Jordan, A., Abrahamyan Empson, L., & Conus, P. (2026). Urban Infrastructures of Care: Buses as Resources for Recovery and Mental Wellbeing. Sociology of Health & Illness, 48(8). https://doi.org/10.1111/1467-9566.70278", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "スイス・ローザンヌで初期の精神病から回復中の若者への質的研究から、バスが回復を支える日常の「ケアのインフラ」として働く一方、障害にもなることを示した（抄録）。", "p2": "交通インフラは都市のwell-beingの決定要因として認識されてきたが、重い精神疾患の人が「良くなる・悪くなる」過程での役割は、実証的にも理論的にもほとんど検討されていない（抄録）。", "p3": "健康と場所の関係論的な地理学、移動研究、ケアのインフラの研究の視点から、バスでの移動の社会物質的・感情的な側面を質的に分析した（抄録）。", "p4": "初期精神病から回復中の若者への質的研究で、バスの利用経験を資源と障害の両面から分析した（抄録）。", "p5": "バスは感情的な命綱、自律と自立の拠り所、公式・非公式のwell-beingの資源への入口として回復と都市への再参加を支えた。一方で感覚の過剰な刺激、他人との近さ、監視されている感覚、不安、経済的な制約も伴った。移動の能力は都市インフラとの出会いの中で関係的に形作られる（抄録）。", "p6": "抄録の範囲では、対象者の人数と面接の方法は不明で、一都市の事例である（解釈）。著者はバスを単なる交通サービスや治療資源への導管ではなく、回復が営まれる普通のケアのインフラとして理解すべきだと主張する（抄録）。", "fun": "病気から回復しつつある若者にとって、バスに乗れることは「一人で街に出られる」という自信の源になります。同時に、混雑や視線がつらい場所にもなります。バスを移動の手段ではなく「回復の舞台」として見直した視点が面白いところです。", "unverified": "参加者数、データ収集の方法（面接・同行観察など）は抄録になく未確認。"}}, {"id": "jr09", "rank": 9, "headline": "上場すると企業は国外の節税構造をすぐ整える", "title": "IPOs and Foreign Tax Structures", "url": "https://doi.org/10.2308/tar-2024-0048", "authors": "Christine L. Dobridge ほか", "venue": "Accounting Review", "date": "2026-10-20", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Dobridge, C. L., Lester, R., & Whitten, A. (2026). IPOs and Foreign Tax Structures. The Accounting Review, 1–32. https://doi.org/10.2308/tar-2024-0048", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国企業の法人税申告データ（2004〜2018年）で、新規株式公開（IPO）を完了した企業が、その後3年以内に多国籍の国外の節税構造を急速に整えることを示した（抄録）。", "p2": "上場が企業の国際的な税務計画の量と種類にどう影響するかは、IPOの税務上の影響を扱う研究がまだ新しく、十分に分かっていない（抄録）。", "p3": "法人税申告書のパネルデータで、IPOの申請前後の国外構造の変化を追った（抄録）。解釈：申告書の情報を使うため、財務諸表の注記からは見えにくい子会社の所在地や関連者間の支払いを直接観察できる点が強みである。", "p4": "評価の対象は、①低税率国での拠点の拡大、②国外子会社への無形資産の移転を伴う国際契約、③国外関連者への所得移転的な支払いの有無と水準で、効果の異質性を利益目標の圧力、IPO前の研究開発費、繰越欠損金の利用可能性で調べた（抄録）。", "p5": "IPOの申請から3年以内に、企業は①低税率国での拠点を広げ、②無形資産の移転を伴う国際契約を結び、③国外関連者への所得移転的な支払いの確率と水準を高めた。効果は上場後の利益目標達成の圧力が強い企業、IPO前の研究開発費が高い企業、繰越欠損金を使いにくい企業で最も強かった（抄録）。", "p6": "抄録の範囲では、IPOの時期の選択と税務計画の同時決定（内生性）への対処法は不明である（解釈）。効果の大きさの数値も抄録にない（未確認）。", "fun": "会社が株式を公開すると、四半期ごとに利益を見せる圧力が強まります。その結果、税率の低い国に拠点や特許を移す仕組みを3年以内に急いで作ることが、税務申告の記録から見えてきました。上場が税の払い方まで変える、というつながりが面白いところです。", "unverified": "効果の大きさ、識別の方法（比較群の作り方）は抄録になく未確認。"}}, {"id": "jr10", "rank": 10, "headline": "障害のある移民高齢者の社会的つながりを育むモデル", "title": "Emergent Connections: A Community-Based Model for Advancing Social Connection Among Immigrant Older Adults with Disabilities", "url": "https://doi.org/10.1093/geront/gnag242", "authors": "Laurent Reyes ほか", "venue": "Gerontologist", "date": "2026-10-20", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "apa": "Reyes, L., & Suarez, L. (2026). Emergent Connections: A Community-Based Model for Advancing Social Connection Among Immigrant Older Adults with Disabilities. The Gerontologist. https://doi.org/10.1093/geront/gnag242", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "障害のあるスペイン語話者の移民高齢者のための全米規模のオンラインプログラムの事例研究から、社会的なつながりと持続的な参加を育む「創発的つながりプラットフォーム」というモデルを示した（抄録）。", "p2": "社会的孤立は公衆衛生上の緊急の課題で、移民の高齢者は障害、健康の構造的な不平等、文化・言語に合ったサービスの不足のため、社会参加の障壁が特に高い（抄録）。", "p3": "地域と協働した事例研究で、視覚障害のある高齢者10人への質的面接、プログラムの文書、運営陣への相談を主題分析・比較分析した（抄録）。", "p4": "新しい介入の効果測定ではなく、プログラムの仕組みをモデルとして記述することが目的である（抄録）。", "p5": "モデルは3本の柱で、文化・言語・身体の面で利用しやすい基盤、会員のリーダーシップと共同創造を育む共有の統治、会員のニーズと工夫に応じて変われる柔軟な構造である。これらが、文化と生活経験を共有する高齢者のゆるやかなつながりを強めた（抄録）。", "p6": "抄録の範囲では、面接は10人と少なく、孤立や孤独の指標の変化は測られていない（解釈）。著者は、高齢者をサービスの共同創造者と位置付けるモデルへの持続的な投資を求めている（抄録）。", "fun": "目が不自由で言葉の壁もある高齢の移民は、孤立しやすい人たちです。支援を「してあげる」のではなく、本人たちが運営に加わり、自分たちに合う形に変えていける仕組みにしたことが、つながりを育てる鍵だった、という点が面白いところです。", "unverified": "プログラムの規模（参加者数）と期間は抄録になく未確認。"}}, {"id": "jr11", "rank": 11, "headline": "米国女性は男性より約3年長く家族介護を担う", "title": "Lifetime family caregiving for older U.S. adults by men and women, 2011 and 2023", "url": "https://doi.org/10.1093/geronb/gbag209", "authors": "Vicki A Freedman ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-10-20", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "apa": "Freedman, V. A., & Ng, Y. T. (2026). Lifetime family caregiving for older U.S. adults by men and women, 2011 and 2023. The Journals of Gerontology, Series B: Psychological Sciences and Social Sciences. https://doi.org/10.1093/geronb/gbag209", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "米国で20歳以上の人が残りの人生で高齢者の家族介護に費やす年数（生涯家族介護年数）を2011年と2023年で推計し、女性は男性より約3年長く、女性では12年間で1年増えたことを示した（抄録）。", "p2": "女性が男性より長く高齢の親族や友人を介護することは知られていたが、近年それが変わったか、介護相手の続柄や介護の種類で男女差がどう異なるかは更新されていなかった（抄録）。", "p3": "全米介護研究（NSOC、2011年 n = 1,972、2021〜2023年 n = 6,500）と人口動態調査（CPS）を用い、現在の年齢別の介護率が続くと仮定して残りの人生の介護年数を計算する人口学的手法（生命表の考え方）を使った（抄録）。", "p4": "評価したのは、男女別の生涯家族介護年数とその95%信頼区間、2011年と2023年の差、続柄（配偶者、親、祖父母など）と介護の種類（身の回り、家事、移動、医療）による差である（抄録）。", "p5": "2023年の生涯家族介護年数は女性7.1年（95%CI 6.2〜8.0）、男性4.2年（3.7〜4.7）で、約3年の差があった（p < .001）。女性では2011年より1年長く（p = .03）、男性はほぼ同じだった。配偶者・パートナーの介護は男女同程度だったが、親・祖父母などの介護と、身の回り・家事・移動・医療の作業では女性が長かった（抄録）。", "p6": "著者は、晩年の介護ニーズの増加と近い親族のいない高齢者の割合の上昇で、男女の差はさらに広がりうると述べる（抄録）。解釈：推計は現在の年齢別の率が将来も続くという仮定に依存し、調査の設計の違い（2011年と2021〜2023年）が比較に影響しうる。", "fun": "「平均寿命」と同じ考え方で、「一生のうち何年を家族の介護に使うか」を計算すると、アメリカの女性は約7年、男性は約4年でした。しかも女性だけが10年余りで1年増えていました。見えにくい家族のケアの負担を、年数というわかりやすい単位で示した点が面白いところです。", "unverified": "介護の定義（頻度や時間の基準）と、種類別の年数の具体的な値は抄録になく未確認。"}}, {"id": "jr12", "rank": 12, "headline": "AI生成モデルの開示は少数派の広告で評価を下げる", "title": "Synthetic diversity: Racial depictions influence consumer responses to AI ‐generated models in advertising", "url": "https://doi.org/10.1002/jcpy.70044", "authors": "Rhonda Hadi ほか", "venue": "Journal of Consumer Psychology", "date": "2026-10-20", "sjr": 5.284, "citescore": 12.3, "citescore_year": "2025", "apa": "Hadi, R., Uduehi, E., Thomaz, F., & Stephen, A. (2026). Synthetic diversity: Racial depictions influence consumer responses to AI ‐generated models in advertising. Journal of Consumer Psychology. https://doi.org/10.1002/jcpy.70044", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "広告でAI生成の人物（合成モデル）であることを開示すると、少数派の人種のモデルでは企業の評価が下がるが、白人のモデルでは下がらないという非対称性を、5つの研究で示した（抄録）。", "p2": "企業は広告の人種的な多様性を増やすため、AI生成の人物画像を手軽な手段として使い始めている。その開示が消費者の反応にどう影響するか、人種によって違うかは分かっていなかった（抄録）。", "p3": "5つの実験で、広告のモデルの人種とAI生成の開示の有無を操作し、企業評価を測った。媒介変数として、企業の包摂の取り組みの真正性の認知と、操作的な意図の推測を測った（抄録）。", "p4": "判断の基準は、開示による企業評価の低下が人種によって異なるか、その経路が真正性の低下→操作意図の推測であるか、企業が描かれた人種の共同体のメンバーに所有されていると伝えると低下が消えるか、である（抄録）。", "p5": "黒人・ヒスパニック・アジア系などのモデルではAI生成の開示が企業評価を下げたが、白人のモデルでは下げなかった。この効果は包摂の取り組みの真正性の認知の低下と、それによる操作的意図の推測の高まりによって生じた。企業が描かれた共同体のメンバーに所有されていると伝えると負の効果は和らいだ（抄録）。", "p6": "抄録の範囲では、実験の参加者の国・人数や刺激の詳細は不明で、実際の購買行動ではなく評価で測っている（解釈）。著者は、広告の技術革新はその意味を形作る社会的・歴史的な文脈から切り離せないと論じる（抄録）。", "fun": "多様な人種のモデルをAIで作って広告に載せると、「多様性を大切にしている」というより「多様に見せかけている」と受け取られてしまうことがあります。しかもそれは少数派のモデルのときだけ起きる、という非対称性が面白いところです。技術が同じでも、社会の歴史によって意味が変わることを示しています。", "unverified": "各研究の標本数、効果の大きさは抄録になく未確認。"}}, {"id": "jr13", "rank": 13, "headline": "敵対的な職場で心理的安全性を担う看護リーダーの逆説", "title": "Fostering Psychological Safety From Unsafe Ground: Professional Identity and the Leadership Paradox in NHS Nursing and Midwifery", "url": "https://doi.org/10.1111/jan.70796", "authors": "Claire Leader ほか", "venue": "Journal of Advanced Nursing", "date": "2026-10-21", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "apa": "Leader, C., Sanders, T., & Potthoff, S. (2026). Fostering Psychological Safety From Unsafe Ground: Professional Identity and the Leadership Paradox in NHS Nursing and Midwifery. Journal of Advanced Nursing. https://doi.org/10.1111/jan.70796", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "英国NHSの看護・助産のリーダーが、職業的アイデンティティを拠り所に部下の心理的安全性を育てる一方、敵対的な組織文化の中で同じ価値観が自分自身を危険にさらし、道徳的苦悩を積み重ねるという「リーダーシップとwell-beingの逆説」を描いた（抄録）。", "p2": "心理的安全性（チームで率直に発言しても罰せられないという共有された信念）を育てる責任はリーダーに求められるが、リーダー自身が安全でない環境にいる場合の帰結は十分に調べられていなかった（抄録）。", "p3": "構成主義的グラウンデッド・セオリーで、NHSで管理職の経験がある18人を目的的抽出し、集中的な半構造化面接を初期・焦点的コーディング、継続的比較、メモ書きで分析した（抄録）。", "p4": "仮説検証ではなく、データから理論を生成することが目的である（抄録）。", "p5": "3つの主題が得られた。①ケア・誠実さ・擁護の価値観を土台に信頼にもとづくチーム文化を作る、②現場の実践とのつながりという職業的な信頼性が信頼の「通貨」になる、③同じ職業的価値観が組織の中で自分を危険にさらし、道徳的苦悩が累積する。これを「安全でない地盤から心理的安全性を育てる」逆説と概念化した（抄録）。", "p6": "著者は、看護・助産のリーダーは安全でない地盤の上では心理的安全性を持続的に育てられず、組織はリーダーの心理的安全性を積極的に守る必要があると結論する（抄録）。解釈：18人の質的研究で、英国NHSの文脈に特有の結果である可能性がある。", "fun": "部下が安心して話せる職場を作ろうとするリーダーほど、上からの圧力や敵対的な文化の中で自分が傷ついていく、という逆説です。「守る人を誰が守るのか」という問いは、病院に限らずどの職場にも当てはまる面白さがあります。", "unverified": "参加者の職位の内訳と、面接の時期は抄録になく未確認。"}}, {"id": "jr14", "rank": 14, "headline": "都市緑化の冷却効果は温暖化で頭打ちになる", "title": "Diminishing cooling returns of urban greening amid a warming climate", "url": "https://doi.org/10.1073/pnas.2616535123", "authors": "Song Leng ほか", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "date": "2026-10-20", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Leng, S., He, H., Huete, A., Rangel Pinagé, E., Zhang, W., Ding, H., Chen, L., & Sun, R. (2026). Diminishing cooling returns of urban greening amid a warming climate. Proceedings of the National Academy of Sciences, 123(43). https://doi.org/10.1073/pnas.2616535123", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "世界の3,806の都市域の20年間の植生と冷却効果を評価し、北の先進国の都市では緑化が進んだのに冷却効果が頭打ちになり、南の途上国の都市では植生が停滞・減少している「気候の公平性の格差」を示した（抄録）。", "p2": "都市緑化は熱波の緩和策として広く優先されているが、その長期的・全球的な効果は十分に定量化されていなかった（抄録）。", "p3": "複数の衛星観測と、4,855の気象観測所の地上観測を統合し、3,806の都市域で植生の変化と、それに伴う冷却効果を20年間にわたって評価した（抄録）。", "p4": "判断の基準は、植生の拡大・停滞・減少の地域差と、植生の増加に対する冷却効果の大きさ（収穫逓減の有無）である（抄録）。", "p5": "北の都市は緑のインフラを大きく広げたが、冷却効果は飽和し、生物物理的な収穫が逓減していた。逆に南の多くの都市では植生が停滞または減少し、急速な温暖化を悪化させていた。現在の緑化の取り組みは温暖化の傾向を相殺するには不十分だった（抄録）。", "p6": "著者は、植生の量と質の両方に取り組む、文脈に応じた統合的な適応の枠組みが必要だとする（抄録）。解釈：抄録には冷却効果の具体的な数値がなく、「飽和」の定義や推定方法は本文で確認する必要がある。", "fun": "街に木を植えれば涼しくなる、というのは本当ですが、ある程度植えると効果が頭打ちになっていました。そしてもっと緑が必要な暑い途上国の都市ほど、緑が減っていたのです。良い対策でも「どこで」「どれだけ」で効き方が違い、そこに不公平が生まれる点が面白いところです。", "unverified": "冷却効果の大きさ（気温差）と、飽和の閾値は抄録になく未確認。"}}, {"id": "jr15", "rank": 15, "headline": "LLMのゼロショット予測が観光需要で統計モデルに勝つ", "title": "Tourism demand forecasting in the artificial intelligence era using large language models", "url": "https://doi.org/10.1108/tr-02-2026-0223", "authors": "Roman Egger", "venue": "Tourism Review", "date": "2026-10-21", "sjr": 2.279, "citescore": 18.8, "citescore_year": "2025", "apa": "Egger, R. (2026). Tourism demand forecasting in the artificial intelligence era using large language models. Tourism Review, 1–20. https://doi.org/10.1108/tr-02-2026-0223", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された構造化抄録を使用", "preprint": false, "p1": "欧州8か国の月次の観光客到着数で、LLMをゼロショットの予測器として使うと、最適化したSARIMA・ETS・Prophet・ランダムフォレストなどを一貫して上回ることを、学習データの混入を確かめる頑健性検査付きで示した（抄録）。", "p2": "LLMが観光需要の予測精度を既存の統計・機械学習手法より改善できるかは、複数国・複数期間で体系的に比べた研究がなかった（抄録）。", "p3": "Eurostatの8つの欧州の送出市場の月次到着データで、3系統のLLMに過去の系列を与えてゼロショットで予測させ、既存手法と標本外で比べた。コロナ前の安定期、LLMの学習期限より後の期間、古いモデルでの検査で、学習データの混入（答えを覚えている可能性）を確かめた（抄録）。", "p4": "指標はMASE（季節ナイーブ予測に対する平均絶対誤差の比、1未満なら季節ナイーブより良い）とDiebold–Mariano検定で、プロンプトの要素を外すアブレーションも行った（抄録）。", "p5": "コロナ後の主期間でLLMの平均MASEは0.67〜0.85で、ETS 1.56、SARIMA 2.67、Prophet 3.04、ランダムフォレスト4.32を下回った。コロナ前の安定期
