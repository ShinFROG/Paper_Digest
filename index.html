, "headline": "ループ間の受け渡しを再設計したTransformer", "title": "Mixture-of-Loops Transformer", "url": "https://arxiv.org/abs/2611.34923", "authors": "Lianghui Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "why": "同じ層を繰り返し使うループ型Transformerで、ループ間に何を渡すかを見直した。キーと値を記憶として深さとループをまたいで選択的に再利用する注意機構を導入し、残差流を保つ型と、埋め込みからやり直して前のループの記憶を読む型を示す。後者は並列学習と、学習時より長いループでの1回の走査の復号を可能にする。Hugging Faceで投票数56。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersに掲載されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "同じ層を何周も使うループ型のTransformerで、周回の間に何を受け渡すかを設計し直し、表現力と計算効率の両方を高めた。", "p3": "キーと値を記憶として、深さと周回をまたいで選択的に再利用する注意機構を導入した。残差流を保つ型と、埋め込みからやり直して前の周回の記憶を読む型があり、記憶の構築と予測の読み出しを分けるU字型の構成で、使わない復号の通過を省く（抄録）。", "p5": "400Bトークンの事前学習で、提案法は700M・1.5Bの密なモデルと3BのMoEモデルで比較対象のOLMo3を上回り、700Mでは検証の交差エントロピーで1.7倍のトークン効率を得た。3BのMoEでは10課題の正答率が2.1ポイント上がった（抄録）。", "fun": "AIの文章モデルは、多くの層を順に通して計算する。同じ層を何周も使い回せば、部品を増やさずに計算の回数を増やせるが、そのぶん遅くなる。この研究は、前の周で作った記憶を次の周で選んで読み返せるようにし、通らなくてよい部分は飛ばす工夫をした。同じ量の文章で学ばせても、より効率よく性能が上がったという。使い回しと近道の組み合わせが面白い。", "unverified": "比較の詳細な条件、推論の速度の全体像は抄録の範囲では未確認。査読前の原稿である。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "PC操作エージェントの評価環境を自動で進化させる", "title": "Self-Evolving Evaluation Environments for Computer-Use Agents", "url": "https://arxiv.org/abs/2611.30962", "authors": "Wenhao Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "why": "コンピュータ操作エージェントの評価が固定的で、難度の上限と粗い総合点が識別力を弱めている問題に対し、実行の記録から課題と実行可能な検証器を一緒に進化させる閉ループの評価環境を示した。評価範囲の拡大、エージェントごとの能力の境界の診断、検証器の精度の向上という3つの目的を分けて扱う。Hugging Faceで投票数51。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersに掲載されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "パソコンを操作するAIエージェントの評価を、固定の問題集ではなく、エージェントの実行記録をもとに課題と検証器が一緒に進化していく環境に置き換えた。", "p3": "評価の範囲を広げる「ベンチマークの進化」、エージェントごとに能力の境界を探る「診断の進化」、変わる要件を状態にもとづくチェックポイントに落として敵対的に確かめる「検証器の進化」という3つの目的を分けた閉ループの環境CUA-SEEを作った（抄録）。", "p5": "複数のエージェント、アプリケーション、ラウンドにわたって、過程の証拠を保ちながら、難しく測定可能な課題を生成できたと報告する。抄録に数値の結果は示されていない（抄録）。", "fun": "テストの問題がいつも同じだと、受ける側が強くなるにつれて差が分からなくなる。パソコンを操作するAIの評価でも同じことが起きている。この研究は、AIの実行の記録を見て、問題集のほうが自動で難しく、細かくなっていく仕組みを作った。採点係にあたる検証器も一緒に作り直す点が工夫で、測るものさし自体を育てるという発想だ。", "unverified": "抄録に数値がなく、生成された課題の数、難度の伸び、検証器の正確さは未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "鏡を置くだけでロボットの方策は大きく崩れる", "title": "Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies", "url": "https://arxiv.org/abs/2611.33010", "authors": "Xuanchen Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "why": "場面に鏡を置いたときにロボットの操作方策が正しく働くかを調べるベンチマークを作った。課題と成功基準を保ったまま、鏡1枚・2枚・鏡面の卓の条件を比べると、5つの方策すべてで成功率が下がり、低下は平均で10.8〜56.7ポイント、鏡面の卓では最大62.5ポイントだった。同じ形の反射しない板と比べ、鏡に固有の失敗を切り分けている。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersに掲載されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "場面に鏡を置くだけで、最新のロボットの操作方策の成功率が大きく下がることを、条件をそろえたベンチマークで示した。", "p3": "既存の評価基盤RoboDojoの上に、課題と成功基準と方策を変えずに、鏡なしと、鏡1枚・鏡2枚・鏡面の卓の条件を比べるRoboDojo-Mirrorを作った。鏡は障害物でもあるため、同じ形の反射しない板とも比べた（抄録）。", "p5": "5つの方策すべてで、どの鏡の条件でも成功率が下がった。3条件の平均で低下は10.8〜56.7ポイント、鏡面の卓では62.5ポイントに達した。鏡に固有の失敗の50〜88%は板との接触の記録なしに起きており、映った物体を狙う動きや実物の位置の誤認と整合した（抄録）。", "fun": "動物が鏡に映った自分を自分だと分かるかを調べる「鏡のテスト」がある。それにならって、ロボットの前に鏡を置いてみた研究だ。すると、鏡に映った物を狙うような動きが出て、作業の成功率が大きく落ちた。人間なら鏡だとすぐ分かるが、カメラの画像から動きを決めるAIには、画像の中の物が本物か映り込みかの区別がまだ難しいことが分かる。", "unverified": "各方策の個別の成績、実機実験の数値は抄録の範囲では未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "物理現象の無次元数をAIエージェントが見つける", "title": "AI Buckingham: Agentic Discovery of Dimensionless Scaling Laws Across Physical Regimes", "url": "https://arxiv.org/abs/2611.33961", "authors": "Ao Cheng ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "次元解析は許される無次元数を定めるが、どの組み合わせが支配的かは決めない。物理問題の記述と観測データから、言語モデルの推論と記号・数値のツールを組み合わせて支配的な無次元数を自律的に見つける枠組みを示した。勾配に基づくクラスタリングで物理領域を分け、相互情報量で支配的な群を選ぶ。流体や熱対流など10の系を扱う。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "物理の問題の説明文と観測データから、現象を支配する無次元数の組み合わせをAIエージェントが自律的に見つけ、条件によって変わるスケーリング則まで切り分ける枠組みを作った。", "p3": "大規模言語モデルの推論と計画に、あらかじめ用意した記号計算・数値計算のツールを組み合わせる。文献にもとづく知識の検索で次元を確認し、勾配にもとづくクラスタリングで物理的な領域を分け、相互情報量で支配的な無次元数の群を選ぶ（抄録）。", "p5": "流体力学、電磁流体力学、熱対流、積層造形にわたる10の物理系で、既知の相似の表現を復元し、領域に依存するスケーリングを解き明かした。粗い面の乱流抵抗の予測では、表面の統計量の有用な表し直しを見つけ、等価砂粒粗さの推定を改善した（抄録）。", "fun": "物理では、長さや速さなどをうまく組み合わせて単位のない数（無次元数）を作ると、大きさの違う現象を同じ式で扱える。ただ、どの組み合わせが大事かは次元の計算だけでは決まらない。この研究は、その「大事な組み合わせ探し」をAIのエージェントにやらせ、10の物理の系で既に知られている答えを再発見できることを確かめた。", "unverified": "10の系の内訳、再現の精度、粗さの推定の改善幅は抄録になく未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "世界モデルが読めるなら強化学習は要らないか", "title": "Do We Still Need Reinforcement Learning When We Can Read the World Model?", "url": "https://arxiv.org/abs/2611.34656", "authors": "Mingchao Zhang ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "環境のソースコードとして読める世界モデルがあるとき、言語モデルのコーディングエージェントがそれを読んで制御の方策を直接書く方法を調べた。方策はオンラインの結果やオフラインのデータで反復的に改良し、課題ごとの強化学習は行わない。複数のベンチマークで、従来の強化学習と同等以上の成績をはるかに少ない経験で得たと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "環境のソースコードという「読める世界モデル」があれば、LLMのコーディングエージェントがそれを読んで制御の方策を直接書け、課題ごとの強化学習をしなくても同等以上の成績が出ることを示した。", "p3": "エージェントは環境のソースコードを調べて、環境の知識を実行可能な判断の規則に翻訳し、オンラインの結果やオフラインのデータで方策を繰り返し改良する。ソースコードを見せない場合とも比べた（抄録）。", "p5": "多様な意思決定のベンチマークで、書き出された方策は従来の強化学習の方法に並ぶか上回り、必要な経験はずっと少なかった。得られた判断の規則は解釈でき、結果を受けた改良の過程も追えた（抄録）。", "fun": "ゲームの上手なやり方をAIに覚えさせるには、ふつう膨大な回数の試行錯誤をさせる。でも、もしゲームのルールが書かれたプログラムそのものを読めるなら、やってみる前に考えれば済むかもしれない。この研究は、AIにルールのプログラムを読ませて「こう動けばよい」という手順を書かせた。試行錯誤で鍛える従来の方法と同じかそれ以上の成績が、はるかに少ない経験で出たという。", "unverified": "使ったベンチマークの名前、成績と経験量の具体的な数値は抄録になく未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "分類器なし誘導で生成が偏る仕組みを解析的に説明", "title": "Understanding Mode Collapse in Diffusion Models under Classifier-Free Guidance", "url": "https://arxiv.org/abs/2611.33719", "authors": "Daniel Pfrommer ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "拡散モデルの分類器なし誘導の効果が、条件つき分布と無条件分布の表現力の食い違いから生じると捉えた。条件つき分布を楕円体上に平均をもつガウス混合、無条件分布をその混合を近似する単一のガウス分布とする解析モデルを提案し、誘導のもとでの流れを解析的に扱えるようにして、モード崩壊の理解を目指す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "画像生成の拡散モデルで広く使われる「分類器なし誘導」が、なぜ生成結果を一部に集中させるのかを、解析的に解けるモデルで説明した。", "p3": "誘導の効果は、条件つき分布のほうが無条件分布より複雑で忠実だという表現力の食い違いから生じると捉える。条件つき分布を楕円体上に平均をもつガウス混合、無条件分布をそれを近似する単一のガウス分布とし、すべてのノイズ水準と誘導の強さで閉じた形の解を導いた（抄録）。", "p5": "解析解は、誘導が（a）平均の軸の方向へのずれと、（b）ノイズなしから始めた条件つきの標本に対応する特異な点への持続的な偏りと集中を引き起こすことを示す。この理論的な予測を、事前学習済みの大規模な画像拡散モデルで検証した（抄録）。", "fun": "画像生成AIには、指示への従い方を強める調整がある。強くすると絵は忠実になるが、似たような絵ばかり出るようになる。なぜそうなるのかは、式が複雑でよく分かっていなかった。この研究は、式で解ける簡単な模型を作り、調整を強めると生成が特定の一点に引き寄せられて集まっていくことを示した。経験的に使われてきた技に理屈を与えた研究だ。", "unverified": "検証に使ったモデルと定量的な一致の程度は抄録になく未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "時系列基盤モデルは未知の施策の予測に弱いか", "title": "CovNovBench: A Benchmark for Evaluating Time Series Foundation Models under Covariate Novelty", "url": "https://arxiv.org/abs/2611.33732", "authors": "Wenhao Pan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "共変量を入力できる時系列の基盤モデルは、価格政策や治療計画のような計画された行動のもとでの予測に使われる。将来の共変量が過去の範囲を外れる状況を「共変量の新規性」と定義し、これを体系的に含むベンチマークを作って、既存モデルの挙動を評価する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "時系列の基盤モデルが、過去に例のない施策（共変量の値）のもとでの予測をどれだけ信頼できるかを調べるベンチマークを作り、どのモデルも一貫しては信頼できないことを示した。", "p3": "将来の共変量が履歴の範囲を外れる状況を「共変量の新規性」と定義し、シミュレータにもとづくデータと実データの4つから、88,476系列の評価用データを生成・抽出した。共変量を扱える6つの基盤モデルを、追加学習なしで点予測と方向の精度で評価した（抄録）。", "p5": "共変量の新規性のもとでは点予測の誤差がほぼ常に増え、方向の精度の変化は一様でなく、最良のモデルはデータと指標によって変わった。一貫して信頼できるモデルはなかった（抄録）。", "fun": "「値段をこれまでにない水準に変えたら売上はどうなるか」を予測したい。大量の時系列で鍛えたAIは、過去に似た状況の予測は得意でも、試したことのない手を打った場合は苦手かもしれない。この研究は、まさにその「前例のない条件」を集めた88,476本の試験を作った。結果、どのAIも安定しては当てられなかった。やったことのない事の結果は、過去のデータだけからは読みにくい。", "unverified": "6つのモデルの名前、誤差の増え方の数値は抄録になく未確認。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "連続処置の効果曲線に形状制約つきの信頼帯", "title": "Adaptive confidence bands for a continuous treatment effect curve under shape constraints", "url": "https://arxiv.org/abs/2611.33440", "authors": "Charles R. Doss ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "観測データで処置が連続のとき、効果の曲線全体に対する同時信頼帯を、単調性または凹性の形状制約のもとで構成した。2つの局外関数の誤差の積が十分小さければ漸近的に妥当で、曲線の平坦さや滑らかさが未知でも最適な収束率を達成する適応性をもつ。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "処置が連続的な値をとるとき、処置の水準ごとの効果を表す曲線全体に対する信頼帯を、単調または凹という形の仮定を使って作る方法を示した。", "p3": "未測定の交絡がないという仮定のもとで、効果の曲線が単調性または凹性を満たすとして同時信頼帯を構成する。2つの局外関数が現れ、その誤差の率の積が十分小さければ漸近的に妥当になる（抄録）。", "p5": "信頼帯は、真の曲線の平坦さや滑らかさの水準が分からなくても、それを知っている場合と同じ最適な収束率を上限ノルムで達成する適応性をもつ。シミュレーションと、看護師の配置が病院の成績に与える効果への適用で示した（抄録）。", "fun": "看護師を増やすと病院の成績はどれだけ良くなるか。もっと増やしたらどうか。こうした「量と効果の関係」は1本の曲線になるが、データから描いた曲線にはぶれがある。この研究は「増やすほど良くなる」「伸びがだんだん鈍る」といった自然な形の仮定を使って、曲線全体が入る帯を、確かさを保ちながら描く方法を作った。形についての常識を統計に生かす工夫が面白い。", "unverified": "シミュレーションの数値、看護師配置の応用での結果は抄録になく未確認。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "因果効果の境界が線形計画1つで求まる条件", "title": "A Graphical Criterion for Linear Causal Bounds", "url": "https://arxiv.org/abs/2611.33950", "authors": "Alexis Bellot", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "未観測の交絡があると因果効果や反実仮想の値は部分的にしか識別できない。離散変数で、交絡を受ける成分ごとの隠れた原因が2つ以下の因果図について、鋭い境界が1つの線形計画の最適値に一致するための必要十分条件をグラフの基準として与えた。仮定・問い・データを組み合わせて境界を計算するPythonパッケージも公開する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "未観測の交絡があって因果効果が一点に決まらないとき、効果の取りうる範囲の最も狭い境界が線形計画1つで求まるのはどんな因果図の場合かを、必要十分条件として示した。", "p3": "離散値の変数を対象に、交絡を受ける各成分の隠れた原因が2つ以下であるすべての因果図について、鋭い境界が、あらゆる（正の）確率表に対して1つの線形計画の最適値に一致するための条件を与えた（抄録）。", "p5": "この条件にもとづく算法を、仮定・問い・データを組み合わせて鋭い境界を計算できるPythonパッケージ「partialid」として実装した。抄録に数値の結果は示されていない（抄録）。", "fun": "データから原因と結果の関係を知りたくても、測っていない要因が混じると、効果はぴったり一つの値には決まらない。それでも「少なくともこれ以上、多くてもこれ以下」という範囲なら言える。その範囲を最も狭く求める計算は、因果の図がある形をしていれば、線形計画という扱いやすい計算1回で済む。この論文は、その「ある形」を図から判定できる条件として示した。", "unverified": "条件の具体的な内容と証明、計算時間は抄録の範囲では未確認。"}}, {"id": "pn41", "rank": 41, "field": "工学", "headline": "建物台帳の違いが地域の地震リスク評価を左右する", "title": "Exposure Uncertainty and its Impact on Regional Seismic Risk Assessment", "url": "https://doi.org/10.21203/rs.3.rs-11865927/v1", "authors": "AnnaElisa Huynh ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "why": "地域の地震リスク評価の土台になる建物の台帳（曝露モデル）は、属性の欠損や情報源の食い違いを含む。妥当な複数の候補の台帳の間で生じる不確かさが、想定地震のもとでのリスク指標にどれだけ影響するかを調べる原稿である（抄録の冒頭の範囲）。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "地域の地震リスクを見積もる土台となる建物台帳の作り方の違いが、リスクの推定値にどれだけ不確かさをもたらすかを、ロジックツリーで定量化した。", "p3": "全国で入手できるデータから作る建物台帳について、資産単位の曝露モデルの不確かさの源を体系的に洗い出し、既知の偏りを取り除く方法を検討したうえで、ありうる台帳の組を生成して想定地震のもとで評価した（抄録）。", "p5": "大きな偏りは頑健な曝露モデルの方法で対処できる。残る曝露モデルの不確かさは、地震動モデルの選択など他の要素と比べて無視できない大きさで、建物の特性、リスクの指標、用途の区分、場所によって一様ではなかった（抄録）。", "fun": "「この地域で大地震が起きたら被害はどのくらいか」を計算するには、どこにどんな建物があるかの台帳が要る。ところがその台帳は、資料によって情報が欠けていたり食い違っていたりする。この研究は、もっともらしい台帳を何通りも作って計算をやり直し、台帳の違いだけで被害の見積もりがどれだけ動くかを測った。揺れの予測式の選び方と比べても、無視できない差があった。", "unverified": "対象地域、不確かさの大きさの数値は抄録になく未確認。査読前の原稿である。"}}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "連続地震で損傷が積み重なる過程を実建物で追う", "title": "Impact of Successive Earthquakes on Incremental Structural Damage during the 2025 Sındırgı, Türkiye Earthquake Doublets", "url": "https://doi.org/10.21203/rs.3.rs-11609916/v1", "authors": "Hasan Hüseyin Aydogdu ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "why": "2025年8月と10月にトルコのスンドゥルグで続けて起きた同程度の強さの2つの地震について、1回目で大きく損傷した隣り合う2棟の鉄筋コンクリート建物を、現地調査・材料試験・数値解析で比べた。既存の損傷が次の揺れへの脆弱性をどう高めるかを実例で追っている。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "短い間隔で2度の強い地震に襲われた地域で、最初の地震で傷んだ建物が2度目でどうなったかを、隣り合う2棟の比較から明らかにした。", "p3": "2025年8月10日のMw6.1の本震と、10月27日の同程度の強さの地震に見舞われたトルコのスンドゥルグ地区で、構造形式の似た隣接する鉄筋コンクリート建物2棟を、詳細な現地調査、材料試験、数値解析で調べた（抄録）。", "p5": "2棟はどちらも1度目の地震で大破と分類されていたが、2度目で1棟は完全に倒壊し、もう1棟は立ったままだった。1度目のあとの調査で見つかっていた両者の違いが結果を分けた。既存の損傷に配筋の細部の不備が重なると、繰り返しの揺れで耐力が次第に失われる（抄録）。", "fun": "大きな地震のあと、傷んだ建物にもう一度同じくらいの地震が来たらどうなるか。実験では確かめにくいこの問いに、トルコで実際に起きた2度の地震が手がかりを与えた。隣に並ぶよく似た2棟のうち、1棟は2度目で完全に崩れ、もう1棟は残った。見た目は似ていても、1度目のあとに見つかる違いが、次の地震での結果を分けることが分かる。", "unverified": "2棟の違いの具体的な内容、材料試験と解析の数値は抄録になく未確認。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "衛星重力でカムチャツカ地震の断層モデルを採点", "title": "Assessment of Published Finite-Fault Models for the 2025 Kamchatka Earthquake by Comparison with Satellite Gravity Observations", "url": "https://doi.org/10.21203/rs.3.rs-11655298/v1", "authors": "Yusaku Tanaka", "venue": "Research Square (In Review)", "date": "2026-11-26", "why": "2025年のMw8.8カムチャツカ地震について、GRACE-FOの観測から地震時の重力変化（最大+3.2、最小−4.3マイクロガル）を推定し、公表されている8つの有限断層モデルの予測と、パラメータを調整せずに比べた。観測との空間相関はモデルにより大きく異なり、上位は0.93、0.91、0.89だった。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "2025年のカムチャツカ地震（Mw 8.8）について、衛星で測った重力の変化を、公表されている8つの断層モデルの予測と突き合わせ、モデルの出来を従来の地震・測地の観測とは独立に評価した。", "p3": "GRACE Follow-Onの観測から地震時の重力変化を推定し、公表済みの8つの有限断層モデルが予測する重力変化と、震源のパラメータを調整せずに比べた。陸と海にまたがるため、海水の再配分の効果も含む（抄録）。", "p5": "観測された重力場は最大+3.2マイクロガル、最小−4.3マイクロガルだった。観測と予測の空間相関はモデルで大きく異なり、上位2つは0.93と0.91、次が0.89だった。重力変化の大きい領域に限ると、上位2つの相関は約0.98に達した（抄録）。", "fun": "巨大地震で地下の岩盤がずれると、質量の配置が変わり、重力がほんのわずかに変わる。その変化を人工衛星が上空から捉える。この研究は、地震計などのデータから作られた8つの「断層のずれ方の説明」を、まったく別の物差しである重力で採点した。同じ地震の説明でも、重力との合い方にははっきり差が出た。別の種類のデータで答え合わせをする面白さがある。", "unverified": "重力変化の推定方法の詳細、各モデルの個別の数値、観測の分解能の限界の影響は抄録の範囲では未確認。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "かんらん石の破壊を高速X線と音響で捉える", "title": "High-spatiotemporal-resolution stress and acoustic emission monitoring across the brittle–plastic transition in olivine under true triaxial compression", "url": "https://doi.org/10.21203/rs.3.rs-11479232/v1", "authors": "Rikuto Honda ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "why": "SPring-8の高フラックスの100keVのX線を使い、最大5GPaの真三軸圧縮下のかんらん石で、応力と変形を高い時間・空間分解能で測る手法を開発した。アコースティックエミッションの計測と組み合わせ、0.3〜0.6秒の間に起きる応力降下を、脆性から塑性への遷移をまたいで検出した。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "高圧下のかんらん石が、割れる脆い変形から流れる塑性変形へ移る過程で、応力の急な変化と微小な破壊音を、高い時間・空間分解能で同時に捉える実験手法を開発した。", "p3": "SPring-8の高フラックスの100keVのピンクビームを使う測定法を開発し、マルチアンビル型の装置で最大5GPaの真三軸の冷間圧縮をかけたかんらん石に適用した。アコースティックエミッション（AE）の測定と組み合わせた（抄録）。", "p5": "AEを伴う応力降下を0.3〜0.6秒以内の現象として検出した。破壊時の応力と断層の形は中間主応力の影響を示唆した。脆性・半脆性の破壊に伴う応力の空間的な不均一と、塑性変形中の応力の均質化も分解できた（抄録）。", "fun": "地下深くでは岩が高い圧力を受けていて、パキッと割れるか、じわりと変形するかの境目がある。沈み込み帯の地震の理解に関わるこの境目を、大型放射光施設SPring-8の強いX線で調べた。1秒にも満たない間に起きる力の急な抜けを、破壊の音と一緒に捉えられるようになった点が新しい。速くて場所ごとに違う現象を、高い圧力の中で見る技術の進歩が面白い。", "unverified": "時間・空間分解能の具体的な値、試料の数は抄録になく未確認。"}}, {"id": "pn45", "rank": 45, "field": "環境・気候政策", "headline": "海洋の熱塩循環の急変を輸送の収支で統一的に説明", "title": "Basin-Scale Nonlinear Dynamics of Thermohaline Ocean Circulation. Part I: Theory", "url": "https://arxiv.org/abs/2611.33383", "authors": "Conner W. Lester ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "熱塩循環が複数の平衡と急な遷移をもつことを、トレーサーの保存から導く枠組みで説明した。表面のフラックスを散逸と移流による輸送とつり合わせ、大規模な勾配と輸送効率で表す。3次元の海盆モデルでは、循環の崩壊のしきい値を非線形の塩分移流が、回復のしきい値を線形の散逸が支配する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "海洋の熱塩循環が急に崩れたり戻ったりする仕組みを、熱や塩の輸送の収支という1つの枠組みで説明し、簡単な箱モデルの知見と3次元モデルをつないだ。", "p3": "トレーサー（熱・塩）の保存から出発し、海面でのフラックスを、散逸による輸送と移流による輸送でつり合わせる。このつり合いを、大規模なトレーサーの勾配と、循環が流れのない状態からトレーサーの場をどれだけずらすかを表す輸送効率で表す（抄録）。", "p5": "3次元の海盆モデルでは、循環の崩壊のしきい値は非線形の塩分移流が、回復のしきい値は線形の散逸が支配した。輸送は弱い流れでは循環の強さのほぼ2乗、強い流れでは1乗に比例する領域に分かれ、単純な閉じ方をすると従来の箱モデルの分岐の結果に帰着した（抄録）。", "fun": "海には、温度と塩分の違いで動く大きな流れがある。この流れは複数の安定な状態をもち、急に切り替わることがあると考えられている。この研究は、流れが運ぶ熱と塩の出入りの帳尻という見方で、流れが崩れる限度と戻る限度を説明した。崩れるときは塩の運ばれ方の非線形性が、戻るときは別の線形の仕組みが効くという、行きと帰りの非対称が面白い。", "unverified": "モデルの設定としきい値の具体的な値、現実の海洋への適用は抄録の範囲では未確認（転換点の予測は続編で扱うとある）。"}}, {"id": "pn46", "rank": 46, "field": "環境・気候政策", "headline": "排出量取引のもとでの企業の信用リスクを構造モデルで", "title": "Modelling and Calibration of Climate-Related Credit Risk Under the Emissions Trading System", "url": "https://arxiv.org/abs/2611.34771", "authors": "Ying Liao ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "排出枠の上限が社債の満期内にゼロへ向かう状況で、企業が予想される炭素価格のもとで排出を選び、炭素価格が市場の需給で決まる構造モデルを作った。均衡価格の存在と上限が拘束する条件、各企業の最適な排出を導き、線形化した場合には倒産確率が明示的に得られる。EU排出量取引制度のもとの欧州の発電35社に合わせて較正した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "排出量取引制度のもとで、炭素価格と企業の排出の選択を同時に決める構造モデルを作り、企業の倒産確率を気候政策のシナリオと結びつけて計算できるようにした。", "p3": "企業は予想される炭素価格のもとで複数のエネルギー源からの排出を選び、実現する炭素価格は部門・地域ごとの炭素市場の需給で決まる。シナリオに依存する需要の衝撃と、適応で和らげられる物理的な損失を入れる（抄録）。", "p5": "均衡の炭素価格が存在すること、排出の上限が拘束する条件、各企業の最適な排出を示した。線形化した場合、炭素価格は決定論的になり倒産確率が明示的に得られる。EU排出量取引制度のもとの欧州の発電35社に合わせると、2018〜2024年の排出枠価格の平均水準を再現した（抄録）。", "fun": "二酸化炭素を出す権利に値段がつく制度では、出せる総量の上限が決められている。その上限が、会社の借金の返済期限より前にゼロになる場合もあるという。それなら、その会社にお金を貸す危険も変わるはずだ。この研究は、権利の値段と会社の排出の決め方を1つの模型にまとめ、会社が債務を返せなくなる確率を式で出せるようにした。環境の制度が、貸し倒れの計算に直結するのが面白い。", "unverified": "倒産確率の具体的な数値、モデルの較正の詳細は抄録になく未確認。"}}, {"id": "pn47", "rank": 47, "field": "環境・気候政策", "headline": "風のずれから仕事を取り出して気球の高度を操る", "title": "Skysail: Altitude Control of Long-Duration Weather Balloons by Extracting Work from Wind Shear", "url": "https://arxiv.org/abs/2611.33882", "authors": "Michal Adamkiewicz ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "長時間飛ぶ気象観測気球は、ガスの放出とバラストの投下で高度を変えるため観測回数に限りがある。気球の450m下に吊るした小さな翼が、2つの高度の風速差から空気力を得て上昇・下降する方式を開発した。43時間でガスもバラストも使わずに11回の鉛直観測（計53kmの上下動）を行い、別の8日間の飛行では24回の観測を行った。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "気象観測の気球が、ガスの放出やおもりの投下に頼らず、上空と下の風の差から力を得て上下できる高度制御の仕組みを作り、実際の飛行で確かめた。", "p3": "ゼロ圧気球の450m下に小さな翼を吊るす。2つの高度の風速の差で翼に相対的な気流が当たり、翼の迎え角を制御すると上昇・下降の空気力が生じる。設計のモデル、係留索を繰り出す軽量の調速機構、高度保持と反復観測の制御を開発した（抄録）。", "p5": "43時間の区間で、おもりもガスも使わずに11回の鉛直観測を行い、上下の移動は計53kmに達した。別の8日間の飛行では、1kmを超える鉛直観測を24回行い、計159km上下した。制御の効きは得られる風のずれに依存する（抄録）。", "fun": "空の気温や風を測る気球は、上がるにはおもりを捨て、下がるにはガスを抜く。どちらも使い切ったら終わりだ。この研究は、気球の下に長いひもで小さな翼を吊るした。上と下で風の速さが違うので、翼には風が当たる。その風で力を作れば、何も捨てずに上がり下がりできる。風の「ずれ」そのものを動力にするという発想で、43時間に11回の観測をしてみせた。", "unverified": "翼の大きさ、必要な風のずれの大きさ、制御の精度の数値は抄録になく未確認。"}}, {"id": "pn48", "rank": 48, "field": "環境・気候政策", "headline": "暑さの影響はインドの製造業企業の規模で異なる", "title": "Limits to adaptation: distributional impacts of climate change on manufacturing firms in India", "url": "https://econpapers.repec.org/RePEc:unu:wpaper:wp-2026-124", "authors": "Garima Jasuja", "venue": "RePEc NEP", "date": "2026-11-23", "why": "インドの製造業の年次調査の大規模な企業パネルを使い、気温が企業の生産の分布全体に与える影響を、再中心化影響関数（RIF）回帰で推定した。平均ではなく分布の各位置での影響を見ることで、暑さへの適応の限界が企業によって異なることを調べている（抄録の範囲）。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に掲載された短い抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "暑さがインドの製造業の企業に与える影響を、平均ではなく企業の生産の分布全体にわたって推定する研究である（入手できた抄録は方法の説明にとどまる）。", "p3": "インドの年次工業調査（Annual Survey of Industries）の正規部門の製造業企業の大規模なパネルに、再中心化影響関数（RIF）回帰を適用し、気温が生産の分布の各位置に与える無条件の部分的な影響を推定する（抄録）。", "p5": "入手できた抄録には結果が書かれておらず、影響の大きさや、分布のどの位置の企業で影響が大きいかは未確認。", "fun": "暑さは工場の生産にとって逆風になる。では、その打撃は生産の多い会社にも少ない会社にも同じように及ぶのだろうか。平均だけを見ていると、この違いは分からない。この研究は、生産の少ない企業から多い企業までの分布の各位置で、暑さの影響がどう違うかを測る方法を使っている。題名は「適応の限界」を掲げており、暑さへの備えにも限りがあるのかという問いが面白い。", "unverified": "結果の数値、対象期間、企業数は抄録になく未確認。"}}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "オープンバンキングはフィンテックの利用を押し上げる", "title": "Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps&nbsp;", "url": "https://doi.org/10.2139/ssrn.7727118", "authors": "Xinchen Ma", "venue": "SSRN", "date": "2026-11-25", "why": "フィンテックのアプリのソースコードから独自のデータを作り、同じアプリの中で国によってオープンバンキングが使えるかどうかの違いを利用して効果を調べた。オープンバンキングはアプリの利用と成績を高め、データを多く使うアプリと新興企業で効果が大きい。影響を受けた既存銀行は貸出と収入が減る一方、手数料の比重を高めて対応する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "銀行が握る顧客データへのアクセスを開く「オープンバンキング」が、フィンテックのアプリの利用を伸ばし、既存の銀行の貸出と収入を減らすことを示した。", "p3": "フィンテックのアプリのソースコードから独自のデータを作り、同じアプリの中で国によってオープンバンキングが使えるかどうかが違うことを利用して効果を識別した。アプリの説明文のテキスト分析も使った（抄録）。", "p5": "オープンバンキングはアプリの利用と成績を有意に高め、効果はデータを多く使うアプリ、新興のフィンテック企業、従来の銀行を利用しにくかったパンデミック期で大きかった。影響を強く受ける既存の銀行は貸出と収入が減るが、手数料の比重を高め収益の効率を上げて対応した（抄録）。", "fun": "銀行は、客の取引の記録をよく知っている。そのデータを銀行だけが握っていると、新しい金融アプリの会社は不利だ。この研究は、データを開放する政策が実際に競争を変えたかを、同じアプリでも国によって政策があるかないかが違うことを使って調べた。開放された国ではアプリの利用が伸び、銀行は貸出が減るぶん手数料の比重を高めた。データの独占が力の源だったと分かる。", "unverified": "効果の大きさの数値、対象の国とアプリの数は抄録になく未確認。"}}, {"id": "pn50", "rank": 50, "field": "経営学", "headline": "労組が弱まると従業員持株制度も減る", "title": "When Strikes Meet Stocks: Organized Labor and the Politics of Employee Ownership", "url": "https://doi.org/10.31235/osf.io/mbj96", "authors": "Lydia Camp", "venue": "SocArXiv", "date": "2026-11-25", "why": "米国の従業員持株制度（ESOP）の採用が労働組合の力に左右されるかを、2000〜2024年の年金報告書と、州ごとに時期の異なる労働権法の導入を使って調べた。労働権法は組合の組織率を下げ、その後に稼働中のESOPが減る。この効果は組織率を考慮すると弱まり、従業員持株が労使の対立への経営側の対応でもあることを示唆する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "米国で、労働組合の力が弱まると従業員持株制度（ESOP）も減ることを示し、従業員持株が労使の対立への経営側の対応という面をもつことを示唆した。", "p3": "2000〜2024年の年金制度の報告書（Form 5500）を使い、州ごとに導入時期の異なる労働権法を組合の力への衝撃として、差分の差分とイベントスタディで分析した（抄録）。", "p5": "労働権法は組合の組織率を下げ、その後に稼働中のESOPが減った。この効果は組織率を考慮すると弱まり有意でなくなるため、組合が労働権法と従業員持株の形成をつなぐ主な経路だと考えられる（抄録）。", "fun": "社員が自分の会社の株を持つ制度は、会社と社員が協力する仕組みだと説明されることが多い。ところがこの研究では、労働組合を弱める法律ができた州で、この制度がむしろ減っていた。組合の圧力への経営側の戦略的な対応という面があるなら、圧力が弱まれば要らなくなる、というわけだ。協調の印に見える制度の裏に、力関係があることが見えてくる。", "unverified": "減少の大きさの数値、対象の州と企業の数は抄録になく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "車両通過の振動から橋の「指紋」を見分ける", "title": "Wavelet-Augmented Feature-Based Machine Learning: Application to the Fingerprinting of Civil Engineering Structures from Vibration Signatures", "url": "https://doi.org/10.3390/infrastructures11120440", "authors": "Mohamed Jaouad Lahgazi ほか", "venue": "Infrastructures", "date": "2026-11-25", "sjr": 0.671, "citescore": 5.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": はなく、複雑な考えを自分のものにして口頭で説明する知識集約的な活動を対象にした。判断の比重が高い部分では能力の高い参加者ほど生成AIから大きな利得を得て、能力の低い参加者は生成AIで代替できる部分でしか成績が上がらず、成績の格差が広がった。"}, {"id": "jn03", "rank": 3, "field": "環境・気候政策", "headline": "55の行動介入でも炭素価格への支持は微増", "title": "Fifty-five crowdsourced designs assessing carbon pricing support in the USA", "url": "https://doi.org/10.1038/s41562-026-02629-8", "authors": "Armando Holzknecht ほか", "venue": "Nature Human Behaviour", "date": "2026-11-25", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "why": "国際的な研究チームが別々に考案した55の行動介入を、米国の約2万人に同時に試した事前登録の共同研究。実際の支持を表す指標への効果はごく小さいが有意で（Cohenのd=0.06）、表明された支持も5指標中4つで1.7〜2.4ポイント増にとどまった。研究チームは自分や他のチームの介入の効果を大きく見積もりすぎており、研究者集団の期待のずれも明らかになった。"}, {"id": "jn04", "rank": 4, "field": "政治学", "headline": "多数決が個人に勝つのは考え方が十分に多様なとき", "title": "Cognitive diversity and majority rule", "url": "https://doi.org/10.1073/pnas.2608826123", "authors": "Lu Hong ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "集団の多数決が個人より正確になる理由を、独立な信号を前提とするコンドルセの陪審定理ではなく、同じ世界の状態を人が異なるモデルで分類するという「解釈された信号」の枠組みで説明した。集団の正確さは個人の平均的な正確さと対ごとの多様性で特徴づけられ、多数決が構成員を確実に上回るのは多様性が高いときに限られる。複数の実データとシミュレーションがこの枠組みを支持する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "広く使われる過信の指標は能力と区別できていない", "title": "Widely Used Measures of Overconfidence Are Confounded with Ability", "url": "https://doi.org/10.1287/mnsc.2024.05184", "authors": "Stephen A. Spiller", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "過信の測定によく使われる複数の方法が、能力と交絡していることを解析的に示した。成績は能力の不完全な指標であり、自己評価は成績だけでなく能力についての事前の信念も反映するためである。公表済みのデータの再分析では、過信の指標がその後の成績を予測し、過信の指標が能力の信号になっていることと整合した。"}, {"id": "jn06", "rank": 6, "field": "心理学・認知科学", "headline": "漁撈の文化は絆の強さとよそ者への開放性を併せ持つ", "title": "Sea-fishing cultures show rare blend of tight social ties and openness to strangers", "url": "https://doi.org/10.1073/pnas.2536327123", "authors": "An Huang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "海の漁業を生業としてきた地域の文化を、日本の近接する地域の1,010人の比較、現代の150か国、世界の1,265の民族集団の歴史記録で調べた。漁業地域の人は包括的に考え、身近な関係での責任を重んじる（文化水準の効果量d=0.91）一方、内集団への忠誠と外集団への差別は弱い（d=1.37）。個人主義と集団主義の二分法に収まらない型を示す。"}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "輸入依存の非対称が国家間の「力」になる", "title": "International Power", "url": "https://doi.org/10.1093/qje/qjag061", "authors": "Ernest Liu ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-23", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "貿易から生じる国家間の力を、二国間の輸入依存の非対称を産業の貿易弾力性の逆数で重みづけた指標として、過去20年の国の組について作った。この力が高まると、貿易を止めるという脅しの信頼性が上がり、二国間の関与と交渉が増える。地政学的な関係が悪化すると、将来の紛争を見越して貿易を調整し、力を高める動きが見られる。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "調査実験の標本抽出と割り当てを細かく層別する", "title": "Fine Stratification of Survey Experiments", "url": "https://doi.org/10.1093/restud/rdag131", "authors": "Max Cytrynbaum", "venue": "Review of Economic Studies", "date": "2026-11-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "対象者の集団から代表的な参加者を抽出し、次に処置を割り当てる2段階の実験で、両方の段階にk個組のマッチングによる無作為化を使う設計を調べた。任意のkと共変量の次元でk個組を作る高速なアルゴリズムを開発し、最近の実験論文200本の約48%で多変量の細かい層別が新たに可能になると見積もる。両段階の効率の向上を反映した推測の方法も示す。"}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "指数を売るESG評価会社は株価の良い企業に甘い", "title": "Environmental, Social, and Governance Ratings of Environmental, Social, and Governance Index Providers", "url": "https://doi.org/10.2308/tar-2023-0522", "authors": "Sonakshi Agrawal ほか", "venue": "The Accounting Review", "date": "2026-11-24", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "ESG評価会社が評価を出すだけでなく、ESG指数を作って販売していることに注目した。同じ企業に対する評価会社間の評価を比べることで、実際のESGの成果を統制している。指数の使用料の誘因が強い評価会社は、株価の成績が良い企業に高い評価を付ける傾向があり、この関連は指数の対象になりうる企業に集中していた。"}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "皆が苦しい超インフレ下では困窮しても努力が続く", "title": "Maintaining Effort Amid Shared Adversity: How Hyperinflation Alters the Motivational Influence of Economic Hardship", "url": "https://doi.org/10.1111/peps.70049", "authors": "John M. Schaubroeck ほか", "venue": "Personnel Psychology", "date": "2026-11-26", "sjr": 5.41, "citescore": 14.8, "citescore_year": "2025", "why": "経済的な困窮は仕事の努力を下げるとされるが、社会全体で共有される超インフレのもとでは努力が維持されると論じた。トルコの医療機関での9週間の調査と2つの実験で、超インフレの条件では困窮の悪化が努力を下げず、視点取得の高い人は努力を増やした。超インフレでない条件では困窮が努力を損なった。"}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "従業員代表のいる企業ほど管理職を内部から登用", "title": "Democratic Organizing and Contemporary Managerial Talent Markets: Internal Promotion or External Hiring?", "url": "https://doi.org/10.1287/orsc.2024.19538", "authors": "Aleksandra Gregoric ほか", "venue": "Organization Science", "date": "2026-11-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "デンマークの2001〜2017年の雇用主と従業員を結んだ縦断データで、取締役会に従業員代表がいる企業は、そうでない企業より管理職を外部採用ではなく内部昇進で埋める傾向が強いことを示した。この関連は、従業員代表が社内の経験が広く昇進に関わる情報を持つ場合などで強い。"}, {"id": "jn12", "rank": 12, "field": "地球科学", "headline": "地震の破壊は「禁じられた」速度域を通過できる", "title": "Breakdown of the classical rupture theory and earthquake propagation in the “forbidden” super-Rayleigh range", "url": "https://doi.org/10.1073/pnas.2631141123", "authors": "Anna Pomyalov ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-25", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "せん断波より速く伝わる地震は、レイリー波速度以下の領域から超せん断の領域へ不連続に飛ぶと考えられ、その間の速度域は古典的な破壊理論で禁じられてきた。断層の摩擦がすべり速度に依存することを取り入れた破壊理論を作り、数値計算と照合した。レイリー波速度のごく近くでは摩擦の速度依存の非線形性により、破壊が禁じられた速度域を連続的に通って超せん断へ移ることを示す。"}, {"id": "jn13", "rank": 13, "field": "機械学習", "headline": "強化学習で拡散モデルを目的の材料へ導く", "title": "Accelerating inverse materials design using generative diffusion models with reinforcement learning", "url": "https://doi.org/10.1038/s42256-026-01334-5", "authors": "Junwu Chen ほか", "venue": "Nature Machine Intelligence", "date": "2026-11-26", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "why": "結晶構造を生成する拡散モデルを、目的の物性に向けて強化学習で最適化する手法を示した。ノイズ除去を多段階の意思決定とみなし、報酬で重みづけたKL正則化つきの方策勾配、経験の再利用、多様性のフィルタを使う。単一の目的では60回の反復（約1,000回の物性評価）以内に目標値へ収束し、供給リスクの低い磁石など相反する性質の設計にも成功した。"}, {"id": "jn14", "rank": 14, "field": "工学", "headline": "順位づけは完璧でも警報は1件も鳴らない検知器", "title": "Perfect Ranking, Missed Alarms: Calibrating a Leakage‐Resistant Autoencoder for Multifrequency Guided‐Wave Corrosion Monitoring", "url": "https://doi.org/10.1155/stc/6837078", "authors": "Ebtisam Abdullah Alabdulqader ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-26", "citescore": 10.3, "citescore_year": "2025", "why": "超音波ガイド波による腐食の監視で、検知器の得点が健全と損傷を分ける能力と、事前に固定したしきい値で警報を出す能力が一致するかを、公開の配管データ（236回の計測）を時系列順に分けて調べた。健全データだけで学習した自己符号化器は順位づけが完璧（ROC-AUC=1.000）だったが、検証データで決めたしきい値では損傷を1件も検出できなかった。"}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "金融引き締めは労働供給を増やし雇用減を和らげる", "title": "The Labor Demand and Labor Supply Channels of Monetary Policy", "url": "https://doi.org/10.1093/restud/rdag132", "authors": "Sebastian Graves ほか", "venue": "Review of Economic Studies", "date": "2026-11-24", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "FOMCの発表や議長の講演の前後の金利の変化を使い、金融政策への労働市場のフローの反応を推定した。引き締めの衝撃のあと、労働者は職を辞めて非就業になる率を下げ、非就業の人は求職を増やす。この供給側の反応がなければ、雇用の減少は2倍になっていた。摩擦のある労働市場をもつ異質な個人のモデルで、この結果を説明する。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "犯罪統計の操作を難しくすると虚偽報告が増えうる", "title": "Juking the Stats: Policing, Misreporting, and Policy Evaluation", "url": "https://doi.org/10.1093/restud/rdag130", "authors": "Michael Gibilisco ほか", "venue": "Review of Economic Studies", "date": "2026-11-25", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "犯罪と犯罪の報告をゲーム理論でモデル化し、犯罪統計の質を分析した。取り締まる側は評判を気にして結果を偽って報告しうる。複数の均衡が存在し、過少報告と過大報告が起きる条件を示す。データ操作の費用を上げると、かえって虚偽報告が増える場合がある。政策の効果は、報告された統計と真の統計で一致しない。"}, {"id": "jn17", "rank": 17, "field": "心理学・認知科学", "headline": "人間関係の勘違いは将来の関係を言い当てている", "title": "Errors in social network knowledge predict how ties evolve in the future", "url": "https://doi.org/10.1126/sciadv.aeh9321", "authors": "Alice Xia ほか", "venue": "Science Advances", "date": "2026-11-25", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "誰と誰が友人かについての人の誤りは、認知の限界ではなく、ネットワークの将来を見越す予測の表れであることを示した。196人の実際の社会ネットワークを1年間追跡すると、その時点では誤りだった判断が、6か月後までに生じる関係や消える関係を当てていた。誤りは関係の形成を偶然の約3倍、消滅を1.2倍超の水準で予測した。"}, {"id": "jn18", "rank": 18, "field": "地球科学", "headline": "山火事が頻繁すぎると土石流はむしろ小さくなる", "title": "Historical evidence that wildfire frequency modulates debris-flow hazards through sediment-supply limitation", "url": "https://doi.org/10.1126/sciadv.aei6617", "authors": "Emily C. Geyman ほか", "venue": "Science Advances", "date": "2026-11-25", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "南カリフォルニアの砂防施設の長期の堆積記録から、山火事の頻度と火災後の侵食の関係を調べた。急な流域では火災後3年間の侵食が平常の約17倍に達するが、火災がこの1世紀に典型的だった約30年の間隔より頻繁に起きると、土石流の量は減っていた。運ばれる土砂の供給が追いつかなくなるためと解釈される。"}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "少数派の性で入職した新人は負の出来事が増えていく", "title": "Breaking Gender Norms: A Dynamic Perspective on Entering Gender-Atypical Occupations", "url": "https://doi.org/10.1177/01492063261506258", "authors": "Sophie Schellhammer ほか", "venue": "Journal of Management", "date": "2026-11-25", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "88職種の新人673人を入職後12週間にわたって繰り返し調べた。自分の性が少数派である職種に入った新人は、否定的な職場の出来事を経験する頻度が時間とともに増え、その傾向は女性の多い職種に入った男性で、男性の多い職種に入った女性より強かった。出来事の増え方が急なほど、仕事の習熟が低く離職意向が高い。"}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "冷房のない刑務所では夏に新人刑務官の離職が増える", "title": "Excessive Heat and Correctional Officer Turnover: Evidence From Texas", "url": "https://doi.org/10.1111/puar.70233", "authors": "Benjamin Goehring ほか", "venue": "Public Administration Review", "date": "2026-11-25", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "why": "テキサス州の刑務所68か所・約6万人の職員の2010〜2023年の人事記録で、冷房のない職場で夏に働くことが離職に与える影響を調べた。経験の浅い現場職員では、冷房の有無による離職確率の差が最も暑い月に0.33ポイント大きく、基準の離職率の約12%に当たる。冷房の設置は、人手不足への対策として賃上げと同程度の費用だと試算する。"}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "説明のつかない株価変動が投資家の情報収集を呼ぶ", "title": "Rational Information Acquisition Screens", "url": "https://doi.org/10.2308/tar-2024-0799", "authors": "Paul E. Fischer ほか", "venue": "The Accounting Review", "date": "2026-11-24", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "why": "投資家は私的情報を集める前に、その見返りが分からない。過去の株価を含む公開情報を、情報収集の見返りを見積もるふるいとして使うというモデルを作り、説明のつかない価格変動が大きいほど私的情報の収集、将来の価格変動、取引量が増えると予測した。EDGARとBloombergでの情報の取得を測った細かいデータが予測を支持する。"}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "価値観が似ると集団の規範を守りやすくなる", "title": "Determinants of Norm Compliance: Moral Similarity and Group Identification", "url": "https://doi.org/10.1287/mnsc.2024.08000", "authors": "Alexander Schneeberger ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "個人と集団の成員の価値観の類似を実験で操作し、集団への同一視と規則の順守を測った。進歩主義についての道徳的な類似は集団への同一視を高め、同一視は集団の規則の順守を高めうる。条件間で社会規範そのものは変わらない設計のため、行動の変化は規範への感度の変化によると解釈できる。ただし、この関係は崩れることもある。"}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "価格弾力性を1分以内に更新して即時の価格決定へ", "title": "Scalable Just-in-Time Price Elasticity Estimation", "url": "https://doi.org/10.1287/mnsc.2024.04791", "authors": "Jingbo Wang ほか", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "価格の内生性を補正しつつ、点ごとの価格弾力性をノンパラメトリックに推定する方法を示した。制御関数で因果的な弾力性の識別を一連の予測課題に分解し、閉じた形をもつバギングした最近傍法で実装する。ニューヨーク市の配車市場に適用し、時間と場所による弾力性の違いを捉え、市全体の推定を1分以内に更新した。"}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "大規模な資産の共分散行列を要素ごとに学習する", "title": "Machine Learning Vast Dynamic Conditional Covariance Matrices: The Spirit of “Divide and Conquer”", "url": "https://doi.org/10.1287/mnsc.2024.08930", "authors": "Zhoufan Zhu ほか", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "多数の資産の動的な条件つき共分散行列を、分割統治の考え方で推定する方法を提案した。資産の特徴からグラフに基づく深層学習で収益の条件つき分位点を学び、そこから分散と共分散を要素ごとに求め、射影で半正定値にする。中国の株式市場で、既存の方法より良い接点ポートフォリオが得られたと報告する。"}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "環境の変化が急か緩やかかで起業家の期待が変わる", "title": "External Enablement Across Types of Environmental Change: Experimental Evidence on Onset Variance Effects", "url": "https://doi.org/10.1177/10422587261496319", "authors": "Jiyoung Kim ほか", "venue": "Entrepreneurship Theory and Practice", "date": "2026-11-26", "sjr": 5.67, "citescore": 21.9, "citescore_year": "2025", "why": "マクロ環境の変化が起業を後押しするという枠組みについて、被験者間実験と発話思考法を組み合わせて検証した。変化が徐々に起きるか急激に起きるかという違いが、後押しへの期待に影響し、その影響は変化の種類をまたいで同様だった。"}, {"id": "jn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "旧技術の取引網での仲介がEV参入を助ける", "title": "Embedded in Two Worlds: How Incumbents’ Brokerage Affects Adaptation When Old and New Supply Networks Coexist", "url": "https://doi.org/10.1287/orsc.2024.18580", "authors": "Jongyoun Baek ほか", "venue": "Organization Science", "date": "2026-11-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "既存企業が新技術の市場に入るとき、旧技術と新技術の2つの供給網に同時に埋め込まれる。2012〜2022年の米国の自動車産業で、旧技術の供給網で仲介の位置にある企業ほど、電気自動車のモデル数と成績で見た新技術への参入に成功していた。意外にも、旧技術の網での仲介のほうが新技術の網での仲介より効果が強かった。"}, {"id": "jn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "仕事での近しさが育つ条件を理論化", "title": "Interaction zones theory: How social proximity emerges and shapes thriving at work", "url": "https://doi.org/10.1177/00187267261506540", "authors": "Tom L. Junker ほか", "venue": "Human Relations", "date": "2026-11-25", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "仕事のデジタル化が人どうしの近しさを損なう懸念を背景に、職場のやり取りから親密さが生まれる仕組みを説明する理論を提案した。関係上の重みと、やり取りのしやすさという2つの次元の交点を「社会的近接の領域」と呼び、そこでの共有された繰り返しのやり取りが個人とチームの活力につながると論じる。文献の検討に基づく理論論文である。"}, {"id": "jn28", "rank": 28, "field": "オペレーションズ・リサーチ", "headline": "広告の予算調整の均衡は入札方式で解きやすさが違う", "title": "Throttling Equilibria in Auction Markets", "url": "https://doi.org/10.1287/opre.2023.0008", "authors": "Xi Chen ほか", "venue": "Operations Research", "date": "2026-11-26", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "ネット広告の競売で、広告主の参加確率を調整して予算を均等に使わせる方式を、全員が同時に使う場合の均衡を分析した。第一価格の競売では均衡が一意で、分散的な調整で効率よく計算できる。第二価格では均衡は存在するが、近似的な均衡を求めることもPPAD完全で、収入を最大にする均衡を見つけるのはNP困難である。"}, {"id": "jn29", "rank": 29, "field": "オペレーションズ・リサーチ", "headline": "処理能力に上限のある資源への逐次割り当て", "title": "Online Allocation of Throughput-Constrained Resources Using Proxy Assignments", "url": "https://doi.org/10.1287/msom.2025.0811", "authors": "Chamsi Hssaine ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-26", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "到着する仕事を複数の資源に順に割り当てる問題で、資源が予算ではなく時間とともに変わる処理能力の目標に縛られる場合を扱った。従来の予算制約向けの算法を素直に拡張すると大きく失敗することを示し、現在の到着を使って割り当てを模擬する主双対の算法を提案する。"}, {"id": "jn30", "rank": 30, "field": "オペレーションズ・リサーチ", "headline": "寄付の税優遇は中途半端だと消費者の得を減らす", "title": "Tax-induced Corporate In-kind Donations: Equilibrium Analysis and Policy Design", "url": "https://doi.org/10.1287/msom.2025.0617", "authors": "Lusheng Shao ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-26", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "食品企業の現物寄付を促す税制優遇が、企業の生産と寄付、利益、消費者余剰に与える影響を解析モデルで調べた。優遇率がしきい値を超えると企業は寄付を始める。企業は優遇が手厚いほど得をするが、消費者余剰は優遇率に対してU字型で、中程度の優遇は消費者余剰を下げうる。"}, {"id": "jn31", "rank": 31, "field": "オペレーションズ・リサーチ", "headline": "LLMが書いた文章をマハラノビス距離で見分ける", "title": "Efficient and Flexible Large Language Model–Generated Content Detection", "url": "https://doi.org/10.1287/ijoc.2024.0877", "authors": "Wan Tian ほか", "venue": "INFORMS Journal on Computing", "date": "2026-11-24", "sjr": 1.974, "citescore": 6.6, "citescore_year": "2025", "why": "LLMが生成した文章の検出に、マハラノビス距離に基づく信頼度の得点を判別の特徴として使う方法を提案した。複数の分割に対応する精度行列を正則化つきで同時に推定し、推定量のスパース性と一致性、検出問題の超過リスクの最適な上界を示す。人とChatGPTの文章を比べた公開コーパスで有効性を確かめた。"}, {"id": "jn32", "rank": 32, "field": "心理学・認知科学", "headline": "気分の揺れを短い雑音と長い変動に分けて測る", "title": "Evaluating the Ecological Validity and Mechanism of a Generative Model-Based Decomposition of Affective     "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
