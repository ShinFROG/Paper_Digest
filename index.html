門家協議で、候補となる因果機構を体系的に列挙している。", "explain": {"basis": "抄録", "basis_note": "PsyArXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "思春期の経済的な困窮が精神的健康に至る候補となる因果機構を、媒介研究の系統的な探索と専門家協議で洗い出した（抄録）。", "p3": "思春期についての説明理論は、経済的な状況が養育行動や家族が子に提供できる資源に及ぼす役割にほぼ限られてきた。媒介研究の系統的な検索と専門家協議により、経済的な状況が不安や抑うつといった内在化する精神的健康の帰結に影響しうる候補の因果機構を提案する（抄録）。", "p5": "同定された候補の機構のほとんどは、これまでの思春期に特化した健康格差の理論で考慮されておらず、多くは媒介研究の中で経験的に検討されてもいない。著者はこれを、経済的な状況が影響する過程についての現在の認識に明確な限界があることの表れだと述べる（抄録）。", "fun": "貧しい家庭の子どもは心の健康を損ないやすい。この関連は繰り返し示されてきたのに、理由の説明は「親の育て方」と「家庭で買えるもの」にほぼ限られていた。この研究は文献と専門家から候補の経路を集め、そのほとんどが理論に入っていないし検証もされていないと示す。説明が尽きていないことを明示するのも研究の仕事である。", "unverified": "同定された機構の一覧、検索の範囲と専門家の人数。本文が入手できず確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "心理学・認知科学", "headline": "自律を守れば認知の尊厳は守れるのか", "title": "Can Interaction with AI Affect Cognitive Dignity Without Undermining Autonomy? Material Cognitive Substitution, Human Understanding and the Limits of Consent", "url": "https://doi.org/10.2139/ssrn.7593007", "authors": "Alejandro Sinopoli", "venue": "SSRN", "date": "2026-10-12", "apa": "Sinopoli, A. (2026). Can Interaction with AI Affect Cognitive Dignity Without Undermining Autonomy? Material Cognitive Substitution, Human Understanding and the Limits of Consent. https://doi.org/10.2139/ssrn.7593007", "why": "生成AIとの相互作用が提起する規範的な問いは自律の保護だけでは尽きないと論じ、物質的な認知の代替、人間の理解、同意の限界という観点を立てている。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。哲学・規範理論の論文であり実証ではない", "preprint": true, "short": true, "p1": "生成AIへの思考の委託が、自律を損なわなくても「認知的な尊厳」の問題を残しうるという規範的な仮説を立てた（抄録）。", "p3": "判断能力があり、十分に情報を得ており、操作されていない成人が、問題の枠づけ・理由の比較・証拠の統合・判断の改訂といった活動を体系的にAIに委ねる場合を考える。このとき自律・能力・同意・精神的なプライバシー・操作という古典的な範疇のどれも侵害を記録しないのに、認知的な尊厳の問題が残りうると論じる。これは認められた権利としてではなく、暫定的な規範的仮説として提示される（抄録）。", "p5": "論文は、問題に収斂する諸伝統（カント的な尊厳、反パターナリズムの自由主義、ニューロライツ、理解の認識論、拡張された心、自動化の人間工学、AIガバナンス）を再構成し、自律・行為者性・能力・著者性・認知的プライバシー・認知的尊厳を区別する。その先の議論は抄録が途中で切れており未確認（抄録）。", "fun": "AIに考えさせても、本人が納得して頼んでいるなら問題ないように見える。この論文はそこに引っかかる。問題の立て方や理由の比べ方まで全部任せてしまうと、自律は守られているのに「自分で理解する」という営みが失われるのではないか。権利の侵害として数えられないものを、それでも損失と呼べるか。倫理学が言葉を持たない領域を名づけようという試みである。", "unverified": "論証の後半（結論と提案）。抄録が途中で切れており確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "税務申告の公開が報告バイアスを縮める", "title": "The effect of the mandatory disclosure of corporate tax returns on reporting bias", "url": "https://doi.org/10.1111/1475-679x.70087", "authors": "ERIC J. ALLEN ほか", "venue": "Journal of Accounting Research", "date": "2026-10-12", "sjr": 9.774, "citescore": 13.4, "citescore_year": "2025", "apa": "ALLEN, E. J., FRIEDMAN, H. L., & UYSAL, A. (2026). The effect of the mandatory disclosure of corporate tax returns on reporting bias. Journal of Accounting Research. https://doi.org/10.1111/1475-679x.70087", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "税務申告の公開義務が、経営者の財務報告と税務報告のバイアスをどう変えるかを、構造モデルの推定で分けて測れるようになった（抄録）。", "p2": "投資家が税務情報の公開にどう反応するかが経営者の報告選択に跳ね返る経路は、観察される報告だけからは読み取れない。公開前後の比較では、投資家の不確実性の変化と経営者の誘因の変化を区別できない（抄録）。", "p3": "報告バイアスの構造モデルを立て、トルコで2009年から税務申告の公開が義務づけられた企業のデータで検定する。構造モデルを使うと、観察される報告の水準から、投資家の企業価値についての不確実性と、利益を操作する市場からの誘因という別々の要素を取り出せる（抄録）。", "p4": "データはトルコ企業の、税務申告が公開された期間を含む固有のデータセットである。評価は、会計上の利益と税務上の利益の双方が投資家にとって情報価値を持つか、そして構造推定が示す誘因と不確実性の変化の向きで行う。さらに反実仮想として、会計と税務の報告基準をそろえた場合（book-tax conformity）を計算する（抄録）。", "p5": "抄録の報告では、会計上の利益と税務上の利益の両方が投資家にとって情報価値を持つ。構造推定は、税務報告の公開が、会計利益を操作する市場からの誘因と、投資家の企業価値についての不確実性の両方を下げることと整合的である。税務上の報告利益は公開と関連して高くなるが、その増加は統計的に有意ではない。反実仮想の推定は、会計と税務の基準をそろえると財務・税務の報告バイアスは変わりうるが、両者を別に開示する場合に比べて情報環境の質は下がることを示す（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。トルコという1国の制度に固有のデータであり、他国の税制・開示制度に移せるかは残る疑問である。", "fun": "税金の申告書を公開させると、企業は正直になるだろうか。この研究が面白いのは、公開が「税務の正直さ」ではなく「会計のごまかしの動機」を下げたと読み解いたところだ。税務情報という別の物差しが外から見えるようになると、会計利益をいじっても投資家にばれやすい。だから操作する意味が薄れる。しかも、だったら会計と税務の基準をそろえればいいかというと、反実仮想では情報環境の質が下がる。2つの別の物差しがあることに価値がある。", "unverified": "標本の企業数と期間、構造推定の係数と標準誤差、情報環境の質を測る指標の定義。本文が入手できず確認できなかった。"}}, {"id": "jr02", "rank": 2, "headline": "多枠組みの会話コーディングをAIで自動化", "title": "An agentic AI system for multi-framework communication coding", "url": "https://doi.org/10.1038/s41746-026-03314-w", "authors": "Bohao Yang ほか", "venue": "npj Digital Medicine", "date": "2026-10-12", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "apa": "Yang, B., Yang, R., Biro, J. M., Wang, H., Handley, J. L., Richardson, B. N., Bessias, S., Economou-Zavlanos, N., Bedoya, A. D., Agrawal, M., Zavlanos, M. M., Chowdhury, A., Ratwani, R. M., Sun, K., Pollak, K. I., Pencina, M. J., & Hong, C. (2026). An agentic AI system for multi-framework communication coding. Npj Digital Medicine. https://doi.org/10.1038/s41746-026-03314-w", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、候補収集時にCrossrefから取得した出版版（npj Digital Medicine）の抄録を読んだ。原文ファイルに収まったSemantic Scholar由来の抄録は別版（数値と構成が異なる）で、下記は出版版の記述による", "preprint": false, "p1": "患者と医療者の会話を、複数のコミュニケーション枠組みに同時に当てはめて、人間のコーダーに近い精度で大規模に符号化できるようになった（抄録）。", "p2": "会話の注釈づけは手間がかかり一貫性も保ちにくい。既存のLLMベースの方法は単一課題の系が多く、枠組みや臨床領域をまたぐと頑健性が落ちる（抄録）。", "p3": "MOSAIC（Multi-framework Structured Agentic AI system for scalable Clinical Communication coding）は3つを組み合わせる。入力に応じて例示を選ぶ動的なフューショットプロンプト、検索拡張生成（RAG）、そして計画・注釈・検証の3役をLangGraphで並べた多エージェントのワークフローである。要点は、注釈を出すだけでなく別の工程で検証させる点で、単一の推論で決めないことが枠組み横断の頑健性につながるという設計である（抄録）。", "p4": "訓練された人間コーダーによる標準解を基準とする。候補収集時にCrossrefから取得した出版版（npj Digital Medicine、DOI 10.1038/s41746-026-03314-w）の抄録によれば、開発に54件の書き起こし、評価に120件を使い、評価対象はリウマチ科と産婦人科の2領域にまたがる。評価指標は重み付きF1である（出版版の抄録。本文で照合できておらず未確認）。", "p5": "同じ出版版の抄録の報告では、評価集合全体で重み付きF1が95.6%、領域別ではリウマチ科が最も高く95.9%、カテゴリ別では偏り（bias）が96.4%、患者の行動が96.1%で最も高い。ただし原文ファイルに収まった別版（Semantic Scholar由来）の抄録は、訓練26件・評価50件でF1 0.928、リウマチ科0.962という異なる値を報告する。どちらが最終の数値かは本文を入手できず照合できていないため、いずれの数値も未確認として扱う。", "p6": "著者が認める限界は抄録に明示されていない。2領域に限られるため他の診療科や言語への一般化は残る疑問である。また標準解を作った人間コーダー間の一致度が抄録に示されておらず、F1の値を人間同士のばらつきと比べられない。", "fun": "医師と患者の会話を研究するには、まず「この発言は共感か、情報提供か」と一つ一つ分類する必要があり、人手では大量にはできない。この研究の工夫は、AIに一発で答えさせず、計画する役・注釈する役・検証する役に分けて回したところ。人間のチームの分業をそのまま真似た形である。しかも理論の枠組みが複数あっても同時に当てはめられる。同じ会話を違う物差しで測り直せるのは、研究の自由度としてかなり大きい。", "unverified": "数値（開発54件・評価120件、重み付きF1 95.6%、リウマチ科95.9%、偏り96.4%、患者の行動96.1%）は出版版（npj Digital Medicine）の抄録の記載による。原文ファイルに収まったSemantic Scholar版の抄録は訓練26件・評価50件、F1 0.928、リウマチ科0.962、エージェント4役と異なる値を報告しており、本文が入手できずどちらが最終かを照合できなかった。人間コーダー間の一致度とカテゴリ総数も未確認。"}}, {"id": "jr03", "rank": 3, "headline": "棒状粒子の高濃度懸濁液を粒子法で再現", "title": "Rheology of dense suspensions of granular spherocylinders by particle-based simulation", "url": "https://doi.org/10.1017/jfm.2026.12132", "authors": "Alex Dixon ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-12", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Dixon, A., Hone, J. H. E., Melaugh, G., & Ness, C. (2026). Rheology of dense suspensions of granular spherocylinders by particle-based simulation. Journal of Fluid Mechanics, 1044. https://doi.org/10.1017/jfm.2026.12132", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Cambridge Core）のHTML本文を読んだ。シミュレーション手法（§2.1–2.4）、結果（§3.1–3.2、図3〜6）、結論（§4）を参照した", "preprint": false, "p1": "棒状の粒子が高濃度で詰まった懸濁液のせん断粘度と微細構造を、粒子1本ずつの運動を追う計算で予測できるようになった（§2、§4）。", "p2": "棒状粒子の高濃度懸濁液は自然界と製造の双方に広く現れ、その流体力学的性質が決定的に重要な場面が多い。しかし球の懸濁液には確立した粒子ベースの道具があるのに、棒状粒子では潤滑力の計算に不連続が残り、実験データも限られていた（§1、§4）。", "p3": "入力は固体体積分率φと粒子のアスペクト比A、出力は粘度と微細構造である。スフェロシリンダー（両端が半球の円柱）の軌跡を、短距離の摩擦接触と流体力の作用のもとで追う。手法上の新しさは2つで、スフェロシリンダー間の潤滑力の計算（従来の不連続を解消）と、時間刻みを動的に決める方式である（§2.3.3、§4）。整列の度合いは秩序パラメータSで測り、主軸と流れ方向のなす角を流れ-渦度面と流れ-勾配面への射影で2つの角度として報告する（§3.2）。", "p4": "アスペクト比A={1, 5, 10, 15, 20}を計算し、A=1は等価な物理を持つ球のみのモデルで別に求める。各アスペクト比について、φ=0.01からジャミング点に近づく十分高い値までの範囲を調べる。評価は、過渡および定常の粘度と、大ひずみ後の秩序パラメータで行い、入手できる限られた実験のレオロジーデータと照合する（§3.1、図3・図4）。", "p5": "アスペクト比20までで、せん断開始時に粘度のスパイクが現れ、その後の定常粘度は体積分率とアスペクト比とともに系統的に増える（図4）。粘度が発散するジャミング点φ_mは、A=5から20の範囲でアスペクト比が上がるほど下がり、これは実験の観察と整合する。整列については、流れ方向への整列が体積分率とともに増えるが、ある閾値の体積分率を超えるとわずかに減る現象が、どのアスペクト比でも見られる（§3.2、図6）。", "p6": "著者は結論で、今後の課題として粒子間摩擦係数が粘度と微細構造に与える効果、半径とアスペクト比の双方の多分散性の役割、ジャミング転移近傍の挙動とその整列への依存を挙げる（§4）。圧力を課した流れや非線形の速度・応力分布など他の流れ形式への拡張も未着手である。", "fun": "細長い棒を水に大量に混ぜると、途中からとたんに流れなくなる。砂や米粒でも起きる「詰まる」現象だが、棒の場合は向きがそろうという余地があるので話が複雑になる。この研究で意外なのは、濃くしていくと棒はどんどん流れ方向にそろうのに、ある濃さを超えると少し乱れること。そろえば流れやすいはずなのに、詰まりに近づくと逆のことが起きる。アスペクト比が大きい（細長い）ほど、詰まり始める濃度は低くなる。", "unverified": "ジャミング点φ_mの具体的な数値、整列が減り始める閾値の体積分率、粘度スパイクの大きさは、本文の図から数値として読み取れなかった。"}}, {"id": "jr04", "rank": 4, "headline": "英国100万社でみた公的融資の効き方", "title": "Ownership, Diversity and the Effectiveness of Government‐backed Financial Support during a Systemic Crisis: Evidence from One Million UK SMEs", "url": "https://doi.org/10.1111/1467-8551.70114", "authors": "Ahmed Barakat ほか", "venue": "British Journal of Management", "date": "2026-10-12", "sjr": 2.694, "citescore": 12.4, "citescore_year": "2025", "apa": "Barakat, A., Duygun, M., Fiaschetti, M., Gerba, E., Han, T., Onali, E., Sabri, A., Tsionas, M., & Wang, H. (2026). Ownership, Diversity and the Effectiveness of Government‐backed Financial Support during a Systemic Crisis: Evidence from One Million UK SMEs. British Journal of Management. https://doi.org/10.1111/1467-8551.70114", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "中小企業が危機時の公的保証付き融資という「余裕」をどう使うかが、所有構造と取締役の多様性で変わることを、over one million（抄録の表記）の企業で示せるようになった（抄録）。", "p2": "公的な資金が企業の財務的な強靭さにつながるのか、それとも債務不履行のリスクを高めるのかは、企業の内部条件によって分かれるはずである。しかしその条件を大規模データで切り分けた研究が乏しかった（抄録）。", "p3": "行動理論（Behavioural Theory of the Firm）と注意ベース視点（Attention-Based View）から、「注意ベースのガバナンス（ABG）」という概念を立てる。経営者の注意がどこに向くかで、公的保証付きの余裕の使い方が決まるという枠組みである。入力は所有構造（同族の複数所有、国内機関投資家、外国機関投資家）と取締役の多様性（女性取締役、外国人取締役）、出力は通常（非コロナ）融資の債務不履行である（抄録）。", "p4": "データは2017年から2024年の英国の中小企業 over one million 社の専有データ。評価の軸は、コロナ対応の公的保証付き融資プログラムが通常融資の不履行に与える影響を、所有構造と取締役の多様性が条件づけるかどうかである。補助的に、保証付きのコロナ融資そのものの不履行も見る（抄録）。", "p5": "抄録の報告では、同族で複数の所有者を持つ企業は単独所有の企業よりコロナ支援の管理が有効で、内部の集団的な監視と規律が強いことを示すとされる。国内機関投資家と女性取締役を持つ企業も能力と規律が強い一方、外国機関投資家や外国人取締役を持つ企業は通常融資の不履行リスクが高い。さらに、外国資本の企業は保証付きのコロナ融資そのものについては最も不履行になりにくい。著者はこれを、公的に保証された目立つ債務に経営者の注意が選択的に向き、国際的な利害関係者に対する評判資本を守る動きとして解釈している（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。所有構造は企業が選ぶものであり、観察される関連を因果として読めるかは残る疑問である。", "fun": "コロナのとき各国は中小企業に政府保証付きの融資を出した。この研究が見たのは、そのお金をうまく使えた企業と、かえって他の借金を返せなくなった企業の違いである。興味深いのは外国資本の企業の振る舞いで、政府保証付きの融資だけはきちんと返し、保証のない普通の融資では滞りやすい。目立つ借金は守り、目立たない借金は後回しになる。経営者の注意という限られた資源が、どこに向けられるかが数字に出ている。", "unverified": "抄録は企業数を over one million とだけ記しており、正確な数は確認できなかった。推定モデルの係数と標準誤差、不履行の定義も本文が入手できず確認できなかった。"}}, {"id": "jr05", "rank": 5, "headline": "発散・反省・収束でLLMの偏りを抑える", "title": "Toward fairer large language models: a divergence-reflection-convergence framework for mitigating cognitive bias", "url": "https://doi.org/10.1108/intr-10-2025-1717", "authors": "Wei Liu ほか", "venue": "Internet Research", "date": "2026-10-12", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Liu, W., & Zhang, Y. (2026). Toward fairer large language models: a divergence-reflection-convergence framework for mitigating cognitive bias. Internet Research, 1–23. https://doi.org/10.1108/intr-10-2025-1717", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "LLMの認知バイアスを、再学習なしの推論時の手続きだけで下げられるようになり、主観的な文脈での偏りを測る指標も用意された（抄録）。", "p2": "LLMの認知バイアスは信頼性を損なうが、既存の緩和法は再学習を要するなど実務上の制約が大きい。また主観的な判断を含む文脈でのバイアスを測る指標も十分でなかった（抄録）。", "p3": "発散・反省・収束（divergence-reflection-convergence, DRC）の3段階の枠組みを提案する。モデルがまず発散的な複数の視点を生成し、次にそれらを振り返って判断規則を抽出し、最後に頑健な出力に収束する。競合的な推論の過程を推論時に通すだけで、再学習のコストをかけずに偏りを識別して抑える（抄録）。", "p4": "5つの主要なLLMで、認知バイアスの4つの一般的な次元について検証する。評価指標は非対称カッパ（asymmetric kappa, AK）と全変動距離（total variation distance, TVD）である。AKは主観的な文脈でのLLMのバイアスを定量化するために本研究が提案したより精緻な指標である（抄録）。", "p5": "抄録の報告では、DRC枠組みで洗練されたLLMはすべてのシナリオでより一貫し信頼できる出力を出す。効果は外部由来のバイアスより内部由来のバイアスでより顕著で、著者はこれをモデルの内部の誤ったヒューリスティクスを正すのに有効だと解釈している。指標でみると、DRCは負またはゼロ近傍のAKをすべて正の値に変え、TVDを大きく下げる。いずれもバイアスの実質的な減少を意味する（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。4つのバイアス次元と5モデルという範囲で、推論時に複数回生成するぶんの計算コストが抄録に示されていないのも残る疑問である。", "fun": "AIの判断に偏りがあるとき、ふつうは学習をやり直して直そうとする。これは費用が大きい。この研究は、答える前に「いろいろな立場で考えてみて、それを見比べ、そこから判断の規則を取り出す」という手順を踏ませるだけで偏りを下げた。人が結論を急がず一度立ち止まるのに似ている。効果が大きかったのは、外から与えられた偏りより、モデルが内側に持っている思い込みのほうだった点も示唆的である。", "unverified": "4つのバイアス次元の内容、5モデルの名前、AKとTVDの具体的な数値。本文が入手できず確認できなかった。"}}, {"id": "jr06", "rank": 6, "headline": "電子カルテから介護者を見つけ出す", "title": "Caregivers in a Haystack? Informatics‐Driven Clinical Trial Enrollment of Dementia Caregivers at Medical Visits", "url": "https://doi.org/10.1111/jgs.70783", "authors": "Eva S. Ren ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-10-12", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "apa": "Ren, E. S., Makelarski, J. A., Romanchick, D. A., Anand, V., Winslow, V. A., Abramsohn, E. M., De Ornelas, M., Huang, E. S., Thompson, K., Borson, S., Johnson, J., & Lindau, S. T. (2026). Caregivers in a Haystack? Informatics‐Driven Clinical Trial Enrollment of Dementia Caregivers at Medical Visits. Journal of the American Geriatrics Society. https://doi.org/10.1111/jgs.70783", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "p1": "診療記録に残らない認知症の介護者を、情報システムの照会で見つけて研究に参加してもらう方法を、実際の試験で成立させられるようになった（抄録）。", "p2": "介護しているという立場は通常の診療では記録されないため、研究や支援の対象として介護者を同定することが難しい（抄録）。", "p3": "2つの情報学的な方法を使う。(1)有料の臨床研究データウェアハウス（CRDW）への照会で、認知症の患者とその登録された連絡先（介護者の候補）を特定する。(2)無料のセルフサービス照会として、電子カルテ（EHR）に統合されたコホート発見ツールで認知症の患者を特定する。CRDWの名簿については確率的な突合で、研究サイトの患者でもある連絡先を見つける。そのうえでEHRのダッシュボードに認知症患者と連絡先の受診予定を表示し、受診の場（point of care）で声をかける（抄録）。", "p4": "対象はCommunityRx-Dementia試験で、米国の都市部の大学医療センター（主に黒人の患者層）で実施された。評価は、作成された名簿の規模、目標登録数への到達までの期間、適格な介護者に対する登録率、そして介護者自身の受診の場からの登録割合で行う（抄録）。", "p5": "抄録の報告では、認知症患者8,185名の名簿を作成した（CRDWへの5回の照会から6,282名、セルフサービスのEHR照会1回から1,883名、自己紹介と医師紹介から20名）。目標登録数344名に27か月で到達し、内訳はCRDWの連絡先から321名、セルフサービス照会の連絡先から19名、医師紹介から4名である。登録率は適格な介護者に対しCRDWが66%（321/488）、セルフサービス照会が48%（19/40）。登録された介護者全体の17%が自分自身の受診から勧誘され、その内訳は内科28%、眼科11%、老年科9%、血液・腫瘍科5%、その他の適格な診療科47%である。CRDWの方法は電子カルテからの手作業の抽出を要さず、比較的低い費用で介護者を自身の受診の場で直接勧誘できた（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。1施設の、主に黒人の患者層という特定の環境での結果であり、CRDWの有料照会に依存する点も他施設への移植で問題になりうる。", "fun": "認知症の人を介護している家族は大勢いるのに、病院の記録のどこにも「この人は介護者です」とは書かれていない。だから研究に協力してもらいたくても、そもそも見つけられなかった。この研究の工夫は、患者の登録された連絡先という記録を手がかりに、その人が同じ病院の患者でもあるかを突き合わせて探したこと。結果、登録者の17%は自分自身の通院のついでに声をかけられた形になった。見えない人を既存の記録の組み合わせで浮かび上がらせている。", "unverified": "CRDWの照会費用、確率的突合の手法と精度、試験の介入内容。本文が入手できず確認できなかった。"}}, {"id": "jr07", "rank": 7, "headline": "特性線に沿うPINNで粗度を逆推定", "title": "Characteristic‐Aligned Control‐Volume Physics‐Informed Neural Network for Flood‐Wave Propagation and Roughness Estimation", "url": "https://doi.org/10.1029/2026wr043613", "authors": "Ziyan Lu ほか", "venue": "Water Resources Research", "date": "2026-10-12", "sjr": 1.778, "citescore": 9.2, "citescore_year": "2025", "apa": "Lu, Z., Wang, T., Duan, J., Zhu, Y., He, X., Deng, A., & Wang, Z. (2026). Characteristic‐Aligned Control‐Volume Physics‐Informed Neural Network for Flood‐Wave Propagation and Roughness Estimation. Water Resources Research, 62(10). https://doi.org/10.1029/2026wr043613", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "p1": "河川の洪水波の伝播と、場所ごとに変わる粗度係数の推定を、保存則を局所的に満たしながら同時に行えるようになった（抄録）。", "p2": "物理情報つきニューラルネットワーク（PINN）は観測が疎なときの河川水力計算と逆解析に有望だが、河道の形状と粗度の空間的な不均一さが洪水波の伝播とパラメータ感度を大きく変えるため、局所的な保存と状態・パラメータの同時推定が難しかった（抄録）。", "p3": "CC-PINN-REは3つの要素を組み合わせる。(1)Saint-Venant方程式の局所的な特性速度から、時空間のひし形の制御体積を動的に構成する。(2)質量と運動量の保存を積分形で課す。(3)制御体積の適応的な管理と、局所感度で重みづけた粗度の正則化を組み合わせる。要点は、特性線に沿って制御体積を作ることで、情報が伝わる向きと計算の単位をそろえる点である（抄録）。", "p4": "比較対象は、強形式のPINN-REと、制御体積を固定したcvPINN-REである。評価は複雑さを3段階に上げた1次元の河道3ケースで行い、水深・流量・粗度についての9つの相対指標で測る。さらに3つの乱数種によるアブレーション実験、観測配置の実験、観測ノイズへの頑健性を調べる（抄録）。", "p5": "抄録の報告では、CC-PINN-REが9つの相対指標のうち8つで最小の誤差を達成する。河幅・河床勾配・粗度が空間的に変わるケース3では、PINN-REに対して水深・流量・粗度の誤差をそれぞれ57.0%、82.2%、57.3%削減し、ピーク水深の最大絶対誤差を69.7%減らす。3つの乱数種でのアブレーションは、提案した3要素それぞれの寄与を支持する。観測配置の実験では、個々の観測所の時間的な標本頻度を上げるより、観測所の数を増やすほうが一般に有効である。ケース3で0〜2%の観測ノイズを与えてもモデルは安定していた（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。1次元の河道3ケースという範囲で、2次元の氾濫や分流を含む実河川への拡張は残る疑問である。", "fun": "洪水のときの水位や流量は、川底のざらざら（粗度）が分からないと計算できない。ところが粗度は場所ごとに違い、直接測れない。この研究は、水の情報が伝わる向き（特性線）に沿って計算の箱を作り、その箱の中で質量と運動量の帳尻を合わせることで、水の動きと粗度を同時に当てる。実務的に効くのは観測の設計についての発見で、1か所で細かく測るより、観測所を増やすほうが効くという結果が出ている。", "unverified": "ケース1・2の誤差の数値、9つの相対指標の定義、観測所数の具体的な比較条件。本文が入手できず確認できなかった。"}}, {"id": "jr08", "rank": 8, "headline": "乱れた場での波束を準モンテカルロで解く", "title": "Quasi-Monte Carlo Time-Splitting Methods for the Schrödinger Equation with Gaussian Random Potential", "url": "https://doi.org/10.1007/s10915-026-03461-y", "authors": "Zhizhang Wu ほか", "venue": "Journal of Scientific Computing", "date": "2026-10-12", "sjr": 1.315, "citescore": 5.4, "citescore_year": "2025", "apa": "Wu, Z., Zhang, Z., & Zhao, X. (2026). Quasi-Monte Carlo Time-Splitting Methods for the Schrödinger Equation with Gaussian Random Potential. Journal of Scientific Computing, 109(3). https://doi.org/10.1007/s10915-026-03461-y", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文を読んだ。数値手法（§2.1.1–2.1.2）、主結果（定理2.4、注記2.4–2.5）、数値例（§4）、結論（§5）を参照した", "preprint": false, "p1": "ガウス型のランダムポテンシャルを持つシュレディンガー方程式の物理量の期待値を、次元に依存しない収束率で計算できるようになった（定理2.4）。", "p2": "ガウス確率変数は非有界なので、標本抽出と誤差解析の両方が難しい。標準的なモンテカルロ法では half-order（半次）の収束率しか得られず、準モンテカルロ（QMC）を使うには混合1階偏導関数を抑える重み付き空間を適切に選ぶ必要がある（§1）。", "p3": "QMC-TS法は3段階である。(1)次元の切断：ランダムポテンシャルを V_m = v_0(x) + Σ_{j=1}^m λ_j ξ_j v_j(x) と有限項で近似する（式2.2）。(2)時間離散化：各ξを固定すると方程式は決定論的になるので、ポテンシャル項と運動項の2つの部分流に分け、Lie–Trotter積公式による1次の時間分割 ψ^{n+1} = e^{iτ∂_x²/2} e^{-iτV_m} ψ^n を使う（式2.4）。両者は厳密に時間積分できる。(3)標本抽出：非標準の重み付きSobolev空間を導入し、CBCアルゴリズムでランダムシフト格子則を構成する（§2.1）。", "p4": "評価は定理と数値実験の両方。定理2.4は、仮定2.1〜2.3（s≥3）のもとで誤差が C(m^{-χ} + τ + N^{-κ}) で抑えられると述べ、κはpに応じて1/p−1/2または1−δとなる。数値実験では空間にFourier擬スペクトル法を用い、位置密度S=|ψ|²と流束密度J=Im(ψ̄∇ψ)について参照解に対するL²相対誤差で収束率を測る（§4）。", "p5": "主結果は、QMC-TS法がQMC標本数Nに関してほぼ線形で、かつ次元に依存しない収束率を達成することである（定理2.4）。注記2.4は、Lie–Trotter分割の1次の時間収束にはs≥3が必要で、物理的な基底関数v_jの高階導関数は低階より振動が激しいため、Σa_j<∞という条件が小さなpでのΣb_j^p<∞を含意し、結果としてQMCの収束率が1に近づくと説明する。数値例（例4.1〜4.4）の表1・表2が当てはめた収束率を報告し、理論の誤差推定の鋭さが確認されたとされる。注記2.5はこれが1次元空間の場合だと明記する。", "p6": "著者は結論で、今後の課題として完全離散のスキームと非線形シュレディンガー方程式への拡張を挙げる（§5）。結果は1次元空間に限られる。", "fun": "量子の波の振る舞いは、まわりの環境がランダムに揺らぐと一つに決まらない。そこで何度も計算して平均を取るのだが、ふつうのやり方では精度を上げるのに計算量が急激に増える。この論文はサンプルの取り方を工夫して、計算量をほぼ精度に比例する程度に抑えた。しかも、ランダムさを何項まで取るかという次元の数が増えても収束の速さが落ちない。ランダムな量が非有界だと扱いが難しいという壁を、重みの置き方で越えている。", "unverified": "表1・表2の当てはめた収束率の具体的な数値、仮定2.1〜2.3の詳細、χの値は、本文の表と長い数式を含む節を読み切れず確認できなかった。"}}, {"id": "jr09", "rank": 9, "headline": "小集団を保ったまま共同生産を拡大する", "title": "Scaling out while staying local: Maintaining inclusive co-production with vulnerable citizens", "url": "https://doi.org/10.1177/00208523261494789", "authors": "Caitlin McMullin", "venue": "International Review of Administrative Sciences", "date": "2026-10-12", "sjr": 1.163, "citescore": 7.9, "citescore_year": "2025", "apa": "McMullin, C. (2026). Scaling out while staying local: Maintaining inclusive co-production with vulnerable citizens. International Review of Administrative Sciences. https://doi.org/10.1177/00208523261494789", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "脆弱な立場の人を巻き込む共同生産（co-production）を、包摂性を損なわずに規模拡大する方法を、概念モデルとして立てられるようになった（抄録）。", "p2": "脆弱な人を共同生産に巻き込む組織は逆説に直面する。社会的な便益を大きくするには参加者を増やす必要があるとされる一方、規模拡大は、脆弱な人の参加を可能にしている地域に根づいた関係的な実践を損なう危険がある（抄録）。", "p3": "社会的イノベーションの規模拡大、集合行為と集団規模、そして学習科学の足場かけ（scaffolding）理論を統合して概念モデルを作る。モデルは2つを提案する。(1)代表となる共同生産者とピアメンターを、恒久的な代役ではなく、条件に応じた一時的な足場かけの機能として位置づける。(2)包摂的な規模拡大には、単一の共同生産の場を大きくするのではなく、複数の関連グループを調整して小集団の相互作用を保つ連邦型のグループ構造が必要である（抄録）。", "p4": "これは概念論文であり、新しいデータによる検証ではない。評価は、逆説を解消しうる理論的に根拠のある枠組みが提示できたかという点で行われ、実務家向けの要点として参加の障壁を下げる手立てと組織構造が整理される（抄録）。", "p5": "抄録が述べる結論は、脆弱な人との共同生産の規模拡大には、参加者への差別化された支援と、人数が増えても小集団の相互作用を保つ組織構造の両方が必要だということである。代表となる共同生産者とピアメンターは、脆弱な人自身の関与の恒久的な代替ではなく、一時的または柔軟な資源として動かせる。参加を広げるには場を大きくする必要はなく、信頼と自信と意味のある発言を支えられる小集団を複数調整することで規模を達成できる（抄録）。", "p6": "概念論文であるため経験的な検証がない点が最大の制約で、著者が認める限界は抄録に明示されていない。足場かけをいつ外すか、連邦型構造の調整費用をどう負担するかは残る疑問である。", "fun": "「当事者の声を取り入れよう」という取り組みは、人数を増やすほど良いと思われがちだ。ところが人数が増えると、一人一人が安心して話せる関係が薄まり、もともと参加が難しかった人がまた遠ざかる。この論文は、場を大きくするのではなく小さな場をたくさん作って横につなぐという解き方を示す。さらに、代弁者やピアメンターは便利だが置いたままにすると当事者の代わりになってしまうので、足場のように後で外す前提で使う。", "unverified": "概念モデルの具体的な図示、既存の事例への適用例。本文が入手できず確認できなかった。"}}, {"id": "jr10", "rank": 10, "headline": "孤独な消費者は複雑な包装を選ぶ", "title": "The Pursuit of Security: How Loneliness Shapes Consumers' Preference for Simple Versus Complex Packaging Designs", "url": "https://doi.org/10.1002/mar.70285", "authors": "Ting Li ほか", "venue": "Psychology and Marketing", "date": "2026-10-12", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Li, T., Yuan, Y., Prentice, C., & Wang, F. (2026). The Pursuit of Security: How Loneliness Shapes Consumers’ Preference for Simple Versus Complex Packaging Designs. Psychology & Marketing. https://doi.org/10.1002/mar.70285", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "孤独感が消費者の包装デザインの好みを変える機構を、象徴的な安心の希求という経路として特定できるようになった（抄録）。", "p2": "孤独が消費行動を変えることは知られていても、包装の単純さと複雑さという具体的な選好に対して、どの心理的な経路で効くのかは分かっていなかった（抄録）。", "p3": "入力は孤独感、出力は単純な包装と複雑な包装のどちらを好むかである。媒介として象徴的な安心（symbolic security）の希求を置き、調整変数として消費者の安心特性（security trait）を置く。孤独な人は象徴的な安心を求め、情報量の多い複雑な包装がそれを満たすという想定で、もともと安心特性が高い人ではこの経路が弱まる（抄録）。", "p4": "検証は7つの研究（調査1件と実験6件、合計N=1,636）。評価は、孤独感の操作または測定が包装選好に与える効果と、象徴的な安心の希求を介した媒介、安心特性による調整の3点で行う（抄録）。", "p5": "抄録の報告では、孤独感が複雑な包装デザインへの選好を高め、その経路は象徴的な安心の希求である。消費者の安心特性はこの関係を負に調整し、孤独が象徴的な安心の希求を高める効果は、安心特性が低い消費者で強く、高い消費者で弱い。著者はこれを感覚マーケティング研究への貢献と位置づけ、包装戦略を考えるとき消費者の孤独感を考慮すべきだと述べる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。実験室中心の設計で実際の購買行動まで追っていない点、孤独感の操作が短期的なものである点は残る疑問である。", "fun": "ひとりでいると感じているとき、人は商品の箱の選び方まで変わる。しかも選ばれるのは、情報が詰まった複雑なデザインのほうだった。研究者の解釈は「象徴的な安心」を求めるから、というもの。にぎやかな絵や文字が、どこか人のいる気配のように働くのかもしれない。面白いのは、もともと安心感の強い人にはこの効果が小さいこと。同じ孤独でも、心の土台の違いで表れ方が変わる。", "unverified": "7研究それぞれの設計と効果量、孤独感の操作方法、包装デザインの刺激材料。本文が入手できず確認できなかった。"}}, {"id": "jr11", "rank": 11, "headline": "LLMが都市計画の質的目標を採点する", "title": "Integrating Planning Knowledge into Evolutionary Search: LLM-Based Qualitative Objectives for Urban Development Optimization", "url": "https://doi.org/10.3390/smartcities9100168", "authors": "Maksim Natykin ほか", "venue": "Smart Cities", "date": "2026-10-12", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Natykin, M., Starikov, V., Fedukhin, A., & Mityagin, S. (2026). Integrating Planning Knowledge into Evolutionary Search: LLM-Based Qualitative Objectives for Urban Development Optimization. Smart Cities, 9(10), 168. https://doi.org/10.3390/smartcities9100168", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "p1": "言葉で書かれた都市計画上の質的な価値を、LLMで採点して進化計算の目的関数に直接組み込めるようになった（抄録）。", "p2": "多目的の都市開発最適化は定量指標に偏っており、十分に形式化できない都市の質（weakly formalized urban qualities）を取り込めなかった（抄録）。", "p3": "自然言語で書かれた基準をLLMに採点させ、そのスコアを、投資家の正味現在価値と予測される地価上昇と並ぶ1つの目的として進化最適化に組み込む。方法上の新しさは、言語による評価を解の生成と選択の内部に埋め込む点であり、概念上の貢献は、多目的探索の目的の定式化を十分に形式化できない計画上の優先事項へ広げる点だとされる（抄録）。", "p4": "ロシアのガッチナの開発シナリオで、5つの質的基準を使って検証する。評価は、繰り返し評価の安定性（5回の繰り返し評価の平均のクラス内相関）と、3次元のハイパーボリューム（多目的最適化で解集合の広さを測る指標）の比較で行う。比較は、同じ乱数種を揃えた50組の対で、各解につき3回の独立評価を両手法に行ってから実施する（抄録）。", "p5": "抄録の報告では、5回の繰り返し評価の平均についてのクラス内相関は0.92〜0.93に達した。同じ乱数種を揃えた50組の比較のうち27組で、目的関数への直接の組み込みが大きい3次元ハイパーボリュームを達成し、5基準のうち2つで中位数の差が正だった。乱数種をまたいでプールしたフロントでは5基準すべてで大きい3次元ハイパーボリュームが得られ、個々の実行では成績がばらつくものの、総体としての被覆は広がった。著者はこれを、計画の選択肢を広げ、経済的な目的と質的な目的の間の追加的なトレードオフを明らかにするものと述べる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。27/50という結果は個々の実行のばらつきが大きいことを示しており、1都市の事例で5基準に限られる点、LLMの採点の妥当性を人間の評価と照合していない点は残る疑問である。", "fun": "都市計画の良さは「容積率」や「地価」のように数で測れる部分と、「歩いて気持ちがよい」のように言葉でしか言えない部分がある。この研究は後者をLLMに採点させ、数値目標と並べて最適化にかけた。同じ説明を5回採点させても相関0.92以上で、採点自体はかなり安定している。ただし50回の比較のうち勝ったのは27回で、運の要素が大きい。言葉を数に変える橋は架かったが、まだ揺れているという状態が正直に報告されている。", "unverified": "5つの質的基準の内容、LLMの種類、ハイパーボリュームの具体的な値。本文が入手できず確認できなかった。"}}, {"id": "jr12", "rank": 12, "headline": "会社がLinkedInの自分を資産に変える", "title": "‘Don’t forget to post it on LinkedIn’: Identity regulation and the assetization of employees’ online selves", "url": "https://doi.org/10.1177/00187267261490718", "authors": "Paul Richard", "venue": "Human Relations", "date": "2026-10-12", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Richard, P. (2026). ‘Don’t forget to post it on LinkedIn’: Identity regulation and the assetization of employees’ online selves. Human Relations. https://doi.org/10.1177/00187267261490718", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "会社が従業員のLinkedInでの見せ方に介入するとき、従業員の「オンライン上の自分」の感覚がどう作り替えられるかを記述できるようになった（抄録）。", "p2": "企業は研修や社内方針を通じて従業員の職業上のソーシャルメディアの存在に介入し、プロフィールを将来の見返りのために育てる資産として扱うよう促す。しかしそのとき従業員のアイデンティティがどう規制されるのかは記述されていなかった（抄録）。", "p3": "着想は、規制がプロフィールの「アイデンティティとしての賭け金」そのものに働くと見ることである。つまり、プロフィールが自分自身をどれだけ背負っているかという度合いが操作される。研修はまず、プロフィールが自分の本質とは無関係だと否定し、そのうえで、その否定が作った枠の中で個人的な意味を再び投入するよう促す（抄録）。", "p4": "方法はフランスの国有企業における社内LinkedIn研修プログラムの2年間のデジタル・エスノグラフィー（抄録）。評価は、参加者がこの招きをどう受け取ったかの差異と、そこに現れるアイデンティティ規制と資産化（assetization）の絡み合いを記述できるかという点で行われる。", "p5": "抄録の報告では、否定してから意味を投入させるという二段の手続きによって、参加者のオンライン上の自分の感覚が規制される。参加者がこの招きを受け取る度合いにはばらつきがあり、そのばらつきがアイデンティティ規制と資産化の絡み合いを示す。さらに、いったん資産化されたオンライン上の自分は、本人が離職して関与をやめたあとも長く組織に価値を生み続ける能力を持つと述べられている（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。1社の研修プログラムを対象とした質的研究であり、他業種や他国の労働慣行に移せるかは残る疑問である。", "fun": "会社が「LinkedInに投稿しておいて」と言うとき、それは広報の依頼のように見える。この研究が見つけたのは、研修がまず「プロフィールはあなた自身ではない」と言い、そのうえで「だからこそ自分の思いを込めて」と促すという二段構えだった。否定してから意味を入れさせることで、本人の自己の重みが会社の都合のいい場所に移る。しかも資産になった「オンラインの自分」は、本人が辞めた後も会社のために働き続ける。", "unverified": "参加者の人数と属性、研修の具体的な内容、ばらつきの類型。本文が入手できず確認できなかった。"}}, {"id": "jr13", "rank": 13, "headline": "JD-Rはキャリア段階を越えて成立しない", "title": "Do job demands and resources generalize across academic career stages? Implications for burnout and work engagement", "url": "https://doi.org/10.3389/ijph.2026.1610023", "authors": "May Thet Nu Noe ほか", "venue": "International Journal of Public Health", "date": "2026-10-12", "citescore": 5.1, "citescore_year": "2025", "apa": "Noe, M. T. N., Wild, P., Lasser, J., & Guseva Canu, I. (2026). Do job demands and resources generalize across academic career stages? Implications for burnout and work engagement. International Journal of Public Health, 71. https://doi.org/10.3389/ijph.2026.1610023", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "出版社（Frontiers）のPDF本文を読んだ。方法（§測定不変性の検定）、結果（バーンアウト有病率と多群SEM）、限界と強み（Limitations and strengths）を参照した", "preprint": false, "p1": "JD-Rモデルが研究者のキャリア段階を越えて同じ測定として成り立つかを、正面から検定できるようになった（Results）。", "p2": "JD-Rの枠組みはバーンアウトとワークエンゲージメントの説明に広く使われるが、学術界のキャリア段階（若手と上級）をまたいで適用できるかは明らかでなかった。測定の同等性は通常、検定されずに仮定されてきた（抄録）。", "p3": "入力は4つの仕事の要求度（不当な業務、雇用の不安定、対人葛藤、仕事と家庭の葛藤）と4つの仕事の資源（役割の明確さ、仕事のコントロール、共同体の感覚、予測可能性）、出力はバーンアウトとワークエンゲージメントである。多群の構造方程式モデリング（SEM）で若手と上級の研究者の間の測定不変性を検定し、支持されない場合は群ごとに別のSEMを推定する（Methods）。", "p4": "データは27のヨーロッパ諸国の研究者3,101名の横断調査（ReMO STAIRCASE調査、2023〜2024年）。バーンアウトの有病率は確立したBATのカットオフ（2.54未満は非該当、2.54以上はリスク、2.96以上はバーンアウト）で推定し、モデル適合はCFI、TLI、RMSEAなどで評価する（Methods）。", "p5": "バーンアウトの有病率は若手29.5%、上級25.1%で群間差は有意である（χ²(8)=38.40、p<0.001）。構造的な関連は、要求度がバーンアウトと結びつき、資源がワークエンゲージメントと結びつきバーンアウトを緩衝するという予想通りの向きで出る。しかし多群SEMは測定不変性を支持せず、配置モデルと計量モデルのSRMRは0.071と0.075で近い値だが、いくつかの適合統計量は報告されなかった（補足表S3）。群別のSEMは中程度から不良の適合にとどまる。著者は、この操作化のもとでは測定がキャリア段階をまたいで同等に働かない可能性があり、一般化可能性を検定する前に測定の同等性を確立する必要があると結論する。", "p6": "著者は、横断デザインのため因果推論ができず逆の因果も否定できないこと、自己報告による共通方法バイアス、27か国の便宜標本と雪だるま式抽出で代表性が限られ国・機関・分野のクラスタリングをモデル化していないため測定と適合の問題に寄与した可能性があること、測定不変性が確立されず構造係数は探索的にとどまること、欠測のため過重労働と情緒的支援を除外したことを挙げる。", "fun": "「仕事の負担が重く、使える資源が少ないと燃え尽きる」という枠組みは、産業心理学の定番として世界中で使われている。この研究は3,101人の研究者を若手と上級に分け、その枠組みが同じ物差しとして成り立つかを検定した。結果は否定的で、同じ質問が立場によって違う意味で受け取られている可能性が出てきた。燃え尽きの率は若手29.5%、上級25.1%と差があるのに、比べる物差しが揃っていなければその差の意味も怪しい。測る前に物差しを疑う作法の実例である。", "unverified": "構造係数の個別の値（図1・図2の経路係数）とCFI・TLI・RMSEAの具体的な数値は、本文の図と補足表が読み取れず確認できなかった。"}}, {"id": "jr14", "rank": 14, "headline": "コルドバ鐘塔の初の詳細FEMと固有振動数", "title": "Numerical Model of the Bell Tower of the Mosque-Cathedral of Córdoba", "url": "https://doi.org/10.3390/buildings16204010", "authors": "Isabel Cuerda-del-Valle ほか", "venue": "Buildings", "date": "2026-10-12", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Cuerda-del-Valle, I., Romero-Sánchez, E., & Morales-Esteban, A. (2026). Numerical Model of the Bell Tower of the Mosque-Cathedral of Córdoba. Buildings, 16(20), 4010. https://doi.org/10.3390/buildings16204010", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "p1": "複数の建設時期が重なる歴史的な石造塔について、幾何・材料・部材の相互作用・境界条件の不確実性を明示したうえで、実測校正の出発点になる3次元FEMを作れるようになった（抄録）。", "p2": "歴史的な石造塔は、度重なる増改築で形が複雑になり、幾何・材料・部材の相互作用・境界条件に不確実性が残るため、数値的な評価が難しい（抄録）。", "p3": "入力は3次元CADによる形状復元で、保存されているカリフ時代のミナレット、その後のキリスト教期の改変、隣接する「赦しの門（Puerta del Perdón）」を統合する。これをSTKO/OpenSeesで、連続体のマクロモデル化とDamageTC3D構成則により実装する。出力は固有振動数とモード形、および水平2方向のプッシュオーバー曲線と損傷の分布である。モデルを校正せず、不確実性を明示したまま基準（baseline）として提示する点が設計の要点である（抄録）。", "p4": "対象はコルドバのメスキータ（モスク大聖堂）の鐘楼で、その初の詳細な3次元FEMである。評価は、モード解析と2つの主要な水平方向での非線形静的解析（プッシュオーバー）で行い、その前にメッシュ感度解析を実施する（抄録）。", "p5": "抄録の報告では、最初の2つの並進モードの振動数が1.361 Hzと1.508 Hz、3番目の主に回転するモードが4.062 Hzである。プッシュオーバー解析では基部せん断力のピークが約850〜1,100 kNで、2方向の水平耐力は同程度だがピーク後の挙動が異なる。引張損傷は開口部周辺、軸部の中間高さ、カリフ期とキリスト教期の境界面、鐘楼部、バットレス、赦しの門に集中した。得られたモデルは、今後の実験的校正・感度解析・保存を目的とした構造評価のための、文書化された未校正のベースラインを与えるとされる（抄録）。", "p6": "著者自身がモデルを「未校正」と位置づけており、実測との照合は今後の課題である（抄録）。マクロモデル化は石材と目地を区別しないため、局所的な損傷の再現には限界が残る。", "fun": "コルドバのメスキータの鐘楼は、イスラム時代のミナレットの上にキリスト教時代の鐘楼が載った、時代の地層のような建物である。この研究はそれを丸ごと計算機の中に組み立て、揺らしてみた。すると壊れやすい場所が、開口部のまわりや、カリフ期とキリスト教期の境目に集まった。異なる時代の工法が接する面が弱点になるというのは、歴史と力学が同じことを語っている。著者が「まだ校正していない基準」と断ったうえで公開する姿勢も誠実である。", "unverified": "材料パラメータの値、メッシュ感度解析の結果、CADによる形状復元の根拠資料。本文が入手できず確認できなかった。"}}, {"id": "jr15", "rank": 15, "headline": "緑地の価値は地区平均では測れない", "title": "Multidimensional Green Space Exposure and Housing Prices in High-Density Urban Areas: Spatial Evidence from 3729 Communities in Guangzhou", "url": "https://doi.org/10.3390/buildings16204013", "authors": "Weian Wang ほか", "venue": "Buildings", "date": "2026-10-12", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Wang, W., & Hong, X. C. (2026). Multidimensional Green Space Exposure and Housing Prices in High-Density Urban Areas: Spatial Evidence from 3729 Communities in Guangzhou. Buildings, 16(20), 4013. https://doi.org/10.3390/buildings16204013", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "p1": "緑地への接触と住宅価格の関係が、地区全体の平均ではなく場所ごとに大きく変わることを、3次元の指標と空間回帰で示せるようになった（抄録）。", "p2": "高密度都市の緑地は希少で分配も偏っている。しかし既存研究は接触の1つの次元しか測らないか、地区全体で1つの推定値を報告するため、価値が価格に反映されるのか、コミュニティ間で一様なのかが不明だった（抄録）。", "p3": "入力は緑地接触（green space exposure, GSE）の合成指標で、正規化した3つの指標（緑被率、公園アクセシビリティ指数、緑視率）を等重みで合成し、それぞれ可用性・接近性・視認性を表す。出力は中古住宅の売出価格である。最小二乗回帰、地理的加重回帰（GWR）、マルチスケール地理的加重回帰（MGWR）を順に当て、残差の空間自己相関と補正した局所推論で空間変動を判定する（抄録）。", "p4": "対象は中国・広州市白雲区の3,729の住宅コミュニティ。評価は、3指標が区内のどこで高くなるかの分布、GSEと価格の空間的な重なり、そして地区スケールと局所スケールでの係数の大きさの差で行う（抄録）。", "p5": "抄録の報告では、3つの次元は区内の別の場所でそれぞれ最大になる。合成GSEは東の山麓と金沙洲の一部で高く、中部と南部の市街地で低い。高GSEと高価格の地域は部分的にしか重ならず、最も緑の多いコミュニティは一般に最も高価ではない。平均すると、GSEが0.01上がることは地区スケールで約4.1%の価格差と関連するが、典型的な局所の関連はずっと小さく、同じ0.01の差で約0.4〜0.6%である。大域モデルは価格の変動の19.4%しか説明しない。局所係数が正になるのは全コミュニティの65.8%で、補正後も有意なのはそのうち25.0%、有意に負なのは0.7%である。著者は、地区全体の平均ではなく接触の次元と局所の市場反応を踏まえた緑地計画が必要だと述べる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。売出価格（成約価格ではない）を使っている点、横断データのため因果の解釈ができない点は残る疑問である。", "fun": "「緑が多い街は家が高い」と言われる。この研究が3,729のコミュニティで調べると、区全体で平均すれば確かにそうなるが、場所ごとに見ると関係は10分の1ほどに小さくなり、しかも最も緑の多い地区が最も高いわけではなかった。平均の数字は、ごく一部の強い関係に引っぱられていたことになる。さらに緑の「量」「近さ」「見え方」は区内の別の場所でそれぞれ最大になる。ひとくちに緑と言っても、測り方で地図が変わる。", "unverified": "GWRとMGWRの帯域幅、局所係数の分布の詳細、価格データの出所と期間。本文が入手できず確認できなかった。"}}, {"id": "jr16", "rank": 16, "headline": "温度を考えて張力と曲げ剛性を同時同定", "title": "Physics-encoded solver for joint identification of cable tension and bending stiffness under thermal effects", "url": "https://doi.org/10.1016/j.measurement.2026.123467", "authors": "Yaobing Zhao ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-12", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Zhao, Y., Liu, Y., Chen, Y., & Chen, L. (2026). Physics-encoded solver for joint identification of cable tension and bending stiffness under thermal effects. Measurement, 123467. https://doi.org/10.1016/j.measurement.2026.123467", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、温度の影響を考慮したうえで、ケーブルの張力と曲げ剛性を同時に同定する、物理を組み込んだ解法の提案だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "吊り橋や斜張橋のケーブルがどれだけ強く張られているかは、見ただけでは分からない。揺れの振動数から推定するのが定石だが、ケーブルには曲げにくさもあり、しかも気温で張力が変わる。張力・曲げ剛性・温度の3つが絡んだ連立を解くことになる。題名が「同時同定」と言い切っているのは、この絡み合いを分けずにまとめて解くという宣言である。", "unverified": "手法の内容、対象ケーブル、精度のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "履歴型減衰をエネルギーから同定する", "title": "Energy-based dynamic damping identification in vibrating cables governed by hysteretic material behavior", "url": "https://doi.org/10.1016/j.ymssp.2026.115059", "authors": "Louis Le Gué ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-10-11", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Le Gué, L., Helbert, G., Le Meitour, H., Bles, G., Popineau, V., & Hamila, N. (2026). Energy-based dynamic damping identification in vibrating cables governed by hysteretic material behavior. Mechanical Systems and Signal Processing, 261, 115059. https://doi.org/10.1016/j.ymssp.2026.115059", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、履歴型の材料挙動に支配される振動するケーブルの動的な減衰を、エネルギーに基づいて同定する手法の提案だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "揺れがどれだけ早く収まるかを表す「減衰」は、構造物の安全を判断するうえで振動数より重要なことがある。ところが減衰は測りにくい。材料の内部摩擦が履歴（これまでの変形の経歴）に依存するからで、単純な粘性の式では表せない。題名が「エネルギーに基づく」と言うのは、1周期で失われるエネルギーから逆算する発想だろう。測りにくい量を、保存されない量から攻める。", "unverified": "手法の内容、対象、検証方法のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "交通と風で斜張ケーブルの疲労を実測", "title": "Field‐Based Characterization of Stay Cables: Traffic‐Induced Fatigue Demand and Wind‐Vibration Susceptibility", "url": "https://doi.org/10.1155/stc/4195193", "authors": "Miguel Anaya-Díaz ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-12", "citescore": 10.3, "citescore_year": "2025", "apa": "Anaya-Díaz, M., Crespo-Sánchez, S. E., Carrión-Viramontes, F. J., Quintana-Rodríguez, J. A., & Torres-Acosta, A. A. (2026). Field‐Based Characterization of Stay Cables: Traffic‐Induced Fatigue Demand and Wind‐Vibration Susceptibility. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/4195193", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "斜張橋の斜材ケーブルについて、交通による疲労の需要と風による振動の受けやすさを、実橋の同時計測から特性化した（抄録）。", "p3": "Ing. Antonio Dovalí Jaime橋の2本の斜材ケーブルで、制御した静的載荷試験時と通常の供用時に、ひずみと加速度を同時に計測する。加速度記録から固有振動数とモード減衰比を同定し、機械的なケーブルモデルで有効な曲げ剛性と単位長さ質量を推定する。有効な軸剛性は、計測したひずみ増分と対応する張力の変化から決める（抄録）。", "p5": "同定した特性を使って、橋の供用時の活荷重による張力の履歴を推定する。プレストレス鋼材の応力履歴については、抄録が途中で切れており具体的な結果は未確認（抄録）。", "fun": "斜張橋のケーブルは、車が通るたびに少しずつ引っぱられ、風が吹くと揺れる。その繰り返しで疲労が溜まるのだが、実際にどれだけの応力が何回かかっているかは計算では分からない。この研究はひずみと加速度を同時に測り、静的な載荷試験を基準にしてケーブルの性質を決め、そこから日常の張力の履歴を復元した。測れる量から測れない量へ、2段で橋渡ししている。", "unverified": "疲労需要の定量的な評価、風による振動の受けやすさの結論。抄録が途中で切れており確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "洪水と腐食の重畳でRC橋の回復力を評価", "title": "Resilience Assessment of Reinforced Concrete Bridges in a Multihazard Environment of Flood and Corrosion", "url": "https://doi.org/10.1061/jbenf2.beeng-8451", "authors": "Raj Kamal Arora ほか", "venue": "Journal of Bridge Engineering", "date": "2026-10-12", "citescore": 7.2, "citescore_year": "2025", "apa": "Arora, R. K., & Banerjee, S. (2026). Resilience Assessment of Reinforced Concrete Bridges in a Multihazard Environment of Flood and Corrosion. Journal of Bridge Engineering, 31(12). https://doi.org/10.1061/jbenf2.beeng-8451", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "洪水と腐食が重なる複合ハザードのもとで、劣化していく鉄筋コンクリート橋の回復力（レジリエンス）を推定する枠組みを作った（抄録）。", "p3": "枠組みは4段である。洪水ハザードの評価、腐食の解析、水力学の解析、回復力の評価。供用期間中に強度の異なる洪水が無作為に起こる状況を想定し、水没した上部構造への流体力と基礎の洗掘による床版レベルの過大な水平変位と不安定化を扱う（抄録）。", "p5": "インドのマヒ川を渡る橋を対象に、地域固有の実データで枠組みを実演する。有限要素解析については、抄録が途中で切れており結果は未確認。腐食が進む環境では、徐々に進む劣化と洪水ハザードが組み合わさって複合ハザードの状況を作り、社会経済的な影響が大きくなると位置づけられている（抄録）。", "fun": "橋が洪水で壊れるとき、水の力だけが原因ではない。何十年もかけて鉄筋が錆びていれば、同じ洪水でも結果が違う。この研究はその2つを掛け合わせて、橋の「立ち直る力」を供用期間を通じて評価する。洪水はいつ来るか分からないので確率で扱い、腐食は時間とともに確実に進む。性質の違う2つのリスクを同じ枠に収めるのが要点である。", "unverified": "有限要素解析の結果、回復力の指標の値。抄録が途中で切れており確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "鉄道橋の幾何デジタルツインを半自動生成", "title": "Semi-Automated Generation of Geometric Digital Twins of Railway Bridges with Deep Learning-based Keypoint Detection", "url": "https://doi.org/10.1016/j.iintel.2026.100252", "authors": "R. Cabral ほか", "venue": "Journal of Infrastructure Intelligence and Resilience", "date": "2026-10-12", "citescore": 8.8, "citescore_year": "2025", "apa": "Cabral, R., Hoskere, V., Santos, R., & Ribeiro, D. (2026). Semi-Automated Generation of Geometric Digital Twins of Railway Bridges with Deep Learning-based Keypoint Detection. Journal of Infrastructure Intelligence and Resilience, 100252. https://doi.org/10.1016/j.iintel.2026.100252", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、深層学習によるキーポイント検出を使って、鉄道橋の幾何デジタルツインを半自動で生成する手法の提案だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "橋の点検や解析のためには、まず正確な形のモデルが必要だ。ところが古い橋には図面がないことが多く、測量して3次元の点の集まりを得ても、そこから「これは桁、これは支点」という構造を組み立てる作業は人手に頼る。題名が「キーポイント検出」と言うのは、顔認識で目や鼻の位置を当てる技術を、橋の部材の節点に当てる発想だろう。問題の読み替えが面白い。", "unverified": "手法の内容、対象橋梁、精度のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "プレキャスト自己復元橋脚の履歴モデル", "title": "Development of a New Analytical Model for Hysteretic Behavior of Precast Segmental Self‐Centering Pier Columns", "url": "https://doi.org/10.1002/eqe.70313", "authors": "Chao Li ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-12", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Li, C., Yu, S., Li, L.-X., Hao, H., & Li, H.-N. (2026). Development of a New Analytical Model for Hysteretic Behavior of Precast Segmental Self‐Centering Pier Columns. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70313", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "エネルギー吸収装置の配置が異なるプレキャストの分割型自己復元橋脚について、履歴挙動を予測する解析モデルを作った（抄録）。", "p3": "3種類の典型的な配置（エネルギー吸収なし、全体に配置、底部のみに配置）を考える。モデルは、吸収装置の配置によって生じる柱の変形パターンの変化を、底部の2つの目地（Joint 1とJoint 2）の開きを合わせて考慮することで扱う。各型について3段階の荷重-変位関係を導く（抄録）。", "p5": "192の有限要素モデルによるパラメトリック研究で、解析の枠組みに必要な主要パラメータを校正する。回帰式が、コンクリートの最大ひずみ（R²=0.75〜0.78）とJoint 2の開き角（R²=0.90〜0.92）について立てられている。それ以降の検証結果は抄録が途中で切れており未確認（抄録）。", "fun": "地震のあと橋脚がもとの位置に戻る「自己復元」の構造は、ブロックを積み上げて鋼材で締めるような作り方をする。揺れると目地が開いて、その開きがエネルギーを吸収する。この研究が丁寧なのは、底部の目地を1つではなく2つ考えたこと。吸収装置の置き場所で、どちらの目地がどう開くかが変わる。実物で試せない組み合わせを192回の計算で埋めている。", "unverified": "3段階の荷重-変位関係の式、モデルの検証結果。抄録が途中で切れており確認できなかった。"}}, {"id": "jr22", "rank": 22, "headline": "SE-CNNで溶接接合部の損傷を検出", "title": "SE‐CNN‐Based Damage Detection in Welded Joints of Spatial Grid Structures", "url": "https://doi.org/10.1155/stc/7052218", "authors": "Hui Liu ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-12", "citescore": 10.3, "citescore_year": "2025", "apa": "Liu, H., Sheng, W., Huang, J., Zou, Y., & Wang, J. (2026). SE‐CNN‐Based Damage Detection in Welded Joints of Spatial Grid Structures. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/7052218", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "空間格子構造の溶接接合部の損傷を、光ファイバセンサ網と深層学習を組み合わせて検出する枠組みを作った（抄録）。", "p3": "接合部に準分布型の光ファイバブラッググレーティング（FBG）センサ網を配置し、損傷の位置と程度に高い感度を持つ二次元の損傷指標を構成する。この指標は、接合部の破壊が引き起こす局所的な応力場の急な変化を捉えることで、接合部の損傷を精密に同定できる（抄録）。", "p5": "損傷指標の空間分布のパターンを活用し、SE（squeeze-and-excitation）機構を組み込んだ畳み込みニューラルネットワーク（CNN）のモデルで診断を行う。具体的な検出精度は、抄録が途中で切れており未確認（抄録）。", "fun": "体育館やドームの屋根を支える格子構造は、たくさんの鋼管を溶接でつないで作る。その溶接部は応力が集中しやすく、構造全体の中で最も傷みやすい場所になる。この研究は接合部に光ファイバのセンサを貼り、応力場の急な変化を捉える。ひずみを点ではなく分布として測れるのが光ファイバの強みで、面としての異常を画像のように扱えるからCNNが使える。", "unverified": "検出精度、SE-CNNの構造、実験の規模。抄録が途中で切れており確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "超低消費電力MCUで振動監視を省電力化", "title": "Energy-efficient deep learning-based vibration monitoring on parallel ultra-low-power microcontrollers", "url": "https://doi.org/10.1016/j.engappai.2026.116206", "authors": "Amirhossein Kiamarzi ほか", "venue": "Engineering Applications of Artificial Intelligence", "date": "2026-10-12", "sjr": 1.782, "citescore": 11.7, "citescore_year": "2025", "apa": "Kiamarzi, A., Zonzini, F., Moallemi, A., Rossi, D., & Tagliavini, G. (2026). Energy-efficient deep learning-based vibration monitoring on parallel ultra-low-power microcontrollers. Engineering Applications of Artificial Intelligence, 185, 116206. https://doi.org/10.1016/j.engappai.2026.116206", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、並列の超低消費電力マイクロコントローラ上で、深層学習による振動監視を省電力で動かす研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "構造物に貼り付けるセンサは電池で動くので、計算に電気を使いすぎると数か月で止まってしまう。だから集めたデータを全部送るのではなく、センサの側で判断して異常だけ報告したい。ところが深層学習は電気を食う。題名が「並列の超低消費電力マイコン」と言うのは、小さな計算機を複数並べて、一つずつは低い電圧で動かすという解き方だろう。速さより消費電力を優先する設計である。", "unverified": "手法の内容、消費電力の数値、対象のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "5Sで重要な虚偽表示の再発を防ぐ枠組み", "title": "Preventing recurring material misstatements through behavioural sustainment: a 5S-based conceptual framework for financial reporting", "url": "https://doi.org/10.1108/jaar-09-2025-0491", "authors": "Akhmad Sigit Adiwibowo", "venue": "Journal of Applied Accounting Research", "date": "2026-10-12", "sjr": 1.225, "citescore": 11.4, "citescore_year": "2025", "apa": "Adiwibowo, A. S. (2026). Preventing recurring material misstatements through behavioural sustainment: a 5S-based conceptual framework for financial reporting. Journal of Applied Accounting Research, 1–18. https://doi.org/10.1108/jaar-09-2025-0491", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。概念論文であり実証ではない", "preprint": false, "short": true, "p1": "財務報告の日常業務で行動上の規律がどう持続し、それが重要な虚偽表示の再発をどう条件づけるかを説明する概念枠組みを作った（抄録）。", "p3": "報告の信頼性を、技術的な規則や事後の発見で最適化される帰結として扱うのをやめ、財務報告を、ルーティン・説明責任・時間をかけた強化によって形づくられる行動として実演される過程と捉え直す。会計・管理会計・行動の文献を構造的に統合する（抄録）。", "p5": "5S原則（整理、整頓、清掃、標準化、しつけ）を行動の過程の枠組みとして読み替え、報告のルーティンが報告サイクルを越えてどう実演され、調整され、精査され、強化されるかを説明する。合理的な保証という条件のもとでの再発との関係については、抄録が途中で切れており具体的な主張は未確認（抄録）。", "fun": "決算の数字を間違える会社は、同じ間違いを繰り返すことが多い。ルールを足しても、監査で見つけても止まらない。この論文が持ち出すのは工場の5S、つまり整理・整頓・清掃・標準化・しつけである。製造現場で不良を減らした作法を、経理の日常業務に当てはめる。最後の「しつけ」、つまり続ける仕組みがないと元に戻るという点が、報告の再発と重なる。", "unverified": "枠組みの具体的な適用方法、再発との関係の論証。抄録が途中で切れており確認できなかった。"}}, {"id": "jr25", "rank": 25, "headline": "制裁後のオフショア活動をNLPで追う", "title": "U.S. sanctions and firm offshore activities: A firm-country analysis using natural language processing", "url": "https://doi.org/10.1016/j.jaccpubpol.2026.107482", "authors": "Ling Tuo ほか", "venue": "Journal of Accounting and Public Policy", "date": "2026-10-10", "citescore": 4.1, "citescore_year": "2025", "apa": "Tuo, L., Wang, W., & Zhang, J. H. (2026). U.S. sanctions and firm offshore activities: A firm-country analysis using natural language processing. Journal of Accounting and Public Policy, 60, 107482. https://doi.org/10.1016/j.jaccpubpol.2026.107482", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "米国の経済制裁のあと、米国の多国籍企業が海外活動をどう調整したかを、開示テキストから作ったリスク指標で測った（抄録）。", "p3": "more than five million の企業・国・年の観測を使い、10-K報告書の海外事業の開示を国レベルの制裁データに結びつける。制裁リスクの指標は、企業の特性と、リスク開示から抽出したFinBERTの言語埋め込みを組み合わせた教師あり勾配ブースティングのモデルで構成する（抄録）。", "p5": "制裁は、制裁対象国での海外関与の減少と関連し、その大きさは制裁の種類によって異なる。この関連は開示行動だけでは説明されず、制裁開始前後のイベント窓の分析でも一貫する。制裁への暴露は、財務制約の厳しさと収益性の低下とも関連する。事前の制裁リスクが高い企業は、海外活動の調整がより強い（抄録）。", "fun": "制裁を受けた国から企業が撤退しているかを確かめるには、企業が「どの国で何をしているか」を知る必要がある。この研究は年次報告書の文章から海外事業の記述を取り出し、five million を超える企業・国・年のデータにした。さらに文章の言い回しから制裁リスクを予測する模型を作る。開示が増えただけという可能性を潰す分析も入っていて、手続きが丁寧である。", "unverified": "制裁の種類別の効果の大きさ、FinBERT指標の精度。本文が入手できず確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "取引先の継続性が中小企業の生産性を映す", "title": "Dynamic Partner Retention, Network Dominance, and SME Productivity: A Statistical Modeling Approach", "url": "https://doi.org/10.3390/math14203700", "authors": "Hengyuan Zhang ほか", "venue": "Mathematics", "date": "2026-10-12", "citescore": 5.4, "citescore_year": "2025", "apa": "Zhang, H., & Peng, K. (2026). Dynamic Partner Retention, Network Dominance, and SME Productivity: A Statistical Modeling Approach. Mathematics, 14(20), 3700. https://doi.org/10.3390/math14203700", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "取引額で重みづけた取引先の継続性という指標を作り、それが企業の生産性とどう関係するかを大規模な請求書データで測った（抄録）。", "p3": "静的な集中度の指標では、経済的に重要な取引関係が時間を越えて持続するかを示せない。そこで仕入先と顧客の継続性を取引額で重みづけて測り、生産性のネットワーク拡張モデルに組み込む。仕入先の安定性は前年から維持した仕入先からの現在の購入の割合、顧客の安定性は販売について同様に定義する（抄録）。", "p5": "中国の付加価値税の請求書と突合した企業記録から、2019年から2025年の443,506の企業・年観測の不均衡パネルを作る。年次の有向・重み付き取引ネットワークを請求書の流れから再構成し、DomiRankで企業の構造的な優越を測る。全要素生産性はLevinsohn–Petrin法で推定する。企業と年の固定効果の推定では、両方の安定性の次元と生産性の間に負の関係が出た（抄録）。", "fun": "取引先が安定しているほど経営が良いように思える。ところがこの研究の推定では、仕入先も顧客も継続性が高いほど生産性が低いという負の関係が出た。関係を保つこと自体が目的になると、より良い相手に乗り換える機会を逃すのかもしれない。請求書という日々の記録から企業間の網を毎年描き直せるようになったからこそ測れる話である。", "unverified": "2段推定の結果、DomiRankの効果、負の関係の大きさ。抄録が途中で切れており確認できなかった。"}}, {"id": "jr27", "rank": 27, "headline": "LLM補助の分類が開示研究を歪める危険", "title": "Large Language Models as Research Assistants: The Risk of Topic-Overclassification in Financial Disclosure Research", "url": "https://doi.org/10.1016/j.bar.2026.101986", "authors": "Anne d'Arcy ほか", "venue": "The British Accounting Review", "date": "2026-10-10", "citescore": 10.4, "citescore_year": "2025", "apa": "d’Arcy, A., Haas, C., & Wallner, N. (2026). Large Language Models as Research Assistants: The Risk of Topic-Overclassification in Financial Disclosure Research. The British Accounting Review, 101986. https://doi.org/10.1016/j.bar.2026.101986", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ", "preprint": false, "short": true, "p1": "財務開示の主題分類にLLMを研究助手として使うとき、過剰に分類してしまう危険を人間の助手との比較で特定した（抄録）。", "p3": "OpenAIのGPT-4oを、潜在ディリクレ配分（LDA）と人間の研究助手と比べ、アナリストレポートの中のM&A関連の内容を同定する性能を評価する。会計研究では、開示に基づく構成概念をテキストから導くときに測定の妥当性が問題になる（抄録）。", "p5": "文書ごとのプロンプトを使うLLMは、LDAより解釈しやすい主題を生成する。しかしGPT-4oは高いが人間の研究助手より低い信頼性を示す。この差は主題の過剰分類の危険を反映しており、人間の合意による基準と比べてGPT-4oはより包摂的な分類の傾向を持ち、文脈上もっともらしいが無関係なテキストを主題に関連ありと分類しやすくなる（抄録）。", "fun": "論文のためにテキストを分類する作業は、かつて大学院生が手でやっていた。LLMに任せれば速いが、この研究が見つけたのは「関係がありそうに見えるものまで拾ってしまう」癖である。人間の合意を基準にすると、GPT-4oは広く取りすぎる。測定が広がると、作った変数の意味が薄まる。速さと引き換えに何を失うかを数字で示した研究である。", "unverified": "信頼性の具体的な数値、頑健性検定の内容。本文が入手できず確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "ESG開示の先にある信頼性を測る", "title": "Accountability Beyond ESG Disclosure: Credibility, Governance Integrity, and the Sustainability‐Signaling Gap in European Finance", "url": "https://doi.org/10.1002/csr.71070", "authors": "K. Ragazou", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-11", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Ragazou, K. (2026). Accountability Beyond ESG Disclosure: Credibility, Governance Integrity, and the Sustainability‐Signaling Gap in European Finance. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71070", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "ESGの評価を開示量ではなく、発信された持続可能性の信号と実質的な成果の一致度で測る方法を作った（抄録）。", "p3": "ESGガバナンスを説明責任に駆動される過程として概念化し、「持続可能性のシグナリング・ギャップ」をESGの信頼性の定量的な尺度として導入する。シグナリング理論と正統性理論に基づき、ファジィの多基準意思決定（MCDM）の枠組みを組む。これはファジィbest–worst法、妥協解に基づく代替案の測定と順位づけのモデル、診断的な持続可能性ギャップ指数（SGI）を組み合わせる（抄録）。", "p5": "枠組みは、欧州の377の上場企業を代表する標本に適用される。それ以降の結果は、抄録が途中で切れており未確認（抄録）。", "fun": "ESG評価は「どれだけ開示したか」で点が付きやすい。だから報告書を厚くすれば点が上がるという本末転倒が起きる。この研究が提案するのは、開示で発した信号と実際の成果の食い違いを測る指標である。食い違いが大きければ、言っていることと実態が離れている。評価の物差しを量から整合性に移す発想で、グリーンウォッシュを数値化する試みと言える。", "unverified": "377社への適用の結果、SGIの計算式。抄録が途中で切れており確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "スマートなサービス失敗と回復の枠組み", "title": "A Novel Framework for Smart Service Failure and Recovery", "url": "https://doi.org/10.1007/s13132-026-03491-9", "authors": "Yuval Cohen ほか", "venue": "Journal of the Knowledge Economy", "date": "2026-10-12", "citescore": 8.0, "citescore_year": "2025", "apa": "Cohen, Y., & Rozenes, S. (2026). A Novel Framework for Smart Service Failure and Recovery. Journal of the Knowledge Economy. https://doi.org/10.1007/s13132-026-03491-9", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ", "preprint": false, "short": true, "p1": "サービスの失敗と回復の研究を、スマートな保全と知識ベースの能力を使う7つのモジュールの枠組みとして組み直した（抄録）。", "p3": "従来のサービス失敗と回復（SFR）の接近法が基本的な調査とシナリオ型の実験に偏っていることに対し、インダストリー4.0、AIによる意思決定支援、デジタルサービスシステムといった関連分野の進展を取り込む。提案する枠組みは7つのモジュール（監視、予測と予防、サービス失敗の検知、失敗の報告、診断、予後、治癒の支援）から成る（抄録）。", "p5": "各モジュールの主要な機能と活動を描き、モジュール間の情報の流れを明らかにし、サービス提供者・顧客との接面を示す。それ以降の内容は、抄録が途中で切れており未確認（抄録）。", "fun": "サービスの失敗の研究は、「こういう謝り方をすると許される」といったシナリオ実験が中心だった。この論文が持ち込むのは、工場の設備保全の考え方である。常時監視して、壊れる前に予測し、壊れたら診断して、回復の見通しを立てる。人間相手のサービスを機械の保全として設計し直すのは乱暴にも見えるが、失敗を偶発事ではなく管理対象として扱う点に筋がある。", "unverified": "7モジュールの詳細な定義、事例への適用。抄録が途中で切れており確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "店内の五感体験が購買行動を動かす", "title": "Retail as experience: the role of in-store sensory engagement in consumer behaviour", "url": "https://doi.org/10.1080/17543266.2026.2744642", "authors": "Jung-Hwan Kim", "venue": "International Journal of Fashion Design, Technology and Education", "date": "2026-10-12", "sjr": 0.547, "citescore": 5.8, "citescore_year": "2025", "apa": "Kim, J.-H. (2026). Retail as experience: the role of in-store sensory engagement in consumer behaviour. International Journal of Fashion Design, Technology and Education, 1–13. https://doi.org/10.1080/17543266.2026.2744642", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、小売を体験として捉え、店内の感覚的な関与が消費者行動に果たす役割を論じる研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "ネット通販で何でも買える時代に、わざわざ店に行く理由は何か。この題名が示すのは、商品そのものではなく店の中で受け取る感覚、つまり照明、音、匂い、手ざわりだという見方である。考えてみると、画面では値段と写真しか比べられない。感覚でしか伝わらないものが店の役割として残る、という整理は小売の設計に直結する。", "unverified": "研究の方法、対象、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr31", "rank": 31, "headline": "F1ファン化を導く21の社会化経路", "title": "Drive to Survive or Good Old Family Ties? How Sport Consumers in the US and UK Get Socialized Into Formula 1 Fandom", "url": "https://doi.org/10.1177/21674795261498174", "authors": "Jan Boehmer", "venue": "Communication and Sport", "date": "2026-10-12", "sjr": 1.151, "citescore": 8.0, "citescore_year": "2025", "apa": "Boehmer, J. (2026). Drive to Survive or Good Old Family Ties? How Sport Consumers in the US and UK Get Socialized Into Formula 1 Fandom. Communication & Sport. https://doi.org/10.1177/21674795261498174", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "F1のファンになる経路を21の社会化の担い手として同定し、米国と英国で何が違うかを示した（抄録）。", "p3": "消費者社会化理論に基づき、異なる2つの国のスポーツ空間で消費者がF1ファンになる経路（社会化の担い手）を同定する。英国と米国の参加者を比べ、どの担い手が報告されるか、ファンになった時期がいつかを調べる（抄録）。", "p5": "英国の参加者は親とテレビ放送をファン化の源として報告しやすく、人生のより早い時期からこのスポーツを追い始めていた。一方、米国の参加者では友人とNetflixの番組『Drive to Survive』がより多く見られる社会化の担い手だった。分析は、個々の担い手の重要性が主に消費者の人生段階に依存するが、どの人生段階でそのスポーツに接しやすいか、したがってどの担い手が役割を果たしやすいかは、そのスポーツが国のスポーツ空間で占める位置に大きく依存すると示す（抄録）。", "fun": "同じスポーツのファンでも、入り口は国によって違う。英国では親とテレビ、米国では友人とNetflixのドキュメンタリー。この違いの説明が巧みで、「どの担い手が効くか」は人生のどの段階で出会うかで決まり、その段階は、そのスポーツがその国でどれだけ身近かで決まるという二段構えになっている。文化の違いを人生の時間軸に翻訳している。", "unverified": "標本の規模と抽出方法、21の担い手の一覧。本文が入手できず確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "投影不要の一体型SPHで非圧縮流を解く", "title": "A projection-free monolithic SPH formulation for incompressible flows using variational multiscale stabilization", "url": "https://doi.org/10.1016/j.cma.2026.119471", "authors": "Shodai Okano ほか", "venue": "Computer Methods in Applied Mechanics and Engineering", "date": "2026-10-12", "sjr": 2.323, "citescore": 13.7, "citescore_year": "2025", "apa": "Okano, S., Asai, M., Morikawa, D. S., Fujioka, S., & Ge, L. (2027). A projection-free monolithic SPH formulation for incompressible flows using variational multiscale stabilization. Computer Methods in Applied Mechanics and Engineering, 464, 119471. https://doi.org/10.1016/j.cma.2026.119471", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "題名検索で見つけたCrossrefの記録から抄録を取得して読んだ", "preprint": false, "short": true, "p1": "非圧縮のSPH（粒子法）で、速度と圧力を分離せずに一体で解く、射影を使わない安定化された定式化を示した（抄録）。", "p3": "従来の非圧縮SPHは分数ステップまたは射影の手法に基づくため、分離の誤差が入り、境界条件がしばしば問題になる圧力のポアソン方程式に依存し、時間的な安定性が限られる。これに対し、残差に基づく変分マルチスケール（VMS）安定化を一体型のSPH定式化に導入し、速度と圧力を同時に解く（抄録）。", "p5": "これにより、完全陰解法の中で非圧縮性と境界条件を代数的に直接課せるようになる。定式化は、2階微分を一貫して評価するために最小二乗SPH作用素を取り込む。これは解くうえで本質的な要素とされる。それ以降の検証結果は、抄録が途中で切れており未確認（抄録）。", "fun": "水の流れを粒子の集まりとして計算する粒子法では、ふつう「まず速度を進めて、あとで圧力で辻褄を合わせる」という2段構えを取る。この2段の切り分けが誤差と不安定さの元になっていた。この研究は速度と圧力を同時に解くことで分離をやめ、代わりに安定化の項を足す。手順を減らして項を増やすという、計算力学でよくある取り替えである。", "unverified": "検証例と精度、計算コストの比較。抄録が途中で切れており確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "難聴の自覚が介護の成否を分ける", "title": "Effect of Recognition of Hearing Loss Among Care Recipients on Caregiver Reported Care Outcomes", "url": "https://doi.org/10.1111/jgs.70756", "authors": "Gianna Rodriguez ほか", "venue": "Journal of the American Geriatrics Society", "date": "2026-10-12", "sjr": 1.711, "citescore": 7.0, "citescore_year": "2025", "apa": "Rodriguez, G., Zhang, W., Garcia Morales, E. E., Reed, N. S., & Powell, D. S. (2026). Effect of Recognition of Hearing Loss Among Care Recipients on Caregiver Reported Care Outcomes. Journal of the American Geriatrics Society. https://doi.org/10.1111/jgs.70756", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "被介護者が自分の難聴を自覚しているかどうかが、介護者の負担と心理社会的なwell-beingと関連するかを調べた（抄録）。", "p3": "NHATSとNSOCの第13波（2023年）のデータを使い、960名の高齢者を支える介護者1,480名を分析する。難聴の状態を3つに分ける。自覚のない難聴（聴力検査では難聴だが自己報告の困難なし）、自覚のある難聴（聴力検査の難聴に自己報告の困難または補聴器の使用が伴う）、難聴なし（正常な聴力）である（抄録）。", "p5": "介護者側の成果は、情緒的・財政的・身体的な負担、関係の質、PHQ-4によるwell-being、余暇と社会活動の制限である。さらに難聴の重症度と補聴器の使用による違いも検討する。具体的な結果は、抄録が途中で切れており未確認（抄録）。", "fun": "耳が聞こえにくくなっても、本人が自覚していない場合がある。すると家族は「返事をしない」「話を聞かない」と受け取ってしまう。この研究が巧みなのは、聴力検査の結果と本人の自覚を組み合わせて3つに分けたこと。検査で難聴なのに自覚がない人を介護する場合が、最も意思疎通が難しいはずだという仮説が立つ。測り方の設計で問いが鋭くなっている。", "unverified": "3群間の比較の結果、効果の大きさ。抄録が途中で切れており確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "高齢者の孤立に地域機関はどう取り組むか", "title": "Social Engagement Programs of Area Agencies on Aging: Understanding Efforts to Reduce Social Isolation and Loneliness Among Older Adults", "url": "https://doi.org/10.1177/07334648261496751", "authors": "Prayas Gautam ほか", "venue": "Journal of Applied Gerontology", "date": "2026-10-11", "citescore": 5.2, "citescore_year": "2025", "apa": "Gautam, P., Menne, H. L., Singer, K. J., Wilson, T., & Hanley, M. (2026). Social Engagement Programs of Area Agencies on Aging: Understanding Efforts to Reduce Social Isolation and Loneliness Among Older Adults. Journal of Applied Gerontology. https://doi.org/10.1177/07334648261496751", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "高齢者の社会的孤立と孤独に地域の高齢者支援機関がどう取り組んでいるかを、全国調査で類型と連携の構造として記述した（抄録）。", "p3": "米国の高齢者サービスの主要な地域インフラであるArea Agencies on Aging（AAA）の2025年の全国調査（n=449）のデータを分析する。記述統計で事業と連携の普及率をまとめ、Bonferroni調整を当てた項目単位のPearsonのカイ二乗検定で、農村と非農村の機関を比べる（抄録）。", "p5": "ほとんどのAAAは複数の社会参加の事業を提供しており、よく見られるのはボランティアの参加（66.0%）、芸術・創作活動（62.2%）、訪問・電話の事業（57.7%）、技術の活用（55.5%）である。非農村のAAAは、訪問・電話の事業と技術を使う事業を提供しやすい。それ以降の結果は抄録が途中で切れており未確認（抄録）。", "fun": "高齢者の孤立は健康に悪いと分かっているが、では現場の機関は実際に何をしているのか。この調査で分かったのは、ボランティア、芸術活動、訪問や電話、技術の活用という順。訪問や電話の事業が農村で少ないのは意外に思えるが、移動距離を考えれば納得できる。孤立しやすい場所ほど、手が届きにくいという構造が数字に出ている。", "unverified": "連携の構造の詳細、農村・非農村差の検定結果。抄録が途中で切れており確認できなかった。"}}, {"id": "jr35", "rank": 35, "headline": "地域の困窮が祖父母介護者の健康を削る", "title": "Location, Location, Location: How Community Distress Shapes Physical and Mental Health Outcomes for Caregiving Grandparents", "url": "https://doi.org/10.1177/07334648261496747", "authors": "Margaret L. Ralston ほか", "venue": "Journal of Applied Gerontology", "date": "2026-10-11", "citescore": 5.2, "citescore_year": "2025", "apa": "Ralston, M., Nadorff, D. K., Mason, A., & Shillingsburg, L. (2026). Location, Location, Location: How Community Distress Shapes Physical and Mental Health Outcomes for Caregiving Grandparents. Journal of Applied Gerontology. https://doi.org/10.1177/07334648261496747", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "孫を育てる祖父母の健康について、地域の困窮が経済的なwell-beingを介して効く経路が、資源へのアクセスによって変わるかを調べた（抄録）。", "p3": "孫を育てる祖父母439名の標本で、まず潜在クラス分析により資源へのアクセスの類型を同定する。次に調整媒介分析で、経済的なwell-beingが地域の困窮と健康の関係を媒介するか、そしてこの間接効果が資源アクセスの類型によって変わるかを検定する（抄録）。", "p5": "著者は、地域の困窮が経済的なwell-beingを介して健康に至る関係が、（抄録はここで途中で切れており、どの類型でどう変わるかの具体は未確認）。地域の文脈として、地域の困窮と介護に必要な主要な資源への知覚されたアクセスという2つの次元を扱っている（抄録）。", "fun": "孫を育てる祖父母の健康は、経済的な余裕と強く関係する。この研究が加えたのは「どこに住んでいるか」である。同じ収入でも、近くに病院や支援があるかで話が変わる。しかも資源の有無は単純な多寡ではなく、何が揃っているかの型として捉えられている。潜在クラス分析でその型を取り出し、地域と経済と健康の関係を層ごとに見る設計になっている。", "unverified": "資源アクセスの類型の内容、調整媒介の結果。抄録が途中で切れており確認できなかった。"}}, {"id": "jr36", "rank": 36, "headline": "障害のある人の主観的な住みよさを測る", "title": "Advancing Understanding of Subjective Liveability for People With Disability", "url": "https://doi.org/10.1002/ajs4.70144", "authors": "Maria Hobbs ほか", "venue": "Australian Journal of Social Issues", "date": "2026-10-11", "citescore": 3.8, "citescore_year": "2025", "apa": "Hobbs, M., Jose, K., Owen, C., & Cleland, V. (2026). Advancing Understanding of Subjective Liveability for People With Disability. Australian Journal of Social Issues. https://doi.org/10.1002/ajs4.70144", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ", "preprint": false, "short": true, "p1": "障害のある人が住みよい近隣に何を期待しているかを、当事者の経験に基づく質的研究から4つの主題として取り出した（抄録）。", "p3": "タスマニアの都市部と農村部で、多様な障害経験のある成人を対象に、当事者の生きられた経験に導かれた探索的な質的デザインを用いる。参加者が自ら撮影した写真と、それを手がかりにした引き出し面接（elicitation interview）を行い、主に帰納的な主題分析で4つの主題と8つの下位主題を同定する（抄録）。", "p5": "近隣の安定性と予測可能性が高く評価され、移動と運動を支えるインフラ、プライマリケアへのアクセスがそれに並ぶ。本物の相互作用による社会的包摂は帰属感を育てるが、障害を中心に据えた接し方は気落ちさせるものだった。既存の住みよさの枠組みは、建造・自然・社会・経済の環境を公平性に基づく指標で扱うものの、障害のある人の視点を見落としがちだと位置づけられている（抄録）。", "fun": "「住みよい街」の指標は、公園の面積や病院までの距離で測られることが多い。この研究が当事者に写真を撮ってもらって聞き出したのは、まず「変わらないこと、見通しが立つこと」だった。工事で歩道がふさがる、店の配置が変わる。健常者には些事でも、移動の計画が崩れる人がいる。もう一つ印象的なのは、障害を前提にした親切な接し方が歓迎されなかったこと。", "unverified": "参加者数、4つの主題の完全な内容。本文が入手できず確認できなかった。"}}, {"id": "jr37", "rank": 37, "headline": "連続地震と液状化を依存構造込みで評価", "title": "Resilience assessment of pile-supported wharves under the effects of sequential earthquake and soil liquefaction incorporating vine copula captured dependence", "url": "https://doi.org/10.1016/j.oceaneng.2026.128701", "authors": "Muhammad Irslan Khalid ほか", "venue": "Ocean Engineering", "date": "2026-10-12", "sjr": 1.524, "citescore": 10.2, "citescore_year": "2025", "apa": "Khalid, M. I., Qi, M., Javaid, O., Rehman, S. U., Fei, J., Khalid, M. S., & Ali, A. (2026). Resilience assessment of pile-supported wharves under the effects of sequential earthquake and soil liquefaction incorporating vine copula captured dependence. Ocean Engineering, 369, 128701. https://doi.org/10.1016/j.oceaneng.2026.128701", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、連続して起きる地震と液状化の影響のもとで杭式桟橋の回復力を、vine copulaで捉えた依存構造を取り込んで評価する研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "大きな地震のあとには余震が続く。1回で壊れなくても、弱った構造に次が来れば結果が変わる。さらに地盤が液状化すれば杭の支えが失われる。難しいのは、これらが互いに無関係ではないこと。題名のvine copulaは、複数の不確実な量の依存関係を部分ごとに組み上げる統計の道具で、「同時に起きやすさ」を扱うために持ち込まれたのだろう。", "unverified": "手法の内容、対象構造、評価結果のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr38", "rank": 38, "headline": "AIで熟議を拡張する設計と評価", "title": "Advancing Deliberation with AI: Architecture, Evaluation, and Simulation", "url": "https://doi.org/10.1609/aies.v9i4.43366", "authors": "Maurice Flechtner", "venue": "Proceedings of the AAAI/ACM Conference on AI, Ethics, and Society", "date": "2026-10-11", "apa": "Flechtner, M. (2026). Advancing Deliberation with AI: Architecture, Evaluation, and Simulation. Proceedings of the AAAI/ACM Conference on AI, Ethics, and Society, 9(4), 2923–2924. https://doi.org/10.1609/aies.v9i4.43366", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。博士研究の概要であり単独の実証研究ではない", "preprint": false, "short": true, "p1": "熟議民主主義を大規模化するうえで、LLMをはじめとする技術が何を助け何を損なうかを、設計・測定・評価の3つの筋で扱う研究計画を示した（抄録）。", "p3": "熟議理論、計算社会科学、機械学習を組み合わせ、熟議の民主的・認識的な便益をより大きな公衆に広げられるかを、その便益を可能にしている条件を損なわない形で問う（抄録）。", "p5": "累積型の学位論文は3つの連動する筋から成る。(i)現実の制約のもとで熟議を大規模化するための規範的・構築的な枠組み、(ii)熟議的理性指数（Deliberative Reason Index, DRI）によって熟議の帰結を測る自動化されたパイプライン、(iii)LLMエージェントを熟議の参加者として評価する実証的なベンチマークである（抄録）。", "fun": "大勢で話し合って決めるのは良いことだとされるが、人数が増えると話し合いにならない。この研究が狙うのは、AIで人数の壁を越えつつ、話し合いの質を落とさないことである。注目したいのは3本目の柱で、LLM自身を熟議の参加者として評価する。道具として使うだけでなく、議論の相手としてどれだけ使えるかを測る発想である。", "unverified": "DRIの定義と検証、ベンチマークの結果。本文が入手できず確認できなかった。"}}, {"id": "jr39", "rank": 39, "headline": "報酬1本から社会的熟議への整合へ", "title": "AI Alignment Without Representation: From Scalar Rewards to Social Deliberation", "url": "https://doi.org/10.1609/aies.v9i2.43204", "authors": "Majid Ghasemi ほか", "venue": "Proceedings of the AAAI/ACM Conference on AI, Ethics, and Society", "date": "2026-10-11", "apa": "Ghasemi, M., & Crowley, M. (2026). AI Alignment Without Representation: From Scalar Rewards to Social Deliberation. Proceedings of the AAAI/ACM Conference on AI, Ethics, and Society, 9(2), 1034–1046. https://doi.org/10.1609/aies.v9i2.43204", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "AIの幻覚と道徳的な漂流を、別々の病理ではなく「フィードバックの崩壊」という単一の構造的原因から説明する枠組みを提示した（抄録）。", "p3": "フィードバックの崩壊は、複雑で多元的な人間の価値が、地理的に集中した注釈作業者の労働によって静的なスカラー報酬に圧縮され、オフラインで凍結されるときに起こる。これにより、影響を受ける共同体が規範の決着から排除される民主的な欠損が生じ、同時に訓練の信号が真理と正しさという潜在的な目的から切り離される（抄録）。", "p5": "著者は、フィードバックの整合性を回復する枠組みとして社会的強化学習（Social RL）を提案する。エージェントを環境の中に位置づけることで（抄録はここで途中で切れており、具体的な仕組みは未確認）。人間のフィードバックからの強化学習が広く採用されているにもかかわらず、幻覚と道徳的な漂流という2つの失敗が残ることが出発点である（抄録）。", "fun": "AIが嘘をつくことと、長く使われるうちに有害な方向に寄ることは、別の問題として扱われてきた。この論文は同じ原因だと言う。多様な人の価値観を「良い・悪い」の1つの数字に潰し、それを特定の地域の作業者が付けて、しかも凍結する。その圧縮の過程で、真理も正しさも抜け落ちる。原因を1つに絞る主張は乱暴に見えて、検証の的を作る役には立つ。", "unverified": "Social RLの具体的な仕組み、実証的な裏づけ。抄録が途中で切れており確認できなかった。"}}, {"id": "jr40", "rank": 40, "headline": "LLM補助コーディングと精読を組み合わせる", "title": "Making the diversity of CCI-related LEADER interventions comparable: A portfolio-to-case approach combining LLM-assisted coding and close reading", "url": "https://doi.org/10.1016/j.jrurstud.2026.104467", "authors": "Wang Tongjing ほか", "venue": "Journal of Rural Studies", "date": "2026-10-11", "sjr": 1.731, "citescore": 10.9, "citescore_year": "2025", "apa": "Tongjing, W., Torre, A., & Filippi, M. (2026). Making the diversity of CCI-related LEADER interventions comparable: A portfolio-to-case approach combining LLM-assisted coding and close reading. Journal of Rural Studies, 128, 104467. https://doi.org/10.1016/j.jrurstud.2026.104467", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "多様で比較しにくい地域振興事業を、LLM補助のコーディングと精読を組み合わせて、全体像と個別事例の両方から見られるようにした（抄録）。", "p3": "EUのLEADERプログラムは多様な農村の地域主導の取り組みを支援するため、文化創造産業（CCI）に関わる活動とは相性が良い反面、体系的な比較と学習が難しい。そこでLLM補助のコーディングと比較的な精読を組み合わせる「ポートフォリオから事例へ」の接近法を作る（抄録）。", "p5": "EU CAP NetworkのGood Practiceデータベースの1,528の事業記述を、主題分野・課題・行動・主体・地域スケールの5つの次元でコーディングした。LEADERのタグが付いた403事業のうち135がCCI関連と同定された。コーディングで得られた共通の事業類型が、56事例の構造化された比較を導く。それ以降の結果は、抄録が途中で切れており未確認（抄録）。", "fun": "補助金の事業報告は何千件もあり、一つずつ読めば中身は分かるが全体の傾向は見えない。逆に集計すれば傾向は出るが、現場の違いが消える。この研究はLLMで全件に型を付け、その型を道案内にして56件を人間が精読する。機械の広さと人間の深さを、順番に使うという設計。質的研究の規模の壁を越える現実的な解き方である。", "unverified": "5次元のコーディングの妥当性検証、56事例の比較の結論。抄録が途中で切れており確認できなかった。"}}, {"id": "jr41", "rank": 41, "headline": "コードブックを二択質問に変えて枠組み検出", "title": "From Codebooks to Scalable Frame Detection with LLMs: A Zero-Shot Approach via Binary Questions", "url": "https://doi.org/10.5117/ccr2026.1.12.olie", "authors": "Juan Sebastian Olier", "venue": "Computational Communication Research", "date": "2026-10-12", "sjr": 1.542, "citescore": 7.1, "citescore_year": "2025", "apa": "Olier, J. S. (2026). From Codebooks to Scalable Frame Detection with LLMs: A Zero-Shot Approach via Binary Questions. Computational Communication Research, 8(1), 1–37. https://doi.org/10.5117/ccr2026.1.12.olie", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、既存のコードブックを二択の質問に変換することで、LLMにゼロショットでフレーム（枠づけ）を検出させる手法の提案だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "報道が同じ出来事を「経済の問題」として書くか「安全の問題」として書くかという枠づけの分析は、研究者が分類の手引き（コードブック）を作って手で分類してきた。題名が示す工夫は、その手引きを「これは経済の枠づけですか、はい／いいえ」という二択の列に組み替えること。複雑な判断を単純な質問に分けると機械が答えやすくなる、という発想の転換である。", "unverified": "手法の内容、評価の方法と精度のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr42", "rank": 42, "headline": "AIペルソナの再帰的省察の限界", "title": "(A)I Reflect ; Therefore, (A)I am ( Not ): Synthetic, Procedural Reflexivity and the Limits of Agentic-AI-Persona-Generated Epistemology", "url": "https://doi.org/10.1080/10447318.2026.2740325", "authors": "Shahnaz Bashir", "venue": "International Journal of Human–Computer Interaction", "date": "2026-10-12", "citescore": 10.1, "citescore_year": "2025", "apa": "Bashir, S. (2026). (A)I Reflect ; Therefore, (A)I am ( Not ): Synthetic, Procedural Reflexivity and the Limits of Agentic-AI-Persona-Generated Epistemology. International Journal of Human–Computer Interaction, 1–28. https://doi.org/10.1080/10447318.2026.2740325", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、エージェント型のAIペルソナが生み出す知識の限界を、合成的で手続き的な「省察」という観点から論じる研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名はデカルトの「我思う、ゆえに我あり」をひねって、「AIは省察する、ゆえにAIは（ない）」と書いている。AIに「あなたはどう考えますか」と聞けば、省察しているような文章が返る。しかしそれは手続きとして省察の形を真似ているだけで、省察する主体がいるわけではない。にもかかわらずその出力を知識として扱うとどうなるか、という問いが立つ。", "unverified": "論証の内容、対象、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr43", "rank": 43, "headline": "臨床記録の構造化でLLMと人間を比べる", "title": "Large Language Models for Information Extraction from Neurosurgical Clinical Notes: A Benchmark Against Human Auditors", "url": "https://doi.org/10.3390/make8100328", "authors": "Aldo Spolaore ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-10-12", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "apa": "Spolaore, A., Scholl, J., Gkampenis, A., Machetanz, K., Tatagiba, M., & Naros, G. (2026). Large Language Models for Information Extraction from Neurosurgical Clinical Notes: A Benchmark Against Human Auditors. Machine Learning and Knowledge Extraction, 8(10), 328. https://doi.org/10.3390/make8100328", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "非構造の診療記録から臨床変数を抽出する作業で、LLMのゼロショット抽出を2名の人間監査者と比べられるようにした（抄録）。", "p3": "微小血管減圧術を受けた211名の患者の、匿名化したドイツ語の診療記録881件を分析し、術前症状・術後合併症・疾患経過の3領域にわたる15の二値変数を事前に定義して抽出する。6つのLLM（クラウド型のGPT-4o、o3-mini、Claude Sonnet 3.5、Gemini 2.0 Flashと、ローカルのllama 3.3、deepseek-r1）を、患者記録ごとに3回の実行で評価する（抄録）。", "p5": "出力は、臨床医が裁定した参照基準に対して、2名の独立した人間監査者と比べられる。具体的な一致度や正確さの数値は、抄録が途中で切れており未確認（抄録）。", "fun": "カルテから「術後に合併症があったか」などを拾い出す作業は、臨床研究の最初の山で、人手だと遅く、担当者で結果がばらつく。この研究はそれを6つのLLMにやらせ、人間2名と並べて、別の臨床医が決めた正解と照合する。比較の相手が「人間の正解」ではなく「人間も間違う」ことを前提にした設計になっている点が公平である。", "unverified": "一致度と正確さの数値、モデル間の差。抄録が途中で切れており確認できなかった。"}}, {"id": "jr44", "rank": 44, "headline": "AI計画権限の説明責任を制度設計する", "title": "Accountability as Infrastructure: A Design Theory of AI-Enabled Planning Authority", "url": "https://doi.org/10.1080/01944363.2026.2737811", "authors": "Zhong-Ren Peng", "venue": "Journal of the American Planning Association", "date": "2026-10-12", "sjr": 1.697, "citescore": 8.4, "citescore_year": "2025", "apa": "Peng, Z.-R. (2026). Accountability as Infrastructure: A Design Theory of AI-Enabled Planning Authority. Journal of the American Planning Association, 1–14. https://doi.org/10.1080/01944363.2026.2737811", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、AIが関わる都市計画の権限について、説明責任をインフラとして設計する理論を立てる研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "都市計画にAIを使うと、誰が決めたのか分からなくなる。システムが出した案を担当者が通し、問題が起きたときに責任の所在が宙に浮く。題名が「説明責任をインフラとして」と言うのは、後から付け足す説明ではなく、記録の残し方や手続きそのものに組み込むという発想だろう。道路や水道のように、見えないが前提になる仕組みとして設計する。", "unverified": "理論の内容、対象、含意のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr45", "rank": 45, "headline": "交通容量から回復容量への転換", "title": "From traffic-flow capacity to recovery capacity: An episode-based framework for multi-sector urban resilience", "url": "https://doi.org/10.1016/j.trc.2026.106063", "authors": "Fang Tang ほか", "venue": "Transportation Research Part C: Emerging Technologies", "date": "2026-10-12", "sjr": 2.396, "citescore": 15.4, "citescore_year": "2025", "apa": "Tang, F., Zhou, X. (., Zhu, E., Batur, I., Honma, Y., Pendyala, R., & Chen, C. (2027). From traffic-flow capacity to recovery capacity: An episode-based framework for multi-sector urban resilience. Transportation Research Part C: Emerging Technologies, 194, 106063. https://doi.org/10.1016/j.trc.2026.106063", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、交通流の容量という指標から「回復の容量」へ発想を移し、都市の多部門レジリエンスを事象（エピソード）単位で評価する枠組みの提案だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "道路の性能はふつう「1時間に何台通れるか」で測る。ところが災害で止まったときに問われるのは、どれだけ速く元に戻れるかである。題名が示す「回復の容量」という言い換えは、同じ道路を別の物差しで見ることを意味する。平常時の効率と非常時の立ち直りは、設計上しばしば相反する。どちらを測るかで、整備の優先順位が変わる。", "unverified": "枠組みの内容、対象都市、評価結果のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr46", "rank": 46, "headline": "運用費と投資費を合わせた建物費の基準化", "title": "Benchmarking Long-Term Building Running Costs: A Panel Regression Model Integrating Opex and Capex", "url": "https://doi.org/10.3390/buildings16204005", "authors": "Josh Wee Chert Ng", "venue": "Buildings", "date": "2026-10-12", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Ng, J. W. C. (2026). Benchmarking Long-Term Building Running Costs: A Panel Regression Model Integrating Opex and Capex. Buildings, 16(20), 4005. https://doi.org/10.3390/buildings16204005", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "建物の運用費（Opex）と、資産価値向上の投資を含む資本的支出（Capex/AEI）を合わせた長期の運営費用を、縦断的に基準化する枠組みを作った（抄録）。", "p3": "既存のライフサイクルコスティングと業界の費用ベンチマークはOpexの計画を支えるが、恒常的なOpexと、事象的に発生する実現Capexをポートフォリオ水準で統合する手法は未発達だった。そこで時間とともに変化する不動産ポートフォリオを対象に、条件付きの基準化モデルを立てる（抄録）。", "p5": "シンガポールの不動産投資信託（S-REIT）19事業体の2002年から2021年の183の事業体・年観測という不均衡パネルを使い、27の候補説明変数から簡素なパネル定式化へ段階的に絞る。最終的なランダム効果モデルは、恒常的で入手しやすい運用費用の情報を明示的な基準化の錨として使い、ポートフォリオの特性と合わせる。それ以降の結果は、抄録が途中で切れており未確認（抄録）。", "fun": "建物の維持費を見積もるとき、毎年かかる清掃や電気代は計画しやすいが、10年に1度の大規模改修は読みにくい。だから両方を足した本当の負担が分からない。この研究は、毎年の運用費を手がかりにして、ばらついて発生する投資まで含めた長期費用の基準を作る。読みやすい数字から読みにくい数字を予測するという、実務的な順序になっている。", "unverified": "最終モデルの係数と説明力、27候補変数の内容。抄録が途中で切れており確認できなかった。"}}, {"id": "jr47", "rank": 47, "headline": "長期病休前に要求と資源が分岐する", "title": "Diverging trajectories of job demands, job resources, and psychological distress before long-term mental health-related sick leave among teachers", "url": "https://doi.org/10.5271/sjweh.4337", "authors": "Fumio Kobayashi ほか", "venue": "Scandinavian Journal of Work, Environment and Health", "date": "2026-10-12", "sjr": 1.598, "citescore": 7.8, "citescore_year": "2025", "apa": "Kobayashi, F., & Narisada, A. (2026). Diverging trajectories of job demands, job resources, and psychological distress before long-term mental health-related sick leave among teachers. Scandinavian Journal of Work, Environment & Health. https://doi.org/10.5271/sjweh.4337", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、教員が精神的な理由で長期の病気休暇に入る前に、仕事の要求度・資源・心理的苦痛の軌跡が分岐していくことを示す研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "心を病んで長期に休む人は、ある日突然そうなるわけではない。だから休む前の数年を遡って見れば、何かが変わり始める時点があるはずである。題名の「軌跡の分岐」は、休んだ人と休まなかった人の線がどこで離れ始めるかを探すという意味だろう。結果だけを比べる研究と違い、予防の手がかりが「いつ」として得られる設計である。", "unverified": "データ、追跡期間、分岐の時点のすべて。抄録も本文も入手できなかった。"}}, {"id": "jr48", "rank": 48, "headline": "AIへの期待と不安が従業員の幸福を左右", "title": "Artificial intelligence at work: Balancing opportunity and fear in shaping employee well-being in the IT sector", "url": "https://doi.org/10.1177/10519815261493103", "authors": "Eimad Hafeez Gogia ほか", "venue": "WORK: A Journal of Prevention, Assessment & Rehabilitation", "date": "2026-10-12", "citescore": 2.9, "citescore_year": "2025", "apa": "Gogia, E. H., Shao, Z., Khan, M. A., Gao, T., & Vajna, I. (2026). Artificial intelligence at work: Balancing opportunity and fear in shaping employee well-being in the IT sector. WORK: A Journal of Prevention, Assessment & Rehabilitation. https://doi.org/10.1177/10519815261493103", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "AIを機会と見るか失業のリスクと見るかが、認知的な再評価を介して職場のwell-beingにどう効くかを調べた（抄録）。", "p3": "資源保存理論（conservation of resources theory）に基づき、AIを機会と見る従業員がより良い職場のwell-beingを報告し、適応的な思考力を高く示すかを検討する。逆に失業リスクの知覚は、認知的な再評価の困難と結びつき、それがwell-beingの低下と相関すると想定する（抄録）。", "p5": "イスラマバードとラーワルピンディーの専門職201名を対象に、便宜抽出と構造方程式モデリング（SPSSとSmartPLSで分析）で構成概念間の関係を評価する。特に雇用の不安定さとwell-beingの関係に注目し、AIが価値ある道具と同時にストレス源としても経験される仕組みを理解しようとする。具体的な係数は抄録が途中で切れており未確認（抄録）。", "fun": "職場にAIが入ってくると、便利だと思う人と仕事を失うと怖がる人がいる。この研究の見立ては、その違いが「状況を捉え直す力」を通じて幸福度に効くというもの。機会と見る人は捉え直す余裕があり、脅威と見る人は余裕を失う。同じ技術が同じ職場で正反対に働く理由を、心の資源という考え方で説明している。", "unverified": "推定された係数、構成概念の測定尺度。抄録が途中で切れており確認できなかった。"}}, {"id": "jr49", "rank": 49, "headline": "誰と精緻化するかで多文化チームが変わる", "title": "With whom you elaborate matters: how learning orientation impacts cross-culture and same-culture information elaboration in culturally diverse teams", "url": "https://doi.org/10.1007/s10869-026-10161-9", "authors": "Yongkang Yang ほか", "venue": "Journal of Business and Psychology", "date": "2026-10-12", "sjr": 2.563, "citescore": 10.6, "citescore_year": "2025", "apa": "Yang, Y., van Knippenberg, D., Pieterse, A. N., & Li, J. (2026). With whom you elaborate matters: how learning orientation impacts cross-culture and same-culture information elaboration in culturally diverse teams. Journal of Business and Psychology. https://doi.org/10.1007/s10869-026-10161-9", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "文化的に多様なチームの情報の精緻化を、文化の境界をまたぐものと同じ文化の内側のものに分けて測れるようにした（抄録）。", "p3": "文化的多様性が情報の精緻化（課題に関わる情報の交換・議論・統合）を通じてチームの成果を高めうることは示されてきたが、先行研究は精緻化を未分化な過程として扱い、それが文化の境界をまたいで起きるのか内側で起きるのかを特定していなかった。そこで、文化的に異なる成員の間の「文化横断の精緻化」と、似た成員の間の「同文化の精緻化」を区別する視点を立てる（抄録）。", "p5": "文化的に多様な104チーム・587名を対象とした多情報源・多時点の研究で、予想どおり文化横断の精緻化が同文化の精緻化よりチーム成果と強く関連した。さらにチームの学習志向が両方の形の精緻化を予測した。それ以降の結果は、抄録が途中で切れており未確認（抄録）。", "fun": "多様なチームが強いのは、違う知識が混ざるからだと言われる。ところが実際には、似た背景の人同士で固まって話していることも多い。この研究は同じ「議論」を、文化をまたぐものと内側のものに分けて測った。成果に効いたのは、またぐほうだった。多様性があるだけでは足りず、境界を越えて話すかどうかが分かれ目になる。", "unverified": "学習志向の効果の大きさ、調整効果の有無。抄録が途中で切れており確認できなかった。"}}, {"id": "jr50", "rank": 50, "headline": "断続降雨と地盤のばらつきで滑りを予測", "title": "Spatiotemporal evolution and stability criteria of traction-type landslides under intermittent rainfall considering spatial variability of geotechnical parameters", "url": "https://doi.org/10.1016/j.trgeo.2026.102454", "authors": "Xiaoqiang Hou ほか", "venue": "Transportation Geotechnics", "date": "2026-10-12", "sjr": 1.447, "citescore": 9.3, "citescore_year": "2025", "apa": "Hou, X., Huang, W., Li, R., Jia, L., Cheng, L., Zhang, Z., & Du, C. (2026). Spatiotemporal evolution and stability criteria of traction-type landslides under intermittent rainfall considering spatial variability of geotechnical parameters. Transportation Geotechnics, 102454. https://doi.org/10.1016/j.trgeo.2026.102454", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "題名検索で見つけたCrossrefの記録から抄録を取得して読んだ", "preprint": false, "short": true, "p1": "断続的な降雨による地すべりの時空間的な進展を、地盤パラメータの空間的な不均一性を考慮して定量化し、不安定化の予測基準を立てた（抄録）。", "p3": "Karhunen–Loève（K-L）展開でパラメータの確率場を再構成し、点安全率（point safety factor, PSF）の時間履歴の計算と組み合わせる。これにより、断続的な降雨のもとでの地すべりの時空間的な進展を定量化・予測し、斜面の不安定化を予報する基準を立てる（抄録）。", "p5": "抄録の報告では、地盤パラメータの空間変動を取り込み、K-L展開で再構成した確率場とPSFの時間履歴の解析を組み合わせることで、断続的な降雨による牽引型地すべりの時空間的な漸進的進展を細かく描くことができ、その信頼性は実際の工事の事例で有効に検証された。以降の結果項目は抄録が途中で切れており未確認（抄録）。", "fun": "雨が降り続けて地すべりが起きるのではなく、降ってやんでまた降るという繰り返しで起きることが多い。しかも地盤の強さは場所ごとにばらついている。この研究は、そのばらつきを確率の場として表し、場所ごとの安全率が時間とともにどう下がるかを追う。弱いところから少しずつ崩れていく様子が計算の中で再現できる、という組み立てである。", "unverified": "予報基準の具体的な形、事例の検証結果。抄録が途中で切れており確認できなかった。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "求職助言は広めるほど効果が消える", "title": "The Direct and Indirect Effects of Online Job Search Advice", "url": "https://doi.org/10.1093/restud/rdag112", "authors": "Steffen Altmann ほか", "venue": "Review of Economic Studies", "date": "2026-10-09", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "apa": "Altmann, S., Glenny, A. M., Mahlstedt, R., & Sebald, A. (2026). The Direct and Indirect Effects of Online Job Search Advice. Review of Economic Studies. https://doi.org/10.1093/restud/rdag112", "why": "デンマークの公的職業紹介サイトで二段階ランダム化を組み、助言の直接効果と波及効果を分離した。少数に配ると就業と所得が上がるが、配る割合を上げると効果が消え、同じ職業への集中による混雑が原因だと示した。政策の規模そのものが効果を決めるという含意を持つ。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "オンラインの求職助言が、助言を受けた人の就業と所得だけでなく、同じ労働市場の他の求職者への波及まで含めて測れるようになった（抄録）。", "p2": "求職支援の効果は、助言を受けた本人の結果だけ見れば分かるように思える。しかし求人は有限なので、助言を受けた人が同じ職種に集まれば混雑が生じ、本人同士でも他の求職者でも結果が変わりうる。従来の評価はこの波及を測れていなかった（抄録）。", "p3": "デンマークの公的職業紹介サービスのオンラインプラットフォームに大規模なフィールド実験を組み込み、求職者に求人情報と職種の推奨を提供する。鍵は二段のランダム化で、地域ごとに処理の濃度（その地域で何割の求職者が助言を受けるか）を変える。これにより、助言の直接効果と、処理された人の間および処理されていない人への波及を分離できる（抄録）。", "p4": "評価は、求職行動と労働市場の成果（就業と所得）について、処理の濃度
