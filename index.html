<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-03", "intro": "プレプリントの新着263件、学術誌の新着452件（うち上位10%誌300件）、重要論文の候補308件から選びました。プレプリント・関連40報、プレプリント・注目50報、論文誌・関連49報、論文誌・注目23報、オープンデータ21件です。上位10%誌一覧の更新は取得できず（HTTP 404）、9月27日の一覧を使いました。e-Statの新しい公表は候補にありませんでした。関連の部は関連の強い候補に絞り、注目の部（とくに論文誌）は注目分野に当たる候補が少なかったため、件数を減らしています。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "LLMを合成投資家にしてグリーン選好と運用を引き出す", "title": "Green Tastes, Beliefs, and Portfolios: Evidence from Synthetic Investors", "url": "https://doi.org/10.3386/w35982", "authors": "Xindi He ほか", "venue": "NBER Working Paper", "apa": "He, X., & Pastor, L. (2026). Green Tastes, Beliefs, and Portfolios: Evidence from Synthetic Investors (NBER Working Paper No. 35982). National Bureau of Economic Research. https://www.nber.org/papers/w35982", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの記録に登録された抄録を使用（NBERの本文は入手できず）", "preprint": true, "p1": "LLMを「合成の調査回答者」として使い、個人投資家と機関投資家の環境配慮（グリーン）の好み、リターンの見通し、資産配分、投資の動機を引き出し、投資家調査のように分析できることを示した（抄録）。", "p2": "グリーンな資産への傾き（ポートフォリオの偏り）が、本当にグリーンへの好みの強さを表すのかは分からない。この論文は、好み・信念・配分・動機を同じ回答者から同時に引き出し、これを切り分けようとする（抄録）。", "p3": "480の個人投資家と60の機関投資家の人物設定（アイデンティティ）をLLMに与えて回答させる。さらに2014〜2025年の各年の情報環境を、日付を伏せた情報のまとまりを年の間で入れ替えて与え、過去の各時点の調査回答を再構成する（抄録）。", "p4": "再構成した好みと信念の時系列を、実際のデータ（グリーンへの需要の指標と注目度の指標）と照らし合わせて確かめる（抄録）。具体的な評価指標と比較対象は未確認。", "p5": "機関投資家は個人より好みが弱いのに、外部の圧力を理由に、よりグリーンに偏った配分を報告した。個人の好みは主に支持政党で、機関の好みは種類と地域で決まった。ESGの三つの側面で信念が異なり、ガバナンスの高いポートフォリオが上回ると予想された。好みは時間とともにあまり変わらず、グリーンなポートフォリオへの見通しは2020年以降悲観的になった。好みはグリーン需要の指標と、信念は注目度の指標と関係した（抄録）。", "p6": "LLMの回答が実在の投資家の回答をどこまで再現するかは、抄録の範囲では実データとの関係でしか確かめられていない。解釈：人物設定の作り方や、日付を伏せてもLLMの学習データに残る知識の影響は、結果を左右しうる。", "fun": "人に何年も前の気持ちを聞き直すことはできないが、この研究はAIに投資家になりきってもらい、日付を隠した当時の情報を読ませて「その年のアンケート」を再現した。すると機関投資家は、環境への思い入れは弱いのに周りの圧力でグリーンな資産を多く持つと答えた。見かけの行動と本心のずれをAIで探る発想が面白い。", "unverified": "使ったLLMの種類、回答の再現性の検証、各結果の数値の大きさは未確認（本文を入手できず）。"}}, {"id": "pr02", "rank": 2, "headline": "216の投資家ペルソナで市場の意見の割れ方を測る", "title": "The market's mirror: Revealing investor disagreement with LLMS", "url": "https://econpapers.repec.org/RePEc:zbw:cbscwp:344253", "authors": "Bhagwat ほか", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "RePEc（EconPapers）に登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "LLMに216の代表的な投資家のペルソナを与え、ニュースの見出しへの売買判断のばらつきから「投資家の意見の割れ方」を測り、それが実際の取引量を予測することを示した（抄録）。", "p2": "投資家の意見の不一致は取引や価格の形成に重要だが、直接観測するのは難しい。LLMのペルソナでその不一致を測れるかが問い（抄録）。", "p3": "216の投資家ペルソナに、S&P 500企業のニュース見出し125万件それぞれについて買い・保有・売りを答えさせ、同じ見出しへの回答のばらつきを不一致の指標とする（抄録）。", "p4": "不一致の指標がその日と翌日の異常な取引量を予測するかを調べ、LLMの学習データの期限より後の期間でも確かめた。ペルソナの回答が人間の調査の基準と合うか、プロンプトを変えても安定かも検証した（抄録）。", "p5": "不一致は社会的なニュースで最も大きく、ファンダメンタルズのニュースで最も小さかった。不一致は同日と翌日の異常な取引量の増加を予測し、学習期限の後でも成り立った。所得・学歴・年齢による不一致が取引と最も強く関係し、政治的な不一致は最も大きいのに取引との関係は最も弱かった。ペルソナの回答は金銭以外の理由も反映し、人間の調査の基準と一致し、プロンプトの違いにも安定だった（抄録）。", "p6": "抄録の範囲では、ペルソナの作り方、使ったLLM、効果の大きさは未確認。解釈：見出しだけへの反応であり、記事の本文や価格の情報を踏まえた判断とは異なりうる。", "fun": "同じニュースを見ても、若い人と年配の人、所得の高い人と低い人で「買い」か「売り」かの判断は分かれる。この研究はAIに216人の投資家を演じさせ、その割れ方を125万本の見出しで測った。意見が割れたニュースほど翌日まで取引が増えたという結果は、AIの「仮想の世論調査」が市場を映す鏡になりうることを示している。", "unverified": "使ったLLMの種類、ペルソナの属性の組み方、効果の大きさの数値は未確認（本文を入手できず）。"}}, {"id": "pr03", "rank": 3, "headline": "人とAIの協働の効果を自動更新のメタ分析で追う", "title": "AutoAnalysis: An automated, self-updating meta-analysis of human-AI collaboration", "url": "https://arxiv.org/abs/2610.42001", "authors": "Michelle Vaccaro ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Vaccaro, M., Almaatouq, A., & Malone, T. W. (2026). AutoAnalysis: An automated, self-updating meta-analysis of human-AI collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42001", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結果・考察・限界・方法の節と図表キャプション）を読んだ", "preprint": true, "p1": "人とAIの協働の効果を、AIエージェントが文献の検索から効果量の抽出・統合まで自動で行い、新しい研究が出るたびに更新するメタ分析（AutoAnalysis）を作り、最新の結果を示した（抄録、Discussion）。", "p2": "人とAIを組み合わせるべき場面について実証研究の結論は割れており、従来のメタ分析は手作業が多く、急増する新しい証拠を取り込めない（抄録、Introduction）。", "p3": "PRISMAに沿って基準・検索・符号化・主要分析を事前登録し、AIエージェントが検索、選別、全文の精読、抽出、統合を行い定期的に再実行する（Methods、図2）。効果量はHedgesのgで、「人だけ」との差（拡張）と「人だけかAIだけの良い方」との差（相乗効果）を測り、同じ実験からの複数の効果量を三層モデルと頑健分散推定で扱う（Data Analysis）。", "p4": "2026年10月26日時点の420本・1,955の効果量を統合した。相乗効果はAI単独も測った171の効果量で評価し、課題・参加者・過程・研究デザインでメタ回帰を行った（Results、Methods）。", "p5": "人とAIの組み合わせは人だけより良く、g=0.53（95%CI 0.45〜0.61）だった（図3）。一方、良い方の単独と比べるとg=-0.35（95%CI -0.52〜-0.18）で、相乗効果ではなく損失だった。異質性は大きい（I²=92.9%、93.8%）。AI単独の方が強い課題で拡張が大きく、人とAIが作業を分担するときに拡張と相乗効果が大きく、AIが説明を示すと拡張が大きかった（図4）。", "p6": "対象は英語の査読つき実験に限られ、小規模研究の効果の可能性がある。相乗効果の結論はAI単独を測った一部の実験に依存し、調整変数の分析は探索的で因果を示さない。自動化による見落としや誤抽出がありうり、人による監査は小規模で著者自身によるものだった（Limitations）。", "fun": "AIを使うと人の成績は上がる。でも「人とAIのチーム」が人だけ・AIだけの強い方を超える、足し算以上の力は、平均すると出ていなかった。むしろ強い方に任せたほうが良い場面が多い。しかもこの答えを、AIが論文を読み続けて自動で更新する仕組みで出している点も面白い。", "unverified": "公開ダッシュボードの最新の値は本文の時点と異なりうる。補足資料の監査の詳しい数値は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "利己的なLLM運転手エージェントで配車の再配置政策を評価", "title": "When Disclosure Is Compulsory: Evaluating Ride-Hailing Rebalancing Policies with Self-Interested LLM Driver Agents", "url": "https://arxiv.org/abs/2610.41132", "authors": "Xinyu Wang ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Wang, X., & Fielbaum, A. (2026). When Disclosure Is Compulsory: Evaluating Ride-Hailing Rebalancing Policies with Self-Interested LLM Driver Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41132", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、方法の構成、結論の節）を読んだ", "preprint": true, "p1": "EUのプラットフォーム労働指令で配車アルゴリズムのルールの開示が義務になると、運転手はルールをLLMに読ませて自分の収入のために動ける。そうした利己的なLLM運転手のもとで、車両の再配置政策の効果がどう変わるかを評価する枠組みを示した（抄録、§5）。", "p2": "再配置の政策は、運転手が従うか、ルールを知らずに利己的に動くことを前提に評価されてきた。ルールが公開され、運転手がそれを理解して動く状況での評価はなかった（§2.6、§5）。", "p3": "直前に取り逃した需要の地域へ空車を送る反応型（R）と、需要予測にもとづいて移動を計画する予測型（A）を比べる。各運転手は自分の純収入を最大にするLLMエージェントで、ルールなし（N）と指令の水準で開示されたルール（L）の条件を与える（抄録、§3）。", "p4": "二つのLLM（Claude Haiku 5.5とJev）で、運転手十人・三地域の小モデルと、運転手500人・29地域のマンハッタンのモデルを使った。ルールの理解は理解度テストで確かめ、運転手の収入、プラットフォームの利益、サービス率で評価した（§4.1、§5）。", "p5": "開示すると運転手は提案に従いやすくなり、マンハッタンでは再配置の提案を断る割合が約五分の四から四分の一に下がった。反応型は運転手が無料でしていた移動に支払うことになり利益が3.7%減ったが、予測型の利益は変わらず、両政策の差は6.1%に開いた。小モデルでは開示で運転手の収入が上がり、サービス率は10〜18ポイント上がった。マンハッタンの予測型では、完全に従う場合より運転手の収入、利益、サービス率がそれぞれ10〜12%上がった（抄録、§5）。", "p6": "乗客の行動の変化は考えず、乗客は上限つきでどの価格も受け入れると仮定している。試したLLMは二つだけで、AIや強化学習のエージェント、従順な運転手が混ざる状況は今後の課題とされる（§5）。", "fun": "ルールを公開すれば公平になる、と考えがちだが、この研究は「ルールを読んだAIが運転手の代わりに賢く動く」時代を想定した。すると、運転手がルールを知らないことに頼っていた仕組みは損をし、よく設計された仕組みでは運転手・会社・乗客の三方が得をした。透明性が仕組みの良し悪しをあぶり出す点が面白い。", "unverified": "政策の詳しいパラメータ（付録A）と、LLMごとの差の詳細は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "メッシュに依らない潜在力学で時間発展PDEを縮約", "title": "Meshless Latent Dynamics Models for Model Order Reduction of time-dependent Partial Differential Equations", "url": "https://arxiv.org/abs/2610.41043", "authors": "Lorenzo Tomada ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Tomada, L., Pichi, F., & Rozza, G. (2026). Meshless Latent Dynamics Models for Model Order Reduction of time-dependent Partial Differential Equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41043", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、理論の節の構成、結論の節と図表キャプション）を読んだ", "preprint": true, "p1": "時間発展する偏微分方程式の縮約モデルを、空間の格子（メッシュ）に縛られない潜在力学モデルとして統一的に定式化し、理論（普遍近似・安定性）と数値実験で格子ベースの方法と比べた（抄録、§5）。", "p2": "自己符号化器にもとづく従来の縮約は、学習と推論で決まった空間の離散化に縛られる。格子に依らない方法の表現力と安定性の理論的な性質は整理されていなかった（抄録、§1）。", "p3": "デコーダを、潜在状態で条件づけたニューラルフィールド（座標を入力に場の値を返すネット）として表し、条件づけを弱・強・純粋の三つに分類する。潜在状態は時間方向に進め、任意の点で場を評価できる。条件づけの種類ごとにリプシッツ定数の上界を導き、普遍近似定理を示した（§2、§3）。", "p4": "バーガース方程式、円柱まわりの流れ（ナビエ・ストークス）、線形移流の三つの問題で、格子ベースのモデルと精度、潜在軌道、リプシッツ定数、学習パラメータ数、解像度への依存を比べた（§4、表2・3、図3）。", "p5": "表現力の強い条件づけほど潜在の摂動を時間積分で増幅しやすく、表現力と安定性のトレードオフがある。格子に依らないモデルは空間の連続極限でも格子に依存しないリプシッツ上界をもつ。実験では学習パラメータが2%（デコーダでは最大45分の1）で格子ベースと同等以上の精度を示し、誤差は解像度によらずほぼ一定だった。強い条件づけは移流では精度を上げ、ナビエ・ストークスでは下げた（抄録、§5）。", "p6": "座標ベースのデコーダはスペクトルバイアスで高周波の細部の再現が難しく、点ごとの評価のためメモリ使用が大きく学習も遅い。エンコーダはまだ格子に依存し、強い条件づけが有利になる条件も未解明（§5）。", "fun": "シミュレーションの結果を小さく要約して速く予測する縮約モデルは、ふつう計算の網目の細かさに縛られる。この研究は、網目ではなく「どの地点の値か」を聞けば答える関数として作ることで、網目を変えても性能が変わらないことを示した。表現力を上げすぎると時間とともに誤差が増えやすい、というトレードオフを理論で示した点も面白い。", "unverified": "付録の証明の細部と、表2・3の個々の数値は確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "疎な計測とデータ同化で不確実性つき縮約モデルを予測", "title": "Uncertainty-aware reduced-order modelling with sparse sensing and data assimilation for forecasting combustion dynamics", "url": "https://doi.org/10.21203/rs.3.rs-11381183/v1", "authors": "Constanza Lopez ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Lopez, C., Procacci, A., Podvin, B., & Iavarone, S. (2026). Uncertainty-aware reduced-order modelling with sparse sensing and data assimilation for forecasting combustion dynamics. https://doi.org/10.21203/rs.3.rs-11381183/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research Square版のPDFの本文（抄録、方法の構成、結論の節）を読んだ", "preprint": true, "p1": "燃焼の動きを速く予測する縮約モデルに、不確実性の見積もり、少数のセンサによる観測、データ同化を組み合わせ、学習時と条件が違っても予測を立て直せる枠組みを作った（抄録、§5）。", "p2": "反応流は非線形で多重スケールのため高精度の計算は重く、実時間には使いにくい。縮約モデルは学習データと運転条件が違うと予測が劣化する（抄録）。", "p3": "多重スケールの固有直交分解（mPOD）で場を周波数ごとのモードに分け、その潜在の動きをガウス過程回帰（GPR）で事前に学習する。予測時は少数のセンサの観測から潜在状態を推定し、アンサンブル・カルマンフィルタで同化する。GPRの時間共分散はmPODの周波数構造と特徴的な時間スケールで決める（抄録、§2、§5）。", "p4": "強制旋回乱流火炎の化学発光の実験画像と、周期的に変動する軸対称の非予混合層流火炎の数値データの二つで、GPRのカーネル、センサ配置の制約、潜在状態の再構成法、同化の頻度を系統的に比べた（抄録、§3、§4）。", "p5": "周期カーネルのGPRが両方のデータで最も正確で頑健だった。センサの配置が限られるときは正則化最小二乗とベイズ的な疎な再構成が頑健で、観測の数や同化の頻度を増やしても予測は必ずしも良くならなかった。層流火炎では、雑音を加えた温度のわずか六点の観測で不正確なコサイン・カーネルの予測を補正し、最良の周期カーネルに近い誤差に近づけた（抄録、§5）。", "p6": "検証は二つの火炎に限られる。解釈：観測の情報量と予測との相性が量より重要だと示した一方、センサ配置の最適化や他の燃焼条件への一般化は残る課題と読める。", "fun": "天気予報は、計算のモデルに実際の観測を少しずつ取り込んで外れを直していく。この研究は、炎の揺らぎの予測に同じ考え方を使い、わずか六か所の温度の観測で外れかけた予測を立て直せることを示した。観測は多ければよいのではなく、どこで何を測るかが大事だという結論が面白い。", "unverified": "誤差の具体的な数値（図表の値）と計算時間の短縮の程度は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "議会討論の反論の応答性をグラフで測り熟議の質を評価", "title": "Modelling Responsiveness in Legislative Deliberation: A Graph-theoretic Approach to Rebuttal Identification and Quality Assessment", "url": "https://doi.org/10.21203/rs.3.rs-11535191/v1", "authors": "Al Khan", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Khan, A. (2026). Modelling Responsiveness in Legislative Deliberation: A Graph-theoretic Approach to Rebuttal Identification and Quality Assessment. https://doi.org/10.21203/rs.3.rs-11535191/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Research Square版のPDFの本文（方法、データ、結果の節と表1・表2）を読んだ", "preprint": true, "p1": "議会の討論で議員どうしが実際に応答し合っているかを、発言を節点・反論を矢印とするネットワークで表し、熟議の質を構造の指標で測る方法を提案した（抄録）。", "p2": "熟議の評価は手作業の内容分析や大まかな感情指標に頼ることが多く、議員が互いに応答しているのか、用意した独白を並べているだけかという構造の面を見落としてきた（抄録）。", "p3": "議事録を発言の単位に分け、話し手の手がかりの検出、意味の対比の採点、グラフの制約による検証の三段階で、明示的・暗黙的な反論のつながりを同定する。そこから相互性、推移性、会派をまたぐ重みつきクラスタリング係数などを計算する（抄録、§3.2、表1）。", "p4": "中規模のウェストミンスター型の議会の2005〜2015年の本会議1,200回（発言48,712件）で、翌30日の政府法案の成立数と、点呼投票から推定した党派の分極を外的な基準とし、会期の固定効果つきの階層線形モデルで検証した（§3）。", "p5": "相互性の平均は0.18で、少数与党の時期（2007〜2009年）には多数与党の時期より47%高かった。質問の時間は星形の構造（出次数のジニ係数0.67、相互性0.05）で、野党が始めた討論は相互性0.31と高かった。生産性は相互性（β=2.43、SE 0.54）と会派をまたぐクラスタリング（β=1.87、SE 0.78）で正に予測された（§4、表2）。", "p6": "対象の議会は名前が示されず一つだけで、反論の同定の精度の検証は読めた範囲で確認できなかった。解釈：単著の未査読論文で、法案の成立数を熟議の質の外的な基準とすることには議論の余地がある。", "fun": "議会の討論が本当の話し合いなのか、それぞれが原稿を読み上げているだけなのかは、見た目では分かりにくい。この研究は、誰が誰に言い返したかを線で結んで網の形を見ることで、それを数字にした。言い返し合う議会ほど法律が多く通るという結果は、対立と協力が表裏一体であることを思わせて面白い。", "unverified": "反論の同定の精度（人手のラベルとの一致）と、対象の議会の国名は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "思春期の孤独とSNS利用の時間的な向きを追跡調査で検証", "title": "Longitudinal Associations Between Loneliness and Social Media Use in Adolescents: A Population-Based Cohort Study", "url": "https://doi.org/10.2139/ssrn.7660813", "authors": "Kenta Igami ほか", "venue": "SSRN", "date": "2026-11-02", "apa": "Igami, K., Hosozawa, M., Narita, Z., Yamane, N., Nakajima, N., Niimura, J., Sawai, Y., Nagaoka, D., Zhou, R., Sasaki, R., Miyauchi, E., Kikusui, T., Satsuki, A., Kumagaya, S.-i., Miyamoto, Y., Nakanishi, M., DeVylder, J., Knowles, G., Shoji, H., et al. (2026). Longitudinal Associations Between Loneliness and Social Media Use in Adolescents: A Population-Based Cohort Study. https://doi.org/10.2139/ssrn.7660813", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は入手できず）", "preprint": true, "p1": "東京ティーンコホートで、思春期の孤独とSNSの能動的な利用のどちらが先に来るのかを、時間の向きを分けて検証した（抄録）。", "p2": "SNSの利用が思春期の孤独を増やすという見方があるが、関連の時間的な向き（孤独→SNSか、SNS→孤独か）ははっきりしていない（抄録）。", "p3": "12・14・16歳の孤独を「この2週間に孤独を感じた」への「はい」「ときどき」で定義し、SNSの利用を12・14歳では頻度、16歳では能動的・受動的という利用の種類で測った。時間とともに変わる交絡を扱う周辺構造モデルを使い、性別で分けて分析した（抄録）。", "p4": "3,171人（うち女子1,487人、46·9%）を対象に、孤独からその後の能動的なSNS利用への関連と、SNS利用からその後の孤独への関連を、リスク比で評価した（抄録）。", "p5": "女子では、14歳の孤独が16歳の能動的なSNS利用と関連し（リスク比1·21、95%CI 1·02〜1·45）、12歳と14歳の両方での孤独も関連した（リスク比1·35、95%CI 1·09〜1·68）。12歳だけの孤独は有意でなく、SNS利用からその後の孤独への関連も女子で見られなかった。男子ではどちらの向きにも有意な関連はなかった（抄録）。", "p6": "孤独は一つの質問、SNS利用は自己申告で、年齢によって測り方も違う。著者は、能動的なSNS利用が孤独への補償的な反応だという仮説と一致するが、その仕組みはさらに調べる必要があるとしている（抄録）。", "fun": "「SNSのせいで若者が孤独になる」という話はよく聞くが、この東京の追跡調査では、少なくとも女子では逆の向きが見えた。さびしさを感じた子が、その後SNSで自分から発信やつながりを求めるようになる、という形だ。原因と結果の矢印の向きを確かめることの大切さが分かる。", "unverified": "調整した交絡因子の一覧と、受動的な利用との関連の結果は未確認（本文を入手できず）。"}}, {"id": "pr09", "rank": 9, "headline": "波動と有限要素の逆解析で積層構造の材料と厚さを同定", "title": "Accurate structural identification for layered composite structures, through a wave and finite element scheme", "url": "https://arxiv.org/abs/2610.40689", "authors": "D. Chronopoulos (UON) ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Chronopoulos, D., Droz, C., Apalowo, R., Ichchou, M., & Yan, W. J. (2026). Accurate structural identification for layered composite structures, through a wave and finite element scheme (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40689", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のPDFの本文（抄録、数値例の結果、結論の節）を読んだ", "preprint": true, "p1": "積層複合構造の各層の厚さ、密度、引張・せん断弾性係数を、伝わる波と周期構造の有限要素モデル（WFE法）の逆解析で一度に同定する非破壊評価の方法を示した（抄録、結論）。", "p2": "モード同定にもとづく従来の方法は、境界条件の不確かさに精度が左右される。各層の特性を局所的な測定から取り出す方法が求められていた（結論(iv)）。", "p3": "周期構造の一単位を完全な有限要素で表すWFE法で周波数ごとの波数を予測し、一回の多周波数の測定から得た波数に合うよう、ニュートン法で各層のパラメータを反復的に更新する。超音波の帯域でも構造動力学の低い帯域でも使える（抄録、結論(i)）。", "p4": "数値シミュレーション（完全なFEの過渡応答）と、複合材の表面板をもつサンドイッチパネルの実験で検証し、不均質波相関法と遷移周波数特性化法という二つの波動ベースの手法と比べた（抄録、結論(ii)）。", "p5": "数値例では、同定したパラメータは元のFEモデルの値と最大でも1%未満のずれで一致した（表1）。実験でも他の方法の値とよく一致した。曲げからせん断への遷移の波数帯で、同定の収束が速かった（結論(iii)）。", "p6": "主な欠点は計算量で、三つを超えるパラメータを同定すると反復が多く重くなる。感度の式の導出や、順問題を事前に細かい格子で解いてニューラルネットで逆算する高速化が今後の課題とされる（結論(v)）。", "fun": "スイカを叩いて中身を確かめるように、構造物を叩いて伝わる波を測ると内部の性質が分かる。この研究は、何層にも重なった板について、波の伝わり方から一層ずつの厚さや硬さまで逆算した。波が「曲げ」から「せん断」に性格を変える周波数あたりで逆算が一番うまくいく、という点が面白い。", "unverified": "実験の試験体の寸法と、実験での各層の同定値の誤差の数値は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "付加質量の強い流体-構造連成を運動量の重みで安定化", "title": "A Momentum-weighted Interface Stabilization Approach for Fluid-Structure Interaction with Strong Added-Mass Effects", "url": "https://arxiv.org/abs/2610.42034", "authors": "Nihar Bhardwaj Darbhamulla ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Darbhamulla, N. B., Mao, X., Narkhede, A., Brown, D., & Jaiman, R. K. (2026). A Momentum-weighted Interface Stabilization Approach for Fluid-Structure Interaction with Strong Added-Mass Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42034", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、手法の節の構成、数値実験の一部、結論の節）を読んだ", "preprint": true, "p1": "流体と構造を別々のソルバで交互に解く分離型の流体-構造連成（FSI）で、構造が軽く流体の付加質量が強いときに起きる不安定を、界面の運動量に重みをつけた安定化（MWIS）で抑える方法を提案した（抄録、§5）。", "p2": "分離型のディリクレ・ノイマン法は既存の最適化されたソルバを使い回せるが、構造の慣性が流体に比べて小さいと発散しやすい（抄録、§1）。", "p3": "線形化したFSI問題の固定点解析で、一体型と分離型の界面圧力のシューア補元の違いが不安定の原因だと特定し、流体側の界面圧力の項に、流体と構造の界面の運動量の演算子から作る項を加える。この項は収束時に消えるので一体型の解が回復される。要素の寸法から作る疎な対角近似で、ソルバ間のデータのやり取りを通常の界面データ程度に抑える（抄録、§2〜§3）。", "p4": "線形モデル（重力で動く流体柱の下の弾性体）と、円柱の後流で変形する弾性棒、薄い柔軟板のはためきという非線形のベンチマークで、質量比や格子の比を変えて収束の頑健さを調べた（§4）。", "p5": "単純な線形モデルでは、理想化した補強で慣性が支配的な領域でも一回の反復で収束すると予測された。ベンチマークでは、構造と流体の質量比が小さく従来のディリクレ・ノイマン法が発散しうる領域でも、連成の頑健さが改善した。格子を細かくしても界面圧力の周波数成分が保たれた（§4.1.3、§5）。", "p6": "界面の格子が一致しない場合、三次元、強い非線形のFSIでの安定性と精度は今後の課題で、反復回数を減らす前処理や適応的な安定化も検討の余地があるとされる（§5）。", "fun": "水の中で軽い板を動かすと、周りの水も一緒に動かすことになり、板が実際より重く感じられる。これを付加質量という。流れと板を別々に計算して交互にやり取りする方法は、この効果が強いと計算が暴れてしまう。この研究は、やり取りのときに互いの「勢い」を見積もって補正することで、計算を落ち着かせた。", "unverified": "各ベンチマークでの反復回数や計算時間の具体的な数値は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "韓国のバリューアップ計画で開示の情報量と市場評価", "title": "Disclosure incentives, ESG visibility, and market valuation: Evidence from Korea’s Corporate Value-Up Program", "url": "https://doi.org/10.21203/rs.3.rs-10810635/v1", "authors": "Bong-Seop Kim ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Kim, B.-S., & Hyun, S. (2026). Disclosure incentives, ESG visibility, and market valuation: Evidence from Korea’s Corporate Value-Up Program. https://doi.org/10.21203/rs.3.rs-10810635/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research Square版のPDFの本文（序論の要約、方法の構成、結論と限界の節）を読んだ", "preprint": true, "p1": "政策の誘因で開示への参加が広がると、企業の開示が市場に伝える情報がどう変わるかを、韓国の企業価値向上（バリューアップ）計画で検証し、「開示するという決定」と「開示した内容の信頼性」の二つの経路を分けた（抄録、§5）。", "p2": "開示を促す政策は対象を広げるが、参加が当たり前になると開示そのものの合図としての価値は薄れうる。市場がどの経路で反応するかは分かっていなかった（抄録、§1）。", "p3": "2025年12月の税制改正で、開示の枠組みは変えずに参加が急増した。改正前の自発的な時期（制度I）の145社と改正後（制度II）の541社を、1,086件の開示の全文から作った具体性の指数（数値目標のある指標の領域数と自社株消却の明確な約束）とともに分析し、傾向スコアで非開示の三社と照合したイベントスタディで累積異常リターンを推定した（抄録、§1、§3）。", "p4": "三日間の累積平均異常リターン（CAAR）、ESG評価との交互作用、具体性の指数とESG評価の交互作用を推定し、イベント日を五百回ずらすプラセボ検定、日付のクラスタを考慮した標準誤差、暦時間のポートフォリオで頑健性を確かめた（§1、§3.6）。", "p5": "CAARは制度Iで1.008ポイント、制度IIで0.005ポイントだった。制度IではESG評価が一標準偏差高いと効果が1.338ポイント小さく、すでに注目されている企業ほど開示の新しい情報が少なかった。制度IIでは具体性の指数は全体としては有意でなかったが、ESG評価の高い企業でだけ高いリターンと関連した（交互作用1.760）。プラセボのp値は0.012、0.042、0.018だった（§1）。", "p6": "制度IIの開示541件のうち352件が2026年3月に集中し、暦の効果を完全には除けない。制度IIの80.0%が簡略様式を使っており、誘因による希薄化と検証可能性の低下を分けられない（§5）。", "fun": "みんなが同じことをし始めると、それをすること自体は目立たなくなる。この研究では、税の優遇で多くの会社が企業価値の向上計画を出すようになると、出したというだけでは株価が動かなくなった。代わりに、もともと注目されている会社が具体的な約束をしたときだけ評価された。信頼されている人の約束だけが効く、という人間関係にも似た結果が面白い。", "unverified": "具体性の指数の作り方の細部と、限界の三点目・四点目の詳細は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "6つのLLMの禁煙助言は利用者ペルソナで変わるか", "title": "Same Question, Different Answers: Auditing Persona-Dependent Variation in Six LLMs on Smoking-Cessation Advice", "url": "https://arxiv.org/abs/2610.42039", "authors": "Artin Yousefi ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Yousefi, A., Aiersilan, A., Abroms, L. C., & Broniatowski, D. A. (2026). Same Question, Different Answers: Auditing Persona-Dependent Variation in Six LLMs on Smoking-Cessation Advice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42039", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法、考察、限界の節）を読んだ", "preprint": true, "p1": "同じ禁煙の質問でも、尋ねる人の設定（ペルソナ）によってLLMの健康助言の中身が変わるかを六つのLLMで監査し、すべての利用者に最低限の事実を伝えさせる短いシステムプロンプトの効果も評価した（抄録）。", "p2": "何億人もの人がLLMに健康の相談をするが、誰もが同じ助言を受けているのかは分かっていなかった。禁煙は臨床の指針が明確で、公衆衛生上の重要度が高い分野（抄録、§1）。", "p3": "年齢段階・専門性の自己申告・喫煙歴が異なる12のペルソナに同じ4つの禁煙の質問を、4社の6モデル（Claude Haiku、Claude Sonnet、Gemini 2.5 Flash・Pro、GPT-5.5、Grok 4.3）で、プロンプトなしと「事実の床」を定めるシステムプロンプトありの2条件、各5回ずつ聞いた（計2,880回答）（§3.2〜3.4）。", "p4": "回答から語数、ためらい表現の数、「医師に相談して」などの誘導の有無、七つの事実の分類（ニコチン置換療法、処方薬、行動療法、離脱症状、健康リスクなど）の有無を正規表現で自動抽出し、ペルソナ×質問の48セルの平均で、対応のあるt検定とブートストラップの95%信頼区間で比べた（§3.4〜3.5）。", "p5": "すべてのモデルが、10代のペルソナには大人より処方の禁煙薬の名前を32〜67ポイント少なく挙げた。6モデル中5つで、医療の専門性を示したペルソナは示さないペルソナより少ない事実しか受け取らなかった。プロンプトはすべてのモデルでペルソナ間の差を縮めたが、全体の事実の網羅への効果は、大きさも向きもモデルによって違った（抄録、§5.2）。", "p6": "ペルソナは年齢・専門性・喫煙歴が同時に違うため、それぞれの効果は分けられない。採点は単語の一致による自動採点で人による確認をしておらず、内容の正しさや臨床的な適切さは測っていない。処方薬は未成年に推奨されないので、言及率をそろえることが常に正しい目標ではない（抄録、§5.5）。", "fun": "AIに健康相談をするとき、「私は医者です」と名乗ると、かえって基本的な情報を省かれることがある。この研究で見つかった意外な傾向だ。詳しい人に初歩を説明するのは失礼だとAIが「気をきかせて」いるのかもしれない。誰に対しても最低限伝えるべき事実を決めておく、という対策の発想が面白い。", "unverified": "各モデルの個別の数値（表）と、妊娠に関する質問の詳しい結果は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "4.5万橋の20年追跡で架け替えと健全度評価のずれを検証", "title": "Which Bridges Get Replaced? Following 45,274 Ohio and New York Bridges from the 2005 to the 2025 National Bridge Inventory with Isotonic Estimates and an Exact Likelihood Equivalence", "url": "https://doi.org/10.5281/zenodo.23873886", "authors": "Aguru, Manoj Kumar", "venue": "Zenodo", "date": "2026-11-02", "apa": "Aguru, M. K. (2026). Which Bridges Get Replaced? Following 45,274 Ohio and New York Bridges from the 2005 to the 2025 National Bridge Inventory with Isotonic Estimates and an Exact Likelihood Equivalence. Zenodo. https://doi.org/10.5281/ZENODO.23873886", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "ZenodoのPDFの本文（抄録、方法、考察、結論の節）を読んだ", "preprint": true, "p1": "健全度の評価が橋の架け替えをどれだけ決めているかを、オハイオ州とニューヨーク州の全道路橋を2005年から2025年まで米国の橋梁台帳（NBI）で追跡して検証した（抄録、§6）。", "p2": "健全度の評価は架け替えを促すためのものだが、実際にどれほど架け替えと結びついているかは確かめられていなかった（抄録）。", "p3": "2005年に有効な評価と建設年をもつ45,274橋について、20年後に同じ構造番号で建設年が新しくなった場合と台帳から消えた場合を「架け替え・撤去」とした。床版・上部工・下部工・カルバートの評価の最低値ごとの割合を、単調に減る確率として隣接違反者プール法で推定し、このアイソトニック推定が単調性の制約のもとでの厳密な最尤推定と一致することを証明した（抄録、§3）。", "p4": "評価と年齢ごとの架け替えの割合、評価と年齢による順位づけの性能（ROC曲線下の面積）、2005年に不良以下だった橋の2025年の状態を州別に比べた（抄録、§4）。", "p5": "全体の21.3%が架け替え・撤去された。割合は評価3で71%、4で57%、5で33%、6で19%、7で10%、9で7%と急に下がり、年齢でも10年未満の6%から100年超の47%まで上がった。AUCは評価で0.751、年齢で0.714、両方で0.799。2005年に不良以下の5,073橋の61%が架け替え・撤去されたが、530橋（10.4%）は元のまま不良以下で使われ続けていた（オハイオ5.1%、ニューヨーク17.8%）（抄録）。", "p6": "結果は撤去と架け替えを合わせたもので、物理的な架け替えと番号の振り直しを分けられない。評価は点検者の離散的な判断で、対象は二州だけ。交通量、所有者、財源のデータを加えて、予算と政策の寄与を分ける必要がある（§5）。", "fun": "「状態が悪い橋から順に架け替える」のは当たり前の方針に思える。実際、評価が悪いほど架け替えられていたが、20年たっても不良のまま使われる橋が1割ほど残っていた。しかも州によってその割合が三倍以上違う。点検の評価と予算や政策のずれが数字で浮かび上がる点が面白い。", "unverified": "未査読・単著。州ごとの評価基準の運用の違いの影響は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "GPUでDEMとSPHを連成し実地形の土石流を解くプログラム", "title": "GranumFL: an agentic, GPU-accelerated coupled DEM–SPH program for debris flows on real terrain", "url": "https://doi.org/10.5281/zenodo.23858570", "authors": "Sompote Youwai", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-01", "apa": "Youwai, S. (2026). GranumFL: an agentic, GPU-accelerated coupled DEM–SPH program for debris flows on real terrain. Zenodo. https://doi.org/10.5281/ZENODO.23858570", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "ZenodoのPDFの本文（抄録、節の構成、結論の節）を読んだ", "preprint": true, "p1": "実地形での土石流を、粒子（DEM）と水（SPH）の連成で一台のGPU上で解くプログラムGranumFLを作り、各段階をLLMエージェントが操作できるようにして、検証問題で精度を確かめた（抄録、§10）。", "p2": "土石流は粒と水と地形が同時に関わるが、GPUでDEMとSPHを連成するプログラムは、粒子を細かく解く商用品か、プログラミングなしでは技術者が使えない研究用コードに限られていた（抄録）。", "p3": "弱圧縮性SPHの水相とDEMの粒子相を、Robinsonら（2014）の非解像型の定式化で連成し、両相を一台のCUDA GPUで動かす。数値標高モデル上にケースを配置し、すべての手順を20のModel Context Protocolの道具としてLLMエージェントに公開した（抄録、§3〜§4）。", "p4": "各相を公表済みのベンチマーク（衝突問題、DEM8の貫入試験、沈降する多孔質ブロック、Ergunの圧力損失、ダム崩壊、SPHERICのTest 2）と比べ、GPUの速さと、エージェントによるタイ・パトンの土石流現場の設定を試した（抄録、§5〜§8）。", "p5": "DEM相はHertz解と0.09%、Kratosと0.19°以内で一致し、DEM8では八つのコードのばらつきの範囲に入った（RTX 5090で1.1分）。沈降する多孔質ブロックでは参照実装より理論に近かった（h/d=2、5、6で−2.7、+9.3、+14.4%）。SPH相はダム崩壊をRMS 3.0〜3.1%、静水圧を0.68%で再現し、水相は1200万粒子まで30スレッドのCPUの55〜66倍の速さだった。LLMエージェントは四回の試行すべてで33の検査に合格した（抄録、§10）。", "p6": "単一の粒子はh/dが2.5〜4のときしか正確でなく、密な固定床ではErgunの圧力損失の1.5〜3.3倍になり、緩い水中の粒子柱は崩れすぎて底の間隙水圧の符号が逆になった。密な粒子集合体とその間隙水圧は未解決の課題で、SPHERICのTest 2では床近くのピーク圧力を過大に予測した（抄録、§10）。", "fun": "土石流は、岩や砂の粒と水が混ざって山を流れ下る。この研究は、粒は一つずつ、水は小さな粒子の集まりとして計算し、実際の地形の上で動かすプログラムを作った。しかもAIに言葉で頼むだけで設定でき、AIが地図データの流れの道筋の誤りまで自分で見つけた点が面白い。", "unverified": "未査読・単著。パトンの現場の再現計算の結果（流下範囲など）の精度は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "ワクチン「シェディング」言説の拡散を投稿網で分析", "title": "Asymmetric Decline Rather Than Backfire: A Repost-Network Analysis of Japanese Vaccine-Shedding Misinformation on X", "url": "https://arxiv.org/abs/2610.40677", "authors": "Akinobu Seki ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Seki, A., Murata, E., Chujyo, M., & Toriumi, F. (2026). Asymmetric Decline Rather Than Backfire: A Repost-Network Analysis of Japanese Vaccine-Shedding Misinformation on X (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40677", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法、結果の一部、限界の節）を読んだ", "preprint": true, "p1": "2024年のXでの「シェディング」（ワクチン接種者から有害物質が出て周りの人に害を与えるという科学的根拠のない主張）の言説の拡散を、リポストのネットワークで分析し、否定する報道の後に反ワクチン側の拡散が逆に強まる「逆効果」が起きたかを検証した（抄録）。", "p2": "誤情報を訂正すると、かえって確信が強まる逆効果が心配されるが、拡散の規模で起きるかは日本語の言説では確かめられていなかった（抄録、§II-C）。", "p3": "2024年1月1日〜12月31日の「シェディング」を含む投稿109,170件とリポスト478,089件を集め、二回以上リポストされた投稿を節点に、リポストした利用者の重なり（シンプソン係数0.3以上）で結ぶネットワークを作り、ルーバン法でクラスタを抽出した。投稿数の山と出来事を対応させて期間を区切り、前後でリポストの参加を比べた（§III）。", "p4": "クラスタの頻出語で立場を解釈し、出来事の前後で両クラスタのリポスト参加の割合を比べた。立場の移り変わりは、少なくとも一回いずれかのクラスタの投稿をリポストした43,034人で分析した（§III-D、§IV-D）。", "p5": "ネットワークは15,423節点・2,532,718辺で、16のクラスタ（モジュラリティ0.446）が見つかり、統合後は親ワクチンと反ワクチンの二つのクラスタに節点の約96.6%が集まった。否定する報道の後、反ワクチン側の拡散に逆効果の証拠はなく、話題全体が減る中で反ワクチン側の参加がより急に減った。反ワクチンから親ワクチンへ移った利用者は77人（0.18%）だけで、変化は、それまで発信しなかった人の親ワクチン側への参加と、反ワクチン支持者の撤退によるものだった（抄録、§IV）。", "p6": "リポストは賛同とは限らず、批判的な共有も含みうる。リポストの時刻がないため元投稿の時刻で期間を割り当てた。検索語を含む投稿に限られ、個人の態度変化を直接示すものではなく、2024年の日本語のXに限られる（§V-D）。", "fun": "デマを否定するニュースが流れると、信じる人がかえって意固地になるのでは、と心配される。この研究では、そうした逆効果は見られず、信じる側の拡散が先にしぼんだ。ただし考えを改めた人はごくわずかで、変わったのは「黙っていた人が声を上げ、信じる人が黙った」ことだった。説得ではなく参加者の入れ替わりで流れが変わる、という見方が面白い。", "unverified": "期間ごとのリポスト参加の割合の具体的な数値（図4）は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "多様な模擬ユーザーでチャットアシスタントを評価する", "title": "PersonaChatBench: Evaluating Chat Assistants with Diverse Simulated Users", "url": "https://arxiv.org/abs/2610.42060", "authors": "Zheyuan Deng ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Deng, Z., Li, T., Zhang, J., Li, Y., Zhao, D., Zhang, F., Zhang, Y., Xu, Z., Liao, Y., Zhang, H., Hu, H., Wang, C., Yang, C., Wu, S., Cao, D., Hu, X., Li, H., Wang, H., George, R., … Li, X. (2026). PersonaChatBench: Evaluating Chat Assistants with Diverse Simulated Users (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42060", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "同じ課題を、要望や話し方の異なる複数の模擬ユーザーと行わせ、チャットアシスタントが利用者ごとにどれだけ役に立つかを測る評価の枠組みを作った（抄録）。", "p3": "非公開のペルソナカードで動く模擬ユーザーを課題ごとに複数用意し、課題の成果、ペルソナの要望の充足、模擬ユーザーの忠実さを分けて採点する（抄録）。", "p5": "六つの分野で20の言語モデルを評価し、課題の成績と要望の充足はペルソナや分野で異なり、課題に強いモデルが個別の要望を満たすとは限らなかった（抄録）。", "fun": "テストの点が高い店員が、どのお客さんにも親切とは限らない。この研究は、AIの助手を平均点ではなく「誰にとって良いか」で測ろうとしている。急いでいる人、丁寧な説明がほしい人など相手を替えると評価が変わる、という見落とされがちな点を数字で示した。", "unverified": "ペルソナの数、各分野の課題数、模擬ユーザーの忠実さの評価方法は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "模擬面接対象者の情報の一貫性と関係への適応を測る", "title": "PsyInterviewee: Informational Invariance and Relational Adaptivity in Mental Health Interview Simulation", "url": "https://arxiv.org/abs/2610.41289", "authors": "Jiawei Zhang ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Zhang, J., Qiu, H., Guo, R., & Shi, Z. (2026). PsyInterviewee: Informational Invariance and Relational Adaptivity in Mental Health Interview Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41289", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "精神科の面接訓練に使うLLMの模擬患者で、設定された臨床的な事実を変えずに、面接の流れに応じて打ち明け方や態度を変えられる仕組みを作った（抄録）。", "p3": "事実を守る「真実の経路」と、やり取りで変わる「対話の経路」を分け、対話からは開示の度合いや振る舞いの状態だけを更新でき、新しい臨床的事実は書き込めないようにした。生成した主張はプロフィールと照合する（抄録）。", "p5": "LLMの面接者との自動評価で、二つのLLM審査員の判定では、ほとんどの指標で四つの代表的な手法を上回った。除去実験から、二つの経路がそれぞれ臨床的な裏づけと応答の調整に効いていると示唆された（抄録）。", "fun": "役者が台本の設定を守りながら、相手の出方でセリフの調子を変えるのに似ている。AIの模擬患者は話を広げるうちに設定にない症状を言い出しがちだが、この研究は「変えてよい情報」と「変えてはいけない事実」を書き込みの権限で分けて、それを防いだ。", "unverified": "評価指標の具体的な内容と数値、人間の専門家による評価の有無は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "推論させるとLLM同士の判断は一致しやすくなるか", "title": "Does Reasoning Make Language Models Agree?", "url": "https://arxiv.org/abs/2610.41691", "authors": "Mila Gorecki ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Gorecki, M., & Hardt, M. (2026). Does Reasoning Make Language Models Agree? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41691", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "推論（思考の連鎖）を使わせると言語モデル同士の判断がそろうのか、逆にばらつくのかという対立する見方を整理し、実験で答えを出した（抄録）。", "p3": "推論を「操作として加える場合」と「観察される振る舞い」に分け、推論の量を制御して変えたときの一致と、推論の長さごとの一致を、正解率から期待される一致と比べた（抄録）。", "p5": "2社の九つのモデルと三つの分類課題で、推論を有効にすると同じ人に対するモデル間の判断の一致が高まった。一方、長い推論を引き出す人ほど予測は一致しにくく、正解率の差を考慮しても両方の傾向が残った（抄録）。", "fun": "「よく考えて」と頼むと答えがそろうのに、考え込む時間が長い問題ほど答えが割れる。一見矛盾するこの二つが同時に成り立つのが面白い。考えさせるのは「処方」、長く考えているのは「難しさのサイン」と読み分けると、両者は両立する。", "unverified": "使ったモデル名、課題の具体的な内容、一致の指標の数値は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLMによるテキスト分類を不確実性つきでRで行う", "title": "llmClassificR: Text Classification with Large Language Models, Network Psychometrics, and Calibrated Uncertainty in R", "url": "https://doi.org/10.31234/osf.io/259gt_v1", "authors": "Hudson Golino", "venue": "PsyArXiv", "date": "2026-11-02", "apa": "Golino, H. (2026). llmClassificR: Text Classification with Large Language Models, Network Psychometrics, and Calibrated Uncertainty in R. https://doi.org/10.31234/osf.io/259gt_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "心理学・社会科学のテキスト分類で、埋め込みに基づく方法から生成LLMへの指示まで多様な手法を、一つのRパッケージで同じ使い方で扱えるようにした（抄録）。", "p3": "埋め込みに探索的グラフ分析を当てる教師なし分類、固定した埋め込み上の教師あり分類、生成LLMへの指示による分類（JSONスキーマでの出力、アンサンブル、自己一貫性）、トピックの発見などを実装し、ネットワーク心理測定と不確実性の定量化を組み合わせる（抄録）。", "p5": "抄録は機能の紹介が中心で、手法どうしの性能の比較結果は抄録の範囲では確認できなかった（抄録）。", "fun": "文章を「怒り」「感謝」などに仕分ける作業は、人手だと時間がかかり、AIに任せると「どれくらい確かか」が分からない。このパッケージは仕分けと一緒にその確からしさも示そうとしている。道具を一つの箱にまとめたことで、方法による結果の違いを比べやすくなる。", "unverified": "各分類法の精度の比較と、不確実性の較正の具体的な方法は未確認（抄録が途中まで）。"}}, {"id": "pr20", "rank": 20, "headline": "制御つきDMDで流体-構造連成の空力荷重を長期予測", "title": "A load-coupled DMDc method for long-term aerodynamic load prediction in controlled fluid–structure interaction systems", "url": "https://doi.org/10.21203/rs.3.rs-11563727/v1", "authors": "Haowei Du ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Du, H., Wang, T., Liu, Z., Jin, C., Li, L., Zhang, Y., & Ding, X. (2026). A load-coupled DMDc method for long-term aerodynamic load prediction in controlled fluid–structure interaction systems. https://doi.org/10.21203/rs.3.rs-11563727/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "制御入力のある流体-構造連成系で、空力荷重の非線形な効果を状態の時間発展に組み込み、長時間の荷重予測を高精度にする縮約モデル（LC-DMDc）を提案した（抄録）。", "p3": "流れ・構造の動き・界面の荷重を固有直交分解で縮約し、放射基底関数の写像で予測した荷重係数を、制御つき動的モード分解の時間発展に非線形の補正として加える。変位と速度の関係を保ち、多段の予測誤差で最適化する（抄録）。", "p5": "圧電で動かす平板翼の高精度なFSI計算で学習し、140秒の連続予測で空力の力とモーメントの誤差は7.33%以下に収まった。標準の手法と三つの代表的な手法と比べている（抄録）。", "fun": "風にあおられる翼の動きを、毎回大きな計算をせずに予測できれば、制御にすぐ使える。この研究は、流れを少数の「代表的な動きの型」に縮めて予測する方法に、荷重の非線形な効き目を後から足し込む工夫をした。140秒先まで誤差を数%に抑えた点が見どころだ。", "unverified": "翼端変位の誤差の値と単位、比較した手法の名前は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "多重同調液体ダンパーで斜張橋の主塔の振動を抑える", "title": "Vibration Control in Cable-Stayed Bridge Towers Using an EL-FRF Model for MTLD-Structure Interaction", "url": "https://doi.org/10.21203/rs.3.rs-11336284/v1", "authors": "Duc-Thi-Thu-Dinh Nguyen ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Nguyen, D.-T.-T.-D., Duc, D. V., & Hung, T. V. (2026). Vibration Control in Cable-Stayed Bridge Towers Using an EL-FRF Model for MTLD-Structure Interaction. https://doi.org/10.21203/rs.3.rs-11336284/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "複数の同調液体ダンパー（MTLD）と構造物の相互作用を表す無次元の伝達関数（EL-FRF）を導き、風による広い周波数帯の振動を抑えるダンパー設計に使えるようにした（抄録）。", "p3": "オイラー・ラグランジュ方程式から出発し、非線形浅水波理論を等価な同調質量ダンパーに置き換えて取り込む。多自由度の定式化で、タンク数（N = 5–15）、周波数帯域（R = 0.2–0.3）、中心質量比（約60%）などを最適化する（抄録）。", "p5": "パラメータ解析では、単一の液体ダンパーより振幅の低減が20〜30%大きかった。ベトナムのバイチャイ斜張橋の主塔に適用し、既存の単一ダンパーより少ない層で横振動をよく抑えた（抄録）。", "fun": "コップの水を揺らすと、水が揺れのエネルギーを吸い取る。高い塔の上に水の入ったタンクを置くと、この性質で塔の揺れを抑えられる。この研究は、大きさを少しずつ変えたタンクを並べると、さまざまな揺れ方にまとめて効くことを、式で設計できるようにした。", "unverified": "振幅低減の比較条件、実橋での計測による検証の有無は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "橋の20年後の交通量予測に対し実績は26%少なかった", "title": "Twenty-Year Traffic Forecasts on 23,325 Ohio and New York Bridges: An Exact Growth-Gap Decomposition Shows Traffic Came in 26% Below the 2005 Forecasts", "url": "https://doi.org/10.5281/zenodo.23873889", "authors": "Aguru, Manoj Kumar", "venue": "Zenodo", "date": "2026-11-02", "apa": "Aguru, M. K. (2026). Twenty-Year Traffic Forecasts on 23,325 Ohio and New York Bridges: An Exact Growth-Gap Decomposition Shows Traffic Came in 26% Below the 2005 Forecasts. Zenodo. https://doi.org/10.5281/ZENODO.23873889", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "米国の橋梁台帳に記録された約20年先の交通量予測を、20年後の実測と突き合わせ、予測がどれだけ外れたかとその理由を分解した（抄録）。", "p3": "オハイオ州とニューヨーク州で構造番号と建設年が同じまま残った23,325橋について、2005年の予測を2025年の実測の年まで幾何的に補間して比べた。対数精度比が「経過年数×実際と予測の成長率の差」に正確に等しいことを示した（抄録）。", "p5": "77.4%の橋で実績が予測を下回り、実績と予測の比の中央値は0.744、総量の比は0.732だった。予測の年成長率の中央値1.49%に対し実際は-0.11%で、交通量の多い橋ほど過大予測になる平均への回帰の効果も導いた（抄録）。", "fun": "「20年後にはこの橋をもっと多くの車が通る」という予測は、橋の補修や架け替えの計画を左右する。ところが実際には半数以上の橋で交通量が減っていた。予測が外れた理由を、成長率の見込み違いという一つの数にきれいに分解した点が面白い。", "unverified": "未査読・単著。州ごとの差の詳しい数値（ニューヨーク州の中央値0.677以外）は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "スマホ1台のGPS記録でコミュニティバスの経路データを検証", "title": "Validating GTFS route geometry with one smartphone: on-board GPS logs, national bus-route GIS data and published shapes.txt on the community buses of Agui and Higashiura, Japan", "url": "https://doi.org/10.5281/zenodo.23877190", "authors": "Moteki, Yasutoshi", "venue": "Zenodo", "date": "2026-11-02", "apa": "Moteki, Y. (2026). Validating GTFS route geometry with one smartphone: on-board GPS logs, national bus-route GIS data and published shapes.txt on the community buses of Agui and Higashiura, Japan. Zenodo. https://doi.org/10.5281/ZENODO.23877190", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "愛知県阿久比町のコミュニティバスを例に、GTFSの経路形状ファイル（shapes.txt）を、乗車中のスマホのGPS記録と国の路線データの二通りで作る公開の手順をまとめ、精度を検証した（抄録）。", "p3": "手順Aはブラウザで記録した車内のGPSログから、手順Bは国土交通省N07の路線データ上の停留所間の最短経路から形状を作る。検証の最初の段階として、事業者がshapes.txtを公開している隣の東浦町の「う・ら・ら」で調べた（抄録）。", "p5": "一台の端末で全区間を二回乗った記録に対し、公開済みの形状は全長の97.8%と99.8%で25m以内にあった。路線データから作った形状は88.0%と70.3%にとどまり、N07の調査年度（2022年度）以降に付け替えられた道路でずれた（抄録）。", "fun": "バスの経路地図は乗り換え案内アプリの土台だが、小さな町のバスでは誰も確かめていないこともある。この研究は、スマホを持ってバスに乗るだけで、公開された経路が正しいかを確かめられることを示した。国の地図データが道路の付け替えに追いつかない弱点も見えてくる。", "unverified": "未査読・単著。阿久比町の路線での検証の後の段階の結果は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "幼少期の逆境と子どもの孤独が22歳の学業達成に及ぼす影響", "title": "Early-life adversity, childhood loneliness, and young adulthood educational achievement: a prospective study", "url": "https://doi.org/10.31234/osf.io/ujep7_v4", "authors": "Laura Cachón-Alonso ほか", "venue": "PsyArXiv", "date": "2026-11-02", "apa": "Cachón-Alonso, L., Mullola, S., Brooks-Gunn, J., Hakulinen, C., Komulainen, K., & Elovainio, M. (2026). Early-life adversity, childhood loneliness, and young adulthood educational achievement: a prospective study. https://doi.org/10.31234/osf.io/ujep7_v4", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "幼少期の逆境が子どもの孤独の訴えと関係するか、子どもの孤独が22歳の学業達成の低さにつながるかを、米国の出生コホートで調べた（抄録）。", "p3": "Future of Families and Child Wellbeing Study（元の標本4,898人、分析標本2,456人）で、主な養育者が報告した5歳と9歳の孤独の訴えを、二項ロジスティック回帰と重みつきのg計算法で分析した（抄録）。", "p5": "6.8%の子どもで孤独の訴えが繰り返された。社会環境的な逆境は孤独の訴えの高いオッズと関連し、物質的な困窮と近隣の集合的効力感の低さは5歳・9歳での繰り返しと関連した。子どもの孤独と後の学業達成の関連は見られなかった（抄録）。", "fun": "「子どもの頃にさびしい思いをすると勉強にも響くのでは」と考えがちだが、この研究ではのちの学業との関係は見つからなかった。むしろ家庭の貧しさや近所の助け合いの弱さが孤独の訴えと結びついていた。孤独を家庭と地域の環境の問題として見る視点を与えてくれる。", "unverified": "孤独を養育者の報告で測ったことによる限界の詳細は未確認（抄録が途中まで）。"}}, {"id": "pr25", "rank": 25, "headline": "物理制約つき潜在ニューラルODEで燃焼反応を縮約", "title": "Physics-Informed Latent Neural ODEs for Reduced-Order Modeling of Hydrogen, Ammonia, and Methane Combustion Kinetics", "url": "https://arxiv.org/abs/2610.42016", "authors": "Jay Patel ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Patel, J., & Bansude, S. (2026). Physics-Informed Latent Neural ODEs for Reduced-Order Modeling of Hydrogen, Ammonia, and Methane Combustion Kinetics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42016", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "水素・アンモニア・メタンの燃焼反応の詳細な機構を、物理則を組み込んだオートエンコーダとニューラルODEで少数の潜在変数に縮約し、計算を軽くする枠組みを作った（抄録）。", "p3": "エンコーダが熱化学的な状態を低次元の潜在空間に圧縮し、ニューラルODEがそれを時間方向に連続的に進め、デコーダが温度と全化学種の質量分率を復元する。元素保存、質量保存、エンタルピーの整合を学習の目的関数に入れる（抄録）。", "p5": "水素、アンモニア、メタンと空気の自着火に、規模の異なる詳細機構で適用し、少数の潜在変数で精度よく表せた。物理制約のないモデルに比べ、着火遅れの予測と保存則の振る舞いが改善した（抄録）。", "fun": "燃焼の計算では何十種類もの分子の反応を同時に追うため、計算がとても重い。この研究は、その状態をごく少数の「要約の変数」に縮めても着火のタイミングまで再現できることを示した。原子の数が保存されるといった物理の決まりを学習に入れると予測が良くなった点も面白い。", "unverified": "潜在変数の具体的な数と、計算時間の短縮の程度は未確認（抄録が途中まで）。"}}, {"id": "pr26", "rank": 26, "headline": "降雨強度と地中のAEの時空間相関で地すべり発生を捉える", "title": "Spatiotemporal correlation of rainfall intensity and subsurface acoustic emission parameters for landslide initiation", "url": "https://doi.org/10.21203/rs.3.rs-10598681/v1", "authors": "Sumit Vashista ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Vashista, S., Agrawal, A., & Singh, S. K. (2026). Spatiotemporal correlation of rainfall intensity and subsurface acoustic emission parameters for landslide initiation. https://doi.org/10.21203/rs.3.rs-10598681/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "インドのヒマラヤ山麓の地すべりしやすい斜面で、降雨とアコースティック・エミッション（AE）を同時に観測し、地すべりの発生につながる雨の強さの目安を探った（抄録）。", "p3": "地図化したせん断帯を貫く中空アルミの導波棒でAE信号を記録し、自動気象観測所の一分未満の降雨データと同期した。2025年のモンスーン期の4,884の一分間の窓を分析した（抄録）。", "p5": "その斜面に固有の臨界降雨強度として毎分2mmが得られた（相関係数0.70）（抄録）。", "fun": "斜面の中で土がずれ始めると、目に見える前に小さな「きしみ音」が出る。この研究は、その音を棒を通して聞き取り、雨の強さと並べて見ることで、どのくらいの雨で斜面が危なくなるかの目安を探った。音で地すべりの前触れを聞くという発想が面白い。", "unverified": "毎分2mm以外のしきい値や継続時間の条件、警報への使い方は抄録が途中で切れており未確認。"}}, {"id": "pr27", "rank": 27, "headline": "有限変形での凝集破壊を変分的な位相場理論で定式化", "title": "A variational phase-field theory of cohesive fracture at finite deformation", "url": "https://arxiv.org/abs/2610.41662", "authors": "Ye Feng", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Feng, Y. (2026). A variational phase-field theory of cohesive fracture at finite deformation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41662", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "有限変形での凝集型の破壊を、運動学的にも変分的にも一貫した位相場理論として定式化した（抄録）。", "p3": "き裂の形と材料の劣化を位相場に同時に担わせず、独立したコンプライアンス損傷場を導入する。変形勾配の階数一の加法分解で、き裂ひずみと基準法線の場により分離を明示し、すべての場を一つの最小ポテンシャルエネルギーの原理で支配する（抄録）。", "p5": "一次元のエネルギー比較では、最小化によって損傷とき裂ひずみがディラック型に集中し、位相場は連続のまま有限の長さで強い変位の不連続が自然に現れた。集中したエネルギーは鋭いき裂の凝集域モデルの構造を正確に再現する（抄録）。", "fun": "ひびを計算で扱うとき、ひびそのものを線として描くのは難しいので、ぼやけた帯で表す方法がよく使われる。この研究は、帯はなめらかなままなのに、エネルギーが最小になるように解くと、ずれが自然に一本のひびに集まることを示した。ぼかしから鋭いひびが生まれる点が面白い。", "unverified": "多次元の数値例と実験との比較は未確認（抄録が途中まで）。"}}, {"id": "pr28", "rank": 28, "headline": "高動的環境でのGNSS受信機のベクトル追尾とスカラー追尾", "title": "GNSS Receiver Operating Point Comparison Between Vector and Scalar Tracking Under High-Dynamics", "url": "https://arxiv.org/abs/2610.41498", "authors": "J. Ferm\\'in Llorente ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Llorente, J. F., López, E. M., Smidt, J. A., & Roncagliolo, P. A. (2026). GNSS Receiver Operating Point Comparison Between Vector and Scalar Tracking Under High-Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41498", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ロケットなど激しく加速する機体のGNSS受信機で、信号が弱いときの追尾外れを防ぎつつ急な加速にもすぐ追従できるよう、カルマンフィルタの観測雑音を自動で調整する仕組みを作った（抄録）。", "p3": "20gの加速度の段差に耐える広帯域の追尾ループは雑音に弱い。そこで、搬送波の雑音密度比に応じたシグモイドの包絡と、弁別器出力から作る動的指標の二層のゲートで観測雑音の共分散Rを膨らませ、雑音が多い間は航法支援の予測で追尾を続ける（抄録）。", "p5": "20gの加速度の段差のシミュレーションで、調整したベクトル追尾の構成を評価している（比較の数値は抄録の範囲で未確認）（抄録）。", "fun": "ロケットが急に加速すると、受信機は電波の追いかけに失敗しやすい。素早く反応できるように感度を上げると、今度は雑音に振り回される。この研究は、状況に合わせて「観測をどれだけ信じるか」を自動で切り替えることで、このジレンマを解こうとした。", "unverified": "スカラー追尾との比較の具体的な数値は抄録が途中で切れており未確認。"}}, {"id": "pr29", "rank": 29, "headline": "スライス・チェビシェフモーメントで差分プライバシー合成データ", "title": "Differentially Private Synthetic Data from Sliced Chebyshev Moments", "url": "https://arxiv.org/abs/2610.42081", "authors": "Lucas Rosenblatt ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Rosenblatt, L., Witter, R. T., & Musco, C. (2026). Differentially Private Synthetic Data from Sliced Chebyshev Moments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "差分プライバシーを満たす合成データの生成で、高次元でもデータ全体の分布の近さを保証できるアルゴリズムSPLICEを提案した（抄録）。", "p3": "目的の分布のスライスしたチェビシェフ多項式のモーメントを雑音つきで測り、それに合う分布を当てはめる。一次元の合成データの多項式法を発展させたもの（抄録）。", "p5": "n件のデータから、プライバシーの定数のもとでスライス・ワッサースタイン距離がÕ(1/√n)の分布を返すことを証明し、この限界はデータの次元によらない。実用面でも最先端の性能だとしている（抄録）。", "fun": "個人情報を守ったまま「本物そっくりのデータ」を作るとき、項目の数が増えると必要な雑音や計算が爆発的に増える「次元の呪い」が壁になる。この研究は、データをいろいろな方向から見た「影」の形を合わせることで、項目が多くても全体の形を保てることを示した。", "unverified": "実データでの比較実験の内容と数値は未確認（抄録が途中まで）。"}}, {"id": "pr30", "rank": 30, "headline": "AIモデルのエネルギー・炭素の開示を103件で監査", "title": "AI Model Energy and Carbon Disclosure: A Source-Audited Study of 103 Releases (2024-2026)", "url": "https://doi.org/10.20944/preprints202611.0050.v1", "authors": "Eugen Spivak", "venue": "Preprints.org", "date": "2026-11-02", "apa": "Spivak, E. (2026). AI Model Energy and Carbon Disclosure: A Source-Audited Study of 103 Releases (2024-2026). https://doi.org/10.20944/preprints202611.0050.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "AIモデルの公開文書が、エネルギーや炭素排出の数値をどこまで載せているかを、出典まで遡れる記録を作って監査した（抄録）。", "p3": "161件の公開について出典をたどれる記録（Release Energy Ledger）を作り、ページの確認を通った2024〜2026年の103件の公開文書を監査した（抄録）。", "p5": "103件のうち85件（82.5%）はエネルギー・炭素・計算量の数値を載せず、17件（16.5%）がエネルギーか炭素の数値を載せていた。推論時のエネルギーを示した文書はなく、17件のうち10件はMetaで、基準・範囲・方法をそろえたのは8件だった（抄録）。", "fun": "家電にはふつう消費電力が書いてあるのに、AIのモデルにはほとんど書いていない。この研究は百を超える公開文書を一つずつ確かめ、8割以上が電気や排出の数字を載せていないことを示した。数字があっても単位や範囲がばらばらで比べられない、という指摘も面白い。", "unverified": "未査読・単著。対象の選び方の詳細は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "将来予測情報の開示を系統的レビューで整理", "title": "Forward-Looking Information Disclosure: A Prisma-Based Systematic Literature Review", "url": "https://doi.org/10.20944/preprints202611.0022.v1", "authors": "Corina Joseph ほか", "venue": "Preprints.org", "date": "2026-11-02", "apa": "Joseph, C., Choi, J. K. A., & Norizan, S. (2026). Forward-Looking Information Disclosure: A Prisma-Based Systematic Literature Review. https://doi.org/10.20944/preprints202611.0022.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "将来予測情報の開示（FLID）に関する研究を、PRISMAの手順で系統的に集めて整理し、研究の空白を示した（抄録）。", "p3": "ScopusとWeb of Scienceの二つのデータベースで、あらかじめ決めた採否の基準により文献を検索した（抄録）。", "p5": "主な理論はエージェンシー理論と印象管理理論で、取締役会が経営者を監視しつつ、将来情報の発信で企業の見せ方を管理する役割を説明していた。ほかに資源ベース理論、正統性理論、シグナリング理論も使われていた（抄録）。", "fun": "会社は「来年はこうなる見込みです」という将来の話を、どこまで、なぜ公表するのか。この研究は、その説明に使われてきた理論の地図を描いた。都合のよい見せ方（印象管理）と正直な情報提供の境目が、開示研究の大きな論点であることが見えてくる。", "unverified": "対象の文献数、年代の範囲、研究の空白の具体的な内容は未確認（抄録が途中まで）。"}}, {"id": "pr32", "rank": 32, "headline": "人員削減が報われるのは規模と余裕のある非上場企業か", "title": "When do workforce reductions pay off? A question of size and slack in privately held firms", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05777700", "authors": "Vivien Lefebvre", "venue": "RePEc NEP", "date": "2026-11-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "非上場企業で人員削減が業績にどう影響するか、そして余裕資源（スラック）がその混乱を和らげるかを調べた（抄録）。", "p3": "スペインの非上場企業の標本で、人員削減と売上・利益の関係と、財務的なスラックの調整効果を分析した（抄録）。", "p5": "人員削減は売上の減少と関連し、中小企業ではさらに利益の減少とも関連した。一方、財務的なスラックがある企業では、人員削減の後に営業利益が増えた（抄録）。", "fun": "人を減らせば人件費は下がるが、仕事を回す力も失う。この研究は、その損得を分けるのが会社の「手元の余裕」だと示した。お金に余裕のある会社だけが人員削減を利益に結びつけられた、という結果は、苦しい中小企業ほど打つ手が限られることを数字で裏づけている。", "unverified": "標本の企業数・期間と、業績の測り方の詳細は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "AI導入と生産性の関係を規模の異なるデータで予測", "title": "SAGE-AIP: A Scale-Adaptive Gated Ensemble Framework for Predicting AI Adoption and Productivity Across Multiple Data Scales", "url": "https://doi.org/10.20944/preprints202611.0013.v1", "authors": "Kittipol Wisaeng ほか", "venue": "Preprints.org", "date": "2026-11-02", "apa": "Wisaeng, K., & Enyiawah, B. A. (2026). SAGE-AIP: A Scale-Adaptive Gated Ensemble Framework for Predicting AI Adoption and Productivity Across Multiple Data Scales. https://doi.org/10.20944/preprints202611.0013.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "AIの導入と生産性の関係を、規模の異なる三つのデータで比べ、データの粒度や生産性の定義によって結論が変わりうることを示す枠組みを作った（抄録）。", "p3": "10か国・八つの産業の145,000件のAI導入の記録、233の国・地域の2,074件の国-年の観測（2015〜2023年）、150人の従業員の観測を使い、頑健回帰、固定効果、差分GMMと、提案するゲートつきアンサンブル（SAGE-AIP）を六つの既存手法と比べた（抄録）。", "p5": "AI導入のデータにはほとんど系統的な構造がなく（R2 = 0.00018）、SAGE-AIPも単純なモデルを上回らなかった（抄録）。", "fun": "「AIを入れると生産性が上がる」という話は、どのデータを見るかで答えが変わる。この研究は大きさの違う三つのデータを並べ、AI導入の記録にはほとんど予測できる構造がなかったと正直に報告した。うまくいかなかった結果も示すことで、主張の強さを測る物差しになる。", "unverified": "国-年データと従業員データでの結果は抄録が途中で切れており未確認。"}}, {"id": "pr34", "rank": 34, "headline": "AIを知るバングラデシュの回答者の雇用不安", "title": "Generative AI and Employment Concerns Among AI Aware Respondents in Bangladesh", "url": "https://doi.org/10.20944/preprints202611.0010.v1", "authors": "Rafia Mahmuda Laboni ほか", "venue": "Preprints.org", "date": "2026-11-02", "apa": "Mahmuda Laboni, R., & Mannan, K. A. (2026). Generative AI and Employment Concerns Among AI Aware Respondents in Bangladesh. https://doi.org/10.20944/preprints202611.0010.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "バングラデシュでAIを知っている成人の回答から、生成AIによる仕事の変化と雇用への不安についての認識を調べた（抄録）。", "p3": "385件の質問票の記録（多くは法学部の学生）で、各項目を回答の分布、対になる支持の比較、探索的な順位相関で別々に分析した。現在の雇用の安定やAIへの接触の効果は直接測っていない（抄録）。", "p5": "385人のうち232人（60.3%）がAIで定型的な専門業務の需要が減りうると答え、307人（79.7%）がAIを使いこなす学びで将来の雇用不安を減らせると答えた。211人（54.8%）は人の判断が要る新しい仕事を予想した（抄録）。", "fun": "AIに仕事を奪われるのでは、という不安は世界中にあるが、この調査では79.7%が「AIの使い方を学べば不安は減る」と答えた。脅威と感じつつも、学びで乗り越えられると考える姿が見える。回答者の多くが法学部の学生だという限界を自ら明記している点も誠実だ。", "unverified": "未査読。回答者の募集方法と、働いている人の割合は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "SNSの能動的利用と精神的健康をつなぐ社会的つながり", "title": "Social connectedness as a pathway linking active social media use and mental health: A mixed-methods study of Chinese international students in the U.S.", "url": "https://doi.org/10.21203/rs.3.rs-10683595/v1", "authors": "Qiyang Zhang ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Zhang, Q., Hwangpo, L. L., Xiong, Y., Shen, H., & Wu, J. (2026). Social connectedness as a pathway linking active social media use and mental health: A mixed-methods study of Chinese international students in the U.S. https://doi.org/10.21203/rs.3.rs-10683595/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "SNS（WeChatなど）の制限が議論される米国で、中国人留学生の能動的なSNS利用が、社会的なつながりを通じて精神的健康と関係するかを調べた（抄録）。", "p3": "説明的順次型の混合研究法で、105件の調査回答と六つの面接を分析し、社会関係資本の理論にもとづいて媒介分析を行った（抄録）。", "p5": "女子留学生は男子より不安と孤独が低く、社会的なつながりと前向きな感情が高かった。社会的なつながりが、能動的なSNS利用と精神的健康の関係を媒介していた（抄録）。", "fun": "遠く離れた家族や友だちとつながるSNSは、留学生にとって生活の命綱になる。この研究は、SNSを見るだけでなく自分から交流する使い方が、つながりの感覚を通して心の健康を支えることを示した。SNSの規制が思わぬ形で孤立を生みうるという指摘にもなっている。", "unverified": "媒介効果の大きさと、面接から得た知見の詳細は未確認（抄録が途中まで）。"}}, {"id": "pr36", "rank": 36, "headline": "欧州の孤独調査データベースの年次更新手順", "title": "Updating the LONELY-EU database of loneliness surveys: preregistered procedure for the yearly releases of the EU Loneliness Explorer", "url": "https://doi.org/10.5281/zenodo.23887432", "authors": "Bertero, Arturo", "venue": "Zenodo", "date": "2026-11-02", "apa": "Bertero, A. (2026). Updating the LONELY-EU database of loneliness surveys: preregistered procedure for the yearly releases of the EU Loneliness Explorer. Zenodo. https://doi.org/10.5281/ZENODO.23887432", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "欧州の孤独に関する調査を集めたデータベース（LONELY-EU）を毎年更新するための手順を事前登録の形で定め、最初の適用結果を報告した（抄録）。", "p3": "既存の検索手順に沿って最新の出版年を毎年検索し、コードブックから既存の行を訂正し、公開前にすべてのセルを監査する。較正した分類器と言語モデルが規則に沿って選別・符号化・監査し、スクリプトが出典と照合し、変更したセルは根拠つきで記録する（抄録）。", "p5": "2025年の出版年に初めて適用してデータベースの第2.0版を作り、その監査結果を報告した（抄録）。", "fun": "孤独についての調査は国ごとにばらばらに行われていて、全体を見渡すのが難しい。この取り組みは、AIに下読みをさせつつ、すべての変更に「なぜ変えたか」の記録を残すことで、毎年更新できる調査の目録を作った。AIを使う研究基盤の透明性の作り方としても参考になる。", "unverified": "収録されている調査の数と対象国の範囲は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "ハリケーン後の住宅の適応の非対称が地域の回復を左右", "title": "Asymmetric Housing Co-adaptation Reshapes Neighborhood Recovery Trajectories after Hurricanes", "url": "https://doi.org/10.21203/rs.3.rs-10887426/v1", "authors": "Susu Xu ほか", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "Xu, S., Li, X., Chen, R., Sang, Y., Hults, G., Liu, J., Harrison, K., Fung, J., Zhang, Y., Dragomir, C., Porfiri, M., & Ceferino, L. (2026). Asymmetric Housing Co-adaptation Reshapes Neighborhood Recovery Trajectories after Hurricanes. https://doi.org/10.21203/rs.3.rs-10887426/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ハリケーン後に世帯が住宅を修理するか売るかの判断が、近隣の世帯どうしの影響で広がり、地域の回復の道筋を変える過程を再構成・予測する枠組みを作った（抄録）。", "p3": "世帯の社会経済条件、住宅の被害、過去の行動と世帯間の影響を組み合わせた世帯レベルの意思決定拡散（HDD）の枠組みを、ハリケーンHarvey・Ida・Ianの後の約2,800の地域の130万を超える世帯について、被害、修理の許可、不動産取引の時系列を結んだ縦断データで評価した（抄録）。", "p5": "HDDは、距離にもとづく方法より高い精度で近隣の潜在的なつながりの構造を復元した（抄録）。", "fun": "災害の後、隣の家が修理を始めると自分も直そう、隣が売れば自分も売ろうか、と人の判断は周りにつられる。この研究は、その「つられ方」を大量の修理許可と売買の記録から読み解き、地域の回復がどう分かれていくかを予測しようとした。", "unverified": "予測精度の具体的な数値と、支援の配分への応用の結果は未確認（抄録が途中まで）。"}}, {"id": "pr38", "rank": 38, "headline": "統合ケアの連携組織での個人健康情報の共有の統治", "title": "Governing personal health information sharing in an integrated care partnership", "url": "https://doi.org/10.21203/rs.3.rs-11556735/v1", "authors": "Kevin McDermott", "venue": "Research Square (In Review)", "date": "2026-11-02", "apa": "McDermott, K. (2026). Governing personal health information sharing in an integrated care partnership. https://doi.org/10.21203/rs.3.rs-11556735/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "カナダ・オンタリオ州の統合ケアの連携組織で、組織をまたぐ個人健康情報の共有がどんな条件で回り、どこで滞るかを、関係者の語りから整理した（抄録）。", "p3": "プライバシー・セキュリティ作業部会の26人中18人がメールの質問票に答え、その18人と別の四人が60分のオンラインのグループ討議に参加した。修正した名目集団法で主題を絞り込み、制度ロジックと両立性の概念でアブダクティブに分析した（抄録）。", "p5": "共有は、目的、受け手、許可、組織の責任が十分に定められているときに回りやすく、安全策、技術的な接続、既存の関係も支えになっていた（抄録）。", "fun": "病院や診療所、介護事業所が患者の情報を共有できれば支援はつながるが、「誰が責任を持つのか」があいまいだと共有は止まる。この研究は、技術よりも先に、目的と責任の取り決めが共有を動かす鍵だと示した。地域のケアの連携を考えるうえで身近な論点だ。", "unverified": "制約された共有の類型の詳細は未確認（抄録が途中まで）。"}}, {"id": "pr39", "rank": 39, "headline": "LLMエージェントの通商交渉を実行結果で評価する", "title": "TradeWar: A Benchmark for Execution-Grounded Trade Negotiation with Adaptive LLM Agents", "url": "https://arxiv.org/abs/2610.42004", "authors": "Xiangyu Kong ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Kong, X., Yang, R., & Hou, X. (2026). TradeWar: A Benchmark for Execution-Grounded Trade Negotiation with Adaptive LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42004", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMエージェントの交渉を、合意したかどうかではなく、合意を実行したときに経済的な価値が生まれたかで評価する多国間のシミュレーション・ベンチマークを作った（抄録）。", "p3": "交渉の対話を関税と貿易シェアの政策に変換し、決済の段階で生産能力とネットワークの制約を課し、経済健全性指数（EHI）で結果を評価する。あわせて、基盤モデルの重みを更新せず、過去の経験、相手の行動、決済の結果から戦略を改良するエージェントTACTICを提案した（抄録）。", "p5": "TACTICはゼロショットの思考の連鎖で動くが、他の手法との比較の数値は抄録が途中で切れており確認できなかった（抄録）。", "fun": "交渉で「合意しました」と言っても、その約束が実際に得になるとは限らない。この研究は、AI同士の通商交渉を、約束を実行した後の経済の健全さで採点する仕組みを作った。口約束ではなく結果で評価するという発想は、人間の交渉の評価にも通じる。", "unverified": "TACTICと他の手法の比較結果の数値は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "介護者のセルフケアを支える多様な教育介入の設計", "title": "Caregiver Self-Care: Design of a Multimodal Educational Intervention in the Southwest Integrated Health Services Subnetwork of Bogotá", "url": "https://doi.org/10.5281/zenodo.23864578", "authors": "Daza-Núñez ほか", "venue": "Zenodo", "date": "2026-11-01", "apa": "Daza-Núñez, D., Díaz-Villegas, A., Díaz-Calle, L., Díaz-Gómez, A. S., Chamorro-Ardila, N., & Palencia-Sánchez, F. (2026). Caregiver Self-Care: Design of a Multimodal Educational Intervention in the Southwest Integrated Health Services Subnetwork of Bogotá. Zenodo. https://doi.org/10.5281/ZENODO.23864578", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "コロンビア・ボゴタの医療サービス網で、インフォーマルな介護者のセルフケアと情緒的な健康を支える、地域に合わせた多様な形式の教育介入を設計した（抄録）。", "p3": "Scopus、PubMed/MEDLINE、Embaseと灰色文献、ボゴタの既存の事業を系統的に調べ、ADDIEモデル（分析・設計・開発の段階）と八段階の健康教育の枠組みで介入を組み立てた（抄録）。", "p5": "介入の設計までを示した段階で、効果の評価結果は抄録の範囲では報告されていない（抄録）。", "fun": "家族の介護をする人は、自分の不安や疲れを後回しにしがちだ。ボゴタには「ケアの街区」「ケアのバス」という地域の取り組みがあるが、病院の中での心の支えは手薄だった。この研究は、介護する人自身を支える教材を、地域の仕組みに合わせて一から設計しようとしている。", "unverified": "介入の具体的な内容（教材の形式・回数）と効果の評価は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "1,346の推定でTWFEと新しいDiDの差を検証", "title": "How Different are Different Differences-in-Differences? A Large-Scale Meta-Analysis", "url": "https://doi.org/10.3386/w35974", "authors": "Peter Hull", "venue": "NBER Working Paper", "apa": "Hull, P. (2026). How Different are Different Differences-in-Differences? A Large-Scale Meta-Analysis (NBER Working Paper No. 35974). National Bureau of Economic Research. https://www.nber.org/papers/w35974", "why": "経済学108論文・1,346の段階的導入の推定をAIの支援で再現し、二方向固定効果の負の重みの問題が実際の推定値をどれだけ変えるかを大規模に示した。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用（NBERの本文は入手できず）", "preprint": true, "p1": "段階的に導入された政策の効果を推定する二方向固定効果（TWFE）回帰の「負の重み」の問題が、実際の研究の結論をどれだけ変えるかを、AIの支援による再現で大規模に評価した（抄録）。", "p2": "近年の計量経済学は、処置の時期がずれるとTWFE推定が負の重みをもち、効果の符号まで逆転しうると指摘し、新しい差分の差分（DiD）の手法を提案してきた。ただ、その問題が実際の実証研究でどれほど深刻かは分かっていなかった（抄録）。", "p3": "経済学の108本の論文から1,346の段階的導入の推定の指定を集め、AIの支援でTWFEと現代的なDiDの両方の推定を再現して比べた。推定の雑音を考慮する階層モデルで、推定対象どうしの相関と、符号が逆になる確率を推定した（抄録）。", "p4": "推定値の相関、観測された符号の逆転の割合、精度、階層モデルによる推定対象の相関と、TWFEが有意で現代的な推定対象と逆符号になる確率を指標とした（抄録）。", "p5": "TWFEの推定値は現代的なDiDの推定値と強く相関し、観測された符号の逆転は比較の10.8〜14.5%で、TWFEのほうが精度が高かった。階層モデルでは推定対象どうしの相関は91〜98%、TWFEが有意で現代の推定対象と逆符号になる確率は0.6〜2.1%だった（抄録）。", "p6": "抄録の範囲では、論文の選び方、使った現代的DiDの手法、AIによる再現の正確さの検証は確認できない。解釈：負の重みが大きな問題にならないのは平均的な話で、個々の研究では深刻な場合も残りうる。", "fun": "新しい統計手法が「古いやり方は間違っているかもしれない」と警告すると、過去の研究がすべて疑わしく見えてくる。この研究はAIの力を借りて千を超える分析をやり直し、実際には古いやり方でもほとんどの場合同じ結論になることを示した。警告の大きさを実データで測り直す発想が面白い。", "unverified": "AIによる再現の誤りの検証方法と、使った推定量の種類は未確認（本文を入手できず）。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "安全性を損なう学習データを勾配から逆にたどる", "title": "Follow the Gradient: Tracing Safety Degradation Back to Training Data", "url": "https://arxiv.org/abs/2610.37481", "authors": "Saket Reddy ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-02", "apa": "Reddy, S., Abbas, A., Suri, A., Morcos, A., Schwab, D., & Maini, P. (2026). Follow the Gradient: Tracing Safety Degradation Back to Training Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37481", "why": "一見無害な指示データによる微調整がLLMの安全性を損なう問題に対し、勾配を使って原因となる訓練データを特定する方法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、SafeTuluの方法、限界の節）を読んだ", "preprint": true, "p1": "一見無害な指示データで微調整するとLLMの安全性が落ちる問題に対し、勾配の埋め込みで「安全でない振る舞いと勾配の向きがそろう訓練例」を見つけて除く、百万件規模に使える方法SimpleLoRIFを作った（抄録）。", "p2": "安全性を損なうデータは見た目が無害なので、通常の内容フィルタでは捕まえにくい。勾配による訓練データの帰属分析は小規模な分析道具にとどまっていた（抄録、§1）。", "p3": "低ランクの影響関数による帰属法（LoRIF）を簡単にし、逆伝播を最後の四つのトランスフォーマー・ブロックに限って、データセット全体の勾配埋め込みを計算する。各訓練例を、安全でない応答の集合（SafeRLHFの43,469例）のクラスタ中心との勾配の類似度で採点し、上位20%を除いて微調整する（抄録、§3、§5.1）。", "p4": "まず創発的な不整合（安全でないコードで微調整すると広く有害な振る舞いが出る現象）で検証した。次にTulu 3（939,343例）から作ったSafeTuluでQwen 3 1.7B、Llama 3.2 1B、Olmo 2 1Bを微調整し、白箱のGCG攻撃と多ターンのActorBreaker攻撃の成功率、能力の評価で、LLMによる判定や従来の勾配フィルタと比べた（§4、§5.1）。", "p5": "創発的な不整合では、勾配が安全でないコードの訓練データとその後の有害な振る舞いを結びつけ、不整合なモデルの勾配空間でAUCは最大0.865だった。SafeTuluで学習するとGCG攻撃の成功率がQwen、Llama、Olmoで最大22%下がり、LLMによる判定や従来の勾配フィルタより良く、能力はほぼ保たれるか向上した。除いたデータには、道具の実行の失敗や物語形式の算数など、見過ごされてきた劣化の源が含まれていた（抄録、§5、§6）。", "p6": "一般的な安全性の劣化だけを調べ、へつらいなど特定の害は試していない。目標の集合はSafeRLHFだけで、ほかの目標集合は試していない（§9）。", "fun": "一つひとつは無害な食材でも、組み合わせると体に合わないことがある。AIの学習データも似ていて、一見何の問題もないのに、学ぶとAIが危ない答えをしやすくなるデータがある。この研究は「学習したときにAIの中身をどちらへ動かすか」を測ることで、そうした隠れた悪影響のデータを見つけ出した。", "unverified": "ActorBreaker攻撃での結果の数値と、除く割合を変えたときの結果は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "両側市場のA/Bテストの干渉バイアスを減らす推定量", "title": "The Double Diagonal Estimator: Reducing Bias in Two-Sided Marketplace Experiments", "url": "https://arxiv.org/abs/2610.41294", "authors": "Saanvi Chawla ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Chawla, S., & Syrgkanis, V. (2026). The Double Diagonal Estimator: Reducing Bias in Two-Sided Marketplace Experiments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41294", "why": "売り手と買い手が互いに影響し合う両側市場の実験で生じる干渉によるバイアスを減らす、新しい推定量を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、推定量の定義、実験結果、限界、結論の節と表1）を読んだ", "preprint": true, "p1": "売り手と買い手が互いに影響する両側市場の実験で、両側を無作為化した実験から干渉に強い処置効果を推定する二重対角推定量（DD）を提案し、理論と数値実験で既存の推定量と比べた（抄録）。", "p2": "両側市場の通常のA/Bテストは参加者間の干渉で大きく偏る。供給と需要の両方を無作為化する方法（TSR）はあるが、実務でよくある需給の釣り合った市場でどの推定量を選ぶべきかの指針は乏しかった（抄録）。", "p3": "処置×処置と対照×対照の組の結果を比べ、対角でない組（処置×対照、対照×処置）の相互作用で干渉による偏りを補正する。単純化した平均場の市場モデルで、標準的なTSR推定量（TSRN）と理論的に比べた（抄録、§6〜§7）。", "p4": "異質な処置効果、需給の不均衡、さまざまな市場構造を含む40の市場設定のシミュレーションで、DD、TSRN、片側の推定量、TSRI-k推定量の偏りを比べた（§8.1、表1）。", "p5": "理論では、外部の選択肢の魅力がプラットフォームの選択肢の約二倍以下なら、DDの偏りはTSRNより厳密に小さく、DDは過小評価、TSRNは過大評価と偏りの向きが逆になる。40の設定のうちDDは35で偏りが最小で、相対的な偏りの中央値は20.5%（TSRNは117.1%）、偏りが25%未満の設定は28（TSRNは1）だった（抄録、表1）。", "p6": "効果が逆向きに混ざる場合（DD 44.5%、TSRN 34.5%）や外部の選択肢が支配的な場合はDDの偏りが大きい。理論は単純な均質の市場に限られ、分散は考えておらず、介入が到着率や滞在時間を変える場合も扱っていない（§8.2、§8.3）。", "fun": "フリマアプリで「おすすめ表示」を変える実験をすると、変えたグループの客が人気の商品を先に買い、変えていないグループの客が買えなくなる、といったことが起きうる。こうしたお互いへの影響が実験の結果をゆがめる。この研究は、買い手と売り手の組み合わせ方の違いを利用して、そのゆがみを打ち消す工夫を示した。", "unverified": "実際のプラットフォームのデータでの検証の有無は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "機械が仕事を担う世界の成長と資本蓄積の理論", "title": "Saving for the Machines", "url": "https://doi.org/10.3386/w35964", "authors": "Jesús Fernández-Villaverde", "venue": "NBER Working Paper", "apa": "Fernández-Villaverde, J. (2026). Saving for the Machines (NBER Working Paper No. 35964). National Bureau of Economic Research. https://www.nber.org/papers/w35964", "why": "機械が担える作業が増える世界で、作業の構造と資本蓄積の反応という2つの経路から経済成長を理論的に整理した。", "explain": {"basis": "抄録", "basis_note": "NBERの抄録を使用（本文は入手できず）", "preprint": true, "p1": "機械が担える作業が増えるとき、経済成長は「機械を蓄積する収益が作業の構造でどう決まるか」と「資本の蓄積がその収益にどれだけ反応するか」の二つで決まると論じ、標準的な作業（タスク）モデルで定量化した（抄録）。", "p2": "自動化が進んでも成長が加速しないのは、技術の制約のせいなのか、資本の蓄積が足りないせいなのかは区別されていなかった（抄録）。", "p3": "標準的な作業モデルで、資本の供給が自動化に伴う成長ブームの大きさを、作業の構造がブームの長さと賃金の推移を決めることを示す。家計が貯蓄率を最適に選ぶ場合と、2025年の米国の水準23%に固定する場合で、同じ技術の経路を比べた（抄録）。", "p4": "較正したモデルで、年成長率、貯蓄率の変化の原因、長期の実質利回り、手元の資金で暮らす家計の厚生の損失を評価した（抄録）。", "p5": "同じ技術の経路でも、貯蓄率を最適に選べば年成長率は11.7%、23%に固定すると2.2%にとどまった。貯蓄率が上がるのは家計が倹約するからではなく、自動化で資本の分配率が上がるためだった。10年物の実質利回りは5.1%から13.6%に跳ね上がる。手元の資金で暮らす家計は消費の五分の二〜三分の二に相当する損失を受け、彼らを趨勢に保つ費用はGDPの最大五分の一だった（抄録）。", "p6": "抄録の範囲では、作業の構造や技術の経路の仮定、較正の詳細は確認できない。解釈：成長率の数値はモデルの較正に強く依存し、予測ではなく仕組みの例示として読むべきだろう。", "fun": "ロボットやAIが人の仕事を次々にこなせるようになれば、経済は急成長するはずだ。ところがこの論文は、成長の速さを決めるのは技術よりも「機械を買うためにどれだけ貯めて投資するか」だと示した。貯蓄の仕方しだいで成長率が11.7%にも2.2%にもなる、という差の大きさが面白い。", "unverified": "モデルの詳しい仮定と、賃金の推移の結果は未確認（本文を入手できず）。"}}, {"id": "pn05", "rank": 5, "field": "オペレーションズ・リサーチ", "headline": "確率的勾配降下法の最適なステップ幅を厳密に導く", "title": "Exact Theory and Optimal Stepsizes for Stochastic Gradient Descent in Smooth Convex Minimization", "url": "https://arxiv.org/abs/2610.42048", "authors": "Benjamin Grimmer ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Grimmer, B., & Shen, Q. (2026). Exact Theory and Optimal Stepsizes for Stochastic Gradient Descent in Smooth Convex Minimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.42048", "why": "滑らかな凸最適化での確率的勾配降下法について、ステップ幅のスケジュールの厳密な理論と最適な選び方を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論の主要結果、最適なステップ幅の節、付録B）を読んだ", "preprint": true, "p1": "滑らかな凸最適化での確率的勾配降下法（SGD）について、どんなステップ幅の列に対しても最後の反復点の期待誤差の最悪値を厳密に求め、最適なステップ幅の列を導いた（抄録、§1）。", "p2": "SGDのステップ幅は経験則で選ぶことが多く、勾配に雑音があるときの最終反復点の最悪の誤差を厳密に示す理論はなかった。雑音のない勾配降下法では、固定のフラクタル状のスケジュールで加速できることが知られていた（抄録、§1.2）。", "p3": "勾配の雑音は条件つきで平均ゼロ・分散有界とし、次元がN+1以上の問題で、[0,1.5]のN個のステップ幅について性能推定問題（PEP）を厳密に解く。上界は帰納法（モロー包絡の列として解釈できる）で、下界は等号を達成する最悪の目的関数と雑音分布を作って示す（抄録、§2〜§3）。", "p4": "最悪の期待誤差を、初期距離の項と各反復の雑音の項（残りのステップ幅の合計R_jに依存する）の和として表し、上界と下界が一致するかで厳密さを確かめる（定理1.1）。", "p5": "上界と下界が一致し、最悪の期待誤差を厳密に与えた。σ=0では決定論的な勾配降下法の数値的な予想と一致した。分散の上限がΩ(1/√N)以上なら、ミニマックス最適なステップ幅の列が一意に存在し、それは単調に減少する。したがって、雑音のない場合に見られる固定のフラクタル状のスケジュールによる加速は、期待最終誤差では起こらない（抄録、§1.1）。", "p6": "結果はステップ幅が1.5以下の短いステップの領域と、次元が反復回数より大きい問題に限られる（定理1.1）。著者は、最悪の例と証明の発見に数値最適化とChatGPTの助けを使ったと明記している（付録B）。", "fun": "坂道を下って谷底を探すとき、歩幅を大きくすれば速く進めるが、足元がぶれると行き過ぎる。この研究は、ぶれがある状況で「どの順番で歩幅を変えれば最悪でも一番うまくいくか」を厳密に解き、答えは歩幅を少しずつ小さくしていくことだと示した。発見にAIの助けを借りた経緯を正直に書いている点も興味深い。", "unverified": "最適なステップ幅の具体的な式（式1.8）の形と数値例は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "確率標本と非確率標本をMNARの下で統合する", "title": "A Semiparametric Model Approach to Data Integration under Missing Not at Random", "url": "https://arxiv.org/abs/2610.41937", "authors": "Danhyang Lee ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Lee, D., Morikawa, K., & Kim, J. K. (2026). A Semiparametric Model Approach to Data Integration under Missing Not at Random (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41937", "why": "選ばれ方が未知の非確率標本を確率標本と統合する際に、欠測が無作為でない場合も扱えるセミパラメトリックな方法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、方法の構成、健診データのシミュレーションの設定、結びの節）を読んだ", "preprint": true, "p1": "確率標本（無作為抽出の調査）と非確率標本（ウェブ調査など）を統合して母集団の平均を推定するとき、選ばれ方が結果の値そのものに依存する（MNAR）場合にも使えるセミパラメトリックな方法を作った（抄録）。", "p2": "非確率標本の選ばれ方は未知で、結果の値に依存することもあるが、従来の統合法の多くは無作為な欠測（MAR）の仮定や、共変量への依存の関数形の正しい指定を必要とした（抄録、§1）。", "p3": "選ばれ方を、共変量への依存を表す指定しない関数と、結果への依存を表す一つの傾けのパラメータで表す。操作変数の除外制約と条件つき完全性で識別し、傾けがゼロならMARの部分モデルになる。共変量の成分をプロファイルで消し、傾けのパラメータと母集団平均の両方に、交差適合したネイマン直交な推定方程式を作る（抄録、§2〜§3）。", "p4": "シミュレーションで、柔軟さの代償、共変量の成分の誤指定への頑健さ、無効な操作変数や傾けの誤指定の影響を調べた。さらに韓国の2014年の国民健康診断の匿名データ5万件を有限母集団とするシミュレーションで、パラメトリックな競合と比べた（抄録、§5〜§6）。", "p5": "直交化した大量代入推定量は、局外母数の速さの条件のもとで中心化された√N推測ができ、分散は抽出の設計と傾けの推定を考慮する。健診データでは、基準の操作変数の組で、パラメトリックな競合より偏りは小さいが平均二乗誤差の平方根は大きかった。提案法は操作変数の組を変えても推定値のばらつきが小さかったが、弱い操作変数や平滑化の選び方が精度と区間の被覆に影響した（抄録、§7）。", "p6": "柔軟さは共変量の誤指定による偏りや操作変数の組への感度を減らすが、RMSEを一様には改善しない。有効な除外制約、十分な識別の情報、安定した局外母数の推定が欠かせず、帯域幅の選び方や弱い操作変数での推測の手順は今後の課題（§7）。", "fun": "ネットのアンケートは安く大量に集まるが、答えた人が世の中全体を代表しているとは限らない。とくに「健康に関心のある人ほど答えやすい」のように、調べたい値そのものが答えやすさに影響すると、ふつうの補正では偏りが残る。この研究は、正式な調査を物差しにして、その偏りの向きまで推定しながら補正する方法を作った。", "unverified": "シミュレーションの各条件での数値（表）は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "回帰不連続が使えないとき英国の出産休業改革を評価", "title": "Evaluating Maternity Leave Reforms When RD Fails", "url": "https://arxiv.org/abs/2610.41881", "authors": "Clara von Bismarck-Osten ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "von Bismarck-Osten, C., & Zeleneev, A. (2026). Evaluating Maternity Leave Reforms When RD Fails (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41881", "why": "回帰不連続デザインが成り立たない状況で英国の出産手当の拡充を評価し、子どもの学力の向上と母親の就業の減少を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、データの節、結論の節）を読んだ", "preprint": true, "p1": "2000年代の英国の出産休業の拡充（手当の延長と雇用保護の延長）を評価し、手当の拡充が子どもの学力を上げ母親の就業を減らしたこと、これらが通常の回帰不連続デザイン（RD）では見つからないことを示し、代わりの代入法を提案した（抄録、§5）。", "p2": "改革の対象は出産の予定日で決まるが、データには実際の誕生日しかない。この測定誤差で通常のRDの不連続が消え、既存の補正法は誤差が結果と関係する場合に使えない（§5）。", "p3": "改革前の処置を受けていないコホートを使い、平行トレンドの仮定で改革がなかった場合の平均的な結果を代入する。実際と予定の誕生日を記録した検証用データから各誕生日での処置を受けた割合を求め、観測と代入の平均の差をその割合で割って、各誕生日の対象児への効果を識別する（§3、§5）。", "p4": "イングランドの公立学校の全児童の行政データで、5歳・7歳・11歳の試験の得点を、改革の年度の生まれ（1コホート約60万人）と前年度の生まれで比べた。母親の就業と労働時間は出産後六年まで分析し、地域の貧困度で効果の違いも調べた（§2、§4）。", "p5": "主に手当を延ばした2007年の改革は5歳の得点を0.045標準偏差（試験時の年齢で約25日分）上げ、11歳でも約15日分の効果が残った。5歳の効果は最も貧しい五分の一の地域で最も豊かな地域の約二倍だった。2003年の改革の効果は2007年の半分未満で、2000年の雇用保護だけの延長には効果がなかった。三つの改革とも母親の就業と労働時間を減らした（§5）。", "p6": "代入法は、処置を受けていない比較可能なコホートと、観測できる誕生日ごとの処置の確率を復元する補助データを必要とし、平行トレンドの仮定に依存する（§5）。", "fun": "出産休業の制度の対象は「出産予定日」で決まるが、記録に残るのは実際の誕生日だけだ。早産などで予定日とずれるため、境目の前後を比べる通常の方法では効果が見えなくなる。この研究は、別のデータで予定日と実際の日のずれ方を推定して効果を取り出した。データの小さなずれが結論を左右するという例として面白い。", "unverified": "母親の就業への効果の大きさの数値と、母親側の分析に使ったデータの詳細は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "LLMの強化学習で学習と推論のずれが生まれる由来", "title": "On the Origin and Evolution of Training-Inference Mismatch in LLM Reinforcement Learning", "url": "https://arxiv.org/abs/2610.40945", "authors": "Yu Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-02", "apa": "Li, Y., Zhou, Y., & Lan, T. (2026). On the Origin and Evolution of Training-Inference Mismatch in LLM Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40945", "why": "LLMのオンポリシー強化学習で、学習時と推論時の応答の確率のずれがどこから生まれ、どう広がるかを分析した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、節の構成、結論の節）を読んだ", "preprint": true, "p1": "LLMの強化学習で、応答を生成する推論エンジンと勾配を計算する学習器の間の「学習と推論のずれ」を、エンジンの数値的な違いと非同期の古い重みによる遅れの二つに厳密に分け、それぞれに必要な補正を導いた（抄録、§8）。", "p2": "オンポリシーの強化学習は応答が現在の方策から得られると仮定するが、実際は推論エンジンと学習器が別で、学習データは方策外になる。一方のずれに効く補正が他方では失敗することがあり、どの性質が必要な補正を決めるのかは分かっていなかった（抄録）。", "p3": "学習器をサンプラーの重みで評価し直し、サンプルしたトークンごとの誤差を、エンジンの数値的な違いと学習器の方策の遅れに厳密に分解して学習を通じて追跡した。そのうえで、数値的な違いを中心化し、遅れの比を切り詰め、比の有効サンプルサイズが二分の一を下回ったらサンプラーを再同期する補正（DLC）を提案した（抄録、§4.2、§7.1）。", "p4": "Qwen3-0.6BとQwen3-1.7Bで、古いサンプラーのもとでのオンポリシー学習からのKLダイバージェンス、テスト精度、初期方策の台の外にある確率の量などで、トークンごとの補正と比べた（§7）。", "p5": "数値的な違いは学習中ほぼ一定で、各接頭辞で得点を中心化すれば主な偏りが除ける。方策の遅れは学習器自身の更新から生まれ、残った偏りが次の更新に入って次の遅れを大きくするフィードバックの輪を作る。重要度重みはこの輪を比が集中している間しか断てず、Qwen3-1.7Bでは有効サンプルサイズが二分の一を下回った時点で失敗した。DLCは独立なオンポリシー学習二回の間のKLの二倍以内に保ち、トークンごとの補正で起きる崩壊を防いだ（抄録、§8）。", "p6": "実験は二つの小さなモデルに限られる（抄録）。解釈：より大きなモデルや他のエンジン・課題への一般化は未確認。", "fun": "AIの強化学習では、問題を解く係と、その結果から学ぶ係が別々に動いていて、両者の間に小さな食い違いが生まれる。この研究は、食い違いには「計算の丸めのような一定のずれ」と「学ぶ係が先に進みすぎて生まれる遅れ」の二種類があり、後者は放っておくと雪だるま式に大きくなることを示した。原因ごとに処方を変える発想が面白い。", "unverified": "テスト精度の具体的な数値と、他の補正法との比較の詳細（§7.2の図表）は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "汚染監視の情報はアナリストの企業評価を変えるか", "title": "Pollution Monitoring and the Pricing of Environmental Risk in Firms", "url": "https://doi.org/10.3386/w35969", "authors": "Namrata Kala ほか", "venue": "NBER Working Paper", "apa": "Kala, N., Sani, J., Shroff, N., & Zhang, P. (2026). Pollution Monitoring and the Pricing of Environmental Risk in Firms (NBER Working Paper No. 35969). National Bureau of Economic Research. https://www.nber.org/papers/w35969", "why": "汚染情報の目立ちやすさが高まると、財務アナリストなど専門家の信念と企業の評価が変わるかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの記録に登録された抄録を使用（NBERの本文は入手できず）", "preprint": true, "p1": "汚染の情報が目立つようになると、財務アナリストが担当企業の環境リスクをどう評価するか、それが株価に反映されるかを、中国の大気質の監視網の段階的な導入を使って検証した（抄録）。", "p2": "企業の環境リスクを価格に正しく反映させることは資本の効率的な配分に重要だが、汚染の情報の目立ちやすさが専門家の信念と企業評価を変えるかは分かっていなかった（抄録）。", "p3": "都市ごとの大気質の監視の導入時期のずれを使い、監視が始まった都市に拠点を置くアナリストの報告書での大気汚染への言及、報告書に対する株価の反応、企業訪問による情報収集、評価の変化を調べた（抄録）。", "p4": "報告書での大気汚染への言及、報告書の公表時の市場の反応とその後の反転の有無、企業訪問、汚染の多い企業（ブラウン）と環境配慮の企業（グリーン）への評価を指標とした（抄録）。", "p5": "監視が導入されると、その都市のアナリストは大気汚染に言及する可能性が大きく高まった。処置を受けたアナリストの報告書は、ブラウン企業ではより否定的、グリーン企業ではより肯定的な市場の反応を生み、環境に中立な企業ではほとんど変化がなく、反応は後で反転しなかった。アナリストは企業訪問を増やし、ブラウン企業に厳しく、グリーン企業に好意的な評価を出した（抄録）。", "p6": "抄録の範囲では、効果の大きさ、アナリストと企業の数、期間は確認できない。解釈：拠点の都市の空気を体験することの効果と、監視データの公開そのものの効果を分けられているかは本文で確かめる必要がある。", "fun": "空気の汚れが毎日数字で発表されるようになると、その街にいる証券アナリストは、担当する会社の環境のリスクに敏感になった。汚染の多い会社には厳しく、環境に配慮した会社には好意的になり、株価もそれに合わせて動いた。見えなかったものが見えるようになるだけで、お金の流れが変わる点が面白い。", "unverified": "効果の大きさの数値、標本の規模と期間は未確認（本文を入手できず）。"}}, {"id": "pn10", "rank": 10, "field": "ヒューマンコンピュータインタラクション", "headline": "AIチームメイトとの5週間で学生の関わり方はどう変わるか", "title": "Out of sync: Accommodation, evaluation, and emergence in five weeks with an agentic AI teammate", "url": "https://arxiv.org/abs/2610.41057", "authors": "Nia Nixon ほか", "venue": "arXiv", "date": "Mon, 02 Nov 2026", "apa": "Nixon, N., Choi, J., de Bastos, P. M., & Samadi, M. A. (2026). Out of sync: Accommodation, evaluation, and emergence in five weeks with an agentic AI teammate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.41057", "why": "自ら動くAIエージェントを授業のチームメイトとして5週間使う縦断実験で、学習者の適応とAIへの評価の変化を調べた。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDFの本文（抄録、方法の構成、結果の主要な検定、限界の節）を読んだ", "preprint": true, "p1": "授業の学生チームに、自分で発言のタイミングを決めて毎週参加し続けるLLMのチームメイトを入れ、学生がAIの主体性にどう適応し、どう評価し、何を得るかを三つの時間スケールで追った縦断実験（抄録）。", "p2": "教育のAIは受け身の道具から自ら動き続ける相手へと変わりつつあるが、学習者がそうした人工的な主体性とどう関わるかは、一回きりの評価では分からない（抄録、§1）。", "p3": "学部の学習分析の授業で、17チーム（48人）が毎週LLMのチームメイトと協働した。エージェントは引き金にもとづく仕組みで介入の時を決め、社会的な役割をチーム間で操作した。素早い合意に異を唱える認知型と、静かなメンバーに発言を促す支援型である（抄録、§4）。", "p4": "チャットの談話（言葉づかいの辞書による分析）、各回の後の調査、口頭の振り返りを組み合わせ、小標本に合わせてチーム単位の無作為化推論とHedgesのgで効果を評価した（§4、§5）。", "p5": "学生は初回から役割に合わせて言葉を変え、支援型には社交的な言葉を多く使った（p = .095、g = 0.81）。有用性の評価は、AIへの事前の態度ではなく、回ごとに観察したエージェントの振る舞いに合わせて更新された。協働の過程の評価と振り返りの前向きな語では、支援型のチームは最初は認知型より低かったが最後には上回った（p = .015、g = 1.30）。一方、支援型はどの回でも認知型より役に立たないと評価された（p < .00
