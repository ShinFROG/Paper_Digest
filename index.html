. (2026). Post-Purchase Emotional Collapse: LLM-Assisted Analysis of Online Consumer Complaint Narratives. Trends in Business and Economics, 40(4), 739–761. https://doi.org/10.16951/trendbusecon.1959160", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "ネット通販で繰り返すサービスの失敗が積み重なって起きる「購入後の感情崩壊」を定義し、LLMを補助にした苦情の物語の分析で特徴を描いた（抄録）。", "p3": "トルコの苦情サイトsikayetvar.comの苦情1,000件を、LLMによる感情のコーディング、接点の特定、比喩分析、物語の分類で質的内容分析し、一部を人が検証する。", "p5": "配送の失敗が最も多くコードされた断絶点で、怒り・失望・後悔が主な感情として多くコードされた。苦情の物語には、だまし・戦い・破壊の比喩が含まれていた（抄録）。", "fun": "1回の配送ミスなら「まあいいか」で済むかもしれません。でも失敗が重なると、怒りが「裏切られた」という気持ちにまで変わっていきます。この研究は、苦情の文章に出てくる「戦い」や「だまし」といった比喩から、客の心が壊れていく過程を読み取りました。", "unverified": "人による検証の一致度は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "持続可能金融の規制はESG評価を株価に織り込ませるか", "title": "Beyond Disclosure: Sustainable Finance Regulation and the Pricing of ESG Performance in Mature Capital Markets", "url": "https://doi.org/10.1002/bse.71692", "authors": "Nicola Del Sarto", "venue": "Business Strategy and the Environment", "date": "2026-10-16", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Del Sarto, N. (2026). Beyond Disclosure: Sustainable Finance Regulation and the Pricing of ESG Performance in Mature Capital Markets. Business Strategy and the Environment. https://doi.org/10.1002/bse.71692", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "EURO STOXX 50とS&P 100の大企業（2015〜2024年）で、ESGの成績が企業価値と収益性にどれだけ結びつくか、EUの持続可能金融の規制でそれが変わったかを調べた（抄録）。", "p3": "企業と年の固定効果モデルで、1期前のESG成績とトービンのQ、会計上の収益性の企業内の関連を推定し、2018年のEU行動計画と2021年の開示規則（SFDR）の前後で欧米の企業を比べ、ESGの不祥事の調整効果も見る。", "p5": "ESGの改善はトービンのQと正だが弱く関連し、収益性とは系統的な関係がなかった。規制の節目のあとにEU企業でESGと価値の関係が強まった証拠はなく、不祥事はESGの価値関連性を弱める方向に働いた（抄録）。", "fun": "「ESGに取り組めば株価が上がる」「規制で開示すれば投資家が評価する」とよく言われます。ところが欧米の大企業を10年分調べると、その効果はわずかで、規制のあとも強まりませんでした。期待と実際の差を冷静に測った研究です。", "unverified": "係数の値は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "機関投資家の保有と雇用差別訴訟のリスク", "title": "Institutional Ownership and Corporate Exposure to Equal Employment Opportunity Lawsuits", "url": "https://doi.org/10.1111/corg.70066", "authors": "Chelsea Liu", "venue": "Corporate Governance: An International Review", "date": "2026-10-16", "sjr": 1.992, "citescore": 8.7, "citescore_year": "2025", "apa": "Liu, C. (2026). Institutional Ownership and Corporate Exposure to Equal Employment Opportunity Lawsuits. Corporate Governance: An International Review. https://doi.org/10.1111/corg.70066", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "機関投資家の大口保有が多い企業ほど、雇用機会均等（EEO）の訴訟が少ないことを、2001〜2020年の22,501件の訴訟で示した（抄録）。", "p3": "米連邦裁判所の公民権法第7編の訴訟データで、機関投資家の大口保有との関連を推定し、ラッセル3000指数への採用を操作変数にした分析や変化分析などで頑健性を確かめる。", "p5": "関連は能動・受動、長期・短期の投資家に共通して成り立った。訴訟のあと、最大の投資家は資金を引き揚げ（退出）、短期投資家は議決権行使を強め（発言）、CEOの強制交代が増えた（規律）。低技能の労働環境で役割が大きかった（抄録）。", "fun": "働く人への差別は、会社にとって訴訟という形でお金のリスクになります。株を多く持つ投資家がいる会社ほど訴訟が少なく、訴えられると投資家が株を売ったり、社長が交代させられたりしていました。株主が従業員の扱いを見張る役割も担っていることを示しています。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "危機下のスマートシティを立て直すガバナンス", "title": "Governance innovation for crisis-stricken smart cities: A roadmap to recovery and sustainability", "url": "https://doi.org/10.1177/00208523261497985", "authors": "Alessandro Casali ほか", "venue": "International Review of Administrative Sciences", "date": "2026-10-16", "sjr": 1.163, "citescore": 7.9, "citescore_year": "2025", "apa": "Casali, A., Russotto, M., Mozzoni, I., & Ferretti, M. (2026). Governance innovation for crisis-stricken smart cities: A roadmap to recovery and sustainability. International Review of Administrative Sciences. https://doi.org/10.1177/00208523261497985", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "財政危機に陥ったイタリアのパルマ市が、協働的なガバナンスと技術でスマートシティに転換し、危機を乗り越えた事例から、行政への道筋を示した（抄録）。", "p3": "パルマの転換の事例研究として、協働的ガバナンスの革新と技術の利用によるスマートサービスの仕組みを分析する。", "p5": "パルマは危機を克服し、2017年以降、年次のICity Rank指数で上位のスマートシティになったとし、効率的で効果的なスマートサービスのモデルを作るための青写真を示した（抄録）。", "fun": "お金がなくて困っている町ほど、新しい技術に投資する余裕はなさそうに思えます。ところがパルマ市は、市民や企業と一緒に仕組みを作り直すことで、危機から抜け出してイタリア有数のスマートシティになりました。技術より、進め方の工夫が鍵だったという事例です。", "unverified": "1都市の事例研究で、他都市への一般化は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "気候に強い都市道路インフラへのスマート技術統合", "title": "Multi-scale integration of smart technologies for climate-resilient urban road infrastructure: a systematic literature review and conceptual framework", "url": "https://doi.org/10.1108/sasbe-06-2025-0350", "authors": "Maryam Khazaee ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-10-16", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "apa": "Khazaee, M., Bertolini, L., D’Amico, F., & Calvi, A. (2026). Multi-scale integration of smart technologies for climate-resilient urban road infrastructure: a systematic literature review and conceptual framework. Smart and Sustainable Built Environment, 1–28. https://doi.org/10.1108/sasbe-06-2025-0350", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "道路・橋梁・舗装・排水などの都市道路インフラの気候レジリエンスを、スマート技術でどう高められるかを体系的文献レビューで整理し、概念枠組みを示した（抄録）。", "p3": "Scopusの1,684件から78の主要研究を選び、VOSviewerによる書誌分析とNVivoによる質的内容分析を行う4段階の体系的レビュー。", "p5": "GIS、BIM、デジタルツイン、IoT、AI、ビッグデータ、リモートセンシングの7つの中核技術を特定し、GISとリモートセンシングが空間・環境データを、IoTセンサが実時間の監視を担う統合したデジタル生態系をなすとした（抄録）。", "fun": "大雨や猛暑で道路や橋が傷む前に手を打つには、さまざまな技術を組み合わせる必要があります。このレビューは、地図、センサ、AI、仮想の双子（デジタルツイン）などが、それぞれどんな役割を分担しているかを地図のように描き出しています。", "unverified": "概念枠組みの詳細は未確認（抄録が途中まで）。"}}, {"id": "jr27", "rank": 27, "headline": "公共サービスの貧困と都市成長：途上国の経済的包摂", "title": "Utility Poverty and Urban Growth: Examining the Implications for Economic Inclusion in Developing Countries", "url": "https://doi.org/10.1002/sd.71787", "authors": "Yafei Zhang ほか", "venue": "Sustainable Development", "date": "2026-10-16", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "apa": "Zhang, Y., Dzondru, M., Aladejare, S. A., Dimnwobi, S. K., & Ekesiobi, C. (2026). Utility Poverty and Urban Growth: Examining the Implications for Economic Inclusion in Developing Countries. Sustainable Development. https://doi.org/10.1002/sd.71787", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "途上国74か国（2000〜2023年）のパネルで、エネルギー・デジタル・水の公共サービスの貧困が都市成長と経済的包摂に与える影響を調べた（抄録）。", "p3": "パネル修正標準誤差推定を主に、パネル動学OLSとGMMで頑健性を確かめ、断面依存・不均一分散・内生性に対処する。", "p5": "エネルギーとデジタルの貧困は都市成長に正の効果を持ち、農村の欠乏が電気と通信を求めて世帯を都市に押し出す役割を反映するとした。水の貧困は健康・労働生産性・住みやすさへの影響を通じて都市成長を抑えた（抄録）。", "fun": "電気やネットが足りない地域ほど都市が大きくなる、という一見逆の結果です。農村で電気やネットが使えないから、人が都市に移るのです。一方で水が足りないと都市は育ちにくい。同じ「インフラ不足」でも、種類によって人の動きへの効き方が逆になるのが面白い点です。", "unverified": "係数の値と経済的包摂への含意の詳細は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "価値獲得で交通インフラの維持管理費を賄う", "title": "Strategi Pembiayaan Inovatif untuk Pemeliharaan Infrastruktur Transportasi di Indonesia: Pendekatan Berbasis Value capture", "url": "https://doi.org/10.12962/j26151847.v9i3.9839", "authors": "Rully Andhika Karim ほか", "venue": "Jurnal Manajemen Aset Infrastruktur & Fasilitas", "date": "2026-10-15", "apa": "Andhika Karim, R., Budi Laksono, N., & Latief, Y. (2025). Strategi Pembiayaan Inovatif untuk Pemeliharaan Infrastruktur Transportasi di Indonesia: Pendekatan Berbasis Value capture. Jurnal Manajemen Aset Infrastruktur & Fasilitas, 9(3), 143–152. https://doi.org/10.12962/j26151847.v9i3.9839", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、インドネシア語）を使用", "preprint": false, "short": true, "p1": "インドネシアの交通インフラの維持管理の財源として、官民連携（KPBU）のもとで土地価値の獲得（LVC）と税に代わる支払い（PILOT）を使う戦略を検討した（抄録）。", "p3": "文献調査と関連する事例の分析で、両スキームを地元の状況で適用できるかを評価する。", "p5": "両方の資金調達の仕組みは、インフラ事業が生む経済的価値を最大化し、それを長期の維持管理の財源に回せるとし、維持管理の効率と持続性を高め、国家予算の負担を減らしうると結論した（抄録。定量的な分析は抄録になし）。", "fun": "駅や道路ができると周りの土地の値段が上がります。その値上がり分の一部を、道路を直すお金に回そうというのが「価値の獲得」の考え方です。作るときではなく、守り続けるお金をどう生むかに注目した点が、インフラの老朽化が進む国にとって大事な視点です。", "unverified": "事例の具体名と定量的な評価は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "相補条件を組み込んだPINNで浸潤線を予測", "title": "FB-PINN: A Fischer-Burmeister-enhanced physics-informed neural network for phreatic line prediction in saturated-unsaturated seepage flow", "url": "https://doi.org/10.1139/cgj-2026-0607", "authors": "Xuan-Qi Liu ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-15", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Liu, X.-Q., LI, K.-Q., & Yin, Z.-Y. (2026). FB-PINN: A Fischer-Burmeister-enhanced physics-informed neural network for phreatic line prediction in saturated-unsaturated seepage flow. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0607", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "土堰堤の飽和・不飽和浸透で、未知の浸出面を含む浸潤線を、平滑化したFischer-Burmeister関数を組み込んだPINN（FB-PINN）で格子なしに予測した（抄録）。", "p3": "浸出面が生むSignorini型の非線形相補問題を、平滑化FB関数で1つの滑らかな等式制約に書き換え、別々の罰則項による悪条件な損失と勾配の振動をなくす。混合形のRichards方程式と幹-枝の構造で、圧力水頭・含水率・浸潤線を同時に予測する。", "p5": "水位、堤体形状、成層した異方性材料、粘土コアのゾーン型ダムで検証し、飽和に近い低n領域の強いVG非線形を和らげる局所的な数値カットオフも導入した（抄録。精度の数値は抄録になし）。", "fun": "ダムの土の中を水がどこまで染み込んでいるかの境目（浸潤線）は、どこで水が外ににじみ出るかが前もってわからないため、計算が難しい問題でした。この研究は、「にじみ出るか、出ないか」の二択の条件を1本のなめらかな式にまとめ、AIに学ばせやすくした点が工夫です。", "unverified": "従来手法との精度比較の値は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "個別要素の仮想試験から疲労後の残存強度を推定", "title": "A Bilinear Residual Strength Model for Concrete Subjected to Fatigue Loads Based on Discrete Element Virtual Tests", "url": "https://doi.org/10.1061/jmcee7.mteng-24246", "authors": "Pei Zhang ほか", "venue": "Journal of Materials in Civil Engineering", "date": "2026-10-16", "citescore": 5.7, "citescore_year": "2025", "apa": "Zhang, P., Peng, X., Xiao, H., Zhang, Y., Bai, B., & Li, X. (2027). A Bilinear Residual Strength Model for Concrete Subjected to Fatigue Loads Based on Discrete Element Virtual Tests. Journal of Materials in Civil Engineering, 39(2). https://doi.org/10.1061/jmcee7.mteng-24246", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "コンクリートの疲労後の残存強度を予測する2直線モデルを、個別要素法（DEM）の仮想試験のデータだけから作った（抄録）。", "p3": "疲労損傷モデルを入れたDEMの仮想試験を最大応力レベルを変えて行い、繰返し荷重による劣化の進行を捉え、その結果から残存強度の2直線の劣化モデルを立てる。", "p5": "既存のモデルより残存強度の劣化特性を精度よく予測し、結果は一貫して安全側に偏った。残存強度の変化の重要な変曲点も明示できたとする（抄録。数値は抄録になし）。", "fun": "コンクリートは何万回も揺さぶられると少しずつ弱くなります。本物で何度も試すのは大変なので、粒の集まりとしてコンピュータの中で壊してみる「仮想試験」を使いました。強さが急に落ち始める曲がり角が見つかれば、点検のタイミングを決めるのに役立ちます。", "unverified": "実験データとの照合の有無は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "勾配のある橋に吊った送電管路の車両荷重応答", "title": "Modeling and Analysis of Slope-Dependent Response Properties of Gas-Insulated Transmission Line System Under Vehicle-Induced Loads", "url": "https://doi.org/10.3390/eng7100565", "authors": "Haojie Chen ほか", "venue": "Eng", "date": "2026-10-16", "citescore": 4.1, "citescore_year": "2025", "apa": "Chen, H., Cao, J., Dong, F., Yang, J., Zhan, R., Liu, M., & Sun, W. (2026). Modeling and Analysis of Slope-Dependent Response Properties of Gas-Insulated Transmission Line System Under Vehicle-Induced Loads. Eng, 7(10), 565. https://doi.org/10.3390/eng7100565", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "勾配のある橋の下に吊った管路気中送電線（GIL）が、走行車両による橋の振動でどう揺れるかを、勾配を考慮した動的モデルで解析した（抄録）。", "p3": "車両による橋の振動を、GILの外被の支持点に作用する動的な力として等価に表す。導体を空間ティモシェンコはり要素、外被をReissner-Mindlinシェル要素、碍子を3次元の弾性ばねでモデル化し、調和外力のデータで検証する。", "p5": "低次のモードは曲げが支配的で、高次は曲げ-ねじれの連成を示した。車速、車両荷重、碍子の剛性、勾配の影響を調べ、鉛直変位の応答は車両荷重とともに増えることなどを示した（抄録）。", "fun": "橋の下には、電線や水道管など多くの設備がぶら下がっています。車が橋を渡るたびに橋が揺れ、その揺れが設備に伝わります。坂になった橋では、揺れが縦だけでなく斜めの成分も持つので、設備の揺れ方が変わる。その様子を細かな部品ごとにモデル化した研究です。", "unverified": "勾配の影響の具体的な結論は未確認（抄録が途中まで）。"}}, {"id": "jr32"
