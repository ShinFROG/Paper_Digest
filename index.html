bility-Based Exposure and Exposure Avoidance Options during Urban Floods", "url": "https://doi.org/10.1021/acs.est.6c06636", "authors": "Entong Ke ほか", "venue": "Environmental Science & Technology", "date": "2026-10-21", "sjr": 3.776, "citescore": 18.9, "citescore_year": "2025", "apa": "Ke, E., Zhang, Y., Kwan, M.-P., Sun, X., Chen, Q., Gu, T., Hou, C., Sun, M., Liu, Y., & Lan, T. (2026). From Equality to Equity: The Dual Socioeconomic Inequalities of Mobility-Based Exposure and Exposure Avoidance Options during Urban Floods. Environmental Science & Technology. https://doi.org/10.1021/acs.est.6c06636", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "都市の内水氾濫で、住所ではなく移動に基づく曝露と、浸水を避けるための追加の移動距離の2つの面で、低所得層が二重に不利であることを示した。", "p3": "北京の第五環状線内で、AlphaEarthの埋め込みと携帯電話の信号データから61万4,510人の移動に基づく曝露を求め、モンテカルロの経路シミュレーションでパレート前線を作り回避の制約を測り、多項ロジットで社会経済的地位との関係を調べた（抄録）。", "p5": "住所に基づく評価は近隣効果の平均化問題で系統的に偏り、社会経済的地位の低い人は曝露も回避の制約も大きかった（抄録）。", "fun": "大雨の危険は「どこに住んでいるか」だけでは決まらず、「毎日どこを通るか」でも決まる。しかも危ない道を避けるために遠回りできるかどうかにも差がある。携帯電話のデータで、目に見えにくい二重の格差を描き出している。", "unverified": "格差の大きさの具体的な値は抄録からは確認できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "エネルギーと交通のインフラは利用者を取り残す", "title": "Energy and transport infrastructure is failing the people it serves", "url": "https://doi.org/10.1088/2634-4505/aeb71f", "authors": "Marissa Bergman ほか", "venue": "Environmental Research Infrastructure and Sustainability", "date": "2026-10-21", "citescore": 5.6, "citescore_year": "2025", "apa": "Bergman, M., Hirmer, S., Tomei, J., Morgan, G., Gaikwad, S., Stockport, B., & Arhin, G. (2026). Energy and transport infrastructure is failing the people it serves. Environmental Research: Infrastructure and Sustainability. https://doi.org/10.1088/2634-4505/aeb71f", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "エネルギーと交通のインフラが、ジェンダー平等と社会的包摂を周辺扱いすることで、作られても多くの人に使えないものになっていると論じた視点論文。", "p3": "研究者・政策担当者・金融・実務家の分野横断のグループとして、包摂の欠如がもたらすリスクと、現在の政治経済の下でそれが強まる理由を論じた（抄録）。", "p5": "包摂の欠如は国の生産性の低下、財政の非効率、気候への脆弱性の増大という3つのリスクにつながり、包摂を計画の中核の過程として扱うべきだと結論し、研究の優先課題を示した（抄録）。", "fun": "駅や発電所が完成しても、安全に使えない、手が届かない人が多ければ、それは「書類の上でだけ完成した」インフラだ。何を作ったかではなく、誰が実際に使えているかで成果を測るべきだ、という主張は分かりやすい。", "unverified": "実証的なデータの分析は含まれていない（視点論文）。"}}, {"id": "jr25", "rank": 25, "headline": "解釈可能な機械学習で入院中医薬サービスの原価要因", "title": "Interpretable machine learning for identifying cost drivers of inpatient traditional Chinese medicine services in a tertiary hospital in China", "url": "https://doi.org/10.3389/fpubh.2026.1937712", "authors": "Li Xi ほか", "venue": "Frontiers in Public Health", "date": "2026-10-21", "citescore": 6.4, "citescore_year": "2025", "apa": "Li, X., Chen, S., Gong, M., Chen, C., Chen, J., & Zhang, J. (2026). Interpretable machine learning for identifying cost drivers of inpatient traditional Chinese medicine services in a tertiary hospital in China. Frontiers in Public Health, 14. https://doi.org/10.3389/fpubh.2026.1937712", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の三次病院の中医学科の入院患者で、中医学サービスの総費用の構造と要因を、解釈可能な機械学習で明らかにした。", "p3": "2023〜2025年の匿名化した入院記録1,532件で、対数変換した総費用を、線形・リッジ・ラッソ・弾性ネット・決定木・ランダムフォレスト・XGBoostの7手法で、繰り返し5分割交差検証と独立の検証データにより比べ、置換重要度とSHAPで要因を調べた（抄録）。", "p5": "費用の構成要素を説明変数に含むため、将来の予測モデルではなく費用構造の説明モデルと位置づけている（抄録）。主要な要因の順位は抄録が途中で切れていたため確認できなかった。", "fun": "病院の費用がどこで膨らむかを、機械学習で「どの項目が効いているか」として可視化する。予測ではなく説明のためのモデルだと著者自ら断っている点が誠実で、目的に応じてモデルの読み方を変える必要を示している。", "unverified": "主要な費用要因と性能の数値は、抄録が途中で切れていたため確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "企業規模と地域がESG評価に与える影響", "title": "Firm Size and Contextual Correlates of Refinitiv ESG Ratings: International Evidence Across ESG Pillars", "url": "https://doi.org/10.1002/csr.71117", "authors": "Ana Lejárraga García ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-22", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "García, A. L., Ortiz‐Martínez, E., & Marín‐Hernández, S. (2026). Firm Size and Contextual Correlates of Refinitiv ESG Ratings: International Evidence Across ESG Pillars. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71117", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "RefinitivのESG評価が、企業規模・地域・業種とどう関連するかを、柱（環境・社会・統治）ごとに国際比較した。", "p3": "2022年の国際的な上場企業6,829社で、従業員数・時価総額・総資産の3つの規模の指標を比べ、総合評価と3つの柱を分散分析・重回帰・階層的分析・頑健性検定で調べた（抄録）。", "p5": "どの規模の指標でも大きい企業ほど評価が高く、総資産が総合評価と各柱、特に環境の柱と最も強く関連した。地域は環境と社会のモデルに統治より多く寄与し、業種の追加の説明力は小さかった（抄録）。", "fun": "大きな会社ほどESGの点数が高いのは、本当に環境や社会に良いからなのか、それとも報告に手間をかけられるからなのか。規模の測り方によって結果が違い、総合点が柱ごとの違いを隠してしまう、という注意は評価を読むときに大切だ。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}, {"id": "jr27", "rank": 27, "headline": "AI活用が財務諸表不正の発見に与える影響", "title": "The Impact of Artificial Intelligence Application on Fraud Detection in Financial Statements: The Mediating Role of Accounting Information System Quality", "url": "https://doi.org/10.59324/ejmeb.2026.3(5).14", "authors": "Hasan Maytham Kareem", "venue": "HAL (ART) European Journal of Management, Economics and Business", "date": "2026-10-21", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用", "preprint": false, "short": true, "p1": "AI（機械学習とデータマイニング）の活用が財務諸表の不正発見に効果があるという認識を、金融機関の職員への質問紙調査で調べた。", "p3": "記述分析的な方法で、金融機関の職員に構造化質問紙を配り、SPSSで会計情報システムの質の媒介効果を含めて分析した（抄録）。", "p5": "機械学習が不正発見の分散の70.7%、データマイニングが83.2%を説明し、AIの活用は会計情報システムの質にも有意に影響した（機械学習39.5%、データマイニング46.2%）（抄録）。", "fun": "「AIは不正を見つけるのに役立つか」を、実際の不正の記録ではなく、働く人の意見として尋ねている。説明率が非常に高いのは、同じ人が同じ質問紙で答えた意見どうしの関係だからかもしれず、数字の読み方に注意が必要だ。", "unverified": "標本の大きさと所属機関は抄録からは確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "AIクラウドの利用継続と切替コスト", "title": "Understanding Users' Stickiness in AI-Enabled Cloud Services From the Perspective of Process Virtualization Theory and Switching Costs", "url": "https://doi.org/10.4018/jgim.425560", "authors": "Ya‐Ling Wu ほか", "venue": "Journal of Global Information Management", "date": "2026-10-21", "citescore": 7.5, "citescore_year": "2025", "apa": "Wu, Y.-L., Hsieh, Y.-H., & Lai, Y.-N. (2026). Understanding Users’ Stickiness in AI-Enabled Cloud Services From the Perspective of Process Virtualization Theory and Switching Costs. Journal of Global Information Management, 34(1), 1–25. https://doi.org/10.4018/jgim.425560", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "AIを使ったクラウドサービスへの利用者の定着（スティッキネス）が、社交的な満足と使用上の満足の2つの経路で生じ、切替コストの効き方が経路で異なることを示した。", "p3": "過程仮想化理論、利用と満足の理論、切替コストに基づき、AIクラウドサービスの利用者443人の調査データを構造方程式モデリングで分析した（抄録）。", "p5": "過程仮想化の能力は2種類の満足をともに高め、それが定着を高めた。切替コストは社交的な満足と定着の関係を弱めたが、使用上の満足の効果は調整しなかった（抄録）。", "fun": "乗り換えが面倒だとそのサービスに留まりやすい、と考えがちだが、この研究では、乗り換えの手間が大きいと「楽しいから使う」という気持ちの効き目がかえって弱まった。人を引き留める理由は1つではない、ということが分かる。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "人とロボットのサービス職場への応募意向", "title": "Sustainable human-robot services: ESG, diversity, and attractiveness in job pursuit", "url": "https://doi.org/10.1108/jhtt-11-2025-1085", "authors": "Myung Ja Kim ほか", "venue": "Journal of Hospitality and Tourism Technology", "date": "2026-10-22", "sjr": 1.785, "citescore": 13.8, "citescore_year": "2025", "apa": "Kim, M. J., Barnes, S. J., & Kang, S.-E. (2026). Sustainable human-robot services: ESG, diversity, and attractiveness in job pursuit. Journal of Hospitality and Tourism Technology, 1–20. https://doi.org/10.1108/jhtt-11-2025-1085", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "人とロボットが協働するホテルの職場への応募意向が、仕事・組織・個人の魅力とESGの要素でどう決まるかを調べた。", "p3": "米国のホテル業の求職者492人のオンライン調査（MTurk）を、Student-t分布の一般化線形モデルと、ファジー集合質的比較分析（fsQCA）の混合研究法で分析した（抄録）。", "p5": "組織の魅力、個人の関心、環境・統治のESGが応募意向を有意に予測した。仕事の魅力と社会面のESGは単独では有意でなかったが、fsQCAでは特定の条件の組み合わせの中で重要な役割を持った（抄録）。", "fun": "「単独では効かない要因」も、他の条件と組み合わさると決め手になる、という結果は、平均的な効果だけを見る分析と、組み合わせを見る分析の違いをよく示している。ロボットと働く職場の人集めという新しい課題も興味深い。", "unverified": "なし"}}, {"id": "jr30", "rank": 30, "headline": "錯覚的優越感が持続可能な食の選択を妨げる", "title": "Attend But Disengage: How Illusory Superiority Disrupts Sustainable Food Decision‐Making", "url": "https://doi.org/10.1002/mar.70289", "authors": "Chien Duong ほか", "venue": "Psychology and Marketing", "date": "2026-10-22", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Duong, C., Sung, B., & Ng, W. D. (2026). Attend But Disengage: How Illusory Superiority Disrupts Sustainable Food Decision‐Making. Psychology & Marketing. https://doi.org/10.1002/mar.70289", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "持続可能な食品の購買で、注意を向けるだけでは足りず感情的な関与が必要で、自分は他人より環境に配慮しているという錯覚的優越感がその関与を妨げることを示した。", "p3": "効果の階層モデルと消費者の生体計測による時々刻々の分析を使い、4つの研究で注意・感情的関与・購買意図の関係と、錯覚的優越感の影響を調べた（抄録）。", "p5": "購買意図を動かすのは注意ではなく感情的関与で、錯覚的優越感は関与を下げた。錯覚を正すフィードバックは軽蔑の感情を生み、かえって関与を高めた（抄録）。", "fun": "「自分はもう十分エコだ」と思っている人ほど、エコな商品に心が動かない。ところが「あなたは思っているほどではない」と知らされると、ちょっとむっとして、かえって関心が高まる。人の気持ちの動きの複雑さが面白い。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "jr31", "rank": 31, "headline": "国境を越えた統治のための熟議の拡大", "title": "Scaling Democratic Deliberation for Transnational Governance Through Civil Democracy", "url": "https://doi.org/10.1111/1758-5899.70244", "authors": "Hanno Scholtz", "venue": "Global Policy", "date": "2026-10-22", "citescore": 4.0, "citescore_year": "2025", "apa": "Scholtz, H. (2026). Scaling Democratic Deliberation for Transnational Governance Through Civil Democracy. Global Policy. https://doi.org/10.1111/1758-5899.70244", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "国際的な統治の正統性が揺らぐ中で、市民と市民社会が条約の改正なしに作れる参加の基盤（Civil Democracy）を提案した。", "p3": "世界民主主義の4つの研究の流れの診断が、拡張可能で継続的・個人化された参加の層という共通の設計基準に収束することを示し、3つの改革路線をマグロ漁業の統治の事例で比べた（抄録）。", "p5": "市民が政策案を直接、または見直し可能な非推移的な信頼の委任を通じて順位づけし、監査可能な規則で集計して、争点ごとの国境を越えた負託を生む仕組みが基準を満たすと論じた（抄録）。", "fun": "国境を越える問題（たとえば魚の獲りすぎ）を、世界中の人の意見でどう決めるか。自分で投票するか、信頼できる人に争点ごとに任せるかを選べ、しかもいつでも任せ先を変えられる、という仕組みは「液体民主主義」の考え方に近い。", "unverified": "仕組みの実装や実証の有無は抄録からは確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "多主体シミュレーションによる緑の知的資本の流れ", "title": "Unlocking ecosystemic green intellectual capital: a multi-agent simulation of institutional thresholds and dynamic knowledge flows", "url": "https://doi.org/10.1108/jic-07-2026-0446", "authors": "Kuoyi Lin ほか", "venue": "Journal of Intellectual Capital", "date": "2026-10-22", "sjr": 1.382, "citescore": 14.9, "citescore_year": "2025", "apa": "Lin, K., He, Z., Liu, M., Lin, L. M., Cervino, C., & Caputo, F. (2026). Unlocking ecosystemic green intellectual capital: a multi-agent simulation of institutional thresholds and dynamic knowledge flows. Journal of Intellectual Capital, 1–22. https://doi.org/10.1108/jic-07-2026-0446", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "緑の知的資本が、企業・研究機関・規制主体・市場の間をどう流れ、制度的な圧力によってどこで急な転換が起きるかを多主体シミュレーションで調べた。", "p3": "複雑適応系の理論、制御理論、知的資本に基づく見方から、異質な主体の非線形な知識の流れ、知識のスピルオーバー、境界を越える正統性の伝達を持つ動的なモデルを作り、規制の強さと市場の圧力を変えて評価した（抄録）。", "p5": "外部の制度的・市場的な圧力が、生態系の知的資本の流れに系全体の相転移を起こす制御パラメータとして働くことを調べた（結果の詳細は抄録の途中で切れている）。", "fun": "「緑の技術や知識」は会社の中に貯めておくものではなく、会社や大学や役所の間を流れるもの、と見る発想が新しい。規制をある強さまで強めると、流れが一気に変わる「しきい値」がある、という見方は、水が急に沸騰する現象にも似ている。", "unverified": "しきい値の具体的な値は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "アルゴリズム管理とギグワーカーのwell-being", "title": "The Effect of Algorithmic Management on Psychological Well-Being of Gig Workers: Moderating Role of Perceived Autonomy", "url": "https://doi.org/10.65080/ajbmss.v2i2.cm2622101031", "authors": "Muhammad Qasim", "venue": "AJBMSS - Advance Journal of Business Management and Social Sciences", "date": "2026-10-22", "apa": "Qasim, M. (2026). The Effect of Algorithmic Management on Psychological Well-Being of Gig Workers: Moderating Role of Perceived Autonomy. AJBMSS - Advance Journal of Business Management and Social Sciences, 2(2), 1–15. https://doi.org/10.65080/ajbmss.v2i2.cm2622101031", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "アルゴリズムによる管理がギグワーカーの心理的well-beingを下げ、自律性の認知がその負の関係を弱めることを示した。", "p3": "パキスタンのデジタル労働基盤で働くギグワーカー342人のオンライン調査を、SmartPLS 4.0の構造方程式モデルで分析し、仕事の要求度-資源モデルで解釈した（抄録）。", "p5": "アルゴリズム管理と心理的well-beingには有意な負の関連があり、自律性の認知が高いほどその負の関連は弱かった（抄録）。", "fun": "アプリが仕事を割り振り、評価もする働き方は、人によってはストレスになる。でも「自分で決められる部分がある」と感じていれば、その害はやわらぐ。仕事の要求と資源のバランスという考え方が、新しい働き方にも当てはまる。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "ホテル従業員のAI導入と雇用不安", "title": "ARTIFICIAL INTELLIGENCE INTEGRATION AND JOB INSECURITY AMONG HOTEL EMPLOYEES IN KUALA LUMPUR", "url": "https://doi.org/10.35631/jthem.1145021", "authors": "Dziatul Nadiah Dzia-Uddin ほか", "venue": "Journal of Tourism Hospitality and Environment Management", "date": "2026-10-22", "apa": "Dzia-Uddin, D. N., Razali, A. Z., Zulkarnain, M. Z. F., Khalid, K., Musa, M., & Wan Kamarudin, W. N. B. (2026). ARTIFICIAL INTELLIGENCE INTEGRATION AND JOB INSECURITY AMONG HOTEL EMPLOYEES IN KUALA LUMPUR. Journal of Tourism Hospitality and Environment Management, 11(45), 350. https://doi.org/10.35631/jthem.1145021", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "マレーシアのホテル業で、AIと自動化の導入が見えるほど、従業員の雇用不安が強まることを示した。", "p3": "マレーシアのホテル従業員414人の量的調査を、SPSS 29.0で分析した（抄録）。", "p5": "自動化システムの導入が見えるほど雇用不安は強く、日々の仕事がAIに置き換わるのを自ら経験している人の不安が最も強かった。自動化・職の置き換え・雇用不安は強い正の相関を示した（抄録）。", "fun": "AIが職場に入ってくると、実際に仕事を奪われた人だけでなく、それを「見ている」人も不安になる。技術そのものより、それがどう見えるかが心に響く、という点は、導入の進め方や説明の大切さを示している。", "unverified": "相関係数の具体的な値は抄録からは確認できなかった。"}}, {"id": "jr35", "rank": 35, "headline": "人が関与するAIによる強靭なサプライチェーン運営", "title": "Human-in-the-Loop AI for resilient supply chain operations: a framework for augmented decision-making and ethical deployment", "url": "https://doi.org/10.1108/itp-09-2025-1431", "authors": "Mehtab Alam ほか", "venue": "Information Technology and People", "date": "2026-10-22", "sjr": 1.956, "citescore": 15.5, "citescore_year": "2025", "apa": "Alam, M., Samal, C. K., Parveen, S., Ali, A., & Alourani, A. (2026). Human-in-the-Loop AI for resilient supply chain operations: a framework for augmented decision-making and ethical deployment. Information Technology & People, 1–28. https://doi.org/10.1108/itp-09-2025-1431", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "人が監督に加わるAI（HITL）の枠組みを設計し、2つの対照的な運営・サプライチェーンの現場で評価した。", "p3": "デザイン・サイエンスの方法と比較事例分析で、適応的監督アーキテクチャ（AOA）を作り、システムのログ、観察、インタビュー、業績指標を分析した（抄録）。", "p5": "HITLの統合は、例外処理の正確さの向上、人による上書きの頻度の減少、作業時間の短縮、利用者の満足の向上と関連した。一方で自動化への依存、責任の拡散、不適切な依存のリスクも見つかった（抄録）。", "fun": "AIに任せきりにせず、人が要所で確認する仕組みは安全そうだが、人がAIを信じすぎると確認が形だけになる。信頼の度合いを適切に「調整」することが大事だ、という指摘は、AIと働くどんな職場にも当てはまる。", "unverified": "改善の具体的な数値は抄録からは確認できなかった。"}}, {"id": "jr36", "rank": 36, "headline": "家族と専門職の介護者が認知症の意味を捉え直す", "title": "Redefining the meaning of dementia: A qualitative study of meaning, stigma, and care experiences among family and professional carers", "url": "https://doi.org/10.1002/dad2.70521", "authors": "Anna Tjin ほか", "venue": "Alzheimer's and Dementia: Diagnosis, Assessment and Disease Monitoring", "date": "2026-10-22", "sjr": 1.774, "citescore": 7.1, "citescore_year": "2025", "apa": "Tjin, A., Bendesa, I. M. P. S., Stewart, R., & Leng, T. L. (2026). Redefining the meaning of dementia: A qualitative study of meaning, stigma, and care experiences among family and professional carers. Alzheimer’s & Dementia: Diagnosis, Assessment & Disease Monitoring, 18(4). https://doi.org/10.1002/dad2.70521", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "英国の家族介護者と専門職の介護者が、認知症をどう意味づけ、偏見がケアの実践と選択をどう形づくるかを質的に調べた。", "p3": "目的的抽出で家族介護者12人と専門職の介護者3人を集め、帰納的な再帰的テーマ分析を行った。専門職の視点は比較ではなく文脈の理解に使った（抄録）。", "p5": "介護者は認知症の介護を、日常・家族の役割・ケアの期待を絶えず組み替える全面的で予測できない過程と語った。病気の開示、症状の理解、ケアの場の決定は、文化・道徳・制度の要因の影響を受けた（抄録）。", "fun": "認知症の介護は「作業」ではなく、家族の役割や暮らしを作り直し続ける過程だ、という語りは、介護の大変さを数字とは違う角度から伝える。周りの目（偏見）が、誰に話すかや施設を選ぶかにまで影響していることが分かる。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "農村地域で高齢者ケアの共同体を育てる", "title": "Stories from ‘Who Cares?’ : Cultivating a Community of Aging Care on the Sunshine Coast, British Columbia", "url": "https://doi.org/10.1017/s0714980826100865", "authors": "Colleen J. Reid ほか", "venue": "Canadian Journal on Aging / La Revue canadienne du vieillissement", "date": "2026-10-21", "citescore": 3.6, "citescore_year": "2025", "apa": "Reid, C., Oliveira, M., Gill, A., Raber, C., Paulsen, K., & Kaur, A. (2026). Stories from ‘Who Cares?’ : Cultivating a Community of Aging Care on the Sunshine Coast, British Columbia. Canadian Journal on Aging / La Revue Canadienne Du Vieillissement, 1–11. https://doi.org/10.1017/s0714980826100865", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "カナダの農村地域で、高齢化とケアの経験を住民の語りから集め、地域で支え合うケアの共同体のあり方を探った。", "p3": "創造的な地域の催しと地域参加型の研究で、多くの集まりと12人の個別インタビューから質的データを集め、再帰的・協働的なテーマ分析を行った（抄録）。", "p5": "医療・人手・社会的支援の不足がコロナ禍で悪化し、高齢者の孤立を深めていた。交通・住宅・医療へのアクセスが構造的な障壁だった一方で、非公式のケアの網、ボランティア、協働的な介護が制度の枠を超えて地域の回復力を支えていた（抄録）。", "fun": "制度の手が届きにくい田舎でも、近所の人やボランティアが「見えない担い手」として高齢者を支えている。ケアを家族や施設だけの仕事ではなく、地域全体で分け合う責任と捉える視点が、高齢化社会の手がかりになる。", "unverified": "なし"}}, {"id": "jr38", "rank": 38, "headline": "若年単身世帯の社会的支援と孤独の経路", "title": "The Relationship between Social Support and Loneliness among Young Single-Person Households: The Sequential Mediating Effects of Mental Well-Being and Future Expectations", "url": "https://doi.org/10.14251/crisisonomy.2026.22.9.283", "authors": "Yu Mi Jung ほか", "venue": "Crisis and Emergency Management: Theory and Praxis", "date": "2026-10-22", "apa": ", Jung, Y. M., Lee, M. Y., & Kang, H. D. (2026). The Relationship between Social Support and Loneliness among Young Single-Person Households: The Sequential Mediating Effects of Mental Well-Being and Future Expectations. Crisis and Emergency Management: Theory and Praxis, 22(9), 283–294. https://doi.org/10.14251/crisisonomy.2026.22.9.283", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "若年の単身世帯で、社会的支援が心理的well-beingと将来への期待を順に通じて孤独を和らげる経路を示した。", "p3": "19〜39歳の118人のデータで、jamovi 2.6.44による経路分析と、5,000回のブートストラップによる媒介分析を行った（抄録）。", "p5": "社会的支援は孤独を直接減らし、心理的well-beingと将来への期待を高めた。単独の媒介は心理的well-beingだけが有意で、支援→well-being→将来への期待→孤独の連続媒介も確認された（抄録）。", "fun": "一人暮らしの孤独は、人とのつながりだけでなく、「この先どうなるか」という見通しの明るさにも左右される。支えがあると気持ちが安定し、未来を前向きに考えられ、それが孤独を和らげる、という連鎖が分かりやすい。", "unverified": "標本が118人と小さく、横断データのため因果の向きは確定できない。"}}, {"id": "jr39", "rank": 39, "headline": "移民の地域団体でのネットワークづくりとキャリア", "title": "Networking in Immigrant Community-Based Organizations: A Career Development Resource for Immigrants", "url": "https://doi.org/10.1177/10690727261496523", "authors": "Mohamed A. Khalil ほか", "venue": "Journal of Career Assessment", "date": "2026-10-21", "sjr": 1.413, "citescore": 7.0, "citescore_year": "2025", "apa": "Khalil, M. A., Forret, M. L., Wolff, H.-G., & Sullivan, S. E. (2026). Networking in Immigrant Community-Based Organizations: A Career Development Resource for Immigrants. Journal of Career Assessment. https://doi.org/10.1177/10690727261496523", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "移民の地域団体での活動、とくに仕事と関係のない文化・社交の活動が、移民のキャリアの助けになることを示した。", "p3": "社会的アイデンティティと社会関係資本の理論に基づき、移民の地域団体での活動への関与の尺度を作り、米国中西部のスーダン系移民343人の調査を重回帰で分析した（抄録）。", "p5": "文化・社交の活動への関与は、キャリアの後押し、仕事の援助、社会的支援、求職の援助、保護と政治的助言、情報やアイデアの提供と有意に関連した（抄録）。", "fun": "就職に役立つのは就職講座だけではない。お祭りや食事会のような文化・社交の集まりで生まれる人のつながりが、仕事の紹介や後押しにつながる。地域の居場所が、包摂の入口として働いていることが分かる。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}, {"id": "jr40", "rank": 40, "headline": "気候変動下の心の支えとしての地域社会関係資本", "title": "Community Social Capital as a Mental Health Lifeline in a Changing Climate: Mechanisms, Opportunities, and Limitations", "url": "https://doi.org/10.1155/hsc/7184225", "authors": "Majani Edward", "venue": "Health & Social Care in the Community", "date": "2026-10-21", "citescore": 6.7, "citescore_year": "2025", "apa": "Edward, M. (2026). Community Social Capital as a Mental Health Lifeline in a Changing Climate: Mechanisms, Opportunities, and Limitations. Health & Social Care in the Community, 2026(1). https://doi.org/10.1155/hsc/7184225", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "気候変動による災害が増える中で、地域の社会関係資本が心の健康を支える資源として働く仕組みを、概念的・物語的レビューで整理した。", "p3": "結束型・橋渡し型・連結型の社会関係資本の類型と地域の回復力の理論に基づき、知覚された支援・帰属感・集合的効力感を通じる仕組みのモデルを提案し、6地域の13の地域プログラムで例示した（抄録）。", "p5": "仲間による支援、共同作業、草の根の集まりのような結束型の介入が、すばやい感情的な支援を提供しうることなどを示した（抄録の範囲）。", "fun": "洪水や山火事のあと、心を支えるのは病院やカウンセラーだけではない。近所の人と一緒に片付けをしたり、話を聞き合ったりする「つながり」が、心の回復を助ける。目に見えないインフラとしての人間関係に光を当てている。", "unverified": "橋渡し型・連結型の効果についての結論は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jr41", "rank": 41, "headline": "OpenSeesによる車両-橋梁連成解析の公開枠組み", "title": "An open-source framework for coupled vehicle-bridge interaction analysis using OpenSees", "url": "https://doi.org/10.1016/j.iintel.2026.100253", "authors": "Mohammad Talebi-Kalaleh ほか", "venue": "Journal of Infrastructure Intelligence and Resilience", "date": "2026-10-21", "citescore": 8.8, "citescore_year": "2025", "apa": "Talebi-Kalaleh, M., & Mei, Q. (2026). An open-source framework for coupled vehicle-bridge interaction analysis using OpenSees. Journal of Infrastructure Intelligence and Resilience, 100253. https://doi.org/10.1016/j.iintel.2026.100253", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "OpenSees上に構築した、車両-橋梁相互作用（VBI）解析のためのオープンソースのPython枠組みを示した。", "p3": "橋と車両をOpenSeesの別々の部分系としてモデル化し、各時刻で変位と力を交換して収束するまで反復する。単軸のばね-質量系から、ピッチと別々のタイヤ・サスペンションを持つ2軸の複合ハーフカーまで5種類の車両モデルと、分離モードを用意した（抄録）。", "p5": "クォーターカー、ピッチ付きハーフカー、複合モデルの3つの公表済みのベンチマークとよく一致し、すべてでR²が0.998を超えた。車両と橋の質量比、支間、速度、路面凹凸の等級などに応じた分離モードの精度も調べた（抄録）。", "fun": "車が橋を渡るとき、車は橋を揺らし、揺れた橋は車を揺らす。この「お互いさま」の計算は研究者がそれぞれ自作のプログラムで行うことが多かったが、広く使われる解析ソフトの上で誰でも再利用できる形にしたのが大きい。", "unverified": "なし"}}, {"id": "jr42", "rank": 42, "headline": "減衰を含む橋のモード形を車両応答から抽出", "title": "Vehicle Response-based Mode Shape Extraction of Damped Bridges Using an Enhanced Three-step Approach", "url": "https://doi.org/10.1007/s42417-026-02804-1", "authors": "J. Prawin ほか", "venue": "Journal of Vibration Engineering & Technologies", "date": "2026-10-22", "citescore": 4.5, "citescore_year": "2025", "apa": "Prawin, J., & Balasubramaniam, S. (2026). Vehicle Response-based Mode Shape Extraction of Damped Bridges Using an Enhanced Three-step Approach. Journal of Vibration Engineering & Technologies, 14(8). https://doi.org/10.1007/s42417-026-02804-1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、走行車両の応答から、減衰のある橋のモード形を取り出す改良版の3段階の方法を提案した論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、橋の上を走る車の揺れだけから、橋そのものの「揺れの形」を描き出せるか、そして橋の揺れが減衰して小さくなる効果をどう扱うか、という点。橋にセンサーを付けずに橋を診る発想の核心にある難問だ。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jr43", "rank": 43, "headline": "MCMCによる2段階のベイズモデル更新", "title": "Two-stage fundamental Bayesian model updating method based on MCMC algorithm", "url": "https://doi.org/10.1016/j.is false, "short": true, "p1": "イタリアの「大退職」は労働市場からの退出ではなく、主に職の移動（再配分）だったことを示した。", "p3": "イタリアの労働力調査から、行政の退職の動向と整合する転職の指標を作り、仕事の課業に基づく方法で、どの仕事の属性が再配分と関連するかを調べた（抄録）。", "p5": "大退職は、柔軟性、意味、労働条件の異なる職業の間での再配分を主に反映しているという解釈と整合的だった（抄録）。", "fun": "コロナ禍のあと「みんな仕事を辞めている」と話題になったが、実は辞めて家に戻ったのではなく、より柔軟で意味のある仕事へ乗り換えていた。言葉の印象と実態が違うことを、データの作り方の工夫で確かめている。", "unverified": "再配分の大きさの数値は抄録からは確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "生成AIは起業機会の持続的優位を損なうか", "title": "Generative AI and the ability of entrepreneurial opportunities to generate sustained competitive advantages", "url": "https://doi.org/10.1002/sej.70064", "authors": "Haiyang Zhang ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-10-21", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "生成AIが起業機会から持続的な競争優位を生む力にどう影響するかを理論的に論じた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "生成AIが起業機会から持続的な競争優位を生む力にどう影響するかは、機会がどう形成されたかで異なると論じた。", "p3": "業界の外的ショックから生まれる「発見型」、ナイト的不確実性の下で行動を通じて生まれる「創造型」、競争相手の見落としに頼る「非認知型」の3種類の機会に分けて理論的に分析した（抄録）。", "p5": "発見型では生成AIが機会認識を汎用品化して優位を減らし、創造型では生成AIが不確実性を解消しきれないため模倣困難な資源が鍵となり、非認知型では生成AIが利益を競争相手に見えやすくすると優位を減らしうると論じた（抄録）。", "fun": "誰でも使える生成AIは、「誰もが気づけるチャンス」の価値を下げる一方、自分で動いて作り出すチャンスまでは奪えない。AIが当たり前になる時代に、何が本当の強みになるのかを、チャンスの種類ごとに考えている。", "unverified": "実証的なデータの分析は含まれていない（理論論文）。"}}, {"id": "jn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "組織における「権力の署名」という見方", "title": "Organization and the Signature of Power", "url": "https://doi.org/10.1177/01708406261499491", "authors": "Mitchell Dean ほか", "venue": "Organization Studies", "date": "2026-10-22", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "why": "現代の権力を署名として捉える枠組みを提示し、組織研究で政治を理解する新しい視点を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "現代の権力を、法的・政治的な主権と経済的・経営的な統治という2つの極を結び分ける「署名」として捉える枠組みを、組織研究に提示した。", "p3": "統治の分析、秩序の系譜学、栄光の考古学、権威の分析という4つの分析戦略で枠組みを具体化した（抄録）。", "p5": "この枠組みが、公式と非公式、制度とネットワークのような組織理論の二分法をどちらかに還元せずに統合し、複数のパラダイムで権力関係・抵抗・組織形態を理解する手がかりになると論じた（抄録）。", "fun": "会社の中の力には、社長の命令のような「上からの権威」と、ルールや評価の仕組みのような「日々の管理」の2種類がある。その両方を1つの見取り図で扱おうとする試みで、組織の政治を考える新しい道具になる。", "unverified": "実証的なデータの分析は含まれていない（理論論文）。"}}, {"id": "jn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "組織理論が本当に役立つとしたら", "title": "What if OMT Actually Mattered?", "url": "https://doi.org/10.1177/10564926261496789", "authors": "Michael Lounsbury", "venue": "Journal of Management Inquiry", "date": "2026-10-22", "sjr": 2.292, "citescore": 8.3, "citescore_year": "2025", "why": "組織・経営理論の研究のあり方を問い直す講演に基づく論考。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "組織・経営理論（OMT）の研究者が、人々と政策にとって重要な大きな問いに取り組むべきだと論じた講演に基づく論考。", "p3": "2026年のOMT特別研究者講演に基づき、論文数競争、細切れの研究、不正、生成AIで悪化した査読の危機といった問題を挙げ、解放的な起業、偏見を受ける仕事、AIと格差・民主主義などの例を示した（抄録）。", "p5": "より政治的に関与し、グローバル・サウスの研究者と研究を包摂し、論文数より質と現実への影響を評価するよう評価の仕組みを改めるべきだと主張した（抄録）。", "fun": "論文の数を競うあまり、研究が小さく細切れになっている、という研究者自身による反省の声だ。何のために研究するのかを問い直す呼びかけは、学問分野を問わず考えさせられる。", "unverified": "実証的なデータの分析は含まれていない（論考）。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "コロナ禍の校長の自己効力感と仕事への熱意", "title": "Temporary shocks, stable beliefs: A three-wave longitudinal study of school leaders’ self-efficacy and work engagement across the COVID-19 pandemic (2019–2022)", "url": "https://doi.org/10.1177/17411432261497513", "authors": "Marcus Pietsch ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-22", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "why": "3時点の縦断データで、外的衝撃の下でも学校指導者の信念が安定していたことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "コロナ禍を通じて、学校指導者の仕事への熱意は下がったが自己効力感は安定しており、両者の結びつきは急性期だけ一時的に強まったことを示した。", "p3": "資源保存理論に基づき、ドイツの学校指導者405人の3時点のパネル（2019〜2022年）に、多変量の潜在成長曲線モデルを当てはめた（抄録）。", "p5": "仕事への熱意は有意に低下し、自己効力感は安定していた。両者は急性期に一時的に連動し、その後は切り離された（抄録）。", "fun": "大きな危機のとき、「自分ならできる」という自信は揺らがなくても、「仕事に打ち込む気持ち」はすり減る。心の資源にも種類があり、危機への反応が違う、という結果は、支援のしかたを考えるうえで役立つ。", "unverified": "変化の大きさの数値は抄録からは確認できなかった。"}}, {"id": "jn21", "rank": 21, "field": "人口学", "headline": "子なし・介護なしのテレワーク希望は採用で不利", "title": "No Kids, No Care, No Telework: Hiring Penalties When Requesting Telework", "url": "https://doi.org/10.1111/jomf.70126", "authors": "Samantha Brady ほか", "venue": "Journal of Marriage and Family", "date": "2026-10-22", "sjr": 1.821, "citescore": 6.4, "citescore_year": "2025", "why": "応募者のテレワーク希望が家族のケア責任や性別と組み合わさって採用判断にどう影響するかを実験で示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "採用でテレワークを希望する応募者は不利になり、その不利は家族のケア責任の有無や性別によって変わることを、コンジョイント実験で示した。", "p3": "テレワーク可能な職の採用担当者2,031人に、テレワーク希望やケア責任などの属性を無作為に割り当てた架空の応募者を評価させた（抄録）。", "p5": "テレワークを希望する応募者は採用で不利になり、勤務可能性・献身・信頼性で否定的に見られ、頻度が高いほど不利は大きかった。子や大人のケア責任がある応募者の希望は、ない応募者より好意的に受け止められた（抄録）。", "fun": "「家で働きたい」と言うだけで採用で損をするが、子育てなどの理由がある人は少し許される。理由のない在宅希望は「やる気がない」と見られやすい、という採用側の思い込みが、実験で浮かび上がっている。", "unverified": "成人のケア責任と性別による違いの詳細は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "オペレーションズ・リサーチ", "headline": "持続可能性情報が調達判断を偏らせる", "title": "Biased by sustainability? How cognitive biases shape procurement decisions under information equivocality", "url": "https://doi.org/10.1108/ijopm-10-2025-1084", "authors": "Chiara Vagnini ほか", "venue": "International Journal of Operations and Production Management", "date": "2026-10-22", "sjr": 2.983, "citescore": 15.1, "citescore_year": "2025", "why": "情報が多義的なとき、管理者の認知バイアスが持続可能性に関わる調達判断をどう歪めるかを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "持続可能性に関する情報が多義的なとき、調達の判断がフレーミングやハロー効果、同調などの認知バイアスに左右されることを実験で示した。", "p3": "持続可能性の情報の構造的性質（リスク選択と属性のフレーミング、数的思考、アンカリング）、推論の動き（ハロー効果）、社会的影響（同調効果）から仮説を立て、管理職と学生の計475人で場面想定の被験者間実験を行った（抄録）。", "p5": "持続可能性を重視する調達判断は認知バイアスに弱いことが分かった（詳細は抄録の途中で切れている）。", "fun": "「環境にやさしい」と書かれていると、他の点でも良い会社だと思い込んだり（ハロー効果）、みんなが選ぶから選んだりする。良いことをしようとする判断ほど、思い込みに引っ張られやすい、という指摘が面白い。", "unverified": "どのバイアスがどれだけ効いたかは抄録が途中で切れていたため確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "オペレーションズ・リサーチ", "headline": "グリーンサービスを含む供給網の需要情報共有", "title": "Demand information sharing strategies in supply chains with green services and consumer-to-manufacturer", "url": "https://doi.org/10.1057/s41599-026-09517-6", "authors": "Xue Chen ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-22", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "why": "製造者とグリーンサービス基盤からなる供給網で、需要情報をいつ共有すべきかをゲーム理論で分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "製造者とグリーンサービスの基盤からなるサプライチェーンで、需要情報を共有すべきかが、消費者直結型の生産（C2M）の投資効率で変わることをゲーム理論で示した。", "p3": "基盤が需要情報を開示するかを決め、開示されれば製造者がC2Mを採用して価格と製品を調整できるモデルで、共有なし・共有あり（C2Mなし）・共有ありC2Mありの3つの場面を分析した（抄録）。", "p5": "従来の通説に反し、基盤はC2Mの投資効率が中程度のときに需要情報を共有したがることを示した（抄録）。", "fun": "情報を相手に渡すと得か損か。相手がその情報をうまく使える度合い（効率）が「ほどほど」のときだけ渡したくなる、という結果は、取引先との情報共有の駆け引きの微妙さをよく表している。", "unverified": "効率が高い・低い場合の詳細は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "機械学習", "headline": "AIコーディングエージェントのリファクタリング実態", "title": "Agentic Refactoring: An Empirical Study of AI Coding Agents", "url": "https://doi.org/10.1145/3859242", "authors": "Kosei Horikawa ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-10-22", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "why": "Codex・Claude Code・Cursorなどのエージェントが行うリファクタリングを実証的に分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "AIコーディングエージェントが実際のオープンソース開発で行うリファクタリング（外部の動作を変えずにコードの内部構造を改善すること）を大規模に分析した。", "p3": "AIDevデータセットに基づき、Javaのオープンソースプロジェクトの12,256のプルリクエストと14,998のコミットにわたる51,412件のリファクタリングを分析した（抄録）。", "p5": "エージェントは26.1%のコミットで明示的にリファクタリングを目的としており、リファクタリングはこの開発の形で一般的で意図的な活動だった。明示的な意図のある3,907コミット（32,611件）で種類・目的・コードの質を分析した（抄録）。", "fun": "AIは新しい機能を書くだけでなく、コードの「片付け」もかなりの割合で自発的に行っている。人間の開発者とどこが違うのか、片付けで本当にコードが良くなっているのか、を大量の実例で確かめる研究だ。", "unverified": "人間との比較とコードの質への影響の結果は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "機械学習", "headline": "NMRスペクトルと構造を双方向に結ぶ基盤モデル", "title": "PRISM, a Bidirectional NMR Foundation Model: From Peak List to Structure and Back", "url": "https://doi.org/10.1002/anie.7185622", "authors": "Ajnabiul Hoque ほか", "venue": "Angewandte Chemie - International Edition", "date": "2026-10-22", "sjr": 5.495, "citescore": 25.7, "citescore_year": "2025", "why": "ピークリストから分子構造へ、構造からピークへの双方向の予測を行う基盤モデルを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "NMRスペクトルのピーク一覧から分子構造を、分子構造からスペクトルを、双方向に予測するTransformerの基盤モデル（PRISM）を示した。", "p3": "実験で得たNMRと構造の組119万件（49の原子の種類）で学習し、化学の知識を組み込んだ6つのモジュールを持つspec2molと、スペクトルを予測するmol2specからなる（抄録）。", "p5": "spec2molは立体を考慮した上位1件の完全一致が60.1%（考慮しない場合72.5%）で、同条件で最強の既存の深層学習モデルより16.7ポイント高かった。mol2specは¹HのMAE 0.036 ppm、¹³CのMAE 0.358 ppmを1分子0.3秒未満で達成した（抄録）。", "fun": "NMRは分子の「指紋」のようなもので、そこから元の分子の形を当てるのは化学者の熟練の技だった。実験データ100万件以上を学んだAIが、指紋から分子を、分子から指紋を描けるようになったのは、翻訳の双方向化に似ている。", "unverified": "なし"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "記憶を持つ材料で機械的に学習する", "title": "In-memory phononic learning toward cognitive mechanical intelligence", "url": "https://doi.org/10.1126/sciadv.aeh9320", "authors": "Yuning Zhang ほか", "venue": "Science Advances", "date": "2026-10-21", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "記憶と情報処理を機械的な領域で統合し、材料そのものが学習するフォノニック計算を示した。", "explain": {"basis": "抄録", "basis_note": "Science Advancesに掲載された抄録を使用", "preprint": false, "short": true, "p1": "不揮発の機械的な記憶と、弾性波による知覚を、フォノニックな構造体の中で一体化し、材料そのものが学習・判断する「インメモリ・フォノニック学習」を示した。", "p3": "空間情報を構造の状態として記憶させ、それが弾性波の応答を決めるようにし、探査の波を問い合わせとして局在モードから特徴を取り出す。入力波形をオフラインで最適化して特徴を組み合わせ、出力のエネルギーから判断する（抄録）。", "p5": "幾何学的な形から手書き数字まで、複数の課題で高精度の分類を実験と数値計算で示した（抄録）。", "fun": "計算機の中ではなく、ばねや梁でできた材料の「揺れ方」で、形や手書き文字を見分ける。記憶と計算を同じ場所で行うので、データを行き来させる無駄がない。「考える材料」という発想が、SFのようで面白い。", "unverified": "分類精度の具体的な数値は抄録からは確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "地球科学", "headline": "小規模渦の反作用が海洋熱波を抑える", "title": "Submesoscale feedback suppresses marine heatwaves", "url": "https://doi.org/10.1126/sciadv.aei4624", "authors": "Jihai Dong ほか", "venue": "Science Advances", "date": "2026-10-21", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "海洋熱波の強さを左右する基本的な仕組みとして、サブメソスケールの反作用が熱波を抑えることを示した。", "explain": {"basis": "抄録", "basis_note": "Science Advancesに掲載された抄録を使用", "preprint": false, "short": true, "p1": "海洋のサブメソスケール（数km規模の小さな渦や前線）が生む鉛直の熱輸送が、冬の海洋熱波の強さと持続を抑える負のフィードバックとして働くことを示した。", "p3": "サブメソスケールを表現できる全球モデルの計算を、長期の観測と再解析データで検証したうえで、大気が駆動する海洋熱波での熱収支を調べた（抄録）。", "p5": "大気から海への熱の流入が強まると成層が強まり混合層が浅くなり、サブメソスケールの鉛直熱輸送が19.4%弱まり、熱波の強まりが18.1%減り、減衰が21.7%速まった。この仕組みを無視するモデルは熱波の深刻さを過大評価しうる（抄録）。", "fun": "海の小さな渦は、温まった表面の水を下に運んで熱を逃がす働きをしている。気候モデルが細かすぎてこの渦を表せないと、将来の海の熱波を大げさに予測してしまうかもしれない。小さなものが大きな現象を左右する例だ。", "unverified": "なし"}}, {"id": "jn28", "rank": 28, "field": "物理学", "headline": "ゼロ磁場で動く不揮発メモリ付きスピン波回路", "title": "Zero-field spin-wave networks with integrated non-volatile memory", "url": "https://doi.org/10.1038/s41563-026-02778-1", "authors": "K. O. Nikolaev ほか", "venue": "Nature Materials", "date": "2026-10-22", "sjr": 13.131, "citescore": 56.9, "citescore_year": "2025", "why": "スピン波で信号処理する回路に、外部磁場なしで動作し不揮発メモリを組み込む方法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "スピン波で信号処理を行う回路に、外部磁場なしで動作する不揮発メモリを組み込む方法を提案した。", "p3": "低損失の磁性絶縁体で作ったマグノニック・ネットワークの導波要素の静的な磁化状態をメモリとして使い、磁化の向きの切り替えでスピン波の伝わる経路を制御する。選択的な磁化の切り替えを低エネルギーで行う方法も示した（抄録）。", "p5": "磁化の向きを切り替えることでスピン波の伝播経路を効率よく制御できることを示した（抄録）。", "fun": "電子の流れではなく、磁石の向きの波（スピン波）で計算する回路は、熱をあまり出さない次世代の計算として期待されている。足りなかった「覚えておく部品」を、磁石の向きそのものにさせたのが工夫だ。", "unverified": "消費エネルギーなどの数値は抄録からは確認できなかった。"}}, {"id": "jn29", "rank": 29, "field": "物理学", "headline": "ペロブスカイトとシリコンの積層太陽電池で30%超", "title": "Cesium-Triiodide-Mediated Crystallization Regulation of Pure-Iodide Wide-Bandgap Perovskites Enables Perovskite-Silicon Tandem Solar Cells Exceeding 30% Efficiency", "url": "https://doi.org/10.1021/acsenergylett.6c02522", "authors": "Xiaopeng Zhao ほか", "venue": "ACS Energy Letters", "date": "2026-10-21", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "why": "ヨウ化物のみの広いバンドギャップのペロブスカイトの結晶化制御で、積層太陽電池の効率30%超を達成した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "ヨウ化物だけからなる広いバンドギャップのペロブスカイトの結晶化を三ヨウ化セシウムで制御し、ペロブスカイトとシリコンの積層太陽電池で30%を超える効率を得た。", "p3": "三ヨウ化セシウム（CsI₃）を介した前駆体の化学で、Pb-Iの配位ネットワークを再構成し、有機成分が主の中間体の早すぎる核生成を抑え、均一な相変化を促した（抄録）。", "p5": "単接合の太陽電池で安定化した効率22.40%を得て、最大電力点追従1,500時間後も初期効率の95%を保った。積層太陽電池の安定化した効率は30%を超えた（抄録）。", "fun": "シリコンの太陽電池の上に、別の色の光を吸うペロブスカイトの層を重ねると、効率の壁を超えられる。結晶ができる途中の順番を整えるだけで、むらの少ない膜になり、長持ちもする、という化学の工夫が鍵になっている。", "unverified": "積層太陽電池の効率の正確な値は抄録が途中で切れていたため確認できなかった（30%超と題名にある）。"}}, {"id": "jn30", "rank": 30, "field": "経営学", "headline": "AIによるエコデザインと人間の決定権限", "title": "Artificial Intelligence‐Mediated Eco‐Design and Environmental Strategy: Human Decision Authority, Sustainability Disclosure, and Lifecycle Accountability", "url": "https://doi.org/10.1002/bse.71739", "authors": "Nicholas Paparoidamis ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-22", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "AIが持続可能な製品設計を担うとき、人間の決定権限と開示・責任をどう位置づけるかを論じた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "AIが持続可能な製品設計を担うとき、環境に良い結果が組織の責任ある判断に帰属できなくなる「エコ・アルゴリズム的な切り離し」という問題を概念化した。", "p3": "人間のエコデザインの決定権限が弱いときや、開示が人とAIの分担を偽って伝えるときに生じる過程の帰属の問題を、製品の主張の範囲にAIの過程の環境負荷が入るかというライフサイクルの問題と区別した（抄録）。", "p5": "人間の決定権限が道徳的なエコ・インテグリティの認知を通じて主張の信頼性に影響するという、2経路の信頼性モデルを提示した（抄録）。", "fun": "AIが作った「エコな製品」は、本当にエコでも、誰がその判断に責任を持ったのかが分からないと信用されにくい。結果だけでなく、その結果に至った判断の持ち主が問われる、という指摘は、AI時代の説明責任の核心を突いている。", "unverified": "実証的なデータの分析は含まれていない（概念論文）。"}}, {"id": "jn31", "rank": 31, "field": "経営学", "headline": "ビッグデータはESG成績を高めるか", "title": "Big Data and ESG Performance: The Moderating Role of Corporate Social Responsibility in Chinese Listed Firms", "url": "https://doi.org/10.1002/csr.71113", "authors": "Priscilla Tuffour ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-21", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "中国上場企業で、ビッグデータの活用とESG成績の関係がCSRによってどう変わるかを分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "中国の上場企業で、ビッグデータの活用がESG成績を高め、その関係はCSRが高いほど強まるが、それは民間企業に限られることを示した。", "p3": "資源ベース論、吸収能力、ステークホルダー理論に基づき、2009〜2023年の中国A株企業1,529企業年に固定効果モデルを当てはめた（抄録）。", "p5": "ビッグデータはESG成績と正に関連し、CSRが高いほど関連が強まった（β=0.004、p<0.05）。この補完関係は民間企業に限られ、国有企業ではCSRとビッグデータは代替的だった（抄録）。", "fun": "データを集めるだけでは会社は良くならず、地域や社員と向き合う姿勢（CSR）と組み合わさって初めて生きる。ただ国有企業では逆の関係になる、という結果は、同じ道具でも持ち主によって働きが変わることを示している。", "unverified": "なし"}}, {"id": "jn32", "rank": 32, "field": "統計学", "headline": "大規模な学際研究での混合研究法の進め方", "title": "Navigating Complexity Through Mixed Methods Research: Insights from a Large-Scale Interdisciplinary Environmental Study of Biodiversity and Human Wellbeing", "url": "https://doi.org/10.1177/15586898261491475", "authors": "Robert D. Fish ほか", "venue": "Journal of Mixed Methods Research", "date": "2026-10-22", "sjr": 3.24, "citescore": 13.8, "citescore_year": "2025", "why": "生物多様性と人の幸福に関する大規模研究の経験から、混合研究法の複雑さへの対処を論じた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "森林の生物多様性と人の幸福を扱った大規模な学際研究の経験から、混合研究法で複雑さにどう向き合うかを論じた。", "p3": "9,000人を超える参加者を含む多段階の混合研究法のプロジェクトの設計と実施を振り返り、複雑さが研究対象・研究デザインの構造・協働の中でどう現れたかを検討した（抄録）。", "p5": "大規模な学際的環境研究が、複雑な混合研究法のデザインの出現・運用・方法論的な価値を理解する生産的な場になると論じた（抄録）。", "fun": "アンケートの数字とインタビューの言葉を組み合わせる混合研究法は、規模が大きくなるほど設計も協働も複雑になる。その「複雑さ」を失敗の言い訳ではなく、学ぶべき対象として扱おうとする姿勢が面白い。", "unverified": "なし"}}, {"id": "jn33", "rank": 33, "field": "経済学", "headline": "土地所有と燃料用バイオマスの入手方法", "title": "Who collects, who purchases? Land ownership and biomass acquisition in LMICs", "url": "https://doi.org/10.1088/1748-9326/aeb70c", "authors": "Jennifer Uju Dim ほか", "venue": "Environmental Research Letters", "date": "2026-10-21", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "why": "11か国の家計調査で、農地所有と燃料の採集・購入の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "低・中所得国で、農地を持つ世帯ほど薪を自分で集め、買わず、主な調理燃料として使うことを示した。", "p3": "11か国の統一された家計調査で、国の固定効果を入れたプール回帰により、土地を持つ世帯と持たない世帯の薪の採集・購入・主燃料としての使用を比べ、富・都市居住・電化・世帯構成を統制した（抄録）。", "p5": "関係は統制後も残り、土地と採集の関係は文脈を問わず安定していた一方、土地と購入の関係は都市や豊かな世帯で弱かった。土地を持つ世帯は燃料の採集と準備に多くの時間を使っていた（抄録）。", "fun": "「貧しいから薪を使う」と考えがちだが、土地があれば薪が「ただで」手に入るので、豊かでも薪から離れにくい。その代わりに集める時間という見えない費用を払っている、という点がクリーンな燃料への転換を考えるうえで大切だ。", "unverified": "なし"}}, {"id": "jn34", "rank": 34, "field": "経営学", "headline": "デジタルと実体産業の統合と輸出の高度化", "title": "Digital-real industrial technology integration, knowledge interfaces, and firms’ export sophistication", "url": "https://doi.org/10.1108/jkm-05-2026-0897", "authors": "Sen Gao ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-22", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "why": "デジタル技術と製造の統合、知識の接点が企業の輸出の高度化にどう効くかを分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "デジタル技術と産業技術の知識の統合が、企業の輸出の高度化（技術的に高度な製品の輸出）を高めることを示した。", "p3": "企業の特許の中でデジタル技術の知識と産業技術の知識が同時に現れることで統合を測り、輸出の高度化への影響を調べた（抄録）。", "p5": "統合は輸出の高度化を高め、外部の知識取引の促進、内部のデジタル知識の蓄積、分野をまたぐ知識の組み替えを通じて効いていた。国有企業、資金制約の小さい企業、ハイテク企業、輸出基盤の強い企業で効果が大きかった（抄録）。", "fun": "特許の中に「デジタル」と「ものづくり」の知識が一緒に出てくる会社ほど、より高度な製品を輸出している。2つの分野の知識を混ぜ合わせることが新しい価値を生む、ということを特許の文書から測っている点が面白い。", "unverified": "データの対象国と期間、効果の大きさは抄録からは確認できなかった。"}}, {"id": "jn35", "rank": 35, "field": "経営学", "headline": "BLM運動への企業の修辞的応答と正統性", "title": "Corporate Social Responsibility, Legitimacy, and Rhetorical Responses to Social Activism: Evidence From the Black Lives Matter Movement", "url": "https://doi.org/10.1002/csr.71098", "authors": "Mohammed Hossain ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-22", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "大企業が社会運動にどう修辞的に応答し、正統性を構築・管理するかを分析した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "大企業がブラック・ライブズ・マター運動にどう修辞的に応答し、それで正統性をどう構築・管理したかを分析した。", "p3": "フォーチュン500の50社について、CSR開示、年次報告書、経営者の発信、メディアの出力など複数の資料を、体系的な内容分析とテーマ分析で調べた（抄録）。", "p5": "企業はロゴス（論理）、エトス（信頼性）、パトス（感情）を戦略的に使い分けて、認知的・実利的・道徳的な正統性を構築しようとしており、修辞のパターンは業界と発信の場で異なった（抄録）。", "fun": "社会運動が起きたとき、企業の声明は「何をするか」だけでなく「どう語るか」で評価される。古代ギリシャの弁論術の3つの説得の型が、現代の企業の発信にもそのまま当てはまる、というのが面白い。", "unverified": "なし"}}, {"id": "jn36", "rank": 36, "field": "組織行動・心理的安全性", "headline": "リーダーの感謝表現は相手で受け止めが変わる", "title": "Closer to the leader, above the coworkers? How leader gratitude expression shapes employee responses across relational targets", "url": "https://doi.org/10.1016/j.obhdp.2026.104538", "authors": "Hun Whee Lee ほか", "venue": "Organizational Behavior and Human Decision Processes", "date": "2026-10-22", "citescore": 7.5, "citescore_year": "2025", "why": "リーダーの感謝表現が、リーダーとの関係と同僚との比較の両面で従業員の反応にどう影響するかを扱う。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、リーダーの感謝の表現が、リーダーとの関係と同僚との比較という異なる相手に関して、従業員の反応をどう形づくるかを調べた論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、上司に「ありがとう」と言われると、上司との距離が縮まるだけでなく、「同僚より上に立った」と感じることもあるのか、という点。感謝の言葉が人間関係の中でどう響くかは意外に複雑だ。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jn37", "rank": 37, "field": "経済学", "headline": "長期金利は短期のリスクプレミアム推定に役立つか", "title": "Do long-term yields help to estimate short-term risk premia?", "url": "https://doi.org/10.1016/j.jfineco.2026.104386", "authors": "Andrea Berardi ほか", "venue": "Journal of Financial Economics", "date": "2026-10-22", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "長期金利の情報が短期リスクプレミアムの推定を改善するかを問う。", "explain": {"basis": "抄録", "basis_note": "Crossrefの題名検索で見つかったSSRN版の抄録を使用（掲載版と同一の内容かは未確認）", "preprint": false, "short": true, "p1": "アフィン期間構造モデルで、長い満期のリスクプレミアムの期間構造の傾きが「ほぼ観測可能」になる性質を見つけ、長期金利を使うと短期のリスクプレミアムの推定が大きく改善することを示した。", "p3": "モデルを長い満期のデータに当てはめる方法をモンテカルロ実験で評価し、米国債のデータに適用した。金利のボラティリティの時間変化も考慮した（抄録）。", "p5": "文献で標準的な10年ではなく25年までの満期の金利を使うと、リスクプレミアム・期待短期金利・期間プレミアムの推定誤差の標準偏差が70%超減った。米国債では、期待短期金利の変動が利回りの変動のうち、FRBの広く使われる推定より大きな割合を説明した（抄録）。", "fun": "10年先までの金利だけを見るより、25年先まで見ると、近い将来の金利の見通しまでよく分かる、というのは逆説的だ。遠くを見ると手前がよく見える、という性質を数学的に見つけ、推定の誤差を大きく減らしている。", "unverified": "SSRN版の抄録で、掲載版との違いは確認できなかった。"}}, {"id": "jn38", "rank": 38, "field": "経営学", "headline": "指導者との差別化と研究生産性の男女差", "title": "Differentiation from mentors and the gender productivity gap in research: Evidence from electrical engineering", "url": "https://doi.org/10.1016/j.respol.2026.105653", "authors": "Denis Trapido", "venue": "Research Policy", "date": "2026-10-22", "citescore": 17.6, "citescore_year": "2025", "why": "電気工学の研究者で、指導者からの差別化と生産性の男女差の関係を扱う。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、電気工学の研究者で、指導者（メンター）の研究からの差別化と、研究生産性の男女差の関係を調べた論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、指導教員と違うテーマに踏み出すことが、男性と女性の研究者で同じように成果につながるのか、という点。独り立ちのしかたが、研究者のキャリアの男女差を生むのかもしれない。", "unverified": "抄録・本文を入手できず、手法と結果はすべて未確認。"}}, {"id": "jn39", "rank": 39, "field": "機械学習", "headline": "暗黙の視覚ツールで効率的なマルチモーダル推論", "title": "Beyond the Eye: Efficient Multimodal Reasoning Via Self-Regulated Implicit Visual Tools", "url": "https://doi.org/10.1109/tpami.2026.3745877", "authors": "Xiuwei Chen ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-21", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "自己調整的な暗黙の視覚ツールによる効率的なマルチモーダル推論を扱う。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "マルチモーダルLLMが画像を細かく見るために外部の視覚ツールを何度も呼ぶ代わりに、ツールの使用を内部化して自己調整する方法（BEE）を示した。", "     sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
