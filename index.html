<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

分の1以下に落ちた。蝶のはばたきが嵐を起こすように、小さな書き方の違いがやり取りを通じて増幅する。AIで社会を模擬するなら、結論が書き方に左右されないかを確かめる必要がある。", "unverified": "付録Dの完全な推定値と、付録Eの監査カードによる判定結果の詳細は読んでいない。"}}, {"id": "pr02", "rank": 2, "headline": "代理モデルの分解で橋のベイズ同定を高速化", "title": "Scalable Bayesian Structural Health Monitoring via surrogate-based model-class decomposition", "url": "https://doi.org/10.2139/ssrn.7650592", "authors": "Laura Ierimonti ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Ierimonti, L., Tomassini, E., García-Macías, E., & Ubertini, F. (2026). Scalable Bayesian Structural Health Monitoring via surrogate-based model-class decomposition. https://doi.org/10.2139/ssrn.7650592", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "橋梁のベイズ的な構造ヘルスモニタリング（SHM）で、損傷パラメータの空間を低次元の「モデルクラス」に分解し、代理モデルで高速に推論できるようにした。", "p2": "有限要素モデル更新は損傷パラメータの次元が高く計算費用も大きいため、実時間の監視には実用的でないことが多い（抄録）。", "p3": "まず広い損傷シナリオで構造応答を近似する大域的な代理モデルを学習し、それを複数の低次元の、モデルクラスごとのパラメータ部分空間に制限する。これでベイズ推論を効率化し、パラメータの識別性を高める。競合する損傷シナリオはBIC（ベイズ情報量規準）によるモデルクラス選択で順位づける（抄録）。", "p4": "実際に監視されている実橋の計測データと、独立した高精度モデルで作った合成の損傷シナリオで検証した。代理モデルは簡略化した有限要素モデルで学習し、独立の高精度モデルで試験する「二重モデル」の戦略をとった（抄録）。", "p5": "低次元のモデルクラスは、全パラメータを持つモデルより、データへの適合・モデルの複雑さ・識別性のバランスが良かった（抄録）。", "p6": "抄録からは、損傷の位置と程度の推定誤差や、実際の損傷での検証の有無は分からない。解釈：モデルクラスの切り方を事前にどう決めるかが結果を左右しうる。", "fun": "橋のどこが傷んでいるかを全部同時に推理しようとすると、可能性が多すぎて計算が終わらない。そこで「この部分だけ傷んでいる」という候補ごとに小さく分けて調べ、どの候補が一番もっともらしいかを比べる。探偵が容疑者を絞り込むやり方に似ている。", "unverified": "橋の名称・形式、推定精度の数値、計算時間の短縮の程度は抄録からは確認できなかった。"}}, {"id": "pr03", "rank": 3, "headline": "SEC半期報告案への21万件の意見をLLMで分類", "title": "Who Speaks for Quarterly Reporting? Evidence from More Than 215,000 Public Comments on the SEC's Semiannual Reporting Proposal", "url": "https://doi.org/10.2139/ssrn.7653278", "authors": "Victor Xiaoqi Wang ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Wang, V. X., & Yu, X. (2026). Who Speaks for Quarterly Reporting? Evidence from More Than 215,000 Public Comments on the SEC’s Semiannual Reporting Proposal. https://doi.org/10.2139/ssrn.7653278", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "米SECの四半期報告を半期報告に置き換えられるようにする提案に寄せられた21万5,000件超のパブリックコメントを、LLMで全件分類し、誰が何をどう主張したかを明らかにした。", "p2": "開示規則への意見募集は通常は組織からの少数の書簡が中心で、これほど大量の個人の意見を体系的に分析した研究はなかった。SECは閉鎖後、反対は提案の誤解によると述べていた（抄録）。", "p3": "理論に基づくコードブックに導かれたLLMで、すべてのコメントを書き手の種類、立場、正当化の仕方、提案の描写で分類し、書き手の種類と時期による違いを調べた（抄録）。", "p4": "会計基準への意見書（主に組織から）との対比と、SECの「誤解」説の検証を軸に分析した（抄録）。", "p5": "コメントはほぼすべて個人からで組織は0.1%未満、反対は97.8%とほぼ全会一致だった。敵対的な言葉は5.6%で主に匿名の書き手から。提案を四半期報告の廃止と描写したのは2.6%だけで、任意制と理解した人も同じく強く反対しており、誤解説を支持しなかった（抄録）。", "p6": "抄録からは、LLMによる分類の精度の人手検証の結果は分からない。解釈：意見募集への参加者は投資家全体を代表しない可能性がある。", "fun": "役所が「反対しているのは提案を誤解しているからだ」と言ったが、21万件の意見を全部読んで確かめると、そうではなかった。人間では読みきれない量の声をAIで分類し、行政の主張を検証できる時代になったことを示している。", "unverified": "LLMの分類精度の検証方法と結果は抄録からは確認できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "空き地の緑化で固定資産税の滞納が減るか", "title": "Beyond Property Values: Vacant Lot Greening and Property Tax Delinquency", "url": "https://doi.org/10.2139/ssrn.7647038", "authors": "Desen Lin", "venue": "SSRN", "date": "2026-10-22", "apa": "Lin, D. (2026). Beyond Property Values: Vacant Lot Greening and Property Tax Delinquency. https://doi.org/10.2139/ssrn.7647038", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "フィラデルフィアの空き地の緑化が、周辺の固定資産税の滞納の解消につながるかを検証し、見かけの効果の多くは初期の負債の差で説明されることを示した。", "p2": "近隣への投資の財政面の評価は、資産価値の上昇に注目してきたが、滞納の解消がどのように起きるか（所有者が保有を続けて払うのか、所有権が移るのか）は調べられていなかった（抄録）。", "p3": "2013〜2018年の緑化の前後で、税の残高・評価額・権利証書を結びつけ、傾向スコアでマッチングした対照地区と比べた。さらに過去の財務履歴でもマッチングした（抄録）。", "p4": "滞納の有病率、初期の債務者の脱出確率、3年間ずっと滞納がない割合、保安官売却による所有権移転を指標とした（抄録）。", "p5": "滞納の有病率は3年平均で対照より0.9ポイント多く下がったが、財務履歴でもマッチングすると0.4ポイントに縮んだ。同程度の請求を抱える口座では違いが小さく、各群とも約22%が3年間すべて滞納なしだった。解消は保安官売却を伴うことが多く、古い債務の口座に集中していた（抄録）。", "p6": "抄録からは、緑化の割り当てが無作為かどうか、近隣の範囲の定義は分からない。解釈：滞納が「解消」しても、元の住民が家を失っている場合がある。", "fun": "空き地に木や芝を植えると街が良くなり、税金の滞納も減る、と思いたくなる。でも詳しく見ると、滞納が消えた理由の一部は、裁判所の命令で家が売られて持ち主が変わったことだった。数字が良くなった中身まで見ないと、誰が得をしたかは分からない。", "unverified": "緑化の件数と対象地区の数は抄録からは確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "リスク開示の中身で監査報酬の予測が改善", "title": "Narrative Risk Disclosures and Audit Pricing", "url": "https://doi.org/10.2139/ssrn.7652418", "authors": "Ehsan Heshmatzadeh ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Heshmatzadeh, E., & Parker, C. (. (2026). Narrative Risk Disclosures and Audit Pricing. https://doi.org/10.2139/ssrn.7652418", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "米国企業の有価証券報告書のリスク要因（Item 1A）から、監査人に関わるリスクの目立ち方を測る分解可能な指標（ARRS）を作り、監査報酬の予測に追加の情報があるかを検証した。", "p2": "監査報酬は財務や監査人の構造化データで説明されてきたが、リスク記述の中身（構成）が追加の情報を持つかは明らかでなかった（抄録）。", "p3": "Item 1Aの記述から11の構成要素からなるARRSを作り、2016〜2025年の提出書類で、拡大窓（期間を順に伸ばす）設計で監査報酬の標本外予測を行った（抄録）。", "p4": "構造化された財務・監査人の特性、開示の長さ、一般的なテキストの属性を基準モデルとし、標本外RMSEの改善で評価した（抄録）。", "p5": "11の構成要素は標本外RMSEを5.27%下げ、総合点のARRSより一貫して良かった。改善は業種と年にわたって広く見られたが、前年の監査報酬を基準に入れるとほぼ消え、報酬の持続性が関連の多くを説明した（抄録）。", "p6": "抄録からは、11の構成要素の内容と、テキストからの抽出方法（辞書かモデルか）は分からない。解釈：前年報酬が強いのは、リスク情報がすでに過去の報酬に織り込まれているためとも読める。", "fun": "会社が書く「リスクの説明」には、監査にどれだけ手間がかかるかのヒントが入っていて、報酬の予測が少し良くなる。でも去年の報酬を知っていればほぼ足りる、という正直な結果は、新しい指標の価値を測るときの厳しい基準の大切さを教えてくれる。", "unverified": "11の構成要素の定義と抽出方法は抄録からは確認できなかった。"}}, {"id": "pr06", "rank": 6, "headline": "固定側の振動伝達率でタービン羽根の損傷を検知", "title": "Transmissibility-based detection of hydro-turbine runner damage from stationary-frame vibration", "url": "https://doi.org/10.2139/ssrn.7650594", "authors": "Jiannan Zhao ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Zhao, J., Duan, J., Peng, Z., Zhang, X., & Feng, J. (2026). Transmissibility-based detection of hydro-turbine runner damage from stationary-frame vibration. https://doi.org/10.2139/ssrn.7650594", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "水車の回転するランナー（羽根車）に直接センサーを付けず、固定側の振動から羽根の損傷を検知する手順を、健全時だけを基準にして作り、実験で確かめた。", "p2": "運転中のランナーへの直接の計測は難しく、固定側の振動には運転条件のばらつきや他の励振源も混ざるので、ランナー由来の振動が見えても損傷とは言えない（抄録）。", "p3": "繰り返し測った健全時のパワースペクトル密度の伝達率（PSDT）曲線を特異値分解で統合して、包絡線の次数解析に使う搬送帯域を決める（損傷時の応答は帯域選択に使わない）。振幅の変化と次数のピークのずれを組み合わせ、2つの帯域と2つ以上の次数で一貫した異常を求める階層的な判定規則とした（抄録）。", "p4": "同じランナーに人工的な羽根の欠陥を入れる前後で実験し、健全時の再現性試験と、SNR −5・5・15 dBの白色雑音の干渉も試した（抄録）。", "p5": "240 r/minで24Xと48X、300 r/minで1Xと48X、360 r/minで12Xと48Xの2つの次数が一貫して異常と判定された。健全時の再現性試験では損傷の判定は出ず、雑音下でも健全は正常、健全と亀裂の比較は損傷の判定を保った（抄録）。", "p6": "抄録からは、損傷の大きさを変えた検出限界や、実機の発電所での検証は分からない。解釈：人工欠陥は実際の疲労き裂と応答が異なる可能性がある。", "fun": "回っている羽根に直接センサーを付けるのは難しいので、外側の動かない部分の揺れから、羽根の傷を聞き分ける。そのために「健康なときの揺れの伝わり方」を何度も測って基準にし、それから外れたら異常と判断する。聴診器で心臓の音を聞くのに似ている。", "unverified": "欠陥の大きさと、搬送帯域の具体的な周波数は抄録からは確認できなかった。"}}, {"id": "pr07", "rank": 7, "headline": "LLMエージェントの戦略差とペルソナ指示の効き目", "title": "AgentMonopoly: Behavioral Patterns and Persona Control in LLM Agents", "url": "https://arxiv.org/abs/2610.29330", "authors": "Changshun Wu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Wu, C., Li, M., Marsault, M., Huang, X., & Cheng, C.-H. (2026). AgentMonopoly: Behavioral Patterns and Persona Control in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29330", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験設定・結果・結論・限界の節と図2〜5のキャプション）を読んだ", "preprint": true, "p1": "モノポリーを使う環境AgentMonopolyで、LLMエージェントの戦略の違いと、ペルソナ（振る舞いの指示）が言葉と行動をどこまで変えるかを比べ、言葉は変わっても行動は役割どおりに変わらないことがあると示した。", "p2": "ペルソナを与えたLLMの評価は言葉づかいで判断されがちだが、ペルソナの語を使うことは意思決定で役割に従うことを意味しない（§3）。", "p3": "4人用の盤面（通りの名前を変更、賃料の免除を可能にした規則）で、Qwen3・DeepSeek-R1・Gemma・Mistralの各2サイズを温度0で、同じモデル同士・サイズ混合・系列混合・ペルソナ付きの4構成で各5シードずつ対戦させた。ペルソナはZen（取引を減らす）、Independent、Diplomatic、Conservative（現金を多く持つ）を各系列に1つずつ与えた（§4）。", "p4": "サイコロ100回あたりの取引提案、受けた提案の受諾率、賃料の免除率、最小現金、建物数、ペルソナ関連語の頻度を、ペルソナ付きの1人と同じゲームの3人の相手で比べた（§4）。", "p5": "同モデル同士ではQwenが最も多く提案（32Bで110、8Bで94）、Mistralが最も多く受諾した（§5.1、図2）。サイズ混合40ゲームの勝ちは大きいモデル18・小さいモデル22で、大きいほど勝つとは言えなかった（§5.2）。ZenはDeepSeekなどと比べ提案が相手の101に対し20と約80%減ったが建物は増え、Conservativeは最小現金が平均688ドル（相手63ドル）でも受諾率は86%と高いままだった（§5.3、図5）。", "p6": "著者は、1つの改変盤面、5シード、温度0、特定の版のモデルに限られ、各ペルソナを1系列にしか与えていないので指示の効果とモデルの反応を分けられず、生成された説明は行動の理由の証拠にならないと認めている（限界の節）。", "fun": "「おっとりした性格で」とAIに頼むと、話し方はすぐに穏やかになるが、ゲームの中の行動まで性格どおりに変わるとは限らない。「慎重に」と言われたAIが、一度断った土地を競売で少し高く買う場面もある。人も言葉と行動が違うことがあるが、AIのキャラ設定も行動で確かめる必要がある。", "unverified": "付録Aの詳細な設定と、著者自身が「要確認」とした座席配置の詳細は読んでいない。"}}, {"id": "pr08", "rank": 8, "headline": "LLMで符号化したAI開示指標の人手検証計画", "title": "Independent Human Validation of Two Machine-Coded AI Disclosure Measures in U.S. Bank Annual Reports (FY2021–FY2025)", "url": "https://doi.org/10.17605/osf.io/6h89x", "authors": "Werner Girth ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-15", "apa": "Werner Girth, & Samuel Przeworski. (2026). Independent Human Validation of Two Machine-Coded AI Disclosure Measures in U.S. Bank Annual Reports (FY2021–FY2025). OSF Registries. https://doi.org/10.17605/OSF.IO/6H89X", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OSFの登録文書の抄録（OpenAlexに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "米国の銀行40行の年次報告（2021〜2025年度）について、2つのLLMで符号化したAI導入の開示指標を、独立した人間の符号化者がどこまで再現できるかを検証する事前登録の計画を示した。結果はまだない。", "p2": "LLMで作った開示の指標は大規模に作れるが、その妥当性を、結果を知らない独立の人間がどこまで再現できるかで確かめる手順は確立していない（抄録）。", "p3": "検証の対象は、ある銀行・年に条件を満たすAI導入の対象が少なくとも1つあるか（参加）と、そのうち現行の運用段階（DEP03〜05）にあるものがあるか（現行の存在）の2指標。開発などに使った23銀行年を除いた177銀行年から、年度と参加状況の10層で各4件、計40件を、事前に固定した乱数種のスクリプトで抽出する（抄録）。", "p4": "研究チームと独立し、期待を知らない2人の符号化者が、規則の抜粋と手順書だけを受け取って独立に符号化し、不一致は第3の符号化者が裁定する。一致の単位、偶然の一致を補正した一致統計、合否のしきい値を事前に固定した（抄録）。", "p5": "登録の時点で符号化は始まっておらず、結果は報告されていない。しきい値を満たすかどうかにかかわらず全結果を報告し、比較が終わるまで登録簿（v2.19）を変更しないと定めている（抄録）。", "p6": "抽出が登録簿の参加の値を使っているため一致統計に影響しうることを、著者自身が分析計画で扱うとしている（抄録）。解釈：40件という標本で稀なカテゴリの一致を精密に測れるかは結果を見る必要がある。", "fun": "AIに文書を読ませて点数をつけさせたら、その点数を人間が本当に再現できるのかを、ずるができない手順で確かめようとしている。どの文書を選ぶか、合格の基準は何かを結果を見る前に全部決めておく、という「後出しをしない」姿勢が、研究の信頼性を支えている。", "unverified": "検証の結果は未公表。一致統計のしきい値の具体的な値は抄録からは確認できなかった。"}}, {"id": "pr09", "rank": 9, "headline": "LLM埋め込みで顧客の意味的表現を学習", "title": "Semantic Customer Embeddings", "url": "https://doi.org/10.2139/ssrn.7651000", "authors": "Isamar Troncoso ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Troncoso, I., Ma, L., Ascarza, E., & Israeli, A. (2026). Semantic Customer Embeddings. https://doi.org/10.2139/ssrn.7651000", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "LLMに含まれる意味の知識と、企業の顧客行動データを組み合わせて、複数のマーケティング用途で使える「意味的な顧客埋め込み（ベクトル表現）」を学習する枠組みを示した。", "p2": "購買・来店・閲覧などの顧客データは疎で異質で、複数の情報源に分散しているため、さまざまなマーケティング用途に一般化できる顧客の理解を引き出しにくい（抄録）。", "p3": "顧客の接点で観測される品目（購入した商品、訪れた小売店など）の表現をLLMの埋め込みで初期化し、観測された行動の文脈に合わせて適応させ、接点をまたいで集約して、将来の行動を捉えるように学習した統一的な顧客埋め込みにする（抄録）。", "p4": "大規模な顧客エンゲージメント基盤のデータで、顧客の細分化とペルソナ作成、自然言語による類似顧客の発見、新商品のターゲティングに使えるかを調べた（抄録）。", "p5": "得られた埋め込みは、これらの複数のマーケティング用途に使える意味のある顧客の表現になったと報告している（抄録）。", "p6": "抄録からは、比較した基準手法と性能の数値、データの国や規模は分からない。解釈：LLMの事前知識が文化や地域の偏りを持ち込む可能性は検討が必要だ。", "fun": "「コーヒー豆を買った」「本屋に行った」という行動を、単なる記号ではなく、言葉の意味を知っているAIの知識で表すと、行動の少ない客でも好みを推測しやすくなる。さらに「アウトドア好きの若い親」のような言葉で似た客を探せるのが面白い。", "unverified": "性能の数値と比較対象は抄録からは確認できなかった。"}}, {"id": "pr10", "rank": 10, "headline": "粒状体に埋めた板の引抜き抵抗と深さの関係", "title": "Influence of embedding depth on the pullout of a plate from a confined granular medium", "url": "https://arxiv.org/abs/2610.29016", "authors": "Dominik Krengel ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Krengel, D., Chen, J., Nomura, S., & Takahashi, H. (2026). Influence of embedding depth on the pullout of a plate from a confined granular medium (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29016", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（DEMの設定、抗力・巨視的応答・壁との相互作用の結果、結論と表1）を読んだ", "preprint": true, "p1": "密な粒状体に埋めた板を引き抜くときの抵抗（抗力）が、埋設深さと粒子間の摩擦によってどう変わるかを、多角形の個別要素法で明らかにし、深く摩擦が大きいと容器の壁との相互作用が最大抗力を押し上げることを示した。", "p2": "粒状体の中を動く物体の抵抗は、アンカーや杭、土中の構造物で重要だが、埋設深さ・摩擦・境界の影響が引き抜きの最大抗力と定常状態でどう違うかは整理されていなかった（§1）。", "p3": "6〜13角の不規則な凸多角形の粒子約12,000個の2次元DEMで、板を一定速度0.01 m/sで20秒引き上げた。埋設深さh₀=0.20〜1.63 mの6通り、摩擦係数μ=0.1・0.5・1.0を同じ初期状態から計算した（§2、表1）。定常部の抗力はF=kΔh+F₀で近似し、kを破壊後の残留剛性、F₀を確立した流れの終局抗力の目安と解釈した（式1）。", "p4": "板の直上の粒子の重さF_overで規格化した最大抗力、定常部の傾きと切片、力の連鎖と速度場、隆起する楔の形、側壁の法線力と動員された摩擦を比べた（§3）。", "p5": "最大抗力はh₀に対して非線形に増え、μが大きいほどh₀の影響が強かった（図3）。μ≥0.5かつh₀≥0.78 mでは破壊前に板から壁へ強い力の連鎖がつながり、最大抗力を増幅したが、定常状態では板と壁の間が膨張して力が上向きになり、壁との相互作用は小さくなった（§3.4、図12）。破壊面の角度はμ=1.0で約45°と、低摩擦時の約60°より外側に開いた（§3.2.1）。", "p6": "著者は、2次元の計算で、板と容器の幅の比を固定しているので、容器が広ければ壁の影響が現れる摩擦の大きさや抗力のスケーリングが変わりうると述べ、3次元での変動の違いは今後の課題としている（§3.1、§4）。", "fun": "砂に埋めた板を引き上げると、上の砂が台形のかたまりになって持ち上がる。摩擦が大きく深く埋まっていると、力の「鎖」が横の壁まで届いて抵抗が増えるが、いったん崩れると砂がふくらんで鎖が切れ、壁の影響が消える。目に見えない力の網目の変化が、手応えの変化を生んでいる。", "unverified": "§3.2.2の空隙率と§3.3の楔の発達の詳細な数値は読んでいない。板の厚さは本文と表で記載が異なり確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "LLM同士の議論で「操作せよ」の指示は一貫して効かない", "title": "To Manipulate or Not: Opinion Dynamics in LLM Interactions", "url": "https://arxiv.org/abs/2610.28875", "authors": "Mohammad Siahkamari ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Siahkamari, M., Nguyen, P. D., & MacNeil, S. (2026). To Manipulate or Not: Opinion Dynamics in LLM Interactions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28875", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・結果・考察・結論と表1〜4）を読んだ", "preprint": true, "p1": "2つのLLMの役割が気候変動の原因について繰り返し議論する統制された枠組みを作り、意見の変化は双方向に起き、どのモデルの組み合わせかで向きが変わり、「操作せよ」という指示に一貫した効果はないことを示した。", "p2": "LLMの説得の研究の多くは一方の変化だけを測り、相手からも影響を受けるという双方向の過程や、モデルの組み合わせによる違いは扱われていなかった（序論）。", "p3": "立場を与えない議論者と、人為説・中立・自然説のいずれかを与えた反対者を、GPT-6 LunaとGemini 2.5 Flash Liteで4通りに組み、操作の指示の有無と文の向き2通りを掛け合わせた48セル×10回=480回の20ラウンドの議論を行った（表1）。意見は、毎ラウンド別の呼び出しで聞く0〜6の自己評価と、対話中のACCEPT/REJECT/IGNOREで1段ずつ動く状態の2つで測った（方法）。", "p4": "人為説の側を高くそろえた尺度（式1）で、議論前後の変化、両者の距離の縮小（収束）を議論単位で集計し、HC3頑健標準誤差の回帰とWelch検定（探索的）で比べた（方法）。", "p5": "立場を与えない議論者の初期値はLunaで5.91、Geminiで4.72とモデルにより違った（RQ1）。全体では議論者が−0.41、反対者が+0.42動いたが、Luna同士は明確に収束し、異なるモデルの組み合わせでは平均で発散した（RQ2）。操作の指示による距離の変化の差は−0.44（p=.063）で、組み合わせ×操作の検定もχ²(3)=3.21、p=.361と有意でなかった（RQ3）。2つの意見指標が一致したのは約3分の1だった。", "p6": "著者は分析を記述的・探索的と位置づけ、2モデル・1つの論題・固定の20ラウンドに限られるとしている。解釈：操作の「目標」だけを与え具体的な戦術を与えていないので、戦術を指定した場合の効果は別問題として残る（考察）。", "fun": "「相手を説得しろ」と命じられたAIが、実は相手に合わせて自分の意見を変えていることがある。説得する側だけを見ていると、それを「説得の成功」と取り違える。どちらのAIが話すかで、意見が近づくか離れるかまで逆になるのも面白い。", "unverified": "付録の各組み合わせの図と表5の詳細な数値は読んでいない。"}}, {"id": "pr12", "rank": 12, "headline": "希少疾患の無償介護の時間と経済価値を推計", "title": "The Invisible Cost: Contemporary Economic Valuation of Unpaid Care in Epidermolysis Bullosa Across Six European Countries", "url": "https://doi.org/10.21203/rs.3.rs-11256474/v1", "authors": "Christine Bodemer ほか", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Bodemer, C., Jain, R., Alonso-Ferreira, V., El-Hachem, M., Has, C., Hölgyesi, Á., Hubl, V., Iskrov, G., Medvecz, M., Salamon, G., Yordanova, I., Pellegrini, M., Taieb, C., Champeix, C., & Linertová, R. (2026). The Invisible Cost: Contemporary Economic Valuation of Unpaid Care in Epidermolysis Bullosa Across Six European Countries. https://doi.org/10.21203/rs.3.rs-11256474/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（方法・結果・考察・強みと限界、表2）を読んだ", "preprint": true, "p1": "表皮水疱症（EB、皮膚が非常に傷つきやすい遺伝性の病気）の家族介護者が担う無償の介護の時間を12の活動ごとに測り、専門職で置き換えたときの費用で経済価値を6か国で推計した。", "p2": "EBの介護は生涯にわたり技術的にも難しいが、介護の時間を個々の活動から積み上げた多国間の推計は限られていた（序論）。", "p3": "多施設の横断研究BUR-EB（2022〜2025年）で、主な介護者が創傷の被覆交換・治療浴・投薬など12活動の週あたり時間を答えた。週168時間を超える回答は除いた。価値は置換費用法（同等のサービスを専門職に頼む費用）で、週の中央値×52×各国の時給で求め、看護師の時給を主な、在宅介護員の時給を控えめなシナリオとした。国の最低賃金で割った比も示した（方法）。", "p4": "分析対象は子の介護者58人と成人の介護者46人（ハンガリーは除外）。分布が右に偏るので中央値を主な指標とした（方法）。", "p5": "週の介護時間の中央値は子で34.7時間（IQR 15.1〜74.0）、成人で24.2時間（表2）。看護師の時給による年間の置換費用は、子でブルガリアの14,439ユーロからドイツの63,169ユーロ、成人で10,088〜44,135ユーロだった。最低賃金で割ると子で1.9〜3.0倍、成人で1.3〜2.1倍に収まった。創傷処置・治療浴・投薬が時間の約40%を占めた（結果）。", "p6": "著者は、自己申告であること、同時に行う活動を足しているので実時間を過大評価しうること、主な介護者だけを数えていること、専門施設経由の募集で重症例に偏りうること、国ごとの標本が小さいこと（フランスの成人は5人）、置換費用は介護者の逸失所得ではないことを限界に挙げている（強みと限界）。", "fun": "家族が毎日行っている傷の手当てやお風呂の世話を、看護師に頼んだらいくらかかるかで値段をつけると、子どもの介護は年に最低賃金の2〜3年分にもなる。お金が支払われない仕事は統計に現れにくいが、こうして測ると「見えない労働」の重さがはっきりする。", "unverified": "国別の標本数と在宅介護員の時給による控えめなシナリオの数値（表3、補足表）は読んでいない。"}}, {"id": "pr13", "rank": 13, "headline": "監査自動化の時間削減は誰の得になったか", "title": "Who Captures the Gains from Audit Automation? Evidence from Disclosed Audit Hours and Fees", "url": "https://doi.org/10.2139/ssrn.7647101", "authors": "Byungchul Choi", "venue": "SSRN", "date": "2026-10-21", "apa": "Choi, B. (2026). Who Captures the Gains from Audit Automation? Evidence from Disclosed Audit Hours and Fees. https://doi.org/10.2139/ssrn.7647101", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "韓国の監査時間・報酬の開示を使い、監査の自動化で減った時間の利益を、初めの契約の周期では監査人が手にしていたことを示した。", "p2": "監査報酬は現場作業の前に予想時間で決まるので、技術で時間が減ったとき、その節約が報酬の値下げとして顧客に渡るのか、監査人に残るのかは分かっていなかった（抄録）。", "p3": "全上場企業の契約時と実際の監査報酬・時間が開示される韓国で、2018年から自動化ツールを開発しながら、標準監査時間の枠組みが時間の節約を認めないため国内で使えなかったBig4の1社（A社）を対象にした。デジタル監査の効果による調整が初めて認められた2025年度の前後で、A社の担当と他の監査人の担当を比べた（抄録）。", "p4": "実際の監査時間、職位別の時間、報酬、時間あたりの報酬、翌年度の契約時間、9年間のパネルでの監査の質の指標を比べ、非上場企業の監査報告書でも確かめた（抄録）。", "p5": "A社の担当の実際の時間は他より約18%減り、減少は公認会計士と研修生の時間に集中した。報酬の減少は4〜7%と時間の半分未満で、時間あたりの報酬は12〜14%上がった。2026年度の契約時間は中央値で前年度と変わらず、質の悪化は検出されなかった（抄録）。", "p6": "抄録からは、A社と他社の担当企業の違いをどう統制したかは分からない。解釈：初めの周期の結果なので、次の契約交渉で利益が顧客に移るかは今後の観察が必要だ。", "fun": "仕事を速くする道具を入れても、その成果が誰のものになるかは契約のしくみで決まる。値段を先に決める契約だと、初めのうちは時間が減った分が監査法人のもうけになる。しかも、規制が時間の節約を認めるまで、その効果は数字に現れなかった、という点が面白い。", "unverified": "比較の具体的な方法（差の差など）と、監査の質の指標の内容は抄録からは確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "AIを設定した人の道徳性が信頼行動に波及", "title": "The Moral Character of Humans Behind AI Shapes Behavioral Trust in Large Language Models", "url": "https://doi.org/10.2139/ssrn.7656366", "authors": "Cassandra Grützner ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Grützner, C., & Niszczota, P. (2026). The Moral Character of Humans Behind AI Shapes Behavioral Trust in Large Language Models. https://doi.org/10.2139/ssrn.7656366", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "AIの振る舞いを決める人の道徳的な性格が、自分に得がなくてもAIの振る舞いに反映され、AIと関わる人もその性格を手がかりにAIへの信頼を変えることを、事前登録の行動実験で示した。", "p2": "人がAIの他者への扱い方を決められるとき、その人の道徳性がAIに持ち込まれるのか、そしてAIの利用者がそれを考慮して振る舞うのかは、行動の証拠がなかった（抄録）。", "p3": "2段階の研究（計1,268人）。上流の段階では、参加者が道徳に関わる性格の尺度に答え、経済的なトレードオフに直面したAIの振る舞い方を指示した（参加者はAIの決定から得をしない）。下流の段階では、新しい参加者が、上流の1人が導くLLMと報酬付きの1回限りの信頼ゲームを行い、その導き手の道徳性が高い・低い・情報なしのいずれかを知らされた（抄録）。", "p4": "上流では性格（正直さ・謙虚さ、利他性、ダークな特性）と指示の他者配慮の度合いの関係、下流では知らされた情報による信頼（預ける額）の違いを比べた（抄録）。", "p5": "道徳性の高い上流の参加者ほど他者に配慮した指示を与え、その性格がLLMの振る舞いに持ち込まれた。導き手の道徳性が高いと知ると信頼が増え、低いと知ると減り、減少は増加より大きかった（抄録）。", "p6": "抄録からは、効果の大きさと、導き手の指示がLLMの実際の行動をどれだけ変えたかの数値は分からない。解釈：信頼ゲームの1回の選択が、長期的なAIへの信頼をどこまで表すかは別に検討が必要だ。", "fun": "AIは中立な機械と思われがちだが、それを設定した人の人柄が、得にならなくてもにじみ出る。そして使う側も「誰が設定したか」でAIを信じるかどうかを変える。悪い評判の効き目が良い評判より大きい、という点は人間同士の信頼とよく似ている。", "unverified": "効果の大きさ（預けた額の差）は抄録からは確認できなかった。"}}, {"id": "pr15", "rank": 15, "headline": "短い運動履歴から船体の動揺式をオンライン同定", "title": "Online Seakeeping Forecast Coupling System Identification With Nonlinear Pseudo Spectral Potential-Flow", "url": "https://arxiv.org/abs/2610.28694", "authors": "Zev Hoffman ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Hoffman, Z., Vahaji, S., Candon, M., Jayarathne, N., & Marzocca, P. (2026). Online Seakeeping Forecast Coupling System Identification With Nonlinear Pseudo Spectral Potential-Flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28694", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（貢献、システム同定、結果、考察、結論の節）を読んだ", "preprint": true, "p1": "波の中の浮体の前後揺れ・上下揺れ・縦揺れ（surge・heave・pitch）を、短い運動履歴からオンラインで同定した方程式と非線形の波の予測を組み合わせ、実時間で決定論的に予測するグレーボックスの枠組みを示した。", "p2": "拘束模型試験による線形の伝達関数は費用が高く頑健でなく、ブラックボックスの代理モデルは解釈しにくい。海況や形状が変われば係数も変わる（§1.1）。", "p3": "擬スペクトル・ポテンシャル流（PSPF）ソルバーが浮体の前後の位置での入射波を予測し、それを外力として、復元・減衰項の符号を物理的に制約した有界リッジ回帰（式27）で3自由度の運動方程式の係数を同定する。新しいデータが来るたびに係数を再同定し、予測区間を移動させる（§4.3、§5）。線形項だけの辞書と、SINDy（疎な非線形同定）の辞書を比べた。", "p4": "不規則波中の2次元の浮体の箱をCFDで計算し、各時点で将来のCFDデータを隠して標本外予測を行い、予測区間のNRMSEで評価した（§6）。", "p5": "約8波周期分の学習で同等の海況の将来を頑健に予測でき、学習は0.1〜1秒程度だった（§4.3）。7.741秒先の予測の計算に平均0.767秒かかり、実質6.974秒先を予測できた（§6）。入射波の予測とCFDのNRMSEは0.058で、誤差の主因は同定した運動モデルの側だった。線形の辞書は非線形のSINDyと同程度の精度で、より安定だった（§7）。", "p6": "著者は、2次元・一方向の波に限られ、復元力のないsurgeでは誤差が積み重なってずれること、実海域では初期の波の場をレーダーで得る必要があること、PSPFの計算費用を課題としている（§7、§8）。また同定した係数は、共線性のために独立に識別できる物理的な流体力係数とは限らないと注意している。", "fun": "船の揺れを少し先まで当てるには、来る波を予測する部分と、船がその波にどう反応するかを学ぶ部分に分けるのがコツ。反応の式は数秒ごとに最新の揺れから作り直すので、単純な一次式でも、波が荒れて非線形な現象が起きる場面までそこそこ追いつける。", "unverified": "SINDyの辞書の詳細（式35〜37）と、図8〜10の各自由度のNRMSEの数値は読んでいない。"}}, {"id": "pr16", "rank": 16, "headline": "動的ハイパーグラフで中小企業の信用リスク評価", "title": "Multi-view Dynamic Hypergraph Neural Network based on Key Hyperedges: A New Perspective on Credit Risk Assessment for Small and Medium Enterprises", "url": "https://doi.org/10.2139/ssrn.7656053", "authors": "Bo Dong ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Dong, B., Huang, D., & Wang, X. (2026). Multi-view Dynamic Hypergraph Neural Network based on Key Hyperedges: A New Perspective on Credit Risk Assessment for Small and Medium Enterprises. https://doi.org/10.2139/ssrn.7656053", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "財務諸表が乏しい中小企業の信用リスクを、出資関係と取引関係を表すハイパーグラフ（3社以上の関係を1本の辺で表すグラフ）から評価する手法を提案した。", "p3": "訴訟記録などの公開された非財務情報で2種類の企業ハイパーグラフを作り、k-shell分解やPageRankで中核企業の影響が中小企業の特徴を覆い隠さないよう制約したうえで、多視点の埋め込みを統合する（抄録）。", "p5": "自動車サプライチェーン企業2,501社のデータで正解率89.63%、マクロF1 89.42%、AUC 0.842を得て、誤って融資を承認する率を38.23%から27.31%に下げたと報告している（抄録）。", "fun": "決算書がほとんどない小さな会社でも、「誰と取引し、誰と資本でつながっているか」を見ればお金を貸して大丈夫かがある程度わかる、という発想が面白い。ただし大企業とつながっていると大企業の情報ばかりが目立つので、その偏りを数学的に抑える工夫をしている。", "unverified": "比較に使った手法の詳細と、データセットの公開の有無は抄録からは確認できなかった。"}}, {"id": "pr17", "rank": 17, "headline": "AI事故は証券開示にどこまで現れるか", "title": "The AI Incident Disclosure Shadow: Tracking AI Incidents into U.S. Securities Filings", "url": "https://doi.org/10.2139/ssrn.7648820", "authors": "Samir Chincholikar ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Chincholikar, S., & Chawla, R. (2026). The AI Incident Disclosure Shadow: Tracking AI Incidents into U.S. Securities Filings. https://doi.org/10.2139/ssrn.7648820", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "公開企業が関わったAI事故が、その後の米国の証券開示（8-K、10-K、10-Q）にどれだけ現れるかを初めて体系的に測った。", "p3": "AI事故データベースの2019〜2026年の事故1,389件を上場企業に照合して307件・21社を得て、事故後12か月の開示を、事故固有（T1）、関連する法的帰結（T2）、一般的なリスク記述（T3）、記述なし（T4）に事前登録した基準で符号化した（抄録）。", "p5": "T1は4件、T2は3件、T3は278件、T4は22件で、事故固有の開示は1.3%（95%信頼区間0.4〜3.3）にとどまり、97.7%は事故固有の開示が見当たらない「開示の影」だった（抄録）。", "fun": "ニュースになるようなAIの事故が起きても、会社の公式な報告書にはほとんど書かれていないことを数えて示した研究。書かれないことを測るのは難しいが、事故の一覧と報告書を一件ずつ突き合わせることで「沈黙」を数字にしている。", "unverified": "T3の記述の具体例と、照合の誤りの評価方法は抄録からは確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "財務テキストの匿名化で失われる情報", "title": "Anonymization and Information Loss", "url": "https://doi.org/10.2139/ssrn.7653699", "authors": "Ke Wu ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Wu, K., Ying, Z., Yang, B., & Zhou, D. (2026). Anonymization and Information Loss. https://doi.org/10.2139/ssrn.7653699", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLMの先読みバイアスを防ぐために財務テキストの固有名詞を伏せる匿名化が、経済的に重要な情報まで消してしまうことを示した。", "p3": "情報の損失とバイアスの除去を分ける枠組みから4つの予測を導き、モデルの学習期限より後の決算説明会の記録で、生のテキストと匿名化したテキストから抽出した点数の格付け引下げの予測力を比べた（抄録）。", "p5": "生のテキストの点数は格付け引下げを強く予測したが、匿名化した点数は弱まり、生の点数を入れると追加の予測力がなかった。弱まりの主因は情報の損失で、損失のおよそ5分の3は残った証拠の読み方の歪みによるとした（抄録）。", "fun": "AIに過去のデータを読ませて未来を当てさせるとき、AIが答えを「すでに知っている」ずるを防ぐために会社名を隠すのが定番だった。ところが隠すと大事な手がかりまで消え、予測力が落ちたのは「ずるが減ったから」ではなかった、という指摘が鋭い。", "unverified": "使用したLLMの種類と、4つの追加の予測課題の内容は抄録からは確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "訴えられた企業でアナリスト予想はどう変わるか", "title": "Being Sued, Not Suing: Litigation and the Analyst Information Environment", "url": "https://doi.org/10.2139/ssrn.7651778", "authors": "Karina Zhang ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Zhang, K., Cheng, Y., & Ndum, R. (2026). Being Sued, Not Suing: Litigation and the Analyst Information Environment. https://doi.org/10.2139/ssrn.7651778", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業が訴えられると、アナリストの業績予想のばらつきが広がることを示した。", "p3": "2000〜2024年のアナリストが付く米国企業56,407企業年で、被告になった前後の予想のばらつきを企業内で比べ、裁判所の地理を操作変数とする推定も行った（抄録）。", "p5": "被告になると予想のばらつきが中央値の約3分の1増え、原告になっても変化はなかった。ばらつきは訴訟が続く間続き、和解でも却下でも決着とともに消えた（抄録）。", "fun": "「情報が公開されれば専門家の意見はそろう」と考えられてきたが、訴訟のように結末が分からない情報が公開されると、かえって意見が割れる。情報には「答えを教えるもの」と「未解決の問いを増やすもの」がある、と気づかせてくれる。", "unverified": "ばらつきの指標の正確な定義と、操作変数推定の係数の大きさは抄録からは確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "支払異常の検知と運転資本判断を組み合わせる", "title": "PayGuard AI: An Explainable Hybrid Framework for Corporate Payment-Anomaly Detection and Working-Capital Decision Support", "url": "https://doi.org/10.21203/rs.3.rs-11144714/v1", "authors": "Tanisi Das", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Das, T. (2026). PayGuard AI: An Explainable Hybrid Framework for Corporate Payment-Anomaly Detection and Working-Capital Decision Support. https://doi.org/10.21203/rs.3.rs-11144714/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "買掛金の支払いの異常を、業務ルール・機械学習・不確実性の推定・運転資本のシミュレーションを組み合わせて検知する枠組みを提案した概念実証。", "p3": "業務ルール、Isolation Forest、ロジスティック回帰、ベイズ的な不確実性推定などを統合し、異常率5%・7種類の異常を含む合成の支払取引5,600件で評価した（抄録）。", "p5": "ROC-AUCは0.982でルールのみの0.989よりわずかに低いが、平均適合率は0.770とルールのみの0.680を上回った。完全な重複・ほぼ重複の検知は弱かった（抄録）。", "fun": "不正な支払いを探すとき、決まりごと（ルール）と統計の目を組み合わせると、見逃しより「本当に怪しいものを上位に並べる力」が上がる。一方で、二重払いのような単純な不正が苦手という結果は、賢い方法でも単純な穴が残ることを示している。", "unverified": "合成データの作り方の詳細は抄録からは確認できなかった。実データでの検証はまだ行われていない（抄録）。"}}, {"id": "pr21", "rank": 21, "headline": "住宅ローン信用リスクのモデル間の不一致", "title": "Specification Disagreement and Forecast-Transfer Discrepancy in Mortgage Credit Risk: Evidence from Behavioural-History Models", "url": "https://doi.org/10.20944/preprints202610.2113.v1", "authors": "Dyke Mathale ほか", "venue": "Preprints.org", "date": "2026-10-22", "apa": "Mathale, D., & Moloi, K. (2026). Specification Disagreement and Forecast-Transfer Discrepancy in Mortgage Credit Risk: Evidence from Behavioural-History Models. https://doi.org/10.20944/preprints202610.2113.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "住宅ローンの信用リスクモデルで、モデル間の予測の違いよりも、実際の結果とのずれのほうが大きいことを示した。", "p3": "Freddie Macの住宅ローン25万件・1,269万の月次記録で、14の行動履歴回帰モデルとブースティングを比べ、ポートフォリオの事象件数でモデル間の幅と観測値のずれを測った（抄録）。", "p5": "回帰モデルの集合では9つの報告時点すべてで観測とのずれがモデル間の幅を上回り、比の中央値は2.119だった。ブースティングを加えると比の中央値は0.304になった（抄録）。", "fun": "いくつものモデルの予測がそろっていると「当たりそう」と安心しがちだが、全員そろって外れることもある。モデル同士の一致と、現実に当たることは別物だということを、件数のずれという分かりやすい物差しで示している。", "unverified": "ブースティングの具体的な手法と、較正の改善方法は抄録からは確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "AIワークフローの原価計算と予算承認", "title": "PALO FinOps: Evidence-Gated Cost Accounting and Budget Admission for Multi-Model AI Workflows", "url": "https://doi.org/10.2139/ssrn.7651479", "authors": "Fabrizio Degni", "venue": "SSRN", "date": "2026-10-22", "apa": "Degni, F. (2026). PALO FinOps: Evidence-Gated Cost Accounting and Budget Admission for Multi-Model AI Workflows. https://doi.org/10.2139/ssrn.7651479", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "複数のAIモデルを使う業務の費用を、承認済みの支出・未確定の請求・成果と結びつけて管理する原価計算の参照モデルを示した。", "p3": "支出権限、運用上の約束、版管理された請求の証拠、成果に条件づけた測定を分け、「証拠が不完全なら費用0と推定せず指標を出さない」を中心規則とした（抄録）。", "p5": "ローカル実装で回帰・統合テスト63件、インターフェース確認20件、符号付き配賦12,864通りの網羅的検査を行ったが、請求の正確さや実運用での節約効果は示していないと著者が明記している（抄録）。", "fun": "AIを使う費用は「1回いくら」だけでは決まらず、やり直しや人の確認も含めて考えないと本当の原価は分からない。請求が後から届くので「今は安く見える」ことがある、という会計の古典的な問題がAIの時代にも現れている。", "unverified": "実データでの評価はない（抄録）。参照モデルの数式の詳細は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "孤独とブランド資産がAI購買の信頼に与える影響", "title": "Brand Equity Moderates the Effect of Loneliness on Trust and Purchase Intentions in Conversational AI", "url": "https://econpapers.repec.org/RePEc:gtr:gatrjs:jmmr369", "authors": "Kypros Zantis", "venue": "RePEc NEP", "date": "2026-10-19", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEcに登録された抄録を使用", "preprint": true, "short": true, "p1": "会話型AIでの購買で、消費者の孤独感がブランドへの信頼を通じて購買意図に効くかは、ブランド資産の強さで変わることを示した。", "p3": "会話型AIを使う英国の成人378人に、ブランド資産の高低を操作したシナリオを示す調査を行い、PLS-SEMで調整付き媒介モデルを検定した（抄録）。", "p5": "孤独感はブランド信頼に直接は効かなかったが、ブランド資産が孤独感と信頼の関係を調整し、資産の高いブランドほど孤独感が信頼と購買意図に変わりやすかった（抄録）。", "fun": "さみしいときに人は何かとつながりたくなるが、AIを通した買い物でもその気持ちが「よく知られたブランド」への信頼に向かう、という結果は身近な行動の説明になる。孤独が直接ではなく条件つきで効くところが面白い。", "unverified": "効果の大きさ（係数）は抄録からは確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "買物エージェントにどこまで自動購入を任せるか", "title": "Preference Is Not Permission: Personalizing the Auto-Purchase Line in Agentic Commerce", "url": "https://arxiv.org/abs/2610.29216", "authors": "Ryotaro Shimizu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Shimizu, R., HtaungKham, S., & Fan, M. (2026). Preference Is Not Permission: Personalizing the Auto-Purchase Line in Agentic Commerce (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29216", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "買物を代行するAIエージェントが、確認なしにどこまで自動購入してよいかの「線」を個人ごとに学習する課題を提案した。", "p3": "商品情報の十分さ、取り消せるか、普段の価格との比較、緊急性などで条件づけた反実仮想のベンチマークを作り、16の指示調整済みモデルを、利用者役の15人の判断（買わない・確認する・自動で買う）と比べた（抄録）。", "p5": "モデルは適合度が低いときや自ら証拠不足を示したときでも購入に踏み込みすぎた。本人のラベル30〜40個で学んだ浅い学習器は、中央値0.79で本人の線を予測し、評価したどのプロンプトとモデルの組み合わせよりも良かった（抄録）。", "fun": "「好きそうな商品を選ぶ」ことと「勝手に買ってよい」ことは別だ、という題名の通り、任せる範囲は人によって違う。大きなAIより、本人の過去の判断を数十個学ぶ小さなモデルのほうがその人の線を当てられる、という結果が意外だ。", "unverified": "0.79がどの評価指標の値かは抄録からは確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "デジタル銀行の品質と忠誠を満足と信頼が媒介", "title": "Digital Banking Service Quality and Customer Loyalty: The Mediating Role of Customer Satisfaction and the Moderating Role of Customer Trust in Nigeria", "url": "https://doi.org/10.2139/ssrn.7649204", "authors": "Ganiyu Jimoh", "venue": "SSRN", "date": "2026-10-22", "apa": "Jimoh, G. (2026). Digital Banking Service Quality and Customer Loyalty: The Mediating Role of Customer Satisfaction and the Moderating Role of Customer Trust in Nigeria. https://doi.org/10.2139/ssrn.7649204", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ナイジェリアのデジタル銀行について、サービス品質が顧客満足を介して忠誠に効き、顧客の信頼がその関係を調整するという概念枠組みを提案した。", "p3": "期待確認理論や電子サービス品質の理論から、信頼性・効率・可用性・安全とプライバシー・応答性・使いやすさの6次元で品質を定義し、横断調査とSEMによる検証の手順を示した（抄録）。", "p5": "実証データはなく、構成概念の定義、仮説、測定項目、分析手順、結果報告の様式を5つの表で示す枠組みの提案にとどまる（抄録）。", "fun": "スマホの銀行アプリが「止まる」「不安」と感じると、満足度だけでなく銀行を使い続けるかにも響く。この論文はまだ測っておらず、何をどう測れば確かめられるかの設計図を示した段階だが、その設計図自体が仮説の整理になっている。", "unverified": "実証結果はない（抄録）。"}}, {"id": "pr26", "rank": 26, "headline": "小売の品揃え判断を相対貢献利益で偏りなく", "title": "Selling Socks Is Not Buying Stocks&nbsp;De-Biasing Retail Assortment Decisions with Relative Contribution Margin (CMᵢ / Xᵢ)", "url": "https://doi.org/10.2139/ssrn.7644027", "authors": "Ansgar John Brenninkmeijer ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Brenninkmeijer, A. J., Kijl, B., & Venrooy, S. (2026). Selling Socks Is Not Buying Stocks&nbsp;De-Biasing Retail Assortment Decisions with Relative Contribution Margin (CMᵢ / Xᵢ). https://doi.org/10.2139/ssrn.7644027", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "小売の品揃えの判断を、売上や粗利の比率ではなく、制約となる資源あたりの貢献利益（相対貢献利益）で行うべきだと論じた。", "p3": "ドイツの貢献利益計算と制約理論に基づき、品目iの貢献利益CMᵢを、それが使う売場面積・SKU枠・資本などの制約資源Xᵢで割ったCMᵢ/Xᵢを品揃えの基準とし、C&A、ALDI、IKEAなどの例で説明した（抄録）。", "p5": "比率に基づく慣行は、品目別の計算が難しかった時代の便法の名残であり、品目別のデータが得られる今は希少な資源の誤配分につながりうると主張している（抄録）。", "fun": "棚の広さが限られているなら、「よく売れるか」より「棚1マスあたりいくら稼ぐか」で選ぶべき、という考え方は、テストの時間配分で「1分あたり何点取れるか」を考えるのと同じだ。昔はレジのデータがなく計算できなかった、という歴史の説明も面白い。", "unverified": "実データでの検証の有無は抄録からは確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "施設の直接ケア職員が若者の行動をどう扱うか", "title": "Anticipated Caregiving Approaches Towards Youth Behavioral Presentations Among Direct Care Workers in Psychiatric Residential Treatment Facilities: An Experimental Vignette-Based Study", "url": "https://doi.org/10.2139/ssrn.7642358", "authors": "Philip Sternberg Lamb ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Lamb, P. S., Brown, W. J., & McVoy, M. K. (2026). Anticipated Caregiving Approaches Towards Youth Behavioral Presentations Among Direct Care Workers in Psychiatric Residential Treatment Facilities: An Experimental Vignette-Based Study. https://doi.org/10.2139/ssrn.7642358", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "精神科の入所治療施設で直接ケアを担う職員が、若者の症状の現れ方によってどんな関わり方をしようとするかを実験で調べた。", "p3": "米国北東部の施設の職員56人に、内向的・外向的な症状と中程度・高い強度を組み合わせた4つの事例を無作為な順で示し、予想する関わり方と自己効力感を評定させた（抄録）。", "p5": "中程度では差がなかったが、高い強度では外向的な症状のほうが、行動の統制や言葉のきつさが増え、温かさと自己効力感が下がった（抄録）。", "fun": "同じくらい困っている子どもでも、怒りや暴れとして表に出る子と、内にこもる子では、世話をする人の態度が変わってしまう。その差が「症状が強いとき」に出るという結果は、ケアの現場での気づきにつながる。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "SNSは民族間の所得格差を縮めるか", "title": "Can Social Media Reduce the Ethnic Income Gap in China? Evidence from the Chinese General Social Survey", "url": "https://doi.org/10.2139/ssrn.7656386", "authors": "Yunshu Shao", "venue": "SSRN", "date": "2026-10-22", "apa": "Shao, Y. (2026). Can Social Media Reduce the Ethnic Income Gap in China? Evidence from the Chinese General Social Survey. https://doi.org/10.2139/ssrn.7656386", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国で、SNSの利用が少数民族と漢族の所得格差を縮めるかを全国調査で検証した。", "p3": "中国総合社会調査（CGSS）2019年・2021年の就業者9,005人で、SNS利用と労働所得の関係を最小二乗法で推定し、利用頻度、コロナ禍の前後、都市・農村で異質性を調べた（抄録）。", "p5": "SNSを使うだけでは格差は縮まらなかったが、ほぼ毎日使う少数民族は所得が有意に高く、その効果はコロナ禍後に強まり、都市に集中していた（抄録）。", "fun": "スマホを持っているかどうかより、それをどれだけ人とのつながりや仕事の情報に変えられるかが大事、という結果は「デジタル格差」の中身を考え直させる。ただし最小二乗法なので、所得の高い人がSNSをよく使うという逆の向きの可能性も残る。", "unverified": "係数の大きさと、因果の識別の工夫の有無は抄録からは確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "スポーツを孤独への社会的処方とみる概念整理", "title": "Sport Is Social Medicine: A Conceptual Review of Loneliness and Social Health", "url": "https://doi.org/10.21203/rs.3.rs-11072500/v1", "authors": "Cengiz ARSLAN", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "ARSLAN, C. (2026). Sport Is Social Medicine: A Conceptual Review of Loneliness and Social Health. https://doi.org/10.21203/rs.3.rs-11072500/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "スポーツへの参加が孤独を減らし社会的健康を高める仕組みを、生物・心理・社会の経路で整理した概念的レビュー。", "p3": "孤独、社会的つながり、社会的処方、身体活動などの文献を分野横断で物語的に統合し、スポーツ参加・社会的つながり・社会的健康・孤独の関係を表す概念モデルを作った（抄録）。", "p5": "ストレス調整などの生物的経路、自己効力感などの心理的経路、社会的支援・帰属感・地域参加などの社会的経路が相互に結びつくと整理し、循環的なモデルを提案した（抄録）。", "fun": "孤独は「心の問題」と思われがちだが、体を動かすこと、仲間がいること、自信がつくことがぐるぐる回って支え合う、という見方を示している。体育や部活動が健康だけでなく人とのつながりを作る場になる理由を整理した論文。", "unverified": "文献の選び方の基準と、モデルを実証する計画は抄録からは確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "ケニアの調達記録で欠ける情報の決定要因", "title": "What Public Buyers Leave Out: The Determinants of Disclosure Gaps in Kenya's Procurement Records", "url": "https://doi.org/10.6084/m9.figshare.34741482", "authors": "Hilary Ndambiri ほか", "venue": "Figshare", "date": "2026-10-21", "apa": "Ndambiri, H., & Kubowon, P. (2026). What Public Buyers Leave Out: The Determinants of Disclosure Gaps in Kenya's Procurement Records. figshare. https://doi.org/10.6084/M9.FIGSHARE.34741482", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Figshare上の抄録（DataCiteに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ケニアの公共調達の記録で、どの情報がどんな買い手によって公開されずに残るかを項目別に明らかにした。", "p3": "世界銀行ProACTのケニアの契約記録14,181件で、項目ごとの欠落を調べ、製品市場と年の固定効果を入れたロジットで価格の非公開の決定要因を推定した（抄録）。", "p5": "88%の記録は完全だったが、価格の非公開は2018年の4.9%から2021年初めの8.8%に増えた。枠組み契約は価格欠落が21ポイント多く、買い手の違いが契約の特徴の2倍以上の変動を説明し、10機関が非公開の3分の2を占めた（抄録）。", "fun": "「透明性の点数」が高くても、肝心の値段だけがこっそり抜けていることがある。平均点ではなく項目ごとに見ると、特定の少数の機関が抜けを生んでいることが分かる、というのはデータの見方の良い教訓だ。", "unverified": "なし"}}, {"id": "pr31", "rank": 31, "headline": "英国の近隣単位の交通手段別アクセシビリティ", "title": "Neighbourhood-Level Multimodal Population Accessibility Measures for the United Kingdom", "url": "https://doi.org/10.2139/ssrn.7656339", "authors": "Nicholas Patrick Sweeney", "venue": "SSRN", "date": "2026-10-22", "apa": "Sweeney, N. P. (2026). Neighbourhood-Level Multimodal Population Accessibility Measures for the United Kingdom. https://doi.org/10.2139/ssrn.7656339", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "英国の46,844の近隣単位について、自動車と公共交通などの手段別のアクセシビリティ（到達しやすさ）の統一的な指標を作り公開した。", "p3": "自動車の経路とGTFS（公共交通の時刻表データ）から15億件を超える手段別の出発地-目的地の所要時間を求め、指数で重み付けした相対アクセシビリティ指数、手段の十分さの指標、30〜180分で到達できる人口を計算した（抄録）。", "p5": "データと可視化ツールを公開し、建物環境や貧困の公式統計と組み合わせられる形にしたと報告している（抄録）。", "fun": "「駅から近い」「車なら近い」といった便利さを、国全体で同じ物差しで測るのは意外と難しい。地域ごとに車とバス・電車でどれだけ差があるかが分かると、公共交通が届いていない場所が見えてくる。", "unverified": "指数の重みの設定と、検証の方法は抄録からは確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "住宅バウチャーの期限内の住宅確保をモデル化", "title": "The Voucher Clock Is Ticking: Deadline-Constrained Housing Realization Under Recursive Administrative Exposure", "url": "https://doi.org/10.2139/ssrn.7645238", "authors": "Mahana Barbadillo", "venue": "SSRN", "date": "2026-10-21", "apa": "Barbadillo, M. (2026). The Voucher Clock Is Ticking: Deadline-Constrained Housing Realization Under Recursive Administrative Exposure. https://doi.org/10.2139/ssrn.7645238", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "住宅バウチャー（家賃補助券）を受け取っても実際に入居できるまでの過程を、期限・手続き・失敗の経路が競合する確率モデルで表した。", "p3": "5,000世帯×100回の合成シミュレーションで、行政手続きへの曝露が失敗の確率を高める仕組みを入れたモデル（M4）と入れないモデル（M3）を比べた。パラメータは実データに較正されていない（抄録）。", "p5": "入居に至る割合はM3の12.42%に対しM4では5.51%で、差は-6.92ポイントだった。探索段階での脱落は3.92%から40.74%に増え、期限切れは70.30%から37.06%に減った（抄録）。", "fun": "補助券を「配った数」は分かりやすい成果だが、実際に家に住めたかは別の話。期限切れが減ったのは良いことに見えて、実はその前に途中で脱落する人が増えただけ、という読み方の罠を示している。", "unverified": "モデルの時間単位は暦日ではなく、結果は政策効果の実証ではないと著者が明記している（抄録）。"}}, {"id": "pr33", "rank": 33, "headline": "AI導入の語りと実態のずれを規制は抑えるか", "title": "Can Regulation Curb AI Adoption Narrative–Practice Decoupling?An Agent-Based Model of the A-Share Market", "url": "https://doi.org/10.21203/rs.3.rs-11410728/v1", "authors": "ming sun", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "sun, m. (2026). Can Regulation Curb AI Adoption Narrative–Practice Decoupling?An Agent-Based Model of the A-Share Market. https://doi.org/10.21203/rs.3.rs-11410728/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業がAI導入を語る強さと実際の導入の度合いのずれを、規制がどう抑えられるかをエージェントベースモデルで比べた。", "p3": "中国A株3,133社（2021〜2024年）の年次報告書の語り（Talking）と、AI関連の採用・特許（Doing）の差をずれの指標とし、企業・投資家・規制当局のモデルで9つの規制の仕組みを4段階の強さで200回ずつ比べた（抄録）。", "p5": "市場自身の価格による規律は弱く（係数約-0.37）、再犯者への段階的な強化（-2.07）と的を絞った執行（-1.80）が最も強く、空売りと表示だけの開示は効果がなかった（抄録）。", "fun": "「AIを使っています」と言うのは簡単だが、本当に使っているかは採用や特許を見れば分かる、という測り方が巧みだ。罰金の大きさより「繰り返すほど厳しくなる」仕組みが効く、という結果は学校の校則にも通じる。", "unverified": "結果はモデルの行動仮定に依存し、実市場での検証は必要と著者が述べている（抄録）。"}}, {"id": "pr34", "rank": 34, "headline": "仕事の成果・満足がSNSでの自己開示を左右", "title": "Unlocking Online Self-Disclosure: The Roles of Work Performance, Job Satisfaction, and Social Capital", "url": "https://doi.org/10.2139/ssrn.7656365", "authors": "Prajakta Kolte ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Kolte, P., Totty, S., & Brooks, S. (2026). Unlocking Online Self-Disclosure: The Roles of Work Performance, Job Satisfaction, and Social Capital. https://doi.org/10.2139/ssrn.7656365", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "職場での成果と仕事の満足が、SNSでの自己開示（量・深さ・正直さなど）にそれぞれ違う形で関わることを示した。", "p3": "資源保存理論に基づき、SNSを使う常勤の従業員309人の調査データを構造方程式モデリングで分析し、社会関係資本の調整効果も調べた（抄録）。", "p5": "成果の高い人は開示が正直になる一方で量と深さは減り、満足の高い人は量・深さ・意図・肯定性が増えた。社会関係資本は成果と深さの関係を弱め、満足と量・深さの関係を強めた（抄録）。", "fun": "仕事ができる人ほどSNSで語ることを選ぶ、満足している人ほどよく語る、という違いは、「得たい」気持ちと「守りたい」気持ちのバランスで説明される。何をどれだけ話すかにも、その人の手持ちの資源が表れているという見方が面白い。", "unverified": "係数の大きさは抄録からは確認できなかった。横断データのため因果の向きは確定できない。"}}, {"id": "pr35", "rank": 35, "headline": "共有作業空間が複数LLMレビューの独立性を損なう", "title": "Contaminated by Collaboration: Shared Workspaces Can Fabricate Severe-Defect Recall in Multi-Agent Code Review", "url": "https://doi.org/10.6084/m9.figshare.34747932", "authors": "Jiahao Hu", "venue": "Figshare", "date": "2026-10-22", "apa": "Hu, J. (2026). Contaminated by Collaboration: Shared Workspaces Can Fabricate Severe-Defect Recall in Multi-Agent Code Review. figshare. https://doi.org/10.6084/M9.FIGSHARE.34747932", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Figshare上の抄録（DataCiteに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLM同士のコードレビューで、共有された作業フォルダを通じて2人目のレビュアーが1人目の発見を写してしまう「汚染」が起きた事例を再構成した。", "p3": "共有の隠しフォルダに1人目が書いたメモと検証スクリプトを、52秒後に起動した2人目が読み、同じ7件の指摘を同じ順で報告した経緯を追跡し、新しいフォルダでの再実行と比べた（抄録）。", "p5": "重大欠陥の再現率は漏洩ありで100%、隔離で0%だったが、全体のF1は36.8%から33.3%へ3.5ポイントしか動かず、雑音と見分けにくかった（抄録）。", "fun": "2人の採点者が別々に見ているはずが、実は同じメモを見ていた、という試験のカンニングのような話。全体の点数ではほとんど差が出ないのに、一番大事な欠陥の発見だけが写されていた、というのがこわいところだ。", "unverified": "単一の実行どうしの比較で、実行時間や推論設定も異なっていたと著者が述べている（抄録）。"}}, {"id": "pr36", "rank": 36, "headline": "複数エージェントの構成を貢献度で探索", "title": "Credit Where Credit Is Due: Contrastive Attribution Topology Search for Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.29292", "authors": "Fabian Tritthart ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Tritthart, F., & Zehle, T. (2026). Credit Where Credit Is Due: Contrastive Attribution Topology Search for Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29292", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント系で、どのエージェントが成績に貢献しているかを実行記録の比較で割り出し、小さく強いチームを探す方法（CATS）を提案した。", "p3": "専門エージェントを含む固定の上位グラフの中で、LLMの評価役が候補構成どうしの実行記録を比べて各エージェントに貢献度を割り当て、それに基づいて辺を更新し弱いエージェントを刈り込む（抄録）。", "p5": "小さな公開モデルで、BigCodeBenchの平均正解率を点数だけを使う探索より5.3ポイント上げ、展開時のトークンを54%減らした。プロンプト汚染の試験では3回とも敵対的なエージェントをすべて除いた（抄録）。", "fun": "グループ課題で「誰が一番役に立ったか」を最終点だけから当てるのは難しいが、メンバーを入れ替えたときの作業記録を比べれば分かる、という発想。悪さをするメンバーまで見つけ出せるのが面白い。", "unverified": "評価役のLLMの種類と、貢献度の計算式は抄録からは確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "競技ディベートで戦略を学ぶ協調エージェント", "title": "SynerMind: Cognitive Synergic Agents for Adaptive Strategy Learning in Competitive Debate", "url": "https://doi.org/10.2139/ssrn.7656180", "authors": "Mengqi Chen ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Chen, M., Guo, B., Liu, Y., Liu, J., Wang, H., Liang, Y., & Yu, Z. (2026). SynerMind: Cognitive Synergic Agents for Adaptive Strategy Learning in Competitive Debate. https://doi.org/10.2139/ssrn.7656180", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLM本体を微調整せずに、競技ディベートで相手に応じて戦略を変えるプロンプトの制御を学習する枠組み（SynerMind）を提案した。", "p3": "計画・実行・評価のサイクルに沿って、軽い計画器、固定した文章生成器、外部の評価器に分け、その相互作用を「協働マルコフ決定過程」として定式化し、結果のフィードバックから状態に応じた戦略を学ぶ（抄録）。", "p5": "英国議会式ディベートで、強い単一のLLMや固定的な多エージェントの手法を、自動評価と人による評価の両方で上回ったと報告している（抄録）。", "fun": "ディベートでは、自分の主張の筋を通しつつ相手の最新の発言にも答えなければならない。話す役と作戦を立てる役を分け、作戦役だけを勝ち負けから学ばせる、という分業の発想は、人間のチームでの役割分担にも似ている。", "unverified": "評価の具体的な数値と比較対象のモデル名は抄録からは確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "LLMの感情表出は実在か架空かの枠付けで変わる", "title": "Affective Readout Depends on Real-versus-Fictional Referent Framing in Large Language Models: A Referent-Controlled Evaluation", "url": "https://doi.org/10.2139/ssrn.7649338", "authors": "Keito Inoshita", "venue": "SSRN", "date": "2026-10-21", "apa": "Inoshita, K. (2026). Affective Readout Depends on Real-versus-Fictional Referent Framing in Large Language Models: A Referent-Controlled Evaluation. https://doi.org/10.2139/ssrn.7649338", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLMが「感情」を報告するとき、その読み取りの精度は自分を指すかどうかではなく、実在のAIか架空の人物かという枠付けで変わることを示した。", "p3": "活性化空間に同じ介入を加え、続きの文を同一に保ったまま指示対象だけを入れ替える設計で、文法上の人称・自己・実在か架空かを分けて、26モデルを調べた（抄録）。", "p5": "架空のAIを演じる場合は人間の登場人物を演じる場合と区別できず、実在の枠付けのAIでは調べた9モデルすべてで識別性能が低かった。報告を許す指示でこの非対称はゼロに近づいた（抄録）。", "fun": "AIに「今どんな気持ち？」と聞いて返ってくる答えを、心の中をそのまま読んだものと考えてよいのか。答えは聞き方（実在のAIとして話すか、物語の登場人物として話すか）で変わる、という結果は、測定には必ず手続きがあることを思い出させる。", "unverified": "識別性能の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "LLMエージェント失敗の早期警告の比較", "title": "Cohort Divergence Does Not Consistently Outperform Single-Rollout Judging for Early Warning of LLM Agent Failure", "url": "https://doi.org/10.20944/preprints202610.2173.v1", "authors": "Ejiga Peter Ojonugwa Oluwafemi ほか", "venue": "Preprints.org", "date": "2026-10-22", "apa": "Ojonugwa Oluwafemi, E. P., Emakporuena, D., Kadiri, C., & Rahman, M. M. (2026). Cohort Divergence Does Not Consistently Outperform Single-Rollout Judging for Early Warning of LLM Agent Failure. https://doi.org/10.20944/preprints202610.2173.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLMエージェントの失敗を早めに予測する信号として、同じ課題の別の試行との進み具合のずれは、単独の試行の評価より一貫して優れてはいないことを示した。", "p3": "5つのモデル系列・5つの課題分野の3,421試行で、k手目までの目標進捗の評価が兄弟試行からどれだけずれるかを測り、評価役の指示を正しい課題目的に直して再評価した（抄録）。", "p5": "当初は小売で統合AUROC 0.73だったが、評価役に目的の代わりに課題IDが渡っていた誤りを直すと、小売と航空で0.47〜0.52の偶然水準に落ちた。単独試行の評価は10組合せ中8つで点推定が高かった（抄録）。", "fun": "最初は「効く」と見えた方法が、採点役に渡していた指示の誤りを直したら効かなくなった、と正直に報告している。結果そのものより、AIを評価するAIへの指示が研究の結論を左右する、という教訓が大きい。", "unverified": "中止シミュレーションの費用の仮定の詳細は抄録からは確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "マクロ経済の多主体強化学習を数秒で", "title": "JaxMARL-BC: Multi-Agent Reinforcement Learning for Macroeconomic Modelling, in Seconds", "url": "https://arxiv.org/abs/2610.28907", "authors": "Daniele Montagnani ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Montagnani, D., Coletta, A., Mira, A., & Glielmo, A. (2026). JaxMARL-BC: Multi-Agent Reinforcement Learning for Macroeconomic Modelling, in Seconds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28907", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "深層強化学習の家計を多数入れたマクロ経済モデル（MARL-BC）を、数秒で学習できる高速シミュレータを公開した。", "p3": "JAXで高速化し、既知のDSGE（動学的確率的一般均衡）モデルの極限と一致することを確かめ、計算費用の法則で規模の拡大を特徴づけ、資本収益の異質な拡張モデルの較正を試した（抄録）。", "p5": "参照実装より75〜724倍速く、20万の独立に学習する家計まで扱え、以前は1か月以上かかった較正を2時間で行えたと報告している（抄録）。", "fun": "経済学者が信頼する教科書的なモデルと一致することを確かめてから、何十万もの「学習する家計」を動かす、という慎重な手順がよい。速くなると、試行錯誤の回数が増え、研究の進め方そのものが変わる。", "unverified": "なし"}}, {"id": "pr41", "rank": 41, "headline": "多粒径の土砂輸送と分級の計算と実験", "title": "Computational and experimental study of multi-grain-size sediment transport and sorting process", "url": "https://arxiv.org/abs/2610.29072", "authors": "Mehrshad Gholami Anjiraki ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Anjiraki, M. G., Narh, G., Craig, J., Aksen, M. M., Shapourmiandouab, S., Farhadzadeh, A., Xiang, T., & Khosronejad, A. (2026). Computational and experimental study of multi-grain-size sediment transport and sorting process (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29072", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "川床の土砂を複数の粒径に分けて追跡し、粒の大きさによる分級（並び分け）まで再現できる数値計算の枠組みを示した。", "p3": "ラージ・エディ・シミュレーション（乱流の大きな渦を直接計算する手法）に多粒径の土砂輸送モジュールを結合し、多粒径の材料を使った水路実験の粒度分布と床高で検証した（抄録）。", "p5": "一様粒径のモデルと比べて、最大洗掘深の誤差を37.98%から3.83%に、最大堆積高の誤差を48.35%から11.54%に下げた。蛇行河川では粗い粒が洗掘部、細かい粒が寄州に集まる模様が現れた（抄録）。", "fun": "川原を歩くと、場所によって大きな石が多い所と砂ばかりの所がある。それは流れが粒を大きさごとに選り分けるからで、粒の大きさを1種類と仮定する計算ではこの現象が出ず、誤差も大きくなる。", "unverified": "計算の格子や粒径の階級数は抄録からは確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "岩盤亀裂の交差部の局所損失を格子ボルツマンで", "title": "Three dimensional momentum redistribution and local hydraulic loss at rock fracture intersections based on Lattice Boltzmann method", "url": "https://doi.org/10.2139/ssrn.7656292", "authors": "Jiacheng Ma ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Ma, J., Tian, L., Zhu, G., Huang, T., Zheng, X., & Ma, J. (2026). Three dimensional momentum redistribution and local hydraulic loss at rock fracture intersections based on Lattice Boltzmann method. https://doi.org/10.2139/ssrn.7656292", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "岩盤の亀裂が交わる点で生じる局所的な水頭損失を、3次元の格子ボルツマン法で調べ、流れの構造との関係を示した。", "p3": "D19速度のMRT格子ボルツマンモデルで、3つの流入出の配置、4つの向き、2種類の壁、レイノルズ数10〜200の計120ケースを計算し、エネルギー収支から交差部の損失を推定した（抄録）。", "p5": "局所損失は形状ごとのForchheimer式に従い（R²=0.955〜0.999997）、流れ場の4つの記述子を加えると形状を除いた交差検証のR²が0.720から0.920に上がった（抄録）。", "fun": "水道管の曲がり角で水の勢いが落ちるのと同じく、岩の割れ目が交わる所でも流れが渋滞する。その渋滞の大きさが、形だけでなく、横向きの流れや速さのむらといった流れ方で説明できる、というのが面白い。", "unverified": "結果は計算した範囲の形状に限られると著者が述べている（抄録）。"}}, {"id": "pr43", "rank": 43, "headline": "物理情報付き極限学習機の拘束条件の扱い", "title": "From Soft to Hard Constraints in Physics-Informed Extreme Learning Machines: Analysis and Algorithms", "url": "https://doi.org/10.21203/rs.3.rs-11169466/v1", "authors": "Ruonan Zhai ほか", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Zhai, R., Shi, X., Xiong, X., Zhang, Z., & You, M. (2026). From Soft to Hard Constraints in Physics-Informed Extreme Learning Machines: Analysis and Algorithms. https://doi.org/10.21203/rs.3.rs-11169466/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "物理情報付き極限学習機（PIELM）で、境界条件を試行関数に直接埋め込むことで、境界誤差を機械精度まで消し、誤差を大きく下げた。", "p3": "隠れ層の重みを乱数で固定して偏微分方程式を1回の最小二乗で解くPIELMで、従来の「境界の式を並べて足す」方式がグラム行列の固有値の偏りで境界の影響を弱めることを示し、持ち上げ項と境界でゼロになる距離関数で境界を厳密に満たす形にした（抄録）。", "p5": "Helmholtz、Poisson、Navier–Stokes、波動、非線形反応の7つのベンチマークで、境界残差は恒等的にゼロとなり、相対L²誤差は最大で7桁小さくなった（抄録）。", "fun": "「方程式も境界条件も、なるべく満たして」と頼むと、両方が少しずつずれる。境界条件を最初から必ず満たす形の関数だけを考えれば、残りは方程式だけに集中できる。条件の入れ方を変えるだけで誤差が1000万分の1になるのは驚きだ。", "unverified": "計算時間の具体的な比較は抄録からは確認できなかった。"}}, {"id": "pr44", "rank": 44, "headline": "熱・多孔質弾性の分離型並列解法", "title": "Parameters Robust Parallelizable Iterative Decoupled Algorithms for Thermo-Poroelasticity with Nonlinear Convective Transport", "url": "https://arxiv.org/abs/2610.29668", "authors": "Ziliang Li ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Li, Z., & Li, J. (2026). Parameters Robust Parallelizable Iterative Decoupled Algorithms for Thermo-Poroelasticity with Nonlinear Convective Transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29668", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "非線形の対流輸送を含む熱・多孔質弾性（温度・間隙水・変形の連成）の問題を、並列に解ける反復分離アルゴリズムをいくつか示した。", "p3": "補助変数でポアソン・ロッキング（ほぼ非圧縮で解が固まる数値上の病理）を避ける4場の定式化にし、線形化と分離を反復で行い、安定化項で極端なパラメータでも頑健になるようにした（抄録）。", "p5": "誤差評価と収束を証明し、極端なパラメータ設定の数値実験で各アルゴリズムの効率と頑健性を比べたと報告している（抄録）。", "fun": "温度、水、変形が互いに影響し合う地盤の問題を一度に解くのは大変なので、別々に解いて行き来させる。その行き来がどんな条件でも必ず収束することを数学で保証している点が、地味だが大切な貢献だ。", "unverified": "具体的な数値結果は抄録からは確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "気候変動と森林管理が落石防護に与える影響", "title": "Modelling the Long-Term Effects of Climate Change and Silvicultural Systems on Rockfall Protection: A Case Study from the Slovenian Alps", "url": "https://doi.org/10.21203/rs.3.rs-11202013/v1", "authors": "Tine Ferk ほか", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Ferk, T., Fidej, G., Mutterer, S., Blattert, C., Cailleret, M., Schweier, J., Hiltner, U., Rozman, A., & Diaci, J. (2026). Modelling the Long-Term Effects of Climate Change and Silvicultural Systems on Rockfall Protection: A Case Study from the Slovenian Alps. https://doi.org/10.21203/rs.3.rs-11202013/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "気候変動と森林施業の違いが、落石を防ぐ森の働きに長期的にどう影響するかをシミュレーションで示した。", "p3": "スロベニアの防護林で、施業なし・択伐・傘伐の3つと現在・将来の気候を組み合わせ、森林モデルForClimで200年の林分を計算し、その構造を落石モデルRockyfor3Dに渡した（抄録）。", "p5": "落石の運動エネルギーは森がないときと傘伐の更新初期に最大で、200年後は傘伐が平均で最も防護したが局所の最大エネルギーも最大だった。気候変動は施業の順位を変えなかった（抄録）。", "fun": "森は落ちてくる石を木の幹で受け止める「天然の防護柵」だ。どの木をいつ切るかで、何十年も先の守りの強さが変わる。平均では強くても場所によって穴ができる、という結果は、平均だけを見る危うさを示している。", "unverified": "エネルギーの具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr46", "rank": 46, "headline": "多孔質流れの鞍点系での量子的な不確実性評価", "title": "Coefficient-free Block Encodings of Saddle-point Flow: Coherent Uncertainty Quantification at Uniform Depth and the Quantum Crossover", "url": "https://doi.org/10.2139/ssrn.7650679", "authors": "Muhammad Javed Bukhari", "venue": "SSRN", "date": "2026-10-22", "apa": "Bukhari, M. J. (2026). Coefficient-free Block Encodings of Saddle-point Flow: Coherent Uncertainty Quantification at Uniform Depth and the Quantum Crossover. https://doi.org/10.2139/ssrn.7650679", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "多孔質の流れの鞍点系を量子線形ソルバーで解くとき、係数の大きさに左右されない符号化を作り、ランダムな透水係数の下での不確実性評価を一定深さの回路で行えるようにした。", "p3": "不定値の連成を正負の平方に分ける符号付き分解で、1つの疎な因子から作用素とパラメータに頑健なノルムを作り、多重レベルの枠と組み合わせて正規化に係数が入らない符号化にした（抄録）。", "p5": "2次元Darcy流と Biot 多孔質弾性で条件数に当たる量の上界を証明し、透水係数比10¹²の3次元Darcy流で562を測った（通常の条件数は1.7×10¹⁴）。古典的な最良の手法との交差点は相対精度7.3×10⁻⁶・未知数4.9×10⁹と見積もった（抄録）。", "fun": "量子計算機で方程式を解くとき、問題の「解きにくさ」が計算時間を決める。地盤のように透水性が場所で1兆倍も違う問題でもその解きにくさを抑えられる、という工夫で、量子計算がいつ古典計算を追い越すかを具体的な数で見積もっている。", "unverified": "量子回路の実機での実行の有無は抄録からは確認できなかった。"}}, {"id": "pr47", "rank": 47, "headline": "構造部材の予知保全のためのAIデジタルツイン", "title": "AI-Driven Digital Twin for Real-Time Predictive Maintenance of Structural Components", "url": "https://doi.org/10.20944/preprints202610.2128.v1", "authors": "Andrei Radu Muresan ほか", "venue": "Preprints.org", "date": "2026-10-22", "apa": "Muresan, A. R., & Balc, N. (2026). AI-Driven Digital Twin for Real-Time Predictive Maintenance of Structural Components. https://doi.org/10.20944/preprints202610.2128.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "有限要素解析で作った合成データで学習したランダムフォレストを代理モデルとして、部材の疲労寿命を実時間で監視する枠組みを示した。", "p3": "7つの荷重ケースの重ね合わせで作った15,000の合成荷重シナリオで学習し、6チャンネルのひずみゲージから相当応力を予測し、Palmgren–Miner則で累積疲労損傷を追跡する。自動車のサスペンションのロアアームで実証した（抄録）。", "p5": "未知の試験データでR²=0.9943、MAE=28.76 MPa、RMSE=37.58 MPaだった。模擬走行では高速道路の走行で損傷がほぼゼロ、繰り返しの衝撃で30秒に寿命の5〜8%を消費した（抄録）。", "fun": "部品が「あとどれくらいもつか」を、走りながら少数のひずみ計で見積もる仕組み。重い計算を事前に済ませておき、走行中は軽い代理モデルで答えを出す、というのはデジタルツインの基本的な考え方だ。", "unverified": "実車での検証は抄録からは確認できなかった（模擬走行のみ）。"}}, {"id": "pr48", "rank": 48, "headline": "監査の質がESG開示の信頼性を高めるか", "title": "External Audit Quality, Corporate Governance and ESG Disclosure Credibility: Moderating Evidence from Listed Firms in Sub-Saharan Africa", "url": "https://doi.org/10.21203/rs.3.rs-11118896/v1", "authors": "abdul razak abdulai ほか", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "abdulai, a. r., Yakubu, I. N., & Doe-Dartey, R. k. (2026). External Audit Quality, Corporate Governance and ESG Disclosure Credibility: Moderating Evidence from Listed Firms in Sub-Saharan Africa. https://doi.org/10.21203/rs.3.rs-11118896/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "サハラ以南アフリカの上場企業で、企業統治と外部監査の質がESG開示の信頼性を高めるかを検証し、有意な効果は見られなかった。", "p3": "ガーナ・ケニア・ナイジェリア・南アフリカの157社・1,553企業年（2015〜2024年）を手で集め、5指標の統治指数と、範囲・柱間の均衡・年ごとの一貫性からなる開示信頼性指数を作って回帰した（抄録）。", "p5": "統治と開示信頼性の関係は正だが有意でなく（β=0.121、p=.130）、監査の質の調整効果も有意でなかった（β=−0.046、p=.503）。レバレッジは正、インフレとGDP成長率は負に関連した（抄録）。", "fun": "立派な統治の仕組みを形だけ整えても、制度の土台が弱い国では中身が伴わない、という「形と実態の切り離し」を数字で示している。効果がなかったことをきちんと報告する研究は、効果があった研究と同じくらい大切だ。", "unverified": "なし"}}, {"id": "pr49", "rank": 49, "headline": "標準化への参加とサプライチェーンの強靭性", "title": "Corporate participation in standard setting and supply chain resilience", "url": "https://doi.org/10.2139/ssrn.7656388", "authors": "Yao Deng ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Deng, Y., Huang, J., Liu, J., & Chen, Z. (2026). Corporate participation in standard setting and supply chain resilience. https://doi.org/10.2139/ssrn.7656388", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業が標準づくりに参加するほど、サプライチェーンの強靭性（変化への耐性と適応力）が高いことを中国の上場企業で示した。", "p3": "2007〜2023年の中国A株上場企業49,490企業年で、作成に関わった標準の数と強靭性の総合点の関係を推定し、都市×年の固定効果、傾向スコアマッチング、操作変数で頑健性を確かめた（抄録）。", "p5": "関係は正で頑健だった。国・業界・地方・団体の標準では正、企業内標準では有意でなく、強靭性のうち回復の次元とは有意な関係がなかった。管理費や取引費用の低下、開示の質の向上とも関連した（抄録）。", "fun": "「業界のルールづくり」に加わる会社は、ルールを先に知り、取引先とも話が通じやすくなるので、トラブルに強いサプライチェーンを持てる、という説明が面白い。ただし、もともと強い会社が参加しているだけという可能性を、いくつもの方法で確かめている。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "合理的不注意の消費者の需要推定（RI-BLP）", "title": "Demand Estimation for Rationally Inattentive Consumers", "url": "https://arxiv.org/abs/2610.29600", "authors": "Ruolei Zhu", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Zhu, R. (2026). Demand Estimation for Rationally Inattentive Consumers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29600", "why": "集計シェアからの需要推定の標準であるBLPに合理的不注意を組み込み、価格の内生性と嗜好の異質性を保ったまま推定できるようにした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、モデル、推定の概要、ツナ需要の応用の節、結論）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "集計された市場シェアから需要を推定する標準のBLPモデルに、消費者が情報を集める量を自ら選ぶ「合理的不注意」を組み込んだRI-BLPを作り、推定量の一致性と漸近正規性を示した。", "p2": "BLPは消費者が効用に関わる製品特性をすべて知っていると仮定するが、選択肢の多い市場ではこの仮定は強い。既存の合理的不注意の選択モデルは個票データを使い、集計シェアからは推定できなかった（§1）。", "p3": "効用を、選択前に見える部分u₀（価格や一部の特性、消費者ごとのランダム係数）と、費用をかけて学ぶ潜在部分u₁に分ける。情報費用をシャノン相互情報量で測るMatějka–McKayの枠組みでは、最適な選択確率は事前の選択確率で重みづけした一般化ロジットになる（式2〜4）。シェアの逆算の一意性の条件を示し、操作変数のモーメントとシェア制約を使うシミュレーションGMM推定量を作った（§3〜4）。", "p4": "モンテカルロ実験で係数の回復と信頼区間の被覆率を調べ、Dominick'sのツナ缶のスキャナーデータ（売上上位20品目、234週、4,680の製品×週）でロジットと比べた（§6〜7）。", "p5": "平均の自価格弾力性はロジット−0.491、RI-BLP−0.532で、平均は近いが分布はRI-BLPのほうが広かった（§7.3、図1）。RI-BLPでは、値上げが似た製品の需要まで減らし、外部選択肢（どれも買わない）へより多く流れるという代替のパターンが現れた（§8）。すべての30品目が売れた107週に絞ると、平均弾力性はRI-BLPで−1.483、ロジットで−1.527に変わった（§7.3）。", "p6": "著者は、選好の異質性を表す分散パラメータは平均の係数より精度が低く、一部に下方バイアスがあること、個々の転換率は数値積分の精度に敏感なことを挙げている（§8）。解釈：情報費用λを既知の定数として固定しているので、その値の選び方が結果に効く可能性がある。", "fun": "スーパーで全部のツナ缶の中身を調べてから買う人はいない。どこまで調べるかも消費者の「選択」だと考えると、値上げで客が似た商品に流れず「買わない」に回る、という通常のモデルとは違う動きが説明できる。平均の数字が同じでも、客の流れ方は違いうる。", "unverified": "モンテカルロの具体的な数値（表）と交差弾力性の表は読んでいない。"}}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "コンジョイント実験の常時有効な推論", "title": "Anytime-Valid Inference in Conjoint Experiments", "url": "https://arxiv.org/abs/2610.28979", "authors": "Daniel Molitor ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Molitor, D., Gosciak, J., & Lindon, M. (2026). Anytime-Valid Inference in Conjoint Experiments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28979", "why": "データが順次届くオンライン実験で、多数の推定対象ごとに目標精度に達した時点で止められる、いつでも有効な推論を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、常時有効なクラスタ頑健推論の節、実証結果の節、考察）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "コンジョイント実験の多数の推定対象について、データを集めながら何度見ても有効な「常時有効（anytime-valid）」な信頼系列とp値を作り、目標の精度に達した時点で調査を止めて標本を節約できるようにした。", "p2": "コンジョイント実験では効果の大きさが異なる多くの推定対象を同時に扱うので、事前の標本サイズ計算は難しい。固定標本の検定で途中のデータを何度も見ると偽陽性が増える（§1）。", "p3": "多くの推定対象（AMCEなど）は、母集団の最小二乗回帰係数の線形対比として表せることを示し、回答者単位のクラスタ頑健なWald統計量Q_Gを閉じた式で変換してe過程E_G（証拠の強さ）を作った（式11、Lindon 2026の定理を適用）。E_G≥1/αで棄却し、p_G=min{1,1/E_G}は常時有効なp値になる（式12）。", "p4": "候補者選択の模擬実験、帰無仮説の下での1,000回の反復、先行研究のレビューに基づく効果量・標本規模の格子での500回の反復、欧州15か国の亡命希望者のコンジョイント（18,021人）の再分析で評価した（§6）。", "p5": "10人ごとに結果をのぞく従来の検定は、2,500人までに単一の検定で約35%、同時検定で38%の誤検出を起こしたが、常時有効な方法は5%未満に保った（§6.2、図2）。中程度の効果でも途中で止まる確率は多くの場合50%以上、平均の標本節約は25%を超えた（§6.3、図3）。真の効果が想定より25%大きいだけで平均20%超を節約した（§6.4）。亡命希望者の研究では、27のAMCEのうち従来のCIは24、信頼系列は20を0と区別し、主要な結論は保たれた（§6.5）。", "p6": "信頼系列は常時有効である代わりに幅が広く、境界的な証拠の推定は有意でなくなる（§6.5）。理論は回答者が独立同分布で、クラスタ得点の強いガウス近似が成り立つことを仮定する漸近的なものである（§4.2）。", "fun": "アンケート実験で「結果がはっきりしたらそこでやめたい」と思うのは自然だが、途中で何度ものぞくと偶然の差を本物と見誤りやすい。のぞいても大丈夫な物差しを使えば、予定の4分の1以上の回答を節約できることが多い。調査費の節約と正直さを両立する方法だ。", "unverified": "付録Dの格子全体の結果と、付録Eの被覆率の数値は読んでいない。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "差の差分析の共変量の共通因果性を検定する", "title": "Testing Common Causality of Covariates: Evidence from Private-Sector Ban-the-Box Policies", "url": "https://arxiv.org/abs/2610.29148", "authors": "Sunny R. Karim", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Karim, S. R. (2026). Testing Common Causality of Covariates: Evidence from Private-Sector Ban-the-Box Policies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29148", "why": "差の差分析で共変量の係数が地域・時点で一定かを検定する方法を示し、雇用の犯歴欄廃止政策に適用した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、仮定、CCC検定、Ban-the-Boxの応用の結果と表9、結論）を読んだ。シミュレーションの表と証明は読んでいない", "preprint": true, "p1": "差の差分析（DID）に共変量を入れるとき、共変量の係数が地域・時点で一定という「共変量の共通因果性（CCC）」の仮定を、処置前の未処置データで検定する方法を作り、適切な共変量の入れ方を選べるようにした。", "p2": "共変量を「どれを」入れるかだけでなく「どう」入れるかでもDIDの推定は偏りうる。標準の二方向固定効果（TWFE）や傾向スコアに基づくDIDは、係数が地域や時点で違う（CCC違反）とATT（処置群の平均処置効果）を正しく識別できないことがある（§1）。", "p3": "未処置の地域×時点のセルだけを使い、共変量と地域・時点のダミーの交差項を持つ補助回帰（式99）と、係数を共通に制限した回帰（式102）をWald検定で比べる。まず二方向の共通性を検定し（自由度K(U−1)）、棄却されたら地域だけ・時点だけの変動をHolm法で検定して、統合DID（DID-INT）の4つの仕様から選ぶ（§3.2〜3.3）。", "p4": "理論的に各仕様の一致性と効率を比べ、モンテカルロ実験で検定のサイズと検出力を調べ、米国の民間部門の雇用での犯歴欄の廃止（Ban-the-Box）政策の賃金と職の質への効果に適用して、TWFE・CS-DID・BJSと比べた（§4〜5）。", "p5": "正しく特定したDID-INTは一致し、制限しすぎると偏り、条件付き等分散の下では不必要に柔軟だと効率が落ちることを示した（§1）。Ban-the-Boxでは対数賃金と高い職域の両方で二方向の共通性が強く棄却され（例：対数賃金でχ²=12555.790、自由度1370、p<0.001）、二方向のDID-INTが選ばれた（表9）。賃金への効果は5%水準で正、高い職域への効果は10%水準で正で、後者はTWFEとCS-DIDでは有意でなかった（§6）。", "p6": "著者は、CCC検定は平行トレンドの検定ではないこと、標本抽出は独立同分布を仮定しクラスタ依存への拡張は未開発であること、不均一分散の下では制限した仕様と二方向の仕様の効率の順位は一般に決まらないことを述べている（§2、§3.2）。", "fun": "「学歴が賃金に与える効果」が州や年によって違うのに、どこでも同じと仮定して計算すると、政策の効果を見誤ることがある。その違いを政策が始まる前のデータで確かめてから、計算の仕方を選ぶという手順を示した。地味だが、因果推論の結論の信頼性を支える工夫だ。", "unverified": "モンテカルロ実験の数値結果（§4）と、効果の推定値の大きさは読んでいない。"}}, {"id": "pn04", "rank": 4, "field": "経営学", "headline": "自動配送の利用を促す割引の無作為化実験", "title": "Incentivizing Adoption of Autonomous Delivery: A Randomized Field Experiment", "url": "https://doi.org/10.2139/ssrn.7650978", "authors": "Shuai Hao ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Hao, S., Zheng, Z., Xu, Y., & Ghose, A. (2026). Incentivizing Adoption of Autonomous Delivery: A Randomized Field Experiment. https://doi.org/10.2139/ssrn.7650978", "why": "AIによる配送サービスの継続利用を、単段階・多段階の値引きでどう促せるかを大規模なフィールド実験で比べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "自動運転による配送のようなAIを使った消費者向けサービスで、初回利用者を定価で使い続ける利用者に変えるには、1回だけの割引より、回数を区切った段階的な割引のほうが効くことを大規模なフィールド実験で示した。", "p2": "AIサービスの普及では、試してもらうだけでなく定価で使い続けてもらうことが課題で、値引きは試用を促す一方で定価の需要を食う（共食い）おそれがある（抄録）。", "p3": "世界的なEC基盤と協力し、自動配送を使ったことのない顧客26,276人を、対照群、1回だけの割引（単段階）群、有限回の割引の連続（多段階）群に無作為に割り当てた（抄録）。", "p4": "初回の試用、割引期間中の定価注文、割引終了後の定価での利用を比べ、割引の深さ、過去の自分での受け取り頻度、配送の失敗による効果の違いも調べた（抄録）。", "p5": "割引全体では試用と終了後の定価利用が増えたが、期間中の定価注文は共食いされた。単段階は試用を促したが共食いし、終了後の有意な効果はなかった。多段階は有意に多くの定着を生み、期間中にも定価注文を増やし、終了後も高い定価利用を保った。多段階の中では平均の割引が深いほど定価での定着は低く、配送の失敗は定着を弱めた（抄録）。", "p6": "抄録からは、効果の大きさと、追跡期間の長さは分からない。解釈：1つの基盤・1種類のサービスの実験なので、他のAIサービスへの一般化には注意が要る。", "fun": "新しいサービスを試してもらうとき、「1回だけ大幅割引」より「何回か少しずつ割引」のほうが習慣になりやすい。しかも割引が大きすぎると、割引が終わったら使わなくなる。そして、配送が失敗すると割引の効果も消える。値引きは信頼できるサービスの代わりにはならない。", "unverified": "各群の効果の大きさと追跡期間は抄録からは確認できなかった。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "AIチャットは従来の検索に取って代わるか", "title": "Can AI Chat Replace Traditional Search? Evidence from a RAG-based Live Events Experiment", "url": "https://arxiv.org/abs/2610.28639", "authors": "Rakesh Allu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Allu, R., & Kagan, E. (2026). Can AI Chat Replace Traditional Search? Evidence from a RAG-based Live Events Experiment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28639", "why": "事前登録した実験で、フィルタ型検索と生成AIチャットなどを比べ、利用者の行動と検索結果への影響を測った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（研究デザイン、結果の予告、標本、回帰結果と表1、メカニズム、実務的含意の節）を読んだ", "preprint": true, "p1": "事前登録した報酬付きのオンライン実験で、イベント検索をAIチャットだけにすると、従来のフィルタ型検索より選んだイベントの価値が下がり時間もかかる一方、フィルタにAIの検索窓を重ねる併用型はほぼ費用なしで使えることを示した。", "p2": "会話型AIが検索に組み込まれつつあるが、それが利用者の検索行動と結果をどう変えるか、チャットで従来の検索を置き換えるべきか併用すべきかは分かっていなかった（§1）。", "p3": "ニューヨークの約2か月分の数千件のチケットマスターのイベントを集めた目録を、フィルタ型、RAG（目録だけに基づいて答える検索拡張生成）のチャット型、検索窓をLLMにした併用型の3群で被験者間比較した。選んだイベントの価値はBDM法（本当の評価を言うのが最適な報酬付きの測り方）で測り、一部の参加者に実際にチケットを渡した（§1.1、§3）。", "p4": "除外後の362人（フィルタ104、チャット156、併用102）で、価値・結果への満足・検索時間・過程への満足を共変量つきで回帰した。チャットの応答モデル（gpt-4.1-mini、gpt-5.2、gpt-5.4）も変えた（§3.1、§4.2）。", "p5": "チャット群はフィルタ群より検索が約62秒長く、結果と過程の満足が有意に低かった（表1）。併用群はチャット群より選んだイベントの価値が約22%高く、フィルタ群と併用群に有意差はなかった（§1.2）。チャット群は探す分野が平均1.10でフィルタ群の1.87より狭く、目録にないものの検索が1.17回と多かった（§5.1、図7）。特定の出演者などを探す場合はチャットでも差がなく、結果はモデルの新旧に依存しなかった。", "p6": "著者は、チャットと構造化メニューの中間の設計はほとんど未検討で、今後の課題としている（§6.2）。解釈：1つの都市のイベントという体験財の検索に限られ、旅行や商品の検索に同じ結果が当てはまるかは別に確かめる必要がある。", "fun": "何を見たいか決まっていないとき、白紙のチャット欄に「何か面白いのある？」と打つより、ジャンルの一覧が見えているほうが良いものに出会える。AIは自分の思い込みをそのまま映し返す「エコーチェンバー」になりやすく、質問を考えるのに疲れて上の方の結果で妥協してしまう。", "unverified": "併用群の価値の差の正確な定義（どの推定に基づく22%か）と、付録の頑健性の表は読んでいない。"}}, {"id": "pn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "上下関係に敏感な懸念はAI対話でどこまで語られるか", "title": "Bounded Disclosure: How Employees Manage Hierarchy-sensitive&nbsp;Concerns in AI-mediated Organizational Listening", "url": "https://doi.org/10.2139/ssrn.7646500", "authors": "Michael Saatkamp", "venue": "SSRN", "date": "2026-10-22", "apa": "Saatkamp, M. (2026). Bounded Disclosure: How Employees Manage Hierarchy-sensitive&nbsp;Concerns in AI-mediated Organizational Listening. https://doi.org/10.2139/ssrn.7646500", "why": "パルス調査では見えない、上下関係に敏感な懸念が、AIを介した対話形式でどう開示・抑制されるかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "定型のパルス調査では良い評価をつけた従業員が、AIによる音声インタビューでは懸念を口にする「開示のギャップ」が起きることを示し、上下関係に敏感な懸念がどう和らげて語られるかを理論化した。", "p2": "パルス調査では、良い評価と「懸念がない」ことが区別できない。従業員の発言と沈黙の研究は、上下関係に敏感な懸念ほど控えられやすく、対話形式ではそれを表しやすい可能性を示唆していた（抄録）。", "p3": "世界的な経営コンサルティング会社で、定型の事前調査と、同じ話題についての適応的なAI音声インタビューを1回のセッションで組み合わせる新しい傾聴の仕組みを対象に、Gioia法（帰納的な理論構築の質的手法）で分析した（抄録）。", "p4": "開示のギャップを「調査で好意的な評価をつけたのに、対話で懸念を述べた」ことと定義し、最初の適格な43セッションと、話題別の109の引用を分析した（抄録）。", "p5": "ギャップは43セッションの42%で生じた。ギャップがある場合、懸念はぼかし・限定・当たり前扱い・希望の形での言い換えなどの「和らげ」で表され、ない場合は「責任の転嫁」「控え」「言っても意味がない」という疑いの言葉が多かった（抄録）。", "p6": "抄録からは、1社のコンサルティング会社の修士論文規模の質的研究で、一般化には注意が要る。解釈：AIの対話が懸念を引き出すことが、従業員の匿名性や心理的安全性にどう影響するかは別に検討が必要だ。", "fun": "アンケートで「満足」と答えた人が、AIと話すと「まあ、でも…」と本音をこぼす。ただし、そのまま言うのではなく、やわらかく包んで話す。上司との関係が気になる職場の声は、「言うか言わないか」の二択ではなく、「どのくらい薄めて言うか」で出てくる、という見方が新しい。", "unverified": "インタビューの匿名性の扱いと、参加者の職位の構成は抄録からは確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "専門の異なるAI研究者チームで線形注意機構を探索", "title": "Building AI Research Teams for Autonomous Discovery of Linear Attention Architectures", "url": "https://arxiv.org/abs/2610.28887", "authors": "Yujian Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Liu, Y., An, L., He, Z., Helwig, J., Ji, J., Jain, R., Zhu, S., & Chang, S. (2026). Building AI Research Teams for Autonomous Discovery of Linear Attention Architectures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28887", "why": "専門性の異なるエージェントでチームを組み、局所解を避けて新しい線形注意の構造を自律的に発見する方法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法、実験設定、発見した構造、組織の比較、目的関数の比較、結論）を読んだ。付録の完全な結果表は読んでいない", "preprint": true, "p1": "異なる分野の背景を持つ16のAI研究者エージェントのチームを組み、限られた実験予算の中で線形注意機構の新しい構造（CFDN）を自律的に発見させ、1.3Bの規模で既存の強い基準GDN2を上回らせた。", "p2": "自律的な研究エージェントは局所解に陥りやすく、実験の費用が高いと試せるアイデアの数が限られるので、誰に次の実験を任せ、結果をどう次に生かすかが問題になる（§1）。", "p3": "各研究者は異なる分野の視点と自分だけの研究履歴を持ち、提案・結果・教訓を共有の知識として蓄積する。次に提案する研究者は、割引UCB（最近の貢献を重視しつつ試されていない研究者にも機会を与える）で選ぶ（式1）。各候補はGDN2に対する言語モデル・常識推論・検索の正規化改善の平均U(x)で評価し（式2）、それまでの最良を上回った分だけ報酬とした（§2）。", "p4": "16人・80反復の予算（GPT-6 Astra）で約1.5億パラメータで探索し、最良の候補を13億パラメータに拡大して、FineWeb-Eduで計算量をそろえて学習し、GDN・KDA・GDN2と比べた。背景なし・記憶なし・一様選択の3つの変種とも比べた（§3.1、§3.3）。", "p5": "80反復で63候補を評価し、効用が最も高いCFDNを選んだ（§3.2）。チームの最良の効用は1.04で、背景なし0.54、記憶なし0.56、一様選択0.76より高かった。背景なしは22反復目で頭打ちになり、完全なチームの最良は68反復目に現れた（§3.3、図3）。言語モデルだけを目的にすると常識推論と検索が弱くなった（表3）。", "p6": "著者は、各組織の変種を1回ずつしか走らせていないこと（変種の一部は本体の最初の16反復を再利用）は明記しているが、乱数によるばらつきの評価は本文の範囲では示されていない。解釈：単一の課題（線形注意）での結果で、他の研究課題への一般化は確かめられていない。", "fun": "AIの研究者を何人集めても、全員が同じ考え方では同じ穴にはまる。違う分野の「経歴」と「自分のノート」を持たせ、成果を出した人に多く任せつつ新人にも機会を与えると、より遠くまで行ける。人間の研究チームの組織論が、AIのチームにもそのまま当てはまるのが面白い。", "unverified": "1.3B規模での各ベンチマークの具体的な数値（表2・付録B）は読んでいない。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "遡及的反実仮想による直接・間接効果", "title": "Backtracking Direct, Indirect and Total Effects", "url": "https://arxiv.org/abs/2610.28910", "authors": "Jose M. Pe\\~{n}a", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Peña, J. M. (2026). Backtracking Direct, Indirect and Total Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28910", "why": "世界をまたぐ介入的反実仮想ではなく、遡及的な反実仮想で直接・間接効果を定義し直す新しい媒介分析を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、遡及的な直接・間接・総効果の定義、数値例、状況の効果、考察）を読んだ", "preprint": true, "p1": "媒介分析の自然直接効果・自然間接効果を、介入ではなく「背景の状況が変わったら」という遡及的（backtracking）反実仮想で定義し直し、状況の変化に人がどう反応したかの効果を測れるようにした。", "p2": "自然直接効果（NDE）は、背景の状況を固定したまま処置に介入したらどうなるかを問う。しかし、介護や通勤の事情が変わって在宅勤務に切り替える、という状況から生じる変化の効果は直接には表せない（§1）。", "p3": "事実の外生状態uから、遡及的な条件付き分布P_BT(u′|u)で別の外生状態u′を引き、処置が0→1に変わり媒介変数が事実の値のままの組だけを残して、結果の差Y(u′)−Y(u)を平均したものを遡及的直接効果（BDE）とする（定義1）。結果の撹乱項も変わりうるので、BDEは「直接効果の項」と「遡及の項」に分解される。同様に間接効果（BIE）・総効果（BTE）、集団版、状況そのものの効果（BCE）と3経路への分解を定義した（§3〜6）。", "p4": "在宅勤務・同僚との協働時間・生産性の例と、ベルヌーイ変数の構造的因果モデルの数値例で、介入版との違いと分布への依存を示した（§4）。", "p5": "数値例では、NDE=1に対しBDE=13/20、NIE=0に対しBIE=9/20、TE=1に対しBTE=1/4となった。結果の撹乱項の遡及分布を変えると、BDE=27/20、BIE=23/20、BTE=19/20に変わった（§4.1〜4.4）。著者は、この依存を、在宅勤務手当や保育支援など状況を変える「政策」ごとの効果を比べられる利点と位置づけている。", "p6": "著者は、離散の媒介変数と結果に限って示しており、連続の媒介変数では「同じ値を保つ」事象の確率がゼロになるので許容幅が必要だと述べている（§7）。また各効果は残した組だけの平均なので、政策間の完全な比較にはならないと注意している（§4.4）。解釈：遡及分布の特定にはデータ以外の仮定が必要で、実証での推定法は示されていない。", "fun": "「在宅勤務にしたら生産性はどうなる？」と、会社が命令した場合と、社員が家庭の事情で自分から在宅に切り替えた場合とでは、答えが違って当然だ。後者は事情そのものも成果に響くからだ。その違いを数学的に区別し、どの支援策がどの社員にどう効くかを考える道具にしている。", "unverified": "なし"}}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "e値を準超マルチンゲールで結合する", "title": "Combining e-values using demi-supermartingales", "url": "https://arxiv.org/abs/2603.10329", "authors": "Jiahao Ming ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Ming, J., Ramdas, A., Shen, Y., Wang, R., & Waudby-Smith, I. (2026). Combining e-values using demi-supermartingales (Version 4). arXiv. https://doi.org/10.48550/ARXIV.2603.10329", "why": "e値の結合法を示して、ノンパラメトリックな平均検定の古い予想を解決した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、共有効e変数とSymPol不等式、KL-infの信頼区間と幅、結論）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "独立なe値（帰無仮説の下で期待値が1以下の非負の証拠の量）を結合してp値を作る新しい方法SymPolを、準超マルチンゲールに対するVilleの不等式の一般化で正当化し、Wang–Zhao（2003）とGaffke（2005）の予想を肯定的に解決した。", "p2": "e値を掛け合わせた過程M_n(λ)=∏(1−
