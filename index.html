": "大きな関税の発表が家計のインフレ予想を上げること、その反応はもともとの予想が不安定な家計で大きいことを示した（抄録）。", "p3": "2018〜2025年の米国の7つの関税の局面について、検索の注目のピークを特定し、ニューヨーク連銀の消費者予想調査の面接日を使って、ピークの前後で同じ人の予想の改定を比べた（抄録）。", "p5": "1年先の予想は、2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の再開で1.72ポイント上がった。金融知識の低さは大きな反応を予測したが、消費・住宅・地域の関税への曝露は改定を系統的には予測しなかった（抄録）。", "fun": "関税の知らせを聞いて「これから物価が上がりそうだ」と思うかどうかは、人によって違う。面白いのは、実際に関税の影響を受けやすい暮らしをしているかどうかは関係がなく、もともと物価の見通しがぐらついていた人ほど大きく反応したことである。同じ知らせでも、受け取る側の「前からの思い込み」で効き方が変わる。", "unverified": "本文未読のため、有意でなかった他の局面の推定値と標本の大きさは未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "中堅国の協調関税は相手が報復すると損になる", "title": "Strength in Numbers? Middle-Power Coalitions and the Gains from Coordinated Tariffs", "url": "https://doi.org/10.2139/ssrn.7681518", "authors": "Oliver Loertscher ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Loertscher, O., Pujolas, P., & Rossbach, J. (2026). Strength in Numbers? Middle-Power Coalitions and the Gains from Coordinated Tariffs. https://doi.org/10.2139/ssrn.7681518", "why": "2025年の米国の関税引き上げを受け、10の中堅国とEUの連合が協調して関税をかける利益を多部門の一般均衡貿易モデルで計算した。米国の関税が固定なら連合の厚生は0.23%上がるが、米国が反応すると0.03%の損失になる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "中堅国が協調して関税をかけることで得をするかは、相手国が反応するかどうかと連合の設計に大きく左右されることを示した（抄録）。", "p3": "2025年の米国の関税引き上げを受け、10の中堅国とEUの連合について、投入産出の連関を持つ多部門の一般均衡貿易モデルで、協調関税の効果を引き上げの前後で比べた（抄録）。", "p5": "米国の関税が固定なら共通関税は連合の厚生を0.23%上げるが、米国が反応すると0.03%の損失になる。輸出の多くが米国向けのカナダとメキシコは損をし、加盟国間の関税撤廃のほうが協調的な報復より頑健な利益を生む（抄録）。", "fun": "大国に関税をかけられたとき、中くらいの国が団結してやり返せば勝てるだろうか。計算すると、相手が黙っていれば少し得をするが、相手がやり返すと、わずかな損に変わった。しかも仲間の中で得する国と損する国が分かれてしまう。数を集めるより、仲間どうしの壁をなくすほうが確実に得になる、という結論が意外である。", "unverified": "本文未読のため、連合に含まれる国の一覧とモデルの較正の詳細は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "状態が3つ以上だと群集行動は事前分布しだい", "title": "Herding with Multiple States: When the Prior Matters", "url": "https://arxiv.org/abs/2611.13632", "authors": "Xiaoyu Chen", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Chen, X. (2026). Herding with Multiple States: When the Prior Matters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13632", "why": "逐次的な観察学習で状態が3つ以上あると、同じ情報構造と選好でも、事前分布によって学習が起きる場合と群集行動に陥る場合があることを反例で示し、既存の予想を否定した。学習のための必要条件も導入した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "他人の行動を順に観察して学ぶ状況で、起こりうる状態が3つ以上あると、正しく学べるか群集行動に陥るかが事前の信念に左右されうることを示した（抄録）。", "p3": "同じ情報構造と選好のもとで、ある事前分布では学習が、別の事前分布では群集行動が起きる反例を作り、既存の予想を否定した。そのうえで、信号がどの行動についても「事後的に最適でない」という強い証拠を与えうるという条件（脱出可能性）と、その対ごとの版を導入した（抄録）。", "p5": "脱出可能性が成り立たないと、ある事前分布で群集行動が起き、対ごとの版が成り立たないと、すべての事前分布で起きる。区間最適性と単調尤度比を持つ環境では、脱出可能性が学習と群集行動を事前分布によらず完全に特徴づける（抄録）。", "fun": "行列のできている店に、理由も知らず並んでしまうことがある。前の人の行動を見て、自分の情報を捨ててしまう現象で、経済学では「群集行動」と呼ぶ。選択肢が二つのときは、どんな情報があれば皆が正解に行き着くかが知られていた。この研究は、三つ以上になると話が変わり、最初の思い込みしだいで結末が分かれることを示した。", "unverified": "本文未読のため、反例の具体的な構成と証明の詳細は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "貧困層が借りられない国のマクロプルーデンス政策", "title": "Macroprudential Policy When the Poor Cannot Borrow", "url": "https://doi.org/10.2139/ssrn.7682498", "authors": "Fernando Arce ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Arce, F., Levin, Y., & Tran-Xuan, M. (2026). Macroprudential Policy When the Poor Cannot Borrow. https://doi.org/10.2139/ssrn.7682498", "why": "不平等の大きい新興国ほど資本規制が少ないという傾向を、実質為替レートを通じた分配上の外部性で説明する小国開放経済モデルを示し、最適な借入課税をフィッシャー的な部分と分配的な部分に分けた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "不平等の大きい新興国ほど資本規制が少ないという傾向を、実質為替レートを通じた分配上の外部性で説明するモデルを示した（抄録）。", "p3": "非相似的な選好、ときどき効く担保制約に直面する高所得の借り手、その日暮らしの低所得家計からなる小国開放経済モデルを作り、最適な借入課税をフィッシャー的な部分と分配的な部分に分解した（抄録）。", "p5": "不平等を取り入れると、平均の最適なマクロプルーデンス税は大きく下がり、補助金に変わることさえある。生産のある経済に拡張しても、賃金が伸縮的であるかぎり仕組みは量的に重要なままだった（抄録）。数値は抄録に記載なし。", "fun": "外国からお金を借りすぎると危ないので、借入に税をかけて抑える、というのが標準的な考え方である。ところが、貧しい人が借金をできない国では話が変わる。豊かな人の借入が為替レートを動かし、それが貧しい人の買える物の値段に効くからだ。この研究は、貧しい人のためには借入を抑えすぎないほうが良い場合があると示した。", "unverified": "本文未読のため、較正に使った国と、税率の変化の具体的な値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "LLMの束ね売り事業者は補完か競合か", "title": "LLM Competition and the Aggregator Economy", "url": "https://doi.org/10.2139/ssrn.7683780", "authors": "Fupeng Sun ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Sun, F., Liu, Z., & Wiesemann, W. (2026). LLM Competition and the Aggregator Economy. https://doi.org/10.2139/ssrn.7683780", "why": "複数の提供者の言語モデルを1つの定額契約で使える仲介事業者は、提供者にとって卸売の収入源であり直販の競合でもある。得意分野の異なる2社と利用者の選択をゲーム理論でモデル化した研究。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "複数の提供者の言語モデルを一つの定額契約で使える仲介事業者（アグリゲーター）が、提供者の収入と技術開発の誘因をどう変えるかを、ゲーム理論で分析した（抄録）。", "p3": "それぞれ別の機能に強い二つの提供者と、機能の好みが異なる利用者を考え、利用者が直接契約するか、仲介事業者と契約するか、使わないかを選ぶモデルを作った（抄録）。", "p5": "仲介事業者は好みの偏りが小さい利用者を引き受ける。市場が飽和していないときは利用者を広げるが、直接契約を食って提供者の収入を減らしうる。飽和した市場では既存の契約者を移すだけで、API価格が十分高いときにだけ提供者の得になる（抄録）。", "fun": "いくつものAIを一つの料金でまとめて使えるサービスがある。AIを作る会社から見ると、これは自社のAIを卸売りで買ってくれるお客であり、同時に自社の直接の契約者を奪う競争相手でもある。この研究は、その板ばさみを数式にした。市場がまだ伸びているか、もう行き渡ったかで、味方にも敵にもなることが分かる。", "unverified": "抄録の末尾が切れており、技術開発の誘因についての結論の後半は未確認。理論モデルで実証データは使っていないと読める。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "四半期報告の任意化案に年次予想のみの企業は株安", "title": "When Quarterly Reporting Becomes Optional: The Role of Prior Disclosure Practices", "url": "https://doi.org/10.2139/ssrn.7685701", "authors": "Francois Brochet ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Brochet, F., & Moonmoon, S. (2026). When Quarterly Reporting Becomes Optional: The Role of Prior Disclosure Practices. https://doi.org/10.2139/ssrn.7685701", "why": "2025〜2026年の米国の3つの政策イベントで、四半期の業績予想を出してきた企業と年次の予想だけの企業を比べ、後者の発表時のリターンが約100ベーシスポイント低いことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "四半期報告を任意にする案が出たとき、投資家の反応は、その企業がこれまで自発的にどう情報を出してきたかで違うことを示した（抄録）。", "p3": "2025〜2026年の米国の3つの政策イベントの前後で、四半期ごとの業績予想を出してきた企業と、年次の予想しか出していない企業の株価の反応を比べた（抄録）。", "p5": "年次の予想だけの企業は、発表時のリターンが約100ベーシスポイント低かった。差はどのイベントでも負で、定義や測定期間を変えても残り、偽のイベント日と比べても異例に大きい。制度はまだ実施されておらず、反応は投資家の予想を映す（抄録）。", "fun": "「三か月ごとの決算報告を、やってもやらなくてもよいことにする」という案が出た。すると、ふだんから三か月ごとに見通しを話している会社に比べ、年に一度しか話さない会社の株価の反応が悪かった。投資家は「この会社は任意になったら情報を出さなくなる」と先読みしたと解釈できる。ふだんの振る舞いが信用の貯金になっている。", "unverified": "本文未読のため、標本の企業数と、3つのイベントの具体的な内容は未確認。"}}, {"id": "pn40", "rank": 40, "field": "経営学", "headline": "特許保護が弱まると企業は説明会で多くを語る", "title": "Patent Protection and Disclosure", "url": "https://doi.org/10.2139/ssrn.7690238", "authors": "Nemit Shroff ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Shroff, N., Xie, Y., Yoon, R., & Zhang, B. (2026). Patent Protection and Disclosure. https://doi.org/10.2139/ssrn.7690238", "why": "特許保護の弱まりが特許の担保価値を下げ、無担保の借入への移行を通じて開示の誘因を高めるという仮説を、2014年の米最高裁のAlice判決を使って検証し、影響の大きい企業ほど決算説明会で情報を多く出すことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "特許保護が弱まると、資金調達の経路を通じて企業の自発的な情報開示が増えることを示した（抄録）。", "p3": "特許保護の弱まりは特許の担保価値を下げ、担保つきの借入から無担保の借入への移行を促す。無担保の貸し手は将来の資金の流れの情報に頼るので開示の誘因が高まる、という仮説を、特定の特許の保護を弱めた2014年の米最高裁のAlice判決を使って検証した（抄録）。", "p5": "判決の影響が大きい企業ほど決算説明会で多くを語るようになり、反応は負債面の資金制約がある企業や特許を担保に入れていた企業で強く、小規模企業や製品市場の競争が激しい企業では弱い。影響を受けた特許は担保に入れられにくくなった（抄録）。", "fun": "特許は発明を守る盾であると同時に、お金を借りるときの担保にもなる。判決で特許の守りが弱くなると、担保としての値打ちが下がり、会社は担保なしで借りるしかなくなる。担保のない貸し手は会社の将来を知りたがるので、会社は自分から多くを語るようになった。発明の法律が、会社のおしゃべりの量を変えるという連鎖が面白い。", "unverified": "本文未読のため、開示の量の測り方と効果の大きさは未確認。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "フィギュア審判は同国選手を上げ競争相手を下げる", "title": "Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging", "url": "https://arxiv.org/abs/2611.13194", "authors": "Jialin Liu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Liu, J., & Shen, S. (2026). Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13194", "why": "フィギュアスケートの採点データから、審判の同国選手への加点と、その選手の近い競争相手への減点を見いだした。加点は無作為な滑走順に沿って下がり、減点は入賞の見込みとともに大きくなることから、好みでなく戦略的な偏りだと論じる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "フィギュアスケートの審判が同国の選手を高く採点するだけでなく、その選手の近い競争相手を低く採点することを示し、好みでなく戦略による偏りだと論じた（抄録）。", "p3": "採点の詳しいデータを使い、同国選手への加点が、無作為に決まる滑走順や、競争相手の国の審判がパネルにいるかどうかでどう変わるか、相手への減点が入賞の見込みでどう変わるかを調べた（抄録）。", "p5": "加点は滑走順に沿って下がり、2022/23シーズンより前は、近い競争相手の国の審判がパネルにいると上がった。減点は同国選手の入賞の見込みとともに大きくなり、見込みがなくなると消える。反実仮想の分析では、これらの偏りは接戦の結果を左右しうる（抄録）。", "fun": "自分の国の選手に甘い点を付けるのは、単にその国の演技の好みが似ているだけかもしれない。しかし、ライバル選手にだけ辛い点を付け、しかも自国選手にメダルの見込みがあるときだけそうするなら、好みでは説明できない。この研究は、採点の「いつ・誰に」という細かい型から、ひいきが計算ずくであることを見分けた。", "unverified": "本文未読のため、データの期間と規模、偏りの大きさの数値は未確認。"}}, {"id": "pn42", "rank": 42, "field": "組織行動・心理的安全性", "headline": "公式・非公式のリーダーの役割を実証的に分類", "title": "Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles.", "url": "https://doi.org/10.31234/osf.io/5b9sy", "authors": "Charlotte Marie Edelmann ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Edelmann, C. M., Boen, F., Stouten, J., & Fransen, K. (2026). Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles. https://doi.org/10.31234/osf.io/5b9sy", "why": "職位・学歴・業種の異なる従業員35人への面接から、公式のリーダーと同僚リーダーが担うリーダーシップの機能を帰納的に抽出し、文献と統合した分類を作った研究。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "公式のリーダーと同僚の中の非公式なリーダーの両方について、実際に担われているリーダーシップの機能を分類した体系を、面接から帰納的に作った（抄録）。", "p3": "職位・学歴・業種・性別の異なる従業員35人に面接し、質的な内容分析でリーダーシップの機能を抽出した。参加者が個人と集団でカードを並べ分ける作業を行い、機能を上位の役割にまとめた（抄録）。", "p5": "公式のリーダーの役割が10、同僚リーダーの役割が10からなる分類ができた。既存のリーダーシップの枠組みと比べ、先行研究と一致する点と、参加者が挙げた機能によって広がる点を示した（抄録）。", "fun": "リーダーというと、課長や部長のような肩書きのある人を思い浮かべる。しかし職場には、肩書きはないのに皆をまとめたり励ましたりする人がいる。この研究は、働く人に聞き取りをして、両方のリーダーが実際に何をしているかを同じ数の役割に整理した。理論から決めるのでなく、現場の言葉から分類を作った点が特徴である。", "unverified": "本文未読のため、役割の具体的な名称と、分類の信頼性の検討は未確認。"}}, {"id": "pn43", "rank": 43, "field": "組織行動・心理的安全性", "headline": "同じ会社でもチームでAI利用に大きな差", "title": "Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization", "url": "https://arxiv.org/abs/2611.14154", "authors": "Daniele Veri'", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Veri', D. (2026). Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14154", "why": "ソフトウェア企業の11チーム・98件の構造化面接から自己申告のAI利用を記述し、高頻度利用の割合がチームにより20.0%から71.4%まで開くこと、利用頻度にかかわらず組織のAI方針がほとんど知られていないことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "一つのソフトウェア企業の中でも、自己申告のAI利用の頻度がチームによって大きく違うことを記述した事例研究である（抄録）。", "p3": "11チームにわたる98件の構造化面接の記録を使い、標準化した尺度で測った65人と、回答の目盛りが異なる尺度で測った33人を分けて集計した（抄録）。", "p5": "標準化した尺度では65人中36人（55.4%）が高頻度の利用を報告し、チームごとの割合は20.0%から71.4%まで開いた。組織のAI方針は、高頻度の人の86.1%、低頻度の人の96.6%が「知らない」か「詳しくは分からない」と答えた（抄録）。", "fun": "同じ会社で同じ道具が使えるのに、あるチームではほとんどの人がAIを毎日使い、別のチームでは少数しか使っていない。しかも、よく使う人も使わない人も、会社のAIの決まりをほとんど知らなかった。道具を配り、規則を作るだけでは、使われ方も守られ方もそろわないことを、数字で示している。", "unverified": "抄録の末尾が切れており、質的な観察の内容は未確認。一社の記述的な事例で、差の原因は示していない。"}}, {"id": "pn44", "rank": 44, "field": "組織行動・心理的安全性", "headline": "裁判所の所長交代で破産手続が速まり融資が増える", "title": "Judicial Performance, Bank Lending and Firms' Investments: Evidence from Court Leadership Turnover", "url": "https://doi.org/10.2139/ssrn.7683845", "authors": "Davide Moretti ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Moretti, D., Fiordelisi, F., Ruggiero, N., & Baltas, K. (2026). Judicial Performance, Bank Lending and Firms’ Investments: Evidence from Court Leadership Turnover. https://doi.org/10.2139/ssrn.7683845", "why": "イタリアの裁判所長の任命を外生的な変動として使い、所長の交代が破産手続の長期化を抑え、銀行融資の拡大、支払遅延の減少、無形資産への投資につながることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "裁判所の所長の交代が破産手続の長期化を抑え、それが銀行融資の拡大と企業の投資の変化につながることを、イタリアのデータで示した（抄録）。", "p3": "裁判所長の任命を外生的とみなせる変動として使い、所長の交代の前後で破産手続の期間、銀行融資、支払いの遅延、企業の投資を比べた（抄録）。", "p5": "交代は手続期間の伸びを遅くし、効果は新しい所長が若い、管理職の経験がある、地元に根ざしている場合に大きい。司法の効率の改善により銀行融資が増え、支払遅延が減り、大きい企業は無形資産へ投資を移した（抄録）。効果の大きさは抄録に記載なし。", "fun": "裁判所のトップが替わると、会社がお金を借りやすくなる。一見つながりのない話だが、道筋はこうである。新しい所長が仕事の進め方を改めると、破産の手続きが早く終わる。すると貸したお金を取り戻しやすくなるので、銀行が安心して貸す。組織の長の交代が、建物の外の経済まで動かすことを示した点が面白い。", "unverified": "本文未読のため、標本の期間と規模、推定値の大きさは未確認。"}}, {"id": "pn45", "rank": 45, "field": "計算社会科学・ネットワーク科学", "headline": "少数の観測者から拡散源を早期に特定", "title": "EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks", "url": "https://arxiv.org/abs/2611.13919", "authors": "Tao Wen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wen, T., Chen, Y.-wang, Zhao, J., Pan, C., Syed, T. A., Ahn, Y.-Y., & Cheong, K. H. (2026). EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13919", "why": "大規模な社会ネットワークで情報拡散の発信源を早期に特定するため、進化計算で少数の観測者を配置し、信頼度の異なる観測を一般化ベイズ推論で統合する枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "大規模な社会ネットワークで、少数の観測者の情報から情報拡散の発信源を早い段階で特定する枠組みEAGLEを提案した（抄録）。", "p3": "進化計算で少数の観測者を戦略的に配置し、信頼度の異なる観測データを一般化ベイズ推論で統合する。データの不確かさと雑音を明示的に取り込み、拡散の特性や利用者の属性についての仮定に頼らない（抄録）。", "p5": "多様なネットワークと拡散の筋書きで既存の最良のモデルを一貫して上回り、Twitterの実際の拡散経路のデータでも、限られた観測者から大規模ネットワークの発信源の候補を特定できた（抄録）。数値は抄録に記載なし。", "fun": "うわさがどこから始まったかを突き止めるのは難しい。全員に聞いて回ることはできないからだ。この研究は、ネットワークの中の「ここに立てば流れがよく見える」という見張り場所を少数選び、そこに届いた時刻や内容から出どころを逆算する。見張りの言うことが少し当てにならなくても、確からしさを重みにして答えを絞り込む。", "unverified": "抄録の末尾が切れており、精度の数値とネットワークの規模は未確認。"}}, {"id": "pn46", "rank": 46, "field": "計算社会科学・ネットワーク科学", "headline": "2回の接触が要る伝染で採用と放棄の波が生まれる", "title": "Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity", "url": "https://arxiv.org/abs/2611.12920", "authors": "Francisco J. Mu\\~noz ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Muñoz, F. J., Nuño, J. C., Meacci, L., & Primicerio, M. (2026). Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12920", "why": "採用に2回の接触が必要な2段階伝染のモデルに人口の入れ替わりを加えると、採用と放棄の振動が超臨界ホップ分岐で生じ、初回接触での採用確率が小さく入れ替わりが遅いことが条件になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "採用するまでに採用者と二回接触する必要がある伝染の過程に、人の入れ替わりを加えると、採用と放棄の波が生まれる条件を明らかにした（抄録）。", "p3": "不活性な人の貯まりを通じた入れ替わりと、小さな自発的活性化を持つ二段階伝染のモデルを、平均場の記述、有限の人口での揺らぎ、ネットワーク上の対近似とシミュレーションで調べた（抄録）。", "p5": "平均場では振動は超臨界ホップ分岐で生じ、初回の接触での採用確率が約0.17以下で、入れ替わりが遅いことが必要である。有限の人口では人口学的な雑音がこの領域の外でも準周期を保ち、ネットワークのつながりを減らすと振動は弱まる（抄録）。", "fun": "流行は、一人から聞いただけでは乗らず、二人目から聞いて初めて乗る、ということが多い。そこに「飽きてやめる人」と「新しく入ってくる人」が加わると、流行は一度きりで終わらず、寄せては返す波になることがある。この研究は、波が生まれる条件を数式で突き止めた。流行り廃りの繰り返しに、単純な仕組みがありうることが分かる。", "unverified": "抄録の末尾が切れており、四つ目の発見と臨界の平均次数の値は未確認。"}}, {"id": "pn47", "rank": 47, "field": "計算社会科学・ネットワーク科学", "headline": "集計データだけで都市の移動を個人単位で再現", "title": "Spatial patterns of transportation choice in Niter\\'oi", "url": "https://arxiv.org/abs/2611.14499", "authors": "Sandro Martinelli Reia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Reia, S. M., Anderson, T., & Pfoser, D. (2026). Spatial patterns of transportation choice in Niterói (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14499", "why": "集計的で静的な都市データから、合成人口・建物・交通網を組み合わせて日々のトリップと交通手段を生成する枠組みを作り、ブラジル・ニテロイ市の約47万5千人の合成住民に適用して実測と照合した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "集計的で静的な都市データだけから、個人単位の一日の移動と交通手段の選択を再現する計算の枠組みを作り、ブラジルのニテロイ市に適用した（抄録）。", "p3": "既存の活動シミュレータを基に、合成人口、建物などの環境、交通網を組み合わせて日々のトリップを生成し、徒歩・自動車・公共交通を割り当てる（抄録）。", "p5": "約475,000人の合成住民で、地区ごとの公共交通の利用の模様は実測の活動の代理指標と強く関連した（相関係数0.885）。バス停までの徒歩時間を30%減らすと、公共交通と自動車の比が11.3%上がり、周辺部のいくつかの地区で伸びが大きかった（抄録）。", "fun": "人が街をどう動いているかを知るには、ふつう携帯電話の位置情報のような高価なデータが要る。この研究は、人口や建物や路線図という、どの街にもある大づかみのデータだけから、コンピュータの中に仮想の住民を作って一日を過ごさせた。すると実際の動きとよく合い、バス停を近くすると車よりバスが選ばれる地区まで分かった。", "unverified": "本文未読のため、実測の代理指標の内容と、交通手段の割当ての規則は未確認。"}}, {"id": "pn48", "rank": 48, "field": "計算社会科学・ネットワーク科学", "headline": "携帯・センサ・GPSを分担させた地域交通の再現", "title": "Data-driven regional traffic simulation from heterogeneous mobility sources", "url": "https://arxiv.org/abs/2611.13947", "authors": "Federico Bellisardi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bellisardi, F., Mizzi, C., Fabbri, A., Micheli, D., Vannelli, A., & Bazzani, A. (2026). Data-driven regional traffic simulation from heterogeneous mobility sources (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13947", "why": "イタリアのエミリア＝ロマーニャ州の日々の交通を、携帯データでトリップと時刻、路側センサで交通量、GPS軌跡で経路選択を与えるエージェントベースのシミュレータで再現し、各データ源の寄与を測った。総交通量は冬に観測の1%以内、夏に10%以内だった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "携帯電話・路側センサ・GPSという異なるデータを役割分担させた地域交通のシミュレータを作り、それぞれのデータが何に寄与するかを測った（抄録）。", "p3": "イタリアのエミリア＝ロマーニャ州の日々の交通について、携帯データでトリップと時刻を、半数の路側センサで交通量の水準を、全センサで局所の補正を、GPS軌跡で経路選択を与え、シミュレーションを使わない予測と比べた（抄録）。", "p5": "総交通量は冬に観測の1%以内、夏に10%以内で、道路の順位づけは道路種別による予測より良かった（順位相関0.67〜0.68対0.41〜0.48、冬）。個々の道路の誤差は単純な予測と同程度にとどまった（抄録）。", "fun": "交通の予測には、携帯の位置、道路のセンサ、車のGPSなど、いろいろなデータが使われる。全部混ぜれば良くなるはずだが、どれが何の役に立っているのかは意外に分かっていない。この研究は、データを一つずつ役割に割り当てて効き目を測り、「うまくいかなかった点」まで正直に報告している。道具の実力を冷静に確かめる姿勢が参考になる。", "unverified": "本文未読のため、センサの数と誤差の指標の定義は未確認。著者自身が評価は完全には独立でないと述べている。"}}, {"id": "pn49", "rank": 49, "field": "計算社会科学・ネットワーク科学", "headline": "AIの研究支援は開発国に有利な偏りを持つか", "title": "Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US", "url": "https://arxiv.org/abs/2611.14288", "authors": "Yuan Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, Y., Bertaglia, T., & Schroeder, R. (2026). Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14288", "why": "中国と米国に関する社会科学の問いについて、言語モデルが開発国やその学術的伝統の理論を優遇するかを監査した研究。合意された正解のない社会科学でのAI利用の偏りを扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "言語モデルを社会科学の研究補助に使うとき、開発された国やその学術的伝統の理論をひいきする偏りがあるかを監査する課題を設計した（抄録）。", "p3": "米国と中国に関する社会科学の問いと、より一般的な問いについて短い小論を書かせ、問いの種類（国の比較、特定の国、一般）、モデル（米国製・中国製・欧州製）、指示の出し方の3つの条件を変えて比べた（抄録）。", "p5": "取得できた抄録は方法の説明の途中で切れており、偏りの有無と大きさの結果は未確認（抄録・本文を入手できた範囲に記載なし）。", "fun": "数学の問題には正解があるので、AIの答えが合っているかはすぐ分かる。しかし「なぜこの国は経済成長したか」のような社会科学の問いには、決まった正解がない。そこでAIが自分の生まれた国に都合のよい説明を選んでいても気づきにくい。この研究は、同じ問いを作られた国の違うAIに書かせて比べる、という確かめ方を考えた。", "unverified": "抄録が途中で切れており、結果と結論は未確認。"}}, {"id": "pn50", "rank": 50, "field": "人口学", "headline": "国の富を人口と領土から測り直す", "title": "The Wealth of Nations According to Adam Population, Territory, and Welfare", "url": "https://doi.org/10.2139/ssrn.7685298", "authors": "Juan Carlos Cordoba", "venue": "SSRN", "date": "2026-11-11", "apa": "Cordoba, J. C. (2026). The Wealth of Nations According to Adam Population, Territory, and Welfare. https://doi.org/10.2139/ssrn.7685298", "why": "1人あたりの豊かさと国の富を区別し、王朝的な選好のもとで「統計的生命の価値×土地あたりの有効な人数」として国の富を測った。87か国のうち米国は、この富では19位、消費等価で測った厚生のストックでは48位になると報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "一人あたりの豊かさと「国の富」を区別し、人口と領土を含めて国の富を測り直す方法を示した（抄録）。", "p3": "王朝的な選好（Barro–Becker型）を使い、土地一単位あたり一人の創始者を所与として、その厚生で人口の歴史を評価する。国の富は、統計的生命の価値に、土地あたりの有効な人数を掛けたものになる（抄録）。", "p5": "87か国の中で、米国は富では十九位、消費等価で測った厚生のストックでは四十八位だった。中国の富は米国の45%で、一人あたりでは14%である。1500年以降、世界の代表的な集計の富は約173倍になった（抄録）。", "fun": "国の豊かさは、ふつう一人あたりの所得で比べる。しかしアダム・スミスは「一人ひとりの暮らし」と「国全体の富」を分けて考えていた。この研究は、人がどれだけ多く生きられるかも勘定に入れて国の富を測った。すると順位が大きく入れ替わる。何を「豊か」と呼ぶかで、世界の見え方が変わることが分かる。", "unverified": "本文未読のため、指標の式の詳細、使用データ、比較対象の指標（3,714倍とされる別の測り方）の定義は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "PC橋の継手のひび割れ幅を橋をまたいで評価", "title": "A Data‐Driven Framework for 10.1016/j.oceaneng.2026.129376", "authors": "Longde Su ほか", "venue": "Ocean Engineering", "date": "2026-11-11", "sjr": 1.524, "citescore": 10.2, "citescore_year": "2025", "apa": "Su, L., Su, J., Cheng, L., & Ouyang, T. (2027). Multi-head-attention locally fused GAN for few-shot hanger damage identification in arch bridges using vehicle-bridge interaction responses. Ocean Engineering, 371, 129376. https://doi.org/10.1016/j.oceaneng.2026.129376", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、アーチ橋の吊材（ハンガー）の損傷を、車両と橋の相互作用で生じる応答から同定する研究で、少数の学習例でも使えるように、多頭注意で局所的に融合する敵対的生成ネットワーク（GAN）を用いるとみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、橋に多数のセンサを付けなくても、車が渡るときの揺れの情報だけで、アーチ橋を吊っている部材のどれが傷んでいるかを当てられるか、というものである。損傷した橋のデータはめったに手に入らないので、少ない例から学ぶ工夫が鍵になると読める。結果は未確認。", "unverified": "抄録・本文を入手できず、手法の詳細、検証データ、精度はすべて未確認。"}}, {"id": "jr17", "rank": 17, "headline": "準静的な影響線をウェーブレットで自動抽出", "title": "Adaptive extraction of high-fidelity quasi-static influence lines via reference-free PSO-EFI wavelet parameter optimization", "url": "https://doi.org/10.1007/s13349-026-01177-z", "authors": "Kaiqi Zhao ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-11", "citescore": 8.0, "citescore_year": "2025", "apa": "Zhao, K., Yin, S., Yang, Y., & Qin, T. (2026). Adaptive extraction of high-fidelity quasi-static influence lines via reference-free PSO-EFI wavelet parameter optimization. Journal of Civil Structural Health Monitoring, 17(1). https://doi.org/10.1007/s13349-026-01177-z", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、橋の準静的な影響線（荷重の位置と応答の関係を表す線）を、参照信号なしで、粒子群最適化（PSO）などでウェーブレットのパラメータを最適化して高い忠実度で自動抽出する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、車が橋を渡るときの計測波形には、車の重さによるゆっくりした変形と、揺れによる速い振動が混ざっているが、その中から「ゆっくりした成分」だけをきれいに取り出せるか、というものである。取り出し方の調整を人の勘でなく計算で自動化する点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、手法の詳細（題名の「EFI」の内容を含む）、検証した橋、精度はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "運用条件の変化に強い確率的な仮想センシング", "title": "MoRF-AST: Calibrated probabilistic virtual sensing for structural monitoring under changing operating conditions", "url": "https://doi.org/10.1016/j.cacaie.2026.100269", "authors": "Wingho Feng ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-10", "sjr": 2.155, "citescore": 14.7, "citescore_year": "2025", "apa": "Feng, W., Li, Q., Zhong, M., Yang, J., & Wang, C. (2026). MoRF-AST: Calibrated probabilistic virtual sensing for structural monitoring under changing operating conditions. Computer-Aided Civil and Infrastructure Engineering, 100269. https://doi.org/10.1016/j.cacaie.2026.100269", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社サイトの本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "少数のセンサの計測から構造物全体の応答を確率的に復元する仮想センシングで、運用条件が学習時と変わっても不確実性の幅が正しく保たれる方法MoRF-ASTを提案した（抄録）。", "p3": "正規化したモード座標で解析的なガウスの参照事後分布を作り、その残差だけを条件付きフローで学習する（MoRF）。運用時には、設置センサの過去の計測から応答の大きさを推定し、平均を保つ輸送で事後分布の広がりを調整する（AST）（抄録）。", "p5": "橋の床版のベンチマークで事後平均の正規化誤差（NRMSE）は6.88%だった。交通条件をずらした8つの領域で、ASTは被覆率の誤差の平均を3.53%から2.73%に下げた（抄録）。", "fun": "橋の全部の場所にセンサを付けることはできないので、数か所の計測から残りを推定する。そのとき「推定値はこのくらいの幅で確かです」と言えると安心だが、交通量が学習時と変わると、その幅が当てにならなくなる。この研究は、今の交通の様子に合わせて幅を広げたり縮めたりし、「確かさの表示」そのものを正しく保とうとした。", "unverified": "本文未読のため、センサの数と配置、ベンチマークの詳細、高速道路橋の数値事例の結果は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "交通を止めずに中空床版橋のヒンジ損傷を評価", "title": "Traffic-undisrupted assessment of hinge joint damage in hollow slab bridges using computer vision and LDIL inversion", "url": "https://doi.org/10.1016/j.istruc.2026.113508", "authors": "Haozhe Jiang ほか", "venue": "Structures", "date": "2026-11-10", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Jiang, H., Yuan, L., Zhuge, P., & Jie, Z. (20 ridge structures", "url": "https://doi.org/10.1007/s13349-026-01179-x", "authors": "Moon-Soo Song ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-11", "citescore": 8.0, "citescore_year": "2025", "apa": "Song, M.-S., Park, S., Das Adhikari, M., Kim, J., & Yum, S.-G. (2026). Two-dimensional PS-InSAR decomposition for detecting horizontal-dominant deformation in aging bridge structures. Journal of Civil Structural Health Monitoring, 17(1). https://doi.org/10.1007/s13349-026-01179-x", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、衛星の合成開口レーダーによる永続散乱体干渉法（PS-InSAR）の観測を二次元の成分に分解し、老朽化した橋の水平方向が卓越する変形を検出する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、宇宙からのレーダー観測で、橋が上下でなく横方向にわずかに動いていることまで見分けられるか、というものである。衛星は斜め上から一方向の距離の変化しか測れないので、動きの向きを分けるには工夫が要る、という難しさが題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、使用した衛星データ、対象の橋、検出の精度はすべて未確認。"}}, {"id": "jr22", "rank": 22, "headline": "歩道橋の振動使用性のための走行荷重の実測モデル", "title": "Empirical characterization of running loads for the vibration serviceability assessment of footbridges", "url": "https://doi.org/10.1016/j.engstruct.2026.124011", "authors": "Jasper Lottefier ほか", "venue": "Engineering Structures", "date": "2026-11-11", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Lottefier, J., Van den Broeck, P., & Van Nimmen, K. (2027). Empirical characterization of running loads for the vibration serviceability assessment of footbridges. Engineering Structures, 371, 124011. https://doi.org/10.1016/j.engstruct.2026.124011", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "同じ題名のSSRN版の抄録（Crossrefの題名検索で取得）を使用。出版版の本文は未取得", "preprint": false, "short": true, "p1": "走る人が歩道橋などの細長い構造物に与える荷重を、大規模な実測に基づいて特徴づけ、振動使用性の照査に使える荷重モデルの推奨を示した（抄録）。", "p3": "集団で走る場面の走者222人・約122時間の実測と、二つの大規模な催しで記録した14,000人を超える走者の流れのデータから、歩調の個人内・個人間のばらつきの現実的な範囲を求めた（抄録）。", "p5": ics", "date": "2026-11-10", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Zhao, T., Xie, X., Ye, J., & Yang, Z. (2027). FEM enhanced DEM modeling on the undrained response of imperfectly saturated sand: numerical algorithm and its application in static liquefaction. Computers and Geotechnics, 203, 108820. https://doi.org/10.1016/j.compgeo.2026.108820", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、完全には飽和していない砂の非排水条件での応答を、有限要素法（FEM）で補強した個別要素法（DEM）でモデル化する数値アルゴリズムを示し、静的液状化に適用する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、砂粒一つひとつの動きを追う計算に、粒のすき間の水と空気の働きをどう組み込めば、砂が急に液体のようになる「液状化」を再現できるか、というものである。すき間に少し空気が残っている砂は、水で満たされた砂とは違う振る舞いをするという点が難しさだと読める。結果は未確認。", "unverified": "抄録・本文を入手できず、連成の方法、検証した試験、結果はすべて未確認。"}}, {"id": "jr25", "rank": 25, "headline": "巨礫混じり土石流の防護柵衝撃をMPM–DEMで", "title": "A fully coupled multi-material MPM–DEM framework for simulating bouldery debris flow impacts on flexible barriers", "url": "https://doi.org/10.1016/j.compgeo.2026.108826", "authors": "Xinpo Li ほか", "venue": "Computers and Geotechnics", "date": "2026-11-11", "sjr": 1.957, "citescore": 10.9, "citescore_year": "2025", "apa": "Li, X., Sun, Y., Chen, P., Zhao, S., Wu, Y., & Lei, X. (2027). A fully coupled multi-material MPM–DEM framework for simulating bouldery debris flow impacts on flexible barriers. Computers and Geotechnics, 203, 108826. https://doi.org/10.1016/j.compgeo.2026.108826", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、巨礫を含む土石流が柔構造の防護柵に衝突する現象を、複数の材料を扱う物質点法（MPM）と個別要素法（DEM）を完全に連成させて解く枠組みの研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、泥水のように流れる土砂と、その中を転がる大きな岩と、それを受け止めて大きくたわむ柵という、性質のまったく違う三つを、一つの計算の中で同時に扱えるか、というものである。流れは連続体、岩は粒、という別々の計算法をつなぐ点が技術的な要所だと読める。結果は未確認。", "unverified": "抄録・本文を入手できず、連成の
