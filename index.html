ばより正確だった。どの道具のハードラベルも民主党登録の白人と黒人の差を36〜65%過小評価したが、BISGの事後確率によるBIRDiEは0.03以内に近づいた。Haikuの欠けたラベルは年齢で選択されており、年齢差を6歳ふくらませた（抄録）。一方、HaikuがBlackとした有権者の95.8%は実際にBlackで、どの道具より精度が高かった（§8）。", "p6": "著者は、Haikuの「不明」の回答が不確実性によるのか安全のための訓練によるのかは区別できず、選択が起きる仕組みも確定できないとする。LLMとBISGの組み合わせは過信気味で、BIRDiEの精度の改善は示されていない（抄録、§8）。", "fun": "名前から性別や人種を推測する道具は、社会の格差を調べる研究でよく使われます。AIはこの推測が上手だと言われますが、実は難しい名前には「分からない」と答え、答えやすい名前だけで高い正解率を出していました。答えをもらえなかった人の年齢に偏りがあったため、年齢差が実際より6歳も大きく見えてしまいました。正解率の高さが正しい結論を意味しない、という点が面白いところです。", "unverified": "未査読のarXivプレプリント。研究1と研究3の道具別の精度の数値（§4、§6）は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "LLMの推論を正答・誤答・未完の競合リスクで評価", "title": "Right, Wrong, or Unfinished: A Competing Risks Framework for Language-Model Reasoning under Token Budgets", "url": "https://arxiv.org/abs/2611.05860", "authors": "Boen Jiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jiang, B., Fang, G., & Yu, W. (2026). Right, Wrong, or Unfinished: A Competing Risks Framework for Language-Model Reasoning under Token Budgets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05860", "why": "トークン予算下の推論を生存分析の競合リスクとして扱い、予算ごとの正答確率と消費量を推定する枠組みを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（設定とデータ、枠組み、ルーティングの結果、考察）を読んだ", "preprint": true, "p1": "トークン予算の下でのLLMの推論を、正答で完了・誤答で完了・上限で未完（打ち切り）の競合リスクとして扱う統計的枠組みCRATERを作り、予算ごとの正答・誤答・未完の確率と期待トークン消費を1つのモデルで出せるようにした（抄録、§3）。", "p2": "トークン予算の下で性能を評価するには、応答がいつ終わるかと正しいかの両方が要るが、全体の正答率や平均の応答長はそれが予算とともにどう変わるかを示さず、予算ごとの別々の推定も手間がかかる（抄録、§6）。", "p3": "上限で終わらない応答を管理的な右打ち切りとし、正答と誤答の完了を別々の事象として、トークンの格子上で原因別ハザードを推定する。ハザードは問題の埋め込みに基づく情報、共通の時間傾向、局所的な時間の調整からなり、罰則付きの尤度で推定する（§3.1–3.3）。例：同じ整数論の難問で、Qwen3-8B-AWQは1478トークンで正答、3032トークンで誤答、4096トークンで打ち切りとなった（表1）。", "p4": "MATH（12,500問、難易度1〜5）に対する10の設定（4ビットAWQ量子化の9つとFP16のGemma4-E4B）の応答で、確率の当てはまりと、生成前のモデル・予算の選択（ルーティング）、繰り返しサンプリングのpass@kの予測を評価した（§2.3、§4–5）。", "p5": "仮想のトークン価格のもとで、ルーティングは強い基準に比べて平均費用を53.39%減らし、正答の完了率は96.42%（基準は97.30%）だった（抄録）。元の埋め込みでのkNNの削減は43.95%で、CRATERの費用はkNNより16.83%低かった（表5、評価1387問）。正答の完了のハザードは予算とともに下がり、未完のまま長引く応答ほど正答に至りにくかった（§6）。", "p6": "著者は、費用の削減は相対的なトークン価格に依存し、検証での品質の制約が評価の問題で成り立つとは限らないこと、選ばれた行動の多くが上限を保つため予算の選択そのものの利点は切り分けられていないことを限界とする（§6）。", "fun": "AIに数学の問題を解かせると、長く考えるほど正解に近づくことがありますが、時間切れで終わったり、長く考えた末に間違えたりもします。この研究は、病気の研究などで「いつその出来事が起きるか」を分析する統計の道具を使い、「いつ・どちらの結末で終わるか」を同時に予測しました。考える予算を決めれば正答の確率と費用が分かる、という実用性が面白いところです。", "unverified": "未査読のarXivプレプリント。pass@kの予測の精度（§5.2）とハザードの推定値の詳細は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "最先端VLMエージェントはまだロボット汎用機でない", "title": "Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena", "url": "https://arxiv.org/abs/2610.00854", "authors": "Haojian Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-04", "apa": "Huang, H., Zhao, P., Li, Z., Zhang, Y., Wei, Y., Li, W., Yang, H., Zhou, K., Chen, Y.-C., & Li, Y. (2026). Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena (Version 3). arXiv. https://doi.org/10.48550/ARXIV.2610.00854", "why": "10のVLMエージェントを幾何・空間推論・計画・操作などの1,000事例で比べ、計画と操作での限界を示した（HF上位）。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（評価の設計と主な結果の節）を読んだ", "preprint": true, "p1": "ロボットの汎用機に必要な、場面の解釈・行動・課題の全条件の充足を、10の最先端VLMエージェントで幾何・空間推論・アフォーダンス・課題計画・操作の5領域にわたって評価する場Embodied Agent Arenaを作り、計画と操作での限界を明らかにした（抄録、§4）。", "p2": "VLMは視覚と言語の理解に優れるが、それがロボットとして行動を実行し、課題の終了条件を満たす力にどこまでつながるかは、領域をまたいで統一的に評価されてこなかった（抄録、§1）。", "p3": "32の既存のベンチマークと、カメラ・動き・奥行き・尺度の推定を問う新しい168事例のGeoProbeを合わせた1,000事例を用意し、各ベンチマーク固有の観測・操作の接点を通じて判断をモデルに委ねる最小限の実行環境で評価した（抄録、§3.1–3.2）。", "p4": "Astra、Sol、Fable、Opus 5.5、Gemini 4 Argon、Qwen-397B、DeepSeekなど10のモデルを、固定入力の課題は5回（Fableは3回）の平均と標準偏差で、計画（157課題）と操作（182課題）は1回ずつの成否で比べ、失敗に費やしたトークンも分析した（§4.1）。", "p5": "非公開の重みのモデルが5領域すべてで上位だった。Qwen-Maxは空間推論のPass@1でAstraに近い（68.9%対69.4%）が、計画の完了は36.9%対80.3%だった。公開の重みのVLMは空間推論で48.0〜51.6%だが、計画は19.1〜31.2%、操作は9.9〜20.9%にとどまった。計画157課題のうち全10モデルが解いたのは8課題だけで、AstraではHumanCLAWの13課題が失敗トークンの81.7%を占めた（§4.2）。", "p6": "計画と操作は1回ずつの試行で、集計の重み付けを変えると操作の首位が入れ替わるなど、順位は課題の構成に依存する（§4.2）。解釈：コードの修復や自己点検といった追加の計算は失敗を一様には解消せず、正しい判断を覆すこともある（抄録）。", "fun": "写真を見て「コップはどこ？」と答えるのが得意なAIでも、ロボットの体を動かしてコップを棚に戻すとなると話は別です。この研究は最先端のAIを1,000の課題で試し、見る力が高くても、手順を最後までやり遂げる力や物を落とさずに扱う力は大きく劣る場合があることを示しました。「分かる」と「できる」の間の溝を測った点が面白いところです。", "unverified": "未査読のarXivプレプリント。各モデル名が指す具体的な版（付録B.2）と、領域別の全数値（表2）は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "人は推薦システムより自分の評価を当てる", "title": "You Know What You Will Like: People Predict Their Own Ratings Better Than Recommender Systems", "url": "https://arxiv.org/abs/2611.06696", "authors": "Zihan Chen ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Chen, Z., Zheng, L. N., & Zhu, D. (2026). You Know What You Will Like: People Predict Their Own Ratings Better Than Recommender Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06696", "why": "MovieLensの予想評価のデータで、本人の予想が推薦アルゴリズムにない情報を持つかを検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データ、比較する機械、精度の尺度、主な結果の節）を読んだ", "preprint": true, "p1": "映画の推薦の場で、利用者本人が「見たらどう評価するか」を予想した値が、プラットフォームや協調フィルタリングの予測より後の実際の評価をよく当て、推薦モデルにない情報を持つことを示した（抄録、§5）。", "p2": "推薦システムは行動の履歴から好みを学ぶが、本人に直接聞くこともできる。統計的予測の理論は本人の予想は多くの人の行動から作った予測にほとんど何も足さないとし、分散した知識の理論は本人がデータにない自分の好みの情報を持つとする（抄録、§2）。", "p3": "MovieLens Beliefsのデータで、2023〜2024年にトップページで未見の映画の予想評価を尋ねた26,020件のうち、1日以上後に実際の評価が付いた277人の551件を使い、予想を、プラットフォームの予測、行列分解（64因子）、アイテム近傍法、他の会員の結果で学習したスタック型の4つの基準と比べた（§4）。", "p4": "評価は、後の評価との相関と、同じ会員の2本の映画を正しい順に並べた割合（ペア順序精度）である。学習には予想の月より前の評価と本人の予想時点までの評価を使い、予想した組は学習から除いた（§4.3–4.4）。", "p5": "本人の予想と実際の評価の相関は0.69で、MovieLensの予測は0.34、学習した推薦は0.54〜0.59だった。予想をすべての機械の予測と特徴量に加えると、標本外の平均二乗誤差が26%下がった。一方、本人の映画の並べ替えでは学習した推薦と本人に統計的な差はなく、古くよく評価された映画では機械も同等以上だった。プロンプトの98.8%は無回答だった（抄録、§5）。", "p6": "予想の後に評価した組は551と少なく、答えた会員が選ばれた集団である可能性が残る（解釈）。著者は時期、追跡、繰り返しの予想、推薦の模倣などの頑健性を§6で確かめている。未査読のarXivプレプリントである。", "fun": "動画や映画のおすすめは、似た好みの大勢の行動から作られます。でも「これ、見たら何点つけそう？」と本人に聞くと、その予想の方がAIのおすすめより当たっていました。ただし、聞いてもほとんどの人は答えてくれません。大勢のデータで分かることと、本人しか知らないことの境目を測った点が面白いところです。", "unverified": "未査読のarXivプレプリント。頑健性の分析（§6以降）の数値と、導いた設計の原則の詳細は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "LLMは科学文献のレビューをどこまでできるか", "title": "Can Large Language Models Review the Scientific Literature? A Test Against a 102-Article Benchmark", "url": "https://arxiv.org/abs/2611.05459", "authors": "Abdullah Al Kalbani ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Kalbani, A. A., Schultz, D. M., Anderson-Frey, A. K., Zheng, Z., & McGuire, C. (2026). Can Large Language Models Review the Scientific Literature? A Test Against a 102-Article Benchmark (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05459", "why": "102本の論文からなる既存のレビューを基準に、6つのAIツールを探索・解釈・統合・提案の4段階で評価した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データと方法、限界の節）を読み、各段階の結果は抄録の要約で確認した", "preprint": true, "p1": "6つのAIツールに、既存の総説（スペインのプルームという気象パターン、102本）を基準として、文献の探索・解釈・統合・今後の研究の提案という文献レビューの4段階を通しで行わせ、どこで役に立ちどこで誤るかを評価した（抄録、§2）。", "p2": "LLMは文献レビューの支援に使われ始めているが、評価は個別の作業に限られ、レビューの過程全体を基準つきで検証した例はなかった（抄録、§1）。", "p3": "ChatGPTとGeminiのDeep Research、Claudeのウェブ版、端末で動くCodexとClaude Code、文書だけから答えるNotebookLMを、入門の有料プランで推論の設定を最大にして使った（§2.3、表1）。探索は基準の102本の再現、解釈は全PDFを渡したうえでの主題論文の判定と項目の抽出、統合は2人の専門家による盲検の評価で比べた（§3–5）。", "p4": "評価の基準は、見つけた論文の数、所属機関の図書館へのログインの効果、18本の主題論文と84本の言及だけの論文の分類の正しさ、統合の正確さと洞察、引用の正しさである（抄録、§3–5）。", "p5": "最初の探索では5つのツールで計57本、最良のツールで42本を見つけた。図書館の利用により、Codexは42本から82本、Claude Codeは15本から79本に増えた。全PDFを渡すと3つのツールが18本の主題論文をすべて正しく判定したが、84本の言及だけの論文の40〜79%を誤って主題と分類した。統合はおおむね正確だが洞察に乏しく、根拠のない主張や引用の誤り、合意の誇張を含むことがあった（抄録）。", "p6": "著者は、1つの話題・1組の文献・各課題1回の実行で偶然の変動を測っていないこと、ツールの条件（ログインやブラウザの状態）がそろっていないこと、基準の総説が学習に含まれていた可能性を否定できないことを限界とする（§8）。", "fun": "論文を何十本も読んでまとめる文献レビューは、研究者にとって大仕事です。AIに通しでやらせると、探す段階では大学の図書館に入れるかどうかで見つかる論文の数が倍増し、能力より入り口の問題だと分かりました。一方、本文を読ませると、少し触れているだけの論文まで「主題として扱っている」と判定しがちでした。得意な作業と危うい作業がはっきり分かれた点が面白いところです。", "unverified": "未査読のarXivプレプリント。統合の盲検評価の採点（§5.3）と、今後の研究の提案の評価（§6）の詳細は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "ソウルの塾への近さは住宅価格に織り込まれる", "title": "Priced In or Bet On? Cram-School Lessons, Jeonse Leases, and Expected Appreciation in Seoul", "url": "https://arxiv.org/abs/2611.05767", "authors": "Samiha Tariq", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Tariq, S. (2026). Priced In or Bet On? Cram-School Lessons, Jeonse Leases, and Expected Appreciation in Seoul (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05767", "why": "約220万件の売買・チョンセ契約で、塾への近さが住宅価格と賃料に織り込まれ、値上がり期待を含むかを検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（抄録、方法と識別の節、限界と次の段階）を読み、結果の数値は抄録で確認した", "preprint": true, "p1": "ソウルで受験塾（ハグォン）に近いマンションは売買価格もチョンセ（一括保証金の賃貸）の保証金も高いが、その上乗せは値上がり期待を含まず、今の便益として価格と保証金に比例して織り込まれていることを示した（抄録、§6）。", "p2": "韓国の家庭は受験塾に多額を支出するが、塾への近さが住宅でいくらの価値を持ち、その上乗せが将来の値上がり期待を含むのかは分かっていなかった（抄録、§1）。解釈：保証金と価格の比は、値上がり期待の有無を読み取る手がかりになる。", "p3": "2015〜2026年のソウルのマンションの売買とチョンセ契約2,197,510件を新しい事業所住所のジオコーダで位置づけ、同じ中学校の学区・同じ月の中で比べるヘドニック回帰、同じ団地・型・月での保証金と価格の比の比較、新規と更新の契約の比較、教育政策の発表の前後の比較を行った（§5）。", "p4": "評価は、500 m以内の高校生向け受験塾の数が中央値から97パーセンタイルに増えたときの価格と保証金の差、低学年向けの塾との対比（部分的な反証の検査）、保証金と価格の比の変化で、観察されない選択の強さの評価も示した（§5.6、§7.5）。", "p5": "高校生向けの受験塾への近さが中央値の団地から97パーセンタイルに移ると、売買価格は11.8%、保証金は7.3%高く、団地の規模を固定すると5.6%と5.9%だった。低学年向けの塾は売買の上乗せを加えなかった。同じ団地・型・月では塾への近さは保証金と価格の比を変えず（古い建物の建て替え価値は検出できた）、新規の借り手の上乗せも、教育政策の発表への反応もなかった（抄録）。", "p6": "著者は、上乗せは塾の供給の因果効果ではなく条件付きの関連で、より厳しい仮定ではOsterの限界が弱く、団地の規模を固定すると売買の上乗せが半減することを限界とし、小学校区内の比較や塾の開業・閉業を使う推定を次の課題とする（限界と次の段階）。", "fun": "韓国では大学受験のための塾通いが過熱しています。この研究は二百万件を超える住宅の取引から、受験塾の近くの家は高く売れ、高く貸せることを確かめました。面白いのは、その上乗せが「将来値上がりするから」ではなく「今、塾に通いやすいから」払われていると見分けた点です。家を買う値段と借りる値段の比を比べるという、うまい仕掛けを使っています。", "unverified": "未査読のarXivプレプリント（単著）。頑健性の分析（§7）の数値と、データの構築の詳細（§4、付録A）は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "マーケティング誌の媒介分析の証拠価値を測る", "title": "Noise in the process: Assessing the evidential value of mediation analyses in marketing and consumer psychology journals", "url": "https://doi.org/10.31234/osf.io/ck2r5_v4", "authors": "Amanda Kay Montoya ほか", "venue": "PsyArXiv", "date": "2026-11-05", "apa": "Montoya, A. K., Charlton, A., Krefeld-Schwalb, A., Price, J., & Hilgard, J. (2026). Noise in the process: Assessing the evidential value of mediation analyses in marketing and consumer psychology journals. https://doi.org/10.31234/osf.io/ck2r5_v4", "why": "信頼区間のゼロへの近さを集計する方法で、マーケティングと消費者心理学の媒介分析全体の証拠価値を評価した。", "explain": {"basis": "本文", "basis_note": "OSFのPDF本文（序論、方法、データの節、限界）を読んだ", "preprint": true, "p1": "マーケティングと消費者心理学の主要4誌で報告された媒介分析の証拠価値を、信頼区間のゼロへの相対的な近さ（RP）の分布で評価し、十分な検出力を想定したシミュレーションから大きくずれ、低検出力や効果ゼロのシミュレーションに近いことを示した（抄録、研究2）。", "p2": "媒介分析はこの分野の中心的な手法で、著者の調査では2018〜2020年の主要4誌の647本中308本（47.6%）が少なくとも1つ含む。しかし媒介変数や結果の選び方など、正当化できる多くの分析上の選択（研究者の自由度）が偽陽性を増やしうる（序論）。", "p3": "RPは間接効果の信頼区間がゼロからどれだけ離れているかを区間の幅で測る指標で、正なら有意、負なら区間がゼロを含む（パラメトリックな区間ではRP=(|z|−1.96)/3.92）。研究1で研究者の自由度が偽陽性率とRPに与える影響をシミュレーションし、研究2で論文から集めた検定統計量をRPに変換した（方法）。", "p4": "研究2では、Journal of Consumer Research、Journal of Consumer Psychology、Journal of Marketing、Journal of Marketing Researchの2018〜2020年の媒介分析のRPの分布を、効果ゼロ・低検出力・十分な検出力のシミュレーションの分布と比べた（データ）。", "p5": "研究1では、多くの媒介変数や結果を試す、調整付き媒介を検定するといった自由度が、検討したシナリオで偽陽性率を最大20%まで高め、RPが偽陽性とよく対応することを示した。研究2では、公表された媒介分析の分布は十分な検出力のシミュレーションから大きくずれ、低検出力と効果ゼロのシミュレーションに似ていた（抄録）。", "p6": "著者は、シミュレーションは単純な媒介だけで実際の研究の多様さを再現しきれないこと、RPは最近提案された指標で性質の研究が少ないこと、RPの分布が良くても因果の順序や交絡の問題は分からないことを限界とする（限界）。", "fun": "「広告が好感を生み、好感が購買を生む」のように、原因から結果への途中の道筋を調べるのが媒介分析です。でも途中の変数を何通りも試し、うまくいったものだけを報告すると、偶然の結果が本物に見えてしまいます。この研究は、公表された結果が有意の境目にどれだけ集まっているかを測り、分野全体の証拠の強さを健康診断した点が面白いところです。", "unverified": "OSFのプレプリント（Meta-Psychologyで審査中と記載）。研究2の分布の比較の数値と、集めた媒介分析の件数は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "時間とともに変わる裾の重さを推定・検定", "title": "Time-Varying Tails: Estimation, Inference, and Risk Measurement", "url": "https://arxiv.org/abs/2611.06005", "authors": "Shuo Li ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Li, S., & Peng, L. (2026). Time-Varying Tails: Estimation, Inference, and Risk Measurement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06005", "why": "極値指数を時間の滑らかな関数として推定し、一様信頼帯と裾の安定性の検定を備えたリスク測定の枠組みを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（枠組み・推定・シミュレーションの設定・実証・結論の節）を読んだ", "preprint": true, "p1": "経済・金融の時系列の裾の重さ（極値指数）を時間の滑らかな関数として推定し、一様信頼帯と裾の安定性の検定、時間変化する極端なVaRと期待ショートフォールの推定まで備えた枠組みを示した（抄録、§3–7）。", "p2": "金融の時系列の裾は時間とともに変わりうるが、移動窓のHill推定量は窓ごとに閾値が変わるため、裾の形の変化と、尺度の変化や閾値による雑音が混ざる（§1–2）。", "p3": "Zhou and Wu（2009）の局所定常の枠組みで極値指数γ(u)を時間uの滑らかな関数とし、局所窓全体に1つの中間分位点を共通の閾値とする比の形のカーネルHill推定量で推定する。共通の閾値により、裾の形を滑らかな尺度の変動から切り離せる（§4.1、§10）。一致性と漸近正規性を示し、一様信頼帯、極値の集積のもとでの安定性の検定、Weissmanの外挿によるリスク尺度を導いた（§5–7）。", "p4": "γ(u)=0.2+0.3uの3つの生成過程（厳密なパレート、t分布など）のモンテカルロで有限標本の性能を確かめ、1990〜2026年のS&P 500の日次損失（n=9179）に適用した（§8–9）。", "p5": "S&P 500の損失の極値指数の水準は0.300で、経路は[0.216, 0.421]の範囲で動いたが、安定性の検定のp値は0.220で一定の形と矛盾しなかった。ボラティリティで調整したGARCH残差では水準0.211で、p値0.019と有意に時間変化した（表5）。リスク尺度では、中間分位点の時間更新が予測を大きく改善した（§10）。", "p6": "著者は、難しい設計で一様帯を改善するにはバイアス補正が必要で、調整パラメータのデータに基づく選択と、裾の依存を含む多変量への拡張が今後の課題だとする（§10）。応用では局所の超過数が少なく、点ごとの標準誤差は広い（§9）。", "fun": "株価の暴落のような「めったに起きない大きな損失」がどれくらい起こりやすいかは、分布の裾の重さで決まります。この研究は、その裾の重さが時代によって変わるかを統計的に確かめる道具を作りました。株価の損失そのものの裾は意外にも一定と見なせる一方、相場の荒れ具合をならした後の裾は時代とともに変わっていた、という発見が面白いところです。", "unverified": "未査読のarXivプレプリント。シミュレーションの被覆率（§8）とリスク予測の評価の数値は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "社会の進歩を測る99指標の品質を監査", "title": "Auditing the measurement quality of societal progress: A six-criterion framework applied to 99 indicators", "url": "https://doi.org/10.31234/osf.io/hmgsx_v3", "authors": "Peter Diep ほか", "venue": "PsyArXiv", "date": "2026-11-04", "apa": "Diep, P., Clark, C. J., Matthews, M., Tetlock, P., & Grossmann, I. (2026). Auditing the measurement quality of societal progress: A six-criterion framework applied to 99 indicators. https://doi.org/10.31234/osf.io/hmgsx_v3", "why": "公民権・気候・経済・健康など8領域の99指標を、定義可能性やデータの公開など6つの基準で監査した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv（OSF）の抄録を使用し、本文は入手できず", "preprint": true, "p1": "社会の進歩を測る広く使われる99の指標を、定義可能性・数量化・データの公開・世界人口の網羅・文書化・時間分解能の6基準で監査し、すべてを満たすのは32%にとどまることを示した（抄録）。", "p2": "政策立案者や研究者には、中身を点検でき、データを入手でき、最新だと信頼できる社会指標が必要だが、広く使われる指標がこうした測定の妥当性の前提を満たしているかは体系的に調べられていなかった（抄録）。", "p3": "専門家の推薦による62指標に、研究チームが加えたよく使われる37指標を合わせた99指標を、公民権・気候・経済・教育・平和と戦争・公衆衛生・技術・well-beingの8領域から集め、社会科学者が測定の妥当性の前提とする6つの基準に照らして監査した（抄録）。", "p4": "評価は、各基準を満たす指標の割合、すべての基準を満たす割合、領域間の違いである（抄録）。各基準の判定の手順と評定者間の一致は抄録では未確認。", "p5": "6基準すべてを満たした指標は32%（公開データのある指標では43%）だった。最も多い不合格は文書化と時間分解能で、領域間に信頼できる差は見られなかった（抄録）。", "p6": "著者は、人間の進歩と社会変化の多くの領域が点検できない指標に頼っていることは、世界的な政策の取り組みの実証的な土台に疑問を投げかけると論じる（抄録）。解釈：6基準は測定の前提条件で、指標が目的の概念を正しく測っているか（構成概念の妥当性）までは評価していない。", "fun": "「世界は良くなっているか」を語るとき、私たちはさまざまな指標の数字に頼ります。ところが、よく使われる99の指標を調べると、定義がはっきりし、データが公開され、世界中をカバーし、作り方が説明され、頻繁に更新される、という基本の条件をすべて満たすのは3分の1ほどでした。数字そのものの「健康診断」をしたら意外に弱かった、という点が面白いところです。", "unverified": "抄録のみ読んだ。指標の一覧、各基準の判定の手順、評定者間の一致は未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "障害者の最低賃金除外の廃止と事業者の反応", "title": "Firm Responses to State Elimination of Section 14(c) Subminimum Wages", "url": "https://doi.org/10.2139/ssrn.7679984", "authors": "Michelle Yin ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Yin, M., & Vu, H. (2026). Firm Responses to State Elimination of Section 14(c) Subminimum Wages . https://doi.org/10.2139/ssrn.7679984", "why": "州ごとに段階的に進んだ廃止を使い、14(c)の最低賃金除外の廃止が事業者の参加・閉鎖・収入に与えた影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "障害のある労働者に連邦最低賃金未満の支払いを認める14(c)を州が廃止すると、事業者の制度離脱は増えるが閉鎖は有意に増えず、残った事業者の収入は増えたことを示した（抄録）。", "p3": "2015〜2024年の全認定事業者のパネルをForm 990の財務申告と結びつけ、州ごとに廃止の時期が違うことを使って影響を推定した（抄録）。", "p5": "14(c)から離脱する年間確率は約25ポイント上がったが、組織の閉鎖は有意に増えなかった。残った事業者の収入は約17%増え、役員報酬と一般職員の賃金は有意に変わらなかった。財政の較正では、基本の仮定のもとで公的資金の限界価値は4.49だった（抄録）。", "fun": "障害のある人に最低賃金より低い給料を払える制度をやめると、雇う側の団体がつぶれて働く場がなくなるのでは、という心配がありました。州ごとに廃止の時期が違うことを使って確かめると、制度から抜ける団体は増えたものの、閉鎖は目立って増えませんでした。制度変更の「予想される副作用」をデータで確かめた点が面白いところです。", "unverified": "障害のある労働者本人の雇用や賃金への影響は抄録では未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "選択肢の確率を返す決定モデルを人の代理に", "title": "Decision Models as Scalable Economic Surrogates that Capture Human Variation", "url": "https://arxiv.org/abs/2611.05553", "authors": "Maxime Saxena ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Saxena, M., Caccioli, F., & del Rio-Chanona, R. M. (2026). Decision Models as Scalable Economic Surrogates that Capture Human Variation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05553", "why": "選択肢の確率分布を返す新しいAIモデルが、経済実験で人のばらつきをどこまで再現できるかを検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "選択肢への確率分布を返す新しいAIモデル（決定モデル）が、経済のシミュレーションや調査で人の代わりとして、LLMより人の回答のばらつきをよく再現することを示した（抄録）。", "p3": "10の決定モデルと8つのLLMを、家計の支出調査、古典的な経済ゲーム、労働市場のフィールド実験の3つの設定で比べた（抄録）。", "p5": "最先端の決定モデルは3つの設定すべてでLLMより人の回答のばらつきに近く、支出調査では最頻の回答もLLMと同程度に捉えたが、経済ゲームではLLMに劣った。速さは最速のLLMの約10倍で、費用は100分の1以下になりうる（抄録）。", "fun": "AIに「人ならどう答えるか」を代わりに答えさせる研究が増えていますが、LLMは答えが似通いがちで、人の多様さを写しにくいという弱点がありました。この研究は、選択肢ごとの確率を直接返すタイプのAIの方が人のばらつきをよく再現し、しかも速く安いことを示しました。「平均的な答え」ではなく「答えの散らばり」を再現する視点が面白いところです。", "unverified": "使った決定モデルとLLMの名称、ばらつきの再現度の指標の値は抄録では未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "AIの影響を受けやすい職ほど過酷な条件は少ない", "title": "Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure", "url": "https://arxiv.org/abs/2611.06888", "authors": "Siyi Yu", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Yu, S. (2026). Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06888", "why": "O*NETの21項目と754職業で、AI曝露の高い職業ほど単調・汚い・危険な労働条件のスコアが低いことと、その解釈が項目の束ね方で変わることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIへの曝露が高い職業ほど単調・汚い・危険な労働条件のスコアが低いことを示し、曝露の推計の解釈が項目の束ね方と職業の特性に左右されることを示した（抄録）。", "p3": "米国の754職業についてO*NETの21項目で労働条件を測り、LLMに基づく曝露指標とAIOE（AI職業曝露）との関係を、職業の均等な重みと雇用の重みで調べた。身体的負担、必要な教育・訓練・経験、賃金で調整した（抄録）。", "p5": "曝露が高いほど条件のスコアは低かったが、調整すると関連は弱まり、LLM指標では信頼区間がゼロを含み、AIOEではゼロを下回ったままだった。反復作業と裁量の制限を分けると「単調さ」の合成スコアの意味も変わった（抄録）。", "fun": "ロボットやAIは「退屈で汚くて危ない仕事」から人を解放する、とよく言われます。ところが職業ごとに調べると、AIの影響を受けやすいのは、むしろそうした条件の少ない仕事でした。さらに、何を「単調」と数えるかで結論の見え方が変わることも示しており、数字の作り方そのものに注意を促している点が面白いところです。", "unverified": "関連の大きさ（係数）の数値は抄録では未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "動画ストリーミングの強化学習をターン単位の報酬で", "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "url": "https://arxiv.org/abs/2611.06728", "authors": "Shuai Dong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Dong, S., Tian, K., Chen, L., Shao, W., Wu, H., Hou, H., Zhu, Y., Wang, X., Wang, Z., Liu, W., Xie, W., Xu, Y., Wang, C., Tuo, K., Ma, C., Wu, T., Zhao, J., Chang, W., Wang, D., … Wang, J. (2026). Turns Matter: Advancing Streaming Video RL via Turn-Level Credit (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06728", "why": "軌跡全体で共有していた利得を各ターンの判断に割り当てるGRPOの改良で、冗長な応答を減らした（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "ストリーミング動画の理解で、応答するか観察を続けるかという各ターンの判断に報酬を割り当てるGRPOの改良TurnWiseを提案した（抄録）。", "p3": "沈黙で補完した接頭部の採点で、各判断の残りの収益から群相対の利得を作り、それ以前の報酬と学習信号を切り離す。トークンの損失をターン内で平均してからターン間で平均し、応答と待機の判断を出力の長さに関係なく同じ重みにする（抄録）。", "p5": "学習した価値関数（クリティック）も追加のロールアウトも使わずに方策学習を改善し、広範な実験で従来のRL手法を上回ったと述べる（抄録）。", "fun": "生中継の動画を見ながら質問に答えるAIは、「今答えるか、もう少し見るか」を何度も決めます。最後に全体の点数だけを伝えると、どの判断が良かったのかが分かりません。試合の後に勝敗だけでなく一つひとつのプレーを振り返るように、判断ごとに手柄を割り振る工夫が面白いところです。", "unverified": "比較した手法と性能の数値は抄録では未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "物理研究を通しで行うAIエージェントの評価", "title": "FrontierPhysics: Evaluating Agents for End-to-End Physics Research", "url": "https://arxiv.org/abs/2611.06910", "authors": "Bingran You ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "You, B., Ke, W., Rosenauer, R., Liu, B., Chen, W., Chen, M., Xu, S., Ma, Y., Feng, J., Chen, B., Sun, X., Liu, J., Guo, J., Zhou, Z., Huang, X., Li, Z., Li, H., Lin, H., Ding, L., … Haeffner, H. (2026). FrontierPhysics: Evaluating Agents for End-to-End Physics Research (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06910", "why": "固定問題ではなく研究全体を通してエージェントを評価する物理のベンチマークを作った（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "物理学者が自分の研究をもとに作った課題で、文献調査から論文執筆までの研究全体をAIエージェントに行わせて評価するベンチマークFrontierPhysicsを作った（抄録）。", "p3": "42人の物理学者が理論・計算・実験の9分野で作った56課題について、文献の調査、研究計画、研究と実験、構造化された出力と論文原稿を求め、決定的な検証器と専門家の採点基準で正しさと出版の可能性を評価した（抄録）。", "p5": "22モデル・26構成のどれも、168回の試行のうち46回を超えて合格しなかった。軌跡の点検では、主な弱点は物理の知識や実行の誤りではなく、推論の厳密さの不足と専門家の直観の欠如だった（抄録）。", "fun": "AIは物理の試験問題なら解けるようになってきましたが、研究は「何を問うか」から自分で決める仕事です。本物の研究者が作った課題で通しで研究させると、最良の設定でも合格は4分の1あまりでした。知識が足りないのではなく、詰めの甘さと勘所の弱さが壁だった、という分析が面白いところです。", "unverified": "モデル別の成績と、分野ごとの内訳は抄録では未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "画素から直接行動へつなぐ視覚-言語-行動方策", "title": "From Pixels to Actions - Towards Native Vision-Language-Action Policies", "url": "https://arxiv.org/abs/2611.06918", "authors": "Weichen Fan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Fan, W., Diao, H., Wu, P., Hu, S., Huang, Z., Liu, T., Sun, M., Wang, Z., Cai, Z., Deng, H., Wang, Q., Yang, L., Lu, L., Hong, F., Chen, Z., Lin, D., & Liu, Z. (2026). From Pixels to Actions - Towards Native Vision-Language-Action Policies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06918", "why": "知覚を圧縮してから行動を推論する従来のVLAの設計を見直し、画素から行動へ直接つなぐ方策を提案した（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "視覚エンコーダを持たず、画像を言語と一緒に基盤モデルの中で処理する視覚-言語-行動（VLA）の枠組みNEO-VLAを提案し、エンコーダ型より強く頑健な操作制御を示した（抄録）。", "p3": "画像を軽量なパッチ畳み込みでトークン化して言語とともに基盤全体で処理し、フローマッチングの行動エキスパートが異なる深さの、指示を条件とする視覚表現を使えるようにした（抄録）。", "p5": "制御した比較で、エンコーダを持たない構造はエンコーダ型を上回り、全体の微調整で差は縮むが消えず、規模を増やすだけでは追いつかなかった。層ごとの調査では、行動に重要な信号は最終の視覚表現よりかなり手前で最大になることが多かった（抄録）。", "fun": "ロボットにものをつかませるとき、カメラの画像をまず「要約」してから動きを考えるのが普通でした。しかし、物の縁や奥行き、小さな変化といった大事な手がかりは、要約の途中で失われやすいものです。途中の段階の情報を直接使えるようにしたら操作が上手になった、という点が面白いところです。", "unverified": "成功率などの具体的な数値と、比較したモデル名は抄録では未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "多ターン強化学習はLLMエージェントの何を改善するか", "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "url": "https://arxiv.org/abs/2611.06483", "authors": "Kejian Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Zhu, K., Jin, Z., Tu, S., Men, T., Hao, Y., Li, J., Liu, K., & Zhao, J. (2026). What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06483", "why": "サンプリング幅と対話の制約を変えて、多ターン強化学習の改善がどこから来るかを分解した（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントの多ターン強化学習の効果は対話のターン予算に強く依存し、改善の中心は1手ごとの判断の質ではなく、誤りからの回復と長期の粘り強さにあることを示した（抄録）。", "p3": "サンプリングの幅Kと対話の深さTを変えるPass@(K,T)で評価し、過程の監督信号の利点と限界を議論し、訓練中に対話の予算を変えるBudgetMix RLを提案した（抄録）。", "p5": "軌跡レベルのRLの利点はターン予算が十分なときに現れ、予算を絞ると大きく減った。BudgetMix RLは多様な実行設定で頑健な性能を示したと述べる（抄録）。", "fun": "長い作業をこなすAIを強化学習で鍛えると、確かに上手になります。でもそれは一手一手が賢くなったからではなく、失敗してもやり直して立て直す力がついたからでした。だから、やり直せる回数が少ない場面では強みが消えてしまいます。何が上達したのかを分解した点が面白いところです。", "unverified": "使ったモデルと課題、改善幅の数値は抄録では未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "思考の連鎖の分布外汎化を理論的に説明", "title": "Understanding the Out-of-Distribution Generalization of Chain-of-Thought Reasoning in LLMs", "url": "https://arxiv.org/abs/2611.06438", "authors": "Nuo-Jing Liang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Liang, N.-J., Yuan, X.-T., & Zhou, P. (2026). Understanding the Out-of-Distribution Generalization of Chain-of-Thought Reasoning in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06438", "why": "Chain-of-Thoughtを合成として捉え、分布外への汎化の仕組みを理論的に分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "思考の連鎖（CoT）が分布外の課題に汎化する仕組みを、共有された1ステップの予測器で学習済みの遷移を組み合わせることとして理論的に説明した（抄録）。", "p3": "目標課題の完全な推論の軌跡や入出力の対がなく、訓練には分布内の原子的なステップのデータしかない合成的な汎化として定式化し、ラデマッハ複雑度で推定の誤差を評価した。Atom-TaskとGSM8Kで実験した（抄録）。", "p5": "分布外のリスクは、分布内の部分課題のリスクの和にステップ数Tに依存しないO(k)の係数をかけたもので抑えられ、推定項はTに線形ではなくO(√(T/n))だった。実験は、CoTが短い問題から長い問題への汎化を可能にし、状態の明示的な追跡が重要であることを支持した（抄録）。", "fun": "AIに「途中の式を書きながら解いて」と頼むと、習ったことのない長い問題まで解けることがあります。この研究は、AIが短い一歩一歩を部品として学び、その部品を何度も組み合わせて長い道のりをたどるからだ、と数学的に説明しました。九九を覚えれば大きな数のかけ算もできるのに似た構図です。", "unverified": "実験での正答率の数値は抄録では未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "強化学習で汎用ロボット方策を継続的に改善", "title": "Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement", "url": "https://arxiv.org/abs/2611.06905", "authors": "Michal Korniak ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Korniak, M., Bagatella, M., Römer, R., Nauman, M., As, Y., Vignesh, P., Agarwal, M., Diaz-Bone, L., Zalewski, P., Czarnecki, M., Treven, L., Saxena, S., Venkataraman, S., Patil, S., Zhou, Z., Marta, D., Mees, O., Shafiullah, N. M. M., Sferrazza, C., … Wagenmaker, A. (2026). Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06905", "why": "事前学習した汎用ロボット方策を強化学習で改善する方法を規模拡大して示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "汎用ロボット方策を実運用で多数の課題にわたって同時にオンラインで改善でき、適切な手順なら訓練に含めなかった課題の性能も上がることを示した（抄録）。", "p3": "汎用的な改善の能力を試す構造化された評価を作り、価値の推定、方策の抽出、資源の配分についてのアルゴリズムと実務上の設計を系統的に比べた（抄録）。", "p5": "汎用方策は多様な課題でオンラインに改善でき、汎化が起きる条件として訓練課題の分布と価値ベースのRLの使用が決定的だった。ロボットの基盤モデルのオンラインでの汎用的な改善を示した最初期の証拠だとする（抄録）。", "fun": "何でもこなせるように大量のデータで学んだロボットも、実際の現場ではもう一段の練習が必要です。これまでは一つの作業だけを練習させるのが普通でしたが、この研究は多くの作業を同時に練習させ、練習していない作業まで上手になる場合があることを示しました。練習の仕方次第で応用力まで伸びる点が面白いところです。", "unverified": "使ったロボットと課題の数、性能の向上幅は抄録では未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "推論モデルは概念の抽象化を獲得しているか", "title": "ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models", "url": "https://arxiv.org/abs/2611.06732", "authors": "Philipp Mondorf ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mondorf, P., Deliège, A., LeGris, S., Beger, C., Yi, R., Plank, B., Lake, B. M., & Gureckis, T. M. (2026). ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06732", "why": "ConceptARCを大規模化し、推論モデルが概念的に関連する課題の間で一般化できるかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "特定の概念を狙ったARC形式の課題を大量に作る生成器を作り、推論モデルが概念をまたいで安定した抽象を形成しているかを調べた（抄録）。", "p3": "生成器で16の概念ごとに100課題、計1,600の人手で確認した課題からなるConceptARC-100を作り（元のベンチマークの10倍）、最近の推論モデルとゼロから学習したモデルを評価して内部表現も分析した（抄録）。", "p5": "課題の内部表現は、規則や場面が大きく違っても、物体への操作（色の付け替え、除去、平行移動など）ごとにまとまった。モデルは変換操作の安定した抽象を形成し、多様な課題に一般化しているとみられる（抄録）。", "fun": "数個の例からパズルの規則を見抜く課題で、AIが本当に「考え方」をつかんでいるのかは分かりにくい問題でした。この研究は同じ考え方を使う問題を大量に作って調べ、AIの内部では「色を塗り替える」「取り除く」といった操作ごとに問題が整理されていることを見つけました。見た目の違う問題を同じ仲間と見抜いている点が面白いところです。", "unverified": "概念ごとの正答率の数値と評価したモデル名は抄録では未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "ニューラル点過程とホークス過程を再評価", "title": "Flexible Intensities Matter: A Comprehensive Re-evaluation of Hawkes Processes and Neural Temporal Point Processes", "url": "https://arxiv.org/abs/2611.06348", "authors": "Hendrik Mehrtens ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mehrtens, H., Buettner, F., & Stegle, O. (2026). Flexible Intensities Matter: A Comprehensive Re-evaluation of Hawkes Processes and Neural Temporal Point Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06348", "why": "時間点過程の手法を包括的に再評価し、強度関数の柔軟性が性能を左右することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ニューラル時間点過程がホークス過程を大きく上回るという従来の報告は、比較の相手が最も制限された形のホークス過程だったためで、柔軟にすれば差はほぼ消えることを示した（抄録）。", "p3": "柔軟性を段階的に高めたポアソン・ホークス過程とニューラル時間点過程を、5つの既存ベンチマークと、UK Biobankの疾患歴とMIMIC-IVのICU記録による2つの大規模な課題で、次の事象の自己回帰的な予測として比べた（抄録）。", "p5": "学習できる基底と核を持つホークス過程ではニューラルモデルとの差がほぼ消えた。スプライン強度のTransformerは従来の強度型ニューラル点過程を上回り、強度を使わないモデルと同等だった。柔軟性の利点はほぼすべて時刻の密度の項にあり、事象の種類の項は改善しなかった（抄録）。", "fun": "地震の余震やSNSの投稿の連鎖のように、出来事が出来事を呼ぶ現象を表す古典的な数式モデルがあります。最新のAIの方がずっと優れていると言われてきましたが、比べる相手の古典モデルを不利な形に縛っていたことが分かりました。公平な条件にそろえると差はほぼ消える、という「比較の仕方」の大切さが面白いところです。", "unverified": "医療記録は手法比較の素材として使われたもので、臨床の結論は扱わない。ベンチマークごとの数値は抄録では未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "実リポジトリの共同作業でAIエージェントを評価", "title": "SlackBench: Benchmarking Agents on Collaborative Projects Grounded in Real Code Repositories", "url": "https://arxiv.org/abs/2611.05512", "authors": "Mingxuan Li ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Li, M., Mao, H., Zheng, R., James, J. S., Li, Y., Anderson, N., Gonzalez, J. E., & Dimakis, A. (2026). SlackBench: Benchmarking Agents on Collaborative Projects Grounded in Real Code Repositories (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05512", "why": "実際のコードリポジトリに基づく共同プロジェクトで、同僚として働くAIエージェントを評価するベンチマークを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "実際の研究プロジェクトを再現した会話とコードの変更をもとに、職場の連絡とリポジトリの状態をあわせて推論するAIエージェントを評価するベンチマークSlackBenchを作った（抄録）。", "p3": "実在の学術研究プロジェクトをプライバシーに配慮して再演し、複数人の対話、変わっていく決定、GitHubとGoogle Docsに基づくコードの変更を持つ再現可能な環境を用意した。140の問いは、異種の情報源の探索、答えられない・前提が誤った質問での回答の保留、目的に沿った要約、長い会話からの状況の推論を含む（抄録）。", "p5": "課題は静的な文書の質問応答に還元できず、エージェントはどの会話が重要かを見きわめ、スレッドをたどり、リポジトリの状態を調べて証拠を統合する必要があると述べる（抄録）。", "fun": "職場で「あの件どうなったっけ？」と聞かれたら、チャットの過去のやり取りを探し、資料やプログラムの最新の状態を確かめ、食い違う情報を整理して答えます。人には当たり前のこの作業を、AIの同僚がどこまでできるかを測る試験です。「答えられない質問には答えない」ことも採点に入っている点が面白いところです。", "unverified": "エージェントごとの成績は抄録では未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "分布から分布への回帰に共形予測を拡張", "title": "Conformal Prediction for Distribution-to-Distribution Regression", "url": "https://arxiv.org/abs/2611.06320", "authors": "Trung-Khang Tran ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Tran, T.-K., Hoang, T. A., Tran, V.-H., & Nguyen, T. M. (2026). Conformal Prediction for Distribution-to-Distribution Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06320", "why": "入力も出力も分布である回帰に、有限標本の被覆保証を持つ共形予測を拡張した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "入力も出力も確率分布である回帰（分布から分布への回帰）で、被覆の保証を保ちつつ解釈しやすい予測集合を作る共形予測の枠組みを示した（抄録）。", "p3": "分割共形予測を素朴に当てはめると、周辺的には妥当でも体積や標本の取り方が定まらない予測集合になることを示し、直交基底の空間で働く新しい共形の枠組みと、緩い仮定で漸近的な条件付き被覆を持つ適応型を提案した（抄録）。", "p5": "合成データと実データで提案法の有効性を確かめたと述べ、コードを公開している（抄録）。", "fun": "「明日の気温はこのくらいの範囲」と幅で予測するのは分かりやすいですが、予測したいもの自体が「分布」（たとえば一日の気温のばらつき方）だと、幅の取り方が難しくなります。この研究は、分布を基本の形の組み合わせに分解し、その係数の空間で幅を決める工夫をしました。予測の幅を意味の分かる形にする点が面白いところです。", "unverified": "実データの種類と、予測集合の大きさの比較の数値は抄録では未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "差分プライバシーで合成グラフを多項式時間で公開", "title": "Polynomial-Time Differentially Private Synthetic Graph Release with Nearly-Linear Additive Error", "url": "https://arxiv.org/abs/2611.06670", "authors": "Marek Eli\\'a\\v{s} ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Eliáš, M., Kamath, G., Kulkarni, J., Li, G. Z., Liu, J., Mahabadi, S., Peng, P., Tarnawski, J., Xu, H., & Zou, Z. (2026). Polynomial-Time Differentially Private Synthetic Graph Release with Nearly-Linear Additive Error (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06670", "why": "全カットの値をほぼ保つ合成グラフを、辺の差分プライバシーのもと多項式時間で公開するアルゴリズムを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "非負の重み付きグラフのすべてのカットの値をほぼ保つ合成グラフを、辺の差分プライバシーを満たしつつ多項式時間で公開するアルゴリズムを示し、加法誤差をほぼ線形まで下げた（抄録）。", "p3": "log-det正則化した半正定値計画で乗法的重み更新のための分数的な問い合わせを作り、全カットの精度を保証する。プライバシーの損失は、以後の反復から退いた辺の座標の質量に応じて分数的にだけ計上する（抄録）。", "p5": "γとεを固定しδ=β=n^-10とすると加法誤差はn polylog nで、従来の効率的な上界n^(13/12+o(1))を改善した。下界Ω(n/γε)も示し、対数の多項式因子を除いて最適だとした。相関クラスタリングやMax-Cutなど下流の課題の誤差も改善した（抄録）。", "fun": "人と人のつながりのデータは、誰と誰がつながっているかという秘密を含みます。この研究は、その秘密を守りながら、「グループを二つに分けたときに間を通る線の量」をどの分け方でもほぼ正しく保つ偽のグラフを、現実的な時間で作る方法を示しました。しかも理論上ほとんどこれ以上は改善できない精度に達している点が面白いところです。", "unverified": "実装と実データでの計算時間の評価は抄録では未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "ランダム効果の予測値を回帰に使う偏りを補正", "title": "REPAIR: Random-effect prediction adjustment for inference in regression", "url": "https://doi.org/10.31234/osf.io/gbwqd", "authors": "Zachary Andrew Vig ほか", "venue": "PsyArXiv", "date": "2026-11-05", "apa": "Vig, Z. A., & Hallquist, M. N. (2026). REPAIR: Random-effect prediction adjustment for inference in regression. https://doi.org/10.31234/osf.io/gbwqd", "why": "多層モデルのランダム効果の予測値を別の回帰に使うときの推論を補正する方法REPAIRを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多層モデルのランダム効果の予測値を別の回帰で使うときに生じる係数と標準誤差の歪みを補正する2段階の枠組みREPAIRを示した（抄録）。", "p3": "線形ガウスの多層モデルで一般化最小二乗法により尤度だけに基づく予測値を求め、推定したクラスターごとの標本誤差の共分散を使う正則化したモーメント法で構造的なモーメントを補正する。ランダム効果を説明変数、結果変数、その両方とする4つのシミュレーションで評価した（抄録）。", "p5": "予測変数の信頼性が中〜高のとき偏りは小さく、ほかの方法よりRMSEが小さいことが多かった。信頼性が低いとき、とくに小標本での信頼区間の被覆は課題として残った（抄録）。", "fun": "一人ひとりの「伸びの速さ」や「ストレスへの反応の強さ」を多層モデルで推定し、それを別の分析に使うことはよくあります。ところが、その推定値は縮みと誤差の両方を含むため、そのまま使うと結論がゆがみます。推定値に含まれる誤差の分だけ補正する、という地道で実用的な工夫が面白いところです。", "unverified": "シミュレーションの条件の詳細と、補正の前後の偏りの大きさは抄録では未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "事前データ適合ネットワークでベイズ変数選択", "title": "Prior-data fitted networks for variable selection", "url": "https://arxiv.org/abs/2611.05966", "authors": "Omar Melikechi", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Melikechi, O. (2026). Prior-data fitted networks for variable selection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05966", "why": "表形式の予測で最先端の事前データ適合ネットワーク（PFN）をベイズ変数選択に応用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式の予測で最先端の事前データ適合ネットワーク（PFN）をベイズ変数選択に使う2つのモデル、条件付き依存を見つけるCD-PFNと因果グラフの親子を見つけるPC-PFNを示した（抄録）。", "p3": "どちらも事後分布のサンプルやデータごとのモデル化なしに、各変数の事後包含確率（PIP）を推定する（抄録）。", "p5": "半合成データと実データの実験で、CD-PFNとPC-PFNは既存の手法をしばしば上回ったと述べ、ソフトウェアを公開している（抄録）。", "fun": "たくさんの変数の中から本当に効いているものを選ぶのは、統計の古典的な難問です。この研究は、大量の模擬データで「選び方」そのものを前もって学習したAIに、新しいデータを見せるだけで答えを出させました。毎回モデルを組み立て直さずに済む、という発想の転換が面白いところです。", "unverified": "比較した既存の手法と性能の数値は抄録では未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "多層ネットワークの時系列を潜在レジームで分類", "title": "A latent space hidden Markov model for clustering views in longitudinal multilayer networks", "url": "https://arxiv.org/abs/2611.06472", "authors": "Cecilia Manente ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Manente, C., Alfò, M., & D'Angelo, S. (2026). A latent space hidden Markov model for clustering views in longitudinal multilayer networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06472", "why": "縦断的な多層ネットワークを有限個の潜在レジームで表す潜在空間の隠れマルコフモデルを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "縦断的な多層ネットワークの各時点・各層を、繰り返し現れる有限個の潜在レジームとその幾何的な配置で表してクラスタリングする、ベイズ潜在空間モデルを提案した（抄録）。", "p3": "層ごとの隠れマルコフ連鎖が簡潔な加法的遷移モデルでレジームへの所属を決め、共通の潜在配置を共有しつつ層ごとに異なる時間の動きを許す。辺の重みはハードル負の二項分布で過剰なゼロと過分散を扱い、送り手・受け手の拡張も用意した（抄録）。", "p5": "シミュレーションでレジームと配置を正確に復元でき、その精度はレジームどうしの似かたに依存した。GDELTの地政学的イベントと欧州議会の点呼投票のデータに適用した（抄録）。", "fun": "国どうしの関係を、協力・対立など何層にも分けて時間の流れで見ると、いくつかの決まった「状態」を行き来しているように見えることがあります。この研究は、その状態と、状態ごとの国どうしの位置関係を同時に推定するモデルを作りました。複雑なつながりの変化を少数の型にまとめる発想が面白いところです。", "unverified": "応用で得られたレジームの具体的な解釈は抄録では未確認。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "共分散が未知だと次元に依らない私的平均推定は不可能", "title": "Dimension-Free Private Mean Estimation is Impossible Without the Covariance", "url": "https://arxiv.org/abs/2611.06615", "authors": "Renaud Gaucher ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Gaucher, R., Linder, E., Smith, A., Ullman, J., & Zakynthinou, L. (2026). Dimension-Free Private Mean Estimation is Impossible Without the Covariance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06615", "why": "共分散が未知のガウス平均の差分プライバシー推定で、次元に依存しない標本数が達成できないことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "共分散が未知のとき、差分プライバシーのもとでのガウス平均の推定は、共分散が既知の場合のような次元に依存しない保証を達成できないことを、新しい下界で示した（抄録）。", "p3": "ユークリッド誤差でのガウス平均の推定について、標本サイズが実効次元より小さい場合と大きい場合に分け、共分散が未知のときの最適誤差の下界を導いた（抄録）。", "p5": "標本サイズが実効次元より小さいとき、未知の場合の最適誤差は既知の場合より√(d/n)倍大きくなりうる。大きいときも、実効次元がlog d以下の対角共分散でさえ√d/n^(3/2)倍大きくなりうる（抄録）。", "fun": "個人のデータを守りながら平均を推定する方法では、データのばらつき方（共分散）が分かっていれば、変数の数が多くても精度を保てることが知られていました。この研究は、ばらつき方が分からないとその恩恵が消えることを証明しました。何を前もって知っているかで、秘密の保護と精度の両立の限界が変わる点が面白いところです。", "unverified": "上界（達成できる手法）との差の詳細は抄録では未確認。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "疎なグラフォンの次数分布に一様中心極限定理", "title": "Uniform Central Limit Theorems for Degree Distributions of Sparse Graphon Models", "url": "https://arxiv.org/abs/2611.06892", "authors": "Robert Lunde ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Lunde, R., & Lahiri, S. (2026). Uniform Central Limit Theorems for Degree Distributions of Sparse Graphon Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06892", "why": "グラフォンモデルの経験次数分布に初めて関数型の極限定理を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "疎なグラフォンモデルの経験次数分布について、有限次元・関数型・一様の中心極限定理を示した。密で有界なグラフォンでも関数型の極限定理はこれまでなかった（抄録）。", "p3": "非有界な核（重い裾の次数）を許す疎なL^pグラフォンを対象に、条件付き次数分布の正確な多重線形表現でHoeffding分解を特定し、格子版のBillingsleyの緊密性の基準とEfron-Stein型のモーメント不等式を組み合わせた（抄録）。", "p5": "潜在的な期待次数が密度を持つとき、疎さの条件のもとで有限次元のCLTが成り立ち、極限の共分散は密な場合と一致した。局所的な正則性のもとで台の内部の区間上の関数型CLTを、裾の正則性と強い疎さのもとで非有界区間への一様性を示した。確率的ブロックモデルのように次数分布に原子がある点では一様な極限は成り立たない（抄録）。", "fun": "SNSのつながりを数えると、友達がとても多い人と少ない人がいて、その「友達の数の分布」はネットワークの基本的な指紋です。ところが、ネットワークを大きくしたときにこの分布の推定がどうばらつくかを丸ごと述べる定理は、これまでなかったそうです。基本的な量ほど理論が追いついていない、という点が面白いところです。", "unverified": "検定や信頼帯への応用は抄録では未確認。"}}, {"id": "pn35", "rank": 35, "field": "因果推論", "headline": "高次元アウトカムの因果効果を頑健に検定", "title": "Debiased Conditional Independence Tests for Causal Effects", "url": "https://arxiv.org/abs/2611.05608", "authors": "Susan Athey ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Athey, S., Nareklishvili, M., & Spiess, J. (2026). Debiased Conditional Independence Tests for Causal Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05608", "why": "処置への自己選択がありうる場合に、高次元アウトカムへの因果効果を条件付き独立性で検定する頑健な方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "処置への自己選択がありうる場合に、高次元になりうるアウトカムへの因果効果を、「アウトカムから処置を共変量だけのときより正確に予測できるか」という条件付き独立性で検定する3つの頑健な方法を示した（抄録）。", "p3": "逆傾向スコア重み付きの平均二乗誤差を統計量とする条件付きランダム化検定（傾向スコアが既知なら有限標本でサイズを制御）、処置と処置予測の両方から共変量の効果を除く二重残差化、二重頑健でネイマン直交なモーメントに基づくAIPW型の検定を提案した（抄録）。", "p5": "シミュレーションでは3つの検定とも、多くの非線形の設定、とくに重い裾、外れ値、混合、異質な効果、符号が逆の効果のもとで、見かけ上無関係な回帰に基づく同時Wald検定より検出力が高かった（抄録）。", "fun": "薬や政策の効果を確かめるとき、ふつうは「処置で結果が変わったか」を調べます。この研究は向きを逆にして、「結果を見れば誰が処置を受けたか当てられるか」を問います。当てられるなら、処置が何かを変えたということです。結果の指標がたくさんあるときでも使える、この逆転の発想が面白いところです。", "unverified": "実データへの適用例は抄録では未確認。"}}, {"id": "pn36", "rank": 36, "field": "因果推論", "headline": "潜在交絡の代理変数を多数作る回帰の理論", "title": "Regression with Many Generated Controls", "url": "https://arxiv.org/abs/2611.06855", "authors": "Timothy Christensen ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Christensen, T., & Vebman, D. (2026). Regression with Many Generated Controls (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06855", "why": "内生性を制御する潜在変数の代理を多数生成して回帰に入れるときの推定理論を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "内生的な共変量があり、内生性を制御できる変数が潜在的で、その代理変数を多数生成できるときの線形回帰で、各手法が何を推定しているかを導き、検証データなしでも一致推定できる条件を示した（抄録）。", "p3": "AI・機械学習の異なる手法で潜在的な制御変数を安価だが不完全に補完して多数の代理を作る状況を想定し、全代理を制御に入れる、代理から因子を作る、操作変数で推定する、その非線形版などの選択肢を透明なモデルで比べた（抄録）。", "p5": "各手法の暗黙の推定対象と、それが関心のあるパラメータを回復する条件を明らかにし、実務上の推奨を示した。生成した制御変数の集合が十分に豊かなら、検証データに頼らずに一致推定できる（抄録）。", "fun": "本当は直接測れない変数で調整したいのに、手元にあるのはAIで作った不完全な代わりの指標だけ、という場面は増えています。この研究は、代わりの指標を一つではなくたくさん作れば、正解のデータがなくても正しい答えに近づける条件を示しました。AIの不完全さを数で補うという考え方が面白いところです。", "unverified": "具体的な応用例の有無は抄録では未確認。"}}, {"id": "pn37", "rank": 37, "field": "因果推論", "headline": "直接操作できない心理変数の効果を操作変数で識別", "title": "Identifying Causal Effects in Experiments with Latent Treatments: An Instrumental Variable Approach", "url": "https://doi.org/10.31234/osf.io/zk73q", "authors": "Lukas Junker ほか", "venue": "PsyArXiv", "date": "2026-11-04", "apa": "Junker, L., & Pargent, F. (2026). Identifying Causal Effects in Experiments with Latent Treatments: An Instrumental Variable Approach. https://doi.org/10.31234/osf.io/zk73q", "why": "操作チェックを使い、実験で直接操作できない潜在変数の因果効果を操作変数法で識別する方法を示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "心理学の実験で、直接操作できない潜在変数の因果効果を、操作を操作変数とみなして識別する方法を示した（抄録）。", "p3": "操作を、複数の項目で測った潜在的な処置の操作変数として扱い、平均因果効果が識別される条件を導いた。単位のない潜在処置について、1項目あたりの推定対象と1標準偏差あたりの標準化した推定対象を定め、既存のSEMと操作変数のソフトで推定する方法とシミュレーションを示した（抄録）。", "p5": "必要な仮定は効果と負荷量のある程度の異質性を許し、多くの心理測定の応用がすでに置く仮定より弱い。標準化した推定対象はなじみ深いが仮定が多く、実験の間で移転できない（抄録）。", "fun": "たとえば「不安が高まると成績が下がるか」を調べる実験では、不安そのものは直接いじれず、何らかの操作で間接的に動かします。これまでは操作の効果を測って、それを不安の効果とみなしがちでした。操作を「てこ」として使い、不安そのものの効果を取り出すという発想が面白いところです。", "unverified": "具体的な実験データへの適用例は抄録では未確認。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "母集団の構成比で感度分析を統一的に行う", "title": "Sensitivity Analysis in Population Shares", "url": "https://arxiv.org/abs/2611.05584", "authors": "Filippo Palomba", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Palomba, F. (2026). Sensitivity Analysis in Population Shares (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05584", "why": "潜在結果などの分布の仮定を母集団の構成比の制約として表し、感度分析を統一的に行う枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "母集団のある割合についてだけ分布の仮定を緩めたとき、推定対象がどこまで動きうるかを評価する感度分析の統一的な枠組みを示した（抄録）。", "p3": "仮定を緩める割合を0から1まで動かしたときの推定対象の範囲（限界）を扱いやすい有限次元の計画問題で計算し、限界のプラグイン推定量と大標本での性質を示した。誤特定による不確実性と標本の不確実性を分ける要約指標も導入した（抄録）。", "p5": "この限界は追加の計算なしに正確なノンパラメトリックの鋭い限界を再現する。脱落のあるランダム化実験の平均処置効果、構造モデルの反実仮想予測、公式型の操作変数の頑健性の評価に適用し、RとPythonのパッケージを公開した（抄録）。", "fun": "分析の結論は、たいてい「全員がこの前提に従う」という仮定の上に立っています。この研究は、「もし一部の人が前提から外れていたら、結論はどこまで揺らぐか」を、外れる人の割合を目盛りにして測れるようにしました。研究どうしを前提の崩れへの強さで比べられる点が面白いところです。", "unverified": "適用例での具体的な頑健性の数値は抄録では未確認。"}}, {"id": "pn39", "rank": 39, "field": "計算社会科学・ネットワーク科学", "headline": "AI動画の見分けに自信過剰な人ほど共有する", "title": "Sure Enough to Share? Overconfidence in GenAI Video Discernment is Associated with Sharing Intentions", "url": "https://arxiv.org/abs/2611.05844", "authors": "Haoning Xue ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Xue, H., Qian, S., Calabrese, C., Shen, C., Taylor, L., & Wang, Y. (2026). Sure Enough to Share? Overconfidence in GenAI Video Discernment is Associated with Sharing Intentions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05844", "why": "生成AI動画を見分ける能力への過信が共有の意図と結びつくことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AI動画を見分ける能力への3種類の過信（過大評価・過大な位置づけ・過精密）を区別し、過精密が共有の意図と一貫して結びつくことを示した（抄録）。", "p3": "オンライン調査（N=973）で、参加者が日常の場面を写した動画の出どころを判断し、3種類の過信と、出どころの判断・共有の意図との関係を調べた（抄録）。", "p5": "正答率は62.5%で、参加者は自分を他人より12.8パーセンタイル分だけ上に位置づけていた。過精密は共有の意図と、動画を人が撮ったと判断する傾向に一貫して正の関連があった。年齢、生成AIの利用、AIリテラシーは3種類の過信すべてと正の関連があった（抄録）。", "fun": "AIが作った動画と本物を見分けるテストで、人の正答率は6割ほどでした。問題は、自分の判断に自信を持ちすぎる人ほど、その動画を人に送りたがることです。しかもAIをよく使う人やAIに詳しい人ほど過信しやすいという結果は、「知っているつもり」の危うさを示していて面白いところです。", "unverified": "動画の数と種類、関連の大きさは抄録では未確認。"}}, {"id": "pn40", "rank": 40, "field": "計算社会科学・ネットワーク科学", "headline": "複数属性の交差が生む分離をネットワークで説明", "title": "Explaining Intersectional Segregation in Multi-attribute Social Networks", "url": "https://doi.org/10.2139/ssrn.7676758", "authors": "Clara Eminente ほか", "venue": "SSRN", "date": "2026-11-04", "apa": "Eminente, C., Omodei, E., & Starnini, M. (2026). Explaining Intersectional Segregation in Multi-attribute Social Networks. https://doi.org/10.2139/ssrn.7676758", "why": "人種と性別など相関する複数の属性への選好から、交差的な分離が生じる仕組みをランダムグラフで示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "人種と性別のように相関する2つの属性への選好から生じる交差的な分離を、ランダムグラフのモデルでColemanの分離指数として閉じた形で導き、3つの結果を示した（抄録）。", "p3": "2つの属性への選好を持つランダムグラフのモデルで分離指数を解析的に求め、欧州の学校の学級の友人ネットワークで予測を検証した（抄録）。", "p5": "一方の属性への選好が相関するもう一方の属性に見かけの分離を生むこと、一方が中立なら同類性のある属性の分離は選好の強さと等しく集団の組み替えでは変えられないこと、独立な2属性の均衡した集団では2つの選好が逆向きのときに限り分割が分離を減らすことを示した（抄録）。", "fun": "教室で男子と女子が別々にかたまるのは、性別で友達を選んでいるからだと考えがちです。でも、性別と相関する別の特徴で選んでいるだけでも、性別の分かれ方として表れることがあります。一つの属性だけを見ていると原因を取り違える、という指摘が面白いところです。", "unverified": "学級の友人ネットワークでの検証結果の数値は抄録では未確認。"}}, {"id": "pn41", "rank": 41, "field": "計算社会科学・ネットワーク科学", "headline": "確率的社会シミュレータの較正を償却最適化で高速化", "title": "Amortized Optimization for Calibrating Stochastic Social Simulators", "url": "https://arxiv.org/abs/2611.06623", "authors": "Muyao Zhong ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Zhong, M., & Yang, P. (2026). Amortized Optimization for Calibrating Stochastic Social Simulators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06623", "why": "繰り返しシミュレーションの代わりに償却最適化を使い、パラメータの較正を高速化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前に集めたシミュレーションから、観測に合うパラメータの選び方を学ぶ償却最適化で、確率的な社会シミュレータの較正を高速化した（抄録）。", "p3": "学習後は新しい観測を追加のシミュレーションなしで実行可能なパラメータに写す。似た観測を説明できる複数のパラメータ候補を保持して応答を比べ、単一の回帰器で生じる矛盾したラベルを避ける。4つのシミュレータで較正の精度と問い合わせ時間を比べた（抄録）。", "p5": "新しい交通の目標では、局所補正で問い合わせ時間が経験的・代理選択の半分以下になった。実際の金融データでの比較では、10分間のガウス過程ベイズ最適化の探索より約1.07×10^7倍速く、平均の較正誤差は3.06%高かった（抄録）。", "fun": "人の行動を模したシミュレーションを現実に合わせるには、つまみ（パラメータ）を何度も回して試すのが普通で、時間がかかります。この研究は、前もってたくさん試しておいた結果からつまみの合わせ方を学ばせ、新しいデータが来たらすぐ答えを出せるようにしました。精度はわずかに落ちても桁違いに速い、というトレードオフが面白いところです。", "unverified": "4つのシミュレータの種類と、交通以外の課題での精度は抄録では未確認。"}}, {"id": "pn42", "rank": 42, "field": "計算社会科学・ネットワーク科学", "headline": "スイスの都市の歩行に現れる規則性", "title": "Emergent regularity of walking patterns: evidence from Swiss cities", "url": "https://arxiv.org/abs/2611.06529", "authors": "Guo-Shiuan Lin ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Lin, G.-S., Hendrick, M., Llaguno-Munitxa, M., & Manoli, G. (2026). Emergent regularity of walking patterns: evidence from Swiss cities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06529", "why": "探索と回帰を交互に行う移動の規則性が、スイスの都市の歩行パターンにも現れることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "スイスの都市の住民の歩行は自宅と職場の周りに強く集中し、ほかの交通手段とは根本的に異なる移動パターンを作ることを、4週間の追跡データで示した（抄録）。", "p3": "15分都市のモデルに近いスイスの主要都市で、4週間の生活時間調査で追跡した1,318人の歩行の空間分布と時間を分析し、経験的に求めたパラメータを持つ2中心の探索・優先回帰（EPR）モデルで、中心から歩いて離れる確率の減衰を再現した（抄録）。", "p5": "歩行は自宅と職場という2つの引き寄せ点の周りに集中し、ほかの手段は長い移動や自宅と職場の連絡に使われていた。歩行時間の長い群ほど長距離を歩き、多くの目的地を探索する傾向が強かった（抄録）。", "fun": "人の移動は「新しい場所を探す」と「いつもの場所に戻る」の繰り返しで説明できることが知られていますが、歩きだけを取り出して調べた例は少なかったそうです。スイスの都市で調べると、歩きは家と職場という二つの重心の周りに集まっていました。「15分で暮らせる街」を考える手がかりになる点が面白いところです。", "unverified": "参加者の属性と都市ごとの差は抄録では未確認。"}}, {"id": "pn43", "rank": 43, "field": "計算社会科学・ネットワーク科学", "headline": "都市サービスの組合せが地区の脆弱性を示す", "title": "AGORA cities: the hidden infrastructure shaping urban fragility", "url": "https://arxiv.org/abs/2611.06289", "authors": "Eleonora Andreotti ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Andreotti, E., Usmani, M., Barsanti, A., & Napolitano, M. (2026). AGORA cities: the hidden infrastructure shaping urban fragility (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06289", "why": "ボローニャとフィレンツェで、都市サービスの共存のパターンから地区の脆弱性と性格を読み分けた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ボローニャとフィレンツェで、芸術・緑・移動のための開かれた道からなるインフラ（AGORA）がそろう地区ほど脆弱性が低いことを示した（抄録）。", "p3": "FoursquareとOpenStreetMapの施設情報に、3-30-300ルールに基づくSentinel-2の緑の指標を統合して地区をクラスター化し、市の統計局が作った人口・社会・経済・総合の脆弱性指標と比べた（抄録）。", "p5": "AGORAの備えと総合脆弱性の順位相関に基づくAAスコアは、フィレンツェで1.00、ボローニャで0.80だった。AGORAを完全に備えた唯一のクラスターは最も脆弱性が低いが、住民はボローニャの3.3%、フィレンツェの6.3%にとどまった（抄録）。", "fun": "街の暮らしにくさは所得や年齢の統計で測るのが普通ですが、この研究は、芸術の場、緑、歩いて行ける道といった身近なインフラの組み合わせに注目しました。それらがそろう地区ほど脆弱性が低い一方、そろった地区に住む人はごく一部でした。街の弱さを地図の上の施設から読み取る発想が面白いところです。", "unverified": "関連の分析で因果は示していない（解釈）。クラスターの数と指標の重みは抄録では未確認。"}}, {"id": "pn44", "rank": 44, "field": "計算社会科学・ネットワーク科学", "headline": "LLMが演じるジェンダーを人はどう受け取るか", "title": "A Cracked Mirror: How People Perceive Gender Performance by Large Language Models", "url": "https://arxiv.org/abs/2611.06393", "authors": "Faezeh Fadaei ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Fadaei, F., Moran, J. C., & Yasseri, T. (2026). A Cracked Mirror: How People Perceive Gender Performance by Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06393", "why": "ゼロショットでLLMが表現するジェンダーと、それを人が会話でどう解釈するかをジェンダー・パフォーマティビティから分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "最小限の指示でLLMにジェンダーを演じさせると、人は指示の方向に沿って受け取るが、両端の指示ほど中間寄りに評価し、「どちらでもない」はやや男性寄りに受け取ることを示した（抄録）。", "p3": "事前登録したオンラインの無作為化実験で、1,060人がそれぞれLLMと5回の短い会話をし、「とても男性的」から「とても女性的」までの指示で生成した相手の性別の印象を会話ごとに評価した（抄録）。", "p5": "平均の評価は指示の方向に動いたが、両端の評価はラベルより中間に近かった。評価はモデルや話題で異なり、女性は中間の水準でモデルをより男性的と評価した。参加者は文体・感情表現・話題への関心を手がかりにし、ときに判断の背後の固定観念を疑った（抄録）。", "fun": "AIに「とても女性的に話して」と頼むと、会話の相手は確かにそう感じます。ただし思ったほど極端にはならず、「どちらでもなく」と頼むと少し男性的に受け取られました。AIは社会のジェンダーの手がかりを映す鏡ですが、その鏡にはひびがある、という見立てが面白いところです。", "unverified": "使ったモデルの名称と、評価尺度の詳細は抄録では未確認。"}}, {"id": "pn45", "rank": 45, "field": "経営学", "headline": "戦略的資源にも寿命がある：資源の減衰", "title": "Strategic Resource Decay: An Empirical Examination of the Overlooked Endogenous Threat", "url": "https://doi.org/10.2139/ssrn.7679822", "authors": "Reha Karadag ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Karadag, R., & Poppo, L. (2026). Strategic Resource Decay: An Empirical Examination of the Overlooked Endogenous Threat. https://doi.org/10.2139/ssrn.7679822", "why": "資源ベース理論が見落としてきた戦略的資源の寿命と減衰を実証的に検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "戦略的資源が内生的に価値を失っていく「戦略的資源の減衰」の枠組みを、米国最大の産油地帯パーミアン盆地の埋蔵量の枯渇のデータで実証し、拡張した（抄録）。", "p3": "上流の事業者2,696社の企業-月631,491件のパネルで、埋蔵量の枯渇がその後の全国の石油生産に与える影響、能力の再構成の効果、希少性という新しい境界条件を検証した（抄録）。", "p5": "予測できる内生的な枯渇であっても、その後の生産は減り、能力の再構成ではしばしば生産を維持できなかった。資源の希少性が高いほど、減衰の業績への負の影響は強まった（抄録）。", "fun": "会社の強みになる資源は、うまく使えばずっと優位を保てる、というのが経営学の定番の考え方でした。この研究は、油田の埋蔵量のように使えば減っていく資源に注目し、減ること自体が予想できても業績は落ち、手を打っても補いきれないことが多いと示しました。強みには寿命がある、という視点が面白いところです。", "unverified": "SSRNの未査読論文。効果の大きさの数値は抄録では未確認。"}}, {"id": "pn46", "rank": 46, "field": "経営学", "headline": "培養肉の商業化を阻む規制の分断と生産能力", "title": "Regulatory Fragmentation, Consumer Acceptance and Capacity Constraints in Lab-Grown Food: Evidence from 2026 Disclosures", "url": "https://doi.org/10.2139/ssrn.7679878", "authors": "Priyanshu Das", "venue": "SSRN", "date": "2026-11-05", "apa": "Das, P. (2026). Regulatory Fragmentation, Consumer Acceptance and Capacity Constraints in Lab-Grown Food: Evidence from 2026 Disclosures. https://doi.org/10.2139/ssrn.7679878", "why": "2026年の開示資料から、培養肉と精密発酵食品の規制・消費者受容・生産能力の条件を整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2026年に公表された資料だけを使い、培養肉と精密発酵による食品の商業化の条件を、規制、消費者の受容、生産能力の面から整理した（抄録）。", "p3": "法令、食品規制当局の消費者調査、価格統計、企業報告、規制の発表、牛肉価格の経済報道からなる14の資料を使い、すべての数値を出典まで追跡し、派生した数値は著者の計算と明記した（抄録）。", "p5": "シンガポールでは承認が積み上がる一方、米国の州は一時停止や表示規則に動き、規制上の承認と買い手への法的な到達が分かれていた。英国の調査では販売への反対（43%）が賛成（35%）を上回り、開示された発酵の生産能力は培養細胞の能力よりはるかに大きかった（抄録）。", "fun": "培養肉は技術の話題として注目されますが、店に並ぶかどうかは技術だけでは決まりません。国によって承認の動きは正反対で、消費者には安全性や「自然さ」への不安が根強くあります。牛肉が過去最高の値段でも食べたい気持ちは変わらない、という点も含めて、新しい食べ物が社会に受け入れられる条件が見えてくるのが面白いところです。", "unverified": "SSRNの未査読論文で、2026年の公表資料に限った分析。上場企業の評価額の割引の大きさは抄録では未確認。"}}, {"id": "pn47", "rank": 47, "field": "組織行動・心理的安全性", "headline": "医療における当事者リーダーシップの実態", "title": "Moving Beyond Visibility and the “Glass Box” Effect: A Scoping Review of Consumer Leadership in Healthcare", "url": "https://doi.org/10.31235/osf.io/g2nu3", "authors": "Julia Paxino ほか", "venue": "SocArXiv", "date": "2026-11-04", "apa": "Paxino, J., Maxwell-Davis, N., Nekkalapudi, N., Williams, J., Adison, R., Gourlay, P., Harrison, P., Bilson, T., Denniston, C., Dangerfield, F., Athan, S., Wilkins, K., Thomas, H., Cavill, S. J., Asgari, J., Sheldon, M., Ryan, P., Piper, A., Cheah, S., et al. (2026). Moving Beyond Visibility and the “Glass Box” Effect: A Scoping Review of Consumer Leadership in Healthcare. https://doi.org/10.31235/osf.io/g2nu3", "why": "医療のサービス・研究・政策・教育で、当事者（利用者）のリーダーシップがどう概念化・実践されているかを整理した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "医療のサービス・研究・政策・教育で、当事者（生きた経験を持つ人）のリーダーシップがどう概念化・実践されているかを整理し、促進要因・障壁・影響をまとめるスコーピングレビュー（抄録）。", "p3": "JBIの方法に従い、当事者が設計・分析・解釈に関わった。5つのデータベースと灰色文献を検索し、記述的なマッピングと、システム変化の視点からの質的テーマ分析で統合した（抄録）。", "p5": "障壁と促進要因を4つの領域に、影響を個人・関係・システムの3つの水準に整理したと述べるが、対象文献の件数と主な結果は取得した抄録の範囲に含まれない（抄録）。", "fun": "医療の現場で、患者や家族が「参加する」だけでなく「リードする」とはどういうことか。この研究は、当事者自身もレビューの設計と分析に加わる形で、その実態を整理しました。ただ見える場所にいるだけではないリーダーシップを探る、という問いが面白いところです。", "unverified": "抄録は途中で切れており、対象文献の件数と主な結果は未確認。"}}, {"id": "pn48", "rank": 48, "field": "経済学", "headline": "ジェンダー不平等の新指標と社会の複雑さ", "title": "A new cross-cultural index for gender inequality correlates with social complexity, patrilineality and sexual stature dimorphism", "url": "https://doi.org/10.31235/osf.io/mjf6x", "authors": "Leo Delalandre ほか", "venue": "SocArXiv", "date": "2026-11-04", "apa": "Delalandre, L., Deb, A., Mesoudi, A., & Turchin, P. (2026). A new cross-cultural index for gender inequality correlates with social complexity, patrilineality and sexual stature dimorphism. https://doi.org/10.31235/osf.io/mjf6x", "why": "多数の人間社会でジェンダー不平等の複数の側面を測る比較文化的な指標を作り、社会の複雑さや父系制との関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "工業化以前の93社会の女性の地位の52指標を再分析し、多くの指標がまとまって動くジェンダー不平等の次元を見つけ、それが社会の複雑さなどと関係することを示した（抄録）。", "p3": "比較文化データセットの52の指標から、複数の指標が系統的に共変する有意な次元を抽出し、その次元と社会組織の特徴、身長の性差との関係を調べた（抄録）。", "p5": "女性の地位は社会の複雑さと負に、母系制・妻方居住と正に関連した。ジェンダー不平等が大きいほど身長の性差（性的二型）も大きかった（抄録）。", "fun": "女性の地位は、暴力、親族のしくみ、仕事の分担、政治的な力など、いろいろな面で社会ごとに違います。それらがばらばらではなく、ある程度まとまって動くことを、昔の93の社会のデータから示しました。不平等と身長の男女差の関係から、骨の形などの手がかりで先史時代の不平等を推定できるかもしれない、という展望も面白いところです。", "unverified": "相関の結果で、因果の向きは抄録では未確認（解釈）。"}}, {"id": "pn49", "rank": 49, "field": "経済学", "headline": "母親の貧困の推移の学歴差を所得と移転で分解", "title": "How earnings and public transfers shape the educational gradient in partnered mothers’ poverty trajectories in Austria", "url": "https://doi.org/10.31235/osf.io/r72db", "authors": "Christina Siegert ほか", "venue": "SocArXiv", "date": "2026-11-04", "apa": "Siegert, C., Steiber, N., & Zilian, L. (2026). How earnings and public transfers shape the educational gradient in partnered mothers’ poverty trajectories in Austria. https://doi.org/10.31235/osf.io/r72db", "why": "オーストリアで出産後の母親の貧困の推移を、本人の所得・公的移転・配偶者の所得から分解した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "オーストリアの初産の母親の貧困リスクの推移を、本人の稼得、公的移転、配偶者の所得に分解し、学歴による違いを示した（抄録）。", "p3": "34,000人を超える初産の母親と配偶者の行政登録データで、出産の2年前から6年後までを事象研究デザインで追い、個人と世帯の貧困指標を比べて可処分所得を稼得と公的移転に分解した（抄録）。", "p5": "母親は出産後に大きく持続的な稼得の減少を経験するが、世帯で見た経済的な脆弱性の増加ははるかに小さく、配偶者の所得と家族関連の公的移転が一部を和らげた。高学歴の母親は稼得の減少が大きいが比較的守られ、低学歴の母親は減少が小さいのに貧困リスクが高く持続した（抄録）。", "fun": "子どもが生まれると母親の収入は大きく減ります。でも、家族全体で見ると貧困に陥る人はずっと少なく、配偶者の収入や子育ての手当が支えていました。意外なのは、収入の落ち込みが大きい高学歴の母親ほど守られ、落ち込みの小さい低学歴の母親ほど貧困が続くことです。収入の減り方だけでは本当の苦しさは分からない、という点が面白いところです。", "unverified": "貧困の基準と、学歴差の数値は抄録では未確認。"}}, {"id": "pn50", "rank": 50, "field": "経済学", "headline": "受け手の信念を知らずに情報設計を学ぶ", "title": "Learning to Design Information", "url": "https://arxiv.org/abs/2611.05701", "authors": "Ce Li ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Li, C., & Lin, T. (2026). Learning to Design Information (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05701", "why": "受け手の主観的信念を知らない情報設計者が、学習によって望ましい情報設計に近づくアルゴリズムを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "受け手の主観的な信念を知らない情報設計者（LLMやオンラインの基盤など）が、繰り返しのやり取りから戦略的な受け手の信念を学ぶアルゴリズムを示した（抄録）。", "p3": "受け手が学習の過程を戦略的に操作しても頑健なアルゴリズムを作り、既知の信念のもとでの1期の最適値のT倍という静的な基準と、より強い動的な最適性の基準の2つに対する後悔で性能を測った（抄録）。", "p5": "2つの基準のどちらに対しても後悔なしを達成し、収束の速さはO(log²T/T)で、既存の方法より大幅に速いと述べる（抄録）。", "fun": "相手が何を信じているか分からないまま、伝える情報を選ばなければならない場面はよくあります。この研究は、やり取りを重ねながら相手の思い込みを学ぶ方法を作りましたが、相手がわざと本心を隠して学習をゆがめても崩れないように設計した点が面白いところです。", "unverified": "数値実験の有無と内容は抄録では未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "Koopman作用素で損傷検知と制振を自己再構成", "title": "Koopman operator models for self-reconfiguring vibration control and structural health monitoring", "url": "https://doi.org/10.1177/14759217261500354", "authors": "Fernanda Thaís Colombo ほか", "venue": "Structural Health Monitoring", "date": "2026-11-05", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Colombo, F. T., Rébillat, M., Mechbal, N., & da Silva, S. (2026). Koopman operator models for self-reconfiguring vibration control and structural health monitoring. Structural Health Monitoring. https://doi.org/10.1177/14759217261500354", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Health Monitoringの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "物理モデルを前もって知らなくても、制御用の1つのアクチュエータとセンサだけで構造の変化を検知し、Koopman作用素で状態空間モデルをオンラインで作り直して、制振制御を自動で再構成する手順を示した（抄録）。", "p2": "能動制振は健全な状態を前提に設計されるが、ひび割れや剥離、接合部のゆるみで質量・剛性・減衰が変わると効きが落ち、破損につながりうる。既存の制御用の計測機器だけで、開ループと閉ループの両方で損傷の前後の大きな物性の変化に対応するのは難しかった（抄録）。", "p3": "Koopman作用素（非線形の力学を、観測関数の空間での線形の時間発展として表す作用素）を使って測定データから構造の状態空間モデルを推定し、構造の変化を検知したらモデルを再計算して制御器を更新する実時間の手順を作った（抄録）。背景：Koopman表現はデータ駆動の線形化として制御設計に使いやすい。", "p4": "3枚の圧電パッチをアクチュエータ・センサ・外乱入力として備えた柔軟な片持ち梁で実験的に検証し、集中質量の変化（取り除く量を段階的に増やす）で構造の変化を模擬し、異なる外乱のプロファイルを調べた（抄録）。", "p5": "提案した手順は構造の変化を検知し、Koopman作用素で状態空間モデルを再計算して制御器を更新し、系の自己再構成的なふるまいを実現できた（抄録）。性能の定量的な数値は抄録には示されていない。", "p6": "検証は1本の片持ち梁と、質量の変化による模擬損傷に限られる（抄録）。解釈：剛性や減衰の局所的な低下といった実際の損傷や、雑音の多い実環境、大規模な構造への適用は未確認である。", "fun": "揺れを打ち消す装置は、建物や機械が健康なときに合わせて調整されています。ところが部品がゆるんだり傷んだりすると、同じ調整ではかえって効かなくなります。この研究は、揺れのデータから「今の体の状態」をその場で学び直し、自分で調整し直す仕組みを作りました。複雑な動きを見方を変えて直線的に扱う数学（Koopman作用素）を使っている点が面白いところです。", "unverified": "抄録のみ読んだ。検知の閾値、モデルの次元、制振性能の改善量などの数値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "地盤-構造-軌道の連成で鉄道橋の振動が変わる", "title": "Dynamic boundary element - finite element analysis of railway bridges considering soil-structure-track interaction", "url": "https://doi.org/10.1142/s0219455428500733", "authors": "Paul Konig ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-05", "citescore": 6.5, "citescore_year": "2025", "apa": "Konig, P., & Adam, C. (2026). Dynamic boundary element - finite element analysis of railway bridges considering soil-structure-track interaction. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500733", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal of Structural Stability and Dynamicsの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "地盤-構造-軌道の相互作用を3次元の有限要素-境界要素（FE-BE）連成モデルで扱い、地盤と軌道のモデル化が鋼鉄道橋の固有振動特性と過渡応答に大きく影響することを示した（抄録）。", "p2": "鉄道橋の動的な評価、とくに振動の基準による使用限界状態の照査では、支持地盤での波動の伝播と放射減衰、軌道の影響が重要だが、それらを周波数と時間の両領域で一貫して扱う解析は限られていた（抄録）。", "p3": "構造と軌道を有限要素、無限に広がる地盤を境界要素で表す3次元の連成定式化を、周波数領域と時間領域の両方に適用し、地盤中の波動の伝播と放射減衰を一貫して表した（抄録）。解釈：境界要素は遠方への波の逃げを自然に扱えるため、地盤を有限の箱で切る誤差を避けられる。", "p4": "対象は単径間の鋼桁の鉄道橋で、地盤と軌道のモデル化を変えて、モード特性（固有振動数・モード）と過渡応答の振幅を比べた（抄録）。", "p5": "地盤-構造相互作用と軌道は、鋼鉄道橋の動的特性と応答振幅を大きく変えうることが示された（抄録）。固有振動数の変化や応答の増減の具体的な数値は抄録には示されていない。", "p6": "対象は1つの橋の形式（単径間の鋼桁）に限られる（抄録）。解釈：実測との照合の有無、列車荷重の扱い（移動荷重か車両モデルか）、ほかの地盤条件への一般化は抄録では確かめられない。", "fun": "列車が橋を渡ると橋は揺れますが、その揺れは橋だけで決まるのではなく、橋を支える地面やレールとの組み合わせで変わります。この研究は、地面を無限に広がるものとして計算できる方法を組み合わせ、地面とレールまで含めると橋の揺れ方が大きく変わることを示しました。橋を単独の構造物ではなく「地面ごとのシステム」として見る視点が面白いところです。", "unverified": "抄録のみ読んだ。固有振動数・応答振幅の変化の数値と、実測との比較の有無は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "磁気浮上列車と柔なガイドウェイ橋の連成振動", "title": "Nonlinear Coupled Dynamics, Fuzzy Neural-Adaptive Control, and Safety Thresholds of High-Speed Maglev Trains under Guideway Disturbances", "url": "https://doi.org/10.1142/s0219455428500745", "authors": "Yang Wang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-05", "citescore": 6.5, "citescore_year": "2025", "apa": "Wang, Y., Guo, W., Huang, R., Liang, X., Mao, J., & Yu, Z. (2026). Nonlinear Coupled Dynamics, Fuzzy Neural-Adaptive Control, and Safety Thresholds of High-Speed Maglev Trains under Guideway Disturbances. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500745", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal of Structural Stability and Dynamicsの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "柔なガイドウェイ橋を走る高速の磁気浮上列車について、飽和を補正した電磁力モデル、ファジィ・ニューラルネットの適応バックステッピング制御（FNN-ABSC）、連成した構造応答の解析を統合し、軌道の段差と橋脚の沈下の許容量を示した（抄録）。", "p2": "高速の磁気浮上列車は、局所的な軌道の段差や橋脚の沈下で電磁系が飽和し、列車-ガイドウェイの連成振動が増幅されやすい（抄録）。", "p3": "電磁力モデルをCOMSOLの結果で較正して既発表の実験と照合し、ギャップの誤差と変化率を使うFNN-ABSCで浮上ギャップの追従を保ちつつ急な過渡を抑える。連成モデルでは同じ構造の制御器が局所の信号で独立に適応し、実測の軌道不整に決定論的な段差と橋脚の沈下を加えた（抄録）。", "p4": "評価は、電磁力モデルの誤差、従来のFuzzy-ABSCと比べた整定時間・立ち上がり時間、速度別のガイドウェイ中央の加速度、5〜15 mmの絶対安全帯に基づく許容量である（抄録）。", "p5": "電磁力モデルの誤差は6%以内で、飽和域では3%未満だった。FNN-ABSCはFuzzy-ABSCより整定時間を約32.4%、立ち上がり時間を約21.2%短くした。段差は広帯域の過渡励振で電磁石・浮上フレーム・ガイドウェイの加速度を強く増幅し、長い波長の沈下は車体の低周波の上下・縦揺れを強く励起した。ガイドウェイ中央の加速度は時速120 kmの0.15 m/s²から600 kmで0.95 m/s²に増え、600 kmでの許容量は段差約4 mm、沈下約18 mmだった（抄録）。", "p6": "結果は検討した構成と安全帯の設定に依存する（抄録）。解釈：制御器の頑健性（モデル誤差や遅れへの耐性）と、実際の走行データでの検証は抄録では確かめられない。", "fun": "磁気浮上列車は、ガイドウェイとのわずかな隙間を保って浮いたまま高速で走ります。そのため、レールのわずかな段差や橋脚の沈み込みでも、浮上を支える磁石の力が限界に達して揺れが大きくなります。この研究は、時速600 kmなら段差は約4 mmまでしか許されない、といった許容量を計算で示しました。ミリ単位の精度が高速鉄道の安全を左右する点が面白いところです。", "unverified": "抄録のみ読んだ。対象のガイドウェイ橋の諸元と、制御器のパラメータは未確認。"}}, {"id": "jr04", "rank": 4, "headline": "GPTエージェントも集団で手柄を過大に主張", "title": "Humanlike Self-Enhancement and Self-Protection in Generative Pre-Trained Transformer-Based AI Agents: Of Overclaiming and the Self-Serving Bias", "url": "https://doi.org/10.1177/01461672261499423", "authors": "Siwei Fu ほか", "venue": "Personality and Social Psychology Bulletin", "date": "2026-11-05", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "apa": "Fu, S., Sedikides, C., Zhou, W., & Zhou, X. (2026). Humanlike Self-Enhancement and Self-Protection in Generative Pre-Trained Transformer-Based AI Agents: Of Overclaiming and the Self-Serving Bias. Personality and Social Psychology Bulletin. https://doi.org/10.1177/01461672261499423", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Personality and Social Psychology Bulletinの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "GPTに基づくAIエージェントが、人と同じように集団での自己高揚（自分の貢献の過大主張）と自己防衛（成功は自分、失敗は他人のせいにする自己奉仕バイアス）を示すことを、8つの実験で示した（抄録）。", "p2": "AIは人のような感覚を持たないと考えられるが、集団の場面で動機づけられたふるまいを模倣するかは分かっていなかった。LLMが中立だという前提も、この点で検証が要る（抄録）。", "p3": "共同で創作する集団課題（ジョークづくり）にAIエージェントを参加させ、集団の成果への自分の貢献の見積もりと、成功・失敗の帰属を測った。自分と他者の貢献に等しく注意を向けさせる自己中心性の低減操作、温度の設定、人口統計のペルソナ（性別・民族）、GPTのモデルの世代、思考の連鎖（CoT）の有無を変えた（抄録）。", "p4": "評価は、過大主張の有無と大きさ、操作による減少、自己奉仕バイアスの有無、条件による違いである（抄録）。解釈：人を対象とした社会心理学の実験の枠組みを、そのままAIに当てはめる設計である。", "p5": "AIエージェントは自分の貢献を過大に主張し、自己中心性の低減操作は過大主張を弱めたが消さなかった。自己奉仕バイアスも示した。過大主張は温度とペルソナを変えても続き、後の世代のGPTほど強く、思考の連鎖は過大主張を減らさず、むしろ増やした（抄録）。", "p6": "抄録の範囲では、効果の大きさ、使ったGPTの具体的なモデル、ほかの開発元のLLMでの再現は確かめられない。解釈：過大主張が動機によるのか、学習データにある人の書き方を写したものかは区別されていない。", "fun": "グループで何かを作った後、「自分が一番がんばった」と思ってしまうのは人間によくある癖です。驚くことに、AIにグループでジョークを作らせると、AIも自分の手柄を大きく言い、うまくいけば自分のおかげ、失敗すれば他のせいにしました。しかも「よく考えて」と促すと、かえって手柄の主張が強まった点が面白いところです。", "unverified": "抄録のみ読んだ。効果の大きさ、使ったモデルの版、実験ごとの試行数は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "AIへの依存の較正は効果が逓減する", "title": "Diminishing returns to calibrated reliance on AI: effects on deliverable quality and rework effort, moderated by task verifiability", "url": "https://doi.org/10.1108/itp-03-2026-0464", "authors": "Junjie Sun ほか", "venue": "Information Technology and People", "date": "2026-11-05", "sjr": 1.956, "citescore": 15.5, "citescore_year": "2025", "apa": "Sun, J., Yang, Y., Cheng, J., & Ding, W. (2026). Diminishing returns to calibrated reliance on AI: effects on deliverable quality and rework effort, moderated by task verifiability. Information Technology & People, 1–20. https://doi.org/10.1108/itp-03-2026-0464", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Information Technology and Peopleの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "AIへの依存を「強さ」ではなく「較正（頼るべきときに頼り、疑うべきときに疑う）」で捉え、較正された依存が成果物の質を上げ手戻りを減らすが、その効果は逓減することを、労働者380人のデータで示した（抄録）。", "p2": "AIツールは組織の「成果の加速装置」にも「リスクの伝播装置」にもなりうるが、従業員の能力がどの行動の経路を通じて成果につながり、どんな条件で効くかは明らかでなかった（抄録）。", "p3": "適切な依存と自動化への信頼の理論に基づき、AIを使う仕事の能力（課題の分解と評価の技能）から較正された依存を経て成果物の質・手戻りに至る経路と、課題の検証しやすさによる調整を仮定し、PLS-SEMと階層的な多項式回帰で媒介・調整・2次の効果を検定した。共通方法バイアスは手続き上の対策と潜在的な方法因子で評価した（抄録）。", "p4": "評価は、能力と較正された依存の関連、較正された依存と成果の関連、2次の項（逓減）の有無、検証しやすさによる調整である（抄録）。", "p5": "AIを使う仕事の能力は較正された依存と正に関連し、較正された依存は成果物の質の高さと手戻りの少なさに関連した。較正が進むほど質の向上と手戻りの減少が頭打ちになる「二重の逓減」が現れた。課題の検証しやすさは、較正された依存と質の正の関連、手戻りとの負の関連をともに強めた（抄録）。", "p6": "抄録の範囲では、標本の業種・国、調査が横断か縦断か、効果量は確かめられない。解釈：成果物の質や手戻りが自己報告なら、共通方法バイアスへの対策をしても過大評価の可能性が残る。", "fun": "AIの答えを全部うのみにするのも、全部疑うのも良くありません。大事なのは「信じてよい場面と確かめるべき場面を見分ける力」です。この研究では、その見分けが上手な人ほど仕事の質が上がり、やり直しが減りましたが、上手になるほど伸びは鈍っていきました。答えが正しいか確かめやすい仕事ほど効果が大きい、という点も身近で面白いところです。", "unverified": "抄録のみ読んだ。対象者の業種・国、調査の設計、係数の値は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "倒産予測モデルの有効性は企業規模で変わる", "title": "Size Matters: A Lag‐Aware Evaluation of Bankruptcy Prediction Models in Ecuador (2021–2024)", "url": "https://doi.org/10.1002/mde.70174", "authors": "Alexis Polibio Gaona Albito", "venue": "Managerial and Decision Economics", "date": "2026-11-05", "citescore": 5.3, "citescore_year": "2025", "apa": "Albito, A. P. G. (2026). Size Matters: A Lag‐Aware Evaluation of Bankruptcy Prediction Models in Ecuador (2021–2024). Managerial and Decision Economics. https://doi.org/10.1002/mde.70174", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Managerial and Decision Economicsの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "エクアドルの企業の行政パネルで、5つの会計ベースの倒産予測モデルの有効性が企業規模によって変わり、従来のモデルは達成できる性能の約3分の1を取り残していることを、解散までの行政上の遅れを考えた評価で示した（抄録）。", "p2": "古典的な倒産予測モデルは、二値化した判定、不均衡なデータに不向きな指標、法的な破綻の定義と行政手続きの遅れを考えない評価で検証されることが多かった（抄録）。", "p3": "Altman Z''、Pascale、Springate、Zmijewski、CA-Scoreを、2021〜2024年の企業年324,252件（110,404社）で評価した。連続のウィンソライズしたスコアの閾値をモデルと規模の層ごとにYoudenのJで再推定し、Matthews相関、F1、ベイズのPPV、決定曲線の純便益で性能を測り、法的破綻の3つの定義と、会社法第20条による2〜3年の解散の遅れを考えた検査を行い、XGBoost（70/30の層化分割）を上限の基準とした（抄録）。", "p4": "評価は、規模別のAUC、連続スコアでの順位、再較正した閾値でのPPV、予測された困窮と法的清算のずれを示す制度的摩擦指数、XGBoostとの差で、クラスの比は1:42と不均衡である（抄録）。", "p5": "AltmanのAUCは規模とともに0.553から0.657に上がり（z=+3.84）、Springateは0.623から0.489に下がり（z=−5.14）、大企業ではPascaleが偶然以下（0.464）だった。連続スコアではSpringate（0.624）が首位で、再較正してもベイズのPPVは5.5%未満だった。困窮と清算のずれは実際の回復（約10%）・行政の遅れ（約50%）・パネルの構成（約40%）に分かれ、XGBoostの標本外AUCは0.796（5つのスコアは0.694）だった（抄録）。", "p6": "抄録の範囲では、特徴量の構成、規模の層の定義、XGBoostの入力は確かめられない。解釈：1か国のコロナ後の期間の結果で、制度の異なる国への一般化には注意が要る。", "fun": "会社がつぶれそうかを決算書の数字から見抜く公式は、数十年前に作られたものが今も使われています。エクアドルの十一万社のデータで確かめると、公式の当たり具合は会社の大きさで大きく変わり、大企業ではコイン投げ以下の公式までありました。さらに、法的に会社が消えるまでの手続きの遅れが、予測と現実のずれの半分を占めていました。古い道具の使いどころを見直す点が面白いところです。", "unverified": "抄録のみ読んだ。規模の層の区切り、特徴量の詳細、XGBoostの入力は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "都市の安全知覚モデルの不確実性を測る", "title": "Quantifying uncertainty in deep learning models for urban safety perception: An MC Dropout approach", "url": "https://doi.org/10.1177/23998083261504070", "authors": "Vicente Larraín ほか", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-11-05", "sjr": 1.018, "citescore": 7.5, "citescore_year": "2025", "apa": "Larraín, V., Peralta, B., & Lobel, H. (2026). Quantifying uncertainty in deep learning models for urban safety perception: An MC Dropout approach. Environment and Planning B: Urban Analytics and City Science. https://doi.org/10.1177/23998083261504070", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Environment and Planning B: Urban Analytics and City Scienceの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "街路画像から安全の知覚を推定する深層学習モデルに、構造をほとんど変えずにMC Dropoutで画像ごとの不確実性を付けられることを示し、その不確実性が都市の特徴や地区によって系統的に変わることを明らかにした（抄録）。", "p2": "都市の知覚を自動で推定する深層学習モデルは点推定しか返さず、不確実性がないため、重要な都市計画や政策の判断には使いにくかった（抄録）。", "p3": "ResNetに基づく畳み込みニューラルネットで、推論時にもドロップアウトを残して何度も予測し、そのばらつきを不確実性とするMonte Carlo Dropoutを実装し、安全の次元に絞って評価した（抄録）。背景：MC Dropoutはベイズ推論の近似として広く使われる。", "p4": "全世界の都市画像データ（PlacePulse 2.0）と、チリ・サンティアゴの事例で、予測の正解率、不確実性の地理的な分布、確率的な予測と決定的な予測の差との比較を行った（抄録）。", "p5": "MC Dropoutは大きな構造の変更なしに画像ごとの不確実性を与え、正解率は66.81%から67.64%へとわずかに上がった。推定値は都市の特徴によって系統的に変わり、地区ごとに異なるパターンを示した。MC Dropoutのばらつきは、確率的な予測と決定的な予測のずれより系統的に狭かった（抄録）。", "p6": "著者は、不確実性の推定を予測誤差に照らして検証しておらず、較正されている、あるいは信頼度で予測を順位づけられるとは主張しないと明記し、そのための検証手順（リスク-被覆の手順と対ごとの適正なスコアリング規則）を示している（抄録）。", "fun": "街の写真を見て「ここは安全そうか」を判定するAIがありますが、AIがどれくらい自信を持って答えているのかは分かりませんでした。この研究は、同じ写真を少しずつ条件を変えて何度も判定させ、答えのぶれ具合から「自信のなさ」を測りました。そのぶれが本当に間違いやすさを表しているかはまだ確かめていない、と正直に線を引いている点も面白いところです。", "unverified": "抄録のみ読んだ。不確実性と地区の特徴の関係の数値と、サンティアゴの事例の規模は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "CEOの政治傾向と10-KのDEI開示", "title": "CEO Political Leaning and Disclosure Language Following a Federal Policy Shift: An NLP-Assisted Textual Analysis of 10-K Filings", "url": "https://doi.org/10.3390/jrfm19110877", "authors": "Keunyoung Kim", "venue": "Journal of risk and financial management", "date": "2026-11-02", "citescore": 5.5, "citescore_year": "2025", "apa": "Kim, K. (2026). CEO Political Leaning and Disclosure Language Following a Federal Policy Shift: An NLP-Assisted Textual Analysis of 10-K Filings. Journal of Risk and Financial Management, 19(11), 877. https://doi.org/10.3390/jrfm19110877", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Management（MDPI）の抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "CEOの政治的な傾向が10-KのDEI（多様性・公平性・包摂）の開示の多さと関連し、保守寄りの連邦政策の転換後の2025年には両方のCEOの群でDEIの開示が減ったことを示した（抄録）。", "p2": "経営者の属性が法定の開示の言葉づかいに影響するか、政策環境の変化への反応がCEOの政治的傾向で異なるかは、十分に調べられていなかった（抄録）。", "p3": "米国の評判の高い上場企業48社の2022〜2025年の188企業年について、NLPを補助に使う辞書ベースのテキスト分析で10-KのDEI開示の強度を測り、CEOの政治的傾向をDIMEデータベースの選挙資金スコアで測った（抄録）。", "p4": "評価は、CEOの傾向とDEI開示の関連、2025年の政策転換後の変化、両者の交互作用（保守系のCEOの企業ほど大きく減らしたか）である（抄録）。", "p5": "リベラルなCEOの企業は保守系のCEOの企業よりDEI関連の言葉を多く開示し、DEIの開示は2025年に減った。CEOの傾向と政策転換後の指標の交互作用は有意でなく、保守系の企業ほど急に減らした証拠はなかった（抄録）。", "p6": "抄録の範囲では、辞書の語の構成、統制変数、標準誤差の扱いは確かめられない。解釈：標本は評判の高い48社と小さく選ばれた企業の結果で、一般の上場企業への一般化には注意が要る。", "fun": "会社の年次報告書の言葉づかいには、経営者の考え方がにじむのかもしれません。この研究では、政治的にリベラルな社長の会社ほど、多様性や公平性についての言葉を多く書いていました。ところが政府の方針が変わった年には、どちらの社長の会社も同じように言葉を減らしていました。社長の個性と時代の空気の両方が報告書に表れる点が面白いところです。", "unverified": "抄録のみ読んだ。DEI辞書の語の構成、統制変数、効果の大きさは未確認。"}}, {"id": "jr09", "rank": 9, "headline": "LLMの多数決は誤りの相関で頭打ちになる", "title": "Correlation limits the reliability of ensemble decision making with large language models", "url": "https://doi.org/10.1007/s44564-026-00040-z", "authors": "Santiago Morante ほか", "venue": "Discover Informatics", "date": "2026-11-04", "apa": "Morante, S., & García-Rubio, M. R. (2026). Correlation limits the reliability of ensemble decision making with large language models. Discover Informatics, 1(1). https://doi.org/10.1007/s44564-026-00040-z", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Discover Informatics掲載のPDF本文（命題の節、実証の例、限界）を読んだ", "preprint": false, "p1": "複数のLLMの投票を合わせるアンサンブルでは、エージェントの誤りの相関が有効な独立投票者の数に上限を課し、多数決の精度を頭打ちにすることを理論で示し、相関の推定法と実際のモデルでの推定値を示した（抄録、§4）。", "p2": "マルチエージェント系は、アンサンブルが個々より信頼できるという前提で票を合わせるが、その古典的な根拠であるコンドルセの陪審定理は独立な投票者を要する。事前学習データ、構造、アラインメント、プロンプトを共有するモデルは同じ問題で間違えやすい（抄録、§1）。", "p3": "交換可能な二値の票のモデルで、正答の割合の分散を独立な部分と共有された部分に分けると、相関ρが正なら分散はN→∞でもp(1−p)ρに残り、有効な投票者の数は1/ρで上限づけられる（式1、§4.1）。例：相関0.3の100体は約3体の独立な投票者と同じ分散になる（抄録）。不均一な相関と能力への拡張と、ブートストラップ区間つきの相関のモーメント推定量も示した（§4.2、§4.5）。", "p4": "概念実証として、MMLUの57分野から各10問を層化抽出し、gpt-4.1-miniの温度サンプル5つ、同じモデルの5つのペルソナ、開発元の異なる5モデルの3つのアンサンブルで、相関、有効な大きさ、多数決の精度を比べた（§5.2、表2）。", "p5": "温度サンプルとペルソナはどちらも相関0.85（95%区間0.81〜0.89）で、それぞれ約1.1体の独立な投票者に相当し、ペルソナは見かけだけの多様性としてふるまった。開発元の異なる5モデルの相関は0.38（0.30〜0.45）だった（§5.2）。多数決の精度は確実性の手前で頭打ちになり、1体より下がることもありうる（抄録）。", "p6": "著者は、命題2・3は交換可能なエージェントについての結果で、不均一な精度や群がる相関の場合の特徴づけは今後の課題とし、相関は課題の内容に依存すること、実証が1つのベンチマーク・1つの基本モデル・一度の回答による小規模なものであることを限界とする（§8）。", "fun": "「三人寄れば文殊の知恵」が成り立つのは、三人の間違え方がばらばらなときです。同じ教科書で育ったAIを何体集めても、同じところで一緒に間違えるので、多数決はあまり賢くなりません。この研究は、性格だけ変えた同じAIを5体集めても実質1体分ほどにしかならないことを確かめました。数を増やすより「育ちの違う」AIを混ぜる方が効く、という点が面白いところです。", "unverified": "命題2・3の証明の細部と、表2の多数決の精度の全数値は確認していない。"}}, {"id": "jr10", "rank": 10, "headline": "移民背景のケアラーと専門職の協働の不公正", "title": "Transforming Collaborative Care Networks: From Inequity to Inclusion", "url": "https://doi.org/10.1177/21501319261505386", "authors": "Aldiene Henrieke van Dijk – Hengelaar ほか", "venue": "Journal of Primary Care and Community Health", "date": "2026-11-04", "sjr": 0.915, "citescore": 3.9, "citescore_year": "2025", "apa": "Hengelaar, A. H. v. D.-, Hartingsveldt, M. v., Abma, T., & Verdonk, P. (2026). Transforming Collaborative Care Networks: From Inequity to Inclusion. Journal of Primary Care & Community Health, 17. https://doi.org/10.1177/21501319261505386", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Primary Care and Community Healthの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "後天性脳損傷のある移民背景の人をめぐるケアネットワークで、専門職と移民背景のケアラーの協働が不公正を再生産し、ケアラーが他者化と認識的不正義を受けていることを、3つの研究の主題的統合で示した（抄録）。", "p2": "インフォーマルなケアとケアネットワークでのケアの分担の知見は増えたが、移民背景のケアラーとケアの受け手の視点は公衆衛生の研究で見落とされてきた。専門職と移民背景のケアラーの協働は不平等を（再）生産しがちである（抄録）。", "p3": "ケアの受け手、移民背景のケアラー、専門職の視点を別々に調べた3つの実証研究を二次分析し、多様性の交差する側面と背後の力関係が協働をどう形づくるかを、包括的な主題的統合でまとめた（抄録）。", "p4": "評価の対象は、協働の中の不公正の現れ方と、それを生む力の動きである（抄録）。参加者の人数や国は抄録に記載がない。", "p5": "統合からは協働のケアの断絶が浮かび上がり、ケアラーは他者化と認識的不正義（知識や経験を正当に扱われないこと）に直面していた。協働は複雑で、不正な力関係を再生産することが多かった（抄録）。", "p6": "著者は、ケアの組織が交差性の視点を政策と実践に取り入れ、批判的な省察と継続的な対話の場を作り、ケアラーを対等なパートナーとして認める、多様性に応じたケアへ移ることを提言する（抄録）。解釈：二次分析のため、元の研究の設計や対象の偏りを引き継ぐ。", "fun": "家族の介護を担う人は、医療や福祉の専門家と協力して患者を支えます。ところが移民の家族の場合、その知識や経験が軽く扱われ、協力の輪から外されがちでした。誰の知識が「正しい知識」として扱われるのかという、目に見えにくい力関係を掘り起こした点が面白いところです。", "unverified": "抄録のみ読んだ。元の3研究の対象者数、国、データ収集の方法は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "AIが関わる口コミ「合成WOM」の枠組み", "title": "From eWOM to Synthetic WOM: A Systematic Review and Integrative Framework for AI-Mediated Persuasion in Tourism and Hospitality", "url": "https://doi.org/10.3390/jtaer21110409", "authors": "Sofia K. Gkarane", "venue": "Journal of theoretical and applied electronic commerce research", "date": "2026-11-04", "citescore": 7.1, "citescore_year": "2025", "apa": "Gkarane, S. K. (2026). From eWOM to Synthetic WOM: A Systematic Review and Integrative Framework for AI-Mediated Persuasion in Tourism and Hospitality. Journal of Theoretical and Applied Electronic Commerce Research, 21(11), 409. https://doi.org/10.3390/jtaer21110409", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Theoretical and Applied Electronic Commerce Research（MDPI）の抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "AIが口コミの分析・選択・言い換え・生成に関わる状況を観光・ホスピタリティの研究の体系的レビューで整理し、AIの5つの役割を「合成口コミ（Synthetic WOM）」の枠組みに位置づけ、出どころの手がかりから消費者の評価と成果に至る経路を提案した（抄録）。", "p2": "観光・ホスピタリティの研究は、AIによる口コミの利用を重なり合う概念で扱っており、人の経験や電子口コミ（eWOM）との関係があいまいだった（抄録）。", "p3": "Scopusに索引された英語の142本の書誌計量的なマッピング、54本の主題的な符号化、分析の中核とした20本の精読による比較を組み合わせた（抄録）。", "p4": "評価の対象は、生成AIの研究上の位置づけ、AIの役割の区別（経験の出どころと、メッセージの作成・提示の制御）、提案する経路の各関係の実証的な裏づけである（抄録）。", "p5": "書誌計量は、生成システムをeWOM、レビュー分析、サービス技術、推薦の研究の中に位置づけた。統合では口コミのコミュニケーションでのAIの5つの役割を特定し、それらは経験の出どころとメッセージの作成・提示の制御で異なった。実務の優先事項として、AIの関与の明確な開示、情報源の明示、裏づけとなるレビューへのアクセスを挙げた（抄録）。", "p6": "レビューした研究は経路の個々の関係を支持するが、経路の全体は実証されていないと著者は述べる（抄録）。解釈：英語でScopusに索引された文献に限られ、観光以外の分野への一般化には検討が要る。", "fun": "旅行先のホテルを選ぶとき、私たちは口コミを頼りにします。でも今は、AIが口コミを要約したり、言い換えたり、ときには書いたりしています。この研究は、AIが口コミに関わる5つの役割を整理し、「その口コミは誰の経験から来たのか」が見えるかどうかが信頼の鍵だと示しました。本物の体験と機械の言葉の境目を考える点が面白いところです。", "unverified": "抄録のみ読んだ。5つの役割の具体的な名称と、各関係を支持する研究の数は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "粒子形状がダイレイタンシーに効くのは低応力", "title": "Three-Dimensional Particle Shape and Stress–Dilatancy Behavior of Carbonate and Silica Sands at Low Normal Stresses: A Direct Simple Shear Investigation", "url": "https://doi.org/10.1061/jggefk.gteng-15701", "authors": "Sanchari Mondal ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-11-05", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Mondal, S., Chow, S. H., Beemer, R., & Cassidy, M. (2027). Three-Dimensional Particle Shape and Stress–Dilatancy Behavior of Carbonate and Silica Sands at Low Normal Stresses: A Direct Simple Shear Investigation. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15701", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Geotechnical and Geoenvironmental Engineeringの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "X線マイクロCTで11種類の砂の3次元の粒子形状を定量し、単純せん断試験で、粒子形状が応力-ダイレイタンシーに与える影響は低密度・低い拘束圧で最も強く、状態に依存することを示した（抄録）。", "p2": "粒状体の強度と体積変化（ダイレイタンシー）に粒子形状が影響することは知られるが、低い応力での単純せん断の条件で3次元の形状をどう扱うべきかは明確でなかった（抄録）。", "p3": "シリカ・炭酸塩・混合の11種類の砂を5.5 μmのボクセルでCT撮影し、分水嶺法で1材料あたり1万粒以上を分離して3次元の形状記述子を求め、粒度分布をふるい分けと照合した。次に3材料（UWA極細シリカ、ledge point、ガラスビーズ）で、相対密度0.4〜0.9、垂直応力25〜150 kPaの直接単純せん断試験を行った（抄録）。", "p4": "評価は、ピークの摩擦、過剰摩擦（ダイレイタンシーによる上乗せ）、ダイレイタンシーの応答が、粒子形状・密度・応力によってどう変わるかである（抄録）。", "p5": "粒子形状はピークの摩擦、過剰摩擦、ダイレイタンシーの応答に影響したが、その大きさは密度と垂直応力に依存した。形状の効果は、粒子の再配列とダイレイタンシーが起こりやすい低密度・低応力で最も強く、相対密度や垂直応力が上がると3材料の応答は収束した（抄録）。", "p6": "著者は、粒子形状を固定した材料の補正ではなく、低応力での応力-ダイレイタンシーの状態に依存した修正因子として扱うべきだと結論する（抄録）。解釈：試験は3材料に限られ、炭酸塩の砂の粒子破砕の影響は抄録では確かめられない。", "fun": "砂浜の砂も、拡大して見ると丸い粒、角ばった粒、平たい粒などさまざまです。この研究は、CTで1万粒以上の形を一つずつ測り、粒の形が砂の強さにどう効くかを調べました。ぎゅっと詰まっていない、上から押す力の弱い状態ほど形の違いが効き、強く押し固めると形の差は目立たなくなる。形の影響が「状態しだい」で変わる点が面白いところです。", "unverified": "抄録のみ読んだ。形状記述子の種類と、摩擦角の具体的な差の数値は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "AIによる否定的フィードバックの受け止め方", "title": "How AI negative feedback shapes employee appraisals and job crafting", "url": "https://doi.org/10.1080/02642069.2026.2754018", "authors": "Fuda Li ほか", "venue": "Service Industries Journal", "date": "2026-11-03", "citescore": 17.4, "citescore_year": "2025", "apa": "Li, F., Li, Q., Zhuo, F., & Yin, S. (2026). How AI negative feedback shapes employee appraisals and job crafting. The Service Industries Journal, 1–30. https://doi.org/10.1080/02642069.2026.2754018", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Service Industries Journalの抄録（OpenAlex登録）を使用し、本文は入手できず", "preprint": false, "p1": "AIが伝える否定的な業績フィードバックへの従業員の反応は一様ではなく、成績接近の目標志向が高い人は挑戦と、成績回避の目標志向が高い人は阻害と受け止め、それぞれ異なるジョブ・クラフティングにつながることを2つの研究で示した（抄録）。", "p2": "AIが職場の業績フィードバックを担うようになっているが、AIからの否定的なフィードバックへの反応は分かっていなかった（抄録）。", "p3": "認知的評価理論に基づき、フィードバックの送り手が挑戦・阻害の評価を通じてジョブ・クラフティング（促進焦点・予防焦点）に関連し、その関係が成績目標志向に左右されるという調整媒介モデルを検証した（抄録）。", "p4": "研究1は就業者406人のシナリオ実験、研究2は従業員280人から1,953件の否定的フィードバックのエピソードを集めた日次の経験サンプリングで、条件付きの間接効果を推定した（抄録）。", "p5": "研究1では、AIからの否定的フィードバックは、成績接近の志向が高い人では挑戦の評価を、成績回避の志向が高い人では阻害の評価を強く引き起こし、促進焦点・予防焦点のジョブ・クラフティングへの条件付きの間接効果は有意だった。研究2はこれらのパターンを再現した（抄録）。", "p6": "抄録の範囲では、効果の大きさと、人からのフィードバックとの比較の詳細は確かめられない。解釈：研究2の日次の測定は自己報告で、送り手が実際にAIかどうかの確かめ方も抄録からは分からない。", "fun": "AIに「今月の成績は目標に届いていません」と言われたら、やる気が出るでしょうか、落ち込むでしょうか。この研究によると、それは人によります。「もっと上を目指したい」タイプの人は挑戦と受け止めて仕事の工夫を広げ、「失敗したくない」タイプの人は壁と受け止めて守りの工夫に向かいました。同じ言葉でも受け手の心構えで意味が変わる点が面白いところです。", "unverified": "抄録のみ読んだ。効果量、人からのフィードバックとの差、職種の内訳は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "FEMから粒子へ物理量を保存して切り替える", "title": "A framework for a macro-micro transformation which conserves physical quantities", "url": "https://doi.org/10.1016/j.apm.2026.117394", "authors": "Momme Jahn ほか", "venue": "Applied Mathematical Modelling", "date": "2026-10-28", "citescore": 10.2, "citescore_year": "2025", "apa": "Jahn, M., & Meywerk, M. (2027). A framework for a macro-m
