t Feature Importance Stability in Financial Distress Prediction", "url": "https://doi.org/10.32520/stmsi.v15i10.6935", "authors": "Alan Kusuma Soesanto ほか", "venue": "SISTEMASI", "date": "2026-10-31", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "財務困窮予測でSMOTEを使うと、少数クラスの検出は上がっても特徴量重要度の安定性に影響することを調べた（抄録）。", "p3": "台湾の企業倒産データ（6,819社）でランダムフォレストを学習し、SMOTEの有無で予測性能と特徴量重要度の一貫性を比べた（抄録）。", "p5": "抄録の範囲では、性能と安定性の結果の数値は未確認。", "fun": "倒産する会社は全体のごく一部なので、AIは「みんな倒産しない」と答えるだけで高い正解率になってしまいます。そこで少数派の例を人工的に増やすのがSMOTEです。でも、増やしたせいで「どの指標が効いているか」の説明がぶれるなら、説明として信用できません。予測と説明の両立を問う研究です。", "unverified": "倒産企業の数と結果は抄録で切れており未確認。"}}, {"id": "jr31", "rank": 31, "headline": "隠れたコストの会計が家族企業の変革を媒介", "title": "Moving beyond the invisible: hidden cost accounting as a mediating device for organizational change in crisis-stricken small family-owned businesses", "url": "https://doi.org/10.1108/jaoc-01-2026-0067", "authors": "Alexan Hagopian ほか", "venue": "Journal of Accounting & Organizational Change", "date": "2026-11-02", "citescore": 7.1, "citescore_year": "2025", "apa": "Hagopian, A., & Baker, C. R. (2026). Moving beyond the invisible: hidden cost accounting as a mediating device for organizational change in crisis-stricken small family-owned businesses. Journal of Accounting & Organizational Change, 1–29. https://doi.org/10.1108/jaoc-01-2026-0067", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "危機下の小規模な家族企業で、隠れたコストの計算が組織の意味づけと専門職化を媒介することを示した（抄録）。", "p3": "社会経済的経営アプローチ（SEAM）とそのクオリメトリクスの手順を使う介入研究で、レバノンの工業系の小規模家族企業を縦断的に追った事例研究（抄録）。", "p5": "隠れたコストの計算は、非公式な機能不全を見えるようにし、話し合え、管理の手順に結びつけられるものにし、媒介する会計表現として働いた（抄録）。", "fun": "会社の「むだ」は、帳簿に載らないことが多いものです。例えば手戻りや欠勤の穴埋めにかかる時間です。この研究は、そうした隠れたコストをお金に換算して見せることで、家族経営の会社が「なんとなくの不満」を具体的な改善の話題に変えられたことを示しました。数字が話し合いの共通語になる例です。", "unverified": "隠れたコストの金額は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "グリーンなブランド資産は失敗時に守るか燃えるか", "title": "Does Green Brand Equity Buffer or Burn? Understanding Boundary Conditions in Justice Evaluations of Sharing Economy Service Failure", "url": "https://doi.org/10.1515/roms-2026-0070", "authors": "Taiba Musadiq Sahaf ほか", "venue": "Review of Marketing Science", "date": "2026-11-02", "citescore": 2.1, "citescore_year": "2025", "apa": "Sahaf, T., & Fazili, A. (2026). Does Green Brand Equity Buffer or Burn? Understanding Boundary Conditions in Justice Evaluations of Sharing Economy Service Failure. Review of Marketing Science. https://doi.org/10.1515/roms-2026-0070", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "シェアリングエコノミーのサービス失敗で、グリーンなブランド資産が回復の公正評価とロイヤルティの関係を守るか損なうかを調べた（抄録）。", "p3": "グリーンなブランド資産を、道徳的な信号・規範的な期待・価値を帯びたアイデンティティの手がかりとみなし、期待不一致と同化・カテゴリー化の判断の対立から役割を検討した（抄録）。", "p5": "抄録の範囲では、どの役割が支持されたかは未確認。", "fun": "「環境にやさしい」と評判の会社が失敗したとき、客は「いつもいい会社だから」と許すでしょうか、それとも「期待していたのに」と余計に怒るでしょうか。この研究は、良い評判がクッションにも火種にもなりうるという二面性を、サービスの失敗と回復の場面で確かめようとしています。", "unverified": "研究の方法と結果は抄録で切れており未確認。"}}, {"id": "jr33", "rank": 33, "headline": "企業の社会的無責任がブランド憎悪と悪い口コミへ", "title": "Corporate social irresponsibility unleashed: igniting brand hate and betrayal to fuel negative eWOM", "url": "https://doi.org/10.1108/srj-12-2025-1333", "authors": "Davood Ghorbanzadeh ほか", "venue": "Social Responsibility Journal", "date": "2026-11-02", "citescore": 9.6, "citescore_year": "2025", "apa": "Ghorbanzadeh, D., Elsayed, A. M., Karimov, N., Chandra, S., Prasad, K. D. V., & Alhitmi, H. K. (2026). Corporate social irresponsibility unleashed: igniting brand hate and betrayal to fuel negative eWOM. Social Responsibility Journal, 1–16. https://doi.org/10.1108/srj-12-2025-1333", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "企業の社会的無責任が、ブランド憎悪と裏切られ感を通じてSNSでの否定的な口コミを生むことを、集団主義の文化圏で調べた（抄録）。", "p3": "イランのテヘランの消費者への横断的な調査を、偏最小二乗の構造方程式モデリングで分析した（抄録）。", "p5": "抄録の範囲では、媒介効果の大きさは未確認。", "fun": "会社が不祥事を起こすと、客は「嫌い」になるだけでなく「裏切られた」と感じます。この研究は、その二つの気持ちが、SNSでの悪い口コミにつながる道筋を調べました。個人より集団の和を重んじる文化で、怒りがどう広がるかに注目しているのが特徴です。", "unverified": "結果の数値は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "顧客から製造者へ：プラットフォームの協業範囲", "title": "EXPRESS: Customer-to-Manufacturer: Should a Platform Cooperate with More Manufacturers?", "url": "https://doi.org/10.1177/10591478261507271", "authors": "Tonghuan Shi ほか", "venue": "Production and Operations Management", "date": "2026-11-03", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Shi, T., Tian, L., & Xu, Z. (2026). EXPRESS: Customer-to-Manufacturer: Should a Platform Cooperate with More Manufacturers? Production and Operations Management. https://doi.org/10.1177/10591478261507271", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "消費者の声を製造者に直接届けるC2Mモデルで、プラットフォームが何社の製造者と協力すべきかを分析モデルで調べた（抄録）。", "p3": "1つのプラットフォームと競合する2つの製造者からなるオンライン市場で、C2Mモデルの戦略的な採用を分析する理論モデル（抄録）。", "p5": "抄録の範囲では、協力の範囲についての結論は未確認。", "fun": "新製品の多くは売れずに終わります。作る側が客の声を聞かずに作るからです。ネット通販の会社が客の声をメーカーに直接伝えれば、当たる製品が増えるかもしれません。でも、それをライバルのメーカー両方に教えるべきかは悩ましい問題です。情報の配り方の損得を数式で考える研究です。", "unverified": "モデルの主な結論は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "埋立処分の家計負担は費用配分の設計で決まる", "title": "Household affordability of sanitary landfilling is governed by cost allocation rather than metropolitan economic capacity", "url": "https://doi.org/10.1038/s43247-026-04208-1", "authors": "Yugo Sato ほか", "venue": "Communications Earth and Environment", "date": "2026-11-03", "sjr": 3.168, "citescore": 11.3, "citescore_year": "2025", "apa": "Sato, Y., & Chen, G. (2026). Household affordability of sanitary landfilling is governed by cost allocation rather than metropolitan economic capacity. Communications Earth & Environment. https://doi.org/10.1038/s43247-026-04208-1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "途上国の巨大都市で衛生埋立の家計負担を左右するのは、都市の経済力ではなく費用の配分の仕方だと示した（抄録）。", "p3": "埋立地の空間的な立地選定、工学的な正味現在価値モデル、衛星から推計した都市圏の総生産を組み合わせた都市規模の枠組みを、6つの途上国の巨大都市に適用した（抄録）。", "p5": "制度全体としての実行可能性が、家計にとっての負担可能性には結びつかないことを定量化した（抄録。数値は未確認）。", "fun": "ごみを野積みから衛生的な埋立地に変えるには、お金がかかります。都市全体としては払える額でも、それを誰がどれだけ負担するかで、貧しい家庭には重すぎることがあります。この研究は、問題は町の豊かさより「分け方」にあることを示しました。同じケーキでも切り方で不公平が生まれるのです。", "unverified": "6都市の具体的な結果は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "都市デジタルツインと行政におけるAIの役割", "title": "Roles of Artificial Intelligence in Urban Digital Twins and Governance", "url": "https://doi.org/10.3390/smartcities9110187", "authors": "Jenna-Riia Oldenburg ほか", "venue": "Smart Cities", "date": "2026-11-03", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Oldenburg, J.-R., & Virtanen, J.-P. (2026). Roles of Artificial Intelligence in Urban Digital Twins and Governance. Smart Cities, 9(11), 187. https://doi.org/10.3390/smartcities9110187", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "都市のデジタルツインと行政の中でAIが果たす役割を整理した（抄録）。", "p3": "行政の自動化、意思決定支援、市民との接点、予測分析など、交通・保健福祉・環境の各領域でのAIの利用を文献から検討した（抄録）。", "p5": "既存の証拠は主に内部の効率に集中しており、都市デジタルツインの中でのAIの役割は十分に示されていないとした（抄録）。", "fun": "街をまるごとコンピュータの中に写した「デジタルツイン」は、欧州の多くの都市で使われています。そこにAIが入ると何ができるのか。この論文は、これまでの成果が役所の仕事の効率化に偏っていて、市民にとっての価値や政策の質の向上はまだよく分かっていない、と整理しました。", "unverified": "なし"}}, {"id": "jr37", "rank": 37, "headline": "SNSの街並み投稿から集合的感情を読む", "title": "Evaluating urban street views through collective emotional perception from multimodal social media cityscape posts: An R-ECoT-based interpretable framework", "url": "https://doi.org/10.1016/j.landurbplan.2026.105822", "authors": "Jianyu Fu ほか", "venue": "Landscape and Urban Planning", "date": "2026-11-03", "sjr": 2.952, "citescore": 19.6, "citescore_year": "2025", "apa": "Fu, J., Wang, X., Ma, J., Zhao, C., Ogawa, Y., & Sekimoto, Y. (2027). Evaluating urban street views through collective emotional perception from multimodal social media cityscape posts: An R-ECoT-based interpretable framework. Landscape and Urban Planning, 278, 105822. https://doi.org/10.1016/j.landurbplan.2026.105822", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、SNSの街並みの投稿（画像と文）から集合的な感情の知覚を読み取り、解釈可能な枠組み（R-ECoT）で街路景観を評価する論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、人々がSNSに投稿する街の写真と言葉から、その街並みが「心地よい」「怖い」などとどう感じられているかを読み取れるか、です。一人の感想ではなく、大勢の投稿を重ねた「みんなの感じ方」を地図にする発想と読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "LLMと人間の文章の性格表現と知覚", "title": "Personality expression and perception in large language models and humans", "url": "https://doi.org/10.1038/s41598-026-75546-5", "authors": "Sophie T. Koerner ほか", "venue": "Scientific Reports", "date": "2026-11-03", "citescore": 6.4, "citescore_year": "2025", "apa": "Koerner, S. T., Egloff, B., & Osterholz, S. (2026). Personality expression and perception in large language models and humans. Scientific Reports, 16(1). https://doi.org/10.1038/s41598-026-75546-5", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "7つのLLMが自分をどう描写するかを人と比べ、性格の表れ方と知覚を調べた（抄録）。", "p3": "ChatGPT-4o、ChatGPT-3.5、Llama 3、Gemma、Gemini、Phi-3、Orca-2に、ビッグファイブ、自尊感情、自己愛の質問紙と、短い自己紹介文を引き出すプロンプトで回答させ、人の回答と比べた（抄録）。", "p5": "抄録の範囲では、人とLLMの違いや見分けやすさの結果は未確認。", "fun": "AIに「あなたはどんな性格ですか」と聞くと、どう答えるでしょう。この研究は、人と同じ性格テストをAIに受けさせ、自己紹介文も書かせて、人の答えと比べました。AIが描く「自分」は人間らしいのか、それとも見破れるほど違うのかを、心理学の物差しで確かめています。", "unverified": "結果は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "データ由来とLLM由来の指標重みを比較", "title": "Comparing Data-Derived and LLM-Elicited Indicator Weights for EU Circular Economy Assessment: An MCDA Study", "url": "https://doi.org/10.3390/su182111148", "authors": "Puren Veziroglu-Bicer", "venue": "Sustainability", "date": "2026-11-02", "citescore": 8.9, "citescore_year": "2025", "apa": "Veziroglu-Bicer, P. (2026). Comparing Data-Derived and LLM-Elicited Indicator Weights for EU Circular Economy Assessment: An MCDA Study. Sustainability, 18(21), 11148. https://doi.org/10.3390/su182111148", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "EUの循環経済指標の重みを、データから求めた場合とLLMに専門家役で求めさせた場合で比べた（抄録）。", "p3": "27か国・2022年の13指標について、CRITIC、エントロピー、MERECでデータ由来の重みを求め、2つのLLMに専門家ペルソナでAHPの一対比較をさせ、TOPSISとMARCOSで順位づけ。LLMの重みは繰り返しとプロンプトの変更で検証した（抄録）。", "p5": "抄録の範囲では、重みと順位の一致度の結果は未確認。", "fun": "国の環境の成績を比べるとき、どの指標を重く見るかで順位が変わります。この研究は、データの散らばりから機械的に決めた重みと、AIに「専門家になったつもりで」決めさせた重みを比べました。AIの判断が、人の専門家の代わりになりうるか、どれほど安定しているかを試す試みです。", "unverified": "比較の結果は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "汚職場面でLLMエージェントは合理的か道徳的か", "title": "Digital Homo Economicus or Homo Moralis? Assessing the rationality of LLM agents in corrupt situations", "url": "https://doi.org/10.46554/1993-0453-2026-10-264-189-199", "authors": "M. S. Sidorov ほか", "venue": "Vestnik of Samara State University of Economics", "date": "2026-10-31", "apa": "Sidorov, N. S., Kapustina, Iu. I., Apanovich, A. M., & Sidorov, S. B. (2026). Digital Homo Economicus or Homo Moralis? Assessing the rationality of LLM agents in corrupt situations. Vestnik of Samara State University of Economics, (10), 189–199. https://doi.org/10.46554/1993-0453-2026-10-264-189-199", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "汚職の場面を模擬し、LLMエージェントが経済合理的にふるまうか道徳的にふるまうかを調べた（抄録）。", "p3": "ベッカーの犯罪の経済理論とトヴェルスキー・カーネマンのフレーミング効果に基づき、汚職の取引をモンテカルロ・シミュレーションで定式化した（抄録）。", "p5": "抄録の範囲では結果は未確認。", "fun": "賄賂を受け取るかどうかを、損得だけで決める人もいれば、良心で断る人もいます。AIに同じ場面を与えたらどうするでしょう。この研究は、罰の確率や見返りの大きさ、話の言い回しを変えて、AIの判断が損得と道徳のどちらに傾くかを試しました。AIの「人柄」を経済学の目で調べる研究です。", "unverified": "結果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "ESG活動が従業員のwell-beingを高める経路", "title": "The Impact of ESG Activity on Employees' Psychological Wellbeing and Intention to Participate: The Mediating Effect of Authenticity, Organizational Trust, and Identification", "url": "https://doi.org/10.1002/csr.71148", "authors": "Kihwan Kim ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-03", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Kim, K., Kim, S., & Park, M. (2026). The Impact of ESG Activity on Employees’ Psychological Wellbeing and Intention to Participate: The Mediating Effect of Authenticity, Organizational Trust, and Identification. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71148", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "従業員が会社のESG活動を本物と感じることが、組織への信頼と同一化を通じて心理的well-beingを高めることを示した（抄録）。", "p3": "韓国の金融業の従業員358人の調査データを構造方程式モデリングで分析し、真正性・組織的信頼・同一化の媒介を検証した（抄録）。", "p5": "ESGの真正性が、ESGの認知と組織的信頼・同一化の関係を完全に媒介し、それが従業員のwell-beingと参加意図を高めた（抄録）。", "fun": "会社が環境や社会のための活動をしても、社員が「見せかけだ」と思えば心は動きません。この研究は、活動を知っているだけでは足りず、「本気だ」と感じて初めて会社への信頼や誇りが生まれ、社員の幸福感につながることを示しました。中身より受け止め方が効くという点が興味深いところです。", "unverified": "なし"}}, {"id": "jr42", "rank": 42, "headline": "ICT化と仕事の資源が欧州の従業員の活力に与える影響", "title": "Work engagement and mental well-being in the ICT age: investigating the role of job resources among white-collar workers in Europe", "url": "https://doi.org/10.1108/ijm-03-2025-0203", "authors": "Ieva Urbanavičiūtė ほか", "venue": "International Journal of Manpower", "date": "2026-11-03", "citescore": 12.3, "citescore_year": "2025", "apa": "Urbanavičiūtė, I., Lazauskaitė-Zabielskė, J., Žiedelis, A., & Jakštienė, R. (2026). Work engagement and mental well-being in the ICT age: investigating the role of job resources among white-collar workers in Europe. International Journal of Manpower, 1–19. https://doi.org/10.1108/ijm-03-2025-0203", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "仕事のデジタル化の度合いが違う欧州の労働者の間で、仕事の資源の水準と、熱意・心の健康への寄与を比べた（抄録）。", "p3": "2021年の欧州労働条件調査のデータで、ICTの重要度で分けた労働者群ごとに主要な心理社会的な仕事の資源を比べ、ワークエンゲージメントと精神的well-beingの予測への相対的な寄与を調べた（抄録）。", "p5": "抄録の範囲では、群間の違いの結果は未確認。", "fun": "パソコンやネットに囲まれた仕事は、自由度が増える一方で、いつでもつながる疲れもあります。この研究は、欧州の大規模な調査を使い、デジタル化の進み方が違う働き手の間で、仕事を支える「資源」（裁量や支援など）の効き方が違うかを比べました。", "unverified": "結果は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "職場の共同体感覚が知識の隠蔽を生む逆説", "title": "Unveiling the dark side of workplace community: knowledge hiding in frontline hospitality", "url": "https://doi.org/10.1108/ijchm-05-2026-0722", "authors": "Maryam Saeed Hashmi ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-03", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Hashmi, M. S., Hashmi, H. R. S., & Abdullah, F. (2026). Unveiling the dark side of workplace community: knowledge hiding in frontline hospitality. International Journal of Contemporary Hospitality Management, 1–21. https://doi.org/10.1108/ijchm-05-2026-0722", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "接客の現場で、職場の共同体感覚がかえって知識の隠蔽を生む逆説を、知識の心理的所有感で説明した（抄録）。", "p3": "ドイッチュの協力と競争の理論に基づき、パキスタンの接客従業員から3時点で集めた632件の回答で、向社会的動機を調整変数とする調整つき媒介モデルを共分散構造で検証した（抄録）。", "p5": "抄録の範囲では、媒介と調整の結果は未確認。", "fun": "仲の良い職場ほど、知っていることを教え合いそうです。ところがこの研究は、仲間意識が強いと「このコツは自分のもの」という気持ちも強まり、かえって知識を隠すことがある、という逆説を調べました。チームの絆が、思わぬところで情報の壁を生む仕組みです。", "unverified": "結果の数値は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "PERの差は期待収益と過大な成長期待の両方", "title": "The Cross-section of Subjective Expectations: Understanding Prices and Anomalies", "url": "https://doi.org/10.1093/rfs/hhag095", "authors": "Ricardo Delao ほか", "venue": "The Review of Financial Studies", "date": "2026-10-31", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "apa": "Delao, R., Han, X., & Myers, S. (2026). The Cross-section of Subjective Expectations: Understanding Prices and Anomalies. The Review of Financial Studies. https://doi.org/10.1093/rfs/hhag095", "why": "プロの予想でPERの横断的差を分解し、価格と異常収益を緩やかな学習で説明する。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "専門家の予想を使い、株価収益率（PER）の銘柄間の差を分解して、高いPERは低い期待収益と過大な利益成長の期待の両方で説明され、緩やかな学習と整合することを示した（抄録）。", "p2": "PERの横断的な違いや価格の異常（アノマリー）が、リスクの違いによる期待収益の差か、誤った期待によるのかは議論が続いている（抄録）。背景：主観的な期待のデータで両者を分けるのが近年の研究の流れ。", "p3": "入力は専門家の利益と収益の予想、出力はPERの水準の差の構成要素。価格・利益成長・収益の共変動の大きさと時期を調べ、平均の利益成長を定数ゲインで学習する構造的なリスクプレミアムのモデルで再現を試みる（抄録）。", "p4": "専門家の予想による分解を実データの価格・利益成長・収益と比べ、構造モデルが観測の特徴を再現するかを確かめた（抄録）。解釈：標本の期間と市場は抄録では確認できない。", "p5": "高いPERは低い期待収益と過度に高い期待利益成長の両方で説明された。共変動の大きさと時期は、直近の実現に敏感な期待ではなく緩やかな学習と整合した。利益成長の驚きは1期の収益に1対1では反映されず、時間をかけて徐々に収益に表れた。定数ゲインの学習を入れたモデルは、現実的なPERのばらつきと持続性を生んだ（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：専門家の予想が投資家全体の期待を代表するかは仮定に依存する。", "fun": "株価が利益に比べて高い会社は、「みんなが成長を期待しすぎている」のか「リスクが小さいから安心して高く買われている」のか。この研究は、プロの予想を使って両方が効いていることを示しました。しかも人々の期待は、最近のニュースに飛びつくのではなく、少しずつ考えを改めていく「ゆっくり学習」で動いていました。", "unverified": "本文が読めず、分解の比率の数値は未確認。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "投資家の先渡し収益期待は景気と逆に動く", "title": "Forward Return Expectations", "url": "https://doi.org/10.1093/rfs/hhag096", "authors": "Mihir Gandhi ほか", "venue": "The Review of Financial Studies", "date": "2026-10-31", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "apa": "Gandhi, M., Gormsen, N. J., & Lazarus, E. (2026). Forward Return Expectations. The Review of Financial Studies. https://doi.org/10.1093/rfs/hhag096", "why": "オプションと調査から短期・長期の収益期待を測り、先渡し期待の性質を示す。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "オプションと調査のデータから、投資家が将来の自分の短期の収益期待をどう予想しているか（先渡しの収益期待）を測り、それが景気と逆に、しかも過大に動くことを示した（抄録）。", "p2": "投資家の短期と長期の収益期待は別々に研究されてきたが、両者の組み合わせから分かる「将来の自分の期待についての期待」の性質は分かっていない（抄録）。", "p3": "入力はオプションの価格と調査に基づく、異なる期間の株式収益の期待、出力は先渡しの収益期待とリスクプレミアム。長期の期待から短期の期待を差し引いて、将来の短期の期待を取り出す（抄録）。背景：金利の期間構造から先渡し金利を求めるのと同じ考え方。", "p4": "複数のデータ源で先渡しの期待の景気循環の性質を調べ、その後に実現した短期の期待の変化と比べて過大かを検証し、世界金融危機とコロナ危機の株価下落への寄与を見積もった（抄録）。", "p5": "データ源をまたいで先渡しの収益期待は景気と逆に動き、特に先渡しのリスクプレミアムで顕著だった。ただしその変動は、その後に実現した短期の期待に比べて大きすぎた。この過大な変動は、世界金融危機とコロナ危機での株価下落のかなりの部分を説明しうる（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：オプションから期待を取り出すにはリスク中立の測度からの変換の仮定が要る。", "fun": "「来年の今ごろ、自分は株にどれくらいの儲けを期待しているだろう」。そんな「未来の自分の気持ちの予想」を、オプションの値段とアンケートから取り出した研究です。不景気のときほど、人は未来の自分が高い儲けを求めると予想していましたが、その予想は実際より大げさでした。この思い込みが、危機のときの株価の急落を深めた可能性があります。", "unverified": "本文が読めず、過大さの大きさと危機への寄与の割合は未確認。"}}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "手元資金は経営者の採用判断を変える", "title": "From Slack to Staff: Managers' Allocation of Slack Resources to Hiring", "url": "https://doi.org/10.1111/joms.70185", "authors": "Veroniek Collewaert ほか", "venue": "Journal of Management Studies", "date": "2026-11-03", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Collewaert, V., Paeleman, I., Vanacker, T., Anseel, F., & Bourgois, D. (2026). From Slack to Staff: Managers’ Allocation of Slack Resources to Hiring. Journal of Management Studies. https://doi.org/10.1111/joms.70185", "why": "現金という余剰資源が、従業員の採用に関わる要求の優先度を変えることを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "手元の現金という裁量の大きい余剰資源は、ショックへの備えや戦略の転換だけでなく、経営者が従業員の採用に関わる要求をどう解釈し優先するかを変え、採用を増やすことを示した（抄録）。", "p2": "先行研究は現金の保有を、ショックへの緩衝か戦略的な変化の触媒とみてきたが、利害関係者の要求への対応に使われる面は見過ごされてきた（抄録）。", "p3": "利害関係者の顕著性の理論に基づき、現金が採用に関わる要求の解釈と優先順位を変えて採用を増やし、構造的な要因でその要求の顕著性が高まるとき効果が強まると仮定した（抄録）。", "p4": "研究1はベルギー企業の大規模な実地研究で、現金と採用の関係と、特定の従業員集団への依存や外生的な法改正による調整を調べた。研究2はビネット実験で、従業員の顕著性の手がかりが現金から採用への配分を強めるかを因果的に検証した（抄録）。", "p5": "現金と採用には正で逓減する関係があった。この関係は、特定の従業員集団への企業の依存が大きいときと、外生的な法改正の後に強まった。ビネット実験では、従業員の顕著性の手がかりが、経営者が現金を採用の配分に変える度合いを強めた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：実地研究は1国の企業に限られ、採用の質や長期の成果は扱っていない。", "fun": "会社にお金の余裕があるとき、経営者はそれを何に使うでしょう。万一の備えや新しい事業だけではありません。この研究は、余裕があると経営者は「人手が足りない」という社員の声に耳を傾けやすくなり、人を雇うことを示しました。特に、その社員たちが会社にとって欠かせない存在であるほど、その傾向が強まりました。", "unverified": "本文が読めず、法改正の内容と効果の大きさは未確認。"}}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "マーケティング出身CEOは製品戦略を変える", "title": "EXPRESS: When Marketers Get the Top Job: How Marketing CEOs Influence Firms’ Product-Market Strategy", "url": "https://doi.org/10.1177/00222429261507094", "authors": "Shekhar Misra ほか", "venue": "Journal of Marketing", "date": "2026-11-03", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "apa": "Misra, S., Lee, B., & Haon, C. (2026). EXPRESS: When Marketers Get the Top Job: How Marketing CEOs Influence Firms’ Product-Market Strategy. Journal of Marketing. https://doi.org/10.1177/00222429261507094", "why": "マーケティング経験を持つCEOが製品ポートフォリオを通じて企業価値に与える影響。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "マーケティング経験を持つCEOは、製品ポートフォリオの差別化を通じて株主の収益を高めることを、質的研究・自然実験・パネルデータ・経営者の実験の組み合わせで示した（抄録）。", "p2": "マーケティングの上層部の研究はCMOに集中してきたが、マーケティングを含む重要な戦略の最終責任はCEOにある（抄録）。", "p3": "上層部理論と実務家への詳しい聞き取りに基づき、マーケティング出身のCEOは顧客セグメントの選択と競争戦略の実行に長け、より差別化されたポートフォリオを作り、株主の収益を高めると論じた（抄録）。", "p4": "質的研究、CEOの交代を使った自然実験、大規模なパネルデータの分析、経営者を対象とした実験を組み合わせた（抄録）。", "p5": "マーケティング出身のCEOはポートフォリオの差別化を通じて株主の収益に正の影響を与えた。その効果は、CEOの職業上のネットワークが大きいときと企業内の顧客志向が強いときに強まり、CEOの過信と企業の高い財務レバレッジで弱まった（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：CEOの経歴は企業が選ぶものなので、自然実験で選択の偏りがどこまで除けるかが鍵になる。", "fun": "会社のトップに、営業や商品企画の出身者が就くと何が変わるのか。この研究は、そうした社長は「誰に何を売るか」の選び方がうまく、他社と違う製品の品ぞろえをつくり、株価を上げることを示しました。ただし社長が自信過剰だったり、会社の借金が多かったりすると、その強みは弱まります。", "unverified": "本文が読めず、効果の大きさは未確認。"}}, {"id": "jn05", "rank": 5, "field": "統計学", "headline": "有界な確率変数の平均検定の最適e値", "title": "Optimal e-values for testing the mean of a bounded random variable against a composite alternative", "url": "https://doi.org/10.1093/biomet/asag070", "authors": "S Arnold ほか", "venue": "Biometrika", "date": "2026-10-30", "sjr": 3.4, "citescore": 5.4, "citescore_year": "2025", "apa": "Arnold, S., & Clerico, E. (2026). Optimal e-values for testing the mean of a bounded random variable against a composite alternative. Biometrika. https://doi.org/10.1093/biomet/asag070", "why": "複合対立仮説に対する最適な成長率のe値を明示的に導く。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "有界な確率変数の平均の検定で、最悪の場合の（相対的な）成長率が最適なe値を明示的に導き、GROW・REGROWの品質基準を相互に絶対連続でない仮説の場合に初めて適用した（抄録）。", "p2": "e値（いつ検定を止めても有効性が保たれる検定の量）の良さを測るGROWとREGROWの基準は、Grünwaldら（2024）が相互に絶対連続な仮説を前提に提案したもので、その外での適用は示されていなかった（抄録）。", "p3": "有界な確率変数の平均についての複合的な対立仮説に対し、両方の基準で最適なe値を明示的に導き、最も検定しにくい対立仮説を特徴づけた（抄録）。背景：e値は賭けの比喩で、帰無仮説が正しければ期待される賭け金が増えないよう作られる。", "p4": "理論の導出と、REGROWが有効でGROWが自明な解を与える2つの重要な例で示した（抄録）。", "p5": "両方の基準について、最も検定しにくい対立仮説を明示的に特徴づけ、それが意味のある解釈を持つことを示した。2つの重要な例で、REGROWは最適なe変数を選ぶ強力な品質基準となる一方、GROWは自明な解に至った（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：結果は有界な確率変数の平均の検定に限られる。", "fun": "「この薬は効くか」を確かめるとき、データを見ながら途中でやめても結論がゆがまない検定の道具がe値です。賭けにたとえると、効かないなら賭け金は増えない約束で、効くなら早く増える賭け方が良い賭け方です。この研究は、値の範囲が決まった量の平均を調べるときの「最も良い賭け方」を式で求め、二つの物差しのうち一方は役に立たないことも示しました。", "unverified": "本文が読めず、最適なe値の具体的な形は未確認。"}}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "寄付の効果が届く時期にも人はせっかち", "title": "EXPRESS: Impatient for Impact: Intertemporal Preferences for Earlier Donation Impact Timing", "url": "https://doi.org/10.1177/00222437261506804", "authors": "Jieyi Chen ほか", "venue": "Journal of Marketing Research", "date": "2026-11-03", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Chen, J., & Urminsky, O. (2026). EXPRESS: Impatient for Impact: Intertemporal Preferences for Earlier Donation Impact Timing. Journal of Marketing Research. https://doi.org/10.1177/00222437261506804", "why": "寄付の恩恵が届く時期への選好を7つの事前登録実験で検証。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "人は寄付でも、恩恵が受益者に届く時期（効果のタイミング）が早い慈善事業を一貫して好み、その理由は遅い恩恵の割り引きだけでなく、早い効果から寄付の効き目への信頼を推し量ることにもあると示した（抄録）。", "p2": "自分のための選択でのせっかちさは広く知られているが、見知らぬ他者の利益についての向社会的な決定でも人がせっかちになるかは分かっていない（抄録）。", "p3": "寄付の「効果のタイミング」を操作し、効果の大きさ、過去の寄付者数、完成までの残りの費用、評価、間接費などの他の条件とのトレードオフを含めて選好を調べた（抄録）。", "p4": "7つの事前登録の実験（N=2,462）とGoFundMeの二次データの分析を行った（抄録）。", "p5": "人は異なる目的、寄付額、期間、慈善団体の規模、他の条件とのトレードオフをまたいで、効果のタイミングが早い事業への寄付を一貫して好んだ。遅い効果の知覚された恩恵の低下だけでは選好を説明しきれず、早い効果から寄付の効き目に基づく信頼をより強く推し量ることが寄付の選好を高めた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：実験の多くは仮想の選択で、実際の寄付額への効果の大きさは二次データの分析に依存する。", "fun": "「今月中に井戸が完成します」と「3年後に学校が建ちます」。同じ寄付なら、多くの人は前者を選びます。自分のためにはせっかちでも、人のためなら気長に待てそうなものですが、そうではありませんでした。しかも早く効果が出る事業ほど「ちゃんとお金が役立っている」と信頼されやすい、という心理も見つかりました。", "unverified": "本文が読めず、効果量とGoFundMeの分析の詳細は未確認。"}}, {"id": "jn07", "rank": 7, "field": "政治学", "headline": "女性の野心に対する二重基準の起源", "title": "Women and the double standard of ambition", "url": "https://doi.org/10.1111/ajps.70091", "authors": "Geertje J. Bol", "venue": "American Journal of Political Science", "date": "2026-11-03", "sjr": 6.539, "citescore": 12.4, "citescore_year": "2025", "apa": "Bol, G. J. (2026). Women and the double standard of ambition. American Journal of Political Science. https://doi.org/10.1111/ajps.70091", "why": "近世イングランドで野心が受け入れられる中で、女性への二重基準が生まれた過程をたどる。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "近世イングランドで、野心が男性には自然で美徳とさえ受け入れられる一方、女性には不自然で悪徳とされる二重基準が生まれた過程をたどり、それに挑んだ17世紀の4人のフェミニストの議論を掘り起こした（抄録）。", "p2": "野心は称えるべきか非難すべきかが定まらない道徳的に不安定な性質で、その不安定さが二重基準を生むが、女性の野心への二重基準の起源と、それへの抵抗の思想史は見過ごされてきた（抄録）。", "p3": "政治思想史の方法で、二重基準の出現をたどり、レイチェル・スペクト、マーガレット・キャヴェンディッシュ、メアリー・アステル、ジュディス・ドレイクの著作を読み解いた（抄録）。", "p4": "文献の解釈による思想史の研究で、統計的な検証はない（抄録）。", "p5": "4人は野心をフェミニズムの道具として描き直し、女性の平等、さらには優位を論じるために使った。この「野心的なフェミニズム」の系譜は、今日のフェミニズム理論が指摘する落とし穴を避けつつ、フェミニズムと野心を和解させる道を示すと論じた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：4人の思想家の解釈に基づく議論で、当時の社会での受容の広がりは別の検証を要する。", "fun": "「出世したい」という気持ちは、男性なら「向上心がある」とほめられ、女性だと「出しゃばり」と言われがちです。この二重の物差しは、400年ほど前のイングランドで形づくられました。この論文は、当時すでにそれに反論し、野心こそ女性の平等を求める力だと書いた4人の女性たちの言葉を掘り起こしています。", "unverified": "本文が読めず、各思想家の議論の詳細は未確認。"}}, {"id": "jn08", "rank": 8, "field": "気候科学", "headline": "排出ゼロ後の気温変化は温暖化の水準で変わる", "title": "Zero emissions commitment depends on warming level", "url": "https://doi.org/10.1038/s41558-026-02776-w", "authors": "Laura Gibbs ほか", "venue": "Nature Climate Change", "date": "2026-11-03", "sjr": 7.978, "citescore": 39.0, "citescore_year": "2025", "apa": "Gibbs, L., Jones, C. D., Jones, C., Andrews, T., Liddicoat, S., Wiltshire, A. J., Robertson, E., Williams, R. G., de Mora, L., Walton, J., Dittus, A., Swaminathan, R., Ceppi, P., Smith, R. S., & Rumbold, S. T. (2026). Zero emissions commitment depends on warming level. Nature Climate Change. https://doi.org/10.1038/s41558-026-02776-w", "why": "排出ゼロ後の気温の推移が、それまでの温暖化の程度に依存することをモデルで示す。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（導入、UKESM1.2の排出ゼロ応答の節の冒頭、考察）と抄録を読んだ", "preprint": false, "p1": "地球システムモデルの排出ゼロの実験で、CO2の排出をやめた後の気温変化（排出ゼロ・コミットメント、ZEC）は、温暖化2Kまではほぼゼロだが、それより高い温暖化の水準では正になり、約150年後に0.4〜0.6K上がることを示した（抄録）。", "p2": "ZECは炭素予算の評価と温暖化の可逆性の理解の中心で、ほぼゼロと仮定されがちだが、それが排出をやめる時点までの温暖化の水準にどう依存するかは不明だった。標準的な多モデル比較（ZECMIP）の実験はこの依存を調べていない（導入、考察）。", "p3": "入力は1.5〜5Kの各温暖化水準で排出をゼロにした英国地球システムモデル（UKESM1.2）の実験、出力はその後の世界平均気温の変化。2層のエネルギー収支モデルで、ZECを「濃度一定のもとでの温暖化」（放射の非平衡が続くこと）と「陸と海の炭素吸収による冷却」の2つの競合する成分に分けて解釈する（抄録、考察）。", "p4": "温暖化の水準と排出停止後の時間ごとにZECを求め、1.5〜2Kの結果を既存の多モデルの結果やIPCC第6次評価報告書と比べた（本文）。", "p5": "ZECは2Kまでほぼゼロで、それより高い水準で正になり、約150年後に0.4〜0.6Kに達した。低い水準では2つの成分がほぼ打ち消し合うが、温暖化が進むと非平衡が大きくなって濃度一定の温暖化が強まり、陸の炭素吸収の飽和と、背景のCO2濃度が高いとCO2の減少の放射効果が小さくなることで炭素吸収の冷却が弱まった（抄録、考察）。", "p6": "著者は、AR6が評価したZEC50のモデル間の幅（−0.36〜0.28K）の上端にUKESMがあり、絶対値はモデル固有の振る舞いを含みうること、陸の炭素吸収の不確実性が大きいこと、排出停止までの経路（排出の速さ）にも依存しうることを認め、多モデルの比較に適用するとしている（考察）。", "fun": "CO2を出すのをやめれば、気温の上昇はそこで止まる、と考えられてきました。ところがこの計算では、温暖化が2度を超えてから止めると、その後も気温が上がり続けました。森や土がもうCO2を吸いきれなくなり、海が吸ってくれても効き目が薄くなるからです。「早くやめるほど引き返しやすい」ことを示す結果です。", "unverified": "成分ごとの寄与の数値は読んでいない。"}}, {"id": "jn09", "rank": 9, "field": "機械学習", "headline": "生成AIで数理最適化を誰でも使えるものに", "title": "Democratizing Optimization with Generative AI", "url": "https://doi.org/10.1287/opre.2025.2412", "authors": "David Simchi-Levi ほか", "venue": "Operations Research", "date": "2026-11-03", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Simchi-Levi, D., Dai, T., Menache, I., & Wu, M. X. (2026). Democratizing Optimization with Generative AI. Operations Research. https://doi.org/10.1287/opre.2025.2412", "why": "生成AIが最適化の技術と実務の普及の差を埋めるという4Iの枠組み。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "生成AIを数理最適化と組み合わせるための設計原則「4I」（洞察・解釈可能性・対話性・即応性）を示し、生成AIが最適化の技術と実務での普及の差を埋めうると論じた（抄録）。", "p2": "生成AIは広く注目される一方、数理最適化は専門家以外にはほとんど知られず、その技術的な能力に比べて実務での採用が限られている（抄録）。", "p3": "洞察は現在の業務の信頼できる最新の見方を作り、解釈可能性はモデルの論理とトレードオフを説明し、対話性は会話による「もしも」の分析を可能にし、即応性はモデルの更新と事象に応じた再最適化を支える（抄録）。", "p4": "概念的な論考で、実証の評価は抄録の範囲では示されていない（抄録）。", "p5": "生成AIは最適化を置き換えるのではなく補うもので、生成AIがモデル化と解釈の障壁を下げ、数理最適化がモデルに符号化した事業の目標・規則・厳しい制約を確実に守る、という役割分担を示した。幻覚や過度の依存の危険にも触れ、責任ある統合の研究の方向を示した（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：提案は設計原則で、現場での効果の定量的な検証は今後の課題と読める。", "fun": "工場の生産計画や配送ルートを最適に決める数学の道具は強力ですが、使いこなせるのは一部の専門家だけでした。そこで、話しかけられるAIを「通訳」にして、現場の人が「この条件を変えたらどうなる？」と聞けるようにしよう、という提案です。AIは話をわかりやすくし、厳密な計算は数学の道具に任せる、という分担が大事な点です。", "unverified": "本文が読めず、事例の有無は未確認。"}}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "手続きの負担が奨学金の利用を阻む", "title": "Bureaucracy and Burden: Understanding Take-up of a Need-Based Financial Aid Program", "url": "https://doi.org/10.3102/00028312261486425", "authors": "Elizabeth Burland ほか", "venue": "American Educational Research Journal", "date": "2026-11-03", "sjr": 2.151, "citescore": 7.2, "citescore_year": "2025", "apa": "Burland, E., Camo-Biogradlija, J., Ferrara-Gerson, K., Fields, X., Michelmore, K., Sotherland, N., Stange, K., Thompson, M. E., & Tompkins-Stange, M. (2026). Bureaucracy and Burden: Understanding Take-up of a Need-Based Financial Aid Program. American Educational Research Journal. https://doi.org/10.3102/00028312261486425", "why": "ミシガン州の需要ベース給付で、100万人超の学生データと聞き取りから利用率の低さを分析。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "ミシガン州の需要ベースの学費給付制度（TIP）で、対象者のごく一部しか給付を受けていないことと、その障壁が手続きの負担と行政責任の分断にあることを示した（抄録）。", "p2": "大学の学費援助を含む社会的な制度は、対象者の一部にしか届かないことが多いが、その理由を大規模なデータと現場の聞き取りで調べた研究は限られる（抄録）。", "p3": "大規模な混合研究法で、量的なデータで対象者と受給者を特定し、聞き取りで受給を妨げる要因を探った（抄録）。", "p4": "ミシガン州の公立学校の100万人を超える生徒のデータと、制度の担当者・高校のカウンセラー・学費援助の職員55人への聞き取りを使った（抄録）。", "p5": "ミシガン州の高校卒業生の3分の1がTIPの対象だったが、対象となるコミュニティカレッジの学生のうち給付を受けたのは約30%で、学費の負担軽減への効果が限られていた。受給を左右する主な障壁は、手続きの負担と、分断され定義のあいまいな行政の責任で、それが現場の担当者が負担を和らげる力を制約していた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：1州の1制度の分析で、手続きを簡素化したときの受給率の変化は直接は検証していない。", "fun": "せっかく学費の援助制度があっても、対象者の7割が受け取っていませんでした。原因はお金ではなく手続きです。書類が複雑で、しかも「誰が案内する責任を持つのか」が役所・高校・大学の間であいまいでした。制度をつくるだけでなく、届けるまでの道筋を設計することが大切だと教えてくれます。", "unverified": "本文が読めず、受給率の推移や手続きの具体的な内容は未確認。"}}, {"id": "jn11", "rank": 11, "field": "政治学", "headline": "政権の思想が公務員の女性昇進を左右", "title": "Government ideology and gender equality in public sector career progression", "url": "https://doi.org/10.1017/psrm.2026.10129", "authors": "Lasse Aaskoven ほか", "venue": "Political Science Research and Methods", "date": "2026-11-03", "sjr": 2.574, "citescore": 6.2, "citescore_year": "2025", "apa": "Aaskoven, L., Egerod, B. C. K., & Kjøller, F. K. (2026). Government ideology and gender equality in public sector career progression. Political Science Research and Methods, 1–23. https://doi.org/10.1017/psrm.2026.10129", "why": "デンマーク中央官庁の全職員データで、右派政権下で女性の昇進が停滞することを示す。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（データと分析戦略§5、結果§6の冒頭と図4、結論§8）と抄録を読んだ", "preprint": false, "p1": "デンマークの中央官庁の全職員の四半期データで、右派政権の下では女性公務員の昇進が男性より遅く、左派政権の下では男女の昇進が同程度であることを示した（抄録、§8）。", "p2": "豊かな民主主義国の多くで女性は公務員の過半を占めるのに管理職では少ない。政権の思想がこの差に関わるかは、官僚機構の一部の水準しか見られないデータの制約で検証が難しかった（§1、§5）。", "p3": "政権は公務員の昇進のパターンに影響でき、右派政権は男女の不平等を強める昇進のパターンを抑えないと論じる。入力は職員の給与段階と政権の思想、出力は昇進の速さで、差の差分法で政権の交代の前後と男女を比べる（抄録、§3、§6）。", "p4": "デンマーク公共財政管理庁との特別な取り決めで得た、1998年から2019年半ばまでの中央政府の全職員の四半期の給与データを使った。この期間に10の政権（左派4、右派6）があった（§5）。", "p5": "給与段階の男女差は全体で4段階で、男性は年に約0.4段階ずつ上がり、女性はずっと遅かった（§6、図4）。左派政権では男女が同程度に昇進し、右派政権では女性が遅かった。差は政治的な注目の大きい上位の階層、特に管理職で広がり、女性大臣の存在では縮まらなかった。右派政権の女性大臣の小さな正の効果は「ケア」の省への任命によるとみられる（抄録、§8）。", "p6": "解釈：1国の中央官庁の分析で、昇進を決める具体的な仕組み（任命の手続きなど）は直接は観察していない。政権交代の時期と他の変化の重なりの影響は、本文の代替説明の検討（§7.3）に依存する。", "fun": "女性が過半を占める役所でも、上の役職ほど男性が多い。なぜでしょう。この研究は、デンマークの全公務員の20年分の給与記録から、右派の政権の時期には女性の昇進が遅れ、左派の時期には男女差がなくなることを見つけました。誰が政権を担うかが、役所の中の出世の速さにまで影響している、という発見です。", "unverified": "差の差分法の推定値の大きさ（図5）は読んでいない。"}}, {"id": "jn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "中国の職場権限：性別・親であること・部門", "title": "Workplace authority in China: gender, parenthood, and work sectors", "url": "https://doi.org/10.1093/sf/soag157", "authors": "Manlin Cai", "venue": "Social Forces", "date": "2026-11-03", "sjr": 1.463, "citescore": 6.2, "citescore_year": "2025", "apa": "Cai, M. (2026). Workplace authority in China: gender, parenthood, and work sectors. Social Forces. https://doi.org/10.1093/sf/soag157", "why": "全国パネルで、親になることが職場権限の男女差をどう変えるかを部門別に分析。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "中国の全国パネルで、母親になると女性が職場で監督権限を持つ確率は下がり、父親は変わらないこと、その形が国有部門と民間部門で違うことを示した（抄録）。", "p2": "職場の権限は女性が男性より得にくい資源だが、親になることがこの性差をどう形づくり、雇用の体制によってどう違うかは分かっていない（抄録）。", "p3": "入力は同じ人の親になる前後の監督権限の有無、出力は親になることの男女別・部門別の効果。個人の固定効果モデルで、安定した個人差を除いた個人内の変化を推定した（抄録）。", "p4": "全国を代表する中国家族パネル調査（CFPS、2010〜2022年）の縦断データを使い、国有部門と民間部門で比べた（抄録）。", "p5": "女性が権限を持つ確率は母親になった後、特に2人以上の子を持った後に下がり、男性はほとんど変わらなかった。大きな母親ペナルティは民間部門に集中し、父親プレミアムは国有部門でだけ現れた。親になることは両部門で、異なる形で権限の男女差を広げた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。著者は、国有部門の公式の保護が母親の不利を和らげる一方、男性中心の階層と出生促進の政策が父親の報酬を保つと解釈している（抄録）。解釈：部門の選択自体が親になることと関連しうる。", "fun": "子どもが生まれると、女性は職場で部下を持つ立場から遠ざかり、男性はほとんど影響を受けませんでした。しかも、民間企業では「母親になると不利」が、国有企業では「父親になると有利」が目立ちました。同じ国でも、働く場所のしくみによって、親になることの意味が男女で違ってくるのです。", "unverified": "本文が読めず、効果の大きさは未確認。"}}, {"id": "jn13", "rank": 13, "field": "気候科学", "headline": "土壌水分と気温で複合乾燥高温を日単位で", "title": "The Standardized Soil Moisture-Temperature Compound Index (SSTCI): daily scale global data set and event catalogue for compound dry-hot extremes (1961–2023)", "url": "https://doi.org/10.5194/essd-18-7981-2026", "authors": "Rukhshinda Aftab ほか", "venue": "Earth System Science Data", "date": "2026-11-03", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "apa": "Aftab, R., Hagan, D. F. T., Wang, G., Shan, B., Shah, S. H., Chensi, Z., Xikun, W., Siddique, F., Jaffry, A. H., & Yeboah, E. (2026). The Standardized Soil Moisture-Temperature Compound Index (SSTCI): daily scale global data set and event catalogue for compound dry-hot extremes (1961–2023). Earth System Science Data, 18(11), 7981–8002. https://doi.org/10.5194/essd-18-7981-2026", "why": "1961〜2023年の世界の複合乾燥高温の日単位の指標と事象カタログ。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文（データと手法の節の構成、検証§3.2、限界と展望§3.9）と抄録を読んだ", "preprint": false, "p1": "土壌水分の「記憶」と日々の気温を組み合わせた日単位の複合乾燥高温の指標（SSTCI）と、それから作った事象カタログを、南極を除く全陸域の0.1°格子で1961〜2023年について公開した（抄録）。", "p2": "複合的な乾燥高温の極端現象を診断する指標の多くは月や季節の単位で、降水に基づく干ばつの代理指標に頼るため、土壌水分が駆動する速い陸面-大気のフィードバックを見逃しうる（抄録）。", "p3": "格子ごとに乾燥の進む事象から指数減衰を当てはめて特徴的な乾燥の時間尺度τ（土壌水分の記憶）を推定し、それで先行土壌水分の標準化指数（SASMI）を計算、日々の標準化気温指数（STI）と組み合わせ、フランク・コピュラで同時確率を表して標準正規変量に変換したものがSSTCI。短すぎる極端な期間を捨て、短い中断で分かれたものをつないで一貫した事象にする（抄録）。", "p4": "SASMIを広く使われる干ばつ指標と比べ、SSTCIを既存の複合指標との時空間の一貫性、極端日の一致、記録された事象での独立な植生ストレスとの対応、よく研究された事象の再現の4つの面から検証した（§3.2）。", "p5": "SASMI（SSTCI）は既存の干ばつ（複合）指標や植生ストレスと広く一致し、複数の地域と時間尺度で、記録の残る複合乾燥高温の事象の時期と推移を捉えた（抄録）。データはZenodoで公開されている（抄録）。", "p6": "著者は、ERA5-LandとERA5の再解析に由来する不確実性、観測の少ない地域や複雑な地表での性能の低下、寒冷・高緯度での凍結の影響、極乾燥地域の除外、灌漑が表されていないこと、τを1961〜2023年の中央値として土壌の記憶が安定と仮定していることを限界とする（§3.9）。", "fun": "「暑い」と「乾いている」が同時に起きると、作物や森へのダメージは別々の時よりずっと大きくなります。この研究は、土がどれくらい湿り気を覚えているかを場所ごとに計算し、その日の暑さと組み合わせて、毎日の「暑くて乾いた度合い」を世界中で60年分つくりました。月単位では見えない、数日で急に進む危機も捉えられます。", "unverified": "長期の頻度・期間の変化（§3.5〜3.6）の数値は読んでいない。"}}, {"id": "jn14", "rank": 14, "field": "交通・都市計画", "headline": "地盤沈下後の都市で安全な地下水備蓄を定める", "title": "Preparing for the next drought: delineating safe groundwater reserves in post-subsidence cities", "url": "https://doi.org/10.1038/s42949-026-00489-9", "authors": "Guangli Su ほか", "venue": "npj Urban Sustainability", "date": "2026-11-03", "sjr": 2.762, "citescore": 11.9, "citescore_year": "2025", "apa": "Su, G., Wang, G., Xiong, C., Wu, Y., Zhan, W., Wang, Y., Zhang, Y., Shen, Q., & Bao, Y. (2026). Preparing for the next drought: delineating safe groundwater reserves in post-subsidence cities. Npj Urban Sustainability. https://doi.org/10.1038/s42949-026-00489-9", "why": "天津を対象に、沈下を再発させない揚水の上限を水理・地盤力学で定める枠組み。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "地盤沈下から回復しつつある天津で、取り返しのつかない沈下を再び起こさない揚水の上限を水理・地盤力学で定め、渇水時に使える安全な地下水の備蓄量を地域ごとに示した（抄録）。", "p2": "沈下から回復中の都市は、長い渇水などの非常時に、回復不能な沈下を再び起こさずに地下水をどう安全に使うかという水の安全保障の板ばさみに直面する（抄録）。", "p3": "被圧帯水層の地域平均の固有鉛直動水勾配（IVHG）を定量化し、従来の層状のモデルに代わるIVHGで支配される連続的な帯水層のモデルを作る。地盤力学的な非弾性と弾性の境目である新しい先行圧密水頭（NPCH）を地図化し、安全な揚水の緩衝幅（SPB）を導く。各管理区域のSPBに面積と弾性貯留係数を掛けて安全な揚水量（SPV）にする（抄録）。", "p4": "点ごとの閾値をまとめて10の管理区域を設定し、それぞれに代表的なNPCHとSPBの値を与えた（抄録）。", "p5": "2025年時点の天津市全体の安全な揚水量は、地域平均の弾性貯留係数2.5×10⁻³に基づいて約0.16km³で、2028年には約0.3km³になると予測された（抄録）。", "p6": "未確認（抄録に限界の記述はない）。解釈：地域平均の貯留係数を使うため、区域内の不均一さによる局所的な沈下の危険は残りうる。", "fun": "地下水をくみすぎて地面が沈んだ町では、その後くみ上げを控えて水位が戻ってきます。では、いざ日照りが来たら、どこまでなら地面を沈ませずにくみ上げてよいのか。この研究は、土が「ばねのように戻る」範囲と「つぶれて戻らない」範囲の境目を地図にし、安全に使える地下水の量を計算しました。回復中の地下水を、非常用の貯金として管理する発想です。", "unverified": "本文が読めず、10区域ごとの値と検証の方法は未確認。"}}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "リサイクルマークが消費者を誤解させる", "title": "The Recycling Illusion: How the Mobius Loop Fuels Greenwashing", "url": "https://doi.org/10.1002/bse.71802", "authors": "Micael‐Lee Johnstone ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-03", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Johnstone, M.-L., Williams, J., Ashill, N., & Gazley, A. (2026). The Recycling Illusion: How the Mobius Loop Fuels Greenwashing. Business Strategy and the Environment. https://doi.org/10.1002/bse.71802", "why": "メビウスループの表示が再資源化できると誤認させることを3つの実験で示す。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref登録）を使用。本文は入手できず", "preprint": false, "p1": "政府が定める包装のメビウスループ（リサイクルマーク）と樹脂識別番号が、実際にはリサイクルできない包装でも消費者に再資源化できると思わせ、意図せずグリーンウォッシュになっていることを示した（抄録）。", "p2": "グリーンウォッシュは企業の誤解を招く主張として研究されてきたが、政府が規制する表示制度そのものが誤解を生む可能性は検討されていない（抄録）。", "p3": "包装の表示（メビウスループの有無、色、他のメッセージ、製品の種類）を操作し、再資源化できるか、環境にやさしいか、ブランドの印象の評価を測った（抄録）。", "p4": "3つの実験を行った（抄録）。解釈：参加者の数と国は抄録では確認できない。", "p5": "メビウスループのある包装は、実際には再資源化できない場合でも、一貫して肯定的に評価され、再資源化でき環境にやさしいと知覚された。この記号はブランドの印象も高めた。これはメビウスループの色や製品の種類にかかわらず起きた（抄録）。", "p6": "未確認（抄録に限界の記述はない）。著者は、この制度は意図せずともプラスチックごみの問題を長引かせると論じる（抄録）。解釈：実験での知覚の評価で、実際の分別行動への影響は測っていない。", "fun": "矢印がぐるっと輪になったマークを見ると、「リサイクルできる」と思いませんか。ところが、このマークは「リサイクルできるかもしれない素材の種類」を示すだけで、実際にはリサイクルされないプラスチックにも付いています。実験では、このマークだけで人は包装を環境にやさしいと感じました。善意の制度が、知らないうちに誤解を広めていたのです。", "unverified": "本文が読めず、実験の参加者と効果量は未確認。"}}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "意味に基づくリーダーシップと集団間リーダーシップ", "title": "Meaning-Based Leadership, Intergroup Leadership, and Team Strategy Implementation", "url": "https://doi.org/10.1177/15480518261504239", "authors": "Daan van Knippenberg ほか", "venue": "Journal of Leadership and Organizational Studies", "date": "2026-11-03", "sjr": 1.539, "citescore": 11.9, "citescore_year": "2025", "apa": "van Knippenberg, D., Dennerlein, T., & de Haas, M. (2026). Meaning-Based Leadership, Intergroup Leadership, and Team Strategy Implementation. Journal of Leadership & Organizational Studies. https://doi.org/10.1177/15480518261504239", "why": "チームの戦略実行におけるリーダーシップの役割を検証。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "組織の目的がチームの努力に与える意味を説くリーダーシップが、戦略の理解を通じてチームの戦略実行を動機づけることを論じた（抄録）。", "p3": "意味に基づくリーダーシップ理論を使い、リーダーが組織の目的の意味を説くことが、チームが戦略の実行にどう貢献できるかの共有理解を育てるという過程を示した（抄録）。", "p5": "抄録の範囲では、実証の結果と集団間リーダーシップの役割は未確認。", "fun": "会社の大きな目標は、現場のチームから見ると「自分たちに何の関係が」と感じがちです。この研究は、リーダーが「この仕事はこういう意味で会社の目的につながる」と語ることで、チームが自分たちの役割を理解し、戦略が動き出すと考えます。大きな話と目の前の仕事をつなぐ通訳としてのリーダーです。", "unverified": "実証の方法と結果は未確認。"}}, {"id": "jn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "美徳の逆説：組織の恥が変化への抵抗を生む", "title": "The virtue paradox: how perceived organizational social responsibility and organizational shame fuel resistance to change among motivated public servants", "url": "https://doi.org/10.1080/14719037.2026.2752047", "authors": "Marc Ohana ほか", "venue": "Public Management Review", "date": "2026-11-03", "sjr": 2.54, "citescore": 11.5, "citescore_year": "2025", "apa": "Ohana, M., Molines, M., Arnéguy, E., Darmandieu, A., & Carassus, D. (2026). The virtue paradox: how perceived organizational social responsibility and organizational shame fuel resistance to change among motivated public servants. Public Management Review, 1–29. https://doi.org/10.1080/14719037.2026.2752047", "why": "組織の社会的責任の認知と恥の感情が、公務員の変化への抵抗を強める過程。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、組織の社会的責任の認知と組織の恥の感情が、意欲の高い公務員の変化への抵抗を強めるという逆説を扱う論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「良いことをしている職場」に誇りを持つ真面目な公務員ほど、かえって改革に抵抗するのはなぜか、です。立派な理想があるからこそ、それに届かない現実に恥を感じ、変化を拒む。美徳が裏目に出る逆説を扱っていると読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jn18", "rank": 18, "field": "政治学", "headline": "平和維持部隊の出入りが民間人への暴力に与える影響", "title": "Here Today, Gone Tomorrow: Dynamics of peacekeeper entry and exit on violence against civilians", "url": "https://doi.org/10.1177/01925121261492253", "authors": "Sky Kunkel ほか", "venue": "International Political Science Review", "date": "2026-11-03", "sjr": 1.344, "citescore": 7.0, "citescore_year": "2025", "apa": "Kunkel, S., Atkinson, D. B., Dudley, R., & Warner, Z. (2026). Here Today, Gone Tomorrow: Dynamics of peacekeeper entry and exit on violence against civilians. International Political Science Review. https://doi.org/10.1177/01925121261492253", "why": "部隊の参入と撤退の時期による民間人への暴力の変化を分析。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "平和維持部隊の駐留は、反政府勢力の民間人への暴力を減らす一方、その地域の国家の暴力を増やし移動させることを示した（抄録）。", "p3": "2000〜2017年のアフリカ全域の平和維持部隊の展開の細かな位置データと、230万の観測による差の差分法で、反政府勢力と政府の暴力への影響を推定した（抄録）。", "p5": "平和維持部隊は地域の国家の暴力を増やして移動させ、反政府勢力の能力と民間人への暴力はおそらく減らした（抄録）。", "fun": "平和維持部隊が来れば、暴力は減るはずだと考えられてきました。この研究は、誰の暴力かを分けて見ると話が違うことを示しました。反政府勢力の暴力は減っても、政府側の暴力はむしろ増えたり、別の場所に移ったりします。全体の数字に隠れた「暴力の付け替え」を地図の細かさで見つけた点が鋭いところです。", "unverified": "撤退時の効果の詳細は抄録で切れており未確認。"}}, {"id": "jn19", "rank": 19, "field": "気候科学", "headline": "海面上昇は生態系サービスの価値を不均等に奪う", "title": "Sea-level rise drives unequal erosion of global ecosystem service value", "url": "https://doi.org/10.1093/pnasnexus/pgag339", "authors": "Hongyu Hu ほか", "venue": "PNAS Nexus", "date": "2026-11-03", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "Hu, H., Chen, Y., Xu, D., Zhu, Y., He, J., & Shao, Q. (2026). Sea-level rise drives unequal erosion of global ecosystem service value. PNAS Nexus, 5(11). https://doi.org/10.1093/pnasnexus/pgag339", "why": "海面上昇による沿岸の生態系サービスの価値の損失を世界規模で評価。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "海面上昇による世界の生態系サービスの価値の損失を5つの社会経済経路で評価し、その偏りを示した（抄録）。", "p3": "IPCC第6次評価の予測と詳しい価値評価モデルを組み合わせ、2030〜2100年について5つのSSPに沿った海面上昇の経路で生態系サービスの価値の曝露を評価した（抄録）。", "p5": "2100年の所得調整済みの年間損失は、SSP3-7.0の1,300億6百万（130.06 billion）国際ドルからSSP5-8.5の3,394億1千万（339.41 billion）国際ドルまでの幅だった。不浸透面と農地が絶対損失の約59〜60%を占め、湿地の相対損失が最大だった（SSP1-1.9で1.21%、SSP5-8.5で2.20%）（抄録）。", "fun": "海面が上がると、海辺の湿地や農地が失われ、そこから人が受けていた恵みも失われます。この研究はその恵みをお金に換算し、世界全体でどれだけ失われるかを見積もりました。さらに、これまで二酸化炭素をあまり出してこなかった国の人ほど、一人あたりの損失が大きくなるというずれも示しています。", "unverified": "一人あたりの責任と損失のずれの数値は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "制度の弱い国の環境配慮型中小企業の資源の組み合わせ", "title": "How Green SMEs Combine Resources for Financial Performance and Environmental Action: Multiple Pathways in Weak Institutional Contexts", "url": "https://doi.org/10.1002/bse.71774", "authors": "Hande Karadağ ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-03", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Karadağ, H., Karamollaoğlu, N., Şahin, F., & Saunila, M. (2026). How Green SMEs Combine Resources for Financial Performance and Environmental Action: Multiple Pathways in Weak Institutional Contexts. Business Strategy and the Environment. https://doi.org/10.1002/bse.71774", "why": "財務成果と環境行動を両立させる資源の組み合わせを複数の経路で示す。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "制度の弱い経済で、環境配慮型の中小企業が高い財務成果に至る資源の組み合わせが複数あることを示した（抄録）。", "p3": "動的能力の視点に立ち、質的比較分析（QCA）で、高い財務成果と環境行動の強さに結びつく資源の組み合わせを調べた（抄録）。", "p5": "財務・技術・人的・制度的資源が複雑に組み合わさり、知識集約の経路、制度に支えられた経路、人的資本中心の経路など、同じ結果に至る4つの構成が見つかった（抄録）。", "fun": "成功への道は一つではありません。ある会社は技術の知恵と民間の支えで、別の会社は公的な支援で、また別の会社は人材の力で、同じように成果を上げていました。QCAは、こうした「別々の道が同じ山頂に着く」パターンを見つけるのに向いた方法です。", "unverified": "4つ目の経路の内容と環境行動の結果は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "差別化された港湾料金と効率：米中定期航路", "title": "Differentiated port fees and efficiency: evidence from Sino–U.S. liner shipping", "url": "https://doi.org/10.1016/j.tra.2026.105332", "authors": "Kevin X. Li ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-30", "citescore": 12.1, "citescore_year": "2025", "apa": "Li, K. X., Zhao, X., Ye, G., & Xiao, Z. Y. (2027). Differentiated port fees and efficiency: evidence from Sino–U.S. liner shipping. Transportation Research Part A: Policy and Practice, 215, 105332. https://doi.org/10.1016/j.tra.2026.105332", "why": "港湾料金の差別化が海運の効率に与える影響（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、米中の定期船航路で港湾料金の差別化が効率に与える影響を実証した論文と読 録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "CO2排出に値段をつける取引可能なクレジット制度を大学で無作為化試験し、通勤の排出削減の証拠は全体では弱いことを示した（抄録）。", "p3": "600人超の参加者による数週間の無作為化比較試験で、CO2排出に値段をつけるMobilityCoinの仕組みを導入し、通勤の排出への効果を計量的に分析した（抄録）。", "p5": "通勤行動を変えたと答えたのは処置群18%、対照群10%だったが、全標本では排出削減の証拠は弱かった。有意な効果は一部の参加者で見られた（抄録）。", "fun": "炭素に値段をつける方法には、税金のほかに「排出の権利を配って売り買いさせる」方法があります。最初に配る量で不公平を和らげられるので受け入れられやすいのですが、参加者は複雑な判断を迫られます。実際に大学で試すと、行動を変えたと言う人は増えても、排出の減り方ははっきりしませんでした。", "unverified": "有意な効果が出た部分集団の内容は抄録で切れており未確認。"}}, {"id": "jn24", "rank": 24, "field": "交通・都市計画", "headline": "サンティアゴとニューヨークの無賃乗車の隠れた費用", "title": "Behavioral externalities and the hidden cost of fare evasion in Santiago de Chile and New York City", "url": "https://doi.org/10.1016/j.tra.2026.105337", "authors": "Bastian Henriquez-Jara ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-10-30", "citescore": 12.1, "citescore_year": "2025", "apa": "Henriquez-Jara, B., Candia, D., & Daziano, R. A. (2027). Behavioral externalities and the hidden cost of fare evasion in Santiago de Chile and New York City. Transportation Research Part A: Policy and Practice, 215, 105337. https://doi.org/10.1016/j.tra.2026.105337", "why": "無賃乗車の行動的外部性と費用の比較（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、チリのサンティアゴとニューヨークで、無賃乗車の行動的な外部性と隠れた費用を比べた論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、無賃乗車の損は運賃収入の減少だけなのか、です。周りの人が払わずに乗るのを見ると、自分も払いたくなくなる、という「伝染」があれば、損はもっと大きくなります。その見えない費用を二つの都市で比べる研究と読めます。", "unverified": "手法・検証・結果はすべて未確認。"}}, {"id": "jn25", "rank": 25, "field": "交通・都市計画", "headline": "全国の自動取締りデータで常習違反運転者を分析", "title": "Analyzing the impact of high-risk recidivist drivers using nationwide automated enforcement data: policy innovations for managing habitual traffic violators", "url": "https://doi.org/10.1016/j.tra.2026.105340", "authors": "Donghyeok Park ほか", "venue": ほか", "venue": "Psychometrika", "date": "2026-11-03", "sjr": 1.928, "citescore": 5.1, "citescore_year": "2025", "apa": "Morelli, S., Faleh, R., & Brandt, H. (2026). RAPSEM: Identifying Latent Mediators Without Sequential Ignorability via a Rank-Preserving Structural Equation Model. Psychometrika, 1–41. https://doi.org/10.1017/psy.2026.10153", "why": "順位保存の構造方程式モデルによる媒介分析（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "逐次無視可能性の仮定に頼らず、潜在的な媒介変数を特定できる順位保存の構造方程式モデル（RAPSEM）を示した（抄録）。", "p3": "G推定で頑健性を高め、2段階のモーメント法で因子得点を補正して測定モデルを保つ。媒介変数と結果の未測定の交絡がないという仮定を、観測されない効果修飾がないというより弱い仮定に置き換える（抄録）。", "p5": "処置の無作為化を使い、媒介変数に影響するが結果に直接の効果を持たない処置×共変量の交互作用が操作変数のように働くことで識別を達成する（抄録）。", "fun": "「薬が効くのは、まず睡眠を改善するからだ」というような途中の経路（媒介）を調べるとき、普通は「経路の途中に隠れた原因はない」と仮定します。これは破れやすい仮定です。この方法は、その仮定をより弱いものに替え、無作為化の力を借りて経路を取り出します。", "unverified": "シミュレーションや適用例の結果は未確認。"}}, {"id": "jn33", "rank": 33, "field": "物理・材料", "headline": "個々の炭素原子を3次元で撮像", "title": "Three-dimensional imaging of individual carbon atoms", "url": "https://doi.org/10.1038/s41565-026-02316-9", "authors": "Na Yeon Kim ほか", "venue": "Nature Nanotechnology", "date": "2026-11-03", "sjr": 13.056, "citescore": 57.8, "citescore_year": "2025", "apa": "Kim, N. Y., Zhong, H., Zhang, J., O’Leary, C. M., Liao, Y., Zou, J., Sha, H., Pham, M., Li, W., Yuan, Y., Park, J.-H., Kim, D. S., Jiang, H., Kong, J., Chi, M., & Miao, J. (2026). Three-dimensional imaging of individual carbon atoms. Nature Nanotechnology. https://doi.org/10.1038/s41565-026-02316-9", "why": "炭素原子1個ずつの3次元撮像（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "ねじれた2層グラフェンで、個々の炭素原子の3次元座標を0.11オングストロームの精度で決めた（抄録）。", "p3": "タイコグラフィー原子電子トモグラフィー（pAET）を使い、ねじれ2層グラフェンを模型系として個々の炭素原子の3次元の原子座標を決定した（抄録）。", "p5": "得られた3次元の原子模型は、ファンデルワールス相互作用による、メロン状・スキルミオン状の構造を示すキラルな格子のゆがみを明らかにした（抄録）。", "fun": "炭素は軽く、電子顕微鏡で一つずつ立体的に見るのはとても難しい原子です。この研究は、たくさんの角度からの散乱の模様をつなぎ合わせる方法で、炭素原子一   var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
