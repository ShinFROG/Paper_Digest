<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </header>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

/doi.org/10.5281/ZENODO.23807533", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "両端固定のアルミ梁の幾何学的非線形（デュフィング振動子）を、物理リザバー計算の計算資源として使えることを実験で示した（抄録）。", "p3": "梁を適切な条件で加振し、パリティ計算とMNIST手書き数字認識の2つのベンチマークで計算能力を評価した（抄録）。", "p5": "外部フィードバックなしでも、系の非線形性だけで現在と過去の入力の相関が保たれ、記憶の仕組みが運転条件と直接結びつくことを示した（抄録）。", "fun": "1本の金属の梁を揺らすだけで、手書き数字の認識に使える計算ができるという研究です。梁が大きく揺れると「ばね」が硬くなる非線形性が、過去の入力を少し覚えておく働きをします。物理の振動と計算の記憶が同じ現象として説明できる点が面白いです。", "unverified": "認識精度などの具体的な数値は抄録から確認できず未確認。"}}, {"id": "pr18", "rank": 18, "headline": "合成データを学習に使ってよいか少量の実データで判定", "title": "Should I Use This Synthetic Dataset for Training? How to Test with Minimal Real Data", "url": "https://doi.org/10.5281/zenodo.23800972", "authors": "Tao ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Tao, Z., Xu, W., You, X., Popovski, P., & Simeone, O. (2026). Should I Use This Synthetic Dataset for Training? How to Test with Minimal Real Data. Zenodo. https://doi.org/10.5281/ZENODO.23800972", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "デジタルツインなどで作った合成データを学習に加えると本当に性能が上がるかを、できるだけ少ない実データで判定する検定を示した（抄録）。", "p3": "2つの学習済みモデルの平均損失差を直接検定する方法と、対になった損失差の対称性を使う方法を考え、後者にモンテカルロの回数と実データの量の両方を適応的に決めるe過程の符号反転検定（aeSFT）を導入した（抄録）。", "p5": "抄録の範囲では検定の構成が中心で、実験での必要データ数などの数値は抄録の切れた部分にあり未確認。", "fun": "シミュレーションで作ったデータは安く大量に作れますが、現実とのずれがあると、混ぜたせいでかえって性能が落ちることがあります。この研究は「混ぜてよいか」を、現実のデータを少しずつ使いながら途中で判定する方法を考えています。データを使い切らずに結論を出す、という統計の工夫が面白い点です。", "unverified": "実験の結果と必要な実データ数は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLMが書いた研究上の主張を決定的に監査する", "title": "Deterministic Audit of LLM-Generated Research Claims", "url": "https://doi.org/10.5281/zenodo.23817684", "authors": "Borovikov, Vladimir V.", "venue": "Zenodo", "date": "2026-10-30", "apa": "Borovikov, V. V. (2026). Deterministic Audit of LLM-Generated Research Claims (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23817684", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "LLMが書いた研究の文章の「もっともらしい言い過ぎ」を機械的に検出する監査手順を示し、自分たちの研究に適用した（抄録）。", "p3": "事前登録の凍結、文脈の記憶ではなく外部記録の参照、生成役と監査役の分離、報告された数値の決定的な照合、主張の誤りの3段階の分類、複数モデルによる敵対的な査読の6要件からなる手順を作った（抄録）。", "p5": "10の実験系列・1,416件のプローブに適用し、12項目のチェックリストのうち6項目が合格、1項目が修正、1項目が不合格、2項目が部分的、2項目が人の判断を要すると報告した（抄録）。", "fun": "AIが書く文章で怖いのは、まったくの嘘よりも「数字は合っているのに解釈が大げさ」な文です。この研究は、その種の言い過ぎを人の勘ではなく手続きで見つける方法を作り、自分たちの研究にも当てはめて不合格の項目まで正直に報告しています。", "unverified": "監査の対象とした10個のp値と21個の比率の具体的内容は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "条件付き生成モデルでボーリング観測から亀裂網を再構成", "title": "A Three-Tier Evidence Hierarchy with Conditioned Generative Models for Discrete Fracture Network Reconstruction from Borehole Scanline Observations", "url": "https://doi.org/10.5281/zenodo.23795631", "authors": "Paudyal ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Paudyal, E., Tang, Y., Lamei Ramandi, H., Zhai, H., Yang, S.-Q., & Si, G. (2026). A Three-Tier Evidence Hierarchy with Conditioned Generative Models for Discrete Fracture Network Reconstruction from Borehole Scanline Observations. Zenodo. https://doi.org/10.5281/ZENODO.23795631", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "ボーリングの走査線のまばらな観測から、2次元の岩盤の亀裂網（離散亀裂ネットワーク）を、観測の確からしさに応じた3段階で再構成する枠組みを示した（抄録）。", "p3": "実測の亀裂は第1段階として残し、示唆される亀裂は改良型VAEによる長さ予測で延長し、観測のない領域の亀裂は系列型トランスフォーマーで生成し、7つの地質学的な制約を課す多目的の評価で選ぶ（抄録）。", "p5": "露天掘り鉱山の完全に図化された9つのベンチ面で検証した（抄録）。性能の数値は抄録の切れた部分にあり未確認。", "fun": "岩盤の中の割れ目は、穴を掘って見える一部分しか観測できません。この研究は「確実に見えた割れ目」「たぶん続いている割れ目」「見えないけれど推定する割れ目」を分けて扱い、生成AIで足りない部分を描きます。分からない部分の確からしさを区別して描くという考え方が面白いです。", "unverified": "検証での再現精度などの数値は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "基盤の地震動の与え方がマイクロゾーニングを変える", "title": "Influence of Bedrock Seismic Action Modelling on Microzonation", "url": "https://doi.org/10.20944/preprints202610.2967.v1", "authors": "Piero Colajanni ほか", "venue": "Preprints.org", "date": "2026-10-30", "apa": "Colajanni, P., Cucchiara, C., Granata, M. F., & Sberna, A. P. (2026). Influence of Bedrock Seismic Action Modelling on Microzonation. https://doi.org/10.20944/preprints202610.2967.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用", "preprint": true, "short": true, "p1": "地震マイクロゾーニング（地域の揺れやすさの区分）の結果が、基盤に与える入力地震動の作り方でどれだけ変わるかを調べた（抄録）。", "p3": "目標の応答スペクトルと近隣の観測記録から完全非定常の人工地震動を作り、1次元の等価線形の地盤応答解析で、従来の自然記録の選択による結果と比べた（抄録）。", "p5": "抄録の範囲では比較の設計が示され、結果の数値は抄録の切れた部分にあり未確認。", "fun": "同じ地盤でも、地下深くの「基盤」にどんな揺れを入れて計算するかで、地表の揺れやすさの地図が変わることがあります。この研究は、スペクトル（揺れの周波数の成分）が同じでも時間の中での揺れ方が違う地震動を比べています。答えが入力の選び方に左右されるという問題そのものが面白い点です。", "unverified": "入力の違いによる地表応答の差の大きさは未確認。"}}, {"id": "pr22", "rank": 22, "headline": "信頼性制約つきベイズ・デジタルツインで保全判断", "title": "Reliability-Constrained Bayesian Digital Twin for Sustainable Life-Cycle Decision-Making in Liquid-Hydrogen Storage", "url": "https://doi.org/10.2139/ssrn.7669238", "authors": "Kenneth Bisgaard Christensen", "venue": "SSRN", "date": "2026-10-31", "apa": "Bisgaard Christensen, K. (2026). Reliability-Constrained Bayesian Digital Twin for Sustainable Life-Cycle Decision-Making in Liquid-Hydrogen Storage. https://doi.org/10.2139/ssrn.7669238", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "液体水素の貯蔵容器について、劣化と不確実性を含むベイズ型のデジタルツインで、信頼性の制約の下で保全とライフサイクルの判断を行う枠組みを示した（抄録）。", "p3": "熱・疲労・破壊の確率的な劣化モデルに、点検による逐次更新、時間依存の信頼性解析、残存寿命の予測、ライフサイクルの持続可能性評価を組み合わせ、代表的な真空断熱容器で合成の観測を使って示した（抄録）。", "p5": "基準の応答では熱劣化が支配的で、系の超過確率は20年目まで0、25年目に0.391、30年目までに1.000となった（抄録）。", "fun": "決まった間隔で点検するのではなく、点検で分かった状態をそのつど計算に取り込んで「いつ手を入れるべきか」を決めるのがこの研究の考え方です。液体水素はとても冷たく扱いが難しいので、壊れる確率を年ごとに見積もることが安全と環境負荷の両方に関わります。", "unverified": "合成の観測による例示であり、実機での検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "内在的な分布合わせで少ステップ画像生成", "title": "Intrinsic Distribution Matching", "url": "https://arxiv.org/abs/2610.39633", "authors": "Deyuan Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Liu, D., Han, Y., Zheng, K., Xie, J., Liu, J., Cheng, Z., Sun, P., Zhang, J., Li, J., & Lin, T. (2026). Intrinsic Distribution Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.39633", "why": "1〜数ステップの文生成画像モデルを、分布を内側から合わせる新しい蒸留の考え方で学習する。Hugging Faceで最多の票を集めた。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "JEPAで「プラトン的表現仮説」を証明し改良", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "url": "https://arxiv.org/abs/2610.39302", "authors": "Randall Balestriero ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Balestriero, R., & LeCun, Y. (2026). Proving and Improving the Platonic Representation Hypothesis with JEPAs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.39302", "why": "異なるモデルの表現が同じ表現に収束するという仮説を、JEPAの枠組みで理論的に示し、学習の改善につなげる。"}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "多トークン予測を正しく行う", "title": "Multi-Token Prediction Done Right", "url": "https://arxiv.org/abs/2610.38331", "authors": "Jayden Teoh", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Teoh, J. (2026). Multi-Token Prediction Done Right (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38331", "why": "LLMで一般的になった多トークン予測の設計を見直し、より正しい学習の仕方を示す。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "隠れたAI利用と若手の技能形成", "title": "Racing the Machine: Hidden AI Use, Employer Learning and the Skills of Junior Workers", "url": "https://doi.org/10.2139/ssrn.7672458", "authors": "Teng Ge", "venue": "SSRN", "date": "2026-10-30", "apa": "Ge, T. (2026). Racing the Machine: Hidden AI Use, Employer Learning and the Skills of Junior Workers. https://doi.org/10.2139/ssrn.7672458", "why": "生成AIが若手の今日の成果を上げる一方で技能の習得と雇用主の学習を妨げる仕組みを分析する。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "電子カルテの学習表現は交絡情報を捨てるか", "title": "Do Learned Representations of Electronic Health Records Discard Confounding Information? A Plasmode Evaluation and Diagnostics in the All of Us Research Program", "url": "https://doi.org/10.2139/ssrn.7671948", "authors": "Cong Cao", "venue": "SSRN", "date": "2026-10-30", "apa": "Cao, C. (2026). Do Learned Representations of Electronic Health Records Discard Confounding Information? A Plasmode Evaluation and Diagnostics in the All of Us Research Program. https://doi.org/10.2139/ssrn.7671948", "why": "学習された表現を使った因果推論で交絡が残るかを、プラズモード評価と診断で調べる。"}, {"id": "pn06", "rank": 6, "field": "人口学", "headline": "人口高齢化は総貯蓄を下げるか（メタ分析）", "title": "Does Population Aging Lower Aggregate Saving? A Systematic Review and Meta-Analysis", "url": "https://doi.org/10.2139/ssrn.7672762", "authors": "James Wabenga Yango", "venue": "SSRN", "date": "2026-10-30", "apa": "Wabenga Yango, J. (2026). Does Population Aging Lower Aggregate Saving? A Systematic Review and Meta-Analysis. https://doi.org/10.2139/ssrn.7672762", "why": "高齢化と総貯蓄の関係の推定を系統的レビューとメタ分析でまとめ、通説の頑健さを検証する。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "性格変化介入の効果の個人差", "title": "Interindividual Differences in Treatment Effects of a Personality Change Intervention on Life and Domain Satisfaction", "url": "https://doi.org/10.31234/osf.io/6esfm_v2", "authors": "Lara Kroencke ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Kroencke, L., Zimmermann, J., Baumgardt, S., Brüggmann, L., Harzer, C., Mayer, A., Stieger, M., & Puhlmann, L. (2026). Interindividual Differences in Treatment Effects of a Personality Change Intervention on Life and Domain Satisfaction. https://doi.org/10.31234/osf.io/6esfm_v2", "why": "性格変化介入が生活満足度に与える効果が人によってどれだけ違うかを推定する。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "SHAPの重要度と調整済み関連は食い違う", "title": "Global SHAP Importance and Adjusted Association Diverge for Constructed Survey Indicators: Child Labour and Foundational Learning in Bangladesh", "url": "https://doi.org/10.2139/ssrn.7665858", "authors": "Ishtiaq Mahmud Fahim ほか", "venue": "SSRN", "date": "2026-10-30", "apa": "Fahim, I. M., Reti, S. S., & Raiyan, S. (2026). Global SHAP Importance and Adjusted Association Diverge for Constructed Survey Indicators: Child Labour and Foundational Learning in Bangladesh. https://doi.org/10.2139/ssrn.7665858", "why": "構成された調査指標で、機械学習のSHAP重要度と回帰で調整した関連が異なる結論を導くことを示す。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "決算予測市場は何を知っているか", "title": "What do Earnings Prediction Markets Know?", "url": "https://doi.org/10.2139/ssrn.7667338", "authors": "Tengfei Zhang", "venue": "SSRN", "date": "2026-10-30", "apa": "Zhang, T. (2026). What do Earnings Prediction Markets Know? https://doi.org/10.2139/ssrn.7667338", "why": "決算の予測市場がアナリスト予想など既存の情報を超えて予測を改善する条件を調べる。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "人はAIにどう仕事を任せ、市場はそれを織り込んだか", "title": "Delegating to the Machine: How People Hand Work to AI, and Whether Equity Markets Priced it", "url": "https://doi.org/10.2139/ssrn.7667658", "authors": "Ajai Upadhyaya", "venue": "SSRN", "date": "2026-10-30", "apa": "Upadhyaya, A. (2026). Delegating to the Machine: How People Hand Work to AI, and Whether Equity Markets Priced it. https://doi.org/10.2139/ssrn.7667658", "why": "人が言語モデルに仕事を委ねる仕方を測り、株式市場がその影響を価格に反映したかを調べる。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "中国の出産保険と採用差別・母親ペナルティ", "title": "Maternity Insurance, Hiring Discrimination, and the Motherhood Penalty under China's Two-Child Policy", "url": "https://doi.org/10.2139/ssrn.7672518", "authors": "Teng Ge", "venue": "SSRN", "date": "2026-10-30", "apa": "Ge, T. (2026). Maternity Insurance, Hiring Discrimination, and the Motherhood Penalty under China’s Two-Child Policy. https://doi.org/10.2139/ssrn.7672518", "why": "二人っ子政策後の出産保険の変化が、女性の採用差別と母親ペナルティに与えた影響を推定する。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "一つのアルゴリズムで基盤モデルを学習する", "title": "Training Foundation Models with a Single Algorithm", "url": "https://arxiv.org/abs/2610.40564", "authors": "Yuda Song ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Song, Y., Zhang, A., Tajwar, F., Arora, D., Schneider, J., Khashabi, D., Salakhutdinov, R., Bagnell, J. A., Singh, A., & Zanette, A. (2026). Training Foundation Models with a Single Algorithm (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40564", "why": "事前学習・微調整などで別々の手法を使う基盤モデルの学習を、単一のアルゴリズムで行う。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "未来を見ずにAIエージェントは株式投資できるか", "title": "Investor's Last Exam: Can AI Agents Do Equity Investment Without Seeing the Future?", "url": "https://arxiv.org/abs/2610.38342", "authors": "Huangfei Jiang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Jiang, H., Hu, A., Sheng, K., Cai, Y., Ge, R., Kong, X., Lin, J., Chen, S., Weng, J., & Yan, J. (2026). Investor's Last Exam: Can AI Agents Do Equity Investment Without Seeing the Future? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38342", "why": "情報漏れを防いだ評価で、AIエージェントの株式投資の能力を検証するベンチマークを示す。"}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "「人間らしさ」はAIの評価基準として誤り", "title": "Human likeness is a misplaced benchmark for artificial intelligence", "url": "https://doi.org/10.31234/osf.io/zn5u9_v1", "authors": "Valerio Capraro ほか", "venue": "PsyArXiv", "date": "2026-10-30", "apa": "Capraro, V., Marcus, G., & Quattrociocchi, W. (2026). Human likeness is a misplaced benchmark for artificial intelligence. https://doi.org/10.31234/osf.io/zn5u9_v1", "why": "LLMがチューリングテストに合格したという主張の手続きの違いを整理し、人間らしさを基準にする問題を論じる。"}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "チーム科学：共同研究の規模と被引用", "title": "Team Science: An Examination of Factors Associated with Citation Metrics", "url": "https://doi.org/10.31234/osf.io/37mcg_v1", "authors": "Kelly Cuccolo ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Cuccolo, K., Wagge, J. R., Edlund, J., & Buchanan, E. M. (2026). Team Science: An Examination of Factors Associated with Citation Metrics. https://doi.org/10.31234/osf.io/37mcg_v1", "why": "科学の共同研究の特徴と被引用指標の関係を調べる。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "データなしで多モーダルモデルが自己改善", "title": "A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement", "url": "https://arxiv.org/abs/2610.38568", "authors": "Yu Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Liu, Y., Li, Y., Tan, Y., Yang, Z., Su, Z., Feng, H., Zhang, S., Liao, L., Wan, Z., Wu, C., Cao, C., Yuan, F., Liu, Y., Chen, Z., Fu, P., Timofte, R., Wu, Z., Sebe, N., Poczos, B., & Luan, J. (2026). A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38568", "why": "課題を適応的に作り直すことで、外部データなしに多モーダルモデルを再帰的に改善する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "外部データなしで多モーダルモデルを再帰的に自己改善させる際に、「いつ新しい課題を入れるか」を学習の動きから決める方法A-RSIを示した（抄録）。", "p3": "学習ログの報酬の変動と正解率を監視し、学習信号が弱まったら課題の集まりを入れ替える。検証・テストの得点は使わず、モデルが書いたプログラムの集まりから答えを独立に確かめられる多モーダル課題を作る（抄録）。", "p5": "性能の数値は抄録の切れた部分にあり未確認。", "fun": "AIが自分で問題を作って自分で練習するとき、同じ問題ばかり解いていても伸びなくなります。この研究は「もう伸びなくなった」タイミングを学習の記録から見つけて問題を入れ替えます。さらに答え合わせを多数決ではなくプログラムで確かめ、自分の思い込みで学ばないようにしている点が面白いです。", "unverified": "ベンチマークでの改善幅は未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "専門職の意図を実行可能な仕事に変えてエージェント学習", "title": "WorkFactory: Turning Professional Intents into Executable Work for Scalable Agent Training", "url": "https://arxiv.org/abs/2610.37161", "authors": "Ziyang Zeng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Zeng, Z., Chen, T., Deng, J., Wang, Q., Tang, S., Yang, Y., Ren, T., Zhao, W. X., Chang, F., He, J., Hao, C., Tao, R., & Dai, B. (2026). WorkFactory: Turning Professional Intents into Executable Work for Scalable Agent Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37161", "why": "専門職の意図を実行可能な作業に変換し、エージェントの学習データを大規模に作る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "専門職の意図から一貫して実行できる業務課題を大量に作り、仕事をするAIエージェントの教師あり学習を拡大する枠組みWorkFactoryを示した（抄録）。", "p3": "意図から必要な情報の依存関係と所在を表す情報支援グラフを作って課題を具体化し、試行の実行で情報の欠けを見つけて意図を保ったまま修復する（抄録）。", "p5": "612職種にわたる112,686の課題を作り、教師の軌跡でQwenの4B・27B・35B-A3Bを微調整した（抄録）。改善の数値は未確認。", "fun": "AIに「仕事」を教えるには、実際にやり遂げられるだけの情報がそろった練習問題が必要です。この研究は、仕事の目的から逆算して必要な資料や依存関係を地図のように描き、足りない情報を補ってから問題にします。600以上の職種の課題を自動で作れる点が面白いです。", "unverified": "微調整後の性能の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "実際のウェブから大規模なエージェント環境を作る", "title": "WebAnything: From the Wild Web to Scalable Agent Environments", "url": "https://arxiv.org/abs/2610.37786", "authors": "Tianci Xie ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Xie, T., Cai, Z., Zhang, C., Guo, P., Li, B., Zheng, R., & Yan, H. (2026). WebAnything: From the Wild Web to Scalable Agent Environments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37786", "why": "実際のウェブサイトから、ウェブエージェントを学習・評価するための環境を大規模に作る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "実在のURLから、ウェブエージェントの学習・評価に使える再利用可能なウェブサイト環境を、サイトごとの手作業なしに自動で再構成する枠組みWebAnythingを示した（抄録）。", "p3": "探索・構築役がブラウザで観測できる構造・資源・操作の結果を集め、独立の検証役が凍結した候補を確かめて局所的な修復や再取得を指示する（抄録）。", "p5": "14の応用領域で244のウェブサイトの環境を作った（抄録）。エージェントの性能の数値は未確認。", "fun": "ウェブ上で作業するAIを練習させるには、何度でも元に戻せる「練習用のウェブサイト」が必要です。本物のサイトは毎日変わるので、この研究は本物を観察して動く複製を自動で作ります。作る役とチェックする役を分けて品質を保つ工夫が面白い点です。", "unverified": "再構成の忠実度の評価結果は未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "生成型板情報モデルの市場インパクトを評価", "title": "LOB-Impact Benchmark: Emergent Market Impact in Generative Limit Order Book Models", "url": "https://arxiv.org/abs/2610.27100", "authors": "George Nigmatulin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-29", "apa": "Nigmatulin, G., Mohl, V., Frey, S., Li, K., Marti-Shahandeh, A., Cucuringu, M., Calinescu, A., Foerster, J., & Zohren, S. (2026). LOB-Impact Benchmark: Emergent Market Impact in Generative Limit Order Book Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27100", "why": "生成型の板情報（LOB）モデルに現れる市場インパクトを評価するベンチマークを示す。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "次のトークン予測だけで学習した生成型の板情報（LOB）モデルに、現実的な市場インパクトが自然に現れることを示し、それを測るベンチマークを作った（抄録）。", "p3": "5つの自己回帰モデルが生成する注文の流れに執行型の大口注文を差し込み、NASDAQの5銘柄で、実証研究の推定量を使って価格の反応を測る。推定量は性質が分かっている基準モデルで検証した（抄録）。", "p5": "数値の結果は抄録の切れた部分にあり未確認。", "fun": "株の売買を練習するAIのための「仮想の市場」では、自分が大量に買うと値段が上がるという反応が正しく再現されていないと、仮想市場でしか通用しない戦略を覚えてしまいます。この研究は、次の注文を予測するだけのAIがこの反応を自然に身につけているかを確かめる物差しを作りました。", "unverified": "モデル間の市場インパクトの比較結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "最新LLMの制御喪失・操作のリスク評価", "title": "Evaluating DeepSeek V4.1 Flash-1017 for loss of control and harmful manipulation risks", "url": "https://arxiv.org/abs/2610.35671", "authors": "Yao Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-29", "apa": "Huang, Y., Zeng, Z., Wang, Y., Zhu, Z., Duan, D., Li, H., Xu, S., Wang, Y., Tu, J., Xiong, S., Zang, Y., Yan, H., Yang, H., Gu, F., Xu, W., Dong, Y., & Li, X. (2026). Evaluating DeepSeek V4.1 Flash-1017 for loss of control and harmful manipulation risks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35671", "why": "最新のLLMについて、制御喪失と有害な操作のリスクを評価する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "オープンウェイトのLLMであるDeepSeek V4.1 Flash-1017について、制御喪失と有害な操作のリスクを第三者として評価した（抄録）。", "p3": "EUの汎用AI行動規範に沿って、自社開発の5つを含む34のベンチマークで評価の健全性・制御喪失・有害な操作を調べ、AEF-1の基準に従って以前のV4系モデルなどと比べた（抄録）。", "p5": "比較の結果は抄録の切れた部分にあり未確認。", "fun": "大企業の非公開のAIには安全性の報告書が付くことが多いのに対し、誰でも重みを使えるオープンなAIは、危険な能力の点検が手薄になりがちです。この研究は、外部の立場から34種類のテストで最新モデルを点検しています。AIの安全性を誰がどう確かめるのかという問いが面白い点です。", "unverified": "各リスク指標での具体的な結果は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "グローバル化の地域的な損得とトランプ1期目", "title": "Global Trade, Local Jobs, and the Rise of Trump 1.0", "url": "https://doi.org/10.2139/ssrn.7665202", "authors": "Jiatao Liu ほか", "venue": "SSRN", "date": "2026-10-30", "why": "グローバル化の利益と費用の地域差が、トランプの台頭にどうつながったかを分析する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "グローバル化の利益と費用の地域的な偏りが、2016年のトランプの台頭にどう寄与したかを郡単位で分析した（抄録）。", "p3": "海外調達による効率の利益（輸入/GDP、IM）と製造業雇用の喪失（製造業の雇用比率、L-Share）の2つの地域経験を取り上げ、共和党の二大政党得票率の変化との関係を調べた（抄録）。", "p5": "海外調達への参加が少ない郡と製造業への依存が高い郡で、2016年にトランプへの大きな移動があった。中国ショック以前の1970〜80年代に測ったL-Shareもこの移動を予測した（抄録）。", "fun": "グローバル化は国全体では得になっても、得をする地域と損をする地域が分かれます。この研究は、40年以上前の製造業の多さが2016年の投票を予測することを示しました。経済の変化が長い時間をかけて政治に影を落とす、という点が面白いです。", "unverified": "効果の大きさの具体的な数値は抄録の切れた部分にあり未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "企業補助金と市場構造", "title": "Corporate Subsidies and Market Structure", "url": "https://doi.org/10.2139/ssrn.7666538", "authors": "Filippo Belloc ほか", "venue": "SSRN", "date": "2026-10-30", "why": "企業ごとの補助金が製造業の市場構造に与える影響を調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "企業ごとの補助金が製造業の市場構造（集中度）に与える影響を、理論と国際データで調べた（抄録）。", "p3": "補助金が費用の非対称と参入・需要の波及という逆向きの力を生むクールノー型のモデルを作り、Global Trade Alertの企業別補助金とOrbisの財務データ（2012〜2019年）を結合して、実施時期の違いを使った差の差の推定を行った（抄録）。", "p5": "補助金は平均ではハーフィンダール・ハーシュマン指数で測った集中度に影響しなかった（抄録）。", "fun": "政府が特定の企業に補助金を出すと、その企業が強くなって市場が独占に近づくのか、それとも市場全体が広がって新しい企業が入ってくるのか。この研究は両方の力が働くことを理論で示し、データでは平均すると集中度が変わらないことを見つけました。", "unverified": "異質性の分析など平均以外の結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "輸出規制はどこで効くか：半導体供給網2018–2026", "title": "Where Export Controls Bind: Law and Lead in the Semiconductor Supply Chain, 2018–2026", "url": "https://doi.org/10.2139/ssrn.7668219", "authors": "Heekwon Kyung ほか", "venue": "SSRN", "date": "2026-10-30", "why": "技術の輸出規制が半導体供給網のどこで効き、どこで効かなかったかを調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "半導体の輸出規制が効いたかどうかの評価が割れるのは、規制が製品・工程・最終利用者の単位で書かれるのに、国・産業・年の単位で評価されるからだと論じ、2017〜2026年の中国の記録を公開資料から再構成した（抄録）。", "p3": "63社の地域別売上の注記、8桁の品目別の通関記録、メモリ2社の2026年の目論見書、制裁リストを使った（抄録）。", "p5": "同じ規制が4種類の反応を生み、それぞれは規制が及んだ投入物を代替できたかで説明できた。最先端の受託製造から切り離されたファーウェイは同業他社比で売上の42%を失った（抄録）。", "fun": "「技術の輸出を止めれば相手は困るのか」という昔からの問いに、この研究は「止めた部品を別のもので代わりにできるかどうか次第」と答えます。国全体の数字を見ると効いていないように見えても、企業や部品の単位で見ると大きな打撃がある、という見る単位の違いが面白い点です。", "unverified": "4種類の反応の内訳は抄録の範囲で未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "多層媒介分析の区間推定をRで効率化（追試）", "title": "Computationally efficient interval estimation for the 1-1-1 multilevel mediation analysis model in R: A replication of Bauer, Preacher, and Gil (2006)", "url": "https://doi.org/10.31234/osf.io/ms39n_v2", "authors": "Carl F. Falk ほか", "venue": "PsyArXiv", "date": "2026-10-29", "why": "1-1-1多層媒介モデルの区間推定を計算効率よく行う方法を、先行研究の追試として示す。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "1-1-1型の多層媒介分析モデルで、間接効果の区間を計算効率よく求める元の方法（Bauer, Preacher, & Gil, 2006）をRで実装し、その性能を追試した（抄録）。", "p3": "元の研究は商用ソフトで示されており、Rでは計算負荷の高い方法しか示されていなかったため、効率的な方法の実装とモンテカルロ・シミュレーションの追試を行った（抄録）。", "p5": "追試の結果の数値は抄録の切れた部分にあり未確認。", "fun": "「AがBを通じてCに効く」という間接的な効果を、学校や会社のように人がグループに分かれたデータで調べるのが多層媒介分析です。この研究は、有名な方法を無料のソフトで使えるようにし、昔のシミュレーションの結果が本当に再現するかを確かめています。統計手法の追試という地味だが大切な作業です。", "unverified": "元の研究と結果が一致したかは未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "1本の経路から長期の資産成長を推論する", "title": "One-Path Inference for Long-Run Portfolio Growth in Stochastic Factor Markets", "url": "https://doi.org/10.2139/ssrn.7666678", "authors": "Xinrui Dong", "venue": "SSRN", "date": "2026-10-30", "why": "有限の資産記録から長期のポートフォリオ順位を推論する方法を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "有限の資産の記録1本から、拡散型の因子市場での長期のポートフォリオ成長率を推論する方法を示した（抄録）。", "p3": "ポアソン方程式による補正で長期成長の分散と有限ブロックの偏りを結びつけ、バッチ平均法が平均二乗で一致することと初期状態の偏りの上界を示した（抄録）。", "p5": "線形ガウスの基準例では、共通の雑音が成長率を変えずに分散を2.3倍に変え、既知のケリー・マートン則の弱い信号の検出に必要な期間は予測力の2乗に反比例して伸びた（抄録）。", "fun": "投資の成績表は1本の歴史しかなく、やり直しがききません。その1本だけから「長い目で見てどちらの戦略が勝つか」をどこまで言えるかを数学的に示したのがこの研究です。予測の力が半分になると、見分けるのに必要な期間が4倍になるという関係が面白い点です。", "unverified": "実データへの適用は未確認。"}}, {"id": "pn26", "rank": 26, "field": "因果推論", "headline": "回復の訓練が仕事の成果を高めるか", "title": "Active Recovery Is Not Just for Athletes: Employees Need to Train for Recovery to Enhance Work", "url": "https://doi.org/10.31235/osf.io/cz5g4_v1", "authors": "Matthew J Monnot", "venue": "SocArXiv", "date": "2026-10-30", "why": "従業員の回復訓練の試験の効果を検討し、訓練としての回復を論じる。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用", "preprint": true, "short": true, "p1": "回復訓練が、もともと仕事から心理的に離れにくい人と離れやすい人のどちらに効くかを、ランダム化試験の事前に定めた再分析で検証した（抄録）。", "p3": "ドイツの従業員393人（事後測定あり247人）で、待機対照・6週間の認知行動的な回復訓練・6週間のマインドフルネス訓練を比べた試験を、基準値×群の交互作用、分位処置効果などで分析した（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "スポーツ選手が休み方を練習するように、会社員も「仕事から頭を切り離す」練習が必要だという研究です。平均で効果があっても、苦手な人ほど伸びるのか、得意な人がさらに伸びるのかで意味が変わります。平均の裏にある個人差を問うている点が面白いです。", "unverified": "補償か蓄積かのどちらが支持されたかは未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "因果経路の保護で文脈内学習を選択的に保持", "title": "Selective retention of in-context learning through causal pathway protection", "url": "https://doi.org/10.2139/ssrn.7668358", "authors": "Jiateng Cui ほか", "venue": "SSRN", "date": "2026-10-30", "why": "微調整後も文脈内学習の能力を、因果経路を保護することで選択的に保つ。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "学習が進むと消えていく文脈内学習（ICL）を、すでにできた例とラベルの対応づけの経路を保護することで、学習データを変えずに保てることを示した（抄録）。", "p3": "チェックポイント間のパラメータ置換で経路を特定し、例の入れ替え介入でラベル位置の注意のキーを通じて情報が流れることを示し、その経路の保護損失を定めてAdamの更新を最小限に補正した（抄録）。", "p5": "2層トランスフォーマーで、通常の継続学習に比べて標準的なICLの正解率を36.38ポイント改善した（抄録）。", "fun": "AIは、例を見せるだけでその場で新しい課題を解ける「文脈内学習」の能力を持ちますが、さらに学習を続けるとこの能力が消えてしまうことがあります。この研究は、その能力を担う内部の通り道を突き止めて守ることで、能力を残せることを示しました。", "unverified": "大規模モデルでも同様に効くかは未確認。"}}, {"id": "pn28", "rank": 28, "field": "組織行動・心理的安全性", "headline": "マッキンゼーの多様性研究への批判", "title": "The Business Case for Diversity – A Critique of McKinsey’s ‘Research’", "url": "https://doi.org/10.2139/ssrn.4500116", "authors": "Ian W Gardner", "venue": "SSRN", "date": "2026-10-30", "why": "多様性が業績を高めるとする影響力のある一連の報告の方法を批判的に検討する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "指導層の多様性が企業業績を高めるという主張の根拠として広く引用されるマッキンゼーの3つの報告（2015・2018・2020年）を批判的に検討した（抄録）。", "p3": "報告のうち、コンサルタントが作ったデータセットの代表性を分析した（抄録）。", "p5": "データセットは報告が言及する国の上場企業全体を十分に代表しておらず、結論は信頼できず一般化できないと論じた（抄録）。", "fun": "「多様な経営陣の会社ほどもうかる」という話は、よく引用される調査報告に支えられてきました。この研究は、その報告が使った会社の選び方が偏っていたのではないかと指摘します。主張が正しいかどうかとは別に、根拠のデータが何を代表しているかを問う姿勢が面白い点です。", "unverified": "代表性の欠如の具体的な程度は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経営学", "headline": "司法競売での免責表示の禁止と戦略的沈黙", "title": "Banning the Disclaimer: Strategic Silence in Judicial Housing Auctions", "url": "https://doi.org/10.2139/ssrn.7670079", "authors": "Maggie Hu ほか", "venue": "SSRN", "date": "2026-10-31", "why": "責任の免責表示を禁じた規制が、売り手の情報開示をどう変えたかを調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "責任の免責表示を禁じる規制が、表示が安い口約束なら積極的な表示へ、費用のかかる約束なら沈黙へ送り手を向かわせることを理論で示し、中国の司法競売で検証した（抄録）。", "p3": "2019年に裁判所が競売物件の明け渡しの責任を免責すると表示することを禁じた規則を使い、139万件の住宅の司法競売の掲載で、規則前の免責表示の使用度に基づく連続的な差の差を推定した（抄録）。", "p5": "禁止で消えた免責表示10件ごとに沈黙の告知が増えた（抄録）。増加の件数は抄録の切れた部分にあり未確認。", "fun": "「責任を負いません」と書くことを禁じれば、責任を持つようになるはずだ、というのが規制の狙いです。ところが実際には、何も書かない「沈黙」が増えたというのがこの研究の発見です。言わせないことと約束させることは違う、という点が面白いです。", "unverified": "沈黙の増加の大きさと価格への影響は未確認。"}}, {"id": "pn30", "rank": 30, "field": "人口学", "headline": "人口学における「クィア」の使われ方", "title": "On the Uses of “Queer” in Demography", "url": "https://doi.org/10.31235/osf.io/uspe8_v1", "authors": "Christopher Julian ほか", "venue": "SocArXiv", "date": "2026-10-30", "why": "人口学で「クィア」という語がどう使われているかを整理する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用", "preprint": true, "short": true, "p1": "人口学で「クィア」という語がどう使われているかを、定義を固めるのではなく地図のように整理した（抄録）。", "p3": "家族研究の先例にならい、名詞（クィアな人々の人口学）、形容詞（クィアの認識論と結びついた人口学）、動詞（人口学をクィア化する）の3つの用法に分けて検討した（抄録）。", "p5": "数え上げと分類の伝統を持つ人口学に照らして各用法を読み、何が得られ何が失われるかを考えるよう呼びかけた（抄録）。", "fun": "人口学は、人を数えて分類することで発展してきた学問です。一方「クィア」という考え方は、決まった分類そのものを疑います。この2つが出会うと何が起きるのかを、言葉の使われ方から整理しているのがこの研究の面白い点です。", "unverified": "実証的な分析は含まれない（概念的な論考）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "LLMの回答を少数の人間データで人に近づける", "title": "Frontiers: Reducing Disparity Between LLMs and Humans: Optimal LLM Sample Calibration", "url": "https://doi.org/10.1287/mksc.2024.0983", "authors": "Yan Leng ほか", "venue": "Marketing Science", "date": "2026-10-30", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr02", "rank": 2, "headline": "通話の言葉と声から顧客満足をリアルタイム推定", "title": "EXPRESS: THE SOUND OF WORDS: VERBAL AND VOCAL CUES IN CUSTOMER SATISFACTION", "url": "https://doi.org/10.1177/10949968261506232", "authors": "Bea Waelbers ほか", "venue": "Journal of Interactive Marketing", "date": "2026-10-30", "sjr": 3.125, "citescore": 12.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr03", "rank": 3, "headline": "チップ依頼は「規範」訴求が返報性より効く", "title": "Injunctive Norms Outperform Reciprocity: Tip Request Messages Can Increase Tipping Without Reducing Demand", "url": "https://doi.org/10.1287/mksc.2025.0392", "authors": "Seung Hyun Kim ほか", "venue": "Marketing Science", "date": "2026-10-30", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr04", "rank": 4, "headline": "AI音声アシスタントの支配的な口調の効果", "title": "The Sound of Good Service: How Dominant and Submissive Language in AI Voice Assistants Shapes Consumer Responses Across Service Settings", "url": "https://doi.org/10.1177/10946705261492116", "authors": "Daniel Ruiz-Equihua ほか", "venue": "Journal of Service Research", "date": "2026-10-30", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr05", "rank": 5, "headline": "強制開示が同業他社の株価     var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
