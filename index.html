ative Goods: Market Expansion, Crowd-Out, and Copyright. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag058", "why": "大手の素材画像の市場が2022年12月に生成AIによる画像の販売を認めた際、表示の義務と一部市場での禁止という条件の違いを使って差分の差分で効果を推定した。画像の生産は136%、活動する作者は47%増え、生成AIでない画像の生産は15%、作者は29%減った。総販売は82%増えたが、生成AIでない画像の販売は28%減った。生成AIの画像は特徴の空間で集中し、人の作品はすき間へ差別化する。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "大手のストック画像の市場が生成AIで作った画像の販売を認めた規則の変更を使い、生成AIが創作物の市場をどう変えたかを差の差で推定した。画像の制作は136%、総販売は82%増えたが、生成AIを使わない制作は15%、販売は28%減った（抄録）。", "p2": "生成AIは創作物の市場を広げるのか、人の手による作品を押し出すのかを問う（抄録）。著作権政策と、独自の創作が長期に続けられるかという論点につながる。", "p3": "2022年末、プラットフォームは生成AI画像の販売を認めると発表した。条件は、生成AI画像にラベルを付けることと、一部の市場では生成AIを禁止することの2つである。この規則による市場ごとの違いを差の差の設計で使う（抄録）。", "p4": "供給側（制作数、活動する作家数）と需要側（販売数、販売率）を推定した。さらに画像の埋め込みを使って、品質（販売確率の予測値）、特徴、市場の構成の新しい指標を作り、生成AIを使わない作品の反応を調べた（抄録）。", "p5": "制作は136%、活動する作家は47%増え、非生成AIの制作は15%、非生成AIの作家は29%減った。総販売は82%増えたが、非生成AIの販売は28%減り、販売率は3ポイント下がった。品質は全体で9ポイント、非生成AIで2ポイント上がり、質の低い非生成AIの作家の退出を示唆する。生成AIの制作は特徴の空間で強く集中し、非生成AIはニッチへ差別化した（いずれも抄録）。", "p6": "解釈：1つのプラットフォームの事例であり、禁止された市場と認められた市場が比較できるかは本文の確認が要る。品質は販売確率の予測値で測っており、作品の芸術的な価値とは別のものである。本文を入手できず、対象期間と推定の詳細は確認できない。", "fun": "写真やイラストを売るサイトが「AIで作った画像も売ってよい」と決めたら何が起きたか。画像の制作は136%増え、売上の総数も82%増えた。一方で、AIを使わない画像の売上は28%減り、活動する作家も減った。面白いのは残った人の動きである。AIの画像が似た範囲に集中したのに対し、人の作家はすき間の分野へ移って違いを出した。市場は広がったが、人の作品の居場所は変わった。", "unverified": "本文、プラットフォームの名称、対象期間、推定式、並行トレンドの確認、指標の作り方の詳細は確認できなかった（抄録のみ）。発表の時期は抄録の「December 2022」による。"}}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "生成AIは討論の実力差をむしろ広げる", "title": "When GenAI Increases Inequality: Evidence from a University Debating Competition", "url": "https://doi.org/10.1287/mnsc.2025.01063", "authors": "Antonio Roldán-Monés", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Roldán-Monés, A. (2026). When GenAI Increases Inequality: Evidence from a University Debating Competition. Management Science. https://doi.org/10.1287/mnsc.2025.01063", "why": "大学の競技ディベートで、参加者に生成AIの利用を無作為に割り当てた実験。書く作業ではなく、複雑な考えを自分のものにして口頭で説明する知識集約的な活動を対象にした。判断の比重が高い部分では能力の高い参加者ほど生成AIから大きな利得を得て、能力の低い参加者は生成AIで代替できる部分でしか成績が上がらず、成績の格差が広がった。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "大学の競技ディベートで参加者に生成AIの利用を無作為に割り当てた実験で、生成AIが成績の格差を広げることを示した。能力の高い参加者は判断が要る部分で大きく伸び、能力の低い参加者はAIで代替できる部分だけが伸びた（抄録）。", "p2": "生成AIと仕事の研究は、生産性の差を縮める効果と格差を広げる効果の両方を報告しており、誰がどの課題で得をするのかが未解決である（抄録）。従来の実験の多くは書く作業と個人間の比較を扱ってきた。複雑な考えを自分のものにして口頭で説明する活動ではどうかを問う。", "p3": "競技ディベートの参加者に生成AIへのアクセスを無作為に割り当てるランダム化比較試験である。知識集約的な口頭の活動を対象とし、下位の課題ごとの効果の違いを識別できる設定になっている（抄録）。", "p4": "能力の高い参加者と低い参加者の効果を比べ、ディベートを、判断が要る下位の課題と、専門性の低い構成要素に分けて効果を見た（抄録）。参加者数、能力の測り方、採点の方法、使った生成AIは抄録に記載がない。", "p5": "生成AIはこの設定で成績の不平等を広げた。能力の高い参加者は、判断集約的な下位の課題で、能力の低い参加者より有意に大きな利得を得た。能力の低い参加者は、生成AIを代替として使える専門性の低い構成要素でだけ成績が上がった（いずれも抄録）。", "p6": "著者は、この結果が似た口頭の場面に一般化するならば重要な含意がある、と条件つきで述べている（抄録）。解釈：大学の競技ディベートという1つの場面の結果であり、職場の業務にそのまま当てはまるかは分からない。本文を入手できず、効果の大きさと標本の大きさは確認できない。", "fun": "生成AIについては、人の差を縮めるという報告と広げるという報告の両方がある。これまでの実験の多くは文章を書く課題だった。では、その場で考えて話すディベートではどうか。大学の大会で使える人を無作為に決めて比べると、差は広がった。もともと強い人は、判断が要るところでAIを活かして大きく伸びた。そうでない人は、AIに任せられる部分しか伸びなかった。", "unverified": "本文、参加者数、能力と成績の測り方、下位の課題の定義、効果量は確認できなかった（抄録のみ）。"}}, {"id": "jn03", "rank": 3, "field": "環境・気候政策", "headline": "55の行動介入でも炭素価格への支持は微増", "title": "Fifty-five crowdsourced designs assessing carbon pricing support in the USA", "url": "https://doi.org/10.1038/s41562-026-02629-8", "authors": "Armando Holzknecht ほか", "venue": "Nature Human Behaviour", "date": "2026-11-25", "sjr": 4.896, "citescore": 23.7, "citescore_year": "2025", "apa": "Holzknecht, A., Schwaiger, R., Blanco, E., Huber, J., Kirchler, M., Abatayo, A. L., Adamus, M., Bakalo, L., Barreiro-Hurle, J., Bas, B., Basaglia, P., Bhattacharya, O., Bıçakçı, Ü., Blunden, H., Blunt, M., Bohmann, S., Brañas-Garza, P., Buckle, G., Burgstaller, L., et al. (2026). Fifty-five crowdsourced designs assessing carbon pricing support in the USA. Nature Human Behaviour. https://doi.org/10.1038/s41562-026-02629-8", "why": "国際的な研究チームが別々に考案した55の行動介入を、米国の約2万人に同時に試した事前登録の共同研究。実際の支持を表す指標への効果はごく小さいが有意で（Cohenのd=0.06）、表明された支持も5指標中4つで1.7〜2.4ポイント増にとどまった。研究チームは自分や他のチームの介入の効果を大きく見積もりすぎており、研究者集団の期待のずれも明らかになった。", "explain": {"basis": "本文", "basis_note": "出版社のPDF本文のうち、序論の後半（設計の説明）、結果の主要部分（メタ分析、図3の説明、調整変数の分析）、考察（効果の大きさ、選択的報告、限界）を読んだ。", "preprint": false, "p1": "炭素価格への支持を高めるための行動科学的な介入55種類を、国際的な研究チームが独立に設計し、米国の約2万人に同時に実施した事前登録研究である。効果は正で統計的に有意だが非常に小さく、コーエンのdで0.06だった（抄録）。", "p2": "炭素価格は排出削減に有効で費用効率のよい政策だが、世論の受容の低さと政治的な支持の乏しさが導入の壁になっている（抄録）。行動介入は、現実の行動で測った支持をどれだけ動かせるか、どんな介入が効くかを問う。", "p3": "各研究チームが、行動介入は炭素価格への現実の支持にどう影響するかという共通の問いに答える実験を独自に設計し、支持の代理指標（寄付、請願への署名など）も自分で決めた（序論、図1）。全設計を同じ参加者プール（19,558人）で同時に実施し、介入群か対照群に無作為に割り当て、共通の手法で分析した（序論）。", "p4": "有意水準は0.5%と事前に登録し、各設計の効果をOLSで推定して変量効果メタ分析で統合した（結果）。全55設計の結果を、結果の向きによらず報告する（序論）。各チームには自分の設計と他の10チームの設計の効果を事前に予想させ、実際の効果と比べた（序論、図3）。", "p5": "現実の支持の代理指標への統合効果はd=0.063（99.5%CIは0.001〜0.124）、表明された一般的な支持ではd=0.076だった（結果、図2）。支持の増加は対照群に比べ1.1〜2.4ポイントである（考察）。55のうち44の設計では支持の増加が統計的に確認されなかった（結果、図3）。介入の種類や研究者の事前の予想は効果のばらつきを説明せず、研究チームには明確な過信があった（結果、考察）。", "p6": "チームが選んだ代理指標は設計ごとに違い、介入への反応と、報酬や初期設定など測定の仕組みへの反応を分けきれないものがある（考察）。介入と指標の組合せが固定のため、設計間の差が介入の効き目によるのか指標の感度によるのかは決められない（考察）。対象は米国の居住者である（抄録）。", "fun": "「この伝え方なら炭素価格への支持が増えるはず」という案を、世界の研究チームが55通り持ち寄り、米国の約2万人で一斉に試した。結果、支持は1.1〜2.4ポイントしか増えず、44の案でははっきりした効果が確認できなかった。もう一つの発見は研究者自身についてで、自分の案も他人の案も効果を大きく見積もりすぎていた。有意になった研究だけが報告されると、効果は約三倍半に見えるという試算も示している。", "unverified": "方法の節の詳細（参加者の募集、除外基準）、補足資料、55の設計それぞれの内容、過信の大きさの数値は確認していない。図1〜図3の個別の値は一部しか読んでいない。"}}, {"id": "jn04", "rank": 4, "field": "政治学", "headline": "多数決が個人に勝つのは考え方が十分に多様なとき", "title": "Cognitive diversity and majority rule", "url": "https://doi.org/10.1073/pnas.2608826123", "authors": "Lu Hong ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Hong, L., Lamberson, P. J., Page, S. E., & Satopää, V. A. (2026). Cognitive diversity and majority rule. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2608826123", "why": "集団の多数決が個人より正確になる理由を、独立な信号を前提とするコンドルセの陪審定理ではなく、同じ世界の状態を人が異なるモデルで分類するという「解釈された信号」の枠組みで説明した。集団の正確さは個人の平均的な正確さと対ごとの多様性で特徴づけられ、多数決が構成員を確実に上回るのは多様性が高いときに限られる。複数の実データとシミュレーションがこの枠組みを支持する。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Europe PMCの抄録だけを読んだ。", "preprint": false, "p1": "多数決が個人より正確になる理由を、コンドルセの陪審定理の「独立な信号」ではなく、同じ状況を人によって違うように分類する「解釈された信号」の集約で説明する枠組みのほうが、実データとシミュレーションでよく支持されることを示した（抄録）。", "p2": "委員会や審査会など集団に決定を任せる根拠は、集団が個人より正確だという証拠にあり、その主な論理はコンドルセの陪審定理である。定理は、独立で同じ精度の信号を前提に、多数決が平均的な投票者より正確で、個人の精度と人数とともに良くなるとする（抄録）。別の論理のほうが現実に合うかを問う。", "p3": "解釈された信号の枠組みでは、集団の正確さは、同じ世界の状態が人によって異なって分類されること、つまり多様な心的モデルの集約から生じる。平均の個人精度と、2人ずつの組の平均的な多様性を条件として、取りうる集団の精度の範囲を特徴づける。多数決の集団がメンバーを確実に上回るのは多様性が高いときだけである（抄録）。", "p4": "さまざまな実証の場面のデータと、最小限の最近傍モデルのシミュレーションで、2つの枠組みの予測を比べた（抄録）。データの種類と件数は抄録に記載がない。", "p5": "標準的な「生成された信号」のモデルより、解釈された信号の枠組みの予測がずっと強く支持された。さらに、平均の個人精度が集団の間でほぼ一定でないかぎり、多様な集団ほど正確さが低いという「多様性と正確さの逆説」の実証的な証拠を示した（抄録）。", "p6": "本文を入手できず、使ったデータ、多様性の測り方、逆説の大きさは確認できない。解釈：多様性と個人の精度は現実には一緒に変わるため、多様にすれば正確になるとは単純には言えない。著者は熟議による利得への含意に触れるが、熟議そのものを分析したかは抄録からは分からない。", "fun": "集団の多数決が個人より当たる理由として有名なのは、各自が独立に少しずつ当たるなら誤りが打ち消し合う、という説明である。この研究は別の説明を推す。人はそれぞれ違う物の見方で同じ状況を分類するので、見方が十分に違うときに限って多数決は個人を確実に上回る。ところがデータでは、多様な集団ほど不正確という傾向も現れた。個々人の正確さの平均が集団によって違うときに起こる現象である。", "unverified": "本文、実証データの出所、多様性の指標、シミュレーションのモデルの詳細は確認できなかった（抄録のみ）。"}}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "広く使われる過信の指標は能力と区別できていない", "title": "Widely Used Measures of Overconfidence Are Confounded with Ability", "url": "https://doi.org/10.1287/mnsc.2024.05184", "authors": "Stephen A. Spiller", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Spiller, S. A. (2026). Widely Used Measures of Overconfidence Are Confounded with Ability. Management Science. https://doi.org/10.1287/mnsc.2024.05184", "why": "過信の測定によく使われる複数の方法が、能力と交絡していることを解析的に示した。成績は能力の不完全な指標であり、自己評価は成績だけでなく能力についての事前の信念も反映するためである。公表済みのデータの再分析では、過信の指標がその後の成績を予測し、過信の指標が能力の信号になっていることと整合した。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "自信過剰のよく使われる測り方のいくつかは能力と交絡しており、自信過剰と他の特性との関連とされてきたものの一部は能力で説明できてしまう、と論じた（抄録）。", "p2": "自信過剰の指標は、自分の能力についての信念の偏りを測り、その相関（自己愛、社会的地位、課題への不安の低さ、貯蓄、計画など）を見つけるために使われる。そうした研究は、関連が能力によるものではないと明示的または暗黙に主張するが、その主張が成り立つかを問う（抄録）。", "p3": "分析的な議論で2つの性質を指摘する。第一に、成績は能力の不完全な指標であり、成績を考慮しても能力を十分には考慮できない。第二に、成績はあいまいなので、人は自己評価に能力についての事前の信念を取り込むはずであり、自己評価は成績に加えて能力も反映する。この2つから、複数の一般的な指標が能力と交絡することが導かれる（抄録）。", "p4": "分析的な結果を、既に公表された知見の再検討で裏づけた。1つめの分析は自信過剰がその後の成績を予測するかを調べ、2つめの分析群は、自信過剰と他の構成概念との関連が能力に帰せられるかを調べた（抄録）。", "p5": "自信過剰はその後の成績を予測し、自信過剰の指標が能力の信号として働いていることと整合する。自信過剰と他の構成概念との関連とされたものの一部は、能力で説明できた。著者は、誤った推論の可能性を認識し減らすための推奨を示す（抄録）。", "p6": "本文を入手できず、どの指標がどの程度交絡するか、再検討した研究の範囲は確認できない。解釈：この議論は、関連が能力で説明できる可能性を示すもので、個々の既存の知見が誤りだと示すものではない。能力を別に測る設計が要る、というのが実務上の含意になる。", "fun": "テストの出来が悪かったのに、自分ではもっと取れたと思っている人は「自信過剰」と判定される。でも、その人がふだんはよくできる実力の持ち主で、今回たまたま調子が悪かっただけならどうだろう。自己評価は実力を映しているのに、自信過剰に見えてしまう。この論文は、よく使われる測り方にこの落とし穴があり、「自信過剰な人ほど」という発見の一部は「実力のある人ほど」だったかもしれないと指摘する。", "unverified": "本文、対象とした指標の種類、数式、再検討した先行研究とその結果の数値は確認できなかった（抄録のみ）。"}}, {"id": "jn06", "rank": 6, "field": "心理学・認知科学", "headline": "漁撈の文化は絆の強さとよそ者への開放性を併せ持つ", "title": "Sea-fishing cultures show rare blend of tight social ties and openness to strangers", "url": "https://doi.org/10.1073/pnas.2536327123", "authors": "An Huang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Huang, A., & Talhelm, T. (2026). Sea-fishing cultures show rare blend of tight social ties and openness to strangers. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2536327123", "why": "海の漁業を生業としてきた地域の文化を、日本の近接する地域の1,010人の比較、現代の150か国、世界の1,265の民族集団の歴史記録で調べた。漁業地域の人は包括的に考え、身近な関係での責任を重んじる（文化水準の効果量d=0.91）一方、内集団への忠誠と外集団への差別は弱い（d=1.37）。個人主義と集団主義の二分法に収まらない型を示す。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "海の漁業を生業としてきた地域の文化は、身近な関係での責任を重んじる面と、内集団への忠誠やよそ者への差別が弱い面を併せ持つことを、日本の1,010人、150か国、1,265の民族集団の記録で示した（抄録）。", "p2": "文化差を歴史的な生業に結びつける研究は農耕と牧畜に集中しており、主要な生業である海の漁業が文化を形づくるかはあまり分かっていない（抄録）。著者は、漁業の文化のパターンが個人主義と集団主義の二分法にきれいに収まらないことが、注目されてこなかった理由だと提案する。", "p3": "まず、より統制された比較として、日本の近接する地域の1,010人を調べた。次に、現代の150か国と、世界の1,265の民族集団の歴史記録で一般化できるかを確かめた。逆の因果には、漁業への環境の適性のデータを使う操作変数分析で対処した（抄録）。", "p4": "漁業の影響を特定するため、海岸線を持つ地域のうち、魚の多い海に面する地域と少ない海に面する地域を比べた。海への近さ、交易、交通がこの文化差と結びつくかを検討し、淡水の漁業にも当てはまるかを確かめた（抄録）。", "p5": "漁業地域の人は、非漁業の文化の人より全体的に考え、身近な関係での責任を重んじる（文化レベルでd=0.91）。一方で内集団への忠誠と外集団への差別は弱い（d=1.37）。海への近さ、交易、交通はこの文化差と結びつかず、淡水の漁業にはこのパターンが及ばない（いずれも抄録）。", "p6": "前者は危険な海での協力に、後者は漁業の移動性と柔軟な労働のつながりに適応的だった可能性があると著者は述べるが、これは説明の提案である（抄録）。本文を入手できず、指標の測り方、操作変数の妥当性、国と民族のレベルの推定の詳細は確認できない。", "fun": "文化の違いを昔からの生業で説明する研究は、農耕と牧畜を中心に進んできた。では海で漁をしてきた地域はどうか。この研究によると、よくある二分法には収まらない。仲間内での責任は重んじるのに、身内びいきやよそ者への差別は弱い。危険な海では助け合いが欠かせず、移動が多く人手を融通し合う漁業ではよそ者に開かれていることが役立った、というのが著者の説明である。川や湖の漁業ではこの傾向は見られなかった。", "unverified": "本文、日本の調査地域、文化の指標の定義、操作変数分析の結果の数値は確認できなかった（抄録のみ）。"}}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "輸入依存の非対称が国家間の「力」になる", "title": "International Power", "url": "https://doi.org/10.1093/qje/qjag061", "authors": "Ernest Liu ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-23", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Liu, E., & Yang, D. Y. (2026). International Power. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag061", "why": "貿易から生じる国家間の力を、二国間の輸入依存の非対称を産業の貿易弾力性の逆数で重みづけた指標として、過去20年の国の組について作った。この力が高まると、貿易を止めるという脅しの信頼性が上がり、二国間の関与と交渉が増える。地政学的な関係が悪化すると、将来の紛争を見越して貿易を調整し、力を高める動きが見られる。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "貿易から生じる国際的な「力」を、二国間の輸入依存の非対称性として定式化して測った。力の増大は二国間の関与と交渉を増やし、地政学的な関係の悪化は力の蓄積を促すという結果を示した（抄録）。", "p2": "つながり合った世界は経済効率を高める一方で、特定の国に他国への影響力を与える（抄録）。貿易に由来する力をどう記述し、その帰結と戦略的な原因をどう理解するかを問う。", "p3": "二国間の紛争と事後のホールドアップの可能性がある貿易の例示的なモデルを使い、輸入依存の二国間の非対称性が互いへの力の源になりうることを示す。モデルから導かれる指標、すなわち部門別の貿易弾力性の逆数で重みづけした非対称な二国間の輸入依存を、過去20年の国の組について構築した（抄録）。", "p4": "この指標を、二国間の関与の事象の包括的なデータと、二国間の地政学的関係の高頻度の指標と組み合わせ、力の帰結と戦略的な原因を調べた（抄録）。推定の方法と識別の工夫は抄録に記載がない。", "p5": "第一に、国の間の力の増大は、貿易を途絶させるという脅しの信憑性を高め、より多くの二国間の関与と交渉を引き起こす。第二に、地政学的関係の悪化は、将来の紛争を見越して、各国が貿易活動を調整してより大きな力を蓄えることを促すという証拠がある（抄録）。", "p6": "本文を入手できず、因果の識別、指標の具体的な計算、対象国の範囲は確認できない。モデルは著者自身が例示的と呼ぶものである（抄録）。解釈：力と関与は互いに影響し合うので、2つの結果を別々の因果として読むには本文の識別の方法を確かめる必要がある。", "fun": "ある国が別の国からの輸入に大きく頼っていて、逆はそうでもないとき、頼られている側は「取引を止める」という脅しが効く立場になる。この研究は、この輸入依存の片寄りを国の組ごとに過去20年分測り、力の指標にした。力が増すと、二国間の交渉や接触が増えた。関係が悪くなると、各国は貿易を調整して力を蓄えようとする。貿易は効率を高めるだけでなく、交渉の手段にもなる。", "unverified": "本文、モデルの式、データの出所と対象国、推定結果の数値は確認できなかった（抄録のみ）。"}}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "調査実験の標本抽出と割り当てを細かく層別する", "title": "Fine Stratification of Survey Experiments", "url": "https://doi.org/10.1093/restud/rdag131", "authors": "Max Cytrynbaum", "venue": "Review of Economic Studies", "date": "2026-11-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "apa": "Cytrynbaum, M. (2026). Fine Stratification of Survey Experiments. Review of Economic Studies. https://doi.org/10.1093/restud/rdag131", "why": "対象者の集団から代表的な参加者を抽出し、次に処置を割り当てる2段階の実験で、両方の段階にk個組のマッチングによる無作為化を使う設計を調べた。任意のkと共変量の次元でk個組を作る高速なアルゴリズムを開発し、最近の実験論文200本の約48%で多変量の細かい層別が新たに可能になると見積もる。両段階の効率の向上を反映した推測の方法も示す。", "explain": {"basis": "本文", "basis_note": "出版社のページは取得できず、同じ論文のオープンアクセス版（arXivのPDF）の序論と、実証応用の結果の節を読んだ。理論の節と付録は読んでいない。", "preprint": false, "p1": "参加者を適格者のプールから代表的に抽出する段階と、処置を割り当てる段階の両方で、共変量の近い単位をk個の組にまとめて無作為化する「細かい層別」の調査実験を理論づけ、任意のkと任意の次元の共変量で使える組分けのアルゴリズムと推測法を示した（抄録）。", "p2": "実験では、標本が母集団を代表することと、処置群と対照群が共変量でよく釣り合うことの両方が望まれる（序論）。組を作る既存の方法は、質の保証がペアやその再帰的な拡張、1次元の場合に限られていた（序論）。一般のkで保証つきの設計と、その効率の利得を活かす推測ができるかを問う。", "p3": "適格者から代表的に抽出し、次に処置か対照に割り当てる2段階のモデルを考え、両段階でk個組の無作為化を使う（抄録）。組の重心からのずれが漸近的に消えるという密なマッチングの条件を満たすよう、高速な空間ソートを初期値として均衡k-means法を走らせるアルゴリズムを作った（序論、式1.1）。抽出率が共変量で変わる場合や、処置確率が2分の1でない場合も扱う（序論）。", "p4": "2024〜2026年のNBERワーキングペーパーから無作為化実験を含む200本を調べ、この方法で新たに可能になる設計の割合を見積もった（序論）。公刊された9つの実験のデータに適用し、単純な無作為化に対する標準偏差の変化と、信頼区間の被覆率を評価した（結果、表1）。", "p5": "200本のうち96本（約48%）は、既存の方法では多変量の質の保証が得られないkを必要としていた（序論）。9つの実験では、処置割り当ての細かい層別で標準偏差が平均14%減り、2つの研究では30%を超えた（結果、表1）。抽出の層別による上積みは平均0.3%と小さい。共変量が処置効果の異質性を説明する割合が平均4%にとどまるためで、理論と整合する（結果）。被覆率は平均0.946だった（結果）。", "p6": "抽出の層別の利得は、適格者のプールが大きく、共変量が処置効果の異質性をよく予測するほど大きくなるので、今回の9つの実験のように予測力が低いと小さい（抄録、結果）。読んだのはarXivの公開版で、掲載版との異同は確認していない。", "fun": "実験で2つのグループを比べるとき、くじ引きの前に、年齢や収入の似た人どうしを組にしておき、組の中でくじを引くと、グループが最初からよく似るので結果のぶれが小さくなる。2人組なら作り方は知られていたが、3人以上の組で条件がいくつもあると、最良の組分けを求めるのは計算上とても難しい。この論文は、質の保証がある組分けを10万人の規模でも作れる方法を示し、実際の9つの実験でぶれが平均14%減ることを確かめた。", "unverified": "§2〜§6の定理と証明、予算制約つきの最適設計の節、付録は読んでいない。掲載版は取得できず、arXivの版との違いは確認していない。9つの実験の個別の値は確認していない。"}}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "指数を売るESG評価会社は株価の良い企業に甘い", "title": "Environmental, Social, and Governance Ratings of Environmental, Social, and Governance Index Providers", "url": "https://doi.org/10.2308/tar-2023-0522", "authors": "Sonakshi Agrawal ほか", "venue": "The Accounting Review", "date": "2026-11-24", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Agrawal, S., Liu, L. Y., Rajgopal, S., Sridharan, S. A., Yan, Y., & Yohn, T. L. (2026). Environmental, Social, and Governance Ratings of Environmental, Social, and Governance Index Providers. The Accounting Review, 1–30. https://doi.org/10.2308/tar-2023-0522", "why": "ESG評価会社が評価を出すだけでなく、ESG指数を作って販売していることに注目した。同じ企業に対する評価会社間の評価を比べることで、実際のESGの成果を統制している。指数の使用料の誘因が強い評価会社は、株価の成績が良い企業に高い評価を付ける傾向があり、この関連は指数の対象になりうる企業に集中していた。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "ESG評価機関が評価だけでなくESG指数も作って売るようになったことに着目し、指数のライセンスの誘因が強い評価機関ほど、株価の好調な企業に高いESG評価を付けていることを示した（抄録）。", "p2": "評価機関のビジネスモデルは、評価の作られ方に影響するかを問う。具体的には、指数のライセンスの誘因が、ESG評価と株式リターンの関係に結びつくかを調べる（抄録）。", "p3": "同じ企業に対する評価を評価機関の間で比べることで、その企業の根本的なESGの実績を統制する。そのうえで、誘因の強い機関と弱い機関とで、評価と株式パフォーマンスの関係がどう違うかを見る（抄録）。対象の評価機関、期間、標本は抄録に記載がない。", "p4": "関連が指数の対象になりうる企業に集中するかを調べた。さらに、指数の構成と株式リターンの関係、指数の構成の変更の後に評価が調整されるかを、誘因の強い機関と弱い機関で比べた（抄録）。", "p5": "誘因の強い評価機関は、弱い機関に比べ、株価の好調な企業に高いESG評価を付け、この関連は指数の対象になりうる企業に集中していた。指数の構成は株式リターンと有意に関連し、誘因の強い機関は指数の構成の変更の後に評価を調整するが、弱い機関はしない（いずれも抄録）。", "p6": "本文を入手できず、誘因の強弱の定義、評価機関の数、効果の大きさは確認できない。解釈：結果は関連であり、評価機関が意図して評価を変えていることの直接の証拠ではない。著者は、評価の作り手の誘因についての透明性を高める必要を述べている（抄録）。", "fun": "会社の環境や社会への取り組みに点数を付ける評価機関は、その点数をもとにした株価指数も作って売り、利用料を得ている。この研究は、同じ会社に複数の機関が付けた点数を比べ、指数の商売の誘因が強い機関ほど、株価の好調な会社に高い点を付けていることを見つけた。指数の中身が入れ替わると、その機関は点数も直していた。採点者が自分の点数で商売をすると、点数の付き方が変わりうるという話である。", "unverified": "本文、対象の評価機関と期間、誘因の測り方、推定結果の数値は確認できなかった（抄録のみ）。"}}, {"id": "jn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "皆が苦しい超インフレ下では困窮しても努力が続く", "title": "Maintaining Effort Amid Shared Adversity: How Hyperinflation Alters the Motivational Influence of Economic Hardship", "url": "https://doi.org/10.1111/peps.70049", "authors": "John M. Schaubroeck ほか", "venue": "Personnel Psychology", "date": "2026-11-26", "sjr": 5.41, "citescore": 14.8, "citescore_year": "2025", "apa": "Schaubroeck, J. M., Peng, A. C., Khalvati, C., & Demirtas, O. (2026). Maintaining Effort Amid Shared Adversity: How Hyperinflation Alters the Motivational Influence of Economic Hardship. Personnel Psychology. https://doi.org/10.1111/peps.70049", "why": "経済的な困窮は仕事の努力を下げるとされるが、社会全体で共有される超インフレのもとでは努力が維持されると論じた。トルコの医療機関での9週間の調査と2つの実験で、超インフレの条件では困窮の悪化が努力を下げず、視点取得の高い人は努力を増やした。超インフレでない条件では困窮が努力を損なった。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "経済的な困窮は一般に仕事の努力を下げるとされるが、社会全体が共有するハイパーインフレの下では、困窮の悪化が努力を下げないことを、トルコの医療機関での調査と2つの実験で示した（抄録）。", "p2": "従業員は経済的な困窮に対して、努力を減らし成績を落とすのが普通だとされる。著者は、困窮が社会で共有される逆境の中で起こると、社会的に価値のある役割期待が際立ち、努力の維持を助けると論じ、それを検証する（抄録）。", "p3": "研究1は、インフレが急騰した9週間にトルコの医療機関で仮説を検証した。研究2と研究3は、困窮の悪化とハイパーインフレの有無を実験的に操作した。他者の視点に立つ傾向（視点取得）を調整要因、自己超越を媒介として扱う（抄録）。", "p4": "研究1では困窮の悪化と努力の増加の関係、視点取得との交互作用、職務成績とのつながりを調べた。研究2は努力への直接の効果、研究3は自己超越を介した間接の効果を、ハイパーインフレの条件とそうでない条件で比べた（抄録）。標本の大きさと測定の方法は抄録に記載がない。", "p5": "研究1では、困窮の悪化が努力の増加に及ぼす効果は正だが有意でなかった。視点取得の高い従業員は困窮の深刻化に対して努力を増やし、それが高い職務成績につながった。実験では、困窮の悪化はハイパーインフレの条件では努力を減らさず、そうでない条件では努力を妨げた。視点取得の高さは、ハイパーインフレの下では努力の維持を助け、そうでない条件では困窮の悪影響を強めた（いずれも抄録）。", "p6": "研究1の主効果は有意でなく、結果の中心は交互作用にある（抄録）。解釈：実験は困窮とインフレを操作したもので、現実の長期の困窮とは異なる。対象の中心はトルコの医療機関で、他の国や職種への一般化は分からない。本文を入手できず、効果の大きさは確認できない。", "fun": "生活が苦しくなると仕事に身が入らなくなる、というのがこれまでの研究の見方だった。ところが、物価が急騰して社会全体が苦しいときのトルコの医療機関では、そうならなかった。とくに、他人の立場に立って考える人は、苦しくなるほど努力を増やしていた。著者らは、皆が大変なときには、社会から期待される役割が強く意識されるためだと考える。同じ苦しさでも、皆が共有しているかどうかで反応が変わる。", "unverified": "本文、各研究の標本の大きさ、尺度、効果量、実験の操作の具体的な内容は確認できなかった（抄録のみ）。"}}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "従業員代表のいる企業ほど管理職を内部から登用", "title": "Democratic Organizing and Contemporary Managerial Talent Markets: Internal Promotion or External Hiring?", "url": "https://doi.org/10.1287/orsc.2024.19538", "authors": "Aleksandra Gregoric ほか", "venue": "Organization Science", "date": "2026-11-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "apa": "Gregoric, A., Kato, T., & Larsen, C. B. L. (2026). Democratic Organizing and Contemporary Managerial Talent Markets: Internal Promotion or External Hiring? Organization Science. https://doi.org/10.1287/orsc.2024.19538", "why": "デンマークの2001〜2017年の雇用主と従業員を結んだ縦断データで、取締役会に従業員代表がいる企業は、そうでない企業より管理職を外部採用ではなく内部昇進で埋める傾向が強いことを示した。この関連は、従業員代表が社内の経験が広く昇進に関わる情報を持つ場合などで強い。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "従業員の代表が取締役会に入っている企業は、そうでない企業より、管理職を外部採用ではなく内部昇進で埋める傾向が強いことを、デンマーク企業の雇用主と従業員を結んだデータ（2001〜2017年）で示した（抄録）。", "p2": "内部労働市場による昇進の利点は、労働者が社内でのキャリアを重んじ長く勤めるという前提に立ってきた。在職期間の短縮と企業間のキャリアへの志向の高まりは、内部労働市場の情報の優位を弱め、内部候補の定着を損なう可能性がある（抄録）。民主的な組織化はこの難点を和らげるかを問う。", "p3": "民主的に組織された企業は内部労働市場の難点の影響を受けにくく、内部採用の便益が大きいので内部昇進を選びやすい、という理論枠組みを立てる。デンマーク企業の縦断的な雇用主・従業員連結データを使い、従業員の取締役会代表の有無と、管理職ポストの埋め方の関係を推定する（抄録）。", "p4": "関連が、従業員代表が社内で幅広い経験を持ち昇進に関わる情報を持ちやすい場合と、同僚が従業員代表として取締役会にいる管理職・専門職が多い場合に強まるかを調べた。従業員側の取締役と人事の専門家への面接で、想定する仕組みを例示した（抄録）。", "p5": "従業員代表のいる企業は、いない企業より内部昇進で管理職を埋める傾向が強く、この関連は上の2つの場合に強かった。結果は、民主的な組織で内部昇進の経済的な実行可能性が高いことと整合し、力を持った労働者が採用の選択を歪めるという従来の説明とはおおむね整合しない（抄録）。", "p6": "解釈：従業員代表の有無は企業の規模や業種、制度上の要件と結びつくため、関連を因果として読むには識別の方法の確認が要る。対象はデンマークの企業で、制度の異なる国への一般化は分からない。本文を入手できず、効果の大きさと推定の詳細は確認できない。", "fun": "管理職のポストが空いたとき、社内から上げるか、外から採るか。デンマークの企業を2001年から2017年まで追ったこの研究によると、従業員の代表が取締役会に入っている会社は、社内から昇進させることが多かった。代表が身内をひいきするからではなく、昇進の判断に役立つ情報を持っているからだ、と著者らは見る。実際、代表が社内で幅広い経験を持つ会社ほど、この傾向が強かった。", "unverified": "本文、標本の大きさ、推定式、効果量、面接の件数と内容は確認できなかった（抄録のみ）。"}}, {"id": "jn12", "rank": 12, "field": "地球科学", "headline": "地震の破壊は「禁じられた」速度域を通過できる", "title": "Breakdown of the classical rupture theory and earthquake propagation in the “forbidden” super-Rayleigh range", "url": "https://doi.org/10.1073/pnas.2631141123", "authors": "Anna Pomyalov ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-25", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Pomyalov, A., Barras, F., & Bouchbinder, E. (2026). Breakdown of the classical rupture theory and earthquake propagation in the “forbidden” super-Rayleigh range. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2631141123", "why": "せん断波より速く伝わる地震は、レイリー波速度以下の領域から超せん断の領域へ不連続に飛ぶと考えられ、その間の速度域は古典的な破壊理論で禁じられてきた。断層の摩擦がすべり速度に依存することを取り入れた破壊理論を作り、数値計算と照合した。レイリー波速度のごく近くでは摩擦の速度依存の非線形性により、破壊が禁じられた速度域を連続的に通って超せん断へ移ることを示す。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Europe PMCの抄録だけを読んだ。", "preprint": false, "p1": "断層の摩擦強度がすべり速度に依存することを取り入れた破壊理論を作った。古典理論では「禁止」とされるレイリー波速度とS波速度の間の速度域を、破壊が連続的に通り抜けて超せん断域に入ることを数値計算で示した（抄録）。", "p2": "S波速度より速く伝わる地震は、サブレイリー域から超せん断域へ不連続に跳ぶ遷移を経ると考えられている。レイリー波速度とS波速度の間の超レイリー域は、2次元の古典的な破壊理論では禁止されている（抄録）。この禁止が理論の仮定に由来するものかを問う。", "p3": "古典理論の前提となる仮定を見直し、断層の強度（摩擦抵抗）のすべり速度への依存を考慮した破壊理論を構築する。そのうえで理論を数値シミュレーションと比べる（抄録）。", "p4": "理論の予測と破壊伝播の数値シミュレーションを、伝播速度がレイリー波速度に近づく範囲まで比較した（抄録）。摩擦則の具体形と計算の設定は抄録に詳しい記載がない。", "p5": "理論は、レイリー波速度のほぼ直前まで数値シミュレーションと定量的に一致した。レイリー波速度のごく近くでは、速度強化型の摩擦を含む摩擦の速度非線形性のために数値解の性質が変わり、破壊は超レイリー域を連続的に通って超せん断域に入り、鋭い超せん断遷移は起こらなかった（抄録）。", "p6": "結果は理論と数値計算によるもので、実際の地震や室内実験の観測との直接の比較は抄録に書かれていない。レイリー波速度のごく近くの挙動は、理論ではなく数値解で示されている（抄録）。本文を入手できず、摩擦則のパラメータへの依存や3次元の場合は確認できない。", "fun": "地震の破壊が断層を走る速さには、古典的な理論では「この範囲の速さでは進めない」という禁止帯があった。だから速い地震は、禁止帯を飛び越えて一気に速くなると考えられてきた。この研究は、すべりの速さによって摩擦の強さが変わるという、実験でふつうに見られる性質を理論に入れた。すると計算の中の破壊は、禁止帯を飛び越えずに連続的に通り抜けた。禁止は理論の前提から来ていたことになる。", "unverified": "本文、理論の式、摩擦則とそのパラメータ、数値計算の設定、観測との対応は確認できなかった（抄録のみ）。"}}, {"id": "jn13", "rank": 13, "field": "機械学習", "headline": "強化学習で拡散モデルを目的の材料へ導く", "title": "Accelerating inverse materials design using generative diffusion models with reinforcement learning", "url": "https://doi.org/10.1038/s42256-026-01334-5", "authors": "Junwu Chen ほか", "venue": "Nature Machine Intelligence", "date": "2026-11-26", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "apa": "Chen, J., Guo, J., Fako, E., & Schwaller, P. (2026). Accelerating inverse materials design using generative diffusion models with reinforcement learning. Nature Machine Intelligence. https://doi.org/10.1038/s42256-026-01334-5", "why": "結晶構造を生成する拡散モデルを、目的の物性に向けて強化学習で最適化する手法を示した。ノイズ除去を多段階の意思決定とみなし、報酬で重みづけたKL正則化つきの方策勾配、経験の再利用、多様性のフィルタを使う。単一の目的では60回の反復（約1,000回の物性評価）以内に目標値へ収束し、供給リスクの低い磁石など相反する性質の設計にも成功した。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文のうち、結果の「RL pipeline」冒頭、「Single-property optimization」、「Multiple-property optimization」冒頭、「Discussion」を読んだ。方法の節と補足資料は読んでいない。", "preprint": false, "p1": "事前学習した結晶生成の拡散モデルを、強化学習で目的の物性に向けて微調整する手順MatInventを示した。単一の物性の設計では、60回の反復、約1,000回の物性評価のうちに目標値に収束する（抄録）。", "p2": "拡散モデルは望む物性を持つ新しい構造を直接生成できると期待されるが、条件つき生成などの既存の方法は、高価なラベルつきデータを大量（1万件超）に必要とし、適応性に欠ける（抄録）。少ない物性評価で、既存の生成モデルを目的に合わせて調整できるかを問う。", "p3": "拡散モデルの雑音除去の各段階を多段階の意思決定とみなし、拡散モデル自体を強化学習のエージェントとする（RL pipelineの節）。各反復で結晶構造を生成し、機械学習の原子間ポテンシャルで構造を緩和して、安定で重複がなく新規な構造だけを残す。そこから選んだ試料の物性を評価して報酬を与え、報酬の高い試料で、報酬で重みづけしたKL正則化つきの方策最適化を行う（同節、図1）。", "p4": "単一物性の8課題（バンドギャップ3.0 eV、磁気密度、比熱、誘電率、供給リスクなど）で、DFT、原子間ポテンシャル、機械学習の予測器を報酬の源として試した（Single-propertyの節、図2）。複数の物性では、希土類を避けた磁石（磁気密度と供給リスクの指標の同時最適化）などを試した（Multiple-propertyの節）。", "p5": "多くの単一物性の課題で、60回の反復と約1,000回の物性評価のうちに、生成物の平均の物性値が目標に収束した（Single-propertyの節、図2）。磁石の課題では、2つの物性の平均が反復とともに目標の領域に近づき、100回の反復の後に目標値の近くに収束した（Multiple-propertyの節、図4）。条件つき生成と比べて同等以上の生成性能を、より少ない物性評価で得たと著者は述べる（Discussion）。", "p6": "報酬は機械学習の予測器やDFTといった外部の評価器に頼り、雑音や偏りが報酬に入りうる（Discussion）。DFTを使う場合は物性評価が計算上の律速になる（Discussion）。現実の設計は5つを超える目的を持つことが多く、合成経路などの情報は組み込まれていない（Discussion）。生成した材料の実験による合成と検証は、読んだ範囲にない。", "fun": "欲しい性質を持つ新しい結晶をコンピュータに考えさせる研究である。従来の方法は、性質のラベルが付いたデータを1万件以上必要とした。この研究は、すでに結晶の作り方を覚えたAIに試作品を出させては採点し、点の高かったものを手本に少しずつ作り方を調整し直す。採点は約1,000回で済み、希土類を使わない磁石の候補のように、複数の条件を同時に満たす課題にも使えた。", "unverified": "方法の節（結晶の表現、拡散モデル、経験再生、多様性フィルタの詳細）、補足資料、既存手法との比較の数値は読んでいない。高誘電率の誘電体の課題の結果、公開コードは確認していない。"}}, {"id": "jn14", "rank": 14, "field": "工学", "headline": "順位づけは完璧でも警報は1件も鳴らない検知器", "title": "Perfect Ranking, Missed Alarms: Calibrating a Leakage‐Resistant Autoencoder for Multifrequency Guided‐Wave Corrosion Monitoring", "url": "https://doi.org/10.1155/stc/6837078", "authors": "Ebtisam Abdullah Alabdulqader ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-26", "citescore": 10.3, "citescore_year": "2025", "apa": "Alabdulqader, E. A., Alabdullah, B., Qamar, U., Alouane, M. T.-H., Aljohani, A., Bhatt, M. W., & Mia, Md. S. (2026). Perfect Ranking, Missed Alarms: Calibrating a Leakage‐Resistant Autoencoder for Multifrequency Guided‐Wave Corrosion Monitoring. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/6837078", "why": "超音波ガイド波による腐食の監視で、検知器の得点が健全と損傷を分ける能力と、事前に固定したしきい値で警報を出す能力が一致するかを、公開の配管データ（236回の計測）を時系列順に分けて調べた。健全データだけで学習した自己符号化器は順位づけが完璧（ROC-AUC=1.000）だったが、検証データで決めたしきい値では損傷を1件も検出できなかった。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": false, "p1": "複合材で補修した配管の超音波ガイド波による腐食監視の公開データで、健全なデータだけで学習した自己符号化器は、健全と損傷の順位づけは完全（ROC-AUC 1.000）なのに、事前に固定した閾値では損傷を1件も警報できなかった（再現率0.000）ことを示した（抄録）。", "p2": "ガイド波の検出器は、出力のスコアが健全と損傷をどれだけ分けるかで評価されることが多い。しかし実運用では、将来のデータを見る前に固定した閾値で警報を出さねばならない（抄録）。この2つの要求が、時系列に沿った評価の下で一致するかを問う。", "p3": "データは236回の完全な取得からなり、1回の取得は同じ監視時刻に記録された10個の周波数・モードの見え方（5つの励起周波数×2つの伝播モード）をまとめた分割できない1標本である。最初の124回の健全な取得で学習し、次の41回で検証し、残る健全42回と損傷29回を最終の試験に取っておいた（抄録）。", "p4": "健全な信号の形だけで学習する物理情報つきの多視点の自己符号化器を、標準的な1クラス法と比べた。5つの乱数種のアンサンブルで評価し、24 kHzのチャネルに限った場合、雑音を加えた場合、周波数を欠かせた場合も調べた（抄録）。", "p5": "自己符号化器の順位づけは完全で、スコアは損傷の程度とも強く関連した（スピアマンの順位相関0.948）。しかし損傷のスコアはすべて、検証データから決めた閾値133.281を下回り、再現率は0.000だった。1クラスSVMは再現率1.000、特異度1.000だった。24 kHzに限ると自己符号化器の再現率は0.448に上がったが、雑音や周波数の欠落は順位をほとんど変えず、警報も回復しなかった（いずれも抄録）。", "p6": "1つの公開データ、損傷29回という小さな試験での結果であり、1クラスSVMの良さも「今回の記述子の空間で」と限定されている（抄録）。本文を入手できず、スコアの尺度が後の期間でずれた原因の分析は確認できない。著者は、閾値を動かす指標と、過去の健全データだけで較正した閾値での警報性能の両方を報告するよう勧める（抄録）。", "fun": "配管の傷を見つけるAIが、試験で「傷ありのデータは必ず傷なしより高い点になる」という満点の成績を出した。ところが、前もって決めておいた合格ラインで警報を鳴らす実際の使い方にすると、29回の傷を1回も知らせなかった。点数の並び順は正しくても、時間がたつと点数の水準そのものがずれ、ラインが合わなくなったからである。順位の成績と警報の成績は別物だと教えてくれる。", "unverified": "本文、データセットの名称、自己符号化器の構成、閾値の決め方の詳細、スコアの水準がずれた理由の分析は確認できなかった（抄録のみ）。"}}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "金融引き締めは労働供給を増やし雇用減を和らげる", "title": "The Labor Demand and Labor Supply Channels of Monetary Policy", "url": "https://doi.org/10.1093/restud/rdag132", "authors": "Sebastian Graves ほか", "venue": "Review of Economic Studies", "date": "2026-11-24", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "apa": "Graves, S., Huckfeldt, C., & Swanson, E. T. (2026). The Labor Demand and Labor Supply Channels of Monetary Policy. Review of Economic Studies. https://doi.org/10.1093/restud/rdag132", "why": "FOMCの発表や議長の講演の前後の金利の変化を使い、金融政策への労働市場のフローの反応を推定した。引き締めの衝撃のあと、労働者は職を辞めて非就業になる率を下げ、非就業の人は求職を増やす。この供給側の反応がなければ、雇用の減少は2倍になっていた。摩擦のある労働市場をもつ異質な個人のモデルで、この結果を説明する。", "explain": {"basis": "本文", "basis_note": "出版社のページは取得できず、同じ論文のオープンアクセス版（NBERワーキングペーパーのPDF）の§1・§2冒頭・§7を読んだ。推定結果とモデルの節、付録は読んでいない。", "preprint": false, "p1": "金融引き締めは労働需要だけでなく労働供給も動かすことを、労働市場のフローの反応から示した。引き締めの後、自分から辞めて非就業になる人が減り、非就業の人の職探しが増える。この供給側の反応がなければ、雇用の落ち込みは約2倍になる（抄録）。", "p2": "金融政策は労働需要を通じて雇用に効くと理解され、労働供給の役割はあまり考慮されてこなかった（抄録、§1）。労働者の側の判断で起こるフローは金融政策にどう反応し、雇用の反応のどれだけを左右するかを問う。", "p3": "1978〜2019年の月次の人口動態調査（CPS）を個人で連結したフローのデータを使う（§2）。失業と非労働力の間の移動と、非就業への自発的な離職を供給主導のフローと分類する（§1）。金融政策の構造VARにフローを加え、FOMCの発表とFRB議長の講演の前後の金利先物の高頻度の変化を外部の操作変数として識別する（§1）。", "p4": "供給主導のフローを平均に固定した仮想の反応を作り、雇用の反応への寄与を測った（§1）。労働者の構成の変化では説明できないことも確かめた（§1）。さらに、摩擦のある労働市場と、働くかどうかの選択を持つ異質な家計のモデルを推定し、反応を再現した（§1、§7）。", "p5": "引き締めの後、就業から失業への流れは増え、失業から就業への流れは減る。これは需要の低下と整合する。同時に、非労働力から失業への流れが有意に増え、失業から非労働力への流れは減り、非労働力への離職も有意に減った（§1）。供給主導のフローを固定すると雇用の減少は約2倍になる（§1、§7）。モデルでも、労働供給の方策を固定すると雇用の減少は約80%大きい（§1）。", "p6": "どのフローを供給主導とみなすかは分類の仮定によっており、著者は労働者が起こす移動を「もっともらしく」供給を反映するものとして扱う（§1）。対象は米国である。読んだのは公開版の序論・データの冒頭・結論で、推定の詳細と頑健性の検討は確認しておらず、掲載版との異同も確認していない。", "fun": "中央銀行が金利を上げると景気が冷え、会社が人を雇わなくなって失業が増える。ここまではよく知られた話である。この研究は、働く側の動きにも目を向けた。金利が上がった後、人は今の仕事を自分からは辞めにくくなり、仕事を探していなかった人も探し始める。この「働こうとする動き」が雇用の落ち込みを和らげていた。これがなければ、落ち込みは約2倍になっていたという計算である。", "unverified": "§3〜§6（推定結果、構成と異質性、フローにもとづく分解、モデル）、付録は読んでいない。インパルス応答の大きさと信頼区間、学歴による違いの図表は確認していない。掲載版は取得できなかった。"}}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "犯罪統計の操作を難しくすると虚偽報告が増えうる", "title": "Juking the Stats: Policing, Misreporting, and Policy Evaluation", "url": "https://doi.org/10.1093/restud/rdag130", "authors": "Michael Gibilisco ほか", "venue": "Review of Economic Studies", "date": "2026-11-25", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "apa": "Gibilisco, M., & Horz, C. M. (2026). Juking the Stats: Policing, Misreporting, and Policy Evaluation. Review of Economic Studies. https://doi.org/10.1093/restud/rdag130", "why": "犯罪と犯罪の報告をゲーム理論でモデル化し、犯罪統計の質を分析した。取り締まる側は評判を気にして結果を偽って報告しうる。複数の均衡が存在し、過少報告と過大報告が起きる条件を示す。データ操作の費用を上げると、かえって虚偽報告が増える場合がある。政策の効果は、報告された統計と真の統計で一致しない。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "犯罪統計は、取り締まる側が自分の評価を気にして数字を偽る可能性があるため歪みうることを、ゲーム理論のモデルで示し、統計を使った政策評価がどうずれるかを明らかにした。", "p3": "違法な行為をするかを選ぶ者と、努力の水準と結果の報告のしかたを選ぶ取り締まり側からなるモデルを分析した。取り締まり側は、シグナリングの動機から虚偽の報告をしうる（抄録）。", "p5": "複数の均衡が存在しうること、犯罪が過少に報告される場合と過大に報告される場合の条件を示した。データ操作の費用を上げると、かえって虚偽報告が増えることがある。政策の変更の効果は、報告された統計と真の統計で一致せず、真の効果は過小にも過大にも推定されうる（抄録）。", "fun": "犯罪が減ったという統計は、本当に犯罪が減ったことを意味するのか。数字を報告するのは取り締まる側で、自分の見え方を気にする。この論文は、そのかけひきを数式で表した。意外なのは、数字を操作しにくくする対策が、かえって虚偽の報告を増やす場合があることだ。報告する人に利害があると、統計で政策の効き目を測ること自体が難しくなる。", "unverified": "理論モデルの研究で、実際の犯罪統計での検証は抄録の範囲では扱われていない。モデルの仮定の詳細は未確認。"}}, {"id": "jn17", "rank": 17, "field": "心理学・認知科学", "headline": "人間関係の勘違いは将来の関係を言い当てている", "title": "Errors in social network knowledge predict how ties evolve in the future", "url": "https://doi.org/10.1126/sciadv.aeh9321", "authors": "Alice Xia ほか", "venue": "Science Advances", "date": "2026-11-25", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Xia, A., Teoh, Y. Y., Bhandari, A., & FeldmanHall, O. (2026). Errors in social network knowledge predict how ties evolve in the future. Science Advances, 12(48). https://doi.org/10.1126/sciadv.aeh9321", "why": "誰と誰が友人かについての人の誤りは、認知の限界ではなく、ネットワークの将来を見越す予測の表れであることを示した。196人の実際の社会ネットワークを1年間追跡すると、その時点では誤りだった判断が、6か月後までに生じる関係や消える関係を当てていた。誤りは関係の形成を偶然の約3倍、消滅を1.2倍超の水準で予測した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "誰と誰が友人かについての人の思い違いは単なる誤りではなく、人間関係が将来どう変わるかを見越した予測になっていることを示した。", "p3": "実在の社会ネットワーク（196人）を1年間追跡し、関係の形成と解消を記録した。各自が思い描くネットワークの誤りが、その後の変化と対応するかを調べ、計算モデルでどんな心の表現が予測に使われているかを分析した（抄録）。", "p5": "その時点では誤っていた判断が、6か月後までにどの関係が生まれ、消えるかを当てていた。誤りは関係の形成を偶然の水準のほぼ3倍、解消を1.2倍超で予測した。変化をよく予測できる人は、最初の位置にもよるが、時間とともにネットワークの中心に近づいた（抄録）。", "fun": "「あの2人は友達だ」と思っていたら、実は違った。そんな勘違いは誰にでもある。ところがこの研究によると、その勘違いは数か月後に本当になっていることが多かった。人は今の人間関係をそのまま覚えているのではなく、「この2人はそのうち親しくなりそうだ」という先読みを交えて覚えているらしい。間違いに見えたものが、実は予測だったという逆転が面白い。", "unverified": "予測の精度の統計的な詳細、対象の集団の性質は抄録になく未確認。"}}, {"id": "jn18", "rank": 18, "field": "地球科学", "headline": "山火事が頻繁すぎると土石流はむしろ小さくなる", "title": "Historical evidence that wildfire frequency modulates debris-flow hazards through sediment-supply limitation", "url": "https://doi.org/10.1126/sciadv.aei6617", "authors": "Emily C. Geyman ほか", "venue": "Science Advances", "date": "2026-11-25", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Geyman, E. C., & Lamb, M. P. (2026). Historical evidence that wildfire frequency modulates debris-flow hazards through sediment-supply limitation. Science Advances, 12(48). https://doi.org/10.1126/sciadv.aei6617", "why": "南カリフォルニアの砂防施設の長期の堆積記録から、山火事の頻度と火災後の侵食の関係を調べた。急な流域では火災後3年間の侵食が平常の約17倍に達するが、火災がこの1世紀に典型的だった約30年の間隔より頻繁に起きると、土石流の量は減っていた。運ばれる土砂の供給が追いつかなくなるためと解釈される。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "山火事のあとの土石流は、火事が頻繁に起きすぎるとかえって小さくなりうることを、南カリフォルニアの長期の堆積記録から示した。", "p3": "土石流を受け止める施設（debris basin）の長期の記録を分析し、山火事の頻度が火災後の侵食の大きさにどう影響するかを調べた。流域の傾きと土壌の状態で、侵食の型を2つに分けた（抄録）。", "p5": "急な流域では、火災後3年間の侵食が平常の約17倍に達した。緩やかで土壌に覆われた流域では約1.5倍にとどまった。急な流域では、火災がこの1世紀に典型的だった約30年の間隔より頻繁に起きると、土石流の量が減っていた（抄録）。", "fun": "山火事のあとに大雨が降ると、焼けた斜面から土砂が流れ出す。火事が増えれば土石流も増えそうだが、記録を調べると、火事が頻繁すぎる場所では土石流はむしろ小さくなっていた。流れ出る土砂の供給に限りがあるためだと考えられる。たまる前に次の火事が来ても、流れ出るものが少ないのだ。「材料の不足」という見方が面白い。", "unverified": "分析した施設の数と期間、統計的な確かさは抄録になく未確認。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "少数派の性で入職した新人は負の出来事が増えていく", "title": "Breaking Gender Norms: A Dynamic Perspective on Entering Gender-Atypical Occupations", "url": "https://doi.org/10.1177/01492063261506258", "authors": "Sophie Schellhammer ほか", "venue": "Journal of Management", "date": "2026-11-25", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Schellhammer, S., & Kunze, F. (2026). Breaking Gender Norms: A Dynamic Perspective on Entering Gender-Atypical Occupations. Journal of Management. https://doi.org/10.1177/01492063261506258", "why": "88職種の新人673人を入職後12週間にわたって繰り返し調べた。自分の性が少数派である職種に入った新人は、否定的な職場の出来事を経験する頻度が時間とともに増え、その傾向は女性の多い職種に入った男性で、男性の多い職種に入った女性より強かった。出来事の増え方が急なほど、仕事の習熟が低く離職意向が高い。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "自分の性が少数派である職種に入った新人は、否定的な出来事の経験が入職後に時間とともに増えていき、それが仕事の習熟の低さと離職意向の高さにつながることを示した。", "p3": "88職種の新人673人を12週間にわたり繰り返し調査した縦断的な現場研究。役割の一致の理論と、職場の出来事を時間の流れで捉える視点を組み合わせた（抄録）。", "p5": "性が少数派の職種の新人は、否定的な職場の出来事が有意に増えていき、その増え方は女性の多い職種の男性で、男性の多い職種の女性より有意に強かった。出来事の増え方が急なほど、仕事の習熟が低く、離職意向が高かった（抄録）。", "fun": "男性の多い職種に入った女性、女性の多い職種に入った男性は、入ってすぐに辞めてしまうことが多い。この研究は入職から12週間、新人たちの経験を繰り返し追った。否定的な出来事は、時間とともに増えていった。しかもその傾向は、女性の多い職種に入った男性でより強かった。最初の数週間の経験の積み重ねが、その後を左右することが見えてくる。", "unverified": "効果の大きさの数値、対象の国と業種の内訳は抄録になく未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "冷房のない刑務所では夏に新人刑務官の離職が増える", "title": "Excessive Heat and Correctional Officer Turnover: Evidence From Texas", "url": "https://doi.org/10.1111/puar.70233", "authors": "Benjamin Goehring ほか", "venue": "Public Administration Review", "date": "2026-11-25", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "apa": "Goehring, B., & Harris, J. (2026). Excessive Heat and Correctional Officer Turnover: Evidence From Texas. Public Administration Review. https://doi.org/10.1111/puar.70233", "why": "テキサス州の刑務所68か所・約6万人の職員の2010〜2023年の人事記録で、冷房のない職場で夏に働くことが離職に与える影響を調べた。経験の浅い現場職員では、冷房の有無による離職確率の差が最も暑い月に0.33ポイント大きく、基準の離職率の約12%に当たる。冷房の設置は、人手不足への対策として賃上げと同程度の費用だと試算する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "冷房のない刑務所で暑い季節に働くことが、経験の浅い刑務官の離職を増やすことを、テキサス州の人事記録から示した。", "p3": "テキサス州刑事司法局の約60,000人の職員の、68の刑務所・2010〜2023年の人事記録を使い、冷房のある刑務所とない刑務所で、最も暑い月と最も涼しい月の離職の確率の差を比べた（抄録）。", "p5": "コロナ禍の前の、経験の最も浅い現場職員では、冷房の有無による離職確率の差が、最も暑い月に最も涼しい月より平均0.33ポイント大きく、基準の離職率に対して約12%の変化に当たる。冷房の設置は、人手不足への対策として賃上げと同程度の費用だと試算する（抄録）。", "fun": "職場が暑すぎると人は辞めるのか。当たり前に聞こえるが、暑さ以外の事情と区別して確かめるのは難しい。この研究は、冷房のある刑務所とない刑務所があることを利用し、暑い月と涼しい月の離職を比べた。冷房のない所では、暑い月に経験の浅い職員の離職が増えていた。賃上げで引き止めるのと、冷房を入れるのとで費用が同じくらいだという試算も面白い。", "unverified": "推定の詳細（統制変数、標準誤差）、費用の試算の前提は抄録になく未確認。"}}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "説明のつかない株価変動が投資家の情報収集を呼ぶ", "title": "Rational Information Acquisition Screens", "url": "https://doi.org/10.2308/tar-2024-0799", "authors": "Paul E. Fischer ほか", "venue": "The Accounting Review", "date": "2026-11-24", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Fischer, P. E., Heinle, M. S., Kim, J. M., & Zhu, C. (2026). Rational Information Acquisition Screens. The Accounting Review, 1–29. https://doi.org/10.2308/tar-2024-0799", "why": "投資家は私的情報を集める前に、その見返りが分からない。過去の株価を含む公開情報を、情報収集の見返りを見積もるふるいとして使うというモデルを作り、説明のつかない価格変動が大きいほど私的情報の収集、将来の価格変動、取引量が増えると予測した。EDGARとBloombergでの情報の取得を測った細かいデータが予測を支持する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "投資家は、説明のつかない株価の動きを手がかりに「この会社を調べる価値があるか」を見積もり、情報収集の労力を振り分けているというモデルを作り、データで確かめた。", "p3": "投資家は私的情報を集める前には、その見返りが分からないと仮定する。過去の価格を含む公開情報を、見返りを見積もる「ふるい」として使い、限られた情報処理の能力を企業の間に配分するモデルを作った。EDGARとBloombergでの情報の取得を測るデータで検証した（抄録）。", "p5": "モデルは、説明のつかない価格変動が大きいほど、私的情報の収集、将来の価格の変動、将来の期待取引量が増えると予測し、データはこれらの予測を支持した（抄録）。", "fun": "株価が理由の分からない動きをしたとき、投資家はどうするか。この研究の考えでは、それは「この会社には調べる価値のあることが起きているかもしれない」という合図になる。投資家の情報を処理する力には限りがあるので、全部の会社は調べられない。そこで不可解な値動きをふるいにして、調べる先を選ぶ。データでも、そうした値動きのあとに情報の取得が増えていた。", "unverified": "効果の大きさ、データの期間と銘柄数は抄録になく未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "価値観が似ると集団の規範を守りやすくなる", "title": "Determinants of Norm Compliance: Moral Similarity and Group Identification", "url": "https://doi.org/10.1287/mnsc.2024.08000", "authors": "Alexander Schneeberger ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Schneeberger, A., & Krupka, E. (2026). Determinants of Norm Compliance: Moral Similarity and Group Identification. Management Science. https://doi.org/10.1287/mnsc.2024.08000", "why": "個人と集団の成員の価値観の類似を実験で操作し、集団への同一視と規則の順守を測った。進歩主義についての道徳的な類似は集団への同一視を高め、同一視は集団の規則の順守を高めうる。条件間で社会規範そのものは変わらない設計のため、行動の変化は規範への感度の変化によると解釈できる。ただし、この関係は崩れることもある。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "価値観が集団の人たちと似ていると、その集団への一体感が高まり、集団の決まりを守りやすくなるという因果の道筋を実験で確かめた。", "p3": "個人の価値観と集団の成員の価値観の類似・非類似を実験で操作し、集団への同一視と規則の順守を測った。条件の間で社会規範そのものは変わらない設計になっており、そのことをデータでも確かめた（抄録）。", "p5": "進歩主義についての道徳的な類似は集団への同一視を高め、同一視は集団の規則の順守を高めうる。ただし、この関係は崩れることもあると示唆された。行動の変化は、規範の変化ではなく、集団の規範への感度の高まりによると解釈できる（抄録）。", "fun": "人はなぜ集団の決まりを守るのか。「自分はこの集団の一員だ」と感じると、その集団の決まりを守るようになる、という考え方がある。この実験は、自分と価値観が似た人たちの集団だと、その一体感と決まりの順守が高まりうることを示した。決まりの内容は同じなのに、守り方が変わる。組織が成員と価値観を合わせようとする理由の裏づけと、その注意点を示している。", "unverified": "参加者数、効果の大きさ、関係が崩れる条件の詳細は抄録になく未確認。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "価格弾力性を1分以内に更新して即時の価格決定へ", "title": "Scalable Just-in-Time Price Elasticity Estimation", "url": "https://doi.org/10.1287/mnsc.2024.04791", "authors": "Jingbo Wang ほか", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Wang, J., & Huang, Y. (2026). Scalable Just-in-Time Price Elasticity Estimation. Management Science. https://doi.org/10.1287/mnsc.2024.04791", "why": "価格の内生性を補正しつつ、点ごとの価格弾力性をノンパラメトリックに推定する方法を示した。制御関数で因果的な弾力性の識別を一連の予測課題に分解し、閉じた形をもつバギングした最近傍法で実装する。ニューヨーク市の配車市場に適用し、時間と場所による弾力性の違いを捉え、市全体の推定を1分以内に更新した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "価格を変えたら需要がどれだけ変わるか（価格弾力性）を、場所や時間ごとに、しかも実時間の価格決定に間に合う速さで推定し直せる方法を示した。", "p3": "価格の内生性を、ノンパラメトリックな制御関数で補正する。因果的な弾力性の識別を、順に解ける予測の課題に分解し、閉じた形で表せるバギングした最近傍法で実装する。推定量の一様一致性を示した（抄録）。", "p5": "モンテカルロ実験で、多様なデータ生成過程のもとで局所的な弾力性を頑健に復元した。ニューヨーク市の配車市場に適用すると、弾力性に場所と時間による大きな違いがあり、市全体の推定を1分未満で更新できた（抄録）。", "fun": "配車サービスの料金は、状況に応じて刻々と変わる。値段を上げたら客がどれだけ減るかは、場所や時間で違うはずだ。しかも値段は需要を見て決められているので、単純に比べると見誤る。この研究は、その落とし穴を避けつつ、場所と時間ごとの「値段への敏感さ」を1分足らずで計算し直す方法を作った。理論的な正しさと速さの両立が面白い。", "unverified": "弾力性の推定値、データの規模と期間は抄録になく未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "大規模な資産の共分散行列を要素ごとに学習する", "title": "Machine Learning Vast Dynamic Conditional Covariance Matrices: The Spirit of “Divide and Conquer”", "url": "https://doi.org/10.1287/mnsc.2024.08930", "authors": "Zhoufan Zhu ほか", "venue": "Management Science", "date": "2026-11-25", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Zhu, Z., & Zhu, K. (2026). Machine Learning Vast Dynamic Conditional Covariance Matrices: The Spirit of “Divide and Conquer”. Management Science. https://doi.org/10.1287/mnsc.2024.08930", "why": "多数の資産の動的な条件つき共分散行列を、分割統治の考え方で推定する方法を提案した。資産の特徴からグラフに基づく深層学習で収益の条件つき分位点を学び、そこから分散と共分散を要素ごとに求め、射影で半正定値にする。中国の株式市場で、既存の方法より良い接点ポートフォリオが得られたと報告する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "多数の株式の間の値動きの連動（条件つき共分散行列）が時間とともに変わるのを、要素ごとに分けて学習する方法で推定し、ポートフォリオの成績を改善した。", "p3": "資産の多数の特徴から、グラフにもとづく深層学習のネットワーク（自己グループ化オートエンコーダ）で収益率の条件つき分位点を学ぶ。その分位点から分散と共分散を要素ごとに求め、最後に射影で半正定値の行列にする（抄録）。", "p5": "中国の株式市場の実証分析で、提案法は競合する方法よりずっと良い接点ポートフォリオを作れたと報告する。銘柄の間の分散と分位点のつながりを表す動的なグラフも得られ、システミックリスクの解釈に使える（抄録）。", "fun": "たくさんの株に分けて投資するとき大事なのは、どの株とどの株が一緒に上がり下がりするかだ。ところが株の数が増えると、組み合わせの数は急に膨らみ、限られたデータから全部を正確に測るのは難しい。この研究は、巨大な表を一度に推定するのをやめ、要素を1つずつ学習してから全体を整える「分割して統治する」やり方をとった。", "unverified": "成績の改善の数値、対象期間と銘柄数は抄録になく未確認。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "環境の変化が急か緩やかかで起業家の期待が変わる", "title": "External Enablement Across Types of Environmental Change: Experimental Evidence on Onset Variance Effects", "url": "https://doi.org/10.1177/10422587261496319", "authors": "Jiyoung Kim ほか", "venue": "Entrepreneurship Theory and Practice", "date": "2026-11-26", "sjr": 5.67, "citescore": 21.9, "citescore_year": "2025", "apa": "Kim, J., Davidsson, P., & Grégoire, D. A. (2026). External Enablement Across Types of Environmental Change: Experimental Evidence on Onset Variance Effects. Entrepreneurship Theory and Practice. https://doi.org/10.1177/10422587261496319", "why": "マクロ環境の変化が起業を後押しするという枠組みについて、被験者間実験と発話思考法を組み合わせて検証した。変化が徐々に起きるか急激に起きるかという違いが、後押しへの期待に影響し、その影響は変化の種類をまたいで同様だった。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "マクロ環境の変化が、徐々に起きるか急に起きるかによって、それが起業の後押しになるという期待が変わることを実験で示した。", "p3": "マクロ環境の変化が起業を後押しするという「外的な後押しの枠組み」の構成概念の関係を調べるため、被験者間の実験と、考えを声に出してもらう発話思考法を組み合わせた（抄録）。", "p5": "変化の始まり方が緩やかか急激かという違いは、後押しへの期待に影響し、その影響は変化の種類が違っても同じように現れた。枠組みが明示していなかった、環境の変化と行為者の関係も見いだした（抄録）。", "fun": "世の中の大きな変化は、起業の機会になりうる。では、その変化が少しずつ進む場合と、急にやってくる場合とで、受け止め方は違うのだろうか。この研究は、変化の始まり方を「徐々に」「急に」と変えて示す実験で、その違いが期待を左右することを確かめた。変化の中身だけでなく、起こり方が人の見通しを動かす点が面白い。", "unverified": "参加者数、期待がどちらの場合に高いかの向きと大きさは抄録になく未確認。"}}, {"id": "jn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "旧技術の取引網での仲介がEV参入を助ける", "title": "Embedded in Two Worlds: How Incumbents’ Brokerage Affects Adaptation When Old and New Supply Networks Coexist", "url": "https://doi.org/10.1287/orsc.2024.18580", "authors": "Jongyoun Baek ほか", "venue": "Organization Science", "date": "2026-11-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "apa": "Baek, J., Shipilov, A. V., & Furr, N. R. (2026). Embedded in Two Worlds: How Incumbents’ Brokerage Affects Adaptation When Old and New Supply Networks Coexist. Organization Science. https://doi.org/10.1287/orsc.2024.18580", "why": "既存企業が新技術の市場に入るとき、旧技術と新技術の2つの供給網に同時に埋め込まれる。2012〜2022年の米国の自動車産業で、旧技術の供給網で仲介の位置にある企業ほど、電気自動車のモデル数と成績で見た新技術への参入に成功していた。意外にも、旧技術の網での仲介のほうが新技術の網での仲介より効果が強かった。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "旧技術の取引のネットワークで仲介役の位置にいた既存の自動車メーカーほど、電気自動車という新しい技術の市場への参入に成功していたことを示した。", "p3": "2012〜2022年の米国の自動車産業を対象に、既存企業が旧技術と新技術の2つの買い手・供給者のネットワークに同時に埋め込まれる状況を分析した。仲介の位置と、新技術のモデルの数と成績との関連を調べた（抄録）。", "p5": "旧技術のネットワークでの仲介は、新技術への参入の成功と正の関連があった。意外にも、旧技術のネットワークでの仲介のほうが、新技術のネットワークでの仲介より、電気自動車の市場への参入に強い正の効果を持っていた（抄録）。", "fun": "従来の車を作ってきた会社が電気自動車に乗り出すとき、頼りになるのは新しい技術の供給者とのつながりだと思うだろう。ところがこの研究では、旧来の供給者の間で「橋渡し役」をしてきたことのほうが、成功と強く結びついていた。別々の相手を組み合わせる力は、相手が新しくなっても通用するらしい。古いつながりが新しい挑戦を支えるという意外な結果だ。", "unverified": "効果の大きさ、対象企業の数、成績の指標の定義は抄録になく未確認。"}}, {"id": "jn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "仕事での近しさが育つ条件を理論化", "title": "Interaction zones theory: How social proximity emerges and shapes thriving at work", "url": "https://doi.org/10.1177/00187267261506540", "authors": "Tom L. Junker ほか", "venue": "Human Relations", "date": "2026-11-25", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Junker, T. L., & Parker, S. K. (2026). Interaction zones theory: How social proximity emerges and shapes thriving at work. Human Relations. https://doi.org/10.1177/00187267261506540", "why": "仕事のデジタル化が人どうしの近しさを損なう懸念を背景に、職場のやり取りから親密さが生まれる仕組みを説明する理論を提案した。関係上の重みと、やり取りのしやすさという2つの次元の交点を「社会的近接の領域」と呼び、そこでの共有された繰り返しのやり取りが個人とチームの活力につながると論じる。文献の検討に基づく理論論文である。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "職場のやり取りから人どうしの「近しさ」が生まれる条件を説明する理論を提案し、それが個人とチームの活力につながると論じた。", "p3": "社会的な近接についての文献を検討したうえで理論を組み立てた。関係上の重み（relational stakes）と、やり取りのしやすさ（interactional ease）という2つの次元を置き、その交点を「社会的近接の領域」と呼ぶ。感情の円環モデルを土台にした枠組みである（抄録）。", "p5": "この領域での共有された繰り返しのやり取りが、個人とチームの活力に寄与すると提案する。活力には、学びを生むだけの手応えと、活気を保てるだけの気楽さの両方が要るとの前提に立つ。職務やチームの設計でこの領域を意図的に作れるとも論じる（抄録）。", "fun": "同僚と親しくなるのは、どんなやり取りを重ねたときだろう。この理論は、2つの条件がそろったときだと考える。1つは、そのやり取りが関係にとって重みをもつこと。もう1つは、気楽にやり取りできること。両方が重なるところに近しさが育つ。仕事のデジタル化が進む中で、人と人のやり取りをどう設計するかの手がかりになる。", "unverified": "理論の提案であり、実証的な検証はこの論文の範囲では行われていない（研究課題の提示にとどまる）。"}}, {"id": "jn28", "rank": 28, "field": "オペレーションズ・リサーチ", "headline": "広告の予算調整の均衡は入札方式で解きやすさが違う", "title": "Throttling Equilibria in Auction Markets", "url": "https://doi.org/10.1287/opre.2023.0008", "authors": "Xi Chen ほか", "venue": "Operations Research", "date": "2026-11-26", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Chen, X., Kroer, C., & Kumar, R. (2026). Throttling Equilibria in Auction Markets. Operations Research. https://doi.org/10.1287/opre.2023.0008", "why": "ネット広告の競売で、広告主の参加確率を調整して予算を均等に使わせる方式を、全員が同時に使う場合の均衡を分析した。第一価格の競売では均衡が一意で、分散的な調整で効率よく計算できる。第二価格では均衡は存在するが、近似的な均衡を求めることもPPAD完全で、収入を最大にする均衡を見つけるのはNP困難である。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ネット広告の競売で、全ての広告主が予算をならして使うための「参加確率の調整（スロットリング）」を同時に使うときの均衡を調べ、競売の方式によって計算のしやすさが大きく違うことを示した。", "p3": "プラットフォームが広告主の参加確率を調整して予算を多数の競売にならして使わせる方式について、第一価格と第二価格の両方の競売で、均衡の構造と計算の性質を分析した。もう1つの代表的な方式である乗法的ペーシングとも比べた（抄録）。", "p5": "第一価格では、一意の均衡が常に存在し、分散的な調整の動学で効率よく計算できる。第二価格では、均衡は存在するが、近似的な均衡を求めることもPPAD完全で、複数の均衡がありえ、収入を最大にする均衡を見つけるのはNP困難である。流動的厚生の無秩序の代償はどちらも高々2である（抄録）。", "fun": "ネットの広告枠は競売で売られている。広告主は予算を多くの競売にならして使いたいので、参加する確率を調整する。みんながそうしたら、落ち着く先（均衡）はあるのか、計算で求められるのか。この論文は、競売のルールが第一価格か第二価格かで、答えの求めやすさがまったく違うことを証明した。似た仕組みでも計算の難しさが分かれるのが面白い。", "unverified": "証明の詳細、乗法的ペーシングとの比較の具体的な結果は抄録の範囲では未確認。"}}, {"id": "jn29", "rank": 29, "field": "オペレーションズ・リサーチ", "headline": "処理能力に上限のある資源への逐次割り当て", "title": "Online Allocation of Throughput-Constrained Resources Using Proxy Assignments", "url": "https://doi.org/10.1287/msom.2025.0811", "authors": "Chamsi Hssaine ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-26", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Hssaine, C., Topaloglu, H., & van Ryzin, G. (2026). Online Allocation of Throughput-Constrained Resources Using Proxy Assignments. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2025.0811", "why": "到着する仕事を複数の資源に順に割り当てる問題で、資源が予算ではなく時間とともに変わる処理能力の目標に縛られる場合を扱った。従来の予算制約向けの算法を素直に拡張すると大きく失敗することを示し、現在の到着を使って割り当てを模擬する主双対の算法を提案する。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "次々に来る仕事を複数の資源に割り振る問題で、資源の制約が予算ではなく時間ごとの処理能力である場合に、従来の方法が大きく失敗することを示し、最適な水準の性能をもつ新しい算法を作った。", "p3": "割り当ての費用に加えて、各資源の時間とともに変わる目標の割り当て率からずれることへの罰則を考える。現在の到着を使って将来の到着の効果を模擬する「代理割り当て」の主双対アルゴリズムを提案した（抄録）。", "p5": "到着する仕事の費用が同じ分布から独立に引かれる場合、提案法は最適なO(√T)のリグレットの上界を達成することを証明した。合成データと、小売の出荷業務の実データでの数値実験で実用上の性能を示した（抄録）。", "fun": "荷物を、出発時刻の決まったトラックに順に振り分ける場面を考えよう。トラックは全体の予算ではなく、時間ごとに処理できる量で縛られる。この違いは小さく見えるが、従来の優れた割り振り方を素直に当てはめると大きく失敗することが分かった。この研究は、今来ている仕事を手がかりに、これから来る仕事の影響を模擬して振り分ける方法を作った。", "unverified": "数値実験の具体的な結果、実データの規模は抄録になく未確認。"}}, {"id": "jn30", "rank": 30, "field": "オペレーションズ・リサーチ", "headline": "寄付の税優遇は中途半端だと消費者の得を減らす", "title": "Tax-induced Corporate In-kind Donations: Equilibrium Analysis and Policy Design", "url": "https://doi.org/10.1287/msom.2025.0617", "authors": "Lusheng Shao ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-26", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Shao, L., Zhang, N., Niu, B., & Heese, H. S. (2026). Tax-induced Corporate In-kind Donations: Equilibrium Analysis and Policy Design. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2025.0617", "why": "食品企業の現物寄付を促す税制優遇が、企業の生産と寄付、利益、消費者余剰に与える影響を解析モデルで調べた。優遇率がしきい値を超えると企業は寄付を始める。企業は優遇が手厚いほど得をするが、消費者余剰は優遇率に対してU字型で、中程度の優遇は消費者余剰を下げうる。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "食品企業の現物寄付を促す税の優遇が、企業・消費者・社会全体にどう影響するかを理論モデルで調べ、中途半端な優遇は消費者にとってかえって損になりうることを示した。", "p3": "生産能力に制約のある企業の、生産と現物寄付の決定を解析モデルで表した。評価額の異なる消費者は、企業から製品を買うか、慈善団体から寄付された製品を得ようとするかを選ぶ（抄録）。", "p5": "企業が寄付を始める優遇率のしきい値がある。企業は優遇が手厚いほど得をするが、消費者余剰は優遇率に対してU字型で、中程度の優遇は優遇なしより消費者余剰を下げうる。寄付への税の優遇が望ましいのは、政府が社会厚生に十分な重みを置くときに限られる（抄録）。", "fun": "食品を寄付した企業の税を軽くすれば、食べ物に困っている人に届き、みんなが得をしそうだ。ところがこの理論では、優遇が中くらいのとき、消費者の得は優遇がない場合より減ることがあった。善意を後押しする政策でも、ちょうど悪い加減があるという、政策づくりの難しさが見える。寄付を促す税制が消費者に思わぬ悪影響を及ぼしうる、という警告だ。", "unverified": "U字型になる仕組みの詳細、モデルの仮定は抄録の範囲では未確認。理論モデルの結果で、実データでの検証は扱われていない。"}}, {"id": "jn31", "rank": 31, "field": "オペレーションズ・リサーチ", "headline": "LLMが書いた文章をマハラノビス距離で見分ける", "title": "Efficient and Flexible Large Language Model–Generated Content Detection", "url": "https://doi.org/10.1287/ijoc.2024.0877", "authors": "Wan Tian ほか", "venue": "INFORMS Journal on Computing", "date": "2026-11-24", "sjr": 1.974, "citescore": 6.6, "citescore_year": "2025", "apa": "Tian, W., Qin, Z., & Peng, Y. (2026). Efficient and Flexible Large Language Model–Generated Content Detection. INFORMS Journal on Computing. https://doi.org/10.1287/ijoc.2024.0877", "why": "LLMが生成した文章の検出に、マハラノビス距離に基づく信頼度の得点を判別の特徴として使う方法を提案した。複数の分割に対応する精度行列を正則化つきで同時に推定し、推定量のスパース性と一致性、検出問題の超過リスクの最適な上界を示す。人とChatGPTの文章を比べた公開コーパスで有効性を確かめた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "LLMが書いた文章かどうかを、マハラノビス距離にもとづく信頼度の得点を特徴として判別する、効率的で柔軟な検出法を提案した。", "p3": "得点の計算に必要な、複数の分割に対応する精度行列を同時に推定する。正則化を使った同時推定量と、計算可能な最適化の算法を与え、推定量のスパース性と一致性を示した。オフセット・ラデマッハ複雑度にもとづき、検出問題の超過リスクの最適な上界も導いた（抄録）。", "p5": "人とChatGPTの文章を比べた公開コーパス（Human ChatGPT Comparison Corpus）で、提案法の優位性を確かめたと報告する。抄録に数値は示されていない（抄録）。", "fun": "この文章は人が書いたのか、AIが書いたのか。この研究は、見分けるために統計学でよく知られた距離の考え方を使う。データのばらつき方を考慮した距離にもとづく得点を、判別の決め手にするのだ。検出の誤りについて理論的な上界まで示している点が特徴で、経験的な工夫に理屈の裏づけを与えようとしている。", "unverified": "検出の正解率などの数値、比較した他の方法は抄録になく未確認。"}}, {"id": "jn32", "rank": 32, "field": "心理学・認知科学", "headline": "気分の揺れを短い雑音と長い変動に分けて測る", "title": "Evaluating the Ecological Validity and Mechanism of a Generative Model-Based Decomposition of Affective Variability", "url": "https://doi.org/10.1177/09567976261496284", "authors": "Ryan Yan Yan ほか", "venue": "Psychological Science", "date": "2026-11-24", "sjr": 2.309, "citescore": 9.9, "citescore_year": "2025", "apa": "Yan, R. Y., Halahakoon, D. C., & Browning, M. (2026). Evaluating the Ecological Validity and Mechanism of a Generative Model-Based Decomposition of Affective Variability. Psychological Science. https://doi.org/10.1177/09567976261496284", "why": "感情の変動を、短命な「雑音」と長く続く「変動性」に、ベイズフィルタで分解した。強化学習の課題と日常の経験サンプリングを332人で組み合わせると、課題での雑音は直近の結果に、変動性はより前の結果に左右された。課題で測った2つの成分は、日常のデータの対応する成分とそれぞれ選択的に対応した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "気分の揺れやすさを、すぐ消える「雑音」と長く続く「変動」の2つに分けて測る方法が、実験室の課題だけでなく日常生活の気分の動きにも当てはまることを示した。", "p3": "Prolificで集めた成人332人に、強化学習の課題と、日常での経験サンプリングの両方を行ってもらった。ベイズフィルタを使い、感情の変動を短命な雑音と長期的な変動性に分解した（抄録）。", "p5": "課題では、雑音は直近の結果に、変動性はもっと前の結果に左右された。課題で測った雑音と変動性は、日常のデータの対応する成分にそれぞれ選択的に対応し、従来の指標ではそのような対応は見られなかった（抄録）。", "fun": "気分が変わりやすい、と一口に言っても、一瞬揺れてすぐ戻る揺れと、もっと長く続く気分の動きは違うかもしれない。この研究は、課題での反応からこの2つを分けて測り、それが日常で繰り返し記録した実際の気分の揺れ方とも対応することを確かめた。実験室の課題が、ふだんの心の動きを映しうるという点が面白い。", "unverified": "対応の強さの数値、課題の内容の詳細は抄録になく未確認。"}}, {"id": "jn33", "rank": 33, "field": "心理学・認知科学", "headline": "映画の内容からファンの性格が予測できる", "title": "Movies’ Content Features Predict the Personalities of Their Fans", "url": "https://doi.org/10.1177/09567976261498023", "authors": "Gideon Nave ほか", "venue": "Psychological Science", "date": "2026-11-24", "sjr": 2.309, "citescore": 9.9, "citescore_year": "2025", "apa": "Nave, G., Rentfrow, P. J., & Bhatia, S. (2026). Movies’ Content Features Predict the Personalities of Their Fans. Psychological Science. https://doi.org/10.1177/09567976261498023", "why": "映画に「いいね」を付けたソーシャルメディア利用者の集計されたビッグファイブ性格と、映画の特徴・内容を結びつけた。キーワードで捉えた内容は、ジャンルや人口統計、質や人気を超えて観客の性格を予測した。1,018人の実験で、この予測が新しい映画と参加者についての選択と評価に関係することも確かめた。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "映画の内容から、その映画を好む人たちの性格の傾向を予測できることを、ソーシャルメディアの大規模なデータと実験で示した。", "p3": "映画に「いいね」を付けたソーシャルメディア利用者の、集計したビッグファイブ性格と、映画の特徴・内容（テキストのキーワードで表す）を結びつけた。1,018人の成人のオンライン実験で、予測が実際の選択と評価に関係するかを調べた（抄録）。", "p5": "キーワードで捉えた内容は、ジャンル、人口統計、質や人気といった属性を超えて、観客の集計された性格を予測した。実験でも、内容にもとづく性格の予測は、新しい映画と参加者についての選択と評価に関係していた（抄録）。", "fun": "好きな映画が分かれば、その人の性格が少し分かるかもしれない。この研究は、ある映画を好きな人たちの性格の平均像が、その映画の中身から予測できることを示した。しかもジャンル分けだけでなく、内容を表すキーワードが効いていた。人は自分の考え方や感じ方に響く作品を好む、という直感を大規模なデータで確かめた研究だ。", "unverified": "予測の精度の数値、データの規模（利用者数・映画数）は抄録になく未確認。"}}, {"id": "jn34", "rank": 34, "field": "工学", "headline": "き裂に平行な引張が編物複合材の破壊を変える", "title": "Gap test–inspired crack-parallel tension tests of fracture of soft-knitted polymer composites simulated by microplane triads", "url": "https://doi.org/10.1073/pnas.2620941123", "authors": "Xiaoxiao Ding ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-24", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Ding, X., Niu, Y., Zhao, Y., Chen, H., Bae, C., Nguyen, A. T., Espinosa, H. D., Bažant, Z. P., & Cao, J. (2026). Gap test–inspired crack-parallel tension tests of fracture of soft-knitted polymer composites simulated by microplane triads. Proceedings of the National Academy of Sciences, 123(48). https://doi.org/10.1073/pnas.2620941123", "why": "ウェアラブルやソフトロボットに使われる編物の柔らかい複合材で、き裂に平行な応力が開口型の破壊に与える影響を測る試験法を、ギャップ試験にならって導入した。糸のループの特徴点に配置した微小面の三つ組で、非線形の挙動と進行する損傷を表す連続体モデルを作り、実験で検証した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "編み物の構造をもつ柔らかい複合材で、き裂に平行にかかる引張が破壊のしかたをどう変えるかを測る試験法と、それを再現する計算モデルを示した。", "p3": "ギャップ試験にならい、中央に切り欠きのある帯状の試験片を引っ張る開口型の破壊試験で、き裂に平行な引張が最大荷重と荷重・たわみ曲線に与える影響を測る。編み目の繰り返し単位の中の糸のループの特徴点に、糸に接する向きの微小面の三つ組を配置した連続体モデルを作った（抄録）。", "p5": "モデルは編物複合材の非線形の挙動と進行する損傷を捉え、実験で検証された。実験で較正した計算モデルで、き裂に平行な引張が耐荷力と有効な破壊エネルギーをどう変えるかを予測できる（抄録）。", "fun": "編まれた構造をもつ柔らかい複合材は、身につける機器や柔らかいロボットに使われる。こうした材料に裂け目があるとき、裂け目を開く方向の力だけでなく、裂け目に平行な方向の力も、壊れ方を変える。この研究はそれを測る試験を考え、編み目の糸の向きを計算に取り込んだモデルで再現した。見落とされがちな方向の力に光を当てている。", "unverified": "き裂に平行な引張で耐荷力が上がるのか下がるのかの向きと大きさ、試験片の材料は抄録になく未確認。"}}, {"id": "jn35", "rank": 35, "field": "工学", "headline": "ラム波の損傷検知を別の構造へ転移学習で広げる", "title": "Cross‐Structure Damage Detection Method Using Lamb Waves With Semisupervised Deep Transfer Learning", "url": "https://doi.org/10.1155/stc/7164544", "authors": "Li Wang ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-25", "citescore": 10.3, "citescore_year": "2025", "apa": "Wang, L., Wang, X., An, Y., Liu, G., & Yang, Y. (2026). Cross‐Structure Damage Detection Method Using Lamb Waves With Semisupervised Deep Transfer Learning. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/7164544", "why": "ラム波による金属構造の疲労き裂の検知で、深層学習のモデルが別の試験体や構造に一般化しにくい問題に対し、敵対的な領域適応と半教師ありの転移学習を組み合わせた。元の構造のラベルつきデータと、対象の構造のラベルなしデータ・健全データだけを使い、構造に依存しない損傷の特徴を学ぶ。構造をまたぐ疲労試験で検証した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ラム波を使った金属の疲労き裂の検知で、ある構造で学習したモデルを、形の違う別の構造にも使えるようにする学習法を示した。", "p3": "元の構造のラベルつきデータと対象の構造のラベルなしデータで敵対的な領域適応を行い、さらに対象の構造の健全時のラベルつきデータを使う半教師ありの転移学習を組み合わせて、損傷に敏感で構造によらない特徴を学ばせる（抄録）。", "p5": "構造をまたぐ疲労試験で、中央に穴のある構造と重ね継手の構造の両方について、疲労き裂の検知の信頼性と一般化を確かめた。他の方法との比較で、分類の能力と頑健性が優れていたと報告する。抄録に数値は示されていない（抄録）。", "fun": "金属の構造にできる疲労のひびを、板を伝わる波で見つける方法がある。困るのは、ある構造で訓練したモデルが、別の構造ではうまく働かないことだ。構造ごとにひびの入ったデータを集め直すのは大変なので、この研究は、新しい構造についてはラベルのないデータと健全な状態のデータだけを使って、モデルを別の形に適応させる方法を作った。", "unverified": "検知の正解率などの数値、比較対象の方法は抄録になく未確認。"}}, {"id": "jn36", "rank": 36, "field": "工学", "headline": "航空エンジンの異常を個体差に適応して検知", "title": "MSTGAT-VQ: An unsupervised anomaly detection method for aeroengines based on spatiotemporal feature discretization", "url": "https://doi.org/10.1177/14759217261504002", "authors": "Zeyu Pei ほか", "venue": "Structural Health Monitoring", "date": "2026-11-25", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Pei, Z., Zhao, Y., Wang, H., & Wu, Y. (2026). MSTGAT-VQ: An unsupervised anomaly detection method for aeroengines based on spatiotemporal feature discretization. Structural Health Monitoring. https://doi.org/10.1177/14759217261504002", "why": "航空エンジンの監視データの異常検知に、多スケールの時間畳み込みとグラフ注意でパラメータ間の関係を捉え、ベクトル量子化で正常時の表現を離散的な原型に制約する教師なしの方法を提案した。基準と変動の推定を動的に更新し、個体差と緩やかな性能の変化に対応する。模擬データと実機のデータで検証した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "航空エンジンの多数の監視データから、正常時の状態を離散的な「型」として学び、個体ごとの違いやゆっくりした変化に合わせながら異常を見つける教師なしの方法を示した。", "p3": "多スケールの時間畳み込みと適応的なグラフ注意ネットワークで、時間的な変化とパラメータ間の関係を捉える。ノード単位のベクトル量子化の層で、連続的な潜在特徴を離散的な原型に写し、再構成誤差から異常の得点を計算する。性能の基準と変動の推定は動的に更新する（抄録）。", "p5": "模擬データと実機のデータでの実験で、比較した方法より信頼できる検知結果と、個体をまたぐ適応力の強さを示したと報告する。抄録に数値は示されていない（抄録）。", "fun": "航空エンジンの監視データから異常の兆しを探すとき、エンジンには個体ごとの違いがあり、性能も少しずつ変わるので、「正常」の基準は固定しにくい。この研究は、正常な状態をいくつかの代表的な型にまとめて覚えさせ、基準を更新しながら、うまく再現できない動きを異常とみなす。異常の例を教えなくても学べる点が強みだ。", "unverified": "検知の成績の数値、データの規模、比較した方法は抄録になく未確認。"}}, {"id": "jn37", "rank": 37, "field": "環境・気候政策", "headline": "都市拡大の予測のずれが森林減少の見通しを揺らす", "title": "Disagreements in global urban growth projections amplify uncertainties in deforestation and carbon emissions", "url": "https://doi.org/10.1038/s41467-026-79543-0", "authors": "Xia Liao ほか", "venue": "Nature Communications", "date": "2026-11-26", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Liao, X., van Vliet, J., Zhou, Y., Liu, Y., Correa-Cano, M. E., Mangani, R., Anders, S., Yaro, J. A., & Zheng, Q. (2026). Disagreements in global urban growth projections amplify uncertainties in deforestation and carbon emissions. Nature Communications. https://doi.org/10.1038/s41467-026-79543-0", "why": "同じ社会経済シナリオでも異なる6つの世界の都市拡大の予測を比べ、2100年までの拡大の規模と場所に大きな食い違いがあることを示した。食い違いは、森林の直接の転換と耕地の移転を通じて増幅され、都市化による森林減少は175万〜491万km²、関連する排出は29〜76ギガトンCO2の幅になる。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "世界の都市がこの先どこまで広がるかの予測が研究ごとに大きく食い違い、その食い違いが森林の減少と炭素排出の見通しの不確かさを増幅していることを示した。", "p3": "同じ社会経済シナリオのもとでも異なる6つの都市拡大の予測をまとめ、2100年までの拡大の規模と場所を比べた。森林の直接の転換と、失われた生産を他の場所の耕地の拡大で補うという仮定のもとでの耕地の移転を通じた影響を見積もった（抄録）。", "p5": "都市化による森林減少はデータ間で1.75〜4.91百万km²の幅があり、関連する排出は2100年までに29〜76 GtCO2の幅になった。100か国で、この幅は無条件の国別の削減目標の排出枠の平均3%に当たり、特定の国では26%に達した（抄録）。", "fun": "街が広がると、そのぶん森や畑が失われる。失われた畑を補うために、別の場所の森が切り開かれることもある。では、今世紀の終わりまでに世界の街はどれだけ広がるのか。この研究が6つの予測を比べると、広がる規模も場所も大きく食い違っていた。その違いは、森の減り方と排出の見積もりに増幅されて響く。1つの予測だけに頼ると危うい、という教訓になる。", "unverified": "6つの予測の名前、国別の内訳は抄録になく未確認。"}}, {"id": "jn38", "rank": 38, "field": "環境・気候政策", "headline": "大雨への温暖化の寄与をほぼ即時に見積もる枠組み", "title": "A multi-method framework for attributing precipitation to anthropogenic climate change in near real time", "url": "https://doi.org/10.1088/2752-5295/aec6ca", "authors": "Joseph Giguere ほか", "venue": "Environmental Research: Climate", "date": "2026-11-25", "sjr": 1.798, "citescore": 7.2, "citescore_year": "2025", "apa": "Giguere, J., Dahl, K., Mares, B., Labe, Z. M., & Gilford, D. M. (2026). A multi-method framework for attributing precipitation to anthropogenic climate change in near real time. Environmental Research: Climate. https://doi.org/10.1088/2752-5295/aec6ca", "why": "極端な事例だけでなく、雨の降った日の降水量の全範囲について、人為的な気候変動の寄与を評価する方法を作り、世界規模でほぼリアルタイムに運用できることを目指した。4つの事例の詳細な分析と、6大陸・11種類の災害にわたる170超の最近の降水事例の自動分析で有効性を示す。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "大雨の事例ごとに、その雨に人為的な気候変動がどれだけ寄与したかを、ほぼリアルタイムで世界規模に評価する方法を作り、多数の事例で試した。", "p3": "要因分析の標準的な手順にもとづき、極端な事例だけでなく、雨の降った日の降水量の全範囲について気候変動の寄与を評価する複数手法の枠組みを作った。4つの事例を詳しく分析し、170を超える最近の影響の大きい降水事例を自動で分析した（抄録）。", "p5": "6大陸・11種類の降水に関わる災害にわたる事例のうち、気候変動が発生の可能性を高めた可能性が高い、または非常に高いものは約35%、強度を高めた可能性が高い、または非常に高いものは約45%だった（抄録）。", "fun": "大雨の災害のたびに「これは気候変動のせいか」が問われる。この研究は、事例が起きている最中にその問いに答えられる仕組みを目指している。170を超える事例に当てはめると、気候変動が雨を強めた可能性が高いと言えるものは約45%だった。すべてを気候変動に結びつけるのではなく、事例ごとに区別して言えるようになる点が大事だ。", "unverified": "手法の詳細（使う気候モデルと観測）、事例の選び方の基準は抄録の範囲では未確認。"}}, {"id": "jn39", "rank": 39, "field": "交通・都市計画", "headline": "排出を考慮した柔軟路線バスの運行を厳密に解く", "title": "Emission-aware operations of flex-route transit vehicles: An exact logic-based Benders decomposition algorithm", "url": "https://doi.org/10.26599/commtr.2026.9640076", "authors": "Shuiwang Chen ほか", "venue": "Communications in Transportation Research", "date": "2026-11-25", "sjr": 1.97, "citescore": 13.6, "citescore_year": "2025", "apa": "Chen, S., Li, M., & WU, L. (2026). Emission-aware operations of flex-route transit vehicles: An exact logic-based Benders decomposition algorithm. Communications in Transportation Research. https://doi.org/10.26599/commtr.2026.9640076", "why": "定時の停留所を骨格に、需要に応じた乗降を組み合わせる柔軟路線の交通で、車両の割り当て・乗客の順序・容量・時間枠・区間の速度を同時に決める排出量を考慮した運行計画を定式化した。経路の選択と車両ごとの速度の部分問題を分ける論理ベースのベンダーズ分解を開発し、小規模な問題では既存の解法より数百倍速く最適解を得た。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "決まった停留所を回りつつ需要に応じた乗り降りにも対応する柔軟路線の交通の運行計画を、排出量まで考慮して厳密に最適化する解法を作った。", "p3": "車両の割り当て、乗客の順序、容量、時間枠、区間ごとの速度を同時に決める問題を定式化した。経路の選択と、車両ごとの速度の部分問題を分ける論理ベースのベンダーズ分解を開発し、速度と排出の関係の区分線形の限界などで主問題を強化した（抄録）。", "p5": "小規模な問題ではすべて最適に解け、難しい小規模の問題では混合整数二次錐計画の約490倍、基本の分解法の270倍速かった。大規模な問題では最適性のギャップの平均を0.57%に下げた（比較対象は6.47%と9.26%）。距離にもとづく従来の経路決定に比べ、排出を最大30%減らせる（抄録）。", "fun": "需要に応じて寄り道もする路線の交通は便利だが、どの車がどの順に誰を乗せ、どの区間をどの速さで走るかを決めるのは、組み合わせが多くて難しい。この研究は、問題を「経路を決める部分」と「速さを決める部分」に分けて解く方法を作った。距離だけで経路を決める従来のやり方に比べ、排出を最大30%減らせるという。解き方の工夫が環境の改善につながる。", "unverified": "問題の規模（車両数・乗客数）、排出の計算式は抄録になく未確認。"}}, {"id": "jn40", "rank": 40, "field": "交通・都市計画", "headline": "ドローン災害救援の拠点・在庫・機体を一体で計画", "title": "Integrated Planning of Drone-Based Disaster Relief: Facility Location, Inventory Prepositioning, and Fleet Operations Under Uncertainty", "url": "https://doi.org/10.1287/trsc.2025.0518", "authors": "Yuyang Ma ほか", "venue": "Transportation Science", "date": "2026-11-25", "sjr": 2.371, "citescore": 10.0, "citescore_year": "2025", "apa": "Ma, Y., Shehadeh, K. S., & Tsang, M. Y. (2026). Integrated Planning of Drone-Based Disaster Relief: Facility Location, Inventory Prepositioning, and Fleet Operations Under Uncertainty. Transportation Science. https://doi.org/10.1287/trsc.2025.0518", "why": "ドローンによる災害救援について、拠点の立地、救援物資の事前配置、機体数、拠点と需要地への割り当てを第1段階で同時に決め、第2段階で配送計画と機体の再割り当てを決める2段階のロバスト最適化を示した。拠点の被災、需要、機体の稼働、備蓄の残存率の関係を捉える不確実性の集合を使う。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "災害時にドローンで救援物資を届ける計画について、拠点の場所、物資の事前の備蓄、ドローンの数と割り当てを、不確実な被害を見込んで一体で決める最適化の枠組みを示した。", "p3": "2段階のロバスト最適化を使う。第1段階で拠点の立地、備蓄量、機体数、割り当てを同時に決め、第2段階で配送計画とドローンの再割り当てを決める。拠点の被災、需要、ドローンの稼働、備蓄の残存率の関係を表す不確実性の集合を置き、K適応性の近似と列・制約生成法で解く（抄録）。", "p5": "計算を速める工夫（効率的な初期解、対称性を破る制約、妥当不等式）を導入し、広範な数値実験で計算の効率を示したと報告する。抄録に数値は示されていない（抄録）。", "fun": "災害のときにドローンで救援物資を運ぶには、どこに拠点を置き、何をどれだけ置いておくかを、災害が起きる前に決めなければならない。しかも拠点そのものが被災するかもしれないし、備蓄の一部が使えなくなるかもしれない。この研究は、そうした不確実さを見込んでも破綻しにくい計画を、場所・在庫・機体の数をまとめて計算で求める方法を作った。", "unverified": "数値実験の規模と結果の数値、想定した災害の種類は抄録になく未確認。"}}, {"id": "jn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "女性CEOへの交代後、賃金差は高賃金層でだけ縮む", "title": "When a woman reaches the top: CEO succession and organizational gender inequality", "url": "https://doi.org/10.1016/j.leaqua.2026.102019", "authors": "Henrique Minetto Brabo ほか", "venue": "The Leadership Quarterly", "date": "2026-11-25", "citescore": 19.1, "citescore_year": "2025", "apa": "Brabo, H. M., Domingos, F. D., & Arvate, P. R. (2027). When a woman reaches the top: CEO succession and organizational gender inequality. The Leadership Quarterly, 38(1), 102019. https://doi.org/10.1016/j.leaqua.2026.102019", "why": "ブラジルの大企業433社の2003〜2017年の行政データで、男性から女性へのCEOの交代を、男性から男性への交代と比べた。部下の女性の賃金・昇進・離職の変化を賃金階層別に追うと、男女の賃金差は交代の4年目以降に高賃金層で縮まるが、中位では変わらず、昇進と離職には一貫した変化がなかった。著者は、この縮小は平行トレンドの仮定に敏感で、関連として読むべきだとする。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "男性から女性にCEOが交代したあと、組織内の女性の賃金・昇進・離職がどう変わるかを追い、変化は高賃金層の賃金差の縮小に限られることを示した。", "p3": "ブラジルの大企業433社の2003〜2017年の縦断的な行政データを使い、男性から女性へのCEOの交代を男性から男性への交代と比べる、時期のずれた差分の差分（二重頑健な推定量）で、部下の女性の賃金・垂直的な移動・離職を全体と賃金五分位別に調べた（抄録）。", "p5": "男女の賃金差は、交代後4年目から最上位の所得層で縮まったが、賃金分布の中ほどでは変わらないか、一部の年でわずかに広がった。昇進と離職には一貫した変化がなかった。著者は、縮小の因果的な解釈は平行トレンドからのわずかなずれにも弱いとして、関連として読んでいる（抄録）。", "fun": "女性がトップになると、その会社で働く女性の待遇は良くなるのか。「変化を進める」とも「かえって他の女性と距離を置く」とも言われてきた。ブラジルの大企業433社を追ったこの研究の答えは、そのどちらでもなかった。変化が見えたのは賃金だけで、それも賃金の高い女性に集中していた。白か黒かではなく、「どこで、誰に」変化が起きるかを丁寧に描く姿勢が面白い。", "unverified": "賃金差の縮小の大きさ（数値）、対象の交代の件数は抄録になく未確認。"}}, {"id": "jn42", "rank": 42, "field": "経営学", "headline": "大手監査法人で定着と昇進の男女差が逆転", "title": "The reversal of gender disparities in the retention and promotion of Big Four auditors", "url": "https://doi.org/10.1007/s11142-026-10000-5", "authors": "Jade Huayu Chen ほか", "venue": "Review of Accounting Studies", "date": "2026-11-25", "sjr": 5.56, "citescore": 10.7, "citescore_year": "2025", "apa": "Chen, J. H., Hallman, N., & Sunder, J. (2026). The reversal of gender disparities in the retention and promotion of Big Four auditors. Review of Accounting Studies. https://doi.org/10.1007/s11142-026-10000-5", "why": "4大監査法人の一般の監査人15万人超のデータで、1990年代と2000年代には女性の定着率と昇進率が有意に低かったが、2010年代半ばに逆転し、現在は女性のほうが高いことを示した。3つの要因を検討すると、担当の監査パートナーの氏名を初めて公開したForm APの導入だけが、他を統制しても逆転を有意に予測した。Form APの影響を受けない職種では逆転が見られなかった。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "4大監査法人で、女性の監査人の定着率と昇進率が男性より低いという長年の状況が2010年代半ばに逆転したことを示し、監査の責任者の氏名を公開する制度がその逆転と結びついていることを示した。", "p3": "15万人超の一般の監査人のデータを使い、定着と昇進の男女差の推移を調べた。顧客の監査委員会の女性比率の上昇、顧客の多様性の重視、監査の責任パートナーの氏名を初めて公開したForm APの導入という3つの要因を検討した（抄録）。", "p5": "1990年代と2000年代を通じて女性の定着率と昇進率は有意に低かったが、2010年代半ばに逆転し、現在は女性のほうが高い。3つの要因のうち、他を統制しても逆転を有意に予測したのはForm APだけだった。Form APの影響を受けない職種では逆転が見られず、税務部門では遅れて現れた（抄録）。", "fun": "大手の監査法人は長い間、女性が辞めやすく昇進しにくい職場だと言われてきた。ところが2010年代の半ばから、女性のほうが辞めにくく昇進しやすくなっていた。その逆転と結びついていたのは、「この監査の責任者は誰か」を名前で公表するという制度だった。誰が責任者なのかが外から見えるようになると、組織の行動が変わるらしい、という点が面白い。", "unverified": "逆転の大きさの数値、データの出所と期間の詳細は抄録になく未確認。"}}, {"id": "jn43", "rank": 43, "field": "経済学", "headline": "納付する側を替えて付加価値税の順守を改善", "title": "Improving VAT compliance by switching who remits the tax: Evidence from construction firms", "url": "https://doi.org/10.1016/j.jpubeco.2026.105831", "authors": "Juho Junttila ほか", "venue": "Journal of Public Economics", "date": "2026-11-26", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Junttila, J., Koivisto, A., & Nivala, A. (2026). Improving VAT compliance by switching who remits the tax: Evidence from construction firms. Journal of Public Economics, 264, 105831. https://doi.org/10.1016/j.jpubeco.2026.105831", "why": "付加価値税の脱税対策として、納付の義務を売り手から買い手に移すリバースチャージ方式が使われている。フィンランドが2011年に建設業に導入した事例を、全企業の税務申告データと差分の差分で調べた。建設業の申告上の純納付額は、影響を受けない企業に比べて5%増えた。大企業に役務を提供する下請けの脱税を減らすのに有効でありうると示す（同じ題名の原稿の抄録による）。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexで題名から見つかった同じ題名の原稿の抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "付加価値税を納める義務を売り手から買い手に移すだけで、脱税の危険が高い建設業の申告税額が増えることを、フィンランドの全企業のデータで示した。", "p3": "フィンランドが2011年に建設業に導入したリバースチャージ方式（納付の義務を売り手から買い手に移す仕組み）を、フィンランドの全企業の税務申告データを使い、影響を受けない企業と比べる差分の差分で分析した（抄録）。", "p5": "建設業の申告上の付加価値税の純納付額は、影響を受けない企業に比べて5%増えた。この納付の方式は、大企業に役務を提供する下請けによる脱税を減らすのに有効でありうると結論している（抄録）。", "fun": "付加価値税は、ふつう売った側が国に納める。でも売った側が納めなければ、取りはぐれる。そこで「買った側が代わりに納める」と決まりを変えたら、建設業の申告上の納付額が5%増えた。納める義務を負う人を入れ替えただけである。誰に納めさせるかという設計が、税の集まり方を変えるのが面白い。", "unverified": "出版版の本文と抄録は入手できず、OpenAlexに登録された原稿（作業論文版の可能性がある）の抄録にもとづく。出版版での数値、企業数は未確認。"}}, {"id": "jn44", "rank": 44, "field": "経済学", "headline": "大規模な現金給付の効果をモデルで予測", "title": "Predicting the effects of a large-scale cash transfer: Financial frictions, occupational choice, and local labor markets", "url": "https://doi.org/10.1016/j.jmoneco.2026.104033", "authors": "Francisco J. Buera ほか", "venue": "Journal of Monetary Economics", "date": "2026-11-26", "sjr": 6.262, "citescore": 6.2, "citescore_year": "2025", "apa": "Buera, F. J., Shin, Y., & Singh, K. (2026). Predicting the effects of a large-scale cash transfer: Financial frictions, occupational choice, and local labor markets. Journal of Monetary Economics, 104033. https://doi.org/10.1016/j.jmoneco.2026.104033", "why": "大規模な現金給付の効果を、金融の摩擦、職業の選択、地域の労働市場を取り入れて予測する論文である（題名の範囲。抄録は入手できていない）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけにもとづく", "preprint": false, "short": true, "p1": "大規模な現金給付の効果を、金融の摩擦、職業の選択、地域の労働市場を取り入れて予測する論文と読める（題名から）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "多くの世帯にまとまったお金を配ると、何が起きるだろう。借り入れの難しさが和らいで仕事の選び方が変わる 証", "title": "Weakly Supervised Contrastive Learning: Tackling Imprecise Labels with Theoretical Guarantees", "url": "https://doi.org/10.1109/tpami.2026.3757223", "authors": "Tong Wei ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-24", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Wei, T., Wang, J.-J., Zhou, Z.-H., & Zhang, M.-L. (2026). Weakly Supervised Contrastive Learning: Tackling Imprecise Labels with Theoretical Guarantees. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–12. https://doi.org/10.1109/tpami.2026.3757223", "why": "注釈があいまい・不正確で、ラベルが2つの例の同じクラスへの所属を確実には示さない場合の対照学習を扱う。正例・負例の二分を、2つの例が同じクラスである確率の連続値の推定に置き換え、例を頂点、意味的な類似度を辺の重みとするグラフの枠組みを作った。緩い条件のもとで完全な教師ありの表現に近づく誤差の上界を導き、ノイズのあるラベルなど4つの弱教師の設定で一貫した改善を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "ラベルがあいまい・不正確なときにも使える対照学習の枠組みを作り、完全な教師ありに近い表現が学べることを理論的に保証した。", "p3": "「同じクラスか違うクラスか」の二分を、2つの例が同じクラスである確率の連続値の推定（連続的な意味的類似度）に置き換える。例を頂点、類似度を辺の重みとするグラフ理論的な枠組みを作り、複数の種類の弱い教師に適用できるようにした（抄録）。", "p5": "緩い条件のもとで、学習された表現が完全な教師ありで得られる表現に近づくことを示す誤差の上界を導いた。ノイズのあるラベル、部分ラベル、半教師あり、ノイズのある部分ラベルの4つの設定で一貫した改善を示した（抄録）。", "fun": "AIに「同じ種類のものを近くに、違う種類のものを遠くに」と教える学習法がある。でも正解の札があいまいだったり間違っていたりすると、どれが同じ種類なのかが分からなくなる。この研究は、同じか違うかをはっきり決める代わりに「同じ種類である確率」という連続的な値を使う。あいまいさをあいまいなまま扱うことで、札が完全な場合に近い学習ができるという。", "unverified": "改善の数値、使ったデータセットは抄録になく未確認。"}}, {"id": "jn49", "rank": 49, "field": "機械学習", "headline": "オフライン強化学習のベルマン不整合を抑える", "title": "Bellman-Inconsistency Mitigation for Offline Reinforcement Learning", "url": "https://doi.org/10.1109/tpami.2026.3757599", "authors": "Longyang Huang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-25", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Huang, L., Dong, B., Pang, N., Liu, R., & Zhang, W. (2026). Bellman-Inconsistency Mitigation for Offline Reinforcement Learning. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–14. https://doi.org/10.1109/tpami.2026.3757599", "why": "オフライン強化学習におけるベルマン方程式の不整合を緩和する方法を扱う論文である（題名の範囲。抄録は入手できていない）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけにもとづく", "preprint": false, "short": true, "p1": "オフライン強化学習（あらかじめ集めたデータだけから方策を学ぶ方法）で生じるベルマン方程式の不整合を緩和する方法の論文と読める（題名から）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "試行錯誤をせず、過去に集めた記録だけから上手なやり方を学ぶのがオフライン強化学習だ。強化学習は、今の価値と次の価値を結ぶ関係式を手がかりに学ぶ。題名から読み取れるのは、その関係式の食い違いをどう抑えるかという問いだ。手持ちの記録だけから学ぶことの根本の難しさに関わる。", "unverified": "抄録・本文を入手できず、方法、データ、結果はすべて未確認。"}}, {"id": "jn50", "rank": 50, "field": "機械学習", "headline": "道具を使うAIエージェントの評価基準GTA-2", "title": "GTA-2: Benchmarking General Tool Agents from Atomic Tool-Use to Open-Ended Workflows", "url": "https://doi.org/10.1109/tpami.2026.3757582", "authors": "Jize Wang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-25", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Wang, J., Liu, X., Li, Y., Zhang, S., Wang, Y., Shan, Z., Le, X., Chen, C., Guan, X., & Tao, D. (2026). GTA-2: Benchmarking General Tool Agents from Atomic Tool-Use to Open-Ended Workflows. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–18. https://doi.org/10.1109/tpami.2026.3757582", "why": "汎用のツール利用エージェントを、短い閉じた課題（GTA-Atomic）から、長く自由度の高い実務の流れ（GTA-Workflow）まで評価する階層的なベンチマーク。実際の利用者の問い、稼働中のツール、マルチモーダルな文脈を使う。目標を検証可能な下位目標に分ける再帰的なチェックポイント方式で評価する。最先端のモデルも単発の課題で50%を下回り、作業の流れでは最良でも成功率14.39%にとどまった。", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "道具を使うAIエージェントを、単発の道具の操作から、長く自由度の高い実務の作業の流れまで段階的に評価するベンチマークを作り、最先端のモデルでも作業の流れではほとんど成功しないことを示した。", "p3": "実際の利用者の問い、稼働中のツール、マルチモーダルな文脈を使う。短い閉じた課題のGTA-Atomicと、長く開いた課題のGTA-Workflowからなる。開いた成果物は、目標を検証可能な下位目標に分ける再帰的なチェックポイント方式で評価する（抄録）。", "p5": "最先端のモデルは単発の課題でも50%を下回り、作業の流れでは最良のモデルでも成功率は14.39%だった。チェックポイントにもとづくフィードバックは成績を上げ、ManusやOpenClawのような実行の枠組みは作業の完了を大きく高めた（抄録）。", "fun": "いくつもの道具を使い分けながら、まとまった仕事をやり遂げる。それをAIはどこまでできるのか。この研究は、道具を使う短い課題と、手順をつなぐ長い仕事の両方でAIを試した。短い課題でも50%に届かず、長い仕事では最良でも14.39%しか成功しなかった。面白いのは、モデルそのものだけでなく、作業の進め方を支える実行の枠組みで成績が大きく変わった点だ。", "unverified": "評価したモデルの一覧、課題の数は抄録になく未確認。"}}], "data_related": [{"rank": 1, "headline": "車軸箱加速度の模擬データで軌道の劣化検知を試す", "title": "Data underlying the publication: WaveletInception Networks for Drive-by Vibration-Based Infrastructure Health Monitoring", "url": "https://doi.org/10.4121/8d6245b5-2d81-436f-896c-83a78e22d213.v2", "authors": "Reza Riahi Samani", "venue": "4TU.ResearchData", "date": "2026-11-25", "apa": "Riahi Samani, R. (2026). Data underlying the publication: WaveletInception Networks for Drive-by Vibration-Based Infrastructure Health Monitoring (Version 2) [Dataset]. 4TU.ResearchData. https://doi.org/10.4121/8D6245B5-2D81-436F-896C-83A78E22D213.V2", "summary": "論文「WaveletInception Networks for Drive-by Vibration-Based Infrastructure Health Monitoring」の基礎データ。車両と軌道の相互作用モデル（レールとまくらぎを梁、道床と軌道パッドをばねとダンパ、車輪を剛体質量、接触をヘルツばねで表す）で、走行速度35・50・65・80・90km/hの車軸箱加速度を、剛性の低下を考慮して模擬した生データ。形式は.h5。CC BY 4.0。関連論文は説明文に記載あり。", "kind": "data", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"rank": 2, "headline": "実橋3橋の公開データで端末上の異常検知を再現", "title": "Edge-Computing Reference Architecture for Real-Time Structural Health Monitoring: reference implementation and public-data validation", "url": "https://doi.org/10.5281/zenodo.24517853", "authors": "Yan, Peidong", "venue": "Zenodo", "date": "2026-11-24", "apa": "Yan, P. (2026). Edge-Computing Reference Architecture for Real-Time Structural Health Monitoring: reference implementation and public-data validation (Version v1.0.0) [Computer software]. Zenodo. https://doi.org/10.5281/ZENODO.24517853", "summary": "論文「An Edge-Computing Reference Architecture for Real-Time Structural Health Monitoring」の参照実装。ダウンロード用スクリプト、設定、検知器、学習の設定、窓ごとの出力と診断を含み、論文の数値はKW51（ルーヴェン）・ヴェーネルスボリ・シヨンの3橋の公開監視データから再生成される。規模・形式は記載なし。Apache-2.0。関連論文のDOIは記     sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
